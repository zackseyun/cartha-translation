  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Οἱ δὲ στρατιῶται ἀπήγαγον αὐτὸν ἔσω τῆς αὐλῆς, ὅ ἐστιν πραιτώριον, καὶ συγκαλοῦσιν ὅλην τὴν σπεῖραν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/016.yaml
  text: Then the soldiers led him inside the courtyard[a], which is the praetorium[b], and they call together the whole cohort.
translation:
  language: tl
  text: Pagkatapos, dinala siya ng mga kawal sa loob ng patyo—na siyang Pretorio[a]—at ipinatawag nila ang buong kohorte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Pretorio ay ang punong himpilan o opisyal na tirahan ng Romanong gobernador.
    reason: cultural_note
  - marker: b
    text: Ang “kohorte” ay isang yunit ng hukbong Romano; dito, tumutukoy ito sa pangkat ng mga kawal na nagtipon sa ilalim ng kapangyarihang Romano.
    reason: cultural_note
lexical_decisions:
- source_word: Οἱ δὲ
  choice: Pagkatapos
  rationale: Ipinapakita ng δέ ang pagpapatuloy ng salaysay, hindi isang matinding pagsalungat; natural sa Filipino ang “Pagkatapos.”
- source_word: στρατιῶται
  choice: mga kawal
  rationale: Tuwirang tumutukoy ito sa mga sundalong Romano; dignified at madaling maunawaan ang “mga kawal.”
- source_word: ἀπήγαγον
  choice: dinala
  rationale: Ipinahihiwatig ng pandiwa ang pag-akay o pagdadala sa isang tao, at malinaw na ibinibigay ng kasunod na parirala ang patutunguhan.
- source_word: ἔσω τῆς αὐλῆς
  choice: sa loob ng patyo
  rationale: Pinananatili nito ang tiyak na diwang panlunan ng ἔσω at ang karaniwang kahulugan ng αὐλή bilang patyo ng isang gusali o opisyal na tirahan.
- source_word: ὅ ἐστιν πραιτώριον
  choice: na siyang Pretorio
  rationale: Pinananatili ang makasaysayang terminong Romano at ang paliwanag na ugnayan ng sugnay; nililinaw sa talababa ang gamit nito rito.
- source_word: συγκαλοῦσιν
  choice: ipinatawag nila
  rationale: Ipinapahayag nito ang pagpapatawag upang magtipon. Hindi likas sa Filipino ang biglang paglipat sa makasaysayang pangkasalukuyan, kaya ginamit ang aspektong tugma sa daloy ng salaysay.
- source_word: ὅλην τὴν σπεῖραν
  choice: ang buong kohorte
  rationale: Ang σπεῖρα ay teknikal na katawagan sa isang yunit ng hukbong Romano. Pinananatili ng “kohorte” ang makasaysayang katiyakan nang hindi ito pinapalitan ng makabagong yunit militar.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mga terminong makasaysayang “Pretorio” at “kohorte,” na ipinaliwanag sa mga talababa para sa karaniwang mambabasa.
