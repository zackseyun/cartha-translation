  text: καὶ ἐδίδουν ⸀αὐτῷ ἐσμυρνισμένον οἶνον, ⸀ὃς δὲ οὐκ ἔλαβεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/023.yaml
  text: And they were giving him wine mixed with myrrh[b][a], but he did not take it.
translation:
  language: tl
  text: At binibigyan nila siya ng alak na hinaluan ng mira[a], ngunit hindi niya ito tinanggap.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “alak na nilagyan ng mira.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίδουν
  choice: binibigyan nila
  rationale: Ang aspektong imperpektibo ay nagpapahiwatig ng nagpapatuloy o tinatangkang pagbibigay. Pinananatili ng “binibigyan nila” ang aspektong ito at ang tuwirang diwa ng δίδωμι; maaari rin itong unawain bilang pag-aalok ayon sa konteksto.
- source_word: ἐσμυρνισμένον οἶνον
  choice: alak na hinaluan ng mira
  rationale: Malinaw at natural itong salin ng alak na inihanda o nilagyan ng mira. Ang “alak” ay karaniwang katawagan sa Filipino, habang nililinaw ng parirala ang sangkap na idinagdag.
- source_word: ὃς δὲ
  choice: ngunit hindi niya
  rationale: Bagaman pormal na panghalip na pamanggit ang ὃς, ginagamit ito rito bilang muling pagtukoy kay Jesus. Natural na ipinahahayag sa Filipino ng “ngunit ... niya” ang pagtukoy at ang banayad na pagsalungat ng δέ.
- source_word: ἔλαβεν
  choice: tinanggap
  rationale: Sa kontekstong may inihahain o ibinibigay na inumin, natural na katumbas ng λαμβάνω ang “tinanggap.” Ang “ito” ay hayagang tumutukoy sa alak bagaman ipinahihiwatig lamang ang layon sa Griyego.
theological_decisions:
- issue: Dahilan ng hindi pagtanggap ni Jesus sa inumin
  choice: Ilarawan lamang na hindi niya ito tinanggap, nang walang idinagdag na dahilan.
  alternative: Ipaliwanag na tinanggihan niya ang pampamanhid o isang kaugaliang inumin.
  rationale: Hindi sinasabi ng talata kung bakit hindi niya tinanggap ang alak na may mira. Hindi dapat ipasok sa salin ang paliwanag na hindi tahasang nasa Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mira,” ang karaniwang anyo ng pangalan ng sangkap sa mga saling biblikal, at iniwasan ang lipas o sobrang teknikal na pananalita.
