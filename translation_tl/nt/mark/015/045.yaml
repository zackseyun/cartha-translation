  yaml_path: translation/nt/mark/015/045.yaml
  text: And after learning from the centurion[a], he granted the body to Joseph.
translation:
  language: tl
  text: At nang malaman niya mula sa senturyon, ipinagkaloob niya kay Jose ang bangkay.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνοὺς
  choice: matapos niyang malaman iyon
  rationale: Ang aorist participle ay temporal at nagpapakitang ginawa ni Pilato ang sumunod na kilos matapos niyang matiyak ang iniulat na pagkamatay. Idinagdag ang “iyon” bilang likas na layon sa Filipino, na tumutukoy sa impormasyong nasa naunang konteksto.
- source_word: ἀπὸ τοῦ κεντυρίωνος
  choice: mula sa senturyon
  rationale: Ang ἀπό na may genitive ay tumutukoy sa pinagmulan ng impormasyon. Pinanatili ang makasaysayang tiyak na katawagang “senturyon.”
- source_word: ἐδωρήσατο
  choice: ipinagkaloob
  rationale: Ipinahihiwatig ng δωρέομαι ang pagbibigay o pagpapahintulot bilang isang pabor; ang “ipinagkaloob” ay angkop sa opisyal na pahintulot ni Pilato na kunin ni Jose ang bangkay.
- source_word: πτῶμα
  choice: bangkay
  rationale: Tuwirang tumutukoy ang πτῶμα sa katawan ng isang patay. Likas at malinaw sa modernong Filipino ang “bangkay” at hindi nito ikinukubli ang tahasang kahulugan ng salitang Griyego.
- source_word: τῷ Ἰωσήφ
  choice: kay Jose
  rationale: Ang dative ay tumutukoy sa tumanggap ng ipinagkaloob ni Pilato.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “senturyon” para sa katumpakang pangkasaysayan at “bangkay” upang tuwirang katawanin ang πτῶμα. Ang panghalip na “niyang/niya” ay likas na tumutukoy kay Pilato mula sa konteksto.
