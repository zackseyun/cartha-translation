  yaml_path: translation/nt/mark/015/003.yaml
  text: And the chief priests were accusing him of many things[a].
translation:
  language: tl
  text: At patuloy siyang pinararatangan ng mga punong pari tungkol sa maraming bagay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas pormal, “naghaharap sila ng maraming paratang laban sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang payak na pang-ugnay at tuloy-tuloy na daloy ng salaysay ni Marcos.
- source_word: κατηγόρουν
  choice: patuloy siyang pinararatangan
  rationale: Ipinahahayag ng imperpektong anyo ang nagpapatuloy o paulit-ulit na pagpaparatang noon; natural itong naipakikita sa Filipino sa pamamagitan ng “patuloy” at aspektong imperpektibo.
- source_word: αὐτοῦ
  choice: siyang
  rationale: Ang henitibo kasunod ng κατηγορέω ay tumutukoy sa taong pinararatangan; isinama ito bilang pokus ng pandiwang Filipino.
- source_word: οἱ ἀρχιερεῖς
  choice: ang mga punong pari
  rationale: Karaniwang tawag ito sa mga pangunahing pinunong makasaserdote, at hindi nagpapahiwatig na maraming sabay-sabay na may katungkulan bilang kataas-taasang pari.
- source_word: πολλά
  choice: tungkol sa maraming bagay
  rationale: Pinananatili ang malawak at di-tiyak na saklaw ng mga paratang nang hindi ito nililimitahan sa pormal na mga sakdal.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “patuloy” upang maging lantad ang duratibong diwa ng imperpektong Griyego, habang pinanatili ng “maraming bagay” ang di-tiyak na lawak ng πολλά.
