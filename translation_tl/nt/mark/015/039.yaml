  text: ἰδὼν δὲ ὁ κεντυρίων ὁ παρεστηκὼς ἐξ ἐναντίας αὐτοῦ ὅτι ⸀οὕτως ἐξέπνευσεν εἶπεν· Ἀληθῶς ⸂οὗτος ὁ ἄνθρωπος⸃ υἱὸς ⸂θεοῦ ἦν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/039.yaml
  text: When the centurion[a], who was standing opposite him, saw that he breathed his last in this way, he said, “Truly this man was God's Son.”
translation:
  language: tl
  text: Nang makita ng senturyon na nakatayo sa tapat niya na sa ganitong paraan siya nalagutan ng hininga, sinabi niya, “Tunay ngang ang taong ito ay Anak ng Diyos.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ang taong ito ay isang anak ng Diyos.” Maaaring unawain ang pariralang Griyego bilang naglalarawan ng katangian o bilang di-tiyak, ngunit sa konteksto ng Marcos malamang na taglay nito ang puwersa ng titulong “Anak ng Diyos.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: Nang makita
  rationale: Ginawang temporal ang aorist participle na ἰδών. Hindi na tahasang isinalin ang mahinang pang-ugnay na δέ upang maging natural ang daloy sa Filipino.
- source_word: κεντυρίων
  choice: senturyon
  rationale: Karaniwang salin sa Filipino para sa tiyak na ranggong militar na Romano; higit na eksakto kaysa pangkalahatang “opisyal na Romano.”
- source_word: ὁ παρεστηκὼς ἐξ ἐναντίας αὐτοῦ
  choice: na nakatayo sa tapat niya
  rationale: Pinananatili ang kalagayang ipinahihiwatig ng perfect participle at ang puwestong kaharap o katapat ni Jesus.
- source_word: ὅτι οὕτως ἐξέπνευσεν
  choice: na sa ganitong paraan siya nalagutan ng hininga
  rationale: Ang “nalagutan ng hininga” ay natural at marangal na idyomang Filipino para sa ἐξέπνευσεν, habang pinananatili ng “sa ganitong paraan” ang οὕτως at ang pagtukoy sa paraan ng pagkamatay.
- source_word: Ἀληθῶς
  choice: Tunay ngang
  rationale: Nagpapahayag ng mariin at taimtim na katiyakan nang natural sa modernong Filipino.
- source_word: οὗτος ὁ ἄνθρωπος
  choice: ang taong ito
  rationale: Direkta at natural na tumutukoy kay Jesus bilang partikular na tao.
- source_word: υἱὸς θεοῦ
  choice: Anak ng Diyos
  rationale: Pinananatili ang mahalagang katawagang kristolohikal sa Marcos nang hindi nagdaragdag sa Filipino ng hiwalay na pantukoy na katumbas ng Ingles na “the.”
- source_word: ἦν
  choice: ay
  rationale: Sa pangungusap na nominal sa Filipino, hindi kailangang magkaroon ng tahasang anyong pangnagdaan. Ang “ay Anak ng Diyos” ay natural at hindi rin binabago ang mismong pagkakakilanlang ipinahahayag ng Griyegong ἦν.
theological_decisions:
- issue: Lakas at katiyakan ng υἱὸς θεοῦ sa pahayag ng senturyon
  choice: Anak ng Diyos
  alternative: isang anak ng diyos
  rationale: Walang artikulo ang pariralang Griyego at maaari itong unawain bilang kwalitatibo o di-tiyak, ngunit sa salaysay ng Marcos malamang na umaalingawngaw ito bilang mahalagang titulong “Anak ng Diyos.” Ang pangunahing teksto ay nagbibigay ng malamang na puwersang pampanitikan, habang inilalahad sa talababa ang tunay na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “senturyon” bilang tumpak na katawagang historikal at “nalagutan ng hininga” upang mapanatili ang matingkad ngunit idiomatikong paglalarawan sa pagkamatay.
