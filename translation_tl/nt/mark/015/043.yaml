id: MRK.15.43
reference: Mark 15:43
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀ἐλθὼν Ἰωσὴφ ⸀ὁ ἀπὸ Ἁριμαθαίας εὐσχήμων βουλευτής, ὃς καὶ αὐτὸς ἦν προσδεχόμενος τὴν βασιλείαν τοῦ θεοῦ, τολμήσας εἰσῆλθεν πρὸς ⸀τὸν Πιλᾶτον καὶ ᾐτήσατο τὸ σῶμα τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/043.yaml
  text: Joseph of Arimathea[a], a respected council member who was himself also waiting for the kingdom of God[d][c][b], boldly went in to Pilate and asked for the body of Jesus.
translation:
  language: tl
  text: Dumating si Jose na taga-Arimatea, isang iginagalang na miyembro ng konseho[a] na siya rin mismo ay umaasa sa kaharian ng Diyos. Naglakas-loob siyang pumasok upang humarap kay Pilato[b] at hiningi ang katawan ni Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “isang prominenteng” o “isang marangal na miyembro ng konseho.”
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, binibigyang-diin na naglakas-loob si Jose na pumasok at humarap kay Pilato.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: Dumating
  rationale: Ipinapahayag nang natural ang naunang kilos ng aorist participle at hindi ito isinasama nang palihim sa kasunod na pandiwa ng pagpasok.
- source_word: ὁ ἀπὸ Ἁριμαθαίας
  choice: na taga-Arimatea
  rationale: Ang “taga-Arimatea” ay likas at malinaw na modernong Tagalog para sa pinagmulan ni Jose, habang tuwirang sinasalamin ang ἀπό.
- source_word: εὐσχήμων βουλευτής
  choice: isang iginagalang na miyembro ng konseho
  rationale: Ang “iginagalang” ay naghahatid ng katayuan at mabuting reputasyon ng εὐσχήμων; ang “miyembro ng konseho” ay tumpak ngunit hindi labis na tinutukoy ang konseho bilang Sanhedrin.
- source_word: ὃς καὶ αὐτὸς
  choice: na siya rin mismo
  rationale: Pinananatili ang pagbibigay-diin ng καὶ αὐτός na si Jose ay personal ding kabilang sa mga naghihintay.
- source_word: ἦν προσδεχόμενος
  choice: ay naghihintay
  rationale: Ipinahihiwatig ng anyong periphrastic ang patuloy na paghihintay at pag-asam.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: sa kaharian ng Diyos
  rationale: Tuwiran at kinikilalang salin ng mahalagang parirala sa Ebanghelyo.
- source_word: τολμήσας
  choice: Naglakas-loob
  rationale: Malinaw na pinananatili ang diwa ng tapang at panganib sa paglapit ni Jose kay Pilato.
- source_word: εἰσῆλθεν πρὸς τὸν Πιλᾶτον
  choice: pumasok upang humarap kay Pilato
  rationale: Pinananatili ng “pumasok” ang εἰσῆλθεν, samantalang nililinaw ng “upang humarap” ang pagpasok sa kinaroroonan o presensiya ni Pilato nang hindi nagdaragdag ng tiyak na lokasyon.
- source_word: ᾐτήσατο τὸ σῶμα τοῦ Ἰησοῦ
  choice: hiningi ang katawan ni Jesus
  rationale: Natural na ipinapahayag ng “hiningi” ang kahilingan, at pinananatili ng “katawan” ang neutral at tuwirang katumbas ng σῶμα sa halip na gawing “bangkay.”
theological_decisions:
- issue: Pagkakakilanlan ng konsehong kinabibilangan ni Jose
  choice: miyembro ng konseho
  alternative: miyembro ng Sanhedrin
  rationale: Hindi tahasang pinangalanan ng βουλευτής ang Sanhedrin, bagaman malamang na iyon ang tinutukoy sa konteksto; kaya hindi idinaragdag ang mas tiyak na katawagan sa pangunahing teksto.
- issue: Diwa ng τολμήσας
  choice: Naglakas-loob siyang pumasok
  alternative: matapang siyang pumasok; matapos maglakas-loob, pumasok siya
  rationale: Pinananatili nito ang diin sa tapang ni Jose at ang posibleng panganib ng pagharap kay Pilato, nang hindi ginagawang mabigat o mekanikal ang pangungusap.
- issue: Pag-asam sa kaharian ng Diyos
  choice: siya rin mismo ay naghihintay sa kaharian ng Diyos
  alternative: siya rin ay umaasa sa pagdating ng kaharian ng Diyos
  rationale: Ang “naghihintay” ay nagpapanatili sa payak na larawan at patuloy na aspekto ng προσδεχόμενος; hindi tahasang idinaragdag ang “pagdating,” bagaman ipinahihiwatig iyon ng paghihintay.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “taga-Arimatea,” “miyembro ng konseho,” at “naglakas-loob” bilang likas na mga pahayag. Hinati sa dalawang pangungusap para luminaw ang mahabang serye ng paglalarawan at kilos, nang hindi binabago ang ugnayang lohikal ng teksto.
