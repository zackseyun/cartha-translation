  text: Καὶ οἱ παραπορευόμενοι ἐβλασφήμουν αὐτὸν κινοῦντες τὰς κεφαλὰς αὐτῶν καὶ λέγοντες· Οὐὰ ὁ καταλύων τὸν ναὸν καὶ ⸂οἰκοδομῶν ἐν τρισὶν ἡμέραις⸃,
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/029.yaml
  text: And those passing by were reviling him[a], shaking their heads and saying[b], “Aha! You who would tear down the temple and build it in three days,”
translation:
  language: tl
  text: At nilalait siya ng mga nagdaraan habang umiiling-iling sila at nagsasabi, “Aha! Ikaw na gigiba sa templo[a] at magtatayo nito sa loob ng tatlong araw,[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O mas tiyak, “santuwaryo.”
    reason: lexical_alternative
  - marker: b
    text: O “muling magtatayo nito sa loob ng tatlong araw.” Ang pandiwang Griego ay payak na “magtayo,” bagaman maaaring ipahiwatig ng konteksto ang muling pagtatayo.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραπορευόμενοι
  choice: mga nagdaraan
  rationale: Likas at maikli itong tumutukoy sa mga taong dumaraan sa lugar at pinananatili ang nagpapatuloy na kilos ng participle.
- source_word: ἐβλασφήμουν
  choice: nilalait
  rationale: Sa konteksto, tumutukoy ito sa mapang-abusong pananalita laban kay Jesus. Ang “nilalait” ay malinaw sa modernong Tagalog at hindi agad naglilimita sa teknikal na kahulugang “namumusong.”
- source_word: κινοῦντες τὰς κεφαλὰς αὐτῶν
  choice: Ipinapailing nila ang kanilang mga ulo
  rationale: Ipinahahayag ng idyoma ang panunuya. Natural sa Tagalog ang “ipinapailing ang ulo” at malinaw ang mapanlibak na kilos.
- source_word: Οὐὰ
  choice: Aha!
  rationale: Pinananatili nito ang biglang bulalas ng panunuya sa halip na gawing panaghoy o pormal na kapahamakan.
- source_word: ὁ καταλύων
  choice: Ikaw na gigiba
  rationale: Ang artikulo at participle ay ginagamit na parang tuwirang pagtawag. Ipinahahayag ng “gigiba” ang ipinaparatang na gagawin nang hindi dinaragdagan ang kahulugan.
- source_word: ναὸν
  choice: templo
  rationale: Ito ang karaniwan at madaling maunawaang salin sa kontekstong ito; inilalagay sa talababa ang mas tiyak na posibleng kahulugang santuwaryo.
- source_word: οἰκοδομῶν ἐν τρισὶν ἡμέραις
  choice: magtatayo nito sa loob ng tatlong araw
  rationale: Direktang isinasalin ang simpleng pandiwang “magtayo.” Hindi ginawang “muling magtatayo” sa pangunahing teksto, bagaman maaaring ipahiwatig iyon ng konteksto.
theological_decisions:
- issue: Tinutukoy ng sinabi tungkol sa templo
  choice: Isinalin nang tuwiran bilang paratang o parunggit ng mga nanunuya, nang hindi ipinapasok sa pangunahing teksto ang pagkakakilanlan ng templo sa katawan ni Jesus.
  alternative: Isalin nang mas interpretatibo upang ipahiwatig na katawan ni Jesus ang tinutukoy na templo.
  rationale: Inilalahad ni Marcos ang panunuya ng mga nagdaraan sa tagpo ng pagpapako. Dapat panatilihin ng salin ang pananaw ng salaysay at ang teolohikal na tensiyon sa halip na lutasin ito sa mismong talata.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “nilalait” sa halip na teknikal o mas lumang “namumusong,” at pinanatili ang “Aha!” bilang lantad na bulalas ng panunuya. Lahat ng marker ng talababa ay nasa pangunahing teksto.
