  text: ὁ δὲ Πιλᾶτος ἐθαύμασεν εἰ ἤδη τέθνηκεν, καὶ προσκαλεσάμενος τὸν κεντυρίωνα ἐπηρώτησεν αὐτὸν εἰ ⸀πάλαι ἀπέθανεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/044.yaml
  text: But Pilate was amazed that he had already died[a], and summoning the centurion, he asked him whether he had died already.
translation:
  language: tl
  text: Ngunit nagtaka si Pilato kung patay na siya, at ipinatawag niya ang senturyon at tinanong ito kung matagal na siyang patay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “kung kanina pa siya namatay.”
    reason: Ipinapakita ang alternatibong pagsasaling nakatuon sa naganap na pagkamatay (ἀπέθανεν), samantalang ang pangunahing salin ay natural na ipinahahayag ang aspektong “matagal nang patay” ng πάλαι sa Filipino.
lexical_decisions:
- source_word: ἐθαύμασεν
  choice: nagtaka
  rationale: Natural na ipinapahayag nito ang pagkagulat ni Pilato sa bilis ng pagkamatay ni Jesus, nang hindi gumagamit ng masyadong matinding salitang hindi hinihingi ng konteksto.
- source_word: εἰ ἤδη τέθνηκεν
  choice: na patay na siya
  rationale: Ang εἰ ay nagpapakilala ng di-tuwirang tanong na kasunod ng pagkagulat; sa Filipino, natural itong ihayag bilang dahilan ng pagtataka. Pinananatili ng “patay na” ang resultang kalagayang ipinahihiwatig ng perfect τέθνηκεν.
- source_word: προσκαλεσάμενος
  choice: ipinatawag niya
  rationale: Ipinahihiwatig ng participle na ipinatawag muna ni Pilato ang opisyal bago niya ito tinanong. Natural at malinaw ito sa modernong Filipino.
- source_word: κεντυρίωνα
  choice: senturyon
  rationale: Pinananatili nito ang tiyak na ranggong militar ng Roma at ang terminong nakasanayan sa saling biblikal sa Filipino.
- source_word: ἐπηρώτησεν αὐτόν
  choice: tinanong
  rationale: Direkta at natural na katumbas ito ng kilos na pagtatanong; malinaw sa konteksto na ang senturyon ang tinanong.
- source_word: εἰ πάλαι ἀπέθανεν
  choice: kung matagal-tagal na siyang namatay
  rationale: Ang πάλαι ay tumutukoy sa paglipas na ng ilang panahon bago ang pagtatanong, ngunit hindi kinakailangang napakatagal. Iniiwasan ng “matagal-tagal na” ang sobrang absolutong “matagal na” habang pinananatili ang temporal na diin.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “senturyon” upang mapanatili ang makasaysayang ranggo, at “matagal-tagal na” upang maipahayag ang πάλαι nang hindi nagpapahiwatig ng napakahabang panahon.
