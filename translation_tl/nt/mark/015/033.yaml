  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸂Καὶ γενομένης⸃ ὥρας ἕκτης σκότος ἐγένετο ἐφ’ ὅλην τὴν γῆν ἕως ὥρας ἐνάτης.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/033.yaml
  text: And when the sixth hour had come[b][a], darkness came over the whole land until the ninth hour.
translation:
  language: tl
  text: Nang dumating ang ikaanim na oras[b], nagdilim sa buong lupain[a] hanggang sa ikasiyam na oras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “buong daigdig.” Ang salitang Griyego ay maaaring mangahulugang “lupain” o “daigdig.”
    reason: alternative_reading
  - marker: b
    text: Ibig sabihin, mula bandang tanghali hanggang bandang alas tres ng hapon.
    reason: cultural_note
lexical_decisions:
- source_word: γενομένης ὥρας ἕκτης
  choice: Nang dumating ang ikaanim na oras
  rationale: Likas na ipinahahayag ng genitive absolute ang panahon. Pinananatili ang sinaunang paraan ng pagtukoy sa oras sa pangunahing teksto, habang nililinaw sa talababa ang katumbas nito sa makabagong oras.
- source_word: σκότος
  choice: nagdilim
  rationale: Ang pangngalang σκότος ay nangangahulugang dilim. Ang pandiwang “nagdilim” ay natural sa Filipino sa ganitong salaysay at, kasama ng ἐγένετο, malinaw na naghahayag na sumapit ang dilim.
- source_word: ἐγένετο
  choice: nagdilim
  rationale: Isinama ang pangyayaring ipinahahayag ng ἐγένετο sa natural na pandiwang Filipino na “nagdilim,” sa halip na gumamit ng mas literal ngunit mabigat na “nagkaroon ng dilim.”
- source_word: ἐφ’ ὅλην τὴν γῆν
  choice: sa buong lupain
  rationale: Maaaring tumukoy ang γῆ sa lupain o sa daigdig. Ang “buong lupain” ay angkop sa konteksto nang hindi ipinipilit na pandaigdigan ang saklaw; inilalagay sa talababa ang lehitimong alternatibo.
- source_word: ἕως ὥρας ἐνάτης
  choice: hanggang sa ikasiyam na oras
  rationale: Pinananatili nito ang paraan ng pagtukoy sa oras sa Griyego at tumutugma sa “ikaanim na oras”; nililinaw sa talababa ang tinatayang makabagong oras.
theological_decisions:
- issue: Saklaw ng γῆ sa dilim noong pagpapako sa krus
  choice: buong lupain
  alternative: buong daigdig
  rationale: Malawak ang kahulugan ng γῆ at maaaring mangahulugang “lupain” o “daigdig.” Hindi dapat tahimik na pagpasyahan ng salin kung lokal o pandaigdigan ang dilim, kaya ginamit sa teksto ang “lupain” at pinanatili sa talababa ang “daigdig.”
translation_notes:
  register: Modernong Filipino na natural at marangal. Pinanatili sa pangunahing teksto ang sinaunang pagbilang ng oras at ipinaliwanag ito sa talababa. Inilagay ang [b] pagkatapos ng “ikaanim na oras” at ang [a] pagkatapos ng “lupain” upang malinaw ang tinutukoy ng bawat talababa.
