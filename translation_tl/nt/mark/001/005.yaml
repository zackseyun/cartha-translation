source:
  edition: SBLGNT
  text: καὶ ἐξεπορεύετο πρὸς αὐτὸν πᾶσα ἡ Ἰουδαία χώρα καὶ οἱ Ἱεροσολυμῖται ⸂πάντες, καὶ ἐβαπτίζοντο⸃ ⸂ὑπ’ αὐτοῦ ἐν τῷ Ἰορδάνῃ ποταμῷ⸃ ἐξομολογούμενοι τὰς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/005.yaml
  text: And all the Judean countryside and all the people of Jerusalem were going out to him, and they were being baptized by him in the Jordan River, confessing their sins.
translation:
  language: tl
  text: At patuloy na nagtutungo noon sa kanya ang mga tao mula sa buong lupain ng Judea at ang lahat ng taga-Jerusalem, at binabautismuhan niya sila sa Ilog Jordan habang ipinagtatapat nila ang kanilang mga kasalanan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξεπορεύετο
  choice: patuloy na pumupunta
  rationale: Ipinapahayag ng imperpektong anyo ang nagpapatuloy o paulit-ulit na pagpunta sa nakaraang panahon; natural itong naihahatid ng “patuloy na pumupunta” sa Filipino.
- source_word: πᾶσα ἡ Ἰουδαία χώρα
  choice: ang mga tao mula sa buong lupain ng Judea
  rationale: Ang χώρα ay tumutukoy sa lupain o rehiyon. Idinagdag ang “mga tao mula sa” upang maging natural at malinaw sa Filipino na mga naninirahan, hindi ang mismong lupain, ang pumupunta.
- source_word: οἱ Ἱεροσολυμῖται πάντες
  choice: ang lahat ng taga-Jerusalem
  rationale: Ang Ἱεροσολυμῖται ay mga naninirahan sa Jerusalem; ang “taga-Jerusalem” ay kasalukuyan at likas na pananalita habang pinananatili ng “lahat” ang retorikal na lakas ng πάντες.
- source_word: ἐβαπτίζοντο
  choice: Binabautismuhan niya sila
  rationale: Ang aspektong imperpekto ay ipinahihiwatig ng anyong “binabautismuhan,” at ang semantikong pasibo ng Griyego ay natural na naihahatid sa aktibong pangungusap na ang tagaganap ay si Juan at ang tumatanggap ay “sila.”
- source_word: ὑπ’ αὐτοῦ
  choice: niya
  rationale: Pinananatili ang panghalip sa Griyego sa halip na tahasang idagdag ang pangalang Juan.
- source_word: ἐν τῷ Ἰορδάνῃ ποταμῷ
  choice: sa Ilog Jordan
  rationale: Tuwirang sinasalamin ang ποταμός at ginagamit ang karaniwang ayos ng pangalang heograpiko sa Filipino.
- source_word: ἐξομολογούμενοι
  choice: habang ipinapahayag
  rationale: Ang participle ay kasabay na kilos ng pagpapabautismo. Ang “ipinapahayag” ay malinaw na naghahatid ng hayagang pagkilala o pagtatapat nang hindi nagdaragdag ng ritwal na kahulugan.
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: kanilang mga kasalanan
  rationale: Natural na salin ng tuwirang layon at ng panghalip na paari.
theological_decisions:
- issue: Saklaw ng “lahat” sa Judea at Jerusalem
  choice: Panatilihin ang “buong” at “lahat” bilang retorikal na paglalahat
  alternative: Maraming tao mula sa Judea at Jerusalem
  rationale: Gumagamit ang Griyego ng πᾶσα at πάντες. Dapat mapanatili ang diin ng salaysay nang hindi ipinipilit na isa itong matematikal na pahayag na walang kahit isang eksepsiyon.
- issue: Kahulugan at paraan ng bautismo
  choice: Gamitin ang “binabautismuhan” nang hindi tinutukoy ang paraan o teolohikal na bisa
  alternative: inilulubog; hinuhugasan
  rationale: Iniulat ng talata ang gawain ngunit hindi nito tahasang nilulutas ang mga sumunod na denominasyonal na pagtatalo tungkol sa paraan o bisa nito.
- issue: Kaugnayan ng pagpapahayag ng mga kasalanan sa bautismo
  choice: Ipakitang kasabay ang mga kilos sa pamamagitan ng “habang”
  alternative: Ipakitang sanhi o kondisyon ng bautismo ang pagtatapat
  rationale: Ang kasalukuyang participle na ἐξομολογούμενοι ay malinaw na naglalarawan ng kasabay na kilos, ngunit hindi nito tahasang itinakda ang mas tiyak na sanhi, kondisyon, o sakramental na ugnayan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Hinati sa dalawang pangungusap upang maiwasan ang mabigat na pagkakabuhol ng mga sugnay. Ginamit ang “Judea,” “Jerusalem,” at “Ilog Jordan” bilang karaniwang anyo ng mga pangalang pantangi sa Bibliyang Filipino.
