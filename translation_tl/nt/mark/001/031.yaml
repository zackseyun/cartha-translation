  text: And coming near[a], he raised her up, taking her by the hand; and the fever left her, and she served them.
translation:
  language: tl
  text: Lumapit siya, hinawakan ang kamay ng babae, at ibinangon niya ang babae. Nawala ang lagnat ng babae, at naglingkod siya sa kanila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagsimula siyang maglingkod sa kanila.” Maaaring inilalarawan lamang ng imperfect na pandiwang Griyego ang patuloy niyang paglilingkod, ngunit sinusuportahan din ng konteksto na nagsimula siyang maglingkod agad bilang bunga ng paggaling.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: Pagkalapit niya
  rationale: Ipinahahayag ang naunang kilos ng aorist participle nang natural sa Tagalog, nang hindi dinaragdagan kung kanino siya lumapit.
- source_word: ἤγειρεν αὐτήν
  choice: ibinangon niya ang babae
  rationale: Pinananatili ng “ibinangon” ang tuwirang diwa ng ἐγείρω at ang posibleng alingawngaw nito sa iba pang gamit ng pandiwa, ngunit sa konteksto ay malinaw na pagbangon mula sa pagkakahiga ang tinutukoy.
- source_word: κρατήσας τῆς χειρός
  choice: hinawakan niya sa kamay ang babae
  rationale: Likas sa Tagalog ang “hinawakan sa kamay” para sa ιδyomang Griyego na nangangahulugang paghawak o pagkapit sa kamay bilang kasabay na paraan ng pagbangon sa kaniya.
- source_word: ἀφῆκεν αὐτὴν ὁ πυρετός
  choice: Nawala ang lagnat nito
  rationale: Ang ἀφίημι ay literal na “umalis/iniwan,” ngunit “nawala ang lagnat” ang malinaw at likas na pagpapahayag sa modernong Tagalog. Ang “nito” ay tumutukoy sa babae at umiiwas sa kalituhan ng sunod-sunod na “siya.”
- source_word: διηκόνει αὐτοῖς
  choice: pinagsilbihan niya sila
  rationale: Sa kontekstong pambahay, malinaw at karaniwan ang “pinagsilbihan” kaysa sa mas eklesiyastikong “nagministeryo.” Hindi tahasang idinaragdag sa pangunahing teksto ang ingressive na “nagsimula,” bagaman maaari itong ipahiwatig ng imperfect ayon sa konteksto.
theological_decisions:
- issue: Posibleng alingawngaw ng ἐγείρω sa pananalita tungkol sa muling pagkabuhay
  choice: ibinangon
  alternative: tinulungang bumangon
  rationale: Pinananatili ng “ibinangon” ang lakas at mas malawak na saklaw ng pandiwang Griyego, nang hindi ipinapakahulugan ang pangyayaring ito bilang muling pagkabuhay.
- issue: Aspekto ng imperfect na διηκόνει
  choice: pinagsilbihan niya sila
  alternative: nagsimula siyang maglingkod sa kanila
  rationale: Maaaring ilarawan lamang ng imperfect ang patuloy na paglilingkod, o sa konteksto ay ang pagsisimula nito bilang bunga ng paggaling. Hindi nilulutas nang sapilitan ang tunay na kalabuan; inilalagay ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “babae” bilang tahasang pantukoy sa tauhang binanggit sa naunang konteksto upang maiwasan ang malabong sunod-sunod na panghalip. Inilagay ang talababa sa “pinagsilbihan” sapagkat iyon ang salitang tinatalakay nito.
