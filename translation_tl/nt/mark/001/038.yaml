base_translation:
  language: en
  yaml_path: translation/nt/mark/001/038.yaml
  text: And he said to them[a], “Let us go elsewhere, to the neighboring towns, so that I may preach there also[b], for that is why I came out.”
translation:
  language: tl
  text: At sinabi niya sa kanila, “Magtungo tayo sa ibang dako—sa mga kalapit na bayan[a]—upang makapangaral din ako roon, sapagkat iyon ang dahilan kung bakit ako lumabas[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego na isinaling “mga bayan” ay maaaring tumukoy sa maliliit na pamayanan na nasa pagitan ng mga nayon at mga bayan.
    reason: lexical_alternative
  - marker: b
    text: O “sapagkat sa layuning ito ako lumabas.” Maaaring tumukoy ang parirala sa pag-alis ni Jesus sa kasalukuyang lugar, o sa mas malawak na layunin ng kaniyang paglabas upang mangaral.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄγωμεν
  choice: Pumunta tayo
  rationale: Hortatory subjunctive na likas isalin bilang paanyayang “Pumunta tayo”; pinananatili nito ang sama-samang pagkilos nang hindi nagdaragdag ng diwa.
- source_word: ἀλλαχοῦ
  choice: sa ibang lugar
  rationale: Natural at malinaw na katumbas ng adverb na nangangahulugang “sa ibang dako/lugar.”
- source_word: ἐχομένας
  choice: kalapit
  rationale: Ipinahahayag ang heograpikong diwa ng mga lugar na kasunod o nasa paligid.
- source_word: κωμοπόλεις
  choice: mga bayan
  rationale: Pinakamalinaw na karaniwang katawagan sa modernong Filipino; nililinaw sa talababa na maaari itong tumukoy sa maliliit na pamayanang nasa pagitan ng nayon at bayan.
- source_word: ἵνα καὶ ἐκεῖ κηρύξω
  choice: upang makapangaral din ako roon
  rationale: Pinananatili ng “upang” ang layunin, ng “mangaral” ang pampublikong pagpapahayag, at ng “din … roon” ang diin ng καὶ ἐκεῖ.
- source_word: εἰς τοῦτο
  choice: para rito
  rationale: Maikli at natural na pagpapahayag ng layunin o dahilan nang hindi labis na ipinapaliwanag ang tinutukoy.
- source_word: ἐξῆλθον
  choice: ako lumabas
  rationale: Malapit sa literal na “lumabas/umalis” at hindi tinutukoy kung ito ay paglabas mula sa kasalukuyang lugar o mas malawak na paglabas upang mangaral.
- source_word: λέγει αὐτοῖς
  choice: sinabi niya sa kanila
  rationale: Isinasalin ang makasaysayang pangkasalukuyan ng Griyego sa karaniwang pangnagdaang anyo ng salaysay sa Filipino.
theological_decisions:
- issue: Saklaw ng ἐξῆλθον
  choice: Pinanatili bilang “lumabas” nang hindi tinutukoy ang pinanggalingang lugar o ang mas malawak na pinagmulan at misyon ni Jesus.
  alternative: “umalis ako” o “naparito ako para sa misyong ito”
  rationale: Maaaring tumukoy ang Griyego sa pag-alis ni Jesus sa kasalukuyang lugar, ngunit maaari rin itong magkaroon ng mas malawak na pahiwatig tungkol sa layunin ng kaniyang paglabas upang mangaral. Hindi nilulutas ng salin ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino na dignified ngunit madaling maunawaan. Ginamit ang “Pumunta tayo” at “sa ibang lugar” para sa natural na daloy; pinanatili ang bahagyang di-tiyak na “para rito ako lumabas” upang huwag ipasok ang isang tiyak na teolohikal na paliwanag.
