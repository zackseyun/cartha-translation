- from: 'Gaya ng nasusulat kay propeta Isaias: “Narito[a], isinusugo ko ang aking sugo sa unahan mo[c], na maghahanda ng iyong daan.”[b]'
  to: 'Gaya ng nasusulat sa aklat ni propeta Isaias: “Narito[a], isinusugo ko ang aking sugo sa unahan mo[c], na maghahanda ng iyong daan.”[b]'
  rationale: Pinalitan ang hindi likas na “kay propeta Isaias” ng “sa aklat ni propeta Isaias,” ang karaniwang Filipino na paraan upang ipakilala ang nakasulat sa isang propeta. Hindi ito pagdaragdag ng bagong nilalaman, kundi paglilinaw ng ipinahihiwatig ng pormula ng pagsipi. Inayon din ang tekstuwal na talababa sa pananalita ng binagong pangunahing teksto. Napanatili ang lahat ng footnote anchor at ang kahulugan ng sipi.
