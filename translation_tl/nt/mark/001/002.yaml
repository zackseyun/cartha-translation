  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀Καθὼς γέγραπται ἐν ⸂τῷ Ἠσαΐᾳ τῷ προφήτῃ⸃· ⸀Ἰδοὺ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν ⸀σου·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/002.yaml
  text: 'Just as it is written in Isaiah the prophet: ‘Behold[a], I send my messenger before your face[c][b], who will prepare your way.’'
translation:
  language: tl
  text: 'Gaya ng nasusulat sa aklat ni propeta Isaias: “Narito[a], isinusugo ko ang aking sugo sa unahan mo[c], na maghahanda ng iyong daan.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang manuskrito, “sa mga propeta” ang mababasa sa halip na “sa aklat ni propeta Isaias.”
    reason: textual_variant
  - marker: b
    text: Pinagsasama ng siping ito ang pananalita mula sa Malakias 3:1 at Isaias 40:3.
    reason: cross_reference
  - marker: c
    text: O “sa harap mo.” Sa literal, “sa harap ng iyong mukha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καθὼς
  choice: Gaya ng
  rationale: Likas na panimulang parirala sa Filipino na nagpapanatili sa diwa ng pagtutugma o pagkakaayon sa kasulatang binabanggit.
- source_word: γέγραπται
  choice: nasusulat
  rationale: Karaniwang pormula sa pagsipi ng Kasulatan; ipinahihiwatig ang nananatiling kalagayan ng tekstong naisulat.
- source_word: ἐν τῷ Ἠσαΐᾳ τῷ προφήτῃ
  choice: kay propeta Isaias
  rationale: Likas sa modernong Filipino bilang pagtukoy sa isinulat o aklat ng propeta, nang hindi idinaragdag sa pangunahing teksto ang salitang “aklat.”
- source_word: Ἰδοὺ
  choice: Narito
  rationale: Pinananatili ang marangal at makahulang panawag-pansin ng orihinal.
- source_word: ἀποστέλλω
  choice: isinusugo ko
  rationale: Ang aspektong imperpektibo ng Filipino ay angkop sa masigla at kasalukuyang anyo ng Griyegong pangkasalukuyan sa isang makahulang pahayag.
- source_word: ἄγγελόν
  choice: sugo
  rationale: Sa konteksto, tumutukoy ito sa isang inutusang tagapagpauna, hindi kinakailangang sa isang makalangit na anghel.
- source_word: πρὸ προσώπου σου
  choice: sa unahan mo
  rationale: Malinaw at likas na salin ng idyomang literal na “sa harap ng iyong mukha,” habang pinananatili ang diwang nauuna sa daraanan ng kinakausap.
- source_word: κατασκευάσει
  choice: maghahanda
  rationale: Tuwirang ipinapahayag ang paghahanda o paggawa upang maging handa.
- source_word: τὴν ὁδόν σου
  choice: ng iyong daan
  rationale: Pinananatili ang larawan ng daan at ang posibleng literal at matalinghagang diwa nito.
theological_decisions:
- issue: Isaias lamang ang pinangalanan sa pormula ng pagsipi bagaman pinagsasama ng sipi ang pananalita mula sa Malakias 3:1 at Isaias 40:3.
  choice: Panatilihin sa pangunahing teksto ang “kay propeta Isaias.”
  alternative: “sa mga propeta”
  rationale: Ito ang pagbasa ng SBLGNT at hindi dapat pakinisin o pagtugmain ng salin ang tunay na tensiyon sa pinagmulan. Inilalahad sa talababa ang ibang pagbasa ng ilang manuskrito at ang pinagsamang pinagmulan ng sipi.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “Narito” upang mapanatili ang makahulang tono, ngunit iniwasan ang sobrang makaluma o kahoy na pananalita. Ang lahat ng pananda ng talababa ay nasa pangunahing teksto.
