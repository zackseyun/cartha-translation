lexical_decisions:
- source_word: κατεδίωξεν
  choice: hinanap
  rationale: Ang pandiwang καταδιώκω ay maaaring magpahiwatig ng masigasig na pagtugis. Sa kontekstong ito, natural sa modernong Tagalog ang “hinanap,” habang inilalahad sa talababa ang mas matinding posibleng diwa.
- source_word: αὐτὸν
  choice: siya
  rationale: Tumutukoy ang panghalip kay Jesus sa naunang konteksto; ang “siya” ang tuwirang salin.
- source_word: Σίμων
  choice: Simon
  rationale: Ginamit ang karaniwang anyo ng pangalang ito sa Tagalog na Bibliya.
- source_word: οἱ μετ’ αὐτοῦ
  choice: mga kasama niya
  rationale: Natural at malinaw itong katumbas ng “mga kasama niya,” nang hindi tinutukoy nang higit sa sinasabi ng Griyego kung sino sila.
- source_word: καὶ
  choice: At
  rationale: Pinananatili nito ang payak na pag-uugnay at sunod-sunod na estilo ng salaysay ni Marcos.
