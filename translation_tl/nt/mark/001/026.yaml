    issue: Ang “lumabas ito sa kanya” ay hindi gaanong tahasang nagsasaad ng paglabas “mula” sa lalaki.
    rationale: Ang ἐξ αὐτοῦ ay may malinaw na pinagmulan (“out of him”). Mas idiomatiko at mas eksakto rito ang “lumabas ito mula sa kanya.”
  - severity: low
    issue: Ang inuulit na “ito” ay bahagyang nagpapabigat sa daloy ng pangungusap.
    rationale: Maaaring ayusin ang ayos ng parirala upang ang “maruming espiritu” ang malinaw na paksa ng unang kilos, at ang kasunod na panghalip ay nananatiling madaling matukoy.
  revised_text: At matapos pangisayin ng maruming espiritu ang lalaki at sumigaw nang malakas, lumabas ito mula sa kanya.
