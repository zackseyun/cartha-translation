base_translation:
  language: en
  yaml_path: translation/nt/mark/001/026.yaml
  text: And the unclean spirit[a], after convulsing him and crying out with a loud voice[b], came out of him.
translation:
  language: tl
  text: At matapos pangisayin ng maruming espiritu ang lalaki at sumigaw nang malakas, lumabas ito mula sa kanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπαράξαν αὐτόν
  choice: matapos pangisayín ... ang lalaki
  rationale: Ipinahahayag ng aorist participle ang kilos na nauna sa paglabas ng espiritu. Ang “pangisayín” ay natural na nagsasaad na ang espiritu ang nagpangisay sa lalaki, nang hindi ipinahihiwatig na literal nitong pinunit o sinugatan siya.
- source_word: τὸ πνεῦμα τὸ ἀκάθαρτον
  choice: maruming espiritu
  rationale: Karaniwang salin ito sa makabagong Tagalog para sa katawagang tumutukoy sa espiritung demonyo, at pinananatili nito ang diwa ng karumihan sa ἀκάθαρτος.
- source_word: φωνῆσαν φωνῇ μεγάλῃ
  choice: sumigaw ito nang malakas
  rationale: Malinaw at natural itong naglalarawan sa malakas na pagbigkas ng espiritu. Idinagdag ang “ito” upang hindi mapagkamalang ang lalaki ang sumigaw.
- source_word: ἐξῆλθεν ἐξ αὐτοῦ
  choice: lumabas ito sa kanya
  rationale: Tuwiran nitong pinananatili ang personal at pansansinukob na larawan ng espiritung umaalis mula sa lalaki.
- source_word: καὶ ... καὶ
  choice: At ... at
  rationale: Pinananatili ng panimulang “At” ang sunod-sunod na daloy ng salaysay ni Marcos, habang ang “matapos” ay nililinaw ang pagkakasunod ng mga kilos na ipinahihiwatig ng participle.
theological_decisions:
- issue: Kalikasan ng espiritung sumanib sa lalaki
  choice: Inilalarawan bilang personal na maruming espiritu
  alternative: Isang di-personal na puwersa ng kasamaan
  rationale: Sa salaysay, ang espiritu ang kumikilos, sumisigaw, at lumalabas sa lalaki. Pinananatili ng salin ang personal na pagkilos nito nang walang idinaragdag na paliwanag na doktrinal.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “ang lalaki” sa halip na paulit-ulit na panghalip upang maging malinaw kung sino ang pinangisay, at ang “ito” upang tukuyin ang maruming espiritu bilang siyang sumigaw at lumabas.
