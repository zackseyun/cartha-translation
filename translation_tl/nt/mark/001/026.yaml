- from: At matapos pangisayín ng maruming espiritu ang lalaki at sumigaw ito nang malakas, lumabas ito sa kanya.
  to: At matapos pangisayin ng maruming espiritu ang lalaki at sumigaw nang malakas, lumabas ito mula sa kanya.
  rationale: Pinalitan ang “sa kanya” ng “mula sa kanya” upang mas malinaw na maihatid ang ἐξ αὐτοῦ. Inayos din ang sugnay upang ang maruming espiritu ang malinaw na gumaganap sa parehong pagpangisay at pagsigaw, nang hindi nagdaragdag ng interpretasyong doktrinal o detalye na wala sa pinagmulan.
