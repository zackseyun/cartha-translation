  text: Καὶ ⸀εὐθὺς ἐκ τῆς συναγωγῆς ⸂ἐξελθόντες ἦλθον⸃ εἰς τὴν οἰκίαν Σίμωνος καὶ Ἀνδρέου μετὰ Ἰακώβου καὶ Ἰωάννου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/029.yaml
  text: And immediately, after leaving the synagogue, they came into the house of Simon and Andrew, with James and John.
translation:
  language: tl
  text: Pagkalabas nila sa sinagoga, agad silang pumunta sa bahay nina Simon at Andres, kasama sina Santiago at Juan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθὺς
  choice: agad
  rationale: Karaniwan sa Marcos ang εὐθύς bilang panandang nagpapabilis sa daloy ng salaysay. Likas at malinaw sa modernong Tagalog ang “agad.”
- source_word: ἐκ τῆς συναγωγῆς
  choice: pagkalabas ... sa sinagoga
  rationale: Kasama ng ἐξελθόντες, ipinahihiwatig nito ang paglabas mula sa sinagoga; likas sa Tagalog ang “lumabas sa” para sa ganitong kilos.
- source_word: ἐξελθόντες ἦλθον
  choice: pagkalabas ... pumunta
  rationale: 'Ipinapanatili ng ayos ang pagkakasunod: una silang lumabas, saka nagtungo sa bahay. Ang “pagkalabas na pagkalabas” ay natural na Tagalog na nagpapatingkad sa agarang kasunod na kilos.'
- source_word: ἦλθον
  choice: pumunta
  rationale: Maaaring mangahulugan ang ἔρχομαι ng “dumating” o “pumunta” ayon sa pananaw. Sa salaysay na nakatuon sa pagkilos nila mula sa sinagoga patungo sa bahay, natural ang “pumunta.”
- source_word: εἰς τὴν οἰκίαν
  choice: sa bahay
  rationale: Bagaman nagpapahiwatig ang εἰς ng pagpasok o paglapit sa loob, karaniwang ipinahahayag sa Tagalog ang patutunguhan sa pamamagitan ng “sa bahay”; sa konteksto, malinaw na pumasok sila roon.
- source_word: Σίμωνος καὶ Ἀνδρέου
  choice: nina Simon at Andres
  rationale: Natural na Tagalog ang “bahay nina” upang ipahayag na ang bahay ay kina Simon at Andres.
- source_word: μετὰ Ἰακώβου καὶ Ἰωάννου
  choice: kasama sina Santiago at Juan
  rationale: Tuwirang ipinapahayag ng “kasama sina” ang pakikisama o paglakad na magkakasama na tinutukoy ng μετά na may genitive.
- source_word: Σίμωνος / Ἀνδρέου / Ἰακώβου / Ἰωάννου
  choice: Simon / Andres / Santiago / Juan
  rationale: Ginamit ang mga pangalang nakaugaliang anyo sa tradisyong Tagalog at madaling makilala ng mga modernong mambabasa.
