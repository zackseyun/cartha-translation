id: MRK.1.34
reference: Mark 1:34
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐθεράπευσεν πολλοὺς κακῶς ἔχοντας ποικίλαις νόσοις, καὶ δαιμόνια πολλὰ ἐξέβαλεν, καὶ οὐκ ἤφιεν λαλεῖν τὰ δαιμόνια, ὅτι ᾔδεισαν ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/034.yaml
  text: And he healed many who were sick with various diseases[a], and he cast out many demons, and he would not allow the demons to speak, because they knew him.
translation:
  language: tl
  text: At pinagaling niya ang maraming may sari-saring karamdaman, at nagpalayas siya ng maraming demonyo. Hindi niya pinahintulutang magsalita ang mga demonyo, sapagkat kilala nila siya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na, “alam nila kung sino siya.” Payak na “kilala nila siya” ang nasa Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθεράπευσεν
  choice: pinagaling niya
  rationale: Likas at malinaw na salin ng pagpapagaling sa mga maysakit; pinananatili nito si Jesus bilang tahasang gumagawa ng kilos.
- source_word: πολλοὺς κακῶς ἔχοντας
  choice: ang maraming may ... karamdaman
  rationale: Idyoma ang κακῶς ἔχω para sa pagiging maysakit. Ang pariralang Filipino ay natural at hindi literal na isinasalin bilang ‘masama ang kalagayan.’
- source_word: ποικίλαις νόσοις
  choice: sari-saring karamdaman
  rationale: Ipinahahayag ng ποικίλος ang pagkakaiba-iba, at ang ‘karamdaman’ ay dignificado at karaniwang katumbas ng νόσος.
- source_word: δαιμόνια πολλὰ ἐξέβαλεν
  choice: nagpalayas siya ng maraming demonyo
  rationale: Ang ‘nagpalayas’ ay malinaw na naghahatid ng puwersa ng ἐκβάλλω bilang pagpapaalis, at ang ‘demonyo’ ay tuwirang katumbas ng δαιμόνιον.
- source_word: οὐκ ἤφιεν
  choice: Hindi niya pinahintulutan
  rationale: Natural itong salin ng hindi pagpapahintulot. Bagaman imperfect ang pandiwa, nauunawaan sa konteksto na patuloy niyang hindi pinahintulutan ang mga ito sa tagpong iyon.
- source_word: λαλεῖν
  choice: magsalita
  rationale: Karaniwan, malinaw, at angkop sa marangal na salaysay na katumbas ng λαλεῖν.
- source_word: ὅτι
  choice: sapagkat
  rationale: 'Ipinakikita ang pinakanatural na sanhi o dahilan sa konteksto: hindi niya sila pinagsalita dahil kilala nila siya.'
- source_word: ᾔδεισαν αὐτόν
  choice: kilala nila siya
  rationale: Pinananatili ang payak na tuwirang layon na αὐτόν, ‘siya,’ nang hindi tahasang dinaragdagan ng paliwanag tungkol sa eksaktong pagkakakilanlan niya.
theological_decisions:
- issue: Kung palalawakin ang nalalaman ng mga demonyo bilang hayagang pahayag tungkol sa pagkakakilanlan ni Jesus
  choice: kilala nila siya
  alternative: alam nila kung sino siya
  rationale: Payak na ‘siya’ ang layon sa Griyego. Hindi tahasang sinasabi sa talatang ito kung anong titulo o pagkakakilanlan ang kinilala nila, kaya hindi idinagdag ang ‘Mesiyas’ o ‘Anak ng Diyos.’
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘sari-saring karamdaman’ at ‘nagpalayas’ bilang natural na pananalita, habang pinanatili ang maigsi at hindi pinalawak na pahayag tungkol sa pagkakilala ng mga demonyo kay Jesus.
