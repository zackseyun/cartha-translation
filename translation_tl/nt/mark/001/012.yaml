  yaml_path: translation/nt/mark/001/012.yaml
  text: And immediately the Spirit drives him out into the wilderness[a].
translation:
  language: tl
  text: Agad siyang itinaboy ng Espiritu sa ilang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinaalis” o “ipinadala.” Mariin ang pandiwang Griyego; madalas ding gamitin ni Marcos ang pandiwang ito sa pagpapalayas ng mga demonyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: At
  rationale: Pinananatili ang payak na pang-ugnay at ang mabilis na daloy ng salaysay ni Marcos.
- source_word: εὐθὺς
  choice: kaagad
  rationale: Likas sa makabagong Tagalog at malinaw na naghahatid ng agarang pagkilos na katangian ng salaysay ni Marcos.
- source_word: τὸ πνεῦμα
  choice: ang Espiritu
  rationale: Tiyak ang tinutukoy dahil ito ang Espiritung nabanggit sa pagbautismo kay Jesus; hindi idinaragdag ang “Banal” sapagkat wala iyon sa mismong parirala.
- source_word: αὐτὸν
  choice: siya
  rationale: Tuwirang panghalip na tumutukoy kay Jesus; sa ayos na Tagalog, minamarkahan ito bilang layon sa pariralang “siyang itinulak.”
- source_word: ἐκβάλλει
  choice: itinulak
  rationale: Pinananatili ang mariing puwersa ng pandiwa, na mas malakas kaysa “dinala” o “inakay,” nang hindi ipinahihiwatig na pisikal lamang ang pagtulak.
- source_word: εἰς τὴν ἔρημον
  choice: papunta sa ilang
  rationale: Ang “ilang” ay likas at matatag na salin para sa isang liblib at di-tinitirhang pook; ang “papunta sa” ay naghahayag ng direksiyong taglay ng εἰς.
theological_decisions:
- issue: Lakas ng pagkilos ng Espiritu kay Jesus
  choice: “itinulak” upang mapanatili ang mariing lakas ng ἐκβάλλει
  alternative: “inakay” o “ipinadala”
  rationale: Hindi pinalalambot ang kapansin-pansing mariing pandiwa ni Marcos. Sa gayon, nananatili ang tensiyong ang pagpunta ni Jesus sa ilang ay bunga ng mapuwersang pagkilos ng Espiritu, nang hindi ipinapaliwanag nang higit sa sinasabi ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “ilang” sa biblikal ngunit nauunawaang kahulugan nito bilang liblib at di-tinitirhang pook. Ang ayos na “siyang itinulak” ay natural sa Tagalog at pinananatiling malinaw na si Jesus ang layon ng pagkilos.
