  source_fidelity: Ang “itinulak” ay nagpapahiwatig ng lakas ngunit madaling unawain bilang pisikal na pagtulak at hindi gaanong naihahatid ang mapuwersang pagpapalabas na saklaw ng ἐκβάλλει. Ang “itinaboy” ay mas tapat sa mariing pandiwa at sa ἐκ- na diwa nito. Ang “Agad,” “ang Espiritu,” at “sa ilang” ay tapat sa Griyego at sa konteksto.
  naturalness: Mas natural at mas matipid sa makabagong Tagalog ang “Agad siyang itinaboy ng Espiritu sa ilang” kaysa “At kaagad siyang itinulak ng Espiritu papunta sa ilang.” Ang “papunta sa” ay hindi kailangan at bahagyang impormal para sa rehistrong ito.
  terminology: Ang “Espiritu” at “ilang” ay angkop at dapat panatilihin. Ang “itinaboy” ay nagpapanatili ng lakas ng ἐκβάλλει nang hindi nagdaragdag ng paliwanag tungkol sa uri ng puwersa.
  issues:
  - severity: medium
    issue: Ang “itinulak” ay masyadong literal na pisikal at kulang sa diwang ‘drive/cast out’ ng ἐκβάλλει.
    rationale: Sa Marcos, mariin ang ἐκβάλλει at madalas ding ginagamit para sa pagpapalayas ng mga demonyo. Ang “itinaboy” ay mas malapit sa lakas at direksiyonal na pagpapaalis ng pandiwa, nang hindi ipinapakahulugang pisikal na pagtulak.
  - severity: low
    issue: Ang “papunta sa” ay hindi kinakailangan.
    rationale: Naipahahayag na ng “itinaboy ... sa ilang” ang direksiyong εἰς at mas angkop ito sa malinaw, marangal na rehistro.
  - severity: low
    issue: Kailangang iayon ang talababa sa binagong pangunahing pandiwa.
    rationale: Kung “itinaboy” ang teksto, dapat ipakita ng talababa ang “pinaalis” bilang alternatibo at banggitin ang kaugnay na gamit ng pandiwa sa pagpapalayas ng mga demonyo.
