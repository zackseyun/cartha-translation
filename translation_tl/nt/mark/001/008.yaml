  text: ⸀ἐγὼ ἐβάπτισα ⸀ὑμᾶς ὕδατι, αὐτὸς δὲ βαπτίσει ὑμᾶς ⸀ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/008.yaml
  text: I baptized you with water[a], but he will baptize you with the Holy Spirit.
translation:
  language: tl
  text: Ako ay nagbautismo sa inyo sa tubig, ngunit siya ay magbabautismo sa inyo sa Espiritu Santo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “sa pamamagitan ng Espiritu Santo.” Ang pang-ukol na Griyego ay maaari ring magpahiwatig ng saklaw o larangang kinasasangkutan ng pagbautismo.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ
  choice: ko
  rationale: Ang tahasang panghalip na Griyego ay ipinahihiwatig sa anyong pandiwang Tagalog; napananatili ng ayos na “Binautismuhan ko ... ngunit ... niya” ang mariing paghahambing kay Juan at sa darating.
- source_word: ἐβάπτισα
  choice: Binautismuhan
  rationale: Karaniwang salin ito ng βαπτίζω at pinananatili ang ritwal at intertekstuwal na diwa nang hindi nililimitahan ang paraan sa paglulubog lamang.
- source_word: ὑμᾶς
  choice: kayo
  rationale: Tuwirang ipinakikita ng “kayo” ang pangmaramihang ikalawang panauhan ng Griyego.
- source_word: ὕδατι
  choice: sa tubig
  rationale: Natural sa modernong Tagalog ang “bautismuhan sa tubig”; maaari nitong ihatid ang kaugnayan ng tubig bilang elemento o kasangkapan nang hindi nagpapasiya nang lampas sa tekstong Griyego.
- source_word: αὐτὸς
  choice: niya
  rationale: Sa ayos ng pangungusap, malinaw na ang darating na lalaki ang siyang gumagawa ng ikalawang pagbautismo; ang paghahambing ay pinananatili ng “ngunit.”
- source_word: δὲ
  choice: ngunit
  rationale: Malinaw nitong ipinapahayag ang paghahambing sa bautismo ni Juan at sa bautismo ng darating na higit na makapangyarihan.
- source_word: βαπτίσει
  choice: babautismuhan
  rationale: Pinananatili ang aspektong panghinaharap at ang leksikal na ugnayan sa naunang “binautismuhan.”
- source_word: ἐν
  choice: sa
  rationale: Ang “sa” ay natural na Tagalog at maaaring tumukoy sa elemento, saklaw, o paraan; hindi nito sapilitang nilulutas ang tunay na kalabuan ng ἐν.
- source_word: πνεύματι ἁγίῳ
  choice: Banal na Espiritu
  rationale: Sa konteksto ng propetikong paghahambing ni Juan, pinakamalamang na tumutukoy ito sa banal na Espiritu ng Diyos; ang malaking titik ay ang karaniwang malinaw na anyo sa Tagalog.
theological_decisions:
- issue: Kung ang πνεύματι ἁγίῳ ay tumutukoy sa banal na persona ng Espiritu Santo o sa isang di-personal na banal na kapangyarihan
  choice: Banal na Espiritu
  alternative: banal na espiritu
  rationale: Sa konteksto ng Marcos, ang parirala ay pinakamadaling maunawaan bilang pagtukoy sa banal na Espiritu ng Diyos, ngunit hindi dinaragdagan ng salin ang sinasabi ng talata tungkol sa likas o paraan ng pagkilos niya.
- issue: Kung ang ἐν πνεύματι ἁγίῳ ay dapat ipahayag bilang kasangkapan o bilang kinaroroonang saklaw
  choice: sa Banal na Espiritu
  alternative: sa pamamagitan ng Banal na Espiritu
  rationale: Mas malapit sa tunay na kalabuan ng ἐν ang maikling “sa”; inilalagay sa talababa ang mas tahasang instrumental na posibilidad upang hindi tahimik na lutasin ang interpretatibong tensiyon.
translation_notes:
  register: Modernong, marangal, at madaling maunawaang Filipino. Ginamit ang “bautismuhan” sa halip na “ilubog” upang mapanatili ang ritwal at intertekstuwal na diwa nang hindi nagtatakda ng partikular na paraan. Inilagay ang talababa pagkatapos ng “sa” upang malinaw na tumukoy sa pang-ukol na may alternatibong pagbasa.
