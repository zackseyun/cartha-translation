  text: ⸂καὶ ἐξῆλθεν⸃ ἡ ἀκοὴ αὐτοῦ εὐθὺς ⸀πανταχοῦ εἰς ὅλην τὴν περίχωρον τῆς Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/028.yaml
  text: And the news about him went out at once everywhere into the whole surrounding region of Galilee[a][b].
translation:
  language: tl
  text: At agad na kumalat ang balita tungkol sa kanya sa bawat dako ng buong karatig na lupain ng Galilea[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ulat tungkol sa kanya” o “kanyang katanyagan.”
    reason: lexical_alternative
  - marker: b
    text: O “sa lahat ng dako, hanggang sa buong karatig na lupain ng Galilea.”
    reason: previous_rendering
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: kumalat
  rationale: Bagaman literal na tumutukoy sa ‘paglabas,’ inilalarawan dito ng pandiwa ang paglaganap ng balita. Ang “kumalat” ang likas na katumbas sa makabagong Tagalog at pinananatili ang larawan ng balitang umaabot sa iba’t ibang lugar.
- source_word: ἀκοὴ
  choice: balita
  rationale: Maaaring tumukoy ang ἀκοή sa narinig, ulat, o balita. Sa konteksto, ito ang nababalitaan ng mga tao tungkol kay Jesus; hindi kailangang dagdagan ang diwa tungo sa kasikatan.
- source_word: αὐτοῦ
  choice: tungkol sa kanya
  rationale: Ang genitibo ay tumutukoy sa nilalaman ng balita, hindi lamang sa pagmamay-ari. Likas sa Tagalog ang “tungkol sa kanya.”
- source_word: εὐθὺς
  choice: agad
  rationale: Tumpak at likas na ipinahahayag ng “agad” ang biglaang bilis na madalas bigyang-diin ni Marcos.
- source_word: πανταχοῦ
  choice: sa lahat ng dako
  rationale: Tuwirang ipinapahayag nito ang malawak na saklaw ng πανταχοῦ nang hindi pinapahina ang diin.
- source_word: περίχωρον
  choice: karatig na lupain
  rationale: Ang περίχωρος ay tumutukoy sa nakapaligid o karatig na rehiyon. Ang “karatig na lupain” ay malinaw at marangal nang hindi ipinapalagay na bukirin lamang ang lugar.
- source_word: εἰς ὅλην τὴν περίχωρον τῆς Γαλιλαίας
  choice: sa buong karatig na lupain ng Galilea
  rationale: Sa konteksto ng pagkalat ng balita, likas na ipinahahayag ng “sa buong” ang pag-abot at kabuuang saklaw ng εἰς at ὅλην, habang pinananatili ang kaugnayan ng rehiyon sa Galilea.
theological_decisions:
- issue: Tinutukoy ng ἀκοὴ αὐτοῦ
  choice: balita tungkol sa kanya
  alternative: kanyang katanyagan
  rationale: Ang parirala ay tumutukoy sa mabilis na pagkalat ng narinig tungkol kay Jesus. Posible ang diwang “katanyagan,” ngunit mas mariing ipinapasok nito ang ideya ng reputasyon kaysa sa hinihingi ng salitang Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang karaniwang “balita” at “kumalat” para sa likas na daloy, habang pinanatili ang diin ng “agad,” “sa lahat ng dako,” at “buong.”
