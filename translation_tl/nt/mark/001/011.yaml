  text: καὶ φωνὴ ἐγένετο ἐκ τῶν οὐρανῶν· Σὺ εἶ ὁ υἱός μου ὁ ἀγαπητός, ἐν ⸀σοὶ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/011.yaml
  text: 'And a voice came from the heavens: “You are my beloved Son[b][a]; in you I am well pleased.”'
translation:
  language: tl
  text: 'At may isang tinig mula sa mga langit[a]: “Ikaw ang minamahal kong Anak; nalulugod ako sa iyo.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “mula sa langit.” Pangmaramihan sa Griyego: “mula sa mga langit.”'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “sa iyo ako nalugod” o “ikaw ang kinalulugdan ko.”
    reason: alternative_reading
lexical_decisions:
- source_word: φωνὴ ἐγένετο
  choice: may tinig na nagmula
  rationale: Ang pariralang Griyego ay nagsasaad ng pagdating o paglitaw ng isang tinig. Likas sa makabagong Tagalog ang “may tinig na nagmula,” at naiuugnay nito ang tinig sa kasunod na pinagmulan nito.
- source_word: ἐκ τῶν οὐρανῶν
  choice: mula sa mga langit
  rationale: Pinananatili ang pangmaramihang anyo ng οὐρανῶν. Bagaman mas karaniwan sa Tagalog ang “mula sa langit,” malinaw at marangal pa rin ang “mula sa mga langit.”
- source_word: Σὺ εἶ
  choice: Ikaw ang
  rationale: Natural na ipinahahayag ng hulmahang Tagalog na “Ikaw ang…” ang tuwiran at madiing pagkilala na nasa tahasang panghalip na Σὺ.
- source_word: ὁ υἱός μου
  choice: Anak
  rationale: Sa pariralang “minamahal kong Anak,” natural na naipapahayag ang kaugnayang “aking Anak.” Ginamit ang malaking titik dahil tuwirang tinutukoy ng banal na pahayag si Jesus sa natatangi niyang papel sa salaysay.
- source_word: ὁ ἀγαπητός
  choice: minamahal
  rationale: Ang “minamahal” ay malinaw, kasalukuyan, at marangal na katumbas ng ἀγαπητός, nang hindi nagdaragdag ng antas o uri ng pagmamahal na wala sa teksto.
- source_word: ἐν σοὶ
  choice: sa iyo
  rationale: Sa ganitong pahayag, ang “sa iyo” ang likas na katumbas sa Tagalog ng ἐν σοὶ at pinananatili ang pagtukoy kay Jesus bilang siyang pinagtutuunan ng pagkalugod.
- source_word: εὐδόκησα
  choice: nalulugod ako
  rationale: Ipinahahayag ng “nalulugod ako” ang umiiral na banal na pagsang-ayon at kasiyahan na likas sa pormula ng pahayag. Hindi nito labis na ikinukulong ang aorist sa isang lumipas at natapos na damdamin.
theological_decisions:
- issue: Pagpapanatili sa lakas ng pahayag tungkol sa pagkakakilanlan ni Jesus bilang Anak
  choice: minamahal kong Anak
  alternative: aking Anak, ang Minamahal
  rationale: Pinagsasama nito ang pagiging Anak at ang banal na pagmamahal sa natural na Tagalog, nang hindi nagdaragdag ng terminolohiyang doktrinal na wala sa talata.
- issue: Pangmaramihan o pang-isahang anyo ng οὐρανῶν
  choice: mula sa mga langit
  alternative: mula sa langit
  rationale: Pinananatili sa pangunahing teksto ang pangmaramihang anyo ng Griyego; ibinibigay sa talababa ang mas karaniwang pang-isahang anyo sa Tagalog.
- issue: Aspekto ng εὐδόκησα at ang kasalukuyang bisa ng banal na pahayag
  choice: nalulugod ako sa iyo
  alternative: sa iyo ako nalugod
  rationale: Ang napiling salin ay natural na banal na deklarasyon sa Tagalog at ipinahahayag ang kasalukuyang pagkalugod. Inilalahad sa talababa ang mas tahasang anyong maaaring magpahiwatig ng naganap na pagkalugod upang hindi maitago ang puwang ng aorist.
translation_notes:
  register: Makabago at madaling maunawaang Tagalog na may marangal na himig. Iniwasan ang labis na makalumang ayos, ngunit pinanatili ang solemnidad ng tinig mula sa mga langit at ang tuwirang pahayag kay Jesus.
