  text: Καὶ ἐγένετο ἐν ἐκείναις ταῖς ἡμέραις ἦλθεν Ἰησοῦς ἀπὸ Ναζαρὲτ τῆς Γαλιλαίας καὶ ἐβαπτίσθη ⸂εἰς τὸν Ἰορδάνην ὑπὸ Ἰωάννου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/009.yaml
  text: And it happened in those days that Jesus came from Nazareth of Galilee and was baptized in the Jordan by John[a].
translation:
  language: tl
  text: Noong mga araw na iyon, dumating si Jesus mula sa Nazaret sa Galilea at binautismuhan siya ni Juan sa Jordan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “papasok sa Jordan.” Maaari ring isaling mas literal nang ganito ang pang-ukol na Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο ἐν ἐκείναις ταῖς ἡμέραις
  choice: Nang mga araw na iyon
  rationale: Ginagawang natural sa modernong Tagalog ang pambungad na salaysay at panandang-panahon. Hindi kailangang isalin nang hiwalay ang semitikong idyomang Καὶ ἐγένετο bilang “at nangyari” sapagkat magiging mabigat at di-likas iyon dito.
- source_word: ἦλθεν
  choice: dumating
  rationale: Malinaw at likas na ipinahahayag ang pagdating ni Jesus mula sa Nazaret; mas angkop sa konteksto kaysa sa payak na “pumunta,” na karaniwang nakabatay sa pananaw ng nagsasalita.
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Karaniwang anyo ng pangalan sa modernong salin sa Filipino.
- source_word: ἀπὸ Ναζαρὲτ τῆς Γαλιλαίας
  choice: mula sa Nazaret ng Galilea
  rationale: Pinananatili ang pagkakaugnay ng mga pook sa Griyego at ang pormulang tumutukoy sa Nazaret bilang kabilang sa Galilea.
- source_word: ἐβαπτίσθη
  choice: binautismuhan siya
  rationale: Tapat na salin ng pandiwang balintiyak nang hindi nililimitahan ang paraan ng bautismo sa isang denominasyonal na pakahulugan.
- source_word: εἰς τὸν Ἰορδάνην
  choice: sa Jordan
  rationale: Natural sa Filipino bilang lokasyon ng bautismo, habang ang mas literal na puwersang “papasok sa Jordan” ay inilalahad sa talababa dahil tunay na posible sa pang-ukol na εἰς.
- source_word: ὑπὸ Ἰωάννου
  choice: ni Juan
  rationale: Ang ὑπό na may henitibo ay tumutukoy sa personal na tagaganap; sa Filipino, likas itong ipinahahayag ng “ni Juan” sa kayariang balintiyak.
theological_decisions:
- issue: Pagpapakahulugan sa βαπτίζω sa kontekstong sensitibo sa iba't ibang denominasyon
  choice: binautismuhan siya
  alternative: inilubog siya
  rationale: Ang “binautismuhan” ay tapat sa ulat ng teksto at hindi nagpapasya para sa mambabasa tungkol sa tiyak na paraan ng ritwal nang higit sa tahasang sinasabi ng talata.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Iniwasan ang makalumang “at nangyari” bilang mekanikal na salin ng pambungad na idyoma, at pinanatili ang maikli at mabilis na daloy ng salaysay ni Marcos.
