  text: καὶ λέγει αὐτῷ· Ὅρα μηδενὶ μηδὲν εἴπῃς, ἀλλὰ ὕπαγε σεαυτὸν δεῖξον τῷ ἱερεῖ καὶ προσένεγκε περὶ τοῦ καθαρισμοῦ σου ἃ προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/044.yaml
  text: And he says to him[a], “See that you say nothing to anyone; rather, go, show yourself to the priest, and offer for your cleansing what Moses commanded, as a testimony to them.”
translation:
  language: tl
  text: Sinabi niya sa lalaki, “Mag-ingat kang huwag magsabi ng anuman kaninuman. Sa halip, pumunta ka, magpakita ka sa pari, at ihandog mo para sa iyong paglilinis ang iniutos ni Moises bilang patotoo sa kanila.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bilang katibayan sa kanila.” Maaaring tumukoy ang parirala sa katibayang ihaharap sa mga pari o sa iba; binabasa naman ito ng ilan sa mas matalas na diwang “bilang patotoo laban sa kanila.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅρα
  choice: Tiyakin mong
  rationale: Ang pautos na anyo ay isang mahigpit na babala o tagubilin. Natural sa modernong Tagalog ang “Tiyakin mong” at napananatili nito ang diin nang hindi isinasalin nang literal bilang “Tingnan mo.”
- source_word: μηδενὶ μηδὲν εἴπῃς
  choice: huwag kang magsabi ng anuman kaninuman
  rationale: 'Napananatili ang dalawang saklaw ng pagbabawal sa Griyego: walang anumang sasabihin at walang sinumang pagsasabihan.'
- source_word: ἀλλὰ
  choice: Sa halip
  rationale: Malinaw na ipinakikita ang pagtutuwid at pagsalungat sa pagitan ng hindi niya dapat gawin at ng dapat niyang gawin.
- source_word: ὕπαγε
  choice: humayo ka
  rationale: Tuwirang pautos na pumunta. Ang “humayo” ay dignificado, malinaw, at angkop sa biblikal na salaysay nang hindi lipas ang dating.
- source_word: σεαυτὸν δεῖξον τῷ ἱερεῖ
  choice: magpakita ka sa pari
  rationale: Natural na Tagalog na nagpapanatili sa diwa ng pagpapakita ng sarili sa paring magsasagawa ng kinakailangang pagsusuri.
- source_word: ἱερεῖ
  choice: sa pari
  rationale: Tinutukoy ang angkop na awtoridad na pari ayon sa Kautusan; natural sa Tagalog na hindi na ulitin ang pantukoy na katumbas ng artikulong Griyego.
- source_word: προσένεγκε
  choice: ihandog mo
  rationale: Ang konteksto ay ritwal at paghahandog ayon sa Kautusan, kaya mas tiyak ang “ihandog” kaysa sa pangkalahatang “dalhin.”
- source_word: περὶ τοῦ καθαρισμοῦ σου
  choice: para sa iyong paglilinis
  rationale: Ipinahahayag ang kaugnayan o layunin ng handog sa ritwal na paglilinis, habang pinananatili ang ugnayan sa paggaling.
- source_word: ἃ προσέταξεν Μωϋσῆς
  choice: ang iniutos ni Moises
  rationale: Natural na kolektibong pagpapahayag sa Tagalog para sa mga itinakdang bagay sa Kautusan.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: bilang patotoo sa kanila
  rationale: Pinananatili ang layunin o resultang ipinahahayag ng εἰς at ang malawak na kahulugan ng μαρτύριον nang hindi ipinapasok ang “laban sa kanila.”
theological_decisions:
- issue: Ang tinutukoy at puwersa ng “bilang patotoo sa kanila”
  choice: Pinanatiling malawak ang “sa kanila,” kaya maaaring tumukoy sa mga pari o iba pang nakasaksi, at hindi tinukoy kung simpleng katibayan o mas matalas na patotoo ang diwa.
  alternative: “bilang katibayan sa mga pari” o “bilang patotoo laban sa kanila”
  rationale: Hindi tahasang sinasabi ng Griyego kung sino lamang ang tinutukoy ng panghalip o kung salungat ang patotoo. Ang mas malawak na salin ay nagpapanatili sa tunay na kalabuan ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural at dignificado. Ginamit ang “sa lalaki” upang gawing malinaw ang referent ng αὐτῷ sa konteksto, nang hindi dinaragdagan ang pagkakakilanlan nito. Pinanatili ang ritwal na bokabularyong “pari,” “ihandog,” at “paglilinis,” at iniwasang lutasin ang kalabuan ng “sa kanila.”
