  text: And the whole city was gathered at the door[a].
translation:
  language: tl
  text: At ang buong lungsod ay sama-samang natipon sa may pintuan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “sa pintuan” o, sa mas direksiyonal na pagbasa, “patungo sa pintuan.” Ang pang-ukol na Griyegong ginamit ay maaaring magpahiwatig ng paglapit o ng kinaroroonan kaugnay ng pintuan; sa konteksto, tumutukoy ito sa mga taong natipon sa pasukan ng bahay.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν ... ἐπισυνηγμένη
  choice: ay nagkatipon
  rationale: Ang imperfect na ἦν kasama ng perfect passive participle na ἐπισυνηγμένη ay naglalarawan sa kalagayan ng karamihang natipon na. Likas sa modernong Tagalog ang “ay nagkatipon” at hindi nito dinaragdagan ang diwa ng pandiwa.
- source_word: ὅλη ἡ πόλις
  choice: ang buong lungsod
  rationale: Tuwirang pinananatili ng “ang buong lungsod” ang masidhing paglalahat ng Griyego sa halip na pahinain ito bilang “maraming tao sa lungsod.”
- source_word: πρὸς τὴν θύραν
  choice: sa may pintuan
  rationale: Sa stative na konteksto, ipinahihiwatig ng πρός na ang mga tao ay natipon sa kinaroroonan o paligid ng pasukan. Ang “sa may pintuan” ay natural sa Tagalog at pinananatili ang kaugnayan sa pintuan nang hindi nagsasabing nasa mismong pintuan ang lahat.
- source_word: θύραν
  choice: pintuan
  rationale: Ang θύρα ay maaaring tumukoy sa pinto o pasukan. Mas natural dito ang “pintuan” bilang lugar ng pagpasok sa bahay.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Pinanatili ang “buong lungsod” bilang matingkad na paglalahat ng teksto. Ginamit ang “sa may pintuan” upang maging natural at malinaw ang lokasyon; inilagay sa talababa ang mas literal na alternatibong nagpapahiwatig ng direksiyong patungo sa pintuan.
