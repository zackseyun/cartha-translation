  text: Καὶ πρωῒ ἔννυχα λίαν ἀναστὰς ἐξῆλθεν καὶ ἀπῆλθεν εἰς ἔρημον τόπον κἀκεῖ προσηύχετο.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/035.yaml
  text: And very early[a], while it was still dark, he got up, went out, and went away to a desolate place, and there he was praying.
translation:
  language: tl
  text: Madaling-araw pa, habang madilim pa, bumangon siya, lumabas, at nagtungo sa isang liblib na lugar[a], at doon siya nananalangin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lugar na walang tao,” “tiwangwang na lugar,” o “ilang.” Ang salitang Griyego ay maaaring tumukoy sa isang lugar na walang naninirahan, liblib, o tulad ng ilang.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρωῒ ἔννυχα λίαν
  choice: Madaling-araw pa, habang madilim pa
  rationale: Pinagsasama nito ang maagang oras, ang pagpapalakas ng λίαν, at ang pahiwatig ng ἔννυχα na hindi pa sumisikat ang araw. Natural ito sa makabagong Filipino at pinananatili ang diin ng Griyego.
- source_word: ἀναστὰς
  choice: bumangon siya
  rationale: Ipinahahayag nang natural ang kilos na nauna sa mga pangunahing pandiwa at pinananatili ang pagkakasunod-sunod ng salaysay.
- source_word: ἐξῆλθεν
  choice: lumabas
  rationale: Pinananatili ang tiyak na kilos ng paglabas mula sa kinaroroonan niya.
- source_word: ἀπῆλθεν
  choice: nagtungo
  rationale: Inihihiwalay ito sa naunang 'lumabas' at ipinakikita ang pagpapatuloy ng paglalakbay patungo sa ibang lugar.
- source_word: εἰς ἔρημον τόπον
  choice: sa isang ilang na lugar
  rationale: Ang 'ilang' ay maaaring tumukoy sa lugar na liblib, walang tao, o tila ilang; hindi nito kinakailangang tukuyin ang isang pormal na heograpikong disyerto.
- source_word: κἀκεῖ
  choice: Doon
  rationale: Natural na katumbas ng καὶ ἐκεῖ sa Filipino at malinaw na inuugnay ang pananalangin sa lugar na pinuntahan niya.
- source_word: προσηύχετο
  choice: nananalangin siya
  rationale: Ang aspektong imperpektibo ay inilalarawan bilang nagpapatuloy na kilos; ang 'nananalangin' ay mas angkop kaysa sa payak na 'nanalangin.'
theological_decisions:
- issue: Diin ng salaysay sa pananalangin ni Jesus
  choice: Tuwirang isinalaysay na nagtungo si Jesus sa isang ilang na lugar at doon ay nananalangin.
  alternative: Idiing huwaran ito ng pag-iisa para sa mga alagad o isama sa salin ang mga implikasyong Kristolohikal ng kanyang pananalangin.
  rationale: Ang talata mismo ay nagsasalaysay lamang ng maagang pag-alis ni Jesus upang manalangin. Hindi dapat idagdag sa mismong salin ang mga konklusyong teolohikal na hindi tuwirang sinasabi ng Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang magkahiwalay na kilos na 'lumabas' at 'nagtungo,' gayundin ang nagpapatuloy na diwa ng pananalangin. Ang panandang [a] ay inilagay kaagad pagkatapos ng pariralang tinutukoy nito.
