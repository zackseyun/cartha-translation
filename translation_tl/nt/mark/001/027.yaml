  to: 'At namangha silang lahat,[a] kaya nag-usap-usap sila: “Ano ito? Isang bagong aral na may awtoridad! Inuutusan niya maging ang maruruming espiritu, at sumusunod sila sa kanya.”'
  rationale: Pinalitan ang “may kapangyarihan” ng “may awtoridad” upang higit na tumugma sa ἐξουσίαν. Inayos din nang bahagya ang ayos at bantas para sa mas natural na modernong Filipino, habang pinananatili ang alternatibong pagbasa sa talababa at ang kalabuan ng saklaw ng “may awtoridad.”
