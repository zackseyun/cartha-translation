id: MRK.1.27
reference: Mark 1:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐθαμβήθησαν ⸀ἅπαντες, ὥστε συζητεῖν ⸂πρὸς ἑαυτοὺς⸃ λέγοντας· Τί ἐστιν τοῦτο; ⸂διδαχὴ καινή⸃· κατ’ ἐξουσίαν καὶ τοῖς πνεύμασι τοῖς ἀκαθάρτοις ἐπιτάσσει, καὶ ὑπακούουσιν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/027.yaml
  text: And they were all amazed[a], so that they discussed among themselves, saying, “What is this? A new teaching with authority! He even commands the unclean spirits, and they obey him.”
translation:
  language: tl
  text: 'At namangha silang lahat,[a] kaya nag-usap-usap sila: “Ano ito? Isang bagong aral na may awtoridad! Inuutusan niya maging ang maruruming espiritu, at sumusunod sila sa kanya.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “Ano ito? Ano itong bagong aral na may awtoridad?” Maaaring bantasang ganito ang Griyego upang ang “bagong aral” ay maging mas tuwirang bahagi ng tanong.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐθαμβήθησαν
  choice: namangha
  rationale: Likas at malinaw na Filipino para sa matinding pagkagulat at paghanga, nang hindi dinaragdagan ang tindi ng salitang Griyego.
- source_word: ἅπαντες
  choice: silang lahat
  rationale: Pinananatili ang diin sa kabuuan ng mga naroon.
- source_word: ὥστε συζητεῖν πρὸς ἑαυτούς
  choice: kaya nag-usap-usap sila
  rationale: Ipinapahayag ng ὥστε ang naging bunga, at likas na inilalarawan ng “nag-usap-usap” ang palitang naganap sa loob ng pangkat.
- source_word: Τί ἐστιν τοῦτο;
  choice: Ano ito?
  rationale: Tuwiran at natural na tanong na nagpapanatili sa pagkabigla ng mga nagsasalita.
- source_word: διδαχὴ καινή
  choice: Isang bagong aral
  rationale: Ang “aral” ay pangkaraniwan at dignidad na katumbas ng διδαχή; mas hindi teknikal kaysa “doktrina.”
- source_word: κατ’ ἐξουσίαν
  choice: na may kapangyarihan
  rationale: Pinananatili ang ideya ng awtoridad o karapatang mag-utos at ang posibleng kaugnayan nito sa bagong aral, nang hindi ito tahasang ikinakabit lamang sa kasunod na pandiwa.
- source_word: καὶ τοῖς πνεύμασι τοῖς ἀκαθάρτοις
  choice: maging ang maruruming espiritu
  rationale: Ang καί ay may diin dito (“maging”), at ang “maruruming espiritu” ay nagpapanatili sa ritwal at moral na puwersa ng ἀκάθαρτος.
- source_word: ἐπιτάσσει
  choice: Inuutusan niya
  rationale: Naghahatid ng tuwiran at makapangyarihang pag-uutos at pinananatili ang aspektong pangkasalukuyan ng pandiwa.
- source_word: ὑπακούουσιν αὐτῷ
  choice: sumusunod sila sa kanya
  rationale: Natural na Filipino para sa pagsunod bilang tugon sa isang utos.
theological_decisions:
- issue: Ugnayan ng “may kapangyarihan” sa kayarian ng pangungusap
  choice: Isang bagong aral na may kapangyarihan!
  alternative: “Ano ito? Ano itong bagong aral na may kapangyarihan?” o ikabit ang “may kapangyarihan” lalo na sa pag-uutos sa maruruming espiritu.
  rationale: Maaaring hatiin at bantasang iba-iba ang Griyego. Pinananatili ng pangunahing salin ang likas na ugnayan sa “bagong aral,” samantalang ipinahihiwatig ng konteksto na nahahayag din ang kapangyarihang iyon sa pag-uutos sa mga espiritu. Hindi nito nilulutas nang labis ang sintaktikong kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang “aral” sa halip na mas teknikal na “doktrina,” at “maruruming espiritu” upang mapanatili ang biblikal na diwa ng ἀκάθαρτος. Ang tandang talababa [a] ay inilagay sa pangunahing teksto.
