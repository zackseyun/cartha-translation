source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Δεῦτε ὀπίσω μου, καὶ ποιήσω ὑμᾶς γενέσθαι ἁλιεῖς ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/017.yaml
  text: And Jesus said to them, “Come after me, and I will make you become fishers of men.”
translation:
  language: tl
  text: At sinabi ni Jesus sa kanila, “Sumunod kayo sa akin, at gagawin ko kayong mga mangingisda ng mga tao.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δεῦτε ὀπίσω μου
  choice: Sumunod kayo sa akin
  rationale: Likas at malinaw na panawagan sa modernong Tagalog; ipinahahayag nito ang literal na ideya ng pagparito sa likuran ni Jesus bilang pagsunod sa kaniya.
- source_word: ποιήσω ὑμᾶς γενέσθαι
  choice: gagawin ko kayong
  rationale: Pinananatili ang pagkilos ni Jesus na huhubog sa kanila tungo sa bagong tungkulin; ang mas tahasang “gagawin ko kayong maging” ay hindi natural sa Tagalog.
- source_word: ἁλιεῖς ἀνθρώπων
  choice: mga mangingisda ng mga tao
  rationale: Pinananatili ang talinghaga ng pangingisda at isinasalin ang ἀνθρώπων bilang pangkalahatang “mga tao,” na saklaw ang mga tao anuman ang kasarian.
theological_decisions:
- issue: Ang panawagan ba ay simpleng pisikal na pagsama o pagiging alagad?
  choice: Sumunod kayo sa akin
  alternative: Halikayo sa likuran ko
  rationale: Saklaw ng parirala ang konkretong pagsama at ang panawagan sa pagiging alagad; ang napiling salin ay natural nang hindi nagdaragdag ng denominasyonal na pakahulugan.
- issue: Saklaw ng ἀνθρώπων
  choice: mga tao
  alternative: mga lalaki
  rationale: Sa pariralang ito, ang genitive plural ng ἄνθρωπος ay tumutukoy sa sangkatauhan o mga tao sa pangkalahatan, hindi partikular sa mga lalaking nasa hustong gulang.
translation_notes:
  register: Modernong Filipino Tagalog na simple, marangal, at madaling maunawaan. Pinanatili ang pamilyar na talinghagang “mangingisda ng mga tao” at ang tuwirang lakas ng utos ni Jesus.
