base_translation:
  language: en
  yaml_path: translation/nt/mark/001/020.yaml
  text: And immediately he called them[a], and leaving their father Zebedee in the boat with the hired workers, they went after him.
translation:
  language: tl
  text: At agad niya silang tinawag. Iniwan nila ang kanilang amang si Zebedeo sa bangka kasama ng mga upahang manggagawa, at sumunod sila sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pumunta sila sa likuran niya.” Maaaring tumukoy ang Griyego kapwa sa pisikal na pagsunod sa likuran niya at sa pagsisimula nilang sumunod sa kanya bilang mga alagad.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: agad
  rationale: Pinananatili ang temporal na diin at mabilis na takbo na katangian ng salaysay ni Marcos, sa natural na modernong Tagalog.
- source_word: ἐκάλεσεν
  choice: tinawag
  rationale: Tuwirang katumbas ng καλέω na hindi labis na nagpapahiwatig ng sapilitang pag-uutos o simpleng paanyaya lamang.
- source_word: ἀφέντες
  choice: iniwan
  rationale: Natural na nagsasaad ng kilos na nauna sa kanilang pag-alis, nang hindi inilalagay ang mas mabigat na diwa ng ‘tinalikuran’ o ‘pinabayaan.’
- source_word: πατέρα αὐτῶν
  choice: kanilang ama
  rationale: Tuwiran at natural na salin ng pariralang paari, nang walang idinagdag na diin.
- source_word: Ζεβεδαῖον
  choice: Zebedeo
  rationale: Ginamit ang nakagawiang anyo ng pangalang biblikal sa Tagalog.
- source_word: πλοίῳ
  choice: bangka
  rationale: Angkop sa konteksto ng pangingisda sa Galilea at mas natural kaysa sa salitang tumutukoy sa malaking sasakyang-dagat.
- source_word: μισθωτῶν
  choice: mga upahang manggagawa
  rationale: Malinaw na tumutukoy sa mga taong nagtatrabaho kapalit ng bayad, nang hindi nagdaragdag ng modernong korporatibong kulay.
- source_word: ἀπῆλθον
  choice: umalis sila
  rationale: Pinananatili ang diwa ng pag-alis mula sa dati nilang kinaroroonan.
- source_word: ὀπίσω αὐτοῦ
  choice: sumunod sa kanya
  rationale: Natural sa Tagalog at maaaring magpahiwatig kapwa ng aktuwal na pagsunod sa likuran ni Jesus at ng pagsisimula ng pagiging alagad.
theological_decisions:
- issue: Diwa ng pagiging alagad sa ὀπίσω αὐτοῦ
  choice: sumunod sa kanya
  alternative: pumunta sa likuran niya / sumama sa kanya bilang mga alagad
  rationale: Hindi nililimitahan ng pangunahing salin ang parirala sa pisikal na paglakad lamang o tahasang ipinapaliwanag bilang pormal na pagiging alagad; pinananatili nito ang dalawang magkaugnay na diwa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang maikling, mabilis na daloy ng salaysay at iniwasan ang mga salitang labis na teknikal o denominasyonal.
