id: MRK.1.3
reference: Mark 1:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/003.yaml
  text: 'A voice of one crying out in the wilderness: ‘Prepare the way of the Lord[b][a]; make his paths straight,’'
translation:
  language: tl
  text: 'Isang tinig ang sumisigaw sa ilang:

    “Ihanda ninyo ang daan ng Panginoon[b];

    tuwirin ninyo ang mga landas niya.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, ayon sa ibang pagbabantas sa sipi mula sa Isaias: “Isang tinig ang sumisigaw: ‘Sa ilang ay ihanda ninyo ang daan ng Panginoon …’”'
    reason: alternative_reading
  - marker: b
    text: Ang “Panginoon” ay salin ng Griyegong kyriou. Umaalingawngaw ang sipi sa Isaias 40:3, kung saan ang Hebreo ay tumutukoy kay YHWH.
    reason: cross_reference
lexical_decisions:
- source_word: φωνὴ
  choice: Isang tinig
  rationale: Karaniwang nangangahulugang “tinig” ang φωνή. Natural sa Filipino ang “Isang tinig” para sa pangngalang walang pantukoy na nagpapakilala sa sipi.
- source_word: βοῶντος
  choice: ang sumisigaw
  rationale: Ang genitibong participle ay nakaugnay sa φωνή at tumutukoy sa taong malakas na naghahayag. Pinananatili ng “sumisigaw” ang puwersa nito.
- source_word: ἐν τῇ ἐρήμῳ
  choice: sa ilang
  rationale: Maaaring tumukoy ang ἔρημος sa disyerto o ilang. Ang “ilang” ay natural, marangal, at angkop kapuwa sa sipi mula sa Isaias at sa tagpuan ng salaysay ni Marcos.
- source_word: Ἑτοιμάσατε
  choice: Ihanda ninyo
  rationale: Isang maramihang pautos para sa tiyak na paghahanda. Malinaw at likas sa modernong Filipino ang “Ihanda ninyo.”
- source_word: τὴν ὁδὸν
  choice: ang daan
  rationale: Pinananatili ng “daan” ang konkretong larawan ng paghahanda ng ruta at ang propetikong talinghaga.
- source_word: κυρίου
  choice: ng Panginoon
  rationale: Tuwirang isinasalin ang genitibong κυρίου bilang “ng Panginoon,” na malapit sa anyo ng Griyego at natural sa Filipino.
- source_word: εὐθείας
  choice: tuwirin
  rationale: Ang kahulugang kailangan dito ay “straight,” hindi moral na pagiging matuwid. Sa Filipino, natural na maisama ang diwa ng pang-uri sa pandiwang “tuwirin.”
- source_word: ποιεῖτε
  choice: tuwirin ninyo
  rationale: Ang literal na “gawin ninyong tuwid” ay maaaring paikliin sa natural na pautos na “tuwirin ninyo” nang hindi nawawala ang kahulugan.
- source_word: τὰς τρίβους αὐτοῦ
  choice: ang mga landas niya
  rationale: Ang τρίβος ay landas o daanan; pinananatili ng “mga landas” ang maramihang larawan. Ang αὐτοῦ ay malinaw na isinalin bilang “niya.”
theological_decisions:
- issue: Pagsasalin sa κύριος sa sipi mula sa Isaias na tumutukoy sa YHWH sa Hebreo
  choice: Panginoon
  alternative: ANG PANGINOON
  rationale: Ang pangunahing teksto ay sumusunod sa Griyegong κύριος bilang “Panginoon.” Ipinaliliwanag sa talababa na ang sipi ay umaalingawngaw sa Isaias 40:3, kung saan YHWH ang tinutukoy ng Hebreo, nang hindi ipinapasok sa mismong salin ang anyong wala sa Griyego.
- issue: Pagkakaugnay ng pariralang ἐν τῇ ἐρήμῳ
  choice: 'Iniuugnay sa taong sumisigaw: “sumisigaw sa ilang”'
  alternative: 'Iniuugnay sa pautos: “Sa ilang ay ihanda ninyo ang daan ng Panginoon”'
  rationale: Sa pagkakasunod at agarang sintaks ng Griyego sa Marcos, natural itong iugnay sa βοῶντος. Gayunman, tunay na posible ang ibang bantas sa sipi mula sa Isaias, kaya pinananatili ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “ilang,” “daan,” at “mga landas” upang mapanatili ang propetikong larawan nang hindi maging lipas o labis na teknikal. Ang mga panandang [a] at [b] ay kapuwa nasa pangunahing teksto.
