  text: ⸀καὶ ⸀ὀργισθεὶς ἐκτείνας τὴν χεῖρα ⸂αὐτοῦ ἥψατο⸃ καὶ λέγει αὐτῷ· Θέλω, καθαρίσθητι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/041.yaml
  text: And being angry[a], he stretched out his hand, touched him, and said to him, “I am willing; be cleansed.”
translation:
  language: tl
  text: At nagalit siya, iniunat niya ang kanyang kamay, hinipo siya, at sinabi sa kanya, “Nais ko; luminis ka.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀργισθεὶς
  choice: dahil sa galit
  rationale: Tuwirang sinasalamin nito ang nakalimbag na pagbasa ng SBLGNT, na nagsasaad na nagalit si Jesus, nang hindi tinutukoy kung kanino o saan nakatuon ang galit.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: iniunat niya ang kanyang kamay
  rationale: Pinananatili nito ang kongkretong kilos at likas ang pagkakasunod ng mga pandiwa sa salaysay na Tagalog.
- source_word: ἥψατο
  choice: hinipo siya
  rationale: Ang ἅπτομαι ay karaniwang nangangahulugang humipo sa ganitong konteksto; malinaw rin nitong pinananatili ang pisikal na paghipo sa lalaking may ketong.
- source_word: λέγει αὐτῷ
  choice: sinabi sa kanya
  rationale: Bagaman nasa historical present ang λέγει, mas natural sa salaysay na Tagalog ang pangnagdaan.
- source_word: Θέλω
  choice: Nais ko
  rationale: Ipinahahayag nito ang kusang-loob na pagnanais o kahandaan ni Jesus, at umaangkop sa naunang pakiusap ng lalaki nang hindi ito ginagawang simpleng panghinaharap.
- source_word: καθαρίσθητι
  choice: Luminis ka
  rationale: Ang pandiwang luminis ay maikli at natural na utos sa Tagalog, habang pinananatili ang saklaw ng καθαρίζω na maaaring tumukoy sa pisikal at ritwal na kalinisan.
theological_decisions:
- issue: Magkaibang tekstuwal na pagbasa tungkol sa damdamin ni Jesus
  choice: Isinalin sa pangunahing teksto ang ὀργισθείς bilang “dahil sa galit.”
  alternative: “nahabag” / “naantig sa habag”
  rationale: Sinusunod ng pangunahing teksto ang ibinigay na SBLGNT. Dahil malaki ang epekto ng alternatibong pagbasa sa paglalarawan sa damdamin ni Jesus, inilalahad ito sa talababa sa halip na tahimik na ipalit. Hindi rin tinutukoy ng salin ang sanhi o pinatutungkulan ng galit, sapagkat hindi iyon nililinaw ng Griyego.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Pinili ang “Nais ko” kaysa mas kolokyal na “Gusto ko,” at ang maikling “Luminis ka” upang mapanatili ang tuwirang lakas ng utos.
