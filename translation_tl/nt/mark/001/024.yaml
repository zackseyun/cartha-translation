base_translation:
  language: en
  yaml_path: translation/nt/mark/001/024.yaml
  text: saying[a], “What have you to do with us[b], Jesus the Nazarene? Have you come to destroy us? I know who you are—the Holy One of God.”
translation:
  language: tl
  text: na nagsabi, “Ano ang kinalaman mo sa amin,[a] Jesus na Nazareno?[b] Naparito ka ba upang lipulin kami? Alam ko kung sino ka—ang Banal ng Diyos.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Ano ang kinalaman natin sa isa't isa?” Ang Griyegong pananalita ay isang idyomang nagpapahayag ng paglayo o pagsalungat.
    reason: lexical_alternative
  - marker: b
    text: 'O, “Jesus na taga-Nazaret.” Sa Griyego: “Jesus na Nazareno.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: na nagsasabi
  rationale: Pinananatili ang participial na ugnayan sa naunang salaysay; natural itong nagdurugtong sa pagsasalita ng taong sinasaniban.
- source_word: Τί ἡμῖν καὶ σοί
  choice: Ano ang pakialam mo sa amin
  rationale: Ang literal na anyo ay isang idyomang nagpapahayag ng paglayo o pagsalungat. Ang saling ito ay natural sa modernong Filipino at pinananatili ang mapanghamong diwa nang hindi ipinapaliwanag nang labis.
- source_word: Ἰησοῦ Ναζαρηνέ
  choice: Jesus na Nazareno
  rationale: Pinananatili ang bokatibong bansag na Ναζαρηνέ sa halip na tahasang gawing heograpikong pariralang “Jesus na taga-Nazaret.”
- source_word: ἦλθες
  choice: Naparito ka ba
  rationale: Ipinahihiwatig ng pandiwa ang pagdating na may kasalukuyang kaugnayan; idiomatiko sa Filipino ang “naparito” sa ganitong tuwirang tanong.
- source_word: ἀπολέσαι
  choice: upang lipulin
  rationale: Tuwirang ipinapahayag ang layuning wasakin o puksain sa konteksto ng pagpapalayas ng masamang espiritu.
- source_word: ἡμᾶς
  choice: kami
  rationale: Pinananatili ang mahalagang unang panauhang maramihan ng Griyego.
- source_word: οἶδά σε τίς εἶ
  choice: Kilala kita kung sino ka
  rationale: Pinananatili kapwa ang tahasang panghalip na σε at ang sugnay na τίς εἶ. Ang bahagyang mariing anyo ay angkop sa dramatikong pagkilala ng nagsasalita.
- source_word: ὁ ἅγιος τοῦ θεοῦ
  choice: ang Banal ng Diyos
  rationale: Pinananatili ang parirala bilang titulong pagkilala at ang ugnayang genitibo, nang hindi ito pinalalawak bilang isang mas ganap na pahayag ng doktrina.
theological_decisions:
- issue: Kristolohikal na titulo sa pagkilala ng masamang espiritu
  choice: ang Banal ng Diyos
  alternative: ang Banal na mula sa Diyos
  rationale: Ang piniling anyo ay malapit sa Griyego at nagpapanatili sa lakas ng titulo, ngunit hindi tinutukoy nang higit sa sinasabi ng teksto ang eksaktong uri ng ugnayan ng genitibo.
- issue: Maramihang tinutukoy ng nagsasalita
  choice: amin / kami
  alternative: akin / ako
  rationale: Pinananatili ang plural na ἡμῖν at ἡμᾶς; hindi nilulutas kung bakit isang tinig ang gumagamit ng maramihan o kung sinu-sino ang kasama nito.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “pakialam” dahil natural itong naghahatid ng mapanghamong idyoma sa kasalukuyang wika; inilagay ang mas pormal na alternatibo sa talababa. Pinanatili ang “Nazareno” at “ang Banal ng Diyos” upang manatiling malapit sa anyo at teolohikal na tensiyon ng Griyego.
