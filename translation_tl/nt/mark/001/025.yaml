  text: καὶ ἐπετίμησεν αὐτῷ ὁ Ἰησοῦς λέγων· Φιμώθητι καὶ ἔξελθε ἐξ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/025.yaml
  text: And Jesus rebuked him[a], saying, “Be silent, and come out of him!”
translation:
  language: tl
  text: Sinaway ni Jesus ang maruming espiritu at sinabi, “Tumahimik ka[a] at lumabas ka mula sa kanya!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O mas literal, “Mabusalan ka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: Sinaway
  rationale: Ipinahahayag ng “sinaway” ang matalim at may-awtoridad na pagsasalita ni Jesus nang hindi dinaragdagan ang diwa tungo sa mas interpretatibong “mahigpit na inutusan.”
- source_word: αὐτῷ
  choice: siya
  rationale: Ang panlalaking panghalip ay tumutukoy sa maruming espiritu na nagsasalita sa pamamagitan ng lalaki. Pinananatili ng “siya” ang tuwirang pagtukoy rito bilang kinakausap.
- source_word: λέγων
  choice: na sinasabi
  rationale: Pinananatili nito ang ugnayang pandiwari ng Griyego at natural nitong ipinakikilala ang mismong sinabi ni Jesus.
- source_word: Φιμώθητι
  choice: Tumahimik ka
  rationale: Bagaman literal itong may larawan ng paglalagay ng busal, sa pautos na gamit ay matinding pagpapatahimik ang kahulugan. Malinaw at natural sa modernong Tagalog ang “Tumahimik ka,” habang inilalagay sa talababa ang literal na larawan.
- source_word: ἔξελθε
  choice: lumabas ka
  rationale: Sa konteksto ng pagpapalayas ng espiritu, ipinahahayag nito ang paglabas mula sa loob ng taong sinasapian.
- source_word: ἐξ αὐτοῦ
  choice: sa kanya
  rationale: Kasama ng “lumabas,” natural na ipinahahayag ng “sa kanya” ang paggalaw mula sa loob ng lalaki, nang hindi mabigat ang mas literal na “mula sa loob niya.”
theological_decisions:
- issue: Ang tinutukoy ng pagsaway ni Jesus
  choice: Ang maruming espiritu ang tuwirang kinakausap ni Jesus, hindi ang lalaki.
  alternative: Ang lalaki ang agarang tinutukoy ng panghalip.
  rationale: Ipinakikita ng utos na “lumabas ka sa kanya” na ang kausap ay naiiba sa lalaking pinanggagalingan nito. Pinananatili nito ang pagkakaibang nasa salaysay nang walang idinaragdag na doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Pinanatili ang matalas at makapangyarihang tono ng utos ni Jesus, at ang masidhing literal na larawan ng Φιμώθητι ay inilagay sa talababa.
