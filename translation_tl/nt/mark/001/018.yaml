  text: καὶ ⸀εὐθὺς ἀφέντες τὰ ⸀δίκτυα ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/018.yaml
  text: And immediately they left the nets and followed him[a].
translation:
  language: tl
  text: At kaagad[a] nilang iniwan ang mga lambat at sumunod sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “noon din.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Payak na pang-ugnay ito na nagpapanatili sa tuloy-tuloy na daloy ng salaysay ni Marcos nang walang idinadagdag na interpretasyon.
- source_word: εὐθὺς
  choice: kaagad
  rationale: Ipinahahayag nito ang dagliang pagtugon. Ang “kaagad” ay likas at malinaw sa makabagong Filipino at nagpapanatili sa diin ng salitang Griyego.
- source_word: ἀφέντες
  choice: iniwan
  rationale: 'Ang aorist participle ay tumutukoy sa kilos na nauna sa pangunahing pandiwa. Likas itong ipahayag sa Filipino bilang pandiwang iniugnay sa sumunod na kilos: “iniwan ... at sumunod.” Hindi ginamit ang “tinalikuran” sapagkat maaari itong magdagdag ng mas matinding damdamin o pahiwatig.'
- source_word: τὰ δίκτυα
  choice: ang mga lambat
  rationale: Tuwirang katumbas ito ng pangngalang maramihan na may pantukoy. Hindi idinagdag ang “kanilang” dahil bagaman malinaw sa konteksto, hindi ito tahasang nasa Griyego.
- source_word: ἠκολούθησαν
  choice: sumunod
  rationale: Pinananatili nito kapwa ang literal na pagsunod kay Jesus at ang umuusbong na diwa ng pagiging alagad, nang hindi pinalalawak ang teksto.
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Ang panghalip ay tumutukoy kay Jesus sa agarang konteksto. Pinanatili ang panghalip sa halip na ipalit ang pangalang “Jesus.”
theological_decisions:
- issue: Diwa ng pagiging alagad sa ἠκολούθησαν
  choice: sumunod sa kanya
  alternative: naging mga alagad niya
  rationale: Ang payak na “sumunod sa kanya” ay nagpapanatili sa literal at teolohikal na saklaw ng pandiwa. Ang pagpapalawak na “naging mga alagad niya” ay magpapasya para sa mambabasa sa halip na hayaang lumitaw ang kahulugan mula sa konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang likas na ayos na “kaagad nilang iniwan” at iniwasan ang mga salitang lipas o labis na teolohikal.
