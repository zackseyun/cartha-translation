  source_fidelity: 'Tumpak na naipapahayag ang lahat ng elemento ng Griyego: ang pang-ugnay na καὶ (“At”), ang kagyat na εὐθὺς (“kaagad”), ang naunang kilos ng ἀφέντες (“iniwan”), ang τὰ δίκτυα (“ang mga lambat”), at ang ἠκολούθησαν αὐτῷ (“sumunod sa kanya”). Hindi idinagdag ang pangalang Jesus o pinalawak ang diwa ng pagiging alagad.'
