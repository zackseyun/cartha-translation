  text: And immediately there was in their synagogue a man with an unclean spirit[a], and he cried out[b],
translation:
  language: tl
  text: At agad, may isang lalaking may maruming espiritu[a][b] sa kanilang sinagoga, at sumigaw siya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “nasa maruming espiritu.”'
    reason: lexical_alternative
  - marker: b
    text: Isinasalin ito ng ilang salin bilang “sinasapian ng maruming espiritu,” isang interpretibong pagpapalawak ng pariralang Griyego.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθὺς
  choice: agad
  rationale: Pinananatili nito ang mabilis na takbo na katangian ng salaysay ni Marcos, at natural ito sa makabagong Tagalog.
- source_word: ἦν
  choice: naroon
  rationale: Ipinahahayag nito nang natural ang eksistensiyal na diwa ng pandiwa sa loob ng ibinigay na tagpuan.
- source_word: συναγωγῇ αὐτῶν
  choice: kanilang sinagoga
  rationale: Tahasang pinananatili ang αὐτῶν at ginagamit ang kinikilalang katawagan para sa sinagogang Judio.
- source_word: ἄνθρωπος
  choice: isang lalaki
  rationale: Tumutukoy ang panlalaking pangngalan sa isang tiyak na lalaking nasa salaysay.
- source_word: ἐν πνεύματι ἀκαθάρτῳ
  choice: may maruming espiritu
  rationale: Natural itong Tagalog para sa kaugnayang ipinahahayag ng parirala, nang hindi idinaragdag ang higit na interpretibong ‘sinasapian.’
- source_word: ἀκαθάρτῳ
  choice: maruming
  rationale: Pinananatili nito ang diwa ng karumihang ritwal at moral na kaugnay ng katawagan sa kontekstong ito.
- source_word: ἀνέκραξεν
  choice: sumigaw siya
  rationale: Malinaw at natural nitong ipinahahayag ang malakas na pagbulalas nang hindi labis na tinutukoy ang damdamin o uri ng sigaw.
theological_decisions:
- issue: Paglalarawan sa kaugnayan ng lalaki sa maruming espiritu sa ἐν πνεύματι ἀκαθάρτῳ
  choice: may maruming espiritu
  alternative: nasa isang maruming espiritu; sinasapian ng maruming espiritu
  rationale: Ang ‘may maruming espiritu’ ay malinaw at natural habang iniiwasang palawakin ang teksto sa mas interpretibong ‘sinasapian.’ Ang mas literal na kayarian ay inilagay sa talababa upang mapanatili ang kakaibang anyo at posibleng diin ng Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang ‘At agad’ upang mapanatili ang καὶ at ang mabilis na kilos ng εὐθὺς; ‘sinagoga’ ang karaniwang katawagang nauunawaan sa kontekstong Judio.
