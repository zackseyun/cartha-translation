id: MRK.1.43
reference: Mark 1:43
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐμβριμησάμενος αὐτῷ ⸀εὐθὺς ἐξέβαλεν αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/043.yaml
  text: And after sternly warning him[a], he immediately sent him away[b],
translation:
  language: tl
  text: At matapos siyang mahigpit na pagbilinan[a], agad siyang pinaalis ni Jesus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “matapos siyang mariing utusan” o “matapos siyang mahigpit na sawayin.” Maaari ring magpahiwatig ang pandiwang Griyego ng matinding pagkagalit o mariing pagsaway.
    reason: lexical_alternative
  - marker: b
    text: O, “agad niya itong itinaboy.” Mas malakas ang pandiwang Griyego kaysa sa karaniwang “pinaalis.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβριμησάμενος
  choice: matapos siyang mahigpit na pagbilinan
  rationale: Ang pandiwa ay nagpapahiwatig ng matinding damdaming ipinahayag bilang mariing babala o mahigpit na utos. Likas sa modernong Tagalog ang “mahigpit na pagbilinan,” at pinananatili nito ang tindi at puwersang nag-uutos nang hindi agad ipinapalagay na personal na kinagalitan o hinatulan ni Jesus ang lalaki.
- source_word: αὐτῷ
  choice: siyang
  rationale: Tumutukoy ang panghalip na datibo sa lalaking pinagaling; likas itong isinama bilang layon ng “pagbilinan” sa Tagalog.
- source_word: εὐθύς
  choice: agad
  rationale: Pinananatili ng “agad” ang mabilis na takbo at diwa ng kagyat na pagkilos na karaniwan sa salaysay ni Marcos.
- source_word: ἐξέβαλεν
  choice: pinaalis
  rationale: Ang ἐκβάλλω ay mas malakas kaysa karaniwang pagpapauwi o pagpapaalis, ngunit sa kontekstong tao ang pinapaalis at hindi demonyo, natural at malinaw ang “pinaalis.” Inilalahad sa talababa ang mas mariing posibleng diwa.
- source_word: αὐτόν
  choice: siyang
  rationale: Tumutukoy ang akusatibong panghalip sa lalaki ring pinagaling at tuwirang ginawang layon ng pagpapaalis.
- source_word: καὶ
  choice: At
  rationale: Payak na pang-ugnay ito na nagpapatuloy sa salaysay at umaayon sa paulit-ulit na estilo ni Marcos.
theological_decisions:
- issue: Ang himig ng pagkilos ni Jesus sa lalaking pinagaling
  choice: Inilarawan si Jesus na nagbibigay ng mariin at mahigpit na bilin at pagkatapos ay agad na nagpapaalis sa lalaki.
  alternative: Maaari itong unawain bilang personal na pagsaway o bilang pagpapakita ng matinding pagkagalit, o kaya nama’y bilang isang matatag na utos na halos walang emosyonal na kulay.
  rationale: Kapuwa matindi ang ἐμβριμησάμενος at ἐξέβαλεν. Pinananatili ng salin at mga talababa ang tinding iyon, ngunit hindi ipinapalagay na makasalanan ang galit ni Jesus o na hinahatulan niya ang lalaki. Hinahayaan din nitong linawin ng kasunod na talata ang layunin ng mahigpit na bilin.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “pagbilinan” upang ipahayag ang mariing utos nang hindi labis na nagpapahiwatig ng paghatol sa lalaki. Tahasang binanggit si Jesus bilang gumagawa upang maiwasan ang malabong sunod-sunod na panghalip sa Tagalog; malinaw naman siya bilang di-binanggit na simuno sa Griyego ayon sa konteksto.
