  source_fidelity: 'Tumpak na naipapahayag ng salin ang dalawang mariing kilos sa Griyego: ang ἐμβριμησάμενος bilang mahigpit na pagbibigay-bilin at ang ἐξέβαλεν bilang agarang pagpapaalis. Napananatili rin ang εὐθύς sa “agad.” Hindi nito labis na ipinapakahulugan ang damdamin ni Jesus bilang personal na galit o paghatol.'
