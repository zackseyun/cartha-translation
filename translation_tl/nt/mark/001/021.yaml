  text: Καὶ εἰσπορεύονται εἰς Καφαρναούμ. καὶ ⸀εὐθὺς τοῖς σάββασιν ⸂ἐδίδασκεν εἰς τὴν συναγωγήν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/021.yaml
  text: And they went into Capernaum, and immediately on the Sabbath he began teaching in the synagogue.
translation:
  language: tl
  text: Pumasok sila sa Capernaum. At agad, noong Sabbath[a], nagturo siya sa sinagoga.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “sa mga Sabbath,” isang idyomatikong pananalitang nangangahulugang “noong Sabbath.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin ang “siya ay nagtuturo” o “nagsimula siyang magturo”; maaaring idiin ng imperpektibong anyo sa Griyego ang nagpapatuloy na kilos o ang pagsisimula nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσπορεύονται
  choice: pumasok sila
  rationale: Ang pangkasalukuyang anyo ay makasaysayang kasalukuyan na karaniwan kay Marcos; ginamit ang pangnagdaan para sa likas na daloy ng salaysay sa Filipino, habang pinananatili ang diwa ng pagpasok.
- source_word: Καφαρναούμ
  choice: Capernaum
  rationale: Ginamit ang nakaugaliang anyo ng pangalan ng lugar sa modernong Bibliyang Filipino.
- source_word: εὐθύς
  choice: agad
  rationale: Maikli at natural na katumbas na nagpapanatili sa bilis at sigla ng salaysay ni Marcos.
- source_word: τοῖς σάββασιν
  choice: Pagdating ng Sabbath
  rationale: Bagaman maramihan ang anyong Griyego, ito ay idyomatikong panahong pahayag na tumutukoy sa Sabbath; ang parirala ay natural sa Filipino at hindi ipinahihiwatig na maraming Sabbath ang tinutukoy.
- source_word: ἐδίδασκεν
  choice: nagturo
  rationale: Ang aspektong imperpektibo ay maaaring maglarawan ng nagpapatuloy na pagtuturo o simpleng ilahad ito bilang pangyayaring nasa takbo; hindi tahasang idinagdag sa pangunahing teksto ang 'nagsimulang' sapagkat hindi tiyak ang inceptive na diwa.
- source_word: συναγωγήν
  choice: sinagoga
  rationale: Sa kontekstong Judio, tumutukoy ito sa lokal na sinagoga, hindi lamang sa isang pangkalahatang pagtitipon.
theological_decisions:
- issue: Aspekto ng ἐδίδασκεν
  choice: nagturo
  alternative: nagsimulang magturo / nagtuturo siya
  rationale: Pinanatiling bukas ang imperpektibong aspekto nang hindi tiyak na ipinapalagay na inceptive ito; inilagay sa talababa ang mga posibleng pagbasa.
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “Capernaum,” “Sabbath,” at “sinagoga” bilang mga nakikilalang katawagang biblikal. Hindi nilagyan ng talababa ang makasaysayang kasalukuyan sapagkat sapat itong nailipat sa likas na pangnagdaang salaysay sa Filipino.
