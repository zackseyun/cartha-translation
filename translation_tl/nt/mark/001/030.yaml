  source_fidelity: Tumpak sa kabuuan ang pagsasalin ng κατέκειτο, πυρέσσουσα, εὐθύς, at περί αὐτῆς. Ang pagtukoy kay Jesus ay suportado ng agarang konteksto. Gayunman, ang «biyenang babae ni Simon» ay hindi likas at maaaring magpahiwatig ng isang tiyak na uri ng biyenan; ang πενθερά ay payak na «biyenan» at, sa kontekstong ito, malinaw na ina ng asawa ni Simon.
  naturalness: Ang «Nakahiga at nilalagnat» at «agad nilang sinabi kay Jesus ang tungkol sa kanya» ay malinaw at natural. Mas idiomatiko at mas payak ang «Ang biyenan ni Simon ay nakahiga at nilalagnat».
  terminology: Palitan ang «biyenang babae» ng «biyenan». Hindi nawawala ang kasarian sapagkat ang terminong Griyego at ang konteksto ay tumutukoy sa ina ng asawa ni Simon; hindi kailangan ang di-likas na dagdag na «babae» sa pangunahing teksto.
