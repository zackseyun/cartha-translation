  text: ἡ δὲ πενθερὰ Σίμωνος κατέκειτο πυρέσσουσα, καὶ ⸀εὐθὺς λέγουσιν αὐτῷ περὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/030.yaml
  text: Simon’s mother-in-law was lying sick with a fever[b][a], and immediately they told him about her.
translation:
  language: tl
  text: Ang biyenan ni Simon ay nakahiga at nilalagnat, at agad nilang sinabi[a] kay Jesus ang tungkol sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Griyego, pangkasalukuyan ang anyo: “sinasabi nila.” Ginagamit ito bilang makasaysayang pangkasalukuyan upang maging mas buhay ang salaysay.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πενθερὰ
  choice: biyenang babae
  rationale: Tiyak na tumutukoy ang salitang Griyego sa ina ng asawa o babaeng biyenan; pinananatili ng salin ang kasarian na hayag sa pinagmulan.
- source_word: κατέκειτο
  choice: nakahiga
  rationale: Ipinahihiwatig ng imperfect ang nagpapatuloy na kalagayan ng pagkakahiga, nang hindi pinalalabis na permanente siyang nakaratay.
- source_word: πυρέσσουσα
  choice: nilalagnat
  rationale: Likas at tuwirang salin ito ng pagiging may lagnat o pagdurusa sa lagnat.
- source_word: εὐθὺς
  choice: agad
  rationale: Pinananatili nito ang diwa ng kagyat na pagkilos at ang mabilis na takbo ng salaysay ni Marcos.
- source_word: λέγουσιν
  choice: sinabi
  rationale: Ginamit ang karaniwang aspektong naganap sa salaysay na Filipino para sa likas na daloy; ipinaliliwanag sa talababa ang makasaysayang pangkasalukuyan ng Griyego.
- source_word: περὶ αὐτῆς
  choice: ang tungkol sa kanya
  rationale: Pinananatili nito ang malawak na diwa ng 'tungkol sa kanya' at hindi nililimitahan sa lagnat o kalagayan lamang.
- source_word: δὲ
  choice: hindi tahasang isinalin
  rationale: Mahinang pang-ugnay ito sa pagpapatuloy ng salaysay; sapat na naihahatid sa Filipino ng ayos ng pangungusap nang hindi nagdaragdag ng diwang temporal o matinding pagsalungat.
theological_decisions:
- issue: Ang tinutukoy ng αὐτῷ
  choice: kay Jesus
  alternative: sa kanya
  rationale: Bagaman panghalip na 'sa kanya' ang anyong Griyego, si Jesus ang malinaw na tinutukoy sa konteksto. Nilinaw ang pangalan upang maiwasan sa Filipino ang maling pagbasa na kay Simon sila nagsabi; hindi nito dinaragdagan ang pangyayari.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “biyenang babae” upang mapanatili ang tiyak na babaeng kamag-anak sa Griyego, at “nilalagnat” bilang karaniwang pananalita. Ang talababa ay nakakabit mismo sa “sinabi,” ang salitang tinutukoy nito.
