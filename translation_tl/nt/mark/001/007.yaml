base_translation:
  language: en
  yaml_path: translation/nt/mark/001/007.yaml
  text: And he was proclaiming[a], saying, “The one stronger than I is coming after me[c][b], of whom I am not worthy to stoop down and untie the strap of his sandals.”
translation:
  language: tl
  text: 'At patuloy siyang nangangaral: “Ang higit na makapangyarihan kaysa sa akin ay dumarating kasunod ko. Hindi ako karapat-dapat na yumuko at kalagin ang tali ng kanyang mga sandalyas.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκήρυσσεν
  choice: patuloy niyang ipinahayag
  rationale: Ipinahihiwatig ng imperpektong aspekto ang nagpapatuloy o paulit-ulit na pagpapahayag. Pinananatili ng “ipinahayag” ang diwa ng isang tagapagbalitang hayagang naghahatid ng mensahe nang hindi masyadong eklesiyastikal ang tunog.
- source_word: λέγων
  choice: ipinakilala sa pamamagitan ng tuwirang sipi
  rationale: Sa natural na Filipino, sapat nang ipakilala ng pandiwang “ipinahayag” ang kasunod na sinabi; ang literal na “na sinasabi” ay magiging mabigat at paulit-ulit.
- source_word: Ἔρχεται
  choice: Dumarating
  rationale: Pinananatili ang kasalukuyang panahon at ang agarang dating ng tinutukoy.
- source_word: ὁ ἰσχυρότερός μου
  choice: ang higit na makapangyarihan kaysa sa akin
  rationale: Ang artikulo at pahambing na pang-uri ay tumutukoy sa isang persona. Masaklaw ng “makapangyarihan” ang lakas at nakahihigit na kapangyarihan o katayuan; hindi nito nililimitahan ang diwa sa pisikal na lakas lamang.
- source_word: ὀπίσω μου
  choice: kasunod ko
  rationale: Likas sa Filipino at napapanatili ang temporal na diwa ng pagdating pagkatapos ni Juan, habang hindi lubusang inaalis ang larawan ng pagsunod sa likuran.
- source_word: ἱκανὸς
  choice: karapat-dapat
  rationale: Sa konteksto, ipinahahayag ni Juan ang kanyang napakababang katayuan sa harap ng darating, hindi lamang ang kawalan ng kakayahang gawin ang gawain.
- source_word: κύψας
  choice: yumuko
  rationale: Inilalarawan ang pisikal na pagpapakababa bago o habang kinakalag ang tali. Ang koordinasyong “yumuko at kalagin” ay malinaw at natural sa Filipino.
- source_word: λῦσαι
  choice: kalagin
  rationale: Ang “kalagin” ang natural na pandiwa para sa pagtatanggal ng pagkakatali ng panali ng sandalyas.
- source_word: τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ
  choice: ang tali ng kanyang mga sandalyas
  rationale: Ang “tali” ay malinaw na modernong tawag sa panaling katad, at ang “sandalyas” ay angkop sa kasuotang-paa sa sinaunang konteksto.
theological_decisions:
- issue: Saklaw ng paghahambing sa ἰσχυρότερος
  choice: higit na makapangyarihan kaysa sa akin
  alternative: mas malakas kaysa sa akin
  rationale: Pinananatili ng napiling salin ang pagiging pahambing at ang higit na malawak na diwa ng lakas o kapangyarihan, nang hindi nagdaragdag ng tiyak na doktrinal na paliwanag.
- issue: Diwa ng ἱκανός sa pagpapakumbaba ni Juan
  choice: Hindi ako karapat-dapat
  alternative: Hindi ako sapat / Hindi ako angkop
  rationale: Higit na angkop sa gawaing karaniwang iniuukol sa mababang alipin ang pahayag tungkol sa pagiging di-karapat-dapat. Gayunman, itinatala sa talababa ang tunay na leksikal na posibilidad ng pagiging sapat o angkop.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Iniwasan ang mabigat na literalismong “na sinasabi” at ang sobrang teknikal o denominasyonal na pananalita. Ginamit ang “kanyang” ayon sa karaniwang kasalukuyang baybay.
