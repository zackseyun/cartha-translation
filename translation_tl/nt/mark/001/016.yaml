  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸂Καὶ παράγων⸃ παρὰ τὴν θάλασσαν τῆς Γαλιλαίας εἶδεν Σίμωνα καὶ Ἀνδρέαν τὸν ⸀ἀδελφὸν Σίμωνος ⸀ἀμφιβάλλοντας ἐν τῇ θαλάσσῃ, ἦσαν γὰρ ἁλιεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/016.yaml
  text: And as he was passing along beside the Sea of Galilee, he saw Simon and Andrew, Simon’s brother, casting a net into the sea, for they were fishermen.
translation:
  language: tl
  text: Habang nagdaraan si Jesus sa tabi ng Dagat ng Galilea, nakita niya si Simon at ang kapatid niyang si Andres na naghahagis ng lambat sa dagat, sapagkat mga mangingisda sila.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παράγων παρὰ τὴν θάλασσαν
  choice: Habang naglalakad ... sa tabi ng Lawa
  rationale: Ipinahahayag ng kasalukuyang pandiwaring παράγων ang kilos na kasabay ng εἶδεν. Ang “habang naglalakad ... sa tabi” ay natural sa Filipino at pinananatili ang patuloy na kilos at lokasyong ipinahihiwatig ng παρά na may accusative.
- source_word: τὴν θάλασσαν τῆς Γαλιλαίας
  choice: Lawa ng Galilea
  rationale: Bagaman θάλασσα ang salitang Griyego, ang tinutukoy na anyong-tubig ay isang lawa. Ang “Lawa ng Galilea” ay malinaw at karaniwang heograpikong katawagan sa modernong Filipino.
- source_word: εἶδεν
  choice: nakita niya
  rationale: Tuwirang salin ng aorist ng ὁράω, nang hindi nagdaragdag ng diwang gaya ng sinadyang pagpansin.
- source_word: Σίμωνα καὶ Ἀνδρέαν
  choice: sina Simon at Andres
  rationale: Ginamit ang pantukoy na “sina” na likas sa Filipino para sa dalawang pangalan; ang mga pangalan ay nasa karaniwang anyong Filipino.
- source_word: τὸν ἀδελφὸν Σίμωνος
  choice: na kapatid ni Simon
  rationale: Pinananatili ang appositional na pagkakakilanlan kay Andres bilang kapatid ni Simon sa natural na ayos ng Filipino.
- source_word: ἀμφιβάλλοντας ἐν τῇ θαλάσσῃ
  choice: Naghahagis sila ng lambat sa lawa
  rationale: Ang ἀμφιβάλλω ay espesipikong tumutukoy sa paghahagis ng lambat. Ang “sa lawa” ay natural sa Filipino at hindi kailangang gawing “papasok sa lawa” upang maipahayag ang direksiyon ng kilos.
- source_word: ἦσαν γὰρ ἁλιεῖς
  choice: sapagkat mga mangingisda sila
  rationale: Pinananatili ng “sapagkat” ang nagpapaliwanag na puwersa ng γάρ at ang marangal na himig ng salaysay.
theological_decisions:
- issue: Lantad na simuno ng παράγων
  choice: si Jesus
  alternative: siya
  rationale: Walang tahasang pangalan sa mismong talata, ngunit si Jesus ang malinaw na simuno mula sa naunang konteksto. Ang pagbanggit sa pangalan ay likas sa Filipino at nag-aalis ng malabong reperensiya nang hindi nagdaragdag ng teolohikal na pakahulugan.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Hinati sa dalawang pangungusap ang mahabang estrukturang Griyego upang maging natural at madaling maunawaan, habang pinananatili ang pagkakasunod-sunod at ugnayang paliwanag ng mga kilos.
