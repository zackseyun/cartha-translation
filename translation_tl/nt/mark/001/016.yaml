revisions:
- from: Habang naglalakad si Jesus sa tabi ng Lawa ng Galilea, nakita niya sina Simon at Andres na kapatid ni Simon. Naghahagis sila ng lambat sa lawa, sapagkat mga mangingisda sila.
  to: Habang nagdaraan si Jesus sa tabi ng Dagat ng Galilea, nakita niya si Simon at ang kapatid niyang si Andres na naghahagis ng lambat sa dagat, sapagkat mga mangingisda sila.
  rationale: Nilinaw ang pagkakakilanlan kay Andres bilang kapatid ni Simon, pinanatili ang terminong “Dagat” ayon sa Griyego, at ibinalik sa isang pangungusap ang kaugnayan ng pagkakita ni Jesus sa kanilang paghahagis ng lambat. Walang kailangang footnote.
