id: MRK.1.15
reference: Mark 1:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ λέγων ὅτι Πεπλήρωται ὁ καιρὸς καὶ ἤγγικεν ἡ βασιλεία τοῦ θεοῦ· μετανοεῖτε καὶ πιστεύετε ἐν τῷ εὐαγγελίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/015.yaml
  text: and saying[a], “The time has been fulfilled, and the kingdom of God has drawn near[b]. Repent and believe in the good news.”
translation:
  language: tl
  text: at sinasabi, “Dumating na sa katuparan ang takdang panahon, at lumapit na ang kaharian ng Diyos.[a] Magsisi kayo at maniwala sa magandang balita.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang paghahari ng Diyos.”
    reason: lexical_alternative
  - marker: b
    text: O, “sa ebanghelyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πεπλήρωται
  choice: Dumating na sa katuparan
  rationale: Ipinahahayag ng perpektong aspekto ang katuparang naganap na at nananatiling may bisa sa kasalukuyan; natural din ito sa makabagong Tagalog.
- source_word: ὁ καιρὸς
  choice: ang takdang panahon
  rationale: Ang καιρός ay tumutukoy sa tiyak at mapagpasyang panahon, hindi lamang sa oras o panahon sa pangkalahatan.
- source_word: ἤγγικεν
  choice: lumapit na
  rationale: Pinananatili nito ang kilos ng paglapit at ang kasalukuyang kalapitang bunga nito, ayon sa perpektong anyo ng pandiwa.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ang kaharian ng Diyos
  rationale: Malawak at kinikilalang salin ito na maaaring tumukoy kapwa sa paghahari ng Diyos at sa saklaw ng kanyang paghahari, nang hindi agad nilulutas ang saklaw ng kahulugan.
- source_word: μετανοεῖτε
  choice: Magsisi kayo
  rationale: Likas, maikli, at matimbang na utos ito sa Tagalog para sa pagbabagong-loob at pagtalikod sa kasalanan; hindi labis na binibigyang-kahulugan ang aspektong pangkasalukuyan.
- source_word: πιστεύετε
  choice: maniwala
  rationale: Tuwirang katumbas ito ng utos na πιστεύετε at angkop sa pariralang sumusunod.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: sa magandang balita
  rationale: Inilalahad nito sa malinaw na makabagong Tagalog ang literal na diwa ng εὐαγγέλιον; sa konstruksyong Filipino, ang 'maniwala sa' ay natural na katumbas ng πιστεύετε ἐν.
- source_word: λέγων
  choice: at sinasabi
  rationale: Ipinagpapatuloy nito ang salaysay mula sa naunang talata at pinananatili ang pangkasalukuyang anyo ng participle sa natural na Tagalog.
theological_decisions:
- issue: Saklaw ng βασιλεία τοῦ θεοῦ
  choice: ang kaharian ng Diyos
  alternative: ang paghahari ng Diyos
  rationale: Pinananatili ng 'kaharian' ang malawak na teolohikal at kanonikal na diwa ng parirala; inilalagay sa talababa ang dinamikong diwang 'paghahari' bilang tunay na alternatibong leksikal.
- issue: Pagpapakahulugan sa εὐαγγέλιον
  choice: magandang balita
  alternative: ebanghelyo
  rationale: Mas tuwiran at madaling maunawaan ang 'magandang balita,' samantalang pinananatili sa talababa ang tradisyonal na terminong 'ebanghelyo.'
- issue: Lakas ng μετανοεῖτε καὶ πιστεύετε
  choice: Magsisi kayo at maniwala
  alternative: Patuloy kayong magsisi at maniwala
  rationale: Maaaring magpahiwatig ng nagpapatuloy na kilos ang mga pangkasalukuyang pautos, ngunit hindi kailangang tahasang idagdag ang 'patuloy' sa kontekstong ito; pinananatili ng payak na pautos ang tindi nang hindi labis na binibigyang-kahulugan ang aspekto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “takdang panahon” upang maipakita ang mapagpasyang diwa ng καιρός, at ang mga tradisyonal na alternatibo ay inilagay sa talababa. Ang lahat ng pananda ng talababa ay nasa pangunahing teksto.
