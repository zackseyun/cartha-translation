base_translation:
  language: en
  yaml_path: translation/nt/mark/001/040.yaml
  text: And a man with leprosy comes to him[a], pleading with him and kneeling, and saying to him, “If you are willing[d][c][b], you are able to make me clean.”
translation:
  language: tl
  text: 'Lumapit sa kanya ang isang lalaking may ketong[a] at nakiusap sa kanya habang nakaluhod: “Kung nais mo, kaya mo akong linisin[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “ketong” na tinutukoy sa Bibliya ay maaaring tumukoy sa iba’t ibang malubhang sakit sa balat, hindi lamang sa sakit na tinatawag ngayong Hansen’s disease.
    reason: lexical_alternative
  - marker: b
    text: O “gawin mo akong malinis.” Ang pandiwang Griyego ay maaaring tumukoy kapuwa sa paglilinis mula sa karumihan at sa pisikal na pagpapanumbalik.
    reason: lexical_alternative
lexical_decisions:
- source_word: λεπρὸς
  choice: isang lalaking may ketong
  rationale: Ginamit ang pananalitang inuuna ang tao sa halip na tawagin siyang “ketongin.” Sa kontekstong biblikal, ang terminong Griyego ay maaaring tumukoy sa iba’t ibang malubhang sakit sa balat, hindi lamang sa sakit na tinatawag ngayong Hansen’s disease.
- source_word: παρακαλῶν
  choice: nakikiusap sa kanya
  rationale: Likas at malinaw sa makabagong Tagalog ang “nakikiusap” at ipinahahayag nito ang taimtim na pakiusap nang hindi dinaragdagan ang tindi ng pananalita.
- source_word: γονυπετῶν
  choice: lumuluhod
  rationale: Tuwirang inilalarawan nito ang kilos o anyo ng pagluhod na ipinahihiwatig ng participle.
- source_word: Ἐὰν θέλῃς
  choice: Kung nais mo
  rationale: Pinananatili nito ang kondisyon at ang diwa ng kusang pagnanais o kahandaan, nang hindi ginagawang pahayag tungkol lamang sa hinaharap.
- source_word: δύνασαί
  choice: kaya mo
  rationale: Natural na Tagalog ito para sa kakayahan o kapangyarihang ipinahahayag ng δύναμαι.
- source_word: καθαρίσαι
  choice: linisin
  rationale: Pinananatili ng “linisin” ang bokabularyo ng paglilinis sa halip na paliitin ang kahulugan sa “pagalingin”; maaari nitong saklawin kapuwa ang pisikal na paggaling at paglaya mula sa karumihang ritwal.
- source_word: ἔρχεται
  choice: Lumapit
  rationale: Sa aspektong Filipino, likas na naihahayag ng “lumapit” ang pagdating sa isang tao. Pinili ito sa halip na piliting tumbasan ang Griyegong historical present sa paraang magiging asiwa sa salaysay na Tagalog.
theological_decisions:
- issue: Kalikasan ng paglilinis sa konteksto ng ketong
  choice: linisin
  alternative: pagalingin
  rationale: Gumamit ang teksto ng pandiwa para sa paglilinis, hindi ng karaniwang pandiwa para sa pagpapagaling. Pinananatili nito ang ugnayan ng pisikal na pagpapanumbalik at ng pagiging malinis ayon sa ritwal nang hindi nilulutas ang tensiyon pabor sa isa lamang.
- issue: Kahulugan ng kondisyon sa Ἐὰν θέλῃς
  choice: Kung nais mo
  alternative: Kung kalooban mo
  rationale: Ang “Kung nais mo” ay malinaw na tumutukoy sa kahandaan o pagnanais ni Jesus at umiiwas sa posibleng mas malawak na sistematikong kahulugang maaaring ikabit sa salitang “kalooban.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Inuna ang pagkatao ng lalaki sa paglalarawan ng kanyang karamdaman. Pinanatili ang maikli at taimtim na pakiusap at ang bahagyang pag-uulit ng “sa kanya” na likas pa rin sa Tagalog at sumasalamin sa ayos ng pinagmulan.
