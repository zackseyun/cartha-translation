  text: καὶ ⸀εὐθὺς ἀπῆλθεν ἀπ’ αὐτοῦ ἡ λέπρα, καὶ ἐκαθαρίσθη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/042.yaml
  text: And immediately the leprosy left him[a], and he was cleansed.
translation:
  language: tl
  text: At agad na nawala sa kanya ang ketong, at siya ay nalinis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “siya ay naging malinis.” Ang pandiwa ay maaari ring tumukoy sa ritwal na paglilinis, hindi lamang sa pisikal na paggaling.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: agad
  rationale: Likas at malinaw sa modernong Tagalog ang “agad,” at pinananatili nito ang katangiang pagmamadali o kagyat na pagkilos sa salaysay ni Marcos.
- source_word: ἀπῆλθεν ἀπ’ αὐτοῦ
  choice: nawala sa kanya
  rationale: Bagaman literal na “umalis mula sa kanya,” ang “nawala sa kanya” ang natural na Tagalog kapag sakit ang simuno at malinaw nitong pinananatili ang diwang lumisan ito mula sa lalaki.
- source_word: ἡ λέπρα
  choice: ang ketong
  rationale: Ang “ketong” ang maikli at nakaugaliang salin sa Bibliya. Maaaring mas malawak ang saklaw ng λέπρα kaysa sa modernong Hansen's disease, kaya nililinaw ito sa talababa.
- source_word: ἐκαθαρίσθη
  choice: luminis siya
  rationale: Pinananatili ng “luminis” ang kahulugan ng καθαρίζω na kapwa tumutukoy sa pagkawala ng karamdaman at sa pagiging malinis ayon sa ritwal, sa halip na paliitin ito sa “gumaling.”
theological_decisions:
- issue: Ugnayan ng pisikal na paggaling at ritwal na kalinisan sa ἐκαθαρίσθη
  choice: luminis siya
  alternative: gumaling siya; nilinis siya
  rationale: 'Ang “luminis siya” ay natural sa konteksto at nagpapanatili sa dalawang sapin ng kahulugan: nawala ang sakit at naalis ang karumihang kaugnay nito. Hindi nito tahimik na nililimitahan ang pahayag sa pisikal na paggaling lamang.'
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Pinili ang “luminis siya” kaysa sa mas pormal ngunit posibleng mekanikal na “nilinis siya,” habang pinananatili sa talababa ang ritwal na pahiwatig at ang tunay na saklaw ng salitang Griyego.
