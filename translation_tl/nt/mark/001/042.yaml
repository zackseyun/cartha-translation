- from: At agad na nawala sa kanya ang ketong, at luminis siya.[a]
  to: At agad na nawala sa kanya ang ketong, at siya ay nalinis.[a]
  rationale: Pinalitan ang “luminis siya” ng “siya ay nalinis” upang maipakita ang pasibong anyo ng Griyego at mapanatili ang parehong pisikal at ritwal na saklaw ng καθαρίζω. Inalis ang “itinuring siyang malinis” dahil nagdaragdag ito ng deklaratibong diwang hindi tahasang nasa teksto.
