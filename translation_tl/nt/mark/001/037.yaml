  yaml_path: translation/nt/mark/001/037.yaml
  text: And they found him and said to him[a], “Everyone is looking for you.”
translation:
  language: tl
  text: At natagpuan nila siya at sinabi sa kanya, “Hinahanap ka ng lahat[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Lahat ay naghahanap sa iyo.” Ang Griyegong ζητοῦσίν ay maaari ring isaling “naghahanap,” ngunit sa kontekstong ito ay malamang na tumutukoy sa mga taong nagsisikap na matagpuan si Jesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὗρον
  choice: matagpuan
  rationale: Ang aorist ng εὑρίσκω ay nagsasaad na nagtagumpay ang paghahanap; natural sa salaysay ang “matagpuan.”
- source_word: λέγουσιν
  choice: sinabi
  rationale: Bagaman historical present sa Griyego, mas natural sa salaysay na Tagalog ang pangnagdaang “sinabi.”
- source_word: ὅτι
  choice: panandang tuwirang sipi
  rationale: Ipinakikita sa Tagalog sa pamamagitan ng kuwit at panipi ang pagpapakilala sa tuwirang sinabi.
- source_word: Πάντες
  choice: lahat
  rationale: Likas at maikli itong katumbas ng kolektibong πάντες, na tumutukoy sa mga tao sa konteksto at hindi kinakailangang sa bawat tao nang walang pasubali.
- source_word: ζητοῦσίν σε
  choice: Hinahanap ka
  rationale: Sa agarang konteksto, ang ζητέω ay tumutukoy sa pagsisikap ng mga tao na makita o matagpuan si Jesus; “hinahanap ka” ang pinakanatural na modernong Tagalog.
- source_word: καὶ
  choice: At nang
  rationale: Pinananatili nito ang ugnayang pasalaysay ng καί habang natural na ikinakabit ang pagkakatagpo sa sumunod na pagsasalita.
- source_word: αὐτὸν / αὐτῷ / σε
  choice: siya / sa kanya / ka
  rationale: Tuwirang isinasalin ang mga panghalip ayon sa kani-kanilang gamit sa pangungusap.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal ang ginamit. Pinanatili ang mabilis na daloy ng salaysay ni Marcos, at iniwasan ang mas pormal ngunit hindi gaanong karaniwang “hinahangad.”
