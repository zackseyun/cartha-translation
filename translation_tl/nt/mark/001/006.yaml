base_translation:
  language: en
  yaml_path: translation/nt/mark/001/006.yaml
  text: John was clothed with camel’s hair and a leather belt around his waist[a], and he was eating locusts and wild honey.
translation:
  language: tl
  text: Nakasuot si Juan ng damit na yari sa balahibo ng kamelyo at ng sinturong katad sa kaniyang baywang[a], at kumakain siya ng mga balang at ligaw na pulot-pukyutan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ipinapaalaala ng kasuotan ni Juan ang paglalarawan kay Elias sa 2 Hari 1:8, at nakatutulong ito sa paglalarawan ni Marcos kay Juan bilang propetikong tagapagpauna.
    reason: cross_reference
lexical_decisions:
- source_word: ἐνδεδυμένος τρίχας καμήλου
  choice: nakasuot ... ng damit na yari sa balahibo ng kamelyo
  rationale: Ipinahahayag ng perpektong partisipyong ἐνδεδυμένος ang kalagayan ni Juan bilang nakadamit. Nililinaw ng “damit na yari sa” na ang τρίχας καμήλου ay materyal ng kasuotan, hindi balat ng kamelyo.
- source_word: ζώνην δερματίνην
  choice: sinturong katad
  rationale: Ang ζώνη ay sinturon o bigkis sa baywang, at ang δερματίνην ay tumutukoy sa katad bilang materyal.
- source_word: περὶ τὴν ὀσφὺν αὐτοῦ
  choice: sa kaniyang baywang
  rationale: Natural at tumpak na katumbas sa modernong Filipino ng pariralang tumutukoy sa palibot ng baywang.
- source_word: ἔσθων
  choice: kumakain siya
  rationale: Ang pangkasalukuyang partisipyong ito ay naglalarawan ng nagpapatuloy o nakaugaliang pagkain ni Juan bilang bahagi ng kaniyang pangkalahatang paglalarawan.
- source_word: ἀκρίδας
  choice: mga balang
  rationale: Karaniwang leksikal na kahulugan nito ang insektong balang; walang batayan sa konteksto para sa ibang pakahulugan.
- source_word: μέλι ἄγριον
  choice: pulot-pukyutang ligaw
  rationale: Ipinahihiwatig ng ἄγριον na ang pulot-pukyutan ay mula sa ilang o ligaw, hindi inaalagaan.
- source_word: καὶ ἦν
  choice: Nakasuot si Juan
  rationale: Hindi ginamitan ng panimulang “At” sapagkat ang καί ay maaaring magsilbing simpleng pang-ugnay sa nagpapatuloy na salaysay; mas natural sa Filipino ang tuwirang pagsisimula habang napapanatili ng konteksto ang kaugnayan nito sa naunang talata.
theological_decisions:
- issue: Kasuotan at pagkain ni Juan kaugnay ng larawang propetiko
  choice: Panatilihing tuwirang paglalarawan ang pangunahing teksto at ilagay sa talababa ang pagkakahawig kay Elias.
  alternative: Tahasang tukuyin sa pangunahing teksto na inilalarawan si Juan bilang tulad ni Elias.
  rationale: Bagaman ipinapaalaala ng kasuotan ang paglalarawan kay Elias sa 2 Hari 1:8, hindi ito tahasang sinasabi ng Marcos 1:6. Iniiwasan ng salin na gawing pahayag sa teksto ang isang intertekstuwal na pahiwatig.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang “damit na yari sa balahibo ng kamelyo” upang maiwasan ang maling pagkaunawang balat ng kamelyo ang suot, at “baywang” sa halip na mas lipas o malabong katawagan.
