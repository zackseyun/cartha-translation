revisions:
- from: Ngunit pag-alis ng lalaki, sinimulan niyang ipahayag nang malawakan at ipamalita ang nangyari. Dahil dito, hindi na hayagang makapasok si Jesus sa alinmang bayan. Sa halip, nanatili siya sa labas, sa mga ilang na lugar. Gayunman, pinupuntahan siya ng mga tao mula sa lahat ng dako.
  to: Ngunit nang umalis ang lalaki, nagsimula siyang magpahayag nang malawakan at ipamalita ang mensahe, kaya hindi na hayagang makapasok si Jesus sa isang bayan. Sa halip, nanatili siya sa labas, sa mga ilang na lugar; at dinarayo siya ng mga tao mula sa lahat ng dako.
  rationale: Pinalitan ang interpretatibong “ang nangyari” ng “ang mensahe” upang masaklaw ang τὸν λόγον at umayon sa English audit trail na “the message.” Pinanatili ang malinaw na pagtukoy kay Jesus, ang sanhi-bungang ugnayan ng ὥστε, ang “nanatili” para sa ἦν, at ang aspektong nagpapatuloy ng ἤρχοντο sa “dinarayo.” Walang footnote na kailangan sapagkat walang tekstuwal na variant o ambiguity na kailangang markahan sa salin.
