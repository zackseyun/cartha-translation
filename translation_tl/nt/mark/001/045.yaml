id: MRK.1.45
reference: Mark 1:45
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ ἐξελθὼν ἤρξατο κηρύσσειν πολλὰ καὶ διαφημίζειν τὸν λόγον, ὥστε μηκέτι αὐτὸν δύνασθαι φανερῶς εἰς πόλιν εἰσελθεῖν, ἀλλὰ ἔξω ⸀ἐπ’ ἐρήμοις τόποις ἦν· καὶ ἤρχοντο πρὸς αὐτὸν ⸀πάντοθεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/045.yaml
  text: But after he went out, he began to proclaim widely and to spread the message, so that Jesus could no longer enter a town openly, but stayed outside in deserted places; and people were coming to him from everywhere.
translation:
  language: tl
  text: Ngunit nang umalis ang lalaki, nagsimula siyang magpahayag nang malawakan at ipamalita ang mensahe, kaya hindi na hayagang makapasok si Jesus sa isang bayan. Sa halip, nanatili siya sa labas, sa mga ilang na lugar; at dinarayo siya ng mga tao mula sa lahat ng dako.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξελθὼν
  choice: pag-alis ng lalaki
  rationale: Nililinaw ang paksa bilang lalaking pinagaling sa naunang konteksto, yamang maaaring maging malabo sa Tagalog ang payak na “pag-alis niya.”
- source_word: κηρύσσειν πολλὰ
  choice: ipahayag nang malawakan
  rationale: Ang πολλὰ ay idyomatikong nagpapahiwatig ng malawak o masigasig na pagpapahayag, hindi lamang ng maraming magkakahiwalay na bagay.
- source_word: διαφημίζειν τὸν λόγον
  choice: ipamalita ang nangyari
  rationale: Sa konteksto, ang λόγος ay ang ulat tungkol sa pagpapagaling; natural sa modernong Tagalog ang “ang nangyari” habang pinananatili ang diwa ng pagpapalaganap ng balita.
- source_word: φανερῶς
  choice: hayagan
  rationale: Tuwirang ipinapakita na hindi na makapasok si Jesus nang lantad o nakikita ng publiko.
- source_word: ἐπ’ ἐρήμοις τόποις
  choice: sa mga ilang na lugar
  rationale: Ang ἐρήμοις ay tumutukoy sa liblib at di-tinitirhang mga lugar, hindi kinakailangang tuyong disyerto.
- source_word: πάντοθεν
  choice: mula sa lahat ng dako
  rationale: Natural at tumpak na katumbas ng paglapit ng mga tao mula sa bawat direksiyon.
theological_decisions:
- issue: Tahimik na utos ni Jesus at pagsuway ng pinagaling
  choice: Hindi nagdagdag ng moral o teolohikal na pagsusuri; iniulat lamang ang malawakang pagpapahayag at bunga nito.
  alternative: Tawaging pagsuway o pagpapatotoo ang ginawa ng lalaki.
  rationale: Hindi tahasang binibigyan ng talata ng gayong interpretatibong katawagan ang kilos niya.
- issue: Referent ng αὐτόν sa “hindi na ... makapasok”
  choice: Pinangalanang “si Jesus.”
  alternative: Gamitin lamang ang “siya.”
  rationale: Si Jesus ang malinaw na tinutukoy ayon sa balarila at daloy ng salaysay; iniiwasan nito ang kalituhan sa lalaki.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maiikling pangungusap upang madaling masundan ang sanhi at bunga, nang hindi dinaragdagan ang nilalaman ng Griyego.
