    text: Maaari ring “nagkukumpuni” o “naghahanda” ng mga lambat. Ang pandiwang Griyego ay maaaring mangahulugang isaayos ang isang bagay o ibalik ito sa wastong kalagayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: προβὰς ὀλίγον
  choice: Pagkalakad niya nang kaunti pa
  rationale: Ipinahahayag nito ang panandaliang pagpapatuloy ng paglalakad at ang temporal na ugnayan ng aorist participle sa pangunahing pandiwa, sa natural na ayos ng modernong Tagalog.
- source_word: εἶδεν
  choice: nakita niya
  rationale: Payak na salaysay ito ng pagkakita at hindi nangangailangan ng dagdag na diin gaya ng “napansin.”
- source_word: Ἰάκωβον τὸν τοῦ Ζεβεδαίου
  choice: si Santiago na anak ni Zebedeo
  rationale: Tinutukoy ng pariralang Griyego si Santiago ayon sa kanyang ama; ginagamit ang nakaugaliang anyong Tagalog ng mga pangalan.
- source_word: Ἰωάννην τὸν ἀδελφὸν αὐτοῦ
  choice: ang kapatid nitong si Juan
  rationale: Pinakamalamang na tumutukoy ang αὐτοῦ kay Santiago. Nililinaw ng “nitong” ang ugnayan nang hindi nagdaragdag ng impormasyong wala sa teksto.
- source_word: ἐν τῷ πλοίῳ
  choice: Nasa bangka
  rationale: Tumutukoy ang tiyak na artikulo sa partikular na bangkang kinaroroonan nila; natural sa Tagalog ang sugnay na “Nasa bangka sila.”
- source_word: καὶ αὐτούς
  choice: rin sila
  rationale: Ang αὐτούς ay ikalawang layon ng “nakita,” at inilalarawan ng participle ang ginagawa nila. Ang paghahati sa ikalawang pangungusap at paggamit ng “rin” ay likas sa Tagalog at pinananatili ang diwang nakita rin silang magkapatid sa bangka.
- source_word: καταρτίζοντας
  choice: nag-aayos
  rationale: 'Malawak ang kahulugan ng καταρτίζω: isaayos, kumpunihin, ihanda, o ibalik sa wastong kalagayan. Ang “nag-aayos” ay natural sa konteksto ng mga lambat at hindi labis na nagpapasiya kung kinukumpuni o inihahanda ang mga ito.'
- source_word: τὰ δίκτυα
  choice: ng mga lambat
  rationale: Ang δίκτυα ay mga lambat sa pangingisda. Hindi dinagdagan ng tahasang pang-angkin na “kanilang” dahil wala nito sa Griyego.
