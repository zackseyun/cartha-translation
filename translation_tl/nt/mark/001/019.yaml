  yaml_path: translation/nt/mark/001/019.yaml
  text: And going on a little farther[a], he saw James the son of Zebedee and John his brother, and they were in the boat mending the nets,
translation:
  language: tl
  text: Nang magpatuloy siya nang kaunti, nakita niya si Santiago, na anak ni Zebedeo, at si Juan na kapatid nito, na kapwa nasa bangka at nag-aayos[a] ng mga lambat.
  philosophy: optimal-equivalence
  footnotes:
