source:
  edition: SBLGNT
  text: καὶ ⸀ἦν ἐν τῇ ἐρήμῳ ⸂τεσσεράκοντα ἡμέρας⸃ πειραζόμενος ὑπὸ τοῦ Σατανᾶ, καὶ ἦν μετὰ τῶν θηρίων, καὶ οἱ ἄγγελοι διηκόνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/013.yaml
  text: And he was in the wilderness forty days[a], being tempted by Satan; and he was with the wild animals, and the angels were ministering to him.
translation:
  language: tl
  text: At nasa ilang siya sa loob ng apatnapung araw, at tinutukso siya ni Satanas; kasama niya ang mababangis na hayop, at pinaglilingkuran siya ng mga anghel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρήμῳ
  choice: sa ilang
  rationale: Likas at kinikilalang salin ito para sa isang ilang o tiwangwang na pook. Hindi nito labis na tinutukoy ang lugar bilang mabuhanging disyerto, at napapanatili nito ang biblikal na kaugnayan ng ilang sa pagsubok.
- source_word: τεσσεράκοντα ἡμέρας
  choice: nang apatnapung araw
  rationale: Tuwirang ipinapahayag nito ang tagal ng pananatili ni Jesus nang hindi idinaragdag sa teksto ang maaaring biblikal na simbolismo ng bilang.
- source_word: πειραζόμενος
  choice: habang tinutukso
  rationale: Maaaring mangahulugan ang pandiwa ng pagtukso o pagsubok. Dahil si Satanas ang tahasang gumagawa nito, 'tinutukso' ang higit na likas sa konteksto, habang pinananatili sa talababa ang tunay na alternatibong 'sinusubok.'
- source_word: ὑπὸ τοῦ Σατανᾶ
  choice: ni Satanas
  rationale: Ang 'Satanas' ang nakaugaliang anyo ng personal na pangalan o titulo sa Filipino; malinaw rin ng panandang 'ni' na siya ang gumagawa ng pagtukso.
- source_word: μετὰ τῶν θηρίων
  choice: kasama niya ang mababangis na hayop
  rationale: Malinaw at kasalukuyang Filipino ang 'mababangis na hayop,' at ipinahihiwatig nito ang hindi maamo at maaaring mapanganib na kapaligiran nang hindi nagpapaliwanag nang higit sa teksto.
- source_word: ἄγγελοι
  choice: mga anghel
  rationale: Bagaman maaari ring mangahulugan ang ἄγγελος na mga sugo, malinaw sa konteksto ng supernatural na tunggalian at paglilingkod na mga makalangit na nilalang ang tinutukoy.
- source_word: διηκόνουν αὐτῷ
  choice: pinaglilingkuran siya
  rationale: Ipinahahayag ng anyong ito ang patuloy na paglilingkod ng mga anghel sa kanya at pinananatili ang marangal na himig ng salaysay.
- source_word: καὶ ἦν ... καὶ ἦν ... καὶ
  choice: At naroon siya ...; at kasama niya ...; at pinaglilingkuran siya ...
  rationale: Pinananatili ang sunod-sunod na mga sugnay na pinag-uugnay ng 'at,' na katangian ng estilo ni Marcos, samantalang ginagamit ang tuldok-kuwit upang maging malinaw sa modernong mambabasa.
theological_decisions:
- issue: Kahulugan ng πειραζόμενος kaugnay ng pagkilos ni Satanas
  choice: tinutukso
  alternative: sinusubok
  rationale: Saklaw ng salitang Griyego ang parehong pagtukso at pagsubok. Mas malamang ang masamang layuning ipinahihiwatig ng 'tinutukso' dahil si Satanas ang tahasang gumagawa nito, ngunit hindi inaalis ang lehitimong kahulugang 'sinusubok,' kaya inilalahad iyon sa talababa.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang tradisyonal ngunit nauunawaang 'sa ilang' at 'mga anghel,' at iniwasan ang arkaikong pananalita. Bahagyang pinanatili ang paulit-ulit na parataktikong estilo ni Marcos sa pamamagitan ng magkakasunod na 'at.'
