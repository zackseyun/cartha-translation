  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἀναβαίνων ⸀ἐκ τοῦ ὕδατος εἶδεν σχιζομένους τοὺς οὐρανοὺς καὶ τὸ πνεῦμα ⸀ὡς περιστερὰν καταβαῖνον ⸀εἰς αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/010.yaml
  text: And immediately[a], as he was coming up out of the water[b], he saw the heavens being torn open and the Spirit descending like a dove upon him.
translation:
  language: tl
  text: At agad, habang umaahon siya mula sa tubig, nakita niyang napupunit ang mga langit[a] at bumababa sa kanya[b] ang Espiritu na tulad ng kalapati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nahahati ang mga langit.” Mas malakas ang pandiwang Griyego kaysa sa simpleng “bumubukas.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa loob niya.” Maaaring mangahulugan ang Griyegong εἰς ng “papasok sa,” ngunit natural ding tumukoy rito sa pagbaba ng Espiritu patungo sa kanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: agad
  rationale: Pinananatili ang katangi-tanging mabilis at masiglang takbo ng salaysay ni Marcos sa natural na modernong Tagalog.
- source_word: ἀναβαίνων ἐκ τοῦ ὕδατος
  choice: habang umaahon siya mula sa tubig
  rationale: Ipinapakita ng “habang” na kasabay ng pagkakita ang pag-ahon; natural sa Tagalog ang “mula sa tubig” bilang katumbas ng ἐκ sa kontekstong ito.
- source_word: εἶδεν
  choice: nakita niya
  rationale: Tuwiran at payak na salin ng pandiwa ng pagkakita.
- source_word: σχιζομένους τοὺς οὐρανούς
  choice: napupunit ang mga langit
  rationale: Ang “napupunit” ay nagpapanatili sa marahas at matingkad na lakas ng σχίζω, na higit sa simpleng “bumubukas”; ang “mga langit” ay nagpapanatili sa tahasang pangmaramihan.
- source_word: τὸ πνεῦμα
  choice: ang Espiritu
  rationale: Malinaw sa konteksto na Espiritu ng Diyos ang tinutukoy, ngunit hindi idinagdag ang “Banal” sapagkat wala ito sa mismong pariralang Griyego.
- source_word: ὡς περιστερὰν
  choice: na tulad ng kalapati
  rationale: Pinananatili ang paghahambing nang hindi tinutukoy kung anyo, galaw, o ibang katangian ng kalapati ang punto ng pagkakatulad.
- source_word: καταβαῖνον
  choice: bumababa
  rationale: Natural at malinaw na modernong Tagalog para sa kasalukuyang participle, at ipinakikitang nasasaksihan ang kilos habang nagaganap.
- source_word: εἰς αὐτόν
  choice: sa kanya
  rationale: Ang “sa kanya” ay likas na Tagalog para sa patutunguhan ng pagbaba ng Espiritu at hindi sapilitang nagpapasiya sa pagitan ng “upon” at literal na “into.”
theological_decisions:
- issue: Pagkakakilanlan ng “Espiritu”
  choice: ang Espiritu
  alternative: ang Banal na Espiritu
  rationale: Itinuturo ng konteksto ang Espiritu ng Diyos, ngunit τὸ πνεῦμα lamang ang nakasulat; kaya hindi dinagdagan ng pang-uring “Banal.”
- issue: Saklaw ng paghahambing sa kalapati
  choice: na tulad ng kalapati
  alternative: sa anyo ng kalapati / bumabang gaya ng paglipad ng kalapati
  rationale: Hindi nililinaw ng ὡς περιστερὰν kung anyo o paraan ng pagbaba ang inihahambing, kaya pinananatiling bukas ang kahulugan.
- issue: Kahulugan ng εἰς αὐτόν
  choice: sa kanya
  alternative: sa loob niya
  rationale: Pinananatili ng “sa kanya” ang direksiyon ng pagbaba nang hindi ipinipilit na ang Espiritu ay pumasok sa loob niya, bagaman maaaring magkaroon ng gayong literal na saklaw ang εἰς.
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Ginamit ang “mga langit” upang mapanatili ang biblikal na himig at pangmaramihan ng Griyego; iniwasan ang arkaikong pananalita at ang pagdaragdag ng paliwanag sa pangunahing teksto.
