  naturalness: Mas likas at marangal sa modernong Filipino ang “matapos isuko si Juan” kaysa “matapos maipasa sa mga kamay ng iba.” Ang “habang ipinapahayag” ay malinaw na ikinakabit ang pangangaral/pagpapahayag sa pagdating ni Jesus nang hindi ginagawang isang simpleng kasunod na naganap na kilos.
  terminology: Ang “mabuting balita ng Diyos” ay malinaw at pinananatili ang lawak ng genitive τοῦ θεοῦ. Ang “isuko” ay hindi katumbas ng “maaresto,” kaya hindi nito pinipilit ang mas makitid na pagbasa; ang alternatibong ito ay angkop sa talababa.
