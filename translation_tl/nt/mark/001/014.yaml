  text: ⸂Καὶ μετὰ⸃ τὸ παραδοθῆναι τὸν Ἰωάννην ἦλθεν ὁ Ἰησοῦς εἰς τὴν Γαλιλαίαν κηρύσσων τὸ ⸀εὐαγγέλιον τοῦ θεοῦ
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/014.yaml
  text: And after John was handed over[a], Jesus came into Galilee[c][b], proclaiming the good news of God.
translation:
  language: tl
  text: Matapos isuko si Juan[a], pumunta si Jesus sa Galilea, habang ipinapahayag niya ang mabuting balita ng Diyos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “matapos maaresto si Juan.” Mas literal na ipinahihiwatig ng Griyego na “matapos isuko si Juan,” isang pananalitang umaalingawngaw rin sa paglalarawan ni Marcos sa kalaunang pagsuko kay Jesus.
    reason: lexical_alternative
  - marker: b
    text: Ang “mabuting balita ng Diyos” ay maaaring mangahulugang mabuting balitang mula sa Diyos, pag-aari ng Diyos, o nakasentro sa Diyos.
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ τὸ παραδοθῆναι
  choice: matapos maipasa sa mga kamay ng iba
  rationale: Ipinahahayag ng μετά kasama ang articular infinitive ang panahong “matapos.” Pinananatili ng “maipasa sa mga kamay ng iba” ang diwa ng παραδίδωμι na ibigay o ipasa sa kapangyarihan ng iba, pati ang ugnayan nito sa bokabularyo ng paghihirap ni Jesus sa Marcos, nang hindi nililimitahan agad sa “arestuhin.”
- source_word: Ἰωάννην
  choice: Juan
  rationale: Ito ang nakaugaliang anyo ng pangalang Ἰωάννης sa makabagong saling Tagalog ng Bibliya.
- source_word: ἦλθεν
  choice: pumunta
  rationale: Likas sa Tagalog ang “pumunta” para sa pagdating ni Jesus sa Galilea; hindi ipinapahiwatig ng konteksto na nasa Galilea ang tagapagsalaysay o mambabasa kaya hindi kailangan ang deiktikong “pumunta rito.”
- source_word: εἰς τὴν Γαλιλαίαν
  choice: sa Galilea
  rationale: Sa Tagalog, natural na ipinahahayag ng “pumunta sa Galilea” ang direksiyonal na lakas ng εἰς nang hindi nangangailangan ng artipisyal na katumbas ng Ingles na “into.”
- source_word: κηρύσσων
  choice: ipinahayag
  rationale: Ang κηρύσσω ay pampublikong paghahayag gaya ng ginagawa ng isang tagapagbalita. Malinaw at dignified ang “ipinahayag,” at hindi ito nililimitahan sa pormal na pangangaral.
- source_word: εὐαγγέλιον
  choice: mabuting balita
  rationale: Tuwirang ipinababatid ng “mabuting balita” ang karaniwang leksikal na kahulugan ng εὐαγγέλιον sa modernong Tagalog; mas malinaw ito sa pangkalahatang mambabasa kaysa sa terminong “ebanghelyo.”
- source_word: τοῦ θεοῦ
  choice: ng Diyos
  rationale: 'Pinananatili ng “ng Diyos” ang lawak ng genitive: maaaring ang balita ay mula sa Diyos, pag-aari o gawa ng Diyos, o nakasentro sa Diyos.'
theological_decisions:
- issue: Pagkakasalin ng παραδοθῆναι kaugnay ng paulit-ulit na bokabularyo ng pagpapasakit sa Marcos
  choice: maipasa sa mga kamay ng iba
  alternative: maaresto
  rationale: Pinananatili ng pangunahing salin ang ideya ng hostile transfer o pagpapasailalim sa kapangyarihan ng iba, gayundin ang alingawngaw nito sa kalaunang pagkakapasa kay Jesus. Ipinapaliwanag sa talababa ang mas natural na kontekstuwal na alternatibong “maaresto.”
- issue: Saklaw ng genitive sa τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: ang mabuting balita ng Diyos
  alternative: ang mabuting balitang mula sa Diyos / tungkol sa Diyos
  rationale: Hindi ipinapasiya ng Griyego kung ito ay pangunahing pinagmulan, pagmamay-ari, o paksa. Pinananatili ng “ng Diyos” ang tunay na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino Tagalog. Ginamit ang “mabuting balita” sa halip na mas eklesyastikong “ebanghelyo.” Bahagyang di-karaniwan ngunit mauunawaan ang “maipasa sa mga kamay ng iba” upang mapanatili ang mahalagang ugnayang leksikal sa salaysay ni Marcos; nililinaw ng talababa ang idiomatikong “maaresto.”
