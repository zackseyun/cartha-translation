  yaml_path: translation/nt/mark/001/001.yaml
  text: The beginning of the good news of Jesus the Messiah[a][b].
translation:
  language: tl
  text: Ang simula ng mabuting balita[a] ni Jesus, ang Mesiyas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ebanghelyo.” Ang salitang Griyego na εὐαγγέλιον ay maaaring isaling “mabuting balita” o, ayon sa tradisyon, “ebanghelyo.”
    reason: lexical_alternative
  - marker: b
    text: O “Cristo.” Ang salitang Griyego na Χριστός ay nangangahulugang “Mesiyas” kapag ginagamit bilang titulo.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀρχὴ
  choice: Ang simula
  rationale: Pinananatili ang anyong pambungad na pariralang pangngalan. Likas sa Tagalog ang paglalagay ng “ang,” kahit walang artikulo ang pangngalang Griyego.
- source_word: εὐαγγελίου
  choice: mabuting balita
  rationale: Tuwirang ipinapahayag ang kahulugan ng εὐαγγέλιον sa malinaw at kasalukuyang Tagalog; inilalagay sa talababa ang tradisyonal na “ebanghelyo.”
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Ginamit ang karaniwang anyo ng pangalang ito sa modernong Tagalog.
- source_word: χριστοῦ
  choice: ang Mesiyas
  rationale: Dito, ang Χριστός ay nauunawaan bilang titulo ni Jesus. Isinalin ang titulo sa halip na ituring na apelyido o bahagi lamang ng pangalan.
theological_decisions:
- issue: Kung isasalin ang Χριστοῦ bilang titulo o pananatilihin ang tradisyonal na anyong “Cristo”
  choice: ang Mesiyas
  alternative: Cristo
  rationale: Sa pambungad na ito, kinikilala si Jesus ayon sa kaniyang mesiyanikong katungkulan. Ang “ang Mesiyas” ay malinaw na titulo at hindi apelyido, habang pinananatili sa talababa ang tradisyonal na alternatibo.
- issue: Saklaw ng genitibong Ἰησοῦ χριστοῦ kaugnay ng εὐαγγελίου
  choice: tungkol kay Jesus, ang Mesiyas
  alternative: ni Jesus na Mesiyas
  rationale: Ang “tungkol kay” ay natural sa Tagalog at ipinahihiwatig na si Jesus na Mesiyas ang nilalaman o paksa ng mabuting balita. Ang payak na “ni Jesus” ay maaaring madaling maunawaan bilang pagmamay-ari o eksklusibong pinagmulan nito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal. Ginamit ang “mabuting balita” para madaling maunawaan, at ang “Mesiyas” upang hayagang mapanatili ang katangian nitong titulo.
