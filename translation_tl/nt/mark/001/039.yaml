id: MRK.1.39
reference: Mark 1:39
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ⸀ἦλθεν κηρύσσων ⸂εἰς τὰς συναγωγὰς⸃ αὐτῶν εἰς ὅλην τὴν Γαλιλαίαν καὶ τὰ δαιμόνια ἐκβάλλων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/039.yaml
  text: And he went throughout all Galilee[a], preaching in their synagogues and casting out demons.
translation:
  language: tl
  text: At nilibot niya ang buong Galilea[a], nangangaral sa kanilang mga sinagoga at nagpapalayas ng mga demonyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “At pumunta siya at nangaral sa kanilang mga sinagoga sa buong Galilea at nagpalayas ng mga demonyo.” Maaari ring isalin ang pandiwang Griyego na “pumunta” o “dumating,” ngunit sa konteksto ay malamang na inilalarawan nito ang paglalakbay niya sa iba’t ibang dako ng rehiyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: nilibot niya
  rationale: Bagaman ang karaniwang kahulugan ng ἔρχομαι ay “pumunta” o “dumating,” ipinahihiwatig ng pariralang tumutukoy sa buong Galilea at ng konteksto ang paglalakbay ni Jesus sa iba’t ibang lugar sa rehiyon. Likas sa modernong Tagalog ang “nilibot niya” para sa ganitong pagkilos.
- source_word: κηρύσσων
  choice: nangangaral
  rationale: Ang κηρύσσω ay tumutukoy sa hayagang pagpapahayag. Ang “nangangaral” ay malinaw at natural sa konteksto ng mga sinagoga.
- source_word: εἰς τὰς συναγωγὰς αὐτῶν
  choice: sa kanilang mga sinagoga
  rationale: Bagaman literal na maaaring ipakahulugang “papasok sa,” dito ay ipinakikita ng εἰς ang lugar o saklaw ng pangangaral. Pinanatili ng “kanilang” ang αὐτῶν.
- source_word: εἰς ὅλην τὴν Γαλιλαίαν
  choice: ang buong Galilea
  rationale: Kasama ng “nilibot,” malinaw na ipinahahayag nito ang pagkilos sa iba’t ibang dako ng buong rehiyon at pinananatili ang ὅλην.
- source_word: τὰ δαιμόνια
  choice: mga demonyo
  rationale: Ang δαιμόνια ay tuwirang tumutukoy sa mga demonyo. Hindi kailangan sa Tagalog ang tiyak na pantukoy sapagkat inilalarawan dito ang pangkalahatang gawain ni Jesus.
- source_word: ἐκβάλλων
  choice: nagpapalayas
  rationale: Sa konteksto ng eksorsismo, ang ἐκβάλλω ay nangangahulugang magpalayas o magtaboy. Ang “nagpapalayas” ay natural at karaniwang gamit sa modernong Tagalog.
theological_decisions:
- issue: Kalikasan ng δαιμόνια
  choice: Isinalin bilang “mga demonyo,” na nagpapahiwatig ng mga personal na espirituwal na nilalang ayon sa karaniwang diwa ng teksto.
  alternative: masasamang espiritu
  rationale: Ang “mga demonyo” ang pinakatuwirang katumbas ng δαιμόνια at hindi nagdaragdag ng doktrinal na paliwanag na wala sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “nilibot” upang natural na maipahayag ang paglalakbay sa buong rehiyon, habang inilagay sa talababa ang mas literal na alternatibo at ang tunay na ambiguwidad ng pandiwang Griyego.
