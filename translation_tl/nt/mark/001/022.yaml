  text: καὶ ἐξεπλήσσοντο ἐπὶ τῇ διδαχῇ αὐτοῦ, ἦν γὰρ διδάσκων αὐτοὺς ὡς ἐξουσίαν ἔχων καὶ οὐχ ὡς οἱ γραμματεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/022.yaml
  text: And they were astonished at his teaching[a], for he was teaching them as one having authority, and not as the scribes.
translation:
  language: tl
  text: Namangha sila sa kanyang pagtuturo, sapagkat nagtuturo siya sa kanila bilang isang may awtoridad, at hindi gaya ng mga eskriba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξεπλήσσοντο
  choice: Namangha sila
  rationale: Ipinahahayag ang matinding pagkamangha ng mga nakikinig. Natural ito sa makabagong Tagalog; ang di-ganap na aspekto ng Griyego ay naipauunawa ng konteksto ng nagpapatuloy na pagtuturo.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: sa kanyang pagtuturo
  rationale: Ang διδαχή ay maaaring tumukoy sa nilalaman o paraan ng pagtuturo. Pinananatili ng “pagtuturo” ang lawak na iyon at mas natural kaysa “doktrina” sa kontekstong pasalaysay.
- source_word: ἦν γὰρ διδάσκων
  choice: sapagkat nagtuturo siya sa kanila
  rationale: Pinananatili ng aspektong nagaganap ng “nagtuturo” ang periphrastic na ἦν + participle at malinaw na iniuugnay ang dahilan ng kanilang pagkamangha.
- source_word: ὡς ἐξουσίαν ἔχων
  choice: bilang isang may awtoridad
  rationale: Malapit nitong pinananatili ang paghahambing na ipinahahayag ng ὡς at ang diwa ng ἐξουσία bilang lehitimong awtoridad o karapatang magsalita at kumilos.
- source_word: γραμματεῖς
  choice: mga eskriba
  rationale: Direktang katawagan ito sa mga Judiong dalubhasa at tagapagturo ng Kautusan. Iniiwasan nitong gawing paliwanag ang mismong salin.
theological_decisions:
- issue: Ang likas at pinagmulan ng awtoridad ni Jesus kumpara sa mga eskriba
  choice: Ilarawan lamang si Jesus bilang “isang may awtoridad.”
  alternative: “may banal na awtoridad” o iba pang tahasang paliwanag sa pinagmulan ng kanyang awtoridad
  rationale: Malinaw sa talata ang kaibahan ng paraan ng pagtuturo ni Jesus at ng mga eskriba, ngunit hindi nito tahasang tinutukoy rito kung saan nagmumula o kung ano ang ontolohikal na likas ng awtoridad na iyon. Kaya pinananatili ang pahayag nang hindi dinaragdagan ng doktrinal na paliwanag.
translation_notes:
  register: Makabago, dignificado, at madaling maunawaang Filipino. Ginamit ang “eskriba” bilang tumpak na terminong historikal; ang “bilang isang may awtoridad” ay bahagyang pormal ngunit natural at nagpapanatili sa estruktura at paghahambing ng Griyego.
