  text: ἐγένετο Ἰωάννης ⸀ὁ βαπτίζων ἐν τῇ ⸀ἐρήμῳ κηρύσσων βάπτισμα μετανοίας εἰς ἄφεσιν ἁμαρτιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/004.yaml
  text: John the Baptist appeared in the wilderness[a], proclaiming a baptism of repentance for the forgiveness of sins.
translation:
  language: tl
  text: Dumating si Juan Bautista[a] sa ilang, na nagpapahayag ng bautismo ng pagsisisi para sa kapatawaran ng mga kasalanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “si Juan na Tagapagbautismo.” Tahasang inilalarawan ng pariralang Griyego si Juan ayon sa gawain niyang pagbabautismo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: Dumating
  rationale: Sa salaysay ni Marcos, ipinakikilala ng ἐγένετο ang pagdating ni Juan sa tagpo. Likas sa Filipino ang “dumating” at iniiwasan nito ang di-likas na literal na “nangyari” o ang maaaring magpahiwatig ng bigla o mahiwagang pagpapakita na “lumitaw.”
- source_word: Ἰωάννης
  choice: Juan
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa Filipino.
- source_word: ὁ βαπτίζων
  choice: Bautista
  rationale: Ang may artikulong pandiwaring ito ay kumikilala kay Juan ayon sa gawain niyang pagbabautismo. Ang “Juan Bautista” ang natural at kinikilalang titulo sa Filipino; pinananatili sa talababa ang mas tahasang paglalarawan sa tungkulin niya.
- source_word: ἐν τῇ ἐρήμῳ
  choice: sa ilang
  rationale: Ang “ilang” ay angkop sa heograpiya at nagpapanatili sa biblikal na diwa ng ἔρημος nang hindi ipinapalagay na mabuhanging disyerto ito.
- source_word: κηρύσσων
  choice: ipinahayag niya
  rationale: Ipinahihiwatig ng “ipinahayag” ang hayagang paghahatid ng mensahe na taglay ng κηρύσσω, sa natural na modernong Filipino.
- source_word: βάπτισμα
  choice: bautismo
  rationale: Ito ang kinikilala at tumpak na katawagan sa Filipino para sa gawaing tinutukoy ng βάπτισμα.
- source_word: μετανοίας
  choice: ng pagsisisi
  rationale: Pinananatili ng “pagsisisi” ang moral at espirituwal na diwa ng μετανοία at ang ugnayang genitibo nito sa bautismo nang hindi ito labis na ipinapaliwanag.
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: para sa kapatawaran ng mga kasalanan
  rationale: Natural na ipinapahayag ng “para sa” ang layunin o bunga nang hindi pinagpapasiyahan kung instrumental, simboliko, o deklaratibo ang bautismo. Pinananatili rin ang tahasang maramihan ng ἁμαρτιῶν sa “mga kasalanan.”
theological_decisions:
- issue: Ugnayan ng bautismo, pagsisisi, at kapatawaran
  choice: “ang bautismo ng pagsisisi para sa kapatawaran ng mga kasalanan”
  alternative: “ang bautismong sumasagisag sa pagsisisi upang mapatawad ang mga kasalanan” o “ang bautismong nagdudulot ng kapatawaran sa pamamagitan ng pagsisisi”
  rationale: Isinasaad ng Griyego ang ugnayan ng mga konsepto ngunit hindi nito hinihingi sa tagapagsalin na lutasin ang mga sumunod na pagtatalong doktrinal tungkol sa bisa ng bautismo. Pinananatili ng salin ang tunay na teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino na natural, marangal, at madaling maunawaan. Ginamit ang nakaugaliang “Juan Bautista” sa pangunahing teksto, habang nililinaw sa talababa ang mas literal na kahulugan ng titulong Griyego. Ang “sa ilang” ay nagpapanatili ng biblikal na himig nang hindi nagiging makaluma.
