base_translation:
  language: en
  yaml_path: translation/nt/mark/001/032.yaml
  text: When evening came[a], when the sun had set[d][c][b], they brought to him all who were sick and those who were demon-possessed.
translation:
  language: tl
  text: Pagsapit ng gabi, nang lumubog na ang araw, dinadala nila sa kanya ang lahat ng maysakit at ang mga sinasapian ng mga demonyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang mga nasa kapangyarihan ng mga demonyo.”
    reason: Pinananatili ang lawak ng posibleng kahulugan ng δαιμονιζομένους nang hindi itinatanggi o labis na tinutukoy ang uri ng pagkilos ng mga demonyo.
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: Nang gumabi na
  rationale: Likas at malinaw na temporal na pananalita sa modernong Tagalog; pinananatili ang paglipat ng tagpo na ipinahihiwatig ng genitive absolute.
- source_word: ὅτε ἔδυ ὁ ἥλιος
  choice: nang lumubog ang araw
  rationale: Tuwirang pinananatili ang ὅτε bilang “nang” at ang pagkakasunod sa naunang pahayag tungkol sa paggabi, nang hindi tahasang ginagawang “pagkatapos” ang ugnayan.
- source_word: ἔφερον
  choice: patuloy nilang dinadala
  rationale: Ipinahahayag ang nagpapatuloy o paulit-ulit na kilos ng imperfect, habang nananatiling likas sa salaysay na Tagalog.
- source_word: πρὸς αὐτὸν
  choice: sa kanya
  rationale: Tumpak na nagsasaad ng paglapit o pagdadala tungo sa taong tinutukoy; hindi inuulit ang pangalang Jesus dahil panghalip ang nasa Griyego.
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: ang lahat ng maysakit
  rationale: Ang idyomang Griyego ay tumutukoy sa mga may masamang kalagayan ng katawan o maysakit; malinaw at natural ang “lahat ng maysakit.”
- source_word: τοὺς δαιμονιζομένους
  choice: ang mga sinasapian ng demonyo
  rationale: Karaniwang nauunawaang Tagalog na nagpapanatili sa tahasang pagtukoy ng teksto sa kapangyarihan o pagkilos ng demonyo, nang hindi ito ipinapantay lamang sa karamdaman.
theological_decisions:
- issue: Saklaw ng kahulugan ng δαιμονιζομένους
  choice: mga sinasapian ng demonyo
  alternative: mga nasa kapangyarihan ng mga demonyo
  rationale: Pinananatili ng pangunahing salin ang matindi at personal na pagkilos ng demonyo na ipinahihiwatig ng salita. Inilalagay sa talababa ang mas malawak na posibleng pagpapahayag upang hindi magtakda ng detalyadong demonolohiya na hindi mismo nililinaw ng talata.
- issue: Aspekto ng ἔφερον
  choice: patuloy nilang dinadala
  alternative: dinala nila
  rationale: Ang imperfect ay naglalarawan ng nagpapatuloy o paulit-ulit na pagdadala ng mga tao kay Jesus; ang “patuloy” ay malinaw na naghahatid nito sa Tagalog.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Pinanatili ang dalawang magkaugnay na pahayag-panahon (“gumabi” at “lumubog ang araw”) at ginamit ang “patuloy nilang dinadala” upang maipakita ang nagpapatuloy na kilos sa salaysay.
