  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: περὶ δὲ τῶν νεκρῶν ὅτι ἐγείρονται οὐκ ἀνέγνωτε ἐν τῇ βίβλῳ Μωϋσέως ἐπὶ τοῦ βάτου ⸀πῶς εἶπεν αὐτῷ ὁ θεὸς λέγων· Ἐγὼ ὁ θεὸς Ἀβραὰμ καὶ ⸂ὁ θεὸς Ἰσαὰκ καὶ ὁ⸃ θεὸς Ἰακώβ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/026.yaml
  text: And concerning the dead[a], that they are raised, have you not read in the book of Moses, in the passage about the bush, how God spoke to him, saying, ‘I am the God of Abraham and the God of Isaac and the God of Jacob’?”
translation:
  language: tl
  text: At tungkol naman sa mga patay—na sila ay binubuhay na muli—hindi ba ninyo nabasa sa aklat ni Moises, sa bahagi tungkol sa palumpong[a], kung paano sinabi ng Diyos sa kanya, ‘Ako ang Diyos ni Abraham at ang Diyos ni Isaac at ang Diyos ni Jacob’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa palumpong.” Maaaring tukuyin ng pananalitang Griyego ang bahagi ng Kasulatan ayon sa tagpo ng palumpong.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ τῶν νεκρῶν
  choice: At tungkol sa mga patay
  rationale: Ipinakikilala ng περὶ na may genitibo ang paksang tinatalakay. Ang “At” ay magaan na pang-ugnay para sa δέ at hindi nagpapalabis ng pagsalungat.
- source_word: ὅτι ἐγείρονται
  choice: na sila ay muling binubuhay
  rationale: Pinananatili nito ang anyong pasibo ng ἐγείρονται at malinaw na tumutukoy sa muling pagkabuhay, nang hindi tahasang dinaragdagan kung sino ang kumikilos.
- source_word: οὐκ ἀνέγνωτε
  choice: hindi ba ninyo nabasa
  rationale: Natural itong pormula ng retorikal na tanong sa Filipino at angkop sa pag-apela ni Jesus sa Kasulatan.
- source_word: ἐν τῇ βίβλῳ Μωϋσέως
  choice: sa aklat ni Moises
  rationale: Ang βίβλος ay maaaring aklat o balumbon; “aklat ni Moises” ang malinaw at karaniwang katawagan sa modernong Filipino.
- source_word: ἐπὶ τοῦ βάτου
  choice: sa bahagi tungkol sa mababang punongkahoy
  rationale: Sa konteksto, maaaring tukuyin ng parirala ang bahagi ng Kasulatan ayon sa tagpo ng mababang punongkahoy. Ginagawang malinaw ng “sa bahagi tungkol sa” ang tungkulin nitong pantukoy sa sipi habang itinatala sa talababa ang mas literal na posibilidad.
- source_word: πῶς εἶπεν αὐτῷ ὁ θεὸς λέγων
  choice: kung paanong sinabi sa kanya ng Diyos
  rationale: Natural na ipinakikilala ng pariralang Filipino ang tuwirang sipi. Hindi na hiwalay na isinalin ang λέγων sapagkat magiging paulit-ulit at di-likas ang “sinabi ... na sinasabi” sa Filipino.
- source_word: Ἐγὼ ὁ θεὸς Ἀβραὰμ καὶ ὁ θεὸς Ἰσαὰκ καὶ ὁ θεὸς Ἰακώβ
  choice: Ako ang Diyos ni Abraham at ang Diyos ni Isaac at ang Diyos ni Jacob
  rationale: Pinananatili ang kasalukuyang pagpapakilala sa sarili at ang tatlong ulit na “ang Diyos ni,” na mahalaga sa diin at pangangatwiran ng sipi.
theological_decisions:
- issue: Ang wikang tumutukoy sa muling pagkabuhay sa ὅτι ἐγείρονται
  choice: na sila ay muling binubuhay
  alternative: na sila ay muling nabubuhay
  rationale: Pinananatili ng pinili ang pasibong anyo ng Griyego at ang pahiwatig na ang muling pagkabuhay ay ginagawa sa kanila, ngunit hindi tahasang nagdaragdag ng gumagawa.
- issue: Ang kasalukuyang pagpapakilala ng Diyos sa sarili at ang inuulit na katawagan
  choice: Ako ang Diyos ni Abraham at ang Diyos ni Isaac at ang Diyos ni Jacob
  alternative: Ako ang Diyos nina Abraham, Isaac, at Jacob
  rationale: Hindi pinaiikli ang pahayag sapagkat mahalaga sa pangangatwiran ni Jesus ang anyo ng sipi at ang paulit-ulit na pagkakaugnay ng Diyos sa bawat patriyarka.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mababang punongkahoy” sa halip na mas teknikal o di-pamilyar na pangalan ng halaman. Ang mga gitling ay tumutulong na mapanatili ang sintaktikong pagsingit ng “na sila ay muling binubuhay” nang hindi ginagawang ibang pangunahing paksa ang pangungusap.
