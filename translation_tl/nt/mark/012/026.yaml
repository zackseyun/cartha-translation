  naturalness: Natural ang pangunahing ayos ng pangungusap at ang “hindi ba ninyo nabasa.” Mas natural at tiyak sa modernong Filipino ang “palumpong” kaysa “mababang punongkahoy.” Ang “binubuhay na muli” ay malinaw na pangkalahatang pahayag tungkol sa muling pagkabuhay at napapanatili ang pasibong anyo.
  terminology: Pinananatili ang “muling binubuhay”/“binubuhay na muli” para sa ἐγείρονται at ang buong, inuulit na “Diyos ni ...” sa sipi. Ginamit ang “palumpong” bilang karaniwang modernong katumbas ng βάτος nang hindi nagdaragdag ng “nagliliyab,” na wala sa mismong Griyegong parirala.
