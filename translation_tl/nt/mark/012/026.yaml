revisions:
- from: At tungkol sa mga patay—na sila ay muling binubuhay—hindi ba ninyo nabasa sa aklat ni Moises, sa bahagi tungkol sa mababang punongkahoy[a], kung paanong sinabi sa kanya ng Diyos, ‘Ako ang Diyos ni Abraham at ang Diyos ni Isaac at ang Diyos ni Jacob’?”
  to: At tungkol naman sa mga patay—na sila ay binubuhay na muli—hindi ba ninyo nabasa sa aklat ni Moises, sa bahagi tungkol sa palumpong[a], kung paano sinabi ng Diyos sa kanya, ‘Ako ang Diyos ni Abraham at ang Diyos ni Isaac at ang Diyos ni Jacob’?”
  rationale: Pinalitan ang “mababang punongkahoy” ng “palumpong,” ang wastong at likas na katumbas ng βάτος. Bahagyang inayos ang ayos ng “binubuhay na muli” upang maging malinaw sa modernong Filipino ang pangkalahatang pahayag, nang hindi inaalis ang pasibong diin ng Griyego. Pinanatili ang hindi binagong saklaw ng sipi, ang retorikal na tanong, at ang tatlong ulit na “ang Diyos ni.”
