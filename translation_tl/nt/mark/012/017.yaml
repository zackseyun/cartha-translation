  text: ⸂ὁ δὲ⸃ Ἰησοῦς εἶπεν ⸀αὐτοῖς· ⸂Τὰ Καίσαρος ἀπόδοτε⸃ Καίσαρι καὶ τὰ τοῦ θεοῦ τῷ θεῷ. καὶ ⸀ἐξεθαύμαζον ἐπ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/017.yaml
  text: But Jesus said to them[a], “Give back to Caesar the things that are Caesar’s, and to God the things that are God’s.” And they were utterly amazed at him.
translation:
  language: tl
  text: Ngunit sinabi sa kanila ni Jesus, “Ibalik ninyo kay Cesar ang mga bagay na nauukol kay Cesar, at sa Diyos ang mga bagay na nauukol sa Diyos.”[a] At labis silang namangha sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang “Ibigay ninyo kay Cesar ang mga bagay na nauukol kay Cesar, at sa Diyos ang mga bagay na nauukol sa Diyos.” Ang pandiwa ay maaaring mangahulugang ibigay, isauli o ibalik, o bayaran ang nararapat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόδοτε
  choice: Ibigay ninyo
  rationale: Ang pautos na ἀπόδοτε ay maaaring mangahulugang ibigay, isauli, o bayaran ang nararapat. Ang “Ibigay ninyo” ay likas sa modernong Tagalog at hindi nagpapakitid sa kahulugan na para lamang sa pagbabayad ng buwis; nililinaw ng kasunod na parirala kung kanino nauukol ang mga bagay.
- source_word: Τὰ Καίσαρος ... Καίσαρι
  choice: kay Cesar ang mga bagay na kay Cesar
  rationale: Pinananatili nito ang pagmamay-aring ipinahihiwatig ng genitive at ang sinadyang pag-uulit sa Griyego, sa paraang malinaw at natural sa Tagalog.
- source_word: τὰ τοῦ θεοῦ ... τῷ θεῷ
  choice: sa Diyos ang mga bagay na sa Diyos
  rationale: Sinasalamin nito ang unang sugnay at pinananatili ang mahigpit na paralelismo ng sinabi ni Jesus nang hindi ipinapaliwanag nang lampas sa teksto ang saklaw ng hinihingi ng Diyos.
- source_word: ἐξεθαύμαζον
  choice: labis silang namangha
  rationale: Ang ἐκθαυμάζω ay masidhi kaysa sa karaniwang θαυμάζω. Ang “labis na namangha” ay natural na nagpapahayag ng matinding pagkamangha at ang naglalarawang puwersa ng imperfect.
- source_word: ἐπ’ αὐτῷ
  choice: sa kanya
  rationale: Direkta nitong pinananatili si Jesus bilang tinutukoy na bagay o batayan ng kanilang pagkamangha, habang hindi nililimitahan iyon sa kanyang sinabi lamang.
- source_word: δὲ
  choice: Ngunit
  rationale: Ang δέ ay nagmamarka ng banayad na pagsalungat o paglipat. Ang “Ngunit” ay angkop sa tugon ni Jesus sa pagtatangka nilang hulihin siya sa kanyang pananalita.
- source_word: εἶπεν αὐτοῖς
  choice: sinabi sa kanila ni Jesus
  rationale: Payak at natural na pagpapahayag ito ng introduksiyon sa tuwirang pananalita, nang walang idinagdag na interpretasyon.
theological_decisions:
- issue: Ugnayan ng pananagutang sibiko at pananagutan sa Diyos sa sinabi ni Jesus
  choice: Isinalin nang tuwiran at magkatimbang ang dalawang magkatulad na sugnay, nang walang idinagdag na teorya tungkol sa ugnayan ng pamahalaan at pananampalataya.
  alternative: Maaaring unawain ito bilang mas matibay na pagsang-ayon sa kapangyarihang sibil o bilang mapanuring paglilimita sa mga pag-aangkin ni Cesar.
  rationale: Sinasabi ng talata na may mga bagay na nauukol kay Cesar at may mga bagay na nauukol sa Diyos, ngunit hindi nito inilalahad ang isang ganap na teolohiyang pampolitika. Pinananatili ng salin ang paralelismo at tensiyon sa halip na lutasin iyon ayon sa isang doktrinal na balangkas.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignificado, at madaling maunawaan. Ginamit ang “Cesar,” ang karaniwang anyong Tagalog ng Caesar. Pinanatili ang retorikal na pag-uulit ng orihinal sa halip na gawing mas malayang “kung ano ang nauukol,” at inilagay ang talababa pagkatapos ng buong sipi upang ipaliwanag ang saklaw ng pandiwang ἀπόδοτε.
