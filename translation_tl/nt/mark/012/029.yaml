id: MRK.12.29
reference: Mark 12:29
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸂ἀπεκρίθη ὁ Ἰησοῦς⸃ ὅτι Πρώτη ⸀ἐστίν· Ἄκουε, Ἰσραήλ, κύριος ὁ θεὸς ἡμῶν κύριος εἷς ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/029.yaml
  text: 'Jesus answered[a], “The first is: Hear, O Israel, the Lord our God[b], the Lord is one.'
translation:
  language: tl
  text: 'Sumagot si Jesus, “Ang una ay ito: ‘Dinggin mo, Israel: ang Panginoon[a] nating Diyos, ang Panginoon ay iisa.’”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dahil sipi ito mula sa Shema (Deuteronomio 6:4), ang “Panginoon” dito ay katumbas ng Griyegong κύριος na ginagamit sa Septuagint para sa banal na pangalang YHWH.
    reason: cross_reference
  - marker: b
    text: 'Maaari ring isalin: “ang Panginoon nating Diyos ay iisang Panginoon,” o “ang Panginoon ang ating Diyos, ang Panginoon lamang.” Sinasalamin ng Griyego ang Deuteronomio 6:4 at maaaring magbigay-diin sa pagiging isa ng Diyos, sa pagiging Siya lamang ang Diyos, o sa kapwa diwa.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: Sumagot
  rationale: Karaniwang salaysay na katumbas ng ἀποκρίνομαι sa isang pag-uusap; malinaw at likas sa modernong Filipino.
- source_word: Πρώτη
  choice: Ang una
  rationale: Ginamit ang pang-uri bilang pangngalan at tumutukoy sa ipinahihiwatig na ‘utos’ mula sa konteksto. Hindi na idinagdag ang ‘utos’ upang manatiling malapit sa anyo ng Griyego.
- source_word: Ἄκουε
  choice: Dinggin mo
  rationale: Pinananatili ang pormal at tipanang himig ng pambungad sa Shema sa Deuteronomio 6:4, habang malinaw pa rin sa makabagong mambabasa.
- source_word: Ἰσραήλ
  choice: Israel
  rationale: Tuwirang panawag sa Israel; hindi kailangan ng dagdag na pantawag na wala sa Griyego.
- source_word: κύριος
  choice: Panginoon
  rationale: Karaniwang katumbas ng κύριος. Sa siping ito mula sa Shema, sinasalamin din nito ang paggamit ng Septuagint sa κύριος bilang kapalit ng banal na pangalang YHWH.
- source_word: θεὸς ἡμῶν
  choice: nating Diyos
  rationale: Likas na ayos sa Filipino para sa ‘aming/ating Diyos’; ginamit ang inklusibong ‘natin’ sapagkat sinisipi ni Jesus ang sama-samang pagpapahayag ng Israel.
- source_word: εἷς
  choice: iisa
  rationale: Ang ‘iisa’ ay likas na panaguring Filipino at pinananatili ang diin sa pagiging isa nang hindi nagpapasya kung oneness, pagiging bukod-tangi, o kapwa ang pangunahing diin.
theological_decisions:
- issue: Paglalarawan sa huling sugnay ng Shema habang pinananatili ang teolohikal at sintaktikong tensiyon
  choice: ang Panginoon nating Diyos, ang Panginoon ay iisa
  alternative: ang Panginoon nating Diyos ay iisang Panginoon; o, ang Panginoon ang ating Diyos, ang Panginoon lamang
  rationale: Maaaring unawain ang Griyegong κύριος ὁ θεὸς ἡμῶν κύριος εἷς ἐστιν sa higit sa isang paraan dahil sinasalamin nito ang Deuteronomio 6:4. Ang pangunahing salin ay malapit sa pagkakasunod ng Griyego at hindi tahimik na nagpapasya kung ang diin ay sa kaisahan ng Diyos, sa pagiging Siya lamang ang Diyos ng Israel, o sa kapwa ideya.
- issue: κύριος bilang salamin ng banal na pangalan sa sipi mula sa Shema
  choice: Panginoon, na may paliwanag sa talababa
  alternative: YAHWEH / PANGINOON
  rationale: Pinananatili ng ‘Panginoon’ ang karaniwang salin ng κύριος sa Bagong Tipan, samantalang nililinaw ng talababa na sa kontekstong ito ay kinakatawan nito ang banal na pangalang YHWH sa pinagmulan ng sipi.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “Dinggin mo” sa halip na mas kolokyal na “Makinig ka” upang mapanatili ang kinikilalang pormal at liturhikong himig ng Shema. Isinaayos ang mga pananda ng talababa ayon sa bahaging aktuwal nilang ipinapaliwanag.
