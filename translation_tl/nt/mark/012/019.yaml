  source_fidelity: Malapit sa Griyego ang salin at wastong naipapakita ang panlalaking kapatid, ang asawang naiwan, at ang layuning magkaroon ng supling para sa namatay na kapatid. Gayunman, ang “ngunit walang anak” ay bahagyang nagpapalit sa pandiwang “hindi mag-iwan ng anak” (μὴ ἀφῇ τέκνον) tungo sa simpleng kalagayan. Mas tapat at natural ang pagpapanatili ng pandiwang “mag-iwan.”
  naturalness: Magalang at malinaw ang rehistro. Ang “kunin ... bilang asawa” ay nauunawaan, ngunit mas likas at tiyak sa Filipino ang “kunin ang asawa niya bilang asawa,” na malinaw na tumutukoy sa asawang naiwan ng namatay at sa pag-aasawang hinihingi ng kautusan.
  terminology: Ang “Guro,” “Moises,” “kapatid na lalaki,” “asawa,” at “supling” ay angkop sa modernong Filipino Tagalog. Ang “supling” ay malinaw na katumbas ng idyomang ἐξαναστήσῃ σπέρμα; ang literal na “binhi” ay wastong inilagay sa talababa. Ang “namatay niyang kapatid” ay isang katanggap-tanggap na paglilinaw ng referent nang hindi nagdaragdag ng doktrina.
  issues:
