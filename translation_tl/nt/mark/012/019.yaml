    issue: Nawala ang pandiwang ‘mag-iwan’ sa ikalawang bahagi ng kondisyon.
    rationale: Ang μὴ ἀφῇ τέκνον ay literal na ‘at hindi mag-iwan ng anak.’ Ang ‘ngunit walang anak’ ay malapit ang diwa ngunit mas stative at hindi ganap na pinananatili ang paralelismong pandiwa sa καταλίπῃ γυναῖκα.
  - severity: low
    issue: Ang ‘ang babae’ ay mas malabo kaysa kinakailangan sa Filipino.
    rationale: Bagaman ang γυνή ay maaaring mangahulugang babae/asawa, sa kontekstong ito ito ang asawang naiwan. Ang ‘ang asawa niya’ ay natural na tumutukoy sa naunang asawa at hindi nangangahulugang isang ibang babae.
