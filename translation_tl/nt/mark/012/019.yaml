source:
  edition: SBLGNT
  text: Διδάσκαλε, Μωϋσῆς ἔγραψεν ἡμῖν ὅτι ἐάν τινος ἀδελφὸς ἀποθάνῃ καὶ καταλίπῃ γυναῖκα καὶ ⸂μὴ ἀφῇ τέκνον⸃, ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν ⸀γυναῖκα καὶ ἐξαναστήσῃ σπέρμα τῷ ἀδελφῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/019.yaml
  text: Teacher[a], Moses wrote for us that if someone's brother dies and leaves behind a wife and leaves no child[c][b], his brother should take the wife and raise up offspring for his brother.
translation:
  language: tl
  text: “Guro, isinulat ni Moises para sa atin[a] na kung mamatay ang kapatid na lalaki ng isang tao at mag-iwan ng asawa ngunit hindi mag-iwan ng anak[b], dapat kunin ng kapatid niya ang asawa niya bilang asawa at magkaroon ng supling para sa namatay niyang kapatid[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tingnan ang Deuteronomio 25:5–6 para sa kautusang tinutukoy.
    reason: cross_reference
  - marker: b
    text: 'Mas literal: “at hindi mag-iwan ng anak.” Maaari ring unawain ang isahang “anak” bilang pangkalahatang pagtukoy sa mga anak.'
    reason: lexical_alternative
  - marker: c
    text: 'Literal: “magbangon ng binhi para sa kanyang kapatid,” isang idyomang tumutukoy sa pagkakaroon ng supling bilang pagtupad sa tungkuling pakasalan ang balo ng kapatid.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Guro
  rationale: Likas at malinaw na pantawag sa isang nagtuturo; hindi nito idinaragdag ang ibang pahiwatig ng awtoridad na wala sa salita.
- source_word: ἔγραψεν ἡμῖν
  choice: isinulat ni Moises para sa atin
  rationale: Ipinakikita ng “para sa atin” na tinutukoy ng mga nagsasalita ang kautusang ibinigay para sa Israel.
- source_word: ἐάν τινος ἀδελφὸς ἀποθάνῃ
  choice: kung mamatay ang kapatid na lalaki ng isang tao
  rationale: Pinananatili ang pangkalahatang di-tiyak na τινος at ang panlalaking katawagang ἀδελφός na mahalaga sa konteksto ng batas.
- source_word: καταλίπῃ γυναῖκα
  choice: mag-iwan ng asawa
  rationale: Sa konteksto ng kamatayan, malinaw na ang babae ay asawang naiwan ng namatay.
- source_word: μὴ ἀφῇ τέκνον
  choice: ngunit walang anak
  rationale: Pinananatili ang isahang anyo ng τέκνον at natural na ipinahahayag sa Filipino ang kalagayang walang naiwang anak.
- source_word: ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα
  choice: dapat kunin ng kapatid niya ang babae bilang asawa
  rationale: Nililinaw ang kahulugang pag-aasawa ng λάβῃ γυναῖκα nang hindi basta pinapalitan ang babae ng interpretatibong katawagang “balo.”
- source_word: ἐξαναστήσῃ σπέρμα
  choice: magkaroon ng supling
  rationale: Ipinahahayag sa likas na modernong Filipino ang idyomang literal na “magbangon ng binhi,” na tumutukoy sa pagkakaroon ng inapo sa ilalim ng obligasyon ng pag-aasawa sa balo ng kapatid.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: para sa namatay niyang kapatid
  rationale: Ang “para sa” ay nagpapakita ng pakinabang o kaugnayan ng supling sa kapatid; ginawang hayag ang “namatay” upang hindi mapagkamalang ang buhay na kapatid ang tinutukoy sa Filipino.
theological_decisions:
- issue: Paglalahad sa legal na idyoma ng pag-aasawa sa balo ng kapatid
  choice: “dapat kunin ng kapatid niya ang babae bilang asawa at magkaroon ng supling para sa namatay niyang kapatid”
  alternative: “dapat pakasalan ng kapatid niya ang balo at magbangon ng binhi para sa kanyang kapatid”
  rationale: Malinaw ang legal at pampamilyang diwa sa karaniwang mambabasa, habang inilalagay sa talababa ang literal na larawang “binhi” sa halip na gawing malabo ang pangunahing teksto.
- issue: Mga katawagang may kasarian
  choice: Pinanatili ang “kapatid na lalaki” at ang babae bilang asawa.
  alternative: Gumamit ng neutral na “kapatid” at “kabiyak.”
  rationale: Ang ἀδελφός at γυνή ay tahasang tumutukoy sa lalaki at babae sa konteksto ng batas sa pag-aasawa; hindi dapat alisin ang kasariang nasa pinagmulang teksto.
translation_notes:
  register: Modernong Filipino na magalang at marangal ngunit madaling maunawaan. Ginamit ang “Guro,” “asawa,” “anak,” at “supling” bilang mga karaniwang salita; iniwasan sa pangunahing teksto ang malabong literalismong “magbangon ng binhi.”
