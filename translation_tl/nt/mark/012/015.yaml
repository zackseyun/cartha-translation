id: MRK.12.15
reference: Mark 12:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ εἰδὼς αὐτῶν τὴν ὑπόκρισιν εἶπεν αὐτοῖς· Τί με πειράζετε; φέρετέ μοι δηνάριον ἵνα ἴδω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/015.yaml
  text: But knowing their hypocrisy[a], he said to them[b], “Why are you testing me? Bring me a denarius so that I may see it.”
translation:
  language: tl
  text: Ngunit batid niya ang kanilang pagkukunwari, kaya sinabi niya sa kanila, “Bakit ninyo ako sinusubok?[a] Dalhan ninyo ako ng isang denario[b] upang makita ko.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Bakit ninyo ako tinutukso?”
    reason: lexical_alternative
  - marker: b
    text: Ang denario ay isang baryang pilak ng Roma na karaniwang katumbas ng isang araw na sahod.
    reason: cultural_note
lexical_decisions:
- source_word: εἰδὼς
  choice: batid
  rationale: Ipinapahayag nito ang tiyak na pagkaalam ni Jesus sa kanilang tunay na layunin. Likas at marangal ang “batid” sa makabagong Tagalog.
- source_word: ὑπόκρισιν
  choice: pagkukunwari
  rationale: Malinaw nitong inilalarawan ang pagpapanggap nilang tapat samantalang nais nila siyang bitagin; mas karaniwan at madaling maunawaan ito kaysa sa hiram na “hipokrisya.”
- source_word: Τί
  choice: Bakit
  rationale: Bagaman literal na “ano,” gumaganap itong tanong sa dahilan sa pariralang ito, kaya likas ang “Bakit” sa Tagalog.
- source_word: πειράζετε
  choice: sinusubok
  rationale: Pinananatili nito ang diwa ng mapanlabang pagsubok o pagtatangkang bitagin si Jesus nang hindi nililimitahan ang kahulugan sa pang-uudyok na magkasala.
- source_word: φέρετέ
  choice: Dalhan ninyo ako
  rationale: Tuwirang utos itong magdala ng bagay papunta sa nagsasalita; natural sa Tagalog ang pandiwang may pokus sa benepisyaryo rito.
- source_word: δηνάριον
  choice: isang denario
  rationale: Pinananatili ang tiyak na makasaysayang pangalan ng baryang Romano, na ipinaliliwanag sa talababa.
- source_word: ἵνα ἴδω
  choice: upang makita ko
  rationale: Pinananatili ang layuning ipinahahayag ng ἵνα at likas na ipinauunawa na ang denario ang titingnan.
theological_decisions:
- issue: Diwa ng πειράζετε sa paratang ni Jesus
  choice: sinusubok
  alternative: tinutukso
  rationale: Sa konteksto, mapanlinlang nilang sinusubukang bitagin si Jesus. Sapat na naihahatid ng “sinusubok” ang mapanlabang diwa nang hindi ipinapalagay na pang-uudyok lamang ito sa kasalanan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “pagkukunwari” sa halip na teknikal na “hipokrisya,” at pinanatili ang makasaysayang katawagang “denario.” Inilagay ang bawat talababa sa salitang o pariralang aktuwal nitong nililinaw.
