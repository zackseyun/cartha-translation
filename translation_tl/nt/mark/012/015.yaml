  source_fidelity: 'Tumpak ang pagsasalin sa lahat ng pangunahing sangkap ng Griyego: ang pagkaalam ni Jesus sa kanilang ὑπόκρισιν, ang tanong na mapanuyang “Bakit,” ang kasalukuyang-diwasang πειράζετε bilang “sinusubok,” ang utos na magdala ng denario, at ang layuning “upang makita ko.” Ang implicit na bagay ng “makita ko” ay malinaw na ang denario.'
  naturalness: Likas, malinaw, at angkop sa marangal na makabagong Tagalog ang daloy. Ang “batid,” “pagkukunwari,” “Dalhan ninyo ako,” at “upang makita ko” ay nauunawaan at angkop sa rehistro ng salaysay.
