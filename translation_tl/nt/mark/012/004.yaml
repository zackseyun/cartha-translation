  yaml_path: translation/nt/mark/012/004.yaml
  text: And again he sent another servant to them[c][b][a], and they struck him on the head and dishonored him.
translation:
  language: tl
  text: Muli, nagsugo siya sa kanila ng isa pang lingkod[a]. Hinampas nila siya sa ulo[b] at hinamak siya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “alipin.” Maaaring mangahulugan ang salitang Griyego na doulos ng “lingkod” o “alipin,” depende sa konteksto.
    reason: alternative_reading
  - marker: b
    text: Ang bihirang pandiwang Griyego rito ay tumutukoy sa karahasang ginawa sa ulo; maaari rin itong isaling “sinugatan nila siya sa ulo.” Hindi ito nangangahulugang pinugutan nila siya ng ulo.
    reason: lexical_alternative
  - marker: c
    text: O “trinato nila siya nang kahiya-hiya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: Muli
  rationale: Ipinahihiwatig nito ang pag-uulit ng kilos sa pagkakasunod-sunod ng talinghaga; likas at maikli ang “muli” sa salaysay.
- source_word: ἀπέστειλεν
  choice: nagsugo
  rationale: Ang aorist indicative ay nagsasalaysay ng isang naganap na kilos. Ang “nagsugo” ay angkop sa pagpapadala ng isang lingkod na may gagampanang utos.
- source_word: πρὸς αὐτούς
  choice: sa kanila
  rationale: 'Kapag kasama ng pandiwa ng pagsusugo, likas na ipinapahayag ng pariralang ito ang patutunguhan: “sa kanila.”'
- source_word: ἄλλον δοῦλον
  choice: isa pang lingkod
  rationale: Maaaring tumukoy ang δοῦλος sa lingkod o alipin. Likas sa modernong Tagalog ang “lingkod” sa talinghagang ito, samantalang inilalagay sa talababa ang “alipin” upang mapanatili ang posibleng diin sa katayuang panlipunan.
- source_word: κἀκεῖνον
  choice: ito
  rationale: Ang crasis ay may diwang “at ang isang iyon.” Sa Tagalog, malinaw at natural na ituro ang bagong lingkod sa pamamagitan ng “ito,” habang naipagpapatuloy ng kasunod na sugnay ang salaysay.
- source_word: ἐκεφαλίωσαν
  choice: Hinampas nila ito sa ulo
  rationale: Bihira ang pandiwa at tumutukoy sa karahasang ginawa sa ulo. Ang saling ito ay malinaw at hindi nagmumungkahing pinugutan siya ng ulo.
- source_word: ἠτίμασαν
  choice: hinamak
  rationale: Ipinapahayag ng pandiwa ang pagtrato sa isang tao nang walang dangal o may kahihiyan. Maikli, natural, at angkop sa konteksto ang “hinamak.”
theological_decisions: []
translation_notes:
  register: Gumamit ng natural, kasalukuyan, at marangal na Filipino. Pinili ang “nagsugo” upang mapanatili ang ugnayan ng panginoon at lingkod, at ang “hinamak” upang maipahayag nang payak ang kawalan ng dangal at kahiya-hiyang pagtrato.
