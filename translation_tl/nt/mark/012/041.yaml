base_translation:
  language: en
  yaml_path: translation/nt/mark/012/041.yaml
  text: And sitting opposite the treasury[a], he was watching how the crowd was putting money into the treasury; and many rich people were putting in much.
translation:
  language: tl
  text: Umupo siya sa tapat ng kabang-yaman[a] at pinagmamasdan niya kung paano naghuhulog ng salapi roon ang mga tao; at maraming mayayaman ang naghuhulog ng malalaking halaga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sisidlan ng handog” o “kahon ng kabang-yaman.” Ang salitang Griyego ay maaaring tumukoy sa kabang-yaman ng templo o sa mga sisidlang hulugan na kaugnay nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθίσας
  choice: naupo
  rationale: Ipinahahayag ang naunang kilos ng aorist participle sa natural na salaysay sa Filipino.
- source_word: κατέναντι
  choice: sa tapat ng
  rationale: Tumpak at likas na katumbas ng posisyong kaharap o nasa kabilang panig.
- source_word: γαζοφυλάκιον
  choice: kabang-yaman
  rationale: Pinananatili ang lawak ng terminong Griyego, na maaaring tumukoy sa kabang-yaman ng templo o sa mga sisidlang hulugan na kaugnay nito.
- source_word: ἐθεώρει
  choice: pinagmamasdan niya
  rationale: Ipinahahayag ang tuloy-tuloy at masusing pagmamasid na ipinahihiwatig ng imperfect.
- source_word: πῶς
  choice: kung paano
  rationale: Pinananatili ang diin sa paraan o proseso ng paghuhulog, hindi lamang sa katotohanang nagbibigay ang mga tao.
- source_word: ὁ ὄχλος
  choice: ang mga tao
  rationale: Natural na modernong Filipino para sa pulutong na naroon; iniiwasan ang mas matigas na 'karamihan' o 'pulutong' sa kontekstong ito.
- source_word: βάλλει / ἔβαλλον
  choice: naghuhulog
  rationale: Idyomatikong salin sa konteksto ng paglalagay ng salapi sa isang hulugan at ang aspektong nagpapatuloy ay malinaw sa anyong pandiwa.
- source_word: χαλκόν
  choice: salapi
  rationale: Bagaman literal na tanso o baryang tanso, sa konteksto ay tumutukoy ito sa perang inihuhulog; 'salapi' ang natural na kolektibong katawagan nang hindi nagpapahiwatig ng tiyak na denominasyon.
- source_word: πολλοὶ πλούσιοι
  choice: maraming mayayaman
  rationale: Maikli, likas, at hindi kinakailangang nililimitahan sa mga lalaki ang pangkalahatang panlalaking pangmaramihan.
- source_word: πολλά
  choice: malalaking halaga
  rationale: Sa konteksto ng salapi, malinaw nitong ipinahahayag na marami o malaki ang halagang inihuhulog, sa halip na ang di-likas na literal na 'marami'.
theological_decisions:
- issue: Hindi tahasang pinangalanan si Jesus sa sugnay na Griyego
  choice: si Jesus
  alternative: siya
  rationale: Ang pangalang Jesus ay nilinaw mula sa agarang konteksto upang maging natural at malinaw sa Filipino; hindi nito binabago ang tinutukoy ng panghalip.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang 'kabang-yaman' upang mapanatili ang leksikal na kalabuan, habang ang 'naghuhulog ng salapi' at 'malalaking halaga' ay natural sa karaniwang pananalita.
