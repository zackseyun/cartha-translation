id: MRK.12.22
reference: Mark 12:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ⸂οἱ ἑπτὰ⸃ οὐκ ἀφῆκαν σπέρμα· ⸀ἔσχατον πάντων ⸂καὶ ἡ γυνὴ ἀπέθανεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/022.yaml
  text: And the seven left no offspring. Last of all[a], the woman also died.
translation:
  language: tl
  text: At ang pito ay walang iniwang supling.[a] Pinakahuli sa lahat, namatay rin ang babae.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “walang iniwang binhi,” ibig sabihin, walang iniwang anak o inapo.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἑπτὰ
  choice: ang pito
  rationale: Ginamit ang bilang bilang pangngalan, gaya sa Griyego, at malinaw mula sa naunang konteksto na tumutukoy ito sa pitong magkakapatid.
- source_word: οὐκ ἀφῆκαν σπέρμα
  choice: walang iniwang supling
  rationale: Ang literal na 'walang iniwang binhi' ay idyomang tumutukoy sa hindi pagkakaroon ng anak o inapo. Malinaw at natural sa makabagong Tagalog ang 'supling' habang napapanatili ang diwa ng pagpapatuloy ng lahi.
- source_word: ἔσχατον πάντων
  choice: Sa kahuli-hulihan
  rationale: Ipinahahayag nito na ang pagkamatay ng babae ang pinakahuling pangyayari sa buong pagkakasunod-sunod.
- source_word: καὶ ἡ γυνὴ
  choice: rin ang babae
  rationale: 'Ipinakikita ng ''rin'' ang pandagdag na diwa ng καί: pagkamatay ng babae kasunod ng pagkamatay ng pito.'
- source_word: ἀπέθανεν
  choice: namatay
  rationale: Tuwiran at malinaw nitong isinasalin ang pandiwa nang hindi pinapalambot ang kahulugan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang maikli at tuwirang daloy ng Griyego; inilagay ang talababa sa 'supling,' ang salitang aktuwal nitong ipinapaliwanag.
