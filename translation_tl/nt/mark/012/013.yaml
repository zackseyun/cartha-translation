  naturalness: Natural at marangal ang rebisyong “upang mabitag siya sa isang salita.” Ang “mabitag” ay malinaw na metapora ng paghuli at ang “sa isang salita” ay bahagyang mas idiomatiko kaysa “sa pamamagitan ng isang salita,” habang pinananatili ang singular at instrumental na diwa.
  terminology: Panatilihin ang “mga Pariseo.” Gamitin ang “mga Herodiano” bilang pangalang pangkat, hindi ang mas malawak at posibleng mapanuring “mga tagasunod ni Herodes.”
