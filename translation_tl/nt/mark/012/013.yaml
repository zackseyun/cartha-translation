id: MRK.12.13
reference: Mark 12:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἀποστέλλουσιν πρὸς αὐτόν τινας τῶν Φαρισαίων καὶ τῶν Ἡρῳδιανῶν ἵνα αὐτὸν ἀγρεύσωσιν λόγῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/013.yaml
  text: And they send to him some of the Pharisees and some of the Herodians[a], so that they might trap him by a word.
translation:
  language: tl
  text: At isinugo nila sa kanya ang ilan sa mga Pariseo at ang ilan sa mga Herodiano, upang mabitag siya sa isang salita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “upang hulihin siya sa pamamagitan ng isang salita.” Ang pandiwang Griyego ay metaporang mula sa pangangaso. Sa konteksto, layon nilang mabitag siya sa kanyang sasabihin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστέλλουσιν
  choice: isinugo nila
  rationale: Ginamit ang pangnagdaang anyo na likas sa pagsasalaysay sa Tagalog, bagaman historical present ang Griyego; pinananatili nito ang kilos ng pagpapadala nang walang idinaragdag na tiyak na paksa.
- source_word: τινας τῶν Φαρισαίων καὶ τῶν Ἡρῳδιανῶν
  choice: ang ilan sa mga Pariseo at ang ilan sa mga tagasunod ni Herodes
  rationale: 'Inilalantad ng paulit-ulit na “ang ilan sa” ang partitive na diwa: mga kinatawan mula sa dalawang pangkat, hindi ang kabuuan ng bawat pangkat.'
- source_word: Φαρισαίων
  choice: mga Pariseo
  rationale: Karaniwang katawagang Tagalog para sa pangkat na ito ng mga Judio.
- source_word: Ἡρῳδιανῶν
  choice: mga tagasunod ni Herodes
  rationale: Mas malinaw sa karaniwang mambabasa kaysa sa transliterasyong “mga Herodiano,” at ipinahihiwatig lamang ang kaugnayan nila kay Herodes nang hindi tinutukoy nang higit sa sinasabi ng pangalan.
- source_word: ἵνα
  choice: upang
  rationale: Malinaw at marangal na nagpapahayag ng layunin sa modernong Tagalog.
- source_word: ἀγρεύσωσιν
  choice: hulihin
  rationale: Pinananatili ang metaporang mula sa pangangaso—ang pagsilo o paghuli—habang natural na inuugnay sa balak na ipahamak si Jesus sa pamamagitan ng kanyang sagot.
- source_word: λόγῳ
  choice: sa pamamagitan ng kanyang sasabihin
  rationale: Ipinapahayag ang instrumental na gamit ng dative at natural na nililinaw na ang patibong ay nakasalalay sa salitang manggagaling kay Jesus; ang talababa ay nagpapanatili ng mas literal na anyo at ng saklaw na maaaring tumukoy sa salita o pahayag.
theological_decisions:
- issue: Hindi tahasang binanggit ang simuno ng pangmaramihang pandiwa
  choice: nila
  alternative: ng mga punong pari, mga tagapagturo ng Kautusan, at matatandang pinuno; ng mga pinuno
  rationale: Hindi pinapangalanan muli ng talata ang mga gumagawa ng kilos. Pinananatili ng panghalip ang implicit na simuno sa halip na ipasok sa teksto ang pagkakakilanlang makukuha lamang sa naunang konteksto.
- issue: Paglalarawan sa mga Ἡρῳδιανοί
  choice: mga tagasunod ni Herodes
  alternative: mga Herodiano
  rationale: Ipinapakita ang ugnayan kay Herodes nang hindi nagdaragdag ng mas tiyak na teolohikal o pampolitikang pagkakakilanlan na hindi tahasang tinutukoy sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ang “isinugo” at “upang” ay angkop sa salaysay ng Kasulatan nang hindi labis na makaluma; ang talababa ang nagpapanatili sa literal na hunting metaphor at sa anyo ng λόγῳ.
