id: MRK.12.14
reference: Mark 12:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀καὶ ἐλθόντες λέγουσιν αὐτῷ· Διδάσκαλε, οἴδαμεν ὅτι ἀληθὴς εἶ καὶ οὐ μέλει σοι περὶ οὐδενός, οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων, ἀλλ’ ἐπ’ ἀληθείας τὴν ὁδὸν τοῦ θεοῦ διδάσκεις· ἔξεστιν ⸂δοῦναι κῆνσον Καίσαρι⸃ ἢ οὔ; δῶμεν ἢ μὴ δῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/014.yaml
  text: And they came and said to him[a], “Teacher, we know that you are truthful and do not care about anyone, for you do not look at the face of men, but truly teach the way of God. Is it lawful to pay the poll tax to Caesar or not? Should we pay it[b], or should we not pay it?”
translation:
  language: tl
  text: Lumapit sila at sinabi sa kanya, “Guro, alam naming tapat ka at hindi ka nagpapaimpluwensiya ng sinuman, sapagkat hindi ka nagtatangi ng tao,[a] kundi itinuturo mo nang ayon sa katotohanan ang daan ng Diyos. Ipinahihintulot ba na magbayad ng buwis kay Cesar o hindi? Magbabayad ba kami,[b] o hindi kami magbabayad?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na, “hindi ka tumitingin sa mukha ng mga tao”; maaari ring isalin, “hindi ka nagpapadala sa panlabas na anyo o katayuan ng mga tao.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Griyego na κῆνσος ay tumutukoy sa buwis ng Roma na kaugnay ng sensus, o buwis sa bawat tao.
    reason: cultural_note
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Guro
  rationale: Karaniwan at likas na pantawag sa isang nagtuturo, at angkop sa gamit ng διδάσκαλος sa mga Ebanghelyo.
- source_word: ἀληθὴς
  choice: tapat
  rationale: Sa paglalarawan sa isang tao, likas na ipinahahayag ng “tapat” na siya ay mapagkakatiwalaan at nagsasalita ng totoo.
- source_word: οὐ μέλει σοι περὶ οὐδενός
  choice: hindi ka nagpapaimpluwensiya kaninuman
  rationale: Sa konteksto, hindi ito kawalan ng malasakit kundi kawalan ng pagpapaapekto sa opinyon, katayuan, o kapangyarihan ng iba; pinatutunayan ito ng kasunod na sugnay.
- source_word: οὐ ... βλέπεις εἰς πρόσωπον ἀνθρώπων
  choice: hindi ka tumitingin sa panlabas na kalagayan ng mga tao
  rationale: Pinananatili ang larawang may kaugnayan sa nakikita sa tao habang malinaw na ipinahihiwatig ang idyomatikong diwa ng hindi pagkiling batay sa anyo o katayuan.
- source_word: ἐπ’ ἀληθείας
  choice: nang ayon sa katotohanan
  rationale: Natural sa Filipino at malinaw na inilalarawan kung paano itinuturo ni Jesus ang daan ng Diyos.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: ang daan ng Diyos
  rationale: Pinananatili ang mahalagang biblikal na larawan ng “daan” sa halip na gawing mas abstraktong aral o kalooban lamang.
- source_word: ἔξεστιν
  choice: Ipinahihintulot ba ng Kautusan
  rationale: Ipinahahayag ang tanong tungkol sa legal o relihiyosong pagkapahintulot; ang tahasang “ng Kautusan” ay nililinaw ang likas na diwa ng tanong sa Filipino nang hindi tinutukoy kung batas Romano o kautusang Judio lamang.
- source_word: δοῦναι κῆνσον Καίσαρι
  choice: magbayad ng buwis kay Cesar
  rationale: Sa konteksto ng κῆνσος, ang δοῦναι ay natural na “magbayad”; ang uri ng buwis ay ipinaliliwanag sa talababa upang manatiling magaan ang pangunahing teksto.
- source_word: Καίσαρι
  choice: Cesar
  rationale: Ito ang nakaugaliang anyong Filipino ng titulo o pangalang Caesar.
- source_word: δῶμεν ἢ μὴ δῶμεν
  choice: Magbabayad ba kami, o hindi?
  rationale: Natural na Filipino na pinananatili ang matalim at tuwirang pag-uulit ng tanong, bagaman hindi inuulit nang buo ang pandiwa sa ikalawang hati.
theological_decisions:
- issue: Idyoma tungkol sa pagtingin sa mukha ng tao
  choice: hindi ka tumitingin sa panlabas na kalagayan ng mga tao
  alternative: hindi ka nagtatangi ng tao / hindi ka tumitingin sa mukha ng mga tao
  rationale: Iniiwasan ang salitang-salitang anyong maaaring hindi maunawaan, ngunit hindi rin lubusang pinapawi ang konkretong larawan. Nililinaw sa talababa na kabilang sa diwa ang hindi pagtatangi at hindi pagpapaapekto sa katayuan o anyo.
- issue: Saklaw ng ἔξεστιν
  choice: Ipinahihintulot ba ng Kautusan
  alternative: Naaayon ba sa batas / Ipinahihintulot ba
  rationale: Pinananatili ang legal at etikal na tensiyon ng patibong na tanong nang hindi nagpapasiya kung aling partikular na sistema ng batas ang tanging tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nagpapaimpluwensiya” upang maipahayag ang idyoma sa kasalukuyang pananalita, habang ang “daan ng Diyos” at “Kautusan” ay nagpapanatili ng biblikal at pormal na himig.
