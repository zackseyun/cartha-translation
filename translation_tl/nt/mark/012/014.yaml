  to: Lumapit sila at sinabi sa kanya, “Guro, alam naming tapat ka at hindi ka nagpapaimpluwensiya ng sinuman, sapagkat hindi ka nagtatangi ng tao,[a] kundi itinuturo mo nang ayon sa katotohanan ang daan ng Diyos. Ipinahihintulot ba na magbayad ng buwis kay Cesar o hindi? Magbabayad ba kami,[b] o hindi kami magbabayad?”
