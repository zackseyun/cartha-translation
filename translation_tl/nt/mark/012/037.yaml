id: MRK.12.37
reference: Mark 12:37
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀αὐτὸς Δαυὶδ λέγει αὐτὸν κύριον, καὶ πόθεν ⸂αὐτοῦ ἐστιν υἱός⸃; καὶ ὁ πολὺς ὄχλος ἤκουεν αὐτοῦ ἡδέως.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/037.yaml
  text: David himself calls him Lord[b][a], so how is he his son? And the large crowd was listening to him gladly.
translation:
  language: tl
  text: Si David mismo ang tumatawag sa kanya na “Panginoon.” Kung gayon, paano[b] siya anak ni David[a]? At ang napakaraming tao ay buong galak na nakikinig sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “anak” dito ay umaalingawngaw sa mesiyanikong titulong “Anak ni David”; maaari rin itong mangahulugang “inapo.”
    reason: lexical_alternative
  - marker: b
    text: 'Sa mas literal na salin: “mula saan siya anak ni David?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: mismo
  rationale: Ginamit nang pasidhi ang αὐτός upang idiin na si David mismo ang tumatawag sa Mesiyas na Panginoon.
- source_word: λέγει αὐτὸν κύριον
  choice: tinatawag sa kanya na “Panginoon”
  rationale: Sa kontekstong ito, ang λέγει na may layong αὐτὸν at panaguring κύριον ay nangangahulugang tinatawag o kinikilalang “Panginoon,” hindi lamang nagsasalita tungkol sa kanya.
- source_word: κύριον
  choice: Panginoon
  rationale: Pinananatili nito ang bigat ng titulong κύριος sa siping Kasulatan at sa argumento tungkol sa Mesiyas.
- source_word: πόθεν
  choice: paano
  rationale: Bagaman literal itong “mula saan,” dito ay nagtatanong ito tungkol sa lohikal na batayan kung paano maituturing na anak ni David ang tinatawag niyang Panginoon.
- source_word: αὐτοῦ ἐστιν υἱός
  choice: siya anak ni David
  rationale: Pinanatili ang “anak” upang umalingawngaw ang mesiyanikong titulong “Anak ni David”; tahasang binanggit si David sa halip na gumamit ng malabong panghalip sa natural na Filipino.
- source_word: ὁ πολὺς ὄχλος
  choice: ang napakaraming tao
  rationale: Ipinahahayag nito na marami ang bumubuo sa pulutong nang hindi gumagamit ng lipas o labis na teknikal na salita.
- source_word: ἤκουεν αὐτοῦ
  choice: nakikinig sa kanya
  rationale: Ang aspektong di-ganap ng ἤκουεν ay ipinakita sa patuloy na kilos na “nakikinig.”
- source_word: ἡδέως
  choice: buong galak
  rationale: Natural nitong ipinahahayag ang kasiyahan o lugod ng mga tao habang nakikinig.
theological_decisions:
- issue: Ang kristolohikal na bigat ng pagtawag ni David sa Mesiyas na “Panginoon”
  choice: Pinanatili ang tuwirang titulong “Panginoon” at ang tanong na hindi nilagyan ng paliwanag sa mismong talata.
  alternative: Tukuyin nang tahasan ang tinutukoy bilang “Mesiyas” o ipaliwanag kung paano siya nakahihigit kay David.
  rationale: Ipinakikita ng tanong na ang Mesiyas ay hindi lamang karaniwang inapo ni David, ngunit hindi binubuo ng talata ang buong paliwanag; dapat manatili ang tensiyon ng argumento.
- issue: Kahulugan ng υἱός sa kontekstong mesiyaniko
  choice: anak
  alternative: inapo
  rationale: Maaaring tumukoy ang “anak” sa inapo, ngunit ang pagpapanatili rito ay mahalaga sa kilalang titulong “Anak ni David” at sa retorikal na paghahambing ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang retorikal na tanong at ang titulong “Panginoon,” habang iniwasan ang pagpapaliwanag ng doktrina sa loob ng mismong talata.
