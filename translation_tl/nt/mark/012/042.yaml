  yaml_path: translation/nt/mark/012/042.yaml
  text: And a poor widow came and put in two lepta[c][b][a], which is a quadrans.
translation:
  language: tl
  text: Dumating ang isang dukhang biyuda at naghulog ng dalawang lepton,[a] na katumbas ng isang quadrans.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ang lepton ay napakaliit na barya; ang dalawang lepton ay katumbas ng isang Romanong quadrans. Maaari ring isalin: “dalawang maliliit na baryang tanso.”'
    reason: cultural_note_and_lexical_alternative
  - marker: b
    text: Ang quadrans ang baryang Romano na tinutukoy sa Griyego.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθοῦσα
  choice: Dumating din
  rationale: Ang aorist participle ay likas na isinasalin sa Filipino bilang pandiwang may hangganan na kaugnay ng pangunahing kilos; ipinahihiwatig ng “din” ang pagpapatuloy mula sa naunang mga naghuhulog.
- source_word: μία
  choice: isang
  rationale: Ipinakikilala nito ang isang tauhan sa salaysay, hindi kinakailangang idiniin ang bilang na isa.
- source_word: χήρα πτωχὴ
  choice: dukhang biyuda
  rationale: Tuwirang inilalarawan ng πτωχή ang biyuda bilang maralita; ang “dukha” ay natural, marangal, at mas matindi nang bahagya kaysa “mahirap” nang hindi ipinipilit ang ganap na kawalan.
- source_word: ἔβαλεν
  choice: naghulog
  rationale: Sa konteksto ng lalagyan ng handog, malinaw at natural sa Filipino ang “naghulog,” at iniiwasan ang di-angkop na puwersa ng “itinapon.”
- source_word: λεπτὰ δύο
  choice: dalawang lepton
  rationale: Pinananatili ang tiyak na sinaunang pangalan ng barya; lepton ang isahan at dalawang lepta ang nasa Griyego, ngunit ginagamit ang anyong isahan pagkatapos ng bilang ayon sa karaniwang pag-aangkop sa Filipino.
- source_word: ὅ ἐστιν
  choice: na katumbas ng
  rationale: Ang parirala ay nagpapaliwanag ng katumbas na halaga ng dalawang lepton, hindi na ang mga iyon ay literal na iisang barya.
- source_word: κοδράντης
  choice: isang quadrans
  rationale: Pinananatili ang makasaysayang pangalan ng baryang Romano sa halip na gumamit ng mapanlinlang na modernong katumbas.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na may dignidad at malinaw na daloy ng salaysay. Pinanatili ang mga makasaysayang pangalan ng barya at ipinaliwanag ang mga ito sa talababa upang maiwasan ang di-tumpak na modernong pagtutumbas.
