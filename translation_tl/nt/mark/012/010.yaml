    issue: Di-natural na ayos ng pangdiin na “kahit”
    rationale: Sa Filipino, ang “kahit” sa posisyong “nabasa kahit ang Kasulatang ito” ay maaaring magpahiwatig ng ‘read even this Scripture’ ngunit tunog pilit. Ang “man lamang” ay mas natural na katumbas ng emphatic οὐδέ sa retorikal na tanong.
  - severity: low
