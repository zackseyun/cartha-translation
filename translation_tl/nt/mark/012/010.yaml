source:
  edition: SBLGNT
  text: οὐδὲ τὴν γραφὴν ταύτην ἀνέγνωτε· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες, οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/010.yaml
  text: 'Have you not even read this Scripture: ‘The stone that the builders rejected[a], this has become the cornerstone’?”'
translation:
  language: tl
  text: '“Hindi ba ninyo man lamang nabasa ang Kasulatang ito: ‘Ang batong itinakwil ng mga tagapagtayo ang siyang naging batong-panulok[a]’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ulo ng sulok”; ayon sa tradisyon, “pangunahing batong-panulok.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γραφὴν
  choice: Kasulatan
  rationale: Sa Bagong Tipan, karaniwang tumutukoy ang γραφή sa banal na Kasulatan, hindi lamang sa anumang isinulat.
- source_word: ἀνέγνωτε
  choice: nabasa
  rationale: Natural sa Filipino ang anyong “Hindi ba ninyo nabasa” para sa retorikal na tanong na umaapela sa tekstong dapat nilang nalalaman.
- source_word: οὐδὲ
  choice: kahit
  rationale: Pinananatili ng “kahit” sa pariralang “Hindi ba ... kahit” ang diin ng οὐδέ, na nagpapatalas sa pagsaway.
- source_word: Λίθον
  choice: Ang bato
  rationale: Bagaman walang artikulo sa Griyego, tiyak ang tinutukoy na bato sa sipi at natural sa Filipino ang “ang bato.”
- source_word: ἀπεδοκίμασαν
  choice: itinakwil
  rationale: Malinaw at marangal na katumbas ang “itinakwil” para sa pagtanggi sa bato matapos itong suriin o hindi tanggapin bilang angkop.
- source_word: οἱ οἰκοδομοῦντες
  choice: mga tagapagtayo
  rationale: Ang pandiwaring ginamit bilang pangngalan ay natural at maikli sa “mga tagapagtayo,” habang nananatili ang talinghaga ng pagtatayo.
- source_word: ἐγενήθη
  choice: naging
  rationale: Tuwirang ipinahahayag ng “naging” ang pagbabago tungo sa bagong katayuan ng bato nang hindi ipinapasok kung sino ang gumawa nito.
- source_word: εἰς κεφαλὴν γωνίας
  choice: batong-panulok
  rationale: Ang “batong-panulok” ay malinaw at nakaugat na katumbas ng pangunahing bato sa sulok, at pinananatili nito ang larawan ng orihinal.
theological_decisions:
- issue: Mesiyanikong paggamit sa larawan ng Awit 118:22
  choice: Panatilihin ang talinghaga ng bato, mga tagapagtayo, at batong-panulok nang walang tahasang pagpapangalan kay Jesus o sa Mesiyas sa mismong salin.
  alternative: Tahasang tukuyin ang bato bilang ang Mesiyas.
  rationale: Iniuugnay ng konteksto ang sipi kay Jesus, ngunit ang mismong teksto ay gumagamit ng talinghaga. Ang pagpapanatili rito ay umiiwas sa mapagpaliwanag na dagdag at pinananatili ang teolohikal na bisa ng sipi.
- issue: Posibleng anyo o puwesto ng κεφαλὴ γωνίας
  choice: Batong-panulok sa pangunahing teksto, na may talababa para sa mas literal na “ulo ng panulok.”
  alternative: Batong-tuktok o pangulong bato sa panulok.
  rationale: Maaaring pagtalunan kung eksaktong anong batong pang-arkitektura ang inilalarawan, kaya ginagamit ang malinaw na tradisyonal na katumbas ngunit hindi itinatago ang mas literal na anyo.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “Kasulatan,” “itinakwil,” at “batong-panulok” upang mapanatili ang bigat at talinghaga ng sipi nang hindi nagiging lipas o labis na teknikal.
