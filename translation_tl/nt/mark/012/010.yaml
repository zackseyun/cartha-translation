    rationale: Ang γωνία ay “sulok”; kaya ang mas tuwirang alternatibo para sa κεφαλὴ γωνίας ay “ulo ng sulok.” Ang “panulok” ay tumutukoy na sa isang bagay na nasa sulok at nagiging di-malinaw kapag sinamahan ng “ulo ng.”
