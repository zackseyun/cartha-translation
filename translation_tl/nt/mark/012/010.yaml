  source_fidelity: 'Tapat ang pangunahing talinghaga: ang tiyak na bato, ang mga tagapagtayo, ang pagtanggi, at ang pagiging κεφαλὴ γωνίας ay napananatili. Ang “ang siyang” ay angkop na nagbibigay-diin sa οὗτος. Gayunman, ang puwesto ng “kahit” sa “Hindi ba ninyo nabasa kahit ang Kasulatang ito” ay hindi natural sa modernong Filipino at hindi pinakamalinaw na naghahatid ng mariing οὐδέ.'
  naturalness: Mas natural at marangal sa modernong Filipino ang “Hindi ba ninyo man lamang nabasa ang Kasulatang ito?” Ang “man lamang” ay idyomatiko sa retorikal na pagsaway at malinaw na sumasaklaw sa pandiwang “nabasa.”
  terminology: 'Ang “Kasulatan,” “itinakwil,” “mga tagapagtayo,” at “batong-panulok” ay angkop sa rehistro at matapat sa terminolohiya. Dapat lamang gawing mas literal at natural ang alternatibo sa talababa: “ulo ng sulok,” hindi “ulo ng panulok.”'
  issues:
