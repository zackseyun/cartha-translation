  text: Καὶ ⸂ἐν τῇ διδαχῇ αὐτοῦ ἔλεγεν⸃· Βλέπετε ἀπὸ τῶν γραμματέων τῶν θελόντων ἐν στολαῖς περιπατεῖν καὶ ἀσπασμοὺς ἐν ταῖς ἀγοραῖς
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/038.yaml
  text: And in his teaching he was saying[b][a], “Beware of the scribes who want to walk around in long robes and receive greetings in the marketplaces,”
translation:
  language: tl
  text: At habang nagtuturo siya, sinabi niya, “Mag-ingat kayo sa mga eskriba[a] na gustong maglakad-lakad na nakasuot ng mahahabang kasuotan[b] at tumanggap ng mga pagbati sa mga pamilihan,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang mga eskriba ay mga dalubhasa at tagapagturo ng Kautusan. Maaari ring isalin ang parirala bilang “Mag-ingat kayo sa mga tagapagturo ng Kautusan.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mahahabang kasuotan” ay kapansin-pansing panlabas na damit na iniuugnay sa mataas na katayuan at pampublikong karangalan.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν τῇ διδαχῇ αὐτοῦ
  choice: Habang nagtuturo siya
  rationale: Likas sa makabagong Tagalog ang pang-abay na sugnay at malinaw nitong ipinapakita na sinabi ito ni Jesus sa konteksto ng kanyang pagtuturo.
- source_word: ἔλεγεν
  choice: sinasabi niya
  rationale: Pinananatili ng aspektong di-ganap ng pandiwa ang nagpapatuloy na kilos, sa halip na gawing payak na minsanang sinabi lamang.
- source_word: Βλέπετε ἀπὸ
  choice: Mag-ingat kayo sa
  rationale: Ipinahahayag nito ang mariing utos na magbantay laban sa panganib na kaugnay ng mga taong tinutukoy.
- source_word: γραμματέων
  choice: mga eskriba
  rationale: Direktang katawagan ito sa pangkat na binabanggit sa tekstong Griyego at iniiwasang itumbas sila nang lubusan sa mga guro o dalubhasa sa batas; nililinaw sa talababa ang kanilang tungkulin.
- source_word: τῶν θελόντων
  choice: na gustong
  rationale: Tuwirang inilalarawan nito ang kanilang hangarin o kinagawiang kagustuhan.
- source_word: ἐν στολαῖς περιπατεῖν
  choice: maglakad-lakad na nakasuot ng mahahabang damit
  rationale: Ang στολαί ay mahahabang panlabas na kasuotang maaaring magpahiwatig ng katayuan, at ang περιπατεῖν ay likas na naihahayag bilang “maglakad-lakad.”
- source_word: ἀσπασμοὺς
  choice: tumanggap ng mga pagbati
  rationale: Bagaman literal na “mga pagbati” ang pangngalan, hinihingi ng elipsis sa Griyego ang diwang hangad nilang tumanggap ng gayong pampublikong pagkilala.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: sa mga pamilihan
  rationale: Tumutukoy ito sa mga pampublikong lugar ng pamilihan at pagtitipon; “mga pamilihan” ang maikli at natural na katumbas.
theological_decisions:
- issue: Saklaw ng babala ni Jesus tungkol sa mga eskriba
  choice: Pinananatili ang “mga eskriba” na kaagad inilalarawan ng sugnay na “na gustong…,” kaya nakatuon ang babala sa mga eskribang mahilig sa pampublikong pagpaparangal.
  alternative: Unawain ito bilang tahasang paghatol sa bawat eskriba nang walang pagtatangi.
  rationale: Ang participial na paglalarawan sa Griyego ang nagpapakilala sa asal ng mga eskribang tinutukoy. Hindi dapat palawakin ng salin ang babala lampas sa anyo ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “eskriba” upang manatiling malapit sa natatanging katawagan sa pinagmulan, na may maikling paliwanag sa talababa. Ang “Habang nagtuturo siya” ay mas natural kaysa sa literal na “sa kanyang pagtuturo,” samantalang pinananatili ng “sinasabi niya” ang nagpapatuloy na aspekto ng ἔλεγεν.
