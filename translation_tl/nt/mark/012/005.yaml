  text: ⸀καὶ ἄλλον ἀπέστειλεν· κἀκεῖνον ἀπέκτειναν, καὶ πολλοὺς ἄλλους, ⸂οὓς μὲν δέροντες οὓς δὲ ἀποκτέννοντες⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/005.yaml
  text: And he sent another[a], and they killed that one; and many others—some they beat, and some they killed.
translation:
  language: tl
  text: Nagsugo siya ng isa pa, at pinatay rin nila iyon. Nagsugo rin siya ng marami pang iba—ang ilan ay binugbog nila, at ang iba naman ay pinatay.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλον
  choice: isa
  rationale: Tumutukoy ito sa isa pang alipin sa sunod-sunod na mga isinugo ng may-ari. Kasama ng “pa,” natural nitong ipinahahayag ang diwang “another” sa Filipino.
- source_word: ἀπέστειλεν
  choice: nagsugo siya
  rationale: Payak at likas na salin ng aorist na pandiwa, at ang “sugo” ay angkop sa pagpapadala ng isang alipin bilang kinatawan.
- source_word: κἀκεῖνον
  choice: din nila iyon
  rationale: Pinananatili ng “iyon” ang demonstratibong diin ng ἐκεῖνον, habang ipinahahayag ng “din” ang dagdag na diwa ng καί.
- source_word: ἀπέκτειναν
  choice: pinatay nila
  rationale: Direkta at natural na katumbas ng ἀποκτείνω at malinaw na ipinakikita ang karahasan sa talinghaga.
- source_word: πολλοὺς ἄλλους
  choice: marami pang iba
  rationale: Malinaw na tumutukoy sa marami pang aliping isinugo pagkatapos ng mga nauna.
- source_word: οὓς μὲν ... οὓς δὲ
  choice: ang ilan ... at ang iba naman
  rationale: Natural na distributibong pares sa modernong Filipino na pinananatili ang paghahati sa dalawang uri ng sinapit ng mga alipin.
- source_word: δέροντες
  choice: binugbog nila
  rationale: Ipinahahayag ang paulit-ulit o matinding pananakit nang hindi ipinapalagay na isang pormal na paghagupit bilang parusa.
- source_word: ἀποκτέννοντες
  choice: pinatay
  rationale: Ginawang finite verb para sa natural na Filipino habang pinananatili ang distributibong buod ng participle.
theological_decisions:
- issue: Paglalahad ng participial summary clause
  choice: 'Gawing mga finite verb: “ang ilan ay binugbog nila, at ang iba naman ay pinatay.”'
  alternative: “binubugbog ang ilan at pinapatay ang iba”
  rationale: Usaping sintaktiko at estilo ito, hindi doktrinal. Mas natural at malinaw sa Filipino ang mga finite verb, at napapanatili ang distributibong diwa ng Griyego.
- issue: Ugnayan ng πολλοὺς ἄλλους sa pandiwang ἀπέστειλεν
  choice: Ulitin ang “Nagsugo pa siya” bago ang “marami pang iba.”
  alternative: “at marami pang iba—ang ilan ay binugbog...”
  rationale: Ipinahihiwatig ng Griyego ang naunang pandiwang “nagsugo” para sa “marami pang iba.” Ang pag-uulit nito sa Filipino ay nililinaw ang sintaks nang hindi nagdaragdag ng bagong pangyayari.
translation_notes:
  register: Modernong Filipino na natural, marangal, at madaling maunawaan. Ginamit ang “binugbog” sa halip na mas teknikal na “hinagupit,” at iniwasan ang arkaiko o labis na pormal na ayos.
