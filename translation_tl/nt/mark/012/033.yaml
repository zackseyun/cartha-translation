  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ τὸ ἀγαπᾶν αὐτὸν ἐξ ὅλης ⸀τῆς καρδίας καὶ ἐξ ὅλης τῆς ⸀συνέσεως καὶ ἐξ ὅλης τῆς ἰσχύος καὶ τὸ ἀγαπᾶν τὸν πλησίον ὡς ἑαυτὸν ⸀περισσότερόν ἐστιν πάντων τῶν ὁλοκαυτωμάτων καὶ θυσιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/033.yaml
  text: and to love him with all the heart and with all the understanding and with all the strength[a], and to love one’s neighbor as oneself, is more than all burnt offerings and sacrifices.
translation:
  language: tl
  text: at ang ibigin siya nang buong puso, nang buong pang-unawa, at nang buong lakas, at ang ibigin ang kapwa gaya ng sarili, ay higit kaysa sa lahat ng handog na sinusunog nang buo at mga hain.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαπᾶν
  choice: ang ibigin
  rationale: Pinananatili ng pawatas na may pantukoy ang paralel na pandiwang diwa ng dalawang utos; natural at marangal sa Filipino ang “ang ibigin.”
- source_word: αὐτόν
  choice: siya
  rationale: Pinananatili ang panghalip ng Griyego; malinaw sa naunang konteksto na Diyos ang tinutukoy, nang hindi ipinapasok ang pangngalan sa mismong talata.
- source_word: ἐξ ὅλης τῆς καρδίας
  choice: nang buong puso
  rationale: Likas na pahayag sa Filipino para sa ganap na debosyon at hindi nagdaragdag ng ikalawang panauhan na wala sa sugnay na Griyego.
- source_word: συνέσεως
  choice: pang-unawa
  rationale: Tumpak na ipinahahayag ang pagkaunawa o discernment ng σύνεσις, sa halip na gawing pangkalahatang “isip” lamang.
- source_word: ἰσχύος
  choice: lakas
  rationale: Malinaw at karaniwang katumbas na nagsasaad ng buong kakayahan o puwersa.
- source_word: πλησίον
  choice: ang kapwa
  rationale: Ang “kapwa” ay likas na pangkalahatang tawag sa taong dapat mahalin at angkop sa etikang diwa ng pang-isahang Griyego.
- source_word: ὡς ἑαυτόν
  choice: gaya ng sarili
  rationale: Pinananatili ang pangkalahatang reflexive na diwa at iniiwasang gawing tuwirang pakikipag-usap na “gaya ng iyong sarili.”
- source_word: περισσότερόν ἐστιν
  choice: ay higit kaysa
  rationale: Tuwirang pinananatili ang malinaw na paghahambing at pagiging nakahihigit nang walang dagdag na paliwanag.
- source_word: πάντων τῶν ὁλοκαυτωμάτων καὶ θυσιῶν
  choice: sa lahat ng handog na sinusunog nang buo at iba pang mga hain
  rationale: Ipinakikita ng “sinusunog nang buo” ang tiyak na kahulugan ng ὁλοκαυτώματα. Idinagdag ang “iba pang” upang malinaw sa natural na Filipino na ang unang uri ay isa ring hain, habang pinananatili ang dalawang kategoryang binanggit.
theological_decisions:
- issue: Ugnayan ng mga utos ng pag-ibig sa paghahandog
  choice: Sinasabing nakahihigit ang buong pag-ibig sa Diyos at pag-ibig sa kapwa kaysa sa lahat ng handog na sinusunog nang buo at iba pang mga hain.
  alternative: Ipakahulugang tuluyang pinawawalang-bisa rito ang lahat ng paghahandog.
  rationale: Malinaw na naghahayag ng pagiging nakahihigit ang περισσότερόν ἐστιν, ngunit hindi tahasang sinasabi ng talata na pinawalang-bisa ang sistema ng paghahandog. Pinananatili ang tensiyong ito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “ibigin” upang mapanatili ang maikli at paralel na anyo ng dalawang articular infinitive; ang “mahalin” ay posible ngunit bahagyang mas kolokyal. Walang footnote marker dahil walang kinakailangang tala sa salin.
