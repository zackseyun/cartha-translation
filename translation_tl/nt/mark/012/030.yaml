  yaml_path: translation/nt/mark/012/030.yaml
  text: And you shall love the Lord your God with all your heart and with all your soul and with all your mind and with all your strength[a][b][c].
translation:
  language: tl
  text: At iibigin mo ang Panginoon mong Diyos nang buong puso mo, at nang buong kaluluwa mo[a], at nang buong pag-iisip mo[b], at nang buong lakas mo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “buong buhay mo” para sa “buong kaluluwa mo” (ψυχῆς).
    reason: lexical_alternative
  - marker: b
    text: O “buong pang-unawa mo” para sa “buong pag-iisip mo” (διανοίας).
    reason: lexical_alternative
  - marker: c
    text: O “buong makakaya mo” para sa “buong lakas mo” (ἰσχύος).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπήσεις
  choice: iibigin mo
  rationale: Ang anyong panghinaharap sa pagsipi ng utos ay may puwersang pautos. Pinananatili ng “iibigin mo” ang anyo ng kasulatang utos at natural pa rin sa marangal na modernong Tagalog.
- source_word: κύριον τὸν θεόν σου
  choice: ang Panginoon mong Diyos
  rationale: Tumpak at likas na katumbas ng pormulang tumutukoy sa Diyos ng taong kinakausap; pinananatili ang titulong “Panginoon” at ang kaugnayang ipinahihiwatig ng σου.
- source_word: ἐξ ὅλης
  choice: nang buong
  rationale: Sa idyomang ito, ipinahahayag ng ἐξ kasama ng ὅλης ang ganap na paglahok ng bawat bahagi ng pagkatao. Ang “nang buong” ay natural sa Tagalog at pinananatili ang pag-uulit at diin sa kabuuan.
- source_word: καρδίας
  choice: puso
  rationale: Karaniwang katumbas na nagpapanatili sa larawan ng panloob na sentro ng hangarin at damdamin nang walang dagdag na pagpapakahulugan.
- source_word: ψυχῆς
  choice: kaluluwa
  rationale: Pinananatili nito ang pagkakaiba ng ψυχή sa puso, pag-iisip, at lakas. Dahil maaari rin itong mangahulugang “buhay,” inilalagay ang alternatibo sa talababa.
- source_word: διανοίας
  choice: pag-iisip
  rationale: Natural na tumutukoy sa kakayahang mag-isip at umunawa, habang nananatiling naiiba sa “puso.”
- source_word: ἰσχύος
  choice: lakas
  rationale: Malinaw at pangkaraniwang katumbas ng pisikal o pangkalahatang kakayahan at kapangyarihan; ang “buong kaya” ay itinala bilang posibleng alternatibo.
- source_word: καὶ ... καὶ ... καὶ ... καὶ
  choice: at ... at ... at ... at
  rationale: Pinananatili ang pinagsama-sama at mariing ritmo ng paulit-ulit na καὶ sa Griyego.
theological_decisions:
- issue: Paglilipat ng κύριος sa sipi ng utos
  choice: Panginoon
  alternative: YHWH / Maestro
  rationale: Ang tekstong Griyego ay κύριος. Ang “Panginoon” ay nagpapanatili sa gamit ng Bagong Tipan at sa alingawngaw ng tipanang pormula nang hindi ipinapasok sa pangunahing teksto ang anyo ng pangalang Hebreo na wala rito.
- issue: Apat na katawagang antropolohikal
  choice: puso / kaluluwa / pag-iisip / lakas
  alternative: puso / buhay / pang-unawa / buong kaya
  rationale: Hindi pinagsasama ang magkakaibang termino sa isang pangkalahatang pahayag. Sa gayon, nananatili ang retorikal at teolohikal na diin sa buong pagkatao, pati ang tunay na luwang ng kahulugan ng bawat salita.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Panginoon mong Diyos” bilang likas na pormula, at inulit ang “at nang buong” upang mapanatili ang mariin at pinagsama-samang estruktura ng Griyego. Ang mga panandang [a], [b], at [c] ay nasa pangunahing teksto.
