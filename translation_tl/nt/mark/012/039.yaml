  text: and the best seats in the synagogues and the places of honor at banquets[b][a],
translation:
  language: tl
  text: at ang mga upuang pandangal sa mga sinagoga at ang mga puwestong pandangal sa mga handaan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga pinakamainam na puwesto”; mas literal, “mga pangunahing higaan,” na tumutukoy sa mga puwestong may pinakamataas na dangal sa sinaunang kainan.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρωτοκαθεδρίας
  choice: mga pangunahing upuan
  rationale: Tumutukoy ito sa mga upuang may pinakamataas na katayuan o pagkilala sa isang pagtitipon. Likas at marangal sa modernong Filipino ang “mga pangunahing upuan,” habang pinananatili ang ideya ng pangunguna at prestihiyo.
- source_word: συναγωγαῖς
  choice: mga sinagoga
  rationale: Sa kontekstong ito, tumutukoy ang salita sa mga lugar ng pagtitipon at pagsamba ng mga Judio; ang “sinagoga” ang tiyak at karaniwang katawagan.
- source_word: πρωτοκλισίας
  choice: mga lugar na pandangal
  rationale: Tumutukoy ito sa mga puwesto sa hapag na inilaan sa mga panauhing may pinakamataas na karangalan. Inihahatid ng “mga lugar na pandangal” ang panlipunang diwa nang hindi ipinapalagay na pamilyar ang mambabasa sa sinaunang kaugaliang humilig sa mga higaan habang kumakain.
- source_word: δείπνοις
  choice: mga handaan
  rationale: Maaaring tumukoy sa mga hapunan o pormal na salu-salo. Ang “mga handaan” ay angkop sa konteksto ng pampublikong pagkilala at katayuan.
- source_word: καὶ ... καὶ
  choice: at ... at
  rationale: Pinananatili ang inuulit na pangatnig upang maipakita ang sunod-sunod na paghahangad sa mga marangal na puwesto.
- source_word: ἐν ταῖς συναγωγαῖς ... ἐν τοῖς δείπνοις
  choice: sa mga sinagoga ... sa mga handaan
  rationale: Likas na isinasalin sa Filipino ang parehong ἐν bilang “sa,” na angkop kapuwa sa lugar at sa okasyong panlipunan.
