    rationale: Καί ay pang-ugnay lamang dito at hindi nagpapahayag ng pagsalungat.
  - severity: medium
    issue: Ang “Gayundin ang nangyari sa pangatlo” ay nagiging pasibo at hindi ganap na katumbas ng elipsis ng Griyego.
    rationale: Ang ὁ τρίτος ὡσαύτως ay tumutukoy sa pangatlo na gumawa rin ng naunang inilarawang mga kilos; mas mahusay na panatilihin ang elipsis na nakasentro sa kanya.
  - severity: low
    issue: Ang “anak” ay mas makitid kaysa σπέρμα.
    rationale: Sa kontekstong ito, ang σπέρμα ay tumutukoy sa supling o mga inapo/progeny, hindi kinakailangang isang anak.
  revised_text: Pinakasalan siya ng pangalawa at namatay ito nang hindi nag-iwan ng supling. Gayundin ang pangatlo.
