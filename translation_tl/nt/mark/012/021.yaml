base_translation:
  language: en
  yaml_path: translation/nt/mark/012/021.yaml
  text: And the second took her[a], and died, leaving no offspring, and the third likewise.
translation:
  language: tl
  text: Pinakasalan siya ng pangalawa at namatay ito nang hindi nag-iwan ng supling. Gayundin ang pangatlo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: ang pangalawa
  rationale: Ang ordinal na may artikulo ay ginagamit bilang pangngalan. Hindi idinagdag ang “kapatid” dahil ipinahihiwatig lamang ito ng konteksto at hindi tahasang nasa sugnay.
- source_word: ἔλαβεν αὐτήν
  choice: pinakasalan siya
  rationale: Bagaman literal na “kinuha siya,” sa konteksto ng pag-aasawa sa balo ay malinaw na tumutukoy ito sa pagpapakasal. Ang “pinakasalan siya” ang natural at hindi malabong pagpapahayag sa modernong Tagalog.
- source_word: ἀπέθανεν
  choice: namatay rin ito
  rationale: Tuwirang isinalin ang pandiwa bilang “namatay.” Idinagdag ang “rin” upang likas na maipahayag ang pag-uulit mula sa naunang pangyayari, at “ito” upang luminaw ang paksa sa Tagalog.
- source_word: μὴ καταλιπὼν σπέρμα
  choice: nang walang naiwang anak
  rationale: Ang participial phrase ay likas na ipinahahayag sa Tagalog sa pamamagitan ng “nang walang naiwang.” Sa kontekstong levirato, ang σπέρμα ay supling; ang “anak” ang pinakanatural na katumbas at hindi naman nagpapahiwatig na iisa lamang.
- source_word: ὁ τρίτος ὡσαύτως
  choice: Gayundin ang nangyari sa pangatlo
  rationale: 'Pinananatili ang elipsis ng Griyego sa natural na Tagalog: nauunawaan mula sa konteksto na ang pangatlo ay nag-asawa at namatay nang walang anak.'
