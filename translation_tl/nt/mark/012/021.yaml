  register: Modernong Filipino Tagalog na malinaw, marangal, at natural. Ginamit ang tahasang “pinakasalan” sa halip na literal ngunit maaaring malabong “kinuha,” at pinanatiling maikli ang hulíng eliptikong parirala.
