id: MRK.12.23
reference: Mark 12:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐν τῇ ἀναστάσει ⸂ὅταν ἀναστῶσιν⸃ τίνος αὐτῶν ἔσται γυνή; οἱ γὰρ ἑπτὰ ἔσχον αὐτὴν γυναῖκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/023.yaml
  text: In the resurrection[a], when they rise, whose wife will she be? For the seven had her as wife.
translation:
  language: tl
  text: Sa pagkabuhay na muli, kapag sila ay bumangon[a], kanino sa kanila siya magiging asawa? Sapagkat naging asawa siya ng pito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “kapag muli silang nabuhay.” Literal na sinasabi ng Griyego, “kapag sila ay bumangon”; nililinaw ng konteksto na ang tinutukoy ay ang pagkabuhay na muli.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάστασις
  choice: pagkabuhay na muli
  rationale: Tumutukoy rito ang pangngalan sa panghinaharap na muling pagkabuhay na pinagtatalunan nila. Ang “pagkabuhay na muli” ang natural at karaniwang katumbas sa modernong Filipino.
- source_word: ὅταν ἀναστῶσιν
  choice: kapag sila ay bumangon
  rationale: Ang ὅταν na may aorist subjunctive ay nagpapahayag ng panghinaharap na panahon. Pinananatili ng “kapag sila ay bumangon” ang payak na anyo ng Griyego nang hindi tahasang nagdaragdag ng “muli.”
- source_word: τίνος αὐτῶν
  choice: kanino sa kanila
  rationale: 'Natural nitong ipinapahayag sa Filipino ang interrogative na may partitive na diwa: alin sa pitong lalaki ang tinutukoy.'
- source_word: ἔσται γυνή
  choice: siya magiging asawa
  rationale: Ang ayos na “kanino sa kanila siya magiging asawa?” ay likas sa Filipino at malinaw na naghahayag ng relasyong pangmag-asawa.
- source_word: γυνή
  choice: asawa
  rationale: Relasyong pangmag-asawa ang malinaw na kahulugan sa parehong paglitaw; hindi ang mas malawak na kahulugang “babae.”
- source_word: οἱ γὰρ ἑπτὰ
  choice: sapagkat ... ang pito
  rationale: Ang “sapagkat” ay nagpapanatili sa paliwanag na gamit ng γάρ, at sapat ang “pito” dahil natukoy na sa konteksto ang pitong magkakapatid.
- source_word: ἔσχον αὐτὴν γυναῖκα
  choice: naging asawa siya ng pito
  rationale: Natural itong Filipino para sa kalagayang ipinahahayag ng idyomang “nagkaroon sa kaniya bilang asawa,” at hindi nito inililipat ang diin sa mismong pangyayari ng pagpapakasal.
theological_decisions:
- issue: Wika ng muling pagkabuhay sa pakikipagtalo sa mga Saduceo
  choice: pagkabuhay na muli ... kapag sila ay bumangon
  alternative: pagkabuhay mula sa mga patay ... kapag muli silang nabuhay
  rationale: Ipinapalagay ng talata ang panghinaharap na muling pagkabuhay, ngunit hindi na pinalalawak ang pananalita nang higit sa tahasang sinasabi ng Griyego. Pinananatili rin ang pagkakaiba ng pangngalang ἀνάστασις at pandiwang ἀναστῶσιν.
translation_notes:
  register: Modernong, dignificado, at madaling maunawaang Filipino. Ginamit ang “kanino sa kanila” at “naging asawa siya ng pito” bilang natural na mga pariralang Filipino habang pinananatili ang lohika at bahagyang pag-uulit ng Griyego.
