  yaml_path: translation/nt/mark/012/024.yaml
  text: 'Jesus said to them[a], “Is this not why you are mistaken: because you know neither the Scriptures nor the power of God?”'
translation:
  language: tl
  text: Sinabi sa kanila ni Jesus[a], “Hindi ba kayo nagkakamali sapagkat hindi ninyo alam ang mga Kasulatan ni ang kapangyarihan ng Diyos?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Hindi ba kayo naliligaw sapagkat hindi ninyo alam ang mga Kasulatan ni ang kapangyarihan ng Diyos?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη αὐτοῖς ὁ Ἰησοῦς
  choice: Sinabi sa kanila ni Jesus
  rationale: Likas at tumpak na panimula ito sa tuwirang pagsasalita; hindi nito idinaragdag ang di-tiyak na diwang ‘sumagot.’
- source_word: Οὐ διὰ τοῦτο
  choice: Hindi ba ito ang dahilan kung bakit
  rationale: Pinananatili ang retorikal na tanong na umaasang sasang-ayon ang kausap, pati ang sanhi o dahilan na ipinahihiwatig ng διά.
- source_word: πλανᾶσθε
  choice: kayo nagkakamali
  rationale: Ang pandiwa ay maaaring mangahulugang nagkakamali o naliligaw. Sa konteksto ng maling pagkaunawa, malinaw at natural ang ‘nagkakamali’ nang hindi nilulutas ang buong saklaw ng salita.
- source_word: μὴ εἰδότες
  choice: hindi ninyo alam
  rationale: Ginawang likas na sugnay sa Tagalog ang partisipyo habang pinananatili ang dahilan ng kanilang pagkakamali.
- source_word: τὰς γραφὰς
  choice: ang mga Kasulatan
  rationale: Tumutukoy ang maramihang γραφαί sa kinikilalang mga banal na kasulatan; pamantayan at malinaw sa Tagalog ang ‘mga Kasulatan.’
- source_word: μηδὲ τὴν δύναμιν τοῦ θεοῦ
  choice: ni ang kapangyarihan ng Diyos
  rationale: Direktang inilalarawan ang ikalawang bagay na hindi nila alam at pinananatili ang balanseng pagkakaugnay nito sa ‘mga Kasulatan.’
theological_decisions:
- issue: Saklaw ng πλανᾶσθε bilang paglalarawan sa kanilang kamalian
  choice: nagkakamali
  alternative: naliligaw / naililigaw
  rationale: Maaaring tumukoy ang Griyego sa pagiging mali o sa pagkaligaw. Binibigyang-diin ng konteksto ang kanilang maling pagkaunawa sa muling pagkabuhay, mga Kasulatan, at kapangyarihan ng Diyos. Hindi dinaragdagan ng pangunahing salin ang teksto ng tahasang moral o espirituwal na sanhi; itinatala sa talababa ang leksikal na alternatibo.
translation_notes:
  register: Makabagong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang ‘ni’ sa negatibong tambalan at ang gitling-pahaba upang maipakita nang natural ang paliwanag na sanhi.
