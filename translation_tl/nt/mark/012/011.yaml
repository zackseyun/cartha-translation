base_translation:
  language: en
  yaml_path: translation/nt/mark/012/011.yaml
  text: This came from the Lord[b][a], and it is marvelous in our eyes.
translation:
  language: tl
  text: Ito ay nagmula sa Panginoon,[a] at ito ay kahanga-hanga sa ating mga mata.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sa pamamagitan ng Panginoon.” Maaaring ipahayag ng pariralang Griyego ang pinagmulan o ang ahensiya.
    reason: lexical_alternative
  - marker: b
    text: Sinisipi ng linyang ito ang Awit 118:23.
    reason: cross_reference
lexical_decisions:
- source_word: παρὰ κυρίου
  choice: Mula sa Panginoon
  rationale: Ang παρά na may genitive ay karaniwang nagpapahayag ng pinagmulan. Likas sa modernong Tagalog ang “mula sa Panginoon,” at pinananatili nito ang tunay na posibilidad na maunawaan din ang parirala bilang ahensiya.
- source_word: κυρίου
  choice: Panginoon
  rationale: Dahil κύριος ang nasa tekstong Griyego, “Panginoon” ang tuwirang salin, kahit ang sipi mula sa Awit 118:23 ay tumutukoy sa Diyos.
- source_word: ἐγένετο
  choice: ang bagay na ito
  rationale: Sa pariralang “Mula sa Panginoon ang bagay na ito,” naipahihiwatig ng kayariang Tagalog na ito ay nagmula o naganap mula sa Panginoon. Iniwasan ang “nangyari” sapagkat maaari itong magtunog di-sinasadya.
- source_word: αὕτη
  choice: ang bagay na ito
  rationale: Ang pambabaeng panghalip na pamatlig ay tumutukoy pabalik sa naunang sinabi tungkol sa batong itinakwil at ginawang batong-panulok. Hindi idinagdag ang “bato” upang hindi maging higit na tiyak kaysa sa sugnay na Griyego.
- source_word: θαυμαστὴ
  choice: kahanga-hanga
  rationale: Ang “kahanga-hanga” ay natural, marangal, at malinaw na katumbas ng isang bagay na kamangha-mangha o pambihira.
- source_word: ἐν ὀφθαλμοῖς ἡμῶν
  choice: sa ating mga mata
  rationale: Pinananatili nito ang larawang biblikal at malinaw pa rin sa Tagalog, sa halip na gawing mas interpretatibong “para sa atin.”
theological_decisions:
- issue: Pagsasalin ng κύριος sa sipi mula sa Awit na tumutukoy sa Diyos
  choice: Panginoon
  alternative: ANG PANGINOON
  rationale: Ang tekstong Griyego ng Marcos ay may κυρίου. Kaya “Panginoon” ang ginamit, nang hindi ipinapasok sa pangunahing teksto ang anyong karaniwang ginagamit para sa banal na pangalan sa Hebreo.
- issue: Pinagmulan o ahensiya sa παρὰ κυρίου
  choice: Mula sa Panginoon
  alternative: Sa pamamagitan ng Panginoon
  rationale: Mas karaniwang ipinapahayag ng παρά na may genitive ang pinagmulan, ngunit maaari ring maunawaan ang Panginoon bilang gumaganap. Napananatili sa talababa ang alternatibong ito nang hindi nilulutas nang labis ang saklaw ng parirala.
translation_notes:
  register: Makabago at marangal na Filipino; pinananatili ang anyong patula at biblikal na “sa ating mga mata.” Inayos ang mga pananda bilang [a][b] upang tumugma sa pagkakasunod ng mga talababa.
