  text: Καὶ προσελθὼν εἷς τῶν γραμματέων ἀκούσας αὐτῶν συζητούντων, ⸀ἰδὼν ὅτι καλῶς ⸂ἀπεκρίθη αὐτοῖς⸃, ἐπηρώτησεν αὐτόν· Ποία ἐστὶν ⸂ἐντολὴ πρώτη πάντων⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/028.yaml
  text: And one of the scribes came up and heard them debating, and seeing that he had answered them well, he asked him, “Which commandment is the first of all?”
translation:
  language: tl
  text: Lumapit ang isa sa mga eskriba at narinig niya silang nagtatalo. Nang makita niyang mahusay sumagot si Jesus sa kanila, tinanong niya si Jesus, “Alin sa lahat ng utos ang una[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nangunguna sa lahat” o “pinakamahalaga sa lahat.”
    reason: Ipinapakita ang saklaw ng πρώτη, na maaaring mangahulugang una o pangunahin sa ranggo at kahalagahan.
lexical_decisions:
- source_word: γραμματέων
  choice: mga tagapagturo ng Kautusan
  rationale: Tumutukoy ito sa mga kinikilalang dalubhasa at tagapagturo ng Kautusang Judio. Mas malinaw ito sa karaniwang mambabasang Filipino kaysa sa hiram na salitang “mga eskriba,” nang hindi labis na nililimitahan ang kanilang tungkulin.
- source_word: προσελθὼν
  choice: Lumapit
  rationale: Tuwirang ipinapahayag ang paglapit ng tagapagturo kay Jesus at natural sa makabagong Tagalog.
- source_word: ἀκούσας αὐτῶν συζητούντων
  choice: narinig niya ang kanilang pagtatalo
  rationale: Ang συζητέω ay maaaring tumukoy sa talakayan o pagtatalo. Sa konteksto ng pampublikong palitan tungkol sa pinagtatalunang tanong, ang “pagtatalo” ay malinaw at likas.
- source_word: ἰδὼν ὅτι καλῶς ἀπεκρίθη αὐτοῖς
  choice: Nang makita niyang mahusay ang sagot ni Jesus sa kanila
  rationale: Pinananatili ang diwa ng καλῶς bilang “mahusay” at nililinaw ang tinutukoy ng panghalip upang maiwasan ang kalituhan sa Tagalog.
- source_word: ἐπηρώτησεν αὐτόν
  choice: tinanong niya si Jesus
  rationale: Ang “tinanong” ang pinakanatural na katumbas ng ἐπερωτάω. Inulit ang pangalang Jesus dahil maaaring maging malabo ang sunod-sunod na panghalip sa Tagalog.
- source_word: Ποία ἐστὶν ἐντολὴ
  choice: Alin sa lahat ng utos
  rationale: Ang “alin” ay angkop sa pagpili o pagtukoy mula sa maraming utos. Ang “utos” ay malinaw at natural na katumbas ng ἐντολή sa kontekstong ito.
- source_word: πρώτη πάντων
  choice: ang una sa lahat
  rationale: Pinananatili ng “una” ang pangunahing larawan ng πρῶτος habang hinahayaan ang konteksto at talababa na ipakita na maaari itong tumukoy sa ranggo o kahalagahan.
theological_decisions:
- issue: Kahulugan ng πρώτη sa tanong tungkol sa utos
  choice: una
  alternative: nangunguna; pinakamahalaga
  rationale: Maaaring mangahulugan ang πρώτη ng una sa pagkakasunod o pangunahin sa ranggo. Pinananatili sa pangunahing teksto ang “una” upang hindi agad lutasin ang saklaw ng salita, habang inilalahad sa talababa ang posibleng kahulugan ng pagiging pangunahin o pinakamahalaga.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tagapagturo ng Kautusan” sa halip na “eskriba” para madaling maunawaan ng karaniwang mambabasa. Inulit ang pangalang Jesus upang maiwasan ang kalabuan ng mga panghalip.
