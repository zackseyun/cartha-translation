  yaml_path: translation/nt/mark/012/031.yaml
  text: 'The second is this: ‘You shall love your neighbor as yourself.’ There is no other commandment greater than these[a].'
translation:
  language: tl
  text: 'Ang ikalawa ay ito: “Mahalin mo ang iyong kapwa gaya ng iyong sarili.” Walang ibang utos na higit na dakila kaysa sa mga ito.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga ito” ay maramihan at, sa konteksto, tumutukoy sa dalawang utos na magkasama.
    reason: lexical_alternative
lexical_decisions:
- source_word: δευτέρα αὕτη
  choice: Ang ikalawa ay ito
  rationale: Tinutumbasan nito ang eliptikong Griyego—ang ipinahihiwatig na tinutukoy ay ang ikalawang utos—at pinananatili ang diin sa “ikalawa” at ang ugnay nito sa naunang utos.
- source_word: Ἀγαπήσεις
  choice: Mahalin mo
  rationale: Ang anyong panghinaharap sa siping ito mula sa Kasulatan ay may puwersang pautos. Ang “Mahalin mo” ay tuwiran, natural, at malinaw sa modernong Filipino habang nananatiling marangal ang tono.
- source_word: τὸν πλησίον σου
  choice: ang iyong kapwa
  rationale: Ang “kapwa” ang natural na salin sa kontekstong etikal at tumutukoy sa ibang taong dapat mahalin, habang pinananatili ang kaugnayan sa Levitico 19:18.
- source_word: ὡς σεαυτόν
  choice: gaya ng iyong sarili
  rationale: Pinananatili nito ang maikli at tuwirang paghahambing sa Griyego nang hindi idinaragdag ang mga salitang “gaya ng pagmamahal mo,” na hindi hayagang nasa teksto.
- source_word: μείζων τούτων ἄλλη ἐντολὴ οὐκ ἔστιν
  choice: Walang ibang utos na higit na dakila kaysa sa mga ito
  rationale: Pinananatili nito ang paghahambing na ipinahahayag ng μείζων at ang maramihang τούτων, sa natural at malinaw na ayos ng modernong Filipino.
- source_word: ἐντολή
  choice: utos
  rationale: Ang “utos” ay natural at malinaw na katumbas sa Filipino at angkop sa konteksto ng mga utos ng Diyos, nang hindi nagiging labis na teknikal o makaluma.
theological_decisions:
- issue: Ang tinutukoy ng τούτων (“mga ito”) sa huling sugnay
  choice: Panatilihin ang maramihang pagtukoy sa dalawang utos na magkasama
  alternative: Unawain ito bilang pangkalahatang pagtukoy lamang sa ikalawang utos na kababanggit
  rationale: Likas na tumutukoy ang maramihang demonstratibo sa dalawang utos na pinag-uusapan sa konteksto. Pinananatili ng “mga ito” ang anyo at posibleng saklaw ng Griyego sa halip na gawin itong isahan.
translation_notes:
  register: Modernong Filipino na malinaw sa karaniwang mambabasa ngunit may marangal na himig na angkop sa sipi mula sa Kasulatan. Ginamit ang “Mahalin” sa halip na ang mas makalumang “Ibigin,” at “kapwa” upang natural na maipahayag ang etikal na diwa ng πλησίον.
