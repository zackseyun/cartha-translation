id: MRK.12.36
reference: Mark 12:36
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀αὐτὸς Δαυὶδ εἶπεν ἐν ⸂τῷ πνεύματι τῷ⸃ ἁγίῳ· ⸀Εἶπεν ⸀κύριος τῷ κυρίῳ μου· ⸀Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ⸀ὑποκάτω τῶν ποδῶν σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/036.yaml
  text: David himself said in the Holy Spirit[a], ‘The Lord said to my Lord[b], “Sit at my right hand until I put your enemies under your feet.”’
translation:
  language: tl
  text: Si David mismo ay nagsabi sa pamamagitan ng Espiritu Santo[a], ‘Sinabi ng Panginoon sa aking Panginoon[b], “Maupo ka sa kanan ko hanggang sa mailagay ko ang iyong mga kaaway sa ilalim ng iyong mga paa.”’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa Espiritu Santo.”
    reason: alternative_reading
  - marker: b
    text: Ang sipi ay mula sa Awit 110:1. Sa tekstong Hebreo, ang unang “Panginoon” ay kumakatawan sa banal na pangalan (YHWH, na tradisyonal na isinasaling “PANGINOON”), samantalang ang ikalawa ay tumutukoy sa panginoon ni David.
    reason: cross_reference
lexical_decisions:
- source_word: αὐτὸς Δαυὶδ
  choice: Si David mismo
  rationale: Pinananatili ng “mismo” ang pagdidiin ng αὐτός kay David bilang mismong nagsalita.
- source_word: ἐν τῷ πνεύματι τῷ ἁγίῳ
  choice: sa Banal na Espiritu
  rationale: Malapit ito sa ἐν at hindi nito nililimitahan ang ugnayan ng Espiritu sa pagsasalita ni David sa isang tiyak na paliwanag tungkol sa inspirasyon.
- source_word: κύριος
  choice: Panginoon
  rationale: Ang “Panginoon” ang likas at marangal na katumbas ng κύριος sa kontekstong ito.
- source_word: τῷ κυρίῳ μου
  choice: sa aking Panginoon
  rationale: Pinananatili nito ang pag-uulit ng κύριος at ang mahalagang pagkakaiba sa pagitan ng unang Panginoon at ng tinatawag ni David na “aking Panginoon.”
- source_word: Κάθου
  choice: Maupo ka
  rationale: Natural itong utos sa modernong Tagalog at angkop sa larawan ng pagluklok.
- source_word: ἐκ δεξιῶν μου
  choice: sa kanan ko
  rationale: Ito ang natural na Tagalog para sa idyomang tumutukoy sa marangal na puwesto sa kanan ng nagsasalita.
- source_word: ἕως ἂν θῶ
  choice: hanggang sa mailagay ko
  rationale: Ipinahahayag nito ang hangganang nasa hinaharap na tinutukoy ng konstruksiyong Griyego.
- source_word: ὑποκάτω τῶν ποδῶν σου
  choice: sa ilalim ng iyong mga paa
  rationale: Tapat ito sa mismong pananalita ni Marcos, na “sa ilalim ng iyong mga paa,” nang hindi idinaragdag ang “tuntungan ng paa” mula sa mas buong anyo ng salmo.
theological_decisions:
- issue: Paraan ng paglalarawan sa pagsasalita ni David kaugnay ng Espiritu Santo
  choice: nagsabi sa Banal na Espiritu
  alternative: nagsabi sa pamamagitan ng Banal na Espiritu
  rationale: Pinananatili ng pangunahing salin ang literal na puwersa ng ἐν at ang kalabuan kung ito ay tumutukoy sa kalagayan, saklaw, o kasangkapan ng inspiradong pagsasalita; ibinibigay sa talababa ang natural na alternatibo.
- issue: Puwersang kristolohikal ng sipi mula sa Awit 110:1
  choice: Sinabi ng Panginoon sa aking Panginoon
  alternative: Sinabi ni YHWH sa aking Panginoon
  rationale: Dahil κύριος ang ginamit sa dalawang pagkakataon sa tekstong Griyego, “Panginoon” ang pinanatili sa pangunahing teksto. Ipinaliliwanag sa talababa na ang una ay kumakatawan sa banal na pangalan sa tekstong Hebreo, nang hindi iyon ipinapasok sa mismong salin ng Griyego.
translation_notes:
  register: 'Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Maupo ka” sa halip na mas pormal na “Lumuklok ka” upang manatiling malapit sa payak na utos na Κάθου, habang ang “Panginoon” at ayos ng sipi ay nagpapanatili ng dignidad. Itinama ang pagkakatapat ng mga marker sa nilalaman ng mga talababa: [a] para sa alternatibong pagbasa ng pariralang tungkol sa Espiritu Santo at [b] para sa paliwanag sa dalawang gamit ng “Panginoon.”'
