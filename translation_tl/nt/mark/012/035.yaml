id: MRK.12.35
reference: Mark 12:35
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἀποκριθεὶς ὁ Ἰησοῦς ἔλεγεν διδάσκων ἐν τῷ ἱερῷ· Πῶς λέγουσιν οἱ γραμματεῖς ὅτι ὁ χριστὸς υἱὸς ⸂Δαυίδ ἐστιν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/035.yaml
  text: And Jesus answered and said[a], as he was teaching in the temple, “How do the scribes say that the Messiah is the son of David?”
translation:
  language: tl
  text: At bilang tugon, sinabi ni Jesus habang nagtuturo siya sa templo, “Paano nasasabi ng mga eskriba na ang Mesiyas[a] ay anak ni David?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Cristo.” Ang titulong Griyego ay Christos, na ginagamit dito sa mesiyanikong diwa nito.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: bilang tugon
  rationale: Ipinahihiwatig ng participle na tumutugon si Jesus sa naunang usapan o kalagayan kahit walang tahasang tanong kaagad bago nito. Iniiwasan ng pariralang ito ang di-likas na “sumagot” kapag walang tuwirang tanong.
- source_word: ἔλεγεν
  choice: sinabi
  rationale: Bagaman imperfect ang anyo at maaaring ipakahulugang “sinasabi,” mas natural sa salaysay na Filipino ang “sinabi”; naipakikita naman ng kasunod na “habang nagtuturo” ang nagpapatuloy na tagpo.
- source_word: διδάσκων
  choice: habang nagtuturo siya
  rationale: Ipinakikita ng present participle na kasabay ng pagtuturo ang pagsasalita ni Jesus.
- source_word: ἐν τῷ ἱερῷ
  choice: sa templo
  rationale: Ang ἱερόν ay tumutukoy sa kabuuang nasasakupan ng templo, at ang “sa templo” ang karaniwan at malinaw na katumbas sa Filipino.
- source_word: Πῶς λέγουσιν
  choice: Paano nasasabi
  rationale: Pinananatili nito ang anyong retorikal ng tanong nang hindi dinaragdagan ng tahasang “maaari,” na maaaring magpasidhi sa hamon nang higit sa mismong Griyego.
- source_word: γραμματεῖς
  choice: mga eskriba
  rationale: Ang “eskriba” ang makasaysayan at kinikilalang tawag sa grupong tinutukoy sa mga Ebanghelyo; mas tiyak ito kaysa sa interpretibong “mga guro ng Kautusan.”
- source_word: ὁ χριστός
  choice: ang Mesiyas
  rationale: Dito ay malinaw na titulo ang Χριστός sa konteksto ng pag-asang mesiyaniko ng mga Judio, kaya “Mesiyas” ang pangunahing salin.
- source_word: υἱὸς Δαυίδ
  choice: anak ni David
  rationale: Natural sa Filipino ang “anak ni David” at maaari itong tumukoy sa kinikilalang mesiyanikong katawagan at sa pagiging inapo ni David, gaya ng hinihingi ng konteksto.
theological_decisions:
- issue: Pagbibigay-kahulugan sa Χριστός bilang titulo
  choice: Mesiyas
  alternative: Cristo
  rationale: Ginagamit dito ang Χριστός bilang titulong kaugnay ng inaasahang haring mula sa angkan ni David. Pinananatili ng “Mesiyas” ang kontekstong Judio; inilalagay sa talababa ang tradisyonal na “Cristo” bilang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang retorikal na anyo ng tanong at ang bahagyang di-tahasang katangian ng “bilang tugon,” yamang walang agarang tanong na binanggit sa talata. Ginamit ang “eskriba” at “Mesiyas” bilang tiyak na katawagang pangkasaysayan at teolohikal.
