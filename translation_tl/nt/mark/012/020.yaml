base_translation:
  language: en
  yaml_path: translation/nt/mark/012/020.yaml
  text: There were seven brothers; and the first took a wife[a], and when he died he left no offspring.
translation:
  language: tl
  text: May pitong magkakapatid na lalaki. Nag-asawa ang una, at nang mamatay siya, wala siyang iniwang supling.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “binhi”; ginagamit dito ang salitang Griyego bilang tawag sa supling o kaapu-apuhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑπτὰ ἀδελφοὶ ἦσαν
  choice: May pitong magkakapatid na lalaki
  rationale: Natural na Filipino para sa existential clause, habang nililinaw na mga lalaking magkakapatid ang tinutukoy sa konteksto.
- source_word: ὁ πρῶτος
  choice: ang una
  rationale: Ipinapakita ang pagkakasunod-sunod nang hindi idinaragdag ang di-tiyak na kahulugang 'panganay.'
- source_word: ἔλαβεν γυναῖκα
  choice: Nag-asawa
  rationale: Natural at malinaw na salin ng idyomang Griyego na tumutukoy sa pag-aasawa; hindi kailangang panatilihin ang literal ngunit di-natural na 'kumuha ng asawa.'
- source_word: ἀποθνῄσκων
  choice: nang mamatay siya
  rationale: Natural na temporal clause sa Filipino na malinaw na naghahayag ng ugnayan ng participle sa pangunahing pandiwa.
- source_word: οὐκ ἀφῆκεν
  choice: wala siyang iniwang
  rationale: Idyomatikong Filipino para sa hindi pag-iiwan ng kaapu-apuhan pagkamatay.
- source_word: σπέρμα
  choice: supling
  rationale: Sa kontekstong pampamilya at legal, tumutukoy ito sa anak o kaapu-apuhan; pinananatili ng 'supling' ang mas malawak na diwa kaysa sa isahang 'anak.'
