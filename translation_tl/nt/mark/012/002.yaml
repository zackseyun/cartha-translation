  text: καὶ ἀπέστειλεν πρὸς τοὺς γεωργοὺς τῷ καιρῷ δοῦλον, ἵνα παρὰ τῶν γεωργῶν λάβῃ ἀπὸ ⸂τῶν καρπῶν⸃ τοῦ ἀμπελῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/002.yaml
  text: And at the proper time he sent a servant to the vine-growers[b][a], so that he might receive from the vine-growers some of the fruit of the vineyard.
translation:
  language: tl
  text: Nang dumating ang takdang panahon, nagsugo siya ng isang alipin[b] sa mga magsasaka[a], upang tumanggap mula sa kanila ng ilang bunga ng ubasan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga nagsasaka sa ubasan” o “mga umuupa ng ubasan.” Ang salitang Griyego ay tumutukoy sa mga nagsasaka ng lupa; nililinaw ng konteksto na ubasan ang kanilang sinasaka.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “lingkod.” Ang Griyegong δοῦλος ay karaniwang tumutukoy sa isang alipin, bagaman madalas din itong isalin na “lingkod.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: nagsugo
  rationale: Likas at malinaw na salin ng pagpapadala sa isang kinatawan; pinananatili nito ang kilos ng ἀποστέλλω nang hindi nagiging labis na pormal.
- source_word: γεωργοὺς / γεωργῶν
  choice: mga magsasaka
  rationale: Ang γεωργός ay taong nagsasaka o gumagawa sa lupa. Malinaw at karaniwan ang “mga magsasaka”; ipinahihiwatig ng konteksto na ubasan ang kanilang sinasaka, samantalang ang posibleng katayuan nila bilang mga umuupa ay hindi tahasang nakasaad sa salita.
- source_word: τῷ καιρῷ
  choice: nang dumating ang takdang panahon
  rationale: Ipinahahayag ng καιρός ang angkop o itinakdang panahon. Natural itong pakinggan sa salaysay at hindi tahasang dinaragdagan ng “anihan,” bagaman maaaring iyon ang ipinahihiwatig ng konteksto.
- source_word: δοῦλον
  choice: alipin
  rationale: Tumpak na inilalarawan ng “alipin” ang kalagayang panlipunan ng δοῦλος sa sinaunang daigdig. Inilalagay sa talababa ang “lingkod” bilang mas tradisyonal ngunit mas malawak na alternatibo.
- source_word: ἵνα ... λάβῃ
  choice: upang tumanggap
  rationale: Pinananatili ng “upang” ang layuning ipinahahayag ng ἵνα, at natural na katumbas ng λάβῃ ang “tumanggap” sa kontekstong ito.
- source_word: παρὰ τῶν γεωργῶν
  choice: mula sa kanila
  rationale: Ipinahahayag ng παρά na may genitive ang pinagmulan. Ginamit ang panghalip upang maiwasan ang mabigat na pag-uulit, habang nananatiling malinaw na tumutukoy ito sa mga magsasaka.
- source_word: ἀπὸ τῶν καρπῶν τοῦ ἀμπελῶνος
  choice: bahagi sa mga bunga ng ubasan
  rationale: Ipinakikita ng ἀπό na kukuha siya ng isang bahagi mula sa kabuuang ani. Hindi idinagdag ang “kaniyang parte,” sapagkat bagaman lohikal sa talinghaga, hindi iyon tahasang sinasabi ng Griyego.
- source_word: ἀμπελῶνος
  choice: ubasan
  rationale: Karaniwan, malinaw, at tiyak na salin ng ἀμπελών.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nagsugo” at “takdang panahon” bilang natural ngunit bahagyang mataas na pananalita na angkop sa salaysay. Ang mga talababa ay nagpapanatili sa mga tunay na alternatibong leksikal nang hindi ipinapasok sa pangunahing teksto ang katayuang “umuupa,” na hindi tahasang nakapaloob sa γεωργός.
