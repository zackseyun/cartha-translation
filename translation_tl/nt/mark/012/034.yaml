    issue: Hindi likas at bahagyang naililihis ang “may wastong pag-unawa ang kanyang sagot.”
    rationale: 'Ang νουνεχῶς ay pang-abay na naglalarawan sa ἀπεκρίθη: ang lalaki ang sumagot nang may katalinuhan o katinuan. Mas malinaw na ilahad ito bilang “matinong sumagot.”'
  - severity: low
    issue: Maaaring malabo ang “sa kanya” sa huling pangungusap.
    rationale: Bagaman malamang na tumutukoy ito kay Jesus, ang paggamit ng “kay Jesus” ay nagbibigay ng malinaw na reperente nang walang dagdag na kahulugan.
