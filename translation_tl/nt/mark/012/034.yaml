  to: Nang makita ni Jesus na matinong sumagot ang lalaki, sinabi niya rito, “Hindi ka malayo sa kaharian ng Diyos.”[a] At wala nang nangahas na magtanong kay Jesus.
  rationale: Pinalitan ang di-likas na paglalarawan sa “sagot” ng pang-abay na konstruksyong tuwirang naglalarawan sa paraan ng pagsagot ng lalaki, alinsunod sa νουνεχῶς ἀπεκρίθη. Nilinaw rin ang huling reperente. Pinanatili ang “Hindi ka malayo” at ang talababa upang huwag ipahiwatig na nakapasok na siya sa kaharian.
