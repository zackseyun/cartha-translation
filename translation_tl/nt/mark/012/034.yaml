id: MRK.12.34
reference: Mark 12:34
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ὁ Ἰησοῦς ἰδὼν ⸀αὐτὸν ὅτι νουνεχῶς ἀπεκρίθη εἶπεν αὐτῷ· Οὐ μακρὰν εἶ ἀπὸ τῆς βασιλείας τοῦ θεοῦ. καὶ οὐδεὶς οὐκέτι ἐτόλμα αὐτὸν ἐπερωτῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/034.yaml
  text: And Jesus[a], seeing that he had answered wisely, said to him, “You are not far from the kingdom of God.” And no one any longer dared to question him.
translation:
  language: tl
  text: Nang makita ni Jesus na matinong sumagot ang lalaki, sinabi niya rito, “Hindi ka malayo sa kaharian ng Diyos.”[a] At wala nang nangahas na magtanong kay Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Malapit ka sa kaharian ng Diyos.” Pagiging malapit ang ipinapahayag ng Griyego, hindi tahasang pagpasok sa kaharian.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: Nang makita
  rationale: Likas itong anyo sa Tagalog para sa participle at malinaw na inilalahad ang obserbasyong naging batayan ng sinabi ni Jesus.
- source_word: νουνεχῶς
  choice: may wastong pag-unawa
  rationale: Ipinahihiwatig ng salita ang matino at mahusay na pag-unawa, hindi lamang pangkalahatang katalinuhan. Dignified at natural ito sa konteksto.
- source_word: ἀπεκρίθη
  choice: ang kanyang sagot
  rationale: 'Isinama sa sugnay na “may wastong pag-unawa ang kanyang sagot” upang maging natural sa Tagalog habang pinananatili ang pagkakasunod: napansin muna ni Jesus ang kalidad ng sagot bago siya nagsalita.'
- source_word: Οὐ μακρὰν εἶ ἀπὸ
  choice: Hindi ka malayo sa
  rationale: Pinananatili nito ang talinghaga ng distansiya at hindi nito ipinahihiwatig na nakapasok na ang eskriba sa kaharian.
- source_word: βασιλείας τοῦ θεοῦ
  choice: kaharian ng Diyos
  rationale: Ito ang karaniwan at malinaw na salin sa konteksto ng mga Ebanghelyo at maaari pa ring tumukoy kapwa sa paghahari at sakop ng paghahari ng Diyos.
- source_word: οὐκέτι
  choice: wala nang
  rationale: Natural na ipinapahayag nito na mula sa puntong iyon ay hindi na ipinagpatuloy ng sinuman ang pagtatanong.
- source_word: ἐτόλμα
  choice: nangahas
  rationale: Tuwirang ipinapakita nito ang kawalan ng lakas ng loob na magtanong pa kay Jesus.
- source_word: ἐπερωτῆσαι
  choice: mag­tanong
  rationale: Ito ang natural na salin sa Tagalog. Sa konteksto, malinaw na hindi ito karaniwang pagtatanong lamang kundi pagharap kay Jesus sa pamamagitan ng mga tanong.
theological_decisions:
- issue: Kalagayan ng eskriba kaugnay ng kaharian ng Diyos
  choice: Hindi ka malayo sa kaharian ng Diyos
  alternative: Malapit ka sa kaharian ng Diyos
  rationale: Proximity ang tahasang ipinapahayag ng Griyego, hindi pagpasok o pagiging ganap na kabilang sa kaharian. Pinananatili ng salin ang tensiyon sa pagitan ng papuri ni Jesus sa pag-unawa ng lalaki at ng kawalan ng pahayag na nakapasok na siya sa kaharian.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “may wastong pag-unawa” sa halip na mas kolokyal na “matalino” upang idiin ang matinong pagkaunawa sa sagot. Iniwasan ang sobrang teknikal o denominasyonal na pananalita.
