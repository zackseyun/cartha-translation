translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Cesar,” ang nakaugaliang anyong Tagalog ng titulong Caesar. Isinalin ang historical present bilang pangnagdaan para sa natural na daloy ng salaysay.
