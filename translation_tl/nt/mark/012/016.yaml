  text: οἱ δὲ ἤνεγκαν. καὶ λέγει αὐτοῖς· Τίνος ἡ εἰκὼν αὕτη καὶ ἡ ἐπιγραφή; οἱ δὲ εἶπαν αὐτῷ· Καίσαρος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/016.yaml
  text: And they brought one. And he says to them[a], “Whose image is this, and whose inscription?” And they said to him, “Caesar’s.”
translation:
  language: tl
  text: At nagdala sila ng isang barya. Sinabi niya sa kanila, “Kaninong larawan ito at kanino ang inskripsiyong ito?” Sumagot sila sa kanya, “Kay Cesar.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤνεγκαν
  choice: nagdala sila ng isang barya
  rationale: 'Ang layon ng pandiwa ay ipinahihiwatig ng naunang konteksto: ang denario na hiningi ni Jesus. Nililinaw ng “isang barya” ang likas na diwa sa Tagalog nang hindi inuulit ang tiyak na uri ng barya.'
- source_word: λέγει
  choice: Sinabi niya
  rationale: Bagaman historical present ang Griyego, mas natural sa makabagong salaysay sa Tagalog ang aspektong pangnagdaan. Hindi nito binabago ang pangyayari.
- source_word: Τίνος
  choice: Kaninong / kanino
  rationale: Ipinahahayag ng mga anyong ito ang pag-aari o pagkakaugnay na tinatanong sa genitibong interrogative.
- source_word: εἰκών
  choice: larawan
  rationale: Ang “larawan” ay natural at malinaw para sa imaheng nakaukit sa barya at pinananatili rin ang karaniwang biblikal na saklaw ng salita.
- source_word: ἐπιγραφή
  choice: nakasulat dito
  rationale: Sa konteksto ng barya, tumutukoy ito sa inskripsiyong nakalagay rito. Mas madaling maunawaan ng karaniwang mambabasa ang “nakasulat dito” kaysa “inskripsiyon.”
- source_word: Καίσαρος
  choice: Sa Cesar
  rationale: Likas na sagot ito sa Tagalog sa tanong na “kanino,” at ipinahahayag ang kaugnayan ng larawan at nakasulat sa emperador ng Roma.
