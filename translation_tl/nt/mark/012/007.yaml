  source_fidelity: Tumpak na naihahatid ng salin ang banayad na pagsalungat ng δέ, ang katayuan ng γεωργοί bilang mga magsasakang umuupa, ang sama-samang pag-uusap, ang tuwirang pagkilala sa tagapagmana, ang panawagang hortatoryo, at ang diin na ang mana ay magiging kanila. Walang idinagdag na ‘kaniyang’ sa mana, alinsunod sa Griyego.
  naturalness: 'Natural at malinaw ang modernong Filipino: “mga magsasakang umuupa,” “sa isa’t isa,” at “mapapasaatin ang mana” ay madaling unawain at angkop sa marangal na rehistro ng talinghaga. Ang “Halikayo” ay bahagyang mas mataas ang rehistro ngunit wasto at angkop sa pagsasalitang pangkat.'
