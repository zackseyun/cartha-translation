id: MRK.12.7
reference: Mark 12:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐκεῖνοι δὲ οἱ γεωργοὶ ⸂πρὸς ἑαυτοὺς εἶπαν⸃ ὅτι Οὗτός ἐστιν ὁ κληρονόμος· δεῦτε ἀποκτείνωμεν αὐτόν, καὶ ἡμῶν ἔσται ἡ κληρονομία.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/007.yaml
  text: But those tenant farmers said to one another[a], ‘This is the heir. Come, let us kill him[b], and the inheritance will be ours.’
translation:
  language: tl
  text: Ngunit sinabi ng mga magsasakang umuupa sa isa’t isa[a], “Ito ang tagapagmana. Halikayo, patayin natin siya, at mapapasaatin ang mana.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kanilang sarili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνοι δὲ οἱ γεωργοὶ
  choice: Ngunit sinabi ng mga magsasakang umuupa
  rationale: Ipinahahayag ng “ngunit” ang banayad na pagsalungat ng δέ, at nililinaw ng “mga magsasakang umuupa” na ang γεωργοί ay mga taong umuupa at nagsasaka ng ubasan, hindi lamang mga trabahador.
- source_word: πρὸς ἑαυτοὺς εἶπαν
  choice: sinabi ... sa isa’t isa
  rationale: Natural itong pahayag sa Filipino para sa pag-uusap sa loob ng grupo at pinananatili ang diwang magkakausap sila, sa halip na pawang nagsasalita sa sarili.
- source_word: Οὗτός ἐστιν ὁ κληρονόμος
  choice: Ito ang tagapagmana
  rationale: Ang “tagapagmana” ang natural at karaniwang terminong Filipino para sa κληρονόμος, habang pinananatili ng “ito” ang tuwirang pagtukoy.
- source_word: δεῦτε ἀποκτείνωμεν αὐτόν
  choice: Halikayo, patayin natin siya
  rationale: Ang “halikayo” ay isang likas na panawagan sa maramihan, at ang “patayin natin” ay tuwirang naghahatid ng hortatoryong anyo nang hindi nagdaragdag ng legal na kahulugan ng pagpaslang.
- source_word: καὶ ἡμῶν ἔσται ἡ κληρονομία
  choice: at mapapasaatin ang mana
  rationale: Maikli at natural itong Filipino na pinananatili ang diin sa magiging pag-aari nila; hindi idinagdag ang “kaniyang” sapagkat wala iyon sa Griyego.
theological_decisions:
- issue: Paglalarawan sa γεωργοί sa talinghaga
  choice: mga magsasakang umuupa
  alternative: mga magsasaka; mga nangungupahan; mga tagapag-alaga ng ubasan
  rationale: Ipinakikita ng napiling parirala ang ugnayan nila sa may-ari bilang mga umuupa at nagsasaka, nang hindi nagdaragdag ng alegorikal o denominasyonal na pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “halikayo” bilang natural na panawagan sa pangkat, at “mapapasaatin ang mana” bilang payak ngunit matapat na pagpapahayag ng inaasahan nilang pag-angkin.
