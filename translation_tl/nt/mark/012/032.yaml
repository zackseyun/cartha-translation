  text: ⸀καὶ εἶπεν αὐτῷ ὁ γραμματεύς· Καλῶς, διδάσκαλε, ἐπ’ ἀληθείας εἶπες ὅτι εἷς ἐστιν καὶ οὐκ ἔστιν ἄλλος πλὴν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/032.yaml
  text: And the scribe said to him[a], “Well said, Teacher. You have spoken truly that he is one, and there is no other besides him.”
translation:
  language: tl
  text: At sinabi sa kanya ng eskriba, “Tama, Guro. Totoong sinabi ninyo na Siya ay iisa[a], at wala nang iba maliban sa kanya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas tahasan ayon sa konteksto, “iisa ang Diyos.” Sa Griyego, hindi tahasang inuulit ang “Diyos”; ipinahihiwatig ang paksa mula sa naunang konteksto.
    reason: alternative_reading
lexical_decisions:
- source_word: γραμματεύς
  choice: tagapagturo ng Kautusan
  rationale: Tumutukoy ito sa isang kinikilalang dalubhasa at tagapagturo ng Torah. Mas malinaw sa karaniwang modernong mambabasa ang “tagapagturo ng Kautusan” kaysa sa hiram na salitang “eskriba,” bagaman bahagyang mas paliwanag ito kaysa sa payak na katawagan sa Griyego.
- source_word: Καλῶς
  choice: Tama
  rationale: Sa tugon ng tagapagturo, nagpapahayag ito ng pagsang-ayon sa naunang sagot ni Jesus. Likas at maikli sa modernong Tagalog ang “Tama.”
- source_word: διδάσκαλε
  choice: Guro
  rationale: Ang “Guro” ang tuwirang at karaniwang katumbas ng katawagang διδάσκαλε sa salaysay ng mga Ebanghelyo.
- source_word: ἐπ’ ἀληθείας εἶπες
  choice: Totoo ang sinabi ninyo
  rationale: Pinananatili nito ang pagpapatunay na ang sinabi ni Jesus ay totoo. Ang magalang na “ninyo” ay likas sa direktang pakikipag-usap sa isang kinikilalang guro sa Filipino, nang hindi dinaragdagan ang titulo ni Jesus.
- source_word: ὅτι
  choice: ':'
  rationale: Ipinakikilala ng ὅτι ang nilalaman ng sinabi ni Jesus. Sa Filipino, malinaw at natural na naihahatid ito rito sa pamamagitan ng tutuldok sa halip na ng mas mabigat na “na.”
- source_word: εἷς ἐστιν
  choice: iisa siya
  rationale: Hindi tahasang inuulit ng Griyego ang salitang “Diyos”; ipinahihiwatig ang paksa mula sa naunang konteksto. Pinananatili ng “iisa siya” ang maikli at eliptikong anyo ng pinagmulan.
- source_word: οὐκ ἔστιν ἄλλος
  choice: wala nang iba
  rationale: Ito ang likas na Filipino para sa pahayag na walang ibang umiiral na maihahambing o maidaragdag sa tinutukoy.
- source_word: πλὴν αὐτοῦ
  choice: maliban sa kanya
  rationale: Tuwirang ipinahahayag ng “maliban sa kanya” ang diwang eksepsiyon at pagiging bukod-tangi ng πλὴν αὐτοῦ.
theological_decisions:
- issue: Hindi tahasang binanggit na paksa ng εἷς ἐστιν
  choice: “iisa siya” sa pangunahing teksto
  alternative: “iisa ang Diyos” o “may iisang Diyos”
  rationale: Maliwanag sa naunang konteksto na Diyos ang tinutukoy, ngunit hindi inuulit ng mismong talata ang θεός. Pinananatili ng salin ang tunay na pagkapaikli ng Griyego at hinahayaang ang konteksto ang magbigay ng tinutukoy, habang nililinaw sa talababa ang mas tahasang alternatibo.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “tagapagturo ng Kautusan” para madaling maunawaan ng karaniwang mambabasa, at ang magalang na “ninyo” bilang likas na paraan ng pakikipag-usap sa isang guro.
