  text: ⸀καὶ λαβόντες αὐτὸν ἔδειραν καὶ ἀπέστειλαν κενόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/003.yaml
  text: And they took him[a], beat him, and sent him away empty-handed.
translation:
  language: tl
  text: At dinakma nila siya, binugbog, at pinaalis nang walang dala.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ipinadala nilang walang anumang natanggap.” Literal na “walang laman” ang salitang Griyego na κενόν; dito, nangangahulugan itong ipinadala nila ang alipin nang walang anumang dala o natanggap.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: sinunggaban
  rationale: Ang aorist participle ng λαμβάνω ay nagsasaad ng kilos na nauna sa mga pangunahing pandiwa. Sa marahas na kontekstong ito, natural na ipinahihiwatig ng “sinunggaban” ang pagdakip sa alipin nang hindi lumalabis sa diwa ng Griyego.
- source_word: ἔδειραν
  choice: binugbog
  rationale: Ang δέρω ay nangangahulugang bugbugin o hampasin. Malinaw at karaniwan ang “binugbog,” at hindi nito ipinapalagay ang mas tiyak at pormal na parusang paghagupit.
- source_word: ἀπέστειλαν
  choice: pinaalis
  rationale: Sa konteksto, ang ἀποστέλλω ay tumutukoy sa pagpapalayo sa alipin mula sa kanilang kinaroroonan. Natural sa Tagalog ang “pinaalis” at malinaw na inihahayag na itinaboy nila siya pagkatapos bugbugin.
- source_word: κενόν
  choice: nang walang dala
  rationale: Ang κενόν, na literal na “walang laman,” ay ginamit upang ipakitang umalis ang alipin nang walang natanggap na bunga o anumang maibabalik. Ang “nang walang dala” ang malinaw at idiomatikong katumbas sa Tagalog.
- source_word: καὶ ... καὶ
  choice: Kaya ... at
  rationale: Pinag-uugnay ng mga καί ang magkakasunod na kilos. Ginamit ang “Kaya” sa simula upang natural na iugnay ang talata sa naunang pangyayari, at “at” upang mapanatili ang payak na daloy ng salaysay.
