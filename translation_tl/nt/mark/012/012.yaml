  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἐζήτουν αὐτὸν κρατῆσαι, καὶ ἐφοβήθησαν τὸν ὄχλον, ἔγνωσαν γὰρ ὅτι πρὸς αὐτοὺς τὴν παραβολὴν εἶπεν. καὶ ἀφέντες αὐτὸν ἀπῆλθον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/012.yaml
  text: And they were seeking to seize him[a], but they feared the crowd, for they knew that he had spoken the parable against them. So they left him and went away.
translation:
  language: tl
  text: Kaya sinikap nilang dakpin siya, ngunit natakot sila sa karamihan, sapagkat alam nilang sinabi niya ang talinghaga laban sa kanila.[a] Kaya iniwan nila siya at umalis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “patungkol sa kanila” o “sa kanila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτουν
  choice: sinikap nilang
  rationale: Ipinahihiwatig ng imperpektong aspekto ang patuloy o tinangkang pagkilos. Likas sa Tagalog ang “sinikap nilang” para sa pagtatangkang hindi naisakatuparan, nang hindi dinaragdagan ang motibo.
- source_word: κρατῆσαι
  choice: dakpin
  rationale: Sa konteksto, nangangahulugan itong sunggaban o hulihin. Ang “dakpin” ay natural at may puwersa ng pagkuha sa isang tao, ngunit hindi kinakailangang magpahiwatig ng pormal na prosesong legal.
- source_word: ἐφοβήθησαν τὸν ὄχλον
  choice: natakot sila sa mga tao
  rationale: Direkta at natural na salin ng pagkatakot nila sa karamihan. Mas karaniwan sa modernong Tagalog ang “mga tao” kaysa “pulutong” sa ganitong pangungusap.
- source_word: ἔγνωσαν
  choice: alam nilang
  rationale: Pinananatili ang tuwirang kahulugan ng pagkilala o pagkaalam; hindi na kailangan ang mas interpretatibong “napagtanto.”
- source_word: πρὸς αὐτοὺς
  choice: laban sa kanila
  rationale: Dahil sa mapanlabang konteksto, malinaw na ang talinghaga ay nakatuon sa kanila sa masamang diwa. Gayunman, pinananatili sa talababa ang mas neutral na posibilidad na “patungkol sa kanila” o “sa kanila.”
- source_word: τὴν παραβολὴν
  choice: ang talinghaga
  rationale: Karaniwan at dignipikadong katumbas ng παραβολή, at tinutukoy ng pantukoy ang naunang talinghaga.
- source_word: εἶπεν
  choice: sinabi niya
  rationale: Natural na Tagalog ang payak na nagdaang anyo; sapat na ang konteksto upang ipakita na nauna ang pagsasabi sa kanilang pagkaalam.
- source_word: ἀφέντες αὐτὸν
  choice: iniwan nila siya
  rationale: Ipinapahayag na pinabayaan nila si Jesus at itinigil ang tangkang pagdakip sa sandaling iyon.
- source_word: ἀπῆλθον
  choice: umalis
  rationale: Maikli, malinaw, at natural na modernong Tagalog para sa paglayo nila sa lugar.
theological_decisions:
- issue: Puwersa ng πρὸς αὐτούς
  choice: laban sa kanila
  alternative: patungkol sa kanila; sa kanila
  rationale: Ang reaksiyon nilang pagdakip kay Jesus ay sumusuporta sa adversatibong diwa, ngunit hindi ganap na isinasara ng pariralang Griyego ang mas neutral na kahulugang reperensiyal o direktibo; kaya inilagay ang mga iyon sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at dignipikado. Ginamit ang “dakpin” sa halip na mas pormal na “arestuhin” upang manatiling malapit sa leksikal na saklaw ng κρατέω. Ginamit ang “mga tao” para sa ὄχλος upang maging likas sa karaniwang mambabasa.
