  text: οἱ κατεσθίοντες τὰς οἰκίας τῶν χηρῶν καὶ προφάσει μακρὰ προσευχόμενοι· οὗτοι λήμψονται περισσότερον κρίμα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/040.yaml
  text: who devour widows’ houses and for appearance’s sake pray at length—these will receive greater condemnation[a][b].
translation:
  language: tl
  text: Sila ang lumalamon sa mga bahay ng mga balo at nagdarasal nang mahaba para magpakitang-tao[a]. Sila ay tatanggap ng mas mabigat na hatol[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “bilang pagkukunwari” o “para magkunwari.”
    reason: lexical_alternative
  - marker: b
    text: O, “mas matinding kaparusahan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεσθίοντες
  choice: lumalamon
  rationale: Pinananatili nito ang matingkad na larawan ng sakim at mapaminsalang pag-ubos, sa halip na palitan ito ng mas patag na paliwanag na gaya ng “nagsasamantala.”
- source_word: οἰκίας
  choice: mga bahay
  rationale: Ito ang tuwirang kahulugan ng salita. Maaaring saklawin sa konteksto ang tahanan, sambahayan, o ari-arian ng mga balo, ngunit hindi iyon nilimitahan sa pangunahing teksto.
- source_word: χηρῶν
  choice: ng mga balo
  rationale: Tuwirang ipinakikita ng pariralang paari kung kanino ang mga bahay at kung sino ang mga biktima.
- source_word: προφάσει
  choice: para magpakitang-tao
  rationale: Likas at malinaw itong Filipino para sa panalanging ginagamit bilang panlabas na palabas o pagkukunwari. Inilalagay sa talababa ang mas pormal na mga alternatibo.
- source_word: μακρὰ
  choice: nang mahaba
  rationale: Ginagamit ang salita bilang pang-abay at tumutukoy sa mahabang tagal ng pagdarasal.
- source_word: προσευχόμενοι
  choice: nagdarasal
  rationale: Natural na pandiwang Filipino ito na nagpapanatili sa kasalukuyang paglalarawan sa kanilang gawain.
- source_word: λήμψονται
  choice: tatanggap
  rationale: Tumpak na inilalarawan ang hinaharap na pagtanggap ng hatol at naaangkop sa marangal at mabigat na tono.
- source_word: περισσότερον
  choice: mas mabigat
  rationale: Mas likas sa Filipino ang “mas mabigat na hatol” kaysa literal na “mas malaking hatol,” habang pinananatili ang paghahambing ng antas.
- source_word: κρίμα
  choice: hatol
  rationale: Pinananatili ng “hatol” ang saklaw ng salitang Griyego at, sa kontekstong ito, malinaw na nagpapahiwatig ng hatol na laban sa nagkasala nang hindi agad pinapaliit ang kahulugan sa mismong kaparusahan.
theological_decisions:
- issue: Diwa ng κρίμα sa babala laban sa mapagkunwaring mga pinunong panrelihiyon
  choice: mas mabigat na hatol
  alternative: mas matinding kaparusahan
  rationale: Ang konteksto ay malinaw na nagbababala tungkol sa maparusang pagtutuos, ngunit ang “hatol” ay mas tuwirang katumbas at pinananatili ang bahagyang mas malawak na saklaw ng κρίμα. Ang talababa ay nagbibigay ng posibleng mas tiyak na maparusang diwa nang hindi ipinipilit iyon sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino na malinaw sa karaniwang mambabasa ngunit may marangal at mabigat na himig. Pinanatili ang matingkad na metapora ng “lumalamon” at ang konkretong “mga bahay,” samantalang ginawang idiomatiko ang προφάσει bilang “para magpakitang-tao.”
