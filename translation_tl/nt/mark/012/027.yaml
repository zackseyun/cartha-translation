id: MRK.12.27
reference: Mark 12:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὐκ ἔστιν ⸀θεὸς νεκρῶν ⸀ἀλλὰ ζώντων· ⸀πολὺ πλανᾶσθε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/027.yaml
  text: He is not God of the dead[a], but of the living[b]. You are greatly mistaken.
translation:
  language: tl
  text: Hindi siya Diyos ng mga patay, kundi ng mga buhay. Lubha kayong nagkakamali.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Lubha kayong naliligaw.”'
    reason: Pinananatili nito ang posibleng diwa ng πλανᾶσθε bilang pagkaligaw, samantalang ang pangunahing teksto ay gumagamit ng mas natural na ‘nagkakamali.’
lexical_decisions:
- source_word: θεὸς
  choice: Diyos
  rationale: Bagaman walang pantukoy ang θεός, tumutukoy ito sa Diyos nina Abraham, Isaac, at Jacob sa agarang konteksto, hindi sa ‘isang diyos.’
- source_word: νεκρῶν
  choice: ng mga patay
  rationale: Ang pangmaramihang genitive ay ginagamit bilang pangngalan at likas na isinasalin sa Filipino bilang ‘mga patay.’
- source_word: ἀλλὰ ζώντων
  choice: kundi ng mga buhay
  rationale: Ang participle na ζώντων ay ginagamit bilang pangngalan. Pinananatili ng ‘mga buhay’ ang tuwirang pagsalungat sa ‘mga patay.’
- source_word: πολὺ
  choice: lubha
  rationale: Ginagamit itong pang-abay upang palakasin ang πλανᾶσθε; ang ‘lubha’ ay maikli, malinaw, at marangal ang himig.
- source_word: πλανᾶσθε
  choice: nagkakamali kayo
  rationale: Maaaring ipahiwatig ng anyong middle/passive ang pagkaligaw o pagkadaya. Ang ‘nagkakamali’ ay natural sa konteksto at hindi nagpapasya kung panlabas na panlilinlang o sariling pagkaligaw ang sanhi.
- source_word: οὐκ ἔστιν
  choice: Hindi siya
  rationale: Walang tahasang panghalip sa Griyego, ngunit ang paksa ay makukuha sa naunang pagbanggit sa Diyos. Kailangan at natural sa Filipino ang ‘siya’ upang malinaw ang pangungusap.
theological_decisions:
- issue: Ang ipinahihiwatig na patuloy na buhay sa harap ng Diyos sa pangangatwiran ni Jesus
  choice: Panatilihin ang payak na pagsalungat sa ‘mga patay’ at ‘mga buhay.’
  alternative: Ipaliwanag nang tuwiran na buhay pa sa Diyos ang mga patriyarka o na pinatutunayan nito ang muling pagkabuhay.
  rationale: Ginagamit ni Jesus ang pahayag bilang argumento tungkol sa muling pagkabuhay, ngunit hindi dapat idagdag ng salin ang isang paliwanag tungkol sa kalagayan pagkamatay o ang paraan ng muling pagkabuhay.
translation_notes:
  register: Makabago at madaling maunawaang Filipino na may marangal na himig. Ginamit ang ‘kundi’ para sa malinaw na pagsalungat at ‘lubha’ upang ihatid ang diin nang hindi masyadong kolokyal.
