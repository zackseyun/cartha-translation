  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἤρξατο αὐτοῖς ἐν παραβολαῖς ⸀λαλεῖν· Ἀμπελῶνα ⸂ἄνθρωπος ἐφύτευσεν⸃, καὶ περιέθηκεν φραγμὸν καὶ ὤρυξεν ὑπολήνιον καὶ ᾠκοδόμησεν πύργον, καὶ ἐξέδετο αὐτὸν γεωργοῖς, καὶ ἀπεδήμησεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/001.yaml
  text: 'And he began to speak to them in parables: “A man planted a vineyard[a], and put a fence around it, and dug a winepress pit, and built a tower, and leased it to tenant farmers[d][c][b], and went away.”'
translation:
  language: tl
  text: 'At nagsimula siyang magsalita sa kanila sa pamamagitan ng mga talinghaga: “May isang lalaking nagtanim ng ubasan. Binakuran niya iyon[a], humukay ng hukay na saluhan ng katas mula sa pisaan ng ubas[b], at nagtayo ng tore. Ipinaupahan niya ang ubasan sa mga magsasaka[c] at umalis.”[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinalibutan niya iyon ng halamang-bakod.” Ang salitang Griyego ay maaaring tumukoy sa bakod, halamang-bakod, o iba pang harang na nakapalibot.
    reason: lexical_alternative
  - marker: b
    text: Ito ang mababang hukay o sisidlan na sinasaluhan ng katas mula sa pisaan ng ubas; maaari ring isalin na “humukay ng saluhan sa ilalim ng pisaan ng ubas.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “sa mga magsasakang nangungupahan” o “sa mga tagapag-alaga ng ubasan.”
    reason: lexical_alternative
  - marker: d
    text: Ang larawan ay umaalingawngaw sa Isaias 5:1–2, kung saan tinamnan, binakuran, at inihanda ang isang ubasan.
    reason: cross_reference
lexical_decisions:
- source_word: ἤρξατο ... λαλεῖν
  choice: nagsimula siyang magsalita
  rationale: Likas na salin ng inceptive construction sa modernong Tagalog at pinananatili ang diin sa pagsisimula ng pagsasalita.
- source_word: ἐν παραβολαῖς
  choice: sa pamamagitan ng mga talinghaga
  rationale: Malinaw na ipinapahayag na mga talinghaga ang paraan ng kanyang pagtuturo; mas natural ito sa Tagalog kaysa sa literal na “sa mga talinghaga.”
- source_word: Ἀμπελῶνα ἄνθρωπος ἐφύτευσεν
  choice: May isang lalaking nagtanim ng ubasan
  rationale: Natural na pambungad ng isang salaysay sa Tagalog habang pinananatili ang lalaking tauhan at ang ubasan.
- source_word: περιέθηκεν φραγμόν
  choice: Binakuran niya iyon
  rationale: Ang φραγμός ay harang na nakapalibot at maaaring bakod o halamang-bakod; ang “binakuran” ay malinaw ngunit hindi itinatakda ang materyales.
- source_word: ὤρυξεν ὑπολήνιον
  choice: humukay ng hukay na saluhan ng katas mula sa pisaan ng ubas
  rationale: Tiyak na tumutukoy ang ὑπολήνιον sa mababang sisidlan o hukay na sumasalo sa katas, hindi sa buong pisaan ng ubas.
- source_word: ᾠκοδόμησεν πύργον
  choice: nagtayo ng tore
  rationale: Tuwiran at natural na katumbas ng parirala.
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: ipinaupahan niya ang ubasan sa mga magsasaka
  rationale: Ipinakikita ng “ipinaupahan” ang ugnayan ng may-ari at mga umuupa; ang “mga magsasaka” ay natural sa Tagalog, at nililinaw ng konteksto na hindi kanila ang lupa.
- source_word: ἀπεδήμησεν
  choice: umalis
  rationale: Maikli at natural na salin ng pagpunta sa ibang lugar nang may inaasahang tagal, nang hindi dinaragdagan ng tiyak na layunin o layo.
theological_decisions:
- issue: Paglalarawan sa ἄνθρωπος
  choice: isang lalaki
  alternative: isang tao / may isang tao
  rationale: Sa loob ng talinghaga, ang tinutukoy ay lalaking may-ari ng ubasan; pinananatili nito ang tiyak na larawang pasalaysay nang walang idinadagdag na doktrina.
- issue: Pagiging tiyak ng γεωργοῖς
  choice: mga magsasaka, kasabay ng pandiwang “ipinaupahan”
  alternative: mga magsasakang nangungupahan / mga tagapag-alaga ng ubasan
  rationale: Pinananatili ng parirala ang mahalagang pagkakaiba ng may-ari at mga magsasaka. Hindi na kailangang gawing mabigat ang katawagan dahil malinaw na ang kanilang pagiging nangungupahan sa pandiwa.
- issue: Alusyon sa Isaias 5:1–2
  choice: pinanatili ang magkakasunod na larawan ng pagtatanim, pagbabakod, pisaan, at tore
  alternative: gawing tahasang sipi sa pangunahing teksto
  rationale: Ang pagkakatulad ay tunay na intertekstuwal na alusyon ngunit hindi tahasang ipinakikilala bilang sipi sa Marcos; kaya inilalagay ang paliwanag sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “talinghaga,” “ubasan,” at “pisaan ng ubas” bilang pamilyar na bokabularyong biblikal; iniwasan ang labis na teknikal na salita sa pangunahing teksto. Inayos ang huling talababa pagkatapos ng pangungusap upang malinaw na saklaw nito ang kabuuang larawan ng ubasan.
