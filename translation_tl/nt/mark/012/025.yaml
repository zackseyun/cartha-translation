  text: ὅταν γὰρ ἐκ νεκρῶν ἀναστῶσιν, οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται, ἀλλ’ εἰσὶν ὡς ⸀ἄγγελοι ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/025.yaml
  text: For when they rise from the dead[a], they neither marry nor are given in marriage, but are like angels in heaven.
translation:
  language: tl
  text: Sapagkat kapag bumangon silang muli mula sa mga patay, hindi sila mag-aasawa ni ibibigay sa pag-aasawa, kundi sila ay gaya ng mga anghel sa langit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa mga langit.” Maramihan ang salitang Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν γὰρ
  choice: Sapagkat kapag
  rationale: Pinananatili ng “sapagkat” ang paliwanag na ugnayan ng γάρ sa naunang argumento, at ng “kapag” ang temporal na diwa ng ὅταν.
- source_word: ἐκ νεκρῶν ἀναστῶσιν
  choice: bumangon sila mula sa mga patay
  rationale: Tinutumbasan ng “bumangon” ang aktibong anyo ng ἀναστῶσιν, samantalang pinananatili ng “mula sa mga patay” ang karaniwang wika ng pagkabuhay na muli at ang diwa ng ἐκ νεκρῶν.
- source_word: οὔτε γαμοῦσιν οὔτε γαμίζονται
  choice: hindi sila nag-aasawa ni ipinag-aasawa
  rationale: Pinananatili ang magkaugnay na pagtanggi at ang pagkakaiba ng aktibong pag-aasawa at pasibong ipinag-aasawa, nang hindi inuulit sa iisang parirala ang dalawang pandiwa.
- source_word: ἀλλ’ εἰσὶν
  choice: kundi gaya sila
  rationale: Likas sa Filipino ang ayos na ito at malinaw nitong ipinahahayag ang pagsalungat na dala ng ἀλλά; hindi kailangang isalin nang hiwalay ang copula.
- source_word: ὡς ἄγγελοι
  choice: gaya sila ng mga anghel
  rationale: Ang “gaya” ay malinaw na paghahambing at hindi nagsasabing nagiging mga anghel ang mga taong muling nabuhay.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: sa langit
  rationale: Ito ang natural at karaniwang katumbas sa modernong Filipino; inilalahad sa talababa ang literal na maramihang anyo ng Griyego.
theological_decisions:
- issue: Saklaw ng paghahambing sa mga anghel
  choice: Ang mga muling nabuhay ay gaya ng mga anghel, lalo na sa konteksto ng hindi pag-aasawa.
  alternative: Ang mga muling nabuhay ay nagiging mga anghel.
  rationale: Ang ὡς ay nagpapahayag ng pagkakatulad, hindi ng pagbabago ng likas o identidad. Pinananatili ng “gaya” ang hangganan ng paghahambing nang hindi dinaragdagan ang teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ipinag-aasawa” upang mapanatili ang pasibong diwa at ang pagkakaiba nito sa “nag-aasawa,” bagaman hindi nito ipinapasok ang pagkakaibang pangkasarian na maaaring ipahiwatig ng sinaunang kaugaliang tinutukoy.
