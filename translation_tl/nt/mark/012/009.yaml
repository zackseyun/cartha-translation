  source_fidelity: 'Tapat ang salin sa Griyego: naipapahayag ang retorikal na tanong, ang panghinaharap na mga kilos ng may-ari, ang pagwasak sa mga γεωργοί, at ang pagbibigay ng ubasan sa iba. Ang “mga magsasakang umuupa” ay angkop na paglilinaw sa papel ng mga γεωργοί sa talinghaga nang hindi labis na isinasara ang saklaw ng ἄλλοις.'
