  terminology: Ang “may-ari ng ubasan” ay wastong pangkontekstong salin ng ὁ κύριος τοῦ ἀμπελῶνος. Ang “ubasan,” “magsasakang umuupa,” at “iba” ay pare-parehong angkop. Tama ang ankla ng talababa sa “may-ari,” at maayos nitong inilalahad ang mga leksikal na maaaring salin nang hindi ipinipilit ang teolohikal na kahulugan sa agarang tagpo.
