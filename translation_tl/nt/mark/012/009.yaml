id: MRK.12.9
reference: Mark 12:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀τί ποιήσει ὁ κύριος τοῦ ἀμπελῶνος; ἐλεύσεται καὶ ἀπολέσει τοὺς γεωργούς, καὶ δώσει τὸν ἀμπελῶνα ἄλλοις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/009.yaml
  text: What will the owner of the vineyard do? He will come and destroy the tenant farmers[a], and give the vineyard to others.
translation:
  language: tl
  text: Ano ang gagawin ng may-ari[a] ng ubasan? Darating siya at pupuksain ang mga magsasakang umuupa, at ibibigay niya ang ubasan sa iba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “panginoon ng ubasan” o “amo ng ubasan.” Sa Griyego: “kyrios ng ubasan.” Dito, tumutukoy ang salita sa may-ari ng ubasan sa loob ng talinghaga.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ποιήσει
  choice: Ano ang gagawin
  rationale: Likas at tuwirang Filipino para sa retorikal na tanong at sa panghinaharap na anyo ng ποιέω, nang hindi nagdaragdag ng pang-ugnay na wala sa Griyego.
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: ang may-ari ng ubasan
  rationale: Sa mismong tagpo ng talinghaga, ang κύριος ay tumutukoy sa taong nagmamay-ari ng ubasan. Malinaw itong ipinahahayag ng “may-ari” nang hindi ipinapasok sa salita mismo ang isang hayag na titulong teolohikal.
- source_word: ἀμπελῶνος / ἀμπελῶνα
  choice: ubasan
  rationale: Karaniwan, maikli, at eksaktong katumbas sa Filipino ng ἀμπελών.
- source_word: ἐλεύσεται
  choice: Darating siya
  rationale: Pinananatili ang panghinaharap at ang malinaw na pagdating ng may-ari upang kumilos.
- source_word: ἀπολέσει
  choice: pupuksain
  rationale: Ipinahahayag ang matindi at tiyak na kapahamakang nakapaloob sa ἀπόλλυμι, habang hindi ito nililimitahan sa mas makitid na “papatayin.”
- source_word: τοὺς γεωργούς
  choice: ang mga magsasakang umuupa
  rationale: 'Pinagsasama nito ang dalawang mahalagang diwa: sila ang nagsasaka ng ubasan at sila rin ang mga umuupa o namamahala sa pag-aari ng iba.'
- source_word: δώσει
  choice: ibibigay niya
  rationale: Tuwirang katumbas ng δίδωμι at hindi labis na tinutukoy kung ito ay pagpapaupa o pagkakatiwala.
- source_word: ἄλλοις
  choice: sa iba
  rationale: Pinananatili ang sadyang malawak na pagtukoy ng Griyego, nang hindi dinaragdagan ng “mga nangungupahan” o ibang tiyak na pangkat.
theological_decisions:
- issue: Pagpapakahulugan sa κύριος kapag ang agarang tinutukoy ay tauhan sa talinghaga
  choice: may-ari
  alternative: panginoon o amo
  rationale: Ang agarang tinutukoy ay ang nagmamay-ari ng ubasan sa loob ng salaysay. Iniiwasan ng “may-ari” ang di-kinakailangang paglalagay ng hayag na titulong banal sa mismong salita, habang hindi hinahadlangan ang mas malawak na teolohikal na kahulugan ng talinghaga.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga magsasakang umuupa” upang madaling maunawaan ang papel ng γεωργοί bilang mga tagapagsakang umuupa sa ubasan, at inilagay ang talababa kaagad sa “may-ari,” ang salitang talagang nililinaw nito.
