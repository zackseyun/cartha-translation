  terminology: Ang “mga alagad,” “dukhang biyuda,” “naghulog,” at “kabang-yaman” ay angkop sa modernong Filipino Tagalog at sa rehistrong biblikal. Pinanatili ang “kabang-yaman” sa pangunahing teksto; nililinaw ng talababa ang posibleng kahulugang sisidlan o lugar ng mga handog sa templo.
