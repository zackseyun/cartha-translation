source:
  edition: SBLGNT
  text: καὶ προσκαλεσάμενος τοὺς μαθητὰς αὐτοῦ ⸀εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι ἡ χήρα αὕτη ἡ πτωχὴ πλεῖον πάντων ⸀ἔβαλεν τῶν βαλλόντων εἰς τὸ γαζοφυλάκιον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/043.yaml
  text: And calling his disciples to himself[a], he said to them, “Truly I say to you that this poor widow has put in more than all those who are putting into the treasury.”
translation:
  language: tl
  text: Tinawag niyang lumapit sa kanya ang kanyang mga alagad at sinabi sa kanila, “Katotohanang sinasabi ko sa inyo, ang dukhang biyudang ito ay naghulog ng higit kaysa sa lahat ng naghuhulog sa kabang-yaman.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sisidlan ng handog” o “kaban ng handog.” Ang salitang Griyego ay maaaring tumukoy sa sisidlan o sa lugar ng kabang-yaman sa templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: Tinawag niya
  rationale: Likas at malinaw na ipinahahayag ang pagtawag ni Jesus sa kanyang mga alagad upang lumapit bago siya magsalita; sapat na ipinahihiwatig ng konteksto at ng kasunod na layon ang middle nuance.
- source_word: μαθητὰς
  choice: mga alagad
  rationale: Karaniwang salin sa Bagong Tipan na nagpapanatili sa ugnayan ng mga tagasunod at guro.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Katotohanang sinasabi ko sa inyo
  rationale: Pinananatili ang taimtim at may-awtoridad na pormula ni Jesus sa malinaw at marangal na Tagalog.
- source_word: χήρα αὕτη ἡ πτωχὴ
  choice: ang dukhang biyudang ito
  rationale: Tuwirang inilalarawan ang babae bilang biyuda at mahirap, nang hindi pinatitindi ang antas ng kanyang karukhaan nang higit sa sinasabi ng talata.
- source_word: πλεῖον πάντων
  choice: higit kaysa sa lahat
  rationale: Pinananatili ang literal na paghahambing at ang posibilidad na ang halaga ng handog ay sinusukat sa paraang ipinaliliwanag ng kasunod na konteksto, sa halip na ipasok ang paliwanag sa mismong salin.
- source_word: ἔβαλεν
  choice: naghulog
  rationale: Sa konteksto ng handog, natural sa Tagalog ang 'naghulog' para sa natapos na paglalagay ng salapi sa sisidlan ng handog.
- source_word: τῶν βαλλόντων
  choice: mga naghuhulog
  rationale: Ang aspektong nagpapatuloy ng present participle ay naipapahayag ng anyong 'naghuhulog.'
- source_word: γαζοφυλάκιον
  choice: kabang-yaman
  rationale: Maikli at nakaugaliang katawagan para sa kabang-yaman o sisidlan/lugar ng mga handog sa templo; nililinaw sa talababa ang saklaw ng salita.
theological_decisions:
- issue: Pagtataya sa handog ng biyuda
  choice: Pinanatili ang pahayag na naghulog siya ng 'higit kaysa sa lahat' nang hindi ipinapaliwanag sa pangunahing teksto kung ito ay paghahambing sa halaga, sakripisyo, o ibang pamantayan.
  alternative: Tahasan itong ipakahulugang mas malaki ang sakripisyo niya kaysa sa iba, o sabihing mas malaki sa bilang ang kanyang inihulog.
  rationale: Ang Griyego ay gumagamit ng payak na paghahambing; ang kasunod na talata ang nagbibigay ng konteksto tungkol sa kasaganaan ng iba at karukhaan ng biyuda. Pinananatili rito ang tunay na tensiyon at hindi inuuna ang interpretasyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang 'biyuda' at 'kabang-yaman' bilang pamilyar na mga terminong biblikal, habang iniwasan ang labis na teknikal o makalumang pananalita.
