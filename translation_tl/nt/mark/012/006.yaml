base_translation:
  language: en
  yaml_path: translation/nt/mark/012/006.yaml
  text: He still had one[a], a beloved son. He sent him last to them, saying[c][b], ‘They will respect my son.’
translation:
  language: tl
  text: May isa pa siyang natitira, isang minamahal na anak na lalaki. Huli niya itong isinugo sa kanila. Sinabi niya, “Igagalang nila ang aking anak.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring mangahulugan: “Mahihiya sila sa harap ng aking anak” o “magpapakita sila ng paggalang sa aking anak.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι ἕνα εἶχεν
  choice: Mayroon pa siyang natitirang isa
  rationale: Ipinahahayag ng parirala na matapos isugo ang naunang mga alipin, may isa pa siyang natitirang maisusugo. Likas sa modernong Tagalog ang ayos na ito at pinananatili ang diin sa nag-iisang natitira.
- source_word: υἱὸν ἀγαπητόν
  choice: isang minamahal na anak
  rationale: Ang ἀγαπητός ay nangangahulugang minamahal o lubos na minamahal. Pinananatili ng “minamahal na anak” ang bigat ng parirala at ang pagkakaugnay nito sa paglalarawan kay Jesus sa Marcos nang hindi dinaragdagan ng interpretasyon.
- source_word: ἀπέστειλεν αὐτὸν
  choice: Siya ang ... isinugo niya
  rationale: Ang “isinugo” ay isang tuwiran at marangal na salin ng ἀποστέλλω; nililinaw ng “siya” na ang anak ang isinugo.
- source_word: ἔσχατον πρὸς αὐτούς
  choice: pinakahuling isinugo niya sa kanila
  rationale: Adberbiyal ang ἔσχατον at ipinakikitang ang anak ang huli sa sunod-sunod na mga isinugo. Ang “pinakahuli” ay nagpapanatili sa sukdulang posisyon ng anak.
- source_word: λέγων ὅτι
  choice: Sinabi niya
  rationale: Natural na ipinapasok sa Tagalog ang tuwirang sipi sa pamamagitan ng hiwalay na pangungusap.
- source_word: Ἐντραπήσονται τὸν υἱόν μου
  choice: Igagalang nila ang anak ko
  rationale: Sa konteksto, ang ἐντρέπομαι ay tumutukoy sa pagpapakita ng paggalang o pagkilala, bagaman maaari rin itong magpahiwatig ng pagkapahiya sa harap ng isang tao. Ang “igagalang” ang pinakamalinaw na natural na katumbas dito.
theological_decisions:
- issue: Kristolohikal na alingawngaw ng υἱὸν ἀγαπητόν
  choice: isang minamahal na anak
  alternative: isang anak na lubos niyang minamahal
  rationale: Pinananatili ang katawagang kaayon ng mas malawak na paglalarawan ni Marcos kay Jesus bilang minamahal na Anak, ngunit hindi ipinapaliwanag o pinalalawak ang kahulugan sa mismong teksto.
- issue: Saklaw ng kahulugan ng Ἐντραπήσονται
  choice: Igagalang nila
  alternative: Mahihiya sila sa harap ng anak ko
  rationale: Mas angkop sa daloy ng talinghaga ang inaasahang pagpapakita ng paggalang sa anak, ngunit itinatala sa talababa ang tunay na alternatibong diwa ng pandiwa upang hindi maitago ang leksikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at pangkaraniwan. Ginamit ang “anak” nang walang pagtukoy sa kasarian sa salita mismo, gaya ng likas sa Tagalog, habang malinaw sa konteksto na anak na lalaki ang tinutukoy. Ang “anak ko” ay mas natural sa tuwirang pananalita kaysa “aking anak.”
