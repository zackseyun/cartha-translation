  text: καὶ λαβόντες ⸂ἀπέκτειναν αὐτόν, καὶ ἐξέβαλον αὐτὸν⸃ ἔξω τοῦ ἀμπελῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/008.yaml
  text: And they took him[a], killed him, and threw him out of the vineyard.
translation:
  language: tl
  text: At kinuha nila siya, pinatay nila siya, at itinapon nila siya sa labas ng ubasan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβόντες
  choice: dinakip nila siya
  rationale: Ang aorist participle ng λαμβάνω ay nagpapakilala sa unang kilos sa mabilis na pagkakasunod-sunod. Sa marahas na konteksto, likas sa modernong Tagalog ang “dinakip,” nang hindi dinaragdagan ang tindi nang higit sa ipinahihiwatig ng pangyayari.
- source_word: ἀπέκτειναν
  choice: pinatay
  rationale: Tuwirang katumbas ito ng ἀποκτείνω at malinaw na pinananatili ang mabagsik na kilos sa talinghaga.
- source_word: ἐξέβαλον
  choice: itinapon sa labas
  rationale: Ipinahahayag ng ἐκβάλλω ang sapilitang pagtatapon o pagpapalabas. Dahil patay na siya ayon sa pagkakasunod ng Griyego, mas angkop ang “itinapon” kaysa “pinalayas.”
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: sa labas ng ubasan
  rationale: Likas na Tagalog para sa paggalaw patungo sa labas ng ubasan at malinaw na kaakibat ng “itinapon.”
- source_word: ἀμπελῶνος
  choice: ubasan
  rationale: Karaniwan at malinaw na salin ng ἀμπελών sa konteksto ng talinghaga.
theological_decisions:
- issue: Pagkakasunod ng pagpatay at pagtatapon sa labas ng ubasan
  choice: 'Pinanatili ang pagkakasunod sa tekstong Griyego: dinakip siya, pinatay, saka itinapon sa labas ng ubasan.'
  alternative: Sa ilang inaasahan batay sa kahawig na tradisyon ng talinghaga, maaaring maunang itapon siya sa labas bago patayin.
  rationale: Sa SBLGNT ng Marcos 12:8, nauuna ang ἀπέκτειναν sa ἐξέβαλον. Hindi ito iniayon sa mga kaparehong salaysay o sa tradisyunal na inaasahan.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “dinakip” upang maging natural ang mabilis at marahas na daloy ng salaysay; pinanatili ang tahasang pagkakasunod ng mga kilos sa Griyego.
