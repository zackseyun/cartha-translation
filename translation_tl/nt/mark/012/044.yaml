id: MRK.12.44
reference: Mark 12:44
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πάντες γὰρ ἐκ τοῦ περισσεύοντος αὐτοῖς ἔβαλον, αὕτη δὲ ἐκ τῆς ὑστερήσεως αὐτῆς πάντα ὅσα εἶχεν ἔβαλεν, ὅλον τὸν βίον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/044.yaml
  text: For they all gave out of their abundance[a], but she, out of her poverty, put in everything she had—her whole livelihood.
translation:
  language: tl
  text: Sapagkat silang lahat ay naghulog mula sa kanilang kasaganaan, ngunit siya, mula sa kanyang kasalatan, ay naghulog ng lahat ng mayroon siya—ang buo niyang kabuhayan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “lahat ng ikabubuhay niya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: silang lahat
  rationale: Pinananatili nito ang diin sa kabuuan ng pangkat na inihahambing sa balo.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Malinaw nitong ipinakikita na ipinaliliwanag ng talata ang naunang pagtataya ni Jesus sa handog ng balo.
- source_word: ἐκ τοῦ περισσεύοντος αὐτοῖς
  choice: mula sa kanilang kasaganaan
  rationale: Ipinahihiwatig nito na ang kanilang ibinigay ay nagmula sa mga pag-aaring higit sa kanilang pangangailangan, nang hindi labis na pinapaliit ang kahulugan sa teknikal na 'sobra' lamang.
- source_word: ἔβαλον / ἔβαλεν
  choice: naghulog / ay naghulog
  rationale: Sa konteksto ng kabang-yaman, natural sa Filipino ang 'naghulog' at pinananatili nito ang kongkretong kilos ng paglalagay ng salapi.
- source_word: αὕτη δὲ
  choice: ngunit siya
  rationale: Pinananatili ang matinding paghahambing sa pagitan ng balo at ng lahat ng iba pa.
- source_word: ἐκ τῆς ὑστερήσεως αὐτῆς
  choice: mula sa kanyang kasalatan
  rationale: Ang 'kasalatan' ay dignificado at malinaw na tumutukoy sa matinding kakulangan sa kabuhayan, hindi lamang sa pangkalahatang pangangailangan.
- source_word: πάντα ὅσα εἶχεν
  choice: lahat ng mayroon siya
  rationale: Natural na Filipino ito at lubos na pinananatili ang saklaw at diin ng parirala.
- source_word: ὅλον τὸν βίον αὐτῆς
  choice: ang buo niyang kabuhayan
  rationale: Sa konteksto ng salaping handog, ang βίος ay tumutukoy sa panustos o ikabubuhay. Ang 'kabuhayan' ay maikli at likas, habang ang talababa ay nililinaw ang buong puwersa nito.
theological_decisions:
- issue: Kahulugan ng βίος sa sinabi tungkol sa handog ng balo
  choice: kabuhayan o lahat ng ikabubuhay niya
  alternative: ang buo niyang buhay
  rationale: Ang agarang konteksto ay tungkol sa salapi at panustos sa pamumuhay. Hindi ipinahihiwatig ng teksto na literal niyang ibinigay ang kanyang biyolohikal na buhay, bagaman nananatili ang matinding diwa ng ganap na pagbibigay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'naghulog' para sa kilos ng pag-aambag sa kabang-yaman at ang 'kasalatan' upang ihambing nang tuwiran sa 'kasaganaan.'
