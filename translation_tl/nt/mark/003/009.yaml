  source_fidelity: 'Ang “maghanda para sa kanya” ay nagpapalit sa sintaks at bahagyang sa kahulugan ng Griyego: ang πλοιάριον ang paksa ng ἵνα-clause at dapat itong manatiling handa o available para kay Jesus, hindi tahasang inuutusan ang mga alagad na maghanda nito. Ang “maipit ... ng mga ito” ay pangkalahatang tapat sa pisikal na diin mula sa karamihan.'
  naturalness: Natural at marangal ang karamihan ng salin. Mas malinaw at mas idiomatiko ang “laging nakahanda para sa kanya ang isang maliit na bangka,” na iniiwasan din ang malabong saklaw ng “maghanda.”
