  text: καὶ εἶπεν τοῖς μαθηταῖς αὐτοῦ ἵνα πλοιάριον προσκαρτερῇ αὐτῷ διὰ τὸν ὄχλον ἵνα μὴ θλίβωσιν αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/009.yaml
  text: And he told his disciples that a small boat should stay ready for him because of the crowd[a], so that they might not crush him.
translation:
  language: tl
  text: Sinabi niya sa kanyang mga alagad na laging nakahanda para sa kanya ang isang maliit na bangka dahil sa dami ng tao, upang hindi siya maipit[a] ng mga ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “siksikin.” Ang pandiwang Griyego ay maaaring tumukoy sa pagdiin, pagsiksik, o pag-ipit dahil sa matinding puwersa.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: Sinabi
  rationale: Likas sa Filipino ang konstruksiyong “Sinabi niya sa kanyang mga alagad na,” at tumpak nitong ipinahahayag ang di-tuwirang utos.
- source_word: μαθηταῖς
  choice: mga alagad
  rationale: Ang “mga alagad” ang karaniwan at angkop na salin sa mga Ebanghelyo, na pinananatili ang ugnayan ng guro at tagasunod.
- source_word: πλοιάριον
  choice: isang maliit na bangka
  rationale: Pinananatili nito ang maliit na anyo o praktikal na diwa ng πλοιάριον sa natural na Filipino.
- source_word: προσκαρτερῇ
  choice: maghanda para sa kanya
  rationale: Sa konteksto, ipinahihiwatig ng pandiwa na ang bangka ay dapat nakahanda at magagamit ni Jesus. Ang “maghanda para sa kanya” ay natural na paraan upang ipahayag ang layuning iyon sa Filipino.
- source_word: διὰ τὸν ὄχλον
  choice: dahil sa dami ng tao
  rationale: Ang διά na may akusatibo ay nagsasaad ng dahilan. Mas likas sa kontekstong ito ang “dahil sa dami ng tao” kaysa sa literal na “dahil sa karamihan.”
- source_word: θλίβωσιν
  choice: maipit
  rationale: Ipinahahayag ng “maipit” ang pisikal na pagdiin o pagkakasiksik dahil sa dagsa ng tao, habang hindi labis na nililimitahan ang pandiwa sa matinding kahulugang “madurog.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “alagad” bilang pamilyar na terminong biblikal, at “maipit” upang malinaw na ilarawan sa karaniwang pananalita ang panganib mula sa nagsisiksikang mga tao.
