  text: καὶ ἐὰν οἰκία ἐφ’ ἑαυτὴν μερισθῇ, οὐ ⸀δυνήσεται ⸂ἡ οἰκία ἐκείνη σταθῆναι⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/025.yaml
  text: And if a house is divided against itself[a], that house will not be able to stand.
translation:
  language: tl
  text: At kung ang isang bahay ay nahahati laban sa sarili nito[a], hindi makakatayo ang bahay na iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sambahayan” sa halip na “bahay” (οἰκία), bagaman mas pinapaboran ng kasunod na larawang “makakatayo” ang “bahay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκία
  choice: bahay
  rationale: Pangunahing kahulugan nito ang konkretong “bahay.” Bagaman maaari rin itong tumukoy sa sambahayan, ang kasunod na “makakatayo” ay nagpapanatili sa larawan ng isang gusali.
- source_word: ἐφ’ ἑαυτὴν
  choice: laban sa sarili nito
  rationale: Sa idyomang ito, ipinapahayag ng ἐπί kasama ng panghalip na pabalik ang panloob na pagsasalungatan; natural itong isalin bilang “laban sa sarili nito.”
- source_word: μερισθῇ
  choice: ay nahahati
  rationale: Ang aorist passive subjunctive pagkatapos ng ἐὰν ay nagsasaad ng pangkalahatang kondisyon. Pinananatili ng “ay nahahati” ang tinig na balintiyak at ang diwa ng pagkakawatak-watak.
- source_word: δυνήσεται
  choice: makakatayo
  rationale: Ang hinaharap na kakayahan ay likas na naipapahayag sa Filipino sa anyong “makakatayo”; hindi kailangang idagdag ang mas mabigat na “magagawang tumayo.”
- source_word: σταθῆναι
  choice: makakatayo
  rationale: Dito, ang “tumayo” ay larawan ng pananatiling buo o matatag. Ang “makakatayo” ay maikli at pinananatili ang metapora.
- source_word: ἡ οἰκία ἐκείνη
  choice: ang bahay na iyon
  rationale: Pinananatili ng “na iyon” ang pagbibigay-diin ng demonstratibong ἐκείνη.
- source_word: καὶ ἐὰν
  choice: At kung
  rationale: Pinananatili ng “At” ang kaugnayan sa naunang argumento at ng “kung” ang kondisyong ipinahahayag ng ἐὰν.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Pinanatili ang konkretong metapora ng bahay at ang posibilidad na ang οἰκία ay tumutukoy rin sa sambahayan sa pamamagitan ng talababa.
