  text: And he appointed twelve[a], so that they might be with him and so that he might send them out to preach[b],
translation:
  language: tl
  text: At nagtalaga siya ng labindalawa[a] upang sila’y maging kasama niya at upang suguin niya silang mangaral[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Idinaragdag ng ilang manuskrito, “na tinawag din niyang mga apostol.”
