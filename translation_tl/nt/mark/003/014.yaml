    text: O “magpahayag.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν
  choice: nagtalaga
  rationale: Bagaman karaniwang nangangahulugang “gumawa,” sa kontekstong ito ay tumutukoy ang pandiwa sa pagbuo o pagtatalaga sa labindalawa bilang isang pangkat. Likas at malinaw sa Tagalog ang “nagtalaga.”
- source_word: δώδεκα
  choice: labindalawa
  rationale: Walang kasamang tahasang pangngalan o pantukoy sa Griyego. Napapanatili ng payak na “labindalawa” ang elipsis nang natural sa Tagalog.
- source_word: ἵνα ὦσιν μετ’ αὐτοῦ
  choice: upang makasama niya
  rationale: Ipinahahayag ng ἵνα at pasakaling pandiwa ang layunin. Natural na ipinapakita ng “upang makasama niya” ang layuning manatili silang kasama ni Jesus.
- source_word: ἀποστέλλῃ
  choice: suguin niya sila
  rationale: Ang ἀποστέλλω ay pagpapadala na may atas. Naipahihiwatig ng “suguin” ang pag-aatas nang hindi idinaragdag sa pangunahing teksto ang titulong “mga apostol.”
- source_word: κηρύσσειν
  choice: mangaral
  rationale: Tumutukoy ang κηρύσσω sa hayagang pagpapahayag. Ang “mangaral” ay maikli, natural, at angkop sa konteksto; inilalagay sa talababa ang alternatibong “magpahayag.”
theological_decisions:
- issue: Kung idaragdag sa pangunahing teksto ang titulong apostoliko
  choice: Hindi idinagdag ang “mga apostol.”
  alternative: “na tinawag din niyang mga apostol”
  rationale: Ang ibinigay na teksto ng SBLGNT ay nagsasabing nagtalaga siya ng labindalawa ngunit hindi taglay ang mas mahabang pagbasa. Pinananatili sa talababa ang mahalagang tekstuwal na variant nang hindi ito ipinapasok sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nagtalaga” at “suguin” upang ihatid ang kontekstuwal na diwa nang hindi labis na nagpapakahulugan. Ang ayos na “upang ... at upang ...” ay nagpapanatili sa magkapantay na dalawang layunin sa Griyego.
