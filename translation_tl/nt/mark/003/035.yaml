  text: ὃς ⸀γὰρ ἂν ποιήσῃ τὸ θέλημα τοῦ θεοῦ, οὗτος ἀδελφός μου καὶ ⸀ἀδελφὴ καὶ μήτηρ ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/035.yaml
  text: For whoever does the will of God, this one is my brother and sister and mother.
translation:
  language: tl
  text: Sapagkat ang sinumang gumagawa ng kalooban ng Diyos, ang taong ito[a] ang aking kapatid na lalaki, kapatid na babae, at ina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na, “ang isang ito.” May panghalip na panturo na may diin ang Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ... ἂν ποιήσῃ
  choice: ang sinumang gumagawa
  rationale: Ang kaugnay na panghalip na may ἄν at aorist subjunctive ay nagsasaad ng pangkalahatan at di-tiyak na kondisyon. Likas sa Filipino ang “ang sinumang gumagawa” para sa isang pahayag na palaging totoo.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Nagbibigay ang γάρ ng dahilan o paliwanag kaugnay ng naunang sinabi. Pinananatili ng “Sapagkat” ang malinaw na ugnayang ito.
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: ang kalooban ng Diyos
  rationale: Tuwiran, pamilyar, at marangal na katumbas ito ng parirala sa Griyego.
- source_word: οὗτος
  choice: siya ang
  rationale: Ang “siya” ay likas at hindi nakatali sa kasarian sa Filipino, habang ang ayos na “siya ang” ay nagbibigay-diin sa taong tinutukoy. Ipinaliliwanag sa talababa ang mas tahasang demonstratibong puwersa ng οὗτος.
- source_word: ἀδελφός μου καὶ ἀδελφὴ καὶ μήτηρ
  choice: aking kapatid na lalaki, kapatid na babae, at ina
  rationale: Pinananatili ang bawat tiyak na katawagang pampamilya at ang naiipong bisa ng talaan, sa halip na gawing pangkalahatang “kapamilya.”
- source_word: ἐστίν
  choice: ang
  rationale: Sa pangungusap na panaguri sa Filipino, hindi kailangan ang hiwalay na katumbas ng copula na “is”; likas na ipinahahayag ng hulma na “siya ang aking…” ang pagkakakilanlan.
theological_decisions:
- issue: Kasarian ng iisang paksa at ng magkakaibang katawagang pampamilya
  choice: siya
  alternative: ang lalaking iyon / siya na lalaki
  rationale: Bagaman panlalaki ang anyong gramatikal ng kaugnay na panghalip sa Griyego, kabilang sa panaguri ang kapatid na lalaki, kapatid na babae, at ina. Ang “siya” sa Filipino ay tumpak na isahan ngunit hindi nagpapahiwatig na lalaki lamang ang saklaw.
- issue: Kalikasan ng pananalita ni Jesus tungkol sa pamilya
  choice: panatilihin ang literal na mga katawagang “kapatid na lalaki, kapatid na babae, at ina” sa matalinghagang gamit
  alternative: kapamilya
  rationale: Muling binibigyang-kahulugan ni Jesus ang ugnayang pampamilya batay sa paggawa ng kalooban ng Diyos. Ang mga tiyak na katawagan ang nagpapanatili sa retorikal at teolohikal na diin ng teksto.
translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Ginamit ang “Sapagkat” upang malinaw na iugnay ang talata sa naunang pahayag, at ang “siya ang” bilang natural na paraan ng pagbibigay-diin nang hindi nagtatakda ng kasarian.
