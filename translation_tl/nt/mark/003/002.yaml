  text: καὶ παρετήρουν αὐτὸν εἰ τοῖς σάββασιν θεραπεύσει αὐτόν, ἵνα ⸀κατηγορήσωσιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/002.yaml
  text: And they were watching him closely to see whether he would heal him on the Sabbath[a], so that they might accuse him.
translation:
  language: tl
  text: At matamang minamasdan nila siya upang malaman kung pagagalingin niya ang lalaki sa araw ng Sabbath[a], upang maakusahan nila siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Griyego, maramihan ang anyo: “mga Sabbath”; maaari itong gamitin bilang idyomatikong pantukoy sa araw ng Sabbath.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρετήρουν
  choice: matamang binabantayan
  rationale: Ipinahihiwatig ng imperpektong anyo ang patuloy na pagbabantay, at taglay ng pandiwa rito ang diwang mapanuri at mapaghinalang pagmamasid.
- source_word: εἰ
  choice: kung
  rationale: Pagkatapos ng pandiwa ng pagmamasid, likas sa Tagalog ang “kung” upang ihayag ang di-tuwirang tanong.
- source_word: τοῖς σάββασιν
  choice: sa araw ng Sabbath
  rationale: Bagaman maramihan ang anyong Griyego, maaari itong maging idyomatikong pantukoy sa araw ng Sabbath. Ang isahan ay mas natural at malinaw sa modernong Tagalog; itinatala sa talababa ang literal na anyo.
- source_word: θεραπεύσει
  choice: pagagalingin
  rationale: Ang hinaharap na anyo sa di-tuwirang tanong ay natural na naihahayag sa Tagalog sa aspektong kontemplatibo. Maliwanag sa konteksto na ang tinutukoy na pagpapagaling ay sa lalaki.
- source_word: ἵνα
  choice: upang
  rationale: Malinaw na ipinahahayag ng “upang” ang layunin ng kanilang pagbabantay.
- source_word: κατηγορήσωσιν αὐτοῦ
  choice: maisakdal nila siya
  rationale: Ipinahahayag nito ang paghahanap ng saligan upang akusahan si Jesus. Ang “maisakdal” ay dignified at natural, ngunit hindi kinakailangang magpahiwatig ng ganap nang pormal na paglilitis.
theological_decisions:
- issue: Layunin ng mga nagmamasid
  choice: Inilalarawan ang mapanuring pagbabantay na naglalayong magkaroon ng maipaparatang laban kay Jesus.
  alternative: “upang maakusahan nila siya” o “upang makapagsampa sila ng kaso laban sa kanya”
  rationale: May forensic na kulay ang κατηγορέω, ngunit hindi tinutukoy ng talata ang isang ganap na pormal na paglilitis. Iniiwasan ng salin ang pagdaragdag ng detalyeng wala sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “Sabbath” bilang pamilyar na terminong biblikal at “ang lalaki” upang luminaw ang reperente ng αὐτόν nang hindi nagdaragdag ng bagong impormasyon.
