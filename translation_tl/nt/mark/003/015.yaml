  text: and to have authority to cast out demons[a].
translation:
  language: tl
  text: at magkaroon ng awtoridad na magpalayas ng mga demonyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magtaboy ng mga demonyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: at
  rationale: Karaniwang pang-ugnay na nagdurugtong sa sugnay na ito sa naunang mga layunin ng paghirang ni Jesus.
- source_word: ἔχειν
  choice: magkaroon
  rationale: Likas na katumbas ng infinitibong ἔχειν sa pagkakasunod-sunod ng mga layunin; ipinahihiwatig na ipinagkaloob sa kanila ang awtoridad.
- source_word: ἐξουσίαν
  choice: awtoridad
  rationale: Tumutukoy sa ipinagkaloob na karapatan at kakayahang kumilos, hindi lamang sa lakas; ang salitang “awtoridad” ang pinakamalinaw na nagpapanatili sa diwa ng atas ni Jesus.
- source_word: ἐκβάλλειν
  choice: magpalayas
  rationale: Natural at tumpak na salin sa konteksto ng pagpapaalis sa mga demonyo, habang pinananatili ang puwersa ng pagpapalayas.
- source_word: τὰ δαιμόνια
  choice: mga demonyo
  rationale: Tuwirang katumbas ng δαιμόνια; hindi ginawang “maruruming espiritu” sapagkat ibang parirala iyon sa Griyego.
theological_decisions:
- issue: Kalikasan ng ἐξουσία sa atas sa mga alagad
  choice: awtoridad
  alternative: kapangyarihan
  rationale: Binibigyang-diin ng talata ang awtorisadong kakayahang ipinagkaloob ni Jesus, hindi lamang ang di-tiyak na supernatural na lakas. Hindi nito itinatanggi ang kapangyarihang kasama ng gawain.
translation_notes:
  register: Modernong Filipino na natural at marangal. Pinili ang “magpalayas” bilang karaniwang pananalita sa konteksto ng pagpapaalis ng mga demonyo; pinanatili ang “awtoridad” upang maipakita ang ipinagkaloob na karapatang kumilos.
