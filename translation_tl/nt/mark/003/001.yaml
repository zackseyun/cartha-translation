  text: And he entered a synagogue again[c][b][a], and a man was there with a withered hand.
translation:
  language: tl
  text: Muling pumasok si Jesus sa isang sinagoga,[a] at naroon ang isang lalaking may tuyot na kamay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “sa sinagoga,” kung isang partikular na sinagoga na kilala na sa konteksto ang tinutukoy ni Marcos.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “kulubot” o “natuyo.” Inilalarawan ng salita ang kamay na natuyo o kumulubot.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: pumasok
  rationale: Likas na salin sa salaysay para sa aorist ng εἰσέρχομαι at malinaw na nagpapahayag ng pagpasok.
- source_word: πάλιν
  choice: muling
  rationale: Tuwirang ipinahahayag ang pag-uulit ng kilos at natural itong ilagay bago ang pandiwa sa Filipino.
- source_word: εἰς συναγωγήν
  choice: sa isang sinagoga
  rationale: Ang “sa” kasunod ng “pumasok” ay likas na nagpapahiwatig ng pagpasok tungo sa loob; ang “isang” ay hindi labis na tumutukoy sa isang partikular na sinagoga, ayon sa walang artikulong συναγωγήν.
- source_word: ἦν ἐκεῖ
  choice: naroon
  rationale: Maikli at natural na ipinahahayag ang pag-iral at lokasyon ng lalaki nang walang alanganing pag-uulit.
- source_word: ἄνθρωπος
  choice: isang lalaki
  rationale: Sa kontekstong ito, ang indibidwal ay natural at tumpak na tinutukoy bilang lalaki.
- source_word: ἐξηραμμένην
  choice: tuyot
  rationale: Pinananatili ang larawan ng kamay na natuyo o nawalan ng normal na lakas at galaw, nang hindi nagdaragdag ng tiyak na medikal na pagsusuri.
- source_word: ἔχων τὴν χεῖρα
  choice: tuyot ang isang kamay
  rationale: Natural na konstruksiyon sa Filipino na nagpapahayag ng kalagayan ng kamay bilang taglay ng lalaki.
- source_word: τὴν χεῖρα
  choice: ang isang kamay
  rationale: Natural sa Filipino ang “isang kamay” upang ipakitang isa sa kanyang mga kamay ang may kapansanan; ang pag-aari ay nauunawaan sa konteksto.
theological_decisions:
- issue: Hindi hayagang pinangalanan ang simuno sa Griyego
  choice: si Jesus
  alternative: siya
  rationale: Ang simuno ay si Jesus mula sa nagpapatuloy na salaysay. Ang pagbanggit sa pangalan ay natural sa isang hiwalay na talata at hindi nagbabago sa tinutukoy.
translation_notes:
  register: Makabagong, malinaw, at marangal na Filipino. Ginamit ang “sinagoga,” na pamilyar na katawagang biblikal, at iniwasan ang teknikal na medikal na pagpapakahulugan sa kalagayan ng kamay.
