  text: καὶ λέγει αὐτοῖς· Ἔξεστιν τοῖς σάββασιν ⸀ἀγαθοποιῆσαι ἢ κακοποιῆσαι, ψυχὴν σῶσαι ἢ ἀποκτεῖναι; οἱ δὲ ἐσιώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/004.yaml
  text: And he said to them[a], “Is it lawful on the Sabbath to do good or to do harm[b], to save a life or to kill?” But they were silent.
translation:
  language: tl
  text: At sinabi niya sa kanila, “Ipinahihintulot ba sa araw ng Sabbath ang gumawa ng mabuti o ng masama, ang magligtas ng buhay o ang pumatay?” Ngunit nanatili silang tahimik.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔξεστιν
  choice: Ano ang ipinahihintulot
  rationale: Sa pagtatalo tungkol sa pangingilin ng Sabbath, ang pandiwa ay nagtatanong kung ano ang pinahihintulutan ayon sa kautusan. Likas sa Tagalog ang tanong na “Ano ang ipinahihintulot...?” at malinaw nitong naihaharap ang dalawang magkasalungat na gawain.
- source_word: τοῖς σάββασιν
  choice: sa araw ng Sabbath
  rationale: Bagaman pangmaramihan ang anyong Griyego, karaniwang idyoma ito para sa Sabbath. Ang pang-isahang Tagalog ay natural at angkop sa tiyak na araw na nasa konteksto; itinatala sa talababa ang anyong Griyego.
- source_word: ἀγαθοποιῆσαι
  choice: ang gumawa ng mabuti
  rationale: Tuwiran at natural nitong ipinapahayag ang paggawa ng isang mabuti o kapaki-pakinabang na bagay.
- source_word: κακοποιῆσαι
  choice: o ng masama
  rationale: Pinananatili nito ang tuwirang pagsalungat sa “mabuti” at maaari itong tumukoy kapwa sa masamang gawa at sa paggawa ng pinsala, nang hindi nililimitahan ang diwa sa pisikal na pananakit.
- source_word: ψυχὴν σῶσαι
  choice: ang magligtas ng buhay
  rationale: Sa pagkakatapat nito sa pagpatay, ang ψυχή ay tumutukoy sa buhay ng tao, hindi lamang sa di-materyal na kaluluwa.
- source_word: ἀποκτεῖναι
  choice: ang pumatay
  rationale: Ito ang payak at wastong katumbas ng pandiwa; ang “pumaslang” ay maaaring magdagdag ng moral o legal na kulay na hindi tahasang nasa salitang Griyego.
- source_word: ἐσιώπων
  choice: nanatili silang tahimik
  rationale: Ipinahihiwatig ng imperpektong aspekto ang nagpapatuloy nilang pananahimik bilang tugon sa tanong.
theological_decisions:
- issue: Idyomang pangmaramihan para sa Sabbath sa isang usaping legal at etikal
  choice: sa araw ng Sabbath
  alternative: sa mga Sabbath
  rationale: Ang pangmaramihang τοῖς σάββασιν ay isang karaniwang idyomang Griyego at sa konteksto ay tumutukoy sa araw ng Sabbath na kasalukuyang pinangyayarihan. Iniiwasan ng pang-isahang salin ang maling pahiwatig na tungkol lamang ito sa maraming magkakahiwalay na Sabbath, habang inilalahad sa talababa ang anyo ng pinagmulan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Sabbath” bilang kinikilalang terminong biblikal, at pinanatili ang matalim na paghahanay ng mabuti/masama at magligtas/pumatay sa orihinal.
