  text: καὶ περιβλεψάμενος ⸂τοὺς περὶ αὐτὸν κύκλῳ⸃ καθημένους λέγει· Ἴδε ἡ μήτηρ μου καὶ οἱ ἀδελφοί μου·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/034.yaml
  text: And looking around at those seated around him in a circle[a], he says, “Behold, my mother and my brothers!”
translation:
  language: tl
  text: At tumingin siya sa paligid sa mga nakaupo nang pabilog sa palibot niya, at sinabi niya, “Narito ang aking ina at mga kapatid![a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit. “mga kapatid na lalaki.” Panlalaking maramihan ang salitang Griyego, ngunit maaaring kabilang din ang mga babae sa mas malawak na pangkat sa palibot ni Jesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: matapos niyang lingunin
  rationale: Ipinahahayag nito ang sinadya at paikot na pagtingin ni Jesus, at pinananatili ang ugnayang pangyayari ng aorist participle sa pangunahing pandiwa.
- source_word: τοὺς περὶ αὐτὸν κύκλῳ καθημένους
  choice: ang mga nakaupo sa palibot niya
  rationale: Likas ito sa makabagong Tagalog at ipinahahayag ang καθήμενους at ang pinagsamang diwa ng περὶ αὐτόν at κύκλῳ nang hindi inuulit nang alanganin ang ideya ng pag-ikot.
- source_word: λέγει
  choice: sinabi niya
  rationale: Bagaman historical present ang Griyego, mas natural sa salaysay na Tagalog ang pangnagdaan; hindi nito binabago ang kilos o tagapagsalita.
- source_word: Ἴδε
  choice: Narito
  rationale: Isang natural at marangal na pantawag-pansin na itinuturo ang mga taong nasa harap ni Jesus; iniiwasan nito ang lipas na himig ng mas matandang mga anyo.
- source_word: μήτηρ
  choice: ina
  rationale: Karaniwan at tuwirang katumbas ng μήτηρ sa dignified na Tagalog.
- source_word: ἀδελφοί
  choice: mga kapatid na lalaki
  rationale: Pinananatili nito ang panlalaking anyo ng pangngalang Griyego. Nililinaw sa talababa na maaaring mas malawak ang tinutukoy na pangkat.
theological_decisions:
- issue: Ang panlalaking katawagang ἀδελφοί sa isang pangkat na maaaring may kasamang mga babae
  choice: mga kapatid na lalaki
  alternative: mga kapatid
  rationale: Pinananatili sa pangunahing teksto ang tahasang panlalaking anyo ng Griyego, ngunit hindi ipinagpapalagay na puro lalaki ang lahat ng nakapalibot kay Jesus; inilalahad sa talababa ang posibleng mas malawak na saklaw.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Narito” bilang natural na pantawag-pansin at ang “sa palibot niya” upang maipahayag nang hindi mabigat ang dobleng diin sa lokasyon ng pariralang Griyego.
