  text: καὶ προσκαλεσάμενος αὐτοὺς ἐν παραβολαῖς ἔλεγεν αὐτοῖς· Πῶς δύναται Σατανᾶς Σατανᾶν ἐκβάλλειν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/023.yaml
  text: 'And after calling them to himself, he was speaking to them in parables: “How can Satan cast out Satan?”'
translation:
  language: tl
  text: 'Matapos niya silang tawagin palapit sa kanya, nagsalita siya sa kanila sa pamamagitan ng mga talinghaga: “Paano kayang palayasin ni Satanas si Satanas?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: tinawag niya sila upang lumapit sa kanya
  rationale: Ipinapahayag ng aorist middle participle na ipinatawag muna ni Jesus ang mga tao papunta sa kanya. Likas sa modernong Filipino ang pariralang ito at malinaw ang direksiyon ng pagtawag.
- source_word: ἐν παραβολαῖς
  choice: sa pamamagitan ng mga talinghaga
  rationale: Pinananatili ang maramihang anyo at ang diwa ng mga paghahambing o larawang-salitang ginagamit sa pagtuturo, nang hindi nililimitahan ang tiyak na anyong pampanitikan.
- source_word: ἔλεγεν
  choice: nagsalita siya
  rationale: Bagaman imperfect ang pandiwa at maaaring magpahiwatig ng nagpapatuloy na pagsasalita, ang payak na anyong Filipino ang pinakanatural sa salaysay; ang kasunod na pahayag ay bahagi ng kanyang pagsasalita.
- source_word: Πῶς δύναται
  choice: Paanong mapalalayas
  rationale: Ang “Paanong” kasama ng potensiyal na anyo ng pandiwa ay natural na naghahayag ng retorikal na tanong tungkol sa posibilidad o kakayahan.
- source_word: Σατανᾶς
  choice: Satanas
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa Filipino, kapuwa para sa simuno at layon.
- source_word: ἐκβάλλειν
  choice: mapalalayas
  rationale: Sa konteksto ng pagpapalayas ng mga demonyo, malinaw at karaniwan sa Filipino ang “palayasin.” Pinananatili nito ang ideya ng pagpapaalis nang hindi nagdaragdag ng paliwanag.
theological_decisions:
- issue: Lakas ng tanong ni Jesus tungkol kay Satanas na kumikilos laban sa sarili niya
  choice: “Paanong mapalalayas ni Satanas si Satanas?” bilang retorikal na tanong tungkol sa posibilidad
  alternative: “Paano kayang palalayasin ni Satanas si Satanas?”
  rationale: Hinahamon ng Griyego ang posibilidad at lohika ng paratang. Pinananatili ng salin ang retorikal na puwersa nang hindi tahasang idinaragdag na imposible ito o ipinapaliwanag ang doktrinal na implikasyon.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “talinghaga,” isang pamilyar na terminong biblikal at pampanitikan, at iniwasan ang sobrang pormal na “ipinatawag” o lipas na ayos ng pangungusap.
