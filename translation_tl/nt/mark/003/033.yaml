  yaml_path: translation/nt/mark/003/033.yaml
  text: And answering them[a], he says[b], “Who are my mother and my brothers?”
translation:
  language: tl
  text: At sumagot siya sa kanila, “Sino ang aking ina, o ang aking mga kapatid na lalaki?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς αὐτοῖς λέγει
  choice: At sumagot siya sa kanila
  rationale: Ang participle na ἀποκριθείς kasama ng historical present na λέγει ay likas na ipinapahayag sa makabagong Tagalog bilang isang pangyayaring pasalaysay. Pinananatili ng “sumagot siya sa kanila” ang tugon at ang mga kausap nang hindi nagiging artipisyal ang pangungusap.
- source_word: Τίς
  choice: Sino
  rationale: Tuwirang tanong ito tungkol sa pagkakakilanlan ng tao.
- source_word: μήτηρ
  choice: ina
  rationale: Ang “ina” ay karaniwan, marangal, at tumpak na katumbas.
- source_word: ἢ
  choice: at
  rationale: Bagaman karaniwang nangangahulugang “o” ang ἢ, sa tanong na pinagsasama ang dalawang pangkat ng kamag-anak, mas natural sa Tagalog ang “at” at hindi nito binabago ang saklaw ng tanong.
- source_word: ἀδελφοί
  choice: mga kapatid na lalaki
  rationale: Tahasang pinananatili nito ang panlalaking pangmaramihang anyo at iniiwasang palawakin ang kahulugan tungo sa lahat ng magkakapatid.
theological_decisions:
- issue: Saklaw ng ἀδελφοί
  choice: mga kapatid na lalaki
  alternative: mga kapatid
  rationale: Maaaring maging gender-neutral sa karaniwang Tagalog ang “mga kapatid.” Dahil panlalaking pangmaramihan ang Griyego at mga lalaking kapatid ang tinutukoy sa agarang konteksto, ginawang tahasan ang kasarian nang hindi nagpapasya sa anumang denominasyonal na usapin tungkol sa eksaktong ugnayang pampamilya.
- issue: Ugnayan ng μήτηρ at ἀδελφοί sa tanong
  choice: aking ina at ang aking mga kapatid na lalaki
  alternative: aking ina o ang aking mga kapatid na lalaki
  rationale: Ang Griyego ay may ἢ (“o”) at isahang pandiwang umaayon sa unang paksa, ngunit ang literal na hulma ay alanganin sa Tagalog. Ang “at” ay natural na paraan ng pagtatanong kung sinu-sino ang bumubuo sa dalawang binanggit na kategorya, nang hindi nilulutas ang kasunod na teolohikal na punto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ina” sa halip na mas kolokyal na “nanay,” at ang payak na past-tense na salaysay sa halip na piliting gayahin ang Griyegong participle at historical present.
