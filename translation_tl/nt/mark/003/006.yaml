id: MRK.3.6
reference: Mark 3:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐξελθόντες οἱ Φαρισαῖοι ⸀εὐθὺς μετὰ τῶν Ἡρῳδιανῶν συμβούλιον ⸀ἐδίδουν κατ’ αὐτοῦ ὅπως αὐτὸν ἀπολέσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/006.yaml
  text: And the Pharisees went out and immediately began plotting with the Herodians against him[a], how they might destroy him.
translation:
  language: tl
  text: Pagkalabas ng mga Pariseo, agad silang nakipagsabwatan sa mga Herodiano laban kay Jesus kung paano nila siya maipapahamak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas tahasan ayon sa konteksto, “mapatay” o “maipapatay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες
  choice: Pagkalabas
  rationale: Ang aorist participle ay likas na naipapahayag sa Tagalog bilang kilos na nauna sa pangunahing pandiwa. Malinaw at maikli ang “Pagkalabas” at ipinahihiwatig ng konteksto na lumabas sila mula sa sinagoga.
- source_word: οἱ Φαρισαῖοι
  choice: mga Pariseo
  rationale: Ito ang karaniwan at madaling makilalang katawagan sa modernong salin sa Tagalog.
- source_word: εὐθὺς
  choice: agad
  rationale: Pinananatili nito ang apurahang takbo ng salaysay na katangian ng Marcos, sa natural na modernong Tagalog.
- source_word: μετὰ τῶν Ἡρῳδιανῶν
  choice: sa mga Herodiano
  rationale: Sa pariralang “nakipagsabwatan sa,” malinaw na ipinahahayag ng “sa” ang pakikipag-ugnayan o pakikipagtulungan na nasa μετά na may genitive.
- source_word: συμβούλιον ἐδίδουν
  choice: nakipagsabwatan
  rationale: Ang idyomang Griyego ay tumutukoy sa pagsasanggunian o pagbabalak. Dahil hayagang laban kay Jesus at nakatuon sa pagpapahamak sa kanya ang layunin, natural na ipinahahayag ng “nakipagsabwatan” ang lihim at mapanirang pagpaplano. Hindi hiwalay na isinalin ang imperfect bilang “nagsimulang” sapagkat ang agad na pagpasok nila sa ganitong pagkilos ay sapat nang malinaw sa “agad silang nakipagsabwatan.”
- source_word: κατ’ αὐτοῦ
  choice: laban kay Jesus
  rationale: Adbersatibo ang κατά dito. Ginamit ang pangalang “Jesus” sa halip na “kanya” upang maiwasan ang malabong reperensiya matapos banggitin ang mga Herodiano.
- source_word: ὅπως
  choice: kung paano
  rationale: Pinananatili nito ang deliberatibong diwa ng kanilang pagbabalak—ang paraan kung paano maisasagawa ang layunin—nang hindi inaalis ang layuning ipinahihiwatig ng sugnay.
- source_word: ἀπολέσωσιν
  choice: maipapahamak
  rationale: Pinananatili ng “maipapahamak” ang mas malawak na puwersa ng ἀπόλλυμι kaysa sa tahasang “mapatay,” habang ang konteksto ay nagpapahiwatig ng nakamamatay na layunin. Nililinaw sa talababa ang higit na tiyak na posibilidad.
theological_decisions:
- issue: Kung tahasang ilalagay sa pangunahing teksto na balak nilang patayin si Jesus
  choice: Panatilihin ang mas malawak na “maipapahamak” sa pangunahing teksto.
  alternative: “mapatay” o “maipapatay”
  rationale: Maaaring mangahulugan ang ἀπόλλυμι ng pagwasak, pagpapahamak, o pagpatay ayon sa konteksto. Malinaw na malubha at malamang na nakamamatay ang balak dito, ngunit hindi kailangang paliitin sa pangunahing teksto ang tunay na saklaw ng pandiwang Griyego. Inilalahad sa talababa ang tahasang pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ang “nakipagsabwatan” ay pangkaraniwan ngunit sapat na pormal para sa salin ng Kasulatan; ang “Herodiano” ay pinanatili bilang kinikilalang tawag sa grupong kaugnay ng mga interes ng sambahayan ni Herodes.
