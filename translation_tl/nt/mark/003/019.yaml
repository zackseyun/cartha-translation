  text: and Judas Iscariot[a], who also betrayed him.
translation:
  language: tl
  text: at si Judas Iscariote[a], na nagkanulo rin sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na siya ring nagbigay sa kanya sa kamay ng iba” o “na siya ring nagbigay sa kanya.” Ang pandiwang Griyego ay maaaring mangahulugang “ibigay sa kamay ng iba”; ginamit dito ang “nagkanulo” dahil iyon ang diwa ng ginawa ni Judas kay Jesus sa kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: at
  rationale: Karaniwang pang-ugnay ito sa huling pangalan sa talaan at natural na nagdurugtong dito sa mga naunang apostol.
- source_word: Ἰούδαν
  choice: Judas
  rationale: Ginamit ang nakaugaliang anyo ng personal na pangalang ito sa Filipino.
- source_word: Ἰσκαριώθ
  choice: Iscariote
  rationale: Ginamit ang nakaugaliang transliterasyon sa Filipino; hindi isinalin ang posibleng etimolohiya dahil hindi ito tiyak sa konteksto.
- source_word: ὃς
  choice: na siya
  rationale: Natural na panimulang pantukoy sa sugnay na higit na nagpapakilala kay Judas.
- source_word: καὶ
  choice: rin
  rationale: Pinananatili ang adberbiyal na diin ng καί bilang karagdagang pagkakakilanlan kay Judas.
- source_word: παρέδωκεν
  choice: nagkanulo
  rationale: Bagaman literal na maaaring mangahulugang 'nagbigay' o 'nagturn-over sa kamay ng iba,' sa kontekstong si Judas ang kumilos laban kay Jesus, malinaw na kasama ang diwa ng pagtataksil.
- source_word: αὐτόν
  choice: sa kanya
  rationale: Tuwirang tumutukoy kay Jesus bilang pinag-ukulan ng ginawa ni Judas; ang maliit na titik ay sumusunod sa karaniwang modernong Filipino.
theological_decisions:
- issue: Paglalarawan sa παραδίδωμι kaugnay ng ginawa ni Judas kay Jesus
  choice: nagkanulo
  alternative: nagbigay sa kamay ng iba / nagturn-over
  rationale: Maaaring tumukoy ang pandiwa sa simpleng pagbibigay o pagsasalin ng isang tao sa kapangyarihan ng iba, ngunit sa salaysay tungkol kay Judas ay taglay nito ang kontekstuwal na diwa ng pagtataksil. Ipinahihiwatig ng pangunahing salin ang bigat na iyon habang inilalahad sa talababa ang mas literal na saklaw.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “nagkanulo” kaysa “nagtaksil” upang mailarawan ang tiyak na pagkilos na naglagay kay Jesus sa kamay ng mga kaaway, habang pinananatili sa talababa ang mas literal na kahulugan ng pandiwang Griyego.
