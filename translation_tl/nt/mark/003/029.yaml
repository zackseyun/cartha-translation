  text: but whoever blasphemes against the Holy Spirit never has forgiveness[c][b][a], but is guilty of an eternal sin.
translation:
  language: tl
  text: Ngunit ang sinumang lumapastangan sa Banal na Espiritu ay walang kapatawaran magpakailanman[a], kundi mananagot siya sa kasalanang walang hanggan.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na, “walang kapatawaran hanggang sa kapanahunan”; maaari ring isalin na “hindi kailanman pinatatawad” o “walang kapatawaran magpakailanman.”
    reason: lexical_alternative
  - marker: b
    text: O, “may sala siya sa isang kasalanang walang hanggan.”
    reason: lexical_alternative
  - marker: c
    text: Sa ilang manuskrito, “walang-hanggang hatol” o “walang-hanggang kahatulan” ang mababasa sa halip na “kasalanang walang hanggan.”
    reason: textual_variant
lexical_decisions:
- source_word: ὃς δ’ ἂν
  choice: Ngunit ang sinumang
  rationale: Ang ὃς na may ἄν ay nagpapahayag ng pangkalahatang di-tiyak na kondisyon, kaya natural ang “ang sinumang.” Ipinakikita ng “ngunit” ang banayad na pagsalungat ng δέ sa naunang pahayag.
- source_word: βλασφημήσῃ
  choice: lumapastangan
  rationale: Pinananatili ng “lumapastangan” ang mabigat na panrelihiyon at moral na diwa ng βλασφημέω, at natural itong tumutukoy sa pagsasalita o pagkilos na mapanirang-puri at mapanghamak sa banal.
- source_word: εἰς τὸ πνεῦμα τὸ ἅγιον
  choice: sa Banal na Espiritu
  rationale: Sa ganitong gamit ng βλασφημέω, itinuturo ng εἰς ang pinatutungkulan ng paglapastangan. Sapat at natural sa Filipino ang “lumapastangan sa Banal na Espiritu.”
- source_word: οὐκ ἔχει ἄφεσιν εἰς τὸν αἰῶνα
  choice: ay walang kapatawaran magpakailanman
  rationale: Ang ἄφεσις ay “kapatawaran” o “pagpapatawad,” at ang negatibong idyomang εἰς τὸν αἰῶνα ay nangangahulugang “hindi kailanman” o “magpakailanman.” Pinananatili ng salin ang parehong diwa at malinaw na temporal na diin.
- source_word: ἀλλὰ
  choice: sa halip
  rationale: Malakas ang paghahambing na ipinakikita ng ἀλλά. Ang “sa halip” ay malinaw na nag-uugnay sa kawalan ng kapatawaran at sa kasunod na pananagutan.
- source_word: ἔνοχός ἐστιν
  choice: may sala siya
  rationale: Maaaring mangahulugan ang ἔνοχος na “may sala” o “mananagot.” Ang “may sala siya” ay tuwirang nagpapanatili sa pahayag ng pagkakasala nang hindi ito ginagawang paliwanag lamang tungkol sa parusa.
- source_word: αἰωνίου ἁμαρτήματος
  choice: sa isang kasalanang walang hanggan
  rationale: Ang tekstong SBLGNT ay may ἁμαρτήματος, “kasalanan,” hindi “hatol.” Ang “walang hanggan” ay natural na katumbas ng αἰώνιος habang pinananatili ang matinding teolohikal na pananalita ng teksto.
theological_decisions:
- issue: Kalikasan ng kasalanang hindi pinatatawad
  choice: Panatilihin ang tuwirang pananalita na paglapastangan sa Banal na Espiritu.
  alternative: Ipaliwanag ito bilang patuloy at sinasadyang pagtanggi sa patotoo ng Espiritu, o bilang pag-uugnay ng gawa ng Espiritu sa kapangyarihan ng demonyo.
  rationale: Mahalaga ang konteksto sa pag-unawa sa pahayag, ngunit hindi idinaragdag ng talatang ito mismo ang gayong mga paliwanag. Pinananatili ng salin ang teolohikal na tensiyon at iniiwasang magpasok ng isang tiyak na interpretasyong doktrinal.
- issue: Tekstuwal na baryante sa hulihan ng talata
  choice: Isalin ang αἰωνίου ἁμαρτήματος bilang “kasalanang walang hanggan.”
  alternative: “walang-hanggang hatol” o “walang-hanggang kaparusahan.”
  rationale: Ito ang pagbasa ng ibinigay na SBLGNT source. Inilalagay sa talababa ang kilalang baryante upang maging masusuri ang tekstuwal na ebidensiya nang hindi pinapalitan ang pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lumapastangan” upang mapanatili ang bigat ng terminong panrelihiyon nang hindi gumagamit ng mahaba o sektaryong paliwanag. Ang “may sala” ay bahagyang pormal ngunit madaling maunawaan at malapit sa legal-moral na puwersa ng Griyego.
