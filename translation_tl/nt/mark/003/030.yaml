  text: because they were saying[a], “He has an unclean spirit.”
translation:
  language: tl
  text: sapagkat paulit-ulit nilang sinasabi[a], “Mayroon siyang maruming espiritu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O kaya, “sinasabi nila.” Maaari ring isalin nang mas idyomatiko ang buong paratang: “Sinasapian siya ng maruming espiritu.”'
    reason: Ipinapakita ang mas payak na salin ng imperpekto at ang mas idyomatikong, ngunit mas interpretatibong, salin ng ἔχει.
lexical_decisions:
- source_word: ὅτι
  choice: sapagkat
  rationale: Ipinahahayag nito ang dahilan ng naunang sinabi ni Jesus tungkol sa kanilang pagkakasala; malinaw at marangal ang sanhi na ipinapakita ng “sapagkat.”
- source_word: ἔλεγον
  choice: paulit-ulit nilang sinasabi
  rationale: Ang aspektong imperpekto ay nagpapahiwatig ng nagpapatuloy o nauulit na pagsasalita. Mas malinaw itong naipapakita sa Tagalog ng “paulit-ulit nilang sinasabi” kaysa ng payak na “sinabi nila.”
- source_word: Πνεῦμα ἀκάθαρτον
  choice: maruming espiritu
  rationale: Pinananatili nito ang karaniwang katawagan sa mga Ebanghelyo at ang tuwirang leksikal na diwa ng ἀκάθαρτος, nang hindi gumagamit ng paliwanag na wala sa mismong parirala.
- source_word: ἔχει
  choice: may … siya
  rationale: Ang Griyego ay literal na “mayroon.” Ang natural na Tagalog na “May maruming espiritu siya” ay nagpapanatili sa payak at matinding anyo ng paratang nang hindi ito pinalalawak sa pangunahing teksto.
theological_decisions:
- issue: Ang likas na katangian ng paratang laban kay Jesus
  choice: “May maruming espiritu siya”
  alternative: “Sinasapian siya ng maruming espiritu”
  rationale: Pinananatili ng pangunahing salin ang tuwirang ἔχει (“mayroon”) at ang bigat ng paratang. Inilalagay sa talababa ang mas idyomatikong pagbasa upang hindi tahimik na ipakahulugan sa pangunahing teksto ang antas o paraan ng impluwensiya ng espiritu.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “sapagkat” para sa malinaw na ugnayang sanhi, at “paulit-ulit nilang sinasabi” upang maipakita ang aspektong imperpekto. Pinanatili ang tradisyonal at madaling maunawaang “maruming espiritu.”
