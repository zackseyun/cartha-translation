base_translation:
  language: en
  yaml_path: translation/nt/mark/003/032.yaml
  text: And a crowd was sitting around him[a], and they said to him, “Look, your mother and your brothers are outside looking for you.”
translation:
  language: tl
  text: Nakaupo sa palibot niya ang maraming tao. Sinabi nila sa kanya, “Tingnan mo, nasa labas ang iyong ina at mga kapatid na lalaki at hinahanap ka nila.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “naghahanap sa iyo.” Ang pandiwang Griyego ay maaaring mangahulugang “maghanap” o “hanapin”; dito, malamang tumutukoy ito sa pisikal na paghahanap sa kanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάθητο
  choice: Nakaupo
  rationale: Ipinakikita ng imperpektong pandiwa ang nagpapatuloy na kalagayan sa tagpo; natural itong ipinahahayag sa Tagalog sa pamamagitan ng “nakaupo.”
- source_word: περὶ αὐτὸν ὄχλος
  choice: sa palibot niya ang maraming tao
  rationale: Ipinapanatili ng “sa palibot niya” ang larawang nakapaligid kay Jesus ang isang pulutong, habang ang “maraming tao” ang mas natural na katumbas ng ὄχλος sa pangungusap na ito.
- source_word: λέγουσιν
  choice: Sinabi nila
  rationale: Ang pangkasalukuyang anyo sa Griyego ay makasaysayang pangkasalukuyan; ang pangnagdaang “sinabi” ang natural sa salaysay na Tagalog.
- source_word: Ἰδοὺ
  choice: Tingnan mo
  rationale: Pantawag-pansin ang ἰδού. Pinananatili ng “Tingnan mo” ang tuwirang diin nito nang hindi gumagamit ng makalumang pananalita.
- source_word: μήτηρ
  choice: ina
  rationale: Tuwirang katumbas ng karaniwang katawagang pampamilya.
- source_word: ἀδελφοί
  choice: mga kapatid na lalaki
  rationale: Panlalaking maramihan ang salitang Griyego. Nililinaw ng “mga kapatid na lalaki” ang kasarian nang hindi nagpapasiya kung paano dapat unawain sa teolohiya ang eksaktong ugnayang pampamilya.
- source_word: ἔξω
  choice: nasa labas
  rationale: Natural at tuwirang paglalarawan ito ng kinaroroonan.
- source_word: ζητοῦσίν σε
  choice: hinahanap ka nila
  rationale: Sa konteksto, ang ζητέω ay tumutukoy sa pagsisikap na matagpuan o makausap si Jesus; “hinahanap ka nila” ang malinaw at natural na salin habang pinananatili ang pangunahing diwa.
theological_decisions:
- issue: Ang tinutukoy ng ἀδελφοί
  choice: Isinalin bilang “mga kapatid na lalaki” nang walang dagdag na paliwanag sa pangunahing teksto.
  alternative: “mga kapatid” o “mga kapatid/malalapit na kamag-anak”
  rationale: Karaniwang katawagang pampamilya ang ginamit ng talata, ngunit hindi nito ipinaliliwanag ang tiyak na uri ng ugnayan. Iniiwasan ng salin ang pagpasok ng konklusyong nakabatay sa isang denominasyonal na pananaw.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “maraming tao” sa halip na mas pormal na “isang pulutong,” at pinanatili ang tuwirang pantawag-pansing “Tingnan mo.”
