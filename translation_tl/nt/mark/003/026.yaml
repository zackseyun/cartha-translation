  - severity: low
    issue: Ang “sa halip” ay hindi kinakailangan sa pagsasalin ng ἀλλά.
    rationale: Sa Filipino, mas tuwiran at mas natural ang “kundi” kasunod ng “hindi ...,” at malinaw nitong inihahayag ang kontrast ng Griyego.
