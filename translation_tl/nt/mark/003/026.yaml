  source_fidelity: Ang “tumindig laban sa kanyang sarili,” “nahati,” at “hindi siya makapananatili” ay tapat sa ἀνέστη ἐφ’ ἑαυτόν, ἐμερίσθη, at οὐ δύναται στῆναι. Ngunit ang “nagwakas na siya” ay masyadong nagpapahiwatig na ganap nang natapos ang wakas. Ang τέλος ἔχει, sa lohikal na argumento, ay mas maingat na maipahahayag bilang nagaganap o nalalapit na pagwawakas, nang hindi ginagawang ganap na eskatolohikal na pahayag.
  naturalness: Natural at marangal ang pangungusap sa modernong Filipino. Mas maayos na alisin ang “sa halip,” dahil ang “kundi” ang karaniwang tuwirang katumbas ng ἀλλά sa ganitong negatibo-at-kontrast na pangungusap.
  terminology: Ang “Satanas” ay angkop na nakasanayang anyo ng pangalan. Ang “makapananatili” ay mahusay na idiomatikong pagpapahayag ng στῆναι sa kontekstong ito. Pinananatili ng “nagwawakas na siya” ang lohikal na diin nang hindi labis na tinutukoy ang huling pagkatalo ni Satanas.
