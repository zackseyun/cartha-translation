  text: καὶ εἰ ὁ Σατανᾶς ἀνέστη ἐφ’ ἑαυτὸν καὶ ⸀ἐμερίσθη, οὐ δύναται ⸀στῆναι ἀλλὰ τέλος ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/026.yaml
  text: And if Satan has risen up against himself and is divided[a], he cannot stand, but has come to an end.
translation:
  language: tl
  text: At kung si Satanas ay tumindig laban sa kanyang sarili at nahati, hindi siya makapananatili kundi nagwawakas na siya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na salin, “may wakas siya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Σατανᾶς
  choice: Satanas
  rationale: Ginamit ang nakasanayang anyo ng personal na pangalang ito sa modernong Filipino.
- source_word: ἀνέστη ἐφ’ ἑαυτὸν
  choice: tumindig laban sa kanyang sarili
  rationale: Ipinahahayag nito ang pagbangon upang sumalungat, habang pinananatili ang larawan ng pagtindig sa Griyego.
- source_word: ἐμερίσθη
  choice: nahati
  rationale: Likas at tuwirang ipinahahayag ng anyong ito ang pagkakahati sa loob ng sarili bilang resultang kalagayan.
- source_word: οὐ δύναται στῆναι
  choice: hindi siya makapananatili
  rationale: Sa konteksto, ang ‘pagtayo’ ay tumutukoy sa kakayahang magpatuloy o manatiling matatag; mas malinaw at natural ito kaysa sa literal na ‘hindi makatatayo.’
- source_word: ἀλλὰ τέλος ἔχει
  choice: sa halip, nagwakas na siya
  rationale: Ipinahahayag nito nang maikli ang bunga ng pagkakahati ayon sa argumento, habang inilalagay sa talababa ang mas literal at likas na hindi tiyak na pariralang ‘may wakas siya.’
theological_decisions:
- issue: Saklaw ng pahayag tungkol sa wakas ni Satanas
  choice: Ihayag ito bilang lohikal na bunga sa kondisyunal na argumento ni Jesus.
  alternative: Unawain ito bilang hiwalay at ganap na pahayag tungkol sa pangwakas na eskatolohikal na pagkatalo ni Satanas.
  rationale: Ipinakikita ng konteksto na pinabubulaanan ni Jesus ang paratang na nagpapalayas siya ng mga demonyo sa kapangyarihan ni Satanas. Hindi pinalalawak ng salin ang pangungusap lampas sa agarang argumento nito.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa pampublikong pagbasa. Pinanatili ang kondisyunal na lohika at ang larawan ng pagtindig hangga’t natural, ngunit ginamit ang “makapananatili” upang malinaw na maipahayag ang diwang hindi makapagpapatuloy o makatatagal.
