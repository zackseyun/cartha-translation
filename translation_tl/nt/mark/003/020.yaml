translation_notes:
  register: Makabagong, malinaw, at marangal na Tagalog. Ginamit ang karaniwang pangnagdaan para sa historikal na pangkasalukuyan ng salaysay ni Marcos. Iniwasan ang pagtukoy na sariling bahay ni Jesus iyon at hindi rin nilinaw nang higit sa teksto kung sino ang saklaw ng “sila.”
