  naturalness: Natural ang pangnagdaang “pumasok” sa makabagong Tagalog para sa historikal na pangkasalukuyan. Ang “Muling nagtipon ang karamihan” ay mas likas at mas tumpak kaysa “ang napakaraming tao.” Ang “anupat hindi man lamang sila makakain ng tinapay” ay malinaw na naghahayag ng bunga nang hindi nilulutas kung sinu-sino ang saklaw ng “sila.”
  terminology: Ang “karamihan” ay angkop para sa ὄχλος. Pinananatili ang “tinapay” bilang katumbas ng ἄρτον, habang ipinapaliwanag sa talababa ang idyomatikong diwa nito bilang pagkain ng isang kainan. Hindi dapat limitahan ang kahulugan sa “makapaghapunan,” sapagkat walang pagtukoy ang teksto sa hapunan.
