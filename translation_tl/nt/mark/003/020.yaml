    rationale: Bagaman maaaring idyomatiko ang “kumain ng tinapay” para sa pagkain ng isang kainan, ang pangunahing teksto sa optimal-equivalence ay dapat magpanatili ng “tinapay,” at ang idyomatikong paliwanag ay ilagay sa talababa.
