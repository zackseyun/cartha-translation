  text: And he comes into a house[a], and the crowd gathers again[c][b], so that they are not even able to eat bread.
translation:
  language: tl
  text: At pumasok siya sa isang bahay[a]. Muling nagtipon ang karamihan, anupat hindi man lamang sila makakain ng tinapay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “umuwi.” Literal na “papasok sa isang bahay” ang Griyego, ngunit maaari ring gamitin ang parirala sa kahulugang pag-uwi.
    reason: lexical_alternative
  - marker: b
    text: Literal na “kumain ng tinapay”; tumutukoy ito sa pagkain ng isang kainan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: pumasok
  rationale: Ang historikal na pangkasalukuyan ay likas na isinasalaysay sa pangnagdaan sa modernong Tagalog; kasabay ng εἰς οἶκον, malinaw na pagpasok sa bahay ang kilos.
- source_word: εἰς οἶκον
  choice: sa isang bahay
  rationale: Walang pantukoy o tahasang panghalip na paari sa Griyego, kaya hindi tinutukoy kung kaninong bahay iyon. Posible rin ang idyomatikong kahulugang “umuwi,” na inilagay sa talababa.
- source_word: συνέρχεται πάλιν ὁ ὄχλος
  choice: Muling nagtipon ang napakaraming tao
  rationale: Natural sa Tagalog ang “nagtipon” para sa sama-samang pagdating ng ὄχλος; ipinahahayag ng “muling” ang πάλιν, at ng “napakaraming tao” ang kolektibong dami ng karamihan.
- source_word: ὥστε μὴ δύνασθαι αὐτοὺς
  choice: kaya hindi man lamang sila makakain
  rationale: Ang ὥστε at pawatas ay nagpapahayag ng bunga. Pinananatiling maramihan ang αὐτούς nang hindi tahasang nilulutas kung sino ang lahat ng kabilang sa “sila.”
- source_word: μηδὲ ἄρτον φαγεῖν
  choice: hindi man lamang sila makakain
  rationale: Ang “kumain ng tinapay” ay idyomatikong tumutukoy sa pagkain o pagkain ng isang kainan; mas natural sa Tagalog ang “makakain,” habang itinatala sa talababa ang literal na anyo.
