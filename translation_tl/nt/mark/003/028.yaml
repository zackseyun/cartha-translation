base_translation:
  language: en
  yaml_path: translation/nt/mark/003/028.yaml
  text: Truly I tell you that all sins will be forgiven to the sons of men[a], and whatever blasphemies they may utter;
translation:
  language: tl
  text: Katotohanang sinasabi ko sa inyo, ipatatawad sa mga anak ng tao[a] ang lahat ng kasalanan at anumang paglapastangan na kanilang bigkasin;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “mga tao” o “sangkatauhan.” Ang ekspresyong Griyego na “mga anak ng tao” ay pangkalahatang tawag sa sangkatauhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν
  choice: Katotohanang
  rationale: Sa pormulang Ἀμὴν λέγω ὑμῖν, ipinahahayag nito ang katiyakan at solemnidad ng kasunod na sinabi. Ang “Katotohanang” ay pormal ngunit nauunawaan sa makabagong Tagalog.
- source_word: λέγω ὑμῖν
  choice: sinasabi ko sa inyo
  rationale: Pinananatili nito ang tuwirang pakikipag-usap at ang kasalukuyang anyo ng pormula.
- source_word: πάντα
  choice: ang lahat
  rationale: Komprehensibo ang πάντα at nililinaw ng mga kasunod na pangngalang “kasalanan” at “mga paglapastangan.”
- source_word: ἀφεθήσεται
  choice: ay ipatatawad
  rationale: Sa konteksto ng kasalanan, ang ἀφίημι ay nangangahulugang magpatawad. Ang hinaharap na balintiyak ay pinananatili sa “ipatatawad.”
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: sa mga anak ng tao[a]
  rationale: Pinananatili ang anyo at Semitikong kulay ng ekspresyon, habang nililinaw sa talababa na pangkalahatan ang tinutukoy nito at hindi lamang mga lalaki.
- source_word: τὰ ἁμαρτήματα
  choice: kasalanan
  rationale: Tumutukoy ito sa mga gawang makasalanan; natural sa Tagalog na gamitin ang “lahat ng kasalanan” nang hindi kailangang markahan ang pangngalan bilang maramihan.
- source_word: αἱ βλασφημίαι
  choice: mga paglapastangan
  rationale: Pinananatili ng “paglapastangan” ang matinding panrelihiyon at teolohikong diwa ng βλασφημία sa konteksto.
- source_word: ὅσα ἐὰν βλασφημήσωσιν
  choice: anumang mga paglapastangan na sabihin nila
  rationale: Ipinahahayag ng “anumang” ang bukás at di-tiyak na saklaw ng ὅσα ἐάν, samantalang ang “sabihin nila” ay malinaw na nagpapakitang binibigkas ang mga paglapastangan.
theological_decisions:
- issue: Lawak ng pahayag tungkol sa kapatawaran kaugnay ng kasunod na babala laban sa paglapastangan sa Banal na Espiritu
  choice: Isinalin ang talata bilang malawak na pahayag ng kapatawaran ayon sa mismong pananalita nito.
  alternative: Ipasok na agad sa talatang ito ang limitasyong tahasang binabanggit sa kasunod na talata.
  rationale: Inihahayag muna ng talatang ito ang lawak ng kapatawaran bago sabihin ng kasunod na talata ang eksepsiyon. Hindi dapat lutasin nang maaga sa salin ang sinadyang tensiyong ito.
- issue: Pangkalahatang panlalaking ekspresyong τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: Pinanatili sa pangunahing teksto ang “mga anak ng tao,” na may talababa tungkol sa pangkalahatang kahulugan.
  alternative: mga tao; sangkatauhan; mga nilalang na tao
  rationale: Mas malapit ang pangunahing salin sa anyo ng Griyego at sa Semitikong kulay nito, habang tinitiyak ng talababa na saklaw ang lahat ng tao.
translation_notes:
  register: Makabago ngunit marangal ang rehistro. Pinanatili ang solemneng pormulang “Katotohanang sinasabi ko sa inyo” at ang Semitikong “mga anak ng tao,” na nilinaw sa talababa. Ginamit ang “paglapastangan” upang mapanatili ang bigat ng kontekstong panrelihiyon.
