    rationale: Bagaman tama sa gramatika, mas malinaw at natural ang aktibong ayos na “nakikita nila siya,” lalo na dahil ang mga espiritu ang patuloy na paksa ng mga kasunod na pandiwa.
  - severity: low
    issue: Hindi natural ang “ibinubuwal nila ang kanilang sarili” sa talababa.
    rationale: Ang “ibinubuwal” ay karaniwang nagpapahiwatig na may nagpapabuwal o nagpapabagsak. Ang “inihahagis nila ang kanilang sarili” ay mas natural para sa lexical alternative na “threw themselves down,” nang hindi nilalagyan ng motibong pagsamba ang kilos.
