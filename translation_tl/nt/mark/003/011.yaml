  naturalness: Nauunawaan ang “nakikita siya ng maruruming espiritu,” ngunit mas tuwiran at likas sa modernong Tagalog ang “nakikita nila siya.” Pinananatili rin nito ang mga espiritu bilang malinaw na paksa ng buong sugnay.
  terminology: Ang “maruruming espiritu,” “nagpapatirapa,” at “Anak ng Diyos” ay angkop at pare-pareho sa literal ngunit natural na rehistrong biblikal. Ang talababa ay dapat gumamit ng mas natural na katumbas ng kusang pagbagsak/paghagis ng sarili kaysa “ibinubuwal nila ang kanilang sarili.”
  issues:
