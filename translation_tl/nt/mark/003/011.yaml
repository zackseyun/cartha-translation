  text: καὶ τὰ πνεύματα τὰ ἀκάθαρτα, ὅταν αὐτὸν ⸂ἐθεώρουν, προσέπιπτον⸃ αὐτῷ καὶ ⸀ἔκραζον ⸀λέγοντα ὅτι Σὺ εἶ ὁ υἱὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/011.yaml
  text: And whenever the unclean spirits saw him[a], they fell down before him and cried out, saying, “You are the Son of God.”
translation:
  language: tl
  text: At tuwing nakikita nila siya, nagpapatirapa ang maruruming espiritu sa harap niya[a] at sumisigaw, “Ikaw ang Anak ng Diyos!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “inihahagis nila ang kanilang sarili sa harap niya.” Maaaring tumukoy ang pandiwang Griyego sa pagpapatirapa sa harap ng isang tao bilang pagpapasakop o pagsusumamo.
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεύματα τὰ ἀκάθαρτα
  choice: maruruming espiritu
  rationale: Tuwirang pinananatili ang katawagang ginagamit sa mga Ebanghelyo at ang diwang ritwal at moral ng ἀκάθαρτα, sa halip na gawing mas interpretatibong “masasamang espiritu.”
- source_word: ὅταν
  choice: tuwing
  rationale: Kasama ng mga pandiwang nasa imperfect, ipinahihiwatig nito ang paulit-ulit na pangyayari; natural itong ipinapahayag sa Tagalog ng “tuwing.”
- source_word: ἐθεώρουν
  choice: nakikita
  rationale: Natural at sapat ang “nakikita” sa kontekstong pasalaysay; ipinahahayag na ng “tuwing” ang paulit-ulit na kilos.
- source_word: προσέπιπτον αὐτῷ
  choice: nagpapatirapa sila sa harap niya
  rationale: Ipinapakita ang pisikal na pagbagsak o pagpapatirapa sa harap ng isang tao nang hindi ipinapalagay na tahasang pagsamba ang motibo.
- source_word: ἔκραζον
  choice: sumisigaw
  rationale: Pinananatili ang lakas ng κράζω sa natural at kasalukuyang Tagalog nang hindi nagiging labis na dramatiko.
- source_word: λέγοντα
  choice: direktang sinundan ng siniping pahayag
  rationale: Ang participle ay kasabay ng pagsigaw. Sa natural na Tagalog, sapat nang sundan ang “sumisigaw” ng mismong sinabi, nang hindi idagdag ang mabigat na “na nagsasabi.”
- source_word: Σὺ εἶ
  choice: Ikaw ang
  rationale: Natural na naipapahayag ng “Ikaw ang” ang diin ng hayag na panghalip na Σὺ.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Anak ng Diyos
  rationale: Pinananatili ang titulong kristolohikal at ang kinikilalang anyo nito sa Tagalog.
theological_decisions:
- issue: Kung ang pagpapatirapa ng maruruming espiritu sa harap ni Jesus ay dapat isaling tahasang pagsamba
  choice: “nagpapatirapa sila sa harap niya,” nang hindi ginagamit ang “sumasamba”
  alternative: “sumasamba sila sa kanya” o “yumuyukod sila sa harap niya”
  rationale: Maaaring tumukoy ang προσπίπτω sa pagpapatirapa bilang paggalang, pagsusumamo, o sapilitang pagpapasakop. Hindi tahasang sinasabi ng talata na sumamba sila, kaya pinananatili ang pisikal na kilos at ang teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “maruruming espiritu” bilang pamilyar na katawagang biblikal, at pinili ang “nagpapatirapa” upang mapanatili ang kongkretong kilos nang hindi ito awtomatikong tawaging pagsamba.
