    issue: Malabo ang “nagpasugo sa kanya.”
    rationale: 'Ang nagpasugo ay karaniwang causative: nagpapadala ng isang tao. Sa kasalukuyang pangungusap, madaling mabasa na ang ina at mga kapatid ang nagpadala kay Jesus, samantalang ang Griyego ay nagsasabing nagpadala sila sa kanya—na may kasamang pagtawag sa kanya.'
  - severity: medium
    issue: Hindi malinaw ang layon at tagaganap sa “upang tawagin siya.”
    rationale: Hindi malinaw kung sino ang tatawag kanino. Ang “nagpasabi sila sa kanya na ipinapatawag nila siya” ay tuwirang naghahayag ng pagpapadala ng mensahe at ng nilalaman/layunin nitong pagtawag.
  revised_text: Pagkatapos, dumating ang kanyang ina at ang kanyang mga kapatid na lalaki. Nakatayo sila sa labas at nagpasabi sila sa kanya na ipinapatawag nila siya.
