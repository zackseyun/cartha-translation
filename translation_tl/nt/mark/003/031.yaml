  text: ⸂Καὶ ἔρχονται⸃ ⸂ἡ μήτηρ αὐτοῦ καὶ οἱ ἀδελφοὶ αὐτοῦ⸃ καὶ ἔξω ⸀στήκοντες ἀπέστειλαν πρὸς αὐτὸν ⸀καλοῦντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/031.yaml
  text: Then his mother and his brothers came[a], and standing outside they sent word to him[b], calling him.
translation:
  language: tl
  text: Pagkatapos, dumating ang kanyang ina at ang kanyang mga kapatid na lalaki. Nakatayo sila sa labas at nagpasabi sila sa kanya na ipinapatawag nila siya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Pagkatapos
  rationale: Isinusulong ng καί ang daloy ng salaysay; natural sa makabagong Filipino ang “Pagkatapos” kaysa sa payak na “At” sa simula ng pangungusap.
- source_word: ἔρχονται
  choice: dumating
  rationale: Historical present ito sa salaysay; ang pangnagdaang “dumating” ang natural na katumbas sa Filipino.
- source_word: ἡ μήτηρ αὐτοῦ
  choice: ang kanyang ina
  rationale: Tuwirang isinasalin ang pariralang paari nang walang dagdag na pagpapakahulugan.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: mga kapatid na lalaki
  rationale: Pinananatili nito ang panlalaking anyo at payak na kahulugan ng ἀδελφοί, nang hindi nagpapasiya kung ano ang eksaktong ugnayang pampamilya.
- source_word: ἔξω στήκοντες
  choice: Nakatayo sila sa labas
  rationale: Inilalahad ng participle ang kanilang kalagayan habang isinasagawa ang kasunod na kilos; malinaw at natural ang hiwalay na sugnay sa Filipino.
- source_word: ἀπέστειλαν πρὸς αὐτὸν
  choice: nagpasugo sa kanya
  rationale: Ipinahihiwatig ng pahayag na nagsugo sila ng isang tao upang makarating kay Jesus; hindi nito kailangang tukuyin kung mensahero o mensahe ang binibigyang-diin.
- source_word: καλοῦντες αὐτόν
  choice: upang tawagin siya
  rationale: Ipinahahayag ng participle ang layunin ng pagsusugo—ang tawagin o ipatawag si Jesus—nang hindi dinaragdagan ang teksto ng tahasang utos na lumabas.
theological_decisions:
- issue: Tinutukoy ng “mga kapatid na lalaki”
  choice: Isalin nang tuwiran bilang “mga kapatid na lalaki” nang walang paliwanag sa pangunahing teksto.
  alternative: Tukuyin sila bilang mga kapatid sa ina, mga kamag-anak, o ibang uri ng kapamilya.
  rationale: ἀδελφοί ang ginamit ng Griyego, ngunit hindi nilulutas ng talatang ito lamang ang pinagtatalunang eksaktong ugnayang pampamilya. Hindi dapat magpasok ang salin ng natatanging aral ng alinmang denominasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nagpasugo” upang maging natural ang di-tahasang layon ng ἀπέστειλαν, at pinanatili ang “tawagin siya” upang hindi tahimik na gawing “palabasin siya,” na mas tiyak kaysa sa Griyego.
