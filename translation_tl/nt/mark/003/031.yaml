review_pass:
  verdict: revise
  source_fidelity: Tumpak ang pangunahing mga tauhan at tagpuan, ngunit ang “nagpasugo sa kanya” ay maaaring mangahulugang ipinadala nila siya, sa halip na nagsugo sila sa kanya ng mensahero o mensahe. Hindi rin malinaw ang ugnayan nito sa “upang tawagin siya.”
  naturalness: Hindi natural at malabo sa makabagong Filipino ang “nagpasugo sa kanya upang tawagin siya,” dahil iisa ang “kanya/siya” na maaaring mali ang pagkakaugnay ng mga kilos. Mas idiomatiko ang “nagpasabi sila sa kanya na ipinapatawag nila siya.”
  terminology: Wasto ang “ina” at “mga kapatid na lalaki.” Pinananatili ng “mga kapatid na lalaki” ang panlalaking pangmaramihan ng ἀδελφοί nang hindi nilulutas ang eksaktong ugnayang pampamilya.
  issues:
