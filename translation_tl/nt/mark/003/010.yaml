  text: πολλοὺς γὰρ ἐθεράπευσεν, ὥστε ἐπιπίπτειν αὐτῷ ἵνα αὐτοῦ ἅψωνται ὅσοι εἶχον μάστιγας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/010.yaml
  text: For he had healed many, so that all who had afflictions were pressing in on him in order to touch him.
translation:
  language: tl
  text: Sapagkat marami na siyang pinagaling, kaya dinudumog siya ng lahat ng may mabibigat na karamdaman[a] upang mahipo siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga hagupit”; maaari ring isaling “matitinding paghihirap” o “mga sakit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὺς γὰρ ἐθεράπευσεν
  choice: Sapagkat marami na siyang pinagaling
  rationale: Ipinapaliwanag ng γάρ ang dahilan ng pagkilos ng mga tao. Ang «marami na siyang pinagaling» ay likas sa Tagalog at ipinakikitang ang naunang pagpapagaling ang dahilan ng kasalukuyang pagsisiksikan.
- source_word: ὥστε ἐπιπίπτειν αὐτῷ
  choice: kaya nagsisiksikan sa kanya
  rationale: Ang ὥστε ay nagsasaad ng resulta. Sa konteksto ng siksikang pulutong, inilalarawan ng ἐπιπίπτω ang marahas o puwersahang paglapit; malinaw itong naihahayag ng «nagsisiksikan sa kanya» nang hindi gumagamit ng mekanikal na «nahuhulog sa kanya.»
- source_word: ἵνα αὐτοῦ ἅψωνται
  choice: upang mahawakan siya
  rationale: Ang ἵνα ay nagsasaad ng layunin, at ang ἅπτομαι na may genitive ay nangangahulugang humipo o humawak. Ang «mahahawakan» ay natural sa sitwasyong nagsisikap silang maabot at mahawakan si Jesus.
- source_word: ὅσοι εἶχον μάστιγας
  choice: ang lahat ng may mabibigat na karamdaman
  rationale: Taglay ng ὅσοι ang malawak na diwang «lahat ng.» Literal na «mga hagupit» ang μάστιγας ngunit matalinghaga itong tumutukoy sa matitinding dinaranas o sakit; iniiwasan ng salin ang sobrang literal at mapanlinlang na «mga hagupit.»
theological_decisions:
- issue: Saklaw ng μάστιγας sa konteksto ng pagpapagaling
  choice: mabibigat na karamdaman
  alternative: matitinding paghihirap; mga sakit; mga salot
  rationale: Nasa konteksto ito ng pagpapagaling, kaya ang «karamdaman» ay malinaw sa karaniwang mambabasa; pinananatili naman ng «mabibigat» ang tindi at larawan ng salitang literal na nangangahulugang «mga hagupit,» nang hindi tinutukoy ang isang tiyak na uri ng sakit.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignified, at madaling basahin. Pinanatili ang ugnayang sanhi at bunga ng pangungusap at ang puwersa ng pagsiksik ng pulutong.
