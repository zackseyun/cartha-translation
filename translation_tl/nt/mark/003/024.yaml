id: MRK.3.24
reference: Mark 3:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐὰν βασιλεία ἐφ’ ἑαυτὴν μερισθῇ, οὐ δύναται σταθῆναι ἡ βασιλεία ἐκείνη·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/024.yaml
  text: And if a kingdom is divided against itself, that kingdom cannot stand.
translation:
  language: tl
  text: At kung ang isang kaharian ay nahahati laban sa sarili nito, hindi makatatayo ang kahariang iyon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Likas na pang-ugnay ito sa naunang argumento at pinananatili ang tuwirang pagpapatuloy ng pangungusap.
- source_word: ἐὰν
  choice: kung
  rationale: Ipinakikilala nito ang kondisyong may subjunctive; ang “kung” ang natural na katumbas sa maksimang ito.
- source_word: βασιλεία
  choice: kaharian
  rationale: Tumutukoy rito sa kaharian bilang isang kabuuang entidad, hindi lamang sa abstraktong paghahari.
- source_word: ἐφ’ ἑαυτὴν
  choice: laban sa sarili nito
  rationale: Sa kontekstong ito, ang parirala ay nagpapahayag ng panloob na pagsasalungatan o paglalaban.
- source_word: μερισθῇ
  choice: ay nahahati
  rationale: Pinananatili nito ang pasibong diwa ng aorist passive subjunctive nang hindi tinutukoy kung sino ang sanhi ng pagkakahati.
- source_word: οὐ δύναται
  choice: hindi makatatayo
  rationale: Sa pagsama sa infinitive na σταθῆναι, natural nitong ipinahahayag sa Filipino ang kawalan ng kakayahang manatiling matatag.
- source_word: σταθῆναι
  choice: makatatayo
  rationale: Pinananatili ang metapora ng pagtayo, na sa konteksto ay nangangahulugang manatiling matatag o patuloy na umiiral.
- source_word: ἡ βασιλεία ἐκείνη
  choice: ang kahariang iyon
  rationale: Pinananatili ang pag-uulit ng pangngalan at ang diin ng demonstratibong ἐκείνη.
theological_decisions:
- issue: Saklaw ng kasabihan
  choice: Isinalin bilang pangkalahatang simulain sa loob ng pangangatwiran ni Jesus.
  alternative: Palawakin ito bilang isang kasabihang tuwirang tumutukoy sa lahat ng usaping panlipunan o pampolitika.
  rationale: Ginagamit ang pahayag bilang paghahambing sa pagtutol ni Jesus; hindi dapat dagdagan ng salin ang teolohikal o pampolitikang saklaw na hindi tahasang sinasabi ng talata.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “nahahati laban sa sarili nito” upang mapanatili ang panloob na pagsasalungatan, at ang “makatatayo” upang mapanatili ang metapora ng orihinal.
