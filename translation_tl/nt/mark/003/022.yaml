  text: καὶ οἱ γραμματεῖς οἱ ἀπὸ Ἱεροσολύμων καταβάντες ἔλεγον ὅτι Βεελζεβοὺλ ἔχει καὶ ὅτι ἐν τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/022.yaml
  text: And the scribes who had come down from Jerusalem were saying[a], “He has Beelzebul,” and[c][b], “By the ruler of the demons he casts out the demons.”
translation:
  language: tl
  text: At ang mga eskriba na bumaba mula sa Jerusalem ay paulit-ulit na nagsasabi, “May Beelzebul siya[a][b],” at, “Sa pamamagitan ng pinuno[c] ng mga demonyo ay nagpapalayas siya ng mga demonyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas tahasan, “Sinasapian siya ni Beelzebul.”
    reason: lexical_alternative
  - marker: b
    text: 'Griyego: Βεελζεβούλ; tradisyonal na isinasaling “Beelzebub.”'
    reason: alternative_reading
  - marker: c
    text: O “prinsipe ng mga demonyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γραμματεῖς
  choice: mga eskriba
  rationale: Ang “mga eskriba” ang kinikilalang katawagan sa mga dalubhasa at tagapagturo ng Kautusan sa konteksto ng mga Ebanghelyo; hindi ito tumutukoy lamang sa mga tagakopya.
- source_word: ἀπὸ Ἱεροσολύμων καταβάντες
  choice: bumaba mula sa Jerusalem
  rationale: Pinananatili nito ang direksiyong ipinahihiwatig ng καταβάντες at natural itong pakinggan sa Filipino.
- source_word: ἔλεγον
  choice: patuloy na nagsasabi
  rationale: Ipinahihiwatig ng aspektong imperpekto ang nagpapatuloy o paulit-ulit na pagsasalita, hindi lamang isang minsanang pahayag.
- source_word: Βεελζεβοὺλ
  choice: Beelzebul
  rationale: Tuwirang tinutumbasan nito ang anyong Griyego na Βεελζεβούλ; inilalagay sa talababa ang tradisyonal na anyong “Beelzebub.”
- source_word: ἔχει
  choice: Taglay niya
  rationale: Malapit ito sa literal na “mayroon siya” ngunit mas natural at marangal sa Filipino. Hindi tahasang nilulutas sa pangunahing teksto kung ang paratang ay pagsapi o pagkontrol; ibinibigay ang mas malinaw na pagpapakahulugan sa talababa.
- source_word: ἐν τῷ ἄρχοντι τῶν δαιμονίων
  choice: Sa pamamagitan ng pinuno ng mga demonyo
  rationale: 'Ang ἐν ay ginagamit dito sa instrumental na diwa: ipinaparatang na kumikilos siya sa kapangyarihan o pamamagitan ng pinuno ng mga demonyo. Ang “pinuno” ay mas malinaw sa modernong Filipino kaysa “prinsipe.”'
- source_word: δαιμονίων / δαιμόνια
  choice: mga demonyo
  rationale: Tuwiran nitong tinutumbasan ang δαιμόνιον at hindi ipinapalit ang kaugnay ngunit naiibang pariralang “maruruming espiritu.”
- source_word: ἐκβάλλει
  choice: nagpapalayas
  rationale: Natural at malinaw itong katawagan sa Filipino para sa pagpapaalis ng mga demonyo, habang pinananatili ang puwersa ng ἐκβάλλει.
theological_decisions:
- issue: Ang paratang na Βεελζεβοὺλ ἔχει
  choice: Taglay niya si Beelzebul
  alternative: Sinasapian siya ni Beelzebul
  rationale: Pinananatili ng pangunahing teksto ang maikli at bahagyang di-tiyak na idyomang Griyego sa halip na tahasang ipakahulugan agad bilang pagsapi. Ang mas malinaw na kontekstuwal na diwa ay nasa talababa.
- issue: Ang kahulugan ng ἄρχοντι
  choice: pinuno ng mga demonyo
  alternative: prinsipe ng mga demonyo
  rationale: Parehong maaaring salin, ngunit mas tuwiran at kasalukuyan ang “pinuno” bilang paglalarawan sa may kapangyarihan. Pinananatili sa talababa ang tradisyonal na “prinsipe.”
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang kinikilalang terminong “mga eskriba,” pinanatili ang aspektong nagpapatuloy ng ἔλεγον, at iniwasang gawing tahasang pagsapi sa pangunahing teksto ang sadyang maigsi at may puwang na paratang na Βεελζεβοὺλ ἔχει.
