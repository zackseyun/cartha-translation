  text: Καὶ ὁ Ἰησοῦς ⸂μετὰ τῶν μαθητῶν αὐτοῦ ἀνεχώρησεν⸃ πρὸς τὴν θάλασσαν· καὶ πολὺ πλῆθος ἀπὸ τῆς Γαλιλαίας ⸀ἠκολούθησεν, καὶ ἀπὸ τῆς Ἰουδαίας
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/007.yaml
  text: And Jesus withdrew with his disciples to the sea[a], and a great crowd from Galilee followed, and from Judea[b],
translation:
  language: tl
  text: At umalis si Jesus kasama ng kanyang mga alagad patungo sa dagat[a], at sinundan siya ng napakaraming tao mula sa Galilea, at mula sa Judea,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “dagat.” Ang tinutukoy ay ang Dagat ng Galilea, na tinatawag ding Lawa ng Galilea.
    reason: cultural_note
  - marker: b
    text: Nagpapatuloy sa susunod na talata ang talaan ng mga lugar na pinanggalingan ng mga tao.
    reason: discourse_note
lexical_decisions:
- source_word: ἀνεχώρησεν
  choice: umalis
  rationale: Ipinahihiwatig ng pandiwa ang paglayo o pag-urong mula sa isang lugar, posibleng dahil sa pagtutol sa naunang konteksto. Mas natural sa modernong Tagalog ang “umalis” kaysa “umurong,” na maaaring magbigay ng sobrang tiyak na diwang militar o takot.
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: kasama ang kanyang mga alagad
  rationale: Ang “mga alagad” ang kinikilalang salin ng μαθηταί sa konteksto ng Ebanghelyo at saklaw nito ang pagiging tagasunod at tinuturuan, hindi lamang estudyante.
- source_word: πρὸς τὴν θάλασσαν
  choice: patungo sa lawa
  rationale: Ang πρὸς ay nagsasaad ng kilos sa direksiyon ng isang lugar, kaya pinananatili ng “patungo sa” ang posibleng diwa ng “toward.” Bagaman literal na “dagat” ang θάλασσα, ang tinutukoy rito ay ang anyong-tubig na kilala sa Filipino bilang Lawa ng Galilea; nililinaw ito sa talababa.
- source_word: πολὺ πλῆθος
  choice: napakaraming tao
  rationale: Natural at malinaw itong modernong Tagalog para sa isang lubhang malaking pulutong, nang hindi gumagamit ng makalumang “karamihan” o “pulutong.”
- source_word: ἠκολούθησεν
  choice: sumunod sa kanya
  rationale: Ang pandiwa ay tumutukoy rito sa aktuwal na pagsunod ng maraming tao kay Jesus; idinagdag ang tahasang layon na “sa kanya” para sa likas na daloy sa Tagalog.
- source_word: ἀπὸ τῆς Γαλιλαίας … καὶ ἀπὸ τῆς Ἰουδαίας
  choice: mula sa Galilea at Judea
  rationale: Tuwirang ipinapahayag ang pinagmulan ng mga tao. Pinagsama sa natural na Tagalog ang inuulit na ἀπό nang hindi binabago ang kahulugan.
theological_decisions: []
translation_notes:
  register: Modernong, dignificado, at madaling maunawaang Filipino. Pinanatili ang diwang nagpapatuloy ang pangungusap sa susunod na talata sa pamamagitan ng kuwit sa hulihan. Ginamit ang “lawa” sa pangunahing teksto bilang natural na katawagan sa Filipino, habang inilagay sa talababa ang literal na “dagat” at ang alternatibong pagbasa sa πρὸς.
