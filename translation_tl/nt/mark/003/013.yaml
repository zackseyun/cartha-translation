  source_fidelity: Ang “mga ibig niyang makasama” ay nagdaragdag ng diwa ng pagsasama na wala sa οὓς ἤθελεν αὐτός at hindi sapat na naihahayag ang mariing αὐτός. Ang “lumapit sila sa kanya” ay katanggap-tanggap para sa ἀπῆλθον πρὸς αὐτόν, ngunit ang “pumunta sila sa kanya” ay mas tuwirang tumutugma sa kilos ng pagpunta patungo sa kanya. Ang “tinawag niyang lumapit sa kanya” ay malinaw na naghahatid ng προσκαλεῖται, ang pagtawag sa mga tao patungo sa sarili niya.
  naturalness: Natural at malinaw sa modernong Filipino ang “tinawag niyang lumapit sa kanya.” Ang pag-uulit ng “sa kanya” sa kasunod na sugnay ay sinasadyang pinananatili upang maipakita ang magkahiwalay na kilos ng pagtawag at pagtugon, gaya ng nasa Griyego.
  terminology: Ginamit ang “nais niya mismo” upang maipahayag ang θέλω at ang pagbibigay-diin ng αὐτός nang walang idinadagdag na doktrinal na pagpapakahulugan. Pinanatili ang “Jesus” at ang marangal ngunit makabagong rehistro.
