  yaml_path: translation/nt/mark/003/013.yaml
  text: And he went up on the mountain and called to himself those whom he wanted[b][a], and they came to him.
translation:
  language: tl
  text: Umakyat si Jesus sa bundok at tinawag niyang lumapit sa kanya ang mga nais niya mismo, at pumunta sila sa kanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβαίνει
  choice: Umakyat
  rationale: Isinalin ang historikal na pangkasalukuyan bilang pangnagdaan, na likas sa salaysay sa Filipino, habang pinananatili ang diwa ng pag-akyat.
- source_word: εἰς τὸ ὄρος
  choice: sa bundok
  rationale: Sa piling ng pandiwang “umakyat,” natural na ipinahihiwatig nito ang pag-akyat sa bundok nang hindi pinipilit ang literal na “papasok.”
- source_word: προσκαλεῖται
  choice: tinawag niya ... makasama
  rationale: 'Ipinahahayag nito ang personal at patungong-sarili na himig ng middle voice: tinawag sila ni Jesus upang lumapit at makasama niya.'
- source_word: οὓς ἤθελεν αὐτός
  choice: ang mga ibig niyang makasama
  rationale: Ang “ibig niya” ay natural na katumbas ng θέλω; sa konteksto, nililinaw ng “makasama” ang layon ng pagtawag nang hindi nagdaragdag ng sistematikong doktrina. Ang tahasang paksa at anyong “niyang” ay nagpapanatili sa sariling pagkukusa ni Jesus.
- source_word: ἀπῆλθον πρὸς αὐτόν
  choice: lumapit sila sa kanya
  rationale: Bagaman ang ἀπέρχομαι ay maaaring mangahulugang “pumunta,” ang πρὸς αὐτόν ay malinaw na kilos patungo kay Jesus. Ang “lumapit” ang pinakanatural sa Filipino at hindi nakatali sa pananaw ng “pumunta” o “dumating.”
theological_decisions:
- issue: Pagbibigay-diin sa sariling pagpili ni Jesus sa mga tinawag
  choice: ang mga ibig niyang makasama
  alternative: ang mga nais niya mismo
  rationale: Pinananatili ang pagkukusa ni Jesus na ipinahihiwatig ng αὐτός, ngunit iniiwasang gawing tahasang pahayag tungkol sa isang mas malawak na doktrina ng pagpili na hindi sinasabi ng talata.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “si Jesus” sa halip na isang malabong “siya” dahil iisang talata ang inilalahad at kailangan ang likas na pagkakakilanlan ng paksa sa Filipino. Walang talababa sapagkat sapat na naipapahayag sa teksto ang mga leksikal na posibilidad nang hindi binubura ang mahalagang diwa.
