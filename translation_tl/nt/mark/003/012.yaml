  yaml_path: translation/nt/mark/003/012.yaml
  text: And he sternly warned them many times not to make him known[a].
translation:
  language: tl
  text: At paulit-ulit niya silang mahigpit na pinagbawalan na ipakilala siya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ihayag siya,” “ipaalam sa madla kung sino siya,” o, sa mas pormal na pananalita, “gawin siyang hayag.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλὰ
  choice: paulit-ulit
  rationale: Ginagamit dito bilang pang-abay na nagpapahiwatig ng inuulit o mariing pagkilos. Likas sa makabagong Tagalog ang “paulit-ulit” at malinaw nitong naihahatid ang ideya ng maraming ulit.
- source_word: ἐπετίμα
  choice: mahigpit na pinagbawalan
  rationale: Ipinahihiwatig ng pandiwa ang mariin at may awtoridad na pagsaway o pag-uutos. Sa kontekstong ito, malinaw na pagbabawal ang kasunod, kaya natural at tumpak ang “mahigpit na pinagbawalan.”
- source_word: αὐτοῖς
  choice: sila
  rationale: Ang panghalip na maramihan ay tumutukoy sa mga maruruming espiritu sa naunang konteksto.
- source_word: ἵνα μὴ
  choice: pinagbawalang
  rationale: Isinama sa kayariang pandiwa upang natural na maipahayag sa Tagalog ang nilalaman o layunin ng mariing utos na huwag gawin ang kasunod.
- source_word: αὐτὸν φανερὸν ποιήσωσιν
  choice: ipakilala siya
  rationale: Ang parirala ay nangangahulugang ihayag o ipaalam sa iba kung sino siya. Ang “ipakilala siya” ay maikli, natural, at hindi nagdaragdag ng tiyak na titulo o pagkakakilanlang hindi tahasang binabanggit sa talata.
theological_decisions:
- issue: Saklaw ng utos ni Jesus sa mga maruruming espiritu
  choice: Isinalin bilang pagbabawal na ipakilala si Jesus, nang hindi tinutukoy kung anong titulo o bahagi ng kanyang pagkakakilanlan ang hindi nila dapat ihayag.
  alternative: Tahasang sabihing ipinagbawal niyang ihayag nila na siya ang Anak ng Diyos.
  rationale: Ipinahihiwatig ng kalapit na konteksto ang pagkakakilanlan ni Jesus, ngunit ang mismong talata ay nagsasabi lamang na huwag nila siyang ipakilala o ihayag. Pinananatili ng salin ang saklaw at tensiyon ng orihinal.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “paulit-ulit” at “mahigpit na pinagbawalan” upang maipahayag ang lakas ng utos nang hindi nagiging makaluma o mabigat basahin.
