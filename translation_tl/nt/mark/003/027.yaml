  source_fidelity: 'Kailangang itama ang huling sugnay. Ang “mananakawan ang bahay nito” ay baligtad ang pokus/relasyong semantiko: nangangahulugan itong ang bahay ang mananakawan, samantalang ang Griyego ay nagsasabing ang pumapasok ang siyang darambong sa bahay ng malakas na tao. Ang rebisyon ay nagpapanatili ng pagkakasunod: pumasok, dambungin ang mga gamit, gapusin muna ang malakas na tao, at saka dambungin ang kanyang bahay.'
  naturalness: Ang “maaaring pumasok ... at dambungin” at “saka niya dadambungin” ay malinaw at natural na modernong Filipino sa matalinghagang rehistrong ito. Mas angkop ang “dambungin” kaysa sa “manakawan” upang maipakita ang marahas o ganap na pagsamsam na saklaw ng διαρπάζω.
