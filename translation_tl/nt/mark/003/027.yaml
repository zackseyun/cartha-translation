id: MRK.3.27
reference: Mark 3:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸂ἀλλ’ οὐδεὶς δύναται⸃ ⸂εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ εἰσελθὼν τὰ σκεύη⸃ αὐτοῦ διαρπάσαι ἐὰν μὴ πρῶτον τὸν ἰσχυρὸν δήσῃ, καὶ τότε τὴν οἰκίαν αὐτοῦ ⸀διαρπάσει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/027.yaml
  text: But no one can enter the house of the strong man and plunder his goods unless he first ties up the strong man[b][a]; then indeed he will plunder his house.
translation:
  language: tl
  text: Ngunit walang sinuman ang maaaring pumasok sa bahay ng taong malakas at dambungin ang mga ari-arian nito[a] malibang gapusin muna niya ang taong malakas[b]. Saka niya dadambungin ang bahay nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga pag-aari” o “mga gamit.” Sa mas literal na diwa, “mga sisidlan/bagay.”
    reason: lexical_alternative
  - marker: b
    text: Ang “taong malakas” ay bahagi ng talinghaga ni Jesus tungkol sa paggapi kay Satanas; pinananatili rito ang larawan sa halip na ilagay ang interpretasyon sa pangunahing teksto.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  choice: Ngunit
  rationale: Likas at marangal na panandang panalungat na nag-uugnay sa talinghaga sa naunang pagtutol ni Jesus.
- source_word: οὐδεὶς δύναται
  choice: walang sinumang makapapasok ... at makapagnanakaw
  rationale: Ipinahahayag nang natural sa Tagalog ang kawalan ng kakayahan habang pinananatili ang magkaugnay na mga kilos.
- source_word: εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ
  choice: sa bahay ng taong malakas
  rationale: Pinananatili ang konkretong larawan ng bahay at ang substantibong gamit ng ἰσχυρός bilang isang malakas na tao.
- source_word: τὰ σκεύη αὐτοῦ
  choice: mga ari-arian nito
  rationale: Sa konteksto ng pagnanakaw sa bahay, tumutukoy ang σκεύη sa mga gamit o pag-aari; mas malinaw sa modernong Tagalog ang 'mga ari-arian' kaysa literal na 'mga sisidlan.'
- source_word: διαρπάσαι / διαρπάσει
  choice: makapagnanakaw / mananakawan
  rationale: Ipinakikita ng mga pandiwang ito ang sapilitang pagkuha o pandarambong. Sa kontekstong pambahay, natural ang 'nakawin/manakawan,' bagaman bahagyang hindi nito tahasang ipinapakita ang puwersa ng unlaping δια-.
- source_word: ἐὰν μὴ πρῶτον
  choice: malibang ... muna
  rationale: Malinaw na ipinahahayag ang kinakailangang kondisyong dapat maunang maganap.
- source_word: δήσῃ
  choice: gapusin
  rationale: Tumpak at matingkad na katumbas ng pagtali o pagpigil sa isang tao; angkop sa larawan ng pagpasok at pagnanakaw.
- source_word: καὶ τότε
  choice: Saka pa lamang
  rationale: Idinidiin ang resulta na maaari lamang mangyari pagkatapos gapusin ang taong malakas.
- source_word: τὴν οἰκίαν αὐτοῦ
  choice: ang bahay nito
  rationale: Pinananatili ang pag-uulit ng 'bahay' at ang saklaw ng buong tahanan o nasasakupan nang hindi ginagawang tahasang interpretasyon.
theological_decisions:
- issue: Ang metaporikal na pagkakakilanlan ng 'taong malakas' sa argumento ni Jesus tungkol kay Satanas
  choice: Panatilihin sa pangunahing teksto ang larawang 'taong malakas.'
  alternative: Tahasang isalin bilang 'Satanas' o abstraktong 'ang makapangyarihan.'
  rationale: Bagaman ipinahihiwatig ng konteksto na si Satanas ang tinutukoy, inilalahad ng Griyego ang punto sa anyong talinghaga. Hindi dapat palitan ng salin ang larawan ng interpretasyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignificado, at madaling maunawaan. Pinanatili ang konkretong talinghaga at ang sunod-sunod na lohika ng pagpasok, paggapos, at pagnanakaw. Ginamit ang 'nito' upang mabawasan ang kalituhan sa sunod-sunod na panghalip.
