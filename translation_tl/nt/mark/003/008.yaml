  to: At mula sa Jerusalem at Idumea, mula sa kabilang panig ng Jordan[a], at mula sa palibot ng Tiro at Sidon[b], lumapit sa kanya ang isang napakalaking pulutong na nakarinig tungkol sa mga ginagawa niya.[c]
