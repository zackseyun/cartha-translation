  text: καὶ ἀπὸ Ἱεροσολύμων καὶ ἀπὸ τῆς Ἰδουμαίας ⸀καὶ πέραν τοῦ Ἰορδάνου ⸁καὶ περὶ Τύρον καὶ Σιδῶνα, πλῆθος πολύ, ⸀ἀκούοντες ὅσα ⸀ἐποίει ἦλθον πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/008.yaml
  text: and from Jerusalem[a], and from Idumea, and beyond the Jordan, and around Tyre and Sidon, a great crowd, hearing what he was doing[c][b], came to him.
translation:
  language: tl
  text: At mula sa Jerusalem at Idumea, mula sa kabilang panig ng Jordan[a], at mula sa palibot ng Tiro at Sidon[b], lumapit sa kanya ang isang napakalaking pulutong na nakarinig tungkol sa mga ginagawa niya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa ibayo ng Jordan.” Ang pariralang Griyego ay maaaring tumukoy sa rehiyong nasa kabilang panig ng Ilog Jordan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mula sa palibot ng Tiro at Sidon,” na tumutukoy sa nakapaligid na rehiyon at hindi kinakailangang sa mga lungsod mismo.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “tungkol sa lahat ng ginagawa niya.” Maaaring magkaroon ng saklaw na panlahatan ang panghalip na Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ Ἱεροσολύμων
  choice: mula sa Jerusalem
  rationale: Ang ἀπό na may genitive ay nagsasaad ng pinagmulan; pinanatili ang karaniwang pangalang Jerusalem.
- source_word: ἀπὸ τῆς Ἰδουμαίας
  choice: sa Idumea
  rationale: Sa sunod-sunod na talaan, saklaw pa rin ng unang “mula” ang kasunod na mga pook; “Idumea” ang karaniwang transliterasyon ng pangalan ng rehiyon.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: sa kabilang ibayo ng Jordan
  rationale: Ipinahahayag ng πέραν ang rehiyong nasa kabila ng isang hangganan; nililinaw ng “kabilang ibayo” na ang tinutukoy ay ang lugar sa kabilang panig ng Ilog Jordan.
- source_word: περὶ Τύρον καὶ Σιδῶνα
  choice: sa mga lugar sa palibot ng Tiro at Sidon
  rationale: Ang περί na may accusative ay panlunan dito at tumutukoy sa nakapaligid na rehiyon, hindi kinakailangang sa loob mismo ng dalawang lungsod.
- source_word: πλῆθος πολύ
  choice: isang napakalaking pulutong
  rationale: Ipinapanatili ang diin sa dami habang gumagamit ng natural at dignified na modernong Filipino.
- source_word: ἀκούοντες
  choice: nang marinig nila
  rationale: Ginawang likas na sugnay sa Filipino ang participle nang hindi tahasang pinipili kung ito ay purong temporal o may pahiwatig ding sanhi.
- source_word: ὅσα ἐποίει
  choice: ang mga ginagawa niya
  rationale: Ang maramihang di-tiyak na ὅσα ay inilalarawan bilang “mga ginagawa,” at ang imperfect na ἐποίει ay pinananatiling patuloy o nagaganap na kilos.
- source_word: ἦλθον πρὸς αὐτόν
  choice: ang lumapit sa kanya
  rationale: Likas na ipinahahayag ng “lumapit sa kanya” ang pagkilos patungo sa isang tao na taglay ng πρός at accusative.
- source_word: καὶ ... καὶ ... καὶ
  choice: at ... sa ... sa ... at
  rationale: Bahagyang pinagaan ang paulit-ulit na pang-ugnay ayon sa likas na talaan sa Filipino, ngunit pinanatili ang naiipong heograpikong lawak ng pangungusap.
