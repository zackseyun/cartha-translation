translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang anyong tuloy mula sa naunang talata sa pamamagitan ng pambungad na “At,” ang heograpikong lawak ng talaan, at ang patuloy na diwa ng ginagawa ni Jesus. Inayos ang mga talababa upang tumugma ang bawat marker sa wastong parirala.
