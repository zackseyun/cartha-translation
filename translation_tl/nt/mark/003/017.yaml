id: MRK.3.17
reference: Mark 3:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ Ἰάκωβον τὸν τοῦ Ζεβεδαίου καὶ Ἰωάννην τὸν ἀδελφὸν τοῦ Ἰακώβου (καὶ ἐπέθηκεν αὐτοῖς ⸀ὀνόματα Βοανηργές, ὅ ἐστιν Υἱοὶ Βροντῆς),
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/017.yaml
  text: and James the son of Zebedee[a], and John the brother of James (he gave them the name Boanerges, which means Sons of Thunder),
translation:
  language: tl
  text: at si Santiago na anak ni Zebedeo, at si Juan na kapatid ni Santiago (binigyan niya sila ng pangalan[a] na Boanerges, na ang ibig sabihin ay “Mga Anak ng Kulog”),
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “mga pangalan” (maramihan); malamang na kolektibong gamit ito para sa iisang palayaw na ibinigay sa dalawang magkapatid.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰάκωβον
  choice: Santiago
  rationale: Ito ang nakaugaliang anyo sa modernong saling Tagalog para sa Ἰάκωβος kapag tumutukoy sa apostol; malinaw ito sa karaniwang mambabasa.
- source_word: τὸν τοῦ Ζεβεδαίου
  choice: na anak ni Zebedeo
  rationale: Likas na ipinahahayag sa Tagalog ang idyomatikong artikulo at henitibong Griyego bilang ugnayan ng ama at anak.
- source_word: Ἰωάννην
  choice: Juan
  rationale: Ito ang nakaugaliang anyo sa Tagalog ng pangalang Ἰωάννης.
- source_word: τὸν ἀδελφὸν τοῦ Ἰακώβου
  choice: na kapatid ni Santiago
  rationale: Tumutukoy dito ang ἀδελφός sa literal na magkapatid; natural at tuwiran ang saling Tagalog.
- source_word: ἐπέθηκεν αὐτοῖς ὀνόματα
  choice: binigyan niya sila ng pangalang
  rationale: Sa pagsama ng ὀνόματα, ang ἐπιτίθημι ay idyomatikong nangangahulugang magbigay o magtalaga ng pangalan. Ang isahang “pangalan” ay natural sa Tagalog para sa iisang palayaw na ibinigay sa dalawang magkapatid, habang itinatala sa talababa ang maramihang anyo sa Griyego.
- source_word: Βοανηργές
  choice: Boanerges
  rationale: Pinanatili ang transliteradong palayaw dahil kapuwa ibinibigay ng teksto ang banyagang anyo at ang kahulugan nito.
- source_word: ὅ ἐστιν
  choice: na ang ibig sabihin ay
  rationale: Malinaw at likas na pormula ito sa modernong Tagalog para sa pagpapaliwanag o pagsasalin ng isang pangalan.
- source_word: Υἱοὶ Βροντῆς
  choice: Mga Anak ng Kulog
  rationale: Tuwirang pinananatili nito ang matingkad na larawan ng palayaw at ang maramihang Υἱοί.
theological_decisions:
- issue: Paglalahad sa palayaw nina Santiago at Juan
  choice: Panatilihin ang “Boanerges” at kasunod na ipaliwanag bilang “Mga Anak ng Kulog.”
  alternative: Isalin lamang ang kahulugan at alisin ang transliteradong anyo.
  rationale: Kapuwa pinananatili ng tekstong Griyego ang Semitikong palayaw at ang paliwanag nito. Ang paglalahad sa dalawa ay tapat sa anyo ng salaysay at hindi nagdaragdag ng interpretasyong teolohikal.
- issue: Hindi tahasang pinangalanang simuno ng ἐπέθηκεν
  choice: “binigyan niya”
  alternative: “binigyan sila ni Jesus”
  rationale: Hindi tahasang inuulit ng talata ang pangalang Jesus, kaya pinananatili ng panghalip ang paraan ng orihinal at umaasa sa malinaw na konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang mga nakaugaliang pangalang Santiago, Zebedeo, at Juan. Pinanatili ang panaklong ng pinagmulan at ang bahagyang anyo ng pangungusap dahil bahagi ang talata ng nagpapatuloy na talaan.
