  yaml_path: translation/nt/mark/003/003.yaml
  text: And he says to the man with the withered hand[a], “Rise and come to the middle.”
translation:
  language: tl
  text: At sinabi niya sa lalaking may tuyot na kamay, “Tumayo ka at pumunta sa gitna.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Tumayo ka sa gitna,” o, sa mas likas na pananalita, “Lumapit ka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: sinabi niya
  rationale: Ang pangkasalukuyang anyo ay historical present na karaniwan kay Marcos. Sa natural na salaysay sa Tagalog, ang “sinabi niya” ang malinaw na katumbas nang hindi binabago ang pangyayaring inilalarawan.
- source_word: ἀνθρώπῳ
  choice: lalaki
  rationale: Isang lalaking indibidwal ang tinutukoy sa konteksto, kaya tiyak at natural ang “lalaki.”
- source_word: τὴν χεῖρα ἔχοντι ξηράν
  choice: tuyot ang kamay
  rationale: Malapit ito sa literal na larawan ng Griyego at likas na paglalarawan sa Tagalog; hindi nito tinutukoy nang lampas sa teksto ang eksaktong medikal na kondisyon.
- source_word: Ἔγειρε
  choice: Tumayo ka
  rationale: Sa kontekstong ito, ang pautos na ἐγείρω ay natural na nangangahulugang bumangon o tumayo.
- source_word: εἰς τὸ μέσον
  choice: pumunta sa gitna
  rationale: Pinananatili nito ang galaw patungo sa gitna na ipinahihiwatig ng εἰς, habang nananatiling natural sa Tagalog.
