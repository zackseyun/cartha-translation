source:
  edition: SBLGNT
  text: καὶ περιβλεψάμενος αὐτοὺς μετ’ ὀργῆς, συλλυπούμενος ἐπὶ τῇ πωρώσει τῆς καρδίας αὐτῶν, λέγει τῷ ἀνθρώπῳ· Ἔκτεινον τὴν ⸀χεῖρα· καὶ ἐξέτεινεν, καὶ ἀπεκατεστάθη ἡ χεὶρ ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/005.yaml
  text: And after looking around at them with anger[a], grieved at the hardness of their hearts, he says to the man, “Stretch out your hand.” And he stretched it out, and his hand was restored.
translation:
  language: tl
  text: Pagkatapos niya silang tingnan nang may galit, at namimighati dahil sa katigasan ng kanilang puso,[a] sinabi niya sa lalaki, “Iunat mo ang iyong kamay.” Iniunat niya ito, at naibalik sa dating ayos ang kaniyang kamay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “katigasan ng kanilang mga puso.” Isahan ang salitang “puso” sa Griyego at malamang na ginamit nang kolektibo.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: matapos niyang lingunin silang lahat
  rationale: Ipinahihiwatig ng aorist participle ang pagkilos na nauna sa pangunahing pandiwa. Natural sa Tagalog ang “matapos niyang,” at nililinaw ng “silang lahat” ang paglingon niya sa mga taong nasa paligid.
- source_word: μετ’ ὀργῆς
  choice: nang may galit
  rationale: Ipinapahayag ng μετά na may genitive ang kasamang paraan o damdamin. Tuwiran at hindi pinalalambot ng “may galit” ang ὀργή.
- source_word: συλλυπούμενος
  choice: nalulungkot
  rationale: Inilalarawan nito ang kasabay na matinding dalamhati o pagkapighati. Ang “nalulungkot” ay malinaw at natural, at pinananatiling kasabay ng galit sa kayarian ng pangungusap.
- source_word: ἐπὶ τῇ πωρώσει
  choice: dahil sa katigasan
  rationale: Ang ἐπί na may dative ay tumutukoy rito sa sanhi o batayan ng kalungkutan. Pinananatili ng “katigasan” ang metapora ng πώρωσις.
- source_word: τῆς καρδίας αὐτῶν
  choice: ng kanilang puso
  rationale: Isahan ang καρδίας ngunit maramihan ang panghalip na αὐτῶν. Pinananatili ng “kanilang puso” ang kolektibong isahan ng Griyego at nauunawaan pa rin sa Tagalog; ibinibigay sa talababa ang natural na maramihang alternatibo.
- source_word: λέγει
  choice: sinabi niya
  rationale: Historical present ito sa masiglang salaysay ni Marcos. Gayunman, mas natural at hindi nakagugulo sa modernong Tagalog ang pangnagdaang “sinabi niya” sa kontekstong ito.
- source_word: τῷ ἀνθρώπῳ
  choice: sa lalaki
  rationale: Tumutukoy ang ἄνθρωπος sa partikular na lalaking binanggit sa tagpo, kaya kongkreto at angkop ang “sa lalaki.”
- source_word: Ἔκτεινον τὴν χεῖρα
  choice: Iunat mo ang iyong kamay
  rationale: Tumpak at natural na katumbas ng ἐκτείνω ang “iunat,” at pinananatili nito ang tiyak na utos.
- source_word: ἐξέτεινεν
  choice: Iniunat niya iyon
  rationale: Inuulit nito ang pandiwa ng utos, gaya ng Griyego, samantalang ang “iyon” ay natural na tumutukoy sa kamay.
- source_word: ἀπεκατεστάθη
  choice: nanumbalik
  rationale: Ipinahihiwatig ng pasibong pandiwa ang pagbabalik ng kamay sa dati o wastong kalagayan. Mas eksakto rito ang “nanumbalik” kaysa sa pangkalahatang “gumaling.”
theological_decisions:
- issue: Ang galit at kalungkutan ni Jesus
  choice: Kapuwa tuwirang isinalin bilang “may galit” at “nalulungkot.”
  alternative: Palambutin ang galit bilang “pagkayamot” o palawakin ang kalungkutan bilang “labis na namighati.”
  rationale: Malinaw na magkasabay na inilalahad ng teksto ang dalawang damdamin. Hindi dapat alisin o palambutin ang tensiyong teolohikal at moral na nasa orihinal.
- issue: Ang kolektibong isahan na “puso”
  choice: Panatilihin sa pangunahing teksto ang “kanilang puso.”
  alternative: Gamitin ang mas idiomatikong “kanilang mga puso.”
  rationale: Isahan ang καρδία sa Griyego bagaman maramihan ang nagmamay-ari. Ang pangunahing salin ay nagpapanatili sa anyong kolektibo, habang kinikilala sa talababa ang maramihang pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at madaling maunawaan. Iniwasan ang sobrang arkaikong pananalita at ang pagpapalambot sa galit ni Jesus. Ginamit ang “kaniyang” sa huling sugnay upang malinaw ang tinutukoy, at pinanatili ang kolektibong “kanilang puso” na may talababa para sa natural na maramihang alternatibo.
