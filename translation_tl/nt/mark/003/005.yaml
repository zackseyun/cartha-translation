  to: Pagkatapos niya silang tingnan nang may galit, at namimighati dahil sa katigasan ng kanilang puso,[a] sinabi niya sa lalaki, “Iunat mo ang iyong kamay.” Iniunat niya ito, at naibalik sa dating ayos ang kaniyang kamay.
