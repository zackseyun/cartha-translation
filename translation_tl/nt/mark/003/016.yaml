  text: καὶ ⸂ἐποίησεν τοὺς δώδεκα, καὶ⸃ ἐπέθηκεν ⸂ὄνομα τῷ Σίμωνι⸃ Πέτρον,
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/016.yaml
  text: And he appointed the twelve[a], and he gave Simon the name Peter,
translation:
  language: tl
  text: At itinalaga niya ang labindalawa, at binigyan niya si Simon ng pangalang Pedro[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pangalang Pedro ay nangangahulugang “bato.”
    reason: Ipinaliliwanag ang kahulugan ng Griyegong pangalang Πέτρος, na isinalin sa pangunahing teksto bilang personal na pangalan.
lexical_decisions:
- source_word: ἐποίησεν
  choice: itinalaga
  rationale: Bagaman ang pangunahing kahulugan ng pandiwa ay “ginawa,” sa kontekstong ito ay binubuo at itinatalaga ni Jesus ang kinikilalang pangkat ng labindalawa. Ang “itinalaga” ay natural sa Filipino at hindi nagpapasok ng tiyak na katungkulan na wala sa Griyego.
- source_word: τοὺς δώδεκα
  choice: ang labindalawa
  rationale: Tuwirang tumutukoy ito sa kinikilalang pangkat ng labindalawang alagad. Pinanatili ang pangkaraniwang anyo at hindi ginawang isang teknikal na titulo sa pamamagitan ng malaking titik.
- source_word: ἐπέθηκεν ὄνομα
  choice: binigyan ... ng pangalang
  rationale: Ang idyomang Griyego ay literal na “naglagay ng pangalan.” Ang “binigyan ... ng pangalang” ay malinaw at likas na Filipino habang tahasang pinananatili ang kilos ng pagbibigay ng bagong pangalan.
- source_word: Σίμωνι
  choice: Simon
  rationale: Ginamit ang nakaugaliang anyo ng personal na pangalan sa Filipino.
- source_word: Πέτρον
  choice: Pedro
  rationale: Dahil ginagamit ito bilang personal na pangalang ibinigay kay Simon, ginamit ang nakaugaliang anyong Filipino na “Pedro” sa halip na isalin bilang “Bato.” Ipinaliwanag sa talababa ang kahulugan ng pangalan.
theological_decisions:
- issue: Ang ginawa ni Jesus sa labindalawa
  choice: itinalaga niya ang labindalawa
  alternative: ginawa niya ang labindalawa
  rationale: Ipinahihiwatig ng konteksto ang pagbuo o pagtatalaga sa kanila bilang isang kinikilalang pangkat. Iniiwasan ng “itinalaga” ang di-likas at maaaring malabong literal na “ginawa,” nang hindi nagdaragdag ng isang espesipikong katungkulang pansimbahan.
- issue: Pagpapahayag sa Πέτρον
  choice: Pedro
  alternative: Bato
  rationale: Personal na pangalan ang gamit dito, kaya pinanatili ito bilang pangalan. Nasa talababa ang kahulugang leksikal upang hindi mawala ang posibleng kabuluhan nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang panimulang “At” at ang ikalawang “at” upang katawanin ang dalawang καί ng tekstong Griyego. Ang anyong “binigyan niya si Simon ng pangalang Pedro” ay natural ngunit malapit sa tahasang idyoma ng pagbibigay ng pangalan.
