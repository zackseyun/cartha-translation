  source_fidelity: Tumpak na naipapasa ang talaan ng mga pangalan sa Griyego. Ang “Santiago na anak ni Alfeo” ay wastong paglilinaw ng τὸν τοῦ Ἁλφαίου. Ang “Simon na Cananeo” ay maingat na pinananatili ang natatanging anyo ng Marcos na Καναναῖος, nang hindi ito maling tinutumbasan sa etnikong “taga-Canaan.”
