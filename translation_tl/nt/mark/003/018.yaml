id: MRK.3.18
reference: Mark 3:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ Ἀνδρέαν καὶ Φίλιππον καὶ Βαρθολομαῖον καὶ Μαθθαῖον καὶ Θωμᾶν καὶ Ἰάκωβον τὸν τοῦ Ἁλφαίου καὶ Θαδδαῖον καὶ Σίμωνα τὸν ⸀Καναναῖον
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/018.yaml
  text: and Andrew[a], and Philip, and Bartholomew, and Matthew, and Thomas, and James the son of Alphaeus, and Thaddaeus, and Simon the Cananaean.
translation:
  language: tl
  text: at sina Andres, Felipe, Bartolome, Mateo, Tomas, Santiago na anak ni Alfeo, Tadeo, at Simon na Cananeo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Cananeo” ay malamang na nangangahulugang “Masigasig” o “Zealot,” gaya sa Lucas 6:15; hindi ito malamang na tumutukoy sa isang taong mula sa Canaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: at
  rationale: Ginamit ang karaniwang pang-ugnay na Tagalog. Pinagsama ang magkakasunod na pangalan sa isang likas na talaan sa halip na ulitin ang “at” bago sa bawat pangalan.
- source_word: Ἀνδρέαν
  choice: Andres
  rationale: Ginamit ang nakasanayang anyo ng pangalang ito sa Filipino.
- source_word: Φίλιππον
  choice: Felipe
  rationale: Ginamit ang nakasanayang anyo ng pangalang ito sa Filipino.
- source_word: Βαρθολομαῖον
  choice: Bartolome
  rationale: Ginamit ang nakasanayang anyo ng pangalang ito sa Filipino.
- source_word: Μαθθαῖον
  choice: Mateo
  rationale: Ginamit ang nakasanayang anyo ng pangalang ito sa Filipino.
- source_word: Θωμᾶν
  choice: Tomas
  rationale: Ginamit ang nakasanayang anyo ng pangalang ito sa Filipino.
- source_word: Ἰάκωβον τὸν τοῦ Ἁλφαίου
  choice: Santiago na anak ni Alfeo
  rationale: Ipinahayag ang pahiwatig na ugnayang ama at anak sa genitibong parirala; “anak ni” ang malinaw at likas na Filipino.
- source_word: Θαδδαῖον
  choice: Tadeo
  rationale: Ginamit ang nakasanayang anyo ng pangalang ito sa Filipino.
- source_word: Σίμωνα τὸν Καναναῖον
  choice: Simon na Cananeo
  rationale: Pinanatili sa pangunahing teksto ang natatanging katawagang nasa Marcos, sa halip na tahimik na palitan nito ng kahulugan mula sa parallel sa Lucas. Ipinaliliwanag sa talababa ang malamang na kahulugan at iniiwasang ipalagay na tumutukoy ito sa lahi o lugar.
theological_decisions:
- issue: Kahulugan ng katawagang Καναναῖος kay Simon
  choice: Simon na Cananeo
  alternative: Simon na Masigasig
  rationale: Malamang na ang salitang Griyego ay kumakatawan sa isang katawagang Aramaiko na nangangahulugang “masigasig” o “Zealot,” gaya ng parallel sa Lucas 6:15. Gayunman, pinananatili ng pangunahing teksto ang anyong partikular sa Marcos at inilalagay ang pagpapakahulugan sa talababa upang hindi ikubli ang pagkakaiba ng mga anyo sa mga Ebanghelyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sina” upang maging likas ang mahabang talaan ng mga pangalan, habang pinanatili ang panimulang “at” dahil karugtong ang talata ng naunang pangungusap.
