  naturalness: Ang “mga malalapit sa kanya” ay maaaring tumukoy sa pisikal na lapit; mas natural at mas malinaw ang “mga taong malapit sa kanya.” Ang “Wala siya sa kanyang katinuan” ay malinaw, makabago, at angkop na pagsasalin ng paratang nang hindi gumagamit ng mas mapanlait na termino.
  terminology: Napananatili ng “mga taong malapit sa kanya” ang kalabuan ng οἱ παρ’ αὐτοῦ. Ang “dakpin” ay angkop para sa κρατῆσαι. Ang “Wala siya sa kanyang katinuan” ay tumpak para sa ἐξέστη sa kontekstong ito.
