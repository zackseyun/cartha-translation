revisions:
- from: Nang mabalitaan ito ng mga malalapit sa kanya[a], umalis sila upang dakpin siya, sapagkat sinasabi nila, “Nawawala siya sa kanyang sarili.”[b]
  to: Nang mabalitaan ito ng mga taong malapit sa kanya[a], lumabas sila upang dakpin siya, sapagkat sinasabi nila, “Wala siya sa kanyang katinuan.”[b]
  rationale: Pinalitan ang hindi idiomatikong “Nawawala siya sa kanyang sarili” ng “Wala siya sa kanyang katinuan,” na malinaw na naghahatid ng paratang na nasa ἐξέστη nang hindi labis na pinatitindi ito. Pinalitan din ang “umalis” ng “lumabas” upang masundan ang ἐξῆλθον, at nilinaw ang pantukoy na grupo sa pamamagitan ng “mga taong malapit sa kanya” nang pinananatili ang kalabuan ng orihinal.
