base_translation:
  language: en
  yaml_path: translation/nt/mark/003/021.yaml
  text: And when those close to him heard[a], they went out to seize him, for they were saying[b], “He is out of his mind.”
translation:
  language: tl
  text: Nang mabalitaan ito ng mga taong malapit sa kanya[a], lumabas sila upang dakpin siya, sapagkat sinasabi nila, “Wala siya sa kanyang katinuan.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kanyang pamilya” o “kanyang mga kasamahan.” Idyomatiko ang pananalitang Griyego at maaaring tumukoy sa mga kabilang sa sambahayan o malapit na pangkat ni Jesus.
    reason: alternative_reading
  - marker: b
    text: O “Wala siya sa sarili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ παρ’ αὐτοῦ
  choice: mga malalapit sa kanya
  rationale: Idyomatiko at bahagyang malabo ang parirala; maaari itong tumukoy sa kanyang pamilya, mga kasambahay, o malapit na mga kasama. Pinananatili ng salin ang lawak nito nang hindi tahasang tinutukoy na pamilya lamang.
- source_word: ἀκούσαντες
  choice: Nang mabalitaan ito
  rationale: Ang aorist participle ay natural na ipinapahayag bilang pangyayaring nauna sa kanilang pag-alis. Ang “ito” ay tumutukoy sa kalagayang isinalaysay sa konteksto, hindi lamang sa isang tunog na kanilang narinig.
- source_word: ἐξῆλθον
  choice: umalis sila
  rationale: Ipinahahayag ang pagkilos nila mula sa kinaroroonan nila patungo kay Jesus. Mas natural ito sa Filipino kaysa sa literal na “lumabas sila” kapag hindi tahasang binabanggit ang pinanggalingang lugar.
- source_word: κρατῆσαι
  choice: upang dakpin siya
  rationale: Ipinananatili ang malakas na diwa ng pisikal na paghawak o pagsunggab, nang hindi ipinapalagay na isa itong legal na pag-aresto.
- source_word: ἔλεγον
  choice: sinasabi nila
  rationale: Pinananatili ng aspektong imperpektibo ang patuloy o paulit-ulit na pagsasabi, sa halip na isang minsanang pahayag lamang.
- source_word: ἐξέστη
  choice: Nawawala siya sa kanyang sarili
  rationale: Ipinahahayag ang paratang na wala siya sa wastong pag-iisip, habang iniiwasan ang mas klinikal at mas matinding “baliw siya.”
theological_decisions:
- issue: Pagkakakilanlan ng οἱ παρ’ αὐτοῦ
  choice: mga malalapit sa kanya
  alternative: kanyang pamilya / kanyang mga kasamahan
  rationale: Bagaman malamang na tumutukoy ito sa pamilya ni Jesus ayon sa mas malawak na konteksto, hindi tuwirang katawagang pampamilya ang Griyego. Kaya pinananatili sa pangunahing teksto ang tunay na kalabuan at inilalagay sa talababa ang mas tiyak na mga posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga malalapit sa kanya” upang mapanatili ang kalabuan ng orihinal, at “dakpin” upang maipakita ang puwersa ng κρατέω nang hindi ito gawing legal na pag-aresto.
