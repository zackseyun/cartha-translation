base_translation:
  language: en
  yaml_path: translation/nt/mark/011/014.yaml
  text: And answering[a], he said to it[c][b], “May no one ever eat fruit from you again.” And his disciples were listening.
translation:
  language: tl
  text: At bilang tugon, sinabi niya sa puno[a], “Nawa’y wala nang sinumang kumain kailanman ng bunga mula sa iyo.”[b] At narinig ito ng kaniyang mga alagad.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “At sumagot siya at sinabi niya sa puno.” Ang “sumagot” ay karaniwang idyomang pasalaysay sa Griyego kahit walang naunang pananalitang tahasang nakatala.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring, “Nawa’y wala nang sinumang kumain ng bunga mula sa iyo magpakailanman.” Sa Griyego, literal na “sa/tungo sa kapanahunan.”
    reason: alternative_reading
  - marker: c
    text: Maaari ring, ayon sa diwa ng imperfect, “At nakikinig ang kaniyang mga alagad.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: bilang tugon
  rationale: Pinananatili nito ang karaniwang Griyegong idyomang nangangahulugang sumagot o tumugon, kahit walang naunang pananalitang tahasang nakatala, habang nananatiling natural sa modernong Tagalog.
- source_word: αὐτῇ
  choice: rito
  rationale: Ang panghalip ay tumutukoy sa puno ng igos. Ang “rito” ay natural sa Tagalog at hindi nag-aangkat ng gramatikal na kasariang pambabae ng salitang Griyego.
- source_word: Μηκέτι
  choice: wala nang
  rationale: Ipinapahayag nito ang diwang “hindi na” o “wala na mula ngayon,” na akma sa mariing pahayag laban sa puno.
- source_word: εἰς τὸν αἰῶνα
  choice: kailanman
  rationale: Ang idyomang literal na “hanggang sa kapanahunan” ay nangangahulugang magpakailanman o kailanman; sa negatibong pangungusap, natural ang “kailanman.”
- source_word: ἐκ σοῦ
  choice: mula sa iyo
  rationale: Pinananatili ang tuwirang pakikipag-usap ni Jesus sa puno sa ikalawang panauhan.
- source_word: μηδεὶς
  choice: sinuman
  rationale: Malinaw at karaniwang katumbas ito ng negatibong di-tiyak na paksa sa pariralang “wala nang sinuman.”
- source_word: καρπὸν
  choice: bunga
  rationale: Ang “bunga” ang likas na salitang Tagalog para sa bunga ng puno at nagpapahayag ng pangkalahatang diwa ng isahang pangngalang Griyego.
- source_word: φάγοι
  choice: Nawa’y ... kumain
  rationale: Ang aorist optative ay nagpapahayag ng hangarin o sumpang binibigkas, hindi lamang ng payak na prediksiyon. Ang “Nawa’y” angkop na naghahatid ng puwersang ito.
- source_word: ἤκουον
  choice: naririnig
  rationale: Ipinahihiwatig ng imperfect ang nagpapatuloy na pagdinig. Ang “naririnig” ay nagpapanatili ng aspektong ito nang hindi tiyak na ipinapalagay na sinasadya nilang makinig.
- source_word: μαθηταὶ αὐτοῦ
  choice: kaniyang mga alagad
  rationale: Natural at malinaw na katumbas ng pariralang paari sa Griyego.
theological_decisions:
- issue: Kalikasan ng pahayag ni Jesus sa puno ng igos
  choice: 'Isinalin bilang pahayag ng hangarin o sumpa: “Nawa’y wala nang sinumang kumain kailanman ng bunga mula sa iyo.”'
  alternative: 'Isalin bilang payak na prediksiyon: “Wala nang sinumang kakain kailanman ng bunga mula sa iyo.”'
  rationale: Ang optative na φάγοι ay may puwersang naghahangad o nagpapahayag ng sumpa, hindi simpleng future indicative. Pinananatili ng salin ang anyo ng paghatol nang hindi dinaragdagan ang paliwanag nito.
translation_notes:
  register: Gumamit ng moderno, malinaw, at marangal na Tagalog. Pinanatili ang bahagyang pormal na himig ng pasalaysay na “bilang tugon,” ang tuwirang pagtukoy sa puno bilang “ikaw,” at ang puwersang optative sa pamamagitan ng “Nawa’y.”
