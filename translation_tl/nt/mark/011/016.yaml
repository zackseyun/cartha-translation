  text: And he would not allow anyone to carry a vessel through the temple courts[a][b].
translation:
  language: tl
  text: At hindi niya pinahintulutang may sinumang magdaan sa bakuran ng templo[a] habang may dalang anumang bagay[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa nasasakupan ng templo.” Ang salitang Griyego ay tumutukoy sa buong lugar ng templo, hindi lamang sa santuwaryo sa loob.
    reason: lexical_alternative
  - marker: b
    text: O “isang sisidlan” o “isang kagamitan.” Malawak ang kahulugan ng salitang Griyego at hindi nito tinutukoy kung anong uri ng bagay iyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤφιεν
  choice: hindi niya pinahintulutan
  rationale: Ang imperpektong anyo ay naglalarawan ng patuloy o paulit-ulit na pagpigil; sa Filipino, natural na naipahihiwatig ito ng konteksto sa pariralang “hindi niya pinahintulutan.”
- source_word: ἵνα τις διενέγκῃ
  choice: may magdala
  rationale: Pagkatapos ng pandiwang ἤφιεν, ang ἵνα na may pasakaling pandiwa ay nagsasaad ng gawaing hindi niya pinayagang mangyari. Likas sa Filipino ang hulma na “pinahintulutang may magdala.”
- source_word: διενέγκῃ
  choice: magdala ... sa
  rationale: Sa kontekstong ito, nangangahulugan ang pandiwa ng pagdadala o pagtatawid ng isang bagay sa isang lugar. Ipinahihiwatig ng “sa bakuran ng templo” ang pagdaan dito bilang ruta.
- source_word: σκεῦος
  choice: anumang bagay
  rationale: Malawak ang saklaw ng σκεῦος at maaaring tumukoy sa bagay, sisidlan, o kagamitan. Hindi tinutukoy ng teksto ang uri nito, kaya iniiwasan ng salin ang labis na pagtitiyak.
- source_word: διὰ τοῦ ἱεροῦ
  choice: sa bakuran ng templo
  rationale: Ang ἱερόν ay tumutukoy sa malawak na templo at mga bakuran nito, hindi lamang sa santuwaryo sa loob. Ang “bakuran ng templo” ay malinaw at natural sa modernong Filipino.
theological_decisions:
- issue: Saklaw ng ἱερόν kaugnay ng templo sa Jerusalem
  choice: bakuran ng templo
  alternative: looban ng templo; buong lugar ng templo
  rationale: Pinananatili nitong malinaw na ang tinutukoy ay ang malawak na lugar ng templo at hindi ang mismong santuwaryo. Hindi nito ipinapalagay na pumasok ang mga nagdadala sa banal na gusali sa loob.
translation_notes:
  register: Gumamit ng natural, makabago, at marangal na Filipino. Ang “anumang bagay” ay madaling maunawaan at pinananatili ang lawak ng σκεῦος; ipinaliliwanag sa talababa ang mas kongkretong mga posibilidad. Ang dalawang talababa ay kapuwa may katumbas na marker sa pangunahing teksto.
