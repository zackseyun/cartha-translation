id: MRK.11.25
reference: Mark 11:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ὅταν ⸀στήκετε προσευχόμενοι, ἀφίετε εἴ τι ἔχετε κατά τινος, ἵνα καὶ ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς ἀφῇ ὑμῖν τὰ παραπτώματα ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/025.yaml
  text: And whenever you stand praying[a], forgive, if you have anything against anyone[b], so that your Father who is in the heavens may also forgive you your trespasses.
translation:
  language: tl
  text: At tuwing nakatayo kayong nananalangin, magpatawad kayo kung mayroon kayong anumang hinanakit sa sinuman, upang patawarin din kayo ng inyong Ama na nasa langit[a] sa inyong mga paglabag[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, literal na “nasa mga langit” (maramihan).
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga pagkakasala” o “mga kasalanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: στήκετε προσευχόμενοι
  choice: nakatayo kayong nananalangin
  rationale: Pinananatili ang kongkretong tindig na ‘nakatayo’ at ang kasabay na kilos ng pananalangin, sa halip na gawing pangkalahatang ‘kapag nananalangin kayo.’
- source_word: ἀφίετε
  choice: magpatawad kayo
  rationale: Ang anyong pautos at maramihan ay malinaw na naipapahayag ng ‘magpatawad kayo’; ang pagpapatawad ang likas na kahulugan sa ugnayang pantao sa kontekstong ito.
- source_word: εἴ τι ἔχετε κατά τινος
  choice: kung mayroon kayong anumang hinanakit sa sinuman
  rationale: Likas sa modernong Tagalog ang ‘hinanakit sa sinuman’ para sa pagkakaroon ng anumang laban o sama ng loob sa isang tao, habang pinananatili ng ‘anumang’ at ‘sinuman’ ang malawak at di-tiyak na saklaw ng Griyego.
- source_word: ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς
  choice: inyong Ama na nasa langit
  rationale: Ang ‘nasa langit’ ang natural at karaniwang anyo sa Tagalog; inilalahad sa talababa na maramihan ang literal na anyo ng οὐρανοῖς.
- source_word: ἀφῇ ὑμῖν
  choice: patawarin din kayo
  rationale: Pinananatili ng ‘din’ ang καί at ng ‘upang patawarin’ ang layunin o resultang ipinahihiwatig ng ἵνα kasama ng pasakaling pandiwa.
- source_word: παραπτώματα
  choice: mga paglabag
  rationale: Ang ‘mga paglabag’ ay malinaw na tumutukoy sa mga pagkakasalang nagawa at hindi agad ipinapantay ang παράπτωμα sa mas pangkalahatang katawagang ‘kasalanan.’
theological_decisions:
- issue: Ugnayan ng pagpapatawad sa kapwa at pagpapatawad ng Diyos
  choice: Tuwirang pinanatili ang ‘upang patawarin din kayo,’ na nag-uugnay sa utos na magpatawad at sa pagpapatawad ng Ama.
  alternative: Palambutin ang ugnayan bilang patunay lamang na napatawad na ang tao, o gawing simpleng bunga na walang kondisyunal na bigat.
  rationale: Ang ἵνα ... ἀφῇ ay tahasang naglalahad ng layunin o resultang kaugnay ng pagpapatawad sa iba. Hindi nilulutas ng salin ang teolohikal na tensiyon sa pamamagitan ng paliwanag na wala sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Pinanatili ang kongkretong larawan ng pagtayo habang nananalangin, ngunit gumamit ng likas na pariralang Tagalog sa pagtukoy sa hinanakit at sa Ama na nasa langit.
