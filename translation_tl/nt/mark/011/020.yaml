  text: Καὶ ⸂παραπορευόμενοι πρωῒ⸃ εἶδον τὴν συκῆν ἐξηραμμένην ἐκ ῥιζῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/020.yaml
  text: And as they were passing by early in the morning[a], they saw the fig tree withered from the roots.
translation:
  language: tl
  text: Kinabukasan, maaga pa, habang dumaraan sila, nakita nila ang puno ng igos na natuyo mula sa mga ugat nito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραπορευόμενοι
  choice: habang dumaraan sila
  rationale: Ipinahahayag ng kasalukuyang participle ang kilos na kasabay at nagsisilbing tagpuan ng pangunahing pandiwang “nakita”; natural itong mabasa sa makabagong Tagalog.
- source_word: πρωῒ
  choice: Kinaumagahan
  rationale: Sa konteksto ng salaysay, tumutukoy ito sa maagang bahagi ng sumunod na umaga. Likas sa Tagalog ang “kinaumagahan” at malinaw ang pagkakasunod-sunod ng pangyayari.
- source_word: εἶδον
  choice: nakita nila
  rationale: Tuwiran at hindi mapagpakahulugang salin ng pandiwa ng pandama.
- source_word: συκῆν
  choice: puno ng igos
  rationale: Karaniwan at malinaw na katawagan sa Tagalog para sa fig tree.
- source_word: ἐξηραμμένην
  choice: natuyo
  rationale: Inilalarawan ng perfect passive participle ang kalagayang bunga ng naunang pangyayari. Ang “natuyo” ay natural para sa puno at hindi nagdaragdag ng sanhi.
- source_word: ἐκ ῥιζῶν
  choice: mula sa mga ugat nito
  rationale: Pinananatili ang larawan na ang pagkatuyo ay mula sa ugat o umabot mula roon; ang “nito” ay likas na panandang tumutukoy sa puno.
theological_decisions: []
translation_notes:
  register: Makabago, payak, at marangal na Tagalog. Ginamit ang ayos na “Kinaumagahan, habang…” upang maging natural ang daloy habang pinananatili ang sabayang kilos ng participle at ang diin sa oras.
