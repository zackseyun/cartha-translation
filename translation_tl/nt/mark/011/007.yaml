  yaml_path: translation/nt/mark/011/007.yaml
  text: And they brought the colt to Jesus, and they threw their cloaks on it, and he sat on it.
translation:
  language: tl
  text: Dinala nila kay Jesus ang batang asno, at ipinatong nila sa ibabaw nito ang kanilang mga balabal; pagkatapos, naupo siya sa ibabaw nito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πῶλον
  choice: batang asno
  rationale: Bagaman ang πῶλος ay maaaring tumukoy sa batang hayop, nililinaw ng konteksto ng salaysay na ito na batang asno ang tinutukoy.
- source_word: ἐπιβάλλουσιν
  choice: ipinatong
  rationale: Likas sa Filipino at tumpak sa kilos ng paglalagay ng mga balabal sa ibabaw ng hayop; hindi kailangang idiin ang paghagis.
- source_word: ἱμάτια
  choice: mga balabal
  rationale: Tumutukoy sa panlabas na kasuotang inilatag sa batang asno bilang pansamantalang sapin.
- source_word: ἐκάθισεν ἐπ’ αὐτόν
  choice: naupo siya rito
  rationale: Pinananatili ang payak na pahayag na umupo si Jesus sa batang asno, habang ang 'rito' ay natural na tumutukoy sa hayop.
