  source_fidelity: 'Tapat ang salin sa Griyego: naipapahayag ng “Pinagpala” ang εὐλογημένη, ng “dumarating na kaharian” ang ἡ ἐρχομένη βασιλεία, at ng “ating amang si David” ang marangal na ugnayang ninuno sa τοῦ πατρὸς ἡμῶν Δαυίδ. Ang “Hosanna sa kataas-taasan” ay angkop na katumbas ng Ὡσαννὰ ἐν τοῖς ὑψίστοις nang hindi dinaragdagan ang tinutukoy na langit o pook.'
