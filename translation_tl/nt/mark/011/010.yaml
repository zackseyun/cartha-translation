  text: Εὐλογημένη ἡ ἐρχομένη ⸀βασιλεία τοῦ πατρὸς ἡμῶν Δαυίδ· Ὡσαννὰ ἐν τοῖς ὑψίστοις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/010.yaml
  text: Blessed is the coming kingdom of our father David! Hosanna in the highest![a]
translation:
  language: tl
  text: Pinagpala ang dumarating na kaharian ng ating amang si David! Hosanna sa kataas-taasan![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Hosanna” ay maaari ring magpahiwatig ng pakiusap na “Iligtas mo kami, nakikiusap kami” o “Iligtas mo kami ngayon,” bagaman dito ay ginagamit ito bilang liturhikal na sigaw ng pagpupuri.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογημένη
  choice: Pinagpala
  rationale: Ang pang-uring panaguri ay bahagi ng isang liturhikal na pagbubunyi. Pinananatili ng “Pinagpala” ang pormang kahawig ng pagpapahayag ng pagpapala at mas angkop dito kaysa sa “Purihin.”
- source_word: ἡ ἐρχομένη βασιλεία
  choice: ang dumarating na kaharian
  rationale: Likas sa Tagalog ang ayos na ito para sa artikulo, kasalukuyang participle, at pangngalan. Ipinahihiwatig ng “dumarating” ang nagpapatuloy o nalalapit na pagdating nang hindi ito ginagawang isang nakapirming teknikal na pariralang eskatolohikal.
- source_word: βασιλεία
  choice: kaharian
  rationale: Ang “kaharian” ay malinaw at natural sa kontekstong dinastiko ni David. Maaaring ipakahulugan ang salita bilang paghahari o pamamahala, ngunit hindi kailangang paliitin sa abstraktong diwa ang pagbubunyi ng mga tao.
- source_word: τοῦ πατρὸς ἡμῶν Δαυίδ
  choice: ng ating amang si David
  rationale: Pinananatili nito ang paggalang kay David bilang ninuno habang gumagamit ng natural na makabagong ayos sa Tagalog.
- source_word: Ὡσαννὰ
  choice: Hosanna
  rationale: Sa gamit ng Bagong Tipan, isa itong nakaugaliang liturhikal na sigaw, kaya pinanatili ang transliterasyon sa pangunahing teksto. Ipinaliliwanag sa talababa ang saligang pakiusap nito para sa pagliligtas.
- source_word: ἐν τοῖς ὑψίστοις
  choice: sa kataas-taasan
  rationale: Ito ang maikli at liturhikal na katumbas ng idyoma, na malamang tumutukoy sa pinakamataas na dako o kalangitan, nang hindi nagdaragdag ng paliwanag sa mismong talata.
theological_decisions:
- issue: Katangian ng pagbubunyi sa kaharian ni David
  choice: Tuwirang isinalin bilang pagpapala sa dumarating na kahariang kaugnay ni David.
  alternative: “Pinagpala ang dumarating na mesiyanikong kaharian ng ating amang si David!”
  rationale: Malakas ang mesiyanikong pahiwatig ng konteksto, ngunit hindi tahasang ginagamit ng Griyego ang salitang “mesiyaniko.” Pinananatili ng salin ang pahiwatig at teolohikal na tensiyon nang hindi nagdaragdag ng paliwanag sa pangunahing teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang liturhikal na tunog ng pagbubunyi at ang tradisyonal na “Hosanna,” habang iniwasan ang labis na teknikal o denominasyonal na pananalita.
