  text: And Jesus answered them[a], “Have faith in God.”
translation:
  language: tl
  text: At sumagot si Jesus sa kanila, “Manampalataya kayo sa Diyos[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “Magkaroon kayo ng pananampalataya ng Diyos.” Ang “ng Diyos” ay maaari ring unawain bilang tumutukoy sa pananampalataya o katapatan ng Diyos, o sa pananampalatayang mula sa Diyos.
    reason: Pinananatili ang ambiguwidad ng genitive sa pariralang πίστιν θεοῦ.
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang payak na pang-ugnay na nagdurugtong sa tugon ni Jesus sa naunang pangyayari.
- source_word: ἀποκριθεὶς … λέγει
  choice: sumagot
  rationale: Bagaman participle at historical present ang anyo sa Griyego, likas sa salaysay na Filipino ang isang pandiwang nasa aspektong perpektibo. Sapat na ipinahahayag ng “sumagot” ang tungkulin ng dalawang anyo nang hindi nagiging mabigat ang pangungusap.
- source_word: Ἔχετε
  choice: Magkaroon kayo ng
  rationale: Tuwirang ipinahahayag nito ang pautos na “have” at ang maramihang kausap. Hindi idinagdag sa pangunahing teksto ang interpretatibong diin na “panatilihin.”
- source_word: πίστιν
  choice: pananampalataya
  rationale: Ito ang malinaw, marangal, at karaniwang katumbas ng πίστις sa kontekstong panrelihiyon; hindi nito agad pinipili ang kahulugang “katapatan.”
- source_word: θεοῦ
  choice: sa Diyos
  rationale: 'Pinili sa pangunahing teksto ang obhektibong pagkaunawa sa genitive: pananampalatayang nakatuon sa Diyos. Ang tunay na ambiguwidad ng pariralang Griyego ay pinanatili sa talababa.'
theological_decisions:
- issue: Malabong gamit ng genitive sa πίστιν θεοῦ
  choice: “pananampalataya sa Diyos”
  alternative: “pananampalataya ng Diyos,” “katapatan ng Diyos,” o “pananampalatayang mula sa Diyos”
  rationale: Sa kasunod na pagtuturo tungkol sa pananalig at panalangin, pinakaangkop sa konteksto ang panawagang manampalataya sa Diyos. Gayunman, maaaring ipakahulugan sa iba’t ibang paraan ang genitive sa Griyego, kaya hindi inalis ang ibang posibilidad kundi inilagay ang mga ito sa talababa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “Magkaroon kayo ng pananampalataya” sa halip na ang mas kolokyal na “Manalig kayo” upang mapanatili ang anyong pangngalan ng πίστιν at maging malinaw ang usaping saklaw ng talababa.
