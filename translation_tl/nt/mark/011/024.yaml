  text: διὰ τοῦτο λέγω ὑμῖν, πάντα ὅσα ⸂προσεύχεσθε καὶ αἰτεῖσθε⸃, πιστεύετε ὅτι ⸀ἐλάβετε, καὶ ἔσται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/024.yaml
  text: For this reason I tell you[a], whatever you pray and ask for, believe that you have received it[b], and it will be yours.
translation:
  language: tl
  text: 'Kaya sinasabi ko sa inyo: Anuman ang hingin ninyo sa panalangin, maniwala kayong natanggap na ninyo iyon[a], at mapapasainyo iyon.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: May ilang manuskrito o pagbasa na maaaring unawain o isalin na “natatanggap ninyo iyon” sa halip na “natanggap na ninyo iyon.” Ang tekstong Griyego na sinusunod dito ay may diwang natapos na ang pagtanggap.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Kaya
  rationale: Likas at malinaw na pang-ugnay sa modernong Tagalog na ipinakikitang bunga o konklusyon ito ng naunang turo tungkol sa pananampalataya.
- source_word: λέγω ὑμῖν
  choice: sinasabi ko sa inyo
  rationale: Pinananatili ang tuwirang personal at may-awtoridad na pananalita ni Jesus.
- source_word: πάντα ὅσα
  choice: Anuman
  rationale: Natural na Tagalog na naghahayag ng malawak at di-tiyak na saklaw ng lahat ng hinihingi.
- source_word: προσεύχεσθε καὶ αἰτεῖσθε
  choice: hingin ninyo sa panalangin
  rationale: 'Likas sa Tagalog at pinananatili ang dalawang sangkap: ang paghingi at ang konteksto ng pananalangin, nang hindi lumilikha ng alanganing pariralang ''ipanalangin at hingin.'''
- source_word: πιστεύετε
  choice: maniwala kayo
  rationale: Direktang utos na angkop sa kasunod na sugnay na nagsasaad ng nilalaman ng paniniwala.
- source_word: ὅτι ἐλάβετε
  choice: kayong natanggap na ninyo iyon
  rationale: Ang 'natanggap na' ay nagpapanatili sa kapansin-pansing diwang ganap ng aorist at sa tensiyon nito sa kasunod na panghinaharap.
- source_word: καὶ ἔσται ὑμῖν
  choice: at mapapasainyo iyon
  rationale: Natural at dignified na Tagalog para sa magiging pag-aari o matatanggap ng mga kausap; pinananatili ang panghinaharap na diwa.
theological_decisions:
- issue: Ang ugnayang pamanahon ng pananampalataya at tugon sa panalangin
  choice: natanggap na ninyo iyon, at mapapasainyo iyon
  alternative: natatanggap ninyo iyon, at mapapasainyo iyon
  rationale: Ang SBLGNT ay may ἐλάβετε, isang aorist, kaya pinananatili ang paradoksal na pagkakasunod ng natanggap na at magiging kanila. Hindi ito pinadadali o ipinapaliwanag ayon sa isang partikular na doktrina tungkol sa panalangin.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang 'hingin ninyo sa panalangin' upang maipahayag nang idiomatiko ang parehong προσεύχεσθε at αἰτεῖσθε. Iniwasan ang sobrang literal na ayos na magiging alanganin sa karaniwang mambabasa, ngunit pinanatili ang mahalagang tensiyong pamanahon ng talata.
