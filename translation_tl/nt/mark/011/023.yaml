  source_fidelity: Kailangang palitan ang “Mabunot ka,” sapagkat ang Ἄρθητι ay pasibong pautos na “maiangat” o “maitaas,” hindi “mabunot.” Ang iba pang mahahalagang elemento—ang pangkalahatang kondisyon, pag-aalinlangan sa puso, kasalukuyang aspekto ng γίνεται, at bukas na resulta ng ἔσται αὐτῷ—ay napapanatili sa rebisyon.
  naturalness: Ang rebisyong “Maiangat ka at maitapon sa dagat” ay malinaw, natural, at pinananatili ang magkatambal na pasibong utos. Ang “naniniwalang nangyayari ang sinasabi niya” ay mas maayos na pagkakaugnay sa pangungusap kaysa “maniwalang nangyayari.”
  terminology: Ginamit ang “bundok,” “mag-alinlangan,” at “puso” bilang tapat at likas na katumbas. Ang “Tinitiyak ko sa inyo” ay modernong Filipino na naghahatid ng mariing pormulang ἀμὴν λέγω ὑμῖν nang hindi nagiging arkaiko.
  issues:
