  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀ἀμὴν λέγω ὑμῖν ὅτι ὃς ἂν εἴπῃ τῷ ὄρει τούτῳ· Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν, καὶ μὴ διακριθῇ ἐν τῇ καρδίᾳ αὐτοῦ ἀλλὰ ⸀πιστεύῃ ὅτι ⸂ὃ λαλεῖ γίνεται, ἔσται αὐτῷ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/023.yaml
  text: Truly I tell you[a], whoever says to this mountain, ‘Be lifted up and be thrown into the sea,’ and does not doubt in his heart but believes that what he says is happening[b], it will be so for him.
translation:
  language: tl
  text: 'Tinitiyak ko sa inyo: ang sinumang magsabi sa bundok na ito, ‘Maiangat ka at maitapon sa dagat,’ at hindi mag-alinlangan sa kanyang puso[a], kundi naniniwalang nangyayari ang sinasabi niya[b], mangyayari iyon para sa kanya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi mag-urong-sulong” o “hindi mahati ang kanyang kalooban.” Maaaring tumukoy ang pandiwang Griyego sa panloob na pagkakahati gayundin sa pag-aalinlangan.
    reason: lexical_alternative
  - marker: b
    text: O “na nagkakatotoo ang sinasabi niya.” Kasalukuyang panahunan ang ginamit sa Griyego bago ang sugnay na nagsasaad ng magiging resulta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Tunay na sinasabi ko sa inyo
  rationale: Pinananatili nito ang mariing pormula ng pagpapahayag ni Jesus sa natural at marangal na modernong Tagalog.
- source_word: ὃς ἂν εἴπῃ
  choice: Ang sinumang magsabi
  rationale: Ipinahahayag ng parirala ang pangkalahatang kondisyong tumutukoy sa sinumang gagawa nito.
- source_word: τῷ ὄρει τούτῳ
  choice: sa bundok na ito
  rationale: Tuwirang pinananatili ang ὄρος at ang demonstratibong τούτῳ.
- source_word: Ἄρθητι
  choice: Mabunot ka
  rationale: Sa larawan ng isang bundok na inaalis sa kinalalagyan nito, natural na ipinahahayag ng 'mabunot' ang pasibong pag-alis habang nananatiling kongkreto ang larawan.
- source_word: βλήθητι εἰς τὴν θάλασσαν
  choice: maitapon sa dagat
  rationale: Pinananatili ang pasibong pautos at ang matingkad na larawan ng paghahagis sa dagat.
- source_word: μὴ διακριθῇ ἐν τῇ καρδίᾳ αὐτοῦ
  choice: hindi mag-alinlangan sa kanyang puso
  rationale: Ang 'mag-alinlangan' ang malinaw na kahulugan sa konteksto, samantalang pinananatili ng 'sa kanyang puso' ang biblikal na larawan ng panloob na pagkatao.
- source_word: πιστεύῃ
  choice: maniwala
  rationale: Karaniwang katumbas ito ng πιστεύω at angkop sa tuwirang paghahambing sa pag-aalinlangan.
- source_word: ὅτι ὃ λαλεῖ γίνεται
  choice: na nangyayari ang sinasabi niya
  rationale: Pinananatili ang kasalukuyang panahunan ng γίνεται sa halip na tahimik na gawing tahasang hinaharap.
- source_word: ἔσται αὐτῷ
  choice: mangyayari iyon para sa kanya
  rationale: Ipinahahayag ang magiging resulta para sa nagsasalita nang hindi dinaragdagan ang mekanismo ng katuparan.
theological_decisions:
- issue: Saklaw ng pangako tungkol sa pananampalataya
  choice: Isinalin nang tuwiran ang kondisyong pangako at pinanatili ang matinding larawan ng bundok.
  alternative: Ituring lamang itong tayutay, o gawing ganap at walang anumang kontekstuwal na hangganang pangako.
  rationale: Hindi mismong nililinaw ng talata ang lahat ng sistematikong kondisyon; kaya hindi ito pinalambot o pinalawak ng salin.
- issue: Panlalaking isahan sa αὐτοῦ at αὐτῷ
  choice: kanyang / kanya
  alternative: kanilang / kanila
  rationale: Pinananatili ang isahang anyo ng Griyego; sa Tagalog, hindi naman tinutukoy ng mga panghalip na ito ang kasarian.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang 'mabunot' bilang natural at kongkretong utos sa isang bundok; iniwasan ang mas arkaikong 'maparam.' Ang mga panandang talababa [a] at [b] ay kapwa nasa pangunahing teksto.
