    rationale: Ang “mabunot” ay nangangahulugang maalis na parang may ugat at nagdaragdag ng larawang wala sa αἴρω. Ang Griyego ay tumutukoy sa pag-angat/pagkakatanggal ng bundok bago ito ihagis sa dagat.
  - severity: low
    issue: Mahina ang pagkakaugnay ng “kundi maniwalang nangyayari”
    rationale: Mas likas sa modernong Tagalog ang pangkasalukuyang anyong “kundi naniniwalang nangyayari,” habang napapanatili ang kasalukuyang aspekto ng γίνεται.
  - severity: low
