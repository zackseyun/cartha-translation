  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ οἱ προάγοντες καὶ οἱ ἀκολουθοῦντες ⸀ἔκραζον· Ὡσαννά· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/009.yaml
  text: And those going ahead and those following were crying out[b][a], “Hosanna! Blessed is the one who comes in the name of the Lord!”
translation:
  language: tl
  text: At ang mga nauuna at ang mga sumusunod ay patuloy na sumisigaw:[a] “Hosanna![b] Pinagpala ang dumarating sa pangalan ng Panginoon!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang sigaw na ito ay umaalingawngaw sa Awit 118:26.
    reason: cross_reference
  - marker: b
    text: Ang “Hosanna” ay isang liturhikal na sigaw mula sa Hebreo/Aramaiko na ang kahulugan ay humigit-kumulang “iligtas mo kami, pakiusap” o “iligtas mo kami ngayon”; dito, ginagamit din ito bilang sigaw ng papuri.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ προάγοντες
  choice: ang mga nauuna
  rationale: Likas na salin ng substantival na present participle para sa mga nasa unahan ng prusisyon, habang pinananatili ang nagpapatuloy na kilos.
- source_word: οἱ ἀκολουθοῦντες
  choice: ang mga sumusunod
  rationale: Pinananatili ang kaagapay na participial na anyo at malinaw na tumutukoy sa mga taong nasa likuran at sumusunod.
- source_word: ἔκραζον
  choice: ay patuloy na sumisigaw
  rationale: Ipinahahayag ng imperfect ang nagpapatuloy o paulit-ulit na pagsigaw; malinaw at natural ito sa modernong Tagalog.
- source_word: Ὡσαννά
  choice: Hosanna
  rationale: Pinananatili ang kinikilalang liturhikal na sigaw at ang kaugnayan nito sa Kasulatan; ipinaliliwanag sa talababa ang ugat na kahulugang pakiusap para sa pagliligtas.
- source_word: Εὐλογημένος
  choice: Pinagpala
  rationale: Tumpak at nakaugaliang salin ng passive participle sa pormulang pagpapala, at pinananatili ang alusyon sa Awit 118:26.
- source_word: ὁ ἐρχόμενος
  choice: ang dumarating
  rationale: Natural na substantival na pananalita sa Tagalog na hindi nagdaragdag ng tahasang titulong Mesiyas o hari.
- source_word: ἐν ὀνόματι κυρίου
  choice: sa pangalan ng Panginoon
  rationale: Pinananatili ang biblikal na idyoma at ang alusyon sa Awit, kasama ang diwang pagparito sa awtoridad o bilang kinatawan ng Panginoon.
- source_word: κυρίου
  choice: Panginoon
  rationale: Karaniwang marangal na salin ng κύριος sa kontekstong biblikal; ang malaking titik ay angkop sa pagtukoy sa Diyos sa sipi mula sa Awit.
theological_decisions:
- issue: Kung tahasang tatawaging Mesiyas o hari ang dumarating
  choice: Panatilihin ang “Pinagpala ang dumarating sa pangalan ng Panginoon” nang walang idinagdag na titulo.
  alternative: “Pinagpala ang Mesiyas na dumarating sa pangalan ng Panginoon” o “Pinagpala ang Haring dumarating.”
  rationale: May mesiyanikong bigat ang sigaw sa konteksto, ngunit walang tahasang titulong “Mesiyas” o “hari” sa tekstong Griyego ng talatang ito. Pinananatili ng salin ang alusyon at teolohikal na tensiyon nang walang interpretatibong dagdag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “patuloy na sumisigaw” upang maipakita ang aspektong duratibo ng imperfect. Ang ayos ng mga talababa ay inilagay ayon sa puntong tinutukoy ng bawat paliwanag.
