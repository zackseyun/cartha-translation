translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Ginamit ang “balabal” para sa panlabas na kasuotan at “mga sangang may dahon” upang maipakita ang malawak na diwa ng στιβάδας nang hindi inaangkat ang espesipikong palma mula sa Juan.
