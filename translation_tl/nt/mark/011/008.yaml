translation:
  language: tl
  text: Marami ang naglatag ng kanilang mga balabal sa daan, at ang iba naman ay naglatag ng mga sangang may dahon[a] na pinutol mula sa mga bukid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga sanga” o “tinipong mga dahon.” Malawak ang kahulugan ng salitang Griyego at hindi nito partikular na sinasabing mga sanga ng palma ang mga ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: Marami
  rationale: Tuwirang ipinapahayag ang dami nang hindi nagdaragdag ng diin na wala sa Griyego.
- source_word: ἱμάτια
  choice: mga balabal
  rationale: Sa tagpong ito, tumutukoy ito sa mga panlabas na kasuotang inilatag sa daan; mas tiyak at likas ang “mga balabal” kaysa sa pangkalahatang “mga damit.”
- source_word: ἔστρωσαν
  choice: naglatag
  rationale: Likas na Tagalog para sa paglalagay at pagkalat ng mga balabal sa ibabaw ng daan; ang pandiwa ay ipinahiwatig muli sa ikalawang sugnay para sa kalinawan.
- source_word: εἰς τὴν ὁδόν
  choice: sa daan
  rationale: Sa konstruksiyong ito, ang diwa ay paglalagay sa ibabaw ng daan; malinaw at natural ang “sa daan.”
- source_word: ἄλλοι δὲ
  choice: at ang iba naman
  rationale: Ipinapakita ang banayad na pagdaragdag at paghahambing ng δέ nang hindi ito ginagawang matinding pagsalungat.
- source_word: στιβάδας
  choice: mga sangang may dahon
  rationale: Ang salita ay maaaring tumukoy sa tinipong dahon, mga sanga, o ginupit na pananim na inilalatag. Ipinahihiwatig ng salin ang mga pinutol na halamang may dahon ngunit hindi ipinapasok ang espesipikong “palma” mula sa ibang salaysay.
- source_word: κόψαντες
  choice: na pinutol nila
  rationale: Natural na ipinapahayag sa Tagalog ang kilos na nauna sa paglalatag, habang pinananatiling hayag na ang mga tao ang pumutol.
- source_word: ἐκ τῶν ἀγρῶν
  choice: sa bukirin
  rationale: Direktang tumutukoy sa mga bukid o lupang bukas na pinanggalingan ng mga pinutol na halaman.
