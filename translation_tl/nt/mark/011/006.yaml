  source_fidelity: Ang “kaya” ay nagdaragdag ng hayag na ugnayang resulta na wala sa simpleng καί (“at”). Ang “pinahintulutan silang umalis” ay maaari ring magpahiwatig na aktuwal silang umalis, samantalang ang ἀφῆκαν αὐτούς dito ay nagsasaad na hindi na sila hinarangan ng mga naroon. Ang binagong salin ay pinananatili ang dalawang pangyayaring magkaugnay nang hindi nagdaragdag ng diwa.
  naturalness: Natural at malinaw sa modernong Filipino ang “Sinabi nila sa mga iyon ayon sa sinabi ni Jesus” at “hinayaan na sila ng mga iyon.” Ang pag-uulit ng “mga iyon” ay nakatutulong upang malinaw ang pagbabago ng tinutukoy na grupo.
  terminology: Ang “Jesus,” “mga alagad,” at “bisirong asno” ay angkop at pare-pareho sa karaniwang modernong Filipino na rehistro. Ang “hinayaan” ay angkop na kontekstuwal na salin ng ἀφίημι at hindi nagpapahiwatig ng pag-alis bilang isang hiwalay na ipinahayag na pangyayari.
