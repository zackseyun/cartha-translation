  yaml_path: translation/nt/mark/011/006.yaml
  text: And they said to them just as Jesus had said[a], and they let them go.
translation:
  language: tl
  text: At sinabi nila sa mga iyon ayon sa sinabi ni Jesus, at hinayaan na sila ng mga iyon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinayagan sila” o “pinalaya sila.” Ang pandiwang Griyego ay maaaring mangahulugang magpahintulot, magpalaya, o hayaang umalis; dito, tumutukoy ito sa mga naroon na hindi na pumigil sa mga alagad na kunin ang bisirong asno.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: At ... nila
  rationale: Ang artikulo ay ginagamit bilang panghalip at tumutukoy sa mga alagad; ang δέ ay isinaling “At” upang mapanatili ang payak na daloy ng salaysay.
- source_word: εἶπαν αὐτοῖς
  choice: sinabi nila sa mga iyon
  rationale: Tuwirang ipinapahayag nito ang karaniwang diwa ng λέγω at nililinaw na ang mga alagad ang nagsalita sa mga nakatayo roon.
- source_word: καθὼς εἶπεν ὁ Ἰησοῦς
  choice: ang mismong sinabi ni Jesus
  rationale: Natural sa modernong Tagalog ang pariralang ito at ipinapakita ang pagtutugma ng tugon ng mga alagad sa naunang bilin ni Jesus.
- source_word: καὶ ἀφῆκαν αὐτούς
  choice: kaya pinahintulutan silang umalis
  rationale: Sa konteksto, tumigil ang mga naroon sa pagpigil sa mga alagad. Ang “pinahintulutan” ay malinaw na naghahatid ng kontekstuwal na diwa ng ἀφίημι, habang ang “umalis” ay tumutukoy sa pag-alis nila kasama ang bisirong asno.
theological_decisions: []
translation_notes:
  register: Gumamit ng natural, kasalukuyan, at marangal na Filipino. Ang “mismong sinabi” ay nagpapanatili sa diin ng καθώς sa eksaktong pagsunod sa bilin, at ang “pinahintulutan silang umalis” ay mas malinaw sa Tagalog kaysa sa literal ngunit posibleng malabong “hinayaan sila.”
