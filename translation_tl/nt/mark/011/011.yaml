  text: Καὶ εἰσῆλθεν εἰς ⸀Ἱεροσόλυμα εἰς τὸ ἱερόν· καὶ περιβλεψάμενος πάντα ⸀ὀψὲ ἤδη οὔσης τῆς ὥρας ἐξῆλθεν εἰς Βηθανίαν μετὰ τῶν δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/011.yaml
  text: And he entered Jerusalem[a], into the temple courts; and after looking around at everything, since it was already late[c][b], he went out to Bethany with the twelve.
translation:
  language: tl
  text: Pumasok siya sa Jerusalem, sa templo.[a] Pagkatapos niyang tingnan ang lahat sa paligid, umalis siya patungong Betania kasama ng labindalawa,[c] yamang huli na ang oras.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay tumutukoy sa buong nasasakupan ng templo, kabilang ang mga looban nito, hindi lamang sa panloob na santuwaryo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “nang huli na ang oras” o “dahil hapon na.”
    reason: lexical_alternative
  - marker: c
    text: Ibig sabihin, ang labindalawang alagad ni Jesus.
    reason: referent_clarification
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: Pumasok siya
  rationale: Tuwirang ipinapahayag ng aorist na εἰσέρχομαι ang pagpasok. Likas sa makabagong Tagalog ang “pumasok siya” at napapanatili nito ang kilos ng salaysay.
- source_word: Ἱεροσόλυμα
  choice: Jerusalem
  rationale: Ito ang karaniwang anyo ng pangalan ng lungsod sa Filipino.
- source_word: τὸ ἱερόν
  choice: templo
  rationale: Likas at madaling maunawaan ang “templo.” Nililinaw ng talababa na ang ἱερόν ay tumutukoy sa buong nasasakupan ng templo, hindi lamang sa panloob na santuwaryo.
- source_word: περιβλεψάμενος πάντα
  choice: Pagkatapos niyang tingnan ang lahat sa paligid
  rationale: Ipinahihiwatig ng participle ang masusing pagtingin sa palibot at ang pagkakasunod ng kilos. Pinananatili ng “lahat” ang lawak ng πάντα nang hindi nagdaragdag ng tiyak na mga bagay.
- source_word: ὀψὲ ἤδη οὔσης τῆς ὥρας
  choice: dahil huli na ang oras
  rationale: Inihahatid nito ang temporal at posibleng sanhiing diwa ng genitive absolute habang iniiwasang gawing mas tiyak ang oras bilang “gabi” o “dapit-hapon.”
- source_word: ἐξῆλθεν εἰς Βηθανίαν
  choice: lumabas siya at pumunta sa Betania
  rationale: Pinananatili ng “lumabas” ang direksiyonal na diwa ng ἐξέρχομαι, samantalang malinaw na ipinapahayag ng “pumunta sa Betania” ang patutunguhan.
- source_word: μετὰ τῶν δώδεκα
  choice: kasama ang labindalawa
  rationale: Tapat ito sa bilang na nasa Griyego at hindi ito ginagawang pormal na titulo; nililinaw sa talababa kung sino ang tinutukoy.
theological_decisions:
- issue: Saklaw ng τὸ ἱερόν
  choice: templo, na may talababa tungkol sa buong nasasakupan nito
  alternative: mga looban ng templo / nasasakupan ng templo
  rationale: Ang ἱερόν ay tumutukoy sa mas malawak na temple complex at hindi lamang sa panloob na santuwaryo (ναός). Pinananatili sa teksto ang natural na salitang “templo” habang nililinaw sa talababa ang mahalagang pagkakaibang ito.
- issue: Kaugnayan ng ὀψὲ ἤδη οὔσης τῆς ὥρας sa pag-alis
  choice: dahil huli na ang oras
  alternative: nang huli na ang oras / sapagkat gabi na
  rationale: Maaaring maghatid ang parirala ng kalagayang temporal na may sanhiing pahiwatig. Pinananatili ng “dahil” ang malamang na dahilan ng pag-alis, samantalang ang talababa ay nagtatala ng mas temporal na pagbasa.
- issue: Pagkakakilanlan ng οἱ δώδεκα
  choice: ang labindalawa, na may paliwanag sa talababa
  alternative: ang Labindalawa / ang labindalawang alagad
  rationale: Numero lamang ang tahasang nasa Griyego. Hindi idinaragdag sa pangunahing teksto ang “alagad,” ngunit nililinaw sa talababa ang tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang payak na ayos ng salaysay at mga karaniwang salitang “templo,” “tingnan,” at “lumabas,” habang inilagay sa mga talababa ang kinakailangang leksikal at reperensiyal na paglilinaw.
