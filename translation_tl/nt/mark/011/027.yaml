  text: Καὶ ἔρχονται πάλιν εἰς Ἱεροσόλυμα. καὶ ἐν τῷ ἱερῷ περιπατοῦντος αὐτοῦ ἔρχονται πρὸς αὐτὸν οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς καὶ οἱ πρεσβύτεροι
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/027.yaml
  text: And they came again to Jerusalem. And as he was walking in the temple courts[a], the chief priests and the scribes and the elders came to him.
translation:
  language: tl
  text: Muli silang dumating sa Jerusalem. Habang naglalakad si Jesus sa mga looban ng templo[a], lumapit sa kanya ang mga punong pari, mga eskriba, at mga nakatatanda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa templo” o “sa nasasakupan ng templo.” Ang salitang Griyego ay tumutukoy sa mas malawak na kabuuan ng templo, hindi lamang sa panloob na santuwaryo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: dumating
  rationale: Makasaysayang pangkasalukuyan ang anyong Griyego; ginamit ang pangnagdaan upang maging likas ang daloy ng salaysay sa Tagalog.
- source_word: πάλιν
  choice: muli
  rationale: Malinaw nitong ipinahihiwatig ang pag-ulit ng pagdating nila sa Jerusalem.
- source_word: Ἱεροσόλυμα
  choice: Jerusalem
  rationale: Karaniwang anyo ng pangalan ng lugar sa makabagong Filipino.
- source_word: ἐν τῷ ἱερῷ
  choice: sa mga looban ng templo
  rationale: Ang ἱερόν ay tumutukoy sa mas malawak na bakuran o kabuuang nasasakupan ng templo, hindi lamang sa santuwaryo sa loob.
- source_word: περιπατοῦντος αὐτοῦ
  choice: Habang naglalakad si Jesus
  rationale: Ipinapakita ng genitive absolute ang nagpapatuloy na kilos na nagsisilbing tagpuan. Nilinaw ang tinutukoy ng panghalip upang maging natural sa Tagalog.
- source_word: ἀρχιερεῖς
  choice: mga punong pari
  rationale: Tumutukoy ang maramihang anyo sa mga pangunahing pinunong makapari, hindi sa maraming kasalukuyang mataas na pari.
- source_word: γραμματεῖς
  choice: mga tagapagturo ng Kautusan
  rationale: Sa kontekstong ito, mas malinaw sa karaniwang mambabasang Filipino kaysa sa literal ngunit maaaring malabong “mga eskriba,” habang ipinahahayag ang kinikilalang tungkulin nila bilang mga dalubhasa at guro ng Kautusan.
- source_word: πρεσβύτεροι
  choice: mga pinuno ng bayan
  rationale: 'Institusyonal ang kahulugan dito: mga kinikilalang pinuno ng pamayanan, hindi lamang matatandang lalaki.'
- source_word: πρὸς αὐτόν
  choice: lumapit sa kanya
  rationale: Likas na ipinahahayag sa Tagalog ang pagkilos patungo kay Jesus.
theological_decisions:
- issue: Saklaw ng ἱερόν
  choice: mga looban ng templo
  alternative: templo; nasasakupan ng templo
  rationale: Iniiwasan nitong ipahiwatig na nasa panloob na santuwaryo si Jesus at pinananatili ang mas malawak na lokasyong tinutukoy ng Griyego.
- issue: Pagkilala sa mga πρεσβύτεροι
  choice: mga pinuno ng bayan
  alternative: mga nakatatanda
  rationale: Ipinakikita ng konteksto na kabilang sila sa kinikilalang pamunuan. Hindi nito dinaragdagan ang teksto ng isang tiyak na denominasyonal o doktrinal na pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “si Jesus” sa halip na isang malayong panghalip upang maiwasan ang kalabuan sa Tagalog. Ginamit ang “mga looban ng templo” bilang madaling maunawaang paglalarawan sa pampublikong bahagi ng malawak na kompleks ng templo.
