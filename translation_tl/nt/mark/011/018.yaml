  source_fidelity: 'Tumpak na naihahatid ng draft ang mga pangunahing elemento ng Griyego: ang mga punong pari at eskriba ay nakarinig/nabalitaan nito, patuloy silang naghahanap ng paraan laban kay Jesus, natatakot sila sa kanya, at ang buong karamihan ay namamangha sa kanyang pagtuturo. Gayunman, ang “lilipulin” ay madaling magpahiwatig ng ganap na pagpuksa o pagkalipol at mas mabigat kaysa sa saklaw ng ἀπολέσωσιν sa anyong Filipino. Ang “mapuksa” ay mas malapit sa ‘destroy’ habang hindi inaalis ang ipinahihiwatig na nakamamatay na layunin ng konteksto.'
  naturalness: Ang “hinahanap ang paraan kung paano” ay paulit-ulit sa modernong Filipino. Mas natural ang “naghahanap ng paraan upang …” Pinananatili ng “patuloy silang naghahanap” ang diwang imperfect ng ἐζήτουν.
  terminology: Ang “mga punong pari,” “mga eskriba,” “buong karamihan,” at “pagtuturo” ay angkop sa marangal ngunit modernong rehistro. Ang “mapuksa” ay mas angkop kaysa “lilipulin” para sa ἀπολέσωσιν; inilalahad ng talababa ang mas tiyak na ‘papatayin’ o ‘ipapapatay’ bilang mga alternatibong pagsasalin ayon sa konteksto.
