  text: καὶ ἤκουσαν οἱ ⸂ἀρχιερεῖς καὶ οἱ γραμματεῖς⸃, καὶ ἐζήτουν πῶς αὐτὸν ἀπολέσωσιν· ἐφοβοῦντο γὰρ αὐτόν, ⸂πᾶς γὰρ⸃ ὁ ὄχλος ἐξεπλήσσετο ἐπὶ τῇ διδαχῇ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/018.yaml
  text: And the chief priests and the scribes heard it[a], and they were seeking how they might destroy him, for they feared him, because the whole crowd was astonished at his teaching.
translation:
  language: tl
  text: Narinig ito ng mga punong pari at mga eskriba, at patuloy silang naghahanap ng paraan upang siya ay mapuksa[a]. Natatakot sila sa kanya, sapagkat namamangha ang buong karamihan sa kanyang pagtuturo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “papatayin” o “ipapapatay.” Mas malawak ang kahulugan ng pandiwang Griyego at maaari itong mangahulugang “puksain” o “sirain,” bagaman ipinahihiwatig ng konteksto ang balak na kitilin ang kanyang buhay.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσαν
  choice: Narinig ito
  rationale: Ang pandiwa ay maaaring mangahulugang ‘narinig’ o ‘nabalitaan.’ Idinagdag ang ‘ito’ bilang likas na pantukoy sa naunang ginawa at sinabi ni Jesus sa templo, nang hindi nililimitahan ang tinutukoy.
- source_word: ἀρχιερεῖς
  choice: mga punong pari
  rationale: Karaniwang tawag ito sa pangkat ng mga pangunahing pinunong pari sa Jerusalem at hindi nagpapahiwatig na sabay-sabay na maraming may iisang katungkulan ng pinakapunong pari.
- source_word: γραμματεῖς
  choice: mga eskriba
  rationale: Pinananatili nito ang makasaysayang katawagan sa uring dalubhasa sa mga kasulatan at Kautusan, nang hindi pinakikitid ang termino sa iisang tungkulin lamang.
- source_word: ἐζήτουν
  choice: patuloy nilang hinahanap ang paraan
  rationale: Ipinahahayag ng aspektong imperfect ang nagpapatuloy o paulit-ulit na pagsisikap na makahanap ng paraan.
- source_word: ἀπολέσωσιν
  choice: lilipulin
  rationale: Sinasalamin ng ‘lilipulin’ ang mas malawak na diwa ng ἀπόλλυμι na ‘sirain’ o ‘puksain,’ habang sa konteksto ay malinaw na maaaring tumukoy sa pagpatay.
- source_word: ἐφοβοῦντο
  choice: Natatakot sila sa kanya
  rationale: Natural na Filipino ito para sa nagpapatuloy na takot ng mga pinuno kay Jesus at sa impluwensiya niya.
- source_word: πᾶς ὁ ὄχλος
  choice: ang buong karamihan
  rationale: 'Pinananatili ang kolektibo at mariing saklaw ng parirala: ang karamihan sa kabuuan ang inilalarawang namamangha.'
- source_word: ἐξεπλήσσετο
  choice: namamangha
  rationale: Ipinahahayag nito ang matinding at nagpapatuloy na pagkagulat at paghanga ng karamihan nang hindi nagiging labis ang pagpapakahulugan.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: sa kanyang pagtuturo
  rationale: Likas na ipinahahayag sa Filipino ang sanhi o batayan ng pagkamangha.
theological_decisions:
- issue: Saklaw ng layunin ng mga pinuno sa ἀπολέσωσιν
  choice: lilipulin
  alternative: papatayin / ipapapatay
  rationale: Bagaman ipinahihiwatig ng konteksto ang balak na kitilin ang buhay ni Jesus, mas malawak ang mismong pandiwang Griyego. Pinananatili ng pangunahing teksto ang lawak na iyon, at inilalahad sa talababa ang mas tiyak na kahulugang malamang na ipinahihiwatig ng konteksto.
translation_notes:
  register: Modernong Filipino na marangal at tuwiran. Ginamit ang makasaysayang terminong “mga eskriba,” na karaniwan sa salin-Biblia, at iniwasan ang mas makitid na pagpapakahulugang “mga tagapagturo ng Kautusan.”
