  text: καὶ ⸀ἔλεγον αὐτῷ· Ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς; ⸀ἢ τίς σοι ⸂ἔδωκεν τὴν ἐξουσίαν ταύτην⸃ ἵνα ταῦτα ποιῇς;
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/028.yaml
  text: And they were saying to him[b][a], “By what authority are you doing these things? Or who gave you this authority to do these things?”
translation:
  language: tl
  text: At tinatanong nila siya, “Sa anong awtoridad mo ginagawa ang mga bagay na ito? O sino ang nagbigay sa iyo ng awtoridad na ito upang gawin ang mga ito?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: tinatanong nila
  rationale: Ang imperpektong aspekto ay inilalarawang nagaganap ang pagtatanong; ang “tinatanong” ay natural sa Filipino dahil mga tanong ang mismong sinasabi nila.
- source_word: Ἐν ποίᾳ ἐξουσίᾳ
  choice: Sa anong awtoridad
  rationale: Ipinahahayag nito ang batayan o saklaw ng karapatang kumilos, habang pinananatili ang pangunahing salitang “awtoridad.”
- source_word: ἐξουσίᾳ / ἐξουσίαν
  choice: awtoridad
  rationale: Sa konteksto, tumutukoy ito sa lehitimong karapatan o kapahintulutang kumilos, hindi lamang sa lakas o kakayahan.
- source_word: ταῦτα
  choice: ang mga bagay na ito / mga ito
  rationale: Pinananatili ang maramihang anyo at ang malawak na pagtukoy sa mga ginawa ni Jesus kamakailan.
- source_word: τίς σοι ἔδωκεν
  choice: sino ang nagbigay sa iyo
  rationale: Natural na payak na nagdaang anyo ito para sa aorist na ἔδωκεν.
- source_word: ἵνα ταῦτα ποιῇς
  choice: upang gawin ang mga ito
  rationale: Ang “upang” ay malinaw at likas na nagpapahayag ng layunin o nilalayong bunga ng ibinigay na awtoridad.
theological_decisions:
- issue: Pinagmulan ng awtoridad ni Jesus
  choice: Inilalahad nang neutral ang hamon ng mga pinuno tungkol sa awtoridad ni Jesus.
  alternative: Tahasang tukuyin itong awtoridad mula sa Diyos.
  rationale: Hindi pa sinasagot ng talata ang tanong; hindi dapat ipasok sa salin ang isang pinagmulan na ipinahihiwatig lamang ng mas malawak na konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang “awtoridad” sa dalawang tanong upang maipakita ang sadyang pag-uulit at malapit na ugnayan ng mga ito.
