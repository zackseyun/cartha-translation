base_translation:
  language: en
  yaml_path: translation/nt/mark/011/030.yaml
  text: Was John's baptism from heaven or from men? Answer me[a][b].
translation:
  language: tl
  text: Ang bautismo ni Juan—mula ba iyon sa langit[a] o mula sa mga tao[b]? Sagutin ninyo ako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa Diyos.” Ang literal na Griyego ay “mula sa langit,” isang idyomang Judio na tumutukoy sa banal na pinagmulan o awtoridad.
    reason: lexical_alternative
  - marker: b
    text: Ang “mula sa mga tao” ay nangangahulugang mula sa mga tao lamang, samakatuwid, pantaong pinagmulan o awtoridad.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ βάπτισμα τὸ Ἰωάννου
  choice: ang bautismo ni Juan
  rationale: Natural sa modernong Tagalog ang pariralang ito at malinaw na tumutukoy sa bautismong kaugnay ni Juan, habang pinananatili ang ayos at diwa ng Griyego.
- source_word: ἐξ οὐρανοῦ
  choice: mula sa langit
  rationale: Pinananatili nito ang mismong idyomang Griyego at ang pahiwatig ng banal na pinagmulan o awtoridad nang hindi tahasang pinapalitan ng “mula sa Diyos.”
- source_word: ἐξ ἀνθρώπων
  choice: mula sa mga tao
  rationale: Ang ἄνθρωποι ay tumutukoy sa mga tao sa pangkalahatan, hindi lamang sa mga lalaki. Malinaw nitong ipinapakita ang kaibahan ng pantaong pinagmulan o awtoridad sa “mula sa langit.”
- source_word: ἀποκρίθητέ μοι
  choice: Sagutin ninyo ako
  rationale: Ang pautos na anyo ay humihingi ng tuwiran at agarang tugon. Ang maramihang “ninyo” ay angkop dahil kausap ni Jesus ang isang pangkat.
- source_word: ἦν ἢ
  choice: mula ba iyon ... o mula ...?
  rationale: Natural sa Tagalog ang tanong na may “ba” at panghalip na “iyon,” habang nananatiling malinaw na pinagmulan o awtoridad ang pinagtatalunan.
theological_decisions:
- issue: Kahulugan ng “mula sa langit” sa tanong ni Jesus
  choice: Panatilihin sa pangunahing teksto ang idyomang “mula sa langit.”
  alternative: mula sa Diyos
  rationale: Ang “langit” ay magalang na paraang Judio ng pagtukoy sa Diyos at sa banal na pinagmulan o awtoridad. Ang pagpapanatili sa idyoma ay hindi nagsasara sa pahiwatig nito sa pamamagitan ng tahasang pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “mga tao” sa halip na “mga lalaki” upang tumpak na maipahayag ang pangkalahatang saklaw ng ἀνθρώπων. Ang gitling na pahaba ay tumutulong na ihiwalay ang paksa bago ang dalawang magkatunggaling sagot.
