  to: At sinabi niya sa kanila, “Pumunta kayo sa nayong nasa tapat ninyo. Pagpasok na pagpasok ninyo roon, makakakita kayo ng isang batang asno[a] na nakatali, na hindi pa nasasakyan ng sinumang tao.[b] Kalagan ninyo ito at dalhin ninyo rito.”
