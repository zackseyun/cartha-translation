id: MRK.11.2
reference: Mark 11:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Ὑπάγετε εἰς τὴν κώμην τὴν κατέναντι ὑμῶν, καὶ ⸀εὐθὺς εἰσπορευόμενοι εἰς αὐτὴν εὑρήσετε πῶλον δεδεμένον ἐφ’ ὃν οὐδεὶς ⸀οὔπω ἀνθρώπων ⸀ἐκάθισεν· ⸂λύσατε αὐτὸν καὶ φέρετε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/002.yaml
  text: And he says to them[a], “Go into the village opposite you, and as soon as you enter it, you will find a colt tied there, on which no one has yet sat[b]. Untie it and bring it.”
translation:
  language: tl
  text: At sinabi niya sa kanila, “Pumunta kayo sa nayong nasa tapat ninyo. Pagpasok na pagpasok ninyo roon, makakakita kayo ng isang batang asno[a] na nakatali, na hindi pa nasasakyan ng sinumang tao.[b] Kalagan ninyo ito at dalhin ninyo rito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “isang batang hayop.” Ang Griyegong πῶλον ay maaaring tumukoy sa isang batang hayop; sa kontekstong ito, tumutukoy ito sa batang asno na sasakyan ni Jesus.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “na hindi pa nauupuan ng sinumang tao.” Tahasang sinasabi ng Griyego na wala pang taong nakasakay rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑπάγετε
  choice: Pumunta kayo
  rationale: Likas at tuwirang pautos sa makabagong Tagalog na nagpapahayag ng pagkilos patungo sa nayon.
- source_word: κώμην
  choice: nayon
  rationale: Karaniwang tumutukoy ang κώμη sa isang nayon, hindi sa isang lungsod.
- source_word: τὴν κατέναντι ὑμῶν
  choice: nasa tapat ninyo
  rationale: Malinaw at natural na inilalarawan ang nayong kaharap o katapat ng kinaroroonan ng mga alagad.
- source_word: εὐθὺς εἰσπορευόμενοι εἰς αὐτὴν
  choice: Pagpasok na pagpasok ninyo roon
  rationale: Ipinahahayag ng idyomang Tagalog ang agarang pangyayari kaugnay ng pagpasok sa nayon.
- source_word: εὑρήσετε
  choice: makakakita kayo
  rationale: Natural na anyong panghinaharap para sa tiyak na matatagpuan o makikita nila.
- source_word: πῶλον
  choice: bisiro
  rationale: Pinananatili ang leksikal na saklaw ng πῶλον bilang batang hayop nang hindi tahasang itinatakda sa pangunahing teksto ang uri nito; nililinaw sa talababa ang kontekstuwal na posibilidad na batang asno.
- source_word: δεδεμένον
  choice: nakataling
  rationale: Ipinapakita ang umiiral na kalagayan ng bisiro bilang nakatali.
- source_word: οὐδεὶς οὔπω ἀνθρώπων ἐκάθισεν
  choice: hindi pa nasasakyan ng sinumang tao
  rationale: Natural sa Tagalog at pinananatili ang tahasang pagtukoy ng ἀνθρώπων sa tao, habang ang “hindi pa” ay tumpak sa οὔπω.
- source_word: λύσατε
  choice: Kalagan ninyo
  rationale: Ang “kalagan” ay angkop sa pag-aalis ng tali sa isang hayop.
- source_word: φέρετε
  choice: dalhin ninyo rito
  rationale: Natural na katumbas ng “bring” sa Tagalog; ang “rito” ay nagpapahayag ng direksiyong pabalik sa nagsasalita na likas na nakapaloob sa konteksto.
