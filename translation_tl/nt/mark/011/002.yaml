translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “pagpasok na pagpasok” upang likas na maipahayag ang agarang temporal na ugnayan, at pinanatili ang “sinumang tao” upang huwag mawala ang tahasang ἀνθρώπων.
