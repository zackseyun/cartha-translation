  verdict: revise
  source_fidelity: Ang “bisiro” ay karaniwang tumutukoy sa batang baka o toro sa modernong Filipino Tagalog, kaya mali o hindi bababa sa lubhang nakalilitong pantumbas ito ng πῶλον sa kontekstong ito. Mas ligtas at tumpak ang “batang asno,” habang kinikilala sa talababa ang mas malawak na leksikal na saklaw ng Griyego. Napananatili ng iba pang bahagi ang utos, agarang pagkatagpo, pagiging nakatali, at ang “hindi pa” ng οὔπω.
  naturalness: Natural ang “Pumunta kayo,” “nayong nasa tapat ninyo,” at “Pagpasok na pagpasok ninyo roon.” Ang “hindi pa nasasakyan ng sinumang tao” ay malinaw at likas. Ang binagong “batang asno” ay mas karaniwan at mas madaling maunawaan kaysa “bisiro.”
  terminology: Ginamit ang “batang asno” para sa hayop na tinutukoy sa agarang konteksto. Hindi idinagdag ang anumang doktrinal na paliwanag. Ang talababa ay nagpapaliwanag lamang ng leksikal na posibilidad ng πῶλον at ng tahasang pantao na saklaw ng ἀνθρώπων.
