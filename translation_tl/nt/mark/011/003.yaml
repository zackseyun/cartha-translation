base_translation:
  language: en
  yaml_path: translation/nt/mark/011/003.yaml
  text: And if anyone says to you[a], ‘Why are you doing this?’ say[b], ‘The Lord has need of it,’ and he will send it back here immediately.
translation:
  language: tl
  text: At kung may magsabi sa inyo, “Bakit ninyo ginagawa iyan?” sabihin ninyo, “Kailangan ito ng Panginoon[a],” at ibabalik niya ito agad dito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “amo.” Ang Griyegong κύριος ay maaaring mangahulugang “panginoon” o “amo”; dito ay isinalin itong “Panginoon” ayon sa konteksto ng Ebanghelyo.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: kung may magsabi sa inyo
  rationale: Pinananatili nito ang bukás na kondisyon ng ἐάν kasama ng subjunctive at natural itong pakinggan sa modernong Tagalog.
- source_word: Τί ποιεῖτε τοῦτο;
  choice: Bakit ninyo ginagawa iyan?
  rationale: Sa konteksto, ang τί ay hamon o pagtatanong sa dahilan ng kilos, kaya mas natural ang “Bakit” kaysa sa literal ngunit alanganing “Ano.” Ang “iyan” ay angkop sa kilos na nakikita ng nagtatanong.
- source_word: εἴπατε
  choice: sabihin ninyo
  rationale: Tuwirang isinasalin ang aorist imperative plural at malinaw na maramihan ang inuutusan.
- source_word: Ὁ κύριος
  choice: ang Panginoon
  rationale: Pinananatili ang karaniwang pamagat para sa κύριος sa konteksto ng Ebanghelyo, habang kinikilala sa talababa ang posibleng karaniwang kahulugang “amo.”
- source_word: αὐτοῦ χρείαν ἔχει
  choice: Kailangan ito
  rationale: Natural at malinaw sa Tagalog; ang “ito” ay tumutukoy sa batang asno sa naunang talata. Hindi kailangang gayahin ang mas pormal na idyomang Griyego na “may pangangailangan dito.”
- source_word: εὐθὺς
  choice: agad
  rationale: Maikli at natural na katumbas na nagpapanatili sa agarang diwa na katangian ng salaysay ni Marcos.
- source_word: ἀποστέλλει
  choice: ibabalik
  rationale: Bagaman nasa present tense ang anyong Griyego, ang konteksto ay tumutukoy sa kasunod na gagawin; ipinapahayag ito nang natural sa Tagalog sa aspektong kontemplatibo.
- source_word: πάλιν ὧδε
  choice: dito
  rationale: Kasama ng “ibabalik,” nakapaloob na sa pandiwa ang diwa ng πάλιν na “pabalik,” at ang ὧδε ay malinaw na “dito.”
theological_decisions:
- issue: Ang tinutukoy at puwersa ng κύριος
  choice: Isinalin bilang “Panginoon,” na tumutukoy kay Jesus bilang may awtoridad.
  alternative: “amo,” sa karaniwang diwa ng isang may-ari o nakatataas
  rationale: Sa konteksto ng Ebanghelyo ni Marcos, si Jesus ang nagbibigay ng tagubilin at natural na mabasa ang κύριος bilang pamagat. Hindi naman itinatago ang leksikal na alternatibo, kaya inilagay ito sa talababa nang hindi nagdaragdag ng doktrinang wala sa mismong teksto.
- issue: Panahunan ng ἀποστέλλει
  choice: 'Isinalin sa aspektong hinaharap: “ibabalik.”'
  alternative: “ibinabalik” o “ipinababalik,” bilang mas pormal na pagtulad sa present tense ng Griyego
  rationale: Maaaring vivid o futuristic present ang ἀποστέλλει. Sa daloy ng utos, ang kilos ay inaasahang mangyayari matapos ibigay ang sagot, kaya “ibabalik” ang pinakamalinaw na Tagalog, habang itinatala sa talababa ang anyong present ng Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignificado, at angkop sa pagbasa nang malakas. Ginamit ang “ninyo” upang panatilihin ang maramihang kausap. Iniwasan ang sobrang literal na balangkas na magiging mabigat sa Tagalog, ngunit pinanatili sa mga talababa ang tunay na leksikal at aspektuwal na mga alternatibo.
