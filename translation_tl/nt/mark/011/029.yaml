review_pass:
  verdict: revise
  source_fidelity: Tumpak na naihahatid ng salin ang tugon ni Jesus, ang isang tanong na ihaharap niya, ang utos na sumagot sila, at ang pangako niyang sabihin kung sa anong awtoridad niya ginagawa ang mga bagay na ito. Ang “awtoridad” ay wastong katumbas ng ἐξουσία sa kontekstong ito.
  naturalness: Natural at angkop ang pangunahing pangungusap sa modernong Filipino. Gayunman, mas karaniwan at mas maayos ang ayos na “sinabi ni Jesus sa kanila” kaysa “sinabi sa kanila ni Jesus.”
  terminology: 'Ang “Jesus,” “Sagutin ninyo ako,” at “awtoridad” ay malinaw, marangal, at angkop sa rehistro. Kailangang itugma nang mas eksakto ang unang talababa sa aktuwal na salin: ang “isang tanong” ay nasa pangunahing teksto na, kaya hindi ito dapat ilahad bilang alternatibo.'
  issues:
  - severity: low
    issue: Hindi eksaktong tumutugma ang talababa a sa pangunahing salin.
    rationale: Ang pangunahing teksto ay gumagamit na ng diwang “isang tanong” sa “May isa akong itatanong,” ngunit inililista pa ito ng talababa bilang alternatibo. Mas mabuting ilahad lamang ang leksikal na mga alternatibong “isang usapin” at, mas literal, “isang salita.”
  - severity: low
    issue: Medyo di-karaniwan ang ayos ng salita sa pambungad na sugnay.
    rationale: Bagaman tama ang “Ngunit sinabi sa kanila ni Jesus,” mas natural sa modernong Filipino ang “Ngunit sinabi ni Jesus sa kanila.”
