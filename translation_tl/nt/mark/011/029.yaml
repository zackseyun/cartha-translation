  text: ὁ δὲ ⸀Ἰησοῦς εἶπεν αὐτοῖς· Ἐπερωτήσω ⸀ὑμᾶς ἕνα λόγον, καὶ ἀποκρίθητέ μοι, καὶ ἐρῶ ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/029.yaml
  text: But Jesus said to them[a], “I will ask you one question. Answer me[b], and I will tell you by what authority I do these things.”
translation:
  language: tl
  text: Ngunit sinabi ni Jesus sa kanila, “May isa akong itatanong sa inyo.[a] Sagutin ninyo ako,[b] at sasabihin ko sa inyo kung sa anong awtoridad ko ginagawa ang mga ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang usapin”; mas literal, “isang salita.”
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring panatilihing magkakaugnay ang mga sugnay: “May isa akong itatanong sa inyo, at sagutin ninyo ako, at sasabihin ko sa inyo.”'
    reason: previous_rendering
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Nagpapahiwatig ng banayad na pagsalungat o paglipat habang tumutugon si Jesus sa tanong ng mga pinuno sa naunang talata.
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Ginamit ang karaniwang anyo ng pangalan sa modernong Filipino.
- source_word: εἶπεν αὐτοῖς
  choice: sinabi sa kanila
  rationale: Natural at malapit sa karaniwang gamit ng λέγω na may di-tuwirang layon.
- source_word: Ἐπερωτήσω ὑμᾶς
  choice: may ... akong itatanong sa inyo
  rationale: Natural na Filipino para sa panghinaharap na pagpapakilala ng isang ganting tanong.
- source_word: ἕνα λόγον
  choice: isa
  rationale: Sa konteksto, ang λόγος ay isang tanong o usaping sasagutin. Ang pariralang “may isa akong itatanong” ay natural at pinananatiling bukas ang saklaw ng salita; inilagay sa talababa ang mas tahasang mga alternatibo.
- source_word: ἀποκρίθητέ μοι
  choice: Sagutin ninyo ako
  rationale: Pinananatili ang tuwiran at mariing puwersa ng aorist imperative at ang maramihang kausap.
- source_word: ἐρῶ ὑμῖν
  choice: sasabihin ko sa inyo
  rationale: Natural na panghinaharap na pahayag ng pangakong magbibigay ng sagot.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: kung sa anong awtoridad
  rationale: Pinananatili ang tanong tungkol sa batayan o karapatang nagbibigay-kapangyarihan sa mga kilos ni Jesus nang hindi ito ginagawang tanong kung kanino nagmula ang awtoridad.
- source_word: ταῦτα ποιῶ
  choice: ginagawa ko ang mga ito
  rationale: Inihahatid ang kasalukuyang kilos na pinagtatalunan sa natural na Filipino.
theological_decisions:
- issue: Diwa ng ἐξουσία sa konteksto
  choice: awtoridad
  alternative: karapatan; kapangyarihan
  rationale: Ang pagtatalo ay tungkol sa lehitimong awtoridad ni Jesus na gawin ang mga bagay na ito, hindi lamang sa kaniyang kakayahan o lakas. Hindi rin nililimitahan ng salin ang salita sa isang partikular na institusyonal na pinagmulan.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang “awtoridad” bilang malinaw at karaniwang salita sa ganitong usapin. Ang paghahati sa dalawang pangungusap ay umiiwas sa alanganing pagkakabit ng pahayag at utos, habang pinananatili ng ikalawang pangungusap ang sunod-sunod na utos at pangako.
