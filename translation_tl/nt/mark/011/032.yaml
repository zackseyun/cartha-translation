base_translation:
  language: en
  yaml_path: translation/nt/mark/011/032.yaml
  text: But if we say[a], ‘From men’?”—they were afraid of the crowd[b], for everyone held that John truly was a prophet.
translation:
  language: tl
  text: Ngunit kung sabihin nating, ‘Mula sa mga tao’?”—natatakot sila sa karamihan ng mga tao, sapagkat itinuturing ng lahat na talagang propeta si Juan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “kinikilala ng lahat na si Juan ay tunay na propeta.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ εἴπωμεν
  choice: Ngunit kung sabihin nating
  rationale: Pinananatili ang pagsalungat at ang ipinahihiwatig na kondisyong bahagi ng kanilang pag-uusap sa natural na Filipino.
- source_word: Ἐξ ἀνθρώπων
  choice: Mula sa mga tao
  rationale: Malapit sa literal na kahulugang pinagmulan sa tao at pinananatili ang kaibahan sa pinagmulan sa langit nang hindi ito pinalalawak sa teksto.
- source_word: ἐφοβοῦντο τὸν ὄχλον
  choice: natatakot sila sa maraming tao
  rationale: Ang imperfect ay angkop na ipinapahayag bilang kalagayan ng takot; ang ὄχλος ay tumutukoy sa nagkakatipong maraming tao.
- source_word: ἅπαντες γὰρ εἶχον
  choice: sapagkat kinikilala ng lahat
  rationale: Sa konstruksyong ito, ang ἔχω ay nagpapahayag ng matatag na palagay o pagkilala, hindi simpleng pag-aari.
- source_word: ὄντως ὅτι προφήτης ἦν
  choice: na si Juan ay tunay na propeta
  rationale: Ipinakikita ang mariing ὄντως habang nananatiling nakapaloob ang pahayag sa pagkilala ng mga tao kay Juan.
theological_decisions:
- issue: Pinagmulan ng bautismo o awtoridad ni Juan sa pariralang ἐξ ἀνθρώπων
  choice: Mula sa mga tao
  alternative: Galing sa tao; Nagmula lamang sa tao
  rationale: Pinananatili ng pangunahing salin ang konkretong paghahambing ng pinagmulan sa langit at sa mga tao; ang pagdaragdag ng “lamang” ay mas interpretibo.
- issue: Lakas at pananaw ng ὄντως ὅτι προφήτης ἦν
  choice: kinikilala ng lahat na si Juan ay tunay na propeta
  alternative: itinuturing ng lahat na talagang propeta si Juan
  rationale: Pinananatili ang mariing pagkilala ng lahat ngunit hindi ginagawang hiwalay na pahayag ng tagapagsalaysay ang pagiging propeta ni Juan.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Ginamit ang “maraming tao” para sa ὄχλος upang maiwasan ang maaaring malabong “karamihan,” at pinanatili ang putol na tanong at dash na nagpapakita ng kanilang hindi natapos na pangangatwiran.
