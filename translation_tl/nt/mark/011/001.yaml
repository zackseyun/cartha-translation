  yaml_path: translation/nt/mark/011/001.yaml
  text: And when they were approaching Jerusalem[a], at Bethphage and Bethany, near the Mount of Olives[b], he sends two of his disciples
translation:
  language: tl
  text: Nang papalapit na sila sa Jerusalem, sa may Betfage at Betania, malapit sa Bundok ng mga Olibo,[a] isinusugo[b] niya ang dalawa sa kanyang mga alagad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “papalapit sa Jerusalem, sa Betfage at Betania, patungo sa Bundok ng mga Olibo.” Maaaring ipahayag ng mga pang-ukol sa Griyego ang patutunguhan o ang kinaroroonang paligid; ipinapakita ng pangunahing teksto ang pinakamalamang na diwa sa natural na Filipino.'
    reason: lexical_alternative
  - marker: b
    text: 'Pangkasalukuyan ang anyo ng pandiwa sa Griyego: “isinusugo.” Madalas gumamit si Marcos ng pangkasalukuyang anyo upang gawing mas buhay ang pagsasalaysay ng mga nakaraang pangyayari.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγίζουσιν
  choice: papalapit na sila
  rationale: Ipinahahayag nito ang patuloy na paglapit sa Jerusalem at likas itong basahin sa salaysay na Filipino, bagaman nasa pangkasalukuyang anyo ang pandiwang Griyego.
- source_word: εἰς Ἱεροσόλυμα
  choice: sa Jerusalem
  rationale: Sa kasama ng ἐγγίζω, ang εἰς ay tumutukoy sa pook na nilalapitan; natural sa Filipino ang “papalapit sa Jerusalem.”
- source_word: εἰς Βηθφαγὴ καὶ Βηθανίαν
  choice: at nasa may Betfage at Betania
  rationale: Ang ikalawang εἰς ay nauunawaan bilang pagtukoy sa kinaroroonang paligid habang papalapit sila; iniiwasan nito ang di-likas at posibleng nakalilitong sunod-sunod na “patungo sa.”
- source_word: πρὸς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: malapit sa Bundok ng mga Olibo
  rationale: Ang πρός ay spatial dito at maaaring magpahiwatig ng pagkakalapit o pagkakaharap sa bundok; ang “malapit sa” ang malinaw at natural na pagpapahayag sa konteksto.
- source_word: ἀποστέλλει
  choice: isinugo
  rationale: Bagaman pangkasalukuyan ang anyong Griyego bilang historical present, karaniwang gumagamit ang salaysay na Filipino ng pangnagdaan. Pinananatili ng “isinugo” ang diwa ng pagpapadala para sa isang atas.
- source_word: δύο τῶν μαθητῶν αὐτοῦ
  choice: ang dalawa sa kanyang mga alagad
  rationale: 'Natural nitong ipinapahayag ang partitive construction: dalawang kabilang sa mas malaking pangkat ng kanyang mga alagad.'
- source_word: Βηθφαγὴ
  choice: Betfage
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalang pook.
- source_word: Βηθανίαν
  choice: Betania
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalang pook.
- source_word: Ὄρος τῶν Ἐλαιῶν
  choice: Bundok ng mga Olibo
  rationale: Malinaw na salin ito ng pangalan ng pook at pinananatili ang genitibong ugnayan sa mga olibo.
