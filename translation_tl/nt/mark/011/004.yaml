    rationale: Ang πῶλος ay isang batang hayop (hal., colt) at hindi tahasang nagsasaad ng asno sa Mark 11:4. Ang pagbanggit ng asno ay interpretibong pagdaragdag sa antas ng talatang ito.
  revised_text: Umalis sila at nakita nila ang isang batang hayop na nakatali sa may pintuan sa labas, sa kalye[a], at kinalagan nila ito.
