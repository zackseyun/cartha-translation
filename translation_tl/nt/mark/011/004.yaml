  yaml_path: translation/nt/mark/011/004.yaml
  text: And they went away and found a colt tied at a door outside on the street[a], and they untied it.
translation:
  language: tl
  text: Umalis sila at nakita nila ang isang batang hayop na nakatali sa may pintuan sa labas, sa kalye[a], at kinalagan nila ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nakatali sa may pintuan sa labas, sa kalye.” Maaaring unawain ang pariralang Griyego na may bahagyang naiibang diin sa kinaroroonan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθον
  choice: umalis sila
  rationale: Ipinahihiwatig ng aorist ng ἀπέρχομαι ang pag-alis nila mula sa kinaroroonan ni Jesus; natural at malinaw ang “umalis sila” sa salaysay.
- source_word: εὗρον
  choice: nakita nila
  rationale: Sa ganitong salaysay, ang εὑρίσκω ay tumutukoy sa pagkakita o pagkatagpo sa hinahanap. Mas natural sa kasalukuyang Filipino ang “nakita nila” kaysa “natagpuan nila” sa payak na tagpong ito.
- source_word: πῶλον
  choice: batang asno
  rationale: Ang πῶλος ay batang hayop na maaaring kabayo o asno; sa konteksto ng pagpasok ni Jesus, asno ang tinutukoy. Iniiwasan ng “batang asno” ang maling karaniwang pakahulugan sa “bisiro” bilang batang kabayo.
- source_word: δεδεμένον
  choice: nakatali
  rationale: Ang perfect passive participle ay naglalarawan sa umiiral na kalagayan ng hayop. Ang “nakatali” ang pinakanatural na konkretong katumbas.
- source_word: πρὸς θύραν
  choice: sa tabi ng isang pintuan
  rationale: Ang πρός na may accusative ay nagpapahiwatig ng malapit na lokasyon. Malinaw at natural ang “sa tabi ng isang pintuan.”
- source_word: ἔξω
  choice: sa labas
  rationale: Tuwirang ipinapakita ng ἔξω na nasa labas ang kinaroroonan ng hayop.
- source_word: ἐπὶ τοῦ ἀμφόδου
  choice: sa lansangan
  rationale: Ang ἄμφοδον ay lansangan, makitid na daan, o bukás na daanan. Ang “sa lansangan” ay maikli at angkop, habang pinananatili sa talababa ang bahagyang kalabuan ng ugnayang panlunan.
- source_word: λύουσιν αὐτόν
  choice: kinalagan nila ito
  rationale: Historical present ang λύουσιν ngunit natural itong isinasalaysay sa aspektong naganap sa Filipino. Eksaktong ipinahihiwatig ng “kinalagan” ang pag-alis sa tali.
