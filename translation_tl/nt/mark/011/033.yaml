  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἀποκριθέντες ⸂τῷ Ἰησοῦ λέγουσιν⸃· Οὐκ οἴδαμεν. καὶ ὁ ⸀Ἰησοῦς λέγει αὐτοῖς· Οὐδὲ ἐγὼ λέγω ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/033.yaml
  text: And answering Jesus[a], they say, “We do not know.” And Jesus says to them, “Neither do I tell you by what authority I do these things.”
translation:
  language: tl
  text: Sumagot sila kay Jesus, “Hindi namin alam.” Sinabi naman ni Jesus sa kanila, “Hindi ko rin sasabihin sa inyo kung sa anong awtoridad ko ginagawa ang mga bagay na ito.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: Sumagot
  rationale: Isinasalin ang aorist participle bilang pangunahing pandiwa upang maging natural sa Filipino habang malinaw na ipinakikilalang tugon ang kasunod na sinabi.
- source_word: Οὐκ οἴδαμεν
  choice: Hindi namin alam
  rationale: Tuwirang ipinahahayag ang hindi nila pagkaalam; ang unang panauhang maramihan ay likas na nangangailangan ng eksklusibong “namin” dahil kausap nila si Jesus.
- source_word: Οὐδὲ ἐγὼ λέγω ὑμῖν
  choice: Hindi ko rin sasabihin sa inyo
  rationale: Pinananatili ng “rin” ang simetrikong pagtanggi ni Jesus bilang tugon sa kanilang sagot. Ang aspektong kontemplatibo ng “sasabihin” ay natural sa Filipino para sa pagtangging magbigay ng sagot, kahit nasa pangkasalukuyang anyo ang Griyegong λέγω.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: kung sa anong awtoridad
  rationale: Ang “awtoridad” ay malinaw at karaniwang salita para sa kapangyarihan, karapatan, o pahintulot na batayan ng pagkilos; hindi nito nilulutas kung ang tinutukoy ay pinagmulan, karapatan, o kapangyarihang isagawa ang mga bagay na ito.
- source_word: ταῦτα ποιῶ
  choice: ginagawa ko ang mga bagay na ito
  rationale: Pinananatili ang maramihang saklaw ng ταῦτα at ang nagpapatuloy na diwa ng pangkasalukuyang ποιῶ.
theological_decisions:
- issue: Saklaw at pinagmulan ng awtoridad ni Jesus
  choice: Hindi tinukoy kung kanino nagmula o anong uri ang awtoridad
  alternative: Ipaliwanag itong tahasang banal na awtoridad o pahintulot mula sa Diyos
  rationale: Ang talata ay nag-iiwan sa tanong na hindi sinasagot; hindi dapat idagdag sa salin ang paliwanag na hindi tahasang nasa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang anyong pangnagdaan na “sumagot” at “sinabi” para sa natural na salaysay sa Filipino, sa halip na piliting tularan ang makasaysayang pangkasalukuyan ng Griyego.
