id: MRK.11.17
reference: Mark 11:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐδίδασκεν ⸂καὶ ἔλεγεν⸃ ⸀αὐτοῖς· Οὐ γέγραπται ὅτι Ὁ οἶκός μου οἶκος προσευχῆς κληθήσεται πᾶσιν τοῖς ἔθνεσιν; ὑμεῖς δὲ ⸀πεποιήκατε αὐτὸν σπήλαιον λῃστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/017.yaml
  text: And he was teaching and saying to them[a], “Is it not written[b], ‘My house will be called a house of prayer for all the nations’? But you have made it a den of robbers.”
translation:
  language: tl
  text: At patuloy siyang nagtuturo at nagsasabi sa kanila, “Hindi ba nasusulat, ‘Ang bahay ko ay tatawaging bahay-dalanginan para sa lahat ng bansa’?[a] Ngunit ginawa ninyo itong lungga ng mga magnanakaw.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “para sa lahat ng mga bayan.” Ang Griyego ay literal na “para sa lahat ng bansa,” na umaalingawngaw sa Isaias 56:7 at nagdiriin na ang templo ay inilaan din para sa mga bansang lampas sa Israel.
    reason: lexical_alternative
  - marker: b
    text: Ang “lungga ng mga magnanakaw” ay umaalingawngaw sa Jeremias 7:11. Sa ilang konteksto, ang salitang Griyego para sa “mga magnanakaw” ay maaari ring mangahulugang “mga tulisan” o “mga mandarambong.”
    reason: cross_reference
lexical_decisions:
- source_word: ἐδίδασκεν καὶ ἔλεγεν
  choice: patuloy siyang nagtuturo at nagsasabi
  rationale: Ang dalawang pandiwa ay nasa imperfect, kaya ipinahihiwatig ng “patuloy” ang nagaganap o nagpapatuloy na pagtuturo at pagsasalita sa tagpong ito.
- source_word: Οὐ γέγραπται
  choice: Hindi ba nasusulat
  rationale: Pinananatili nito ang pormulang pantanong na umaapela sa nananatiling awtoridad ng nasusulat na Kasulatan.
- source_word: Ὁ οἶκός μου
  choice: Ang bahay ko
  rationale: Tuwirang katumbas ito ng salitang Griyego at pinananatili ang pananalita ng sipi mula sa Isaias sa halip na gawing tahasang “templo.”
- source_word: οἶκος προσευχῆς
  choice: bahay-dalanginan
  rationale: Natural at kinikilalang parirala sa Filipino na malinaw na nagsasaad ng bahay na inilaan sa panalangin.
- source_word: πᾶσιν τοῖς ἔθνεσιν
  choice: para sa lahat ng bansa
  rationale: Pinananatili ang pangkalahatang saklaw ng ἔθνη at ang alingawngaw ng Isaias 56:7 nang hindi nilalabo bilang isang pangkalahatang “mga tao” lamang.
- source_word: πεποιήκατε
  choice: ginawa ninyo
  rationale: Malinaw na inilalarawan ang gawa ng mga kausap at ang bungang kalagayan nito; ang tahasang “ninyo” ay nagpapanatili sa diin ng ὑμεῖς.
- source_word: σπήλαιον λῃστῶν
  choice: lungga ng mga magnanakaw
  rationale: Ang “lungga” ay likas na salin para sa kublian o lair, at ang “mga magnanakaw” ay nagpapanatili sa pamilyar na alingawngaw ng Jeremias 7:11 nang hindi nagdaragdag ng tiyak na pampolitikang kahulugan.
theological_decisions:
- issue: Pangkalahatang saklaw ng siping propetiko
  choice: para sa lahat ng bansa
  alternative: para sa lahat ng mga bayan
  rationale: Mas tuwirang tinutumbasan ng “mga bansa” ang ἔθνη at pinananatili ang diin na ang bahay ng Diyos ay inilaan para sa saklaw na lampas sa Israel, nang hindi naglalapat ng isang sistemang teolohikal.
- issue: Diwa ng λῃστῶν sa paratang ni Jesus
  choice: mga magnanakaw
  alternative: mga tulisan
  rationale: Maaaring tumukoy ang λῃστής sa mga tulisan o armadong mandarambong, ngunit sa alingawngaw ng Jeremias 7:11, sapat at hindi labis na tiyak ang “mga magnanakaw.”
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “bahay-dalanginan” at “lungga ng mga magnanakaw” bilang malinaw at likas na mga pariralang nagpapanatili sa mga sipi at alingawngaw mula sa Lumang Tipan.
