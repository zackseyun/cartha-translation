  text: καὶ ἀναμνησθεὶς ὁ Πέτρος λέγει αὐτῷ· Ῥαββί, ἴδε ἡ συκῆ ἣν κατηράσω ἐξήρανται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/021.yaml
  text: And Peter[a], remembering, says to him, “Rabbi, look—the fig tree that you cursed has withered.”
translation:
  language: tl
  text: At nang maalala ito ni Pedro, sinabi niya sa kanya, “Rabbi, tingnan mo! Natuyo na ang puno ng igos na isinumpa mo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναμνησθεὶς
  choice: nang maalala ito
  rationale: Likas sa modernong Tagalog at tumpak na ipinapahayag ang pang-abay na participle na ‘nang maalala’ o ‘pagkaalala’; ang ‘ito’ ay tumutukoy sa naunang pangyayari ayon sa konteksto nang hindi labis na nagpapaliwanag.
- source_word: λέγει
  choice: sinabi
  rationale: Bagaman historical present ang Griyego, mas natural sa salaysay na Tagalog ang pangnagdaan na ‘sinabi’; nananatili ang kilos at daloy ng kuwento nang hindi nagiging alanganin ang register.
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Pinananatili ang panghalip ng Griyego sa halip na tahasang palitan ng ‘kay Jesus,’ yamang malinaw ang tinutukoy mula sa konteksto.
- source_word: Ῥαββί
  choice: Rabbi
  rationale: Pinananatili ang transliteradong titulo at ang kontekstong Judio; mas textually transparent ito kaysa sa pagsasaling ‘Guro.’
- source_word: ἴδε
  choice: tingnan mo
  rationale: Natural at tuwirang utos sa modernong Tagalog; ang tandang padamdam ay nagpapahayag ng agarang pagtawag-pansin.
- source_word: συκῆ
  choice: puno ng igos
  rationale: Malinaw na puno, hindi lamang bunga, ang tinutukoy sa konteksto.
- source_word: κατηράσω
  choice: isinumpa mo
  rationale: Tuwiran at idiomatikong salin ng ikalawang panauhang kilos ng καταράομαι, nang hindi pinahihina o pinalalawak ang kahulugan.
- source_word: ἐξήρανται
  choice: natuyo na
  rationale: Ang ‘natuyo na’ ay natural para sa puno at ipinahihiwatig ng ‘na’ ang naganap nang pagbabago at kasalukuyang resulta ng Greek perfect.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignified, at natural sa pasalitang pahayag. Pinanatili ang ‘Rabbi’ upang maingatan ang makasaysayang-Judiong kulay. Walang talababa dahil ang ‘natuyo na’ ay malinaw at sapat na sinasaklaw ang leksikal at aspektuwal na diwa ng ἐξήρανται.
