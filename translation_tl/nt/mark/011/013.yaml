revisions:
- from: Nang makita niya sa malayo ang isang puno ng igos na may mga dahon, nilapitan niya iyon upang tingnan kung sakaling may matagpuan siyang anuman doon. Ngunit paglapit niya, wala siyang natagpuan kundi mga dahon, sapagkat hindi noon ang panahon ng mga igos.[a]
  to: Nang makita niya sa malayo ang isang puno ng igos na may mga dahon, nilapitan niya iyon upang tingnan kung baka may matagpuan siyang anuman dito. Ngunit paglapit niya, wala siyang natagpuan kundi mga dahon, sapagkat hindi noon ang panahon ng mga igos.[a]
  rationale: Kailangan ang pagbabago dahil ang umiiral na talababa ay nagdaragdag ng 'pa,' na maaaring magpahiwatig na hindi pa nagsisimula ang panahon ng igos. Inayos din nang bahagya ang pariralang layunin para sa mas natural na modernong Filipino at mas malinaw na pagtukoy sa puno. Nananatili ang direktang paliwanag ng tagapagsalaysay at ang tensiyong nasa teksto.
