id: MRK.11.13
reference: Mark 11:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἰδὼν συκῆν ⸀ἀπὸ μακρόθεν ἔχουσαν φύλλα ἦλθεν εἰ ἄρα ⸂τι εὑρήσει⸃ ἐν αὐτῇ, καὶ ἐλθὼν ἐπ’ αὐτὴν οὐδὲν εὗρεν εἰ μὴ φύλλα, ⸂ὁ γὰρ καιρὸς οὐκ ἦν⸃ σύκων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/013.yaml
  text: And seeing from a distance a fig tree having leaves[a], he went to see whether perhaps he would find anything on it. But when he came to it, he found nothing except leaves, for it was not the season for figs.
translation:
  language: tl
  text: Nang makita niya sa malayo ang isang puno ng igos na may mga dahon, nilapitan niya iyon upang tingnan kung baka may matagpuan siyang anuman dito. Ngunit paglapit niya, wala siyang natagpuan kundi mga dahon, sapagkat hindi noon ang panahon ng mga igos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sapagkat hindi noon ang takdang panahon para sa mga igos.”
    reason: Ipinakikita ang posibleng salin ng καιρός bilang “takdang panahon,” habang iniiwasang idagdag ang aspektong “pa” na wala sa Griyego.
lexical_decisions:
- source_word: ἰδὼν
  choice: Nang makita niya
  rationale: Likas na isinasalin sa Filipino ang pang-abay na participle bilang sugnay na panahunan, nang hindi labis na tinutukoy ang eksaktong pagkakasunod ng mga kilos.
- source_word: συκῆν
  choice: isang puno ng igos
  rationale: Karaniwan at malinaw na katumbas sa modernong Filipino.
- source_word: ἀπὸ μακρόθεν
  choice: sa malayo
  rationale: Natural na pahayag sa Filipino para sa pagtanaw mula sa isang distansiya.
- source_word: ἔχουσαν φύλλα
  choice: na may mga dahon
  rationale: Direkta at natural; hindi ipinapalagay na hitik o mayabong ang puno.
- source_word: ἦλθεν εἰ ἄρα τι εὑρήσει ἐν αὐτῇ
  choice: nilapitan niya iyon upang tingnan kung sakaling may matagpuan siyang anuman doon
  rationale: Ipinahahayag ng “upang tingnan” ang layunin, samantalang pinananatili ng “kung sakaling” ang pag-aalinlangan ng εἰ ἄρα at ng “anuman” ang di-tiyak na τι.
- source_word: ἐλθὼν ἐπ’ αὐτὴν
  choice: paglapit niya
  rationale: Maikli at likas na paraan upang ihayag ang pagdating niya sa mismong puno.
- source_word: οὐδὲν εὗρεν εἰ μὴ φύλλα
  choice: wala siyang natagpuan kundi mga dahon
  rationale: Malapit sa anyo at diin ng Griyego at malinaw sa Filipino.
- source_word: ὁ γὰρ καιρὸς οὐκ ἦν σύκων
  choice: sapagkat hindi noon ang panahon ng mga igos
  rationale: Tuwirang pinananatili ang paliwanag ng tagapagsalaysay at ang tensiyong dulot nito, nang hindi nagdaragdag ng paliwanag tungkol sa paghahalaman.
theological_decisions:
- issue: Ang diwa ng paliwanag na hindi iyon ang panahon ng mga igos
  choice: 'Isinalin nang tuwiran bilang paliwanag ng tagapagsalaysay: “sapagkat hindi noon ang panahon ng mga igos.”'
  alternative: Palawakin ang salin upang ipaliwanag kung bakit maaaring umasa ng bunga kahit hindi panahon ng mga igos.
  rationale: 'Pinananatili ng tuwirang salin ang tunay na tensiyon sa teksto: naghanap si Jesus ngunit sinabi ni Marcos na hindi iyon ang panahon ng mga igos. Hindi ito nilulutas sa pamamagitan ng dagdag na pagpapaliwanag.'
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “puno ng igos” para sa kalinawan at iniwasan ang mga salitang pang-agrikultura na magdaragdag ng interpretasyong wala sa Griyego.
