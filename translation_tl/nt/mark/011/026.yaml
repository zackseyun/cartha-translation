translation:
  language: tl
  text: Ngunit[a] kung hindi kayo nagpapatawad, hindi rin patatawarin ng inyong Ama na nasa langit ang inyong mga paglabag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wala ang talatang ito sa pinakamaagang mga manuskritong Griyego, kabilang ang Codex Sinaiticus at Codex Vaticanus noong ika-4 na siglo, at sa mga sinaunang bersiyon sa Coptic. Gayunman, matatagpuan ito sa karamihan ng mga manuskritong Byzantine, sa tradisyong Latin, at sa karamihan ng mga saksing nasa Syriac. Malamang na idinagdag ito ng mga tagakopya nang dakong huli upang iayon sa mga salita ni Jesus sa Mateo 6:15.
    reason: textual_critical
lexical_decisions:
- source_word: ἀφίημι
  choice: magpatawad / patawarin
  rationale: Sa konteksto ng kasalanang ginawa laban sa iba at ng kapatawaran ng Diyos, likas at tumpak sa modernong Tagalog ang “magpatawad.” Pinananatili rin ng magkaugnay na anyong “nagpapatawad” at “patatawarin” ang pag-uulit sa Griyego.
- source_word: παράπτωμα
  choice: mga pagkakasala
  rationale: Tumutukoy ito sa mga paglabag o maling hakbang. Ang “mga pagkakasala” ay malinaw at natural sa karaniwang Tagalog, bagaman hindi nito lubos na naihihiwalay ang παράπτωμα sa mas pangkalahatang salita para sa kasalanan.
- source_word: ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς
  choice: ang inyong Ama na nasa langit
  rationale: Tuwirang pinananatili ang Ama bilang paksa at ang pariralang naglalarawan sa kaniya, habang natural ang ayos sa Tagalog.
theological_decisions:
- issue: Ugnayan ng pagpapatawad ng tao at pagpapatawad ng Ama
  choice: 'Pinanatili ang tahasang kondisyong negatibo: kung hindi sila nagpapatawad, hindi rin sila patatawarin ng Ama.'
  alternative: Ipaliwanag ito bilang patunay lamang ng tunay na pananampalataya o bilang pagkawala ng pakikisama ngunit hindi ng kaligtasan.
  rationale: Hindi tinutukoy ng talata ang ganitong mga sistematikong paliwanag. Pinananatili ng salin ang matinding pahayag at teolohikal na tensiyon ng Griyego nang hindi ito nilulutas ayon sa isang tradisyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Ngunit” para sa δέ at ang karaniwang “mga pagkakasala” sa halip na mas teknikal o makalumang “mga pagsalangsang.”
