  text: καὶ ⸀διελογίζοντο πρὸς ἑαυτοὺς λέγοντες· ⸂Τί εἴπωμεν;⸃ ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ· Διὰ τί ⸀οὖν οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/031.yaml
  text: And they were reasoning among themselves[a], saying, “What should we say? If we say, ‘From heaven,’ he will say, ‘Why then did you not believe him?’”
translation:
  language: tl
  text: 'At nag-usap-usap sila: “Ano ang sasabihin natin? Kung sabihin nating, ‘Mula sa langit,’[a] sasabihin niya, ‘Kung gayon, bakit hindi ninyo siya pinaniwalaan?’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mula sa langit” ay isang mapitagang paraan ng mga Hudyo ng pagsasabi ng “mula sa Diyos” o “may banal o maka-Diyos na pinagmulan.”
    reason: cultural_note
lexical_decisions:
- source_word: διελογίζοντο πρὸς ἑαυτοὺς
  choice: nag-usap-usap sila
  rationale: Ipinahihiwatig ng imperpektong anyo ang nagpapatuloy na pag-uusap at pagtitimbang-timbang sa loob ng pangkat. Likas sa modernong Tagalog ang “nag-usap-usap sila” at malinaw na kapuwa nila ito pinag-uusapan, hindi lamang iniisip nang kani-kaniya.
- source_word: λέγοντες
  choice: ipinakilala sa pamamagitan ng tuwirang sipi
  rationale: Sa Tagalog, sapat at natural na ipakilala agad ang nilalaman ng kanilang pag-uusap sa tuwirang sipi; ang tahasang “na sinasabi” ay magiging mabigat at paulit-ulit.
- source_word: Τί εἴπωμεν;
  choice: Ano ang sasabihin natin?
  rationale: 'Natural na tanong ito sa Tagalog para sa deliberatibong subjunctive: pinagpapasiyahan nila kung anong sagot ang ibibigay.'
- source_word: ἐὰν εἴπωμεν
  choice: Kung sabihin nating
  rationale: Karaniwang anyo ng kondisyong pangungusap sa Tagalog at malinaw na ipinakikilala ang kanilang haka-hakang sagot.
- source_word: Ἐξ οὐρανοῦ
  choice: Mula sa langit
  rationale: Pinananatili ang literal na idyomang Judio sa Griyego sa halip na tahasang palitan ng “Mula sa Diyos,” upang hindi mawala ang anyo at pahiwatig ng orihinal.
- source_word: ἐρεῖ
  choice: sasabihin niya
  rationale: Tuwirang katumbas ng panghinaharap na λέγω at ang kasunod na sipi ang nagpapakitang patanong ang tugon.
- source_word: Διὰ τί οὖν
  choice: Kung gayon, bakit
  rationale: Natural sa Tagalog at pinananatili ang lohikal na bunga na ipinahihiwatig ng οὖν.
- source_word: οὐκ ἐπιστεύσατε αὐτῷ
  choice: hindi kayo naniwala sa kanya
  rationale: Ang πιστεύω na may datibo ay tumutukoy rito sa pagtanggap o paniniwala sa sinabi at patotoo ng isang tao. Iniiwasan ng “naniwala sa kanya” ang mas malakas at naiibang pahiwatig ng “sumampalataya sa kanya.”
theological_decisions:
- issue: Kahulugan ng “mula sa langit” tungkol sa bautismo o awtoridad ni Juan
  choice: Panatilihin ang “Mula sa langit” sa pangunahing teksto
  alternative: Mula sa Diyos
  rationale: Ang parirala ay isang mapitagang idyomang Judio na nagpapahiwatig na mula sa Diyos o may banal na pinagmulan. Ang pagpapanatili sa “langit” ay tapat sa anyo ng teksto at hindi tahasang nilulutas sa pangunahing salin ang ipinahihiwatig na kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “nag-usap-usap” para sa pangkatang deliberasyon at iniwasan ang mas pormal ngunit hindi gaanong natural na “nangatuwiran sa kanilang sarili.” Ang marker na [a] ay inilagay kaagad pagkatapos ng idyomang ipinapaliwanag.
