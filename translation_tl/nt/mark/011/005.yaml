  yaml_path: translation/nt/mark/011/005.yaml
  text: And some of those standing there were saying to them[a], “What are you doing, untying the colt?”
translation:
  language: tl
  text: At may ilan sa mga nakatayo roon na nagsasabi sa kanila, “Ano ang ginagawa ninyo at kinakalagan ninyo ang batang asno?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang bisiro.” Ang Griyegong πῶλος ay maaaring tumukoy sa isang batang hayop; sa kontekstong ito, tumutukoy ito sa isang asno.
    reason: lexical_alternative
lexical_decisions:
- source_word: τινες
  choice: ilan
  rationale: Likas na salin ng di-tiyak na pangmaramihang tumutukoy sa isang bahagi ng mga taong naroon.
- source_word: τῶν ἐκεῖ ἑστηκότων
  choice: sa mga nakatayo roon
  rationale: Pinananatili ang substantival na participle at ang lokasyong ἐκεῖ sa natural na modernong Tagalog.
- source_word: ἔλεγον
  choice: sinabi
  rationale: Bagaman imperfect ang anyo, ang simpleng salaysay na “sinabi” ang pinakanatural sa Tagalog at hindi nagdaragdag ng di-tiyak na pag-uulit.
- source_word: αὐτοῖς
  choice: sa kanila
  rationale: Tuwirang katumbas ng dative plural na tumutukoy sa mga alagad.
- source_word: Τί ποιεῖτε
  choice: Ano ang ginagawa ninyo?
  rationale: Pinananatili ang tuwirang tanong at presenteng aspekto nang hindi ginagawang tahasang “bakit,” na wala sa parirala mismo.
- source_word: λύοντες
  choice: kinakalagan
  rationale: Sa konteksto ng hayop na nakatali, malinaw at natural na ipinahihiwatig nito ang pag-aalis ng tali.
- source_word: τὸν πῶλον
  choice: ang batang asno
  rationale: Ang πῶλος ay batang hayop; malinaw sa agarang konteksto ng salaysay na asno ang tinutukoy. Mas madaling maunawaan ito kaysa sa malabong “bisiro” sa modernong Tagalog.
