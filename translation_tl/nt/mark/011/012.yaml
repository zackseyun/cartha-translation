  text: Καὶ τῇ ἐπαύριον ἐξελθόντων αὐτῶν ἀπὸ Βηθανίας ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/012.yaml
  text: And on the next day, when they had gone out from Bethany, he was hungry.
translation:
  language: tl
  text: At kinabukasan, paglabas nila mula sa Betania, nagutom siya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: At
  rationale: Ipinagpapatuloy nito ang salaysay at pinananatili ang payak na nag-uugnay na estilo ni Marcos.
- source_word: τῇ ἐπαύριον
  choice: kinabukasan
  rationale: Natural at malinaw na panandang panahunan sa modernong Tagalog para sa sumunod na araw.
- source_word: ἐξελθόντων αὐτῶν
  choice: paglabas nila
  rationale: Ang genitive absolute ay nagsasaad ng kilos ng pangkat na nauna o kasabay sa pangunahing pangyayari; likas sa Tagalog ang ganitong temporal na anyo at pinananatili ang maramihang 'nila'.
- source_word: ἀπὸ Βηθανίας
  choice: mula sa Betania
  rationale: Tuwirang ipinahahayag ang paglayo sa isang lugar; 'Betania' ang karaniwang anyong Tagalog ng pangalan ng lugar.
- source_word: ἐπείνασεν
  choice: nagutom siya
  rationale: Ang 'nagutom' ay natural na salin ng aorist at maaaring magpahiwatig ng pagdating ng gutom nang hindi nagiging pilit; pinananatili ng 'siya' ang di-tahasang isahang paksa ng Griyego.
theological_decisions:
- issue: Di-tahasang paksa ng ἐπείνασεν
  choice: Isinalin bilang 'siya' at hindi idinagdag ang pangalang 'Jesus'.
  alternative: Tahasan itong isalin bilang 'nagutom si Jesus'.
  rationale: Malinaw sa konteksto na si Jesus ang tinutukoy, ngunit hindi siya pinangalanan sa sugnay ng Griyego. Pinananatili ng 'siya' ang kaiklian at anyo ng pinagmulan habang tuwirang inilalarawan ang tunay niyang pagkagutom bilang tao.
translation_notes:
  register: Modernong Filipino Tagalog na natural, maikli, at marangal. Pinanatili ang pambungad na pang-ugnay at ang pagkakaiba ng maramihang 'nila' sa isahang 'siya'.
