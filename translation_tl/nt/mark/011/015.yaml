source:
  edition: SBLGNT
  text: Καὶ ἔρχονται εἰς Ἱεροσόλυμα. καὶ ⸀εἰσελθὼν εἰς τὸ ἱερὸν ἤρξατο ἐκβάλλειν τοὺς πωλοῦντας καὶ ⸀τοὺς ἀγοράζοντας ἐν τῷ ἱερῷ, καὶ τὰς τραπέζας τῶν κολλυβιστῶν καὶ τὰς καθέδρας τῶν πωλούντων τὰς περιστερὰς κατέστρεψεν
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/015.yaml
  text: And they came to Jerusalem. And entering the temple[a], he began to drive out those who were selling and those who were buying in the temple, and he overturned the tables of the money changers and the seats of those who were selling doves.
translation:
  language: tl
  text: At dumating sila sa Jerusalem. Pagpasok niya sa templo[a], sinimulan niyang paalisin ang mga nagtitinda at ang mga bumibili sa templo, at itinaob niya ang mga mesa ng mga tagapagpalit ng salapi at ang mga upuan ng mga nagtitinda ng mga kalapati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga bakuran ng templo” o “mga nasasakupan ng templo.” Ang salitang Griyego ay tumutukoy sa mas malawak na kompleks ng templo, hindi partikular sa panloob na santuwaryo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: dumating sila
  rationale: Ang makasaysayang pangkasalukuyan sa Griyego ay likas na isinasalaysay sa nakaraang panahunan sa modernong Tagalog.
- source_word: εἰσελθὼν
  choice: pagpasok niya
  rationale: Likas na ipinahahayag ang aorist participle bilang kilos na kaugnay at nauuna sa pangunahing kilos, nang hindi pinabibigat ang pangungusap.
- source_word: τὸ ἱερὸν / ἐν τῷ ἱερῷ
  choice: templo
  rationale: Pamilyar at maikli ang “templo”; nililinaw sa talababa na ang ἱερόν ay ang mas malawak na bakuran o buong kompleks, hindi lamang ang panloob na santuwaryo.
- source_word: ἤρξατο ἐκβάλλειν
  choice: sinimulan niyang paalisin
  rationale: Pinananatili nito ang tahasang pagsisimula ng kilos at ang mapuwersang pagpapaalis sa konteksto.
- source_word: τοὺς πωλοῦντας καὶ τοὺς ἀγοράζοντας
  choice: ang mga nagtitinda at ang mga bumibili
  rationale: Pinananatili ang magkatimbang na mga substantibong participle at ang nagpapatuloy na gawain ng dalawang pangkat.
- source_word: κολλυβιστῶν
  choice: mga tagapagpalit ng salapi
  rationale: Malinaw na tumutukoy sa mga nagpapalit ng salapi o barya sa lugar ng templo.
- source_word: καθέδρας
  choice: mga upuan
  rationale: Sapat na malawak at hindi nagpapasok ng tiyak na anyo ng muwebles na wala sa Griyego.
- source_word: περιστερὰς
  choice: mga kalapati
  rationale: Karaniwang salin sa Tagalog at angkop sa konteksto ng mga handog sa templo.
- source_word: κατέστρεψεν
  choice: itinaob niya
  rationale: Matingkad at natural na salin para sa pagbabaligtad ng mga mesa at upuan.
theological_decisions:
- issue: Saklaw ng ἱερόν sa salaysay
  choice: “templo” sa pangunahing teksto, na may talababa tungkol sa buong kompleks ng templo
  alternative: “bakuran ng templo” o “buong lugar ng templo” sa pangunahing teksto
  rationale: Ang ἱερόν ay tumutukoy sa mas malawak na lugar ng templo, hindi partikular sa panloob na santuwaryo. Pinananatili ng pangunahing teksto ang pamilyar na tawag habang iniingatan ng talababa ang mahalagang heograpikong pagkakaiba.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “pagpasok niya” para sa maayos na daloy ng salaysay at “tagapagpalit ng salapi” para sa malinaw ngunit hindi kolokyal na katawagan.
