  text: And whenever evening came, they would go out of the city.
translation:
  language: tl
  text: At tuwing gumagabi, lumalabas sila mula sa lungsod.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν
  choice: tuwing
  rationale: Kasama ng di-ganap na pandiwang ἐξεπορεύοντο, ipinahihiwatig nito ang paulit-ulit o nakaugaliang kilos, kaya mas angkop ang “tuwing” kaysa sa simpleng “nang.”
- source_word: ὀψὲ ἐγένετο
  choice: gumagabi na
  rationale: Likas at kasalukuyang Tagalog ito para sa idyomang nangangahulugang sumasapit na ang gabi o nagiging huli na ang oras.
- source_word: ἐξεπορεύοντο
  choice: lumalabas sila
  rationale: Ang di-ganap na panahunan ay tumutukoy rito sa nakaugaliang kilos; naipapahayag na ng “tuwing” ang paulit-ulit na diwa, kaya hindi na kailangan ang mas mabigat na “palagi silang lumalabas.”
- source_word: ἔξω τῆς πόλεως
  choice: sa lungsod
  rationale: 'Kasunod ng pandiwang “lumalabas,” natural na ipinahahayag ng “sa lungsod” ang pinagmumulan ng kilos: lumalabas mula sa loob ng lungsod.'
- source_word: πόλεως
  choice: lungsod
  rationale: Pinananatili ang pangkalahatang katawagang nasa Griyego at hindi ipinapasok ang pangalang Jerusalem, bagaman malinaw ito sa konteksto.
theological_decisions: []
translation_notes:
  register: Makabagong, malinaw, at marangal na Filipino. Ginamit ang “tuwing” at “gumagabi na” upang natural na maipakita ang nakaugaliang kilos at temporal na idyoma nang hindi nagdaragdag ng impormasyong wala sa Griyego.
