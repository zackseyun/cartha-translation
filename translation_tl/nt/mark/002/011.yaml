  text: I say to you[a], get up, pick up your mat[b], and go to your house.
translation:
  language: tl
  text: “Sinasabi ko sa iyo, bumangon ka, buhatin mo ang iyong higaan,[a] at umuwi ka.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “banig na hinihigaan.” Ang Griyegong κράβαττος ay tumutukoy sa isang payak na sapin o higaan na maaaring dalhin.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “pumunta ka sa iyong bahay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Σοὶ λέγω
  choice: Sinasabi ko sa iyo
  rationale: Pinananatili nito ang tuwirang personal na pananalita at ang may-awtoridad na pormula. Nauuna sa Griyego ang panghalip na Σοί para sa diin, ngunit magiging pilit sa natural na Filipino ang sobrang tahasang paggaya sa ayos nito.
- source_word: ἔγειρε
  choice: bumangon ka
  rationale: Malinaw at likas na makabagong utos ito sa isang nakahiga at paralitikong lalaki; hindi kailangan ang mas pormal na “tumindig ka.”
- source_word: ἆρον
  choice: buhatin mo
  rationale: Ipinahahayag nito ang konkretong pagkilos ng pag-angat at pagdadala sa magaang higaan. Mas angkop ito kaysa “pulutin,” na maaaring magpahiwatig ng bagay na basta nakakalat sa lupa.
- source_word: κράβαττόν
  choice: higaan
  rationale: Tumutukoy ang salita sa payak at naililipat na sapin o higaan. Ang “higaan” ay natural at malawak na nauunawaan sa Filipino, samantalang ang “banig” ay maaaring magtakda ng materyal na hindi tahasang sinasabi ng Griyego.
- source_word: ὕπαγε εἰς τὸν οἶκόν σου
  choice: umuwi ka
  rationale: Ito ang natural na katumbas sa Filipino ng utos na pumunta sa sariling bahay. Nililinaw sa talababa ang mas literal na anyo upang mapanatili ang kongkretong larawan ng Griyego.
theological_decisions:
- issue: Tono at lakas ng utos ni Jesus na magpagaling
  choice: 'Tuwiran, personal, at may awtoridad: “Sinasabi ko sa iyo, bumangon ka...”'
  alternative: 'Mas tradisyonal o pormal: “Sinasabi ko sa iyo, tumindig ka, dalhin mo ang iyong higaan...”'
  rationale: Pinananatili ng salin ang agarang lakas at sunod-sunod na mga utos nang hindi nagdaragdag ng paliwanag tungkol sa likas o pinagmulan ng awtoridad ni Jesus.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang karaniwang “bumangon,” “buhatin,” at “umuwi” sa halip na mga pormal o makalumang katumbas. Ang mga panandang [a] at [b] ay kapwa nasa pangunahing teksto at tumutugma sa kani-kanilang talababa.
