  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἀκούσας ὁ Ἰησοῦς λέγει αὐτοῖς ⸀ὅτι Οὐ χρείαν ἔχουσιν οἱ ἰσχύοντες ἰατροῦ ἀλλ’ οἱ κακῶς ἔχοντες· οὐκ ἦλθον καλέσαι δικαίους ἀλλὰ ⸀ἁμαρτωλούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/017.yaml
  text: And when Jesus heard it, he says to them, “Those who are strong have no need of a physician, but those who are sick. I did not come to call the righteous, but sinners.”
translation:
  language: tl
  text: Nang marinig ito ni Jesus, sinabi niya sa kanila, “Hindi nangangailangan ng manggagamot ang mga malulusog[a], kundi ang mga maysakit. Hindi ako naparito upang tawagin ang mga matuwid[b], kundi ang mga makasalanan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “malalakas”; literal na tumutukoy ang Griyego sa mga malakas o nasa mabuting kalagayan.
    reason: lexical_alternative
  - marker: b
    text: Maaaring maunawaan sa konteksto ang “mga matuwid” bilang ironiko—ang mga itinuturing na matuwid o nag-aakalang matuwid sila. Gayunman, “mga matuwid” lamang ang tahasang sinasabi ng tekstong Griyego.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: Nang marinig ito ni Jesus
  rationale: Likas sa Tagalog ang temporal na sugnay para sa aorist participle. Idinagdag ang “ito” bilang kontekstuwal na layon na hindi tahasang binanggit sa Griyego.
- source_word: λέγει
  choice: sinabi niya
  rationale: Bagaman historical present ang Griyego, mas natural at malinaw sa makabagong salaysay na Tagalog ang pangnagdaan; hindi nito binabago ang kahulugan.
- source_word: οἱ ἰσχύοντες
  choice: ang malalakas
  rationale: Pinananatili nito ang pangunahing leksikal na diwa ng pagkakaroon ng lakas, habang ang “malulusog” ay inilalahad bilang alternatibo sa talababa.
- source_word: χρείαν ἔχουσιν ... ἰατροῦ
  choice: Hindi nangangailangan ng manggagamot
  rationale: Natural na Tagalog para sa idyomang “may pangangailangan,” at pinananatili ng “manggagamot” ang marangal na tono ng kasabihan.
- source_word: οἱ κακῶς ἔχοντες
  choice: ang mga maysakit
  rationale: Sa kontekstong medikal, ang idyoma ay tumutukoy sa mga may karamdaman.
- source_word: οὐκ ἦλθον καλέσαι
  choice: Hindi ako naparito upang tawagin
  rationale: Ang “naparito” ay angkop sa pahayag tungkol sa misyon ni Jesus, at ang “tawagin” ay hindi labis na nagtatakda kung ito ay paanyaya o pagsugo.
- source_word: δικαίους
  choice: ang mga matuwid
  rationale: Tuwirang pinananatili ang moral at panrelihiyong kategorya nang hindi ipinapasok sa pangunahing teksto ang posibleng ironikong pagbasa.
- source_word: ἁμαρτωλούς
  choice: ang mga makasalanan
  rationale: Karaniwan at malinaw na salin ng substantibong pang-uri sa konteksto ng Ebanghelyo.
theological_decisions:
- issue: Kung gagawing tahasan ang di-binanggit na layon ng “marinig”
  choice: Idinagdag ang “ito”
  alternative: “Nang makarinig si Jesus”
  rationale: Nililinaw ng agarang konteksto kung ano ang narinig ni Jesus. Kailangan ito para sa mas natural na Tagalog, ngunit hindi tinutukoy nang higit pa kung ang narinig niya ay reklamo, tanong, o usapan.
- issue: Kung ipapahiwatig na ironiko ang “mga matuwid”
  choice: Pinanatili ang “mga matuwid” sa pangunahing teksto
  alternative: “ang mga nag-aakalang matuwid sila”
  rationale: Maaaring ironiko ang pahayag sa konteksto, ngunit δικαίους lamang ang sinasabi ng Griyego. Ang interpretatibong posibilidad ay inilagay sa talababa upang mapanatili ang tensiyong teolohikal.
- issue: Kung pananatilihin ang historical present sa Tagalog
  choice: Isinalin bilang pangnagdaang “sinabi niya”
  alternative: “sinasabi niya”
  rationale: Ang historical present ay katangian ng masiglang salaysay ni Marcos, ngunit ang literal na kasalukuyang panahunan dito ay hindi likas sa ordinaryong modernong Tagalog. Ang pangnagdaan ay mas malinaw nang walang pagbabagong doktrinal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino Tagalog. Ginamit ang “manggagamot” at “naparito” upang mapanatili ang kasabihang tono nang hindi nagiging lipas o labis na pormal.
