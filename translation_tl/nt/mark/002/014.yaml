id: MRK.2.14
reference: Mark 2:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ παράγων εἶδεν Λευὶν τὸν τοῦ Ἁλφαίου καθήμενον ἐπὶ τὸ τελώνιον, καὶ λέγει αὐτῷ· Ἀκολούθει μοι. καὶ ἀναστὰς ἠκολούθησεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/014.yaml
  text: And as he was passing by[a], he saw Levi the son of Alphaeus sitting at the tax booth, and he says to him, “Follow me.” And he rose and followed him.
translation:
  language: tl
  text: Habang dumaraan siya, nakita niya si Levi na anak ni Alfeo, na nakaupo sa singilan ng buwis.[a] Sinabi niya rito, “Sumunod ka sa akin.” Tumayo si Levi at sumunod sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa singilan ng buwis sa mga kalakal o bayad sa pagdaan.” Ang salitang Griyego ay tumutukoy sa lugar kung saan kinokolekta ang mga buwis o singil.
    reason: lexical_alternative
lexical_decisions:
- source_word: παράγων
  choice: habang dumaraan siya
  rationale: Ipinapakita ng kasalukuyang pandiwaring Griyego ang kilos na nagpapatuloy habang nakita niya si Levi. Likas sa Filipino ang “habang dumaraan siya” at hindi nito dinaragdagan ang teksto.
- source_word: εἶδεν
  choice: nakita niya
  rationale: Tuwirang katumbas ito ng aorist ng ὁράω at hindi nagdaragdag ng diwang gaya ng “napansin.”
- source_word: Λευὶν
  choice: Levi
  rationale: Isinalin sa karaniwang anyo ng pangalang ito sa Filipino.
- source_word: τὸν τοῦ Ἁλφαίου
  choice: na anak ni Alfeo
  rationale: Ipinahihiwatig ng pariralang henitibo ang kaugnayan sa magulang; kailangang ilantad sa Filipino ang salitang “anak.”
- source_word: καθήμενον
  choice: na nakaupo
  rationale: Natural at tuwirang inilalarawan nito ang kalagayan ni Levi nang makita siya.
- source_word: ἐπὶ τὸ τελώνιον
  choice: sa singilan ng buwis
  rationale: Ang τελώνιον ay lugar kung saan naniningil ng buwis, buwis sa kalakal, o bayad sa pagdaan. Ang “singilan ng buwis” ay malinaw at hindi labis na espesipiko.
- source_word: λέγει
  choice: Sinabi niya rito
  rationale: Bagaman historical present ang Griyego, karaniwang isinasalaysay sa Filipino sa aspektong naganap ang ganitong pangyayari. Ang “rito” ay natural na tumutukoy kay Levi at umiiwas sa sunod-sunod na “niya” at “kanya.”
- source_word: Ἀκολούθει μοι
  choice: Sumunod ka sa akin
  rationale: Tuwiran nitong pinananatili ang utos at ang pandiwang “sumunod,” nang hindi idinaragdag ang “halika” na wala sa Griyego.
- source_word: ἀναστὰς
  choice: Tumayo si Levi
  rationale: Pinananatili nito ang pagkakasunod ng kilos. Inulit ang pangalan para maging malinaw ang simuno sa natural na Filipino.
- source_word: ἠκολούθησεν αὐτῷ
  choice: sumunod sa kanya
  rationale: Pinananatili ang mahalagang ugnayang pandiwa sa naunang utos at hindi ginagawang pagpapaliwanag ang salin.
theological_decisions:
- issue: Historical present ni Marcos sa λέγει
  choice: Isinalin bilang “Sinabi niya rito” ayon sa natural na aspektong pasalaysay sa Filipino.
  alternative: “Sinasabi niya rito” upang mas lantad na mapanatili ang historical present.
  rationale: Hindi likas sa pangkaraniwang modernong Filipino ang biglang “sinasabi” sa kontekstong ito at maaari itong magmukhang paulit-ulit o nagpapatuloy na pagsasalita. Pinananatili ng napiling anyo ang pangyayari nang hindi binabago ang teolohikal na diwa.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “singilan” bilang konkretong tawag sa lugar nang hindi ipinapalagay na katulad ito ng makabagong tanggapan o toll booth. Inilagay ang talababa sa pariralang tinutukoy nito.
