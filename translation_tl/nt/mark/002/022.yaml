id: MRK.2.22
reference: Mark 2:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ οὐδεὶς βάλλει οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μή, ⸂ῥήξει ὁ οἶνος⸃ τοὺς ἀσκούς, καὶ ὁ οἶνος ⸂ἀπόλλυται καὶ οἱ ἀσκοί⸃. ἀλλὰ οἶνον νέον εἰς ἀσκοὺς ⸀καινούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/022.yaml
  text: And no one puts new wine into old wineskins[a]. Otherwise, the wine will burst the wineskins, and the wine is ruined, and the wineskins too[b]. But new wine is for fresh wineskins.
translation:
  language: tl
  text: At walang naglalagay ng bagong alak sa mga lumang sisidlang-balat. Kung gagawin iyon, papuputukin ng alak ang mga sisidlang-balat, at masasayang ang alak pati ang mga sisidlan.[a] Sa halip, ang bagong alak ay para sa mga bagong sisidlang-balat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mawawala ang alak, pati ang mga sisidlan.”
    reason: lexical_alternative
  - marker: b
    text: Ang “bagong” sisidlang-balat ay sariwa o hindi pa gamit, bilang kaibahan sa lumang sisidlang-balat.
    reason: lexical_nuance
lexical_decisions:
- source_word: βάλλει
  choice: naglalagay
  rationale: Likas at malawak na pandiwang Filipino para sa paglalagay ng alak sa isang sisidlan; hindi nito pinakikitid ang diwa tungo sa mas tiyak na ‘nagbubuhos.’
- source_word: οἶνον νέον
  choice: bagong alak
  rationale: Karaniwang katumbas na nagpapanatili sa larawan ng alak na bagong gawa at patuloy pang nagbuburo.
- source_word: ἀσκούς
  choice: mga sisidlang-balat
  rationale: Malinaw na tumutukoy sa mga sisidlang yari sa balat ng hayop na ginagamit para sa alak, habang pinananatili ang sinaunang larawang pangkultura.
- source_word: παλαιούς
  choice: mga luma
  rationale: Tuwirang pinananatili ang kaibahan ng lumang sisidlan sa bagong sisidlan nang hindi idinaragdag ang interpretasyong ‘marupok’ o ‘sira na.’
- source_word: ῥήξει
  choice: papuputukin
  rationale: Ipinapahayag ang bunga ng presyur ng nagbuburong alak sa lumang sisidlang-balat at natural itong pakinggan sa Filipino.
- source_word: ἀπόλλυται
  choice: masasayang
  rationale: Sa kontekstong ito, malinaw na ipinahihiwatig na mawawala at hindi na mapakikinabangan ang alak. Itinatala sa talababa ang mas literal na alternatibong ‘mawawala.’
- source_word: καινούς
  choice: mga bagong sisidlang-balat
  rationale: Ang ‘bago’ ang pinakanatural na Filipino para sa καινός dito. Ipinapaliwanag sa talababa na ang diwa ay sisidlang sariwa o hindi pa gamit, bilang kaibahan sa luma.
- source_word: ἀλλὰ οἶνον νέον εἰς ἀσκοὺς καινούς
  choice: Sa halip, ang bagong alak ay para sa mga bagong sisidlang-balat
  rationale: Pinananatili ang maikli at kawikaang anyo ng sugnay na walang hayag na pandiwa sa Griyego, nang hindi nagdaragdag ng utos o tahasang obligasyon.
theological_decisions:
- issue: Ang anyo ng panghuling sugnay na walang hayag na pandiwa
  choice: 'Isinalin bilang pangkalahatang simulain: ‘ang bagong alak ay para sa mga bagong sisidlang-balat.’'
  alternative: ‘Dapat ilagay ang bagong alak sa mga bagong sisidlang-balat’ o ‘inilalagay ang bagong alak sa mga bagong sisidlang-balat.’
  rationale: Walang hayag na pandiwa ang Griyegong panghuling sugnay. Iniiwasan ng napiling anyo ang pagdaragdag ng puwersang pautos o obligasyon na hindi tahasang nasa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘sisidlang-balat’ upang maunawaan ang sinaunang gamit nang hindi pinapalitan ng makabagong bote o lalagyan. Pinanatili ang maikli at matalinghagang himig ng kasabihan.
