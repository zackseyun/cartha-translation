  text: καὶ ἔρχονται ⸂φέροντες πρὸς αὐτὸν παραλυτικὸν⸃ αἰρόμενον ὑπὸ τεσσάρων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/003.yaml
  text: And they came[a], bringing to him a paralyzed man carried by four.
translation:
  language: tl
  text: At dumating sila, dala ang isang lalaking paralitiko papunta sa kanya, na binubuhat ng apat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ng apat na lalaki”; “ng apat” lamang ang nasa Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang payak na pang-ugnay at ang sunod-sunod na estilong pasalaysay ni Marcos.
- source_word: ἔρχονται
  choice: dumating sila
  rationale: Ang makasaysayang pangkasalukuyan sa Griyego ay likas na isinasalin sa nagdaang panahunan sa makabagong salaysay na Tagalog.
- source_word: φέροντες πρὸς αὐτὸν
  choice: dinala sa kanya
  rationale: Natural na ipinahahayag sa Tagalog ang kasabay na kilos at ang patutunguhan; sa konteksto, si Jesus ang tinutukoy ng 'kanya.'
- source_word: παραλυτικὸν
  choice: isang lalaking paralitiko
  rationale: Ang pang-uri ay ginamit bilang pangngalan. Ang 'lalaking paralitiko' ay malinaw at karaniwang maunawaan sa modernong Tagalog.
- source_word: αἰρόμενον
  choice: pasan
  rationale: Ipinahahayag nito na pisikal siyang binubuhat ng iba, sa maikli at natural na paraan.
- source_word: ὑπὸ τεσσάρων
  choice: ng apat
  rationale: Pinananatili ang pagkakaltas sa Griyego, na nagsasaad lamang ng 'apat' at hindi tahasang 'apat na lalaki.'
