- from: At dumating sila at dinala sa kanya ang isang lalaking paralitiko na pasan ng apat.[a]
  to: At dumating sila, dala ang isang lalaking paralitiko papunta sa kanya, na binubuhat ng apat.[a]
  rationale: Pinalitan ang “na pasan ng apat” ng “na binubuhat ng apat” upang malinaw na maipahayag ang pisikal na pagdadala na nasa αἰρόμενον. Pinananatili ng “dala ang ... papunta sa kanya” ang attendant action ng φέροντες πρὸς αὐτόν, at hindi idinaragdag sa pangunahing teksto ang salitang “lalaki” pagkatapos ng “apat.”
