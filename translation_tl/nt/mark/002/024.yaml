base_translation:
  language: en
  yaml_path: translation/nt/mark/002/024.yaml
  text: And the Pharisees were saying to him[a], “Look, why are they doing what is not permitted on the Sabbath?”
translation:
  language: tl
  text: At sinasabi ng mga Pariseo sa kanya, “Tingnan mo! Bakit nila ginagawa sa Sabbath ang hindi ipinahihintulot?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Tingnan mo! Ano ang ginagawa nila sa Sabbath na hindi ipinahihintulot?” Maaaring unawain ang Griyegong τί bilang “ano,” bagaman sa kontekstong ito ay malamang na “bakit” ang diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Karaniwang pang-ugnay na nagpapatuloy sa daloy ng salaysay nang hindi nagdaragdag ng tiyak na temporal na diwa.
- source_word: οἱ Φαρισαῖοι
  choice: ang mga Pariseo
  rationale: Likas at kinikilalang anyo sa modernong Tagalog para sa pangalan ng pangkat.
- source_word: ἔλεγον
  choice: sinasabi
  rationale: Pinananatili ang diwang nagpapatuloy o maaaring paulit-ulit ng imperfect, sa halip na payak na “sinabi.”
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Likas na salin ng dative indirect object at tumutukoy kay Jesus.
- source_word: Ἴδε
  choice: Tingnan mo!
  rationale: Natural na panawag-pansin sa modernong Tagalog; ang tandang padamdam ay naghihiwalay rito sa kasunod na tanong.
- source_word: τί
  choice: Bakit
  rationale: 'Bagaman maaaring literal na “ano,” gumaganap itong pang-abay sa konteksto ng pagtutol: “Bakit ginagawa nila...?”'
- source_word: ποιοῦσιν
  choice: ginagawa nila
  rationale: Likas na Tagalog para sa kasalukuyang kilos sa tuwirang pananalita.
- source_word: τοῖς σάββασιν
  choice: sa Sabbath
  rationale: Ang pangmaramihang Griyego ay karaniwang idyomatikong tumutukoy sa araw ng Sabbath; isahan ang natural sa Tagalog.
- source_word: ὃ οὐκ ἔξεστιν
  choice: ang hindi ipinahihintulot
  rationale: Malinaw na ipinapahayag ang usapin ng pagpapahintulot o pagiging naaayon sa batas nang hindi tinutukoy kung anong tiyak na batas o tradisyon ang pinagmulan nito.
theological_decisions:
- issue: Likas na batayan ng pagtutol ng mga Pariseo
  choice: ang hindi ipinahihintulot
  alternative: ang labag sa kautusan
  rationale: Hindi tinutukoy ng Griyego kung ang tinutukoy ay tahasang kautusan sa Kasulatan, tradisyong Pariseo, o mas malawak na interpretasyong halakhiko. Pinananatili ng salin ang legal-relihiyosong bigat nang hindi nilulutas ang tensiyong iyon.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “Sabbath” bilang pamilyar na terminong biblikal at “ipinahihintulot” upang mapanatili ang legal-relihiyosong diwa nang hindi nagiging labis na teknikal.
