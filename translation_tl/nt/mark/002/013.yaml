  text: Καὶ ἐξῆλθεν πάλιν παρὰ τὴν θάλασσαν· καὶ πᾶς ὁ ὄχλος ἤρχετο πρὸς αὐτόν, καὶ ἐδίδασκεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/013.yaml
  text: And he went out again beside the sea[a], and the whole crowd was coming to him[c][b], and he was teaching them.
translation:
  language: tl
  text: Muling lumabas si Jesus sa tabi ng dagat. Lumalapit sa kanya ang buong karamihan, at tinuturuan niya sila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang mga pandiwang “lumalapit” at “tinuturuan” ay nagsasalin ng mga pandiwang Griyego na maaaring magpahiwatig ng nagpapatuloy o paulit-ulit na kilos noong nakaraan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν πάλιν
  choice: Muling lumabas
  rationale: Likas na ipinahahayag nito ang paglabas na naulit; hindi idinaragdag ang isang pinanggalingang lugar na hindi tahasang sinabi sa Griyego.
- source_word: παρὰ τὴν θάλασσαν
  choice: pumunta sa tabi ng lawa
  rationale: Sa konteksto ng Marcos, ang θάλασσα ay ang Lawa ng Galilea. Ipinahahayag ng parirala ang pagkilos patungo sa tabing-lawa; idinagdag ang 'pumunta' upang maging natural at malinaw sa Tagalog.
- source_word: πᾶς ὁ ὄχλος
  choice: ang buong karamihan
  rationale: Natural na katumbas sa Tagalog ng kolektibong pariralang tumutukoy sa karamihan bilang kabuuan.
- source_word: ἤρχετο πρὸς αὐτόν
  choice: Lumalapit sa kanya
  rationale: Pinananatili ng aspektong di-ganap ng pandiwang Griyego ang nagpapatuloy na kilos. Ang 'lumalapit' ay natural sa salaysay na Filipino at maaaring magpahiwatig na dumarating ang mga tao sa kanya.
- source_word: ἐδίδασκεν αὐτούς
  choice: tinuturuan niya sila
  rationale: Pinananatili ng aspektong di-ganap ang nagpapatuloy na pagtuturo at malinaw na iniuugnay ang 'sila' sa karamihan.
- source_word: αὐτός
  choice: si Jesus
  rationale: Bagaman panghalip lamang ang Griyego, natural sa Filipino na muling tukuyin ang pangunahing tauhan sa simula ng isang talata, at malinaw sa konteksto na si Jesus ang tinutukoy.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lawa” sa halip na literal na “dagat” sapagkat ang tinutukoy sa konteksto ay ang Lawa ng Galilea. Ginamit ang kasalukuyang anyo ng mga pandiwa ayon sa karaniwang paraan ng pagsasalaysay sa Filipino habang pinananatili ang nagpapatuloy na aspekto ng mga imperfect sa Griyego.
