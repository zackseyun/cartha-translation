  text: Τί οὗτος οὕτως λαλεῖ; ⸀βλασφημεῖ· τίς δύναται ἀφιέναι ἁμαρτίας εἰ μὴ εἷς ὁ θεός;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/007.yaml
  text: Why does this man speak like this? He is blaspheming! Who can forgive sins except God alone?[a][b]
translation:
  language: tl
  text: “Bakit nagsasalita nang ganito ang taong ito? Lumalapastangan siya! Sino ang makapagpapatawad ng mga kasalanan maliban sa Diyos lamang?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “maliban sa iisang Diyos.”
    reason: alternative_reading
lexical_decisions:
- source_word: Τί ... λαλεῖ
  choice: Bakit nagsasalita
  rationale: Sa idyomang Griyego, ang Τί ay nagtatanong kung bakit nagsasalita nang gayon si Jesus, hindi kung ano ang nilalaman ng sinabi niya.
- source_word: οὗτος
  choice: ang taong ito
  rationale: Likas itong Tagalog para sa pantukoy na may bahagyang mapaglayong tono, nang hindi dinaragdagan ang paghamak.
- source_word: οὕτως
  choice: nang ganito
  rationale: Natural na inilalarawan nito ang paraan o nilalaman ng pagsasalita ni Jesus.
- source_word: βλασφημεῖ
  choice: Lumalapastangan siya sa Diyos
  rationale: Ang 'lumalapastangan sa Diyos' ay malinaw at kasalukuyang Tagalog para sa relihiyosong paratang ng βλασφημέω; ang aspektong imperpektibo ay angkop sa agarang ginagawa nilang paratang.
- source_word: τίς δύναται
  choice: Sino ang makapagpapatawad
  rationale: Natural na ipinahahayag sa Tagalog ang kakayahan o awtoridad sa pamamagitan ng hulaping makapag-.
- source_word: ἀφιέναι ἁμαρτίας
  choice: magpatawad ng mga kasalanan
  rationale: Sa kontekstong ito, ang ἀφίημι kasama ng ἁμαρτίας ay tumutukoy sa pagpapatawad, hindi lamang sa literal na pagpapalaya o pagpapaalis.
- source_word: εἰ μὴ εἷς ὁ θεός
  choice: maliban sa Diyos lamang
  rationale: Pinananatili nito ang eksklusibong diwa ng parirala sa natural na Tagalog, habang itinatala sa talababa ang posibleng pormal na pagbasa.
theological_decisions:
- issue: Tindi ng paghamak sa οὗτος
  choice: ang taong ito
  alternative: ang isang ito
  rationale: Ipinahihiwatig ng konteksto ang pagsalungat, ngunit hindi dapat palalain ng salin ang paghamak na higit sa malinaw na sinasabi ng Griyego.
- issue: Saklaw ng βλασφημεῖ
  choice: Lumalapastangan siya sa Diyos!
  alternative: Nagsasalita siya ng kalapastanganan!
  rationale: Nililinaw ng karaniwang gamit sa Tagalog ang likas na relihiyosong tudla ng paratang, ngunit hindi hinahatulan ng tagapagsalaysay kung tama ang mga eskriba; nananatili ang tensiyong kristolohikal ng salaysay.
- issue: Diwa ng εἷς ὁ θεός
  choice: Diyos lamang
  alternative: ang iisang Diyos
  rationale: Ang pangunahing teksto ay gumagamit ng pinakanatural na eksklusibong pahayag sa Tagalog. Ang alternatibo ay tunay na posible ayon sa anyong Griyego at kaya'y pinananatili sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “lumalapastangan sa Diyos” sa halip na mas teknikal o hindi gaanong likas na “namumusong,” at iniwasang dagdagan ang mapanlibak na tono ng mga eskriba.
