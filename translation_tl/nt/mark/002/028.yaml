  text: ὥστε κύριός ἐστιν ὁ υἱὸς τοῦ ἀνθρώπου καὶ τοῦ σαββάτου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/028.yaml
  text: So the Son of Man is Lord even of the Sabbath[a].
translation:
  language: tl
  text: Kaya ang Anak ng Tao ay Panginoon din ng Sabat[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Kaya ang Anak ng Tao ay Panginoon maging ng Sabat.” Ang salitang Griyego na καί ay maaaring isaling “din,” ngunit malamang na mariin dito ang diwang “maging,” na nagtatampok sa lawak ng kanyang kapangyarihan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Kaya
  rationale: Naghahayag ito ng konklusyon mula sa naunang pangangatuwiran. Likas at malinaw sa makabagong Tagalog ang “Kaya.”
- source_word: κύριος
  choice: Panginoon
  rationale: Tuwirang pinananatili ang diwa ng paghahari at kapangyarihan, pati ang mariing kristolohikal na pahayag tungkol sa Anak ng Tao.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Pinananatili ang nakaugaliang titulo ni Jesus at ang kaugnay nitong biblikal at kristolohikal na pahiwatig, sa halip na ipakahulugan ito bilang pangkalahatang pagtukoy lamang sa tao.
- source_word: καὶ
  choice: din
  rationale: Sa puwestong ito, maaaring mangahulugan ang καί ng “din” o ng mas mariing “maging.” Ang “din” ang pinakanatural sa pangunahing tekstong Tagalog, habang itinatala sa talababa ang posibleng mariing diin.
- source_word: σαββάτου
  choice: ng Sabat
  rationale: Ang “Sabat” ay maikli at kinikilalang katawagan sa itinakdang araw ng pamamahinga; pinananatili ng pariralang “Panginoon … ng Sabat” ang ugnayang genitibo at ang pahayag ng kapangyarihan dito.
theological_decisions:
- issue: Ang kristolohikal na bigat ng pag-aangkin ni Jesus ng kapangyarihan sa Sabat
  choice: Isinalin nang tuwiran bilang pahayag na ang Anak ng Tao ay Panginoon ng Sabat.
  alternative: “may kapangyarihan tungkol sa Sabat”
  rationale: Mas malakas sa limitadong pahintulot ang likas na diwa ng κύριος. Pinananatili ng salin ang pahayag ng pagka-Panginoon nang hindi nagdaragdag ng paliwanag na wala sa teksto.
- issue: Ang tinutukoy ng “Anak ng Tao”
  choice: Pinanatili bilang titulo na “ang Anak ng Tao.”
  alternative: “ang tao” o “ang isang tao” sa pangkalahatang diwa
  rationale: Sa Marcos, ginagamit ang parirala bilang pagtukoy ni Jesus sa kanyang sarili at maaari itong magtaglay ng mga alusyong biblikal. Hindi dapat lutasin ng salin ang sadyang teolohikal na tensiyong ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Sabat” bilang maikli at pamilyar na katawagan, at pinanatili ang tradisyonal na titulong “Anak ng Tao.”
