id: MRK.2.23
reference: Mark 2:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ⸂αὐτὸν ἐν τοῖς σάββασιν παραπορεύεσθαι⸃ διὰ τῶν σπορίμων, καὶ ⸂οἱ μαθηταὶ αὐτοῦ ἤρξαντο⸃ ὁδὸν ποιεῖν τίλλοντες τοὺς στάχυας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/023.yaml
  text: And it happened that on the Sabbath he was passing through the grainfields[a], and his disciples began to make their way[c][b], plucking the heads of grain.
translation:
  language: tl
  text: Isang Sabbath, habang dumaraan si Jesus sa mga bukirin ng butil[a], nagsimulang maglakad[c] ang mga alagad niya habang namimitas ng mga uhay[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga bukiring may nakatayong butil.” Hindi tinutukoy ng salitang Griyego kung anong uri ng butil iyon.
    reason: lexical_alternative
  - marker: b
    text: O “mga tangkay na may butil.”
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “nagsimulang gumawa ng daan.” Isang idyoma ito na nangangahulugang nagsimula silang magpatuloy sa paglakad sa bukid habang namimitas ng mga uhay.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: At nangyari
  rationale: Pinananatili ang pambungad na pormulang pasalaysay, ngunit gumagamit ng likas at makabagong Tagalog.
- source_word: ἐν τοῖς σάββασιν
  choice: isang Sabbath
  rationale: Bagaman nasa anyong maramihan ang Griyego, karaniwan itong idyomatikong tumutukoy sa isang araw ng Sabbath sa ganitong konteksto.
- source_word: παραπορεύεσθαι
  choice: dumaan
  rationale: Malinaw at natural na ipinahahayag ang pagdaan sa loob ng mga bukirin nang hindi dinaragdagan ang kahulugan.
- source_word: διὰ τῶν σπορίμων
  choice: sa mga bukirin ng trigo
  rationale: Ang σπόριμα ay mga tanimang may butil; ang 'bukirin ng trigo' ay madaling maunawaan sa Tagalog, bagaman hindi tiyak sa salita mismo na trigo ang uri ng butil.
- source_word: ὁδὸν ποιεῖν
  choice: Habang naglalakad
  rationale: Idyomatikong ipinahahayag ang pagpapatuloy nila sa bukid at iniiwasang ipahiwatig na literal silang gumagawa ng daan.
- source_word: τίλλοντες
  choice: pumitas
  rationale: Natural na pandiwa sa Tagalog para sa pagkuha o pagkalag ng mga uhay mula sa halaman.
- source_word: τοὺς στάχυας
  choice: mga uhay
  rationale: Ang 'uhay' ang tiyak at maikling katawagan sa bahaging naglalaman ng mga butil.
- source_word: αὐτὸν
  choice: si Jesus
  rationale: Ginawang tahasan ang tinutukoy ng panghalip upang maging malinaw at natural sa isang talatang binabasa nang hiwalay; walang idinagdag na bagong tauhan sa konteksto.
theological_decisions:
- issue: Terminolohiya para sa Sabbath
  choice: isang Sabbath
  alternative: sa mga Sabbath
  rationale: Ipinapakita ng konteksto na isang partikular na araw ang tinutukoy; ang maramihang anyo sa Koine Greek ay maaaring gamiting idyomatiko para sa iisang Sabbath.
- issue: Kahulugan ng ὁδὸν ποιεῖν kaugnay ng pagtatalo tungkol sa Sabbath
  choice: Habang naglalakad
  alternative: nagsimulang gumawa ng daan
  rationale: Hindi ipinahihiwatig ng konteksto na gumagawa sila ng kalsada o landas. Ang idyoma ay tumutukoy sa paglakad o pagpapatuloy nila habang pumipitas, kaya hindi pinalalaki ang gawaing magiging paksa ng pagtatalo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Sabbath” dahil ito ang kilalang terminong biblikal sa Filipino. Inayos nang bahagya ang ayos ng sugnay upang natural na maiugnay ang paglalakad at pagpitas, habang pinananatili sa talababa ang literal na anyo at tunay na leksikal na mga alternatibo.
