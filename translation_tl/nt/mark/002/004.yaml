base_translation:
  language: en
  yaml_path: translation/nt/mark/002/004.yaml
  text: And not being able to bring him to him because of the crowd[a], they removed the roof where he was, and after digging through it[c][b], they lower the mat on which the paralyzed man was lying.
translation:
  language: tl
  text: At hindi nila siya mailapit kay Jesus dahil sa karamihan ng tao, kaya binaklas nila ang bubong sa lugar kung saan naroroon si Jesus. Matapos nilang butasin iyon, ibinaba nila ang higaan na hinihigaan noon ng lalaking paralisado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “ang paralisado.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ δυνάμενοι
  choice: dahil hindi nila ... mailapit
  rationale: Ipinahahayag nang natural sa Tagalog ang sirkumstansiyang sanhi ng sumunod nilang ginawa.
- source_word: προσενέγκαι αὐτῷ
  choice: siya mailapit kay Jesus
  rationale: Nililinaw ang dalawang magkaibang tinutukoy ng mga panghalip sa Griyego—ang lalaking paralisado at si Jesus—nang hindi nagiging malabo o paulit-ulit sa Tagalog.
- source_word: διὰ τὸν ὄχλον
  choice: dahil sa dami ng tao
  rationale: Natural na katumbas sa konteksto ng hadlang na dulot ng nagkakatipong πλήθος o crowd.
- source_word: ἀπεστέγασαν τὴν στέγην
  choice: binaklas nila ang bubong
  rationale: Ipinahihiwatig ng pambihirang pandiwa ang pag-aalis o pagbubukas sa pantakip ng bubong; ang 'binaklas' ay malinaw at angkop sa karaniwang bubong noong panahong iyon nang hindi tinutukoy ang materyales.
- source_word: ὅπου ἦν
  choice: sa tapat ng kinaroroonan niya
  rationale: Ginagawang hayag sa natural na Tagalog ang lokasyong patayo na ipinahihiwatig ng konteksto ng bubong.
- source_word: ἐξορύξαντες
  choice: matapos butasin iyon
  rationale: Inilalarawan ang pagbubukas sa bubong matapos baklasin ang pantakip, nang hindi nagdaragdag ng tiyak na materyales.
- source_word: χαλῶσι
  choice: ibinaba nila
  rationale: Ang makasaysayang pangkasalukuyan sa Griyego ay karaniwang isinasalin sa nagdaang aspekto sa tuloy-tuloy na salaysay sa Tagalog; pinananatili ang mismong kilos ng pagpapababa.
- source_word: κράβαττον
  choice: higaan
  rationale: Tumutukoy sa payak at nabubuhat na higaan; mas natural at marangal sa modernong Tagalog kaysa sa 'banig,' na maaaring maging labis na espesipiko.
- source_word: ὁ παραλυτικὸς
  choice: lalaking paralisado
  rationale: Natural na substantibong paglalarawan sa modernong Tagalog na pinananatili ang kasarian at kalagayang ipinahahayag ng Griyego.
- source_word: ὅπου ὁ παραλυτικὸς κατέκειτο
  choice: na kinahihigaan ng lalaking paralisado
  rationale: Iniuugnay nang natural ang sugnay sa higaan, gaya ng hinihingi ng konteksto.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “kay Jesus” sa halip na dalawang magkasunod na panghalip upang maiwasan ang kalabuan habang pinananatili ang dalawang referent ng Griyego. Ang footnote marker [a] ay nasa pangunahing teksto.
