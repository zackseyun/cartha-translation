revisions:
- from: At dahil hindi nila siya mailapit kay Jesus dahil sa dami ng tao, binaklas nila ang bubong sa tapat ng kinaroroonan niya. Matapos butasin iyon, ibinaba nila ang higaan na kinahihigaan ng lalaking paralisado.[a]
  to: At hindi nila siya mailapit kay Jesus dahil sa karamihan ng tao, kaya binaklas nila ang bubong sa lugar kung saan naroroon si Jesus. Matapos nilang butasin iyon, ibinaba nila ang higaan na hinihigaan noon ng lalaking paralisado.[a]
  rationale: Inalis ang “sa tapat” upang huwag magdagdag ng direksiyong wala sa ὅπου ἦν, at nilinaw ang referent bilang si Jesus. Pinanatili ang sanhi ng hindi nila paglapit, ang pagbabaklas at pagbubutas ng bubong, at ang pagpapababa ng higaan. Ang “noon” ay tumutulong magpahiwatig ng patuloy na kalagayang ipinahahayag ng κατέκειτο.
