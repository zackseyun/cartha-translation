id: MRK.2.2
reference: Mark 2:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀καὶ συνήχθησαν πολλοὶ ὥστε μηκέτι χωρεῖν μηδὲ τὰ πρὸς τὴν θύραν, καὶ ἐλάλει αὐτοῖς τὸν λόγον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/002.yaml
  text: And many were gathered together[a], so that there was no longer room, not even at the door, and he was speaking the word to them.
translation:
  language: tl
  text: At maraming tao ang nagkatipon, kaya wala nang lugar, kahit sa may pintuan, at ipinapahayag niya sa kanila ang salita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mensahe.” Sa Griyego, “ang salita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν
  choice: nagkatipon
  rationale: Likas sa modernong Tagalog at malinaw na nagsasaad na sama-samang nagtipon ang mga tao; hindi kailangang piliting panatilihin ang anyong pasibo ng Griyego kung magiging alanganin ito sa Tagalog.
- source_word: πολλοὶ
  choice: maraming tao
  rationale: Ang pang-uri ay ginagamit bilang pangngalan sa Griyego. Nilinaw ng “tao” ang ipinahihiwatig na tinutukoy nang hindi dinaragdagan ang diwa.
- source_word: ὥστε
  choice: kaya
  rationale: Malinaw at natural na ipinapakita ang bunga ng pagkatipon ng maraming tao.
- source_word: μηκέτι χωρεῖν
  choice: wala nang lugar
  rationale: Ipinahahayag nang idiomatiko ang pagkaubos ng espasyong mapagkakasyahan, kasama ang diwa ng μηκέτι na “hindi na.”
- source_word: μηδὲ τὰ πρὸς τὴν θύραν
  choice: kahit sa may pintuan
  rationale: Natural na tumutukoy sa lugar sa bandang pintuan at pinananatili ang diin na maging ang bahaging iyon ay wala nang espasyo.
- source_word: ἐλάλει
  choice: ipinapahayag niya
  rationale: Ang aspektong imperpektibo ng “ipinapahayag” ay angkop sa nagpapatuloy na kilos. Higit itong natural kaysa sa literal na “sinasalita niya” at hindi kasing-tiyak sa anyo ng gawain ng “ipinangangaral.”
- source_word: αὐτοῖς
  choice: sa kanila
  rationale: Pinananatili ang panghalip ng Griyego at ang pagtukoy nito sa mga nagkatipon.
- source_word: τὸν λόγον
  choice: ang salita
  rationale: Pinananatili ang lantad na katawagan ng Griyego at hindi idinaragdag ang “ng Diyos,” na wala sa talata. Inilalagay sa talababa ang natural na alternatibong “mensahe.”
theological_decisions:
- issue: Kahulugan ng τὸν λόγον sa ipinapahayag ni Jesus
  choice: ang salita
  alternative: ang mensahe; ang salita ng Diyos
  rationale: Ang “salita” ang pinakamalapit sa mismong pananalita ng teksto at pinananatili ang saklaw ng kahulugan nito. Ang “mensahe” ay lehitimong paglilinaw ngunit mas dinamikong salin, samantalang ang “ng Diyos” ay teolohikal na posibleng maunawaan ngunit hindi hayagang nakasaad rito.
translation_notes:
  register: Gumamit ng kasalukuyan, malinaw, at marangal na Tagalog. Ang “sa may pintuan” ay karaniwang ekspresyon para sa espasyong malapit sa pintuan, at ang imperpektibong “ipinapahayag” ay nagpapanatili sa nagpapatuloy na kilos ng Griyego.
