id: MRK.2.1
reference: Mark 2:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ⸀εἰσελθὼν πάλιν εἰς Καφαρναοὺμ δι’ ⸀ἡμερῶν ἠκούσθη ὅτι ⸂ἐν οἴκῳ⸃ ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/001.yaml
  text: And when he entered Capernaum again after some days[a], it was heard that he was at home.
translation:
  language: tl
  text: Nang muli siyang pumasok sa Capernaum makalipas ang ilang araw, nabalitang nasa bahay[a] siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, nasa isang bahay.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν
  choice: nang … pumasok
  rationale: Ang aorist participle ay ginawang sugnay na temporal upang maging natural sa Tagalog habang pinananatili ang kaugnayan nito sa pangunahing pandiwa.
- source_word: πάλιν
  choice: muli
  rationale: Karaniwang katumbas sa Tagalog na malinaw na nagsasaad ng pag-uulit o pagbabalik.
- source_word: Καφαρναούμ
  choice: Capernaum
  rationale: Ginamit ang nakaugaliang transliterasyon ng pangalan ng lugar sa mga saling Filipino.
- source_word: δι’ ἡμερῶν
  choice: makalipas ang ilang araw
  rationale: Natural na pagpapahayag sa modernong Tagalog ng di-tiyak na agwat ng mga araw.
- source_word: ἠκούσθη
  choice: nabalitang
  rationale: Pinananatili ang di-tahasang pormula ng pag-uulat ng pasibong Griyego nang hindi nagdaragdag ng tiyak na tagapagbalita.
- source_word: ἐν οἴκῳ
  choice: nasa bahay
  rationale: Natural sa Tagalog at maaari ring tumukoy sa pagiging nasa tahanan; inilalahad sa talababa ang posibleng di-personal na kahulugang ‘nasa isang bahay.’
- source_word: ἐστίν
  choice: siya
  rationale: Hindi kailangang tahasang isalin ang copula sa sugnay na lokatibo sa Tagalog; ang panghalip ang nagpapanatili sa tinutukoy na persona.
theological_decisions:
- issue: Kung ang ἐν οἴκῳ ay nangangahulugang ‘nasa tahanan’ o basta ‘nasa isang bahay.’
  choice: nasa bahay
  alternative: nasa isang bahay
  rationale: Ang parirala ay maaaring idiomatikong tumukoy sa tahanan ngunit hindi tiyak na pag-aari ni Jesus ang bahay. Pinanatili ang mas pangkalahatang posibilidad sa talababa upang hindi lutasin nang labis ang tunay na kalabuan.
translation_notes:
  register: Modernong, malinaw, at marangal na Filipino. Hindi idinagdag ang pangalang Jesus sapagkat panghalip ang nasa Griyego at malinaw ang tinutukoy mula sa konteksto. Inilagay ang marker sa ‘bahay,’ ang mismong salitang tinutukoy ng talababa.
