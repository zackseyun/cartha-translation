id: MRK.2.8
reference: Mark 2:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἐπιγνοὺς ὁ Ἰησοῦς τῷ πνεύματι αὐτοῦ ὅτι ⸀οὕτως διαλογίζονται ἐν ἑαυτοῖς ⸀λέγει αὐτοῖς· Τί ταῦτα διαλογίζεσθε ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/008.yaml
  text: And immediately Jesus[a], perceiving in his spirit that they were reasoning this way within themselves, said to them, “Why are you reasoning about these things in your hearts?”
translation:
  language: tl
  text: Agad na nabatid ni Jesus sa kanyang espiritu[a] na ganito ang pangangatwiran nila sa loob-loob nila, at sinabi niya sa kanila, “Bakit ninyo iniisip ang mga bagay na ito sa inyong mga puso?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa pamamagitan ng kanyang espiritu” o “sa kanyang kalooban.” Hindi tahasang tinutukoy ng Griyego kung paano nabatid ni Jesus ang kanilang iniisip.
    reason: Pinananatili ang posibleng saklaw o instrumental na kahulugan ng τῷ πνεύματι αὐτοῦ nang hindi nilulutas ang paraang ipinahihiwatig nito.
lexical_decisions:
- source_word: εὐθὺς
  choice: Agad
  rationale: Pinananatili nito ang mabilis at masiglang daloy na katangian ng salaysay ni Marcos, at likas ito sa makabagong Filipino.
- source_word: ἐπιγνοὺς
  choice: nabatid
  rationale: Ipinahahayag nito ang malinaw na pagkaalam o pagkilala ni Jesus nang hindi tiyakang ipinapaliwanag kung paano niya nalaman iyon.
- source_word: τῷ πνεύματι αὐτοῦ
  choice: sa kanyang espiritu
  rationale: Malapit ito sa anyo ng Griyego at hindi nagpapasya kung ang dative ay tumutukoy sa saklaw o paraan ng pagkaunawa.
- source_word: οὕτως διαλογίζονται ἐν ἑαυτοῖς
  choice: ganito ang pangangatwiran nila sa loob-loob nila
  rationale: Ang “pangangatwiran” ay nagpapanatili sa diwa ng panloob na pagsusuri o pag-uusisa, samantalang nililinaw ng “sa loob-loob nila” na hindi ito pasalitang pagtatalo.
- source_word: Τί ταῦτα διαλογίζεσθε
  choice: Bakit ninyo pinag-iisipan ang mga bagay na ito
  rationale: Sa tanong na ito, natural na katumbas ng τί ang “bakit.” Ang “pinag-iisipan” ay malinaw at karaniwang Filipino para sa panloob na pangangatwiran, nang hindi nagpapahiwatig ng hayagang debate.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: sa inyong mga puso
  rationale: Pinananatili ang biblikal na larawan ng puso bilang sentro ng pag-iisip, hangarin, at panloob na pagkatao, pati ang anyong maramihan.
theological_decisions:
- issue: Ang likas na katangian ng pagkaalam ni Jesus sa pariralang τῷ πνεύματι αὐτοῦ
  choice: Panatilihin ang “sa kanyang espiritu” at sabihing nabatid ni Jesus ang kanilang panloob na pangangatwiran nang hindi tinutukoy ang eksaktong paraan.
  alternative: Ipaliwanag ito bilang tuwirang pahayag ng banal na pagkaalam sa lahat, o bilang karaniwang matalas na kutob lamang ng tao.
  rationale: Malinaw sa talata na alam ni Jesus ang kanilang panloob na pangangatwiran, ngunit hindi tahasang nililinaw ng pariralang Griyego kung banal na pagkaalam sa lahat, pagkaunawang dulot ng Espiritu, o malalim na panloob na pagkilala ang binibigyang-diin. Pinananatili ng salin ang tunay na teolohikal na tensiyon.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “sa loob-loob nila” para sa likas na pagpapahayag ng panloob na pag-iisip, habang pinanatili ang “mga puso” bilang mahalagang biblikal na larawan.
