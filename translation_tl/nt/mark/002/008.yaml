revisions:
- from: Agad na nabatid ni Jesus sa kanyang espiritu[a] na ganito ang pangangatwiran nila sa loob-loob nila, kaya sinabi niya sa kanila, “Bakit ninyo pinag-iisipan ang mga bagay na ito sa inyong mga puso?”
  to: Agad na nabatid ni Jesus sa kanyang espiritu[a] na ganito ang pangangatwiran nila sa loob-loob nila, at sinabi niya sa kanila, “Bakit ninyo iniisip ang mga bagay na ito sa inyong mga puso?”
  rationale: Pinalitan ang pangatnig na “kaya” ng “at” upang huwag magdagdag ng ugnayang sanhi na hindi tahasang nasa Griyego. Pinadali rin ang pandiwang nasa tanong sa “iniisip” para sa likas na makabagong Filipino, nang hindi binabawasan ang diwa ng panloob na pangangatwiran. Nananatili ang “sa kanyang espiritu” at “mga puso” upang maingatan ang pananalita at teolohikal na di-pagpapasya ng pinagmulan.
