  verdict: revise
  source_fidelity: Ang "Nang makita ni Jesus ang kanilang pananampalataya" ay tapat sa participial na ἰδὼν at sa maramihang αὐτῶν. Ang "sinabi niya" ay katanggap-tanggap na naturalisasyon ng historical present na λέγει. Gayunman, ang "pinatatawad na" ay karaniwang nagpapahiwatig sa Filipino ng nagpapatuloy na proseso ng pagpapatawad, samantalang ang Griyegong ἀφίενται ay isang deklaratibong present passive na nagsasaad na ang mga kasalanan ay napatawad. Ang "pinatawad na" ang mas malinaw na katumbas nang hindi pinapangalanan ang gumagawa.
  naturalness: Likas at marangal ang "lalaking paralisado" at ang magiliw na pantawag na "Anak." Mas idiomatiko at mas malinaw sa ganitong pahayag ang "Pinatawad na ang mga kasalanan mo" kaysa "Pinatatawad na ang mga kasalanan mo."
  terminology: Wasto ang "pananampalataya," "kasalanan," at "lalaking paralisado." Ang tala na nagmumungkahi ng "Anak ko" ay nagdaragdag ng "ko" na wala sa τέκνον; ang "Iho" ay isang posibleng natural na alternatibo sa kontekstong lalaki, ngunit may panlalaking kulay na hindi nasa mismong salitang Griyego.
