base_translation:
  language: en
  yaml_path: translation/nt/mark/002/005.yaml
  text: And Jesus[a], seeing their faith, says to the paralyzed man, “Child, your sins are forgiven.”
translation:
  language: tl
  text: Nang makita ni Jesus ang kanilang pananampalataya, sinabi niya sa lalaking paralisado, “Anak[a], pinatawad na ang mga kasalanan mo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Iho”; ang Griyegong τέκνον ay isang magiliw na pantawag na nangangahulugang “anak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: Nang makita
  rationale: Likas na naipahahayag sa Tagalog ang aorist participle bilang sugnay na nagsasaad ng pangyayaring kaugnay ng pangunahing pandiwa.
- source_word: πίστιν
  choice: pananampalataya
  rationale: Karaniwang katumbas ng πίστις at dito ay tumutukoy sa nakikitang pagtitiwala ng pangkat kay Jesus.
- source_word: αὐτῶν
  choice: kanilang
  rationale: Pinananatili ang maramihang panghalip at ang posibilidad na kabilang sa tinutukoy ang lalaking paralisado at ang mga nagdala sa kaniya.
- source_word: λέγει
  choice: sinabi niya
  rationale: Bagaman historical present ang Griyego, mas natural sa makabagong salaysay sa Tagalog ang pangnagdaan; hindi nito binabago ang nilalaman ng sinabi.
- source_word: παραλυτικῷ
  choice: lalaking paralisado
  rationale: Malinaw at kasalukuyang pananalita para sa substantival adjective na tumutukoy sa isang lalaking hindi maigalaw nang normal ang katawan.
- source_word: Τέκνον
  choice: Anak
  rationale: Natural at magiliw na pantawag sa Tagalog; hindi nito kailangang ipahiwatig na literal na anak o partikular na lalaki ang kausap.
- source_word: ἀφίενταί σου αἱ ἁμαρτίαι
  choice: pinatatawad na ang mga kasalanan mo
  rationale: Pinananatili ang pasibong pahayag at ang kasalukuyang bisa ng kapatawaran, nang hindi tahasang pinapangalanan ang kumikilos.
- source_word: ἁμαρτίαι
  choice: mga kasalanan
  rationale: Karaniwang salin at pinananatili ang maramihang anyo.
theological_decisions:
- issue: Kalikasan at panahon ng pahayag ni Jesus tungkol sa kapatawaran
  choice: pinatatawad na ang mga kasalanan mo
  alternative: pinatawad na ang mga kasalanan mo
  rationale: Ang anyong kasalukuyang pasibo sa Griyego ay ipinahahayag bilang isang umiiral na katotohanan. Iniiwasan ng salin na tukuyin nang higit sa teksto ang mekanismo, panahon, o di-binanggit na gumagawa ng pagpapatawad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lalaking paralisado” sa halip na mas teknikal o makalumang “paralitiko,” at ang “Anak” bilang natural na magiliw na pantawag.
