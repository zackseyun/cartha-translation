    rationale: 'Ang present passive na ἀφίενται sa pahayag na ito ay mas mahusay na naihahayag sa Filipino bilang natupad nang deklarasyon: "Pinatawad na ang mga kasalanan mo." Hindi nito idinaragdag ang ahensiya o mekanismo ng kapatawaran.'
  - severity: low
    issue: Ang footnote na "Anak ko" ay nagdaragdag ng unang panauhang pagmamay-ari na wala sa Griyego.
    rationale: Ang τέκνον ay magiliw na pantawag ngunit walang μου. Mas mainam ang alternatibong "Iho," na malinaw na pangkonteksto para sa lalaking kausap at minamarkahan ang panlalaking nuance nito.
  revised_text: Nang makita ni Jesus ang kanilang pananampalataya, sinabi niya sa lalaking paralisado, “Anak[a], pinatawad na ang mga kasalanan mo.”
