  text: ⸀Οὐδεὶς ἐπίβλημα ῥάκους ἀγνάφου ἐπιράπτει ἐπὶ ⸂ἱμάτιον παλαιόν⸃· εἰ δὲ μή, αἴρει τὸ πλήρωμα ⸀ἀπ’ αὐτοῦ τὸ καινὸν τοῦ παλαιοῦ, καὶ χεῖρον σχίσμα γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/021.yaml
  text: No one sews a patch of unshrunk cloth onto an old garment[a]; otherwise[b], the patch pulls away from it—the new from the old—and a worse tear results.
translation:
  language: tl
  text: Walang nagtatahi ng tagpi ng telang hindi pa napaliit sa lumang damit[a]. Kung hindi, kakalas mula rito ang tagpi—ang bago mula sa luma—at lalo pang lalaki ang punit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “telang hindi pa na-full.” Ang salitang Griyego ay tumutukoy sa telang hindi pa napoproseso upang lumiit at kaya maaari pang umurong kapag ginamit na tagpi.
    reason: lexical_alternative
  - marker: b
    text: 'Mas literal: “inaalis ng ipinampuno mula rito ang bago mula sa luma.” Ang diwa ay kakalas ang bagong tagpi mula sa lumang damit kaya lalong lalaki ang punit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίβλημα
  choice: tagpi
  rationale: Ang “tagpi” ang likas at tiyak na salitang Filipino para sa piraso ng telang itinatahi upang takpan o ayusin ang punit.
- source_word: ῥάκους ἀγνάφου
  choice: telang hindi pa umurong
  rationale: Ipinahihiwatig ng ἄγναφος ang telang hindi pa napoproseso nang lubos at maaari pang umurong. Malinaw sa karaniwang mambabasa ang praktikal na epekto nito nang hindi nililimitahan sa isang partikular na sinaunang paraan ng pagproseso.
- source_word: ἐπιράπτει
  choice: nagtatahi ... sa
  rationale: Tuwirang inilalarawan nito ang pagkakabit ng tagpi sa damit sa pamamagitan ng pagtahi at natural ang ayos sa Filipino.
- source_word: ἱμάτιον παλαιόν
  choice: lumang damit
  rationale: Sapat na malawak ang “damit” para sa ἱμάτιον at hindi nito labis na tinutukoy kung anong uri ng kasuotan iyon.
- source_word: εἰ δὲ μή
  choice: Kung gagawin iyon
  rationale: Sa konteksto, ipinakikilala nito ang masamang bunga ng nabanggit na gawain. Mas natural ito sa Filipino kaysa sa literal ngunit malabong “kung hindi.”
- source_word: αἴρει
  choice: hihiwalay
  rationale: Sa larawan ng pananahi, ang diwa ay kumakalas o humihiwalay ang bagong tagpi mula sa lumang damit. Pinananatili nito ang resulta nang hindi pinipilit ang literal na “inaalis.”
- source_word: τὸ πλήρωμα
  choice: ang tagpi
  rationale: Ang tinutukoy ay ang pirasong ipinantatakip o ipinampupuno sa punit; “tagpi” ang malinaw na katumbas sa konteksto.
- source_word: τὸ καινὸν τοῦ παλαιοῦ
  choice: ang bago mula sa luma
  rationale: Pinananatili ang maigsi at matinding paghahambing ng Griyego sa pagitan ng bago at luma, habang malinaw sa naunang sugnay na tagpi at damit ang tinutukoy.
- source_word: χεῖρον σχίσμα γίνεται
  choice: lalo pang lalaki ang punit
  rationale: 'Natural na inilalarawan sa Filipino ang kinalabasan: nagiging mas malaki at mas malala ang dating punit.'
