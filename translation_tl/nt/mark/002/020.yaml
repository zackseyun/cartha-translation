  terminology: Ang “lalaking ikakasal” ay isang malinaw na makabagong Filipino para sa νυμφίος at pinananatili ang talinghaga. Ang “mag-aayuno” ay angkop at nakasanayan para sa νηστεύσουσιν. Napananatili ang isahang “araw” para sa ἐν ἐκείνῃ τῇ ἡμέρᾳ.
