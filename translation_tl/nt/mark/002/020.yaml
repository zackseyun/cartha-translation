  text: ἐλεύσονται δὲ ἡμέραι ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος, καὶ τότε νηστεύσουσιν ἐν ⸂ἐκείνῃ τῇ ἡμέρᾳ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/020.yaml
  text: But days will come when the bridegroom is taken away from them[a], and then they will fast in that day.
translation:
  language: tl
  text: Ngunit darating ang mga araw kapag kukunin mula sa kanila ang lalaking ikakasal, at saka sila mag-aayuno sa araw na iyon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλεύσονται δὲ ἡμέραι
  choice: Ngunit darating ang mga araw
  rationale: Likas na Filipino para sa idyomang nagsasaad ng mga araw na darating; ipinahahayag ng “Ngunit” ang pagsalungat sa kasalukuyang kalagayan sa naunang talata.
- source_word: ὅταν
  choice: na
  rationale: Sa pariralang “ang mga araw na,” likas nitong ipinapasok ang pangyayaring magaganap sa hinaharap nang hindi nagbibigay ng paulit-ulit na diwang maaaring idulot ng “tuwing.”
- source_word: ἀπαρθῇ ἀπ’ αὐτῶν
  choice: kukunin sa kanila
  rationale: Pinananatili ang pasibong diwa at ang paghihiwalay, habang hindi tinutukoy ang gumagawa o ang eksaktong paraan ng pagkuha.
- source_word: ὁ νυμφίος
  choice: ang lalaking ikakasal
  rationale: Malinaw at kasalukuyang Filipino para sa lalaking nasa papel ng kasintahang ikakasal, at pinananatili ang talinghaga ng kasalan.
- source_word: καὶ τότε
  choice: at ... ay
  rationale: Ipinakikita ng ayos ng pangungusap na kasunod ng pagkuha sa lalaking ikakasal ang pag-aayuno; ang “sa araw na iyon” ang tahasang panandang panahunan.
- source_word: νηστεύσουσιν
  choice: mag-aayuno sila
  rationale: Direktang salin ng hinaharap na anyo ng νηστεύω at karaniwang terminong Filipino para sa gawaing panrelihiyon.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: sa araw na iyon
  rationale: Pinananatili ang isahan ng Griyego at natural na ipinahahayag sa Filipino ang tiyak na araw.
theological_decisions:
- issue: Matalinghagang pagkakakilanlan kay Jesus bilang lalaking ikakasal
  choice: Pinanatili ang “ang lalaking ikakasal” bilang talinghaga nang hindi tahasang pinapalitan ng “ako.”
  alternative: “kapag kinuha na ako sa kanila”
  rationale: Bagaman malinaw sa konteksto na tinutukoy ni Jesus ang sarili, talinghaga ang ginamit ng Griyego; pinananatili nito ang pampanitikan at teolohikal na lakas ng pahayag.
- issue: Kalikasan ng pagkuha sa lalaking ikakasal
  choice: Ginamit ang pasibong “kukunin sa kanila” nang hindi tinutukoy ang tagagawa o ang paraan.
  alternative: “kukunin sa kanila sa pamamagitan ng kamatayan”
  rationale: Maaaring tumukoy ito sa nalalapit na kamatayan ni Jesus, ngunit hindi tahasang sinasabi rito ng teksto ang tagagawa o paraan; hindi iyon nilutas sa salin.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “lalaking ikakasal” sa halip na mas teknikal o makalumang katawagan. Walang talababa sapagkat ang isahang ἐκείνῃ τῇ ἡμέρᾳ ay malinaw na naipahayag bilang “sa araw na iyon.”
