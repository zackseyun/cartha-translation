id: MRK.2.19
reference: Mark 2:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μὴ δύνανται οἱ υἱοὶ τοῦ νυμφῶνος ἐν ᾧ ὁ νυμφίος μετ’ αὐτῶν ἐστιν νηστεύειν; ὅσον χρόνον ⸂ἔχουσιν τὸν νυμφίον μετ’ αὐτῶν⸃ οὐ δύνανται νηστεύειν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/019.yaml
  text: And Jesus said to them[a], “The wedding guests cannot fast while the bridegroom is with them, can they? As long as they have the bridegroom with them, they cannot fast.”
translation:
  language: tl
  text: At sinabi sa kanila ni Jesus, “Hindi makapag-aayuno ang mga panauhin sa kasalan[a] habang kasama nila ang lalaking ikakasal, hindi ba? Hangga't kasama nila ang lalaking ikakasal, hindi sila makapag-aayuno.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na, “ang mga anak ng bulwagan ng kasalan” o “ang mga anak ng silid-pangkasal,” isang idyoma para sa mga nakikibahagi sa pagdiriwang ng kasal.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ δύνανται ... νηστεύειν;
  choice: Makapag-aayuno ba ...?
  rationale: Ang μή na may indikatibo ay nagpapakilala ng retorikal na tanong na umaasang ‘hindi’ ang sagot. Likas sa Filipino ang anyong ‘Makapag-aayuno ba...?’ at nililinaw ng kasunod na pangungusap ang inaasahang negatibong sagot.
- source_word: οἱ υἱοὶ τοῦ νυμφῶνος
  choice: ang mga panauhin sa kasalan
  rationale: Idyoma itong literal na ‘mga anak ng bulwagan/silid-pangkasal’ para sa mga nakikibahagi sa pagdiriwang ng kasal. Ang ‘mga panauhin sa kasalan’ ay malinaw at hindi labis na nililimitahan ang tinutukoy sa mga abay lamang.
- source_word: ἐν ᾧ ... ἐστιν
  choice: habang kasama nila
  rationale: Temporal ang diwa ng konstruksiyon dito; natural na ipinahahayag ito ng ‘habang’ sa Filipino.
- source_word: ὁ νυμφίος / τὸν νυμφίον
  choice: ang lalaking ikakasal
  rationale: Karaniwan at malinaw na modernong Filipino ito para sa bridegroom, at pinananatili ang larawang pangkasal nang hindi nagdaragdag ng interpretasyon.
- source_word: μετ’ αὐτῶν
  choice: kasama nila
  rationale: Tuwirang ipinahahayag nito ang diwa ng pagsama ng μετά na may genitive.
- source_word: ὅσον χρόνον
  choice: Hangga't
  rationale: Natural na panandang Filipino ito para sa tagal na tinutukoy ng parirala.
- source_word: ἔχουσιν τὸν νυμφίον μετ’ αὐτῶν
  choice: kasama nila ang lalaking ikakasal
  rationale: Bagaman literal na gumagamit ang Griyego ng ‘mayroon sila,’ magiging pilit sa Filipino ang gayong anyo. Ang ‘kasama nila’ ay natural at tapat sa pangunahing diwa ng presensiya at pakikisama.
- source_word: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς
  choice: At sinabi sa kanila ni Jesus
  rationale: Tuwiran, natural, at marangal na panimulang salaysay sa Filipino.
theological_decisions:
- issue: Matalinghagang pagkakakilanlan ni Jesus bilang lalaking ikakasal
  choice: Panatilihin ang larawang ‘lalaking ikakasal’ nang hindi tahasang ipinapaliwanag ang teolohikal na implikasyon nito.
  alternative: Isalin nang mas interpretatibo upang idiin ang mesiyanikong simbolismo ng lalaking ikakasal.
  rationale: Ginagamit ng talata ang larawan ng lalaking ikakasal para kay Jesus, ngunit hindi dapat idagdag ng salin ang paliwanag na hindi tahasang sinasabi ng teksto. Hinahayaan nitong manatili ang tunay na teolohikal na pahiwatig at tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang ‘kasalan’ bilang natural na tawag sa pagdiriwang at ‘lalaking ikakasal’ sa halip na mas kolokyal o mas tiyak na katawagan. Pinanatili ang retorikal na tanong at ang pag-uulit ng imaheng pangkasal.
