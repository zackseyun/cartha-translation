  text: ἵνα δὲ εἰδῆτε ὅτι ἐξουσίαν ἔχει ὁ υἱὸς τοῦ ἀνθρώπου ⸂ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας⸃— λέγει τῷ παραλυτικῷ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/010.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins—he says to the paralyzed man[b][a],
translation:
  language: tl
  text: Ngunit upang malaman ninyo na ang Anak ng Tao[a] ay may awtoridad sa lupa na magpatawad ng mga kasalanan—sinasabi niya sa lalaking paralisado[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Griyegong titulong “Anak ng Tao” ay maaari ring magtaglay ng idiomatikong diwa ng pagiging tao at posibleng alusyon sa Daniel 7.
    reason: alternative_reading
  - marker: b
    text: O “paralitiko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ
  choice: Ngunit upang
  rationale: Pinananatili ng “ngunit” ang banayad na pagsalungat o paglipat ng diwa ng δέ, at ng “upang” ang layuning ipinahihiwatig ng ἵνα.
- source_word: εἰδῆτε
  choice: malaman ninyo
  rationale: Direkta at natural itong katumbas ng pandiwang tumutukoy sa kaalamang mapatutunayan ng kasunod na pagpapagaling.
- source_word: ἐξουσίαν ἔχει
  choice: may awtoridad
  rationale: Ipinahihiwatig ng ἐξουσία ang lehitimong karapatan o kapamahalaan, hindi lamang ang kakayahang gumawa ng isang bagay.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Ito ang kinikilalang salin ng sariling katawagan ni Jesus at pinananatili nito ang posibleng alusyon sa Daniel 7 at ang kaugnay na teolohikal na lalim.
- source_word: ἐπὶ τῆς γῆς
  choice: sa lupa
  rationale: Natural itong tumutukoy sa makalupang saklaw kung saan isinasagawa ang awtoridad, na maaaring ihambing sa makalangit na saklaw.
- source_word: ἀφιέναι ἁμαρτίας
  choice: na magpatawad ng mga kasalanan
  rationale: Sa kontekstong ito, ang ἀφίημι ay nangangahulugang magpatawad o magpawalang-sala sa mga kasalanan.
- source_word: λέγει τῷ παραλυτικῷ
  choice: sinabi niya sa lalaking paralisado
  rationale: Ang “lalaking paralisado” ay malinaw at magalang na makabagong pananalita. Isinalin sa karaniwang panahong nagdaan ang makasaysayang pangkasalukuyan ng Griyego upang maging natural ang salaysay sa Filipino.
theological_decisions:
- issue: Pagkasalin sa titulong ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  alternative: ang Taong Ito / ang Kinatawan ng Sangkatauhan
  rationale: Pinananatili ang tradisyonal at malapit-sa-tekstong titulo upang hindi ipasiya kung ang diin ay nasa pagiging tao, pagka-Mesiyas, o apokaliptikong katauhan ng Daniel 7.
- issue: Kahulugan ng ἐξουσία kaugnay ng pagpapatawad ng mga kasalanan
  choice: awtoridad
  alternative: kapangyarihan / karapatan
  rationale: Ang usapin ay ang lehitimong kapamahalaan ni Jesus na magpatawad, hindi lamang ang kakayahan niyang gawin ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “awtoridad” upang maiba ang lehitimong kapamahalaan sa pangkalahatang “kapangyarihan.” Ang kuwit sa hulihan ay nagpapanatili sa pagpapatuloy ng pangungusap sa susunod na talata.
