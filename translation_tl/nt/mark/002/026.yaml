  source_fidelity: Kailangang iwasto ang pangunahing katawagan para sa ἄρτους τῆς προθέσεως. Ang mga ito ay mga tinapay na inilalagay/inihahain sa harap ng Diyos, hindi pangunahing inilalarawan bilang mga tinapay na 'inihahandog.' Pinananatili ng rebisyon ang maramihang anyo ng Griyego at ang malawak na temporal na puwersa ng ἐπί.
  naturalness: Natural ang pangkalahatang ayos, ngunit mas maayos ang 'na hindi ipinahihintulot na kainin ninuman' kaysa sa nawawalang pangatnig sa draft. Ang hayag na 'ng mga ito' sa huling sugnay ay naglilinaw sa ipinamahaging tinapay nang hindi nagdaragdag ng kahulugan.
  terminology: Ang 'pinakapunong pari' ay naiintindihan at pinananatili para sa ἀρχιερεύς. Ginamit ang 'mga tinapay na inihain sa harap ng Diyos' upang tumpak na ipahayag ang terminong kultiko, habang pinananatili ng talababa ang tradisyonal at alternatibong katawagan.
  issues:
