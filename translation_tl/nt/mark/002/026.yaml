id: MRK.2.26
reference: Mark 2:26
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀πῶς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ ἐπὶ Ἀβιαθὰρ ἀρχιερέως καὶ τοὺς ἄρτους τῆς προθέσεως ἔφαγεν, οὓς οὐκ ἔξεστιν φαγεῖν εἰ μὴ ⸂τοὺς ἱερεῖς⸃, καὶ ἔδωκεν καὶ τοῖς σὺν αὐτῷ οὖσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/026.yaml
  text: how he entered into the house of God in the time of Abiathar the high priest[a], and ate the bread of the Presence, which it is not lawful to eat except for the priests[b], and also gave some to those who were with him?
translation:
  language: tl
  text: kung paanong pumasok siya sa bahay ng Diyos noong panahon ni Abiatar na pinakapunong pari[a], at kinain ang mga tinapay na inihain sa harap ng Diyos[b], na hindi ipinahihintulot na kainin ninuman maliban sa mga pari, at binigyan din niya ng mga ito ang mga kasama niya?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “noong panahon ng pagiging pinakapunong pari ni Abiatar.” Maaari ring unawain nang mas malawak ang parirala bilang pagtukoy sa panahon o bahagi ng salaysay na kaugnay ni Abiatar na pinakapunong pari.
    reason: alternative_reading
  - marker: b
    text: Ang tinutukoy ay ang banal na mga tinapay na inilalagay sa harap ng Diyos sa santuwaryo; tradisyonal itong tinatawag na “tinapay na handog” o “tinapay ng presensya.”
    reason: cultural_note
lexical_decisions:
- source_word: πῶς
  choice: kung paanong
  rationale: Likas na ipinagpapatuloy nito ang tanong sa naunang konteksto at ipinakikilala ang salaysay tungkol sa ginawa ni David.
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: pumasok siya sa bahay ng Diyos
  rationale: Tuwiran at natural na salin na pinananatili ang larawan ng sagradong tahanan.
- source_word: ἐπὶ Ἀβιαθὰρ ἀρχιερέως
  choice: noong panahon ni Abiatar na pinakapunong pari
  rationale: Ipinahahayag ang malawak na temporal na diwa ng ἐπί na may genitive nang hindi labis na nililimitahan ito sa eksaktong panahon ng panunungkulan.
- source_word: ἄρτους τῆς προθέσεως
  choice: tinapay na inihahandog sa presensya ng Diyos
  rationale: Malinaw sa karaniwang mambabasa at pinananatili ang diwa ng tinapay na inilalagay sa harap ng Diyos.
- source_word: οὓς οὐκ ἔξεστιν φαγεῖν εἰ μὴ τοὺς ἱερεῖς
  choice: na hindi ipinahihintulot kainin ninuman maliban sa mga pari
  rationale: Ipinakikita nang malinaw ang legal at sagradong pagbabawal at ang tanging eksepsyon.
- source_word: ἔδωκεν καὶ τοῖς σὺν αὐτῷ οὖσιν
  choice: at binigyan din niya ang mga kasama niya
  rationale: Natural na Filipino para sa mga taong kasama niya; nauunawaan sa konteksto na tinapay ang ibinigay.
theological_decisions:
- issue: Ang temporal na parirala tungkol kay Abiatar at ang kaugnayan nito sa salaysay sa 1 Samuel 21
  choice: noong panahon ni Abiatar na pinakapunong pari
  alternative: noong panahon ng pagiging pinakapunong pari ni Abiatar; sa salaysay tungkol kay Abiatar na pinakapunong pari
  rationale: Pinananatili ng pangunahing salin ang posibleng malawak na temporal na diwa ng Griyego. Hindi nito tahimik na nilulutas ang tensiyon sa salaysay ng Lumang Tipan; inilalahad sa talababa ang lehitimong saklaw ng parirala.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “pinakapunong pari” upang malinaw na maipahayag ang ἀρχιερεύς, at ipinaliwanag ang teknikal na katawagang pangkulto sa talababa.
