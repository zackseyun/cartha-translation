  - severity: low
    issue: Nahati ang magkakaugnay na pagkilos sa dalawang pangungusap.
    rationale: Hindi mali ang paghahati, ngunit ang Griyego ay sunod-sunod na nag-uugnay sa pagtayo, pagbubuhat, at paglabas. Ang isang pangungusap ay mas malinaw na nagpapanatili ng daloy at agarang pagkilos ni Marcos.
