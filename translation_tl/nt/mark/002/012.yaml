  text: καὶ ἠγέρθη ⸂καὶ εὐθὺς⸃ ἄρας τὸν κράβαττον ἐξῆλθεν ⸀ἔμπροσθεν πάντων, ὥστε ἐξίστασθαι πάντας καὶ δοξάζειν τὸν θεὸν λέγοντας ὅτι ⸂Οὕτως οὐδέποτε⸃ εἴδομεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/012.yaml
  text: And he got up[a], and immediately picked up the mat and went out before them all, so that they were all amazed and glorified God, saying, “We have never seen anything like this.”
translation:
  language: tl
  text: At tumayo siya at agad na binuhat ang higaan at lumabas sa harap nilang lahat, anupat namangha silang lahat at niluwalhati ang Diyos, na nagsasabi, “Kailanman ay wala pa kaming nakitang ganito.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠγέρθη
  choice: tumayo siya
  rationale: Sa konteksto ng pagpapagaling, tumutukoy ito sa pisikal na pagtayo ng lalaking paralitiko bilang tugon sa utos ni Jesus. Natural ito sa modernong Tagalog at hindi ipinapasok ang diing pang-muling pagkabuhay.
- source_word: εὐθύς
  choice: agad
  rationale: Pinananatili nito ang agarang pagkilos at ang mabilis na takbo ng salaysay na katangian ni Marcos.
- source_word: ἄρας τὸν κράβαττον
  choice: binuhat ang higaan niya
  rationale: Ang αἴρω ay pagbuhat o pag-angat, at ang κράβαττος ay payak na hinihigaan. Ang “higaan” ay malinaw at likas sa Tagalog nang hindi ito ginagawang modernong stretcher.
- source_word: ἔμπροσθεν πάντων
  choice: sa harap nilang lahat
  rationale: Tapat nitong ipinakikita na hayag sa lahat ang paglabas at paggaling ng lalaki.
- source_word: ὥστε ἐξίστασθαι πάντας
  choice: kaya namangha silang lahat
  rationale: Ipinahahayag ng ἐξίστασθαι ang matinding pagkamangha; likas at malinaw ang “namangha” sa kasalukuyang Tagalog.
- source_word: δοξάζειν τὸν θεόν
  choice: niluwalhati ang Diyos
  rationale: Direktang pinananatili ng “niluwalhati” ang God-directed force ng δοξάζω at ang marangal na biblikal na pananalita.
- source_word: Οὕτως οὐδέποτε εἴδομεν
  choice: Kailanma’y wala pa kaming nakitang ganito
  rationale: Natural na Tagalog ito para sa Griyegong idyomang nagsasaad na hindi pa sila kailanman nakakita ng ganitong pangyayari.
theological_decisions:
- issue: Posibleng pahiwatig ng muling pagkabuhay sa ἠγέρθη
  choice: tumayo siya
  alternative: ibinangon siya / bumangon siya
  rationale: Bagaman maaaring gamitin ang ἐγείρω tungkol sa muling pagkabuhay sa ibang konteksto, ang tuwirang pakahulugan dito ay ang pagtayo ng pinagaling na paralitiko. Iniiwasan ng salin ang pagdaragdag ng teolohikal na diin na hindi pangunahing ipinahahayag ng talata.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural sa karaniwang mambabasa. Ginamit ang maiikling pangungusap upang mapanatili ang mabilis na kilos ng salaysay ni Marcos. Walang talababa sapagkat sapat na malinaw sa Tagalog ang idyomang pangwakas; ang marker [a] sa English consultation layer ay tila hindi tugma sa nilalaman ng ibinigay na footnote at hindi isinunod.
