id: MRK.2.27
reference: Mark 2:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν αὐτοῖς· Τὸ σάββατον διὰ τὸν ἄνθρωπον ἐγένετο ⸀καὶ οὐχ ὁ ἄνθρωπος διὰ τὸ σάββατον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/027.yaml
  text: And he was saying to them[a], “The Sabbath came into being for man, and not man for the Sabbath.”
translation:
  language: tl
  text: At sinabi niya sa kanila, “Ginawa ang Sabbath para sa tao, at hindi ang tao para sa Sabbath.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: sinabi niya
  rationale: Bagaman nasa imperfect tense ang pandiwa, karaniwang ginagamit ito bilang pormula sa pagsasalaysay upang ipakilala ang sinabi. Mas natural sa makabagong Tagalog ang “sinabi niya” kaysa “sinasabi niya noon” sa talatang ito.
- source_word: τὸ σάββατον
  choice: ang Sabbath
  rationale: Tumutukoy ang may-artikulong pangngalan sa araw o institusyon ng Sabbath. Ang “Sabbath” ang malinaw at kinikilalang katawagan sa Tagalog, at hindi kailangang dagdagan ng “araw.”
- source_word: διὰ τὸν ἄνθρωπον
  choice: para sa tao
  rationale: Ang διά na may accusative ay nagpapahayag ng layunin o kapakinabangan. Ang isahang ἄνθρωπος ay kumakatawan dito sa sangkatauhan sa pangkalahatan; likas na pangkalahatan at hindi nakatali sa kasarian ang “tao” sa Tagalog.
- source_word: ἐγένετο
  choice: ginawa
  rationale: Maaaring mangahulugan ang γίνομαι ng pag-iral, pagkakaroon, o pagkagawa. Sa pahayag tungkol sa layunin ng Sabbath, natural at tumpak sa Tagalog ang “ginawa,” nang hindi tinutukoy kung paano ito itinatag.
- source_word: οὐχ ὁ ἄνθρωπος διὰ τὸ σάββατον
  choice: at hindi ang tao para sa Sabbath
  rationale: 'Pinananatili ng tuwirang parirala ang elipsis at simetrikong pagsalungat ng Griyego: ang Sabbath ay para sa tao, hindi ang tao para sa Sabbath.'
theological_decisions:
- issue: Ang pangkalahatang gamit ng isahang ἄνθρωπος
  choice: Isinalin bilang “tao” sa parehong sugnay.
  alternative: “sangkatauhan” o “mga tao”
  rationale: Ang “tao” ay maaaring gamiting kumakatawan sa lahat ng tao sa Tagalog at pinananatili nito ang isahan at ang retorikal na pagkakatimbang ng orihinal nang hindi nililimitahan ang pahayag sa mga lalaki.
- issue: Ang kaugnayan ng Sabbath at ng tao
  choice: Pinanatili ang payak na pahayag na ginawa ang Sabbath para sa tao.
  alternative: Ipaliwanag bilang “para sa kapakanan ng tao”
  rationale: Ipinahihiwatig ng διά ang layunin o kapakinabangan, ngunit hindi na idinagdag sa teksto ang “kapakanan” upang hindi paliitin o palawakin ang saklaw ng mismong sinabi.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang maikli at matalim na paralelismo ng kasabihan; walang talababa ang kailangan sapagkat ang “tao” ay likas nang pangkalahatan sa Tagalog.
