id: MRK.2.18
reference: Mark 2:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἦσαν οἱ μαθηταὶ Ἰωάννου καὶ οἱ ⸀Φαρισαῖοι νηστεύοντες. καὶ ἔρχονται καὶ λέγουσιν αὐτῷ· Διὰ τί οἱ μαθηταὶ Ἰωάννου καὶ οἱ ⸀μαθηταὶ τῶν Φαρισαίων νηστεύουσιν, οἱ δὲ σοὶ μαθηταὶ οὐ νηστεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/018.yaml
  text: John's disciples and the Pharisees were fasting. And they come and say to him[a], "Why do John's disciples and the disciples of the Pharisees fast, but your disciples do not fast?"
translation:
  language: tl
  text: Nag-aayuno ang mga alagad ni Juan at ang mga Pariseo. May mga lumapit at nagsabi sa kanya[a], “Bakit nag-aayuno ang mga alagad ni Juan at ang mga alagad ng mga Pariseo, pero hindi nag-aayuno ang mga alagad mo?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Lumapit sila at sinabi sa kanya.” Hindi tahasang binabanggit sa Griyego kung sino ang lumapit at nagsalita.
    reason: alternative_reading
lexical_decisions:
- source_word: ἦσαν ... νηστεύοντες
  choice: Nag-aayuno
  rationale: Ipinahahayag ng imperfect ng εἰμί kasama ng present participle ang nagpapatuloy na kilos sa nakaraang tagpo. Sa konteksto ng salaysay, likas na naihahatid ito ng aspektong di-ganap na “nag-aayuno” nang hindi nagdaragdag ng salitang walang tuwirang katumbas sa Griyego.
- source_word: οἱ μαθηταὶ Ἰωάννου
  choice: ang mga alagad ni Juan
  rationale: Likas at malinaw na ipinapahayag ng “ni Juan” ang ugnayang nasa genitive.
- source_word: οἱ Φαρισαῖοι
  choice: ang mga Pariseo
  rationale: Ito ang karaniwang makabagong katawagang Filipino para sa pangkat na Φαρισαῖοι.
- source_word: ἔρχονται καὶ λέγουσιν
  choice: May mga lumapit at nagsabi
  rationale: Ginagamit sa Griyego ang historical present at hindi binabanggit ang simuno. Sa Filipino, ang anyong naganap ay natural sa pagsasalaysay, samantalang pinananatili ng “may mga” ang maramihan at hindi tiyak na pagkakakilanlan ng mga lumapit.
- source_word: Διὰ τί
  choice: Bakit
  rationale: Direkta, natural, at tumpak na katumbas ng tanong tungkol sa dahilan.
- source_word: οἱ μαθηταὶ τῶν Φαρισαίων
  choice: ang mga alagad ng mga Pariseo
  rationale: Pinananatili nito ang tahasang genitive na ugnayan at ang pagkakaiba sa naunang pagbanggit sa mismong mga Pariseo.
- source_word: νηστεύουσιν
  choice: nag-aayuno
  rationale: Ang aspektong di-ganap sa Filipino ay angkop kapuwa sa kasalukuyang gawain at sa nakaugaliang pagsasagawa na ipinahihiwatig ng tanong.
- source_word: οἱ δὲ σοὶ μαθηταὶ
  choice: pero hindi nag-aayuno ang mga alagad mo
  rationale: Malinaw na inihahatid ng “pero” ang pagsalungat ng δέ, at natural na ipinapahayag ng “mga alagad mo” ang possessive na σοί/σός.
theological_decisions:
- issue: Pagkakakilanlan ng mga lumapit at nagsalita kay Jesus
  choice: Hindi tinukoy ang pangkat; isinalin bilang “May mga lumapit at nagsabi.”
  alternative: “Lumapit sila at sinabi,” na maaaring ipalagay na tumutukoy sa mga alagad ni Juan at sa mga Pariseo.
  rationale: Walang hayag na simuno ang ἔρχονται καὶ λέγουσιν. Iniiwasan ng salin na italaga ang sinabi sa isang tiyak na pangkat na hindi tahasang tinukoy ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “alagad,” “Pariseo,” at “nag-aayuno” bilang mga pamilyar na terminong biblikal. Pinili ang “pero” bilang natural na panandang pasalungat sa karaniwang makabagong pananalita nang hindi nagpapababa sa dignidad ng teksto.
