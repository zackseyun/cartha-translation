  yaml_path: translation/nt/mark/002/006.yaml
  text: 'But some of the scribes were sitting there[a], reasoning in their hearts:'
translation:
  language: tl
  text: Ngunit nakaupo roon ang ilan sa mga guro ng Kautusan at nangangatwiran sa kanilang mga puso:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nangangatwiran sa loob nila” o “nangangatwiran sa kanilang mga isip.” Literal na sinasabi ng Griyego na “sa kanilang mga puso,” isang biblikal na idyoma para sa panloob na pag-iisip.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν δέ
  choice: Ngunit ...
  rationale: Ang δέ ay nagpapahiwatig ng banayad na paglipat at pagsalungat mula sa naunang tagpo tungo sa lihim na tugon ng ibang pangkat; natural itong ipinahahayag ng “Ngunit” sa Filipino.
- source_word: τινες τῶν γραμματέων
  choice: ang ilan sa mga tagapagturo ng Kautusan
  rationale: 'Pinananatili ng “ilan sa” ang partitive na diwa: isang bahagi lamang ng pangkat ang tinutukoy. Sa konteksto ng mga Ebanghelyo, malinaw at likas sa modernong Filipino ang “mga tagapagturo ng Kautusan” para sa γραμματεῖς.'
- source_word: ἐκεῖ καθήμενοι
  choice: nakaupo roon
  rationale: Tuwirang inilalarawan ang kanilang kinaroroonan at postura; ang “nakaupo roon” ay natural sa salaysay na Filipino.
- source_word: διαλογιζόμενοι
  choice: nag-iisip-isip
  rationale: Ipinahahayag nito ang patuloy at panloob na pagninilay o pangangatwiran nang hindi pa ipinapalagay na binibigkas nila ang kanilang pagtutol.
- source_word: ἐν ταῖς καρδίαις αὐτῶν
  choice: sa kanilang mga puso
  rationale: Pinananatili nito ang biblikal na idyoma na tumutukoy sa kaloob-loobang pag-iisip at paghatol, sa halip na paliitin ito sa makabagong paghihiwalay ng isip at damdamin.
theological_decisions:
- issue: Ang antropolohikal na idyomang καρδίαις
  choice: sa kanilang mga puso
  alternative: sa kanilang mga isip; sa kanilang sarili
  rationale: Ang “puso” sa biblikal na gamit ay maaaring maging luklukan ng pag-iisip at panloob na paghatol. Ang pagpapanatili rito ay nag-iingat sa konseptuwal na daigdig ng teksto at hindi ipinapataw ang makabagong isip-puso na paghihiwalay.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “tagapagturo ng Kautusan” upang maging malinaw sa karaniwang mambabasa ang tungkulin ng γραμματεῖς, at pinanatili ang “mga puso” bilang mahalagang biblikal na idyoma.
