  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ οἱ γραμματεῖς ⸂τῶν Φαρισαίων⸃ ⸀ἰδόντες ⸂ὅτι ἐσθίει⸃ μετὰ τῶν ⸂ἁμαρτωλῶν καὶ τελωνῶν⸃ ἔλεγον τοῖς μαθηταῖς αὐτοῦ· ⸀Ὅτι μετὰ τῶν ⸂τελωνῶν καὶ ἁμαρτωλῶν⸃ ⸀ἐσθίει;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/016.yaml
  text: And the scribes of the Pharisees[a], seeing that he was eating with sinners and tax collectors, were saying to his disciples, “Why does he eat with tax collectors and sinners?”
translation:
  language: tl
  text: At nang makita ng mga tagapagturo ng Kautusan na kabilang sa mga Pariseo na kumakain siya na kasama ng mga makasalanan at mga maniningil ng buwis, nagtatanong sila sa kanyang mga alagad, “Bakit siya kumakain na kasama ng mga maniningil ng buwis at mga makasalanan?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas malayang salin, “Bakit siya nakikisalo sa pagkain kasama ng mga maniningil ng buwis at mga makasalanan?” Ang literal na sinasabi ng Griyego ay “kumakain kasama ng,” na sa kontekstong ito ay nagpapahiwatig ng pakikisama sa hapag.
    reason: lexical_alternative
lexical_decisions:
- source_word: γραμματεῖς
  choice: mga tagapagturo ng Kautusan
  rationale: Sa konteksto ng mga Ebanghelyo, tumutukoy ito sa mga kinikilalang dalubhasa at tagapagturo ng Kautusan; mas malinaw ito sa karaniwang mambabasang Filipino kaysa sa hiram na katawagang “mga eskriba.”
- source_word: τῶν Φαρισαίων
  choice: na kabilang sa mga Pariseo
  rationale: Ipinahahayag nito ang kaugnayan o pagkakabilang na ipinahihiwatig ng genitive nang hindi tiyak na pinipili ang mas masikip na pagbasa na lahat sila mismo ay mga Pariseo.
- source_word: ἰδόντες
  choice: nang makita
  rationale: Natural na isinasalin ang aorist participle bilang pangyayaring temporal na nauna sa kanilang pagsasalita.
- source_word: ὅτι ἐσθίει
  choice: na kumakain siya
  rationale: Pinananatili ang nagpapatuloy na kilos sa tagpong isinasalaysay, na angkop sa aspektong imperfect ng pandiwa.
- source_word: μετὰ
  choice: kasama ng
  rationale: Likas na Filipino para sa pakikisama sa pagkain; hindi tahasang idinaragdag sa pangunahing teksto ang implikasyon ng pakikisalo.
- source_word: ἁμαρτωλῶν
  choice: mga makasalanan
  rationale: Direktang pinananatili ang matinding panlipunan at panrelihiyong bansag sa teksto.
- source_word: τελωνῶν
  choice: mga maniningil ng buwis
  rationale: Malinaw at nakasanayang tawag sa mga nangongolekta ng buwis o singil sa konteksto ng mga Ebanghelyo.
- source_word: ἔλεγον
  choice: sinabi nila
  rationale: Natural na naratibong Filipino; bagaman imperfect ang Griyego, walang sapat na batayan dito upang ipilit ang “paulit-ulit nilang sinasabi.”
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: sa kanyang mga alagad
  rationale: Pinananatili ang pormal na ugnayan ng guro at alagad na taglay ng μαθηταί.
- source_word: Ὅτι
  choice: Bakit
  rationale: Sa tanong na ito, idiomatikong nagpapahayag ang ὅτι ng pagtutol o paghingi ng dahilan; “Bakit” ang pinakanatural na Filipino.
- source_word: ἐσθίει
  choice: siya kumakain
  rationale: Ang kasalukuyang anyo sa tuwirang tanong ay naghahayag ng pagtutol sa ginagawa o nakagawiang pakikisama ni Jesus sa hapag.
theological_decisions:
- issue: Panlipunan at panrelihiyong bigat ng pakikisalo
  choice: Isalin nang payak bilang “kumakain kasama ng mga maniningil ng buwis at mga makasalanan.”
  alternative: “nakikisalo sa pagkain sa mga maniningil ng buwis at mga makasalanan”
  rationale: Karaniwang pandiwa para sa pagkain at pang-ukol na kasama ang ginamit ng Griyego. Hinahayaan nitong ang konteksto ang magpahiwatig ng pakikipagkapwa at pagtanggap sa hapag, sa halip na ipasok agad ang interpretasyon sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga tagapagturo ng Kautusan” para sa agarang pagkaunawa at “kanyang” bilang natural na anyong paari. Pinanatili ang magkaibang ayos ng “mga makasalanan at mga maniningil ng buwis” sa salaysay at “mga maniningil ng buwis at mga makasalanan” sa tanong, gaya ng SBLGNT.
