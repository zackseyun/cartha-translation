id: MRK.2.15
reference: Mark 2:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ⸀γίνεται κατακεῖσθαι αὐτὸν ἐν τῇ οἰκίᾳ αὐτοῦ, καὶ πολλοὶ τελῶναι καὶ ἁμαρτωλοὶ συνανέκειντο τῷ Ἰησοῦ καὶ τοῖς μαθηταῖς αὐτοῦ, ἦσαν γὰρ πολλοὶ καὶ ⸀ἠκολούθουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/015.yaml
  text: And it happened that he was reclining at table in his house[a], and many tax collectors and sinners were reclining with Jesus and his disciples, for there were many, and they were following him.
translation:
  language: tl
  text: At nangyari na nakahilig siya sa hapag sa bahay niya[a], maraming maniningil ng buwis at mga makasalanan ang nakahilig sa hapag kasama ni Jesus at ng kanyang mga alagad, sapagkat marami sila at sumusunod sila sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa bahay ni Levi”; inuunawa naman ito ng ilan bilang “sa bahay ni Jesus.” “Sa bahay niya” lamang ang nasa Griyego.
    reason: alternative_reading
lexical_decisions:
- source_word: γίνεται
  choice: nangyari
  rationale: Isinasalin ang makasaysayang pangkasalukuyan ni Marcos sa likas na anyong pasalaysay sa Filipino.
- source_word: κατακεῖσθαι
  choice: nakahilig sa hapag
  rationale: Tumutukoy ito sa karaniwang pustura habang kumakain noong panahong iyon, hindi sa basta paghiga lamang; nililinaw ng “sa hapag” ang tagpuan ng pagkain.
- source_word: ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: sa bahay niya
  rationale: Pinananatili ang panghalip ng Griyego at ang tunay na kalabuan kung kaninong bahay ang tinutukoy.
- source_word: τελῶναι
  choice: mga maniningil ng buwis
  rationale: Malinaw at karaniwang makabagong katawagan para sa mga ahente ng pangongolekta ng buwis.
- source_word: ἁμαρτωλοὶ
  choice: mga makasalanan
  rationale: Tuwiran at kinagawiang salin; hindi nito dinaragdagan ang payak na katawagang ginamit ng teksto.
- source_word: συνανέκειντο
  choice: nakahilig din sa hapag kasama
  rationale: Pinananatili kapuwa ang pustura sa pagkain at ang diwa ng pakikisalo o pagsama.
- source_word: μαθηταῖς
  choice: mga alagad
  rationale: Karaniwang salin sa Bagong Tipan na nagpapanatili sa ugnayan ng pagkatuto at pagsunod.
- source_word: ἦσαν γὰρ πολλοὶ
  choice: sapagkat marami sila
  rationale: Likas na Filipino na nagpapanatili sa paliwanag na ipinahihiwatig ng γάρ.
- source_word: ἠκολούθουν αὐτῷ
  choice: sumusunod sila sa kanya
  rationale: Ipinahihiwatig ng aspektong di-ganap ang nagpapatuloy o nakagawiang pagsunod, na likas na naipapahayag ng “sumusunod” sa Filipino.
theological_decisions:
- issue: Ang tinutukoy ng “niya” sa “bahay niya” (αὐτοῦ)
  choice: Hindi tinukoy sa pangunahing teksto kung kanino ang bahay.
  alternative: Bahay ni Levi; o bahay ni Jesus.
  rationale: Malabo ang tinutukoy ng panghalip sa Griyego. Karaniwang inuunawa itong bahay ni Levi batay sa naunang talata, ngunit maaari rin itong unawaing bahay ni Jesus. Pinananatili ng salin ang kalabuan sa halip na lutasin ito sa pamamagitan ng interpretasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nakahilig sa hapag” upang maipakita ang sinaunang pustura sa pagkain nang hindi mapagkamalang karaniwang paghiga. Pinanatili ang “bahay niya” upang huwag alisin ang kalabuan ng orihinal.
