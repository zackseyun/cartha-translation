  source_fidelity: 'Tumpak na naipapasa ng draft ang mga pangunahing elemento ng Griyego: ang pagkain nang nakahilig sa hapag, ang hindi tinutukoy na may-ari ng bahay, ang mga maniningil ng buwis at makasalanan, at ang paliwanag na marami ang sumusunod kay Jesus. Gayunman, ang pambungad na “At nangyari na habang” ay hindi maayos na pagkakaugnay sa modernong Filipino at dapat ayusin nang hindi binabago ang aspekto o saklaw ng salaysay.'
  naturalness: Hindi likas ang “At nangyari na habang nakahilig siya”; ang “na” at “habang” ay lumilikha ng sabit na konstruksiyon. Mas malinaw at marangal ang “At nangyari na nakahilig siya...” Ang pag-aalis ng “din” sa ikalawang “nakahilig” ay umiiwas din sa di-kinakailangang pahiwatig ng pagdaragdag o pagtutulad na wala sa Griyego.
  terminology: Ang “maniningil ng buwis,” “mga makasalanan,” “mga alagad,” at “nakahilig sa hapag” ay angkop sa makabagong Filipino Tagalog at sa rehistrong pampanitikan. Ang “bahay niya” ay wastong nagpapanatili sa kalabuan ng αὐτοῦ. Ang talababa ay pinanatili at bahagyang pinakinis lamang.
