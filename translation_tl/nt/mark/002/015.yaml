  to: At nangyari na nakahilig siya sa hapag sa bahay niya[a], maraming maniningil ng buwis at mga makasalanan ang nakahilig sa hapag kasama ni Jesus at ng kanyang mga alagad, sapagkat marami sila at sumusunod sila sa kanya.
