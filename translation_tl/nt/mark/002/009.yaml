  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τί ἐστιν εὐκοπώτερον, εἰπεῖν τῷ παραλυτικῷ· ⸀Ἀφίενταί σου αἱ ἁμαρτίαι, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ ἆρον ⸂τὸν κράβαττόν σου⸃ καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/009.yaml
  text: 'Which is easier: to say to the paralyzed man[a], ‘Your sins are forgiven,’ or to say, ‘Get up, pick up your mat, and walk’?”'
translation:
  language: tl
  text: 'Alin ang mas madaling sabihin sa lalaking paralisado: ‘Pinatawad na ang mga kasalanan mo,’[a] o sabihin: ‘Bumangon ka, buhatin mo ang higaan mo, at lumakad ka’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na, “Pinatawad ang mga kasalanan mo.” Maaaring unawain ang pandiwang Griyego bilang nagbibigay-diin sa kasalukuyang kalagayang bunga ng pagpapatawad.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ἐστιν εὐκοπώτερον
  choice: Alin ang mas madaling
  rationale: Likas na tanong ito sa Filipino para sa paghahambing ng dalawang sasabihin at pinananatili ang puwersa ng comparative.
- source_word: εἰπεῖν
  choice: sabihin
  rationale: Tuwirang ipinakikilala ng pandiwa ang mismong pananalita sa dalawang bahagi ng tanong.
- source_word: τῷ παραλυτικῷ
  choice: sa lalaking paralisado
  rationale: Malinaw at pangkaraniwang tawag sa taong may paralisis, nang hindi gumagamit ng teknikal o makalumang katawagan.
- source_word: Ἀφίενταί σου αἱ ἁμαρτίαι
  choice: Pinatawad na ang mga kasalanan mo
  rationale: Natural na deklarasyon sa modernong Filipino; ang “na” ay nagpapahayag ng kasalukuyang kalagayang bunga ng pagpapatawad nang hindi tinutukoy ang gumaganap.
- source_word: ἁμαρτίαι
  choice: mga kasalanan
  rationale: Karaniwan at angkop na katumbas; walang dahilan sa konteksto upang palawakin ito bilang pagkakautang o pagkakasala laban sa iba.
- source_word: Ἔγειρε
  choice: Bumangon ka
  rationale: Natural na pautos sa isang nakahiga upang tumindig o bumangon.
- source_word: ἆρον
  choice: buhatin mo
  rationale: Ipinahihiwatig dito ang pag-angat at pagdadala sa magaang higaan; mas tiyak kaysa simpleng “kunin.”
- source_word: τὸν κράβαττόν σου
  choice: ang higaan mo
  rationale: Ang κράβαττος ay payak at nabubuhat na sapin o higaan. Ang “higaan” ay mas natural sa Filipino kaysa “banig” kung hindi tiyak ang materyales.
- source_word: περιπάτει
  choice: lumakad ka
  rationale: Natural na katumbas ng pautos at malinaw na inilalarawan ang nakikitang paggaling.
theological_decisions:
- issue: Anyo at panahon ng pahayag ng pagpapatawad
  choice: Pinatawad na ang mga kasalanan mo
  alternative: Pinatatawad ang mga kasalanan mo
  rationale: Ang present form na ἀφίενταί ay maaaring magtuon sa umiiral na kalagayan ng kapatawaran. Ang “Pinatawad na” ay natural sa Filipino at pinananatili ang deklaratibong puwersa, samantalang ang alternatibo ay maaaring ipakahulugang kasalukuyang nagpapatuloy pa ang proseso.
- issue: Hindi binanggit na tagaganap ng pagpapatawad
  choice: Panatilihin ang pasibong pahayag nang hindi tahasang pinapangalanan ang Diyos o si Jesus bilang tagaganap
  alternative: Pinatawad na ng Diyos ang mga kasalanan mo
  rationale: Walang tahasang tagaganap sa Griyego. Ang hindi pagdaragdag nito ay nagpapanatili sa tensiyong teolohikal ng salaysay tungkol sa awtoridad ni Jesus na magpatawad.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang “lalaking paralisado” sa halip na nominal na “paralitiko,” at “higaan” bilang pangkalahatang tawag sa payak na nabubuhat na sapin. Inilagay ang talababa pagkatapos mismo ng pahayag na tinutukoy nito.
