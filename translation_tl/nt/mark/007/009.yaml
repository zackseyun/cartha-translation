id: MRK.7.9
reference: Mark 7:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἔλεγεν αὐτοῖς· Καλῶς ἀθετεῖτε τὴν ἐντολὴν τοῦ θεοῦ, ἵνα τὴν παράδοσιν ὑμῶν ⸀τηρήσητε·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/009.yaml
  text: And he was saying to them[a], “You neatly set aside the commandment of God so that you may keep your tradition.”
translation:
  language: tl
  text: At sinabi niya sa kanila, “Talagang mahusay ninyong isinasantabi ang utos ng Diyos upang mapanatili ninyo ang inyong tradisyon![a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Mahusay ninyong isinasantabi ang utos ng Diyos upang mapanatili ninyo ang inyong tradisyon.” Ironiko rito ang salitang Griyego na maaaring isaling “mahusay”; hindi ito papuri.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: sinabi niya
  rationale: Ang imperpektong anyo ay maaaring magpahiwatig ng nagpapatuloy o paulit-ulit na pagsasalita, ngunit sa ganitong pormulang pasalaysay, ang natural na modernong Tagalog na “sinabi niya” ay hindi nagpapasok ng katiyakang wala sa konteksto.
- source_word: Καλῶς
  choice: talagang mahusay
  rationale: Ginagamit ang καλῶς nang may matalas na ironiya. Ang “talagang mahusay” ay maaaring marinig bilang sarkastikong puna sa konteksto, habang pinananatili ng talababa ang literal na posibilidad ng “mahusay.”
- source_word: ἀθετεῖτε
  choice: isinasantabi
  rationale: Ipinahahayag nito ang sinasadyang pagwawalang-bisa o pagtanggi sa utos nang hindi gumagamit ng labis na teknikal na salita.
- source_word: ἐντολὴν
  choice: utos
  rationale: Natural at malinaw sa modernong Tagalog, ngunit nananatili ang bigat ng awtoridad ng ipinag-uutos ng Diyos.
- source_word: τοῦ θεοῦ
  choice: ng Diyos
  rationale: Tuwirang ipinapakita ang pinagmulan at awtoridad ng utos, kasalungat ng “inyong tradisyon.”
- source_word: ἵνα
  choice: upang
  rationale: Pinananatili ang layunin o hinahangad na bunga na ipinahihiwatig ng ἵνα.
- source_word: παράδοσιν
  choice: tradisyon
  rationale: Ito ang malinaw at karaniwang katumbas para sa kaugaliang minana at ipinasa, lalo na sa kontekstong panrelihiyon.
- source_word: τηρήσητε
  choice: mapanatili
  rationale: Ipinahahayag ang pag-iingat at patuloy na paghawak sa kanilang tradisyon, at bumubuo ng malinaw na pagsalungat sa pagsasantabi sa utos ng Diyos.
theological_decisions:
- issue: Tono ng pahayag ni Jesus
  choice: Ironikong pagsaway, hindi tunay na papuri
  alternative: 'Literal na papuri: “Mahusay ninyong isinasantabi…”'
  rationale: Sa konteksto, tinutuligsa ni Jesus ang pagpapairal ng tradisyon ng tao laban sa utos ng Diyos. Pinananatili ng “talagang mahusay” ang anyo ng papuri ngunit ipinahihiwatig ang matalas na ironiya, at nililinaw ito ng talababa nang hindi binubura ang retorikal na tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “isinasantabi” at “mapanatili” upang ihayag ang matalim na pagsalungat sa pagitan ng utos ng Diyos at tradisyon ng mga kausap. Ang tandang padamdam ay tumutulong magpahiwatig ng matalas na ironikong pagsaway.
