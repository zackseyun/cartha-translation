  source_fidelity: Tumpak na naipapahayag ng salin ang ironikong Καλῶς, ang sinasadyang pagsasantabi (ἀθετεῖτε) ng utos ng Diyos, at ang layuning mapanatili ang sariling tradisyon. Ang simpleng nakaraang “sinabi niya” ay katanggap-tanggap na natural na pagsasalin ng imperpektong ἔλεγεν sa pormulang pasalaysay; hindi nito binabago ang diwa.
  naturalness: Natural, malinaw, at angkop sa makabagong Filipino Tagalog ang “Talagang mahusay ninyong isinasantabi...” bilang sarkastikong pagsaway sa kontekstong ito. Ang “upang mapanatili ninyo ang inyong tradisyon” ay maayos at madaling maunawaan.
