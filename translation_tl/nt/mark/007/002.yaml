  text: καὶ ἰδόντες τινὰς τῶν μαθητῶν αὐτοῦ ⸂ὅτι κοιναῖς χερσίν, τοῦτ’ ἔστιν ἀνίπτοις, ἐσθίουσιν⸃ ⸀τοὺς ⸀ἄρτους—
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/002.yaml
  text: and they saw that some of his disciples were eating the bread with defiled hands—that is[a], unwashed hands—
translation:
  language: tl
  text: at nakita nilang kumakain ng tinapay ang ilan sa mga alagad niya gamit ang maruruming kamay[a]—ibig sabihin, mga kamay na hindi nahugasan—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring isaling “mga kamay na di-malinis” o, nang literal, “karaniwang mga kamay.” Sa kontekstong ito, tumutukoy ang Griyego sa pagiging marumi ayon sa mga tuntunin ng kadalisayang panritwal, hindi lamang sa pisikal na dumi.
    reason: Nililinaw ang ritwal na diwa ng κοινός at pinananatili ang literal na alternatibo nang hindi dinaragdagan ang pangunahing teksto.
lexical_decisions:
- source_word: ἰδόντες
  choice: nakita nila
  rationale: Ang aorist participle ay likas na ipinahahayag bilang pandiwang may tahasang paksa sa Filipino; tumutukoy ang “nila” sa mga Pariseo at ilang tagapagturo ng Kautusan sa naunang talata.
- source_word: τινὰς τῶν μαθητῶν αὐτοῦ
  choice: ang ilan sa mga alagad niya
  rationale: Tumpak at likas na ipinapahayag ng “ilan sa” ang partitive genitive.
- source_word: ὅτι
  choice: ipinahayag sa ayos na “nakita nilang kumakain”
  rationale: Ipinakikilala ng ὅτι ang nilalaman ng nakita nila. Hindi kailangan ang hiwalay na katumbas na “na” dahil mas natural sa Filipino ang ganitong ayos ng sugnay.
- source_word: κοιναῖς χερσίν
  choice: gamit ang mga kamay na itinuturing na marumi
  rationale: Sa kontekstong Judio ng kadalisayang panritwal, ang κοινός ay hindi lamang tumutukoy sa pisikal na dumi. Nililinaw ng “itinuturing na” na ang tinutukoy ay katayuang marumi ayon sa kaugalian, habang pinananatili sa talababa ang literal at iba pang posibleng pagpapahayag.
- source_word: τοῦτ’ ἔστιν ἀνίπτοις
  choice: ibig sabihin, mga kamay na hindi nahugasan
  rationale: Pinananatili ang paliwanag mismo ni Marcos at inuulit ang “mga kamay” upang maging malinaw at natural sa Filipino.
- source_word: ἐσθίουσιν
  choice: kumakain
  rationale: Ang aspektong imperpektibo ng pandiwang Filipino ay natural na naglalarawan sa kilos na kasalukuyang naoobserbahan.
- source_word: τοὺς ἄρτους
  choice: ng tinapay
  rationale: Bagaman maramihan ang anyong Griyego at maaaring tumukoy sa mga tinapay o piraso ng tinapay, ang pangkalahatang “tinapay” ang pinakanatural sa Filipino rito.
theological_decisions:
- issue: Diwa ng kadalisayang panritwal sa κοινός
  choice: mga kamay na itinuturing na marumi
  alternative: karaniwang mga kamay; maruruming mga kamay; mga kamay na di-malinis
  rationale: Iniiwasan ng salin na ipakahulugang simpleng pisikal na dumi lamang ang usapin. Ipinakikita nitong ang mga kamay ay itinuturing na marumi ayon sa pamantayan ng kadalisayang panritwal, ngunit hindi nito nilulutas nang lampas sa sinasabi ng teksto ang ugnayan ng ritwal na karumihan at hindi paghuhugas.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinananatili ang pambungad na “at” at ang pangwakas na gitling sapagkat bahagi ang talata ng nagpapatuloy na pangungusap. Ginamit ang “niya” sa halip na mas pormal na “kaniya” para sa natural na daloy, nang hindi nagiging kolokyal.
