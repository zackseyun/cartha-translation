lexical_decisions:
- source_word: οὐκέτι
  choice: hindi na
  rationale: Likas na ipinapahayag sa modernong Tagalog ang pagtigil ng dating kalagayan o gawain.
- source_word: ἀφίετε
  choice: pinahihintulutan
  rationale: Sa kontekstong ito, ang pandiwa ay nangangahulugang magpahintulot, hindi magpatawad o mag-iwan.
- source_word: αὐτὸν
  choice: siya
  rationale: Pinananatili ang panghalip na tumutukoy sa lalaking binanggit sa naunang konteksto.
- source_word: οὐδὲν ποιῆσαι
  choice: gumawa ng anuman
  rationale: Pinananatili ang malawak na saklaw ng Griyego nang hindi nililimitahan sa tulong na pinansyal.
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: para sa kanyang ama o ina
  rationale: Ipinahahayag ng “para sa” ang diwang kapakinabangan ng datibo; nililinaw ng “kanyang” na sarili niyang mga magulang ang tinutukoy.
theological_decisions:
- issue: Kung tahasang lilimitahan sa pinansyal o praktikal na suporta ang νόημα ng ποιῆσαι sa konteksto ng Corban
  choice: Panatilihin ang pangkalahatang “gumawa ng anuman para sa kanyang ama o ina”
  alternative: “gumawa ng anuman upang tulungan ang kanyang ama o ina”
  rationale: Malawak ang mismong pananalita ng talata, bagaman ipinahihiwatig ng nakapaligid na konteksto ang praktikal o pinansyal na pagtulong. Hindi dapat paliitin ng salin ang tunay na saklaw ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “pinahihintulutan” upang malinaw na ipakita na ang mga kausap ang humahadlang, at pinanatiling pangkalahatan ang “gumawa ng anuman” ayon sa saklaw ng Griyego.
