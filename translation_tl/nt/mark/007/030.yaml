  text: καὶ ἀπελθοῦσα εἰς τὸν οἶκον αὐτῆς εὗρεν τὸ ⸂παιδίον βεβλημένον ἐπὶ τὴν κλίνην καὶ τὸ δαιμόνιον ἐξεληλυθός⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/030.yaml
  text: And when she went away to her house, she found the child lying on the bed[a], and the demon gone.
translation:
  language: tl
  text: At pag-uwi niya sa bahay, nakita niyang nakahiga sa higaan ang bata at wala na ang demonyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na salin, “nakalabas na ang demonyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελθοῦσα εἰς τὸν οἶκον αὐτῆς
  choice: pag-uwi niya sa bahay
  rationale: Ipinapahayag ng aorist participle at ng pariralang patungo sa sarili niyang bahay ang kilos na nauna sa pangunahing pandiwa. Likas sa modernong Tagalog ang “pag-uwi niya sa bahay” at malinaw ang pagkakasunod-sunod.
- source_word: εὗρεν
  choice: nakita niya
  rationale: Sa kontekstong pasalaysay, ang εὑρίσκω ay tumutukoy sa natuklasan o nadatnan niya; natural itong ipahayag bilang “nakita niya.”
- source_word: παιδίον
  choice: ang bata
  rationale: Pinananatili nito ang pangkalahatang katawagan ng Griyego. Bagaman anak na babae niya ang tinutukoy ayon sa konteksto, hindi tahasang “anak na babae” ang salitang ginamit sa talatang ito.
- source_word: βεβλημένον ἐπὶ τὴν κλίνην
  choice: nakahiga sa higaan
  rationale: Ang perfect passive participle ay naglalarawan sa kalagayan ng bata sa higaan. Ang “nakahiga” ang likas na result-state na salin at hindi nagpapahiwatig ng marahas na paghagis na hindi hinihingi ng konteksto.
- source_word: δαιμόνιον
  choice: ang demonyo
  rationale: Tuwirang katumbas ito ng δαιμόνιον at pinananatili ang leksikal na kaibhan nito sa katawagang “maruming espiritu” sa mas malawak na konteksto.
- source_word: ἐξεληλυθός
  choice: wala na
  rationale: Ipinahahayag ng perfect participle ang natapos nang paglabas at ang kasalukuyang pagkawala ng demonyo. Natural sa Tagalog ang “wala na,” habang inilalagay sa talababa ang mas pormal na anyo.
theological_decisions:
- issue: Paglalarawan sa kinalabasan ng pagpapalayas sa demonyo
  choice: wala na ang demonyo
  alternative: nakalabas na ang demonyo
  rationale: Pinananatili ng salin ang ganap na kinalabasan at patuloy na kawalan ng demonyo nang walang idinaragdag na paliwanag. Ang mas lantad na pagtukoy sa paglabas ay nasa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang “bahay,” “bata,” “higaan,” at “demonyo,” at iniwasan ang masalimuot o makalumang ayos.
