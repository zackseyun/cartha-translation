base_translation:
  language: en
  yaml_path: translation/nt/mark/007/034.yaml
  text: And looking up to heaven[a], he sighed and said to him, “Ephphatha,” that is[b], “Be opened.”
translation:
  language: tl
  text: Tumingala siya sa langit, bumuntong-hininga[a], at sinabi sa lalaki, “Effata,”[b] na ang ibig sabihin ay “Mabuksan ka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dumaing”; ang pandiwa ay maaaring magpahayag ng malalim na buntong-hininga o daing.
    reason: lexical_alternative
  - marker: b
    text: Aramaic ang “Effata” at nangangahulugang “Mabuksan ka.”
    reason: cultural_note
lexical_decisions:
- source_word: ἀναβλέψας εἰς τὸν οὐρανόν
  choice: Tumingala siya sa langit
  rationale: Likas at tuwirang ipinahahayag ng “tumingala” ang pagtingin pataas na nakapaloob sa ἀναβλέψας, habang pinananatili ng “sa langit” ang kontekstong higit sa karaniwang pagtingin lamang sa himpapawid.
- source_word: ἐστέναξεν
  choice: napabuntong-hininga
  rationale: Maaaring tumukoy ang στενάζω sa malalim na pagbuntong-hininga o pagdaing. Ang “napabuntong-hininga” ay natural sa makabagong Filipino at hindi labis na itinatakda ang tindi ng damdamin; inilalahad sa talababa ang alternatibo.
- source_word: λέγει αὐτῷ
  choice: sinabi sa lalaki
  rationale: Isinalin sa karaniwang panahunang pasalaysay sa Filipino ang historikal na pangkasalukuyan na λέγει. Nilinaw ng “sa lalaki” ang likas na tinutukoy ng panghalip na αὐτῷ nang hindi binabago ang personal na pagharap ni Jesus sa kaniya.
- source_word: Εφφαθα
  choice: Effata
  rationale: Pinanatili bilang transliterasyon ang salitang Aramaic na iniingatan mismo ni Marcos. Ang baybay na “Effata” ay madaling basahin sa Filipino, at kasunod nito ang paliwanag ng ebanghelista.
- source_word: Διανοίχθητι
  choice: Mabuksan ka
  rationale: Pinananatili nito ang anyong pautos, balintiyak, at isahan ng pandiwa, pati ang katotohanang ang lalaki mismo ang kinakausap, kahit ang pagbubukas ay tumutukoy sa kaniyang mga pandama at kakayahang magsalita.
theological_decisions:
- issue: Tinutukoy ng αὐτῷ
  choice: sa lalaki
  alternative: sa kaniyang mga tainga o kakayahang magsalita
  rationale: Pinakanatural na tumutukoy ang panghalip na Griyego sa lalaking kausap ni Jesus. Hindi ipinapalit ng salin ang ipinahihiwatig na mga bahaging bubuksan sa taong tuwirang kinakausap.
- issue: Saklaw ng utos na Διανοίχθητι
  choice: Mabuksan ka
  alternative: Bumukas ka / Mabuksan
  rationale: Pinananatili ang balintiyak at isahang personal na utos, nang hindi tahasang nililimitahan kung ang tinutukoy ay ang mga tainga, ang pananalita, o ang buong kalagayan ng lalaki.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “napabuntong-hininga” sa halip na mas pormal o mas matinding “dumaing,” at pinanatili ang Aramaic na “Effata” upang mapangalagaan ang tekstura ng salaysay. Inilagay ang mga pananda ng talababa sa mismong mga salitang kanilang ipinapaliwanag.
