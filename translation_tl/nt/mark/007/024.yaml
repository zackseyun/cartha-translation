  text: ⸂Ἐκεῖθεν δὲ⸃ ἀναστὰς ἀπῆλθεν εἰς τὰ ⸀ὅρια ⸀Τύρου. καὶ εἰσελθὼν εἰς οἰκίαν οὐδένα ἤθελεν γνῶναι, καὶ οὐκ ἠδυνήθη λαθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/024.yaml
  text: From there he got up and went away to the region of Tyre[a]. After entering a house, he wanted no one to know it[c][b], yet he could not remain hidden.
translation:
  language: tl
  text: Mula roon, bumangon siya at nagpunta sa rehiyon ng Tiro.[a] Pagpasok niya sa isang bahay, ayaw niyang malaman ng sinuman na naroon siya,[b] ngunit hindi niya nagawang manatiling hindi napapansin.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa teritoryo ng Tiro.” Ang salitang Griyego ay maaaring tumukoy sa distrito, teritoryo, o hanggahang rehiyong kaugnay ng Tiro, hindi lamang sa mismong guhit ng hangganan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ayaw niyang malaman ng sinuman.” Hindi tahasang binanggit sa Griyego kung ano ang ayaw niyang malaman nila; ipinahihiwatig ang kanyang presensya o kinaroroonan.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “ngunit hindi siya nakapanatiling nakatago” o “ngunit hindi niya naiwasang mapansin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐκεῖθεν δὲ
  choice: Mula roon
  rationale: Ipinahihiwatig ng Ἐκεῖθεν ang pag-alis mula sa naunang lugar; ang δέ ay banayad na pang-ugnay at hindi kailangang gawing tahasang panalungat sa natural na Tagalog.
- source_word: ἀναστὰς
  choice: tumindig siya
  rationale: Ang aorist participle ay naghahanda sa kasunod na kilos. Pinananatili ng “tumindig” ang kongkretong diwa ng pagbangon nang hindi nagiging mabigat ang pangungusap.
- source_word: ἀπῆλθεν
  choice: pumunta
  rationale: Sa konteksto, malinaw na ang kilos ay pag-alis mula sa dating kinaroroonan patungo sa ibang lugar. Natural sa Tagalog ang “pumunta,” habang naipahahayag na ng “Mula roon” ang pag-alis.
- source_word: εἰς τὰ ὅρια Τύρου
  choice: sa nasasakupan ng Tiro
  rationale: Ang ὅρια ay maaaring tumukoy sa mga hangganan, distrito, o teritoryong kaugnay ng Tiro. Ang “nasasakupan” ay hindi naglilimita sa kahulugan sa mismong guhit ng hangganan.
- source_word: καὶ εἰσελθὼν εἰς οἰκίαν
  choice: Pumasok siya sa isang bahay
  rationale: Ang participle ay nagsasaad ng kasunod na kilos, at ang οἰκίαν na walang artikulo ay likas isaling “isang bahay.”
- source_word: οὐδένα ἤθελεν γνῶναι
  choice: ayaw niyang malaman ng sinuman na naroon siya
  rationale: Walang tahasang layon ang γνῶναι sa Griyego; ipinahihiwatig nito ang pagkaalam sa kanyang presensya o kinaroroonan. Nililinaw ng parirala ang likas na ipinahihiwatig nang hindi dinaragdagan ang salaysay.
- source_word: καὶ οὐκ ἠδυνήθη λαθεῖν
  choice: ngunit hindi niya nagawang makaiwas sa pansin
  rationale: Ang λανθάνω ay nangangahulugang hindi mapansin o makaiwas sa pagkakaalam ng iba. Ipinakikita ng “ngunit” ang kaibahan sa kanyang hangarin, at pinananatili ng salin ang aktibong idyoma ng Griyego.
