translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nasasakupan” upang mapanatili ang lawak ng ὅρια, at ang ipinahihiwatig na layon ng γνῶναι ay nilinaw sa teksto ngunit itinakda rin sa talababa ang literal na anyo.
