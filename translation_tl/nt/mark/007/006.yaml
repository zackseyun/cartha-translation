review_pass:
  verdict: revise
  source_fidelity: Kailangang itama ang “tungkol sa inyong mga mapagkunwari,” dahil ang anyong ito ay karaniwang nangangahulugang ‘tungkol sa mga mapagkunwari ninyo,’ sa halip na tuwirang tawagin ang mga kausap na ‘mga mapagkunwari.’ Ang binagong “tungkol sa inyo, mga mapagkunwari” ay tapat sa appositional na τῶν ὑποκριτῶν. Ang natitirang diwa—ang sipi mula kay Isaias, panlabas na paggalang sa labi, at pusong malayo sa Diyos—ay tapat sa Griyego.
  naturalness: Mas natural at malinaw sa modernong Filipino ang “Tama ang ipinropesiya ni Isaias tungkol sa inyo, mga mapagkunwari.” Ang “sa kanilang mga labi” ay sapat at mas tuwiran kaysa “sa pamamagitan ng kanilang mga labi,” nang hindi nawawala ang instrumental na diwa.
  terminology: Ang “ipinropesiya,” “mapagkunwari,” “bayang ito,” “iginagalang,” at “puso” ay angkop sa marangal ngunit makabagong rehistro. Pinananatili ng “puso” ang pang-isahang kolektibong metapora ng καρδία.
  issues:
  - severity: high
    issue: Maling saklaw ng “inyong mga mapagkunwari”
    rationale: Sa Tagalog, ipinahihiwatig nito ang pagmamay-ari (‘ang mga mapagkunwari ninyo’) at hindi ang direktang pagtawag ni Jesus sa kaniyang mga kausap. Ang Griyego ay ‘tungkol sa inyo, mga mapagkunwari.’
  - severity: low
    issue: Medyo kolokyal ang “Tamang-tama”
    rationale: Bagaman nauunawaan at posible, ang “Tama” ay mas marangal at mas tuwirang katumbas ng Καλῶς sa isang siping pang-Kasulatan.
