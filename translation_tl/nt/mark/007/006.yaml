  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ εἶπεν ⸀αὐτοῖς· Καλῶς ἐπροφήτευσεν Ἠσαΐας περὶ ὑμῶν τῶν ὑποκριτῶν, ὡς γέγραπται ⸀ὅτι Οὗτος ὁ λαὸς τοῖς χείλεσίν με τιμᾷ, ἡ δὲ καρδία αὐτῶν πόρρω ἀπέχει ἀπ’ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/006.yaml
  text: 'But he said to them[a], “Isaiah prophesied well about you hypocrites, as it is written: ‘This people honors me with their lips, but their heart is far from me.’”'
translation:
  language: tl
  text: 'Ngunit sinabi niya sa kanila, “Tama ang ipinropesiya ni Isaias tungkol sa inyo, mga mapagkunwari, gaya ng nasusulat: ‘Iginagalang ako ng bayang ito sa kanilang mga labi, ngunit malayo sa akin ang kanilang puso.’”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Griyego, pang-isahan ang “bayan” at “puso,” samantalang kolektibo ang tinutukoy ng “kanilang.” Maaari ring isalin: “Iginagalang ako ng bayang ito sa mga labi nito, ngunit malayo sa akin ang puso nito.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig nito ang banayad na pagsalungat at paglipat sa tugon ni Jesus.
- source_word: Καλῶς ἐπροφήτευσεν
  choice: Tamang-tama ang ipinropesiya
  rationale: Pinananatili ang malinaw na positibong pagtatasa ng Καλῶς at ang tahasang diwa ng propetikong pagsasalita ng ἐπροφήτευσεν.
- source_word: περὶ ὑμῶν τῶν ὑποκριτῶν
  choice: tungkol sa inyong mga mapagkunwari
  rationale: Likas sa modernong Tagalog at pinananatili ang tuwirang paglalapat sa mga kausap ni Jesus.
- source_word: ὡς γέγραπται ὅτι
  choice: 'gaya ng nasusulat:'
  rationale: Karaniwang pormula sa pagpapakilala ng sipi sa Kasulatan; ang tutuldok ang natural na naghuhudyat sa kasunod na sipi.
- source_word: Οὗτος ὁ λαὸς
  choice: ang bayang ito
  rationale: Pinananatili ang pang-isahang kolektibong λαός at ang marangal na himig ng sipi mula sa propeta.
- source_word: τοῖς χείλεσίν με τιμᾷ
  choice: Iginagalang ako ... sa pamamagitan ng kanilang mga labi
  rationale: Ang τιμάω ay ‘igalang’ o ‘parangalan’; malinaw na ipinakikita ng parirala na panlabas o pasalita ang paggalang.
- source_word: ἡ δὲ καρδία αὐτῶν
  choice: ngunit ... ang kanilang puso
  rationale: Pinananatili ang pang-isahang metapora ng ‘puso’ bilang kolektibong panloob na disposisyon, habang natural sa Tagalog ang ‘kanilang’ para sa isang pangkat.
- source_word: πόρρω ἀπέχει ἀπ’ ἐμοῦ
  choice: malayo sa akin
  rationale: Tumpak at natural na nagpapahayag ng relasyonal at espirituwal na pagkalayo nang hindi ito nililimitahan sa pisikal na distansiya.
theological_decisions:
- issue: Paglalapat ni Jesus ng Isaias 29:13 sa kaniyang mga kausap
  choice: Pinanatili ang tuwirang pagtukoy na “inyong mga mapagkunwari” at “ang bayang ito.”
  alternative: Palambutin o gawing pangkalahatan ang pagsaway upang hindi tahasang tumukoy sa mga kausap.
  rationale: Tuwirang inilalapat ng Griyegong teksto ang propetikong pagsaway sa kasalukuyang mga kausap ni Jesus; hindi ito dapat palambutin o dagdagan ng sektaryang paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ipinropesiya” upang mapanatili ang tiyak na propetikong diwa ng pandiwang Griyego; ang “tamang-tama” ay natural na katumbas ng mariing papuri sa kawastuhan ng sinabi ni Isaias.
