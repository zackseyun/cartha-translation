revisions:
- from: 'Ngunit sinabi niya sa kanila, “Tamang-tama ang ipinropesiya ni Isaias tungkol sa inyong mga mapagkunwari, gaya ng nasusulat: ‘Iginagalang ako ng bayang ito sa pamamagitan ng kanilang mga labi, ngunit malayo sa akin ang kanilang puso.’”[a]'
  to: 'Ngunit sinabi niya sa kanila, “Tama ang ipinropesiya ni Isaias tungkol sa inyo, mga mapagkunwari, gaya ng nasusulat: ‘Iginagalang ako ng bayang ito sa kanilang mga labi, ngunit malayo sa akin ang kanilang puso.’”[a]'
  rationale: Inayos ang panawag na “mga mapagkunwari” upang malinaw na tumukoy ito sa mga kausap ni Jesus, gaya ng hinihingi ng Griyego. Pinasimple rin ang “Tamang-tama” tungo sa “Tama” at ang instrumental na parirala upang maging mas natural ang Filipino, habang pinananatili ang kahulugan at ang kolektibong pang-isahang larawan sa sipi.
