  text: Καὶ προσκαλεσάμενος ⸀πάλιν τὸν ὄχλον ἔλεγεν αὐτοῖς· ⸀Ἀκούσατέ μου πάντες καὶ ⸀σύνετε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/014.yaml
  text: And calling the crowd to him again, he was saying to them, “Listen to me, all of you, and understand.”
translation:
  language: tl
  text: Muli niyang tinawag ang karamihan upang lumapit sa kaniya at sinabi niya sa kanila, “Makinig kayong lahat sa akin at unawain ninyo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος πάλιν τὸν ὄχλον
  choice: Muli niyang tinawag ang mga tao
  rationale: Natural na Filipino para sa muling pagtawag ni Jesus sa pulutong upang lumapit o magbigay-pansin; ang “mga tao” ay mas karaniwang tawag sa kontekstong ito kaysa “pulutong.”
- source_word: ἔλεγεν αὐτοῖς
  choice: sinabi sa kanila
  rationale: Bagaman imperpektibo ang anyo ng pandiwa, karaniwang isinasalaysay sa Filipino ang ganitong panimulang pahayag sa simpleng “sinabi”; ang “patuloy niyang sinasabi” ay maaaring magdagdag ng di-likas na diin sa pagpapatuloy.
- source_word: Ἀκούσατέ μου πάντες
  choice: Makinig kayong lahat sa akin
  rationale: Pinananatili ang tahasang utos sa buong pangkat at ang diin ng πάντες, “lahat.”
- source_word: σύνετε
  choice: unawain ninyo
  rationale: Tuwirang ipinapahayag ang utos na pag-isipan at maunawaan ang susunod na turo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang tuwirang panawagan at dalawang magkaugnay na utos nang walang idinagdag na pagpapakahulugang teolohikal.
