  text: If anyone has ears to hear, let him hear.
translation:
  language: tl
  text: Kung ang sinuman ay may mga tainga upang makarinig, makinig siya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wala ang talatang ito sa pinakamaagang mga manuskritong Griego, kabilang ang Sinaiticus at Vaticanus noong ika-4 na siglo, at sa mga sinaunang bersiyong Coptic. Ngunit naroon ito sa karamihan ng mga manuskrito ng tradisyong Byzantine, sa tradisyong Latin, at sa karamihan ng mga saksi sa Syriac. Malamang na isa itong huling dagdag ng mga tagakopya na umuulit sa kaparehong pananalita sa Marcos 4:9 at 4:23.
    reason: textual_critical
lexical_decisions:
- source_word: ὦτα
  choice: mga tainga
  rationale: Pinananatili ang konkretong larawan ng pisikal na tainga, na ginagamit dito bilang pahiwatig ng pagiging handang tumanggap at umunawa.
- source_word: ἀκούειν
  choice: nakakarinig
  rationale: Sa pariralang “may mga taingang nakakarinig,” likas sa modernong Tagalog ang anyong ito at naipahahayag ang kakayahan o kahandaang makinig.
- source_word: ἀκουέτω
  choice: makinig siya
  rationale: Tumpak at likas na katumbas ng ikatlong panauhang pang-isahang pautos; pinananatili nito ang panawagang hindi lamang makarinig kundi magbigay-pansin.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Ginamit ang “ang sinuman” para sa pangkalahatang singular at “makinig siya” upang maging likas at inklusibo nang hindi binabago ang bilang ng pandiwang Griego.
