  source_fidelity: Ang pandiwang ἀκούειν ay infinitive na nasa pariralang “may mga tainga upang makarinig”; ang “nakakarinig” ay naglilipat dito sa isang pang-uring naglalarawan sa mga tainga. Ang “upang makarinig” ay mas malapit sa anyo at diwa ng Griyego, habang pinananatili ang panawagang “makinig siya” para sa ἀκουέτω.
