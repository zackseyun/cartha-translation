base_translation:
  language: en
  yaml_path: translation/nt/mark/007/032.yaml
  text: And they brought to him a man who was deaf and had difficulty speaking[a], and they begged him to lay his hand on him.
translation:
  language: tl
  text: Dinala nila sa kanya ang isang lalaking bingi at nahihirapang magsalita,[a] at nakiusap sila sa kanya na ipatong niya ang kanyang kamay sa lalaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “isang lalaking bingi at nagsasalita nang may kahirapan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φέρουσιν
  choice: Dinala
  rationale: Karaniwan sa salaysay ni Marcos ang historical present; natural sa makabagong Tagalog ang pangnagdaan habang pinananatili ang pagkakasunod-sunod ng pangyayari.
- source_word: κωφόν
  choice: isang lalaking bingi
  rationale: Dito ay tumutukoy ang κωφός sa pagkabingi, yamang hiwalay na inilalarawan ng μογιλάλον ang hirap sa pagsasalita.
- source_word: μογιλάλον
  choice: nahihirapang magsalita
  rationale: Ipinahihiwatig ng bihirang salitang ito ang hirap o kapansanan sa pagsasalita, hindi ang lubos na kawalan ng kakayahang magsalita.
- source_word: παρακαλοῦσιν
  choice: nakiusap
  rationale: Ipinapahayag nito ang taimtim na paghiling sa konteksto ng pagpapagaling; mas natural at marangal sa Tagalog ang “nakiusap” kaysa sa mas matinding “nagmakaawa,” na maaaring lumabis sa konteksto.
- source_word: ἵνα ἐπιθῇ αὐτῷ τὴν χεῖρα
  choice: na ipatong niya rito ang kanyang kamay
  rationale: Ipinapahayag ng sugnay ang nilalaman ng kanilang pakiusap. Pinananatili ng “kamay” ang isahang bilang ng τὴν χεῖρα, at malinaw na ang “rito” ay tumutukoy sa lalaking dinala kay Jesus.
theological_decisions:
- issue: Kalagayan ng lalaki
  choice: Inilarawan siyang bingi at nahihirapang magsalita, hindi lubusang pipi.
  alternative: bingi at pipi
  rationale: Ang magkahiwalay na κωφός at μογιλάλος ay tumutukoy sa pagkabingi at sa hirap sa pagsasalita. Ang “pipi” ay maaaring magpahiwatig ng ganap na kawalan ng pagsasalita at lalabis sa diwa ng μογιλάλος.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “nahihirapang magsalita” upang maging malinaw sa karaniwang mambabasa nang hindi pinalalabis ang kapansanan; pinanatili rin ang isahang “kamay” ng Griyego.
