  source_fidelity: Tumpak na naisasalin ang ἀκυροῦντες bilang “pinawawalang-bisa,” ang instrumental na τῇ παραδόσει bilang “sa pamamagitan ng,” at ang relative clause na ᾗ παρεδώκατε bilang “ipinasa ninyo.” Ang pangwakas na pangungusap ay wastong naghahatid ng patuloy at paulit-ulit na paggawa ng maraming katulad na bagay.
  naturalness: Likas at malinaw ang modernong Filipino Tagalog. Ang “Sa gayon” ay angkop na pag-uugnay sa nagpapatuloy na paratang mula sa naunang talata, at ang “marami pa kayong ginagawang katulad nito” ay natural na paraan upang ipahayag ang idiomatic ngunit mariing Griyegong parirala.
  terminology: Ang “salita ng Diyos” at “tradisyon” ay angkop, malinaw, at may dignified na rehistro. Hindi idinagdag ang “pantao,” kaya napapanatili ang eksaktong pananalita at tensiyon ng teksto. Ang mga talababa ay wastong nakaangkla at nagbibigay lamang ng lehitimong alternatibong leksikal o mas literal na ayos.
