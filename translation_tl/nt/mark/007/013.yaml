id: MRK.7.13
reference: Mark 7:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀκυροῦντες τὸν λόγον τοῦ θεοῦ τῇ παραδόσει ὑμῶν ᾗ παρεδώκατε· καὶ παρόμοια τοιαῦτα πολλὰ ποιεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/013.yaml
  text: thus nullifying the word of God by your tradition that you have handed down[c][b][a]. And you do many other similar things.
translation:
  language: tl
  text: Sa gayon, pinawawalang-bisa[a] ninyo ang salita ng Diyos sa pamamagitan ng tradisyong ipinasa ninyo.[b] At marami pa kayong ginagawang katulad nito.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ginagawang walang bisa.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “na ipinamana ninyo.”
    reason: lexical_alternative
  - marker: c
    text: 'Sa mas literal na ayos: “At marami kayong ginagawang gayong mga bagay na katulad nito.”'
    reason: previous_rendering
lexical_decisions:
- source_word: ἀκυροῦντες
  choice: pinawawalang-bisa
  rationale: Ipinapahayag nito ang paggawa sa isang bagay na walang bisa o hindi na umiiral ang bisa nito. Ang pariralang “Sa gayon” ay likas na naghahatid sa Filipino ng kaugnayan ng participle sa naunang paratang.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: ang salita ng Diyos
  rationale: Direkta nitong pinananatili ang λόγον bilang “salita” at ang genitive na τοῦ θεοῦ, pati ang mariing paghahambing sa “tradisyon ninyo.”
- source_word: τῇ παραδόσει ὑμῶν
  choice: sa pamamagitan ng tradisyon ninyo
  rationale: 'Ipinakikita ng “sa pamamagitan ng” ang instrumental na gamit ng dative: ang kanilang tradisyon ang paraang ginagamit upang pawalang-bisa ang salita ng Diyos.'
- source_word: ᾗ παρεδώκατε
  choice: na ipinasa ninyo
  rationale: Ang “ipinasa” ay natural na katumbas ng pagpapamana o paghahatid ng tradisyon sa iba at hindi nagdaragdag ng ideyang wala sa teksto.
- source_word: παρόμοια τοιαῦτα πολλὰ
  choice: marami pa … na katulad nito
  rationale: Pinananatili nito ang dami at pagkakatulad ng iba pang gawain, habang iniiwasan ang pilit at paulit-ulit na parirala sa Filipino.
- source_word: ποιεῖτε
  choice: ginagawa ninyo
  rationale: Ang anyong pangkasalukuyan ay angkop sa paulit-ulit o nakaugaliang pagkilos na tinutukoy ng paratang.
theological_decisions:
- issue: Ang likas na katangian ng “tradisyon” sa paratang ni Jesus
  choice: “tradisyon ninyo,” nang walang idinagdag na “pantao”
  alternative: “tradisyon ng tao” o “tradisyong pantao”
  rationale: Ang mismong talata ay nagsasabing ὑμῶν, “ninyo.” Ipinakikita na ng konteksto ang pagsalungat ng tradisyong ito sa salita ng Diyos; hindi kailangang magdagdag ng pang-uring wala sa tekstong Griyego.
translation_notes:
  register: Makabago at dignified na Filipino, gamit ang karaniwang bokabularyo. Pinanatili ang “tradisyon” bilang neutral na katawagan at hinayaang ang konteksto ang magpakita ng negatibong paghatol sa partikular na tradisyong tinutukoy.
