  text: And he ordered them to tell no one. But the more he ordered them[a], the more abundantly they proclaimed it.
translation:
  language: tl
  text: At mahigpit niya silang pinagbilinan na huwag itong sabihin kaninuman. Ngunit kung gaano niya sila pinagbabawalan, lalo naman nilang ipinamalita ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Ngunit habang lalo niya silang pinagbabawalan, lalo pa nilang ipinamalita ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διεστείλατο
  choice: inutusan
  rationale: Ipinahihiwatig ng pandiwa ang pagbibigay ng matibay na utos. Likas sa makabagong Tagalog ang “inutusan” at hindi nito pinahihina ang bisa ng ipinagagawa.
- source_word: ἵνα μηδενὶ λέγωσιν
  choice: na huwag itong sabihin kaninuman
  rationale: Inilalahad ng sugnay ang nilalaman ng utos. Ang “ito” ay tumutukoy sa nangyari at likas na ipinahihiwatig sa Tagalog.
- source_word: ὅσον ... διεστέλλετο
  choice: habang lalo niya silang pinagbabawalan
  rationale: 'Ipinapakita ng ὅσον at ng aspektong di-ganap ng διεστέλλετο ang patuloy at pahambing na diwa: habang higit niyang inuulit o idinidiin ang pagbabawal.'
- source_word: μᾶλλον περισσότερον
  choice: lalo pa
  rationale: Magkasamang nagpapatingkad ang dalawang pang-abay sa patuloy na pagdami o paglakas ng kanilang pagpapahayag. Ang “lalo pa” ay natural na Tagalog at nagpapanatili ng diin nang hindi nagiging mabigat.
- source_word: ἐκήρυσσον
  choice: ipinamalita
  rationale: Ang κηρύσσω ay tumutukoy sa hayagang pagpapahayag sa madla. Sa kontekstong ito, malinaw at natural ang “ipinamalita” at iniiwasan ang mas teknikal o pangsermong dating ng “ipinangaral.”
theological_decisions:
- issue: Ang utos ni Jesus na manahimik at ang pagsuway ng mga nakarinig
  choice: Isinalin ang utos bilang tunay at matibay na pagbabawal, nang hindi ipinaliliwanag ang dahilan nito.
  alternative: Gumamit ng mas interpretatibong pananalita na nagpapaliwanag kung bakit iniutos ni Jesus ang pananahimik.
  rationale: Malinaw sa talata ang tensiyon sa pagitan ng utos ni Jesus at ng lalo pang pagpapamalita ng mga tao. Dapat panatilihin ng salin ang tensiyong ito sa halip na lutasin ito sa pamamagitan ng isang teolohikal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “ipinamalita” upang ihatid ang hayagan at malawakang pagpapahayag, at ang “lalo pa” upang panatilihin ang mariing paghahambing ng Griyego.
