  text: ⸀καὶ ἐπερωτῶσιν αὐτὸν οἱ Φαρισαῖοι καὶ οἱ γραμματεῖς· Διὰ τί ⸂οὐ περιπατοῦσιν οἱ μαθηταί σου⸃ κατὰ τὴν παράδοσιν τῶν πρεσβυτέρων, ἀλλὰ ⸀κοιναῖς χερσὶν ἐσθίουσιν τὸν ἄρτον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/005.yaml
  text: And the Pharisees and the scribes asked him[a], “Why do your disciples not walk according to the tradition of the elders, but eat bread with unclean hands?”
translation:
  language: tl
  text: At tinanong siya ng mga Pariseo at mga eskriba, “Bakit hindi namumuhay ang mga alagad mo ayon sa tradisyon ng mga matatanda, kundi kumakain ng tinapay gamit ang mga kamay na marumi ayon sa ritwal[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “may karaniwang mga kamay.” Ang “karaniwan” dito ay tumutukoy sa pagiging marumi o di-malinis ayon sa ritwal, hindi lamang sa pisikal na dumi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπερωτῶσιν
  choice: tinanong
  rationale: Ang pangkasalukuyang anyo ay historical present sa salaysay; natural sa Tagalog ang payak na pangnagdaan.
- source_word: γραμματεῖς
  choice: mga eskriba
  rationale: Karaniwang katawagan sa kinikilalang pangkat ng mga dalubhasa at tagapagturo ng Kautusan, nang hindi pinapalitan ng mas interpretibong titulo.
- source_word: Διὰ τί
  choice: Bakit
  rationale: Likas at tuwirang katumbas na patanong sa Tagalog.
- source_word: περιπατοῦσιν
  choice: namumuhay
  rationale: Idyomatiko rito ang ‘lumalakad’ bilang paraan ng pamumuhay o pagkilos; ang ‘namumuhay’ ang malinaw at natural na katumbas sa modernong Tagalog.
- source_word: κατὰ τὴν παράδοσιν
  choice: ayon sa tradisyon
  rationale: Tumpak na ipinahahayag ang pagsunod sa isang pamantayang minana.
- source_word: τῶν πρεσβυτέρων
  choice: ng matatanda
  rationale: Pinananatili ang payak na genitibo at ang pagtukoy sa naunang kinikilalang mga awtoridad, nang hindi ipinapalagay na mga opisyal sila ng iglesya.
- source_word: κοιναῖς χερσὶν
  choice: nang marumi ang mga kamay
  rationale: Sa konteksto, ang κοινός ay tumutukoy sa ritwal na karumihan, hindi lamang sa pisikal na dumi; nililinaw ito sa talababa upang maiwasan ang maling pagkaunawang pangkalinisan lamang.
- source_word: τὸν ἄρτον
  choice: ng tinapay
  rationale: Pinananatili ang literal na ‘tinapay,’ na maaari ring kumatawan sa pagkain o kainan sa konteksto.
theological_decisions:
- issue: Ritwal na katayuang ipinahihiwatig ng κοινός
  choice: ‘marumi’ sa teksto, na nililinaw sa talababa bilang ritwal na marumi
  alternative: ‘nadungisan’; ‘di-malinis’; literal na ‘karaniwan’
  rationale: Ang pagtatalo ay tungkol sa ritwal na tradisyon, hindi sa moral na kasamaan o simpleng kalinisan. Pinananatili ng salin at talababa ang puwersang ritwal nang hindi nilulutas ang mas malawak na teolohikal na usapin.
- issue: Metaporikal na gamit ng περιπατέω
  choice: ‘namumuhay’
  alternative: ‘lumalakad’ o ‘kumikilos’
  rationale: Ang tinutukoy ay pagsunod o asal ng mga alagad. Ang ‘namumuhay’ ay natural sa Tagalog at hindi nagmumungkahing literal na paglakad ang usapin.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang ‘mga eskriba’ bilang pamantayang katawagang biblikal, ‘tradisyon ng matatanda’ upang panatilihin ang anyo ng Griyego, at ‘namumuhay’ para sa idyomatikong περιπατέω. Nakalagay agad pagkatapos ng kaugnay na parirala ang talababa [a].
