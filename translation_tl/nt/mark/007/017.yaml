  text: Καὶ ὅτε εἰσῆλθεν ⸀εἰς οἶκον ἀπὸ τοῦ ὄχλου, ἐπηρώτων αὐτὸν οἱ μαθηταὶ αὐτοῦ ⸂τὴν παραβολήν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/017.yaml
  text: And when he entered a house away from the crowd[a], his disciples asked him about the parable.
translation:
  language: tl
  text: At nang pumasok siya sa isang bahay, malayo sa karamihan, tinanong siya ng kanyang mga alagad tungkol sa talinghaga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kasabihan” o “paglalarawan.” Ang salitang Griyego ay παραβολή (parabolē).
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: At
  rationale: Pinananatili ang karaniwang pang-ugnay upang maipakita ang tuloy-tuloy na daloy ng salaysay ni Marcos.
- source_word: ὅτε
  choice: nang
  rationale: Likas na panandang temporal sa Tagalog para sa pangyayaring nagsisilbing kalagayan ng kasunod na kilos.
- source_word: εἰσῆλθεν εἰς οἶκον
  choice: pumasok siya sa isang bahay
  rationale: Ipinapahayag ang kilos ng pagpasok at sinasalamin ng “isang bahay” ang kawalan ng artikulo sa οἶκον nang hindi ipinapalagay na tiyak na bahay iyon.
- source_word: ἀπὸ τοῦ ὄχλου
  choice: palayo sa mga tao
  rationale: Likas na ipinahihiwatig ang pagkakahiwalay niya sa karamihan matapos pumasok sa bahay.
- source_word: ἐπηρώτων
  choice: tinanong
  rationale: Natural sa salaysay na Tagalog ang aspektong perpektibo rito; hindi kailangang gawing paulit-ulit ang kilos bagaman imperfect ang Griyego.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ang kanyang mga alagad
  rationale: Natural at malinaw na salin ng pariralang may pagmamay-ari.
- source_word: τὴν παραβολήν
  choice: tungkol sa talinghaga
  rationale: Pinananatili ang sariling kategorya ni Marcos para sa matalinghagang turo ni Jesus, kahit maaari ring mas malawak ang kahulugan ng salita sa kontekstong ito.
theological_decisions:
- issue: Ang kahulugan ng παραβολή sa kontekstong maaaring tumukoy sa isang maikling matalinghagang pahayag
  choice: talinghaga
  alternative: kasabihan; paglalarawan
  rationale: Pinananatili ng “talinghaga” ang terminong ginamit ni Marcos at ang interpretibong lawak nito, sa halip na paliitin ito sa isang kasabihan o ipaliwanag agad bilang paglalarawan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mga tao” bilang natural na pagtukoy sa ὄχλος sa kontekstong ito, at “talinghaga” bilang pamilyar ngunit dignified na terminong biblikal.
