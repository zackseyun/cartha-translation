id: MRK.7.21
reference: Mark 7:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἔσωθεν γὰρ ἐκ τῆς καρδίας τῶν ἀνθρώπων οἱ διαλογισμοὶ οἱ κακοὶ ἐκπορεύονται, ⸂πορνεῖαι, κλοπαί, φόνοι,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/021.yaml
  text: 'For from within[a], out of the heart of men, evil thoughts come out: sexual immoralities, thefts, murders[b],'
translation:
  language: tl
  text: 'Sapagkat mula sa loob—mula sa puso ng mga tao—lumalabas ang masasamang kaisipan: mga imoral na gawaing seksuwal[a], mga pagnanakaw, at mga pagpaslang,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay nasa maramihang anyo at malawak na tumutukoy sa mga imoral na gawaing seksuwal.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσωθεν
  choice: mula sa loob
  rationale: Pinananatili nito ang larawan ng isang bagay na nagmumula sa kaloob-looban at ang kaibahan nito sa mga panlabas na bagay sa konteksto.
- source_word: γὰρ
  choice: sapagkat
  rationale: Ipinakikita nitong ang talata ay nagbibigay ng paliwanag o batayan sa naunang pahayag.
- source_word: καρδίας
  choice: puso
  rationale: Pinananatili ang karaniwang biblikal na larawan ng puso bilang sentro ng pag-iisip, pagpapasya, at moral na pagkatao.
- source_word: ἀνθρώπων
  choice: mga tao
  rationale: Bagaman nasa anyong panlalaking maramihan sa Griyego, ginagamit ito rito nang pangkalahatan para sa lahat ng tao; natural at tumpak sa modernong Tagalog ang “mga tao.”
- source_word: διαλογισμοὶ οἱ κακοὶ
  choice: masasamang kaisipan
  rationale: Malinaw na tumutukoy sa mga panloob na pag-iisip o pagbabalak na may masamang katangiang moral.
- source_word: ἐκπορεύονται
  choice: lumalabas
  rationale: Pinananatili ang larawan ng paglabas o pagmumula ng mga ito sa puso.
- source_word: πορνεῖαι
  choice: mga imoral na gawaing seksuwal
  rationale: Ipinahahayag ang maramihang anyo at ang malawak na saklaw ng mga ipinagbabawal o imoral na seksuwal na gawain nang hindi ito nililimitahan sa iisang uri.
- source_word: κλοπαί
  choice: mga pagnanakaw
  rationale: Natural na maramihang katumbas para sa mga gawa ng pagnanakaw sa talaan ng masasamang gawain.
- source_word: φόνοι
  choice: mga pagpaslang
  rationale: Mas malinaw kaysa “mga pagpatay” na tumutukoy ito sa masama at labag-sa-matuwid na pagkitil ng buhay.
theological_decisions:
- issue: Pangkalahatang gamit ng ἀνθρώπων
  choice: mga tao
  alternative: mga lalaki
  rationale: Ang tinutukoy ay sangkatauhan sa pangkalahatan, hindi lamang mga lalaking nasa hustong gulang; iniiwasan ng salin ang maling pagpapakitid ng saklaw.
- issue: Saklaw at bilang ng πορνεῖαι
  choice: mga imoral na gawaing seksuwal
  alternative: imoralidad na seksuwal
  rationale: Pinananatili ang maramihang anyo at ang malawak na kahulugan ng salita nang hindi nagtatakda ng mas makitid na doktrinal o makabagong kategorya.
- issue: Ugnayan ng “masasamang kaisipan” sa kasunod na talaan
  choice: pinanatili ang tutuldok at ang tuwirang talaan
  alternative: ipaliwanag ang mga kilos bilang hiwalay sa mga kaisipan
  rationale: Ang pagkakabuo ng Griyego ay naglalagay ng kasunod na mga bisyo pagkatapos ng “masasamang kaisipan.” Pinananatili ng salin ang tensiyong ito sa halip na ipaliwanag o ayusin ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang mga gitling upang likas na maipakita na nililinaw ng “mula sa puso ng mga tao” ang “mula sa loob.” Pinanatili ang hulihang kuwit dahil nagpapatuloy ang talaan sa kasunod na talata.
