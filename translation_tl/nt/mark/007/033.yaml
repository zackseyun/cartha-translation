  text: And taking him aside from the crowd privately[a], he put his fingers into his ears, and after spitting[b], he touched his tongue.
translation:
  language: tl
  text: At ibinukod niya ang lalaki mula sa karamihan nang sarilinan[a]. Ipinasok niya ang kaniyang mga daliri sa mga tainga ng lalaki, at matapos dumura[b], hinipo niya ang dila nito.
