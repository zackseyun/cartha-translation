    text: O “nang pribado.”
    reason: lexical_alternative
  - marker: b
    text: Sinasabi lamang ng Griyego na matapos dumura si Jesus ay hinipo niya ang dila ng lalaki; hindi nito tahasang sinasabing nilagyan niya ito ng laway.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολαβόμενος αὐτὸν ἀπὸ τοῦ ὄχλου
  choice: inilayo niya ang lalaki sa karamihan
  rationale: Ipinapahayag ng participle ang pagbubukod sa lalaki mula sa karamihan. Ang “inilayo” ay likas sa modernong Tagalog at hindi nagdaragdag ng puwersa o layuning wala sa Griyego.
- source_word: κατ’ ἰδίαν
  choice: upang mapag-isa
  rationale: Ipinahihiwatig ng parirala ang pagiging bukod o pribado. Nililinaw ng “upang mapag-isa” na inilayo ang lalaki mula sa karamihan nang hindi ipinapalagay na ganap na silang dalawa lamang.
- source_word: ἔβαλεν τοὺς δακτύλους αὐτοῦ εἰς τὰ ὦτα αὐτοῦ
  choice: Ipinasok niya ang kanyang mga daliri sa mga tainga nito
  rationale: Pinananatili nito ang kongkretong kilos. Ang “kanyang” ay tumutukoy sa mga daliri ni Jesus, samantalang ang “nito” ay malinaw na tumutukoy sa lalaki.
- source_word: πτύσας
  choice: matapos dumura
  rationale: Likas nitong inilalahad ang kilos na nauna sa paghipo, ngunit hindi sinasabi kung saan napunta ang laway.
- source_word: ἥψατο τῆς γλώσσης αὐτοῦ
  choice: hinipo niya ang dila nito
  rationale: Ang ἅπτομαι na may genitive ay karaniwang nangangahulugang “humipo.” Malinaw na ang dila ay sa lalaking pinagagaling.
theological_decisions:
- issue: Paglalarawan sa kilos ni Jesus sa pagpapagaling
  choice: Tuwirang isalaysay na dumura si Jesus at pagkatapos ay hinipo ang dila ng lalaki.
  alternative: Sabihing nilagyan o pinahiran ni Jesus ng laway ang dila ng lalaki.
  rationale: Hindi tahasang sinasabi ng Griyego na inilagay ang laway sa dila. Pinananatili ng salin ang pagpipigil at tunay na kalabuan ng salaysay nang hindi nagdaragdag ng mekanismo o simbolikong kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “ang lalaki” upang maiwasan ang malabong sunod-sunod na panghalip, at ang “nito” upang malinaw na maiba ang mga bahagi ng katawan ng lalaki sa mga daliri ni Jesus.
