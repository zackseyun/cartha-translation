review_pass:
  verdict: revise
  source_fidelity: Tumpak ang pangunahing daloy na puso–tiyan–palikuran at ang pangmaramihang saklaw ng πάντα τὰ βρώματα. Gayunman, ang “nililinis niya” ay tahasang nagtatalaga kay Jesus bilang paksa ng mahirap na participle na καθαρίζων. Bagaman isang posible at malaganap na pagbasa ito, mas maingat na huwag gawing lubos na tahasan ang paksa sa mismong salin.
  naturalness: Likas ang “tiyan” at “palikuran.” Mas maayos ang daloy kung aalisin ang hindi kinakailangang “at pagkatapos ay,” na wala sa Griyego, at kung ang pangwakas na participial na parirala ay idudugtong bilang paliwanag sa pamamagitan ng gitling.
  terminology: Ang “puso,” “tiyan,” at “palikuran” ay angkop sa modernong Filipino Tagalog at sa rehistrong biblikal. Ang “lahat ng pagkain” ay katanggap-tanggap para sa pangmaramihang βρώματα. Dapat linawin ng talababa na ang alternatibong pagbasa ay interpretasyon ng pangwakas na parirala bilang kaugnay ng panunaw, hindi isang dagdag na ideyang “nailalabas at nalilinis.”
  issues:
  - severity: medium
    issue: Ang “nililinis niya” ay nagbibigay ng tahasang paksa sa καθαρίζων.
    rationale: Ang panlalaking pang-isahang participle ay sintaktikong pinagtatalunan. Posibleng paliwanag ito ng tagapagsalaysay na tumutukoy kay Jesus, ngunit posible ring iugnay sa prosesong panunaw. Ang hayagang “niya” ay mas malakas kaysa sa mismong Griyego at hindi lubos na pinananatili ang kalabuan.
  - severity: low
    issue: Idinagdag ang “pagkatapos ay.”
    rationale: Wala itong katumbas na pang-abay sa Griyego at hindi kailangan upang maipahayag ang simpleng sunod-sunod na kilos ng καὶ ... ἐκπορεύεται.
  - severity: medium
    issue: Ang talababa ay nagsasabing “nailalabas at nalilinis,” na nagdaragdag ng anyong hindi eksaktong ipinapahayag ng pangwakas na parirala.
    rationale: Ang ἐκπορεύεται ay nasa naunang sugnay; ang καθαρίζων πάντα τὰ βρώματα ang pinagtatalunang huling parirala. Dapat ilarawan ng talababa ang alternatibong pag-uugnay nito sa panunaw nang hindi bumubuo ng mas malayang paraphrase.
  revised_text: sapagkat hindi ito pumapasok sa kanyang puso kundi sa kanyang tiyan, at lumalabas sa palikuran”—sa gayon ay nililinis ang lahat ng pagkain.[a]
