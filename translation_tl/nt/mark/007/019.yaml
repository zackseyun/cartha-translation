  text: ὅτι οὐκ εἰσπορεύεται αὐτοῦ εἰς τὴν καρδίαν ἀλλ’ εἰς τὴν κοιλίαν, καὶ εἰς τὸν ἀφεδρῶνα ἐκπορεύεται; —⸀καθαρίζων πάντα τὰ βρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/019.yaml
  text: because it does not enter into his heart but into his stomach[a], and goes out into the latrine"—thus cleansing all foods.
translation:
  language: tl
  text: sapagkat hindi ito pumapasok sa kanyang puso kundi sa kanyang tiyan, at lumalabas sa palikuran”—sa gayon ay nililinis ang lahat ng pagkain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “na sa gayon ay nililinis ang lahat ng pagkain,” kung ang huling parirala ay inuunawang tumutukoy sa proseso ng panunaw sa halip na maging paliwanag ni Marcos.
    reason: alternative_reading
lexical_decisions:
- source_word: καρδίαν
  choice: puso
  rationale: Pinananatili ang konkretong salitang biblikal at ang paghahambing ng panloob na pagkatao sa sistema ng pagtunaw, nang hindi ito pinapakahulugang agad bilang isip o kalooban.
- source_word: κοιλίαν
  choice: tiyan
  rationale: Karaniwan at likas na salitang Filipino para sa bahaging tumatanggap at tumutunaw ng pagkain sa kontekstong ito.
- source_word: ἀφεδρῶνα
  choice: palikuran
  rationale: Malinaw ngunit marangal na tumutukoy sa lugar ng pagdumi; hindi nito ipinapalagay ang makabagong uri ng inidoro o sistema ng alkantarilya.
- source_word: καθαρίζων
  choice: nililinis niya
  rationale: Tuwirang isinasalin ang panlalaking pangkasalukuyang pandiwaring Griyego at pinananatili ang posibilidad na ang paksa ay si Jesus, samantalang itinatala sa talababa ang posibleng pagtukoy nito sa prosesong panunaw.
- source_word: πάντα τὰ βρώματα
  choice: ang lahat ng pagkain
  rationale: Sinasalamin ang kabuuang saklaw at ang pangmaramihang kategorya ng mga pagkaing tinutukoy, sa natural na Filipino.
- source_word: αὐτοῦ
  choice: kanyang
  rationale: Pinananatili ang pang-isahang kinatawang pagtukoy sa taong kumakain.
- source_word: εἰσπορεύεται / ἐκπορεύεται
  choice: pumapasok / lumalabas
  rationale: Pinananatili ang payak na paghahambing ng pagpasok at paglabas.
theological_decisions:
- issue: Pagpapakahulugan sa καθαρίζων πάντα τὰ βρώματα
  choice: 'Paliwanag na ang gumagawa ng paglilinis ay si Jesus: “Sa gayon ay nililinis niya ang lahat ng pagkain.”'
  alternative: 'Paglalarawan sa prosesong panunaw: “sa gayon ay nailalabas at nalilinis ang lahat ng pagkain.”'
  rationale: Ang panlalaking pang-isahang participle ay maaaring unawain bilang paliwanag ng tagapagsalaysay na tumutukoy kay Jesus at sa implikasyon ng kanyang sinabi. Gayunman, mahirap ang sintaks at tunay na posible ang pisyolohikal na pagbasa, kaya pinananatili iyon sa talababa sa halip na tahimik na lutasin ang tensiyong may kaugnayan sa mga pagkaing malinis.
translation_notes:
  register: Modernong Filipino na likas at marangal. Ginamit ang “palikuran” sa halip na mas kolokyal o anakronistikong katawagan. Ang panandang [a] ay inilagay kaagad pagkatapos ng pariralang may tunay na sintaktiko at teolohikal na kalabuan.
