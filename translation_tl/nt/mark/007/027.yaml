id: MRK.7.27
reference: Mark 7:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸂καὶ ἔλεγεν⸃ αὐτῇ· Ἄφες πρῶτον χορτασθῆναι τὰ τέκνα, οὐ γὰρ ⸂καλόν ἐστιν⸃ λαβεῖν τὸν ἄρτον τῶν τέκνων καὶ ⸂τοῖς κυναρίοις βαλεῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/027.yaml
  text: And he was saying to her[a], “Let the children be fed first, for it is not good to take the children’s bread and throw it to the little dogs.”
translation:
  language: tl
  text: At sinabi niya sa babae, “Hayaan munang mabusog ang mga anak, sapagkat hindi mabuting kunin ang tinapay ng mga anak at ihagis iyon sa maliliit na aso.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga asong nasa bahay,” o “mga aso” lamang. Diminutibo ang salitang Griyego at maaaring tumukoy sa maliliit na aso o mga asong inaalagaan sa bahay, sa halip na bigyang-diin ang mga asong-gala.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: sinabi
  rationale: Bagaman imperpekto ang anyo at maaaring magpahiwatig ng patuloy na pagsasalita, ang karaniwang salaysay na Tagalog na “sinabi” ang pinakanatural dito; hindi kailangang gawing “patuloy niyang sinasabi” kung walang malinaw na pag-uulit.
- source_word: Ἄφες
  choice: Hayaan
  rationale: Likas na katumbas sa Tagalog ng pahintulot na ipinahahayag ng pautos na anyo.
- source_word: πρῶτον
  choice: muna
  rationale: Pinananatili ang pagkakasunod-sunod at prayoridad nang hindi ipinahihiwatig ang ganap na pagbubukod sa iba.
- source_word: χορτασθῆναι
  choice: mabusog
  rationale: Tuwirang ipinahahayag ang pagkain hanggang sa kasiyahan at angkop sa larawan ng tinapay at hapag.
- source_word: τὰ τέκνα
  choice: ang mga anak
  rationale: Pinananatili ang metaporang pampamilya at hindi nilalagyan sa teksto ng tahasang paliwanag sa tinutukoy nito.
- source_word: καλόν ἐστιν
  choice: hindi mabuting
  rationale: Malapit sa καλόν bilang mabuti o nararapat at natural sa dignified na modernong Tagalog.
- source_word: λαβεῖν
  choice: kunin
  rationale: Payak at tuwirang katumbas ng pandiwa sa konteksto.
- source_word: ἄρτον
  choice: tinapay
  rationale: Pinananatili ang kongkretong larawan ng pagkain sa sambahayan sa halip na palawakin bilang pangkalahatang “pagkain.”
- source_word: κυναρίοις
  choice: maliliit na aso
  rationale: Inilalarawan ang diminutibong anyo nang hindi gumagamit ng “tuta,” na maaaring magdagdag ng sobrang tiyak na kahulugang edad.
- source_word: βαλεῖν
  choice: ihagis iyon sa
  rationale: Pinananatili ang malinaw at masiglang larawan ng βάλλω; ang “iyon” ay likas na tumutukoy sa tinapay.
theological_decisions:
- issue: Metaporikal na puwersa ng “mga anak” at “maliliit na aso”
  choice: Panatilihin ang metapora ng sambahayan nang hindi tahasang pinapangalanan sa pangunahing teksto ang mga tinutukoy.
  alternative: Isalin nang paliwanag ang “mga anak” bilang Israel o mga Judio at ang “maliliit na aso” bilang mga Hentil.
  rationale: Ang Griyego mismo ay naghaharap ng metapora. Ang hindi pagpapaliwanag nito sa loob ng salin ay umiiwas sa pagpasok ng interpretasyon at pinananatili ang puwersa ng konteksto.
- issue: Diwa ng πρῶτον
  choice: Isalin bilang “muna.”
  alternative: Alisin ang diwa ng pagkakasunod-sunod o gawing ganap na pagbubukod.
  rationale: Pinananatili ng “muna” ang prayoridad sa mga anak ngunit hindi nilulutas ang tensiyon kung may susunod pang pagbibigay sa iba.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “sa babae” upang luminaw ang pambabaeng reperente ng αὐτῇ nang hindi umaasa sa panghalip na walang kasarian sa Tagalog. Ang marka ng talababa [a] ay inilagay kaagad pagkatapos ng “maliliit na aso.”
