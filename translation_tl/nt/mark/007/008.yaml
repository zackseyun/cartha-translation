id: MRK.7.8
reference: Mark 7:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀ἀφέντες τὴν ἐντολὴν τοῦ θεοῦ κρατεῖτε τὴν παράδοσιν τῶν ⸀ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/008.yaml
  text: Leaving the commandment of God[a], you hold fast to the tradition of men.
translation:
  language: tl
  text: Isinasaisantabi ninyo ang utos ng Diyos, at mahigpit ninyong pinanghahawakan ang tradisyon ng tao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tradisyon ng mga tao.” Ang Griyego ay tumutukoy sa mga tao sa pangkalahatan, bilang pagsalungat sa nagmumula sa Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφέντες
  choice: Isinasaisantabi
  rationale: Ipinapahayag nito ang kusang pag-iwan o hindi pagpapahalaga sa utos bilang kasabay o nauunang kilos kaugnay ng pangunahing pandiwa. Natural ito sa modernong Filipino at hindi kasing-tindi ng “tinatalikuran.”
- source_word: τὴν ἐντολὴν τοῦ θεοῦ
  choice: ang utos ng Diyos
  rationale: Ang “utos” ang natural at marangal na katumbas ng ἐντολή sa Filipino; malinaw na ipinakikita ng “ng Diyos” ang pinagmulan o pagmamay-ari.
- source_word: κρατεῖτε
  choice: mahigpit ninyong pinanghahawakan
  rationale: Pinananatili nito ang diwa ng matatag at masugid na pagkapit, hindi lamang payak na pagsunod.
- source_word: τὴν παράδοσιν
  choice: ang tradisyon
  rationale: Karaniwang katumbas ito ng παράδοσις at tumutukoy sa kaugaliang ipinamana o itinuro ng naunang salinlahi.
- source_word: τῶν ἀνθρώπων
  choice: ng tao
  rationale: Sa Filipino, ang pangkalahatang “tao” ay likas na kolektibo at walang kasariang ipinahihiwatig; pinananatili nito ang pagsalungat ng mula sa tao sa mula sa Diyos.
theological_decisions:
- issue: Pagsalungat ng utos ng Diyos at tradisyon ng tao
  choice: Panatilihin ang tuwirang pagsalungat sa “utos ng Diyos” at “tradisyon ng tao.”
  alternative: “tradisyon ng mga tao”
  rationale: Ang isahan at kolektibong “tao” ay natural sa Filipino at malinaw na tumutukoy sa pinagmulan nitong pantao, hindi sa mga lalaki lamang. Hindi ipinahihiwatig ng salin na masama ang lahat ng tradisyon; ang pinupuna rito ay ang pagsasantabi sa utos ng Diyos upang panghawakan ang tradisyong pantao.
translation_notes:
  register: Modernong Filipino Tagalog na natural, tuwiran, at marangal. Ginamit ang “ninyo” ayon sa maramihang ikalawang panauhan ng mga pandiwa. Inilagay ang marker [a] kaagad pagkatapos ng pariralang tinutukoy nito.
