  yaml_path: translation/nt/mark/007/020.yaml
  text: And he was saying, “What comes out from the man—that defiles the man.”
translation:
  language: tl
  text: At sinabi pa niya, “Ang lumalabas mula sa tao—iyon ang nagpaparumi sa tao.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ginagawang marumi o di-malinis ang tao.” Ang pandiwang Griyego ay wika ng kadalisayan at tumutukoy sa paggawa sa isang tao na marumi o di-malinis.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: patuloy niyang sinabi
  rationale: Pinananatili nito ang aspektong di-ganap ng imperfect—nagpapatuloy ang pagsasalita—habang natural sa makabagong Tagalog.
- source_word: δὲ
  choice: At
  rationale: Isang banayad na pang-ugnay ito sa daloy ng salaysay, hindi matinding pagsalungat.
- source_word: ὅτι
  choice: panimulang panipi
  rationale: Ipinakikilala nito ang nilalaman ng tuwirang sinabi; mas natural sa Tagalog ang tuwirang sipi kaysa tahasang sugnay na may “na.”
- source_word: Τὸ ἐκ τοῦ ἀνθρώπου ἐκπορευόμενον
  choice: Ang lumalabas sa tao
  rationale: Natural na ipinahahayag ang substantival participle at pinananatili ang larawan ng isang bagay na nagmumula sa tao.
- source_word: ἀνθρώπου / ἄνθρωπον
  choice: sa tao
  rationale: Ang ἄνθρωπος ay pangkalahatan at kumakatawan sa sinumang tao; ang “tao” ang natural at eksaktong katumbas sa Tagalog at pinananatili ang pag-uulit.
- source_word: ἐκεῖνο
  choice: iyon
  rationale: 'Pinananatili ang mariing pagtukoy: ang mismong lumalabas ang siyang nagpaparumi.'
- source_word: κοινοῖ
  choice: nagpaparumi
  rationale: Sa konteksto ng kadalisayan, nangangahulugan itong gawing marumi o di-malinis; malinaw at likas sa Tagalog ang “nagpaparumi.”
theological_decisions:
- issue: Wika ng kadalisayan sa κοινόω
  choice: nagpaparumi
  alternative: ginagawang di-malinis
  rationale: Naipapahayag ng “nagpaparumi” ang moral at panrelihiyong bigat sa konteksto, samantalang inilalagay sa talababa ang mas tahasang wika ng kadalisayan upang hindi mawala ang ritwal na kaugnayan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang retorikal na pag-uulit ng “tao” at ang diin ng ἐκεῖνο sa pamamagitan ng “iyon.”
