base_translation:
  language: en
  yaml_path: translation/nt/mark/007/037.yaml
  text: And they were utterly astonished[a], saying, “He has done everything well[b]. He makes even the deaf hear and the mute speak.”
translation:
  language: tl
  text: Labis-labis silang namangha at sinabi, “Mahusay niyang ginawa ang lahat.[a] Pinapakarinig niya ang mga bingi at pinapagsalita ang mga hindi makapagsalita.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Ginawa niya nang mabuti ang lahat ng bagay.” Maaaring umalingawngaw rito ang pananalita ng Kasulatan tungkol sa kabutihan ng mga gawa ng Diyos.'
    reason: lexical_alternative
  - marker: b
    text: Maaari itong magpaalaala sa Isaias 35:5–6, kung saan sa pagpapanumbalik ng Diyos ay makaririnig ang mga bingi at makapagsasalita ang mga hindi makapagsalita.
    reason: cross_reference
lexical_decisions:
- source_word: ὑπερπερισσῶς
  choice: labis-labis
  rationale: Ipinahahayag ng inuulit na “labis” ang napakatinding antas ng pagkamangha sa natural at mariing Filipino.
- source_word: ἐξεπλήσσοντο
  choice: silang namangha
  rationale: Tumpak na ipinahahayag ng “namangha” ang matinding pagkagulat at paghanga; kasama ng “labis-labis,” naipapanatili ang lakas ng Griyego.
- source_word: λέγοντες
  choice: at sinabi
  rationale: Ginawang koordinadong pandiwa ang participle upang maging natural sa Filipino habang ipinakikilalang ito ang sinabi nila bilang tugon sa kanilang pagkamangha.
- source_word: Καλῶς πάντα πεποίηκεν
  choice: Napakahusay ng lahat ng ginawa niya
  rationale: Inilalarawan nito ang mahusay na kalidad ng lahat ng ginawa niya, pinananatili ang saklaw ng πάντα at ang resultang diin ng perfect na πεποίηκεν nang hindi nagmumukhang moral na pahayag lamang ang καλῶς.
- source_word: τοὺς κωφοὺς
  choice: ang mga bingi
  rationale: Karaniwan, malinaw, at tuwirang katawagan sa mga hindi makarinig sa konteksto ng pagpapagaling.
- source_word: ποιεῖ ἀκούειν
  choice: pinapakarinig niya
  rationale: Ipinapanatili ng pandiwang sanhi ang diwa ng ποιεῖ na ang kilos niya ang dahilan upang makarinig sila.
- source_word: ἀλάλους
  choice: ang mga pipi
  rationale: Maikli at nakasanayang katumbas sa kontekstong tumutukoy sa mga hindi makapagsalita.
- source_word: λαλεῖν
  choice: magsalita
  rationale: Ito ang natural at karaniwang katumbas ng λαλεῖν.
theological_decisions:
- issue: Posibleng alusyon sa Isaias 35:5–6 at posibleng alingawngaw ng pananalita tungkol sa mabuting gawa ng Diyos
  choice: Pinanatiling tuwiran sa pangunahing teksto ang papuri sa lahat ng ginawa ni Jesus at ang pagpaparinig sa mga bingi at pagpapasalita sa mga pipi.
  alternative: Isalin nang mas pormal bilang “Ginawa niyang mabuti ang lahat ng bagay” upang higit na lumitaw ang posibleng alingawngaw ng pananalita tungkol sa paglikha.
  rationale: Ang mas natural na Filipino ay hindi nagdaragdag ng paliwanag na wala sa Griyego, samantalang ang mga talababa ay nagtuturo sa posibleng ugnayang kasulatan nang hindi ito itinatakda bilang tanging kahulugan.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang “labis-labis” upang maipakita ang pambihirang tindi ng ὑπερπερισσῶς, at ang mga pandiwang sanhi na “pinapakarinig” at “pinapagsalita” upang mapanatili ang malinaw na causative construction ng Griyego.
