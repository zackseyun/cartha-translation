  yaml_path: translation/nt/mark/007/010.yaml
  text: For Moses said[a], ‘Honor your father and your mother,’ and[b], ‘Whoever speaks evil of father or mother must surely die.’
translation:
  language: tl
  text: Sapagkat sinabi ni Moises, “Igalang mo ang iyong ama at ang iyong ina,” at, “Ang sinumang nagsasalita ng masama tungkol sa kanyang ama o ina[a] ay tiyak na mamamatay[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sumusumpa sa kanyang ama o ina.” Ang pandiwang Griyego ay maaaring mangahulugang magsalita ng masama, lumait, o sumumpa.
    reason: lexical_alternative
  - marker: b
    text: O “ay dapat patayin.” Gumagamit ang Griyego ng pormulang legal na literal na “mamatay sa kamatayan.”
    reason: alternative_reading
lexical_decisions:
- source_word: Μωϋσῆς
  choice: Moises
  rationale: Karaniwang anyo ng pangalan sa modernong salin ng Bibliya sa Filipino.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag na sumusuporta sa naunang argumento ni Jesus.
- source_word: εἶπεν
  choice: sinabi
  rationale: Natural na pandiwang panipi para sa payak na aorist sa pormula ng pagsipi.
- source_word: Τίμα
  choice: Igalang mo
  rationale: Pinananatili ang bigat at tuwirang pautos ng kautusan sa likas na Filipino.
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα σου
  choice: ang iyong ama at ang iyong ina
  rationale: Tahasan at magkahiwalay na pinananatili ang dalawang layon gaya sa Griyego.
- source_word: Ὁ κακολογῶν
  choice: Ang sinumang nagsasalita ng masama tungkol sa
  rationale: Ipinahahayag ang pangkalahatang bisa ng articular participle at pinananatili ang saklaw ng pandiwa, na maaaring mangahulugang magsalita ng masama, lumait, o sumumpa.
- source_word: πατέρα ἢ μητέρα
  choice: kanyang ama o ina
  rationale: Idinagdag ang panghalip na likas na hinihingi ng Filipino upang luminaw na sariling magulang ang tinutukoy, nang hindi binabago ang diwa ng Griyego.
- source_word: θανάτῳ τελευτάτω
  choice: ay tiyak na mamamatay
  rationale: Natural na katumbas ng mariing pormulang legal na literal na ‘mamatay sa kamatayan’; hindi nito labis na tinutukoy kung paano isasagawa ang parusa.
theological_decisions:
- issue: Pagpapahayag sa legal na pormulang θανάτῳ τελευτάτω
  choice: ay tiyak na mamamatay
  alternative: ay dapat patayin
  rationale: Pinananatili ng pangunahing salin ang mariin at solemneng pormula ng Griyego nang hindi tahasang idinaragdag ang tagapagpatupad ng kamatayan; inilalagay sa talababa ang lehitimong legal na pagpapakahulugang pasibo.
- issue: Lawak ng kahulugan ng κακολογῶν
  choice: nagsasalita ng masama tungkol sa
  alternative: sumusumpa sa
  rationale: Hindi nililimitahan ng pangunahing salin ang pandiwa sa pormal na pagsumpa lamang; pinananatili sa talababa ang mas matinding posibleng kahulugan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang tradisyonal ngunit buhay na anyong pautos na “Igalang mo,” at iniwasan ang sobrang teknikal o makalumang pananalita. Ang mga panandang [a] at [b] ay inilagay mismo sa mga pariralang ipinapaliwanag ng kani-kanilang talababa.
