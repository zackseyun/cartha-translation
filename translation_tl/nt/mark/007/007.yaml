  text: μάτην δὲ σέβονταί με, διδάσκοντες διδασκαλίας ἐντάλματα ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/007.yaml
  text: But they worship me in vain[a], teaching as doctrines the commandments of men.
translation:
  language: tl
  text: Ngunit sinasamba nila ako nang walang kabuluhan; itinuturo nila bilang mga aral ang mga utos ng tao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “itinuturo nila ang mga utos ng tao na para bang mga aral.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μάτην
  choice: nang walang kabuluhan
  rationale: Ipinahahayag ang pagsambang walang saysay o walang tunay na bunga, habang pinananatili ang matinding puwersa ng sipi.
- source_word: δὲ
  choice: Ngunit
  rationale: 'Ipinakikita ang pagsalungat sa naunang pahayag: iginagalang nila ang Diyos sa labi, ngunit malayo sa kaniya ang kanilang puso.'
- source_word: σέβονταί με
  choice: sinasamba nila ako
  rationale: Ang σέβομαι, kapag Diyos ang layon, ay natural na tumutukoy sa pagsamba o pagpipitagan; malinaw at tuwiran ang “sinasamba nila ako.”
- source_word: διδάσκοντες
  choice: itinuturo nila
  rationale: Pinananatili ang kilos na nagpapakilala kung paano naging walang kabuluhan ang kanilang pagsamba.
- source_word: διδασκαλίας
  choice: bilang mga aral
  rationale: Ipinakikita na ang mga utos na nagmula sa tao ay itinuturo na may katayuan ng aral o doktrina.
- source_word: ἐντάλματα ἀνθρώπων
  choice: ang mga utos ng tao
  rationale: Ang “utos” ay nagpapanatili sa diwa ng awtoritatibong kautusan, at ang “ng tao” ay malinaw na nagsasaad ng pinagmulan bilang pantao, kaiba sa Diyos.
theological_decisions:
- issue: Ang ugnayan ng mga aral at ng mga utos ng tao sa siksik na pariralang Griyego
  choice: itinuturo nila bilang mga aral ang mga utos ng tao
  alternative: itinuturo nila ang mga utos ng tao na para bang mga aral
  rationale: Malinaw na ipinakikita ng pangunahing salin na ang mga utos na pantao ay binibigyan ng katayuan ng aral, nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan. Inilalahad sa talababa ang isa pang natural na paraan ng pagpapahayag sa parehong ugnayan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “walang kabuluhan” at “mga aral” upang maging madaling maunawaan habang nananatili ang bigat ng propetikong pagsaway.
