  text: ⸀καὶ ⸀ἠνοίγησαν αὐτοῦ αἱ ἀκοαί, καὶ ἐλύθη ὁ δεσμὸς τῆς γλώσσης αὐτοῦ, καὶ ἐλάλει ὀρθῶς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/035.yaml
  text: And his ears were opened[a], and the bond of his tongue was released[c][b], and he spoke plainly.
translation:
  language: tl
  text: At nabuksan ang kanyang mga tainga[a], nakalas ang tali ng kanyang dila[b], at nagsalita siya nang malinaw[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nabuksan ang kanyang pandinig.” Ang salitang Griyego ay maaaring tumukoy sa kakayahang makarinig gayundin sa mga tainga.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “nakalas ang tali ng kanyang dila”; ibig sabihin, naalis ang hadlang sa kanyang pagsasalita.
    reason: lexical_alternative
  - marker: c
    text: O “nang tama” o “nang maayos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνοίγησαν
  choice: nabuksan
  rationale: Pinananatili ang aorist passive at ang biglaang paggaling na ipinahihiwatig sa salaysay.
- source_word: αἱ ἀκοαί
  choice: ang kanyang mga tainga
  rationale: Bagaman maaaring tumukoy ang ἀκοαί sa pandinig bilang kakayahan, natural sa konteksto ng pagpapagaling ang kongkretong pariralang “mga tainga”; inilalahad sa talababa ang tunay na alternatibo.
- source_word: ἐλύθη
  choice: nakalas
  rationale: Likas na salin ito ng passive na λύω sa konteksto ng isang pagkakatali at pinananatili ang larawan ng pagkalag o pagkaluwag.
- source_word: ὁ δεσμὸς τῆς γλώσσης αὐτοῦ
  choice: ang pagkakatali sa kanyang dila
  rationale: Pinananatili ang kongkretong metapora ng δεσμός sa halip na agad itong ipaliwanag bilang kapansanan sa pagsasalita.
- source_word: ἐλάλει
  choice: nakapagsalita siya
  rationale: Sa konteksto, malinaw na naibalik ang kakayahang magsalita. Ang “nakapagsalita” ay natural sa Filipino at hindi kinakailangang magdagdag ng tahasang aspektong pasimula.
- source_word: ὀρθῶς
  choice: nang malinaw
  rationale: Sa konteksto ng paggaling sa pagsasalita, ipinahahayag nito ang maayos at nauunawaang pagsasalita; ang “nang tama” ay maaaring mapagkamalang tumutukoy sa gramatika o moral na kawastuhan.
theological_decisions:
- issue: Kung literal o interpretatibo ang paglalarawan sa paggaling ng pagsasalita
  choice: Panatilihin ang metaporang “nakalas ang pagkakatali sa kanyang dila”
  alternative: “nawala ang kapansanan niya sa pagsasalita” o “nakalaya ang kanyang dila”
  rationale: Gumagamit ang Griyego ng kongkretong metapora, hindi ng klinikal na katawagan. Pinananatili nito ang larawan at hindi nagpapasok ng higit na paliwanag kaysa sa sinasabi ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pagkakatali” upang mapanatili ang metapora ng orihinal, habang ang “nakapagsalita … nang malinaw” ay natural at madaling maunawaan.
