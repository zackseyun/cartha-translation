  naturalness: Maiintindihan ang draft, ngunit mas natural at mas maayos sa modernong Filipino ang isang pangungusap na hindi inuulit ang paksa. Ang “nang makarinig agad tungkol sa kanya” ay pinananatili ang pangunahing pagkakaugnay ng εὐθὺς sa ἀκούσασα nang hindi ginagawang di-likas ang ayos ng pangungusap.
  terminology: Ang “munting anak na babae” ay angkop para sa θυγάτριον, at ang “maruming espiritu” ay isang tapat at pare-parehong salin ng πνεῦμα ἀκάθαρτον. Ang “nagpatirapa sa paanan niya” ay makatwirang paglalarawan ng kilos na προσέπεσεν πρὸς τοὺς πόδας αὐτοῦ nang hindi ito binibigyan ng dagdag na doktrinal na kahulugan.
