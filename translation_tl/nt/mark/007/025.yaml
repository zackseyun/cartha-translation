  text: ⸂ἀλλ’ εὐθὺς ἀκούσασα⸃ γυνὴ περὶ αὐτοῦ, ἧς εἶχεν τὸ θυγάτριον αὐτῆς πνεῦμα ἀκάθαρτον, ἐλθοῦσα προσέπεσεν πρὸς τοὺς πόδας αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/025.yaml
  text: But immediately a woman whose little daughter had an unclean spirit[a], having heard about him[c][b], came and fell at his feet.
translation:
  language: tl
  text: Ngunit isang babaeng may munting anak na babae na may maruming espiritu[a][b], nang makarinig agad tungkol sa kanya, ay lumapit at nagpatirapa sa paanan niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring ‘batang anak na babae’ o ‘batang babae.’ Ang Griyegong θυγάτριον ay diminutibong anyo ng salitang ‘anak na babae.’
    reason: lexical_alternative
  - marker: b
    text: Maaari ring ‘hindi malinis na espiritu’; ayon sa tradisyon, nauunawaan din itong isang demonyo.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλ’
  choice: Ngunit
  rationale: Pinananatili ang banayad na pagsalungat o paglipat mula sa naunang salaysay.
- source_word: εὐθὺς
  choice: agad
  rationale: Pinananatili ang katangiang pagmamadali sa salaysay ni Marcos at inilalapit ito sa pandiwang ‘nakarinig,’ gaya ng ayos ng Griyego.
- source_word: ἀκούσασα ... περὶ αὐτοῦ
  choice: nakarinig tungkol sa kanya
  rationale: Likas at tuwirang ipinahahayag na nakarinig ang babae ng mga balita o ulat tungkol kay Jesus nang hindi nagdaragdag ng nilalaman sa mga iyon.
- source_word: γυνὴ
  choice: isang babae
  rationale: Walang pantukoy ang γυνή at bagong ipinakikilala ang babae sa tagpo.
- source_word: θυγάτριον
  choice: munting anak na babae
  rationale: Tinutukoy ang relasyong anak at pinananatili ang diminutibong anyo, na maaaring magpahiwatig ng kabataan o lambing.
- source_word: πνεῦμα ἀκάθαρτον
  choice: maruming espiritu
  rationale: Tuwirang pinananatili ang karaniwang katawagan ni Marcos at ang diwang ritwal o moral ng ἀκάθαρτος; ang ‘demonyo’ ay mas interpretatibong katawagan.
- source_word: ἐλθοῦσα
  choice: Lumapit
  rationale: Sa konteksto ng pagpunta sa kinaroroonan ni Jesus, natural na Filipino ang ‘lumapit’ at malinaw ang pagkakasunod ng kilos.
- source_word: προσέπεσεν πρὸς τοὺς πόδας αὐτοῦ
  choice: nagpatirapa sa paanan niya
  rationale: Ipinahahayag ang pisikal na pagbagsak sa paanan bilang kilos ng matinding pagsusumamo at pagpapakumbaba.
theological_decisions:
- issue: Pagpapakahulugan sa πνεῦμα ἀκάθαρτον
  choice: maruming espiritu
  alternative: masamang espiritu; demonyo
  rationale: Pinananatili ang mismong terminolohiya ni Marcos at hindi agad ipinapalit ang interpretatibong ‘demonyo,’ kahit magkaugnay ang mga tinutukoy ng mga katawagang iyon.
- issue: Ugnayan ng εὐθὺς sa mga kilos ng babae
  choice: iniuugnay ang ‘agad’ sa pagkarinig niya
  alternative: iugnay ang ‘agad’ sa paglapit at pagpapatirapa niya
  rationale: Ang pinakamalapit na pandiwaring Griyego ay ἀκούσασα, kaya iyon ang pangunahing ugnayang pinanatili; hindi nito itinatanggi na mabilis ding sumunod ang paglapit niya.
translation_notes:
  register: Makabago at marangal na Filipino para sa karaniwang mambabasa. Pinanatili ang terminong ‘maruming espiritu’ dahil mahalaga ito sa bokabularyo ni Marcos. Ginamit ang ‘munting anak na babae’ upang mapanatili ang relasyong pampamilya at ang diminutibong himig, samantalang ang bahagyang pormal na ‘nagpatirapa’ ay angkop sa kilos ng agarang pagsusumamo.
