revisions:
- from: Ngunit isang babae na may munting anak na babaeng may maruming espiritu[a][b] ang agad na nakarinig tungkol sa kanya. Lumapit ang babae at nagpatirapa sa paanan niya.
  to: Ngunit isang babaeng may munting anak na babae na may maruming espiritu[a][b], nang makarinig agad tungkol sa kanya, ay lumapit at nagpatirapa sa paanan niya.
  rationale: Pinag-isa ang pangungusap upang maipakita ang magkakaugnay na daloy ng salaysay at inalis ang hindi kailangang pag-uulit ng paksa. Pinanatili ang “agad” na pangunahing kaugnay ng pagkarinig, alinsunod sa εὐθὺς ἀκούσασα, at hindi binago ang kahulugan ng mga pangunahing termino. Ginawang mas likas ang alternatibong salita sa talababa.
