  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὐδέν ἐστιν ἔξωθεν τοῦ ἀνθρώπου εἰσπορευόμενον εἰς αὐτὸν ὃ δύναται ⸂κοινῶσαι αὐτόν⸃· ἀλλὰ τὰ ⸂ἐκ τοῦ ἀνθρώπου ἐκπορευόμενά⸃ ἐστιν τὰ κοινοῦντα τὸν ⸀ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/015.yaml
  text: There is nothing outside a man that by going into him is able to defile him; rather, the things that come out from the man are what defile the man.
translation:
  language: tl
  text: Walang anumang bagay na nasa labas ng tao ang may kakayahang magparumi[a] sa kanya sa pagpasok nito sa loob niya; sa halip, ang mga lumalabas mula sa tao ang siyang nagpaparumi sa tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “gawing marumi” o “gawing di-malinis.” Maaaring tumukoy ang salitang Griyego sa pagiging marumi ayon sa mga tuntunin ng kalinisan, ngunit may mas malawak din itong moral na diwa sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδέν
  choice: walang anuman
  rationale: Natural na katumbas ng ganap na pagtanggi sa neuter singular; malinaw na walang bagay na hindi saklaw.
- source_word: ἔξωθεν τοῦ ἀνθρώπου
  choice: nasa labas ng tao
  rationale: Pinananatili ang panlabas na lokasyon at ang kaibhan nito sa mga bagay na lumalabas mula sa tao.
- source_word: εἰσπορευόμενον εἰς αὐτόν
  choice: sa pagpasok nito sa kanya
  rationale: Inilalahad ang paraang tinutukoy ng participle at nililinaw na ang pumapasok ay ang bagay na nasa labas.
- source_word: δύναται
  choice: makapag-
  rationale: Ang kakayahan o posibilidad na ipinahihiwatig ng δύναται ay likas na naipapahayag ng unlaping makapag- sa Filipino.
- source_word: κοινῶσαι / κοινοῦντα
  choice: makapagpaparumi / nagpaparumi
  rationale: Sa usapin ng kalinisan, saklaw ng 'parumihin' ang pagiging marumi ayon sa mga tuntunin ng kalinisan at ang mas malawak na moral na diwa sa konteksto.
- source_word: ἀλλὰ
  choice: sa halip
  rationale: Ipinakikita ang mariing pagtutuwid at pagsalungat, hindi lamang payak na pagdaragdag ng kabaligtarang sugnay.
- source_word: τὰ ἐκ τοῦ ἀνθρώπου ἐκπορευόμενα
  choice: ang mga lumalabas mula sa tao
  rationale: Pinananatili ang maramihang anyo at ang sadyang kaibhan ng 'mula sa tao' sa 'nasa labas ng tao.'
- source_word: ἄνθρωπος
  choice: tao
  rationale: Ang 'tao' ay natural, marangal, at pangkalahatang tawag sa isang tao sa Filipino, habang napapanatili ang isahang retorikal na anyo.
theological_decisions:
- issue: Kahulugan ng κοινόω sa pagtatalo tungkol sa kalinisan
  choice: magparumi
  alternative: gawing marumi / gawing di-malinis
  rationale: Hindi nililimitahan ng 'magparumi' ang salita sa ritwal na karumihan lamang; naiiwan din ang moral na bigat na nililinaw ng kasunod na konteksto.
- issue: Pangkalahatang gamit ng ἄνθρωπος
  choice: tao
  alternative: isang tao
  rationale: Ang 'tao' ay maaaring gamitin nang pangkalahatan sa Filipino at nagpapanatili ng pag-uulit at pagtutulad ng mga sugnay nang hindi nag-aangkat ng kasariang hindi mahalaga sa pahayag.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Pinanatili ang tahasang kaibhan ng bagay na pumapasok mula sa labas at ng mga bagay na lumalabas mula sa tao. Ang 'sa kanya' ay karaniwang generic na panghalip sa Filipino at hindi nagtatakda na lalaki lamang ang tinutukoy.
