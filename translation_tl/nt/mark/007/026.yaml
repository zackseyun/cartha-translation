  text: ⸂ἡ δὲ γυνὴ ἦν⸃ Ἑλληνίς, Συροφοινίκισσα τῷ γένει· καὶ ἠρώτα αὐτὸν ἵνα τὸ δαιμόνιον ἐκβάλῃ ἐκ τῆς θυγατρὸς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/026.yaml
  text: The woman was a Greek[a], a Syrophoenician by birth[b], and she kept asking him to cast the demon out of her daughter.
translation:
  language: tl
  text: Ang babae ay Griyega[a], Sirofenicia ang lahi[b], at patuloy siyang humihiling sa kanya na palayasin ang demonyo mula sa kanyang anak na babae.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang Hentil.” Ang literal na salita sa Griyego ay “Griyega”; sa kontekstong ito, malamang na ipinakikita rin nitong hindi siya Judio.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “Sirofenicia ayon sa lahi o pinagmulan”; ibig sabihin, mula siya sa lahing Sirofenicia.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑλληνίς
  choice: Griega
  rationale: Tuwirang pinananatili ang tiyak na salitang Griyego para sa isang babaeng Griego. Sa kontekstong ito, ipinahihiwatig din nito na hindi siya Judio, ngunit hindi pinalitan ng mas malawak na katawagang “Hentil” ang mismong salita.
- source_word: Συροφοινίκισσα τῷ γένει
  choice: Sirofenicia ang lahi
  rationale: Natural at maikli itong pahayag sa modernong Tagalog para sa kaniyang etniko at heograpikong pinagmulan. Iniiwasan nito ang di-natural na literalismong “ayon sa uri” habang pinananatili ang diwa ng γένος bilang lahi o pinagmulan.
- source_word: ἠρώτα
  choice: patuloy niyang hinihiling
  rationale: Ipinakikita ng aspektong imperpektibo ang nagpapatuloy o paulit-ulit na paghiling. Hindi dinaragdagan ng saling ito ang emosyonal na tindi na maaaring ipahiwatig ng “nagmamakaawa.”
- source_word: ἵνα ... ἐκβάλῃ
  choice: na palayasin ... mula sa
  rationale: Ipinahahayag nito nang natural sa Tagalog ang nilalaman ng kahilingan at ang puwersa ng ἐκβάλλω sa konteksto ng pagpapalayas ng demonyo.
- source_word: τὸ δαιμόνιον
  choice: ang demonyo
  rationale: Tuwirang katumbas ito ng δαιμόνιον at hindi ito pinapalitan ng “masamang espiritu” o “maruming espiritu,” na ibang mga parirala sa Griyego.
- source_word: ἐκ τῆς θυγατρὸς αὐτῆς
  choice: mula sa kanyang anak na babae
  rationale: Ang “mula sa” ay natural na Tagalog para sa ἐκ sa ganitong konteksto, at ang “anak na babae” ay tahasang nagpapanatili sa kasariang ipinahahayag ng θυγάτηρ.
- source_word: δὲ
  choice: at
  rationale: Banayad na pagpapatuloy ng salaysay ang δέ rito, hindi matinding pagsalungat. Ang “at” ay natural na pang-ugnay sa pangungusap at hindi nagdaragdag ng tahasang panandang panahong wala sa pinagmulan.
theological_decisions:
- issue: Pagkakakilanlang etniko ng babae
  choice: 'Pinanatili ang dalawang paglalarawan: “Griega” at “Sirofenicia ang lahi.”'
  alternative: “Isang Hentil na nagmula sa Sirofenicia”
  rationale: Nagbibigay ang teksto ng dalawang magkakaugnay ngunit hindi lubos na magkaparehong paglalarawan—isang katawagang may kultural at di-Judiong pahiwatig, at isang mas tiyak na etniko-heograpikong pinagmulan. Hindi pinagsasama o binubura ng salin ang alinman.
- issue: Kalagayan ng anak na babae
  choice: “ang demonyo”
  alternative: “ang masamang espiritu”
  rationale: Sinusunod ng salin ang tahasang δαιμόνιον at hindi pinahihina o muling binibigyang-kahulugan ang supernatural na pahayag ng talata.
translation_notes:
  register: Gumamit ng kasalukuyan, malinaw, at marangal na Tagalog. Ang “Griega” at “Sirofenicia” ay mga pangkaraniwang anyong pambabae sa tradisyong biblikal na Tagalog ngunit nananatiling madaling maunawaan. Pinanatili ang nagpapatuloy na aspekto ng pandiwa sa “patuloy niyang hinihiling,” at iniwasan ang sobrang emosyonal na “nagmamakaawa.”
