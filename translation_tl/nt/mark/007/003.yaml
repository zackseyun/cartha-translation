  text: οἱ γὰρ Φαρισαῖοι καὶ πάντες οἱ Ἰουδαῖοι ἐὰν μὴ πυγμῇ νίψωνται τὰς χεῖρας οὐκ ἐσθίουσιν, κρατοῦντες τὴν παράδοσιν τῶν πρεσβυτέρων,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/003.yaml
  text: For the Pharisees and all the Jews do not eat unless they wash their hands with a fist[a], holding to the tradition of the elders.
translation:
  language: tl
  text: Sapagkat ang mga Pariseo at ang lahat ng mga Judio ay hindi kumakain malibang hugasan nila ang kanilang mga kamay ayon sa nakaugaliang paraan[a], bilang pagsunod sa tradisyon ng mga matatanda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “gamit ang kamao.” Hindi tiyak ang kahulugan ng salitang Griyego; maaari rin itong tumukoy sa paghuhugas hanggang sa pulsuhan o sa masusing paghuhugas. Maaaring inilalarawan nito ang nakaugaliang paraan ng rituwal na paghuhugas ng kamay.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag na pahabol sa naunang salaysay at natural itong nag-uugnay sa konteksto.
- source_word: Φαρισαῖοι
  choice: mga Pariseo
  rationale: Karaniwang makabagong Tagalog na anyo ng pangalan ng pangkat na Judio.
- source_word: πάντες οἱ Ἰουδαῖοι
  choice: ang lahat ng mga Judio
  rationale: Pinananatili ang malawak at retorikal na paglalahat ng Griyego nang hindi ito nililimitahan sa mga taga-Judea.
- source_word: ἐὰν μὴ
  choice: malibang
  rationale: Natural at malinaw na katumbas ng negatibong kondisyon.
- source_word: πυγμῇ
  choice: ayon sa nakaugaliang paraan[a]
  rationale: Hindi tiyak ang eksaktong kahulugan ng salita at malamang na tumutukoy sa isang partikular na paraan o lawak ng rituwal na paghuhugas. Iniiwasan ng pangunahing salin ang mapanlinlang na literalismong 'gamit ang kamao,' habang inilalahad sa talababa ang tunay na mga posibilidad.
- source_word: νίψωνται τὰς χεῖρας
  choice: hugasan nila ang kanilang mga kamay
  rationale: Tuwirang inilalarawan ang paghuhugas ng isang bahagi ng katawan, dito ay ang mga kamay.
- source_word: οὐκ ἐσθίουσιν
  choice: hindi kumakain
  rationale: Pinananatili ang pangkasalukuyang anyong nagsasaad ng nakagawiang kilos; hindi kailangang dagdagan ng tahasang layon.
- source_word: κρατοῦντες
  choice: bilang pagsunod
  rationale: Ipinahahayag ang matatag na pagtalima sa minanang kaugalian sa natural na Tagalog.
- source_word: παράδοσιν
  choice: tradisyon
  rationale: Karaniwan at malinaw na tawag sa mga turo o kaugaliang ipinamana sa komunidad.
- source_word: τῶν πρεσβυτέρων
  choice: ng matatandang pinuno
  rationale: Nililinaw na ang πρεσβύτεροι ay kinikilalang mga nakatatandang awtoridad, hindi lamang matatanda sa edad.
theological_decisions:
- issue: Saklaw ng “lahat ng mga Judio”
  choice: Pinanatili ang malawak na pahayag na “ang lahat ng mga Judio.”
  alternative: “lahat ng mga taga-Judea” o “maraming Judio”
  rationale: Tahasang πάντες ang Griyego. Isa itong retorikal na paglalahat sa paliwanag ni Marcos, hindi kinakailangang estadistikal na pahayag tungkol sa bawat indibidwal.
- issue: Kahulugan ng πυγμῇ
  choice: “ayon sa nakaugaliang paraan” sa teksto, na may talababa
  alternative: “gamit ang kamao,” “hanggang sa pulsuhan,” o “maigi”
  rationale: Lubhang pinagtatalunan ang salita at maaaring tumukoy sa paraan o lawak ng rituwal na paghuhugas. Pinananatili sa talababa ang leksikal na tensiyon sa halip na gawing tiyak ang isang di-tiyak na pakahulugan.
- issue: Pagkakakilanlan ng mga πρεσβύτεροι
  choice: “matatandang pinuno”
  alternative: “mga ninuno” o payak na “matatanda”
  rationale: Tumutukoy ang salita sa mga kinikilalang nakatatandang awtoridad na pinagmulan o tagapag-ingat ng tradisyon; hindi malinaw na mga ninuno ang tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang paliwanag na himig ng talata at ang malawak na pahayag ng orihinal, habang ang hindi tiyak na πυγμῇ ay isinalin nang natural at ipinaliwanag sa talababa.
