  text: μοιχεῖαι⸃, πλεονεξίαι, πονηρίαι, δόλος, ἀσέλγεια, ὀφθαλμὸς πονηρός, βλασφημία, ὑπερηφανία, ἀφροσύνη·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/022.yaml
  text: adulteries[a], greed, wickedness, deceit, sensuality, an evil eye, slander, pride[b], foolishness.
translation:
  language: tl
  text: mga pangangalunya, kasakiman, mga kasamaan, pandaraya, kahalayan, masamang mata[a], panlalait[b], pagmamataas, at kahangalan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “masamang mata”; isang idyoma para sa inggit, pagdadamot, o mapagmalisyang pananaw.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “paglapastangan sa Diyos.” Ang salitang Griyego ay maaaring tumukoy sa mapanlait o mapanirang pananalita laban sa tao o sa mapanglapastangang pananalita laban sa Diyos.
    reason: alternative_reading
lexical_decisions:
- source_word: μοιχεῖαι
  choice: mga pangangalunya
  rationale: Pinananatili ng “mga” ang tahasang maramihang anyo at ipinahihiwatig ang sari-saring gawa ng pangangalunya.
- source_word: πλεονεξίαι
  choice: kasakiman
  rationale: Likas at malinaw sa makabagong Filipino para sa mapang-angking pagnanais na magkaroon pa nang higit, kadalasan sa kapinsalaan ng iba.
- source_word: πονηρίαι
  choice: mga kasamaan
  rationale: Pinananatili ang maramihang anyo ng Griyego sa natural na Filipino at maaaring tumukoy sa iba’t ibang pagpapakita ng kasamaan.
- source_word: δόλος
  choice: pandaraya
  rationale: Karaniwang salitang Filipino para sa sinasadyang panlilinlang; mas natural kaysa sa mas teknikal o makalumang mga katumbas.
- source_word: ἀσέλγεια
  choice: kahalayan
  rationale: Ipinahahayag ang walang-pigil at walang-kahihiyang asal, na madalas ngunit hindi laging may seksuwal na diwa.
- source_word: ὀφθαλμὸς πονηρός
  choice: masamang mata
  rationale: Pinananatili ang konkretong idyoma at talinghaga ng orihinal; ipinaliliwanag sa talababa ang kahulugang inggit o mapagmalisyang pananaw.
- source_word: βλασφημία
  choice: paninirang-puri
  rationale: Ang termino ay maaaring tumukoy sa mapanirang o mapang-abusong pananalita laban sa kapwa; pinananatili sa talababa ang posibleng diwang paglapastangan sa Diyos.
- source_word: ὑπερηφανία
  choice: pagmamataas
  rationale: Natural na Filipino para sa mapagmataas na pagturing sa sarili at arroganteng pagpapakataas.
- source_word: ἀφροσύνη
  choice: kahangalan
  rationale: Tumutukoy sa kakulangan ng wastong moral at praktikal na paghatol, hindi lamang sa kakulangan ng talino.
theological_decisions:
- issue: Saklaw ng βλασφημία sa talaan ng mga bisyo
  choice: paninirang-puri
  alternative: paglapastangan sa Diyos
  rationale: Sa konteksto, maaaring unawain ito bilang mapanirang pananalita laban sa tao, ngunit maaari ring tumukoy sa mapanglapastangang pananalita laban sa Diyos. Hindi inaalis ang ikalawang posibilidad at inilalagay ito sa talababa.
- issue: Pag-unawa sa ὀφθαλμὸς πονηρός
  choice: masamang mata
  alternative: inggit o mapagkimkim na pananaw
  rationale: Pinananatili sa pangunahing teksto ang tunay na talinghaga ng orihinal sa halip na tuluyang ipalit ang isang interpretasyon; nililinaw ng talababa ang idyomatikong diwa.
translation_notes:
  register: 'Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang mga pangngalang karaniwan sa isang talaan ng mga bisyo. Inilagay ang mga pananda ng talababa sa mismong mga salitang tinatalakay: “masamang mata[a]” at “paninirang-puri[b].”'
