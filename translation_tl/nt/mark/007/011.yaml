id: MRK.7.11
reference: Mark 7:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ λέγετε· Ἐὰν εἴπῃ ἄνθρωπος τῷ πατρὶ ἢ τῇ μητρί· Κορβᾶν, ὅ ἐστιν Δῶρον, ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/011.yaml
  text: But you say[a], ‘If a man says to his father or his mother, “Corban” (that is, a gift)[b], whatever you might have benefited from me—’
translation:
  language: tl
  text: Ngunit sinasabi ninyo, ‘Kung sabihin ng isang tao sa kanyang ama o ina, “Corban”[a] (ibig sabihin, handog[b]) ang anumang pakinabang na maaari mong matanggap mula sa akin—’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Corban ay tawag sa isang bagay na itinalaga bilang handog sa Diyos kaya hindi na ginagamit para sa karaniwang pangangailangan ng pamilya.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin na “kaloob.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δὲ λέγετε
  choice: Ngunit sinasabi ninyo
  rationale: Ipinahahayag ng δὲ ang pagsalungat sa naunang utos ng Diyos, at natural na inilalarawan ng kasalukuyang λέγετε ang palagiang sinasabi nila.
- source_word: Ἐὰν εἴπῃ ἄνθρωπος
  choice: Kapag sinabi ng isang tao
  rationale: Ang ἐὰν na may aorist subjunctive ay naglalahad ng isang posibleng pangyayari. Ang “kapag sinabi” ay natural sa Filipino at hindi nagpapahiwatig na tiyak na mangyayari ito.
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: sa kanyang ama o ina
  rationale: Malinaw na pinananatili ang dalawang maaaring kausap na magulang nang hindi inuulit ang panghalip sa paraang mabigat sa Filipino.
- source_word: Κορβᾶν
  choice: Corban
  rationale: Pinananatili ang salitang Semitiko gaya ng ginawa mismo ng tekstong Griyego; ipinaliliwanag ito sa kasunod na panaklong at talababa.
- source_word: ὅ ἐστιν Δῶρον
  choice: ibig sabihin, handog
  rationale: Sa kontekstong ito, mas malinaw sa karaniwang mambabasa ang “handog” kaysa “kaloob,” sapagkat tumutukoy ito sa isang bagay na iniuukol sa Diyos.
- source_word: ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς
  choice: ang anumang tulong na matatanggap sana ninyo mula sa akin
  rationale: Ang ὃ ἐὰν ay may di-tiyak na kahulugang “anuman,” at ang ὠφεληθῇς ay tumutukoy sa pakinabang o tulong na matatanggap ng magulang. Ang “sana” ay nagpapakita na iyon ang tulong na maaari sanang matanggap ngunit ipinagkait. Ang “ninyo” ay magalang na pang-isahang pagtukoy sa magulang.
theological_decisions:
- issue: Paglalarawan sa Corban bilang handog na iniuukol sa Diyos
  choice: Panatilihin ang “Corban” sa pangunahing teksto at sundan ng paliwanag na “ibig sabihin, handog.”
  alternative: Isalin agad bilang “handog sa Diyos” o “kaloob.”
  rationale: Ang tekstong Griyego mismo ay nagpapanatili sa terminong Semitiko at saka ito ipinaliliwanag. Pinananatili nito ang makasaysayan at panrelihiyong katangian ng halimbawa nang hindi nagdaragdag ng detalye tungkol sa bisa o mekanismo ng panata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang putol na sintaks sa dulo sa pamamagitan ng gitling sapagkat ipinagpapatuloy at kinukumpleto ng talata 12 ang pangungusap.
