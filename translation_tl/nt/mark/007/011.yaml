revisions:
- from: Ngunit sinasabi ninyo, ‘Kapag sinabi ng isang tao sa kanyang ama o ina, “Corban”[a] (ibig sabihin, handog[b]) ang anumang tulong na matatanggap sana ninyo mula sa akin—’
  to: Ngunit sinasabi ninyo, ‘Kung sabihin ng isang tao sa kanyang ama o ina, “Corban”[a] (ibig sabihin, handog[b]) ang anumang pakinabang na maaari mong matanggap mula sa akin—’
  rationale: Pinalitan ang maramihang “ninyo” ng isahang “mong” upang tumugma sa ὠφεληθῇς at sa ama o ina bilang kinakausap. Pinalitan din ang “Kapag” ng “Kung” upang mas malinaw na maipahayag ang kondisyunal na halimbawa. Pinanatili ang Corban, ang paliwanag ni Marcos na “handog,” ang mga talababa, at ang sintaktikong putol na ginagampanan ng gitling.
