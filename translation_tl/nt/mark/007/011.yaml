    issue: Ginamit ang maramihang “ninyo” para sa isahang magulang na kinakausap.
    rationale: Ang Griyegong ὠφεληθῇς ay pangalawang panauhang isahan. Bagaman maaaring magamit ang “ninyo” bilang magalang na pagtukoy sa isang tao sa ilang rehistro, dito lumilikha ito ng hindi kinakailangang paglihis mula sa malinaw na isahang anyo ng pinagmulan.
  - severity: low
    issue: Ang “Kapag” ay hindi gaanong tuwirang naghahatid ng kondisyunal/prospektibong ἐὰν kaysa “Kung.”
    rationale: Hindi mali ang “kapag,” ngunit ang “Kung sabihin” ay mas tumpak na pinananatili ang hipotetikal na pormula ng halimbawa.
