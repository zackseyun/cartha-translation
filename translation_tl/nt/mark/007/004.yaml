source:
  edition: SBLGNT
  text: καὶ ἀπ’ ⸀ἀγορᾶς ἐὰν μὴ ⸀βαπτίσωνται οὐκ ἐσθίουσιν, καὶ ἄλλα πολλά ἐστιν ἃ παρέλαβον κρατεῖν, βαπτισμοὺς ποτηρίων καὶ ξεστῶν καὶ χαλκίων ⸂καὶ κλινῶν⸃—
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/004.yaml
  text: 'And when they come from the marketplace[a], they do not eat unless they wash themselves[b], and there are many other things that they have received to keep: washings of cups and pitchers and copper vessels and dining couches—'
translation:
  language: tl
  text: 'At kapag galing sila sa pamilihan, hindi sila kumakain nang hindi muna naghuhugas. Marami pa silang ibang bagay na tinanggap upang sundin: mga paghuhugas ng mga tasa, mga pitsel, mga sisidlang tanso, at mga higaan sa kainan[a]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi kasama sa ilang manuskrito ang “at mga higaan sa kainan.”
    reason: textual_variant
lexical_decisions:
- source_word: ἀγορᾶς
  choice: pamilihan
  rationale: Tumutukoy ang ἀγορά sa pampublikong lugar ng bilihan; likas at malinaw sa makabagong Filipino ang “pamilihan.”
- source_word: βαπτίσωνται
  choice: naghuhugas
  rationale: Sa konteksto ng mga kaugaliang pangkalinisan, tumutukoy ito sa ritwal na paghuhugas ng sarili bago kumain. Iniiwasan ng salin ang di-angkop na pahiwatig ng bautismo, habang inilalahad sa talababa ang posibleng diwang paglulubog.
- source_word: παρέλαβον κρατεῖν
  choice: tinanggap upang sundin
  rationale: Pinananatili nito ang pokus ng Griyego sa mga gawaing tinanggap nila at patuloy na sinusunod, sa halip na ilipat ang pokus sa pagpapasa ng tradisyon.
- source_word: βαπτισμοὺς
  choice: paghuhugas
  rationale: Dito ay tumutukoy sa mga ritwal na paghuhugas ng sari-saring sisidlan at kagamitan, hindi sa bautismong Cristiano.
- source_word: ποτηρίων
  choice: mga kopa
  rationale: Ang “kopa” ay malinaw na sisidlang inuman at hindi nagpapahiwatig na yari sa salamin gaya ng maaaring ipahiwatig ng “baso.”
- source_word: ξεστῶν
  choice: mga pitsel
  rationale: Ang ξέστης ay isang sisidlan gaya ng banga o pitsel; ang “pitsel” ay kongkreto at madaling maunawaan nang hindi labis na nililimitahan ang anyo nito.
- source_word: χαλκίων
  choice: mga sisidlang tanso
  rationale: Tumutukoy ang χαλκίον sa kagamitang yari sa tanso o haluang metal; malinaw at malapit sa salitang Griyego ang “sisidlang tanso.”
- source_word: κλινῶν
  choice: mga higaan sa kainan
  rationale: Maaaring mangahulugan ang κλίνη ng higaan o sopa; sa konteksto ng pagkain, tumutukoy ito sa mga hinihigaan o hinihiligan habang kumakain noong unang panahon.
- source_word: ἄλλα πολλά
  choice: marami pa silang ibang bagay
  rationale: Pinananatili nito ang malawak at di-tiyak na pananalita ng Griyego, sa halip na tahasang gawing “mga tradisyon” o “mga kaugalian.”
theological_decisions:
- issue: Kahulugan ng βαπτίσωνται at βαπτισμοὺς sa konteksto ng ritwal na kalinisan
  choice: Isinalin bilang “naghuhugas” at “paghuhugas.”
  alternative: “lum浸/lumulubog” o mga anyong may salitang “bautismo”
  rationale: Mga kaugaliang Judio tungkol sa ritwal na kalinisan ang paksa, hindi ang bautismong Cristiano. Ang “paghuhugas” ay natural sa Filipino at hindi nag-aangkat ng sakramental na kahulugang wala sa konteksto.
- issue: Tekstuwal na pagkakaiba tungkol sa καὶ κλινῶν
  choice: Isinama ang “at mga higaan sa kainan” sa pangunahing teksto.
  alternative: Alisin ang parirala ayon sa ilang manuskrito.
  rationale: Kasama ang mga salita sa ibinigay na SBLGNT text, ngunit minarkahan ang tunay na pagkakaiba ng mga manuskrito sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “hindi ... nang hindi muna” upang natural na maipahayag ang ἐὰν μή, at pinanatili ang pangkalahatang “ibang bagay” upang huwag gawing mas tiyak kaysa sa Griyego. Ang “mga higaan sa kainan” ay nagpapaliwanag sa gamit ng κλίνη sa sinaunang kaugaliang paghilig habang kumakain.
