  text: ἡ δὲ ἀπεκρίθη καὶ λέγει αὐτῷ· ⸀Κύριε, ⸀καὶ τὰ κυνάρια ὑποκάτω τῆς τραπέζης ⸀ἐσθίουσιν ἀπὸ τῶν ψιχίων τῶν παιδίων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/028.yaml
  text: But she answered and said to him[a], “Lord[b], even the little dogs under the table eat from the children's crumbs.”
translation:
  language: tl
  text: Ngunit sumagot siya at sinabi sa kanya, “Panginoon[a], kahit ang maliliit na aso[b] sa ilalim ng mesa ay kumakain mula sa mga mumo ng mga bata.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ginoo.” Ang salitang Griyego ay maaaring gamiting magalang na pantawag at maaari ring mangahulugang “Panginoon.”
    reason: alternative_reading
  - marker: b
    text: Ang salitang Griyego ay tumutukoy sa maliliit o alagang aso; pinananatili ng “maliliit na aso” ang diminutibong diwa nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη καὶ λέγει αὐτῷ
  choice: sumagot siya sa kanya
  rationale: Natural na salaysay sa Filipino para sa tugon ng babae; hindi kailangang ulitin ang magkalapit na pandiwang “sumagot” at “sinabi” dahil magiging mabigat iyon sa modernong Tagalog.
- source_word: Κύριε
  choice: Panginoon
  rationale: Pinananatili ang karaniwang titulong pantawag kay Jesus, habang kinikilala sa talababa na maaari rin itong maging magalang na pagtawag.
- source_word: καὶ
  choice: kahit
  rationale: 'Ipinahahayag dito ang diin ng babae: kabilang din, o maging, ang maliliit na aso sa mga nakatatanggap ng mumo.'
- source_word: κυνάρια
  choice: maliliit na aso
  rationale: Pinananatili ang diminutibong diwa ng salitang Griyego, na maaaring tumukoy sa maliliit o alagang aso, nang hindi ito ginagawang mas kolokyal na “mga tuta.”
- source_word: ὑποκάτω τῆς τραπέζης
  choice: sa ilalim ng mesa
  rationale: Tuwiran, natural, at tumpak na katumbas sa Filipino.
- source_word: ἐσθίουσιν
  choice: kumakain
  rationale: Ang pangkasalukuyang anyo ay naglalarawan ng karaniwang nangyayari sa larawang ginagamit ng babae.
- source_word: ἀπὸ τῶν ψιχίων τῶν παιδίων
  choice: ng mga mumo ng mga bata
  rationale: Natural na Filipino para sa pagkain mula sa mumong nauugnay sa mga bata; iniiwasang idagdag sa pangunahing teksto ang salitang “pagkain,” na hindi tahasang nasa Griyego.
theological_decisions:
- issue: Kahulugan ng κύριε sa pagtawag ng babae kay Jesus
  choice: Panginoon
  alternative: Ginoo
  rationale: Ang “Panginoon” ang karaniwang salin ng κύριος at nagpapanatili ng posibleng titulong kristolohikal, ngunit hindi itinatago ng talababa na maaari rin itong maging karaniwang magalang na pagtawag sa kontekstong ito.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal ang himig. Inilagay ang mga talababa sa mismong salitang tinutukoy ng bawat isa at pinanatili ang posibleng dalawang diwa ng κύριε.
