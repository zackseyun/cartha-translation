  source_fidelity: Ang “sa kalooban” ay maaaring mangahulugang kalooban bilang pagnanais o pagpapasya, samantalang ang ἔσωθεν ay tuwirang tumutukoy sa pinagmumulang nasa loob. Ang “lumalabas mula sa loob” ay mas malapit sa ἔσωθεν ἐκπορεύεται at pinananatili ang larawan ng paglabas mula sa panloob na pinagmulan.
  naturalness: Natural at malinaw sa modernong Filipino Tagalog ang “Ang lahat ng masasamang bagay na ito ay lumalabas mula sa loob at nagpaparumi sa tao.” Mas tuwiran ito kaysa “nagmumula sa kalooban” at angkop sa marangal na rehistro ng talata.
  terminology: Ang “masasamang bagay,” “mula sa loob,” at “nagpaparumi” ay maayos na katumbas ng πάντα ταῦτα τὰ πονηρά, ἔσωθεν, at κοινοῖ sa konteksto ng karumihan. Ang “tao” ay wastong pangkalahatang katumbas ng τὸν ἄνθρωπον; hindi kailangan ang footnote tungkol sa kasariang gramatikal ng Ingles.
