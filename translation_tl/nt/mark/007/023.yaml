  text: πάντα ταῦτα τὰ πονηρὰ ἔσωθεν ἐκπορεύεται καὶ κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/023.yaml
  text: All these evil things come out from within and defile the man[a].
translation:
  language: tl
  text: Ang lahat ng masasamang bagay na ito ay lumalabas mula sa loob at nagpaparumi sa tao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντα ταῦτα τὰ πονηρά
  choice: Ang lahat ng masasamang bagay na ito
  rationale: Pinananatili nito ang mariing at malawak na saklaw ng parirala at malinaw na tumutukoy sa mga kasamaang inilista sa naunang konteksto.
- source_word: ἔσωθεν
  choice: sa kalooban
  rationale: Ipinahihiwatig nito ang pinagmumulang nasa loob ng tao at pinananatili ang kaibahan sa panlabas na karumihan sa konteksto.
- source_word: ἐκπορεύεται
  choice: nagmumula
  rationale: Likas ito sa modernong Tagalog para sa paglabas mula sa isang panloob na pinagmulan; ang isahang anyo ng pandiwang Griyego ay karaniwang ginagamit sa neuter plural na simuno.
- source_word: κοινοῖ
  choice: nagpaparumi
  rationale: Sa konteksto ng kalinisan sa Marcos, tumutukoy ito sa pagdudulot ng karumihan, hindi lamang sa paggawa ng isang bagay na karaniwan.
- source_word: τὸν ἄνθρωπον
  choice: sa tao
  rationale: Ang “tao” ay natural na pangkalahatang katawagan sa Tagalog at napapanatili ang isahang, kinatawang diwa ng Griyego nang hindi nililimitahan sa kasariang lalaki.
theological_decisions:
- issue: Pangkalahatang diwa ng τὸν ἄνθρωπον sa pahayag tungkol sa karumihan
  choice: sa tao
  alternative: sa isang tao
  rationale: Ang Griyego ay isahan ngunit ginagamit nang pangkalahatan. Sa Tagalog, ang “tao” ay likas na sumasaklaw sa sinumang tao at hindi kinakailangang tukuyin bilang lalaki.
- issue: Ugnayan ng panloob na kasamaan at karumihan
  choice: nagmumula sa kalooban at nagpaparumi
  alternative: lumalabas mula sa loob at ginagawang marumi
  rationale: Pinananatili ang dalawang magkakaugnay na kilos sa Griyego—panloob na pinagmulan at pagdudulot ng karumihan—nang hindi nilulutas ang ritwal at moral na saklaw ng κοινοῖ sa iisang paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pagbasa ng karaniwang mambabasa. Ginamit ang “kalooban” bilang natural na panloob na pinagmulan sa kontekstong moral, at “nagpaparumi” upang panatilihin ang bokabularyo ng kalinisan sa talata.
