    text: 'O: “magiging marumi ayon sa ritwal.” Sa kontekstong ito, ang salitang Griyego ay may diwa ng pagiging marumi ayon sa mga tuntunin ng ritwal na kalinisan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: sinabi
  rationale: Ang pangkasaysayang pangkasalukuyan sa salaysay na Griyego ay likas na isinasalin sa nagdaang panahunan sa modernong Tagalog.
- source_word: Οὕτως καὶ ὑμεῖς
  choice: Kayo rin ba
  rationale: Likas nitong ipinahahayag ang mariing pagsaway at pagtataka ni Jesus; ang diwa ng οὕτως ay naipahihiwatig ng kaugnayan sa naunang sinabi.
- source_word: ἀσύνετοί
  choice: wala pa ring pang-unawa
  rationale: Ipinahahayag nito ang kakulangan sa pagkaunawa nang hindi gumagamit ng labis na mapanlait na salita; ang “pa rin” ay nagpapakita na maging ang mga alagad ay hindi pa nakauunawa.
- source_word: νοεῖτε
  choice: nauunawaan
  rationale: Malinaw at likas sa Tagalog, at pinananatili ang ugnayang leksikal nito sa “pang-unawa.”
- source_word: πᾶν τὸ ἔξωθεν εἰσπορευόμενον
  choice: ang anumang pumapasok ... mula sa labas
  rationale: Ang “anumang” ay angkop sa pangkalahatang diwa ng πᾶν at ng substantibong participle, habang malinaw na tinutumbasan ng “mula sa labas” ang ἔξωθεν.
- source_word: εἰς τὸν ἄνθρωπον
  choice: sa tao
  rationale: Ang ἄνθρωπος dito ay pangkalahatang tumutukoy sa isang tao; natural at hindi kinakailangang tukuyin ang kasarian sa Tagalog.
- source_word: κοινῶσαι
  choice: makapagpaparumi
  rationale: Ang pandiwa ay tumutukoy sa pagpapaging marumi, lalo na sa usapin ng ritwal na kalinisan; pinananatili ng anyong may “makapag-” ang diwa ng οὐ δύναται.
theological_decisions:
- issue: Kahulugan ng κοινόω sa usapin ng kalinisan
  choice: makapagpaparumi
  alternative: makapagpapaging marumi ayon sa ritwal
  rationale: Pinananatiling maikli at natural ang pangunahing teksto, samantalang nililinaw sa talababa na ang konteksto ay may kinalaman sa ritwal na kalinisan at hindi lamang sa moral na kasamaan.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Pinanatili ang anyong tanong ng pagsaway at ang kuwit sa hulihan sapagkat nagpapatuloy ang pangungusap sa kasunod na talata.
