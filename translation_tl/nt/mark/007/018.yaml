  text: And he said to them[b][a], “So are you also without understanding? Do you not understand that everything that enters into the man from outside is not able to defile him,”
translation:
  language: tl
  text: At sinabi niya sa kanila, “Ganito rin ba kayo na walang pang-unawa? Hindi ba ninyo nauunawaan na ang anumang pumapasok sa tao mula sa labas ay hindi makapagpaparumi sa kanya[a],”
  philosophy: optimal-equivalence
  footnotes:
