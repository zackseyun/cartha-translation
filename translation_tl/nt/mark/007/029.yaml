  text: καὶ εἶπεν αὐτῇ· Διὰ τοῦτον τὸν λόγον ὕπαγε, ἐξελήλυθεν ⸂ἐκ τῆς θυγατρός σου τὸ δαιμόνιον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/029.yaml
  text: And he said to her[a], “Because of this word, go; the demon has gone out of your daughter.”
translation:
  language: tl
  text: At sinabi niya sa babae, “Dahil sa sinabi mong ito, umalis ka na; lumabas na sa anak mong babae ang demonyo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ εἶπεν αὐτῇ
  choice: At sinabi niya sa babae
  rationale: Pinananatili ng “At” ang payak na pag-uugnay ng καί. Nililinaw ng “sa babae” ang pambabaeng panghalip sa natural na Tagalog nang hindi nagdaragdag ng interpretasyon.
- source_word: Διὰ τοῦτον τὸν λόγον
  choice: Dahil sa sinabi mong ito
  rationale: Ang διά na may accusative ay nagpapahayag ng dahilan, at ang λόγος dito ay tumutukoy sa naunang sagot ng babae. Mas natural sa modernong Tagalog ang “sinabi mong ito” kaysa sa literal na “salitang ito,” habang pinananatili ang sanhi at tiyak na pagtukoy sa kanyang sinabi.
- source_word: ὕπαγε
  choice: umuwi ka na
  rationale: Sa konteksto, ang pautos ay pagpapaalis sa babae upang bumalik sa kanyang bahay, kung saan makikita niyang magaling na ang anak. Ang “umuwi ka na” ay likas na Tagalog para sa kontekstuwal na diwa, bagaman ang payak na leksikal na kahulugan ay “humayo ka.”
- source_word: ἐξελήλυθεν
  choice: lumabas na
  rationale: Ipinahihiwatig ng perfect tense ang naganap nang paglabas na may nananatiling resulta. Ang “lumabas na” ay nagpapanatili sa larawang pandiwa at ipinakikitang wala na ang demonyo.
- source_word: ἐκ τῆς θυγατρός σου
  choice: sa anak mong babae
  rationale: Sa Tagalog, likas ang “lumabas sa” upang ipahayag ang pinagmulan ng paglabas. Isinalin ang θυγάτηρ bilang “anak mong babae” upang malinaw na mapanatili ang kasarian.
- source_word: τὸ δαιμόνιον
  choice: ang demonyo
  rationale: Tuwirang katumbas ito ng δαιμόνιον at hindi pinapalabo ang tahasang sobrenatural na pahayag ng teksto.
theological_decisions:
- issue: Pagpapanatili sa tahasang wika ng pagpapalayas ng demonyo
  choice: lumabas na sa anak mong babae ang demonyo
  alternative: iniwan na ng masamang espiritu ang anak mong babae
  rationale: Tahasang ginagamit ng Griyego ang δαιμόνιον at ang larawang ‘lumabas.’ Pinananatili ng salin ang personal na demonyong tinutukoy at hindi ito ginagawang sakit lamang o di-tiyak na masamang impluwensiya.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignified, at madaling maunawaan. Ginamit ang “sinabi mong ito” para sa likas na daloy at “umuwi ka na” bilang kontekstuwal na pagpapaalis. Walang talababa sapagkat walang alternatibong kailangang ilakip para mapanatili ang mahalagang ambiguity o textual issue.
