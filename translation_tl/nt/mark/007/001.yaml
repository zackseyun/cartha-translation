  source_fidelity: 'Ang pangunahing diwa ay wasto: ang mga Pariseo at ilang γραμματεῖς ay nagtipon kay Jesus, at ang mga ito ay nagmula sa Jerusalem. Gayunman, ang walang-kuwit na ''ilan sa mga tagapagturo ng Kautusan na nagmula sa Jerusalem'' ay sa likas na pagbasa ng Tagalog ay naglilimita sa pariralang ''na nagmula sa Jerusalem'' sa mga tagapagturo lamang. Ang maramihang participle na ἐλθόντες ay tumutukoy sa pinagsamang paksa—mga Pariseo at ilang eskriba. Ang ''mga eskriba'' ay mas tuwirang katumbas ng γραμματέων kaysa ''mga tagapagturo ng Kautusan.'''
  naturalness: Likas at marangal ang 'nagtipon sa paligid niya' sa modernong Filipino Tagalog. Ang paglalagay ng kuwit bago ang sugnay na 'na nagmula sa Jerusalem' ay nagpapalinaw na ang paglalarawan ay para sa buong pangkat, hindi lamang sa huling pangngalan.
  terminology: Ang 'mga Pariseo' ay angkop at nakasanayan. Mas tapat at kinikilalang katawagan sa mga Ebanghelyo ang 'mga eskriba' para sa γραμματεῖς; ang 'mga tagapagturo ng Kautusan' ay isang pagpapaliwanag ng maaaring tungkulin nila, hindi ang tuwirang katawagan ng teksto. Ang 'Kautusan' ay samakatuwid ay hindi na kailangang idagdag sa pangunahing teksto.
  issues:
