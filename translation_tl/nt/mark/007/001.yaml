  yaml_path: translation/nt/mark/007/001.yaml
  text: And the Pharisees and some of the scribes[a], who had come from Jerusalem, gather around him.
translation:
  language: tl
  text: At nagtipon sa paligid niya[a] ang mga Pariseo at ilan sa mga eskriba, na nagmula sa Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas literal: “nagtipon sa kaniya.”'
    reason: Pinananatili ang mas literal na posibilidad ng πρὸς αὐτόν habang ginagamit sa pangunahing teksto ang mas likas na pariralang Tagalog.
lexical_decisions:
- source_word: Καὶ
  choice: At
  rationale: Pinananatili ang karaniwang pang-ugnay ni Marcos sa pagpapatuloy ng salaysay.
- source_word: συνάγονται πρὸς αὐτὸν
  choice: nagtipon sa paligid niya
  rationale: Likas sa modernong Tagalog at malinaw na ipinahahayag ang pagtitipon na nakatuon kay Jesus. Ginamit ang aspektong naganap para sa natural na salaysay sa Tagalog, bagaman nasa makasaysayang pangkasalukuyan ang Griyego.
- source_word: οἱ Φαρισαῖοι
  choice: ang mga Pariseo
  rationale: Karaniwan at nakikilalang anyong Tagalog ng pangalan ng pangkat na Judio.
- source_word: τινες τῶν γραμματέων
  choice: ilan sa mga tagapagturo ng Kautusan
  rationale: Ang “ilan sa” ay nagpapanatili sa partitive genitive, samantalang ang “mga tagapagturo ng Kautusan” ay malinaw sa karaniwang mambabasa at inilalarawan ang kinikilalang tungkulin ng γραμματεῖς sa kontekstong ito.
- source_word: ἐλθόντες ἀπὸ Ἱεροσολύμων
  choice: na nagmula sa Jerusalem
  rationale: Natural na ipinahahayag ang naunang pagdating mula sa Jerusalem nang hindi dinaragdagan ang layunin ng kanilang pagpunta.
