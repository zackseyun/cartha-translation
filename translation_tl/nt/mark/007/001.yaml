    issue: Malabong saklaw ng 'na nagmula sa Jerusalem'
    rationale: Sa kasalukuyang ayos, ang sugnay ay karaniwang mauunawaang tumutukoy lamang sa 'ilan sa mga tagapagturo ng Kautusan.' Sa Griyego, ang ἐλθόντες ay maramihang participle na nauugnay sa mga Pariseo at ilang eskriba bilang pinagsamang paksa.
  - severity: low
    issue: Interpretibong katawagan para sa γραμματέων
    rationale: Ang 'mga tagapagturo ng Kautusan' ay maaaring makatulong sa paliwanag ngunit hindi ito ang tuwirang leksikal na katumbas ng γραμματεῖς. Ang 'mga eskriba' ay nagpapanatili ng terminolohiyang pang-Ebanghelyo nang walang dagdag na pagpapakahulugan.
  revised_text: At nagtipon sa paligid niya[a] ang mga Pariseo at ilan sa mga eskriba, na nagmula sa Jerusalem.
