  text: Καὶ πάλιν ἐξελθὼν ἐκ τῶν ὁρίων Τύρου ⸂ἦλθεν διὰ Σιδῶνος εἰς⸃ τὴν θάλασσαν τῆς Γαλιλαίας ἀνὰ μέσον τῶν ὁρίων Δεκαπόλεως.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/031.yaml
  text: And again[a], after departing from the region of Tyre, he came through Sidon to the Sea of Galilee[b], through the midst of the region of the Decapolis.
translation:
  language: tl
  text: Muli, matapos umalis si Jesus sa mga nasasakupan ng Tiro, nagpunta siya sa Lawa ng Galilea sa pamamagitan ng Sidon, sa gitna ng mga nasasakupan ng Decapolis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa pagitan ng mga nasasakupan ng Decapolis.” Ang pariralang Griyego ay maaaring mangahulugang “sa gitna” o “sa pagitan,” at mahirap matiyak ang eksaktong rutang inilalarawan.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: Muling
  rationale: Likas at maikli itong panandang nagsasaad ng panibagong pagkilos sa salaysay.
- source_word: ἐξελθὼν ἐκ τῶν ὁρίων Τύρου
  choice: umalis ... sa nasasakupan ng Tiro
  rationale: Ipinahahayag ng aorist participle ang kilos na nauna sa pangunahing pandiwa; ang “nasasakupan” ay tumutukoy sa teritoryo, hindi lamang sa mismong hangganan.
- source_word: ἦλθεν διὰ Σιδῶνος εἰς
  choice: dumaan sa Sidon patungo sa
  rationale: Natural sa Tagalog ang ganitong paglalarawan ng ruta at pinananatili nito ang diwa ng paglalakbay sa pamamagitan o daan ng Sidon tungo sa destinasyon.
- source_word: τὴν θάλασσαν τῆς Γαλιλαίας
  choice: Lawa ng Galilea
  rationale: Bagaman literal na “dagat” ang θάλασσα, lawa ang anyong-tubig na tinutukoy at “Lawa ng Galilea” ang malinaw at likas na makabagong katawagan sa Filipino.
- source_word: ἀνὰ μέσον τῶν ὁρίων Δεκαπόλεως
  choice: sa gitna ng nasasakupan ng Decapolis
  rationale: Pinananatili nito ang di-karaniwang puwersang panlunan ng ἀνὰ μέσον at ang pagtukoy ng ὅρια sa teritoryo; hindi nito pinapawi ang heograpikal na hirap ng ruta.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “si Jesus” upang maging natural at malinaw ang paksa sa isang talatang binabasa nang hiwalay. Pinanatili ang pangalang “Decapolis” bilang kinikilalang pangalang pantangi ng rehiyon.
