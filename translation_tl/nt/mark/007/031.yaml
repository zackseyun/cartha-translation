revisions:
- from: Muling umalis si Jesus sa nasasakupan ng Tiro at dumaan sa Sidon patungo sa Lawa ng Galilea, sa gitna ng nasasakupan ng Decapolis.[a]
  to: Muli, matapos umalis si Jesus sa mga nasasakupan ng Tiro, nagpunta siya sa Lawa ng Galilea sa pamamagitan ng Sidon, sa gitna ng mga nasasakupan ng Decapolis.[a]
