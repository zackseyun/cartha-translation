id: MRK.8.1
reference: Mark 8:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἐν ἐκείναις ταῖς ἡμέραις ⸂πάλιν πολλοῦ⸃ ὄχλου ὄντος καὶ μὴ ἐχόντων τί φάγωσιν, ⸀προσκαλεσάμενος τοὺς ⸀μαθητὰς λέγει αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/001.yaml
  text: In those days[a], when again a large crowd was present and they had nothing to eat, he called his disciples and says to them[b],
translation:
  language: tl
  text: Noong mga araw na iyon, naroon na naman ang napakaraming tao[a], at wala silang makain. Tinawag niya ang kanyang mga alagad at sinabi sa kanila[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Griyego, maaari ring ayusin: “muli, habang naroon ang napakaraming tao.”'
    reason: Ipinakikita ang pangyayaring nasa likuran ng salaysay na ipinapahayag ng genitive absolute at ang posibleng pagkakaugnay ng “muli” sa parirala.
  - marker: b
    text: Sa Griyego, “sinasabi sa kanila.” Madalas gamitin ni Marcos ang pangkasalukuyang anyo ng pandiwa sa pagsasalaysay ng nakaraang pangyayari.
    reason: Pinananatili ang kaalaman tungkol sa makasaysayang pangkasalukuyan ng Griyego, na hindi likas na tumbasan nang tuwiran sa Tagalog.
lexical_decisions:
- source_word: Ἐν ἐκείναις ταῖς ἡμέραις
  choice: Noong mga araw na iyon
  rationale: Likas at malinaw na panandang temporal sa makabagong Tagalog, nang hindi nililimitahan ang eksaktong tagal.
- source_word: πάλιν
  choice: na naman
  rationale: Ipinahihiwatig ang pag-ulit ng kahalintulad na pangyayari at natural itong kaugnay ng "naroon" sa Tagalog.
- source_word: πολλοῦ ὄχλου ὄντος
  choice: naroon ... ang napakaraming tao
  rationale: 'Isinasalin nang malinaw ang pangyayaring nasa likuran ng salaysay: isang napakalaking pulutong ang naroroon. Iniwasan ang pagdagdag na "nagtipon," na hindi tahasang sinasabi ng Griyego.'
- source_word: καὶ μὴ ἐχόντων τί φάγωσιν
  choice: at wala silang makain
  rationale: Natural na Tagalog para sa kawalan ng anumang pagkaing maaari nilang kainin; malinaw na ang tinutukoy na "sila" ay ang maraming tao.
- source_word: προσκαλεσάμενος
  choice: Tinawag niya
  rationale: Tumpak at payak na katumbas ng pagtawag o pagpapalapit sa mga alagad; hindi idinagdag ang "sa kanyang sarili," na magiging di-likas sa Tagalog.
- source_word: τοὺς μαθητάς
  choice: ang kanyang mga alagad
  rationale: Bagaman walang tahasang panghalip na paari sa Griyego, likas ito sa Tagalog at malinaw sa konteksto na mga alagad ni Jesus ang tinutukoy.
- source_word: λέγει αὐτοῖς
  choice: sinabi sa kanila
  rationale: Ginamit ang karaniwang aspektong pangkuwento sa Tagalog. Ang literal na pangkasalukuyang anyo na "sinasabi sa kanila" ay madaling magpahiwatig ng nagpapatuloy o paulit-ulit na pagsasalita, kaya inilagay sa talababa ang estilistikong anyo ng Griyego.
theological_decisions:
- issue: Ang makasaysayang pangkasalukuyan sa salaysay ni Marcos
  choice: Isinalin bilang "sinabi sa kanila" sa pangunahing teksto at ipinaliwanag sa talababa ang literal na "sinasabi sa kanila."
  alternative: Panatilihin sa pangunahing teksto ang "sinasabi sa kanila."
  rationale: Madalas gamitin ni Marcos ang pangkasalukuyang pandiwa upang gawing mas buhay ang salaysay. Gayunman, sa Tagalog, ang "sinasabi" ay karaniwang nauunawaan bilang nagpapatuloy o nakagawiang kilos, hindi bilang simpleng makasaysayang pangkasalukuyan. Pinananatili ng talababa ang mahalagang katangian ng Griyego nang hindi lumilikha ng maling pahiwatig sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang "napakaraming tao" sa halip na mas pormal na "malaking pulutong," at iniwasan ang mga idinagdag na detalyeng gaya ng "nagtipon."
