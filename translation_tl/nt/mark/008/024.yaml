  text: καὶ ἀναβλέψας ἔλεγεν· Βλέπω τοὺς ἀνθρώπους ὅτι ὡς δένδρα ὁρῶ περιπατοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/024.yaml
  text: And looking up, he said, “I see people, because I see them walking around like trees.”
translation:
  language: tl
  text: At nang tumingin siya[a], sinabi niya, “Nakikita ko ang mga tao, sapagkat nakikita ko silang naglalakad na parang mga puno.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay maaari ring mangahulugang “tumingala” o “muling nakakita.”
    reason: Pinananatili ang leksikal na kalabuan ng ἀναβλέψας, lalo na sa konteksto ng pagpapagaling sa isang bulag.
lexical_decisions:
- source_word: ἀναβλέψας
  choice: nang tumingin siya
  rationale: Ipinahahayag ang kilos ng pagtingin nang hindi ipinipilit kung ito ay literal na pagtingala o muling pagkakita; nililinaw sa talababa ang saklaw ng salitang Griyego.
- source_word: Βλέπω … ὁρῶ
  choice: Nakikita ko … nakikita ko
  rationale: Pinananatili ang pag-uulit ng dalawang pandiwa ng pagkakita, na mahalaga sa paglalarawan ng unti-unting paggaling ng paningin.
- source_word: ὅτι
  choice: sapagkat
  rationale: Pinananatili ang paliwanag o dahilan na ipinahihiwatig ng pangatnig sa pinagmulang teksto, sa halip na gawing simpleng paghahambing lamang ang pangungusap.
- source_word: ὡς δένδρα … περιπατοῦντας
  choice: naglalakad na parang mga puno
  rationale: Natural sa Tagalog at pinananatiling malinaw na ang mga taong nakikita niya ang naglalakad, ngunit sa malabong paningin niya ay mukha silang mga puno.
theological_decisions:
- issue: Ang antas at paraan ng panunumbalik ng paningin ng lalaki
  choice: Hindi tahasang sinabing ganap na siyang muling nakakita sa unang yugtong ito.
  alternative: Isalin ang ἀναβλέψας bilang “nang muli siyang makakita.”
  rationale: Ipinakikita ng kasunod na sinabi niya na hindi pa malinaw ang kanyang paningin; iniiwasan ng salin na lutasin nang maaga ang tensiyong nasa salaysay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang bahagyang di-karaniwang pag-uulit ng “nakikita ko” upang masundan ang anyo at diin ng Griyego.
