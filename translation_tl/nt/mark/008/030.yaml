  text: καὶ ἐπετίμησεν αὐτοῖς ἵνα μηδενὶ λέγωσιν περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/030.yaml
  text: And he warned them to tell no one about him[a].
translation:
  language: tl
  text: At mahigpit niya silang binalaan na huwag magsabi kaninuman tungkol sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sinaway niya sila” o “mahigpit niya silang inutusan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: mahigpit na binalaan
  rationale: Ang pandiwa ay maaaring mangahulugang “sinaway,” ngunit dito ay nagpapahayag ito ng mariing pagbabawal ni Jesus sa mga alagad. Likas sa makabagong Tagalog ang “mahigpit na binalaan” at napapanatili nito ang bigat ng utos.
- source_word: αὐτοῖς
  choice: sila
  rationale: Tumutukoy ang panghalip na maramihan sa mga alagad na kausap ni Jesus sa agarang konteksto.
- source_word: ἵνα μηδενὶ λέγωσιν
  choice: na huwag magsabi kaninuman
  rationale: Pagkatapos ng pandiwang nagpapahayag ng babala o utos, likas sa Tagalog ang sugnay na “na huwag.” Ang “kaninuman” ay malinaw na nagsasaad na walang sinumang dapat sabihan.
- source_word: περὶ αὐτοῦ
  choice: tungkol sa kanya
  rationale: Tuwirang pinananatili nito ang kahulugang “about/concerning him” nang hindi dinaragdagan ang hindi tahasang sinabi sa talata.
theological_decisions:
- issue: Bigat ng utos ni Jesus at ang tinatawag na paglilihim tungkol sa Mesiyas
  choice: Ihayag bilang isang mahigpit na babalang huwag sabihin kaninuman ang tungkol sa kanya, nang hindi ipinapaliwanag kung bakit.
  alternative: Isalin nang mas literal bilang “sinaway niya sila” o mas tahasan bilang “mahigpit niya silang inutusan.”
  rationale: Malinaw sa Griyego ang mariing pagbabawal, ngunit hindi ibinibigay ng talata ang dahilan nito. Pinananatili ng salin ang tensiyong ito at hindi nag-aangkat ng isang teoryang teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mahigpit na binalaan” upang maging natural sa karaniwang mambabasa habang pinananatili ang mariing lakas ng Griyegong pandiwa.
