  to: Sapagkat ang sinumang ikahiya ako at ang aking mga salita sa salinlahing ito na mapangalunya at makasalanan[a] ay ikahihiya rin ng Anak ng Tao kapag dumating siya sa kaluwalhatian ng kanyang Ama, kasama ang mga banal na anghel.
