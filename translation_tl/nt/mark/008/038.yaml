id: MRK.8.38
reference: Mark 8:38
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὃς γὰρ ἐὰν ἐπαισχυνθῇ με καὶ τοὺς ἐμοὺς λόγους ἐν τῇ γενεᾷ ταύτῃ τῇ μοιχαλίδι καὶ ἁμαρτωλῷ, καὶ ὁ υἱὸς τοῦ ἀνθρώπου ἐπαισχυνθήσεται αὐτὸν ὅταν ἔλθῃ ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ μετὰ τῶν ἀγγέλων τῶν ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/038.yaml
  text: For whoever is ashamed of me and of my words in this adulterous and sinful generation[a], the Son of Man will also be ashamed of him when he comes in the glory of his Father with the holy angels.
translation:
  language: tl
  text: Sapagkat ang sinumang ikahiya ako at ang aking mga salita sa salinlahing ito na mapangalunya at makasalanan[a] ay ikahihiya rin ng Anak ng Tao kapag dumating siya sa kaluwalhatian ng kanyang Ama, kasama ang mga banal na anghel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi tapat at makasalanang salinlahi.” Pinanatili sa pangunahing teksto ang “mapangalunya” sapagkat ginagamit ng Griyego ang kongkretong propetikong talinghaga ng pangangalunya para sa kawalang-katapatan sa Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαισχυνθῇ / ἐπαισχυνθήσεται
  choice: ikahiya / ikahihiya rin
  rationale: Tuwirang ipinahahayag ng “ikahiya” ang hiya kaugnay ng isang tao at ng kanyang mga salita, at pinananatili ng pag-uulit ang tugunang puwersa ng Griyego.
- source_word: λόγους
  choice: mga salita
  rationale: Pinananatili nito ang pangmaramihang anyo at ang tuwirang diin sa mga sinabi ni Jesus; ang “mensahe” ay mas interpretatibo.
- source_word: γενεᾷ
  choice: salinlahi
  rationale: Karaniwang katumbas ito ng γενεά at angkop sa kasalukuyang pamayanang inilalarawan ayon sa moral na kalagayan nito.
- source_word: μοιχαλίδι
  choice: mapangalunya
  rationale: Pinananatili ang kongkretong propetikong talinghaga ng pangangalunya para sa espirituwal at moral na pagtataksil, sa halip na agad itong ipaliwanag bilang “taksil.”
- source_word: ἁμαρτωλῷ
  choice: makasalanan
  rationale: Tuwiran at natural na katumbas ng pang-uri, nang hindi dinaragdagan ang tindi gaya ng maaaring mangyari sa “masama.”
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Pinananatili ang kinikilalang titulo at ang Danieliko at eskatolohikong pahiwatig nito, sa halip na palitan ng “ako” o “Mesiyas.”
- source_word: δόξῃ
  choice: kaluwalhatian
  rationale: Karaniwang salitang biblikal na nagpapanatili sa bigat ng banal na karangalan at ningning.
- source_word: μετὰ τῶν ἀγγέλων τῶν ἁγίων
  choice: kasama ang mga banal na anghel
  rationale: Natural na Filipino at tapat sa pariralang Griyego; hindi idinagdag ang panghalip na “kanyang,” na wala sa pinagmulan.
- source_word: ὃς γὰρ ἐὰν
  choice: Sapagkat ang sinumang
  rationale: Ipinahahayag ang pangkalahatang kondisyon at pinananatili ang paliwanag na ugnayang dala ng γάρ.
- source_word: ἐν τῇ γενεᾷ ταύτῃ
  choice: sa ... salinlahing ito
  rationale: Inilalarawan ang panlipunan at moral na kapaligiran kung saan ipinakikita ang pagkahiya.
theological_decisions:
- issue: Matalinghagang puwersa ng μοιχαλίδι
  choice: Panatilihin ang “mapangalunya” sa pangunahing teksto bilang propetikong talinghaga.
  alternative: Isalin bilang “taksil” upang tuwirang ilahad ang ipinahihiwatig na espirituwal na pagtataksil.
  rationale: Ginagamit ng Griyego ang kongkretong salitang moral na umaalingawngaw sa propetikong wika tungkol sa kataksilan sa tipan. Pinananatili nito ang intertekstuwal na lalim nang hindi labis na nagpapakahulugan.
- issue: Tinutukoy ng “Anak ng Tao”
  choice: Panatilihin ang sariling-tukoy na mesiyanikong titulong “Anak ng Tao.”
  alternative: Palitan ng “ako” o “Mesiyas.”
  rationale: Ang Griyego ay gumagamit ng natatanging titulong may kristolohiko at eskatolohikong kabuluhan; ang pagpapalit dito ay mag-aalis sa sadyang teolohikong tekstura.
- issue: Panlalaking isahang αὐτόν
  choice: Ihayag sa pamamagitan ng tugunang isahang kayariang “ang sinuman ... ikahihiya.”
  alternative: Gumamit ng tahasang maramihang anyo upang maging neutral sa kasarian.
  rationale: Pinananatili ng sintaks na Filipino ang pangkalahatang isahang puwersa ng Griyego nang hindi nangangailangan ng di-natural na tahasang panghalip.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang simetrikong “ikahiya ... ikahihiya rin” upang marinig ang tugunang babala ng orihinal. Pinanatili ang mga biblikal na terminong “Anak ng Tao” at “kaluwalhatian” dahil mahalaga ang kanilang teolohiko at intertekstuwal na bigat.
