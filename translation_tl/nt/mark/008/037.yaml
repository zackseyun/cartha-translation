  text: ⸂τί γὰρ⸃ ⸀δοῖ ἄνθρωπος ἀντάλλαγμα τῆς ψυχῆς αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/037.yaml
  text: For what can a man give in exchange for his life?[a]
translation:
  language: tl
  text: Sapagkat ano ang maibibigay ng isang tao kapalit ng kanyang buhay?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kaluluwa” o “sarili”; maaaring mangahulugan ang salitang Griyego ng “buhay,” “sarili,” o “kaluluwa,” depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ
  choice: Sapagkat ano
  rationale: Ang τί ay naghaharap ng tanong na “ano,” at ang γάρ ay nag-uugnay rito bilang paliwanag sa naunang sinabi. Likas sa Tagalog ang “Sapagkat ano” sa ganitong retorikal na tanong.
- source_word: δοῖ
  choice: maibibigay
  rationale: Ang aorist active subjunctive ay bahagi ng retorikal na tanong tungkol sa kung ano ang posibleng maibigay; malinaw at natural itong ipinahahayag ng “maibibigay.”
- source_word: ἄνθρωπος
  choice: isang tao
  rationale: Bagaman nasa panlalaking anyong gramatikal ang pangngalan sa Griyego, pangkalahatan ang gamit nito rito. Ang “isang tao” ang natural at tumpak na panumbas sa modernong Tagalog.
- source_word: ἀντάλλαγμα
  choice: kapalit
  rationale: Tumutukoy ito sa bagay na ibinibigay bilang katumbas o kapalit. Ang “kapalit” ay maikli, natural, at eksakto sa pariralang ito.
- source_word: τῆς ψυχῆς αὐτοῦ
  choice: ng kanyang buhay
  rationale: Sa konteksto ng Marcos 8:35–37, ang ψυχή ay tumutukoy sa buhay na saklaw ang buong sarili. Pinakamalinaw sa pangunahing teksto ang “buhay,” habang pinananatili sa talababa ang lehitimong kahulugang “kaluluwa” at “sarili.”
theological_decisions:
- issue: Pagpapakahulugan sa ψυχή sa konteksto ng kaligtasan at pagkawala
  choice: buhay
  alternative: kaluluwa; sarili
  rationale: Iniuugnay ng konteksto ang ψυχή sa buhay na maaaring mawala, ngunit hindi ito kailangang ikulong sa pisikal na pag-iral lamang. Ang “buhay” ay natural at magkakaugnay sa konteksto, samantalang pinananatili ng talababa ang mas malawak na semantikong saklaw at teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “isang tao” bilang natural na pangkalahatang pagtukoy at ang “maibibigay … kapalit” upang mapanatili ang puwersa ng retorikal na tanong.
