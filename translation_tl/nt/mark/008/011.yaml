  text: Καὶ ἐξῆλθον οἱ Φαρισαῖοι καὶ ἤρξαντο συζητεῖν αὐτῷ, ζητοῦντες παρ’ αὐτοῦ σημεῖον ἀπὸ τοῦ οὐρανοῦ, πειράζοντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/011.yaml
  text: And the Pharisees came out and began to argue with him[a], seeking from him a sign from heaven, testing him.
translation:
  language: tl
  text: Lumabas ang mga Pariseo at nagsimulang makipagtalo sa kanya, na humihingi sa kanya ng isang tanda mula sa langit[a] upang subukin siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula sa himpapawid”; ngunit mas malamang na tumutukoy ito sa isang tandang mula sa langit, samakatuwid ay mula sa Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: Lumabas
  rationale: Tuwirang ipinapahayag ang paglabas nila tungo sa tagpo nang hindi nagdaragdag ng pinanggalingang lugar.
- source_word: ἤρξαντο συζητεῖν
  choice: nagsimulang makipagtalo
  rationale: Pinananatili ang ingresibong diwa ng ἤρξαντο at ang salungatang tono ng συζητεῖν sa kontekstong may pagsubok.
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Pinananatili ang panghalip ng Griyego at likas itong kaugnay ng pandiwang makipagtalo.
- source_word: ζητοῦντες παρ’ αὐτοῦ
  choice: Humihingi sila sa kanya
  rationale: Sa konteksto, malinaw at natural na ipinapahayag nito na hinihingi nila kay Jesus ang tanda; ginawang hiwalay na sugnay ang participle para sa maayos na modernong Tagalog.
- source_word: σημεῖον
  choice: isang tanda
  rationale: Ang 'tanda' ay nagpapanatili sa diin sa katibayan o pagpapatunay, hindi lamang sa mahimalang kapangyarihan.
- source_word: ἀπὸ τοῦ οὐρανοῦ
  choice: mula sa langit
  rationale: Tapat sa literal na anyo at pinananatili ang malamang na diwa ng makalangit o banal na pinagmulan nang hindi ito tahasang ipinapaliwanag sa teksto.
- source_word: πειράζοντες αὐτόν
  choice: upang subukin siya
  rationale: Ipinahahayag ang layunin o motibo ng kanilang paghingi. Ang 'subukin' ay nagpapanatili sa salungatang diwa nang hindi ipinahihiwatig na inaakit nila siyang magkasala.
theological_decisions:
- issue: Kahulugan ng tanda na 'mula sa langit'
  choice: Pinanatili sa pangunahing teksto ang 'mula sa langit,' na malamang na tumutukoy sa banal na pinagmulan o pagpapatunay.
  alternative: Isang tanda mula sa kalangitan o himpapawid.
  rationale: Ang konteksto ng hamon ng mga Pariseo ay mas malamang na humihingi ng tandang mula sa Diyos, ngunit hindi nilulutas nang labis ng salin ang likas na saklaw ng οὐρανός.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang 'Pariseo,' 'tanda,' at 'subukin' bilang karaniwan at madaling maunawaang bokabularyong biblikal. Hinati sa dalawang pangungusap upang maging natural ang daloy habang pinananatili ang ugnayan ng mga kilos.
