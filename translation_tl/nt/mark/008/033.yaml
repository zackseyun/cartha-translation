  to: Ngunit lumingon si Jesus at, nang makita niya ang kanyang mga alagad, sinaway niya si Pedro at sinabi, “Pumunta ka sa likuran ko, Satanas! Sapagkat hindi ang mga bagay ng Diyos ang nasa isip mo, kundi ang mga bagay ng tao[a].”
  rationale: Pinalitan lamang ang “Lumagay ka” ng “Pumunta ka” upang maging higit na likas at tuwiran ang utos sa Tagalog. Pinanatili ang lahat ng iba pang pahayag, kabilang ang tuwirang pagharap kay Pedro bilang “Satanas,” ang mariing pagsaway, at ang sinadyang malawak na “mga bagay ng Diyos” at “mga bagay ng tao.”
