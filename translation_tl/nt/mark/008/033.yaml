  source_fidelity: Tumpak na naipapahayag ng draft ang pagkakalingon ni Jesus, ang pagkakita niya sa mga alagad, ang pagsaway kay Pedro, at ang mariing pagtawag na “Satanas.” Napapanatili rin ang malawak na antitesis ng τὰ τοῦ θεοῦ at τὰ τῶν ἀνθρώπων. Gayunman, ang “Lumagay ka sa likuran ko” ay hindi ang pinakalikas na modernong Tagalog para sa Ὕπαγε ὀπίσω μου; ang “Pumunta ka sa likuran ko” ay mas malinaw na utos ng paglipat ng puwesto at hindi binabawasan ang puwersa ng sinabi ni Jesus.
  naturalness: Malinaw at angkop sa pampublikong pagbasa ang kabuuang salin. Ang tanging kailangang ayusin ay ang bahagyang di-karaniwang “Lumagay ka,” na maaaring magtunog pagpapalagay o pagkakalagay kaysa tuwirang utos na pumunta sa likuran.
  terminology: Ang “mga alagad,” “sinaway,” “Satanas,” at “mga bagay ng Diyos” ay angkop at pare-pareho sa karaniwang rehistro ng mga Ebanghelyo sa modernong Filipino. Ang “mga bagay ng tao” ay wastong kolektibong generic na salin ng τὰ τῶν ἀνθρώπων; tama ring nililinaw ito ng talababa bilang tumutukoy sa sangkatauhan.
