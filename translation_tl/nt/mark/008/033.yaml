id: MRK.8.33
reference: Mark 8:33
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ ἐπιστραφεὶς καὶ ἰδὼν τοὺς μαθητὰς αὐτοῦ ἐπετίμησεν ⸀Πέτρῳ ⸂καὶ λέγει⸃· Ὕπαγε ὀπίσω μου, Σατανᾶ, ὅτι οὐ φρονεῖς τὰ τοῦ θεοῦ ἀλλὰ τὰ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/033.yaml
  text: But turning around and seeing his disciples[a], he rebuked Peter and said, “Get behind me, Satan, because you are not setting your mind on the things of God, but on the things of men.”
translation:
  language: tl
  text: Ngunit lumingon si Jesus at, nang makita niya ang kanyang mga alagad, sinaway niya si Pedro at sinabi, “Pumunta ka sa likuran ko, Satanas! Sapagkat hindi ang mga bagay ng Diyos ang nasa isip mo, kundi ang mga bagay ng tao[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga bagay ng mga tao” o “mga bagay na pantao.” Ang salitang Griyego ay tumutukoy sa mga tao sa pangkalahatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστραφεὶς
  choice: lumingon
  rationale: Ipinahahayag nito ang pisikal na pagbaling ni Jesus sa paraang likas at malinaw sa modernong Tagalog.
- source_word: ἰδὼν
  choice: nang makita niya
  rationale: 'Pinananatili nito ang pagkakasunod ng mga kilos: lumingon si Jesus at pagkatapos ay nakita niya ang mga alagad.'
- source_word: μαθητὰς
  choice: mga alagad
  rationale: Karaniwang salin ito ng μαθητής sa konteksto ng mga Ebanghelyo at tumutukoy sa mga tagasunod na tinuturuan ni Jesus.
- source_word: ἐπετίμησεν
  choice: sinaway
  rationale: Ipinahahayag ng salita ang matindi at tuwirang pagsansala; likas at marangal sa Tagalog ang “sinaway.”
- source_word: καὶ λέγει
  choice: at sinabi
  rationale: Ang kasalukuyang panahunan sa Griyego ay historical present; ginawang nakaraan sa Tagalog upang maging likas ang daloy ng salaysay.
- source_word: Ὕπαγε ὀπίσω μου
  choice: Lumagay ka sa likuran ko
  rationale: Pinananatili nito ang tahasang larawan ng pagpunta sa likuran ni Jesus at ang matinding pautos, nang hindi ito pinapakahulugang simpleng “lumayo ka.”
- source_word: Σατανᾶ
  choice: Satanas
  rationale: Ito ang nakaugaliang transliterasyon ng tuwirang tawag sa teksto at pinananatili ang talas ng pagsaway.
- source_word: φρονεῖς
  choice: nasa isip mo
  rationale: Ipinahahayag nito ang oryentasyon ng pag-iisip at pagpapahalaga, hindi lamang isang panandaliang kaisipan.
- source_word: τὰ τοῦ θεοῦ
  choice: ang mga bagay ng Diyos
  rationale: Pinananatili nito ang malawak at sadyang hindi tiyak na parirala ng Griyego nang hindi nililimitahan sa “mga plano” o “mga kapakanan.”
- source_word: τὰ τῶν ἀνθρώπων
  choice: ang mga bagay ng tao
  rationale: Ang “tao” ay likas na pangkalahatang katawagan sa Tagalog para sa sangkatauhan at malinaw na kaagapay ng “mga bagay ng Diyos.”
theological_decisions:
- issue: Ang tinutukoy ng tawag na “Satanas”
  choice: Tuwirang sinaway ni Jesus si Pedro at tinawag siyang “Satanas,” nang hindi ipinaliliwanag kung literal na pagkakakilanlan ito o paglalarawan sa satanikong pagsalungat.
  alternative: Si Satanas na nasa likod ni Pedro ang kausap ni Jesus, o ang salita ay nangangahulugan lamang na “kalaban.”
  rationale: Si Pedro ang tahasang layon ng pagsaway sa Griyego, at ang kasunod na pananalita ay tuwirang nakatuon sa kanya. Pinananatili ng salin ang teolohikal na tensiyon nang walang idinagdag na paliwanag sa mismong talata.
- issue: Saklaw ng ἀνθρώπων
  choice: tao, bilang pangkalahatang katawagan sa mga tao o sangkatauhan
  alternative: mga lalaki
  rationale: Sa modernong Tagalog, ang isahang kolektibong “tao” ay likas at tumpak na generic; hindi nililimitahan ng Griyego ang kahulugan sa mga lalaking tao.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “si Jesus” sa unang sugnay upang maging malinaw ang paksa sa isang talatang binabasa nang bukod, bagaman panghalip lamang ang nasa Griyego. Pinanatili ang matinding pautos at ang malawak na paghahambing ng “mga bagay ng Diyos” at “mga bagay ng tao.”
