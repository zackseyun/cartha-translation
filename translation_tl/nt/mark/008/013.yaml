  text: And leaving them[a], he got back into the boat and went to the other side.
translation:
  language: tl
  text: Iniwan niya sila, muling sumakay sa bangka,[a] at pumunta sa kabilang panig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “sumakay siyang muli sa bangka.” Maaaring iugnay ang “muli” sa pagsakay, at maaari rin itong unawain sa diwang “pabalik.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφεὶς
  choice: Iniwan
  rationale: Ang aorist participle ay likas na naihahayag sa Filipino bilang sunod na kilos bago ang pangunahing pandiwa; malinaw nitong ipinapakitang iniwan ni Jesus ang mga kausap niya.
- source_word: αὐτοὺς
  choice: sila
  rationale: Tumutukoy ang panghalip sa mga Pariseo sa naunang konteksto; sapat at natural ang “sila.”
- source_word: πάλιν
  choice: muling
  rationale: Pinananatili nito ang pangunahing diwa ng pag-uulit sa πάλιν nang hindi ipinapalagay nang labis na ang adverbio ay eksklusibong nangangahulugang “pabalik.”
- source_word: ἐμβὰς
  choice: sumakay sa bangka
  rationale: Ang participle ay nangangahulugang pumasok o sumakay; ipinahihiwatig ng konteksto na bangka ang sinakyan, kaya makatuwiran itong banggitin para sa malinaw at natural na Filipino.
- source_word: ἀπῆλθεν
  choice: pumunta
  rationale: Ipinahahayag nito nang payak ang pag-alis patungo sa destinasyong kasunod, nang hindi gumagamit ng mas pormal na “umalis patungo.”
- source_word: εἰς τὸ πέραν
  choice: sa kabilang ibayo
  rationale: Karaniwang parirala ito sa Marcos para sa kabilang panig ng lawa; malinaw at marangal sa Filipino ang “sa kabilang ibayo.”
