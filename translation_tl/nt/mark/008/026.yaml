base_translation:
  language: en
  yaml_path: translation/nt/mark/008/026.yaml
  text: And he sent him to his home[a], saying, “Do not even enter the village.”
translation:
  language: tl
  text: At pinauwi siya ni Jesus sa kanyang tahanan[a] at sinabi, “Huwag ka man lang pumasok sa nayon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Idinaragdag ng ilang manuskrito, “at huwag kang magsabi kaninuman sa nayon.”
    reason: textual_variant
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: pinauwi
  rationale: Sa konteksto, isinugo ni Jesus ang lalaki pabalik sa sarili nitong tahanan. Likas sa modernong Tagalog ang “pinauwi” at malinaw nitong ipinahihiwatig ang patutunguhan nang hindi ito ginagawang isang atas na misyon.
- source_word: εἰς οἶκον αὐτοῦ
  choice: sa kanyang tahanan
  rationale: Ang parirala ay tumutukoy sa sarili niyang tirahan. Mas natural at marangal sa Tagalog ang “sa kanyang tahanan” kaysa sa mas literal na “sa loob ng kanyang bahay.”
- source_word: λέγων
  choice: at sinabi
  rationale: Bagaman participle ang Griyego, natural sa salaysay na Tagalog ang koordinasyong “at sinabi,” na pinananatili ang malapit na ugnayan ng pagpapauwi at ng kasunod na utos.
- source_word: Μηδὲ
  choice: Huwag ka man lamang
  rationale: Ipinapahayag ng μηδέ ang mariing pagbabawal. Nahuhuli ng “huwag ka man lamang” ang diwang ‘huwag kahit pumasok’ nang malinaw at natural.
- source_word: κώμην
  choice: nayon
  rationale: Karaniwang tumutukoy ang κώμη sa maliit na pamayanan; ang “nayon” ang tuwiran at angkop na katumbas sa Tagalog.
- source_word: εἰσέλθῃς
  choice: pumasok
  rationale: Ang aorist subjunctive kasunod ng negatibong kataga ay isang pagbabawal. Tuwiran at natural itong naihahayag ng “pumasok.”
theological_decisions:
- issue: Saklaw ng pagbabawal ni Jesus tungkol sa nayon
  choice: Inilahad lamang ang tahasang utos na huwag pumasok sa nayon.
  alternative: Idagdag ang pagbabawal na magsabi sa sinuman sa nayon, gaya ng mababasa sa ilang manuskrito.
  rationale: Ang pangunahing teksto ng SBLGNT ay naglalaman lamang ng pagbabawal na pumasok sa nayon. Hindi dapat ipasok sa pangunahing salin ang pinalawak na pagbasa, ngunit dapat itong banggitin sa talababa bilang mahalagang variant.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, likas, at marangal. Ginamit ang “pinauwi” upang maging natural ang kilos at patutunguhan sa konteksto, at ang “huwag ka man lamang” upang mapanatili ang diin ng μηδέ.
