  yaml_path: translation/nt/mark/008/010.yaml
  text: And immediately[a], getting into the boat with his disciples, he went to the region of Dalmanutha.
translation:
  language: tl
  text: At agad siyang sumakay sa bangka kasama ang kanyang mga alagad at pumunta sa pook ng Dalmanuta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “rehiyon ng Dalmanuta.” Literal na pangmaramihan ang pariralang Griyego: “mga pook” o “mga rehiyon ng Dalmanuta.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: agad
  rationale: Likas at malinaw na salitang Filipino para sa agarang pagkilos, at pinananatili nito ang mabilis na takbo ng salaysay ni Marcos.
- source_word: ἐμβὰς
  choice: sumakay
  rationale: Sa konteksto ng bangka, ang karaniwang Filipino na “sumakay” ay malinaw na nagsasaad ng pagpasok o pagsakay na nauna sa pangunahing kilos.
- source_word: πλοῖον
  choice: bangka
  rationale: Ang “bangka” ang angkop na katawagan sa sasakyang pantubig sa konteksto ng Lawa ng Galilea; ang “barko” ay maaaring magpahiwatig ng mas malaking sasakyang-dagat.
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: kasama ang kanyang mga alagad
  rationale: Natural at tumpak na pagpapahayag ng pagsama ng mga alagad kay Jesus.
- source_word: ἦλθεν
  choice: pumunta
  rationale: Ang “pumunta” ay natural sa salaysay ng paglalakbay patungo sa isang binanggit na destinasyon.
- source_word: τὰ μέρη
  choice: lupain
  rationale: Ang pangmaramihang Griyegong pananalita ay idyomatikong tumutukoy sa isang pook o rehiyon; ipinahihiwatig ng “lupain” ang malawak na lugar nang hindi artipisyal ang tunog.
- source_word: Δαλμανουθά
  choice: Dalmanuta
  rationale: Isinatinig ang pangalang-pook ayon sa natural na baybay at bigkas sa Filipino.
