  text: ἦσαν ⸀δὲ ὡς τετρακισχίλιοι. καὶ ἀπέλυσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/009.yaml
  text: There were about four thousand[a], and he sent them away.
translation:
  language: tl
  text: Mga apat na libo ang naroon, at pinauwi[a] niya sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “pinaalis sila.”
    reason: leksikal na alternatibo para sa ἀπέλυσεν (“pinauwi” / “pinaalis”).
lexical_decisions:
- source_word: ἦσαν
  choice: ang naroon
  rationale: Ginawang likas na pangungusap sa Tagalog ang eksistensiyal na gamit ng εἰμί, na tumutukoy sa dami ng mga taong naroon.
- source_word: δὲ
  choice: at
  rationale: Mahinang pang-ugnay ang δέ; ang “at” ay natural dito at hindi nagpapahiwatig ng mas tiyak na pagkakasunod-sunod kaysa nasa Griyego.
- source_word: ὡς
  choice: mga
  rationale: Kapag kasama ng bilang, ipinahihiwatig ng ὡς na pagtatantiya lamang ang bilang; karaniwang ipinapahayag ito sa Tagalog sa pamamagitan ng “mga.”
- source_word: τετρακισχίλιοι
  choice: apat na libo
  rationale: Tuwirang salin ng bilang na tumutukoy sa dami ng mga tao.
- source_word: ἀπέλυσεν
  choice: pinauwi
  rationale: Sa kontekstong ito, ang ἀπολύω ay nangangahulugang pinaalis o pinabalik ang mga tao matapos silang pakainin; natural at malinaw sa Tagalog ang “pinauwi.”
- source_word: αὐτούς
  choice: sila
  rationale: Tumutukoy ang panghalip sa mga taong bumubuo sa karamihan.
theological_decisions:
- issue: Hindi tahasang pinangalanan ang simuno ng ἀπέλυσεν sa talata
  choice: ni Jesus
  alternative: niya
  rationale: Malinaw sa konteksto na si Jesus ang simuno. Ginamit ang pangalan upang maging natural at maiwasan ang malabong reperensiya sa Tagalog, nang walang idinaragdag na teolohikal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na simple, marangal, at madaling maunawaan. Pinanatili ang tinatayang bilang sa “mga apat na libo” at ginawang natural ang ayos ng pangungusap.
