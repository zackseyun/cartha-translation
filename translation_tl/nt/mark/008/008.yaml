  terminology: Ang “nabusog,” “natirang piraso,” at “basket” ay angkop. Pinananatili ng talababa ang leksikal na pagkakaiba ng σπυρίς mula sa κόφινος nang hindi nagdaragdag ng di-tiyak na detalye sa pangunahing teksto.
