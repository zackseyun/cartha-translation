base_translation:
  language: en
  yaml_path: translation/nt/mark/008/008.yaml
  text: And they ate and were satisfied[a], and they picked up seven baskets of leftover pieces.
translation:
  language: tl
  text: Kumain sila at nabusog, at pitong basket ng mga natirang piraso ang tinipon nila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego na σπυρίδας ay tumutukoy sa mga basket, marahil ay mas malalaki; ibang salita ang ginamit ni Marcos para sa mga basket sa pagpapakain sa limang libo (κόφινοι, 6:43).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον
  choice: kumain sila
  rationale: Payak na salaysay sa nakaraang pangyayari; hindi dinaragdagan ng diin na wala sa pandiwang Griyego.
- source_word: ἐχορτάσθησαν
  choice: nabusog
  rationale: Likas at malinaw sa modernong Tagalog at ipinahihiwatig na sapat ang kanilang nakain.
- source_word: ἦραν
  choice: tinipon nila
  rationale: Sa konteksto ng pangongolekta ng mga natirang piraso, mas likas ang “tinipon” kaysa sa literal na “itinaas.”
- source_word: περισσεύματα κλασμάτων
  choice: mga pirasong natira
  rationale: Pinagsasama nang natural sa Tagalog ang ideya ng mga pinagputul-putol na bahagi at ng sobrang natira pagkatapos kumain.
- source_word: ἑπτὰ σπυρίδας
  choice: pitong basket
  rationale: Pinananatiling pangkalahatan at madaling maunawaan ang katawagan; inilalahad sa talababa ang posibleng laki at ang pagkakaiba ng salitang Griyego sa ginamit sa Marcos 6:43.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang karaniwang “basket” upang madaling maunawaan; ang mas tiyak na posibleng anyo at laki nito ay ipinaliwanag sa talababa. Ang hulihang parirala ay inayos bilang “pitong basket ang napuno” upang maging natural sa Tagalog habang pinananatili ang dami ng nakolektang tira.
