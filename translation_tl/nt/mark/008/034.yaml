id: MRK.8.34
reference: Mark 8:34
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ προσκαλεσάμενος τὸν ὄχλον σὺν τοῖς μαθηταῖς αὐτοῦ εἶπεν αὐτοῖς· ⸂Εἴ τις⸃ θέλει ὀπίσω μου ⸀ἐλθεῖν, ἀπαρνησάσθω ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/034.yaml
  text: And after calling the crowd together with his disciples[a], he said to them, “If anyone wants to come after me, let him deny himself, take up his cross[b], and follow me.”
translation:
  language: tl
  text: Tinawag niya palapit ang maraming tao, kasama ang kanyang mga alagad, at sinabi niya sa kanila, “Kung nais ng sinuman na lumapit na sumunod sa akin,[a] itakwil niya ang kanyang sarili, buhatin niya ang kanyang krus,[b] at sumunod siya sa akin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “pumaroon sa hulihan ko.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “buhatin ang kanyang krus” ay nagpapanatili sa kongkretong larawan ng krus; hindi lamang ito pangkalahatang pagtitiis ng isang pasanin.
    reason: cultural_note
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: Tinawag niya
  rationale: Ipinahahayag nang natural sa Tagalog ang pagtawag niya sa mga tao upang lumapit bago siya nagsalita. Hindi na kailangang gawing tahasang temporal ang aorist participle, sapagkat malinaw ang pagkakasunod ng mga pandiwa.
- source_word: τὸν ὄχλον
  choice: ang mga tao
  rationale: Natural at madaling maunawaang katumbas ng ὄχλος sa tagpong ito; iniiwasan ang mas matandang tunog ng “karamihan” bilang katawagan sa isang pulutong.
- source_word: σὺν τοῖς μαθηταῖς αὐτοῦ
  choice: kasama ng kanyang mga alagad
  rationale: Pinananatili ang diwa ng accompaniment at nililinaw na kapwa naroon ang mga tao at ang kanyang mga alagad.
- source_word: Εἴ τις θέλει
  choice: Kung nais ng sinuman
  rationale: Pinananatili ang pangkalahatang kondisyon at bukas na paanyaya, sa dignified ngunit kasalukuyang Tagalog.
- source_word: ὀπίσω μου ἐλθεῖν
  choice: na sumunod sa akin
  rationale: Ang parirala ay idyoma ng pagiging alagad. Natural ang “sumunod sa akin” sa Tagalog, bagaman maaari ring ilarawan nang mas literal bilang pagparoon sa hulihan niya.
- source_word: ἀπαρνησάσθω ἑαυτόν
  choice: itakwil niya ang kanyang sarili
  rationale: Mas malinaw kaysa “tanggihan ang sarili” na ito ay pagtalikod sa sariling paghahari o pag-angkin, habang pinananatili ang matinding puwersa ng ἀπαρνέομαι nang hindi ito nililimitahan sa payak na pagkakait sa sarili.
- source_word: ἀράτω
  choice: buhatin niya
  rationale: Pinananatili ang kongkretong kilos ng pag-angat o pagkuha sa krus. Iniiwasan ng “buhatin” na gawing pangkalahatang “pasanin” lamang ang larawan.
- source_word: τὸν σταυρὸν αὐτοῦ
  choice: ang sarili niyang krus
  rationale: Literal na pinananatili ang “krus” at binibigyang-diin ng natural na Tagalog ang pag-aari na nasa αὐτοῦ.
- source_word: ἀκολουθείτω μοι
  choice: sumunod siya sa akin
  rationale: Direkta at natural na utos. Ang patuloy na diwa ng present imperative ay likas na nauunawaan sa konteksto ng pagiging alagad at hindi kailangang dagdagan ng salitang wala sa teksto.
theological_decisions:
- issue: Puwersa ng mga utos tungkol sa pagiging alagad
  choice: 'Isang pangkalahatang paanyaya na sinusundan ng mga utos: “itakwil niya,” “buhatin niya,” at “sumunod siya.”'
  alternative: Gamitin ang paulit-ulit na “dapat niyang” sa bawat utos.
  rationale: Ang Griyego ay may kondisyon na sinusundan ng mga pautos na nasa ikatlong panauhan. Pinananatili ng anyong Tagalog ang kapwa kusang pagnanais at ang mahigpit na hinihingi ng pagsunod kay Jesus.
- issue: Kahulugan ng σταυρός
  choice: Panatilihin ang literal na “krus.”
  alternative: Isalin bilang “pasanin,” “pagdurusa,” o “kamatayan.”
  rationale: Nakaugat ang larawan sa kongkretong Romanong krus. Ang pagpapalit dito ng mas pangkalahatang paliwanag ay magpapakitid sa posibleng saklaw at bigat ng sinabi.
- issue: Ugnayan ng ὀπίσω μου ἐλθεῖν at ἀκολουθείτω μοι
  choice: Gamitin ang “sumunod sa akin” sa parehong parirala, ayon sa natural na idyoma ng Tagalog.
  alternative: Isalin ang una nang literal na “pumaroon sa hulihan ko” upang maiba ito sa huling utos.
  rationale: May pagkakaiba sa mga pandiwang Griyego, ngunit ang unang buong parirala ay idyomatikong tumutukoy rin sa pagsunod bilang alagad. Ang literal na “sa hulihan ko” ay maaaring tunog pisikal lamang sa modernong Tagalog; inilalagay sa talababa ang literal na larawan upang hindi ito mawala.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “itakwil” upang maipahayag ang matinding pagtalikod sa sarili, at “buhatin” upang mapanatili ang pisikal at makasaysayang larawan ng krus. Ang mga marker na [a] at [b] ay kapwa nasa mismong teksto.
