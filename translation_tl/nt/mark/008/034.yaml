  to: Tinawag niya palapit ang maraming tao, kasama ang kanyang mga alagad, at sinabi niya sa kanila, “Kung nais ng sinuman na lumapit na sumunod sa akin,[a] itakwil niya ang kanyang sarili, buhatin niya ang kanyang krus,[b] at sumunod siya sa akin.”
