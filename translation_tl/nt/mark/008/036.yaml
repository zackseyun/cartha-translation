base_translation:
  language: en
  yaml_path: translation/nt/mark/008/036.yaml
  text: For what does it profit a man to gain the whole world and forfeit his life?[a][b]
translation:
  language: tl
  text: Sapagkat ano ang pakinabang ng isang tao kung makamit niya ang buong mundo ngunit mawalan siya ng kanyang buhay?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kanyang kaluluwa.” Ang salitang Griego na ψυχή ay maaaring mangahulugang “buhay,” “kaluluwa,” o “sarili,” depende sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: Ang “isang tao” dito ay tumutukoy sa sinumang tao.
    reason: cultural_note
lexical_decisions:
- source_word: τί γὰρ
  choice: Sapagkat ano
  rationale: Ang τί ay nagpapakilala ng retorikal na tanong, at ang γάρ ay nag-uugnay rito sa naunang turo bilang paliwanag. Likas sa Filipino ang “Sapagkat ano” sa ganitong pangungusap.
- source_word: ὠφελεῖ
  choice: ang mapapakinabang
  rationale: Ang ὠφελέω ay nangangahulugang makinabang o magkaroon ng pakinabang. Pinananatili ng “mapapakinabang” ang diwang pangkalakalan na kaugnay ng pagkamit at pagkawala.
- source_word: ἄνθρωπον
  choice: isang tao
  rationale: Ang ἄνθρωπος ay isahan ngunit pangkalahatan dito. Ang “isang tao” ay natural at malinaw na tumutukoy sa sinumang tao nang hindi nililimitahan ang kasarian.
- source_word: κερδῆσαι
  choice: makamit
  rationale: Ang κερδαίνω ay tumutukoy sa pagkamit o pagtatamo ng pakinabang. Ang “makamit” ay natural sa Filipino at angkop sa malawak na bagay na tinutukoy—ang buong mundo.
- source_word: τὸν κόσμον ὅλον
  choice: ang buong mundo
  rationale: Tinutukoy ng κόσμος na may ὅλον ang mundo sa kabuuan nito. Ang “buong mundo” ang pinakanatural at tuwirang katumbas.
- source_word: ζημιωθῆναι
  choice: maiwala naman niya
  rationale: Ang pasibong ζημιόω ay maaaring mangahulugang magdanas ng pagkawala o mawalan. Ipinapakita ng “maiwala naman niya” ang matinding pagsalungat sa pagkamit, habang ang “naman” ay natural na naghahayag ng paghahambing sa Filipino.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: ang kanyang buhay
  rationale: Sa konteksto ng Marcos 8:35–37, ang ψυχή ay tumutukoy lalo na sa buhay na maaaring iligtas o mawala. Gayunman, maaari rin itong mangahulugang “kaluluwa,” kaya pinananatili ang alternatibo sa talababa.
theological_decisions:
- issue: Ang kahulugan ng ψυχή sa kasabihan tungkol sa pagiging alagad
  choice: buhay
  alternative: kaluluwa
  rationale: Pinananatili ng “buhay” ang kaugnayan sa naunang talata, kung saan ang ψυχή ay inilalarawang maaaring iligtas o mawala alang-alang kay Jesus at sa ebanghelyo. Hindi nito isinasara ang mas malawak na kahulugan ng salita; ang tradisyonal at posible ring “kaluluwa” ay inilalagay sa talababa.
- issue: Ang pangkalahatang saklaw ng ἄνθρωπον
  choice: isang tao
  alternative: isang lalaki
  rationale: Bagaman isahan ang anyong Griego, pangkalahatan ang gamit nito at tumutukoy sa sinumang tao. Ang “isang tao” ang tumpak at natural na salin sa modernong Filipino nang hindi nagdaragdag ng limitasyong pangkasarian.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang “mapapakinabang,” “makamit,” at “maiwala” upang mapanatili ang magkakaugnay na larawan ng pakinabang, pagkamit, at pagkawala nang hindi nagiging lipas o labis na teknikal.
