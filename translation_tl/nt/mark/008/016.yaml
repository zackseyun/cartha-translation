translation:
  language: tl
  text: At nag-uusap-usap sila tungkol sa kawalan nila ng tinapay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “wala silang mga tinapay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διελογίζοντο
  choice: pinag-usapan
  rationale: Ipinahihiwatig ng imperpektong anyo ang nagpapatuloy na pag-uusap. Natural sa makabagong Tagalog ang “pinag-usapan” at hindi nito ipinapasok ang mas matinding diwa ng pagtatalo.
- source_word: πρὸς ἀλλήλους
  choice: nila
  rationale: Ang pangmaramihang panghalip sa konstruksyong “pinag-usapan nila” ay natural na nagpapahiwatig na nag-usap-usap sila sa isa’t isa; iniiwasan nito ang mabigat at kalabisan na “sa isa’t isa.”
- source_word: ὅτι
  choice: na
  rationale: Ipinakikilala ng ὅτι ang nilalaman ng kanilang pag-uusap, kaya ang pang-ugnay na “na” ang natural at wastong katumbas, hindi ang panahilan na “dahil.”
- source_word: ἄρτους
  choice: tinapay
  rationale: Karaniwang kolektibong katawagan sa Tagalog ang “tinapay” at natural ito sa pangungusap. Gayunman, ang literal na maramihang “mga tinapay” ay mahalaga sa konteksto ng binibilang na mga tinapay at pinanatili sa talababa.
- source_word: οὐκ ἔχουσιν
  choice: wala silang
  rationale: Ang “wala silang” ang natural na Tagalog para sa kawalan ng pag-aari o dala. Hindi kailangang katawanin nang hiwalay ang aspektong pangkasalukuyan ng Griyego dahil malinaw ang panahon mula sa salaysay.
