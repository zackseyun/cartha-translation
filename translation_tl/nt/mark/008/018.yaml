base_translation:
  language: en
  yaml_path: translation/nt/mark/008/018.yaml
  text: Having eyes[a], do you not see? And having ears, do you not hear? And do you not remember?
translation:
  language: tl
  text: May mga mata kayo[a]—hindi ba kayo nakakakita? At may mga tainga kayo—hindi ba kayo nakaririnig? At hindi ba ninyo naaalala?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “Kahit may mga mata kayo, hindi ba kayo nakauunawa? At kahit may mga tainga kayo, hindi ba kayo nakakaintindi?” Karaniwang mga pandiwa para sa “makakita” at “makarinig” ang ginamit sa Griyego, ngunit sa kontekstong ito maaari rin silang tumukoy sa espirituwal na pagkaunawa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀφθαλμοὺς ἔχοντες
  choice: May mga mata kayo
  rationale: Likas na salin sa modernong Tagalog ng participial na parirala. Napananatili nito ang konkretong larawan at retorikal na ayos nang hindi agad ipinapakahulugang espirituwal na pagkaunawa.
- source_word: βλέπετε
  choice: nakakakita
  rationale: Tuwirang katumbas ng karaniwang pandiwang ‘makakita.’ Hinahayaan ang konteksto na magpahiwatig ng mas malalim na diwa ng pagkilala o pag-unawa.
- source_word: ὦτα ἔχοντες
  choice: may mga tainga kayo
  rationale: Pinananatili ang pagkakapantay ng anyo sa unang parirala at ang konkretong pananalita ng Griyego.
- source_word: ἀκούετε
  choice: nakaririnig
  rationale: Pinili ang pangunahing kahulugang ‘makarinig’ sa halip na ang mas mapagpaliwanag na ‘umunawa’ o ‘makinig.’
- source_word: μνημονεύετε
  choice: naaalala
  rationale: Natural at malinaw na modernong Tagalog para sa pag-alaala sa mga naganap na, na siyang punto ng pagsaway sa konteksto.
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang sunod-sunod at naiipong puwersa ng mga tanong.
- source_word: οὐ / οὐκ
  choice: hindi ba
  rationale: Natural na anyo sa Tagalog para sa mga negatibong retorikal na tanong na inaasahang sasagutin nang pasang-ayon.
theological_decisions:
- issue: Literal na pandama o matalinghagang espirituwal na pagkaunawa sa ‘makakita’ at ‘makarinig’
  choice: Panatilihin sa pangunahing teksto ang konkretong ‘nakakakita’ at ‘nakaririnig,’ habang hinahayaang ipahiwatig ng konteksto ang espirituwal na pagkamanhid.
  alternative: Isalin bilang ‘nakauunawa’ at ‘nakakaintindi’ upang tahasang ilabas ang matalinghagang diwa.
  rationale: Karaniwang pandiwa para sa pagkakita at pagdinig ang ginamit sa Griyego. Ang literal na pananalita ay nagpapanatili sa retorikal at propetikong alingawngaw nang hindi nilulutas ang sadyang saklaw ng kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang ‘may … kayo’ bilang likas na Tagalog para sa participial na konstruksyon, at pinanatili ang magkakatulad na ayos ng mga retorikal na tanong.
