id: MRK.8.27
reference: Mark 8:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἐξῆλθεν ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ εἰς τὰς κώμας Καισαρείας τῆς Φιλίππου· καὶ ἐν τῇ ὁδῷ ἐπηρώτα τοὺς μαθητὰς αὐτοῦ λέγων αὐτοῖς· Τίνα με λέγουσιν οἱ ἄνθρωποι εἶναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/027.yaml
  text: And Jesus went out[a], with his disciples, to the villages of Caesarea Philippi. And on the way he was asking his disciples, saying to them, “Who do people say that I am?”
translation:
  language: tl
  text: At umalis si Jesus kasama ang kanyang mga alagad patungo sa mga nayon ng Cesarea Filipos. Habang nasa daan, tinatanong niya ang kanyang mga alagad, “Sino ang sinasabi ng mga tao[a] na ako?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griego na ἄνθρωποι ay tumutukoy rito sa mga tao sa pangkalahatan, hindi lamang sa mga lalaki.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: umalis
  rationale: Ipinahahayag ng “umalis” ang kilos na paglabas o pag-alis nang hindi gumagamit ng makalumang pananalita; nililinaw ng kasunod na “patungo” ang destinasyon.
- source_word: κώμας
  choice: mga nayon
  rationale: Karaniwang tumutukoy ang κώμη sa maliliit na pamayanan sa labas ng isang malaking lungsod, kaya mas tiyak ang “mga nayon” kaysa “mga bayan.”
- source_word: Καισαρείας τῆς Φιλίππου
  choice: Cesarea Filipos
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalan ng lugar, sa halip na literal na “Cesarea ni Felipe.”
- source_word: ἐν τῇ ὁδῷ
  choice: Habang nasa daan
  rationale: Natural sa modernong Filipino at pinananatili ang tagpo ng paglalakbay na mahalaga sa salaysay ni Marcos.
- source_word: ἐπηρώτα
  choice: tinatanong niya
  rationale: Ang aspektong imperpektibo ng pandiwang Griego ay kinakatawan ng “tinatanong,” na nagpapahiwatig ng kilos na nagaganap noon, sa halip na payak na “tinanong.”
- source_word: λέγων αὐτοῖς
  choice: —
  rationale: Hindi isinalin nang hiwalay ang literal na “na sinasabi sa kanila” sapagkat magiging paulit-ulit at di-natural sa Filipino kasunod ng “tinatanong niya”; ang tuwirang tanong mismo ang natural na kumakatawan sa participial construction.
- source_word: Τίνα με λέγουσιν οἱ ἄνθρωποι εἶναι;
  choice: Sino raw ako ayon sa mga tao?
  rationale: Ang “sino” ay nagpapanatili sa tanong tungkol sa pagkakakilanlan. Ipinahahayag ng “raw” at “ayon sa” na itinatanong ni Jesus kung ano ang sinasabi ng ibang tao tungkol sa kanya.
- source_word: οἱ μαθηταὶ αὐτοῦ / τοὺς μαθητὰς αὐτοῦ
  choice: kanyang mga alagad
  rationale: Pinananatili ang tahasang panghalip na αὐτοῦ at ginagamit ang nakaugaliang salin na “mga alagad” para sa μαθηταί.
theological_decisions:
- issue: Ang pangkalahatang gamit ng ἄνθρωποι sa tanong ni Jesus
  choice: mga tao
  alternative: mga lalaki
  rationale: Bagaman panlalaki ang anyong gramatikal, pangkalahatan ang kahulugan dito at tumutukoy sa publiko, hindi lamang sa mga lalaking tao.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Pinili ang natural na ayos ng pangungusap habang pinananatili ang patuloy na aspekto ng pagtatanong at ang pangkalahatang saklaw ng “mga tao.”
