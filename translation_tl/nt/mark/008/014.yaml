  text: Καὶ ἐπελάθοντο λαβεῖν ἄρτους, καὶ εἰ μὴ ἕνα ἄρτον οὐκ εἶχον μεθ’ ἑαυτῶν ἐν τῷ πλοίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/014.yaml
  text: And they had forgotten to take bread[a], and except for one loaf they had no bread with them in the boat.
translation:
  language: tl
  text: Nakalimutan nilang magdala ng tinapay[a], at iisa lamang ang tinapay na dala nila sa bangka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “mga tinapay.” Ang pangmaramihang anyo na ἄρτους ay maaaring tumukoy sa magkakahiwalay na tinapay, ngunit dito ay malamang na tumutukoy sa tinapay o baon sa pangkalahatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπελάθοντο
  choice: Nakalimutan nila
  rationale: Ang aorist ng ἐπιλανθάνομαι ay nagsasaad na nakalimot sila; natural sa salaysay na Filipino ang “nakalimutan nila.”
- source_word: λαβεῖν
  choice: magdala
  rationale: Sa konteksto ng pagsakay sa bangka, ang infinitive ay tumutukoy sa pagdadala ng tinapay bilang baon; mas natural dito ang “magdala” kaysa “kumuha.”
- source_word: ἄρτους
  choice: tinapay
  rationale: Bagaman plural ang Griyego at maaaring tumukoy sa magkakahiwalay na tinapay, maaari rin itong gamitin sa pangkalahatang diwa ng tinapay o baon. Ang “tinapay” ay natural sa Filipino at hindi pinipilit ang bilang.
- source_word: εἰ μὴ ἕνα ἄρτον
  choice: maliban sa isang tinapay
  rationale: Exceptive ang εἰ μή dito, hindi conditional. Pinananatili ng “isang tinapay” ang tahasang bilang at countable na diwa ng singular na ἄρτον.
- source_word: οὐκ εἶχον μεθ’ ἑαυτῶν
  choice: wala silang dalang tinapay
  rationale: Ipinahihiwatig ng parirala na wala silang tinapay na kasama nila. Ang pag-uulit ng “tinapay” ay nililinaw ang ipinagkakait na bagay at iniiwasang magmukhang wala silang anumang ibang dala.
- source_word: ἐν τῷ πλοίῳ
  choice: sa bangka
  rationale: Karaniwan at natural na katumbas sa Filipino ng lokasyong ipinapahayag ng ἐν τῷ πλοίῳ.
