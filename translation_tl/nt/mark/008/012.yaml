  text: καὶ ἀναστενάξας τῷ πνεύματι αὐτοῦ λέγει· Τί ἡ γενεὰ αὕτη ⸂ζητεῖ σημεῖον⸃; ἀμὴν λέγω ⸀ὑμῖν, εἰ δοθήσεται τῇ γενεᾷ ταύτῃ σημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/012.yaml
  text: And sighing deeply in his spirit[a], he says, “Why does this generation seek a sign? Truly I say to you, no sign will be given to this generation.”
translation:
  language: tl
  text: At bumuntong-hininga siya nang malalim sa kanyang espiritu at sinabi niya, “Bakit naghahanap ng tanda ang salinlahing ito? Katotohanang sinasabi ko sa inyo, walang tandang ibibigay sa salinlahing ito.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “kung ang salinlahing ito ay bibigyan ng tanda”—isang mala-panumpang pahayag sa Griyego na nangangahulugang walang tandang ibibigay.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστενάξας
  choice: mapabuntong-hininga nang malalim
  rationale: Ipinahihiwatig ng pinatinding pandiwa ang isang malalim na buntong-hininga o daing; natural sa Filipino ang “mapabuntong-hininga nang malalim” at naipapakita rin nito ang bigat ng damdamin.
- source_word: τῷ πνεύματι αὐτοῦ
  choice: sa kanyang espiritu
  rationale: Pinananatili nito ang antropolohikal na pananalita ng Griyego at ang diwa ng saklaw o paggalang, sa halip na paliitin ito sa “sa loob-loob niya.”
- source_word: λέγει
  choice: sinabi niya
  rationale: Bagaman historical present ang Griyego, mas natural sa tuloy-tuloy na salaysay sa modernong Filipino ang pangnagdaang “sinabi niya.”
- source_word: Τί
  choice: Bakit
  rationale: Sa idyomang ito, ang τί na kasama ng pandiwa ay nagtatanong ng dahilan; “Bakit” ang natural at tumpak na katumbas.
- source_word: γενεὰ
  choice: salinlahi
  rationale: Pinananatili ng “salinlahi” ang kolektibo at panahong pahiwatig ng γενεά nang hindi ito ginagawang pangkalahatang “mga tao.”
- source_word: ζητεῖ
  choice: naghahanap
  rationale: Direkta nitong tinutumbasan ang “seek” at hindi nito pinalalakas ang salita tungo sa “humihingi” o “naggigiit,” bagaman mapanghamon ang konteksto.
- source_word: σημεῖον
  choice: tanda
  rationale: Ang “tanda” ang payak at karaniwang katumbas na nagpapanatili sa ideya ng nagpapatunay na pangyayari nang hindi idinaragdag sa teksto ang salitang “himala.”
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Katotohanang sinasabi ko sa inyo
  rationale: Malinaw at marangal na Filipino ito na nagpapanatili sa taimtim at mariing puwersa ng pormula.
- source_word: εἰ δοθήσεται τῇ γενεᾷ ταύτῃ σημεῖον
  choice: walang tandang ibibigay sa salinlahing ito
  rationale: Ang εἰ ay bahagi ng isang Semitikong pormulang panunumpa na gumaganap bilang mariing pagtanggi; ang tahasang negatibong salin ang malinaw na naghahatid ng kahulugan sa Filipino.
theological_decisions:
- issue: Pagpapakahulugan sa mala-panumpang sugnay na εἰ pagkatapos ng ἀμὴν λέγω ὑμῖν
  choice: 'Isinalin bilang mariing pagtanggi: “walang tandang ibibigay sa salinlahing ito.”'
  alternative: “kung bibigyan ng tanda ang salinlahing ito”
  rationale: Ang literal na anyo ay sadyang bitin dahil ang ipinahihiwatig na sumpa ay hindi binibigkas. Gumaganap ang idyoma bilang matinding pagtanggi, kaya inilalahad sa pangunahing teksto ang kahulugan habang itinatala sa talababa ang anyong Griyego.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinili ang “salinlahi,” “tanda,” at “espiritu” upang mapanatili ang mahahalagang termino ng Griyego. Inilagay ang pananda ng talababa pagkatapos ng buong pahayag na tinutukoy nito.
