  to: At bumuntong-hininga siya nang malalim sa kanyang espiritu at sinabi niya, “Bakit naghahanap ng tanda ang salinlahing ito? Katotohanang sinasabi ko sa inyo, walang tandang ibibigay sa salinlahing ito.”[a]
