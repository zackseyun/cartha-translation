id: MRK.8.15
reference: Mark 8:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ διεστέλλετο αὐτοῖς λέγων· Ὁρᾶτε, βλέπετε ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ τῆς ζύμης Ἡρῴδου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/015.yaml
  text: And he kept instructing them[a], saying, “Watch out[b]; beware of the leaven of the Pharisees and the leaven of Herod.”
translation:
  language: tl
  text: At patuloy niya silang binabalaan, “Magbantay kayo; mag-ingat kayo sa pampaalsa[a] ng mga Fariseo at sa pampaalsa ni Herodes.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lebadura.” Ang “pampaalsa” ay pinanatili bilang talinghaga ng isang impluwensiyang kumakalat sa kabuuan.
    reason: lexical_alternative
  - marker: b
    text: Hindi tinutukoy rito ang eksaktong kahulugan ng “pampaalsa.” Ihambing ang Mateo 16:6, 12 at Lucas 12:1 para sa kaugnay na paggamit ng talinghagang ito.
    reason: cross_reference
lexical_decisions:
- source_word: διεστέλλετο
  choice: patuloy niya silang binabalaan
  rationale: Ipinahihiwatig ng aspektong imperpekto ang nagpapatuloy o inuulit na pagkilos. Ang “binabalaan” ay angkop sa seryosong pag-iingat na kasunod, habang ang “patuloy” ang nagpapakita ng duratibo o iteratibong puwersa.
- source_word: λέγων
  choice: —
  rationale: Hindi na isinalin nang hiwalay ang participle na “sinasabi” sapagkat natural nang ipinakikilala ng kuwit at tuwirang sipi ang nilalaman ng babala sa Filipino.
- source_word: Ὁρᾶτε
  choice: Magbantay kayo
  rationale: Sa kontekstong ito, ang pandiwa ay panawagan sa pagiging mapagmatyag, hindi lamang sa literal na pagtingin.
- source_word: βλέπετε
  choice: mag-ingat kayo
  rationale: Pinananatili ang magkalapit na dalawang pautos bilang magkaibang ngunit magkatuwang na babala upang maipakita ang diin ng Griyego.
- source_word: ἀπὸ
  choice: sa
  rationale: Pagkatapos ng “mag-ingat,” ang “sa” ang natural na gamit sa Filipino para tukuyin ang bagay o impluwensiyang dapat iwasan.
- source_word: ζύμης
  choice: pampaalsa
  rationale: Natural at madaling maunawaang salitang Filipino ito na nagpapanatili sa talinghaga ng isang sangkap na kumakalat at umaapekto sa buong masa. Hindi ipinalit sa pangunahing teksto ang interpretasyong “masamang impluwensiya.”
- source_word: Φαρισαίων
  choice: mga Fariseo
  rationale: Karaniwang anyong Filipino para sa pangkat na ito; ipinakikita ng “ng” ang ugnayang nasa genitive.
- source_word: Ἡρῴδου
  choice: Herodes
  rationale: Karaniwang anyong Filipino ng pangalan. Pinangalanan mismo ng teksto si Herodes, kaya hindi ito pinalawak bilang sambahayan, mga tagasunod, o impluwensiya niya.
theological_decisions:
- issue: Kahulugan ng talinghagang ζύμη
  choice: Panatilihin bilang “pampaalsa” nang hindi ipinapaliwanag sa pangunahing teksto.
  alternative: turo; pagkukunwari; nakasasamang impluwensiya
  rationale: Negatibo ang talinghaga sa konteksto, ngunit hindi tinutukoy ng Marcos 8:15 ang eksaktong kahulugan nito. Pinananatili ng salin ang sadyang pagiging bukas ng pahayag sa interpretasyon.
- issue: Saklaw ng “pampaalsa ni Herodes”
  choice: Panatilihin ang tuwirang pagtukoy kay Herodes.
  alternative: pampaalsa ng mga Herodiano; impluwensiya ng sambahayan ni Herodes
  rationale: Ἡρῴδου ang mababasa sa SBLGNT. Hindi dapat palitan ng salin ang tahasang pangalan ng isang mas tiyak ngunit interpretatibong pangkat.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “patuloy” upang maipakita ang imperpektong aspekto, at pinanatili ang magkatambal na pautos na “Magbantay” at “mag-ingat” para sa retorikal na diin ng orihinal.
