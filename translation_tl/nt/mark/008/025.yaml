  text: Then again he laid his hands on his eyes[a], and he saw clearly and was restored[b], and he was seeing everything distinctly.
translation:
  language: tl
  text: Pagkatapos ay muli niyang ipinatong ang kanyang mga kamay sa mga mata ng lalaki.[a] Nakakita nang malinaw ang lalaki, nanumbalik ang kanyang paningin, at malinaw na niyang nakikita ang lahat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang manuskrito, iba ang pagkakaayos at anyo ng pananalita rito; masasalamin iyon sa mga saling gaya ng “at tumingin siyang mabuti, nanumbalik ang kanyang paningin, at malinaw niyang nakita ang lahat.”
    reason: textual_variant
  - marker: b
    text: O, “at malinaw na niyang nakikita ang lahat.” Pinagsasama sa huling sugnay ang isang pandiwang nasa imperfect at isang pang-abay na nagsasaad ng malinaw o tiyak na pagkakita.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα πάλιν
  choice: Pagkatapos, muli
  rationale: Ipinakikita ng εἶτα ang kasunod na pangyayari, at ng πάλιν ang pag-uulit. Likas sa Filipino ang “Pagkatapos, muli” at malinaw nitong pinananatili ang dalawang diwa.
- source_word: ἐπέθηκεν τὰς χεῖρας ἐπὶ τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: ipinatong ang kanyang mga kamay sa mga mata ng lalaki
  rationale: Tuwirang inilalarawan ng “ipinatong” ang pisikal na kilos, at pinananatili ng “mga kamay” ang maramihang anyo ng χεῖρας. Ginamit ang “ng lalaki” upang maging malinaw sa Filipino kung kaninong mga mata ang tinutukoy.
- source_word: διέβλεψεν
  choice: Nakakita ito nang malinaw
  rationale: Sa konteksto, ipinahihiwatig ng διαβλέπω ang malinaw na pagkakita o pagbawi ng malinaw na paningin. Hindi idinagdag ang diwang “tuminging mabuti,” na maaaring magmula sa ibang pagbasa o pagpapakahulugan.
- source_word: ἀπεκατέστη
  choice: nanumbalik ang kanyang paningin
  rationale: Ang ἀποκαθίστημι ay tumutukoy sa pagbabalik sa dating o wastong kalagayan. Sa konteksto ng pagpapagaling sa mata, natural at tiyak sa Filipino ang “nanumbalik ang kanyang paningin” nang hindi pinalalawak sa pangkalahatang paggaling.
- source_word: ἐνέβλεπεν
  choice: patuloy niyang nakikita
  rationale: Ipinahihiwatig ng imperfect na ἐνέβλεπεν ang nagpapatuloy o namamalaging kalagayan ng pagkakita matapos manumbalik ang paningin. Pinananatili ng “patuloy” ang aspektong ito sa natural na Filipino.
- source_word: τηλαυγῶς
  choice: nang malinaw
  rationale: Ang pang-abay ay nagsasaad ng malinaw at tiyak na pagkakita, na maaaring may pahiwatig ding nakakakita kahit sa malayo. “Nang malinaw” ang pinakanatural na salin nang hindi labis na tinutukoy ang di-tiyak na pahiwatig ng distansiya.
- source_word: ἅπαντα
  choice: ang lahat
  rationale: Ang neuter plural na ἅπαντα ay idyomatikong tumutukoy sa lahat ng bagay na nakikita; natural itong maipahahayag bilang “ang lahat.”
theological_decisions:
- issue: Paglalarawan sa dalawang-yugtong pagpapagaling
  choice: 'Pinanatili ang pagkakasunod-sunod: malinaw na pagkakita, panunumbalik ng paningin, at nagpapatuloy na malinaw na pagkakita.'
  alternative: Pag-isahin ang mga pandiwa bilang iisang natapos at kagyat na pangyayari.
  rationale: May sunod-sunod na mga pandiwa sa Griyego, at imperfect ang ἐνέβλεπεν. Ang salin ay hindi nagpapantay sa mga aspektong ito at hindi rin nagpapaliwanag kung bakit dalawang yugto ang pagpapagaling.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “ito” para sa lalaking pinagaling upang maiwasan ang kalituhan sa magkasunod na panlalaking panghalip, at ang “patuloy” upang maipakita nang natural ang imperfect aspect.
