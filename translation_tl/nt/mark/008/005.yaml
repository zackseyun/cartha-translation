  text: And he asked them, “How many loaves do you have?” They said, “Seven.”
translation:
  language: tl
  text: At tinanong niya sila, “Ilang tinapay ang mayroon kayo?” Sinabi nila, “Pito.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang payak na pang-ugnay at tuloy-tuloy na daloy ng salaysay ni Marcos nang hindi nagdaragdag ng mas tiyak na diwang temporal.
- source_word: ἠρώτα
  choice: tinanong niya
  rationale: Bagaman imperfect ang anyo at maaaring magpahiwatig ng nagpapatuloy na pagtatanong, natural sa salaysay sa Filipino ang simpleng “tinanong niya” at sapat nitong ipinapahayag ang kilos.
- source_word: αὐτούς
  choice: sila
  rationale: Tuwirang layon na panghalip na tumutukoy sa mga alagad; sa Filipino, ang anyong “sila” ang natural pagkatapos ng pandiwang “tinanong.”
- source_word: Πόσους
  choice: Ilan
  rationale: Natural na pananong sa Filipino para sa bilang ng mabibilang na bagay.
- source_word: ἔχετε
  choice: ninyo
  rationale: Sa pariralang “Ilan ang tinapay ninyo?” likas na ipinapahayag ng “ninyo” ang pag-aari o taglay na tinutukoy ng Griyegong “mayroon kayo.”
- source_word: ἄρτους
  choice: tinapay
  rationale: Ang ἄρτος ay tinapay o isang buong piraso nito. Sa Filipino, maaaring bilangin ang “tinapay” ayon sa konteksto, kaya natural ito at hindi nangangailangan ng dagdag na panukat na wala sa Griyego.
- source_word: οἱ δὲ εἶπαν
  choice: Sinabi nila
  rationale: Tapat sa payak na pandiwang εἶπαν, “sinabi,” samantalang ang paglipat sa tugon ay sapat nang ipinahihiwatig ng bagong pangungusap; hindi kailangang piliting isalin ang δέ bilang “ngunit.”
- source_word: Ἑπτά
  choice: Pito
  rationale: Payak at tuwirang salin ng bilang na ibinigay bilang sagot.
