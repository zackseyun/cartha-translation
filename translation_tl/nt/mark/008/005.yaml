  register: Modernong Filipino na payak, marangal, at madaling maunawaan. Ginamit ang “Ilan ang tinapay ninyo?” bilang natural na tanong sa Tagalog; malinaw sa konteksto na bilang ng mga piraso o buong tinapay ang tinutukoy.
