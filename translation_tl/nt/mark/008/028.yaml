base_translation:
  language: en
  yaml_path: translation/nt/mark/008/028.yaml
  text: They told him[a], saying, “John the Baptist; and others, Elijah; but others, one of the prophets.”
translation:
  language: tl
  text: Sinabi nila sa kanya[a], “Si Juan na Tagapagbautismo; ang iba naman, si Elias; at ang iba pa, isa sa mga propeta.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, may magkaugnay na pandiwang “sinabi” at “nagsasabi,” isang pormula ng pag-uulat na maaaring isalin nang mas maikli sa Filipino bilang “Sinabi nila sa kanya.” Hindi na inuulit sa mga kasunod na bahagi ang pandiwang “sinasabi” at ang ipinahihiwatig na “ikaw ay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Sinabi nila
  rationale: Ang panghalip na “nila” ay tumutukoy sa mga alagad mula sa naunang konteksto. Hindi na tahasang isinalin ang banayad na pang-ugnay na δέ upang maging natural sa Filipino.
- source_word: εἶπαν αὐτῷ λέγοντες
  choice: Sinabi nila sa kanya
  rationale: Ang magkaugnay na pandiwang εἶπαν at participial na λέγοντες ay isang pormula ng pag-uulat. Pinagsama ang mga ito sa natural na pariralang Filipino; ipinaliliwanag sa talababa ang mas tahasang anyo.
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: Si Juan na Tagapagbautismo
  rationale: Inilalarawan ng βαπτιστής ang gawain ni Juan bilang nagbabautismo. Ang “Tagapagbautismo” ay malinaw at hindi nagpapahiwatig ng makabagong denominasyonal na katawagan.
- source_word: ἄλλοι ... ἄλλοι δὲ
  choice: ang iba naman ... at ang iba pa
  rationale: Likas sa Filipino ang hulmahang ito para sa magkakaibang pangkat at magkakaibang sagot. Naipapakita ng “naman” at “iba pa” ang banayad na paghahambing nang hindi pinalalabis ang δέ bilang matinding pagsalungat.
- source_word: Ἠλίαν
  choice: Elias
  rationale: Ang “Elias” ang nakaugaliang anyo ng pangalan sa modernong saling Filipino at madaling makilala ng karaniwang mambabasa.
- source_word: ὅτι εἷς τῶν προφητῶν
  choice: isa sa mga propeta
  rationale: 'Pinanatili ang elipsis ng Griyego: nauunawaan mula sa tanong at sa listahan ang ipinahihiwatig na “ikaw ay,” kaya hindi ito kailangang ulitin.'
theological_decisions:
- issue: Paglalahad sa mga palagay ng mga tao tungkol kay Jesus
  choice: 'Isinalin bilang maikli at eliptikong talaan: “Si Juan ... si Elias ... isa sa mga propeta.”'
  alternative: “Sinasabi nilang ikaw ay si Juan na Tagapagbautismo; sinasabi naman ng iba na ikaw ay si Elias; at ng iba pa na isa ka sa mga propeta.”
  rationale: Hindi tahasang inuulit ng Griyego ang pandiwang “sinasabi” o ang ipinahihiwatig na “ikaw ay” sa bawat sugnay. Pinananatili ng maikling talaan ang anyo at tensiyon ng pinagmulan nang malinaw pa rin sa Filipino.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “Tagapagbautismo” bilang malinaw na paglalarawan sa gawain ni Juan, at pinanatili ang maikli at eliptikong daloy ng sagot sa Griyego.
