base_translation:
  language: en
  yaml_path: translation/nt/mark/008/019.yaml
  text: When I broke the five loaves for the five thousand[a], how many baskets full of broken pieces did you pick up?” They said to him[c][b], “Twelve.”
translation:
  language: tl
  text: “Nang pinagpira-piraso ko ang limang tinapay para sa limang libo[a], ilang basket na punô ng mga piraso[b] ang pinulot ninyo[c]?” Sinabi nila sa kanya, “Labindalawa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang limang libo.” Dahil panlalaki ang anyo sa Griyego, maaari ring isaling “ang limang libong lalaki.”
    reason: alternative_reading
  - marker: b
    text: Maaari ring “mga tipak.” Tumutukoy ito sa mga pirasong natira mula sa pinagpira-pirasong tinapay.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “kinuha ninyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε
  choice: Nang
  rationale: Likas na panandang temporal sa Filipino para sa pangyayaring binabalikan ni Jesus.
- source_word: ἔκλασα
  choice: pinagputul-putol ko
  rationale: Tuwirang ipinapahayag ang pagputol-putol ng mga tinapay at pinananatili ang ugnayan nito sa mga pirasong natira.
- source_word: ἄρτους
  choice: tinapay
  rationale: Sa Filipino, ang bilang ay malinaw na ipinahihiwatig ng “limang,” kaya natural ang “limang tinapay” nang hindi na kailangang gumamit ng mas teknikal na tawag sa hugis nito.
- source_word: εἰς τοὺς πεντακισχιλίους
  choice: para sa limang libo
  rationale: Ipinapahayag ng “para sa” ang paglalaan ng tinapay sa karamihan. Hindi idinagdag ang “lalaki” sapagkat hindi ito kailangang tahasang tukuyin sa mismong parirala.
- source_word: κοφίνους
  choice: basket
  rationale: Karaniwan at malinaw sa modernong Filipino; hindi ipinipilit ang isang tiyak na tradisyonal na uri ng sisidlan na maaaring maging di-pamilyar o labis na espesipiko.
- source_word: κλασμάτων
  choice: mga piraso
  rationale: Tumutukoy sa mga pirasong natira mula sa pinagputul-putol na tinapay; malinaw ito sa konteksto at hindi mabigat pakinggan.
- source_word: πλήρεις
  choice: punô ng
  rationale: Natural na katumbas sa Filipino ng mga basket na may lamang sagad o ganap.
- source_word: ἤρατε
  choice: tinipon ninyo
  rationale: Sa konteksto ng mga natirang piraso, malinaw na ang kilos ay pagtitipon o pag-iipon sa mga basket, habang ang talababa ay nagpapanatili sa mas literal na posibilidad na “kinuha.”
- source_word: λέγουσιν αὐτῷ
  choice: Sinabi nila sa kanya
  rationale: Ginawang karaniwang nakaraang panahunan sa salaysay sa Filipino, bagaman pangkasalukuyan ang anyong Griyego bilang makulay na estilong pasalaysay.
- source_word: Δώδεκα
  choice: Labindalawa
  rationale: Sapat ang tuwirang sagot na bilang sapagkat malinaw sa tanong na mga basket ang tinutukoy.
theological_decisions:
- issue: Saklaw ng τοὺς πεντακισχιλίους
  choice: ang limang libo
  alternative: ang limang libong lalaki
  rationale: Ang panlalaking anyo sa Griyego ay maaaring unawaing tumutukoy sa mga lalaki, ngunit dito ginagamit ang bilang bilang nakaugaliang pagtukoy sa karamihang pinakain. Pinananatili ng pangunahing teksto ang mismong antas ng katiyakan ng parirala, at inilalahad sa talababa ang posibleng mas tiyak na salin.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang karaniwang “basket” sa halip na isang di-pamilyar o labis na espesipikong katutubong katawagan. Pinanatili ang tuwirang anyo ng tanong at maikling sagot.
