  text: And he was speaking the word openly[a]. And Peter took him aside and began to rebuke him.
translation:
  language: tl
  text: At malinaw niyang sinabi ang bagay na ito.[a] Pagkatapos, isinama siya ni Pedro sa isang tabi at nagsimulang sawayin siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nang hayagan” o “nang buong tapang.” Ang salitang Griyego ay tumutukoy sa tuwiran, malinaw, at walang-pagkukubling pagsasalita.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησίᾳ
  choice: hayagan
  rationale: Ipinahihiwatig ng salita ang lantad, tuwiran, at walang-pagkukubling pagsasalita. Natural ang “hayagan” sa Filipino at hindi nito labis na idinidiin ang tapang kaysa sa pagiging malinaw at lantad.
- source_word: τὸν λόγον
  choice: ang bagay na ito
  rationale: Tumutukoy ang parirala sa naunang sinabi ni Jesus tungkol sa kaniyang pagdurusa, kamatayan, at muling pagkabuhay. Mas malinaw sa modernong Filipino ang “ang bagay na ito” kaysa sa literal na “ang salita,” habang pinananatili ang kaugnayan sa naunang pahayag.
- source_word: ἐλάλει
  choice: sinasabi
  rationale: Pinananatili ng aspektong imperpektibo ng “sinasabi” ang nagpapatuloy na kilos ng ἐλάλει nang hindi ipinahihiwatig na paulit-ulit niya itong sinabi.
- source_word: προσλαβόμενος
  choice: isinama siya … sa isang tabi
  rationale: Sa konteksto, inilalayo ni Pedro si Jesus upang kausapin nang bukod. Ang pariralang ito ay malinaw at likas sa Filipino.
- source_word: ἤρξατο ἐπιτιμᾶν αὐτῷ
  choice: sinimulang sawayin
  rationale: Tuwirang inilalarawan nito ang pasimulang kilos at ang matinding pagpuna o pagsaway ni Pedro kay Jesus. Ang “sawayin” ay natural at hindi labis na pormal.
theological_decisions:
- issue: Diin ng παρρησίᾳ sa pahayag ni Jesus tungkol sa kaniyang pagdurusa
  choice: hayagan
  alternative: nang malinaw; nang buong tapang
  rationale: Binibigyang-diin ng konteksto na walang pagkukubli at tuwiran ang sinabi ni Jesus, kaya naunawaan ito ni Pedro at tumugon siya. Hindi nililimitahan ng salin ang salita sa pagiging pampubliko lamang o sa katapangan lamang.
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “hayagan niyang sinasabi” upang mapanatili ang imperpektibong aspekto at ang lantad na paraan ng pagsasalita; iniwasan ang mas literal ngunit hindi likas na “sinasalita ang salita.”
