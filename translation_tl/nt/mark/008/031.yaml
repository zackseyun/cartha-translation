  rationale: Inayos ang mga katawagan para sa dalawang makasaysayang pangkat upang maging mas malapit sa Griyego, at nilinaw ang sintaks ng magkakaugnay na pasibong pandiwa. Pinanatili ang “pagkaraan ng tatlong araw,” ayon sa μετὰ τρεῖς ἡμέρας, at ang talababa nito nang walang paghaharmonisa sa “sa ikatlong araw.”
