id: MRK.8.31
reference: Mark 8:31
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἤρξατο διδάσκειν αὐτοὺς ὅτι δεῖ τὸν υἱὸν τοῦ ἀνθρώπου πολλὰ παθεῖν καὶ ἀποδοκιμασθῆναι ⸀ὑπὸ τῶν πρεσβυτέρων καὶ τῶν ἀρχιερέων καὶ τῶν γραμματέων καὶ ἀποκτανθῆναι καὶ μετὰ τρεῖς ἡμέρας ἀναστῆναι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/031.yaml
  text: And he began to teach them that the Son of Man must suffer many things[a], and be rejected by the elders and the chief priests and the scribes, and be killed, and after three days rise again.
translation:
  language: tl
  text: At nagsimula siyang magturo sa kanila na ang Anak ng Tao ay kailangang magdusa ng maraming bagay, at siya ay itakwil ng mga nakatatanda, ng mga punong pari, at ng mga eskriba, patayin, at bumangon pagkaraan ng tatlong araw.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “pagkaraan ng tatlong araw.” Sa ilang salin, “sa ikatlong araw” o “sa loob ng tatlong araw,” bilang mas idyomatikong pahayag o bilang pag-aayon sa mga kahawig na talata.
    reason: alternative_reading
lexical_decisions:
- source_word: ἤρξατο διδάσκειν
  choice: sinimulan niyang ituro
  rationale: Likas na ipinapahayag sa Tagalog ang ingressive na diwa ng ἤρξατο kasama ng pawatas at pinananatili ang paglipat sa bagong yugto ng salaysay.
- source_word: δεῖ
  choice: kailangang
  rationale: Malinaw nitong pinananatili ang matibay na diwa ng pangangailangan nang hindi ipinapaliwanag sa mismong salin ang teolohikal na mekanismo nito.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Itinatag na salin ito ng titulo at pinananatili ang ugnayan nito sa gamit sa mga Ebanghelyo at sa Daniel.
- source_word: πολλὰ παθεῖν
  choice: magdusa ng maraming bagay
  rationale: Malapit ito sa malawak at bahagyang kongkretong pananalita ng Griyego; hindi nito nililimitahan ang uri ng pagdurusa.
- source_word: ἀποδοκιμασθῆναι
  choice: itakwil
  rationale: Natural at tuwiran itong nagpapahayag ng opisyal na pagtanggi o hindi pagtanggap matapos hatulan.
- source_word: ὑπὸ τῶν πρεσβυτέρων
  choice: ng matatandang pinuno
  rationale: Ipinakikita nitong ang tinutukoy ay kinikilalang pangkat ng mga pinunong Judio, hindi lamang matatandang tao.
- source_word: τῶν ἀρχιερέων
  choice: mga punong pari
  rationale: Tumpak nitong tinutukoy ang pangkat ng mga nangungunang pari, hindi ang pagkakaroon ng maraming kasalukuyang pinakapunong pari.
- source_word: τῶν γραμματέων
  choice: mga tagapagturo ng Kautusan
  rationale: Mas malinaw sa ordinaryong modernong mambabasa ang tungkulin ng mga γραμματεῖς kaysa sa teknikal at posibleng malabong “mga eskriba,” habang nananatili ang makasaysayang diwa.
- source_word: ἀποκτανθῆναι
  choice: patayin
  rationale: Tuwiran, natural, at mabigat na salin ng pasibong pawatas.
- source_word: μετὰ τρεῖς ἡμέρας
  choice: pagkaraan ng tatlong araw
  rationale: Pinananatili nito ang payak na kahulugan ng μετά na may akusatibo at hindi iniaayon ang pananalita ni Marcos sa “sa ikatlong araw” ng ibang talata.
- source_word: ἀναστῆναι
  choice: muling bumangon
  rationale: Pinananatili ang aktibo/intransitibong anyo ng Griyego; ang “muling” ay likas sa Tagalog para sa pagbangon mula sa kamatayan.
theological_decisions:
- issue: Pangangailangang ipinahahayag ng δεῖ sa hula tungkol sa pagdurusa
  choice: kailangang
  alternative: nararapat na / kinakailangang
  rationale: Pinananatili ang bigat ng banal na pangangailangan ngunit hindi nagdaragdag ng paliwanag hinggil sa sanhi o mekanismo nito.
- issue: Temporal na pananalitang μετὰ τρεῖς ἡμέρας
  choice: pagkaraan ng tatlong araw
  alternative: sa ikatlong araw / sa loob ng tatlong araw
  rationale: Tapat ito sa natatanging pananalita ni Marcos at umiiwas sa tahimik na paghaharmonisa sa mga kahawig na pahayag sa ibang Ebanghelyo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “matatandang pinuno” at “mga tagapagturo ng Kautusan” upang linawin sa karaniwang mambabasa ang makasaysayang mga pangkat, habang iniwasan ang denominasyonal na terminolohiya. Inilagay ang talababa sa temporal na parirala, na siyang tunay na paksa ng tala.
