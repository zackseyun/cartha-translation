  yaml_path: translation/nt/mark/008/021.yaml
  text: And he was saying to them[a], “Do you not yet understand?”
translation:
  language: tl
  text: At sinabi niya sa kanila, “Hindi pa rin ba ninyo nauunawaan?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Hindi pa ba ninyo nauunawaan?”
    reason: Ipinakikita ang natural na alternatibong salin ng οὔπω; maaaring idiin nito ang “hindi pa,” samantalang ang pangunahing teksto ay mas hayag na nagpapahiwatig ng nagpapatuloy na kawalan ng pagkaunawa.
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang payak na pag-uugnay sa naunang salaysay nang hindi nagdaragdag ng tiyak na temporal na diwa.
- source_word: ἔλεγεν
  choice: sinasabi niya
  rationale: Ang imperpektong anyo ng λέγω ay inilalarawan bilang nagpapatuloy o umuulit na pagsasalita; pinananatili ng “sinasabi niya” ang aspektong ito nang hindi tahasang nagdaragdag ng “paulit-ulit.”
- source_word: αὐτοῖς
  choice: sa kanila
  rationale: Tuwirang isinasalin ang panghalip at hindi ipinapasok sa talata ang tahasang katawagang “mga alagad,” bagaman malinaw sa konteksto ang tinutukoy.
- source_word: Οὔπω
  choice: hindi pa rin
  rationale: Likas sa makabagong Tagalog ang “hindi pa rin” sa ganitong tanong at ipinahihiwatig nitong nananatiling wala ang pagkaunawa hanggang sa sandaling iyon.
- source_word: συνίετε
  choice: ninyo nauunawaan
  rationale: Ang “nauunawaan” ay malinaw na naghahayag ng pag-iisip at pagtarok, hindi lamang pandamang pagkilala; ipinakikita ng “ninyo” na maramihan ang kausap.
theological_decisions:
- issue: Kung lalagyan ng tahasang layon ang tanong ni Jesus, gaya ng “ito”
  choice: 'Hindi nilagyan ng tahasang layon: “Hindi pa rin ba ninyo nauunawaan?”'
  alternative: “Hindi pa rin ba ninyo nauunawaan ito?”
  rationale: Walang tahasang layon sa Griyego. Ang hindi pagdaragdag ng “ito” ay nagpapanatili sa lawak at lakas ng pagsaway ni Jesus at hindi nagpapakipot sa kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang magalang at maramihang “ninyo,” at iniwasan ang pagdaragdag ng referent o layong hindi tahasang nasa Griyego.
