  text: ὃς γὰρ ⸀ἐὰν θέλῃ τὴν ⸂ψυχὴν αὐτοῦ⸃ σῶσαι ἀπολέσει αὐτήν· ὃς δ’ ἂν ⸀ἀπολέσει τὴν ⸄ψυχὴν αὐτοῦ⸅ ἕνεκεν ἐμοῦ καὶ τοῦ εὐαγγελίου ⸀σώσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/035.yaml
  text: For whoever wants to save his life will lose it[b][a], but whoever loses his life for my sake and for the gospel will save it.
translation:
  language: tl
  text: Sapagkat ang sinumang nagnanais iligtas ang kanyang buhay[a] ay mawawalan nito; ngunit ang sinumang mawalan ng kanyang buhay alang-alang sa akin at sa magandang balita ay ililigtas niya ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kaluluwa” sa buong talata; maaaring mangahulugan ang salitang Griyego ng “buhay,” “sarili,” o “kaluluwa,” ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ψυχή
  choice: buhay
  rationale: Sa konteksto ng pagsunod, ang salita ay tumutukoy sa buhay o sarili ng tao. Pinananatili ng “buhay” ang kabalintunaan ng pagliligtas at pagkawala nang hindi ito nililimitahan sa di-materyal na “kaluluwa.”
- source_word: σῶσαι / σώσει
  choice: magligtas / magliligtas
  rationale: Pinananatili ang iisang pandiwa at ang mariing pagtutunggali nito sa “mawalan,” pati ang mas malawak na diwang teolohikal ng σῴζω.
- source_word: ἀπολέσει
  choice: mawawalan
  rationale: Kapag buhay ang layon, likas sa Filipino ang “mawawalan ng buhay”; masyadong matindi ang “pupuksa,” at higit na mapagpaliwanag ang “isusuko.”
- source_word: ἕνεκεν ἐμοῦ καὶ τοῦ εὐαγγελίου
  choice: dahil sa akin at sa magandang balita
  rationale: Ipinapahayag ng ἕνεκεν ang sanhi o dahilan. Natural sa modernong Filipino ang “dahil sa” at malinaw na kapuwa si Jesus at ang magandang balita ang dahilan ng pagkawala ng buhay.
- source_word: εὐαγγέλιον
  choice: magandang balita
  rationale: Tuwirang ipinahahayag nito ang kahulugan ng εὐαγγέλιον sa ordinaryong modernong Filipino habang nananatiling angkop sa mahalagang motibo ng Marcos.
- source_word: ὃς ... ὃς
  choice: ang sinumang ... ang sinumang
  rationale: Naipahahayag nito ang pangkalahatan at bukas na bisa ng kasabihan.
- source_word: θέλῃ
  choice: nagnanais
  rationale: Malinaw na ipinapahayag ang kusang hangarin at nagpapanatili ng marangal na rehistro.
- source_word: αὐτοῦ / αὐτήν
  choice: kanyang / nito
  rationale: Ang “kanyang” ay likas na pang-isahan at hindi kinakailangang magtakda ng kasarian sa Filipino; ang “nito” ay malinaw na bumabalik sa “buhay.”
theological_decisions:
- issue: Saklaw ng ψυχή sa kabalintunaan ni Jesus
  choice: Isinaling “buhay” sa pangunahing teksto
  alternative: kaluluwa
  rationale: Ang agarang konteksto ay tungkol sa pagkakait sa sarili, pagsunod, at pagkawala ng buhay alang-alang kay Jesus at sa magandang balita. Hindi pinapaliit ng “buhay” ang salita tungo lamang sa di-materyal na bahagi ng tao; inilalahad sa talababa ang lehitimong alternatibo.
- issue: Ugnayan ng ἕνεκεν sa dalawang magkatuwang na layon
  choice: “dahil sa akin at sa magandang balita”
  alternative: “alang-alang sa akin at alang-alang sa magandang balita”
  rationale: Iisang ἕνεκεν ang namamahala sa “akin” at “magandang balita.” Ang napiling anyo ay natural at pinananatiling bukas ang diwang sanhi o motibo nang hindi inuulit nang mabigat ang parirala.
- issue: Pangkalahatang reperensiya ng panlalaking anyong Griyego
  choice: Ginamit ang likas na walang-tiyak-na-kasariang “sinuman” at “kanyang”
  alternative: Lantad na panlalaking “sinumang lalaki” at “kaniyang”
  rationale: Bagaman panlalaking pang-isahan ang anyong gramatikal sa Griyego, pangkalahatan ang bisa nito. Hindi nangangailangan ang Filipino ng pagdaragdag ng kasariang hindi tahasang bahagi ng kahulugan.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “magandang balita” sa halip na mas eklesiastikong “ebanghelyo,” at pinanatili ang simetriko at kabalintunaang ayos ng dalawang sugnay.
