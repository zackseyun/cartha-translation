  - severity: medium
    issue: Hindi likas ang “magliligtas nito.”
    rationale: Sa Filipino, ang pandiwang palayon na “ililigtas” at ang tahasang tagaganap na “niya” ang mas malinaw na paraan upang ihayag ang aktibong σώσει αὐτήν.
