  text: Καὶ ⸀ἔρχονται εἰς Βηθσαϊδάν. καὶ φέρουσιν αὐτῷ τυφλὸν καὶ παρακαλοῦσιν αὐτὸν ἵνα αὐτοῦ ἅψηται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/022.yaml
  text: And they came to Bethsaida. And they brought a blind man to him and begged him to touch him.
translation:
  language: tl
  text: Dumating sila sa Betsaida. Dinala nila sa kanya ang isang bulag na lalaki at nakiusap sa kanya na hipuin niya ang lalaki.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχονται
  choice: Dumating sila
  rationale: Ang pangkasalukuyang anyo ay historical present; ginamit ang pangnagdaan sa Tagalog upang maging natural ang pagsasalaysay habang pinananatili ang pagkakasunod-sunod ng mga pangyayari.
- source_word: εἰς Βηθσαϊδάν
  choice: sa Betsaida
  rationale: Sa pandiwang “dumating,” natural sa Tagalog ang “sa” para sa patutunguhang lugar. Isinalin sa karaniwang anyong Tagalog ang pangalan ng pook.
- source_word: φέρουσιν αὐτῷ
  choice: Dinala ng mga tao kay Jesus
  rationale: Ang historical present ay ginawang pangnagdaan. Ipinahayag ang di-tiyak na simuno bilang “mga tao,” at tinukoy si Jesus sa pangalan upang maging malinaw ang dalawang posibleng reperente ng mga panghalip sa natural na Tagalog.
- source_word: τυφλὸν
  choice: isang lalaking bulag
  rationale: Ang pang-uri ay ginamit bilang pangngalan at nasa panlalaking isahan; ang salin ay malinaw, tumpak sa kasarian, at natural sa modernong Tagalog.
- source_word: παρακαλοῦσιν
  choice: nakiusap
  rationale: Ipinahihiwatig ng pandiwa ang taimtim na pakiusap, hindi lamang karaniwang paghiling. Ang “nakiusap” ay natural at may sapat na diin nang hindi labis.
- source_word: ἵνα αὐτοῦ ἅψηται
  choice: na hipuin niya ito
  rationale: Ang ἵνα at subjunctive ay nilapatan ng natural na sugnay na nagsasaad ng nilalaman ng pakiusap. Ang “hipuin” ay angkop sa sinasadyang pagdampi sa konteksto ng pagpapagaling.
- source_word: καὶ
  choice: Dumating … Dinala
  rationale: Hindi inuulit ang “At” sa simula ng dalawang pangungusap dahil magiging mabigat sa karaniwang modernong Tagalog; pinananatili naman ng magkasunod na payak na pangungusap ang parataktikong daloy ni Marcos.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Iniwasan ang masyadong literal na pag-uulit ng “At,” gayundin ang malabong sunod-sunod na panghalip; walang idinagdag na denominasyonal o teolohikal na paliwanag.
