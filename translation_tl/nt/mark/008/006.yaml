source:
  edition: SBLGNT
  text: καὶ ⸀παραγγέλλει τῷ ὄχλῳ ἀναπεσεῖν ἐπὶ τῆς γῆς· καὶ λαβὼν τοὺς ἑπτὰ ἄρτους εὐχαριστήσας ἔκλασεν καὶ ἐδίδου τοῖς μαθηταῖς αὐτοῦ ἵνα ⸀παρατιθῶσιν καὶ παρέθηκαν τῷ ὄχλῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/006.yaml
  text: And he instructed the crowd to recline on the ground[a]. Then, taking the seven loaves, after giving thanks he broke them and kept giving them to his disciples so that they might set them before the crowd[b], and they set them before the crowd.
translation:
  language: tl
  text: At iniutos niya sa mga tao na maupo nang nakahilig sa lupa[a]. Pagkatapos, kinuha niya ang pitong tinapay, nagpasalamat, pinagputol niya ang mga ito, at patuloy niyang ibinigay sa kanyang mga alagad upang ihain nila sa mga tao[b]. At inihain nila ang mga ito sa mga tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “maupo.” Mas tiyak na ipinahihiwatig ng pandiwang Griyego ang pag-upo nang nakahilig gaya ng nakaugaliang ayos sa pagkain noon.
    reason: lexical_alternative
  - marker: b
    text: O “ilagay sa harap ng mga tao.” Sa literal, “ilagay sa harap.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγγέλλει
  choice: iniutos
  rationale: Nagsasaad ito ng may-awtoridad na tagubilin o utos. Ang kasalukuyang panahunan sa salaysay ay likas na isinalin sa nagdaang panahunan sa Filipino.
- source_word: ἀναπεσεῖν
  choice: humilig
  rationale: Tumutukoy ito sa pag-upo nang nakahilig o paghilig gaya ng karaniwang ayos sa pagkain noon, hindi lamang sa ordinaryong pag-upo.
- source_word: ἐπὶ τῆς γῆς
  choice: sa lupa
  rationale: Ang γῆ rito ay ang ibabaw ng lupang hinihigaan o hinihilingan ng mga tao.
- source_word: λαβὼν τοὺς ἑπτὰ ἄρτους
  choice: kinuha niya ang pitong tinapay
  rationale: Likas sa Filipino ang 'tinapay' bilang pangmaramihang pangngalang di-binibilang; malinaw na pito ang mga piraso o buo dahil sa bilang.
- source_word: εὐχαριστήσας
  choice: nagpasalamat
  rationale: Pinananatili ang tahasang sinabi ng Griyego nang hindi nagdaragdag ng hindi binanggit na layon ng pasasalamat.
- source_word: ἔκλασεν
  choice: pinagputol-putol ang mga iyon
  rationale: Ang ipinahihiwatig na layon ay ang pitong tinapay. Ang anyo ay natural sa konteksto ng paghahati ng pagkain para ipamahagi.
- source_word: ἐδίδου
  choice: patuloy na ibinigay
  rationale: Ipinahahayag ng imperfect ang nagpapatuloy o paulit-ulit na pagbibigay sa mga alagad.
- source_word: ἵνα παρατιθῶσιν
  choice: upang ihain nila sa mga tao
  rationale: Ang παρατίθημι ay literal na paglalagay ng pagkain sa harap ng iba; ang 'ihain' ang natural na katumbas nito sa Filipino.
- source_word: παρέθηκαν
  choice: inihain nga nila ang mga iyon sa mga tao
  rationale: Pinananatili ang kaugnayan sa naunang παρατιθῶσιν at ipinakikita ng 'nga' na isinagawa ng mga alagad ang layuning ipinahayag.
- source_word: ὄχλος
  choice: mga tao
  rationale: Sa kontekstong ito, natural at malinaw sa modernong Filipino ang kolektibong 'mga tao' para sa nagkakatipong karamihan.
theological_decisions:
- issue: Ayos ng salaysay at posibleng alingawngaw ng Eukaristiya
  choice: Isinalin ang εὐχαριστήσας bilang 'nagpasalamat' nang walang terminong sakramental.
  alternative: Nagpasalamat sa Diyos, o gumamit ng katawagang tahasang Eukaristiko.
  rationale: Karaniwang wika ng pagkain ang ginamit sa talata at hindi tahasang pinangalanan ang Diyos bilang layon. Pinananatili ng salin ang posibleng alingawngaw nang hindi nagdaragdag ng doktrinang hindi tahasang sinasabi.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'humilig' upang mapanatili ang sinaunang ayos sa pagkain, na nilinaw sa talababa; ginamit ang natural na 'ihain' sa pangunahing teksto habang inilagay sa talababa ang mas literal na larawan.
