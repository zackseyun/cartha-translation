revisions:
- from: At iniutos niya sa mga tao na humilig sa lupa[a]. Pagkatapos, kinuha niya ang pitong tinapay, nagpasalamat, pinagputol-putol ang mga iyon, at patuloy na ibinigay sa kanyang mga alagad upang ihain nila sa mga tao[b]. At inihain nga nila ang mga iyon sa mga tao.
  to: At iniutos niya sa mga tao na maupo nang nakahilig sa lupa[a]. Pagkatapos, kinuha niya ang pitong tinapay, nagpasalamat, pinagputol niya ang mga ito, at patuloy niyang ibinigay sa kanyang mga alagad upang ihain nila sa mga tao[b]. At inihain nila ang mga ito sa mga tao.
  rationale: Inayos ang salitang para sa ἀναπεσεῖν upang malinaw na maipakita ang pag-upo nang nakahilig sa pagkain. Pinasimple ang katumbas ng ἔκλασεν upang hindi magdagdag ng antas ng pagpira-piraso, at inayos ang parirala para sa imperfect ἐδίδου. Pinanatili ang “ihain” bilang likas na pangunahing salin ng παρατίθημι at ang literal na alternatibo sa talababa.
