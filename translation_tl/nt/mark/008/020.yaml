id: MRK.8.20
reference: Mark 8:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτε ⸀καὶ τοὺς ἑπτὰ εἰς τοὺς τετρακισχιλίους, πόσων σπυρίδων πληρώματα κλασμάτων ἤρατε; ⸂καὶ λέγουσιν αὐτῷ⸃· Ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/020.yaml
  text: And when the seven were for the four thousand[a], how many large baskets full of broken pieces did you pick up? They said to him, “Seven.”
translation:
  language: tl
  text: At nang ang pitong tinapay naman ay para sa apat na libo, ilang malalaking basket[a] na puno ng mga piraso ang napulot ninyo? Sinabi nila sa kanya, “Pito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego na σπυρίς ay tumutukoy sa isang malaking basket, na naiiba sa tawag sa mas maliit na basket na ginamit sa Marcos 8:19.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε καὶ
  choice: At nang … naman
  rationale: Pinananatili ng “At nang” ang pang-ugnay at panahong diwa, samantalang likas na ipinahihiwatig ng “naman” na ito ang ikalawang pangyayaring inihahambing ni Jesus sa nauna.
- source_word: τοὺς ἑπτὰ
  choice: ang pitong tinapay
  rationale: Bagaman eliptikal na “ang pito” ang Griyego, malinaw na tumutukoy ito sa pitong tinapay sa Marcos 8:5–6. Idinagdag ang “tinapay” upang maging malinaw at natural sa Tagalog nang hindi binabago ang tinutukoy.
- source_word: εἰς τοὺς τετρακισχιλίους
  choice: para sa apat na libo
  rationale: Ipinahahayag nito ang kaugnayan ng pitong tinapay sa apat na libong pinakain, sa maikli at likas na Tagalog.
- source_word: πόσων σπυρίδων
  choice: ilang malalaking basket
  rationale: Ang σπυρίς ay malaking basket at naiiba sa κόφινος na ginamit sa Marcos 8:19; pinananatili ng “malalaking basket” ang mahalagang pagkakaibang ito.
- source_word: πληρώματα κλασμάτων
  choice: na puno ng mga piraso
  rationale: Natural nitong ipinahahayag sa Tagalog na ang mga basket ay punô ng mga natirang piraso. Hindi idinagdag sa pariralang ito ang “tinapay” sapagkat hindi iyon tahasang inuulit sa Griyego.
- source_word: ἤρατε
  choice: ang napulot ninyo
  rationale: Sa konteksto, tumutukoy ang pandiwa sa pagtipon o pagpulot ng mga natirang piraso.
- source_word: καὶ λέγουσιν αὐτῷ
  choice: Sinabi nila sa kanya
  rationale: Isinalin ang makasaysayang pangkasalukuyan bilang pangnagdaan upang maging natural ang salaysay sa modernong Tagalog.
- source_word: Ἑπτά
  choice: Pito
  rationale: Tuwirang sagot na bilang sa tanong ni Jesus.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural. Ginamit ang karaniwang salitang “basket” dahil mas madaling maunawaan ito kaysa sa di-karaniwan o rehiyonal na mga katawagan; ipinaliwanag sa talababa ang tiyak na laki at leksikal na pagkakaiba.
