  text: καὶ αὐτὸς ⸂ἐπηρώτα αὐτούς⸃· Ὑμεῖς δὲ τίνα με λέγετε εἶναι; ⸀ἀποκριθεὶς ὁ Πέτρος λέγει αὐτῷ· Σὺ εἶ ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/029.yaml
  text: And he was asking them[a], “But who do you say that I am?” Peter answered him, “You are the Messiah.”
translation:
  language: tl
  text: At patuloy niya silang tinatanong, “Ngunit kayo, sino ang sinasabi ninyong ako ay?” Sumagot sa kanya si Pedro, “Ikaw ang Mesiyas.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang Cristo.”
    reason: Alternatibong tradisyonal na salin ng titulong Griyego na χριστός.
lexical_decisions:
- source_word: ἐπηρώτα
  choice: patuloy niya silang tinatanong
  rationale: Ipinahahayag ng imperpektong anyo ang nagpapatuloy na pagtatanong sa tagpong pasalaysay; natural itong naipapakita sa Filipino sa pamamagitan ng “patuloy” at aspektong di-ganap.
- source_word: Ὑμεῖς δὲ
  choice: Ngunit kayo
  rationale: Hayag at mariin ang panghalip na Ὑμεῖς, samantalang ipinakikita ng δέ ang paghahambing sa sinabi ng ibang tao sa naunang konteksto.
- source_word: τίνα με λέγετε εἶναι
  choice: sino ang sinasabi ninyong ako
  rationale: Pinananatili nito ang tanong tungkol sa pagkakakilanlan ni Jesus at ang diwa ng λέγετε, habang isinasalin ang Griyegong accusative-plus-infinitive sa maikli at nauunawaang Filipino.
- source_word: ἀποκριθεὶς ... λέγει αὐτῷ
  choice: Sumagot sa kanya
  rationale: Pinagsasama nito nang natural ang panimulang participle at makasaysayang pangkasalukuyan bilang isang kilos ng pagsagot sa salaysay.
- source_word: Σὺ εἶ
  choice: Ikaw ang
  rationale: Napananatili ng hayag na “Ikaw” ang diin ng Griyegong panghalip nang hindi nagdaragdag ng labis na pagpapatingkad.
- source_word: ὁ χριστός
  choice: ang Mesiyas
  rationale: Dito, ang χριστός ay isang titulo—ang Pinahiran—at hindi personal na pangalan. Ipinahahayag ng “Mesiyas” ang kontekstong Judio ng pahayag ni Pedro.
theological_decisions:
- issue: Pagsasalin sa χριστός bilang titulo
  choice: ang Mesiyas
  alternative: ang Cristo
  rationale: Ginagamit ang χριστός bilang tiyak na titulong mesiyaniko. Pinananatili sa talababa ang tradisyonal na “Cristo” bilang kinikilalang alternatibong katawagan nang hindi ginagawang personal na pangalan ang titulo sa pangunahing teksto.
translation_notes:
  register: Makabago, tuwiran, at marangal na Filipino. Ginamit ang “kayo” upang mapanatili ang kaibahan at diin, at “Mesiyas” bilang nauunawaang titulo sa kontekstong Judio.
