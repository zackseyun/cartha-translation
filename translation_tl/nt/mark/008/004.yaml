  text: And his disciples answered him[a], “From where will anyone be able to satisfy these people with bread here in a desolate place?”
translation:
  language: tl
  text: Sumagot sa kanya ang kanyang mga alagad, “Saan makakakuha ang sinuman ng tinapay upang mabusog ang mga taong ito dito sa ilang?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Paano makapagpapakain ang sinuman ng mga taong ito ng tinapay dito sa ilang?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: Sumagot
  rationale: Karaniwang pandiwang pasalaysay para sa pagtugon; tuwiran at natural sa modernong Tagalog.
- source_word: ὅτι
  choice: panimulang panipi
  rationale: Ipinakikilala nito ang tuwirang sinabi; mas natural sa Tagalog na katawanin ito ng bantas kaysa isalin bilang “na.”
- source_word: Πόθεν
  choice: Saan makakakuha
  rationale: Pinananatili ang tanong tungkol sa pinagmumulan ng panustos, habang gumagamit ng likas na pariralang Tagalog.
- source_word: τούτους
  choice: ang mga taong ito
  rationale: Nililinaw na ang panghalip ay tumutukoy sa mga tao sa karamihan nang hindi nililimitahan sa mga lalaki.
- source_word: δυνήσεταί τις
  choice: ang sinuman
  rationale: Inihahatid ang di-tiyak na paksa at, kasama ng “makakakuha,” ang ideya ng kakayahang makapaglaan.
- source_word: ὧδε
  choice: rito
  rationale: Maikli at likas na katumbas ng panandang panlunan na “dito.”
- source_word: χορτάσαι
  choice: na sapat para mabusog
  rationale: Pinananatili ang diwa ng pagpapakain hanggang sa kasiyahan o pagkabusog, hindi lamang simpleng pagbibigay ng pagkain.
- source_word: ἄρτων
  choice: ng tinapay
  rationale: Tuwirang katumbas ng tinutukoy na pagkain; hindi pinalalawak sa pangkalahatang “pagkain” o nililimitahan sa bilang ng mga piraso.
- source_word: ἐπ’ ἐρημίας
  choice: sa isang ilang na lugar
  rationale: Inihahatid ang isang liblib at walang panustos na pook sa natural at dignified na Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignified, at madaling maunawaan. Ang “Saan makakakuha” ay pinili upang mapanatili ang Πόθεν bilang tanong sa pinagmumulan, samantalang ang talababa ay nagbibigay ng mas idyomatikong alternatibong “Paano.”
