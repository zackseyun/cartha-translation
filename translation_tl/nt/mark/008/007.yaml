  yaml_path: translation/nt/mark/008/007.yaml
  text: And they had a few small fish[a]; and after blessing them[b], he said to set these also before them.
translation:
  language: tl
  text: Mayroon din silang ilang maliliit na isda. Matapos basbasan ang mga iyon, sinabi niyang ihain din ang mga ito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰχθύδια ὀλίγα
  choice: ilang maliliit na isda
  rationale: Pinananatili ng “maliliit na isda” ang diwang diminutibo ng ἰχθύδια, at likas na ipinahahayag ng “ilang” ang limitadong bilang na tinutukoy ng ὀλίγα.
- source_word: εὐλογήσας αὐτά
  choice: matapos basbasan ang mga iyon
  rationale: Ipinakikita ng “matapos” na nauna ang kilos ng aorist participle, habang ang “basbasan” ay mas tuwirang katumbas ng εὐλογέω kaysa sa “magpasalamat.” Malinaw na tumutukoy ang “mga iyon” sa maliliit na isda.
- source_word: εἶπεν
  choice: sinabi niyang
  rationale: Pinananatili nito ang karaniwang kahulugan ng λέγω na “sabihin” nang hindi dinaragdagan ng tahasang layon na hindi nakasaad sa Griyego.
- source_word: καὶ ταῦτα παρατιθέναι
  choice: ihain din ang mga ito
  rationale: Sa konteksto ng pagkain, natural na ipinahahayag ng “ihain” ang παρατιθέναι, at pinananatili ng “din ang mga ito” ang pandagdag na diin ng καὶ ταῦτα. Ang anyong “sinabi niyang ihain” ay naghahatid ng diwa ng utos sa di-tahasang tagaganap nang hindi ito pinapangalanan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “basbasan” upang manatiling malapit sa εὐλογέω at ang “ihain” upang maging natural sa konteksto ng pamamahagi ng pagkain.
