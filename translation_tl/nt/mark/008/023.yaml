  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐπιλαβόμενος τῆς χειρὸς τοῦ τυφλοῦ ⸀ἐξήνεγκεν αὐτὸν ἔξω τῆς κώμης, καὶ πτύσας εἰς τὰ ὄμματα αὐτοῦ, ἐπιθεὶς τὰς χεῖρας αὐτῷ, ἐπηρώτα αὐτόν· Εἴ τι ⸀βλέπεις;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/023.yaml
  text: And taking the blind man by the hand[a], he led him out of the village; and after spitting on his eyes and laying his hands on him, he asked him, “Do you see anything?”
translation:
  language: tl
  text: Hinawakan niya ang kamay ng bulag na lalaki at inakay niya ito palabas ng nayon. Matapos dumura sa mga mata ng lalaki[a] at ipatong ang kanyang mga kamay sa kanya, tinanong niya ito, “May nakikita ka ba?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “dumura sa loob ng mga mata niya.”
    reason: Ipinahihiwatig ng εἰς ang mas matingkad na direksiyong “papasok sa”; mas natural sa Tagalog ang “dumura sa mga mata” sa pangunahing teksto.
lexical_decisions:
- source_word: ἐπιλαβόμενος τῆς χειρὸς
  choice: Hinawakan niya sa kamay
  rationale: Likas sa modernong Tagalog ang pariralang ito at malinaw na pinananatili ang kongkretong kilos ng paghawak sa kamay.
- source_word: τοῦ τυφλοῦ
  choice: ang lalaking bulag
  rationale: Substantibo ang gamit ng τυφλός at panlalaki ang tinutukoy. Mas natural at magalang sa kasalukuyang Filipino ang “lalaking bulag” kaysa “ang bulag.”
- source_word: ἐξήνεγκεν αὐτὸν
  choice: inakay
  rationale: Bagaman maaaring mangahulugang “inilabas” ang pandiwa, ipinahihiwatig ng paghawak sa kamay na inakay niya ang lalaki; natural itong paglalarawan nang hindi dinaragdagan ang pangyayari.
- source_word: ἔξω τῆς κώμης
  choice: palabas ng nayon
  rationale: Ang κώμη ay maliit na pamayanan o nayon, at ang “palabas” ay nagpapanatili sa direksiyon ng pagkilos.
- source_word: πτύσας εἰς τὰ ὄμματα αὐτοῦ
  choice: Matapos niyang dumura sa mga mata nito
  rationale: Ipinapahayag ng “matapos” ang naunang kilos ng aorist participle. Natural sa Tagalog ang “dumura sa mga mata,” habang inilalagay sa talababa ang mas tahasang direksiyonal na pagbasa ng εἰς.
- source_word: ἐπιθεὶς τὰς χεῖρας αὐτῷ
  choice: ipatong dito ang kanyang mga kamay
  rationale: Pinananatili nito ang pisikal na paghipo nang hindi ipinapalagay na isa itong pormal o ritwal na pagpapatong ng kamay.
- source_word: ἐπηρώτα αὐτόν
  choice: tinanong niya ito
  rationale: Ang payak na naganap na anyo ay natural sa salaysay sa Tagalog; hindi kailangang piliting ipakita ang aspektong imperpektibo bilang paulit-ulit na pagtatanong.
- source_word: Εἴ τι βλέπεις;
  choice: May nakikita ka ba?
  rationale: Ito ang pinakanatural na tuwirang tanong sa Tagalog at pinananatili ang di-tiyak na τι nang hindi ipinapalagay kung ano o gaano karami ang nakikita.
theological_decisions:
- issue: Pagpapanatili sa pisikal na detalye ng pagpapagaling
  choice: Tahasang isinalaysay ang pagdura sa mga mata at pagpapatong ng mga kamay.
  alternative: Palambutin o ibuod ang mga kilos bilang pangkalahatang paghipo o pagpapagaling.
  rationale: Mahalaga sa salaysay ang kongkreto at kapansin-pansing pagkakasunod-sunod ng mga kilos; hindi ito dapat pakinisin o alisin dahil lamang sa pagiging di-karaniwan nito sa makabagong mambabasa.
- issue: Posibleng ritwal na kahulugan ng pagpapatong ng mga kamay
  choice: Isinalin bilang karaniwang pisikal na pagpapatong ng mga kamay sa lalaki.
  alternative: Gumamit ng pananalitang nagpapahiwatig ng pormal na ritwal, ordinasyon, o sakramento.
  rationale: Sa konteksto, inilalarawan ng parirala ang paghipo ni Jesus kaugnay ng pagpapagaling. Walang sapat na batayan sa talata upang magdagdag ng mas huling kahulugang eklesiyastiko.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling basahin. Ginamit ang “lalaking bulag” bilang natural at magalang na pagtukoy sa tao, at pinanatili ang tuwiran at pisikal na katangian ng salaysay.
