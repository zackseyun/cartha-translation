  register: Gumamit ng natural, kasalukuyan, at marangal na Filipino. Pinanatili ang tuwirang pananalita ni Jesus at ang kasalukuyang diwa ng kanyang habag; walang idinagdag na denominasyonal o paliwanag na teolohikal.
