id: MRK.8.2
reference: Mark 8:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Σπλαγχνίζομαι ἐπὶ τὸν ὄχλον ὅτι ἤδη ἡμέραι τρεῖς προσμένουσίν μοι καὶ οὐκ ἔχουσιν τί φάγωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/002.yaml
  text: I have compassion on the crowd, because they have already remained with me for three days and have nothing to eat.
translation:
  language: tl
  text: Nahahabag ako sa mga tao, sapagkat tatlong araw na silang nananatiling kasama ko at wala silang makain.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σπλαγχνίζομαι
  choice: Nahahabag ako
  rationale: Ipinahahayag ng pandiwa ang matindi at taos-pusong habag. Pinananatili ng aspektong nagaganap sa “nahahabag” ang kasalukuyang puwersa ng anyong Griyego nang hindi nagdaragdag ng paliwanag.
- source_word: ἐπὶ τὸν ὄχλον
  choice: sa mga tao
  rationale: Ang pariralang ito ang tumutukoy sa mga taong kinahabagan. Mas natural sa modernong Tagalog ang “sa mga tao” kaysa sa literal at matigas na “sa karamihan,” habang nananatiling malinaw na isang nagkakatipong pangkat ang tinutukoy.
- source_word: ὅτι
  choice: sapagkat
  rationale: Ipinakikilala ng ὅτι ang dahilan ng habag ni Jesus. Ang “sapagkat” ay malinaw, marangal, at angkop sa daloy ng pangungusap.
- source_word: ἤδη ἡμέραι τρεῖς
  choice: tatlong araw na
  rationale: Likas sa Tagalog ang hulaping “na” upang ipahayag na umabot na sa tatlong araw ang tagal ng kanilang pananatili.
- source_word: προσμένουσίν μοι
  choice: nananatiling kasama ko
  rationale: Ipinakikita ng προσμένω ang patuloy na pananatili sa piling ng isang tao. Ang “nananatiling kasama ko” ay nagpapanatili sa diwa ng pagpapatuloy at sa ugnayang ipinahahayag ng datibong μοι.
- source_word: οὐκ ἔχουσιν τί φάγωσιν
  choice: wala silang makain
  rationale: Ito ang natural at tumpak na idyomang Tagalog para sa kawalan nila ng anumang pagkaing maaari nilang kainin.
