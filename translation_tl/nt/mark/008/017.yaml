  text: καὶ ⸀γνοὺς λέγει αὐτοῖς· Τί διαλογίζεσθε ὅτι ἄρτους οὐκ ἔχετε; οὔπω νοεῖτε οὐδὲ συνίετε; ⸀πεπωρωμένην ἔχετε τὴν καρδίαν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/017.yaml
  text: And knowing[a], he says to them[c][b], “Why are you discussing that you have no bread? Do you not yet perceive or understand? Do you have your heart hardened?”
translation:
  language: tl
  text: At nang malaman niya ito, sinabi niya sa kanila, “Bakit ninyo pinag-uusapan ang kawalan ninyo ng tinapay? Hindi pa ba ninyo natatanto o nauunawaan? Matigas ba ang puso ninyo?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνοὺς
  choice: nang malaman niya ito
  rationale: Ipinahahayag ng aorist participle ang pagkaalam ni Jesus sa pinag-uusapan ng mga alagad; ang “ito” ay likas na ipinahihiwatig ng konteksto sa Tagalog.
- source_word: διαλογίζεσθε
  choice: pinag-uusapan
  rationale: Ang anyo ay tumutukoy sa pag-uusap o pagtatalo-talo nila sa isa't isa; malinaw at natural dito ang “pinag-uusapan.”
- source_word: ἄρτους
  choice: tinapay
  rationale: Bagaman pangmaramihan ang Griyego, maaaring gamitin sa Tagalog ang “tinapay” bilang pangkalahatang tawag nang hindi nawawala ang diwa ng kakulangan nila.
- source_word: νοεῖτε
  choice: natatanto
  rationale: Ipinahihiwatig nito ang pagkilala o pagkapansin ng isip; pinananatili ng “natatanto” ang kaibhan nito sa kasunod na συνίετε.
- source_word: συνίετε
  choice: nauunawaan
  rationale: Tuwirang ipinahahayag nito ang pag-unawa o pagkuha sa kahulugan ng pangyayari.
- source_word: πεπωρωμένην
  choice: matigas
  rationale: Ang perfect passive participle ay naglalarawan ng umiiral na kalagayan ng pagiging matigas o hindi tumutugon; natural sa Tagalog ang “matigas ang puso.”
- source_word: καρδίαν
  choice: puso
  rationale: Pinananatili ang metapora ng Griyego para sa panloob na pagkatao, kabilang ang pag-unawa at pagtugon.
theological_decisions:
- issue: Anyo ng huling tanong tungkol sa kalagayan ng mga alagad
  choice: Matigas ba ang puso ninyo?
  alternative: Taglay ba ninyo ang pusong pinatigas?
  rationale: Natural sa Tagalog ang panaguring “matigas ang puso” at tumpak nitong ipinahahayag ang umiiral na kalagayan sa ἔχετε + object + perfect passive participle. Hindi nito tinutukoy kung sino ang nagpatigas, kaya napapanatili ang kawalang-tiyak ng Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang magalang na pangmaramihang “ninyo” at pinanatili ang matalim na sunod-sunod na mga tanong ni Jesus nang hindi nagdaragdag ng “pa rin,” na wala sa huling sugnay ng Griyego.
