  yaml_path: translation/nt/mark/008/003.yaml
  text: And if I send them away hungry to their homes[a], they will collapse on the way, and some of them have come from far away.
translation:
  language: tl
  text: At kung pauuwiin ko silang gutom, manghihina sila sa daan; at ang ilan sa kanila ay nanggaling pa sa malayo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπολύσω
  choice: pauuwiin ko
  rationale: Sa konteksto ng pagpapakain sa maraming tao, tumutukoy ito sa pagpapaalis sa kanila upang umuwi; natural at malinaw sa Filipino ang “pauuwiin ko.”
- source_word: νήστεις
  choice: gutom
  rationale: Bagaman maaari itong literal na mangahulugang nag-aayuno o walang kain, inilalarawan dito ang kalagayan nilang walang nakain, hindi isang relihiyosong pag-aayuno.
- source_word: εἰς οἶκον αὐτῶν
  choice: pauuwiin
  rationale: Ang patutunguhang kani-kaniyang tahanan ay likas nang ipinahihiwatig ng pandiwang Filipino na “pauuwiin,” kaya naiiwasan ang mabigat na pag-uulit.
- source_word: ἐκλυθήσονται
  choice: baka manghina sila at bumagsak
  rationale: Ipinahahayag ng pandiwa ang panghihina o pagkaubos ng lakas na maaaring humantong sa pagbagsak. Pinananatili ng “baka” ang diwang kondisyonal ng magiging bunga kapag pinauwi silang gutom.
- source_word: ἐν τῇ ὁδῷ
  choice: sa daan
  rationale: Karaniwan at tuwirang katumbas ito para sa pangyayari habang naglalakbay.
- source_word: καί τινες αὐτῶν
  choice: at ang ilan sa kanila
  rationale: Pinananatili nito ang koordinasyong καί at malinaw na tumutukoy sa isang bahagi ng karamihan.
- source_word: ἀπὸ μακρόθεν
  choice: galing pa sa malayo
  rationale: Natural na Filipino ito para sa malayong pinanggalingan; idinidiin ng “pa” ang layo ng kanilang nilakbay.
- source_word: ἥκασιν
  choice: galing
  rationale: Sa pariralang “galing pa sa malayo,” natural na naipapahayag ang kasalukuyang kalagayan nila bilang mga taong dumating mula sa malayo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na simple ngunit marangal. Ginamit ang “pauuwiin” sa halip na mas pormal na “paaalisin patungo sa kanilang mga tahanan,” at pinalawak nang bahagya ang ἐκλυθήσονται bilang “manghina … at bumagsak” upang malinaw na maipakita ang saklaw ng pandiwa nang hindi gawing tiyak ang aktuwal na pagkawala ng malay.
