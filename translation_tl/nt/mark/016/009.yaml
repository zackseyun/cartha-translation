  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⟦Ἀναστὰς δὲ πρωῒ πρώτῃ σαββάτου ἐφάνη πρῶτον Μαρίᾳ τῇ Μαγδαληνῇ, ⸀παρ’ ἧς ἐκβεβλήκει ἑπτὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/009.yaml
  text: After he had risen[a], early on the first day of the week, he appeared first to Mary Magdalene, from whom he had cast out seven demons.
translation:
  language: tl
  text: Pagkatapos niyang muling mabuhay[a], maaga sa unang araw ng linggo, una siyang nagpakita kay Maria Magdalena, na pinalayasan niya noon ng pitong demonyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wala ang mga talatang 9–20 sa ilang sinaunang manuskrito ng Marcos; kasama naman ang mga ito sa ibang manuskrito, kung minsan ay may mga pagkakaiba.
    reason: textual_variant
lexical_decisions:
- source_word: Ἀναστὰς
  choice: Pagkabuhay niya
  rationale: Ang aorist participle ay temporal kaugnay ng pangunahing pandiwang ἐφάνη. Likas sa Tagalog ang “Pagkabuhay niya” at ipinahihiwatig nitong nauna ang muling pagkabuhay sa pagpapakita.
- source_word: δὲ
  choice: hindi tahasang isinalin
  rationale: Mahinang pang-ugnay ang δέ. Hindi kailangan ang hiwalay na “ngayon,” “ngunit,” o “at” dito sapagkat magiging mas natural sa Tagalog ang tuwirang pagsisimula sa temporal na parirala.
- source_word: πρωῒ
  choice: maaga
  rationale: Tumutukoy ito sa maagang bahagi ng umaga; sapat at natural sa konteksto ang “maaga.”
- source_word: πρώτῃ σαββάτου
  choice: sa unang araw ng linggo
  rationale: Ito ang karaniwang idyomatikong kahulugan ng parirala sa Koine na gamit Hudyo at Kristiyano.
- source_word: ἐφάνη
  choice: nagpakita
  rationale: Sa mga salaysay ng pagpapakita matapos ang muling pagkabuhay, ang anyong ito ay likas na isinasaling “nagpakita,” sa halip na mas literal ngunit di-likas na “nakita.”
- source_word: πρῶτον
  choice: una
  rationale: Nagsasaad ito ng pagkakasunod-sunod ng mga pagpapakita.
- source_word: Μαρίᾳ τῇ Μαγδαληνῇ
  choice: kay Maria Magdalena
  rationale: Ginamit ang nakaugaliang modernong anyo ng pangalan sa Filipino; ang datibo ay tumutukoy sa taong pinagpakitaan.
- source_word: παρ’ ἧς
  choice: na … ng
  rationale: 'Isinama ang kaugnayan sa natural na hulma ng Tagalog: “na pinalayas niya noon ng pitong demonyo,” na pinananatiling si Maria ang taong pinanggalingan ng mga demonyo.'
- source_word: ἐκβεβλήκει
  choice: pinalayas niya noon
  rationale: Ang pluperfect ay nagsasaad ng gawaing naganap bago ang pagpapakita. Ipinakikita ng “noon” ang naunang panahon, at ang “pinalayas” ay malinaw sa konteksto ng pagpapalayas ng demonyo.
- source_word: ἑπτὰ δαιμόνια
  choice: pitong demonyo
  rationale: Tuwirang pinananatili ang bilang at ang tiyak na katawagang ginagamit sa mga salaysay ng pagpapalayas ng demonyo.
theological_decisions:
- issue: Kalagayang tekstuwal ng Marcos 16:9 bilang bahagi ng mas mahabang wakas
  choice: Isinalin ang talata ayon sa ibinigay na tekstong SBLGNT at nilagyan ng talababa tungkol sa pinagtatalunang katayuan nito.
  alternative: Nagtatapos sa Marcos 16:8 ang ilang sinaunang manuskrito at wala sa mga ito ang 16:9–20; kasama naman ang mga talatang ito sa ibang manuskrito, kung minsan ay may mga pagkakaiba.
  rationale: Kasama ngunit nakabraket ang talata sa ibinigay na tekstong Griyego. Pinananatili ng salin ang talata at inilalahad sa talababa ang mahalagang ebidensiyang tekstuwal nang hindi nagpapasya para sa mambabasa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinili ang likas na ayos ng pangungusap at iniwasan ang di-kailangang pang-ugnay sa simula. Ang “Pagkabuhay niya” ay tumutukoy sa muling pagkabuhay sa konteksto nang hindi nagdaragdag ng paliwanag na wala sa mismong parirala.
