  - severity: low
    issue: Hindi pinakanatural ang “bukana” para sa pasukan ng libingan.
    rationale: Ang “bungad” ay mas karaniwang modernong Filipino sa ganitong pisikal na konteksto at nananatiling katumbas ng θύρα bilang entrance/opening.
