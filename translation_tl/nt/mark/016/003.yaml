translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang ‘sinasabi’ upang mapanatili ang nagpapatuloy na aspekto, at ang ‘bukana’ bilang madaling maunawaang paglalarawan sa bungad ng libingan. Inilagay ang talababa sa salitang tinutukoy nitong leksikal na alternatibo.
