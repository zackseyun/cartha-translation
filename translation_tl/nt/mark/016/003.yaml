  yaml_path: translation/nt/mark/016/003.yaml
  text: And they were saying to one another[a], “Who will roll away the stone for us from the entrance of the tomb?”
translation:
  language: tl
  text: At sinasabi nila sa isa’t isa, “Sino ang magpapagulong ng bato palayo sa bungad[a] ng libingan para sa atin?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: sinasabi nila
  rationale: Pinananatili ng aspektong di-ganap ng pandiwa ang diwang nagpapatuloy o nauulit ang kanilang pag-uusap, sa halip na isang minsanang sinabi lamang.
- source_word: πρὸς ἑαυτάς
  choice: sa isa’t isa
  rationale: 'Bagaman literal na tumutukoy sa kanilang mga sarili, katumbasan ang diwa sa konteksto: nag-uusap ang mga babae sa isa’t isa.'
- source_word: Τίς
  choice: Sino
  rationale: Ito ang natural at tuwirang katumbas ng panghalip na pananong tungkol sa taong gagawa ng kilos.
- source_word: ἀποκυλίσει
  choice: magpapagulong
  rationale: Ipinahihiwatig ng pandiwa ang pag-aalis sa bato sa pamamagitan ng paggulong, kaya pinananatili ang kongkretong larawan sa salaysay.
- source_word: ἡμῖν
  choice: para sa atin
  rationale: Ang datibo ay nagpapahayag na gagawin ang kilos alang-alang sa kanila o para sa kanilang kapakinabangan.
- source_word: τὸν λίθον
  choice: ang bato
  rationale: Hindi idinagdag ang ‘malaki’ sapagkat, bagaman ipinahihiwatig ng konteksto ang laki nito, wala ang pang-uring iyon sa talatang ito.
- source_word: ἐκ τῆς θύρας
  choice: mula sa bukana
  rationale: Sa konteksto ng libingan, mas malinaw at natural ang ‘bukana’ kaysa ‘pinto,’ habang pinananatili ang ideya ng pasukan o bungad na hinaharangan ng bato.
- source_word: τοῦ μνημείου
  choice: ng libingan
  rationale: Tumutukoy rito ang salita sa isang libingang inukit o puntod; ‘libingan’ ang malinaw at karaniwang katumbas sa modernong Filipino.
