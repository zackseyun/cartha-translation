source:
  edition: SBLGNT
  text: ἀλλὰ ὑπάγετε εἴπατε τοῖς μαθηταῖς αὐτοῦ καὶ τῷ Πέτρῳ ὅτι Προάγει ὑμᾶς εἰς τὴν Γαλιλαίαν· ἐκεῖ αὐτὸν ὄψεσθε, καθὼς εἶπεν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/007.yaml
  text: But go[a], tell his disciples and Peter, ‘He is going ahead of you into Galilee. There you will see him[b], just as he told you.’
translation:
  language: tl
  text: Ngunit humayo kayo at sabihin ninyo sa mga alagad niya at kay Pedro[a], “Nauuna siya sa inyo patungong Galilea.[b] Doon ninyo siya makikita, gaya ng sinabi niya sa inyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bukod na binanggit si Pedro sa “mga alagad niya.” Maaaring ipinahihiwatig nito ang pagpapanumbalik kay Pedro matapos niyang ikaila si Jesus, ngunit hindi tahasang sinasabi ng Griyego na “lalo na si Pedro.”
    reason: alternative_reading
  - marker: b
    text: Maaari ring “papasok sa Galilea.” Sa kontekstong ito, ang pang-ukol sa Griyego ay maaaring tumukoy sa pagpunta sa Galilea o sa pagpasok doon.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ngunit
  rationale: Ipinakikita ang mariing pagsalungat o paglipat tungo sa iniutos na pagkilos.
- source_word: ὑπάγετε
  choice: humayo kayo
  rationale: Likas at marangal na pautos sa maramihan na nagpapahayag ng agarang pag-alis at pagpunta.
- source_word: εἴπατε
  choice: sabihin
  rationale: Ang pandiwa ay pautos at tumutukoy sa pagpaparating ng mensahe sa mga tatanggap na kasunod.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: sa mga alagad niya
  rationale: Malinaw at natural na ipinahahayag ang pag-aari nang hindi binabago ang tinutukoy.
- source_word: καὶ τῷ Πέτρῳ
  choice: at kay Pedro
  rationale: Pinananatili ang payak na pag-uugnay at ang hiwalay na pagbanggit kay Pedro; hindi idinaragdag ang interpretatibong “lalo na.”
- source_word: ὅτι
  choice: tuwirang sipi ng mensahe
  rationale: Likas sa Filipino ang ilahad bilang tuwirang sinabi ang nilalaman ng mensaheng ipinag-uutos na iparating.
- source_word: Προάγει ὑμᾶς
  choice: Nauuna siya sa inyo
  rationale: Pinananatili ang diwa ng naunang pagpunta ni Jesus kaysa sa mga alagad, sa payak at kasalukuyang Filipino.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: papunta sa Galilea
  rationale: Natural na katumbas ng direksiyon tungo sa Galilea habang kinikilalang maaari ring idiin ng εἰς ang pagpasok doon.
- source_word: ἐκεῖ
  choice: Doon
  rationale: Tuwirang tumutukoy sa Galilea bilang lugar.
- source_word: αὐτὸν ὄψεσθε
  choice: ninyo siya makikita
  rationale: Tuwiran at natural na salin ng panghinaharap na pagkakita sa kanya.
- source_word: καθὼς εἶπεν ὑμῖν
  choice: gaya ng sinabi niya sa inyo
  rationale: Pinananatili ang pagkakatugma sa naunang sinabi ni Jesus nang hindi nagdaragdag ng paliwanag.
theological_decisions:
- issue: Hiwalay na pagbanggit kay Pedro pagkatapos ng “mga alagad niya”
  choice: “sa mga alagad niya at kay Pedro”
  alternative: “sa mga alagad niya, lalo na kay Pedro” o “sa mga alagad niya—kabilang si Pedro”
  rationale: Tahasang bukod na binabanggit ng Griyego si Pedro, ngunit hindi nito tahasang sinasabing “lalo na” o “kabilang.” Pinananatili ng salin ang posibleng kahalagahang naratibo at pastoral nang hindi ito ipinapakahulugan sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “humayo” bilang maikli at dignified na pautos, at pinanatiling payak ang hiwalay na pagbanggit kay Pedro. Ang mga panipi ay nagpapalinaw sa nilalaman ng mensaheng ipararating.
