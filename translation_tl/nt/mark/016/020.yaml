  text: ἐκεῖνοι δὲ ἐξελθόντες ἐκήρυξαν πανταχοῦ, τοῦ κυρίου συνεργοῦντος καὶ τὸν λόγον βεβαιοῦντος διὰ τῶν ἐπακολουθούντων ⸀σημείων.⟧
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/020.yaml
  text: And they went out and proclaimed everywhere[b][a], while the Lord worked with them and confirmed the message through the accompanying signs.
translation:
  language: tl
  text: At humayo sila at nangaral sa lahat ng dako, habang nakikipagtulungan sa kanila ang Panginoon at pinagtitibay ang mensahe[a] sa pamamagitan ng mga tandang sumusunod.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “salita.” Ang Griyegong λόγος ay maaaring mangahulugang “salita,” ngunit dito ay tumutukoy sa mensaheng ipinangaral.
    reason: lexical_alternative
  - marker: b
    text: O “sa pamamagitan ng mga kasunod na tanda” o “sa pamamagitan ng mga tandang kaakibat.” Hindi tahasang sinasabi ng Griyego kung ang mga tanda ay sumunod o sumabay sa mensahe, sa mga tagapangaral, o sa kanilang pangangaral.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνοι δὲ
  choice: At sila
  rationale: Ipinagpapatuloy ng δέ ang salaysay, at ang ἐκεῖνοι ay tumutukoy sa naunang binanggit na pangkat; natural sa Tagalog ang “At sila.”
- source_word: ἐξελθόντες
  choice: humayo
  rationale: Ipinahahayag ang paglabas at pagpunta nila upang tuparin ang gawain; ang “humayo” ay maikli, natural, at marangal.
- source_word: ἐκήρυξαν πανταχοῦ
  choice: nangaral sa lahat ng dako
  rationale: Ang κηρύσσω ay pampublikong pagpapahayag. Karaniwan at malinaw sa kontekstong ito ang “nangaral,” samantalang tapat ang “sa lahat ng dako” sa πανταχοῦ.
- source_word: τοῦ κυρίου συνεργοῦντος
  choice: habang gumagawang kasama nila ang Panginoon
  rationale: Pinananatili ang kasabay na kilos at ang diwa ng συνεργέω na pakikipaggawa, nang hindi dinaragdagan kung paano ginawa ng Panginoon ang gawaing iyon.
- source_word: τὸν λόγον
  choice: ang mensahe
  rationale: Sa konteksto, ang λόγος ay ang ipinahahayag na mensahe, hindi isang indibiduwal na salita. Inilalagay sa talababa ang literal at tradisyonal na alternatibong “salita.”
- source_word: βεβαιοῦντος
  choice: pinagtitibay
  rationale: Ipinahahayag ng βεβαιόω ang pagkumpirma o pagpapatunay sa mensaheng ipinangaral.
- source_word: διὰ τῶν ἐπακολουθούντων σημείων
  choice: sa pamamagitan ng mga tandang kalakip nito
  rationale: Ang διά ay nagsasaad ng kasangkapan, at ang ἐπακολουθούντων ay maaaring magpahiwatig ng pagsunod o pagsama. Ang “kalakip nito” ay natural ngunit ang posibleng literal na ugnayan ay pinananatili sa talababa.
theological_decisions:
- issue: Tinutukoy ng “Panginoon”
  choice: Pinanatili ang titulong “Panginoon,” na sa agarang konteksto ay tumutukoy kay Jesus.
  alternative: Maaaring unawain ang “Panginoon” bilang Diyos sa mas pangkalahatang diwa.
  rationale: Sa Marcos 16:19, si Jesus ang tinawag na Panginoon; gayunman, hindi pinalitan ng pangalan ang titulo upang manatiling tapat sa teksto.
- issue: Gampanin ng mga tanda
  choice: Ang mga tanda ang kasangkapang ginamit sa pagpapatibay sa mensahe.
  alternative: Ang mga tanda ay sumunod lamang sa mga tagapangaral, nang hindi binibigyang-diin ang pagpapatunay.
  rationale: Tahasan ng sintaks na inuugnay ang “pinagtitibay ang mensahe” sa “sa pamamagitan ng mga tanda,” ngunit walang idinaragdag na pahayag tungkol sa tagal o pagiging pamantayan ng gayong mga tanda.
- issue: Ugnayan ng “mga tandang sumusunod/kalakip”
  choice: Isinaling “mga tandang kalakip nito,” na iniuugnay sa mensahe ayon sa daloy ng pangungusap.
  alternative: “mga tandang sumunod” o “mga kasunod na tanda,” na hindi tahasang tumutukoy kung kanino o saan sumunod ang mga tanda.
  rationale: Walang hayag na panghalip na “nito” sa Griyego, kaya itinatala sa talababa ang mas pormal at tunay na malabong alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “nangaral” bilang likas na katumbas ng pampublikong pagpapahayag, at pinanatili sa mga talababa ang leksikal at sintaktikong kalabuan ng λόγος at ἐπακολουθούντων.
