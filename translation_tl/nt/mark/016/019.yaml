  text: Ὁ μὲν οὖν κύριος ⸀Ἰησοῦς μετὰ τὸ λαλῆσαι αὐτοῖς ἀνελήμφθη εἰς τὸν οὐρανὸν καὶ ἐκάθισεν ἐκ δεξιῶν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/019.yaml
  text: So then, the Lord Jesus, after speaking to them, was taken up into heaven and sat down at the right hand of God.
translation:
  language: tl
  text: Kaya nga, matapos magsalita ang Panginoong Jesus sa kanila, iniakyat siya sa langit at umupo sa kanan ng Diyos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὲν οὖν
  choice: Kaya nga
  rationale: Ipinahihiwatig ng tambalang partikula ang pagpapatuloy at pagbubuod na may bahagyang inferensiyal na diwa. Likas sa modernong Tagalog ang “Kaya nga” at hindi nito labis na pinatitindi ang ugnayan.
- source_word: κύριος Ἰησοῦς
  choice: ang Panginoong Jesus
  rationale: Pinananatili ng “Panginoon” ang karaniwang bigat ng titulong κύριος, at natural sa Tagalog ang anyong pang-ugnay na “Panginoong Jesus.”
- source_word: μετὰ τὸ λαλῆσαι αὐτοῖς
  choice: matapos magsalita sa kanila
  rationale: Ang μετά kasama ng articular infinitive ay nagsasaad ng panahong kasunod. Maikli, malinaw, at tapat sa pagkakasunod-sunod ang salin.
- source_word: ἀνελήμφθη
  choice: iniakyat siya
  rationale: 'Ang aorist passive ay pinananatiling balintiyak sa kahulugan: si Jesus ang iniakyat, nang hindi tinutukoy kung sino ang kumilos. Ang “siya” ay kailangan sa natural at malinaw na Tagalog.'
- source_word: εἰς τὸν οὐρανόν
  choice: sa langit
  rationale: Bagaman may diwang patungo ang εἰς, ang “iniakyat sa langit” ang likas na pariralang Tagalog at malinaw na nagsasaad ng hantungan.
- source_word: ἐκάθισεν
  choice: umupo
  rationale: Ang “umupo” ay natural na katumbas ng kilos ng pag-upo at angkop sa marangal ngunit payak na rehistro.
- source_word: ἐκ δεξιῶν τοῦ θεοῦ
  choice: sa kanan ng Diyos
  rationale: Idyoma ang ἐκ δεξιῶν para sa kinalalagyan sa kanang panig. Ang “sa kanan ng Diyos” ay malinaw at tradisyonal na saling Tagalog nang hindi isinasalin nang literal ang ἐκ bilang “mula sa.”
theological_decisions:
- issue: Paglalarawan sa pag-akyat at pagkadakila ni Jesus nang walang dagdag na doktrinal na paliwanag
  choice: iniakyat siya sa langit at umupo sa kanan ng Diyos
  alternative: tinanggap siya sa langit at lumuklok sa kanan ng Diyos
  rationale: Pinananatili ng napiling salin ang balintiyak na ἀνελήμφθη at ang tuwirang kilos ng ἐκάθισεν. Hindi nito tinutukoy ang gumagawa sa pag-akyat at hindi rin nito dinaragdagan ang idyoma ng paliwanag tungkol sa paghahari.
- issue: Pagpapanatili sa κύριος bilang titulong kristolohikal
  choice: ang Panginoong Jesus
  alternative: ang Gurong Jesus
  rationale: Ang “Panginoon” ang pamantayan at may sapat na bigat para sa κύριος; hindi nito pinapaliit ang titulo tungo sa isang panlipunan o panturong katawagan lamang.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinili ang maikling ayos ng pangungusap at iniwasan ang lipas o sobrang teknikal na pananalita.
