  yaml_path: translation/nt/mark/016/013.yaml
  text: And they went away and reported it to the rest[a], but they did not believe them either.
translation:
  language: tl
  text: Umalis sila at ibinalita nila ito sa iba,[a] ngunit hindi rin sila pinaniwalaan ng mga ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa mga natitira.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖνοι
  choice: sila ... naman
  rationale: Ang tambalang anyo ay may diwang “at ang mga iyon” o “sila rin.” Likas sa salaysay na Filipino ang “sila ... naman,” at hindi nito idinaragdag sa mismong teksto ang salitang “dalawa” o “mga lalaki.”
- source_word: ἀπελθόντες
  choice: umalis
  rationale: Ipinahihiwatig ng aorist participle na nauna ang kanilang pag-alis bago ang pag-uulat. Naipapahayag ito nang natural sa Filipino sa pagkakasunod ng mga pandiwa.
- source_word: ἀπήγγειλαν
  choice: ibinalita iyon
  rationale: Ang ἀπαγγέλλω ay nangangahulugang mag-ulat o magbalita. Ang “iyon” ay likas na ipinapalit sa bagay na hindi tahasang binanggit sa Griyego ngunit malinaw mula sa konteksto.
- source_word: τοῖς λοιποῖς
  choice: sa iba pa
  rationale: Tumutukoy ang λοιπός sa iba o sa mga natitira sa pangkat. Ang “iba pa” ay malinaw at natural sa modernong Filipino; inilagay sa talababa ang mas literal na alternatibo.
- source_word: οὐδὲ
  choice: ngunit hindi rin
  rationale: Pinananatili ng “hindi rin” ang dagdag na diwang hindi rin naniwala ang pangkat na ito, habang ipinahahayag ng “ngunit” ang pagsalungat sa iniulat na pangyayari.
- source_word: ἐκείνοις
  choice: sa kanila
  rationale: Ang panghalip na ito ay tumutukoy sa mga nagbalita. Natural ang “sa kanila” bilang layon ng “naniwala.”
- source_word: ἐπίστευσαν
  choice: naniwala
  rationale: Sa kontekstong ito, ang πιστεύω ay pagtanggap o hindi pagtanggap sa patotoong iniulat, kaya mas angkop ang “naniwala” kaysa “nagtiwala.”
theological_decisions:
- issue: Kahulugan ng πιστεύω sa konteksto ng salaysay at patotoo
  choice: hindi naniwala
  alternative: hindi nagtiwala
  rationale: Ang tinutukoy ay hindi pagtanggap sa ulat ng mga nagsalita, hindi pangunahing personal na pagtitiwala o isang teknikal na pahayag tungkol sa pananampalataya.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mga panghalip ng Griyego sa halip na tahasang idagdag sa pangunahing teksto ang “ang dalawa” o “mga lalaki”; nilinaw lamang ang mga tinutukoy sa pamamagitan ng ayos ng pangungusap.
