  text: καὶ ἀναβλέψασαι θεωροῦσιν ὅτι ⸀ἀποκεκύλισται ὁ λίθος, ἦν γὰρ μέγας σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/004.yaml
  text: And looking up[a], they saw that the stone had been rolled away, for it was extremely large.
translation:
  language: tl
  text: At nang tumingala sila, nakita nilang naigulong na ang bato, sapagkat napakalaki nito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβλέψασαι
  choice: nang tumingala sila
  rationale: Likas na Filipino para sa aorist participle na naglalarawang itinaas ng mga babae ang kanilang tingin bago nila nakita ang kalagayan ng bato.
- source_word: θεωροῦσιν
  choice: nakita nila
  rationale: Sa kontekstong pasalaysay, malinaw at natural nitong ipinahahayag ang aktuwal na pagkakita; hindi kailangan ang mas pormal na “namasdan.”
- source_word: ὅτι
  choice: -ng
  rationale: Ang pang-angkop sa “nakita nilang” ay natural na nagpapakilala sa nilalaman ng kanilang nakita, katumbas ng ὅτι.
- source_word: ἀποκεκύλισται
  choice: naigulong na
  rationale: 'Pinananatili ng “na” ang resultang kalagayan ng Greek perfect passive: naigulong na ang bato at nanatili itong wala sa takip ng libingan nang makita nila.'
- source_word: ὁ λίθος
  choice: ang bato
  rationale: Tuwirang salin na sapat ang linaw mula sa konteksto, nang hindi idinaragdag ang salitang “panakip” na hindi hayag sa Griyego.
- source_word: ἦν γὰρ μέγας σφόδρα
  choice: sapagkat napakalaki nito
  rationale: Ang “sapagkat” ay nagpapanatili sa paliwanag na bisa ng γάρ, at ang “napakalaki” ay natural na matinding katumbas ng μέγας σφόδρα.
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang payak na pang-ugnay at tuloy-tuloy na daloy ng salaysay.
theological_decisions: []
