base_translation:
  language: en
  yaml_path: translation/nt/mark/016/017.yaml
  text: 'And these signs will accompany those who have believed: in my name they will cast out demons[b][a]; they will speak in new tongues.'
translation:
  language: tl
  text: 'Sasamahan[b] ng mga tandang ito ang mga sumampalataya: sa pangalan ko, magpapalayas sila ng mga demonyo; magsasalita sila ng mga bagong wika.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga bagong dila.” Maaaring tumukoy ang salitang Griyego sa mga wika o mga dila; hindi tinutukoy rito ang eksaktong katangian ng mga ito.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “susunod.” Ang pandiwang Griyego ay maaari ring mangahulugang sasama o magiging kaakibat.
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖα
  choice: mga tanda
  rationale: Pinananatili ng “mga tanda” ang diwang nagpapatunay ng σημεῖα at hindi ito pinalalawak tungo sa pangkalahatang “mga himala.”
- source_word: τοῖς πιστεύσασιν
  choice: mga sumampalataya
  rationale: Ipinahihiwatig ng anyong “sumampalataya” ang pagpasok sa pananampalataya, habang nananatiling pangkalahatan ang pagtukoy sa mga taong iyon.
- source_word: ταῦτα
  choice: ito
  rationale: Tuwirang demonstratibo ito na tumutukoy sa mga tandang kasunod na ililista.
- source_word: παρακολουθήσει
  choice: sasama
  rationale: Likas sa modernong Tagalog ang “sasama” at ipinakikitang kaakibat ng mga sumampalataya ang mga tanda, hindi lamang na darating ang mga ito pagkatapos nila.
- source_word: ἐν τῷ ὀνόματί μου
  choice: sa pangalan ko
  rationale: Karaniwan at malinaw na pahayag ito para sa pagkilos sa ilalim ng awtoridad ni Jesus.
- source_word: δαιμόνια
  choice: mga demonyo
  rationale: Tuwiran nitong isinasalin ang δαιμόνια nang hindi ipinapalit ang kaugnay ngunit naiibang katawagang “masasamang espiritu.”
- source_word: ἐκβαλοῦσιν
  choice: magpapalayas sila
  rationale: Malinaw na ipinahahayag ng “magpapalayas” ang sapilitang pagpapaalis na nasa pandiwang Griyego at natural ito sa konteksto ng pagpapalayas ng mga demonyo.
- source_word: γλώσσαις
  choice: mga wika
  rationale: Maaaring tumukoy ang γλῶσσα sa dila, wika, o uri ng pananalita. Ang “mga wika” ay likas sa Tagalog at hindi tiyak na nagpapasya kung kilalang mga lengguwahe o ibang uri ng pananalita ang tinutukoy.
- source_word: λαλήσουσιν
  choice: magsasalita sila
  rationale: Ang “magsasalita” ang tuwiran at marangal na katumbas ng karaniwang pandiwang λαλέω.
- source_word: καιναῖς
  choice: bagong
  rationale: Tuwirang pinananatili ng “bagong” ang diwa ng καινός nang hindi tinutukoy kung paano o para kanino bago ang mga wika.
theological_decisions:
- issue: Kahulugan ng γλώσσαις sa “magsasalita sila sa mga bagong wika”
  choice: Panatilihin ang “mga wika” nang hindi tinutukoy ang eksaktong uri ng pananalita.
  alternative: Mga kilalang lengguwahe o ekstatikong pananalita
  rationale: Hindi tiyak na inilalarawan ng talata ang kababalaghan. Iniiwasan ng salin ang pagpasok ng isang denominasyonal na pagpapakahulugan.
- issue: Ugnayan ng mga tanda sa mga sumampalataya
  choice: “sasama”
  alternative: “susunod”
  rationale: Ipinakikita ng παρακολουθήσει na kaakibat o kalakip ng mga sumampalataya ang mga tanda; hindi nito kailangang ipahiwatig ang simpleng pagkakasunod-sunod sa panahon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang karaniwang bokabularyong “mga tanda,” “sumampalataya,” at “magpapalayas,” habang iniwasan ang sobrang teknikal o denominasyonal na pananalita.
