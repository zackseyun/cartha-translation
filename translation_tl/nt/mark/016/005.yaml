  text: καὶ εἰσελθοῦσαι εἰς τὸ μνημεῖον εἶδον νεανίσκον καθήμενον ἐν τοῖς δεξιοῖς περιβεβλημένον στολὴν λευκήν, καὶ ἐξεθαμβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/005.yaml
  text: And when they entered the tomb, they saw a young man sitting on the right, clothed in a white robe, and they were alarmed.
translation:
  language: tl
  text: Pagpasok nila sa libingan, nakita nila ang isang binata[a] na nakaupo sa gawing kanan at nakasuot ng puting damit. At labis silang nagulat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “anghel.” Inilalarawan siya rito ni Marcos bilang “isang binata,” bagaman ipinahihiwatig ng mas malawak na konteksto at ng mga kaagapay na salaysay na isa siyang anghelikong mensahero.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσελθοῦσαι
  choice: Pagpasok nila
  rationale: Ipinahahayag ang aorist participle na pambabae at maramihan bilang kilos na nauna sa pangunahing pandiwang “nakita,” sa natural at maikling Tagalog.
- source_word: μνημεῖον
  choice: libingan
  rationale: Karaniwan at malinaw na tawag sa pinaglibingan sa konteksto ng muling pagkabuhay.
- source_word: νεανίσκον
  choice: isang binata
  rationale: Tuwirang inilalarawan ng Griyego ang isang batang lalaki o kabataang lalaki; hindi tahasang tinatawag na anghel sa talatang ito.
- source_word: καθήμενον ἐν τοῖς δεξιοῖς
  choice: nakaupo sa gawing kanan
  rationale: Natural na Tagalog para sa postura at lokasyong ipinahahayag ng parirala.
- source_word: περιβεβλημένον στολὴν λευκήν
  choice: nakasuot ng puting damit
  rationale: Ang perfect participle ay naglalarawan sa kaniyang kasalukuyang kasuutan; ang “damit” ay malinaw at hindi labis na tiyak para sa στολή, isang mahaba o natatanging kasuutan.
- source_word: ἐξεθαμβήθησαν
  choice: labis silang nagulat
  rationale: Ipinapakita ang matinding pagkabigla o pagkagulat, na higit sa payak na sorpresa ngunit hindi awtomatikong ginagawang ganap na takot.
theological_decisions:
- issue: Pagkakakilanlan ng νεανίσκος
  choice: “binata” sa pangunahing teksto
  alternative: “anghel”
  rationale: Ang mismong salaysay ni Marcos ay gumagamit ng salitang nangangahulugang binata. Bagaman ipinahihiwatig ng puting kasuutan, konteksto, at mga kaagapay na salaysay na siya ay isang anghelikong mensahero, pinananatili ng pangunahing teksto ang paglalarawan ni Marcos.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Pinanatili ang maikling takbo ng salaysay at ang hindi tahasang pagkakakilanlan sa binata bilang anghel.
