  yaml_path: translation/nt/mark/016/011.yaml
  text: And they[a], when they heard that he was alive and had been seen by her[b], did not believe.
translation:
  language: tl
  text: At nang marinig nilang buhay siya[a] at nakita siya ng babaeng iyon,[b] hindi sila naniwala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “siya ay buhay” o “nabubuhay siya.” Nasa panahunang pangkasalukuyan ang pandiwang Griyego.
    reason: lexical_alternative
  - marker: b
    text: O, “Siya ay nakita ng babaeng iyon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖνοι
  choice: At ... sila
  rationale: Pinagsasama ng κἀκεῖνοι ang pang-ugnay na καί at ang panghalip na ἐκεῖνοι. Ipinagpapatuloy nito ang salaysay at tumutukoy sa pangkat na nabanggit sa naunang talata.
- source_word: ἀκούσαντες
  choice: nang marinig nila
  rationale: Ang aorist participle ay ginamit nang temporal; natural na ipinahahayag sa modernong Tagalog sa pamamagitan ng “nang marinig nila.”
- source_word: ὅτι ζῇ
  choice: buhay siya
  rationale: Ipinapakilala ng ὅτι ang nilalaman ng kanilang narinig, at ang present-tense na ζῇ ay nagsasabing siya ay buhay. Ang “buhay siya” ay tuwiran at natural sa Tagalog.
- source_word: ἐθεάθη ὑπ’ αὐτῆς
  choice: nakita siya nito
  rationale: Ang aorist passive na ἐθεάθη ay nangangahulugang nakita siya, at ang ὑπ’ αὐτῆς ay tumutukoy sa babaeng nabanggit sa naunang konteksto. Ginawang aktibo ang ayos para maging natural sa Tagalog nang hindi ginagawang “nagpakita,” na maaaring magdagdag ng di-kinakailangang diwa.
- source_word: ἠπίστησαν
  choice: hindi sila naniwala
  rationale: Tuwiran at likas na katumbas ito ng kabiguang maniwala sa ulat, nang hindi idinaragdag na tahasan silang tumangging maniwala.
theological_decisions:
- issue: Pagpapahayag na buhay si Jesus matapos ang muling pagkabuhay
  choice: buhay siya
  alternative: nabubuhay siya
  rationale: Pinananatili ng “buhay siya” ang kasalukuyan at patuloy na kalagayang ipinahahayag ng ζῇ, habang natural itong pakinggan sa Tagalog. Inilalagay sa talababa ang mas lantad na anyong pandiwa upang mapanatili ang aspektong makikita sa Griyego.
- issue: Pagkakita kay Jesus ng babae
  choice: nakita siya nito
  alternative: siya ay nakita nito
  rationale: Pinananatili ang pananaw ng Griyegong passive—si Jesus ang nakita—ngunit inaayos bilang aktibong sugnay para sa natural na Tagalog. Hindi piniling “nagpakita siya” sapagkat maaari nitong ilipat ang diin sa kusang pagpapakita.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “nito” upang mapanatili ang panghalip na tumutukoy sa babaeng nasa naunang konteksto, sa halip na idagdag ang pangalang Maria sa mismong talata.
