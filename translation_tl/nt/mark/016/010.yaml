- from: Pumunta siya at ibinalita ito sa mga nakasama ni Jesus, na noon ay nagdadalamhati at umiiyak.
  to: Nagpunta siya at ibinalita niya ito sa mga nakasama ni Jesus, na nagdadalamhati at umiiyak.
  rationale: Pinalitan ang “ibinalita ito” ng “ibinalita niya ito” upang tahasang maipahayag ang aktibong pagkilos ni Maria Magdalena sa Griyego. Inalis ang “noon ay” dahil ang pang-uring sugnay na “na nagdadalamhati at umiiyak” ay sapat nang naghahayag ng kasabay na kalagayan at mas tuwiran sa Filipino.
