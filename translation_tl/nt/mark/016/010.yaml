  yaml_path: translation/nt/mark/016/010.yaml
  text: She went and reported it to those who had been with him[a], who were mourning and weeping.
translation:
  language: tl
  text: Nagpunta siya at ibinalita niya ito sa mga nakasama ni Jesus, na nagdadalamhati at umiiyak.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκείνη
  choice: siya
  rationale: Tumutukoy ang demonstratibo kay Maria Magdalena sa naunang talata; likas sa modernong Tagalog ang panghalip na “siya” kaysa sa literal na “ang babaing iyon.”
- source_word: πορευθεῖσα
  choice: Pumunta siya
  rationale: Ipinahihiwatig ng aorist participle ang pagkilos na nauna sa pangunahing pandiwa. Ang “Pumunta siya at…” ay natural na naghahayag ng pagkakasunod ng mga kilos.
- source_word: ἀπήγγειλεν
  choice: ibinalita ito
  rationale: Ang ἀπαγγέλλω ay nangangahulugang mag-ulat o magbalita. Ang “ito” ay likas na ipinuno mula sa konteksto at tumutukoy sa pagpapakita ni Jesus na muling nabuhay.
- source_word: τοῖς μετ’ αὐτοῦ γενομένοις
  choice: sa mga nakasama ni Jesus
  rationale: Malinaw na tinutukoy ang mga dating kasama ni Jesus. Ginamit ang pangalang “Jesus” sa halip na “niya” upang maiwasang mapagkamalang si Maria ang tinutukoy ng panghalip.
- source_word: πενθοῦσι καὶ κλαίουσιν
  choice: na noon ay nagdadalamhati at umiiyak
  rationale: Ang dalawang present participle ay naglalarawan sa kalagayan ng mga taong pinuntahan niya. Pinananatili ng salin ang magkaugnay ngunit magkahiwalay na diwa ng pagdadalamhati at pag-iyak.
