  text: Καὶ διαγενομένου τοῦ σαββάτου ⸀Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ⸂ἡ τοῦ⸃ Ἰακώβου καὶ Σαλώμη ἠγόρασαν ἀρώματα ἵνα ἐλθοῦσαι ἀλείψωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/001.yaml
  text: And when the Sabbath was over[a], Mary Magdalene, Mary the mother of James, and Salome bought spices so that they might come and anoint him.
translation:
  language: tl
  text: Nang matapos ang Sabbath, bumili sina Maria Magdalena, Maria na ina ni Santiago,[a] at Salome ng mga pabango upang pumunta at pahiran siya ng mga pabango.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, literal na “Maria, ang kay Santiago”; kinikilala si Maria ayon sa kaugnayan niya kay Santiago. Hindi tahasang sinasabi ang uri ng kaugnayan, ngunit karaniwang nauunawaan na siya ang ina nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαγενομένου τοῦ σαββάτου
  choice: Nang matapos ang Sabbath
  rationale: Ang genitive absolute ay nagsasaad ng panahong nauna sa pangunahing kilos. Natural sa modernong Tagalog ang pariralang ito at malinaw nitong ipinapakitang tapos na ang Sabbath.
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: Maria Magdalena
  rationale: Ito ang kinagawiang anyo ng pangalan at katawagan sa Tagalog at madaling makilala ng mga mambabasa.
- source_word: Μαρία ἡ τοῦ Ἰακώβου
  choice: Maria na ina ni Santiago
  rationale: Ang Griyego ay literal na tumutukoy kay Maria sa pamamagitan ng kaugnayan niya kay Santiago ngunit hindi tahasang binabanggit ang uri ng kaugnayan. Ang 'ina ni Santiago' ang natural at kontekstuwal na pagbasa, habang itinatala sa talababa ang tunay na elipsis.
- source_word: Σαλώμη
  choice: Salome
  rationale: Ito ang karaniwang transliterasyon ng pangalang ito sa Tagalog.
- source_word: ἠγόρασαν
  choice: bumili
  rationale: Payak at natural itong katumbas ng aorist na pandiwang nagsasalaysay.
- source_word: ἀρώματα
  choice: mga pabango
  rationale: Tumutukoy ito sa mababangong sangkap na ginagamit sa paghahanda sa bangkay. Mas natural sa Tagalog ang 'mga pabango' kaysa sa literal ngunit maaaring malabong 'mga espesya'.
- source_word: ἵνα ἐλθοῦσαι ἀλείψωσιν αὐτόν
  choice: upang pumunta at pahiran siya
  rationale: Ipinahahayag ng ἵνα ang layunin, at ang participle ay nagsasaad ng pagpunta bago ang pagpapahid. Pinananatili ng salin ang pagkakasunod ng mga kilos sa natural na Tagalog.
- source_word: ἀλείψωσιν
  choice: pahiran
  rationale: Tuwiran nitong inilalarawan ang paglalagay o pagpapahid ng mabangong sangkap sa katawan at hindi nito dinaragdagan ang teksto ng mas malawak na paliwanag.
theological_decisions:
- issue: Ang kaugnayang ipinahihiwatig sa Μαρία ἡ τοῦ Ἰακώβου
  choice: Maria na ina ni Santiago
  alternative: Maria na kaugnay ni Santiago / Maria ni Santiago
  rationale: Hindi tahasang sinasabi ng eliptikong Griyego ang 'ina,' ngunit ito ang pinakanatural na pagkakakilanlan ayon sa gamit sa salaysay ng Ebanghelyo. Dahil may tunay na gramatikal na kalabuan, inilalahad ito sa talababa sa halip na ikubli.
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Ginamit ang 'Sabbath' bilang kinikilalang terminong biblikal, 'mga pabango' para sa mga mabangong sangkap sa paglilibing, at 'pahiran' upang mapanatili ang kongkretong kilos nang hindi nagdaragdag ng interpretasyon.
