  text: Μετὰ δὲ ταῦτα δυσὶν ἐξ αὐτῶν περιπατοῦσιν ἐφανερώθη ἐν ἑτέρᾳ μορφῇ πορευομένοις εἰς ἀγρόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/012.yaml
  text: After these things[b][a], he appeared in a different form to two of them as they were walking on their way into the countryside.
translation:
  language: tl
  text: Pagkatapos nito, nagpakita siya sa ibang anyo sa dalawa sa kanila habang naglalakad sila patungo sa kanayunan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “patungo sa bukid.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: Pagkatapos nito
  rationale: Natural na Filipino ito para sa temporal na pagkakasunod na ipinahihiwatig ng μετά at sa pagpapatuloy ng salaysay na minamarkahan ng δέ.
- source_word: δυσὶν ἐξ αὐτῶν
  choice: sa dalawa sa kanila
  rationale: Malinaw at likas na ipinahihiwatig na ang dalawang tumanggap ng pagpapakita ay kabilang sa mas malaking pangkat.
- source_word: περιπατοῦσιν
  choice: habang naglalakad sila
  rationale: Ipinakikita ng kasalukuyang participle ang kilos na nagpapatuloy kasabay ng pagpapakita.
- source_word: ἐφανερώθη
  choice: nagpakita siya
  rationale: Sa konteksto ng pagpapakita matapos ang muling pagkabuhay, ito ang malinaw at natural na katumbas ng passive na ἐφανερώθη.
- source_word: ἐν ἑτέρᾳ μορφῇ
  choice: sa ibang anyo
  rationale: Pinananatili nito ang tahasang ideya ng pagkakaiba sa μορφή nang hindi ipinapaliwanag kung paano o sa anong paraan ito naiiba.
- source_word: πορευομένοις εἰς ἀγρόν
  choice: patungo sa bukid
  rationale: Iniiwasan nito ang di-likas na pag-uulit ng ‘naglalakad’ at ‘pumupunta,’ habang pinananatili ang layunin at patutunguhan ng kanilang paglalakbay. Maaaring tumukoy ang ἀγρός sa bukid o mas malawak na kanayunan, kaya inilalahad sa talababa ang alternatibo.
theological_decisions:
- issue: Ang kalikasan ng pagpapakita ni Jesus na inilalarawan ng ἐν ἑτέρᾳ μορφῇ
  choice: sa ibang anyo
  alternative: may ibang hitsura
  rationale: Sinasabi ng talata na nagpakita siya sa ibang anyo ngunit hindi nililinaw kung ito ay pagbabago sa panlabas na hitsura, sa pagkilala ng mga nakakita, o sa iba pang paraan. Pinananatili ng salin ang hindi paglilinaw ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural, maikli, at marangal. Ginamit ang “sa ibang anyo” upang mapanatili ang lapit sa Griyego at ang teolohikal na hindi paglilinaw nito; ginamit ang “bukid” sa pangunahing teksto bilang karaniwang katumbas ng ἀγρός, kalakip ang mas malawak na kahulugan sa talababa.
