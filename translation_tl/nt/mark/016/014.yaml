id: MRK.16.14
reference: Mark 16:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ὕστερον ⸀δὲ ἀνακειμένοις αὐτοῖς τοῖς ἕνδεκα ἐφανερώθη, καὶ ὠνείδισεν τὴν ἀπιστίαν αὐτῶν καὶ σκληροκαρδίαν ὅτι τοῖς θεασαμένοις αὐτὸν ⸀ἐγηγερμένον οὐκ ἐπίστευσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/014.yaml
  text: Later[a], he appeared to the eleven themselves as they were reclining at the table, and he rebuked their unbelief and hardness of heart[c][b], because they had not believed those who had seen him after he had been raised.
translation:
  language: tl
  text: Pagkaraan nito[a], nagpakita siya sa labing-isa habang nakahilig sila sa hapag[b]. Sinaway niya ang kawalan nila ng pananampalataya at ang katigasan ng kanilang puso, sapagkat hindi nila pinaniwalaan ang mga nakakita sa kanya matapos siyang ibinangon mula sa mga patay[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Pagkatapos.”
    reason: lexical_alternative
  - marker: b
    text: Ang “nakahilig sa hapag” ay tumutukoy sa nakaugaliang pustura noon habang kumakain.
    reason: cultural_note
  - marker: c
    text: 'O “ang mga nakakita sa kanya na nabuhay nang muli.” Mas literal sa Griyego: “ang mga nakakita sa kanya na naibangon.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὕστερον
  choice: Pagkaraan nito
  rationale: Likas na panandang temporal sa modernong Filipino na malinaw na tumutukoy sa sumunod na pagpapakita; hindi nito dinaragdagan ang tiyak na haba ng panahong lumipas.
- source_word: ἀνακειμένοις
  choice: habang nakahilig sila sa hapag
  rationale: Ipinahahayag ang nakaugaliang pustura sa pagkain noong panahong iyon at nililinaw sa makabagong mambabasa na nasa hapag sila.
- source_word: τοῖς ἕνδεκα
  choice: sa labing-isa
  rationale: Tuwirang tumutukoy sa pangkat ng mga alagad matapos mawala si Judas; sapat na sa Filipino ang pariralang ito nang hindi pilit na isinasalin nang hiwalay ang αὐτοῖς.
- source_word: ἐφανερώθη
  choice: nagpakita siya
  rationale: Ito ang natural at tumpak na Filipino para sa konteksto ng pagpapakita ni Jesus matapos ang pagkabuhay na muli.
- source_word: ὠνείδισεν
  choice: Sinaway niya
  rationale: Nagpapahayag ng matinding pagpuna o pagsaway ngunit nananatiling malinaw at dignified sa kasalukuyang gamit.
- source_word: ἀπιστίαν
  choice: kawalan nila ng pananampalataya
  rationale: Pinananatili ang puwersa ng pangngalan at, sa kasunod na sugnay, malinaw na tumutukoy sa hindi nila paniniwala sa patotoo.
- source_word: σκληροκαρδίαν
  choice: katigasan ng kanilang puso
  rationale: Pinananatili ang biblikal na metapora ng pusong lumalaban o ayaw tumanggap, sa halip na paliitin ito sa simpleng katigasan ng ulo.
- source_word: θεασαμένοις
  choice: sa mga nakakita
  rationale: Payak at tumpak na tumutukoy sa mga mismong nakasaksi kay Jesus.
- source_word: ἐγηγερμένον
  choice: matapos siyang muling buhayin
  rationale: Pinananatili ang perpektong pasibong diwa ng Griyego at ang resultang kalagayan ng muling pagkabuhay, nang hindi tahasang pinapangalanan ang gumagawa.
- source_word: οὐκ ἐπίστευσαν
  choice: hindi sila naniwala
  rationale: Natural na Filipino para sa pagtanggi nilang paniwalaan ang naunang patotoo; naipahihiwatig ng konteksto na nangyari ito bago ang pagpapakitang isinasalaysay.
theological_decisions:
- issue: Pasibong anyo ng ἐγηγερμένον sa pahayag tungkol sa muling pagkabuhay
  choice: matapos siyang muling buhayin
  alternative: nakakita sa kanyang muling nabuhay
  rationale: Pinananatili ng salin ang pasibong anyo ng pinagmulan at hindi ipinapalit ang aktibong/intransitibong pagbasa, habang iniiwan ding di-binanggit ang gumagawa gaya ng Griyego.
- issue: Metapora ng σκληροκαρδία
  choice: katigasan ng kanilang puso
  alternative: katigasan ng ulo
  rationale: Nananatili ang mahalagang metaporang biblikal tungkol sa panloob na pagtutol at hindi ito nililimitahan sa karaniwang ideya lamang ng pagiging matigas ang ulo.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “hapag” upang maipakita ang konteksto ng pagkain nang hindi maging labis na paliwanag, at pinanatili ang biblikal na metaporang “katigasan ng puso.”
