  terminology: Ang “sumampalataya,” “nabautismuhan,” at “maliligtas” ay angkop na mga terminong teolohikal at hindi nagpapataw ng pagbasa hinggil sa ugnayan ng pananampalataya, bautismo, at kaligtasan. Ang talababa tungkol sa mahabang wakas ng Marcos ay maingat at angkop sa tekstuwal na kalagayan ng sipi.
