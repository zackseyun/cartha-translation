  yaml_path: translation/nt/mark/016/016.yaml
  text: The one who has believed and been baptized will be saved[b][a], but the one who has disbelieved will be condemned.
translation:
  language: tl
  text: Ang sumampalataya at nabautismuhan ay maliligtas[a][b], ngunit ang hindi sumampalataya ay hahatulan ng kaparusahan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, sa mas malayang pananalita: “Ang sinumang sumampalataya at nabautismuhan ay maliligtas, ngunit ang sinumang hindi sumampalataya ay hahatulan ng kaparusahan.”'
    reason: Ipinapakita ang mas idyomatikong paraan ng pagpapahayag sa pangkalahatang saklaw ng mga substantibong participle.
  - marker: b
    text: 'Maaaring gawing mas lantad ang naunang pagkilos: “ang sumampalataya na at nabautismuhan na.”'
    reason: Ipinapakita ang posibleng paglilinaw na ang dalawang aorist participle ay nauuna sa hinaharap na “maliligtas,” bagaman hindi kailangang ilagay ang “na” sa pangunahing salin.
  - marker: c
    text: Ang Marcos 16:9–20 ay wala sa ilang pinakamatandang manuskrito; may ilang manuskrito ring naglalaman ng ibang maikling wakas.
    reason: Mahalagang impormasyong tekstuwal tungkol sa mas mahabang wakas ng Marcos.
lexical_decisions:
- source_word: ὁ πιστεύσας
  choice: ang sumampalataya
  rationale: Ang artikulo at aorist participle ay tumutukoy sa isang taong kinikilala sa ginawang pagsampalataya. Natural sa Tagalog ang substantibong pariralang “ang sumampalataya,” at napapanatili nito ang kinatawang isahan at ang pagkilos na nauuna sa hinaharap na kaligtasan.
- source_word: βαπτισθεὶς
  choice: nabautismuhan
  rationale: Ang aorist passive participle ay tuwirang naipapahayag ng “nabautismuhan.” Pinananatili nito ang tinig na balintiyak at ang pagkilos na kaugnay ng pagsampalataya bago ang “maliligtas.”
- source_word: σωθήσεται
  choice: maliligtas
  rationale: Sa kontekstong ito, ang pandiwa ay may karaniwang diwang teolohikal ng pagliligtas. Ang “maliligtas” ay malinaw at hindi nagdaragdag ng paliwanag na wala sa teksto.
- source_word: ὁ δὲ ἀπιστήσας
  choice: ngunit ang hindi sumampalataya
  rationale: Ang “hindi sumampalataya” ang natural na modernong Tagalog para sa pasalungat na pandiwa at malinaw na katapat ng “sumampalataya.” Ang “ngunit” ay nagpapahayag ng kontrastong dala ng δέ.
- source_word: κατακριθήσεται
  choice: hahatulang may sala
  rationale: Ang κατακρίνω ay hindi lamang pangkalahatang paghatol kundi hatol na salungat sa tao. Mas malinaw na naipapakita ng “hahatulang may sala” ang diwa ng pagkondena kaysa sa payak na “hahatulan.”
- source_word: καὶ
  choice: at
  rationale: Payak nitong pinag-uugnay ang pagsampalataya at pagkabautismo nang walang idinagdag na diin.
theological_decisions:
- issue: Ugnayan ng pagsampalataya at bautismo sa kaligtasan
  choice: Tuwirang pinag-ugnay ang “sumampalataya” at “nabautismuhan” bilang paglalarawan sa taong maliligtas.
  alternative: Gawing tahasang sanhi o kailangang instrumento ng kaligtasan ang bautismo, o ituring naman itong walang kaugnayan sa pahayag.
  rationale: Pinag-uugnay ng Griyego ang dalawang participle sa unang sugnay, ngunit ang kawalan ng pagsampalataya—hindi tahasang ang kawalan ng bautismo—ang binabanggit sa ikalawang sugnay. Pinananatili ng salin ang tensiyong ito nang hindi nagpapasok ng paninindigang denominasyonal.
- issue: Kinatawang isahan ng mga substantibong participle
  choice: Gamitin ang “ang sumampalataya” at “ang hindi sumampalataya.”
  alternative: Gawing maramihan ang mga parirala o gamitin ang mas malayang “sinumang.”
  rationale: Napapanatili nito ang isahang anyo ng Griyego habang malinaw na pangkalahatan ang saklaw at hindi limitado sa lalaki.
- issue: Kalagayang tekstuwal ng Marcos 16:9–20
  choice: Panatilihin ang talata sa pangunahing teksto at magbigay ng maikling talababa tungkol sa ebidensiya ng mga manuskrito.
  alternative: Alisin ang talata o ilathala ito nang walang pahiwatig tungkol sa mahalagang pagkakaiba ng mga manuskrito.
  rationale: Kasama ang talata sa ibinigay na SBLGNT text, ngunit mahalaga sa mambabasa ang kaalamang wala ang 16:9–20 sa ilang pinakamatandang manuskrito at may ibang wakas sa ilang saksi. Hindi dapat lutasin ng salin lamang ang usaping tekstuwal.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Pinili ang “sumampalataya” kaysa sa mas pang-araw-araw na “naniwala” dahil mas angkop ito sa kontekstong teolohikal at nananatiling madaling maunawaan. Ginamit ang “nabautismuhan,” ang laganap na anyo sa Filipino, at “hahatulang may sala” upang malinaw na maipahayag ang masamang hatol nang hindi nagiging labis na teknikal.
