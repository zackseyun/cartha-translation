translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Pinanatili ang tila tensiyon sa pagitan ng “napakaaga” at ng pagsikat na ng araw, gaya ng nasa Griyego, sa halip na ipaliwanag o pakinisin ito.
