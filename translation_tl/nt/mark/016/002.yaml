  text: καὶ λίαν πρωῒ ⸂τῇ μιᾷ τῶν⸃ σαββάτων ἔρχονται ἐπὶ τὸ μνημεῖον ἀνατείλαντος τοῦ ἡλίου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/002.yaml
  text: And very early on the first day of the week[c][b][a], they come to the tomb when the sun had risen.
translation:
  language: tl
  text: At napakaaga ng umaga, sa unang araw ng linggo,[a] dumarating sila[b] sa libingan nang sumikat na ang araw.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal sa Griyego, “sa una ng mga Sabbath,” isang idyomang nangangahulugang “sa unang araw ng linggo.”
    reason: lexical_alternative
  - marker: b
    text: Gumagamit dito si Marcos ng historical present—literal, “dumarating sila”—upang gawing mas buhay ang salaysay.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin, “pagkasikat ng araw.” Ang pariralang Griyego ay isang genitive absolute na nagsasaad ng oras ng kanilang pagdating.
    reason: lexical_alternative
lexical_decisions:
- source_word: λίαν πρωῒ
  choice: napakaaga
  rationale: Pinananatili ng “napakaaga” ang diin ng λίαν sa πρωῒ sa natural at maikling modernong Tagalog.
- source_word: τῇ μιᾷ τῶν σαββάτων
  choice: sa unang araw ng linggo
  rationale: Ito ang likas na kahulugan ng idyomang Koine/Semitiko na literal na tumutukoy sa “una ng mga Sabbath.”
- source_word: ἔρχονται
  choice: nagpunta sila
  rationale: Bagaman nasa kasalukuyang panahunan ang Griyego bilang historical present, mas natural sa salaysay na Tagalog ang aspektong naganap na “nagpunta.” Ipinaliliwanag sa talababa ang anyo ng orihinal.
- source_word: ἐπὶ τὸ μνημεῖον
  choice: sa libingan
  rationale: Sa konteksto ng paglilibing, ang μνημεῖον ay isang libingan, at ang ἐπί na may akusatibo ay nagpapahayag ng paggalaw patungo rito.
- source_word: ἀνατείλαντος τοῦ ἡλίου
  choice: nang sumikat na ang araw
  rationale: Ang “nang” ay natural na naghahayag ng temporal na kalagayan ng genitive absolute, samantalang ipinakikita ng “sumikat na” na sumikat na ang araw sa oras ng kanilang pagpunta nang hindi ipinipilit ang mas tiyak na “pagkatapos.”
