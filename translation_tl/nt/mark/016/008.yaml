  to: Lumabas sila at tumakas mula sa libingan[a], sapagkat sinakmal sila ng panginginig at pagkabigla. Wala silang sinabi kaninuman, sapagkat natatakot sila.
  rationale: Inalis ang idinagdag na ideya ng literal na pagtakbo at pinalitan ito ng “tumakas.” Inayos ang unang sanhiang sugnay upang maipakita na ang panginginig at pagkabigla ang sumakmal sa mga babae. Pinanatili ang magkahiwalay na huling sugnay at ang “sapagkat” upang huwag pakinisin ang biglaang pagtatapos sa γάρ. Ang maikling wakas na nasa dobleng panaklong sa SBLGNT ay nananatiling talababa lamang, at ang salin nito ay nilinaw nang walang doktrinal na pagdaragdag.
