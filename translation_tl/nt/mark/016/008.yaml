review_pass:
  verdict: revise
  source_fidelity: Ang “patakbong lumayo” ay nagdaragdag ng tiyak na paraan ng pagtakas (pagtakbo) na wala sa ἔφυγον. Ang “nanginginig sila at natitigilan sa matinding pagkamangha” ay naipahahayag ang pangkalahatang diwa, ngunit mas tapat na ilahad na ang panginginig at pagkabigla ang sumakmal sa kanila, gaya ng εἶχεν αὐτὰς τρόμος καὶ ἔκστασις.
  naturalness: Natural at malinaw ang rebisyon sa makabagong Filipino. Ang “tumakas mula sa libingan” ay tuwiran at matindi nang hindi nagdaragdag ng detalye; ang “sinakmal sila ng panginginig at pagkabigla” ay likas na paraan upang maipahayag ang Griyegong idyoma.
  terminology: Pinananatili ang “libingan” para sa μνημεῖον. Ginamit ang “pagkabigla” para sa ἔκστασις sa kontekstong ito, upang ipahiwatig ang pagkagitla/pagkatuliro at maiwasan ang masayang o kulang na kahulugan ng “matinding pagkamangha.” Ang talababa ay inayos upang ang “ipinadala ... ang pahayag” ang malinaw na tumugma sa ἐξαπέστειλεν ... τὸ κήρυγμα.
  issues:
  - severity: medium
    issue: Ang “patakbong lumayo” ay mas tiyak kaysa sa ἔφυγον.
    rationale: Ang φεύγω ay “tumakas” o “lumisan upang makatakas”; maaari itong magpahiwatig ng pagmamadali ngunit hindi nito tahasang sinasabing tumakbo.
  - severity: low
    issue: Ang “natitigilan sa matinding pagkamangha” ay bahagyang maluwag para sa ἔκστασις at hindi malinaw na ang dalawang damdamin ang sumakmal sa mga babae.
    rationale: Ang sintaks na εἶχεν αὐτὰς τρόμος καὶ ἔκστασις ay naglalarawan ng panginginig at pagkabigla bilang mga kalagayang humawak sa kanila.
  - severity: low
    issue: Ang huling pangungusap ng talababa ay mas malinaw kung ang ipinadala ay ang “pahayag,” hindi kung si Jesus ay “nagsugo ... ng pahayag.”
    rationale: Sa Griyego, si Jesus ang nagpadala ng sagradong at di-nasisirang pagpapahayag sa pamamagitan nila.
  revised_text: Lumabas sila at tumakas mula sa libingan[a], sapagkat sinakmal sila ng panginginig at pagkabigla. Wala silang sinabi kaninuman, sapagkat natatakot sila.
