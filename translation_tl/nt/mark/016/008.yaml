  text: καὶ ἐξελθοῦσαι ἔφυγον ἀπὸ τοῦ μνημείου, εἶχεν ⸀γὰρ αὐτὰς τρόμος καὶ ἔκστασις· καὶ οὐδενὶ οὐδὲν εἶπαν, ἐφοβοῦντο ⸁γάρ. ⟦Πάντα δὲ τὰ παρηγγελμένα τοῖς περὶ τὸν Πέτρον συντόμως ἐξήγγειλαν. μετὰ δὲ ταῦτα καὶ αὐτὸς ὁ Ἰησοῦς ἀπὸ ἀνατολῆς καὶ ἄχρι δύσεως ἐξαπέστειλεν δι’ αὐτῶν τὸ ἱερὸν καὶ ἄφθαρτον κήρυγμα τῆς αἰωνίου σωτηρίας. ἀμήν.⟧
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/008.yaml
  text: And they went out and fled from the tomb[a], for trembling and astonishment had seized them. And they said nothing to anyone, for they were afraid.
translation:
  language: tl
  text: Lumabas sila at tumakas mula sa libingan[a], sapagkat sinakmal sila ng panginginig at pagkabigla. Wala silang sinabi kaninuman, sapagkat natatakot sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Idinaragdag sa ilang manuskrito ang tinatawag na maikling wakas: “Iniulat naman nila nang maikli sa mga kasama ni Pedro ang lahat ng iniutos sa kanila. Pagkatapos nito, si Jesus mismo ay nagpadala rin, sa pamamagitan nila, mula silangan hanggang kanluran, ng banal at di-nasisirang pahayag tungkol sa walang-hanggang kaligtasan. Amen.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἐξελθοῦσαι
  choice: Lumabas sila
  rationale: Ang aorist participle na pambabaeng maramihan ay tumutukoy sa mga babae at natural na isinalin bilang kilos na nauna sa kanilang pagtakas, nang hindi pinabibigat ang pangungusap.
- source_word: ἔφυγον
  choice: patakbong lumayo
  rationale: Ipinahahayag nito ang biglaan at takot na paglayo na taglay ng φεύγω; mas matindi ito kaysa sa payak na “umalis.”
- source_word: μνημείου
  choice: libingan
  rationale: Ito ang natural at tumpak na salitang Filipino para sa μνημεῖον sa salaysay ng muling pagkabuhay.
- source_word: εἶχεν αὐτὰς
  choice: nanginginig sila at natitigilan
  rationale: Ang idyoma ay nagsasaad na lubos silang sinakmal o inalihan ng mga kalagayang binanggit. Ginawang natural sa Filipino sa halip na literal na “hinawakan sila.”
- source_word: τρόμος
  choice: nanginginig
  rationale: Pinananatili ang kongkretong diwa ng panginginig ng katawan, at hindi ito inuulit lamang bilang “takot” bago ang huling sugnay.
- source_word: ἔκστασις
  choice: natitigilan sa matinding pagkamangha
  rationale: Sa konteksto, tumutukoy ito sa pagkabigla o pagkamanghang halos mawala sa sarili; iniiwasan ng saling ito ang nakalilitong modernong diwa ng “ekstasi.”
- source_word: οὐδενὶ οὐδὲν εἶπαν
  choice: Wala silang sinabi kaninuman
  rationale: Natural na Filipino itong nagpapanatili sa mariing pangkalahatang pagtanggi ng Griyego.
- source_word: ἐφοβοῦντο
  choice: natatakot sila
  rationale: Malinaw at natural na ipinahahayag ang nagpapatuloy nilang kalagayan ng takot.
- source_word: γάρ
  choice: sapagkat
  rationale: Pinananatili sa dalawang paglitaw ang paliwanag na sanhi, kasama ang bigla at di-pinakinis na pagtatapos ng talata.
theological_decisions:
- issue: Ang maikling wakas na nakadobleng panaklong pagkatapos ng Marcos 16:8
  choice: Hindi isinama sa pangunahing teksto at inilagay bilang talababa.
  alternative: Isama ang maikling wakas sa pangunahing teksto o ilimbag ang dalawang wakas roon.
  rationale: Inilalagay ito ng SBLGNT sa dobleng panaklong bilang tekstong hindi kabilang sa itinatag nitong pangunahing teksto. Pinananatili ito sa talababa upang maging hayag ang mahalagang baryanteng tekstuwal nang hindi ito itinuturing na bahagi ng talata.
- issue: Ang biglang pagtatapos sa γάρ
  choice: Tinapos sa “sapagkat natatakot sila.”
  alternative: Pakinisin bilang “Dahil sa takot, hindi sila nagsalita kaninuman.”
  rationale: Pinananatili ng hiwalay na huling sugnay ang kapansin-pansing tensiyon at biglang pagtatapos ng Griyego sa halip na tahimik itong ayusin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “libingan,” “patakbong lumayo,” at “natitigilan sa matinding pagkamangha” upang maging natural sa karaniwang mambabasa habang pinananatili ang tindi, pagkabigla, at biglang pagtatapos ng Griyego.
