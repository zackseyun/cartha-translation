source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Πορευθέντες εἰς τὸν κόσμον ἅπαντα κηρύξατε τὸ εὐαγγέλιον πάσῃ τῇ κτίσει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/015.yaml
  text: And he said to them[b][a], “Go into all the world and proclaim the good news to all creation.”
translation:
  language: tl
  text: At sinabi niya sa kanila, “Humayo kayo sa buong sanlibutan at ipahayag ang magandang balita[b] sa buong sangnilikha.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa bawat nilalang.” Maaaring unawain ang pariralang Griyego bilang tumutukoy sa kabuuan o sa bawat nilalang.
    reason: alternative_reading
  - marker: b
    text: O “ebanghelyo.” Ang salitang Griyego na εὐαγγέλιον ay nangangahulugang “magandang balita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πορευθέντες
  choice: Humayo kayo
  rationale: Bagaman anyong aorist participle, kasama ito ng pangunahing pautos na κηρύξατε at may lakas ng kasabay na utos. Ang “Humayo kayo” ay likas, marangal, at nagpapanatili sa diin ng pagsusugo.
- source_word: κόσμον ἅπαντα
  choice: buong sanlibutan
  rationale: Ipinahihiwatig ng κόσμος ang sanlibutan bilang saklaw ng misyon, at pinatitindi ng ἅπαντα ang kabuuan nito. Likas sa Filipino ang “buong sanlibutan” at malinaw ang pandaigdigang saklaw.
- source_word: κηρύξατε
  choice: ipahayag
  rationale: Ang κηρύσσω ay pampubliko at may-awtoridad na paghahayag. Mas malawak at mas madaling maunawaan ang “ipahayag” kaysa “ipangaral,” na maaaring marinig bilang gawaing limitado sa pormal na pangangaral.
- source_word: τὸ εὐαγγέλιον
  choice: ang magandang balita
  rationale: Tuwirang ipinapahayag ng “magandang balita” ang kahulugan ng εὐαγγέλιον sa makabagong Filipino. Inilalagay sa talababa ang tradisyonal na “ebanghelyo.”
- source_word: πάσῃ τῇ κτίσει
  choice: sa buong sangnilikha
  rationale: Maaaring tumukoy ang κτίσις sa nilikha o sa sangnilikha. Pinananatili ng “buong sangnilikha” ang malawak at posibleng kosmikong saklaw ng Griyego nang hindi ito agad nililimitahan sa mga tao lamang.
- source_word: εἶπεν αὐτοῖς
  choice: sinabi niya sa kanila
  rationale: Tuwiran at likas na salin ito ng karaniwang panimulang salaysay, nang walang idinaragdag na interpretibong diin.
theological_decisions:
- issue: Saklaw ng πάσῃ τῇ κτίσει sa utos
  choice: sa buong sangnilikha
  alternative: sa bawat nilalang
  rationale: Maaaring unawain ang parirala nang pangkabuuan o kosmiko (“buong sangnilikha”) o nang pamahagi (“bawat nilalang”). Pinananatili ng pangunahing salin ang malawak na saklaw at ng talababa ang tunay na alternatibo, nang hindi tahimik na nilulutas ang tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Humayo kayo” upang mapanatili ang mariing pagsusugo; “sanlibutan” at “sangnilikha” upang maiba ang κόσμος at κτίσις at mapanatili ang lawak ng orihinal. Inayos ang mga marker ayon sa salitang tinutukoy ng bawat talababa.
