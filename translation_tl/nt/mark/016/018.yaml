id: MRK.16.18
reference: Mark 16:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀ὄφεις ἀροῦσιν κἂν θανάσιμόν τι πίωσιν οὐ μὴ αὐτοὺς βλάψῃ, ἐπὶ ἀρρώστους χεῖρας ἐπιθήσουσιν καὶ καλῶς ἕξουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/018.yaml
  text: They will pick up snakes[a], and if they drink anything deadly, it will certainly not harm them; they will lay hands on the sick[d][c][b], and they will recover.
translation:
  language: tl
  text: Pupulot sila ng mga ahas,[a] at kahit makainom sila ng anumang nakamamatay, hinding-hindi sila mapipinsala nito. Ipapatong nila ang kanilang mga kamay sa mga maysakit, at gagaling ang mga ito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wala ang Marcos 16:9–20 sa ilang sinaunang manuskrito; kabilang ang talatang ito sa mas mahabang wakas ng Marcos.
    reason: textual_variant
  - marker: b
    text: Sa literal, “bubuti ang kanilang kalagayan” o “magiging maayos sila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄφεις
  choice: mga ahas
  rationale: Ang “ahas” ang karaniwan at natural na katumbas sa modernong Filipino; hindi kailangang gumamit ng mas makaluma o mas matalinghagang salita.
- source_word: ἀροῦσιν
  choice: pupulot
  rationale: Ipinahihiwatig ng αἴρω rito ang pagbuhat o pagkuha mula sa kinalalagyan; natural ang “pupulot” kapag ahas ang layon.
- source_word: κἂν
  choice: at kahit
  rationale: Ang καὶ ἐάν ay nagpapakilala ng kondisyong may bahid ng pagpapalagay o pagsalungat; malinaw na naipapahayag ito ng “at kahit.”
- source_word: θανάσιμόν τι
  choice: anumang nakamamatay
  rationale: Pinananatili nitong malawak ang saklaw ng parirala—anumang maaaring magdulot ng kamatayan—nang hindi ito nililimitahan sa lason lamang.
- source_word: πίωσιν
  choice: makainom sila
  rationale: Ang anyong pasakali sa kondisyong sugnay ay natural na naipapahayag sa Filipino sa pamamagitan ng “kahit makainom sila.”
- source_word: οὐ μὴ
  choice: hinding-hindi
  rationale: Ang dobleng pagtanggi sa Griyego ay mariin; ang “hinding-hindi” ay natural at nagpapanatili ng diin.
- source_word: βλάψῃ
  choice: mapipinsala
  rationale: Malawak ang kahulugan nito na mapahamak o mapinsala, kaya angkop sa panganib mula sa anumang nakamamatay.
- source_word: ἐπὶ ἀρρώστους
  choice: sa mga maysakit
  rationale: Ang “mga maysakit” ay malinaw, magalang, at natural na tawag sa mga taong may karamdaman.
- source_word: χεῖρας ἐπιθήσουσιν
  choice: ipapatong nila ang kanilang mga kamay
  rationale: Tuwirang inilalarawan nito ang kilos at iniiwasan ang posibleng ibang pakahulugan ng idyomang “pagpapatong ng kamay” nang hindi nawawala ang biblikal na larawan.
- source_word: καλῶς ἕξουσιν
  choice: gagaling ang mga ito
  rationale: Sa konteksto ng mga maysakit, natural na resulta ang “gagaling”; inilalagay sa talababa ang mas literal na “bubuti ang kalagayan.”
theological_decisions:
- issue: Saklaw ng ipinangakong proteksiyon at pagpapagaling
  choice: Isinalin nang tuwiran ang mga kilos at kinalabasan bilang mga pahayag sa hinaharap.
  alternative: Ipaliwanag sa teksto na ang mga tanda ay para sa lahat ng mananampalataya sa lahat ng panahon, para lamang sa panahong apostoliko, o sagisag lamang.
  rationale: Hindi tinutukoy ng talata ang lawak, panahon, o sistematikong kahulugan ng mga tandang ito. Hindi dapat magpasok ang salin ng paninindigang denominasyonal.
- issue: Katayuang tekstuwal ng Marcos 16:9–20
  choice: Isinalin ang ibinigay na tekstong Griyego at nilagyan ng talababa tungkol sa mas mahabang wakas ng Marcos.
  alternative: Alisin o ikulong sa panaklong ang talata sa pangunahing teksto.
  rationale: Kasama ang talata sa ibinigay na SBLGNT source para sa gawaing ito, ngunit mahalagang ihayag sa mambabasa na wala ang Marcos 16:9–20 sa ilang sinaunang manuskrito.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “pupulot” at “mga ahas” bilang karaniwang pananalita, habang pinanatili sa “hinding-hindi” ang mariing pagtanggi ng Griyego. Ang mga marker na [a] at [b] ay kapuwa nasa pangunahing teksto.
