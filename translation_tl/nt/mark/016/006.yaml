  to: Ngunit sinabi niya sa kanila, “Huwag kayong mabigla. Hinahanap ninyo si Jesus na taga-Nazaret[a], ang ipinako sa krus. Binuhay siyang muli; wala siya rito[b]. Tingnan ninyo ang lugar kung saan nila siya inilagay.”
