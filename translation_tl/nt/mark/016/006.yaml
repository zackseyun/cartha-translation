  naturalness: Natural at marangal sa makabagong Filipino ang rebisadong pananalita. Ang “Huwag kayong mabigla” ay angkop sa tagpo, at ang “Binuhay siyang muli” ay karaniwan at malinaw na pahayag ng pagkabuhay-muli nang hindi ginagawang aktibo ang pandiwa.
