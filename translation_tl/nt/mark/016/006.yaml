reference: Mark 16:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ λέγει αὐταῖς· Μὴ ἐκθαμβεῖσθε· Ἰησοῦν ζητεῖτε τὸν Ναζαρηνὸν τὸν ἐσταυρωμένον· ἠγέρθη, οὐκ ἔστιν ὧδε· ἴδε ὁ τόπος ὅπου ἔθηκαν αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/006.yaml
  text: But he says to them[a], “Do not be alarmed. You are looking for Jesus the Nazarene, the one who has been crucified. He has been raised; he is not here[b]. Look—the place where they laid him.”
translation:
  language: tl
  text: Ngunit sinabi niya sa kanila, “Huwag kayong mabigla. Hinahanap ninyo si Jesus na taga-Nazaret[a], ang ipinako sa krus. Binuhay siyang muli; wala siya rito[b]. Tingnan ninyo ang lugar kung saan nila siya inilagay.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang Nazareno.” Ang Griyego ay gumagamit ng katawagang hinango sa Nazaret.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring “Siya ay muling nabuhay.” Pasibo ang pandiwang Griyego: “Binuhay siyang muli.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκθαμβεῖσθε
  choice: Huwag kayong matakot
  rationale: Ipinahahayag ng pandiwa ang matinding pagkabigla o pangamba; natural at malinaw sa makabagong Filipino ang “matakot” sa kontekstong ito.
- source_word: Ναζαρηνὸν
  choice: taga-Nazaret
  rationale: Ang salitang Griyego ay katawagang hinango sa Nazaret. Ang “taga-Nazaret” ang pinakanatural na katumbas sa Filipino habang pinananatili ang kaugnayan sa lugar.
- source_word: ἐσταυρωμένον
  choice: ang ipinako sa krus
  rationale: Pinananatili nito ang pasibong anyo at ang pagkakakilanlan kay Jesus batay sa naganap na pagpapako sa krus, nang hindi nagiging mabigat ang pangungusap.
- source_word: ἠγέρθη
  choice: Siya ay muling binuhay
  rationale: Pinananatili ang pasibong tinig ng Griyego at ipinahihiwatig, nang hindi labis na ipinapaliwanag, ang pagkilos ng Diyos.
- source_word: ζητεῖτε
  choice: Hinahanap ninyo
  rationale: Natural na Filipino ito para sa kasalukuyang kilos ng paghahanap sa konteksto.
- source_word: ἴδε
  choice: Tingnan ninyo
  rationale: Direkta nitong itinutuon ang pansin ng mga babae sa lugar at angkop sa maramihang kausap.
- source_word: τόπος
  choice: lugar
  rationale: Karaniwan, malinaw, at sapat na kongkreto sa konteksto ng libingan.
- source_word: ἔθηκαν
  choice: inilagay
  rationale: Tumpak at natural na katumbas ng paglalagay sa katawan ni Jesus sa libingan.
- source_word: λέγει αὐταῖς
  choice: sinabi niya sa kanila
  rationale: Bagaman historical present ang Griyego, mas natural sa tuloy-tuloy na salaysay sa Filipino ang pangnagdaan; hindi nito binabago ang nilalaman ng sinabi.
theological_decisions:
- issue: Pananalita at tinig tungkol sa muling pagkabuhay
  choice: Siya ay muling binuhay
  alternative: Siya ay muling nabuhay
  rationale: Pasibo ang ἠγέρθη. Pinananatili ng “muling binuhay” ang anyong iyon at ang ipinahihiwatig na pagkilos ng Diyos, samantalang ang “muling nabuhay” ay maaaring basahing aktibo o di-tiyak ang tinig.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pangmaramihang “kayo/ninyo” dahil mga babae ang kausap. Iniwasan ang arkaikong pananalita at pinanatili ang pasibong anyo ng pahayag tungkol sa muling pagkabuhay.
