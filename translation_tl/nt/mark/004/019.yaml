id: MRK.4.19
reference: Mark 4:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ αἱ μέριμναι τοῦ ⸀αἰῶνος καὶ ἡ ἀπάτη τοῦ πλούτου καὶ αἱ περὶ τὰ λοιπὰ ἐπιθυμίαι εἰσπορευόμεναι συμπνίγουσιν τὸν λόγον, καὶ ἄκαρπος γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/019.yaml
  text: and the cares of the age[a], and the deceitfulness of riches, and the desires for other things entering in choke the word[d][c][b], and it becomes unfruitful.
translation:
  language: tl
  text: at ang mga alalahanin sa panahong ito[a], ang daya ng kayamanan[b], at ang mga pagnanasa sa iba pang mga bagay ay pumapasok at sumasakal sa salita, kaya hindi ito namumunga.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga alalahanin sa sanlibutang ito.” Ang salitang Griyego ay maaaring tumukoy sa isang panahon o, sa pinalawak na diwa, sa kasalukuyang kaayusan ng sanlibutan.
    reason: lexical_alternative
  - marker: b
    text: O “ang panlilinlang ng kayamanan.”
    reason: lexical_alternative
  - marker: c
    text: Sa Griyego, “at nagiging walang bunga ito.” Ang “ito” ay pinakamalapit na tumutukoy sa salita, ngunit maaari ring maunawaan sa larawan ng binhi o halaman; ayon sa kahulugan ng talinghaga, maaari rin itong iugnay sa nakikinig.
    reason: alternative_reading
lexical_decisions:
- source_word: μέριμναι
  choice: mga alalahanin
  rationale: Saklaw nito ang mga alalahanin at kabalisahang bumibigat sa tao, nang hindi labis na ginagawang sikolohikal ang diwa.
- source_word: τοῦ αἰῶνος
  choice: sa panahong ito
  rationale: Pinananatili ang pangunahing temporal na diwa ng αἰών at likas sa modernong Tagalog; ipinahihiwatig nito ang kasalukuyang panahon o kaayusan.
- source_word: ἡ ἀπάτη τοῦ πλούτου
  choice: ang daya ng kayamanan
  rationale: Ipinapahayag ng parirala ang mapanlinlang na katangian ng kayamanan habang nananatiling maikli at natural.
- source_word: αἱ περὶ τὰ λοιπὰ ἐπιθυμίαι
  choice: ang mga pagnanasa sa iba pang mga bagay
  rationale: Malinaw na tumutukoy sa mga pagnanasang nakatuon sa ibang bagay at pinananatili ang malawak na saklaw ng λοιπά.
- source_word: εἰσπορευόμεναι
  choice: ay pumapasok
  rationale: Ginawang pandiwang may panaguri upang maging natural sa Tagalog at malinaw na ang mga nabanggit na impluwensiya ay pumapasok bago sumakal.
- source_word: συμπνίγουσιν
  choice: sumasakal
  rationale: Tuwirang pinananatili ang matingkad na larawan ng pagsakal sa tumutubong binhi.
- source_word: τὸν λόγον
  choice: sa salita
  rationale: Pinananatili ang biblikal na katawagang 'salita' para sa ipinahayag na mensahe at ang ugnay nito sa buong talinghaga.
- source_word: ἄκαρπος γίνεται
  choice: kaya hindi ito namumunga
  rationale: Natural na inilalarawan sa Tagalog ang bunga ng pagsakal at pinananatili ang metaporang agrikultural; ang 'ito' ay pinakamalapit na tumutukoy sa salita.
theological_decisions:
- issue: Tinutukoy ng pangwakas na isahang pandiwa at pang-uri
  choice: Ang 'ito' ay pinakamalapit na tumutukoy sa 'salita,' kaya isinaling 'hindi ito namumunga.'
  alternative: Maaaring unawain na ang nakikinig o ang binhi/halaman ang hindi namumunga.
  rationale: Ang pinakamalapit na hayag na isahang antecedent sa Griyego ay τὸν λόγον, ngunit nakaugnay ito sa larawan ng binhing inihasik. Hindi ipinapasok sa pangunahing teksto ang mas tiyak na interpretasyong 'ang nakikinig.'
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang larawang agrikultural at ang biblikal na katawagang “salita.” Ginamit ang “panahong ito” sa halip na mas teknikal na “kapanahunan” upang maging natural habang nananatili ang temporal na diwa ng αἰών.
