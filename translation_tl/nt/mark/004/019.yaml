  source_fidelity: 'Tapat ang salin sa tatlong magkakaugnay na hadlang: mga alalahanin ng kasalukuyang panahon, mapanlinlang na kayamanan, at mga pagnanais sa iba pang bagay. Ang pangmaramihang panaguring “ay pumapasok at sumasakal” ay malinaw na sumasaklaw sa buong talaan, gaya ng participle na εἰσπορευόμεναι at ng pandiwang συμπνίγουσιν. Napananatili rin ang metapora ng pamumunga sa pangwakas na sugnay.'
