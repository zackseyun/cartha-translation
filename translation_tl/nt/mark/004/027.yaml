base_translation:
  language: en
  yaml_path: translation/nt/mark/004/027.yaml
  text: and he sleeps and rises night and day[a], and the seed sprouts and grows[b], though he himself does not know how.
translation:
  language: tl
  text: At natutulog siya at bumabangon, gabi at araw, at ang binhi ay sumisibol at lumalaki[a], nang hindi niya mismo alam kung paano.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sumisibol at humahaba” o “sumisibol at tumataas.” Ang ikalawang pandiwa ay partikular na nagpapahiwatig ng paghaba o pagtaas.
    reason: lexical_alternative
  - marker: b
    text: Literal na, “kung paano hindi niya mismo alam.” Ipinahihiwatig ng parirala na hindi niya alam ang paraan ng paglaki nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθεύδῃ
  choice: natutulog siya
  rationale: Ang pangkasalukuyang pasakali ay bahagi ng sunod-sunod na kilos na naglalarawan ng paulit-ulit at nagpapatuloy na gawain; natural itong ipahayag sa pangkasalukuyan sa Tagalog.
- source_word: ἐγείρηται
  choice: bumabangon
  rationale: Ang anyong middle/passive ay intransitibo rito at tumutukoy sa paggising o pagbangon, hindi sa muling pagkabuhay.
- source_word: νύκτα καὶ ἡμέραν
  choice: gabi at araw
  rationale: Pinananatili nito ang ayos at saklaw ng idyomang Griyego para sa nagpapatuloy na pag-ikot ng panahon.
- source_word: ὁ σπόρος
  choice: ang binhi
  rationale: Tumutukoy ang may-pantukoy na parirala sa binhing naihasik na sa talinghaga; ang “binhi” ang malinaw at likas na katawagan.
- source_word: βλαστᾷ
  choice: sumisibol
  rationale: Tumpak at karaniwang salita ito para sa unang pag-usbong ng halaman.
- source_word: μηκύνηται
  choice: lumalaki
  rationale: Natural itong paglalarawan sa patuloy na paglaki ng halaman sa Tagalog. Inilalahad sa talababa ang mas tiyak na diwa ng paghaba o pagtaas na taglay ng pandiwang Griyego.
- source_word: ὡς οὐκ οἶδεν αὐτός
  choice: bagaman hindi niya mismo alam kung paano
  rationale: Ipinahahayag ng “bagaman” ang ugnayang konsesibo sa konteksto, ang “mismo” ay kumakatawan sa diin ng αὐτός, at ang “kung paano” ay ginagawang natural sa Tagalog ang ipinahihiwatig na paraan ng paglaki.
theological_decisions:
- issue: Ang sanhi o gumagawa sa paglaki ng binhi sa talinghaga
  choice: Iniwan ng salin na hindi ipinaliliwanag ang paraan ng paglaki ayon sa pananaw ng manghahasik.
  alternative: Tahasang sabihing Diyos ang nagpapalaki sa binhi, o ilarawan itong isa lamang likas na proseso.
  rationale: Binibigyang-diin ng talata ang kawalan ng kaalaman ng tao at ang paglaki ng binhi nang hindi niya nauunawaan kung paano. Hindi tahasang pinapangalanan ng Griyego ang banal na pagkilos at hindi rin nito nililimitahan ang pangyayari sa naturalistikong paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang ritmo ng magkakahanay na kilos at ang “gabi at araw” ng Griyego, habang ginawang likas ang huling sugnay sa Filipino.
