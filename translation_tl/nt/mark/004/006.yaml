  text: ⸂καὶ ὅτε ἀνέτειλεν ὁ ἥλιος⸃ ⸀ἐκαυματίσθη καὶ διὰ τὸ μὴ ἔχειν ῥίζαν ἐξηράνθη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/006.yaml
  text: And when the sun rose[a], it was scorched, and because it had no root, it withered.
translation:
  language: tl
  text: Nang sumikat ang araw, napaso ito, at dahil wala itong ugat, natuyo ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nalanta.” Ang pandiwang Griyego ay maaaring tumukoy sa pagkatuyo o pagkalanta.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὅτε ἀνέτειλεν ὁ ἥλιος
  choice: Nang sumikat ang araw
  rationale: Likas na modernong Tagalog para sa temporal na sugnay; malinaw na ipinapahayag ng “sumikat” ang pagsikat ng araw nang hindi nagdaragdag ng diwang wala sa Griyego.
- source_word: ἐκαυματίσθη
  choice: napaso ito
  rationale: Ipinahihiwatig ng pandiwa ang pinsalang dulot ng matinding init. Ang “napaso” ay natural at hindi nagpapalabis na para bang lubusang nasunog.
- source_word: διὰ τὸ μὴ ἔχειν ῥίζαν
  choice: dahil wala itong ugat
  rationale: Pinananatili ang tahasang sanhi na ipinapahayag ng διά kasama ng articular infinitive at ang isahang “ugat” ng ῥίζαν.
- source_word: ἐξηράνθη
  choice: natuyo ito
  rationale: Tuwirang inilalarawan ang pagiging tuyo ng halaman; maaari ring saklawin ng pandiwang Griyego ang pagkalanta, kaya pinanatili ang alternatibo sa talababa.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang payak na daloy at sanhi ng pangungusap. Inilagay ang talababa sa “natuyo,” ang salitang tinutukoy ng leksikal na alternatibo.
