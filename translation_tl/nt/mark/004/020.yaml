base_translation:
  language: en
  yaml_path: translation/nt/mark/004/020.yaml
  text: 'And those are the ones sown on the good soil: they hear the word and receive it and bear fruit—thirtyfold and sixtyfold and a hundredfold[a].'
translation:
  language: tl
  text: At ang mga iyon naman ay ang mga naihasik sa mabuting lupa. Sila ang nakikinig sa salita, tinatanggap nila ito[a], at namumunga—tatlumpung ulit, animnapung ulit, at sandaang ulit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “malugod nilang tinatanggap ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνοί
  choice: ang mga iyon
  rationale: Tumutukoy pabalik sa huling pangkat sa paliwanag ng talinghaga at pinananatili ang demonstratibong kaibahan nito sa mga naunang pangkat.
- source_word: οἱ ἐπὶ τὴν γῆν τὴν καλὴν σπαρέντες
  choice: ang naihasik sa mabuting lupa
  rationale: Pinananatili ang pasibong larawan ng paghahasik at ang ugnayan nito sa mga uri ng lupang binanggit sa talinghaga.
- source_word: γῆν τὴν καλὴν
  choice: mabuting lupa
  rationale: Sa kontekstong pansakahan, natural na tumutukoy ang γῆ sa lupang tinutubuan; pinananatili ng “mabuti” ang pagtatangi nito sa ibang lupa.
- source_word: ἀκούουσιν τὸν λόγον
  choice: naririnig nila ang salita
  rationale: Pinananatili ang paulit-ulit na katawagang “salita” sa Marcos 4 at hindi nililimitahan ang kahulugan nito sa isang paliwanag na wala sa talata.
- source_word: παραδέχονται
  choice: tinatanggap nila ito
  rationale: Ipinahahayag ang positibong pagtanggap sa salita; idinagdag ang “ito” bilang likas na panghalip sa Filipino na malinaw na tumutukoy sa “salita.”
- source_word: καρποφοροῦσιν
  choice: namumunga
  rationale: Maikli at natural na pinananatili ang larawang pansakahan at ang espirituwal na pahiwatig nito nang hindi ito labis na ipinapaliwanag.
- source_word: ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν ἑκατόν
  choice: tatlumpu, animnapu, at sandaang ulit
  rationale: Ipinahahayag ng “ulit” ang dami ng ani kung ihahambing sa naihasik. Ang tatlong antas ay pinananatili nang malinaw at natural sa modernong Filipino.
theological_decisions:
- issue: Uri ng pagtugon sa salita sa mabuting lupa
  choice: Inilalarawan ang tunay at positibong pagtanggap sa salita na nagbubunga.
  alternative: Ipaliwanag ito bilang tiyak na patunay ng pangwakas na pananatili, o bilang paunang pagtugon lamang.
  rationale: Ang Griyego ay nagsasabing nakikinig sila, tumatanggap, at namumunga, ngunit hindi nito tahasang nilulutas ang mas malawak na usapin tungkol sa pananatili o pagtalikod.
translation_notes:
  register: 'Modernong Filipino na malinaw, marangal, at madaling maunawaan. Pinanatili ang talinghaga ng paghahasik at pamumunga, gayundin ang maigsi at sunod-sunod na kilos: pakikinig, pagtanggap, at pamumunga.'
