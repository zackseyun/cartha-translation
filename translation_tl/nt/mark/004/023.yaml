  text: εἴ τις ἔχει ὦτα ἀκούειν ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/023.yaml
  text: If anyone has ears to hear[a], let him hear.
translation:
  language: tl
  text: Kung ang sinuman ay may mga tainga upang makarinig, makinig siya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴ τις
  choice: Kung ang sinuman
  rationale: Pinananatili ang kondisyunal na anyo ng εἴ at ang bukas, pangkalahatang saklaw ng τις sa natural na modernong Tagalog.
- source_word: ἔχει
  choice: ay may
  rationale: Payak at tuwirang katumbas ng pandiwang nagsasaad ng pagkakaroon.
- source_word: ὦτα ἀκούειν
  choice: mga taingang nakakarinig
  rationale: Natural na idyomatikong Tagalog para sa literal na ‘mga tainga upang makarinig’; pinananatili ang larawan at ang kaugnayan nito sa kasunod na utos.
- source_word: ἀκουέτω
  choice: makinig siya
  rationale: Ipinahahayag ang ikatlong panauhang isahang pautos. Ang ‘makinig’ ay natural sa Tagalog at nagpapahiwatig ng masusing, tumatanggap na pakikinig na hinihingi ng kasabihan.
theological_decisions:
- issue: Pangkalahatang isahan sa pautos
  choice: makinig siya
  alternative: makinig sila
  rationale: Ang τις at ἀκουέτω ay kapwa isahan. Ang ‘siya’ ay likas na walang tiyak na kasarian sa Tagalog, kaya napapanatili ang isahang anyo nang hindi nagdaragdag ng panlalaking pagtukoy.
- issue: Pag-uulit ng ἀκούω at saklaw ng kahulugan
  choice: nakakarinig … makinig
  alternative: nakakarinig … makarinig siya
  rationale: Bagaman inuulit sa Griyego ang iisang ugat, mas natural sa Tagalog ang ‘makinig’ bilang pautos at mas malinaw nitong naipahahayag ang aktibo at tumatanggap na pagdinig. Hindi nito nilulutas nang labis ang espirituwal na pahiwatig ng kasabihan.
translation_notes:
  register: Maikli, marangal, at madaling maunawaan sa modernong Filipino Tagalog. Ginamit ang ‘ang sinuman’ upang panatilihin ang bukas na paanyaya, at ang walang-kasariang ‘siya’ upang tumpak na mapanatili ang isahang Griyego.
