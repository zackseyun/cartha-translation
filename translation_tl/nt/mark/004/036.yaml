base_translation:
  language: en
  yaml_path: translation/nt/mark/004/036.yaml
  text: And leaving the crowd[a], they take him with them just as he was, in the boat[b], and other boats were with him.
translation:
  language: tl
  text: At iniwan nila ang maraming tao at isinama si Jesus sa kalagayan niya noon, habang nasa bangka siya.[a] May iba pang mga bangkang kasama niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “isinama nila siya gaya ng kalagayan niya noon, sa bangka.” Maaaring idiin ng Griyego na nasa bangka na si Jesus o na isinama siya nang walang karagdagang paghahanda.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφέντες
  choice: iniwan
  rationale: Ang aorist participle ay nagsasaad ng kilos na nauna sa pangunahing pandiwa. Natural sa Tagalog ang “iniwan” at hindi nito ipinahihiwatig na pormal nilang pinaalis ang mga tao.
- source_word: τὸν ὄχλον
  choice: ang maraming tao
  rationale: Tumutukoy ang ὄχλος sa nagkatipong karamihan; malinaw at likas sa modernong Tagalog ang “maraming tao.”
- source_word: παραλαμβάνουσιν αὐτόν
  choice: isinama si Jesus
  rationale: Ang παραλαμβάνω ay nangangahulugang isama o dalhin kasama ng sarili. Inulit ang pangalang “Jesus” sa halip na “siya” upang maiwasan ang kalituhan sa Tagalog.
- source_word: ὡς ἦν ἐν τῷ πλοίῳ
  choice: kung paano siya naroon sa bangka
  rationale: Pinananatili nitong magkaugnay ang kalagayan at lokasyon ni Jesus, gaya ng maaaring pagbasa sa Griyego, nang hindi idinaragdag na sumakay pa siya noon lamang o na may tiyak na paghahandang hindi ginawa.
- source_word: ἄλλα πλοῖα
  choice: iba pang mga bangka
  rationale: Tuwirang salin ito ng ἄλλα πλοῖα; walang salitang “maliliit” sa Griyego kaya hindi iyon idinagdag.
- source_word: ἦν μετ’ αὐτοῦ
  choice: kasama niya
  rationale: Natural nitong ipinahahayag na may iba pang mga bangkang sumama kay Jesus, habang pinananatili ang payak na paraan ng pagkakasabi ng salin.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Ginamit ang “maraming tao” kaysa mas pormal na “karamihan,” at “bangka” kaysa “sasakyang-dagat.” Pinanatili sa talababa ang tunay na kalabuan ng ὡς ἦν ἐν τῷ πλοίῳ.
