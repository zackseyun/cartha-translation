  naturalness: Hindi likas sa modernong Tagalog ang “kung paano siya naroon sa bangka” sa ganitong gamit. Mas natural ang “sa kalagayan niya noon, habang nasa bangka siya.”
  terminology: Ang “mga tao,” “isinama,” at “bangka” ay angkop sa simple at marangal na modernong Filipino Tagalog. Pinanatili ang “Jesus” at hindi nagdagdag ng interpretasyong teolohikal.
