- from: At iniwan nila ang maraming tao at isinama si Jesus, kung paano siya naroon sa bangka.[a] May iba pang mga bangkang kasama niya.
  to: At iniwan nila ang maraming tao at isinama si Jesus sa kalagayan niya noon, habang nasa bangka siya.[a] May iba pang mga bangkang kasama niya.
  rationale: Pinalitan ang di-likas na “kung paano siya naroon” ng “sa kalagayan niya noon,” na mas malinaw na tumutugon sa ὡς ἦν. Ang “habang nasa bangka siya” ay naglilinaw sa lokasyon nang hindi ipinahihiwatig na isinakay siya sa sandaling iyon. Inayos din ang talababa upang mapanatili ang kalabuan ng pagkakaugnay ng ὡς ἦν at ἐν τῷ πλοίῳ at maiwasan ang maling implikasyong isinakay lamang siya noon.
