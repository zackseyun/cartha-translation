base_translation:
  language: en
  yaml_path: translation/nt/mark/004/031.yaml
  text: It is like a mustard seed[a], which, when it is sown on the ground[b], being smaller than all the seeds on the ground—
translation:
  language: tl
  text: Tulad ito ng isang buto ng mustasa[a] na, kapag inihasik sa lupa, ay mas maliit[b] kaysa sa lahat ng binhing nasa lupa—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang butil ng mustasa.”
    reason: lexical_alternative
  - marker: b
    text: Pahambing na “mas maliit” ang nasa Griyego, hindi pasukdol na “pinakamaliit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: Tulad ito ng
  rationale: Ipinahihiwatig ng ὡς ang paghahambing. Idinagdag ang “ito” sapagkat nakasalalay ang eliptikong parirala sa tanong sa naunang talata at mas natural ito sa Tagalog.
- source_word: κόκκῳ σινάπεως
  choice: isang buto ng mustasa
  rationale: Maaaring mangahulugang “butil” o “buto” ang κόκκος; malinaw at karaniwan sa modernong Tagalog ang “buto ng mustasa” para sa larawang panghalaman.
- source_word: ὅταν σπαρῇ
  choice: kapag inihasik
  rationale: Pinananatili ng “kapag” ang pangkalahatang temporal na diwa ng ὅταν na may aorist subjunctive, at ng “inihasik” ang balintiyak na anyo.
- source_word: ἐπὶ τῆς γῆς
  choice: sa lupa
  rationale: Sa kontekstong agrikultural, ang γῆ ay lupa o lupang taniman, hindi ang buong daigdig. Natural sa Tagalog ang “inihasik sa lupa.”
- source_word: μικρότερον ὂν
  choice: ay mas maliit
  rationale: Ang μικρότερον ay pahambing na “mas maliit,” hindi tahasang pasukdol na “pinakamaliit.” Ginawang sugnay na may “ay” ang participial construction upang maging malinaw at natural sa Tagalog.
- source_word: πάντων τῶν σπερμάτων τῶν ἐπὶ τῆς γῆς
  choice: kaysa sa lahat ng binhing nasa lupa
  rationale: Tuwirang pinananatili ang malawak na paghahambing at ang inuulit na pagtukoy sa lupa, nang hindi nagdaragdag ng makabagong paglilinaw na botanikal.
theological_decisions:
- issue: Pahambing o pasukdol na paglalarawan sa buto ng mustasa
  choice: mas maliit kaysa sa lahat ng binhing nasa lupa
  alternative: pinakamaliit sa lahat ng binhing nasa lupa
  rationale: Pahambing ang anyong Griyego na μικρότερον. Pinananatili ng salin ang anyong ito at ang tensiyon ng malawak na pahayag sa talinghaga sa halip na gawing tahasang pasukdol.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang anyong putol na nagtatapos sa em dash sapagkat nagpapatuloy ang pangungusap sa kasunod na talata. Ang “buto” at “binhi” ay ginamit ayon sa natural na gamit sa Tagalog, habang ang talababa ay nagpapanatili sa alternatibong “butil.”
