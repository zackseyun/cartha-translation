  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ πάλιν ἤρξατο διδάσκειν παρὰ τὴν θάλασσαν. καὶ ⸀συνάγεται πρὸς αὐτὸν ὄχλος ⸀πλεῖστος, ὥστε αὐτὸν ⸂εἰς πλοῖον ἐμβάντα⸃ καθῆσθαι ἐν τῇ θαλάσσῃ, καὶ πᾶς ὁ ὄχλος πρὸς τὴν θάλασσαν ἐπὶ τῆς γῆς ⸀ἦσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/001.yaml
  text: And again he began to teach beside the sea. And a very large crowd gathers to him, so that he got into a boat and sat on the sea, and the whole crowd was by the sea on the land.
translation:
  language: tl
  text: Muli siyang nagsimulang magturo sa tabi ng dagat. Nagtipon sa paligid niya ang napakalaking pulutong,[a] kaya sumakay siya sa isang bangka at umupo rito sa dagat.[b] At ang buong karamihan ay nasa lupa sa tabi ng dagat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griego, ang pandiwa ay nasa pangkasalukuyang anyo at maaari ring isalin na “nagtitipon.” Madalas gamitin ni Marcos ang makasaysayang pangkasalukuyan upang gawing mas buhay ang salaysay.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, nasa bangkang nakalutang sa tubig si Jesus, samantalang nanatili sa lupa ang karamihan.
    reason: cultural_note
lexical_decisions:
- source_word: πάλιν
  choice: Muli
  rationale: Likas at maikli itong pananda ng pag-uulit ng pagtuturo ni Jesus.
- source_word: ἤρξατο διδάσκειν
  choice: nagsimulang magturo
  rationale: Pinananatili nito ang ingressive na diwa ng konstruksiyon at natural sa modernong Tagalog.
- source_word: παρὰ τὴν θάλασσαν
  choice: sa tabi ng lawa
  rationale: Ang παρά ay nagsasaad ng lokasyon sa tabi; bagaman literal na 'dagat' ang θάλασσα, sa konteksto ng Marcos tumutukoy ito sa Lawa ng Galilea, at 'lawa' ang malinaw at karaniwang tawag dito sa Filipino.
- source_word: συνάγεται
  choice: Nagtipon
  rationale: Isinalin ang makasaysayang pangkasalukuyan bilang pangnagdaan upang maging natural ang salaysay sa Tagalog, habang ang talab nito ay ipinaliwanag sa talababa.
- source_word: ὄχλος πλεῖστος
  choice: ang napakaraming tao
  rationale: Ipinahahayag ng 'napakarami' ang matinding puwersa ng πλεῖστος sa natural na Filipino.
- source_word: πρὸς αὐτόν
  choice: sa kanya
  rationale: Ipinakikita ang paglapit at pagtitipon ng mga tao kay Jesus nang hindi dinaragdagan ang teksto.
- source_word: ὥστε
  choice: kaya
  rationale: Natural na ipinahahayag ang resultang dulot ng laki ng karamihan.
- source_word: εἰς πλοῖον ἐμβάντα
  choice: sumakay siya sa isang bangka
  rationale: Natural na Filipino para sa pagpasok o pagsakay sa bangka; malinaw ang kilos na nauna sa pag-upo.
- source_word: καθῆσθαι ἐν τῇ θαλάσσῃ
  choice: naupo roon sa tubig
  rationale: Iniiwasan ang di-likas at maaaring maling maunawaang 'naupo sa lawa'; tinutukoy ng 'roon' ang bangka at ng 'sa tubig' ang kinalalagyan nito.
- source_word: πᾶς ὁ ὄχλος
  choice: ang buong karamihan
  rationale: Pinananatili ang kolektibong diin ng πᾶς at ang kaibahan ng karamihang nasa lupa.
- source_word: ἐπὶ τῆς γῆς
  choice: nasa lupa
  rationale: Direkta at malinaw na katapat, na ikinokontra sa kinalalagyan ni Jesus sa bangka.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “lawa” para sa θάλασσα dahil ang tinutukoy sa konteksto ay ang Lawa ng Galilea; nilinaw sa daloy at talababa na si Jesus ay nasa bangka sa tubig, hindi literal na nakaupo sa ibabaw ng tubig.
