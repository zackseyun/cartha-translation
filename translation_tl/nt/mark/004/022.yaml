  text: οὐ γάρ ἐστιν ⸀κρυπτὸν ἐὰν μὴ ⸀ἵνα φανερωθῇ, οὐδὲ ἐγένετο ἀπόκρυφον ἀλλ’ ἵνα ⸂ἔλθῃ εἰς φανερόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/022.yaml
  text: For nothing is hidden except to be revealed[b][a], nor has anything become concealed except to come to light.
translation:
  language: tl
  text: Sapagkat walang anumang nakatago maliban upang maihayag,[a] ni walang anumang naging lingid maliban upang malantad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Sapagkat walang anumang nakatago maliban sa mahayag, ni walang anumang naging lingid maliban sa malantad.” Ang mga sugnay na may ἵνα sa Griyego ay maaaring magpahiwatig ng layunin o ng bunga.'
    reason: alternative_reading
lexical_decisions:
- source_word: κρυπτόν
  choice: nakatago
  rationale: Likas at malinaw itong katumbas ng bagay na hindi nakikita o hindi pa nahahayag, nang hindi ipinahihiwatig na sadyang inililihim.
- source_word: ἐὰν μὴ ἵνα
  choice: maliban upang
  rationale: Pinananatili nito ang anyong eksepsiyon at ang layunin o bungang maaaring ipahiwatig ng ἵνα.
- source_word: φανερωθῇ
  choice: maihayag
  rationale: Ipinananatili ang balintiyak na diwa ng pagiging lantad o ipinakikilala.
- source_word: ἀπόκρυφον
  choice: inilihim
  rationale: Ipinakikita ang kalagayang inilayo sa paningin at nagbibigay ng bahagyang pagkakaiba sa naunang 'nakatago.'
- source_word: ἐγένετο
  choice: walang anumang inilihim
  rationale: Sa natural na Filipino, ipinahahayag ang pagpasok sa kalagayang lihim sa pamamagitan ng pandiwang 'inilihim'; hindi na kailangang isalin nang hiwalay ang 'naging.'
- source_word: ἔλθῃ εἰς φανερόν
  choice: malantad
  rationale: Natural at maikli sa Filipino, at ipinahahayag ang pagdating sa hayag o nakikitang kalagayan.
- source_word: γάρ
  choice: Sapagkat
  rationale: Malinaw na nag-uugnay sa talata bilang paliwanag sa naunang sinabi.
theological_decisions:
- issue: Layunin o bunga sa dalawang sugnay na ἵνα
  choice: Isinalin bilang 'maliban upang,' na may pangunahing himig ng layunin.
  alternative: “maliban sa mahayag / malantad,” na maaaring higit na marinig bilang bunga lamang
  rationale: Karaniwang nagsasaad ng layunin ang ἵνα, ngunit maaari rin itong magkaroon ng himig ng bunga sa Koine. Pinananatili ng salin at talababa ang tensiyong ito nang hindi ipinapalagay kung sino ang sanhi ng paghahayag.
translation_notes:
  register: Makabago, dignified, at madaling maunawaang Filipino. Pinanatili ang balanseng paralelismo ng dalawang hati at iniwasan ang sobrang teknikal o denominasyonal na pananalita.
