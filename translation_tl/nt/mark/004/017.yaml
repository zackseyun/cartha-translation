base_translation:
  language: en
  yaml_path: translation/nt/mark/004/017.yaml
  text: and they have no root in themselves[a], but are temporary; then, when affliction or persecution arises because of the word, they immediately fall away.
translation:
  language: tl
  text: at wala silang ugat sa kanilang sarili, kundi pansamantala lamang. Pagkatapos, kapag dumating ang paghihirap o pag-uusig dahil sa salita, agad silang tumatalikod.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “natitisod.” Maaari rin itong mangahulugang nagkakaroon ng ikinatisod o napipikon.
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζαν
  choice: ugat
  rationale: Pinananatili ang tuwirang larawang pang-agrikultura na kaugnay ng binhi at lupa sa talinghaga, nang hindi nagdaragdag ng diwa gaya ng “malalim” o “matibay.”
- source_word: ἐν ἑαυτοῖς
  choice: sa kanilang sarili
  rationale: Pinananatili ang reflexive na diwa ng Griyego at ang ugnayan nito sa “ugat.”
- source_word: πρόσκαιροί
  choice: nananatili lamang nang sandaling panahon
  rationale: Likas itong Filipino para sa mga taong tumatagal lamang pansamantala, at hindi nito idinaragdag ang sikolohikal na diwa ng pagiging pabago-bago.
- source_word: εἶτα
  choice: Pagkatapos
  rationale: Malinaw na ipinahihiwatig ang kasunod na pangyayari sa daloy ng paliwanag.
- source_word: γενομένης θλίψεως ἢ διωγμοῦ
  choice: kapag dumating ang paghihirap o pag-uusig
  rationale: Ginagawang likas na temporal na sugnay sa Filipino ang genitive absolute; malinaw ang hirap o pagdiin sa θλῖψις at ang tiyak na pag-uusig sa διωγμός.
- source_word: διὰ τὸν λόγον
  choice: dahil sa salita
  rationale: Pinananatili ang paulit-ulit na katawagang “salita” sa talinghaga sa halip na palitan ito ng mas interpretibong “mensahe.”
- source_word: εὐθὺς
  choice: agad
  rationale: Maikli, natural, at pinananatili ang katangi-tanging pagmamadali ng salaysay ni Marcos.
- source_word: σκανδαλίζονται
  choice: tumatalikod
  rationale: Sa konteksto, inilalarawan nito ang pagtalikod sa dating pagtanggap sa salita kapag dumating ang panggigipit. Inilalagay sa talababa ang mas literal at ibang posibleng mga diwa upang mapanatili ang lawak ng pandiwang Griyego.
theological_decisions:
- issue: Diwa ng σκανδαλίζονται sa konteksto ng pagkadisipulo at pagtalikod
  choice: tumatalikod
  alternative: natitisod; nabubuwal; nagkakaroon ng ikatitisod
  rationale: Ipinakikita ng konteksto na hindi lamang sila nasasaktan o napipikon, kundi hindi sila nagpapatuloy sa pagtanggap sa salita sa ilalim ng pag-uusig. Gayunman, hindi tinutukoy ng salin ang kanilang pangwakas na kalagayan sa kaligtasan, kaya nananatili ang teolohikal na tensiyon ng teksto.
translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Filipino. Pinanatili ang talinghagang “ugat” at ang katawagang “salita,” habang ginawang likas sa Filipino ang paglalarawan sa pagiging pansamantala at ang temporal na sugnay.
