id: MRK.4.12
reference: Mark 4:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἵνα βλέποντες βλέπωσι καὶ μὴ ἴδωσιν, καὶ ἀκούοντες ἀκούωσι καὶ μὴ συνιῶσιν, μήποτε ἐπιστρέψωσιν καὶ ἀφεθῇ ⸀αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/012.yaml
  text: so that seeing they may see and not perceive[a], and hearing they may hear and not understand[c][b], lest they turn back and it be forgiven them.
translation:
  language: tl
  text: upang tumingin man sila nang tumingin ay hindi sila makakita[a], at makinig man sila nang makinig ay hindi sila makaunawa[b], baka sila’y manumbalik[c] at mapatawad sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “makakita nang may pagkaunawa.”
    reason: lexical_alternative
  - marker: b
    text: Inuulit dito ni Jesus ang diwa ng Isaias 6:9–10, na nagpapanatili ng tensiyon sa pagitan ng paghatol ng Diyos at ng kabiguan ng mga tao na tumugon.
    reason: cross_reference
  - marker: c
    text: Ang “manumbalik” ay maaari ring isaling “bumalik” o, ayon sa konteksto, “magsisi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: upang
  rationale: Pinananatili ang layunin/bungang ipinahihiwatig ng pangatnig nang hindi nilulutas ang sadyang tensiyon ng pahayag.
- source_word: βλέποντες βλέπωσι καὶ μὴ ἴδωσιν
  choice: tumitingin sila ngunit hindi makakita
  rationale: Ang magkaugnay ngunit magkaibang pandiwang βλέπω at ὁράω ay ipinapakita sa natural na Filipino bilang panlabas na pagtingin na hindi humahantong sa tunay na pagkakita o pagkaunawa.
- source_word: ἀκούοντες ἀκούωσι καὶ μὴ συνιῶσιν
  choice: nakikinig sila ngunit hindi makaunawa
  rationale: Pinananatili ang pagkakaiba ng pandinig at pag-unawa; ang 'nakikinig' ay mas natural kaysa literal na pag-uulit ng 'nakakarinig' sa modernong Tagalog.
- source_word: μήποτε
  choice: baka
  rationale: Likas at malinaw na katumbas sa Tagalog ng negatibong posibilidad o pangamba, habang nananatili ang matinding tensiyon ng sipi.
- source_word: ἐπιστρέψωσιν
  choice: manumbalik
  rationale: Pinananatili ang larawan ng pagbalik at ang posibleng pahiwatig ng pagsisisi nang hindi ito ginagawang tahasang teknikal na terminong teolohikal.
- source_word: ἀφεθῇ αὐτοῖς
  choice: patawarin
  rationale: Natural na Filipino para sa aorist passive na may ipinahihiwatig na Diyos bilang tagaganap; hindi dinaragdagan ang hindi binanggit na layon ng pagpapatawad.
theological_decisions:
- issue: Layunin o bunga sa sipi ni Jesus mula sa Isaias
  choice: Panatilihin ang 'upang ... baka'
  alternative: '''kaya ... kung hindi ay maaari silang manumbalik'''
  rationale: Ang Griyego ay may matinding purpose-like na anyo. Hindi ito pinalalambot tungo sa simpleng paglalarawan, kaya nananatili ang tensiyon sa pagitan ng banal na paghatol at ng kabiguan ng mga tao na tumugon.
- issue: Kahulugan ng ἐπιστρέψωσιν
  choice: manumbalik
  alternative: magsisi
  rationale: Maaaring magpahiwatig ang pandiwa ng pagsisisi sa kontekstong propetiko, ngunit mas malawak ang literal na larawan nito. Ang talababa ang nag-iingat sa alternatibong kahulugan.
- issue: Hindi tahasang layon ng ἀφεθῇ
  choice: patawarin
  alternative: patawarin ang kanilang mga kasalanan
  rationale: Hindi tinutukoy sa Griyego ang layon. Ang maikling anyo sa Filipino ay nagpapanatili nito nang hindi nagdaragdag ng 'mga kasalanan,' bagaman malinaw iyon sa konteksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang 'tumitingin ... hindi makakita' at 'nakikinig ... hindi makaunawa' upang maipahayag nang natural ang Semitikong pag-uulit at paralelismo. Inilagay ang mga talababa sa mga sugnay na tuwirang nililinaw ng mga ito.
