  naturalness: Ang “tumingin man sila nang tumingin” at “makinig man sila nang makinig” ay likas at matalinghagang Filipino para sa idiomatikong pag-uulit ng Griyego. Ang “mapatawad sila” ay mas natural at mas kumpleto sa gramatika kaysa sa nakabitin na “patawarin.”
  terminology: Pinananatili ang “upang ... baka” upang huwag pahinain ang purpose-like na tensiyon ng μήποτε. Ang “manumbalik” ay angkop para sa ἐπιστρέψωσιν; pinananatili sa talababa ang “magsisi” bilang kontekstuwal na posibilidad. Hindi idinaragdag ang “mga kasalanan” sa pasibong pagpapatawad.
