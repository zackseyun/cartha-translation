  text: ⸂Καὶ ὅτε⸃ ἐγένετο κατὰ μόνας, ⸀ἠρώτων αὐτὸν οἱ περὶ αὐτὸν σὺν τοῖς δώδεκα ⸂τὰς παραβολάς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/010.yaml
  text: And when he was alone[a], those around him with the Twelve were asking him about the parables.
translation:
  language: tl
  text: At nang nasa isang pribadong lugar na si Jesus, ang mga nakapaligid sa kanya, kasama ang Labindalawa, ay nagtatanong sa kanya tungkol sa mga talinghaga.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ὅτε
  choice: At nang
  rationale: Pinananatili ang pang-ugnay na καί at ang temporal na ὅτε sa natural na daloy ng salaysay sa Tagalog.
- source_word: ἐγένετο κατὰ μόνας
  choice: mapag-isa si Jesus
  rationale: Likas na Tagalog para sa idyomang nagsasaad na siya ay nasa pribadong kalagayan, malayo sa karamihan; tahasang ginamit ang pangalan upang luminaw ang paksa.
- source_word: ἠρώτων
  choice: tinatanong
  rationale: Ipinahihiwatig ng aspektong imperpektibo ang nagpapatuloy na pagtatanong nang hindi pinalalabis bilang paulit-ulit na pangungulit.
- source_word: οἱ περὶ αὐτὸν
  choice: mga kasama niya
  rationale: Natural na tumutukoy sa mas malawak na pangkat ng mga tagasunod na nakapaligid o kasama ni Jesus, at hindi lamang sa pisikal na lapit.
- source_word: σὺν τοῖς δώδεκα
  choice: pati ng Labindalawa
  rationale: Malinaw na isinasama ang Labindalawa sa mas malawak na pangkat nang hindi ipinapantay ang buong pangkat sa kanila lamang.
- source_word: τὰς παραβολάς
  choice: mga talinghaga
  rationale: Pinananatili ang maramihang bilang ng tekstong Griyego at ginagamit ang karaniwang dignified na salin ng παραβολή.
theological_decisions:
- issue: Pagkakakilanlan ng pangkat na nagtatanong
  choice: Ang mas malawak na pangkat ng mga kasama ni Jesus, kabilang ang Labindalawa, ang nagtatanong sa kanya.
  alternative: Ang Labindalawa lamang ang nagtatanong sa kanya.
  rationale: Pinakamalinaw na ipinakikita ng οἱ περὶ αὐτὸν σὺν τοῖς δώδεκα ang isang mas malawak na pangkat kasama ang Labindalawa; hindi sila dapat ipagsama bilang iisang eksklusibong pangkat.
- issue: Kahulugan ng κατὰ μόνας
  choice: Nasa pribadong kalagayan si Jesus, hiwalay sa karamihan.
  alternative: Lubos na nag-iisa si Jesus na walang sinumang kasama.
  rationale: Ipinakikita mismo ng kasunod na sugnay na may mga tagasunod na kasama niya; kaya ang parirala ay tumutukoy sa pagiging pribado o hiwalay sa karamihan, hindi sa ganap na pag-iisa.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “mapag-isa” para sa pribadong kalagayan at “pati ng Labindalawa” upang malinaw na mapanatili ang pagkakaiba ng mas malawak na pangkat at ng Labindalawa.
