  text: καὶ ὅταν σπαρῇ, ἀναβαίνει καὶ γίνεται ⸂μεῖζον πάντων τῶν λαχάνων⸃ καὶ ποιεῖ κλάδους μεγάλους, ὥστε δύνασθαι ὑπὸ τὴν σκιὰν αὐτοῦ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/032.yaml
  text: and when it is sown[a], it comes up and becomes larger than all the garden plants, and it produces large branches[b], so that the birds of the sky are able to nest under its shade.
translation:
  language: tl
  text: At kapag naihasik na ito, sumisibol ito at nagiging mas malaki kaysa sa lahat ng halamang-gulayan. Naglalabas ito ng malalaking sanga, kaya nakapamumugad[b] sa ilalim ng lilim nito ang mga ibon sa himpapawid[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga ibon sa langit.”
    reason: lexical_alternative
  - marker: b
    text: O “manahan” o “tumira.” Maaaring umaalingawngaw ang pananalitang ito sa larawan sa Lumang Tipan ng mga ibong nakasusumpong ng masisilungan sa isang malaking puno (halimbawa, Ezekiel 17:23; Daniel 4:12).
    reason: cross_reference
lexical_decisions:
- source_word: σπαρῇ
  choice: naihasik na ito
  rationale: Ang aorist passive subjunctive kasunod ng ὅταν ay likas na isinasalin bilang di-tiyak na sugnay na pamanahon. Pinananatili ng “naihasik” ang larawan at bokabularyo ng paghahasik sa talinghaga.
- source_word: ἀναβαίνει
  choice: sumisibol ito
  rationale: Sa kontekstong pansakahan, tumutukoy ito sa paglitaw at pag-angat ng halaman mula sa lupa; natural at malinaw sa modernong Filipino ang “sumisibol.”
- source_word: γίνεται
  choice: nagiging
  rationale: Ipinahihiwatig ng pandiwa ang kalagayang bunga ng paglaki, kaya pinananatili ang pagbabagong ipinapahayag ng Griyego.
- source_word: μεῖζον πάντων τῶν λαχάνων
  choice: mas malaki kaysa sa lahat ng halamang-gulayan
  rationale: Tuwirang pinananatili ang pahambing na anyo. Mas malawak at mas tumpak sa λάχανα ang “halamang-gulayan” kaysa “gulay,” sapagkat mga halamang itinatanim sa hardin ang tinutukoy.
- source_word: ποιεῖ κλάδους μεγάλους
  choice: naglalabas ito ng malalaking sanga
  rationale: Ang “naglalabas ng mga sanga” ay natural na ekspresyon sa Filipino para sa pag-usbong o pagpapatubo ng mga sanga, nang hindi nagiging mekanikal ang salin.
- source_word: ὥστε δύνασθαι
  choice: kaya maaaring
  rationale: Ipinapakita ng “kaya” ang bunga o resulta, samantalang pinananatili ng “maaaring” ang diwa ng kakayahang ipinahahayag ng δύνασθαι.
- source_word: ὑπὸ τὴν σκιὰν αὐτοῦ
  choice: sa ilalim ng lilim nito
  rationale: Mas angkop sa silungang ibinibigay ng halaman ang “lilim” kaysa “anino,” at tapat ito sa larawan ng σκιά.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: ang mga ibon sa himpapawid
  rationale: Natural sa kasalukuyang Filipino ang “mga ibon sa himpapawid” at malinaw na tumutukoy sa mga ibong lumilipad sa kalangitan. Itinatala sa talababa ang mas literal na alternatibo.
- source_word: κατασκηνοῦν
  choice: mamugad
  rationale: Maaaring mangahulugan ang pandiwa ng manahan o tumira. Sa konteksto ng mga ibon at mga sanga, malinaw at natural ang “mamugad,” habang inilalahad sa talababa ang mas literal na mga alternatibo at posibleng alusyon.
theological_decisions:
- issue: Larawan ng mga ibong sumisilong sa mga sanga at posibleng alusyon sa Lumang Tipan
  choice: Panatilihin ang larawan sa pangunahing teksto nang hindi ipinapaliwanag ang simbolikong kahulugan nito.
  alternative: Gamitin ang mas literal na “manahan” upang higit na marinig ang posibleng alusyon sa larawan ng malaking puno at kaharian sa Ezekiel 17:23 at Daniel 4:12.
  rationale: Maaaring umaalingawngaw rito ang larawan sa Lumang Tipan, ngunit hindi ito tahasang ipinaliliwanag ng Griyegong teksto. Iniiwasan ng salin na magtakda ng isang teolohikal na pakahulugan; inilalagay lamang sa talababa ang posibleng ugnayan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang bokabularyong pansakahan na “naihasik,” “sumisibol,” at “halamang-gulayan.” Inilagay ang [a] sa pariralang tungkol sa mga ibon at ang [b] sa “mamugad,” upang tumugma ang bawat marka sa aktuwal na nilalaman ng talababa.
