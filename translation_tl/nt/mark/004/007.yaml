  yaml_path: translation/nt/mark/004/007.yaml
  text: And other seed fell among the thorns[a], and the thorns came up and choked it[b], and it yielded no fruit.
translation:
  language: tl
  text: At may iba pang binhing nahulog sa mga tinik[a]. Tumubo ang mga tinik at sinakal ang binhi, at hindi ito namunga.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “papasok sa mga tinik.” Literal na “sa/pa-loob sa mga tinik” ang pang-ukol na Griyego, ngunit natural sa kontekstong ito ang “sa mga tinik.”
    reason: lexical_alternative
  - marker: b
    text: O, “hindi ito nagbunga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλο
  choice: iba namang binhi
  rationale: Ang pang-isahang neutrong anyo ay tumutukoy sa binhing ipinaghahasik sa naunang konteksto. Idinagdag ang “binhi” upang maging malinaw at natural sa Tagalog nang hindi nagdaragdag ng bagong ideya.
- source_word: ἔπεσεν
  choice: nahulog
  rationale: Tuwirang isinasalin nito ang pandiwang πίπτω; iniwasan ang “naihasik,” na magpapalit sa mismong pandiwang ginamit.
- source_word: εἰς τὰς ἀκάνθας
  choice: sa gitna ng mga halamang matinik
  rationale: Bagaman may literal na diwang “papasok sa,” natural na inilalarawan nito rito ang pagkahulog ng binhi sa lugar na may mga halamang matinik.
- source_word: ἀνέβησαν
  choice: tumubo
  rationale: Sa konteksto ng halaman, malinaw at likas na Tagalog ang “tumubo” para sa pag-ahon o paglaki ng mga halamang matinik.
- source_word: συνέπνιξαν
  choice: sinakal
  rationale: Pinananatili nito ang matingkad na larawang ang mga halamang matinik ay humadlang sa buhay at paglago ng binhi.
- source_word: αὐτό
  choice: ito
  rationale: Tumutukoy ang panghalip sa binhing nabanggit sa unang sugnay at hindi kailangang ulitin ang pangngalan.
- source_word: καρπὸν οὐκ ἔδωκεν
  choice: hindi ito namunga
  rationale: Natural na pananalitang pang-agrikultura sa Tagalog na tumpak na naghahayag na wala itong ibinigay na bunga.
