  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “mga halamang matinik” sa halip na “mga tinik” upang malinaw na mga tumutubong halaman ang tinutukoy. Pinanatili ang pag-uulit mula sa Griyego para sa malinaw na daloy ng tagpo.
