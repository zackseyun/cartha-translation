source:
  edition: SBLGNT
  text: Καὶ λέγει αὐτοῖς· Οὐκ οἴδατε τὴν παραβολὴν ταύτην, καὶ πῶς πάσας τὰς παραβολὰς γνώσεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/013.yaml
  text: And he says to them[a], “Do you not understand this parable? Then how will you understand all the parables?”
translation:
  language: tl
  text: At sinabi niya sa kanila[a], “Hindi ba ninyo nauunawaan ang talinghagang ito? Kung gayon, paano ninyo mauunawaan ang lahat ng talinghaga?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas pormal: “Hindi ba ninyo alam ang talinghagang ito? At paano ninyo malalaman ang lahat ng talinghaga?” Maaaring isaling “alam” o “malalaman” ang mga pandiwang Griyego, ngunit sa kontekstong ito ay tumutukoy ang mga ito sa pag-unawa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: sinabi niya
  rationale: Ginamit ang karaniwang panahunang pasalaysay sa Filipino. Bagaman nasa kasalukuyang panahunan ang Griyego bilang makasaysayang pangkasalukuyan, mas natural at marangal sa modernong Tagalog ang “sinabi niya” sa salaysay.
- source_word: οἴδατε
  choice: nauunawaan
  rationale: Bagaman maaaring mangahulugang “alam,” tumutukoy ito rito sa pag-unawa sa kahulugan ng talinghaga, hindi lamang sa pagkakilala rito.
- source_word: παραβολὴν
  choice: talinghaga
  rationale: Ito ang kinagawiang salitang Filipino para sa parable bilang anyo ng pagtuturo ni Jesus.
- source_word: ταύτην
  choice: ito
  rationale: Tuwirang tumutukoy sa talinghagang nauna nang isinalaysay.
- source_word: καὶ πῶς
  choice: Kung gayon, paano
  rationale: Ipinahahayag nang natural sa Filipino ang lohikal na bunga ng unang tanong, habang pinananatili ang ugnayang ipinakikita ng καί.
- source_word: πάσας τὰς παραβολὰς
  choice: lahat ng talinghaga
  rationale: Likas na katumbas sa Filipino ng pangkalahatang pagtukoy sa kabuuan ng mga talinghaga.
- source_word: γνώσεσθε
  choice: mauunawaan
  rationale: Sa konteksto, ang pandiwa ay tumutukoy sa pagtalos sa kahulugan ng mga talinghaga; pinananatili rin nito ang retorikal na pagkakatugma sa unang sugnay.
theological_decisions:
- issue: Ugnayan ng οἴδατε at γνώσεσθε
  choice: Parehong isinalin ayon sa diwang “unawain.”
  alternative: Isalin ang una bilang “alam” at ang ikalawa bilang “mauunawaan,” o kapwa bilang “alam.”
  rationale: Ang usapin ay ang pagtalos sa kahulugan ng mga talinghaga, hindi ang simpleng pagkakaroon ng kaalaman. Gayunman, itinatala sa talababa ang mas pormal na lexical na alternatibo upang hindi maitago ang pagkakaiba ng dalawang pandiwang Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “ninyo” at “talinghaga,” at iniwasan ang labis na literal na ayos na magiging asiwa sa karaniwang mambabasa.
