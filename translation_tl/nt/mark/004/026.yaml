  yaml_path: translation/nt/mark/004/026.yaml
  text: 'And he was saying[c][b][a], “The kingdom of God is like this: as when a man casts the seed upon the ground,”'
translation:
  language: tl
  text: 'Sinabi pa niya, “Ganito ang kaharian ng Diyos: tulad ng isang lalaking naghahasik ng binhi sa lupa,[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin, “Ganito ang kaharian ng Diyos: gaya ng isang lalaking maghahasik ng binhi sa lupa.” Siksik ang ayos ng paghahambing sa Griyego, at nagpapatuloy ito sa susunod na talata.'
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ ἔλεγεν
  choice: At sinabi niya
  rationale: Ang imperfect na ἔλεγεν ay maaaring magpahiwatig ng nagpapatuloy o paulit-ulit na pagsasalita, ngunit sa salaysay na Tagalog, ang “sinabi niya” ang likas at hindi labis na tiyak na anyo; pinananatili rin ng “At” ang Καί.
- source_word: Οὕτως ... ὡς
  choice: ay tulad ng
  rationale: Ipinapahayag nito nang likas sa Tagalog ang paghahambing na ipinakikilala ng pinagsamang Οὕτως at ὡς, habang hinahayaang magpatuloy ang larawan sa susunod na talata.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ang kaharian ng Diyos
  rationale: Karaniwan, malinaw, at malawak ang saklaw ng “kaharian,” kaya maaari nitong ipahiwatig kapwa ang paghahari at ang nasasakupan nang hindi nililimitahan ang kahulugan.
- source_word: ἄνθρωπος
  choice: isang lalaki
  rationale: Tumutukoy dito ang anyong panlalaking isahan sa kinatawang tauhan ng talinghaga; pinananatili ng “isang lalaki” ang kongkretong larawan ng Griyego.
- source_word: βάλῃ
  choice: nagsabog
  rationale: Literal na may diwang paghagis ang βάλλω, ngunit sa kontekstong agrikultural, malinaw na tumutukoy ito sa pagsasabog o paghahasik ng binhi. Pinananatili ng “nagsabog” ang kilos ng paghagis nang natural sa Tagalog.
- source_word: τὸν σπόρον
  choice: ng binhi
  rationale: Likas sa Tagalog ang walang tahasang pantukoy pagkatapos ng “nagsabog,” at ginagamit ang “binhi” sa pangkalahatang diwa gaya ng artikuladong pangngalang Griyego.
- source_word: ἐπὶ τῆς γῆς
  choice: sa lupa
  rationale: Sa konteksto ng paghahasik, ang γῆ ay lupang tinatamnan o ibabaw ng lupa, hindi ang daigdig sa kosmikong diwa.
theological_decisions:
- issue: Ang pinaikling paghahambing na nagpapatuloy sa susunod na talata
  choice: Panatilihin ang paghahambing at tapusin ang talata sa kuwit
  alternative: '“Ganito ang kaharian ng Diyos: para itong isang lalaking nagsasabog ng binhi sa lupa.”'
  rationale: Ang Οὕτως ... ὡς ay nagpapasimula ng paghahambing na hindi pa ganap sa talatang ito at nagpapatuloy sa talata 27. Ang kuwit ay nagpapanatili sa bukas na daloy nang hindi dinaragdagan ang paliwanag.
translation_notes:
  register: Makabago at madaling maunawaang Tagalog na may marangal na himig. Ginamit ang “nagsabog” sa halip na mas teknikal na “naghasik” upang mapanatili ang larawan ng paghagis sa βάλλω, ngunit nananatiling malinaw ang gawaing pagsasaka.
