  source_fidelity: Kailangang iwasto ang aspekto ng pangunahing pandiwa. Ang βάλῃ ay aorist subjunctive sa loob ng pinaikling paghahambing (ὡς ἄνθρωπος βάλῃ), kaya ang past na “nagsabog” ay masyadong nagsasarado sa kilos. Ang “naghahasik” ay natural na Tagalog sa ganitong bukas at nagpapatuloy-sa-sumusunod-na-talata na paghahambing. Ang “Sinabi pa niya” ay mas angkop na salaysay na katumbas ng imperfect na ἔλεγεν kaysa payak na “sinabi niya.”
  naturalness: 'Mas likas at malinaw sa makabagong Tagalog ang “Ganito ang kaharian ng Diyos: tulad ng isang lalaking naghahasik ng binhi sa lupa.” Pinananatili rin nito ang sinadyang hindi pa ganap na paghahambing sa pamamagitan ng pangwakas na kuwit.'
  terminology: Ang “kaharian ng Diyos,” “lalaki,” “binhi,” at “lupa” ay angkop at malinaw. Ang “naghahasik” ay mas karaniwang terminong pang-agrikultura kaysa “nagsasabog,” samantalang sapat pa ring naipahihiwatig ang paghahasik ng binhi sa konteksto.
