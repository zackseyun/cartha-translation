translation:
  language: tl
  text: At sinabi niya sa kanila, “Bakit kayo natatakot?[a] Wala pa ba kayong pananampalataya?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “Bakit kayo duwag?”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Griyego na πίστις ay maaari ding unawain dito bilang “pagtitiwala.”
