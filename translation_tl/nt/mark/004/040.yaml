lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Karaniwang pang-ugnay na nagdurugtong sa pananalitang ito sa naunang salaysay.
- source_word: εἶπεν αὐτοῖς
  choice: sinabi niya sa kanila
  rationale: Likas at malinaw na panimulang pahayag bago ang tuwirang pananalita; ipinakikita ng panghalip na maramihan kung sino ang kinakausap.
- source_word: Τί
  choice: Bakit
  rationale: Bagaman literal na “ano,” gumaganap itong patanong na pang-abay sa idyomang Griyego at nagpapahayag ng pagsaway.
- source_word: δειλοί
  choice: natatakot nang ganyan
  rationale: Tumutukoy sa matinding takot ng mga alagad sa bagyo at pinananatili ang mapanaway na lakas nang hindi agad ginagawa itong pangkalahatang hatol sa kanilang pagkatao.
- source_word: ἐστε
  choice: kayo ... natatakot
  rationale: Ang kasalukuyang anyo ng “maging” ay likas na ipinapaloob sa panaguring Filipino.
- source_word: οὔπω
  choice: pa ba ... wala
  rationale: Ang “wala pa ba” ang natural na Filipino para sa “hindi pa,” habang napapanatili ang temporal at retorikal na diin.
- source_word: ἔχετε
  choice: mayroon/kayong
  rationale: Ang pagkakaroon ay natural na ipinahahayag sa estrukturang “wala pa ba kayong...” sa negatibong tanong.
- source_word: πίστιν
  choice: pananampalataya
  rationale: Karaniwang salin ng πίστις at pinananatili ang teolohikal at leksikal na lawak nito; ang “pagtitiwala” ay inilalagay bilang alternatibo sa talababa.
theological_decisions:
- issue: Kahulugan ng πίστις sa konteksto ng panganib
  choice: pananampalataya
  alternative: pagtitiwala
  rationale: Sa konteksto, malinaw na kasali ang pagtitiwala kay Jesus, ngunit hindi tahasang tinutukoy ng Griyego ang layon. Pinananatili ng “pananampalataya” ang lawak ng termino, at itinatala ang kontekstuwal na alternatibo.
translation_notes:
  register: Makabagong, dignificado, at madaling maunawaang Filipino. Ginamit ang “natatakot nang ganyan” upang natural na ihatid ang matinding pagsaway, habang inilalagay sa talababa ang mas matalas na literal na alternatibong “duwag.”
