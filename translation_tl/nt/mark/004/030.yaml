  text: Καὶ ἔλεγεν· ⸀Πῶς ὁμοιώσωμεν τὴν βασιλείαν τοῦ θεοῦ, ἢ ἐν ⸀τίνι ⸂αὐτὴν παραβολῇ θῶμεν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/030.yaml
  text: And he was saying[a], “How should we compare the kingdom of God, or in what parable should we set it forth?”
translation:
  language: tl
  text: At sinabi niya, “Paano natin ihahambing ang kaharian ng Diyos, o sa pamamagitan ng anong talinghaga natin ito ilalahad[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa anong talinghaga natin ito ilalahad?” Maaaring unawain ang Griyegong ἐν τίνι παραβολῇ θῶμεν bilang pagbibigay-diin sa talinghagang ginagamit na kasangkapan sa paglalarawan sa kaharian.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: Sinabi pa niya
  rationale: Ang imperfect ay bahagi ng nagpapatuloy na salaysay at maaaring magpahiwatig ng patuloy o inuulit na pagsasalita. Sa kontekstong ito, likas sa Filipino ang “Sinabi pa niya,” na nag-uugnay sa kasunod na sinabi ni Jesus nang hindi labis na binibigyang-diin ang tagal.
- source_word: Πῶς
  choice: Paano
  rationale: Tuwirang ipinakikita ang tanong tungkol sa paraan ng paghahambing at natural sa makabagong Filipino.
- source_word: ὁμοιώσωμεν
  choice: natin ihahambing
  rationale: Ang aorist subjunctive sa deliberative question ay natural na naipahahayag sa Filipino sa anyong “Paano natin ihahambing,” na nagpapanatili sa sama-samang retorikal na tanong.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: ang kaharian ng Diyos
  rationale: Ito ang malinaw at nakaugaliang salin na nagpapanatili sa lawak ng larawang tumutukoy kapuwa sa paghahari at sa kaharian ng Diyos.
- source_word: ἐν τίνι ... παραβολῇ
  choice: sa anong talinghaga
  rationale: Pinananatili nito ang anyo ng Griyegong parirala at malinaw pa rin sa Filipino; maaaring maunawaan ang ἐν bilang saklaw o kasangkapan, kaya inilalahad sa talababa ang mas tahasang instrumental na anyo.
- source_word: παραβολῇ
  choice: talinghaga
  rationale: Ang “talinghaga” ang kinikilalang terminong Filipino para sa παραβολή sa mga Ebanghelyo at angkop sa uri ng pagtuturong ginamit ni Jesus.
- source_word: αὐτὴν ... θῶμεν
  choice: natin ito ilalahad
  rationale: Sa idyomang ito, ang literal na “ilagay” ay tumutukoy sa paghaharap o pagpapahayag ng kaharian sa pamamagitan ng isang talinghaga. Ang “ilalahad” ay natural ngunit pinananatili ang diwa ng paglalagay sa harap ng mga tagapakinig.
theological_decisions:
- issue: βασιλεία bilang kaharian o paghahari
  choice: kaharian ng Diyos
  alternative: paghahari ng Diyos
  rationale: Pinananatili ng “kaharian” ang tradisyonal at mas malawak na metapora ng βασιλεία. Ang “paghahari” ay maaaring idiin lamang ang aktibong pamamahala at paliitin ang posibleng saklaw ng salita rito.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang inklusibong “natin” upang tapat na katawanin ang unang panauhang maramihan ng mga pandiwa, at iniwasan ang mas lumang anyong “itutulad” o ang literal ngunit matigas na “ilalagay.”
