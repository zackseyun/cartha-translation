base_translation:
  language: en
  yaml_path: translation/nt/mark/004/025.yaml
  text: For whoever has[a], more will be given to him; and whoever does not have, even what he has will be taken away from him.
translation:
  language: tl
  text: Sapagkat ang sinumang mayroon ay bibigyan pa[a]; at ang sinumang wala, maging ang taglay niya ay kukunin mula sa kaniya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “bibigyan siya”; hindi tahasang binabanggit ang bagay na ibibigay. Ang “pa” ay ipinahihiwatig ng magkasalungat na bahagi ng kasabihan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: ang sinumang
  rationale: Ang panghalip na di-tiyak ay may pangkalahatan at kasabihang diwa; natural itong ipinapahayag sa modernong Tagalog sa pamamagitan ng “ang sinumang.”
- source_word: γὰρ
  choice: Sapagkat
  rationale: Nagbibigay ito ng paliwanag o batayan para sa naunang pahayag; pinananatili ng “Sapagkat” ang malinaw na ugnayang lohikal.
- source_word: ἔχει
  choice: mayroon
  rationale: Payak at malawak ang kahulugan ng pandiwa rito. Ang “mayroon” ay natural at hindi nililimitahan kung ano ang taglay.
- source_word: δοθήσεται αὐτῷ
  choice: ay bibigyan pa
  rationale: Walang tahasang layon sa Griyego, ngunit ipinahihiwatig ng pagtutulad ang karagdagang pagtanggap. Ang “pa” ay natural sa Tagalog at mas magaan kaysa pagdaragdag ng tahasang “higit pa.”
- source_word: καὶ
  choice: at
  rationale: Tuwirang pinag-uugnay nito ang dalawang magkasalungat na bahagi ng kasabihan.
- source_word: οὐκ ἔχει
  choice: wala
  rationale: Ang “wala” ang pinakanatural na katumbas sa Tagalog ng hindi pagkakaroon sa ganitong maikli at kasabihang pahayag.
- source_word: ὃ ἔχει
  choice: ang mayroon siya
  rationale: Pinananatili nito ang malawak at hindi tinukoy na bagay na tinutukoy ng panghalip na neuter.
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: ay kukunin sa kaniya
  rationale: Ipinahahayag nito ang hinaharap na pasibong pag-aalis nang malinaw at natural sa Tagalog.
theological_decisions:
- issue: Hindi tahasang layon ng δοθήσεται
  choice: Isalin bilang “bibigyan pa.”
  alternative: “bibigyan” lamang, nang walang “pa”
  rationale: Hindi sinasabi ng Griyego kung ano ang ibibigay, kaya hindi ito tinukoy sa salin. Gayunman, likas na ipinahihiwatig ng paghahambing ang pagdaragdag; ipinapakita ito ng “pa” nang hindi nagpapasok ng tiyak na bagay o doktrinal na pagpapakahulugan.
- issue: Pangkalahatang sanggunian sa anyong panlalaking isahan
  choice: Gamitin ang “ang sinumang ... siya/kaniya.”
  alternative: Maramihang “ang mga ... nila/kanila”
  rationale: Nananatili rito ang isahang pangkalahatang anyo ng Griyego. Sa Tagalog, walang kasariang ipinapataw ang “sinuman,” “siya,” at “kaniya,” kaya parehong tumpak at natural ang pahayag.
translation_notes:
  register: Maikli, marangal, at kasabihang estilo. Gumamit ng kasalukuyang karaniwang Tagalog; iniwasan ang labis na pormal na “sinumang nagtataglay” at pinanatiling hindi tiyak ang bagay na mayroon o ibinibigay.
