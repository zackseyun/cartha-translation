  yaml_path: translation/nt/mark/004/035.yaml
  text: And he says to them on that day[a], when evening had come, “Let us go across to the other side.”
translation:
  language: tl
  text: Nang araw na iyon, pagdating ng gabi, sinabi niya sa kanila, “Tumawid tayo sa kabilang panig.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: sinabi niya
  rationale: Ginamit ang likas na nakaraang panahunan sa salaysay na Tagalog. Ang Griyegong pangkasalukuyang anyo ay historical present, ngunit ang literal na “sinasabi niya” ay magiging alanganin dito sa karaniwang modernong Tagalog.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: Nang araw ding iyon
  rationale: Likas na temporal na parirala sa Tagalog; pinananatili ng “ding” ang tiyak na kaugnayan nito sa mga pangyayari nang araw na iyon.
- source_word: ὀψίας γενομένης
  choice: pagdating ng gabi
  rationale: Maikli at likas na salin ng genitive absolute na nagsasaad ng oras kung kailan naganap ang sinabi.
- source_word: Διέλθωμεν
  choice: Tumawid tayo
  rationale: Hortatoryong unang panauhang maramihan ang aorist subjunctive; malinaw at natural sa Tagalog ang “Tumawid tayo.”
- source_word: εἰς τὸ πέραν
  choice: sa kabilang ibayo
  rationale: Ipinahihiwatig ng konteksto ang kabilang panig ng lawa. Ang “kabilang ibayo” ay dignified ngunit karaniwang nauunawaan, at iniiwasan ang kalabisan ng “kabilang panig” kasunod ng pandiwang tumawid.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Hindi pinilit ang historical present ng Griyego dahil hindi ito likas sa salaysay na Tagalog; napanatili naman ang ayos ng oras at ang tuwirang paanyaya ni Jesus.
