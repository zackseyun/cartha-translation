  source_fidelity: Ang “sinaway ... ang hangin” at “sinabi sa dagat” ay tapat sa Griyego. Gayunman, ang “pagkabangon niya” ay higit na tumutukoy sa pagbangon kaysa sa paggising/pagkagising na nasa διεγερθείς. Ang “lubos na kumalma ang dagat” ay katanggap-tanggap sa diwa, ngunit ang Griyego ay nagsasaad nang mas tuwiran na nagkaroon ng malaking katahimikan.
  naturalness: Natural at marangal ang karamihan ng salin. Mas likas at mas tumpak sa kontekstong ito ang “Nang magising siya” kaysa “At pagkabangon niya.” Ang “nagkaroon ng malaking katahimikan” ay natural na Tagalog at iniiwasan ang hindi kailangang pagpapalit ng pokus sa dagat.
  terminology: Ang “sinaway,” “hangin,” at “dagat” ay angkop. Ang magkapares na utos na “Tumahimik ka! Pumirmi ka!” ay pinananatili bilang natural na pangkontekstong pagsasalin ng mariing mga utos, nang hindi nagdaragdag ng “kapayapaan.”
