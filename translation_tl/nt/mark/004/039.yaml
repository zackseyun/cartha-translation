  text: καὶ διεγερθεὶς ἐπετίμησεν τῷ ἀνέμῳ καὶ εἶπεν τῇ θαλάσσῃ· Σιώπα, πεφίμωσο. καὶ ἐκόπασεν ὁ ἄνεμος, καὶ ἐγένετο γαλήνη μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/039.yaml
  text: And having awakened[a], he rebuked the wind and said to the sea, “Be silent! Be still!” And the wind ceased[b], and there was a great calm.
translation:
  language: tl
  text: Nang magising siya[a], sinaway niya ang hangin at sinabi sa dagat[b], “Tumahimik ka! Pumirmi ka!” Tumigil ang hangin, at nagkaroon ng malaking katahimikan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nang siya ay gisingin.” Ang anyong pasibo sa Griyego ay maaaring magpahiwatig na may gumising sa kanya.
    reason: lexical_alternative
  - marker: b
    text: Ito ang Dagat ng Galilea, na tinatawag ding isang lawa; sa Griyego, “dagat.”
    reason: cultural_note
lexical_decisions:
- source_word: διεγερθεὶς
  choice: pagkabangon niya
  rationale: Likas sa modernong Tagalog at pinananatili ang temporal na diwa ng aorist participle, nang hindi tiyakang sinasabi sa pangunahing teksto kung kusa siyang nagising o ginising.
- source_word: ἐπετίμησεν
  choice: sinaway
  rationale: Ipinahahayag ang mariin at may-awtoridad na pagsaway ni Jesus; karaniwan at dignidad ang salitang ito sa Tagalog.
- source_word: τῷ ἀνέμῳ
  choice: ang hangin
  rationale: Tuwirang katumbas ng pangngalan sa Griyego; hindi idinaragdag sa salita mismo ang kontekstuwal na ideya ng bagyo.
- source_word: τῇ θαλάσσῃ
  choice: sa dagat
  rationale: Pinananatili ang karaniwang kahulugan ng θάλασσα at ang paraan ng paglalarawan ni Marcos, sa halip na gawing ‘lawa’ sa pangunahing teksto.
- source_word: Σιώπα
  choice: Tumahimik ka!
  rationale: Tuwiran, mariin, at natural na utos na huminto ang ingay.
- source_word: πεφίμωσο
  choice: Pumirmi ka!
  rationale: Natural na utos sa Tagalog sa konteksto ng maalon na dagat. Ipinahahayag nito ang hinihinging paghinto, samantalang inilalahad sa talababa ang literal na larawan ng pagbusal.
- source_word: ἐκόπασεν
  choice: Tumigil
  rationale: Maikli at tuwirang nagpapahayag na huminto ang hangin.
- source_word: γαλήνη μεγάλη
  choice: lubos na kumalma ang dagat
  rationale: Natural na Tagalog para sa resulta ng ‘matinding katahimikan’ o ‘malaking kapanatagan’ sa ibabaw ng dagat, nang hindi gumagamit ng salitang maaaring magpahiwatig lamang ng emosyonal na kapayapaan.
theological_decisions:
- issue: Kung gagamitin ang tradisyonal na pananalitang katumbas ng ‘Peace! Be still!’ o pananatilihin ang dalawang utos sa Griyego
  choice: 'Dalawang tuwirang utos: “Tumahimik ka! Pumirmi ka!”'
  alternative: “Payapa! Tumahimik ka!” o literal na “Tumahimik ka! Mabusalan ka!”
  rationale: Walang pangngalang nangangahulugang ‘kapayapaan’ sa Griyego. Pinananatili ng salin ang dalawang utos at ang mariing awtoridad ni Jesus, habang iniiwasan ang napakadi-likas na literal na utos na ‘Mabusalan ka!’ sa pangunahing teksto.
- issue: Kung isasalin ang θάλασσα bilang ‘dagat’ o ‘lawa’
  choice: dagat
  alternative: lawa
  rationale: ‘Dagat’ ang tuwirang katumbas ng salitang Griyego at pinananatili nito ang mismong paglalarawan ng salaysay. Nililinaw sa talababa ang heograpikong tinutukoy.
- issue: Kung tutukuyin kung kusa bang nagising si Jesus o ginising siya
  choice: Hindi tahasang tukuyin sa pangunahing teksto
  alternative: “pagkagising sa kanya”
  rationale: Ang anyong pasibo ng participle ay maaaring magpahiwatig na ginising siya, ngunit sa Tagalog ang ‘pagkabangon niya’ ay natural at hindi labis na nagtatakda ng tagaganap.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Gayunman, ang talababa [c] ay hindi ginamitan ng marker sa pangunahing teksto upang maiwasan ang pagputol sa sinabi ni Jesus.
