    issue: Ang “pagkabangon niya” ay hindi pinakamalapit na katumbas ng διεγερθείς.
    rationale: Sa salaysay, tumutukoy ito sa paggising ni Jesus mula sa pagtulog; ang “pagbangon” ay maaaring ilihis ang diin sa pisikal na pagtayo. Ang “Nang magising siya” ay mas tumpak at hindi pa rin pinapangalanan ang gumising sa kanya.
  - severity: low
