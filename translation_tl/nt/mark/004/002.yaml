translation_notes:
  register: Modernong Filipino na likas, malinaw, at marangal. Ginamit ang “talinghaga,” ang karaniwang terminong biblikal na madaling maunawaan. Pinanatili ang tutuldok dahil ipinakikilala ng talata ang tuwirang pananalita sa kasunod na talata.
