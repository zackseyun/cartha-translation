  text: 'And he was teaching them many things in parables[a], and in his teaching he was saying to them:'
translation:
  language: tl
  text: 'At maraming bagay ang itinuturo niya sa kanila sa pamamagitan ng mga talinghaga[a], at ito ang sinasabi niya sa kanila habang nagtuturo siya:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “marami ang itinuturo niya sa kanila sa pamamagitan ng mga talinghaga.” Ang Griegong πολλά ay maaaring mangahulugang “maraming bagay” o, sa mas maikling pananalita, “marami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίδασκεν
  choice: patuloy niya silang tinuturuan
  rationale: Ipinahahayag ng imperfect ang nagpapatuloy na pagtuturo sa tagpong ito; likas sa Filipino ang tahasang paggamit ng “patuloy.”
- source_word: ἐν παραβολαῖς
  choice: sa pamamagitan ng mga talinghaga
  rationale: Ipinakikita rito ng ἐν + dative ang paraan o kasangkapan ng pagtuturo. Mas malinaw at natural sa modernong Filipino ang “sa pamamagitan ng” kaysa “sa mga talinghaga.”
- source_word: πολλά
  choice: maraming bagay
  rationale: Ang neuter plural ay maaaring tumukoy sa malawak na nilalaman ng itinuro; pinananatili ng “maraming bagay” ang anyong maramihan at ang lawak nito.
- source_word: ἔλεγεν
  choice: sinabi niya
  rationale: Bagaman imperfect ang pandiwa, nagsisilbi itong pambungad sa tuwirang pananalita sa kasunod na talata. Sa Filipino, natural ang “sinabi niya” pagkatapos maipahiwatig na ng “Habang nagtuturo siya” ang nagpapatuloy na tagpo.
- source_word: ἐν τῇ διδαχῇ αὐτοῦ
  choice: Habang nagtuturo siya
  rationale: Inililipat ang literal na “sa kaniyang pagtuturo” sa natural na sugnay na Filipino habang pinananatili ang ugnayan ng sasabihin niya sa nagpapatuloy niyang pagtuturo.
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang panimulang pang-ugnay na karaniwan sa pasalaysay na estilo ni Marcos at ang tuloy-tuloy na kaugnayan sa naunang talata.
- source_word: αὐτοὺς / αὐτοῖς
  choice: sila / sa kanila
  rationale: Ang αὐτούς ay layon ng “tinuturuan,” samantalang ang αὐτοῖς ay di-tuwirang layon ng “sinabi,” kaya malinaw na pinag-iiba ang dalawang tungkulin sa Filipino.
