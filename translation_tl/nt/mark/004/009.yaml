  source_fidelity: 'Ang pangunahing pangungusap ay malapit sa Griyego: naipapanatili ang payak na καὶ, ang pangkalahatang puwersa ng Ὃς ἔχει, ang pangmaramihang ὦτα, at ang utos sa ἀκουέτω. Gayunman, ang “upang makinig” ay mas malinaw na nagpapahiwatig ng layunin kaysa sa kakayahan/kaangkupan na ipinahahayag ng infinitive na ἀκούειν sa kasabihang ito. Ang “para makarinig” ay mas tapat at mas natural sa Filipino sa kontekstong ito.'
  naturalness: Ang “Ang sinumang may mga tainga para makarinig ay makinig” ay natural na modernong Filipino at pinananatili ang sinadyang pag-uulit ng pandiwang may kaugnayan sa pagdinig/pakikinig. Ang kasalukuyang talababa na “At sinasabi niya” ay hindi likas bilang alternatibo sa nakaraang salaysay at maaaring magmukhang historical present na wala sa pangunahing salin.
  terminology: Ang “sinuman,” “mga tainga,” at “makinig” ay angkop na pangkalahatan, payak, at marangal. Hindi kailangan ang isang talababa para sa imperfect ng ἔλεγεν, dahil ang simpleng “sinabi niya” ay katanggap-tanggap na idiomatikong pagsasalin ng pambungad na pandiwang pasalaysay sa Tagalog nang hindi ipinipilit ang pag-uulit.
  issues:
