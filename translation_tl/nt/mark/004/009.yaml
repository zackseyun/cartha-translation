    issue: Ang “upang makinig” ay may diwang layunin.
    rationale: Sa Filipino, ang “upang” ay karaniwang nagsasaad ng layunin (“in order to”). Sa Griyego, ang ἀκούειν ay bahagi ng kasabihang “may mga tainga upang/para makarinig,” na mas mahusay na naipahahayag bilang kakayahan o kaangkupan sa “para makarinig.”
  - severity: medium
    issue: Hindi angkop ang talababa na “At sinasabi niya.”
    rationale: Ang ἔλεγεν ay imperfect na nakalugar sa nakaraang salaysay; ang “sinasabi niya” ay kasalukuyang anyo sa Tagalog at hindi ligtas na katumbas. Ang pagtatangkang gawing mas lantad ang imperfect ay hindi kinakailangan rito at ang iminungkahing alternatibo ay hindi natural.
  revised_text: At sinabi niya, “Ang sinumang may mga tainga para makarinig ay makinig.”
