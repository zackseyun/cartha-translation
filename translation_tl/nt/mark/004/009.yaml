  text: At sinabi niya, “Ang sinumang may mga tainga para makarinig ay makinig.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang payak na pag-uugnay sa naunang salaysay nang hindi nagdaragdag ng tiyak na temporal na diwa.
- source_word: ἔλεγεν
  choice: sinabi niya
  rationale: Natural na salaysay sa modernong Tagalog. Bagaman imperfect ang anyong Griyego at maaari ring isaling “sinasabi niya,” hindi kinakailangang ipahiwatig nito rito ang paulit-ulit na pagsasalita.
- source_word: Ὃς ἔχει
  choice: Ang sinumang may
  rationale: Ipinahahayag ang pangkalahatan at di-nakatali-sa-kasariang diwa ng pang-isahang konstruksiyong Griyego.
- source_word: ὦτα
  choice: mga tainga
  rationale: Tuwirang pinananatili ang pangmaramihang konkretong larawan ng tekstong Griyego.
- source_word: ἀκούειν
  choice: upang makinig
  rationale: Likas na ipinapahayag sa Tagalog ang layunin o kakayahang kaugnay ng mga tainga at pinananatili ang pag-uulit ng pandiwang ἀκούω.
- source_word: ἀκουέτω
  choice: ay makinig
  rationale: Natural na pangatlong-panauhang pautos sa Tagalog na nagpapanatili sa retorikal na pag-uulit at sa panawagang tumugon.
theological_decisions:
- issue: Pangkalahatang pananalita sa anyong panlalaking pang-isahan
  choice: Ang sinumang may ... ay makinig
  alternative: Ang may ... ay makinig
  rationale: Ang panlalaking pang-isahan sa Griyego ay pangkalahatan, hindi tumutukoy lamang sa lalaki. Naipahahayag ito ng “sinuman” sa Tagalog nang hindi binabago ang indibiduwal na tuon ng panawagan.
- issue: Saklaw ng pandiwang ἀκούω
  choice: makinig
  alternative: makarinig
  rationale: Maaaring tumukoy ang ἀκούω sa pagdinig o pakikinig. Sa pautos na ito, ang “makinig” ay likas na naghahatid ng panawagang bigyang-pansin ang sinabi, samantalang nananatili ang konkretong larawan ng “mga tainga.”
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Pinanatili ang anyong kasabihan, ang konkretong “mga tainga,” at ang sinadyang pag-uulit ng “makinig.”
