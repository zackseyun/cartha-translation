  source_fidelity: 'Tapat ang salin sa pangunahing daloy ng Griyego: ang maraming talinghaga ang paraan o midyum ng pagsasalita, ang “ang salita” ay tumutugon sa τὸν λόγον, at ang pangwakas na sugnay ay maingat na pinananatili ang kapasidad na “marinig” nang hindi ito pinapatingkad bilang “maunawaan.” Ang aspektong nagpapatuloy ng ἐλάλει ay naipahihiwatig ng “ipinahahayag niya.”'
  naturalness: Natural at malinaw ang modernong Filipino Tagalog. Ang “sa pamamagitan ng maraming talinghagang tulad nito” at “ayon sa abot ng kaya nilang marinig” ay maayos na nagpapahayag ng paraan at sukat na nasa teksto. Ang rehistro ay marangal ngunit hindi lipas.
  terminology: Ang “talinghaga” ay angkop at matatag na katawagan para sa παραβολαῖς. Ang “ang salita” ay leksikal na malapit sa λόγος at ang mga alternatibong “mensahe” at “turo” ay wastong nasa talababa. Hindi nagpapasok ang salin ng di-kinakailangang doktrinal na pagpapakahulugan.
