  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ τοιαύταις παραβολαῖς πολλαῖς ἐλάλει αὐτοῖς τὸν λόγον, καθὼς ἠδύναντο ἀκούειν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/033.yaml
  text: And with many such parables he was speaking the word to them[b][a], as they were able to hear it.
translation:
  language: tl
  text: At sa pamamagitan ng maraming talinghagang tulad nito, ipinahahayag niya sa kanila ang salita[a], ayon sa abot ng kaya nilang marinig.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mensahe” o “ang turo.”
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “hanggang sa kaya nilang pakinggan” o “ayon sa antas ng kaya nilang marinig.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιαύταις
  choice: tulad nito
  rationale: Tumutukoy ito sa uri ng mga talinghagang naunang ibinigay. Likas sa modernong Tagalog ang “tulad nito” at pinananatili nito ang paghahambing.
- source_word: παραβολαῖς
  choice: talinghaga
  rationale: Ito ang kinikilalang salin para sa παραβολή sa konteksto ng mga salaysay at paghahambing na ginagamit ni Jesus sa pagtuturo.
- source_word: πολλαῖς
  choice: maraming
  rationale: Tuwirang ipinapahayag ang dami at likas itong panuring sa Tagalog.
- source_word: ἐλάλει
  choice: ipinahahayag niya
  rationale: Ipinakikita ng aspektong imperpektibo ang nagpapatuloy o nakaugaliang pagsasalita. Ang “ipinahahayag niya” ay natural sa konteksto ng paghahatid ng mensahe, nang hindi nililimitahan ito sa isang pagkakataon lamang.
- source_word: αὐτοῖς
  choice: sa kanila
  rationale: Likas na katumbas ng datibong di-tuwirang layon ng λαλέω.
- source_word: τὸν λόγον
  choice: ang salita
  rationale: Pinananatili ang tuwirang anyo at biblikal na alingawngaw ng λόγος, habang kinikilala sa talababa na maaari rin itong tumukoy sa mensahe o turo.
- source_word: καθὼς
  choice: ayon sa abot ng
  rationale: Ipinahahayag dito ang antas o sukat ng pagtuturo ayon sa kakayahan ng mga nakikinig; mas malinaw at natural ito sa Tagalog kaysa sa payak na “gaya ng.”
- source_word: ἠδύναντο
  choice: kaya nilang
  rationale: Tuwirang ipinahahayag ang kanilang kakayahan o kapasidad, nang hindi ipinapalagay kung bakit may hangganan iyon.
- source_word: ἀκούειν
  choice: marinig
  rationale: Pinananatili ang pangunahing kahulugan na “makarinig.” Bagaman maaaring kasama sa konteksto ang pagkaunawa, hindi iyon tahasang ipinapalit sa pangunahing teksto.
theological_decisions:
- issue: Kahulugan ng τὸν λόγον sa ministeryo ng pagtuturo ni Jesus
  choice: Isinalin bilang “ang salita.”
  alternative: “ang mensahe” o “ang turo”
  rationale: Ang parirala ay tumutukoy sa nilalaman ng ipinahahayag ni Jesus. Pinananatili ng “ang salita” ang anyo ng Griyego at ang biblikal na idyoma nang hindi nagpapasok ng mas makitid na doktrinal na pakahulugan.
- issue: Ipinahihiwatig ng ἀκούειν
  choice: Isinalin bilang “marinig.”
  alternative: “maunawaan” o “tanggapin”
  rationale: Ang teksto ay tahasang nagsasaad ng kakayahan nilang makarinig. Maaaring ipahiwatig nito ang pagkaunawa at pagtanggap, ngunit pinananatili ng salin ang leksikal na kahulugan at ang tensiyong nasa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang tradisyonal ngunit madaling maunawaang “talinghaga” at ang biblikal na “ang salita,” habang ginawang natural ang sugnay na nagsasaad ng antas ng kakayahang makarinig.
