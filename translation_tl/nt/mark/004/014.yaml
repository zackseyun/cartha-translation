  text: ὁ σπείρων τὸν λόγον σπείρει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/014.yaml
  text: The sower sows the word[a].
translation:
  language: tl
  text: Ang naghahasik ay naghahasik ng salita[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mensahe.” Ang salitang Griyego na λόγος ay maaaring mangahulugang “salita” o “mensahe,” depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ σπείρων
  choice: Ang naghahasik
  rationale: Ang artikulong may pangkasalukuyang pandiwaring ginagamit bilang pangngalan ay tumutukoy sa taong kinikilalang gumagawa ng paghahasik. Natural ito sa Filipino at pinananatili ang larawan at pag-uulit ng ugat na makikita sa Griyego.
- source_word: τὸν λόγον
  choice: ng salita
  rationale: Malawak ang saklaw ng λόγος at maaari itong mangahulugang “salita” o “mensahe.” Pinananatili ng “salita” ang pagiging pangkalahatan ng Griyego at hindi nito maagang nililimitahan ang tinutukoy.
- source_word: σπείρει
  choice: ay naghahasik
  rationale: Ang pangkasalukuyang pautos? Hindi; ito ay pangkasalukuyang pasalaysay na nagsasaad ng karaniwang kilos sa pagpapaliwanag ng talinghaga. Ang “naghahasik” ay natural sa Filipino at pinananatili ang retorikal na pag-uulit kasama ng “Ang naghahasik.”
theological_decisions:
- issue: Ang tinutukoy ng “salita” sa paliwanag ng talinghaga
  choice: salita
  alternative: mensahe; salita ng Diyos; magandang balita
  rationale: τὸν λόγον lamang ang nasa Griyego. Bagaman ipinahihiwatig ng konteksto ang ipinahahayag na mensaheng mula sa Diyos, hindi tahasang sinasabi ng talatang ito ang “ng Diyos” o “magandang balita,” kaya hindi iyon idinagdag sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang payak at mariing pag-uulit na “naghahasik … naghahasik” sa Griyego. Ginamit ang “ng salita” bilang likas na layon ng pandiwang Filipino sa halip na artipisyal na tumbas ng artikulong Griyego.
