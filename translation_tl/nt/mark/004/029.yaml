base_translation:
  language: en
  yaml_path: translation/nt/mark/004/029.yaml
  text: But when the crop is ready[a], he immediately sends in the sickle, because the harvest has come.
translation:
  language: tl
  text: Ngunit kapag handa na ang pananim[a], agad niyang isinusugo ang karit, sapagkat dumating na ang anihan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “hinog na” o, mas literal, “ibinibigay ang sarili.” Di-pangkaraniwan ang aktibong pananalita sa Griyego: ang pananim mismo ang simuno at waring ibinibigay nito ang sarili upang anihin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Ngunit kapag
  rationale: Ipinahahayag ng ὅταν ang di-tiyak na panahong “kapag,” at pinananatili ng “ngunit” ang banayad na paglipat o pagsalungat ng δέ.
- source_word: παραδοῖ
  choice: handa na
  rationale: Karaniwang nangangahulugang “magbigay” o “magkaloob” ang pandiwa, ngunit dito ang pananim ang simuno at ang diwa ay na maaari na itong anihin. Likas sa modernong Tagalog ang “handa na”; inilalahad sa talababa ang di-pangkaraniwang aktibong pananalita ng Griyego.
- source_word: ὁ καρπός
  choice: ang pananim
  rationale: Bagaman maaari ring mangahulugang “bunga,” tumutukoy ito rito sa tumubong pananim na aanihin sa pamamagitan ng karit. Hindi nito nililimitahan ang larawan sa isang tiyak na uri ng butil.
- source_word: εὐθὺς
  choice: agad
  rationale: Tuwirang ipinahahayag ng “agad” ang mabilis na pagkilos na katangian ng paggamit ni Marcos sa εὐθύς.
- source_word: ἀποστέλλει τὸ δρέπανον
  choice: ipinapasok ang karit
  rationale: Literal na “ipinapadala ang karit” ang Griyego. Pinananatili ng “ipinapasok ang karit” ang masiglang larawan ng pagsisimula ng paggapas nang hindi nagiging labis na di-likas sa Tagalog.
- source_word: ὅτι
  choice: sapagkat
  rationale: Nagbibigay ang ὅτι ng dahilan ng agarang pagkilos; ang “sapagkat” ay malinaw at marangal sa salaysay.
- source_word: παρέστηκεν
  choice: dumating na
  rationale: Ipinahahayag ng anyong ganap na ang anihan ay sumapit at naririto na; nasasaklaw ito ng “dumating na.”
- source_word: ὁ θερισμός
  choice: ang anihan
  rationale: Ang “anihan” ay likas na katawagan sa pag-aani o panahong iyon at angkop sa larawan ng karit.
theological_decisions:
- issue: Ang kahandaan ng pananim bilang talinghaga tungkol sa kaharian
  choice: Panatilihin ang larawang agrikultural nang hindi tinutukoy kung ang anihan ay paghuhukom, misyon, o pangwakas na katuparan.
  alternative: Tahasang ipaliwanag ang “anihan” bilang isang partikular na pangyayaring teolohikal.
  rationale: Hindi mismo nililinaw ng talata ang tiyak na tinutukoy ng talinghaga. Dapat manatili sa salin ang ambiguwidad at tensiyong iyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinili ang “pananim” at “anihan” para sa likas na larawang bukid; ang talababa ang nagpapanatili sa di-pangkaraniwang anyo ng παραδοῖ.
