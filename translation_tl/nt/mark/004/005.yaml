  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸂καὶ ἄλλο⸃ ἔπεσεν ἐπὶ τὸ πετρῶδες ⸀ὅπου οὐκ εἶχεν γῆν πολλήν, καὶ ⸀εὐθὺς ἐξανέτειλεν διὰ τὸ μὴ ἔχειν βάθος γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/005.yaml
  text: And other seed fell on the rocky ground[a], where it did not have much soil, and it sprang up at once because it had no depth of soil.
translation:
  language: tl
  text: Ang iba namang binhi ay nahulog sa mabatong lupa[a], kung saan kakaunti lamang ang lupa. Agad itong sumibol dahil mababaw ang lupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lupang mabato.” Inilalarawan ng Griyego ang batuhing lugar na may manipis lamang na sapin ng lupa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλο
  choice: iba namang binhi
  rationale: Pang-uring neuter singular na ginamit bilang pangngalan; ipinahihiwatig ng naunang konteksto na binhi ang tinutukoy. Idinagdag ang “binhi” upang maging malinaw at natural sa Tagalog.
- source_word: πετρῶδες
  choice: mabatong lupa
  rationale: Tumutukoy sa lugar na may batong nasa ilalim at manipis na sapin ng lupa, hindi lamang sa lupang may ilang kalat na bato. Natural sa Tagalog ang “mabatong lupa,” habang nililinaw ng talababa ang larawan.
- source_word: γῆν πολλήν
  choice: kakaunti lamang ang lupa
  rationale: Bagaman literal na “hindi maraming lupa,” mas natural sa modernong Tagalog ang positibong anyong “kakaunti lamang,” at nananatili ang diwa ng manipis o kaunting lupang maaaring tubuan.
- source_word: εὐθὺς
  choice: agad
  rationale: Tuwirang ipinahahayag ang bigla at mabilis na pagsibol.
- source_word: ἐξανέτειλεν
  choice: sumibol
  rationale: Sa kontekstong agrikultural, tiyak na tumutukoy ang pandiwa sa pag-usbong ng halaman mula sa binhi.
- source_word: διὰ τὸ μὴ ἔχειν βάθος γῆς
  choice: dahil mababaw ang lupa
  rationale: Ang διά na may articular infinitive ay nagsasaad ng sanhi. Ang “mababaw ang lupa” ay natural at malinaw na Tagalog para sa kawalan ng lalim ng lupa.
- source_word: ὅπου
  choice: kung saan
  rationale: Natural na panandang panlunan na nag-uugnay sa mabatong lupa at sa kalagayan nito.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Pinanatili ang larawang agrikultural at ang ugnayang sanhi ng mabilis na pagsibol at mababaw na lupa.
