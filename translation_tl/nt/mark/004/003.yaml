  yaml_path: translation/nt/mark/004/003.yaml
  text: Listen! Behold[a], the sower went out to sow.
translation:
  language: tl
  text: 'Makinig kayo! Tingnan ninyo: lumabas ang manghahasik upang maghasik.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούετε
  choice: Makinig kayo!
  rationale: Pautos na nasa ikalawang panauhang maramihan at tumatawag ng pansin. Likas sa makabagong Tagalog ang “Makinig kayo!” at malinaw na pinananatili ang diin ng utos.
- source_word: ἰδού
  choice: Narito
  rationale: Panandang pansalita ito na nagtutuon ng pansin sa susunod na tagpo. Pinananatili ng “Narito” ang kapansin-pansing paghudyat ng salaysay; inilalagay sa talababa ang mas tuwirang “Tingnan ninyo.”
- source_word: ἐξῆλθεν
  choice: lumabas
  rationale: Tumutukoy sa pagkilos palabas. Ang “lumabas” ang pinakanatural at tuwirang katumbas sa kontekstong ito.
- source_word: ὁ σπείρων
  choice: ang manghahasik
  rationale: Ang artikulong may kasamang participle ay gumaganap bilang katawagan sa taong naghahasik. Ang “manghahasik” ay malinaw na katawagan sa papel niya sa tagpo.
- source_word: σπεῖραι
  choice: upang maghasik
  rationale: Pawatas na nagsasaad ng layunin ng paglabas. Likas na ipinahahayag sa Tagalog ng “upang maghasik” ang layuning ito.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kayo/ninyo” upang mapanatili ang maramihang kausap, at ang “Narito” upang maipakita ang natatanging panawag-pansin ng ἰδού nang hindi nagiging labis na arkaiko.
