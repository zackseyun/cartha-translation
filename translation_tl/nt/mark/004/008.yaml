base_translation:
  language: en
  yaml_path: translation/nt/mark/004/008.yaml
  text: And other seed fell into the good soil[a], and it was producing fruit, growing up and increasing, and bearing thirtyfold and sixtyfold and a hundredfold.
translation:
  language: tl
  text: At ang ibang binhi ay nahulog sa matabang lupa[a]. Namunga ito habang sumisibol at lumalago, at nagbunga nang tatlumpung ulit, animnapung ulit, at sandaang ulit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang iba ay nahulog sa matabang lupa,” na ipinahihiwatig ng konteksto ang salitang “binhi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: ang ibang binhi
  rationale: Ang pang-uring neuter plural ay ginagamit bilang pangngalan at tumutukoy sa binhing nabanggit sa konteksto; idinagdag ang “binhi” para sa likas at malinaw na Tagalog.
- source_word: γῆν τὴν καλήν
  choice: matabang lupa
  rationale: Sa kontekstong pansakahan, tumutukoy ito sa lupang mainam pagtamnan. Ang “matabang lupa” ang likas na modernong Tagalog para sa mabuting lupang mabunga.
- source_word: ἐδίδου καρπὸν
  choice: namunga
  rationale: Ipinahihiwatig ng imperfect ang nagpapatuloy na pamumunga; sa Tagalog, natural na naihahatid ito ng “namunga” sa daloy ng pangungusap.
- source_word: ἀναβαίνοντα
  choice: sumisibol
  rationale: Sa kontekstong pansakahan, inilalarawan ng participle ang pag-ahon o pagtubo ng halaman mula sa lupa; “sumisibol” ang malinaw at likas na katumbas.
- source_word: αὐξανόμενα
  choice: lumalago
  rationale: Pinananatili nito ang patuloy na paglaki at ang pagkakaiba nito sa naunang pagsibol.
- source_word: ἔφερεν
  choice: nagbunga
  rationale: Ipinahihiwatig ng imperfect ang patuloy o nagaganap na pagdadala ng ani; “nagbunga” ang natural na salitang kaugnay ng bungang binanggit.
- source_word: ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν ἑκατόν
  choice: nang tatlumpung ulit, animnapung ulit, at sandaang ulit
  rationale: Ang mga bilang ay nagpapahayag ng dami ng ani kung ihahambing sa naihasik. Malinaw na ipinahahayag ng “ulit” ang ratio ng ani sa karaniwang Tagalog.
theological_decisions: []
translation_notes:
  register: 'Modernong Filipino Tagalog na natural at marangal. Ginamit ang “matabang lupa” sa halip na literal na “mabuting lupa” upang maging malinaw ang kahulugang pansakahan. Pinanatili ang tatlong magkakaugnay ngunit magkaibang yugto: pagsibol, paglago, at pagbubunga.'
