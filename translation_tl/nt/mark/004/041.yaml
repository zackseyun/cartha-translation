  text: καὶ ἐφοβήθησαν φόβον μέγαν, καὶ ἔλεγον πρὸς ἀλλήλους· Τίς ἄρα οὗτός ἐστιν ὅτι καὶ ὁ ἄνεμος καὶ ἡ θάλασσα ⸀ὑπακούει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/041.yaml
  text: And they feared a great fear[a], and they said to one another, “Who then is this, that even the wind and the sea obey him?”
translation:
  language: tl
  text: At labis silang natakot[a] at sinabi nila sa isa’t isa, “Sino nga ba ito, na pati ang hangin at ang dagat ay sumusunod sa kanya?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “natakot sila ng malaking takot.” Gumagamit ang Griyego ng mariing parirala upang ipahayag ang matinding takot.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφοβήθησαν φόβον μέγαν
  choice: labis silang natakot
  rationale: Ang pandiwa at kaugnay nitong pangngalan ay bumubuo ng mariing pahayag. Likas sa modernong Tagalog ang “labis silang natakot,” samantalang pinananatili sa talababa ang mas literal na anyo.
- source_word: ἔλεγον
  choice: sinabi nila
  rationale: Bagaman maaaring magpahiwatig ng nagpapatuloy o paulit-ulit na pagsasalita ang imperfect, ang payak na naganap na anyo ang natural sa salaysay at sapat sa konteksto.
- source_word: πρὸς ἀλλήλους
  choice: sa isa’t isa
  rationale: Malinaw at likas nitong ipinapahayag ang tugunang pag-uusap ng mga alagad.
- source_word: Τίς ἄρα οὗτός ἐστιν
  choice: Sino nga ba ito
  rationale: Ipinahihiwatig ng ἄρα ang pagtataka at paghinuha bunga ng nasaksihan; likas itong naipapahayag ng “nga ba” sa Tagalog.
- source_word: ὅτι
  choice: na
  rationale: Ipinakikilala nito ang bagay na pinagbabatayan ng kanilang tanong, at “na” ang likas na pang-ugnay sa Tagalog.
- source_word: καὶ ὁ ἄνεμος καὶ ἡ θάλασσα
  choice: pati ang hangin at ang dagat
  rationale: Nakukuha ng “pati” ang mariing diwa ng unang καί na nangangahulugang “maging,” habang pinag-uugnay ng ikalawang καί ang hangin at dagat.
- source_word: ὑπακούει αὐτῷ
  choice: sumusunod sa kanya
  rationale: Sa kontekstong ito, inilalarawan ang hangin at dagat na tumutugon at sumusunod sa utos ni Jesus. Likas ang “sumusunod sa kanya” at pinananatili nito ang diwa ng kanyang awtoridad.
theological_decisions:
- issue: Paglalarawan sa awtoridad ni Jesus sa sangnilikha
  choice: Panatilihin ang tuwirang tanong ng mga alagad at ang pagsunod ng hangin at dagat nang walang dagdag na paliwanag tungkol sa pagkakakilanlan ni Jesus.
  alternative: Palawakin ang tanong upang tahasang ipahayag ang isang doktrinal na konklusyon tungkol sa kanyang banal na pagkakakilanlan.
  rationale: Malakas na ipinahihiwatig ng mismong talata ang pambihirang awtoridad ni Jesus, ngunit iniiwan nitong nasa anyong tanong ang tugon ng mga alagad. Dapat panatilihin ng salin ang bigat at tensiyong iyon nang hindi inuunahan ang teksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “labis silang natakot” upang maipahayag ang diin ng Griyego nang hindi nagiging asiwa sa Tagalog; inilagay sa talababa ang mas literal na anyo.
