  source_fidelity: Tumpak na naihahatid ng pangunahing teksto ang diin ng αὐτός, ang lokasyong πρύμνῃ, ang nagpapatuloy na pagtulog, at ang apurahan at mapanumbat na tanong ng mga alagad. Ang “mamamatay na tayo” ay isang ligtas at natural na paglilinaw ng napipintong kapahamakan sa kontekstong ito. Gayunman, ang talababa ay hindi tumpak na inilalarawan ang προσκεφάλαιον bilang maaaring “kutson”; ang salita ay tumutukoy sa unan o pansuportang kutson para sa ulo, hindi sa kutson na hihigaan.
  naturalness: Natural at malinaw ang “hulihan ng bangka” at “Ginising nila siya.” Ang “hindi ba ninyo alintana” ay marangal at nananatiling matalas ang tono ng panunumbat. Maayos din ang daloy ng pangungusap sa modernong Filipino.
