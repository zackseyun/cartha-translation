  text: καὶ ⸂αὐτὸς ἦν⸃ ⸀ἐν τῇ πρύμνῃ ἐπὶ τὸ προσκεφάλαιον καθεύδων· καὶ ⸀ἐγείρουσιν αὐτὸν καὶ λέγουσιν αὐτῷ· Διδάσκαλε, οὐ μέλει σοι ὅτι ἀπολλύμεθα;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/038.yaml
  text: But he himself was in the stern[a], asleep on the cushion; and they woke him and said to him, “Teacher, do you not care that we are perishing?”
translation:
  language: tl
  text: Ngunit siya mismo ay nasa hulihan ng bangka, natutulog sa unan[a]. Ginising nila siya at sinabi sa kanya, “Guro, hindi ba ninyo alintana na mamamatay na tayo?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pansuportang unan para sa ulo.” Ang salitang Griyego ay maaaring tumukoy sa isang unan o pansuportang kutson para sa ulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς ἦν
  choice: siya mismo ay nasa
  rationale: Pinananatili ng “siya mismo” ang pagbibigay-diin at paghahambing na dala ng tahasang αὐτός.
- source_word: πρύμνῃ
  choice: hulihan ng bangka
  rationale: Tumpak nitong tinutukoy ang stern o likurang bahagi ng bangka, ngunit mas madaling maunawaan ng karaniwang mambabasang Filipino kaysa sa teknikal na terminong pandagat.
- source_word: ἐπὶ τὸ προσκεφάλαιον
  choice: sa unan
  rationale: Ang προσκεφάλαιον ay unan o kutson na pansuporta sa ulo. Hindi idinagdag sa pangunahing teksto na nakapatong dito ang ulo ni Jesus, sapagkat hindi iyon tahasang sinasabi ng parirala.
- source_word: καθεύδων
  choice: natutulog
  rationale: Likas na ipinahahayag sa Filipino ang nagpapatuloy na kalagayan ni Jesus sa sandaling iyon.
- source_word: ἐγείρουσιν
  choice: Ginising
  rationale: Isinalin sa nakaraang panahong pasalaysay ang historical present upang maging natural sa modernong Filipino.
- source_word: λέγουσιν
  choice: sinabi
  rationale: Isinalin din ang historical present sa karaniwang nakaraang anyong pasalaysay sa Filipino.
- source_word: Διδάσκαλε
  choice: Guro
  rationale: Tuwirang katumbas ito ng διδάσκαλος at hindi nagdaragdag ng ibang diwa gaya ng maaaring ipahiwatig ng “Panginoon” o “Amo.”
- source_word: οὐ μέλει σοι
  choice: hindi ba ninyo alintana
  rationale: Pinananatili nito ang matalas at mapanumbat na tanong, habang gumagamit ng magalang ngunit kasalukuyan at marangal na pananalita sa pagharap kay Jesus.
- source_word: ἀπολλύμεθα
  choice: mamamatay na tayo
  rationale: Sa konteksto ng matinding unos, malinaw at natural nitong ipinahahayag ang napipintong pagkamatay na saklaw ng ἀπόλλυμι, nang hindi nagdaragdag ng tiyak na paraan gaya ng “malulunod.”
theological_decisions:
- issue: Tindi ng tanong ng mga alagad kay Jesus
  choice: “hindi ba ninyo alintana na mamamatay na tayo?”
  alternative: “hindi ba mahalaga sa inyo na nanganganib tayong mamatay?”
  rationale: Ang Griyego ay isang apurahan at mapanumbat na tanong, hindi lamang mahinahong paghingi ng tulong. Pinananatili ng salin ang tensiyong ito nang hindi hinuhusgahan ang motibo ni Jesus o ipinapaliwanag ang pananampalataya ng mga alagad.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang “hulihan ng bangka” sa halip na teknikal na terminong pandagat, at ang magalang na panghalip na “ninyo” sa tuwirang pakikipag-usap kay Jesus.
