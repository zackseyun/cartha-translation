  verdict: revise
  source_fidelity: Tumpak ang pangunahing diwa at napapanatili ang imperpektibong, nakagawiang aspekto ng dalawang pandiwa. Gayunman, ang “kapag sila-sila lamang” ay hindi sapat na malinaw kung sino ang tinutukoy na magkakasama at hindi tahasang naikakabit ang pribadong pagpapaliwanag sa mga alagad, gaya ng nasa Griyegong datibo τοῖς ἰδίοις μαθηταῖς.
  naturalness: Natural ang “nang walang talinghaga,” “mga alagad,” at “ipinaliliwanag niya ang lahat.” Mas malinaw at mas likas sa modernong Filipino ang “kapag siya ay nag-iisa kasama ng sarili niyang mga alagad,” na malinaw na nagsasaad ng pribadong kalagayan nang hindi lumilikha ng malabong reperensiya sa “sila.”
  terminology: Ang “talinghaga” ay angkop na matatag na terminong biblikal para sa παραβολή. Ang “sarili niyang mga alagad” ay wastong nagbibigay-diin sa ἰδίοις. Ang “ipinaliliwanag” ay angkop para sa ἐπέλυεν; ang alternatibong “binibigyang-kahulugan” ay kapaki-pakinabang na tala ngunit hindi dapat ipakahulugang tanging interpretasyon lamang.
  issues:
