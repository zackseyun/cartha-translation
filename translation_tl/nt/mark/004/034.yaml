base_translation:
  language: en
  yaml_path: translation/nt/mark/004/034.yaml
  text: And he was not speaking to them without a parable[b][a], but in private he was explaining everything to his own disciples.
translation:
  language: tl
  text: Hindi siya nagsasalita sa kanila nang walang talinghaga; ngunit kapag siya ay nag-iisa kasama ng sarili niyang mga alagad, ipinaliliwanag niya sa kanila ang lahat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pandiwang isinaling “ipinaliliwanag” ay maaari ring mangahulugang “binibigyang-kahulugan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς παραβολῆς
  choice: nang walang talinghaga
  rationale: Likas na katumbas ito ng ‘without a parable’ at pinananatili ang tahasang pagtukoy sa paraan ng pagtuturo ni Jesus.
- source_word: οὐκ ἐλάλει αὐτοῖς
  choice: Hindi siya nagsasalita sa kanila
  rationale: Ang aspektong imperpektibo ay inilalarawan bilang nakagawian o nagpapatuloy na kilos sa buod na ito.
- source_word: κατ’ ἰδίαν
  choice: kapag sila-sila lamang
  rationale: Likas sa modernong Tagalog at malinaw na ipinakikita ang kaibahan ng pampublikong pagtuturo at pribadong pagpapaliwanag.
- source_word: τοῖς ἰδίοις μαθηταῖς
  choice: sa sarili niyang mga alagad
  rationale: Pinananatili ng ‘sarili niyang’ ang diin ng ἰδίοις, hindi lamang ang karaniwang pagmamay-ari.
- source_word: ἐπέλυεν
  choice: ipinaliliwanag niya
  rationale: Saklaw nito ang kahulugang ‘explain/interpret’ at natural sa kasalukuyang Tagalog; ipinahihiwatig rin ng anyo ang nakagawiang pagkilos.
- source_word: πάντα
  choice: ang lahat
  rationale: Hindi nililimitahan ang saklaw sa ‘lahat ng talinghaga’ o ‘lahat ng sinabi niya,’ sapagkat πάντα lamang ang nasa Griyego.
theological_decisions:
- issue: Saklaw ng pribadong pagpapaliwanag ni Jesus
  choice: ang lahat
  alternative: lahat ng talinghaga / lahat ng sinabi niya
  rationale: Hindi tinutukoy ng Griyego ang eksaktong saklaw ng πάντα. Pinananatili ng salin ang pagiging bukás nito sa halip na paliitin ayon sa konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang ‘talinghaga’ bilang pamilyar na terminong biblikal, at ang ‘kapag sila-sila lamang’ bilang natural na pagpapahayag ng pribadong kalagayan.
