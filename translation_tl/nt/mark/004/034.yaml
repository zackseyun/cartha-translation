    issue: Malabo ang saklaw at reperensiya ng “kapag sila-sila lamang.”
    rationale: Hindi malinaw sa Tagalog kung sino ang tinutukoy ng “sila,” at ang parirala ay hindi tuwirang nagsasaad na si Jesus ay pribadong kasama ng kanyang mga alagad. Ang κατ’ ἰδίαν ay nangangahulugang “nang sarilinan/pribado,” at ang τοῖς ἰδίοις μαθηταῖς ay ang mga tumatanggap ng pagpapaliwanag.
  revised_text: Hindi siya nagsasalita sa kanila nang walang talinghaga; ngunit kapag siya ay nag-iisa kasama ng sarili niyang mga alagad, ipinaliliwanag niya sa kanila ang lahat.[a]
