id: MRK.4.21
reference: Mark 4:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἔλεγεν ⸀αὐτοῖς· Μήτι ⸂ἔρχεται ὁ λύχνος⸃ ἵνα ὑπὸ τὸν μόδιον τεθῇ ἢ ὑπὸ τὴν κλίνην, οὐχ ἵνα ἐπὶ τὴν λυχνίαν ⸀τεθῇ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/021.yaml
  text: And he was saying to them[a], “A lamp does not come to be put under a basket or under a bed[b], does it? Is it not to be put on the lampstand?”
translation:
  language: tl
  text: Sinabi pa niya sa kanila, “Dumarating ba ang isang lampara[a] para ilagay sa ilalim ng takalan[b] o sa ilalim ng higaan? Hindi ba para ilagay sa patungan ng lampara?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na inilalarawan sa Griyego ang lampara na “dumarating,” na para bang kumikilos itong tulad ng isang tao.
    reason: lexical_alternative
  - marker: b
    text: Ang “takalan” ay isang sisidlang ginagamit na panukat para sa tuyong kalakal.
    reason: cultural_note
lexical_decisions:
- source_word: Καὶ ἔλεγεν αὐτοῖς
  choice: Sinabi pa niya sa kanila
  rationale: Ang imperfect na ἔλεγεν ay nagpapatuloy sa salaysay at maaaring magpahiwatig ng patuloy na pagsasalita. Ang “Sinabi pa niya” ay likas na Filipino para sa karagdagang sinabi ni Jesus sa parehong tagpo nang hindi labis na ipinapakahulugang paulit-ulit niya itong sinabi.
- source_word: Μήτι
  choice: Dumarating ba ...?
  rationale: Ang Μήτι ay nagpapakilala ng tanong na inaasahang sasagutin nang hindi. Sa Filipino, naipahihiwatig ito ng retorikal na tanong at pinagtitibay ng kasunod na “Hindi ba.”
- source_word: ἔρχεται ὁ λύχνος
  choice: Dumarating ba ang isang lampara
  rationale: Pinananatili nito ang masigla at personipikadong larawan ng Griyego, sa halip na gawing pasibong “dinadala ba.” Ginamit ang “isang” upang ipahayag ang pangkalahatang diwa ng kasabihan.
- source_word: λύχνος
  choice: lampara
  rationale: Tumutukoy ito sa kongkretong ilawang karaniwang nilalagyan ng langis, hindi sa liwanag bilang abstraktong bagay. Karaniwan at malinaw sa modernong Filipino ang “lampara.”
- source_word: μόδιον
  choice: takalan
  rationale: Ang μόδιος ay isang panukat ng tuyong kalakal at maaari ring tumukoy sa sisidlang ginagamit sa pagsukat. Pinananatili ng “takalan” ang tungkulin ng bagay sa halip na gawing pangkalahatang basket lamang.
- source_word: κλίνην
  choice: higaan
  rationale: Maaaring tumukoy ang κλίνη sa kama o higaan. Ang “higaan” ay natural, malawak ang saklaw, at malinaw sa larawang pambahay.
- source_word: λυχνίαν
  choice: patungan ng lampara
  rationale: Tiyak na tumutukoy ang λυχνία sa patungang pinaglalagyan ng lampara. Mas malinaw ito sa karaniwang mambabasa kaysa sa teknikal o di-pamilyar na katawagan.
- source_word: ἵνα ... τεθῇ
  choice: para ilagay
  rationale: Likas na ipinapahayag ng pariralang ito sa Filipino ang layunin ng paglalagay habang pinananatili ang pasibong diwa na hindi tinutukoy kung sino ang naglalagay.
theological_decisions:
- issue: Kung pananatilihin ang personipikadong “dumarating ang lampara” o gagawing mas karaniwang “dinadala ang lampara”
  choice: Dumarating ba ang isang lampara
  alternative: Dinadala ba ang isang lampara
  rationale: Sadyang masigla ang aktibong pananalita sa Griyego. Pinananatili ito upang huwag alisin ang retorikal na anyo ng kasabihan, at nililinaw sa talababa ang literal na larawan.
- issue: Kung tiyak o pangkalahatan ang ὁ λύχνος
  choice: isang lampara
  alternative: ang lampara
  rationale: Bagaman may artikulo sa Griyego, pangkalahatang simulain ang ipinahahayag. Ang “isang lampara” ay natural na paraan sa Filipino upang ihayag ang generic na kahulugan nang hindi binabago ang punto.
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Pinanatili ang retorikal na tanong at ang kakaibang personipikasyon ng lampara; gumamit ng maikling talababa upang hindi maging malabo ang larawan. Ang “takalan” ay mas tapat sa sinaunang gamit ng μόδιος kaysa sa pangkalahatang “basket,” at ipinaliwanag ito para sa karaniwang mambabasa.
