  text: ⸀αὐτομάτη ἡ γῆ καρποφορεῖ, πρῶτον χόρτον, ⸂εἶτα στάχυν, εἶτα⸃ ⸂πλήρης σῖτον⸃ ἐν τῷ στάχυϊ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/028.yaml
  text: 'The soil bears fruit by itself: first the stalk[a], then the head, then the full grain in the head.'
translation:
  language: tl
  text: 'Kusang namumunga ang lupa: una’y usbong, saka uhay, at saka butil na lubos nang nabuo sa uhay.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτομάτη
  choice: kusang
  rationale: Ipinahihiwatig nito na namumunga ang lupa nang walang nakikitang tuwirang pagkilos ng tao. Ang “kusang” ay natural at hindi kasing-mekanikal ng “awtomatiko.”
- source_word: ἡ γῆ
  choice: ang lupa
  rationale: Sa kontekstong pansakahan, tumutukoy ito sa lupang tinamnan. Malinaw at karaniwan sa modernong Filipino ang “lupa.”
- source_word: καρποφορεῖ
  choice: namumunga
  rationale: Pinananatili nito ang larawan ng halaman o pananim na nagbubunga at likas ang pagkakasabi sa Filipino.
- source_word: πρῶτον χόρτον
  choice: una’y usbong
  rationale: Sa paglago ng halamang butil, ang χόρτος ay ang unang luntiang sibol o talim ng halaman. Mas malinaw sa karaniwang mambabasa ang “usbong” kaysa sa literal na “damo.”
- source_word: εἶτα στάχυν
  choice: saka uhay
  rationale: Ang στάχυς ay uhay ng halamang butil. Ang “saka” ay malinaw na naghahanay sa sunod-sunod na yugto ng paglago.
- source_word: πλήρης σῖτον ἐν τῷ στάχυϊ
  choice: butil na lubos nang nabuo sa uhay
  rationale: Ipinahahayag nito na ang butil sa loob ng uhay ay ganap o punô na, nang hindi labis na tinutukoy ang uri bilang trigo o tahasang idinaragdag ang ideya ng pagkahinog.
theological_decisions: []
translation_notes:
  register: 'Gumamit ng payak ngunit marangal na modernong Filipino. Pinanatili ang maikli at maindayog na pagkakasunod-sunod ng mga yugto: usbong, uhay, at ganap na nabuong butil. Hindi nilagyan ng paliwanag na teolohikal ang likas na paglago na inilalarawan ng talinghaga.'
