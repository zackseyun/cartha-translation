  text: καὶ ἐγένετο ἐν τῷ σπείρειν ὃ μὲν ἔπεσεν παρὰ τὴν ὁδόν, καὶ ἦλθεν τὰ πετεινὰ καὶ κατέφαγεν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/004.yaml
  text: And as he was sowing[a], some seed fell along the path, and the birds came and devoured it.
translation:
  language: tl
  text: Habang naghahasik siya, may binhing nahulog sa tabi ng daan.[a] Dumating ang mga ibon at nilamon iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa kahabaan ng landas.” Ang pariralang Griyego ay tumutukoy sa lugar sa tabi o kahilera ng isang daan o landas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ σπείρειν
  choice: Habang naghahasik siya
  rationale: Likas na ipinahahayag sa Filipino ang temporal na diwa ng idyomatikong konstruksiyong Griyego nang hindi isinasama ang matigas na literal na ‘nangyari.’
- source_word: ὃ μὲν
  choice: may binhing
  rationale: Tumutukoy ito sa isang bahagi ng binhing inihahasik. Ang ‘may binhing’ ay natural sa Filipino at pinananatili ang kolektibong diwa.
- source_word: ἔπεσεν
  choice: nahulog
  rationale: Tuwirang katumbas ng pandiwang πίπτω sa kontekstong ito.
- source_word: παρὰ τὴν ὁδόν
  choice: sa tabi ng daan
  rationale: Ipinahahayag nito ang lokasyong katabi o kahilera ng dinaraanan; malinaw at natural ito sa tagpong bukirin.
- source_word: τὰ πετεινὰ
  choice: ang mga ibon
  rationale: Sapat na katumbas ito ng πετεινά; walang karagdagang pariralang ‘sa himpapawid’ sa tekstong Griyego ng talatang ito.
- source_word: κατέφαγεν
  choice: nilamon
  rationale: Pinananatili ng ‘nilamon’ ang masidhing diwa ng tambalang pandiwang κατεσθίω, higit sa payak na ‘kinain.’
- source_word: αὐτό
  choice: iyon
  rationale: Tumutukoy ang panghalip sa bahaging binhi bilang isang kolektibong bagay; natural dito ang isahang ‘iyon.’
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘naghahasik’ bilang karaniwang katawagan sa pagsasabog o pagtatanim ng binhi, at ‘nilamon’ upang mapanatili ang tindi ng pandiwang Griyego.
