id: MRK.4.18
reference: Mark 4:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ⸀ἄλλοι εἰσὶν οἱ εἰς τὰς ἀκάνθας σπειρόμενοι· ⸂οὗτοί εἰσιν⸃ οἱ τὸν λόγον ⸀ἀκούσαντες,
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/018.yaml
  text: And others are those sown among the thorns[a]; these are the ones who have heard the word[b],
translation:
  language: tl
  text: At ang iba naman ay ang mga naihasik sa gitna ng mga tinik[a]; sila ang mga nakarinig sa salita[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga tinik.”
    reason: lexical_alternative
  - marker: b
    text: O “mensahe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλοι
  choice: ang iba naman
  rationale: Likas sa modernong Tagalog ang pariralang ito para sa substantibong pang-uri at malinaw nitong ipinagpapatuloy ang paghahambing sa ibang pangkat.
- source_word: εἰς τὰς ἀκάνθας
  choice: sa gitna ng mga tinik
  rationale: Pinananatili nito ang larawan ng binhing napunta sa lugar na may mga tinik, habang mas natural ito sa Tagalog kaysa sa literal na 'papasok sa mga tinik.'
- source_word: ἀκάνθας
  choice: mga tinik
  rationale: Karaniwan at kongkretong katumbas ito sa konteksto ng talinghaga; hindi ipinapalagay kung mga halamang matinik o tinik mismo ang partikular na tinutukoy.
- source_word: σπειρόμενοι
  choice: mga naihasik
  rationale: Pinananatili ang pasibong metapora ng paghahasik at natural na ipinahihiwatig ang pangyayaring naganap na.
- source_word: οὗτοί εἰσιν
  choice: sila ang
  rationale: Natural na pormula ng pagkakakilanlan sa Tagalog na malinaw na inuugnay ang naunang pangkat sa kasunod na paglalarawan.
- source_word: οἱ ... ἀκούσαντες
  choice: mga nakarinig
  rationale: Ang anyong naganap na 'nakarinig' ay tumutugma sa aorist participle at naghahanda sa mga susunod na pangyayari sa talata 19.
- source_word: τὸν λόγον
  choice: salita
  rationale: Pinananatili ang biblikal na idyoma at ugnayan nito sa naunang mga talata; maaari rin itong unawain bilang ipinahayag na mensahe.
theological_decisions:
- issue: Metaporikal na pagkakakilanlan ng mga tao sa binhing inihasik
  choice: 'Panatilihin ang literal na metapora: ''ang mga naihasik sa gitna ng mga tinik'''
  alternative: ang mga taong katulad ng binhing nahasik sa lupang matinik
  rationale: Tuwirang ipinagpapatuloy ng Griyego ang metapora ng binhi. Ang hindi paglalantad ng paliwanag sa loob ng teksto ay nagpapanatili sa anyo at tensiyong pampanitikan ng paliwanag ni Jesus.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang 'naihasik' sa halip na mas kolokyal na anyo upang mapanatili ang metapora at ang pormal na himig. Ang kuwit sa hulihan ay pinanatili dahil nagpapatuloy ang pangungusap sa susunod na talata.
