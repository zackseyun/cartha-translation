  text: And a great windstorm arose[a], and the waves were breaking into the boat[c][b], so that the boat was already filling.
translation:
  language: tl
  text: At bumangon ang isang malakas na unos[a], at paulit-ulit na bumubuhos sa bangka ang mga alon[b], kaya ang bangka ay napupuno na[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas pormal, “isang malaking unos ng hangin.”
    reason: lexical_alternative
  - marker: b
    text: O “paulit-ulit na humahampas at pumapasok sa bangka ang mga alon.” Ang pandiwang Griyego ay naglalarawan ng paulit-ulit o nagpapatuloy na kilos.
    reason: lexical_alternative
