    text: O, mas pormal, “ang bangka ay pinupuno na.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γίνεται
  choice: bumangon
  rationale: Ang makasaysayang pangkasalukuyan sa masiglang salaysay ni Marcos ay likas na isinalin sa aspektong naganap; ipinahihiwatig ng “bumangon” ang biglang pagsisimula ng unos.
- source_word: λαῖλαψ μεγάλη ἀνέμου
  choice: isang malakas na unos
  rationale: Ang λαῖλαψ ay isang marahas na bugso o unos, at nililinaw ng ἀνέμου na hangin ang sanhi nito. Likas at marangal sa modernong Tagalog ang “malakas na unos”; nasa talababa ang mas pormal na anyo.
- source_word: κύματα
  choice: mga alon
  rationale: Ito ang karaniwan at malinaw na katumbas ng κύματα sa Tagalog.
- source_word: ἐπέβαλλεν εἰς τὸ πλοῖον
  choice: paulit-ulit na humahampas papasok sa bangka
  rationale: Pinananatili ng “paulit-ulit” ang tuloy-tuloy o nauulit na kilos ng pandiwang nasa imperfect, habang ipinakikita ng “papasok” ang direksiyong εἰς patungo sa loob ng bangka.
- source_word: πλοῖον
  choice: bangka
  rationale: Ang “bangka” ang likas na katawagan sa sasakyang pantubig sa konteksto ng Lawa ng Galilea; masyadong malaki ang karaniwang ipinahihiwatig ng “barko.”
- source_word: ὥστε
  choice: kaya
  rationale: Malinaw at natural na ipinahahayag ng “kaya” ang resultang ipinakikilala ng ὥστε.
- source_word: ἤδη
  choice: na
  rationale: Sa “napupuno na,” likas na ipinahahayag ng hulaping “na” ang kahulugan ng ἤδη na umabot na sa gayong kalagayan ang bangka.
- source_word: γεμίζεσθαι τὸ πλοῖον
  choice: napupuno na ng tubig ang bangka
  rationale: Ipinakikita ng “napupuno” ang nagpapatuloy na proseso. Idinagdag ang “ng tubig” bilang malinaw na ipinahihiwatig ng mga alon sa konteksto, hindi bilang bagong teolohikal na detalye.
