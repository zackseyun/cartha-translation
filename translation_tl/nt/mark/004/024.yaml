  verdict: revise
  source_fidelity: Ang “Bigyang-pansin ninyo ang inyong pinakikinggan” ay tapat sa Βλέπετε τί ἀκούετε at maayos na iniiwasang iayon sa “kung paano kayo nakikinig” ng Lucas 8:18. Napananatili rin ng “panukat” at ng di-tiyak na “may idaragdag pa” ang metapora at ang sinadyang hindi pagtukoy sa bagay na idinaragdag. Gayunman, ang “susukatin din para sa inyo” ay hindi likas na paraan sa Filipino upang ipahayag ang μετρηθήσεται ὑμῖν; maaari itong mangahulugang may susukatin alang-alang sa kanila, sa halip na ang katumbas na panukat ay ilapat sa kanila.
  naturalness: Ang “At patuloy niyang sinasabi sa kanila” ay posible ngunit kapansin-pansing hindi likas sa tuloy-tuloy na salaysay sa modernong Filipino. Ang payak na “Sinabi rin niya sa kanila” ay mas natural at sapat na salin ng imperfect na ἔλεγεν sa ganitong konteksto. Ang “susukatin din kayo” ay ang karaniwang malinaw na Filipino para sa reciprocity ng kasabihan.
  terminology: Ang “panukat,” “Bigyang-pansin,” at “idaragdag” ay malinaw, modernong Filipino, at angkop sa marangal na rehistro. Hindi ipinapasok ng teksto ang isang tiyak na doktrinal na pakahulugan sa pagdaragdag.
