revisions:
- from: At patuloy niyang sinasabi sa kanila, “Bigyang-pansin ninyo ang inyong pinakikinggan. Sa panukat na ginagamit ninyo, susukatin din para sa inyo, at may idaragdag pa sa inyo.”[a]
  to: Sinabi rin niya sa kanila, “Bigyang-pansin ninyo ang inyong pinakikinggan. Sa panukat na ginagamit ninyo, susukatin din kayo, at may idaragdag pa sa inyo.”[a]
  rationale: Pinalitan ang hindi idiomatikong “susukatin din para sa inyo” ng “susukatin din kayo” upang malinaw na maipahayag ang katumbas na pagsukat nang hindi nagdaragdag ng “pabalik” o ng tiyak na larangan tulad ng paghatol o pagkabukas-palad. Ginawang mas natural din ang pambungad na pandiwang pasalaysay. Nananatili ang kalabuan ng bagay na idaragdag at ang footnote ay wastong nakaangkla sa pariralang iyon.
