base_translation:
  language: en
  yaml_path: translation/nt/mark/004/024.yaml
  text: And he was saying to them[a], “Pay attention to what you hear. With the measure you use, it will be measured to you[b], and more will be added to you.”
translation:
  language: tl
  text: Sinabi rin niya sa kanila, “Bigyang-pansin ninyo ang inyong pinakikinggan. Sa panukat na ginagamit ninyo, susukatin din kayo, at may idaragdag pa sa inyo.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa konteksto, maaaring tumukoy ang “may idaragdag pa sa inyo” sa higit na pagkaunawa ng mga tumatanggap sa turo ni Jesus; hindi tahasang tinutukoy ng Griyego kung ano ang idaragdag.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγεν
  choice: patuloy niyang sinasabi
  rationale: Ipinahihiwatig ng aspektong imperpektibo ang nagpapatuloy o paulit-ulit na pagsasalita. Likas sa salaysay sa Filipino ang pariralang ito at hindi nito pinapantay ang anyo sa payak na “sinabi.”
- source_word: Βλέπετε
  choice: Bigyang-pansin ninyo
  rationale: Bagaman pangunahing nangangahulugang “tingnan,” ginagamit ito rito bilang utos na maging maingat at mapagbigay-pansin. Malinaw at natural ito sa modernong Filipino.
- source_word: τί ἀκούετε
  choice: ang inyong pinakikinggan
  rationale: Ang τί ay tumutukoy sa “ano” o sa nilalaman ng naririnig, hindi sa paraan ng pakikinig. Pinananatili nito ang pagkakaiba sa “kung paano kayo nakikinig” sa Lucas 8:18.
- source_word: ἐν ᾧ μέτρῳ μετρεῖτε
  choice: Sa panukat na ginagamit ninyo
  rationale: Pinananatili ng “panukat” ang talinghaga, samantalang ipinahahayag ng “ginagamit” ang likas na diwa ng pandiwa nang hindi nangangailangan ng tahasang layon na wala sa Griyego.
- source_word: μετρηθήσεται ὑμῖν
  choice: susukatin din para sa inyo
  rationale: Pinananatili ang anyong balintiyak at ang diwa ng katumbas na pagtugon. Ang “din” ay natural na nagpapahiwatig ng tugunan, ngunit hindi idinaragdag ang mas interpretibong “pabalik.”
- source_word: προστεθήσεται ὑμῖν
  choice: may idaragdag pa sa inyo
  rationale: Tuwirang pinananatili ang ideya ng pagdaragdag at ang di-tiyak na simuno ng pandiwa. Hindi tinutukoy ng salin kung ano mismo ang idaragdag.
theological_decisions:
- issue: Saklaw ng kasabihan tungkol sa panukat at pagdaragdag
  choice: Pinanatili bilang malawak na talinghaga sa konteksto ng pakikinig sa turo ni Jesus, nang hindi tinutukoy kung ano ang sinusukat o idinaragdag.
  alternative: Tahasang ipakahulugan ito bilang dagdag na pagkaunawa, paghatol, gantimpala, o materyal na pagbibigay.
  rationale: Itinuturo ng konteksto ang pagtanggap sa salita, ngunit hindi tahasang pinangalanan ng talata ang bagay na sinusukat o idinaragdag. Pinananatili ng salin ang sadyang luwag at teolohikal na tensiyon ng pahayag.
translation_notes:
  register: Modernong Filipino na magalang at marangal ngunit madaling maunawaan. Ginamit ang pangmaramihang “ninyo” ayon sa αὐτοῖς at sa mga pandiwang nasa ikalawang panauhang maramihan. Iniwasan ang pag-aangkop sa Lucas 8:18 at ang pagpapasok ng isang tiyak na doktrinal na paliwanag.
