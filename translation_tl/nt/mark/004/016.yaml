source:
  edition: SBLGNT
  text: καὶ οὗτοί εἰσιν ⸀ὁμοίως οἱ ἐπὶ τὰ πετρώδη σπειρόμενοι, οἳ ὅταν ἀκούσωσιν τὸν λόγον ⸀εὐθὺς μετὰ χαρᾶς λαμβάνουσιν αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/016.yaml
  text: 'And these are likewise the ones sown on the rocky ground: when they hear the word[a], they immediately receive it with joy,'
translation:
  language: tl
  text: 'At gayundin, ito ang mga naihasik sa mabatong lupa: kapag narinig nila ang salita, agad nila itong tinatanggap nang may kagalakan.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁμοίως
  choice: gayundin
  rationale: Likas at maikling pang-ugnay ito na nagpapanatili sa paghahambing sa naunang paliwanag ng talinghaga.
- source_word: ἐπὶ τὰ πετρώδη
  choice: sa mabatong lupa
  rationale: Malinaw at natural sa Filipino, at pinananatili ang larawang pang-agrikultura ng lugar na mabato.
- source_word: σπειρόμενοι
  choice: mga naihasik
  rationale: Pinananatili nito ang metapora ng paghahasik at ang pagkakakilanlan ng mga taong inilalarawan, nang hindi nagdaragdag ng paliwanag tungkol sa kanilang puso.
- source_word: τὸν λόγον
  choice: sa salita
  rationale: Pinananatili ang inuulit na terminong λόγος at ang biblikal na taginting nito; nauunawaan sa konteksto bilang ipinahahayag na mensahe.
- source_word: εὐθύς
  choice: kaagad
  rationale: Natural sa modernong Filipino at tapat sa diin at estilong madalas gamitin ni Marcos.
- source_word: μετὰ χαρᾶς
  choice: nang may kagalakan
  rationale: Tuwirang inilalarawan ang paraan ng pagtanggap, habang pinananatili ang pangngalang ‘kagalakan.’
- source_word: λαμβάνουσιν αὐτόν
  choice: itong tinatanggap
  rationale: Ang ‘tinatanggap’ ay neutral at hindi nagpapahiwatig ng namamalaging pananampalatayang hindi tahasang sinasabi rito.
theological_decisions:
- issue: Tinutukoy ng ‘mga naihasik’ sa paliwanag ng talinghaga
  choice: Panatilihin ang pananalitang ‘ang mga naihasik sa mabatong lupa.’
  alternative: ‘ang mga taong ang puso ay tulad ng mabatong lupa’
  rationale: Sadyang pinananatili ng Griyego ang larawan ng paghahasik habang tinutukoy ang mga tao. Ang alternatibo ay nagdaragdag ng interpretasyong wala sa teksto.
translation_notes:
  register: Modernong Filipino na natural, marangal, at madaling maunawaan. Ginamit ang ‘mabatong lupa’ sa halip na mas teknikal o di-likas na anyo; pinanatili ang metapora at ang bahagyang tensiyon ng ‘mga naihasik.’
