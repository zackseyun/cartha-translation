id: MRK.4.11
reference: Mark 4:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν αὐτοῖς· Ὑμῖν ⸂τὸ μυστήριον δέδοται⸃ τῆς βασιλείας τοῦ θεοῦ· ἐκείνοις δὲ τοῖς ἔξω ἐν παραβολαῖς τὰ πάντα γίνεται,
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/011.yaml
  text: And he was saying to them, “To you the mystery of the kingdom of God has been given, but to those outside everything comes in parables,”
translation:
  language: tl
  text: At sinabi niya sa kanila, “Ipinagkaloob sa inyo ang hiwaga ng kaharian ng Diyos, ngunit para sa mga nasa labas, ang lahat ay dumarating sa pamamagitan ng mga talinghaga,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μυστήριον
  choice: hiwaga
  rationale: Tumutukoy ito sa banal na katotohanang dating nakakubli at ngayo’y ipinagkaloob na malaman, hindi lamang sa isang palaisipang kailangang lutasin.
- source_word: δέδοται
  choice: ipinagkaloob
  rationale: Pinananatili ang aspektong ganap at ang diwang ang pagkaalam sa hiwaga ay isang kaloob.
- source_word: τοῖς ἔξω
  choice: mga nasa labas
  rationale: Pinananatili ang matalinghagang paghahati sa pagitan ng mga alagad at ng iba, nang hindi tinutukoy nang higit sa sinasabi ng teksto kung sino sila.
- source_word: ἐν παραβολαῖς
  choice: sa pamamagitan ng mga talinghaga
  rationale: Likas sa Tagalog at inilalarawan ang paraang ginagamit upang makarating sa kanila ang lahat.
- source_word: γίνεται
  choice: dumarating
  rationale: Pinananatili ang dinamikong diwa ng ‘comes/happens’ sa Griyego at iniiwasang gawing payak na ‘nasa mga talinghaga’ lamang.
theological_decisions:
- issue: Ang hiwaga bilang kaloob
  choice: “Ipinagkaloob sa inyo ang hiwaga”
  alternative: “Ibinigay sa inyo na malaman ang hiwaga”
  rationale: Walang tahasang infinitive na ‘malaman’ sa SBLGNT; kaya hindi ito idinagdag, at pinananatili ang teolohikal na diin sa hiwaga mismo bilang ipinagkaloob.
- issue: Paano nauugnay ang mga talinghaga sa mga nasa labas
  choice: “ang lahat ay dumarating sa pamamagitan ng mga talinghaga”
  alternative: “ang lahat ay nasa mga talinghaga”
  rationale: Mas malapit ito sa γίνεται at pinananatili ang tensiyon at kalabuan kung ang mga talinghaga ay paghahayag, pagtatakip, o kapwa—isang usaping pinalalawak ng kasunod na talata.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “hiwaga,” “ipinagkaloob,” at “talinghaga” bilang pamilyar na bokabularyong biblikal na hindi lipas o labis na teknikal.
