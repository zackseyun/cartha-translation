base_translation:
  language: en
  yaml_path: translation/nt/mark/004/015.yaml
  text: 'And these are the ones along the road where the word is sown: when they hear[a], Satan immediately comes and takes away the word that was sown in them.'
translation:
  language: tl
  text: Ang mga ito naman ang nasa tabi ng daan, kung saan inihahasik ang salita. Kapag narinig nila ito, agad na dumarating si Satanas at inaalis ang salitang inihasik sa kanila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “salitang inihasik sa loob nila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι δέ εἰσιν
  choice: Ito naman ang mga
  rationale: Ang “ito … ang mga” ay likas na paraan sa Filipino upang tukuyin ang mga taong inilalarawan; ang “naman” ay banayad na nag-uugnay sa kasunod na bahagi ng paliwanag nang hindi nagpapahiwatig ng matinding pagsalungat.
- source_word: οἱ παρὰ τὴν ὁδόν
  choice: mga nasa tabi ng daan
  rationale: Ipinapahayag ng παρά na sila ay nasa tabi ng daan. Pinananatili ng “daan” ang larawan ng paghahasik at nililinaw ng “mga” na mga tao ang tinutukoy sa paliwanag.
- source_word: σπείρεται ὁ λόγος
  choice: inihahasik ang salita
  rationale: Pinananatili ang metapora ng paghahasik at ang pag-uulit ng λόγος bilang “salita,” na tumutukoy rito sa ipinahahayag na mensahe.
- source_word: ὅταν ἀκούσωσιν
  choice: Kapag narinig nila ito
  rationale: Ang “kapag” ay angkop sa pangkalahatang temporal na diwa ng ὅταν kasama ng subjunctive. Idinagdag ang “ito” bilang likas na layon sa Filipino, na malinaw na tumutukoy sa salita.
- source_word: εὐθύς
  choice: agad
  rationale: Maikli at natural na salin na nagpapanatili sa katangiang pagdiriin ni Marcos sa agarang pagkilos.
- source_word: ὁ Σατανᾶς
  choice: si Satanas
  rationale: Karaniwang anyo ng pangalang pantangi sa Filipino; ang panandang “si” ay angkop sa personal na gumagawa ng kilos.
- source_word: αἴρει
  choice: inaalis
  rationale: Saklaw ng “inaalis” ang diwa ng pagkuha o pag-aalis nang hindi nagdaragdag ng lakas na hindi tahasang nasa pandiwang Griyego.
- source_word: τὸν λόγον τὸν ἐσπαρμένον εἰς αὐτούς
  choice: ang salitang inihasik sa kanila
  rationale: Pinananatili ang adjectival na ugnayan ng participle sa “salita.” Ang “sa kanila” ay natural at hindi labis na nilulutas kung ang εἰς ay bibigyang-diin bilang “sa” o “sa kalooban.”
theological_decisions:
- issue: Personal na pagkilos ni Satanas sa paliwanag ng talinghaga
  choice: Isinalin ang ὁ Σατανᾶς bilang personal na tauhang “si Satanas” na dumarating at nag-aalis ng salita.
  alternative: Isalin nang mas di-personal bilang “ang kalaban.”
  rationale: Ang may artikulong pangalan o titulo sa Griyego at ang mga pandiwang personal na kilos ay likas na tumutukoy sa personal na masamang nilalang. Hindi dapat gawing abstraktong puwersa lamang ang teksto.
- issue: Kinaroroonan o tunguhin ng salitang inihasik
  choice: “inihasik sa kanila”
  alternative: “inihasik sa kalooban nila”
  rationale: Maaaring ipahiwatig ng εἰς αὐτούς ang pagpasok sa kanilang kalooban, ngunit ang mas malawak na “sa kanila” ay nagpapanatili ng tunay na luwag ng parirala at umiiwas sa labis na pagpapaliwanag sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang sentrong metapora ng paghahasik at ang pag-uulit ng “salita,” habang ginawang natural ang ayos ng pangungusap para sa karaniwang mambabasa.
