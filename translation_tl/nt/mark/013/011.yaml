    issue: Ang “upang ibigay” ay nagdaragdag ng ugnayang layunin sa παραδιδόντες.
    rationale: Ang participle ay hindi nagpapahayag na ang pagdadala ay ginagawa para sa layuning maibigay sila; inilalarawan nito ang kaugnay na pagkilos ng pagdadala at pagsuko sa mga awtoridad.
  - severity: medium
    issue: Hindi tumpak ang paliwanag sa talababa na “habang ibinibigay.”
    rationale: 'Aktibo ang παραδιδόντες: ang mga nagdadala ang siyang “nagbibigay” o nagsusuko sa kanila, hindi ang mga alagad ang “ibinibigay” sa anyong ipinahiwatig ng talababa. Hindi rin kailangan ang talababa kapag malinaw na ang pangunahing salin.'
  revised_text: At kapag dinadala nila kayo at isinusuko sa mga awtoridad, huwag kayong mag-alala nang patiuna kung ano ang sasabihin ninyo. Sa halip, anumang ibigay sa inyo sa oras na iyon, iyon ang sabihin ninyo. Sapagkat hindi kayo ang nagsasalita kundi ang Banal na Espiritu.
