  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸂καὶ ὅταν⸃ ⸀ἄγωσιν ὑμᾶς παραδιδόντες, μὴ προμεριμνᾶτε τί ⸀λαλήσητε, ἀλλ’ ὃ ἐὰν δοθῇ ὑμῖν ἐν ἐκείνῃ τῇ ὥρᾳ τοῦτο λαλεῖτε, οὐ γάρ ἐστε ὑμεῖς οἱ λαλοῦντες ἀλλὰ τὸ πνεῦμα τὸ ἅγιον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/011.yaml
  text: And when they lead you away and hand you over[a], do not worry beforehand about what you should say; but whatever is given to you in that hour, speak that. For it is not you who are speaking[b], but the Holy Spirit.
translation:
  language: tl
  text: At kapag dinadala nila kayo at isinusuko sa mga awtoridad, huwag kayong mag-alala nang patiuna kung ano ang sasabihin ninyo. Sa halip, anumang ibigay sa inyo sa oras na iyon, iyon ang sabihin ninyo. Sapagkat hindi kayo ang nagsasalita kundi ang Banal na Espiritu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ὅταν
  choice: At kapag
  rationale: Pinananatili ang ugnayan sa naunang pahayag at ang diwa ng inaasahang pangyayari sa hinaharap.
- source_word: ἄγωσιν ὑμᾶς παραδιδόντες
  choice: dinadala nila kayo upang ibigay sa mga may kapangyarihan
  rationale: Ipinahahayag ang sapilitang pagdadala at pagsasakamay sa awtoridad na ipinahihiwatig ng konteksto. Ginamit ang sugnay na may “upang” upang natural na maipakita sa Filipino ang kaugnayan ng pandiwa at participle.
- source_word: μὴ προμεριμνᾶτε
  choice: huwag kayong mag-alala nang patiuna
  rationale: Pinananatili kapwa ang pagkabalisa at ang temporal na diwa ng προ-, samantalang gumagamit ng karaniwan at malinaw na Filipino.
- source_word: τί λαλήσητε
  choice: kung ano ang sasabihin ninyo
  rationale: Ang “sasabihin” ang likas na katumbas sa Filipino ng λαλέω sa ganitong konteksto at malinaw na tumutukoy sa ihahayag nila sa harap ng mga awtoridad.
- source_word: ὃ ἐὰν δοθῇ ὑμῖν
  choice: ang anumang ibigay sa inyo
  rationale: Pinananatili ang balintiyak na anyo at hindi tahasang pinapangalanan ang nagbibigay, gaya ng Griyego.
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: sa oras na iyon
  rationale: Malapit sa anyo ng Griyego at natural pa rin sa makabagong Filipino; tumutukoy sa mismong sandali ng pagharap nila.
- source_word: τοῦτο λαλεῖτε
  choice: sabihin ninyo
  rationale: Ang bagay na dapat sabihin ay malinaw nang tinutukoy ng “ang anumang ibigay sa inyo,” kaya hindi kailangang ulitin ang isang alanganing demonstratibo sa Filipino.
- source_word: οὐ γάρ ἐστε ὑμεῖς οἱ λαλοῦντες
  choice: Sapagkat hindi kayo ang nagsasalita
  rationale: Pinananatili ang diin sa ὑμεῖς at ang tuwirang paghahambing sa kasunod na sugnay.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: ang Banal na Espiritu
  rationale: Ito ang pamantayan, marangal, at madaling maunawaang makabagong katawagan sa Filipino.
theological_decisions:
- issue: Ang pagkilos ng Banal na Espiritu at ng mga alagad sa pagsasalita sa gitna ng pag-uusig
  choice: Pinananatili na ang mga alagad ay inuutusang magsalita, habang ang Banal na Espiritu ang tinutukoy na tunay na pinagmumulan ng kanilang sasabihin sa oras na iyon.
  alternative: Ilarawan ang mga alagad bilang mga kasangkapang lubos na walang sariling pakikibahagi, o unawain ang Banal na Espiritu bilang pangkalahatang impluwensiya lamang.
  rationale: Magkasabay na inihahayag ng Griyego ang aktuwal na pagsasalita ng mga alagad at ang nangingibabaw na pagkilos ng Banal na Espiritu. Hindi nilulutas ng salin ang tensiyong ito pabor sa mekanikal na diktasyon o sa mahinang diwa ng inspirasyon.
- issue: Ang hindi pinangalanang nagbibigay sa balintiyak na “δοθῇ”
  choice: Iniwan itong “ang anumang ibigay sa inyo,” nang hindi tahasang dinaragdagan ng “ng Diyos” o “ng Espiritu.”
  alternative: Tahasan na pangalanan ang Diyos o ang Banal na Espiritu bilang nagbibigay.
  rationale: Bagaman ipinahihiwatig ng konteksto ang banal na pagkakaloob, hindi tahasang pinangalanan ng sugnay na Griyego ang gumagawa; pinananatili ng salin ang anyo at bahagyang kalabuan nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasan ang mga arkaikong anyo at labis na legal na bokabularyo. Ang “nang patiuna” ay bahagyang pormal ngunit madaling maunawaan at mahalaga upang mapanatili ang temporal na diin ng pandiwang Griyego.
