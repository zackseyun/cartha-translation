id: MRK.13.31
reference: Mark 13:31
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσονται, οἱ δὲ λόγοι μου οὐ ⸀μὴ ⸁παρελεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/031.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: tl
  text: Lilipas ang langit at ang lupa, ngunit ang mga salita ko ay hinding-hindi lilipas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ οὐρανὸς
  choice: ang langit
  rationale: Sa tambalang “langit at lupa,” tumutukoy ito sa kosmikong langit, hindi lamang sa nakikitang himpapawid.
- source_word: ἡ γῆ
  choice: ang lupa
  rationale: Sa nakapirming pares na “langit at lupa,” tumutukoy ito sa daigdig o lupa sa kabuuan, hindi sa isang partikular na lupain.
- source_word: παρελεύσονται
  choice: lilipas
  rationale: Ipinahihiwatig dito ng παρέρχομαι ang paglipas o pagwawakas. Likas at marangal sa Filipino ang “lilipas” at hindi nito labis na tinutukoy kung paano iyon mangyayari.
- source_word: δὲ
  choice: ngunit
  rationale: Malinaw nitong ipinakikita ang pagsalungat sa pagitan ng paglipas ng langit at lupa at ng di-paglipas ng mga salita ni Jesus.
- source_word: οἱ λόγοι μου
  choice: ang mga salita ko
  rationale: Tuwirang tumutukoy ang λόγοι sa mga sinabi o pahayag ni Jesus. Natural sa modernong Filipino ang “mga salita ko.”
- source_word: οὐ μὴ παρελεύσονται
  choice: ay hinding-hindi lilipas
  rationale: Ang οὐ μή na kasama ng panghinaharap na pandiwa ay mariing pagtanggi. Likas na naihahayag ng “hinding-hindi” ang diin nito sa Filipino.
theological_decisions:
- issue: Diin ng mariing pagtanggi ni Jesus tungkol sa kaniyang mga salita
  choice: “ay hinding-hindi lilipas”
  alternative: “tiyak na hindi lilipas”
  rationale: Pinananatili ng pag-uulit na “hinding-hindi” ang malakas na diin ng Griyegong οὐ μή at ang tahasang pagkakaiba ng lumilipas na sangnilikha at ng nananatiling bisa ng mga salita ni Jesus, nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na payak, marangal, at madaling bigkasin. Pinanatili ang tradisyonal at malinaw na pares na “langit at lupa.” Walang talababa sapagkat natural nang naipapahayag sa pangunahing teksto ng “hinding-hindi” ang mariing pagtanggi sa Griyego.
