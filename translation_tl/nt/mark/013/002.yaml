  text: καὶ ὁ ⸀Ἰησοῦς εἶπεν αὐτῷ· Βλέπεις ταύτας τὰς μεγάλας οἰκοδομάς; οὐ μὴ ἀφεθῇ ⸀ὧδε λίθος ἐπὶ ⸀λίθον ὃς οὐ μὴ καταλυθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/002.yaml
  text: And Jesus said to him[c][b][a], “Do you see these great buildings? Not one stone will be left here upon another that will not be torn down.”
translation:
  language: tl
  text: At sinabi sa kanya ni Jesus, “Nakikita mo ba ang malalaking gusaling ito?[a] Wala ni isang bato rito ang maiiwang nakapatong sa isa pang bato na hindi gigibain.”[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “malalaking gusali ng templo.” Ang tinutukoy sa konteksto ay ang kabuuan ng templo, ngunit “mga gusali” lamang ang nasa Griyego.
    reason: lexical_alternative
  - marker: b
    text: Ang pananalitang “wala ni isang bato … na maiiwang nakapatong sa isa pang bato” ay isang matingkad na paglalarawan ng ganap na pagkawasak.
    reason: cultural_note
  - marker: c
    text: Ang “gigibain” ay maaari ring isaling “wawasakin” o “ibabagsak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὁ Ἰησοῦς εἶπεν αὐτῷ
  choice: At sinabi sa kanya ni Jesus
  rationale: Pinananatili ang payak na pang-ugnay na καί at ang tuwirang kahulugan ng εἶπεν αὐτῷ nang hindi dinaragdagan ng diwang ‘sumagot.’ Natural din sa Filipino ang ayos na pandiwa muna.
- source_word: Βλέπεις
  choice: Nakikita mo ba
  rationale: Ang anyong pasalaysay ay gumaganap dito bilang tuwirang tanong. Nililinaw ng ‘ba’ ang puwersang patanong sa natural na Filipino nang hindi ito ginagawang utos na ‘Tingnan mo.’
- source_word: ταύτας τὰς μεγάλας οἰκοδομάς
  choice: ang malalaking gusaling ito
  rationale: Ang οἰκοδομάς ay pangkalahatang ‘mga gusali,’ samantalang ang μεγάλας ay tumutukoy sa laki at maaari ring magpahiwatig ng kadakilaan. Hindi idinagdag sa pangunahing teksto ang ‘ng templo,’ bagaman malinaw iyon sa konteksto.
- source_word: οὐ μὴ ἀφεθῇ ὧδε λίθος ἐπὶ λίθον
  choice: Wala ni isang bato rito na maiiwang nakapatong sa isa pang bato
  rationale: Ipinahahayag ng ‘wala ni isang bato’ ang mariing pagtanggi ng οὐ μή. Ang ‘nakapatong sa isa pang bato’ ay nagpapanatili sa kongkretong larawan ng λίθος ἐπὶ λίθον sa malinaw na modernong Filipino.
- source_word: ὃς οὐ μὴ καταλυθῇ
  choice: ibabagsak ang lahat
  rationale: Tumutukoy ang sugnay sa ganap na pagbagsak ng mga batong binanggit. Ang paghahating may tuldok-kuwit ay umiiwas sa magulong sunod-sunod na negatibo sa Filipino, habang pinananatili ng ‘ibabagsak’ ang pisikal na larawan ng pagkakalansag o paggiba.
theological_decisions:
- issue: Saklaw ng hulang binigkas ni Jesus tungkol sa mga gusali
  choice: Gamitin ang pangkalahatang ‘mga gusali’ sa pangunahing teksto.
  alternative: ‘mga gusali ng templo’
  rationale: Templo ang malinaw na tinutukoy sa konteksto, ngunit ‘mga gusali’ lamang ang tahasang nasa Griyego. Iniiwasan nitong gawing bahagi ng salin ang isang paglilinaw na kontekstuwal, habang inilalagay ang paglilinaw sa talababa.
- issue: Lakas at saklaw ng pahayag tungkol sa pagkawasak
  choice: ‘Wala ni isang bato …; ibabagsak ang lahat.’
  alternative: ‘Hindi maiiwan ang isang bato sa ibabaw ng isa pa na hindi gigibain.’
  rationale: Pinananatili nito ang mariing ganap na pagkawasak na ipinahahayag ng dalawang οὐ μή at ng idyomang ‘bato sa ibabaw ng bato,’ nang hindi nagpapasya kung ang pahayag ay teknikal na paglalarawan sa bawat materyal na bato o isang karaniwang larawan ng lubos na paggiba.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal ang ginamit. Iniwasan ang makalumang ‘datapwat’ o ‘katotohanang’ mga porma at ang sobrang teknikal na ‘demolisahin.’ Ang ‘wala ni isang bato’ ay malinaw sa karaniwang mambabasa at sapat na mariin upang katawanin ang οὐ μή.
