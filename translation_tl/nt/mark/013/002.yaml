  naturalness: Natural at angkop sa modernong Filipino ang “Nakikita mo ba” at “malalaking gusaling ito.” Mas natural at mas tumpak ang isang sugnay na tuwirang naglilimita sa “bato,” kaysa sa malayang “ibabagsak ang lahat.”
