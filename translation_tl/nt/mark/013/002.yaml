revisions:
- from: At sinabi sa kanya ni Jesus, “Nakikita mo ba ang malalaking gusaling ito?[a] Wala ni isang bato rito na maiiwang nakapatong sa isa pang bato; ibabagsak ang lahat.”[b][c]
  to: At sinabi sa kanya ni Jesus, “Nakikita mo ba ang malalaking gusaling ito?[a] Wala ni isang bato rito ang maiiwang nakapatong sa isa pang bato na hindi gigibain.”[b][c]
  rationale: Pinalitan ang malayang “ibabagsak ang lahat” ng “na hindi gigibain” upang maipakita ang relative clause ng Griyego at ang mariing pahayag na walang batong maiiwan nang hindi winawasak. Iningatan ang natural na modernong Filipino, ang pangkalahatang “mga gusali,” at ang mga umiiral na talababa.
