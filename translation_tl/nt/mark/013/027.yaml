  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ τότε ἀποστελεῖ τοὺς ⸀ἀγγέλους καὶ ἐπισυνάξει τοὺς ⸀ἐκλεκτοὺς ἐκ τῶν τεσσάρων ἀνέμων ἀπ’ ἄκρου γῆς ἕως ἄκρου οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/027.yaml
  text: And then he will send out the angels and gather the chosen ones from the four winds[c][b][a], from the end of the earth to the end of heaven.
translation:
  language: tl
  text: At pagkatapos, isusugo niya ang mga anghel at titipunin ang mga hinirang[a] mula sa apat na hangin[b], mula sa dulo ng lupa hanggang sa dulo ng langit.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mga pinili.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mula sa apat na hangin” ay isang idyomang nangangahulugang mula sa lahat ng direksiyon.
    reason: cultural_note
  - marker: c
    text: Maaari ring unawain ang huling parirala bilang “mula sa pinakadulo ng lupa hanggang sa pinakadulo ng langit.” Isinasalin naman ito ng ilan nang mas interpretatibo bilang “mula sa isang dulo ng langit hanggang sa kabilang dulo.”
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: pagkatapos
  rationale: Tumutukoy sa kasunod na pangyayari sa diskursong eskatolohikal; natural ito sa makabagong Tagalog at malinaw ang pagkakasunod-sunod.
- source_word: ἀποστελεῖ
  choice: isusugo niya
  rationale: Ang μέλλον na pandiwa ay nagsasaad ng pagpapadala ng mga kinatawan para sa isang gawain; ang “isusugo” ay higit na angkop kaysa payak na “ipapadala” sa marangal na biblikal na rehistro.
- source_word: ἀγγέλους
  choice: ang mga anghel
  rationale: Sa kontekstong apokaliptiko, mga makalangit na nilalang ang tinutukoy, hindi mga taong mensahero.
- source_word: ἐπισυνάξει
  choice: titipunin
  rationale: Malinaw at natural na ipinapahayag ang pagsasama-sama ng mga taong nakakalat.
- source_word: ἐκλεκτούς
  choice: ang mga hinirang
  rationale: Ipinahahayag nito na sila ay pinili nang hindi dinaragdagan ng tahasang nagmamay-aring “kanyang,” na wala sa Griyego.
- source_word: ἐκ τῶν τεσσάρων ἀνέμων
  choice: mula sa apat na hangin
  rationale: Pinananatili ang biblikal na larawan at idyoma ng Griyego para sa lahat ng direksiyon.
- source_word: ἀπ’ ἄκρου γῆς
  choice: mula sa dulo ng lupa
  rationale: Pinananatili ang larawan ng sukdulang hangganan at ang pagkakatulad ng dalawang parirala.
- source_word: ἕως ἄκρου οὐρανοῦ
  choice: hanggang sa dulo ng langit
  rationale: Malapit sa anyo ng Griyego at pinananatili ang malawak na kosmikong larawan sa halip na ipakahulugan agad bilang “kabilang dulo ng langit.”
- source_word: καὶ τότε ... καὶ
  choice: At pagkatapos ... at
  rationale: Pinananatili ang koordinasyon at daloy ng salaysay ni Marcos nang natural sa Tagalog.
theological_decisions:
- issue: Pagpapahayag sa ἐκλεκτούς sa kontekstong eskatolohikal
  choice: ang mga hinirang
  alternative: ang mga pinili
  rationale: Ang “mga hinirang” ay maikli, malinaw sa biblikal na rehistro, at hindi nagpapasok ng tahasang “kanyang” o ng paliwanag tungkol sa paraan at layunin ng pagpili.
- issue: Saklaw ng larawan ng pagtitipon
  choice: mula sa apat na hangin, mula sa dulo ng lupa hanggang sa dulo ng langit
  alternative: mula sa lahat ng direksiyon, mula sa isang dulo ng daigdig hanggang sa kabilang dulo
  rationale: Pinananatili ang pinagsamang idyoma at merismong nasa Griyego, kasama ang tunay na kakaibang pagbanggit sa lupa at langit, sa halip na pakinisin ito bilang isang interpretatibong paraphrase.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang biblikal na larawang “apat na hangin” at ang di-pangkaraniwang paralelismo ng “dulo ng lupa” at “dulo ng langit.” Ang “isusugo” at “mga hinirang” ay bahagyang mataas ang rehistro ngunit karaniwan at madaling maunawaan sa tekstong biblikal.
