  verdict: revise
  source_fidelity: Ang “kahabag-habag” ay nagpapahiwatig na kaawa-awa ang mga tinutukoy, ngunit hindi nito lubos na naihahatid ang eksklamatori, makahulang panaghoy at babala ng οὐαί. Ang “Sa aba ng” ang mas tuwirang katumbas at pinananatili ang bigat ng Griyego. Wasto ang iba pang pangunahing sangkap ng talata.
  naturalness: Natural at malinaw sa modernong Filipino Tagalog ang “Sa aba ng mga nagdadalang-tao ... sa mga araw na iyon.” Ang pagdaragdag ng “ng sanggol” pagkatapos ng “nagpapasuso” ay likas na paglilinaw ng implicit na layon ng pandiwa at hindi nagpapabago sa kahulugan.
  terminology: Ang “nagdadalang-tao” ay angkop para sa ταῖς ἐν γαστρὶ ἐχούσαις. Ang “nagpapasuso ng sanggol” ay tapat sa θηλαζούσαις at malinaw na tumutukoy sa pagpapasuso ng bata. Walang isyung teolohikal o pangngalan.
