translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang tandang padamdam upang katawanin ang eksklamatori at mabigat na puwersa ng οὐαί. Walang footnote dahil walang makabuluhang tekstuwal o leksikal na kalabuan na kailangang ilahad sa talatang ito.
