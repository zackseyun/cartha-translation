  yaml_path: translation/nt/mark/013/017.yaml
  text: But woe to those who are pregnant and to those who are nursing infants in those days[a][b].
translation:
  language: tl
  text: Ngunit sa aba ng mga nagdadalang-tao at ng mga nagpapasuso ng sanggol sa mga araw na iyon!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαὶ
  choice: kahabag-habag
  rationale: Ipinahahayag nito ang matinding panaghoy at babala tungkol sa darating na paghihirap. Sa modernong Tagalog, likas at marangal ang pariralang ito nang hindi pinahihina ang bigat ng pahayag.
- source_word: δὲ
  choice: Ngunit
  rationale: Nagsisilbi itong banayad na paglipat mula sa naunang babala; pinananatili ng “Ngunit” ang ugnayan sa daloy nang hindi nagpapahiwatig ng labis na pagsalungat.
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: ang mga nagdadalang-tao
  rationale: Ang idyomang Griyego ay literal na tumutukoy sa mga may dinadala sa sinapupunan, at likas na ipinahahayag sa kasalukuyang Tagalog bilang “mga nagdadalang-tao.”
- source_word: θηλαζούσαις
  choice: ang mga nagpapasuso
  rationale: Tuwirang tumutukoy ito sa mga babaeng nagpapasuso ng sanggol. Sapat at natural sa Tagalog ang “mga nagpapasuso,” sapagkat malinaw sa konteksto ang ipinapasusong sanggol.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: sa mga araw na iyon
  rationale: Natural at tuwirang salin ito ng pariralang temporal at pinananatili ang kaugnayan nito sa mga pangyayaring binabanggit sa nakapaligid na konteksto.
