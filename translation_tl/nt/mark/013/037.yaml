  text: 'And what I say to you I say to all: stay awake[a].'
translation:
  language: tl
  text: 'At ang sinasabi ko sa inyo ay sinasabi ko sa lahat: manatili kayong gising[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Patuloy kayong magbantay” o “Maging mapagmatyag kayo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ
  choice: ang
  rationale: Kasama ng sugnay na “sinasabi ko sa inyo,” likas nitong binubuo sa Filipino ang kahulugang “ang sinasabi ko,” na tumutugma sa substantibong diwa ng panghalip na Griyego nang hindi nagiging matigas ang pananalita.
- source_word: δὲ
  choice: At
  rationale: Mahina at nag-uugnay ang δέ rito, kaya ang “At” ang natural na pagpapatuloy sa naunang pahayag, sa halip na ang mas salungat na “Ngunit.”
- source_word: ὑμῖν
  choice: sa inyo
  rationale: Ipinahihiwatig ng “inyo” ang maramihang kausap at pinananatili ang unang pagtukoy sa mga agarang tagapakinig bago palawakin ng “sa lahat” ang saklaw.
- source_word: λέγω ... λέγω
  choice: sinasabi ko ... sinasabi ko
  rationale: Pinananatili ang pag-uulit sa Griyego at ang retorikal na diin nito. Natural din ang aspektong di-ganap ng “sinasabi” sa kasalukuyang pahayag.
- source_word: πᾶσιν
  choice: sa lahat
  rationale: Maikli at malawak ang saklaw nito gaya ng Griyego, at hindi ito nagdaragdag ng tahasang pangngalang wala sa teksto.
- source_word: γρηγορεῖτε
  choice: Manatili kayong gising
  rationale: Ipinapahayag nito ang maramihan at nagpapatuloy na utos, habang pinananatili ang buhay na metapora ng pagiging gising. Inilalahad sa talababa ang mga lehitimong kahulugang nakatuon sa pagbabantay at pagiging mapagmatyag.
theological_decisions:
- issue: Saklaw ng babala ni Jesus
  choice: Ang sinabi sa mga agarang kausap ay tahasang pinalalawak sa lahat.
  alternative: Maaaring unawain ang babala bilang para lamang sa mga alagad na kausap sa tagpo.
  rationale: Malinaw na itinatapat ng Griyego ang “sa inyo” at “sa lahat.” Pinananatili ng salin ang malawak na saklaw nang hindi tinutukoy kung sino mismo ang bawat kabilang sa “lahat.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit ng “sinasabi ko” at ang tuwirang bigat ng pangwakas na utos. Ginamit ang “kayo” upang maging hayag ang maramihang anyo ng utos.
