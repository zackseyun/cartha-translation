translation:
  language: tl
  text: Ang nasa bubungan[a] ay huwag bumaba ni pumasok sa kanyang bahay upang kumuha ng anuman mula rito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tumutukoy ito sa patag na bubong ng bahay, na karaniwang napupuntahan at nagagamit na lugar noong panahong iyon.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ἐπὶ τοῦ δώματος
  choice: Ang nasa bubungan
  rationale: Ang pariralang may pantukoy ay tumutukoy sa sinumang taong naroon. Likas at maikli sa Tagalog ang “ang nasa bubungan.”
- source_word: δώματος
  choice: bubungan
  rationale: Tumutukoy ito sa patag at nagagamit na ibabaw ng bahay noong panahong iyon; pinananatili ng “bubungan” ang lokasyong nasa ibabaw ng bahay, na nililinaw sa talababa.
- source_word: μὴ καταβάτω
  choice: ay huwag nang bumaba
  rationale: Ang ikatlong panauhang pautos na nagbabawal ay natural na naipapahayag sa “huwag.” Ang “nang” ay nagpapahiwatig ng agarang pagbabawal sa pagbaba sa sitwasyong inilalarawan.
- source_word: μηδὲ εἰσελθάτω
  choice: o pumasok pa
  rationale: Ikinakabit ng μηδέ ang ikalawang pagbabawal. Natural sa Tagalog ang “o,” at ipinakikita ng “pa” na hindi siya dapat pumasok bilang karagdagang kilos pagkatapos bumaba.
- source_word: τι ἆραι
  choice: upang kumuha ng anuman
  rationale: Ipinahahayag ng pawatas ang layunin ng pagpasok. Ang “anuman” ay nagpapanatili sa malawak at mariing saklaw ng pagbabawal.
- source_word: ἐκ τῆς οἰκίας αὐτοῦ
  choice: sa bahay niya
  rationale: Sa Tagalog, ang “kumuha ... sa bahay niya” ay natural na nagpapahayag ng pagkuha ng bagay mula sa loob ng bahay. Pinananatili ng “niya” ang isahang reperensiya nang hindi sapilitang nagtatakda ng kasarian, gaya ng karaniwang gamit sa Tagalog.
theological_decisions:
- issue: Isahang panlalaking anyo na may pangkalahatang bisa
  choice: bahay niya
  alternative: kanyang bahay / bahay nila
  rationale: Mas natural sa modernong Tagalog ang “niya,” at bilang panghalip na walang markang kasarian ay hindi nito dinaragdagan o inaalis ang kasariang hindi kailangang tahasang tukuyin sa Filipino. Nananatili rin ang isahang bilang ng Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at agarang maunawaan. Ginamit ang “bubungan” sa pangunahing teksto at isang maikling talang pangkultura upang maiwasang isipin lamang ang karaniwang pahilis na bubong sa kasalukuyang Pilipinas.
