id: MRK.13.35
reference: Mark 13:35
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: γρηγορεῖτε οὖν, οὐκ οἴδατε γὰρ πότε ὁ κύριος τῆς οἰκίας ἔρχεται, ⸀ἢ ὀψὲ ἢ ⸀μεσονύκτιον ἢ ἀλεκτοροφωνίας ἢ πρωΐ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/035.yaml
  text: 'Therefore stay awake[a], for you do not know when the master of the house is coming: whether in the evening, or at midnight, or at cockcrow[b], or in the morning.'
translation:
  language: tl
  text: Kaya manatili kayong gising[a], sapagkat hindi ninyo alam kung kailan darating ang panginoon ng bahay—sa gabi, sa hatinggabi, sa pagtilaok ng tandang[b], o sa umaga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “manatili kayong mapagbantay.” Ang utos ay nangangahulugang patuloy na maging alerto at handa.
    reason: lexical_alternative
  - marker: b
    text: Ang “pagtilaok ng tandang” ay tumutukoy sa bahagi ng pagbabantay sa magdamag na iniuugnay sa pagtilaok ng tandang.
    reason: cultural_note
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: manatili kayong gising
  rationale: Ang pautos ay humihiling ng patuloy na pagiging alerto at mapagbantay. Likas sa modernong Tagalog ang parirala at angkop sa konteksto ng paghihintay sa buong magdamag.
- source_word: οὖν
  choice: Kaya
  rationale: Malinaw at natural nitong ipinapakita ang kongklusyon o bunga ng naunang turo.
- source_word: οὐκ οἴδατε
  choice: hindi ninyo alam
  rationale: Tuwirang salin ng negatibong pandiwa ng pagkaalam, nang walang di-kinakailangang pagpapalawak.
- source_word: πότε
  choice: kung kailan
  rationale: Natural na anyo sa Tagalog para sa di-tuwirang tanong tungkol sa oras.
- source_word: ὁ κύριος τῆς οἰκίας
  choice: ang panginoon ng bahay
  rationale: Ipinahahayag ng 'panginoon' ang may kapangyarihan sa sambahayan at pinananatili rin ang maaaring pahiwatig na higit sa literal na larawan, nang hindi tahasang nilulutas iyon.
- source_word: ἔρχεται
  choice: darating
  rationale: Bagaman nasa present tense ang Griyego, tumutukoy ito sa inaasahang pagdating sa hinaharap; natural itong ipinahahayag sa Tagalog sa aspektong kontemplatibo.
- source_word: ὀψὲ
  choice: sa gabi
  rationale: Sa pagkakasunod-sunod ng mga pagbabantay sa magdamag, tumutukoy ito sa unang bahagi o pagbabantay sa gabi.
- source_word: μεσονύκτιον
  choice: sa hatinggabi
  rationale: Karaniwan at eksaktong panandang-oras sa Tagalog.
- source_word: ἀλεκτοροφωνίας
  choice: sa pagtilaok ng tandang
  rationale: Malinaw sa ordinaryong mambabasa at pinananatili ang panandang-oras na kaugnay ng tilaok ng tandang.
- source_word: πρωΐ
  choice: sa umaga
  rationale: Malinaw na tumutukoy sa huling yugto ng magdamag patungo sa umaga, nang hindi labis na nililimitahan sa mismong bukang-liwayway.
theological_decisions:
- issue: Ang pagsasalin ng κύριος sa larawang pambahay na maaari ring di-tuwirang tumukoy kay Jesus
  choice: panginoon ng bahay
  alternative: may-ari ng bahay; puno ng sambahayan
  rationale: Ang parirala ay tumutukoy muna sa taong may kapangyarihan sa bahay. Pinananatili ng 'panginoon ng bahay' ang karaniwang kahulugan sa larawan at ang posibleng mas malalim na pahiwatig, sa halip na tahasang gawing banal na titulo o bawasan ito sa pagmamay-ari lamang.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang 'manatili kayong gising' upang ihatid ang patuloy na pagbabantay, at ang mga panandang-oras ay inayos sa payak at madaling maunawaang serye.
