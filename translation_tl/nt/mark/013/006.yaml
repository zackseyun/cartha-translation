  yaml_path: translation/nt/mark/013/006.yaml
  text: Many will come in my name[a], saying, ‘I am he,’ and they will lead many astray.
translation:
  language: tl
  text: Marami ang darating sa aking pangalan at magsasabing, “Ako iyon,”[a] at marami ang ililigaw nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O mas literal, “Ako nga.” Walang tahasang panaguri sa Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: Marami
  rationale: Pang-uring ginamit bilang pangngalan para sa maraming tao; likas at tuwiran ang “Marami” sa Filipino.
- source_word: ἐλεύσονται
  choice: ang darating
  rationale: Tuwirang ipinapahayag ang panghinaharap na pagdating o paglitaw ng mga tinutukoy.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: sa pangalan ko
  rationale: Pinananatili ang idyomang tumutukoy sa pag-angkin ng kaugnayan o awtoridad sa pangalan ni Jesus nang hindi labis na ipinapaliwanag ito sa pangunahing teksto.
- source_word: λέγοντες
  choice: at magsasabing
  rationale: Likas na iniuugnay sa Filipino ang kasabay na kilos at nilalaman ng kanilang sasabihin.
- source_word: ὅτι Ἐγώ εἰμι
  choice: “Ako iyon”
  rationale: Ginagawang maunawaan sa natural na Filipino ang pahayag ng pagkakakilanlan, habang ipinapakita sa talababa na walang tahasang panaguri ang Griyego.
- source_word: πολλοὺς
  choice: marami
  rationale: Tumutukoy sa maraming taong magiging layon ng panlilinlang; maikli at likas ang anyo.
- source_word: πλανήσουσιν
  choice: ililigaw
  rationale: Pinananatili ang larawang sanhi ng paglihis o pagkaligaw, sa halip na paliitin lamang sa intelektuwal na panlilinlang.
theological_decisions:
- issue: Pagpapakahulugan sa Ἐγώ εἰμι sa babala tungkol sa mga huwad na nag-aangkin
  choice: Ako iyon
  alternative: Ako ay
  rationale: Sa konteksto, isa itong pag-angkin ng pagkakakilanlan, ngunit hindi tahasang binabanggit ng Griyego ang panaguri. Ang “Ako iyon” ay malinaw sa Filipino nang hindi espesipikong idinaragdag ang titulong “Mesiyas”; pinananatili ng talababa ang mas literal at bukas na anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sa pangalan ko” bilang pamilyar ngunit tumpak na idyoma, at “ililigaw” upang mapanatili ang metaporikal na lakas ng πλανάω.
