  text: οὕτως καὶ ὑμεῖς, ὅταν ⸂ἴδητε ταῦτα⸃ γινόμενα, γινώσκετε ὅτι ἐγγύς ἐστιν ἐπὶ θύραις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/029.yaml
  text: So also you[a], when you see these things happening, know that it is near, at the doors.
translation:
  language: tl
  text: 'Gayon din kayo: kapag nakita ninyong nangyayari ang mga bagay na ito, alamin ninyo na malapit na ito[a]—nasa mga pintuan na.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “malapit na siya.” Hindi tahasang binabanggit sa Griyego ang simuno.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: Gayon din kayo
  rationale: Iniuugnay ng οὕτως ang pahayag sa naunang paghahambing tungkol sa puno ng igos, at binibigyang-diin ng καὶ ὑμεῖς ang mga alagad bilang katumbas na mga tagamasid.
- source_word: ὅταν ἴδητε
  choice: kapag nakita ninyo
  rationale: Ang ὅταν na may aorist subjunctive ay nagpapahayag ng pangyayaring inaasahan sa hinaharap; natural itong isalin sa Filipino bilang “kapag nakita ninyo.”
- source_word: ταῦτα γινόμενα
  choice: nangyayari ang mga bagay na ito
  rationale: Pinananatili ng “mga bagay na ito” ang maramihang ταῦτα, at malinaw at makabago ang “nangyayari” para sa γινόμενα.
- source_word: γινώσκετε
  choice: dapat ninyong malaman
  rationale: Ipinahahayag nito ang utos na unawain ang ipinahihiwatig ng mga palatandaan. Ang “dapat ninyong malaman” ay natural sa Filipino at pinananatili ang puwersang pautos.
- source_word: ὅτι ἐγγύς ἐστιν
  choice: na malapit na ito
  rationale: Walang tahasang simuno ang ἐστιν sa Griyego. Ang “ito” ay hindi tiyak na pantukoy sa nalalapit na pangyayari o katuparan at hindi nito ipinipilit ang isang partikular na reperente.
- source_word: ἐπὶ θύραις
  choice: nasa mga pintuan na
  rationale: Pinananatili nito ang maramihang θύραις at ang larawang nagpapahiwatig ng sukdulang pagkalapit.
theological_decisions:
- issue: Hindi tahasang simuno ng ἐστιν (“malapit na”)
  choice: “malapit na ito” sa pangunahing teksto
  alternative: “malapit na siya”
  rationale: Hindi tinutukoy ng Griyego ang simuno. Ang “ito” ay nagpapanatili sa kawalang-tiyak kung ang tinutukoy ay ang nalalapit na pangyayari o katuparan, samantalang kinikilala sa talababa ang posibleng personal na reperente, gaya ng Anak ng Tao.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Gayon din kayo” upang mapanatili ang ugnayan sa paghahambing sa naunang talata. Pinanatili ang di-karaniwang maramihang “mga pintuan” dahil tahasan itong nasa Griyego at nauunawaan pa rin ang larawan ng matinding pagkalapit.
