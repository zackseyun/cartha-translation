  source_fidelity: Tumpak na naipapahayag ng salin ang temporal na ὅταν δέ, ang dalawang magkakaugnay ngunit natatanging bagay na naririnig—mga digmaan at mga balita tungkol sa mga digmaan—ang utos na huwag mabahala, ang pangangailangang ipinahahayag ng δεῖ, at ang diin ng οὔπω na hindi pa ito ang wakas. Ang “Kailangang mangyari ang mga ito” ay wastong nagpapahiwatig ng pangangailangan nang hindi nagdaragdag ng paliwanag na wala sa teksto.
  naturalness: Natural, malinaw, at angkop sa makabagong Filipino Tagalog ang daloy. Ang “At kapag,” “huwag kayong mabahala,” at “hindi pa iyon ang wakas” ay marangal ngunit madaling maunawaan. Katanggap-tanggap sa Filipino ang “makarinig ... ng mga digmaan” sa ganitong kontekstong pangbalita.
