  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅταν δὲ ⸀ἀκούσητε πολέμους καὶ ἀκοὰς πολέμων, μὴ θροεῖσθε· ⸀δεῖ γενέσθαι, ἀλλ’ οὔπω τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/007.yaml
  text: And when you hear of wars and reports of wars[a], do not be alarmed; these things must happen, but the end is not yet.
translation:
  language: tl
  text: At kapag nakarinig kayo ng mga digmaan at mga balita tungkol sa mga digmaan[a], huwag kayong mabahala. Kailangang mangyari ang mga ito, ngunit hindi pa iyon ang wakas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga ulat tungkol sa mga digmaan” o “mga sabi-sabi tungkol sa mga digmaan.” Ang salitang Griyego ay maaaring tumukoy sa balita, ulat, o sabi-sabing naririnig tungkol sa mga digmaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: At kapag
  rationale: Ipinahahayag ng ὅταν ang pangyayaring inaasahan sa hinaharap, habang banayad na pang-ugnay ang δέ. Natural sa Filipino ang “At kapag” at hindi nito pinalalakas nang labis ang pagsalungat.
- source_word: ἀκούσητε
  choice: nakarinig kayo
  rationale: Ang aorist subjunctive kasunod ng ὅταν ay angkop isalin bilang panghinaharap na kondisyon sa Filipino. Natural ang “kapag nakarinig kayo” sa kontekstong ito.
- source_word: πολέμους
  choice: mga digmaan
  rationale: Tuwiran at karaniwang katumbas ng pangmaramihang πόλεμος.
- source_word: ἀκοὰς πολέμων
  choice: mga balita tungkol sa mga digmaan
  rationale: Maaaring tumukoy ang ἀκοή sa balita, ulat, o sabi-sabi na naririnig. Pinili ang “mga balita” bilang malawak at natural na salin; inilagay sa talababa ang posibleng “mga sabi-sabi.”
- source_word: μὴ θροεῖσθε
  choice: huwag kayong mabahala
  rationale: Ipinahahayag ng θροέομαι ang pagkabagabag o pagkatakot dahil sa nakagugulat na pangyayari. Dignified at natural ang “mabahala” nang hindi kinakailangang magpahiwatig ng ganap na pagkasindak.
- source_word: δεῖ γενέσθαι
  choice: Kailangang mangyari ang mga ito
  rationale: Pinananatili ng “kailangang” ang diwa ng pangangailangan sa δεῖ, at nililinaw ng “ang mga ito” ang ipinahihiwatig na paksa mula sa naunang mga digmaan at balita.
- source_word: ἀλλ’ οὔπω τὸ τέλος
  choice: ngunit hindi pa iyon ang wakas
  rationale: Natural sa Filipino ang ayos na ito at pinananatili nito ang diin na ang nabanggit na mga pangyayari ay hindi pa ang mismong wakas.
theological_decisions:
- issue: Eskatolohikal na pangangailangan sa δεῖ γενέσθαι
  choice: Kailangang mangyari ang mga ito
  alternative: Mangyayari ang mga ito / Dapat mangyari ang mga ito
  rationale: Pinananatili ng “kailangang” ang lakas ng tekstong nagsasaad ng pangangailangan, ngunit hindi nito ipinapaliwanag ang mekanismo ni nag-aangkat ng isang tiyak na sistema tungkol sa mga pangyayari sa wakas.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “digmaan,” “mabahala,” at “wakas” bilang mga salitang madaling maunawaan ngunit angkop sa seryosong tono ng talata.
