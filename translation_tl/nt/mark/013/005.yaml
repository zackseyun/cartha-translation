    issue: Hindi lubos na natural ang “nagsimulang magsabi si Jesus.”
    rationale: Bagaman literal na nauunawaan, ang “magsabi” ay karaniwang humihingi ng tiyak na bagay na sasabihin. Mas likas ang “nagsimulang magsalita,” nang hindi nawawala ang aspektong inceptive ng ἤρξατο λέγειν.
  - severity: medium
    issue: Maaaring malabo ang saklaw ng “makapagligaw” sa pangunahing pangungusap.
    rationale: Ang “upang walang sinumang makapagligaw” ay maaaring basahing paghadlang sa kakayahan ng sinuman, samantalang ang Griyego ay babalang iwasan na sila ay malinlang o mailigaw. Ang pasibong “huwag kayong mailigaw ninuman” ay mas tuwirang katumbas.
