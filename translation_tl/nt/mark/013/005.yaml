  verdict: revise
  source_fidelity: Tumpak na naipapahayag ng draft ang banayad na pang-ugnay na δέ, ang aspektong pasimula ng ἤρξατο λέγειν, ang pangmaramihang kausap, at ang patuloy na babala ng Βλέπετε. Gayunman, ang “upang walang sinumang makapagligaw sa inyo” ay maaaring umugnay sa kakayahan ng manliligaw (“be able to lead astray”) sa halip na sa pag-iwas sa pangyayaring babala ng μή-clause. Ang rebisyon ay mas tuwirang nagpapahayag na huwag silang mailigaw ninuman.
  naturalness: Ang “nagsimulang magsabi si Jesus” ay nauunawaan ngunit hindi gaanong likas sa makabagong Tagalog. Mas karaniwan at matatas ang “nagsimulang magsalita si Jesus sa kanila.” Ang “Mag-ingat kayo na huwag kayong mailigaw ninuman” ay malinaw, marangal, at likas na pananalita.
  terminology: Ang “mailigaw” ay angkop para sa πλανήσῃ sapagkat pinananatili nito ang parehong ideya ng panlilinlang at paglihis o pagpapalayo sa tamang landas. Hindi ito nagdaragdag ng interpretasyong doktrinal. Ang alternatibong “malinlang” ay wastong makitid na leksikal na alternatibo.
