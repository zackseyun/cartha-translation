base_translation:
  language: en
  yaml_path: translation/nt/mark/013/005.yaml
  text: Then Jesus began to say to them[a], “See to it that no one leads you astray.”
translation:
  language: tl
  text: At nagsimulang magsalita si Jesus sa kanila, “Mag-ingat kayo na huwag kayong mailigaw ninuman.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Magbantay kayo na huwag kayong malinlang ninuman.”
    reason: 'Leksikal na alternatibo: maaaring idiin ng Βλέπετε ang pagbabantay at ng πλανήσῃ ang panlilinlang.'
lexical_decisions:
- source_word: δὲ
  choice: At
  rationale: Isang banayad na pang-ugnay ang δέ. Likas sa salaysay ang “At” at pinananatili nito ang pagpapatuloy nang hindi nagpapahiwatig ng matinding pagsalungat.
- source_word: ἤρξατο λέγειν
  choice: nagsimulang magsabi
  rationale: Pinananatili nito ang kahulugan ng pagsisimula sa pagsasalita at ang karaniwang estilong pasalaysay ni Marcos, habang nananatiling malinaw sa makabagong Tagalog.
- source_word: αὐτοῖς
  choice: sa kanila
  rationale: Panghalip lamang ang tahasang nasa Griyego. Bagaman ang tinutukoy ay ang mga alagad ayon sa konteksto, hindi iyon idinaragdag sa pangunahing teksto.
- source_word: Βλέπετε
  choice: Mag-ingat kayo
  rationale: Ang pangkasalukuyang pautos ay nananawagan ng patuloy na pagbabantay. Likas at malinaw na babala sa Tagalog ang “Mag-ingat kayo.”
- source_word: μή τις ὑμᾶς πλανήσῃ
  choice: upang walang sinumang makapagligaw sa inyo
  rationale: Ipinahahayag ng μή kasama ng subjunctive ang isang bagay na dapat iwasan. Pinananatili ng “makapagligaw” ang larawan ng pag-akay palayo sa tamang landas at hindi ito nililimitahan sa intelektuwal na panlilinlang lamang.
theological_decisions:
- issue: Saklaw ng babala sa πλανήσῃ
  choice: Babala laban sa panlilinlang na naglalayo sa tamang landas
  alternative: Babala na tumutukoy lamang sa maling impormasyon o intelektuwal na panlilinlang
  rationale: Maaaring mangahulugan ang πλανάω ng panlilinlang at pagpapaligaw. Pinananatili ng salin ang mas malawak na moral at espirituwal na larawan nang hindi nagdaragdag ng doktrinang wala sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang pangmaramihang “kayo” ayon sa ὑμᾶς. Iniwasan ang makalumang “mangagingat” at ang pagdaragdag ng “mga alagad” na hindi tahasang nasa talata.
