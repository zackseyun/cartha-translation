revisions:
- from: At nagsimulang magsabi si Jesus sa kanila, “Mag-ingat kayo upang walang sinumang makapagligaw sa inyo.”[a]
  to: At nagsimulang magsalita si Jesus sa kanila, “Mag-ingat kayo na huwag kayong mailigaw ninuman.”[a]
  rationale: Pinalitan ang hindi gaanong idiomatikong “nagsimulang magsabi” ng “nagsimulang magsalita.” Inayos din ang babalang μή τις ὑμᾶς πλανήσῃ upang malinaw na ang mga kausap ang hindi dapat mailigaw ng sinuman, sa halip na magpahiwatig ng kakayahan lamang ng posibleng manliligaw. Napanatili ang ambiguity at saklaw ng πλανήσῃ sa pamamagitan ng pangunahing “mailigaw” at ng alternatibong “malinlang.”
