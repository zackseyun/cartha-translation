id: MRK.13.20
reference: Mark 13:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ εἰ μὴ ⸂ἐκολόβωσεν κύριος⸃ τὰς ἡμέρας, οὐκ ἂν ἐσώθη πᾶσα σάρξ. ἀλλὰ διὰ τοὺς ἐκλεκτοὺς οὓς ἐξελέξατο ἐκολόβωσεν τὰς ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/020.yaml
  text: And if the Lord had not cut short the days[a], no flesh would have been saved. But for the sake of the elect, whom he chose, he cut short the days.
translation:
  language: tl
  text: At kung hindi pinaikli ng Panginoon ang mga araw na iyon, walang sinumang maliligtas.[a] Ngunit alang-alang sa mga hinirang na pinili niya, pinaikli niya ang mga araw na iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “walang laman.” Ibig sabihin, walang tao o walang sinuman; sa kontekstong ito, walang mananatiling buhay.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκολόβωσεν
  choice: pinaikli
  rationale: Likas at tuwirang katumbas ito ng ‘shortened/cut short’ sa konteksto ng isang takdang panahon. Iisang salin ang ginamit sa dalawang paglitaw upang mapanatili ang pag-uulit ng Griyego.
- source_word: κύριος
  choice: Panginoon
  rationale: Karaniwang marangal at biblikal na salin ng κύριος, at tiyak ang tinutukoy sa konteksto kahit walang artikulo sa Griyego.
- source_word: τὰς ἡμέρας
  choice: ang mga araw na iyon
  rationale: Ang ‘iyon’ ay natural sa Filipino at nililinaw na tumutukoy ang parirala sa mga araw ng kapighatiang kababanggit, nang hindi higit na tinutukoy ang haba o uri ng panahong iyon.
- source_word: οὐκ ἂν ἐσώθη
  choice: walang sinumang maliligtas
  rationale: Ipinahahayag nito ang salungat-sa-katotohanang bunga ng kondisyon at pinananatili ang karaniwang salin ng σῴζω na ‘maliligtas.’ Sa konteksto, pangunahing tumutukoy ito sa pananatiling buhay.
- source_word: πᾶσα σάρξ
  choice: walang sinuman
  rationale: Ang literal na ‘lahat ng laman’ sa saklaw ng pagtanggi ay isang idyomang tumutukoy sa walang taong makaliligtas. Ang ‘walang sinuman’ ay malinaw at natural sa modernong Filipino; inilagay sa talababa ang literal na anyo.
- source_word: διὰ τοὺς ἐκλεκτούς
  choice: alang-alang sa mga hinirang
  rationale: Ipinahahayag ng ‘alang-alang sa’ ang dahilan o kapakinabangang ipinahihiwatig ng διά na may akusatibo, habang pinananatili ng ‘mga hinirang’ ang katawagang teolohikal nang hindi ito binibigyan ng makitid na denominasyonal na pakahulugan.
- source_word: οὓς ἐξελέξατο
  choice: na pinili niya
  rationale: Tuwirang isinasalin nito ang sugnay na panghalip at pinananatili ang ugnayang leksikal ng ‘mga hinirang’ at ‘pinili,’ nang natural sa Filipino.
theological_decisions:
- issue: Kahulugan ng ‘maliligtas’ sa konteksto
  choice: Pinanatili ang ‘maliligtas,’ habang inuunawa ang agarang diwa bilang pagkaligtas ng buhay sa panahon ng kapighatian.
  alternative: ‘Mananatiling buhay’ o ‘makaliligtas,’ na tahasang naglilimita sa pisikal na kaligtasan.
  rationale: Ang konteksto ay tungkol sa mapaminsalang mga araw at pagkapuksa ng tao. Gayunman, ang σῴζω ay may mas malawak na saklaw kaysa ‘mabuhay,’ kaya pinananatili ng salin ang salita nang hindi ginagawang tuwirang pahayag tungkol sa walang-hanggang kaligtasan.
- issue: Tinutukoy ng ‘mga hinirang’
  choice: Pinanatili ang katawagang ‘mga hinirang’ bilang mga taong alang-alang sa kanila ay pinaikli ang mga araw, nang walang dagdag na paliwanag tungkol sa uri ng pagkahirang.
  alternative: ‘Mga pinili,’ na maaaring maging mas karaniwan ngunit maaaring pahinain ang natatanging katawagan bago ang kasunod na ‘pinili niya.’
  rationale: Sinasabi ng talata na sila ay hinirang at pinili, ngunit hindi nito nilulutas ang mas malawak na pagtatalo kung indibidwal o pangkatan ang pagkahirang o kung paano ito kaugnay ng predestinasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘alang-alang’ at ‘mga hinirang’ dahil pamilyar ang mga ito sa wikang biblikal ngunit nauunawaan pa rin ng karaniwang mambabasa. Iniwasan ang sobrang literal na ‘walang laman’ sa pangunahing teksto sapagkat maaari itong mapagkamalang tumutukoy sa katawan o laman ng bagay sa modernong Filipino.
