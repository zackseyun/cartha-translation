  yaml_path: translation/nt/mark/013/030.yaml
  text: Truly I say to you that this generation will certainly not pass away until all these things happen[a][b].
translation:
  language: tl
  text: 'Katotohanang sinasabi ko sa inyo: hinding-hindi lilipas ang salinlahing ito[a] hanggang sa mangyari ang lahat ng ito[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang bayang ito” o “ang lahing ito.” Maaaring magkaroon ng mas malawak na kahulugan ang salitang Griego na γενεά, bagaman “salinlahi” ang pinakanatural dito.
    reason: lexical_alternative
  - marker: b
    text: Ang “hinding-hindi lilipas” ay nagsasalin sa mariing pagtanggi sa Griego.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Tinitiyak ko
  rationale: Bilang panimula sa isang solemneng pahayag ni Jesus, natural at marangal sa makabagong Tagalog ang “Tinitiyak ko,” at naipahahayag nito ang awtoritatibong diin ng ἀμήν.
- source_word: λέγω ὑμῖν
  choice: sa inyo
  rationale: Kasama ng “Tinitiyak ko,” malinaw nitong pinananatili ang tuwirang pakikipag-usap sa maramihang tagapakinig nang hindi nagiging paulit-ulit o alanganin sa Tagalog.
- source_word: οὐ μὴ παρέλθῃ
  choice: hinding-hindi lilipas
  rationale: Ang inuulit na “hindi” ay likas na paraan sa Tagalog upang ihatid ang mariing pagtanggi ng οὐ μή; pinananatili naman ng “lilipas” ang temporal na larawan ng παρέρχομαι.
- source_word: ἡ γενεὰ αὕτη
  choice: ang salinlahing ito
  rationale: Ang “salinlahi” ang pinakanatural na katumbas ng γενεά sa temporal na konteksto at hindi nito nilulutas ang pinagtatalunang interpretasyon.
- source_word: μέχρις οὗ
  choice: hanggang sa
  rationale: Direkta at natural itong nagpapahayag ng temporal na hangganan.
- source_word: ταῦτα πάντα
  choice: ang lahat ng ito
  rationale: Malinaw nitong tinutukoy nang sama-sama ang mga pangyayaring binanggit sa naunang diskurso.
- source_word: γένηται
  choice: mangyari
  rationale: Sa kontekstong tumutukoy sa mga pangyayari, malinaw at karaniwan ang “mangyari” para sa γίνομαι.
theological_decisions:
- issue: Kahulugan ng “ang salinlahing ito” (ἡ γενεὰ αὕτη) sa diskursong eskatolohikal
  choice: Isinalin nang tuwiran bilang “ang salinlahing ito.”
  alternative: “ang bayang ito” o “ang lahing ito”; maaari ring ipakahulugan ng ilan bilang isang salinlahi sa hinaharap na makakakita sa pagsisimula ng mga tanda.
  rationale: Ang karaniwang temporal na kahulugan ang pinakanatural sa konteksto. Pinananatili ng salin ang tunay na tensiyon at hindi ipinapasok sa teksto ang isang tiyak na sistemang eskatolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Tinitiyak ko sa inyo” bilang natural na katumbas ng solemneng pormulang ἀμὴν λέγω ὑμῖν, at “hinding-hindi” upang marinig sa Tagalog ang lakas ng mariing negasyon.
