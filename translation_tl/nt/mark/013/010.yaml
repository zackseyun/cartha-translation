  text: And the good news must first be proclaimed to all the nations[a][b].
translation:
  language: tl
  text: At kailangan munang ipahayag ang magandang balita[a] sa lahat ng bansa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ebanghelyo.” Ang Griyegong εὐαγγέλιον ay literal na nangangahulugang “magandang balita.”
    reason: lexical_alternative
  - marker: b
    text: O “sa gitna ng lahat ng bansa”; sa ilang konteksto, ang ἔθνη ay maaari ring mangahulugang “mga Hentil.”
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Ipinagpapatuloy nito ang naunang pahayag nang hindi nagdaragdag ng diwang pasalungat.
- source_word: εἰς πάντα τὰ ἔθνη
  choice: sa lahat ng bansa
  rationale: Likas itong pagpapahayag sa Filipino ng saklaw o patutunguhan ng pangangaral. Pinananatili ng “mga bansa” ang malawak na etniko at pandaigdigang saklaw, nang hindi ito agad nililimitahan sa mga Hentil.
- source_word: πρῶτον
  choice: muna
  rationale: Sa konstruksiyong “kailangan munang,” malinaw at natural na ipinahahayag ang temporal na prioridad ng πρῶτον.
- source_word: δεῖ
  choice: kailangan
  rationale: Pinananatili nito ang diwa ng pangangailangan, kabilang ang posibleng banal o eskatolohikal na pahiwatig, nang hindi tahasang tinutukoy ang pinagmumulan nito.
- source_word: κηρυχθῆναι
  choice: ipahayag
  rationale: Ang pasibong infinitive ay tumutukoy sa hayagan at pampublikong pagpapahayag. Ang “ipahayag” ay kasalukuyan, malinaw, at hindi limitado sa pormal na pangangaral sa pulpito.
- source_word: τὸ εὐαγγέλιον
  choice: ang magandang balita
  rationale: Tuwirang ipinahahayag nito ang kahulugan ng εὐαγγέλιον sa natural na modernong Filipino; inilalagay sa talababa ang tradisyonal na “ebanghelyo.”
theological_decisions:
- issue: Saklaw ng ἔθνη
  choice: lahat ng bansa
  alternative: lahat ng mga Hentil
  rationale: Pinananatili ng salin ang malawak at pandaigdigang saklaw ng pahayag. Dahil maaari ring mangahulugan ang ἔθνη ng “mga Hentil” ayon sa konteksto, itinatala ang posibilidad na iyon sa talababa sa halip na gawing tanging pakahulugan.
- issue: Lakas ng δεῖ
  choice: kailangan
  alternative: nararapat
  rationale: Ang “kailangan” ay malinaw na nagpapanatili ng necessity na nasa Griyego. Hindi nito tahasang sinasabing banal na itinakda ang pangangailangang ito, bagaman maaaring may gayong pahiwatig sa konteksto.
translation_notes:
  register: Modernong Filipino na malinaw, natural, at marangal. Ginamit ang “kailangan munang ipahayag” upang mapanatili ang necessity at temporal priority ng Griyego, at ang “magandang balita” para sa madaling pagkaunawa habang kinikilala sa talababa ang tradisyonal na “ebanghelyo.”
