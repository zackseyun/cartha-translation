  yaml_path: translation/nt/mark/013/013.yaml
  text: And you will be hated by all because of my name[d][c][b][a]. But the one who endures to the end will be saved.
translation:
  language: tl
  text: Kapopootan kayo ng lahat dahil sa aking pangalan.[a] Ngunit ang magtiis[b] hanggang sa wakas ay maliligtas.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “alang-alang sa aking pangalan.”
    reason: lexical_alternative
  - marker: b
    text: O, “manatiling matatag” o “magtiyaga.”
    reason: lexical_alternative
  - marker: c
    text: O, “siya ay ililigtas.” Maaaring tumukoy ang salitang Griyego sa pagliligtas mula sa panganib o sa kaligtasan sa mas malawak na diwa; hindi ganap na nililimitahan ng konteksto ang kahulugan.
    reason: alternative_reading
lexical_decisions:
- source_word: μισούμενοι
  choice: kapopootan
  rationale: Kasama ng ἔσεσθε, nagpapahayag ito ng mangyayari sa hinaharap. Ang “kapopootan” ay natural sa Filipino at malinaw na nagpapanatili sa diwang pasibo.
- source_word: ὑπὸ πάντων
  choice: ng lahat
  rationale: Pinananatili nito ang malawak at matinding pahayag ng πάντων nang hindi ito nililimitahan o pinahihina.
- source_word: διὰ τὸ ὄνομά μου
  choice: dahil sa aking pangalan
  rationale: Ang διά na may akusatibo ay nagsasaad ng dahilan. Ang “pangalan” ay pinanatili upang masaklaw ang pagkatao at awtoridad ni Jesus at ang katapatan sa kanya.
- source_word: ὁ δὲ ὑπομείνας
  choice: Ngunit ang magtiis
  rationale: Ipinahahayag ng ὑπομένω ang pananatili sa ilalim ng pagsubok. Ang “magtiis” ay karaniwan, malinaw, at hindi nagdaragdag ng teknikal na doktrinang wala sa salita.
- source_word: εἰς τέλος
  choice: hanggang wakas
  rationale: Pinananatili nito ang bukas na pagtukoy sa hantungan—maaaring wakas ng pagsubok, buhay, o pangwakas na panahon—nang hindi ito ipinapasiya sa salin.
- source_word: οὗτος
  choice: siya ang
  rationale: Ang resumptibo at madiing οὗτος ay natural na naipapahayag sa Filipino sa hulma na “ang magtiis…—siya ang…,” nang hindi nagiging asiwa ang pangungusap.
- source_word: σωθήσεται
  choice: maliligtas
  rationale: Saklaw ng σῴζω ang pagliligtas mula sa panganib at ang mas malawak na kahulugang teolohikal ng kaligtasan. Pinananatili ng “maliligtas” ang lawak na ito.
theological_decisions:
- issue: Kahulugan ng σωθήσεται sa pahayag tungkol sa pagtitiis
  choice: maliligtas
  alternative: ililigtas
  rationale: Hindi nililimitahan ng salin ang salita sa pansamantalang pagkaligtas lamang o sa isang partikular na doktrina tungkol sa pagtitiyaga; pinananatili nito ang eskatolohikal na bigat at ang saklaw ng Griyego.
- issue: Saklaw ng πάντων
  choice: ng lahat
  alternative: ng lahat ng tao
  rationale: Pinananatili ang ganap at mariing anyo ng pahayag sa teksto, nang walang idinagdag na paliwanag o pagtatakda sa mismong talata.
translation_notes:
  register: Makabago at marangal na Filipino, na may tuwiran at madaling maunawaang pangungusap. Ginamit ang gitling-pahaba upang natural na mapanatili ang diin ng οὗτος sa halip na alisin ito.
