  text: ⸂καὶ παραδώσει⸃ ἀδελφὸς ἀδελφὸν εἰς θάνατον καὶ πατὴρ τέκνον, καὶ ἐπαναστήσονται τέκνα ἐπὶ γονεῖς καὶ θανατώσουσιν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/012.yaml
  text: And brother will hand over brother to death[a], and a father his child[b], and children will rise up against parents and put them to death.
translation:
  language: tl
  text: Isusuko ng isang kapatid na lalaki ang kaniyang kapatid na lalaki upang ipapatay, at isusuko ng isang ama ang kaniyang anak upang ipapatay. Maghihimagsik ang mga anak laban sa mga magulang at papatayin nila ang mga ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ipapapatay nila ang mga ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδώσει
  choice: isusuko
  rationale: Ang παραδίδωμι ay tumutukoy sa pagsasalin o pagsuko ng isang tao sa kapangyarihan ng iba. Sa konteksto ng pag-uusig, natural na ipinahihiwatig ng “isusuko” ang pagbibigay sa mga awtoridad nang hindi ipinapasok sa pangunahing teksto ang mas interpretatibong “ipagkakanulo.”
- source_word: ἀδελφὸς ἀδελφὸν
  choice: ng kapatid ang kaniyang kapatid
  rationale: Pinananatili nito ang matinding pag-uulit at tahasang ugnayang pampamilya. Bagaman maaaring tumukoy ang ἀδελφός sa lalaking kapatid, sa karaniwang Filipino ay hindi tinutukoy ng “kapatid” ang kasarian maliban kung kailangang linawin.
- source_word: εἰς θάνατον
  choice: upang ipapatay
  rationale: Ipinapahayag nito ang hantungan o layunin ng pagsuko. Mas natural ito sa Filipino kaysa sa literal na “sa kamatayan,” at pinananatili ang diwang ang kapatid ay ibinibigay upang hatulan o patayin.
- source_word: πατὴρ τέκνον
  choice: ng ama ang kaniyang anak
  rationale: Tiyak na lalaki ang πατήρ kaya “ama” ang ginamit, samantalang malawak sa kasarian at edad ang τέκνον kaya “anak” ang angkop.
- source_word: ἐπαναστήσονται
  choice: maghihimagsik ... laban sa
  rationale: Ipinakikita ng pandiwa ang hayagang pagbangon na may pagkapoot laban sa iba. Ang “maghihimagsik laban sa” ay natural at sapat na matindi para sa konteksto.
- source_word: γονεῖς
  choice: mga magulang
  rationale: Ito ang tuwiran at natural na katumbas ng pangmaramihang γονεῖς.
- source_word: θανατώσουσιν αὐτούς
  choice: ipapapatay nila ang mga ito
  rationale: Maaaring mangahulugan ang θανατόω ng pagpatay o pagpapapatay. Pinananatili ng “ipapapatay” ang posibleng diwang sanhi o pagdadala sa opisyal na pagpatay sa konteksto ng pag-uusig.
theological_decisions:
- issue: Mga katawagang pampamilya at kasarian
  choice: Pinanatili ang “ama,” ngunit ginamit ang likas na “kapatid,” “anak,” at “mga magulang” ayon sa saklaw ng mga salitang Griyego at gamit sa Filipino.
  alternative: “Lalaking kapatid” o “kapatid na lalaki” sa dalawang paglitaw ng ἀδελφός.
  rationale: Partikular na panlalaki ang anyong Griyego na ἀδελφός, ngunit ang walang-kasariang “kapatid” ang karaniwang natural na katumbas nito sa Filipino at hindi nito binabago ang larawan ng pagtataksil sa loob ng pamilya. Tahasang pinanatili ang “ama” para sa πατήρ.
- issue: Paraan ng pagpatay sa huling sugnay
  choice: “ipapapatay nila”
  alternative: “papatayin nila”
  rationale: Hindi nililinaw ng teksto kung sila mismo ang papatay o magiging dahilan upang patayin ang kanilang mga magulang. Ang “ipapapatay” ay umaayon sa mapang-usig at posibleng hudisyal na konteksto nang hindi ginagawang tiyak ang paraang hindi tahasang sinabi.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kaniyang” para sa pormal ngunit madaling maunawaang tono, at iniwasan ang di-likas na literalismong “isuko sa kamatayan.”
