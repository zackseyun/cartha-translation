revisions:
- from: Isusuko ng kapatid ang kaniyang kapatid upang ipapatay[a], at isusuko ng ama ang kaniyang anak. Maghihimagsik ang mga anak laban sa kanilang mga magulang at ipapapatay nila ang mga ito.[b]
  to: Isusuko ng isang kapatid na lalaki ang kaniyang kapatid na lalaki upang ipapatay, at isusuko ng isang ama ang kaniyang anak upang ipapatay. Maghihimagsik ang mga anak laban sa mga magulang at papatayin nila ang mga ito.[a]
  rationale: Idinagdag ang ‘upang ipapatay’ sa sugnay tungkol sa ama upang mapanatili ang saklaw ng εἰς θάνατον. Pinalitan ang causative na ‘ipapapatay nila’ ng tuwirang aktibong ‘papatayin nila’ para sa θανατώσουσιν. Ginawang ‘kapatid na lalaki’ ang ἀδελφός upang maipakita ang kasariang tahasang nasa Griyego, habang pinanatiling natural ang Filipino.
