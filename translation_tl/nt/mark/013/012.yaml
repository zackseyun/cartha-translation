review_pass:
  verdict: revise
  source_fidelity: Kailangang idagdag sa ikalawang sugnay ang katumbas ng εἰς θάνατον, sapagkat saklaw ito ng pinahiwatig na pandiwang παραδώσει at ng pariralang ‘to death.’ Sa huling sugnay, ang θανατώσουσιν ay aktibong ‘papatayin nila,’ hindi ang mas causative na ‘ipapapatay nila.’ Ang tahasang panlalaking ἀδελφός ay mas tapat na maipapakita bilang ‘kapatid na lalaki.’
  naturalness: Natural at malinaw sa makabagong Filipino ang ‘isusuko ... upang ipapatay’ at ‘maghihimagsik ... at papatayin nila.’ Ang pag-uulit ng ‘kapatid na lalaki’ ay nararapat dahil inuulit din ng Griyego ang katawagang pampamilya.
  terminology: Pinananatili ang ‘ama,’ ‘anak,’ at ‘mga magulang.’ Ang ‘isusuko’ ay angkop para sa παραδώσει; ang talababa ay nagbibigay ng ‘ipagkakanulo’ bilang alternatibong pagbasa sa konteksto.
  issues:
  - severity: high
    issue: Nawala sa ikalawang sugnay ang ‘to death.’
    rationale: Ang ‘at isusuko ng ama ang kaniyang anak’ ay hindi naipahihiwatig nang sapat na ang pagsuko ay tungo rin sa kamatayan, na nasa Griyegong εἰς θάνατον at saklaw ng magkakaugnay na sugnay.
  - severity: medium
    issue: Ang ‘ipapapatay nila’ ay mas causative kaysa sa Griyegong aktibong pandiwa.
    rationale: Ang θανατώσουσιν ay ‘papatayin nila’ o ‘ilalagay nila sa kamatayan’; hindi nito mismo tinutukoy na ipag-uutos o ipagagawa nila ang pagpatay.
  - severity: low
    issue: Hindi ipinakikita ng ‘kapatid’ ang tahasang panlalaking anyo ng ἀδελφός.
    rationale: Bagaman likas na walang kasarian ang ‘kapatid’ sa Filipino, ang ‘kapatid na lalaki’ ay ligtas at tapat na paglilinaw sa dalawang panlalaking anyo sa pinagmulan.
  revised_text: Isusuko ng isang kapatid na lalaki ang kaniyang kapatid na lalaki upang ipapatay, at isusuko ng isang ama ang kaniyang anak upang ipapatay. Maghihimagsik ang mga anak laban sa mga magulang at papatayin nila ang mga ito.[a]
