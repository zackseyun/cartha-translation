id: MRK.13.24
reference: Mark 13:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἀλλὰ ἐν ἐκείναις ταῖς ἡμέραις μετὰ τὴν θλῖψιν ἐκείνην ὁ ἥλιος σκοτισθήσεται, καὶ ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/024.yaml
  text: But in those days[a], after that tribulation, the sun will be darkened, and the moon will not give its light,
translation:
  language: tl
  text: Ngunit sa mga araw na iyon, pagkatapos ng kapighatiang iyon[a], magdidilim ang araw, at hindi magbibigay ng liwanag ang buwan,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “matinding paghihirap na iyon” o “pagdurusang iyon.”
    reason: Ipinapakita ang leksikal na lawak ng θλῖψις, na maaaring tumukoy sa kapighatian, matinding kagipitan, o pagdurusa.
lexical_decisions:
- source_word: Ἀλλὰ
  choice: Ngunit
  rationale: Likas at marangal na panandang Filipino para sa mariing pagsalungat o paglipat ng diwa mula sa naunang pahayag.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: sa mga araw na iyon
  rationale: Tuwirang pinananatili ang temporal na parirala at ang eskatolohikal na himig nito nang walang dagdag na pagpapaliwanag.
- source_word: μετὰ τὴν θλῖψιν ἐκείνην
  choice: pagkatapos ng kapighatiang iyon[a]
  rationale: Ang μετά na may accusative ay temporal na “pagkatapos.” Ang “kapighatian” ay nagpapanatili sa bigat ng θλῖψις sa kontekstong apokaliptiko, habang ang “iyon” ay nagpapanatili sa tiyak na demonstratibo.
- source_word: ὁ ἥλιος σκοτισθήσεται
  choice: magdidilim ang araw
  rationale: Natural na modernong Filipino para sa mangyayaring pagdidilim ng araw. Bagaman pasibo ang anyong Griyego, magiging pilit ang mahigpit na pasibong salin sa Filipino; pinananatili rito ang hinaharap na pangyayari nang hindi tinutukoy kung sino ang sanhi.
- source_word: καὶ
  choice: at
  rationale: Payak na pang-ugnay sa dalawang magkaugnay na tandang kosmiko.
- source_word: ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς
  choice: hindi magbibigay ng liwanag ang buwan
  rationale: Pinananatili ang payak at matingkad na larawang ang buwan ay “nagbibigay” ng sarili nitong liwanag; ang “liwanag” ang pinakanatural na katumbas ng φέγγος sa konteksto.
theological_decisions:
- issue: Pagpapakahulugan sa θλῖψις sa diskursong apokaliptiko
  choice: kapighatian
  alternative: matinding paghihirap; pagdurusa
  rationale: Ipinahihiwatig ng konteksto ang mabigat na kagipitan, ngunit hindi nililimitahan ng salin ang salita sa isang partikular na sistemang pangwakas na panahon. Ang mga leksikal na alternatibo ay inilalagay sa talababa upang mapanatili ang saklaw ng kahulugan.
- issue: Pasibong anyo ng σκοτισθήσεται
  choice: magdidilim
  alternative: padidilimin
  rationale: Ang “magdidilim” ay natural at hindi nagpapasya kung ang pasibo ay isang divine passive. Ang “padidilimin” ay maaaring labis na maghayag ng panlabas na tagagawa na hindi tahasang binanggit sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kapighatian” upang mapanatili ang bigat at alusyong apokaliptiko ng teksto; ipinaliliwanag sa talababa ang mas pangkaraniwang mga alternatibo. Inilagay ang [a] kaagad pagkatapos ng pariralang tinutukoy nito.
