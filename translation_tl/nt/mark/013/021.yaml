id: MRK.13.21
reference: Mark 13:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀καὶ τότε ἐάν τις ὑμῖν εἴπῃ· ⸀Ἴδε ὧδε ὁ ⸀χριστός, ⸁Ἴδε ἐκεῖ, μὴ πιστεύετε·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/021.yaml
  text: And then[a], if anyone says to you, ‘Look, here is the Messiah!’ or, ‘Look, there!’ do not believe it.
translation:
  language: tl
  text: At pagkatapos, kung may magsabi sa inyo, “Tingnan ninyo, narito ang Mesiyas![a]” o, “Tingnan ninyo, naroon siya!” huwag ninyo itong paniwalaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Cristo.”
    reason: Ibinibigay ang tradisyonal na katumbas ng χριστός habang pinananatili sa pangunahing teksto ang titular na ‘Mesiyas.’
lexical_decisions:
- source_word: καὶ τότε
  choice: At pagkatapos
  rationale: Pinananatili nito ang pang-ugnay na καὶ at ang temporal na τότε sa natural na makabagong Tagalog.
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: kung may magsabi sa inyo
  rationale: Natural nitong ipinapahayag ang pangkalahatang kondisyon at ang di-tiyak na τις nang hindi nagiging labis na pormal.
- source_word: Ἴδε
  choice: Tingnan ninyo
  rationale: Isa itong malinaw at tuwirang panawag-pansin sa maramihang kausap, na angkop sa ὑμῖν.
- source_word: ὧδε
  choice: narito
  rationale: Maikli at idiomatikong katumbas ito ng proximal na pang-abay na nangangahulugang ‘dito.’
- source_word: ὁ χριστός
  choice: ang Mesiyas
  rationale: Ginagamit dito ang χριστός bilang tiyak na titulong pangmesiyas sa pahayag tungkol sa isang inaangking tagapagligtas, hindi bilang pangalang pantangi.
- source_word: ἐκεῖ
  choice: naroon siya
  rationale: Pinananatili ng ‘naroon’ ang kaibhan sa ‘narito’; idinagdag ang ‘siya’ bilang natural na Tagalog na pagpuno sa elipsis, na tumutukoy sa Mesiyas.
- source_word: μὴ πιστεύετε
  choice: huwag ninyo itong paniwalaan
  rationale: Ang ipinagbabawal ay ang pagtanggap sa pahayag; ang ‘ito’ ay natural na tumutukoy sa sinabi habang hindi nililimitahan ang implicit na layon sa taong nagsasalita.
theological_decisions:
- issue: Pagbibigay-kahulugan sa Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Sa kontekstong ito, ang salita ay isang titulo ng inaangking pinahirang tagapagligtas. Ang ‘Mesiyas’ ang mas malinaw na nagpapanatili sa titular at pang-eskatolohiyang diwa; inilalagay sa talababa ang tradisyonal na ‘Cristo.’
- issue: Implicit na layon ng πιστεύετε
  choice: ang pahayag (‘ito’)
  alternative: ang nagsasalita (‘siya’)
  rationale: Walang tahasang layon sa Griyego. Pinananatili ng ‘ito’ ang pokus sa huwad na pahayag at iniiwasang paliitin ang babala sa pagtitiwala lamang sa nagsasalita.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang maramihang ‘ninyo’ upang ipakita ang pangmaramihang ὑμῖν/πιστεύετε. Ang bantas at tuwirang pananalita ay inayos ayon sa natural na gamit sa Filipino.
