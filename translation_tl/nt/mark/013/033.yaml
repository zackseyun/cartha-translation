  text: βλέπετε ⸀ἀγρυπνεῖτε, οὐκ οἴδατε γὰρ πότε ὁ καιρός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/033.yaml
  text: Be on guard; stay awake[a], for you do not know when the time is.
translation:
  language: tl
  text: Mag-ingat kayo; manatiling gising, sapagkat hindi ninyo alam kung kailan ang takdang panahon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang panahon” o “ang oras.” Ang salitang Griyego na καιρός ay madalas tumukoy sa isang mahalaga o itinakdang panahon.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπετε
  choice: Mag-ingat kayo
  rationale: Ang pautos na anyo ay idyomatikong babala na maging alisto at maingat, hindi lamang literal na tumingin. Naiiba rin ito sa kasunod na utos na manatiling gising.
- source_word: ἀγρυπνεῖτε
  choice: manatiling gising
  rationale: Pinananatili nito ang metapora ng hindi pagtulog habang likas ding nagpapahiwatig ng patuloy na pagbabantay.
- source_word: οὐκ οἴδατε
  choice: hindi ninyo alam
  rationale: Tuwirang katumbas ng negatibong pandiwa ng pagkaalam, nang walang hindi kinakailangang pagpapalawak.
- source_word: γὰρ
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng dalawang naunang utos sa marangal at malinaw na Tagalog.
- source_word: πότε
  choice: kung kailan
  rationale: Likas na katumbas sa Tagalog para sa di-tiyak na oras sa isang di-tuwirang tanong.
- source_word: ὁ καιρός
  choice: ang takdang panahon
  rationale: Ang καιρός ay madalas tumukoy sa isang mahalaga, angkop, o itinakdang panahon, hindi lamang sa oras sa pangkalahatan. Sa kontekstong ito, ang 'takdang panahon' ay maikli at nagpapanatili sa bigat ng salita.
- source_word: ἐστιν
  choice: Ø
  rationale: Karaniwang walang tahasang katumbas ang copula na 'is' sa ganitong pangungusap sa Tagalog; likas itong ipinahihiwatig sa 'kung kailan ang takdang panahon.'
theological_decisions:
- issue: Kahulugan ng καιρός sa kontekstong eskatolohikal
  choice: ang takdang panahon
  alternative: ang panahon; ang oras
  rationale: Maaaring tumukoy ang καιρός sa mapagpasyang o itinakdang sandali. Ginamit ang 'takdang panahon' upang maipakita ang leksikal na bigat nito nang hindi tinutukoy kung anong tiyak na pangyayari iyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang pangmaramihang 'kayo/ninyo' upang ipakita ang bilang ng mga pautos at panghalip sa Griyego. Pinanatiling magkaiba ang dalawang utos sa pamamagitan ng 'Mag-ingat' at 'manatiling gising.'
