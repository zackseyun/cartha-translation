base_translation:
  language: en
  yaml_path: translation/nt/mark/013/001.yaml
  text: And as he was going out of the temple[a], one of his disciples says to him, “Teacher[b], look—what wonderful stones and what wonderful buildings!”
translation:
  language: tl
  text: Habang lumalabas siya sa templo[a], sinabi sa kanya ng isa sa kanyang mga alagad, “Guro, tingnan ninyo—kahanga-hanga[b] ang mga bato at mga gusali!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay tumutukoy sa buong kompleks o bakuran ng templo, hindi lamang sa panloob na santuwaryo.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “Napakaganda ng mga bato at mga gusali!” Ang pang-uri sa Griyego ay nagpapahayag ng matinding pagkamangha o paghanga sa uri o katangian ng mga ito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπορευομένου αὐτοῦ
  choice: Habang palabas siya
  rationale: Ang genitive absolute na may present participle ay nagpapahayag ng kasabay at nagpapatuloy na kilos; natural itong naipahahayag sa modernong Tagalog sa ganitong paraan.
- source_word: τοῦ ἱεροῦ
  choice: sa templo
  rationale: Ang ἱερόν ay tumutukoy sa buong lugar o kompleks ng templo, hindi lamang sa panloob na santuwaryo; pinananatili ang karaniwang salitang “templo” at nililinaw ito sa talababa.
- source_word: λέγει
  choice: sinabi
  rationale: Bagaman historical present ang Griyego, mas natural at malinaw sa salaysay na Tagalog ang pangnagdaan; hindi nito binabago ang panahon ng pangyayari.
- source_word: εἷς τῶν μαθητῶν αὐτοῦ
  choice: isa sa kanyang mga alagad
  rationale: Tuwirang katumbas ng partitive expression at likas sa Tagalog.
- source_word: Διδάσκαλε
  choice: Guro
  rationale: Tumpak at karaniwang modernong tawag para sa isang nagtuturo.
- source_word: ἴδε
  choice: tingnan ninyo
  rationale: Likas na pautos na tumatawag ng pansin; ang “ninyo” ay nagpapakita ng magalang na pakikipag-usap sa guro nang hindi nagdaragdag ng titulo.
- source_word: ποταποὶ λίθοι καὶ ποταπαὶ οἰκοδομαί
  choice: napakalalaki ng mga batong ito at napakagara ng mga gusali
  rationale: Ang ποταπός dito ay padamdam na nagpapahayag ng paghanga sa katangian. Sa konteksto, ang laki ng mga bato at karangyaan ng mga gusali ang natural na Tagalog na pagpapahayag, habang ang mas pangkalahatang saklaw ng Griyego ay itinatala sa talababa.
- source_word: λίθοι
  choice: mga batong ito
  rationale: Malinaw sa konteksto na itinuturo ng alagad ang nakikitang mga bato; ang “ito” ay likas na kaakibat ng “tingnan” sa Tagalog.
- source_word: οἰκοδομαί
  choice: mga gusali
  rationale: Malinaw at karaniwang salita para sa maraming istruktura sa kompleks ng templo.
