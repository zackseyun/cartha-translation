  yaml_path: translation/nt/mark/013/016.yaml
  text: And the one in the field must not turn back to get his cloak[a].
translation:
  language: tl
  text: At ang nasa bukid ay huwag bumalik para kunin ang kanyang balabal[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “panlabas na kasuotan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ εἰς τὸν ἀγρόν
  choice: ang nasa bukid
  rationale: Likas at maikli sa modernong Tagalog; pinananatili nito ang pang-isahang pagtukoy sa isang taong nasa bukid nang hindi nililimitahan sa lalaki.
- source_word: ἀγρός
  choice: bukid
  rationale: Ang ἀγρός ay karaniwang tumutukoy sa bukid o lupang sakahan; ang “bukid” ang tuwiran at angkop na salita sa konteksto.
- source_word: μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω
  choice: huwag nang bumalik
  rationale: Malinaw nitong ipinahahayag ang agarang pagbabawal na bumalik. Ang “nang” ay natural na nagpapahiwatig na hindi na dapat magbalik sa iniwan.
- source_word: ἆραι
  choice: kunin
  rationale: Ang pawatas ay nagsasaad ng layunin ng pagbabalik; natural na ipinahahayag ng “para kunin” ang pagkuha sa kasuotang naiwan.
- source_word: ἱμάτιον
  choice: balabal
  rationale: Tumutukoy ito sa panlabas na kasuutan o balabal. Ang “balabal” ay maikli, malinaw, at higit na tiyak kaysa sa pangkalahatang “damit.”
- source_word: αὐτοῦ
  choice: kanyang
  rationale: Pinananatili ang pang-isahang panghalip ng Griyego. Sa Tagalog, ang “kanyang” ay hindi nagtatakda ng kasarian at natural na tumutukoy sa taong nabanggit.
theological_decisions:
- issue: Pang-isahang pangkalahatang pagtukoy sa tao
  choice: Pinanatili ang pang-isahan sa “ang nasa bukid” at “kanyang balabal.”
  alternative: 'Gawing maramihan: “ang mga nasa bukid ... ang kanilang mga balabal.”'
  rationale: Pang-isahan ang konstruksiyon at panghalip sa Griyego. Naipananatili ito nang natural sa Tagalog nang hindi nagdaragdag ng kasariang hindi kailangang tukuyin.
translation_notes:
  register: Modernong, malinaw, at marangal na Tagalog. Ang “huwag nang bumalik” ay angkop sa apurahang babala, at ang “balabal” ay sinamahan ng talababa upang maipakita ang mas malawak na leksikal na kahulugan.
