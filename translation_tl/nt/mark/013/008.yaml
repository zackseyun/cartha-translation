id: MRK.13.8
reference: Mark 13:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐγερθήσεται γὰρ ἔθνος ἐπ’ ἔθνος καὶ βασιλεία ἐπὶ βασιλείαν, ⸀ἔσονται σεισμοὶ κατὰ τόπους, ⸁ἔσονται ⸀λιμοί· ⸀ἀρχὴ ὠδίνων ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/008.yaml
  text: For nation will rise against nation[a], and kingdom against kingdom. There will be earthquakes in various places; there will be famines. These are the beginning of birth pains.
translation:
  language: tl
  text: Sapagkat babangon ang isang bansa laban sa ibang bansa, at ang isang kaharian laban sa ibang kaharian. Magkakaroon ng mga lindol sa iba’t ibang lugar; magkakaroon ng mga taggutom. Ang mga ito ang pasimula ng mga hapdi ng panganganak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga kirot sa panganganak” o “mga sakit ng paghilab.” Ang larawang Griyego ay tumutukoy sa mga hapding kaugnay ng panganganak at ginagamit dito bilang talinghaga sa mga pagdurusang nauuna sa susunod na mangyayari.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθήσεται
  choice: babangon
  rationale: Ipinahahayag ng anyong panghinaharap ang pagbangon ng isang pangkat laban sa iba. Pinananatili ng “babangon” ang kilos at tunggalian nang hindi ginagawang tahasang pasibo ang natural na pangungusap sa Tagalog.
- source_word: ἔθνος ... ἐπ’ ἔθνος
  choice: isang bansa laban sa ibang bansa
  rationale: Maaaring tumukoy ang ἔθνος sa bansa o bayan. Dahil katambal ito ng βασιλεία sa konteksto ng tunggaliang pampolitika, “bansa” ang pinakamalinaw; ginawang “isang ... ibang” ang literal na pag-uulit upang maging natural sa Tagalog.
- source_word: βασιλεία ... ἐπὶ βασιλείαν
  choice: isang kaharian laban sa ibang kaharian
  rationale: Dito, ang βασιλεία ay tumutukoy sa sakop na pampolitika o kaharian, hindi lamang sa abstraktong paghahari. Pinananatili rin nito ang pagkakapantay ng dalawang parirala.
- source_word: σεισμοὶ
  choice: mga lindol
  rationale: Ang σεισμός sa kontekstong ito ay malinaw na tumutukoy sa lindol; ito ang karaniwan at tuwirang salin.
- source_word: κατὰ τόπους
  choice: sa iba’t ibang lugar
  rationale: Ipinahahayag ng κατά kasama ng maramihang τόπους ang pagkaganap sa sari-saring lokasyon.
- source_word: λιμοί
  choice: mga taggutom
  rationale: Ang λιμός ay matinding kakulangan sa pagkain o taggutom, hindi lamang personal na gutom; pinanatili rin ang maramihang bilang.
- source_word: ἀρχὴ
  choice: pasimula
  rationale: Ipinakikita nitong ang mga pangyayaring nabanggit ay unang yugto lamang at hindi ang kabuuan ng kasunod na pagdurusa.
- source_word: ὠδίνων
  choice: mga hapdi ng panganganak
  rationale: Tumutukoy ang ὠδίν sa kirot o hapdi kaugnay ng panganganak. Ang “mga hapdi ng panganganak” ay malinaw, buhay ang larawan, at hindi makaluma.
- source_word: ταῦτα
  choice: Ang mga ito
  rationale: Bagaman isahan ang pandiwang Griyego kasunod ng neuter plural, tumutukoy ang demonstratibo sa maraming pangyayaring nauna; natural sa Tagalog ang “Ang mga ito.”
theological_decisions:
- issue: Apokaliptikong talinghaga sa ἀρχὴ ὠδίνων
  choice: Ang mga pangyayaring ito ang pasimula ng mga hapdi ng panganganak.
  alternative: Ang mga ito ay simula lamang ng mga kaguluhan; o unawain ang mga hapdi bilang mas tiyak na teknikal na yugto sa isang sistemang eskatolohikal.
  rationale: Pinananatili ng salin ang tensiyon ng larawan—pagdurusang nauuna sa kung ano ang darating—nang hindi ito pinapawi bilang karaniwang kaguluhan o nilalagyan ng isang partikular na sistemang eskatolohikal na hindi tahasang sinasabi ng talata.
translation_notes:
  register: Modernong Filipino na may marangal ngunit madaling maunawaang himig. Iniwasan ang sobrang teknikal na pananalita at pinanatili ang paralelismo at talinghaga ng tekstong Griyego. Inilagay ang talababa sa “mga hapdi ng panganganak,” na siyang salitang ipinaliliwanag nito.
