  text: lest, coming suddenly, he find you sleeping.
translation:
  language: tl
  text: baka bigla siyang dumating at matagpuan niya kayong natutulog.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ
  choice: baka
  rationale: Sa kontekstong babala, natural na ipinahahayag ng “baka” ang negatibong posibilidad na dapat pag-ingatan, nang hindi ginagawang hiwalay na pautos ang sugnay.
- source_word: ἐλθὼν ἐξαίφνης
  choice: bigla siyang dumating
  rationale: Pinananatili ang diwa ng aorist participle at ang diin ng ἐξαίφνης sa di-inaasahang pagdating, sa natural na ayos ng modernong Tagalog.
- source_word: εὕρῃ ὑμᾶς καθεύδοντας
  choice: matagpuan niya kayong natutulog
  rationale: Tuwirang inililipat ang pandiwang “matagpuan” at ang participial na kalagayang “natutulog,” habang pinananatili ang maramihang ikalawang panauhan sa “kayo.”
theological_decisions:
- issue: Kung literal o metaporikal ang “natutulog”
  choice: Pinanatili ang payak na “natutulog” nang walang paliwanag sa teksto.
  alternative: “hindi nagbabantay” o “hindi handa”
  rationale: Ang καθεύδοντας ay literal na “natutulog,” ngunit may metaporikal na puwersa sa konteksto. Ang literal na salin ay nagpapanatili sa larawan at hindi isinasara ang saklaw ng kahulugan.
translation_notes:
  register: Maikli, natural, at marangal na modernong Tagalog. Ang “siya” ay pinanatili upang tumugma sa implicit na ikatlong panauhang paksa at sa naunang konteksto. Walang idinagdag na paliwanag o footnote dahil sapat ang teksto at walang mahalagang variant na ibinigay.
