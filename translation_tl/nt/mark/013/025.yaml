  text: καὶ οἱ ἀστέρες ⸂ἔσονται ἐκ τοῦ οὐρανοῦ πίπτοντες⸃, καὶ αἱ δυνάμεις αἱ ἐν τοῖς οὐρανοῖς σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/025.yaml
  text: And the stars will be falling from heaven[b][a], and the powers in the heavens will be shaken.
translation:
  language: tl
  text: At ang mga bituin ay malalaglag mula sa langit,[a] at mayayanig ang mga kapangyarihang nasa kalangitan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa himpapawid.” Ang salitang Griyego na οὐρανός ay maaaring mangahulugang “langit” o “himpapawid,” ayon sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga kapangyarihang nasa kalangitan” ay maaaring tumukoy sa makalangit na mga kapangyarihan, mga puwersang kosmiko, o kaayusan ng kalangitan; hindi ito tinutukoy nang mas tiyak ng Griyego.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀστέρες
  choice: mga bituin
  rationale: Ito ang karaniwan at tuwirang kahulugan, at angkop sa kosmikong tagpo ng pahayag.
- source_word: ἔσονται ... πίπτοντες
  choice: ay malalaglag
  rationale: Likas na ipinahahayag ng aspektong kontemplatibo sa Filipino ang kilos na mangyayari. Pinananatili ng pandiwang “malalaglag” ang matingkad na larawan nang hindi nagdaragdag ng ideyang wala sa Griyego.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: mula sa langit
  rationale: Maaaring tumukoy ang οὐρανός sa “langit” o “himpapawid.” Pinili ang “langit” upang mapanatili ang mataas at kosmikong himig, habang inilalahad sa talababa ang tunay na alternatibo.
- source_word: δυνάμεις
  choice: mga kapangyarihan
  rationale: Pinananatili nito ang lawak ng δύναμις at hindi nagpapasiya kung ang tinutukoy ay mga nilalang, puwersang kosmiko, o kaayusan ng kalangitan.
- source_word: αἱ ἐν τοῖς οὐρανοῖς
  choice: nasa kalangitan
  rationale: Ang “kalangitan” ay natural sa modernong Filipino at naipahihiwatig ang malawak at kosmikong saklaw ng pangmaramihang Griyego nang hindi gumagamit ng di-likas na “mga langit.”
- source_word: σαλευθήσονται
  choice: mayayanig
  rationale: Tuwiran at idiomatikong salin ito ng hinaharap na pasibo, at pinananatili ang marahas na larawan ng pagkakalog o pagyanig.
theological_decisions:
- issue: Kahulugan ng “mga kapangyarihang nasa kalangitan”
  choice: Pinanatili ang pangkalahatang pananalitang “mga kapangyarihang nasa kalangitan.”
  alternative: Tukuyin ang mga ito bilang mga anghel, mga bagay sa kalawakan, mga puwersang kosmiko, o kaayusan ng kalangitan.
  rationale: Malawak ang kahulugan ng pariralang Griyego sa kontekstong apokaliptiko. Hindi nilulutas ng salin ang hindi nililinaw ng teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “kalangitan” para sa natural na kosmikong rehistro at iniwasan ang labis na teknikal o denominasyonal na pananalita.
