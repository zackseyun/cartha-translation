  text: But you[a], watch out[b]; I have told you all things beforehand.
translation:
  language: tl
  text: Ngunit kayo, mag-ingat kayo[a]; sinabi ko na sa inyo nang patiuna ang lahat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magbantay kayo.”
    reason: lexical_alternative
  - marker: b
    text: O “ipinauna ko nang sabihin sa inyo ang lahat” o “binalaan ko na kayo tungkol sa lahat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: kayo
  rationale: Ang tahasang panghalip na pangmaramihan ay pinanatili upang maipahayag ang pagbibigay-diin at ang kaibhan na ipinahihiwatig sa konteksto.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinapakita rito ang pagsalungat o paglipat mula sa naunang babala; natural at malinaw sa Filipino ang “Ngunit.”
- source_word: βλέπετε
  choice: mag-ingat
  rationale: Bagaman literal na may diwang “tumingin,” ang pangkasalukuyang pautos dito ay idyomatikong babala na manatiling mapagbantay. Ang “mag-ingat” ay natural at nagpapanatili ng kagyat na diin.
- source_word: προείρηκα
  choice: sinabi ko na ... nang patiuna
  rationale: Pinagsasama ng salin ang naunang pagsasabi at ang patuloy na kabuluhan nito; ipinahahayag ng “nang patiuna” ang kahulugan ng tambalang pandiwa.
- source_word: ὑμῖν
  choice: sa inyo
  rationale: Likas na ipinahahayag sa Filipino ang di-tuwirang layon ng pandiwa ng pagsasalita sa pariralang “sa inyo.”
- source_word: πάντα
  choice: ang lahat ng ito
  rationale: Tumutukoy nang komprehensibo sa mga bagay na inilalahad ni Jesus sa konteksto. Ang “lahat ng ito” ay mas natural kaysa “lahat ng bagay” at hindi kinakailangang magpahiwatig ng bawat detalye tungkol sa hinaharap.
theological_decisions:
- issue: Diin ng babala ni Jesus at ng nauna niyang pagsisiwalat
  choice: Nagbabala si Jesus sa mga alagad na mag-ingat sapagkat sinabi na niya sa kanila nang patiuna ang lahat ng nauukol sa kontekstong ito.
  alternative: Maaaring unawain ang “ang lahat” bilang pahayag na ibinigay niya ang bawat detalye nang lubusan.
  rationale: Pinananatili ng salin ang malawak na saklaw ng πάντα ngunit gumagamit ng “lahat ng ito” upang hayaang ang konteksto ang magtakda ng tinutukoy, nang hindi ipinapasok ang ideya ng lubusang pagsisiwalat ng bawat pangyayari sa hinaharap.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang pangmaramihang “kayo” at ang natural na babalang “mag-ingat,” habang pinanatili ang aspektong may patuloy na kabuluhan sa “sinabi ko na” at ang ideya ng paunang pagsasabi sa “nang patiuna.”
