  text: καὶ τότε ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐν νεφέλαις μετὰ δυνάμεως πολλῆς καὶ δόξης·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/026.yaml
  text: And then they will see the Son of Man coming in the clouds with great power and glory[a].
translation:
  language: tl
  text: At pagkatapos, makikita nila ang Anak ng Tao na dumarating sa mga ulap, kasama ang dakilang kapangyarihan at kaluwalhatian[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dumarating kasama ng mga ulap.” Literal na sinasabi ng Griyego na “sa mga ulap,” ngunit higit na itinatampok ng alternatibo ang malamang na alingawngaw ng Daniel 7:13.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄψονται
  choice: makikita nila
  rationale: Likas na salin ng panghinaharap na anyo ng ὁράω; pinananatili nitong hayag at nakikitang pangyayari ang inilalarawan nang walang dagdag na interpretasyon.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Kinikilalang pamagat sa Bibliyang Tagalog na nagpapanatili sa ugnay nito sa Daniel 7 at sa kristolohikal at apokaliptikong bigat ng parirala.
- source_word: ἐρχόμενον
  choice: na dumarating
  rationale: Pinananatili ang kilos ng kasalukuyang pandiwaring naglalarawan sa Anak ng Tao; mas angkop sa maringal na konteksto kaysa sa mas pangkaraniwang 'pumaparating' o 'sumasapit.'
- source_word: ἐν νεφέλαις
  choice: sa mga ulap
  rationale: Natural na katumbas sa modernong Tagalog ng Griyegong 'ἐν' at pangmaramihang 'νεφέλαις.' Hindi kailangang tumbasan sa Tagalog ang kawalan ng pantukoy sa Griyego; inilalagay sa talababa ang posibleng 'kasama ng mga ulap' upang maipakita ang alingawngaw ng Daniel 7:13.
- source_word: μετὰ δυνάμεως πολλῆς
  choice: taglay ang dakilang kapangyarihan
  rationale: Ipinahahayag ng 'taglay' ang pagsama o pag-iral ng kapangyarihan, at natural na itinutumbas ng 'dakilang kapangyarihan' ang δύναμις πολλή sa maringal na rehistro.
- source_word: καὶ δόξης
  choice: at kaluwalhatian
  rationale: Ang 'kaluwalhatian' ang matatag na katawagang biblikal para sa δόξα at nagpapanatili sa diwa ng nahahayag na kadakilaan.
theological_decisions:
- issue: Apokaliptikong pamagat at larawan ng mga ulap
  choice: Panatilihin ang 'Anak ng Tao' at ang pagdating sa mga ulap nang walang paliwanag sa pangunahing teksto.
  alternative: Isalin ang pamagat bilang 'Anak ng sangkatauhan' o tahasang ipaliwanag ang pagtukoy sa Daniel 7:13.
  rationale: Malakas ang alingawngaw ng Daniel 7:13, ngunit mas nararapat na panatilihin ng salin ang pahiwatig kaysa ipaliwanag ito sa mismong talata. Pinananatili rin nito ang tunay na kristolohikal at eskatolohikal na tensiyon ng Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit maringal. Ginamit ang kinagisnang biblikal na mga katawagang 'Anak ng Tao' at 'kaluwalhatian,' habang iniwasan ang lumang balarila at hindi kailangang paliwanag sa pangunahing teksto.
