  text: Ἀπὸ δὲ τῆς συκῆς μάθετε τὴν παραβολήν· ὅταν ⸂ἤδη ὁ κλάδος αὐτῆς⸃ ἁπαλὸς γένηται καὶ ἐκφύῃ τὰ φύλλα, γινώσκετε ὅτι ἐγγὺς τὸ θέρος ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/028.yaml
  text: 'Learn the parable from the fig tree: when its branch has already become tender and puts out leaves[a], you know that summer is near.'
translation:
  language: tl
  text: 'Matutuhan ninyo mula sa puno ng igos ang talinghaga[a]: kapag lumambot na ang sanga nito at naglalabas na ito ng mga dahon, alam ninyong malapit na ang tag-araw.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “aral” o “paglalarawan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς συκῆς
  choice: mula sa puno ng igos
  rationale: Ang ἀπό na may genitive ay nagsasaad ng pinagmumulan. Hindi ginawang tahasang hiwalay na salita ang mahinang pang-ugnay na δέ dahil likas na naihahatid ng daloy ng pangungusap sa Filipino ang paglipat ng paksa.
- source_word: μάθετε
  choice: Matutuhan ninyo
  rationale: Ang aorist imperative ng μανθάνω ay panawagang tanggapin o matutuhan ang itinuturo. Ang anyong ito ay malinaw, marangal, at likas sa makabagong Filipino.
- source_word: τὴν παραβολήν
  choice: ang talinghaga
  rationale: Pinananatili ng “talinghaga” ang karaniwang terminong ginagamit sa mga Ebanghelyo para sa παραβολή, habang nililinaw sa talababa na maaari rin itong mangahulugang aral o paglalarawan sa kontekstong ito.
- source_word: ὅταν
  choice: kapag
  rationale: Ang ὅταν na may subjunctive ay nagpapakilala ng pangkalahatang kondisyong temporal; likas na katumbas nito ang “kapag.”
- source_word: ἤδη ὁ κλάδος αὐτῆς ἁπαλὸς γένηται
  choice: kapag lumambot na ang sanga nito
  rationale: Ang “lumambot” ay naghahatid sa ἁπαλός na tumutukoy sa malambot o murang bagong usbong, at ang “na” ay natural na nagpapahayag ng aspektong ipinahihiwatig ng ἤδη.
- source_word: ἐκφύῃ τὰ φύλλα
  choice: nagsisibol ng mga dahon
  rationale: Ang ἐκφύω ay tumutukoy sa pagpapatubo o pagsisibol. Ang “nagsisibol ng mga dahon” ay malinaw at likas para sa paglago ng halaman.
- source_word: γινώσκετε
  choice: alam ninyo
  rationale: Sa kontekstong ito, ang anyo ay present indicative at nagsasaad ng pagkilalang karaniwang nangyayari mula sa palatandaan, hindi isang utos.
- source_word: ἐγγὺς τὸ θέρος ἐστίν
  choice: malapit na ang tag-araw
  rationale: Ang ἐγγύς ay temporal na “malapit,” at ang θέρος ay karaniwang “tag-araw.” Ang hulaping “na” ay likas na naghahatid ng nalalapit na panahon.
theological_decisions:
- issue: Kahulugan ng παραβολή sa kontekstong ito
  choice: talinghaga
  alternative: aral o paglalarawan
  rationale: Pinananatili ang karaniwang terminolohiya ng mga Ebanghelyo at ang ugnayan nito sa paraan ng pagtuturo ni Jesus, ngunit hindi ipinapalagay na kailangan dito ang isang detalyadong alegorikong pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pangmaramihang kausap sa “ninyo,” ang pangkalahatang obserbasyon tungkol sa puno ng igos, at ang literal na pana-panahong kahulugan ng “tag-araw.”
