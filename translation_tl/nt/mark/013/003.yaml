base_translation:
  language: en
  yaml_path: translation/nt/mark/013/003.yaml
  text: And as he was sitting on the Mount of Olives opposite the temple, Peter and James and John and Andrew were asking him privately,
translation:
  language: tl
  text: Habang nakaupo siya sa Bundok ng mga Olibo, sa tapat ng templo[a], nagtatanong sa kanya nang sarilinan sina Pedro, Santiago, Juan, at Andres,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego na ἱερόν ay tumutukoy sa kompleks o nasasakupan ng templo, hindi lamang sa panloob na santuwaryo (ναός).
    reason: lexical_alternative
lexical_decisions:
- source_word: καθημένου αὐτοῦ
  choice: Habang nakaupo siya
  rationale: Ang genitive absolute na may present participle ay naglalarawan ng kasabay at nagpapatuloy na kalagayan; natural itong ipinahahayag sa Tagalog sa pamamagitan ng “habang.”
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: sa Bundok ng mga Olibo
  rationale: Bagaman karaniwang may diwang patungo ang εἰς, ginagamit ito rito kasama ng pandiwa ng posisyon upang tukuyin ang kinaroroonan. Ang “Bundok ng mga Olibo” ay malinaw at nakaugaliang pangalang heograpiko.
- source_word: κατέναντι τοῦ ἱεροῦ
  choice: sa tapat ng templo[a]
  rationale: Ang κατέναντι ay tumutukoy sa lokasyong katapat o nakaharap sa isang bagay. Ang “templo” ang pinakanatural na salin, habang nililinaw sa talababa na ang ἱερόν ay ang buong nasasakupan ng templo.
- source_word: ἐπηρώτα
  choice: tinatanong
  rationale: Ang imperfect ay nagpapakita ng kilos na nagpapatuloy sa tagpong ito. Pinananatili ng aspektong imperpektibo ng “tinatanong” ang diwang iyon nang natural sa Tagalog.
- source_word: κατ’ ἰδίαν
  choice: palihim
  rationale: Ipinahihiwatig ng parirala na kinausap nila siya nang bukod sa iba o nang pribado; maikli at natural dito ang “palihim.”
- source_word: Πέτρος καὶ Ἰάκωβος καὶ Ἰωάννης καὶ Ἀνδρέας
  choice: nina Pedro, Santiago, Juan, at Andres
  rationale: Ginamit ang mga pangalang nakaugaliang anyo sa makabagong saling Filipino. Ang panandang “nina” ay malinaw na nagpapakilala sa maramihang gumagawa ng kilos sa pokus-na-layon na pangungusap.
