  source_fidelity: Ang pangunahing suliranin ay ang “na nagdudulot ng pagkawasak,” na ginagawang tuwirang causative ang genitive na τῆς ἐρημώσεως. Posible itong pagpapakahulugan ngunit hindi ito ang tahasang sinasabi ng Griyego at bahagyang nilulutas ang sinadyang masalimuot na parirala. Ang binagong “bagay ng pagkawasak” ay mas malapit sa anyo at pinananatili ang alusyon sa Daniel. Ang “hindi ito dapat naroroon” ay tapat sa ὅπου οὐ δεῖ nang hindi nagdaragdag ng “kalagyan.”
  naturalness: Ang “sa lugar na hindi ito dapat naroroon” ay mas likas na modernong Filipino kaysa “sa lugar na hindi nito dapat kalagyan.” Ang ayos na “tumakas ang mga nasa Judea patungo sa mga bundok” ay tuwiran at malinaw, samantalang ang mga gitling ay maayos na naghihiwalay sa parentetikong panawagan sa bumabasa.
  terminology: Pinananatili ang “kasuklam-suklam na bagay” para sa βδέλυγμα at ang “pagkawasak” para sa ἐρήμωσις, nang hindi ipinapataw ang isang tiyak na historikal o teolohikal na referent. Nanatiling “Judea” ang pangalang heograpikal. Iningatan ng talababa ang posibleng personal na pahiwatig ng panlalaking participle.
  issues:
