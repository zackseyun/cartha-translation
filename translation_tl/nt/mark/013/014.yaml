  text: Ὅταν δὲ ἴδητε τὸ βδέλυγμα τῆς ἐρημώσεως ⸀ἑστηκότα ὅπου οὐ δεῖ, ὁ ἀναγινώσκων νοείτω, τότε οἱ ἐν τῇ Ἰουδαίᾳ φευγέτωσαν εἰς τὰ ὄρη,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/014.yaml
  text: But when you see the abomination of desolation standing where it ought not to be (let the reader understand)[a], then let those in Judea flee to the mountains[b],
translation:
  language: tl
  text: Ngunit kapag nakita ninyo ang kasuklam-suklam na bagay ng pagkawasak na nakatayo sa lugar na hindi ito dapat naroroon[a]—unawain ito ng bumabasa—kung magkagayon, tumakas ang mga nasa Judea patungo sa mga bundok.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “nakatayo sa lugar na hindi siya dapat naroroon.” Panlalaki ang anyo ng participle sa Griego para sa “nakatayo,” kaya maaaring may ipinahihiwatig na taong nasa likod ng “kasuklam-suklam na bagay.”
    reason: alternative_reading
  - marker: b
    text: Umaalingawngaw ang “kasuklam-suklam na bagay ng pagkawasak” sa pananalita ng Daniel; tingnan ang Dan. 9:27; 11:31; 12:11.
    reason: cross_reference
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: Ngunit kapag
  rationale: Ipinahahayag ng ὅταν ang isang pangyayaring inaasahang magaganap, at ang δέ ay banayad na pang-ugnay. Likas sa Filipino ang “Ngunit kapag” sa pagpapatuloy ng naunang babala.
- source_word: ἴδητε
  choice: nakita ninyo
  rationale: 'Ang aorist subjunctive sa sugnay na may ὅταν ay natural na isinasalin sa Filipino bilang naganap na aspekto pagkatapos ng “kapag”: “kapag nakita ninyo.”'
- source_word: τὸ βδέλυγμα τῆς ἐρημώσεως
  choice: ang kasuklam-suklam na bagay na nagdudulot ng pagkawasak
  rationale: Pinananatili ng “kasuklam-suklam na bagay” ang di-tiyak na referent ng βδέλυγμα, samantalang malinaw at natural na ipinahahayag ng “na nagdudulot ng pagkawasak” ang ugnayan sa ἐρήμωσις. Hindi tinutukoy kung ito ay isang bagay, gawain, o taong kinakatawan ng parirala.
- source_word: ἑστηκότα
  choice: nakatayo
  rationale: Ipinahahayag ng perfect participle ng ἵστημι ang umiiral na kalagayang bunga ng naunang pagtayo o paglalagay. Ang “nakatayo” ay tuwiran at matingkad, nang hindi ipinapalagay na may ibang taong naglagay rito.
- source_word: ὅπου οὐ δεῖ
  choice: sa lugar na hindi nito dapat kalagyan
  rationale: Ipinahahayag ng δεῖ ang nararapat o kinakailangang kalagayan. Ang pangunahing teksto ay gumagamit ng “nito” ayon sa tahasang neuter na pangngalang βδέλυγμα; inilalahad sa talababa ang posibleng personal na pahiwatig ng panlalaking participle.
- source_word: ὁ ἀναγινώσκων νοείτω
  choice: unawain ito ng bumabasa
  rationale: Pinananatili nito ang parentetikong pag-uutos. Ang “bumabasa” ay likas na katumbas ng substantival participle, at ang “unawain” ay tapat sa νοείτω.
- source_word: τότε
  choice: kung magkagayon
  rationale: Malinaw nitong minamarkahan ang kasunod na pagkilos bilang tugon sa palatandaang nabanggit.
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: ang mga nasa Judea
  rationale: Maikli at natural itong salin ng pariralang substantival at pinananatili ang tiyak na lokasyon.
- source_word: φευγέτωσαν
  choice: tumakas
  rationale: Ang ikatlong panauhang pangmaramihang pautos ay naihahayag nang tuwiran sa Filipino sa anyong “tumakas,” na may apurahang lakas sa konteksto.
- source_word: εἰς τὰ ὄρη
  choice: patungo sa mga bundok
  rationale: Tuwirang ipinahahayag ng “mga bundok” ang ὄρη, at nililinaw ng “patungo sa” ang direksiyon ng pagtakas.
theological_decisions:
- issue: Kahulugan at referent ng τὸ βδέλυγμα τῆς ἐρημώσεως
  choice: Panatilihin ang di-tiyak na “kasuklam-suklam na bagay na nagdudulot ng pagkawasak,” nang hindi tinutukoy ang historikal na referent.
  alternative: “kasuklam-suklam na kalapastanganan” o “kasuklam-suklam na bagay ng pagkawasak”
  rationale: Umaalingawngaw ang parirala sa Daniel at maaaring tumukoy sa isang bagay, gawain, o tao. Hindi nilulutas ng salin ang pinagtatalunang referent, bagaman gumagamit ito ng natural na Filipino upang maipahayag ang ugnayan ng parirala.
- issue: Panlalaking ἑστηκότα kasunod ng neuter na βδέλυγμα
  choice: Gamitin sa pangunahing teksto ang “nito” ayon sa tahasang pangngalang “bagay,” at ilagay sa talababa ang pagbasa na may personal na referent.
  alternative: “nakatayo sa lugar na hindi niya dapat kalagyan”
  rationale: Maaaring magpahiwatig ng tao o personipikadong referent ang panlalaking participle, ngunit hindi tiyak ang sintaks. Pinananatili ng pangunahing teksto ang malinaw na ugnayan sa tahasang pangngalan, habang iniingatan ng talababa ang tunay na gramatikal at teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “kasuklam-suklam na bagay” upang mapanatili ang di-tiyak na referent, at ang mga pandiwang “nakatayo,” “unawain,” at “tumakas” upang mapanatili ang tuwiran at apurahang himig. Iniwasan ang labis na teknikal o denominasyonal na pananalita.
