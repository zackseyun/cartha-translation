  - severity: low
    issue: Hindi gaanong likas ang “hindi nito dapat kalagyan.”
    rationale: Mas natural sa modernong Filipino ang “hindi ito dapat naroroon,” at mas tuwirang tinutumbasan nito ang ὅπου οὐ δεῖ.
