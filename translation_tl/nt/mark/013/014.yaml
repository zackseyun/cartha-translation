revisions:
- from: Ngunit kapag nakita ninyo ang kasuklam-suklam na bagay na nagdudulot ng pagkawasak na nakatayo sa lugar na hindi nito dapat kalagyan[a]—unawain ito ng bumabasa—kung magkagayon, tumakas patungo sa mga bundok ang mga nasa Judea.[b]
  to: Ngunit kapag nakita ninyo ang kasuklam-suklam na bagay ng pagkawasak na nakatayo sa lugar na hindi ito dapat naroroon[a]—unawain ito ng bumabasa—kung magkagayon, tumakas ang mga nasa Judea patungo sa mga bundok.[b]
  rationale: Pinalitan ang causative na pagpapalawak ng isang source-nearer na salin ng pariralang Danielic upang mapanatili ang ambiguity nito. Pinakinis din ang pananalita tungkol sa di-angkop na lugar at isinabay ang mga talababa sa binagong pangunahing teksto.
