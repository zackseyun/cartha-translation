  yaml_path: translation/nt/mark/013/018.yaml
  text: But pray that it may not happen in winter[a].
translation:
  language: tl
  text: Pero ipanalangin ninyo na huwag mangyari ito sa taglamig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, kung gagawing mas tahas ayon sa konteksto, “na huwag mangyari sa taglamig ang pagtakas ninyo.” Mas di-tahas ang Griyego ni Marcos kaysa sa Mat. 24:20.
    reason: alternative_reading
lexical_decisions:
- source_word: προσεύχεσθε
  choice: ipanalangin ninyo
  rationale: Pautos na nasa ikalawang panauhang maramihan. Likas sa Filipino ang pandiwang may layon pagkatapos ng ἵνα-clause; hindi idinagdag ang di-tiyak na aspektong “patuloy.”
- source_word: δὲ
  choice: Pero
  rationale: Nagpapahiwatig ng banayad na pagsalungat o paglipat mula sa naunang babala; natural at kasalukuyang Filipino ang “Pero.”
- source_word: ἵνα μὴ
  choice: na huwag
  rationale: Likas na ipinapahayag sa Filipino ang negatibong nilalaman ng panalangin sa hulma na “ipanalangin ... na huwag.”
- source_word: γένηται
  choice: mangyari
  rationale: Ang aorist middle subjunctive ng γίνομαι ay tumutukoy nang patalinghaga sa inaasahang pangyayari o kalagayan. Pinananatili ng “mangyari” ang di-tiyak na tinutukoy ng Griyego.
- source_word: χειμῶνος
  choice: sa taglamig
  rationale: Genitibong nagsasaad ng panahon; ang karaniwang katumbas sa Filipino ay “sa taglamig.”
theological_decisions:
- issue: Di-tahasang paksa ng γένηται
  choice: Pinanatili ang elipsis sa “huwag itong mangyari,” na tumutukoy sa inaasahang pangyayari o kalagayan sa konteksto.
  alternative: “na huwag mangyari sa taglamig ang pagtakas ninyo”
  rationale: Hindi tahasang binabanggit sa Griyego ni Marcos ang “pagtakas ninyo,” di-gaya ng Mat. 24:20. Iniiwasang ipasok sa pangunahing teksto ang mas tahasang pananalita ng kaparehong salaysay.
translation_notes:
  register: Modernong Filipino na simple ngunit marangal. Ginamit ang “ninyo” upang malinaw ang maramihang kausap, at pinanatili ang maikling, patalinghagang anyo ng orihinal.
