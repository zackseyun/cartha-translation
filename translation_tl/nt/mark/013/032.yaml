id: MRK.13.32
reference: Mark 13:32
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Περὶ δὲ τῆς ἡμέρας ἐκείνης ἢ ⸀τῆς ὥρας οὐδεὶς οἶδεν, οὐδὲ οἱ ἄγγελοι ⸀ἐν οὐρανῷ οὐδὲ ὁ υἱός, εἰ μὴ ὁ πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/032.yaml
  text: But concerning that day or hour[a], no one knows—not even the angels in heaven, nor the Son, but only the Father.
translation:
  language: tl
  text: Ngunit tungkol sa araw o oras na iyon, walang nakaaalam—kahit ang mga anghel sa langit, ni ang Anak[a]—kundi ang Ama lamang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Iniuugnay ng ilang tagapagpaliwanag ang “ni ang Anak” sa pagkakatawang-tao ng Anak—sa kanyang misyon o kalikasang pantao. Pinananatili ng salin ang mismong pananalita ng tekstong Griyego nang hindi idinaragdag ang paliwanag na iyon sa pangunahing teksto.
    reason: Pagpapanatili sa teolohikal na tensiyon at paglalahad ng isang interpretatibong alternatibo nang hindi ito ipinapasok sa salin.
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Ngunit tungkol sa
  rationale: Ipinakikilala ng περί na may genitive ang paksang tinutukoy, at ipinahihiwatig ng δέ ang banayad na paglipat o pagsalungat sa naunang sinabi. Likas na naipahahayag ng “Ngunit tungkol sa” ang dalawang tungkuling ito.
- source_word: τῆς ἡμέρας ἐκείνης ἢ τῆς ὥρας
  choice: sa araw o oras na iyon
  rationale: Pinananatili nito ang pagkakaiba ng mas malawak na “araw” at mas tiyak na “oras.” Sa natural na Filipino, sapat nang minsang ilagay ang “na iyon” upang tumukoy sa dalawang pangngalan.
- source_word: οὐδεὶς οἶδεν
  choice: walang nakaaalam
  rationale: Bagaman anyong perfect ang οἶδα, karaniwan itong may pangkasalukuyang kahulugang “alam.” Ang “walang nakaaalam” ay malinaw, marangal, at likas sa salin-Bibliyang Filipino.
- source_word: οὐδὲ οἱ ἄγγελοι ἐν οὐρανῷ
  choice: kahit ang mga anghel sa langit
  rationale: Ipinagpapatuloy at idinidiin ng οὐδέ ang pagtanggi; ipinahahayag ng “kahit” ang diwang “not even.” Ang ἐν οὐρανῷ ay inuunawang lokatibo at inilalarawan kung nasaan ang mga anghel.
- source_word: οὐδὲ ὁ υἱός
  choice: ni ang Anak
  rationale: Ipinagpapatuloy ng ikalawang οὐδέ ang negatibong serye. Pinananatili ang “Anak” bilang titulong kristolohikal at hindi ito nilalambutan o dinaragdagan ng paliwanag sa pangunahing teksto.
- source_word: εἰ μὴ ὁ πατήρ
  choice: kundi ang Ama lamang
  rationale: Pagkatapos ng pagtanggi, ipinakikilala ng εἰ μή ang tanging eksepsiyon. Malinaw at natural sa Filipino ang “kundi ang Ama lamang” sa pagpapahayag ng pagiging bukod-tangi.
theological_decisions:
- issue: Ang pahayag na hindi alam ng Anak ang araw o oras
  choice: Panatilihin ang tuwirang pananalitang “ni ang Anak” nang walang pampalambot o dagdag na paliwanag sa pangunahing teksto.
  alternative: Dagdagan ang pangunahing teksto ng interpretatibong panuring gaya ng “ayon sa kanyang pagkatao” o “sa kanyang misyong pagkakatawang-tao.”
  rationale: Malinaw na kasama sa tekstong Griyego ang οὐδὲ ὁ υἱός. Pinananatili ng salin ang tunay na teolohikal na tensiyon at hindi ipinapasok sa mismong talata ang isang paliwanag na wala sa pinagmulan.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Ang “nakaaalam” ay pormal ngunit madaling maunawaan; ang mga gitling na em ay tumutulong upang malinaw na maipakita ang idinidiing serye nang hindi binabago ang kahulugan ng Griyego.
