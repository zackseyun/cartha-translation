  text: Εἰπὸν ἡμῖν πότε ταῦτα ἔσται, καὶ τί τὸ σημεῖον ὅταν μέλλῃ ⸂ταῦτα συντελεῖσθαι πάντα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/004.yaml
  text: Tell us[a], when will these things be, and what will be the sign when all these things are about to be accomplished?
translation:
  language: tl
  text: “Sabihin mo sa amin, kailan mangyayari ang mga bagay na ito, at ano ang magiging tanda kapag malapit nang maganap[a] ang lahat ng ito?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “kapag magaganap ang lahat ng ito.” Ang salitang Griyego na μέλλῃ na may infinitive ay maaaring mas tiyak na mangahulugang “malapit nang.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰπὸν ἡμῖν
  choice: Sabihin mo sa amin
  rationale: Likas na pakiusap sa Filipino na nagpapanatili sa pautos na anyo ng pandiwa at sa di-tuwirang layon na ‘sa amin.’
- source_word: πότε ταῦτα ἔσται
  choice: kailan mangyayari ang mga bagay na ito
  rationale: Sa kontekstong tumutukoy sa mga pangyayari, mas natural ang ‘mangyayari’ kaysa sa literal na ‘magiging,’ habang pinananatili ang maramihang ταῦτα.
- source_word: τί τὸ σημεῖον
  choice: ano ang magiging tanda
  rationale: Ang ‘tanda’ ang karaniwan at angkop na katumbas ng σημεῖον; idinagdag ang ‘magiging’ ayon sa ipinahihiwatig na hinaharap ng tanong.
- source_word: ὅταν μέλλῃ
  choice: kapag malapit nang
  rationale: Pinananatili ng ‘malapit nang’ ang prospective o nalalapit na diwa ng μέλλω na may infinitive, samantalang natural na isinasalin ng ‘kapag’ ang temporal na ὅταν.
- source_word: ταῦτα συντελεῖσθαι πάντα
  choice: maganap ang lahat ng ito
  rationale: Ipinahahayag ng ‘maganap’ ang pagsasakatuparan o pagdating sa kaganapan ng mga pangyayari nang hindi tahasang ipinapasok ang ideya ng katuparan ng hula na maaaring ipahiwatig ng ‘matupad.’
theological_decisions:
- issue: Eskatolohikal na diwa ng μέλλῃ kasama ang infinitive
  choice: kapag malapit nang maganap ang lahat ng ito
  alternative: kapag magaganap ang lahat ng ito
  rationale: Pinananatili ng salin ang diwa ng nalalapit na pagkaganap na nasa μέλλω, ngunit hindi nito ipinipilit ang isang partikular na doktrina o takdang kronolohiya tungkol sa mga huling bagay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘mga bagay na ito’ upang mapanatili ang maramihang demonstrative at ang ugnay nito sa naunang sinabi ni Jesus.
