revisions:
- from: Sapagkat lilitaw ang mga huwad na Mesiyas[a] at mga huwad na propeta, at magpapakita sila ng mga tanda at kababalaghan upang iligaw, kung posible,[b] ang mga hinirang.
  to: Sapagkat lilitaw ang mga huwad na Mesiyas[a] at mga huwad na propeta, at magpapakita sila ng mga tanda at kababalaghan upang iligaw ang mga hinirang, kung posible.[b]
