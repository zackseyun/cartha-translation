base_translation:
  language: en
  yaml_path: translation/nt/mark/013/022.yaml
  text: For false messiahs and false prophets will arise and will give signs and wonders in order to lead astray[a], if possible[c][b], the elect.
translation:
  language: tl
  text: Sapagkat lilitaw ang mga huwad na Mesiyas[a] at mga huwad na propeta, at magpapakita sila ng mga tanda at kababalaghan upang iligaw ang mga hinirang, kung posible.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga huwad na Cristo.” Ang salitang Griyego ay binuo mula sa Christos, na ginagamit dito bilang titulong nangangahulugang “Mesiyas.”
    reason: alternative_reading
  - marker: b
    text: 'Maaari ring ayusin: “upang, kung posible, iligaw ang mga hinirang.” O, “kung posible sana.” Hindi tahasang nililinaw ng Griyego kung maaari nga bang mailigaw ang mga hinirang; inilalahad nito ang layunin ng mga manlilinlang.'
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: ἐγερθήσονται
  choice: lilitaw
  rationale: Sa kontekstong ito, tumutukoy ang pandiwa sa paglitaw o pagbangon sa eksena ng mga tao. Likas sa modernong Tagalog ang “lilitaw” at hindi nito ipinahihiwatig na Diyos ang nagbangon sa kanila.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikita ng γάρ na ang pangungusap ay nagbibigay ng dahilan o paliwanag sa naunang babala.
- source_word: ψευδόχριστοι
  choice: mga huwad na Mesiyas
  rationale: Ginagamit dito ang Χριστός bilang titulong katumbas ng “Mesiyas.” Malinaw at likas sa Tagalog ang “mga huwad na Mesiyas,” habang pinananatili ang kontekstong mesiyaniko.
- source_word: ψευδοπροφῆται
  choice: mga huwad na propeta
  rationale: Tuwiran, karaniwan, at malinaw na salin ng tambalang pangngalan.
- source_word: δώσουσιν σημεῖα καὶ τέρατα
  choice: magpapakita sila ng mga tanda at kababalaghan
  rationale: Bagaman literal na “magbibigay,” mas likas sa Tagalog ang “magpapakita” para sa pagsasagawa o pagpapamalas ng mga tanda at kababalaghan. Hindi idinagdag ang “mahimalang” sapagkat sapat nang ipinahihiwatig ng pares na salita ang pambihirang katangian ng mga ito.
- source_word: πρὸς τὸ ἀποπλανᾶν
  choice: upang iligaw
  rationale: Malinaw na ipinahahayag ng konstruksiyon ang layunin. Pinananatili ng “iligaw” ang larawan ng paglalayo sa katotohanan, sa halip na paliitin ito sa simpleng panlilinlang.
- source_word: εἰ δυνατόν
  choice: kung posible
  rationale: Tuwirang inililipat nito ang maikli at kondisyonal na pahayag ng Griyego. Mas iwas ito sa kahulugang paghingi ng pahintulot na maaaring taglayin ng “kung maaari.”
- source_word: τοὺς ἐκλεκτούς
  choice: ang mga hinirang
  rationale: Karaniwan at dignified na salin ito na pinananatili ang teolohikal na bigat ng termino nang hindi nagtatakda ng isang denominasyonal na paliwanag.
theological_decisions:
- issue: Kahulugan ng ψευδόχριστοι bilang tambalang salitang may Χριστός
  choice: mga huwad na Mesiyas
  alternative: mga huwad na Cristo
  rationale: Malinaw na titulo ang Χριστός sa tambalang ito. Ipinahahayag ng “Mesiyas” ang kahulugan ng titulo at ang kontekstong Judio, samantalang inilalagay sa talababa ang tradisyonal na alternatibo.
- issue: Kung ipinahihiwatig ba ng εἰ δυνατόν na imposibleng mailigaw ang mga hinirang
  choice: kung posible
  alternative: kung posible sana
  rationale: Hindi tahasang nilulutas ng Griyego kung maaari nga bang mailigaw ang mga hinirang. Kaya pinananatili ng salin ang kondisyong bukas at iniiwasang gawing tiyak ang posibilidad o imposibilidad.
- issue: Pagkakaugnay ng εἰ δυνατόν sa layuning iligaw at sa mga hinirang
  choice: upang iligaw, kung posible, ang mga hinirang
  alternative: upang iligaw ang mga hinirang, kung posible
  rationale: Ang pagkakalagay ng parirala sa pangunahing teksto ay mas malapit sa ayos ng Griyego at pinananatili ang posibilidad na marinig itong naglilimita sa pagtatangkang iligaw. Ang mas likas na alternatibong ayos sa Tagalog ay itinatala sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignified, at angkop sa pampublikong pagbasa. Ginamit ang “lilitaw” at “magpapakita” para sa likas na daloy, habang pinanatili ang mga terminong biblikal na “Mesiyas,” “propeta,” “mga tanda at kababalaghan,” at “mga hinirang.”
