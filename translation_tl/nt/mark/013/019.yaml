source:
  edition: SBLGNT
  text: ἔσονται γὰρ αἱ ἡμέραι ἐκεῖναι θλῖψις οἵα οὐ γέγονεν τοιαύτη ἀπ’ ἀρχῆς κτίσεως ⸀ἣν ἔκτισεν ὁ θεὸς ἕως τοῦ νῦν καὶ οὐ μὴ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/019.yaml
  text: For those days will be a tribulation such as has not been from the beginning of the creation that God created until now[a], and never will be.
translation:
  language: tl
  text: Sapagkat ang mga araw na iyon ay magiging panahon ng matinding paghihirap na ang katulad nito ay hindi pa nangyari mula sa pasimula ng sangnilikha na nilikha ng Diyos hanggang ngayon, at hindi na mangyayari kailanman.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θλῖψις
  choice: matinding paghihirap
  rationale: Likas at malinaw ito sa makabagong Tagalog at ipinahahayag ang napakabigat na pagdurusa o kagipitan sa kontekstong ito, nang hindi umaasa sa teknikal na terminong panrelihiyon.
- source_word: οἵα οὐ γέγονεν τοιαύτη
  choice: na ang katulad nito ay hindi pa nangyari
  rationale: Pinananatili nito ang paghahambing at ang di-pangkaraniwang tindi ng paghihirap, habang iniiwasan ang pilit na pag-uulit ng anyong Griyego.
- source_word: ἀπ’ ἀρχῆς κτίσεως
  choice: mula sa pasimula ng sangnilikha
  rationale: Ang “sangnilikha” ay tumutukoy sa kabuuang nilikhang kaayusan at nagpapanatili sa saklaw ng κτίσις; ang “mula sa pasimula” ay malapit sa anyong Griyego at marangal sa himig.
- source_word: ἣν ἔκτισεν ὁ θεὸς
  choice: na nilikha ng Diyos
  rationale: Tuwirang pinananatili ang tahasang pagbanggit sa Diyos bilang lumikha, kahit may sinasadyang pag-uulit sa diwa ng “sangnilikha.”
- source_word: ἕως τοῦ νῦν
  choice: hanggang ngayon
  rationale: Karaniwan, malinaw, at eksaktong katumbas ng temporal na parirala.
- source_word: οὐ μὴ γένηται
  choice: at hindi na mangyayari kailanman
  rationale: Ipinahahayag ng “hindi na … kailanman” ang mariing pagtanggi ng οὐ μή at ang hinaharap na di-pag-uulit, nang hindi ginagawang teknikal ang pananalita.
- source_word: ἔσονται ... αἱ ἡμέραι ἐκεῖναι θλῖψις
  choice: ang mga araw na iyon ay magiging panahon ng matinding paghihirap
  rationale: 'Nililinaw ng “panahon” ang siksik na predikatibong anyo ng Griyego: ang mga araw na iyon mismo ang bubuo sa panahong inilalarawan, hindi lamang basta magdadala ng paghihirap.'
theological_decisions:
- issue: Saklaw ng wikang tumutukoy sa paglikha
  choice: Pinanatili ang “sangnilikha na nilikha ng Diyos,” na tumutukoy sa nilikhang kaayusan at tahasang kumikilala sa Diyos bilang lumikha.
  alternative: “mula nang likhain ng Diyos ang mundo”
  rationale: Ang alternatibo ay mas idyomatiko ngunit pinagsasama ang κτίσις at κτίζω at maaaring paliitin ang “sangnilikha” tungo lamang sa “mundo.” Pinananatili ng napiling salin ang pag-uulit at lawak ng orihinal nang hindi nagtatakda ng isang partikular na sistemang eskatolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sangnilikha” bilang isang pormal ngunit madaling maunawaang salita; pinagaan naman ng “panahon ng matinding paghihirap” ang siksik na sintaks ng Griyego. Walang talababa sapagkat naipapahayag sa pangunahing teksto ang paghahambing at mariing pangwakas na pagtanggi nang hindi binubura ang teolohikal na tensiyon.
