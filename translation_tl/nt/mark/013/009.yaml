source:
  edition: SBLGNT
  text: βλέπετε δὲ ὑμεῖς ἑαυτούς· ⸀παραδώσουσιν ὑμᾶς εἰς συνέδρια καὶ εἰς συναγωγὰς δαρήσεσθε καὶ ἐπὶ ἡγεμόνων καὶ βασιλέων σταθήσεσθε ἕνεκεν ἐμοῦ εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/009.yaml
  text: But watch yourselves. They will hand you over to councils[a], and you will be beaten in synagogues, and you will stand before governors and kings because of me, as a testimony to them.
translation:
  language: tl
  text: Ngunit kayo mismo, mag-ingat kayo. Isusuko nila kayo sa mga konseho, at bubugbugin kayo sa mga sinagoga. Patatayuin kayo sa harap ng mga gobernador at mga hari dahil sa akin, bilang patotoo sa kanila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “para maging patotoo sa kanila”; posible ring ang diwa ay “bilang patotoo laban sa kanila.”
    reason: alternative_reading
lexical_decisions:
- source_word: βλέπετε δὲ ὑμεῖς ἑαυτούς
  choice: Ngunit kayo, mag-ingat kayo
  rationale: Ang kasalukuyang pautos ay nananawagan ng patuloy na pag-iingat. Pinananatili ng tahasang “kayo” ang diin ng ὑμεῖς, habang likas sa modernong Tagalog ang “mag-ingat kayo.”
- source_word: παραδώσουσιν ὑμᾶς
  choice: Isusuko nila kayo
  rationale: Sa konteksto ng pag-uusig, tumutukoy ito sa pagsasailalim sa kapangyarihan ng mga awtoridad, hindi kinakailangang sa personal na pagtataksil.
- source_word: συνέδρια
  choice: mga konseho
  rationale: Ang maramihan ay tumutukoy sa mga lokal na konsehong namamahala o humahatol, hindi lamang sa Sanedrin sa Jerusalem.
- source_word: συναγωγάς
  choice: mga sinagoga
  rationale: Karaniwang katawagan sa institusyon at lugar na Judio kung saan maaaring isagawa ang pagdidisiplina.
- source_word: δαρήσεσθε
  choice: hahagupitin kayo
  rationale: Malinaw nitong ipinahahayag ang pisikal na pananakit na nasa pasibong anyo ng pandiwa at ang posibilidad ng disiplinaryong paghagupit sa kontekstong ito.
- source_word: ἐπὶ ἡγεμόνων καὶ βασιλέων σταθήσεσθε
  choice: Patatayuin kayo sa harap ng mga gobernador at mga hari
  rationale: Ang “patatayuin” ay nagpapanatili sa pasibo at sapilitang diwa ng pagharap sa mga awtoridad; magkahiwalay ding pinananatili ang dalawang uri ng pinuno.
- source_word: ἕνεκεν ἐμοῦ
  choice: dahil sa akin
  rationale: 'Likas at malinaw na pahayag ng sanhi: ang kaugnayan nila kay Jesus ang dahilan ng pag-uusig.'
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: bilang patotoo sa kanila
  rationale: Pinananatili nito ang malawak na diwa ng patotoong nakatuon sa mga pinuno nang hindi ipinapasok sa pangunahing teksto ang posibleng mapanghatol na kahulugang “laban sa kanila.”
theological_decisions:
- issue: Diwa ng εἰς μαρτύριον αὐτοῖς
  choice: Ang sapilitang pagharap ng mga alagad ay magsisilbing patotoo sa mga pinuno.
  alternative: Ang kanilang pagharap ay magsisilbing patotoo laban sa mga pinuno at may mapanghatol na bisa.
  rationale: Maaaring taglayin ng parirala ang alinmang himig depende sa konteksto. Hindi tahasang hinihingi rito ng datibong αὐτοῖς ang saling “laban sa kanila,” kaya ginamit sa teksto ang hindi gaanong mapagpasiyang “sa kanila” at iniingatan sa talababa ang alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “konseho,” “sinagoga,” at “gobernador” bilang pamilyar na katawagang institusyonal. Ang pag-uulit na “kayo” sa simula ay sinadya upang mapanatili ang diin ng Griyego.
