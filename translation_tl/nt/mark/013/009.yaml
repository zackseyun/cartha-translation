revisions:
- from: Ngunit kayo, mag-ingat kayo. Isusuko nila kayo sa mga konseho, at hahagupitin kayo sa mga sinagoga. Patatayuin kayo sa harap ng mga gobernador at mga hari dahil sa akin, bilang patotoo sa kanila.[a]
  to: Ngunit kayo mismo, mag-ingat kayo. Isusuko nila kayo sa mga konseho, at bubugbugin kayo sa mga sinagoga. Patatayuin kayo sa harap ng mga gobernador at mga hari dahil sa akin, bilang patotoo sa kanila.[a]
  rationale: Pinalitan ang terminong tumutukoy nang partikular sa paghagupit ng mas malawak na «bubugbugin,» alinsunod sa δαρήσεσθε. Pinakinis din ang unang sugnay upang mapanatili ang diin sa mga alagad mismo. Nananatiling hindi mapagpasya ang pangunahing teksto hinggil sa posibleng mapanghatol na bisa ng μαρτύριον αὐτοῖς, at iniingatan ito sa talababa.
