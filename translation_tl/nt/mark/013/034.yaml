  text: ὡς ἄνθρωπος ἀπόδημος ἀφεὶς τὴν οἰκίαν αὐτοῦ καὶ δοὺς τοῖς δούλοις αὐτοῦ τὴν ἐξουσίαν, ⸀ἑκάστῳ τὸ ἔργον αὐτοῦ, καὶ τῷ θυρωρῷ ἐνετείλατο ἵνα γρηγορῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/034.yaml
  text: It is like a man away on a journey[a], who left his house and gave authority to his servants, to each one his work, and commanded the doorkeeper to stay awake.
translation:
  language: tl
  text: 'Tulad ito ng isang lalaking nasa paglalakbay: iniwan niya ang kanyang bahay at ipinagkatiwala niya sa kanyang mga alipin[a] ang kapangyarihan; ibinigay niya sa bawat isa ang kanyang gawain. Inutusan din niya ang bantay-pinto na manatiling gising.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga lingkod.” Ang Griyegong douloi ay tumutukoy rito sa mga taong nakatali sa paglilingkod sa isang sambahayan at nasa ilalim ng kapangyarihan ng panginoon nito.
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς
  choice: Tulad ito ng
  rationale: Ginagawang malinaw sa likas na Tagalog ang ipinahihiwatig na paghahambing, nang walang idinaragdag sa diwa ng Griyego.
- source_word: ἄνθρωπος ἀπόδημος
  choice: isang taong naglakbay sa malayo
  rationale: Ipinapahayag ang isang lalaking wala sa sariling lugar dahil sa paglalakbay; sa Tagalog, sapat ang “tao” dahil malinaw sa mga panghalip at sa larawan ang tinutukoy.
- source_word: ἀφεὶς τὴν οἰκίαν αὐτοῦ
  choice: iniwan niya ang kanyang bahay
  rationale: Tuwirang inililipat ang aorist participle sa isang likas na sugnay sa Tagalog.
- source_word: δοὺς τοῖς δούλοις αὐτοῦ τὴν ἐξουσίαν
  choice: binigyan ng kapangyarihan ang kanyang mga alipin
  rationale: Pinananatili ng “binigyan” at “kapangyarihan” ang karaniwang leksikal na diwa ng δίδωμι at ἐξουσία, samantalang ipinakikita ng “alipin” ang nakataling kalagayan sa sambahayan na ipinahihiwatig ng δοῦλος.
- source_word: ἑκάστῳ τὸ ἔργον αὐτοῦ
  choice: ang bawat isa ng sariling gawain
  rationale: Pinananatili ang distributibong diwa at ang payak na kahulugan ng ἔργον, nang hindi labis na ipinapakahulugang pormal na atas.
- source_word: τῷ θυρωρῷ
  choice: ang bantay-pinto
  rationale: Karaniwan at malinaw na katawagan sa taong nagbabantay sa pintuan ng bahay.
- source_word: ἐνετείλατο ἵνα γρηγορῇ
  choice: inutusan ... na manatiling gising
  rationale: Pinananatili ang awtoritatibong lakas ng utos at ang literal na larawan ng γρηγορέω, na sa konteksto ay may diwa rin ng patuloy na pagbabantay.
theological_decisions:
- issue: Paglilipat ng δοῦλος sa larawang sambahayan
  choice: mga alipin
  alternative: mga lingkod
  rationale: Ang tagpo ay tungkol sa isang panginoong nagkakaloob ng kapangyarihan sa mga taong nakatali sa kanyang sambahayan. Mas malinaw na ipinakikita ng “mga alipin” ang katayuang panlipunan at ugnayan ng kapangyarihan sa Griyego; inilalagay sa talababa ang “mga lingkod” bilang posibleng mas malawak na salin.
- issue: Diwa ng γρηγορῇ
  choice: manatiling gising
  alternative: patuloy na magbantay
  rationale: Pinananatili ang konkretong larawan ng pagiging gising, habang hindi inaalis ang kontekstuwal na diwa ng pagiging mapagbantay.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang maiikling sugnay upang maging natural ang mahabang konstruksiyong Griyego, habang pinananatili ang pagkakasunod ng mga kilos at ang diin sa ipinamahaging kapangyarihan, gawain, at utos na manatiling gising.
