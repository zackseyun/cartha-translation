  text: οἱ δὲ μαθηταὶ ἐθαμβοῦντο ἐπὶ τοῖς λόγοις αὐτοῦ. ὁ δὲ Ἰησοῦς πάλιν ἀποκριθεὶς λέγει αὐτοῖς· Τέκνα, πῶς δύσκολόν ⸀ἐστιν εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/024.yaml
  text: But the disciples were astonished at his words. Jesus answered again and said to them[a], “Children, how difficult it is to enter the kingdom of God!”
translation:
  language: tl
  text: Ngunit namangha ang mga alagad sa kanyang mga sinabi. Muling sumagot si Jesus at sinabi sa kanila[a], “Mga anak, napakahirap pumasok sa kaharian ng Diyos!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa ilang manuskrito: “Mga anak, napakahirap para sa mga nagtitiwala sa kayamanan na pumasok sa kaharian ng Diyos.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἐθαμβοῦντο
  choice: namangha
  rationale: Ipinahihiwatig ng imperpektong anyo ang nagpapatuloy nilang matinding pagkamangha. Likas sa modernong Tagalog ang “namangha” at hindi nito pinalalabis ang lakas ng pandiwa.
- source_word: ἐπὶ τοῖς λόγοις αὐτοῦ
  choice: sa kanyang mga sinabi
  rationale: Tinutukoy ng ἐπί na may datibo ang batayan o paksa ng kanilang pagkamangha. Mas natural sa Tagalog ang “sa kanyang mga sinabi” kaysa sa literal na “sa kanyang mga salita.”
- source_word: πάλιν
  choice: muling
  rationale: Malinaw na ipinakikita ang pagpapatuloy o pag-ulit ng pagsasalita ni Jesus.
- source_word: ἀποκριθεὶς λέγει
  choice: nagsalita ... at sinabi
  rationale: Ang parirala ay karaniwang pormulang pasalaysay na maaaring mangahulugang tumugon o muling nagsalita ayon sa konteksto. Iniiwasan ng “muling nagsalita” ang di-likas na “sumagot at sinabi,” habang pinananatili ng “at sinabi” ang anyo ng salaysay.
- source_word: Τέκνα
  choice: Mga anak
  rationale: Pinananatili nito ang magiliw at pampamilyang pagtawag nang hindi idinaragdag ang panghalip na “ko,” na wala sa Griyego.
- source_word: πῶς δύσκολόν ἐστιν
  choice: napakahirap
  rationale: Ang padamdam na πῶς ay nagpapatingkad sa δύσκολον. Likas at mariin sa Tagalog ang “napakahirap,” at pinananatili nito ang lakas ng pahayag.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν
  choice: pumasok sa kaharian ng Diyos
  rationale: Ito ang malinaw, karaniwan, at tuwirang katumbas sa modernong Tagalog.
theological_decisions:
- issue: Kung isasama sa pangunahing teksto ang mas mahabang pagbasa na “para sa mga nagtitiwala sa kayamanan”
  choice: 'Sinunod ang mas maikling pagbasa ng SBLGNT: “napakahirap pumasok sa kaharian ng Diyos.”'
  alternative: “Mga anak, napakahirap para sa mga nagtitiwala sa kayamanan na pumasok sa kaharian ng Diyos.”
  rationale: Ang ibinigay na tekstong Griyego ay may mas maikling pagbasa. Hindi dapat ipasok sa pangunahing teksto ang paliwanag na nagpapakitid sa saklaw ng pahayag; gayunman, mahalagang itala sa talababa ang kilalang tekstuwal na variant.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “mga alagad” at “kaharian ng Diyos” bilang pamilyar na bokabularyong biblikal. Ang “Mga anak” ay nagpapanatili sa magiliw na himig ng pagtawag ni Jesus.
