  rationale: Pinalitan ang “Muling nagsalita” ng “Muling sumagot” upang maipakita ang ἀποκριθείς at ang ugnayan ng tugon ni Jesus sa naunang pagkamangha ng mga alagad. Pinanatili ang “at sinabi sa kanila” upang masalamin ang λέγει sa likas na modernong Tagalog. Walang binago sa pangunahing tekstuwal na pagbasa o sa talababa ng variant.
