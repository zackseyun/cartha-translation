  yaml_path: translation/nt/mark/010/011.yaml
  text: And he says to them[a], “Whoever divorces his wife and marries another commits adultery against her.”
translation:
  language: tl
  text: At sinabi niya sa kanila, “Ang sinumang dumiborsiyo sa kanyang asawa at magpakasal sa ibang babae ay nangangalunya laban sa kanya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: sinabi
  rationale: Ginamit ang karaniwang nakaraang panahunan sa salaysay upang maging natural sa modernong Filipino; ang Griyegong pangkasalukuyang panahunan ay isang historical present na madalas gamitin ni Marcos.
- source_word: αὐτοῖς
  choice: sa kanila
  rationale: Likas na salin ng panghalip na datibo bilang di-tuwirang layon.
- source_word: Ὃς ἂν
  choice: Ang sinumang
  rationale: Ipinapahayag nito ang di-tiyak at pangkalahatang kondisyon ng pariralang Griyego.
- source_word: ἀπολύσῃ
  choice: makipagdiborsiyo
  rationale: Sa konteksto ng pag-aasawa, tumutukoy ang pandiwa sa diborsiyo, hindi lamang sa pagpapaalis.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: sa kanyang asawa
  rationale: Bagaman maaaring mangahulugang babae o asawa ang γυνή, malinaw na 'asawa' ang kahulugan sa konteksto ng diborsiyo.
- source_word: γαμήσῃ ἄλλην
  choice: mag-asawa ng iba
  rationale: Ang ἄλλην ay pambabae at tumutukoy sa ibang babae; likas at malinaw sa Filipino ang pinaikling 'iba' sa kontekstong ito.
- source_word: μοιχᾶται
  choice: nangangalunya
  rationale: Karaniwan at tuwirang katumbas ng pandiwa sa kontekstong pangmag-asawa.
- source_word: ἐπ’ αὐτήν
  choice: laban sa kanyang asawa
  rationale: Pinananatili ang diwa na ang pangangalunya ay pagkakasalang ginawa laban sa unang asawa; inulit ang 'kanyang asawa' upang maiwasan ang malabong panghalip sa Filipino.
theological_decisions:
- issue: Kung pananatilihin ang diin ng ἐπ’ αὐτήν bilang pagkakasalang ginawa laban sa asawa
  choice: “nangangalunya laban sa kanyang asawa”
  alternative: “nangangalunya” o “nangangalunya sa iba”
  rationale: Hayagang nasa Griyego ang ἐπ’ αὐτήν. Pinananatili ng salin ang diin na ang ginawa ng lalaki ay paglabag laban sa kanyang asawa, sa halip na gawing pangkalahatang pahayag lamang tungkol sa pangangalunya.
- issue: Pangkalahatang pormulang panlalaki
  choice: “Ang sinumang”
  alternative: “Ang sinumang lalaki”
  rationale: Tumpak na naipapahayag ng 'ang sinumang' ang di-tiyak na kondisyong Griyego nang hindi nagdaragdag ng salitang wala roon; nililinaw naman ng 'kanyang asawa' at ng konteksto ang agarang tinutukoy.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang pamilyar na terminong “diborsiyo” para sa legal at relasyonal na kahulugan ng ἀπολύω. Walang talababa sapagkat sapat na malinaw sa Filipino ang “mag-asawa ng iba”; ang pambabaeng tinutukoy ay nahihinuha sa konteksto.
