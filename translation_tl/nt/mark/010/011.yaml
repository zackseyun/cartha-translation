  - severity: medium
    issue: Malabo ang ‘mag-asawa ng iba.’
    rationale: Hindi nito laging malinaw na ang tinutukoy ay pag-aasawa sa ibang babae; maaari rin itong mabasa bilang pagbuo ng ibang sambahayan. Ang ἄλλην ay pambabae.
