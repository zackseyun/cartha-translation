review_pass:
  verdict: revise
  source_fidelity: Tumpak ang pangunahing diwa, kabilang ang diborsiyo, muling pag-aasawa, at ang ‘laban sa kanya’ para sa ἐπ’ αὐτήν. Gayunman, ang ‘makipagdiborsiyo’ ay maaaring magpahiwatig ng kapuwa o magkasanib na pagkilos, samantalang ang Griyego ay tuwirang nagsasaad ng lalaking dumidiborsiyo sa kanyang asawa. Ang ‘mag-asawa ng iba’ ay maaari ring maging malabo sa modernong Filipino at hindi malinaw na nailalabas ang pambabaeng ἄλλην.
  naturalness: Natural ang kabuuang rehistro, ngunit mas malinaw at mas idiomatiko sa modernong Filipino ang ‘dumiborsiyo sa kanyang asawa’ at ‘magpakasal sa ibang babae.’ Ang panghalip na ‘kanya’ sa hulihan ay malinaw na tumutukoy sa asawang hiniwalayan dahil sa kalapit na parirala.
  terminology: Ang ‘diborsiyo’ at ‘nangangalunya’ ay angkop at malinaw. Ang ‘ibang babae’ ay ligtas na inilalabas ang pambabaeng kasarian ng ἄλλην nang hindi nagdaragdag ng kahulugang wala sa teksto.
  issues:
