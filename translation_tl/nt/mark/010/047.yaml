  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἀκούσας ὅτι Ἰησοῦς ὁ ⸀Ναζαρηνός ἐστιν ἤρξατο κράζειν καὶ λέγειν· ⸀Υἱὲ Δαυὶδ Ἰησοῦ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/047.yaml
  text: And when he heard that it was Jesus the Nazarene[a], he began to cry out and say, “Jesus, Son of David, have mercy on me!”
translation:
  language: tl
  text: Nang marinig niya na iyon ay si Jesus na Nazareno[a], nagsimula siyang sumigaw at nagsabi, “Jesus, Anak ni David, maawa ka sa akin!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Jesus na taga-Nazaret.” Sa Griyego, “Jesus na Nazareno,” na isang bansag sa halip na mas tahasang heograpikal na pananalita.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: Nang marinig niya
  rationale: Ginawang sugnay na temporal ang aorist participle upang likas sa Tagalog at mapanatili ang pagkakasunod ng pangyayari.
- source_word: Ναζαρηνός
  choice: Nazareno
  rationale: Pinananatili ang anyong bansag o katawagan ng Griyego, sa halip na tahasang gawing heograpikal na “taga-Nazaret.”
- source_word: ἤρξατο κράζειν καὶ λέγειν
  choice: nagsimula siyang sumigaw at magsabi
  rationale: Pinananatili ang kahulugan ng pagsisimula at ang dalawang pandiwa sa estilong inuulit ni Marcos.
- source_word: κράζειν
  choice: sumigaw
  rationale: Malinaw na nagpapahiwatig ng malakas at apurahang pagtawag nang hindi kinakailangang magpahiwatig ng galit.
- source_word: Υἱὲ Δαυὶδ
  choice: Anak ni David
  rationale: Pinananatili ang literal at kinikilalang titulong may maharlika at mesiyanikong diwa.
- source_word: ἐλέησόν με
  choice: maawa ka sa akin
  rationale: Likas at marangal na pakiusap sa modernong Tagalog na tapat sa bigat ng pautos na pakiusap sa Griyego.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Ginagamit ang nakaugaliang anyo ng personal na pangalan sa Tagalog.
theological_decisions:
- issue: Mesiyanikong bisa ng “Anak ni David”
  choice: Panatilihin ang “Anak ni David” bilang titulong itinawag kay Jesus.
  alternative: inapo ni David
  rationale: Sa salaysay ni Marcos, may maharlika at mesiyanikong kabuluhan ang katawagang ito; mapapahina iyon kung gagawing pangkaraniwang paglalarawan lamang ng angkan.
- issue: Pagbibigay-kahulugan sa Ναζαρηνός
  choice: Isalin bilang “Nazareno.”
  alternative: taga-Nazaret
  rationale: Ang Griyego ay gumagamit ng anyong bansag; pinananatili ng “Nazareno” ang anyong iyon habang inilalagay sa talababa ang mas tahasang heograpikal na kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang bahagyang paulit-ulit na anyo ng pananalita ni Marcos at ang tradisyonal na titulong “Anak ni David.”
