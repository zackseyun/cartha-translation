source:
  edition: SBLGNT
  text: Καὶ ἐκεῖθεν ἀναστὰς ἔρχεται εἰς τὰ ὅρια τῆς Ἰουδαίας ⸀καὶ πέραν τοῦ Ἰορδάνου, καὶ συμπορεύονται πάλιν ὄχλοι πρὸς αὐτόν, καὶ ὡς εἰώθει πάλιν ἐδίδασκεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/001.yaml
  text: And from there[a], rising, he comes into the region of Judea and beyond the Jordan, and crowds gather to him again, and as was his custom[b], he again taught them.
translation:
  language: tl
  text: Mula roon, tumayo siya at pumunta sa nasasakupan ng Judea at sa ibayo ng Ilog Jordan.[a] Muling nagtipon sa kanya ang mga pulutong, at gaya ng nakaugalian niya, muli niya silang tinuruan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring unawain: “sa nasasakupan ng Judea na nasa ibayo ng Ilog Jordan.” Maaaring tumukoy ang Griyego sa dalawang magkaugnay na paglalarawan ng lugar o sa Judeang inilalarawang nasa ibayo ng Jordan.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκεῖθεν
  choice: mula roon
  rationale: Likas at tuwirang panandang pook na nag-uugnay sa pag-alis sa naunang tagpo.
- source_word: ἀναστὰς
  choice: tumayo siya
  rationale: Pinananatili ang kilos ng pagbangon o pagtayo bago pumunta, nang hindi ito ipinahihiwatig na muling pagkabuhay.
- source_word: ἔρχεται
  choice: pumunta
  rationale: Bagaman historical present ang Griyego, mas likas sa salaysay na Tagalog ang aspektong naganap; ipinahahayag nito ang pagpunta sa tinukoy na lugar.
- source_word: τὰ ὅρια τῆς Ἰουδαίας
  choice: nasasakupan ng Judea
  rationale: Ang ὅρια ay maaaring tumukoy sa teritoryo o rehiyon, hindi lamang sa mismong guhit ng hangganan.
- source_word: καὶ πέραν τοῦ Ἰορδάνου
  choice: at sa ibayo ng Ilog Jordan
  rationale: Malapit ito sa pagkakasunod ng Griyego at hindi lubusang nilulutas kung ikalawang paglalarawan ito ng pook o kaugnay ng Judea.
- source_word: συμπορεύονται ... ὄχλοι πρὸς αὐτόν
  choice: nagdatingan sa kanya ang napakaraming tao
  rationale: Ipinahahayag sa likas na Tagalog ang pagkilos ng mga pulutong patungo at pagsama sa kanya; ang napakaraming tao ay malinaw na katumbas ng maramihang ὄχλοι sa konteksto.
- source_word: πάλιν
  choice: muli
  rationale: Kapuwa paglitaw ng salita sa talata ay pinanatili upang maipakita ang paulit-ulit na estilo ni Marcos.
- source_word: ὡς εἰώθει
  choice: gaya ng nakaugalian niya
  rationale: Likas na Filipino para sa nakasanayan o palagiang gawain.
- source_word: ἐδίδασκεν αὐτούς
  choice: tinuruan niya sila
  rationale: Kasama ng pariralang nakaugalian, malinaw nitong ipinahahayag ang paulit-ulit na pagtuturo na ipinahihiwatig ng imperfect.
theological_decisions:
- issue: Historical present na ἔρχεται
  choice: Isinalin bilang “pumunta” sa aspektong naganap
  alternative: “pumupunta” o “dumarating” upang tularan ang historical present
  rationale: Hindi karaniwang likas sa salaysay na Tagalog ang biglang paglipat sa pangkasalukuyang aspekto rito. Pinananatili ng “pumunta” ang galaw at saysay nang hindi nagpapasok ng doktrinal na interpretasyon.
- issue: Ugnayan ng καὶ πέραν τοῦ Ἰορδάνου sa Judea
  choice: “sa nasasakupan ng Judea at sa ibayo ng Ilog Jordan”
  alternative: “sa nasasakupan ng Judea na nasa ibayo ng Ilog Jordan”
  rationale: Siksik at maaaring unawain sa higit sa isang paraan ang kayarian ng Griyego. Sinusunod ng pangunahing teksto ang pagkakasunod nito, habang inilalahad sa talababa ang alternatibong ugnayan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Ilog Jordan” para agad na malinaw ang heograpiya, at iniwasan ang labis na teknikal o makalumang pananalita.
