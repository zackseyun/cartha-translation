  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐὰν μὴ λάβῃ ἑκατονταπλασίονα νῦν ἐν τῷ καιρῷ τούτῳ οἰκίας καὶ ἀδελφοὺς καὶ ἀδελφὰς καὶ ⸀μητέρας καὶ τέκνα καὶ ἀγροὺς μετὰ διωγμῶν, καὶ ἐν τῷ αἰῶνι τῷ ἐρχομένῳ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/030.yaml
  text: who will not receive a hundredfold now in this time—houses and brothers and sisters and mothers and children and fields[a], with persecutions—and in the age to come[b], eternal life.
translation:
  language: tl
  text: na hindi tatanggap ng makaisandaang ulit ngayon, sa panahong ito—mga bahay, mga kapatid na lalaki at babae, mga ina, mga anak, at mga bukid[a], kalakip ang mga pag-uusig—at sa kapanahunang darating[b], buhay na walang hanggan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nang sandaang ulit.”
    reason: lexical_alternative
  - marker: b
    text: O “sa darating na kapanahunan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λάβῃ
  choice: tatanggap
  rationale: Sa konteksto ng pangako, ipinahihiwatig ng λαμβάνω ang pagtanggap sa ibinibigay, hindi ang sapilitang pagkuha.
- source_word: ἑκατονταπλασίονα
  choice: makaisandaang ulit
  rationale: Malinaw at likas nitong ipinahahayag sa modernong Tagalog ang ideya ng gantimpalang sandaang ulit ang dami.
- source_word: νῦν ἐν τῷ καιρῷ τούτῳ
  choice: ngayon, sa panahong ito
  rationale: Pinananatili nito ang tahasang paghahambing ng kasalukuyang panahon at ng panahong darating.
- source_word: οἰκίας
  choice: mga bahay
  rationale: Tuwiran at kongkretong katumbas ng pangmaramihang anyo.
- source_word: ἀδελφοὺς καὶ ἀδελφὰς
  choice: mga kapatid na lalaki at babae
  rationale: Pinananatili ang tahasang pagkakaiba ng mga kapatid na lalaki at mga kapatid na babae sa Griyego.
- source_word: μητέρας
  choice: mga ina
  rationale: Tuwirang katumbas na nagpapanatili sa pangmaramihang anyo.
- source_word: τέκνα
  choice: mga anak
  rationale: Likas at malawak na katumbas na hindi nililimitahan ang kasarian o gulang.
- source_word: ἀγρούς
  choice: mga bukid
  rationale: Kongkreto at karaniwang katumbas ng mga lupang sinasaka.
- source_word: μετὰ διωγμῶν
  choice: kalakip ang mga pag-uusig
  rationale: Malinaw na pinananatili ang tensiyon na ang kasalukuyang pagpapala ay may kasamang pag-uusig.
- source_word: ἐν τῷ αἰῶνι τῷ ἐρχομένῳ
  choice: sa panahong darating
  rationale: Likas sa Tagalog at tumpak na tumutukoy sa darating na kapanahunan, hindi lamang sa pisikal na mundo.
- source_word: ζωὴν αἰώνιον
  choice: buhay na walang hanggan
  rationale: Ito ang malinaw, kinikilalang katumbas ng eskatolohikal na parirala sa kontekstong ito.
theological_decisions:
- issue: Kalikasan ng ipinangakong gantimpala sa kasalukuyang panahon
  choice: Isinalin nang tuwiran ang mga bahay, ugnayang pampamilya, at mga bukid bilang tunay na gantimpala ngayon, habang pinanatili ang 'kalakip ang mga pag-uusig.'
  alternative: Ituring ang lahat bilang espirituwal na pagpapala lamang, o bilang pangakong materyal na kasaganaan na walang pagdurusa.
  rationale: Magkasamang inilalahad ng Griyego ang masaganang gantimpala at patuloy na pag-uusig; hindi dapat alisin ng salin ang tensiyong ito.
- issue: Kasarian sa mga katawagang pampamilya
  choice: mga kapatid na lalaki at babae
  alternative: mga kapatid
  rationale: Magkahiwalay na binabanggit ng Griyego ang mga lalaki at babaeng kapatid, kaya pinanatili ang pagkakaibang iyon.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Pinanatili ang anyong bahagi ng pangungusap mula sa naunang talata, pati ang listahan at ang matinding paghahambing sa pagitan ng pagpapala, pag-uusig, at buhay na walang hanggan.
