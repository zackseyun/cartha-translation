id: MRK.10.35
reference: Mark 10:35
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ προσπορεύονται αὐτῷ Ἰάκωβος καὶ Ἰωάννης ⸀οἱ υἱοὶ Ζεβεδαίου λέγοντες ⸀αὐτῷ· Διδάσκαλε, θέλομεν ἵνα ὃ ἐὰν αἰτήσωμέν ⸀σε ποιήσῃς ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/035.yaml
  text: And James and John[a], the sons of Zebedee, came to him and said to him, “Teacher, we want you to do for us whatever we ask of you.”
translation:
  language: tl
  text: Lumapit kay Jesus sina Santiago at Juan, ang mga anak ni Zebedeo, at sinabi sa kanya, “Guro, gusto naming gawin mo para sa amin ang anumang hilingin namin sa iyo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσπορεύονται αὐτῷ
  choice: Lumapit kay Jesus
  rationale: Ipinahahayag ng pandiwa ang paglapit o pagkilos patungo sa kanya. Ginawang tahasan ang pangalang Jesus upang maging malinaw at natural sa Filipino; ang pangkasalukuyang anyo ay nauunawaan bilang historical present sa salaysay.
- source_word: Ἰάκωβος καὶ Ἰωάννης
  choice: sina Santiago at Juan
  rationale: Ginamit ang karaniwang anyong Filipino ng mga pangalang biblikal at ang pantukoy na “sina” para sa dalawang tao.
- source_word: οἱ υἱοὶ Ζεβεδαίου
  choice: ang mga anak ni Zebedeo
  rationale: Tuwirang pinananatili ang appositional na pagkakakilanlan at ang ugnayang genitibo.
- source_word: λέγοντες αὐτῷ
  choice: at sinabi sa kanya
  rationale: Isinalin ang participle bilang finite verb, na mas natural sa salaysay sa Filipino habang pinananatili ang kausap.
- source_word: Διδάσκαλε
  choice: Guro
  rationale: Ito ang tuwiran at natural na katumbas ng titulong tumutukoy sa nagtuturo, nang hindi dinaragdagan ang diwa ng kapangyarihang maaaring ipahiwatig ng ibang titulo.
- source_word: θέλομεν
  choice: gusto namin
  rationale: Karaniwan, malinaw, at tuwirang pahayag ito ng pagnanais sa modernong Filipino.
- source_word: ἵνα ... ποιήσῃς ἡμῖν
  choice: gawin mo para sa amin
  rationale: Natural na isinasalin sa Filipino ang nilalayong kilos pagkatapos ng “gusto namin,” habang pinananatili ang malawak na kahulugan ng ποιέω at ang benepaktibong ἡμῖν.
- source_word: ὃ ἐὰν αἰτήσωμέν σε
  choice: ang anumang hilingin namin sa iyo
  rationale: Ang “anumang” ay nagpapanatili sa di-tiyak at malawak na saklaw ng relative pronoun na may ἐάν; ang “hilingin ... sa iyo” ay angkop sa konteksto ng isang kahilingan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Pinanatili ang tuwiran at medyo mapangahas na tono ng kahilingan ng magkapatid. Walang footnote dahil sapat na naihahayag ng “lumapit” ang leksikal na kilos patungo kay Jesus.
