base_translation:
  language: en
  yaml_path: translation/nt/mark/010/022.yaml
  text: But he[a], becoming gloomy at the word, went away grieving[c][b], for he had many possessions.
translation:
  language: tl
  text: Ngunit nanlumo siya[a] sa salitang iyon[b], at umalis na nagdadalamhati, sapagkat marami siyang ari-arian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dumilim ang kanyang mukha” o “nasiraan siya ng loob”; ipinahihiwatig ng Griyego ang nakikitang pagdidilim ng anyo.
    reason: lexical_alternative
  - marker: b
    text: O, “dahil sa pahayag na iyon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: στυγνάσας
  choice: nanlumo
  rationale: Ipinahihiwatig ng pandiwaring Griyego ang biglang pagdidilim ng anyo at matinding panghihina ng loob. Likas sa modernong Tagalog ang “nanlumo,” bagaman hindi nito ganap na tahasang sinasabi ang nakikitang pagbabago sa mukha; pinananatili iyon sa talababa.
- source_word: ἐπὶ τῷ λόγῳ
  choice: dahil sa sinabi ni Jesus
  rationale: Ang parirala ay nagsasaad ng sanhi o okasyon ng reaksiyon. Nililinaw ng “ni Jesus” ang tinutukoy ng isahang λόγος mula sa konteksto nang hindi binabago ang diwa.
- source_word: ἀπῆλθεν
  choice: umalis
  rationale: Karaniwan, malinaw, at natural na katumbas sa modernong Tagalog.
- source_word: λυπούμενος
  choice: na nagdadalamhati
  rationale: Pinananatili ng anyong pandiwari ang nagpapatuloy na matinding kalungkutan habang siya ay umaalis; mas mabigat ito kaysa simpleng “malungkot.”
- source_word: κτήματα πολλά
  choice: marami siyang ari-arian
  rationale: Ang κτήματα ay tumutukoy sa mga pag-aari o ari-arian, at ang πολλά ay likas na isinasaling “marami.” Hindi ipinapalagay ng salin na salapi lamang ang tinutukoy.
- source_word: ἦν γὰρ ἔχων
  choice: sapagkat marami siyang ari-arian
  rationale: Natural na ipinahahayag sa Tagalog ang nagpapatuloy na kalagayan ng pagmamay-ari sa pamamagitan ng “mayroon/may,” na dito ay inayos bilang “marami siyang ari-arian.”
theological_decisions:
- issue: Likas ng emosyonal na tugon ng lalaki sa sinabi ni Jesus
  choice: Inilalarawan siyang nanlumo at patuloy na nagdadalamhati, nang walang idinagdag na hatol sa kanyang motibo.
  alternative: Ilarawan siyang nagalit, tahasang tumanggi, o nabigo lamang.
  rationale: Ang Griyego ay nagsasaad ng nakikitang pagdidilim ng anyo at kalungkutan, ngunit hindi nito tahasang tinatawag na galit o ipinapaliwanag ang buong moral na kalagayan niya.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “ari-arian” sa halip na mas kolokyal na “mga pag-aari,” at ang “nagdadalamhati” upang mapanatili ang bigat at nagpapatuloy na katangian ng λύπη.
