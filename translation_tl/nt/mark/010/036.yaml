  yaml_path: translation/nt/mark/010/036.yaml
  text: And he said to them, “What do you want me to do for you?”
translation:
  language: tl
  text: Sinabi niya sa kanila, “Ano ang gusto ninyong gawin ko para sa inyo?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ
  choice: Sinabi niya
  rationale: Ang ὁ δὲ ay idyomatikong nagpapatuloy sa salaysay at muling tumutukoy kay Jesus. Hindi kailangang isalin nang hiwalay ang δέ sa Filipino, sapagkat natural na naipahihiwatig ng pagkakasunod ng pangungusap ang pagpapatuloy at wala rito ang matinding pagsalungat.
- source_word: εἶπεν
  choice: Sinabi
  rationale: Karaniwang pandiwa ito ng pagsasalita. Bagaman tanong ang kasunod, pinananatili ng “Sinabi” ang tuwirang kahulugang leksikal; ang anyong patanong mismo ang nagpapakitang nagtatanong siya.
- source_word: αὐτοῖς
  choice: sa kanila
  rationale: Tuwirang salin ito ng panghalip na datibong maramihan. Hindi idinagdag ang “dalawa” dahil hindi iyon tahasang nasa Griyego.
- source_word: Τί
  choice: Ano
  rationale: Payak at natural na katumbas ng panghalip na patanong.
- source_word: θέλετε
  choice: ang gusto ninyo
  rationale: Ang θέλω ay nagpapahayag ng pagnanais. Ang “gusto ninyo” ay natural at malinaw sa modernong Filipino nang hindi nagiging labis na pormal.
- source_word: ποιήσω
  choice: gawin ko
  rationale: Ang aorist subjunctive kasunod ng θέλετε ay tumutukoy sa kilos na ninanais nilang isagawa ni Jesus. Ang “gawin ko” ang likas na ayos sa Filipino at mas angkop dito kaysa “likhain ko.”
- source_word: ὑμῖν
  choice: para sa inyo
  rationale: 'Benefactive ang gamit ng datibo: ang hinihinging kilos ay gagawin alang-alang sa kanila. Likas na ipinahahayag ito ng “para sa inyo.”'
theological_decisions: []
translation_notes:
  register: Modernong Filipino na tuwiran, dignificado, at madaling maunawaan. Pinanatili ang payak na pandiwang “Sinabi” sa halip na palitan ng interpretatibong “Tinanong,” at hindi idinagdag ang “sa inyong dalawa” na wala sa mismong Griyego.
