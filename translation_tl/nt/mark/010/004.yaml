  text: οἱ δὲ εἶπαν· ⸂Ἐπέτρεψεν Μωϋσῆς⸃ βιβλίον ἀποστασίου γράψαι καὶ ἀπολῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/004.yaml
  text: They said[b][a], “Moses permitted us to write a certificate of divorce and send her away.”
translation:
  language: tl
  text: Sinabi nila, “Ipinahintulot ni Moises na sumulat ng kasulatan ng diborsiyo[a] at paalisin siya.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dokumento ng diborsiyo.” Ang pariralang Griyego ay tumutukoy sa nakasulat na legal na dokumento ng diborsiyo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “at hiwalayan siya.” Literal na “at paalisin,” na ginagamit dito sa konteksto ng diborsiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Sinabi nila
  rationale: Ang οἱ ay tumutukoy sa mga naunang kausap, at ang δέ ay nagpapahiwatig ng pagpapatuloy o bahagyang pagsalungat. Likas sa modernong Tagalog ang payak na “Sinabi nila.”
- source_word: Ἐπέτρεψεν
  choice: Ipinahintulot
  rationale: Malinaw na pahintulot ang kahulugan ng ἐπιτρέπω, hindi utos. Ang “ipinahintulot” ay angkop din sa legal at kontekstuwal na pagkakaiba ng pagpapahintulot at pag-uutos.
- source_word: Μωϋσῆς
  choice: Moises
  rationale: Karaniwang anyo ng pangalang ito sa Tagalog.
- source_word: βιβλίον ἀποστασίου
  choice: kasulatan ng diborsiyo
  rationale: Tumutukoy ito sa isang nakasulat at pormal na dokumentong legal ng diborsiyo. Malinaw at kasalukuyang termino sa Tagalog ang “kasulatan ng diborsiyo.”
- source_word: γράψαι
  choice: sumulat
  rationale: Tuwirang katumbas ito ng γράφω at hindi nagdaragdag ng mas tiyak na diwang wala sa teksto.
- source_word: καὶ ἀπολῦσαι
  choice: at paalisin siya
  rationale: Sa konteksto ng pag-aasawa, ang ἀπολύω ay tumutukoy sa pagpapaalis o pakikipagdiborsiyo sa asawa. Pinananatili ng “paalisin siya” ang kongkretong larawan ng pandiwa; nililinaw ng naunang “kasulatan ng diborsiyo” ang legal na konteksto. Ang “siya” ay likas na ipinahihiwatig ng konteksto bagaman walang tahasang layon sa Griyego.
theological_decisions:
- issue: Ang katangian ng tagubilin ni Moises tungkol sa diborsiyo
  choice: Ipinahintulot ni Moises ang diborsiyo; hindi niya ito positibong iniutos
  alternative: Iniutos ni Moises na sumulat ang lalaki ng kasulatan ng diborsiyo
  rationale: Tahasang nangangahulugang “nagpahintulot” ang Ἐπέτρεψεν. Mahalaga ito sa kasunod na paghahambing ni Jesus sa konsesyon dahil sa katigasan ng puso at sa layunin ng Diyos mula sa paglikha.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural. Pinanatili ang legal na diwa ng “ipinahintulot” at “kasulatan,” gayundin ang kongkretong larawan ng “paalisin,” habang ipinaliliwanag sa talababa ang kahulugan nito sa konteksto ng diborsiyo.
