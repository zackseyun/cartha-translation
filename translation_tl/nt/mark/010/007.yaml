  source_fidelity: 'Ang “Dahil dito,” “iiwan ng lalaki ang kanyang ama at ina,” at “kanyang asawa” ay tumpak na tumutugon sa ἕνεκεν τούτου, καταλείψει ἄνθρωπος τὸν πατέρα αὐτοῦ καὶ τὴν μητέρα, at πρὸς τὴν γυναῖκα αὐτοῦ. Gayunman, ang “makikisama siya nang mahigpit” ay hindi sapat na katumbas ng προσκολληθήσεται: ang makisama ay karaniwang mangahulugang makibagay o makitungo/nanirahang kasama, samantalang ang Griyego ay nagsasaad ng mahigpit na pagdikit o pagkapit.'
