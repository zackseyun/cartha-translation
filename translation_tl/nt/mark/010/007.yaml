base_translation:
  language: en
  yaml_path: translation/nt/mark/010/007.yaml
  text: For this reason a man will leave his father and mother and be joined to his wife,[a]
translation:
  language: tl
  text: Dahil dito, iiwan ng lalaki ang kanyang ama at ina at didikit sa kanyang asawa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mahigpit na kakapit sa kanyang asawa.” Maaaring idiin ng pandiwang Griyego ang napakalapit at matibay na pagkalakip.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕνεκεν τούτου
  choice: Dahil dito
  rationale: Natural na makabagong Tagalog na nagpapanatili sa pananalitang nagsasaad ng dahilan.
- source_word: καταλείψει
  choice: iiwan
  rationale: Tuwirang katumbas ng future indicative at malinaw na tumutukoy sa pag-iwan sa sambahayan ng mga magulang.
- source_word: ἄνθρωπος
  choice: ang lalaki
  rationale: Bagaman maaari itong mangahulugang tao sa pangkalahatan, nililinaw ng konteksto at ng pariralang 'kanyang asawa' na lalaki ang tinutukoy rito.
- source_word: τὸν πατέρα αὐτοῦ καὶ τὴν μητέρα
  choice: ang kanyang ama at ina
  rationale: Natural at tumpak na Tagalog; hindi na kailangang ulitin ang 'kanyang' bago ang 'ina.'
- source_word: προσκολληθήσεται
  choice: makikisama siya nang mahigpit
  rationale: Ipinahahayag ang malapit at matibay na pagkalakip na saklaw ng pandiwa, habang nananatiling nauunawaan sa karaniwang modernong Tagalog.
- source_word: πρὸς τὴν γυναῖκα αὐτοῦ
  choice: sa kanyang asawa
  rationale: Sa konteksto ng pag-aasawa, ang γυνή ay malinaw na nangangahulugang asawa, hindi lamang babae.
theological_decisions:
- issue: May kasariang kinatawang pananalita sa sipi tungkol sa pag-aasawa
  choice: ang lalaki ... kanyang asawa
  alternative: ang isang tao ... kanyang kabiyak
  rationale: Tiyak sa konteksto ang kasarian ng tinutukoy, kaya pinananatili ang lalaki sa halip na gawing neutral ang pahayag.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino Tagalog. Ginamit ang 'makikisama nang mahigpit' upang maipakita ang malapit na pagkalakip nang hindi mawala ang likas na daloy; inilagay sa talababa ang mas literal na 'didikit.'
