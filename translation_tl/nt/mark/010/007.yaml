  terminology: Pinananatili ang “lalaki” at “asawa,” na angkop sa kasariang tiyak sa konteksto ng sipi. Ang “didikit” ay nagpapanatili ng metaporang paglakip ng προσκολλάω nang hindi nagdaragdag ng ideyang simpleng pakikisama.
