id: MRK.10.17
reference: Mark 10:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἐκπορευομένου αὐτοῦ εἰς ὁδὸν προσδραμὼν εἷς καὶ γονυπετήσας αὐτὸν ἐπηρώτα αὐτόν· Διδάσκαλε ἀγαθέ, τί ποιήσω ἵνα ζωὴν αἰώνιον κληρονομήσω;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/017.yaml
  text: And as he was going out onto the road[a], one man ran up and knelt before him and asked him, “Good Teacher, what must I do so that I may inherit eternal life?”
translation:
  language: tl
  text: Habang papunta siya sa daan[a], isang lalaki ang tumakbong lumapit, lumuhod sa harap niya, at nagtanong sa kanya, “Mabuting Guro, ano ang dapat kong gawin upang magmana ng buhay na walang hanggan?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “habang nagsisimula siyang maglakbay.” Ang pananalitang Griyego ay maaaring tumukoy sa pagpunta sa daan o sa pagsisimula ng isang paglalakbay.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπορευομένου αὐτοῦ εἰς ὁδόν
  choice: habang lumalabas siya patungo sa daan
  rationale: Pinananatili nito ang kasabay na kilos ng genitive absolute at ang larawang papunta siya sa daan, habang iniiwang bukas ang idyomatikong posibilidad na nagsisimula siya ng paglalakbay.
- source_word: προσδραμὼν
  choice: patakbong lumapit
  rationale: Likas itong pakinggan sa modernong Tagalog at malinaw na ipinahihiwatig ang apurahang paglapit ng lalaki.
- source_word: εἷς
  choice: may isang lalaki
  rationale: Ang substantibong panlalaking anyo ay tumutukoy sa isang partikular na lalaki na bagong ipinakikilala sa salaysay.
- source_word: γονυπετήσας αὐτόν
  choice: lumuhod sa harap niya
  rationale: Tuwirang inilalarawan nito ang kilos at magalang o taimtim na postura nang hindi dinaragdagan ang tindi ng teksto.
- source_word: ἐπηρώτα αὐτόν
  choice: nagtanong sa kanya
  rationale: Bagaman imperfect ang pandiwa, ang payak na salaysay na 'nagtanong' ang pinakanatural sa Tagalog sa kontekstong ito.
- source_word: Διδάσκαλε ἀγαθέ
  choice: Mabuting Guro
  rationale: Pinananatili nito ang literal at mahalagang tambalan ng pang-uri at titulo na magiging batayan ng tugon ni Jesus sa susunod na talata.
- source_word: τί ποιήσω
  choice: ano ang dapat kong gawin
  rationale: Likas na ipinapahayag ng 'dapat' ang praktikal na tanong tungkol sa kinakailangang gawin, nang hindi nagdaragdag ng teolohikal na paliwanag.
- source_word: ἵνα
  choice: upang
  rationale: Malinaw at marangal nitong ipinakikita ang layunin o inaasahang bunga.
- source_word: ζωὴν αἰώνιον
  choice: buhay na walang hanggan
  rationale: Ito ang malinaw at nakasanayang salin sa Tagalog na pinananatili ang kahulugan at teolohikal na bigat ng parirala.
- source_word: κληρονομήσω
  choice: magmana
  rationale: Pinananatili ng salitang ito ang larawan ng pagtanggap bilang mana, sa halip na pahinain iyon bilang simpleng pagkuha o pagtanggap.
theological_decisions:
- issue: Ang tawag ng lalaki kay Jesus
  choice: Mabuting Guro
  alternative: Mabuting Panginoon
  rationale: διδάσκαλε ang ginamit, hindi κύριε. Ang 'Guro' ay hindi nag-aangkat ng mas malakas na titulo kaysa sa nasa teksto at pinananatili ang kabuluhan ng 'mabuti' para sa kasunod na tugon ni Jesus.
- issue: Kasarian sa εἷς
  choice: may isang lalaki
  alternative: may isang tao
  rationale: Sinusuportahan ng panlalaking anyo at konteksto ng salaysay ang 'lalaki,' kaya hindi pinapapantay sa mas pangkalahatang katawagan ang espesipikong sanggunian.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang 'siya' ayon sa daloy ng ibinigay na talata, at iniwasan ang tradisyonal ngunit mas lumang 'Datapwat,' 'manaig,' o 'magkamit.'
