  - severity: medium
    issue: Hindi wastong leksikal na alternatibo ang “habang naglalakbay” para sa ἐν τῇ ὁδῷ.
    rationale: Ang parirala ay “sa daan/landas,” isang lokatibong pahayag. Ang dating talababa ay ginagawang temporal ang parirala at nagdaragdag ng interpretibong pagbasa na wala sa tekstong Griyego.
