  source_fidelity: Tumpak ang pangunahing pagsasalin ng utos, pananampalataya, malawak na diwa ng σέσωκέν, at agarang pagbabalik ng paningin. Gayunman, ang ἠκολούθει ay imperpekto at mas malinaw na dapat ipahiwatig ang nagpapatuloy na pagsunod. Hindi rin tumpak na alternatibo para sa ἐν τῇ ὁδῷ ang “habang naglalakbay,” sapagkat ang Griyego ay pariralang panlunan, hindi tahasang panahunan.
  naturalness: Likas at marangal ang kabuuang modernong Tagalog. Ang “Humayo ka” ay bahagyang mataas na rehistro ngunit angkop sa tuwirang pananalita ni Jesus. Ang “patuloy siyang sumunod” ay natural at mas malapit sa aspektong Griyego.
  terminology: Ang “pananampalataya” at “nagligtas” ay angkop at pinananatili ang sinadyang lawak ng πίστις at σῴζω. Ang talababa sa “pagtitiwala” at sa pagpapagaling ay angkop. Inalis ang hindi kinakailangang interpretibong pahiwatig na ang “daan” ay landas ng pagsunod at pinalitan ng tunay na leksikal na alternatibo.
