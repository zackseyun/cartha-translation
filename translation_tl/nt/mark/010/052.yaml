  text: ⸂καὶ ὁ⸃ Ἰησοῦς εἶπεν αὐτῷ· Ὕπαγε, ἡ πίστις σου σέσωκέν σε. καὶ ⸀εὐθὺς ἀνέβλεψεν, καὶ ἠκολούθει ⸀αὐτῷ ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/052.yaml
  text: And Jesus said to him[a], “Go[c][b]; your faith has saved you.” And immediately he regained his sight and followed him on the road.
translation:
  language: tl
  text: At sinabi sa kanya ni Jesus, “Humayo ka; ang pananampalataya[a] mo ang nagligtas[b] sa iyo.” Agad siyang muling nakakita at patuloy siyang sumunod sa kanya sa daan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pagtitiwala.”
    reason: alternative_reading
  - marker: b
    text: Maaari ring “nagpagaling” o “nagpanumbalik ng iyong kalusugan.” Ang pandiwang Griyego ay maaaring tumukoy kapuwa sa pagpapagaling at sa pagliligtas.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “sa landas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὕπαγε
  choice: Humayo ka
  rationale: Tuwirang pautos ito na umalis o magpatuloy. Ang “Humayo ka” ay malinaw at marangal, at hindi nagdaragdag ng diwa ng pagmamay-ari na wala sa Griyego.
- source_word: πίστις
  choice: pananampalataya
  rationale: Sa kontekstong ito, tumutukoy ito sa mapagtiwalang pag-asa ng lalaki kay Jesus. Pinananatili ng “pananampalataya” ang mahalagang terminong biblikal, habang kinikilala sa talababa ang posibleng “pagtitiwala.”
- source_word: σέσωκέν
  choice: nagligtas
  rationale: Ang σῴζω ay maaaring tumukoy sa pagliligtas, pagpapagaling, o pagpapanumbalik. Pinananatili ng “nagligtas” ang mas malawak na saklaw ng salita at ang tensiyon sa pagitan ng pisikal na paggaling at higit na ganap na kaligtasan.
- source_word: εὐθύς
  choice: Agad
  rationale: Likas at maikli itong katumbas na nagpapanatili sa mabilis na takbo ng salaysay ni Marcos.
- source_word: ἀνέβλεψεν
  choice: muling nakakita
  rationale: Sa konteksto ng lalaking bulag, malinaw na tumutukoy ito sa pagpapanumbalik ng paningin, hindi lamang sa pagtingala.
- source_word: ἠκολούθει
  choice: sumunod
  rationale: Ang imperpektong anyo ay naglalarawan ng pagsunod na nagpapatuloy sa daan. Sa natural na Tagalog, sapat na naihahayag ng “sumunod” sa kontekstong ito ang kilos nang hindi nagdaragdag ng tahasang “nagsimulang” na wala sa teksto.
- source_word: ἐν τῇ ὁδῷ
  choice: sa daan
  rationale: Pinananatili nito ang kongkretong tagpuan ng paglalakbay at hindi rin isinasara ang posibleng mas malalim na diwa ng “daan” bilang pagsunod.
- source_word: καὶ ὁ Ἰησοῦς
  choice: At sinabi sa kanya ni Jesus
  rationale: Pinananatili ang pang-ugnay na καί bilang “At” at isinasaayos ang pangungusap ayon sa natural na ayos ng modernong Tagalog.
theological_decisions:
- issue: Kahulugan ng σῴζω sa pahayag ni Jesus
  choice: nagligtas
  alternative: nagpagaling / nagpanumbalik ng iyong kalusugan
  rationale: Kaagad na ipinakikita ng salaysay ang paggaling ng paningin, ngunit mas malawak ang maaaring kahulugan ng pandiwang Griyego. Kaya hindi nililimitahan ng pangunahing teksto ang sinabi ni Jesus sa pisikal na paggaling lamang.
- issue: Kahulugan ng πίστις
  choice: pananampalataya
  alternative: pagtitiwala
  rationale: Ang “pananampalataya” ay nagpapanatili sa pangunahing terminong biblikal, samantalang ang “pagtitiwala” ay wastong nagpapaliwanag sa mapagtiwalang pag-asa ng lalaki kay Jesus sa kontekstong ito.
translation_notes:
  register: Modernong Filipino Tagalog na likas, malinaw, at marangal. Ginamit ang “Humayo ka” upang mapanatili ang solemne ngunit madaling maunawaang tono. Ang ayos na “ang pananampalataya mo ang nagligtas sa iyo” ay natural sa Tagalog at pinananatili ang diin ng Griyego sa pananampalataya bilang simuno.
