  yaml_path: translation/nt/mark/010/031.yaml
  text: But many who are first will be last[a], and the last first.
translation:
  language: tl
  text: Ngunit marami sa mga nauuna ang magiging nahuhuli, at ang mga nahuhuli ay mauuna.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὶ
  choice: marami
  rationale: Ang pang-uri ay ginagamit bilang pangngalan at tumutukoy sa isang malawak ngunit hindi ganap na saklaw. Likas at sapat sa Tagalog ang “marami” nang hindi na idinaragdag ang “tao.”
- source_word: δὲ
  choice: Ngunit
  rationale: Nagpapahiwatig ang δέ ng banayad na pagsalungat o paglipat. Ang “Ngunit” ay angkop sa konteksto, sapagkat kasunod ito ng pangako sa naunang talata at nagpapakilala ng kabaligtaran sa kalagayan o ranggo.
- source_word: ἔσονται
  choice: magiging
  rationale: Payak na panghinaharap ng pandiwang εἰμί ang anyong ito. Natural sa modernong Tagalog ang “magiging” sa ganitong pahayag.
- source_word: πρῶτοι
  choice: mga nauuna / mauuna
  rationale: Ipinahihiwatig rito ng πρῶτος ang posisyon o ranggo, hindi lamang ang pagkakasunod-sunod. Pinananatili ng “nauuna” at katumbas nitong panghinaharap na “mauuna” ang maikli at matalinghagang pagsasalungatan.
- source_word: ἔσχατοι
  choice: mga nahuhuli / magiging nahuhuli
  rationale: Kabaligtaran ito ng πρῶτοι sa posisyon o katayuan. Ang “nahuhuli” ang pinakanatural na tuwirang katapat at hindi nililimitahan ang kahulugan sa pagiging pinakamababa o huli sa panahon.
- source_word: οἱ ἔσχατοι
  choice: ang mga nahuhuli
  rationale: Ginagawang substantibo ng pantukoy ang parirala. Malinaw at natural itong isalin bilang “ang mga nahuhuli.”
- source_word: καὶ
  choice: at
  rationale: Payak na pinagdurugtong ng καὶ ang dalawang bahagi ng kasabihan. Pinananatili ng “at” ang magkatimbang na kayarian nang walang idinadagdag na interpretasyon.
theological_decisions:
- issue: Kalikasan ng pagbabaligtad sa kasabihan
  choice: Isinalin bilang pangkalahatang prinsipyo ng pagbabaligtad sa hinaharap, nang hindi tinutukoy kung panlipunan, moral, o nauukol sa kaligtasan ang mga kategorya.
  alternative: Tukuyin ang “nauuna” at “nahuhuli” bilang mayaman at mahirap, mga alagad at mga tagalabas, o gawing lubos na tuntuning saklaw ang bawat tao.
  rationale: Malawak at paradoksal ang pahayag sa konteksto, ngunit hindi tahasang binibigyang-kahulugan ng talata ang mga kategorya. Kaya pinananatili ng salin ang pagiging bukas at mariin ng kasabihan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, maikli, at marangal. Ginamit ang magkaparis na “nauuna/nahuhuli” at “magiging nahuhuli/mauuna” upang mapanatili ang antitesis at aphoristic na ritmo ng Griyego.
