  source_fidelity: 'Tapat ang salin sa Griyego: ang πολλοί ay nananatiling hindi ganap na saklaw na “marami,” ang δέ ay angkop na minarkahan ng “Ngunit,” at napananatili ang hinaharap at ang magkatambal na pagbabaligtad ng “nauuna/nahuhuli.” Hindi nito dinaragdagan o nililimitahan ang mga tinutukoy na pangkat.'
