  to: Nasa daan[a] sila, paakyat sa Jerusalem. Nauuna sa kanila si Jesus,[b] at namamangha sila; ngunit natatakot ang mga sumusunod. Muli niyang ibinukod ang Labindalawa[c] at nagsimula siyang magsabi sa kanila tungkol sa mga bagay na malapit nang mangyari sa kanya.
