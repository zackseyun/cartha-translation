  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἦσαν δὲ ἐν τῇ ὁδῷ ἀναβαίνοντες εἰς Ἱεροσόλυμα, καὶ ἦν προάγων αὐτοὺς ὁ Ἰησοῦς, καὶ ἐθαμβοῦντο, ⸂οἱ δὲ⸃ ἀκολουθοῦντες ἐφοβοῦντο. καὶ παραλαβὼν πάλιν τοὺς δώδεκα ἤρξατο αὐτοῖς λέγειν τὰ μέλλοντα αὐτῷ συμβαίνειν
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/032.yaml
  text: They were on the road[a], going up to Jerusalem, and Jesus was going ahead of them; and they were astonished, while those who were following were afraid. And taking the Twelve aside again[b], he began to tell them the things that were about to happen to him.
translation:
  language: tl
  text: Nasa daan[a] sila, paakyat sa Jerusalem. Nauuna sa kanila si Jesus,[b] at namamangha sila; ngunit natatakot ang mga sumusunod. Muli niyang ibinukod ang Labindalawa[c] at nagsimula siyang magsabi sa kanila tungkol sa mga bagay na malapit nang mangyari sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nasa landas.”
    reason: lexical_alternative
  - marker: b
    text: O “nangunguna sa kanila si Jesus.”
    reason: lexical_alternative
  - marker: c
    text: O “isinama niya ang Labindalawa.”
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ἐν τῇ ὁδῷ
  choice: nasa daan
  rationale: Likas at konkretong paglalarawan ito sa kanilang paglalakbay; pinananatili ng talababa ang posibleng mas matalinghagang “nasa landas.”
- source_word: ἀναβαίνοντες εἰς Ἱεροσόλυμα
  choice: paakyat sa Jerusalem
  rationale: Pinananatili nito ang diwa ng pag-ahon patungo sa Jerusalem dahil sa taas ng lugar at sa karaniwang pananalita tungkol sa paglalakbay roon.
- source_word: προάγων αὐτούς
  choice: nauuna sa kanila
  rationale: Tuwirang inilalarawan ang posisyon ni Jesus sa unahan nang hindi ipinapasok ang mas interpretibong “pinangungunahan sila.”
- source_word: ἐθαμβοῦντο
  choice: namamangha sila
  rationale: Ipinahahayag ang patuloy na matinding pagtataka o pagkamangha nang hindi ito pinalalabis bilang pagkasindak.
- source_word: οἱ δὲ ἀκολουθοῦντες
  choice: ang mga sumusunod
  rationale: Pinananatili ang participial na paglalarawan at hindi tinutukoy nang higit sa teksto kung sino mismo ang bumubuo sa pangkat.
- source_word: ἐφοβοῦντο
  choice: natatakot
  rationale: Payak at natural na salin na nagpapanatili sa patuloy na kalagayang ipinahihiwatig ng imperfect.
- source_word: παραλαβὼν ... τοὺς δώδεκα
  choice: ibinukod ang Labindalawa
  rationale: Ang konteksto ay nagpapahiwatig na inilayo ni Jesus ang Labindalawa upang kausapin sila, ngunit inilalagay sa talababa ang mas literal at hindi gaanong tiyak na alternatibo.
- source_word: πάλιν
  choice: muli
  rationale: Natural na ipinahahayag ang pag-uulit ng pagkilos.
- source_word: ἤρξατο αὐτοῖς λέγειν
  choice: sinimulang sabihin sa kanila
  rationale: Pinananatili ang inceptive na puwersa ng pandiwa at ang tuwirang pagtuturo sa kanila.
- source_word: τὰ μέλλοντα αὐτῷ συμβαίνειν
  choice: ang mga bagay na malapit nang mangyari sa kanya
  rationale: Pinananatili ang nalalapit na mga pangyayari nang hindi nagdaragdag ng mas malakas na diwa ng itinakdang kapalaran.
theological_decisions:
- issue: Magkaibang emosyon ng dalawang pangkat sa salaysay
  choice: “namamangha sila” at “natatakot ang mga sumusunod”
  alternative: Gawing pangkalahatang pagkamangha o pagkatakot ang parehong tugon
  rationale: Magkaibang pandiwa ang ginamit sa Griyego. Ang pagpapanatili sa pagkakaibang ito ay hindi nagpapantay o nagpapaliwanag nang labis sa tensiyon ng salaysay.
- issue: Ang saklaw at tinutukoy ng panghalip na “sila” at ng “mga sumusunod”
  choice: Panatilihing hindi tahasang nililinaw kung sino ang unang pangkat
  alternative: Tukuyin ang unang pangkat bilang Labindalawa o mga alagad
  rationale: Hindi tahasang pinangalanan ng talata ang unang pangkat, kaya hindi ito nilimitahan sa isang interpretasyon.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “Labindalawa” bilang pamilyar na katawagan sa pangkat ng mga apostol. Pinili ang maiikling sugnay upang mapanatili ang kilos at tensiyon ng salaysay; hindi nagdagdag ng panimulang “Ngayon” sapagkat walang katumbas na tahasang temporal na salita sa pinagmulan.
