  - severity: low
    issue: Di-likas ang alternatibong ayos sa talababa.
    rationale: Ang “nang muli silang nasa loob ng bahay” ay mabigat at hindi malinaw na Tagalog. Maaaring ipakita ang alternatibong saklaw ng “muli” sa pamamagitan ng “pagpasok nila muli sa bahay.”
