translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “alagad” bilang karaniwang katawagang biblikal ngunit nauunawaan pa rin ng ordinaryong mambabasa. Iniwasan ang sobrang literal na “papasok sa bahay” at ang hindi tiyak na dagdag na “nagsimulang,” habang pinanatili sa talababa ang sintaktikong kalabuan ng πάλιν.
