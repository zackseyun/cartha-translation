  source_fidelity: Ang pangunahing salin ay wastong naghahatid ng mga kalahok at ng paksa ng pagtatanong, at tama ang pagkilalang may sintaktikong kalabuan ang πάλιν. Gayunman, ang “nasa loob na sila ng bahay” ay inililipat ang εἰς τὴν οἰκίαν mula sa kilos ng pagpasok tungo sa simpleng kinalalagyan. Mas ligtas na panatilihin ang diwang pagpasok sa bahay. Ang simpleng nakaraang “tinanong” ay katanggap-tanggap na idiomatikong paglalapat ng imperpekto sa Tagalog na salaysay; hindi kailangang ipilit ang aspektong nagpapatuloy kung magiging di-likas.
  naturalness: Natural at marangal sa modernong Filipino ang “Pagpasok nila sa bahay, muli siyang tinanong ng mga alagad tungkol dito.” Mas maigsi at mas malinaw ito kaysa “nang nasa loob na sila ng bahay.” Ang umiiral na alternatibong talababa na “nang muli silang nasa loob” ay hindi natural na Tagalog.
  terminology: Ang “mga alagad” ay angkop at matatag na katawagang biblikal para sa οἱ μαθηταί. Ang “tungkol dito” ay tumpak at natural para sa περὶ τούτου. Walang isyung teolohikal o pangngalan.
