  yaml_path: translation/nt/mark/010/010.yaml
  text: And in the house again[b][a], the disciples were asking him about this.
translation:
  language: tl
  text: At pagpasok nila sa bahay, muli siyang tinanong ng mga alagad tungkol dito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “At pagpasok nila muli sa bahay, tinanong siya ng mga alagad tungkol dito.”'
    reason: Maaaring iugnay ang “muli” (πάλιν) sa pagpasok sa bahay sa halip na sa pagtatanong.
lexical_decisions:
- source_word: Καὶ
  choice: At
  rationale: Karaniwang pang-ugnay sa salaysay; inuugnay nito ang pribadong tagpo sa naunang talakayan nang hindi nagdaragdag ng tiyak na temporal na diwa.
- source_word: εἰς τὴν οἰκίαν
  choice: nang nasa loob na sila ng bahay
  rationale: Bagaman literal na may diwang ‘papasok sa bahay,’ sa konteksto ay inilalarawan nito ang kalagayan matapos silang pumasok. Likas sa modernong Tagalog ang napiling parirala at pinananatili nito ang bahay bilang pribadong tagpuan.
- source_word: πάλιν
  choice: muli
  rationale: Pinakanatural itong iugnay sa pagtatanong ng mga alagad, ngunit maaaring iugnay sa kanilang muling pagkapasok o pagkanaroon sa bahay; pinananatili sa talababa ang tunay na kalabuan.
- source_word: οἱ μαθηταὶ
  choice: ang mga alagad
  rationale: Tumutukoy ang tiyak na pantukoy sa kilalang pangkat ng mga alagad. Hindi kailangang idagdag ang ‘niya’ dahil malinaw ang tinutukoy sa konteksto.
- source_word: περὶ τούτου
  choice: tungkol dito
  rationale: Tuwiran, maikli, at natural na katumbas; tumutukoy ang ‘ito’ sa usapin sa naunang talakayan.
- source_word: ἐπηρώτων
  choice: tinanong
  rationale: Ang imperpektong anyo ay maaaring magpahiwatig ng nagpapatuloy o paulit-ulit na pagtatanong, ngunit hindi iyon kailangang gawing tahasang ‘patuloy na’ sa Tagalog. Kasama ng ‘muli,’ malinaw ang panibagong pagtatanong nang hindi nagdaragdag ng diwang ‘nagsimulang’ wala sa pandiwa.
- source_word: αὐτόν
  choice: siya
  rationale: Tuwirang panghalip na layon na tumutukoy kay Jesus; malinaw ito sa konteksto.
