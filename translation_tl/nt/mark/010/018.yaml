  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτῷ· Τί με λέγεις ἀγαθόν; οὐδεὶς ἀγαθὸς εἰ μὴ εἷς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/018.yaml
  text: But Jesus said to him[a], “Why do you call me good? No one is good except one—God.”
translation:
  language: tl
  text: Ngunit sinabi sa kanya ni Jesus, “Bakit mo ako tinatawag na mabuti?[a] Walang sinumang mabuti maliban sa iisa—ang Diyos.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “Ano ang dahilan at tinatawag mo akong mabuti?”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig ang banayad na pagsalungat o paglipat sa tugon ni Jesus; likas at marangal ito sa Filipino.
- source_word: εἶπεν αὐτῷ
  choice: sinabi sa kanya ni Jesus
  rationale: Tuwirang katumbas ng pandiwa at di-tuwirang layon, habang sumusunod sa natural na ayos ng pangungusap sa Filipino.
- source_word: Τί με λέγεις ἀγαθόν
  choice: Bakit mo ako tinatawag na mabuti?
  rationale: Sa idyomang ito, ang τί ay gumaganap na patanong sa dahilan. Mas natural sa modernong Filipino ang “Bakit” kaysa sa literal ngunit asiwa na “Ano't tinatawag mo akong mabuti?”
- source_word: ἀγαθόν / ἀγαθὸς
  choice: mabuti
  rationale: Pinananatili ang parehong salitang-ugat sa dalawang paglitaw upang mapangalagaan ang pag-uulit at retorikal na diin.
- source_word: οὐδεὶς
  choice: Walang
  rationale: Natural at malinaw na pagpapahayag ng pangkalahatang pagtanggi sa Filipino.
- source_word: εἰ μὴ εἷς ὁ θεός
  choice: maliban sa iisa—ang Diyos
  rationale: Pinananatili ang eksklusibong konstruksyon at ang diin sa pagiging iisa bago tukuyin ang Diyos.
theological_decisions:
- issue: Posibleng implikasyong Kristolohikal ng sinabi ni Jesus tungkol sa kabutihan
  choice: Isinalin nang tuwiran, nang walang dagdag na paliwanag na nagpapasyang itinatanggi o tahasang iginigiit ni Jesus dito ang kanyang pagka-Diyos.
  alternative: Isang saling nagpapahiwatig na itinatanggi ni Jesus ang kanyang pagka-Diyos, o isang saling tahasang ginagawang pag-aangkin ng pagka-Diyos ang pangungusap.
  rationale: Hinahamon ng teksto ang pagtawag ng lalaki kay Jesus na “mabuti,” ngunit hindi nito tahasang nilulutas ang buong Kristolohikal na implikasyon. Dapat manatili ang teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang “Ngunit” para sa banayad na kontrast at “iisa—ang Diyos” upang mapanatili ang diin ng Griyego. Ang talababa [a] ay inilagay agad pagkatapos ng tanong na tinutukoy nito.
