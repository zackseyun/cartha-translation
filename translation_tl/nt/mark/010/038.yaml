  to: Ngunit sinabi sa kanila ni Jesus, “Hindi ninyo alam kung ano ang hinihingi ninyo. Kaya ba ninyong inumin ang kopang iniinom ko[a], o mabautismuhan sa bautismong tinatanggap ko[b]?”
