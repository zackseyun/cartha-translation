source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐκ οἴδατε τί αἰτεῖσθε· δύνασθε πιεῖν τὸ ποτήριον ὃ ἐγὼ πίνω, ⸀ἢ τὸ βάπτισμα ὃ ἐγὼ βαπτίζομαι βαπτισθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/038.yaml
  text: But Jesus said to them[a], “You do not know what you are asking. Are you able to drink the cup that I drink[b], or to be baptized with the baptism with which I am baptized?”
translation:
  language: tl
  text: Ngunit sinabi sa kanila ni Jesus, “Hindi ninyo alam kung ano ang hinihingi ninyo. Kaya ba ninyong inumin ang kopang iniinom ko[a], o mabautismuhan sa bautismong tinatanggap ko[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kopa” ay talinghagang biblikal para sa bahaging itinakdang danasin ng isang tao; dito, lalo itong tumutukoy sa nalalapit na pagdurusa ni Jesus.
    reason: cross_reference
  - marker: b
    text: Mas literal, “mabautismuhan sa bautismong ibinabautismo sa akin.” Inuulit sa Griyego ang magkakaugnay na mga salitang “bautismo” at “bautismuhan” bilang pagdidiin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Ngunit sinabi sa kanila ni Jesus
  rationale: Ipinahihiwatig ng δέ ang banayad na pagsalungat habang itinutuwid ni Jesus ang naunang kahilingan. Likas sa modernong Tagalog ang ayos na ito.
- source_word: Οὐκ οἴδατε
  choice: Hindi ninyo alam
  rationale: Pinananatili nito ang pangunahing kahulugan ng οἶδα at ang tuwirang pagsaway, nang hindi agad pinapakahulugang “hindi ninyo nauunawaan.”
- source_word: τί αἰτεῖσθε
  choice: kung ano ang hinihingi ninyo
  rationale: Karaniwang ipinapahayag ng αἰτέω ang paghingi. Ang “hinihingi” ay natural at angkop sa kahilingang binabanggit sa konteksto.
- source_word: δύνασθε
  choice: Kaya ba ninyo
  rationale: Natural na tanong ito sa Tagalog tungkol sa kakayahan o kapasidad, na siyang diwa ng δύναμαι.
- source_word: πιεῖν τὸ ποτήριον ὃ ἐγὼ πίνω
  choice: inumin ang kopang iniinom ko
  rationale: Pinananatili ang kongkretong talinghaga ng kopa at ang pag-uulit ng pandiwang “inumin/iniinom,” nang hindi inilalagay sa pangunahing teksto ang paliwanag na tumutukoy ito sa pagdurusa.
- source_word: ποτήριον
  choice: kopa
  rationale: Ang “kopa” ay dignified at pamilyar na katawagang biblikal para sa sisidlang inuman, at napapanatili nito ang mahalagang talinghaga.
- source_word: ἢ
  choice: o
  rationale: Tuwirang pinananatili ang disjunctive na pang-ugnay ng SBLGNT at iniiwasang iayon ang teksto sa ibang tradisyon ng manuskrito.
- source_word: τὸ βάπτισμα ὃ ἐγὼ βαπτίζομαι βαπτισθῆναι
  choice: mabautismuhan sa bautismong pinagdaraanan ko
  rationale: Pinananatili ng “mabautismuhan” at “bautismo” ang sentrong talinghaga at kaugnayang leksikal. Ginamit ang natural na “pinagdaraanan ko” sa ikalawang sugnay sapagkat magiging labis na alanganin sa Tagalog ang literal na pag-uulit ng pasibong anyo; nililinaw sa talababa ang anyo ng Griyego.
theological_decisions:
- issue: Matalinghagang gamit ng “kopa” at “bautismo”
  choice: Panatilihin sa pangunahing teksto ang dalawang talinghaga, nang hindi tahasang tinutumbasan ng pagdurusa, kamatayan, o poot ng Diyos.
  alternative: Isalin nang tuwiran bilang “danasin ang pagdurusang daranasin ko” o katulad na paliwanag.
  rationale: Itinuturo ng konteksto ang nalalapit na pagdurusa ni Jesus, ngunit hindi ito lubos na ipinaliliwanag ng mismong talata. Ang pagpapanatili sa mga talinghaga ay nag-iingat sa lawak at tensiyong teolohikal ng orihinal.
- issue: Pag-uulit ng βάπτισμα at βαπτίζω
  choice: Panatilihin ang “bautismo/mabautismuhan,” ngunit gawing likas sa Tagalog ang pantulong na paglalarawan bilang “pinagdaraanan ko.”
  alternative: Gamitin ang literal ngunit alanganing “mabautismuhan sa bautismong ibinabautismo sa akin.”
  rationale: Ipinagsasama nito ang pagkakakilanlan ng talinghaga at malinaw na modernong Tagalog. Ang talababa ang nagpapaalam sa mambabasa tungkol sa higit na mahigpit na pag-uulit sa Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “ninyo/ninyong” para sa maramihang kausap at ang “kopa” upang mapanatili ang pamilyar na rehistrong biblikal. Iniwasan ang sobrang literal na pasibong pag-uulit na hindi likas sa Tagalog, habang pinanatili ang mahalagang talinghaga at ipinaliwanag ang anyong Griyego sa talababa.
