  text: οἱ δὲ εἶπαν αὐτῷ· Δὸς ἡμῖν ἵνα εἷς ⸂σου ἐκ δεξιῶν⸃ καὶ εἷς ἐξ ⸀ἀριστερῶν καθίσωμεν ἐν τῇ δόξῃ σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/037.yaml
  text: They said to him, “Grant to us that one of us may sit at your right and one at your left in your glory.”
translation:
  language: tl
  text: Sinabi nila sa kanya, “Ipagkaloob mo sa amin na makaupo ang isa sa amin sa kanan mo at ang isa naman sa kaliwa mo sa iyong kaluwalhatian.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δὸς ἡμῖν
  choice: Ipagkaloob mo sa amin
  rationale: Pinananatili ang tuwirang pakiusap at ang diwa ng pagbibigay o pagkakaloob, sa natural at marangal na Tagalog.
- source_word: εἷς ... καὶ εἷς
  choice: ang isa sa amin ... at ang isa naman
  rationale: Nililinaw ng konteksto at ng pangmaramihang pandiwang καθίσωμεν na silang dalawang nagsasalita ang tinutukoy, gaya ng hayag sa Ingles na consultation layer.
- source_word: ἐκ δεξιῶν ... ἐξ ἀριστερῶν
  choice: sa kanan mo ... sa kaliwa mo
  rationale: Karaniwang modernong Tagalog para sa mga puwesto sa magkabilang panig; hindi dinaragdagan ang teksto ng paliwanag tungkol sa ranggo.
- source_word: ἐν τῇ δόξῃ σου
  choice: sa iyong kaluwalhatian
  rationale: Ang 'kaluwalhatian' ay tumpak at kinikilalang salin ng δόξα, habang pinananatili ang posibleng saklaw nitong maharlika at eskatolohikal.
theological_decisions:
- issue: Kahulugan ng pag-upo sa kanan at kaliwa
  choice: Pinanatili bilang mga puwesto 'sa kanan' at 'sa kaliwa' nang walang dagdag na interpretasyon.
  alternative: Isalin bilang mga puwesto ng pinakamataas na karangalan o kapangyarihan.
  rationale: Ipinahihiwatig ng konteksto ang karangalan, ngunit hindi iyon tahasang sinasabi sa talata; iniiwasang lutasin sa salin ang teolohikal at naratibong pahiwatig.
- issue: Saklaw ng 'kaluwalhatian'
  choice: kaluwalhatian
  alternative: kaharian o paghahari
  rationale: δόξα ang nasa Griyego, hindi βασιλεία; pinananatili ang sariling termino at ang ambiguwidad nito.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang 'makaupo' para sa idiomatikong pagpapahayag ng hinihiling na pahintulot o pagkakaloob, at iniwasan ang labis na pormal o makalumang ayos.
