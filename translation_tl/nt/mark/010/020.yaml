  yaml_path: translation/nt/mark/010/020.yaml
  text: And he said to him, “Teacher, I have kept all these things from my youth.”
translation:
  language: tl
  text: Sinabi niya sa kanya, “Guro, tinupad ko na ang lahat ng iyan mula pa sa aking kabataan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφη
  choice: Sinabi
  rationale: Karaniwang pandiwa ito sa pagsasalaysay ng tuwirang pananalita. Likas at sapat na tapat ang “Sinabi” sa kontekstong ito.
- source_word: Διδάσκαλε
  choice: Guro
  rationale: Ang bokatibong anyo ng διδάσκαλος ay tumutukoy sa isang nagtuturo. Tuwiran at natural sa modernong Tagalog ang “Guro” at hindi ito nagdaragdag ng diwa ng kapangyarihang maaaring ipahiwatig ng “Panginoon” o “Maestro.”
- source_word: ταῦτα πάντα
  choice: ang lahat ng iyan
  rationale: Tumutukoy ito sa lahat ng utos na kababanggit lamang. Natural sa Tagalog ang “lahat ng iyan” at malinaw ang saklaw ng panghalip.
- source_word: ἐφυλαξάμην
  choice: tinupad ko na
  rationale: Sa konteksto ng mga utos, maaaring mangahulugan ang φυλάσσω ng pag-iingat, pagsunod, o pagtupad. Ang “tinupad ko na” ay likas na Tagalog at inilalahad ang pag-aangkin niyang sinunod niya ang mga iyon hanggang sa kasalukuyang sandali.
- source_word: ἐκ νεότητός μου
  choice: mula pa sa aking kabataan
  rationale: Ang ἐκ na may temporal na henitibo ay nagsasaad ng panimulang panahon. Pinananatili ng “mula pa sa aking kabataan” ang saklaw ng νεότης nang hindi ito ginagawang mas tiyak na “pagkabata.”
- source_word: ὁ δὲ
  choice: Sinabi niya
  rationale: Banayad na pang-ugnay sa salaysay ang δέ. Hindi kailangang tumbasan ng tahasang “ngunit” dahil walang matinding pagsalungat dito; maayos sa Tagalog ang pagpapatuloy sa pamamagitan ng “Sinabi niya.”
