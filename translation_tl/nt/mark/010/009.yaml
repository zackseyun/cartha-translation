  text: ὃ οὖν ὁ θεὸς συνέζευξεν ἄνθρωπος μὴ χωριζέτω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/009.yaml
  text: Therefore[a], what God has joined together, man must not separate.
translation:
  language: tl
  text: Kaya, ang pinagbuklod ng Diyos ay huwag paghiwalayin ng sinuman.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃ
  choice: ang
  rationale: Kasama ng pandiwaring ‘pinagbuklod,’ likas na ipinapahayag sa Tagalog ng ‘ang pinagbuklod’ ang bagay o pagsasamang tinutukoy ng neuter singular relative pronoun.
- source_word: οὖν
  choice: Kaya
  rationale: Malinaw at natural na ipinahihiwatig ang kongklusyon mula sa naunang sinabi tungkol sa layunin ng Diyos sa pag-aasawa.
- source_word: ὁ θεὸς
  choice: Diyos
  rationale: Tuwirang katumbas ng tahasang simuno sa Griyego.
- source_word: συνέζευξεν
  choice: pinagbuklod
  rationale: Ipinahihiwatig ang pagkakabit o pagsasama ng dalawa bilang isang ugnayan; natural at marangal ito sa konteksto ng pag-aasawa at pinananatili ang Diyos bilang gumagawa.
- source_word: ἄνθρωπος
  choice: sinuman
  rationale: Ang anarthrous singular na ἄνθρωπος ay ginagamit nang pangkalahatan, kaya ang ‘sinuman’ ay malinaw na tumutukoy sa walang sinumang tao, hindi lamang sa lalaki.
- source_word: μὴ χωριζέτω
  choice: huwag paghiwalayin
  rationale: Natural na Tagalog na pautos na pagbabawal; pinananatili nito ang aktibong diwa na huwag paghiwalayin ang pinagbuklod.
theological_decisions:
- issue: Pangkalahatang saklaw ng ἄνθρωπος sa kasabihan tungkol sa pag-aasawa
  choice: sinuman
  alternative: tao / lalaki
  rationale: Pangkalahatan ang gamit ng ἄνθρωπος dito. Ang ‘sinuman’ ay tumpak na naghahatid na walang tao ang dapat maghiwalay, nang hindi nililimitahan ang pagbabawal sa mga lalaki.
- issue: Ang Diyos ang tagapagbuklod sa pag-aasawa
  choice: ang pinagbuklod ng Diyos
  alternative: ang pinagsama ng Diyos
  rationale: Pinananatili ang tahasang pagkilos ng Diyos at ang matibay na diwa ng συζεύγνυμι, nang hindi dinaragdagan ang teksto ng paliwanag tungkol sa tiyak na mekanismo o saklaw ng pagkakabuklod.
translation_notes:
  register: Modernong Filipino Tagalog na maikli, dignipikado, at madaling maunawaan. Ginamit ang ‘pinagbuklod’ bilang natural na pananalita sa pag-aasawa at ‘sinuman’ upang malinaw na maipahayag ang pangkalahatang sangkatauhang saklaw ng ἄνθρωπος.
