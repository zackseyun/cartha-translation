  text: καὶ ὃς ⸀ἂν θέλῃ ⸂ἐν ὑμῖν εἶναι⸃ πρῶτος, ἔσται πάντων δοῦλος·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/044.yaml
  text: And whoever wants to be first among you will be the servant of all[a].
translation:
  language: tl
  text: At ang sinumang nagnanais na maging una sa inyo ay magiging alipin ng lahat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lingkod ng lahat.” Ang salitang Griyego na doulos ay mas matindi kaysa sa salitang isinaling “lingkod” sa naunang talata; kaya “alipin” ang ginamit dito upang mapanatili ang kaibahan.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς ἂν θέλῃ
  choice: sinumang nagnanais
  rationale: Ang panghalip na may ἄν at pasakaling pandiwa ay nagsasaad ng pangkalahatan at di-tiyak na kondisyon. Likas at malinaw sa modernong Tagalog ang “sinumang nagnanais,” at napapanatili nito ang kusang paghahangad na ipinahihiwatig ng θέλῃ.
- source_word: ἐν ὑμῖν
  choice: sa inyo
  rationale: Sa konteksto ng katayuan sa pangkat ng mga alagad, ang parirala ay tumutukoy sa pagiging una sa kanilang hanay. Natural sa Tagalog ang “maging una sa inyo.”
- source_word: πρῶτος
  choice: una
  rationale: Tuwirang ipinahahayag ng “una” ang ranggo o pangunguna at pinananatili ang pagkakaugnay nito sa usapin ng kadakilaan sa konteksto.
- source_word: ἔσται
  choice: ay magiging
  rationale: Pinananatili ng anyong panghinaharap ang pormal na anyo ng Griyego. Bagaman may puwersang nag-uutos sa konteksto, hindi ito tahasang ginawang “dapat maging.”
- source_word: πάντων
  choice: ng lahat
  rationale: Maikli at natural itong katumbas ng genitibong nagpapakita ng pagpapasakop sa lahat, at pinananatili nito ang pangkalahatang saklaw.
- source_word: δοῦλος
  choice: alipin
  rationale: Mas matindi ang δοῦλος kaysa διάκονος sa naunang talata. Ang “alipin” ay nagpapanatili sa ideya ng ganap na pagpapasakop at mababang katayuan, sa halip na gawing pareho ang dalawang magkaibang termino.
theological_decisions:
- issue: Pagpapakahulugan sa δοῦλος sa turo tungkol sa pagiging alagad
  choice: alipin
  alternative: lingkod
  rationale: 'Pinatitindi ng talata ang pagpapakumbaba: διάκονος sa talata 43 at δοῦλος sa talata 44. Pinananatili ng “alipin” ang mas matinding salita at ang tensiyon ng ganap na pagpapasakop, nang hindi nilalapatan ng denominasyonal na paliwanag.'
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “nagnanais” sa halip na mas kolokyal na “gustong” upang bumagay sa dignidad ng teksto nang hindi nagiging lipas o labis na pormal.
