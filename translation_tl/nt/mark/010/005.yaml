id: MRK.10.5
reference: Mark 10:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸂ὁ δὲ⸃ Ἰησοῦς εἶπεν αὐτοῖς· Πρὸς τὴν σκληροκαρδίαν ὑμῶν ἔγραψεν ὑμῖν τὴν ἐντολὴν ταύτην·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/005.yaml
  text: But Jesus said to them[c][b][a], “Because of your hardness of heart he wrote this commandment for you.”
translation:
  language: tl
  text: Ngunit sinabi sa kanila ni Jesus, “Dahil sa katigasan ng inyong puso[b], isinulat niya[a] para sa inyo ang utos na ito[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “niya” ay tumutukoy kay Moises, na binanggit sa naunang talata.
    reason: cross_reference
  - marker: b
    text: O, “pagiging matigas ng inyong puso.”
    reason: lexical_alternative
  - marker: c
    text: O, “kautusang ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig nito ang banayad na pagsalungat sa naunang sinabi ng mga kausap ni Jesus.
- source_word: Πρὸς
  choice: Dahil sa
  rationale: Sa kontekstong ito, ipinahihiwatig ng πρός na ang utos ay ibinigay bilang tugon sa kalagayan ng kanilang puso.
- source_word: σκληροκαρδίαν
  choice: katigasan ng inyong puso
  rationale: Pinananatili nito ang malinaw na metapora ng Griyego at ang moral na bigat nito, sa halip na paliitin ang kahulugan tungo lamang sa pagiging matigas ang ulo.
- source_word: ἔγραψεν
  choice: isinulat niya
  rationale: Hindi inuulit sa Griyego ang pangalang Moises; ang ikatlong panauhang isahan ay tumutukoy sa kaniya mula sa naunang talata.
- source_word: ἐντολήν
  choice: utos
  rationale: Natural at malinaw sa makabagong Filipino ang “utos” para sa isang may-awtoridad na tagubilin; maaaring gamitin ang mas pormal na “kautusan.”
- source_word: ταύτην
  choice: na ito
  rationale: Tumutukoy ito sa partikular na utos na pinag-uusapan nang walang dagdag na diin.
theological_decisions:
- issue: Kung tahasang babanggitin si Moises bilang simuno ng “isinulat”
  choice: Panatilihin ang di-tahasang simuno bilang “niya,” na tumutukoy kay Moises sa naunang talata.
  alternative: “isinulat ni Moises”
  rationale: Hindi inuulit ng Griyego ang pangalang Moises. Pinananatili ng “niya” ang daloy ng teksto at iniiwasang magdagdag ng di-nakasulat na diin.
- issue: Kung paano isasalin ang σκληροκαρδία nang hindi pinahihina ang biblikal na larawan
  choice: “katigasan ng inyong puso”
  alternative: “pagiging matigas ng inyong puso” o “katigasan ng ulo”
  rationale: Pinananatili ng napiling salin ang metapora ng puso at ang moral na tensiyon ng orihinal, nang hindi ito nililimitahan sa karaniwang katigasan ng ulo.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Pinanatili ang metapora ng “katigasan ng puso” at ang di-tahasang pagtukoy kay Moises, habang ginamit ang karaniwang “utos” sa pangunahing teksto.
