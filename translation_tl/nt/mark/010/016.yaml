  text: And he took them in his arms and blessed them[b][a], laying his hands on them.
translation:
  language: tl
  text: At kinuha niya sila sa kanyang mga bisig[a] at patuloy niya silang pinagpala[b] habang ipinapatong niya ang kanyang mga kamay sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “niyakap niya sila” o “kinalong niya sila.” Tiyak na tumutukoy ang pandiwang Griyego sa pagkuha sa isang tao sa mga bisig.
    reason: lexical_alternative
  - marker: b
    text: Ang anyo ng pandiwang Griyego ay nagpapahiwatig ng nagpapatuloy o paulit-ulit na pagkilos at maaaring mangahulugang “patuloy niya silang pinagpapala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐναγκαλισάμενος
  choice: kinuha niya sila sa kanyang mga bisig
  rationale: Tiyak na tumutukoy ang pandiwa sa pagkandili o pagkuha sa isang tao sa mga bisig, hindi lamang sa pangkalahatang pagyakap. Likas sa makabagong Filipino ang parirala at pinananatili nito ang magiliw at kongkretong kilos ni Jesus.
- source_word: κατευλόγει
  choice: patuloy silang pinagpala
  rationale: Ipinahihiwatig ng aspektong imperpektibo ang nagpapatuloy o paulit-ulit na pagkilos. Ang “patuloy” ay malinaw at likas na naihahatid ang nuansang ito nang hindi nagpapasok ng seremonyal na kahulugan.
- source_word: τιθεὶς τὰς χεῖρας ἐπ’ αὐτά
  choice: habang ipinapatong sa kanila ang kanyang mga kamay
  rationale: Inilalarawan ng participial phrase ang kilos na kasabay ng pagpapala. Pinananatili ng salin ang konkretong kilos nang hindi ito binibigyan ng katawagang sakramental o seremonyal.
- source_word: αὐτὰ ... αὐτά
  choice: sila ... sa kanila
  rationale: Tumutukoy ang mga panghalip sa mga bata sa naunang konteksto. Natural sa Filipino ang paggamit ng mga panghalip sa halip na ulitin ang “mga bata.”
- source_word: καὶ
  choice: At
  rationale: Pinananatili ng payak na pang-ugnay ang tuwirang daloy ng salaysay ni Marcos nang hindi nagdaragdag ng tiyak na temporal o lohikal na ugnayan.
theological_decisions:
- issue: Kalikasan ng ginawa ni Jesus sa mga bata
  choice: Panatilihin ang tiyak na mga kilos—pagkuha sa kanila sa kanyang mga bisig, pagpapala, at pagpapatong ng mga kamay—nang walang idinagdag na katawagang sakramental o seremonyal.
  alternative: Niyakap niya sila at binigkas ang isang basbas sa kanila; o pinagpala niya sila sa pamamagitan ng pagpapatong ng mga kamay.
  rationale: Hayagang inilalarawan ng talata ang magiliw na pagtanggap at pagpapala ni Jesus sa mga bata, ngunit hindi nito inuuri ang kilos ayon sa anumang mas huling sistemang pangdoktrina.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga bisig” upang idiin ang pisikal na pagkandili, at “patuloy” upang maipakita ang aspektong imperpektibo ng pandiwa. Iniwasan ang teknikal na katawagang panrelihiyon na wala sa tekstong Griyego.
