id: MRK.10.46
reference: Mark 10:46
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἔρχονται εἰς Ἰεριχώ. καὶ ἐκπορευομένου αὐτοῦ ἀπὸ Ἰεριχὼ καὶ τῶν μαθητῶν αὐτοῦ καὶ ὄχλου ἱκανοῦ ⸀ὁ υἱὸς Τιμαίου Βαρτιμαῖος ⸀τυφλὸς ⸂προσαίτης ἐκάθητο παρὰ τὴν ὁδόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/046.yaml
  text: And they came to Jericho[a]. And as he was going out from Jericho, along with his disciples and a considerable crowd, Bartimaeus, the son of Timaeus, a blind beggar[c][b], was sitting beside the road.
translation:
  language: tl
  text: Dumating sila sa Jerico.[a] At habang lumalabas siya mula sa Jerico, kasama ang kanyang mga alagad at isang malaking pulutong ng mga tao,[b] si Bartimeo—na anak ni Timeo at isang bulag na namamalimos—ay nakaupo sa tabi ng daan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “dumarating sila.” Isa itong makasaysayang pangkasalukuyan na karaniwang ginagamit sa masiglang pagsasalaysay; isinalin dito sa pangnagdaan para sa natural na Tagalog.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “maraming tao.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “sa gilid ng daan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: Dumating sila
  rationale: Nasa pangkasalukuyang anyo ang pandiwang Griyego ngunit ginagamit ito bilang makasaysayang pangkasalukuyan sa pagsasalaysay. Mas natural sa makabagong Tagalog ang pangnagdaan na “Dumating sila.”
- source_word: ἐκπορευομένου αὐτοῦ
  choice: habang lumalabas siya
  rationale: Ipinahihiwatig ng genitive absolute na kasabay ng pangunahing pangyayari ang kanyang paglabas; pinananatili ng “habang lumalabas siya” ang aspektong nagpapatuloy at ang larawan ng pagkilos.
- source_word: ὄχλου ἱκανοῦ
  choice: isang malaking pulutong ng mga tao
  rationale: Sa kontekstong ito, ipinahihiwatig ng ἱκανός na marami o malaki ang bilang. Malinaw na inilalarawan ng parirala ang isang malaking crowd nang hindi pinalalabis ang diwa.
- source_word: ὁ υἱὸς Τιμαίου Βαρτιμαῖος
  choice: si Bartimeo—na anak ni Timeo
  rationale: Pinananatili ang pangalang Bartimeo at ang paliwanag ng teksto na siya ay anak ni Timeo. Ang ayos at bantas ay ginawang natural at malinaw sa Tagalog.
- source_word: τυφλὸς
  choice: bulag
  rationale: Tuwiran at karaniwang katumbas sa Tagalog, nang walang pagpapalambot o pagdaragdag sa kahulugan.
- source_word: προσαίτης
  choice: namamalimos
  rationale: Likas at madaling maunawaang paglalarawan ito sa isang taong humihingi ng limos. Mas magalang at mas natural sa pangungusap kaysa sa paggamit ng “pulubi” bilang pantukoy sa pagkatao.
- source_word: παρὰ τὴν ὁδόν
  choice: sa tabi ng daan
  rationale: Tumpak nitong ipinapahayag ang posisyon sa gilid o tabi ng daan at natural ito sa makabagong Tagalog.
- source_word: Ἰεριχώ
  choice: Jerico
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalan ng lugar.
theological_decisions:
- issue: Pagkakakilanlan kay Bartimeo sa salaysay
  choice: Panatilihin sa pangunahing teksto ang pangalang “Bartimeo” at ang paliwanag na “anak ni Timeo.”
  alternative: Banggitin lamang ang “anak ni Timeo,” o banggitin lamang ang “Bartimeo.”
  rationale: Kapwa ibinibigay ng tekstong Griyego ang pangalan at ang paliwanag nito. Ang pagpapanatili sa dalawa ay hindi nagbabawas ng detalye at hindi nagpapasok ng interpretasyong wala sa pinagmulan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog ang ginamit. Pinanatili ang galaw at pagkakasunod-sunod ng salaysay, habang iniwasan ang labis na literal na ayos na magiging asiwa sa karaniwang mambabasa.
