  text: ἀπὸ δὲ ἀρχῆς κτίσεως ἄρσεν καὶ θῆλυ ἐποίησεν ⸀αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/006.yaml
  text: But from the beginning of creation[b][a], he made them male and female.
translation:
  language: tl
  text: Ngunit mula pa sa pasimula ng paglikha, “ginawa niya silang lalaki at babae.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nilikha niya silang lalaki at babae.” “Ginawa” ang pandiwang ginamit sa Griyego, ngunit ipinakikita ng “nilikha” ang kaugnayan nito sa salaysay ng Genesis.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ δὲ ἀρχῆς κτίσεως
  choice: Ngunit mula pa sa pasimula ng paglikha
  rationale: Ipinahahayag ng ἀπό ang panimulang punto sa panahon, at ang δέ ay panalungat sa naunang pagtalakay. Natural sa modernong Tagalog ang “mula pa sa pasimula ng paglikha” habang pinananatili ang ugnayan ng ἀρχῆς at κτίσεως.
- source_word: ἄρσεν καὶ θῆλυ
  choice: lalaki at babae
  rationale: Sa karaniwang modernong Tagalog, ito ang natural at marangal na pares para sa mga terminong tumutukoy sa kasariang nilikha. Ang “lalaking kasarian at babaeng kasarian” ay mas literal ngunit labis na teknikal sa kontekstong ito.
- source_word: ἐποίησεν
  choice: ginawa niya
  rationale: Tuwirang sinasalamin ng “ginawa” ang karaniwang kahulugan ng ποιέω. Bagaman ang “nilikha” ay angkop sa konteksto ng Genesis, higit nitong ipinapakahulugan ang pandiwa kaysa sa mismong anyo rito.
- source_word: αὐτούς
  choice: sila
  rationale: Ang hulaping panghalip sa “ginawa niya silang” ay natural na katumbas ng maramihang αὐτούς at hindi nagdaragdag ng diin gaya ng “silang dalawa.”
theological_decisions:
- issue: Pagpapahayag sa mga terminong ἄρσεν at θῆλυ sa sipi mula sa Genesis
  choice: lalaki at babae
  alternative: lalaking kasarian at babaeng kasarian
  rationale: Pinananatili ang tambalang tumutukoy sa pagkakaibang pangkasarian sa salaysay ng paglikha, nang hindi ito ginagawang teknikal o nililipat sa ibang kategoryang panlipunan.
- issue: Di-tahasang banal na simuno
  choice: ginawa niya silang
  alternative: ginawa sila ng Diyos
  rationale: Ikatlong panauhang isahan ang pandiwa at nauunawaan ang simuno mula sa konteksto. Ang “niya” ay nagpapanatili sa di-tahasang anyo; ang tahasang pagbanggit sa Diyos ay magiging paliwanag na idinagdag sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “pasimula” upang bumagay sa solemne ngunit madaling maunawaang himig ng sipi sa Kasulatan; iniwasan ang sobrang teknikal na pananalita.
