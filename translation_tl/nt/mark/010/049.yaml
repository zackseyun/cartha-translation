id: MRK.10.49
reference: Mark 10:49
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ στὰς ὁ Ἰησοῦς εἶπεν· ⸂Φωνήσατε αὐτόν⸃. καὶ φωνοῦσι τὸν τυφλὸν λέγοντες αὐτῷ· Θάρσει, ⸀ἔγειρε, φωνεῖ σε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/049.yaml
  text: And Jesus stopped and said[a], “Call him.” And they called the blind man, saying to him, “Take courage; get up[b], he is calling you.”
translation:
  language: tl
  text: Huminto[a] si Jesus at sinabi, “Tawagin ninyo siya.” At tinawag nila ang lalaking bulag at sinabi sa kanya, “Lakasan mo ang loob mo! Tumayo ka; tinatawag ka niya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “tumayo”; sa kontekstong ito, “huminto” o “tumigil sa paglakad.”
    reason: lexical_alternative
lexical_decisions:
- source_word: στὰς
  choice: Huminto
  rationale: Bagaman anyong pandiwari ito na literal na tumutukoy sa pagtayo, sa daloy ng salaysay ay ipinahihiwatig nitong itinigil ni Jesus ang kanyang paglakad. Likas at malinaw sa makabagong Tagalog ang “huminto.”
- source_word: Φωνήσατε αὐτόν
  choice: Tawagin ninyo siya
  rationale: Ang φωνέω rito ay nangangahulugang tawagin o papuntahin ang isang tao. Pinananatili ng “tawagin” ang tuwiran at payak na utos.
- source_word: φωνοῦσι
  choice: tinawag nila
  rationale: Inuulit ang salitang-ugat na “tawag” upang maipakita ang pag-uugnay nito sa naunang utos ni Jesus.
- source_word: τὸν τυφλὸν
  choice: ang lalaking bulag
  rationale: Ginagamit dito ang pang-uri bilang pangngalan at tumutukoy sa isang lalaki. Ang “lalaking bulag” ay natural at magalang sa kasalukuyang Tagalog.
- source_word: Θάρσει
  choice: Lakasan mo ang loob mo
  rationale: Ang pautos ay nagbibigay ng tapang at katiyakan. Karaniwan, malinaw, at angkop sa Tagalog ang pariralang ito.
- source_word: ἔγειρε
  choice: Tumayo ka
  rationale: Ang pautos ay humihimok sa kanya na bumangon mula sa kanyang kinalalagyan. Ang “tumayo ka” ay tuwiran at natural sa tagpo.
- source_word: φωνεῖ σε
  choice: tinatawag ka niya
  rationale: Ang aspektong nagaganap ng pandiwa ay likas na naipapahayag sa Tagalog sa “tinatawag,” at ipinakikita nito ang kasalukuyan at agarang paanyaya ni Jesus.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino Tagalog na payak ngunit marangal. Pinanatili ang tatlong paglitaw ng φωνέω sa pamamagitan ng magkakaugnay na anyo ng “tawag,” at ginamit ang “At” upang sundan ang paulit-ulit na καί sa salaysay.
