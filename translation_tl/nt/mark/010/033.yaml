id: MRK.10.33
reference: Mark 10:33
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτι Ἰδοὺ ἀναβαίνομεν εἰς Ἱεροσόλυμα, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδοθήσεται τοῖς ἀρχιερεῦσιν καὶ ⸀τοῖς γραμματεῦσιν, καὶ κατακρινοῦσιν αὐτὸν θανάτῳ καὶ παραδώσουσιν αὐτὸν τοῖς ἔθνεσιν
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/033.yaml
  text: that[a], ‘Look, we are going up to Jerusalem, and the Son of Man will be handed over to the chief priests and the scribes[b], and they will condemn him to death and hand him over to the Gentiles.’
translation:
  language: tl
  text: na, “Tingnan ninyo, umaakyat tayo sa Jerusalem, at ang Anak ng Tao ay ibibigay[a] sa mga punong pari at sa mga eskriba, at hahatulan nila siya ng kamatayan at ibibigay nila siya sa mga Hentil.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isusuko” sa dalawang paglitaw ng pandiwang ito.
    reason: lexical_alternative
  - marker: b
    text: O “sa mga bansa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: na sinasabi
  rationale: Ipinakikitang kasunod ito ng pandiwang nagsasaad ng pagsasalita sa naunang talata at ipinakikilala ang mismong nilalaman ng sinabi ni Jesus; kailangan ang bahagyang pag-uugnay upang maging likas sa Filipino.
- source_word: Ἰδοὺ
  choice: Tingnan ninyo
  rationale: Likas at tuwirang panawag-pansin sa modernong Filipino, habang pinananatili ang mariing puwersa ng diskursong pananda.
- source_word: ἀναβαίνομεν
  choice: umaahon tayo
  rationale: Pinananatili ang ideya ng pag-akyat patungong Jerusalem at ang kasalukuyang kilos ng paglalakbay.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Itinatag na literal na salin na nagpapanatili sa katawagan ni Jesus sa sarili at sa mga alusyong teolohikal nito.
- source_word: παραδοθήσεται / παραδώσουσιν
  choice: ibibigay / ibibigay
  rationale: Pinananatili ang pag-uulit ng iisang pandiwang Griyego at ang sunod-sunod na paglilipat kay Jesus sa kapangyarihan ng iba, nang hindi ito agad nililimitahan sa kahulugang 'ipagkakanulo.'
- source_word: τοῖς ἀρχιερεῦσιν
  choice: sa mga punong pari
  rationale: Karaniwan at tumpak na tawag sa pangkat ng mga nangungunang awtoridad na makasaserdote.
- source_word: τοῖς γραμματεῦσιν
  choice: sa mga tagapagturo ng Kautusan
  rationale: Mas malinaw sa ordinaryong modernong mambabasa kaysa 'mga eskriba' at ipinahahayag ang kanilang kinikilalang tungkulin sa kontekstong Judio.
- source_word: κατακρινοῦσιν αὐτὸν θανάτῳ
  choice: Hahatulan nila siya ng kamatayan
  rationale: Pinananatili ang pormal at hudisyal na diwa ng paghatol at ang parusang kamatayan.
- source_word: τοῖς ἔθνεσιν
  choice: sa mga Hentil
  rationale: Sa konteksto, tumutukoy ito sa mga di-Judiong awtoridad na pagkakalooban kay Jesus, hindi lamang sa mga bansa bilang mga pampolitikang yunit.
theological_decisions:
- issue: Paglilipat sa ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  alternative: ang Taong Anak / ang Makataong Isa
  rationale: Pinananatili ng tradisyonal at literal na anyo ang mismong pananalita, ang posibleng alusyon sa Daniel, at ang kristolohikal na katawagan nang hindi ito pinapaliwanag sa loob ng teksto.
- issue: Paglilipat sa τοῖς ἔθνεσιν
  choice: sa mga Hentil
  alternative: sa mga bansa
  rationale: Ang salaysay ng pagdurusa ay tumutukoy sa paglilipat mula sa mga pinunong Judio tungo sa mga di-Judiong tagapamahala; pinananatili nito ang makasaysayang pagkakaiba nang walang dagdag na doktrinal na pagpapakahulugan.
- issue: Saklaw ng παραδίδωμι
  choice: ibibigay
  alternative: ipagkakanulo / isusuko
  rationale: Ang 'ibibigay' ay sapat na malawak upang saklawin ang pagkakanulo at paglalagay sa kapangyarihan ng iba, ngunit hindi nagpapasya rito kung alin ang nangingibabaw na diwa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “tagapagturo ng Kautusan” para sa γραμματεῖς upang maging malinaw sa karaniwang mambabasa. Pinanatili ang pag-uulit ng “ibibigay” para sa dalawang anyo ng παραδίδωμι. Ang pang-ugnay na “na sinasabi” ay umaasa sa sintaks ng naunang talata, gaya ng ὅτι sa Griyego.
