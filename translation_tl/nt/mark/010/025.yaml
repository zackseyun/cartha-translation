id: MRK.10.25
reference: Mark 10:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εὐκοπώτερόν ἐστιν κάμηλον διὰ ⸂τῆς τρυμαλιᾶς τῆς⸃ ῥαφίδος ⸀διελθεῖν ἢ πλούσιον εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/025.yaml
  text: It is easier for a camel to go through the eye of a needle than for a rich man to enter the kingdom of God[a][b][c].
translation:
  language: tl
  text: Mas madali pang makadaan ang isang kamelyo sa butas ng karayom[a][b] kaysa makapasok ang isang mayaman sa kaharian ng Diyos.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “sa butas ng isang karayom.”'
    reason: lexical_alternative
  - marker: b
    text: Iminungkahi ng ilan ang “lubid” sa halip na “kamelyo,” ngunit “kamelyo” ang mababasa sa tekstong Griyego rito.
    reason: alternative_reading
  - marker: c
    text: Panlalaking isahan ang anyong Griyego para sa “mayaman,” ngunit kumakatawan ito sa sinumang mayaman.
    reason: cultural_note
lexical_decisions:
- source_word: εὐκοπώτερόν
  choice: Mas madali pa
  rationale: Likas na paghahambing sa Filipino na pinananatili ang matinding paghahambing ng Griyego.
- source_word: κάμηλον
  choice: isang kamelyo
  rationale: Ang salitang Griyego ay malinaw na tumutukoy sa kamelyo; pinananatili nito ang sadyang matinding larawan.
- source_word: διὰ τῆς τρυμαλιᾶς τῆς ῥαφίδος
  choice: sa butas ng karayom
  rationale: Tumutukoy ito sa maliit na butas ng karayom na nilulusutan ng sinulid, hindi sa isang pintuang-bayan.
- source_word: διελθεῖν
  choice: makadaan
  rationale: Maikli at natural na salin para sa pagdaan sa isang siwang o butas.
- source_word: πλούσιον
  choice: isang mayaman
  rationale: Bagaman panlalaking isahan ang anyong Griyego, natural at may pangkalahatang bisa sa Filipino ang substantibong “isang mayaman” nang hindi nililimitahan ang kasabihan sa mga lalaki.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: sa kaharian ng Diyos
  rationale: Itinataguyod ang sentral na pariralang pang-Ebanghelyo at natural itong kaugnay ng “makapasok.”
- source_word: εἰσελθεῖν
  choice: makapasok
  rationale: Ang anyong maka- ay angkop sa paghahambing hinggil sa posibilidad o hirap ng pagpasok.
theological_decisions:
- issue: Pag-unawa sa larawan ng kamelyo at butas ng karayom
  choice: Panatilihin ang literal at matinding larawan ng kamelyo at karayom.
  alternative: Ipaliwanag ito bilang diumano’y maliit na “Pintuan ng Karayom,” o palitan ang kamelyo ng lubid.
  rationale: Ang tekstong Griyego mismo ay naghaharap ng matinding larawan ng imposibilidad. Hindi dapat pahinain ng salin ang tensiyon o magpasok ng tradisyong hindi matitiyak mula sa teksto.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang “Mas madali pa” upang maging buhay ang paghahambing, at “isang mayaman” upang mapanatili ang isahan at kinatawang diwa nang hindi maging pilit ang pagtukoy sa kasarian.
