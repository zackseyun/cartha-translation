  naturalness: Natural ang pangkalahatang register, ngunit mas malinaw at likas ang “patuloy na sinasaway” at “lalo pang sumisigaw” para sa nagpapatuloy na tagpo. Ang magalang na “po kayo” ay katanggap-tanggap na modernong Filipino sa pagtawag sa iisang taong iginagalang.
  terminology: Wastong salin ang “Anak ni David” at hindi dapat palitan ng “Mesiyas” sa pangunahing teksto. Sa talababa, mas tumpak ang “titulong panghari at mesiyaniko” kaysa “maharlika at mesiyanikong titulo,” dahil ang tinutukoy ay Davidikong paghahari, hindi lamang pagiging marangal.
