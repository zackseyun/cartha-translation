  text: καὶ ἐπετίμων αὐτῷ πολλοὶ ἵνα σιωπήσῃ· ὁ δὲ πολλῷ μᾶλλον ἔκραζεν· Υἱὲ Δαυίδ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/048.yaml
  text: And many were rebuking him so that he would be silent[a], but he was crying out all the more, “Son of David, have mercy on me!”
translation:
  language: tl
  text: At marami ang patuloy na sinasaway siya upang tumahimik siya, ngunit lalo pa siyang sumisigaw, “Anak ni David, maawa po kayo sa akin!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Anak ni David” ay isang titulong panghari at mesiyaniko. Maaari sanang ipahayag ang diwa nito bilang “Mesiyas,” ngunit pinanatili rito ang mismong pananalita ng Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμων
  choice: ang sumaway
  rationale: Ipinapahayag ng “sumaway” ang mariing pagpigil o pagsita, at sa konstruksiyong “marami ang sumaway” ay natural na naihahatid ang patuloy o paulit-ulit na kilos ng imperpektong pandiwa.
- source_word: πολλοὶ
  choice: marami
  rationale: Tuwirang isinasalin ang pang-uring ginamit bilang pangngalan at hindi ipinapalit ang mas tiyak na “karamihan” o “mga tao,” na wala sa Griyego.
- source_word: ἵνα σιωπήσῃ
  choice: upang tumahimik siya
  rationale: Pinananatili nito ang layunin ng pagsaway at likas itong pakinggan sa makabagong Tagalog.
- source_word: πολλῷ μᾶλλον
  choice: lalo pa
  rationale: Natural na katumbas ito ng paghahambing na idyoma at hindi nito idinaragdag na mas malakas ang sigaw, na hindi tahasang sinasabi ng Griyego.
- source_word: ἔκραζεν
  choice: siyang sumigaw
  rationale: Ipinahihiwatig ng konteksto at “lalo pa” ang nagpapatuloy na mariing pagsigaw; malinaw at natural ang “sumigaw” sa Tagalog.
- source_word: Υἱὲ Δαυίδ
  choice: Anak ni David
  rationale: Tuwirang pinananatili ang maharlika at mesiyanikong titulo sa halip na palitan ito ng interpretasyong “Mesiyas.”
- source_word: ἐλέησόν με
  choice: maawa po kayo sa akin
  rationale: Natural at marangal na pakiusap ito sa Tagalog. Ang “po kayo” ay nagpapahayag ng paggalang sa tuwirang pakikipag-usap kay Jesus nang hindi binabago ang kahulugan ng singular na Griyego.
theological_decisions:
- issue: Mesiyanikong kahulugan ng “Anak ni David”
  choice: Panatilihin ang titulong “Anak ni David.”
  alternative: “Mesiyas”
  rationale: Tahasan sa Griyego ang Υἱὲ Δαυίδ. Ang pagsasalin sa titulo mismo ay nagpapanatili sa orihinal na pananalita at hindi ipinapalit ang paliwanag sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino Tagalog. Ginamit ang “po kayo” bilang likas na anyo ng magalang na pakikiusap kay Jesus; hindi ito nagpapahiwatig ng maramihang kausap.
