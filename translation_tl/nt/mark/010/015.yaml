  text: ἀμὴν λέγω ὑμῖν, ὃς ⸀ἂν μὴ δέξηται τὴν βασιλείαν τοῦ θεοῦ ὡς παιδίον, οὐ μὴ εἰσέλθῃ εἰς αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/015.yaml
  text: Truly I say to you[a], whoever does not receive the kingdom of God like a child will certainly not enter it.
translation:
  language: tl
  text: '“Tunay na sinasabi ko sa inyo: ang sinumang hindi tumanggap sa kaharian ng Diyos na gaya ng isang bata[a] ay tiyak na hindi makapapasok doon.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bilang isang bata.” Maaaring tumukoy ang parirala sa pagpapakumbaba, pagtitiwala, o pag-asa ng isang bata sa iba, ngunit hindi tinutukoy ng Griyego kung alin sa mga ito ang ibig sabihin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Tunay
  rationale: Ipinahahayag nito ang taimtim at may-awtoridad na pananalita ni Jesus. Likas at malinaw sa modernong Filipino ang “Tunay” nang hindi pinananatiling di-isinalin ang anyong Semitiko.
- source_word: λέγω ὑμῖν
  choice: sinasabi ko sa inyo
  rationale: Tuwirang isinasalin ang pandiwa at panghalip habang nananatiling natural sa Filipino.
- source_word: ὃς ἂν
  choice: ang sinuman
  rationale: Inihahatid nito ang di-tiyak at pangkalahatang diwa ng pariralang Griyego.
- source_word: μὴ δέξηται
  choice: hindi tumanggap
  rationale: Pinananatili ng “tumanggap” ang larawan ng pagtanggap sa kaharian sa halip na aktibong pagkamit nito.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: kaharian ng Diyos
  rationale: Ito ang karaniwan at angkop na salin sa mga Sinoptikong Ebanghelyo at naipahihiwatig kapuwa ang paghahari at ang sakop nito.
- source_word: ὡς παιδίον
  choice: na gaya ng isang bata
  rationale: Pinananatili ang paghahambing at hindi itinatakda kung aling katangian ng bata ang tinutukoy.
- source_word: οὐ μὴ εἰσέλθῃ
  choice: ay tiyak na hindi makapapasok
  rationale: Ipinahahayag ng “tiyak na hindi” ang mariing pagtanggi ng οὐ μή, at natural sa Filipino ang “makapapasok” para sa pagpasok sa kaharian.
- source_word: εἰς αὐτήν
  choice: doon
  rationale: Malinaw na tumutukoy ito sa kaharian ng Diyos at mas natural sa Filipino kaysa sa literal na “papasok dito/rito” matapos banggitin ang kaharian.
theological_decisions:
- issue: Kahulugan ng pagtanggap sa kaharian “na gaya ng isang bata”
  choice: Panatilihin ang paghahambing nang hindi tinutukoy ang eksaktong katangian ng bata.
  alternative: Ipaliwanag ito bilang pagtanggap na may pagpapakumbaba, pagtitiwala, o pag-asa sa iba.
  rationale: Hindi tinutukoy ng Griyego kung pagpapakumbaba, pagtitiwala, pag-asa sa iba, o ibang katangian ang pangunahing diwa. Pinananatili ng salin ang sadyang pagiging bukas ng pahayag.
translation_notes:
  register: Modernong Filipino na may marangal at malinaw na himig. Ginamit ang “Tunay na sinasabi ko sa inyo” upang mapanatili ang taimtim na pormula, at “na gaya ng isang bata” upang mapanatili ang tunay na kalabuan ng paghahambing.
