  yaml_path: translation/nt/mark/010/041.yaml
  text: And when the ten heard it[a], they began to be indignant with James and John.
translation:
  language: tl
  text: Nang marinig ito ng sampu, nagsimula silang magalit kina Santiago at Juan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tungkol kina Santiago at Juan” o “dahil kina Santiago at Juan.” Maaaring tukuyin ng pang-ukol sa Griyego ang pinagtutuunan o ang dahilan ng kanilang galit.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Nang
  rationale: Sa Filipino, likas na pinagsasama ng sugnay na “Nang marinig” ang pang-ugnay at ang naunang kilos ng aorist participle; malinaw nitong inuugnay ang reaksiyon sa kanilang narinig nang hindi nagdaragdag ng hiwalay na temporal na detalye.
- source_word: ἀκούσαντες
  choice: marinig ito
  rationale: Ang aorist participle ay ginawang likas na temporal na sugnay sa Filipino. Ang “ito” ay hindi tahasang nasa Griyego ngunit likas na tumutukoy sa naunang sinabi o pangyayari sa konteksto.
- source_word: οἱ δέκα
  choice: ang sampu
  rationale: Pinananatili ang literal na “ang sampu”; hindi idinagdag sa pangunahing teksto ang “iba pang” o “alagad,” bagaman malinaw ang mga iyon sa konteksto.
- source_word: ἤρξαντο
  choice: nagsimula
  rationale: 'Pinananatili ang ingressive na diwa: nagsimula ang kanilang reaksiyon sa puntong ito.'
- source_word: ἀγανακτεῖν
  choice: magalit
  rationale: Sa modernong Filipino, ang “magalit” ay natural at malinaw para sa matinding pagkayamot o indignasyon. Ang “magalit nang labis” ay maaaring magpalabis, samantalang ang “magdamdam” ay maaaring maging mas mahina.
- source_word: περὶ Ἰακώβου καὶ Ἰωάννου
  choice: kina Santiago at Juan
  rationale: Ipinapakita ng “kina” na nakatuon kina Santiago at Juan ang galit, na angkop sa konteksto. Dahil maaari ring tukuyin ng περί ang paksa o sanhi ng reaksiyon, pinananatili sa talababa ang alternatibo.
- source_word: Ἰακώβου
  choice: Santiago
  rationale: Ito ang nakaugaliang pangalang Filipino sa Bibliya para kay Ἰάκωβος sa kontekstong ito.
- source_word: Ἰωάννου
  choice: Juan
  rationale: Ito ang nakaugaliang pangalang Filipino sa Bibliya para kay Ἰωάννης.
