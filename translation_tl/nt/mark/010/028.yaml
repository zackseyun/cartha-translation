  verdict: revise
  source_fidelity: 'Tumpak ang pangunahing diwa: si Pedro ang nagsasalita kay Jesus, ipinapahayag na iniwan ng mga alagad ang lahat at sumunod sila sa kanya. Gayunman, ang “Nagsimulang magsabi” ay hindi ang pinakanatural na Tagalog na katumbas ng ἤρξατο λέγειν sa pagpapakilala ng tuwirang pahayag.'
  naturalness: Mas natural sa modernong Filipino Tagalog ang “Nagsimulang magsalita si Pedro sa kanya” kaysa “Nagsimulang magsabi si Pedro sa kanya.” Pinapanatili nito ang aspekto ng “began to say/speak” at maayos na ipinapasok ang kasunod na sipi.
  terminology: Ang “si Pedro,” “sa kanya,” “Tingnan mo,” “iniwan namin ang lahat,” at “sumunod kami sa iyo” ay malinaw, marangal, at angkop sa modernong Tagalog. Ang “sumunod sa iyo” ay nananatiling sapat na katumbas ng ἀκολουθέω sa konteksto ng pagiging alagad, nang hindi nagdaragdag ng interpretasyon.
