base_translation:
  language: en
  yaml_path: translation/nt/mark/010/028.yaml
  text: Peter began to say to him[a], “Look, we have left everything and followed you.”
translation:
  language: tl
  text: Nagsimulang magsalita si Pedro sa kanya, “Tingnan mo, iniwan namin ang lahat at sumunod kami sa iyo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἤρξατο λέγειν
  choice: Nagsimulang magsabi
  rationale: Likas na isinasalin ang aspektuwal na pariralang may ἤρξατο at infinitibong λέγειν bilang “nagsimulang magsabi,” na angkop dahil sinusundan ito ng tuwirang pahayag.
- source_word: ὁ Πέτρος
  choice: si Pedro
  rationale: Ginamit ang karaniwang anyo ng pangalang Peter sa modernong Tagalog.
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Pinanatili ang panghalip ng Griyego sa halip na tahasang idagdag ang pangalang Jesus.
- source_word: Ἰδοὺ
  choice: Tingnan mo
  rationale: Dito, ang ἰδού ay pantawag-pansin sa kausap. Natural at malinaw sa modernong Tagalog ang “Tingnan mo,” samantalang ang “Narito” ay maaaring magpahiwatig ng lokasyon o pagpapakita ng isang bagay.
- source_word: ἡμεῖς
  choice: namin
  rationale: Ang tahasang ἡμεῖς ay may diin. Sa Tagalog, naipahihiwatig ito nang natural sa “Tingnan mo, iniwan namin…” nang hindi gumagamit ng mabigat na “kami mismo.”
- source_word: ἀφήκαμεν πάντα
  choice: iniwan namin ang lahat
  rationale: Ang ἀφίημι rito ay tumutukoy sa pag-iwan, at ang πάντα ay komprehensibong “ang lahat.” Hindi ginamit ang mas interpretatibong “tinalikuran” o “isinuko.”
- source_word: ἠκολουθήκαμέν σοι
  choice: sumunod kami sa iyo
  rationale: Ang perpektong anyo ay nagsasaad ng pagsunod na sinimulan at may patuloy na kabuluhan. Ang payak na nagdaang anyo sa Tagalog ay natural sa koordinasyon at hindi kinakailangang magdagdag ng aspektuwal na paliwanag.
theological_decisions:
- issue: Ang pag-angkin ni Pedro tungkol sa iniwang lahat at pagsunod kay Jesus
  choice: Isinalin nang tuwiran bilang sariling pahayag ni Pedro.
  alternative: Palambutin bilang “marami ang iniwan namin” o dagdagan ng paliwanag na inaanticipa ang tugon ni Jesus.
  rationale: Iniuulat ng talata ang mariing pahayag ni Pedro ngunit hindi pa ito sinusuri ng tagapagsalaysay. Pinanatili ang tensiyon nang walang pag-endorso, pagwawasto, o pagpapalambot.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang tuwirang pangungusap at ang diin ng pambungad na pantawag-pansin, nang walang arkaikong pananalita o dagdag na interpretasyon.
