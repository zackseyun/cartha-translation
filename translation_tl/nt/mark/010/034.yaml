id: MRK.10.34
reference: Mark 10:34
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐμπαίξουσιν αὐτῷ καὶ ⸂ἐμπτύσουσιν αὐτῷ καὶ μαστιγώσουσιν αὐτὸν⸃ καὶ ⸀ἀποκτενοῦσιν, καὶ ⸂μετὰ τρεῖς ἡμέρας⸃ ἀναστήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/034.yaml
  text: And they will mock him[a], and spit on him, and flog him, and kill him, and after three days he will rise.
translation:
  language: tl
  text: At kukutyain nila siya, duduraan siya, hahagupitin siya, at papatayin siya. At pagkaraan ng tatlong araw[a], babangon siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa ikatlong araw.” Literal na mababasa sa Griyego ni Marcos ang “pagkaraan ng tatlong araw,” samantalang sa ibang mga talata ay “sa ikatlong araw” ang pagkakahayag sa takdang panahon.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμπαίξουσιν
  choice: kukutyaín
  rationale: Ipinahihiwatig ng pandiwa ang mapanlait at mapanghamak na pangungutya. Likas at malinaw sa makabagong Filipino ang “kukutyaín.”
- source_word: ἐμπτύσουσιν αὐτῷ
  choice: duduraan siya
  rationale: Ipinapakita ng parirala na ang pagdura ay tuwirang ginawa sa kanya bilang paghamak. Mas natural at tiyak ang “duduraan siya” kaysa “dudura patungo sa kanya.”
- source_word: μαστιγώσουσιν
  choice: hahagupitin siya
  rationale: Malinaw na ipinapahayag ng “hahagupitin” ang marahas na pagpaparusa sa pamamagitan ng paghampas, nang hindi gumagamit ng lipas o teknikal na salita.
- source_word: ἀποκτενοῦσιν
  choice: papatayin siya
  rationale: Payak na nangangahulugang pumatay ang pandiwa. Hindi idinagdag ang legal na diwa ng paglalapat ng hatol o ang moral na paghusga ng “paslangin.”
- source_word: μετὰ τρεῖς ἡμέρας
  choice: pagkaraan ng tatlong araw
  rationale: Ang μετά na may akusatibo ay karaniwang nangangahulugang “pagkaraan.” Tuwirang pinananatili nito ang pagkakagamit ni Marcos sa halip na tahimik na iayon sa “sa ikatlong araw” na matatagpuan sa ibang mga talata.
- source_word: ἀναστήσεται
  choice: babangon siya
  rationale: Ang anyong panghinaharap na middle ay natural na maipahayag bilang katawaning “babangon siya.” Hindi idinagdag ang “muli,” na ipinahihiwatig ng konteksto ngunit wala mismo sa Griyego.
theological_decisions:
- issue: Pananalita tungkol sa muling pagkabuhay
  choice: babangon siya
  alternative: bubuhayin siya; babangon siyang muli
  rationale: Pinananatili ng “babangon siya” ang katawaning diwa ng ἀναστήσεται. Hindi ito ginawang balintiyak at hindi idinagdag ang “muli,” kaya hindi nilulutas sa salin ang teolohikal na tensiyon sa ibang mga pahayag ng Bagong Tipan tungkol sa Diyos na bumuhay kay Jesus.
- issue: Takda ng panahon
  choice: pagkaraan ng tatlong araw
  alternative: sa ikatlong araw
  rationale: Tuwirang isinasalin ang natatanging pananalita ni Marcos at hindi ito tahimik na itinutugma sa ibang mga pormulasyon sa mga Ebanghelyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang sunod-sunod at mariing mga kilos sa pamamagitan ng pag-uulit ng “siya,” at hinati sa dalawang pangungusap upang luminaw ang paglipat mula sa pagpatay tungo sa pagkabuhay.
