  terminology: Ang “Jesus,” “mga bata,” at “kaharian ng Diyos” ay pare-pareho, malinaw, at angkop na mga terminong Tagalog. Ang “nagalit” ay isang ligtas at sapat na natural na salin ng ἠγανάκτησεν, na nagpapahayag ng tunay na pagkayamot nang hindi nagpapasok ng dagdag na interpretasyon.
