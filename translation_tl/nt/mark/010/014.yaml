id: MRK.10.14
reference: Mark 10:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Ἰησοῦς ἠγανάκτησεν καὶ εἶπεν αὐτοῖς· Ἄφετε τὰ παιδία ἔρχεσθαι πρός με, μὴ κωλύετε αὐτά, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/014.yaml
  text: But when Jesus saw it[a], he was indignant and said to them, “Let the children come to me; do not hinder them, for the kingdom of God belongs to such as these.”
translation:
  language: tl
  text: Ngunit nang makita ito ni Jesus, nagalit siya at sinabi sa kanila, “Hayaan ninyong lumapit sa akin ang mga bata; huwag ninyo silang pigilan, sapagkat sa mga katulad nila nauukol ang kaharian ng Diyos.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Ἰησοῦς
  choice: Ngunit nang makita ito ni Jesus
  rationale: Ipinahihiwatig ng aorist participle ang pangyayaring nag-udyok sa tugon ni Jesus. Idinagdag ang “ito” mula sa konteksto upang maging natural sa Tagalog, at ipinahayag ng “ngunit” ang banayad na pagsalungat sa ginawa ng mga alagad.
- source_word: ἠγανάκτησεν
  choice: nagalit siya
  rationale: Ang pandiwa ay nagpapahayag ng matinding pagkayamot o makatuwirang galit. Ang “nagalit” ay malinaw at natural sa modernong Tagalog nang hindi nagpapahiwatig ng kawalan ng pagpipigil.
- source_word: Ἄφετε τὰ παιδία ἔρχεσθαι πρός με
  choice: Hayaan ninyong lumapit sa akin ang mga bata
  rationale: Ang ἄφετε ay utos na pahintulutan sila, at ang “lumapit sa akin” ay natural na katumbas ng pagkilos patungo kay Jesus.
- source_word: μὴ κωλύετε αὐτά
  choice: huwag ninyo silang pigilan
  rationale: Tumpak na ipinahahayag ng “pigilan” ang paghadlang sa paglapit ng mga bata at likas itong pakinggan sa Tagalog.
- source_word: τῶν γὰρ τοιούτων ἐστὶν
  choice: sapagkat sa mga katulad nila nauukol
  rationale: 'Pinananatili ng “mga katulad nila” ang representative force ng τοιούτων: hindi lamang ang mismong mga batang naroon kundi ang mga taong tulad nila. Ang “nauukol” ay natural na naghahatid sa genitive construction nang hindi tahasang dinaragdagan ang sinabi ng teksto.'
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ang kaharian ng Diyos
  rationale: Ito ang malinaw, karaniwan, at matatag na salin ng parirala, habang pinananatili ang saklaw ng “kaharian” nang hindi ito nililimitahan sa isang lugar o sa abstraktong paghahari lamang.
theological_decisions:
- issue: Kahulugan ng τῶν τοιούτων sa kaugnayan nito sa kaharian ng Diyos
  choice: “sa mga katulad nila nauukol ang kaharian ng Diyos”
  alternative: “sa mga bata nauukol ang kaharian ng Diyos” o ang mas literal na “sa mga ganito ang kaharian ng Diyos”
  rationale: Ang τοιούτων ay tumutukoy sa mga taong kauri o katulad ng mga batang ito, hindi lamang sa mismong mga batang naroon. Hindi tinutukoy ng salin kung anong partikular na katangian ng mga bata ang nasa isip ni Jesus, kaya nananatili ang teolohikal na tensiyon at hindi ipinapasok ang doktrina tungkol sa kawalang-malay o awtomatikong kaligtasan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “nagalit” sa halip na mas bihira o mas pormal na “nagngitngit/nagalit nang matindi,” at “nauukol” upang maipahayag nang natural ang relasyon ng kaharian sa “mga katulad nila.”
