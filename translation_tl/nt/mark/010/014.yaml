  source_fidelity: 'Tumpak na naihahatid ang lahat ng pangunahing elemento ng Griyego: ang pangyayaring nakita ni Jesus, ang kaniyang matinding di-pagsang-ayon, ang dalawang utos na pahintulutan at huwag hadlangan ang mga bata, at ang pahayag hinggil sa kaharian ng Diyos. Ang “mga katulad nila” ay wastong kumakatawan sa representative force ng τοιούτων nang hindi nagdaragdag ng doktrinal na pagpapaliwanag.'
