id: MRK.10.8
reference: Mark 10:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν· ὥστε οὐκέτι εἰσὶν δύο ἀλλὰ μία σάρξ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/008.yaml
  text: and the two will become one flesh. So they are no longer two[a], but one flesh.
translation:
  language: tl
  text: at ang dalawa ay magiging isang laman.[a] Kaya hindi na sila dalawa, kundi isang laman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas literal na ayos ng Griyego: “at ang dalawa ay magiging tungo sa isang laman.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσονται
  choice: magiging
  rationale: Bagaman anyo ito ng pandiwang ‘maging/umiral,’ ang kasunod na εἰς na may panaguring akusatibo ay nagpapahayag ng kinahinatnang kalagayan; natural itong ihayag sa Tagalog bilang ‘magiging.’
- source_word: οἱ δύο
  choice: ang dalawa
  rationale: Pinananatili nito ang tahasang pagbanggit sa dalawa, na mahalaga sa kasunod na paghahambing na ‘hindi na sila dalawa.’
- source_word: εἰς σάρκα μίαν
  choice: isang laman
  rationale: Ang ‘magiging isang laman’ ay natural na pariralang Tagalog para sa kinahinatnang pagkakaisa, habang pinananatili ang ugnayan sa sipi mula sa Genesis.
- source_word: σάρκα / σάρξ
  choice: laman
  rationale: Ang literal na ‘laman,’ hindi ‘katawan’ o ‘makasalanang kalikasan,’ ang nagpapanatili sa biblikal na pahayag tungkol sa pag-iisang mag-asawa at sa intertekstuwal na kaugnayan nito sa Genesis.
- source_word: ὥστε
  choice: Kaya
  rationale: Ipinakikilala rito ng ὥστε ang bunga o kongklusyon mula sa naunang pahayag; malinaw at natural ang ‘Kaya’ sa makabagong Tagalog.
- source_word: οὐκέτι
  choice: hindi na
  rationale: Maikli at likas na ipinapahayag nito ang pagtigil ng dating kalagayan.
- source_word: ἀλλὰ μία σάρξ
  choice: kundi isang laman
  rationale: Pinananatili ng ‘kundi’ ang mariing pagsalungat sa ‘dalawa,’ at ng ‘isang laman’ ang eksaktong biblikal na konsepto.
theological_decisions:
- issue: Kahulugan ng ‘isang laman’ sa pagsipi ni Jesus mula sa Genesis
  choice: Panatilihin ang pahayag na ‘isang laman’ nang walang dagdag na paliwanag sa pangunahing teksto.
  alternative: isang katawan; isang tao; nagkaisa sa pakikipagtalik
  rationale: Malawak ang teolohikal at antropolohikal na saklaw ng parirala, at hindi ito nililimitahan ng talata sa iisang aspekto lamang. Ang pagpapanatili sa mismong biblikal na pahayag ay umiiwas sa pagpapasok ng makitid na interpretasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang tradisyonal ngunit madaling maunawaang biblikal na pariralang ‘isang laman.’
