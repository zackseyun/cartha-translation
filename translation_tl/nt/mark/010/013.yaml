  text: And they were bringing children to him so that he might touch them[a], but the disciples rebuked them.
translation:
  language: tl
  text: May mga nagdadala ng mga bata kay Jesus upang hipuin niya ang mga ito,[a] ngunit sinaway sila ng mga alagad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “maliliit na bata.” Maaaring tumukoy ang salitang Griyego sa mga bata sa pangkalahatan, kabilang ang maliliit na bata.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέφερον
  choice: Patuloy na dinadala
  rationale: Ipinahihiwatig ng imperpektong aspekto ang nagpapatuloy o paulit-ulit na pagdadala noong nakaraan; natural itong naipapahayag sa Filipino sa pamamagitan ng “patuloy na dinadala.”
- source_word: παιδία
  choice: mga bata
  rationale: Malawak ang saklaw ng παιδία at maaaring tumukoy sa mga bata, kabilang ang maliliit na bata. Hindi nililimitahan ng “mga bata” ang edad nang higit sa sinasabi ng Griyego.
- source_word: ἵνα αὐτῶν ἅψηται
  choice: upang hipuin niya ang mga ito
  rationale: Ang ἵνα na may pasakali ay nagpapahayag ng layunin, at ang ἅπτομαι ay tuwirang nangangahulugang humipo o humawak. Hindi idinagdag ang pagpapatong ng mga kamay mula sa mga kaagapay na salaysay.
- source_word: ἐπετίμησαν
  choice: sinaway
  rationale: Ang ἐπιτιμάω ay nagpapahayag ng matinding pagsaway. Ang “sinaway” ay malinaw, natural, at may sapat na lakas sa modernong Filipino.
- source_word: αὐτοῖς
  choice: sila
  rationale: Pinakamalamang na tumutukoy ang panghalip sa mga taong nagdadala sa mga bata. Pinananatili ng “sila” ang panghalip habang malinaw ang tinutukoy dahil tahasang binanggit ang “mga tao.”
- source_word: δὲ
  choice: ngunit
  rationale: Ipinakikita ng δέ ang banayad na pagsalungat sa pagitan ng pagdadala ng mga tao at ng naging tugon ng mga alagad.
theological_decisions:
- issue: Ang tinutukoy na sinaway ng mga alagad
  choice: Ang mga taong nagdadala sa mga bata
  alternative: Ang mga bata mismo
  rationale: Ang di-tahasang simuno ng προσέφερον ang pinakaangkop na pinatutungkulan ng αὐτοῖς ayon sa balarila at daloy ng salaysay. Nililinaw ito sa pagsasaling “mga tao” nang hindi nagdaragdag ng pagkakakilanlan na wala sa teksto.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “kay Jesus” sa halip na simpleng “sa kanya” upang maging malinaw sa hiwalay na talata ang tinutukoy ng panghalip. Ang “mga ito” ay umiiwas sa kalituhan sa kasunod na “sila,” na tumutukoy sa mga nagdadala.
