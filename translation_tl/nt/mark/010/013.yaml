  source_fidelity: 'Tumpak ang pangunahing diwa: may nagdadala ng mga bata kay Jesus upang mahawakan niya sila, at sinaway ng mga alagad ang mga nagdadala. Gayunman, ang “Patuloy na dinadala ng mga tao” ay maaaring basahing pangkasalukuyan kung hiwalay ang talata. Ang “May mga nagdadala” ay mas tuwirang naghahatid ng imperpektong, nagpapatuloy na kilos sa daloy ng salaysay nang hindi labis na tinutukoy ang di-tahasang simuno bilang “mga tao.”'
  naturalness: Natural ang “upang hipuin niya” at “sinaway sila.” Mas magaan at mas idiomatiko ang ayos na “May mga nagdadala ng mga bata kay Jesus” kaysa sa pasibong “Patuloy na dinadala ng mga tao kay Jesus ang mga bata.”
  terminology: Ang “mga bata,” “hipuin,” “mga alagad,” at “sinaway” ay angkop sa modernong Filipino Tagalog at sapat na tumutugon sa παιδία, ἅψηται, μαθηταί, at ἐπετίμησαν. Napananatili ng talababa ang mas tiyak na posibleng pakahulugang “maliliit na bata.”
