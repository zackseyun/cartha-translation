  text: οἱ δὲ περισσῶς ἐξεπλήσσοντο λέγοντες πρὸς ⸀ἑαυτούς· Καὶ τίς δύναται σωθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/026.yaml
  text: And they were exceedingly astonished[a], saying to one another, “Then who can be saved?”
translation:
  language: tl
  text: Lalo pa silang namangha at sinabi sa isa’t isa[a], “Kung gayon, sino ang maaaring maligtas?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kanilang sarili”; maaari ring unawain na “sa kanilang usapan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: silang
  rationale: Tumutukoy ang parirala sa mga alagad na binanggit sa konteksto. Sapat na sa natural na daloy ng Filipino ang panghalip; hindi kailangang tahasang isalin ang δέ bilang “ngunit.”
- source_word: περισσῶς
  choice: lalo pa
  rationale: Ipinahihiwatig ng pang-abay ang matinding reaksiyon, at maaari ring magpahiwatig na lalo pang tumindi ang kanilang pagkamangha dahil sa naunang sinabi ni Jesus.
- source_word: ἐξεπλήσσοντο
  choice: namangha
  rationale: Nagsasaad ang pandiwa ng matinding pagkagulat o pagkamangha. Natural at marangal sa modernong Filipino ang “namangha,” habang ang daloy ng pangungusap ang naghahatid ng nagpapatuloy na reaksiyon.
- source_word: λέγοντες
  choice: at sinabi
  rationale: Ang kasabay na pandiwaring Griyego ay natural na inilalahad sa Filipino bilang kasunod na kilos na kaugnay ng kanilang pagkamangha.
- source_word: πρὸς ἑαυτούς
  choice: sa isa’t isa
  rationale: Bagaman literal na “sa kanilang sarili,” ang pangmaramihang kontekstong usapan ay likas na nagpapahiwatig na nagsasalita sila sa isa’t isa.
- source_word: Καὶ
  choice: Kung gayon
  rationale: Sa tanong, ipinakikilala ng καί ang konklusyon o bunga ng naunang sinabi. Malinaw na naihahatid ng “Kung gayon” ang inferensiyang ito.
- source_word: τίς δύναται
  choice: sino ang maaaring
  rationale: Pinananatili nito ang tanong tungkol sa posibilidad o kakayahang maligtas, sa natural na anyong Filipino.
- source_word: σωθῆναι
  choice: maligtas
  rationale: Sa konteksto ng pagpasok sa kaharian ng Diyos, ang “maligtas” ay nagpapanatili sa teolohikal at eskatolohikal na bigat ng pandiwa, hindi lamang sa diwa ng pansamantalang pagsagip.
theological_decisions:
- issue: Saklaw ng σωθῆναι sa konteksto
  choice: maligtas
  alternative: mailigtas o masagip
  rationale: Kaugnay ito ng naunang pag-uusap tungkol sa pagpasok sa kaharian ng Diyos. Ang “maligtas” ay nagpapanatili sa malawak na diwa ng pagliligtas ng Diyos nang hindi nililimitahan iyon sa pisikal o pansamantalang pagsagip.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “lalo pa” upang ihatid kapwa ang tindi at posibleng paglala ng kanilang pagkamangha; inilagay ang talababa sa pariralang aktuwal na may leksikal na alternatibo.
