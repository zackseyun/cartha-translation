  text: καὶ ἐὰν ⸂αὐτὴ ἀπολύσασα τὸν ἄνδρα αὐτῆς γαμήσῃ ἄλλον⸃ μοιχᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/012.yaml
  text: and if she divorces her husband and marries another man[a], she commits adultery.
translation:
  language: tl
  text: At kung diborsiyuhin ng isang babae ang kanyang asawang lalaki at magpakasal sa ibang lalaki, nangangalunya siya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Karaniwang pang-ugnay na nagdurugtong sa pahayag na ito sa katumbas na kaso sa naunang talata.
- source_word: ἐὰν
  choice: kung
  rationale: Likas na pananda ng kondisyong ipinahahayag ng salitang Griyego.
- source_word: αὐτὴ
  choice: niya / siya
  rationale: Pinananatili ng mga panghalip sa Filipino ang tahasang babaeng paksa ayon sa konteksto, bagaman hindi minamarkahan ng kasarian ang panghalip na Filipino.
- source_word: ἀπολύσασα
  choice: hiwalayan
  rationale: Sa konteksto ng pag-aasawa, tumutukoy ito sa pagdidiborsiyo o pagpapawalang-bisa ng pagsasama. Mas natural sa karaniwang modernong Filipino ang 'hiwalayan' kaysa 'diborsiyuhin,' habang malinaw ang legal-marital na diwa sa konteksto.
- source_word: τὸν ἄνδρα αὐτῆς
  choice: ang kanyang asawa
  rationale: Ang ἀνήρ ay nangangahulugang 'asawang lalaki' sa kontekstong ito. Natural sa Filipino ang 'asawa'; ang pagkakakilanlan nito bilang lalaki ay malinaw mula sa babaeng paksa at sa kasunod na 'ibang lalaki.'
- source_word: γαμήσῃ ἄλλον
  choice: magpakasal siya sa ibang lalaki
  rationale: Ginagawang tahasan ang panlalaking tinutukoy ng ἄλλον at natural na isinasalin ang pandiwa bilang 'magpakasal.'
- source_word: μοιχᾶται
  choice: nangangalunya siya
  rationale: Direkta, kasalukuyang-aspektong salin ng pandiwa at likas na pahayag sa dignidad na modernong Filipino.
theological_decisions:
- issue: Pagpapanatili sa kasarian ng mga taong tinutukoy
  choice: Babae ang paksa at 'ibang lalaki' ang pakakasalan niya.
  alternative: Gumamit ng mga salitang walang tiyak na kasarian, gaya ng 'kung hiwalayan ng isang tao ang kanyang asawa at magpakasal sa iba.'
  rationale: Tiyak sa Griyego ang babaeng paksa at panlalaking layon. Pinananatili nito ang sinadyang pagkakatulad at pagkakaiba sa naunang talata.
- issue: Kahulugan ng ἀπολύω sa konteksto ng pag-aasawa
  choice: hiwalayan
  alternative: palayasin / diborsiyuhin
  rationale: Ang tinutukoy ay pagwawakas ng pag-aasawa, hindi basta pisikal na pagpapaalis. Ang 'hiwalayan' ay malinaw at natural sa pangkalahatang modernong Filipino nang hindi nag-aangkat ng partikular na sistemang legal.
translation_notes:
  register: Natural, kasalukuyan, at marangal na Filipino. Iniwasan ang teknikal at di-gaanong karaniwang 'diborsiyuhin'; pinanatiling tahasan ang 'ibang lalaki' upang maipakita ang kasariang nasa Griyego.
