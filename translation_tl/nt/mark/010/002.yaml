lexical_decisions:
- source_word: Καὶ
  choice: At
  rationale: Pinananatili ang payak na pang-ugnay at daloy ng salaysay nang hindi nagdaragdag ng tiyak na panahong hindi hayag sa Griyego.
- source_word: ἐπηρώτων
  choice: tinatanong nila
  rationale: Ang imperpektong aspekto ay nagpapahiwatig ng nagpapatuloy o paulit-ulit na pagtatanong; likas itong naihahayag sa Filipino sa anyong “tinatanong.”
- source_word: ἔξεστιν
  choice: naaayon ba sa Kautusan
  rationale: Legal na pagpapahintulot ang paksa sa konteksto, hindi lamang pangkalahatang pahintulot. Nililinaw ng malaking titik na tumutukoy ito sa Kautusang kaugnay ng pinagtatalunang diborsiyo.
- source_word: ἀνδρὶ
  choice: ng isang lalaki
  rationale: Pinananatili ang pangkalahatang anyong “lalaki”; bagaman maaari rin itong mangahulugang “asawang lalaki,” malinaw na ang relasyong mag-asawa dahil sa kasunod na “kanyang asawa.”
- source_word: γυναῖκα
  choice: ang kanyang asawa
  rationale: Sa konteksto ng ἀπολῦσαι, ang γυνή ay tumutukoy sa asawa, hindi sa babae sa pangkalahatan. Likas sa Filipino ang paglalagay ng “kanyang” upang ipahayag ang ugnayang pangmag-asawa.
- source_word: ἀπολῦσαι
  choice: hiwalayan
  rationale: Sa legal na konteksto ng pag-aasawa, ang pandiwa ay idiomatikong tumutukoy sa pakikipagdiborsiyo; ang “hiwalayan” ay malinaw at natural sa modernong Filipino.
- source_word: πειράζοντες
  choice: habang sinusubok nila siya
  rationale: Pinananatili ang pangunahing kahulugang hostile testing nang hindi tahasang ipinapalagay na bitag ang eksaktong layunin.
theological_decisions:
- issue: Ang maaaring generic o marital na kahulugan ng ἀνδρὶ
  choice: isang lalaki
  alternative: isang asawang lalaki
  rationale: Pinananatili ang pormal na ambiguity ng ἀνήρ bilang “lalaki” o “asawang lalaki,” habang ipinauunawa ng konteksto at ng “kanyang asawa” ang usaping pangmag-asawa.
- issue: Ang batayang legal ng ἔξεστιν
  choice: naaayon sa Kautusan
  alternative: ipinahihintulot
  rationale: Ang tanong ay tungkol sa legal na pahintulot sa loob ng usaping Hudyo hinggil sa diborsiyo. Gayunman, hindi tinutukoy ng talata kung aling pagpapakahulugan sa Kautusan ang tama, kaya hindi iyon nilulutas sa salin.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “hiwalayan” sa halip na mas teknikal na “diborsiyuhin,” at “Kautusan” upang maipakita ang legal-relihiyosong konteksto. Ang kuwit bago ang talababa ay inilagay pagkatapos ng buong sugnay na nililinaw nito.
