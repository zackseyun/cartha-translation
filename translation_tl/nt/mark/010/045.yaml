  text: καὶ γὰρ ὁ υἱὸς τοῦ ἀνθρώπου οὐκ ἦλθεν διακονηθῆναι ἀλλὰ διακονῆσαι καὶ δοῦναι τὴν ψυχὴν αὐτοῦ λύτρον ἀντὶ πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/045.yaml
  text: For even the Son of Man did not come to be served[a], but to serve, and to give his life as a ransom for many.
translation:
  language: tl
  text: Sapagkat kahit ang Anak ng Tao ay hindi naparito upang paglingkuran siya, kundi upang maglingkod at ibigay ang kanyang buhay bilang pantubos para sa marami.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bilang pantubos sa halip ng marami.” Ang salitang Griyego na isinaling “para sa” ay maaaring magpahiwatig ng pagpapalit o pakikipagpalitan.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Sapagkat maging
  rationale: Ipinapakita ng “Sapagkat” na ipinaliliwanag at pinagbabatayan ng pangungusap na ito ang naunang turo, samantalang pinananatili ng “maging” ang diin ng καί.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Pinananatili nito ang kinikilalang titulo ni Jesus at ang kaugnayan nito sa mga naunang kasulatan, nang hindi ito binibigyang-kahulugang lampas sa mismong parirala.
- source_word: οὐκ ἦλθεν
  choice: hindi naparito
  rationale: Likas sa Filipino ang “naparito” para sa pagdating na may kaugnayan sa layuning kasunod, at malinaw nitong pinananatili ang pagtanggi.
- source_word: διακονηθῆναι
  choice: upang siya’y paglingkuran
  rationale: 'Malinaw na ipinahahayag ng ayos na ito ang balintiyak na diwa: hindi dumating ang Anak ng Tao upang tumanggap ng paglilingkod.'
- source_word: ἀλλὰ διακονῆσαι
  choice: kundi upang maglingkod
  rationale: Ginagamit ang parehong ugat na “lingkod” upang mapanatili ang tahasang retorikal na pagsalungat sa “paglingkuran.”
- source_word: δοῦναι
  choice: ibigay
  rationale: Ito ang tuwiran at likas na katumbas ng δοῦναι at hindi nagdaragdag ng mas makitid na diwang wala sa pandiwa.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: ang kanyang buhay
  rationale: Sa kontekstong ito, ang ψυχή ay tumutukoy sa buhay na ibinibigay hanggang kamatayan, hindi lamang sa di-materyal na kaluluwa.
- source_word: λύτρον
  choice: pantubos
  rationale: Ang “pantubos” ay maikli, natural, at nagpapahiwatig ng halagang ibinibigay upang makalaya ang iba.
- source_word: ἀντὶ πολλῶν
  choice: para sa marami
  rationale: Natural at madaling maunawaan ang parirala sa pangunahing teksto. Yamang maaaring hindi nito lubos na maipakita ang diwa ng pagpapalit o pakikipagpalitan sa ἀντί, inilalahad ang mas tahasang anyo sa talababa.
theological_decisions:
- issue: Ang puwersa ng ἀντί sa pahayag tungkol sa pantubos
  choice: “para sa marami” sa pangunahing teksto, na may “kapalit ng marami” sa talababa
  alternative: “kapalit ng marami” sa pangunahing teksto
  rationale: Karaniwang ipinahihiwatig ng ἀντί ang pagpapalit o pakikipagpalitan. Pinananatiling natural ang pangunahing pangungusap habang hayagang itinatala sa talababa ang mas tiyak na leksikal na diwa, nang hindi inaalis ang teolohikal na tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang tradisyonal at intertekstuwal na titulong “Anak ng Tao,” habang ginamit ang magkatugmang “paglingkuran/maglingkod” upang marinig ang pagsalungat sa Griyego. Inilagay ang tandang [a] pagkatapos ng pariralang tinutukoy nito.
