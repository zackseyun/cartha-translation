  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀ἐμβλέψας αὐτοῖς ὁ Ἰησοῦς λέγει· Παρὰ ἀνθρώποις ἀδύνατον ἀλλ’ οὐ παρὰ θεῷ, πάντα γὰρ ⸀δυνατὰ παρὰ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/027.yaml
  text: Jesus looked at them and said, “With men it is impossible, but not with God, because all things are possible with God.”
translation:
  language: tl
  text: Tiningnan sila ni Jesus at sinabi, “Imposible ito sa mga tao, ngunit hindi sa Diyos, sapagkat posible sa Diyos ang lahat ng bagay.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας αὐτοῖς
  choice: Tiningnan sila
  rationale: Likas at tuwirang salin ng masinsing pagtingin ni Jesus sa kanila; hindi na dinagdagan ng paraang wala naman sa teksto.
- source_word: Παρὰ ἀνθρώποις
  choice: sa mga tao
  rationale: Pinananatili ang paghahambing ng kakayahan ng tao at ng Diyos. Ang kasunod na “ito” ay tumutukoy sa kaligtasang pinag-uusapan sa konteksto.
- source_word: ἀδύνατον
  choice: imposible ito
  rationale: Natural sa modernong Tagalog at pinananatili ang di-tahasang paksa ng Griyego sa pamamagitan ng kontekstuwal na “ito.”
- source_word: πάντα γὰρ δυνατὰ παρὰ τῷ θεῷ
  choice: sapagkat posible sa Diyos ang lahat ng bagay
  rationale: Isinasalin ang γάρ bilang sanhi o paliwanag at pinananatili ang malawak na “lahat ng bagay” nang hindi nililimitahan nang higit sa sinabi ng teksto.
theological_decisions:
- issue: Saklaw ng “lahat ng bagay”
  choice: Pinanatili ang “lahat ng bagay” sa pangunahing teksto.
  alternative: “Magagawa ng Diyos ang lahat” o “lahat ng bagay na ito ay posible sa Diyos.”
  rationale: Ang πάντα ay malawak ang anyo, habang ang konteksto ay tungkol sa posibilidad ng kaligtasan. Hindi dapat paliitin o palawakin sa salin ang pahayag sa pamamagitan ng dagdag na interpretasyon.
- issue: Ugnayan ng γάρ sa naunang pahayag
  choice: “sapagkat”
  alternative: “dahil” o “para”
  rationale: Malinaw na ipinakikita nitong ang posibilidad ng lahat ng bagay sa Diyos ang dahilan o paliwanag kung bakit hindi ito imposible sa Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang karaniwang “imposible” at “posible” upang maging natural, habang pinanatili ang balangkas at teolohikal na diin ng Griyego.
