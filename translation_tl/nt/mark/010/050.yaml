  verdict: revise
  source_fidelity: Tumpak ang pangunahing daloy ng mga kilos at ang pagtukoy kay Jesus. Gayunman, ang “pagkahagis niya sa kanyang balabal” ay hindi wastong pagtatakda ng layon sa Tagalog; ang “sa” ay nagmumungkahing may pinaghagisan, samantalang ang balabal ang inihagis/itinapon. Ang “itinapon niya ang kanyang balabal” ay malinaw na naghahatid ng mapagpasyang ἀποβαλών. Ang “bigla siyang tumayo” ay sapat na natural na katumbas ng ἀναπηδήσας sa konteksto.
  naturalness: Payak at angkop ang rehistro, ngunit kailangang ayusin ang konstruksyong “pagkahagis niya sa kanyang balabal.” Ang binagong pangungusap ay mas idiomatiko at nananatiling mabilis ang salaysay.
  terminology: Ang “balabal” ay angkop para sa ἱμάτιον bilang panlabas na kasuotan. Ang “Jesus” ay wastong anyo sa modernong Filipino Tagalog. Ang tala ay pinananatili bilang alternatibong leksikal para sa “balabal.”
