  yaml_path: translation/nt/mark/010/050.yaml
  text: And throwing off his cloak[a], he sprang up and came to Jesus.
translation:
  language: tl
  text: At itinapon niya ang kanyang balabal[a], bigla siyang tumayo at lumapit kay Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “panlabas na kasuotan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποβαλών
  choice: pagkahagis
  rationale: Ipinahihiwatig ng aorist participle ang mabilis at tiyak na pag-aalis; pinananatili ng “pagkahagis” ang sigla at biglaang kilos ng Griyego.
- source_word: ἱμάτιον
  choice: balabal
  rationale: Karaniwang tumutukoy ang ἱμάτιον sa panlabas na kasuotan; natural at tiyak sa kontekstong ito ang “balabal.”
- source_word: ἀναπηδήσας
  choice: bigla siyang tumayo
  rationale: Ang pandiwa ay naglalarawan ng mabilis at masiglang pagbangon. Mas natural sa modernong Tagalog ang “bigla siyang tumayo” kaysa sa literal ngunit maaaring malabong “lumukso siya.”
- source_word: ἦλθεν πρὸς τὸν Ἰησοῦν
  choice: lumapit kay Jesus
  rationale: Ipinahahayag ng ἔρχομαι na may πρός ang pagkilos patungo kay Jesus; malinaw at likas sa Tagalog ang “lumapit kay Jesus.”
- source_word: δὲ
  choice: At
  rationale: Mahinang pang-ugnay ito na nagpapatuloy sa salaysay at hindi nangangailangan ng matinding pagsalungat.
