source:
  edition: SBLGNT
  text: Καὶ περιβλεψάμενος ὁ Ἰησοῦς λέγει τοῖς μαθηταῖς αὐτοῦ· Πῶς δυσκόλως οἱ τὰ χρήματα ἔχοντες εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/023.yaml
  text: And looking around[a], Jesus says to his disciples, “How difficult it is for those who have wealth to enter the kingdom of God!”
translation:
  language: tl
  text: Matapos tumingin sa paligid si Jesus, sinabi niya sa kanyang mga alagad, “Napakahirap para sa mga may kayamanan[a] na makapasok sa kaharian ng Diyos!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga may salapi” o “mga nagtataglay ng mga ari-arian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: Pagkatingin ... sa paligid
  rationale: Ipinahihiwatig ng aorist participle ang pagtingin ni Jesus sa mga nasa paligid bago ang kanyang sinabi; natural itong naipapahayag sa Tagalog sa pamamagitan ng “pagkatingin.”
- source_word: λέγει
  choice: sinabi niya
  rationale: Historical present ito sa masiglang salaysay ni Marcos. Mas natural sa makabagong salaysay na Tagalog ang pangnagdaang “sinabi,” habang nananatili ang tuwirang daloy ng tagpo.
- source_word: Πῶς δυσκόλως
  choice: Napakahirap
  rationale: Ipinapahayag ng parirala ang mariing pagkamangha sa tindi ng hirap, hindi ang tahasang imposibilidad.
- source_word: οἱ τὰ χρήματα ἔχοντες
  choice: mga may kayamanan
  rationale: Pinananatili ang participial na paglalarawan sa mga taong nagtataglay ng materyal na yaman sa halip na gawing nakapirming katawagang panlipunan gaya ng “mayayaman.”
- source_word: χρήματα
  choice: kayamanan
  rationale: Maaaring tumukoy ang salita sa salapi o mga ari-arian sa mas malawak na diwa; saklaw ng “kayamanan” ang materyal na yaman nang hindi nililimitahan sa salaping hawak.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: kaharian ng Diyos
  rationale: Karaniwan, malinaw, at konkretong salin ito na nagpapanatili sa teolohikal na pananalita ni Marcos tungkol sa paghahari at kaharian ng Diyos.
- source_word: εἰσελεύσονται
  choice: makapasok
  rationale: Ang pawatas na anyong Tagalog pagkatapos ng “napakahirap para sa” ay natural na nagpapahayag ng pagpasok na tinutukoy ng pandiwang Griyego sa hinaharap.
theological_decisions:
- issue: Kung ang pahayag ni Jesus ay dapat gawing tahasang imposibilidad o matinding kahirapan para sa may kayamanan
  choice: 'Matinding kahirapan: “Napakahirap ... na makapasok”'
  alternative: Isang pinatinding salin na nagpapahiwatig na halos o ganap na imposible ang pagpasok
  rationale: Ang δυσκόλως ay nagsasaad ng pagpasok na may kahirapan, hindi tuwirang imposibilidad. Pinananatili ng salin ang tensiyong teolohikal nang hindi nagpapasok ng konklusyong higit sa sinasabi ng talata.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “Pagkatingin” upang malinaw ngunit hindi mabigat ang pagkakasunod ng kilos, at ang “Napakahirap” upang mapanatili ang mariing himig ng orihinal.
