  verdict: approve
  source_fidelity: Tumpak ang salin sa SBLGNT. Ang “Ngunit hindi ganito sa inyo” ay maayos na tumutugon sa οὐχ οὕτως δέ ἐστιν ἐν ὑμῖν; ang “Sa halip” ay malinaw na katumbas ng ἀλλ’; at ang “ang sinumang nagnanais maging dakila” ay pinananatili ang pangkalahatan at boluntaryong diwa ng ὃς ἂν θέλῃ μέγας γενέσθαι. Ang “ay magiging lingkod ninyo” ay wastong salin ng ἔσται ὑμῶν διάκονος at hindi ipinagpapalit ang διάκονος sa mas malakas na terminong “alipin.”
  naturalness: Natural at marangal ang modernong Filipino Tagalog. Maikli at malinaw ang daloy, at ang pag-uulit ng “sa inyo” ay angkop upang maipakita ang dalawang paglitaw ng ἐν ὑμῖν.
  terminology: Ang “dakila” ay angkop para sa μέγας sa usapin ng katayuan, at ang “lingkod” ay tumpak at hindi teknikal na salin ng διάκονος sa kontekstong ito. Wala itong ipinapasok na denominasyonal o pang-opisinang kahulugan.
