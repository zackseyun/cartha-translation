  text: οὐχ οὕτως δέ ⸀ἐστιν ἐν ὑμῖν· ἀλλ’ ὃς ⸀ἂν θέλῃ ⸂μέγας γενέσθαι⸃ ἐν ὑμῖν, ἔσται ὑμῶν διάκονος,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/043.yaml
  text: But it is not so among you[a]. Instead, whoever wants to become great among you will be your servant[b],
translation:
  language: tl
  text: Ngunit hindi ganito sa inyo[a]. Sa halip, ang sinumang nagnanais maging dakila sa inyo ay magiging lingkod ninyo[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Ngunit hindi ganito ang nangyayari sa inyo.”
    reason: lexical_alternative
  - marker: b
    text: 'Ang pandiwang panghinaharap na “magiging” ay maaari ring magkaroon dito ng diwang “dapat maging”: ang sinumang nagnanais maging dakila sa inyo ay dapat maging lingkod ninyo.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐχ οὕτως δέ ἐστιν ἐν ὑμῖν
  choice: Ngunit hindi ganito sa inyo
  rationale: Likas at maikli nitong ipinapahayag ang pagtutol sa paraan ng pamumuno na binanggit sa naunang konteksto. Ang “ngunit” ay kumakatawan sa adversatibong δέ, at hindi dinaragdagan ng tahasang pautos ang pangungusap.
- source_word: ἀλλ’
  choice: Sa halip
  rationale: Malinaw nitong ipinakikita ang matinding pagsalungat at ang kapalit na huwaran ng kadakilaan na itinuturo ni Jesus.
- source_word: ὃς ἂν θέλῃ
  choice: ang sinumang nagnanais
  rationale: Pinananatili ng “sinuman” ang pangkalahatan at di-tiyak na kondisyon ng ὃς ἂν, habang ipinahahayag ng “nagnanais” ang kusang hangarin ng θέλῃ.
- source_word: μέγας γενέσθαι
  choice: maging dakila
  rationale: Ipinahahayag ng “maging” ang pagpasok sa isang kalagayan na taglay ng γενέσθαι, at pinananatili ng “dakila” ang wika tungkol sa katayuan nang hindi ito nililimitahan sa pagiging sikat.
- source_word: ἐν ὑμῖν
  choice: sa inyo
  rationale: Natural itong tumutukoy sa loob ng kanilang pamayanan. Ginamit ito sa dalawang paglitaw ng parirala upang mapanatili ang pagkakaugnay ng talata.
- source_word: ἔσται ὑμῶν διάκονος
  choice: ay magiging lingkod ninyo
  rationale: Pinananatili ng “magiging” ang anyong panghinaharap ng ἔσται, samantalang ang “lingkod” ay nagpapahayag ng mapagpakumbabang paglilingkod ng διάκονος nang hindi ipinapalagay na tumutukoy ito sa isang opisyal na katungkulan sa iglesya.
theological_decisions:
- issue: Lakas ng panghinaharap na ἔσται sa tagubilin ni Jesus
  choice: ay magiging lingkod ninyo
  alternative: dapat maging lingkod ninyo
  rationale: Maaaring may puwersang pautos o normatibo ang panghinaharap sa kontekstong ito, ngunit pinananatili sa pangunahing salin ang anyong panghinaharap ng Griyego. Inilalahad sa talababa ang posibleng diwang “dapat” upang hindi alisin ang tunay na sintaktikong tensiyon.
- issue: Kahulugan ng διάκονος
  choice: lingkod
  alternative: tagapaglingkod; ministro
  rationale: Sa konteksto, tumutukoy ito sa isang taong naglilingkod nang may kababaang-loob, hindi kinakailangan sa isang pormal na katungkulan sa iglesya. Iniiwasan ng “lingkod” ang pagpasok ng ganitong mas huling teknikal na kahulugan.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang maikli at matinding paghahambing ng Griyego, iniwasan ang teknikal na katawagang pansimbahan, at inilagay kaagad sa pangunahing teksto ang lahat ng panandang talababa.
