revisions:
- from: 'Tiningnan siyang mabuti ni Jesus at minahal siya. Sinabi ni Jesus sa kanya, “Isang bagay ang kulang sa iyo: humayo ka, ipagbili mo ang lahat ng mayroon ka[a] at ibigay sa mga dukha. Sa gayon, magkakaroon ka ng kayamanan sa langit. Pagkatapos, halika at sumunod ka sa akin.”'
  to: 'Matamang tiningnan siya ni Jesus at minahal siya. Sinabi niya sa kanya, “Isang bagay ang kulang sa iyo: pumunta ka, ipagbili mo ang lahat ng mayroon ka[a] at ibigay sa mga mahihirap, at magkakaroon ka ng kayamanan sa langit. Halika, sumunod ka sa akin.”'
  rationale: Inalis ang mga pang-ugnay na nagdaragdag ng temporal o inferensiyal na puwersa na wala sa Griyego. Pinakinis ang mga salita upang maging mas natural sa modernong Filipino Tagalog, habang pinanatili ang marangal ngunit payak na register, ang diretsong “minahal siya,” at ang komprehensibong lakas ng utos hinggil sa mga pag-aari. Nananatili ang talababa upang katawanin ang leksikal na alternatibo ng ὅσα ἔχεις.
