id: MRK.10.21
reference: Mark 10:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἐμβλέψας αὐτῷ ἠγάπησεν αὐτὸν καὶ εἶπεν αὐτῷ· Ἕν ⸀σε ὑστερεῖ· ὕπαγε ὅσα ἔχεις πώλησον καὶ δὸς ⸀τοῖς πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν οὐρανῷ, καὶ δεῦρο ἀκολούθει ⸀μοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/021.yaml
  text: 'And Jesus[a], looking at him, loved him and said to him, “One thing you lack: go, sell whatever you have and give to the poor, and you will have treasure in heaven; and come, follow me.”'
translation:
  language: tl
  text: 'Matamang tiningnan siya ni Jesus at minahal siya. Sinabi niya sa kanya, “Isang bagay ang kulang sa iyo: pumunta ka, ipagbili mo ang lahat ng mayroon ka[a] at ibigay sa mga mahihirap, at magkakaroon ka ng kayamanan sa langit. Halika, sumunod ka sa akin.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “anumang mayroon ka.” Ang Griegong ὅσα ἔχεις ay maaaring mangahulugang “anumang mayroon ka” o “lahat ng mayroon ka”; ipinahihiwatig ng konteksto na saklaw nito ang kabuuan ng kanyang mga pag-aari.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβλέψας αὐτῷ
  choice: Tiningnan siyang mabuti
  rationale: Ipinahihiwatig ng pandiwari ang tuwiran at masusing pagtingin kay Jesus sa lalaki. Likas sa modernong Tagalog ang “tiningnan siyang mabuti” at hindi nito labis na pinatitindi ang kilos.
- source_word: ἠγάπησεν αὐτόν
  choice: minahal siya
  rationale: Ito ang payak at tuwirang katumbas ng pandiwa at pinananatili ang tunay na pagmamahal ni Jesus sa lalaki.
- source_word: Ἕν σε ὑστερεῖ
  choice: Isang bagay ang kulang sa iyo
  rationale: Ginagamit nang pangngalan ang neuter na Ἕν; natural na nililinaw ito sa Tagalog sa pamamagitan ng “isang bagay.”
- source_word: ὕπαγε
  choice: humayo ka
  rationale: Tuwirang pautos ito na umalis upang gawin ang kasunod na ipinag-uutos. Ang “humayo ka” ay malinaw, marangal, at angkop sa pananalita ni Jesus.
- source_word: ὅσα ἔχεις
  choice: ang lahat ng mayroon ka
  rationale: Maaaring tumukoy ang parirala sa “anumang mayroon ka” o “lahat ng mayroon ka.” Pinili ang ikalawa dahil malinaw sa konteksto ang kabuuang saklaw ng mga pag-aari ng lalaki, habang itinatala sa talababa ang leksikal na alternatibo.
- source_word: πώλησον
  choice: ipagbili mo
  rationale: Payak na pautos na tumutukoy sa pagbebenta; natural sa Tagalog ang “ipagbili mo” dahil hayag ang bagay na ibebenta.
- source_word: δὸς τοῖς πτωχοῖς
  choice: ibigay sa mga dukha
  rationale: Ang substantibong pang-uri ay tumutukoy sa mga taong dukha. Pinananatili ng “mga dukha” ang pangkat panlipunang tinutukoy.
- source_word: θησαυρὸν ἐν οὐρανῷ
  choice: kayamanan sa langit
  rationale: Tumpak at natural na katumbas ito na hindi nagpapaliwanag nang higit sa sinasabi ng teksto.
- source_word: δεῦρο ἀκολούθει μοι
  choice: halika at sumunod ka sa akin
  rationale: Pinananatili nito kapwa ang paanyayang lumapit at ang utos na maging tagasunod ni Jesus. Likas na ipinahihiwatig ng “sumunod ka sa akin” ang patuloy na pagiging alagad.
theological_decisions:
- issue: Kahulugan ng pagmamahal ni Jesus sa lalaki
  choice: minahal siya
  alternative: nagpakita siya ng kabutihan sa kanya; minahal niya siya sa isang teknikal na diwang teolohikal
  rationale: Tahasang sinasabi ng teksto na minahal ni Jesus ang lalaki. Hindi ito pinahihina bilang simpleng kabaitan at hindi rin nilalagyan ng isang sistematikong kahulugang hindi tahasang ipinahahayag ng talata.
- issue: Saklaw ng utos tungkol sa mga pag-aari
  choice: ipagbili mo ang lahat ng mayroon ka
  alternative: ipagbili mo ang anumang mayroon ka; maging mapagbigay ka sa mga dukha
  rationale: Sa konteksto, komprehensibo ang saklaw ng ὅσα ἔχεις. Pinananatiling mariin ang utos at hindi ito pinalalambot tungo sa pangkalahatang pagkakawanggawa; gayunman, inilalahad sa talababa ang posibleng mas literal na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “humayo” at “mga dukha” bilang dignidad na pananalita ngunit iniwasan ang lipas o labis na pormal na estruktura. Hinati ang mahabang pahayag sa maiikling pangungusap upang maging madaling maunawaan nang hindi binabago ang lohikal na daloy.
