  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Τί ὑμῖν ἐνετείλατο Μωϋσῆς;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/003.yaml
  text: But he answered them, “What did Moses command you?”
translation:
  language: tl
  text: Ngunit sumagot siya sa kanila, “Ano ang iniutos sa inyo ni Moises?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Isang banayad na pang-ugnay ang δέ; ang “Ngunit” ay angkop sa bahagyang pagsalungat at pagbaling ng usapan mula sa tanong na pansubok ng mga Pariseo.
- source_word: ἀποκριθεὶς εἶπεν
  choice: sumagot siya
  rationale: Ang karaniwang pariralang Griyego na literal na “pagkasagot ay sinabi” ay likas at sapat na ipinapahayag sa Filipino bilang “sumagot siya,” nang hindi inuulit ang iisang diwa.
- source_word: αὐτοῖς
  choice: sa kanila
  rationale: Tumutukoy ito sa mga Pariseong kausap ni Jesus at likas na ipinapahayag bilang di-tuwirang layon na “sa kanila.”
- source_word: Τί
  choice: Ano
  rationale: Naghahanap ang τί ng nilalaman ng iniutos, kaya malinaw at likas ang “Ano.”
- source_word: ὑμῖν
  choice: sa inyo
  rationale: Ipinakikita ng datibo kung sino ang pinag-ukulan ng utos; natural itong isalin na “sa inyo.”
- source_word: ἐνετείλατο
  choice: iniutos
  rationale: Ang ἐντέλλομαι ay tumutukoy sa pagbibigay ng utos na may awtoridad; pinananatili ng “iniutos” ang legal at makapangyarihang diwa sa talakayan.
- source_word: Μωϋσῆς
  choice: Moises
  rationale: Ginamit ang nakagawiang anyo ng pangalang ito sa modernong saling Filipino.
theological_decisions:
- issue: Ang pagtukoy sa awtoridad ni Moises sa sagot ni Jesus
  choice: Panatilihing si “Moises” ang tahasang pinangalanang nag-utos.
  alternative: “Ano ang iniuutos sa inyo ng Kautusan ni Moises?” o “Ano ang iniutos sa inyo ng Diyos sa pamamagitan ni Moises?”
  rationale: Si Moises mismo ang tahasang pinangalanan sa Griyego. Ang pagdaragdag ng “Kautusan” o “Diyos sa pamamagitan ni Moises” ay paliwanag na hindi nakasaad sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Pinanatili ang maikling tanong at ang bahagyang pagsalungat ng δέ nang walang dagdag na paliwanag.
