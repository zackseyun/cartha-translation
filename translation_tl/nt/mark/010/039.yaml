base_translation:
  language: en
  yaml_path: translation/nt/mark/010/039.yaml
  text: And they said to him[a], “We are able.” But Jesus said to them, “The cup that I drink, you will drink; and the baptism with which I am baptized[b], you will be baptized,”
translation:
  language: tl
  text: Sinabi nila sa kanya, “Kaya namin.” Ngunit sinabi ni Jesus sa kanila, “Ang kopang iniinom ko ay iinumin ninyo, at ang bautismong dinaranas ko ay daranasin din ninyo.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kopa” at “bautismo” ay mga metapora para sa pagdurusa at kapalarang malapit nang danasin ni Jesus, na mararanasan din ng kanyang mga alagad.
    reason: cross_reference
lexical_decisions:
- source_word: Δυνάμεθα
  choice: Kaya namin
  rationale: Natural at tuwirang katumbas sa modernong Tagalog ng pahayag na kaya nilang gawin ang tinutukoy; napapanatili ang tiwala at kaiklian ng sagot.
- source_word: ποτήριον
  choice: kopa
  rationale: Pinananatili ang kongkretong metapora ng Griyego para sa itinakdang karanasan o kapalaran, sa halip na agad itong ipaliwanag bilang pagdurusa.
- source_word: πίνω / πίεσθε
  choice: iniinom ko / iinumin ninyo
  rationale: Pinananatili ang paralelismo ng pangkasalukuyan at panghinaharap na mga pandiwa at ang larawan ng pakikibahagi sa iisang kopa.
- source_word: βάπτισμα
  choice: bautismo
  rationale: Karaniwang terminong biblikal sa Tagalog na nagpapanatili sa metapora at sa ugnayan nito sa pandiwang βαπτίζομαι.
- source_word: βαπτίζομαι / βαπτισθήσεσθε
  choice: tinatanggap ko / tatanggapin ninyo
  rationale: Sa Tagalog, ang 'tumatanggap ng bautismo' ay natural at malinaw; pinananatili nito ang pasibong diwa at ang pag-uulit ng 'bautismo' nang hindi gumagamit ng mabigat na 'binabautismuhan.'
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Ngunit sinabi sa kanila ni Jesus
  rationale: Ang 'Ngunit' ay nagpapahayag ng banayad na pagsalungat sa kanilang tiyak na sagot at sa kasunod na pagtutuwid ni Jesus.
theological_decisions:
- issue: Metaporikal na gamit ng kopa at bautismo
  choice: Panatilihin sa pangunahing teksto ang dalawang metapora at ipaliwanag lamang sa talababa ang kaugnayan sa pagdurusa at kapalaran ni Jesus.
  alternative: Isalin ang mga ito nang tahasan bilang pagdurusa, kamatayan, o pagiging martir.
  rationale: Ang mismong Griyego ay gumagamit ng mga larawang mayaman sa biblikal na kahulugan. Ang tuwirang pagpapalit sa mga ito ng interpretasyon ay magpapaliit sa saklaw ng pahayag.
- issue: Ugnayan sa sakramental na bautismo
  choice: Gamitin ang 'bautismo' ngunit hayaang ipakita ng konteksto at talababa na metaporikal ang gamit dito.
  alternative: Gamitin ang 'paglulubog' o 'matinding pagsubok' upang iwasan ang sakramental na pagbasa.
  rationale: Ang βάπτισμα ay nararapat kilalaning 'bautismo,' samantalang malinaw sa konteksto na tumutukoy ito sa karanasang pagdaraanan ni Jesus at ng mga alagad.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “Kaya namin” sa halip na mas pormal at hindi gaanong likas na “May kakayahan kami.” Pinanatili ang “kopa” at “bautismo” bilang mga susing larawang biblikal.
