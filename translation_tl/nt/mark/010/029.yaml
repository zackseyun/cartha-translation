id: MRK.10.29
reference: Mark 10:29
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸂ἔφη ὁ Ἰησοῦς⸃· Ἀμὴν λέγω ὑμῖν, οὐδείς ἐστιν ὃς ἀφῆκεν οἰκίαν ἢ ἀδελφοὺς ἢ ἀδελφὰς ἢ ⸂μητέρα ἢ πατέρα⸃ ἢ τέκνα ἢ ἀγροὺς ἕνεκεν ἐμοῦ καὶ ἕνεκεν τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/029.yaml
  text: Jesus said, “Truly I say to you, there is no one who has left house or brothers or sisters or mother or father or children or fields for my sake and for the sake of the gospel,”
translation:
  language: tl
  text: 'Sinabi ni Jesus, “Sinasabi ko sa inyo ang totoo: walang sinumang nag-iwan ng bahay, mga kapatid na lalaki, mga kapatid na babae, ina, ama,[a] mga anak, o mga bukid alang-alang sa akin at alang-alang sa ebanghelyo,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang sinaunang manuskrito, nauuna ang “ama” kaysa sa “ina.”
    reason: Ipinapaalam ang tekstuwal na pagkakaiba sa ayos ng dalawang salita nang hindi binabago ang kahulugan ng pangunahing teksto.
lexical_decisions:
- source_word: ἔφη
  choice: Sinabi
  rationale: Payak at natural na panumbas sa pandiwang nagpapakilala sa sinabi ni Jesus; hindi nito idinaragdag ang diwa ng pagsagot o pagpapahayag na wala sa mismong salita.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Tinitiyak ko sa inyo
  rationale: Likas na makabagong Tagalog para sa taimtim na pormulang panimula ng isang tiyak at makapangyarihang pahayag. Iniiwasan nito ang di-likas na literal na ayos habang pinananatili ang solemnidad.
- source_word: οὐδείς ἐστιν ὃς
  choice: walang sinumang
  rationale: Maikli at natural na pagpapahayag ng pangkalahatang pasalungat na konstruksyon sa Griyego.
- source_word: ἀφῆκεν
  choice: nag-iwan
  rationale: Pinananatili ang diwa ng pag-alis o pagtalikod mula sa tahanan, mga ugnayan, o ari-arian nang hindi ipinahihiwatig na itinakwil o pinabayaan ang mga pananagutan sa pamilya.
- source_word: οἰκίαν
  choice: bahay
  rationale: Tuwiran at kongkretong panumbas; hindi nito inililipat ang kahulugan tungo sa buong sambahayan.
- source_word: ἀδελφοὺς
  choice: mga kapatid na lalaki
  rationale: Tiyak na tumutukoy sa mga kapatid na lalaki, sapagkat hiwalay na binanggit sa teksto ang mga kapatid na babae.
- source_word: ἀδελφὰς
  choice: mga kapatid na babae
  rationale: Tuwirang panumbas na nagpapanatili sa hiwalay na pagbanggit sa mga babaeng kapatid.
- source_word: μητέρα ἢ πατέρα
  choice: ina, ama
  rationale: Pinananatili ang ayos at tahasang pagbanggit sa dalawang magulang sa pangunahing tekstong Griyego.
- source_word: τέκνα
  choice: mga anak
  rationale: Natural at malawak na katawagan sa mga supling anuman ang kasarian.
- source_word: ἀγρούς
  choice: mga bukid
  rationale: Kongkreto at malapit na panumbas sa mga lupang sinasaka; hindi kasinglawak ng 'mga lupain' at hindi kasing-interpretatibo ng 'mga sakahan'.
- source_word: ἕνεκεν ἐμοῦ καὶ ἕνεκεν τοῦ εὐαγγελίου
  choice: alang-alang sa akin at alang-alang sa ebanghelyo
  rationale: Ang pag-uulit ng 'alang-alang sa' ay sumasalamin sa dalawang ulit na ἕνεκεν at malinaw na pinananatili ang dalawang kaugnay na dahilan.
theological_decisions:
- issue: Paglalarawan sa halaga ng pagsunod nang hindi pinalalabis ang pagtalikod sa mga pananagutan sa pamilya
  choice: nag-iwan
  alternative: tinalikuran / pinabayaan
  rationale: Ang ἀφῆκεν ay maaaring tumukoy sa pag-iwan dahil sa pagsunod kay Jesus, ngunit hindi kinakailangang mangahulugan ng ganap na pagtatakwil o pagpapabaya. Pinananatili ng 'nag-iwan' ang tensiyon at halaga ng pagiging alagad nang hindi nagdaragdag ng mas mabigat na teolohikal na pahayag.
- issue: Ugnayan ng katapatan kay Jesus at sa ebanghelyo
  choice: alang-alang sa akin at alang-alang sa ebanghelyo
  alternative: dahil sa akin at sa ebanghelyo
  rationale: Ang 'alang-alang sa' ay malinaw na nagsasaad ng layunin o kapakanan at pinananatili ang magkatambal na pagtukoy kay Jesus at sa ebanghelyo nang hindi ipinapaliwanag o pinaghihiwalay ang kanilang teolohikal na ugnayan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Tinitiyak ko sa inyo” bilang natural na pormulang taimtim, at pinanatiling tahasan ang magkakahiwalay na miyembro ng pamilya at ang pag-uulit ng “alang-alang sa.”
