  yaml_path: translation/nt/mark/010/040.yaml
  text: But to sit at my right or at my left is not mine to give[a], but for those for whom it has been prepared.
translation:
  language: tl
  text: Ngunit ang pag-upo sa kanan ko o sa kaliwa ko ay hindi sa akin ang magkaloob, kundi para sa mga taong pinaghandaang maupo roon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “hindi para sa akin ang magkaloob.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ... καθίσαι
  choice: ang pag-upo
  rationale: Ang infinitibong may pantukoy ay ginagamit na parang pangngalan. Natural sa Filipino ang “ang pag-upo,” habang napapanatili ang diwa ng kilos.
- source_word: ἐκ δεξιῶν μου
  choice: sa kanan ko
  rationale: Tumutukoy ang idyoma sa puwesto sa kanang panig ni Jesus; malinaw at natural ito nang hindi idinaragdag ang “kamay,” na hindi tahasang nasa Griyego.
- source_word: ἢ ἐξ εὐωνύμων
  choice: o sa kaliwa ko
  rationale: Ipinaparis nito ang puwesto sa kaliwang panig sa naunang “sa kanan ko.”
- source_word: οὐκ ἔστιν ἐμὸν δοῦναι
  choice: ay hindi akin ang magbigay
  rationale: Malapit itong sumusunod sa Griyego at pinananatili ang tensiyon tungkol sa kung kaninong karapatan ang pagkakaloob, nang walang idinagdag na paliwanag.
- source_word: ἀλλ’ οἷς
  choice: kundi para sa mga
  rationale: Elliptical ang Griyego; likas na tinutumbasan ng “kundi para sa mga” ang ipinahihiwatig na mga puwestong nakalaan sa ilang tao.
- source_word: ἡτοίμασται
  choice: pinaghandaan nito
  rationale: Ipinahihiwatig ng perpektong balintiyak na naisagawa na ang paghahanda at nananatili ang bunga nito. Ang “pinaghandaan” ay natural at iniiwang di-tiyak ang gumagawa, gaya ng balintiyak sa Griyego.
theological_decisions:
- issue: Kung ang sinabi ni Jesus ay dapat ipaliwanag bilang lubos na pagtanggi sa awtoridad niya o bilang limitasyon lamang sa konteksto
  choice: Panatilihin ang tuwirang “hindi akin ang magbigay.”
  alternative: “Hindi para sa akin ang magbigay” o “hindi akin ang magbigay nang hiwalay sa kalooban ng Ama.”
  rationale: Hindi ipinaliliwanag ng Griyego ang dahilan o saklaw ng limitasyon. Hindi idinaragdag ang pagtukoy sa kalooban ng Ama upang hindi lutasin sa salin ang tunay na teolohikal na tensiyon ng teksto.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Pinanatili ang balanseng “sa kanan ko o sa kaliwa ko,” ang balintiyak na paghahanda, at ang hindi ipinaliwanag na limitasyon sa pahayag ni Jesus.
