  source_fidelity: 'Tumpak ang pangunahing kahulugan: ang pag-upo sa kanan o kaliwa ni Jesus ay hindi niya ipinagkakaloob, at ang mga puwesto ay inihanda na para sa ilang tao. Gayunman, ang “mga pinaghandaan nito” ay may malabong panghalip na “nito” at maaaring hindi agad matukoy kung ano ang inihanda o kung para kanino.'
