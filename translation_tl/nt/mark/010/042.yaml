id: MRK.10.42
reference: Mark 10:42
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸂καὶ προσκαλεσάμενος αὐτοὺς ὁ Ἰησοῦς⸃ λέγει αὐτοῖς· Οἴδατε ὅτι οἱ δοκοῦντες ἄρχειν τῶν ἐθνῶν κατακυριεύουσιν αὐτῶν καὶ οἱ μεγάλοι αὐτῶν κατεξουσιάζουσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/042.yaml
  text: And Jesus called them to himself and said to them[a], “You know that those who are considered rulers of the Gentiles lord it over them[b], and their great ones exercise authority over them.”
translation:
  language: tl
  text: At tinawag ni Jesus ang mga ito na lumapit sa kanya at sinabi sa kanila, “Alam ninyo na ang mga itinuturing na namumuno[a] sa mga Hentil[b] ay mapaniil na namumuno sa kanila, at ipinaiiral sa kanila ng mga makapangyarihan ang kanilang kapangyarihan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga waring namumuno.”
    reason: lexical_alternative
  - marker: b
    text: O “mga bansa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: tinawag sila ... palapit sa kanya
  rationale: Ipinahahayag nito ang diwa ng middle voice na tinawag ni Jesus ang mga alagad na lumapit sa kanya, sa natural na modernong Tagalog.
- source_word: λέγει
  choice: sinabi
  rationale: Bagaman historical present ang Griyego, mas natural sa salaysay na Tagalog ang pangnagdaang “sinabi.”
- source_word: Οἴδατε
  choice: Alam ninyo
  rationale: Tuwirang ipinapahayag ang kasalukuyang diwa ng οἶδα at natural sa karaniwang pananalita.
- source_word: οἱ δοκοῦντες ἄρχειν
  choice: ang mga itinuturing na namumuno
  rationale: Pinananatili ang diwa ng pagkilala o pagtingin ng iba nang hindi ipinahihiwatig na hindi talaga sila namumuno; inilalahad sa talababa ang posibleng diwang “waring.”
- source_word: τῶν ἐθνῶν
  choice: sa mga Hentil
  rationale: Sa kontekstong Judio ng pahayag, tumutukoy ito sa mga bansang hindi Judio; pinananatili sa talababa ang mas pangkalahatang “mga bansa.”
- source_word: κατακυριεύουσιν
  choice: naghahari-harian sa kanila
  rationale: Natural na Tagalog ito para sa mapang-api at mapangibabaw na paraan ng pamumuno na ipinahihiwatig ng tambalang pandiwa.
- source_word: οἱ μεγάλοι αὐτῶν
  choice: mga makapangyarihan
  rationale: Sa konteksto, ang μέγαλοι ay mga taong mataas ang katayuan at malakas ang impluwensiya; mas malinaw ito sa modernong Tagalog kaysa sa literal ngunit di-natural na “mga dakila nila.”
- source_word: κατεξουσιάζουσιν
  choice: ipinaiiral ... ang kanilang kapangyarihan
  rationale: Pinananatili nito ang ideya ng aktuwal na paggamit ng awtoridad at ang pagkakaiba nito sa mas matinding “naghahari-harian.”
theological_decisions:
- issue: Tinutukoy ng τῶν ἐθνῶν
  choice: mga Hentil
  alternative: mga bansa
  rationale: Akma ang “mga Hentil” sa kontekstong Judio at sa kaibahan sa pamumuhay ng mga alagad, ngunit leksikal ding posible ang “mga bansa,” kaya isinama ito sa talababa.
- issue: Diwa ng δοκοῦντες
  choice: itinuturing na namumuno
  alternative: waring namumuno
  rationale: Hindi kinakailangang itinatanggi ng parirala ang tunay nilang awtoridad; maaari itong tumukoy sa mga kinikilalang tagapamahala. Gayunman, pinananatili sa talababa ang tunay na posibilidad ng diwang “waring.”
translation_notes:
  register: Modernong, marangal, at madaling maunawaang Filipino. Ginamit ang “naghahari-harian” upang malinaw na maipakita ang mapangibabaw na himig, samantalang ang ikalawang sugnay ay mas tuwirang tumutukoy sa paggamit ng kapangyarihan. Lahat ng talababa ay may katumbas na marker sa pangunahing teksto.
