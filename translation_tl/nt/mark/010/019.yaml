source:
  edition: SBLGNT
  text: τὰς ἐντολὰς οἶδας· Μὴ ⸂φονεύσῃς, Μὴ μοιχεύσῃς⸃, Μὴ κλέψῃς, Μὴ ψευδομαρτυρήσῃς, Μὴ ἀποστερήσῃς, Τίμα τὸν πατέρα σου καὶ τὴν μητέρα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/019.yaml
  text: 'You know the commandments: Do not murder[a], do not commit adultery, do not steal, do not bear false witness, do not defraud[b], honor your father and mother.'
translation:
  language: tl
  text: 'Alam mo ang mga utos: Huwag kang papaslang[a]; huwag kang mangangalunya; huwag kang magnanakaw; huwag kang magbigay ng huwad na patotoo; huwag mong ipagkait sa iba ang nararapat sa kanila[b]; igalang mo ang iyong ama at ina.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “Huwag kang pumatay.” Ang pandiwang Griyego ay mas tiyak na tumutukoy sa pagpaslang o labag-sa-katarungang pagpatay sa tao, hindi sa lahat ng uri ng pagkitil ng buhay.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isaling “huwag kang mandaraya” o “huwag mong agawan ang iba.” Tumutukoy ito sa pagkakait sa isang tao ng bagay na nararapat sa kanya, kadalasan sa pamamagitan ng pagsasamantala.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰς ἐντολὰς
  choice: ang mga utos
  rationale: Natural at malinaw na katawagan sa Filipino para sa mga utos ng Diyos, at ang konteksto ay tahasang tumutukoy sa Sampung Utos.
- source_word: οἶδας
  choice: Alam mo
  rationale: Bagaman nasa anyong perfect, may pangkasalukuyang diwa ang οἶδα sa Koine Greek; likas itong isalin na “alam mo.”
- source_word: Μὴ φονεύσῃς
  choice: Huwag kang papatay ng tao
  rationale: Ang φονεύω ay tumutukoy sa pagpaslang o labag-sa-katarungang pagkitil ng buhay ng tao, hindi sa lahat ng uri ng pagpatay. Pinananatili ng pariralang ito ang pamilyar na anyo ng utos, habang nililinaw ng talababa ang saklaw.
- source_word: Μὴ μοιχεύσῃς
  choice: huwag kang mangangalunya
  rationale: Ang “mangangalunya” ang tuwiran, pamilyar, at angkop na salin ng μοιχεύω sa kontekstong moral at legal.
- source_word: Μὴ κλέψῃς
  choice: huwag kang magnanakaw
  rationale: Karaniwan at eksaktong salin ng κλέπτω sa anyo ng isang utos.
- source_word: Μὴ ψευδομαρτυρήσῃς
  choice: huwag kang sasaksi nang kasinungalingan
  rationale: Pinananatili nito ang legal at testimonial na diwa ng ψευδομαρτυρέω, sa halip na palawakin lamang bilang “huwag magsinungaling.”
- source_word: Μὴ ἀποστερήσῃς
  choice: huwag mong pagkakaitan ang iba ng nararapat sa kanila
  rationale: Ang ἀποστερέω ay tumutukoy sa pagkakait o pagpigil ng isang bagay na may karapatan ang iba na tanggapin, kadalasan sa pamamagitan ng pagsasamantala. Mas malinaw ito sa ordinaryong Filipino kaysa sa teknikal na “mandaya.”
- source_word: Τίμα
  choice: igalang mo
  rationale: Sa Filipino, ang “igalang” ay natural at marangal na katumbas ng pag-uutos na kilalanin at bigyang-dangal ang mga magulang.
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα
  choice: ang iyong ama at ina
  rationale: Natural na Filipino na nagpapanatili sa tuwirang pagtukoy sa parehong magulang nang hindi inuulit ang panghalip.
theological_decisions:
- issue: Paraan ng pagsasalin sa mga utos na hinango sa Sampung Utos
  choice: Gumamit ng pamilyar na anyo ng mga utos ngunit sundin ang tiyak na diwa ng mga salitang Griyego
  alternative: Gumamit ng lubos na tradisyonal na pananalita o malayang makabagong paraphrase
  rationale: Dapat makilala ng mambabasa ang alusyon sa Sampung Utos, ngunit hindi dapat palawakin ang φονεύω upang mangahulugan ng lahat ng pagkitil ng buhay o paliitin ang ἀποστερέω sa isang uri lamang ng pandaraya.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikli at sunod-sunod na anyo ng mga utos. Ginamit ang “nang kasinungalingan” upang ilarawan ang paraan ng pagsaksi, at ang mas malinaw na parirala para sa ἀποστερέω upang maiwasan ang malabo o labis na teknikal na pananalita.
