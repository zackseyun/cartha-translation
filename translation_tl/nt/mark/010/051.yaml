  text: καὶ ἀποκριθεὶς ⸂αὐτῷ ὁ Ἰησοῦς εἶπεν⸃· Τί ⸂σοι θέλεις ποιήσω⸃; ὁ δὲ τυφλὸς εἶπεν αὐτῷ· Ραββουνι, ἵνα ἀναβλέψω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/051.yaml
  text: And answering him[a], Jesus said, “What do you want me to do for you?” And the blind man said to him, “Rabboni, that I may see again.”
translation:
  language: tl
  text: At sumagot si Jesus sa kanya, “Ano ang gusto mong gawin ko para sa iyo?” At sinabi naman sa kanya ng bulag na lalaki, “Rabboni[a], upang muli akong makakita.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Rabboni ay isang Aramaikong pantawag na nangangahulugang “guro ko” o “panginoon ko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: sumagot
  rationale: Isinasalin ang aorist participle bilang pandiwang may hangganan upang maging natural sa modernong Tagalog; pinananatili ng “At sumagot” ang tugon sa naunang pakiusap.
- source_word: Τί σοι θέλεις ποιήσω
  choice: Ano ang gusto mong gawin ko para sa iyo?
  rationale: Malinaw na naipapahayag ng “gusto mo” ang volitional na θέλεις at ng “para sa iyo” ang datibong σοι, sa natural na ayos ng Tagalog.
- source_word: τυφλὸς
  choice: ang lalaking bulag
  rationale: Substantival ang pang-uri sa Griyego. Ang “lalaking bulag” ay natural at tumutukoy sa partikular na taong kausap ni Jesus.
- source_word: Ραββουνι
  choice: Rabboni
  rationale: Pinananatili ang transliteradong Semitikong pantawag na nasa tekstong Griyego upang mapanatili ang natatanging kulay at diin nito; ipinaliliwanag ang kahulugan sa talababa.
- source_word: ἵνα ἀναβλέψω
  choice: makakita sana akong muli
  rationale: Sa konteksto ng pagpapagaling, ang ἀναβλέπω ay nangangahulugang muling makakita o manumbalik ang paningin. Ang “sana” ay likas na paraan sa Tagalog upang ipahayag dito ang hinihiling na layunin nang hindi ginagawang tahasang utos.
theological_decisions:
- issue: Paglilipat sa Ραββουνι bilang pantawag
  choice: Pinanatili ang “Rabboni” sa pangunahing teksto at ipinaliwanag sa talababa.
  alternative: “Guro ko” o “Panginoon/Ginoo ko”
  rationale: Ang tekstong Griyego mismo ay nagpapanatili ng transliteradong Semitikong pantawag sa halip na palitan ito ng karaniwang salitang Griyego. Ang transliterasyon at maikling paliwanag ay nagpapanatili kapwa ng teksturang historikal at ng kahulugan nang hindi nag-aangkat ng denominasyonal na pakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang karaniwang ayos na “Sinabi sa kanya” at iniwasan ang labis na literal na participial construction na magiging alanganin sa Tagalog. Ang marker na [a] ay inilagay kaagad pagkatapos ng “Rabboni,” ang salitang aktuwal na ipinaliliwanag ng talababa.
