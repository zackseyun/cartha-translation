  yaml_path: translation/nt/mark/009/034.yaml
  text: But they kept silent[a], because on the road they had argued with one another about who was greater.
translation:
  language: tl
  text: Ngunit nanatili silang tahimik, sapagkat nagtalo-talo sila sa daan tungkol sa kung sino sa kanila ang mas dakila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, “kung sino sa kanila ang pinakadakila.” Pahambing ang anyo ng salitang Griyego: “mas dakila.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσιώπων
  choice: nanatili silang tahimik
  rationale: Ipinahihiwatig ng imperpekto ang patuloy nilang pananahimik bilang tugon sa tanong ni Jesus; likas ito sa Filipino at mas malinaw kaysa simpleng “tumahimik sila.”
- source_word: διελέχθησαν
  choice: nagtalo sila
  rationale: Bagaman maaari itong tumukoy sa pag-uusap o pagtatalo, ang usapin tungkol sa katayuan ay nagbibigay rito ng mapagtunggaling diwa. Ang naganap nang kilos ay ipinahihiwatig ng konteksto at ng “habang nasa daan.”
- source_word: πρὸς ἀλλήλους
  choice: sa kanila
  rationale: Sa pariralang “kung sino sa kanila,” naipahihiwatig nang natural sa Filipino na ang pagtatalo ay magkakasangkot at tungkol sa paghahambing sa loob ng grupo.
- source_word: ἐν τῇ ὁδῷ
  choice: habang nasa daan
  rationale: Natural na salin ito para sa tagpuan ng kanilang paglalakbay at malinaw na inilalagay ang pagtatalo bago ang kasalukuyang pananahimik.
- source_word: τίς μείζων
  choice: kung sino sa kanila ang mas dakila
  rationale: Pinananatili ng “mas dakila” ang pahambing na anyo ng μείζων sa halip na gawin itong pasukdol na “pinakadakila.” Idinagdag ang “sa kanila” upang maging likas at malinaw ang pahambing sa Filipino.
- source_word: οἱ δὲ
  choice: Ngunit ... sila
  rationale: Ang “ngunit” ay nagpapakita ng banayad na pagsalungat sa naunang tanong ni Jesus, at ang “sila” ang likas na panghalip para sa tinutukoy na mga alagad.
- source_word: γὰρ
  choice: sapagkat
  rationale: Malinaw nitong ipinakikita na ang naunang pagtatalo ang dahilan ng kanilang pananahimik, habang pinananatili ang marangal na rehistro.
theological_decisions:
- issue: Pahambing na μείζων laban sa idyomatikong pasukdol
  choice: mas dakila
  alternative: pinakadakila
  rationale: Ang Griyego ay gumagamit ng pahambing. Pinananatili ng salin ang tunay na anyo at tensiyon ng tanong tungkol sa katayuan nang hindi ito pinapakinis bilang pasukdol.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ang “nanatili silang tahimik” ay naglalarawan ng nagpapatuloy na katahimikan; ang “mas dakila” ay nagpapanatili sa pahambing na anyo ng orihinal.
