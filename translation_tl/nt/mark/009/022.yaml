  source_fidelity: Kailangang itama ang “upang siya'y patayin,” dahil pinapakitid nito ang ἀπολέσῃ sa pagpatay lamang. Mas tapat ang “upang siya'y ipahamak,” na pinananatili ang mapanirang layunin nang hindi inuunahan ang mas malawak na saklaw ng pandiwa. Ang “mga anyong tubig” ay likas na paraan upang katawanin ang maramihang ὕδατα.
  naturalness: Mas natural sa makabagong Filipino ang “inihagis siya nito” kaysa “siya'y inihagis nito,” at “mga anyong tubig” kaysa sa hindi pangkaraniwang “mga tubig.” Ang “tulungan mo kami at kahabagan mo kami” ay malinaw at marangal, bagaman ang participial na anyo ng Griyego ay isinasalin bilang magkaugnay na pakiusap.
  terminology: Ang “ipahamak” ay angkop para sa ἀπόλλυμι sa kontekstong ito at hindi ito nagtatakda na pagpatay lamang ang ibig sabihin. Ang “kahabagan” ay angkop na katumbas ng σπλαγχνισθείς at hindi nagpapataw ng doktrinal na pakahulugan.
