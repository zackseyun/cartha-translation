base_translation:
  language: en
  yaml_path: translation/nt/mark/009/022.yaml
  text: And many times it has thrown him both into fire and into waters to destroy him[a]. But if you can do anything, help us[b], having compassion on us.
translation:
  language: tl
  text: At maraming beses na siyang inihagis nito sa apoy at sa mga anyong tubig[a] upang siya'y ipahamak. Ngunit kung may magagawa ka, tulungan mo kami at kahabagan mo kami.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Griyego, maramihan ang salita: “sa mga anyong tubig”; maaari rin itong isalin bilang “sa tubig.”'
    reason: lexical_alternative
  - marker: b
    text: O “tulungan mo kami, dahil sa habag mo sa amin” o “mahabag ka sa amin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλάκις
  choice: maraming beses
  rationale: Likas at malinaw na ipinahahayag ang paulit-ulit na mga pangyayari.
- source_word: ἔβαλεν
  choice: inihagis
  rationale: Ang aspektong aorist ay tumutukoy rito sa paulit-ulit na naganap na kilos sa salaysay ng ama; natural itong maipahahayag sa Filipino bilang nakaraang kilos.
- source_word: εἰς πῦρ ... καὶ εἰς ὕδατα
  choice: sa apoy at sa mga tubig
  rationale: Pinananatili ang pag-uulit ng εἰς at ang maramihang anyo ng ὕδατα, bagaman hindi pangkaraniwan sa Filipino ang 'mga tubig.'
- source_word: ἵνα ἀπολέσῃ αὐτόν
  choice: upang siya'y patayin
  rationale: Ipinahahayag ng ἵνα ang layunin. Sa konteksto ng paghahagis sa apoy at tubig, ang ἀπολέσῃ ay natural na tumutukoy sa pagkitil sa buhay, habang inilalagay sa talababa ang mas malawak na alternatibo.
- source_word: ἀλλ’ εἴ τι δύνῃ
  choice: Ngunit kung may magagawa ka
  rationale: Pinananatili ang τι at ang pag-aalinlangan ng ama tungkol sa kakayahan ni Jesus nang hindi ito pinapalambot.
- source_word: βοήθησον ἡμῖν
  choice: tulungan mo kami
  rationale: Direkta, natural, at angkop sa agarang pakiusap ng aorist imperative.
- source_word: σπλαγχνισθεὶς ἐφ’ ἡμᾶς
  choice: at maawa ka sa amin
  rationale: Natural na Filipino para sa malalim na habag; ipinapakita ng 'at' na kalakip ito ng pakiusap na tumulong, bagaman ang Griyego ay gumagamit ng participle.
theological_decisions:
- issue: Ang pag-aalinlangan ng ama tungkol sa kakayahan ni Jesus
  choice: kung may magagawa ka
  alternative: kung kaya mong gumawa ng anuman
  rationale: Hayagang pinananatili ang kondisyonal at alanganing tono ng Griyego, sa halip na gawing mas tiwala ang pakiusap.
- issue: Ang layunin ng masamang espiritu
  choice: upang siya'y patayin
  alternative: upang siya'y ipahamak
  rationale: Malinaw sa agarang konteksto ang nakamamatay na layunin, ngunit ang mas malawak na saklaw ng ἀπόλλυμι ay kinikilala sa talababa.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang matinding pakiusap ng ama at ang tunay na pag-aalinlangan sa pariralang “kung may magagawa ka.” Ginamit ang “siya'y” bilang bahagyang pormal ngunit karaniwang anyo sa tekstong biblikal.
