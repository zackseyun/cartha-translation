  text: καὶ ἀποκριθεὶς ὁ Πέτρος λέγει τῷ Ἰησοῦ· Ῥαββί, καλόν ἐστιν ἡμᾶς ὧδε εἶναι, καὶ ποιήσωμεν ⸂τρεῖς σκηνάς⸃, σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/005.yaml
  text: 'And Peter answered and said to Jesus[a], “Rabbi, it is good for us to be here, and let us make three shelters: one for you, one for Moses, and one for Elijah.”'
translation:
  language: tl
  text: 'Sumagot si Pedro at sinabi niya kay Jesus, “Rabi, mabuti na narito tayo. Gumawa tayo ng tatlong silungan[a]: isa para sa iyo, isa para kay Moises, at isa para kay Elias.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga tolda,” “mga kubol,” o “mga tabernakulo.” Ang Griyegong σκηνάς ay tumutukoy sa pansamantalang mga silungan at maaaring may kaugnayan sa mga tolda o kubol, ngunit hindi tahasang binabanggit sa talatang ito ang gayong mga kaugnayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: Sumagot
  rationale: Pinananatili nito ang karaniwang idyomang pasalaysay na ‘sumagot,’ kahit walang tahasang tanong na nauna.
- source_word: λέγει
  choice: sinabi (nakapaloob sa ‘Sumagot si Pedro kay Jesus’)
  rationale: Ang historikal na pangkasalukuyan sa Griyego ay likas na ipinahahayag sa pangnagdaang anyo sa salaysay na Tagalog; hindi kailangang ulitin ang ‘at sinabi’ dahil magiging mabigat at di-likas iyon.
- source_word: Ῥαββί
  choice: Rabi
  rationale: Pinananatili ang Semitikong titulo at magalang na tawag sa halip na palitan agad ng mas malawak na kahulugang ‘Guro.’
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: mabuti na narito tayo
  rationale: Likas at malinaw na Tagalog ito na nagpapanatili sa payak na pagtataya ni Pedro nang hindi pinalalakas bilang ‘napakaganda’ o ‘tama.’
- source_word: ποιήσωμεν
  choice: Gumawa tayo
  rationale: Ipinahahayag nito ang hortatoryong unang panauhang subjunctive at nananatiling malapit sa payak na diwa ng ποιέω; ang ‘magtayo’ ay posible ngunit mas tiyak sa paraan ng paggawa.
- source_word: σκηνάς
  choice: mga silungan
  rationale: Ipinahahayag ang pangunahing diwa ng pansamantalang masisilungan nang hindi awtomatikong ipinapasok ang kaugnayan sa Pista ng mga Tolda o sa tabernakulo.
- source_word: σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν
  choice: isa para sa iyo, isa para kay Moises, at isa para kay Elias
  rationale: Pinananatili ang tatlong-ulit na distributibong ayos at malinaw na paralelismo ng Griyego.
theological_decisions:
- issue: Posibleng pahiwatig na pangkulto o pampista ng σκηνάς
  choice: Gamitin sa pangunahing teksto ang neutral na ‘mga silungan.’
  alternative: mga tolda; mga kubol; mga tabernakulo
  rationale: Hindi tahasang iniuugnay ng talata ang mga ito sa Pista ng mga Tolda o sa teolohiya ng tabernakulo. Pinananatili ng neutral na salita ang saklaw ng orihinal, samantalang inilalahad sa talababa ang mahahalagang alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at likas sa karaniwang mambabasa. Pinanatili ang ‘Rabi’ bilang titulong nakaugat sa tagpuang Semitiko at ginamit ang ‘Moises’ at ‘Elias’ bilang nakaugaliang anyong Tagalog ng mga pangalan.
