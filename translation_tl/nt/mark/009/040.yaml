translation:
  language: tl
  text: Sapagkat ang sinumang hindi laban sa atin ay kakampi natin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “para sa atin” o “nasa panig natin.” Ang pariralang Griyego na ὑπὲρ ἡμῶν ay maaari ring mangahulugang “para sa atin,” “alang-alang sa atin,” o “nasa panig natin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: ang sinumang
  rationale: Ginagamit ang panghalip na pamanggit sa pangkalahatan; natural sa makabagong Tagalog ang “ang sinumang” at napananatili nito ang di-tiyak at pangkalahatang saklaw.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Nagbibigay ang γάρ ng paliwanag na kaugnay ng naunang pahayag. Malinaw at marangal na panandang paliwanag ang “Sapagkat.”
- source_word: οὐκ ἔστιν
  choice: hindi
  rationale: Sa Tagalog, likas na ipinahahayag ng “hindi” ang pagkakaila sa panaguring “laban sa atin”; hindi kailangang isalin nang hiwalay ang kopula.
- source_word: καθ’ ἡμῶν
  choice: laban sa atin
  rationale: Ang κατά na may genitive ay nagpapahayag ng pagsalungat. Tuwiran at karaniwan sa Tagalog ang “laban sa atin.”
- source_word: ὑπὲρ ἡμῶν
  choice: panig sa atin
  rationale: Sa antitesis na ito, malinaw na ipinahahayag ng “panig sa atin” ang pagiging pabor o kakampi, habang pinananatili ang maikling pagtutulad sa “laban sa atin.”
- source_word: ἐστιν
  choice: ay
  rationale: Ang “ay” ang kopulang nag-uugnay sa simuno at sa panaguring “panig sa atin,” at nagpapanatili ng malinaw na balanseng estruktura ng kasabihan.
theological_decisions:
- issue: Saklaw ng pagiging “laban sa atin” o “panig sa atin”
  choice: Pinanatili ang tahasang unang panauhang maramihan na “atin,” nang hindi pinalalawak tungo sa “laban sa Diyos” o “panig sa kaharian.”
  alternative: Ang sinumang hindi salungat sa ating misyon ay kakampi natin.
  rationale: Ang Griyego ay tahasang gumagamit ng ἡμῶν (“atin”). Iniiwasan ng salin ang pagpapakahulugang higit sa sinabi ng teksto at hinahayaang ang konteksto ang magtakda ng saklaw.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinili ang “panig sa atin” upang maging natural ang antitesis sa “laban sa atin,” habang inilalagay sa talababa ang iba pang tunay na posibilidad ng ὑπὲρ ἡμῶν.
