id: MRK.9.39
reference: Mark 9:39
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Μὴ κωλύετε αὐτόν, οὐδεὶς γάρ ἐστιν ὃς ποιήσει δύναμιν ἐπὶ τῷ ὀνόματί μου καὶ δυνήσεται ταχὺ κακολογῆσαί με·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/039.yaml
  text: But Jesus said[a], “Do not stop him[b], for there is no one who will do a mighty work in my name and soon be able to speak evil of me.”
translation:
  language: tl
  text: Ngunit sinabi ni Jesus, “Huwag ninyo siyang pigilan, sapagkat walang sinumang gagawa ng makapangyarihang gawa[a] sa pangalan ko at agad na makapagsasalita ng masama tungkol sa akin[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “himala” o “gawa ng kapangyarihan”; sa Griyego, δύναμιν, “kapangyarihan” o isang gawang nagpapakita ng kapangyarihan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “laitin ako” o “siraan ako”; sa Griyego, “magsalita ng masama tungkol sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κωλύετε
  choice: pigilan
  rationale: Ang pangkasalukuyang pautos na may μή ay isang pagbabawal. Natural sa modernong Tagalog ang “Huwag ninyo siyang pigilan” at akma ito sa pagtatangka ng mga alagad na pahintuin ang lalaki.
- source_word: δύναμιν
  choice: makapangyarihang gawa
  rationale: Ang δύναμις ay literal na tumutukoy sa kapangyarihan at sa mga Ebanghelyo ay maaari ring tumukoy sa isang pambihirang gawang nagpapakita ng kapangyarihan. Pinananatili ng “makapangyarihang gawa” ang lawak ng kahulugan nang hindi ito nililimitahan sa terminong “himala.”
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: sa pangalan ko
  rationale: Sa konteksto, ipinahihiwatig nito ang pagkilos sa bisa o sa pagtawag sa pangalan ni Jesus. Ang “sa pangalan ko” ang natural at malinaw na katumbas sa Tagalog.
- source_word: ταχὺ
  choice: agad
  rationale: Ipinahahayag ng pang-abay ang napakalapit na panahon. Mas tuwirang inilalarawan ng “agad” ang temporal na diwa kaysa sa salitang maaaring tumukoy lamang sa bilis ng paraan.
- source_word: κακολογῆσαί με
  choice: makapagsalita ng masama tungkol sa akin
  rationale: Pinananatili nito ang malawak na diwa ng pagsasalita nang masama laban kay Jesus nang hindi pinakikitid sa legal na paninirang-puri o sa tahasang pagsumpa.
- source_word: οὐδεὶς γάρ ἐστιν ὃς
  choice: sapagkat walang sinumang
  rationale: Malinaw at natural nitong pinananatili ang pangkalahatang pagtanggi at ang paliwanag na ipinakikilala ng γάρ.
- source_word: δυνήσεται
  choice: makapagsasalita
  rationale: Ang anyong may panlaping “maka-” ay nagpapahayag ng kakayahang tinutukoy ng future form ng δύναμαι; ang hinaharap na diwa ay malinaw rin mula sa “gagawa” at sa kabuuang pangungusap.
theological_decisions:
- issue: Uri ng gawang ginagawa sa pangalan ni Jesus
  choice: makapangyarihang gawa
  alternative: himala
  rationale: Pinananatili ng salin ang saklaw ng δύναμιν bilang pagpapakita o gawa ng kapangyarihan at hindi ipinapalagay na ang mas makitid na modernong kategoryang “himala” lamang ang tinutukoy.
- issue: Ipinahihiwatig na kaugnayan ng gumagawa kay Jesus
  choice: Deskriptibong pahayag lamang tungkol sa paggawa sa pangalan ni Jesus at sa hindi agad na pagsasalita ng masama laban sa kanya
  alternative: Salitang tahasang kumikilala sa ganap na pagiging alagad o tahasang humahatol na mapagsamantala lamang ang lalaki
  rationale: Hindi nilulutas ng talata ang mas malawak na kalagayang espirituwal ng lalaki. Pinananatili ng salin ang limitadong punto ng sinabi ni Jesus nang walang idinaragdag na doktrinal na hatol.
- issue: Ugnayang temporal ng paggawa at pagsasalita ng masama
  choice: at agad na makapagsasalita
  alternative: at pagkatapos ay agad na makapagsasalita
  rationale: Pinananatili ang καί bilang “at” at ang ταχύ bilang “agad” nang hindi nagdaragdag ng tahasang “pagkatapos,” bagaman likas na may pagkakasunod ang dalawang kilos sa konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang pangmaramihang “ninyo” dahil kinakausap ni Jesus ang pangkat ng mga alagad, samantalang ang “siyang” ay tumutukoy sa lalaking kanilang pinipigilan. Inilagay ang mga talababa sa mismong mga pariralang nililinaw ng mga ito.
