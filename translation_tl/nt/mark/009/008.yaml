  text: καὶ ἐξάπινα περιβλεψάμενοι οὐκέτι οὐδένα εἶδον ⸂ἀλλὰ τὸν Ἰησοῦν μόνον μεθ’ ἑαυτῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/008.yaml
  text: And suddenly, looking around, they no longer saw anyone except Jesus alone with them.
translation:
  language: tl
  text: At bigla silang tumingin sa paligid at wala na silang nakitang iba maliban kay Jesus na kasama nila.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξάπινα
  choice: bigla
  rationale: Natural at tuwirang katumbas ng pang-abay na nagsasaad ng isang pangyayaring naganap nang di-inaasahan.
- source_word: περιβλεψάμενοι
  choice: tumingin sa paligid
  rationale: Ipinahahayag ang paglingon o pagmasid sa lahat ng direksiyon nang hindi pinabibigat ang pangungusap.
- source_word: οὐκέτι οὐδένα εἶδον
  choice: wala na silang nakitang iba
  rationale: Pinananatili ang diwa ng οὐκέτι ('hindi na') at οὐδένα ('walang sinuman'), habang natural sa modernong Tagalog.
- source_word: ἀλλὰ τὸν Ἰησοῦν μόνον μεθ’ ἑαυτῶν
  choice: maliban kay Jesus na kasama nila
  rationale: Ang 'maliban' ay malinaw na nagpapahayag ng eksepsiyon; hindi na kailangang idagdag ang hiwalay na 'lamang' dahil likas nang eksklusibo ang parirala sa Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na simple, marangal, at madaling maunawaan. Pinanatili ang daloy ng salaysay at ang diin na si Jesus na lamang ang natirang kasama ng mga alagad.
