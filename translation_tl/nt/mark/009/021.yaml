  yaml_path: translation/nt/mark/009/021.yaml
  text: And he asked his father[a], “How long has this been happening to him?” And he said, “From childhood.”
translation:
  language: tl
  text: At tinanong niya ang ama ng bata, “Gaano na katagal itong nangyayari sa kanya?” Sumagot ang ama, “Mula pa nang bata siya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: tinanong
  rationale: Karaniwang pandiwa ito para sa tuwirang pagtatanong at hindi nagdaragdag ng di-kailangang pormalidad o diin.
- source_word: τὸν πατέρα αὐτοῦ
  choice: ang ama nito
  rationale: Ang αὐτοῦ ay likas na tumutukoy sa taong sinasapian sa konteksto. Nililinaw ng “nito” ang kaugnayan nang hindi inuulit ang pangngalang wala sa mismong talata.
- source_word: Πόσος χρόνος ἐστὶν ὡς
  choice: Gaano na katagal
  rationale: Likas na Filipino itong paraan ng pagtatanong sa tagal mula sa simula hanggang sa kasalukuyan.
- source_word: τοῦτο γέγονεν αὐτῷ
  choice: itong nangyayari sa kanya
  rationale: Ipinahihiwatig ng perfect na γέγονεν ang kalagayang nagsimula na at nagpapatuloy; malinaw itong naihahayag ng aspektong nagaganap sa Filipino.
- source_word: ὁ δὲ εἶπεν
  choice: Sumagot ito
  rationale: Sa konteksto ng tanong at tugon, mas likas ang “sumagot” kaysa sa literal na “sinabi,” habang pinananatili ang payak na daloy ng salaysay.
- source_word: Ἐκ παιδιόθεν
  choice: Mula pa noong bata siya
  rationale: Ipinapahayag nito ang panimulang panahon sa maikli, natural, at malinaw na modernong Filipino. Ang “pa” ay angkop na nagpapahiwatig na nagpatuloy ang kalagayan mula noon.
