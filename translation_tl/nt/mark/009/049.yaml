translation:
  language: tl
  text: Sapagkat ang bawat isa ay aasinan ng apoy[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang bawat isa ay titimplahan ng apoy.” Maaaring magpahiwatig ang larawan ng paghatol, pagdadalisay, o paghahandog; ihambing sa Levitico 2:13.
    reason: lexical_alternative
  - marker: b
    text: Idinaragdag ng ilang manuskrito, “at ang bawat hain ay aasinan ng asin.”
    reason: textual_variant
lexical_decisions:
- source_word: Πᾶς
  choice: ang bawat isa
  rationale: Ang pang-uri ay panlalaking isahan at ginagamit bilang pangngalan; sa konteksto, tumutukoy ito sa bawat tao. Likas sa modernong Tagalog ang “ang bawat isa” at hindi nito pinalalawak ang tinutukoy tungo sa “lahat ng bagay.”
- source_word: γὰρ
  choice: Sapagkat
  rationale: Nagbibigay ang γάρ ng paliwanag o batayan para sa naunang babala. Malinaw na pinananatili ng “Sapagkat” ang ugnayang ito.
- source_word: πυρὶ
  choice: ng apoy
  rationale: Maaaring ipahayag ng datibo ang kasangkapan, paraan, o kaugnay na elemento. Sa pariralang “aasinan ng apoy,” natural ang “ng” sa Tagalog at hindi nito lubusang nilulutas kung ang apoy ang paraan, elemento, o matalinghagang tagaganap.
- source_word: ἁλισθήσεται
  choice: aasinan
  rationale: Ang anyong panghinaharap na balintiyak ng ἁλίζω ay literal na “lalagyan ng asin” o “timplahan ng asin.” Pinananatili ng “aasinan” ang maikli, matindi, at sadyang di-pangkaraniwang larawang “aasinan ng apoy,” sa halip na ipaliwanag agad ang talinghaga.
theological_decisions:
- issue: Kahulugan ng talinghagang “aasinan ng apoy”
  choice: Panatilihin ang literal na talinghaga nang hindi tinutukoy kung pangunahing tumutukoy ito sa paghatol, pagdadalisay, paghahandog, o pagsubok sa pagiging alagad.
  alternative: Isalin nang nagpapaliwanag, gaya ng “daraan ang bawat isa sa paghatol ng apoy,” “dadalisayin ng apoy,” o “itatalaga na gaya ng isang haing inasnan.”
  rationale: Maikli at hitik sa pahiwatig ang Griyego, at maaaring umugnay ang konteksto sa ilang magkakaugnay na kahulugan. Hindi dapat ipasok sa pangunahing teksto ang iisang interpretasyong teolohikal.
translation_notes:
  register: Makabago ngunit marangal at madaling maunawaang Tagalog. Pinili ang “aasinan” upang mapanatili ang kapansin-pansing talinghaga ng orihinal; ang footnote ang nagbibigay ng mas karaniwang alternatibong “titimplahan.”
