  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐὰν ὁ πούς σου σκανδαλίζῃ σε, ἀπόκοψον αὐτόν· καλόν ἐστίν ⸀σε εἰσελθεῖν εἰς τὴν ζωὴν χωλὸν ἢ τοὺς δύο πόδας ἔχοντα βληθῆναι εἰς τὴν ⸀γέενναν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/045.yaml
  text: And if your foot causes you to stumble[a], cut it off. It is better for you to enter into life lame than, having both feet, to be thrown into Gehenna.
translation:
  language: tl
  text: At kung ang paa mo ay nagpapatisod sa iyo[a], putulin mo ito. Mas mabuti para sa iyo ang pumasok sa buhay na pilay kaysa itapon ka sa Gehenna[b] nang may dalawang paa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “nagiging dahilan para magkasala ka.”'
    reason: Ipinahihiwatig ng σκανδαλίζῃ ang pagkatisod na maaaring tumukoy sa pagkakasala o pagtalikod; pinananatili ng pangunahing teksto ang talinghaga.
  - marker: b
    text: 'Maaari ring: “impiyerno.” Ang salitang Griyego ay Gehenna, na nagpapagunita sa Lambak ng Hinnom at sa mga kaugnayan nito sa hatol ng Diyos.'
    reason: Pinananatili ang tiyak na katawagang Griyego habang ipinapakita ang pamilyar na tradisyonal na katumbas.
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: nagiging dahilan para matisod ka
  rationale: Pinananatili nito ang larawan ng pagkatisod sa Griyego at likas itong maunawaan sa modernong Tagalog, nang hindi agad nililimitahan ang kahulugan sa paggawa ng kasalanan.
- source_word: ἀπόκοψον
  choice: putulin mo ito
  rationale: Tuwiran at mariing ipinapahayag nito ang konkretong utos ng aorist imperative, nang hindi pinapahina ang matinding larawan.
- source_word: καλόν ἐστίν
  choice: Mas mabuti para sa iyo
  rationale: Dahil sinusundan ito ng paghahambing na ἢ, ang idiomatikong diwa ay paghahambing—“mas mabuti”—hindi lamang “mabuti.”
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: ang pumasok sa buhay
  rationale: Pinananatili ang talinghaga at ang eskatolohikal na diwa ng pagpasok sa buhay, ngunit hindi dinaragdagan ng “walang hanggan,” na wala sa tekstong Griyego.
- source_word: χωλὸν
  choice: na pilay
  rationale: Tiyak na tumutukoy ang χωλός sa kapansanan sa paglakad; ang “pilay” ang pinakatumpak at likas na katumbas sa konteksto ng paa.
- source_word: βληθῆναι
  choice: maitapon
  rationale: Tumpak nitong inilalarawan ang pasibong anyo at marahas na kilos ng βάλλω sa natural na Tagalog.
- source_word: γέενναν
  choice: Gehenna
  rationale: Pinananatili ang tiyak na katawagang Griyego at ang kaugnayan nito sa Lambak ng Hinnom at sa larawan ng hatol ng Diyos, sa halip na palitan agad ng mas malawak na tradisyonal na katawagang “impiyerno.”
- source_word: τοὺς δύο πόδας ἔχοντα
  choice: nang may dalawang paa
  rationale: Natural sa Tagalog at malinaw na pinananatili ang paghahambing sa pagpasok sa buhay na pilay.
theological_decisions:
- issue: Kahulugan ng σκανδαλίζῃ sa konteksto ng pagkakasala at pagtalikod
  choice: matisod
  alternative: magkasala
  rationale: Ang “matisod” ay nagpapanatili sa talinghaga ng Griyego at sa lawak ng kahulugan nito; inilalagay sa talababa ang mas tahasang interpretasyong “magkasala.”
- issue: Paglalarawan sa γέεννα bilang lugar ng hatol
  choice: Gehenna
  alternative: impiyerno
  rationale: Ang γέεννα ang mismong tiyak na katawagan sa pinagmulan. Pinananatili ito sa pangunahing teksto upang huwag burahin ang makasaysayan at biblikal na larawan, habang ibinibigay sa talababa ang pamilyar na katumbas.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Pinanatili ang matinding retorikal na larawan ng pagputol sa paa, ang talinghaga ng pagkatisod, at ang tiyak na katawagang “Gehenna,” nang hindi dinaragdagan o nilulutas ang mga pahiwatig na hindi tahasang nilinaw ng Griyego.
