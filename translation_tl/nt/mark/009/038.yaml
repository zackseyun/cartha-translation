  terminology: 'Wasto at magkakatugma ang mga pangunahing termino: “Guro” para sa Διδάσκαλε, “mga demonyo” para sa δαιμόνια, at “sa pangalan mo” para sa ἐν τῷ ὀνόματί σου. Hindi nagdaragdag ang salin ng interpretasyong doktrinal hinggil sa awtoridad o pagiging kasapi ng lalaki sa pangkat.'
