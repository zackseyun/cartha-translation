  source_fidelity: 'Tapat ang salin sa Griyego: pinananatili ang tahasang si Juan at ang “sa kanya,” ang di-tiyak na “may nakita kaming,” ang pangkasalukuyang participle na “nagpapalayas,” ang idyomang “sa pangalan mo,” at lalo na ang ἡμῖν bilang “sa amin,” hindi “sa iyo.” Ang “sinikap naming pigilan” ay wastong nagpapahiwatig ng posibleng tinangka o nagpapatuloy na diin ng imperpektong ἐκωλύομεν nang hindi ipinagpapalagay na nagtagumpay sila.'
