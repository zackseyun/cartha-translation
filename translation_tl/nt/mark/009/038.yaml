id: MRK.9.38
reference: Mark 9:38
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸂Ἔφη αὐτῷ ὁ Ἰωάννης⸃· Διδάσκαλε, εἴδομέν τινα ⸀ἐν τῷ ὀνόματί σου ἐκβάλλοντα δαιμόνια, ⸂καὶ ἐκωλύομεν αὐτόν, ὅτι οὐκ ἠκολούθει ἡμῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/038.yaml
  text: John said to him[a], “Teacher, we saw someone casting out demons in your name, and we tried to stop him because he was not following us.”
translation:
  language: tl
  text: Sinabi sa kanya ni Juan, “Guro, may nakita kaming nagpapalayas ng mga demonyo sa pangalan mo, at sinikap naming pigilan siya[a] dahil hindi siya sumusunod sa amin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “patuloy namin siyang pinipigilan.” Maaaring maglarawan ang pandiwang Griyego ng paulit-ulit o tinangkang pagkilos; kaya “sinikap naming pigilan siya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔφη αὐτῷ ὁ Ἰωάννης
  choice: Sinabi sa kanya ni Juan
  rationale: Likas na salaysay sa Filipino ang payak na pangnagdaan na “sinabi”; pinananatili rin ang tahasang tagaganap na si Juan at ang di-tuwirang layon na “sa kanya.”
- source_word: Διδάσκαλε
  choice: Guro
  rationale: Tuwirang katumbas ito ng διδάσκαλε at malinaw at marangal sa modernong Filipino; hindi nito idinaragdag ang mas tiyak na kahulugan ng “Rabi.”
- source_word: εἴδομέν τινα
  choice: may nakita kaming
  rationale: Natural na Filipino para sa “we saw someone”; hindi tinutukoy ng τινα ang pagkakakilanlan ng tao.
- source_word: ἐν τῷ ὀνόματί σου
  choice: sa pangalan mo
  rationale: Pinananatili ang biblikal na idyoma na tumutukoy sa pagkilos kaugnay ng pangalan at awtoridad ni Jesus nang hindi ito labis na ipinapaliwanag.
- source_word: ἐκβάλλοντα δαιμόνια
  choice: nagpapalayas ng mga demonyo
  rationale: Karaniwan at malinaw na Filipino para sa gawaing inilalarawan ng ἐκβάλλω sa kontekstong ito.
- source_word: καὶ ἐκωλύομεν αὐτόν
  choice: at sinikap naming pigilan siya
  rationale: Ipinahihiwatig ng imperpektong ἐκωλύομεν ang patuloy o tinangkang pagpigil; ang “sinikap naming pigilan” ay natural at hindi nagsasabing tiyak na nagtagumpay sila.
- source_word: ὅτι οὐκ ἠκολούθει ἡμῖν
  choice: dahil hindi siya sumusunod sa amin
  rationale: Tuwirang pinananatili ang ἡμῖν bilang “sa amin,” kasama ang tensiyong nakatuon si Juan sa pagsunod sa pangkat ng mga alagad.
theological_decisions:
- issue: Kanino hindi sumusunod ang taong nagpapalayas ng mga demonyo
  choice: hindi siya sumusunod sa amin
  alternative: hindi siya sumusunod sa iyo / hindi siya kabilang sa amin
  rationale: Tahasan sa Griyego ang ἡμῖν, “sa amin.” Ang pagpapanatili nito ay hindi nagpapalit kay Jesus bilang tinutukoy at hindi rin ginagawang usapin lamang ng pagiging kasapi sa pangkat; napapanatili nito ang tensiyong sasagutin ni Jesus sa kasunod na konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “Guro,” “nagpapalayas ng mga demonyo,” at “sa pangalan mo” bilang madaling maunawaang mga pariralang nagpapanatili sa anyo at diwa ng Griyego. Inilagay ang pananda ng talababa [a] kaagad pagkatapos ng sugnay na nililinaw nito.
