base_translation:
  language: en
  yaml_path: translation/nt/mark/009/050.yaml
  text: Salt is good[a]; but if the salt becomes unsalty, with what will you season it? Have salt in yourselves[c][b], and be at peace with one another.
translation:
  language: tl
  text: Mabuti ang asin; ngunit kung mawalan ng alat ang asin, ano ang ipantitimpla ninyo rito? Magkaroon kayo ng asin sa inyong mga sarili[a], at mamuhay kayong mapayapa sa isa’t isa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tahasang ipinaliliwanag dito ang talinghagang “asin.” Maaaring tumukoy ito sa kadalisayan, karunungan, katapatan sa tipan, o impluwensiyang nag-iingat, ngunit walang iisang kahulugan ang tahasang itinakda ng teksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: Mabuti
  rationale: Pinananatili ang malawak at payak na positibong pagtataya ng καλός at ang anyong kasabihan ng pangungusap.
- source_word: ἅλας / ἅλα
  choice: asin
  rationale: Pare-parehong isinalin bilang “asin,” pati sa utos sa hulihan, upang hindi ipaliwanag agad ang talinghaga.
- source_word: ἄναλον γένηται
  choice: mawalan ng alat
  rationale: Likas na salin sa modernong Tagalog para sa pagbabago tungo sa pagiging walang alat; pinananatili rin nito ang paglalaro sa salitang “asin/alat.”
- source_word: ἐν τίνι αὐτὸ ἀρτύσετε
  choice: ano ang ipaaalat ninyo rito?
  rationale: Ipinahahayag ang tanong tungkol sa kasangkapang gagamitin upang muling timplahan o paalatin ang asin. Ang “ipaaalat” ay mas natural sa konteksto kaysa sa pangkalahatang “titimplahan,” habang hindi idinaragdag ang ideya ng tiyak na pagpapanumbalik.
- source_word: ἔχετε ἐν ἑαυτοῖς ἅλα
  choice: Magkaroon kayo ng asin sa inyong sarili
  rationale: Pinananatili ang tuwirang utos at ang sadyang hindi ipinaliwanag na talinghaga. Ang “sa inyong sarili” ay maaaring tumukoy sa panloob na katangiang taglay ng pangkat nang hindi ito nililimitahan sa isang pakahulugan.
- source_word: εἰρηνεύετε ἐν ἀλλήλοις
  choice: mamuhay kayong mapayapa sa isa't isa
  rationale: Likas na ipinakikita ang patuloy na asal na hinihingi ng kasalukuyang pautos na pandiwa at ang ugnayang kapwa-sa-kapwa.
theological_decisions:
- issue: Kahulugan ng “asin” sa utos
  choice: Panatilihin sa pangunahing teksto ang talinghagang “Magkaroon kayo ng asin sa inyong sarili.”
  alternative: Ipaliwanag ito bilang kadalisayan, karunungan, katapatan sa tipan, o impluwensiyang nag-iingat.
  rationale: Hindi tahasang itinatakda ng Griyegong teksto ang iisang tinutukoy ng asin. Ang literal na talinghaga ay nagpapanatili sa tunay na kalabuan at sa kaugnayan nito sa nakapaligid na konteksto nang hindi nagpapasok ng isang doktrinal na interpretasyon.
- issue: Anyo ng huling utos tungkol sa kapayapaan
  choice: mamuhay kayong mapayapa sa isa't isa
  alternative: magkaroon kayo ng kapayapaan sa isa't isa
  rationale: Kapwa posible, ngunit mas natural sa kasalukuyang Tagalog ang napiling anyo at malinaw nitong ipinahahayag ang patuloy na mapayapang pakikitungo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinili ang “mawalan ng alat” bilang likas na katumbas ng ἄναλον γένηται at pinanatili ang talinghagang “asin” sa huling utos. Ginamit ang “mamuhay kayong mapayapa” upang ihayag ang nagpapatuloy na atas.
