  yaml_path: translation/nt/mark/009/006.yaml
  text: For he did not know what he should answer[b][a], for they were terrified.
translation:
  language: tl
  text: Sapagkat hindi niya alam kung ano ang dapat niyang isagot[a], sapagkat naging takot na takot sila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kung ano ang dapat niyang sabihin bilang tugon.”
    reason: lexical_alternative
  - marker: b
    text: O “sapagkat takot na takot sila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: alam
  rationale: Karaniwang tumutukoy ang οἶδα sa kaalaman o kabatiran; natural sa Filipino ang “hindi niya alam.”
- source_word: τί ἀποκριθῇ
  choice: kung ano ang dapat niyang isagot
  rationale: Ang ἀποκρίνομαι ay tumutukoy sa pagsagot o pagtugon, at ang deliberatibong diwa ay malinaw na naihahayag ng “kung ano ang dapat niyang isagot.”
- source_word: ἔκφοβοι
  choice: takot na takot
  rationale: Mas matindi ito kaysa karaniwang “natatakot”; ang “takot na takot” ay natural at malinaw sa modernong Filipino.
- source_word: ἐγένοντο
  choice: takot na takot silang lahat
  rationale: Sa Filipino, natural na ipinahihiwatig ng pariralang ito ang pagkalagay nila sa matinding takot; ipinaliliwanag ng talababa ang mas literal na puwedeng anyo.
- source_word: γὰρ ... γὰρ
  choice: sapagkat ... dahil
  rationale: Pinananatili ang dalawang paliwanag na ugnayan, ngunit iniiwasan ang alanganing pag-uulit ng iisang pangatnig sa Filipino.
theological_decisions:
- issue: Simuno ng sugnay na maramihan
  choice: silang lahat
  alternative: siya
  rationale: Maramihan ang ἔκφοβοι at ἐγένοντο, kaya tumutukoy ito kay Pedro at sa mga kasama niya, hindi kay Pedro lamang. Ginagawang malinaw ng “silang lahat” ang gramatikal na bilang nang hindi pinapangalanan ang mga tinutukoy.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang “takot na takot” upang maipahayag ang matinding lakas ng ἔκφοβοι; pinanatili sa dalawang sugnay ang paliwanag na gamit ng inuulit na γάρ.
