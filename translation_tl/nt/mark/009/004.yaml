  text: καὶ ὤφθη αὐτοῖς Ἠλίας σὺν Μωϋσεῖ, καὶ ἦσαν συλλαλοῦντες τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/004.yaml
  text: And Elijah appeared to them with Moses[a], and they were talking with Jesus.
translation:
  language: tl
  text: At nagpakita sa kanila si Elias, kasama si Moises, at nakikipag-usap sila kay Jesus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὤφθη
  choice: nagpakita
  rationale: Likas na salin sa Filipino ng aorist passive na ginagamit sa diwang ‘lumitaw’ o ‘nakita’; ipinahihiwatig nito ang pagpapakita sa salaysay nang hindi dinaragdagan ang paraan ng pangyayari.
- source_word: αὐτοῖς
  choice: sa kanila
  rationale: Tuwirang ipinakikita kung kanino nagpakita si Elias.
- source_word: Ἠλίας
  choice: Elias
  rationale: Karaniwang anyo ng pangalang Elijah sa tradisyong Filipino at madaling makilala ng mga mambabasa ng Bibliya.
- source_word: σὺν Μωϋσεῖ
  choice: kasama si Moises
  rationale: Malinaw at likas na ipinahahayag ang pagsama ni Moises kay Elias.
- source_word: ἦσαν συλλαλοῦντες
  choice: nakikipag-usap sila
  rationale: Ipinahahayag ng pandiwa ang kapuwa o magkatuwang na pakikipag-usap; ang progresibong anyo ay angkop sa periphrastic imperfect ng Griyego.
- source_word: τῷ Ἰησοῦ
  choice: kay Jesus
  rationale: Sa Filipino, ang ‘nakikipag-usap … kay Jesus’ ay likas na nagpapahayag na si Jesus ang kausap at pinananatili ang kapuwaang diwa ng συλλαλέω.
theological_decisions:
- issue: Ang identidad at realidad nina Elias at Moises sa pagbabagong-anyo
  choice: Tuwirang isinalaysay na nagpakita sina Elias at Moises at nakipag-usap kay Jesus.
  alternative: Ilarawan ang pangyayari bilang pangitain lamang o simbolikong representasyon.
  rationale: Inilalahad ng Griyegong teksto ang kanilang pagpapakita at pakikipag-usap bilang bahagi ng salaysay. Hindi dapat pahinain o dagdagan ng salin ang pahayag sa pamamagitan ng isang tiyak na paliwanag na wala sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘nakikipag-usap’ sa halip na mas pormal na ‘nakikipagtalastasan,’ at pinanatili ang payak na ayos ng orihinal.
