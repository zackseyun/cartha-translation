  source_fidelity: 'Tapat ang salin sa Griyego: ang “At” ay pinananatili ang καί; ang “tinanong niya sila” ay hindi nagpapaliit sa di-tiyak na αὐτούς; at ang “Ano ang pinag-uusapan ninyo sa isa’t isa?” ay wasto para sa τί συζητεῖτε πρὸς ἑαυτούς/αὑτούς. Naipapahayag din ng “sa isa’t isa” ang katumbasang diwa ng parirala nang hindi nagpapataw ng tiyak na pagkakakilanlan sa kausap.'
