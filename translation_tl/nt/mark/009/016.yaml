  text: And he asked them[a], “What are you discussing with one another?”
translation:
  language: tl
  text: At tinanong niya sila[a], “Ano ang pinag-uusapan ninyo sa isa’t isa?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Ano ang pinagtatalunan ninyo sa isa’t isa?” Ang pandiwa ay maaaring tumukoy sa pag-uusap, pakikipagdebate, o pagtatalo depende sa konteksto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Likas na nag-uugnay ito sa naunang pangyayari nang hindi nagdaragdag ng mas tiyak na temporal na diwa.
- source_word: ἐπηρώτησεν
  choice: tinanong
  rationale: Tuwiran at natural na katumbas ito sa makabagong Tagalog para sa pandiwang nagpapakilala ng tuwirang tanong.
- source_word: αὐτούς
  choice: sila
  rationale: Pinananatili ng panghalip ang hindi tahasang pagtukoy ng Griyego sa partikular na grupong kinakausap.
- source_word: Τί
  choice: Ano
  rationale: Ang tanong ay tungkol sa nilalaman o paksa ng usapan, hindi pangunahing tungkol sa dahilan nito.
- source_word: συζητεῖτε
  choice: pinag-uusapan ninyo
  rationale: Saklaw nito ang pangkalahatang diwa ng pagtalakay at hindi nito ipinipilit na mainitan o palaaway ang usapan, bagaman posible ang gayong pahiwatig sa konteksto.
- source_word: πρὸς αὑτούς
  choice: sa isa’t isa
  rationale: Natural na ipinapahayag nito sa Tagalog ang gantihang pakikipag-usap sa loob ng grupo.
