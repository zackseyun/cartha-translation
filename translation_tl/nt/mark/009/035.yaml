  source_fidelity: Ang pagkakasunod-sunod ng mga kilos at ang saklaw ng “lahat” ay naipapahayag nang wasto. Gayunman, ang ἔσται ay simpleng panghinaharap na “magiging”; ang “dapat siyang maging” ay nagdaragdag ng hayag na obligasyong wala sa anyo ng Griyego at naiiba sa English audit trail na “he will be.” Ang nakaraang “sinabi” para sa historical present na λέγει ay katanggap-tanggap at likas sa salaysay na Tagalog.
  naturalness: Malinaw at modernong Tagalog ang pangungusap. Ang binagong ayos na “magiging pinakahuli siya” ay mas tuwiran at natural habang pinananatili ang diin ng kasabihan.
  terminology: Ang “Labindalawa,” “una,” “pinakahuli,” at “lingkod” ay angkop. Ang “lingkod” ay wastong di-teknikal na salin ng διάκονος sa kontekstong ito.
