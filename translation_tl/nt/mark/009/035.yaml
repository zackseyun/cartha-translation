id: MRK.9.35
reference: Mark 9:35
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ καθίσας ἐφώνησεν τοὺς δώδεκα καὶ λέγει αὐτοῖς· Εἴ τις θέλει πρῶτος εἶναι ἔσται πάντων ἔσχατος καὶ πάντων διάκονος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/035.yaml
  text: And sitting down, he called the twelve and says to them, “If anyone wants to be first, he will be last of all and servant of all.”
translation:
  language: tl
  text: Umupo si Jesus, tinawag niya ang Labindalawa, at sinabi sa kanila, “Kung may gustong maging una, magiging pinakahuli siya sa lahat at lingkod ng lahat.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθίσας
  choice: Umupo
  rationale: Likas at tuwirang salin ng aorist participle; sa konteksto, ipinapakita nitong umupo muna si Jesus bago niya tinawag at tinuruan ang Labindalawa.
- source_word: ἐφώνησεν
  choice: tinawag niya
  rationale: Tumpak na naghahayag ng pagtawag ni Jesus sa Labindalawa upang lumapit o makinig.
- source_word: λέγει
  choice: sinabi
  rationale: Bagaman historical present ang Griyegong λέγει, mas natural sa makabagong Tagalog ang pangnagdaang “sinabi” sa loob ng salaysay na nasa nakaraan, nang hindi binabago ang kahulugan.
- source_word: πρῶτος
  choice: una
  rationale: Pinananatili ang metapora ng ranggo o katayuan sa orihinal.
- source_word: ἔσχατος
  choice: pinakahuli
  rationale: Ipinahahayag ang sukdulang kaibahan sa “una” at ang kaugnayan nito sa lahat.
- source_word: διάκονος
  choice: lingkod
  rationale: Karaniwang salita para sa taong naglilingkod; hindi ito ginawang teknikal na titulong pansimbahan dahil hindi iyon hinihingi ng konteksto.
theological_decisions:
- issue: Lakas ng pahayag na ἔσται
  choice: dapat siyang maging
  alternative: siya ay magiging
  rationale: Sa konteksto ng pagtuturo tungkol sa tunay na kadakilaan, ang future form ay may normatibo o kinakailangang diwa. Ang “dapat” ay natural na nagpapahayag nito sa Tagalog, bagaman posible rin ang mas literal na prediksyon.
- issue: Saklaw ng πάντων
  choice: sa lahat / ng lahat
  alternative: sa kanilang lahat / lingkod nilang lahat
  rationale: Pinananatili ang malawak at paulit-ulit na “lahat” ng Griyego, sa halip na limitahan ito nang tahasan sa Labindalawa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Idinagdag ang pangalang “Jesus” bilang likas na paksa sa Tagalog at upang maiwasan ang malabong sunod-sunod na panghalip. Pinanatili ang “Labindalawa” bilang nakikilalang tawag sa pangkat ng mga apostol.
