id: MRK.9.31
reference: Mark 9:31
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐδίδασκεν γὰρ τοὺς μαθητὰς αὐτοῦ καὶ ἔλεγεν αὐτοῖς ὅτι Ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς χεῖρας ἀνθρώπων, καὶ ἀποκτενοῦσιν αὐτόν, καὶ ἀποκτανθεὶς ⸂μετὰ τρεῖς ἡμέρας⸃ ἀναστήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/031.yaml
  text: For he was teaching his disciples and telling them[a], “The Son of Man is being handed over into the hands of men, and they will kill him, and after he is killed[b], after three days he will rise.”
translation:
  language: tl
  text: Sapagkat patuloy niyang tinuturuan ang kanyang mga alagad at sinasabi sa kanila, “Ang Anak ng Tao ay ibinibigay sa mga kamay ng mga tao[a], at papatayin nila siya. At matapos siyang patayin, babangon siya pagkaraan ng tatlong araw.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga kamay ng sangkatauhan.” Literal na sinasabi ng Griyego, “sa mga kamay ng mga tao.”
    reason: lexical_alternative
  - marker: b
    text: O “sa loob ng tatlong araw.” Dito ay “pagkaraan ng tatlong araw” ang mababasa sa Griyego; ginagamit din sa ibang mga pahayag ang “sa ikatlong araw.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐδίδασκεν
  choice: patuloy niyang tinuturuan
  rationale: Ipinahahayag ng imperpektong pandiwa ang nagpapatuloy o inuulit na pagtuturo sa likuran ng salaysay.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na ugnayan nito sa naunang konteksto.
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: ang kanyang mga alagad
  rationale: Ang “mga alagad” ang likas at nakaugaliang salin sa Ebanghelyo at pinananatili ang diwa ng mga tagasunod na tinuturuan.
- source_word: ἔλεγεν αὐτοῖς
  choice: sinasabi sa kanila
  rationale: Ang imperpekto ay nagpapahiwatig ng nagpapatuloy na pagsasabi kasabay ng pagtuturo.
- source_word: Ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ang Anak ng Tao
  rationale: Pinananatili ang kinikilalang titulo at ang posibleng alusyon nito sa Daniel nang hindi ito ipinapaliwanag sa mismong teksto.
- source_word: παραδίδοται
  choice: ay ibinibigay
  rationale: Pinananatili ang pasibong tinig at hindi nililimitahan sa “ipinagkakanulo”; maaari nitong saklawin ang pagsuko o pagpapasa sa kapangyarihan ng iba habang nananatiling hindi tahasang tinutukoy ang gumagawa.
- source_word: εἰς χεῖρας ἀνθρώπων
  choice: sa mga kamay ng mga tao
  rationale: Pinananatili ang kongkretong idyoma ng pagkakalagay sa kapangyarihan o kontrol ng mga tao at ang retorikal na pag-uugnay sa “Anak ng Tao.”
- source_word: ἀποκτενοῦσιν αὐτόν
  choice: papatayin nila siya
  rationale: Tuwiran at natural na ipinapahayag ang hinaharap na kilos ng hindi tahasang pinangalanang maramihang mga gumagawa.
- source_word: ἀποκτανθεὶς
  choice: kapag napatay na siya
  rationale: Ipinahahayag ang pasibong kilos na nauuna sa pagbangon, nang mas natural sa modernong Tagalog kaysa sa isang mabigat na literal na participial construction.
- source_word: μετὰ τρεῖς ἡμέρας
  choice: pagkaraan ng tatlong araw
  rationale: Tapat sa karaniwang kahulugan ng μετά na may accusative—“pagkaraan”—at hindi iniaayon sa ibang pormulang “sa ikatlong araw.”
- source_word: ἀναστήσεται
  choice: babangon siya
  rationale: Likas na intransitibong salin ng future middle at hindi ito ginagawang pasibong “muling bubuhayin.”
theological_decisions:
- issue: Saklaw at tinig ng παραδίδοται
  choice: ay ibinibigay
  alternative: ay ipinagkakanulo / ay ipinauubaya
  rationale: Hindi tinutukoy ng pasibong Griyego ang tagaganap at mas malawak ito kaysa pagkakanulo lamang. Pinananatili ng salin ang maaaring sabayang pahiwatig ng pagkakanulo, pagsuko sa awtoridad, at pahintulot ng Diyos nang hindi pinipili ang isa.
- issue: Paghahambing ng Ὁ υἱὸς τοῦ ἀνθρώπου at ἀνθρώπων
  choice: Ang Anak ng Tao … sa mga kamay ng mga tao
  alternative: Ang Anak ng Tao … sa mga kamay ng sangkatauhan
  rationale: Pinananatili nito ang leksikal at retorikal na pag-uulit ng “tao,” habang ang maramihang “mga tao” ay natural at hindi nagpapahiwatig na mga lalaki lamang ang tinutukoy.
- issue: Pormula ng panahon sa μετὰ τρεῖς ἡμέρας
  choice: pagkaraan ng tatlong araw
  alternative: sa ikatlong araw / sa loob ng tatlong araw
  rationale: Sinusunod ang mismong pormula ng talatang ito at hindi ito tahimik na iniaayon sa ibang mga pahayag tungkol sa muling pagkabuhay.
- issue: Tinig ng ἀναστήσεται
  choice: babangon siya
  alternative: muling bubuhayin siya
  rationale: Pinananatili ang intransitibong anyo ng Griyego rito at hindi ipinapasok ang pasibong pormula mula sa ibang mga talata.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “patuloy niyang tinuturuan” upang madama ang imperpektong aspekto; pinanatili ang “mga kamay ng mga tao” bilang malinaw na idyoma ng kapangyarihan o kontrol. Walang talababa dahil maipahahayag nang sapat sa pangunahing teksto ang mga mahalagang leksikal at temporal na detalye.
