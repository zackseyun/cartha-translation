  text: ⸂Καὶ καταβαινόντων⸃ αὐτῶν ⸀ἐκ τοῦ ὄρους διεστείλατο αὐτοῖς ἵνα μηδενὶ ⸂ἃ εἶδον διηγήσωνται⸃, εἰ μὴ ὅταν ὁ υἱὸς τοῦ ἀνθρώπου ἐκ νεκρῶν ἀναστῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/009.yaml
  text: And as they were coming down from the mountain[a], he ordered them to tell no one what they had seen[b], except when the Son of Man had risen from among the dead.
translation:
  language: tl
  text: Habang bumababa sila mula sa bundok, mahigpit niya silang inutusan na huwag sabihin kaninuman ang kanilang nakita hanggang sa[a] bumangon na ang Anak ng Tao mula sa mga patay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “maliban kapag bumangon na ang Anak ng Tao mula sa mga patay.”'
    reason: alternative_reading
  - marker: b
    text: 'Mas literal: “mula sa hanay ng mga patay.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβαινόντων
  choice: Habang bumababa
  rationale: Ipinahahayag ng pangkasalukuyang participle ang kilos na kasabay ng pag-uutos; natural sa Tagalog ang “habang bumababa.”
- source_word: ὄρους
  choice: bundok
  rationale: Karaniwang tumutukoy ang ὄρος sa bundok, at ito ang angkop sa tagpuan ng pagbabagong-anyo.
- source_word: διεστείλατο
  choice: mahigpit silang inutusan niya
  rationale: Ang pandiwa ay nagpapahiwatig ng mariing tagubilin o utos. Pinananatili ng “mahigpit na inutusan” ang lakas nito sa natural na modernong Tagalog.
- source_word: ἵνα μηδενὶ
  choice: na huwag sabihin kaninuman
  rationale: Natural nitong ipinahahayag ang nilalaman ng utos at pinananatili ang tahasang pagbabawal na ipaalam ito sa sinuman.
- source_word: ἃ εἶδον
  choice: ang kanilang nakita
  rationale: Likas na salin ito ng pangmaramihang neutral na panghalip at malinaw na tumutukoy sa pangitaing katatapos lamang nilang masaksihan.
- source_word: διηγήσωνται
  choice: sabihin
  rationale: Maaaring mangahulugan ang pandiwa ng pagsasalaysay o pag-uulat; sapat at natural ang “sabihin” dahil malinaw na ang nilalaman ay “ang kanilang nakita.”
- source_word: εἰ μὴ ὅταν
  choice: maliban kapag
  rationale: Malapit ito sa anyo ng Griyegong parirala at pinananatili ang pagbubukod na nakatali sa isang pangyayari sa hinaharap, kahit mas idiomatiko sa Tagalog ang “hanggang sa.”
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Pinananatili nito ang kinikilalang titulo ni Jesus at ang mga pahiwatig nito sa Kasulatan nang hindi ito ginagawang pangkalahatang katawagan lamang sa tao.
- source_word: ἐκ νεκρῶν
  choice: mula sa mga patay
  rationale: Natural ito sa Tagalog at ipinahihiwatig na bumangon siya mula sa hanay ng mga taong patay; nililinaw sa talababa ang mas tahasang anyo.
- source_word: ἀναστῇ
  choice: ay bumangon na
  rationale: Ang aorist subjunctive pagkatapos ng ὅταν ay tumutukoy sa pangyayaring darating ngunit ganap na sa tinutukoy na panahon; ipinahahayag ito ng “bumangon na.”
theological_decisions:
- issue: Pagkasalin sa ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  alternative: ang Taong Anak / ang Makataong Isa
  rationale: Ang “Anak ng Tao” ang malinaw at kinikilalang salin ng titulo, at pinananatili nito ang posibleng alusyon sa Daniel nang hindi nilulutas ang buong saklaw ng kahulugan nito.
- issue: Pamanahong bisa ng εἰ μὴ ὅταν
  choice: maliban kapag ang Anak ng Tao ay bumangon na
  alternative: hanggang sa bumangon na ang Anak ng Tao
  rationale: Mas tuwirang sinusundan ng “maliban kapag” ang anyo ng Griyego, samantalang ipinakikita sa talababa ang mas idiomatikong pagpapahayag ng praktikal na bisa ng utos.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “mahigpit na inutusan” upang mapanatili ang diin ng utos, at ang bahagyang di-karaniwang “maliban kapag” upang hindi mawala ang tunay na anyo at tensiyong pamanahon ng Griyego; ibinigay sa talababa ang mas natural na “hanggang sa.”
