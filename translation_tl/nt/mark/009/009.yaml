- from: Habang bumababa sila mula sa bundok, mahigpit silang inutusan niya na huwag sabihin kaninuman ang kanilang nakita, maliban kapag[a] ang Anak ng Tao ay bumangon na mula sa mga patay.[b]
  to: Habang bumababa sila mula sa bundok, mahigpit niya silang inutusan na huwag sabihin kaninuman ang kanilang nakita hanggang sa[a] bumangon na ang Anak ng Tao mula sa mga patay.[b]
  rationale: Inilipat sa pangunahing teksto ang idiomatikong “hanggang sa,” na malinaw na naghahayag ng pansamantalang pagbabawal hanggang sa hinaharap na pagkabuhay. Iningatan sa talababa ang mas malapit na anyo ng Griyegong εἰ μὴ ὅταν. Inayos din ang ayos ng pangungusap at pinino ang lexical na talababa para sa ἐκ νεκρῶν.
