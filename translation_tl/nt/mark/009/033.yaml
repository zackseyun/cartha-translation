  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ⸀ἦλθον εἰς Καφαρναούμ. καὶ ἐν τῇ οἰκίᾳ γενόμενος ἐπηρώτα αὐτούς· Τί ἐν τῇ ⸀ὁδῷ διελογίζεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/033.yaml
  text: And they came to Capernaum. And when he was in the house, he was asking them, “What were you discussing on the way?”
translation:
  language: tl
  text: At dumating sila sa Capernaum. Nang nasa bahay na siya, tinanong niya sila, “Ano ang pinag-uusapan ninyo habang nasa daan?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Ano ang pinagtatalunan ninyo habang nasa daan?” Ang pandiwa ay maaaring tumukoy sa pag-uusap, pakikipagdebate, o pagtatalo; ipinakikita ng kasunod na talata na pinag-usapan nila kung sino sa kanila ang pinakadakila.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον
  choice: dumating sila
  rationale: Ang aorist ng ἔρχομαι kasama ng εἰς at isang lugar ay nagsasalaysay ng pagdating sa Capernaum; likas sa Tagalog ang “dumating sila.”
- source_word: Καφαρναούμ
  choice: Capernaum
  rationale: Ginamit ang karaniwang anyo ng pangalan ng lugar sa makabagong saling Filipino.
- source_word: ἐν τῇ οἰκίᾳ γενόμενος
  choice: nang nasa bahay na siya
  rationale: Ipinahahayag ang temporal na gamit ng participle at pinananatili ang tiyak at konkretong tagpuan na “bahay,” nang hindi ipinapalagay na sarili nilang tahanan iyon.
- source_word: ἐπηρώτα
  choice: tinanong niya sila
  rationale: Bagaman imperfect ang pandiwa, ang simpleng naganap na “tinanong” ang mas likas na salaysay sa Tagalog; hindi naman hinihingi ng konteksto na gawing paulit-ulit ang pagtatanong.
- source_word: ἐν τῇ ὁδῷ
  choice: habang nasa daan
  rationale: Likas na katumbas ito sa konteksto ng paglalakbay at malinaw na tumutukoy sa nangyari bago sila dumating.
- source_word: διελογίζεσθε
  choice: pinag-uusapan ninyo
  rationale: Sinasaklaw nito ang talakayan, pagtatalo, o pakikipagdebate nang hindi agad pinatitindi ang tono; ipinahihiwatig ng kasunod na talata na maaaring may pagtatalo.
theological_decisions:
- issue: Paglipat mula sa maramihang paksa ng ἦλθον tungo sa isahang paksa ng γενόμενος at ἐπηρώτα
  choice: “dumating sila … nasa bahay na siya, tinanong niya sila”
  alternative: “dumating sila … pagpasok ni Jesus sa bahay, tinanong niya sila”
  rationale: Malinaw sa konteksto na si Jesus ang isahang paksa, ngunit hindi na kailangang idagdag ang pangalang “Jesus,” na wala sa talata. Pinananatili rin nito ang likas na paglipat ng paksa sa Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pambungad na “At” upang katawanin ang Καὶ at ang tuloy-tuloy na estilo ng salaysay ni Marcos. Ginamit ang “pinag-uusapan” sa pangunahing teksto upang mapanatili ang lawak ng kahulugan, at inilagay sa talababa ang mas matinding “pinagtatalunan.”
