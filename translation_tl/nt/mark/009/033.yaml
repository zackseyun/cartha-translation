  verdict: approve
  source_fidelity: 'Tumpak ang salin sa pangunahing daloy ng Griyego: ang maramihang pagdating sa Capernaum, ang kasunod na isahang paksa na si Jesus, ang tagpuang nasa bahay, at ang tanong tungkol sa usapan nila sa daan. Ang simpleng naganap na “tinanong niya” ay isang likas na Filipino na pagsasalin ng imperfect na ἐπηρώτα sa kontekstong pasalaysay; hindi nito binabago ang kahulugan.'
  naturalness: 'Likas at malinaw ang modernong Filipino: “At dumating sila sa Capernaum. Nang nasa bahay na siya, tinanong niya sila...” Ang “habang nasa daan” ay idiomatiko at malinaw na tumutukoy sa paglalakbay bago sila dumating.'
