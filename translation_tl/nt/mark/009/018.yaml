  to: At saanman siya sakmalin nito, ibinabagsak siya nito; nagbubula siya, kinikiskis niya ang kanyang mga ngipin, at naninigas siya.[a] Sinabi ko sa mga alagad mo na palayasin ito, ngunit hindi nila kinaya.
