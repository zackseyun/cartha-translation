source:
  edition: SBLGNT
  text: καὶ ὅπου ⸀ἐὰν αὐτὸν καταλάβῃ ῥήσσει αὐτόν, καὶ ἀφρίζει καὶ τρίζει τοὺς ⸀ὀδόντας καὶ ξηραίνεται· καὶ εἶπα τοῖς μαθηταῖς σου ἵνα αὐτὸ ἐκβάλωσιν, καὶ οὐκ ἴσχυσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/018.yaml
  text: And wherever it seizes him[a], it throws him down, and he foams and grinds his teeth and becomes rigid. And I told your disciples to cast it out, but they were not able.
translation:
  language: tl
  text: At saanman siya sakmalin nito, ibinabagsak siya nito; nagbubula siya, kinikiskis niya ang kanyang mga ngipin, at naninigas siya.[a] Sinabi ko sa mga alagad mo na palayasin ito, ngunit hindi nila kinaya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “natutuyo,” “nangangalirang,” o “nanghihina.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἐὰν
  choice: saanman
  rationale: Ipinahahayag ng parirala ang di-tiyak at paulit-ulit na pangyayari; pinananatili ng “saanman” ang anyong panlunan ng Griyego.
- source_word: καταλάβῃ
  choice: sunggaban
  rationale: Malinaw at masiglang ipinapakita nito ang marahas na paghawak ng espiritu sa bata.
- source_word: ῥήσσει
  choice: ibinabagsak
  rationale: Sa konteksto, tumutukoy ito sa marahas na pagpapabagsak sa bata, hindi sa literal na pagpunit sa kanyang katawan.
- source_word: ἀφρίζει
  choice: nagbubula
  rationale: Tuwirang katumbas ito ng pandiwang “bumula”; hindi na idinagdag sa pangunahing teksto ang “ang bibig” dahil hindi iyon tahasang nasa Griyego.
- source_word: τρίζει τοὺς ὀδόντας
  choice: nagkikiskisan ang kanyang mga ngipin
  rationale: Inilalarawan nito ang pisikal na pagkikiskis ng mga ngipin at iniiwasan ang posibleng pahiwatig ng galit sa “nagngangalit.”
- source_word: ξηραίνεται
  choice: naninigas
  rationale: Ang “naninigas” ay angkop sa pagkakasunod-sunod ng mga sintomas, ngunit inilalagay sa talababa ang mas literal at posibleng ibang mga kahulugan.
- source_word: εἶπα
  choice: sinabi ko
  rationale: Natural at tapat na paglilipat ng pagsasalita ng ama sa mga alagad.
- source_word: ἐκβάλωσιν
  choice: palayasin
  rationale: Karaniwang Filipino para sa pagpapaalis o pagpapalabas ng masamang espiritu.
- source_word: οὐκ ἴσχυσαν
  choice: hindi nila kinaya
  rationale: Natural na ipinapahayag ang kawalan nila ng kakayahan o lakas nang hindi tinutukoy ang dahilan ng kanilang pagkabigo.
theological_decisions:
- issue: Tinutukoy ng αὐτό sa “palayasin ito”
  choice: Ang “ito” ay tumutukoy sa espiritung sumasakmal sa bata.
  alternative: Maaari itong unawain nang mas pangkalahatan bilang karamdamang nagpapahirap sa bata.
  rationale: Sa agarang konteksto, isang espiritu ang kumikilos sa bata at siyang pinapalayas sa mga alagad. Pinananatili ng “ito” ang panghalip na walang kasariang gramatikal sa Griyego nang hindi nagdaragdag ng katawagan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga alagad” at “palayasin” bilang pamilyar na bokabularyong biblikal, habang pinanatiling natural ang daloy ng pangungusap.
