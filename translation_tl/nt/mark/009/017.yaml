  yaml_path: translation/nt/mark/009/017.yaml
  text: And one from the crowd answered him[a], “Teacher, I brought my son to you, having a mute spirit.”
translation:
  language: tl
  text: At sumagot sa kanya ang isa sa karamihan, “Guro, dinala ko sa iyo ang aking anak na lalaki na may espiritung pipi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: sumagot
  rationale: Karaniwang pandiwang pasalaysay ito para sa pagtugon at natural sa modernong Tagalog.
- source_word: εἷς ἐκ τοῦ ὄχλου
  choice: ang isa mula sa karamihan
  rationale: Pinananatili nito ang partitive at di-tiyak na diwa ng Griyego nang hindi tahasang nagdaragdag ng salitang ‘lalaki.’
- source_word: Διδάσκαλε
  choice: Guro
  rationale: Tuwirang katumbas ito ng tawag sa isang nagtuturo at natural bilang pantawag.
- source_word: ἤνεγκα
  choice: dinala ko
  rationale: Natural na simpleng naganap na anyo para sa aorist sa salaysay.
- source_word: τὸν υἱόν μου
  choice: ang anak kong lalaki
  rationale: Tiyak na ipinahahayag ng υἱός ang relasyong anak na lalaki; iniiwasan ng saling ito ang posibleng kalabuan ng ‘anak’ lamang.
- source_word: πρὸς σέ
  choice: sa inyo
  rationale: Natural na Tagalog para sa pagdadala sa kausap; ang magalang na panghalip ay angkop sa pakikipag-usap sa gurong kinikilala ng nagsasalita.
- source_word: ἔχοντα
  choice: na may
  rationale: Natural na sugnay na panuring sa Tagalog na malinaw na tumutukoy sa anak at malapit sa participial construction.
- source_word: πνεῦμα ἄλαλον
  choice: espiritung pipi
  rationale: Tuwirang pinananatili ang ‘espiritu’ at ang katangiang ἄλαλον nang hindi idinaragdag ang ‘masama’ o ‘demonyo,’ na ipinahihiwatig lamang ng konteksto.
theological_decisions:
- issue: Kahulugan ng πνεῦμα sa konteksto ng pagpapalayas ng espiritu
  choice: espiritu
  alternative: masamang espiritu / demonyo
  rationale: Ipinahihiwatig ng mas malawak na konteksto na mapaminsalang espiritu ito, ngunit ‘espiritu’ lamang ang tahasang nasa talata; kaya hindi idinagdag sa pangunahing teksto ang interpretasyong ‘masama’ o ‘demonyo.’
- issue: Ugnayan ng ἔχοντα sa anak
  choice: na may espiritung pipi
  alternative: dahil may espiritung pipi siya
  rationale: Ang participle ay tuwirang naglalarawan sa anak. Pinananatili ng ‘na may’ ang ugnayang ito nang hindi ginagawang tahasang sanhi ang konstruksyon.
translation_notes:
  register: Modernong, marangal, at madaling maunawaang Filipino. Ginamit ang ‘po’ at ‘inyo’ bilang likas na paggalang sa tuwirang pakikipag-usap sa isang gurong tinatawag na ‘Guro,’ nang hindi dinaragdagan ang antas ng awtoridad ng pamagat.
