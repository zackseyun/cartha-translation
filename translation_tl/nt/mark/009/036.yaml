translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginawang magkakahiwalay na sugnay ang mga participle upang maging natural ang daloy, ngunit pinanatili ang pagkakasunod-sunod ng mga kilos at ang konkretong kahulugan ng “pinatayo.”
