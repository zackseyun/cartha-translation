  yaml_path: translation/nt/mark/009/036.yaml
  text: 'And taking a child[a], he set him in their midst, and taking him in his arms[b], he said to them:'
translation:
  language: tl
  text: 'Kumuha siya ng isang bata at pinatayo niya ito[a] sa gitna nila. Pagkatapos, niyakap niya ang bata[b] at sinabi sa kanila:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “inilagay niya ito sa gitna nila.” Ang pandiwang Griyego ay nangangahulugang “pinatayo niya ito.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “tinanggap niya ito sa kanyang mga bisig.” Ang pandiwang Griyego ay maaaring tumukoy sa pagkuha sa mga bisig o sa pagyakap.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼ
  choice: Kumuha siya
  rationale: Ang aorist participle ay nagsasaad ng kilos na nauna sa pangunahing pandiwa. Natural sa Filipino ang tahasang sugnay na “Kumuha siya” habang napapanatili ang pagkakasunod-sunod ng mga kilos.
- source_word: παιδίον
  choice: isang bata
  rationale: Tumutukoy ito sa isang bata; hindi kailangang idagdag ang “maliit” o “musmos,” sapagkat maaaring maging labis na tiyak ang mga iyon.
- source_word: ἔστησεν
  choice: pinatayo ito
  rationale: Causative ang gamit ng ἵστημι rito, kaya ang “pinatayo” ang tuwirang katumbas ng pagpapangyaring tumayo ang bata, sa halip na mas pangkalahatang “inilagay.”
- source_word: ἐν μέσῳ αὐτῶν
  choice: sa gitna nila
  rationale: Pinananatili nito ang malinaw na diwang panglokasyon ng parirala at natural itong pakinggan sa modernong Filipino.
- source_word: ἐναγκαλισάμενος
  choice: niyakap niya ang bata
  rationale: Maaaring tumukoy ang pandiwa sa pagyakap o pagkandong/pagkuha sa mga bisig. Ang “niyakap” ay natural at hindi nagpapalagay na binuhat o dinala ang bata.
- source_word: εἶπεν αὐτοῖς
  choice: sinabi sa kanila
  rationale: Ito ang tuwiran at neutral na salin ng karaniwang pormula ng pagsasalita.
