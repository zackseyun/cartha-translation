  text: καὶ ἤνεγκαν αὐτὸν πρὸς αὐτόν. καὶ ἰδὼν αὐτὸν ⸂τὸ πνεῦμα εὐθὺς⸃ ⸀συνεσπάραξεν αὐτόν, καὶ πεσὼν ἐπὶ τῆς γῆς ἐκυλίετο ἀφρίζων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/020.yaml
  text: And they brought him to him[a]. And when the spirit saw him, it immediately convulsed him, and he fell on the ground and rolled about[b], foaming.
translation:
  language: tl
  text: At dinala nila ang bata kay Jesus. Nang makita ng espiritu[a] si Jesus, agad nitong pinangisay[b] ang bata; bumagsak siya sa lupa at nagpagulong-gulong habang bumubula.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa talatang ito, “espiritu” lamang ang nakasulat; ipinakikilala ito ng mas malawak na konteksto bilang maruming espiritu.
    reason: alternative_reading
  - marker: b
    text: 'Maaari ring isalin: “pinakumbulsyon.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνεγκαν αὐτὸν πρὸς αὐτόν
  choice: dinala nila ang bata kay Jesus
  rationale: Nililinaw sa natural na Tagalog ang dalawang magkaibang tinutukoy ng magkasunod na panghalip—ang bata at si Jesus—batay sa malinaw na konteksto, nang hindi nagdaragdag ng bagong pangyayari.
- source_word: ἰδὼν αὐτόν
  choice: Nang makita ... si Jesus
  rationale: Temporal ang gamit ng aorist participle, kaya natural ang “Nang makita.” Nilinaw na si Jesus ang nakita upang maiwasan ang malabong reperensiya ng panghalip sa Tagalog.
- source_word: τὸ πνεῦμα
  choice: ang espiritu
  rationale: Pinananatili ang payak na katawagan ng mismong talata; hindi idinagdag sa pangunahing teksto ang “masamang” o “maruming,” bagaman gayon ito inilalarawan sa mas malawak na konteksto.
- source_word: εὐθὺς συνεσπάραξεν αὐτόν
  choice: agad nitong pinapangisay ang bata
  rationale: Ipinahahayag ng “agad” ang εὐθύς, at ng “pinapangisay” ang marahas na pangingisay na idinulot ng espiritu. Nililinaw ng “ang bata” kung sino ang nakaranas nito.
- source_word: πεσὼν ἐπὶ τῆς γῆς ἐκυλίετο
  choice: bumagsak siya sa lupa at nagpagulong-gulong
  rationale: Natural na isinasalaysay sa Tagalog ang pagkakasunod ng pagbagsak at patuloy na paggulong; ipinahihiwatig ng “nagpagulong-gulong” ang nagpapatuloy o paulit-ulit na kilos ng imperfect.
- source_word: ἀφρίζων
  choice: habang bumubula
  rationale: Pinananatili ang kasabay na kilos at hindi idinaragdag sa pangunahing teksto ang “ang bibig,” na ipinahihiwatig lamang ngunit hindi tahasang nasa Griyego.
theological_decisions:
- issue: Pagkakakilanlan ng πνεῦμα
  choice: espiritu
  alternative: maruming espiritu; demonyo
  rationale: Bagaman tinutukoy ng konteksto ang espiritu bilang marumi, “ang espiritu” lamang ang nasa talatang ito. Pinananatili nito ang eksaktong antas ng pagtukoy ng pinagmulang teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na salaysay. Ginamit ang “bata” at “Jesus” sa halip na magkakasunod na malalabong panghalip, sapagkat malinaw ang kanilang mga referent sa konteksto. Iniwasan ang teknikal o lipas na pananalita at hindi idinagdag ang “sa bibig” sa pangunahing teksto.
