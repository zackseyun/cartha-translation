  text: And when they came to the disciples[a], they saw a large crowd around them, and scribes arguing with them.
translation:
  language: tl
  text: Pagdating nila sa mga alagad, nakita nila ang isang malaking pulutong na nakapaligid sa mga alagad at ang mga eskriba na nakikipagtalo sa kanila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nakikipagdebate sa kanila.” Ang pandiwang Griego ay maaaring tumukoy sa pagtalakay o pakikipagdebate, ngunit sa kontekstong ito ay malamang na may diwa ng pagtatalo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες πρὸς τοὺς μαθητάς
  choice: Pagdating nila sa ibang mga alagad
  rationale: Ginawang likas na sugnay na temporal sa Tagalog ang aorist participle. Idinagdag ang “ibang” upang malinaw na ang tinutukoy ay ang mga alagad na nilapitan ng pangkat ni Jesus, gaya ng ipinahihiwatig ng konteksto, nang hindi binabago ang referent.
- source_word: εἶδον
  choice: nakita nila
  rationale: Tuwirang salaysay ng simpleng aorist ng ὁράω.
- source_word: ὄχλον πολύν
  choice: napakaraming tao
  rationale: Likas na modernong Tagalog para sa isang malaking pulutong; malinaw nitong ipinahahayag ang dami.
- source_word: περὶ αὐτούς
  choice: sa paligid ng mga ito
  rationale: Pinananatili ang spatial na diwa ng περί. Ang “mga ito” ay tumutukoy sa ibang mga alagad at umiiwas sa kalituhan sa unang “nila.”
- source_word: γραμματεῖς
  choice: mga tagapagturo ng Kautusan
  rationale: Ipinahahayag sa karaniwang modernong Filipino ang tungkulin ng mga γραμματεῖς bilang mga dalubhasa at guro sa Kautusan; mas madaling maunawaan kaysa sa transliterasyong “mga eskriba.”
- source_word: συζητοῦντας πρὸς αὐτούς
  choice: nakikipagtalo sa kanila
  rationale: Sa kontekstong ito, ang συζητέω ay malamang na tumutukoy sa mainitang pakikipagtalakayan o pagtatalo. Ang “sa kanila” ay tumutukoy sa mga alagad.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “mga tagapagturo ng Kautusan” bilang madaling maunawaang katawagan sa pangkat na tradisyonal na tinatawag na mga eskriba. Inilagay ang panandang talababa [a] kaagad pagkatapos ng pariralang tinatalakay nito.
