    rationale: Walang katumbas na salitang “ibang” sa Griyego. Hindi dapat ilagay sa teksto ang impormasyong hinango lamang mula sa konteksto.
  - severity: low
    issue: “Mga tagapagturo ng Kautusan” ang isinalin para sa γραμματεῖς.
    rationale: Ito ay interpretatibong paliwanag sa halip na ang pangkatang katawagang “mga eskriba”; maaari nitong limitahan ang saklaw ng termino.
  - severity: low
    issue: Hindi gaanong malinaw ang “sa paligid ng mga ito.”
    rationale: Mas tuwiran at natural ang pag-uulit ng “mga alagad,” at pinananatili nito ang malinaw na antecedent ng parehong panghalip sa talata.
