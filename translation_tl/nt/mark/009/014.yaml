  source_fidelity: Ang dagdag na “ibang” sa “ibang mga alagad” ay wala sa Griyego. Bagaman ipinakikilala ng mas malawak na konteksto ang pagkakaiba ng pangkat na kasama ni Jesus at ng mga alagad na iniwan, hindi ito dapat idagdag sa mismong salin. Ang “mga tagapagturo ng Kautusan” ay nagpapaliwanag at bahagyang nagpapakitid sa γραμματεῖς; mas tumpak na panatilihin ang “mga eskriba.”
  naturalness: Mas natural at malinaw ang pag-uulit ng “mga alagad” sa halip na “mga ito,” na maaaring maging malamig o hindi agad malinaw ang tinutukoy. Ang “isang malaking pulutong” ay malinaw at angkop sa modernong Filipino.
  terminology: “Mga eskriba” ang pinakamalapit at matatag na katumbas ng γραμματεῖς. Iniiwasan nito ang pagpapakahulugang “mga tagapagturo ng Kautusan,” na hindi lubos na saklaw ang katawagang Griyego sa anyong ito.
  issues:
