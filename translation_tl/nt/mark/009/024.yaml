  text: ⸀εὐθὺς κράξας ὁ πατὴρ τοῦ ⸀παιδίου ἔλεγεν· ⸀Πιστεύω· βοήθει μου τῇ ἀπιστίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/024.yaml
  text: Immediately the father of the child cried out and said[a], “I believe[b]; help my unbelief!”
translation:
  language: tl
  text: Kaagad na sumigaw ang ama ng bata[a] at nagsabi, “Naniniwala ako; tulungan mo ako sa aking kawalan ng pananampalataya[b]!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “batang lalaki.” Maaaring mangahulugan ang Griyegong παιδίον ng “bata” o “batang lalaki,” ayon sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: O “tulungan mo ako sa aking kakulangan ng pananampalataya.” Maaaring tumukoy ang Griyegong ἀπιστία sa kawalan ng paniniwala o sa kakulangan ng pananampalataya.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθύς
  choice: Kaagad
  rationale: Ipinahahayag nito ang mabilis na tugon ng ama at pinananatili ang apurahang himig na karaniwan sa salaysay ni Marcos.
- source_word: κράξας
  choice: sumigaw
  rationale: Ipinahihiwatig ng pandiwari ang malakas at marubdob na pagsasalita. Likas at tuwiran sa modernong Tagalog ang “sumigaw.”
- source_word: ὁ πατὴρ τοῦ παιδίου
  choice: ang ama ng bata
  rationale: Malinaw at natural itong katumbas ng pariralang Griyego. Maaaring tumukoy ang παιδίον sa isang bata o batang lalaki; hindi kailangang paliitin ang kahulugan sa pangunahing teksto.
- source_word: ἔλεγεν
  choice: at nagsabi
  rationale: Bagaman nasa imperfect ang Griyego, natural na ipinakikilala sa Tagalog ang tuwirang sinabi sa pamamagitan ng “nagsabi.”
- source_word: Πιστεύω
  choice: Naniniwala ako
  rationale: Pinakamalinaw nitong pinananatili ang diwa ng πιστεύω at ang tuwirang kaugnayan nito sa ἀπιστία sa kasunod na pahayag.
- source_word: βοήθει
  choice: tulungan mo ako
  rationale: Ang present imperative ay isang tuwiran at apurahang pakiusap. Idinagdag ang “ako” bilang natural na pagpapahayag sa Tagalog ng μου sa parirala.
- source_word: μου τῇ ἀπιστίᾳ
  choice: sa kawalan ko ng pananampalataya
  rationale: Natural sa Tagalog ang pariralang ito at saklaw nito ang diwa ng ἀπιστία bilang kawalan o kakulangan ng pananampalataya, nang hindi pinapahiwatig na ganap na walang anumang paniniwala ang ama.
theological_decisions:
- issue: Ang tensiyon sa pagitan ng Πιστεύω at ἀπιστίᾳ
  choice: 'Pinanatili ang kabalintunaan: “Naniniwala ako; tulungan mo ako sa kawalan ko ng pananampalataya!”'
  alternative: “Naniniwala ako; tulungan mo ako sa kakulangan ko ng pananampalataya!”
  rationale: Magkasabay na ipinahahayag ng ama ang tunay na paniniwala at ang natitira niyang kawalan o kakulangan ng pananampalataya. Hindi nilulutas o pinapakinis ng salin ang sinadyang tensiyong ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang biglaan at marubdob na sigaw ng ama at ang maigting na kabalintunaan ng kanyang pakiusap.
