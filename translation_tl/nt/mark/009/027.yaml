  text: ὁ δὲ Ἰησοῦς κρατήσας ⸂τῆς χειρὸς αὐτοῦ⸃ ἤγειρεν αὐτόν, καὶ ἀνέστη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/027.yaml
  text: But Jesus[a], taking hold of his hand, raised him up[b], and he stood up.
translation:
  language: tl
  text: Ngunit hinawakan ni Jesus ang kamay ng bata at ibinangon niya ito[a], at tumayo ang bata[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “inangat niya ito”; maaari ring gamitin ang pandiwang Griyego sa mga konteksto ng paggising mula sa tulog o pagbangon mula sa kamatayan.
    reason: lexical_alternative
  - marker: b
    text: O “bumangon ang bata.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahahayag ang banayad na pagsalungat sa palagay ng mga tao na patay na ang bata, habang likas pa ring naitutuloy ang salaysay.
- source_word: κρατήσας
  choice: hinawakan
  rationale: Ipinananatili ang kongkretong pagkilos ni Jesus na paghawak sa kamay ng bata, nang hindi nagdaragdag ng di-tiyak na diin gaya ng “mahigpit.”
- source_word: τῆς χειρὸς αὐτοῦ
  choice: ang kamay ng bata
  rationale: Tiyak na pinananatili ang χείρ bilang “kamay.” Ginawang tahasan ang tinutukoy ng panghalip upang maiwasan sa Tagalog ang maling pagkaunawa na sariling kamay ni Jesus ang hinawakan niya.
- source_word: ἤγειρεν αὐτόν
  choice: ibinangon niya ito
  rationale: 'Likas na ipinahahayag ang sanhiang kilos: pinabangon ni Jesus ang batang nakahandusay. Nananatili rin ang posibleng alingawngaw ng bokabularyo ng muling pagkabuhay nang hindi sinasabing nabuhay siyang muli mula sa kamatayan.'
- source_word: ἀνέστη
  choice: tumayo ang bata
  rationale: Malinaw at pangkasalukuyang Tagalog para sa naging resulta ng pagkilos ni Jesus. Inulit ang “bata” upang maging malinaw ang simuno at maiwasan ang kalituhan sa sunod-sunod na panghalip.
theological_decisions:
- issue: Posibleng alingawngaw ng wikang tumutukoy sa muling pagkabuhay sa ἤγειρεν / ἀνέστη
  choice: Gamitin ang “ibinangon” at “tumayo,” na pangunahing tumutukoy sa pisikal na pagbangon sa konteksto ngunit hindi lubusang nag-aalis sa mas malawak na gamit ng mga pandiwang Griyego.
  alternative: “Tinulungan niyang makatayo ang bata, at tumayo ito,” na mas tahasang pangkaraniwan ngunit nagpapahina sa lakas at posibleng alingawngaw ng orihinal na mga pandiwa.
  rationale: Hindi tahasang sinasabi ng talata na muling binuhay ni Jesus ang bata mula sa kamatayan. Gayunman, ang mga pandiwang ginamit ni Marcos ay maaari ring lumitaw sa mga konteksto ng paggising at muling pagkabuhay, kaya hindi dapat lubusang burahin ang tensiyong iyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasan ang malabong sunod-sunod na panghalip sa pamamagitan ng paggamit sa “bata,” na malinaw mula sa konteksto. Parehong nakalagay sa pangunahing teksto ang mga panandang talababa [a] at [b].
