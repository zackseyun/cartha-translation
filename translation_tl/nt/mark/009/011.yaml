  source_fidelity: Ang “Bakit,” “kailangang,” at “maunang dumating” ay tapat sa patanong na gamit ng ὅτι at sa lakas ng δεῖ ἐλθεῖν πρῶτον. Ang imperpektong ἐπηρώτων ay mahusay na naihahatid ng “patuloy ... tinatanong.” Gayunman, ang “mga tagapagturo ng Kautusan” ay nagpapaliwanag at bahagyang nagpapalawak sa γραμματεῖς; mas tapat ang “mga eskriba,” na maaaring samahan ng maikling paliwanag sa talababa.
  naturalness: Natural at malinaw ang pangungusap sa modernong Filipino. Ang “At patuloy nila siyang tinatanong” ay katanggap-tanggap na pagsasalaysay at pinananatili ang nagpapatuloy o paulit-ulit na aspekto ng Griyego.
  terminology: “Elias” ay ang nakaugaliang Filipino na anyo ng Ἠλίας. Pinalitan ang “mga tagapagturo ng Kautusan” ng “mga eskriba” upang mapanatili ang natatanging makasaysayang katawagan ng γραμματεῖς nang hindi ipinapalit ang isang interpretatibong paglalarawan.
