base_translation:
  language: en
  yaml_path: translation/nt/mark/009/011.yaml
  text: And they were asking him[a], saying, “Why do the scribes say that Elijah must come first?”
translation:
  language: tl
  text: At patuloy nila siyang tinatanong, “Bakit sinasabi ng mga eskriba na kailangang maunang dumating si Elias?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτων
  choice: patuloy nila siyang tinatanong
  rationale: Ipinahahayag ng imperpektong anyo ang nagpapatuloy na pagtatanong sa tagpong pasalaysay.
- source_word: λέγοντες
  choice: —
  rationale: Hindi na hiwalay na isinalin ang participle dahil likas nang ipinakikilala ng pandiwang “tinatanong” ang tuwirang tanong sa Filipino.
- source_word: Ὅτι
  choice: Bakit
  rationale: Sa kontekstong patanong, ang ὅτι ay idiomatikong nagpapakilala ng tanong na “bakit” o “paanong nangyari na”; malinaw at natural dito ang “Bakit.”
- source_word: γραμματεῖς
  choice: mga tagapagturo ng Kautusan
  rationale: Ipinakikita nito ang makasaysayang tungkulin ng mga γραμματεῖς sa kontekstong Judio at mas madaling maunawaan ng karaniwang mambabasang Filipino kaysa sa “mga eskriba.”
- source_word: Ἠλίαν
  choice: Elias
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Filipino.
- source_word: δεῖ
  choice: kailangang
  rationale: Pinananatili nito ang lakas ng pangangailangan o itinakdang pagkakailangan nang hindi ipinapaliwanag kung saan ito nagmumula.
- source_word: ἐλθεῖν πρῶτον
  choice: maunang dumating
  rationale: Natural na Filipino ito para sa temporal na prioridad na ipinahahayag ng πρῶτον kasabay ng “dumating.”
theological_decisions:
- issue: Lakas ng tanong na ipinakikilala ng Ὅτι
  choice: Isinalin bilang tuwirang tanong na “Bakit”
  alternative: “Paanong sinasabi ng mga tagapagturo ng Kautusan…”
  rationale: Malinaw na naihahatid ng “Bakit” ang patanong na gamit, habang ang alternatibo ay nagpapanatili ng maaaring bahagyang naiibang himig ng Griyego.
- issue: Kalikasan ng pagdating ni Elias
  choice: “kailangang maunang dumating si Elias” nang walang dagdag na paliwanag
  alternative: “kailangang bumalik muna si Elias” o “kailangang dumating si Elias bago ang Mesiyas”
  rationale: Hindi tahasang sinasabi sa talata ang “bumalik” o “bago ang Mesiyas,” kaya hindi idinagdag ang mga interpretasyong iyon.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at natural. Ginamit ang “tagapagturo ng Kautusan” upang madaling maunawaan ang tungkulin ng γραμματεῖς; iniwasan ang mas teknikal at di-gaanong karaniwang “eskriba.”
