  text: καὶ ⸂κράξας καὶ πολλὰ σπαράξας⸃ ἐξῆλθεν· καὶ ἐγένετο ὡσεὶ νεκρὸς ὥστε ⸀τοὺς πολλοὺς λέγειν ὅτι ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/026.yaml
  text: And after crying out and convulsing him greatly[a], it came out; and he became like a dead man, so that many were saying[b], “He is dead.”
translation:
  language: tl
  text: Sumigaw ang espiritu at pinangisay nito nang matindi ang bata[a], saka ito lumabas. Ang bata ay naging parang patay[b], kaya marami ang nagsabi, “Namatay na siya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “at matapos nitong ihulog ang bata sa matinding pangingisay.”
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “naging parang patay”; inilalarawan nito ang anyo o kalagayan niya sa paningin ng mga nakakita, hindi tahasang sinasabing talagang namatay siya.
    reason: lexical_alternative
lexical_decisions:
- source_word: κράξας
  choice: sumigaw
  rationale: Pinananatili ang payak na diwa ng pandiwa nang hindi ipinapalagay kung sigaw, hiyaw, o tili ang tiyak na tunog.
- source_word: πολλὰ σπαράξας
  choice: pinangisay nito nang matindi ang bata
  rationale: Sa konteksto ng pagpapalayas ng espiritu, ang σπαράσσω ay tumutukoy sa marahas na pangingisay, hindi sa literal na paglalapa o pagpunit. Ginawang tahasan ang bagay na ‘ang bata’ mula sa konteksto, at isinalin ang intensibong πολλὰ bilang ‘nang matindi.’
- source_word: ἐξῆλθεν
  choice: saka ito lumabas
  rationale: Ang ipinahihiwatig na simuno ay ang espiritu. Ang ‘saka’ ay likas na nagpapakita na ang paglabas ay kasunod ng sigaw at pangingisay.
- source_word: ἐγένετο ὡσεὶ νεκρός
  choice: Ang bata ay naging parang patay
  rationale: Pinananatili ng ‘parang’ ang paghahambing sa ὡσεὶ at hindi sinasabing talagang namatay ang bata.
- source_word: ὥστε τοὺς πολλοὺς λέγειν
  choice: kaya marami ang nagsabi
  rationale: Ang τοὺς πολλούς ay isinaling ‘marami’ nang hindi pinalalakas bilang ‘karamihan.’ Likas sa salaysay sa Filipino ang ‘nagsabi’ para sa reaksiyon ng mga nakakita.
- source_word: ὅτι ἀπέθανεν
  choice: “Namatay na siya.”
  rationale: Ang tuwirang pananalita ay natural sa Filipino, at ang ‘namatay na’ ay malinaw na naghahayag ng naging palagay ng mga tao, hindi ng tahasang pasya ng tagapagsalaysay.
theological_decisions:
- issue: Kung talagang namatay ang bata o mukha lamang siyang patay
  choice: Inilalarawan siyang ‘parang patay,’ samantalang ang pagkamatay ay pahayag lamang ng maraming nakakita.
  alternative: Sabihing talagang namatay ang bata at muling binuhay.
  rationale: Ang ὡσεὶ ay naghahayag ng pagkakatulad o anyo, at ang ‘Namatay na siya’ ay iniulat bilang konklusyon ng mga tao. Hindi nilulutas ng salin ang teksto sa pamamagitan ng pagdaragdag ng muling pagkabuhay.
translation_notes:
  register: Makabagong Filipino na malinaw, marangal, at pasalaysay. Tahasang binanggit ang ‘espiritu’ at ‘bata’ mula sa konteksto upang maiwasan ang malabong pagtukoy ng mga panghalip, habang pinananatili ang paghahambing at pananaw ng mga saksi sa orihinal.
