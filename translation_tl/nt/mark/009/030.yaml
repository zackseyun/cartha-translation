base_translation:
  language: en
  yaml_path: translation/nt/mark/009/030.yaml
  text: And from there[a] they went on through Galilee[b], and he did not want anyone to know.
translation:
  language: tl
  text: Pagkaalis nila roon, dumaraan sila sa Galilea, at ayaw ni Jesus na may makaalam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tahasang sinasabi sa Griyego kung ano ang ayaw ni Jesus na malaman ng sinuman. Sa konteksto, maaaring tumukoy ito sa kanyang presensiya o sa pagdaan nila sa Galilea.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀκεῖθεν ἐξελθόντες
  choice: Pagkaalis nila roon
  rationale: Pinagsasama nito ang pagpapatuloy na ipinahihiwatig ng καί, ang pinanggalingang lugar sa ἐκεῖθεν, at ang tahasang pag-alis sa ἐξελθόντες, sa natural na Filipino.
- source_word: παρεπορεύοντο διὰ τῆς Γαλιλαίας
  choice: dumaan sila sa Galilea
  rationale: Ipinapahayag ng παραπορεύομαι at διά na naglalakbay sila sa loob o sa pamamagitan ng rehiyon. Natural sa Filipino ang “dumaan sa Galilea”; hindi kailangang piliting markahan ang aspektong imperpektibo sa anyong “patuloy na dumaraan.”
- source_word: οὐκ ἤθελεν
  choice: ayaw ni Jesus
  rationale: Ang θέλω ay tumutukoy sa kalooban o nais. Ang “ayaw” ay malinaw, natural, at kasalukuyang Filipino. Tahasang pinangalanan si Jesus upang maging malinaw ang paksa ng pandiwang isahan.
- source_word: ἵνα τις γνοῖ
  choice: na malaman iyon ng sinuman
  rationale: Ipinahihiwatig ng ἵνα na layunin niyang pigilan ang sinuman na makaalam. Walang tahasang layon ang γνοῖ sa Griyego; ang “iyon” ay isang di-tiyak na panghalip na hindi tinutukoy nang higit sa teksto ang bagay na malalaman.
theological_decisions:
- issue: Di-tahasang paksa ng ἤθελεν
  choice: Tinukoy bilang “ni Jesus.”
  alternative: “ayaw niyang”
  rationale: Ang pandiwang isahan ay natural na tumutukoy kay Jesus sa konteksto. Mas malinaw sa Filipino ang tahasang pangalan at hindi ito nagdaragdag ng doktrinal na kahulugan.
- issue: Di-tahasang layon ng γνοῖ
  choice: Pinanatiling di-tiyak sa “iyon,” na may paliwanag sa talababa.
  alternative: “na malaman ng sinuman na naroon siya” o “ang kanilang dinaraanan”
  rationale: Hindi sinasabi ng Griyego kung ano mismo ang ayaw niyang malaman ng iba. Iniiwasan ng salin na gawing tiyak ang maaaring tumukoy sa presensiya, paglalakbay, o ruta ni Jesus.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Pagkaalis nila roon” upang mapanatili ang participial departure, at “dumaan sila sa Galilea” bilang likas na pagsasabi ng paglalakbay sa rehiyon. Ang panandang talababa [a] ay inilagay kaagad pagkatapos ng di-tiyak na “sinuman” upang ipaliwanag ang hindi binanggit na layon ng ‘malaman.’
