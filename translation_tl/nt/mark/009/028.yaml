  rationale: Pinalitan ang “palihim” ng “nang sarilinan” upang tumpak na maipahayag ang pribado at hiwalay-sa-iba na diwa ng κατ’ ἰδίαν. Pinalitan ang “tinanong” ng “nagtatanong” upang mas maipakita ang imperfect na ἐπηρώτων. Hindi binago ang pangunahing pagbasa na “iyon” para sa neuter na αὐτό, at pinanatili ang footnote para sa posibleng pagtukoy nito sa batang lalaki.
