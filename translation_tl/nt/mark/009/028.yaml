  text: καὶ ⸂εἰσελθόντος αὐτοῦ⸃ εἰς οἶκον οἱ μαθηταὶ αὐτοῦ ⸂κατ’ ἰδίαν ἐπηρώτων αὐτόν⸃· Ὅτι ἡμεῖς οὐκ ἠδυνήθημεν ἐκβαλεῖν αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/028.yaml
  text: And when he had entered the house[a], his disciples were asking him privately, “Why were we not able to cast it out?”
translation:
  language: tl
  text: At nang makapasok na siya sa bahay, ang kanyang mga alagad ay nagtatanong sa kanya nang sarilinan, “Bakit hindi namin iyon mapalayas?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “siya,” kung ipalalagay na ang panghalip ay tumutukoy sa batang lalaki sa halip na sa espiritu; neutro ang panghalip sa Griyego, kaya mas natural itong tumukoy sa espiritu.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσελθόντος αὐτοῦ
  choice: nang makapasok na siya
  rationale: Ang aorist participle sa genitive absolute ay nagbibigay ng panahong kaligiran at nagpapahiwatig na natapos muna ang pagpasok bago ang pagtatanong.
- source_word: εἰς οἶκον
  choice: sa bahay
  rationale: Natural sa salaysay na Tagalog ang “sa bahay” para sa pook na nauunawaan na sa konteksto, kahit walang artikulo ang pangngalang Griyego.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ang kanyang mga alagad
  rationale: Ang “mga alagad” ang kinikilalang salin sa konteksto ng mga Ebanghelyo at pinananatili ang ugnayan ng pagsunod at pagkatuto.
- source_word: κατ’ ἰδίαν
  choice: palihim
  rationale: Ipinahihiwatig ng parirala na hiwalay sa iba at hindi sa harap ng madla ang pagtatanong; maikli at natural ang “palihim” sa konteksto.
- source_word: ἐπηρώτων
  choice: tinanong
  rationale: Bagaman imperfect ang pandiwa at maaaring maglarawan ng nagpapatuloy na pagtatanong, mas natural sa Tagalog ang payak na “tinanong”; hindi naman hinihingi ng konteksto ang “paulit-ulit na tinanong.”
- source_word: Ὅτι
  choice: Bakit
  rationale: Sa tuwirang tanong na ito, idiomatikong nangangahulugang “bakit” ang ὅτι.
- source_word: ἡμεῖς οὐκ ἠδυνήθημεν
  choice: hindi namin ... mapalayas
  rationale: Sa Tagalog, likas na naipapahayag ng hulaping ma- sa “mapalayas” ang kawalan ng kakayahang maisagawa ang kilos, habang ang tahasang ἡμεῖς ay nasasalamin sa “namin.”
- source_word: ἐκβαλεῖν
  choice: mapalayas
  rationale: Ang “palayasin” ay natural at tumpak sa konteksto ng pagpapalabas sa masamang espiritu.
- source_word: αὐτό
  choice: iyon
  rationale: Neuter singular ang panghalip at mas natural na tumutukoy sa espiritu kaysa sa batang lalaki. Pinananatili ng “iyon” ang di-personal na pagtukoy nang hindi inuulit ang pangngalan.
theological_decisions:
- issue: Ang tinutukoy ng panghuling panghalip na αὐτό
  choice: Ang masamang espiritu ang tinutukoy, na isinaling “iyon.”
  alternative: Maaaring ipakahulugang ang batang lalaki ang tinutukoy at isaling “siya.”
  rationale: Neuter ang panghalip sa Griyego, kaya mas natural itong tumukoy sa espiritu o demonyo, hindi sa batang lalaki na panlalaki ang kasarian ng pangngalan. Hindi nito dinaragdagan ang teksto ng anumang doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “alagad” bilang pamilyar na terminong biblikal at ang “mapalayas” bilang karaniwang pananalita sa konteksto ng pagpapalayas ng masamang espiritu.
