  source_fidelity: 'Tumpak ang pagsasalin ng pangunahing mga elemento: ang mga damit ay "naging" (ἐγένετο) maningning (στίλβοντα) at napakaputi (λευκὰ λίαν). Ang paghahambing sa walang tagapaglinis ng tela sa lupa na makapagpapaputi nang gayon ay wastong naghahatid ng γναφεύς, ἐπὶ τῆς γῆς, at οὐ δύναται οὕτως λευκᾶναι. Hindi kinakailangang ipilit ang isang hayag na layon pagkatapos ng "makapagpapaputi," sapagkat ang mga damit ang malinaw na ipinahihiwatig ng konteksto, gaya rin ng di-hayag na layon sa Griyego.'
