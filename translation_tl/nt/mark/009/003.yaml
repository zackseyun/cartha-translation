  text: καὶ τὰ ἱμάτια αὐτοῦ ⸀ἐγένετο στίλβοντα λευκὰ ⸀λίαν οἷα γναφεὺς ἐπὶ τῆς γῆς οὐ δύναται ⸀οὕτως λευκᾶναι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/003.yaml
  text: And his clothes became gleaming[a], very white, such as no launderer on earth is able to whiten.
translation:
  language: tl
  text: At naging maningning at napakaputi ang kanyang mga damit—walang sinumang tagapaglinis ng tela[a] sa lupa ang makapagpapaputi nang gayon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang tinutukoy ay isang manggagawang naglilinis, nagpoproseso, at nagpapaputi ng tela; tradisyonal din itong tinatawag na “fuller.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱμάτια
  choice: mga damit
  rationale: Pangkalahatang salita ito para sa kasuotan; natural at malinaw sa modernong Filipino ang “mga damit” at hindi ito kasing-tiyak ng “mga balabal.”
- source_word: ἐγένετο
  choice: naging
  rationale: Ipinahahayag ng pandiwa ang pagbabago ng kalagayan sa tagpo ng pagbabagong-anyo.
- source_word: στίλβοντα
  choice: maningning
  rationale: Inilalarawan nito ang maliwanag at kumikislap na anyo nang hindi nagdaragdag ng tahasang teolohikal na paliwanag.
- source_word: λευκὰ λίαν
  choice: napakaputi
  rationale: Pinagsasama ng “napakaputi” ang payak na kahulugan ng λευκά at ang matinding pagpapalakas ng λίαν sa natural na Filipino.
- source_word: γναφεύς
  choice: tagapaglinis ng tela
  rationale: Tumutukoy ito sa manggagawang naglilinis at nagpapaputi o nagpoproseso ng tela. Mas madaling maunawaan ito kaysa sa isang teknikal o makalumang katawagan.
- source_word: ἐπὶ τῆς γῆς
  choice: sa lupa
  rationale: Tuwirang pinananatili nito ang saklaw ng paghahambing sa kakayahan ng mga tao sa lupa.
- source_word: οὐ δύναται οὕτως λευκᾶναι
  choice: walang sinuman … ang makapagpapaputi nang gayon
  rationale: Natural na Filipino itong nagpapahayag ng kawalan ng kakayahan at pinananatili ang antas ng kaputiang tinutukoy ng οὕτως.
theological_decisions:
- issue: Paglalarawan sa nakikitang epekto ng pagbabagong-anyo
  choice: Ilarawan lamang ang mga damit bilang naging maningning at napakaputi.
  alternative: Gumamit ng interpretatibong pananalitang gaya ng “nagniningning sa kaluwalhatian.”
  rationale: Ang talata ay tuwirang naglalarawan sa nakikitang anyo ng mga damit at hindi tahasang nagpapaliwanag sa teolohikal na kahulugan nito.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Pinanatili ang matinding biswal na paglalarawan at iniwasan ang pagdaragdag ng doktrinal na paliwanag.
