id: MRK.9.43
reference: Mark 9:43
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἐὰν ⸀σκανδαλίζῃ σε ἡ χείρ σου, ἀπόκοψον αὐτήν· καλόν ⸂ἐστίν σε⸃ κυλλὸν ⸂εἰσελθεῖν εἰς τὴν ζωὴν⸃ ἢ τὰς δύο χεῖρας ἔχοντα ἀπελθεῖν εἰς τὴν γέενναν, εἰς τὸ πῦρ τὸ ⸀ἄσβεστον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/043.yaml
  text: And if your hand causes you to stumble[a], cut it off. It is better for you to enter into life crippled than, having two hands, to go away into Gehenna[b], into the unquenchable fire.
translation:
  language: tl
  text: At kung ang kamay mo ay nagiging sanhi ng pagkatisod mo[a], putulin mo ito. Mas mabuting pumasok ka sa buhay na putol ang isang kamay kaysa mapunta sa Gehenna[b] na may dalawa kang kamay, sa apoy na hindi mapapatay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “nagiging sanhi ng pagkakasala mo.” Ang pandiwang Griyego ay maaaring mangahulugang magpatisod, magpabagsak, o magtulak sa pagkakasala ng isang tao.'
    reason: lexical_alternative
  - marker: b
    text: Ang Gehenna ay anyong Griyego ng pangalan ng isang lugar na iniugnay sa paghatol ng Diyos; nakaugaliang isalin itong “impiyerno.”
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: nagiging sanhi ng pagkakasala mo
  rationale: Sa kontekstong ito, tumutukoy ang pandiwa sa pag-akay o pag-udyok sa tao tungo sa pagkakasala. Likas sa modernong Tagalog ang parirala, habang ang mas malawak na metapora ng pagkatisod ay inilalahad sa talababa.
- source_word: ἀπόκοψον
  choice: putulin mo ito
  rationale: Tuwiran at mariing katumbas ito ng aorist imperative at pinananatili ang nakakagulat na kongkretong larawan.
- source_word: καλόν
  choice: mas mabuti
  rationale: Bagaman maaaring mangahulugang “mabuti,” ang paghahambing na may ἢ ay likas na ipinahahayag sa Tagalog bilang “mas mabuti.”
- source_word: κυλλόν
  choice: putol ang isang kamay
  rationale: Sa agarang konteksto ng pagputol sa kamay, malinaw at natural nitong ipinahahayag ang kalagayang tinutukoy nang hindi gumagamit ng malabo o mapanlait na katawagan sa kapansanan.
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: pumasok sa buhay
  rationale: Pinananatili nito ang eskatolohikal na larawan ng pagpasok at ang payak ngunit maringal na diwa ng τὴν ζωὴν.
- source_word: ἀπελθεῖν
  choice: mapunta
  rationale: Natural ito sa Tagalog sa babala tungkol sa kahihinatnan. Hindi nito dinaragdagan kung kusang pagpunta o pagpapadala ang nasa isip ng teksto.
- source_word: γέενναν
  choice: Gehenna
  rationale: Pinananatili ang partikular na pangalang Griyego na nakaugat sa larawan ng banal na paghatol, sa halip na agad itong ipantay sa mas malawak na terminong teolohikal na “impiyerno.”
- source_word: ἄσβεστον
  choice: hindi mapapatay
  rationale: Malinaw at pangkaraniwang Tagalog ito para sa apoy na hindi maaaring apulahin o patayin.
- source_word: χεὶρ σου
  choice: kamay mo
  rationale: Tuwirang salin na nagpapanatili sa mahalagang larawang pangkatawan.
- source_word: τὰς δύο χεῖρας ἔχοντα
  choice: may dalawang kamay ka
  rationale: Malinaw nitong pinananatili ang tahasang paghahambing sa pagitan ng pagkawala ng isang kamay at pagkakaroon ng dalawa.
theological_decisions:
- issue: Pagsasalin sa γέεννα sa isang pahayag tungkol sa paghatol
  choice: Gehenna
  alternative: impiyerno
  rationale: Pinananatili ang natatanging termino at ang makasaysayang larawang Hudyo nito, samantalang ibinibigay sa talababa ang nakaugaliang katumbas.
- issue: Lakas ng larawan ng pagputol sa kamay
  choice: Panatilihin ang kongkreto at matinding pananalita
  alternative: Ipaliwanag ito sa pangunahing teksto bilang pangkalahatang pag-iwas sa kasalanan
  rationale: Sadyang matindi ang retorika ng talata. Hindi ito dapat palambutin o ipaliwanag nang higit sa sinasabi ng pinagmulan.
- issue: Saklaw ng σκανδαλίζῃ
  choice: pagkakasala sa pangunahing teksto, na may pagkatisod bilang alternatibo sa talababa
  alternative: pagkatisod lamang
  rationale: Ang konteksto ng babala at paghatol ay nagpapatingkad sa moral na diwa, ngunit pinananatili sa talababa ang metaporikal at mas malawak na saklaw ng pandiwa.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Pinanatili ang matinding larawang pangkatawan at ang terminong “Gehenna,” habang iniwasan ang katawagang maaaring maging mapanlait sa mga taong may kapansanan.
