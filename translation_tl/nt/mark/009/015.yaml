  text: καὶ ⸀εὐθὺς πᾶς ὁ ὄχλος ⸂ἰδόντες αὐτὸν ἐξεθαμβήθησαν⸃, καὶ προστρέχοντες ἠσπάζοντο αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/015.yaml
  text: And immediately the whole crowd[a], when they saw him, were greatly amazed, and running up to him, greeted him.
translation:
  language: tl
  text: At nang makita siya ng buong karamihan, agad silang namangha nang labis[a]. Tumakbo sila papalapit sa kanya at binati siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lubha silang nagulat” o “labis silang nabahala.” Ang pandiwang Griyego ay maaaring magpahiwatig ng matinding pagkamangha, pagkagulat, o pagkabahala, ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: agad
  rationale: Pinananatili nito ang dagliang kilos at mabilis na daloy na katangian ng salaysay ni Marcos, sa natural na modernong Tagalog.
- source_word: πᾶς ὁ ὄχλος
  choice: buong karamihan
  rationale: Ipinahahayag nito ang kabuuan ng pangkat habang pinananatili ang kolektibong pangngalan.
- source_word: ἰδόντες αὐτόν
  choice: nang makita siya
  rationale: 'Ginagawang malinaw ang temporal na ugnayan ng aorist participle: ang pagkakita sa kaniya ang pagkakataong nagbunsod sa reaksiyon.'
- source_word: ἐξεθαμβήθησαν
  choice: labis silang namangha
  rationale: Ipinapakita nito ang matinding reaksiyon nang hindi tiyak na ipinakahulugang takot o nagdaragdag ng hindi binanggit na sanhi.
- source_word: προστρέχοντες
  choice: patakbo silang lumapit
  rationale: Natural at malinaw na inilalarawan ang mabilis na paglapit sa kaniya.
- source_word: ἠσπάζοντο αὐτόν
  choice: binati siya
  rationale: Neutral at karaniwang katumbas ito ng ἀσπάζομαι sa kontekstong ito, nang hindi labis na ipinakahulugang pormal na pagsaludo o pagtanggap.
theological_decisions:
- issue: Diwa ng reaksiyon ng karamihan sa ἐξεθαμβήθησαν
  choice: Matinding pagkamangha, na hindi tinutukoy ang sanhi
  alternative: Nabahala sila; o namangha sila dahil sa isang maningning na anyo na gaya ng kay Moises
  rationale: Matinding reaksiyon lamang sa pagkakita kay Jesus ang tahasang sinasabi ng talata. Hindi nito sinasabing takot iyon ni nagbibigay ng paliwanag tungkol sa maningning na anyo, kaya hindi iyon idinagdag sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Hinati sa dalawang pangungusap upang maging madaling basahin habang pinananatili ang pagkakasunod-sunod ng mga kilos sa Griyego.
