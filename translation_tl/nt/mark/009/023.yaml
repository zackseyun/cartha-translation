  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτῷ· Τὸ Εἰ ⸀δύνῃ, πάντα δυνατὰ τῷ πιστεύοντι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/023.yaml
  text: But Jesus said to him[b][a], “ ‘If you can’? All things are possible for the one who believes.”
translation:
  language: tl
  text: Ngunit sinabi sa kanya ni Jesus, “ ‘Kung kaya mo’?[a] Posible ang lahat para sa taong sumasampalataya.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “Ang ‘kung kaya mo’?” Inuulit at hinahamon ni Jesus ang sinabi ng ama sa naunang talata.
    reason: lexical_alternative
  - marker: b
    text: Ang “taong sumasampalataya” ay maaari ring isaling “taong naniniwala” o “taong nagtitiwala.”
    reason: alternative_reading
lexical_decisions:
- source_word: Τὸ Εἰ δύνῃ
  choice: ‘Kung kaya mo’?
  rationale: Ang neuter article na Τὸ ay nagpapakilalang inuulit ni Jesus ang mismong pananalita ng ama sa naunang talata at hinahamon ito. Ang siniping parirala na nasa anyong tanong ay likas sa modernong Tagalog at pinananatili ang matalim na diin ng Griyego.
- source_word: δύνῃ
  choice: kaya mo
  rationale: Ang δύναμαι ay karaniwang nangangahulugang ‘makakaya’ o ‘may kakayahan.’ Sa tuwirang pananalita, natural ang ‘kaya mo.’
- source_word: πάντα
  choice: ang lahat
  rationale: Ang neuter plural ay sumasaklaw sa ‘lahat’ o ‘lahat ng bagay.’ Ang ‘ang lahat’ ay maikli at pinananatili ang malawak na retorikal na saklaw ng pahayag.
- source_word: δυνατὰ
  choice: posible
  rationale: Sa panaguring gamit na ito, ang δυνατά ay nangangahulugang ‘posible’ o ‘maaaring mangyari.’ Ang ‘posible’ ay malinaw at karaniwan sa modernong Filipino.
- source_word: τῷ πιστεύοντι
  choice: para sa taong sumasampalataya
  rationale: Ang present participle ay tumutukoy sa taong nasa kilos o kalagayan ng pananampalataya. Iniiwasan ng pariralang ito ang mas katawagang anyong ‘mananampalataya’ at pinananatili ang pandiwang puwersa.
- source_word: πιστεύοντι
  choice: sumasampalataya
  rationale: Ang πιστεύω ay maaaring isaling ‘naniniwala,’ ‘sumasampalataya,’ o ‘nagtitiwala.’ Dito, ang ‘sumasampalataya’ ay dignified at natural sa kontekstong biblikal, habang inilalahad sa talababa ang lehitimong alternatibong diwa ng pagtitiwala.
theological_decisions:
- issue: Saklaw ng ‘posible ang lahat’
  choice: Panatilihin ang ganap at maigting na pahayag nang walang idinagdag na tahasang pan限定 gaya ng ‘sa Diyos.’
  alternative: ‘Sa Diyos, posible ang lahat para sa taong sumasampalataya’ o ‘Posible sa sumasampalataya ang lahat ayon sa kapangyarihan ng Diyos.’
  rationale: Tahas at maikli ang Griyego at hindi nito isinisingit dito ang ‘sa Diyos.’ Pinananatili ng salin ang retorikal na lakas at teolohikal na tensiyon sa halip na ipaliwanag ito sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang ‘kaya mo’ para sa likas na tuwirang pananalita at ‘sumasampalataya’ upang mapanatili ang pandiwang anyo at biblikal na bigat. Ang mga talababa ay inilagay sa mismong bahaging nililinaw ng mga ito.
