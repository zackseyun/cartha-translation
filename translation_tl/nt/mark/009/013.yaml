id: MRK.9.13
reference: Mark 9:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀλλὰ λέγω ὑμῖν ὅτι καὶ Ἠλίας ἐλήλυθεν, καὶ ἐποίησαν αὐτῷ ὅσα ⸀ἤθελον, καθὼς γέγραπται ἐπ’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/013.yaml
  text: But I tell you that Elijah also has come[a], and they did to him whatever they wanted, just as it is written about him.
translation:
  language: tl
  text: Ngunit sinasabi ko sa inyo na dumating na rin si Elias[a], at ginawa nila sa kanya ang anumang gusto nila, gaya ng nasusulat tungkol sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibig sabihin, dumating na si Elias sa persona at ministeryo ni Juan na Tagapagbautismo. Tingnan ang Marcos 9:11–12 at ihambing sa Mateo 11:14; 17:12–13.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ngunit
  rationale: Malinaw na naghuhudyat ng pagsalungat sa inaasahan ng mga alagad tungkol kay Elias, at angkop sa marangal ngunit makabagong rehistro.
- source_word: λέγω ὑμῖν
  choice: sinasabi ko sa inyo
  rationale: Natural na salin ng tuwirang pormula ng pagsasalita at pinananatili ang personal na pagtukoy sa mga kausap.
- source_word: ὅτι καὶ Ἠλίας ἐλήλυθεν
  choice: na dumating na rin si Elias
  rationale: Ipinahihiwatig ng “dumating na” ang ganap nang pagdating na may kabuluhan sa kasalukuyan, ayon sa perfect na ἐλήλυθεν; ipinapakita ng “rin” ang diwa ng καί.
- source_word: ἐποίησαν αὐτῷ
  choice: ginawa nila sa kanya
  rationale: Pinananatili ang bukas at mariing diwa ng ποιέω na saka nililinaw ng kasunod na parirala.
- source_word: ὅσα ἤθελον
  choice: ang anumang gusto nila
  rationale: Likas sa modernong Tagalog at ipinapahayag ang walang takdang saklaw ng ginawa nila ayon sa sarili nilang kagustuhan.
- source_word: καθὼς γέγραπται
  choice: gaya ng nasusulat
  rationale: Ang “nasusulat” ay natural at kinikilalang pormula para sa pagtukoy sa Kasulatan, habang ipinananatili ang resultang kalagayan ng perfect.
- source_word: ἐπ’ αὐτόν
  choice: tungkol sa kanya
  rationale: Sa konteksto ng γέγραπται, ang pinakanaaangkop na kahulugan ay “tungkol sa” o “hinggil sa,” hindi kinakailangang “laban sa.”
theological_decisions:
- issue: Pagkakakilanlan ni Elias sa pahayag na ito
  choice: Panatilihin ang “Elias” sa pangunahing teksto nang walang dagdag na pagpapakahulugan.
  alternative: Tahasang tukuyin sa pangunahing teksto na si Elias ay si Juan na Tagapagbautismo sa kanyang persona at ministeryo.
  rationale: Elias ang tahasang pangalan sa Griyegong teksto. Bagaman inuugnay siya ng konteksto kay Juan na Tagapagbautismo, hindi dapat ipasok ang interpretasyong iyon sa mismong salin; mas angkop itong ilahad sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang tradisyonal at pamilyar na anyong “Elias” para sa pangalang Ἠλίας. Iniwasan ang pagpapalawak sa pangunahing teksto upang mapanatili ang tunay na pahiwatig at tensiyong teolohikal ng konteksto.
