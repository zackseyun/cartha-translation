  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐὰν ὁ ὀφθαλμός σου σκανδαλίζῃ σε, ἔκβαλε αὐτόν· καλόν ⸀σέ ἐστιν μονόφθαλμον εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ ἢ δύο ὀφθαλμοὺς ἔχοντα βληθῆναι εἰς ⸀τὴν ⸀γέενναν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/047.yaml
  text: And if your eye causes you to stumble[a], throw it out. It is better for you to enter the kingdom of God with one eye than, having two eyes, to be thrown into Gehenna,
translation:
  language: tl
  text: At kung ang mata mo ay nagpapatisod sa iyo, itapon mo ito. Mas mabuti para sa iyo na pumasok sa kaharian ng Diyos na iisa ang mata kaysa ihagis ka sa Gehenna na may dalawang mata,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: nagiging dahilan ng pagkatisod mo
  rationale: Pinananatili nito ang talinghaga ng pagkatisod sa pandiwang Griyego nang hindi nililimitahan ang kahulugan sa tahasang ‘pagkakasala’ lamang.
- source_word: ἔκβαλε
  choice: itapon mo ito
  rationale: Ang ἐκβάλλω ay nangangahulugang ilabas o itapon. Hindi ginamit ang ‘dukutin’ sapagkat hindi tahasang tinutukoy ng pandiwa ang paraan ng pag-aalis.
- source_word: καλόν ... ἢ
  choice: mas mabuti ... kaysa
  rationale: Bagaman literal na ‘mabuti’ ang καλόν, may paghahambing ang buong kayarian, kaya likas sa Tagalog ang ‘mas mabuti ... kaysa.’
- source_word: μονόφθαλμον
  choice: na iisa ang mata
  rationale: Natural at malinaw na pagpapahayag sa modernong Tagalog ng ‘one-eyed,’ habang pinananatili ang kongkretong larawan.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: kaharian ng Diyos
  rationale: Tuwiran, pamilyar, at teolohikal na hindi pinakikitid na salin ng parirala.
- source_word: βληθῆναι
  choice: itapon
  rationale: Pinananatili ang pasibong diwa sa kayariang ‘ngunit itapon naman’ at ang matinding larawan ng paghahagis.
- source_word: γέενναν
  choice: Gehenna
  rationale: Pinananatili ang tiyak na terminong Griyego at ang kaugnayan nito sa Lambak ng Hinnom at paghuhukom, sa halip na agad itong gawing pangkalahatang ‘impiyerno.’
theological_decisions:
- issue: Pagpapakahulugan sa γέεννα sa konteksto ng paghuhukom
  choice: Gehenna
  alternative: impiyerno
  rationale: Tiyak na γέεννα ang ginamit ng teksto, hindi isang pangkalahatang salita para sa daigdig ng mga patay o kaparusahan. Pinananatili ng transliterasyon ang natatanging biblikal at makasaysayang sanggunian; inilalagay sa talababa ang karaniwang katumbas.
- issue: Saklaw ng σκανδαλίζῃ
  choice: nagiging dahilan ng pagkatisod mo
  alternative: nagiging dahilan ng pagkakasala mo
  rationale: Pinananatili ng salin ang sadyang matalinghagang pananalita at hindi tahimik na nilulutas kung ang diin ay tukso, pagkakasala, o pagtalikod.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang matinding larawan ng utos at ang tiyak na terminong ‘Gehenna.’ Inilipat ang pananda ng talababa sa ‘Gehenna,’ sapagkat ang nilalaman ng talababa ay tumutukoy sa γέεννα, hindi sa σκανδαλίζῃ. Pinanatili rin ang kuwit sa hulihan upang ipakitang nagpapatuloy ang pangungusap sa kasunod na talata.
