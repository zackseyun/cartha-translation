  text: καὶ εἶπεν αὐτοῖς· Τοῦτο τὸ γένος ἐν οὐδενὶ δύναται ἐξελθεῖν εἰ μὴ ἐν ⸀προσευχῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/029.yaml
  text: And he said to them[a], “This kind cannot come out by anything except prayer.”
translation:
  language: tl
  text: At sinabi niya sa kanila[a], “Ang ganitong uri ay hindi maaaring lumabas maliban sa pamamagitan ng panalangin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa ilang mas huling manuskrito: “panalangin at pag-aayuno.”'
    reason: textual_variant
lexical_decisions:
- source_word: Τοῦτο τὸ γένος
  choice: Ang ganitong uri
  rationale: Ang γένος ay tumutukoy rito sa isang uri o pangkat. Bagaman malinaw sa konteksto na maruming espiritu ang tinutukoy, hindi inuulit ng Griyego ang salitang ‘espiritu,’ kaya hindi rin ito idinagdag sa salin.
- source_word: ἐν οὐδενὶ
  choice: sa anumang paraan
  rationale: Idyomatikong ipinahihiwatig ng ἐν kasama ng οὐδενί na walang ibang paraan o kasangkapang makapagpapalabas dito. Natural sa modernong Tagalog ang ‘sa anumang paraan’ sa loob ng negatibong pangungusap.
- source_word: δύναται ἐξελθεῖν
  choice: hindi mapalalabas
  rationale: Ipinahihiwatig ng konteksto ang pagpapalayas sa espiritu. Ang ‘mapalalabas’ ay natural na nagpapahayag ng kawalan ng kakayahang mapaalis ito, nang hindi tahasang nagdaragdag ng gumaganap.
- source_word: εἰ μὴ
  choice: maliban sa
  rationale: Ipinakikilala ng εἰ μή ang tanging eksepsiyon sa naunang negatibong pahayag.
- source_word: ἐν προσευχῇ
  choice: sa pamamagitan ng panalangin
  rationale: Ang ἐν ay nagpapahayag ng paraan o kasangkapan. Malinaw at natural na naihahatid ito ng ‘sa pamamagitan ng panalangin.’
theological_decisions:
- issue: Kung isasama ang ‘at pag-aayuno’
  choice: panalangin
  alternative: panalangin at pag-aayuno
  rationale: Ang SBLGNT na ibinigay ay may προσευχῇ lamang, ‘panalangin.’ Ang mas mahabang pagbasa na may ‘at pag-aayuno’ ay matatagpuan sa ilang mas huling manuskrito, kaya inilagay ito sa talababa sa halip na sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Pinanatili ang maigsi at di-tahasang ‘ganitong uri’ sa halip na idagdag ang ‘ng espiritu,’ at ginamit ang ‘mapalalabas’ upang umayon sa konteksto ng pagpapalayas ng maruming espiritu.
