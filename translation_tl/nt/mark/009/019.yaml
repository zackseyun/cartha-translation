base_translation:
  language: en
  yaml_path: translation/nt/mark/009/019.yaml
  text: And answering them[a], he says, “O unbelieving generation[b], how long will I be with you? How long will I put up with you? Bring him to me.”
translation:
  language: tl
  text: Sumagot siya sa kanila, “O salinlahing walang pananampalataya[a], hanggang kailan ako mananatiling kasama ninyo? Hanggang kailan ko kayo pagtitiisan[b]? Dalhin ninyo siya sa akin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “salinlahing hindi tapat.” Ang salitang Griyego ay maaaring tumukoy sa kawalan ng pananampalataya o katapatan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Hanggang kailan ko kayo babatahin?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς αὐτοῖς λέγει
  choice: Sumagot siya sa kanila
  rationale: Natural na salaysay sa modernong Tagalog para sa tugon ni Jesus. Hindi kailangang panatilihin nang literal ang Griyegong participle at historical present, sapagkat magiging alanganin ang “sumasagot ... sinasabi niya.”
- source_word: γενεὰ ἄπιστος
  choice: salinlahing hindi sumasampalataya
  rationale: Ipinahahayag nang malinaw ang kakulangan ng pananampalataya o pagtitiwala sa konteksto, habang inilalagay sa talababa ang tunay na posibleng diwang “hindi tapat.”
- source_word: ἕως πότε πρὸς ὑμᾶς ἔσομαι
  choice: hanggang kailan ako mananatiling kasama ninyo?
  rationale: Ang “mananatiling kasama” ay likas sa Tagalog at malinaw na tumutukoy sa patuloy na presensiya ni Jesus sa kanila.
- source_word: ἕως πότε ἀνέξομαι ὑμῶν
  choice: Hanggang kailan ko kayo pagtitiisan?
  rationale: Pinananatili ng “pagtitiisan” ang lakas ng pagkayamot at ang diwa ng pagtitiis o pagpapasensiya sa kanila.
- source_word: φέρετε αὐτὸν πρός με
  choice: Dalhin ninyo siya sa akin
  rationale: Direkta at natural na utos sa maramihang kausap na dalhin ang batang lalaki kay Jesus.
theological_decisions:
- issue: Saklaw ng kahulugan ng ἄπιστος sa pagsaway ni Jesus
  choice: hindi sumasampalataya
  alternative: hindi tapat
  rationale: Mas tuwirang angkop sa agarang konteksto ang kawalan ng pananampalataya o pagtitiwala, ngunit maaari ring tumukoy ang salita sa kawalan ng katapatan; pinananatili ang tensiyong ito sa talababa nang hindi ipinipilit ang isang makitid na doktrinal na pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “salinlahi” sa kolektibong pagtawag at ang magalang ngunit matinding “pagtitiisan” upang mapanatili ang bigat ng pagsaway.
