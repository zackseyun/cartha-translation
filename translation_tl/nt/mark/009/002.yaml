  text: Καὶ μετὰ ἡμέρας ἓξ παραλαμβάνει ὁ Ἰησοῦς τὸν Πέτρον καὶ τὸν Ἰάκωβον ⸀καὶ Ἰωάννην, καὶ ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν κατ’ ἰδίαν μόνους. καὶ μετεμορφώθη ἔμπροσθεν αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/002.yaml
  text: And after six days[a], Jesus takes Peter and James and John, and brings them up onto a high mountain by themselves. And he was transfigured before them[c][b],
translation:
  language: tl
  text: Pagkaraan ng anim na araw[a], isinama ni Jesus sina Pedro, Santiago, at Juan at dinala niya silang apat lamang paakyat sa isang mataas na bundok.[b] At nagbagong-anyo siya sa harap nila.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Makalipas ang anim na araw.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “nang bukod at sila lamang.” Dalawang pagpapahayag ang ginamit sa Griyego upang idiin na si Jesus at ang tatlong alagad ay hiwalay sa iba.
    reason: lexical_alternative
  - marker: c
    text: O, “nabago ang anyo niya sa harap nila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ἡμέρας ἓξ
  choice: Pagkaraan ng anim na araw
  rationale: Tuwirang pinananatili ang temporal na pagkakasunod ng μετά na may akusatibo, habang natural sa modernong Tagalog.
- source_word: παραλαμβάνει
  choice: isinama
  rationale: Sa konteksto ng pagdadala sa tatlong alagad, likas na ipinahihiwatig ng pandiwa ang pagsama sa kanila; hindi kailangang piliting panatilihin sa Tagalog ang historikal na pangkasalukuyan ni Marcos.
- source_word: ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν
  choice: dinala niya sila sa isang mataas na bundok
  rationale: Ipinapahayag ang pagdadala at patutunguhang mataas na bundok; ang pag-akyat ay malinaw sa konteksto at hindi kailangang ulitin sa paraang mabigat sa Tagalog.
- source_word: κατ’ ἰδίαν μόνους
  choice: Sila-sila lamang doon
  rationale: 'Pinananatili ang diin ng dalawang Griyegong pahayag sa pagkakahiwalay: tanging ang tatlong alagad ang kasama ni Jesus, hiwalay sa iba.'
- source_word: μετεμορφώθη
  choice: nagbagong-anyo
  rationale: Natural at marangal na salin ng nakikitang pagbabago sa anyo, nang hindi ipinapaliwanag kung paano ito naganap.
- source_word: ἔμπροσθεν αὐτῶν
  choice: sa harap nila
  rationale: Tuwirang ipinahahayag na nasaksihan ng mga alagad ang pangyayari.
theological_decisions:
- issue: Kahulugan ng μετεμορφώθη sa kontekstong kristolohikal
  choice: nagbagong-anyo
  alternative: nabago
  rationale: Ang “nagbagong-anyo” ay tumpak sa nakikitang pagbabago na inilalarawan ng teksto at mas tiyak kaysa pangkalahatang “nabago,” ngunit hindi nagdaragdag ng haka-hakang paliwanag tungkol sa kalikasan ng pangyayari.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “sina” sa magkakasunod na pangalang pantangi at hinati ang mahabang pangungusap upang maipahayag nang natural ang diin ng κατ’ ἰδίαν μόνους.
