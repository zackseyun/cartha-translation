  text: where[a] their worm does not die, and the fire is not quenched.
translation:
  language: tl
  text: kung saan hindi namamatay ang kanilang uod, at hindi naaapula ang apoy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wala ang talatang ito sa pinakamaagang mga manuskritong Griego (kabilang ang Sinaiticus at Vaticanus noong ika-4 na siglo) at sa mga sinaunang saling Coptic, ngunit makikita ito sa karamihan ng mga manuskrito ng tradisyong Byzantine at sa tradisyong Latin. Malamang na idinagdag ito ng isang tagakopya mula sa magkaparehong pananalita sa talata 48 (at talata 44).
    reason: textual_critical
lexical_decisions:
- source_word: σκώληξ
  choice: uod
  rationale: Tumutukoy sa uod na kumakain ng nabubulok na bagay. Pinananatili ng “uod” ang tuwirang kaugnayan sa Isaias 66:24 at natural itong nauunawaan sa Filipino.
- source_word: τελευτᾷ
  choice: namamatay
  rationale: Sa kontekstong ito, ang τελευτάω ay nangangahulugang mamatay o sumapit sa wakas. Ang pangkasalukuyang anyo na may οὐ ay angkop na isinalin na “hindi namamatay.”
- source_word: σβέννυται
  choice: naaapula
  rationale: Ang σβέννυμι sa tinig na pasibo ay tumutukoy sa apoy na pinapatay o inaapula. Ang “hindi naaapula” ay dignified, malinaw, at nagpapanatili sa larawan ng apoy na patuloy na nagliliyab.
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang tradisyonal at biblikal na larawang “uod” at ang natural na pariralang “hindi naaapula ang apoy.” Inilagay ang panandang talababa sa dulo ng talata upang malinaw na tumukoy ito sa tekstuwal na katayuan ng buong talata.
