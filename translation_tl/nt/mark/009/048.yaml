  text: where their worm does not die[b][a], and the fire is not quenched.
translation:
  language: tl
  text: kung saan ang kanilang uod ay hindi namamatay[b][a], at ang apoy ay hindi naaapula.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang kanilang uod ay hindi nagwawakas, at ang apoy ay hindi pinapatay.”
    reason: lexical_alternative
  - marker: b
    text: Umaalingawngaw ang linyang ito sa Isaias 66:24.
    reason: cross_reference
lexical_decisions:
- source_word: ὅπου
  choice: kung saan
  rationale: Likas na panandang pook sa Filipino at tuwirang katumbas ng pang-abay na nag-uugnay sa inilalarawang lugar.
- source_word: ὁ σκώληξ αὐτῶν
  choice: ang kanilang uod
  rationale: Pinananatili ang konkretong larawan at ang ugnayang ipinahihiwatig ng genitibong αὐτῶν. Mas malawak at mas angkop sa alusyon sa Isaias ang “uod” kaysa sa mas espesipikong “uod ng bangkay.”
- source_word: οὐ τελευτᾷ
  choice: ay hindi namamatay
  rationale: Bagaman maaari ring mangahulugang “hindi nagwawakas,” ang “hindi namamatay” ay natural kapag uod ang simuno at pinananatili ang matinding larawan ng teksto.
- source_word: τὸ πῦρ
  choice: ang apoy
  rationale: Tuwiran, malinaw, at hindi nangangailangan ng pagpapakahulugang dagdag.
- source_word: οὐ σβέννυται
  choice: ay hindi napapatay
  rationale: Ipinapakita ang pasibong anyo at patuloy na kalagayang hindi naaapula; mas natural sa karaniwang modernong Filipino kaysa “hindi naaapula,” habang tapat sa diwa.
theological_decisions:
- issue: Kalikasan ng larawan ng paghatol
  choice: Panatilihin ang konkretong larawan ng uod at apoy nang hindi ipinapaliwanag kung ito ay walang-hanggang pagpapahirap, ganap na pagkapuksa, o talinghaga lamang.
  alternative: Isalin sa paraang tahasang nagtuturo ng patuloy na may-malay na kaparusahan, di-mababaling pagkapuksa, o purong metaporikal na kahihiyan.
  rationale: Matingkad na larawan ng paghatol ang ibinibigay ng talata at umaalingawngaw ito sa Isaias 66:24, ngunit hindi nito mismo nilulutas ang mas malawak na pagtatalong teolohikal. Pinananatili ng salin ang tensiyon ng teksto.
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang “kung saan,” “uod,” at “apoy” upang manatiling malinaw at konkreto ang larawan. Ang “napapatay” ay karaniwang gamit para sa apoy at madaling maunawaan; inilagay sa talababa ang mas pormal na “naaapula.”
