  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ὃς ⸀ἂν σκανδαλίσῃ ἕνα τῶν μικρῶν ⸀τούτων τῶν πιστευόντων ⸂εἰς ἐμέ⸃, καλόν ἐστιν αὐτῷ μᾶλλον εἰ περίκειται ⸂μύλος ὀνικὸς⸃ περὶ τὸν τράχηλον αὐτοῦ καὶ βέβληται εἰς τὴν θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/042.yaml
  text: And whoever causes one of these little ones who believe in me to stumble[a], it is better for him if a donkey millstone is put around his neck and he is thrown into the sea.
translation:
  language: tl
  text: At ang sinumang maging dahilan upang matisod ang isa sa maliliit na ito na sumasampalataya sa akin, mas mabuti pa para sa kanya kung ang isang malaking batong panggiling na pinaiikot ng asno[a] ay nakatali sa kanyang leeg at siya ay itinapon sa dagat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “batong panggiling ng asno,” ibig sabihin, isang malaking batong panggiling na pinaiikot ng asno.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκανδαλίσῃ
  choice: maging dahilan upang matisod
  rationale: Pinananatili nito ang metapora ng pagkatisod at ang malawak na diwa ng pag-udyok sa kasalanan o pagtalikod; mas matindi ito kaysa sa simpleng ‘masaktan ang damdamin.’
- source_word: μικρῶν τούτων
  choice: maliliit na ito
  rationale: Hindi nililimitahan ang tinutukoy sa mga batang musmos lamang; maaari itong tumukoy sa mahihina, hamak, o itinuturing na walang halaga na mga mananampalataya.
- source_word: τῶν πιστευόντων εἰς ἐμέ
  choice: na sumasampalataya sa akin
  rationale: Tuwirang ipinapahayag na ang ‘maliliit’ ay mga nananalig kay Jesus.
- source_word: καλόν ἐστιν αὐτῷ μᾶλλον
  choice: mas mabuti pa sa kanya
  rationale: Likas na Filipino para sa paghahambing na bumubuo sa matinding babala.
- source_word: μύλος ὀνικός
  choice: isang malaking batong panggiling na pinaiikot ng asno
  rationale: Nililinaw ang kaibahan nito sa maliit na gilingang-kamay at tuwirang inilalarawan ang uri ng batong panggiling sa Griyego.
- source_word: περίκειται ... περὶ τὸν τράχηλον
  choice: talian ... ang kanyang leeg
  rationale: Natural na Filipino para sa paglalagay at pagkakabit ng mabigat na bato sa palibot ng leeg sa kontekstong ito.
- source_word: βέβληται εἰς τὴν θάλασσαν
  choice: itapon siya sa dagat
  rationale: Malinaw at masiglang paglalarawan ng pasibong paghahagis sa dagat at ng bunga nito.
theological_decisions:
- issue: Tinutukoy ng ‘maliliit na ito’
  choice: Pinanatiling malawak ang parirala upang saklawin ang mahihina o hamak na mananampalataya, kabilang man ang mga bata.
  alternative: Mga batang musmos lamang; o lahat ng mapagpakumbabang alagad.
  rationale: Ang kasunod na ‘na sumasampalataya sa akin’ ay nagpapahiwatig na hindi edad lamang ang batayan. Hindi pinipilit ng salin ang isang mas makitid na pakahulugan.
- issue: Saklaw ng σκανδαλίσῃ
  choice: maging dahilan upang matisod
  alternative: udyukan na magkasala; maging dahilan ng pagtalikod
  rationale: Pinananatili ng metaporikal na salin ang tunay na lawak at tensiyon ng salita sa halip na limitahan ito sa isang partikular na uri ng espirituwal na pagbagsak.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang ‘sumasampalataya’ upang panatilihin ang biblikal ngunit kasalukuyang rehistro, at ipinaliwanag sa teksto ang di-pamilyar na uri ng batong panggiling.
