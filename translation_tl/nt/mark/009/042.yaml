  to: At ang sinumang maging dahilan upang matisod ang isa sa maliliit na ito na sumasampalataya sa akin, mas mabuti pa para sa kanya kung ang isang malaking batong panggiling na pinaiikot ng asno[a] ay nakatali sa kanyang leeg at siya ay itinapon sa dagat.
