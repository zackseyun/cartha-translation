    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν λόγον
  choice: ang sinabi niya
  rationale: Sa konteksto, ang λόγος ay tumutukoy sa sinabi ni Jesus sa naunang talata, hindi lamang sa isang hiwalay na salita. Likas sa Tagalog ang “ang sinabi niya,” ngunit pinananatili sa talababa ang ibang posibleng diwa.
- source_word: ἐκράτησαν
  choice: itinago
  rationale: Kasama ng πρὸς ἑαυτούς, ipinahihiwatig ng pandiwa na hindi nila ipinaalam sa iba ang sinabi. Ang “itinago” ay maikli at natural sa Tagalog nang hindi ipinahihiwatig na naunawaan na nila ito.
- source_word: πρὸς ἑαυτοὺς
  choice: sa kanilang sarili
  rationale: Ipinakikita ng parirala na nanatili lamang sa kanilang pangkat ang sinabi. Pinananatili ng salin ang reflexive na anyo at ang pribadong katangian ng usapan.
- source_word: συζητοῦντες
  choice: habang pinag-uusapan nila
  rationale: Ipinahihiwatig nito ang patuloy na pag-uusap at pagsisiyasat ng mga alagad. Hindi ginamit ang “pinagtatalunan” upang hindi magdagdag ng antas ng hidwaan na hindi tiyak sa teksto.
- source_word: τί ἐστιν
  choice: kung ano ang ibig sabihin
  rationale: Bagaman literal na “kung ano ito,” ang tanong ay tungkol sa kahulugan ng sinabi ni Jesus. Ito ang natural na pagpapahayag sa modernong Tagalog.
- source_word: τὸ ἐκ νεκρῶν ἀναστῆναι
  choice: “bumangon mula sa mga patay”
  rationale: Malinaw at likas sa Tagalog ang karaniwang pananalitang ito tungkol sa muling pagkabuhay. Ang mas literal na diwang “mula sa gitna ng mga patay” ay inilagay sa talababa.
theological_decisions:
- issue: Pananalita tungkol sa muling pagkabuhay sa pag-uusap ng mga alagad
  choice: bumangon mula sa mga patay
  alternative: bumangon mula sa gitna ng mga patay
  rationale: Pinananatili ng salin ang malinaw na pagtukoy sa muling pagkabuhay at ang hindi pagkaunawa ng mga alagad, nang hindi ipinapasok ang kalaunang paliwanag o isang partikular na doktrinal na pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang payak na “pinag-uusapan” sa halip na mas matinding “pinagtatalunan,” at pinanatili sa mga talababa ang tunay na mga alternatibong leksikal.
