  text: And they kept the matter to themselves[b][a], discussing what it meant to rise from the dead.
translation:
  language: tl
  text: At inilihim nila sa iba ang sinabi niya[a], habang pinag-uusapan nila kung ano ang ibig sabihin ng “bumangon mula sa mga patay.”[b]
  philosophy: optimal-equivalence
