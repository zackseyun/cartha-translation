  text: Ὃς γὰρ ἂν ποτίσῃ ὑμᾶς ποτήριον ὕδατος ἐν ⸀ὀνόματι ὅτι χριστοῦ ἐστε, ἀμὴν λέγω ὑμῖν ⸀ὅτι οὐ μὴ ⸀ἀπολέσῃ τὸν μισθὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/041.yaml
  text: For whoever gives you a cup of water to drink in the name that you are Messiah's[a], truly I say to you, he will certainly not lose his reward.
translation:
  language: tl
  text: Sapagkat ang sinumang magpainom sa inyo ng isang basong tubig dahil kabilang kayo sa Mesiyas[a]—tinitiyak ko sa inyo, hinding-hindi niya mawawala ang gantimpala niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “sa ngalan na kayo''y sa Mesiyas,” isang mas literal na pagsunod sa ayos ng Griyego.'
    reason: Ipinakikita ang mas literal na posibilidad ng ἐν ὀνόματι ὅτι χριστοῦ ἐστε, samantalang ginagamit ng pangunahing teksto ang natural na pagbabasang sanhi sa Filipino.
lexical_decisions:
- source_word: Ὃς γὰρ ἂν
  choice: Sapagkat ang sinumang
  rationale: Likas na isinasalin ang indefinite relative construction bilang “ang sinumang,” habang pinananatili ng “Sapagkat” ang ugnayan ng γάρ sa naunang pahayag.
- source_word: ποτίσῃ ὑμᾶς ποτήριον ὕδατος
  choice: magpainom sa inyo ng isang tasang tubig
  rationale: Ang ποτίζω ay “magbigay upang inumin” o “magpainom.” Maikli at natural sa Filipino ang “magpainom ... ng isang tasang tubig.”
- source_word: ἐν ὀνόματι ὅτι χριστοῦ ἐστε
  choice: sa ngalan ng pagiging kabilang ninyo sa Mesiyas
  rationale: Pinananatili ng “sa ngalan” ang ἐν ὀνόματι at ipinahahayag ng “pagiging kabilang ninyo” ang possessive genitive na χριστοῦ ἐστε. Hindi idinagdag ang “aking,” sapagkat wala itong tahasang katumbas sa tekstong Griyego.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: tinitiyak ko sa inyo
  rationale: Ipinahahayag nito sa natural at marangal na Filipino ang taimtim at makapangyarihang pormula ni Jesus.
- source_word: οὐ μὴ ἀπολέσῃ
  choice: hinding-hindi mawawala sa kanya
  rationale: Ang “hinding-hindi” ay malinaw na nagpapahayag ng mariing pagtanggi ng οὐ μή; ang ayos na “mawawala sa kanya” ay natural sa Filipino para sa pagkawala ng gantimpalang nakalaan sa isang tao.
- source_word: τὸν μισθὸν αὐτοῦ
  choice: ang kanyang gantimpala
  rationale: Sa kontekstong moral at eskatolohikal, “gantimpala” ang pinakanatural na katumbas ng μισθός kaysa “sahod” o “kabayaran.”
theological_decisions:
- issue: Pagpapakahulugan sa ἐν ὀνόματι ὅτι χριστοῦ ἐστε
  choice: sa ngalan ng pagiging kabilang ninyo sa Mesiyas
  alternative: dahil kabilang kayo sa Mesiyas
  rationale: Ang pangunahing salin ay nagpapanatili sa tahasang pariralang ἐν ὀνόματι at sa kaugnayan nito sa ὅτι χριστοῦ ἐστε, samantalang inilalahad sa talababa ang malamang na panandang sanhi nang hindi ipinipilit iyon bilang tanging pagbasa.
- issue: Pagsasalin sa Χριστός bilang titulo
  choice: Mesiyas
  alternative: Cristo
  rationale: Ginagamit dito ang Χριστός bilang titulong tumutukoy kay Jesus; kaya pinananatili ng “Mesiyas” ang kahulugang mesiyaniko sa halip na tratuhin ito bilang pangalang pantangi lamang.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “tinitiyak ko sa inyo” para sa taimtim na pormula at “hinding-hindi” para sa mariing pagtanggi. Ang bahagyang pormal na “sa ngalan ng pagiging kabilang” ay sadyang nagpapanatili sa di-karaniwang ayos at posibleng kahulugan ng tekstong Griyego.
