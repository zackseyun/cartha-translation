  text: οἱ δὲ ἠγνόουν τὸ ῥῆμα, καὶ ἐφοβοῦντο αὐτὸν ἐπερωτῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/032.yaml
  text: But they did not understand the statement[a], and they were afraid to ask him.
translation:
  language: tl
  text: Ngunit hindi nila naunawaan ang sinabi niya,[a] at natatakot silang magtanong sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang pananalitang iyon.” Ang Griegong ῥῆμα ay maaaring tumukoy sa binigkas na salita, pananalita, o pahayag.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Ngunit ... nila
  rationale: Ipinakikita ng δέ ang bahagyang pagsalungat sa naunang sinabi ni Jesus; likas sa Filipino na katawanin ang ipinahihiwatig na mga alagad sa panghalip na “nila.”
- source_word: ἠγνόουν
  choice: hindi nila naunawaan
  rationale: Ang ἀγνοέω rito ay tumutukoy sa hindi pagkaunawa sa sinabi ni Jesus. Ang anyong imperpekto ay nagpapahiwatig ng nagpapatuloy na kalagayan sa salaysay, na likas na naihahatid ng pariralang ito sa Filipino.
- source_word: τὸ ῥῆμα
  choice: ang sinabi niya
  rationale: Ang ῥῆμα ay tumutukoy sa mensaheng kababanggit lamang ni Jesus. Ang “sinabi niya” ay malinaw at natural sa kasalukuyang Filipino, samantalang pinananatili sa talababa ang posibleng “pananalita.”
- source_word: ἐφοβοῦντο
  choice: natatakot sila
  rationale: Ipinahahayag ng imperpektong anyo ang nagpapatuloy na takot; natural itong naihahatid ng “natatakot sila” sa konteksto ng salaysay.
- source_word: αὐτὸν
  choice: sa kanya
  rationale: Tumutukoy ang panghalip kay Jesus at hinihingi ng pandiwang Filipino na “magtanong” ang panandang “sa.”
- source_word: ἐπερωτῆσαι
  choice: magtanong
  rationale: Ang ἐπερωτάω ay nangangahulugang magtanong o magsiyasat. “Magtanong” ang pinakanatural at tumpak na pandiwa rito.
theological_decisions: []
