  register: Modernong Filipino na natural at marangal. Ginamit ang “ang sinabi niya” upang maging malinaw ang tinutukoy nang hindi ginagawang teknikal ang pangungusap; ang lehitimong alternatibong kahulugan ng ῥῆμα ay pinanatili sa talababa.
