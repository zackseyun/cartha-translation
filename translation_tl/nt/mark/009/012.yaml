  text: ὁ δὲ ⸀ἔφη αὐτοῖς· Ἠλίας μὲν ἐλθὼν πρῶτον ⸀ἀποκαθιστάνει πάντα, καὶ πῶς γέγραπται ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου ἵνα πολλὰ πάθῃ καὶ ⸀ἐξουδενηθῇ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/012.yaml
  text: He said to them[a], “Elijah indeed, having come first, restores all things. And how is it written about the Son of Man that he should suffer many things and be treated with contempt?”
translation:
  language: tl
  text: Sinabi niya sa kanila, “Tunay ngang unang dumarating si Elias at ibinabalik sa ayos ang lahat ng bagay. At paano nasusulat tungkol sa Anak ng Tao na magdusa siya ng maraming bagay at ituring na walang halaga[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hamakin” o “ituring na walang kabuluhan.” Ang pandiwang Griyego ay tumutukoy sa pagtingin o pagtrato sa isang tao na parang wala siyang kabuluhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη αὐτοῖς
  choice: Sinabi niya sa kanila
  rationale: Likas at tapat na salin ng karaniwang pandiwa ng pagsasalita at ng di-tuwirang layon.
- source_word: Ἠλίας
  choice: Elias
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Tagalog.
- source_word: ἐλθὼν πρῶτον
  choice: nauunang dumating
  rationale: Ipinahahayag ang pag-una ng pagdating ni Elias kaugnay ng gawaing pagpapanumbalik, sa natural na ayos ng modernong Tagalog.
- source_word: ἀποκαθιστάνει πάντα
  choice: ibinabalik sa ayos ang lahat ng bagay
  rationale: Ipinapanatili ang kasalukuyan o pangkalahatang bisa ng pahayag at nililinaw ang diwa ng pagpapanumbalik sa wastong kalagayan.
- source_word: πῶς γέγραπται ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου
  choice: paanong nasusulat tungkol sa Anak ng Tao
  rationale: Pinananatili ang pormulang tumutukoy sa Kasulatan, ang paksa ng sinulat, at ang anyong patanong.
- source_word: ἵνα πολλὰ πάθῃ
  choice: na kailangan niyang magdusa nang labis
  rationale: Ang ἵνα ay nauunawaan bilang nilalaman ng nasusulat; ang πολλὰ ay natural na ipinahahayag bilang matinding o maraming pagdurusa, hindi bilang layuning sanhi.
- source_word: ἐξουδενηθῇ
  choice: ituring na walang kabuluhan
  rationale: Nakukuha nito ang pasibong diwa ng pagtrato o pagtingin sa isang tao na parang walang halaga; inilakip sa talababa ang mas maikling alternatibo.
theological_decisions:
- issue: Ugnayan ng pagpapanumbalik ni Elias at pagdurusa ng Anak ng Tao
  choice: Panatilihin ang ikalawang sugnay bilang retorikal na tanong, na may “Ngunit” upang natural na markahan ang pagkakatabi o tensiyon.
  alternative: Ipaliwanag ang lohika bilang tahasang doktrinal na konklusyon o alisin ang anyong patanong.
  rationale: Ang Griyego ay tunay na tanong at hindi nito tahasang nilulutas ang tensiyon sa pagitan ng pagpapanumbalik at pagdurusa.
- issue: Katawagan na υἱὸς τοῦ ἀνθρώπου
  choice: Anak ng Tao
  alternative: Mesiyas; Ang Taong Anak; ang taong ito
  rationale: Pinananatili ang mahalaga at nakaugaliang katawagan nang walang idinagdag na pagpapakahulugang wala sa mismong teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Iniwasan ang labis na makalumang pananalita; pinanatili ang pormulang “nasusulat” at ang katawagang “Anak ng Tao” dahil mahalaga ang kanilang biblikal na gamit.
