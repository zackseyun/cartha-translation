  text: καὶ ἐγένετο νεφέλη ἐπισκιάζουσα αὐτοῖς, καὶ ⸀ἐγένετο φωνὴ ἐκ τῆς νεφέλης· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ⸂ἀκούετε αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/007.yaml
  text: 'And a cloud came[a], overshadowing them, and a voice came out of the cloud: “This is my beloved Son; listen to him.”'
translation:
  language: tl
  text: 'At dumating ang isang ulap na lumilim sa kanila, at may tinig na nagmula sa ulap: “Ito ang minamahal kong Anak. Pakinggan ninyo siya.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Dinggin ninyo siya.” Ang utos ay nangangahulugan ng pakikinig nang mabuti at pagbibigay-pansin, hindi lamang ng pagkarinig.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο νεφέλη
  choice: dumating ang isang ulap
  rationale: Ang γίνομαι na may νεφέλη bilang simuno ay nagsasaad ng pagdating o biglang paglitaw. Likas sa Tagalog ang “dumating ang isang ulap” at pinananatili nito ang pangyayaring inilalarawan nang hindi dinaragdagan ng interpretasyon.
- source_word: ἐπισκιάζουσα αὐτοῖς
  choice: na lumilim sa kanila
  rationale: Pinananatili ng “lumilim” ang larawan ng ἐπισκιάζω—ang ulap ay naglalagay ng lilim sa kanila—nang hindi tahasang ginagawang “bumabalot,” na maaaring magpakitid sa kahulugan.
- source_word: φωνὴ ἐκ τῆς νεφέλης
  choice: may tinig na nagmula sa ulap
  rationale: Ang φωνή ay malinaw na isang nakapagsasalitang tinig, at ang “nagmula sa ulap” ay natural na nagpapahayag ng pinanggalingang tinutukoy ng ἐκ.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: ang minamahal kong Anak
  rationale: Ang “minamahal” ay tuwirang katumbas ng ἀγαπητός at nagpapanatili sa bigat ng pahayag tungkol sa Anak nang hindi nagdaragdag ng antas gaya ng “pinakamamahal.”
- source_word: ἀκούετε αὐτοῦ
  choice: Pakinggan ninyo siya
  rationale: Ang προστακτική na ἀκούετε ay humihiling ng masusing pakikinig at pagbibigay-pansin. Ang “pakinggan ninyo” ay likas na utos sa modernong Tagalog at hindi ito nililimitahan sa pandinig lamang o pinalalawak nang tahasan bilang “sundin.”
theological_decisions:
- issue: Pahayag ng Diyos tungkol sa pagkakakilanlan ni Jesus
  choice: “Ito ang minamahal kong Anak.”
  alternative: “Ito ang Anak ko, ang Minamahal.”
  rationale: Tuwirang ipinahahayag ng Griyego ang pagiging Anak ni Jesus at ang pagiging minamahal niya. Pinananatili ng napiling ayos ang dalawang elementong ito sa natural na Tagalog nang walang idinagdag na paliwanag na doktrinal.
- issue: Saklaw ng utos na ἀκούετε αὐτοῦ
  choice: “Pakinggan ninyo siya.”
  alternative: “Dinggin ninyo siya” o “Sundin ninyo siya.”
  rationale: Kasama sa utos ang pakikinig nang may pagpapahalaga at pagtugon, ngunit hindi gumagamit ang teksto ng tahasang pandiwang nangangahulugang “sumunod.” Kaya pinananatili ang mas malawak na puwersa nito.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “ninyo” para sa maramihang kausap at ang malaking titik sa “Anak” bilang karaniwang anyong tumutukoy kay Jesus, hindi bilang pagkakaibang nakasaad sa baybay ng Griyego.
