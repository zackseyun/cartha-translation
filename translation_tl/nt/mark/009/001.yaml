  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι εἰσίν τινες ⸂τῶν ὧδε⸃ ἑστηκότων οἵτινες οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὴν βασιλείαν τοῦ θεοῦ ἐληλυθυῖαν ἐν δυνάμει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/001.yaml
  text: And he was saying to them[a], “Truly I say to you[d][c][b], there are some standing here who will certainly not taste death until they see the kingdom of God having come in power.”
translation:
  language: tl
  text: At sinabi pa niya sa kanila, “Katotohanang sinasabi ko sa inyo, may ilan sa mga nakatayo rito na tiyak na hindi makatitikim ng kamatayan[a] hanggang sa makita nila ang kaharian ng Diyos na dumating nang may kapangyarihan.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “makatikim ng kamatayan” ay isang idyomang nangangahulugang “dumanas ng kamatayan” o “mamatay.”
    reason: lexical_alternative
  - marker: b
    text: Ang kaharian ng Diyos na “dumating nang may kapangyarihan” ay maaaring iugnay sa pagbabagong-anyo, muling pagkabuhay at pagdakila ni Jesus, Pentecostes, paghuhukom sa Jerusalem, o sa ganap na pagdating ng kaharian sa hinaharap. Hindi tinutukoy ng teksto kung alin sa mga ito ang tinutukoy.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγεν
  choice: patuloy niyang sinabi
  rationale: Ang imperpektong anyo ay nagpapahiwatig ng nagpapatuloy na pagsasalita; natural itong naipahahayag sa Tagalog sa pamamagitan ng “patuloy niyang sinabi.”
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Tinitiyak ko sa inyo
  rationale: Ito ang natural at marangal na katumbas ng pormulang nagpapakilala sa isang taimtim at mapananaligang pahayag ni Jesus.
- source_word: τινες τῶν ὧδε ἑστηκότων
  choice: may ilan sa mga nakatayo rito
  rationale: 'Malinaw nitong pinananatili ang partitive na diwa: ilan, hindi lahat, sa mga taong naroroon.'
- source_word: οὐ μὴ γεύσωνται θανάτου
  choice: tiyak na hindi makatitikim ng kamatayan
  rationale: Pinananatili ng “tiyak na hindi” ang mariing pagtanggi, at ng “makatitikim ng kamatayan” ang talinghaga ng Griyego.
- source_word: ἕως ἂν ἴδωσιν
  choice: hanggang sa makita nilang
  rationale: Natural na ipinahahayag nito ang hinaharap na hangganang temporal ng Griyegong konstruksyon.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: ang kaharian ng Diyos
  rationale: Karaniwan at malawak ang saklaw ng “kaharian,” kaya naipahihiwatig nito kapwa ang paghahari ng Diyos at ang eskatolohikong kaharian.
- source_word: ἐληλυθυῖαν
  choice: dumating na
  rationale: Ang “na” ay natural na naghahatid sa Tagalog ng perpektong aspekto—isang pagdating na naganap na at may nananatiling bunga—nang hindi ginagawang pilit ang pangungusap.
- source_word: ἐν δυνάμει
  choice: nang may kapangyarihan
  rationale: Natural itong Tagalog at pinananatili ang diwa ng hayag o nahayag na banal na kapangyarihan nang hindi tinutukoy ang paraan o pangyayari.
theological_decisions:
- issue: Ang panahon at tinutukoy ng pagdating ng kaharian ng Diyos nang may kapangyarihan
  choice: Hindi tinukoy sa salin kung aling pangyayari ang tinutukoy.
  alternative: Maaaring iugnay ito sa pagbabagong-anyo, muling pagkabuhay at pagdakila, Pentecostes, paghuhukom sa Jerusalem, o ganap na pagdating ng kaharian sa hinaharap.
  rationale: Hindi tahasang tinutukoy ng Griyegong teksto ang partikular na pangyayari; pinananatili ng salin ang tunay na interpretatibong kalabuan at teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang talinghagang “makatikim ng kamatayan,” samantalang ginawang natural ang perpektong participle sa “dumating na.”
