    rationale: Ang “Tinitiyak ko sa inyo” ay katanggap-tanggap, ngunit hindi nito hayagang naipapahayag ang λέγω. Ang “Katotohanang sinasabi ko sa inyo” ay natural, marangal, at mas malapit sa solemneng pormula ng pinagmulan.
  - severity: low
