    issue: Hindi likas ang “At patuloy niyang sinabi.”
    rationale: Bagaman nagpapahiwatig ang ἔλεγεν ng imperpektibong aspekto, ang “patuloy niyang sinabi” ay maaaring mangahulugang ipinagpatuloy niya ang isang partikular na pahayag. Mas natural ang “Sinabi pa niya,” na maaaring magmarka ng pagpapatuloy sa salaysay nang hindi labis na binibigyang-kahulugan ang aspekto.
  - severity: low
