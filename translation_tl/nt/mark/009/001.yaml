    rationale: Ang Griyego ay nagsasabing makikita nila ang kaharian na dumating na/nakapagdating na. Ang rebisyon ay pinananatili ang kaharian bilang tuwirang layon ng “makita” at ang dating perpektibong diwa nang hindi nagiging pilit.
