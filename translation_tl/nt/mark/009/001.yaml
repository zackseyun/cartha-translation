  to: At sinabi pa niya sa kanila, “Katotohanang sinasabi ko sa inyo, may ilan sa mga nakatayo rito na tiyak na hindi makatitikim ng kamatayan[a] hanggang sa makita nila ang kaharian ng Diyos na dumating nang may kapangyarihan.”[b]
  rationale: Ginawang mas likas ang pagsasalin ng imperpektong pandiwang pangsalaysay at mas tuwiran ang solemneng pormulang “Amen, sinasabi ko sa inyo.” Inayos din ang hulíng sugnay upang ang “kaharian ng Diyos” ang malinaw na layon ng “makita,” habang pinananatili ang perpektibong diwa ng ἐληλυθυῖαν at ang interpretatibong kalabuan ng talata. Hindi binago ang kahulugan o ang mga angkla ng talababa.
