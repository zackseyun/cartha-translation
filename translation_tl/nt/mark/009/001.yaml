  verdict: revise
  source_fidelity: 'Ang pangunahing diwa ay tapat sa Griyego: pinananatili ang pangkat na ilan lamang sa mga naroroon, ang mariing pagtanggi sa pagdanas ng kamatayan, at ang kaharian ng Diyos na dumating na nang may kapangyarihan. Gayunman, ang “patuloy niyang sinabi” ay hindi likas na paraan upang isalin ang imperpektong ἔλεγεν sa ganitong salaysay; ang “sinabi pa niya” ay mas natural at maingat, nang hindi nagpapahiwatig ng walang patid na pagsasalita.'
  naturalness: Malinaw at marangal ang natitirang salin. Ang “Katotohanang sinasabi ko sa inyo” ay mas tuwirang katumbas ng Ἀμὴν λέγω ὑμῖν at likas sa modernong Filipino Tagalog na rehistrong pampanitikan/Biblikal. Ang “makita nila ang kaharian ng Diyos na dumating nang may kapangyarihan” ay mas tuwirang tumutugma sa konstruksyong Griyego kaysa sa fact-clause na “makita nilang dumating na…”.
  terminology: Ang “kaharian ng Diyos,” “makatikim ng kamatayan,” at “nang may kapangyarihan” ay angkop at pare-pareho. Pinananatili ng talababa ang idyoma at ang hindi tiyak na tinutukoy na pangyayari, nang hindi nagpapataw ng isang interpretasyon.
  issues:
