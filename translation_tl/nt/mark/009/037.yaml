  source_fidelity: Kailangang baguhin ang pangwakas na sugnay. Ang "hindi lamang ako ... kundi" ay nagdaragdag ng "lamang"/"only," na wala sa Griyego (οὐκ ἐμέ ... ἀλλά). Dapat panatilihin ang matinding retorikal na pagsalungat ng pinagmulan nang hindi ito nilulutas sa pangunahing teksto.
  naturalness: Natural sa modernong Filipino ang "isa sa ganitong mga bata" para sa partitive at kwalitatibong ἓν τῶν τοιούτων παιδίων. Ang "sa aking pangalan" ay matatag at likas na katumbas ng ἐπὶ τῷ ὀνόματί μου; maipapaliwanag ang "dahil sa" bilang alternatibo sa talababa.
  terminology: Mahusay na pinananatili ang salitang-ugat na "tanggap" sa bawat paglitaw ng δέχομαι. Ang "nagsugo sa akin" ay tumpak at likas para sa τὸν ἀποστείλαντά με. Hindi dapat idagdag ang "lamang" upang magpataw ng isang pagpapaliwanag sa teolohikal na pagsalungat.
