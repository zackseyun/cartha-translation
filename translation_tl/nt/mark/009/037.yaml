  - severity: low
    issue: '"tulad nito" ay hindi gaanong likas sa partitive na parirala'
    rationale: Ang "isa sa ganitong mga bata" ay mas likas na modernong Filipino at pinananatili ang diwang "isa sa mga batang may ganitong uri," hindi "isa sa mga batang ito."
