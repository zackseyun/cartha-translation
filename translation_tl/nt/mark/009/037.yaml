  text: Ὃς ⸀ἂν ἓν τῶν τοιούτων παιδίων δέξηται ἐπὶ τῷ ὀνόματί μου, ἐμὲ δέχεται· καὶ ὃς ⸁ἂν ἐμὲ ⸀δέχηται, οὐκ ἐμὲ δέχεται ἀλλὰ τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/037.yaml
  text: Whoever receives one of such children in my name receives me; and whoever receives me receives not me, but the one who sent me.
translation:
  language: tl
  text: “Ang sinumang tumatanggap ng isa sa ganitong mga bata sa aking pangalan[a] ay tumatanggap sa akin; at ang sinumang tumatanggap sa akin ay hindi ako ang tinatanggap kundi ang nagsugo sa akin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dahil sa aking pangalan.” Ipinahihiwatig ng parirala ang pagtanggap na may kaugnayan sa pangalan, pagkatao, o awtoridad ni Jesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὃς ἂν
  choice: Ang sinumang
  rationale: Likas na katumbas sa Filipino ng di-tiyak at pangkalahatang pahayag na ‘whoever.’
- source_word: ἓν τῶν τοιούτων παιδίων
  choice: sa isa sa mga batang tulad nito
  rationale: Pinananatili ang partitive na ‘isa sa mga’ at ang kwalitatibong diwa ng τοιούτων, ‘tulad nito/ganitong uri,’ nang hindi ito ginagawang simpleng panturong ‘mga batang ito.’
- source_word: δέξηται / δέχεται / δέχηται
  choice: tumanggap / tumatanggap / tinatanggap
  rationale: Inuulit ang iisang salitang-ugat upang mapanatili ang malinaw na ugnayan ng pagtanggap sa bata, kay Jesus, at sa nagsugo sa kanya. Ang ‘tanggapin’ ay maaari ring magpahiwatig ng malugod na pagtanggap ayon sa konteksto.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: dahil sa aking pangalan
  rationale: Ipinahahayag ang pagtanggap na ginagawa alang-alang kay Jesus o dahil sa kaugnayan sa kanyang pangalan; mas malinaw ito sa kasalukuyang Filipino kaysa sa maaaring malabong ‘sa aking pangalan.’
- source_word: τὸν ἀποστείλαντά με
  choice: ang nagsugo sa akin
  rationale: Natural at maikling salin ng articular participle, habang pinananatili ang wika ng pagsusugo.
theological_decisions:
- issue: Lakas ng pangwakas na pagsalungat na οὐκ ἐμὲ ... ἀλλὰ
  choice: hindi lamang ako ang tinatanggap kundi ang nagsugo sa akin
  alternative: hindi ako ang tinatanggap kundi ang nagsugo sa akin
  rationale: 'Sa Filipino, ang hubad na ‘hindi ako ... kundi’ ay karaniwang nauunawaang ganap na pagkakait na tinatanggap si Jesus, na sasalungat din sa naunang tahasang pahayag. Ang ‘hindi lamang ... kundi’ ay naghahatid sa retorikal na diin: ang pagtanggap kay Jesus ay umaabot sa nagsugo sa kanya. Gayunman, kinikilalang mas eksplisito ito kaysa sa anyong Griyego.'
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Pinanatili ang pag-uulit ng ‘tanggap’ at ang pagkakaiba ng ‘batang tulad nito’ sa mas tiyak na ‘batang ito.’
