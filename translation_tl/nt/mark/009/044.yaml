lexical_decisions:
- source_word: σκώληξ
  choice: uod
  rationale: Tumutukoy sa uod na kumakain ng nabubulok na bagay. Ang “uod” ang tuwiran at likas na katumbas sa Tagalog at pinananatili nito ang larawan mula sa Isaias 66:24.
- source_word: τελευτᾷ
  choice: namamatay
  rationale: Ang pandiwa ay maaaring mangahulugang sumapit sa wakas o mamatay; dahil buhay na nilalang ang tinutukoy, “namamatay” ang pinakanatural na salin.
- source_word: σβέννυται
  choice: napapatay
  rationale: Ang kasalukuyang balintiyak na anyo ay nangangahulugang mapawi o mapatay. Karaniwang ginagamit sa Tagalog ang “patayin ang apoy,” kaya malinaw at likas ang “hindi napapatay.”
theological_decisions:
- issue: Ang tinutukoy ng panghalip na αὐτῶν (“kanilang”)
  choice: kanilang uod
  alternative: ang uod na kumakain sa kanila
  rationale: Pinananatili ang tuwiran at bahagyang di-tiyak na ugnayan ng panghalip sa Griyego sa halip na ipaliwanag kung ano mismo ang relasyon ng uod sa kanila.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang tradisyonal at biblikal na larawang “uod” at ginamit ang likas na pariralang “patayin ang apoy.”
