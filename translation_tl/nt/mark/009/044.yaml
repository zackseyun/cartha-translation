  text: kung saan[a] hindi namamatay ang kanilang uod, at hindi namamatay ang apoy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wala ang talatang ito sa pinakamaagang mga manuskritong Griyego, kabilang ang Sinaiticus at Vaticanus noong ika-4 na siglo, at sa mga sinaunang saling Coptic. Gayunman, matatagpuan ito sa Alexandrinus noong ika-5 siglo, sa tradisyong Latin, at sa nakararaming mas huling manuskritong Byzantine. Malamang na idinagdag ito ng isang tagakopya bilang pag-uulit ng kaparehong pananalita sa talata 48.
