  text: ἰδὼν δὲ ὁ Ἰησοῦς ὅτι ἐπισυντρέχει ὄχλος ἐπετίμησεν τῷ πνεύματι τῷ ἀκαθάρτῳ λέγων αὐτῷ· Τὸ ⸂ἄλαλον καὶ κωφὸν πνεῦμα⸃, ἐγὼ ⸂ἐπιτάσσω σοι⸃, ἔξελθε ἐξ αὐτοῦ καὶ μηκέτι εἰσέλθῃς εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/025.yaml
  text: But when Jesus saw that a crowd was quickly gathering[a], he rebuked the unclean spirit, saying to it, “You mute and deaf spirit, I command you, come out of him and never enter him again.”
translation:
  language: tl
  text: 'Ngunit nang makita ni Jesus na mabilis na nagtitipon ang isang pulutong[a], sinaway niya ang maruming espiritu at sinabi rito, “Ikaw na espiritung pipi at bingi, inuutusan kita: lumabas ka sa kanya at huwag ka nang muling pumasok sa kanya.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “may isang pulutong na nagtatakbuhang nagtitipon.” Ipinahihiwatig ng pandiwang Griyego na mabilis na nagkakatipon o nagtatagpo ang mga tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: Ngunit nang makita
  rationale: Ang aorist participle na ἰδών ay nagbibigay ng pangyayaring kaugnay sa pangunahing kilos, at ang δέ ay banayad na pang-ugnay. Likas sa Filipino ang “Ngunit nang makita” at napapanatili nito ang daloy at panahong ipinahihiwatig.
- source_word: ἐπισυντρέχει ὄχλος
  choice: mabilis na nagtitipon ang maraming tao
  rationale: Ipinahihiwatig ng ἐπισυντρέχω ang mabilis na pagsasama-sama o pagdagsa ng mga tao. Pinananatili ng salin ang pagkilos at pagmamadali nang hindi nagiging mekanikal ang pananalita.
- source_word: ἐπετίμησεν
  choice: sinaway
  rationale: Ang ἐπιτιμάω ay nagpapahayag ng matinding pagsaway na may awtoridad at karaniwang ginagamit sa mga Ebanghelyo sa pagsaway ni Jesus sa mga espiritu. Ang “sinaway” ay natural at matatag na katumbas sa Filipino.
- source_word: τῷ πνεύματι τῷ ἀκαθάρτῳ
  choice: ang maruming espiritu
  rationale: Pinananatili ng “maruming espiritu” ang katawagang pang-Ebanghelyo at ang mga pahiwatig ng ἀκάθαρτος tungkol sa karumihan, sa halip na palitan ito ng mas malawak na “masamang espiritu.”
- source_word: Τὸ ἄλαλον καὶ κωφὸν πνεῦμα
  choice: Ikaw na espiritung pipi at bingi
  rationale: Ang nominative na may pantukoy ay ginagamit dito bilang tuwirang pagtawag. Malinaw na pinaghihiwalay ng “pipi at bingi” ang ἄλαλος at κωφός, habang ang “Ikaw na” ay likas na panawagan sa Filipino.
- source_word: ἐγὼ ἐπιτάσσω σοι
  choice: inuutusan kita
  rationale: Ang ἐπιτάσσω ay isang makapangyarihang pag-uutos. Ang “inuutusan kita” ay tuwiran at natural, at naipapakita ng hayag na “kita” ang personal na diin ng ἐγώ at σοι nang hindi ito labis na pinatitindi.
- source_word: ἔξελθε ἐξ αὐτοῦ
  choice: lumabas ka sa kanya
  rationale: Ang “lumabas ka” ay malinaw na pautos at karaniwang paraan sa Filipino upang ilarawan ang pagpapalabas sa espiritu mula sa isang tao.
- source_word: μηκέτι εἰσέλθῃς εἰς αὐτόν
  choice: huwag ka nang muling pumasok sa kanya
  rationale: Ipinapahayag ng μηκέτι kasama ng aorist subjunctive ang tiyak na pagbabawal sa muling pagpasok. Natural at mariin sa Filipino ang “huwag ka nang muling pumasok.”
theological_decisions:
- issue: Katawagan sa demonyong espiritu at awtoridad ni Jesus
  choice: Isinalin ang πνεῦμα ἀκάθαρτον bilang “maruming espiritu,” ang ἐπετίμησεν bilang “sinaway,” at ang ἐπιτάσσω bilang “inuutusan.”
  alternative: “masamang espiritu,” “di-malinis na espiritu,” o mas mahinang pananalitang gaya ng “mahigpit na kinausap”
  rationale: Inilalarawan ng talata ang espiritu bilang isang personal na nilalang na tuwirang kinakausap at inuutusan ni Jesus. Pinananatili ng salin ang natatanging katawagan ng teksto at ang malinaw na awtoridad ni Jesus, nang hindi ito ginagawang paglalarawan lamang ng karamdaman o dinaragdagan ng paliwanag na wala sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Pinanatili ang tuwirang lakas ng utos ni Jesus at ang katawagang “maruming espiritu,” habang iniwasan ang masyadong teknikal o makalumang pananalita.
