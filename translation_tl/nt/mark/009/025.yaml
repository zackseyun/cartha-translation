  to: 'Ngunit nang makita ni Jesus na mabilis na nagtitipon ang isang pulutong[a], sinaway niya ang maruming espiritu at sinabi rito, “Ikaw na espiritung pipi at bingi, inuutusan kita: lumabas ka sa kanya at huwag ka nang muling pumasok sa kanya.”'
