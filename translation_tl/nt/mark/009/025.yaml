  source_fidelity: 'Tumpak na naisasalin ng draft ang daloy ng talata: nakita ni Jesus ang mabilis na pagtitipon ng pulutong, sinaway niya ang maruming espiritu, at may awtoridad niya itong inutusang lumabas at huwag nang bumalik. Ang “maruming espiritu,” “pipi at bingi,” “inuutusan kita,” at ang dalawang utos ay maayos na tumutugon sa Griyego.'
  naturalness: Likas ang pangunahing salin, ngunit mas idiomatiko at mas tiyak para sa ὄχλος ang “isang pulutong” kaysa “maraming tao.” Ang kasalukuyang alternatibong salin sa talababa (“nagdudumaling magsama-sama”) ay hindi natural na modernong Filipino.
  terminology: Ang “maruming espiritu” ay angkop na tuwirang katumbas ng πνεῦμα ἀκάθαρτον at pinananatili ang natatanging katawagan ng Ebanghelyo nang hindi ito pinapalitan ng “masamang espiritu.” Ang “sinaway” at “inuutusan kita” ay sapat na matatag upang ihayag ang awtoridad ni Jesus.
