  text: τὸ γὰρ μυστήριον ἤδη ἐνεργεῖται τῆς ἀνομίας· μόνον ὁ κατέχων ἄρτι ἕως ἐκ μέσου γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/007.yaml
  text: For the mystery of lawlessness is already at work[b][a]; only the one who now restrains will do so until he is out of the way.
translation:
  language: tl
  text: Sapagkat kumikilos na ang hiwaga ng paglabag sa kautusan; tanging ang pumipigil ngayon[a] ang patuloy na pipigil hanggang sa mawala siya sa daan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang humahadlang ngayon”; hindi tinutukoy ng Griyego kung sino ang pumipigil na ito.
    reason: alternative_reading
  - marker: b
    text: O “hanggang sa maalis siya” o “hanggang sa alisin siya sa daan.” Hindi gaanong tiyak sa Griyego kung paano ito mangyayari.
    reason: lexical_alternative
lexical_decisions:
- source_word: μυστήριον
  choice: hiwaga
  rationale: Pinananatili nito ang diwa ni Pablo tungkol sa isang nakatagong realidad na kumikilos na, sa halip na ipakahulugang isa lamang palaisipan.
- source_word: ἐνεργεῖται
  choice: kumikilos na
  rationale: Natural itong pahayag sa modernong Tagalog at ipinahihiwatig ang kasalukuyan at nagpapatuloy na pagkilos.
- source_word: ἀνομίας
  choice: paglabag sa kautusan
  rationale: Malinaw nitong ipinahahayag ang pagsalungat sa kautusan at pinananatili ang ugnayan sa ἄνομος sa nakapaligid na talata, nang hindi ito nililimitahan sa pangkalahatang kasamaan lamang.
- source_word: μόνον
  choice: ngunit
  rationale: Sa eliptikong pangungusap, ipinakikilala nito nang natural ang naglilimita o sumasalungat na kondisyon; ang diwa ng pagpapatuloy ay naipahahayag sa kasunod na parirala.
- source_word: ὁ κατέχων
  choice: ang pumipigil ngayon
  rationale: Pinananatili ang participial na paglalarawan at hindi tinutukoy kung sino ang mahiwagang pumipigil.
- source_word: ἄρτι
  choice: ngayon
  rationale: Tuwirang ipinahahayag ang kasalukuyang panahon ng pagpigil.
- source_word: ἕως ἐκ μέσου γένηται
  choice: hanggang sa mawala siya sa daan
  rationale: Inilalarawan ang kalagayang hindi na siya nakahahadlang nang hindi tahasang nagsasaad kung may nag-alis sa kaniya; ipinaliliwanag sa talababa ang iba pang posibleng salin.
theological_decisions:
- issue: Pagkakakilanlan ng ὁ κατέχων (“ang pumipigil”)
  choice: Isinalin sa pangkalahatang paraan bilang “ang pumipigil ngayon,” nang hindi siya kinikilala.
  alternative: Maaaring ipakahulugan bilang pamahalaang Romano, pamahalaan ng tao, ang Banal na Espiritu, isang anghel, si Pablo, o ang pangangaral ng mga apostol.
  rationale: Binabanggit ng Griyego ang isang pumipigil ngunit hindi tinutukoy sa talatang ito kung sino siya; hindi dapat lutasin ng salin ang pinagtatalunang pakahulugang eskatolohikal.
- issue: Paraan o ahensiya sa ἕως ἐκ μέσου γένηται
  choice: “hanggang sa mawala siya sa daan”
  alternative: “hanggang sa maalis siya” o “hanggang sa alisin siya sa daan”
  rationale: Hindi tahasang sinasabi ng Griyego kung kusa siyang mawawala o may mag-aalis sa kaniya, kaya pinananatili ng salin ang pagiging di-tiyak nito.
translation_notes:
  register: Makabago at marangal na Tagalog na madaling maunawaan. Ginamit ang “hiwaga” bilang pamilyar na terminong biblikal, at iniwasang tukuyin ang pagkakakilanlan ng pumipigil o ang paraan ng pagkawala niya.
