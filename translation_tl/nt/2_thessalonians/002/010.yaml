  rationale: Pinalitan ang di-likas na “sa bawat panlilinlang ng kalikuan” ng “sa lahat ng uri ng masamang panlilinlang.” Ipinapahayag nito ang lahat-ng-saklaw na puwersa ng πάσῃ at ang katangiang moral ng ἀδικίας nang hindi nagdaragdag ng sanhi, ahensiya, o partikular na teolohikal na pagbasa. Iningatan ang “para sa mga napapahamak,” na isang posibleng pagpapahayag ng tungkulin ng dative sa konteksto, at ang “upang maligtas sila,” na pinananatili ang telic na puwersa ng εἰς τὸ σωθῆναι αὐτούς. Inihanay muli ang mga talababa upang ang marker a ay manatiling nakakabit sa unang lexical alternative.
