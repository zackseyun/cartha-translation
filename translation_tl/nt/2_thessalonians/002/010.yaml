  source_fidelity: 'Tumpak na naihahatid ng draft ang pangunahing diwa ng Griyego: ang saklaw ng panlilinlang, ang nagpapatuloy na kalagayan ng mga napapahamak, ang dahilan ng kanilang kalagayan, ang kanilang pagtanggi sa pag-ibig sa katotohanan, at ang layuning/kinahinatnang maligtas sila. Gayunman, ang “panlilinlang ng kalikuan” ay masyadong kalkado at hindi likas na paraan ng pagpapahayag ng qualitative genitive sa modernong Tagalog.'
  naturalness: Kailangan ng bahagyang pag-aayos sa unang parirala. Ang “lahat ng uri ng masamang panlilinlang” ay malinaw, natural, at pinananatili ang saklaw ng πάσῃ at ang moral na katangian ng ἀδικίας. Ang iba pang bahagi ng pangungusap ay malinaw at angkop sa marangal ngunit modernong rehistro.
  terminology: Ang “mga napapahamak,” “pag-ibig sa katotohanan,” “tinanggap,” at “maligtas” ay angkop at hindi nagpapasok ng labis na interpretasyong teolohikal. Ang “masamang” ay mas natural kaysa “ng kalikuan” para sa ἀδικίας sa ganitong parirala; ang “kasamaan” ay pinananatili bilang alternatibo sa talababa.
