base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/010.yaml
  text: and with every deception of unrighteousness for those who are perishing[d][c][b][a], because they did not accept the love of the truth so as to be saved.
translation:
  language: tl
  text: at sa lahat ng uri ng masamang panlilinlang para sa mga napapahamak[b], sapagkat hindi nila tinanggap[c] ang pag-ibig sa katotohanan upang maligtas sila.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Maaari ring “sa mga napapahamak” o “kabilang sa mga napapahamak.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “hindi nila malugod na tinanggap.”
    reason: lexical_alternative
  - marker: d
    text: Maaari ring “para sila ay maligtas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπάτῃ
  choice: panlilinlang
  rationale: Saklaw ng ἀπάτη ang aktibong pandaraya o panlilinlang. Ang “panlilinlang” ay likas sa modernong Tagalog at angkop sa konteksto.
- source_word: ἀδικίας
  choice: ng kalikuan
  rationale: Iningatan ang anyong pangngalan ng genitive at ang moral na bigat ng ἀδικία. Dito, inilalarawan nito ang uri o katangian ng panlilinlang.
- source_word: τοῖς ἀπολλυμένοις
  choice: para sa mga napapahamak
  rationale: Ipinahihiwatig ng dative ang mga taong pinatutungkulan o naaapektuhan ng panlilinlang. Ang kasalukuyang participle ay isinalin bilang nagpapatuloy na kalagayan, hindi bilang nakapirming hatol.
- source_word: ἀνθ’ ὧν
  choice: sapagkat
  rationale: Sa konteksto, ipinakikilala ng parirala ang dahilan. Ang “sapagkat” ay malinaw at marangal na pagpapahayag ng ugnayang sanhi.
- source_word: ἀγάπην τῆς ἀληθείας
  choice: ang pag-ibig sa katotohanan
  rationale: Ang “pag-ibig sa katotohanan” ay natural sa Tagalog at ipinahahayag ang malamang na objective genitive—pagmamahal nila sa katotohanan—nang hindi ito ginagawang simpleng kaalamang pangkaisipan.
- source_word: ἐδέξαντο
  choice: tinanggap
  rationale: Ang δέχομαι ay maaaring mangahulugang tumanggap, kumilala, o malugod na tumanggap. Ang “tinanggap” ay malinaw at angkop sa abstraktong layon.
- source_word: εἰς τὸ σωθῆναι αὐτούς
  choice: upang maligtas sila
  rationale: Pinananatili ng “upang” ang layunin o resultang maaaring ipahiwatig ng εἰς na may articular infinitive, at tahasang kinakatawan ng “sila” ang αὐτούς.
theological_decisions:
- issue: Kung ang τοῖς ἀπολλυμένοις ay tumutukoy sa nakapirming kapalaran o sa nagpapatuloy na kalagayan
  choice: mga napapahamak
  alternative: mga itinakdang mapahamak; mga ipinapahamak
  rationale: Ang present participle ay pinakamainam na kumatawan sa nagpapatuloy na kalagayan. Iniiwasan nitong magpasok ng partikular na sistemang teolohikal na hindi tahasang sinasabi ng teksto.
- issue: Kung ang τὴν ἀγάπην τῆς ἀληθείας ay pag-ibig nila sa katotohanan o pag-ibig na nagmumula sa katotohanan
  choice: ang pag-ibig sa katotohanan
  alternative: ang pag-ibig ng katotohanan
  rationale: Mas pinapaboran ng konteksto ang pag-ibig nila sa katotohanan, ngunit pinananatili ang anyong malapit sa pariralang Griyego at hindi ito pinalalawak bilang interpretatibong paraphrase.
- issue: Kung ang εἰς τὸ σωθῆναι αὐτούς ay layunin o resulta
  choice: upang maligtas sila
  alternative: kaya maliligtas sana sila; para sila ay maligtas
  rationale: Maaaring magpahiwatig ang kayarian ng layunin o resulta. Ang “upang” ay nagpapanatili ng telic na diwa nang hindi nagpapasya nang labis sa ugnayan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang pagkakaugnay nito sa naunang pangungusap sa pamamagitan ng pambungad na “at.” Ginamit ang “kalikuan” para sa moral at teolohikal na bigat ng ἀδικία, habang inilagay sa talababa ang mas pangkaraniwang “kasamaan.”
