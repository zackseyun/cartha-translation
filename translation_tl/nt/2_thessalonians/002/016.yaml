    rationale: Ang pangunahing teksto ay “walang hanggang kaaliwan,” ngunit ang talababa ay nagbibigay ng “walang hanggang pampatibay” at “walang hanggang pagpapalakas ng loob.” Ang mga alternatibo ay para sa παράκλησις (“kaaliwan”), samantalang ang “walang hanggan” ay salin ng hiwalay na αἰωνίαν. Dapat tukuyin ng talababa ang mismong salitang tinutukoy upang maging tumpak ang anchor at saklaw nito.
