id: 2TH.2.16
reference: 2 Thessalonians 2:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ὁ κύριος ἡμῶν Ἰησοῦς Χριστὸς καὶ ⸀θεὸς ⸀ὁ πατὴρ ἡμῶν, ὁ ἀγαπήσας ἡμᾶς καὶ δοὺς παράκλησιν αἰωνίαν καὶ ἐλπίδα ἀγαθὴν ἐν χάριτι,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/016.yaml
  text: May our Lord Jesus the Messiah himself[a], and God our Father, who loved us and gave us eternal encouragement and good hope by grace,
translation:
  language: tl
  text: Nawa ang ating Panginoong Jesus na Mesiyas mismo at ang Diyos na ating Ama, na umibig sa atin at nagbigay sa atin ng walang hanggang kaaliwan[a] at mabuting pag-asa sa pamamagitan ng biyaya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pampatibay” o “pagpapalakas ng loob” para sa “kaaliwan” (παράκλησις).
    reason: Ipinakikita ang lehitimong lawak ng kahulugan ng παράκλησις, na maaaring tumukoy sa kaaliwan, pampatibay, o pagpapalakas ng loob.
lexical_decisions:
- source_word: Αὐτὸς
  choice: mismo
  rationale: Pinananatili ang masidhing diin sa personal na pagkilos ng pinagsamang simuno nang natural sa Filipino.
- source_word: δὲ
  choice: hindi tahasang isinalin
  rationale: Mahinang panandang transisyon ito; hindi kailangan ang “ngayon,” na maaaring magpahiwatig ng panahong wala naman sa Griyego. Ang “Nawa” ay natural nang nagpapakilala sa panalangin.
- source_word: κύριος
  choice: Panginoon
  rationale: Karaniwan at angkop na salin ng titulong κύριος para kay Jesus.
- source_word: Ἰησοῦς Χριστός
  choice: Jesus na Mesiyas
  rationale: Isinasalin ang Χριστός bilang titulong “Mesiyas,” hindi bilang apelyido o di-naisasaling bahagi ng pangalan.
- source_word: θεὸς ὁ πατὴρ ἡμῶν
  choice: ang Diyos na ating Ama
  rationale: Malinaw at natural na pinananatili ang Diyos bilang ating Ama nang hindi ginagawang “ating Diyos at Ama,” na ibang ayos ng parirala.
- source_word: ὁ ἀγαπήσας
  choice: na umibig
  rationale: Ginagawang likas na sugnay na panlarawan sa Filipino ang articular aorist participle, nang hindi labis na tinutukoy ang antecedent.
- source_word: δοὺς
  choice: nagbigay
  rationale: Payak na aspektong naganap ang natural na katumbas ng aorist participle sa kontekstong ito.
- source_word: παράκλησιν
  choice: kaaliwan
  rationale: Saklaw ng salita ang kaaliwan, pagpapalakas ng loob, at pampatibay. Ang “kaaliwan” ay dignified at natural, habang inilalahad sa talababa ang ibang lehitimong kahulugan.
- source_word: αἰωνίαν
  choice: walang hanggang
  rationale: Karaniwan at malinaw na salin na nagpapahayag ng namamalaging saklaw.
- source_word: ἐλπίδα ἀγαθὴν
  choice: mabuting pag-asa
  rationale: Direkta at natural na pinananatili ang positibong katangian ng pag-asa.
- source_word: ἐν χάριτι
  choice: sa pamamagitan ng biyaya
  rationale: Ipinapahayag ang malamang na instrumental na diwa ng ἐν nang malinaw at likas sa Filipino.
theological_decisions:
- issue: Ang isahang anyo ng mga participle na “umibig” at “nagbigay” kasunod ng pinagsamang “Panginoong Jesus na Mesiyas” at “Diyos na ating Ama”
  choice: Iisang sugnay na “na umibig ... at nagbigay ...” ang pinanatili nang hindi nililinaw kung ito ay tumutukoy lamang sa Ama o sa dalawang naunang tinukoy.
  alternative: Tahasang iugnay ang sugnay sa Diyos Ama lamang, o gawing malinaw na kapwa sina Jesus at ang Ama ang tinutukoy.
  rationale: Ang Griyego ay may pinagsamang simuno ngunit isahang mga panuring. Pinananatili ng salin ang tunay na sintaktikong tensiyon at hindi nagpapataw ng doktrinal na pagpapasya na lampas sa teksto.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “Nawa” upang likas na ipakilala ang panalanging nagpapatuloy sa susunod na talata. Nasa “kaaliwan” ang talababa dahil iyon ang salitang tinutukoy nito.
