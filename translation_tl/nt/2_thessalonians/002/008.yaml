  text: And then the lawless one will be revealed[a], whom the Lord Jesus will slay with the breath of his mouth and bring to nothing by the appearance of his coming[b],
translation:
  language: tl
  text: At pagkatapos ay mahahayag ang suwail sa kautusan, na papatayin ng Panginoong Jesus sa pamamagitan ng hininga[a] ng kanyang bibig at ipapawalang-bisa sa pagpapakita ng kanyang pagdating[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “espiritu.” Ang salitang Griyego ay maaaring mangahulugang “hininga” o “espiritu”; mas angkop sa idyoma rito ang “hininga.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa pagpapakita ng kanyang presensiya.” Sa kontekstong ito, karaniwang diwa ng παρουσία ang “pagdating,” bagaman maaari rin itong mangahulugang “presensiya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκαλυφθήσεται
  choice: mahahayag
  rationale: 'Pinananatili ang diwang pasibo at apokaliptikong gamit: ang tinutukoy ay malalantad o makikitang hayag, nang hindi tinutukoy kung sino ang naghahayag.'
- source_word: ὁ ἄνομος
  choice: ang walang kinikilalang kautusan
  rationale: Isinasalin ang pang-uring ginamit bilang pangngalan nang hindi idinaragdag ang salitang “tao,” na wala mismo sa pariralang Griyego sa talatang ito.
- source_word: ὁ κύριος Ἰησοῦς
  choice: ang Panginoong Jesus
  rationale: Likas at kinikilalang anyo sa makabagong Filipino para sa titulo at pangalan.
- source_word: ἀνελεῖ
  choice: papatayin
  rationale: Malinaw at tuwirang ipinahahayag ang kahulugan ng pandiwa rito na pagkitil ng buhay; hindi pinahihina bilang simpleng pag-aalis lamang.
- source_word: τῷ πνεύματι τοῦ στόματος αὐτοῦ
  choice: sa pamamagitan ng hininga ng kanyang bibig
  rationale: Sa idyomang ito, ang “hininga” ang pinakanatural na diwa ng πνεῦμα at umaayon sa larawan ng makahulang paghatol; pinananatili sa talababa ang posibleng “espiritu.”
- source_word: καταργήσει
  choice: wawakasan
  rationale: Ipinahahayag ang tiyak na pagpapawalang-saysay o pagdadala sa wakas nang hindi iginigiit ang pilosopikal na ideya ng pagkalipol.
- source_word: τῇ ἐπιφανείᾳ
  choice: sa pagpapakita
  rationale: Tumutukoy sa hayag at nakikitang pagpapakita, at hindi idinaragdag ang interpretibong diwa ng kaningningan.
- source_word: τῆς παρουσίας αὐτοῦ
  choice: ng kanyang pagdating
  rationale: Sa kontekstong eskatolohikal, karaniwang tumutukoy ang παρουσία sa pagdating ni Cristo; inilalagay sa talababa ang mas literal na posibleng “presensiya.”
theological_decisions:
- issue: Pagkakakilanlan at paglalarawan sa kalabang lilitaw sa wakas
  choice: ang walang kinikilalang kautusan
  alternative: ang taong suwail sa kautusan
  rationale: Sinusunod ang pang-uring ginamit bilang pangngalan sa talatang ito at iniiwasang ipasok ang salitang “tao” mula sa kalapit na konteksto.
- issue: Paraan ng pagtatagumpay ng Panginoong Jesus
  choice: sa pamamagitan ng hininga ng kanyang bibig
  alternative: sa pamamagitan ng espiritu ng kanyang bibig
  rationale: “Hininga” ang mas natural sa idyoma at sa larawang makahula, ngunit tunay na saklaw rin ng πνεῦμα ang “espiritu,” kaya hindi ito itinatago.
- issue: Kahulugan ng παρουσία
  choice: pagdating
  alternative: presensiya
  rationale: “Pagdating” ang karaniwang diwa sa kontekstong eskatolohikal, habang ang “presensiya” ay leksikal na posible at pinananatili sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasan ang lipas na “hininga ng bibig niya” na walang pang-ugnay at ang masyadong teknikal o sektaryong pananalita. Pinanatili ang pagkakaiba ng “papatayin” at “wawakasan,” gayundin ang mga tunay na alternatibong kahulugan ng πνεῦμα at παρουσία sa mga talababa.
