revisions:
- from: At kung magkagayon, mahahayag ang walang kinikilalang kautusan, na papatayin ng Panginoong Jesus sa pamamagitan ng hininga[a] ng kanyang bibig at wawakasan sa pagpapakita ng kanyang pagdating[b].
  to: At pagkatapos ay mahahayag ang suwail sa kautusan, na papatayin ng Panginoong Jesus sa pamamagitan ng hininga[a] ng kanyang bibig at ipapawalang-bisa sa pagpapakita ng kanyang pagdating[b].
  rationale: Inayos ang katumbas ng ὁ ἄνομος tungo sa likas na substantival na Filipino na hindi nagdadagdag ng «tao,» at pinalitan ang «wawakasan» ng «ipapawalang-bisa» upang maipakita ang mas tiyak na diwa ng καταργήσει. Inayos din ang pambungad upang tuwirang tumbasan ang καὶ τότε. Pinanatili ang mga footnote anchor at ang mga leksikal na alternatibo.
