  yaml_path: translation/nt/2_thessalonians/002/012.yaml
  text: so that all may be judged who did not believe the truth but took pleasure in unrighteousness[a].
translation:
  language: tl
  text: upang mahatulan ang lahat ng hindi naniwala sa katotohanan, kundi nalugod sa kalikuan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mahatulang nagkasala.” Maaaring ipahiwatig ng pandiwang Griyego ang masamang hatol sa kontekstong ito, bagaman mas tuwiran itong nangangahulugang “mahatulan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: upang
  rationale: Ipinagdurugtong nito ang talata sa naunang konteksto at pinananatili ang maaaring diwa ng layunin o bunga nang hindi ito labis na nililinaw.
- source_word: κριθῶσιν
  choice: mahatulan
  rationale: Pinananatili ng pasibong anyong ito ang pangunahing hudisyal na diwa ng κρίνω. Bagaman salungat ang kahihinatnan sa konteksto, hindi tahasang ginawang ‘maparusahan’ ang pandiwa sa pangunahing teksto.
- source_word: πάντες
  choice: ang lahat
  rationale: Tuwirang katumbas ito ng panlahatang saklaw ng πάντες at natural na sinusundan ng sugnay na naglalarawan kung sino sila.
- source_word: οἱ μὴ πιστεύσαντες
  choice: ng hindi naniwala
  rationale: Ang artikulo at participle ay tumutukoy sa mga taong hindi naniwala. Ang ‘naniwala’ ay natural sa Filipino kapag ang layon ay ‘ang katotohanan.’
- source_word: τῇ ἀληθείᾳ
  choice: sa katotohanan
  rationale: Pinananatili nito ang tiyak na ‘katotohanan’ na tinutukoy sa konteksto, malamang ang katotohanan ng ebanghelyo, nang hindi iyon idinaragdag sa mismong teksto.
- source_word: ἀλλὰ
  choice: kundi
  rationale: Pagkatapos ng negatibong ‘hindi naniwala,’ natural na ipinahahayag ng ‘kundi’ ang matinding pagsalungat sa kasunod na pagpili.
- source_word: εὐδοκήσαντες
  choice: nalugod
  rationale: Ipinahahayag nito hindi lamang ang pagsang-ayon kundi ang kusang pagkatuwa o pagkahilig sa bagay na tinutukoy.
- source_word: τῇ ἀδικίᾳ
  choice: sa kalikuan
  rationale: Saklaw ng ‘kalikuan’ ang moral na kasamaan at kawalang-katuwiran ng ἀδικία, at angkop ito sa marangal ngunit madaling maunawaang rehistro ng talata.
theological_decisions:
- issue: Kung ang κριθῶσιν ay isasaling pangkalahatang ‘mahatulan’ o mas tiyak na ‘maparusahan bilang nagkasala’
  choice: mahatulan
  alternative: maparusahan bilang nagkasala
  rationale: Malinaw na masama ang hatol sa konteksto, ngunit ang κρίνω mismo ay pangunahing tumutukoy sa paghatol. Pinananatili ng pangunahing teksto ang lawak ng pandiwa at inilalagay sa talababa ang mas tahasang negatibong kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ang ‘nalugod sa kalikuan’ ay nagpapanatili ng moral at damdaming diin ng Griyego, samantalang ang ‘mahatulan’ ay hindi labis na nagpapasya sa eksaktong lakas ng hudisyal na pandiwa.
