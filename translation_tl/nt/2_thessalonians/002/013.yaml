id: 2TH.2.13
reference: 2 Thessalonians 2:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἡμεῖς δὲ ὀφείλομεν εὐχαριστεῖν τῷ θεῷ πάντοτε περὶ ὑμῶν, ἀδελφοὶ ἠγαπημένοι ὑπὸ κυρίου, ὅτι εἵλατο ὑμᾶς ὁ θεὸς ⸀ἀπαρχὴν εἰς σωτηρίαν ἐν ἁγιασμῷ πνεύματος καὶ πίστει ἀληθείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/013.yaml
  text: But we ought always to give thanks to God for you[a], brothers beloved by the Lord, because God chose you as firstfruits for salvation through sanctification by the Spirit and faith in the truth[b],
translation:
  language: tl
  text: Ngunit dapat kaming laging magpasalamat sa Diyos dahil sa inyo, mga kapatid[a] na minamahal ng Panginoon, sapagkat pinili kayo ng Diyos bilang unang bunga[b] para sa kaligtasan sa pamamagitan ng pagpapabanal ng Espiritu at pananampalataya sa katotohanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga kapatid” ay salin ng panlalaking pangmaramihang ἀδελφοί; maaaring kabilang sa tawag ang buong pamayanang sumasampalataya, kapwa lalaki at babae.
    reason: cultural_note
  - marker: b
    text: Sa ilang manuskrito, “mula pa sa pasimula para sa kaligtasan.” Sinusunod ng pangunahing teksto ang ἀπαρχήν (“bilang unang bunga”); ang ibang basa ay ἀπ’ ἀρχῆς (“mula pa sa pasimula”).
    reason: textual_variant
lexical_decisions:
- source_word: Ἡμεῖς δὲ
  choice: Ngunit ... kami
  rationale: Ipinahihiwatig ng δέ ang pagsalungat sa naunang paglalarawan, at pinananatili ng tahasang “kami” ang diin ng Ἡμεῖς.
- source_word: ὀφείλομεν
  choice: dapat
  rationale: Ipinapahayag nito ang nararapat na tungkulin nang hindi pinalalabis bilang sapilitang utos.
- source_word: εὐχαριστεῖν τῷ θεῷ πάντοτε περὶ ὑμῶν
  choice: laging magpasalamat sa Diyos dahil sa inyo
  rationale: Likas na modernong Tagalog para sa karaniwang pahayag ni Pablo ng pasasalamat, habang pinananatili ang palagiang aspekto at ang dahilan ng pasasalamat.
- source_word: ἀδελφοὶ
  choice: mga kapatid
  rationale: Ang “mga kapatid” ay likas sa Tagalog, hindi kinakailangang tukuyin ang kasarian, at angkop bilang tawag sa buong pamayanang sumasampalataya.
- source_word: ἠγαπημένοι ὑπὸ κυρίου
  choice: minamahal ng Panginoon
  rationale: Pinananatili ang pasibong diwa at init ng pahayag sa malinaw at dignified na Tagalog.
- source_word: εἵλατο
  choice: pinili
  rationale: Tuwirang ipinapahayag ang kahulugan ng αἱρέομαι rito nang hindi nagdaragdag ng isang partikular na doktrina tungkol sa pagpili.
- source_word: ἀπαρχὴν
  choice: bilang unang bunga
  rationale: Sinusunod ang tekstong SBLGNT at pinananatili ang kolektibong talinghaga ng unang bunga; inilalagay sa talababa ang mahalagang ibang basa.
- source_word: εἰς σωτηρίαν
  choice: para sa kaligtasan
  rationale: Malinaw na ipinapakita ang layunin o hantungan ng pagpili.
- source_word: ἐν ἁγιασμῷ πνεύματος
  choice: sa pamamagitan ng pagpapabanal ng Espiritu
  rationale: Ipinapakita ng “sa pamamagitan” ang paraang ipinahihiwatig ng ἐν; ang malaking titik sa “Espiritu” ay nagpapakita ng kontekstuwal na pagtukoy sa Banal na Espiritu, samantalang hindi dinaragdagan ang teksto ng salitang “Banal.”
- source_word: καὶ πίστει ἀληθείας
  choice: at pananampalataya sa katotohanan
  rationale: Likas na binabasa ang genitibong ἀληθείας bilang layon ng pananampalataya.
theological_decisions:
- issue: Kahulugan ng πνεύματος sa ἐν ἁγιασμῷ πνεύματος
  choice: ang Espiritu, na nauunawaan bilang Banal na Espiritu
  alternative: espiritu ng tao
  rationale: Sa kontekstong ito ng pagliligtas, mas natural na ang pagpapabanal ay kaugnay ng gawain ng Banal na Espiritu. Ipinahihiwatig ito sa malaking titik ngunit hindi idinaragdag ang “Banal” sa pangunahing teksto.
- issue: Diwa ng εἵλατο ὑμᾶς ὁ θεὸς
  choice: pinili kayo ng Diyos
  alternative: itinalaga kayo ng Diyos; kinuha kayo ng Diyos para sa sarili niya
  rationale: Pinananatili ang tuwirang diwa ng banal na pagpili nang hindi tinutukoy ang mekanismo, panahon, o denominasyonal na sistema ng pagpili.
- issue: Ugnayan ng ἁγιασμῷ at πνεύματος
  choice: pagpapabanal ng Espiritu
  alternative: pagpapabanal sa espiritu
  rationale: Pinananatili ng maikling parirala ang anyo ng genitibo at hindi lubusang isinasara ang posibleng ugnayan, bagaman pinapaboran ng malaking titik at konteksto ang Espiritu bilang kumikilos.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “mga kapatid” bilang natural at inklusibong tawag sa Tagalog. Inilipat ang mga marker sa mismong pariralang tinutukoy ng bawat talababa upang maiwasan ang kalituhan.
