translation:
  language: tl
  text: Ang pagdating niya ay ayon sa pagkilos ni Satanas, na may lahat ng kapangyarihan at mga tanda at kababalaghang may kaugnayan sa kasinungalingan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “na may lahat ng kapangyarihan at mga tanda at mga kababalaghan ng kasinungalingan.” Maaari ring isalin na “mga tanda at kababalaghang mapanlinlang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ
  choice: niya
  rationale: Tumutukoy ang panghalip na genitibo sa taong suwail sa naunang talata; likas sa Tagalog ang pag-uugnay na “Ang pagdating niya.”
- source_word: παρουσία
  choice: pagdating
  rationale: Sa kontekstong eskatolohikal, tumutukoy ito sa pagdating o pagpapakita ng isang tao, hindi lamang sa pananatili o presensiya.
- source_word: κατ’ ἐνέργειαν τοῦ Σατανᾶ
  choice: ayon sa pagkilos ni Satanas
  rationale: Pinananatili nito ang diwa ng paraan o pagkakatugma sa aktibong paggawa ni Satanas nang hindi labis na nililinaw ang eksaktong ugnayang sanhi.
- source_word: ἐν πάσῃ δυνάμει
  choice: na may buong kapangyarihan
  rationale: Ipinahahayag ng ἐν ang kasamang paraan o pagpapamalas, at ng πάσῃ ang malawak o ganap na saklaw.
- source_word: σημείοις
  choice: mga tanda
  rationale: Karaniwang katumbas ito ng mga pangyayaring nagsisilbing tanda o pagpapatunay.
- source_word: τέρασιν
  choice: mga kababalaghan
  rationale: Natural at marangal na katumbas para sa mga pambihirang pangyayaring pumupukaw ng pagkamangha.
- source_word: ψεύδους
  choice: mapanlinlang
  rationale: Ipinakikitang ang mga pagpapamalas ay kaugnay ng kasinungalingan o panlilinlang, nang hindi ipinapasyang pawang huwad na pandaraya lamang ang mga ito.
theological_decisions:
- issue: Likas ng satanikong kapangyarihan, mga tanda, at mga kababalaghan
  choice: Inilalarawan ang mga ito bilang mapanlinlang o kaugnay ng kasinungalingan, nang hindi tinutukoy kung pawang huwad lamang o tunay na sobrenatural ang mga pangyayari.
  alternative: Isalin bilang “mga huwad na kababalaghan,” na maaaring magpahiwatig na pakitang-tao lamang ang lahat.
  rationale: Hindi ganap na nilulutas ng genitibong ψεύδους ang likas na metafisikal ng mga pangyayari; mas ligtas panatilihin ang tensiyon sa teksto.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “kababalaghan” sa halip na mas kolokyal na “himala” upang mapanatili ang pagkakaiba ng δύναμις, σημεῖα, at τέρατα. Inilagay ang talababa pagkatapos ng pariralang binibigyang-linaw.
