  naturalness: Malinaw at angkop sa modernong Filipino ang pangkalahatang rehistro. Gayunman, ang “mga kababalaghang nagsisinungaling” sa talababa ay hindi likas at maaaring magmungkahi na literal na nagsasalita ang mga kababalaghan. Ang “may kaugnayan sa kasinungalingan” ay mas natural at maingat.
