  text: And now you know what is restraining him[b][a], so that he may be revealed in his own time.
translation:
  language: tl
  text: At ngayon ay alam ninyo kung ano ang pumipigil sa kanya[a], upang mahayag siya sa sarili niyang panahon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kung ano ang humahadlang sa kanya.” Walang kasariang anyo ang ekspresyon sa Griyego at hindi nito tinutukoy rito ang puwersang pumipigil.
    reason: lexical_alternative
  - marker: b
    text: O “sa panahong itinakda para sa kanya.” Maaaring tumukoy ang salitang Griyego sa angkop o itinakdang panahon.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ κατέχον
  choice: kung ano ang pumipigil sa kanya
  rationale: Pinananatili nito ang walang-kasariang anyo ng Griyego at hindi tinutukoy kung ano o sino ang pumipigil. Likas din itong pakinggan sa makabagong Tagalog.
- source_word: οἴδατε
  choice: alam na ninyo
  rationale: Tuwirang salin ito ng pandiwang may kasalukuyang diwa at nagpapahiwatig na alam na ito ng mga mambabasa dahil sa naunang pagtuturo.
- source_word: νῦν
  choice: ngayon
  rationale: Payak at natural na katumbas ng temporal na pang-abay.
- source_word: εἰς τὸ ἀποκαλυφθῆναι αὐτόν
  choice: upang mahayag siya
  rationale: Ipinapahayag ng pariralang ito ang layunin o kinalabasan nang hindi dinaragdagan ang pagkakakilanlan ng lalaking tinutukoy.
- source_word: ἐν τῷ ἑαυτοῦ καιρῷ
  choice: sa sarili niyang panahon
  rationale: Pinananatili ang reflexive na diwa ng ἑαυτοῦ at ang pagiging bukas ng καιρός sa kahulugang sariling, angkop, o itinakdang panahon.
theological_decisions:
- issue: Pagkakakilanlan ng pumipigil
  choice: Isinalin nang neutral bilang “kung ano ang pumipigil sa kanya.”
  alternative: Tukuyin ito bilang pamahalaang Romano, Banal na Espiritu, isang anghelikong kapangyarihan, o pasiya/probidensiya ng Diyos.
  rationale: Hindi kinikilala ng talata ang pumipigil, at walang-kasarian ang τὸ κατέχον. Kaya hindi dapat lutasin sa salin ang matagal nang pinagtatalunang pagkakakilanlan nito.
- issue: Diwa ng καιρός sa kontekstong eskatolohikal
  choice: “sa sarili niyang panahon”
  alternative: “sa panahong itinakda para sa kanya” o “sa tamang panahon”
  rationale: Maaaring magpahiwatig ang καιρός ng angkop o itinakdang panahon, ngunit hindi kailangang gawing tahasan iyon sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “ninyo” para sa maramihang kausap at iniwasan ang anumang katawagang magpapakilala sa hindi pinangalanang pumipigil.
