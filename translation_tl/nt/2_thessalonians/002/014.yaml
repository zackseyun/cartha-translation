base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/014.yaml
  text: to which he called you through our gospel[b][a], for obtaining the glory of our Lord Jesus the Messiah.
translation:
  language: tl
  text: Para rito, tinawag niya kayo sa pamamagitan ng aming ebanghelyo, upang makamit ninyo ang kaluwalhatian[a] ng ating Panginoong Jesus na Mesiyas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang “upang makamit ninyo ang kaluwalhatian” bilang “upang mapasainyo ang kaluwalhatian” o “upang makibahagi kayo sa kaluwalhatian.”
    reason: lexical_alternative
  - marker: b
    text: O, ayon sa tradisyonal na katawagan, “Jesus Cristo.”
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς ὃ
  choice: Dito
  rationale: Tumutukoy ito pabalik sa pagliligtas at pagpapabanal sa naunang talata. Likas sa Tagalog ang “Dito” at hindi nito labis na nililimitahan ang tinutukoy.
- source_word: ἐκάλεσεν ὑμᾶς
  choice: niya kayo tinawag
  rationale: Pinananatili ng “tinawag” ang karaniwang gamit ni Pablo nang hindi ipinapakahulugan kung ang tawag ay di-matatanggihan o isa lamang paanyaya.
- source_word: διὰ τοῦ εὐαγγελίου ἡμῶν
  choice: sa pamamagitan ng ebanghelyong ipinangaral namin
  rationale: Ipinahahayag ng “sa pamamagitan ng” ang gamit na instrumental ng διά. Nililinaw ng “ipinangaral namin” na ang “aming ebanghelyo” ay ang ebanghelyong inihatid ng mga apostol, hindi ibang ebanghelyong pag-aari nila.
- source_word: εἰς περιποίησιν
  choice: upang makamtan ninyo
  rationale: Ipinakikita ng “upang” ang layunin, at ng “makamtan” ang saklaw ng περιποίησις bilang pagtatamo o pagkakamit. Ang “ninyo” ay ginawang tahasan upang maging likas sa Tagalog, bagaman ipinahihiwatig lamang ito sa Griyego.
- source_word: δόξης
  choice: ang kaluwalhatian
  rationale: Ang “kaluwalhatian” ang natural at matatag na katumbas ng δόξα sa kontekstong eskatolohikal.
- source_word: τοῦ κυρίου ἡμῶν
  choice: ng ating Panginoon
  rationale: Pinananatili ang κύριος bilang “Panginoon” at ang inclusive na unang panauhang maramihan bilang “ating.”
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus na Mesiyas
  rationale: Isinasalin ang Χριστός ayon sa kahulugan nitong titulo. Ang “na Mesiyas” ay malinaw at idiomatikong Tagalog para sa “Jesus the Messiah.”
theological_decisions:
- issue: Kalikasan ng pagtawag ng Diyos
  choice: tinawag
  alternative: mabisang tinawag; inanyayahan
  rationale: Hindi dinaragdagan ng salin ang teksto ng isang tiyak na sistematikong paliwanag tungkol sa tawag, at hindi rin nito pinahihina ang bigat ng salvific na gamit ni Pablo.
- issue: Kahulugan ng περιποίησις kaugnay ng kaluwalhatian
  choice: makamtan ninyo ang kaluwalhatian
  alternative: mapasainyo ang kaluwalhatian; makibahagi kayo sa kaluwalhatian
  rationale: Pinananatili ng “makamtan” ang pangunahing ideya ng pagtatamo, habang itinatala sa talababa ang tunay na lawak ng maaaring kahulugan.
- issue: Pagpapakahulugan sa genitibong τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: kaluwalhatian ng ating Panginoong Jesus na Mesiyas
  alternative: kaluwalhatiang ibinibigay ng ating Panginoong Jesus na Mesiyas
  rationale: Pinananatili ang genitibong konstruksyon at ang posibilidad na tumukoy ito sa kaluwalhatiang taglay ng Panginoon at/o sa pakikibahagi rito, sa halip na tukuyin nang lampas sa sinabi ng teksto.
- issue: Pagkasalin ng Χριστοῦ
  choice: Mesiyas
  alternative: Cristo
  rationale: Ang Χριστός ay nananatiling makabuluhang titulo rito; inilalagay sa talababa ang tradisyonal na anyong “Cristo.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “ebanghelyong ipinangaral namin” sa halip na literal na “aming ebanghelyo” upang maiwasan ang maling pahiwatig na ibang ebanghelyo ito, habang pinananatili ang instrumental na ugnayan. Magkasunod ang [a][b] sa hulihan sapagkat kapwa tumutukoy ang mga talababa sa mga pariralang nasa pangwakas na sugnay.
