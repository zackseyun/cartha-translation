  naturalness: Likas at marangal sa modernong Filipino ang “Para rito, tinawag niya kayo...” at “upang makamit ninyo.” Inililipat ang mga tanda ng talababa sa mismong mga pariralang tinutukoy upang maging malinaw ang mga angkla.
  terminology: Pinananatili ang “ebanghelyo,” “kaluwalhatian,” “Panginoon,” at “Mesiyas.” Ang “Jesus na Mesiyas” ay idiomatikong Tagalog at ipinahihiwatig ang tituladong gamit ng Χριστός; ang “Jesus Cristo” ay naaangkop na tradisyonal na alternatibo sa talababa.
