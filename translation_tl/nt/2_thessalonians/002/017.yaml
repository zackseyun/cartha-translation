translation:
  language: tl
  text: palakasin ang inyong mga puso[a] at patatagin kayo[b] sa bawat mabuting gawa at salita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “aliwin ang inyong mga puso.” Ang παρακαλέσαι ay maaari ring magpahiwatig ng pagbibigay-sigla o paghikayat.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “gawin kayong matatag” o “panatilihin kayong matibay” sa bawat mabuting gawa at salita.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλέσαι
  choice: palakasin
  rationale: Sa konteksto ng panalangin at ng “walang hanggang pagpapalakas-loob” sa talata 16, ipinahahayag nito ang pagpapatibay ng kalooban nang hindi nililimitahan sa pag-aliw o pagpapayo lamang.
- source_word: καρδίας
  choice: mga puso
  rationale: Pinananatili ang biblikal na larawan ng puso bilang kaloob-looban ng tao, hindi lamang damdamin o isip.
- source_word: στηρίξαι
  choice: patatagin
  rationale: Tumpak na ipinahahayag ang paggawa sa isang tao na matatag o matibay; natural din ito sa Filipino sa konteksto ng mabuting pamumuhay.
- source_word: ἐν παντὶ
  choice: sa bawat
  rationale: Ipinahahayag ang saklaw kung saan sila patatatagin.
- source_word: ἔργῳ
  choice: gawa
  rationale: Karaniwan at tuwirang katumbas ng ἔργον, at natural na ipinapares sa “salita.”
- source_word: λόγῳ
  choice: salita
  rationale: Tumutukoy rito sa sinasabi o pananalita, na nakahanay sa “gawa.”
- source_word: ἀγαθῷ
  choice: mabuting
  rationale: Ang pang-uri ay makabuluhang inilalapat sa parehong “gawa” at “salita.”
- source_word: ὑμῶν
  choice: inyong / kayo
  rationale: Ang “inyong” ay tuwirang kaugnay ng “mga puso”; ang “kayo” pagkatapos ng ikalawang pandiwa ay likas na paglilinaw sa Filipino na ang mga taong kausap ang patatatagin.
- source_word: καὶ
  choice: at
  rationale: Tuwirang nag-uugnay sa dalawang kahilingan at sa dalawang pangngalan.
theological_decisions:
- issue: Kung isasalin ang καρδία sa mas interpretatibong sikolohikal na katawagan
  choice: mga puso
  alternative: kaloob-looban; mga isip
  rationale: Pinananatili nito ang malawak na biblikal na metapora at hindi ito ipinapakahulugan bilang damdamin o pag-iisip lamang.
- issue: Kung ang στηρίξαι ay isasalin bilang pagpapalakas o pagpapatatag
  choice: patatagin
  alternative: palakasin; itatag
  rationale: Mas tuwirang pinananatili ng “patatagin” ang diwa ng paggawa nilang matibay, habang ang unang pandiwa ay isinaling “palakasin” upang maipakita ang pagkakaiba ng dalawang kilos.
- issue: Kung ang panghalip na layon ng στηρίξαι ay dapat gawing tahasan
  choice: patatagin kayo
  alternative: patatagin ang inyong mga puso
  rationale: Sa Griyego, maaaring maunawaan na ang “mga puso” ang layon ng parehong pandiwa, ngunit natural at malamang ding saklaw ng pagpapatatag ang mga taong kausap. Ang “kayo” ay malinaw at likas sa Filipino nang hindi nililimitahan ang pagpapatatag sa emosyon lamang.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang biblikal na “mga puso,” ngunit gumamit ng likas na “palakasin” at “patatagin.” Ang lahat ng talababa ay may katumbas na pananda sa pangunahing teksto.
