id: 2TH.2.2
reference: 2 Thessalonians 2:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰς τὸ μὴ ταχέως σαλευθῆναι ὑμᾶς ἀπὸ τοῦ νοὸς ⸀μηδὲ θροεῖσθαι μήτε διὰ πνεύματος μήτε διὰ λόγου μήτε δι’ ἐπιστολῆς ὡς δι’ ἡμῶν, ὡς ὅτι ἐνέστηκεν ἡ ἡμέρα τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/002.yaml
  text: that you not be quickly shaken from your mind or alarmed[a], either by a spirit or by a message or by a letter as if from us[b], to the effect that the day of the Lord has come.
translation:
  language: tl
  text: na huwag kayong agad matinag sa inyong pag-iisip o mabahala sa pamamagitan man ng isang espiritu, mensahe, o liham—na diumano’y mula sa amin—na nagsasabing dumating na ang araw ng Panginoon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταχέως
  choice: agad
  rationale: Likas itong pang-abay sa Filipino at malinaw na tumutukoy sa mabilis na pagkagambala, hindi sa isang pangyayaring malapit nang maganap.
- source_word: σαλευθῆναι
  choice: matinag
  rationale: Pinananatili nito ang larawang matalinghaga ng pagyanig o pagkawala ng katatagan.
- source_word: ἀπὸ τοῦ νοὸς
  choice: ang inyong isip
  rationale: Natural sa Filipino ang buong pariralang “matinag ang inyong isip.” Naipapahayag nito ang pagkagulo ng dating matatag na pag-iisip nang hindi nililimitahan ang νοῦς sa talino lamang.
- source_word: θροεῖσθαι
  choice: mabahala
  rationale: Ipinahihiwatig nito ang pagkabalisa o pagkaalarma nang hindi labis na pinatitindi bilang matinding takot.
- source_word: πνεύματος
  choice: isang espiritu
  rationale: Pinananatili ang literal at sadyang hindi tiyak na katawagan. Nasa talababa ang posibleng diwang isang espirituwal o propetikong pahayag.
- source_word: λόγου
  choice: isang mensahe
  rationale: Sa pagkakatambal nito sa espiritu at liham, malamang na tumutukoy ito sa ipinahayag o pasalitang mensahe; mas malinaw ito kaysa sa literal na “salita.”
- source_word: ἐπιστολῆς
  choice: isang liham
  rationale: Karaniwan at modernong katawagan sa nakasulat na pakikipagtalastasan.
- source_word: ὡς δι’ ἡμῶν
  choice: na diumano’y mula sa amin
  rationale: Natural na ipinahahayag nito ang pag-aangking ang liham ay nagmula kay Pablo at sa mga kasama niya, habang ipinakikita ng “diumano” na pinagdududahan ang pag-aangkin.
- source_word: ὡς ὅτι
  choice: na ang sinasabi ay
  rationale: Malinaw nitong ipinakikilala ang nilalaman ng ipinararating na pahayag nang hindi inuulit ang alanganing “na para bang.”
- source_word: ἐνέστηκεν
  choice: dumating na
  rationale: Naipahahayag ng ganap na pandiwa ang pagdating na may kasalukuyang bunga. Nasa talababa ang mas tuwirang alternatibong “narito na.”
- source_word: ἡμέρα τοῦ κυρίου
  choice: ang araw ng Panginoon
  rationale: Ito ang malinaw at nakaugaliang katawagan para sa eskatolohikal na araw, hindi sa lingguhang araw ng pagsamba.
theological_decisions:
- issue: Kahulugan ng ἐνέστηκεν sa pahayag tungkol sa araw ng Panginoon
  choice: dumating na
  alternative: narito na
  rationale: Saklaw ng Greek perfect ang pagdating at ang nagpatuloy na kalagayan ng pagiging presente. Malinaw sa pangunahing teksto ang pag-aangking nangyari na ang pagdating, habang pinananatili sa talababa ang kasalukuyang diin.
- issue: Kahulugan ng πνεύματος sa tatlong sinasabing pinagmulan
  choice: isang espiritu
  alternative: isang espirituwal na pahayag; isang propetikong kapahayagan
  rationale: Walang artikulo ang pangngalan at sa konteksto ay maaaring tumukoy sa isang inaangking espirituwal o propetikong kapahayagan, hindi kinakailangang tuwirang tukuyin ang Banal na Espiritu. Pinananatili ng pangunahing teksto ang leksikal na kalabuan.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “matinag ang inyong isip” upang mapanatili ang metapora nang hindi nagiging salitang-salita at di-likas. Ang “diumano’y” ay maikli at angkop sa pormal na salaysay; ang mga talababa ay nagpapanatili sa tunay na leksikal at eskatolohikal na kalabuan.
