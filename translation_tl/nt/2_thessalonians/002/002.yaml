  verdict: revise
  source_fidelity: 'Tumpak ang mahahalagang katumbas: ang mabilis na pagkayanig/pagkabalisa, ang tatlong posibleng pinagmulan, at ang pag-aangking dumating na ang araw ng Panginoon. Gayunman, sa kasalukuyang ayos, ang “na diumano’y mula sa amin” ay pinakamalapit na kumakapit lamang sa “liham,” samantalang ang ὡς δι’ ἡμῶν ay maaaring sumaklaw sa espiritu, mensahe, o liham.'
  naturalness: Marangal at karaniwang modernong Filipino ang karamihan ng salin. Mas malinaw at mas natural ang “sa pamamagitan man ng” para sa διά at ang paglalagay ng pariralang “mula sa amin” bilang paningit upang malinaw na saklaw nito ang buong talaan.
  terminology: Ang “araw ng Panginoon,” “espiritu,” “mensahe,” at “liham” ay angkop. Nananatiling hindi tiyak ang “isang espiritu,” at maayos na pinangangalagaan ng talababa ang posibleng kahulugang propetiko o espirituwal na pahayag.
  issues:
  - severity: medium
    issue: Hindi malinaw ang saklaw ng “na diumano’y mula sa amin.”
    rationale: Dahil agad itong sumusunod sa “liham,” maaari itong basahin na ang liham lamang ang maling iniuugnay sa mga apostol. Sa Griyego, ang ὡς δι’ ἡμῶν ay sumusunod sa buong triad at maaaring tumukoy sa alinman sa mga sinasabing daluyan.
  - severity: low
    issue: Ang “dahil man sa” ay hindi gaanong tuwirang katumbas ng διά sa talaan ng mga daluyan.
    rationale: Ang “sa pamamagitan man ng” ay mas malinaw na nagpapahiwatig na ang espiritu, mensahe, o liham ay mga diumano’y pinagmulan o daluyan ng pahayag.
  revised_text: na huwag kayong agad matinag sa inyong pag-iisip o mabahala sa pamamagitan man ng isang espiritu, mensahe, o liham—na diumano’y mula sa amin—na nagsasabing dumating na ang araw ng Panginoon.
