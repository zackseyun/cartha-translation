reference: 2 Thessalonians 2:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: μή τις ὑμᾶς ἐξαπατήσῃ κατὰ μηδένα τρόπον· ὅτι ἐὰν μὴ ἔλθῃ ἡ ἀποστασία πρῶτον καὶ ἀποκαλυφθῇ ὁ ἄνθρωπος τῆς ⸀ἀνομίας, ὁ υἱὸς τῆς ἀπωλείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/003.yaml
  text: Let no one deceive you in any way[a], because that day will not come unless the rebellion comes first and the man of lawlessness is revealed[b], the son of destruction.
translation:
  language: tl
  text: Huwag kayong linlangin ninuman sa anumang paraan. Sapagkat hindi darating ang araw na iyon hangga’t hindi muna nagaganap ang paghihimagsik[a] at nahahayag ang taong suwail sa kautusan[b], ang anak ng kapahamakan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang pagtalikod” o “ang apostasiya.” Ang salitang Griyego ay maaaring tumukoy sa isang tiyak na paghihimagsik, na madalas unawain bilang pagtalikod sa pananampalataya.
    reason: alternative_reading
  - marker: b
    text: Sa ilang manuskrito, “ang taong makasalanan” sa halip na “ang taong suwail sa kautusan.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐξαπατήσῃ
  choice: padaya
  rationale: Likas sa modernong Tagalog ang “padaya” sa ganitong babala at malinaw nitong ipinahihiwatig ang pagpapahintulot na malinlang, nang hindi labis na pinatitindi ang puwersa ng unlapi.
- source_word: κατὰ μηδένα τρόπον
  choice: sa anumang paraan
  rationale: Tumpak at karaniwang idyoma ito para sa ganap na pagbabawal na malinlang sa alinmang paraan.
- source_word: ὅτι
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang babala; ang “sapagkat” ay malinaw at marangal ngunit nauunawaan pa rin sa kasalukuyang Tagalog.
- source_word: ἐὰν μὴ ἔλθῃ
  choice: hindi darating ... hangga’t hindi ... dumarating
  rationale: Ipinakikita ng ayos na ito na kailangang maunang mangyari ang kasunod na mga pangyayari. Isinupply ang “ang araw na iyon” mula sa agarang konteksto ng talata 2 upang maging buo at natural sa Tagalog.
- source_word: ἀποστασία
  choice: ang paghihimagsik
  rationale: Maaaring tumukoy ang salita sa pag-aalsa, paghihimagsik, o pagtalikod sa pananampalataya. Pinananatili ng “paghihimagsik” ang mas malawak na kahulugan nang hindi agad nilulutas ang pinagtatalunang eskatolohikal na pakahulugan.
- source_word: πρῶτον
  choice: muna
  rationale: Natural na ipinahahayag ng “muna” ang kinakailangang pagkakasunod-sunod ng mga pangyayari sa Tagalog.
- source_word: ἀποκαλυφθῇ
  choice: nahahayag
  rationale: Pinananatili nito ang pasibong diwa ng pagiging hayag o lantad ng tauhan at ang apokaliptikong himig ng pandiwa.
- source_word: ὁ ἄνθρωπος τῆς ἀνομίας
  choice: ang taong suwail sa kautusan
  rationale: Ipinahahayag nito ang ἀνομία bilang pagsuway o kawalan ng paggalang sa kautusan. Pinanatili ang isahang “tao” sapagkat isang tiyak na lalaking tauhan ang tinutukoy ng Griyego.
- source_word: ὁ υἱὸς τῆς ἀπωλείας
  choice: ang anak ng kapahamakan
  rationale: Pinananatili nito ang Semitikong anyo ng parirala at ang tunay na kalabuan kung ang tauhan ay inilalarawang kaugnay ng kapahamakan o nakatalaga rito.
theological_decisions:
- issue: Paglalagay ng ipinahihiwatig na simuno ng “hindi darating”
  choice: Isinupply sa teksto ang “ang araw na iyon.”
  alternative: 'Panatilihin ang elipsis: “sapagkat hangga’t hindi muna dumarating...”'
  rationale: Malinaw mula sa talata 2 na ang tinutukoy ay ang araw ng Panginoon. Kailangan ang pagsupply nito upang maging buo at hindi alanganin ang pangungusap sa Tagalog, nang walang idinaragdag na bagong interpretasyon.
- issue: Kahulugan ng ἀποστασία
  choice: ang paghihimagsik
  alternative: ang pagtalikod; ang apostasiya
  rationale: Malawak ang saklaw ng salita at maaari itong tumukoy sa paghihimagsik o sa relihiyosong pagtalikod. Ang pangunahing salin ay hindi nagpapasya nang labis sa pagitan ng mga pagbasa, at inilalahad sa talababa ang mahalagang alternatibo.
- issue: Tekstuwal na pagbasa sa τῆς ἀνομίας
  choice: 'Sinunod ang SBLGNT: “suwail sa kautusan.”'
  alternative: “makasalanan,” ayon sa variant na τῆς ἁμαρτίας
  rationale: Ang ibinigay na tekstong Griyego ay may ἀνομίας, kaya iyon ang batayan ng pangunahing teksto. Itinala sa talababa ang kilalang variant upang maging masusuri ang desisyong tekstuwal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “sapagkat” at “kapahamakan” upang mapanatili ang seryosong himig, samantalang iniwasan ang labis na makaluma o teknikal na pananalita. Inilagay ang bawat pananda ng talababa sa mismong salitang tinatalakay nito.
