  to: Huwag kayong linlangin ninuman sa anumang paraan. Sapagkat hindi darating ang araw na iyon hangga’t hindi muna nagaganap ang paghihimagsik[a] at nahahayag ang taong suwail sa kautusan[b], ang anak ng kapahamakan.
  rationale: Inayos ang unang pagbabawal upang maging mas likas at tuwiran sa modernong Tagalog. Inayos din ang pandiwang pangkondisyon upang malinaw na ang paghihimagsik at pagkahayag ng tao ay mga kailangang maunang pangyayari bago dumating ang ipinahihiwatig na araw. Hindi binago ang saklaw ng ἀποστασία, ang tekstuwal na pagbasa na ἀνομίας, o ang kalabuan ng “anak ng kapahamakan.”
