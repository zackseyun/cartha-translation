    issue: Hindi lubos na natural ang “Huwag kayong padaya kaninuman.”
    rationale: Mas tuwiran at idiomatiko sa modernong Tagalog ang “Huwag kayong linlangin ninuman,” habang pinananatili ang pagbabawal na walang sinuman ang manlinlang sa mga mambabasa.
  - severity: medium
    issue: Ang “hangga’t hindi muna dumarating” ay hindi pinakamalinaw na pagpapahayag ng kondisyon at pagkauna ng mga pangyayari.
    rationale: Ang dalawang aorist subjunctive sa Griyego ay nagtatakda ng mga pangyayaring kailangang maunang maganap. Ang “hangga’t hindi muna nagaganap ang paghihimagsik at nahahayag...” ay mas malinaw na naghahayag ng kundisyong ito nang hindi nagdaragdag ng interpretasyon.
