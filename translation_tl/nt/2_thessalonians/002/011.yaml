  text: καὶ διὰ τοῦτο ⸀πέμπει αὐτοῖς ὁ θεὸς ἐνέργειαν πλάνης εἰς τὸ πιστεῦσαι αὐτοὺς τῷ ψεύδει,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/011.yaml
  text: And because of this[a], God sends them a working of delusion so that they may believe the lie,
translation:
  language: tl
  text: At dahil dito, nagpapadala sa kanila ang Diyos ng isang pagkilos ng pagkalinlang[a], upang maniwala sila sa kasinungalingan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang impluwensiyang nagliligaw,” “isang pagkilos ng panlilinlang,” o, ayon sa tradisyon, “isang malakas na pagkalinlang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: dahil dito
  rationale: Malinaw nitong pinananatili ang ugnayang sanhi sa naunang pagtanggi sa katotohanan, sa halip na gawin lamang itong isang panghinuha gaya ng “kaya.”
- source_word: πέμπει
  choice: nagpapadala
  rationale: Tuwirang inilalahad ng Griyego na ang Diyos ang gumagawa ng pagpapadala. Ang pangkasalukuyang anyo ay natural na naipahahayag sa Filipino bilang “nagpapadala.”
- source_word: ἐνέργειαν πλάνης
  choice: isang impluwensiyang nagliligaw
  rationale: Natural ito sa makabagong Filipino at ipinahahayag ang aktibong bisa ng ἐνέργεια at ang panlilinlang o paglaligaw ng πλάνη. Hindi nito nililimitahan ang parirala sa panloob na maling paniniwala lamang; inilalahad sa talababa ang mas pormal na mga posibilidad.
- source_word: εἰς τὸ πιστεῦσαι
  choice: upang maniwala sila
  rationale: Pinananatili ng “upang” ang maaaring layunin o kinalabasang diwa ng konstruksiyon nang hindi pilit na pinagpapasiyahan kung alin ang nangingibabaw.
- source_word: τῷ ψεύδει
  choice: sa kasinungalingan
  rationale: Ang isahang pangngalang may pantukoy sa Griyego ay tumutukoy sa tiyak na kasinungalingang kaugnay ng konteksto. Sa Filipino, natural na naipahahayag ito bilang “sa kasinungalingan.”
theological_decisions:
- issue: Ang pagkilos ng Diyos sa paghatol at pagpapatigas
  choice: nagpapadala sa kanila ang Diyos
  alternative: hinahayaan ng Diyos na dumating sa kanila
  rationale: Tahasan sa Griyego na ang Diyos ang simuno ng πέμπει (“nagpapadala”). Hindi ito pinalalambot bilang pahintulot lamang, kaya nananatili ang tensiyon sa pagitan ng aktibong paghatol ng Diyos at ng naunang pagtanggi ng mga tao sa katotohanan.
- issue: Layunin o kinalabasan ng εἰς τὸ πιστεῦσαι
  choice: upang maniwala sila
  alternative: na ang kinalabasan ay maniwala sila
  rationale: Maaaring magpahiwatig ang konstruksiyon ng layunin o kinalabasan. Pinananatili ng “upang” ang teleolohikal na himig ngunit hindi na nagdaragdag ng paliwanag na mag-aalis sa likas na pag-igting ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “impluwensiyang nagliligaw” bilang mas natural kaysa sa literal ngunit mabigat na “pagkilos ng pagkaligaw,” habang pinananatili sa talababa ang anyong mas lantad ang dalawang pangngalan sa Griyego.
