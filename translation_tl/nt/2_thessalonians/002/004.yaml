  rationale: Inayos ang salin ng σέβασμα upang malinaw na tumukoy sa anumang layon ng pagsamba, pinas natural ang pananalita ng pagpapakataas sa sarili, at tahasang ipinakita ang reflexive na “sarili” sa huling participial na parirala. Hindi binago ang saklaw ng ναός o ang pinag-aagawang puwersa ng anarthrous na θεός; kapwa nananatili ang mga alternatibo sa mga talababa.
