  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ ἀντικείμενος καὶ ὑπεραιρόμενος ἐπὶ πάντα λεγόμενον θεὸν ἢ σέβασμα, ὥστε αὐτὸν εἰς τὸν ναὸν τοῦ ⸀θεοῦ καθίσαι ἀποδεικνύντα ἑαυτὸν ὅτι ἔστιν θεός.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/004.yaml
  text: the one who opposes and exalts himself over every so-called god or object of worship[a], so that he takes his seat in the temple of God[b], displaying himself as being God.
translation:
  language: tl
  text: ang kumakalaban at nagpapakataas sa sarili nang higit sa bawat tinatawag na diyos o anumang sinasamba, anupat umuupo siya sa templo ng Diyos[a] at ipinapakita ang kaniyang sarili bilang Diyos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “santuwaryo ng Diyos.”
    reason: lexical_alternative
  - marker: b
    text: O “ipinapakita ang kaniyang sarili bilang isang diyos.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀντικείμενος
  choice: siya na sumasalungat
  rationale: Pinananatili ang substantibong gamit ng kasalukuyang participle at ang patuloy na diwa ng pagsalungat, nang hindi ito ginagawang teknikal na titulo.
- source_word: ὑπεραιρόμενος
  choice: nagtataas ng sarili nang higit sa
  rationale: Likas sa modernong Tagalog at malinaw na pinananatili ang reflexive na diwa ng pagmamataas o pagpapakataas sa sarili.
- source_word: ἐπὶ πάντα λεγόμενον θεὸν
  choice: nang higit sa bawat tinatawag na diyos
  rationale: Ipinahihiwatig ng ἐπί kasunod ng pandiwa ng pagpapakataas ang pagiging nakahihigit; ang 'tinatawag na diyos' ay hindi nagpapatunay na tunay ngang diyos ang tinutukoy.
- source_word: σέβασμα
  choice: sinasamba
  rationale: Malinaw at natural na tumutukoy sa anumang pinag-uukulan ng relihiyosong pagsamba, hindi lamang sa isang diyos.
- source_word: ὥστε
  choice: kaya
  rationale: Natural na ipinapahayag sa Tagalog ang bunga o resulta ng naunang kilos.
- source_word: εἰς τὸν ναὸν τοῦ θεοῦ
  choice: sa templo ng Diyos
  rationale: Ang 'templo ng Diyos' ang pinakanatural at malinaw na salin; ang mas tiyak na 'santuwaryo' ay inilagay bilang alternatibo sa talababa.
- source_word: καθίσαι
  choice: uupo siya
  rationale: Ipinahahayag ang sadyang pag-upo sa lugar na iyon nang hindi nagdaragdag ng tahasang ideya ng pagluklok na wala sa salita mismo.
- source_word: ἀποδεικνύντα ἑαυτὸν
  choice: ipakikitang siya
  rationale: Pinananatili ang diwa ng hayagang pagpapakita o pagpapakilala sa sarili, nang hindi ito nililimitahan sa isang pasalitang pagpapahayag.
- source_word: ὅτι ἔστιν θεός
  choice: siya ay Diyos
  rationale: Sa konteksto ng pag-upo sa templo ng Diyos, ipinahahayag nito ang sukdulang pag-angkin sa pagka-Diyos; hindi nito pinatutunayang tunay na Diyos ang taong ito.
theological_decisions:
- issue: Kung ang hulíng θεός ay isasaling 'Diyos' o 'isang diyos'
  choice: Diyos
  alternative: isang diyos
  rationale: Ang pag-upo sa templo ng Diyos at pagpapakita sa sarili bilang Diyos ang pinakamalinaw na puwersa ng sukdulang mapamusong na pag-angkin sa konteksto. Gayunman, dahil walang artikulo ang θεός, pinananatili sa talababa ang posibleng saling 'isang diyos.'
- issue: Kung ang ναός ay isasaling 'templo' o mas tiyak na 'santuwaryo'
  choice: templo ng Diyos
  alternative: santuwaryo ng Diyos
  rationale: Mas malinaw at natural sa karaniwang mambabasa ang 'templo ng Diyos,' samantalang pinananatili sa talababa ang mas tiyak na leksikal na alternatibo nang hindi ipinapasya kung literal o matalinghaga ang tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang payak na 'siya na' at 'kaya uupo siya' para sa likas na daloy, habang pinanatili ang ambiguwidad ng θεός at ang saklaw ng ναός sa mga talababa.
