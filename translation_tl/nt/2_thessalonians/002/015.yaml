    rationale: Ang εἴτε ... εἴτε ay nagsasaad ng alternatibong paraan (“whether ... or”). Ang “sa pamamagitan man ng salita o ng sulat namin” ang karaniwang Filipino na mas malinaw na katumbas nito.
  revised_text: Kaya nga, mga kapatid[a], manindigan kayo at panghawakan ninyo ang mga tradisyong itinuro sa inyo, sa pamamagitan man ng salita o ng sulat namin.
