  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἄρα οὖν, ἀδελφοί, στήκετε, καὶ κρατεῖτε τὰς παραδόσεις ἃς ἐδιδάχθητε εἴτε διὰ λόγου εἴτε δι’ ἐπιστολῆς ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/015.yaml
  text: So then[a], brothers, stand firm and hold fast to the traditions that you were taught, whether by word or by our letter.
translation:
  language: tl
  text: Kaya nga, mga kapatid[a], manindigan kayo at panghawakan ninyo ang mga tradisyong itinuro sa inyo, sa pamamagitan man ng salita o ng sulat namin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, panlalaking pangmaramihan ang salita, ngunit malamang na ang buong kongregasyon—mga lalaki at mga babae—ang tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Kaya nga
  rationale: Likas na panapos na hinuha sa Filipino; pinananatili nito ang pinagsamang lakas ng dalawang partikulang nag-uugnay sa utos sa naunang pangangatwiran.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Ang karaniwang salitang Filipino na “mga kapatid” ay likas na tumutukoy sa mga kapatid sa pananampalataya at hindi kailangang lagyan ng kasarian, bagaman panlalaking pangmaramihan ang anyong Griyego.
- source_word: στήκετε
  choice: manindigan kayo
  rationale: Ipinahahayag nito ang patuloy na pagiging matatag at hindi matinag na hinihingi ng kasalukuyang pautos.
- source_word: κρατεῖτε
  choice: panghawakan ninyo
  rationale: Pinananatili nito ang diwa ng mahigpit at patuloy na pagkapit o pananatiling tapat sa tinanggap.
- source_word: τὰς παραδόσεις
  choice: ang mga tradisyon
  rationale: Tuwirang pinananatili ng “mga tradisyon” ang diwa ng mga bagay na ipinamana o ipinasa, sa halip na paliitin ito sa pangkalahatang “mga turo.”
- source_word: ἃς ἐδιδάχθητε
  choice: itinuro sa inyo
  rationale: Natural na pasibong pagpapahayag sa Filipino na itinatampok silang mga tumanggap ng itinurong tradisyon.
- source_word: εἴτε διὰ λόγου
  choice: maging sa pamamagitan ng salita
  rationale: Pinananatili ang literal na “salita” habang malinaw sa pagkakatambal nito sa sulat na tumutukoy ito sa pasalitang paghahatid.
- source_word: εἴτε δι’ ἐπιστολῆς ἡμῶν
  choice: o ng sulat namin
  rationale: Maikli at natural na katapat ng pasalitang paraan, at pinananatili ang pagmamay-aring ipinahahayag ng ἡμῶν.
theological_decisions:
- issue: Ang παράδοσις sa usapin ng apostolikong tradisyon
  choice: mga tradisyon
  alternative: mga turo; mga tagubilin
  rationale: Ang Griyego ay tumutukoy sa mga bagay na ipinasa at tahasang sumasaklaw rito sa pasalita at pasulat na pagtuturo. Hindi nito nilulutas ang mga pagtatalo ng mga denominasyon tungkol sa lawak o patuloy na awtoridad ng tradisyon.
- issue: Ang saklaw ng ἀδελφοί sa kongregasyon
  choice: mga kapatid
  alternative: mga kapatid na lalaki; mga kapatid na lalaki at babae
  rationale: Sa Filipino, ang “mga kapatid” ang tuwiran at likas na panawag sa buong komunidad, habang ipinapaliwanag sa talababa na panlalaki ang anyong Griyego ngunit malamang na saklaw ang buong kongregasyon.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “manindigan” at “panghawakan” upang mapanatili ang lakas ng magkatambal na pautos; iniwasan ang mas kolokyal na “kumapit” at ang mas mahina o mas malawak na “sundin.”
