  source_fidelity: Tumpak ang pagsasalin ng mga pangunahing utos at ng παράδοσεις bilang “mga tradisyon.” Gayunman, ang magkatambal na εἴτε ... εἴτε ay mas malinaw at mas tapat na maihahayag bilang “sa pamamagitan man ng ... o ng ...”; ang kasalukuyang “maging sa pamamagitan” ay hindi gaanong idiomatiko at bahagyang malabo ang saklaw nito.
  naturalness: Ang pangungusap ay pangkalahatang natural at marangal. Ang “manindigan kayo” at “panghawakan ninyo” ay mabuting magkatambal. Ang pagpapalit sa “maging sa pamamagitan ng” tungo sa “sa pamamagitan man ng” ay nagbibigay ng mas likas na modernong Filipino.
  terminology: Ang “mga kapatid,” “mga tradisyon,” at “sulat namin” ay angkop. Pinananatili ng talababa ang impormasyon tungkol sa panlalaking anyong Griyego nang hindi binabago ang likas na saklaw ng “mga kapatid” sa Filipino.
  issues:
