id: 2TH.2.1
reference: 2 Thessalonians 2:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἐρωτῶμεν δὲ ὑμᾶς, ἀδελφοί, ὑπὲρ τῆς παρουσίας τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ καὶ ἡμῶν ἐπισυναγωγῆς ἐπ’ αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/001.yaml
  text: We ask you[a], brothers, concerning the coming of our Lord Jesus the Messiah and our gathering together to him[b],
translation:
  language: tl
  text: 'Hinihiling namin sa inyo, mga kapatid[b], tungkol sa pagdating ng ating Panginoong Jesu-Cristo[a] at sa pagtitipon natin sa kaniya:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Cristo” ay isang titulong nangangahulugang “Mesiyas.”
    reason: lexical_alternative
  - marker: b
    text: Panlalaki ang anyong Griyego ng katawagang isinaling “mga kapatid,” ngunit sa konteksto ay malamang na ang buong komunidad ng mga mananampalataya ang kinakausap ni Pablo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐρωτῶμεν
  choice: Hinihiling namin sa inyo
  rationale: Nagpapakilala ito ng magalang at pastoral na pakiusap, hindi ng tuwirang utos. Likas sa modernong Filipino ang pariralang ito.
- source_word: δὲ
  choice: hindi tahasang isinalin
  rationale: Palatandaan ito ng paglipat sa kaugnay na paksa. Sapat na ang daloy ng pangungusap sa Filipino, at ang tahasang “ngayon” ay maaaring maling magpahiwatig ng panahon.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Ang “mga kapatid” ay likas na katawagan sa Filipino at maaaring tumukoy sa buong komunidad, bagaman panlalaki ang anyong Griyego.
- source_word: ὑπὲρ
  choice: tungkol sa
  rationale: Ipinakikilala nito ang paksang tinatalakay at hindi ang benepaktibong kahulugang “para sa.”
- source_word: παρουσίας
  choice: pagdating
  rationale: Sa kontekstong eskatolohikal, tumutukoy ang παρουσία sa darating na pagpapakita o pagdating ni Jesus; malinaw at karaniwan ang “pagdating.”
- source_word: κυρίου
  choice: Panginoon
  rationale: Pinananatili nito ang titulo ng kapangyarihan at ang kinikilalang teolohikal na gamit sa Bagong Tipan.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesu-Cristo
  rationale: Sa kasalukuyang Filipino, ang “Cristo” ay ang kinagawiang anyo ng τίτulong nangangahulugang Mesiyas at natural itong nakakabit sa pangalang Jesus bilang “Jesu-Cristo.” Nililinaw sa talababa ang kahulugan ng titulo.
- source_word: ἐπισυναγωγῆς
  choice: pagtitipon
  rationale: Ipinahahayag nito ang pagsasama-sama ng mga mananampalataya nang hindi nagdaragdag ng institusyonal na kahulugan.
- source_word: ἐπ’ αὐτόν
  choice: sa kaniya
  rationale: Ipinahahayag nito ang direksiyon o paglapit patungo kay Cristo sa natural na Filipino.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστοῦ bilang kristolohikal na titulo
  choice: Cristo, na ipinaliliwanag bilang “Mesiyas”
  alternative: Mesiyas
  rationale: Ang “Cristo” ay likas at kinikilalang anyo ng titulong Χριστός sa Filipino, habang pinananatili ng talababa ang tunay na kahulugan nitong “Mesiyas” at iniiwasang ituring lamang bilang apelyido.
- issue: Saklaw ng ἀδελφοί
  choice: mga kapatid
  alternative: mga kapatid na lalaki at babae
  rationale: Hindi kailangang magtakda ng kasarian ang likas na salitang Filipino na “kapatid.” Nililinaw ng talababa na panlalaki ang anyo ni Pablo ngunit malamang na buong komunidad ang kinakausap.
- issue: Ugnayan ng pagdating at ng pagtitipon
  choice: Pinanatiling magkatugma ngunit hindi ipinaliwanag ang dalawang bagay
  alternative: ang pagtitipon natin sa panahon ng kaniyang pagdating
  rationale: Pinag-uugnay lamang ng καί ang dalawang pariralang saklaw ng ὑπέρ; hindi tahasang itinatakda ng Griyego ang eksaktong temporal o lohikal na relasyon ng mga ito.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “Hinihiling namin” para sa banayad na pastoral na pakiusap, “mga kapatid” bilang natural at hindi pilit na katawagan, at “sa kaniya” sa halip na mas makalumang “sa Kaniya.” Ang tutuldok ay angkop dahil nagpapatuloy ang pangungusap sa susunod na talata.
