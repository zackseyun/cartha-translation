  text: Hindi ba ninyo naaalala na noong kasama pa ninyo ako, sinasabi ko sa inyo ang mga bagay na ito?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μνημονεύετε
  choice: naaalala
  rationale: Tumutukoy ang pandiwa sa pag-alaala ng mga mambabasa sa nauna nang itinuro; natural sa makabagong Tagalog ang “naaalala” sa retorikal na tanong.
- source_word: ἔτι ὢν πρὸς ὑμᾶς
  choice: noong kasama pa ninyo ako
  rationale: Ipinahahayag ng pariralang participyal ang panahong personal na naroon si Pablo sa piling nila; pinananatili ng “pa” ang temporal na diwa ng ἔτι.
- source_word: ταῦτα
  choice: ang mga bagay na ito
  rationale: Pinananatili nito ang pangmaramihang demonstratibo at malinaw na tumutukoy sa mga paksang kasalukuyang tinatalakay.
- source_word: ἔλεγον
  choice: lagi kong sinasabi
  rationale: Ang imperpektong anyo ay maaaring magpahiwatig ng nagpapatuloy o paulit-ulit na pagsasabi. Likas sa Tagalog ang “lagi kong sinasabi” at malinaw nitong ipinakikita ang paulit-ulit na pagtuturo.
- source_word: οὐ ... ὅτι
  choice: Hindi ba ninyo naaalala na ...?
  rationale: Likas na anyo ito ng retorikal na tanong sa Tagalog, at ipinakikilala ng “na” ang nilalaman ng dapat nilang maalala.
