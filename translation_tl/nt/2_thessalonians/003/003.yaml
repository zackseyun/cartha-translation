translation:
  language: tl
  text: Ngunit tapat ang Panginoon; palalakasin niya kayo at iingatan mula sa Masama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “mula sa kasamaan.” Ang Griyegong τοῦ πονηροῦ ay maaaring basahing panlalaki (“ang Masama”) o walang kasarian (“kasamaan”).'
    reason: alternative_reading
lexical_decisions:
- source_word: πιστὸς
  choice: tapat
  rationale: Likas at may bigat na paglalarawan sa pagiging mapagkakatiwalaan ng Panginoon, bilang kaibahan sa kawalan ng pananampalataya o katapatan ng ilang tao sa naunang talata.
- source_word: δέ
  choice: Ngunit
  rationale: Malinaw na ipinahahayag ang pagsalungat sa naunang pahayag na hindi lahat ay may pananampalataya.
- source_word: ὁ κύριος
  choice: ang Panginoon
  rationale: Pinananatili ang titulong κύριος nang hindi tahasang nililimitahan ang tinutukoy, bagaman sa kontekstong Paulino ay malamang na tumutukoy ito kay Jesus.
- source_word: στηρίξει
  choice: palalakasin
  rationale: Ipinahahayag ang pagpapatatag o pagpapalakas sa mga mananampalataya sa paraang natural sa modernong Tagalog.
- source_word: φυλάξει
  choice: iingatan
  rationale: Napananatili ang diwa ng aktibong pagbabantay at pag-iingat laban sa panganib.
- source_word: ἀπὸ
  choice: laban sa
  rationale: Sa pagsama sa pandiwang “iingatan,” ito ang pinakanatural na modernong Tagalog para sa pagprotekta mula sa kapangyarihan o banta ng kasunod na panganib.
- source_word: τοῦ πονηροῦ
  choice: ang Masama
  rationale: Pinipili sa pangunahing teksto ang personal na pagbasa, na karaniwan sa gamit ng Bagong Tipan, habang pinananatili sa talababa ang tunay na posibilidad na tumukoy ito sa kasamaan.
theological_decisions:
- issue: Tinutukoy ng τοῦ πονηροῦ
  choice: ang Masama
  alternative: kasamaan
  rationale: Maaaring unawain ang anyong Griyego bilang panlalaki, “ang Masama,” o walang kasarian, “kasamaan.” Ginamit sa pangunahing teksto ang personal na pagbasa ngunit hindi itinuring na tiyak; inilagay ang alternatibo sa talababa upang mapanatili ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang tuldok-kuwit upang malinaw na pag-ugnayin ang pahayag tungkol sa katapatan ng Panginoon at ang pangakong kasunod nito. Ginamit ang malaking titik sa “Masama” upang ipahiwatig ang personal na pagbasa nang hindi dinaragdagan ang teksto ng pangalang wala sa Griyego.
