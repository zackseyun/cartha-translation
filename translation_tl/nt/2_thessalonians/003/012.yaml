  text: τοῖς δὲ τοιούτοις παραγγέλλομεν καὶ παρακαλοῦμεν ⸂ἐν κυρίῳ Ἰησοῦ Χριστῷ⸃ ἵνα μετὰ ἡσυχίας ἐργαζόμενοι τὸν ἑαυτῶν ἄρτον ἐσθίωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/012.yaml
  text: To such people we command and urge in the Lord Jesus the Messiah that[a], working quietly[c][b], they should eat their own bread.
translation:
  language: tl
  text: Inuutusan at hinihimok namin ang gayong mga tao, sa Panginoong Jesus na Mesiyas, na magtrabaho nang tahimik at kumain ng sarili nilang tinapay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “sarili nilang tinapay” ay literal na tumutukoy sa sarili nilang tinapay; sa kontekstong ito, maaari rin itong tumukoy sa pagkain o sustentong bunga ng sarili nilang paggawa.
    reason: idiom_clarification
lexical_decisions:
- source_word: τοῖς δὲ τοιούτοις
  choice: Sa mga taong iyon
  rationale: Tumutukoy ito sa mga taong tamad at magulo ang pamumuhay na binanggit sa naunang talata. Hindi kailangang gawing mariing panalungat ang banayad na δέ sa Filipino.
- source_word: παραγγέλλομεν καὶ παρακαλοῦμεν
  choice: iniuutos at taimtim naming hinihimok
  rationale: 'Pinananatili ang dalawang magkaugnay ngunit magkaibang puwersa: awtoritatibong utos at masinsing pastoral na pakiusap.'
- source_word: ἐν κυρίῳ Ἰησοῦ Χριστῷ
  choice: sa Panginoong Jesus na Mesiyas
  rationale: Ang ἐν ay nagpapahiwatig ng saklaw at awtoridad ng Panginoong Jesus. Isinalin ang Χριστός bilang titulong “Mesiyas,” hindi bilang apelyido.
- source_word: μετὰ ἡσυχίας ἐργαζόμενοι
  choice: tahimik silang magtrabaho
  rationale: Likas sa modernong Tagalog at ipinahahayag ang mahinahon at hindi manggugulong paraan ng paggawa, bilang kabaligtaran ng magulong katamaran.
- source_word: τὸν ἑαυτῶν ἄρτον ἐσθίωσιν
  choice: kumain ng sarili nilang tinapay
  rationale: Pinananatili ang konkretong larawan ng “tinapay,” na sa konteksto ay tumutukoy rin sa pagkaing o ikabubuhay na bunga ng sariling paggawa.
theological_decisions:
- issue: Pagkakasalin sa Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Gumaganap dito ang Χριστός bilang titulo; malinaw itong ipinakikita ng “Jesus na Mesiyas.”
- issue: Puwersa ng tagubilin ng mga apostol
  choice: Panatilihin kapwa ang “iniuutos” at “taimtim na hinihimok”
  alternative: Pagsamahin bilang “pinapayuhan”
  rationale: Hindi dapat pahinain ang sinadyang pagsasama ng awtoridad at masinsing paghikayat.
- issue: Kahulugan ng ἐν κυρίῳ
  choice: sa Panginoong Jesus na Mesiyas
  alternative: sa pamamagitan ng Panginoong Jesus na Mesiyas
  rationale: Pinananatili ng “sa” ang posibleng diwa ng pagkilos sa saklaw, pakikipag-isa, o awtoridad ng Panginoon sa halip na limitahan ito sa purong instrumentong kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “taimtim na hinihimok” upang maipakita ang lakas ng παρακαλοῦμεν nang hindi gumagamit ng masyadong makalumang pananalita. Iningatan ang “tinapay” bilang konkretong biblikal na larawan at nilinaw sa talababa ang idyomatikong saklaw nito.
