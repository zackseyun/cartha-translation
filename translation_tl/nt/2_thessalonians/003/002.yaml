  text: καὶ ἵνα ῥυσθῶμεν ἀπὸ τῶν ἀτόπων καὶ πονηρῶν ἀνθρώπων, οὐ γὰρ πάντων ἡ πίστις.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/002.yaml
  text: and that we may be delivered from wicked and evil men[b][a], for not all have faith.
translation:
  language: tl
  text: at upang maligtas kami mula sa mga taong di-makatuwiran at masasama,[a] sapagkat hindi lahat ay may pananampalataya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga taong di-nararapat at masasama.” Ang salitang Griyego ay maaari ring mangahulugang “kakatwa” o “di-makatuwiran”; sa konteksto, inilalarawan nito ang mga kalabang mali ang asal.
    reason: lexical_alternative
  - marker: b
    text: O “sapagkat hindi lahat ay tapat.” Sa literal, “sapagkat hindi sa lahat ang pananampalataya.”
    reason: alternative_reading
lexical_decisions:
- source_word: ῥυσθῶμεν
  choice: mailigtas kami
  rationale: Ang aorist passive subjunctive kasunod ng ἵνα ay nagsasaad ng layunin. Likas sa Filipino ang “upang mailigtas kami” at hindi nito labis na tinutukoy kung paano magaganap ang pagliligtas.
- source_word: ἀτόπων
  choice: baluktot
  rationale: Ipinahihiwatig ng ἄτοπος ang pagiging di-nararapat, kakatwa, o di-makatuwiran; sa kontekstong moral at kasabay ng πονηρῶν, ipinapahayag ng “baluktot” ang maling asal nang hindi inuulit lamang ang “masama.”
- source_word: πονηρῶν
  choice: masasama
  rationale: Karaniwang salitang moral ito para sa masama o balakyot; malinaw at natural ang “masasama” sa modernong Filipino.
- source_word: ἀνθρώπων
  choice: mga lalaki
  rationale: Panlalaking maramihan ang anyong Griyego at malamang na tumutukoy sa mga partikular na lalaking sumasalungat sa konteksto, kaya pinanatili ang pagtukoy sa kasarian.
- source_word: πίστις
  choice: pananampalataya
  rationale: Pinakanatural dito ang kahulugang pananampalataya, bagaman maaari ring ipakahulugan ang salita bilang katapatan; pinanatili ang alternatibo sa talababa.
- source_word: οὐ γὰρ πάντων ἡ πίστις
  choice: sapagkat hindi lahat ay may pananampalataya
  rationale: Literal na eliptikal ang Griyego (“sapagkat hindi sa lahat ang pananampalataya”). Dinagdagan ng “ay may” upang maging likas sa Filipino nang hindi nagpapalakas sa pahayag.
theological_decisions:
- issue: Kahulugan ng πίστις sa eliptikal na pangungusap
  choice: pananampalataya
  alternative: hindi lahat ay tapat
  rationale: Sa konteksto ng pagsalungat sa gawaing apostoliko, mas malamang na tinutukoy ang kawalan ng pananampalataya. Gayunman, tunay na saklaw ng πίστις ang “katapatan,” kaya hindi inalis ang posibilidad na iyon.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “baluktot” upang maiba ang ἀτόπων sa πονηρῶν at mapanatili ang moral na diin; inilagay ang mga talababa kaagad sa kaugnay na parirala.
