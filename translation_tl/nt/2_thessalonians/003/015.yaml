  yaml_path: translation/nt/2_thessalonians/003/015.yaml
  text: And do not regard him as an enemy[b][a], but admonish him as a brother.
translation:
  language: tl
  text: At huwag ninyo siyang ituring na kaaway, kundi paalalahanan ninyo siya bilang isang kapatid.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kapatid” dito ay tumutukoy sa kapwa mananampalataya at maaaring gamitin para sa sinumang kabilang sa sambayanang Cristiano.
    reason: cultural_note
lexical_decisions:
- source_word: ἡγεῖσθε
  choice: ituring
  rationale: Ipinahahayag ng pandiwa ang pagkilala o pagtingin sa isang tao ayon sa isang tiyak na kategorya; natural at tuwiran sa modernong Tagalog ang “ituring.”
- source_word: ἐχθρὸν
  choice: kaaway
  rationale: Ito ang malinaw at karaniwang katumbas na nagpapanatili sa kategoryang tahasang itinatanggi ng talata.
- source_word: νουθετεῖτε
  choice: paalalahanan
  rationale: Sa kontekstong pandisiplina, ang salita ay tumutukoy sa mapagwastong pagbibigay-babala o payo. Ang “paalalahanan” ay natural, may sapat na puwersang mapagtuwid, at hindi labis na mabagsik.
- source_word: ἀδελφόν
  choice: isang kapatid
  rationale: Pinananatili nito ang larawang pampamilya at ang pagkilala sa taong iyon bilang kabilang pa rin sa sambayanan ng mga mananampalataya. Sa Tagalog, maaaring kumatawan ang “kapatid” sa lalaki o babae nang hindi binabago ang diwa.
- source_word: ὡς
  choice: bilang
  rationale: Sa ikalawang sugnay, malinaw na ipinakikita ng “bilang” ang katayuan o ugnayang dapat gumabay sa pagtutuwid.
- source_word: καὶ μὴ ... ἀλλὰ
  choice: At huwag ... kundi ...
  rationale: Pinananatili nito ang ugnay sa naunang pangungusap at ang matibay na pagsalungat ng dalawang paraan ng pakikitungo.
theological_decisions:
- issue: Saloobin sa mananampalatayang hindi sumusunod
  choice: Hindi siya dapat ituring na kaaway; dapat siyang ituwid habang kinikilalang kapatid.
  alternative: Maaaring unawain ito bilang pangkalahatang payo lamang tungkol sa alitang personal.
  rationale: Ipinakikita ng konteksto ng 2 Tesalonica 3:14–15 na usaping pandisiplina ito sa loob ng sambayanan. Gayunman, ang tawag na “kapatid” ay nagpapanatili sa ugnayang pampananampalataya at humahadlang sa pagtrato sa kaniya nang may poot.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “paalalahanan” upang pagsamahin ang mapagpastol at mapagtuwid na diwa ng νουθετεῖτε nang hindi maging sobrang teknikal.
