  text: The greeting is by my own hand—Paul's—which is a sign in every letter[a]; this is how I write.
translation:
  language: tl
  text: Ang pagbati ay isinulat ko sa sarili kong kamay—ako, si Pablo. Ito ang tanda sa bawat liham[a]; ganito ako sumusulat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Ang pagbati, na isinulat ko sa sarili kong kamay—ako, si Pablo—ay tanda sa bawat liham; ganito ako sumusulat.” Ang huling parirala ay maaari ring isalin nang mas literal: “sa ganitong paraan ako sumusulat” o “kaya ako sumusulat.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ ἀσπασμὸς
  choice: Ang pagbati
  rationale: Karaniwang tumutukoy ang ἀσπασμός sa pagbati sa isang liham. Likas at malinaw sa makabagong Filipino ang “pagbati.”
- source_word: τῇ ἐμῇ χειρὶ
  choice: ay isinulat ng sarili kong kamay
  rationale: Ang datibong parirala ay tumutukoy sa personal na sulat-kamay ni Pablo. Nilinaw ng pandiwang “isinulat” ang idyomatikong diwa sa Filipino nang hindi dinaragdagan ang layon ng teksto.
- source_word: Παύλου
  choice: akong si Pablo
  rationale: Ang genitibong Παύλου ay isang pansariling pagkakakilanlan kaugnay ng “sarili kong kamay.” Mas natural sa Filipino ang apposisyong “akong si Pablo” kaysa “ni Pablo,” dahil si Pablo mismo ang nagsasalita.
- source_word: ὅ ἐστιν σημεῖον
  choice: Ito ang tanda
  rationale: Tumutukoy ang ὅ sa personal na sulat-kamay o pagbating isinulat ni Pablo bilang palatandaang nagpapatunay sa liham. Ang “tanda” ay tuwiran at madaling maunawaan.
- source_word: ἐν πάσῃ ἐπιστολῇ
  choice: sa bawat liham
  rationale: Ang ἐπιστολή ay “liham,” at ang πάσῃ sa distributibong konteksto ay natural na isinasaling “bawat.”
- source_word: οὕτως γράφω
  choice: ganito ako sumulat
  rationale: 'Pinananatili nito ang payak at bahagyang malabong puwersa ng οὕτως: maaari itong tumukoy sa anyo ng sulat-kamay o sa mismong paraan ng pagsulat ng pormulang ito.'
theological_decisions:
- issue: Puwersa ng pormula tungkol sa sariling sulat-kamay ni Pablo
  choice: Inilahad ang personal na sulat-kamay bilang tanda sa bawat liham, nang hindi tahasang idinaragdag ang salitang “pagpapatunay.”
  alternative: Maaaring isalin nang mas interpretibo bilang “palatandaan ng pagiging tunay ng bawat liham.”
  rationale: Ipinahihiwatig ng konteksto ang autentikasyon, ngunit “tanda” lamang ang tahasang sinasabi ng σημεῖον. Iniingatan ng salin ang saklaw at tensiyon ng orihinal.
- issue: Saklaw ng οὕτως γράφω
  choice: “ganito ako sumulat”
  alternative: “ganito ang sulat-kamay ko” o “kaya ganito ako sumusulat”
  rationale: Hindi tiyak kung ang οὕτως ay pangunahing tumutukoy sa anyo ng sulat-kamay, sa pormula ng pagbati, o resumptibong “gayon.” Pinananatili ng pangunahing salin ang ambiguidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “liham” sa halip na mas teknikal na “epistola,” at hinati sa dalawang pangungusap upang maging natural habang pinananatili ang mga ugnayan sa Griyego.
