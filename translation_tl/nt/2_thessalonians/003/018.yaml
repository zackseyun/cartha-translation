lexical_decisions:
- source_word: χάρις
  choice: biyaya
  rationale: Karaniwang salitang Paulino para sa mapagbiyayang pabor at kaloob ng Diyos; likas at matatag na katumbas nito sa modernong Tagalog ang “biyaya.”
- source_word: κυρίου
  choice: Panginoon
  rationale: Pinananatili ang titulong nagpapahayag ng awtoridad at pagpipitagan kay Jesus.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesu-Cristo
  rationale: Ginamit ang kinikilalang anyong Tagalog sa pormulang basbas. Nananatili rito ang Χριστός bilang tradisyonal na titulong “Cristo,” na pamilyar at natural sa mga mambabasang Tagalog.
- source_word: μετὰ πάντων ὑμῶν
  choice: sumainyong lahat
  rationale: Likas at marangal na pormula ng basbas sa Tagalog na nagpapahiwatig ng “mapasainyo,” habang malinaw na saklaw ang buong kapulungan.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστοῦ sa pangwakas na basbas
  choice: Cristo
  alternative: Mesiyas
  rationale: Maaaring isalin ang Χριστός bilang “Mesiyas,” ngunit sa nakapirming pangwakas na pormulang ito ay natural at malawak na nauunawaan sa Tagalog ang “Jesu-Cristo.” Hindi nito itinatanggi ang kahulugan nitong titulo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang maikli at nakaugaliang anyong basbas na “Sumainyo,” at iniwasan ang mabigat o lipas na ayos ng pangungusap.
