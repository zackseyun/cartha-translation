base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/009.yaml
  text: not because we do not have the right, but in order to give ourselves to you as an example for you to imitate us.
translation:
  language: tl
  text: Hindi dahil wala kaming karapatan[a], kundi upang iharap namin sa inyo ang aming sarili bilang halimbawa[b], upang tularan ninyo kami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “awtoridad” o “kapangyarihan.” Sa kontekstong ito, ang tinutukoy ay lehitimong karapatan o pag-angkin.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “huwaran” o “padron.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ὅτι οὐκ
  choice: Hindi dahil wala kaming
  rationale: Pinananatili ang paglilinaw sa dahilan at ang retorikal na pagtutol, sa natural na ayos ng modernong Tagalog.
- source_word: ἐξουσίαν
  choice: karapatan
  rationale: Sa konteksto, tumutukoy ito sa lehitimong karapatang tumanggap ng suporta, hindi lamang sa kapangyarihan o pangkalahatang awtoridad.
- source_word: ἀλλ’ ἵνα
  choice: kundi upang
  rationale: Malinaw na ipinahahayag ang layunin bilang kasalungat ng naunang itinangging dahilan.
- source_word: ἑαυτοὺς
  choice: ang aming sarili
  rationale: Pinananatili ang reflexive na pagtukoy kina Pablo at sa kaniyang mga kasama; ang pang-isahang anyong 'sarili' ay likas sa pariralang Tagalog kahit maramihan ang tinutukoy.
- source_word: τύπον
  choice: halimbawa
  rationale: Tumutukoy sa huwaran ng asal na dapat tularan; 'halimbawa' ang pinakamalinaw at pinakanatural sa karaniwang mambabasa.
- source_word: δῶμεν
  choice: iharap namin
  rationale: Ang literal na 'ibigay ang aming sarili bilang halimbawa' ay posibleng magpahiwatig ng ibang diwa sa Tagalog. Ang 'iharap' ay natural na naghahatid ng diwang ilagay ang sarili sa harap nila bilang halimbawa.
- source_word: εἰς τὸ μιμεῖσθαι ἡμᾶς
  choice: tutularan ninyo
  rationale: Inihahatid nang tuwiran ang layuning tularan nila sina Pablo at ang kaniyang mga kasama, nang hindi inuulit ang panghalip na magiging mabigat sa Tagalog.
theological_decisions:
- issue: Saklaw ng ἐξουσίαν
  choice: Lehitimong karapatang tumanggap ng suporta
  alternative: Mas malawak na apostolikong awtoridad o kapangyarihan
  rationale: Ang agarang konteksto ay ang pagtatrabaho upang hindi maging pasanin sa iba. Kaya 'karapatan' ang angkop, habang ang talababa ay nagpapanatili sa mas malawak na leksikal na posibilidad.
- issue: Tinutukoy ng huwaran
  choice: Sina Pablo at ang kaniyang mga kasama mismo ang halimbawang tutularan
  alternative: Isang abstraktong tuntunin lamang ang huwaran
  rationale: Ang ἑαυτοὺς at ἡμᾶς ay tahasang tumutukoy sa mga nagsasalita, kaya hindi dapat alisin ang personal at sama-samang dimensiyon ng halimbawa.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at madaling maunawaan. Ginamit ang 'kundi upang' para sa malinaw na paghahayag ng layunin. Iniwasan ang literal ngunit maaaring malabong 'ibigay ang aming sarili,' at pinili ang 'iharap namin sa inyo ang aming sarili' upang mapanatili ang larawan ng Greek idiom sa natural na Tagalog.
