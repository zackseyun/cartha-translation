base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/007.yaml
  text: For you yourselves know how you ought to imitate us[a], because we did not behave disorderly among you.
translation:
  language: tl
  text: Sapagkat kayo mismo ay nakaaalam kung paano ninyo kami dapat tularan, dahil hindi kami namuhay nang walang kaayusan[a] sa piling ninyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, higit na tiyak sa kontekstong ito, “hindi kami naging tamad sa piling ninyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ
  choice: kayo mismo
  rationale: 'Pinananatili nito ang pagbibigay-diin ng masidhing panghalip: ang mga taga-Tesalonica mismo ang nakaaalam.'
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikilala ng γάρ ang paliwanag o batayan ng naunang tagubilin.
- source_word: οἴδατε
  choice: nakaaalam
  rationale: Bagaman anyong perpekto ang οἶδα, pangkasalukuyan ang karaniwang kahulugan nito rito.
- source_word: πῶς δεῖ μιμεῖσθαι ἡμᾶς
  choice: kung paano ninyo kami dapat tularan
  rationale: Likas sa modernong Tagalog ang ayos na ito at pinananatili ang paraan (πῶς), obligasyon (δεῖ), at personal na layon na “kami” (ἡμᾶς).
- source_word: ὅτι
  choice: dahil
  rationale: Ipinahahayag nito rito ang batayan kung bakit alam nila kung paano tutularan ang mga apostol.
- source_word: οὐκ ἠτακτήσαμεν
  choice: hindi kami namuhay nang walang kaayusan
  rationale: Sinasalamin nito ang malawak na diwa ng ἀτακτέω na kumilos o mamuhay nang magulo, walang disiplina, o lihis sa nararapat, nang hindi ito nililimitahan agad sa katamaran.
- source_word: ἐν ὑμῖν
  choice: sa piling ninyo
  rationale: Natural na ipinahahayag nito ang pamumuhay at pagkilos sa gitna ng komunidad ng mga taga-Tesalonica.
theological_decisions:
- issue: Saklaw ng kahulugan ng ἀτακτέω sa agarang konteksto
  choice: namuhay nang walang kaayusan
  alternative: naging tamad
  rationale: Malinaw na kabilang sa konteksto ng kabanata ang pagtangging magtrabaho, ngunit mas malawak ang leksikal na saklaw ng ἀτακτέω kaysa katamaran lamang. Pinananatili ng pangunahing teksto ang lawak na iyon, habang inilalagay sa talababa ang mas tiyak na pagbasa ayon sa konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kayo mismo” upang mapanatili ang diin, at “dapat tularan” bilang natural na pagpapahayag ng obligasyong taglay ng δεῖ.
