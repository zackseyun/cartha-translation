  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὐδὲ δωρεὰν ἄρτον ἐφάγομεν παρά τινος, ἀλλ’ ἐν κόπῳ καὶ μόχθῳ ⸂νυκτὸς καὶ ἡμέρας⸃ ἐργαζόμενοι πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/008.yaml
  text: nor did we eat bread from anyone free of charge[a], but with labor and hardship, working night and day so as not to burden any of you.
translation:
  language: tl
  text: Hindi rin kami kumain ng tinapay ng sinuman nang walang bayad[a]. Sa halip, nagtrabaho kami gabi't araw nang may matinding pagod at hirap upang hindi kami maging pabigat sa sinuman sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Hindi rin kami kumain ng tinapay ng sinuman nang libre.” Literal na “tinapay” ang Griyego, bagaman maaari itong tumukoy nang mas malawak sa pagkain o materyal na suporta.
    reason: lexical_alternative
lexical_decisions:
- source_word: δωρεὰν
  choice: nang walang bayad
  rationale: Ipinahahayag nito na hindi nila tinanggap ang pagkain bilang libre o walang kapalit; natural at malinaw ang parirala sa makabagong Tagalog.
- source_word: ἄρτον
  choice: tinapay
  rationale: Pinananatili ang literal at kongkretong larawan ng Griyego, bagaman maaari rin itong tumukoy nang mas malawak sa pagkain o materyal na suporta.
- source_word: παρά τινος
  choice: ng sinuman
  rationale: Sa likas na ayos ng Tagalog na 'kumain ng tinapay ng sinuman,' ipinahihiwatig nito ang pinagmulan o pagmamay-ari ng tinapay nang hindi dinaragdagan ang diwa.
- source_word: ἐν κόπῳ καὶ μόχθῳ
  choice: nang may matinding pagod at hirap
  rationale: Pinananatili ang pinagsamang diin ng dalawang halos magkasingkahulugang salita sa mabigat na pagsisikap at kahirapan.
- source_word: νυκτὸς καὶ ἡμέρας
  choice: gabi't araw
  rationale: Natural na idyomang Tagalog para sa patuloy na paggawa sa buong magdamag at maghapon.
- source_word: ἐργαζόμενοι
  choice: nagtrabaho kami
  rationale: Ginawang pandiwang may tahasang simuno upang maging malinaw at natural sa Tagalog habang nananatili ang paliwanag kung ano ang ginawa nina Pablo.
- source_word: πρὸς τὸ μὴ ἐπιβαρῆσαί
  choice: upang hindi kami maging pabigat
  rationale: Malinaw na ipinapakita ang layunin at ang diwang hindi pagpapataw ng materyal o pinansiyal na pasanin.
- source_word: τινα ὑμῶν
  choice: sa sinuman sa inyo
  rationale: 'Pinananatili ang distributibong diwa: wala ni isa sa mga mambabasa ang nais nilang pasanin.'
- source_word: οὐδὲ ... ἀλλ’
  choice: Hindi rin ... Sa halip
  rationale: Pinananatili ang mariing pagtutol sa pagitan ng hindi pagtanggap ng libreng pagkain at ng kanilang sariling masikap na pagtatrabaho.
