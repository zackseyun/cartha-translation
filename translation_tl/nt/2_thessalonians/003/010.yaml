  yaml_path: translation/nt/2_thessalonians/003/010.yaml
  text: 'For even when we were with you, we kept commanding you this: if anyone is not willing to work, neither let him eat.'
translation:
  language: tl
  text: 'Sapagkat kahit noong kasama namin kayo, ito ang lagi naming iniuutos sa inyo: kung may ayaw magtrabaho[a], huwag din siyang kumain.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Griyego ay tumutukoy sa taong ayaw magtrabaho, hindi sa taong hindi kayang magtrabaho.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari rin itong isalin: “huwag din siyang pakainin”; ngunit literal na ang pandiwa ay “kumain.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Sapagkat kahit
  rationale: Pinananatili ng “sapagkat” ang paliwanag na ugnayan ng γάρ sa naunang talata, at ng “kahit” ang diin ng καί.
- source_word: ὅτε ἦμεν πρὸς ὑμᾶς
  choice: noong kasama pa ninyo kami
  rationale: Likas na ipinapahayag sa modernong Tagalog ang pagiging kapiling nila noon; ipinakikita ng “pa” ang dating personal na presensiya nang hindi nagdaragdag ng bagong diwa.
- source_word: παρηγγέλλομεν
  choice: ipinag-uutos na namin
  rationale: Ang imperpektong anyo ay tumutukoy sa utos na ibinibigay na nila noong naroon sila. Ang “na” ay natural na naghahatid ng nagpapatuloy o dati nang umiiral na tagubilin nang hindi labis na iginigiit na paulit-ulit ito.
- source_word: τοῦτο … ὅτι
  choice: 'ito:'
  rationale: Ang “ito” ay tumuturo sa susunod na nilalaman ng utos, at natural itong ipinakikilala ng tutuldok sa Tagalog.
- source_word: εἴ τις
  choice: Kung may
  rationale: Karaniwang paraang Tagalog ito upang ipahayag ang pangkalahatan at di-tiyak na kondisyon na “kung may sinuman.”
- source_word: οὐ θέλει ἐργάζεσθαι
  choice: ayaw magtrabaho
  rationale: Ang θέλει ay tungkol sa kalooban o pagnanais. Malinaw at likas na ipinahahayag ng “ayaw” ang hindi pagkukusang magtrabaho, hindi ang kawalang-kakayahan.
- source_word: μηδὲ ἐσθιέτω
  choice: huwag din siyang kumain
  rationale: Pinananatili nito ang pangatlong panauhang isahan at ang puwersa ng pautos. Hindi ito ginawang “huwag ninyo siyang pakainin,” na magdaragdag ng tahasang tagaganap na wala sa Griyego.
theological_decisions:
- issue: Kung kawalang-kakayahan o kawalang-kusang magtrabaho ang tinutukoy
  choice: “Kung may ayaw magtrabaho”
  alternative: “Kung may hindi kayang magtrabaho”
  rationale: Ang θέλει ay tumutukoy sa pagkukusa o pagnanais, hindi sa kakayahan. Kaya hindi saklaw ng pahayag ang taong hindi makapagtrabaho.
- issue: Kung ang utos ay direktang huwag kumain o utos sa komunidad na huwag magpakain
  choice: “huwag din siyang kumain”
  alternative: “huwag din ninyo siyang pakainin”
  rationale: Ang ἐσθιέτω ay pangatlong panauhang isahang pautos ng “kumain.” Iniiwasan ng napiling salin ang pagdaragdag ng “ninyo” at ang pagpapalit ng pandiwa tungo sa “pakainin,” bagaman maaaring maunawaan sa konteksto ang pananagutan ng komunidad.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang pangkalahatang “kung may” at ang likas na singular na “siya.” Iniwasan ang mas legalistikong “sinuman” at ang mas mabigat na “tumangging magtrabaho,” sapagkat mas malakas iyon kaysa sa θέλει.
