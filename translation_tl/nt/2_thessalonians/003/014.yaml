  text: Εἰ δέ τις οὐχ ὑπακούει τῷ λόγῳ ἡμῶν διὰ τῆς ἐπιστολῆς, τοῦτον σημειοῦσθε, ⸀μὴ ⸀συναναμίγνυσθαι αὐτῷ, ἵνα ἐντραπῇ·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/014.yaml
  text: And if anyone does not obey our word through this letter[a], take note of that person; do not associate with him[d][c][b], so that he may be ashamed.
translation:
  language: tl
  text: At kung may hindi sumusunod sa sinabi namin sa pamamagitan ng liham na ito,[a] tandaan ninyo ang taong iyon,[b] at huwag kayong makisama sa kanya,[c] upang mahiya siya.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa liham na ito.” Maaaring tukuyin ng pariralang Griyego ang liham bilang paraan ng paghahatid ng tagubilin o ang kinaroroonan nito.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “markahan ninyo” o “bigyang-pansin ninyo.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “huwag kayong makihalubilo sa kanya.”
    reason: lexical_alternative
  - marker: d
    text: 'Ang layunin ay pagtutuwid: ihambing ang talata 15, kung saan dapat pa rin siyang paalalahanan “bilang kapatid.”'
    reason: cross_reference
lexical_decisions:
- source_word: ὑπακούει
  choice: sumusunod
  rationale: Ipinapahayag ng ὑπακούω ang pagsunod o pagtalima sa isang tagubilin. Natural at malinaw sa modernong Filipino ang “sumusunod” sa kontekstong ito.
- source_word: τῷ λόγῳ ἡμῶν
  choice: sa sinabi namin
  rationale: Ang λόγος ay tumutukoy rito sa apostolikong pahayag o tagubilin, hindi lamang sa isang hiwalay na salita. Mas natural ang “sa sinabi namin” kaysa sa literal na “sa aming salita.”
- source_word: διὰ τῆς ἐπιστολῆς
  choice: sa pamamagitan ng liham na ito
  rationale: Ang διά na may genitive ay nagpapahiwatig ng paraan o kasangkapan. Ang “na ito” ay nilinaw mula sa konteksto ng kasalukuyang liham, bagaman maaari ring unawain ang parirala bilang “sa liham na ito.”
- source_word: σημειοῦσθε
  choice: tandaan ninyo
  rationale: Ang middle imperative ay nag-uutos na kilalanin at bigyang-pansin ang taong hindi sumusunod. Ang “tandaan ninyo” ay malinaw at hindi nagdaragdag ng teknikal na prosesong hindi tahasang binanggit.
- source_word: τοῦτον
  choice: ang taong iyon
  rationale: Ginagawang malinaw ng pariralang ito ang tiyak na taong tinutukoy ng demonstrative.
- source_word: μὴ συναναμίγνυσθαι αὐτῷ
  choice: huwag kayong makisama sa kanya
  rationale: Ang συναναμίγνυμι ay tumutukoy sa pakikihalubilo o pakikisama. Ang “makisama” ay natural sa Filipino at nagpapanatili sa panlipunan at pangkomunidad na bigat ng utos.
- source_word: ἐντραπῇ
  choice: siya ay mapahiya
  rationale: Ang passive subjunctive ay nagpapahayag ng layuning makadama siya ng hiya. Pinananatili ng “mapahiya” ang lakas ng Griyego nang hindi ipinapalagay na ang kahihiyan ay pahirap lamang o wakas sa sarili nito.
- source_word: τις
  choice: may
  rationale: Sa kondisyunal na “kung may,” natural na naihahatid ang di-tiyak at pangkalahatang saklaw ng τις.
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Natural na panghalip sa Filipino para sa singular na taong tinutukoy; hindi nito kailangang tukuyin ang kasarian na hindi mahalaga sa diwa ng pangungusap.
theological_decisions:
- issue: Uri ng disiplinang ipinag-uutos ng μὴ συναναμίγνυσθαι αὐτῷ
  choice: Pag-iwas sa pakikisama bilang panukalang pandisiplina at pagtutuwid sa loob ng komunidad
  alternative: Pormal at lubos na ekskomunikasyon, o simpleng personal na pag-iwas na walang dimensiyong pangkomunidad
  rationale: Ipinapakita ng kasunod na talata na ang taong ito ay hindi dapat ituring na kaaway kundi paalalahanan bilang kapatid. Kaya pinananatili ng salin ang seryosong paglayo nang hindi nag-aangkat ng mas huling teknikal na kategoryang eklesyastikal.
- issue: Lakas at layunin ng ἐντραπῇ
  choice: Kahihiyang naglalayong magtuwid
  alternative: Pampublikong paghamak bilang layunin mismo
  rationale: Ang purpose clause at ang talata 15 ay nagbibigay ng kontekstong pandisiplina at remedial. Gayunman, hindi tahasang idinaragdag sa pangunahing teksto ang “magsisi,” sapagkat hindi iyon nakasaad sa pandiwa.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “sinabi namin” sa halip na mas literal ngunit hindi gaanong natural na “aming salita,” at “makisama” upang malinaw na ihatid ang sosyal at pangkomunidad na dimensiyon ng utos. Ang mga pananda ng talababa [a]–[d] ay inilagay mismo sa pangunahing teksto.
