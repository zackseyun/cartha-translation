base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/011.yaml
  text: For we hear that some among you are walking disorderly[a], doing no work at all[b], but meddling.
translation:
  language: tl
  text: Sapagkat nababalitaan naming may ilan sa inyo na namumuhay nang walang kaayusan[a]—walang ginagawang trabaho, kundi nakikialam.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “namumuhay nang tamad” o “namumuhay nang walang disiplina.” Ang salitang Griyego ay maaaring tumukoy sa asal na wala sa ayos o sa pagiging tamad na salungat sa inaasahan ng pamayanan.
    reason: lexical_alternative
  - marker: b
    text: 'May paglalaro sa mga salita sa Griyego: wala silang ginagawang trabaho, ngunit abala sila sa pakikialam.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούομεν
  choice: nababalitaan naming
  rationale: Ang pangkasalukuyang anyo ay nagpapahiwatig ng kasalukuyan o patuloy na ulat. Likas sa modernong Tagalog ang “nababalitaan naming” para sa impormasyong nakararating sa nagsasalita.
- source_word: γάρ
  choice: Sapagkat
  rationale: Ipinakikita nito na ang pangungusap ay nagbibigay ng dahilan o paliwanag sa naunang pahayag.
- source_word: τινας
  choice: may ilan
  rationale: Tumutukoy ito sa isang di-tiyak na bahagi ng kapulungan, hindi sa lahat.
- source_word: περιπατοῦντας
  choice: namumuhay
  rationale: Idyomatiko rito ang pandiwang Griyego para sa paraan ng pamumuhay o pagkilos. Mas malinaw at natural sa Tagalog ang “namumuhay” kaysa literal na “lumalakad.”
- source_word: ἐν ὑμῖν
  choice: sa inyo
  rationale: Ipinahihiwatig nitong ang mga tinutukoy ay nasa loob ng pamayanan ng mga mambabasa.
- source_word: ἀτάκτως
  choice: nang walang kaayusan
  rationale: Pinananatili nito ang malawak na diwa ng pagkilos na wala sa ayos o disiplina, nang hindi ito nililimitahan agad sa katamaran lamang.
- source_word: μηδὲν ἐργαζομένους
  choice: Wala silang ginagawang anumang trabaho
  rationale: 'Malinaw na naihahayag ang diin ng μηδέν: talagang wala silang ginagawang kapaki-pakinabang na gawain.'
- source_word: ἀλλὰ
  choice: sa halip
  rationale: Malinaw nitong ipinakikita ang matinding pagsalungat sa pagitan ng hindi pagtatrabaho at ng maling pagkaabala.
- source_word: περιεργαζομένους
  choice: nakikialam sila sa gawain ng iba
  rationale: Ipinahahayag nito sa kasalukuyang Tagalog ang diwa ng pakikialam o pagiging abala sa hindi sariling gawain. Bahagya ring naipadarama ang paglalaro sa mga salitang kaugnay ng ἐργάζομαι.
