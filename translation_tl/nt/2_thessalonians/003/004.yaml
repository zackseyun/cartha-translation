  text: And we have confidence in the Lord about you, that you are doing and will do what we command.
translation:
  language: tl
  text: At nagtitiwala kami sa Panginoon hinggil sa inyo, na ginagawa ninyo at gagawin ninyo ang mga ipinag-uutos namin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεποίθαμεν
  choice: nagtitiwala kami
  rationale: Likas at kasalukuyang Tagalog para sa perpektong anyong nagpapahayag ng matatag at nagpapatuloy na pagtitiwala.
- source_word: ἐν κυρίῳ
  choice: sa Panginoon
  rationale: Pinananatili ang batayan o saklaw ng pagtitiwala kay Cristo, hindi lamang pagtitiwala sa mga mambabasa.
- source_word: ἐφ’ ὑμᾶς
  choice: tungkol sa inyo
  rationale: Direktang inilalarawan na ang pagtitiwala sa Panginoon ay may kinalaman sa mga mambabasa, habang hindi pinapantay ito sa simpleng pagtitiwala sa kanila.
- source_word: παραγγέλλομεν
  choice: mga ipinag-uutos namin
  rationale: Ipinapakita ang awtoritatibong tagubilin ng pandiwa; ang pangmaramihang 'mga' ay natural sa Tagalog para sa neuter plural relative construction.
- source_word: ποιεῖτε καὶ ποιήσετε
  choice: ginagawa ninyo at patuloy ninyong gagawin
  rationale: Pinananatili ang kasalukuyan at hinaharap na kilos; nililinaw ng 'patuloy' ang inaasahang pagpapatuloy nang hindi nagdaragdag ng bagong utos.
theological_decisions:
- issue: Ang ugnayan ng pagtitiwala sa Panginoon at ng pagtitiwala tungkol sa mga mambabasa
  choice: “nagtitiwala kami sa Panginoon tungkol sa inyo”
  alternative: “may tiwala kami sa inyo sa Panginoon”
  rationale: 'Mas malapit ang pinili sa ayos at diin ng Griyego: ang pagtitiwala ay nakaugat sa Panginoon at tumutukoy sa pagsunod ng mga mambabasa.'
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “Panginoon” bilang karaniwang salin ng κύριος at ang magalang na pangmaramihang “ninyo/inyo.”
