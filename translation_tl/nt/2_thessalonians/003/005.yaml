base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/005.yaml
  text: May the Lord direct your hearts into the love of God and into the steadfastness of Messiah[a][b][c].
translation:
  language: tl
  text: Patnubayan nawa ng Panginoon ang inyong mga puso tungo sa pag-ibig ng Diyos[a] at sa matatag na pagtitiis ng Mesiyas.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari itong mangahulugang “pag-ibig para sa Diyos”; maaari rin itong tumukoy sa pag-ibig na nagmumula sa Diyos.
    reason: alternative_reading
  - marker: b
    text: Maaari rin itong mangahulugang “ang sariling matatag na pagtitiis ng Mesiyas” o “matatag na pagtitiis para sa Mesiyas.”
    reason: alternative_reading
  - marker: c
    text: Sa Griyego, Χριστός, literal na “Pinahiran”; ginamit dito ang “Mesiyas” sapagkat titulo ang salita.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Panginoon
  rationale: Karaniwang salin ng banal at kristolohikal na titulong κύριος; pinananatili nito ang bigat ng titulo nang hindi nililinaw kung sino ang tinutukoy nang higit sa sinasabi ng teksto.
- source_word: κατευθύναι
  choice: Patnubayan nawa
  rationale: Ipinahahayag ng optative ang isang dalangin o hangarin. Likas sa Tagalog ang “Patnubayan nawa” at pinananatili nito ang diwa ng paggabay o pagtutuwid ng landas.
- source_word: καρδίας
  choice: mga puso
  rationale: Pinananatili ang biblikal na talinghaga para sa sentro ng pag-iisip, pagpapasiya, at damdamin.
- source_word: ἀγάπην
  choice: pag-ibig
  rationale: Payak, natural, at tumpak na katumbas ng ἀγάπη.
- source_word: τοῦ θεοῦ
  choice: ng Diyos
  rationale: Ang pariralang “pag-ibig ng Diyos” ay hindi tahasang nagpapasiya kung ito ay pag-ibig ng Diyos sa mga tao, pag-ibig ng mga tao sa Diyos, o pag-ibig na may katangiang mula sa Diyos.
- source_word: ὑπομονὴν
  choice: matatag na pagtitiis
  rationale: Ipinahahayag ang matiyaga at matatag na pananatili sa gitna ng hirap; mas malinaw ito sa karaniwang mambabasa kaysa sa “katatagan” lamang.
- source_word: τοῦ Χριστοῦ
  choice: ng Mesiyas
  rationale: Ang Χριστός ay gumaganap bilang titulo at kaya isinaling “Mesiyas.” Pinananatili ng “ng Mesiyas” ang posibleng iba’t ibang ugnayan ng genitive.
theological_decisions:
- issue: Malabong genitive sa τὴν ἀγάπην τοῦ θεοῦ
  choice: pag-ibig ng Diyos
  alternative: pag-ibig para sa Diyos; pag-ibig ng Diyos sa atin
  rationale: Sadyang hindi nilutas sa pangunahing teksto kung ang Diyos ang umiibig, ang Diyos ang iniibig, o ang tinutukoy ay pakikibahagi sa pag-ibig na mula sa Diyos.
- issue: Malabong genitive sa τὴν ὑπομονὴν τοῦ Χριστοῦ
  choice: matatag na pagtitiis ng Mesiyas
  alternative: pagtitiis na gaya ng sa Mesiyas; pagtitiis alang-alang sa Mesiyas; sariling pagtitiis ng Mesiyas
  rationale: Maaaring subjective, objective, o qualitative ang genitive. Pinananatili ng salin ang tunay na kalabuan at inilalahad sa talababa ang mga pangunahing posibilidad.
- issue: Paglilipat ng Χριστοῦ
  choice: Mesiyas
  alternative: Cristo/Kristo
  rationale: Isinalin ang kahulugan ng titulo sa halip na ituring lamang itong pangalang pantangi.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang biblikal na larawan ng “mga puso” at ang magkatulad na hulma ng “tungo sa … at sa …,” habang iniwasang lutasin ang dalawang malabong genitive.
