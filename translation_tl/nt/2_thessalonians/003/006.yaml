id: 2TH.3.6
reference: 2 Thessalonians 3:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Παραγγέλλομεν δὲ ὑμῖν, ἀδελφοί, ἐν ὀνόματι τοῦ κυρίου ⸀ἡμῶν Ἰησοῦ Χριστοῦ στέλλεσθαι ὑμᾶς ἀπὸ παντὸς ἀδελφοῦ ἀτάκτως περιπατοῦντος καὶ μὴ κατὰ τὴν παράδοσιν ἣν ⸀παρελάβοσαν παρ’ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/006.yaml
  text: We command you[a], brothers, in the name of our Lord Jesus the Messiah[e][d][c][b], to keep away from every brother who is walking disorderly and not according to the tradition that they received from us.
translation:
  language: tl
  text: Ngunit iniuutos namin sa inyo, mga kapatid[a], sa pangalan ng ating Panginoong Jesu-Cristo[b], na lumayo kayo[c] sa bawat kapatid na namumuhay nang walang kaayusan at hindi ayon sa tradisyong tinanggap nila mula sa amin.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga kapatid” ay tumutukoy sa buong kongregasyon, mga lalaki at mga babae.
    reason: Nililinaw ang saklaw ng panawagan nang hindi binabago ang pampamilyang termino sa pangunahing teksto.
  - marker: b
    text: Ang “Cristo” ay nangangahulugang “Mesiyas” o “Pinahiran.”
    reason: Nililinaw ang kahulugan ng titulong Χριστός.
  - marker: c
    text: O “humiwalay kayo”; ang Griyego ay tumutukoy sa paglayo mula sa malapit na pakikisama.
    reason: Ibinibigay ang leksikal na alternatibo at iniiwasang ipakahulugan agad ito bilang isang tiyak na teknikal na parusang pansimbahan.
  - marker: d
    text: 'Ganito ang nakalimbag na tekstong Griyego: “tinanggap nila mula sa amin.” Mababasa sa ilang manuskrito ang “tinanggap ninyo mula sa amin” o “tinanggap niya mula sa amin.”'
    reason: Itinatala ang mahalagang baryanteng tekstuwal at ang di-pangkaraniwang paglipat ng bilang sa nakalimbag na teksto.
lexical_decisions:
- source_word: Παραγγέλλομεν δὲ ὑμῖν
  choice: Ngunit iniuutos namin sa inyo
  rationale: Ang παραγγέλλομεν ay isang may-awtoridad na utos, kaya ang “iniuutos” ay mas angkop kaysa sa mas mahinang “pinapayuhan.” Isinasalin ng “ngunit” ang δέ bilang banayad na panandang paglilipat o pagsalungat sa naunang sinabi.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Natural at inklusibo sa Filipino ang “mga kapatid” habang pinananatili ang pampamilyang tawag sa kongregasyon.
- source_word: ἐν ὀνόματι τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: sa pangalan ng ating Panginoong Jesu-Cristo
  rationale: Pinananatili ng “sa pangalan” ang solemne at may-awtoridad na idyoma. Ang “Jesu-Cristo” ang natural at kinikilalang anyo sa modernong Tagalog; ipinapaliwanag sa talababa ang titular na kahulugan ng Χριστός.
- source_word: στέλλεσθαι ὑμᾶς ἀπὸ
  choice: na lumayo kayo
  rationale: Ipinahahayag nito ang pag-iwas o pag-urong mula sa malapit na pakikisama nang hindi awtomatikong ipinapalagay ang pormal na pagtitiwalag.
- source_word: παντὸς ἀδελφοῦ
  choice: sa bawat kapatid
  rationale: Pinananatili ang isahan at ang wikang pampamilya ng pamayanang Kristiyano.
- source_word: ἀτάκτως περιπατοῦντος
  choice: na namumuhay nang walang kaayusan
  rationale: Ang περιπατέω ay metapora para sa paraan ng pamumuhay. Ang “walang kaayusan” ay nagpapanatili sa mas malawak na diwa ng ἀτάκτως at hindi agad nililimitahan ito sa katamaran.
- source_word: μὴ κατὰ τὴν παράδοσιν
  choice: at hindi ayon sa tradisyon
  rationale: Ang παράδοσις ay yaong ipinasa o ipinamana; ang “tradisyon” ang tuwirang katumbas, at nililinaw ng sugnay na mula ito sa mga apostolikong tagapagturo.
- source_word: ἣν παρελάβοσαν παρ’ ἡμῶν
  choice: tinanggap nila mula sa amin
  rationale: Sinusunod nito ang ikatlong panauhang maramihan ng nakalimbag na SBLGNT na παρελάβοσαν, kahit may di-inaasahang paglipat mula sa isahang “bawat kapatid” tungo sa maramihang “nila.”
theological_decisions:
- issue: Pagpapakahulugan sa Χριστοῦ bilang titulo
  choice: Jesu-Cristo, na may talababa na ang Cristo ay nangangahulugang Mesiyas
  alternative: Jesus na Mesiyas
  rationale: Sa karaniwang modernong Tagalog, natural at malinaw ang nakaugaliang pangalang “Jesu-Cristo.” Hindi nawawala ang titular na kahulugan sapagkat tahasang ibinibigay sa talababa ang “Mesiyas.”
- issue: Saklaw ng paglayong iniutos sa στέλλεσθαι ὑμᾶς ἀπὸ
  choice: lumayo kayo
  alternative: huwag kayong makisama; humiwalay kayo
  rationale: Pinananatili nito ang tunay na puwersang pandisiplina ngunit hindi pinatatalas tungo sa teknikal na pormal na pagtitiwalag na hindi tahasang sinasabi ng talata.
- issue: Kahulugan ng ἀτάκτως sa konteksto
  choice: walang kaayusan
  alternative: tamad; suwail sa kaayusan
  rationale: Bagaman ang katamaran ay mahalaga sa kasunod na konteksto, mas malawak ang salitang Griyego. Pinananatili ng salin ang saklaw at tensiyong iyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “namumuhay” sa halip na literal na “lumalakad” upang natural na maipahayag ang metapora ng paraan ng pamumuhay. Pinanatili ang “tradisyon” dahil ito ang tuwirang kahulugan ng παράδοσις at ang pinagmulan nito ay tahasang tinutukoy sa talata.
