  text: Τὸ λοιπὸν προσεύχεσθε, ἀδελφοί, περὶ ἡμῶν, ἵνα ὁ λόγος τοῦ κυρίου τρέχῃ καὶ δοξάζηται καθὼς καὶ πρὸς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/001.yaml
  text: Finally[a], brothers, pray for us, that the word of the Lord may spread rapidly and be honored, just as it was among you[b],
translation:
  language: tl
  text: Sa wakas, mga kapatid[a], ipanalangin ninyo kami, upang mabilis na lumaganap at maparangalan ang salita ng Panginoon, gaya rin ng nangyari sa gitna ninyo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griego ay literal na “mga kapatid na lalaki,” ngunit maaari nitong tawagin ang buong kongregasyon bilang isang pangkat.
    reason: lexical_alternative
  - marker: b
    text: 'Literal na larawan: “tumakbo at luwalhatiin,” samakatuwid, “tumakbo at maluwalhati.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ λοιπὸν
  choice: Sa wakas
  rationale: Likas na panandang pangdiskurso sa Filipino para sa pagpasok sa pangwakas na bahagi ng liham; hindi ito kailangang unawain bilang mahigpit na pahayag tungkol sa panahon.
- source_word: προσεύχεσθε
  choice: ipanalangin ninyo
  rationale: Malinaw na pautos sa maramihan. Sa Filipino, likas na ipinahahayag ng anyong ito ang patuloy na panawagan sa pananalangin nang hindi na kailangang idagdag ang 'patuloy.'
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Ang 'mga kapatid' ay natural at marangal na katawagan sa kongregasyon sa Filipino at hindi kailangang markahan ayon sa kasarian; maaari nitong tukuyin ang buong kapulungan.
- source_word: περὶ ἡμῶν
  choice: kami
  rationale: Kasama ng 'ipanalangin,' ang natural na Filipino ay 'ipanalangin ninyo kami,' hindi ang mas literal ngunit mabigat na 'manalangin tungkol sa amin.'
- source_word: ἵνα
  choice: upang
  rationale: Ipinahahayag ang nilalaman at nilalayong bunga ng hinihiling na panalangin.
- source_word: ὁ λόγος τοῦ κυρίου
  choice: ang salita ng Panginoon
  rationale: Pinananatili ang biblikal na idyomang 'salita' at ang genitibong ugnayan, nang hindi nililimitahan kung ito ay salitang mula sa Panginoon o mensaheng tungkol sa kanya.
- source_word: τρέχῃ
  choice: mabilis na lumaganap
  rationale: Literal na 'tumakbo,' ngunit metaporikal itong tumutukoy sa mabilis at malayang pagsulong ng mensahe. Ang 'mabilis na lumaganap' ay malinaw at natural sa makabagong Filipino.
- source_word: δοξάζηται
  choice: maparangalan
  rationale: Ipinahahayag ang pasibong diwa na ang salita ay kilalanin at tanggapin nang may karangalan. Mas natural ito sa Filipino kaysa 'maluwalhati' kapag ang tinutukoy ay ang mensahe.
- source_word: καθὼς καὶ πρὸς ὑμᾶς
  choice: gaya rin ng nangyari sa gitna ninyo
  rationale: Pinananatili ng 'rin' ang καί at malinaw na inihahambing ang hinihiling na mangyari sa naging karanasan na ng mga taga-Tesalonica. Ang 'sa gitna ninyo' ay natural na katumbas ng kontekstuwal na diwa ng πρὸς ὑμᾶς.
theological_decisions:
- issue: Saklaw ng ἀδελφοί sa pagtawag sa kongregasyon
  choice: mga kapatid
  alternative: mga kapatid na lalaki at babae
  rationale: Sa Filipino, ang 'mga kapatid' ay likas na walang tiyak na kasarian at maaaring kumatawan sa buong kongregasyon, kaya hindi kailangan ang pagpapalawak sa pangunahing teksto. Nililinaw ito sa talababa.
- issue: Metapora ng τρέχῃ para sa pagsulong ng salita
  choice: mabilis na lumaganap
  alternative: tumakbo
  rationale: Inihahatid ng optimal equivalence ang kontekstuwal na diwa ng mabilis na pagsulong nang hindi ginagawang literal na kilos ang salita. Pinananatili sa talababa ang orihinal na larawan.
- issue: Diwa ng δοξάζηται kaugnay ng salita ng Panginoon
  choice: maparangalan
  alternative: luwalhatiin
  rationale: Pinananatili ang tensiyong ang salita mismo ang tumatanggap ng pagkilala, ngunit gumagamit ng natural na Filipino para sa pagtanggap dito nang may karangalan. Ang mas literal na anyo ay inilalagay sa talababa.
- issue: Ugnayan sa pariralang salita ng Panginoon
  choice: salita ng Panginoon
  alternative: mensahe mula sa Panginoon
  rationale: Hindi nilulutas nang labis ang posibleng saklaw ng genitibo; ang pariralang Filipino ay maaaring magpahiwatig ng salitang nagmumula sa Panginoon at ng mensaheng nauukol sa kanya.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang biblikal na pariralang “salita ng Panginoon,” habang isinalin nang idiomatiko ang metaporang “tumakbo.” Inilipat ang marker [a] sa tabi ng “mga kapatid,” sapagkat iyon ang salitang nililinaw ng talababa.
