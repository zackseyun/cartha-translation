id: 2TH.3.16
reference: 2 Thessalonians 3:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ὁ κύριος τῆς εἰρήνης δῴη ὑμῖν τὴν εἰρήνην διὰ παντὸς ἐν παντὶ τρόπῳ. ὁ κύριος μετὰ πάντων ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/016.yaml
  text: May the Lord of peace himself give you peace at all times in every way[b][a]. The Lord be with all of you.
translation:
  language: tl
  text: Nawa’y ang Panginoon ng kapayapaan mismo ang magbigay sa inyo ng kapayapaan sa lahat ng panahon[a] at sa bawat paraan[b]. Nawa’y sumainyong lahat ang Panginoon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “palagi.”
    reason: lexical_alternative
  - marker: b
    text: O “sa bawat pamamaraan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς
  choice: mismo
  rationale: Pinananatili nito ang mariing pagtukoy sa Panginoon bilang siya mismong nagbibigay ng kapayapaan.
- source_word: δὲ
  choice: hindi tahasang isinalin
  rationale: Mahinang panandang panlipat ito sa pangwakas na pagpapala; sa modernong Tagalog, natural na maipahiwatig ang paglipat nang walang dagdag na panandang maaaring magmukhang temporal o pansalungat.
- source_word: ὁ κύριος τῆς εἰρήνης
  choice: ang Panginoon ng kapayapaan
  rationale: Pinananatili ang anyong titulo at ang ugnayang genitibo nang hindi ito pinalalawak bilang paliwanag na ‘pinagmumulan’ o ‘tagapagbigay.’
- source_word: δῴη
  choice: Nawa’y ... ang magbigay
  rationale: Ipinahahayag ng optative ang panalangin o hangarin, hindi isang payak na pahayag.
- source_word: τὴν εἰρήνην
  choice: kapayapaan
  rationale: Natural sa Tagalog ang walang pantukoy sa ganitong pagpapala, at malinaw pa rin ang kahulugan.
- source_word: διὰ παντὸς
  choice: sa lahat ng panahon
  rationale: Pinananatili ang temporal na diwa ng pagiging palagian sa malinaw at marangal na Tagalog.
- source_word: ἐν παντὶ τρόπῳ
  choice: sa bawat paraan
  rationale: Malawak at natural na katumbas ito ng paraan o modo, nang hindi ginagawang ‘sa lahat ng kalagayan’ ang parirala.
- source_word: μετὰ πάντων ὑμῶν
  choice: sumainyong lahat
  rationale: Karaniwang anyo ng pagpapala sa Tagalog na malinaw na pinananatili ang saklaw na ‘lahat.’
theological_decisions:
- issue: Tinutukoy ng ‘Panginoon’
  choice: Pinanatili lamang ang ‘Panginoon,’ gaya ng nasa Griyego.
  alternative: Tahasan itong gawing ‘Panginoong Jesus’ o ‘Diyos.’
  rationale: Malamang na tumutukoy ito sa Panginoong Jesus sa kontekstong Paulino, ngunit hindi tahasang binabanggit ng talata ang pangalang Jesus; iniiwasan ng salin ang pagdaragdag.
- issue: Lakas ng pangwakas na sugnay
  choice: 'Isinalin bilang hangarin o pagpapala: ‘Nawa’y sumainyong lahat ang Panginoon.’'
  alternative: 'Isalin bilang pahayag: ‘Ang Panginoon ay sumasainyong lahat.’'
  rationale: Bagaman walang tahasang pandiwa sa Griyego, ang konteksto at anyo ng pangwakas na pagbati ay nagpapahiwatig ng isang pagpapalang hangarin.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘Nawa’y’ upang malinaw ang anyong panalangin o pagpapala; pinanatili ang ‘Panginoon ng kapayapaan’ upang huwag labis na ipaliwanag ang genitibo.
