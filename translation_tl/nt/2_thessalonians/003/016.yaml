  source_fidelity: Tapat ang salin sa Griyego. Naipapahayag ng “Nawa’y ... magbigay” ang benediktibong optative na δῴη, pinananatili ng “Panginoon ng kapayapaan mismo” ang diin ng Αὐτὸς at ang titulo, at wastong naisasalin ang διὰ παντὸς at ἐν παντὶ τρόπῳ bilang “sa lahat ng panahon” at “sa bawat paraan.” Ang “Nawa’y sumainyong lahat ang Panginoon” ay angkop na pagpapalang pagsasalin ng pangwakas na sugnay na walang hayag na pandiwa at saklaw nito ang πάντων ὑμῶν.
