  text: But as for you[a], brothers, do not grow weary in doing good.
translation:
  language: tl
  text: Ngunit kayo naman, mga kapatid[a], huwag kayong manghinawa sa paggawa ng mabuti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay literal na “mga kapatid na lalaki,” ngunit maaari itong gamitin bilang panawag sa buong sambayanan ng mga mananampalataya, kasama ang mga babae.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: Ngunit kayo naman
  rationale: Ipinahihiwatig ng δέ ang paghahambing o pagsalungat sa naunang sinabi tungkol sa mga namumuhay nang walang kaayusan, at binibigyang-diin ng tahasang ὑμεῖς ang mga kinakausap. Likas na naipapahayag sa Filipino ng “Ngunit kayo naman” ang dalawang katangiang ito.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Ang pangmaramihang panawag ay literal na “mga kapatid na lalaki,” ngunit karaniwan itong ginagamit ni Pablo bilang panawag sa buong sambayanan ng mga mananampalataya. Ang “mga kapatid” ay natural at marangal sa Filipino at hindi pinipigil ang inklusibong gamit ng salita sa konteksto.
- source_word: μὴ ἐγκακήσητε
  choice: huwag kayong manghinawa
  rationale: Ang μή na may aorist subjunctive ay isang pagbabawal. Maaaring tumukoy ang ἐγκακέω sa panghihina ng loob o pagkasawa sa patuloy na paggawa; ang “manghinawa” ay likas na Filipino na sumasaklaw sa pagkawala ng sigla at tiyaga.
- source_word: καλοποιοῦντες
  choice: sa paggawa ng mabuti
  rationale: Ipinakikita ng present participle ang nagpapatuloy na gawaing hindi nila dapat pagsawaan o panghinaan ng loob. Malinaw at natural sa modernong Filipino ang “sa paggawa ng mabuti.”
theological_decisions:
- issue: Saklaw ng ἀδελφοί bilang panawag sa iglesya
  choice: mga kapatid
  alternative: mga kapatid na lalaki at babae
  rationale: Masculine plural ang anyong Griyego, ngunit malamang na ang buong kongregasyon, kasama ang mga babae, ang tinutukoy. Pinananatili ng “mga kapatid” ang pampamilyang larawan at natural itong inklusibo sa Filipino; nililinaw sa talababa ang anyo at gamit ng salitang Griyego.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “manghinawa” upang likas na maipahayag ang patuloy na pagtitiyaga nang hindi nilulutas nang labis ang saklaw na “manghina ang loob/mapagod” ng pandiwang Griyego.
