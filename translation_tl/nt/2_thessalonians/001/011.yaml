id: 2TH.1.11
reference: 2 Thessalonians 1:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰς ὃ καὶ προσευχόμεθα πάντοτε περὶ ὑμῶν, ἵνα ὑμᾶς ἀξιώσῃ τῆς κλήσεως ὁ θεὸς ἡμῶν καὶ πληρώσῃ πᾶσαν εὐδοκίαν ἀγαθωσύνης καὶ ἔργον πίστεως ἐν δυνάμει,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/011.yaml
  text: To this end also we always pray for you[a], that our God may count you worthy of the calling and may fulfill every good resolve and work of faith with power[c][b],
translation:
  language: tl
  text: Sa layuning ito, lagi rin namin kayong ipinapanalangin, upang ituring kayo ng ating Diyos na karapat-dapat sa pagkatawag[a], at tuparin niya nang may kapangyarihan ang bawat mabuting hangarin[b] at gawa ng pananampalataya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “gawin kayong karapat-dapat sa pagkatawag.” Ang pandiwang Griyego ay maaaring mangahulugang “ituring na karapat-dapat” o “gawing karapat-dapat.”
    reason: alternative_reading
  - marker: b
    text: Maaari ring “bawat layunin ng kabutihan” o “bawat pasiya para sa kabutihan.”
    reason: lexical_alternative
  - marker: c
    text: Ang “gawa ng pananampalataya” ay maaari ding unawain bilang “gawang bunga ng pananampalataya”; maaari ring tumukoy ang “pananampalataya” sa “katapatan” sa kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ὃ
  choice: Sa layuning ito
  rationale: Likas na panumbas sa Filipino na nagpapanatili sa diwang tumutukoy sa layunin ng naunang pahayag.
- source_word: καὶ προσευχόμεθα πάντοτε περὶ ὑμῶν
  choice: lagi rin namin kayong ipinapanalangin
  rationale: Ipinahahayag ng kasalukuyang aspekto at ng πάντοτε ang palagian o nakaugaliang pananalangin; ipinananatili ng “rin” ang pandagdag na diin ng καί.
- source_word: ἀξιώσῃ
  choice: ituring ... na karapat-dapat
  rationale: Pinananatili nito ang posibleng evaluative na diwa ng pandiwa nang hindi ipinahihiwatig na pinagtatamo ng mga mananampalataya ang sarili nilang pagiging karapat-dapat.
- source_word: τῆς κλήσεως
  choice: sa pagkatawag
  rationale: Walang tahasang panghalip na paari sa Griyego, kaya hindi idinagdag ang “niya” o “ninyo.” Ang “pagkatawag” ay tumutukoy sa kilalang banal na pagtawag sa konteksto.
- source_word: ὁ θεὸς ἡμῶν
  choice: ating Diyos
  rationale: Pinananatili ang tahasang panghalip na paari sa orihinal.
- source_word: πληρώσῃ
  choice: tuparin
  rationale: Maikli at natural itong panumbas na angkop kapuwa sa hangarin at sa gawa bilang mga layuning isinasakatuparan ng Diyos.
- source_word: πᾶσαν εὐδοκίαν ἀγαθωσύνης
  choice: bawat mabuting hangarin
  rationale: Ang εὐδοκία ay maaaring mangahulugang mabuting kalooban, layunin, o pasiya; malinaw at natural ang “mabuting hangarin” nang hindi ito ginagawang damdamin lamang.
- source_word: ἔργον πίστεως
  choice: gawa ng pananampalataya
  rationale: 'Pinananatili ang siksik at bahagyang bukas na ugnayang henitibo: maaaring gawa na nagmumula sa pananampalataya o gawa na kakikitaan nito.'
- source_word: ἐν δυνάμει
  choice: nang may kapangyarihan
  rationale: Natural sa Filipino at pinananatili ang kaugnayan ng kapangyarihan sa pagtupad ng Diyos nang hindi labis na nililinaw kung ito ay paraan o paraan ng pagkilos.
theological_decisions:
- issue: Diwa ng ἀξιώσῃ kaugnay ng banal na pagkatawag
  choice: ituring kayo ... na karapat-dapat
  alternative: gawin kayong karapat-dapat
  rationale: Maaaring evaluative o causative ang pandiwang Griyego. Pinili sa pangunahing teksto ang evaluative na diwa, ngunit inilagay sa talababa ang causative na posibilidad upang mapanatili ang tunay na teolohikal na tensiyon.
- issue: Diwa ng πίστις sa ἔργον πίστεως
  choice: pananampalataya
  alternative: katapatan; gawa na bunga ng pananampalataya
  rationale: Karaniwang tumutukoy ang πίστις sa pananampalataya, ngunit maaaring ipahiwatig ng parirala ang gawa na ibinubunga nito o gawa na may katangian ng katapatan. Hindi pinasikip ng pangunahing teksto ang ugnayan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “ipinapanalangin,” “pagkatawag,” at “pananampalataya” bilang pamilyar ngunit hindi labis na teknikal na pananalitang Kristiyano. Iniwasan ang pagdaragdag ng panghalip na paari sa “pagkatawag” at pinanatili sa mga talababa ang mahahalagang leksikal at teolohikal na alternatibo.
