translation:
  language: tl
  text: sa araw na iyon, kapag dumating siya upang siya ay luwalhatiin sa gitna ng kanyang mga banal[a] at hangaan siya ng lahat ng sumampalataya, sapagkat pinaniwalaan ninyo ang aming patotoo sa inyo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kanyang mga banal.” Maaaring ipahiwatig ng salitang Griyego na niluluwalhati siya sa gitna ng kanyang banal na bayan o na nahahayag sa kanila ang kanyang kaluwalhatian.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring ayusin: “kapag dumating siya upang siya ay luwalhatiin sa gitna ng kanyang mga banal at hangaan siya ng lahat ng sumampalataya—sapagkat pinaniwalaan ninyo ang aming patotoo sa inyo—sa araw na iyon.”'
    reason: previous_rendering
lexical_decisions:
- source_word: ὅταν ἔλθῃ
  choice: pagdating niya
  rationale: Ang ὅταν na may aorist subjunctive ay tumutukoy rito sa isang tiyak na pangyayari sa hinaharap. Likas sa modernong Tagalog ang “pagdating niya” sa loob ng pariralang “sa araw na iyon.”
- source_word: ἐνδοξασθῆναι
  choice: upang luwalhatiin siya
  rationale: Ang aorist passive infinitive ay nagpapahayag ng layunin o kinalabasan ng kanyang pagdating. Ang aktibong anyo sa Tagalog na may di-tiyak na tagaganap ay natural at nagpapanatili sa diwang siya ang tatanggap ng kaluwalhatian.
- source_word: ἐν τοῖς ἁγίοις αὐτοῦ
  choice: sa gitna ng kanyang mga banal
  rationale: Maaaring mangahulugan ang ἐν ng “sa gitna ng” o “sa loob/sa pamamagitan ng.” Pinili ang “sa gitna ng” bilang natural na pangkatang paglalarawan, habang inilalahad sa talababa ang tunay na alternatibo.
- source_word: θαυμασθῆναι
  choice: hangaan siya
  rationale: Ipinahahayag nito ang paghanga na may pagkamangha. Ang “hangaan” ay natural at marangal sa Tagalog, at mas malakas kaysa sa karaniwang pagpapahalaga lamang.
- source_word: ἐν πᾶσιν τοῖς πιστεύσασιν
  choice: ng lahat ng mga sumampalataya
  rationale: Pinananatili ng “mga sumampalataya” ang pandiwang lakas ng participle, sa halip na gawing pangngalang “mga mananampalataya.” Ang “ng” ay natural dahil sa pandiwang “hangaan.”
- source_word: ὅτι
  choice: sapagkat
  rationale: Ipinakikita rito ang dahilan kung bakit kabilang ang mga taga-Tesalonica sa mga sumampalataya. Ang “sapagkat” ay malinaw at angkop sa marangal na rehistro.
- source_word: ἐπιστεύθη
  choice: pinaniwalaan ninyo
  rationale: Passive sa Griyego ang pandiwa, ngunit mas natural sa Tagalog ang aktibong ayos. Idinaragdag ang “ninyo,” na malinaw na ipinahihiwatig ng ἐφ’ ὑμᾶς at ng konteksto, nang hindi binabago ang kahulugan.
- source_word: τὸ μαρτύριον ἡμῶν
  choice: ang aming patotoo
  rationale: Tumutukoy ito sa apostolikong pagsaksi o pagpapahayag. Ang “patotoo” ay tuwiran, karaniwan, at nagpapanatili sa diwa ng witness/testimony.
- source_word: ἐφ’ ὑμᾶς
  choice: sa inyo
  rationale: Pinakamalamang na ipinahihiwatig nito ang direksiyon ng patotoo tungo sa mga taga-Tesalonica. Natural ang “aming patotoo sa inyo,” bagaman maaaring unawain bilang “sa gitna ninyo,” kaya itinala ang alternatibo sa talababa.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: sa araw na iyon
  rationale: Karaniwang panahong pahayag ito na may eskatolohikal na bigat. Inilagay sa unahan para sa malinaw at natural na daloy sa Tagalog.
theological_decisions:
- issue: Ang tinutukoy at puwersa ng “kanyang mga banal” sa kontekstong eskatolohikal
  choice: “sa gitna ng kanyang mga banal,” na tumutukoy sa banal na bayan ni Cristo
  alternative: “sa kanyang mga banal,” na maaaring magdiin na mahahayag ang kanyang kaluwalhatian sa kanila; maaari ring unawain ang ἅγιοι nang mas malawak bilang mga banal na nilalang
  rationale: Iniuugnay ng kasunod na parirala ang “mga banal” sa “lahat ng mga sumampalataya,” kaya malamang na mga mananampalataya ang tinutukoy. Gayunman, hindi dapat mawala ang posibleng diwa ng ἐν na mahahayag ang kaluwalhatian ni Cristo sa kanila.
- issue: Ang kahulugan ng πιστεύσασιν at ἐπιστεύθη kaugnay ng apostolikong pagpapahayag
  choice: Ginamit ang karaniwang wikang “sumampalataya” at “pinaniwalaan” para sa pagtanggap sa patotoo
  alternative: “nagtiwala” o “tinanggap nang may pananampalataya”
  rationale: Hindi kailangan ang isang makitid o denominasyonal na paliwanag. Pinananatili ng salin ang ugnayan ng dalawang anyo ng πιστεύω, habang natural na pinag-iiba ang anyo sa Tagalog ayon sa pangungusap.
- issue: Pagkakaugnay ng sugnay na “sapagkat pinaniwalaan ninyo…”
  choice: Iniugnay ito bilang dahilan kung bakit kabilang ang mga taga-Tesalonica sa lahat ng sumampalataya
  alternative: Maaaring basahin bilang isang parentetikong paliwanag sa gitna ng paglalarawan sa araw ng pagdating
  rationale: Pinakamalinaw sa konteksto ang causal na pagbasa, ngunit pinananatili sa talababa ang alternatibong ayos na mas malapit sa pagkakasunod ng Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mga banal” bilang maikli at nakaugaliang tawag sa banal na bayan ng Panginoon. Iniwasan ang sobrang literal na passive na magiging mabigat sa Tagalog, ngunit pinanatili ang kahulugan, paralelismo, at mga tunay na kalabuan sa pamamagitan ng mga talababa.
