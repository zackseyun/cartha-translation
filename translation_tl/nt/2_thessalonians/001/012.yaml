  to: upang maluwalhati sa inyo[a] ang pangalan ng ating Panginoong Jesus, at kayo naman ay maluwalhati sa kanya, ayon sa biyaya ng ating Diyos at Panginoong Jesu-Cristo.[b]
  rationale: Pinalitan ang “luwalhatiin” ng “maluwalhati” sa dalawang magkakatumbas na sugnay upang maging malinaw ang pasibong/resultatibong diwa ng ἐνδοξασθῇ, habang pinananatili ang eliptikal na paralelismo ng Griyego. Pinakinis din ang pananalita ng unang talababa. Walang pagbabago sa mga pangalan, pangunahing terminong teolohikal, o sa maingat na pag-iwas na ipasya ang pinagtatalunang pagbasa ng panghuling parirala.
