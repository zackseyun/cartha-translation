language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅπως ἐνδοξασθῇ τὸ ὄνομα τοῦ κυρίου ἡμῶν Ἰησοῦ ἐν ὑμῖν, καὶ ὑμεῖς ἐν αὐτῷ, κατὰ τὴν χάριν τοῦ θεοῦ ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/012.yaml
  text: so that the name of our Lord Jesus may be glorified in you[a], and you in him[c][b], according to the grace of our God and the Lord Jesus the Messiah.
translation:
  language: tl
  text: upang maluwalhati sa inyo[a] ang pangalan ng ating Panginoong Jesus, at kayo naman ay maluwalhati sa kanya, ayon sa biyaya ng ating Diyos at Panginoong Jesu-Cristo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa gitna ninyo.” Ang salitang Griyego ay maaaring magkaroon ng alinman sa mga kahulugang ito sa kontekstong ito.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin ang “Cristo” bilang “Mesiyas.” Ang titulong Griyego ay Χριστός. Ang panghuling parirala ay maaari ring unawaing malapit na nag-uugnay sa “ating Diyos” at “Panginoong Jesu-Cristo” sa iisang pagtukoy, o bilang tumutukoy nang magkahiwalay sa ating Diyos at sa Panginoong Jesu-Cristo. Pinananatili ng salin ang siksik na anyo ng Griyego nang hindi ipinipilit ang alinman.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως
  choice: upang
  rationale: Likas at malinaw na nagpapahayag ng layunin o ninanais na bunga ng naunang panalangin.
- source_word: ἐνδοξασθῇ
  choice: luwalhatiin
  rationale: Pinananatili ang pasibong diwa at ang bigat ng wikang may kaugnayan sa kaluwalhatian.
- source_word: τὸ ὄνομα
  choice: ang pangalan
  rationale: Tuwirang pinananatili ang metonimiyang biblikal, kung saan maaaring kumatawan ang pangalan sa pagkakakilanlan at karangalan ng tao.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: ng ating Panginoong Jesus
  rationale: Natural na ayos sa modernong Tagalog na pinananatili ang titulo at pag-aari.
- source_word: ἐν ὑμῖν
  choice: sa inyo
  rationale: Maaaring tumukoy ang ἐν sa pagiging nasa loob o nasa gitna ng isang pangkat; ang “sa inyo” ay natural at sapat na maluwag upang hindi isara ang dalawang himig.
- source_word: καὶ ὑμεῖς ἐν αὐτῷ
  choice: at kayo naman ay luwalhatiin sa kanya
  rationale: Ipinahihiwatig ng elipsis sa Griyego ang inuulit na pandiwang “luwalhatiin”; ang “sa kanya” ay pinakanatural na tumutukoy kay Jesus at pinananatili ang magkatumbas na estruktura.
- source_word: κατὰ τὴν χάριν
  choice: ayon sa biyaya
  rationale: Pinananatili ang diwa ng pamantayan o batayan ng κατά nang hindi ito nililimitahan sa instrumental na kahulugan.
- source_word: χάριν
  choice: biyaya
  rationale: Karaniwan, malinaw, at teolohikal na angkop na salin ng χάρις sa mga liham ni Pablo.
- source_word: τοῦ θεοῦ ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ
  choice: ng ating Diyos at Panginoong Jesu-Cristo
  rationale: Pinananatili ang siksik at malapit na pagkakaugnay ng mga titulo sa Griyego nang hindi nagdaragdag ng artikulong maaaring magpasya kung iisa o dalawa ang tinutukoy.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστοῦ
  choice: Cristo sa tambalang pangalang “Jesu-Cristo”
  alternative: Mesiyas
  rationale: Sa natural na gamit ng modernong Tagalog sa pormulang Ἰησοῦ Χριστοῦ, ang “Jesu-Cristo” ay gumaganap bilang nakagawiang pangalang-titulo; ang “Mesiyas” ay wastong leksikal na alternatibo ngunit magiging mas paliwanag kaysa sa siksik na anyo rito.
- issue: Tinutukoy ng αὐτῷ
  choice: sa kanya, na tumutukoy sa Panginoong Jesus
  alternative: sa pangalan niya
  rationale: Ang panlalaking panghalip at ang magkatumbas na pagluwalhati—si Jesus sa mga mananampalataya at sila sa kanya—ay higit na pumapabor sa pagtukoy kay Jesus.
- issue: Lakas ng panghuling pariralang henitibo
  choice: Pinanatili ang malapit na ugnayan sa “ating Diyos at Panginoong Jesu-Cristo”
  alternative: “ating Diyos at ng Panginoong Jesu-Cristo,” na hayagang naghihiwalay sa dalawang tinutukoy
  rationale: Ang nag-iisang artikulo sa Griyego at ang καί ay bumubuo ng siksik na pariralang maaaring basahing malapit ang pagkakaugnay. Hindi dinagdagan ang Tagalog ng panandang tiyak na magpapasya sa pinagtatalunang sintaks.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Panginoong Jesus” at ang nakagawiang “Jesu-Cristo”; iniwasan ang mas lumang ayos at labis na paliwanag sa mismong talata.
