id: 2TH.1.4
reference: 2 Thessalonians 1:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὥστε ⸂αὐτοὺς ἡμᾶς⸃ ἐν ὑμῖν ⸀ἐγκαυχᾶσθαι ἐν ταῖς ἐκκλησίαις τοῦ θεοῦ ὑπὲρ τῆς ὑπομονῆς ὑμῶν καὶ πίστεως ἐν πᾶσιν τοῖς διωγμοῖς ὑμῶν καὶ ταῖς θλίψεσιν αἷς ἀνέχεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/004.yaml
  text: so that we ourselves boast about you among the churches of God because of your perseverance and faith in all your persecutions and afflictions that you are enduring,[a]
translation:
  language: tl
  text: kaya kami mismo ay nagmamalaki tungkol sa inyo sa mga iglesya ng Diyos dahil sa inyong pagtitiis at pananampalataya[a] sa gitna ng lahat ng pag-uusig at paghihirap na inyong tinitiis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “katapatan”; maaaring tumukoy ang πίστις sa pananampalataya o sa matatag na katapatan, lalo na sa harap ng pagdurusa.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: kaya
  rationale: Ipinapahayag ang bunga ng naunang sinabi at natural na nag-uugnay sa pangungusap sa modernong Tagalog.
- source_word: αὐτοὺς ἡμᾶς
  choice: kami mismo
  rationale: Pinananatili ang diin sa personal na pagkilos ni Pablo at ng kanyang mga kasama.
- source_word: ἐν ὑμῖν
  choice: tungkol sa inyo
  rationale: Sa pandiwa ng pagmamalaki, tumutukoy ito sa mga taong dahilan o paksa ng pagmamalaki.
- source_word: ἐγκαυχᾶσθαι
  choice: nagmamapuri
  rationale: Tuwirang ipinapahayag ang positibong pagmamalaki ni Pablo, nang hindi pinahihina ang kanyang retorika.
- source_word: ἐν ταῖς ἐκκλησίαις τοῦ θεοῦ
  choice: sa mga iglesya ng Diyos
  rationale: Pinananatili ang maramihang mga kapulungang pag-aari ng Diyos at ang saklaw kung saan sila nagmamapuri.
- source_word: ὑπὲρ
  choice: dahil sa
  rationale: Ipinakikita rito ang batayan ng pagmamalaki.
- source_word: ὑπομονῆς
  choice: pagtitiis
  rationale: Natural at malinaw na tumutukoy sa matatag na pananatili sa ilalim ng hirap.
- source_word: πίστεως
  choice: pananampalataya
  rationale: Karaniwang katumbas ng πίστις at pinananatili ang posibilidad ng pagtitiwala; inilalahad sa talababa ang posibleng diwa ng katapatan.
- source_word: ἐν πᾶσιν τοῖς διωγμοῖς ὑμῶν καὶ ταῖς θλίψεσιν
  choice: sa gitna ng lahat ng pag-uusig at paghihirap
  rationale: Ang 'sa gitna ng' ay natural na nagpapahayag ng mga kalagayang kinaroroonan nila; pinananatili ang pagkakaiba ng tahasang pag-uusig at mas malawak na paghihirap.
- source_word: διωγμοῖς
  choice: pag-uusig
  rationale: Malinaw na tumutukoy sa mapanlabang pang-aapi dahil sa kanilang paninindigan.
- source_word: θλίψεσιν
  choice: paghihirap
  rationale: Karaniwan at madaling maunawaang salita para sa matitinding pasanin at kagipitan.
- source_word: αἷς ἀνέχεσθε
  choice: na inyong tinitiis
  rationale: Pinananatili ang nagpapatuloy na pagtitiis na ipinahihiwatig ng pangkasalukuyang anyo ng pandiwa.
theological_decisions:
- issue: Ang diwa ng πίστις sa konteksto ng pagdurusa
  choice: pananampalataya
  alternative: katapatan; pagtitiwala
  rationale: Maaaring tukuyin ng πίστις kapwa ang pananampalataya o pagtitiwala at ang matatag na katapatan. Hindi nilulutas nang tahimik ang tunay na kalabuan; nasa pangunahing teksto ang karaniwang 'pananampalataya,' at nasa talababa ang posibleng 'katapatan.'
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang 'iglesya' para sa ἐκκλησία at iniwasan ang mas arkaikong 'kapighatian.'
source_grounding:
  english_pob_role: consult_only
