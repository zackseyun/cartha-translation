  text: καὶ ὑμῖν τοῖς θλιβομένοις ἄνεσιν μεθ’ ἡμῶν ἐν τῇ ἀποκαλύψει τοῦ κυρίου Ἰησοῦ ἀπ’ οὐρανοῦ μετ’ ἀγγέλων δυνάμεως αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/007.yaml
  text: and to you who are being afflicted[a], relief with us at the revelation of the Lord Jesus from heaven with his mighty angels.
translation:
  language: tl
  text: at sa inyo namang mga pinahihirapan, ang ginhawa kasama namin sa pagkahayag mula sa langit ng Panginoong Jesus, kasama ang mga anghel ng kanyang kapangyarihan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “kasama ang kanyang makapangyarihang mga anghel.”
    reason: Ibinibigay ang mas idyomatikong posibilidad para sa siksik na pariralang Griyego na ἀγγέλων δυνάμεως αὐτοῦ.
lexical_decisions:
- source_word: θλιβομένοις
  choice: mga pinahihirapan
  rationale: 'Pinananatili nito ang kasalukuyan at pasibong diwa ng participle: sila ay patuloy na dumaranas ng pagdiin o pagpapahirap mula sa iba, nang hindi nililimitahan ang kahulugan sa isang tiyak na uri ng pag-uusig.'
- source_word: ἄνεσιν
  choice: ginhawa
  rationale: Ipinahihiwatig ng ἄνεσις ang pagluwag o paglaya mula sa dinaranas na bigat. Likas sa Tagalog ang “ginhawa” at malinaw itong kasalungat ng pagpapahirap.
- source_word: μεθ’ ἡμῶν
  choice: kasama namin
  rationale: Tuwirang pinananatili ang pakikiugnay kay Pablo at sa kanyang mga kasama sa ipinangakong ginhawa.
- source_word: ἐν τῇ ἀποκαλύψει
  choice: sa pagkahayag
  rationale: 'Pinananatili ang anyong pangngalan ng ἀποκάλυψις at ang temporal na ugnayan: darating ang ginhawa sa pangyayaring mahahayag ang Panginoong Jesus.'
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: ng Panginoong Jesus
  rationale: Ang “Panginoon” ang likas at kinikilalang salin ng κύριος bilang titulo, at ang genitive ay pinananatili sa pariralang “pagkahayag ng Panginoong Jesus.”
- source_word: ἀπ’ οὐρανοῦ
  choice: mula sa langit
  rationale: Malinaw na ipinapahayag ang pinagmulan na tinutukoy ng ἀπό.
- source_word: μετ’ ἀγγέλων δυνάμεως αὐτοῦ
  choice: kasama ang mga anghel ng kanyang kapangyarihan
  rationale: Pinananatili ang siksik na genitive construction ng Griyego at hindi agad nagpapasiya kung inilalarawan lamang nitong makapangyarihan ang mga anghel o iniuugnay sila sa kapangyarihan ng Panginoon.
theological_decisions:
- issue: Kahulugan ng genitive sa ἀγγέλων δυνάμεως αὐτοῦ
  choice: kasama ang mga anghel ng kanyang kapangyarihan
  alternative: kasama ang kanyang makapangyarihang mga anghel
  rationale: Maaaring unawain ang parirala bilang kwalitatibong paglalarawan sa mga anghel o bilang pag-uugnay sa kanila sa kapangyarihan niya. Pinananatili ng pangunahing teksto ang tunay na sintaktikong siksik at kalabuan; ibinibigay sa talababa ang mas idyomatikong pagbasa.
- issue: Temporal na diwa ng ἐν τῇ ἀποκαλύψει
  choice: sa pagkahayag ng Panginoong Jesus
  alternative: kapag nahayag ang Panginoong Jesus
  rationale: Ang anyong pangngalan ay mas malapit sa pinagmulan at maaari pa ring maunawaan bilang pagtukoy sa panahon ng eskatolohikong paghahayag.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Pinanatili ang anyong putol ng sugnay dahil nagpapatuloy ang gramatika mula sa naunang talata; hindi nagdagdag ng pandiwang wala sa tekstong Griyego. Inilagay ang pananda ng talababa sa pariralang talagang tinutukoy nito.
