id: 2TH.1.5
reference: 2 Thessalonians 1:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἔνδειγμα τῆς δικαίας κρίσεως τοῦ θεοῦ, εἰς τὸ καταξιωθῆναι ὑμᾶς τῆς βασιλείας τοῦ θεοῦ, ὑπὲρ ἧς καὶ πάσχετε,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/005.yaml
  text: This is evidence of the righteous judgment of God[a], so that you may be counted worthy of the kingdom of God, for which you are also suffering[c][b],
translation:
  language: tl
  text: Katibayan ito ng matuwid na paghatol ng Diyos[a], upang maituring kayong karapat-dapat sa kaharian ng Diyos[b], na alang-alang dito ay nagdurusa rin kayo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “patunay” o “palatandaan” ng matuwid na paghatol ng Diyos.
    reason: lexical_alternative
  - marker: b
    text: O “na ang bunga ay maituring kayong karapat-dapat.” Maaaring magpahayag ng layunin o bunga ang kayariang Griyego.
    reason: alternative_reading
  - marker: c
    text: O “para sa kapakanan nito” o “sa panig nito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔνδειγμα
  choice: katibayan
  rationale: Ipinahihiwatig ng salita ang isang bagay na nagpapakita o nagtuturo sa isang realidad. Natural sa Filipino ang “katibayan” at hindi nito kailangang ipahiwatig ang lubos at pangwakas na patunay. Idinagdag ang “ito” bilang paksa dahil ang Griyego ay isang pariralang walang tahasang pandiwa at nakaugnay sa naunang talata.
- source_word: δικαίας κρίσεως
  choice: matuwid na paghatol
  rationale: Tuwirang pinananatili nito ang moral na katangian ng paghatol ng Diyos at ang pamilyar na wikang biblikal.
- source_word: εἰς τὸ καταξιωθῆναι
  choice: upang maituring kayong karapat-dapat
  rationale: Maaaring magpahayag ng layunin o bunga ang kayariang Griyego. Pinananatili ng “upang” ang pasulong na ugnayan, samantalang malinaw sa “maituring” na ang diwa ay kilalanin o ibilang na karapat-dapat, hindi likas na gawing karapat-dapat.
- source_word: βασιλείας τοῦ θεοῦ
  choice: kaharian ng Diyos
  rationale: Ito ang malinaw, natural, at kinagawiang salin ng pariralang Griyego.
- source_word: ὑπὲρ ἧς
  choice: na alang-alang dito
  rationale: Maaaring mangahulugan ang ὑπέρ na “alang-alang sa” o “para sa kapakanan ng.” Malinaw na iniuugnay ng salin ang kanilang pagdurusa sa kaharian nang hindi pinapakitid ang diwa.
- source_word: καὶ πάσχετε
  choice: nagdurusa rin kayo
  rationale: Ipinakikita ng anyong pangkasalukuyan ang nagpapatuloy nilang pagdurusa, at pinananatili ng “rin” ang καί.
theological_decisions:
- issue: Ugnayan ng pagdurusa at pagiging karapat-dapat sa kaharian
  choice: Ang kanilang kalagayan sa gitna ng pagdurusa ay katibayan kaugnay ng matuwid na paghatol ng Diyos, na may layunin o bungang maituring silang karapat-dapat sa kaharian.
  alternative: Ang pagdurusa nila ang kabayaran o merito na nagpapamit sa kanila ng pagpasok sa kaharian.
  rationale: Ang pasibong καταξιωθῆναι ay nangangahulugang “maituring” o “mabilang na karapat-dapat,” hindi “magawang likas na karapat-dapat.” Hindi nilulutas nang labis ng salin ang tensiyon sa pagitan ng layunin at bunga, at hindi rin nito ipinapasok ang ideya na ang pagdurusa ay kabayarang nagkakamit ng kaharian.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “katibayan” sa halip na mas mariing “patunay,” at ang “maituring” upang mapanatili ang pasibong diwa. Ang “na alang-alang dito” ay tumutukoy sa kaharian ng Diyos.
