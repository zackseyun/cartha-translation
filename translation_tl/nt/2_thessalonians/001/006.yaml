translation:
  language: tl
  text: yamang makatarungan sa paningin ng Diyos na gantihan ng paghihirap ang mga nagpapahirap sa inyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kung talagang makatarungan sa paningin ng Diyos na gantihan ng paghihirap ang mga nagpapahirap sa inyo.”
    reason: Pinananatili ng alternatibo ang lantad na kondisyunal na anyo ng εἴπερ, bagaman sa konteksto ay ipinapalagay na totoo ang kondisyon.
lexical_decisions:
- source_word: εἴπερ
  choice: yamang
  rationale: Ipinakikilala rito ang isang batayang ipinapalagay ni Pablo na totoo, kaya mas natural ang “yamang” kaysa sa isang kondisyong waring pinagdududahan.
- source_word: δίκαιον
  choice: makatarungan
  rationale: Tumutukoy ito sa moral na katuwiran ng pagganti ng Diyos sa konteksto ng paghatol.
- source_word: παρὰ θεῷ
  choice: sa paningin ng Diyos
  rationale: Natural nitong ipinahahayag sa modernong Tagalog na ang kilos ay makatarungan ayon sa pagtataya at pamantayan ng Diyos.
- source_word: ἀνταποδοῦναι
  choice: gantihan
  rationale: Ipinahahayag nito ang pagbibigay ng katumbas na tugon o ganti nang hindi dinaragdagan ang teksto ng tiyak na paraan o panahon ng paghatol.
- source_word: τοῖς θλίβουσιν ὑμᾶς … θλῖψιν
  choice: gantihan ng paghihirap ang mga nagpapahirap sa inyo
  rationale: Pinananatili ng “paghihirap / nagpapahirap” ang sadyang ugnayang leksikal sa pagitan ng θλῖψιν at θλίβουσιν at ang bigat ng pag-uusig o pagdadalamhating idinudulot.
theological_decisions:
- issue: Kalikasan at panahon ng pagganti ng Diyos
  choice: Sinasabi ng talata na makatarungang gantihan ng Diyos ng paghihirap ang mga nagpapahirap sa mga mananampalataya, nang hindi tinutukoy sa sugnay na ito ang buong paraan o panahon ng pagganti.
  alternative: Maaaring unawain ang paghihirap bilang tanging pangwakas na paghatol, o bilang kabilang din ang mga paghatol sa kasalukuyang kasaysayan.
  rationale: Pinagtitibay ng Griyego ang katarungan ng pagganti ng Diyos ngunit hindi nito nilulutas sa sugnay na ito kung kailan at paano iyon lubos na isasagawa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang magkaugnay na “paghihirap” at “nagpapahirap” upang marinig ang pag-uulit sa Griyego; iniwasan ang mas teknikal at di-gaanong natural na “kapighatian” o “tribulasyon.”
