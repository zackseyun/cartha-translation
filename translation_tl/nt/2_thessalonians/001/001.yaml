id: 2TH.1.1
reference: 2 Thessalonians 1:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Παῦλος καὶ Σιλουανὸς καὶ Τιμόθεος τῇ ἐκκλησίᾳ Θεσσαλονικέων ἐν θεῷ πατρὶ ἡμῶν καὶ κυρίῳ Ἰησοῦ Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/001.yaml
  text: 'Paul and Silvanus and Timothy[b][a], to the church of the Thessalonians in God our Father and the Lord Jesus the Messiah:'
translation:
  language: tl
  text: 'Mula kina Pablo, Silvano, at Timoteo, para sa iglesya ng mga taga-Tesalonica na nasa Diyos na ating Ama at sa Panginoong Jesus na Mesiyas[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Jesus na Cristo.” Ang titulong Griego na Χριστός ay maaaring isaling “Mesiyas” o, ayon sa nakaugaliang salin, “Cristo.”
    reason: alternative_reading
lexical_decisions:
- source_word: Παῦλος
  choice: Pablo
  rationale: Karaniwang anyo sa Filipino ng pangalang Παῦλος.
- source_word: Σιλουανὸς
  choice: Silvano
  rationale: Tuwirang inaangkop sa Filipino ang pangalang Σιλουανός; hindi ito pinapalitan ng pinaikling anyong Silas.
- source_word: Τιμόθεος
  choice: Timoteo
  rationale: Karaniwang anyo sa Filipino ng pangalang Τιμόθεος.
- source_word: ἐκκλησίᾳ
  choice: iglesya
  rationale: Likas at malawak na nauunawaang katawagan sa Filipino para sa nagkakatipong pamayanang Cristiano.
- source_word: Θεσσαλονικέων
  choice: ng mga taga-Tesalonica
  rationale: Pinananatili ang pagtukoy ng genitibong maramihan sa mga tao, sa halip na gawing tuwirang lokasyon lamang.
- source_word: ἐν
  choice: na nasa
  rationale: Ipinapanatili ang di-tiyak na ugnayang ipinahihiwatig ng ἐν—maaaring saklaw, pakikipag-isa, o saligan—nang hindi ito pinapaliwanag nang higit sa teksto.
- source_word: θεῷ πατρὶ ἡμῶν
  choice: Diyos na ating Ama
  rationale: Pinananatili ang tahasang ἡμῶν, 'ating,' at natural na ipinapahayag sa Filipino ang kaugnayan ng Diyos bilang Ama.
- source_word: κυρίῳ
  choice: Panginoon
  rationale: Ang 'Panginoon' ang karaniwan at angkop na salin ng titulong κύριος para kay Jesus.
- source_word: Χριστῷ
  choice: Mesiyas
  rationale: Isinasalin ang Χριστός bilang titulong 'Mesiyas' sa halip na ituring lamang na bahagi ng personal na pangalan.
theological_decisions:
- issue: Pagbibigay-kahulugan sa Χριστῷ sa Ἰησοῦ Χριστῷ
  choice: Jesus na Mesiyas
  alternative: Jesucristo / Jesus na Cristo
  rationale: Pinananatiling malinaw na titulo ang Χριστός sa natural na Filipino; inilalagay sa talababa ang tradisyonal na 'Cristo.'
- issue: Ugnayang ipinahihiwatig ng ἐν θεῷ πατρὶ ἡμῶν καὶ κυρίῳ Ἰησοῦ Χριστῷ
  choice: na nasa Diyos na ating Ama at sa Panginoong Jesus na Mesiyas
  alternative: na kabilang sa Diyos na ating Ama at sa Panginoong Jesus na Mesiyas
  rationale: Hindi tahasang nilulutas kung ang ἐν ay tumutukoy sa saklaw, pakikipag-isa, pag-aari, o saligan; pinananatili ang maigsi at masaklaw na pahayag ni Pablo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang karaniwang anyong liham na “Mula kina … Para sa …” upang likas na maipahayag ang eliptikong pambungad na Griego, habang pinananatili ang pagkakasunod at teolohikal na siksik na pariralang tumutukoy sa Diyos Ama at sa Panginoong Jesus.
