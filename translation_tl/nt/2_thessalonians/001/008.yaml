  text: ἐν ⸂φλογὶ πυρός⸃, διδόντος ἐκδίκησιν τοῖς μὴ εἰδόσι θεὸν καὶ τοῖς μὴ ὑπακούουσιν τῷ εὐαγγελίῳ τοῦ κυρίου ἡμῶν Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/008.yaml
  text: in flaming fire[a], inflicting vengeance on those who do not know God and on those who do not obey the gospel of our Lord Jesus[b],
translation:
  language: tl
  text: sa naglalagablab na apoy[a], habang nagpapataw siya ng paghihiganti[b] sa mga hindi kumikilala sa Diyos at sa mga hindi sumusunod sa ebanghelyo ng ating Panginoong Jesus,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa isang ningas ng apoy.”
    reason: lexical_alternative
  - marker: b
    text: O “nagpapataw ng kaparusahan bilang ganti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν φλογὶ πυρός
  choice: sa naglalagablab na apoy
  rationale: Likas at masining na salin ng pariralang naglalarawan sa maapoy na pagpapakita. Pinananatili ng “naglalagablab” ang matingkad at masidhing larawan ng φλόξ at πῦρ.
- source_word: διδόντος ἐκδίκησιν
  choice: na nagpapataw ng paghihiganti
  rationale: Sa tambalang idyomang ito, ang literal na “nagbibigay” ay tumutukoy sa pagsasagawa o pagpapataw ng makatarungang ganti. Ang “nagpapataw” ay malinaw na nagpapahiwatig ng hudisyal na pagkilos.
- source_word: τοῖς μὴ εἰδόσι θεὸν
  choice: sa mga hindi kumikilala sa Diyos
  rationale: Ang οἶδα ay may kasalukuyang diwa rito. Sa Filipino, ang “kumikilala sa Diyos” ay natural na nagsasaad ng tunay na pagkakilala, hindi lamang ng pagkakaroon ng impormasyon tungkol sa Diyos.
- source_word: τοῖς μὴ ὑπακούουσιν
  choice: sa mga hindi sumusunod
  rationale: Tuwirang ipinapahayag ang kawalan ng pagsunod nang hindi idinaragdag ang tahasang pagtanggi o kusang pagmamatigas na hindi mismo sinasabi ng anyong Griyego.
- source_word: τῷ εὐαγγελίῳ
  choice: sa ebanghelyo
  rationale: Ang “ebanghelyo” ay matatag, nauunawaan, at angkop na terminong Filipino para sa paulit-ulit na katawagang Paulino.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: ng ating Panginoong Jesus
  rationale: Pinananatili ang titulong κύριος at ang ugnayang ipinahahayag ng genitive, sa likas na ayos ng Filipino.
theological_decisions:
- issue: Likas na katangian ng ἐκδίκησις sa paghuhukom ng Diyos
  choice: paghihiganti
  alternative: pagpaparusa bilang ganti
  rationale: Pinananatili ng “paghihiganti” ang bigat at tindi ng salita sa pinagmulan. Sa konteksto, ito ay ganti ng banal na hukom, hindi mapusok o makasalanang paghihiganti ng tao; hindi ito pinalalambot tungo lamang sa pangkalahatang “katarungan.”
- issue: Diwa ng “pagkilala” sa τοῖς μὴ εἰδόσι θεόν
  choice: mga hindi kumikilala sa Diyos
  alternative: mga hindi nakakakilala sa Diyos
  rationale: Ang “hindi kumikilala” ay natural sa kontekstong panrelihiyon at maaaring saklawin ang relasyonal na pagkilala nang hindi tinutukoy kung ang dahilan ay kawalan ng pagkakataon, pagtanggi, o iba pa.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Ang talata ay pinanatiling isang pariralang nagpapatuloy mula sa naunang bersikulo, gaya ng sintaks ng Griyego. Inilagay ang talababa [b] kaagad sa “paghihiganti,” ang salitang tinutukoy ng alternatibo.
