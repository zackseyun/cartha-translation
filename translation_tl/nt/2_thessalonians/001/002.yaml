base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a].
translation:
  language: tl
  text: Sumainyo nawa ang biyaya at kapayapaang mula sa Diyos na Ama at sa Panginoong Jesu-Cristo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Panginoong Jesus na Mesiyas.” Ang salitang Griyego na Χριστός (Christos), na karaniwang isinasaling “Cristo,” ay nangangahulugang “Mesiyas” o “Pinahiran.”
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: biyaya
  rationale: Karaniwang salin sa makabagong Tagalog na nagpapanatili sa anyo ng pagbati at sa mayamang teolohikal na gamit ni Pablo.
- source_word: ὑμῖν
  choice: sumainyo nawa
  rationale: Likas na pormula ng pagpapala sa Tagalog; ipinahihiwatig ng “nawa” ang diwang optatibo ng eliptikong pagbati.
- source_word: εἰρήνη
  choice: kapayapaan
  rationale: Tuwirang salin na maaari ring magpahiwatig ng kabuuang kagalingan at mabuting kalagayan.
- source_word: ἀπὸ
  choice: mula sa
  rationale: Malinaw na ipinapakita ang pinagmumulan ng biyaya at kapayapaan.
- source_word: θεοῦ πατρὸς
  choice: Diyos na ating Ama
  rationale: Bagaman walang tahasang ἡμῶν sa nakalimbag na tekstong Griyego, kailangan ng likas na panandang pangkaugnayan sa Tagalog; ipinapahayag ng “ating Ama” ang malamang na relasyonal na diwa ng pormulang Paulino.
- source_word: κυρίου
  choice: Panginoon
  rationale: Itinatag na katumbas sa Bagong Tipan na nagpapanatili sa lakas ng titulo.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesu-Cristo
  rationale: Ang “Cristo” ay likas at kinikilalang anyo sa Tagalog para sa Χριστός sa pormulang ito; nililinaw ng talababa ang kahulugang “Mesiyas” upang hindi mawala ang bisa nito bilang titulo.
theological_decisions:
- issue: Pagdaragdag ng “ating” bago ang “Ama” kahit walang tahasang ἡμῶν sa SBLGNT
  choice: Diyos na ating Ama
  alternative: Diyos na Ama
  rationale: Ang “ating Ama” ay natural na Tagalog at umaayon sa relasyonal na diwa ng nakaugaliang pagbating Paulino. Gayunman, hindi ito itinuturing na hiwalay na salitang nasa tekstong Griyego.
- issue: Paglilipat ng Χριστός bilang titulo
  choice: Cristo, na may talababa na “Mesiyas”
  alternative: Mesiyas
  rationale: Sa makabagong Tagalog, ang “Jesu-Cristo” ang mas natural at marangal na anyo sa pagbati, samantalang pinananatili ng talababa ang leksikal at titulong kahulugan ng Χριστός.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang tradisyonal ngunit buhay pang pormulang “Sumainyo nawa” at ang kinikilalang pangalang-titulong “Jesu-Cristo,” nang walang labis na arkaismo.
