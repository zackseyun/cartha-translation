source:
  edition: SBLGNT
  text: Εὐχαριστεῖν ὀφείλομεν τῷ θεῷ πάντοτε περὶ ὑμῶν, ἀδελφοί, καθὼς ἄξιόν ἐστιν, ὅτι ὑπεραυξάνει ἡ πίστις ὑμῶν καὶ πλεονάζει ἡ ἀγάπη ἑνὸς ἑκάστου πάντων ὑμῶν εἰς ἀλλήλους,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/003.yaml
  text: We ought always to give thanks to God for you[a], brothers, as is fitting, because your faith is growing abundantly and the love of each and every one of you for one another is increasing[c][b],
translation:
  language: tl
  text: Dapat na lagi kaming magpasalamat sa Diyos dahil sa inyo, mga kapatid,[a] gaya ng nararapat, sapagkat lubhang lumalago ang inyong pananampalataya[b] at lalong sumasagana ang pag-ibig ng bawat isa sa inyong lahat sa isa’t isa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay nasa anyong panlalaking maramihan ngunit maaari nitong tukuyin ang buong komunidad ng mga mananampalataya, kapwa lalaki at babae.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “katapatan” o “pagtitiwala”; maaaring taglayin ng salitang Griyego ang mga diwang ito, bagaman “pananampalataya” ang pangunahing salin dito.
    reason: alternative_reading
lexical_decisions:
- source_word: Εὐχαριστεῖν ὀφείλομεν
  choice: Dapat kaming ... magpasalamat
  rationale: Ipinahahayag ng infinitive na Εὐχαριστεῖν kasama ng ὀφείλομεν ang moral na pananagutan o pagiging nararapat, nang hindi ito pinalalabis bilang ganap na sapilitan.
- source_word: πάντοτε
  choice: laging
  rationale: Natural at tumpak na katumbas ng patuloy o palagiang panahon.
- source_word: περὶ ὑμῶν
  choice: dahil sa inyo
  rationale: Sa pormula ng pasasalamat, ang περί ay tumutukoy sa mga taong dahilan o paksa ng pasasalamat; mas natural sa Tagalog ang “dahil sa inyo” kaysa “tungkol sa inyo.”
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Ang “mga kapatid” ay natural na tawag sa buong komunidad ng mga mananampalataya sa Tagalog at hindi kailangang tukuyin ang kasarian.
- source_word: καθὼς ἄξιόν ἐστιν
  choice: gaya ng nararapat
  rationale: Pinananatili nito ang diwa ng pagiging angkop o tama, hindi ng personal na pagiging karapat-dapat.
- source_word: ὑπεραυξάνει
  choice: lubhang lumalago
  rationale: Ang “lubhang” ay naghahatid ng pinatinding diwa ng tambalang pandiwa, higit sa payak na paglago.
- source_word: ἡ πίστις
  choice: pananampalataya
  rationale: Ito ang karaniwang katumbas sa kontekstong tumutukoy sa lumalagong pagtitiwala o pananampalataya ng kongregasyon.
- source_word: πλεονάζει
  choice: lalong sumasagana
  rationale: Ipinakikita ang patuloy at dumaraming kasaganaan ng pag-ibig, habang naiiwasang ulitin lamang ang “lumalago.”
- source_word: ἡ ἀγάπη
  choice: pag-ibig
  rationale: Karaniwan, malinaw, at dignified na salin ng ἀγάπη sa modernong Tagalog.
- source_word: ἑνὸς ἑκάστου πάντων ὑμῶν εἰς ἀλλήλους
  choice: ng bawat isa sa inyong lahat sa isa't isa
  rationale: Pinananatili ang mariing distributibong diwa ng Griyego—bawat indibidwal sa buong pangkat—sa likas na ayos ng Tagalog.
theological_decisions:
- issue: Kahulugan ng πίστις
  choice: pananampalataya
  alternative: katapatan; pagtitiwala
  rationale: Sa konteksto, pinakamalamang na tumutukoy ito sa lumalagong pananampalataya ng mga taga-Tesalonica, ngunit maaari ring taglayin ng πίστις ang diwa ng pagtitiwala o katapatan; pinananatili ang mga iyon sa talababa.
- issue: Saklaw ng ἀδελφοί
  choice: mga kapatid
  alternative: mga kapatid na lalaki
  rationale: Bagaman panlalaking maramihan ang anyong Griyego, maaari nitong tawagin ang buong komunidad ng mga mananampalataya. Ang “mga kapatid” sa Tagalog ay tumpak na salita at likas na inklusibo nang hindi nagdaragdag ng tahasang “mga babae.”
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “Dapat kaming” para sa pastoral na pananagutan, “lubhang lumalago” at “lalong sumasagana” upang mapanatili ang dalawang magkaibang pandiwang may pinatinding pag-unlad, at ang emfatikong “bawat isa sa inyong lahat” nang hindi nagiging malamya.
