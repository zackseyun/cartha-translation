  text: οἵτινες δίκην τίσουσιν ὄλεθρον αἰώνιον ἀπὸ προσώπου τοῦ κυρίου καὶ ἀπὸ τῆς δόξης τῆς ἰσχύος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/009.yaml
  text: These will pay the penalty of eternal destruction[a], away from the presence of the Lord and from the glory of his might,
translation:
  language: tl
  text: 'Sila ang magbabayad ng parusa: walang hanggang kapahamakan, malayo sa presensya ng Panginoon at sa kaluwalhatian ng kanyang kapangyarihan.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἵτινες
  choice: Sila
  rationale: Tumutukoy ito pabalik sa mga taong binanggit sa naunang talata. Likas sa Tagalog ang resumptibong “Sila” at hindi nito labis na ipinapakahulugan ang bahagyang kwalitatibong diin ng οἵτινες.
- source_word: δίκην τίσουσιν
  choice: ang magbabayad ng parusa
  rationale: Ang parirala ay tumutukoy sa pagbayad o pagdanas ng hatol na parusa. Pinananatili ng “magbabayad ng parusa” ang legal at hudisyal na diwa habang malinaw sa modernong Tagalog.
- source_word: ὄλεθρον
  choice: kapahamakan
  rationale: Ipinahahayag nito ang matinding pagkawasak o kapariwaraang bunga ng hatol. Ang “kapahamakan” ay natural at marangal sa Tagalog, at hindi nito ipinapasya kung ano ang eksaktong paraan o kalikasan ng pangwakas na parusa.
- source_word: αἰώνιον
  choice: walang hanggang
  rationale: Sa eskatolohikal na kontekstong ito, “walang hanggang” ang pinakanatural na katumbas at naghahayag ng namamalaging pagiging pangwakas ng hatol.
- source_word: ἀπὸ προσώπου τοῦ κυρίου
  choice: malayo sa presensya ng Panginoon
  rationale: Maaaring magpahiwatig ang ἀπό ng pagkakahiwalay. Ang πρόσωπον ay literal na “mukha,” ngunit “presensya” ang idiomatikong kahulugan dito; idinagdag ang “malayo” upang malinaw na maipahayag ang pangunahing pagbasa na pagkakahiwalay o pagkakait ng paglapit.
- source_word: καὶ ἀπὸ τῆς δόξης τῆς ἰσχύος αὐτοῦ
  choice: at sa kaluwalhatian ng kanyang kapangyarihan
  rationale: 'Ang δόξα ay “kaluwalhatian,” at ang ἰσχύς ay lakas o kapangyarihan. Ang parirala ay pinanatiling tuwiran: ang kaluwalhatiang nauukol sa o naghahayag ng kanyang kapangyarihan.'
theological_decisions:
- issue: Kahulugan ng ἀπό kaugnay ng pangwakas na hatol
  choice: 'Pagkakahiwalay o pagkakait: “malayo sa presensya ng Panginoon”'
  alternative: 'Pinagmulan: kapahamakang nagmumula sa presensya ng Panginoon at sa kaluwalhatian ng kanyang kapangyarihan'
  rationale: Maaaring tumukoy ang ἀπό sa pagkakahiwalay o sa pinagmulan. Ang pagbasa bilang pagkakahiwalay ay malakas sa konteksto at natural sa pangunahing teksto, ngunit tunay na posible sa gramatika ang pagbasa bilang pinagmulan kaya pinanatili ito sa talababa.
- issue: Ipinahihiwatig ng “walang hanggang kapahamakan”
  choice: Isinalin ang parirala nang hindi tinutukoy ang eksaktong kalikasan ng pangwakas na parusa
  alternative: Pagpapakahulugan dito bilang lubos na pagkalipol o bilang walang hanggang mulat na pagdurusa
  rationale: Binabanggit ng Griyego ang parusa ngunit hindi nito sa pariralang ito lamang nilulutas ang mas malawak na doktrinal na pagtatalo. Kaya hindi nagdagdag ang salin ng denominasyonal na pagpapasya.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang hudisyal na himig ng talata at ang tunay na ambiguwidad ng pang-ukol na ἀπό sa pamamagitan ng talababa.
