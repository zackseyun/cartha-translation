    text: O maaaring, “kapahamakang nagmumula sa presensya ng Panginoon at sa kaluwalhatian ng kanyang kapangyarihan.” Ang pang-ukol sa Griyego ay maaaring tumukoy sa pagkakahiwalay (“malayo sa”) o sa pinagmulan (“nagmumula sa”).
    reason: alternative_reading
  revision_rationale: 'Pinalitan ang hindi likas na “parusa na walang hanggang kapahamakan” ng appositional na “parusa: walang hanggang kapahamakan,” na mas malinaw na katumbas ng δίκην τίσουσιν ὄλεθρον αἰώνιον. Pinanatili ang pangunahing pagbasa na pagkakahiwalay at ang makabuluhang alternatibong pagbasa ng ἀπό sa talababa.'
