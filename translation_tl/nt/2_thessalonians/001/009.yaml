review_pass:
  verdict: revise
  source_fidelity: Tumpak na naihahatid ng draft ang hinaharap na hudisyal na parusa (δίκην τίσουσιν), ang “walang hanggang kapahamakan” (ὄλεθρον αἰώνιον), at ang pangunahing pagbasa ng ἀπό bilang pagkakahiwalay. Gayunman, ang pagkakaugnay ng “parusa na walang hanggang kapahamakan” ay hindi malinaw at hindi likas na nagpapakita na ang “walang hanggang kapahamakan” ang nilalaman o uri ng parusa.
  naturalness: Ang “Sila ang magbabayad ng parusa na walang hanggang kapahamakan” ay mabigat at may depektibong pag-uugnay sa modernong Tagalog. Ang panandang tutuldok ay mas malinaw at natural upang ilahad ang parusang tinutukoy.
  terminology: Ang “Panginoon,” “kaluwalhatian,” “kapangyarihan,” at “walang hanggang kapahamakan” ay angkop sa marangal ngunit modernong rehistro. Pinananatili ng “kapahamakan” ang saklaw ng ὄλεθρος nang hindi ipinapasya ang isang partikular na doktrina tungkol sa huling hatol.
  issues:
  - severity: medium
    issue: Hindi malinaw ang sintaks ng “parusa na walang hanggang kapahamakan.”
    rationale: Ang Griyego ay “magbabayad sila ng parusa, [na] walang hanggang kapahamakan.” Hindi natural sa Tagalog ang “parusa na kapahamakan” nang walang mas malinaw na pantukoy o appositional na pagmamarka. Ang rebisyon ay nagpapalinaw sa ugnayan nang hindi nagdaragdag ng kahulugan.
  revised_text: 'Sila ang magbabayad ng parusa: walang hanggang kapahamakan, malayo sa presensya ng Panginoon at sa kaluwalhatian ng kanyang kapangyarihan.'
  revised_footnotes:
