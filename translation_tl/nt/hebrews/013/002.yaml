  naturalness: Mas natural at marangal sa modernong Filipino Tagalog ang "Huwag ninyong pabayaan ang pagtanggap sa mga estranghero" at "tumanggap sa mga anghel bilang mga panauhin nang hindi nila namamalayan."
  terminology: Pinananatili ang "mga anghel" bilang pangunahing salin ng ἀγγέλους, habang inilalagay sa talababa ang tunay na leksikal na alternatibong "mga mensahero." Ang "mga estranghero" ay tahasang nagdadala ng stranger-oriented na diwa ng φιλοξενία.
