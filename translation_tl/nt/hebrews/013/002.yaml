  text: τῆς φιλοξενίας μὴ ἐπιλανθάνεσθε, διὰ ταύτης γὰρ ἔλαθόν τινες ξενίσαντες ἀγγέλους.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/002.yaml
  text: Do not neglect hospitality[a], for through it some have entertained angels without knowing it.
translation:
  language: tl
  text: Huwag ninyong pabayaan ang pagtanggap sa mga estranghero[a], sapagkat sa pamamagitan nito ay may ilang tumanggap sa mga anghel bilang mga panauhin[b] nang hindi nila namamalayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagiging magiliw sa mga estranghero.”
    reason: Ipinapakita ang literal na stranger-oriented na diwa ng φιλοξενία nang hindi isinasakripisyo ang natural na pangunahing salin.
  - marker: b
    text: Maaari ring isalin ang “mga anghel” bilang “mga mensahero.” Gayunman, malamang na mga anghel ang tinutukoy rito.
    reason: Pinananatili ang leksikal na alternatibo ng ἀγγέλους, samantalang ang pangunahing salin ay sumusunod sa malamang na kontekstuwal na kahulugan.
lexical_decisions:
- source_word: φιλοξενίας
  choice: tumanggap ng mga hindi ninyo kilala
  rationale: Ang φιλοξενία ay literal na pag-ibig o magiliw na pagtanggap sa mga estranghero. Inilalahad ito nang natural sa modernong Tagalog habang pinananatili ang diwa na hindi lamang karaniwang pagpapatuloy sa mga kakilala ang tinutukoy.
- source_word: μὴ ἐπιλανθάνεσθε
  choice: Huwag ninyong kaligtaan
  rationale: Sa kontekstong nagpapayo, ang pandiwa ay tumutukoy hindi lamang sa pagkalimot sa isip kundi sa pagpapabaya sa aktuwal na pagsasagawa.
- source_word: διὰ ταύτης
  choice: sa paggawa nito
  rationale: 'Tumutukoy ang pambabaeng panghalip pabalik sa φιλοξενία. Ang parirala ay natural na naghahayag ng paraang instrumental: sa pamamagitan ng ganitong pagtanggap.'
- source_word: ἔλαθόν ... ξενίσαντες
  choice: nakapagpatuloy ... nang hindi nila nalalaman
  rationale: Ipinahahayag ng λανθάνω na ginawa ng mga tao ang kilos na nasa participle nang hindi nila batid ang tunay na kalagayan. Ang 'nakapagpatuloy' ay malinaw na tumutukoy sa pagtanggap at pagpapatuloy bilang panauhin.
- source_word: τινες
  choice: may ilan
  rationale: Natural na katumbas ito ng di-tiyak na pangmaramihang τινες.
- source_word: ἀγγέλους
  choice: mga anghel
  rationale: Bagaman maaari ring mangahulugang 'mga mensahero,' higit na angkop dito ang 'mga anghel' dahil sa malamang na pahiwatig sa mga salaysay ng pagtanggap sa mga makalangit na panauhin.
theological_decisions:
- issue: Kahulugan ng ἀγγέλους
  choice: mga anghel sa makalangit na diwa
  alternative: mga mensahero, na maaaring mga tao
  rationale: Pinapaboran ng malamang na pahiwatig sa Genesis 18–19 ang makalangit na kahulugan, ngunit tunay ang leksikal na posibilidad na 'mga mensahero,' kaya pinananatili iyon sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Iniwasan ang masyadong teknikal na 'hospitalidad'; ginamit ang kongkretong pananalitang nagpapakita ng pagtanggap sa mga taong hindi kilala. Ang 'nakapagpatuloy' ay ginagamit sa kahulugang tumanggap at naglaan ng matutuluyan o pag-aasikaso sa panauhin.
