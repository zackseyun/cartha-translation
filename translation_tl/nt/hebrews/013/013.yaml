  text: τοίνυν ἐξερχώμεθα πρὸς αὐτὸν ἔξω τῆς παρεμβολῆς, τὸν ὀνειδισμὸν αὐτοῦ φέροντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/013.yaml
  text: Therefore[a], let us go out to him outside the camp, bearing his reproach.
translation:
  language: tl
  text: Kaya lumabas tayo patungo sa kanya sa labas ng kampo[a], na pinapasan ang kanyang kadustaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “himpilan.” Ipinapaalaala ng parirala ang mga handog sa Lev 16 at ang pagtatakwil na dinanas ni Jesus sa labas ng lungsod.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοίνυν
  choice: Kaya
  rationale: Naghahayag ito ng kongklusyon mula sa naunang paliwanag, lalo na sa 13:11–12; natural sa modernong Tagalog ang “Kaya.”
- source_word: ἐξερχώμεθα
  choice: lumabas tayo
  rationale: Ang unang panauhang maramihang subjunctive ay hortatoryo; malinaw na naipapahayag ng “lumabas tayo” ang sama-samang panawagan.
- source_word: πρὸς αὐτὸν
  choice: patungo sa kanya
  rationale: Ipinapakita ng πρός na may accusative ang pagkilos patungo sa isang tao. Pinananatili rin ang panghalip ng Griyego sa halip na tahasang ipalit ang “Jesus.”
- source_word: ἔξω τῆς παρεμβολῆς
  choice: sa labas ng kampo
  rationale: Ang παρεμβολή ay kampo o himpilan. Pinananatili ng “kampo” ang larawang kaugnay ng paghahandog at ng ilang ng Israel sa konteksto.
- source_word: τὸν ὀνειδισμὸν αὐτοῦ
  choice: ang kanyang kahihiyan
  rationale: Ang ὀνειδισμός ay tumutukoy sa paghamak, upasala, o dulot na kahihiyan. Ang “kahihiyan” ay natural at marangal na Filipino at naipapakita ang panlipunang dungis na tiniis niya.
- source_word: φέροντες
  choice: na pinapasan
  rationale: Ang present active participle ay nagsasaad ng kasabay at nagpapatuloy na pagpasan; ang “pinapasan” ay nagpapanatili sa konkretong larawan nang hindi ito nililimitahan sa simpleng pagtitiis.
theological_decisions:
- issue: Ang tinutukoy ng “kanya”
  choice: Pinanatili ang panghalip; si Jesus ang ipinahihiwatig ng agarang konteksto sa 13:12.
  alternative: Palitan ito ng tahasang “Jesus.”
  rationale: Panghalip ang ginamit ng Griyego, at malinaw sa konteksto ang tinutukoy. Ang pagpapanatili rito ay mas tapat sa anyo ng pinagmulan.
- issue: Kahulugan ng “sa labas ng kampo”
  choice: Pinanatili ang metaporikal at panghandog na larawan.
  alternative: “sa labas ng relihiyosong kaayusan” o “sa labas ng pamayanan”
  rationale: Ang literal na larawan ay umaalingawngaw sa Levitikong paghahandog at sa pagtatakwil kay Jesus. Ang pagpaparaphrase ay magpapakitid sa sadyang mayamang pahiwatig ng teksto.
- issue: Ugnayan ng “kanyang kahihiyan” kay Jesus at sa mga mananampalataya
  choice: Ang kahihiyang kaugnay ng pagtatakwil sa kanya ay kusang pinapasan ng mga lumalapit sa kanya.
  alternative: “ang mga paghamak sa kanya”
  rationale: Pinananatili ng salin ang genitive na αὐτοῦ at ang posibilidad na tumukoy kapwa sa kahihiyang dinanas niya at sa kahihiyang ibinabahagi ng mga nakikiisa sa kanya.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Pinanatili ang larawang “kampo” at “pinapasan” upang huwag patagin ang panghandog at panlipunang puwersa ng orihinal.
