  source_fidelity: Tumpak na naipapahayag ng draft ang hinuha ng τοίνυν, ang hortatoryong “lumabas tayo,” ang pagkilos patungo sa kanya, at ang literal na larawang “sa labas ng kampo.” Gayunman, ang “kanyang kahihiyan” ay mas nakatuon sa panloob na hiya kaysa sa ὀνειδισμός, na tumutukoy sa kadustaan, paghamak, o upasalang ibinato sa kanya. Ang “kanyang kadustaan” ay mas malapit sa Griyego at pinananatili ang saklaw ng genitive.
  naturalness: Natural at marangal sa modernong Filipino Tagalog ang “Kaya lumabas tayo patungo sa kanya sa labas ng kampo, na pinapasan ang kanyang kadustaan.” Mas angkop ang “kadustaan” kaysa “kahihiyan” sa rehistrong pangkasulatan at sa ideya ng pampublikong paghamak.
  terminology: Pinanatili ang “kampo” para sa παρεμβολή at ang panghalip na “kanya” para sa αὐτόν/αὐτοῦ. Pinalitan ang “kahihiyan” ng “kadustaan” upang katawanin ang ὀνειδισμός nang hindi ipinapakahulugan nang lampas sa teksto.
