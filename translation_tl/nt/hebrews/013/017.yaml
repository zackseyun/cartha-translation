  text: Πείθεσθε τοῖς ἡγουμένοις ὑμῶν καὶ ὑπείκετε, αὐτοὶ γὰρ ἀγρυπνοῦσιν ὑπὲρ τῶν ψυχῶν ὑμῶν ὡς λόγον ἀποδώσοντες, ἵνα μετὰ χαρᾶς τοῦτο ποιῶσιν καὶ μὴ στενάζοντες, ἀλυσιτελὲς γὰρ ὑμῖν τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/017.yaml
  text: Be persuaded by your leaders and yield to them[a], for they are keeping watch over your souls as those who will give an account, so that they may do this with joy and not with groaning, for this would be unprofitable for you.
translation:
  language: tl
  text: Magpahikayat kayo sa inyong mga pinuno[a] at magbigay-daan kayo sa kanila, sapagkat patuloy silang nagbabantay para sa inyong mga kaluluwa bilang mga magsusulit, upang magawa nila ito nang may kagalakan at hindi nang may daing, sapagkat hindi ito makabubuti sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Sundin ninyo ang inyong mga pinuno.” Ang Griyegong Πείθεσθε ay maaaring mangahulugang “magpahikayat” at, ayon sa konteksto, “sumunod.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πείθεσθε
  choice: Makinig kayo sa
  rationale: Ang anyong ito ng πείθω ay maaaring mangahulugang magpahikayat, magtiwala, o sumunod. Ang “makinig kayo sa” ay likas sa modernong Tagalog at naghahatid ng kusang pagtugon sa panghihikayat nang hindi ito ginagawang basta bulag na pagsunod. Nasa talababa ang mas tuwirang alternatibong “sundin.”
- source_word: ἡγουμένοις
  choice: mga pinuno
  rationale: Tumutukoy ito sa mga kinikilalang nangunguna sa pamayanan. Ang “mga pinuno” ay malinaw at hindi nagdaragdag ng awtoritaryong diin.
- source_word: ὑπείκετε
  choice: magbigay-daan sa kanila
  rationale: Pinananatili nito ang diwa ng pagbibigay-daan o pagpapaubaya at hindi pinag-iisa ang kahulugan nito sa naunang Πείθεσθε.
- source_word: ἀγρυπνοῦσιν
  choice: patuloy silang nagbabantay
  rationale: Pinananatili ng “nagbabantay” ang larawan ng mapagmatyag at walang-pagod na pagbabantay; ipinahihiwatig ng “patuloy” ang nagpapatuloy na gawain.
- source_word: ὑπὲρ τῶν ψυχῶν ὑμῶν
  choice: alang-alang sa inyong mga kaluluwa
  rationale: Ang “alang-alang” ay likas na salin ng ὑπέρ sa konteksto ng mapagkalingang pagbabantay. Pinananatili ng “mga kaluluwa” ang espirituwal na bigat ng ψυχαί nang hindi itinatangging maaari itong tumukoy sa buong pagkatao.
- source_word: ὡς λόγον ἀποδώσοντες
  choice: bilang mga taong magsusulit
  rationale: Ang “magsusulit” ay maikli at likas na pahayag ng pananagutang darating, gaya ng ipinahihiwatig ng future participle.
- source_word: μετὰ χαρᾶς
  choice: nang may kagalakan
  rationale: Tuwiran at marangal na katumbas ng pariralang Griyego.
- source_word: στενάζοντες
  choice: nang may daing
  rationale: Pinananatili ng “daing” ang kongkretong larawan ng στενάζω sa halip na paliitin ito sa lungkot lamang.
- source_word: ἀλυσιτελὲς
  choice: hindi makabubuti
  rationale: Likas itong Tagalog para sa bagay na walang pakinabang o kapakinabangan at hindi nito pinatitindi ang salita hanggang “makapipinsala.”
theological_decisions:
- issue: Uri ng panawagan tungkol sa mga pinuno ng pamayanan
  choice: Ang talata ay nananawagan sa kusang pakikinig at pagbibigay-daan sa mga kinikilalang pinuno dahil sa kanilang mapagbantay at may-pananagutang paglilingkod.
  alternative: Isalin ito bilang utos ng lubos at walang-pasubaling pagsunod sa mga pinuno.
  rationale: Ang magkatambal na Πείθεσθε at ὑπείκετε ay nagpapahayag ng pagtugon sa panghihikayat at pagbibigay-daan. Hindi hinihingi ng Griyego na dagdagan ang awtoritaryong lakas ng pahayag; nakaugat ang panawagan sa pagbabantay ng mga pinunong magsusulit.
- issue: Hindi tahasang pinangalanan kung kanino magsusulit ang mga pinuno
  choice: Panatilihin ang payak na “magsusulit” nang hindi idinaragdag sa pangunahing teksto ang “sa Diyos.”
  alternative: “magsusulit sa Diyos”
  rationale: Malinaw sa teolohikal na konteksto na ang pananagutan ay sa Diyos, ngunit hindi ito tahasang nakasaad sa pariralang Griyego. Ang mas maikling salin ay nagpapanatili sa saklaw ng orihinal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “makinig” at “magbigay-daan” upang mapanatiling magkaiba ang dalawang pandiwa at maiwasan ang di-likas o labis na awtoritaryong pananalita. Ang “magsusulit” at “may daing” ay bahagyang pormal ngunit karaniwan at angkop sa tekstong panrelihiyon.
