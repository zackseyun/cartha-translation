    rationale: 'Ang ἵνα ... τοῦτο ποιῶσιν ay nagsasaad ng layunin: upang magawa nila ang kanilang pagbabantay nang may kagalakan at hindi may pagdaing. Ang binagong salin ay hindi nagdaragdag ng utos na “Gawin ninyo ito.”'
  - severity: low
