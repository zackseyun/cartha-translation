base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/010.yaml
  text: We have an altar from which those who serve at the tabernacle have no right to eat[a][b].
translation:
  language: tl
  text: Mayroon tayong altar na walang karapatang kumain mula rito ang mga naglilingkod sa tabernakulo.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas tiyak, “ang mga gumaganap ng banal na paglilingkod sa tolda/tabernakulo.” Tumutukoy ang parirala sa mga naglilingkod sa santuwaryo ng lumang tipan.
    reason: lexical_alternative
  - marker: b
    text: 'Iba-iba ang pagkaunawa sa “altar”: maaaring tumukoy kay Cristo mismo, sa krus, sa altar sa langit, o sa mga pakinabang ng paghahandog ni Cristo. Hindi na tinutukoy nang mas tiyak ng Griyego ang larawang ito rito.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔχομεν
  choice: Mayroon tayong
  rationale: Pinananatili ang payak na pangkasalukuyang pahayag at ang pagsasama ng may-akda sa kaniyang mga mambabasa.
- source_word: θυσιαστήριον
  choice: altar
  rationale: Ito ang tuwirang tawag sa dakong pinaghahandugan. Hindi ito pinalitan ng “krus” o “handog” upang hindi tukuyin nang higit sa sinasabi ng Griyego ang teolohikal na larawan.
- source_word: ἐξ οὗ
  choice: na mula roon
  rationale: Ipinahahayag nito ang pinagmumulan ng kinakain at pinananatili ang larawan ng pagkain mula sa altar.
- source_word: φαγεῖν
  choice: kumain
  rationale: Payak at likas na salin ng aorist infinitive sa loob ng pariralang nagsasaad ng kawalan ng karapatan.
- source_word: οὐκ ἔχουσιν ἐξουσίαν
  choice: walang karapatang
  rationale: Sa konteksto ng paglilingkod sa santuwaryo, ang ἐξουσία ay tumutukoy sa awtorisadong karapatan o pribilehiyong makibahagi.
- source_word: οἱ τῇ σκηνῇ λατρεύοντες
  choice: ang mga naglilingkod sa tabernakulo
  rationale: Ang λατρεύω rito ay paglilingkod na panrelihiyon sa santuwaryo, hindi lamang pangkalahatang pagsamba; ang σκηνή ay tumutukoy sa tabernakulo sa konteksto ng Hebreo.
theological_decisions:
- issue: Ang tiyak na tinutukoy ng “altar” sa Hebreo 13:10
  choice: Pinanatili ang salitang “altar” nang hindi tinutukoy sa pangunahing teksto kung ano mismo ang sinasagisag nito.
  alternative: Si Cristo mismo, ang krus, ang altar sa langit, o ang mga pakinabang ng handog ni Cristo.
  rationale: Hindi tahasang nililinaw ng Griyego ang tiyak na tinutukoy ng larawan. Ang pagpapanatili rito ay umiiwas sa sapilitang paglutas sa tunay na teolohikal na tensiyon ng talata.
translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Pinanatili ang terminong “altar” dahil karaniwan at mas natural ito kaysa sa mas teknikal na “dambana ng paghahandog”; ginamit ang “tabernakulo” upang malinaw ang kaugnayan sa santuwaryo ng lumang tipan.
