revisions:
- from: Kaya sa pamamagitan niya, patuloy[a] tayong maghandog sa Diyos ng handog na papuri—samakatuwid, ang bunga ng mga labi[b] na kumikilala[c] sa kanyang pangalan.
  to: Kaya, sa pamamagitan niya, patuloy[a] tayong maghandog sa Diyos ng handog na papuri—iyon ay, ang bunga ng mga labi[b] na hayagang kumikilala[c] sa kanyang pangalan.
  rationale: Pinalitan ang pang-ugnay na nagpapahiwatig ng kongklusyon ng isang paliwanag na katumbas ng τοῦτ’ ἔστιν. Nilinaw rin ang hayagang-confessional na saklaw ng ὁμολογούντων, habang pinanatili ang metapora, panghalip, sakripisyal na wika, at sintaktikong pag-iingat ng orihinal.
