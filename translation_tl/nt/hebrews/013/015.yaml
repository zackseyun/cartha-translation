  text: δι’ αὐτοῦ ⸀οὖν ἀναφέρωμεν θυσίαν αἰνέσεως διὰ παντὸς τῷ θεῷ, τοῦτ’ ἔστιν καρπὸν χειλέων ὁμολογούντων τῷ ὀνόματι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/015.yaml
  text: Therefore[a], through him let us continually offer up to God a sacrifice of praise—that is[c][b], the fruit of lips confessing his name.
translation:
  language: tl
  text: Kaya, sa pamamagitan niya, patuloy[a] tayong maghandog sa Diyos ng handog na papuri—iyon ay, ang bunga ng mga labi[b] na hayagang kumikilala[c] sa kanyang pangalan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “palagi” o “sa lahat ng panahon.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “bunga ng ating mga labi”; ang “ating” ay hindi tahasang nakasaad sa Griyego.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “nagpapahayag ng pagkilala sa kanyang pangalan.” Ang pandiwang Griyego ay maaaring tumukoy sa hayagang pagpapahayag o pagkilala.
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ αὐτοῦ
  choice: sa pamamagitan niya
  rationale: Pinananatili nito ang diwang namamagitan o ginagawang paraan na ipinahihiwatig ng διά na may genitive, nang hindi tahasang pinapalitan ang panghalip ng pangalan ni Cristo.
- source_word: οὖν
  choice: Kaya
  rationale: Likas at malinaw nitong ipinahahayag sa modernong Tagalog ang kongklusyon o paghihinuha mula sa naunang talakayan.
- source_word: ἀναφέρωμεν
  choice: tayong maghandog
  rationale: Isinasalin nito ang hortatory subjunctive bilang sama-samang panawagan at pinananatili ang kontekstong pansakripisyo ng pandiwa.
- source_word: θυσίαν αἰνέσεως
  choice: handog na papuri
  rationale: Natural ito sa Tagalog at nananatili rito ang larawan ng paghahandog, sa halip na gawing simpleng pagpupuri lamang.
- source_word: διὰ παντός
  choice: patuloy
  rationale: Ipinahahayag nito ang tuloy-tuloy o palagiang pagkilos na hinihingi ng parirala.
- source_word: τῷ θεῷ
  choice: sa Diyos
  rationale: Malinaw nitong tinutukoy ang Diyos bilang tumatanggap ng handog.
- source_word: τοῦτ’ ἔστιν
  choice: samakatuwid
  rationale: Ipinakikilala nito ang kasunod bilang pagpapaliwanag kung ano ang tinutukoy na handog na papuri.
- source_word: καρπὸν χειλέων
  choice: ang bunga ng mga labi
  rationale: Pinananatili ang metapora at ang alusyon sa wikang pansakbanal; hindi idinagdag sa pangunahing teksto ang salitang “ating,” na wala namang tahasang katumbas sa Griyego.
- source_word: ὁμολογούντων
  choice: na kumikilala
  rationale: Ang “kumikilala” ay natural sa Tagalog at naipapahayag ang diwa ng hayagan o malinaw na pagkilala; inilalahad sa talababa ang mas tahasang alternatibong “nagpapahayag.”
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: sa kanyang pangalan
  rationale: Pinananatili nito ang “pangalan” bilang layon ng pagkilala at ang panghalip na nasa orihinal, nang hindi nililinaw nang higit sa teksto ang tinutukoy nito.
theological_decisions:
- issue: Ang tinutukoy ng “niya” sa δι’ αὐτοῦ
  choice: Pinanatili ang panghalip na “niya,” na sa konteksto ay tumutukoy kay Jesus bilang siyang pinagdaraanan ng paghahandog sa Diyos.
  alternative: Tahasan itong gawing “sa pamamagitan ni Jesus” o iwan nang walang paliwanag ang kontekstuwal na diwa ng pamamagitan.
  rationale: Malinaw sa kalapit na konteksto ng Hebreo ang kaugnayan kay Jesus, ngunit ang mismong talata ay gumagamit ng panghalip. Pinananatili ng salin kapwa ang anyo ng teksto at ang diwa ng pamamagitan.
- issue: Lakas ng larawang pansakripisyo
  choice: Pinanatili ang “maghandog” at “handog na papuri.”
  alternative: Payak na isaling “palagi tayong magpuri sa Diyos.”
  rationale: Sinasadya ng talata ang bokabularyo ng paghahandog. Ang pagpapanatili nito ay mahalaga sa ugnayan ng papuri at sakripisyo sa argumento ng Hebreo, nang hindi nagdaragdag ng natatanging doktrinal na paliwanag.
- issue: Saklaw ng ὁμολογούντων
  choice: Isinalin bilang “kumikilala,” na may talababa para sa “hayagang nagpapahayag.”
  alternative: Isalin bilang “nagpapasalamat” o “pumupuri.”
  rationale: Mas malawak ang pandiwa kaysa simpleng pasasalamat o pagpupuri at maaaring tumukoy sa hayagang pagpapahayag o pagkilala. Hindi dapat paliitin ang kahulugan nito nang walang sapat na batayan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Pinanatili ang mga larawang “handog” at “bunga ng mga labi,” ngunit inayos ang pangungusap upang maging likas sa karaniwang mambabasang Tagalog. Ginamit ang “kanyang” alinsunod sa pangkalahatang modernong baybay.
