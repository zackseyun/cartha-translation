  text: Προσεύχεσθε περὶ ἡμῶν, ⸀πειθόμεθα γὰρ ὅτι καλὴν συνείδησιν ἔχομεν, ἐν πᾶσιν καλῶς θέλοντες ἀναστρέφεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/018.yaml
  text: Pray for us[a], for we are convinced that we have a good conscience[c][b], since we want to conduct ourselves well in everything.
translation:
  language: tl
  text: Ipanalangin ninyo kami, sapagkat kumbinsido kami[a] na mabuti ang aming konsensiya[b], yamang nais naming mamuhay nang maayos sa lahat ng bagay.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nakatitiyak kami” o “naniniwala kami nang buong katiyakan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “malinis ang aming konsensiya.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “nagnanais kaming mamuhay nang marangal sa lahat ng bagay.”
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: Προσεύχεσθε
  choice: Ipanalangin ninyo
  rationale: Likas na pautos sa maramihang kausap. Hindi tahasang dinagdagan ng “patuloy” sapagkat bagaman maaaring magpahiwatig ng nagpapatuloy na kilos ang aspektong pangkasalukuyan, hindi iyon kailangang gawing hayag.
- source_word: περὶ ἡμῶν
  choice: kami
  rationale: 'Sa pananalangin, ang περί na may genitive ay likas na isinasalin sa Filipino sa pamamagitan ng hulaping layon sa “ipanalangin”: “ipanalangin ... kami.”'
- source_word: πειθόμεθα
  choice: kumbinsido kami
  rationale: Pinananatili ang diwang kognitibo ng matatag na paniniwala. Ang “nakatitiyak” ay maaari rin ngunit bahagyang mas mariin.
- source_word: καλὴν συνείδησιν
  choice: mabuti ang aming konsensiya
  rationale: Tuwirang pinananatili ang malawak na kahulugan ng καλὴν bilang “mabuti.” Ang mas idyomatikong “malinis ang konsensiya” ay posibleng salin ngunit mas tiyak ang interpretasyon.
- source_word: ἐν πᾶσιν
  choice: sa lahat ng bagay
  rationale: Komprehensibong pariralang pang-abay na natural at malinaw sa modernong Filipino.
- source_word: καλῶς
  choice: nang maayos
  rationale: Malawak at natural na katumbas na hindi nililimitahan ang diwa sa “marangal” o “tama” lamang.
- source_word: θέλοντες
  choice: yamang nais naming
  rationale: Ipinahahayag ang patuloy na hangarin at ginagawang malinaw sa Filipino ang posibleng paliwanag o ugnayang sanhi ng participle, nang hindi ito ginagawang labis na tiyak.
- source_word: ἀναστρέφεσθαι
  choice: mamuhay
  rationale: Sa kontekstong etikal, tumutukoy ito sa asal o paraan ng pamumuhay; mas likas sa Filipino ang “mamuhay” kaysa sa literal na “dalhin ang aming sarili.”
theological_decisions:
- issue: Ugnayan ng panghuling participial clause sa pahayag tungkol sa mabuting konsensiya
  choice: “yamang nais naming mamuhay nang maayos sa lahat ng bagay” bilang paliwanag o banayad na sanhi
  alternative: “na nagnanais mamuhay nang maayos sa lahat ng bagay,” na mas pormal na nagpapanatili sa participial na pagkakabit
  rationale: Maaaring magpaliwanag ang θέλοντες sa batayan o katangian ng mabuting konsensiya. Ang “yamang” ay natural sa Filipino ngunit hindi ipinahihiwatig na inaangkin ng mga nagsasalita ang kawalang-kasalanan.
translation_notes:
  register: Modernong Filipino na magalang at angkop sa pampublikong pagbasa. Ginamit ang karaniwang “konsensiya” sa halip na mas pormal ngunit hindi gaanong pangkaraniwang “budhi.”
