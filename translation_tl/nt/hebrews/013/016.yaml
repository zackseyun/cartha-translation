id: HEB.13.16
reference: Hebrews 13:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τῆς δὲ εὐποιΐας καὶ κοινωνίας μὴ ἐπιλανθάνεσθε, τοιαύταις γὰρ θυσίαις εὐαρεστεῖται ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/016.yaml
  text: And do not neglect doing good and sharing[b][a], for with such sacrifices God is pleased.
translation:
  language: tl
  text: At huwag ninyong kaligtaan[a] ang paggawa ng mabuti at ang pagbabahagi[b], sapagkat nalulugod ang Diyos sa gayong mga hain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “huwag ninyong limutin.” Literal na tumutukoy sa paglimot ang pandiwang Griyego, ngunit dito ay kasama ang diwa ng pagpapabaya na isagawa ang mga ito.
    reason: lexical_alternative
  - marker: b
    text: Ang “pagbabahagi” ay maaari ring isalin na “pakikibahagi,” “pagkakaisa,” o “pagiging bukas-palad.” Sa kontekstong ito, malamang na tumutukoy ito sa praktikal na pagbabahagi ng mga pag-aari o tulong sa iba.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐποιΐας
  choice: paggawa ng mabuti
  rationale: Likas at malinaw na Filipino ito para sa aktibong paggawa ng kabutihan, at pinananatili nito ang diwang kilos ng pangngalan.
- source_word: κοινωνίας
  choice: pagbabahagi
  rationale: Sa pagkakaugnay nito sa paggawa ng mabuti at sa mga hain, malamang na tumutukoy ito sa praktikal na pagbabahagi ng pag-aari o tulong, ngunit hindi nito labis na nililimitahan ang saklaw.
- source_word: μὴ ἐπιλανθάνεσθε
  choice: huwag ninyong kaligtaan
  rationale: Pinananatili ng “kaligtaan” ang literal na diwa ng paglimot at likas ding nagpapahiwatig ng pagpapabaya sa pagsasagawa ng tungkulin.
- source_word: τοιαύταις ... θυσίαις
  choice: sa gayong mga hain
  rationale: Pinananatili ng “mga hain” ang tahasang talinghagang pansamba, kung saan ang paggawa ng mabuti at pagbabahagi ay itinuturing na mga haing nakalulugod sa Diyos.
- source_word: εὐαρεστεῖται
  choice: nalulugod
  rationale: Karaniwan, marangal, at tuwirang katumbas ito ng pagiging nasisiyahan o nalulugod.
- source_word: ὁ θεός
  choice: ang Diyos
  rationale: Pamantayang salin ng tiyak na simuno sa Griyego.
- source_word: δὲ
  choice: At
  rationale: Ikinakabit nito ang tagubiling ito sa naunang konteksto nang walang matinding pagsalungat.
theological_decisions:
- issue: Kalikasan ng “mga hain” sa talata
  choice: Talinghagang tumutukoy sa paggawa ng mabuti at pagbabahagi bilang mga haing nakalulugod sa Diyos
  alternative: Ituring lamang itong limos o pangkalahatang mabuting asal nang walang diin sa paghahain
  rationale: Tahasan ang wikang panghain sa Griyego. Pinananatili ng salin ang talinghaga nang hindi ito nililimitahan sa limos lamang o pinapawi ang kaugnayan nito sa pagsamba.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga hain” sa halip na mas pangkalahatang “mga handog” upang mapanatili ang tiyak na talinghagang pansakripisyo ng Griyego.
