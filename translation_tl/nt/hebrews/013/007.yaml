source:
  edition: SBLGNT
  text: Μνημονεύετε τῶν ἡγουμένων ὑμῶν, οἵτινες ἐλάλησαν ὑμῖν τὸν λόγον τοῦ θεοῦ, ὧν ἀναθεωροῦντες τὴν ἔκβασιν τῆς ἀναστροφῆς μιμεῖσθε τὴν πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/007.yaml
  text: Remember your leaders[a], who spoke the word of God to you. As you consider the outcome of their way of life[b], imitate their faith.
translation:
  language: tl
  text: Patuloy ninyong alalahanin ang inyong mga pinuno, na nagpahayag sa inyo ng salita ng Diyos. Habang maingat ninyong isinasaalang-alang ang kinahinatnan[a] ng kanilang pamumuhay, tularan ninyo ang kanilang pananampalataya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ding “wakas”; sa ilang pagpapakahulugan, tumutukoy ito lalo na sa paraan ng kanilang pagkamatay.
    reason: lexical_alternative
  - marker: b
    text: O “katapatan.” Maaaring mangahulugan ang salitang Griyego ng pananampalataya o katapatan.
    reason: alternative_reading
lexical_decisions:
- source_word: Μνημονεύετε
  choice: Patuloy ninyong alalahanin
  rationale: Ipinahahayag ng pangkasalukuyang pautos ang nagpapatuloy na pag-alaala; malinaw at natural sa Filipino ang “patuloy ninyong alalahanin.”
- source_word: τῶν ἡγουμένων ὑμῶν
  choice: ang inyong mga pinuno
  rationale: Tumutukoy ito sa mga kinikilalang nangunguna sa pamayanan; pinananatili ng “mga pinuno” ang tunay nilang awtoridad nang walang labis na politikal na pahiwatig.
- source_word: οἵτινες ἐλάλησαν ὑμῖν τὸν λόγον τοῦ θεοῦ
  choice: na nagsalita sa inyo ng salita ng Diyos
  rationale: Tuwirang isinasalin ang ἐλάλησαν bilang “nagsalita” at pinananatili ang karaniwang biblikal na pariralang “salita ng Diyos.”
- source_word: ἀναθεωροῦντες
  choice: Habang maingat ninyong isinasaalang-alang
  rationale: Ipinahihiwatig ng pandiwaring Griyego ang masusing pagmamasid at pagninilay, hindi lamang panandaliang pagtingin.
- source_word: τὴν ἔκβασιν
  choice: ang kinahinatnan
  rationale: Saklaw ng “kinahinatnan” ang bunga o wakas nang hindi tiyak na ipinapalagay na kamatayan o pagkamartir ang tinutukoy.
- source_word: τῆς ἀναστροφῆς
  choice: ng kanilang pamumuhay
  rationale: Ang ἀναστροφή ay tumutukoy sa asal o paraan ng pamumuhay; natural at malawak ang “pamumuhay” sa modernong Filipino.
- source_word: μιμεῖσθε
  choice: tularan ninyo
  rationale: Tuwirang pautos ito; malinaw at likas sa Filipino ang “tularan.”
- source_word: τὴν πίστιν
  choice: ang kanilang pananampalataya
  rationale: Maaaring mangahulugan ang πίστις ng pananampalataya o katapatan. Sinusunod ng pangunahing teksto ang karaniwang saling “pananampalataya,” habang inilalagay sa talababa ang tunay na alternatibo.
theological_decisions:
- issue: Kahulugan ng πίστις bilang katangiang dapat tularan
  choice: pananampalataya
  alternative: katapatan
  rationale: Parehong maaaring umangkop sa konteksto ang pananampalataya at katapatan. Pinananatili sa pangunahing teksto ang karaniwang salin, ngunit hindi inaalis ang alternatibong kahulugan.
- issue: Kung ang ἔκβασις ay tiyak na tumutukoy sa kamatayan o pagkamartir ng mga pinuno
  choice: kinahinatnan
  alternative: wakas; sa ilang pagpapakahulugan, paraan ng kanilang pagkamatay
  rationale: Maaaring tumukoy ang salita sa resulta o wakas, ngunit hindi tahasang sinasabi ng talata na pagkamartir ang tinutukoy. Iniiwasan ng “kinahinatnan” ang labis na pagtitiyak.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “ninyo” para sa maramihang kausap at pinanatili ang pamilyar na biblikal na pariralang “salita ng Diyos.”
