source:
  edition: SBLGNT
  text: διδαχαῖς ποικίλαις καὶ ξέναις μὴ παραφέρεσθε· καλὸν γὰρ χάριτι βεβαιοῦσθαι τὴν καρδίαν, οὐ βρώμασιν, ἐν οἷς οὐκ ὠφελήθησαν οἱ ⸀περιπατοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/009.yaml
  text: Do not be carried away by various and strange teachings[a], for it is good for the heart to be strengthened by grace, not by foods[c][b], by which those who occupied themselves with them were not benefited.
translation:
  language: tl
  text: Huwag kayong matangay ng iba’t iba at kakaibang mga turo. Sapagkat mabuting mapatatag ang puso sa pamamagitan ng biyaya, hindi sa pamamagitan ng mga pagkain[a]; hindi nakinabang ang mga namuhay ayon sa mga ito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga pagkain” ay maaaring tumukoy sa mga gawi o pagtalima na may kaugnayan sa pagkain; “mga pagkain” lamang ang tahasang sinasabi sa Griyego.
    reason: cultural_note
  - marker: b
    text: 'O “ang mga nag-ukol ng kanilang sarili sa mga ito.” Literal: “ang mga lumakad sa mga ito.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διδαχαῖς ποικίλαις καὶ ξέναις
  choice: sari-sari at kakaibang mga turo
  rationale: Ang “sari-sari” ay likas na Filipino para sa ποικίλαις, at ang “kakaiba” ay nagpapanatili sa babalang diwa ng ξέναις nang hindi ito ginagawang usapin ng lahi o bansang pinagmulan.
- source_word: μὴ παραφέρεσθε
  choice: Huwag kayong magpadala
  rationale: Ipinahihiwatig nito ang pagpapaanod o pagpapadala sa impluwensiya ng mga turo, at natural itong pakinggan bilang patuloy na babala sa Filipino.
- source_word: χάριτι βεβαιοῦσθαι τὴν καρδίαν
  choice: patatagin ang puso sa pamamagitan ng biyaya
  rationale: Pinananatili ng “patatagin” ang saklaw ng βεβαιόω bilang pagpapatibay o pagpapalakas, habang malinaw na ipinakikita ng “sa pamamagitan ng” ang biyaya bilang paraan.
- source_word: οὐ βρώμασιν
  choice: hindi ng mga pagkain
  rationale: Tuwirang isinasalin ang βρώμασιν bilang “mga pagkain” upang hindi ipasok sa pangunahing teksto ang mas tiyak na interpretasyong mga tuntunin sa pagkain o mga ritwal na may kinalaman dito.
- source_word: οἱ περιπατοῦντες
  choice: ang mga namuhay ayon sa mga iyon
  rationale: Metaporikal ang περιπατέω para sa paraan ng pamumuhay o asal. Ang “namuhay ayon sa mga iyon” ay natural sa Filipino at pinananatili ang ideya ng pag-aayos ng buhay ayon sa mga gawaing may kinalaman sa pagkain.
- source_word: οὐκ ὠφελήθησαν
  choice: hindi nakinabang
  rationale: Malinaw at natural nitong ipinahahayag na walang pakinabang na natamo ang mga taong tinutukoy.
theological_decisions:
- issue: Ang tinutukoy ng “mga pagkain” at ang kaibahan nito sa biyaya
  choice: Panatilihin sa pangunahing teksto ang literal na “mga pagkain,” habang ipinapaliwanag sa talababa na maaaring tumukoy ito sa mga gawaing o pagtalimang may kinalaman sa pagkain.
  alternative: Tahasang isalin bilang “mga tuntunin sa pagkain” o paliitin sa “mga handog na pagkain.”
  rationale: Hindi tinutukoy nang mas eksakto ng βρώμασιν kung mga batas sa pagkain, ritwal, o sakripisyal na pagkain ang ibig sabihin. Pinananatili ng literal na salin ang tunay na lawak at kalabuan ng teksto.
- issue: Metaporikal na diwa ng “puso”
  choice: Panatilihin ang “puso.”
  alternative: Isalin bilang “isip,” “kalooban,” o “panloob na pagkatao.”
  rationale: Ang καρδία ay may malawak na biblikal na diwa bilang sentro ng panloob na pagkatao; ang “puso” ay nagpapanatili sa larawang ito nang hindi ito nililimitahan.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “magpadala” at “namuhay ayon” bilang natural na paglilipat ng mga metaporang Griyego, habang pinanatili ang mahahalagang salitang “biyaya,” “puso,” at “mga pagkain.”
