revisions:
- from: Huwag kayong magpadala sa sari-sari at kakaibang mga turo. Sapagkat mabuting patatagin ang puso sa pamamagitan ng biyaya, hindi ng mga pagkain[a]; hindi nakinabang ang mga namuhay ayon sa mga iyon.[b]
  to: Huwag kayong matangay ng iba’t iba at kakaibang mga turo. Sapagkat mabuting mapatatag ang puso sa pamamagitan ng biyaya, hindi sa pamamagitan ng mga pagkain[a]; hindi nakinabang ang mga namuhay ayon sa mga ito.[b]
  rationale: Inayos ang tinig ng pandiwang tumutukoy sa puso upang maipakita ang balintiyak na βεβαιοῦσθαι, ginawang higit na likas ang metapora ng babala, at itinuwid ang gramatika ng talababa. Pinanatili ang literal na 'mga pagkain,' ang terminong 'biyaya,' at ang sinadyang kalabuan hinggil sa uri ng mga gawi sa pagkain.
