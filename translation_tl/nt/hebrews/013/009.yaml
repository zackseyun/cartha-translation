  source_fidelity: 'Ang draft ay pangkalahatang tapat sa Griyego: napananatili ang babala laban sa iba’t iba at banyaga/kakaibang turo, ang pagtitibay ng puso sa biyaya, at ang di-pakinabang ng mga pagkain para sa mga namuhay ayon sa mga ito. Gayunman, ang ''patatagin ang puso'' ay aktibo, samantalang ang βεβαιοῦσθαι ay infinitibong balintiyak; mas tumpak ang ''mapatatag ang puso.'''
