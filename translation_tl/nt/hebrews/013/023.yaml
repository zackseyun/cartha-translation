  text: Know that our brother Timothy has been released[a], with whom I will see you if he comes soon.
translation:
  language: tl
  text: Alamin ninyo na pinalaya na ang kapatid nating si Timoteo.[a] Kung makararating siya nang mas maaga, makikita ko kayo kasama niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nakalaya na”; maaaring tumukoy sa paglaya mula sa pagkakabilanggo. Maaari ring mangahulugan ang pandiwa na “pinaalis na” o “pinauwi na,” ngunit malamang na “pinalaya na” ang diwa sa kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: γινώσκετε
  choice: Dapat ninyong malaman
  rationale: Pinananatili ang pautos na diwa ng pangkasalukuyang imperatibo, habang natural na ipinahahayag sa modernong Tagalog ang pagbibigay-alam sa mga mambabasa.
- source_word: τὸν ἀδελφὸν ἡμῶν
  choice: ang kapatid nating
  rationale: Likas na salin ng katawagang pampamilya sa pamayanang Cristiano at malinaw na tumutukoy kay Timoteo.
- source_word: Τιμόθεον
  choice: si Timoteo
  rationale: Ginamit ang karaniwang anyo ng pangalang ito sa Tagalog, na may angkop na pantukoy na 'si.'
- source_word: ἀπολελυμένον
  choice: pinalaya na
  rationale: Ipinahahayag ang ganap na kilos ng perfect passive participle at ang patuloy na kabuluhan nito. Malamang na tumutukoy ito sa paglaya mula sa pagkakabilanggo o pagpigil, ngunit inilalahad sa talababa ang iba pang posibleng kahulugan.
- source_word: μεθ’ οὗ
  choice: kasama ko siya
  rationale: Natural na binabago ang literal na 'kasama niya' ayon sa pangungusap sa Tagalog, habang pinananatiling si Timoteo ang makakasama ng sumulat.
- source_word: ἐὰν τάχιον ἔρχηται
  choice: Kung darating siya agad
  rationale: Pinananatili ang kondisyong nakasalalay sa maagang pagdating ni Timoteo. Ang 'agad' ay natural dito at naghahatid ng diwa ng συγκριτικό na τάχιον bilang 'mas maaga/sa lalong madaling panahon.'
- source_word: ὄψομαι ὑμᾶς
  choice: makikipagkita sa inyo
  rationale: Natural na Tagalog para sa literal na 'makikita ko kayo' sa konteksto ng isang inaasahang personal na pagdalaw, nang hindi labis na dinaragdagan ang kahulugan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, magalang, at angkop sa publikong pagbasa. Ginamit ang 'kapatid nating si Timoteo' bilang likas na katawagang Cristiano at inayos ang huling sugnay upang maging matatas sa Tagalog habang pinananatili ang kondisyon at ang papel ni Timoteo sa inaasahang pagkikita.
