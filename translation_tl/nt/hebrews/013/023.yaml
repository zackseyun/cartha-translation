  source_fidelity: 'Ang huling pangungusap ng draft ay naglilipat ng kilos sa kay Timoteo: ang Griyego ay nagsasabing ang sumulat ang makakikita sa mga mambabasa, kasama si Timoteo. Ang pang-abay na τάχιον ay comparative sa anyo at mas mabuting maipakita bilang “nang mas maaga.” Ang “pinalaya na” ay katanggap-tanggap na pangunahing salin ng ἀπολελυμένον kung may talababa na nagpapanatili ng ibang posibleng pakahulugan.'
  naturalness: Natural ang “Alamin ninyo” sa magalang at pampublikong rehistro. Ang “makikita ko kayo kasama niya” ay tuwiran at malinaw na Tagalog; iniiwasan nito ang hindi likas at maling “kasama ko siyang makikipagkita sa inyo.”
  terminology: Ang “kapatid nating si Timoteo” ay angkop na salin ng τὸν ἀδελφὸν ἡμῶν Τιμόθεον. Pinananatili ng “pinalaya na” ang perfect passive na may resulta sa kasalukuyan, habang nililinaw ng talababa na hindi tiyak sa salita mismo ang pagkakabilanggo.
