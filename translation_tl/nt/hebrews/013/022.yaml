  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, ἀνέχεσθε τοῦ λόγου τῆς παρακλήσεως, καὶ γὰρ διὰ βραχέων ἐπέστειλα ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/022.yaml
  text: I urge you[a], brothers, bear with this word of exhortation[b], for I have written to you briefly.
translation:
  language: tl
  text: Nakikiusap ako sa inyo, mga kapatid[a], na pagtiisan ninyo ang mensaheng ito ng paghimok[b], sapagkat maikli lamang ang isinulat ko sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga kapatid” ay maaaring tumukoy sa buong kongregasyon, kapwa lalaki at babae.
    reason: lexical_alternative
  - marker: b
    text: Ang “mensaheng ito ng paghimok” ay maaari ding isaling “mensaheng ito ng pagpapalakas-loob” o “mensaheng ito ng pagpapayo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: Nakikiusap ako
  rationale: Ipinahahayag nito ang taimtim ngunit magalang na pakiusap ng may-akda; mas natural ito sa modernong Filipino kaysa sa pormal na “ipinamamanhik ko.”
- source_word: δὲ
  choice: hindi tahasang isinalin
  rationale: Banayad na panandang transisyon ang δέ rito. Sapat nang ipinakikita ng bagong pangungusap at ng konteksto ang paglipat sa pangwakas na pakiusap; ang pagdaragdag ng “ngayon” ay maaaring magbigay ng temporal na diwa na wala sa Griyego.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Ang karaniwang Filipino na “mga kapatid” ay likas na salin ng pangmaramihang tawag na ἀδελφοί at maaari ring tumukoy sa buong kongregasyon nang hindi kinakailangang tukuyin ang kasarian.
- source_word: ἀνέχεσθε
  choice: pagtiisan ninyo
  rationale: Pinananatili nito ang diwa ng matiyagang pagtanggap o pagtitiis sa mensahe. Mas malapit ito sa lakas ng ἀνέχομαι kaysa sa mas makitid na “pakinggan ninyo.”
- source_word: τοῦ λόγου τῆς παρακλήσεως
  choice: ang mensaheng ito ng pagpapayo
  rationale: Ang λόγος ay tumutukoy sa ipinahahayag na mensahe, samantalang ang παράκλησις ay maaaring mangahulugang pagpapayo, paghimok, o pagpapalakas-loob. Ang “pagpapayo” ay malinaw at marangal sa kontekstong ito; ang “ito” ay likas na tumutukoy sa kasalukuyang sulat bagaman pahiwatig lamang sa Griyego.
- source_word: καὶ γὰρ
  choice: sapagkat
  rationale: Ipinakikita ng parirala ang paliwanag o dahilan ng naunang pakiusap. Likas na naihahatid ito sa Filipino ng “sapagkat” nang hindi mekanikal na isinasalin ang bawat kataga.
- source_word: διὰ βραχέων
  choice: maikli lamang
  rationale: Likas na Filipino para sa idyomang nangangahulugang “sa maikling paraan” o “sa iilang salita.” Nakapokus ito sa relatibong ikli ng isinulat.
- source_word: ἐπέστειλα ὑμῖν
  choice: ang isinulat ko sa inyo
  rationale: Sa kontekstong epistolaryo, tumutukoy ang aorist sa sulat na natanggap at binabasa ng mga tagapakinig. Ang payak na aspektong Filipino ay natural at hindi labis na tinutukoy ang panahunan.
theological_decisions:
- issue: Saklaw ng ἀδελφοί
  choice: mga kapatid
  alternative: mga kapatid na lalaki; mga kapatid na lalaki at babae
  rationale: Bagaman panggramatikang panlalaki ang Griyego, ang Filipino na “mga kapatid” ay tumpak at likas, at maaari nitong saklawin ang buong kongregasyon. Iniiwasan nitong magdagdag ng kasariang hindi kailangang tahasang sabihin sa target na wika.
- issue: Diwa ng παράκλησις
  choice: pagpapayo
  alternative: pagpapalakas-loob; paghimok
  rationale: May saklaw ang salita mula sa pagpapayo at paghimok hanggang sa pagpapalakas-loob. Pinili ang “pagpapayo” dahil akma ito sa nilalaman ng Hebreo, habang pinananatili sa talababa ang lehitimong alternatibo.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “nakikiusap,” “pagtiisan,” at “sapagkat” upang mapanatili ang taimtim na tono nang hindi maging makaluma o sobrang pormal.
