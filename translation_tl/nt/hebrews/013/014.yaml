  text: οὐ γὰρ ἔχομεν ὧδε μένουσαν πόλιν, ἀλλὰ τὴν μέλλουσαν ἐπιζητοῦμεν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/014.yaml
  text: For we do not have a lasting city here[a], but we seek the one that is to come.
translation:
  language: tl
  text: Sapagkat wala tayong lungsod dito na nananatili, kundi hinahanap natin ang lungsod na darating.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Sapagkat wala
  rationale: Isinasalin ng “sapagkat” ang paliwanag na ugnayan ng γάρ sa naunang pahayag, habang tuwirang ipinahahayag ng “wala” ang negasyon.
- source_word: ἔχομεν
  choice: tayong ... [mayroon]
  rationale: Likas sa Filipino ang konstruksyong “wala tayong lungsod” bilang katumbas ng “hindi tayo mayroong lungsod,” at malinaw nitong pinananatili ang unang panauhang maramihan.
- source_word: ὧδε
  choice: dito
  rationale: Pinananatili ang payak na deiktikong kahulugan na “dito” at hindi ito pinalalawak tungo sa interpretasyong “sa lupa.”
- source_word: μένουσαν
  choice: na nananatili
  rationale: Ang present participle ay naglalarawan sa lungsod bilang nananatili o nagpapatuloy; ang “na nananatili” ay natural at malapit sa anyong Griyego.
- source_word: πόλιν
  choice: lungsod
  rationale: Pinananatili ang kongkretong larawan ng πόλις at iniiwasang palitan ito ng interpretatibong “langit” o “tinubuang-bayan.”
- source_word: ἀλλὰ
  choice: kundi
  rationale: Pagkatapos ng negatibong sugnay, natural na ipinakikita ng “kundi” ang mariing pagsalungat sa hinahanap na lungsod.
- source_word: τὴν μέλλουσαν
  choice: ang lungsod na darating
  rationale: Ang feminine participle ay tumutukoy pabalik sa πόλιν. Inuulit ang “lungsod” sa Filipino para sa linaw, habang pinananatili ng “na darating” ang hinaharap na diwa ng μέλλω.
- source_word: ἐπιζητοῦμεν
  choice: hinahanap natin
  rationale: Ipinahahayag nito ang aktibong paghahanap o paghahangad nang hindi nagdaragdag ng antas ng kasabikang hindi tahasang kailangang ilagay sa teksto.
theological_decisions:
- issue: Kalikasan ng larawang “lungsod”
  choice: Panatilihin ang “lungsod” bilang larawan ng darating na hantungan o kaayusan ng mga mananampalataya.
  alternative: “langit,” “makalangit na lungsod,” o “makalangit na Jerusalem”
  rationale: Hindi tahasang tinutukoy ng talata ang langit o Jerusalem. Ang pagpapanatili sa “lungsod” ay sumusunod sa mismong salita ng teksto at hindi inuunahan ang mas malawak na teolohiya ng Hebreo.
translation_notes:
  register: Modernong Filipino na simple, marangal, at madaling maunawaan. Ginamit ang “Sapagkat” upang malinaw na iugnay ang talata sa naunang pangangatwiran; iniwasan ang mas lumang “namamalagi” at ang interpretatibong “sa mundong ito.”
