  text: Let brotherly love continue[a].
translation:
  language: tl
  text: Magpatuloy ang inyong pagmamahalan bilang magkakapatid[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pag-ibig sa kapwa mananampalataya.” Ang salitang Griyego ay tumutukoy sa pagmamahalang tulad ng sa magkakapamilya sa loob ng sambayanan ng mga mananampalataya, hindi lamang sa mga lalaki.
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλαδελφία
  choice: pagmamahalan bilang magkakapatid
  rationale: Ipinahahayag nito ang kapamilyang pag-ibig sa loob ng sambayanan ng mga mananampalataya. Pinananatili ng “bilang magkakapatid” ang metaporang pampamilya ng Griyego, samantalang ipinakikita ng “pagmamahalan” na ito ay pag-ibig sa isa’t isa.
- source_word: μενέτω
  choice: Magpatuloy
  rationale: Ang kasalukuyang pautos ng μένω ay humihiling na manatili at magpatuloy ang umiiral na kalagayan; natural na naihahatid ito ng “Magpatuloy.”
- source_word: Ἡ
  choice: ang inyong
  rationale: Ang artikulo ay tumutukoy sa kinikilalang uri ng pag-ibig na dapat manaig sa mga kausap. Ginagawang likas sa Filipino ng “ang inyong” ang tiyak na pagtukoy, bagaman ang panghalip na paari ay implicit sa konteksto at hindi hiwalay na salita sa Griyego.
theological_decisions:
- issue: Saklaw ng φιλαδελφία at ang wikang pampamilya
  choice: pagmamahalan bilang magkakapatid
  alternative: pag-ibig sa kapwa mananampalataya; pag-ibig sa isa’t isa
  rationale: Pinananatili ng salin ang larawan ng isang pamilya sa halip na gawing pangkalahatang “pag-ibig” lamang. Sa kontekstong Kristiyano, saklaw nito ang lahat ng kapwa mananampalataya at hindi lamang mga lalaking literal na magkakapatid.
translation_notes:
  register: Modernong Filipino na maikli, marangal, at madaling maunawaan. Pinananatili ang metaporang pampamilya ng orihinal habang nililinaw sa talababa ang saklaw nito.
