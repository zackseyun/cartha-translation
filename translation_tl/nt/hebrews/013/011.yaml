base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/011.yaml
  text: For the bodies of those animals whose blood is brought into the holy places for sin by the high priest are burned outside the camp[a][b].
translation:
  language: tl
  text: Sapagkat ang mga katawan ng mga hayop na ang dugo ay dinadala ng punong pari sa mga banal na lugar[a] para sa kasalanan ay lubusang sinusunog sa labas ng kampo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa santuwaryo.” Sa Griyego, “sa mga banal na lugar,” isang katawagang panritwal para sa sagradong nasasakupan ng santuwaryo.
    reason: lexical_alternative
  - marker: b
    text: O “ay sinusunog.” Maaaring idiin ng pandiwa ang lubusang pagsunog.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν ... ζῴων / τούτων τὰ σώματα
  choice: ang mga katawan ng mga hayop na
  rationale: Pinagsama nang natural sa Tagalog ang kaugnay na panghalip at ang muling pagtukoy ng demonstratibo, habang malinaw na mga hayop na inihahandog ang tinutukoy.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Nagpapakilala ito ng paliwanag na sumusuporta sa naunang pahayag.
- source_word: εἰσφέρεται
  choice: ay dinadala ... sa
  rationale: Pinananatili ang pangkasalukuyang anyong balintiyak at ang pagpasok ng dugo sa sagradong lugar.
- source_word: τὸ αἷμα
  choice: ang dugo
  rationale: Tuwirang katawagang panghain; hindi kailangang ipaliwanag sa paraphrase.
- source_word: περὶ ἁμαρτίας
  choice: dahil sa kasalanan
  rationale: Ipinahahayag ang kaugnayan ng ritwal sa kasalanan nang hindi nililimitahan ang parirala sa teknikal na katawagang “handog para sa kasalanan.”
- source_word: εἰς τὰ ἅγια
  choice: sa mga banal na dako
  rationale: Pinananatili ang anyong maramihan at ang malawak na saklaw ng sagradong lugar sa halip na tukuyin agad bilang Kabanal-banalang Dako.
- source_word: διὰ τοῦ ἀρχιερέως
  choice: ng punong pari
  rationale: Natural na ipinahahayag sa Tagalog ang ahensiya ng punong pari.
- source_word: κατακαίεται
  choice: ay lubusang sinusunog
  rationale: Inililitaw ang masidhing diwa ng pandiwa na maaaring tumukoy sa ganap na pagsunog.
- source_word: ἔξω τῆς παρεμβολῆς
  choice: sa labas ng kampo
  rationale: Karaniwan at malinaw na katawagan para sa kampo ng Israel sa kontekstong tabernakulo at ilang.
theological_decisions:
- issue: Saklaw ng εἰς τὰ ἅγια
  choice: sa mga banal na dako
  alternative: sa santuwaryo; sa Kabanal-banalang Dako
  rationale: May antas ng kaluwagan ang gamit ng Hebreo sa τὰ ἅγια para sa sagradong nasasakupan. Hindi sapilitang nililinaw ng Griyego rito na tanging Kabanal-banalang Dako ang tinutukoy, kaya pinananatili ang mas malawak at maramihang pahayag.
- issue: Kahulugan ng περὶ ἁμαρτίας
  choice: dahil sa kasalanan
  alternative: bilang handog para sa kasalanan; para sa kasalanan
  rationale: Pinananatili ang kaugnayan sa kasalanan nang hindi ipinapalagay na ang parirala mismo ay isang ganap na teknikal na pangalan ng uri ng handog.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “punong pari,” “mga banal na dako,” at “kampo” upang mapanatili ang kontekstong panritwal nang hindi maging labis na teknikal. Inilagay ang [a] kasunod ng “mga banal na dako” at ang [b] kasunod ng buong pahayag tungkol sa pagsunog upang malinaw ang kani-kanilang saklaw.
