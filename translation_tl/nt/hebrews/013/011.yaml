  naturalness: Maayos ang pangungusap, ngunit mas karaniwan at mas natural sa makabagong Filipino ang “mga banal na lugar” kaysa “mga banal na dako,” habang napananatili ang maramihang saklaw ng Griyegong τὰ ἅγια. Ang “lubusang sinusunog” ay angkop para sa masidhing κατακαίεται.
  terminology: Ang “punong pari,” “kampo,” at “mga banal na lugar” ay malinaw, marangal, at angkop sa kontekstong panritwal. Hindi tinutukoy ang τὰ ἅγια bilang Kabanal-banalang Dako, kaya napananatili ang saklaw at ambigwidad ng pinagmulan.
