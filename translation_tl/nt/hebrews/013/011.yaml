revisions:
- from: Sapagkat ang mga katawan ng mga hayop na ang dugo ay dinadala ng punong pari sa mga banal na dako[a] dahil sa kasalanan ay lubusang sinusunog sa labas ng kampo.[b]
  to: Sapagkat ang mga katawan ng mga hayop na ang dugo ay dinadala ng punong pari sa mga banal na lugar[a] para sa kasalanan ay lubusang sinusunog sa labas ng kampo.[b]
  rationale: Pinalitan ang “dahil sa kasalanan” ng “para sa kasalanan” upang ipahayag ang sakripisyong kaugnayan ng περὶ ἁμαρτίας nang walang hindi kinakailangang teknikal na pagpapakahulugan. Pinalitan din ang “mga banal na dako” ng mas natural na “mga banal na lugar,” habang pinananatili ang plural at hindi nililimitahan ang tinutukoy sa Kabanal-banalang Dako. Napanatili ang mga puwesto at saklaw ng dalawang talababa.
