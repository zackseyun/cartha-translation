- from: Huwag maging maibigin sa salapi ang inyong pamumuhay. Masiyahan kayo sa kung anong mayroon kayo, sapagkat siya mismo ang nagsabi, “Hinding-hindi kita iiwan, at hinding-hindi kita pababayaan.”[a]
  to: Mamuhay kayo nang hindi maibigin sa salapi. Maging kontento kayo sa kung ano ang mayroon kayo, sapagkat siya mismo ang nagsabi, “Hinding-hindi kita iiwan, at hinding-hindi kita pababayaan.”[a]
  rationale: Inayos ang unang utos upang maging likas sa Tagalog habang pinananatili ang saklaw ng ὁ τρόπος bilang paraan ng pamumuhay. Pinalitan ang “Masiyahan kayo” ng “Maging kontento kayo” upang mas tumpak na maipahayag ang ἀρκούμενοι. Pinanatili ang dalawang “hinding-hindi” upang ipakita ang mariing dobleng pagtanggi sa Griyego, pati ang “siya mismo” at ang talababa sa sipi.
