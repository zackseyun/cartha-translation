  text: ἀφιλάργυρος ὁ τρόπος· ἀρκούμενοι τοῖς παροῦσιν· αὐτὸς γὰρ εἴρηκεν· Οὐ μή σε ἀνῶ οὐδ’ οὐ μή σε ⸀ἐγκαταλίπω·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/005.yaml
  text: Let your way of life be free from the love of money[a], being content with what you have, for he himself has said, “I will never leave you[b], nor will I ever forsake you.”
translation:
  language: tl
  text: Mamuhay kayo nang hindi maibigin sa salapi. Maging kontento kayo sa kung ano ang mayroon kayo, sapagkat siya mismo ang nagsabi, “Hinding-hindi kita iiwan, at hinding-hindi kita pababayaan.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Umaalingawngaw sa pangakong ito ang mga katiyakan ng Diyos sa Lumang Tipan, lalo na ang Deuteronomio 31:6, 8 at Josue 1:5.
    reason: cross_reference
lexical_decisions:
- source_word: ἀφιλάργυρος
  choice: Huwag maging maibigin sa salapi
  rationale: Tiyak na tumutukoy ang pang-uri sa hindi pagkakakilanlan sa pag-ibig sa pera; mas eksakto ito kaysa sa mas malawak na “huwag maging sakim.”
- source_word: ὁ τρόπος
  choice: ang inyong pamumuhay
  rationale: Sa konteksto, tumutukoy ang τρόπος sa asal o paraan ng pamumuhay. Ang “inyong” ay likas na ipinahihiwatig ng tuwirang pangangaral sa mga mambabasa.
- source_word: ἀρκούμενοι
  choice: Masiyahan kayo
  rationale: Inihahatid nito ang mapanghikayat na diwa ng participle sa natural na modernong Tagalog.
- source_word: τοῖς παροῦσιν
  choice: sa kung anong mayroon kayo
  rationale: Ang literal na diwa ay “sa mga bagay na naririyan/nasa kasalukuyan”; sa kontekstong pinansiyal, ito ang natural na Tagalog nang hindi nililimitahan ang parirala sa pera lamang.
- source_word: αὐτὸς γὰρ εἴρηκεν
  choice: sapagkat siya mismo ang nagsabi
  rationale: Pinananatili ang mariing αὐτός at hindi tahasang ipinapasok ang “Diyos,” na wala bilang pangngalan sa Griyego. Ang Tagalog na anyo ay natural na naghahatid sa patuloy na bisa ng nasabi.
- source_word: Οὐ μή σε ἀνῶ
  choice: Hinding-hindi kita iiwan
  rationale: Ang “hinding-hindi” ay natural na paraan upang maipahayag ang mariing οὐ μή; ang “iiwan” ay angkop sa konteksto ng pangakong biblikal.
- source_word: οὐδ’ οὐ μή σε ἐγκαταλίπω
  choice: at hinding-hindi kita pababayaan
  rationale: Ang “pababayaan” ay marangal at likas na katumbas ng pag-iwan o pagtalikod, habang inuulit ng “hinding-hindi” ang mariing pagtanggi.
theological_decisions:
- issue: Pagkakakilanlan ng nagsasalita sa sipi
  choice: Panatilihin ang panghalip bilang “siya mismo” sa halip na idagdag ang “Diyos.”
  alternative: sapagkat ang Diyos mismo ang nagsabi
  rationale: Malinaw sa konteksto na Diyos ang nagsasalita, ngunit αὐτός lamang ang nasa Griyego. Pinananatili nito ang porma ng pinagmulan nang hindi ikinukubli ang ipinahihiwatig na reperente.
- issue: Mariing dobleng pagtanggi sa pangako
  choice: Gamitin ang “Hinding-hindi ... at hinding-hindi ...”
  alternative: Hindi kita kailanman iiwan ni pababayaan man
  rationale: Dalawang οὐ μή ang nagbibigay ng napakalakas na katiyakan. Ang pag-uulit ng “hinding-hindi” ay natural sa Tagalog at pinananatili ang diin nang hindi ginagawang mekanikal ang pahayag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Hinati sa dalawang pangungusap ang unang bahagi upang maging natural ang pangangaral. Ang “maibigin sa salapi” ay pinanatili upang hindi palawakin ang kahulugan tungo sa lahat ng uri ng kasakiman. Ang tanging talababa ay minarkahan sa pangunahing teksto bilang [a].
