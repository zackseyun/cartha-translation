id: HEB.13.3
reference: Hebrews 13:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: μιμνῄσκεσθε τῶν δεσμίων ὡς συνδεδεμένοι, τῶν κακουχουμένων ὡς καὶ αὐτοὶ ὄντες ἐν σώματι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/003.yaml
  text: Remember those in prison[a], as though imprisoned with them; those who are mistreated[b], since you yourselves also are in the body.
translation:
  language: tl
  text: Patuloy ninyong alalahanin ang mga bilanggo[a], na para bang nakagapos kayong kasama nila; at ang mga pinagmamalupitan, yamang kayo rin mismo ay nasa katawan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, ang kasunod na pananalita ay literal na nagpapahiwatig na kayo ay nakagapos na kasama ng mga bilanggo.
    reason: lexical_alternative
  - marker: b
    text: Ang “nasa katawan” ay malamang na tumutukoy sa karaniwang kalagayan ng tao na may katawan at maaaring magdusa. Posible ring marinig dito ang pagiging kabilang sa katawan ni Cristo.
    reason: alternative_reading
lexical_decisions:
- source_word: μιμνῄσκεσθε
  choice: Patuloy ninyong alalahanin
  rationale: Ang pangkasalukuyang pautos ay nagpapahiwatig ng patuloy na pag-alala at malasakit; malinaw at natural itong ipinahahayag sa modernong Tagalog.
- source_word: τῶν δεσμίων
  choice: ang mga bilanggo
  rationale: Ang δέσμιος ay taong nakagapos at karaniwang tumutukoy sa bilanggo. Natural sa Tagalog ang “mga bilanggo,” habang pinananatili sa kasunod na parirala ang larawan ng pagkagapos.
- source_word: ὡς συνδεδεμένοι
  choice: na para bang nakagapos kayong kasama nila
  rationale: Pinananatili nito ang literal na larawan ng sama-samang pagkagapos at ang panawagan sa pakikiisa sa kalagayan ng mga bilanggo.
- source_word: τῶν κακουχουμένων
  choice: ang mga pinagmamalupitan
  rationale: Ipinahahayag ng anyong balintiyak na dumaranas sila ng masamang pagtrato mula sa iba; ang “pinagmamalupitan” ay malinaw, kasalukuyan, at may angkop na bigat.
- source_word: ὡς καὶ αὐτοὶ ὄντες ἐν σώματι
  choice: yamang kayo rin mismo ay nasa katawan
  rationale: Malapit ito sa anyo ng Griyego at hindi nito agad nilulutas kung ang tinutukoy ay karaniwang kahinaan ng buhay na may katawan o, bilang posibleng alingawngaw, ang katawan ni Cristo.
theological_decisions:
- issue: Kahulugan ng ἐν σώματι (“nasa katawan”)
  choice: Pinanatili ang literal na “nasa katawan,” na sa konteksto ay pangunahing tumutukoy sa magkakatulad na pisikal na kahinaan at posibilidad na magdusa.
  alternative: Maaaring unawain bilang pagiging kabilang sa katawan ni Cristo.
  rationale: Ang konteksto ay humihimok ng pakikiisa sa mga bilanggo at pinagmamalupitan batay sa magkatulad na kalagayang pantao. Gayunman, hindi isinasara ng salin ang posibleng eklesyal na alingawngaw.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “patuloy” upang maipakita ang nagpapatuloy na bisa ng pautos, at pinanatili ang konkretong larawan ng pagkagapos at ang sadyang kalabuan ng “nasa katawan.”
