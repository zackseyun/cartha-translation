  source_fidelity: Tumpak na naipapahayag ang lohikal na pagbubuo ng διὸ καὶ, ang layunin ng ἵνα ἁγιάσῃ, ang instrumentong diwa ng διὰ τοῦ ἰδίου αἵματος, ang tiyak ngunit hindi pinalawak na τὸν λαόν, at ang isahang ἔξω τῆς πύλης. Ang ayos ng pangungusap sa Tagalog ay malinaw at hindi nagbabago sa saklaw ng mga parirala.
  naturalness: Likas at marangal ang modernong Tagalog. Ang “Kaya si Jesus din ay nagdusa ... upang pabanalin ang bayan sa pamamagitan ng sarili niyang dugo” ay malinaw, maayos ang daloy, at ang “sarili niyang dugo” ay natural na nagbibigay ng diin ng ἰδίου.
  terminology: Ang “pabanalin” ay angkop na katumbas ng ἁγιάζῃ at napapanatili ang sakramental/pangkultong saklaw nito nang hindi ipinipilit ang isang partikular na doktrina. Ang “bayan” ay wastong katumbas ng λαόν; ang “tarangkahan” ay angkop para sa isahang πύλης. Ang mga talababa ay wasto ang mga angkla at hindi nagdaragdag ng kahulugan sa pangunahing teksto.
