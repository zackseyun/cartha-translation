id: HEB.13.12
reference: Hebrews 13:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: διὸ καὶ Ἰησοῦς, ἵνα ἁγιάσῃ διὰ τοῦ ἰδίου αἵματος τὸν λαόν, ἔξω τῆς πύλης ἔπαθεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/012.yaml
  text: Therefore Jesus also suffered outside the gate[b][a], so that he might sanctify the people through his own blood.
translation:
  language: tl
  text: Kaya si Jesus din ay nagdusa sa labas ng tarangkahan[b] upang pabanalin[a] ang bayan sa pamamagitan ng sarili niyang dugo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “gawing banal” o “italaga bilang banal.”
    reason: lexical_alternative
  - marker: b
    text: Ang “sa labas ng tarangkahan” ay malamang na tumutukoy sa lugar sa labas ng Jerusalem kung saan nagdusa si Jesus. Umaalingawngaw rito ang naunang pagbanggit sa pagdadala ng mga labi ng handog sa labas ng kampo.
    reason: cross_reference
lexical_decisions:
- source_word: διὸ
  choice: Kaya
  rationale: Likas na pang-ugnay sa modernong Tagalog na malinaw na naghahayag ng kongklusyon mula sa naunang pangangatwiran.
- source_word: καὶ
  choice: din
  rationale: Ipinakikitang si Jesus ay tumutugma rin sa huwaran ng mga handog na binanggit sa naunang konteksto.
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Karaniwang anyo ng pangalang ito sa modernong Filipino.
- source_word: ἵνα ἁγιάσῃ
  choice: upang pabanalin
  rationale: Pinananatili ng “upang” ang layuning ipinahahayag ng ἵνα, at ng “pabanalin” ang sagrado at panghandog na diwa ng ἁγιάζω.
- source_word: διὰ τοῦ ἰδίου αἵματος
  choice: sa pamamagitan ng sarili niyang dugo
  rationale: Malinaw na ipinahahayag ang paraan o kasangkapan at pinananatili ang diin ng ἰδίου sa dugong kay Jesus mismo.
- source_word: τὸν λαόν
  choice: ang bayan
  rationale: Pinananatili ang tiyak at kolektibong diwa ng λαός nang hindi idinaragdag sa pangunahing teksto ang hindi tahasang nakasulat na “ng Diyos.”
- source_word: ἔξω τῆς πύλης
  choice: sa labas ng tarangkahan
  rationale: Pinananatili ang isahan at hindi tahasang idinaragdag ang “lungsod” o “Jerusalem,” bagaman ipinahihiwatig iyon ng konteksto.
- source_word: ἔπαθεν
  choice: nagdusa
  rationale: Tuwiran, maikli, at likas na katumbas ng aorist na ἔπαθεν.
theological_decisions:
- issue: Pagpapakahulugan sa ἁγιάζω sa konteksto ng paghahandog
  choice: pabanalin
  alternative: gawing banal; italaga bilang banal
  rationale: Pinananatili ng “pabanalin” ang teolohikal at pangkultong saklaw ng salita nang hindi ito nililimitahan sa moral na pagbabago o sa isang partikular na doktrina.
- issue: Saklaw ng τὸν λαόν
  choice: ang bayan
  alternative: ang bayan ng Diyos
  rationale: Malakas na ipinahihiwatig ng konteksto ang bayang tipan ng Diyos, ngunit “ang bayan” lamang ang tahasang nasa Griyego; kaya hindi pinalawak ang pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Ginamit ang “tarangkahan” upang mapanatili ang kongkretong larawan at isahang anyo ng πύλη, at “bayan” para sa kolektibo at tipanang diwa ng λαός.
