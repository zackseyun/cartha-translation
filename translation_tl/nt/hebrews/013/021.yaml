  naturalness: Marangal at malinaw ang rehistro ng draft, ngunit mas natural ang "sangkapan ... ng bawat mabuting bagay" kaysa "ihanda ... sa bawat mabuting bagay." Ang "kung ano ang kalugud-lugod" ay mas kumpletong modernong Tagalog para sa substantivized adjective. Inilipat ang talababa sa mismong ambiguwong "kanya" upang malinaw ang saklaw ng anchor.
  terminology: Pinanatili ang "Jesus na Mesiyas," "kalooban," at "kaluwalhatian." Ang "sangkapan" ay angkop na marangal ngunit nauunawaang termino para sa καταρτίσαι at mas mahusay na naghahatid ng diwang pagbibigay ng kinakailangan para sa pagsunod.
