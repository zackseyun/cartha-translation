revisions:
- from: Nawa’y ihanda niya kayo sa bawat mabuting bagay upang gawin ang kanyang kalooban, habang ginagawa niya sa atin ang kalugud-lugod sa kanyang harapan sa pamamagitan ni Jesus na Mesiyas, na sa kanya ang kaluwalhatian magpakailanman. Amen.[a]
  to: Nawa’y sangkapan niya kayo ng bawat mabuting bagay upang gawin ang kanyang kalooban, at gawin niya sa loob natin ang anumang kalugud-lugod sa kanyang harapan sa pamamagitan ni Jesus na Mesiyas, na sa kanya[a] ang kaluwalhatian magpakailanman. Amen.
  rationale: Pinalitan ang "ihanda" ng "sangkapan" upang maihatid ang diwa ng καταρτίσαι bilang pagbibigay ng kailangan para sa pagsunod. Inayos ang participial na sugnay bilang kasunod na kahilingan nang walang idinagdag na temporal na diin, at isinalin ang ἐν ἡμῖν bilang "sa loob natin." Pinanatili ang ambiguwidad ng ᾧ sa "na sa kanya," at inilagay ang talababa sa mismong pariralang iyon.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:04:14Z'
