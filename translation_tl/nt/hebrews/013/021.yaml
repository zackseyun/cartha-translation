source:
  edition: SBLGNT
  text: καταρτίσαι ὑμᾶς ἐν ⸀παντὶ ἀγαθῷ εἰς τὸ ποιῆσαι τὸ θέλημα αὐτοῦ, ποιῶν ἐν ⸀ἡμῖν τὸ εὐάρεστον ἐνώπιον αὐτοῦ διὰ Ἰησοῦ Χριστοῦ, ᾧ ἡ δόξα εἰς τοὺς ⸀αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/021.yaml
  text: may he equip you in every good thing to do his will[a], working in us what is pleasing before him through Jesus the Messiah, to whom be the glory forever and ever. Amen.
translation:
  language: tl
  text: Nawa’y sangkapan niya kayo ng bawat mabuting bagay upang gawin ang kanyang kalooban, at gawin niya sa loob natin ang anumang kalugud-lugod sa kanyang harapan sa pamamagitan ni Jesus na Mesiyas, na sa kanya[a] ang kaluwalhatian magpakailanman. Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “na sa kanya” ay maaaring tumukoy mismo kay Jesus na Mesiyas; ayon naman sa ibang pagkaunawa, tumutukoy ito sa Diyos ng kapayapaan, na siyang paksa ng panalangin.
    reason: alternative_reading
lexical_decisions:
- source_word: καταρτίσαι
  choice: ihanda
  rationale: Sa panalanging ito, tumutukoy ang pandiwa sa ganap na paghahanda o pagsasangkap sa mga mananampalataya para sa pagsunod. Mas natural sa modernong Tagalog ang “ihanda” kaysa sa literal ngunit mabigat na “sangkapan.”
- source_word: ἐν παντὶ ἀγαθῷ
  choice: sa bawat mabuting bagay
  rationale: Pinananatili nito ang anyong may ἐν at ang malawak na saklaw ng parirala nang hindi nililimitahan kung ito ay mabuting kaloob, gawa, o kalagayan.
- source_word: εἰς τὸ ποιῆσαι τὸ θέλημα αὐτοῦ
  choice: upang gawin ang kanyang kalooban
  rationale: Malinaw na ipinahahayag ng “upang” ang layuning taglay ng articular infinitive.
- source_word: ποιῶν ἐν ἡμῖν
  choice: habang ginagawa niya sa atin
  rationale: Ipinakikita ng “habang” ang kasabay at nagpapatuloy na pagkilos ng Diyos; ang “sa atin” ay nagpapanatili sa ἐν ἡμῖν nang hindi lubusang isinasara ang posibilidad na ‘sa loob natin’ o ‘sa gitna natin.’
- source_word: τὸ εὐάρεστον ἐνώπιον αὐτοῦ
  choice: ang kalugud-lugod sa kanyang harapan
  rationale: Ang “kalugud-lugod” ay dignified at karaniwang salin ng substantivized adjective, at ang “sa kanyang harapan” ay nagpapanatili sa pananaw ng Diyos bilang humahatol kung ano ang nakalulugod.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: sa pamamagitan ni Jesus na Mesiyas
  rationale: Ipinahahayag ng “sa pamamagitan” ang instrumental na diwa ng διά; isinasalin ang Χριστός bilang titulong “Mesiyas” sa natural na Tagalog.
- source_word: ᾧ ἡ δόξα
  choice: na sa kanya ang kaluwalhatian
  rationale: Pinananatili ng sugnay na may “na” ang relatibong konstruksyon at hindi tahasang tinutukoy kung ang antecedent ay si Jesus na Mesiyas o ang Diyos na paksa ng panalangin.
- source_word: εἰς τοὺς αἰῶνας
  choice: magpakailanman
  rationale: Natural at malinaw na Tagalog para sa idyomang tumutukoy sa walang hanggang panahon, nang hindi dinaragdagan ang pormula.
theological_decisions:
- issue: Tinutukoy ng ᾧ (“na sa kanya”) sa doxology
  choice: Pinanatili ang relatibong anyong “na sa kanya” nang hindi pinapangalanan ang tinutukoy.
  alternative: Maaaring tumukoy ito nang tuwiran kay Jesus na Mesiyas; maaari rin itong tumukoy sa Diyos ng kapayapaan, ang pangunahing paksa ng panalangin.
  rationale: Maaaring iugnay ang panghalip sa pinakamalapit na pangngalan, si Jesus na Mesiyas, o sa Diyos na siyang kumikilos sa buong panalangin. Hindi dapat lutasin ng salin ang ambiguwidad na hindi nilulutas ng Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Nawa’y” bilang natural na anyo ng panalanging bendisyon. Inilagay ang talababa sa hulihan ng talata upang hindi ipahiwatig na tanging isang naunang pangngalan lamang ang saklaw nito.
