  text: Sumainyong lahat ang biyaya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ χάρις
  choice: ang biyaya
  rationale: Ang χάρις sa pangwakas na pagbating ito ay tumutukoy sa “biyaya.” Likas sa Tagalog ang paggamit ng pantukoy na “ang,” na kaayon din ng artikulong Griyego.
- source_word: μετὰ
  choice: sumainyo
  rationale: Ang μετά na may genitive ay nangangahulugang “kasama.” Sa anyong basbas, natural at marangal na ipinahahayag ito sa Tagalog sa pamamagitan ng “sumainyo,” na nagsasaad ng hinihiling na presensiya nang hindi nagdaragdag ng doktrinal na pahayag.
- source_word: πάντων ὑμῶν
  choice: lahat
  rationale: Ang πάντων ὑμῶν ay tahasang sumasaklaw sa buong kausap na pangkat. Sa “Sumainyong lahat,” malinaw na napapanatili ang kahulugang “sa inyong lahat.”
theological_decisions: []
translation_notes:
  register: Maikli, marangal, at likas na makabagong Tagalog na angkop sa pangwakas na basbas ng isang liham. Ginamit ang tradisyonal ngunit nauunawaang “sumainyo” upang maipahayag nang maayos ang eliptikong Griyego.
