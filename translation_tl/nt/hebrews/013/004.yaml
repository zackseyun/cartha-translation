base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/004.yaml
  text: Let marriage be held in honor among all[a], and the marriage bed be undefiled[b], for God will judge the sexually immoral and adulterers.
translation:
  language: tl
  text: Igalang ng lahat ang pag-aasawa[a], at panatilihing walang dungis ang pagtatalik ng mag-asawa[b], sapagkat hahatulan ng Diyos ang mga gumagawa ng seksuwal na imoralidad at ang mga nangangalunya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Marangal ang pag-aasawa sa paningin ng lahat.” Walang hayag na pandiwa sa Griyego, kaya maaari itong basahin bilang isang tagubilin o bilang isang pahayag.'
    reason: alternative_reading
  - marker: b
    text: Sa Griyego, literal na “ang higaan ay walang dungis”; ang “higaan” ay tumutukoy rito sa seksuwal na pagtatalik ng mag-asawa.
    reason: metonymy_clarification
lexical_decisions:
- source_word: τίμιος
  choice: igalang
  rationale: Ipinahahayag nito ang pagpapahalaga at pagbibigay-dangal. Ang anyong pautos ay angkop sa sunod-sunod na mga payo sa Hebreo 13, habang pinananatili sa talababa ang posibleng pasalaysay na pagbasa.
- source_word: γάμος
  choice: pag-aasawa
  rationale: Tumutukoy rito sa kalagayan at buklod ng pag-aasawa, hindi sa seremonya ng kasal.
- source_word: ἐν πᾶσιν
  choice: ng lahat
  rationale: Likas itong tumutukoy sa mga tao at malinaw na naipakikita kung sino ang dapat gumalang sa pag-aasawa. Ang posibleng kahulugang 'sa lahat' ay kaugnay ng alternatibong pasalaysay na pagbasa at inilagay sa talababa.
- source_word: κοίτη
  choice: pagsasama ng mag-asawa
  rationale: Ang literal na 'higaan' ay metonimiya para sa relasyong seksuwal. Ang pariralang ito ay natural at marangal sa makabagong Tagalog at malinaw na pinananatili ang kontekstong pangmag-asawa.
- source_word: ἀμίαντος
  choice: walang dungis
  rationale: Pinananatili nito ang larawang moral at panrelihiyon ng pagiging hindi nadungisan o marumihan.
- source_word: πόρνους
  choice: mga gumagawa ng seksuwal na imoralidad
  rationale: Saklaw nito ang malawak na kategorya ng ipinagbabawal na seksuwal na asal nang hindi gumagamit ng makaluma o masyadong makitid na termino.
- source_word: μοιχούς
  choice: mga nangangalunya
  rationale: Tiyak itong tumutukoy sa mga gumagawa ng pangangalunya at pinananatili ang pagkakaiba nito sa mas malawak na πόρνους.
- source_word: κρινεῖ
  choice: hahatulan
  rationale: Ipinakikita ang hinaharap na paghatol ng Diyos nang hindi awtomatikong ginagawang 'parurusahan' o 'kokondenahin,' na magiging mas tiyak kaysa sa Griyego.
- source_word: γάρ
  choice: sapagkat
  rationale: Malinaw at marangal na ipinakikita ang dahilan na sumusuporta sa naunang tagubilin.
theological_decisions:
- issue: Kung ang unang sugnay ay pautos/payo o pasalaysay na pahayag
  choice: 'Pautos: “Igalang ng lahat ang pag-aasawa”'
  alternative: 'Pasalaysay: “Marangal ang pag-aasawa sa lahat”'
  rationale: Walang hayag na pandiwa ang Griyego, kaya kapuwa posible ang dalawang pagbasa. Pinili ang pautos dahil sa daloy ng magkakasunod na payong etikal sa Hebreo 13, ngunit inilalahad sa talababa ang tunay na alternatibo.
- issue: Kung ang ἐν πᾶσιν ay nangangahulugang “ng lahat” o “sa lahat”
  choice: “ng lahat,” bilang gumagawa ng paggalang
  alternative: “sa lahat,” kaugnay ng pasalaysay na pagbasa
  rationale: Pinakamalamang na mga tao ang tinutukoy ng pangmaramihang anyo. Sa pautos na salin, natural sa Tagalog ang “ng lahat”; hindi naman itinatago ang alternatibong pagkakaugnay nito sa talababa.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “pag-aasawa” upang tukuyin ang institusyon o kalagayan, at “pagsasama ng mag-asawa” bilang likas at hindi bulgar na pagpapahayag ng marital sexual relations. Ang mga marker na [a] at [b] ay kapuwa nasa pangunahing teksto.
