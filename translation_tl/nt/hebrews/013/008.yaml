  text: Jesus the Messiah is the same yesterday and today and forever[a].
translation:
  language: tl
  text: Si Jesus na Mesiyas ay siya rin kahapon at ngayon at magpakailanman.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Si Jesucristo ay siya rin kahapon at ngayon at magpakailanman.” Ang titulong Griyego na Χριστός ay maaaring isalin bilang “Mesiyas” o tumbasan ng “Kristo.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Ginamit ang karaniwang anyo ng personal na pangalan sa makabagong Filipino.
- source_word: Χριστὸς
  choice: Mesiyas
  rationale: Isinalin bilang titulong “Mesiyas” sa halip na transliterasyong “Cristo,” sapagkat dito ay kinikilala si Jesus ayon sa kanyang mesiyanikong katungkulan.
- source_word: ἐχθὲς
  choice: kahapon
  rationale: Tuwirang katumbas ng temporal na pang-abay at pinananatili ang tatluhang pagtukoy sa panahon.
- source_word: σήμερον
  choice: ngayon
  rationale: Natural na katumbas sa Filipino at kaagapay ng “kahapon” at “magpakailanman.”
- source_word: ὁ αὐτός
  choice: ay siya ring
  rationale: Ipinahahayag ang nananatiling pagkakapareho o di-pagbabago ng tinutukoy; natural sa Filipino ang “siya ring” bilang panaguri.
- source_word: εἰς τοὺς αἰῶνας
  choice: magpakailanman
  rationale: Malinaw at likas na salin ng idyomang Griyego para sa walang hanggang pagpapatuloy.
- source_word: καὶ ... καὶ ... καὶ
  choice: at ... at ... at
  rationale: Pinanatili hangga't natural ang magkakaugnay na ritmo ng mga panahong binanggit sa Griyego.
theological_decisions:
- issue: Ang kristolohikal na diwa ng pahayag tungkol sa pananatiling pareho ni Jesus
  choice: Isinalin nang tuwiran bilang pahayag na si Jesus na Mesiyas ay siya ring kahapon, ngayon, at magpakailanman, nang walang idinagdag na paliwanag na doktrinal.
  alternative: Maaaring unawain ito bilang mas malawak na pahayag tungkol sa hindi pagbabago o pagka-Diyos ni Cristo.
  rationale: Sinusuportahan ng teksto ang pagkaunawa sa patuloy na pagkakapareho ni Jesus sa lahat ng panahon, ngunit hindi dapat palawakin ng salin ang sinasabi ng Griyego.
- issue: Pagpapakahulugan sa Χριστός bilang titulo o nakaugaliang pangalan
  choice: Mesiyas
  alternative: Cristo
  rationale: Pinananatili ang puwersa nito bilang titulo, habang kinikilala sa talababa ang nakaugaliang alternatibong transliterasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Si Jesus na Mesiyas” upang likas na maipahayag ang personal na pangalan at titulo; pinanatili ang maikli at mariing ritmo ng orihinal.
