  text: Ὁ δὲ θεὸς τῆς εἰρήνης, ὁ ἀναγαγὼν ἐκ νεκρῶν τὸν ποιμένα τῶν προβάτων τὸν μέγαν ἐν αἵματι διαθήκης αἰωνίου, τὸν κύριον ἡμῶν Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/020.yaml
  text: May the God of peace[a], who brought up from the dead our Lord Jesus, the great shepherd of the sheep, by the blood of an eternal covenant,
translation:
  language: tl
  text: Nawa ang Diyos ng kapayapaan—na muling bumuhay sa ating Panginoong Jesus mula sa mga patay, ang dakilang pastol ng mga tupa, sa pamamagitan ng dugo ng isang walang-hanggang tipan[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin ang huling parirala bilang “sa dugo ng isang walang-hanggang tipan.” Pinahihintulutan ng Griyego ang bahagyang magkakaibang pag-uugnay ng pariralang ito: maaari itong tumukoy sa muling pagbuhay kay Jesus o mas malapit na iugnay sa “ang dakilang pastol ng mga tupa.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁ δὲ
  choice: Nawa ang
  rationale: Ang δέ ay banayad na transisyon tungo sa panalangin ng pagpapala at hindi kailangang tumbasan ng tahasang temporal na salita. Ang optatibong diwa ng buong pangungusap ay likas na ipinahahayag sa Tagalog ng “Nawa.”
- source_word: θεὸς τῆς εἰρήνης
  choice: ang Diyos ng kapayapaan
  rationale: Pinananatili nito ang genitibong paglalarawan sa Diyos bilang kaugnay at pinagmumulan ng kapayapaan, nang hindi ito ginagawang simpleng “mapayapang Diyos.”
- source_word: ὁ ἀναγαγὼν ἐκ νεκρῶν
  choice: na muling bumuhay mula sa mga patay
  rationale: Sa konteksto ng pagkabuhay na muli, natural at malinaw sa modernong Tagalog ang “muling bumuhay”; pinananatili ng “mula sa mga patay” ang karaniwang pormulang Griyego.
- source_word: τὸν ποιμένα τῶν προβάτων τὸν μέγαν
  choice: ang dakilang pastol ng mga tupa
  rationale: Tuwirang pinananatili ang pastoral na larawan at ang diin ng μέγαν sa pastol.
- source_word: ἐν αἵματι
  choice: sa pamamagitan ng dugo
  rationale: Ipinahahayag ang posibleng instrumental na gamit ng ἐν sa natural na Tagalog, habang ang talababa ay nagpapanatili sa sintaktikong kalabuan.
- source_word: διαθήκης αἰωνίου
  choice: ng isang walang-hanggang tipan
  rationale: Ang “tipan” ang angkop na salin ng διαθήκη sa argumento ng Hebreo. Ang “isang” ay umaayon sa kawalan ng pantukoy sa Griyego ngunit hindi itinatangging maaaring tumukoy ito sa kilalang tipan.
- source_word: τὸν κύριον ἡμῶν Ἰησοῦν
  choice: sa ating Panginoong Jesus
  rationale: Natural na ayos sa Tagalog at malinaw na kinikilala si Jesus bilang ang ibinangon ng Diyos.
theological_decisions:
- issue: Ugnayan ng ἐν αἵματι διαθήκης αἰωνίου sa sugnay tungkol sa muling pagkabuhay
  choice: 'Pangunahing iniugnay sa pagkilos ng Diyos sa muling pagbuhay kay Jesus: “sa pamamagitan ng dugo ng isang walang-hanggang tipan.”'
  alternative: Maaaring iugnay nang mas malapit sa “ang dakilang pastol ng mga tupa,” o unawain ang ἐν bilang “sa dugo” sa halip na tahasang instrumental.
  rationale: Pinahihintulutan ng ayos ng Griyego ang higit sa isang pagkakaugnay. Ang pangunahing salin ay natural na nag-uugnay sa parirala sa pagkilos ng Diyos, samantalang ang talababa ay tahasang nagpapanatili sa tunay na kalabuan at hindi nagpapasok ng detalyadong paliwanag tungkol sa mekanismo ng pagtubos.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “muling bumuhay” kaysa mas teknikal o di-likas na anyo. Ang mga gitling ay tumutulong na ipakitang nagpapatuloy ang pangungusap sa susunod na talata; hindi ito ganap na pangungusap sa orihinal.
