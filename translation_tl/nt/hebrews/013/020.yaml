  naturalness: Ang “muling bumuhay sa [isang tao] mula sa mga patay” ay natural na modernong Tagalog. Ang paggamit ng em dash ay angkop upang ipakitang nagpapatuloy ang bendisyon sa kasunod na talata.
  terminology: Ang “Diyos ng kapayapaan,” “Panginoong Jesus,” “dakilang pastol ng mga tupa,” at “walang-hanggang tipan” ay angkop, malinaw, at pare-pareho sa rehistro at terminolohiya ng Hebreo.
