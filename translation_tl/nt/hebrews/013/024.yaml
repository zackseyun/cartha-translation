  text: ἀσπάσασθε πάντας τοὺς ἡγουμένους ὑμῶν καὶ πάντας τοὺς ἁγίους. ἀσπάζονται ὑμᾶς οἱ ἀπὸ τῆς Ἰταλίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/024.yaml
  text: Greet all your leaders and all the saints[a]. Those from Italy greet you.
translation:
  language: tl
  text: Batiin ninyo ang lahat ng inyong mga pinuno at ang lahat ng mga banal. Binabati kayo ng mga mula sa Italia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Binabati kayo ng mga nasa Italia.” Maaaring tumukoy ang pariralang Griyego sa mga taong nagmula sa Italia o sa mga taong naroroon doon.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Batiin ninyo
  rationale: Tuwirang ipinapahayag ang pautos na diwa ng aorist imperative at natural sa makabagong Tagalog.
- source_word: πάντας
  choice: ang lahat
  rationale: Pinananatili ang saklaw sa buong pangkat at malinaw sa Tagalog.
- source_word: τοὺς ἡγουμένους ὑμῶν
  choice: inyong mga pinuno
  rationale: Tumutukoy sa mga kinikilalang namumuno sa pamayanan; malinaw ito at hindi nagdadala ng di-kinakailangang pampolitikang kahulugan.
- source_word: τοὺς ἁγίους
  choice: ang lahat ng mga banal
  rationale: Pinananatili ang karaniwang katawagang teolohikal ng Bagong Tipan para sa mga mananampalatayang ibinukod bilang banal, sa halip na palitan ng mas mapagpaliwanag na parirala.
- source_word: ἀσπάζονται
  choice: Binabati kayo
  rationale: Natural na anyong pangliham sa Tagalog at tapat sa present indicative ng pandiwa.
- source_word: οἱ ἀπὸ τῆς Ἰταλίας
  choice: mga taga-Italia
  rationale: Likas na Tagalog para sa mga taong nagmula o nauugnay sa Italia. Dahil maaaring unawain ang Griyego bilang mga taong naroroon sa Italia, inilalahad ang alternatibo sa talababa.
theological_decisions:
- issue: Tinutukoy ng οἱ ἀπὸ τῆς Ἰταλίας
  choice: mga taga-Italia
  alternative: mga nasa Italia
  rationale: Karaniwang ipinahihiwatig ng ἀπό na may genitive ang pinagmulan, kaya iyon ang pinanatili sa pangunahing teksto. Gayunman, maaaring tumukoy ang parirala sa mga mananampalatayang nasa Italia; pinananatili sa talababa ang tunay na kalabuan na may kaugnayan sa lugar ng pagkakasulat.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mga banal” upang mapanatili ang katawagang teolohikal, at “mga taga-Italia” bilang natural ngunit hindi lubusang nagsasara sa ambiguwidad ng orihinal.
