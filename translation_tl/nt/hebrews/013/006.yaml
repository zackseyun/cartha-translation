base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/006.yaml
  text: so that we confidently say[a], “The Lord is my helper; I will not be afraid[b]. What can man do to me?”
translation:
  language: tl
  text: Kaya buong tapang nating sinasabi, “Ang Panginoon ang tumutulong sa akin; hindi ako matatakot. Ano ang magagawa[a] sa akin ng tao?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas pormal na salin, “Ano ang gagawin sa akin ng tao?”
    reason: lexical_alternative
  - marker: b
    text: Ang “tao” rito ay salin ng Griyegong ἄνθρωπος, isang panlahatang katawagan para sa isang tao bilang kinatawan ng sangkatauhan; hindi lamang lalaki ang tinutukoy.
    reason: cultural_note
lexical_decisions:
- source_word: ὥστε
  choice: Kaya
  rationale: Ipinahahayag nito ang bunga o kongklusyon mula sa naunang pahayag at likas ang daloy nito sa makabagong Tagalog.
- source_word: θαρροῦντας ἡμᾶς λέγειν
  choice: buong tapang nating sinasabi
  rationale: Ipinananatili ng “buong tapang” ang diwa ng lakas ng loob at pagtitiwala sa participle, habang natural na isinasalin ang buong konstruksiyon.
- source_word: Κύριος
  choice: ang Panginoon
  rationale: Karaniwan, malinaw, at marangal na katumbas ng titulong κύριος sa kontekstong tumutukoy sa Diyos.
- source_word: ἐμοὶ βοηθός
  choice: ang tumutulong sa akin
  rationale: Natural itong Tagalog para sa predikatibong diwang “tagatulong para sa akin” at iniiwasan ang posibleng pakahulugan sa “katulong” bilang tauhan o lingkod.
- source_word: οὐ φοβηθήσομαι
  choice: hindi ako matatakot
  rationale: Tuwirang ipinapahayag ang anyong panghinaharap at natural sa kasalukuyang Tagalog.
- source_word: τί ποιήσει μοι ἄνθρωπος
  choice: Ano ang magagawa sa akin ng tao?
  rationale: Ipinahahayag ng “magagawa” ang retorikal na diwa na limitado ang kayang gawin ng tao, samantalang pinananatili ng “tao” ang panlahatang isahan ng ἄνθρωπος.
theological_decisions:
- issue: Panlahatang gamit ng ἄνθρωπος
  choice: tao
  alternative: isang tao; sinuman
  rationale: Ang “tao” ay likas na panlahat at hindi nakatali sa kasarian sa Tagalog, habang pinananatili ang isahang kinatawang anyo ng Griyego.
- issue: Retorikal na puwersa ng panghinaharap na ποιήσει
  choice: Ano ang magagawa sa akin ng tao?
  alternative: Ano ang gagawin sa akin ng tao?
  rationale: Bagaman panghinaharap ang pandiwa, retorikal ang tanong at itinatanggi nito ang tunay o pangwakas na kapangyarihan ng banta ng tao. Mas natural na naihahatid iyon ng “magagawa,” habang inilalagay sa talababa ang mas pormal na anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “buong tapang” upang ihatid ang hayag na pagtitiwala, at ang pandiwang pariralang “tumutulong sa akin” upang maiwasan ang di-likas o mapagkalitong nominal na “katulong.”
