id: HEB.8.5
reference: Hebrews 8:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: (οἵτινες ὑποδείγματι καὶ σκιᾷ λατρεύουσιν τῶν ἐπουρανίων, καθὼς κεχρημάτισται Μωϋσῆς μέλλων ἐπιτελεῖν τὴν σκηνήν, Ὅρα γάρ, φησίν, ποιήσεις πάντα κατὰ τὸν τύπον τὸν δειχθέντα σοι ἐν τῷ ὄρει)·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/005.yaml
  text: who serve a copy and shadow of the heavenly things[a], just as Moses was divinely instructed when he was about to erect the tabernacle; for he says[b], “See that you make everything according to the pattern shown to you on the mountain.”
translation:
  language: tl
  text: 'Sila ay naglilingkod sa isang kopya at anino ng mga bagay na nasa langit, kung paanong tumanggap si Moises ng tagubilin mula sa Diyos[a] nang malapit na niyang tapusin ang tabernakulo[b], sapagkat ito ang sinabi: “Tiyakin mong gawin ang lahat ayon sa huwarang ipinakita sa iyo sa bundok.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “binigyan ng babala ng Diyos”; maaaring idiin ng pandiwang Griyego ang isang babala o paalalang mula sa Diyos.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “itayo” sa halip na “tapusin” ang tabernakulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: Ang mga ito
  rationale: Tumutukoy pabalik sa mga paring Levitico. Likas sa Tagalog ang tahasang panghalip na ito at hindi nito labis na binibigyang-diin ang bahagyang kwalitatibong diwa ng ὅστις.
- source_word: ὑποδείγματι
  choice: isang kopya
  rationale: Sa konteksto ng santuwaryo, tumutukoy ito sa makalupang katumbas na nakabatay sa makalangit. Pinananatili ng “kopya” ang ugnayan at pagkakaiba ng dalawa.
- source_word: σκιᾷ
  choice: anino
  rationale: Pinananatili ang metapora ng isang bagay na tunay na may kaugnayan sa pinagmulan nito ngunit hindi kapantay ng kabuuang makalangit na realidad.
- source_word: λατρεύουσιν
  choice: naglilingkod
  rationale: Saklaw ng pandiwa ang sagradong paglilingkod. Nililinaw ng konteksto ng mga pari at tabernakulo ang panrelihiyong diwa.
- source_word: τῶν ἐπουρανίων
  choice: ng mga bagay na nasa langit
  rationale: Pinananatiling malawak ang reperensiya at iniiwasang ipakahulugan agad bilang mga abstraktong “realidad.”
- source_word: κεχρημάτισται
  choice: tumanggap ... ng tagubilin mula sa Diyos
  rationale: Ipinahihiwatig ng pandiwa ang komunikasyong mula sa Diyos. Sinasaklaw ng “tagubilin” ang paghahayag at pag-uutos nang hindi nililimitahan ang diwa sa babala lamang.
- source_word: μέλλων
  choice: nang malapit na niyang
  rationale: Natural na ipinapahayag sa Tagalog ang prospektibong diwa na si Moises ay nakatakda nang gawin ang gawain.
- source_word: ἐπιτελεῖν
  choice: tapusin
  rationale: Pinananatili ang leksikal na diwa ng pagdadala ng gawain sa kaganapan, habang kinikilala sa talababa na maaari rin itong tumukoy sa pagtatayo sa kontekstong ito.
- source_word: σκηνήν
  choice: tabernakulo
  rationale: Ito ang malinaw at nakaugaliang katawagan sa santuwaryong tolda noong panahon ni Moises.
- source_word: Ὅρα
  choice: Tiyakin mo
  rationale: Sa utos na ito, idiomatiko sa modernong Tagalog ang “Tiyakin mo” at pinananatili nito ang mariing pag-iingat na ipinahahayag ng imperatibo.
- source_word: ποιήσεις πάντα
  choice: gawin ang lahat
  rationale: Ang anyong panghinaharap sa sipi ay gumaganap bilang utos; natural itong isinasalin sa Tagalog bilang tuwirang pautos.
- source_word: τύπον
  choice: huwaran
  rationale: Tumutukoy sa padron o modelong ipinakita kay Moises. Ang “huwaran” ay dignified at malinaw sa konteksto.
theological_decisions:
- issue: Ugnayan ng makalupang santuwaryo sa mga bagay na nasa langit
  choice: “isang kopya at anino ng mga bagay na nasa langit”
  alternative: “isang larawan at anino ng mga makalangit na realidad”
  rationale: Pinananatili nito ang pagkakatulad at pagiging di-ganap ng makalupang paglilingkod kung ihahambing sa makalangit, nang hindi ito ginagawang simbolo lamang o labis na isinasaayos ang teolohikal na ugnayan.
- issue: Diwa ng κεχρημάτισται
  choice: “tumanggap ... ng tagubilin mula sa Diyos”
  alternative: “binigyan ... ng babala ng Diyos”
  rationale: May diwa ang pandiwa ng komunikasyong banal at maaari ring magtaglay ng babala. Mas malawak ang “tagubilin mula sa Diyos,” samantalang itinatala sa talababa ang posibleng babalang diin.
- issue: Tinukoy na nagsasalita sa φησίν
  choice: “sinabi niya”
  alternative: “sinabi ng Diyos”
  rationale: Pinananatili ang panghalip ng Griyego at ang bahagyang pormal na kalabuan nito, sa halip na tahasang idagdag sa pangunahing teksto ang Diyos bilang paksa.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang pamilyar na terminong “tabernakulo,” at pinili ang likas na pautos na “Tiyakin mong gawin” para sa sipi. Inilagay ang bawat pananda ng talababa sa mismong salita o pariralang tinatalakay nito.
