review_pass:
  verdict: revise
  source_fidelity: Tumpak ang pangunahing paglalapat ng ὑποδείγματι καὶ σκιᾷ, ng banal na tagubilin kay Moises, at ng utos na gawin ang lahat ayon sa huwarang ipinakita sa bundok. Gayunman, ang “Sapagkat sinabi niya” ay maaaring likas na tumukoy kay Moises, ang pinakamalapit na naunang pangngalan, samantalang ang sipi ay ang banal na tagubilin na tinanggap niya. Ang walang-tahasang atribusyong “sapagkat ito ang sinabi” ay nagpapanatili sa anyong di-ganap na tahasang paksa ng Griyego nang hindi lumilikha ng maling antecedent.
  naturalness: Kailangang ayusin ang “Ang mga ito ay” tungo sa mas likas na “Sila ay,” at ang pagkakaugnay ng pagsipi ay mas magiging malinaw at natural sa “sapagkat ito ang sinabi.” Ang iba pang pananalita ay angkop sa modernong Filipino Tagalog at may marangal na rehistro.
  terminology: 'Ang “kopya,” “anino,” “mga bagay na nasa langit,” “tagubilin mula sa Diyos,” “tabernakulo,” at “huwaran” ay angkop at magkakatugma. Inayos ang talababa a: ang “banal na babala” ay maaaring mangahulugang isang babalang banal, samantalang ang nais ipahayag ay babala o paalalang nagmumula sa Diyos.'
  issues:
  - severity: medium
    issue: Malabong antecedent ng “niya” sa “Sapagkat sinabi niya.”
    rationale: Sa Tagalog, malamang na si Moises ang maging antecedent dahil siya ang pinakamalapit na tinukoy. Hindi nito malinaw na naihahatid na ang kasunod na sipi ay ang banal na tagubilin na kanyang tinanggap. Maaari itong iwasan nang hindi pinapangalanan ang nagsasalita.
  - severity: low
    issue: Hindi gaanong likas ang “Ang mga ito ay” bilang pantukoy sa naunang mga pari.
    rationale: Mas payak at natural ang “Sila ay” sa daloy ng Tagalog, habang pinananatili ang pagtukoy ng οἵτινες.
  - severity: low
    issue: Hindi tiyak ang pariralang “banal na babala” sa talababa a.
    rationale: Mas malinaw ang “babala o paalalang mula sa Diyos,” na tumutukoy sa pinagmulan ng komunikasyon at hindi sa katangiang ‘banal’ ng babala.
  revised_text: 'Sila ay naglilingkod sa isang kopya at anino ng mga bagay na nasa langit, kung paanong tumanggap si Moises ng tagubilin mula sa Diyos[a] nang malapit na niyang tapusin ang tabernakulo[b], sapagkat ito ang sinabi: “Tiyakin mong gawin ang lahat ayon sa huwarang ipinakita sa iyo sa bundok.”'
