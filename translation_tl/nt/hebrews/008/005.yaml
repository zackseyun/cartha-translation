revisions:
- from: Ang mga ito ay naglilingkod sa isang kopya at anino ng mga bagay na nasa langit, kung paanong tumanggap si Moises ng tagubilin mula sa Diyos[a] nang malapit na niyang tapusin ang tabernakulo[b]. Sapagkat sinabi niya, “Tiyakin mong gawin ang lahat ayon sa huwarang ipinakita sa iyo sa bundok.”
  to: 'Sila ay naglilingkod sa isang kopya at anino ng mga bagay na nasa langit, kung paanong tumanggap si Moises ng tagubilin mula sa Diyos[a] nang malapit na niyang tapusin ang tabernakulo[b], sapagkat ito ang sinabi: “Tiyakin mong gawin ang lahat ayon sa huwarang ipinakita sa iyo sa bundok.”'
  rationale: Inayos ang pangunahing teksto upang alisin ang hindi sinasadyang pagpapahiwatig na si Moises ang nagsalita ng banal na utos, samantalang hindi tahasang pinapangalanan ang nagsasalita. Pinahusay din ang likas na Tagalog na pagtukoy at nilinaw ang pananalita sa talababa a. Walang binago sa kahulugan ng talata o sa mga pananda ng talababa.
