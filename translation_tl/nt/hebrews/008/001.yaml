id: HEB.8.1
reference: Hebrews 8:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Κεφάλαιον δὲ ἐπὶ τοῖς λεγομένοις, τοιοῦτον ἔχομεν ἀρχιερέα, ὃς ἐκάθισεν ἐν δεξιᾷ τοῦ θρόνου τῆς μεγαλωσύνης ἐν τοῖς οὐρανοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/001.yaml
  text: 'The main point in what is being said is this: we have such a high priest[a], who sat down at the right hand of the throne of the Majesty in the heavens[b],'
translation:
  language: tl
  text: 'Ang pangunahing punto[a] sa mga bagay na sinasabi ay ito: mayroon tayong gayong pinakapunong pari, na naupo sa kanan ng trono ng Kamahalan sa kalangitan[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “buod” o “pinakamahalagang punto.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa mga langit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Κεφάλαιον
  choice: pangunahing punto
  rationale: Sa kontekstong ito, tumutukoy ito sa pinakapunto o buod ng paglalahad, hindi sa literal na “kabanata.” Likas at malinaw sa makabagong Tagalog ang “pangunahing punto.”
- source_word: δὲ
  choice: hindi isinalin nang hiwalay
  rationale: Banayad na panandang pangdiskurso ito. Sapat nang ipinahihiwatig ng pambungad na pangungusap ang paglipat ng paksa; ang pagdaragdag ng “ngayon” ay maaaring magmukhang panahong pagtukoy.
- source_word: ἐπὶ τοῖς λεγομένοις
  choice: sa mga sinasabi
  rationale: Pinananatili nito ang di-tiyak at pasibong diwa ng mga bagay na kasalukuyang tinatalakay nang hindi nagdaragdag ng tahasang tagapagsalita.
- source_word: τοιοῦτον
  choice: gayong
  rationale: Itinuturo nito pabalik ang uri ng kataas-taasang paring inilarawan sa naunang pangangatwiran.
- source_word: ἔχομεν
  choice: mayroon tayong
  rationale: Direkta at natural na pagpapahayag ng kasalukuyang pag-aangkin o pagkakaroon.
- source_word: ἀρχιερέα
  choice: kataas-taasang pari
  rationale: Karaniwan at tumpak na katawagan sa Tagalog para sa kultikong tungkulin ng high priest.
- source_word: ἐκάθισεν
  choice: naupo
  rationale: Ipinahahayag ang natapos na pagkilos ng pag-upo nang hindi nagdaragdag ng paliwanag tungkol sa tagumpay o pagkakumpleto ng gawaing pari.
- source_word: ἐν δεξιᾷ
  choice: sa kanan
  rationale: Likas na idyomang Tagalog para sa marangal at makapangyarihang puwesto sa kanang bahagi.
- source_word: τοῦ θρόνου
  choice: ng trono
  rationale: Pinananatili ang maharlikang larawan at ang ugnayang henitibo ng parirala.
- source_word: τῆς μεγαλωσύνης
  choice: ng Kamahalan
  rationale: Pinananatili ang marangal at di-tuwirang pagtukoy sa Diyos sa halip na palitan ito ng tahasang pangalang wala sa Griyego.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: sa kalangitan
  rationale: Natural sa Tagalog bilang pagtukoy sa makalangit na dako; inilalagay sa talababa ang mas literal na anyong maramihan ng Griyego.
theological_decisions:
- issue: Kung tahasang kikilalanin bilang Diyos ang “Kamahalan”
  choice: Panatilihin ang di-tuwirang katawagang “Kamahalan.”
  alternative: “trono ng Diyos”
  rationale: Μεγαλωσύνη ang ginamit ng teksto, hindi θεός. Pinananatili nito ang marangal na retorika at hindi ginagawang higit na tahasan ang pinagmulan.
- issue: Kung palalawakin ang “naupo” upang idiin ang natapos na gawaing pari
  choice: Isalin lamang bilang “naupo.”
  alternative: “lumuklok matapos ganap na tuparin ang kanyang gawain”
  rationale: Mahalaga sa Hebreo ang teolohikal na pahiwatig ng pag-upo, ngunit dapat itong lumitaw mula sa konteksto at hindi sa idinagdag na paliwanag sa mismong salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang maliit na titik sa “kataas-taasang pari” bilang pangalan ng tungkulin, samantalang malaking titik ang “Kamahalan” bilang mapitagang di-tuwirang pagtukoy sa Diyos. Pinanatili ang kuwit sa hulihan dahil nagpapatuloy ang pangungusap sa kasunod na talata.
