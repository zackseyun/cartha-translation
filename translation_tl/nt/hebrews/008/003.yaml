  naturalness: Natural at angkop sa modernong Filipino ang karamihan ng draft. Ang “ang isang ito” ay bahagyang mas matapat sa demonstrative ng Griyego at nananatiling mauunawaan sa marangal na rehistro ng Hebreo. Ang “kapuwa mga kaloob at mga hain” ay natural na paraan upang ipakita ang magkapares na mga kategorya.
