  text: πᾶς γὰρ ἀρχιερεὺς εἰς τὸ προσφέρειν δῶρά τε καὶ θυσίας καθίσταται· ὅθεν ἀναγκαῖον ἔχειν τι καὶ τοῦτον ὃ προσενέγκῃ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/003.yaml
  text: For every high priest is appointed to offer both gifts and sacrifices[a]; therefore it is necessary for this one also to have something that he may offer.
translation:
  language: tl
  text: Sapagkat ang bawat pinakapunong pari ay itinatalaga upang maghandog ng kapuwa mga kaloob at mga hain; kaya kinakailangang magkaroon din ang isang ito ng maihahandog.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “kaya kinakailangang magkaroon din ang isang ito ng isang bagay na maihahandog.” Hindi tahasang pinapangalanan sa Griyego ang tinutukoy; sa konteksto, ito ay si Jesus bilang pinakapunong pari.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς γὰρ ἀρχιερεὺς
  choice: Sapagkat ang bawat pinakapunong pari
  rationale: Ipinahahayag ng singular na πᾶς ang diwang pamahagi na “bawat.” Isinalin ang γάρ bilang “Sapagkat” upang ipakita ang paliwanag na kaugnayan sa naunang talata. Ang “pinakapunong pari” ay malinaw at karaniwang katawagan sa ἀρχιερεύς sa konteksto ng Hebreo.
- source_word: εἰς τὸ προσφέρειν
  choice: upang maghandog
  rationale: Ang εἰς na may articular infinitive ay nagpapahayag ng layunin; natural itong naihahayag sa Filipino sa pamamagitan ng “upang.”
- source_word: δῶρά τε καὶ θυσίας
  choice: mga kaloob at mga hain
  rationale: 'Pinanatili ang dalawang magkaibang katawagang pangkulto: δῶρα bilang “mga kaloob” at θυσίαι bilang “mga hain.” Ang pagkakahanay ng dalawa ay likas nang naghahatid sa pagpapares na ipinahahayag ng τε καί.'
- source_word: καθίσταται
  choice: ay itinatalaga
  rationale: Sa konteksto ng tungkulin ng pari, tumutukoy ang passive na pandiwa sa paghirang o pagtatalaga sa katungkulan.
- source_word: ὅθεν
  choice: kaya
  rationale: Ipinakikilala ng ὅθεν ang kongklusyong nagmumula sa naunang pahayag; malinaw at natural ang “kaya” sa modernong Filipino.
- source_word: ἀναγκαῖον ἔχειν
  choice: kailangan ... magkaroon
  rationale: Pinananatili nito ang diwa ng pangangailangan habang gumagamit ng likas na kayarian sa Filipino.
- source_word: τι
  choice: ng maihahandog
  rationale: Ang di-tiyak na τι ay kinakatawan ng bagay na hindi tinutukoy kung ano, na likas na naipapahayag sa “maihahandog” sa halip na sa mas mabigat na “isang bagay na maihahandog.”
- source_word: καὶ τοῦτον
  choice: din siyang
  rationale: Ipinahahayag ng “din” ang καί. Ginawang panghalip ang demonstrative na τοῦτον para sa natural na Filipino, habang nananatiling ipinahihiwatig ng konteksto ang tinutukoy.
- source_word: ὃ προσενέγκῃ
  choice: maihahandog
  rationale: Ang anyong ito ay maikli at natural na naghahatid ng diwa ng isang bagay na maaari o nakatalagang ihandog.
theological_decisions:
- issue: Ang tinutukoy ng τοῦτον
  choice: Ginamit ang panghalip na “siya” sa pangunahing teksto, na sa konteksto ay tumutukoy kay Jesus bilang pinakapunong pari.
  alternative: Gamitin ang literal ngunit di-likas na “ang isang ito,” o tahasang ilagay ang “si Jesus.”
  rationale: Hindi tahasang pinapangalanan ng Griyego si Jesus sa talatang ito, bagaman malinaw siya sa konteksto. Pinananatili ng panghalip ang pahiwatig nang hindi nagdaragdag ng pangalan at mas natural ito sa Filipino.
- issue: Magkaibang katawagang pangkulto
  choice: Panatilihin ang “mga kaloob” at “mga hain” bilang dalawang kategorya.
  alternative: Pagsamahin bilang “mga handog” o palawakin bilang paliwanag sa paghahandog ni Cristo ng sarili.
  rationale: Magkaiba ang δῶρα at θυσίαι sa talata. Hindi dapat ipasok sa salin ang mas malawak na paliwanag na teolohikal na hindi tahasang sinasabi rito.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “pinakapunong pari,” “mga kaloob,” at “mga hain” upang mapanatili ang tiyak na bokabularyong pangpari nang hindi nagiging labis na teknikal. Ang semicolon ay nagpapanatili sa mahigpit na ugnayang lohikal ng dalawang sugnay.
