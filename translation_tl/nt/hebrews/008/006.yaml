  source_fidelity: 'Tumpak na naihahatid ang pangunahing sintaks at diwa ng Griyego: ang kasalukuyang pagsalungat (νυνὶ δέ), ang natamong nakahihigit na λειτουργία, ang pagiging tagapamagitan ni Cristo ng mas mabuting tipan, at ang pagkakatatag/pagkakabatas nito batay sa mas mabubuting pangako. Ang “yamang” ay isang likas na Filipino na pagpapahayag ng lohikal na ugnayang ipinahihiwatig ng ὅσῳ καὶ; bagaman hindi nito tuwirang inuulit ang antas na komparatibo, nananatili ang paghahambing sa “higit na dakila” at “mas mabuti.”'
