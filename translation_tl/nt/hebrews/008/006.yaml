id: HEB.8.6
reference: Hebrews 8:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀νυνὶ δὲ διαφορωτέρας τέτυχεν λειτουργίας, ὅσῳ καὶ κρείττονός ἐστιν διαθήκης μεσίτης, ἥτις ἐπὶ κρείττοσιν ἐπαγγελίαις νενομοθέτηται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/006.yaml
  text: But as it is[a], he has obtained a more excellent ministry, by as much as he is also the mediator of a better covenant[c][b], which has been enacted on better promises.
translation:
  language: tl
  text: Ngunit ngayon, nagkamit siya ng higit na dakilang paglilingkod[a], yamang siya rin ang tagapamagitan ng isang mas mabuting tipan[c], na naisabatas[b] batay sa mas mabubuting pangako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nakahihigit na paglilingkod.”
    reason: lexical_alternative
  - marker: b
    text: O “itinatag.”
    reason: lexical_alternative
  - marker: c
    text: Ang salitang Griyego ay maaaring mangahulugang “tipan” o, sa ilang konteksto, “testamento.” Dito, ang “tipan” ang angkop dahil sa bagong tipang ipinangako sa Jeremias at sinipi sa mga sumusunod na talata.
    reason: alternative_reading
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Ngunit ngayon
  rationale: Pinananatili ang tahasang temporal at pasalungat na diwa ng parirala, na nag-uugnay sa kasalukuyang paglilingkod ni Cristo sa naunang pagtalakay sa mga paring naglilingkod sa lupa.
- source_word: διαφορωτέρας
  choice: higit na dakila
  rationale: Ipinapahayag ang paghahambing ng kalidad at ang nakahihigit na katangian ng paglilingkod, sa natural ngunit marangal na Filipino.
- source_word: τέτυχεν
  choice: nagkamit siya
  rationale: Ipinahihiwatig ng ganap na panahunan sa Griyego ang isang natamong katayuang nananatili sa kasalukuyan; natural na naihahatid ito ng “nagkamit.”
- source_word: λειτουργίας
  choice: paglilingkod
  rationale: Sapat na malinaw sa konteksto na ito ay sagradong paglilingkod ni Cristo bilang pari; hindi kailangang idagdag sa mismong talata ang salitang “pagkapari.”
- source_word: ὅσῳ καὶ
  choice: yamang siya rin
  rationale: Natural na ipinakikita ang lohikal na batayan ng higit na dakilang paglilingkod—ang pagiging tagapamagitan niya ng mas mabuting tipan—bagaman hindi ginagaya nang matigas ang komparatibong pormang Griyego.
- source_word: κρείττονός ... διαθήκης
  choice: isang mas mabuting tipan
  rationale: Pinananatili ang mahalagang paghahambing na paulit-ulit sa Hebreo at ang konteksto ng bagong tipang ipinangako sa Jeremias.
- source_word: μεσίτης
  choice: tagapamagitan
  rationale: Ito ang malinaw at karaniwang salitang Filipino para sa isang namamagitan sa dalawang panig sa pagtatatag o pagsasakatuparan ng isang tipan.
- source_word: ἥτις
  choice: na
  rationale: Likas na iniuugnay sa Filipino ang kasunod na paglalarawan sa “tipan” nang hindi nagdaragdag ng diin na hindi tiyak sa Griyego.
- source_word: ἐπὶ κρείττοσιν ἐπαγγελίαις
  choice: batay sa mas mabubuting pangako
  rationale: Malinaw na ipinapahayag na ang mas mabubuting pangako ang saligan ng tipan.
- source_word: νενομοθέτηται
  choice: naisabatas
  rationale: Pinananatili ang legal at pangtipang diwa ng pandiwa at ang nananatiling bisa ng naganap na pagtatakda.
theological_decisions:
- issue: Kahulugan ng διαθήκη sa Hebreo 8:6
  choice: tipan
  alternative: testamento
  rationale: Ang agarang konteksto ay ang bagong tipang ipinangako sa Jeremias at ang pamamagitan ni Cristo. Mas tumpak dito ang “tipan,” samantalang maaaring ilihis ng “testamento” ang mambabasa mula sa kontekstong iyon.
- issue: Ugnayan ng nakahihigit na paglilingkod at ng mas mabuting tipan
  choice: Inilahad ang mas mabuting tipan bilang batayan ng higit na dakilang paglilingkod
  alternative: 'Mahigpit na literal na paghahambing: “sa gayon ding antas na...”'
  rationale: Ang “yamang” ay natural sa modernong Filipino at pinananatili ang argumento ng talata nang hindi nagpapasok ng karagdagang paliwanag o doktrina.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “paglilingkod” sa halip na mas teknikal na “ministeryo,” at ang “naisabatas” upang mapanatili ang legal na kulay ng pandiwang Griyego.
