  yaml_path: translation/nt/hebrews/008/007.yaml
  text: For if that first covenant had been faultless[b][a], no place would have been sought for a second.
translation:
  language: tl
  text: Sapagkat kung walang kapintasan ang unang tipang iyon[a], wala na sanang hahanaping puwang para sa ikalawa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, literal na “ang unang iyon”; ipinahihiwatig mula sa konteksto ang salitang “tipan.”
    reason: lexical_alternative
  - marker: b
    text: O “wala na sanang hahanaping pagkakataon para sa ikalawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ γὰρ
  choice: Sapagkat kung
  rationale: Pinananatili ng “sapagkat” ang paliwanag na ugnayan ng γάρ sa naunang argumento, at ng “kung” ang kondisyon ng εἰ.
- source_word: ἡ πρώτη ἐκείνη
  choice: ang unang tipang iyon
  rationale: Ang pambabaeng parirala sa Griyego ay tumutukoy sa tipang binabanggit sa konteksto. Idinagdag ang “tipan” para maging malinaw at natural sa Tagalog, habang itinatala sa talababa na ipinahihiwatig lamang ito sa Griyego.
- source_word: ἦν ἄμεμπτος
  choice: walang kapintasan
  rationale: Tuwirang ipinapahayag nito ang kawalan ng maipipintas o maibibintang na kakulangan, nang hindi ipinapaliwanag kung saan o kanino nakasalalay ang kapintasan.
- source_word: οὐκ ἂν
  choice: hindi na sana
  rationale: Ang “sana” ay natural na naghahayag sa Tagalog ng di-naganap na bunga ng kondisyong salungat sa katotohanan; ipinakikita ng “hindi na” na wala sanang pangangailangan para sa ikalawa.
- source_word: δευτέρας
  choice: ang ikalawa
  rationale: Pinananatili ang maikling pagtukoy ng Griyego. Malinaw mula sa naunang “tipan” na ang ikalawang tipan ang tinutukoy.
- source_word: ἐζητεῖτο τόπος
  choice: hinanapan ng puwang
  rationale: Pinananatili ang balintiyak na anyo at ang larawan ng τόπος bilang “puwang,” habang nananatiling mauunawaan ang diwang paghahanap ng pagkakataon o dahilan para sa ikalawa.
theological_decisions:
- issue: Kung dapat bang tahasang banggitin ang “tipan” kahit hindi ito inuulit sa Griyego
  choice: Idinagdag ang “tipan” sa “ang unang tipang iyon,” na may talababa.
  alternative: “ang unang iyon” o “ang una”
  rationale: Ang agarang konteksto ay paghahambing ng dalawang tipan. Nililinaw lamang ng idinagdag na salita ang ipinahihiwatig na tinutukoy at hindi ito nagdaragdag ng bagong doktrinal na pahayag.
- issue: Kung saan nakasalalay ang kapintasan ng unang tipan
  choice: “walang kapintasan,” nang walang dagdag na paliwanag
  alternative: Ipaliwanag sa talata na nasa mga tao, sa pagpapatupad, o sa tipan mismo ang kapintasan
  rationale: Hindi pa tinutukoy ng talatang ito ang tiyak na saklaw o sanhi ng kapintasan. Pinananatili ng salin ang teolohikal na tensiyon at hinahayaang magbigay-linaw ang kasunod na konteksto.
- issue: Kahulugan ng τόπος sa pariralang ἐζητεῖτο τόπος
  choice: “puwang” sa pangunahing teksto
  alternative: “pagkakataon” o “dahilan”
  rationale: Ang “puwang” ay malapit sa karaniwang kahulugan ng τόπος at gumagana rin bilang idyoma sa Tagalog. Inilalahad sa talababa ang mas diwang mga alternatibo nang hindi nilulutas nang labis ang tunay na lawak ng salita.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Natural ang kondisyong “kung … hindi na sana,” habang pinananatili ang balintiyak na kilos at ang maikli ngunit malinaw na paghahambing ng una at ikalawang tipan.
