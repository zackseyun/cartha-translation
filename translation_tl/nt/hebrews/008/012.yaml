  yaml_path: translation/nt/hebrews/008/012.yaml
  text: For I will be merciful toward their unrighteousness[b][a], and I will remember their sins no more.
translation:
  language: tl
  text: Sapagkat magiging maawain ako sa kanilang mga kasamaan[a], at hinding-hindi ko na aalalahanin ang kanilang mga kasalanan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa kanilang mga gawang masama” o “sa kanilang mga kawalang-katarungan.” Ang salitang Griyego ay maaaring tumukoy sa mga konkretong gawa ng kasamaan o kawalang-katarungan.
    reason: lexical_alternative
  - marker: b
    text: 'Sa literal, mariing sinasabi: “hinding-hindi ko na aalalahanin ang kanilang mga kasalanan.” Sa konteksto ng tipan, idyoma ito ng lubos na kapatawaran at hindi na pananagot sa mga kasalanang iyon; hindi ito pahayag na nawawalan ng kaalaman ang Diyos tungkol sa mga ito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Sapagkat
  rationale: Ipinakikita rito ang paliwanag o batayan ng naunang pangako sa tipan; likas at malinaw ang “Sapagkat” sa Filipino.
- source_word: ἵλεως ἔσομαι
  choice: magiging mahabagin ako
  rationale: Pinananatili nito ang larawan ng Diyos na nagpapakita ng mahabaging pabor at kapatawaran, nang hindi gumagamit ng teknikal o di-karaniwang salita.
- source_word: ταῖς ἀδικίαις αὐτῶν
  choice: sa kanilang mga kalikuan
  rationale: Maaaring tumukoy ang pangmaramihang ἀδικίαις sa mga konkretong gawa ng kasamaan o kawalang-katarungan. Sapat na malawak ang “mga kalikuan” upang mapanatili ang moral na bigat at pangmaramihang anyo.
- source_word: καὶ
  choice: at
  rationale: Tuwirang pang-ugnay na nagdurugtong sa dalawang pangako.
- source_word: τῶν ἁμαρτιῶν αὐτῶν
  choice: ang kanilang mga kasalanan
  rationale: Karaniwan at tuwirang salin ito ng pangmaramihang ἁμαρτιῶν.
- source_word: οὐ μὴ μνησθῶ ἔτι
  choice: hindi ko na aalalahanin pa
  rationale: Ipinahahayag ng οὐ μή ang mariing pagtanggi, at ng ἔτι ang “hindi na.” Ang “hindi ko na aalalahanin pa” ay natural na Filipino at nagpapanatili sa biblikal na idyoma ng hindi na pag-alaala sa kasalanan.
theological_decisions:
- issue: Kahulugan ng hindi na pag-alaala ng Diyos sa mga kasalanan
  choice: Pinanatili ang idyomang “hindi ko na aalalahanin pa” bilang pahayag ng lubos na kapatawaran sa tipan
  alternative: Ipaliwanag sa teksto bilang “hindi ko na ibibilang laban sa kanila” o unawain bilang literal na pagkalimot
  rationale: Hindi tahasang nilulutas ng salin ang teolohikal na tensiyon. Pinananatili nito ang mismong larawan ng teksto, samantalang nililinaw sa talababa ang karaniwang gamit nito sa konteksto ng tipan.
- issue: Ugnayan ng awa at mga kalikuan
  choice: “magiging mahabagin ako sa kanilang mga kalikuan”
  alternative: “patatawarin ko ang kanilang mga kalikuan”
  rationale: Mas malapit ang piniling anyo sa ἵλεως ἔσομαι at hindi nito pinapalitan ang pahayag tungkol sa mahabaging disposisyon ng Diyos ng isang tahasang pandiwa ng pagpapatawad, bagaman iyon ang ipinahihiwatig sa konteksto.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang maikli at makapangyarihang paralelismo ng pangungusap, pati ang biblikal na idyoma ng “pag-alaala” sa kasalanan. Ginamit ang “mga kalikuan” bilang pormal ngunit nauunawaang salita na sapat na malawak para sa moral na kasamaan at kawalang-katarungan.
