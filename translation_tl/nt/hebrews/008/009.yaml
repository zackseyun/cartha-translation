id: HEB.8.9
reference: Hebrews 8:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὐ κατὰ τὴν διαθήκην ἣν ἐποίησα τοῖς πατράσιν αὐτῶν ἐν ἡμέρᾳ ἐπιλαβομένου μου τῆς χειρὸς αὐτῶν ἐξαγαγεῖν αὐτοὺς ἐκ γῆς Αἰγύπτου, ὅτι αὐτοὶ οὐκ ἐνέμειναν ἐν τῇ διαθήκῃ μου, κἀγὼ ἠμέλησα αὐτῶν, λέγει κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/009.yaml
  text: not like the covenant that I made with their fathers on the day when I took hold of their hand to bring them out of the land of Egypt[a], because they did not continue in my covenant, and I disregarded them[b], says the Lord.
translation:
  language: tl
  text: hindi tulad ng tipang ginawa ko sa kanilang mga ninuno noong araw na hinawakan ko sila sa kamay upang ilabas sila mula sa lupain ng Egipto[a], sapagkat hindi sila nanatili sa aking tipan, at hindi ko sila pinansin[b], sabi ng Panginoon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas likas na pananalita, “nang akayin ko sila sa pamamagitan ng paghawak sa kanilang kamay.”
    reason: lexical_alternative
  - marker: b
    text: 'Sinusunod ng sipi ang Griyegong pananalita sa Sulat sa mga Hebreo: “hindi ko sila pinansin.” Iba ang diwa ng Jeremias 31:32 sa Hebreong teksto, na madalas isaling “bagaman ako ang kanilang asawa” o “bagaman ako ang kanilang panginoon.”'
    reason: alternative_reading
lexical_decisions:
- source_word: διαθήκην
  choice: tipan
  rationale: Ang “tipan” ang natural at tiyak na salin sa konteksto ng pakikipagtipan ng Diyos; hindi angkop dito ang “testamento.”
- source_word: τοῖς πατράσιν αὐτῶν
  choice: sa kanilang mga ninuno
  rationale: Tumutukoy ito sa mga naunang ama ng Israel. Sa modernong Tagalog, malinaw at likas ang “mga ninuno” bilang kolektibong pagtukoy sa mga ama ng bayan.
- source_word: ἐν ἡμέρᾳ ἐπιλαβομένου μου τῆς χειρὸς αὐτῶν
  choice: nang araw na hawakan ko ang kanilang kamay
  rationale: Pinananatili nito ang kongkretong larawan ng Diyos na humahawak sa kamay nila at ang temporal na diwa ng parirala.
- source_word: ἐξαγαγεῖν αὐτοὺς ἐκ γῆς Αἰγύπτου
  choice: upang ilabas sila mula sa lupain ng Egipto
  rationale: Ang “ilabas” ay tuwirang katumbas ng ἐξάγω, at pinananatili ng “lupain ng Egipto” ang tahasang γῆς.
- source_word: οὐκ ἐνέμειναν ἐν τῇ διαθήκῃ μου
  choice: hindi sila nanatili sa aking tipan
  rationale: Ipinahahayag ng “nanatili” ang hindi pagpapatuloy o hindi pananatiling tapat sa tipan nang hindi nagdaragdag ng interpretasyon.
- source_word: κἀγὼ ἠμέλησα αὐτῶν
  choice: at pinabayaan ko sila
  rationale: Ang “pinabayaan” ay natural na Tagalog para sa ἀμελέω at maaaring magpahayag ng hindi na pag-aasikaso o paglingap, nang hindi pinatitindi tungo sa hayagang pagtatakwil.
- source_word: λέγει κύριος
  choice: sabi ng Panginoon
  rationale: Karaniwang pormula ito ng pagsipi; natural sa Tagalog ang “sabi ng Panginoon” at pinananatili ang κύριος bilang “Panginoon.”
theological_decisions:
- issue: Ang ἠμέλησα αὐτῶν sa Hebreo 8:9 ay naiiba sa diwa ng tekstong Hebreo ng Jeremias 31:32.
  choice: pinabayaan ko sila
  alternative: bagaman ako ang kanilang asawa / panginoon
  rationale: Malinaw na sinusunod ng Hebreo 8:9 ang salitang Griyego na ἠμέλησα αὐτῶν. Kaya iyon ang nasa pangunahing teksto, habang inilalagay sa talababa ang mahalagang pagkakaiba sa tekstong Hebreo ng Jeremias upang mapanatili ang intertekstuwal at teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang larawan ng paghawak sa kamay, ang terminong “tipan,” at ang pagkakaiba sa tekstong Hebreo ng Jeremias sa pamamagitan ng talababa.
