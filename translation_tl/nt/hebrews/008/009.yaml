  to: hindi tulad ng tipang ginawa ko sa kanilang mga ninuno noong araw na hinawakan ko sila sa kamay upang ilabas sila mula sa lupain ng Egipto[a], sapagkat hindi sila nanatili sa aking tipan, at hindi ko sila pinansin[b], sabi ng Panginoon.
