id: HEB.8.10
reference: Hebrews 8:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτι αὕτη ἡ διαθήκη ἣν διαθήσομαι τῷ οἴκῳ Ἰσραὴλ μετὰ τὰς ἡμέρας ἐκείνας, λέγει κύριος, διδοὺς νόμους μου εἰς τὴν διάνοιαν αὐτῶν, καὶ ἐπὶ καρδίας αὐτῶν ἐπιγράψω αὐτούς, καὶ ἔσομαι αὐτοῖς εἰς θεόν καὶ αὐτοὶ ἔσονταί μοι εἰς λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/010.yaml
  text: 'For this is the covenant that I will make with the house of Israel after those days[a], says the Lord: putting my laws into their minds, and I will write them on their hearts; and I will be their God, and they will be my people.'
translation:
  language: tl
  text: 'Sapagkat ito ang tipang gagawin ko sa sambahayan ng Israel pagkatapos ng mga araw na iyon, sabi ng Panginoon: ilalagay ko ang aking mga kautusan sa kanilang mga isip[a], at isusulat ko ang mga iyon sa kanilang mga puso; ako ang magiging Diyos nila, at sila ang magiging bayan ko.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas malapit sa anyo ng Griyego: “habang inilalagay ko ang aking mga kautusan sa kanilang mga isip, at isusulat ko ang mga iyon sa kanilang mga puso.” Participial ang unang pandiwa sa Griyego (“inilalagay/nagbibigay”), at sinusundan ito ng pandiwang panghinaharap (“isusulat ko”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαθήκη
  choice: tipan
  rationale: Ang “tipan” ang likas at matatag na katumbas sa Filipino para sa covenant, at pinananatili nito ang ugnayan sa Jeremias at ang teolohikal na diwa ng pakikipagtipan.
- source_word: διαθήσομαι
  choice: gagawin ko
  rationale: Sa pariralang “tipang gagawin ko,” natural sa modernong Filipino ang pandiwa at tapat ito sa kahulugang paggawa o pagtatatag ng tipan.
- source_word: οἴκῳ Ἰσραήλ
  choice: sambahayan ng Israel
  rationale: Pinananatili ng “sambahayan” ang kolektibo at pangtipang larawan ng “bahay ng Israel,” ngunit mas malinaw ito sa karaniwang modernong Filipino.
- source_word: μετὰ τὰς ἡμέρας ἐκείνας
  choice: pagkatapos ng mga araw na iyon
  rationale: Tuwirang pinananatili nito ang propetikong idyoma at ang intertekstuwal na kaugnayan sa Jeremias.
- source_word: κύριος
  choice: Panginoon
  rationale: Ito ang karaniwang katumbas ng κύριος sa Bagong Tipan at angkop sa pormula ng siping ito.
- source_word: διδοὺς
  choice: ilalagay ko
  rationale: Bagaman participle ang Griyego, ang finite future ay mas natural at malinaw sa Filipino. Itinatala sa talababa ang literal na anyo upang hindi maitago ang kakaibang kayarian ng pinagmulan.
- source_word: νόμους
  choice: mga kautusan
  rationale: Pinananatili ang tahasang plural ng Griyego; mas angkop sa kontekstong pangkasulatan ang “mga kautusan” kaysa sa mas malawak na “mga tagubilin.”
- source_word: διάνοιαν
  choice: mga isip
  rationale: Ipinahahayag nito ang kakayahang umunawa at mag-isip. Ang plural na “kanilang mga isip” ay natural na pagtutugma sa pangmaramihang tinutukoy.
- source_word: ἐπὶ καρδίας αὐτῶν
  choice: sa kanilang mga puso
  rationale: Sa Filipino, ang “isusulat sa kanilang mga puso” ay natural at pinananatili ang metapora ng pagsusulat o pag-ukit sa puso.
- source_word: ἐπιγράψω
  choice: isusulat ko
  rationale: Malinaw at karaniwang Filipino ito, habang pinananatili ang metapora ng inskripsiyon.
- source_word: ἔσομαι αὐτοῖς εἰς θεόν
  choice: ako ang magiging Diyos nila
  rationale: Natural na Filipino para sa pormula ng tipan at pinananatili ang ugnayang ipinahahayag ng teksto.
- source_word: αὐτοὶ ἔσονταί μοι εἰς λαόν
  choice: sila ang magiging bayan ko
  rationale: Tumpak at natural na katumbas ng pangtipang pormulang nagsasaad ng pag-aari at ugnayan.
theological_decisions:
- issue: Pagpapanatili sa wikang pangtipan ng sipi mula sa Jeremias
  choice: Ginamit ang “tipan,” “sambahayan ng Israel,” “mga kautusan,” “mga puso,” “Diyos nila,” at “bayan ko.”
  alternative: Isang mas malayang paraprasang nagpapakinis ngunit nagpapahina sa pagkakaugnay sa Jeremias.
  rationale: Mahalaga sa argumento ng Hebreo ang pagkakakilanlan ng sipi bilang pangako ng bagong tipan; kaya pinanatili ang mahahalagang pormulang pangtipan.
- issue: Ang magkahalong kayariang pandiwa na διδοὺς ... ἐπιγράψω
  choice: 'Pinakinis sa pangunahing teksto bilang dalawang pandiwang panghinaharap: “ilalagay ko ... at isusulat ko.”'
  alternative: Mas literal na “inilalagay ang aking mga kautusan ... at isusulat ko,” o “sa paglalagay ... isusulat ko.”
  rationale: Ang literal na participial construction ay asiwa at maaaring magpalabo ng pakahulugan sa Filipino. Pinananatili sa talababa ang anyo ng Griyego at ang tunay na alternatibo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Bahagyang pormal ang mga pariralang “tipan” at “sambahayan ng Israel” upang mapanatili ang propetikong at pangtipang himig, ngunit iniwasan ang lipas o labis na teknikal na pananalita.
