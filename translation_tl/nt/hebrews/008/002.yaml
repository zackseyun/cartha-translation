base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/002.yaml
  text: a minister of the holy places and of the true tabernacle[a], which the Lord set up[b], not man.
translation:
  language: tl
  text: isang tagapaglingkod sa mga banal na dako[a] at sa tunay na tabernakulo, na itinayo[b] ng Panginoon, hindi ng tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “santuwaryo.” Ang pariralang Griyego ay maaari ring tumukoy sa santuwaryo bilang kabuuan, ngunit nasa anyong pangmaramihan.
    reason: lexical_alternative
  - marker: b
    text: O “itinindig,” gaya ng pagtatayo ng tolda.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν ἁγίων
  choice: mga banal na dako
  rationale: Ang pang-uring pangmaramihan ay ginagamit bilang pangngalan. Sa kontekstong panritwal ng Hebreo, tumutukoy ito sa mga banal na bahagi ng makalangit na santuwaryo, hindi sa mga banal na tao; pinananatili rin ng salin ang anyong pangmaramihan.
- source_word: λειτουργὸς
  choice: tagapaglingkod
  rationale: Tumutukoy ito sa isang gumaganap ng pampubliko o panrelihiyong paglilingkod. Ang “tagapaglingkod” ay natural sa modernong Filipino at sapat na malawak upang mapanatili ang kontekstong makasaserdote nang hindi gumagamit ng teknikal na katawagan.
- source_word: σκηνῆς
  choice: tabernakulo
  rationale: Sa Hebreo, pinupukaw ng salita ang tabernakulo ni Moises at ang makalangit na katumbas nito. Ang “tabernakulo” ay nagpapanatili sa tiyak na biblikal at panritwal na ugnayan kaysa sa pangkalahatang “tolda.”
- source_word: ἀληθινῆς
  choice: tunay
  rationale: Ipinahihiwatig nito ang tunay, ganap, o tumutugma sa sukdulang realidad. Ang “tunay” ay maikli at pinananatili ang paghahambing sa makalupang larawan nang hindi ito labis na ipinapaliwanag.
- source_word: ἔπηξεν
  choice: itinayo
  rationale: Ang pandiwa ay nangangahulugang ikabit, itindig, o itayo, lalo na ang isang tolda. Natural ang “itinayo” at angkop sa tabernakulo; inilalagay sa talababa ang mas matalinghagang “itinindig.”
- source_word: ὁ κύριος
  choice: ang Panginoon
  rationale: Tuwirang katumbas ito ng pariralang Griyego at malinaw na itinatangi ang gumagawa.
- source_word: οὐκ ἄνθρωπος
  choice: hindi ng tao
  rationale: Pinananatili nito ang maikli at mariing paghahambing sa pagitan ng ginawa ng Panginoon at ng ginawa ng tao, habang likas ang anyo sa Filipino.
theological_decisions:
- issue: Ang tinutukoy ng τῶν ἁγίων at ang kaugnayan nito sa makalangit na santuwaryo
  choice: Wikang panritwal tungkol sa mga banal na dako ng santuwaryo
  alternative: mga banal na tao; ang santuwaryo
  rationale: Ang Hebreo 8:1–5 ay tumatalakay sa paglilingkod ng dakilang saserdote sa makalangit na santuwaryo. Pinananatili ng “mga banal na dako” ang pangmaramihang anyo at ang balangkas ng tabernakulo nang hindi ginagawang mga tao ang tinutukoy.
- issue: Ang pangkalahatang diwa ng ἄνθρωπος
  choice: tao bilang pangkalahatang katawagan sa sangkatauhan
  alternative: isang tao; isang taong nilalang
  rationale: Ang paghahambing ay sa pagitan ng Panginoon at ng tao bilang tagapagtayo. Ang “hindi ng tao” ay maikli, natural, at hindi naglilimita sa isang partikular na lalaki.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “tabernakulo” upang mapanatili ang natatanging ugnayang biblikal at panritwal; ang ayos na “hindi ng tao” ay nagpapanatili sa maikli at mariing pagtatambis ng Griyego.
