  verdict: revise
  source_fidelity: Ang draft ay wastong tumutukoy sa mga tao bilang layon ng μεμφόμενος ... αὐτούς at tapat na isinasalin ang mga sambahayan ng Israel at Juda. Gayunman, ang “habang sinisisi sila” ay mas matindi kaysa sa μεμφόμενος, na higit na “pagpuna/paghahanap ng pagkukulang,” at ang “Tingnan ninyo” ay nagdaragdag ng maramihang kausap na wala sa Ἰδού. Ang “itatatag ko” ay mas tuwirang katumbas sa kontekstong ito ng συντελέσω ... διαθήκην kaysa “gagawa ako.”
  naturalness: Mas natural at marangal sa makabagong Filipino ang “sa pagpuna niya sa kanila, sinabi niya” kaysa “habang sinisisi sila, sinabi niya.” Ang “Narito” ay likas na panawag-pansin at hindi nagpapahiwatig ng di-nakasaad na bilang ng mga kausap.
  terminology: Ang “tipan” at “sambahayan” ay angkop at di-paksiyonal. Pinanatili ang “Panginoon” para sa κύριος, at ang mga pangalang Israel at Juda ay wasto.
  issues:
  - severity: medium
    issue: “habang sinisisi sila” para sa μεμφόμενος ... αὐτούς
    rationale: Ang “sinisisi” ay karaniwang nagsasaad ng tuwirang pagbibintang o pagsisi, samantalang ang pandiwang Griyego ay tumutukoy sa pagpuna o paghahanap ng pagkukulang. Ang aspektong “habang” ay hindi rin kailangang idiin.
  - severity: low
    issue: “Tingnan ninyo” para sa Ἰδού
    rationale: Ang Ἰδού ay isang pantawag-pansin, hindi tahasang utos sa maramihang kausap. Ang “Narito” ay pinananatili ang tungkulin nito nang walang idinagdag na bilang.
  - severity: medium
    issue: “gagawa ako ng isang bagong tipan” para sa συντελέσω ... διαθήκην καινήν
    rationale: Bagaman posible ang “gagawa,” ang “itatatag” ay mas malinaw na naghahatid ng pagsasakatuparan/pagtatatag ng tipan sa konstruksiyong ito at umaayon sa English audit trail na “establish.”
  revised_text: Sapagkat, sa pagpuna niya sa kanila, sinabi niya, “Narito, dumarating ang mga araw, sabi ng Panginoon, at magtatatag ako ng isang bagong tipan sa sambahayan ng Israel at sa sambahayan ng Juda,”
