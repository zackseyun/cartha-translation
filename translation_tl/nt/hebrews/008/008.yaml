  text: μεμφόμενος γὰρ ⸀αὐτοὺς λέγει· Ἰδοὺ ἡμέραι ἔρχονται, λέγει κύριος, καὶ συντελέσω ἐπὶ τὸν οἶκον Ἰσραὴλ καὶ ἐπὶ τὸν οἶκον Ἰούδα διαθήκην καινήν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/008.yaml
  text: For in finding fault with them he says, “Look, days are coming, says the Lord, when I will establish a new covenant with the house of Israel and with the house of Judah,”
translation:
  language: tl
  text: Sapagkat, sa pagpuna niya sa kanila, sinabi niya, “Narito, dumarating ang mga araw, sabi ng Panginoon, at magtatatag ako ng isang bagong tipan sa sambahayan ng Israel at sa sambahayan ng Juda,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεμφόμενος ... αὐτοὺς
  choice: habang sinisisi sila
  rationale: Pinananatili ang tahasang layon na ‘sila’ at ang diwa ng pagpuna o paghahanap ng pagkukulang, nang hindi ginagawang ang tipan mismo ang tuwirang sinisisi.
- source_word: Ἰδοὺ
  choice: Tingnan ninyo
  rationale: Natural na panawag-pansin sa makabagong Filipino, at angkop sa maramihang kausap sa sipi.
- source_word: συντελέσω ... διαθήκην καινήν
  choice: gagawa ako ng isang bagong tipan
  rationale: Ang συντελέσω ay nagpapahiwatig ng pagsasakatuparan o pagtatatag; ‘gagawa ... ng tipan’ ay natural at umaayon sa biblikal na wikang ginagamit para sa pagpasok o pagtatatag ng tipan.
- source_word: οἶκον
  choice: sambahayan
  rationale: Pinananatili ang kolektibo at angkang diwa ng ‘bahay’ bilang sambayanan o lipi, hindi lamang isang gusali.
- source_word: διαθήκην
  choice: tipan
  rationale: Karaniwan, malinaw, at teolohikal na di-paksiyonal na katumbas para sa covenant.
theological_decisions:
- issue: Ang tinutukoy na sinisisi sa μεμφόμενος ... αὐτοὺς
  choice: sila
  alternative: ang unang tipan
  rationale: May tekstuwal na pagkakaiba sa tradisyon ng manuskrito, ngunit ang ibinigay na SBLGNT ay may αὐτούς, kaya ang mga tao ang tahasang layon sa saling ito.
- issue: Lakas ng συντελέσω kaugnay ng bagong tipan
  choice: gagawa ako
  alternative: itatatag ko / lubos kong isasakatuparan
  rationale: Iniiwasang magdagdag ng isang tiyak na sistematikong paliwanag sa paraan o yugto ng katuparan, habang malinaw na Diyos ang kikilos upang magkaroon ng bagong tipan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘sambahayan’ upang mapanatili ang kolektibong biblikal na larawan, at ‘Tingnan ninyo’ bilang likas na panawag-pansin. Pinanatili ang pangungusap bilang di-ganap na sipi na nagtatapos sa kuwit dahil nagpapatuloy ang pahayag sa kasunod na talata.
