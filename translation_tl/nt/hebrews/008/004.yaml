  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰ μὲν ⸀οὖν ἦν ἐπὶ γῆς, οὐδ’ ἂν ἦν ἱερεύς, ⸀ὄντων τῶν προσφερόντων κατὰ ⸀νόμον τὰ δῶρα·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/004.yaml
  text: If he were on earth[a], he would not even be a priest, since there are those who offer the gifts according to the law.
translation:
  language: tl
  text: Kung nasa lupa siya, hindi man lamang siya magiging pari, sapagkat may mga naghahandog ng mga kaloob[a] ayon sa Kautusan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga handog.” Ang literal na salita sa Griyego ay “mga kaloob,” isang karaniwang katawagan sa mga handog sa ganitong konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ μὲν οὖν ἦν ἐπὶ γῆς
  choice: Kung nasa lupa siya
  rationale: Likas sa modernong Tagalog ang ayos na ito at malinaw na ipinahahayag ang di-tiyak na kondisyong tumutukoy sa dating binanggit na persona. Ang lohikal na paglipat ng οὖν ay sapat nang nahihiwatigan sa sugnay na may “kung,” kaya hindi dinagdagan ng mabigat na panandang pandiskurso.
- source_word: οὐδ’ ἂν ἦν ἱερεύς
  choice: hindi man lamang siya magiging pari
  rationale: Ipinahahayag ng “hindi man lamang” ang pinatinding pagtanggi ng οὐδέ, at ng “magiging” ang bunga ng kondisyong salungat sa ipinapalagay na kalagayan.
- source_word: ὄντων τῶν προσφερόντων
  choice: sapagkat may mga naghahandog
  rationale: Ipinapakita ng “sapagkat” ang pangangatwirang lakas ng genitive absolute, habang hindi tahasang idinaragdag ang salitang “mga pari,” na wala sa parirala bagaman malinaw sa konteksto.
- source_word: κατὰ νόμον
  choice: ayon sa Kautusan
  rationale: Tumutukoy ang νόμος sa kaayusang itinakda ng Kautusan para sa paghahandog; ang “ayon sa” ay malinaw at natural.
- source_word: τὰ δῶρα
  choice: mga kaloob
  rationale: Pinananatili ng “mga kaloob” ang karaniwang kahulugan ng δῶρα at ang pagkakaiba nito sa pandiwang προσφέρειν (“maghandog”), habang ang konteksto ay nagpapakitang mga kaloob na panghandog ang tinutukoy.
theological_decisions:
- issue: Di-binanggit na simuno ng kondisyong sugnay
  choice: Ginamit ang “siya,” na tumutukoy kay Jesus/Mesiyas sa agarang konteksto.
  alternative: Ulitin ang pangalang “Jesus” o “Mesiyas.”
  rationale: Kinakailangan sa natural na Tagalog ang malinaw na panghalip, ngunit hindi kailangang magdagdag ng titulong hindi tahasang nasa talata.
- issue: Lakas ng kondisyong salungat sa katotohanan
  choice: “Kung nasa lupa siya, hindi man lamang siya magiging pari.”
  alternative: “Kung siya ay nasa lupa, hindi siya pari.”
  rationale: Mas malinaw na ipinapakita ng piniling anyo ang ugnayang kondisyon at bunga ng εἰ + imperfect at ἄν + imperfect, nang hindi pinalalabis ang teolohikong implikasyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling basahin. Iniwasan ang di-kailangang pag-uulit at ang pagdaragdag ng “mga pari” sa ikalawang sugnay. Inilagay ang talababa sa “mga kaloob,” ang salitang tinutukoy nito.
