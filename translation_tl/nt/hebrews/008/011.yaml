base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/011.yaml
  text: And they will certainly not teach[a], each one his fellow citizen and each one his brother, saying, ‘Know the Lord,’ because they will all know me, from the least of them to the greatest.
translation:
  language: tl
  text: At hinding-hindi magtuturo[a] ang bawat isa sa kaniyang kapuwa mamamayan at sa kaniyang kapatid, na nagsasabing, “Kilalanin mo ang Panginoon,” sapagkat makikilala ako ng lahat, mula sa pinakamababa sa kanila hanggang sa pinakadakila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang kaniyang kapuwa.” “Kapuwa mamamayan” ang nasa tekstong Griyego ng Hebreo, samantalang “kapuwa” o “kapitbahay” ang karaniwang salin sa kaugnay na talata sa Jeremias.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ μὴ διδάξωσιν
  choice: tiyak na hindi na tuturuan
  rationale: Ang οὐ μή na sinusundan ng aorist subjunctive ay mariing pagtanggi. Ipinahahayag ng “tiyak na hindi na” ang diin at ang hinaharap na kalagayan sa likas na modernong Tagalog.
- source_word: ἕκαστος
  choice: bawat isa
  rationale: Pinananatili nito ang distributibong diin sa bawat kasapi ng pamayanan.
- source_word: πολίτην
  choice: kapuwa mamamayan
  rationale: Ang πολίτης ay tumutukoy sa isang kapuwa mamamayan. Sinusunod ng pangunahing teksto ang umiiral na Griyego ng Hebreo sa halip na palitan ito ng mas tradisyonal na “kapuwa” o “kapitbahay” mula sa Jeremias.
- source_word: ἀδελφόν
  choice: kapatid
  rationale: Ang “kapatid” ay natural sa Tagalog at hindi kailangang markahan ayon sa kasarian, bagaman panlalaking isahan ang anyong Griyego; napapanatili rin nito ang wikang pampamilya ng tipan.
- source_word: Γνῶθι
  choice: Kilalanin mo
  rationale: Ang pautos na “Kilalanin mo” ay tuwiran at mas natural kaysa sa simpleng “Alamin mo” kapag personal na pagkakilala sa Panginoon ang tinutukoy.
- source_word: κύριον
  choice: Panginoon
  rationale: Ito ang kinikilalang katumbas ng κύριος at angkop sa siping may konteksto ng tipan.
- source_word: πάντες εἰδήσουσίν με
  choice: makikilala nila akong lahat
  rationale: Pinananatili ang tahasang layon na “ako” at ang saklaw ng πάντες. Ang hulaping -ng sa “akong” ay nag-uugnay rito sa “lahat” sa natural na Tagalog.
- source_word: ἀπὸ μικροῦ ἕως μεγάλου αὐτῶν
  choice: mula sa pinakamababa sa kanila hanggang sa pinakadakila
  rationale: Ipinahahayag nito ang buong saklaw ng mga tao sa pangkat nang hindi nililimitahan ang idyoma sa edad o pisikal na laki.
theological_decisions:
- issue: Ang terminong πολίτην para sa kasapi ng pamayanang saklaw ng tipan sa pagsipi o pagbanggit sa Jeremias 31:34
  choice: kapuwa mamamayan
  alternative: kapuwa-tao / kapitbahay
  rationale: Ang umiiral na Griyego ng Hebreo ay πολίτην, “kapuwa mamamayan.” Pinangangalagaan ng pangunahing teksto ang partikular na salitang ito, samantalang inilalagay sa talababa ang mas pamilyar na salin mula sa konteksto ng Jeremias.
- issue: Ang panlalaking anyo ng ἀδελφόν
  choice: kapatid
  alternative: kapatid na lalaki
  rationale: Sa Tagalog, ang karaniwang “kapatid” ay hindi minamarkahan ayon sa kasarian. Ang pagdaragdag ng “na lalaki” ay magiging mas tiyak kaysa sa karaniwang kahulugan ng salitang Tagalog at hindi kailangan upang mapanatili ang pampamilyang larawan.
- issue: Ang kahulugan ng pagkakilala sa Diyos sa pangako ng bagong tipan
  choice: Kilalanin mo … makikilala nila ako
  alternative: Alamin mo … malalaman nila ang tungkol sa akin
  rationale: Pinananatili ng “kilalanin/makikilala” ang personal at relasyonal na puwersa ng γινώσκω at οἶδα nang hindi ipinapaliwanag nang labis ang teolohikal na lalim ng pangako.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kaniyang” para sa malinaw na ugnayang gramatikal at ang “tiyak na hindi na” upang maipakita ang mariing pagtanggi ng Griyego. Napanatili ang anyong tuwirang pagsipi at ang saklaw mula sa pinakamababa hanggang sa pinakadakila.
