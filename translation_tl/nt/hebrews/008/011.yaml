  naturalness: Hindi natural at malabo ang dating paralelismo ng “tuturuan … ng bawat isa … at ng bawat isa.” Mas malinaw at likas ang “magtuturo ang bawat isa sa kaniyang kapuwa mamamayan at sa kaniyang kapatid.” Mas idiomatiko rin ang “makikilala ako ng lahat” kaysa “makikilala nila akong lahat.”
  terminology: Ang “Panginoon” ay angkop para sa κύριον. Ang “kapuwa mamamayan” ay wastong tiyak na katumbas ng πολίτην, samantalang ang “kapatid” ay natural na Tagalog para sa ἀδελφόν nang hindi nagdaragdag ng pagtitiyak na wala sa karaniwang gamit ng Tagalog.
