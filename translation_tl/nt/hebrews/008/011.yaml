revisions:
- from: At tiyak na hindi na tuturuan[a] ng bawat isa ang kaniyang kapuwa mamamayan at ng bawat isa ang kaniyang kapatid, na sinasabi, “Kilalanin mo ang Panginoon,” sapagkat makikilala nila akong lahat, mula sa pinakamababa sa kanila hanggang sa pinakadakila.
  to: At hinding-hindi magtuturo[a] ang bawat isa sa kaniyang kapuwa mamamayan at sa kaniyang kapatid, na nagsasabing, “Kilalanin mo ang Panginoon,” sapagkat makikilala ako ng lahat, mula sa pinakamababa sa kanila hanggang sa pinakadakila.
  rationale: Inalis ang “na” sa “hindi na” upang huwag magdagdag ng kahulugang wala sa pinagmulan, at pinalitan ito ng “hinding-hindi” upang maipakita ang diin ng οὐ μή. Inayos ang sintaks upang malinaw na ang bawat isa ang hindi magtuturo sa kaniyang kapuwa mamamayan o kapatid. Pinalitan ang huling sugnay ng mas natural na Tagalog na “makikilala ako ng lahat,” nang walang pagbabago sa saklaw o layon ng Griyego. Napanatili ang talababa at ang panandang [a] sa pandiwang tinutukoy nito.
