  text: ἐν τῷ λέγειν Καινὴν πεπαλαίωκεν τὴν πρώτην, τὸ δὲ παλαιούμενον καὶ γηράσκον ἐγγὺς ἀφανισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/013.yaml
  text: By saying[a], “new,” he has made the first obsolete[c][b]. And what is becoming obsolete and growing old is near to disappearing.
translation:
  language: tl
  text: Sa pagsabi niya ng “bago,”[a] ginawa niyang lipas na ang una.[b] At ang nagiging lipas na at tumatanda ay malapit nang maglaho.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Sa pagsasabi niya” o “Kapag sinasabi niya.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang “bago” lamang ang sinipi sa Griyego, bilang pahiwatig sa pariralang “bagong tipan” sa naunang sipi mula sa Jeremias 31:31.
    reason: cross_reference
  - marker: c
    text: Maaari ring “malapit nang mawala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ λέγειν
  choice: Sa pagsasabi niya
  rationale: Ipinahihiwatig ng parirala ang kalagayan o paraan; likas sa Tagalog ang saling ito at pinananatili ang malapit na ugnayan sa naunang sipi.
- source_word: Καινὴν
  choice: “bago”
  rationale: Pang-uri lamang ang nasa Griyego at pahapyaw nitong inuulit ang “bagong tipan” sa naunang sipi. Pinananatili ng panipi ang maikling pahiwatig nang hindi nagdaragdag ng pangngalan sa pangunahing teksto.
- source_word: πεπαλαίωκεν
  choice: ginawa niyang lipas na
  rationale: Ipinakikita ng perpektong anyo ang naganap nang kilos na may nananatiling bunga. Ang “lipas na” ay malinaw at natural para sa bagay na hindi na umiiral bilang dating kaayusan.
- source_word: τὴν πρώτην
  choice: ang una
  rationale: Ginagamit ang pang-uri bilang pangngalan at tumutukoy sa unang tipan ayon sa konteksto; hindi na idinagdag sa pangunahing teksto ang salitang wala rito sa Griyego.
- source_word: τὸ ... παλαιούμενον
  choice: ang nagiging lipas na
  rationale: Pinananatili ng “nagiging” ang nagpapatuloy na proseso ng kasalukuyang participle.
- source_word: γηράσκον
  choice: tumatanda
  rationale: Natural at tuwirang pinananatili nito ang larawan ng pagtanda na kaagapay ng pagiging lipas.
- source_word: ἐγγὺς
  choice: malapit nang
  rationale: Karaniwang Tagalog itong pagpapahayag ng nalalapit na pangyayari at maayos nitong inuugnay ang nearness sa pagkalaho.
- source_word: ἀφανισμοῦ
  choice: maglaho
  rationale: Saklaw nito ang diwa ng pagkawala o paglaho nang hindi awtomatikong nagpapakahulugan bilang marahas na pagwasak.
theological_decisions:
- issue: Ang ipinahihiwatig na simuno sa “Sa pagsasabi niya”
  choice: “niya,” nang hindi tahasang pinapangalanan ang Diyos o ang Kasulatan
  alternative: “Sa pagsasabi ng Diyos” o “Kapag sinasabi ng Kasulatan”
  rationale: Hindi hayag ang simuno sa Griyego at bumabalik ito sa nagsasalita sa sipi mula kay Jeremias. Pinananatili ng panghalip ang pagiging matipid at bahagyang di-tiyak ng teksto.
- issue: Kalagayan ng unang tipan
  choice: “ginawa niyang lipas na ang una”
  alternative: “ginawa niyang luma ang una”
  rationale: Ipinakikita ng konteksto na ang una ay naluma sa harap ng ipinangakong bago. Ang “lipas na” ay mas malinaw kaysa “luma” nang hindi nagdaragdag ng mas malawak na doktrinal na pahayag tungkol sa kautusan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “lipas na” upang maipahayag ang covenantal na puwersa ng παλαιόω, at pinanatili ang maikling “bago” at “ang una” upang hindi magdagdag sa pangunahing teksto ng mga pangngalang ipinahihiwatig lamang ng Griyego.
