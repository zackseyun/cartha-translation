revisions:
- from: Binigyan din siya ni Abraham ng ikasampung bahagi ng lahat ng bagay[a]. Una, kung isasalin ang kahulugan ng kanyang pangalan, siya ay “Hari ng Katuwiran”; at siya rin ay Hari ng Salem, na ang ibig sabihin ay “Hari ng Kapayapaan.”
  to: Ibinahagi rin ni Abraham sa kanya ang ikasampung bahagi mula sa lahat[a]. Una, ang kahulugan ng kanyang pangalan ay “Hari ng Katuwiran”[b]; at pagkatapos ay Hari rin siya ng Salem, na ang ibig sabihin ay “Hari ng Kapayapaan.”
  rationale: Pinalitan ang pandiwa upang maipakita ang paglalaan/paghahati na nasa ἐμέρισεν, pinanatili ang “mula sa lahat” para sa ἀπὸ πάντων nang walang idinagdag na “samsam,” at ginawang tuwiran ang paliwanag sa kahulugan ng pangalan. Idinagdag ang “at pagkatapos ay” upang mapanatili ang pagkakasunod ng Griyego, at idinagdag ang talababa para sa “katarungan” bilang alternatibong kahulugan ng δικαιοσύνη.
