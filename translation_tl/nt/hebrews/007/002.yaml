base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/002.yaml
  text: to whom Abraham also apportioned a tenth of everything[a]. First, his name is translated King of Righteousness, and then also King of Salem, that is[b], King of Peace.
translation:
  language: tl
  text: Ibinahagi rin ni Abraham sa kanya ang ikasampung bahagi mula sa lahat[a]. Una, ang kahulugan ng kanyang pangalan ay “Hari ng Katuwiran”[b]; at pagkatapos ay Hari rin siya ng Salem, na ang ibig sabihin ay “Hari ng Kapayapaan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “ikapu.” Literal sa Griyego: “ikasampung bahagi.”'
    reason: lexical_alternative
  - marker: b
    text: O “Hari ng Katarungan.” Ang salitang Griyego ay maaaring mangahulugang “katuwiran” o “katarungan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ
  choice: siya
  rationale: Ang panghalip na datibo ay tumutukoy kay Melquisedec bilang tumanggap; sa natural na balangkas na “Binigyan ... siya,” malinaw ang diwang “sa kanya.”
- source_word: δεκάτην
  choice: ikasampung bahagi
  rationale: Tuwirang pinananatili ang literal na diwang “isang ikasampu,” sa halip na agad gamitin ang mas teknikal na “ikapu.”
- source_word: ἀπὸ πάντων
  choice: ng lahat ng bagay
  rationale: Ipinahahayag na ang ikasampung bahagi ay mula sa kabuuan ng tinutukoy, nang hindi idinaragdag sa talata ang salitang “samsam,” na mula sa mas malawak na konteksto.
- source_word: ἐμέρισεν
  choice: Binigyan
  rationale: Bagaman may diwa itong paghahati o paglalaan, ang natural na Tagalog sa konteksto ng tatanggap ay “binigyan”; pinananatili ng “ikasampung bahagi” ang aspektong paghahati.
- source_word: πρῶτον μὲν
  choice: Una
  rationale: Malinaw at maikling pananda sa unang bahagi ng magkatambal na paliwanag.
- source_word: ἑρμηνευόμενος
  choice: kung isasalin ang kahulugan ng kanyang pangalan
  rationale: Ginagawang natural at malinaw sa Tagalog na etimolohikal na paliwanag sa pangalan ang tinutukoy, hindi pagsasalin ng isang buong pahayag.
- source_word: βασιλεὺς δικαιοσύνης
  choice: Hari ng Katuwiran
  rationale: Ang “katuwiran” ang karaniwan at teolohikal na angkop na katumbas ng δικαιοσύνη, habang pinananatili ang anyong titulo.
- source_word: ἔπειτα δὲ καὶ
  choice: at siya rin
  rationale: Natural na iniuugnay ang ikalawang titulo at pinananatili ang diin ng καί na may isa pang pagkakakilanlan.
- source_word: βασιλεὺς Σαλήμ
  choice: Hari ng Salem
  rationale: Pinananatili ang Salem bilang pangalang pantangi at ang parirala bilang titulo.
- source_word: ὅ ἐστιν
  choice: na ang ibig sabihin ay
  rationale: Likas na panandang Filipino para sa paliwanag ng kahulugan ng Salem.
- source_word: βασιλεὺς εἰρήνης
  choice: Hari ng Kapayapaan
  rationale: Tuwirang katumbas ng τίτulong Griyego at malinaw na kaugnay ng paliwanag sa Salem.
theological_decisions:
- issue: Kahulugan ng δικαιοσύνη sa paliwanag sa titulong Melquisedec
  choice: katuwiran
  alternative: katarungan
  rationale: Maaaring tumukoy ang δικαιοσύνη sa katuwiran o katarungan. Pinili ang “katuwiran” dahil akma ito sa paliwanag sa pangalan at sa karaniwang bokabularyong biblikal, ngunit hindi itinatanggi ang lehitimong alternatibong “katarungan.”
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “ikasampung bahagi” upang manatiling malapit sa Griyego, at nilinaw nang natural ang etimolohikal na paliwanag sa pangalan. Hindi dinagdagan ng “mga samsam” ang pangunahing teksto dahil wala itong tahasang katumbas sa mismong talata.
