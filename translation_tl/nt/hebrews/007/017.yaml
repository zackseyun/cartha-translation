  text: ⸀μαρτυρεῖται γὰρ ὅτι Σὺ ἱερεὺς εἰς τὸν αἰῶνα κατὰ τὴν τάξιν Μελχισέδεκ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/017.yaml
  text: 'For it is testified: “You are a priest forever according to the order of Melchizedek.”[a][b]'
translation:
  language: tl
  text: 'Sapagkat pinatotohanan: “Ikaw ay pari magpakailanman ayon sa kaayusan ni Melquisedec.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “alinsunod sa kaayusan ni Melquisedec.”
    reason: lexical_alternative
  - marker: b
    text: Sipi mula sa Awit 110:4.
    reason: cross_reference
lexical_decisions:
- source_word: μαρτυρεῖται
  choice: pinatotohanan
  rationale: Pinananatili nito ang pasibong anyo at ang di-tiyak na tagapagpatotoo habang natural na ipinakikilalang patotoo ng Kasulatan ang kasunod na sipi.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Nagbibigay ito ng dahilan o patunay para sa naunang pahayag at malinaw na nag-uugnay sa konteksto.
- source_word: ὅτι
  choice: ':'
  rationale: Ipinakikilala nito ang nilalaman ng patotoo bilang tuwirang sipi; mas natural sa Filipino ang tutuldok kaysa sa paglalagay ng “na” bago ang sipi.
- source_word: Σὺ
  choice: Ikaw
  rationale: Tuwirang isinasalin ang ikalawang panauhang isahan at napapanatili ang mariing pagtukoy sa kinakausap.
- source_word: ἱερεὺς
  choice: pari
  rationale: Ito ang karaniwan at malinaw na salin ng pangkalahatang katawagang ἱερεύς; hindi idinaragdag ang “punong” sapagkat wala iyon sa talata.
- source_word: εἰς τὸν αἰῶνα
  choice: magpakailanman
  rationale: Natural at marangal na Filipino para sa idyomang nagsasaad ng walang-hanggang tagal.
- source_word: κατὰ τὴν τάξιν
  choice: ayon sa kaayusan ni
  rationale: Pinananatili ang ideya ng pagtutugma sa isang kaayusan o uri, habang ang “ni” ay natural na nag-uugnay sa pangalan sa Filipino.
- source_word: Μελχισέδεκ
  choice: Melquisedec
  rationale: Ginagamit ang nakaugaliang anyo ng pangalang biblikal sa Filipino, bilang transliterasyon ng pangalan.
theological_decisions:
- issue: Paglalarawan sa tungkuling saserdotal sa sipi mula sa Awit
  choice: “Ikaw ay pari magpakailanman ayon sa kaayusan ni Melquisedec”
  alternative: “Ikaw ay punong pari magpakailanman ayon sa kaayusan ni Melquisedec”
  rationale: ἱερεύς ay “pari,” hindi “punong pari.” Bagaman inilalarawan ng Hebreo si Jesus bilang punong pari sa ibang bahagi, hindi iyon dapat idagdag sa mismong siping ito.
- issue: Kahulugan ng τάξις
  choice: kaayusan
  alternative: paraan o wangis
  rationale: Ang “kaayusan” ay nagpapanatili sa posibleng diwa ng isang orden, pagkakaayos, o uri nang hindi nililimitahan ito sa simpleng pagkakatulad ng paraan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “pari” bilang malinaw na pangkalahatang katawagan at ang “magpakailanman” bilang natural na katumbas ng pariralang temporal. Pinanatili ang pormal na “kaayusan” upang hindi paliitin ang saklaw ng τάξις.
