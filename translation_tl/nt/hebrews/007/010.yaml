base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/010.yaml
  text: For he was still in the loins of his father when Melchizedek met him[a].
translation:
  language: tl
  text: Sapagkat nasa balakang pa siya ng kanyang ama nang makipagkita sa kanya si Melquisedek.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas interpretibong salin, “nasa katawan pa siya ng kanyang ninuno.” Literal na sinasabi ng Griyego na “nasa balakang ng kanyang ama,” isang idyoma para sa pagkamula sa isang ninuno.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι
  choice: pa
  rationale: Likas na ipinahahayag ng “pa” ang kalagayang nagpapatuloy hanggang sa panahong tinutukoy.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili nito ang paliwanag na kaugnayan ng talata sa naunang pahayag.
- source_word: ἐν τῇ ὀσφύϊ
  choice: nasa balakang
  rationale: Pinananatili ang kongkretong larawan ng Griyego para sa pinagmulang lahi o pagkamula sa isang ninuno, sa halip na agad itong gawing interpretibong paraphrase.
- source_word: τοῦ πατρὸς
  choice: ng kanyang ama
  rationale: Tapat ito sa anyong “ng ama” sa Griyego; sa konteksto, ang “ama” ay ginagamit sa malawak na diwa ng ninuno at tumutukoy kay Abraham.
- source_word: ἦν
  choice: siya ... nasa
  rationale: Ang payak na imperfect ng εἰμί ay likas na naipahahayag sa Filipino sa panaguring “nasa,” kasama ang “pa” para sa aspektong temporal.
- source_word: ὅτε
  choice: nang
  rationale: Karaniwang pang-ugnay na temporal sa Filipino para sa pangyayaring naganap sa panahong iyon.
- source_word: συνήντησεν
  choice: salubungin
  rationale: Ipinahahayag ang pagkikita o pagsalubong na tinutukoy sa salaysay ng Genesis.
- source_word: αὐτῷ
  choice: ito
  rationale: Pinananatili ang panghalip ng Griyego; ang tinutukoy nito ay ang ama o ninunong si Abraham ayon sa konteksto.
- source_word: Μελχισέδεκ
  choice: Melquisedec
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa modernong Filipino.
theological_decisions:
- issue: Matalinghagang paglalarawan sa pagkamula ni Levi kay Abraham
  choice: Pinanatili sa pangunahing teksto ang kongkretong idyomang “nasa balakang ... ng kanyang ama.”
  alternative: “nasa katawan pa siya ng kanyang ninuno” o “hindi pa siya isinisilang mula sa kanyang ninuno”
  rationale: Ipinakikita ng argumento na si Levi ay maituturing na nasa loob ni Abraham sa diwa ng pinagmulang angkan. Ang pagpapanatili sa larawan ay hindi nagdaragdag ng isang teknikal na paliwanag teolohikal.
- issue: Pagkakakilanlan ng “ama”
  choice: “kanyang ama” sa pangunahing teksto
  alternative: “kanyang ninunong si Abraham”
  rationale: Bagaman si Abraham ang malinaw na tinutukoy sa konteksto, πατήρ ang ginamit ng Griyego. Hindi tahasang idinaragdag sa pangunahing teksto ang pangalang wala sa talata.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Sadyang pinanatili ang di-pangkaraniwang larawang “nasa balakang” upang manatiling nakikita ang lohika ng orihinal, samantalang nililinaw ng talababa ang idyomatikong kahulugan nito.
