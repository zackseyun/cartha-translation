revisions:
- from: Sapagkat nasa balakang pa siya ng kanyang ama nang salubungin ito ni Melquisedec.[a]
  to: Sapagkat nasa balakang pa siya ng kanyang ama nang makipagkita sa kanya si Melquisedek.[a]
  rationale: Pinalitan ang 'salubungin' ng 'makipagkita' upang tapat na maipahayag ang συνήντησεν nang walang dagdag na implikasyon. Pinalitan ang 'ito' ng 'kanya' upang mas natural ang pangungusap at upang ang dative na αὐτῷ ay maipakita bilang layon ng pakikipagkita. Pinanatili ang literal na larawang 'nasa balakang' at ang 'kanyang ama,' kasama ang talababa upang ipaliwanag ang idyoma nang hindi pinapalitan ang pangunahing teksto. Ginawang 'Melquisedek' ang baybay para sa modernong Filipino.
