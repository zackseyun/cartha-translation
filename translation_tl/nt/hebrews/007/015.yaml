    issue: Hindi likas ang aspektong “kung bumabangon.”
    rationale: Ang bumabangon ay karaniwang nagpapahiwatig ng nagaganap o paulit-ulit na pagkilos. Sa argumentatibong kondisyunal na pangungusap, “kung may lumitaw” ang mas natural na Tagalog at sapat na katumbas ng ἀνίσταται sa kontekstong ito.
  - severity: low
    issue: Pinagsama sa isang talababa at inilagay sa hulihan ang dalawang magkaibang tala.
    rationale: Ang alternatibong salin para sa ἕτερος ay dapat nakaangkla sa “isa pang pari,” samantalang ang cross-reference ay dapat nakaangkla sa “ayon sa wangis ni Melquisedec.” Ang magkahiwalay na pananda ay nagpapalinaw sa saklaw ng bawat tala.
