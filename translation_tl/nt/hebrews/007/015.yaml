  text: And it is even more evident[a], if another priest arises according to the likeness of Melchizedek[b],
translation:
  language: tl
  text: At lalo pang malinaw ito kung may lumitaw na isa pang pari[a] ayon sa wangis ni Melquisedec,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang naiibang pari.” Maaaring idiin ng salitang Griyego ang pagkakaiba, hindi lamang ang pagdaragdag ng isa pa.
    reason: lexical_alternative
  - marker: b
    text: Ang pariralang “ayon sa wangis ni Melquisedec” ay umaalingawngaw sa pananalita at argumento mula sa Awit 110:4 sa kabanatang ito.
    reason: cross_reference
lexical_decisions:
- source_word: περισσότερον ἔτι
  choice: lalo pa
  rationale: Pinananatili nito ang tumitinding paghahambing sa argumento sa natural na modernong Tagalog.
- source_word: κατάδηλόν
  choice: maliwanag
  rationale: Tumutukoy ito sa isang bagay na hayag o malinaw; hindi na dinagdagan ng “napaka-” dahil nasa “lalo pa” na ang pagpapatindi.
- source_word: εἰ
  choice: kung
  rationale: Pinananatili ang pormal na kondisyunal na anyo ng Griyego sa halip na tahimik na gawing “yamang” o “kapag.”
- source_word: κατὰ τὴν ὁμοιότητα
  choice: ayon sa wangis ni
  rationale: Malapit sa anyo ng Griyego at pinananatili ang ugnayan ng pananalita sa argumento mula sa Awit 110:4.
- source_word: Μελχισέδεκ
  choice: Melquisedec
  rationale: Ginamit ang kinikilalang anyo ng pangalang biblikal sa modernong Filipino.
- source_word: ἀνίσταται
  choice: bumabangon
  rationale: Pinananatili ang larawan ng paglitaw o pagbangon ng isang pari nang hindi tahasang ipinapasok ang ideya ng pagkabuhay na muli.
- source_word: ἱερεὺς ἕτερος
  choice: isa pang pari
  rationale: Likas sa Tagalog at naipahahayag ang paglitaw ng paring bukod sa naunang kaayusan; ang posibleng diin sa pagkakaiba ay inilagay sa talababa.
theological_decisions:
- issue: Diin ng ἕτερος kaugnay ng pagkasaserdote
  choice: isa pang pari
  alternative: ibang uri ng pari
  rationale: Maaaring idiin ng ἕτερος ang pagiging naiiba, ngunit hindi kailangang gawing tahasan sa pangunahing teksto ang “ibang uri.” Pinananatili ng salin ang tunay na saklaw ng salita, habang ipinapaliwanag sa talababa ang posibleng mas matinding diin.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Pinanatili ang kondisyunal na “kung” at ang bahagyang pormal na “ayon sa wangis” upang maingatan ang sintaks at intertekstuwal na ugnayan.
