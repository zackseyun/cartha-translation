  source_fidelity: Ang “bumabangon” ay posibleng salin ng ἀνίσταται, ngunit sa kondisyunal na pangungusap ay nagmumukhang paulit-ulit o pangkasalukuyang kilos sa Tagalog. Ang “kung may lumitaw na isa pang pari” ay mas likas at naipahahayag pa rin ang paglitaw/pagbangon ng isa pang pari. Ang “lalong malinaw” ay tumpak para sa περισσότερον ἔτι κατάδηλόν ἐστιν.
  naturalness: Ang “At lalo pa itong maliwanag kung bumabangon...” ay medyo hindi likas sa modernong Tagalog. Mas maayos ang “At lalo pang malinaw ito kung may lumitaw...” nang hindi binabago ang kondisyunal na lakas ng εἰ.
  terminology: Ang “pari,” “ayon sa wangis ni,” at “Melquisedec” ay angkop sa marangal at modernong Filipino Tagalog. Pinanatili ang “isa pang pari” para sa ἱερεὺς ἕτερος, at inilagay ang posibleng diin sa pagiging naiiba sa talababa.
  issues:
