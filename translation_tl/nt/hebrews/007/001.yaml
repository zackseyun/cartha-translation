id: HEB.7.1
reference: Hebrews 7:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Οὗτος γὰρ ὁ Μελχισέδεκ, βασιλεὺς Σαλήμ, ἱερεὺς τοῦ θεοῦ τοῦ ὑψίστου, ⸀ὁ συναντήσας Ἀβραὰμ ὑποστρέφοντι ἀπὸ τῆς κοπῆς τῶν βασιλέων καὶ εὐλογήσας αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/001.yaml
  text: For this Melchizedek[a], king of Salem, priest of God Most High, met Abraham as he was returning from the slaughter of the kings and blessed him[b],
translation:
  language: tl
  text: Sapagkat ang Melkisedek na ito, hari ng Salem at pari ng Diyos na Kataas-taasan, ay sumalubong kay Abraham habang nagbabalik si Abraham mula sa pagpatay sa mga hari[a], at binasbasan niya si Abraham,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “mula sa pagkatalo sa mga hari.” Mas literal na ang salitang Griyego ay tumutukoy sa pagpatay o pagpabagsak.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτος γὰρ ὁ Μελχισέδεκ
  choice: Sapagkat ang Melkisedek na ito
  rationale: Pinananatili ng “Sapagkat” ang paliwanag na ugnayan ng γάρ sa naunang argumento, at ng “na ito” ang diin ng demonstratibong Οὗτος. Ang “Melkisedek” ay tuwirang makabagong transliterasyon ng pangalang Griyego.
- source_word: βασιλεὺς Σαλήμ
  choice: hari ng Salem
  rationale: Tuwirang salin ng titulo at pangalang pook, at pinananatili ang malinaw na kaugnayan sa Genesis 14.
- source_word: ἱερεὺς τοῦ θεοῦ τοῦ ὑψίστου
  choice: pari ng Diyos na Kataas-taasan
  rationale: Malapit ito sa ayos ng Griyego at natural na ipinapahayag ang ὕψιστος bilang titulo ng Diyos.
- source_word: ὁ συναντήσας Ἀβραὰμ
  choice: ay sumalubong kay Abraham
  rationale: Sa konteksto ng pagbabalik ni Abraham, natural na ipinahahayag ng “sumalubong” ang sinadyang pakikipagtagpo na tinutukoy ng συναντήσας.
- source_word: ὑποστρέφοντι
  choice: habang nagbabalik ito
  rationale: Ipinakikita ng “habang” na kasabay ng pakikipagtagpo ang nagpapatuloy na pagbabalik ni Abraham, gaya ng present participle.
- source_word: ἀπὸ τῆς κοπῆς τῶν βασιλέων
  choice: mula sa paglipol sa mga hari
  rationale: Pinananatili ng “paglipol” ang marahas at militar na puwersa ng κοπή nang hindi ito pinahihinang basta “pagkatalo.”
- source_word: καὶ εὐλογήσας αὐτόν
  choice: at binasbasan niya si Abraham
  rationale: Tumpak na inilalahad ang ikalawang kilos ni Melkisedek. Inulit ang pangalang Abraham upang maiwasan ang malabong reperensiya ng magkasunod na panghalip sa Tagalog.
theological_decisions:
- issue: Paglalarawan sa banal na titulong τοῦ θεοῦ τοῦ ὑψίστου
  choice: Diyos na Kataas-taasan
  alternative: Kataas-taasang Diyos
  rationale: Kapuwa posible ang dalawang anyo. Ang pinili ay mas malapit sa ayos ng Griyego at malinaw na pinananatili ang “Kataas-taasan” bilang banal na titulo, nang walang idinaragdag na doktrinal na pagpapakahulugan.
- issue: Lakas ng kahulugan ng κοπή sa ulat tungkol sa mga hari
  choice: paglipol sa mga hari
  alternative: pagkatalo sa mga hari
  rationale: Ang κοπή ay literal na tumutukoy sa pagtabas o pagpatay. Pinananatili ng pangunahing salin ang tindi ng salita, habang inilalagay sa talababa ang mas kontekstuwal ngunit hindi gaanong literal na pagbasa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang paliwanag na “Sapagkat” at ang hulihang kuwit dahil nagpapatuloy sa susunod na talata ang pangungusap sa Griyego.
