    text: Maaari ring “iligtas magpakailanman”; ayon sa tradisyon, “iligtas hanggang sa sukdulan.”
    reason: lexical_alternative
  revision_rationale: Binago ang pangunahing pandiwa upang tahasang maipahayag ang δύναται bilang kasalukuyang kakayahan ni Cristo na magligtas, sa halip na isang posibleng panghinaharap o pasibong pagbasa. Inayos din ang talababa upang tumugma ang anyo ng pandiwa sa binagong pangunahing teksto. Walang pagbabago sa sinasabi ng talata o sa sinadyang pag-iingat sa dalawang saklaw ng εἰς τὸ παντελές.
