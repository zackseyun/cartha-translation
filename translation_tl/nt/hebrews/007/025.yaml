id: HEB.7.25
reference: Hebrews 7:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅθεν καὶ σῴζειν εἰς τὸ παντελὲς δύναται τοὺς προσερχομένους δι’ αὐτοῦ τῷ θεῷ, πάντοτε ζῶν εἰς τὸ ἐντυγχάνειν ὑπὲρ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/025.yaml
  text: Therefore he is also able to save completely those who draw near to God through him[a], since he always lives to intercede for them.
translation:
  language: tl
  text: Kaya naman, may kakayahan siyang iligtas nang lubos ang mga lumalapit sa Diyos sa pamamagitan niya,[a] sapagkat lagi siyang nabubuhay upang mamagitan para sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “iligtas magpakailanman”; ayon sa tradisyon, “iligtas hanggang sa sukdulan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: Kaya naman
  rationale: Ipinapakita ang bunga o kongklusyon mula sa naunang paliwanag tungkol sa permanenteng pagkasaserdote ni Jesus.
- source_word: καὶ
  choice: -man (sa “Kaya naman”)
  rationale: Likas na isinasama sa pariralang “Kaya naman” ang bahagyang pandagdag na diin ng καί nang hindi nagiging pilit ang Tagalog.
- source_word: σῴζειν
  choice: maililigtas
  rationale: Karaniwang salin sa kontekstong tumutukoy sa pagliligtas ng Diyos at pinananatili ang bigat ng terminong teolohikal.
- source_word: εἰς τὸ παντελές
  choice: lubos
  rationale: Sinasaklaw ang diwa ng ganap o lubusang pagliligtas, habang hindi isinasara ang posibleng temporal na diwang “magpakailanman,” na inilalahad sa talababa.
- source_word: δύναται
  choice: maililigtas
  rationale: Ang kakayahang ipinahahayag ng δύναται ay likas na naipapaloob sa anyong “maililigtas”; iniiwasan nito ang mas mabigat ngunit di-gaanong natural na “may kakayahang magligtas.”
- source_word: τοὺς προσερχομένους
  choice: ang mga lumalapit
  rationale: Pinananatili ang paulit-ulit na larawan sa Hebreo ng paglapit sa Diyos, kasama ang diwang pansamba at pakikipag-ugnayan.
- source_word: δι’ αὐτοῦ
  choice: sa pamamagitan niya
  rationale: Malinaw na ipinahahayag ang pamamagitan ni Jesus bilang daan ng paglapit sa Diyos.
- source_word: τῷ θεῷ
  choice: sa Diyos
  rationale: Natural at tuwirang katumbas ng paglapit sa Diyos.
- source_word: πάντοτε ζῶν
  choice: sapagkat lagi siyang nabubuhay
  rationale: Ipinakikita ang patuloy niyang buhay bilang batayan ng kakayahan niyang magligtas.
- source_word: εἰς τὸ ἐντυγχάνειν
  choice: upang mamagitan
  rationale: Pinananatili ang layunin ng patuloy niyang pamumuhay at ang kanyang gawaing kumakatawan sa mga lumalapit sa Diyos.
- source_word: ὑπὲρ αὐτῶν
  choice: para sa kanila
  rationale: Natural na Filipino para sa pagkilos alang-alang at bilang kinatawan nila.
theological_decisions:
- issue: Saklaw ng kahulugan ng εἰς τὸ παντελές
  choice: “lubos” sa pangunahing teksto
  alternative: “magpakailanman” o “hanggang sa sukdulan”
  rationale: Maaaring tumukoy ang parirala sa ganap na lawak o sa walang-hanggang bisa. Pinipili ng pangunahing teksto ang diwa ng lubos na pagliligtas, habang pinananatili sa talababa ang temporal at tradisyonal na mga posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lumalapit” upang mapanatili ang mahalagang bokabularyo ng paglapit sa Diyos sa Hebreo, at “mamagitan” bilang natural ngunit teolohikal na tumpak na paglalarawan sa patuloy na gawain ni Jesus.
