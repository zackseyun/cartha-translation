revisions:
- from: Kaya naman, lubos niyang maililigtas ang mga lumalapit sa Diyos sa pamamagitan niya,[a] sapagkat lagi siyang nabubuhay upang mamagitan para sa kanila.
  to: Kaya naman, may kakayahan siyang iligtas nang lubos ang mga lumalapit sa Diyos sa pamamagitan niya,[a] sapagkat lagi siyang nabubuhay upang mamagitan para sa kanila.
  rationale: Binago ang pangunahing pandiwa upang tahasang maipahayag ang δύναται bilang kasalukuyang kakayahan ni Cristo na magligtas, sa halip na isang posibleng panghinaharap o pasibong pagbasa. Inayos din ang talababa upang tumugma ang anyo ng pandiwa sa binagong pangunahing teksto. Walang pagbabago sa sinasabi ng talata o sa sinadyang pag-iingat sa dalawang saklaw ng εἰς τὸ παντελές.
