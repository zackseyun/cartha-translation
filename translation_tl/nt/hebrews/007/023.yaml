translation:
  language: tl
  text: At marami ang naging pari[a], sapagkat hinahadlangan sila ng kamatayan na magpatuloy sa kanilang tungkulin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “marami ang mga pari.”
