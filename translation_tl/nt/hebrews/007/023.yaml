lexical_decisions:
- source_word: Καὶ
  choice: At
  rationale: Pinananatili ang payak na pang-ugnay at ang daloy ng argumento mula sa naunang talata.
- source_word: οἱ μὲν πλείονές εἰσιν γεγονότες ἱερεῖς
  choice: naging marami ang mga paring iyon
  rationale: Ipinahahayag ang dami ng mga pari at ang aspektong resulta ng γεγονότες. Ang “iyon” ay likas na tumutukoy sa naunang kaayusan at tumutulong ihanda ang paghahambing sa kasunod na talata nang hindi tahasang idinaragdag ang “Levitico.”
- source_word: διὰ τὸ θανάτῳ κωλύεσθαι
  choice: sapagkat hinahadlangan sila ng kamatayan
  rationale: Malinaw na ipinakikita ang dahilan na ipinahahayag ng διά kasama ng articular infinitive, at pinananatili ang pasibong diwa ng κωλύεσθαι at ang kamatayan bilang humahadlang.
- source_word: παραμένειν
  choice: magpatuloy sa tungkulin
  rationale: Sa konteksto ng pagkapari, tumutukoy ito sa patuloy na panunungkulan. Nililinaw ng “sa tungkulin” ang kontekstuwal na kahulugan nang hindi nagdaragdag ng bagong teolohikong pahayag.
theological_decisions:
- issue: Paghahambing ng maraming dating pari at ng nananatiling pagkapari ni Jesus
  choice: Binibigyang-diin ang pagdami ng mga pari dahil nahahadlangan ng kamatayan ang kanilang patuloy na panunungkulan.
  alternative: Tahasang tawagin silang “mga paring Levitico” sa pangunahing teksto.
  rationale: Bagaman malinaw sa konteksto ang kaayusang Levitico, hindi ito tahasang pinangalanan sa talata. Iniiwasang magdagdag sa pangunahing teksto at pinananatili ang paghahandang retorikal para sa paghahambing sa talata 24.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “paring iyon” upang natural na katawanin ang pangkat na tinutukoy ng οἱ at ang paghahambing na ipinahihiwatig ng μέν, habang nananatiling hindi labis na interpretatibo.
