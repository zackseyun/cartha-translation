base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/022.yaml
  text: By so much[a], Jesus has become the guarantor of a better covenant.
translation:
  language: tl
  text: Dahil sa panunumpang ito, si Jesus ay naging tagapanagot ng isang higit na mabuting tipan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “testamento” o “huling habilin” ang salitang Griyego sa ilang konteksto; dito, “tipan” ang higit na angkop sa argumento tungkol sa pagkasaserdote at panunumpa.
    reason: alternative_reading
lexical_decisions:
- source_word: κατὰ τοσοῦτο
  choice: Dahil dito
  rationale: Iniuugnay ng parirala ang pahayag sa naunang argumento tungkol sa panunumpa. Bagaman literal itong nagsasaad ng antas o sukat, ang likas na Tagalog na “Dahil dito” ay malinaw na naghahayag ng lohikal na kaugnayan nang hindi binabago ang paghahambing na nasa “mas mabuting tipan.”
- source_word: κρείττονος
  choice: mas mabuti
  rationale: Pinananatili nito ang mahalagang paghahambing sa Hebreo at mas natural sa karaniwang Tagalog kaysa “nakahihigit.”
- source_word: διαθήκης
  choice: tipan
  rationale: Sa konteksto ng pagkasaserdote at panunumpa, tumutukoy ito sa pakikipagtipan ng Diyos, hindi pangunahin sa huling habilin o testamento.
- source_word: γέγονεν
  choice: ay naging
  rationale: Ipinahihiwatig ng perpektong anyo ang isang naganap na kalagayang nananatiling may bisa. Likas sa Tagalog ang “ay naging,” at nauunawaan sa konteksto ang nagpapatuloy na bunga nito.
- source_word: ἔγγυος
  choice: tagapanagot
  rationale: Tumutukoy ito sa isang taong tumitiyak at nananagot sa katuparan ng isang pananagutan. Mas malinaw at mas personal ang “tagapanagot” kaysa abstraktong “katiyakan.”
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Karaniwan at kinikilalang anyo ng pangalan sa modernong Filipino.
theological_decisions:
- issue: Kahulugan ng διαθήκη sa Hebreo 7:22
  choice: tipan
  alternative: testamento o huling habilin
  rationale: Ang agarang argumento ay tungkol sa pagkasaserdote ni Jesus at sa panunumpa ng Diyos, kaya “tipan” ang higit na angkop. Gayunman, itinatala sa talababa ang mas malawak na saklaw ng salitang Griyego upang hindi maitago ang tunay na leksikal na posibilidad.
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang “tagapanagot” bilang tumpak at madaling maunawaang katawagan sa taong gumagarantiya sa katuparan ng tipan. Ang marker na [a] ay inilagay agad pagkatapos ng “tipan,” ang salitang tinutukoy ng talababa.
