    issue: Hindi ganap na naihahatid ng “Dahil dito” ang κατὰ τοσοῦτο.
    rationale: Ang Griyego ay hindi lamang pangkaraniwang pangatnig na nagpapakita ng resulta; itinatali nito ang pagiging tagapanagot ni Jesus sa antas ng naunang pagkakaibang kaugnay ng panunumpa. Ang pagtukoy sa “panunumpang ito” ay ginagawang malinaw ang tinutukoy na batayan.
  revised_text: Dahil sa panunumpang ito, si Jesus ay naging tagapanagot ng isang higit na mabuting tipan.[a]
