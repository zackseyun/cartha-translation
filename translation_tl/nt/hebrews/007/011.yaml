  naturalness: Marangal at likas sa modernong Filipino ang pangungusap. Mas malinaw at hindi malabo ang “batay sa pagkaparing iyon” kaysa “batay rito,” lalo na sa isang masinsing pangungusap na may Kautusan at pagkapari.
  terminology: Ang “kasakdalan,” “pagkaparing Levitico,” “Kautusan,” at “kaayusan” ay angkop at pinananatili ang teknikal at teolohikal na bigat nang hindi nagpapataw ng isang partikular na pagpapakahulugan. Ang mga pangalang Melquisedec at Aaron ay nananatiling pamilyar na anyong biblikal sa Filipino.
