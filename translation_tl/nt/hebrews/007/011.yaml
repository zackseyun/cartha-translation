id: HEB.7.11
reference: Hebrews 7:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Εἰ μὲν οὖν τελείωσις διὰ τῆς Λευιτικῆς ἱερωσύνης ἦν, ὁ λαὸς γὰρ ἐπ’ ⸀αὐτῆς ⸀νενομοθέτηται, τίς ἔτι χρεία κατὰ τὴν τάξιν Μελχισέδεκ ἕτερον ἀνίστασθαι ἱερέα καὶ οὐ κατὰ τὴν τάξιν Ἀαρὼν λέγεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/011.yaml
  text: If perfection had been through the Levitical priesthood—for on its basis the people had received the law—what further need was there for another priest to arise according to the order of Melchizedek and not be spoken of according to the order of Aaron?[a][b]
translation:
  language: tl
  text: Kaya, kung ang kasakdalan ay makakamit sa pamamagitan ng pagkaparing Levitico—sapagkat batay sa pagkaparing iyon ay ibinigay ang Kautusan sa bayan[a]—bakit kailangan pang lumitaw ang ibang pari ayon sa kaayusan ni Melquisedec at hindi tawaging ayon sa kaayusan ni Aaron?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sapagkat sa ilalim ng pagkaparing iyon ay binigyan ng Kautusan ang bayan.” Ipinahihiwatig ng Griyego na ang legal na kaayusan ng Israel ay nakasalig sa pagkaparing Levitico.
    reason: lexical_alternative
  - marker: b
    text: O “at hindi ituring na kabilang sa kaayusan ni Aaron.”
    reason: alternative_reading
lexical_decisions:
- source_word: τελείωσις
  choice: kasakdalan
  rationale: Pinananatili nito ang malawak na bigat ng salita sa Hebreo—hindi lamang moral na pagbuti kundi ang pagdadala sa nilalayong ganap na kalagayan—nang hindi nilulutas sa salin ang kahulugang hinuhubog ng konteksto.
- source_word: διὰ τῆς Λευιτικῆς ἱερωσύνης
  choice: sa pamamagitan ng pagkaparing Levitico
  rationale: Malinaw na ipinapahayag ang paraan o kasangkapan na ipinahihiwatig ng διά na may genitive.
- source_word: ἐπ’ αὐτῆς
  choice: batay rito
  rationale: Likas sa Filipino at tumutukoy sa pinakamalapit na angkop na pambabaeng antecedent sa Griyego, ang pagkaparing Levitico, bilang saligan ng kaayusang legal ng bayan.
- source_word: νενομοθέτηται
  choice: ibinigay ang Kautusan sa bayan
  rationale: Inihahatid nito sa likas na Filipino ang diwang ang bayan ay tumanggap ng batas o inilagay sa ilalim ng kaayusang legal; pinananatili ng footnote ang mas pormal na alternatibo.
- source_word: τίς ἔτι χρεία
  choice: bakit kailangan pa
  rationale: Natural na anyo ng retorikal na tanong sa modernong Filipino at pinananatili ang diwa ng nagpapatuloy o karagdagang pangangailangan.
- source_word: κατὰ τὴν τάξιν Μελχισέδεκ
  choice: ayon sa kaayusan ni Melquisedec
  rationale: Ang “kaayusan” ay nagpapanatili sa kahulugan ng τάξις bilang hanay, uri, o itinalagang kaayusan; ang “ayon sa” ay malapit sa κατά.
- source_word: ἕτερον ... ἱερέα
  choice: ibang pari
  rationale: Naipapahiwatig ang isa pang pari na naiiba ang uri, at nililinaw ng kasunod na paghahambing kay Aaron ang pagkakaibang iyon.
- source_word: ἀνίστασθαι
  choice: lumitaw
  rationale: Ipinapahayag ang pagbangon o pagdating ng isang pari sa papel na ito nang hindi di-sinasadyang magpahiwatig ng muling pagkabuhay.
- source_word: καὶ οὐ ... λέγεσθαι
  choice: at hindi tawaging ayon sa kaayusan ni Aaron
  rationale: Ang “tawaging” ay natural at tuwirang nagsasaad kung paano inilalarawan o itinatakda ang pari; ang footnote ay nagbibigay ng alternatibong mas tahasang tumutukoy sa pagkakabilang.
- source_word: Μελχισέδεκ / Ἀαρών
  choice: Melquisedec / Aaron
  rationale: Ginamit ang mga pangalang pamilyar sa tradisyong biblikal sa Filipino habang nananatiling madaling makilala ng modernong mambabasa.
theological_decisions:
- issue: Kahulugan ng τελείωσις sa argumento tungkol sa pagkapari
  choice: kasakdalan
  alternative: kaganapan; ganap na paglapit sa Diyos
  rationale: Hindi ito nilimitahan sa moral na kawalang-kapintasan o ipinaliwanag agad bilang paglapit sa Diyos. Hinahayaang tukuyin ng mas malawak na konteksto ng Hebreo ang kultiko at panligtas na bigat nito.
- issue: Tinutukoy ng αὐτῆς sa ἐπ’ αὐτῆς νενομοθέτηται
  choice: ang pagkaparing Levitico
  alternative: ang Kautusan; ang mas malawak na kaayusan ng tipan
  rationale: Ang pagkapari ang pinakamalapit na angkop na antecedent sa balarilang Griyego, at ang paningit na sugnay ay nagpapaliwanag sa kaugnayan ng pagkapari at ng legal na kaayusan ng bayan.
- issue: Diwa ng λέγεσθαι kaugnay ng kaayusan ni Aaron
  choice: tawaging ayon sa kaayusan ni Aaron
  alternative: ituring na kabilang sa kaayusan ni Aaron
  rationale: Pinananatili ang anyo ng pagkakalarawan o pagtatalaga nang hindi inaangkin na simpleng pangalan lamang ang usapin; nililinaw ng footnote ang alternatibong diwa ng pagkakabilang.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “pagkaparing Levitico,” “Kautusan,” at “kaayusan” upang mapanatili ang teknikal na argumento nang hindi maging sobrang makaluma. Isinalin ang inferential οὖν bilang “Kaya,” ngunit walang idinagdag na temporal na “ngayon.” Lahat ng footnote marker ay nasa pangunahing teksto.
