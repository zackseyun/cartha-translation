  text: οὐδὲν γὰρ ἐτελείωσεν ὁ νόμος, ἐπεισαγωγὴ δὲ κρείττονος ἐλπίδος, δι’ ἧς ἐγγίζομεν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/019.yaml
  text: For the law perfected nothing[a], but there is the introduction of a better hope[b], through which we draw near to God.
translation:
  language: tl
  text: Sapagkat walang ginawang ganap ang Kautusan; ngunit may pagpapasok ng isang mas mabuting pag-asa, na sa pamamagitan nito ay lumalapit tayo sa Diyos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲν
  choice: walang
  rationale: 'Kasama ng pandiwang “ginawang ganap,” likas nitong ipinahahayag sa Tagalog ang ganap na pagtanggi: walang anumang ginawang ganap.'
- source_word: γὰρ
  choice: Sapagkat
  rationale: Nagbibigay ito ng paliwanag o batayan para sa naunang pahayag at malinaw na naipapakita ng “Sapagkat” ang ugnayang iyon.
- source_word: ἐτελείωσεν
  choice: ginawang ganap
  rationale: Pinananatili nito ang mahalagang diwa sa Hebreo ng pagdadala sa nilalayong kaganapan o kalubusan, nang hindi ito pinapahina tungo sa simpleng “walang nagawa.”
- source_word: ὁ νόμος
  choice: ang Kautusan
  rationale: Tumutukoy ito sa kilalang Kautusan ni Moises at sa sistemang legal at pangsaserdote sa konteksto; nakatutulong ang malaking titik upang malinaw ang tiyak na reperensiya.
- source_word: δὲ
  choice: sa halip
  rationale: Malinaw nitong ipinahahayag ang matinding paghahambing sa pagitan ng hindi nagawa ng Kautusan at ng pagpasok ng mas mabuting pag-asa.
- source_word: ἐπεισαγωγὴ
  choice: ipinasok
  rationale: Isinasalin nito nang natural ang pambalangkas na nominal at eliptikong parirala bilang isang pandiwang sugnay, habang pinananatili ang diwa ng pagdadala o pagpapasok ng isang bagay na higit.
- source_word: κρείττονος ἐλπίδος
  choice: isang mas mabuting pag-asa
  rationale: Pinananatili ng “mas mabuti” ang paulit-ulit at mahalagang paghahambing sa Hebreo; ang “isang” ay likas na katumbas ng anarthrous na parirala.
- source_word: δι’ ἧς
  choice: sa pamamagitan nito
  rationale: Ang panghalip na pambabae sa Griyego ay pinakanatural na tumutukoy sa “pag-asa”; malinaw na ipinahahayag nito ang paraan o kasangkapan.
- source_word: ἐγγίζομεν
  choice: lumalapit tayo
  rationale: Natural ito sa modernong Tagalog at pinananatili ang diwa ng paglapit sa Diyos, kabilang ang kontekstong pangsamba at pag-access sa presensiya niya.
- source_word: τῷ θεῷ
  choice: sa Diyos
  rationale: Ito ang karaniwan at malinaw na Tagalog na kapupunan ng “lumalapit.”
theological_decisions:
- issue: Kahulugan ng τελειόω kaugnay ng Kautusan
  choice: Hindi ginawang ganap ng Kautusan ang anuman.
  alternative: Walang anumang nagawa ang Kautusan.
  rationale: Ang “ginawang ganap” ay nagpapanatili sa teolohikal na bigat ng salita—pagdadala sa nilalayong kaganapan at ganap na paglapit sa Diyos—nang hindi ipinahihiwatig na lubusang walang silbi ang Kautusan sa lahat ng bagay.
- issue: Eliptikong paghahambing pagkatapos ng pahayag tungkol sa Kautusan
  choice: Isinalin bilang “sa halip, ipinasok ang isang mas mabuting pag-asa.”
  alternative: “ngunit ang pagpapasok ng isang mas mabuting pag-asa” o “ngunit may pagpapasok ng isang mas mabuting pag-asa.”
  rationale: Walang tahasang pandiwang may takda sa ikalawang bahagi ng Griyego. Ang pasibong pandiwa sa Tagalog ay natural ngunit hindi nagdaragdag ng tahasang tagagawa o hindi kinakailangang pagtukoy sa panahon.
- issue: Tinutukoy ng δι’ ἧς
  choice: Ang “nito” ay tumutukoy sa mas mabuting pag-asa.
  alternative: Maaaring iugnay sa buong pangyayari ng pagpapasok ng pag-asa.
  rationale: Ang pagkakatugma ng pambabaeng panghalip sa ἐλπίδος ang pinakamalapit na gramatikal na batayan, ngunit hindi dinaragdagan ng salin ang paliwanag na lampas sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Kautusan” para sa tiyak na Kautusan ni Moises, “ginawang ganap” upang mapanatili ang susing bokabularyo ng Hebreo, at pandiwang “ipinasok” upang maging natural ang eliptikong nominal na kayarian ng Griyego.
