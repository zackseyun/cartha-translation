base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/024.yaml
  text: But he[a], because he remains forever, holds the priesthood permanently.
translation:
  language: tl
  text: Ngunit dahil nananatili siya magpakailanman, taglay niya ang permanenteng pagkapari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “taglay niya ang pagkaparing hindi nagbabago” o “may pagkapari siyang hindi naipapasa sa iba.” Maaaring mangahulugan ang salitang Griyego ng alinman sa mga ito; sa konteksto, ang punto ay hindi napupunta sa iba ang kanyang pagkapari sapagkat nabubuhay siya magpakailanman.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Ngunit … siya
  rationale: Ang artikulo ay ginagamit bilang panghalip at tumutukoy kay Jesus, bilang kaibahan sa maraming paring binanggit sa naunang talata. Ipinahahayag ng “ngunit” ang pagsalungat ng δέ sa natural na Tagalog.
- source_word: διὰ τὸ μένειν αὐτὸν
  choice: dahil nananatili siya
  rationale: Ang διά na sinusundan ng articular infinitive ay nagsasaad ng dahilan. Ipinananatili ng “nananatili” ang diwang nagpapatuloy siya sa pag-iral, salungat sa mga paring namamatay.
- source_word: εἰς τὸν αἰῶνα
  choice: magpakailanman
  rationale: Ito ang natural at marangal na katumbas ng idyomang tumutukoy sa panahong walang wakas.
- source_word: ἀπαράβατον
  choice: nang permanente
  rationale: Sa konteksto, ang pagkapari ni Jesus ay patuloy na taglay niya at hindi naipapasa sa kahalili sapagkat nabubuhay siya magpakailanman. Hindi ganap na nilulutas ng pangunahing salin ang maaaring diwang “hindi nagbabago” o “hindi naipapasa”; inilalahad ang mga ito sa talababa.
- source_word: ἔχει τὴν ἱερωσύνην
  choice: taglay niya … ang pagkapari
  rationale: Ipinahahayag ng ἔχω ang patuloy na paghawak o pagtataglay ng katungkulang pansaserdote. Ang “taglay” ay natural at angkop sa dignidad ng teksto.
- source_word: ἱερωσύνην
  choice: pagkapari
  rationale: Ang salita ay tumutukoy sa katungkulan o kalagayan ng pagiging pari; “pagkapari” ang malinaw at karaniwang salin sa kontekstong ito.
theological_decisions:
- issue: Kahulugan ng ἀπαράβατον kaugnay ng pagkapari ni Cristo
  choice: Isinaling “nang permanente” upang idiin na patuloy na taglay ni Jesus ang pagkapari dahil nananatili siya magpakailanman.
  alternative: “pagkaparing hindi nagbabago” o “pagkaparing hindi naipapasa sa iba”
  rationale: Ang konteksto ay naghahambing kay Jesus sa mga paring namamatay at pinapalitan. Ipinahahayag ng pangunahing salin ang permanenteng pananatili ng kanyang katungkulan nang hindi nagpapasok ng mas makitid na doktrinal na pagpapakahulugan; pinananatili sa talababa ang tunay na saklaw ng salitang Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pagkapari” bilang karaniwang katawagan sa katungkulang pansaserdote at iniwasan ang teknikal o denominasyonal na pananalita.
