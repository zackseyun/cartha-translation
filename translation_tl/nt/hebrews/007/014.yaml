id: HEB.7.14
reference: Hebrews 7:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πρόδηλον γὰρ ὅτι ἐξ Ἰούδα ἀνατέταλκεν ὁ κύριος ἡμῶν, εἰς ἣν φυλὴν ⸂περὶ ἱερέων οὐδὲν⸃ Μωϋσῆς ἐλάλησεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/014.yaml
  text: For it is evident that our Lord has arisen from Judah[a], a tribe about which Moses said nothing concerning priests.
translation:
  language: tl
  text: Sapagkat malinaw na nagmula sa Juda[a] ang ating Panginoon, at tungkol sa liping iyon ay walang sinabi si Moises hinggil sa mga pari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “sumibol mula sa Juda.” Ang pandiwang Griyego ay naglalarawan ng pagsikat o pagsibol; dito, tumutukoy ito sa pinagmulan sa lipi ng Juda, hindi pangunahin sa muling pagkabuhay.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρόδηλον
  choice: malinaw
  rationale: Likas at tuwirang Filipino para sa predikatibong pang-uring nagsasaad na hayag o tiyak ang katotohanang kasunod.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na kaugnayan ng talata sa naunang pangangatwiran.
- source_word: ἐξ Ἰούδα
  choice: mula sa Juda
  rationale: Ipinapahayag ang pinagmulan o angkan nang hindi inuulit agad ang salitang 'lipi,' na tahasang lumilitaw sa kasunod na sugnay.
- source_word: ἀνατέταλκεν
  choice: nagmula
  rationale: Sa konteksto, tumutukoy ang perpektong anyo sa paglitaw o pagsibol ng Panginoon mula sa Juda bilang pinagmulan ng angkan. Natural ito sa Filipino, habang inilalagay sa talababa ang mas matalinghagang larawan ng pandiwa.
- source_word: ὁ κύριος ἡμῶν
  choice: ang ating Panginoon
  rationale: Natural na ayos sa Filipino at pinananatili ang titulo nang hindi idinaragdag ang pangalang Jesus.
- source_word: εἰς ἣν φυλήν
  choice: tungkol sa liping iyon
  rationale: Ipinakikilala nang malinaw ang liping kababanggit lamang at natural na iniuugnay ito sa pananahimik ni Moises.
- source_word: περὶ ἱερέων οὐδὲν
  choice: walang sinabi ... hinggil sa mga pari
  rationale: Pinananatili ang tiyak na pagtukoy ng Griyego sa mga pari, hindi sa abstraktong institusyon ng pagkapari.
- source_word: Μωϋσῆς ἐλάλησεν
  choice: sinabi ni Moises
  rationale: Karaniwan at malinaw na katumbas ng λαλέω sa kontekstong ito.
theological_decisions:
- issue: Tinutukoy ng “ating Panginoon”
  choice: Pinanatili ang “ating Panginoon” nang hindi idinaragdag ang “Jesus.”
  alternative: ang ating Panginoong Jesus
  rationale: Malinaw sa konteksto na si Jesus ang tinutukoy, ngunit hindi binabanggit ang pangalan sa mismong talata; pinananatili ng salin ang anyo ng teksto.
- issue: Diwa ng ἀνατέταλκεν
  choice: nagmula, na may talababa para sa larawang “sumibol”
  alternative: bumangon / muling nabuhay
  rationale: Ang usapan ay tungkol sa pinagmulan sa lipi ng Juda at hindi pangunahing tungkol sa muling pagkabuhay. Iniiwasan ng pangunahing salin ang maling pagkaunawa habang pinananatili sa talababa ang tunay na talinghaga.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “hinggil sa” upang mapanatili ang bahagyang pormal na himig ng pangangatwiran, habang nananatiling madaling maunawaan.
