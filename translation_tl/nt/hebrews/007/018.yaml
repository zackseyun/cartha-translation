id: HEB.7.18
reference: Hebrews 7:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀθέτησις μὲν γὰρ γίνεται προαγούσης ἐντολῆς διὰ τὸ αὐτῆς ἀσθενὲς καὶ ἀνωφελές,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/018.yaml
  text: For there is indeed a setting aside of the former commandment because of its weakness and uselessness[b][a],
translation:
  language: tl
  text: Sapagkat pinawawalang-bisa ang naunang utos[a] dahil mahina at walang pakinabang ito[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “utos na nauna” o “utos na naunang umiral.”
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, hindi ito mabisa sa pagdadala ng kasakdalang tinatalakay sa konteksto (tingnan ang Hebreo 7:19); hindi nito sinasabing masama sa sarili nito ang naunang kapahayagan ng Diyos.
    reason: cross_reference
lexical_decisions:
- source_word: ἀθέτησις
  choice: pinawawalang-bisa
  rationale: Ipinapahayag nito ang pagpapawalang-lakas o pagkakansela ng utos, at pinananatili ang legal na diwa ng pangngalan.
- source_word: μὲν γὰρ
  choice: Sapagkat
  rationale: Ang γάρ ay nagbibigay ng paliwanag sa naunang pahayag; ang μέν ay naghahanda ng paghahambing sa susunod na talata, ngunit hindi kailangang tumbasan nang mekanikal sa natural na Tagalog.
- source_word: γίνεται
  choice: pinawawalang-bisa
  rationale: Isinama ang diwang 'nagaganap/mayroong pagpapawalang-bisa' sa natural na pandiwang Tagalog.
- source_word: προαγούσης ἐντολῆς
  choice: ang naunang utos
  rationale: Ang προαγούσης ay tumutukoy sa utos na nauna o naunang umiiral; malinaw at natural ang 'naunang utos.'
- source_word: ἀσθενές
  choice: mahina
  rationale: Direktang pinananatili ang matalas na pagtataya ng teksto na kulang ito sa lakas o bisa para sa layuning tinatalakay.
- source_word: ἀνωφελές
  choice: walang pakinabang
  rationale: Natural na Tagalog para sa hindi kapaki-pakinabang o hindi nakapagdudulot ng nilalayong resulta, habang pinananatili ang lakas ng orihinal.
- source_word: διὰ τὸ αὐτῆς ἀσθενὲς καὶ ἀνωφελές
  choice: dahil mahina at walang pakinabang ito
  rationale: Malinaw na ipinapakita ang dahilan at ang dalawang magkaugnay na negatibong paglalarawan sa utos.
theological_decisions:
- issue: Saklaw ng pagpuna sa naunang utos
  choice: Panatilihin ang tahasang 'mahina at walang pakinabang,' na inuunawa sa konteksto ng kakayahan nitong magdala ng kasakdalan sa usapin ng pagkasaserdote.
  alternative: Sabihing ang buong Kautusang Mosaiko ay lubos na walang halaga, o palambutin ang negatibong pagtataya.
  rationale: Ang agarang konteksto, lalo na ang Hebreo 7:11 at 7:19, ay tungkol sa hindi nito pagkamit ng kasakdalang tinatalakay. Hindi dapat pahinain ang pananalita ng may-akda ni palawakin ito lampas sa konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'pinawawalang-bisa' upang mapanatili ang legal na puwersa ng ἀθέτησις, at ang matalas na 'mahina at walang pakinabang' upang hindi palambutin ang teolohikal na tensiyon.
