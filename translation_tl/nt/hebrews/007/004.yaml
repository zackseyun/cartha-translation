  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Θεωρεῖτε δὲ πηλίκος οὗτος ⸀ᾧ δεκάτην Ἀβραὰμ ἔδωκεν ἐκ τῶν ἀκροθινίων ὁ πατριάρχης.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/004.yaml
  text: Consider how great this man was[b][a], to whom Abraham the patriarch gave a tenth of the spoils.
translation:
  language: tl
  text: 'Isipin ninyo kung gaano kadakila ang taong ito: si Abraham, ang patriyarka, ay nagbigay sa kaniya ng ikasampung bahagi[a] mula sa mga samsam[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, “ikapu.” Literal sa Griyego: “isang ikasampu.”'
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Griyego ay tumutukoy sa mga samsam sa digmaan at maaari ring magpahiwatig ng pinakamainam na bahagi ng mga iyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: Θεωρεῖτε
  choice: Isipin ninyo
  rationale: Ang pangkasalukuyang pautos na maramihan ay nananawagan sa mga mambabasa na pag-isipang mabuti ang punto; natural at malinaw ito sa makabagong Tagalog.
- source_word: δὲ
  choice: hindi tahasang isinalin
  rationale: Mahinang panandang pandiskurso lamang ito rito. Sapat na naipahihiwatig ng daloy at ng tutuldok ang paglipat ng argumento, nang hindi nagdaragdag ng temporal na 'ngayon.'
- source_word: πηλίκος
  choice: kung gaano kadakila
  rationale: Tuwirang pinananatili ang ideya ng laki o kadakilaan nang hindi ipinapasya kung ito ay tumutukoy sa ranggo, kahalagahan, o karangalan.
- source_word: οὗτος
  choice: ang taong ito
  rationale: Tumutukoy kay Melquisedec sa naunang konteksto at natural na ipinahahayag sa Tagalog ang panlalaking isahang reperente.
- source_word: ᾧ
  choice: sa kaniya
  rationale: Likas na Tagalog na katumbas ng datibong panghalip na tumutukoy sa tumanggap ng ibinigay ni Abraham.
- source_word: δεκάτην
  choice: ikasampung bahagi
  rationale: Pinananatili ang literal na kahulugang 'isang ikasampu' at iniiwasang ipasok sa pangunahing teksto ang posibleng institusyonal na dating ng 'ikapu.'
- source_word: Ἀβραὰμ
  choice: Abraham
  rationale: Karaniwang anyo ng pangalang biblikal sa modernong Filipino.
- source_word: ἔδωκεν
  choice: nagbigay
  rationale: Payak at eksaktong katumbas ng aorist na δίδωμι sa kontekstong ito.
- source_word: ἐκ τῶν ἀκροθινίων
  choice: mula sa mga samsam
  rationale: Ipinahahayag ang pinagmulan ng ikasampung bahagi at ang mga bagay na nakuha bilang samsam; ang posibleng diwang 'pinakamainam na bahagi' ay inilagay sa talababa dahil hindi tiyak na kailangang idiin sa pangunahing teksto.
- source_word: ὁ πατριάρχης
  choice: na patriyarka
  rationale: Pinananatili ang titulong nagbibigay-diin sa katayuan ni Abraham bilang pangunahing ninuno; ang ayos na ito ay likas sa Tagalog at nagbibigay-diin sa bigat ng kaniyang pagkakakilanlan.
theological_decisions:
- issue: Reperente at puwersang nagpapahalaga sa talata
  choice: Itinatampok ang kadakilaan ni Melquisedec sa pamamagitan ng katotohanang maging si Abraham, ang patriyarka, ay nagbigay sa kaniya ng ikasampung bahagi.
  alternative: Maaaring gawing mas tahasan na ipinahihiwatig nito ang nakahihigit na katayuan ni Melquisedec sa tumatanggap ng ikapu.
  rationale: Malinaw na ginagamit ng Griyego ang ginawa ni Abraham bilang patunay ng kadakilaan ni Melquisedec, ngunit hindi dapat isingit sa salin ang mas ganap na teolohikal na kongklusyon na binubuo ng kasunod na argumento.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maramihang 'ninyo' upang panatilihin ang pakikipag-usap sa buong kapulungan. Ang 'maging si Abraham' ay natural na nagpapakita ng retorikal na bigat ng pagkakakilanlan niyang patriyarka, nang hindi nagdaragdag ng teolohikal na paliwanag.
