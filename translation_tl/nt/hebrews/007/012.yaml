  yaml_path: translation/nt/hebrews/007/012.yaml
  text: For when the priesthood is changed[a], of necessity there is also a change of law.
translation:
  language: tl
  text: Sapagkat sa pagbabago ng pagkasaserdote, kinakailangan ding magkaroon ng pagbabago sa kautusan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “pagbabago sa Kautusan,” na sa konteksto ay tumutukoy sa Kautusan ni Moises na nagtatatag ng Levitikong pagkasaserdote.'
    reason: alternative_reading
lexical_decisions:
- source_word: μετατιθεμένης
  choice: kapag binago
  rationale: Ipinahahayag ng genitive absolute participle ang kalagayang nagsisilbing batayan ng kasunod na lohikal na bunga. Ang “binago” ay malinaw at hindi nililimitahan ang diwa sa simpleng paglilipat lamang.
- source_word: ἱερωσύνης
  choice: pagkasaserdote
  rationale: Tumutukoy ito sa institusyon o tungkulin ng pagiging saserdote, hindi lamang sa gawain ng isang indibidwal na saserdote.
- source_word: ἐξ ἀνάγκης
  choice: kinakailangan
  rationale: 'Inilalahad nito ang lohikal na pangangailangan: kaakibat ng pagbabago sa pagkasaserdote ang pagbabago sa kautusan.'
- source_word: νόμου
  choice: sa kautusan
  rationale: Ang νόμος na walang artikulo ay maaaring tumukoy sa kaayusang legal na namamahala sa pagkasaserdote; sa konteksto, likas na kabilang dito ang Kautusan ni Moises. Ang “kautusan” ay dignified at karaniwang terminong biblikal sa Filipino.
- source_word: μετάθεσις
  choice: pagbabago
  rationale: Pinananatili nito ang ugnayang leksikal sa naunang “binago” at hindi labis na nagpapakahulugan bilang ganap na pag-aalis o administratibong paglilipat.
- source_word: γίνεται
  choice: magkaroon
  rationale: Natural na Filipino ito para sa paglitaw o pag-iral ng kinakailangang kasunod na pagbabago.
- source_word: καὶ
  choice: din
  rationale: 'Malinaw na ipinakikita ang pandagdag na ugnayan: ang pagbabago sa kautusan ay kasama ring bunga ng pagbabago sa pagkasaserdote.'
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ikinakabit nito ang talata bilang paliwanag o batayan ng naunang argumento.
theological_decisions:
- issue: Saklaw ng νόμος kaugnay ng pagkasaserdote
  choice: “sa kautusan” sa pangunahing teksto, na maaaring tumukoy sa legal na kaayusang namamahala sa pagkasaserdote at, ayon sa konteksto, sa Kautusan ni Moises
  alternative: “sa Kautusan,” na tahasang tumutukoy sa Kautusan ni Moises
  rationale: Malinaw na nasa konteksto ang sistemang Mosaiko, ngunit hindi kailangan ng anyong Griego na gawing tahasan sa pangunahing teksto ang mas makitid na pagtukoy. Pinananatili ng talababa ang kontekstuwal na posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pagkasaserdote” at “kautusan” bilang natural at pamilyar na mga terminong biblikal, habang pinanatili ang lohikal na pangangatwiran at ang bahagyang kaluwagan ng νόμος.
