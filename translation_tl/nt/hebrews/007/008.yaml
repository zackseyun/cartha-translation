  text: And here mortal men receive tithes[a], but there he is testified to be living.
translation:
  language: tl
  text: At dito, mga taong namamatay ang tumatanggap ng ikapu; ngunit doon ay may tumatanggap ng mga iyon, na pinatotohanang siya ay nabubuhay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ngunit doon ay tinatanggap ang mga iyon ng isa na pinatotohanang siya ay nabubuhay.” Ipinahihiwatig ng Griyego ang pandiwang “tumatanggap” mula sa unang sugnay at pinananatili ang pahayag bilang patotoo ng Kasulatan, sa halip na tuwirang igiit na literal na imortal si Melquisedec.
    reason: alternative_reading
lexical_decisions:
- source_word: ὧδε
  choice: dito
  rationale: Pinananatili ang maikli at tuwirang paghahambing sa ἐκεῖ (“doon”), na tumutukoy sa kasalukuyang kalagayan ng mga paring Levita.
- source_word: δεκάτας
  choice: ikapu
  rationale: Ito ang natural at karaniwang terminong Tagalog para sa ikasampung bahaging ibinibigay sa kontekstong panrelihiyon.
- source_word: ἀποθνῄσκοντες ἄνθρωποι
  choice: mga taong namamatay
  rationale: Tuwirang pinananatili ang participial na paglalarawan at ang diin sa mortalidad ng mga tumatanggap ng ikapu.
- source_word: λαμβάνουσιν
  choice: tumatanggap
  rationale: Natural na salin sa konteksto at hindi nagdaragdag ng diwang gaya ng sapilitang pangongolekta.
- source_word: ἐκεῖ
  choice: doon
  rationale: Pinananatili ang retorikal na tambalan ng “dito … doon,” na inililipat ang pansin sa paglalarawan kay Melquisedec sa Kasulatan.
- source_word: μαρτυρούμενος
  choice: pinatotohanan tungkol sa kanya
  rationale: 'Pinananatili ang balintiyak at evidensiyal na diwa: ang pahayag ay nasa anyo ng patotoo tungkol kay Melquisedec, hindi isang tuwirang pagpapahayag ng tagapagsalin.'
- source_word: ὅτι ζῇ
  choice: na siya ay buhay
  rationale: Natural na Tagalog na nagpapanatili sa pangkasalukuyang diwa ng ζῇ at sa nilalaman ng patotoo.
theological_decisions:
- issue: Ang uri ng paghahambing sa mga paring Levita at kay Melquisedec
  choice: Inihahambing ang mga paring namamatay sa isang taong pinatotohanan ng Kasulatan na buhay.
  alternative: Tahasang itinuturo ng talata na literal at patuloy na imortal si Melquisedec.
  rationale: Ang balintiyak na “pinatotohanan” ay pinanatili upang manatili ang argumento sa anyo ng patotoo ng Kasulatan at hindi lutasin nang lampas sa Griyego kung ontolohikal na imortal si Melquisedec.
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Ginamit ang “mga taong namamatay” sa halip na mas teknikal na “mga mortal,” at pinanatili ang maikli at malinaw na paghahambing na “dito … doon.”
