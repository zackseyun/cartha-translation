  terminology: Ang “pari,” “kautusan,” “utos,” “laman,” at “kapangyarihan” ay angkop sa marangal at makabagong rehistrong pang-Kasulatan. Ang “nauukol sa laman” ay pinananatili upang huwag ipahiwatig na ang σαρκίνης ay moral na “makasalanan.”
