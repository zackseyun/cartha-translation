  text: ὃς οὐ κατὰ νόμον ἐντολῆς ⸀σαρκίνης γέγονεν ἀλλὰ κατὰ δύναμιν ζωῆς ἀκαταλύτου,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/016.yaml
  text: who has become such not according to a law of a fleshly commandment[a], but according to the power of an indestructible life[c][b],
translation:
  language: tl
  text: Siya ay naging pari, hindi ayon sa isang kautusang nakabatay sa utos na nauukol sa laman[a][c], kundi ayon sa kapangyarihan ng buhay na hindi mawawasak[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pisikal na utos” o “utos na nauukol sa katawan.”
    reason: lexical_alternative
  - marker: b
    text: Ayon sa tradisyonal na salin, “buhay na walang katapusan.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “ayon sa isang kautusan ng utos na nauukol sa laman.”
    reason: previous_rendering
lexical_decisions:
- source_word: ὃς
  choice: Siya
  rationale: Tumutukoy ito sa taong binabanggit sa naunang talata. Sa Filipino, mas natural ang “Siya” kaysa sa pagsisimula sa “na,” habang nananatiling malinaw ang ugnayan sa konteksto.
- source_word: κατὰ νόμον
  choice: ayon sa isang kautusan
  rationale: Ang κατά na may accusative ay nagpapahayag ng pamantayan o batayan. Ginamit ang “isang” dahil walang article ang νόμον at hindi tahasang tinutukoy rito ang Kautusan ni Moises bilang pangalang pantangi.
- source_word: ἐντολῆς σαρκίνης
  choice: may utos na nauukol sa laman
  rationale: Pinananatili ng “utos” ang tiyak na diwa ng ἐντολή, at ng “nauukol sa laman” ang larawan ng σαρκίνη nang hindi ito ginagawang “makasalanan.” Ang “may” ay natural na paraan sa Filipino upang ipakita ang malapit ngunit hindi ganap na tiyak na ugnayan ng νόμον at ἐντολῆς.
- source_word: γέγονεν
  choice: ay naging pari
  rationale: Ang perfect tense ay nagpapahiwatig ng kalagayang bunga ng naganap na pagkatalaga. Ang “pari” ay ang ipinahihiwatig na panaguri mula sa konteksto at kailangan para maging malinaw at natural ang pangungusap sa Filipino.
- source_word: ἀλλὰ κατὰ δύναμιν
  choice: kundi ayon sa kapangyarihan
  rationale: Pinananatili nito ang tuwirang pagsalungat at pagkakapantay ng dalawang pariralang may κατά.
- source_word: ζωῆς ἀκαταλύτου
  choice: ng buhay na hindi mawawasak
  rationale: Ang ἀκατάλυτος ay tumutukoy sa hindi malulusaw, mawawasak, o mapapawi. Mas malawak ito kaysa sa “walang katapusan,” na nakatuon lamang sa tagal.
theological_decisions:
- issue: Kahulugan ng σαρκίνης sa paghahambing sa ἀκαταλύτου
  choice: “nauukol sa laman,” na tumutukoy sa pisikal o makataong batayan nang hindi ipinapalagay na makasalanan ito
  alternative: “pisikal” o “nauukol sa katawan”
  rationale: Ang konteksto ay naghahambing ng panlabas at mortal na batayan ng pagkapari sa kapangyarihan ng buhay na hindi mawawasak. Ang saling “makasalanan” ay magdaragdag ng moral na kahulugang wala sa salita rito.
- issue: Kahulugan ng ἀκαταλύτου
  choice: “hindi mawawasak”
  alternative: “walang katapusan”
  rationale: Pinananatili nito kapuwa ang diwa ng hindi mapapawi at ng patuloy na buhay, nang hindi nililimitahan ang salita sa haba ng panahon lamang.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Iniwasan ang “makalaman,” na maaaring awtomatikong ipakahulugang makasalanan, at ginamit ang “nauukol sa laman” upang mapanatili ang larawan at tensiyong nasa Griyego. Ipinaliwanag ang ipinahihiwatig na “pari” para sa likas na daloy sa Filipino.
