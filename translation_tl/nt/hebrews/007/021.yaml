revisions:
- from: 'Ngunit ang isang ito ay naging pari na may kasamang panunumpa sa pamamagitan ng nagsabi sa kanya: “Nanumpa[a] ang Panginoon at hindi niya babaguhin ang kanyang pasya: ‘Ikaw ay pari magpakailanman.’”'
  to: 'Ngunit ang isang ito ay naging pari sa pamamagitan ng isang panunumpa, sa pamamagitan ng isa na nagsabi sa kanya: “Nanumpa[a] ang Panginoon at hindi niya babaguhin ang kanyang pasya: ‘Ikaw ay pari magpakailanman.’”'
  rationale: Pinalitan ang di-likas na "sa pamamagitan ng nagsabi sa kanya" ng "sa pamamagitan ng isa na nagsabi sa kanya." Pinananatili nito ang instrumental/ahenteng gamit ng διά, ang pagtukoy sa nagsasalita nang hindi siya tahasang pinapangalanan sa parirala, at ang estruktura ng Griyegong teksto. Walang binagong kahulugan sa sipi o sa talababa.
