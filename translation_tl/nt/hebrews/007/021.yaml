base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/021.yaml
  text: but this one became a priest with an oath through the one who said to him[a], “The Lord has sworn and will not change his mind, ‘You are a priest forever.’”
translation:
  language: tl
  text: 'Ngunit ang isang ito ay naging pari sa pamamagitan ng isang panunumpa, sa pamamagitan ng isa na nagsabi sa kanya: “Nanumpa[a] ang Panginoon at hindi niya babaguhin ang kanyang pasya: ‘Ikaw ay pari magpakailanman.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Sumumpa na ang Panginoon.” Ang Greek aorist na Ὤμοσεν ay maaaring ipahayag bilang payak na nagdaang kilos (“nanumpa”) o sa paraang nagdiriin sa nananatiling bisa nito (“sumumpa na”).
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Ngunit ang isang ito
  rationale: Pinananatili nito ang tahasang paghahambing sa mga paring binanggit sa naunang talata, pati ang bahagyang eliptikong anyo ng Griyego.
- source_word: μετὰ ὁρκωμοσίας
  choice: na may kasamang panunumpa
  rationale: Ipinakikita nitong ang pagkahirang sa kanya bilang pari ay sinamahan at pinagtibay ng panunumpa, bilang kaibahan sa talata 20.
- source_word: διὰ τοῦ λέγοντος πρὸς αὐτόν
  choice: sa pamamagitan ng nagsabi sa kanya
  rationale: Pinananatili ang diwa ng ahensiya sa διά na may genitive at hindi tahasang pinapangalanan ang nagsasalita kung hindi siya pinangalanan sa mismong parirala.
- source_word: Ὤμοσεν κύριος
  choice: Nanumpa ang Panginoon
  rationale: Ang payak na nagdaang anyong “nanumpa” ay tuwirang tumutugma sa Greek aorist; ang bisa ng panunumpa ay malinaw pa rin sa konteksto.
- source_word: κύριος
  choice: Panginoon
  rationale: Ito ang likas at karaniwang salin ng κύριος sa modernong Filipino, habang iginagalang ang anyo ng tekstong Griyego.
- source_word: οὐ μεταμεληθήσεται
  choice: hindi niya babaguhin ang kanyang pasya
  rationale: Tumutukoy ito sa hindi pagbawi o pagbabago ng ipinahayag na layunin, hindi sa moral na pagsisisi.
- source_word: Σὺ ἱερεὺς
  choice: Ikaw ay pari
  rationale: Likas na idinaragdag sa Filipino ang copulang “ay” na ipinahihiwatig sa Griyego.
- source_word: εἰς τὸν αἰῶνα
  choice: magpakailanman
  rationale: Natural nitong ipinahahayag ang walang-hanggang tagal na tinutukoy ng idyomang Griyego.
theological_decisions:
- issue: Ang panunumpa at permanenteng pagkapari sa sipi mula sa Awit 110:4
  choice: Inilalarawan ang pagkapari bilang pinagtibay ng panunumpa ng Panginoon at nananatili magpakailanman.
  alternative: Maaaring isalin ang Ὤμοσεν sa paraang higit na nagdiriin sa patuloy na bisa nito, gaya ng “Sumumpa na ang Panginoon.”
  rationale: 'Pinananatili ng salin ang argumento ng Hebreo: taliwas sa mga naunang pari, ang pagkaparing ito ay itinatag sa pamamagitan ng panunumpa ng Diyos at hindi lilipas, nang hindi nagdaragdag ng doktrinang wala sa teksto.'
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang paghahambing at bahagyang elipsis ng Griyego, habang ginawang malinaw ang pangungusap sa natural na balarila ng Tagalog.
