  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Τοιοῦτος γὰρ ἡμῖν ⸀καὶ ἔπρεπεν ἀρχιερεύς, ὅσιος, ἄκακος, ἀμίαντος, κεχωρισμένος ἀπὸ τῶν ἁμαρτωλῶν, καὶ ὑψηλότερος τῶν οὐρανῶν γενόμενος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/026.yaml
  text: 'For such a high priest was indeed fitting for us: holy[a], innocent, undefiled, separated from sinners[b], and having become higher than the heavens.'
translation:
  language: tl
  text: Sapagkat ganitong punong pari nga ang nararapat para sa atin—banal, walang kasamaan, walang dungis, nakahiwalay sa mga makasalanan[a], at naging higit na mataas kaysa sa mga langit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ibinukod sa mga makasalanan.” Binibigyang-diin ng parirala ang kanyang kadalisayang moral at mataas na kalagayan bilang punong pari.
    reason: lexical_alternative
  - marker: b
    text: O “itinaas sa ibabaw ng mga langit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοιοῦτος
  choice: ganitong
  rationale: Tumutukoy pabalik sa uri ng punong pari na inilarawan sa naunang talakayan at likas itong pakinggan sa makabagong Tagalog.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na kaugnayan ng talata sa naunang argumento.
- source_word: ἡμῖν
  choice: para sa atin
  rationale: Kasama ng ἔπρεπεν, ipinahahayag nito ang pagiging angkop ng punong pari para sa mga mananampalataya.
- source_word: καὶ ἔπρεπεν
  choice: nga ang nararapat
  rationale: Ipinahahayag ng “nararapat” ang pagiging angkop, at ipinakikita ng “nga” ang nagbibigay-diin na gamit ng καί sa konteksto.
- source_word: ἀρχιερεύς
  choice: punong pari
  rationale: Karaniwan at tumpak na katawagan sa Tagalog para sa mataas na katungkulang makasaserdote sa Hebreo.
- source_word: ὅσιος
  choice: banal
  rationale: Malinaw na naghahayag ng kabanalan at kadalisayang moral na inilalarawan sa punong pari.
- source_word: ἄκακος
  choice: walang kasamaan
  rationale: Inilalarawan ang kawalan ng masamang kalooban o kasalanan nang mas tuwiran kaysa sa “inosente,” na maaari ring tumukoy lamang sa kawalan ng pananagutang legal.
- source_word: ἀμίαντος
  choice: walang dungis
  rationale: Pinananatili ang larawan ng kadalisayan, kasama ang posibleng kaugnayang ritwal o makasaserdote.
- source_word: κεχωρισμένος ἀπὸ τῶν ἁμαρτωλῶν
  choice: nakahiwalay sa mga makasalanan
  rationale: Tuwirang ipinahahayag ang kalagayang bunga ng pagkakahiwalay nang hindi tahasang nagtatakda kung sino ang gumawa nito.
- source_word: ὑψηλότερος τῶν οὐρανῶν
  choice: higit na mataas kaysa sa mga langit
  rationale: Pinananatili ang tahasang paghahambing ng Griyego at ang pangmaramihang “mga langit.”
- source_word: γενόμενος
  choice: naging
  rationale: Ipinahahayag ang pagpasok sa isang kalagayan at ang resultang kataasan nang hindi tahasang nagdaragdag ng gumaganap na hindi binanggit sa anyong Griyego.
theological_decisions:
- issue: Ang kaugnayan ni Jesus sa mga makasalanan sa pariralang “nakahiwalay sa mga makasalanan”
  choice: Pinanatili ang tuwirang pananalita habang ipinaliliwanag sa talababa na binibigyang-diin nito ang kadalisayang moral at mataas na kalagayan niya bilang punong pari.
  alternative: Unawain ito bilang ganap na pisikal o panlipunang paglayo sa mga makasalanan, o bilang paghihiwalay lamang pagkatapos ng pag-akyat.
  rationale: Ang magkakasunod na paglalarawan ay nakatuon sa kadalisayan at pagiging karapat-dapat niya bilang punong pari. Hindi dapat ipakahulugan ng salin na hindi siya nakisalamuha sa mga makasalanan noong ministeryo niya sa lupa.
- issue: Ang puwersa ng γενόμενος kasama ng “higit na mataas kaysa sa mga langit”
  choice: Isinalin bilang “naging higit na mataas kaysa sa mga langit,” na nagpapanatili sa historikal at resultang diwa ng pagkataas.
  alternative: “Nasa higit na mataas kaysa sa mga langit” bilang paglalarawan lamang ng isang palagiang kalagayan, o “itinaas sa ibabaw ng mga langit” na tahasang pasibo.
  rationale: Tinutukoy ng participle ang pagpasok sa mataas na kalagayan sa kasaysayan ng pagliligtas. Hindi nito ipinahihiwatig ang pagbabago sa likas na pagka-Diyos ni Cristo, kundi ang kanyang itinaas na kalagayan bilang punong pari.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang karaniwang terminong biblikal na “punong pari” at “mga langit,” habang iniwasan ang labis na teknikal o makalumang pananalita. Inilagay ang mga pananda ng talababa sa mismong mga pariralang tinutukoy ng mga ito.
