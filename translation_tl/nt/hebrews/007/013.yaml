- from: Sapagkat ang tinutukoy ng mga bagay na ito ay kabilang sa ibang lipi[a], at mula sa liping iyon ay wala ni isang naglingkod sa altar.[b]
  to: Sapagkat ang taong tinutukoy sa mga pahayag na ito ay kabilang sa ibang lipi[a], at mula sa liping iyon ay wala ni isa ang naglingkod sa altar.[b]
  rationale: Inayos ang pangunahing pangungusap upang malinaw na ang mga pahayag ang sinasabi tungkol sa taong tinutukoy, hindi upang magdagdag ng paliwanag tungkol sa kanyang pagkakakilanlan. Inayos din ang negatibong konstruksyon at ang talababa para sa mas likas at kapaki-pakinabang na Filipino, nang hindi binabago ang kahulugan o ang mga pananda ng talababa.
