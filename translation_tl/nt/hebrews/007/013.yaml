source:
  edition: SBLGNT
  text: ἐφ’ ὃν γὰρ λέγεται ταῦτα φυλῆς ἑτέρας μετέσχηκεν, ἀφ’ ἧς οὐδεὶς προσέσχηκεν τῷ θυσιαστηρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/013.yaml
  text: For the one about whom these things are said belongs to another tribe[b][a], from which no one has served at the altar.
translation:
  language: tl
  text: Sapagkat ang taong tinutukoy sa mga pahayag na ito ay kabilang sa ibang lipi[a], at mula sa liping iyon ay wala ni isa ang naglingkod sa altar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nakibahagi sa ibang lipi” o “nagmula sa ibang lipi.” Ang pandiwang Griyego ay maaaring tumukoy sa pakikibahagi o pagkakaugnay; dito, tumutukoy ito sa pagiging kabilang sa isang lipi.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nagdalo sa altar” o “nag-asikaso sa altar.” Ang pananalita ay tumutukoy sa pagdalo o paglilingkod na may kaugnayan sa altar.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφ’ ὃν
  choice: ang tinutukoy
  rationale: Sa pariralang λέγεται ταῦτα, ang ἐπί na may akusatibo ay tumutukoy sa taong siyang paksa ng mga sinasabi; natural itong ipahayag sa Tagalog bilang “ang tinutukoy.”
- source_word: γὰρ
  choice: Sapagkat
  rationale: Nagbibigay ito ng paliwanag o batayan para sa naunang pahayag at pinananatili ang daloy ng pangangatwiran.
- source_word: λέγεται ταῦτα
  choice: ng mga bagay na ito
  rationale: Kasama ng “ang tinutukoy,” likas na naipahihiwatig ang pasibong diwang “ang tungkol sa kanya ay sinasabi ang mga bagay na ito,” habang pinananatili ang maramihang ταῦτα.
- source_word: φυλῆς ἑτέρας
  choice: sa ibang lipi
  rationale: Sa konteksto, ang φυλή ay isa sa mga lipi ng Israel, at ang ἑτέρας ay nagpapakitang naiiba ito sa liping makasaserdoteng tinatalakay.
- source_word: μετέσχηκεν
  choice: ay kabilang
  rationale: Bagaman literal na maaaring mangahulugang “nakibahagi,” sa konteksto ay tumutukoy ito sa matatag na kaugnayan o pagiging kabilang sa isang lipi. Ang “ay kabilang” ang pinakanatural na Tagalog at naipapakita ang nananatiling bisa ng perpektong aspekto.
- source_word: ἀφ’ ἧς
  choice: mula sa liping iyon
  rationale: Malinaw nitong ibinabalik ang reperensiya sa φυλή at iniiwasan ang alanganing “mula rito” sa Tagalog.
- source_word: οὐδεὶς
  choice: wala ni isang
  rationale: Mariing pinananatili ang ganap na negatibong diwa ng οὐδεὶς.
- source_word: προσέσχηκεν τῷ θυσιαστηρίῳ
  choice: naglingkod sa altar
  rationale: Sa kontekstong pangkulto, ang προσέχω na may datibo ay tumutukoy sa pagdalo o paglilingkod na kaugnay ng altar. Mas malinaw at natural sa karaniwang mambabasa ang “naglingkod sa altar.”
- source_word: θυσιαστηρίῳ
  choice: altar
  rationale: Ito ang karaniwan, malinaw, at kinikilalang salin sa konteksto ng paghahandog.
theological_decisions:
- issue: Ang kaugnayan ni Jesus sa isang liping hindi Levitico sa pangangatwiran tungkol sa pagkasaserdote
  choice: Isinalin bilang “kabilang sa ibang lipi,” nang hindi tahasang dinaragdagan ng ideya ng genealogical na paglusong.
  alternative: “nagmula sa ibang lipi” o “inapo ng ibang lipi”
  rationale: Ang talata ay nakabatay sa pagiging kabilang sa ibang lipi, ngunit hindi tahasang ginagamit ng Griyego rito ang salita para sa paglusong o pagiging inapo. Kaya pinananatili ng salin ang saklaw at tensiyon ng orihinal.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “lipi” at “altar” bilang pamilyar na terminong biblikal. Inilagay ang mga pananda ng talababa kaagad pagkatapos ng mga pariralang nililinaw ng mga ito.
