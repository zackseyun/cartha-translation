base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/006.yaml
  text: But the one who is not traced by genealogy from them has taken a tenth from Abraham and has blessed the one who had the promises[a][b].
translation:
  language: tl
  text: Ngunit ang hindi nagmula sa kanila ayon sa talaangkanan ay tumanggap ng ikapu mula kay Abraham[a] at pinagpala ang may mga pangako.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kumuha ng ikapu mula kay Abraham.” Ang pandiwang Griyego ay maaaring tumukoy sa pagkuha o pagtanggap ng ikasampung bahagi.
    reason: lexical_alternative
  - marker: b
    text: O “ang nagkaroon ng mga pangako.” Pangkasalukuyang participle ang ginamit sa Griyego, ngunit maaari ring gumamit ng pangnagdaang anyo kapag tinutukoy si Abraham sa salaysay.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ μὴ γενεαλογούμενος ἐξ αὐτῶν
  choice: Ngunit ang hindi kabilang sa kanilang talaangkanan
  rationale: Likas sa modernong Filipino ang “hindi kabilang sa kanilang talaangkanan” at pinananatili nito ang diin sa kawalan ng ugnayang genealogical kay Levi, hindi ang haka-haka tungkol sa pinagmulan o kalikasan ni Melquisedec.
- source_word: δεδεκάτωκεν Ἀβραάμ
  choice: ay tumanggap ng ikapu mula kay Abraham
  rationale: Ipinahahayag nang malinaw kung sino ang nagbigay at tumanggap. Ang “ikapu” ang karaniwang salitang Filipino para sa ikasampung bahagi; ang aspektong perpekto ng Griyego ay likas na naihahatid sa salaysay sa pamamagitan ng “tumanggap.”
- source_word: τὸν ἔχοντα τὰς ἐπαγγελίας
  choice: ang may mga pangako
  rationale: Pinananatili ang pangkasalukuyang anyo at ang maramihang “mga pangako” nang hindi dinaragdagan kung paano tinaglay o tinanggap ni Abraham ang mga iyon.
- source_word: εὐλόγηκεν
  choice: pinagpala niya
  rationale: Nililinaw ng panghalip na ang taong hindi kabilang sa talaangkanan—si Melquisedec sa konteksto—ang nagpala kay Abraham, habang nananatiling natural ang pangungusap sa Filipino.
theological_decisions:
- issue: Ang kaugnayan ni Melquisedec sa talaangkanan ng mga Levita
  choice: Ipinahihiwatig na hindi siya kabilang sa kanilang talaangkanan.
  alternative: “Hindi nagmula sa kanila ayon sa talaangkanan” o “hindi nakatala sa kanilang talaangkanan.”
  rationale: Ang argumento ay tungkol sa awtoridad ng pagkasaserdote na hindi nakabatay sa talaangkanan ng mga Levita. Hindi ginagawang pahayag ang parirala tungkol sa ontolohiya ni Melquisedec o sa kawalan niya ng mga ninuno.
- issue: Ang panahunan ng τὸν ἔχοντα τὰς ἐπαγγελίας
  choice: “ang may mga pangako”
  alternative: “ang nagkaroon ng mga pangako” o “ang tumanggap ng mga pangako.”
  rationale: Pinananatili ng salin ang pangkasalukuyang participle at ang bahagyang bukas na diwa ng Griyego, sa halip na gawing tahasang kilos ng pagtanggap.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang pamilyar na “talaangkanan” at “ikapu”; iniwasan ang sobrang teknikal o denominasyonal na pananalita.
