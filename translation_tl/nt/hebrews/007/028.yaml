reference: Hebrews 7:28
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ νόμος γὰρ ἀνθρώπους καθίστησιν ἀρχιερεῖς ἔχοντας ἀσθένειαν, ὁ λόγος δὲ τῆς ὁρκωμοσίας τῆς μετὰ τὸν νόμον υἱόν, εἰς τὸν αἰῶνα τετελειωμένον.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/028.yaml
  text: For the law appoints men as high priests who have weakness[a], but the word of the oath, which came after the law[b], appoints a Son who has been perfected forever.
translation:
  language: tl
  text: Sapagkat ang Kautusan ay humihirang ng mga taong may kahinaan bilang mga punong pari; ngunit ang salita ng panunumpa, na dumating pagkatapos ng Kautusan, ay humihirang ng isang Anak[a] na ginawang ganap magpakailanman.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang Anak.” Sa Griyego, walang pantukoy bago ang “Anak,” na nagbibigay-diin sa kaibahan niya sa “mga tao,” ngunit malinaw pa ring si Jesus ang tinutukoy sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na, “dinala sa kaganapan magpakailanman.” Sa konteksto ng pagkasaserdote, maaari rin itong mangahulugang “itinalaga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: ang Kautusan
  rationale: Tumutukoy ito sa Kautusan ni Moises, lalo na sa mga tuntunin nito tungkol sa pagkasaserdote. Ang malaking titik ay likas na nagpapahiwatig sa tiyak na Kautusang ito.
- source_word: καθίστησιν
  choice: humihirang
  rationale: Ipinapahayag nito ang pormal na pagtatalaga sa tungkulin ng punong pari at natural sa makabagong Tagalog.
- source_word: ἀνθρώπους
  choice: mga tao
  rationale: Pinananatili nito ang tuwirang kaibahan ng mga taong punong pari sa Anak. Bagaman lalaki ang mga makasaysayang humawak ng tungkulin, hindi kailangang dagdagan ang salitang Griyego ng mas tiyak na katawagang pangkasarian.
- source_word: ἀρχιερεῖς
  choice: mga punong pari
  rationale: Ito ang malinaw at karaniwang katawagan sa mga humawak nang sunod-sunod sa tungkulin ng mataas na saserdote.
- source_word: ἔχοντας ἀσθένειαν
  choice: may kahinaan
  rationale: Pinananatili ang pangngalang 'kahinaan,' na maaaring tumukoy sa kahinaan at pagiging marupok ng tao, hindi lamang sa karamdamang pisikal.
- source_word: λόγος
  choice: ang salita
  rationale: Tumutukoy ito sa ipinahayag na salita ng Diyos na naglalaman ng panunumpa at pinananatili ang biblikal na himig.
- source_word: ὁρκωμοσίας
  choice: ng panunumpa
  rationale: Tuwirang inilalarawan nito ang salita bilang pananalitang ipinahayag sa pamamagitan ng sumpa o taimtim na pangako.
- source_word: τῆς μετὰ τὸν νόμον
  choice: na dumating pagkatapos ng Kautusan
  rationale: 'Nililinaw nito ang pagkakasunod sa panahon: ang panunumpang sinipi mula sa Awit 110 ay ipinahayag pagkaraan ng Kautusan.'
- source_word: υἱόν
  choice: isang Anak
  rationale: Walang pantukoy ang υἱόν at mariing inihahambing ang Anak sa 'mga tao.' Ang malaking titik ay nagpapakitang si Jesus ang tinutukoy sa konteksto.
- source_word: εἰς τὸν αἰῶνα
  choice: magpakailanman
  rationale: Ito ang natural na katumbas sa konteksto ng walang-hanggang pagkasaserdote.
- source_word: τετελειωμένον
  choice: na ginawang ganap
  rationale: Pinananatili nito ang balintiyak at ang diwang natapos na kalagayan ng perfect participle, nang hindi nililimitahan ang kahulugan sa pagtatalaga lamang bilang pari.
theological_decisions:
- issue: Ang walang-pantukoy na υἱόν at ang kaibahan nito sa ἀνθρώπους
  choice: isang Anak
  alternative: ang Anak
  rationale: Pinananatili ng 'isang Anak' ang anyo at diin ng Griyego sa kaibahan ng mga taong punong pari at ng Anak, habang malinaw pa rin sa konteksto na si Jesus ang tinutukoy.
- issue: Ang kahulugan ng τετελειωμένον sa teolohiya ng pagkasaserdote sa Hebreo
  choice: ginawang ganap magpakailanman
  alternative: lubos na inihanda o itinalaga magpakailanman
  rationale: Pinananatili nito ang malawak na diwa ng pagiging ganap o pag-abot sa itinakdang kaganapan, kasama ang posibleng kaugnayan sa pagiging ganap na angkop sa gawaing saserdotal, nang hindi tahasang nilulutas ang saklaw ng termino.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “punong pari” sa halip na mas teknikal na “mataas na saserdote,” at pinanatili ang “kahinaan,” “salita,” at “ginawang ganap” upang huwag paliitin ang mahahalagang saklaw ng mga terminong Griyego. Inilagay ang mga panandang [a] at [b] sa mismong mga salitang tinatalakay ng kani-kanilang talababa.
