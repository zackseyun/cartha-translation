  source_fidelity: Tumpak na naipapahayag ng salin ang kaibahan sa pagitan ng mga taong itinatalaga ng Kautusan bilang mga punong pari, na may kahinaan, at ng Anak na itinatalaga ng salitang may panunumpa pagkatapos ng Kautusan. Naipapanatili rin ang anyong balintiyak at resultative ng τετελειωμένον sa “ginawang ganap.”
  naturalness: Malinaw, makabago, at angkop ang rehistro. Ang “humihirang ... bilang mga punong pari” at “na ginawang ganap magpakailanman” ay likas at sapat na malapit sa Griyego.
  terminology: Ang “Kautusan,” “punong pari,” “kahinaan,” at “Anak” ay magkakatugma at angkop sa konteksto ng Hebreo. Ang “salita ng panunumpa” ay katanggap-tanggap bilang tuwirang salin ng λόγος τῆς ὁρκωμοσίας. Kailangang ayusin ang talababa b, dahil ang “lubos” ay nagdaragdag ng diin na wala sa pangunahing salin o kinakailangan sa Griyego, at hindi ito isang malinaw na alternatibong salin.
