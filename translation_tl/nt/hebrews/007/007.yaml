  text: χωρὶς δὲ πάσης ἀντιλογίας τὸ ἔλαττον ὑπὸ τοῦ κρείττονος εὐλογεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/007.yaml
  text: Beyond all dispute[a], the lesser is blessed by the greater.
translation:
  language: tl
  text: 'Walang anumang pagtatalo[a]: ang mas mababa ay pinagpapala ng mas mataas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “walang anumang pagsalungat” o “walang anumang kontradiksyon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς δὲ πάσης ἀντιλογίας
  choice: Hindi mapag-aalinlanganan
  rationale: Likas na idyomang Filipino ito para sa isang pahayag na itinuturing na tiyak at hindi maaaring tutulan. Naipahihiwatig ng ayos ng pangungusap ang banayad na pag-usad na dala ng δέ nang hindi nagdaragdag ng matinding pagsalungat.
- source_word: τὸ ἔλαττον
  choice: ang nakabababa
  rationale: Tumutukoy ito sa taong mas mababa ang katayuan o ranggo, hindi sa pagiging masama o kulang sa moralidad. Ang anyong panlahat ay angkop sa prinsipyong inilalahad.
- source_word: ὑπὸ τοῦ κρείττονος
  choice: ng nakatataas
  rationale: Ang ὑπό na may genitive ay nagpapakita kung sino ang gumagawa sa balintiyak na sugnay. Ipinahahayag ng “nakatataas” ang mas mataas na katayuan nang hindi dinaragdagan ang teksto.
- source_word: εὐλογεῖται
  choice: ay pinagpapala
  rationale: 'Tuwirang pinananatili nito ang kasalukuyang balintiyak: tumatanggap ng pagpapala ang simuno. Ang kahulugan ay angkop sa pagpapala ni Melquisedec kay Abraham sa konteksto.'
theological_decisions:
- issue: Uri ng paghahambing sa “nakabababa” at “nakatataas”
  choice: 'Isang pangkalahatang prinsipyo ng katayuan ang inilalahad: pinagpapala ng nakatataas ang nakabababa.'
  alternative: Isa lamang itong kaugaliang panlipunan na walang teolohikal na bigat.
  rationale: Sa Hebreo 7, sinusuportahan ng pahayag ang argumento tungkol sa pagiging nakahihigit ni Melquisedec kay Abraham. Pinananatili ng salin ang paghahambing ng katayuan nang hindi tahasang idinaragdag ang konklusyong teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang magkatugmang “nakabababa” at “nakatataas” upang madaling maunawaan ang paghahambing ng katayuan at mapanatili ang maigsi at panlahat na anyo ng Griyego.
