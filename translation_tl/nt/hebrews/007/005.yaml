  text: καὶ οἱ μὲν ἐκ τῶν υἱῶν Λευὶ τὴν ἱερατείαν λαμβάνοντες ἐντολὴν ἔχουσιν ἀποδεκατοῦν τὸν λαὸν κατὰ τὸν νόμον, τοῦτ’ ἔστιν τοὺς ἀδελφοὺς αὐτῶν, καίπερ ἐξεληλυθότας ἐκ τῆς ὀσφύος Ἀβραάμ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/005.yaml
  text: And those from the sons of Levi who receive the priesthood have a commandment according to the law to collect a tenth from the people—that is[b][a], from their brothers—though they also have come from Abraham’s loins.
translation:
  language: tl
  text: At ang mga mula sa mga anak ni Levi na tumatanggap ng pagkapari ay may utos, ayon sa Kautusan, na maningil ng ikasampung bahagi mula sa bayan—samakatuwid, mula sa mga kapatid nila[a]—bagaman sila rin ay nagmula sa balakang ni Abraham.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kanilang mga kapwa Israelita.” Ang Griyego ay literal na “kanilang mga kapatid,” isang katawagang pampamilya para sa mga kasapi ng iisang bayan.
    reason: lexical_alternative
  - marker: b
    text: O “sila rin ay mga inapo ni Abraham.” Literal na “sila rin ay lumabas mula sa balakang ni Abraham.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ μὲν ἐκ τῶν υἱῶν Λευὶ
  choice: ang mga mula sa mga anak ni Levi
  rationale: Pinananatili ang partitive na diwa ng ἐκ at ang pananalitang pampamilya ng υἱῶν, habang nililinaw na ang tinutukoy ay yaong mula sa angkan ni Levi na tumatanggap ng pagkapari.
- source_word: τὴν ἱερατείαν λαμβάνοντες
  choice: na tumatanggap ng pagkapari
  rationale: Ipinahihiwatig ng λαμβάνοντες ang pagtanggap ng katungkulan, hindi ang sariling pag-angkin dito; ang “pagkapari” ay natural at marangal na katumbas ng ἱερατεία.
- source_word: ἐντολὴν ἔχουσιν
  choice: ay may utos
  rationale: Pinananatili ang nominal na kayarian ng Griyego at ang legal na bigat ng ἐντολή sa natural na modernong Tagalog.
- source_word: ἀποδεκατοῦν
  choice: na kumuha ng ikasampung bahagi mula sa
  rationale: Ang pandiwa ay tumutukoy sa pagkuha ng ikasampung bahagi mula sa iba, hindi sa pagbibigay nito; iniiwasan ng pariralang ito ang posibleng kalabuan ng “mag-ikapu.”
- source_word: τὸν λαὸν
  choice: sa bayan
  rationale: Tuwirang salin ng λαός; ipinapaliwanag agad ng kasunod na parirala na ang bayan ay ang kapwa nila mga Israelita.
- source_word: κατὰ τὸν νόμον
  choice: ayon sa Kautusan
  rationale: Ipinapakita ang pamantayang legal na diwa ng κατά at tinutukoy ang Kautusang Mosaiko sa konteksto.
- source_word: τοῦτ’ ἔστιν
  choice: samakatuwid
  rationale: Natural na panandang nagpapakilala sa paliwanag o paglilinaw ng naunang “bayan.”
- source_word: τοὺς ἀδελφοὺς αὐτῶν
  choice: sarili nilang mga kapatid
  rationale: Pinananatili ang pananalitang pampamilya ng ἀδελφούς; nililinaw sa talababa na saklaw nito ang kanilang mga kapwa Israelita.
- source_word: καίπερ
  choice: kahit
  rationale: Malinaw at natural na ipinapahayag ang concessive na puwersa ng καίπερ.
- source_word: ἐξεληλυθότας ἐκ τῆς ὀσφύος Ἀβραάμ
  choice: sila man ay nagmula sa balakang ni Abraham
  rationale: Pinananatili ang kongkretong idyoma ng pisikal na angkan sa ὀσφύος at ang retorikal na diin sa iisang pinagmulan kay Abraham.
theological_decisions:
- issue: Pananalitang pampamilya sa konteksto ng sambayanang Israel
  choice: sarili nilang mga kapatid
  alternative: kanilang mga kapwa Israelita
  rationale: Masusing pinananatili ng pangunahing teksto ang ἀδελφούς bilang katawagang pampamilya, samantalang nililinaw sa talababa ang mas malawak na kolektibong tinutukoy.
- issue: Pagpapanatili sa katawang idyoma ng pagkamula sa isang ninuno
  choice: nagmula sa balakang ni Abraham
  alternative: nagmula rin kay Abraham / mga inapo rin ni Abraham
  rationale: Mahalaga sa pangangatwiran ng Hebreo 7 ang magkatulad na pisikal na pinagmulan; pinananatili ng “balakang” ang larawan ng ὀσφύος nang hindi nilulutas o pinapaliit ang retorikal na diwa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Kautusan” bilang tiyak na katawagan sa Kautusang Mosaiko. Pinanatili ang “mga kapatid” at “balakang ni Abraham” upang huwag patagin ang pampamilya at pisikal na larawan ng orihinal; ipinaliwanag ang mas idiomatikong mga alternatibo sa mga talababa.
