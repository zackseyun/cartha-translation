revisions:
- from: At ang mga mula sa mga anak ni Levi na tumatanggap ng pagkapari ay may utos, ayon sa Kautusan, na kumuha ng ikasampung bahagi mula sa bayan—samakatuwid, mula sa sarili nilang mga kapatid[a]—kahit sila man ay nagmula sa balakang ni Abraham.[b]
  to: At ang mga mula sa mga anak ni Levi na tumatanggap ng pagkapari ay may utos, ayon sa Kautusan, na maningil ng ikasampung bahagi mula sa bayan—samakatuwid, mula sa mga kapatid nila[a]—bagaman sila rin ay nagmula sa balakang ni Abraham.[b]
  rationale: Pinanatili ng rebisyon ang partitive na “mga mula sa mga anak ni Levi,” ang pagtanggap ng pagkapari, ang legal na bigat ng utos ayon sa Kautusan, at ang literal na larawan ng pagkamula sa balakang ni Abraham. Pinalitan lamang ang pandiwang “kumuha” ng “maningil” upang wastong maipahayag ang pangongolekta ng ikapu, at pinakinis ang dalawang parirala para sa natural na modernong Tagalog.
