  naturalness: Ang ‘walang pasimula ng mga araw ni wakas ng buhay’ ay hindi likas na pagkakabuo sa modernong Tagalog, sapagkat ang unang ‘walang’ ay hindi natural na saklaw ng ‘wakas.’ Ang ‘na walang pasimula ng mga araw ni wakas ng buhay’ ay maikli, matatas, at pinananatili ang mataas na rehistro.
  terminology: Ang ‘Anak ng Diyos,’ ‘pari,’ at ‘magpakailanman’ ay angkop. Pinanatili ang ‘Melquisedec,’ isang kinikilalang anyo sa Tagalog. Inayos ang talababa upang tukuyin ang aklat bilang ‘Mga Hebreo’ at upang mas eksaktong sabihing walang nakatalang talaangkanan sa Genesis.
