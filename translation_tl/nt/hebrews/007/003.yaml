base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/003.yaml
  text: without father[a], without mother, without genealogy, having neither beginning of days nor end of life, but being made like the Son of God[b], he remains a priest perpetually.
translation:
  language: tl
  text: Walang ama, walang ina, walang talaangkanan[a], na walang pasimula ng mga araw ni wakas ng buhay; at itinulad sa Anak ng Diyos, nananatili siyang pari magpakailanman.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “walang nakatalang talaangkanan.” Hindi nagtatala ang Genesis ng talaangkanan ni Melquisedec, at ginagamit ito ng may-akda ng Mga Hebreo sa isang tipolohikal na paghahambing.
    reason: lexical_alternative
  - marker: b
    text: O “sa lahat ng panahon” o “patuloy.” Binibigyang-diin ng parirala ang namamalaging katangian ng kanyang pagkapari ayon sa pagkakalahad sa Kasulatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπάτωρ, ἀμήτωρ, ἀγενεαλόγητος
  choice: walang ama, walang ina, walang talaangkanan
  rationale: Pinananatili ang maikli at magkakatulad na anyo ng tatlong panuring sa Griyego. Ang talababa ay naglilinaw na maaaring tumukoy ang huli sa kawalan ng nakatalang talaangkanan, nang hindi ipinapasok ang paglilinaw sa mismong talata.
- source_word: μήτε ἀρχὴν ἡμερῶν μήτε ζωῆς τέλος ἔχων
  choice: walang pasimula ng mga araw ni wakas ng buhay
  rationale: Malapit sa pormal at magkatambal na pagkakabuo ng Griyego, habang pinananatili ang maringal at sadyang matinding paglalarawan.
- source_word: ἀφωμοιωμένος
  choice: ginawang tulad
  rationale: Ipinakikita ang balintiyak na diwa ng perpektong pandiwari at ang patuloy na bisa ng paghahambing. Hindi nito ipinapahiwatig na si Melquisedec at ang Anak ay iisa.
- source_word: τῷ υἱῷ τοῦ θεοῦ
  choice: ang Anak ng Diyos
  rationale: Likas at kinikilalang salin ng titulong kristolohikal, na pinananatili ang tiyak na pantukoy.
- source_word: μένει ἱερεὺς
  choice: nananatili siyang pari
  rationale: Ipinahahayag ng pangkasalukuyang μένει ang nagpapatuloy na kalagayan; natural itong mababasa sa modernong Tagalog.
- source_word: εἰς τὸ διηνεκές
  choice: magpakailanman
  rationale: Natural at marangal na salin ng pariralang nagsasaad ng walang patid o namamalaging katangian. Nililinaw ng talababa ang posibleng diwang 'sa lahat ng panahon' o 'patuloy.'
theological_decisions:
- issue: Kung inilalarawan ba si Melquisedec bilang literal na walang mga magulang at walang kamatayan, o ayon sa pagkakalahad sa Kasulatan para sa tipolohikal na paghahambing
  choice: Pinananatili sa pangunahing teksto ang tuwirang mga paglalarawan, samantalang ipinakikita ng “ginawang tulad ng Anak ng Diyos” na paghahambing, hindi pagkakakilanlan, ang sinasabi ng talata.
  alternative: Maaaring unawain si Melquisedec bilang pagpapakita ng Anak bago ang pagkakatawang-tao, o bilang isang nilalang na literal na walang mga magulang at walang katapusan ang buhay.
  rationale: Ang ἀφωμοιωμένος ay nagsasaad na siya ay ginawang tulad ng Anak, hindi na siya mismo ang Anak. Gayunman, hindi nilulutas nang tahasan ng salin ang lahat ng tensiyon sa matitinding pananalita ng talata; ang talababa lamang ang nagbibigay ng konteksto mula sa kawalan ng tala sa Genesis.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang maikli at ritmikong hanay ng mga paglalarawan at ang teolohikal na tensiyon ng orihinal, nang hindi nagdaragdag ng paliwanag na denominasyonal.
