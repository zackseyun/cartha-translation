  text: And inasmuch as this was not without an oath (for they indeed have become priests without an oath,[a]
translation:
  language: tl
  text: At yamang hindi ito naganap nang walang panunumpa (sapagkat sila nga ay naging mga pari nang walang panunumpa,[a]
  philosophy: optimal-equivalence
