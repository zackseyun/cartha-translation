lexical_decisions:
- source_word: Καὶ
  choice: At
  rationale: Pinananatili ang pang-ugnay sa naunang argumento.
- source_word: καθ’ ὅσον
  choice: yamang
  rationale: Likas na panandang nagbibigay-batayan sa Filipino at akma sa daloy ng pangangatwiran; hindi nito pinabibigat ang pangungusap gaya ng mas literal na 'sa sukat na.'
- source_word: οὐ χωρὶς ὁρκωμοσίας
  choice: hindi ito ginawa nang walang panunumpa
  rationale: Pinananatili ang mariing pagtanggi at ipinahihiwatig ng 'ito' ang pagkahirang bilang pari mula sa konteksto, nang hindi inuuna ang tahasang pagbanggit kay Jesus na nasa kasunod na talata.
- source_word: ὁρκωμοσίας
  choice: panunumpa
  rationale: Tumutukoy sa pagkilos o realidad ng pagpapatibay sa pamamagitan ng sumpa; malinaw at dignified sa modernong Filipino.
- source_word: οἱ μὲν γὰρ
  choice: sapagkat sila nga
  rationale: Ang 'sapagkat' ay nagpapakita ng paliwanag, samantalang ang 'nga' ay nagpapanatili sa diin at naghahanda sa paghahambing na magpapatuloy sa susunod na talata.
- source_word: χωρὶς ὁρκωμοσίας
  choice: nang walang panunumpa
  rationale: Pare-pareho ang salin ng inuulit na parirala sa loob ng talata.
- source_word: εἰσὶν ἱερεῖς γεγονότες
  choice: ay naging mga pari
  rationale: Ipinapahayag ang pagpasok nila sa katungkulang pari at ang resultang kalagayan ng periphrastic perfect construction.
theological_decisions:
- issue: Tinutukoy ng paghahambing sa mga naunang pari at sa paring itinatag sa pamamagitan ng panunumpa
  choice: Inilalahad ang mga naunang pari bilang naging pari nang walang panunumpa, habang inihahanda ang paghahambing sa pagkasaserdote ni Jesus na pinagtibay ng panunumpa sa kasunod na talata.
  alternative: Tahasan nang tukuyin sa talatang ito ang buong kaibahan ng Levitikong pagkasaserdote at ng walang-hanggang pagkasaserdote ng Mesiyas.
  rationale: Ang agarang konteksto ng Hebreo 7 at Awit 110:4 ang nagtatakda ng paghahambing, ngunit putol ang sintaks ng talatang ito at nagpapatuloy sa talata 21; kaya hindi dapat idagdag rito ang mga konklusyong hindi pa tahasang sinasabi.
translation_notes:
  register: Modernong Filipino Tagalog na pormal ngunit madaling maunawaan. Pinanatili ang bukas na panaklong at di-kumpletong sintaks dahil nagpapatuloy ang pangungusap sa Hebreo 7:21.
