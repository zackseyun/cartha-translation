lexical_decisions:
- source_word: ὡς ἔπος εἰπεῖν
  choice: wika nga
  rationale: Likas na idyomang Filipino ito na nagpapahiwatig na ang susunod na pahayag ay isang kwalipikado o matalinghagang paraan ng pagsasalita.
- source_word: δι’ Ἀβραὰμ
  choice: sa pamamagitan ni Abraham
  rationale: 'Pinananatili nito ang diwa ng διά na may genitive: ang sinasabi tungkol kay Levi ay naganap sa pamamagitan ng ginawa ng ninuno niyang si Abraham.'
- source_word: καὶ Λευὶ
  choice: maging si Levi
  rationale: Ipinahahayag ng “maging” ang mariing at bahagyang nakakagulat na paglalapat ng argumento kay Levi.
- source_word: ὁ δεκάτας λαμβάνων
  choice: na tumatanggap ng mga ikapu
  rationale: Inilalarawan ng kasalukuyang participle si Levi ayon sa patuloy na tungkuling Levitico na tumanggap ng mga ikapu.
- source_word: δεκάτας
  choice: mga ikapu
  rationale: Karaniwan at tiyak na katawagang Filipino ito para sa mga ikasampung bahaging ibinibigay sa kontekstong panrelihiyon.
- source_word: δεδεκάτωται
  choice: ay kinuhanan din ng ikapu
  rationale: Pinananatili ng pariralang ito ang perpektong balintiyak ng Griyego at malinaw na ipinahihiwatig na si Levi ang itinuring na pinagmulan ng ikapu, bagaman sa pamamagitan ni Abraham.
theological_decisions:
- issue: Ang pakikibahagi ni Levi sa ginawa ni Abraham bilang kaniyang ninuno
  choice: Pinanatili ang pahayag na si Levi ay kinuhanan ng ikapu sa pamamagitan ni Abraham, kalakip ang panandang “wika nga.”
  alternative: Sabihing tuwirang nagbayad si Levi ng ikapu o ipaliwanag na isa lamang itong matalinghagang pahayag.
  rationale: Ipinakikita ng talata ang kinatawang ugnayan ni Levi kay Abraham ngunit hindi nito ipinaliliwanag ang eksaktong mekanismo. Ang salin ay hindi nagpapasya kung ito ay mahigpit na korporatibong pakikibahagi o retorikal lamang.
translation_notes:
  register: Makabago at dignified na Filipino ang ginamit. Ang “wika nga” ay natural na panandang retorikal, at ang “kinuhanan ng ikapu” ay malinaw na balintiyak nang hindi gumagamit ng di-likas na anyong “naikapuhan.”
