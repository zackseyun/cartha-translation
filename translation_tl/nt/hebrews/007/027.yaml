  naturalness: Marangal at malinaw ang karamihan ng salin. Mas likas ang “minsanan niya itong ginawa” kaysa “ginawa niya ito nang minsanan at para sa lahat.”
  terminology: Ang “mga punong pari,” “maghandog ng mga hain,” at “inihandog niya ang kanyang sarili” ay angkop na modernong Tagalog na may panrelihiyon at pansakripisyong rehistro. Inayos ang talababa d, dahil ang dating “pagkaihandog niya sa kanyang sarili” ay maling nagpapahiwatig na sa kanyang sarili niya inihandog ang sarili niya.
