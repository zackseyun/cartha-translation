  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὃς οὐκ ἔχει καθ’ ἡμέραν ἀνάγκην, ὥσπερ οἱ ἀρχιερεῖς, πρότερον ὑπὲρ τῶν ἰδίων ἁμαρτιῶν θυσίας ἀναφέρειν, ἔπειτα τῶν τοῦ λαοῦ (τοῦτο γὰρ ἐποίησεν ἐφάπαξ ἑαυτὸν ἀνενέγκας)·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/027.yaml
  text: who has no need[a], day after day, like the high priests, to offer up sacrifices first for his own sins and then for those of the people[d][c][b], for this he did once for all when he offered up himself.
translation:
  language: tl
  text: Hindi niya kailangang maghandog ng mga hain araw-araw[a], gaya ng mga punong pari—una para sa sarili nilang mga kasalanan, at pagkatapos ay para sa mga kasalanan ng bayan[b]. Sapagkat minsanan niya itong ginawa nang ihandog niya ang kanyang sarili[d].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa bawat araw.” Ang idyomang Griyego ay nagpapahiwatig ng paulit-ulit na pagkilos araw-araw.
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, literal na “pagkatapos ay yaong sa bayan”; ipinagpapalagay ang “mga kasalanan” mula sa naunang parirala.
    reason: lexical_alternative
  - marker: c
    text: O “minsan at magpakailanman.”
    reason: lexical_alternative
  - marker: d
    text: O “sa pamamagitan ng paghahandog ng kanyang sarili” o “pagkaihandog niya ng kanyang sarili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: araw-araw
  rationale: Likas at malinaw na ipinapahayag sa modernong Tagalog ang paulit-ulit na pang-araw-araw na pangangailangan.
- source_word: ἀνάγκην
  choice: kailangang
  rationale: Ang pariralang οὐκ ἔχει ... ἀνάγκην ay natural na naipapahayag bilang “hindi ... kailangang,” sa halip na mas pormal na “walang pangangailangan.”
- source_word: ὥσπερ οἱ ἀρχιερεῖς
  choice: gaya ng mga punong pari
  rationale: Pinananatili ang paghahambing at ang maramihang bilang ng οἱ ἀρχιερεῖς.
- source_word: πρότερον ... ἔπειτα
  choice: una ... at pagkatapos
  rationale: Malinaw na ipinapakita ang pagkakasunod-sunod ng mga paghahandog.
- source_word: ὑπὲρ τῶν ἰδίων ἁμαρτιῶν
  choice: para sa sarili nilang mga kasalanan
  rationale: Ang “para sa” ay natural sa konteksto ng hain; ginamit ang maramihang “kanilang” dahil ang tinutukoy ay ang mga punong pari.
- source_word: θυσίας ἀναφέρειν
  choice: maghandog ng mga hain
  rationale: Tumpak na pinananatili ang panrelihiyon at pansakripisyong kahulugan ng ἀναφέρω kasama ng θυσίας.
- source_word: τῶν τοῦ λαοῦ
  choice: para sa mga kasalanan ng bayan
  rationale: Inilantad ang ipinagpapalagay na “mga kasalanan” upang maging malinaw at natural sa Tagalog, habang itinatala sa talababa ang ellipsis ng Griyego.
- source_word: τοῦτο γὰρ ἐποίησεν
  choice: Sapagkat ginawa niya ito
  rationale: Pinananatili ang anaporikong “ito” nang hindi tahasang nililimitahan ang saklaw nito.
- source_word: ἐφάπαξ
  choice: nang minsanan at para sa lahat
  rationale: Ipinahahayag ang nag-iisa at ganap na bisa ng kilos; ang “nang minsanan” lamang ay mas literal na alternatibo.
- source_word: ἑαυτὸν ἀνενέγκας
  choice: nang ihandog niya ang kanyang sarili
  rationale: Ang “nang” ay likas na temporal na pagbasa ng aorist participle, at ang “inihandog ... ang kanyang sarili” ay nagpapanatili sa pansakripisyong diwa.
theological_decisions:
- issue: Saklaw ng “ito” sa τοῦτο γὰρ ἐποίησεν
  choice: Pinanatili ang malawak at hindi ganap na tinutukoy na “ginawa niya ito,” na tumutukoy sa mapagpasyang paghahandog na kaugnay ng mga kasalanan, nang hindi ipinahihiwatig na naghandog si Jesus para sa sarili niyang mga kasalanan.
  alternative: Tahasang tukuyin na para lamang sa mga kasalanan ng bayan ang “ito.”
  rationale: Ang agarang paghahambing ay sa mga punong paring kailangang maghandog para sa sarili at sa bayan, samantalang ang konteksto ng Hebreo ay naglalarawan kay Jesus bilang banal at walang kasalanan. Pinananatili ng salin ang anaporikong puwersa at tensiyon ng pangungusap nang hindi nagdaragdag ng kasalanan kay Cristo.
- issue: Paglalarawan sa sariling paghahandog ni Cristo
  choice: inihandog niya ang kanyang sarili
  alternative: ibinigay niya ang kanyang sarili
  rationale: Pinananatili ng “inihandog” ang wikang pansakripisyo at pampagkapari na mahalaga sa argumento ng Hebreo; hindi ito pinapaliit tungo sa pangkalahatang pagbibigay ng sarili.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “punong pari,” “maghandog,” at “mga hain” upang mapanatili ang kontekstong pampagkapari at pansakripisyo. Ang gitling na mahaba ay tumutulong linawin ang paghahambing nang hindi binabago ang sintaktikong ugnayan.
