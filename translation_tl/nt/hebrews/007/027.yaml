  to: Hindi niya kailangang maghandog ng mga hain araw-araw[a], gaya ng mga punong pari—una para sa sarili nilang mga kasalanan, at pagkatapos ay para sa mga kasalanan ng bayan[b]. Sapagkat minsanan niya itong ginawa nang ihandog niya ang kanyang sarili[d].[c]
