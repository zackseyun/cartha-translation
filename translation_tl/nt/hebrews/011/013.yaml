  - severity: low
    issue: Walang tahasang layon ang «binati.»
    rationale: Bagaman maaaring ipahiwatig ang layon mula sa naunang sugnay, ang «binati ang mga ito» ay mas malinaw na nagpapanatili sa «mga pangako» bilang layon ng ἀσπασάμενοι at sa sadyang tayutay ng Griyego.
