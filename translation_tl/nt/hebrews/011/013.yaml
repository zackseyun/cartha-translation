  terminology: Ang «pananampalataya,» «mga pangako,» «mga dayuhan,» at «pansamantalang naninirahan» ay angkop. Ang «ipinahayag» ay isang ligtas at natural na salin ng ὁμολογήσαντες. Pinananatili ng talababa ang makatuwirang mga alternatibo para sa ἀσπασάμενοι at παρεπίδημοι.
