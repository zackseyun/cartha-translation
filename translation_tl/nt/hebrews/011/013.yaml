id: HEB.11.13
reference: Hebrews 11:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Κατὰ πίστιν ἀπέθανον οὗτοι πάντες, μὴ ⸀λαβόντες τὰς ἐπαγγελίας, ἀλλὰ πόρρωθεν αὐτὰς ἰδόντες καὶ ἀσπασάμενοι, καὶ ὁμολογήσαντες ὅτι ξένοι καὶ παρεπίδημοί εἰσιν ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/013.yaml
  text: All these died in faith[a], not having received the promises, but having seen them from afar and greeted them[c][b], and having confessed that they are strangers and exiles on the earth.
translation:
  language: tl
  text: 'Sa pananampalataya namatay ang lahat ng ito nang hindi nila natanggap ang mga pangako, ngunit nakita nila ang mga ito mula sa malayo at binati[a] ang mga ito, at ipinahayag nilang sila ay mga dayuhan at pansamantalang naninirahan[b] sa lupa.


    [a] Maaari ring “malugod na tinanggap” o “niyakap.” Ginamit dito bilang tayutay ang salitang Griyego para sa pagbati o malugod na pagtanggap.


    [b] Maaari ring “mga nakikipamayan” o “mga dayuhang naninirahan.” Tumutukoy ito sa mga naninirahan sa isang lugar ngunit hindi lubos na kabilang o permanenteng nakatira roon.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “malugod na tinanggap” o “niyakap.” Ginamit dito bilang tayutay ang salitang Griyego para sa pagbati o malugod na pagtanggap.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga nakikipamayan” o “mga dayuhang naninirahan.” Tumutukoy ito sa mga naninirahan sa isang lugar ngunit hindi lubos na kabilang o permanenteng nakatira roon.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατὰ πίστιν
  choice: Sa pananampalataya
  rationale: Ipinahahayag nito ang kalagayan o paninindigan ng pananampalataya habang sila ay namamatay, at pinananatili ang malapit na ugnayan sa salitang πίστις.
- source_word: ἀπέθανον οὗτοι πάντες
  choice: namatay ang lahat ng ito
  rationale: Tuwiran at likas na salin na pinananatili ang pagtukoy sa mga naunang binanggit.
- source_word: μὴ λαβόντες τὰς ἐπαγγελίας
  choice: nang hindi nila natanggap ang mga pangako
  rationale: Pinananatili ang tahasang maramihan na “mga pangako” at ang kaugnayan nito sa kanilang pagkamatay.
- source_word: πόρρωθεν αὐτὰς ἰδόντες
  choice: nakita nila ang mga iyon mula sa malayo
  rationale: Pinananatili ang larawang may distansiya nang hindi ipinapaliwanag kung temporal, heograpikal, o matalinghaga ang layo.
- source_word: ἀσπασάμενοι
  choice: binati
  rationale: 'Malapit ito sa karaniwang diwa ng pandiwang Griyego at pinananatili ang kapansin-pansing tayutay: binati nila ang mga pangakong nakita mula sa malayo ngunit hindi pa natanggap.'
- source_word: ὁμολογήσαντες
  choice: ipinahayag
  rationale: Ipinahihiwatig nito ang hayagang pagkilala o pag-amin nang hindi nagdaragdag ng negatibong himig na maaaring taglayin ng “inamin.”
- source_word: ξένοι
  choice: mga dayuhan
  rationale: Malinaw nitong ipinapakita na hindi sila katutubo o ganap na kabilang sa lugar.
- source_word: παρεπίδημοί
  choice: pansamantalang naninirahan
  rationale: Nauunawaan sa modernong Filipino at ipinapakita ang paninirahang walang ganap o permanenteng pagkakaugnay, nang hindi idinaragdag ang sapilitang pagpapatapon na maaaring ipahiwatig ng “mga ipinatapon.”
- source_word: ἐπὶ τῆς γῆς
  choice: sa lupa
  rationale: Likas na Filipino para sa malawak na diwang “on the earth,” habang hindi labis na pinipino ang γῆ bilang isang tiyak na lupain.
theological_decisions:
- issue: Diwa ng πίστις sa paraan o kalagayan ng kanilang pagkamatay
  choice: Sa pananampalataya
  alternative: Dahil sa pananampalataya; nang may pananampalataya
  rationale: Hindi tahasang nilulutas ng salin kung ang pananampalataya ang paraan, batayan, o kalagayang kinaroroonan nila; pinananatili nito ang lawak ng κατά + accusative.
- issue: Tayutay ng ἀσπασάμενοι na ang layon ay ang mga pangako
  choice: binati
  alternative: malugod na tinanggap; niyakap
  rationale: Iniiwasan nitong palabasing aktuwal na natanggap na nila ang mga pangako, na sasalungat sa naunang sugnay, habang pinananatili ang positibong pagtugon nila sa nakita mula sa malayo.
- issue: Katayuang ipinahihiwatig ng παρεπίδημοι
  choice: pansamantalang naninirahan
  alternative: mga nakikipamayan; mga dayuhang naninirahan; mga ipinatapon
  rationale: Ipinahahayag ang paninirahang walang ganap na pagkamamamayan o permanenteng pagkabilang. Hindi pinili ang “mga ipinatapon” sapagkat maaari itong magdagdag ng ideya ng sapilitang pagkakatapon na hindi kinakailangan ng salita.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “binati” upang mapanatili ang tayutay at maiwasan ang tila kontradiksiyon sa “hindi nila natanggap.” Ang “pansamantalang naninirahan” ay mas madaling maunawaan kaysa sa arkaykong “nakikipamayan,” na inilagay bilang alternatibo sa talababa.
