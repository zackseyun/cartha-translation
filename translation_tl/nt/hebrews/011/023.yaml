id: HEB.11.23
reference: Hebrews 11:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Πίστει Μωϋσῆς γεννηθεὶς ἐκρύβη τρίμηνον ὑπὸ τῶν πατέρων αὐτοῦ, διότι εἶδον ἀστεῖον τὸ παιδίον καὶ οὐκ ἐφοβήθησαν τὸ διάταγμα τοῦ βασιλέως.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/023.yaml
  text: By faith Moses[a], when he was born, was hidden for three months by his parents, because they saw that the child was beautiful, and they were not afraid of the king’s edict.
translation:
  language: tl
  text: Sa pananampalataya, nang ipanganak si Moises, itinago siya ng kanyang mga magulang sa loob ng tatlong buwan, sapagkat nakita nilang maganda[a] ang bata, at hindi sila natakot sa utos ng hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kaaya-aya” o “natatangi.” Ganito rin ang paglalarawan sa kanya sa Exodo 2:2 at Mga Gawa 7:20.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστει
  choice: Sa pananampalataya
  rationale: Ipinapahayag ang pananampalataya bilang batayan o paraang nag-udyok sa kilos, alinsunod sa paulit-ulit na hulma ng Hebreo 11.
- source_word: γεννηθεὶς
  choice: nang ipanganak
  rationale: Likas na temporal na salin ng aorist passive participle sa Tagalog.
- source_word: ἐκρύβη
  choice: itinago siya
  rationale: 'Pinananatili ang diwang pasibo: si Moises ang itinago ng iba.'
- source_word: τρίμηνον
  choice: sa loob ng tatlong buwan
  rationale: Malinaw at likas na pagpapahayag ng tagal sa Tagalog.
- source_word: ὑπὸ τῶν πατέρων αὐτοῦ
  choice: ng kanyang mga magulang
  rationale: Bagaman literal na “mga ama,” tumutukoy rito ang pangmaramihang anyo sa mga magulang ni Moises bilang isang pangkat.
- source_word: ἀστεῖον
  choice: maganda
  rationale: Saklaw ng salita ang pagiging maganda, kaaya-aya, o natatangi; “maganda” ang tuwiran at likas na salin, habang inilalahad sa talababa ang tunay na lawak ng kahulugan.
- source_word: τὸ παιδίον
  choice: ang bata
  rationale: Tuwirang katumbas na angkop sa marangal na tono; malinaw na sanggol si Moises mula sa konteksto.
- source_word: οὐκ ἐφοβήθησαν
  choice: hindi sila natakot
  rationale: Likas na Tagalog na nagpapanatili sa tahasang pagsalungat ng pananampalataya at takot.
- source_word: τὸ διάταγμα τοῦ βασιλέως
  choice: utos ng hari
  rationale: Ipinahahayag ang opisyal at may awtoridad na kautusan ng hari sa payak at kasalukuyang Tagalog.
theological_decisions:
- issue: Dahilan ng mga magulang sa pagtatago kay Moises
  choice: 'Inilalahad ang kanilang ginawa bilang kilos ng pananampalataya: nakita nilang maganda ang bata at hindi sila natakot sa utos ng hari.'
  alternative: Ipakahulugang ang anyo ng bata ay isang natatanging tanda mula sa Diyos, o na kagandahan lamang niya ang dahilan ng pagtatago.
  rationale: Binabanggit ng sintaks ang kanilang pagkakita sa bata at ang hindi nila pagkatakot, kapwa nasa ilalim ng pambungad na “Sa pananampalataya.” Hindi sinasabi ng teksto nang tahasan na isang himalang tanda ang anyo ng bata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino; iniwasan ang sobrang literal na “mga ama” at ang teknikal na “edikto,” ngunit pinanatili ang opisyal na diwa ng utos ng hari.
