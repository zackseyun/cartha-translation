base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/039.yaml
  text: And all these[a], though commended through faith, did not receive the promise[b],
translation:
  language: tl
  text: At lahat ng ito, bagaman nakatanggap ng mabuting patotoo sa pamamagitan ng pananampalataya[a], ay hindi tumanggap ng pangako[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinatotohanan” o “nakatanggap ng pagpapatunay.” Idiniriin ng Griyego na tumanggap ang mga taong ito ng paborableng patotoo sa pamamagitan ng pananampalataya.
    reason: lexical_alternative
  - marker: b
    text: O “hindi nakamit ang pangako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Karaniwang pang-ugnay ito sa naunang talaan ng mga taong sumampalataya; hindi na dinagdagan ng di-hayag na pagsalungat.
- source_word: πάντες
  choice: ang lahat ng ito
  rationale: Malinaw na tumutukoy pabalik sa mga halimbawang binanggit sa kabanata.
- source_word: μαρτυρηθέντες
  choice: pinatotohanang kalugod-lugod
  rationale: Ipinahihiwatig ng pasibong pandiwa ang mabuting patotoo o pagsang-ayon na tinanggap nila, hindi lamang ang pagkakaroon ng patotoo tungkol sa kanila.
- source_word: διὰ τῆς πίστεως
  choice: dahil sa pananampalataya
  rationale: Ipinahahayag ng διά na may genitive ang saligan o paraang kaugnay ng mabuting patotoong tinanggap nila; natural ito sa modernong Tagalog.
- source_word: πίστεως
  choice: pananampalataya
  rationale: Ito ang karaniwan at angkop na salin sa konteksto ng Hebreo 11, kung saan nangingibabaw ang pagtitiwala sa Diyos.
- source_word: οὐκ ἐκομίσαντο
  choice: hindi tumanggap
  rationale: Sa middle voice, ang κομίζω ay maaaring mangahulugang tumanggap o magkamit ng ipinangako; malinaw at likas ang 'tumanggap.'
- source_word: τὴν ἐπαγγελίαν
  choice: ng pangako
  rationale: Pinananatili ang payak at siksik na pananalita ng Griyego nang hindi ipinapasok sa pangunahing teksto ang interpretasyong 'katuparan ng pangako.'
theological_decisions:
- issue: Kahulugan ng “pangako” sa konteksto
  choice: pangako
  alternative: ang ipinangako; ang katuparan ng pangako; ang ipinangakong mana o pagpapala
  rationale: Hindi tahasang pinalalawak ng Griyego ang kahulugan. Hinahayaang linawin ng kasunod na konteksto, lalo na ng talata 40, ang pangwakas na katuparan nito.
- issue: Pinagmulan ng mabuting patotoo
  choice: Hindi tahasang idinagdag ang “ng Diyos” sa pangunahing teksto.
  alternative: pinuri ng Diyos; sinang-ayunan ng Diyos
  rationale: Ipinahihiwatig ng konteksto na ang Diyos ang nagpapatotoo, ngunit walang tahasang tagaganap sa pariralang Griyego; kaya pinanatili ang pahiwatig nang hindi ito ginawang lantad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kalugod-lugod” upang maipahayag ang positibong patotoo ng μαρτυρηθέντες nang hindi tahasang nagdaragdag ng tagaganap na wala sa Griyego; nananatili sa talababa ang mas literal na mga alternatibo.
