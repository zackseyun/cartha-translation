base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/034.yaml
  text: quenched the power of fire[a], escaped the edge of the sword, were made strong out of weakness, became mighty in battle[b], put foreign armies to flight.
translation:
  language: tl
  text: inapula ang bagsik ng apoy, nakaligtas sa talim ng tabak[a], pinalakas mula sa kahinaan, naging malalakas sa digmaan, at nagpaurong sa mga hukbong dayuhan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga bibig ng tabak,” isang idyomang tumutukoy sa talim ng tabak.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga kampo” o “mga pinagkakampuhan.” Sa kontekstong militar, metonimikong tumutukoy ang salita sa mga hukbong nagkakampo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσβεσαν
  choice: pinawi
  rationale: Ipinahahayag ng aorist active ng σβέννυμι ang pagpapatigil o pagpatay sa bisa ng apoy. Likas sa Filipino ang “pinawi” kasabay ng “lakas ng apoy,” at pinananatili nito ang matingkad na larawan.
- source_word: δύναμιν πυρός
  choice: ang lakas ng apoy
  rationale: Pinananatili ang δύναμις bilang “lakas” sa halip na paikliin lamang sa “apoy,” kaya hindi nawawala ang diwa ng mapaminsalang puwersa nito.
- source_word: ἔφυγον στόματα μαχαίρης
  choice: nakaligtas sa talim ng tabak
  rationale: Sa konteksto, ang ἔφυγον ay matagumpay na pagtakas o pagkaligtas. Ang literal na “mga bibig ng tabak” ay isang idyoma para sa talim nito, kaya “talim ng tabak” ang malinaw at likas na katumbas.
- source_word: ἐδυναμώθησαν ἀπὸ ἀσθενείας
  choice: mula sa pagiging mahina ay pinalakas
  rationale: Ang “mula sa pagiging mahina” ay nagpapanatili sa ἀπό bilang pinagmulan, samantalang ang “pinalakas” ay nagpapanatili sa pasibong anyo at sa diwang tinanggap ang lakas.
- source_word: ἐγενήθησαν ἰσχυροὶ ἐν πολέμῳ
  choice: naging makapangyarihan sa labanan
  rationale: Ang “naging” ay nagpapakita ng pagpasok sa isang kalagayan, at ang “makapangyarihan sa labanan” ay likas na naghahatid ng lakas o bisa sa pakikidigma nang hindi inuulit ang “pinalakas.”
- source_word: παρεμβολὰς ἔκλιναν ἀλλοτρίων
  choice: nagpaurong sa mga hukbong dayuhan
  rationale: Sa kontekstong militar, ang παρεμβολή ay tumutukoy sa kampo at, sa metonimiya, sa hukbong naroon. Ang ἔκλιναν ay pagpapaling o pagpapa退reat sa kaaway, kaya malinaw ang “nagpaurong,” habang ang ἀλλοτρίων ay “dayuhan.”
theological_decisions:
- issue: Antas ng pagiging literal sa sunod-sunod na larawan ng pagliligtas at tagumpay sa pananampalataya
  choice: Panatilihin ang kongkretong makasaysayan at militar na mga larawan nang hindi ginagawang purong espirituwal na talinghaga
  alternative: Ibuod ang mga ito bilang pangkalahatang pagtatagumpay laban sa panganib at mga kaaway
  rationale: Inililista ng Hebreo 11 ang mga tiyak at kongkretong gawa at karanasan ng mga tapat. Kaya pinananatili ang apoy, tabak, kahinaan, labanan, at mga hukbo, nang hindi dinaragdagan ng isang tiyak na denominasyonal na paliwanag.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang mabilis na ritmo ng magkakasunod na pandiwa at ang kongkretong imahen ng Griyego. Inilagay ang mga talababa sa mismong pariralang nililinaw ng bawat isa.
