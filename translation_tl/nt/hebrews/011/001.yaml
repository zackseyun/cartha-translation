id: HEB.11.1
reference: Hebrews 11:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἔστιν δὲ πίστις ἐλπιζομένων ὑπόστασις, πραγμάτων ἔλεγχος οὐ βλεπομένων·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/001.yaml
  text: Faith is the assurance of things hoped for[b][a], the proof of things not seen.
translation:
  language: tl
  text: Ang pananampalataya ay katiyakan sa mga inaasahan[a] at patunay ng mga bagay na hindi nakikita.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “saligan,” “substansiya,” o “realidad ng mga inaasahan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “katibayan” o “matibay na paniniwala tungkol sa mga bagay na hindi nakikita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστις
  choice: pananampalataya
  rationale: Karaniwang terminong Tagalog para sa pananampalatayang nakatuon sa pagtitiwala sa Diyos at sa kanyang mga pangako; hindi hinihingi ng konteksto ang diwang ‘katapatan.’
- source_word: ἐλπιζομένων
  choice: mga inaasahan
  rationale: Isinasalin ang substantival na participle bilang mga bagay na pinagtutuunan ng pag-asa, sa natural at maikling Tagalog.
- source_word: ὑπόστασις
  choice: katiyakan
  rationale: Naipapahayag ang diwa ng matatag na pagtitiwala o assurance nang hindi awtomatikong ginagawang teknikal na pahayag tungkol sa ‘substance’ o ontolohikal na realidad.
- source_word: πραγμάτων
  choice: mga bagay
  rationale: Sapat na malawak at natural para sa pangkalahatang diwa ng πρᾶγμα at kaagapay ng ‘mga inaasahan.’
- source_word: ἔλεγχος
  choice: patunay
  rationale: Pinananatili ang obhetibo at mapatutunayang puwersa ng salita, habang ang posibleng diwang ‘katibayan’ o panloob na ‘kumbiksiyon’ ay itinatala sa talababa.
- source_word: οὐ βλεπομένων
  choice: mga bagay na hindi nakikita
  rationale: Tuwirang pinananatili ang negatibong participial phrase at ang pagtukoy sa mga realidad na wala sa kasalukuyang paningin.
- source_word: δὲ
  choice: hindi hiwalay na isinalin
  rationale: Mahinang pang-ugnay ito rito; natural nang naihahatid sa Tagalog ng pagpapatuloy ng diskurso, kaya hindi kailangan ang panimulang ‘Ngayon,’ ‘At,’ o ‘Ngunit.’
theological_decisions:
- issue: Kahulugan ng ὑπόστασις sa Hebreo 11:1
  choice: katiyakan
  alternative: saligan, substansiya, o realidad
  rationale: Ang ‘katiyakan’ ay angkop sa praktikal at mapanghikayat na konteksto ng kabanata, ngunit hindi nito itinatanggi ang mas obhetibong mga posibleng diwa; kaya pinananatili ang mga iyon sa talababa.
- issue: Pagpapakahulugan sa πίστις
  choice: pananampalataya
  alternative: pagtitiwala o katapatan
  rationale: Ang konteksto ay tumutukoy sa tugon ng taong nagtitiwala sa mga pangako ng Diyos, hindi sa katapatan ng ibang tinutukoy na persona.
- issue: Kahulugan ng ἔλεγχος
  choice: patunay
  alternative: katibayan o matibay na paniniwala
  rationale: Ang ‘patunay’ ay nagpapanatili sa evidentiary force ng salita, samantalang kinikilala sa talababa na maaari rin itong tumukoy sa katiyakang o kumbiksiyong dulot ng katibayan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang dalawang magkatimbang na sugnay at iniwasan ang teknikal o denominasyonal na pagpapakahulugan.
