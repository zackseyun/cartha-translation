  source_fidelity: 'Ang pangunahing salin ay tapat sa Griyegong teksto: napapanatili ang instrumental na πίστει, ang distributibong ''bawat'' para sa ἕκαστον, ang pagbabasbas sa mga anak ni Jose, at ang ''tungkod'' sa huling parirala. Gayunman, ang ''nang mamamatay na'' ay karaniwang nagpapahiwatig na malapit pa lamang mamatay, samantalang ang ἀποθνῄσκων ay naglalarawan kay Jacob bilang nasa proseso ng pagpanaw. Ang ''habang naghihingalo'' ay mas tuwirang tumutugon sa aspektong ito.'
  naturalness: Malinaw at marangal ang Tagalog. Mas natural at mas tumpak sa aspekto ang 'habang naghihingalo si Jacob' kaysa 'nang mamamatay na si Jacob.' Ang 'habang nakasandal sa dulo ng kanyang tungkod' ay isang likas na paraan upang ipahayag ang malamang na adverbial na gamit ng pariralang Griyego nang hindi ginagawang layon ng pagsamba ang tungkod.
  terminology: Ang 'pananampalataya,' 'binasbasan,' 'sumamba,' at 'tungkod' ay angkop sa modernong Filipino Tagalog at sa rehistrong biblikal. Pinananatili ng mga talababa ang mahalagang pagkakaiba ng 'higaan' sa Hebreong Genesis at 'tungkod' sa Griyegong teksto, pati ang alternatibong sintaktikong pagbasa.
