  text: πίστει Ἰακὼβ ἀποθνῄσκων ἕκαστον τῶν υἱῶν Ἰωσὴφ εὐλόγησεν, καὶ προσεκύνησεν ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/021.yaml
  text: By faith Jacob[a], as he was dying, blessed each of the sons of Joseph[b], and worshiped while leaning on the top of his staff.
translation:
  language: tl
  text: Dahil sa pananampalataya, habang naghihingalo si Jacob, binasbasan niya ang bawat anak ni Jose at sumamba siya habang nakasandal sa dulo ng kanyang tungkod.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ayon sa tekstong Hebreo ng Genesis 47:31, “at yumukod sa pagsamba sa ulunan ng kanyang higaan.” “Tungkod” ang mababasa sa tekstong Griyego rito.
    reason: textual_variant
  - marker: b
    text: O, “sumamba nang nakaharap sa dulo ng kanyang tungkod.” Malamang na inilalarawan ng parirala ang tindig ni Jacob, hindi ang layon ng kanyang pagsamba.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Dahil sa pananampalataya
  rationale: 'Ipinapahayag ang instrumental o modal na gamit ng datibo: ginawa ni Jacob ang mga ito sa bisa ng pananampalataya. Ang “pananampalataya” ang likas at magkakatugmang salin sa konteksto ng Hebreo 11.'
- source_word: ἀποθνῄσκων
  choice: nang mamamatay na
  rationale: Likas na salin sa modernong Tagalog ng kasabay na pangyayari sa participle, nang hindi ipinahihiwatig na patay na si Jacob o nililimitahan ito sa isang saglit lamang.
- source_word: ἕκαστον τῶν υἱῶν Ἰωσὴφ
  choice: ang bawat isa sa mga anak ni Jose
  rationale: 'Pinananatili ang distributibong diin ng ἕκαστον at ang partitive genitive: isa-isa niyang binasbasan ang mga anak ni Jose.'
- source_word: εὐλόγησεν
  choice: binasbasan
  rationale: Karaniwan at marangal na salin ng εὐλογέω sa konteksto ng pagbabasbas ni Jacob sa salaysay ng Genesis.
- source_word: προσεκύνησεν
  choice: sumamba
  rationale: Ipinapahayag ang relihiyosong diwa ng προσκυνέω sa pagbasa ng Hebreo, sa halip na katawaning pagyukod lamang.
- source_word: ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ
  choice: habang nakasandal sa dulo ng kanyang tungkod
  rationale: Likas na inilalarawan ang malamang na tindig ni Jacob at iniiwasang magmukhang ang tungkod ang sinasamba, habang pinananatili ang “tungkod” ng tekstong Griyego.
theological_decisions:
- issue: Kaugnayan ng pagsamba ni Jacob sa tungkod sa huling parirala
  choice: Sumamba si Jacob habang nakasandal sa dulo ng kanyang tungkod.
  alternative: Yumukod siya sa pagsamba sa ulunan ng kanyang higaan; o sumamba siya nang nakaharap sa dulo ng kanyang tungkod.
  rationale: “Tungkod” ang mababasa sa tekstong Griyego ng Hebreo, na tumutugma sa anyo ng tekstong Griyego ng Genesis 47:31, samantalang “higaan” ang pagbasa sa tekstong Hebreo ng Genesis. Inilalarawan ng pangunahing salin ang parirala bilang tindig ni Jacob upang hindi ipahiwatig na ang tungkod ang layon ng pagsamba, ngunit pinananatili sa mga talababa ang tunay na tekstuwal at sintaktikong mga alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “binasbasan,” “sumamba,” at “tungkod” bilang pamilyar na bokabularyong biblikal; hinati sa dalawang pangungusap upang maging natural ang daloy nang hindi binabago ang ugnayan ng mga kilos.
