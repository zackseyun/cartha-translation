revisions:
- from: Dahil sa pananampalataya, nang mamamatay na si Jacob, binasbasan niya ang bawat isa sa mga anak ni Jose. At sumamba siya habang nakasandal sa dulo ng kanyang tungkod.[a][b]
  to: Dahil sa pananampalataya, habang naghihingalo si Jacob, binasbasan niya ang bawat anak ni Jose at sumamba siya habang nakasandal sa dulo ng kanyang tungkod.[a][b]
  rationale: Pinalitan ang temporal na parirala upang maipahayag ang nagpapatuloy na kalagayan ni Jacob sa ἀποθνῄσκων. Pinagsama rin ang dalawang sugnay sa isang pangungusap upang mas malinaw na magkaugnay ang dalawang kilos na pinag-uugnay ng καί, nang hindi binabago ang kahulugan. Walang binagong interpretasyong teolohikal; ang tekstuwal at sintaktikong mga alternatibo ay nananatili sa mga talababa.
