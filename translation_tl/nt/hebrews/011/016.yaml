id: HEB.11.16
reference: Hebrews 11:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: νῦν δὲ κρείττονος ὀρέγονται, τοῦτ’ ἔστιν ἐπουρανίου. διὸ οὐκ ἐπαισχύνεται αὐτοὺς ὁ θεὸς θεὸς ἐπικαλεῖσθαι αὐτῶν, ἡτοίμασεν γὰρ αὐτοῖς πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/016.yaml
  text: But as it is[a], they long for a better country—that is, a heavenly one. Therefore God is not ashamed to be called their God, for he has prepared a city for them.
translation:
  language: tl
  text: Ngunit ang talagang minimithi nila ay isang mas mabuting bayan[a]—samakatuwid, isang makalangit na bayan. Kaya hindi ikinahihiya ng Diyos na tawaging Diyos nila, sapagkat naghanda siya ng isang lungsod para sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mas mabuting sariling bayan” o “mas mabuting tinubuang-bayan.” Ang mga pang-uri sa Griyego ay tumutukoy sa ipinahihiwatig na “bayan” mula sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν δὲ
  choice: Ngunit ang talagang
  rationale: Ipinakikita ang pagsalungat sa naunang di-tunay na kalagayan sa talata 15 at ang aktuwal na kalagayan ngayon, nang hindi ginagawang purong pananda ng panahon ang νῦν.
- source_word: κρείττονος
  choice: mas mabuting
  rationale: Likas at malinaw na katumbas ng pahambing na nangangahulugang higit na mabuti o nakahihigit.
- source_word: ὀρέγονται
  choice: minimithi nila
  rationale: Ipinahahayag ang taimtim na pagnanais at paghahangad, higit sa payak na “gusto.”
- source_word: κρείττονος ... ἐπουρανίου
  choice: isang mas mabuting bayan—samakatuwid, isang makalangit na bayan
  rationale: Ang pambabaeng anyo ng mga pang-uri ay nagpapahiwatig ng πατρίς mula sa konteksto. Ang “bayan” ay natural sa Filipino at maaaring tumukoy sa sariling lupain o bayang tinuturing na tahanan.
- source_word: διὸ
  choice: Kaya
  rationale: Malinaw na ipinahahayag ang bunga o hinuha mula sa kanilang paghahangad sa makalangit na bayan.
- source_word: οὐκ ἐπαισχύνεται
  choice: hindi ikinahihiya
  rationale: Pinananatili ang tuwirang wika ng kahihiyan at dangal sa teksto.
- source_word: θεὸς ἐπικαλεῖσθαι αὐτῶν
  choice: na tawaging Diyos nila
  rationale: Natural na Filipino para sa katawagan o pagkilalang ang Diyos ay kanilang Diyos, at pinananatili ang pormulang panrelasyon nang hindi ito pinalalawak.
- source_word: ἡτοίμασεν
  choice: naghanda siya
  rationale: Tuwirang ipinahahayag ang natapos na pagkilos ng Diyos; malinaw sa konteksto na nakahanda ang lungsod para sa kanila.
- source_word: πόλιν
  choice: isang lungsod
  rationale: Pinananatili ang kongkretong larawang eskatolohikal at ang di-tiyak na anyo ng pangngalan.
theological_decisions:
- issue: Ipinahihiwatig na pangngalan sa κρείττονος at ἐπουρανίου
  choice: Ipinahayag bilang “bayan,” ayon sa πατρίς sa agarang konteksto
  alternative: “sariling bayan,” “tinubuang-bayan,” o iwang di-tiyak bilang “isang bagay na mas mabuti”
  rationale: Nakasalalay ang mga pambabaeng pang-uri sa ideya ng πατρίς sa talata 14. Ang “bayan” ay nagpapanatili ng ugnayang iyon nang hindi labis na dinaragdagan ang emosyonal o pambansang kulay ng “tinubuang-bayan.”
- issue: Pormulang panrelasyon na “Diyos nila”
  choice: Pinanatili nang walang pagpapalawak
  alternative: “kilalanin sila bilang kanyang bayan”
  rationale: Tiyak na sinasabi ng Griyego na hindi ikinahihiya ng Diyos na tawaging Diyos nila. Ang pagpapalawak tungo sa isa pang pormulang tipan ay higit sa tahasang sinasabi ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “minimithi” upang maipakita ang taimtim na paghahangad, at “makalangit” bilang maikli at natural na katumbas ng ἐπουράνιος. Ang panandang [a] ay inilagay agad pagkatapos ng “bayan,” na siyang saklaw ng leksikal na tala.
