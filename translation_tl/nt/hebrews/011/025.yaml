lexical_decisions:
- source_word: μᾶλλον
  choice: sa halip
  rationale: Malinaw at likas na ipinapahayag ang pagpili sa unang opsiyon sa halip na sa ikalawa.
- source_word: ἑλόμενος
  choice: pinili niyang
  rationale: Ipinakikita ang kusang at tiyak na pasiya ni Moises habang likas na inuugnay ang talata sa naunang pangungusap.
- source_word: συγκακουχεῖσθαι
  choice: dumanas ng masamang pagtrato kasama ng
  rationale: Pinananatili kapwa ang pagdurusa dahil sa masamang pagtrato at ang pakikiisa sa iba na nasa pandiwang may unlaping συν-.
- source_word: τῷ λαῷ τοῦ θεοῦ
  choice: bayan ng Diyos
  rationale: Karaniwan, marangal, at angkop na salin ng covenantal na katawagang ito sa modernong Filipino.
- source_word: ἢ
  choice: kaysa
  rationale: Likas na panandang Filipino para sa ikalawang bahagi ng paghahambing.
- source_word: πρόσκαιρον
  choice: pansamantalang
  rationale: Tumutukoy sa bagay na tumatagal lamang nang maikling panahon at hindi ipinapalagay ang eksaktong haba nito.
- source_word: ἔχειν
  choice: magkaroon ng
  rationale: Pinananatili ang payak na diwa ng ‘magkaroon’ sa halip na ilipat sa pandiwa ang ideya ng pagtatamasa na nasa pangngalang ἀπόλαυσιν.
- source_word: ἁμαρτίας
  choice: sa kasalanan
  rationale: Likas sa Filipino at pinananatiling malawak ang kaugnayan ng kasiyahan sa kasalanan nang hindi tinutukoy ang partikular na gawa.
- source_word: ἀπόλαυσιν
  choice: kasiyahan
  rationale: Malinaw at pangkaraniwang salita para sa enjoyment o pleasure nang hindi labis na nagpapahiwatig ng sensuwal na kaluguran.
theological_decisions:
- issue: Ang uri ng alternatibo ni Moises sa pagdurusang kasama ng bayan ng Diyos
  choice: Inilalarawan ito bilang pansamantalang kasiyahang kaugnay ng kasalanan, nang hindi tinutukoy kung anong partikular na kasalanan ang tinutukoy.
  alternative: Maaaring partikular itong tumukoy sa mga pribilehiyo at kompromiso sa sambahayan ng Faraon, o mas malawak sa makasalanang mga kaluguran ng Ehipto.
  rationale: Hindi nililinaw ng Griyego ang tiyak na nilalaman ng kasalanan; kaya pinananatili ng salin ang lawak at tensiyon ng pahayag.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “bayan ng Diyos” bilang likas na covenantal na katawagan at iniwasang tukuyin nang higit sa Griyego ang partikular na kasalanang tinutukoy.
