  source_fidelity: Tumpak na naipapahayag ng salin ang πίστει bilang instrumental na “Sa pananampalataya,” ang pagkakakilanlan kay Rahab bilang πόρνη, ang hindi niya pagkapahamak kasama ng mga sumuway, at ang pagtanggap niya sa mga espiya sa mapayapang paraan. Hindi nito ipinapasok ang mas makitid na pagbasa na “mga hindi sumampalataya” para sa ἀπειθήσασιν.
  naturalness: Likas at malinaw ang ayos sa modernong Filipino. Ang “hindi napahamak ... kasama ng mga sumuway” ay maayos na naghahatid ng tambalang diwa ng συναπώλετο. Ang “nang mapayapa” ay natural na pang-abay para sa μετ’ εἰρήνης.
