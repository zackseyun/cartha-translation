id: HEB.11.31
reference: Hebrews 11:31
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πίστει Ῥαὰβ ἡ πόρνη οὐ συναπώλετο τοῖς ἀπειθήσασιν, δεξαμένη τοὺς κατασκόπους μετ’ εἰρήνης.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/031.yaml
  text: By faith Rahab the prostitute did not perish with those who were disobedient[b][a], because she had welcomed the spies in peace.
translation:
  language: tl
  text: Sa pananampalataya, hindi napahamak ang patutot na si Rahab kasama ng mga sumuway[a], dahil tinanggap niya nang mapayapa ang mga espiya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kasama ng mga hindi sumunod.”
    reason: lexical_alternative
  - marker: b
    text: O “tinanggap ang mga espiya nang may kapayapaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Sa pananampalataya
  rationale: Ipinahahayag ang instrumental na gamit ng datibo at pinananatili ang paulit-ulit na pormula ng Hebreo 11 sa likas na Filipino.
- source_word: Ῥαὰβ
  choice: Rahab
  rationale: Ginamit ang karaniwang transliterasyon ng pangalang pantangi.
- source_word: ἡ πόρνη
  choice: ang patutot na si Rahab
  rationale: Tuwirang katumbas ng πόρνη ang “patutot”; malinaw ito sa modernong Filipino at hindi pinapalabnaw ang panlipunan at moral na bigat ng salita.
- source_word: οὐ συναπώλετο
  choice: hindi napahamak ... kasama ng
  rationale: Ang tambalang pandiwa ay tumutukoy sa hindi pagkapahamak kasabay ng iba; likas na naipahahayag sa Filipino sa pagsasama ng “hindi napahamak” at “kasama ng.”
- source_word: τοῖς ἀπειθήσασιν
  choice: mga sumuway
  rationale: Pinananatili ang aktibong diwa ng hindi pagsunod o pagsuway, sa halip na tahasang gawing “mga hindi sumampalataya.”
- source_word: δεξαμένη
  choice: dahil tinanggap niya
  rationale: Ang aorist participle ay likas na mababasa rito bilang dahilan o kalagayang kaugnay ng kanyang pagkaligtas; malinaw at natural ang sugnay na may “dahil.”
- source_word: τοὺς κατασκόπους
  choice: ang mga espiya
  rationale: Ang “espiya” ang malinaw at karaniwang katawagan sa mga lihim na nagmamasid sa konteksto ng salaysay sa Josue.
- source_word: μετ’ εἰρήνης
  choice: nang mapayapa
  rationale: Ipinahahayag nito ang mapayapang paraan ng pagtanggap nang hindi nagdaragdag ng diwang “malugod” na wala sa parirala.
theological_decisions:
- issue: Kahulugan ng πίστις sa pormula ng mga halimbawa sa Hebreo 11
  choice: pananampalataya
  alternative: pagtitiwala; katapatan
  rationale: Sa konteksto ng Hebreo 11, ang πίστει ay bahagi ng paulit-ulit na pormulang naglalahad ng pagkilos batay sa pananampalataya. Ang “pananampalataya” ang pinakatumpak at kinikilalang katumbas nang hindi nililimitahan ito sa “pagtitiwala” o inililipat sa “katapatan.”
- issue: Kahulugan ng ἀπειθήσασιν
  choice: mga sumuway
  alternative: mga hindi sumampalataya
  rationale: Maaaring magtaglay ang salitang Griyego ng kaugnayan sa kawalan ng paniniwala, ngunit pangunahing pinananatili rito ang moral at kusang diwa ng pagsuway upang hindi lutasin nang labis ang ugnayan ng di-paniniwala at di-pagsunod.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang “patutot” bilang tuwiran at hindi arkaikong katawagan, at iniwasan ang eupemismo. Ang ayos ng pangungusap ay likas sa Filipino habang nananatiling lantad ang ugnayan ng pananampalataya, pagsuway, at mapayapang pagtanggap.
