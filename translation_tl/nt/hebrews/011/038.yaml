id: HEB.11.38
reference: Hebrews 11:38
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὧν οὐκ ἦν ἄξιος ὁ κόσμος ⸀ἐπὶ ἐρημίαις πλανώμενοι καὶ ὄρεσι καὶ σπηλαίοις καὶ ταῖς ὀπαῖς τῆς γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/038.yaml
  text: —of whom the world was not worthy—wandering in deserts and mountains[b][a], and caves and holes in the ground.
translation:
  language: tl
  text: —mga taong hindi karapat-dapat ang mundo sa kanila—nagpagala-gala sa mga ilang[a] at mga bundok, at sa mga kuweba at mga siwang sa lupa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga tiwangwang na lugar.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mga butas ng lupa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν
  choice: mga taong ... sa kanila
  rationale: Ginawang likas sa Tagalog ang panghalip na genitibo habang malinaw na tumutukoy sa mga tapat na nagdusa sa naunang talata.
- source_word: οὐκ ἦν ἄξιος ὁ κόσμος
  choice: hindi karapat-dapat ang mundo sa kanila
  rationale: 'Pinananatili ang matinding paghahatol sa moral na halaga: ang mundo, hindi ang mga nagdurusa, ang ipinahahayag na hindi karapat-dapat.'
- source_word: ἐπὶ ἐρημίαις
  choice: sa mga ilang
  rationale: Ang 'ilang' ay maikli, marangal, at maaaring tumukoy sa disyerto o iba pang tiwangwang na lugar; inilalahad sa talababa ang leksikal na saklaw.
- source_word: πλανώμενοι
  choice: nagpagala-gala
  rationale: Ipinahihiwatig ang patuloy at di-panatag na paglalakbay ng mga taong itinaboy o walang matuluyan.
- source_word: ὄρεσι
  choice: mga bundok
  rationale: Tuwirang katumbas at likas sa modernong Tagalog.
- source_word: σπηλαίοις
  choice: mga kuweba
  rationale: Karaniwan at madaling maunawaang salita para sa likas na yungib.
- source_word: ὀπαῖς τῆς γῆς
  choice: mga siwang sa lupa
  rationale: Ang ὀπή ay maaaring butas, bukana, o siwang; ang 'siwang sa lupa' ay natural at angkop bilang taguan, habang pinananatili sa talababa ang mas literal na anyo.
theological_decisions:
- issue: Lakas at tinutukoy ng pahayag na hindi karapat-dapat ang mundo
  choice: Iningatan bilang moral na paghatol sa mundo na kaiba sa halaga ng mga tapat na nagdusa.
  alternative: Isang neutral na pahayag lamang na hindi magkatugma ang mga tapat at ang mundo.
  rationale: Malinaw na mapaghusga ang ἄξιος sa konteksto; hindi ito basta paglalarawan ng pagkakaiba o di-pagkakatugma.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang mga gitling upang ipakitang parentetikal ang unang sugnay. Parehong marker na [a] at [b] ay nasa pangunahing teksto at tumutugma sa mga talababa.
