id: HEB.11.12
reference: Hebrews 11:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: διὸ καὶ ἀφ’ ἑνὸς ἐγεννήθησαν, καὶ ταῦτα νενεκρωμένου, καθὼς τὰ ἄστρα τοῦ οὐρανοῦ τῷ πλήθει καὶ ὡς ἡ ἄμμος ἡ παρὰ τὸ χεῖλος τῆς θαλάσσης ἡ ἀναρίθμητος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/012.yaml
  text: Therefore from one man[a], and this one as good as dead, descendants were born as numerous as the stars of heaven and as the innumerable sand by the seashore.
translation:
  language: tl
  text: Kaya naman, mula sa iisang lalaki[a]—na para na ring patay—ay isinilang ang mga inapo na sindami ng mga bituin sa langit at ng di-mabilang na buhangin sa dalampasigan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “mula sa isa.” Ang tinutukoy ay si Abraham; ang pariralang “para na ring patay” ay tumutukoy sa kaniyang napakatandang edad at sa kawalan na niya ng likas na kakayahang magkaanak.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Kaya naman
  rationale: Likas na ipinahahayag sa Tagalog ang lohikal na bunga ng naunang pahayag tungkol sa pananampalataya at pangako.
- source_word: ἀφ’ ἑνὸς
  choice: mula sa iisang lalaki
  rationale: Bagaman literal na “mula sa isa,” panlalaki ang anyo at malinaw sa konteksto na si Abraham ang tinutukoy. Nililinaw ng “lalaki” ang referent nang hindi pinapangalanan sa mismong talata.
- source_word: ἐγεννήθησαν
  choice: ay isinilang ang mga inapo
  rationale: Ang pandiwang pasibo at maramihan ay tumutukoy sa paglitaw ng salinlahi ni Abraham. Idinagdag ang “mga inapo” bilang likas na ipinahihiwatig na simuno sa Tagalog.
- source_word: καὶ ταῦτα νενεκρωμένου
  choice: na para na ring patay
  rationale: Pinananatili ang matinding metapora ng Griyego ngunit hindi ipinahihiwatig na literal nang patay si Abraham; tumutukoy ito sa kaniyang katandaan at kawalan na ng likas na kakayahang magkaanak.
- source_word: καθὼς τὰ ἄστρα τοῦ οὐρανοῦ τῷ πλήθει
  choice: na sindami ng mga bituin sa langit
  rationale: Natural na paghahambing sa Tagalog na tahasang pinananatili ang diwa ng napakaraming bilang.
- source_word: ὡς ἡ ἄμμος ἡ παρὰ τὸ χεῖλος τῆς θαλάσσης
  choice: at ng ... buhangin sa dalampasigan
  rationale: Ang “dalampasigan” ang likas na katumbas ng idyomang literal na tumutukoy sa gilid o labi ng dagat.
- source_word: ἀναρίθμητος
  choice: di-mabilang
  rationale: Malinaw at dignified na salitang Tagalog para sa daming hindi kayang bilangin.
theological_decisions:
- issue: Tinutukoy ng “mula sa isa”
  choice: Iisang lalaki, si Abraham, ang tinutukoy.
  alternative: Panatilihin lamang ang “mula sa isa.”
  rationale: Panlalaki ang Griyegong ἑνός at kinikilala ng agarang konteksto si Abraham. Nililinaw ito ng salin nang hindi nagdaragdag ng doktrinang wala sa teksto.
- issue: Diwa ng νενεκρωμένου
  choice: Metaporikal na “para na ring patay,” dahil sa katandaan at kawalan ng kakayahang magkaanak.
  alternative: Literal na patay o pinatay.
  rationale: Hindi literal na kamatayan ang tinutukoy kundi ang tila imposibleng pagkakaroon ng anak dahil sa kalagayan ni Abraham; pinananatili ng salin ang lakas ng metapora.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “para na ring patay” upang mapanatili ang matinding larawan ng orihinal habang maging natural sa karaniwang mambabasa; iniwasan ang arkaikong “ipinanganak” sa diwang “begotten” at ang labis na teknikal na pananalita.
