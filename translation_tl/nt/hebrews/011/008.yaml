reference: Hebrews 11:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀Πίστει καλούμενος Ἀβραὰμ ὑπήκουσεν ἐξελθεῖν εἰς ⸀τόπον ὃν ἤμελλεν λαμβάνειν εἰς κληρονομίαν, καὶ ἐξῆλθεν μὴ ἐπιστάμενος ποῦ ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/008.yaml
  text: By faith Abraham[a], when called, obeyed to go out to a place that he was going to receive as an inheritance, and he went out not knowing where he was going.
translation:
  language: tl
  text: Sa pananampalataya, nang tawagin siyang umalis, sumunod si Abraham patungo sa isang lugar na tatanggapin niya bilang mana. Umalis siya nang hindi niya alam kung saan siya pupunta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πίστει
  choice: Sa pananampalataya
  rationale: 'Ginamit bilang instrumental na parirala: ang pananampalataya ang paraan o saligan ng pagtugon ni Abraham. Pinananatili rin nito ang mahalagang terminong paulit-ulit sa kabanata.'
- source_word: καλούμενος
  choice: nang tawagin
  rationale: Natural na Filipino para sa present passive participle na may temporal at circumstantial na diwa, nang hindi labis na tinutukoy ang eksaktong pagkakasunod ng mga pangyayari.
- source_word: ὑπήκουσεν ἐξελθεῖν
  choice: sumunod siyang umalis
  rationale: Ipinahahayag na ang pagsunod ni Abraham ay nahayag sa kanyang pag-alis, habang pinananatili ang pandiwang 'umalis' na inuulit sa kasunod na sugnay.
- source_word: εἰς τόπον
  choice: patungo sa isang lugar
  rationale: Ang 'isang lugar' ay angkop sa hindi pa tiyak na destinasyon; ang 'patungo' ay malinaw na nagpapahayag ng direksiyon.
- source_word: ἤμελλεν λαμβάνειν εἰς κληρονομίαν
  choice: na tatanggapin niya bilang mana
  rationale: Natural na pagpapahayag ng nakalaang pagtanggap sa hinaharap nang hindi ipinapasok ang mas tiyak na diwang predestinasyon; ang 'bilang mana' ay tumutugma sa katayuan ng lugar na tatanggapin.
- source_word: καὶ ἐξῆλθεν
  choice: Umalis siya
  rationale: Pinananatili ang tahasang pag-uulit ng ideya at pandiwa ng pag-alis sa Griyego.
- source_word: μὴ ἐπιστάμενος ποῦ ἔρχεται
  choice: nang hindi niya alam kung saan siya pupunta
  rationale: Pinananatili ang attendant circumstance ng participle at isinasalin ang present-form ἔρχεται ayon sa kinakailangang diwa ng patutunguhan sa natural na Filipino.
theological_decisions:
- issue: Kahulugan ng πίστις sa pagtugon ni Abraham
  choice: pananampalataya
  alternative: pagtitiwala; katapatan
  rationale: Sa konteksto, nangingibabaw ang mapagtiwalang pagtugon ni Abraham sa tawag ng Diyos. Ang 'pananampalataya' ay pinananatili rin ang terminolohikal na ugnayan sa buong Hebreo 11 nang hindi inaalis ang sangkap ng pagtitiwala.
- issue: Ugnayan ng pagsunod at pag-alis
  choice: sumunod siyang umalis
  alternative: sumunod siya sa pamamagitan ng pag-alis; sumunod siya at umalis
  rationale: 'Ang infinitive na ἐξελθεῖν ay umaakma sa ὑπήκουσεν: ang iniutos at isinagawang pagsunod ay ang pag-alis. Ang salin ay hindi naghihiwalay sa mga ito bilang dalawang walang kaugnayang kilos.'
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasan ang mabigat na literalismong gaya ng 'sumunod upang lumabas,' ngunit pinanatili ang pag-uulit ng 'umalis' at ang kawalang-katiyakan ni Abraham tungkol sa destinasyon.
