  source_fidelity: 'Tumpak sa kabuuan ang draft: naipapahayag nito ang pananampalataya, ang pagtawag kay Abraham, ang pagsunod na may kaugnayan sa pag-alis, ang tatanggapin niyang mana, at ang kawalan niya ng kaalaman sa patutunguhan. Gayunman, ang "nang tawagin si Abraham, sumunod siyang umalis" ay bahagyang malabo at hindi kasinglinaw ng Griyego na ang tawag ay upang siya''y umalis.'
