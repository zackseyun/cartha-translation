  yaml_path: translation/nt/hebrews/011/036.yaml
  text: And others experienced mocking and flogging[a], and even chains and imprisonment.
translation:
  language: tl
  text: Ang iba naman ay dumanas ng panunuya at paghagupit,[a] at maging ng pagkagapos at pagkabilanggo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “sinubok sa pamamagitan ng panunuya at paghagupit, at maging ng pagkagapos at pagkabilanggo.” Mas literal sa Griyego: “tumanggap ng pagsubok ng …”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτεροι
  choice: Ang iba naman
  rationale: Tumutukoy sa panibagong pangkat ng mga tapat na nagdusa at malinaw na ipinag-iiba sila sa mga naunang halimbawa.
- source_word: ἐμπαιγμῶν
  choice: panunuya
  rationale: Natural at dignified na modernong Tagalog para sa pampublikong pangungutya o paghamak.
- source_word: μαστίγων
  choice: paghagupit
  rationale: Tiyak na tumutukoy sa pagpaparusa sa pamamagitan ng mga latigo o hagupit, at mas mabigat kaysa sa pangkalahatang 'pambubugbog.'
- source_word: πεῖραν ἔλαβον
  choice: dumanas
  rationale: Natural na inilalahad ang idyomang literal na 'tumanggap ng pagsubok ng' habang pinananatili ang diwa ng pagdaan sa matinding karanasan.
- source_word: ἔτι δὲ
  choice: at maging
  rationale: Ipinakikita ang pag-igting mula sa panunuya at paghagupit tungo sa pagkagapos at pagkabilanggo.
- source_word: δεσμῶν
  choice: pagkagapos
  rationale: Ipinahahayag ang kalagayan ng pagkakatali o pagkakadena nang natural sa koordinasyon sa iba pang mga pagdurusa.
- source_word: φυλακῆς
  choice: pagkabilanggo
  rationale: Tumutukoy sa kalagayan ng pagkakulong, hindi lamang sa lugar na bilangguan.
