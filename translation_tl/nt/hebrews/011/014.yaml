  text: For those who say such things make it clear that they are seeking a homeland[a].
translation:
  language: tl
  text: Sapagkat malinaw na ipinakikita ng mga nagsasabi ng gayong mga bagay na naghahanap sila ng isang tinubuang-bayan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sariling bayan” o “lupang tinubuan.” Nililinaw sa talata 16 na ang bayang hinahangad nila ay makalangit.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na kaugnayan ng talata sa naunang pahayag.
- source_word: τοιαῦτα
  choice: gayong mga bagay
  rationale: Likas na tumutukoy pabalik sa uri ng mga pahayag na binanggit sa konteksto.
- source_word: λέγοντες
  choice: mga nagsasabi
  rationale: Isinasalin ang kasalukuyang participle bilang natural na pariralang panuring habang pinananatili ang pangkalahatan o nagpapatuloy na diwa.
- source_word: ἐμφανίζουσιν
  choice: malinaw na ipinakikita
  rationale: Ipinahahayag ang diwang ginagawa nilang hayag o maliwanag ang isang bagay sa pamamagitan ng kanilang sinabi.
- source_word: ὅτι
  choice: na
  rationale: Ipinakikilala ang nilalaman ng bagay na kanilang ginagawang malinaw.
- source_word: πατρίδα
  choice: isang bayang matatawag na sarili
  rationale: Ipinahahayag ang πατρίς bilang sariling bayan o tinubuang lupain nang hindi ito agad tinutukoy bilang makalupa o makalangit; ang “isang” ay umaayon sa walang artikulong pangngalan.
- source_word: ἐπιζητοῦσιν
  choice: naghahanap
  rationale: Pinananatili ang diwa ng patuloy at aktibong paghahanap, sa halip na hangarin lamang.
theological_decisions:
- issue: Ang tinutukoy na πατρίς na hinahanap ng mga ninuno
  choice: Hindi tinukoy sa pangunahing teksto kung ito ay makalupa o makalangit.
  alternative: Isalin bilang “makalangit na bayan” o bilang isang tiyak na makalupang tinubuang-bayan.
  rationale: Sa talatang ito, sinasabi lamang na naghahanap sila ng isang πατρίς; sa kasunod na talata pa nililinaw na ang kanilang pinakahihintay ay mas mabuti at makalangit. Pinananatili rito ang pag-unlad at tensiyon ng konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bayang matatawag na sarili” upang maging natural sa karaniwang mambabasa at mapanatili ang lawak ng kahulugan ng πατρίς.
