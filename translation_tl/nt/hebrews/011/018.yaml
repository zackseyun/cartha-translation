lexical_decisions:
- source_word: πρὸς ὃν
  choice: na siyang
  rationale: Iniuugnay nito kay Abraham ang taong tumanggap ng pahayag; natural sa Tagalog ang hulma na “na siyang sinabihan” sa loob ng nagpapatuloy na pangungusap.
- source_word: ἐλαλήθη
  choice: sinabihan
  rationale: Pinananatili ang pasibong anyo at malinaw na ipinahihiwatig na kay Abraham sinabi ang sumunod na pahayag.
- source_word: ὅτι
  choice: —
  rationale: Hindi na kailangang tumbasan nang hiwalay sapagkat likas na ipinakikilala ng panipi ang nilalaman ng sinabi.
- source_word: Ἐν Ἰσαὰκ
  choice: Sa pamamagitan ni Isaac
  rationale: Sa siping ito, ang ἐν ay tumutukoy sa linya o paraang daraanan ng ipinangakong lahi, hindi sa lokasyong “kay Isaac.”
- source_word: κληθήσεταί
  choice: tatawagin
  rationale: Malapit ito sa pasibong anyo at saklaw ng καλέω, habang iniiwang bukas ang diwang pagtawag, pagkilala, o pagturing.
- source_word: σοι
  choice: iyong
  rationale: Ang datibo ay natural na naipapahayag bilang pag-aari sa pariralang “iyong lahi.”
- source_word: σπέρμα
  choice: lahi
  rationale: Ipinahahayag ng “lahi” ang kolektibong diwa ng σπέρμα at mas likas sa modernong Tagalog kaysa literal na “binhi” kapag mga inapo ang tinutukoy.
theological_decisions:
- issue: Ang linya ng ipinangakong lahi ni Abraham sa pamamagitan ni Isaac
  choice: Sa pamamagitan ni Isaac tatawagin ang iyong lahi
  alternative: Kay Isaac tatawagin ang iyong binhi
  rationale: Ipinakikita ng pangunahing salin ang kaugnayan ni Isaac sa pagkilala sa ipinangakong lahi nang hindi dinaragdagan ang teksto ng isang tiyak na doktrinal na paliwanag. Inilalagay sa talababa ang mas literal na anyo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “lahi” bilang likas na kolektibong katumbas ng σπέρμα; iniwasan ang mas teknikal na “ibibilang na mga inapo” upang mapanatili ang talinghaga at pag-igting ng orihinal.
