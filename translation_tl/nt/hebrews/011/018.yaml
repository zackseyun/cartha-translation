  naturalness: Mas malinaw at mas natural sa marangal na modernong Tagalog ang “tatawaging iyo ang lahi,” dahil tuwirang ipinahihiwatig nito na ang lahi sa pamamagitan ni Isaac ang kikilalaning kay Abraham. Inililipat din ang tanda ng talababa sa “lahi,” ang salitang tinutukoy ng leksikal na alternatibo.
  terminology: Ang “lahi” ay angkop na kolektibong salin ng σπέρμα sa talatang ito. Ang “binhi” ay maaaring panatilihin sa talababa bilang mas literal na alternatibo. Hindi dapat gamitin ang “Kay Isaac” bilang literal na alternatibo para sa Ἐν Ἰσαὰκ, sapagkat mas maayos na naipahahayag ang idiomang panglinya sa “sa pamamagitan ni Isaac.”
