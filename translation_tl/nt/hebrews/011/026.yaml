  text: μείζονα πλοῦτον ἡγησάμενος τῶν Αἰγύπτου θησαυρῶν τὸν ὀνειδισμὸν τοῦ Χριστοῦ, ἀπέβλεπεν γὰρ εἰς τὴν μισθαποδοσίαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/026.yaml
  text: He considered the reproach of Messiah greater wealth than the treasures of Egypt[b][a], for he was looking to the reward.
translation:
  language: tl
  text: Itinuring niyang mas malaking kayamanan kaysa sa mga kayamanan ng Ehipto ang pag-alipustang kaugnay ng Mesiyas[a][b], sapagkat nakatuon ang kanyang tingin sa gantimpala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Cristo.” Ang Griegong titulong Χριστός ay maaari ring isaling “Cristo”; ginamit dito ang “Mesiyas” dahil gumaganap ito bilang pamagat.
    reason: alternative_reading
  - marker: b
    text: Ang “pag-alipustang kaugnay ng Mesiyas” ay maaaring tumukoy sa pag-alipustang tiniis alang-alang sa Mesiyas, pag-alipustang ibinahagi sa Pinahiran ng Diyos, o pag-alipustang nakikitang natupad sa Mesiyas. Hindi nililimitahan ng salin ang pariralang Griego sa isa lamang sa mga kahulugang ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: μείζονα πλοῦτον
  choice: higit na kayamanan
  rationale: Pinananatili ang paghahambing ng halaga sa mga kayamanan ng Ehipto sa natural na Filipino.
- source_word: ἡγησάμενος
  choice: Itinuring niya
  rationale: Ipinapahayag ang mapanuring paghatol o pagpapahalaga ng ἡγέομαι nang malinaw at natural.
- source_word: τῶν Αἰγύπτου θησαυρῶν
  choice: sa mga kayamanan ng Ehipto
  rationale: Tuwirang inilalahad ang genitibong parirala at pinananatili ang paghahambing.
- source_word: τὸν ὀνειδισμὸν
  choice: ang paghamak
  rationale: Saklaw ng 'paghamak' ang pampublikong pag-alipusta at kahihiyang dinaranas, nang hindi labis na nagpapaliwanag.
- source_word: τοῦ Χριστοῦ
  choice: sa Mesiyas
  rationale: Ginagamit ang 'Mesiyas' sapagkat pamagat ang Χριστός dito; pinananatili ng pariralang 'paghamak sa Mesiyas' ang posibilidad na ang genitibo ay tumutukoy sa paghamak na kaugnay, ibinabahagi, o dinaranas alang-alang sa Mesiyas.
- source_word: ἀπέβλεπεν
  choice: nakatuon ang kanyang tingin sa
  rationale: Ipinahihiwatig ang patuloy na pagtutuon ng imperfect na pandiwa sa natural na idyomang Filipino.
- source_word: μισθαποδοσίαν
  choice: gantimpala
  rationale: Malinaw at karaniwang salin para sa gantimpala o kabayarang ipinagkakaloob.
theological_decisions:
- issue: Kahulugan ng ‘paghamak sa Mesiyas’ kaugnay ni Moises
  choice: Pinanatili ang siksik at hindi ganap na tinukoy na pariralang ‘paghamak sa Mesiyas.’
  alternative: ‘paghamak alang-alang sa Mesiyas,’ ‘paghamak na ibinahagi sa Pinahiran ng Diyos,’ o ‘paghamak na nakikitang natupad sa Mesiyas’
  rationale: Hindi tiyak sa genitibong τοῦ Χριστοῦ ang eksaktong ugnayan. Hindi nililimitahan ng salin ang pahayag sa iisang paliwanag at pinananatili ang kristolohikal na tensiyon ng Hebreo.
- issue: Pagpapakahulugan sa Χριστός bilang pamagat
  choice: Mesiyas
  alternative: Cristo
  rationale: Ang Χριστός ay gumaganap dito bilang teolohikal na pamagat; ang ‘Mesiyas’ ay malinaw na naghahayag ng tungkuling iyon, habang inilalagay sa talababa ang nakaugaliang alternatibo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang ‘itinuring’ at ‘nakatuon ang kanyang tingin’ upang maging natural habang pinananatili ang evaluative at patuloy na aspekto ng orihinal.
