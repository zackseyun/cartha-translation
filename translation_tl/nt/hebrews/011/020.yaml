id: HEB.11.20
reference: Hebrews 11:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Πίστει ⸀καὶ περὶ μελλόντων εὐλόγησεν Ἰσαὰκ τὸν Ἰακὼβ καὶ τὸν Ἠσαῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/020.yaml
  text: By faith Isaac blessed Jacob and Esau, even concerning things to come.
translation:
  language: tl
  text: Dahil sa pananampalataya, pinagpala ni Isaac sina Jacob at Esau tungkol din sa mga bagay na darating.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πίστει
  choice: Dahil sa pananampalataya
  rationale: Ipinahahayag ang batayan o paraan ng pagkilos ni Isaac, gaya ng paulit-ulit na pormula sa kabanata.
- source_word: εὐλόγησεν
  choice: pinagpala
  rationale: Likas at tumpak na katumbas ng pandiwang tumutukoy sa pagbigkas ng pagpapala.
- source_word: περὶ μελλόντων
  choice: tungkol din sa mga bagay na darating
  rationale: Pinananatili ang malawak at bahagyang di-tiyak na pagtukoy sa mga pangyayari o bagay sa hinaharap, nang hindi ito nililimitahan sa isang partikular na katuparan.
- source_word: καὶ
  choice: din
  rationale: 'Ipinakikita ang pandagdag o bahagyang madiing diwa ng καὶ sa posisyong ito: ang pagpapala ay may kinalaman din, o maging, sa mga bagay na darating.'
theological_decisions:
- issue: Saklaw ng mga pagpapala ni Isaac
  choice: Hindi tinukoy kung ano mismo ang “mga bagay na darating.”
  alternative: Tukuyin ang mga ito bilang mga propesiya, pangako, o tiyak na kapalaran ng mga inapo.
  rationale: Malawak ang μελλόντων sa Griyego; ang mas tiyak na pagpapakahulugan ay lalampas sa tahasang sinasabi ng talata.
- issue: Diwa ng καὶ bago ang περὶ μελλόντων
  choice: Isinalin bilang “din” upang mapanatili ang pandagdag o madiing diwa.
  alternative: Alisin sa salin, o gawing “maging.”
  rationale: May tekstuwal na tandang pagkakaiba sa edisyon, ngunit kasama ang καὶ sa ibinigay na SBLGNT text. Ang “din” ay natural sa Tagalog at hindi labis na nagpapalakas sa diin.
translation_notes:
  register: Modernong Filipino Tagalog na simple, marangal, at angkop sa pagbasa ng karaniwang mambabasa. Ginamit ang “sina” para sa dalawang tiyak na taong tuwirang layon; pinanatili ang mga pangalang Isaac, Jacob, at Esau sa karaniwang anyong Filipino.
