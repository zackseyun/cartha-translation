source:
  edition: SBLGNT
  text: Πίστει προσενήνοχεν Ἀβραὰμ τὸν Ἰσαὰκ πειραζόμενος, καὶ τὸν μονογενῆ προσέφερεν ὁ τὰς ἐπαγγελίας ἀναδεξάμενος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/017.yaml
  text: By faith Abraham[a], when he was being tested, offered up Isaac, and the one who had received the promises was offering up his one and only son,
translation:
  language: tl
  text: Sa pamamagitan ng pananampalataya, inihandog ni Abraham si Isaac nang siya ay sinusubok, at ang tumanggap ng mga pangako ay inihahandog ang kanyang natatanging anak[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kaisa-isang anak” o “bugtong na anak.” Binibigyang-diin ng salitang Griyego ang pagiging natatangi ni Isaac.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστει
  choice: Dahil sa pananampalataya
  rationale: Ipinapahayag ng datibo ang paraan o batayan ng pagkilos. Likas sa modernong Tagalog ang pariralang ito at naaangkop sa paulit-ulit na pormula ng kabanata.
- source_word: προσενήνοχεν
  choice: inihandog
  rationale: Bagaman perpektong anyo sa Griyego, ang payak na naganap na aspekto ang natural sa salaysay sa Tagalog; pinananatili ng 'inihandog' ang diwang pansakripisyo.
- source_word: πειραζόμενος
  choice: nang siya ay sinusubok
  rationale: Pinananatili nito ang pasibong kahulugan at ang kasabay na nagaganap na pagsubok. 'Sinusubok' ang angkop, hindi 'tinutukso,' sapagkat pagsubok sa pananampalataya ang konteksto.
- source_word: μονογενῆ
  choice: kaisa-isang anak
  rationale: Ipinahihiwatig ng salita ang pagiging natatangi o walang katulad. Ang 'kaisa-isang anak' ay natural at mariin, habang ipinapaliwanag sa talababa na hindi nito kinakailangang itanggi ang pagkakaroon ni Abraham ng ibang anak.
- source_word: προσέφερεν
  choice: ay naghahandog noon
  rationale: Ang imperpektong anyo ay inilalarawan bilang kilos na isinasagawa noon, kaya napapanatili ang aspektong di-ganap nang hindi nagiging mabigat ang pangungusap.
- source_word: ἀναδεξάμενος
  choice: tumanggap
  rationale: Natural na katambal ng 'mga pangako' at sapat na kumakatawan sa aorist middle participle nang hindi dinaragdagan ang kahulugan.
- source_word: ἐπαγγελίας
  choice: mga pangako
  rationale: Pinananatili ang maramihang bilang ng Griyego at ang karaniwang biblikal na kahulugan.
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang payak na pang-ugnay at ang retorikal na pagdiin ng ikalawang sugnay.
theological_decisions:
- issue: Ang kahulugan ng μονογενῆ para kay Isaac, bagaman may iba pang anak si Abraham
  choice: kaisa-isang anak
  alternative: natatanging anak; bugtong na anak
  rationale: Ipinakikita nito ang natatanging katayuan ni Isaac bilang anak na kaugnay ng mga pangako, nang hindi tahasang nagpapasya na siya lamang ang biyolohikal na anak ni Abraham. Nililinaw ng talababa ang leksikal na saklaw at pinananatili ang tensiyon ng teksto.
- issue: Ang aspektong imperpekto ng προσέφερεν
  choice: ay naghahandog noon
  alternative: inihandog
  rationale: Pinananatili ang tanaw sa kilos bilang isinasagawa sa sandali ng pagsubok, kaiba sa unang pandiwang nagbubuod sa pangyayari.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'inihandog' at 'naghahandog' upang mapanatili ang pansakripisyong diwa at ang pagkakaiba ng aspektong pandiwa. Ang talababa ay nakakabit mismo sa pariralang 'kaisa-isang anak.'
