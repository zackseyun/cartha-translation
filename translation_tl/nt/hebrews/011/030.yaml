  text: By faith the walls of Jericho fell after they had been encircled for seven days[a].
translation:
  language: tl
  text: Sa pananampalataya, bumagsak ang mga pader ng Jerico matapos mapalibutan nang pitong araw.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Sa pamamagitan ng pananampalataya.” Maaaring ipahayag ng datibong Griyego na πίστει ang paraan o kasangkapan.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Dahil sa pananampalataya
  rationale: Ang datibong πίστει ay maaaring magpahayag ng paraan o kasangkapan. Pinananatili ng salin ang paulit-ulit na pormula ng Hebreo 11 sa natural na Tagalog nang hindi labis na nililinaw ang ugnayang sanhi o paraan.
- source_word: τὰ τείχη
  choice: ang mga pader
  rationale: Karaniwang tumutukoy ang τεῖχος sa pader ng isang lungsod; malinaw at likas sa modernong Tagalog ang “mga pader.”
- source_word: Ἰεριχὼ
  choice: ng Jerico
  rationale: Pangalan ito ng lugar at iniuugnay sa mga pader bilang “mga pader ng Jerico.” Ginamit ang nakaugaliang anyong Tagalog na “Jerico.”
- source_word: ἔπεσαν
  choice: bumagsak
  rationale: Tuwirang katumbas ito ng aorist na πίπτω at hindi nagdaragdag ng mas tiyak na ideya gaya ng “gumuho.”
- source_word: κυκλωθέντα
  choice: matapos palibutan ang mga ito
  rationale: 'Ang aorist passive participle ay nagpapahiwatig ng naunang pangyayari: napalibutan muna ang mga pader bago bumagsak. Hindi tahasang idinagdag kung sino ang umikot o pumalibot.'
- source_word: ἐπὶ ἑπτὰ ἡμέρας
  choice: sa loob ng pitong araw
  rationale: Ipinahahayag ng ἐπί na may accusative ang tagal ng panahon; “sa loob ng pitong araw” ang natural na katumbas sa Tagalog.
theological_decisions:
- issue: Pagpapakahulugan sa πίστις sa Hebreo 11:30
  choice: pananampalataya
  alternative: pagtitiwala; katapatan
  rationale: Sa paulit-ulit na pormula ng Hebreo 11, “pananampalataya” ang pinakamalawak at nakaugaliang katumbas. Hindi pinili ang “katapatan,” sapagkat maaaring ilipat nito ang diin sa katangiang moral, at hindi rin nilimitahan sa “pagtitiwala” ang lawak ng πίστις.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang maikli at maindayog na pormula ng Hebreo 11, habang iniwasang idagdag mula sa Josue 6 ang tahasang mga gumaganap na hindi binanggit sa talata.
