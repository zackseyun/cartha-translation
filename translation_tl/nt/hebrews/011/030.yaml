  naturalness: Natural at marangal sa modernong Filipino Tagalog ang “Sa pananampalataya, bumagsak...” at “matapos mapalibutan nang pitong araw.” Ang “nang pitong araw” ay mas tuwirang nagpapahayag ng tagal kaysa “sa loob ng pitong araw,” na maaari ring magpahiwatig ng pagganap anumang oras bago matapos ang nasabing yugto.
  terminology: Ang “pananampalataya,” “mga pader,” “Jerico,” at “bumagsak” ay angkop. Pinananatili ng “Sa pananampalataya” ang maigsi at paulit-ulit na pormula ng Hebreo 11 nang hindi ipinipilit ang sanhi o ang eksaktong paraan.
