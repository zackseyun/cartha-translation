revisions:
- from: Sa pananampalataya, nilisan niya ang Ehipto[a] nang hindi natatakot sa galit ng hari, sapagkat nanatili siyang matatag, na para bang nakikita niya ang Hindi Nakikita.[b]
  to: Sa pananampalataya, nilisan niya ang Ehipto[a] nang hindi natakot sa galit ng hari, sapagkat nagtiyaga siya na parang nakikita niya ang Hindi Nakikita.[b]
  rationale: Pinalitan ang mas maluwag na “nanatili siyang matatag” ng “nagtiyaga siya” upang mas tumpak na maipahayag ang ἐκαρτέρησεν, at ginawang “nang hindi natakot” upang mas malapit sa aorist participle na μὴ φοβηθεὶς. Inayos din ang unang alternatibong salin sa talababa upang maging likas na Filipino. Hindi binago ang sinadyang hindi pagtukoy kung aling pag-alis mula sa Ehipto ang tinutukoy.
