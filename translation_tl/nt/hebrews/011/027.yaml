    issue: Ang “nanatili siyang matatag” ay hindi kasing-tiyak ng ἐκαρτέρησεν.
    rationale: Ang καρτερέω ay tumutukoy sa matiyagang pagtitiis o pagpapatuloy. Ang “nagtiyaga siya” ay mas tuwiran at natural, nang hindi nagdaragdag ng kahulugan.
  - severity: low
    issue: Ang “nang hindi natatakot” ay aspektuwal na mas nagpapatuloy kaysa sa aorist na φοβηθεὶς.
    rationale: Bagaman katanggap-tanggap ang draft, ang “nang hindi natakot” ay mas maikli at mas malapit sa buod na aorist na kilos sa Griyego.
