  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πίστει κατέλιπεν Αἴγυπτον, μὴ φοβηθεὶς τὸν θυμὸν τοῦ βασιλέως, τὸν γὰρ ἀόρατον ὡς ὁρῶν ἐκαρτέρησεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/027.yaml
  text: By faith he left Egypt[a], not fearing the king’s anger[b], for he endured as seeing the One who is invisible.
translation:
  language: tl
  text: Sa pananampalataya, nilisan niya ang Ehipto[a] nang hindi natakot sa galit ng hari, sapagkat nagtiyaga siya na parang nakikita niya ang Hindi Nakikita.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring tumukoy ito sa pagtakas ni Moises mula sa Ehipto (Exodo 2) o sa paglabas niya kasama ng Israel (Exodo 12–14); hindi tinutukoy ng Griyegong pananalita kung alin sa dalawang pangyayari ang nasa isip.
    reason: cross_reference
  - marker: b
    text: Maaari ring isalin na “ang Isa na hindi nakikita” o “ang Di-nakikita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Sa pananampalataya
  rationale: Pinananatili ang instrumental o modal na diwa ng datibo at ang paulit-ulit na hulma ng Hebreo 11 tungkol sa mga gawang nagmumula sa pananampalataya.
- source_word: κατέλιπεν
  choice: nilisan niya
  rationale: Likas at tuwirang salin ng pag-alis sa isang lugar; hindi nito ipinahihiwatig ang mas matinding diwa ng lubusang pag-abandona.
- source_word: Αἴγυπτον
  choice: ang Ehipto
  rationale: Karaniwang makabagong Tagalog na pangalan ng lugar.
- source_word: μὴ φοβηθεὶς
  choice: nang hindi natatakot
  rationale: Ipinakikita ang kasabay na kalagayan o paraan ng pangunahing kilos habang nananatiling natural sa Tagalog.
- source_word: τὸν θυμὸν τοῦ βασιλέως
  choice: sa galit ng hari
  rationale: Ang θυμός ay matinding galit, ngunit sapat at hindi labis ang karaniwang salitang “galit” sa kontekstong ito.
- source_word: τὸν ἀόρατον
  choice: ang Hindi Nakikita
  rationale: Ang pang-uri ay may pantukoy at ginagamit bilang pangngalan para sa isang personal na tinutukoy. Hindi idinaragdag sa teksto ang pangalang “Diyos,” bagaman malinaw ang personal na diwa.
- source_word: ὡς ὁρῶν
  choice: na para bang nakikita niya
  rationale: Pinananatili ang paghahambing na ipinahihiwatig ng ὡς at ang sadyang kabalintunaan ng pagkakita sa Hindi Nakikita.
- source_word: ἐκαρτέρησεν
  choice: nanatili siyang matatag
  rationale: Ipinahahayag ang matibay na pagtitiis at pagpapatuloy na saklaw ng καρτερέω, nang hindi nililimitahan ito sa basta pagdurusa lamang.
theological_decisions:
- issue: Aling pag-alis ni Moises sa Ehipto ang tinutukoy
  choice: Hindi tinutukoy sa salin kung ito ang pagtakas ni Moises o ang paglabas niya kasama ng Israel.
  alternative: Tahasang iugnay ang talata sa Exodo 2 o sa Exodo 12–14.
  rationale: “Nilisan niya ang Ehipto” lamang ang sinasabi ng Griyego. Dahil maaaring tumukoy ito sa alinman sa dalawang pangyayari, pinananatili ng pangunahing teksto ang hindi pagtiyak ng pinagmulan.
- issue: Pagpapakilala sa τὸν ἀόρατον
  choice: ang Hindi Nakikita
  alternative: ang Diyos na hindi nakikita
  rationale: Personal ang substantibong pang-uri, ngunit wala sa mismong parirala ang pangngalang “Diyos.” Pinananatili ng salin ang malinaw na personal na pagtukoy nang hindi nagdaragdag ng tahasang pangngalan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nilisan” at “nanatili siyang matatag” upang maging natural sa karaniwang mambabasa habang napapanatili ang diin at kabalintunaan ng Griyego.
