  text: By faith Moses[a], when he had grown up, refused to be called the son of Pharaoh’s daughter,
translation:
  language: tl
  text: Sa pananampalataya[a], si Moises, nang nasa hustong gulang na siya, ay tumangging tawaging anak ng anak na babae ni Faraon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “sa katapatan” o “sa pagtitiwala.” Griyego: πίστει. Sinusunod dito ang paulit-ulit na pormula ng kabanata, “Sa pananampalataya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Dahil sa pananampalataya
  rationale: Instrumental na datibo ito at bahagi ng paulit-ulit na pormula sa Hebreo 11. Likas sa modernong Tagalog ang “dahil sa pananampalataya” upang ipahayag na ang pagkilos ay bunga at udyok ng pananampalataya.
- source_word: Μωϋσῆς
  choice: Moises
  rationale: Karaniwang anyo ng pangalang ito sa Tagalog.
- source_word: μέγας γενόμενος
  choice: nang nasa hustong gulang na
  rationale: Sa konteksto, tumutukoy ang parirala sa pag-abot sa sapat na gulang, hindi sa pagiging dakila o mataas ang katayuan.
- source_word: ἠρνήσατο
  choice: tumanggi
  rationale: Ipinapahayag ng pandiwa ang sinadyang pagtanggi sa isang katawagan o pagkakakilanlan.
- source_word: λέγεσθαι
  choice: tawaging
  rationale: Tuwirang ipinapahayag ang pasibong pawatas na “to be called” sa natural na Tagalog.
- source_word: υἱὸς θυγατρὸς Φαραώ
  choice: anak ng anak na babae ng Faraon
  rationale: Pinananatili ang tiyak na relasyong pampamilya at ang pagkakakilanlang maharlika na tinanggihan ni Moises.
- source_word: Φαραώ
  choice: Faraon
  rationale: Karaniwang anyo ng titulo sa Tagalog na salin ng Bibliya.
theological_decisions:
- issue: Kahulugan ng πίστις sa paulit-ulit na pormula ng Hebreo 11
  choice: pananampalataya
  alternative: katapatan; pagtitiwala
  rationale: Ang konteksto ng kabanata ay nakatuon sa mga kilos na ginawa dahil sa pananampalataya. Gayunman, maaaring saklawin ng salitang Griyego ang katapatan o pagtitiwala, kaya itinatala ang mga ito sa talababa nang hindi ipinapalit sa pangunahing salin.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “nasa hustong gulang” sa halip na literal na “naging dakila” upang ihatid ang idiomatikong kahulugan ng Griyego. Inilagay ang talababa pagkatapos ng buong sugnay upang hindi maputol ang daloy ng talata.
