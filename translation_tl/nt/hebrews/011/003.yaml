id: HEB.11.3
reference: Hebrews 11:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πίστει νοοῦμεν κατηρτίσθαι τοὺς αἰῶνας ῥήματι θεοῦ, εἰς τὸ μὴ ἐκ φαινομένων ⸂τὸ βλεπόμενον⸃ γεγονέναι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/003.yaml
  text: By faith we understand that the ages were framed by the word of God[a], so that what is seen did not come into being from things that are visible.
translation:
  language: tl
  text: Sa pananampalataya, nauunawaan natin na ang mga kapanahunan[a] ay binuo sa pamamagitan ng salita ng Diyos, kaya ang nakikita ay hindi nagmula sa mga bagay na nakikita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga sanlibutan” o “sansinukob.” Sa Griyego, “mga kapanahunan,” na maaaring tumukoy sa kaayusan ng sanlibutan sa buong takbo ng panahon.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Sa pananampalataya
  rationale: Ipinahahayag ng datibong anyo ang paraan o kasangkapan; pinananatili rin nito ang paulit-ulit na pormula ng kabanata.
- source_word: νοοῦμεν
  choice: nauunawaan natin
  rationale: Tumutukoy ito sa pag-unawa ng isip, hindi lamang sa pagkilala sa pamamagitan ng pandama.
- source_word: κατηρτίσθαι
  choice: ay binuo
  rationale: Ipinahahayag ng perpektong pasibong pawatas na ang mga kapanahunan ay naihanda at naisaayos bilang isang buo; natural sa Tagalog ang “binuo” nang hindi tahasang nililimitahan ang pahayag sa paglikha ng materya.
- source_word: τοὺς αἰῶνας
  choice: ang mga kapanahunan
  rationale: Pinananatili nito ang literal na temporal na diwa ng αἰῶνες at ang posibleng mas malawak na pagtukoy sa kaayusan ng sanlibutan sa paglipas ng panahon; inilalahad sa talababa ang mga alternatibo.
- source_word: ῥήματι θεοῦ
  choice: sa pamamagitan ng salita ng Diyos
  rationale: Ang datibo ay instrumental, at ang “salita” ay natural na katumbas ng ῥῆμα bilang ipinahayag o binigkas na salita.
- source_word: εἰς τὸ μὴ ... γεγονέναι
  choice: kaya ... ay hindi nagmula
  rationale: Natural na ipinahahayag ng “kaya” ang resulta, samantalang ang “hindi nagmula” ay malinaw na naghahatid ng ideya ng hindi pag-iral mula sa binanggit na pinagmulan.
- source_word: ἐκ φαινομένων
  choice: mula sa mga bagay na nakikita
  rationale: Tuwirang pinananatili ang sanggunian sa mga bagay na nakikita o lumilitaw.
- source_word: τὸ βλεπόμενον
  choice: ang nakikita
  rationale: Likas na kolektibong pananalita ito sa Tagalog para sa substantival participle na tumutukoy sa nakikitang kaayusan.
theological_decisions:
- issue: Saklaw ng αἰῶνες kaugnay ng paglikha
  choice: mga kapanahunan
  alternative: mga sanlibutan; sansinukob
  rationale: Maaaring saklawin ng αἰῶνες ang kaayusan ng sanlibutan sa buong panahon, hindi lamang ang pisikal na kosmos. Pinananatili ng salin ang temporal at kosmikong lawak ng salita nang hindi ito pinakikitid.
- issue: Pahiwatig tungkol sa paglikha mula sa hindi nakikitang realidad
  choice: Hindi tahasang idinagdag ang “mula sa wala.”
  alternative: Tahasan itong isalin bilang paglikha mula sa wala.
  rationale: Sinasabi ng Griyego na ang nakikita ay hindi nagmula sa mga bagay na nakikita. Kaayon ito ng paglikha mula sa wala, ngunit hindi dapat palawakin ng salin ang tahasang sinasabi ng talata.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang “mga kapanahunan” upang maipakita ang tunay na lawak at kalabuan ng αἰῶνες, habang ipinaliliwanag sa talababa ang mas karaniwang kosmikong mga pagbasa.
