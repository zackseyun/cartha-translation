  source_fidelity: 'Tapat ang salin sa pangunahing daloy ng Griyego: ang πίστει ay naipahayag bilang paraan ng pag-unawa; ang νοοῦμεν bilang pag-unawa; ang perpektong pasibong κατηρτίσθαι bilang pagkakabuo ng mga αἰῶνες sa pamamagitan ng salita ng Diyos; at ang huling sugnay ay maingat na nagsasabing ang nakikita ay hindi nagmula sa mga bagay na nakikita. Hindi nito idinaragdag ang mas malawak na doktrina ng paglikha “mula sa wala.”'
  naturalness: Natural at marangal ang modernong Filipino Tagalog. Ang “Sa pananampalataya” ay angkop na maigsi at paulit-ulit na pormula sa konteksto ng Hebreo 11. Bagaman may sinadyang abstraksiyon ang “mga kapanahunan,” malinaw ang pangungusap at tinutulungan ito ng talababa.
  terminology: Wasto ang “pananampalataya,” “salita ng Diyos,” at “mga kapanahunan.” Ang talababa ay sapat na nag-iingat sa malawak na saklaw ng αἰῶνες sa pamamagitan ng pagbibigay ng “mga sanlibutan” at “sansinukob” bilang mga alternatibo. Ang “ang nakikita” at “mga bagay na nakikita” ay wastong nagpapanatili ng magkaugnay ngunit magkaibang mga participle sa Griyego.
