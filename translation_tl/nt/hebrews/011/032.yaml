  text: Καὶ τί ἔτι λέγω; ἐπιλείψει ⸂με γὰρ⸃ διηγούμενον ὁ χρόνος περὶ Γεδεών, Βαράκ, ⸀Σαμψών, Ἰεφθάε, Δαυίδ τε καὶ Σαμουὴλ καὶ τῶν προφητῶν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/032.yaml
  text: And what more shall I say? For time would fail me if I were telling about Gideon[a], Barak, Samson, Jephthah, David, and also Samuel and the prophets,
translation:
  language: tl
  text: Ano pa ang sasabihin ko? Sapagkat hindi sasapat sa akin ang oras kung ikukuwento ko pa ang tungkol kina Gideon, Barak, Samson, Jefta, David, at Samuel, pati na sa mga propeta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ τί ἔτι λέγω;
  choice: Ano pa ang sasabihin ko?
  rationale: Likas na retorikal na tanong sa modernong Tagalog; pinananatili nito ang puwersa ng paglipat sa iba pang mga halimbawa.
- source_word: ἐπιλείψει με γὰρ ὁ χρόνος
  choice: Sapagkat hindi sasapat ang oras
  rationale: Natural na katumbas sa Tagalog ng larawang mauubusan o kukulangin ng panahon ang nagsasalita; pinananatili ng “Sapagkat” ang paliwanag na hatid ng γάρ.
- source_word: διηγούμενον
  choice: kung ikukuwento ko pa
  rationale: Ipinahahayag ang nagpapatuloy at di-ganap na kalagayan ng participle sa malinaw na kondisyunal na Tagalog. Ang “pa” ay natural na nag-uugnay sa naunang tanong tungkol sa pagsasabi ng higit pa.
- source_word: περὶ
  choice: ang tungkol kina … pati ang tungkol kay … at sa
  rationale: Ang “tungkol” ang karaniwang modernong pananda ng paksa; inangkop ang mga pananda sa mga pangalang pantangi at sa pangkat ng mga propeta.
- source_word: Γεδεών, Βαράκ, Σαμψών, Ἰεφθάε, Δαυίδ, Σαμουὴλ
  choice: Gideon, Barak, Samson, Jefta, David, Samuel
  rationale: Ginamit ang mga anyo ng pangalan na nakasanayan sa mga saling Tagalog at madaling makilala ng ordinaryong mambabasa.
- source_word: τε καὶ
  choice: pati
  rationale: Inilalarawan ang bahagyang pandagdag na diin sa pagkakaugnay kay David, Samuel, at sa kasunod na pangkat nang hindi nagpapasok ng bagong pagpapakahulugan.
- source_word: τῶν προφητῶν
  choice: sa mga propeta
  rationale: Tuwirang tumutukoy sa pangkat ng mga propeta; ang “mga” ang likas na panandang pangmaramihan sa Tagalog.
theological_decisions:
- issue: Retorikal na diwa ng pagkaubos ng oras
  choice: “hindi sasapat ang oras kung ikukuwento ko pa” bilang retorikal na pahayag ng limitadong oras
  alternative: 'Mas literal na hinaharap: “kukulangin ako ng oras habang isinasalaysay ko”'
  rationale: Ipinahihiwatig ng konstruksiyong Griyego na paiikliin ng may-akda ang paglalahad, hindi na literal na wala na siyang anumang oras. Pinananatili ng salin ang tungkuling retorikal nang walang idinaragdag na aral.
- issue: Pagkakaugnay ng mga huling pangalan
  choice: “David, pati ang tungkol kay Samuel at sa mga propeta”
  alternative: “David, Samuel, at sa mga propeta”
  rationale: Pinananatili ng “pati” ang pandagdag na himig ng τε καὶ at hindi ipinapaloob si Samuel sa pangkalahatang pangkat ng mga propeta o iginigiit na hiwalay siya rito sa teolohikal na diwa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “ikukuwento” sa halip na mas pormal na “isinasalaysay” sa pangunahing teksto para sa likas na daloy, samantalang inilagay sa talababa ang mas literal na anyo.
