  naturalness: Marangal at natural ang pangunahing register. Mas madulas at mas malinaw sa modernong Tagalog ang isang “tungkol kina” na sumasaklaw sa lahat ng pinangalanan, na may “pati na” upang maipakita ang pandagdag na diin.
  terminology: Ang Gideon, Barak, Samson, Jefta, David, Samuel, at mga propeta ay mga nakikilalang anyo sa Tagalog. Ang “mga propeta” ay wastong katumbas ng τῶν προφητῶν.
