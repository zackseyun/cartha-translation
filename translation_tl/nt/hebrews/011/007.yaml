id: HEB.11.7
reference: Hebrews 11:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πίστει χρηματισθεὶς Νῶε περὶ τῶν μηδέπω βλεπομένων εὐλαβηθεὶς κατεσκεύασεν κιβωτὸν εἰς σωτηρίαν τοῦ οἴκου αὐτοῦ, δι’ ἧς κατέκρινεν τὸν κόσμον, καὶ τῆς κατὰ πίστιν δικαιοσύνης ἐγένετο κληρονόμος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/007.yaml
  text: By faith Noah[a], having been warned about things not yet seen, in reverent fear constructed an ark for the salvation of his household[d][c][b], through which he condemned the world and became heir of the righteousness according to faith.
translation:
  language: tl
  text: Dahil sa pananampalataya, si Noe ay matapos mabigyan ng babala[a] tungkol sa mga bagay na hindi pa nakikita, dahil sa mapitagang takot[b] ay gumawa ng isang arka upang mailigtas ang kanyang sambahayan. Sa pamamagitan nito[c], hinatulan niya ang sanlibutan at naging tagapagmana ng katuwiran[d] ayon sa pananampalataya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “matapos tumanggap ng banal na tagubilin” o “matapos tumanggap ng banal na babala.”'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “nang may paggalang” o “naudyukan ng takot sa Diyos.”'
    reason: lexical_alternative
  - marker: c
    text: Ang “nito” ay pinakamalamang na tumutukoy sa arka; inuunawa naman ito ng ilan nang mas malawak bilang pananampalataya o masunuring pagtugon ni Noe.
    reason: alternative_reading
  - marker: d
    text: Maaari ring “katarungan,” ngunit sa kontekstong ito ay higit na angkop ang “katuwiran” na kaugnay ng pananampalataya.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Dahil sa pananampalataya
  rationale: Ipinapahayag ang pananampalataya bilang batayan o paraang nag-udyok sa kilos ni Noe, at pinananatili ang paulit-ulit na hulma ng Hebreo 11.
- source_word: χρηματισθεὶς
  choice: matapos tumanggap ng babala
  rationale: Ang pasibong pandiwa ay tumutukoy sa pagtanggap ng isang banal na pahayag o babala. Hindi tahasang pinangalanan sa pangunahing teksto ang Diyos bilang pinagmulan upang hindi dagdagan ang anyong Griyego.
- source_word: περὶ τῶν μηδέπω βλεπομένων
  choice: tungkol sa mga bagay na hindi pa nakikita
  rationale: Pinananatili ang temporal na diwa ng μηδέπω at ang pagiging hindi pa nakikita ng mga darating na pangyayari.
- source_word: εὐλαβηθεὶς
  choice: kumilos nang may banal na paggalang
  rationale: Ipinakikita ang mapitagang pagtugon ni Noe, hindi lamang karaniwang takot, at natural itong nag-uugnay sa paggawa niya ng arka.
- source_word: κατεσκεύασεν
  choice: gumawa
  rationale: Likas at malinaw sa modernong Tagalog bilang paglalarawan sa sadyang pagbuo ng arka; mas magaan kaysa 'nagtayo' o teknikal na 'bumuo'.
- source_word: κιβωτὸν
  choice: isang arka
  rationale: Ang 'arka' ang nakagawiang at tumpak na katawagan sa sasakyang ginawa ni Noe.
- source_word: εἰς σωτηρίαν τοῦ οἴκου αὐτοῦ
  choice: upang mailigtas ang kanyang sambahayan
  rationale: Ipinahahayag ang layunin ng pagliligtas at pinananatili ng 'sambahayan' ang mas malawak na saklaw ng οἶκος kaysa sa 'pamilya' lamang.
- source_word: δι’ ἧς
  choice: Sa pamamagitan nito
  rationale: Ang pambabaeng panghalip sa Griyego ay pinakamalapit na tumutukoy sa κιβωτός, ang arka, habang hindi lubusang isinasara ang mas malawak na kaugnayan sa tugon ng pananampalataya.
- source_word: κατέκρινεν τὸν κόσμον
  choice: hinatulan niya ang sanlibutan
  rationale: Tuwirang salin na nagpapakitang ang masunuring pananampalataya ni Noe ay nagsilbing patotoong humahatol sa sanlibutan.
- source_word: τῆς κατὰ πίστιν δικαιοσύνης
  choice: ng katuwirang ayon sa pananampalataya
  rationale: Pinananatili ang estruktura at teolohikal na tensiyon ng κατά, sa halip na gawing tiyak na 'sa pamamagitan ng' pananampalataya.
- source_word: ἐγένετο κληρονόμος
  choice: naging tagapagmana
  rationale: Natural at malinaw na katumbas ng pagpasok ni Noe sa katayuan bilang tagapagmana.
theological_decisions:
- issue: Diwa ng χρηματισθεὶς at ang hindi tahasang pinangalanang pinagmulan
  choice: matapos tumanggap ng babala
  alternative: matapos turuan ng Diyos; matapos tumanggap ng banal na babala
  rationale: Ipinahihiwatig ng pandiwa ang banal na komunikasyon, ngunit hindi tahasang nasa Griyego ang 'Diyos'; kaya inilalagay sa talababa ang posibilidad nang hindi dinaragdagan ang pangunahing teksto.
- issue: Diwa ng εὐλαβηθεὶς
  choice: kumilos nang may banal na paggalang
  alternative: dahil sa mapitagang takot; palibhasa'y natakot sa Diyos
  rationale: Pinagsasama nito ang paggalang, pag-iingat, at relihiyosong pagtugon nang hindi ito pinapantay sa sindak lamang.
- issue: Tinutukoy ng δι’ ἧς
  choice: ang arka
  alternative: ang pananampalataya o masunuring pagtugon ni Noe
  rationale: Ang pinakamalapit at kaayon-sa-kasariang antecedent ay κιβωτός, ngunit pinananatili sa talababa ang mas malawak na pagbasa.
- issue: Kahulugan ng δικαιοσύνη
  choice: katuwiran
  alternative: katarungan
  rationale: Sa konteksto ng pagiging tagapagmana at pananampalataya, higit na angkop ang relasyonal at teolohikal na 'katuwiran,' bagaman lehitimong kahulugan din sa ibang konteksto ang 'katarungan'.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang 'sambahayan' upang saklawin ang οἶκος, 'sanlibutan' para sa κόσμος sa kontekstong teolohikal, at 'katuwiran' bilang nakagawiang salin ng δικαιοσύνη. Inilagay ang bawat marker kaagad sa bahaging tinutukoy nito.
