  to: Dahil sa pananampalataya, si Noe ay matapos mabigyan ng babala[a] tungkol sa mga bagay na hindi pa nakikita, dahil sa mapitagang takot[b] ay gumawa ng isang arka upang mailigtas ang kanyang sambahayan. Sa pamamagitan nito[c], hinatulan niya ang sanlibutan at naging tagapagmana ng katuwiran[d] ayon sa pananampalataya.
  rationale: Pinalitan ang maluwag na "kumilos nang may banal na paggalang" ng mas tuwiran at natural na "dahil sa mapitagang takot," na mas malapit sa εὐλαβηθεὶς. Inayos ang mga footnote anchor upang malinaw na tumukoy sa babala, mapitagang takot, panghalip na "nito," at katuwiran. Hindi binago ang kahulugan ng talata o ipinasok sa pangunahing teksto ang hindi tahasang pinangalanang banal na pinagmulan ng babala.
