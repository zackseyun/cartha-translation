revisions:
- from: 'Sa pananampalataya, naghandog si Abel sa Diyos ng mas mainam na hain kaysa kay Cain[a]. Sa pamamagitan ng hain na ito, pinatotohanang matuwid siya[b], sapagkat nagpatotoo ang Diyos tungkol sa kanyang mga handog. At sa pamamagitan nito[c], bagaman namatay na siya, nagsasalita pa rin siya.


    [a] Maaari ring “mas malaking hain.” Ang paghahambing sa Griyego ay maaaring tumukoy sa pagiging mas mainam o sa pagiging mas malaki.

    [b] Maaari ring “kinilalang matuwid siya.” Ang pandiwa ay tumutukoy sa pagtanggap niya ng patotoo.

    [c] Ang “nito” ay maaaring tumukoy sa pananampalataya ni Abel o sa kanyang hain; hindi ito lubos na nililinaw ng Griyego.'
  to: 'Dahil sa pananampalataya, naghandog si Abel sa Diyos ng mas mainam na hain kaysa kay Cain[a]. Sa pamamagitan ng haing ito, nakatanggap siya ng patotoo na siya ay matuwid[b], sapagkat nagpatotoo ang Diyos tungkol sa kanyang mga handog. At sa pamamagitan nito[c], bagaman namatay na siya, nagsasalita pa rin siya.


    [a] Maaari ring “mas malaking hain.” Ang paghahambing sa Griyego ay maaaring tumukoy sa pagiging mas mainam o sa pagiging mas malaki.


    [b] Maaari ring “pinatotohanang siya ay matuwid” o “kinilalang matuwid siya.”


    [c] Ang “nito” ay maaaring tumukoy sa pananampalataya ni Abel o sa kanyang hain; hindi ito lubos na nililinaw ng Griyego.'
  rationale: Pinalitan ang hindi gaanong malinaw na “pinatotohanang matuwid siya” ng “nakatanggap siya ng patotoo na siya ay matuwid.” Pinananatili nito ang pasibong ἐμαρτυρήθη, ang bokabularyo ng patotoo, at ang predikasyong “matuwid,” habang mas likas at malinaw sa modernong Tagalog. Ang huling “sa pamamagitan nito” at ang talababa nito ay hindi binago upang mapanatili ang kalabuan ng Griyego.
