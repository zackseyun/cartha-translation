id: HEB.11.4
reference: Hebrews 11:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Πίστει πλείονα θυσίαν Ἅβελ παρὰ Κάϊν προσήνεγκεν τῷ θεῷ, δι’ ἧς ἐμαρτυρήθη εἶναι δίκαιος, μαρτυροῦντος ἐπὶ τοῖς δώροις αὐτοῦ ⸂τοῦ θεοῦ⸃, καὶ δι’ αὐτῆς ἀποθανὼν ἔτι ⸀λαλεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/004.yaml
  text: By faith Abel offered to God a better sacrifice than Cain[a], through which he was attested as righteous, God testifying concerning his gifts; and through it, though he died[d][c][b], he still speaks.
translation:
  language: tl
  text: 'Dahil sa pananampalataya, naghandog si Abel sa Diyos ng mas mainam na hain kaysa kay Cain[a]. Sa pamamagitan ng haing ito, nakatanggap siya ng patotoo na siya ay matuwid[b], sapagkat nagpatotoo ang Diyos tungkol sa kanyang mga handog. At sa pamamagitan nito[c], bagaman namatay na siya, nagsasalita pa rin siya.


    [a] Maaari ring “mas malaking hain.” Ang paghahambing sa Griyego ay maaaring tumukoy sa pagiging mas mainam o sa pagiging mas malaki.


    [b] Maaari ring “pinatotohanang siya ay matuwid” o “kinilalang matuwid siya.”


    [c] Ang “nito” ay maaaring tumukoy sa pananampalataya ni Abel o sa kanyang hain; hindi ito lubos na nililinaw ng Griyego.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mas malaking hain.” Ang paghahambing sa Griyego ay maaaring tumukoy sa pagiging mas mainam o sa pagiging mas malaki.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “pinatotohanang siya ay matuwid” o “kinilalang matuwid siya.”
    reason: lexical_alternative
  - marker: c
    text: Ang “nito” ay maaaring tumukoy sa pananampalataya ni Abel o sa kanyang hain; hindi ito lubos na nililinaw ng Griyego.
    reason: alternative_reading
lexical_decisions:
- source_word: Πίστει
  choice: Sa pananampalataya
  rationale: Instrumental ang datibo at ito rin ang paulit-ulit na balangkas ng Hebreo 11. Likas at maikli sa Tagalog ang “Sa pananampalataya.”
- source_word: πλείονα θυσίαν
  choice: mas mainam na hain
  rationale: Maaaring mangahulugan ang συγκριτική na anyo ng “mas mainam” o “mas malaki.” Ang “mas mainam” ay angkop sa paghahambing sa konteksto nang hindi idinaragdag ang mas interpretatibong “mas katanggap-tanggap.”
- source_word: παρὰ Κάϊν
  choice: kaysa kay Cain
  rationale: Ang παρά kasunod ng pahambing ay nagtatakda ng batayan ng paghahambing; natural itong ipinahahayag sa Tagalog sa pamamagitan ng “kaysa kay.”
- source_word: προσήνεγκεν τῷ θεῷ
  choice: naghandog ... sa Diyos
  rationale: Ang προσφέρω ay pandiwang pangkulto na likas isaling “maghandog” sa konteksto ng hain.
- source_word: δι’ ἧς
  choice: Sa pamamagitan ng hain na ito
  rationale: Ang pambabaeng panghalip na ἧς ay pinakanatural na tumutukoy sa θυσίαν, “hain.” Ginawang tahas sa Tagalog upang maging malinaw ang ugnayang gramatikal.
- source_word: ἐμαρτυρήθη εἶναι δίκαιος
  choice: pinatotohanang matuwid siya
  rationale: Pinananatili nito ang diwa ng patotoo sa μαρτυρέω at natural na ipinahahayag ang predikatibong “matuwid” sa Tagalog.
- source_word: μαρτυροῦντος ἐπὶ τοῖς δώροις αὐτοῦ τοῦ θεοῦ
  choice: sapagkat nagpatotoo ang Diyos tungkol sa kanyang mga handog
  rationale: Ang genitive absolute ay ginawang sugnay na nagpapaliwanag. Ang δῶρα ay isinaling “mga handog” dahil sakripisyal ang konteksto.
- source_word: δι’ αὐτῆς
  choice: sa pamamagitan nito
  rationale: Hindi tinukoy ang tinutukoy ng panghalip upang mapanatili ang posibilidad na pananampalataya o hain ang tinutukoy.
- source_word: ἀποθανὼν ἔτι λαλεῖ
  choice: bagaman namatay na siya, nagsasalita pa rin siya
  rationale: Ipinahahayag ng “bagaman” ang likas na pagsalungat sa pagitan ng kanyang kamatayan at patuloy na pagsasalita; pinananatili ng “pa rin” ang nagpapatuloy na diwa ng ἔτι λαλεῖ.
theological_decisions:
- issue: Tinutukoy ng δι’ αὐτῆς sa huling sugnay
  choice: 'Hindi nilinaw sa pangunahing teksto: “sa pamamagitan nito”'
  alternative: “sa pamamagitan ng pananampalatayang ito” o “sa pamamagitan ng haing ito”
  rationale: Maaaring tumukoy ang pambabaeng panghalip sa pananampalataya, na paksa ng kabanata, o sa hain, na mas malapit na pambabaeng antecedent. Pinananatili ng salin at talababa ang tunay na kalabuan.
- issue: Diwa ng ἐμαρτυρήθη
  choice: “pinatotohanang matuwid siya”
  alternative: “kinilalang matuwid siya”
  rationale: Pinananatili ng piniling salin ang mahalagang bokabularyo ng pagpapatotoo sa Hebreo 11 at hindi ito pinapaliit tungo lamang sa pagsang-ayon o pagpuri.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “hain,” “handog,” “matuwid,” at “pananampalataya” bilang pamilyar at angkop na bokabularyong biblikal. Iniwasan ang sobrang literal na ayos ng Griyego at pinanatili ang kalabuan sa huling panghalip.
