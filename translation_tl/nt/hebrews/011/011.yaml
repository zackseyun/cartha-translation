id: HEB.11.11
reference: Hebrews 11:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πίστει καὶ ⸂αὐτῇ Σάρρᾳ⸃ δύναμιν εἰς καταβολὴν σπέρματος ἔλαβεν καὶ παρὰ καιρὸν ⸀ἡλικίας, ἐπεὶ πιστὸν ἡγήσατο τὸν ἐπαγγειλάμενον·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/011.yaml
  text: By faith even Sarah herself received power to conceive offspring[a], even beyond the proper time of life, because she considered the one who had promised to be faithful.
translation:
  language: tl
  text: Sa pamamagitan ng pananampalataya, maging si Sara mismo ay tumanggap ng kakayahang maglihi[a], kahit lampas na siya sa edad ng panganganak, sapagkat itinuring niyang tapat ang nangako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “para sa paglalagak ng binhi.” Di-karaniwan at idyomatiko ang pananalitang Griyego; sa konteksto, tumutukoy ito sa kakayahang magkaroon ng supling.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Sa pananampalataya
  rationale: Instrumental na datibo at paulit-ulit na pormula sa Hebreo 11; natural at malinaw sa makabagong Tagalog.
- source_word: καὶ αὐτῇ Σάρρᾳ
  choice: maging si Sara mismo
  rationale: Pinananatili ang pagbibigay-diin ng καὶ at ng intensive pronoun αὐτῇ kay Sara bilang karagdagang kapansin-pansing halimbawa.
- source_word: δύναμιν ... ἔλαβεν
  choice: tumanggap ng kakayahan
  rationale: Tuwirang sinasalamin ang ‘received power/ability’ ngunit ang ‘kakayahan’ ay mas likas kaysa ‘kapangyarihan’ sa konteksto ng paglilihi.
- source_word: εἰς καταβολὴν σπέρματος
  choice: maglihi ng supling
  rationale: Ang parirala ay di-karaniwan at idyomatiko. Dahil si Sara ang paksa, ipinahahayag nito nang natural ang kakayahang magkaroon ng anak; inilalagay sa talababa ang mas literal na anyo.
- source_word: καὶ παρὰ καιρὸν ἡλικίας
  choice: kahit lampas na siya sa angkop na panahon ng buhay
  rationale: Ipinapakita ng παρὰ ang paglampas sa karaniwang hangganan at ng καιρός ang angkop na panahon, nang hindi labis na pinipinid ang kahulugan.
- source_word: ἐπεὶ
  choice: sapagkat
  rationale: Malinaw na naghahayag ng dahilan at angkop sa marangal na rehistro.
- source_word: πιστὸν
  choice: tapat
  rationale: Pinananatili ang teolohikal na bigat ng pagiging mapanghahawakan ng Diyos nang hindi nagdaragdag ng doktrina.
- source_word: ἡγήσατο
  choice: itinuring
  rationale: Natural na katumbas ng mapagsuring paghatol o pagkilala sa isang katangian.
- source_word: τὸν ἐπαγγειλάμενον
  choice: ang nangako
  rationale: Maikli, likas, at tapat sa substantival participle; malinaw sa konteksto na tumutukoy sa Diyos.
theological_decisions:
- issue: Paksa at diwa ng kilos ni Sara sa isang sintaktikong mahirap na sugnay
  choice: 'Si Sara ang paksa: tumanggap siya ng kakayahang maglihi ng supling.'
  alternative: Maaaring unawain na sangkot o pangunahing tinutukoy si Abraham sa literal na ‘paglalagak ng binhi,’ o na binigyan si Sara ng kakayahang magtatag ng angkan.
  rationale: Sa ibinigay na anyo ng tekstong Griyego, ang αὐτῇ Σάρρᾳ ay pinakanatural na tumutukoy kay Sara bilang paksa ng ἔλαβεν. Gayunman, pinananatili sa talababa ang kakaibang literal na pahayag upang hindi maitago ang tunay na kahirapang leksikal.
- issue: Kahulugan ng πιστός bilang paglalarawan sa Diyos
  choice: tapat
  alternative: mapagkakatiwalaan; maaasahan
  rationale: Ibinabatay ng talata ang pananampalataya ni Sara sa matatag na katangian ng nangako. Ang ‘tapat’ ang may pinakamalapit na teolohikal at relasyonal na bigat.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang ‘maglihi ng supling’ para sa natural na pagpapahayag habang ang mas literal at sintaktikong mahirap na parirala ay pinanatili sa talababa.
