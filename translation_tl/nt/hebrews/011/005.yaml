base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/005.yaml
  text: By faith Enoch was taken away so that he should not see death[a], and he was not found because God had taken him away. For before his being taken away, he had been commended as having pleased God[c][b],
translation:
  language: tl
  text: Dahil sa pananampalataya, inilipat si Enoc upang hindi niya maranasan ang kamatayan[a], at hindi siya natagpuan sapagkat inilipat siya ng Diyos. Sapagkat bago siya inilipat, nakatanggap siya ng patotoo na nakalugod siya sa Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “makita ang kamatayan,” isang idyomang Griyego na nangangahulugang “maranasan ang kamatayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστει
  choice: Dahil sa pananampalataya
  rationale: Ipinahahayag ng datibong Πίστει ang pananampalataya bilang batayan o paraan ng nangyari kay Enoc. Ang pariralang ito ay likas sa modernong Tagalog at naaayon sa paulit-ulit na hulma ng Hebreo 11.
- source_word: μετετέθη / μετέθηκεν / μεταθέσεως
  choice: inilipat / inilipat / bago siya inilipat
  rationale: Pinananatili ang iisang salitang-ugat para sa magkakaugnay na anyo ng μετατίθημι at μετάθεσις. Ang “inilipat” ay hindi nagdaragdag ng pook o mekanismo na hindi tahasang sinasabi ng talata, at pinananatili rin nito ang banal na pagkilos bilang sanhi.
- source_word: τοῦ μὴ ἰδεῖν θάνατον
  choice: upang hindi siya makakita ng kamatayan
  rationale: Pinananatili ang idyomang Griyego na “makakita ng kamatayan,” habang ang “upang” ay likas na nagpapahayag ng layunin o kinalabasan ng articular infinitive.
- source_word: οὐχ ηὑρίσκετο
  choice: hindi siya natagpuan
  rationale: Tuwirang pinananatili ang diwang pasibo at hindi tinutukoy kung sino ang naghanap sa kanya, gaya rin ng Griyego.
- source_word: μεμαρτύρηται
  choice: pinatotohanan
  rationale: Pinananatili ang pasibong diwa ng μαρτυρέω nang hindi nililimitahan ito sa mas interpretibong “pinuri.” Sa konteksto, ang patotoo ay tungkol sa pagiging kalugod-lugod niya sa Diyos.
- source_word: εὐαρεστηκέναι τῷ θεῷ
  choice: na nakalugod siya sa Diyos
  rationale: Likas na Tagalog ito para sa perfect infinitive at malinaw na ipinakikitang ang pagkalugod ng Diyos ay nauna sa paglilipat kay Enoc.
theological_decisions:
- issue: Kahulugan ng paglilipat kay Enoc
  choice: “inilipat” nang hindi idinaragdag kung saan siya dinala o kung paano ito nangyari
  alternative: “dinala sa langit” o “kinuha ng Diyos”
  rationale: Sinasabi ng talata na inilipat siya ng Diyos upang hindi makakita ng kamatayan, ngunit hindi nito tahasang inilalarawan ang hantungan o mekanismo. Iniiwasan ng salin ang pagdaragdag ng paliwanag na wala sa mismong talata.
- issue: Diwa ng “makakita ng kamatayan”
  choice: Panatilihin ang idyomang “makakita ng kamatayan” sa pangunahing teksto
  alternative: “makaranas ng kamatayan” o “mamatay”
  rationale: Nauunawaan sa Tagalog ang idyoma at napapanatili nito ang anyo at biblikal na himig ng Griyego; nililinaw sa talababa ang kahulugang idyomatiko.
- issue: Diwa ng patotoo tungkol kay Enoc
  choice: “pinatotohanan na nakalugod siya sa Diyos”
  alternative: “pinuri siya dahil pinalugod niya ang Diyos”
  rationale: Pinananatili nito ang pasibong patotoo at ang ugnayan sa Diyos nang hindi ipinapalagay kung ang patotoo ay eksklusibong banal, kasulatan, o kapwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang paulit-ulit na “inilipat” upang masalamin ang pag-uulit ng magkakaugnay na salitang Griyego. Iniwasan ang mas lumang “isinalin” at ang dagdag na paliwanag na “dinala sa langit.”
