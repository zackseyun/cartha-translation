base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/006.yaml
  text: And without faith it is impossible to please him[c][b][a], for the one who comes to God must believe that he exists and that he is a rewarder of those who diligently seek him.
translation:
  language: tl
  text: At kung walang pananampalataya, imposibleng maging kalugud-lugod sa Diyos,[a] sapagkat ang lumalapit sa Diyos ay dapat maniwala na siya ay umiiral[b] at na siya ay nagbibigay ng gantimpala sa mga masikap na humahanap sa kanya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “imposibleng makalugod sa kanya.” Hindi hayag sa Griyego ang layon ng “makalugod,” ngunit ang Diyos ang tinutukoy sa agarang konteksto.
    reason: lexical_alternative
  - marker: b
    text: 'Mas literal: “na siya ay.” Maikli ang Griyego at maaaring tumukoy sa pag-iral ng Diyos.'
    reason: lexical_alternative
  - marker: c
    text: O “na siya ay tagapagbigay ng gantimpala” o “na pinatutunayan niyang siya ay tagapagbigay ng gantimpala.” Ginagamit sa Griyego ang salitang karaniwang nangangahulugang “nagiging,” ngunit dito ay inilalarawan kung ano ang Diyos para sa mga humahanap sa kanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς δὲ πίστεως
  choice: At kung walang pananampalataya
  rationale: Ipinahahayag ng χωρίς ang kawalan o pagkahiwalay, samantalang banayad na pang-ugnay ang δέ. Likas sa daloy ng Tagalog ang “At kung walang,” at ang “pananampalataya” ang angkop dito dahil ipinaliliwanag agad ng talata ang paniniwala sa Diyos.
- source_word: ἀδύνατον εὐαρεστῆσαι
  choice: imposibleng kalugdan siya
  rationale: Pinananatili nito ang impersonal na puwersa ng ἀδύνατον at ang diwa ng εὐαρεστέω na maging kalugod-lugod sa isang tao. Ang “siya” ay tumutukoy sa Diyos ayon sa agarang konteksto.
- source_word: πιστεῦσαι γὰρ δεῖ
  choice: sapagkat ... ay dapat maniwala
  rationale: Ang γάρ ay nagbibigay ng dahilan at ang δεῖ ay nagsasaad ng pangangailangan; malinaw at natural ang “dapat maniwala” sa makabagong Tagalog.
- source_word: τὸν προσερχόμενον τῷ θεῷ
  choice: ang lumalapit sa Diyos
  rationale: Tuwirang inilalarawan ng present participle ang taong lumalapit sa Diyos; pinananatili ng saling ito ang relational at posibleng panrelihiyong pahiwatig nang hindi ito dinaragdagan.
- source_word: ὅτι ἔστιν
  choice: na siya ay tunay na umiiral
  rationale: Pinahahayag ng maikling parirala ang realidad o pag-iral ng Diyos. Idinagdag ang “tunay” upang maging likas at malinaw sa Tagalog, hindi upang magdagdag ng hiwalay na teolohikong pahayag.
- source_word: τοῖς ἐκζητοῦσιν αὐτὸν
  choice: ang mga masikap na humahanap sa kanya
  rationale: Masidhi ang ἐκζητέω kaysa sa payak na “maghanap”; ipinakikita ng “masikap” ang intensibong diwa nito nang hindi lumalabis.
- source_word: μισθαποδότης γίνεται
  choice: ginagantimpalaan niya
  rationale: Ang μισθαποδότης ay isang nagbibigay ng gantimpala, at sa ganitong predicative construction ang γίνεται ay maaaring magpahayag ng kung ano ang Diyos para sa mga humahanap sa kanya. Ang pandiwang Tagalog ay natural at hindi nagpapahiwatig na nagbago ang likas ng Diyos.
theological_decisions:
- issue: Kahulugan ng πίστις sa kontekstong mahalaga sa teolohiya
  choice: pananampalataya
  alternative: pagtitiwala; katapatan
  rationale: Ang kasunod na πιστεῦσαι ay nagpapakitang ang tinutukoy rito ay paniniwala o pagtitiwala sa Diyos. Gayunman, pinananatili ng “pananampalataya” ang kinikilalang pangunahing termino at hindi nito nilulutas nang labis ang buong saklaw ng πίστις.
- issue: Puwersa ng γίνεται kaugnay ng Diyos bilang μισθαποδότης
  choice: ginagantimpalaan niya
  alternative: siya ay tagapagbigay ng gantimpala; pinatutunayan niyang siya ay tagapagbigay ng gantimpala
  rationale: Hindi kailangang unawain ang γίνεται bilang pagbabago sa likas ng Diyos. Sa konteksto, ipinahahayag nito kung ano siya o kung paano siya napapatunayang kumikilos para sa mga humahanap sa kanya; pinananatili ito ng natural na pandiwang Tagalog.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kalugdan” bilang pamilyar ngunit dignified na salitang biblikal; iniwasan ang sobrang teknikal o denominasyonal na pananalita. Inilagay ang mga talababa sa mismong mga pariralang nililinaw ng mga ito.
