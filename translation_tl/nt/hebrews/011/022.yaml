id: HEB.11.22
reference: Hebrews 11:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πίστει Ἰωσὴφ τελευτῶν περὶ τῆς ἐξόδου τῶν υἱῶν Ἰσραὴλ ἐμνημόνευσεν, καὶ περὶ τῶν ὀστέων αὐτοῦ ἐνετείλατο.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/022.yaml
  text: By faith Joseph, as he was nearing the end of his life, mentioned the exodus of the sons of Israel and gave instructions concerning his bones.
translation:
  language: tl
  text: Dahil sa pananampalataya, nang malapit nang mamatay si Jose,[a] binanggit niya ang pag-alis[b] ng mga anak ni Israel at nagbilin tungkol sa kanyang mga buto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nang siya ay naghihingalo.”
    reason: lexical_alternative
  - marker: b
    text: Tumutukoy sa paglabas ng mga anak ni Israel mula sa Ehipto.
    reason: clarification
lexical_decisions:
- source_word: πίστει
  choice: Dahil sa pananampalataya
  rationale: Pinananatili ang paulit-ulit na pormula ng Hebreo 11 at ipinapakita ang pananampalataya bilang batayan ng ginawa ni Jose.
- source_word: τελευτῶν
  choice: nang malapit nang mamatay
  rationale: Likas sa modernong Tagalog at tumpak na nagpapahayag na nagbilin si Jose sa pagtatapos ng kanyang buhay; ang mas tuwirang alternatibo ay nasa talababa.
- source_word: περὶ τῆς ἐξόδου
  choice: ang pag-alis
  rationale: Tuwirang ipinahahayag ang paglabas o pag-alis ng Israel mula sa Ehipto nang hindi umaasa sa hiram na terminong teknikal.
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: ng mga anak ni Israel
  rationale: Pinananatili ang tahasang pampamilyang pananalita ng Griyego sa natural na Tagalog.
- source_word: ἐμνημόνευσεν
  choice: binanggit niya
  rationale: Sa pagkakagamit na may περὶ, tumutukoy ito sa pagbanggit o pagsasalita tungkol sa isang bagay, hindi lamang sa pag-alaala sa isip.
- source_word: ἐνετείλατο
  choice: nagbilin
  rationale: Natural na Tagalog para sa pagbibigay ng tiyak na tagubilin, lalo na sa konteksto ng nalalapit na kamatayan.
- source_word: περὶ τῶν ὀστέων αὐτοῦ
  choice: tungkol sa kanyang mga buto
  rationale: Pinananatili ang kongkretong salitang 'mga buto' at ang alusyon sa utos ni Jose na dalhin ang mga ito mula sa Ehipto.
theological_decisions:
- issue: Kahulugan ng πίστις sa Hebreo 11
  choice: pananampalataya
  alternative: pagtitiwala; katapatan
  rationale: Ang pormulang paulit-ulit sa kabanata ay tumutukoy sa pananampalatayang nag-udyok sa kilos ng mga ninuno. Hindi hinihingi ng konteksto rito ang kahulugang 'katapatan.'
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “nagbilin” bilang likas na katumbas ng pagbibigay ng tagubilin sa harap ng kamatayan, at pinanatili ang “mga buto” sa halip na gawing pangkalahatang “mga labi.”
