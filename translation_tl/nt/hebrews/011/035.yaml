  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἔλαβον γυναῖκες ἐξ ἀναστάσεως τοὺς νεκροὺς αὐτῶν· ἄλλοι δὲ ἐτυμπανίσθησαν, οὐ προσδεξάμενοι τὴν ἀπολύτρωσιν, ἵνα κρείττονος ἀναστάσεως τύχωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/035.yaml
  text: Women received back their dead by resurrection[a]; but others were tortured, not accepting release[c][b], so that they might obtain a better resurrection.
translation:
  language: tl
  text: Tinanggap muli ng mga babae ang kanilang mga namatay dahil muling nabuhay ang mga ito.[a] Ngunit ang iba ay pinahirapan nang matindi[b] at tumangging tanggapin ang paglaya,[c] upang makamit nila ang isang mas mabuting muling pagkabuhay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa unang bahagi ng talata, ang mga namatay ay ibinalik sa kasalukuyang buhay; inihahambing ito sa “mas mabuting muling pagkabuhay” sa hulihan ng talata.
    reason: cross_reference
  - marker: b
    text: Ang pandiwang Griego ay tumutukoy sa matinding pagpapahirap at maaaring kaugnay ng pambubugbog sa isang balangkas o kasangkapang tulad ng tambol; hindi tiyak ang eksaktong pamamaraan.
    reason: cultural_note
  - marker: c
    text: Maaari ring isalin ang “paglaya” bilang “pagkaligtas.” Dito, tumutukoy ito sa pagpapalaya mula sa pagpapahirap o kamatayan, at hindi kinakailangang sa pagtubos sa teolohikal na diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλαβον
  choice: tinanggap muli
  rationale: Ipinahihiwatig ng konteksto na naibalik sa mga babae ang kanilang mga namatay, kaya kailangan ang “muli,” hindi lamang “tinanggap.”
- source_word: γυναῖκες
  choice: mga babae
  rationale: Hindi tahasang nililimitahan ng salita ang tinutukoy sa mga asawa; “mga babae” ang mas malawak at likas na kahulugan.
- source_word: ἐξ ἀναστάσεως
  choice: dahil muling nabuhay ang mga ito
  rationale: Likas itong Filipino at ipinapahayag ang muling pagkabuhay bilang dahilan kung bakit naibalik sa mga babae ang kanilang mga namatay.
- source_word: τοὺς νεκροὺς αὐτῶν
  choice: ang kanilang mga namatay
  rationale: Karaniwang paraan ito sa Filipino upang tukuyin ang mga yumao nilang mahal sa buhay nang hindi nagdaragdag ng ugnayang hindi tahasang binanggit.
- source_word: ἄλλοι δὲ
  choice: Ngunit ang iba
  rationale: Malinaw na ipinakikita ng “ngunit” ang paglipat mula sa mga nakaranas ng pagpapanumbalik tungo sa mga nagtiis hanggang kamatayan.
- source_word: ἐτυμπανίσθησαν
  choice: pinahirapan nang matindi
  rationale: Tiyak ang matinding pagpapahirap ngunit hindi tiyak ang eksaktong kasangkapan o pamamaraan, kaya iniiwasang magdagdag ng di-napatunayang detalye.
- source_word: οὐ προσδεξάμενοι
  choice: tumangging tanggapin
  rationale: Ipinapakita ng parirala ang kusang pagtanggi sa iniaalok, hindi lamang ang hindi pagkakatanggap nito.
- source_word: τὴν ἀπολύτρωσιν
  choice: ang paglaya
  rationale: Sa konteksto, ito ay paglaya mula sa pagpapahirap o kamatayan; hindi kinakailangang tumukoy sa teolohikal na pagtubos.
- source_word: ἵνα
  choice: upang
  rationale: Pinananatili nito ang layuning ipinahahayag ng sugnay.
- source_word: κρείττονος ἀναστάσεως
  choice: isang mas mabuting muling pagkabuhay
  rationale: Pinananatili ng “mas mabuti” ang paghahambing sa naunang pagbabalik sa buhay nang hindi labis na ipinapaliwanag ang kalikasan nito.
- source_word: τύχωσιν
  choice: makamit nila
  rationale: Ang “makamit” ay natural na katumbas ng pag-abot o pagtatamo sa inaasahang muling pagkabuhay.
theological_decisions:
- issue: Kahulugan ng ἀπολύτρωσιν sa konteksto
  choice: pansamantalang paglaya mula sa pagpapahirap o kamatayan
  alternative: pagtubos sa malawak na teolohikal na diwa
  rationale: Ang agarang konteksto ay tungkol sa mga tapat na tumanggi sa iniaalok na pagtakas. Ang “paglaya” ay nagpapanatili sa diwa ng salaysay nang hindi ipinapasok ang isang tiyak na doktrina ng kaligtasan.
- issue: Diwa ng “mas mabuting muling pagkabuhay”
  choice: muling pagkabuhay na nakahihigit sa pansamantalang pagbabalik sa mortal na buhay
  alternative: isang higit na kanais-nais na muling pagkabuhay na walang tahasang paghahambing sa unang bahagi ng talata
  rationale: Ang magkatapat na bahagi ng talata ay likas na naghahambing sa mga muling binuhay ngunit mamamatay pa rin at sa pag-asang hinangad ng mga nagtiis hanggang kamatayan. Hindi na nililinaw pa ng salin ang mga detalyeng hindi tahasang sinasabi ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pinahirapan nang matindi” upang maging madaling maunawaan nang hindi nagpapalagay ng tiyak na paraan ng pagpapahirap. Ang pag-uulit ng diwa ng “muling pagkabuhay” ay pinananatili upang marinig ang mahalagang paghahambing sa loob ng talata.
