  text: Πίστει διέβησαν τὴν Ἐρυθρὰν Θάλασσαν ὡς διὰ ξηρᾶς ⸀γῆς, ἧς πεῖραν λαβόντες οἱ Αἰγύπτιοι κατεπόθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/029.yaml
  text: By faith they crossed the Red Sea as through dry land[a], of which the Egyptians, when they attempted it, were swallowed up.
translation:
  language: tl
  text: Sa pananampalataya, tumawid sila sa Dagat na Pula[a] na para bang dumaraan sa tuyong lupa. Ngunit nang tangkain din itong tawirin ng mga Ehipsiyo, nilamon sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “Dagat ng mga Tambo.” “Dagat na Pula” ang nasa tekstong Griyego rito (Ἐρυθρὰν Θάλασσαν), ngunit ang pinagbabatayang pangalan ng lugar sa Hebreo sa Exodo ay maaari ring isaling “Dagat ng mga Tambo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστει
  choice: Dahil sa pananampalataya
  rationale: Ang datibo ay nagpapahayag ng paraan o batayan. Pinananatili ng “pananampalataya” ang paulit-ulit at tematikong pormula ng Hebreo 11.
- source_word: διέβησαν
  choice: tumawid sila
  rationale: Likas at tuwirang Filipino para sa pagtawid mula sa isang panig tungo sa kabila.
- source_word: τὴν Ἐρυθρὰν Θάλασσαν
  choice: sa Dagat na Pula
  rationale: Ito ang tahasang tawag sa dagat sa tekstong Griyego; ang kaugnayan nito sa “Dagat ng mga Tambo” ay inilagay sa talababa.
- source_word: ὡς διὰ ξηρᾶς γῆς
  choice: na para bang tuyong lupa
  rationale: Pinananatili ang paghahambing na ipinahihiwatig ng ὡς at ang larawan ng pagdaan sa tuyong lupa.
- source_word: πεῖραν λαβόντες
  choice: nang tangkain din iyon
  rationale: Ang idyomang Griyego ay nangangahulugang sumubok o nagtangkang gawin ang gayon ding pagtawid. Ang “din” ay natural na naghahayag ng pagkakatulad ng pagtatangka.
- source_word: οἱ Αἰγύπτιοι
  choice: ang mga Ehipsiyo
  rationale: Karaniwang modernong Filipino na katawagan sa mga taga-Ehipto na humabol sa salaysay ng Exodo.
- source_word: κατεπόθησαν
  choice: nilamon sila ng dagat
  rationale: Pinananatili ang matingkad na larawan ng καταπίνω, “lunukin,” habang nililinaw sa natural na Filipino ang dagat bilang ipinahihiwatig na lumamon sa kanila.
theological_decisions:
- issue: Pagsasalin ng πίστις sa Hebreo 11
  choice: pananampalataya
  alternative: pagtitiwala; katapatan
  rationale: Ang paulit-ulit na Πίστει ang pangunahing pormula ng kabanata. Sa kontekstong ito, “pananampalataya” ang pinakanababagay at hindi kailangang piliin ang mas makitid na “pagtitiwala” o ang posibleng ngunit di-angkop dito na “katapatan.”
- issue: Sanhi o paraan sa Πίστει
  choice: Dahil sa pananampalataya
  alternative: Sa pamamagitan ng pananampalataya
  rationale: Ang datibo ay maaaring ilarawan bilang paraan o batayan. Ang “Dahil sa pananampalataya” ay natural sa Filipino at hindi nagpapasya nang higit sa kayang sabihin ng konteksto.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “Dagat na Pula” bilang nakaugaliang pangalan at pinanatili sa “nilamon” ang masiglang talinghaga ng Griyego.
