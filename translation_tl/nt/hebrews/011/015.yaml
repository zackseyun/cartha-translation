  text: καὶ εἰ μὲν ἐκείνης ⸀μνημονεύουσιν ἀφ’ ἧς ⸀ἐξέβησαν, εἶχον ἂν καιρὸν ἀνακάμψαι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/015.yaml
  text: And if they had been remembering that land from which they had gone out[a], they would have had opportunity to return.
translation:
  language: tl
  text: At kung patuloy nilang inaalala ang lupaing kanilang nilisan[a], may pagkakataon sana silang bumalik.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang bayang iyon” o “ang tinubuang-bayang iyon.” Tinutukoy ng Griyego ang makalupang lugar na kanilang nilisan.
    reason: lexical_alternative
lexical_decisions:
- source_word: μνημονεύουσιν
  choice: patuloy nilang inaalala
  rationale: Ipinahahayag ng pangkasalukuyang anyo sa kondisyong salungat sa katotohanan ang patuloy na pag-iisip o pag-alala. Natural ito sa Tagalog at hindi nito nililimitahan ang diwa sa pananabik lamang.
- source_word: ἐκείνης
  choice: ang lupaing iyon
  rationale: Tumutukoy ang pambabaeng demonstratibo sa naunang binanggit na makalupang bayan o lupain. Ang “lupain” ay konkreto at hindi labis na politikal ang dating.
- source_word: ἀφ’ ἧς ἐξέβησαν
  choice: na kanilang pinanggalingan
  rationale: Natural na ipinahahayag sa Tagalog ang lugar na kanilang nilisan. Bagaman hindi literal na inuulit ang larawang “lumabas,” napapanatili ang ugnayan sa dating lupain nang hindi nagiging alanganin ang pangungusap.
- source_word: εἶχον ἂν
  choice: nagkaroon sana sila
  rationale: Ang imperfect na may ἄν ay apodosis ng kondisyong salungat sa katotohanan; malinaw itong tinutumbasan ng hulaping “sana” sa Tagalog.
- source_word: καιρὸν
  choice: pagkakataon
  rationale: Dito ang καιρός ay ang angkop na pagkakataon o posibilidad, hindi lamang haba ng panahon.
- source_word: ἀνακάμψαι
  choice: bumalik
  rationale: Maikli at natural na katumbas ng pagbabalik sa dating pinanggalingan.
- source_word: καὶ εἰ μὲν
  choice: At kung
  rationale: Pinananatili nito ang kaugnayan sa naunang pahayag. Hindi kailangang tumbasan nang hiwalay ang μέν sapagkat pang-istruktura lamang ang gamit nito rito.
theological_decisions:
- issue: Ang tinutukoy na dating bayan o lupain
  choice: Isang literal na makalupang lupain na kanilang nilisan
  alternative: Ang dating paraan ng pamumuhay sa pangkalahatan
  rationale: Sa Hebreo 11:13–16, ang dating makalupang pinagmulan ng mga patriyarka ay ipinantatapat sa mas mabuti at makalangit na bayan. Pinananatili ng salin ang konkretong heograpikong diwa at hindi ito ginagawang alegorya.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lupain” upang mapanatili ang konkretong larawan ng dating lugar, at ang “patuloy nilang inaalala” upang ipakita ang nagpapatuloy na pagtuon ng isip sa kondisyong salungat sa katotohanan.
