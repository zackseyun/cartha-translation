  text: πίστει πεποίηκεν τὸ πάσχα καὶ τὴν πρόσχυσιν τοῦ αἵματος, ἵνα μὴ ὁ ὀλοθρεύων τὰ πρωτότοκα θίγῃ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/028.yaml
  text: By faith he has kept the Passover and the sprinkling of the blood[a], so that the destroyer of the firstborn might not touch them.
translation:
  language: tl
  text: Sa pamamagitan ng pananampalataya, ipinagdiwang niya ang Paskuwa at isinagawa ang paglalagay ng dugo[a], upang hindi galawin ng tagapuksa ang kanilang mga panganay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagwiwisik ng dugo.” Ang salitang Griyego ay tumutukoy sa ritwal na paglalagay ng dugo. Tradisyonal ang “pagwiwisik,” ngunit maaaring mas tiyak sa pangyayari ng Paskuwa ang “paglalagay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Dahil sa pananampalataya
  rationale: Ipinahahayag ang instrumental na diwa ng datibo at pinananatili ang paulit-ulit na pormula ng Hebreo 11 sa natural na Tagalog.
- source_word: πεποίηκεν
  choice: ipinagdiwang niya
  rationale: Sa kontekstong ritwal, ang ποιέω kasama ng πάσχα ay tumutukoy sa pagsasagawa o pagdiriwang ng Paskuwa. Natural ito sa Tagalog nang hindi nililimitahan sa pagkain lamang.
- source_word: τὸ πάσχα
  choice: ang Paskuwa
  rationale: Sapat na malawak upang tumukoy sa buong pagdiriwang o ritwal, hindi lamang sa hapunan.
- source_word: τὴν πρόσχυσιν τοῦ αἵματος
  choice: ipinalagay ang dugo
  rationale: Ang πρόσχυσις ay ritwal na paglalagay o pagbubuhos ng dugo. Sa konteksto ng Exodo 12, mas angkop ang 'ipinalagay' kaysa 'iwisik,' sapagkat inilagay ang dugo sa hamba at itaas ng pintuan; pinananatili sa talababa ang tradisyonal na alternatibo.
- source_word: ἵνα μὴ
  choice: upang hindi
  rationale: Direkta at natural na pagpapahayag ng layuning ipinakikita ng ἵνα na may μή.
- source_word: ὁ ὀλοθρεύων
  choice: ang tagapuksa
  rationale: Isinasalin ang substantivized participle nang hindi idinaragdag ang 'anghel,' na hindi tahasang nasa Griyego.
- source_word: τὰ πρωτότοκα
  choice: ang kanilang mga panganay
  rationale: Ang 'mga panganay' ay likas at malawak na katumbas ng substantivized neuter plural, nang hindi nililimitahan sa 'mga anak' lamang.
- source_word: θίγῃ
  choice: galawin
  rationale: Pinananatili ang literal na diwa ng 'humipo/gumalaw' at ang alusyon sa salaysay ng Exodo, sa halip na tahasang gawing 'patayin' o 'saktan.'
- source_word: αὐτῶν
  choice: kanilang
  rationale: Iniuugnay nang natural sa 'mga panganay' ang maikling panghalip na tumutukoy sa mga kasama ni Moises, nang hindi tahasang idinaragdag ang 'mga Israelita.'
theological_decisions:
- issue: Pagkakakilanlan ng di-tahasang simuno ng πεποίηκεν
  choice: Pinanatili ang panghalip na 'niya'; si Moises ang tinutukoy ayon sa konteksto.
  alternative: Tahasan itong gawing 'ipinagdiwang ni Moises.'
  rationale: Si Moises ang paksa sa nakapaligid na konteksto, ngunit panghalip lamang ang nasa Griyego; pinananatili nito ang anyo at daloy ng teksto.
- issue: Kahulugan ng πίστις
  choice: pananampalataya
  alternative: pagtitiwala; katapatan
  rationale: Ang pangunahing tema ng Hebreo 11 ay pananampalataya. Hindi hinihingi ng konteksto rito ang mas tiyak na 'katapatan.'
- issue: Pagkakakilanlan ng ὁ ὀλοθρεύων
  choice: tagapuksa
  alternative: anghel na tagapuksa
  rationale: Hindi tahasang tinatawag na anghel sa Griyego ang tagapuksa, kaya iniiwasang ipasok ang interpretasyong iyon sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'Paskuwa' bilang karaniwang terminong biblikal at ang 'tagapuksa' upang maiwasan ang pagdaragdag ng pagkakakilanlang hindi tahasang nasa teksto.
