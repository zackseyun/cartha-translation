  yaml_path: translation/nt/hebrews/011/002.yaml
  text: For by this the elders received approval[a][b][c].
translation:
  language: tl
  text: Sapagkat sa pamamagitan nito[a] ay tumanggap ng mabuting patotoo[b] ang mga sinaunang tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibig sabihin, sa pamamagitan ng pananampalataya, gaya ng inilalarawan sa naunang talata.
    reason: cross_reference
  - marker: b
    text: O “pinuri” o “pinatotohanan.” Ang pandiwang Griyego ay tumutukoy sa pagtanggap ng mabuting patotoo o pagkilala sa kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταύτῃ
  choice: sa pamamagitan nito
  rationale: Ang ἐν ay may instrumental na diwa rito, at ang pambabaeng panghalip na ταύτῃ ay likas na tumutukoy pabalik sa πίστις (pananampalataya) sa talata 1. Pinananatili ng “nito” ang pabalik na pagtukoy nang hindi inuulit ang salita.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Nagbibigay ang γάρ ng paliwanag o batayan para sa naunang pahayag. Likas at malinaw sa Filipino ang “Sapagkat” sa ganitong ugnayan.
- source_word: ἐμαρτυρήθησαν
  choice: tumanggap ng mabuting patotoo
  rationale: Ang aorist passive ng μαρτυρέω ay nagsasaad na sila ay pinatotohanan nang mabuti o kinilalang kalugod-lugod. Pinananatili ng parirala ang larawan ng patotoo at ang pasibong diwa nang hindi tahasang idinaragdag sa pangunahing teksto kung sino ang nagpatotoo.
- source_word: οἱ πρεσβύτεροι
  choice: ang mga sinaunang tao
  rationale: Sa konteksto, hindi ito tumutukoy sa tungkuling “mga elder” kundi sa mga taong nabuhay noong unang panahon na ilalahad sa kabanata. Ang “mga sinaunang tao” ay tumpak at hindi denominasyonal.
theological_decisions:
- issue: Ang tinutukoy ng ταύτῃ
  choice: Pinanatili bilang “nito,” na tumutukoy sa pananampalataya sa talata 1.
  alternative: Tahasang isalin na “sa pamamagitan ng pananampalataya.”
  rationale: Ang pambabaeng anyo ay kaayon ng πίστις, ngunit ang panghalip sa pangunahing teksto ay mas malapit sa anyo ng Griyego at hindi labis na nilulutas ang posibleng mas malawak na pagtukoy sa katotohanang inilarawan sa talata 1.
- issue: Pinagmumulan ng mabuting patotoo
  choice: Hindi tahasang idinagdag ang “mula sa Diyos” sa pangunahing teksto.
  alternative: “kinilala ng Diyos” o “tumanggap ng pagsang-ayon ng Diyos.”
  rationale: Ipinahihiwatig ng mas malawak na konteksto na Diyos ang nagbibigay ng patotoo, ngunit hindi siya tahasang binanggit sa sugnay na ito. Pinananatili ng salin ang pagka-passive at ang teolohikal na pahiwatig nang walang dagdag sa teksto.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang “mga sinaunang tao” sa halip na “mga matatanda” upang maiwasan ang maling pagkaunawa na edad o isang tungkulin sa pamayanan ang tinutukoy. Ang “mabuting patotoo” ay bahagyang pormal ngunit malinaw at pinananatili ang mahalagang salitang-ugat ng Griyego.
