  text: πίστει παρῴκησεν εἰς γῆν τῆς ἐπαγγελίας ὡς ἀλλοτρίαν, ἐν σκηναῖς κατοικήσας μετὰ Ἰσαὰκ καὶ Ἰακὼβ τῶν συγκληρονόμων τῆς ἐπαγγελίας τῆς αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/009.yaml
  text: By faith he lived as a foreigner in the land of promise[a], as in a foreign land, dwelling in tents with Isaac and Jacob, fellow heirs of the same promise.
translation:
  language: tl
  text: Sa pamamagitan ng pananampalataya, namuhay siya bilang dayuhan sa lupaing ipinangako[a], na parang lupain iyon ng iba. Tumira siya sa mga tolda kasama nina Isaac at Jacob, na mga kapwa tagapagmana ng iisang pangako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Sa pamamagitan ng pananampalataya, pansamantala siyang nanirahan sa lupaing ipinangako na parang lupain iyon ng iba.”'
    reason: 'Pinananatili ang alternatibong paraan ng paglalahad sa παρῴκησεν at ὡς ἀλλοτρίαν: pansamantalang paninirahan sa lupain na itinuturing na banyaga o pag-aari ng iba.'
lexical_decisions:
- source_word: πίστει
  choice: Dahil sa pananampalataya
  rationale: Ang datibo ay nagpapahayag ng paraan o batayan. Ang pariralang ito ay natural sa modernong Tagalog at umaayon sa paulit-ulit na diin ng Hebreo 11 sa pananampalataya.
- source_word: παρῴκησεν
  choice: namuhay siyang dayuhan
  rationale: Ipinahihiwatig ng pandiwa ang paninirahan bilang hindi katutubo o hindi tunay na may-ari ng lugar, hindi lamang ang pansamantalang pagtigil doon.
- source_word: εἰς γῆν τῆς ἐπαγγελίας
  choice: sa lupaing ipinangako
  rationale: Bagaman karaniwang may diwang 'patungo sa' ang εἰς, ginagamit din ito sa lokasyon kasunod ng pandiwa ng paninirahan. Ang 'lupaing ipinangako' ay malinaw at likas na Tagalog para sa lupaing kaugnay ng pangako ng Diyos.
- source_word: ὡς ἀλλοτρίαν
  choice: na para bang lupain iyon ng iba
  rationale: Ang ἀλλότριος ay maaaring mangahulugang pag-aari ng iba o banyaga. Pinananatili ng salin ang paghahambing na ipinakilala ng ὡς at ang diwang hindi pa niya pag-aari ang lupain.
- source_word: ἐν σκηναῖς κατοικήσας
  choice: Tumira siya sa mga tolda
  rationale: Inilalarawan ng participle ang paraan ng pamumuhay niya roon. Pinananatili ng salin ang konkretong larawan ng pansamantala at hindi permanenteng tirahan.
- source_word: μετὰ Ἰσαὰκ καὶ Ἰακώβ
  choice: kasama nina Isaac at Jacob
  rationale: Tuwirang ipinapahayag ng μετά na kasama niya sina Isaac at Jacob; natural sa Tagalog ang pang-ukol na 'nina' para sa mga pangalang pantangi.
- source_word: τῶν συγκληρονόμων
  choice: na kapwa niya tagapagmana
  rationale: Ipinahihiwatig ng salita ang sama-samang pagtanggap ng mana. Malinaw na ipinakikita ng 'kapwa niya tagapagmana' na kabahagi ni Abraham sina Isaac at Jacob.
- source_word: τῆς ἐπαγγελίας τῆς αὐτῆς
  choice: ng pangako ring iyon
  rationale: Ipinakikita ng αὐτῆς na iisa ang pangakong minana nila. Likas sa Tagalog ang 'pangako ring iyon' at napapanatili nito ang diin sa parehong pangako.
theological_decisions:
- issue: Tinutukoy ng di-binanggit na simuno
  choice: Si Abraham ang tinutukoy ng panghalip na 'siya,' ayon sa nagpapatuloy na konteksto mula sa Hebreo 11:8.
  alternative: Ulitin ang pangalang 'Abraham' sa teksto.
  rationale: Walang bagong simuno sa Griyego; nagpapatuloy ang paglalarawan kay Abraham. Pinananatili ng panghalip ang anyo ng pinagmulan nang hindi nawawala ang linaw sa konteksto.
- issue: Ugnayan ng ipinangakong lupain at pagiging dayuhan
  choice: Inilalarawan ang lupain bilang ipinangako ngunit pinamumuhayan pa rin ni Abraham na para bang pag-aari ng iba.
  alternative: Unawain ang parirala bilang simpleng pansamantalang paninirahan sa isang banyagang lupain.
  rationale: 'Pinananatili nito ang tensiyon ng teksto: ipinangako na ang lupain, ngunit hindi pa ito pag-aari ni Abraham sa kaniyang pamumuhay roon.'
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang karaniwang 'pananampalataya,' 'dayuhan,' 'tolda,' at 'tagapagmana'; iniwasan ang makaluma o labis na teknikal na pananalita. Nasa pangunahing teksto ang marker na [a].
