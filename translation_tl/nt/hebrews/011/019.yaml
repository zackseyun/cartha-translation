  text: having considered that God is able even to raise from the dead[a], from where, in a figure[b], he also received him back.
translation:
  language: tl
  text: Inisip niyang kaya ng Diyos na buhayin muli kahit ang mga patay. Kaya[a], sa makasagisag na paraan[b], tinanggap din niya itong muli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Mula roon.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal na salin, “sa isang talinghaga”; ibig sabihin, para bang tinanggap niya itong muli mula sa kamatayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: λογισάμενος
  choice: Inisip niyang
  rationale: Ipinahahayag ng aorist middle participle ang maingat na panloob na pangangatwiran ni Abraham. Natural sa modernong Tagalog ang “Inisip niyang” nang hindi ito ginagawang simpleng damdamin o pananampalataya lamang.
- source_word: καὶ ἐκ νεκρῶν ἐγείρειν
  choice: bumuhay kahit mula sa mga patay
  rationale: Ang “bumuhay” ay malinaw na wikang tumutukoy sa muling pagkabuhay, at ipinakikita ng “kahit” ang nagpapatingkad na gamit ng καί.
- source_word: δυνατὸς ὁ θεός
  choice: kaya ng Diyos
  rationale: Maikli at likas na katumbas ng pahayag na may kakayahan ang Diyos; pinananatili ang pangkasalukuyang anyo ng Griyego.
- source_word: ὅθεν
  choice: Kaya
  rationale: Sa konteksto, maaaring magpakilala ang ὅθεν ng bunga ng naunang pangangatwiran. Ito ang pinakanatural na pangunahing salin sa Tagalog, habang inilalagay sa talababa ang posibleng mas literal na ugnayang “mula roon.”
- source_word: ἐν παραβολῇ
  choice: sa makasagisag na paraan
  rationale: Ipinakikita nitong ang pagtanggap muli kay Isaac ay maihahambing sa pagtanggap sa isang taong bumalik mula sa kamatayan, hindi isang aktuwal na muling pagkabuhay. Nananatili sa talababa ang literal na anyong “sa isang talinghaga.”
- source_word: ἐκομίσατο
  choice: tinanggap din niya itong muli
  rationale: Ipinahihiwatig ng middle form at ng konteksto ang pagbawi o pagtanggap muli ni Abraham sa anak na handa na niyang ihandog. Ang “ito” ay nagpapanatili sa panghalip ng Griyego sa halip na idagdag ang pangalang Isaac.
theological_decisions:
- issue: Ang uri ng muling pagtanggap ni Abraham kay Isaac
  choice: Inilarawan itong nangyari “sa makasagisag na paraan,” hindi bilang aktuwal na muling pagkabuhay.
  alternative: Maaaring unawain ang parirala bilang “sa isang talinghaga,” na higit na nagtatampok sa pagiging huwaran o tipolohikal ng pangyayari.
  rationale: Ang ἐν παραβολῇ ay naghahayag ng paghahambing o makasagisag na kaugnayan sa muling pagkabuhay. Hindi tinutukoy ng salin kung hanggang saan umaabot ang posibleng tipolohiya.
- issue: Ugnayan ng ὅθεν sa naunang pahayag
  choice: 'Isinalin bilang panghinuha: “Kaya.”'
  alternative: 'Maaari itong isalin nang higit na panlunan o pinagmulan: “Mula roon.”'
  rationale: Kapuwa posible ang panghinuha at ang pagtanaw pabalik sa kalagayan ng kamatayan. Pinili sa teksto ang natural na panghinuha ngunit pinanatili sa talababa ang tunay na leksikal na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang payak na “Inisip” at “kaya” sa halip na mas mabibigat o makalumang katumbas, ngunit pinanatili ang siksik na lohika at ang kalabuan ng mga pariralang ὅθεν at ἐν παραβολῇ sa pamamagitan ng mga talababa.
