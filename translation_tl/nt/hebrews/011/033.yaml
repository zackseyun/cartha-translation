  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “dahil sa pagtitiwala sa Diyos.” Ipinapakita ng pariralang Griyego ang paraan o kasangkapang ginamit nila sa pagkilos.
    reason: lexical_alternative
