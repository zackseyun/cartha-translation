lexical_decisions:
- source_word: διὰ πίστεως
  choice: sa pamamagitan ng pananampalataya
  rationale: Ipinahahayag ng διά na may genitibo ang paraan o kasangkapang ginamit sa pagkilos. Ang “pananampalataya” ang likas at pangkabanatang salin ng πίστις sa Hebreo 11, habang nananatiling malinaw na ito ay pagtitiwala sa Diyos.
- source_word: κατηγωνίσαντο βασιλείας
  choice: lumupig sa mga kaharian
  rationale: Ang καταγωνίζομαι ay tumutukoy sa paggapi o pananaig sa labanan. Ang “lumupig” ay matindi ngunit natural na pandiwa, at pinananatili ng “mga kaharian” ang kongkretong pampolitikang diwa ng βασιλείας.
- source_word: εἰργάσαντο δικαιοσύνην
  choice: nagsagawa ng katuwiran
  rationale: Pinananatili ng “nagsagawa” ang aktibong diwa ng ἐργάζομαι, at ng “katuwiran” ang malawak na moral at tipanang saklaw ng δικαιοσύνη. Hindi nito nililimitahan ang salita sa hudisyal na katarungan lamang.
- source_word: ἐπέτυχον ἐπαγγελιῶν
  choice: nagtamo ng mga pangako
  rationale: Ang “nagtamo” ay nagpapahayag ng pag-abot o pagkamit na taglay ng ἐπιτυγχάνω. Ang literal na “mga pangako” ay hindi tahasang pinapalitan ng “mga ipinangako,” kaya hindi tahimik na nilulutas ang tensiyon sa Hebreo tungkol sa pagtanggap at ganap na katuparan ng mga pangako.
- source_word: ἔφραξαν στόματα λεόντων
  choice: nagpatikom sa mga bibig ng mga leon
  rationale: Ang “nagpatikom” ay natural at matingkad na katumbas ng pagsasara o pagpigil na ipinahahayag ng φράσσω. Pinananatili ang kongkretong larawan ng “mga bibig ng mga leon” nang hindi tahasang idinaragdag ang alusyon kay Daniel.
theological_decisions:
- issue: Kahulugan ng πίστις sa talaan ng Hebreo 11
  choice: pananampalataya
  alternative: pagtitiwala
  rationale: Pananampalataya ang pangunahing tema ng kabanata at ang pinakanaaangkop na pangunahing salin. Nililinaw sa talababa na maaari ring ipahayag ang instrumental na parirala bilang pagkilos dahil sa pagtitiwala sa Diyos.
- issue: Saklaw ng δικαιοσύνη sa di-Paulinong konteksto
  choice: katuwiran
  alternative: katarungan
  rationale: Masaklaw ang “katuwiran” at maaaring tumukoy sa matuwid na pagkilos sa harap ng Diyos at ng kapwa. Posible rin ang “katarungan,” ngunit maaaring paliitin nito ang kahulugan tungo sa panlipunan o hudisyal na gawain.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang mabilis na ritmo ng magkakasunod na pandiwa at ang bahagyang pormal na bokabularyong angkop sa tekstong biblikal, nang walang arkaikong anyo.
