  yaml_path: translation/nt/hebrews/011/040.yaml
  text: since God had provided something better for us[b][a], so that they would not be made perfect apart from us.
translation:
  language: tl
  text: Sapagkat naglaan ang Diyos ng mas mabuting bagay para sa atin[a], upang hindi sila gawing ganap nang hiwalay sa atin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nakakita na ng mas mabuting bagay para sa atin” o “nagplano na ng mas mabuting bagay para sa atin.” Maaaring ipahiwatig ng salitang Griyego ang paunang pagkakita o paunang paglalaan; sa konteksto, mas malamang ang paglalaan o panukala ng Diyos.
    reason: lexical_alternative
  - marker: b
    text: O “upang hindi sila dalhin sa kaganapan nang wala tayo.”
    reason: alternative_reading
lexical_decisions:
- source_word: προβλεψαμένου
  choice: may inihanda
  rationale: Sa konteksto, ipinahihiwatig ng participle ang naunang paglalaan o panukala ng Diyos, hindi lamang ang paunang pagkaalam. Likas sa modernong Tagalog ang “inihanda” at angkop ito sa disenyo ng Diyos sa talata.
- source_word: κρεῖττόν τι
  choice: na mas mabuti
  rationale: Pinananatili ng “mas mabuti” ang mahalagang paulit-ulit na paghahambing sa Hebreo; ang di-tiyak na τι ay likas nang naipahahayag sa pariralang “may inihanda ... na mas mabuti.”
- source_word: περὶ ἡμῶν
  choice: para sa atin
  rationale: Sa ugnayan nito sa προβλεψαμένου, ang περί ay natural na nagpapahayag na tayo ay isinaalang-alang at makikinabang sa inihanda ng Diyos.
- source_word: ἵνα μὴ
  choice: upang hindi
  rationale: Malinaw na pinananatili nito ang layunin o kinalabasan ng sugnay.
- source_word: χωρὶς ἡμῶν
  choice: nang hiwalay sa atin
  rationale: Pinananatili nito ang diwang hindi nakabukod sa atin ang kanilang pag-abot sa kaganapan.
- source_word: τελειωθῶσιν
  choice: gawing ganap
  rationale: Pinananatili nito ang malawak na puwersa ng τελειόω sa Hebreo—kapwa pagiging ganap at pagdadala sa kaganapan—nang hindi ito nililimitahan sa moral na kasakdalan lamang.
- source_word: τοῦ θεοῦ
  choice: ang Diyos
  rationale: 'Ito ang simuno ng genitive absolute, na natural na naipapahayag sa Tagalog bilang sugnay na nagbibigay ng dahilan: “Sapagkat ... ang Diyos.”'
theological_decisions:
- issue: Kahulugan ng τελειωθῶσιν sa kontekstong pangkaligtasan at pangkasaysayan ng Hebreo
  choice: gawing ganap
  alternative: dalhin sa kaganapan
  rationale: Ang “gawing ganap” ay nagpapanatili sa teolohikal na bigat at tunay na tensiyon ng salita sa pagitan ng pagiging perpekto at pag-abot sa ganap na katuparan.
- issue: Ugnayan ng mga naunang saksi at ng “atin” sa kanilang kaganapan
  choice: nang hiwalay sa atin
  alternative: nang wala tayo
  rationale: Mas malinaw na ipinahihiwatig ng “hiwalay” ang sama-samang pag-abot sa kaganapan, nang hindi ipinapaliwanag nang lampas sa sinasabi ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “Sapagkat” upang ikabit ang talata sa naunang pangungusap, “inihanda” para sa kontekstuwal na diwa ng banal na paglalaan, at “gawing ganap” upang mapanatili ang teolohikal na lawak ng τελειόω.
