id: HEB.11.10
reference: Hebrews 11:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐξεδέχετο γὰρ τὴν τοὺς θεμελίους ἔχουσαν πόλιν, ἧς τεχνίτης καὶ δημιουργὸς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/010.yaml
  text: For he was waiting for the city that has foundations[b][a], whose architect and builder is God.
translation:
  language: tl
  text: Sapagkat hinihintay niya ang lungsod na may mga pundasyon[a], na ang tagapagdisenyo at tagapagtayo ay ang Diyos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang lungsod na nagtataglay ng mga pundasyon.” Maaaring idiin ng pangmaramihang anyo ang pananatili at katatagan nito.
    reason: lexical_alternative
  - marker: b
    text: O, “na ang arkitekto at gumawa ay ang Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεδέχετο
  choice: hinihintay niya
  rationale: Ipinahihiwatig ng imperpektong anyo ang patuloy at matiyagang paghihintay noon; likas ito sa modernong Tagalog.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na kaugnayan nito sa naunang pahayag tungkol sa paninirahan ni Abraham bilang dayuhan.
- source_word: τοὺς θεμελίους ἔχουσαν πόλιν
  choice: ang lungsod na may mga pundasyon
  rationale: Malapit sa Griyego at likas sa Tagalog; pinananatili ang tiyak na lungsod at ang pangmaramihang 'mga pundasyon.'
- source_word: θεμελίους
  choice: mga pundasyon
  rationale: Karaniwang katumbas na nagpapanatili sa pangmaramihang anyo, na maaaring magpahiwatig ng katatagan at pananatili.
- source_word: πόλιν
  choice: lungsod
  rationale: Karaniwan at angkop na salin sa kontekstong ito.
- source_word: ἧς
  choice: na ang
  rationale: Likas na Tagalog na paraan upang iugnay sa lungsod ang mga sumusunod na katawagang tumutukoy sa Diyos.
- source_word: τεχνίτης
  choice: tagapagdisenyo
  rationale: Itinatampok ang bihasang pagbalangkas o pagdidisenyo at malinaw itong naipapares ngunit naihihiwalay sa 'tagapagtayo.'
- source_word: δημιουργὸς
  choice: tagapagtayo
  rationale: Angkop sa larawan ng isang lungsod at pinananatili ang gawaing pagtatayo nang hindi awtomatikong pinalalawak sa 'Manlilikha.'
- source_word: ὁ θεός
  choice: ang Diyos
  rationale: Tuwirang salin ng simuno ng sugnay.
theological_decisions:
- issue: Kalikasan ng ipinangakong lungsod
  choice: lungsod na may mga pundasyon
  alternative: makalangit na lungsod; lungsod na may permanenteng mga pundasyon
  rationale: Hindi tahasang tinatawag ng talata ang lungsod na 'makalangit' o pinapangalanan itong Bagong Jerusalem. Pinananatili ng salin ang mismong larawan at hindi inuunahan ang mas buong pagkakakilanlan nito sa kalapit na konteksto.
- issue: Ugnayan ng τεχνίτης at δημιουργός
  choice: tagapagdisenyo at tagapagtayo
  alternative: dalubhasang manggagawa at gumawa; arkitekto at tagapagtayo
  rationale: Pinananatili ang dalawang magkaugnay ngunit hindi lubos na magkaparehong tungkulin nang hindi nagpapasok ng dagdag na doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'lungsod,' 'mga pundasyon,' 'tagapagdisenyo,' at 'tagapagtayo' upang mapanatili ang konkretong larawang pangkonstruksiyon at ang pagkakaiba ng dalawang katawagan sa Diyos.
