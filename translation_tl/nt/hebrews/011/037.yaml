  source_fidelity: Tumpak ang kabuuang pagkakasunod at saklaw ng talaan, at hindi isinama ang tekstuwal na variant na wala sa ibinigay na SBLGNT. Ang “pinatay sa tabak” ay makatwirang idiomatikong pagsasalin ng ἐν φόνῳ μαχαίρης ἀπέθανον at napapanatili ang marahas na diin ng φόνος.
  naturalness: 'Malinaw at marangal ang Filipino. Ang maliit na pagbabago sa θλιβόμενοι ay nagpapalinaw ng kaibhan nito sa kasunod na κακουχούμενοι: ang una ay pagiging ginigipit/inaapi, samantalang ang huli ay masamang pagtrato.'
  terminology: Ang “balat ng tupa,” “balat ng kambing,” at “salat” ay angkop. Ang “nilagari sila sa dalawa” ay mas ganap at tuwirang anyo sa magkakatulad na serye ng mga pandiwang balintiyak.
