    rationale: Ang θλιβόμενοι ay mas malawak na pagiging pinipighati, ginigipit, o inaapi; ang κακουχούμενοι naman ay masamang pagtrato. Ang “ginigipit” ay mas malinaw na pinananatili ang pagkakaiba nang hindi nagpapasok ng dagdag na kahulugan.
  - severity: low
