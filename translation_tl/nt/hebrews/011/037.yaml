  text: ἐλιθάσθησαν, ⸀ἐπρίσθησαν, ἐν φόνῳ ⸀μαχαίρης ἀπέθανον, περιῆλθον ἐν μηλωταῖς, ἐν αἰγείοις δέρμασιν, ὑστερούμενοι, θλιβόμενοι, κακουχούμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/037.yaml
  text: They were stoned[a], they were sawn in two, they died by the sword; they went about in sheepskins, in goatskins, destitute, afflicted, mistreated—
translation:
  language: tl
  text: Binato sila, nilagari sila sa dalawa, pinatay sila sa tabak; nagpalaboy-laboy silang nakasuot ng balat ng tupa at balat ng kambing, salat, ginigipit, at malupit na tinatrato—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλιθάσθησαν
  choice: Binato sila
  rationale: Tuwirang ipinapahayag ng aorist passive ng λιθάζω ang pagbato bilang pagpapahirap o pagpatay; hindi idinagdag ang “hanggang mamatay” sapagkat wala iyon sa pandiwa mismo.
- source_word: ἐπρίσθησαν
  choice: nilagari sa dalawa
  rationale: Ang passive ng πρίζω ay “lagariin”; nililinaw ng “sa dalawa” ang malamang na diwa ng marahas na paglalagari sa talaan ng mga martir.
- source_word: ἐν φόνῳ μαχαίρης ἀπέθανον
  choice: pinatay sa tabak
  rationale: Natural na Filipino ito para sa marahas na pagkamatay sa pamamagitan ng tabak. Bagaman aktibo ang ἀπέθανον (“namatay”), ipinahihiwatig ng φόνος at μαχαίρης ang pagpatay; kaya pinananatili ang marahas na puwersa nang hindi gumagamit ng alanganing literal na parirala.
- source_word: περιῆλθον
  choice: nagpalaboy-laboy sila
  rationale: Ipinahahayag ang paglipat-lipat ng lugar na may diwa ng kawalan ng tahanan o katiyakan sa kontekstong ito.
- source_word: ἐν μηλωταῖς
  choice: nakasuot ng balat ng tupa
  rationale: Ang μηλωτή ay balat ng tupa na ginagamit bilang kasuotan; ginawang tahasan ang likas na gamit upang maging malinaw sa Filipino.
- source_word: ἐν αἰγείοις δέρμασιν
  choice: balat ng kambing
  rationale: Pinananatili ang parallel na paglalarawan sa mga kasuotang yari sa balat ng hayop.
- source_word: ὑστερούμενοι
  choice: salat
  rationale: Maikli at natural na salitang Filipino para sa matinding kakulangan sa mga pangangailangan.
- source_word: θλιβόμενοι
  choice: pinahihirapan
  rationale: Sinasalamin ang passive participle at ang diwa ng pagdaranas ng matinding kagipitan o pagpapahirap.
- source_word: κακουχούμενοι
  choice: malupit na tinatrato
  rationale: Malinaw at kasalukuyang Filipino para sa pagdurusa dahil sa masamang pagtrato.
theological_decisions:
- issue: Lakas at anyo ng marahas na pariralang ἐν φόνῳ μαχαίρης
  choice: pinatay sa tabak
  alternative: namatay sa pamamagitan ng pagpaslang ng tabak
  rationale: May dagdag na diin sa marahas na pagpatay ang φόνος, ngunit magiging pilit at malabo sa Filipino ang lubhang literal na anyo. Ang “pinatay sa tabak” ay natural at pinananatili ang tahasang ahensiya at karahasan.
- issue: Posibleng tekstuwal na pagkakaiba sa talaan ng mga pagpapahirap
  choice: Isinalin ang tekstong ibinigay ng SBLGNT nang walang dagdag na sugnay.
  alternative: May ilang tradisyong tekstuwal na may karagdagang ἐπειράσθησαν (“tinukso/sinubok sila”).
  rationale: Ang ibinigay na source text ang batayan ng draft; hindi dapat ipasok sa pangunahing teksto ang salitang wala rito.
translation_notes:
  register: Modernong, marangal, at madaling maunawaang Filipino. Ginamit ang sunod-sunod na maiikling parirala upang mapanatili ang mabilis at mabigat na ritmo ng Griyegong talaan. Ang pangwakas na gitling ay nagpapatuloy sa kaisipan ng susunod na talata.
