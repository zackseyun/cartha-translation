  yaml_path: translation/nt/hebrews/002/015.yaml
  text: and free those who[a], through fear of death, were subject to slavery all their lives.
translation:
  language: tl
  text: at palayain ang mga taong, dahil sa takot sa kamatayan, ay nasa ilalim ng pagkaalipin sa buong buhay nila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ay nasa pagkaalipin” o “ay nakagapos sa pagkaalipin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαλλάξῃ
  choice: palayain
  rationale: Tuwirang ipinahahayag ang paglaya mula sa isang kalagayan o pagkakatali, at natural na kaugnay ng larawan ng pagkaalipin.
- source_word: τούτους, ὅσοι
  choice: ang lahat ng
  rationale: Pinagsamang natural na salin ng demonstratibo at ng relasyong may saklaw sa buong uring inilalarawan; pinananatili nito ang diwang 'yaong lahat na.'
- source_word: φόβῳ θανάτου
  choice: dahil sa takot sa kamatayan
  rationale: Malinaw at likas na Filipino para sa sanhi o kumokontrol na kalagayan na ipinahahayag ng datibo.
- source_word: διὰ παντὸς τοῦ ζῆν
  choice: habang sila'y nabubuhay
  rationale: Natural na ipinahahayag ang buong tagal ng kanilang buhay nang hindi ginagaya nang mekanikal ang idyomang Griyego.
- source_word: ἔνοχοι ἦσαν δουλείας
  choice: ay inalipin
  rationale: Ipinahahayag ang aktuwal na pagkakasakop sa pagkaalipin, hindi lamang ang posibilidad o legal na pananagutan dito. Ang alternatibo sa talababa ay nagpapanatili sa mas statibong pagbasa.
- source_word: καὶ
  choice: at
  rationale: Pinananatili ang ugnayan ng sugnay na ito sa layunin o bunga sa naunang talata.
theological_decisions:
- issue: Kalikasan ng pagkaaliping kaugnay ng takot sa kamatayan
  choice: Hindi tinukoy sa salin kung ito ay pagkaalipin sa diyablo, sa kasalanan, o ibang mas makitid na doktrinal na mekanismo.
  alternative: Tahasang sabihing pagkaalipin ito sa diyablo, sa kasalanan, o sa mortal na kalagayan.
  rationale: Ang talata mismo ay nagsasabing ang takot sa kamatayan ang kaugnay ng pagkaalipin; hindi nito tahasang pinangalanan dito ang panginoon o tiyak na mekanismo ng pagkaalipin.
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “inalipin” upang maging natural at matindi ang larawan, habang inilalagay sa talababa ang mas literal at statibong mga alternatibo para sa ἔνοχοι ἦσαν δουλείας.
