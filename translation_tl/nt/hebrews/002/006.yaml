id: HEB.2.6
reference: Hebrews 2:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: διεμαρτύρατο δέ πού τις λέγων· Τί ἐστιν ἄνθρωπος ὅτι μιμνῄσκῃ αὐτοῦ, ἢ υἱὸς ἀνθρώπου ὅτι ἐπισκέπτῃ αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/006.yaml
  text: But someone has testified somewhere[a], saying, “What is man, that you remember him, or the son of man[c][b], that you care for him?”
translation:
  language: tl
  text: 'Ngunit may isang nagpatotoo sa isang dako[a], na nagsasabi,


    “Ano ang tao upang alalahanin mo siya,

    o ang anak ng tao[b] upang pangalagaan mo siya?[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa isang lugar.” Hindi ipinahihiwatig ng pananalitang ito na hindi alam ng may-akda ang pinagmulan ng sipi.
    reason: idiom_clarification
  - marker: b
    text: Ang “anak ng tao” ay alingawngaw ng Awit 8:4, kung saan isa itong patulang tawag sa tao o sangkatauhan. Sa mas malawak na konteksto ng Hebreo, nagkakaroon din ito ng kabuluhan kaugnay ni Jesus.
    reason: cross_reference
  - marker: c
    text: O “dalawin mo siya” o “tingnan mo ang kanyang kalagayan.” Maaaring tumukoy ang pandiwang Griego sa mapagkalingang pagdalaw o pangangalaga.
    reason: lexical_alternative
lexical_decisions:
- source_word: διεμαρτύρατο
  choice: nagpatotoo
  rationale: Ipinahahayag nito ang mariing pagpapatotoo o pagsaksi, at natural itong gamitin sa pagpapakilala ng sipi mula sa Kasulatan.
- source_word: δέ
  choice: Ngunit
  rationale: Nagmamarka ito ng banayad na pagsalungat o paglipat mula sa naunang argumento tungkol sa mga anghel.
- source_word: πού τις
  choice: may isang ... sa isang dako
  rationale: Pinananatili nito ang di-tiyak na anyo ng ‘someone somewhere’ bilang paraan ng pagpapakilala sa isang kilalang sipi nang hindi tinutukoy ang lokasyon o may-akda.
- source_word: λέγων
  choice: na nagsasabi
  rationale: Tuwirang ipinapakilala ng participle ang nilalaman ng patotoo.
- source_word: Τί ἐστιν ἄνθρωπος
  choice: Ano ang tao
  rationale: Pinananatili ang patulang isahang kinatawan ng sangkatauhan at ang pamilyar na anyo ng sipi, nang hindi nililimitahan ang kahulugan sa lalaking kasarian.
- source_word: ὅτι μιμνῄσκῃ αὐτοῦ
  choice: upang alalahanin mo siya
  rationale: Ang μιμνῄσκομαι ay tumutukoy sa pag-alaala o pagpapanatili sa isip; ang ‘alalahanin’ ay natural, malinaw, at angkop sa dignidad ng tula.
- source_word: υἱὸς ἀνθρώπου
  choice: ang anak ng tao
  rationale: Pinananatili nito ang anyo ng Griego at ang alingawngaw ng Awit 8, pati ang tensiyon sa pagitan ng pangkalahatang sangkatauhan at ng paglalapat kay Jesus sa kasunod na konteksto.
- source_word: ὅτι ἐπισκέπτῃ αὐτόν
  choice: upang pangalagaan mo siya
  rationale: Ang ἐπισκέπτομαι ay maaaring mangahulugang dumalaw, tumingin sa kalagayan, o magmalasakit; malinaw na naipapahayag ng ‘pangalagaan’ ang mapagkalingang pansin sa kontekstong ito.
theological_decisions:
- issue: Kung ang υἱὸς ἀνθρώπου ay dapat isaling hayagang bilang mesiyanikong titulo
  choice: Panatilihin ang “ang anak ng tao” sa karaniwang titik bilang pananalita ng Awit 8.
  alternative: Isaling “isang tao” o gawing titulong “Anak ng Tao.”
  rationale: Sa Awit 8, patulang katumbas ito ng ‘tao’ at tumutukoy sa sangkatauhan; sa mas malawak na argumento ng Hebreo, nagkakaroon din ito ng kabuluhan kaugnay ni Jesus. Hindi dapat lutasin nang maaga sa pangunahing teksto ang sadyang tensiyong ito.
translation_notes:
  register: Makabago ngunit marangal na Filipino; pinanatili ang patulang paralelismo at ang isahang kinatawan ng sangkatauhan. Ginamit ang ‘sa isang dako’ upang maging natural at bahagyang pampanitikan nang hindi nagiging lipas, at ‘pangalagaan’ upang malinaw na ihatid ang mapagkalingang diwa ng pandiwa.
