id: HEB.2.3
reference: Hebrews 2:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πῶς ἡμεῖς ἐκφευξόμεθα τηλικαύτης ἀμελήσαντες σωτηρίας, ἥτις, ἀρχὴν λαβοῦσα λαλεῖσθαι διὰ τοῦ κυρίου, ὑπὸ τῶν ἀκουσάντων εἰς ἡμᾶς ἐβεβαιώθη,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/003.yaml
  text: How will we escape if we neglect so great a salvation? This salvation[a], having at first been spoken through the Lord, was confirmed to us by those who heard him,
translation:
  language: tl
  text: Paano tayo makatatakas kung ipagwawalang-bahala natin ang ganito kadakilang kaligtasan? Ang kaligtasang ito,[a] na unang nagsimulang ipahayag sa pamamagitan ng Panginoon, ay pinagtibay sa atin ng mga nakarinig sa kanya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na, matapos munang magsimulang ipahayag sa pamamagitan ng Panginoon, ay pinagtibay sa atin ng mga nakarinig sa kanya.”
    reason: Ipinakikita ang mas tuwirang pagkakaugnay ng ἥτις sa “kaligtasan” nang hindi inuulit ang pangngalan, habang pinananatili ang diwa ng pagsisimula sa ἀρχὴν λαβοῦσα λαλεῖσθαι.
lexical_decisions:
- source_word: πῶς
  choice: Paano
  rationale: Pinananatili ang anyong patanong at ang matinding puwersa ng retorikal na babala nang hindi tahasang ginagawang pahayag ng imposibilidad.
- source_word: ἐκφευξόμεθα
  choice: tayo makatatakas
  rationale: Inilalarawan ang future indicative bilang hinaharap na tanong; natural sa modernong Filipino ang “makatatakas” at hindi nito nilulutas ang ipinahihiwatig na sagot.
- source_word: τηλικαύτης
  choice: ganito kadakilang
  rationale: Likas at mariing paglalarawan sa laki at halaga ng kaligtasan.
- source_word: ἀμελήσαντες
  choice: kung ipagwawalang-bahala natin
  rationale: Ipinahahayag ang kontekstuwal na kondisyunal na puwersa ng aorist participle. Mas tiyak ang “ipagwalang-bahala” kaysa simpleng “pabayaan” para sa sadyang hindi pagbibigay-pansin.
- source_word: σωτηρίας
  choice: kaligtasan
  rationale: Karaniwan at angkop na salin na sumasaklaw sa pagliligtas at sa teolohikal na bigat ng salita sa Hebreo.
- source_word: ἥτις
  choice: Ang kaligtasang ito
  rationale: Nililinaw ang tinutukoy ng panghalip habang pinananatili ang paliwanag na kaugnayan nito sa naunang “kaligtasan.”
- source_word: ἀρχὴν λαβοῦσα λαλεῖσθαι
  choice: na unang ipinahayag
  rationale: Natural na Filipino para sa idyomang tumutukoy sa pasimula ng pagpapahayag. Ang “ipinahayag” ay mas malinaw sa konteksto kaysa sa literal ngunit alanganing “sinalita.”
- source_word: διὰ τοῦ κυρίου
  choice: sa pamamagitan ng Panginoon
  rationale: Pinananatili ang agency o instrumentality ng διά na may genitive at ang kinikilalang titulong “Panginoon.”
- source_word: ὑπὸ τῶν ἀκουσάντων
  choice: ng mga nakarinig sa kanya
  rationale: Inilalarawan ang mga tuwirang nakarinig; idinagdag ang “sa kanya” bilang likas na paglilinaw sa ipinahihiwatig na layon mula sa konteksto.
- source_word: εἰς ἡμᾶς ἐβεβαιώθη
  choice: ay pinagtibay sa atin
  rationale: Pinananatili ang diwang ang mensahe ay kinumpirma at umabot sa mga tumatanggap nito, nang hindi nagdaragdag ng paliwanag na wala sa teksto.
theological_decisions:
- issue: Tinutukoy ng τοῦ κυρίου
  choice: “Panginoon,” na sa konteksto ay tumutukoy kay Jesus na unang nagpahayag ng mensahe ng kaligtasan
  alternative: Isang pangkalahatang pagtukoy sa Diyos bilang panginoon
  rationale: Ang kasunod na “mga nakarinig sa kanya” ay malakas na tumutukoy sa makalupang pagpapahayag ni Jesus at sa patotoo ng mga nakarinig, ngunit hindi nagdaragdag ang salin ng pangalang wala sa talata.
- issue: Puwersa ng babalang tanong
  choice: Pinanatili bilang retorikal na tanong
  alternative: 'Gawing tahasang pahayag: “Tiyak na hindi tayo makatatakas...”'
  rationale: Tanong sa Griyego ang pahayag. Pinananatili nito ang tensiyon at bigat ng babala nang hindi tahasang nilulutas ang ipinahihiwatig na sagot.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “ipagwawalang-bahala” para sa tiyak na diwa ng pagpapabaya, “Panginoon” para sa κύριος, at “pinagtibay” para sa pormal ngunit malinaw na diwa ng pagkumpirma. Pinanatili ang kuwit sa hulihan sapagkat nagpapatuloy ang pangungusap sa susunod na talata.
