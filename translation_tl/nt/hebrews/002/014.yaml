revisions:
- from: Kaya, yamang ang mga anak ay may bahagi sa dugo at laman[a], siya rin mismo ay nakibahagi sa gayunding mga bagay, upang sa pamamagitan ng kamatayan ay mapawalang-bisa niya[b] ang nagtataglay ng kapangyarihan ng kamatayan—samakatuwid, ang diyablo.
  to: Kaya nga, yamang ang mga anak ay may bahagi sa dugo at laman[a], siya rin mismo ay nakibahagi sa mga ito sa gayunding paraan, upang sa pamamagitan ng kamatayan ay gawin niyang walang-bisa[b] ang may kapangyarihan ng kamatayan—samakatuwid, ang diyablo.
  rationale: Pinalitan ang dalawang bahaging hindi gaanong likas sa Filipino nang hindi binabago ang kahulugan. Ang «Kaya nga, yamang» ay pinananatili ang lohikal na pag-uugnay ng οὖν at ang sanhi ng ἐπεί. Ang «sa mga ito sa gayunding paraan» ay malinaw na ibinabalik sa dugo at laman at isinasalin ang παραπλησίως. Ang «gawin niyang walang-bisa ang may kapangyarihan ng kamatayan» ay mas idiomatiko para sa καταργήσῃ at hindi lumalampas sa teksto sa pamamagitan ng pag-aangking nilipol ang diyablo.
