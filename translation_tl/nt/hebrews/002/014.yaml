source:
  edition: SBLGNT
  text: Ἐπεὶ οὖν τὰ παιδία κεκοινώνηκεν ⸂αἵματος καὶ σαρκός⸃, καὶ αὐτὸς παραπλησίως μετέσχεν τῶν αὐτῶν, ἵνα διὰ τοῦ θανάτου καταργήσῃ τὸν τὸ κράτος ἔχοντα τοῦ θανάτου, τοῦτ’ ἔστι τὸν διάβολον,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/014.yaml
  text: Therefore[a], since the children share in flesh and blood, he himself likewise partook of the same things, so that through death he might nullify the one who has the power of death—that is, the devil[b],
translation:
  language: tl
  text: Kaya nga, yamang ang mga anak ay may bahagi sa dugo at laman[a], siya rin mismo ay nakibahagi sa mga ito sa gayunding paraan, upang sa pamamagitan ng kamatayan ay gawin niyang walang-bisa[b] ang may kapangyarihan ng kamatayan—samakatuwid, ang diyablo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Karaniwang parirala sa Filipino ang “laman at dugo”; literal na ayos sa Griyego: “dugo at laman.”'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “lipulin” o “gawing walang kapangyarihan.” Ang pandiwa ay maaaring mangahulugang gawing walang bisa o walang lakas, at hindi kinakailangang mangahulugang ganap na pawiin ang pag-iral.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐπεὶ οὖν
  choice: Kaya, yamang
  rationale: Pinananatili ng “kaya” ang lohikal na kaugnayan sa naunang argumento at ng “yamang” ang dahilang ipinahahayag ng ἐπεί.
- source_word: τὰ παιδία
  choice: ang mga anak
  rationale: Tumutukoy ito sa mga anak na binanggit sa kalapit na konteksto; natural at hindi labis na mapagpaliwanag ang “mga anak.”
- source_word: κεκοινώνηκεν
  choice: may bahagi sa
  rationale: Ipinahahayag ang patuloy na kalagayan ng pakikibahagi, nang hindi pilit na ginagaya ang anyong perpekto ng Griyego.
- source_word: αἵματος καὶ σαρκός
  choice: dugo at laman
  rationale: Pinananatili ang ayos ng SBLGNT at ang literal na kahulugan ng σάρξ bilang laman, hindi bilang “makasalanang kalikasan.”
- source_word: καὶ αὐτὸς παραπλησίως
  choice: siya rin mismo
  rationale: Binibigyang-diin ng “mismo” ang αὐτός at ipinahihiwatig ng “rin” ang katulad na pakikibahagi; ang kasunod na “gayunding” ang malinaw na naghahatid sa diwa ng παραπλησίως.
- source_word: μετέσχεν τῶν αὐτῶν
  choice: nakibahagi sa gayunding mga bagay
  rationale: Pinananatili ang tunay na pakikibahagi at ang pagtukoy pabalik sa dugo at laman, habang hindi lubusang pinag-iisa ang pagkakakilanlan niya at ng mga anak.
- source_word: ἵνα διὰ τοῦ θανάτου
  choice: upang sa pamamagitan ng kamatayan
  rationale: Malinaw na ipinahahayag ang layunin ng ἵνα at ang paraang ipinakikita ng διά na may genitive.
- source_word: καταργήσῃ
  choice: mapawalang-bisa niya
  rationale: Ipinahahayag ang pag-aalis ng bisa o kakayahang kumilos nang hindi ipinahihiwatig na tumigil nang umiral ang diyablo.
- source_word: τὸν τὸ κράτος ἔχοντα τοῦ θανάτου
  choice: ang nagtataglay ng kapangyarihan ng kamatayan
  rationale: Malapit sa estruktura ng Griyego at pinananatili ang genitibong ugnayan sa “kamatayan” nang hindi ito ginagawang isang mas tiyak na paliwanag.
- source_word: τοῦτ’ ἔστι τὸν διάβολον
  choice: samakatuwid, ang diyablo
  rationale: Likas na ipinakikilala ang tuwirang pagkakakilanlan ng naunang tinukoy; “diyablo” ang nakaugaliang personal na katawagan sa kontekstong ito.
theological_decisions:
- issue: Pakikibahagi ni Cristo sa pagkatao
  choice: “siya rin mismo ay nakibahagi sa gayunding mga bagay”
  alternative: “nakibahagi rin siya sa kanilang pagkatao”
  rationale: Pinananatili ang tunay na pakikibahagi sa dugo at laman at ang maingat na pagkakaiba ng mga pandiwang κοινωνέω at μετέχω, nang hindi nagdaragdag ng isang kalaunang pormulang doktrinal.
- issue: Kahulugan ng καταργήσῃ kaugnay ng diyablo
  choice: “mapawalang-bisa”
  alternative: “lipulin” o “alisan ng kapangyarihan”
  rationale: Saklaw ng pandiwa ang pagpapawalang-bisa o paggawa sa isang bagay na hindi mabisa. Hindi nito sapilitang ipinahihiwatig ang pagkalipol, samantalang ang mas tradisyonal na “lipulin” ay inilalahad sa talababa bilang posibleng salin.
- issue: Ugnayan ng κράτος at θάνατος
  choice: “kapangyarihan ng kamatayan”
  alternative: “kapangyarihan sa kamatayan”
  rationale: Pinananatili ang tunay na lawak ng genitive sa Griyego at iniiwasang tahasang lutasin kung ito ay kapangyarihang likas na kaugnay ng kamatayan o awtoridad sa paggamit nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang “dugo at laman” upang sundin ang ayos ng tekstong Griyego, ngunit ipinaliwanag sa talababa ang mas karaniwang idyomang Filipino. Ginamit ang “gayunding mga bagay” upang malinaw na tumukoy pabalik sa dugo at laman nang hindi nagpapasok ng dagdag na doktrinal na pagpapaliwanag.
