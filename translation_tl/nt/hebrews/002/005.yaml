id: HEB.2.5
reference: Hebrews 2:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Οὐ γὰρ ἀγγέλοις ὑπέταξεν τὴν οἰκουμένην τὴν μέλλουσαν, περὶ ἧς λαλοῦμεν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/005.yaml
  text: For he did not subject the world to come to angels[a], about which we are speaking.
translation:
  language: tl
  text: Sapagkat hindi niya ipinasakop sa mga anghel ang daigdig na darating[a]—ang daigdig na tinatalakay natin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang tinitirahang daigdig na darating.”
    reason: Leksikal na alternatibo para sa οἰκουμένη, na maaaring idiin bilang tinitirahang daigdig.
lexical_decisions:
- source_word: Οὐ γὰρ
  choice: Sapagkat hindi
  rationale: Ipinapakita ng “sapagkat” ang paliwanag na kaugnayan sa naunang argumento, at tuwirang ipinahahayag ng “hindi” ang pagkakaila.
- source_word: ἀγγέλοις
  choice: sa mga anghel
  rationale: Sa konteksto ng Hebreo, mga makalangit na anghel ang tinutukoy, hindi mga taong mensahero.
- source_word: ὑπέταξεν
  choice: ipinasakop niya
  rationale: Ipinapanatili ng “ipinasakop” ang diwa ng paglalagay sa ilalim ng kapangyarihan o pamamahala. Ginamit ang panghalip na “niya” sa halip na tahasang idagdag ang “Diyos,” sapagkat hindi pinangalanan ang simuno sa Griyego.
- source_word: τὴν οἰκουμένην
  choice: ang daigdig
  rationale: Natural at marangal sa makabagong Filipino ang “daigdig,” habang ang mas tiyak na diwang ‘tinitirahang daigdig’ ay inilagay sa talababa bilang leksikal na alternatibo.
- source_word: τὴν μέλλουσαν
  choice: na darating
  rationale: Malinaw na ipinahahayag nito ang hinaharap na katangian ng daigdig nang hindi tinutukoy nang higit sa sinasabi ng teksto kung anong yugto o kaayusan iyon.
- source_word: περὶ ἧς λαλοῦμεν
  choice: ang daigdig na tinatalakay natin
  rationale: Ipinahahayag ng “tinatalakay natin” ang nagpapatuloy na diskurso. Ang pag-ulit sa “daigdig” ay natural sa Filipino at nililinaw ang tinutukoy ng pambabaeng panghalip na ἧς.
theological_decisions:
- issue: Ang tinutukoy ng “daigdig na darating”
  choice: Pinanatili bilang isang daigdig o kaayusang darating, nang hindi ito higit na tinukoy.
  alternative: Tukuyin ito bilang pangkalahatang tinitirahang lupa o, sa kabilang banda, bilang isang partikular na panahong teolohikal.
  rationale: Likas na tumutukoy ang τὴν οἰκουμένην τὴν μέλλουσαν sa daigdig na darating. Pinananatili ng salin ang eskatolohikal na pahiwatig at ang teolohikal na tensiyon ng konteksto nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
- issue: Hindi hayag na simuno ng ὑπέταξεν
  choice: “niya”
  alternative: “ng Diyos”
  rationale: Bagaman malamang na Diyos ang tinutukoy sa konteksto, hindi siya tahasang pinangalanan sa sugnay na Griyego. Pinananatili ng panghalip ang anyo at bahagyang pagiging di-hayag ng pinagmulan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Sapagkat” upang mapanatili ang lohikal na ugnayan, “ipinasakop” para sa pamamahala o kapangyarihan, at isang em dash upang natural na iugnay ang panghuling paliwanag sa pangunahing sugnay.
