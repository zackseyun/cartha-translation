  naturalness: Natural at marangal ang modernong Filipino ng talata. Ang pag-alis sa di-kailangang «siya ay» ay bahagyang nagpapadaloy sa pangungusap, at ang paglalagay ng marker b kaagad pagkatapos ng pariralang sinasaklaw nito ay mas malinaw.
