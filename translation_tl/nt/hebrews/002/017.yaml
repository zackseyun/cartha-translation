  text: ὅθεν ὤφειλεν κατὰ πάντα τοῖς ἀδελφοῖς ὁμοιωθῆναι, ἵνα ἐλεήμων γένηται καὶ πιστὸς ἀρχιερεὺς τὰ πρὸς τὸν θεόν, εἰς τὸ ἱλάσκεσθαι τὰς ἁμαρτίας τοῦ λαοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/017.yaml
  text: Therefore he had to become like his brothers in every respect[a], so that he might become a merciful and faithful high priest in the things pertaining to God[b], to make atonement for the sins of the people.
translation:
  language: tl
  text: Kaya kinailangan niyang maging katulad ng kanyang mga kapatid sa lahat ng bagay[a], upang maging maawain at tapat na punong pari sa mga bagay na nauukol sa Diyos, at magbayad-sala para sa mga kasalanan ng bayan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Masculine plural ang salitang Griyego, na literal na “mga kapatid na lalaki,” ngunit maaari itong tumukoy sa mas malawak na pamilya; ang “mga kapatid” sa Filipino ay maaaring kabilang ang mga lalaki at babae.
    reason: lexical_alternative
  - marker: b
    text: Maaari rin itong mangahulugang pagpawi ng mga kasalanan o, sa ibang pagbasa, pagpapawi ng galit dahil sa mga kasalanan.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅθεν
  choice: Kaya
  rationale: Likas na panandang Filipino para sa kongklusyon o bunga ng naunang pangangatwiran.
- source_word: ὤφειλεν
  choice: kinailangan niyang
  rationale: Ipinahahayag ang tunay na pangangailangan o pananagutan sa layunin ng pagliligtas nang hindi nagpapahiwatig ng panlabas na pamimilit.
- source_word: κατὰ πάντα
  choice: sa lahat ng bagay
  rationale: Pinananatili ang malawak at komprehensibong saklaw ng pagkakatulad.
- source_word: τοῖς ἀδελφοῖς
  choice: kanyang mga kapatid
  rationale: Natural sa Filipino at hindi nagtatakda ng kasarian ang salitang “kapatid,” habang napapanatili ang wikang pampamilya ng konteksto.
- source_word: ὁμοιωθῆναι
  choice: maging katulad
  rationale: Malinaw at natural na salin ng pagkakaroon ng ganap na pagkakatulad sa konteksto.
- source_word: ἵνα
  choice: upang
  rationale: Malinaw na naghahayag ng layunin.
- source_word: ἐλεήμων
  choice: maawain
  rationale: Karaniwan at angkop na salitang naglalarawan ng habag sa kontekstong makapari.
- source_word: πιστὸς
  choice: tapat
  rationale: Sinasaklaw ang pagiging maaasahan at matapat sa tungkulin sa harap ng Diyos.
- source_word: ἀρχιερεὺς
  choice: punong pari
  rationale: Direkta at kinikilalang salin ng titulong makapari.
- source_word: τὰ πρὸς τὸν θεόν
  choice: sa mga bagay na nauukol sa Diyos
  rationale: Pinananatili ang pormal at medyo malawak na saklaw ng pariralang tumutukoy sa ministeryong makapari sa harap ng Diyos.
- source_word: εἰς τὸ ἱλάσκεσθαι
  choice: at magbayad-sala para sa
  rationale: Nauunawaang salin sa kontekstong makapari na hindi tahasang nagpapasya kung ang diin ay pagpapawi ng kasalanan o pag-aalis ng galit; ang “at” ay natural na nagdurugtong sa layuning nauna nang ipinakilala ng “upang.”
- source_word: τὰς ἁμαρτίας τοῦ λαοῦ
  choice: mga kasalanan ng bayan
  rationale: Direktang pinananatili ang mga kasalanan bilang layon ng gawaing pagbabayad-sala at ang kolektibong “bayan” bilang may-ari ng mga ito.
theological_decisions:
- issue: Saklaw ng ἀδελφοῖς bilang pananalitang pampamilya
  choice: kanyang mga kapatid
  alternative: kanyang mga kapatid na lalaki
  rationale: Masculine plural ang anyong Griyego, ngunit maaaring gamitin ito sa mas malawak na pamilya. Natural nang maaaring tumukoy sa lalaki o babae ang “mga kapatid” sa Filipino, kaya naipapakita nito ang kontekstuwal na saklaw nang hindi binubura sa talababa ang anyo ng pinagmulan.
- issue: Kahulugan ng ἱλάσκεσθαι sa konteksto ng pagbabayad-sala
  choice: magbayad-sala para sa
  alternative: pawiin ang mga kasalanan; ihandog ang handog na nagpapawi ng galit dahil sa mga kasalanan
  rationale: Ang “magbayad-sala” ay maikli at angkop sa gawaing makapari, samantalang hindi nito sapilitang nililimitahan ang salita sa pagpapawi lamang ng kasalanan o sa pagpapawi ng galit. Inilalahad sa talababa ang dalawang posibleng diin.
translation_notes:
  register: Modernong Filipino na may marangal at bahagyang pormal na himig na angkop sa Kasulatan. Ginamit ang “punong pari,” “nauukol sa Diyos,” at “magbayad-sala” upang mapanatili ang bokabularyong makapari nang hindi nagiging labis na akademiko. Ang bawat talababa ay may katugmang marker sa pangunahing teksto.
