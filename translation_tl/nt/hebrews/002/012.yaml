id: HEB.2.12
reference: Hebrews 2:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: λέγων· Ἀπαγγελῶ τὸ ὄνομά σου τοῖς ἀδελφοῖς μου, ἐν μέσῳ ἐκκλησίας ὑμνήσω σε·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/012.yaml
  text: saying[a], “I will proclaim your name to my brothers[b]; in the midst of the assembly I will sing praise to you.”
translation:
  language: tl
  text: na nagsasabi, “Ipahahayag ko ang iyong pangalan sa aking mga kapatid[a]; sa gitna ng kapulungan[b] ay aawit ako ng papuri sa iyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay nasa anyong panlalaki, “mga kapatid na lalaki,” ngunit sa kontekstong ito maaari nitong saklawin ang lahat ng kapwa mananampalataya, lalaki at babae.
    reason: lexical_alternative
  - marker: b
    text: O “kongregasyon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: na nagsasabi
  rationale: Ang kasalukuyang participle ay nagpapakilala sa sipi at likas na nag-uugnay rito sa naunang pangungusap.
- source_word: Ἀπαγγελῶ
  choice: Ipahahayag ko
  rationale: Pinananatili nito ang hayagan at deklaratibong diwa ng pandiwa, hindi lamang ang simpleng pagsasabi.
- source_word: τὸ ὄνομά σου
  choice: ang iyong pangalan
  rationale: Tuwirang pinananatili ang “pangalan,” na maaaring magpahiwatig ng ipinakikilalang pagkakakilanlan at katangian nang hindi iyon pinalalawak sa salin.
- source_word: τοῖς ἀδελφοῖς μου
  choice: sa aking mga kapatid
  rationale: Ang “mga kapatid” ang natural na salin sa Filipino. Maaari itong tumukoy sa mga kapatid na lalaki o sa magkakapatid na kinabibilangan ng babae, kaya ipinapaliwanag sa talababa ang anyong panlalaki ng Griyego at ang posibleng saklaw nito sa konteksto.
- source_word: ἐν μέσῳ
  choice: sa gitna ng
  rationale: Pinananatili ang matayog at makatang anyo ng sipi habang malinaw pa rin sa makabagong Filipino.
- source_word: ἐκκλησίας
  choice: kapulungan
  rationale: Tumutukoy ito sa mga taong nagkakatipon at iniiwasang ipasok ang mas huling institusyonal na kahulugan ng “iglesia.”
- source_word: ὑμνήσω
  choice: aawit ako ng papuri
  rationale: Malinaw na ipinapahayag ang papuring inaawit, na siyang tiyak na diwa ng pandiwa.
- source_word: σε
  choice: sa iyo
  rationale: Natural na ipinakikita sa Filipino ang pinag-uukulan ng awit ng papuri.
theological_decisions:
- issue: Ang pampamilyang saklaw ng ἀδελφοῖς
  choice: mga kapatid
  alternative: mga kapatid na lalaki; mga kapatid na lalaki at babae
  rationale: Ang salitang Filipino na “kapatid” ay natural ngunit hindi tahasang nakatali sa kasarian. Hindi dinaragdagan ang pangunahing teksto, samantalang nililinaw sa talababa na panlalaki ang anyong Griyego ngunit maaaring saklawin sa konteksto ang buong sambahayan ng mga mananampalataya.
- issue: Ang kahulugan ng ἐκκλησία sa siping mula sa Lumang Tipan
  choice: kapulungan
  alternative: kongregasyon; iglesia
  rationale: Ipinapakita ng “kapulungan” ang nagkakatipong bayan ng Diyos nang hindi ipinapalagay ang isang mas huling institusyonal na kahulugan.
translation_notes:
  register: Makabago at malinaw na Filipino na may marangal at bahagyang makatang himig, angkop sa isang sipi mula sa Awit. Pinanatili ang balangkas at teolohikal na pag-igting ng Griyego nang hindi nagpapasok ng denominasyonal na termino.
