  text: while God also bore witness with signs and wonders and various miracles and distributions of the Holy Spirit according to his will.
translation:
  language: tl
  text: Kasabay nito, nagpatotoo rin ang Diyos sa pamamagitan ng mga tanda, mga kababalaghan, sari-saring makapangyarihang gawa,[a] at mga pamamahagi ng Banal na Espiritu[b] ayon sa kanyang kalooban.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sari-saring kapangyarihan” o “sari-saring himala.” Maaaring tumukoy ang salitang Griyego sa mga pagpapakita ng kapangyarihan at, sa kontekstong ito, sa mga himalang gawa.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga paglalaan” o “mga bahaging mula sa Banal na Espiritu.” Hindi tahasang idinaragdag sa teksto ang salitang “mga kaloob.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεπιμαρτυροῦντος τοῦ θεοῦ
  choice: Kasabay nito, nagpatotoo rin ang Diyos
  rationale: Ipinapakita ng “Kasabay nito” ang kasabay na kilos ng pandiwaring Griyego at ang kaugnayan nito sa naunang talata. Pinananatili ng “rin” ang dagdag na diwa ng συν-, at likas sa modernong Tagalog ang “nagpatotoo.”
- source_word: σημείοις τε καὶ τέρασιν
  choice: sa pamamagitan ng mga tanda, mga kababalaghan
  rationale: Ipinahahayag ng “sa pamamagitan ng” ang instrumental na gamit ng datibo. Karaniwan at malinaw na katumbas ang “mga tanda” at “mga kababalaghan” para sa magkaparis na mga terminong ito.
- source_word: ποικίλαις δυνάμεσιν
  choice: sari-saring makapangyarihang gawa
  rationale: Sa konteksto, tumutukoy ang δυνάμεις sa mga pagpapakita ng kapangyarihan, lalo na sa mga himalang gawa. Pinananatili ng salin ang diwa ng kapangyarihan nang hindi nililimitahan ang salita sa isang teknikal na katawagang “mga himala.”
- source_word: πνεύματος ἁγίου
  choice: ng Banal na Espiritu
  rationale: Ito ang likas at kinikilalang salin ng banal na titulo, at pinananatili nito ang genitibong ugnayan sa “mga pamamahagi.”
- source_word: μερισμοῖς
  choice: mga pamamahagi
  rationale: Tuwirang inilalarawan nito ang mga paghahati o paglalaan nang hindi idinaragdag ang salitang “mga kaloob,” na wala sa tekstong Griyego.
- source_word: κατὰ τὴν αὐτοῦ θέλησιν
  choice: ayon sa kanyang kalooban
  rationale: Likas na katumbas ito ng κατά na nagpapahayag ng pagsunod o pag-ayon. Sa balarila at daloy, pinakamalamang na tumutukoy ang panghalip sa Diyos.
theological_decisions:
- issue: Tinutukoy ng “kanyang” sa “ayon sa kanyang kalooban”
  choice: Ang Diyos ang pinakamalamang na tinutukoy.
  alternative: Maaaring iugnay nang mas maluwag sa Banal na Espiritu, bagaman hindi ito ang mas malamang ayon sa sintaks.
  rationale: Ang Diyos ang paksa ng “nagpatotoo” at siya ang kumikilos sa pamamagitan ng lahat ng kasunod na paraan. Gayunman, hindi pinalalawak ng salin ang parirala upang gumawa ng karagdagang doktrinal na pahayag.
- issue: Kahulugan ng μερισμοῖς
  choice: mga pamamahagi ng Banal na Espiritu
  alternative: mga pagkakaloob o mga bahaging mula sa Banal na Espiritu
  rationale: Hindi tahasang ginagamit ng Griyego ang salitang “mga kaloob.” Pinananatili ng “mga pamamahagi” ang lawak at bahagyang kalabuan ng orihinal.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Kasabay nito” upang maiugnay ang talata sa naunang pangungusap, at iniwasan ang sobrang teknikal o denominasyonal na pananalita.
