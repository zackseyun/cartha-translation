  source_fidelity: 'Malapit ang pangunahing salin sa Griyego: napapanatili nito ang pagiging angkop para sa Diyos, ang dalawang magkaibang gamit ng διά, ang maramihang ''mga pagdurusa,'' at ang hindi ginagawang tahasang layunin ang participle ἀγαγόντα. Gayunman, ang alternatibong ayos sa talababa d ay gumagamit ng ''niya,'' na maaaring magpahiwatig na ang tagapanguna, sa halip na ang Diyos, ang nagdadala sa mga anak tungo sa kaluwalhatian. Kailangang alisin ang kalabuan at panatilihing walang tinutukoy na bagong tagaganap.'
