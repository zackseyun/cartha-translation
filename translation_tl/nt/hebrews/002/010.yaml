base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/010.yaml
  text: For it was fitting for him—for whom are all things and through whom are all things—in bringing many sons to glory[d][c][b][a], to perfect the pioneer of their salvation through sufferings.
translation:
  language: tl
  text: Sapagkat nararapat sa kanya—na para sa kanya umiiral ang lahat ng bagay at sa pamamagitan niya ay umiiral ang lahat ng bagay—na, sa pagdadala ng maraming anak na lalaki tungo sa kaluwalhatian,[a] gawing ganap[c] sa pamamagitan ng mga pagdurusa ang tagapanguna[b] ng kanilang kaligtasan.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang literal na Griyego ay “maraming anak na lalaki.” Binibigyang-diin nito ang katayuan ng pagiging anak at tagapagmana, ngunit saklaw ng pananalita ang lahat ng mga anak ng Diyos, hindi lamang ang mga lalaki.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “tagapagtatag,” “pinuno,” o “may-akda” ng kanilang kaligtasan.
    reason: lexical_alternative
  - marker: c
    text: Ang “gawing ganap” dito ay nangangahulugang dalhin sa itinakdang layon o kaganapan sa pamamagitan ng mga pagdurusa, hindi ituwid ang isang kapintasang moral.
    reason: lexical_alternative
  - marker: d
    text: 'Maaari ring ayusin: “na gawing ganap sa pamamagitan ng mga pagdurusa ang tagapanguna ng kanilang kaligtasan sa pagdadala ng maraming anak na lalaki tungo sa kaluwalhatian.”'
    reason: previous_rendering
lexical_decisions:
- source_word: Ἔπρεπεν
  choice: nararapat
  rationale: Likas at marangal na katumbas ito ng impersonal na πρέπω at ipinahahayag ang pagiging angkop ng ginawa sa layunin ng Diyos.
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Pinananatili ang panghalip ng Griyego; nililinaw ng kasunod na mga parirala na Diyos ang tinutukoy.
- source_word: δι’ ὃν τὰ πάντα καὶ δι’ οὗ τὰ πάντα
  choice: na para sa kanya umiiral ang lahat ng bagay at sa pamamagitan niya ay umiiral ang lahat ng bagay
  rationale: Ipinakikita ng unang διά ang hantungan o layon ng lahat, at ng ikalawa ang pamamaraan o ahensiya. Ang pagdaragdag ng “umiiral” ay ginagawang malinaw at natural ang pahayag sa Tagalog.
- source_word: πολλοὺς υἱοὺς
  choice: maraming anak na lalaki
  rationale: Pinananatili ang tahasang panlalaking anyo at ang diwa ng pagiging anak at tagapagmana; nililinaw sa talababa na saklaw nito ang lahat ng mga anak ng Diyos.
- source_word: εἰς δόξαν
  choice: tungo sa kaluwalhatian
  rationale: Ipinahahayag ng “tungo sa” ang kilos patungo sa layon na nasa εἰς.
- source_word: ἀγαγόντα
  choice: sa pagdadala
  rationale: Pinananatili ang kaugnayan ng participle sa “gawing ganap” nang hindi ito ginagawang tiyak na sugnay ng layunin.
- source_word: ἀρχηγὸν
  choice: tagapanguna
  rationale: Sinasaklaw nito ang taong nauuna, nagbubukas ng daan, at nangunguna sa iba; mas angkop ito rito kaysa sa mas estatiko na “may-akda.”
- source_word: τῆς σωτηρίας αὐτῶν
  choice: ng kanilang kaligtasan
  rationale: Tuwirang inililipat ang genitive construction sa natural na Tagalog.
- source_word: διὰ παθημάτων
  choice: sa pamamagitan ng mga pagdurusa
  rationale: Pinananatili ang instrumental na διά at ang maramihang anyo ng παθήματα bilang mga kongkretong karanasan ng pagdurusa.
- source_word: τελειῶσαι
  choice: gawing ganap
  rationale: Pinananatili ang mahalagang bokabularyo ng τελειόω sa Hebreo; ipinapaliwanag sa talababa na tumutukoy ito sa pagdadala sa itinakdang layon, hindi sa pagwawasto ng kapintasang moral.
theological_decisions:
- issue: Kahulugan ng τελειῶσαι tungkol sa Anak
  choice: gawing ganap
  alternative: dalhin sa kaganapan / lubusang ihanda
  rationale: Sa konteksto ng Hebreo, ang pandiwa ay tumutukoy sa pagdadala sa itinakdang layon o ganap na katuparan ng tungkulin sa pamamagitan ng pagdurusa. Hindi nito ipinahihiwatig na may kapintasang moral ang Anak.
- issue: Saklaw ng πολλοὺς υἱοὺς
  choice: maraming anak na lalaki
  alternative: maraming anak
  rationale: Ang anyong Griyego ay panlalaki at maaaring magpahiwatig ng katayuan ng anak at tagapagmana. Pinanatili ito sa teksto, habang nililinaw sa talababa na hindi lamang mga lalaki ang saklaw.
- issue: Ugnayan ng ἀγαγόντα at τελειῶσαι
  choice: sa pagdadala … gawing ganap
  alternative: gawing ganap … upang dalhin
  rationale: Hindi ginawang tahasang sugnay ng layunin ang participle. Pinananatili ng salin ang mas bukas na ugnayang pangyayari o paraan na mas malapit sa ayos at gramatika ng Griyego.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit, na may bahagyang pormal na himig na angkop sa Kasulatan. Pinanatili ang mahaba ngunit malinaw na ayos ng pangungusap upang huwag gawing tiyak ang malamang na sadyang maluwag na ugnayan ng participle at infinitive sa Griyego.
