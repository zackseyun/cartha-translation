  terminology: Ang 'kaluwalhatian,' 'kaligtasan,' 'tagapanguna,' at 'gawing ganap' ay angkop at magkakaugnay sa rehistro ng Hebreo. Ang talababa para sa 'gawing ganap' ay wastong naglilinaw ng semantikong diwa nang hindi nagpapataw ng doktrinal na pagbasa.
