  text: εἰ γὰρ ὁ δι’ ἀγγέλων λαληθεὶς λόγος ἐγένετο βέβαιος, καὶ πᾶσα παράβασις καὶ παρακοὴ ἔλαβεν ἔνδικον μισθαποδοσίαν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/002.yaml
  text: For if the message spoken through angels proved firm[a], and every transgression and disobedience received a just penalty[b],
translation:
  language: tl
  text: Sapagkat kung ang mensaheng ipinahayag sa pamamagitan ng mga anghel ay napatunayang may bisa[a], at ang bawat paglabag at pagsuway ay tumanggap ng makatarungang kaparusahan[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Malamang na tumutukoy ito sa kautusan na, ayon sa tradisyong Hudyo, ay ibinigay sa pamamagitan ng mga anghel; ihambing ang Mga Gawa 7:53 at Galacia 3:19.
    reason: cross_reference
  - marker: b
    text: Maaari ring isalin na “makatarungang kabayaran” o “nararapat na ganti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δι’ ἀγγέλων λαληθεὶς λόγος
  choice: ang mensaheng sinabi sa pamamagitan ng mga anghel
  rationale: Ang λόγος ay tumutukoy rito sa isang ipinahayag na mensahe. Pinananatili ng “sa pamamagitan ng” ang diwa ng διά bilang ahensiya o paraan, at natural na isinasalin ng “sinabi” ang λαληθείς.
- source_word: ἀγγέλων
  choice: mga anghel
  rationale: Sa konteksto ng Hebreo 2, malamang na tumutukoy ito sa mga anghel sa tradisyong Judio tungkol sa pagkakabigay ng kautusan, hindi sa mga taong mensahero.
- source_word: ἐγένετο βέβαιος
  choice: napatunayang may bisa
  rationale: Ipinahihiwatig ng parirala na ang mensahe ay nanatiling matatag, balido, at maipatutupad. Iniiwasan nito ang mas makitid na diwa ng pagiging mapagkakatiwalaan lamang.
- source_word: πᾶσα παράβασις
  choice: ang bawat pagsuway
  rationale: Ang παράβασις ay paglabag o pagtawid sa itinakdang hangganan. Ang “pagsuway” ay malinaw at likas sa modernong Tagalog, bagaman may semantikong pagsasanib ito sa kasunod na termino.
- source_word: παρακοὴ
  choice: hindi pagsunod
  rationale: Ang παρακοή ay kabiguang makinig na nauuwi sa pagsuway. Ang “hindi pagsunod” ay nagpapanatili ng pagkakaiba nito sa παράβασις sa abot ng natural na Tagalog.
- source_word: ἔλαβεν
  choice: tumanggap
  rationale: Tuwirang pinananatili nito ang anyo ng Griyego, kung saan ang bawat paglabag at hindi pagsunod ang tumatanggap ng kaukulang ganti.
- source_word: ἔνδικον μισθαποδοσίαν
  choice: makatarungang kaparusahan
  rationale: Ang μισθαποδοσία ay kabayaran o pagganti, samantalang ang ἔνδικον ay nagpapahayag na ito ay makatarungan o nararapat. Sa negatibong konteksto, malinaw na naipahahayag ng “kaparusahan” ang hudisyal na puwersa.
theological_decisions:
- issue: Ang likas na katangian ng “mensaheng sinabi sa pamamagitan ng mga anghel”
  choice: Panatilihin sa pangunahing teksto ang pangkalahatang pariralang “mensahe,” habang ipinapaliwanag sa talababa ang malamang na pagtukoy sa kautusan.
  alternative: Isalin nang tuwiran bilang “kautusang ibinigay sa pamamagitan ng mga anghel.”
  rationale: Malakas ang pahiwatig ng konteksto at tradisyong Judio na ang tinutukoy ay ang kautusan sa Sinai, ngunit “mensahe” lamang ang tahasang sinasabi ng Griyego. Pinananatili ng salin ang pahiwatig nang hindi ginagawang tahasang pagkakakilanlan ang hindi tahasang sinabi.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong nakabitin ng sugnay na nagsisimula sa “Sapagkat kung,” sapagkat nagpapatuloy ang pangungusap sa Hebreo 2:3. Ginamit ang “may bisa” upang ihatid ang legal at mapanghamong lakas ng βέβαιος nang hindi labis na ipinapakahulugan.
