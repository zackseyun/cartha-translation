id: HEB.2.18
reference: Hebrews 2:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐν ᾧ γὰρ πέπονθεν αὐτὸς πειρασθείς, δύναται τοῖς πειραζομένοις βοηθῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/018.yaml
  text: For because he himself suffered when he was tempted[a], he is able to help those who are being tempted.
translation:
  language: tl
  text: Sapagkat siya mismo ay nagdusa nang siya'y tuksuhin,[a] kaya niyang tulungan ang mga tinutukso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “subukin” sa dalawang paglitaw: “Sapagkat siya mismo ay nagdusa nang siya''y subukin, kaya niyang tulungan ang mga sinusubok.” Ang pandiwang Griyego ay maaaring mangahulugang “tuksuhin” o “subukin,” depende sa konteksto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ γὰρ
  choice: Sapagkat
  rationale: Pinagsasama nito sa likas na Tagalog ang paliwanag na dala ng γὰρ at ang sanhi o batayang ipinahihiwatig ng ἐν ᾧ, nang hindi gumagamit ng mabigat at paulit-ulit na pananalita.
- source_word: πέπονθεν
  choice: ay nagdusa
  rationale: Ipinapahayag nito ang tunay at natapos na karanasan ng pagdurusa, habang malinaw sa kasunod na pangungusap ang nananatiling kabuluhan nito.
- source_word: αὐτὸς
  choice: siya mismo
  rationale: Pinananatili ang diin na ang Anak ay personal na dumanas ng tinutukoy na pagdurusa.
- source_word: πειρασθείς
  choice: nang siya'y tuksuhin
  rationale: Likas na isinasalin ang aorist participle bilang pangyayaring kasabay o kaugnay ng pagdurusa. Maaaring mangahulugan ang πειράζω ng pagtukso o pagsubok; ginamit sa teksto ang “tuksuhin,” at inilagay sa talababa ang “subukin.”
- source_word: δύναται
  choice: kaya niyang
  rationale: Malinaw at natural na ipinapahayag sa modernong Tagalog ang kakayahan ng Anak.
- source_word: τοῖς πειραζομένοις
  choice: ang mga tinutukso
  rationale: Pinananatili ng anyong pangkasalukuyan ang diwang ang mga taong ito ay kasalukuyang dumaranas ng pagtukso; saklaw rin ng talababa ang posibleng kahulugang “sinusubok.”
- source_word: βοηθῆσαι
  choice: tulungan
  rationale: Direkta, malinaw, at likas na katumbas ng pagtulong o pagdaluhong upang saklolohan ang nangangailangan.
theological_decisions:
- issue: Kahulugan ng πειράζω kapag tumutukoy kay Jesus at sa mga tao
  choice: tuksuhin / tinutukso
  alternative: subukin / sinusubok
  rationale: Pinananatili ng “tuksuhin” ang karaniwang diwa ng salita at ang kaugnayan sa Hebreo 4:15, nang hindi ipinahihiwatig na nagpadala si Jesus sa kasalanan. Dahil maaari ring mangahulugan ang pandiwang Griyego ng “subukin,” hayagang pinananatili ang alternatibong iyon sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “siya mismo” upang mapanatili ang diin ng Griyego, at iniwasan ang literal ngunit mabigat na dobleng pang-ugnay para sa ἐν ᾧ γὰρ.
