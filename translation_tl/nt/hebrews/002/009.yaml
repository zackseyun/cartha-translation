revisions:
- from: Ngunit nakikita natin si Jesus, na sa maikling panahon ay ginawang mas mababa kaysa sa mga anghel. Dahil tiniis niya ang kamatayan, pinutungan siya ng kaluwalhatian at karangalan, upang, nang hiwalay sa Diyos[a], lasapin niya ang kamatayan para sa bawat isa.
  to: Ngunit nakikita natin si Jesus, na sa maikling panahon ay ginawang mas mababa kaysa sa mga anghel at, dahil sa pagdurusa ng kamatayan, pinutungan ng kaluwalhatian at karangalan, upang, hiwalay sa Diyos[a], matikman niya ang kamatayan para sa bawat isa.
  rationale: Pinanatili ng rebisyon ang pangunahing pagbasa ng ibinigay na SBLGNT, χωρὶς θεοῦ, sa teksto at ang σημανanteng variant na χάριτι θεοῦ sa talababa. Inayos nito ang maling/di-natural na “nang hiwalay,” ginawang mas likas ang idyomang “matikman ang kamatayan,” at pinahusay ang gramatika ng talababa, nang hindi binabago ang kahulugan o nilulutas ang pinagtatalunang tekstuwal na diwa.
