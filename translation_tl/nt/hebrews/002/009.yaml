id: HEB.2.9
reference: Hebrews 2:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τὸν δὲ βραχύ τι παρ’ ἀγγέλους ἠλαττωμένον βλέπομεν Ἰησοῦν διὰ τὸ πάθημα τοῦ θανάτου δόξῃ καὶ τιμῇ ἐστεφανωμένον, ὅπως ⸀χωρὶς θεοῦ ὑπὲρ παντὸς γεύσηται θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/009.yaml
  text: But we see Jesus[a], who was made lower than the angels for a little while, crowned with glory and honor because of the suffering of death, so that by the grace of God he might taste death for everyone.
translation:
  language: tl
  text: Ngunit nakikita natin si Jesus, na sa maikling panahon ay ginawang mas mababa kaysa sa mga anghel at, dahil sa pagdurusa ng kamatayan, pinutungan ng kaluwalhatian at karangalan, upang, hiwalay sa Diyos[a], matikman niya ang kamatayan para sa bawat isa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang ilang manuskrito ay may “sa biyaya ng Diyos” sa halip na “hiwalay sa Diyos.”
    reason: textual_variant
lexical_decisions:
- source_word: βραχύ τι
  choice: sa maikling panahon
  rationale: Ipinapahayag ang temporal na diwa—limitadong panahon—na angkop sa konteksto at sa alusyon sa Awit 8, sa halip na antas lamang.
- source_word: παρ’ ἀγγέλους
  choice: kaysa sa mga anghel
  rationale: Ang παρά na may accusative pagkatapos ng ἐλαττόω ay naghahayag ng paghahambing.
- source_word: ἠλαττωμένον
  choice: ginawang mas mababa
  rationale: Pinananatili ang passive at comparative na diwa nang hindi ito nililimitahan sa emosyonal na pagpapakumbaba.
- source_word: διὰ τὸ πάθημα τοῦ θανάτου
  choice: Dahil tiniis niya ang kamatayan
  rationale: Ang διά na may accusative ay natural na nagpapahayag ng dahilan. Ang pandiwang 'tiniis' ay malinaw na naghahatid ng pagdanas ng paghihirap na humantong sa kamatayan.
- source_word: δόξῃ καὶ τιμῇ ἐστεφανωμένον
  choice: pinutungan siya ng kaluwalhatian at karangalan
  rationale: Pinananatili ang larawan ng pagpuputong at ang dalawang magkaugnay na dangal ng pagtataas kay Jesus.
- source_word: ὅπως
  choice: upang
  rationale: Pinananatili ang layunin o kinalabasan na ipinakikilala ng sugnay.
- source_word: χωρὶς θεοῦ
  choice: nang hiwalay sa Diyos
  rationale: Direktang sinusunod ang ibinigay na SBLGNT reading at pinananatili ang tunay na tekstuwal at teolohikal na tensiyon nang hindi ito ipinapaliwanag sa mismong talata.
- source_word: ὑπὲρ παντός
  choice: para sa bawat isa
  rationale: Inihahatid ang distributive at personal na diwa ng singular na παντός at ang kapakinabangang kinakatawan ng ὑπέρ.
- source_word: γεύσηται θανάτου
  choice: lasapin niya ang kamatayan
  rationale: Pinananatili ang matingkad at nauunawaang metapora ng γεύομαι sa halip na gawing payak na 'maranasan.'
theological_decisions:
- issue: Tekstuwal na variant sa sugnay ng layunin
  choice: nang hiwalay sa Diyos (χωρὶς θεοῦ)
  alternative: sa biyaya ng Diyos (χάριτι θεοῦ)
  rationale: Ang ibinigay na orihinal-language edition ay may χωρὶς θεοῦ, kaya ito ang nasa pangunahing teksto. Dahil sinauna at malaganap ang variant na χάριτι θεοῦ at malaki ang epekto nito sa kahulugan, malinaw itong itinala sa talababa sa halip na tahimik na piliin o alisin.
translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Hinati sa dalawang pangungusap ang mahabang Griyegong ayos para sa linaw, ngunit pinanatili ang lohikal na ugnayan ng pagpapababa, pagdurusa, pagpuputong, at layunin. Ang tekstuwal na variant ay inilagay sa mismong pariralang pinagtatalunan.
