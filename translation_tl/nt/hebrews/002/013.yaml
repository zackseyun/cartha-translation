  source_fidelity: 'Tumpak na naihahatid ang dalawang pormula ng pagsipi (καὶ πάλιν), ang mariing unang panauhan, ang hinaharap na pagpapahayag ng pagtitiwala, at ang ikalawang sipi: “Narito ako, at ang mga anak na ibinigay sa akin ng Diyos.” Hindi nagdaragdag ang salin ng isang nagsasalita na wala sa Griyego.'
  naturalness: Likas at malinaw ang makabagong Tagalog. Ang “Ako ay magtitiwala sa kanya” ay bahagyang pormal ngunit angkop sa marangal na rehistro ng siniping Kasulatan at pinananatili nito ang diin ng tahasang Ἐγώ. Ang “Narito ako” ay mabuting katumbas ng Ἰδοὺ ἐγώ.
  terminology: Ang “magtitiwala,” “Diyos,” at “mga anak” ay angkop at pare-pareho sa kahulugan at rehistro ng Griyego. Ang “sa kanya” ay natural na katumbas ng ἐπ’ αὐτῷ sa ganitong gamit. Wasto ring hindi ipinapasok sa pangunahing teksto ang pagkakakilanlan ng nagsasalita; maayos itong ipinaliliwanag sa talababa.
