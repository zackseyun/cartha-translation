  text: καὶ πάλιν· Ἐγὼ ἔσομαι πεποιθὼς ἐπ’ αὐτῷ· καὶ πάλιν· Ἰδοὺ ἐγὼ καὶ τὰ παιδία ἅ μοι ἔδωκεν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/013.yaml
  text: And again[a], “I will put my trust in him.” And again, “Behold[d][c][b], I and the children whom God has given me.”
translation:
  language: tl
  text: At muli, “Ako ay magtitiwala sa kanya.”[a] At muli, “Narito ako, at ang mga anak na ibinigay sa akin ng Diyos.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Ako ay mananatiling nagtitiwala sa kanya,” o “Magkakaroon ako ng pagtitiwala sa kanya.”'
    reason: lexical_alternative
  - marker: b
    text: Hindi pinangalanan sa Griyego ng talatang ito ang nagsasalita; sa konteksto, ikinakapit ng Hebreo ang mga siping ito sa Anak.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ πάλιν
  choice: At muli
  rationale: Pinananatili ang maikling pormula ng pagpapakilala sa sipi; walang pandiwang katumbas ng “sinabi niya” sa Griyego.
- source_word: Ἐγὼ ἔσομαι πεποιθὼς
  choice: Ako ay magtitiwala
  rationale: Likas itong pahayag sa makabagong Tagalog para sa patuloy o matatag na saloobin ng pagtitiwala na ipinahihiwatig ng periphrastic na anyo sa Griyego.
- source_word: ἐπ’ αὐτῷ
  choice: sa kanya
  rationale: Ang “magtiwala sa kanya” ang karaniwang katutubong parirala sa Tagalog at tumpak na naghahatid ng diwa ng Griyegong pang-ukol.
- source_word: Ἰδοὺ
  choice: Narito
  rationale: Pinananatili ang mariing pantawag-pansin at ang marangal na himig ng sipi nang hindi gumagamit ng lipas o di-likas na pananalita.
- source_word: τὰ παιδία
  choice: ang mga anak
  rationale: Sa konteksto ng sipi, tumutukoy ang παιδία sa mga anak bilang isang pangkat na may kaugnayan sa nagsasalita; mas natural dito ang “mga anak” kaysa “maliliit na bata.”
- source_word: ἅ μοι ἔδωκεν ὁ θεός
  choice: na ibinigay sa akin ng Diyos
  rationale: Tuwirang inilalarawan ng sugnay ang mga anak. Ang simpleng naganap na “ibinigay” ay kaayon ng aorist na ἔδωκεν at natural sa Tagalog.
theological_decisions:
- issue: Pagkakakilanlan ng nagsasalita sa mga sipi at ang kristolohikal na gamit nito
  choice: Iniwan sa unang panauhan ang mga sipi at hindi pinangalanan ang nagsasalita sa pangunahing teksto.
  alternative: Idagdag ang “sinabi niya” o “sinabi ng Anak/Mesiyas” upang hayagang tukuyin ang nagsasalita.
  rationale: Hindi pinangalanan ng Griyego ang nagsasalita sa talatang ito, bagaman ikinakapit ng konteksto ng Hebreo ang mga sipi sa Anak. Pinananatili ng salin ang anyo at tensiyong ito sa halip na ilagay sa pangunahing teksto ang isang paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang buong anyong “Ako ay” upang mapanatili ang diin ng tahasang Ἐγώ at ang pormal na himig ng siniping Kasulatan; iniwasan ang pagdaragdag ng pandiwa o pagkakakilanlan ng nagsasalita na wala sa Griyego.
