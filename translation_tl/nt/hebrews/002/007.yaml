  text: ἠλάττωσας αὐτὸν βραχύ τι παρ’ ἀγγέλους, δόξῃ καὶ τιμῇ ἐστεφάνωσας ⸀αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/007.yaml
  text: You made him lower than the angels for a little while[a]; you crowned him with glory and honor.
translation:
  language: tl
  text: Sa maikling panahon, ginawa mo siyang mas mababa kaysa sa mga anghel[a]; pinutungan mo siya ng kaluwalhatian at karangalan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Ginawa mo siyang bahagyang mas mababa kaysa sa mga anghel.” Maaaring tumukoy ang pariralang Griyego sa antas sa halip na sa tagal.
    reason: alternative_reading
lexical_decisions:
- source_word: ἠλάττωσας
  choice: ginawa mo siyang mas mababa
  rationale: 'Ang aorist active indicative na ἠλάττωσας ay may sanhi at paghahambing na diwa rito: ginawa siyang mas mababa, kasunod ang pamantayan ng paghahambing na παρ’ ἀγγέλους.'
- source_word: αὐτὸν
  choice: siya
  rationale: Pinananatili ang panghalip na tumutukoy sa lalaking katauhan sa sipi, nang hindi nagdaragdag ng pangngalang wala sa sugnay.
- source_word: βραχύ τι
  choice: sa maikling panahon
  rationale: Maaaring tumukoy ang parirala sa tagal o antas. Pinili sa pangunahing teksto ang temporal na diwa, na likas sa konteksto ng Hebreo 2, habang inilalagay sa talababa ang posibleng diwa ng antas.
- source_word: παρ’ ἀγγέλους
  choice: kaysa sa mga anghel
  rationale: Sa paghahambing pagkatapos ng ἐλαττόω, ang παρά na may accusative ay nangangahulugang “kaysa”; natural sa Filipino ang “mga anghel.”
- source_word: δόξῃ
  choice: ng kaluwalhatian
  rationale: Ang dative ay nagsasaad ng ipinantong o ipinutong sa kanya; sa konstruksyong Filipino na “pinutungan ... ng,” ang “kaluwalhatian” ang natural at tumpak na katumbas.
- source_word: τιμῇ
  choice: at karangalan
  rationale: Ang τιμή ay karangalang ipinagkaloob na katayuan; pinananatili ng “kaluwalhatian at karangalan” ang magkaugnay na pares.
- source_word: ἐστεφάνωσας
  choice: pinutungan mo
  rationale: Ang aorist active indicative ay isinalin sa payak na aspektong ganap sa Filipino; ang “pinutungan” ay ang natural na pandiwa para sa pagkokorona o paglalagay ng putong.
- source_word: αὐτόν
  choice: siya
  rationale: Pinananatili ang inuulit na object pronoun upang sundan ang kayarian at linaw ng Griyego.
theological_decisions:
- issue: Diwa ng βραχύ τι sa sipi mula sa Awit 8 na inilalapat sa Hebreo
  choice: 'Temporal: “sa maikling panahon”'
  alternative: 'Antas: “nang kaunti kaysa sa mga anghel” / “bahagyang mas mababa kaysa sa mga anghel”'
  rationale: Parehong maaaring ipakahulugan sa Griyego ang tagal at antas. Malakas ang pagkakatugma ng temporal na diwa sa agarang konteksto ng pansamantalang pagpapakababa at kasunod na pagdakila, ngunit pinananatili sa talababa ang tunay na alternatibong pagbasa upang hindi alisin ang interpretatibong tensiyon.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Inuna ang natural na ayos na “Sa maikling panahon” upang malinaw na maiugnay ang parirala sa tagal ng pagiging mas mababa at maiwasan ang alanganing “ginawa ... sa maikling panahon,” na maaaring magpahiwatig na maikli lamang ang paggawa mismo.
