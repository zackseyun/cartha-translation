  yaml_path: translation/nt/hebrews/002/016.yaml
  text: For surely it is not angels that he helps[a], but the offspring of Abraham.
translation:
  language: tl
  text: Sapagkat malinaw na hindi mga anghel ang kanyang tinutulungan,[a] kundi ang supling ni Abraham.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hinahawakan.” Ang pandiwang Griyego ay maaaring literal na mangahulugang “humawak,” ngunit dito ay malamang na nangangahulugang “tumulong” o “sumaklolo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δήπου
  choice: tiyak na
  rationale: Ipinahahayag nito ang mariing palagay na malinaw o tanggap na ng mga mambabasa; natural na naihahatid ng “tiyak na” ang diin nang hindi nagiging labis.
- source_word: ἀγγέλων
  choice: mga anghel
  rationale: Tuwirang katumbas ito ng pangmaramihang anyo at siyang unang panig ng paghahambing.
- source_word: ἐπιλαμβάνεται
  choice: tinutulungan
  rationale: Sa kontekstong ito, malamang na idyomatikong tumutukoy ang pandiwa sa pagdamay o pagsaklolo, hindi lamang sa literal na paghawak. Pinananatili sa talababa ang mas literal na posibilidad.
- source_word: σπέρματος Ἀβραὰμ
  choice: ang binhi ni Abraham
  rationale: Pinananatili ng “binhi” ang kolektibong pang-isahang anyo at ang tunay na lawak ng kahulugan ng σπέρμα, na maaaring tumukoy sa supling o mga inapo, nang hindi agad nilulutas ang posibleng teolohikal na pahiwatig.
- source_word: οὐ γὰρ ... ἀλλὰ
  choice: Sapagkat ... hindi ... kundi ...
  rationale: Likas nitong naihahatid sa Tagalog ang paliwanag at mariing pagsalungat ng dalawang pangkat.
theological_decisions:
- issue: Kahulugan ng ἐπιλαμβάνεται kaugnay ng pagliligtas ni Cristo
  choice: Isinalin sa pangunahing teksto bilang “tinutulungan,” na nagpapahayag na ang Anak ay sumasaklolo sa binhi ni Abraham, hindi sa mga anghel.
  alternative: “hinahawakan” o “kumakapit sa,” na maaaring unawain bilang paghawak o pag-angkin sa kalikasang pantao.
  rationale: Mas angkop sa daloy ng konteksto ang idyomatikong diwang pagtulong o pagsaklolo, ngunit may tunay na leksikal at makasaysayang batayan ang literal na “humawak.” Kaya hindi ito inalis kundi inilagay sa talababa upang mapanatili ang teolohikal na tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “tinutulungan” para sa likas na pagbasa, habang pinanatili ng “binhi ni Abraham” ang kolektibong anyo at posibleng pahiwatig ng orihinal.
