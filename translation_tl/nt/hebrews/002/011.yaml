id: HEB.2.11
reference: Hebrews 2:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅ τε γὰρ ἁγιάζων καὶ οἱ ἁγιαζόμενοι ἐξ ἑνὸς πάντες· δι’ ἣν αἰτίαν οὐκ ἐπαισχύνεται ἀδελφοὺς αὐτοὺς καλεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/011.yaml
  text: For both the one who sanctifies and those who are being sanctified are all from one[a]; for this reason he is not ashamed to call them brothers[b],
translation:
  language: tl
  text: Sapagkat ang nagpapabanal at ang mga pinababanal ay pawang nagmula sa iisa[a]. Dahil dito, hindi niya ikinahihiyang tawagin silang mga kapatid[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagmula sa iisang Ama,” “may iisang pinagmulan,” o “nagmula sa iisang ninuno.” Hindi tinutukoy ng Griyego kung sino o ano ang “iisa.”
    reason: alternative_reading
  - marker: b
    text: Panlalaking maramihan ang salitang Griyego, ngunit sa konteksto ay maaaring saklawin ng “mga kapatid” ang mas malawak na sambayanan ng mga mananampalataya, kabilang ang mga babae.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἁγιάζων
  choice: ang nagpapabanal
  rationale: Ang substantival na present active participle ay likas na naipahahayag sa Filipino bilang “ang nagpapabanal.” Pinananatili nito ang tuwirang kaugnayan sa kabanalan at ang aktibong gawain ng tinutukoy.
- source_word: οἱ ἁγιαζόμενοι
  choice: ang mga pinababanal
  rationale: Ang present passive participle ay isinalin sa anyong patuloy o dinamikong pasibo. Ang “pinababanal” ay natural sa modernong Filipino at tumutugma sa parehong ugat ng ἁγιάζω.
- source_word: ἐξ ἑνὸς
  choice: nagmula sa iisa
  rationale: Hindi tinutukoy ng Griyego kung sino o ano ang “iisa.” Pinananatili ng salin ang kalabuan sa halip na idagdag ang “Ama,” “ninuno,” o “pinagmulan.”
- source_word: πάντες
  choice: pawang
  rationale: Saklaw nito kapwa ang nagpapabanal at ang mga pinababanal, at malinaw na ipinahahayag ang inklusibong diin ng πάντες.
- source_word: δι’ ἣν αἰτίαν
  choice: Dahil dito
  rationale: Natural at malinaw itong Filipino para sa idyomang nagpapakilala sa bunga o dahilan batay sa naunang pahayag.
- source_word: οὐκ ἐπαισχύνεται
  choice: hindi niya ikinahihiya
  rationale: Pinananatili nito ang kahulugan ng kahihiyan at ang kasalukuyang pananaw ng pandiwa nang hindi nagpaparami ng salita.
- source_word: ἀδελφοὺς
  choice: mga kapatid
  rationale: Ang “kapatid” sa Filipino ay walang likas na kasariang gramatikal at natural na maaaring tumukoy sa mga lalaki at babae, bagaman panlalaking maramihan ang anyong Griyego.
- source_word: καλεῖν
  choice: tawagin
  rationale: Ito ang tuwiran at likas na katumbas ng infinitive sa pariralang “hindi niya ikinahihiyang tawagin.”
theological_decisions:
- issue: Ang tinutukoy ng ἐξ ἑνὸς
  choice: Iniwan sa pangunahing teksto bilang “nagmula sa iisa.”
  alternative: “nagmula sa iisang Ama,” “may iisang pinagmulan,” o “nagmula sa iisang ninuno”
  rationale: Hindi tahasang pinapangalanan ng Griyego ang tinutukoy ng “iisa,” kaya hindi nilutas ng salin ang tunay na eksehetikal at teolohikal na kalabuan.
- issue: Ang di-binanggit na simuno ng οὐκ ἐπαισχύνεται
  choice: “niya,” na sa konteksto ay tumutukoy sa Anak na nagpapabanal
  alternative: Tahasan itong gawing “hindi ikinahihiya ni Jesus” o “hindi ikinahihiya ng Anak”
  rationale: Sapat na kinikilala ng konteksto ang simuno, ngunit hindi nagdaragdag ang talata mismo ng pangalang “Jesus” o titulong “Anak.” Pinananatili ng panghalip ang anyo ng pinagmulan.
- issue: Saklaw ng ἀδελφοὺς
  choice: “mga kapatid”
  alternative: “mga kapatid na lalaki”
  rationale: Bagaman panlalaking maramihan ang salitang Griyego, walang kasariang gramatikal ang karaniwang salitang Filipino na “kapatid,” at maaari nitong likas na saklawin ang buong sambayanan ng mga mananampalataya nang hindi nagpapasok ng di-kailangang paglilimita.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pamilyar na teolohikal na salitang “nagpapabanal/pinababanal,” habang iniwasang tukuyin nang higit sa Griyego ang “iisa.” Ang kuwit sa hulihan ay pinanatili dahil bahagi ang talata ng nagpapatuloy na pangungusap sa kasunod na sipi.
