  text: For this reason[a], we must pay much closer attention to what we have heard, lest we drift away.
translation:
  language: tl
  text: Dahil dito, kailangan nating lalo pang pagtuunan ng pansin ang mga narinig natin, upang hindi tayo maanod palayo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “makalampas tayo” o “mawaglit sa atin ang mga iyon.” Ang pandiwang Griyego ay naglalarawan ng pag-anod, pagkalampas, o pagdulas palayo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Dahil dito
  rationale: Likas na pariralang Filipino na malinaw na nag-uugnay sa pangangatwirang nauna.
- source_word: δεῖ
  choice: kailangan nating
  rationale: Tuwirang ipinahahayag ang pangangailangan at likas na isinasama ang ἡμᾶς bilang gumagawa ng pawatas.
- source_word: περισσοτέρως
  choice: higit na
  rationale: Pinananatili ang paghahambing at pagpapatindi nang hindi nagdaragdag ng antas na hindi tahasang nasa Griyego.
- source_word: προσέχειν ἡμᾶς
  choice: pag-ukulan natin ng pansin
  rationale: Natural at marangal na Filipino para sa masusing pagbibigay-pansin o pagtalima.
- source_word: τοῖς ἀκουσθεῖσιν
  choice: ang mga narinig natin
  rationale: Pinananatili ang di-tiyak na pagtukoy sa mga bagay na narinig, sa halip na tahasang idagdag ang salitang “mensahe.”
- source_word: μήποτε
  choice: upang hindi
  rationale: Natural na pagpapahayag sa modernong Filipino ng babala tungkol sa maaaring masamang kahinatnan.
- source_word: παραρυῶμεν
  choice: tayo matangay palayo
  rationale: Pinananatili ang larawang maaaring tumukoy sa pag-anod o pagkalampas, at malinaw na ang mga tagapakinig ang nanganganib na lumayo.
theological_decisions:
- issue: Larawan ng babala sa παραρυῶμεν
  choice: “tayo matangay palayo” bilang paglayo ng mga nakarinig
  alternative: “makalampas tayo” o “mawaglit sa atin ang mga iyon”
  rationale: Maaaring ilarawan ng pandiwa ang pag-anod ng mga tagapakinig o ang pagkalagpas/pagkawala ng narinig. Ang napiling salin ay umaayon sa unang panauhang maramihan at sa daloy ng babala, ngunit hindi tinutukoy ang isang sistematikong doktrina tungkol sa apostasya.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “pag-ukulan ng pansin” upang maging likas ang panawagan, at inilagay ang talababa pagkatapos mismo ng matalinghagang pandiwa.
