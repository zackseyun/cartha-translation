  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πάντα ὑπέταξας ὑποκάτω τῶν ποδῶν αὐτοῦ· ἐν ⸂τῷ γὰρ⸃ ⸀ὑποτάξαι τὰ πάντα οὐδὲν ἀφῆκεν αὐτῷ ἀνυπότακτον. νῦν δὲ οὔπω ὁρῶμεν αὐτῷ τὰ πάντα ὑποτεταγμένα·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/008.yaml
  text: You subjected all things under his feet.” For in subjecting all things to him[a], he left nothing not subjected to him[b]. But now we do not yet see all things subjected to him.
translation:
  language: tl
  text: “Pinasakop mo ang lahat ng bagay sa ilalim ng kanyang mga paa.”[a] Sapagkat sa pagpapasakop niya ng lahat ng bagay sa kanya,[b] wala siyang iniwang anuman na hindi napasakop sa kanya. Ngunit ngayon, hindi pa natin nakikitang napasakop sa kanya ang lahat ng bagay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kanyang” at “kanya” ay umaalingawngaw sa Awit 8. Sa konteksto, maaaring tumukoy ang mga ito sa sangkatauhan ayon sa orihinal na diwa ng awit at kay Jesus ayon sa paglalapat nito sa Hebreo.
    reason: cross_reference
  - marker: b
    text: 'Maaari ring isalin: “Sapagkat nang pinasakop niya sa kanya ang lahat ng bagay.” Maaaring unawain sa paraang temporal ang kayariang Griyego.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα / τὰ πάντα
  choice: ang lahat ng bagay
  rationale: Pinananatili ang malawak at pangkalahatang saklaw ng neuter plural at natural itong pakinggan sa makabagong Tagalog.
- source_word: ὑπέταξας / ὑποτάξαι / ὑποτεταγμένα
  choice: ipinasailalim / pagpapasailalim / napasailalim
  rationale: Ginamit ang iisang salitang-ugat upang mapanatili ang pag-uulit ng ὑποτάσσω at ang diwa ng pagpapasakop o paglalagay sa ilalim ng kapangyarihan.
- source_word: ὑποκάτω τῶν ποδῶν αὐτοῦ
  choice: sa ilalim ng kanyang mga paa
  rationale: Natural na idyoma ito ng paghahari at pagpapasailalim at pinananatili nito ang alusyon sa Awit 8.
- source_word: ἐν τῷ ... ὑποτάξαι
  choice: sa pagpapasailalim niya
  rationale: Pinananatili ang konseptuwal na anyo ng articular infinitive; ang posibleng temporal na pagbasa ay inilagay sa talababa.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Malinaw na ipinakikitang paliwanag ang kasunod na pangungusap sa naunang sipi.
- source_word: οὐδὲν ἀφῆκεν
  choice: wala siyang iniwang anuman
  rationale: Natural na Tagalog na nagpapanatili sa ganap na saklaw ng pahayag.
- source_word: ἀνυπότακτον
  choice: hindi napasailalim
  rationale: Malinaw na inilalarawan ang kalagayang hindi sakop habang pinananatili ang ugnayan sa paulit-ulit na pandiwang 'ipasailalim.'
- source_word: νῦν δὲ
  choice: Ngunit ngayon
  rationale: Tuwirang ipinahahayag ang kaibahan ng ipinahayag sa Kasulatan at ng kasalukuyang nakikita.
- source_word: οὔπω ὁρῶμεν
  choice: hindi pa natin nakikita
  rationale: Natural na Tagalog para sa kasalukuyang kalagayan ng hindi pa nakikitang katuparan.
- source_word: ὑποτεταγμένα
  choice: napasailalim
  rationale: Ipinahihiwatig ng anyong ito ang kalagayang bunga ng naganap na pagpapasailalim nang hindi nagiging mabigat ang pangungusap.
theological_decisions:
- issue: Tinutukoy ng αὐτοῦ / αὐτῷ
  choice: Pinanatili ang mga panghalip na “kanyang/kanya” nang hindi tahasang pinangalanan ang tinutukoy.
  alternative: Tukuyin bilang sangkatauhan/tao ayon sa Awit 8, o bilang Anak/Jesus ayon sa pagkakapit ng Hebreo.
  rationale: Sa orihinal na diwa ng Awit 8, maaaring tumukoy ang mga panghalip sa sangkatauhan, samantalang sa argumento ng Hebreo ay humahantong ang pagkakapit kay Jesus. Pinananatili ng salin ang sadyang tensiyong ito.
- issue: Paksa ng pagpapasailalim
  choice: Isinalin bilang “pagpapasailalim niya ... sa kanya,” na pinananatiling magkahiwalay ang gumagawa at ang pinagpapasailaliman nang hindi nagdaragdag ng pangalan.
  alternative: Tahasan itong gawing “pagpapasailalim ng Diyos ... sa tao/Jesus.”
  rationale: Hindi tahasang pinangalanan ng Griyego ang mga tinutukoy sa talatang ito; ang pagdaragdag ng pangalan ay maaaring maagang magpasya sa interpretasyon.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang mas pormal na “ipinasailalim” dahil mahalaga sa argumento ang paulit-ulit na bokabularyo ng pagpapasakop. Iniwasang tukuyin nang tahasan ang mga panghalip upang huwag lutasin sa salin ang ambiguwidad ng Awit 8 at ng kristolohikal na pagkakapit nito sa Hebreo.
