  text: εἴρηκεν γάρ που περὶ τῆς ἑβδόμης οὕτως· Καὶ κατέπαυσεν ὁ θεὸς ἐν τῇ ἡμέρᾳ τῇ ἑβδόμῃ ἀπὸ πάντων τῶν ἔργων αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/004.yaml
  text: 'For he has spoken somewhere about the seventh day in this way: “And God rested on the seventh day from all his works,”[a][b]'
translation:
  language: tl
  text: 'Sapagkat sinabi niya sa isang lugar tungkol sa ikapitong araw sa ganitong paraan: “At nagpahinga ang Diyos sa ikapitong araw mula sa lahat ng kanyang mga gawa.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa isang lugar.” Hindi ito nagpapahiwatig ng pag-aalinlangan sa awtoridad ng sipi, kundi isang di-tiyak na pagpapakilala sa pinagmulan ng sipi.
    reason: lexical_alternative
  - marker: b
    text: O “tumigil.” Maaaring idiin ng pandiwa ang pagtigil sa paggawa; ginamit ang “nagpahinga” upang mapanatili ang kaugnayan sa Genesis 2:2 at sa tema ng kapahingahan sa Hebreo 3–4.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴρηκεν
  choice: sinabi niya
  rationale: Ang perpektong anyo ay tumutukoy sa naunang pahayag na nananatiling may bisa; natural sa modernong Tagalog ang “sinabi niya” sa ganitong pagpapakilala ng sipi.
- source_word: γάρ
  choice: Sapagkat
  rationale: Nagbibigay ito ng paliwanag o batayan para sa naunang pangangatwiran.
- source_word: που
  choice: sa isang bahagi ng Kasulatan
  rationale: Ipinahihiwatig ng που ang di-tiyak na lokasyon ng sipi. Idinagdag ang “ng Kasulatan” bilang malinaw at likas na pagpapahayag ng konteksto, hindi bilang pag-aalinlangan sa awtoridad nito.
- source_word: περὶ τῆς ἑβδόμης
  choice: tungkol sa ikapitong araw
  rationale: Ang pambabaeng pang-uri na may pantukoy ay tumutukoy sa “araw,” kaya tahasang isinama ito para sa kalinawan.
- source_word: οὕτως
  choice: —
  rationale: Ang puwersa nitong pagpapakilala sa eksaktong paraan ng pagkakasabi ay likas na naihahatid sa Tagalog ng tutuldok bago ang sipi.
- source_word: Καὶ
  choice: At
  rationale: Pinanatili bilang bahagi ng sipi mula sa Genesis.
- source_word: κατέπαυσεν
  choice: nagpahinga
  rationale: Pinananatili nito ang mahalagang ugnayan sa Genesis 2:2 at sa tema ng kapahingahan sa Hebreo 3–4, habang maaaring mangahulugan din ng pagtigil sa paggawa.
- source_word: ὁ θεὸς
  choice: ang Diyos
  rationale: Tuwirang salin ng simuno.
- source_word: ἐν τῇ ἡμέρᾳ τῇ ἑβδόμῃ
  choice: sa ikapitong araw
  rationale: Ito ang likas na paraan sa Tagalog ng pagtukoy sa araw kung kailan naganap ang kilos.
- source_word: ἀπὸ πάντων τῶν ἔργων αὐτοῦ
  choice: mula sa lahat ng kanyang mga ginawa
  rationale: Ang “mula sa” ay kumakatawan sa ἀπό, at ang “mga ginawa” ay natural na Tagalog para sa maramihang ἔργων sa konteksto ng paglikha.
theological_decisions:
- issue: Ang paghinto ng Diyos kaugnay ng teolohiya ng kapahingahan sa Hebreo
  choice: nagpahinga
  alternative: tumigil sa paggawa
  rationale: Ang “nagpahinga” ay nagpapanatili sa leksikal at tematikong ugnayan ng Genesis 2:2 sa pangangatwiran ng Hebreo 3–4 nang hindi kinakailangang ipahiwatig na napagod ang Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “sa isang bahagi ng Kasulatan” sa halip na literal ngunit maaaring malabong “sa isang lugar,” at pinanatili ang “nagpahinga” bilang mahalagang terminong nag-uugnay sa sipi at sa mas malawak na pangangatwiran.
