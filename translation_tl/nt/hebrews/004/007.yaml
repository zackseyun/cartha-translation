  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πάλιν τινὰ ὁρίζει ἡμέραν, Σήμερον, ἐν Δαυὶδ λέγων μετὰ τοσοῦτον χρόνον, καθὼς ⸀προείρηται, Σήμερον ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε, μὴ σκληρύνητε τὰς καρδίας ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/007.yaml
  text: 'Again he appoints a certain day[a], “Today,” saying through David after so long a time, just as has been said before: “Today, if you hear his voice, do not harden your hearts.”'
translation:
  language: tl
  text: 'Muli, nagtakda siya ng isang tiyak na araw—“Ngayon”—nang magsalita siya sa pamamagitan ni David, pagkaraan ng napakahabang panahon, gaya ng naunang sinabi:


    “Ngayon, kung marinig ninyo ang kanyang tinig,


    huwag ninyong patigasin ang inyong mga puso.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάλιν
  choice: Muli
  rationale: Ipinahihiwatig nito ang pagpapatuloy at muling pagtatalaga ng Diyos ng isang araw sa daloy ng argumento.
- source_word: τινὰ ὁρίζει ἡμέραν
  choice: nagtakda siya ng isang tiyak na araw
  rationale: Ang τις ay tumutukoy sa isang partikular ngunit hindi muna tinukoy na araw, at ipinahahayag ng ὁρίζει ang may-awtoridad na pagtatakda rito.
- source_word: Σήμερον
  choice: “Ngayon”
  rationale: Pinananatili itong tawag sa itinakdang araw at bilang mahalagang salita sa sipi mula sa Awit 95.
- source_word: ἐν Δαυὶδ λέγων
  choice: nang sabihin niya sa pamamagitan ni David
  rationale: Likas ito sa Tagalog at ipinakikitang nagsasalita ang Diyos sa pamamagitan ni David, nang hindi labis na nililinaw ang eksaktong mekanismo ng pagkakaakda.
- source_word: μετὰ τοσοῦτον χρόνον
  choice: pagkaraan ng napakahabang panahon
  rationale: Malinaw na ipinahahayag nito ang diin sa mahabang panahong lumipas mula sa salinlahi sa ilang.
- source_word: καθὼς προείρηται
  choice: gaya ng sinabi na noon
  rationale: Pinananatili nito ang kahulugan ng isang naunang pahayag na nananatiling mahalaga sa kasalukuyang argumento.
- source_word: ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε
  choice: kung marinig ninyo ang kanyang tinig
  rationale: Pinananatili ang idyomang biblikal ng pakikinig sa tinig nang hindi ito tuwirang pinapakahulugang “sumunod.”
- source_word: μὴ σκληρύνητε τὰς καρδίας ὑμῶν
  choice: huwag ninyong patigasin ang inyong mga puso
  rationale: Tumpak at likas na babala ito laban sa kusang pagmamatigas; pinananatili rin ang larawang “puso” para sa panloob na pagkatao at kalooban.
theological_decisions:
- issue: Diwa ng “Ngayon” sa argumento tungkol sa kapahingahan ng Diyos
  choice: Pinanatili ang “Ngayon” bilang itinakdang pagkakataon ng pagtugon na may kasalukuyang bisa.
  alternative: Ituring lamang itong makasaysayang araw ng pagsasalita ng salmista, o isang eksklusibong eskatolohikal na araw.
  rationale: Ipinakikita ng talata na muling nagtatakda ang Diyos ng araw ng pagtugon pagkaraan ng mahabang panahon, ngunit hindi nilulutas ng salin ang higit pang tanong tungkol sa lawak o tagal ng araw na iyon.
- issue: Kahulugan ng ἐν Δαυὶδ
  choice: “sa pamamagitan ni David”
  alternative: “kay David” o “sa awit na kaugnay ni David”
  rationale: Ipinahahayag ng pangunahing salin ang pamamagitan ni David, habang kinikilala sa talababa ang posibleng pag-unawa rito bilang reperensiya sa awit na kaugnay niya.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “napakahabang panahon” para sa natural na diin, at pinanatili ang pormal ngunit pamilyar na pananalitang “patigasin ang inyong mga puso.”
