  rationale: Pinalitan ang “nakiisa” ng “nakaugnay” upang maipahayag nang mas malinaw ang metaporikal na diwa ng συγκεκερασμένους bilang pagkakaugnay o pagkakabuklod. Pinanatili ang mga tao bilang paksa ng pangunahing teksto, alinsunod sa akusatibong participle sa SBLGNT, at pinanatili sa talababa ang tradisyonal na ibang pagbasa kung saan ang mensahe ang paksa.
