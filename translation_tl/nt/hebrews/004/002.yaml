  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ γάρ ἐσμεν εὐηγγελισμένοι καθάπερ κἀκεῖνοι, ἀλλ’ οὐκ ὠφέλησεν ὁ λόγος τῆς ἀκοῆς ἐκείνους, μὴ ⸀συγκεκερασμένους τῇ πίστει τοῖς ἀκούσασιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/002.yaml
  text: For indeed[a], we also have had good news proclaimed to us, just as they did; but the message they heard did not benefit them[b], because it was not united by faith with those who heard.
translation:
  language: tl
  text: Sapagkat ipinahayag din sa atin ang mabuting balita, gaya rin sa kanila. Ngunit hindi sila nakinabang sa mensaheng narinig nila, sapagkat hindi sila nakaugnay sa pamamagitan ng pananampalataya sa mga nakinig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa ibang manuskrito at ayon sa tradisyonal na salin: “sapagkat ang mensahe ay hindi nahaluan ng pananampalataya sa mga nakarinig nito.”'
    reason: textual_variant
lexical_decisions:
- source_word: εὐηγγελισμένοι
  choice: ipinahayag din sa atin ang mabuting balita
  rationale: Pinananatili ang diwang pasibo at ang patuloy na kabuluhan ng naipahayag na mabuting balita, nang hindi ginagawang teknikal na katawagan ang pandiwa.
- source_word: καθάπερ κἀκεῖνοι
  choice: gaya rin sa kanila
  rationale: Likas na paghahambing sa Filipino na tumutukoy sa salinlahing nasa ilang bilang kapwa tumanggap ng mensahe.
- source_word: ὁ λόγος τῆς ἀκοῆς
  choice: mensaheng narinig nila
  rationale: Ipinahahayag nang natural ang genitibong parirala bilang nilalaman ng ipinahayag at narinig.
- source_word: ὠφέλησεν
  choice: hindi sila nakinabang
  rationale: Malinaw at karaniwang Filipino para sa mensaheng hindi nagdulot ng kapakinabangan sa kanila.
- source_word: συγκεκερασμένους
  choice: nakiisa
  rationale: Ipinakikita ang metaporikal na diwa ng paghahalo o pagkakaugnay, at umaayon ang anyo sa akusatibong participle na tumutukoy sa ἐκείνους.
- source_word: πίστει
  choice: sa pamamagitan ng pananampalataya
  rationale: Inilalarawan ang pananampalataya bilang paraan ng pakikiisa; pinananatili rin ang karaniwang teolohikal ngunit nauunawaang katumbas ng πίστις.
- source_word: τοῖς ἀκούσασιν
  choice: sa mga nakinig
  rationale: Ang “nakinig” ay maaaring magpahiwatig ng pagtanggap o pagtugon, hindi lamang pisikal na pagkarinig, at nababagay sa kaibahan ng talata.
theological_decisions:
- issue: Kahulugan ng πίστις
  choice: pananampalataya
  alternative: pagtitiwala
  rationale: Ang konteksto ay naghahambing ng pagkarinig sa tugong may pananampalataya. Hindi nito ipinapasok ang isang partikular na denominasyonal na paliwanag.
- issue: Paksa ng huling sugnay
  choice: ang mga taong hindi nakiisa sa pamamagitan ng pananampalataya sa mga nakinig
  alternative: ang mensahe ay hindi nahaluan ng pananampalataya sa mga nakarinig
  rationale: Sinusunod ng pangunahing teksto ang akusatibong συγκεκερασμένους sa ibinigay na SBLGNT, na likas na umaayon sa ἐκείνους. Inilalagay sa talababa ang kilalang ibang pagbasa at tradisyonal na pagkaunawa.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Pinanatili ang paghahambing sa salinlahing nasa ilang at ang tekstuwal at sintaktikong tensiyon sa huling sugnay.
