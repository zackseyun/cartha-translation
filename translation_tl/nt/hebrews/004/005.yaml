  text: 'And in this place again: ‘They shall certainly not enter my rest.’[a]'
translation:
  language: tl
  text: 'At muli, sa siping ito: “Hinding-hindi sila makapapasok sa aking kapahingahan.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, literal na “Kung makapapasok sila sa aking kapahingahan,” isang pormula ng panunumpa na ang ibig sabihin ay “Hinding-hindi sila makapapasok sa aking kapahingahan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: sa talatang ito
  rationale: Tumutukoy ito sa isang lugar o sipi sa Kasulatan. Ang “sa talatang ito” ay natural sa modernong Filipino at malinaw sa konteksto ng pagsipi.
- source_word: πάλιν
  choice: muli
  rationale: Ipinahihiwatig nito ang panibagong pagsipi o muling pagbanggit sa Kasulatan.
- source_word: Εἰ εἰσελεύσονται
  choice: Hinding-hindi sila makapapasok
  rationale: Bagaman literal na kondisyunal ang anyong Griyego, isa itong pormula ng panunumpa na nagsasaad ng mariing pagtanggi. Inihahatid ng “hinding-hindi” ang diin nito sa natural na Filipino.
- source_word: κατάπαυσίν
  choice: kapahingahan
  rationale: Pangunahing terminong inuulit sa Hebreo 3–4 para sa kapahingahan ng Diyos. Pinananatili nito ang mahalagang ugnayang leksikal sa buong talakayan.
- source_word: μου
  choice: aking
  rationale: 'Tuwirang pinananatili ang pag-aari sa mismong pananalita ng Diyos: ang kapahingahan ay sa kanya.'
theological_decisions:
- issue: Pagpapahayag sa kondisyunal na pormula ng panunumpang Εἰ εἰσελεύσονται
  choice: Hinding-hindi sila makapapasok sa aking kapahingahan
  alternative: Kung makapapasok sila sa aking kapahingahan
  rationale: Ang literal na kondisyunal ay kumakatawan sa Semitikong pormula ng panunumpa at gumaganap bilang mariing pagtanggi. Isinasalin ang idyomatikong diwa habang inilalahad sa talababa ang literal na anyo upang mapanatili ang pinagmulan at retorikal na tensiyon.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “kapahingahan” upang mapanatili ang susing terminolohiya sa Hebreo 3–4, at “talatang ito” upang maging malinaw ang pagtukoy sa isa pang sipi ng Kasulatan.
