  naturalness: Natural at marangal ang “Hinding-hindi sila makapapasok sa aking kapahingahan.” Mas maayos at mas matapat ang elliptical na pambungad na “At muli, sa siping ito:” kaysa sa pagdaragdag ng “sinabi niya.”
  terminology: Ang “kapahingahan” ay angkop na susing salin para sa κατάπαυσις sa Hebreo 3–4 at dapat panatilihin. Ang talababa ay wastong nagpapaliwanag ng literal na kondisyunal at ng gamit nito bilang pormula ng panunumpa.
