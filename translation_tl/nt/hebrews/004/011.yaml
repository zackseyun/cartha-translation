base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/011.yaml
  text: Therefore[a], let us make every effort to enter that rest, so that no one may fall by the same pattern of disobedience.
translation:
  language: tl
  text: Kaya’t pagsikapan nating makapasok sa kapahingahang iyon, upang walang sinumang mahulog sa gayunding padron ng pagsuway.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa gayunding halimbawa ng kawalan ng pananampalataya.” Maaaring unawain ang pangngalan ayon sa pagtanggi ng salinlahing nasa ilang na magtiwala sa Diyos, bagaman ang salitang Griyego ay mas tuwirang nangangahulugang “pagsuway.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σπουδάσωμεν
  choice: pagsikapan natin
  rationale: Ang hortatory aorist subjunctive ay isang masidhing panawagan sa sama-samang pagkilos. Ang “pagsikapan natin” ay natural sa modernong Tagalog at nagpapahayag ng sigasig at buong pagsisikap.
- source_word: οὖν
  choice: Kaya't
  rationale: Malinaw na nag-uugnay ito sa konklusyong hinango mula sa naunang argumento tungkol sa kapahingahan ng Diyos at sa pagkabigo ng salinlahi sa ilang.
- source_word: εἰσελθεῖν
  choice: makapasok
  rationale: Tuwirang isinasalin ang infinitive na nagsasaad ng layon ng pagsisikap.
- source_word: ἐκείνην τὴν κατάπαυσιν
  choice: sa kapahingahang iyon
  rationale: Pinananatili ang demonstrative na “iyon” at ang ugnayan sa kapahingahang tinalakay sa konteksto, nang hindi labis na tinutukoy ang likas nito.
- source_word: ἵνα μὴ
  choice: upang walang sinumang
  rationale: Natural na nagpapahayag sa Tagalog ng negatibong layon o kinalabasan at nananatili ang bigat ng babala.
- source_word: ἐν τῷ αὐτῷ ... ὑποδείγματι
  choice: sa gayunding huwaran
  rationale: Ang “huwaran” ay maaaring tumukoy sa halimbawa o padron na mauulit, gaya ng naunang pagsuway ng salinlahi sa ilang. Hindi nito labis na nililinaw kung instrumental o sirkumstansiyal ang ἐν.
- source_word: πέσῃ
  choice: mabuwal
  rationale: Ipinahahayag ang solemne at mapanganib na pagbagsak sa babala; mas dignified at kontekstuwal kaysa sa karaniwang “mahulog.”
- source_word: τῆς ἀπειθείας
  choice: ng pagsuway
  rationale: Ang ἀπείθεια ay mas tuwirang nangangahulugang pagsuway, bagaman malapit itong kaugnay ng kawalan ng pananampalataya sa pangangatwiran ng Hebreo.
theological_decisions:
- issue: Ugnayan ng ἀπείθεια sa kabiguan ng salinlahi sa ilang
  choice: “pagsuway” sa pangunahing teksto
  alternative: “kawalan ng pananampalataya”
  rationale: Mahigpit na pinag-uugnay sa Hebreo ang hindi paniniwala at pagsuway, ngunit ang mas tuwirang leksikal na diwa rito ay “pagsuway.” Inilalagay sa talababa ang kontekstuwal na alternatibo upang mapanatili ang teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “kapahingahan” upang mapanatili ang mahalagang terminong inuulit sa konteksto ng Hebreo 3–4, at ang “huwaran” upang maipakita ang naunang halimbawa bilang padron o babala.
