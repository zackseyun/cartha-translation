base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/015.yaml
  text: For we do not have a high priest unable to sympathize with our weaknesses, but one who has been tested in every way according to likeness, yet without sin.
translation:
  language: tl
  text: Sapagkat wala tayong Kataas-taasang Pari na hindi kayang makiramay sa ating mga kahinaan, kundi isang sinubok[b] sa lahat ng paraan, gaya natin,[a] ngunit walang kasalanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ayon sa pagkakatulad.”
    reason: lexical_alternative
  - marker: b
    text: Ang “sinubok” ay maaari ring isaling “tinukso.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀρχιερέα
  choice: Kataas-taasang Pari
  rationale: Karaniwan at tumpak na katawagan sa modernong salin ng Bibliya para sa punong saserdote; pinananatili rin nito ang mahalagang katungkulan ni Jesus sa pangangatwiran ng Hebreo.
- source_word: οὐ ... μὴ δυνάμενον συμπαθῆσαι
  choice: ay hindi isang hindi makadama
  rationale: Pinananatili ang litotes o dobleng pagtanggi ng Griyego, sa halip na payak na gawing “nakikiramay.” Ang “makadama” ay nagpapahayag ng pakikibahagi at pag-unawa sa dinaranas ng iba, hindi lamang awa.
- source_word: ταῖς ἀσθενείαις ἡμῶν
  choice: ng ating mga kahinaan
  rationale: Saklaw nito ang kahinaan at kahungkagan ng tao, hindi lamang karamdaman, at natural sa kasalukuyang Filipino.
- source_word: πεπειρασμένον
  choice: sinubok
  rationale: Maaaring mangahulugan ang πειράζω ng pagsubok o pagtukso. Ang “sinubok” ay malinaw na naghahayag ng tunay na pagdanas ng pagsubok nang hindi ipinapalagay ang makasalanang pagnanasa; inilalagay sa talababa ang lehitimong alternatibong “tinukso.”
- source_word: κατὰ πάντα
  choice: sa lahat ng paraan
  rationale: Natural na nagpapahayag ng lawak at kabuuan ng kanyang karanasan sa pagsubok.
- source_word: καθ’ ὁμοιότητα
  choice: gaya natin
  rationale: Ginagawang natural sa Filipino ang literal na “ayon sa pagkakatulad” at ipinahihiwatig na paghahambing sa atin mula sa konteksto, nang hindi sinasabing magkapareho sa lahat ng bagay.
- source_word: χωρὶς ἁμαρτίας
  choice: ngunit walang kasalanan
  rationale: 'Pinananatili ang malinaw at mahalagang pagtatangi: bagaman tunay na sinubok, nanatili siyang walang kasalanan.'
theological_decisions:
- issue: Kahulugan ng πεπειρασμένον kaugnay ng kawalang-kasalanan ni Cristo
  choice: sinubok
  alternative: tinukso
  rationale: Parehong lehitimong kahulugan ang “sinubok” at “tinukso.” Ginamit sa pangunahing teksto ang “sinubok,” ngunit pinanatili sa talababa ang “tinukso” upang huwag alisin ang tunay na leksikal at teolohikal na tensiyon.
- issue: Pagpapahayag ng paghahambing sa καθ’ ὁμοιότητα
  choice: gaya natin
  alternative: ayon sa pagkakatulad
  rationale: Hindi tahasang inuulit ng Griyego ang “natin,” ngunit malinaw ito sa konteksto at kailangan para sa natural na Filipino. Inilalagay sa talababa ang mas literal na anyo upang maipakita ang porma at likas na kalabuan ng parirala.
- issue: Pagpapanatili sa litotes ng οὐ ... μὴ δυνάμενον
  choice: hindi isang hindi makadama
  alternative: nakikiramay / nakadarama
  rationale: 'Pinananatili ng dobleng pagtanggi ang retorikal na diin ng Griyego: ang Kataas-taasang Pari ay tiyak na may kakayahang makadama sa ating mga kahinaan.'
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “Kataas-taasang Pari” bilang pamilyar na terminong biblikal. Ang bahagyang di-karaniwang “hindi isang hindi makadama” ay sadyang nagpapanatili sa litotes ng orihinal; inayos ang pangungusap sa dalawang bahagi upang manatiling malinaw at natural.
