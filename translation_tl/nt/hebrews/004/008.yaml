  text: εἰ γὰρ αὐτοὺς Ἰησοῦς κατέπαυσεν, οὐκ ἂν περὶ ἄλλης ἐλάλει μετὰ ταῦτα ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/008.yaml
  text: For if Joshua had given them rest[a], he would not have spoken later about another day.
translation:
  language: tl
  text: Sapagkat kung binigyan sila ni Josue[a] ng kapahingahan, hindi na sana nagsalita pagkatapos nito tungkol sa ibang araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “Jesus.” Maaaring tumukoy ang anyong Ἰησοῦς kay Jesus o kay Josue; sa kontekstong ito, si Josue na anak ni Nun ang tinutukoy.
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: Sapagkat
  rationale: Nagpapakilala ito ng paliwanag na sumusuporta sa naunang pahayag at likas ang ugnayang lohikal sa Tagalog.
- source_word: Ἰησοῦς
  choice: Josue
  rationale: Iisang anyo sa Griyego ang maaaring tumukoy kay Jesus o kay Josue, ngunit ang konteksto ay ang pagpasok ng Israel sa lupain sa pangunguna ni Josue. Ginamit ang karaniwang pangalang Tagalog na “Josue,” habang inilalahad sa talababa ang anyong Griyego.
- source_word: αὐτοὺς ... κατέπαυσεν
  choice: nabigyan sila ... ng kapahingahan
  rationale: Pinananatili nito ang sanhiang diwa ng καταπαύω at ang kaugnayan nito sa paulit-ulit na tema ng “kapahingahan” sa talata at buong pangangatwiran.
- source_word: οὐκ ἂν ... ἐλάλει
  choice: hindi na sana siya nagsalita
  rationale: Ipinahahayag ng οὐκ ἂν kasama ng imperfect ang resultang salungat sa katotohanan. Ang “hindi na sana” ay natural na paraan upang ipakita ito sa Tagalog; pinanatili ang di-tiyak na panghalip na paksa sa halip na idagdag ang “Diyos.”
- source_word: μετὰ ταῦτα
  choice: sa kalaunan
  rationale: Malinaw at likas nitong ipinapahayag ang pagkakasunod sa panahon nang hindi masyadong literal na “pagkatapos ng mga bagay na ito.”
- source_word: περὶ ἄλλης ... ἡμέρας
  choice: tungkol sa ibang araw
  rationale: Pinananatili ang tuwirang diwa ng isa pang araw na binanggit pagkaraan ng panahon ni Josue, nang hindi ipinapasok sa mismong teksto ang paliwanag na ito ay “araw ng kapahingahan.”
theological_decisions:
- issue: Ang tinutukoy ng Ἰησοῦς
  choice: Josue, ang anak ni Nun
  alternative: Jesus
  rationale: Ang argumento ay tungkol sa pagpasok ng Israel sa lupain sa ilalim ni Josue at sa mas huling pangako sa Awit 95. Gayunman, dahil magkapareho ang anyong Griyego ng mga pangalang Jesus at Josue, pinanatili sa talababa ang mahalagang impormasyong tekstuwal.
- issue: Ang di-binanggit na paksa ng ἐλάλει
  choice: “siya,” na hindi tahasang kinilalang Diyos sa salin
  alternative: “Diyos”
  rationale: Walang hayag na pangngalan bilang paksa sa Griyego. Bagaman maaaring matukoy mula sa mas malawak na konteksto na Diyos ang nagsasalita sa Kasulatan, ang paggamit ng “siya” ay umiiwas sa pagdaragdag at nagpapanatili ng anyo at bahagyang kalabuan ng teksto.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang pangunahing terminong “kapahingahan” dahil sentral ito sa pangangatwiran ng Hebreo 3–4. Ang hulma na “kung ... hindi na sana” ay natural na naghahayag ng kondisyong salungat sa katotohanan.
