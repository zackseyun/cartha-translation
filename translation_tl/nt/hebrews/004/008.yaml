  source_fidelity: Tumpak ang pangunahing pagtukoy kay Josue at ang pagsasalin ng καταπαύω bilang pagbibigay ng kapahingahan. Gayunman, ang hayag na panghalip na “siya” sa kasalukuyang salin ay likas na maikakabit sa pinakamalapit na antecedent na si Josue, samantalang ang nagsalita sa mas malawak na argumento ay ang Diyos sa Kasulatan. Hindi hayag ang paksa sa Griyego, kaya mas mabuting huwag maglagay ng panghalip sa Tagalog.
  naturalness: Ang “nabigyan sila ni Josue” ay nauunawaan, ngunit mas tuwiran at natural ang “binigyan sila ni Josue.” Ang “pagkatapos nito” ay mas malinaw na katumbas ng μετὰ ταῦτα sa daloy ng pangungusap kaysa “sa kalaunan.” Ang pro-drop na “hindi na sana nagsalita” ay natural sa makabagong Filipino at iniiwasan ang maling antecedent.
  terminology: Ang “Josue,” “kapahingahan,” at “ibang araw” ay angkop at pare-pareho sa konteksto. Ang talababa tungkol sa anyong Griyego na Ἰησοῦς ay tumpak at sapat.
  issues:
