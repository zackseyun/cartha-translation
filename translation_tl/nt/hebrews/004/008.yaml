    rationale: Ang μετὰ ταῦτα ay mas tuwirang “pagkatapos nito/pagkaraan nito.” Ang “sa kalaunan” ay maaaring mangahulugang eventually at bahagyang nagpapalabo sa tiyak na pagkakasunod-sunod.
