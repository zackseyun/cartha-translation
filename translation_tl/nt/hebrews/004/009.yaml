  text: So then[a], a Sabbath rest remains for the people of God.
translation:
  language: tl
  text: Kaya nga, nananatili para sa bayan ng Diyos ang isang Sabbath na kapahingahan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pangingilin ng Sabbath.” Bihira ang salitang Griyego na σαββατισμός at malinaw itong inuugnay sa Sabbath; dito, malamang na tumutukoy ito sa isang Sabbath na kapahingahan na nananatili para sa bayan ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα
  choice: Kaya nga
  rationale: Ipinahihiwatig nito ang kongklusyong nagmumula sa naunang pangangatwiran; natural at malinaw sa makabagong Tagalog ang “Kaya nga.”
- source_word: ἀπολείπεται
  choice: nananatili
  rationale: Ipinapahayag ng anyo ng pandiwa na ang tinutukoy na kapahingahan ay nananatili o patuloy na nakalaan.
- source_word: σαββατισμός
  choice: isang pamamahingang tulad ng Sabbath
  rationale: Bihira ang salitang Griyego at tahasang umaalingawngaw sa Sabbath. Pinananatili ng salin ang kaugnayan sa Sabbath nang hindi nililimitahan ang kahulugan sa lingguhang ritwal lamang.
- source_word: τῷ λαῷ
  choice: para sa bayan
  rationale: 'Ang datibo ay likas na nagpapahayag dito ng pakinabang o paglalaan: nananatili ang kapahingahan para sa bayan.'
- source_word: τοῦ θεοῦ
  choice: ng Diyos
  rationale: 'Tuwirang ipinapahayag ang ugnayan at pag-aari: ang bayang nauukol sa Diyos.'
theological_decisions:
- issue: Kahulugan ng σαββατισμός sa Hebreo 4:9
  choice: Isang patuloy na nananatiling kapahingahang tulad ng Sabbath para sa bayan ng Diyos.
  alternative: Pangingilin ng Sabbath; o isang lubos na metaporikal na kapahingahang walang malinaw na kaugnayan sa Sabbath.
  rationale: Pinag-uugnay ng konteksto ang kapahingahan ng Diyos, ang ikapitong araw, at ang ipinangakong kapahingahan. Ang “pamamahingang tulad ng Sabbath” ay nagpapanatili sa ugnayang iyon nang hindi nagpapasya kung ito ay lingguhang pangingilin lamang o isang kapahingahang walang anumang Sabbath na diwa.
translation_notes:
  register: Makabago, dignipikado, at madaling maunawaang Tagalog. Ginamit ang “bayan ng Diyos” bilang likas at pamilyar na pananalita, at iniwasang gawing sobrang teknikal ang pambihirang terminong Griyego.
