id: HEB.4.12
reference: Hebrews 4:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ζῶν γὰρ ὁ λόγος τοῦ θεοῦ καὶ ἐνεργὴς καὶ τομώτερος ὑπὲρ πᾶσαν μάχαιραν δίστομον καὶ διϊκνούμενος ἄχρι μερισμοῦ ψυχῆς ⸀καὶ πνεύματος, ἁρμῶν τε καὶ μυελῶν, καὶ κριτικὸς ἐνθυμήσεων καὶ ἐννοιῶν καρδίας·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/012.yaml
  text: For the word of God is living and active[a], and sharper than any double-edged sword, piercing to the division of soul and spirit, of joints and marrow[c][b], and able to judge the thoughts and intentions of the heart.
translation:
  language: tl
  text: Sapagkat ang salita ng Diyos ay buháy at mabisa[a], at mas matalas kaysa alinmang espadang magkabila ang talim. Tumatagos ito[b] hanggang sa paghihiwalay ng kaluluwa at espiritu[c], ng mga kasukasuan at utak ng buto, at may kakayahang humatol sa mga iniisip at nilalayon ng puso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring ‘aktibong gumagawa’ o ‘epektibo.’ Ipinahihiwatig ng salitang Griyego ang isang bagay na kumikilos at nagbubunga ng epekto.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring ‘lumalagos’; ang anyong Griyego ay nagpapahiwatig ng pagdaan o pag-abot hanggang sa kaloob-looban.
    reason: lexical_alternative
  - marker: c
    text: Hindi kinakailangang ituring ang ‘kaluluwa at espiritu’ rito bilang pagtuturo ng isang tiyak na bilang ng magkakahiwalay na sangkap ng tao. Binibigyang-diin ng larawan ang pag-abot ng salita ng Diyos sa pinakaloob na buhay.
    reason: alternative_reading
lexical_decisions:
- source_word: Ζῶν
  choice: buháy
  rationale: Tuwirang inilalarawan ang patuloy na kasiglahan ng salita ng Diyos. Nilagyan ng tuldik upang malinaw na ‘alive/living,’ hindi ‘life.’
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag o batayang ibinibigay ng talata para sa naunang panghihikayat.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: ang salita ng Diyos
  rationale: Malawak at likas na salin na hindi nililimitahan ang tinutukoy sa Kasulatan lamang, sa ipinangaral na mensahe, o sa personal na Logos.
- source_word: ἐνεργὴς
  choice: mabisa
  rationale: Ipinahihiwatig na ang salita ay aktibong gumagawa at nagdudulot ng epekto; mas natural ito sa pares na ‘buháy at mabisa’ kaysa sa literal ngunit malabong ‘aktibo.’
- source_word: τομώτερος ὑπὲρ πᾶσαν μάχαιραν δίστομον
  choice: mas matalas kaysa alinmang espadang magkabila ang talim
  rationale: Pinananatili ang paghahambing at malinaw na inilalarawan ang δίστομον bilang talim sa magkabilang gilid.
- source_word: διϊκνούμενος
  choice: Tumatagos ito
  rationale: Nananatili ang larawan ng tabak at ang diwa ng pag-abot o pagpasok hanggang sa pinakaloob.
- source_word: ἄχρι μερισμοῦ
  choice: hanggang sa paghihiwalay
  rationale: Ipinapakita ng ‘hanggang’ ang lawak ng pagtagos, samantalang pinananatili ng ‘paghihiwalay’ ang kahulugan ng μερισμός.
- source_word: ψυχῆς καὶ πνεύματος
  choice: ng kaluluwa at espiritu
  rationale: Lexically tuwiran at hindi nagpapasya kung ang dalawang termino ay teknikal na magkahiwalay na sangkap ng tao.
- source_word: ἁρμῶν τε καὶ μυελῶν
  choice: ng mga kasukasuan at utak ng buto
  rationale: Karaniwang modernong Filipino para sa joints at marrow, at pinananatili ang larawang umaabot sa kaibuturan ng katawan.
- source_word: κριτικὸς
  choice: may kakayahang humatol
  rationale: Ipinapahayag ang kakayahang sumuri at magbigay-hatol, hindi lamang ang simpleng pagkaalam sa nilalaman ng isip.
- source_word: ἐνθυμήσεων
  choice: mga iniisip
  rationale: Likas at malawak na salin para sa mga panloob na pag-iisip o pangangatwiran.
- source_word: ἐννοιῶν
  choice: mga nilalayon
  rationale: Ibinubukod ito sa ‘mga iniisip’ sa pamamagitan ng pagtukoy sa panloob na hangarin o intensiyon.
- source_word: καρδίας
  choice: ng puso
  rationale: Pinananatili ang biblikal na larawan ng puso bilang sentro ng panloob na pag-iisip at layunin.
theological_decisions:
- issue: Ang tinutukoy ng ‘salita ng Diyos’
  choice: Pinanatili ang pangkalahatang ‘ang salita ng Diyos.’
  alternative: Tukuyin ito nang tahasan bilang Kasulatan, ipinangaral na mensahe, isang partikular na pahayag ng Diyos, o ang Anak/Logos.
  rationale: Binibigyang-diin ng konteksto ng Hebreo ang makapangyarihang pagsasalita ng Diyos, ngunit hindi sapat ang parirala upang piliin sa salin ang isa lamang sa mga posibleng tinutukoy.
- issue: Kahulugan ng ‘kaluluwa at espiritu’ sa pagkakabuo ng tao
  choice: Pinanatili ang dalawang katawagan nang walang paliwanag sa mismong teksto na mga teknikal na bahagi ang mga ito.
  alternative: Isalin o ipaliwanag ang mga ito bilang patunay ng tiyak na dalawang-bahagi o tatlong-bahaging pagkakabuo ng tao.
  rationale: Ang pangunahing larawan ay ang napakalalim na pagtagos at paghatol ng salita ng Diyos. Hindi hinihingi ng talata na pasyahan sa salin ang isang partikular na antropolohiya.
- issue: Lakas ng κριτικὸς
  choice: ‘may kakayahang humatol’
  alternative: ‘nakakakilatis’ o ‘nakapagsusuri’
  rationale: Pinananatili nito kapwa ang pagsusuri at ang evaluative o judicial na lakas ng salita, nang hindi pinalalabis na may hiwalay na hatol na panghukuman sa bawat kaisipan.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang ‘espada’ at ‘utak ng buto’ bilang malinaw na karaniwang salita, at iniwasan ang labis na teknikal o denominasyonal na pananalita. Hinati sa dalawang pangungusap para sa likas na daloy nang hindi binabago ang ugnayang lohikal.
