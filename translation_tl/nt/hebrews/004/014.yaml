  text: Ἔχοντες οὖν ἀρχιερέα μέγαν διεληλυθότα τοὺς οὐρανούς, Ἰησοῦν τὸν υἱὸν τοῦ θεοῦ, κρατῶμεν τῆς ὁμολογίας·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/014.yaml
  text: Therefore[a], since we have a great high priest who has passed through the heavens—Jesus the Son of God—let us hold fast to our confession.
translation:
  language: tl
  text: Kaya, yamang mayroon tayong dakilang punong pari na dumaan sa mga langit[a]—si Jesus, ang Anak ng Diyos—panghawakan nating mahigpit ang ating pagpapahayag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na nagdaan sa mga langit.” Maramihan sa Griyego ang salitang isinaling “mga langit”; maaari rin itong isalin sa natural na Tagalog bilang “langit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔχοντες οὖν
  choice: Kaya, yamang mayroon tayong
  rationale: Pinagsasama ng “kaya” ang inferensiyang ipinahihiwatig ng οὖν at ng “yamang” ang batayang ibinibigay ng participle ἔχοντες, sa natural na ayos ng makabagong Tagalog.
- source_word: ἀρχιερέα μέγαν
  choice: dakilang punong pari
  rationale: Ang “punong pari” ay malinaw at karaniwang katumbas ng ἀρχιερεύς, samantalang pinananatili ng “dakila” ang mariing paglalarawan ng μέγαν.
- source_word: διεληλυθότα τοὺς οὐρανούς
  choice: na dumaan sa mga kalangitan
  rationale: Inilalarawan ng “dumaan” ang pagkilos sa o sa pamamagitan ng mga kalangitan; pinananatili ng “mga kalangitan” ang maramihang anyo ng οὐρανούς. Nauunawaan sa konteksto ang natapos na pagkilos na may nananatiling kabuluhan ng perfect participle.
- source_word: Ἰησοῦν τὸν υἱὸν τοῦ θεοῦ
  choice: si Jesus, ang Anak ng Diyos
  rationale: Pinangangalangan si Jesus at pinananatiling tahasan at marangal ang kristolohikal na titulong “Anak ng Diyos.”
- source_word: κρατῶμεν
  choice: panghawakan nating matatag
  rationale: Ang hortatory subjunctive ay isinasalin bilang sama-samang panawagan. Ipinahahayag ng “matatag” ang patuloy at matibay na pagkapit nang hindi ginagawang isang beses lamang ang kilos.
- source_word: τῆς ὁμολογίας
  choice: ang ating ipinahahayag
  rationale: Ang ὁμολογία ay tumutukoy sa hayag na pagkilala o pagpapahayag ng komunidad. Natural sa Tagalog ang pandiwang pariralang ito at hindi na nagdaragdag ng bagay na hindi tahasang nasa Griyego.
theological_decisions:
- issue: Paglilipat sa titulong υἱὸς τοῦ θεοῦ
  choice: ang Anak ng Diyos
  alternative: ang Anak ng Diyos / ang Anak na mula sa Diyos
  rationale: Pinananatili ang tuwirang kristolohikal na titulo at hindi ito binabawasan sa isang malayang pagpapakahulugan.
- issue: Pagpapanatili sa maramihang τοὺς οὐρανούς
  choice: mga kalangitan
  alternative: langit
  rationale: Pinananatili ang maramihang larawan ng tekstong Griyego nang hindi nagpapasok ng isang detalyadong sistemang kosmolohikal na hindi naman tahasang ipinaliliwanag ng talata.
- issue: Saklaw ng ὁμολογία
  choice: ating ipinahahayag
  alternative: ating pagpapahayag ng pananampalataya
  rationale: Hindi tahasang binabanggit sa parirala ang “pananampalataya,” kaya pinananatiling bukas ang saklaw nito habang malinaw pa ring tumutukoy sa sama-samang ipinahahayag ng mga mambabasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “punong pari” sa halip na mas teknikal o denominasyonal na katawagan, at iniwasang dagdagan ng “pananampalataya” ang huling parirala upang mapanatili ang lawak ng orihinal.
