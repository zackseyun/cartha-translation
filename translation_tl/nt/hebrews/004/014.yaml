  to: Kaya, yamang mayroon tayong dakilang punong pari na dumaan sa mga langit[a]—si Jesus, ang Anak ng Diyos—panghawakan nating mahigpit ang ating pagpapahayag.
  rationale: Pinalitan ang “mga kalangitan” ng mas likas na “mga langit” habang pinananatili ang maramihang anyo ng Griyego. Pinalitan din ang huling parirala upang maging mas idiomatiko sa Tagalog at upang malinaw na maipakita ang ὁμολογία bilang ang pagpapahayag na dapat mahigpit na panghawakan. Walang pagbabagong doktrinal o pagpapakitid ng kahulugan ang ginawa.
