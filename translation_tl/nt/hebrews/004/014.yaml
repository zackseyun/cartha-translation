  terminology: Ang “punong pari,” “Anak ng Diyos,” at “mga langit” ay angkop, marangal, at tapat sa mga pangunahing katawagan ng Griyego. Ang “ating pagpapahayag” ay pinananatiling sapat na malawak para sa ὁμολογία at hindi nagdaragdag ng “pananampalataya” na wala sa mismong parirala.
