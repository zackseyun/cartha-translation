  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ γὰρ εἰσελθὼν εἰς τὴν κατάπαυσιν αὐτοῦ καὶ αὐτὸς κατέπαυσεν ἀπὸ τῶν ἔργων αὐτοῦ ὥσπερ ἀπὸ τῶν ἰδίων ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/010.yaml
  text: For the one who has entered his rest has himself also rested from his works[b][a], just as God did from his own.
translation:
  language: tl
  text: Sapagkat ang pumasok sa kanyang kapahingahan[a] ay nagpahinga rin mismo mula sa kanyang mga gawa[b], kung paanong nagpahinga ang Diyos mula sa sarili niyang mga gawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kapahingahan ng Diyos.” Sa konteksto ng Hebreo 3–4, malamang na ang panghalip na “kanyang” ay tumutukoy sa Diyos.
    reason: alternative_reading
  - marker: b
    text: O “ay tumigil din mismo sa kanyang mga gawa.” Magkaugnay ang salitang Griyego para sa “nagpahinga” at ang salitang isinaling “kapahingahan,” kaya pinanatili rito ang paulit-ulit na wika ng pagpapahinga.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... εἰσελθὼν
  choice: ang pumasok
  rationale: Ang artikulo at aorist participle ay tumutukoy sa isang tao sa pangkalahatan na nakapasok na; maikli at likas sa Tagalog ang “ang pumasok.”
- source_word: γὰρ
  choice: Sapagkat
  rationale: Nagbibigay ito ng paliwanag o batayan para sa naunang pahayag.
- source_word: κατάπαυσιν
  choice: kapahingahan
  rationale: Pinananatili nito ang susing tema ng kapahingahan sa Hebreo 3–4 at ang kaugnayan sa pamamahinga ng Diyos.
- source_word: αὐτοῦ (after κατάπαυσιν)
  choice: kanyang
  rationale: Pinananatili ng panghalip ang pormal na kalabuan ng Griyego, bagaman sa konteksto ay malamang na Diyos ang tinutukoy.
- source_word: καὶ αὐτὸς
  choice: rin mismo
  rationale: Ipinahahayag nito kapwa ang pandagdag na diwa ng καί at ang diin ng αὐτός.
- source_word: κατέπαυσεν
  choice: nagpahinga
  rationale: Pinananatili nito ang pag-uugnay ng pandiwa sa κατάπαυσις at ang paulit-ulit na wika ng kapahingahan sa talata.
- source_word: ἀπὸ τῶν ἔργων αὐτοῦ
  choice: mula sa kanyang mga gawa
  rationale: Direkta at malawak ang “mga gawa,” kaya hindi nito nililimitahan ang kahulugan sa isang tiyak na uri ng paggawa o pagsisikap.
- source_word: ὥσπερ
  choice: kung paanong
  rationale: Likas nitong ipinakikita sa Tagalog ang malinaw na paghahambing.
- source_word: ἀπὸ τῶν ἰδίων
  choice: mula sa sarili niyang mga gawa
  rationale: Ipinapahayag nito ang elipsis ng Griyego sa malinaw na Tagalog at pinananatili ang diin ng ἰδίων sa mga gawang sariling ginawa ng Diyos.
- source_word: ὁ θεός
  choice: ang Diyos
  rationale: Karaniwang salin ng θεός; tahasang pinananatili ang simuno sa paghahambing.
theological_decisions:
- issue: Ang tinutukoy ng αὐτοῦ sa “kanyang kapahingahan”
  choice: Pinanatili sa pangunahing teksto ang “kanyang,” na sa konteksto ay malamang na tumutukoy sa kapahingahan ng Diyos.
  alternative: Maaaring unawain bilang sariling kapahingahan ng taong pumasok.
  rationale: Sa Hebreo 3–4, ang paulit-ulit na paksa ay ang kapahingahan ng Diyos, na iniuugnay sa kanyang pamamahinga matapos ang paglikha. Gayunman, hindi pinalitan ng “ng Diyos” ang panghalip upang hindi alisin ang tunay na pormal na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kapahingahan” upang mapanatili ang tematikong terminolohiya, at “nagpahinga” upang maipakita ang pagkakaugnay ng mga salitang Griyego. Ang mga pananda ng talababa [a] at [b] ay kapwa nasa pangunahing teksto.
