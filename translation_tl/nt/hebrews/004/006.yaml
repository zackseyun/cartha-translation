  text: ἐπεὶ οὖν ἀπολείπεται τινὰς εἰσελθεῖν εἰς αὐτήν, καὶ οἱ πρότερον εὐαγγελισθέντες οὐκ εἰσῆλθον δι’ ἀπείθειαν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/006.yaml
  text: Therefore[a], since it remains for some to enter it, and those who formerly had the good news proclaimed to them did not enter because of disobedience,
translation:
  language: tl
  text: Kaya, yamang nananatili pang may ilang makapapasok doon, at ang mga dating pinagpahayagan ng mabuting balita ay hindi nakapasok dahil sa pagsuway[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dahil sa kawalan ng pananampalataya.” Ang salitang Griyego ay maaari ring tumukoy sa pagtangging maniwala na nahahayag sa pagsuway.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ οὖν
  choice: Kaya, yamang
  rationale: Pinananatili nito kapwa ang paghinuha ng οὖν at ang paliwanag o batayang ipinahihiwatig ng ἐπεί, sa likas na ayos ng modernong Tagalog.
- source_word: ἀπολείπεται τινὰς εἰσελθεῖν εἰς αὐτήν
  choice: nananatiling may ilan pang makapapasok doon
  rationale: Ipinahahayag ng “nananatili” ang patuloy na pagiging bukas ng pagpasok; ang “may ilan pang makapapasok” ay natural na Tagalog para sa di-tiyak na τινάς at infinitibong εἰσελθεῖν. Ang “doon” ay tumutukoy sa naunang binanggit na kapahingahan nang hindi inuulit ang pangngalan.
- source_word: οἱ πρότερον εὐαγγελισθέντες
  choice: ang mga unang pinangaralan ng magandang balita
  rationale: Pinananatili ng “pinangaralan” ang pasibong diwa ng εὐαγγελισθέντες, samantalang ang “unang” ay nagpapahayag ng temporal na paghahambing ng πρότερον sa konteksto.
- source_word: οὐκ εἰσῆλθον
  choice: ay hindi nakapasok
  rationale: Direkta at natural itong katumbas ng negatibong aorist, nang hindi nagdaragdag ng ibang paliwanag.
- source_word: δι’ ἀπείθειαν
  choice: dahil sa pagsuway
  rationale: Ang “pagsuway” ang pangunahing diwa ng ἀπείθεια at pinananatili ang ugnayan nito sa pagtangging tumalima; inilalagay sa talababa ang lehitimong alternatibong “kawalan ng pananampalataya.”
theological_decisions:
- issue: Kahulugan ng ἀπείθεια sa babala tungkol sa pagpasok sa kapahingahan
  choice: dahil sa pagsuway
  alternative: dahil sa kawalan ng pananampalataya
  rationale: Maaaring saklawin ng salita ang hindi paniniwalang nahahayag sa hindi pagtalima. Pinananatili ng pangunahing teksto ang tuwirang diwa ng pagsuway, habang kinikilala sa talababa ang kaugnay na diwa ng kawalan ng pananampalataya upang hindi alisin ang tunay na tensiyong teolohikal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “magandang balita” sa halip na mas teknikal na “ebanghelyo,” at iniwasang tahasang idagdag ang “kapahingahan” sa pangunahing teksto sapagkat panghalip lamang ang nasa Griyego.
