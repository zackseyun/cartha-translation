id: HEB.4.16
reference: Hebrews 4:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: προσερχώμεθα οὖν μετὰ παρρησίας τῷ θρόνῳ τῆς χάριτος, ἵνα λάβωμεν ἔλεος καὶ χάριν εὕρωμεν εἰς εὔκαιρον βοήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/016.yaml
  text: Therefore[a], let us approach the throne of grace with boldness[b], so that we may receive mercy and find grace for timely help.
translation:
  language: tl
  text: Kaya lumapit tayo nang buong lakas ng loob[a] sa trono ng biyaya, upang tumanggap tayo ng awa at makasumpong ng biyaya para sa tulong sa tamang panahon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nang buong pagtitiwala.” Saklaw ng salitang Griyego ang pagtitiwala at ang katapangan o kalayaan sa pagsasalita at paglapit.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “para sa tulong sa panahon ng pangangailangan.” Mas literal na tumutukoy ang pananalitang Griyego sa tulong na dumarating sa tamang panahon.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσερχώμεθα
  choice: lumapit tayo
  rationale: Ang pangkasalukuyang pasakaling pandiwa ay ginagamit bilang paghimok. Likas at malinaw sa modernong Tagalog ang “lumapit tayo,” at pinananatili nito ang diwa ng sama-samang paanyaya.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinakikita nito ang kongklusyon mula sa naunang pahayag tungkol kay Jesus bilang dakilang Kataas-taasang Pari. Mas natural sa kasalukuyang Tagalog ang “Kaya” kaysa “Samakatuwid” habang malinaw pa rin ang lohikal na ugnayan.
- source_word: μετὰ παρρησίας
  choice: nang buong lakas ng loob
  rationale: Maaaring tumukoy ang παρρησία sa kalayaan, katapangan, o pagtitiwala sa pagsasalita at paglapit. Ang “buong lakas ng loob” ay natural at pinananatili ang malakas na diwa ng malaya at di-atubiling paglapit, nang hindi nagpapahiwatig ng kapalaluan.
- source_word: τῷ θρόνῳ τῆς χάριτος
  choice: sa trono ng biyaya
  rationale: Tuwirang pinananatili ang metapora at ang anyong henitibo ng Griyego, nang hindi ipinapakahulugang agad bilang “maawaing trono.”
- source_word: ἵνα
  choice: upang
  rationale: Malinaw na ipinahahayag ng “upang” ang layunin ng paglapit at angkop ito sa marangal ngunit modernong rehistro.
- source_word: λάβωμεν ἔλεος
  choice: tumanggap tayo ng awa
  rationale: Karaniwang kahulugan ng λαμβάνω ang “tumanggap,” at tumpak na katumbas ng ἔλεος ang “awa.”
- source_word: χάριν εὕρωμεν
  choice: makasumpong ng biyaya
  rationale: 'Pinananatili ang pagkakaiba ng dalawang pandiwa: ang awa ay tinatanggap, samantalang ang biyaya ay nasusumpungan. Pinananatili rin ng “biyaya” ang mahalagang leksikal at teolohikal na ugnayan sa “trono ng biyaya.”'
- source_word: εἰς εὔκαιρον βοήθειαν
  choice: para sa tulong sa tamang panahon
  rationale: Ipinahahayag ng εὔκαιρος ang pagiging napapanahon o pagdating sa angkop na sandali. Natural sa Tagalog ang “tulong sa tamang panahon” at mas malapit sa Griyego kaysa sa interpretibong “tulong sa panahon ng pangangailangan.”
theological_decisions:
- issue: Diwa ng παρρησία sa paglapit sa Diyos
  choice: nang buong lakas ng loob
  alternative: nang buong pagtitiwala
  rationale: Binibigyang-diin ng talata ang malaya at di-atubiling paglapit sa Diyos kaugnay ng paglilingkod ni Jesus bilang Kataas-taasang Pari. Pinananatili ng “buong lakas ng loob” ang katapangan at kalayaan ng paglapit, habang iniiwasang ipakahulugan ito bilang mapangahas na pag-aangkin.
- issue: Pagkakasalin ng χάρις
  choice: biyaya
  alternative: pabor
  rationale: Bagaman maaaring mangahulugan ang χάρις ng “pabor,” mas mahusay na pinananatili ng “biyaya” ang leksikal na pagkakaugnay ng “trono ng biyaya” at “makasumpong ng biyaya,” pati ang teolohikal na bigat ng salita sa konteksto, nang hindi dinaragdagan ang sinasabi ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “Kaya” sa halip na mas pormal na “Samakatuwid,” at pinanatili ang tradisyonal ngunit malinaw na mga terminong “trono,” “awa,” at “biyaya.”
