id: HEB.4.3
reference: Hebrews 4:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰσερχόμεθα γὰρ ⸀εἰς κατάπαυσιν οἱ πιστεύσαντες, καθὼς εἴρηκεν· Ὡς ὤμοσα ἐν τῇ ὀργῇ μου, Εἰ εἰσελεύσονται εἰς τὴν κατάπαυσίν μου, καίτοι τῶν ἔργων ἀπὸ καταβολῆς κόσμου γενηθέντων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/003.yaml
  text: For we who have believed enter the rest[a], just as he has said, “As I swore in my wrath[b], ‘If they shall enter my rest,’” although his works were finished from the foundation of the world.
translation:
  language: tl
  text: 'Sapagkat tayong mga sumampalataya ay pumapasok sa kapahingahan, gaya ng sinabi niya: “Kung paanong nanumpa ako sa aking poot, ‘Hinding-hindi sila papasok sa aking kapahingahan,’”[a] bagaman natapos na ang mga gawa niya mula pa nang itatag ang sanlibutan.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, literal na “Kung papasok sila sa aking kapahingahan.” Isa itong pormula ng panunumpa na nangangahulugang “Tiyak na hindi sila papasok sa aking kapahingahan.”
    reason: alternative_reading
  - marker: b
    text: O “bagaman naganap na ang mga gawa niya mula pa nang itatag ang sanlibutan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσερχόμεθα
  choice: pumapasok
  rationale: 'Pinananatili ang pangkasalukuyang lakas ng pandiwa: ang mga sumampalataya ay pumapasok sa kapahingahan. Hindi ito ginawang pawang panghinaharap.'
- source_word: κατάπαυσιν
  choice: sa kapahingahan
  rationale: Ang “kapahingahan” ay likas at marangal na katumbas ng tiyak na kapahingahan ng Diyos na tinatalakay sa konteksto.
- source_word: οἱ πιστεύσαντες
  choice: tayong mga sumampalataya
  rationale: Ipinahahayag ng anyong aorist ang mga taong sumampalataya, at pinananatili ng “tayo” ang pagsasama ng may-akda sa pangkat.
- source_word: καθὼς εἴρηκεν
  choice: gaya ng sinabi niya
  rationale: Natural ito sa modernong Tagalog at naipahihiwatig ng konteksto ang patuloy na bisa ng sinabi ng Diyos.
- source_word: Ὡς ὤμοσα ἐν τῇ ὀργῇ μου
  choice: Gaya ng isinumpa ko sa aking galit
  rationale: Ang “isinumpa” ay malinaw na naghahayag ng taimtim na panunumpa; ang “galit” ay karaniwang salitang Tagalog na may sapat na bigat sa kontekstong ito.
- source_word: Εἰ εἰσελεύσονται εἰς τὴν κατάπαυσίν μου
  choice: Hinding-hindi sila papasok sa aking kapahingahan
  rationale: Ito ang kahulugan ng Semitikong pormula ng panunumpa na literal na may anyong “Kung papasok sila.” Isinalin ang idyomatikong lakas nito upang hindi mapagkamalang karaniwang kondisyong pangungusap.
- source_word: καίτοι
  choice: bagaman
  rationale: Malinaw na ipinakikita ang ugnayang pasalungat o concessive.
- source_word: τῶν ἔργων ... γενηθέντων
  choice: natapos na ang mga gawa niya
  rationale: Ipinahahayag ang pagkakaganap o pagkakumpleto ng mga gawa; ang “niya” ay tumutukoy sa Diyos ayon sa konteksto.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: mula pa nang itatag ang sanlibutan
  rationale: Natural na Tagalog para sa pagtatatag o paglalang ng mundo at pinananatili ang panahong nagsisimula sa pasimula ng sanlibutan.
theological_decisions:
- issue: Lakas ng pormula ng panunumpa mula sa Awit 95
  choice: 'Isinalin bilang mariing pagtanggi: “Hinding-hindi sila papasok sa aking kapahingahan.”'
  alternative: Mas literal na “Kung papasok sila sa aking kapahingahan.”
  rationale: Ang εἰ na may panghinaharap na pandiwa ay bahagi ng pormulang panunumpang Semitiko na nangangahulugang tiyak na hindi sila papasok. Nililinaw ito sa pangunahing teksto, habang inilalagay sa talababa ang literal na anyo.
- issue: Panahunan ng pagpasok ng mga sumampalataya sa kapahingahan
  choice: Ginamit ang pangkasalukuyang “pumapasok.”
  alternative: “papasok” o “pumapasok na”
  rationale: Pinananatili nito ang pangkasalukuyang pahayag ng Griyego at ang tensiyon sa konteksto sa pagitan ng kasalukuyang pakikibahagi at ng ganap na katuparan sa hinaharap.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “kapahingahan” upang mapanatili ang mahalagang terminong inuulit sa talata at sa mas malawak na argumento. Ang mga marker na [a] at [b] ay kapuwa nasa pangunahing teksto at tumutugma sa mga talababa.
