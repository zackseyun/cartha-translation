  to: 'Sapagkat tayong mga sumampalataya ay pumapasok sa kapahingahan, gaya ng sinabi niya: “Kung paanong nanumpa ako sa aking poot, ‘Hinding-hindi sila papasok sa aking kapahingahan,’”[a] bagaman natapos na ang mga gawa niya mula pa nang itatag ang sanlibutan.[b]'
