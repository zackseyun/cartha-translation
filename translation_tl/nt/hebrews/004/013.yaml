  text: καὶ οὐκ ἔστιν κτίσις ἀφανὴς ἐνώπιον αὐτοῦ, πάντα δὲ γυμνὰ καὶ τετραχηλισμένα τοῖς ὀφθαλμοῖς αὐτοῦ, πρὸς ὃν ἡμῖν ὁ λόγος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/013.yaml
  text: And no creature is hidden from his sight[a], but all things are naked and laid bare to his eyes[b], to whom we must give account.
translation:
  language: tl
  text: At walang anumang nilalang ang lingid sa kanyang paningin, ngunit ang lahat ay hubad at ganap na nakalantad sa kanyang mga mata[b]. Sa kanya tayo kailangang magsulit[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “sa kanya nauukol ang ating salita/usapin”; maaari ring unawain na “siya ang ating kaharap.”'
    reason: alternative_reading
  - marker: b
    text: Ang salitang isinaling “ganap na nakalantad” ay mula sa isang bihirang pandiwa na maaaring maglarawan sa leeg na inilantad o iniurong, na nagdiriin ng ganap na pagkakalantad sa harap ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: κτίσις
  choice: anumang nilalang
  rationale: Ginagamit ang pangngalang isahan sa pangkalahatang diwa para sa bawat nilikhang bagay o nilalang. Ang “anumang nilalang” ay likas sa Filipino at malinaw na nagpapanatili sa ideya ng pagiging nilikha.
- source_word: ἀφανὴς
  choice: maikukubli
  rationale: Sa konteksto, tumutukoy ito sa kawalan ng kakayahang magtago mula sa masusing pagtingin ng Diyos, hindi sa likas na pagiging di-nakikita.
- source_word: ἐνώπιον αὐτοῦ
  choice: sa kanyang paningin
  rationale: Bagaman literal na “sa harap niya,” natural na ipinahahayag ng “sa kanyang paningin” ang kaugnayan nito sa pagtitig at pagsisiyasat na binibigyang-diin ng kasunod na sugnay.
- source_word: πάντα
  choice: ang lahat
  rationale: Pinananatili nito ang ganap at malawak na saklaw ng neuter plural nang hindi nililimitahan sa mga tao lamang.
- source_word: γυμνὰ
  choice: hubad
  rationale: Tuwirang pinananatili ang matingkad na larawan ng ganap na pagkakalantad.
- source_word: τετραχηλισμένα
  choice: lubos na lantad
  rationale: Ang bihirang perfect participle ay nagsasaad ng kalagayang ganap na nakalantad, marahil may larawan ng leeg na inilantad o iniurong. Inihahatid ng salin ang tiyak na diwa nang hindi ipinipilit sa pangunahing teksto ang pinagtatalunang larawan.
- source_word: τοῖς ὀφθαλμοῖς αὐτοῦ
  choice: sa kanyang mga mata
  rationale: Likas at malapit sa anyong Griyego, at pinananatili ang metapora ng walang-takip na pagkakalantad sa paningin ng Diyos.
- source_word: πρὸς ὃν ἡμῖν ὁ λόγος
  choice: Sa kanya tayo kailangang magsulit
  rationale: Malinaw nitong ipinahahayag ang pananagutan sa Diyos na angkop sa konteksto ng pagsisiyasat at paghatol, habang inilalagay sa talababa ang higit na literal at posibleng alternatibong pagkaunawa.
theological_decisions:
- issue: Pagpapakahulugan sa πρὸς ὃν ἡμῖν ὁ λόγος
  choice: Sa kanya tayo kailangang magsulit.
  alternative: Sa kanya nauukol ang ating salita/usapin; o, siya ang ating kaharap.
  rationale: Sinusuportahan ng konteksto ng talatang 12–13 ang diwa ng pananagutan sa harap ng Diyos. Gayunman, siksik at idyomatiko ang Griyego, kaya hindi itinatago ang ibang posibleng pagbasa at inilalahad ang mga ito sa talababa.
translation_notes:
  register: 'Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “magsulit” sa diwang magbigay ng pananagutan; pormal ito ngunit pamilyar sa kontekstong biblikal. Inayos ang mga marker ayon sa sugnay na tunay nilang nililinaw: [b] sa “lubos na lantad” at [a] sa huling idyomatikong sugnay.'
