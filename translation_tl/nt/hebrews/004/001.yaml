source:
  edition: SBLGNT
  text: Φοβηθῶμεν οὖν μήποτε καταλειπομένης ἐπαγγελίας εἰσελθεῖν εἰς τὴν κατάπαυσιν αὐτοῦ δοκῇ τις ἐξ ὑμῶν ὑστερηκέναι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/001.yaml
  text: Therefore[a], let us fear lest, while the promise of entering his rest still remains[c][b], any one of you should seem to have fallen short.
translation:
  language: tl
  text: Kaya nga, matakot tayo, baka habang nananatili pa ang pangakong makapasok sa kanyang kapahingahan[b], ang sinuman sa inyo ay magmukhang hindi nakaabot[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Mas literal: “habang nananatili ang isang pangako na makapasok sa kanyang kapahingahan.” Siksik ang kayarian sa Griyego at maaaring isalin sa ganitong mas pormal na paraan.'
    reason: alternative_reading
  - marker: c
    text: O “ay magmukhang nabigong maabot iyon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Φοβηθῶμεν
  choice: matakot tayo
  rationale: Pinananatili nito ang tuwirang panghihikayat at bigat ng babala; hindi ito pinalalambot tungo sa simpleng pag-iingat.
- source_word: οὖν
  choice: Kaya nga
  rationale: Natural na nagpapahayag sa modernong Tagalog ng kongklusyon mula sa naunang babala tungkol sa hindi pagpasok sa kapahingahan.
- source_word: μήποτε
  choice: na baka
  rationale: Karaniwang Tagalog na naghahayag ng kinatatakutang negatibong posibilidad kasunod ng panghihikayat.
- source_word: καταλειπομένης ἐπαγγελίας
  choice: habang nananatili pa ang pangako
  rationale: Ipinahahayag ang kasabay na kalagayan ng genitive absolute at ang patuloy na bisa o pagkakaroon ng pangako.
- source_word: ἐπαγγελίας
  choice: pangako
  rationale: Tuwiran at natural na katumbas, at mahalaga sa argumento ng Hebreo 3–4.
- source_word: εἰσελθεῖν
  choice: makapasok
  rationale: Ipinahahayag ang infinitive bilang nilalaman ng pangako sa natural na Tagalog.
- source_word: κατάπαυσιν
  choice: kapahingahan
  rationale: Angkop sa temang 'rest' sa Hebreo 3–4 at hindi nililimitahan sa karaniwang pamamahinga lamang.
- source_word: αὐτοῦ
  choice: kanyang
  rationale: Pinananatili ang panghalip ng Griyego sa halip na tahasang idagdag ang pangalang Diyos.
- source_word: δοκῇ
  choice: lumitaw
  rationale: Pinananatili ang diwa ng paglitaw o pagpapakitang totoo nang hindi tahimik na nilulutas kung ito ay anyo lamang o isang aktuwal na hatol.
- source_word: τις ἐξ ὑμῶν
  choice: ang sinuman sa inyo
  rationale: Pinananatili ang indibiduwal na diin ng singular indefinite at partitive phrase.
- source_word: ὑστερηκέναι
  choice: hindi nakaabot
  rationale: Natural na ipinahahayag ang kabiguang maabot ang ipinangakong hantungan at ang resultang diwa ng perfect infinitive.
theological_decisions:
- issue: Kung papahinain ang babala tungo sa simpleng pag-iingat
  choice: matakot tayo
  alternative: mag-ingat tayo
  rationale: Malakas at tahasan ang φοβηθῶμεν. Dapat mapanatili ang tindi ng babala nang hindi nagpapasya para sa mambabasa tungkol sa mas malawak na doktrina ng pagtitiyaga o pagtalikod.
- issue: Kung tahasang kikilalanin sa pangunahing teksto ang kapahingahan bilang sa Diyos o bilang eskatolohikal
  choice: kanyang kapahingahan
  alternative: kapahingahan ng Diyos / kanyang kapahingahang Sabbath
  rationale: Panghalip ang ginamit ng talata. Ang pagpapanatili nito ay umiiwas sa pagdaragdag ng interpretatibong espesipikasyon, habang malinaw pa rin ang tinutukoy mula sa konteksto.
- issue: Kung ang δοκῇ ay aalisin o ituturing na simpleng katiyakan ng kabiguan
  choice: lumitaw na hindi nakaabot
  alternative: hindi nakaabot
  rationale: Pinananatili ng salin ang leksikal na nuance ng δοκέω at ang tunay na kalabuan kung paglitaw, pagtataya, o aktuwal na pagkabigo ang binibigyang-diin.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “Kaya nga” para sa malinaw na ugnayang lohikal, “matakot tayo” upang mapanatili ang tindi ng babala, at “kapahingahan” bilang kontekstuwal na terminong angkop sa Hebreo 3–4. Lahat ng marker [a]–[c] ay nasa pangunahing teksto.
