  text: Τούτων δὲ οὕτως κατεσκευασμένων, εἰς μὲν τὴν πρώτην σκηνὴν διὰ παντὸς εἰσίασιν οἱ ἱερεῖς τὰς λατρείας ἐπιτελοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/006.yaml
  text: With these things prepared in this way[a], the priests continually enter the first tabernacle, performing the services[b],
translation:
  language: tl
  text: Nang maihanda nang ganito ang mga ito, ang mga pari ay palaging pumapasok sa unang bahagi ng tabernakulo[a], habang ginagampanan nila ang mga tungkuling panritwal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “unang tolda” o “unang silid.” Ang salitang Griyego na σκηνή ay maaaring tumukoy sa tabernakulo o, sa kontekstong ito, sa unang seksiyon nito.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga paglilingkod” o “mga tungkulin sa pagsamba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτων δὲ οὕτως κατεσκευασμένων
  choice: Sa ganitong pagkakaayos ng mga bagay na ito
  rationale: Ipinapahayag nito ang kalagayang inilalarawan ng genitive absolute at ang pagkakaayos o paghahanda ng mga kagamitan na binanggit sa naunang talata. Hindi dinagdagan ng tahasang “Ngayon” ang banayad na pang-ugnay na δὲ.
- source_word: εἰς μὲν τὴν πρώτην σκηνὴν
  choice: sa unang bahagi ng tabernakulo
  rationale: Sa konteksto, tumutukoy ang σκηνή sa unang seksiyon ng tabernakulo. Pinananatili ng “tabernakulo” ang tiyak na kontekstong panritwal, samantalang nililinaw ng “unang bahagi” na hindi ibang buong tabernakulo ang tinutukoy.
- source_word: διὰ παντὸς
  choice: palaging
  rationale: Ipinahihiwatig nito ang regular at paulit-ulit na pagpasok ng mga pari, hindi ang walang patid na pananatili nila sa loob.
- source_word: εἰσίασιν
  choice: pumapasok
  rationale: Ang pangkasalukuyang anyo ay naglalarawan ng nakaugaliang kilos; natural itong ipinahahayag sa Filipino sa “pumapasok.”
- source_word: οἱ ἱερεῖς
  choice: ang mga pari
  rationale: Tumutukoy ito sa mga karaniwang pari, na ihahambing sa punong pari sa kasunod na talata.
- source_word: τὰς λατρείας ἐπιτελοῦντες
  choice: upang isagawa ang mga tungkulin sa pagsamba
  rationale: Ipinahahayag ng parirala ang pagsasagawa ng itinakdang mga gawaing panritwal. Natural sa Filipino ang layuning “upang isagawa” at hindi nito ipinahihiwatig ang makabagong kahulugan ng isang church service.
theological_decisions:
- issue: Kahulugan ng σκηνή sa paglalarawan ng santuwaryo
  choice: unang bahagi ng tabernakulo
  alternative: unang tolda; unang silid
  rationale: Ang konteksto ay ang unang seksiyon ng santuwaryo. Pinananatili ng salin ang kaugnayan sa tabernakulo ngunit hindi itinatago sa talababa ang posibleng literal o arkitektural na paglalarawan.
- issue: Lakas ng διὰ παντὸς sa ministeryo ng mga pari
  choice: palaging
  alternative: regular na; sa lahat ng panahon
  rationale: Ipinakikita nito ang patuloy na nakaugaliang pagpasok ng mga pari, bilang kaibahan sa limitadong pagpasok ng punong pari sa talata 7, nang hindi ipinahihiwatig na lagi silang pisikal na nasa loob.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “tabernakulo” dahil pamilyar ito sa kontekstong biblikal; nilinaw ng “unang bahagi” ang estruktura nang hindi inaalis ang leksikal na alternatibo. Ang “mga tungkulin sa pagsamba” ay nagpapanatili sa panritwal na diwa nang hindi tunog teknikal o makaluma.
