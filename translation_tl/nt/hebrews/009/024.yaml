source:
  edition: SBLGNT
  text: οὐ γὰρ εἰς χειροποίητα ⸂εἰσῆλθεν ἅγια⸃ Χριστός, ἀντίτυπα τῶν ἀληθινῶν, ἀλλ’ εἰς αὐτὸν τὸν οὐρανόν, νῦν ἐμφανισθῆναι τῷ προσώπῳ τοῦ θεοῦ ὑπὲρ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/024.yaml
  text: For Messiah did not enter into holy places made by hands[a], copies of the true things, but into heaven itself[c][b], now to appear in the presence of God on our behalf.
translation:
  language: tl
  text: Sapagkat hindi pumasok ang Mesiyas sa mga banal na lugar na ginawa ng mga kamay ng tao, na mga kopya[a] ng mga tunay na bagay, kundi sa langit mismo, upang ngayo'y humarap sa Diyos para sa atin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga representasyon” o “mga katumbas.” Ang salitang Griyego ay tumutukoy sa mga bagay na tumutugma sa tunay na makalangit na mga bagay.
    reason: lexical_alternative
  - marker: b
    text: Literal na, “upang ngayo'y magpakita sa harap ng mukha ng Diyos para sa atin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστός
  choice: ang Mesiyas
  rationale: Pinananatili ang kahulugan nito bilang titulo sa konteksto ng katuparan at paglilingkod bilang pari; mas malinaw ito kaysa sa anyong mas nagagamit na parang pangalang pantangi.
- source_word: χειροποίητα
  choice: ginawa ng mga kamay ng tao
  rationale: Likas na Filipino na nagpapanatili sa biblikal na paghahambing ng gusaling gawa ng tao at ng makalangit na realidad.
- source_word: ἅγια
  choice: mga banal na lugar
  rationale: Pinananatili ang anyong maramihan at ang bokabularyong nauugnay sa tabernakulo, nang hindi nililimitahan ang tinutukoy sa iisang silid.
- source_word: ἀντίτυπα
  choice: mga larawan
  rationale: Ipinahihiwatig ang mga bagay na tumutugma at kumakatawan sa tunay na makalangit na mga bagay; nililinaw sa talababa ang iba pang posibleng diwa.
- source_word: τῶν ἀληθινῶν
  choice: ng mga tunay na bagay
  rationale: Pinananatili ang substantibong maramihan at ang paghahambing sa pangwakas na makalangit na realidad.
- source_word: αὐτὸν τὸν οὐρανόν
  choice: sa langit mismo
  rationale: Ang “mismo” ay naghahatid ng diin ng intensive construction at ng tuwirang paghahambing sa makalupang huwaran.
- source_word: νῦν ἐμφανισθῆναι
  choice: upang ngayo'y humarap
  rationale: Ang “upang” ay nagpapahayag ng layunin, ang “ngayo'y” ay nagpapanatili sa temporal na diin, at ang “humarap” ay natural sa Filipino para sa paglitaw sa presensiya ng isang tao.
- source_word: τῷ προσώπῳ τοῦ θεοῦ
  choice: sa Diyos
  rationale: Kasama ng pandiwang “humarap,” natural nitong ipinahahayag ang literal na ideyang “sa harap ng mukha ng Diyos” nang hindi mabigat o paulit-ulit.
- source_word: ὑπὲρ ἡμῶν
  choice: para sa atin
  rationale: Malinaw at natural na naghahatid ng pagkilos alang-alang sa atin, habang hindi nagdaragdag ng isang tiyak na teorya tungkol sa pamamagitan o pagtubos.
theological_decisions:
- issue: Kultikong kahulugan ng ἅγια
  choice: mga banal na lugar
  alternative: ang santuwaryo; ang banal na lugar
  rationale: Ang Griyego ay maramihan at maaaring tumukoy sa mga banal na dako bilang kabuuan. Ang maramihang salin ay nagpapanatili sa larawan ng tabernakulo at sa hindi ganap na tiyak na saklaw ng katawagan.
- issue: Titulong Χριστός
  choice: ang Mesiyas
  alternative: si Cristo
  rationale: Aktibo rito ang tungkulin ng Χριστός sa argumento tungkol sa makasaserdoteng pagpasok at katuparan; ang salin ay hindi nagbabago sa pagkakakilanlan ng tinutukoy.
- issue: Lakas ng ὑπὲρ ἡμῶν
  choice: para sa atin
  alternative: alang-alang sa atin; bilang kinatawan natin
  rationale: Pinananatili nito ang malawak na diwa ng pagkilos para sa kapakanan natin. Hindi tahasang idinaragdag ang “bilang kinatawan,” bagaman naaayon iyon sa kontekstong makasaserdote.
- issue: Pagharap sa Diyos
  choice: upang ngayo'y humarap sa Diyos
  alternative: upang ngayo'y magpakita sa presensiya ng Diyos; upang ngayo'y lumitaw sa harap ng mukha ng Diyos
  rationale: Natural at marangal ito sa Filipino at pinagsasama ang ἐμφανισθῆναι at τῷ προσώπῳ nang hindi nawawala ang personal at tuwirang paglapit sa Diyos.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “Mesiyas” bilang makahulugang titulo, “mga banal na lugar” upang mapanatili ang maramihan, at “humarap sa Diyos” bilang likas na pagsasalin ng idyomang may “mukha/presensiya.”
