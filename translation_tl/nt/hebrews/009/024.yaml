  to: Sapagkat hindi pumasok ang Mesiyas sa mga banal na lugar na ginawa ng mga kamay ng tao, na mga kopya[a] ng mga tunay na bagay, kundi sa langit mismo, upang ngayo'y humarap sa Diyos para sa atin.[b]
