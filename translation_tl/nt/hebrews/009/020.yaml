  text: saying[a], “This is the blood of the covenant that God commanded for you.”
translation:
  language: tl
  text: na nagsasabi, “Ito ang dugo ng tipan na ipinag-utos ng Diyos sa inyo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγων
  choice: na sinasabi
  rationale: Ang kasalukuyang participle ay nag-uugnay sa siping ito sa naunang kilos; pinananatili ng “na sinasabi” ang ugnayang iyon nang hindi ito ginagawang hiwalay na pandiwa.
- source_word: Τοῦτο
  choice: Ito ang
  rationale: Walang hayag na copula sa Griyego, ngunit likas sa Tagalog ang predikasyong “Ito ang” bago ang pariralang pangngalan.
- source_word: αἷμα
  choice: dugo
  rationale: Tuwirang katumbas na nagpapanatili sa kongkretong larawan ng dugong ginagamit sa pagpapatibay ng tipan.
- source_word: διαθήκης
  choice: tipan
  rationale: Ang konteksto at alusyon sa Exodo 24:8 ay tumutukoy sa tipan, hindi sa huling habilin o testamento.
- source_word: ἧς
  choice: na
  rationale: Likas na iniuugnay ng “na” ang “tipan” sa sugnay na nagsasabing iniutos ito ng Diyos, nang hindi pinabibigat ang pangungusap.
- source_word: ἐνετείλατο
  choice: iniutos
  rationale: Malinaw at karaniwang salin ng pandiwang nangangahulugang mag-utos o magbigay ng tagubilin.
- source_word: πρὸς ὑμᾶς
  choice: para sa inyo
  rationale: Ipinahahayag nito na ang utos tungkol sa tipan ay nakatuon sa bayan; natural ito sa Tagalog habang pinananatili ang saklaw ng πρός sa konteksto.
- source_word: ὁ θεός
  choice: Diyos
  rationale: Karaniwan at tuwirang salin; walang natatanging titulo rito na kailangang palawakin.
theological_decisions:
- issue: Pagpapakahulugan sa διαθήκη sa konteksto ng pagpapatibay sa pamamagitan ng dugo
  choice: tipan
  alternative: testamento
  rationale: Tinutukoy ng talata ang tipang Mosaiko at umaalingawngaw sa Exodo 24:8; ang “testamento” ay maaaring magpasok ng di-angkop na diwa ng huling habilin.
- issue: Pagpapahayag ng ipinahihiwatig na copula pagkatapos ng Τοῦτο
  choice: Ito ang dugo ng tipan
  alternative: Ito, ang dugo ng tipan
  rationale: Ang “Ito ang” ang malinaw at likas na predikasyon sa Tagalog at hindi nagdaragdag ng teolohikal na nilalaman sa ipinahihiwatig ng Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pagbasa ng Kasulatan. Pinanatili ang participial na ugnayan sa naunang talata sa pamamagitan ng “na sinasabi.” Hindi kailangan ang talababa sapagkat ang mas literal na “sa inyo” para sa πρὸς ὑμᾶς ay mas alanganin dito at hindi nagdadala ng mahalagang alternatibong kahulugan sa Tagalog.
