  text: ἥτις παραβολὴ εἰς τὸν καιρὸν τὸν ἐνεστηκότα, καθ’ ⸀ἣν δῶρά τε καὶ θυσίαι προσφέρονται μὴ δυνάμεναι κατὰ συνείδησιν τελειῶσαι τὸν λατρεύοντα,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/009.yaml
  text: which is a parable for the present time[a], according to which both gifts and sacrifices are offered that are not able to perfect the worshiper with respect to conscience,
translation:
  language: tl
  text: Ito ay isang talinghaga para sa kasalukuyang panahon[a]. Alinsunod sa kaayusang ito, inihahandog ang mga kaloob at mga hain na hindi kayang magpasakdal sa sumasamba pagdating sa budhi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sagisag” o “larawan” para sa kasalukuyang panahon.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥτις
  choice: Ito ay
  rationale: Tumutukoy ito sa naunang kaayusan ng tolda at likas sa Filipino bilang panimulang paliwanag.
- source_word: παραβολὴ
  choice: talinghaga
  rationale: Pinananatili ang pangunahing leksikal na diwa ng isang matalinghagang pagtutumbas; inilalagay sa talababa ang angkop-sa-kontekstong alternatibong “sagisag” o “larawan.”
- source_word: εἰς τὸν καιρὸν τὸν ἐνεστηκότα
  choice: para sa panahong kasalukuyan
  rationale: Malapit sa Griyego at hindi nilulutas kung eksaktong aling yugto sa argumento ang tinutukoy.
- source_word: καθ’ ἣν
  choice: Alinsunod dito
  rationale: Ipinahahayag ang ugnayang namamahala sa paghahandog nang natural sa Filipino, habang pinananatili ang pagtukoy sa naunang talinghaga o kaayusan.
- source_word: δῶρά τε καὶ θυσίαι
  choice: mga kaloob at mga handog
  rationale: Pinananatili ang dalawang magkaugnay ngunit magkahiwalay na terminong pangkulto; ang “handog” ay natural na katumbas ng θυσίαι sa kontekstong ito.
- source_word: προσφέρονται
  choice: inihahandog
  rationale: Ang pangkasalukuyang anyong balintiyak ay nagpapahiwatig ng nagpapatuloy na gawaing pangkulto.
- source_word: μὴ δυνάμεναι
  choice: hindi makapagpapasakdal
  rationale: Malinaw at natural na ipinapahayag ang kawalan ng kakayahan ng mga kaloob at handog.
- source_word: κατὰ συνείδησιν
  choice: sa budhi
  rationale: Itinatakda nito ang saklaw kung saan hindi naisasakdal ang sumasamba, nang hindi ipinakahulugang katapatan lamang ng damdamin.
- source_word: τελειῶσαι
  choice: makapagpapasakdal
  rationale: Pinananatili ang mahalagang bokabularyo ng Hebreo tungkol sa pagdadala sa nilalayong ganap o angkop na kalagayan sa harap ng Diyos.
- source_word: τὸν λατρεύοντα
  choice: ng sumasamba
  rationale: Maikli, natural, at pinananatili ang isahang taong gumaganap ng pagsambang pangkulto.
theological_decisions:
- issue: Pagbibigay-kahulugan sa παραβολή sa kontekstong pangkulto at tipolohikal
  choice: talinghaga
  alternative: sagisag o larawan
  rationale: Pinananatili ng “talinghaga” ang leksikal at matalinghagang pagtutumbas nang hindi ito nililimitahan sa isang abstraktong sagisag lamang; kinikilala sa talababa ang mga alternatibong mas karaniwan sa kontekstong ito.
- issue: Saklaw ng κατὰ συνείδησιν
  choice: makapagpapasakdal sa budhi ng sumasamba
  alternative: makapagpasakdal sa sumasamba kung tungkol sa budhi
  rationale: Natural ito sa Filipino at malinaw na ang budhi ang larangan ng kakulangang tinutukoy, hindi isang pangkalahatang pahayag na walang hangganan tungkol sa sumasamba.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “talinghaga” at “pasakdal” upang mapanatili ang leksikal at teolohikal na bigat ng talata; nilinaw sa talababa ang mga alternatibo para sa παραβολή.
