revisions:
- from: Ito ay isang talinghaga para sa panahong kasalukuyan[a]. Alinsunod dito, inihahandog ang mga kaloob at mga handog na hindi makapagpapasakdal sa budhi ng sumasamba.
  to: Ito ay isang talinghaga para sa kasalukuyang panahon[a]. Alinsunod sa kaayusang ito, inihahandog ang mga kaloob at mga hain na hindi kayang magpasakdal sa sumasamba pagdating sa budhi.
  rationale: Inayos ang pangungusap upang ang sumasamba, hindi ang budhi, ang malinaw na layon ng “magpasakdal,” habang nananatiling ang budhi ang saklaw ng pahayag. Pinalitan ang ikalawang “mga handog” ng “mga hain” upang maipakita ang pares na δῶρα at θυσίαι. Ang “kaayusang ito” ay ginagawang malinaw ang ugnayang tinutukoy ng καθ’ ἣν sa naunang kaayusan ng santuwaryo, nang hindi nagdadagdag ng doktrinal na pakahulugan.
