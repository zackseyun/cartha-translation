base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/001.yaml
  text: Even the first covenant had regulations for worship and an earthly sanctuary[a][b].
translation:
  language: tl
  text: Maging ang unang tipan ay may mga tuntunin sa pagsamba at isang santuwaryong makalupa[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang una.” Malamang na tumutukoy ito sa unang tipan; binibigyang-kahulugan naman ito ng ilan sa mas pangkalahatang diwang “ang unang kaayusan.”
    reason: alternative_reading
  - marker: b
    text: O “isang santuwaryong makamundo”; malamang na “makalupa” ang diwa rito, bilang kaibahan sa makalangit na mga realidad na tatalakayin sa bandang huli ng kabanata.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶχε
  choice: ay may
  rationale: Ipinahahayag ng imperpektong anyo ang kalagayang taglay ng naunang kaayusan; natural sa modernong Tagalog ang “ay may” sa ganitong paglalarawan.
- source_word: μὲν οὖν
  choice: Maging
  rationale: Ipinahihiwatig ng tambalan ang pagpapatuloy na may banayad na diin; naihahatid ng “Maging” ang emphatic/concessive na puwersa nang hindi nagdaragdag ng tahasang panandang temporal.
- source_word: ἡ πρώτη
  choice: ang unang tipan
  rationale: Bagaman hindi inuulit sa Griyego ang pangngalan, ang pambabaeng substantibong “una” ay pinakamalamang na tumutukoy sa unang tipan sa agarang konteksto ng 8:13. Nililinaw ng pagdagdag sa “tipan” ang elipsis.
- source_word: δικαιώματα
  choice: mga tuntunin
  rationale: Sa kontekstong kultiko, tumutukoy ito sa mga itinakdang alituntunin o ordinansa para sa pagsamba; malinaw at karaniwan sa Tagalog ang “mga tuntunin.”
- source_word: λατρείας
  choice: sa pagsamba
  rationale: Ipinakikita ng henitibo ang larangan o layunin ng mga tuntunin. Likas sa Tagalog ang “sa pagsamba” at pinananatili nito ang kultikong diwa.
- source_word: τό τε ἅγιον
  choice: santuwaryo
  rationale: Tumutukoy ito sa sagradong lugar na kaugnay ng pagsamba sa ilalim ng unang tipan. Sapat ang lawak ng “santuwaryo” sapagkat ilalarawan pa sa mga susunod na talata ang mga bahagi nito.
- source_word: κοσμικόν
  choice: makalupa
  rationale: Ang diin ay sa kaibahan nito sa makalangit na mga realidad sa susunod na talakayan, hindi sa moral na kahulugan ng pagiging makamundo.
theological_decisions:
- issue: Ipinahihiwatig na tinutukoy ng ἡ πρώτη
  choice: ang unang tipan
  alternative: ang una; ang unang kaayusan; ang unang tolda
  rationale: Ang agarang konteksto sa Hebreo 8 ay naghahambing sa una at bagong tipan. Pinakamalamang kung gayon na “tipan” ang ipinahihiwatig na pangngalan, ngunit pinananatili sa talababa ang mas pangkalahatang posibilidad.
- issue: Kahulugan ng κοσμικόν
  choice: makalupa
  alternative: makamundo; nauukol sa sanlibutan
  rationale: Ang konteksto ay naghahambing ng santuwaryo sa lupa at ng makalangit na mga realidad, kaya iniiwasan ng “makalupa” ang di-sinasadyang pahiwatig ng kasamaan o moral na kamunduhan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “tipan,” “mga tuntunin,” at “santuwaryo” bilang pamilyar ngunit dignified na bokabularyong biblikal. Inilagay ang dalawang panandang talababa sa mismong teksto at iniwasan ang isang tahasang “Ngayon,” sapagkat walang temporal na “now” sa pinagmulan.
