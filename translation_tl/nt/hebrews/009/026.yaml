revisions:
- from: Kung hindi, kinailangan sana niyang magdusa nang maraming ulit mula pa nang itatag ang sanlibutan. Ngunit ang totoo, minsanan siyang nahayag sa kaganapan ng mga kapanahunan upang pawalang-bisa ang kasalanan sa pamamagitan ng paghahandog niya ng kanyang sarili.[a][b]
  to: Kung hindi, kinailangan sana niyang magdusa nang maraming ulit mula nang itatag ang sanlibutan. Ngunit ngayon, minsan na siyang nahayag sa kasukdulan ng mga kapanahunan upang pawalang-bisa ang kasalanan sa pamamagitan ng paghahandog niya ng kanyang sarili.[a][b][c]
  rationale: Inayos ang naturalness ng ἅπαξ at ang mas tuwirang pangatnig na temporal/argumentative para sa νυνὶ δέ, nang hindi binabago ang kahulugan. Ang «kasukdulan» ay nagpapahayag ng culmination ng συντέλεια, at ang idinagdag na talababa ay nagbibigay ng alternatibo para sa paraan ng pagsasalin ng θυσίας αὐτοῦ.
