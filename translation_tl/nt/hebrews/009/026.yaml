source:
  edition: SBLGNT
  text: ἐπεὶ ἔδει αὐτὸν πολλάκις παθεῖν ἀπὸ καταβολῆς κόσμου· ⸀νυνὶ δὲ ἅπαξ ἐπὶ συντελείᾳ τῶν αἰώνων εἰς ἀθέτησιν ⸀ἁμαρτίας διὰ τῆς θυσίας αὐτοῦ πεφανέρωται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/026.yaml
  text: Otherwise[a], he would have had to suffer many times since the foundation of the world. But as it is[c][b], he has appeared once for all at the consummation of the ages to put away sin through the sacrifice of himself.
translation:
  language: tl
  text: Kung hindi, kinailangan sana niyang magdusa nang maraming ulit mula nang itatag ang sanlibutan. Ngunit ngayon, minsan na siyang nahayag sa kasukdulan ng mga kapanahunan upang pawalang-bisa ang kasalanan sa pamamagitan ng paghahandog niya ng kanyang sarili.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring «sa wakas ng mga kapanahunan.»
    reason: lexical_alternative
  - marker: b
    text: Maaaring «upang alisin ang kasalanan» o «upang pawalang-saysay ang kasalanan.»
    reason: lexical_alternative
  - marker: c
    text: Maaaring «sa pamamagitan ng kanyang paghahandog.» Mas literal, «sa pamamagitan ng paghahandog niya ng kanyang sarili.»
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: Kung hindi
  rationale: 'Ipinahahayag nito ang kahihinatnan ng salungat na palagay sa naunang argumento: kung paulit-ulit ang paghahandog, paulit-ulit din sana ang pagdurusa.'
- source_word: ἔδει αὐτὸν πολλάκις παθεῖν
  choice: kinailangan sana niyang magdusa nang maraming ulit
  rationale: Ang «sana» ay naghahayag ng hipotetikal na pangangailangan, at ang «maraming ulit» ay tuwirang kasalungat ng ἅπαξ.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: mula pa nang itatag ang sanlibutan
  rationale: Natural na salin ito ng panahong nagsisimula sa pagkakatatag ng κόσμος at nagpapatuloy mula noon.
- source_word: νυνὶ δὲ
  choice: Ngunit ang totoo
  rationale: Sa konteksto, matindi nitong itinatapat ang aktuwal na nangyari sa hipotetikal na kalagayang kababanggit lamang.
- source_word: ἅπαξ
  choice: minsanan
  rationale: Ipinahahayag ng «minsanan» ang isang pangyayaring hindi na kailangang ulitin, kasalungat ng «maraming ulit.»
- source_word: ἐπὶ συντελείᾳ τῶν αἰώνων
  choice: sa kaganapan ng mga kapanahunan
  rationale: Pinananatili ng «kaganapan» ang diwa ng pagdating sa rurok o katuparan, at ng maramihang «mga kapanahunan» ang plural na αἰώνων.
- source_word: εἰς ἀθέτησιν ἁμαρτίας
  choice: upang pawalang-bisa ang kasalanan
  rationale: Ang ἀθέτησις ay maaaring mangahulugang pag-aalis, pagsasantabi, o pagpapawalang-bisa. Ang napiling salin ay nagpapanatili sa matinding diwa nito nang hindi ipinapaliwanag nang lampas sa teksto.
- source_word: διὰ τῆς θυσίας αὐτοῦ
  choice: sa pamamagitan ng paghahandog niya ng kanyang sarili
  rationale: Nililinaw nito na siya mismo ang inihandog habang nananatiling natural sa modernong Tagalog.
- source_word: πεφανέρωται
  choice: siyang nahayag
  rationale: Ang «nahayag» ay angkop sa pagpapakita ni Cristo sa kasaysayan at hindi nililimitahan ang pandiwa sa basta pisikal na pagpapakita.
theological_decisions:
- issue: Diwa ng ἅπαξ sa paghahandog ni Cristo
  choice: «minsanan» bilang tiyak at hindi paulit-ulit na pangyayari
  alternative: «isang beses»
  rationale: Ang tahasang pagsalungat nito sa πολλάκις at ang argumento ng kabanata ay nagbibigay-diin sa hindi pag-uulit, ngunit hindi nagdaragdag ng doktrinang wala sa talata.
- issue: Saklaw ng isahang ἁμαρτίας
  choice: «ang kasalanan» sa isahan
  alternative: «mga kasalanan»
  rationale: Pinananatili nito ang gramatikal na isahan at ang posibleng pagtukoy sa kasalanan bilang kabuuang realidad, nang hindi ikinakaila ang mga indibiduwal na kasalanan.
- issue: Kahulugan ng συντέλεια τῶν αἰώνων
  choice: «kaganapan ng mga kapanahunan»
  alternative: «wakas ng mga kapanahunan»
  rationale: Iniiwasang paliitin ang parirala sa isang payak na huling petsa; maaaring tumukoy ang συντέλεια sa rurok, katuparan, o pagkakaganap ng magkakasunod na panahon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang «sanlibutan» at «mga kapanahunan» upang mapanatili ang bigat ng talata; iniwasan ang sobrang teknikal o denominasyonal na pananalita. Ang mga pananda ng talababa ay inilagay sa pangunahing teksto.
