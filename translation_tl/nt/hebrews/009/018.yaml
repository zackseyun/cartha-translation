  source_fidelity: 'Tumpak ang salin sa lahat ng pangunahing elemento: ang inferential na ὅθεν (''Kaya''), ang emphatic na οὐδὲ (''maging ... ay hindi''), ang ipinahiwatig na ἡ πρώτη na wastong nilinaw bilang ''ang unang tipan,'' ang χωρὶς αἵματος (''nang walang dugo''), at ang perfect passive na ἐγκεκαίνισται (''pinasinayaan''). Ang ayos na ''Kaya maging ang unang tipan ay hindi pinasinayaan nang walang dugo'' ay malinaw na naghahayag na hindi ito pinasinayaan kung walang dugo, nang walang labis na pagpapakahulugan.'
