  text: ὅθεν οὐδὲ ἡ πρώτη χωρὶς αἵματος ἐγκεκαίνισται·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/018.yaml
  text: Therefore not even the first covenant was inaugurated without blood[a].
translation:
  language: tl
  text: Kaya maging ang unang tipan ay hindi pinasinayaan nang walang dugo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang una”—samakatuwid, ang unang tipan. Sa Griyego, ipinahiwatig lamang ang pangngalan; maaari rin itong isalin nang mas pormal bilang “ang unang testamento.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅθεν
  choice: Kaya
  rationale: Likas at malinaw na panandang naghihinuha sa modernong Tagalog; inuugnay nito ang talata sa naunang pangangatwiran tungkol sa tipan, kamatayan, at dugo.
- source_word: οὐδὲ
  choice: maging ... ay hindi
  rationale: Ipinahahayag ang mariing diwa ng ‘not even,’ na idiniriin na saklaw din ng prinsipyong ito ang unang tipan.
- source_word: ἡ πρώτη
  choice: ang unang tipan
  rationale: Bagaman hindi inuulit sa Griyego ang pangngalan, ang pambabaeng pang-uri ay tumutukoy sa tipang tinatalakay sa konteksto. Idinagdag ang ‘tipan’ para sa kalinawan nang hindi nagdaragdag ng bagong ideya.
- source_word: χωρὶς αἵματος
  choice: nang walang dugo
  rationale: Natural na pariralang Tagalog na nagpapanatili sa literal at ritwal na diin sa kawalan o pangangailangan ng dugo.
- source_word: ἐγκεκαίνισται
  choice: pinasinayaan
  rationale: Ang pandiwa ay tumutukoy sa pagpapasimula o pagtatalaga ng isang kaayusan. Ang ‘pinasinayaan’ ay angkop sa seremonyal na pagsisimula ng tipan at hindi ito nililimitahan sa legal na pagpapatibay lamang.
theological_decisions:
- issue: Tinutukoy ng ‘ang una’
  choice: ang unang tipan
  alternative: ang una; ang unang testamento; ang unang kaayusan ng tabernakulo
  rationale: Ang malapit na konteksto at ang pahiwatig sa Exodo 24 ay nakatuon sa unang tipan na pinasinayaan sa pamamagitan ng dugo. Gayunman, pinananatili sa talababa na ipinahiwatig lamang sa Griyego ang pangngalan at na maaaring isalin itong ‘testamento.’
translation_notes:
  register: Modernong Filipino Tagalog na maikli, dignified, at madaling maunawaan. Pinili ang ‘tipan’ bilang karaniwang salitang biblikal at ang ‘pinasinayaan’ upang mapanatili ang seremonyal na diwa ng ἐγκαινίζω.
