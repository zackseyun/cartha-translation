lexical_decisions:
- source_word: μετὰ ... τὸ δεύτερον καταπέτασμα
  choice: sa likod ng ikalawang kurtina
  rationale: Dito, ang μετά na may accusative ay nagsasaad ng puwesto sa paglalarawan ng santuwaryo. Likas at malinaw sa modernong Tagalog ang “sa likod,” at ang καταπέτασμα ay ang panloob na kurtinang naghihiwalay sa mga bahagi ng tabernakulo.
- source_word: δὲ
  choice: At
  rationale: Banayad na pang-ugnay ang δέ na nagpapatuloy sa paglalarawan; hindi nito kailangang ipahiwatig ang mariing pagsalungat.
- source_word: σκηνὴ
  choice: bahagi ng tabernakulo
  rationale: Bagaman literal na “tolda” o “tabernakulo” ang σκηνή, sa konteksto ay tumutukoy ito sa panloob na seksiyon ng tabernakulo. Nililinaw ng “bahagi ng tabernakulo” ang tinutukoy nang hindi ito ginagawang karaniwang silid lamang.
- source_word: ἡ λεγομένη
  choice: na tinatawag na
  rationale: Natural na katumbas ito ng attributive participial phrase sa Tagalog.
- source_word: Ἅγια Ἁγίων
  choice: Dakong Kabanal-banalan
  rationale: Ipinahahayag nito ang Hebraic superlative na literal na “Banal ng mga Banal” at malinaw na tumutukoy sa pinakabanal na bahagi ng santuwaryo. Pinananatili sa talababa ang mas literal na anyo.
theological_decisions:
- issue: Pagsasalin sa katawagang Ἅγια Ἁγίων para sa santuwaryo
  choice: Dakong Kabanal-banalan
  alternative: Banal ng mga Banal
  rationale: Ang pangunahing salin ay natural, marangal, at madaling maunawaan bilang pangalan ng pinakaloob na santuwaryo. Ang mas literal na anyo ay inilalagay sa talababa upang mapanatili ang anyo at diin ng orihinal na idyoma nang hindi nagdaragdag ng denominasyonal na interpretasyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at malinaw. Ginamit ang pamilyar na terminong “tabernakulo” para sa kontekstong panambahan, ngunit nilagyan ng “bahagi” upang maipakitang ang tinutukoy ay ang panloob na seksiyon nito. Ang lahat ng marker ng talababa ay nasa pangunahing teksto.
