  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὑπεράνω δὲ αὐτῆς Χερουβὶν δόξης κατασκιάζοντα τὸ ἱλαστήριον· περὶ ὧν οὐκ ἔστιν νῦν λέγειν κατὰ μέρος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/005.yaml
  text: And above it were the cherubim of glory overshadowing the atoning sacrifice[a]; about these things it is not now possible to speak in detail.
translation:
  language: tl
  text: Sa ibabaw naman nito ay ang mga kerubin ng kaluwalhatian na lumililim sa takip ng kaban[a]. Hindi posibleng talakayin ngayon nang isa-isa ang mga ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “luklukan ng awa,” ang takip ng kaban. Maaari ring isalin bilang “pambayad-sala” o “pampalubag-loob,” ngunit sa kontekstong ito ay tumutukoy ito sa takip ng kaban.
    reason: Ipinapakita ang tradisyonal at mas abstraktong mga salin ng ἱλαστήριον, samantalang nililinaw ang konkretong referent nito sa konteksto ng santuwaryo.
lexical_decisions:
- source_word: ὑπεράνω δὲ αὐτῆς
  choice: Sa ibabaw nito
  rationale: Ipinapahayag ang kinalalagyan sa ibabaw ng kaban na binanggit sa naunang talata. Ang “nito” ay natural na pantukoy sa isang bagay at hindi inuulit nang di-kailangan ang “kaban.”
- source_word: Χερουβὶν
  choice: mga kerubin
  rationale: Karaniwang transliterasyon sa Filipino para sa maramihang anyo ng mga makalangit na nilalang; iniiwasan ang larawang maaaring idulot ng kolokyal na “kerubin” bilang munting anghel sa sining sa pamamagitan ng malinaw na biblikal na konteksto.
- source_word: δόξης
  choice: ng kaluwalhatian
  rationale: 'Pinananatili ang maikli at posibleng maraming-kahulugang ugnayang henitibo: maaaring inuugnay ang mga kerubin sa kaluwalhatian ng Diyos o inilalarawan silang maluwalhati, nang hindi ipinipilit ang isa lamang.'
- source_word: κατασκιάζοντα
  choice: lumililim sa
  rationale: Natural na Filipino para sa pag-uunat ng mga kerubin sa ibabaw ng takip na para bang nilililiman o tinatakpan iyon.
- source_word: τὸ ἱλαστήριον
  choice: takip ng pagtubos
  rationale: Sa kontekstong ito, ang salita ay tumutukoy sa mismong takip ng kaban, ngunit may kaugnayan din sa ritwal ng pagtubos. Pinagsasama ng saling ito ang konkretong bagay at ang kultikong tungkulin nito, habang inilalahad sa talababa ang tradisyonal at iba pang posibleng salin.
- source_word: περὶ ὧν
  choice: Tungkol sa mga bagay na ito
  rationale: Malinaw na tumutukoy sa mga kagamitan at detalye ng santuwaryong kababanggit lamang.
- source_word: οὐκ ἔστιν νῦν λέγειν κατὰ μέρος
  choice: hindi maaaring magsalita ngayon nang isa-isa
  rationale: Pinananatili ang impersonal na anyo at ang diwa ng κατὰ μέρος bilang pagtalakay sa bawat detalye, sa halip na magdagdag ng tahasang “natin” na wala sa Griyego.
theological_decisions:
- issue: Kahulugan ng ἱλαστήριον sa konteksto ng kagamitan ng santuwaryo
  choice: takip ng pagtubos
  alternative: luklukan ng awa; pambayad-sala o pampalubag-loob
  rationale: Ang tinutukoy sa Hebreo 9:5 ay konkretong takip ng kaban, hindi isang handog na hiwalay sa kaban. Gayunman, may teolohikal na pahiwatig ang terminong Griyego tungkol sa pagtubos o pagpapalubag. Kaya pinanatili sa pangunahing teksto ang bagay at tungkulin nito, at inilagay sa talababa ang tradisyonal at abstraktong mga posibilidad.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang biblikal na terminong “mga kerubin” at ang siksik na pariralang “ng kaluwalhatian.” Ang “nang isa-isa” ay mas madaling maunawaan ng karaniwang mambabasa kaysa sa teknikal na “nang detalyado” at malapit sa literal na diwa ng κατὰ μέρος.
