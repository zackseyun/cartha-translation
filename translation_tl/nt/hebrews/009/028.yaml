  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὕτως καὶ ὁ Χριστός, ἅπαξ προσενεχθεὶς εἰς τὸ πολλῶν ἀνενεγκεῖν ἁμαρτίας, ἐκ δευτέρου χωρὶς ἁμαρτίας ὀφθήσεται τοῖς αὐτὸν ἀπεκδεχομένοις εἰς σωτηρίαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/028.yaml
  text: so also the Messiah[a], having been offered once to bear the sins of many, will appear a second time, apart from sin, to those who eagerly await him, for salvation.
translation:
  language: tl
  text: Gayundin, ang Mesiyas, na inihandog nang minsan upang pasanin ang mga kasalanan ng marami, ay magpapakita sa ikalawang pagkakataon, hiwalay sa kasalanan[a], sa mga sabik na naghihintay sa kanya, para sa kaligtasan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi na kaugnay ng kasalanan,” ibig sabihin, hindi upang pasanin ang kasalanan gaya ng sa una niyang paghahandog.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ
  choice: Gayundin
  rationale: Likas na Filipino na nag-uugnay sa paghahambing sa talata 27 at pinananatili ang diwang “sa gayon ding paraan.”
- source_word: ὁ Χριστός
  choice: ang Mesiyas
  rationale: Isinasalin ang Χριστός bilang titulong Mesiyas, angkop sa gamit nitong kristolohikal sa pangangatwiran tungkol sa kaligtasan.
- source_word: ἅπαξ
  choice: minsang
  rationale: Tuwirang ipinahahayag ang minsanang pangyayari nang hindi idinaragdag ang “minsan at magpakailanman,” na hindi tahasang nasa salita.
- source_word: προσενεχθεὶς
  choice: na minsang inihandog
  rationale: Pinananatili ang balintiyak na anyo at ang naunang pagkahandog kaugnay ng hinaharap na pagpapakita.
- source_word: εἰς τὸ πολλῶν ἀνενεγκεῖν ἁμαρτίας
  choice: upang pasanin ang mga kasalanan ng marami
  rationale: Ipinakikita ng “upang” ang layunin; pinananatili ng “pasanin” ang sakripisyal at Isaianic na alingawngaw ng ἀναφέρω.
- source_word: πολλῶν
  choice: marami
  rationale: Payak at malapit sa Griyego, at hindi pinapahina ang posibleng alusyon sa Isaias 53.
- source_word: ἐκ δευτέρου
  choice: sa ikalawang pagkakataon
  rationale: Malinaw na ipinakikita ang ikalawang paglitaw at ang kaibahan nito sa una.
- source_word: χωρὶς ἁμαρτίας
  choice: hiwalay sa kasalanan
  rationale: Malapit sa literal na anyo at pinananatili ang maikli ngunit teolohikong masalimuot na pahayag; ipinaliliwanag ang kontekstuwal na diwa sa talababa.
- source_word: ὀφθήσεται
  choice: ay magpapakita
  rationale: Likas na pagpapahayag sa Filipino ng eskatolohikal na paglitaw, sa halip na kahoy na “makikita.”
- source_word: τοῖς αὐτὸν ἀπεκδεχομένοις
  choice: sa mga sabik na naghihintay sa kanya
  rationale: Ipinahahayag ng “sabik” ang masidhing paghihintay at pananabik na taglay ng ἀπεκδέχομαι.
- source_word: εἰς σωτηρίαν
  choice: para sa kaligtasan
  rationale: Maikli at likas na ipinahahayag ang layunin o hantungan nang hindi pinalalawak sa “dala ang kaligtasan.”
theological_decisions:
- issue: Kahulugan ng χωρὶς ἁμαρτίας sa ikalawang pagpapakita
  choice: hiwalay sa kasalanan
  alternative: hindi na kaugnay ng pagdadala ng kasalanan; hindi upang harapin ang kasalanan
  rationale: Pinananatili sa pangunahing teksto ang siksik at tunay na di-tiyak na pananalita ng Griyego. Inilalagay sa talababa ang malamang na kontekstuwal na paliwanag na ang ikalawang pagpapakita ay hindi na para pasanin ang kasalanan gaya ng unang paghahandog.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Mesiyas” bilang tunay na titulo, ang “inihandog” upang mapanatili ang balintiyak, at ang “sabik na naghihintay” upang maipahayag ang diin ng pandiwang Griyego. Ang marker na [a] ay nakalagay mismo sa pariralang tinatalabaan.
