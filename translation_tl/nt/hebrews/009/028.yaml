    issue: Ang “minsan” ay nasa anyong “minsang inihandog.”
    rationale: Ang pang-abay na “minsang” ay puwedeng unawain bilang di-tiyak na “at one time.” Ang “inihandog nang minsan” ay mas tuwirang katumbas ng ἅπαξ, nang hindi idinadagdag ang di-tahasang “minsan at magpakailanman.”
  - severity: low
    issue: Ang paliwanag sa talababa ay “gaya ng ginawa niya sa una niyang paghahandog.”
    rationale: Mas maingat na iugnay ang paghahambing sa “una niyang paghahandog” mismo, upang hindi magmukhang binabago ng paliwanag ang balintiyak na anyo ng unang paghahandog.
