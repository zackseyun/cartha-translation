  source_fidelity: 'Tapat ang salin sa pangunahing daloy ng Griyego: ang Mesiyas ay minsang inihandog upang pasanin ang mga kasalanan ng marami at magpapakita sa ikalawang pagkakataon sa mga naghihintay sa kanya para sa kaligtasan. Pinananatili rin nito ang balintiyak na προσενεχθείς at ang sadyang maigsi ngunit masalimuot na χωρὶς ἁμαρτίας.'
  naturalness: Malinaw at marangal ang pangungusap sa makabagong Filipino. Gayunman, ang “na minsang inihandog” ay maaaring mangahulugang “noong minsan” sa halip na ang tiyak na “once” ng ἅπαξ. Ang “nang minsan” ay mas malinaw at likas sa kontekstong ito.
  terminology: Ang “Mesiyas,” “inihandog,” “pasanin ang mga kasalanan,” at “kaligtasan” ay angkop at pare-pareho ang rehistro. Ang “hiwalay sa kasalanan” ay nananatiling malapit sa Griyego; ang talababa ay maingat na nagbibigay ng kontekstuwal na pagbasa nang hindi ipinapasok sa pangunahing teksto.
  issues:
