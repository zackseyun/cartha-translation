source:
  edition: SBLGNT
  text: Ἀνάγκη οὖν τὰ μὲν ὑποδείγματα τῶν ἐν τοῖς οὐρανοῖς τούτοις καθαρίζεσθαι, αὐτὰ δὲ τὰ ἐπουράνια κρείττοσι θυσίαις παρὰ ταύτας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/023.yaml
  text: Therefore it was necessary for the copies of the things in the heavens to be cleansed with these[c][b][a], but the heavenly things themselves with better sacrifices than these.
translation:
  language: tl
  text: Kaya kinailangang dalisayin[b] sa pamamagitan ng mga ito ang mga kopya[a] ng mga bagay na nasa kalangitan, ngunit ang mismong mga bagay sa langit ay dalisayin sa pamamagitan ng mga hain[c] na higit na mabubuti kaysa sa mga ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga huwaran” o “mga paglalarawan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “linisin.” Ang pandiwa ay ginagamit dito sa diwa ng ritwal na paglilinis o pagdadalisay.
    reason: lexical_alternative
  - marker: c
    text: Maramihan ang “mga hain” sa Griyego, bagaman nakasentro ang konteksto ng Hebreo sa minsanan at ganap na paghahandog ng Mesiyas.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνάγκη οὖν
  choice: Kaya kinailangan
  rationale: Ipinahahayag ng οὖν ang kongklusyon mula sa naunang paliwanag, at ang impersonal na Ἀνάγκη ay likas na isinaling “kinailangan” ayon sa nagdaang konteksto.
- source_word: ὑποδείγματα
  choice: mga kopya
  rationale: Malinaw nitong ipinakikita na ang mga bagay na panlupa ay mga katumbas na representasyon ng mga bagay na nasa kalangitan, habang nananatiling bukas ang mga alternatibong “huwaran” at “larawan.”
- source_word: τῶν ἐν τοῖς οὐρανοῖς
  choice: ng mga bagay na nasa kalangitan
  rationale: Pinananatili nito ang lokatibong diwa ng parirala at hindi ito agad ipinapantay sa kasunod na pang-uring ἐπουράνια.
- source_word: καθαρίζεσθαι
  choice: dalisayin
  rationale: Ang “dalisayin” ay angkop sa ritwal na paglilinis sa konteksto ng paghahandog at higit na marangal kaysa sa karaniwang “linisin.”
- source_word: αὐτὰ δὲ τὰ ἐπουράνια
  choice: ngunit ang mismong mga bagay sa langit
  rationale: Ang “mismong” ay nagpapanatili sa diin ng αὐτά, at ang “mga bagay sa langit” ay hindi nagdaragdag ng interpretibong salitang gaya ng “mga realidad.”
- source_word: κρείττοσι θυσίαις
  choice: sa pamamagitan ng mga hain na higit na mabuti
  rationale: Ang “hain” ay natural na salitang pangsakripisyo, at pinananatili ang anyong maramihan ng θυσίαις at ang mahalagang paghahambing na κρείττοσι.
- source_word: παρὰ ταύτας
  choice: kaysa sa mga ito
  rationale: Sa kasamang paghahambing, ipinahahayag ng παρά ang “kaysa,” at ang demonstratibo ay tumutukoy sa naunang mga panlinis na handog.
theological_decisions:
- issue: Ang pagtukoy sa “mga bagay sa langit” at ang pagdadalisay sa mga ito
  choice: Panatilihin ang pahayag na ang mismong mga bagay sa langit ay dinadalisay sa pamamagitan ng higit na mabubuting hain.
  alternative: Tukuyin ang mga ito bilang santuwaryo sa langit, mga taong kabilang sa langit, o gumamit ng paraprasang umiiwas sa ideya ng pagdadalisay sa langit.
  rationale: Tahasang pinagtatapat ng Griyego ang mga panlupang kopya at ang mismong mga bagay sa langit, at ginagamit nito ang wikang ritwal ng pagdadalisay para sa dalawa. Hindi nilulutas ng salin ang likas na tensiyong teolohikal.
- issue: Maramihang “mga hain” kaugnay ng minsanang paghahandog ng Mesiyas
  choice: Panatilihin ang maramihang “mga hain.”
  alternative: Gawing isahan na “hain” upang iayon sa minsanang paghahandog ni Cristo na binibigyang-diin sa ibang bahagi ng Hebreo.
  rationale: Maramihan ang θυσίαις sa tekstong Griyego. Ang pagpapanatili nito ay umiiwas sa pagpapantay ng anyo ng talata sa teolohiyang ipinahayag sa ibang mga talata.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “dalisayin” at “mga hain” upang mapanatili ang ritwal na himig nang hindi nagiging lipas o teknikal. Pinanatili ang bahagyang elipsis sa ikalawang sugnay, gaya ng Griyego, ngunit malinaw pa rin ang ugnayan nito sa pandiwang “dalisayin.”
