id: HEB.9.4
reference: Hebrews 9:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: χρυσοῦν ἔχουσα θυμιατήριον καὶ τὴν κιβωτὸν τῆς διαθήκης περικεκαλυμμένην πάντοθεν χρυσίῳ, ἐν ᾗ στάμνος χρυσῆ ἔχουσα τὸ μάννα καὶ ἡ ῥάβδος Ἀαρὼν ἡ βλαστήσασα καὶ αἱ πλάκες τῆς διαθήκης,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/004.yaml
  text: having the golden censer[a], and the ark of the covenant covered on all sides with gold, in which were a golden jar holding the manna, Aaron’s staff that budded, and the tablets of the covenant,
translation:
  language: tl
  text: na may gintong insensaryo[a] at ang kaban ng tipan na nababalutan ng ginto sa lahat ng panig. Sa loob ng kaban ay naroon ang gintong sisidlan na may manna, ang tungkod ni Aaron na umusbong, at ang mga tapyas ng tipan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “gintong altar ng insenso.” Ang salitang Griyego na θυμιατήριον ay maaaring tumukoy sa insensaryo o sa altar ng insenso, at pinagtatalunan ang kahulugan nito rito.
    reason: alternative_reading
lexical_decisions:
- source_word: χρυσοῦν ἔχουσα θυμιατήριον
  choice: na kinaroroonan ng gintong altar ng insenso[a]
  rationale: Ipinagpapatuloy ng pariralang ito ang paglalarawan sa naunang talata. Maaaring tumukoy ang θυμιατήριον sa altar o sa insensaryo; pinili sa pangunahing teksto ang altar ng insenso bilang likas na katawagan sa konteksto ng santuwaryo, habang inilalahad sa talababa ang tunay na alternatibo.
- source_word: τὴν κιβωτὸν τῆς διαθήκης
  choice: ang kaban ng tipan
  rationale: Ang “kaban ng tipan” ang malinaw, kinikilala, at tumpak na katawagan sa sagradong kaban; pinananatili rin nito ang kahulugan ng διαθήκη bilang tipan.
- source_word: περικεκαλυμμένην πάντοθεν χρυσίῳ
  choice: na nababalutan ng ginto sa lahat ng panig
  rationale: Inihahayag nito ang ganap na pagkakabalot sa buong paligid na binibigyang-diin ng πάντοθεν, sa natural na modernong Tagalog.
- source_word: ἐν ᾗ
  choice: Sa loob ng kaban ay naroon
  rationale: Malinaw na itinuturo ng pambabaeng panghalip na ᾗ ang kaban. Inulit ang “kaban” sa Tagalog upang maiwasan ang malabong tinutukoy ng “nito,” nang hindi binabago ang ugnayang gramatikal.
- source_word: στάμνος χρυσῆ ἔχουσα τὸ μάννα
  choice: ang gintong sisidlan na may manna
  rationale: Ang “sisidlan” ay madaling maunawaang salin ng στάμνος at hindi nagpapalagay ng mas tiyak na anyo kaysa sa sinasabi ng Griyego. Natural na isinasalin ng “na may” ang ἔχουσα.
- source_word: ἡ ῥάβδος Ἀαρὼν ἡ βλαστήσασα
  choice: ang tungkod ni Aaron na umusbong
  rationale: Ang “tungkod” ay karaniwang modernong salin ng ῥάβδος, at ang “umusbong” ay tumpak na naghahayag ng βλαστήσασα nang hindi nagdaragdag ng detalyeng wala sa parirala.
- source_word: αἱ πλάκες τῆς διαθήκης
  choice: ang mga tapyas ng tipan
  rationale: Pinananatili ng “mga tapyas” ang kahulugan ng πλάκες at hindi idinaragdag ang “bato,” na bagaman kilala sa mas malawak na salaysay ay hindi tahasang narito.
theological_decisions:
- issue: Kahulugan ng θυμιατήριον sa paglalarawan ng santuwaryo
  choice: altar ng insenso
  alternative: insensaryo; sisidlang pansunog ng insenso
  rationale: May tunay at matagal nang leksikal at interpretatibong pagtatalo dahil maaaring tumukoy ang salita sa altar ng insenso o sa kagamitang pinagsusunugan ng insenso. Ginamit sa pangunahing teksto ang “altar ng insenso” bilang malamang na tinutukoy sa paglalarawan ng mga kagamitan ng tabernakulo, ngunit hindi ikinubli ang alternatibong “insensaryo.”
- issue: Lokasyon ng mga bagay na kasunod ng ἐν ᾗ
  choice: Sa loob ng kaban ay naroon
  alternative: na kasama nito o kaugnay nito
  rationale: Ang pinakapayak na gramatikal na pagbasa sa ἐν ᾗ ay “sa loob nito,” na ang tinutukoy ay ang kaban. Pinanatili ang tahasang pahayag ng teksto sa halip na baguhin ito upang iayon sa ibang paglalarawan ng kasaysayan ng tabernakulo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang mga kinikilalang terminong biblikal na “kaban ng tipan,” “manna,” at “tungkod ni Aaron.” Hinati sa dalawang pangungusap ang mahabang sugnay para sa linaw, ngunit pinanatili ng panimulang “na kinaroroonan” ang kaugnayan nito sa naunang talata.
