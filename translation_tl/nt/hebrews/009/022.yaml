id: HEB.9.22
reference: Hebrews 9:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ σχεδὸν ἐν αἵματι πάντα καθαρίζεται κατὰ τὸν νόμον, καὶ χωρὶς αἱματεκχυσίας οὐ γίνεται ἄφεσις.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/022.yaml
  text: And according to the law[a], almost everything is cleansed with blood, and without the shedding of blood there is no forgiveness.
translation:
  language: tl
  text: At ayon sa Kautusan, halos lahat ng bagay ay nililinis sa pamamagitan ng dugo, at kung walang pagbubuhos ng dugo, walang kapatawaran.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “paglaya” o “pagpapalaya.” Maaaring tumukoy ang salitang Griyego sa pagpapalaya o pagpapatawad; dito, tumutukoy ito sa kapatawaran ng mga kasalanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: σχεδόν
  choice: halos
  rationale: 'Pinananatili nito ang mahalagang paglilimita ng pahayag: hindi sinasabing lubos na lahat ng paglilinis sa ilalim ng Kautusan ay may dugo.'
- source_word: ἐν αἵματι
  choice: sa pamamagitan ng dugo
  rationale: Ginagamit ang ἐν sa diwang instrumental; malinaw nitong ipinapakita na dugo ang rituwal na paraang ginagamit sa paglilinis.
- source_word: πάντα
  choice: lahat ng bagay
  rationale: Ang walang-kasariang maramihan ay malawak ang saklaw at tumutukoy sa mga bagay o usaping rituwal na tinatalakay; nililimitahan ito ng “halos.”
- source_word: καθαρίζεται
  choice: ay nililinis
  rationale: Pinananatili ng anyong balintiyak at pangkasalukuyan ang diwa ng karaniwang isinasagawang rituwal na paglilinis ayon sa Kautusan.
- source_word: κατὰ τὸν νόμον
  choice: ayon sa Kautusan
  rationale: Ipinahahayag ng κατά ang pagsunod sa pamantayan ng Kautusang Mosaiko. Ang malaking titik ay tumutukoy rito bilang kinikilalang Kautusan sa konteksto.
- source_word: χωρὶς
  choice: kung walang
  rationale: Natural sa Filipino ang kondisyunal na pormang ito sa kasabihang pahayag, at tumpak nitong naihahatid ang kawalan o pagiging hiwalay sa isang bagay.
- source_word: αἱματεκχυσίας
  choice: pagbubuhos ng dugo
  rationale: Tuwirang inilalarawan nito ang pagbuhos o pagdanak ng dugo at pinananatili ang kontekstong paghahandog nang hindi nililimitahan sa karahasan lamang.
- source_word: οὐ γίνεται
  choice: walang
  rationale: Kapag kasama ng abstraktong pangngalang ἄφεσις, ipinahahayag nito na hindi nagaganap o umiiral ang kapatawaran; “walang” ang pinakanatural na katumbas sa Filipino.
- source_word: ἄφεσις
  choice: kapatawaran
  rationale: Sa konteksto ng kasalanan at paghahandog, malinaw na tumutukoy ito sa pagpapatawad, samantalang pinananatili sa talababa ang mas malawak na leksikal na diwa ng paglaya o pagpapalaya.
theological_decisions:
- issue: Ang kahulugan ng ἄφεσις sa konteksto ng paghahandog
  choice: kapatawaran
  alternative: paglaya o pagpapalaya
  rationale: Ang argumento ng Hebreo ay tungkol sa pagharap sa kasalanan sa pamamagitan ng dugong inihandog, kaya “kapatawaran” ang pinakamalinaw na pangunahing salin. Gayunman, hindi itinatago ang mas malawak na diwa ng salitang Griyego na pagkalag o paglaya.
- issue: Saklaw ng paglilinis sa ilalim ng Kautusan
  choice: halos lahat ng bagay
  alternative: lahat ng bagay
  rationale: Mahalagang panatilihin ang σχεδόν upang hindi gawing lubos ang pahayag ng may-akda o burahin ang mga pagbubukod sa mga rituwal ng paglilinis.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Kautusan” para sa Kautusang Mosaiko, “pagbubuhos ng dugo” upang mapanatili ang wikang panghandog, at “kapatawaran” bilang madaling maunawaang salitang teolohikal.
