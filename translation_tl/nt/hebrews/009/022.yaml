  source_fidelity: Tumpak na naihahatid ng salin ang saklaw na nililimitahan ng σχεδόν (“halos”), ang rituwal na instrumentong ἐν αἵματι (“sa pamamagitan ng dugo”), ang pamantayan ng κατὰ τὸν νόμον (“ayon sa Kautusan”), at ang pangwakas na pahayag tungkol sa αἱματεκχυσία at ἄφεσις. Hindi nito ginagawang ganap ang sinasabi ng Griyego.
