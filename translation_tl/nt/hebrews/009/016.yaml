  yaml_path: translation/nt/hebrews/009/016.yaml
  text: For where there is a covenant[a], it is necessary for the death of the one who made it to be brought forward.
translation:
  language: tl
  text: Sapagkat kung saan may tipan[a], kailangang maiharap ang kamatayan ng gumawa nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “Sapagkat kung may habilin, kailangang patunayang namatay ang gumawa nito.” Ang salitang Griyego na diathēkē ay maaaring mangahulugang “tipan” o “habilin/testamento,” at marami ang umuunawa sa mga talata 16–17 sa legal na diwa.
    reason: alternative_reading
lexical_decisions:
- source_word: διαθήκη
  choice: tipan
  rationale: Ang “tipan” ang pangunahing kahulugan na pinakaangkop sa mas malawak na pangangatuwiran ng Hebreo 8–10. Gayunman, maaari rin itong mangahulugang “habilin/testamento,” kaya inilagay ang legal na pagbasa sa talababa.
- source_word: θάνατον
  choice: kamatayan
  rationale: Tuwirang katumbas na tumutukoy rito sa aktuwal na kamatayan.
- source_word: ἀνάγκη
  choice: kailangang
  rationale: Natural at malinaw na pagpapahayag sa Tagalog ng diwang kinakailangan.
- source_word: φέρεσθαι
  choice: iharap
  rationale: Pinananatili nito ang diwa ng pasibong infinitibo na “dalhin/iharap,” lalo na bilang bagay na inihaharap o ipinakikitang umiiral, nang hindi tahasang dinaragdagan ang Griyego ng ideyang “patunayan.”
- source_word: τοῦ διαθεμένου
  choice: ng gumawa nito
  rationale: Natural na tumutukoy sa taong gumawa o nagtakda ng tipan, habang iniiwasang ipilit sa pangunahing teksto ang mas makitid na legal na katawagang “testador.”
- source_word: ὅπου γὰρ
  choice: Sapagkat kung saan
  rationale: Pinananatili ang paliwanag na puwersa ng γάρ at ang lokatibong ugnayan ng ὅπου.
theological_decisions:
- issue: Kung ang διαθήκη ay isasaling “tipan” o “habilin/testamento”
  choice: “tipan” sa pangunahing teksto, na may alternatibong legal na pagbasa sa talababa
  alternative: “habilin” o “testamento”
  rationale: Nakasentro sa tipan ang mas malawak na konteksto ng Hebreo 8–10, ngunit maaaring legal na kahulugan ang gumana sa talata 16–17. Pinananatili ng talababa ang tunay na kalabuan at tensiyon ng teksto.
- issue: Kung ang φέρεσθαι ay nangangahulugang iharap o patunayang naganap
  choice: “iharap”
  alternative: “mapatunayan” o “maitatag”
  rationale: Mas malapit ang “iharap” sa pangunahing diwa ng φέρω na “dalhin/iharap” at hindi nito nilulutas nang labis ang posibleng legal o ritwal na gamit.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “tipan” bilang karaniwang biblikal na salita; ang “habilin/testamento” ay inilaan sa talababa upang mapanatili ang kalabuan ng orihinal.
