base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/017.yaml
  text: For a covenant is valid over dead ones[b][a], since it is never in force while the one who made it is living.
translation:
  language: tl
  text: Sapagkat ang tipan[a] ay may bisa kapag may namatay[b], yamang hindi ito kailanman nagkakabisa habang nabubuhay ang gumawa nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sapagkat ang habilin ay nagkakabisa lamang pagkatapos ng kamatayan, yamang hindi ito kailanman nagkakabisa habang nabubuhay ang gumawa nito.” Ang salitang Griyego ay maaaring mangahulugang “tipan” o “habilin/testamento.”
    reason: alternative_reading
  - marker: b
    text: Maikli at malabo ang pariralang Griyego na isinaling “kapag may namatay.” Maaari itong tumukoy sa isang namatay, gaya ng pagbasa tungkol sa isang habilin, o sa kamatayang sangkot sa pagpapatibay ng tipan.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαθήκη
  choice: tipan
  rationale: Nangingibabaw sa Hebreo 8–10 ang balangkas ng tipan, lalo na ang paghahambing sa una at bagong tipan at ang pagpapasinaya sa pamamagitan ng dugo. Gayunman, maaari rin itong mangahulugang habilin o testamento, kaya inilagay ang alternatibo sa talababa.
- source_word: ἐπὶ νεκροῖς
  choice: kapag may mga patay
  rationale: Pinananatili nito ang maikli at di-tiyak na pahayag ng Griyego nang hindi tahasang nagpapasya kung ang tinutukoy ay mga taong namatay o mga kamatayang kaugnay ng paghahandog sa pagpapatibay ng tipan.
- source_word: βεβαία
  choice: may bisa
  rationale: Ipinahihiwatig dito ang pagiging balido at umiiral na puwersa ng isang tipan o habilin, hindi lamang ang katiyakan nito.
- source_word: ἐπεὶ
  choice: yamang
  rationale: Natural na ipinakikilala nito ang dahilan o paliwanag ng naunang pahayag.
- source_word: μήποτε
  choice: hindi ... kailanman
  rationale: Sa kontekstong ito, ipinahahayag nito na hindi nagkakaroon ng bisa sa anumang panahon habang buhay pa ang gumawa.
- source_word: ἰσχύει
  choice: nagkakabisa
  rationale: Malinaw nitong ipinapahayag ang pagiging epektibo o umiiral sa legal o pangtipang diwa.
- source_word: ὅτε ζῇ
  choice: habang nabubuhay
  rationale: Pinananatili ang temporal na pagsalungat ng buhay at kamatayan sa likas na Tagalog.
- source_word: ὁ διαθέμενος
  choice: ang gumawa nito
  rationale: Hindi nito nililimitahan ang tinutukoy sa tagagawa ng tipan o sa gumawa ng habilin, kaya napapanatili ang leksikal na kalabuan.
theological_decisions:
- issue: Kung ang διαθήκη ay dapat unawain bilang “tipan” o “habilin/testamento.”
  choice: Ginamit ang “tipan” sa pangunahing teksto at pinanatili sa talababa ang pagbasa na “habilin.”
  alternative: Habilin o testamento.
  rationale: Ang mas malawak na konteksto ng Hebreo 8–10 ay nakasentro sa tipan at dugong naghahandog, ngunit ang pananalita sa 9:16–17 ay maaari ring basahin sa legal na diwa ng habilin. Hindi dapat alisin ng salin ang tunay na tensiyong ito.
- issue: Kung paano isasalin ang malabong pariralang ἐπὶ νεκροῖς.
  choice: “kapag may mga patay”
  alternative: “pagkatapos ng kamatayan,” “sa kaso ng mga taong namatay,” o “kapag may mga handog na pinatay.”
  rationale: Sadyang maikli at eliptikal ang Griyego. Hinahayaan ng piniling salin na manatiling posible ang pagbanggit sa namatay na gumawa ng habilin o sa kamatayang sangkot sa pagpapatibay ng tipan, nang hindi tahasang pinipili ang alinman.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ang “may bisa” at “nagkakabisa” ay karaniwang mga ekspresyong legal na malinaw sa ordinaryong mambabasa. Bahagyang di-pangkaraniwan ang “kapag may mga patay,” ngunit sinadya ito upang mapanatili ang tunay na kalabuan ng Griyego.
