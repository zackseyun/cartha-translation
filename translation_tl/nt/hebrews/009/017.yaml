  rationale: Pinalitan ang di-idiomatikong “kapag may mga patay” ng “kapag may namatay.” Mas natural ito sa modernong Filipino at mas malinaw na tumutukoy sa paglitaw ng kamatayan, nang hindi itinatakda kung ang namatay ay ang gumawa ng habilin o isang handog na kaugnay ng pagpapatibay ng tipan. Nilinaw rin ang alternatibong talababa sa “pagkatapos ng kamatayan.”
