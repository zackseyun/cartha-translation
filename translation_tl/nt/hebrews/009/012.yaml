  terminology: Ang “sarili niyang dugo,” “mga banal na dako,” at “walang-hanggang katubusan” ay wasto, pare-pareho, at hindi nagdaragdag ng interpretasyong sekta o doktrina. Ang talababa ay wastong naglilimita sa alternatibong “Kabanal-banalang Dako” bilang mas interpretibong salin.
