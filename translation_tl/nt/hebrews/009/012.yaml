  text: οὐδὲ δι’ αἵματος τράγων καὶ μόσχων διὰ δὲ τοῦ ἰδίου αἵματος, εἰσῆλθεν ἐφάπαξ εἰς τὰ ἅγια, αἰωνίαν λύτρωσιν εὑράμενος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/012.yaml
  text: and not through the blood of goats and calves[a], but through his own blood, he entered once for all into the holy places, having obtained eternal redemption.
translation:
  language: tl
  text: At hindi sa pamamagitan ng dugo ng mga kambing at mga guya, kundi sa pamamagitan ng sarili niyang dugo, pumasok siya minsan at magpakailanman sa mga banal na dako[a], na nakapagtamo ng walang-hanggang katubusan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa santuwaryo.” Sa Griyego, “sa mga banal na dako” ang nakasulat. Isinasalin ito ng ilan nang mas tiyak bilang “sa Kabanal-banalang Dako,” ngunit higit na mapagpaliwanag iyon kaysa sa hinihingi ng mismong pananalita.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲ
  choice: At hindi
  rationale: Ipinagpapatuloy nito ang kaisipan at paghahambing mula sa naunang talata, kaya pinanatili ang puwersang pang-ugnay.
- source_word: δι’ αἵματος τράγων καὶ μόσχων
  choice: sa pamamagitan ng dugo ng mga kambing at mga guya
  rationale: Ang διά na may genitive ay nagpapahayag ng paraan o kasangkapan; ang “sa pamamagitan ng” ay likas sa Filipino at pinananatili ang kaibhan sa kasunod na parirala.
- source_word: διὰ δὲ τοῦ ἰδίου αἵματος
  choice: kundi sa pamamagitan ng sarili niyang dugo
  rationale: Inulit ang katumbas ng διά at pinanatili ang diin ng ἰδίου sa dugong tunay na kanya.
- source_word: εἰσῆλθεν
  choice: pumasok siya
  rationale: Tuwirang inilalahad ng aorist indicative ang natapos na kilos ng pagpasok.
- source_word: ἐφάπαξ
  choice: minsan lamang
  rationale: Ipinahahayag nito ang isang tiyak at hindi na inuulit na kilos, nang hindi nagdaragdag ng paliwanag sa mismong teksto.
- source_word: εἰς τὰ ἅγια
  choice: sa mga banal na dako
  rationale: Pinananatili ang pangmaramihang anyo at kultikong diwa ng Griyego sa halip na tukuyin agad bilang “Kabanal-banalang Dako.”
- source_word: αἰωνίαν λύτρωσιν
  choice: walang-hanggang katubusan
  rationale: Likas at teolohikal na hindi labis na espesipikong katumbas ito ng katubusang may permanenteng bisa.
- source_word: εὑράμενος
  choice: na nakapagtamo
  rationale: Bagaman literal na “nakasumpong,” sa konteksto ay nangangahulugan itong nagtamo o nagkamit; pinananatili ng sugnay ang kaugnayan ng participle sa pangunahing kilos.
theological_decisions:
- issue: Ang puwersa ng pagpasok ni Cristo sa pamamagitan ng sarili niyang dugo
  choice: Isinalin bilang pagpasok “sa pamamagitan ng sarili niyang dugo,” bilang tuwirang kaibhan sa dugo ng mga hayop.
  alternative: Isiping literal niyang dinala o iniharap ang dugo sa isang makalawak na paraan, o isiping pumasok lamang siya pagkatapos maibuhos ang dugo.
  rationale: Ang magkaparehong διά na may genitive ay pare-parehong isinalin bilang paraan o kasangkapan. Pinananatili nito ang tipolohikal na paghahambing nang hindi nagpapasok ng detalyadong mekanismong hindi tahasang sinasabi ng Griyego.
- issue: Saklaw ng τὰ ἅγια
  choice: mga banal na dako
  alternative: santuwaryo; Kabanal-banalang Dako
  rationale: Pangmaramihan ang anyong Griyego at maaari itong maging katawagan sa santuwaryo, ngunit ang “Kabanal-banalang Dako” ay mas tiyak kaysa sa mismong pananalita ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sa pamamagitan ng” upang mapanatili ang magkatulad na estruktura ng dalawang pariralang may διά. Inilagay ang talababa pagkatapos ng “mga banal na dako,” na siyang pariralang nililinaw nito.
