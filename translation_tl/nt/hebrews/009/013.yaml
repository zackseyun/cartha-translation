base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/013.yaml
  text: For if the blood of goats and bulls[a], and the ashes of a heifer that sprinkle those who have been defiled, sanctify for the purification of the flesh[d][c][b],
translation:
  language: tl
  text: Sapagkat kung ang dugo ng mga kambing at mga toro, at ang abo ng isang dumalagang baka na ipinangwiwisik sa mga nadungisan[a], ay nagpapabanal para sa paglilinis ng laman[b][c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga naging marumi”; ritwal na karumihan ang tinutukoy ng Griyego.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, panlabas at pangkatawang paglilinis ayon sa mga ritwal ng lumang tipan.
    reason: cultural_note
  - marker: c
    text: Tumutukoy ito sa ritwal ng paglilinis gamit ang abo ng dumalagang baka sa Bilang 19.
    reason: cross_reference
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Sapagkat kung
  rationale: Pinananatili ang lohikal na ugnayan at kondisyonal na anyo ng pangungusap, na magpapatuloy sa talata 14.
- source_word: τὸ αἷμα τράγων καὶ ταύρων
  choice: ang dugo ng mga kambing at mga toro
  rationale: Tuwirang salin ng pananalitang pansakripisyo; hindi kailangang tahasang idagdag ang kasarian ng mga kambing.
- source_word: σποδὸς δαμάλεως
  choice: ang abo ng isang dumalagang baka
  rationale: Ang “dumalagang baka” ay likas at tumpak na katawagan sa batang babaeng baka at pinananatili ang pahiwatig sa ritwal ng Bilang 19.
- source_word: ῥαντίζουσα
  choice: na iwiwisik sa
  rationale: Bagaman aktibo ang anyong Griyego at gramatikal na kaugnay ng “abo,” mas natural sa Tagalog ang ritwal na ideyang ang abo o pinaghalong may abo ay iwiwisik sa mga tao; hindi nito inilalahad ang dumalagang baka bilang tagagawa ng pagwiwisik.
- source_word: τοὺς κεκοινωμένους
  choice: mga nadungisan
  rationale: Ipinahahayag ang kalagayang bunga ng ritwal na karumihan habang pinananatiling maikli ang pangunahing teksto; nililinaw sa talababa ang ritwal na diwa.
- source_word: ἁγιάζει
  choice: nagpapabanal
  rationale: Pinananatili ang kultiko at teolohikal na bigat ng pandiwa nang hindi ito ipinapakahulugang panloob na pagbabago ng pagkatao.
- source_word: πρὸς τὴν τῆς σαρκὸς καθαρότητα
  choice: tungo sa kalinisan ng laman
  rationale: Malapit sa anyo ng Griyego at pinananatili ang kaibahan sa paglilinis ng budhi sa talata 14; ang “laman” dito ay panlabas at pangkatawang saklaw.
theological_decisions:
- issue: Kahulugan ng “nagpapabanal” kaugnay ng mga ritwal ng lumang tipan
  choice: Ritwal o kultikong pagpapabanal
  alternative: Malawak na espirituwal o panloob na pagpapabanal
  rationale: Nililimitahan mismo ng pariralang “kalinisan ng laman” ang bisa sa panlabas na ritwal na kalagayan, na ihahambing sa paglilinis ng budhi sa talata 14.
- issue: Kahulugan ng σάρξ
  choice: “laman,” sa diwang panlabas o pangkatawang kalinisan
  alternative: Makasalanang likas
  rationale: Ang konteksto ay tungkol sa ritwal na paglilinis, hindi sa “laman” bilang makasalanang kalikasan.
- issue: Ugnayan ng ῥαντίζουσα sa σποδὸς δαμάλεως
  choice: Isinalin bilang abong “iwiwisik sa” mga nadungisan
  alternative: Abong “nagwiwisik” sa mga nadungisan
  rationale: Pinananatili ang ritwal na kilos at gramatikal na ugnayan, ngunit ginagawang likas sa Tagalog at iniiwasang magmukhang ang dumalagang baka ang gumagawa ng pagwiwisik.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang “nagpapabanal” at “laman” upang maingatan ang kultiko at teolohikal na paghahambing, habang ginawang natural ang parirala tungkol sa pagwiwisik. Ang kuwit sa hulihan ay sadyang nagpapakitang hindi pa tapos ang kondisyonal na pangungusap hanggang talata 14.
