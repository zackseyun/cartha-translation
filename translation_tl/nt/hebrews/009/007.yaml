base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/007.yaml
  text: But into the second room only the high priest enters once a year[a], and not without blood[b], which he offers for himself and for the people's sins committed in ignorance.
translation:
  language: tl
  text: Ngunit sa ikalawang silid[a] ay ang punong pari lamang ang pumapasok minsan sa isang taon, at hindi siya pumapasok nang walang dugo, na inihahandog niya para sa kanyang sarili at para sa mga kasalanan ng bayan na nagawa dahil sa kamangmangan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ikalawang tolda” o “ikalawang bahagi,” na tumutukoy sa panloob na bahagi ng tabernakulo.
    reason: lexical_alternative
  - marker: b
    text: O “mga kasalanan ng bayan na hindi sinasadya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς δὲ τὴν δευτέραν
  choice: Ngunit sa ikalawang silid
  rationale: Elliptical ang Griyego at tumutukoy sa ikalawang bahagi ng tabernakulo sa konteksto. Ang “silid” ay natural sa Tagalog at malinaw na ipinakikita ang pagkakaiba ng dalawang bahagi.
- source_word: ἅπαξ τοῦ ἐνιαυτοῦ
  choice: minsan sa isang taon
  rationale: Natural na katumbas sa modernong Tagalog na tumpak na naghahayag ng taunang dalas.
- source_word: μόνος ὁ ἀρχιερεύς
  choice: ang punong pari lamang
  rationale: Malinaw at natural nitong pinananatili ang eksklusibong diwa ng μόνος.
- source_word: οὐ χωρὶς αἵματος
  choice: at hindi nang walang dugo
  rationale: Pinananatili ang litotes at ang tahasang imaheng pansakripisyo ng “dugo,” sa halip na ipaliwanag ito bilang isang handog na dugo.
- source_word: ὃ προσφέρει
  choice: Inihahandog niya ito
  rationale: Ang “inihahandog” ay angkop sa pansakripisyong gamit ng προσφέρει. Ang “ito” ay tumutukoy sa dugo at iniiwasan ang alanganing mahabang pangungusap.
- source_word: ὑπὲρ ἑαυτοῦ
  choice: para sa kanyang sarili
  rationale: Natural na Tagalog para sa pansakripisyong diwa ng ὑπέρ nang hindi nagdaragdag ng paliwanag.
- source_word: τῶν τοῦ λαοῦ ἀγνοημάτων
  choice: mga kasalanang nagawa ng bayan dahil sa kamangmangan
  rationale: Pinananatili nito kapwa ang moral na bigat ng mga pagkakasala at ang katangiang nagawa ang mga iyon sa kawalan ng pagkaalam, nang hindi lubusang nilulutas ang saklaw ng ἀγνοήματα.
theological_decisions:
- issue: Kalikasan ng ἀγνοήματα sa kontekstong pansakripisyo
  choice: mga kasalanang nagawa ng bayan dahil sa kamangmangan
  alternative: mga kasalanang hindi sinasadya; mga pagkakasalang dulot ng kawalan ng kaalaman
  rationale: Ang salita ay tumutukoy sa mga pagkakasalang may kaugnayan sa kamangmangan o hindi pagkaalam, hindi lamang sa kakulangan ng impormasyon. Pinananatili ng salin ang moral at pansakripisyong tensiyon nang hindi nag-aangkat ng mas huling sistematikong pagkakategorya.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “punong pari,” “inihahandog,” at “bayan” bilang natural at pamilyar na bokabularyong biblikal. Hinati sa dalawang pangungusap para sa linaw habang pinananatili ang ugnayan ng panghalip sa dugo.
