  text: σκηνὴ γὰρ κατεσκευάσθη ἡ πρώτη ἐν ᾗ ἥ τε λυχνία καὶ ἡ τράπεζα καὶ ἡ πρόθεσις τῶν ἄρτων, ἥτις λέγεται Ἅγια·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/002.yaml
  text: For a first tabernacle was prepared[a], in which were the lampstand and the table and the bread of the Presence[b], which is called the Holy Place.
translation:
  language: tl
  text: Sapagkat inihanda ang unang silid ng tabernakulo. Naroon ang patungan ng mga ilawan, ang mesa, at ang pagkakalatag ng mga tinapay[a]. Ang silid na ito ay tinatawag na Banal na Lugar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga tinapay ng Presensya”; tradisyonal na tinatawag na “tinapay na handog.”
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “Mga Banal na Lugar”; dito ay tumutukoy sa unang silid ng tabernakulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκηνὴ … ἡ πρώτη
  choice: ang unang silid ng tabernakulo
  rationale: Bagaman literal na “ang unang tolda/tabernakulo,” ipinakikita ng konteksto na tinutukoy ang unang bahagi o silid ng santuwaryo. Pinananatili ng “tabernakulo” ang kaugnayan sa santuwaryo ni Moises, samantalang nililinaw ng “silid” ang pagkakaiba nito sa panloob na bahagi sa kasunod na talata.
- source_word: κατεσκευάσθη
  choice: inihanda
  rationale: Saklaw nito ang paghahanda at pag-aayos ng banal na espasyo at ng mga kagamitan nito, nang hindi nililimitahan ang diwa sa pagtatayo lamang.
- source_word: λυχνία
  choice: patungan ng ilawan
  rationale: Tumutukoy ito sa sagradong patungan ng mga ilawang de-langis, hindi sa kandila o sa isang ilawan lamang.
- source_word: τράπεζα
  choice: mesa
  rationale: Payak at likas na tawag sa sagradong mesa sa unang silid.
- source_word: ἡ πρόθεσις τῶν ἄρτων
  choice: ang pagkakalatag ng mga tinapay
  rationale: Malapit ito sa literal na diwa ng pagtatanghal o paglalatag ng mga tinapay at pinananatili ang anyong maramihan ng ἄρτων. Hindi nito agad ipinapalit ang isang tradisyonal ngunit mas interpretibong katawagan.
- source_word: Ἅγια
  choice: Banal na Lugar
  rationale: Bagaman maramihan ang anyong Griyego, ang konteksto ay tumutukoy sa unang silid ng tabernakulo, na ipinakikitang kaiba sa pinakaloob na silid sa susunod na talata.
theological_decisions:
- issue: Ang maramihang anyo ng Ἅγια at ang mga silid ng tabernakulo
  choice: Banal na Lugar
  alternative: mga Banal na Lugar; santuwaryo
  rationale: Nililinaw ng agarang konteksto na ang tinutukoy ay ang unang silid. Inilalagay sa talababa ang literal na maramihang anyo upang hindi maitago ang anyo at posibleng lawak ng salitang Griyego.
- issue: Pagpapakahulugan sa ἡ πρόθεσις τῶν ἄρτων
  choice: ang pagkakalatag ng mga tinapay
  alternative: mga tinapay na inilalagay sa harap ng Diyos; tinapay na handog
  rationale: Pinananatili ng pangunahing teksto ang diwa ng paglalatag o pagtatanghal sa halip na tahimik na lutasin ang parirala bilang isang tradisyonal na katawagan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tabernakulo” upang mapanatili ang ugnayang pangkasulatan sa santuwaryo ni Moises, ngunit idinagdag ang “silid” upang maging malinaw ang estruktura. Hinati sa maiikling pangungusap ang mahabang sugnay na Griyego para sa likas na pagbasa nang hindi binabago ang mga ugnayang semantiko.
