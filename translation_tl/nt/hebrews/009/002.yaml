  terminology: Ang “tabernakulo,” “Banal na Lugar,” at “pagkakalatag ng mga tinapay” ay angkop sa kontekstong pangkulto at hindi nagpapataw ng doktrinal na pagbasa. Pinananatili ng talababa b ang maramihang anyo ng Ἅγια nang hindi winawasak ang kontekstuwal na pagtukoy sa unang silid.
