- from: Ngunit dumating ang Mesiyas bilang Kataas-taasang Pari ng mabubuting bagay na dumating na[a], sa pamamagitan ng mas dakila at mas ganap na tabernakulo na hindi gawa ng mga kamay—samakatuwid, hindi bahagi ng nilikhang kaayusang ito—
  to: Ngunit dumating ang Mesiyas bilang Mataas na Saserdote ng mga mabubuting bagay na dumating na[a]; at sa pamamagitan ng mas dakila at mas ganap na tabernakulo na hindi gawa ng mga kamay—ibig sabihin, hindi kabilang sa nilikhang kaayusang ito—
