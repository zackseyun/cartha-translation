reference: Hebrews 9:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Χριστὸς δὲ παραγενόμενος ἀρχιερεὺς τῶν ⸀γενομένων ἀγαθῶν διὰ τῆς μείζονος καὶ τελειοτέρας σκηνῆς οὐ χειροποιήτου, τοῦτ’ ἔστιν οὐ ταύτης τῆς κτίσεως,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/011.yaml
  text: But the Messiah came as high priest of the good things that have come[a], through the greater and more perfect tabernacle not made by hands—that is[b], not of this creation—
translation:
  language: tl
  text: Ngunit dumating ang Mesiyas bilang Mataas na Saserdote ng mga mabubuting bagay na dumating na[a]; at sa pamamagitan ng mas dakila at mas ganap na tabernakulo na hindi gawa ng mga kamay—ibig sabihin, hindi kabilang sa nilikhang kaayusang ito—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa ilang manuskrito: “ng mga mabubuting bagay na darating.”'
    reason: textual_variant
lexical_decisions:
- source_word: Χριστὸς
  choice: ang Mesiyas
  rationale: Ginamit bilang titulo sa kontekstong ito; natural at malinaw sa modernong Filipino habang pinananatili ang mesiyanikong diwa.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig ang paghahambing at paglipat mula sa makalupang santuwaryo at paglilingkod na tinalakay bago nito.
- source_word: παραγενόμενος
  choice: dumating
  rationale: Tuwirang ipinapahayag ang pagdating at pagharap ng Mesiyas sa kaniyang tungkulin bilang Kataas-taasang Pari, nang hindi dinaragdagan ang kahulugan.
- source_word: ἀρχιερεὺς
  choice: Kataas-taasang Pari
  rationale: Karaniwang salin sa Filipino para sa natatanging tungkuling pansantuwaryo na tinutukoy sa Hebreo.
- source_word: τῶν γενομένων ἀγαθῶν
  choice: ng mabubuting bagay na dumating na
  rationale: Sinusunod ang γενομένων ng SBLGNT at pinananatili ang ideya ng mga pagpapalang sumapit na, sa halip na ang baryanteng μελλόντων.
- source_word: διὰ τῆς ... σκηνῆς
  choice: sa pamamagitan ng ... tabernakulo
  rationale: Pinananatili ang relasyong instrumental o spatial ng διά at ang ugnayan ng σκηνή sa tabernakulo ng Israel.
- source_word: μείζονος
  choice: mas dakila
  rationale: Ipinapahayag ang kahigitan sa uri, hindi lamang ang mas malaking sukat.
- source_word: τελειοτέρας
  choice: mas ganap
  rationale: Pinananatili ang temang ganap o lubos sa Hebreo nang maiwasan ang alanganing pariralang 'mas perpekto.'
- source_word: οὐ χειροποιήτου
  choice: hindi gawa ng mga kamay
  rationale: Pinananatili ang biblikal na idyoma at ang paghahambing sa mga santuwaryong gawa ng tao.
- source_word: τοῦτ’ ἔστιν
  choice: samakatuwid
  rationale: Natural na ipinapasok ang paglilinaw na kasunod, katumbas ng 'ibig sabihin' o 'iyon ay.'
- source_word: οὐ ταύτης τῆς κτίσεως
  choice: hindi bahagi ng nilikhang kaayusang ito
  rationale: Nililinaw na ang tabernakulo ay hindi nabibilang sa kasalukuyang nilikhang kaayusan, habang pinananatili ang saklaw ng κτίσις.
theological_decisions:
- issue: Tekstuwal at interpretatibong pagbasa ng τῶν γενομένων ἀγαθῶν
  choice: ng mabubuting bagay na dumating na
  alternative: ng mabubuting bagay na darating
  rationale: Sinusunod ng pangunahing teksto ang γενομένων sa SBLGNT. Inilalagay sa talababa ang kilalang baryanteng μελλόντων upang maging hayag ang makabuluhang pagkakaiba.
- issue: Sintaktikong kaugnayan ng διὰ τῆς ... σκηνῆς
  choice: Pinanatiling bukas ang parirala patungo sa pagpapatuloy sa talata 12
  alternative: Iugnay nang tahasan ang tabernakulo sa pagdating o pagpapakita ng Mesiyas
  rationale: Ang pangungusap sa Griyego ay nagpapatuloy sa εἰσῆλθεν ng talata 12. Ang pangwakas na gatlang ay nagpapanatili sa daloy at umiiwas na tuluyang lutasin ang sintaks sa loob lamang ng talata 11.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang 'tabernakulo' upang mapanatili ang tiyak na larawang pansantuwaryo sa Hebreo. Pinanatili ang pangwakas na gatlang sapagkat nagpapatuloy ang pangungusap sa talata 12.
