review_pass:
  verdict: revise
  source_fidelity: Sinusunod ng salin ang SBLGNT na γενομένων, “na dumating na,” at wastong inihaharap sa talababa ang alternatibong “na darating.” Gayunman, ang kasalukuyang pagkakabit ng “sa pamamagitan ng ... tabernakulo” sa “dumating” ay maaaring magpahiwatig na ang tabernakulo ang paraan ng pagdating ng Mesiyas. Sa Griyego, ang pariralang ito ay nananatiling nakabitin patungo sa pandiwang “pumasok” sa talata 12.
  naturalness: Marangal at malinaw sa pangkalahatan, ngunit mas natural at mas tapat sa nagpapatuloy na sintaks ang tuldok-kuwit at “at” bago ang nakabiting pariralang “sa pamamagitan.” Ang “ibig sabihin” ay mas tuwirang panandang pagpapaliwanag kaysa “samakatuwid,” na karaniwang naghuhudyat ng hinuha.
  terminology: Ang “Mesiyas,” “tabernakulo,” at “mas ganap” ay angkop. Pinalitan ang “Kataas-taasang Pari” ng mas karaniwan at tiyak na terminong “Mataas na Saserdote” para sa ἀρχιερεύς sa kontekstong pansantuwaryo ng Hebreo. Ang “hindi kabilang sa nilikhang kaayusang ito” ay natural na katumbas ng “not of this creation” nang hindi labis na pinaghihigpitan ang kahulugan.
  issues:
  - severity: medium
    issue: Ang “sa pamamagitan ng ... tabernakulo” ay tuwirang nakakabit sa “dumating.”
    rationale: Maaaring unawain ng mambabasa na dumating ang Mesiyas sa pamamagitan ng tabernakulo, samantalang ang pariralang διά ay sintaktikong nagpapatuloy sa εἰσῆλθεν (“pumasok”) sa 9:12.
  - severity: low
    issue: Ang “samakatuwid” ay mas inferensiyal kaysa eksplanatori.
    rationale: Ang τοῦτ’ ἔστιν ay nagpapakilala ng paglilinaw; mas tuwirang ipinahihiwatig ito ng “ibig sabihin.”},{
  - severity: low
    issue: Hindi pinakanatural sa modernong Filipino ang “Kataas-taasang Pari” para sa ἀρχιερεύς.
    rationale: Ang “Mataas na Saserdote” ay mas nakaugat sa rehistrong biblikal at mas malinaw na tumutukoy sa tungkuling pansantuwaryo, nang hindi lumilikha ng di-karaniwang antas ng superlatibo.
  revised_text: Ngunit dumating ang Mesiyas bilang Mataas na Saserdote ng mga mabubuting bagay na dumating na[a]; at sa pamamagitan ng mas dakila at mas ganap na tabernakulo na hindi gawa ng mga kamay—ibig sabihin, hindi kabilang sa nilikhang kaayusang ito—
  revised_footnotes:
