source:
  edition: SBLGNT
  text: πόσῳ μᾶλλον τὸ αἷμα τοῦ Χριστοῦ, ὃς διὰ πνεύματος αἰωνίου ἑαυτὸν προσήνεγκεν ἄμωμον τῷ θεῷ, καθαριεῖ τὴν συνείδησιν ⸀ἡμῶν ἀπὸ νεκρῶν ἔργων εἰς τὸ λατρεύειν θεῷ ζῶντι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/014.yaml
  text: how much more will the blood of Messiah—who through the eternal Spirit offered himself without blemish to God—cleanse our conscience from dead works to serve the living God[a].
translation:
  language: tl
  text: gaano pa kayang higit na lilinisin ng dugo ng Mesiyas—na sa pamamagitan ng walang hanggang Espiritu ay inihandog sa Diyos ang kanyang sarili na walang kapintasan—ang ating budhi mula sa mga patay na gawa, upang maglingkod sa Diyos na buhay?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “sa pamamagitan ng isang walang hanggang espiritu.” Mas pangkalahatan ang posibleng pagbasa sa pariralang Griyego, bagaman dito ay inuunawa itong tumutukoy sa banal na Espiritu.'
    reason: alternative_reading
lexical_decisions:
- source_word: πόσῳ μᾶλλον
  choice: gaano pa kayang higit
  rationale: Pinananatili ang retorikal na puwersa ng paghahambing na a fortiori mula sa naunang talata, sa natural na anyong Tagalog.
- source_word: τὸ αἷμα τοῦ Χριστοῦ
  choice: ang dugo ng Mesiyas
  rationale: Literal na pinananatili ang dugong may sakripisyal na kabuluhan; ang Χριστός ay ginawang “Mesiyas” bilang titulo ng Pinahiran.
- source_word: διὰ πνεύματος αἰωνίου
  choice: sa pamamagitan ng walang hanggang Espiritu
  rationale: Pinananatili ang instrumental na διά at ang malamang na pagtukoy sa banal na Espiritu, habang inilalahad sa talababa ang tunay na gramatikal na posibilidad ng mas pangkalahatang pagbasa.
- source_word: ἑαυτὸν προσήνεγκεν
  choice: inihandog ang kanyang sarili
  rationale: Ang “inihandog” ay angkop sa kontekstong pansakripisyo at pinananatili ang reflexive na diwa ng ἑαυτόν.
- source_word: ἄμωμον
  choice: nang walang kapintasan
  rationale: Nagpapahiwatig ng handog na walang depekto at karapat-dapat tanggapin, nang hindi nililimitahan ang salita sa moral na kawalang-sala lamang.
- source_word: καθαριεῖ
  choice: lilinisin
  rationale: Pinananatili ang hayag na panghinaharap na anyo at ang bokabularyo ng ritwal at panloob na paglilinis.
- source_word: τὴν συνείδησιν ἡμῶν
  choice: ang ating budhi
  rationale: Ang “budhi” ang natural at tiyak na modernong Tagalog para sa moral na panloob na kamalayan.
- source_word: ἀπὸ νεκρῶν ἔργων
  choice: mula sa mga patay na gawa
  rationale: Malapit sa Griyego at pinananatili ang siksik at bahagyang bukas na teolohikal na kahulugan sa halip na ipaliwanag bilang mga gawang humahantong sa kamatayan.
- source_word: εἰς τὸ λατρεύειν
  choice: upang maglingkod
  rationale: Malinaw na ipinapakita ang layunin at sapat ang lawak upang saklawin ang paglilingkod at pagsambang nakatuon sa Diyos.
- source_word: θεῷ ζῶντι
  choice: sa Diyos na buhay
  rationale: Natural na Tagalog na tiyak ang pagtukoy at pinananatili ang biblikal na bansag na “Diyos na buhay.”
theological_decisions:
- issue: Ang tinutukoy ng πνεύματος αἰωνίου
  choice: Ang banal na Espiritu, na isinaling “walang hanggang Espiritu”
  alternative: isang walang hanggang espiritu; ang sariling espiritu ni Mesiyas; o isang espirituwal at walang hanggang paraan ng paghahandog
  rationale: Malamang na personal na banal na Espiritu ang tinutukoy sa konteksto, ngunit walang artikulo ang parirala at tunay na posible ang mas pangkalahatang pagbasa; kaya hindi inalis ang tensiyon at inilagay ang alternatibo sa talababa.
- issue: Pagpapakahulugan sa Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Dito ay aktibo ang titular na diwa ng “Pinahiran,” kaya “Mesiyas” ang tuwirang pagpili nang hindi nagdaragdag ng denominasyonal na paliwanag.
- issue: Kahulugan ng νεκρῶν ἔργων
  choice: mga patay na gawa
  alternative: mga gawang humahantong sa kamatayan
  rationale: Hindi tiyak na nilulutas ng Griyego kung ang mga gawa ay walang-buhay, marungis, o nagbubunga ng kamatayan; pinananatili ng literal na parirala ang sadyang lawak nito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “budhi,” “inihandog,” at “walang kapintasan” upang mapanatili ang malinaw na sakripisyal at panloob na paglilinis na larawan. Ang em dash ay naghihiwalay sa paliwanag tungkol sa Mesiyas nang hindi sinisira ang pangunahing paghahambing.
