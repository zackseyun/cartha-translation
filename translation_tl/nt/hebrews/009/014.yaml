  source_fidelity: Tumpak na naipapahayag ng draft ang paghahambing na a fortiori, ang hinaharap na “lilinisin,” ang sakripisyal na “inihandog,” ang “budhi,” at ang layunin ng paglilingkod sa Diyos na buhay. Gayunman, mas malinaw na itali ang “nang walang kapintasan” sa Mesiyas mismo, gaya ng ginagawa ng Griyegong ἑαυτόν ... ἄμωμον, upang hindi ito mabasang pang-abay lamang ng paraan ng paghahandog.
  naturalness: Marangal at natural sa modernong Filipino Tagalog ang kabuuang daloy. Ang “gaano pa kayang higit” ay katanggap-tanggap; pinanatili ito. Inayos ang ayos ng mga parirala upang maging malinaw ang sakripisyal na paglalarawan nang hindi nagdadagdag ng kahulugan.
  terminology: Ang “Mesiyas,” “walang hanggang Espiritu,” “budhi,” “mga patay na gawa,” at “Diyos na buhay” ay angkop at pare-pareho sa pinagmulan at sa itinakdang terminolohiya. Nananatili ang talababa upang hindi isara ang pinagtatalunang pagtukoy ng πνεύματος αἰωνίου.
