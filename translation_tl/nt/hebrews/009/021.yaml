id: HEB.9.21
reference: Hebrews 9:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ τὴν σκηνὴν δὲ καὶ πάντα τὰ σκεύη τῆς λειτουργίας τῷ αἵματι ὁμοίως ἐράντισεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/021.yaml
  text: And likewise he sprinkled with the blood both the tabernacle and all the vessels of the ministry[a][b].
translation:
  language: tl
  text: Gayundin, winisikan niya ng dugo ang tabernakulo[a] at ang lahat ng kagamitan sa paglilingkod[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “tolda.” Ang salitang Griyego ay maaaring mangahulugang “tolda,” ngunit dito ay tumutukoy ito sa sagradong tabernakulo.
    reason: lexical_alternative
  - marker: b
    text: O, “lahat ng kasangkapan para sa paglilingkod.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σκηνή
  choice: tabernakulo
  rationale: Sa konteksto ng Hebreo 9, tumutukoy ito sa sagradong toldang santuwaryo ng tipan, hindi sa isang karaniwang tolda. Ang “tabernakulo” ay pamilyar na katawagang biblikal at pinananatili ang tiyak na kahulugan nito.
- source_word: σκεύη
  choice: kagamitan
  rationale: Tumutukoy ito sa mga bagay o kasangkapang ginagamit sa ritwal na paglilingkod. Ang “kagamitan” ay natural at sapat na malawak sa modernong Tagalog.
- source_word: λειτουργία
  choice: paglilingkod
  rationale: Tumutukoy dito sa sagradong paglilingkod ng mga pari. Ang “paglilingkod” ay malinaw at hindi nagdaragdag ng denominasyonal na terminolohiya.
- source_word: αἷμα
  choice: dugo
  rationale: Tuwirang tumutukoy sa dugong ginagamit sa ritwal ng paghahandog.
- source_word: ὁμοίως
  choice: gayundin
  rationale: Iniuugnay nito ang kilos sa naunang pagwiwisik na isinalaysay sa talata 19.
- source_word: ῥαντίζω
  choice: winisikan
  rationale: Karaniwan at malinaw na salitang Tagalog para sa ritwal na paglalapat ng dugo sa pamamagitan ng pagwiwisik.
- source_word: δὲ
  choice: hindi isinalin nang hiwalay
  rationale: Mahina lamang ang puwersang pang-ugnay nito rito at naipahahayag na ng “Gayundin” at ng natural na ayos ng pangungusap.
- source_word: πάντα τὰ σκεύη
  choice: ang lahat ng kagamitan
  rationale: Pinananatili nito ang saklaw ng πάντα at ipinakikitang kasama ang kabuuan ng kagamitang ginagamit sa paglilingkod.
theological_decisions:
- issue: Kaugnayan ng pahayag sa mga ritwal ni Moises sa Exodo
  choice: Isinalin bilang tuwirang buod ng pagwiwisik ni Moises sa tabernakulo at sa mga kagamitan nito, nang walang dagdag na paliwanag.
  alternative: Palawakin ang talata upang ipaliwanag o ipagkasundo ang mga detalye nito sa mga salaysay sa Exodo.
  rationale: Hindi ipinapaliwanag ng tekstong Griyego ang mga usaping intertekstuwal. Dapat panatilihin ng salin ang pahayag at anumang tensiyon nito nang hindi nagdaragdag ng interpretasyong wala sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang katawagang biblikal na “tabernakulo,” samantalang ginamit ang mas natural na “kagamitan sa paglilingkod” para sa mga bagay na ginagamit sa sagradong ritwal.
