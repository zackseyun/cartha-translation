  source_fidelity: Tumpak na naihahatid ng salin ang genitive absolute na “ipinahihiwatig ng Espiritu Santo,” ang perfect passive na “hindi pa naihahayag,” at ang pansamantalang sugnay na “habang nananatili pa ang unang tabernakulo.” Ang “daan patungo sa mga banal na dako” ay angkop na pagsasalin ng τὴν τῶν ἁγίων ὁδόν sa konteksto ng santuwaryo at pinananatili ang plural at ang hindi ganap na pagtitiyak ng Griyego.
