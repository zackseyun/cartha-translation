  text: τοῦτο δηλοῦντος τοῦ πνεύματος τοῦ ἁγίου, μήπω πεφανερῶσθαι τὴν τῶν ἁγίων ὁδὸν ἔτι τῆς πρώτης σκηνῆς ἐχούσης στάσιν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/008.yaml
  text: By this the Holy Spirit is indicating that the way into the holy places has not yet been revealed while the first tabernacle still has standing,
translation:
  language: tl
  text: Sa pamamagitan nito, ipinahihiwatig ng Espiritu Santo na hindi pa naihahayag ang daan patungo sa mga banal na dako[a] habang nananatili pa ang unang tabernakulo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang daan patungo sa santuwaryo.” Maaaring tumukoy ang Griyegong pananalita sa mga banal na dako sa pangkalahatan; inuunawa naman ito ng ilan bilang partikular na “ang daan patungo sa Kabanal-banalang Dako.”
    reason: alternative_reading
  - marker: b
    text: Maaari ring “habang nakatayo pa ang unang tabernakulo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δηλοῦντος
  choice: ipinahihiwatig
  rationale: Ipinapahayag ng kasalukuyang participle ang patuloy na pagpapakita o pagpapalinaw ng kahulugan. Likas sa modernong Tagalog ang “ipinahihiwatig” at hindi nito ginagawang higit na tahasan ang pahayag kaysa sa Griyego.
- source_word: πνεύματος τοῦ ἁγίου
  choice: Espiritu Santo
  rationale: Ito ang karaniwan, malinaw, at marangal na katawagan sa Tagalog para sa tinutukoy na banal na Espiritu.
- source_word: μήπω πεφανερῶσθαι
  choice: hindi pa naihahayag
  rationale: 'Pinananatili nito ang diwa ng perfect passive: ang daan ay hindi pa naipakikita o naibubunyag at nananatili sa gayong kalagayan.'
- source_word: τὴν τῶν ἁγίων ὁδὸν
  choice: ang daan patungo sa mga banal na dako
  rationale: Ipinakikita ng konteksto ng tabernakulo na ito ay daan ng pagpasok sa sagradong lugar. Pinananatili ng “mga banal na dako” ang plural at hindi nililimitahan agad ang tinutukoy sa Kabanal-banalang Dako lamang.
- source_word: πρώτης σκηνῆς
  choice: unang tabernakulo
  rationale: Ang “tabernakulo” ay angkop sa kontekstong pangsamba at pinananatili ng “unang” ang pagkakaiba ng unang bahagi o toldang binanggit sa malapit na konteksto.
- source_word: ἐχούσης στάσιν
  choice: nananatili
  rationale: Inihahatid nito ang ideya ng patuloy na pag-iral, katayuan, o bisa nang hindi ipinipilit na pisikal na pagkakatayo lamang ang ibig sabihin.
- source_word: ἔτι
  choice: pa
  rationale: Natural na ipinahahayag ng “pa” ang nagpapatuloy na kalagayan o tagal.
theological_decisions:
- issue: Tinutukoy ng τῶν ἁγίων
  choice: pagpasok sa mga banal na dako o santuwaryo
  alternative: daan ng mga banal na tao
  rationale: Ang agarang konteksto ay tungkol sa ayos ng tabernakulo at sa limitadong pagpasok ng mga pari, kaya espasyal at pangsamba ang parirala, hindi tumutukoy sa mga banal na tao.
- issue: Saklaw ng banal na dakong tinutukoy
  choice: mga banal na dako sa pangkalahatan
  alternative: ang Kabanal-banalang Dako lamang
  rationale: Maaaring lalo nang tumukoy ang konteksto sa panloob na santuwaryo, ngunit plural at mas malawak ang Griyegong τῶν ἁγίων. Pinananatili sa pangunahing teksto ang tunay na lawak at ambiguwidad nito.
- issue: Kahulugan ng patuloy na pananatili ng unang tabernakulo
  choice: nananatili pa
  alternative: nakatayo pa
  rationale: Maaaring tumukoy ang pahayag kapuwa sa patuloy na pag-iral at sa nananatiling katayuan o bisa ng unang kaayusan. Hindi nililimitahan ng pangunahing salin ang kahulugan sa pisikal na pagkakatayo lamang.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “tabernakulo” upang panatilihin ang kontekstong pangsamba, at iniwasan ang masyadong teknikal o makalumang ayos ng pangungusap.
