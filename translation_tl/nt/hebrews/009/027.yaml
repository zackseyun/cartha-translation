  yaml_path: translation/nt/hebrews/009/027.yaml
  text: And just as it is appointed for men to die once[a], and after this, judgment,
translation:
  language: tl
  text: At kung paanong itinakda para sa mga tao na minsan lamang mamatay, at pagkatapos nito ay ang paghatol,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθ’ ὅσον
  choice: kung paanong
  rationale: Ipinakikilala ng parirala ang paghahambing na magpapatuloy sa kasunod na talata; natural sa Tagalog ang “kung paanong” para sa ganitong kayarian.
- source_word: ἀπόκειται
  choice: itinakda
  rationale: Sa kayariang may datibo at pawatas, tumutukoy ito sa isang nakalaan o tiyak na kalagayan. Ang “itinakda” ay malinaw at likas sa makabagong Tagalog.
- source_word: τοῖς ἀνθρώποις
  choice: sa mga tao
  rationale: Ang ἄνθρωποι ay tumutukoy sa sangkatauhan sa pangkalahatan. Ang “mga tao” ay eksakto, likas, at hindi limitado sa kalalakihan.
- source_word: ἅπαξ
  choice: nang minsan
  rationale: Ipinahahayag nito ang iisang pagkakataon ng pagkamatay, nang hindi dinaragdagan ng diwang “minsan at magpakailanman.”
- source_word: ἀποθανεῖν
  choice: ang mamatay
  rationale: Payak at tuwirang katumbas ng pawatas; ang panandang “ang” ay bumubuo ng likas na pariralang Tagalog kasunod ng “itinakda sa mga tao.”
- source_word: μετὰ δὲ τοῦτο
  choice: at pagkatapos nito
  rationale: Pinananatili nito ang pagkakasunod ng kamatayan at ng kasunod na paghatol, habang natural na isinasalin ang δέ bilang “at.”
- source_word: κρίσις
  choice: ang paghatol
  rationale: Tumutukoy ito sa hudisyal na paghatol nang hindi pa tinutukoy ang kahihinatnan. Hindi ito pinaliit tungo sa “kaparusahan” o pinalawak tungo sa isang detalyadong eskatolohikal na sistema.
theological_decisions:
- issue: Pangkalahatang saklaw ng τοῖς ἀνθρώποις
  choice: Isinalin bilang “sa mga tao,” na tumutukoy sa sangkatauhan sa pangkalahatan.
  alternative: “sa sangkatauhan” o “sa mga taong nilalang”
  rationale: Bagaman gramatikal na panlalaking maramihan ang Griyego, pangkalahatan ang gamit nito. Likas at ganap na inklusibo sa Tagalog ang “mga tao,” kaya hindi kailangan ng talababa.
- issue: Saklaw ng κρίσις pagkamatay
  choice: Pinanatili bilang “paghatol.”
  alternative: “kaparusahan” o “huling paghuhukom”
  rationale: Ipinahahayag ng talata ang paghatol pagkatapos ng kamatayan ngunit hindi nito sa sarili lamang tinutukoy ang resulta o lahat ng detalye nito. Pinananatili ng “paghatol” ang lawak at teolohikal na tensiyon ng salita.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang pangungusap na bukas sa kasunod na talata sa pamamagitan ng pangwakas na kuwit, gaya ng sintaks ng Griyego. Walang talababa sapagkat malinaw nang pangkalahatan at inklusibo ang “mga tao” sa Tagalog.
