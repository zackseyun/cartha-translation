    issue: Malabo ang “nang minsan” bilang salin ng ἅπαξ.
    rationale: Sa modernong Filipino, maaari itong marinig bilang “paminsan-minsan” o “sa isang pagkakataon,” samantalang ipinahihiwatig ng ἅπαξ ang iisang pagpanaw. Nililinaw ito ng “minsan lamang” nang walang dagdag na teolohikal na kahulugan.
  - severity: low
    issue: Medyo di-likas ang “itinakda sa mga tao ang mamatay.”
    rationale: Mas karaniwang kayarian sa Filipino ang “itinakda para sa mga tao na … mamatay,” habang pinananatili ang diwa ng isang nakatalagang kalagayan.
