  source_fidelity: Tumpak ang paghahambing na ipinakikilala ng “At kung paanong,” ang pangkalahatang “mga tao,” at ang hindi-pinalawak na “paghatol.” Gayunman, ang “nang minsan” ay karaniwang maaaring mangahulugang “paminsan-minsan” o “noong isang pagkakataon” sa modernong Filipino at hindi sapat na malinaw na isahan lamang ang kamatayan, gaya ng ἅπαξ.
  naturalness: Ang “itinakda sa mga tao ang mamatay” ay nauunawaan ngunit mas likas ang “itinakda para sa mga tao na … mamatay.” Ang “minsan lamang” ay malinaw, moderno, at angkop sa saklaw ng Griyego.
  terminology: Ang “mga tao” ay wastong pangkalahatan para sa τοῖς ἀνθρώποις at hindi nangangailangan ng talababa. Ang “paghatol” ay angkop para sa κρίσις dahil hindi nito ipinipilit ang hatol na parusa o ang isang tiyak na sistemang eskatolohikal.
  issues:
