source:
  edition: SBLGNT
  text: λαληθείσης γὰρ πάσης ἐντολῆς κατὰ ⸀τὸν νόμον ὑπὸ Μωϋσέως παντὶ τῷ λαῷ, λαβὼν τὸ αἷμα τῶν ⸀μόσχων μετὰ ὕδατος καὶ ἐρίου κοκκίνου καὶ ὑσσώπου αὐτό τε τὸ βιβλίον καὶ πάντα τὸν λαὸν ἐράντισεν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/019.yaml
  text: For when every commandment according to the law had been spoken by Moses to all the people[a], he took the blood of the calves with water and scarlet wool and hyssop, and sprinkled both the scroll itself and all the people,
translation:
  language: tl
  text: Sapagkat nang maipahayag na ni Moises sa buong bayan ang bawat utos ayon sa Kautusan, kinuha niya ang dugo ng mga guya[a], kasama ang tubig, lana na matingkad na pula, at isopo, at winisikan niya kapuwa ang balumbon mismo at ang buong bayan,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga batang toro.” Ang salitang Griyego ay maaaring tumukoy sa mga guya o mga batang toro sa konteksto ng paghahandog.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαληθείσης γὰρ πάσης ἐντολῆς
  choice: Sapagkat matapos ... sabihin ... ang bawat utos
  rationale: Ginawang sugnay na panahunan ang genitive absolute upang maging natural sa Tagalog, habang pinananatili ng “bawat utos” ang distributibong puwersa ng πάσης.
- source_word: κατὰ τὸν νόμον
  choice: ayon sa Kautusan
  rationale: Tuwirang ipinapahayag ang pag-ayon o pagkakaayon na ipinahihiwatig ng κατά; ginamit ang malaking titik sa “Kautusan” dahil tumutukoy ito sa kinikilalang Kautusan sa konteksto.
- source_word: ὑπὸ Μωϋσέως παντὶ τῷ λαῷ
  choice: ni Moises sa buong bayan
  rationale: Malinaw na ipinakikita ng “ni Moises” ang tagaganap at ng “buong bayan” ang kabuuan ng mga nakikinig.
- source_word: λαβὼν
  choice: kinuha niya
  rationale: Isinalin ang aorist participle bilang pandiwang may tahasang panghalip upang maging malinaw at natural ang sunod-sunod na kilos sa Tagalog.
- source_word: τὸ αἷμα τῶν μόσχων
  choice: ang dugo ng mga guya[a]
  rationale: Ang “mga guya” ay tuwirang katumbas na hindi nagpapasiya nang higit sa saklaw ng μόσχων; inilagay sa talababa ang posibleng “mga batang toro.”
- source_word: μετὰ ὕδατος καὶ ἐρίου κοκκίνου καὶ ὑσσώπου
  choice: kasama ang tubig, lanang matingkad na pula, at isopo
  rationale: Pinananatili ang lahat ng sangkap ng ritwal. Ang “lanang matingkad na pula” ay natural at malinaw na salin ng ἐρίου κοκκίνου nang hindi umaasa sa di-karaniwang hiram na terminong pangkulay.
- source_word: αὐτό τε τὸ βιβλίον καὶ πάντα τὸν λαὸν
  choice: kapuwa ang balumbon mismo at ang buong bayan
  rationale: Ang “kapuwa ... at ...” ay nagpapanatili sa koordinasyong τε ... καί, ang “mismo” sa diin ng αὐτό, at ang “balumbon” sa sinaunang anyo ng nakasulat na dokumento.
- source_word: ἐράντισεν
  choice: winisikan niya
  rationale: Karaniwan at madaling maunawaang pandiwa ito para sa ritwal na pagwiwisik, nang hindi gumagamit ng teknikal o makalumang salita.
theological_decisions:
- issue: Ugnayan ng talata sa salaysay ng Exodo 24 at ang katawagang μόσχων
  choice: Isinalin ang tekstong Griyego ayon sa pagkakasulat nito bilang “mga guya,” nang hindi dinaragdagan o ipinapaliwanag sa pangunahing teksto ang ritwal na pinagmulan.
  alternative: “mga batang toro,” o pagpapalawak sa teksto upang iayon nang tahasan sa detalye ng Exodo 24
  rationale: Dapat manatili ang pinaikling paglalahad ng Hebreo at ang leksikal na saklaw ng salitang Griyego. Ang makatwirang alternatibo ay pinanatili sa talababa sa halip na ipilit sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “bayan” para sa kolektibong λαός, “balumbon” para sa sinaunang dokumento, at malinaw na bokabularyo para sa mga sangkap ng ritwal. Pinanatili ang kuwit sa hulihan dahil nagpapatuloy ang pangungusap sa kasunod na talata.
