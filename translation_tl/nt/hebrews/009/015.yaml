id: HEB.9.15
reference: Hebrews 9:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ διὰ τοῦτο διαθήκης καινῆς μεσίτης ἐστίν, ὅπως θανάτου γενομένου εἰς ἀπολύτρωσιν τῶν ἐπὶ τῇ πρώτῃ διαθήκῃ παραβάσεων τὴν ἐπαγγελίαν λάβωσιν οἱ κεκλημένοι τῆς αἰωνίου κληρονομίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/015.yaml
  text: And for this reason he is the mediator of a new covenant[a], so that, since a death has occurred for the redemption of the transgressions committed under the first covenant, those who have been called may receive the promise of the eternal inheritance.
translation:
  language: tl
  text: At dahil dito, siya ang tagapamagitan ng isang bagong tipan[a], upang, yamang naganap ang isang kamatayan para sa pagtubos sa mga paglabag na ginawa sa ilalim ng unang tipan, matanggap ng mga tinawag ang pangako ng walang-hanggang mana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “testamento.” Ang salitang Griyego na διαθήκη ay maaaring mangahulugang “tipan” o “testamento”; pinauunlad ng Hebreo 9:16–17 ang pagkakaugnay ng mga diwang ito, ngunit “tipan” ang higit na angkop dito dahil inihahambing ito sa unang tipan.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: At dahil dito
  rationale: Likas na pang-ugnay sa Filipino na pinananatili ang sanhi at pagpapatuloy ng argumento mula sa naunang talata.
- source_word: διαθήκης καινῆς
  choice: ng isang bagong tipan
  rationale: Ang diwang tipan ang pangunahing hinihingi ng paghahambing sa unang tipan, habang kinikilala sa talababa ang posibleng diwang testamento.
- source_word: μεσίτης
  choice: tagapamagitan
  rationale: Karaniwan, malinaw, at eksaktong tawag sa isang namamagitan sa dalawang panig.
- source_word: ὅπως
  choice: upang
  rationale: Ipinahahayag ang layunin o nilalayong bunga nang natural sa makabagong Filipino.
- source_word: θανάτου γενομένου
  choice: yamang naganap ang isang kamatayan
  rationale: Pinananatili ang kondisyunal o sanhiing bisa ng genitive absolute at ang pagkaganap na ng kamatayan, nang hindi tahasang idinaragdag sa parirala kung kaninong kamatayan iyon.
- source_word: ἀπολύτρωσιν
  choice: pagtubos
  rationale: Saklaw nito ang paglaya na naisakatuparan sa pamamagitan ng halagang ibinayad, na angkop sa kontekstong handog at sakripisyo.
- source_word: τῶν ἐπὶ τῇ πρώτῃ διαθήκῃ παραβάσεων
  choice: sa mga paglabag na ginawa sa ilalim ng unang tipan
  rationale: Ang 'sa ilalim ng' ay malinaw na naghahatid ng saklaw o kaayusang tinutukoy ng ἐπί na may datibo; idinagdag ang 'na ginawa' para sa natural na Filipino.
- source_word: τὴν ἐπαγγελίαν ... τῆς αἰωνίου κληρονομίας
  choice: ang ipinangakong walang-hanggang mana
  rationale: Natural na ipinahahayag sa Filipino ang ugnayan ng pangako at mana, bagaman mas pinagsama kaysa sa pormal na 'pangako ng walang-hanggang mana.'
- source_word: λάβωσιν
  choice: matanggap
  rationale: Ang anyong pandiwa pagkatapos ng ὅπως ay maayos na naihahatid bilang nilalayong bunga sa 'upang ... matanggap.'
- source_word: οἱ κεκλημένοι
  choice: ng mga tinawag
  rationale: Pinananatili ang pasibong pagtawag sa mga taong nasa kalagayang tinawag na.
- source_word: τῆς αἰωνίου κληρονομίας
  choice: walang-hanggang mana
  rationale: Natural at marangal na salin na pinananatili ang kaibahan ng nananatiling mana sa mga pansamantalang bagay.
theological_decisions:
- issue: Tinutukoy na simuno ng ἐστίν
  choice: Ginawang tahas na 'siya,' na tumutukoy kay Cristo mula sa agarang konteksto.
  alternative: Iwan ang simuno na di-binanggit.
  rationale: Nangangailangan ang natural na Filipino ng malinaw na simuno rito; sapat na malinaw sa konteksto ang tinutukoy nang walang pagdaragdag ng bagong aral.
- issue: Kahulugan ng διαθήκη sa talata
  choice: '''Tipan'' sa pangunahing teksto.'
  alternative: '''Testamento'' o ''huling habilin.'''
  rationale: Pangunahing hinihingi ng paghahambing sa bago at unang διαθήκη ang diwang tipan. Gayunman, hindi binubura ang semantikong pagsasanib na gagamitin sa 9:16–17, kaya inilagay ang alternatibo sa talababa.
- issue: Pagkakaugnay ng 'pangako' at 'walang-hanggang mana'
  choice: '''Ipinangakong walang-hanggang mana.'''
  alternative: '''Pangako ng walang-hanggang mana.'''
  rationale: Ang genitibong parirala ay maaaring unawain bilang pangakong tumutukoy sa mana. Ang napiling anyo ay mas natural sa Filipino at hindi ginagawang hiwalay ang pangako sa ipinangakong mana.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'tagapamagitan,' 'pagtubos,' at 'tipan' bilang mga terminong nauunawaan ngunit tumpak sa konteksto. Pinanatili ang bahagyang di-tahas na 'isang kamatayan' sa halip na idagdag sa mismong parirala ang 'kamatayan ni Cristo,' sapagkat iyon ay malinaw sa konteksto ngunit hindi nakasaad bilang pangngalan sa sugnay.
