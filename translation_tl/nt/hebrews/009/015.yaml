revisions:
- from: At dahil dito, siya ang tagapamagitan ng isang bagong tipan[a], upang, yamang naganap ang isang kamatayan para sa pagtubos sa mga paglabag na ginawa sa ilalim ng unang tipan, matanggap ng mga tinawag ang ipinangakong walang-hanggang mana.
  to: At dahil dito, siya ang tagapamagitan ng isang bagong tipan[a], upang, yamang naganap ang isang kamatayan para sa pagtubos sa mga paglabag na ginawa sa ilalim ng unang tipan, matanggap ng mga tinawag ang pangako ng walang-hanggang mana.
