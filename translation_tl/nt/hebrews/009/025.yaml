  text: οὐδ’ ἵνα πολλάκις προσφέρῃ ἑαυτόν, ὥσπερ ὁ ἀρχιερεὺς εἰσέρχεται εἰς τὰ ἅγια κατ’ ἐνιαυτὸν ἐν αἵματι ἀλλοτρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/025.yaml
  text: Nor was it so that he might offer himself many times[a], just as the high priest enters the holy places year by year with blood not his own,
translation:
  language: tl
  text: Hindi rin siya pumasok upang paulit-ulit niyang ihandog ang kanyang sarili, gaya ng punong pari na taun-taong pumapasok sa mga banal na dako[a] na may dugong hindi kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “santuwaryo.” Sa Griyego, “mga banal na dako”; sa kontekstong ito, inuunawa ito ng ilan sa mas tiyak na kahulugang “Kabanal-banalang Dako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδ’ ἵνα
  choice: Hindi rin siya pumasok upang
  rationale: 'Ipinagpapatuloy nito ang diwang nakasalalay sa naunang talata: ang pagpasok ni Cristo ay hindi para sa layuning paulit-ulit niyang ihandog ang sarili. Inilantad ang ipinahihiwatig na pandiwang ‘pumasok’ upang maging malinaw at natural sa Filipino.'
- source_word: πολλάκις
  choice: nang maraming ulit
  rationale: Tuwirang pinananatili ang ideya ng maraming pag-uulit at ang kaibahan nito sa taunang gawain ng punong pari.
- source_word: προσφέρῃ ἑαυτόν
  choice: ihandog ang kanyang sarili
  rationale: Pinananatili ang pansakripisyong kahulugan ng προσφέρω at ang reflexive na diin ng ἑαυτόν.
- source_word: ὥσπερ
  choice: gaya ng
  rationale: Natural na naghuhudyat ng paghahambing sa Filipino.
- source_word: ὁ ἀρχιερεὺς
  choice: ang punong pari
  rationale: Karaniwan at tumpak na tawag sa pinakamataas na katungkulang saserdotal sa kontekstong Judio.
- source_word: εἰσέρχεται
  choice: pumapasok
  rationale: 'Pinananatili ang aspektong pangkaugalian ng kasalukuyang panahunan: ito ang regular na ginagawa ng punong pari.'
- source_word: εἰς τὰ ἅγια
  choice: sa mga banal na dako
  rationale: Pinananatili ang anyong maramihan ng Griyego at ang sadyang lawak ng kahulugan nito, sa halip na agad itong tukuyin bilang ‘Kabanal-banalang Dako.’
- source_word: κατ’ ἐνιαυτὸν
  choice: taun-taon
  rationale: Maikli, natural, at malinaw na naghahayag ng regular na pag-uulit bawat taon.
- source_word: ἐν αἵματι ἀλλοτρίῳ
  choice: na may dalang dugong hindi kanya
  rationale: Ipinahihiwatig ang dugong ginagamit sa pagpasok at malinaw na itinatampok na hindi iyon sariling dugo ng punong pari, bilang kaibahan sa paghahandog ni Cristo ng kanyang sarili.
theological_decisions:
- issue: Ang tinutukoy ng paghahambing kay Cristo at sa Levitikong punong pari
  choice: Ipinakikita ng talata na hindi paulit-ulit na inihahandog ni Cristo ang sarili, di-gaya ng taunang pagpasok ng punong pari na may dugong hindi kanya.
  alternative: Maaaring unawain nang mas makitid ang ‘mga banal na dako’ bilang ang panloob na santuwaryo o Kabanal-banalang Dako.
  rationale: Ang agarang konteksto ay naghahambing sa di-paulit-ulit na paghahandog ni Cristo at sa paulit-ulit na paglilingkod ng punong pari. Hindi nilulutas ng salin ang leksikal na kalabuan ng τὰ ἅγια nang higit sa sinasabi ng Griyego.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang ‘punong pari’ at ‘mga banal na dako’ bilang madaling maunawaang mga terminong panrelihiyon. Ang ‘siya pumasok’ ay tahasang idinugtong mula sa konteksto ng naunang talata upang maiwasan ang putol at di-natural na pangungusap sa Filipino, nang hindi binabago ang diwa.
