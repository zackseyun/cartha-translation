base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/010.yaml
  text: concerned only with foods and drinks and various washings, fleshly regulations imposed until the time of reformation.
translation:
  language: tl
  text: Ang mga ito ay nauukol lamang sa mga pagkain, mga inumin, at iba't ibang paghuhugas—mga tuntuning panlabas na ipinataw hanggang sa panahon ng pagsasaayos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μόνον ἐπὶ βρώμασιν καὶ πόμασιν
  choice: nauukol lamang sa mga pagkain, mga inumin
  rationale: Ipinahahayag ang limitadong saklaw ng mga tuntunin habang pinananatili ang malinaw na pagtukoy sa pagkain at inumin.
- source_word: διαφόροις βαπτισμοῖς
  choice: iba't ibang paghuhugas
  rationale: Sa kontekstong ritwal ng lumang tipan, tumutukoy ang pangmaramihang βαπτισμοῖς sa sari-saring seremonyal na paghuhugas, hindi partikular sa bautismong Cristiano.
- source_word: δικαιώματα σαρκὸς
  choice: mga tuntuning panlabas
  rationale: Ang σαρκὸς dito ay tumutukoy sa pisikal o panlabas na larangan ng mga regulasyon. Mas natural sa modernong Tagalog ang 'panlabas' kaysa literal na 'makalaman,' na maaaring maling maunawaan bilang makasalanan.
- source_word: ἐπικείμενα
  choice: ipinataw
  rationale: Pinananatili ang diwa ng mga regulasyong nakatalaga o nakabigkis bilang obligasyon.
- source_word: μέχρι καιροῦ διορθώσεως
  choice: hanggang sa panahon ng pagsasaayos ng lahat
  rationale: Ipinahahayag ng διορθώσεως ang pagtatama o paglalagay sa wastong kaayusan; ang 'ng lahat' ay likas na Tagalog na paglilinaw sa malawak na pagbabagong tinutukoy ng konteksto.
theological_decisions:
- issue: Kahulugan ng σαρκὸς sa pariralang δικαιώματα σαρκὸς
  choice: mga tuntuning panlabas
  alternative: mga tuntunin para sa laman / mga tuntuning makalaman
  rationale: Iniiwasan ang implikasyong likas na masama o makasalanan ang mga tuntunin; ang diin ay nasa panlabas at pisikal na pagsunod kumpara sa budhi.
- issue: Saklaw ng καιροῦ διορθώσεως
  choice: panahon ng pagsasaayos ng lahat
  alternative: panahon ng pagbabago / panahon ng pagpapanibago
  rationale: Pinananatili ang ideya ng paglalagay sa wastong kaayusan nang hindi tahasang ipinapako ang parirala sa iisang sistemang teolohikal.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang em dash upang ipakitang ang 'mga tuntuning panlabas' ay naglalarawan sa naunang talaan. Walang footnote dahil sapat na naihahayag sa teksto ang mga pangunahing kahulugan.
