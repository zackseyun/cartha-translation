revisions:
- from: Doon ay pumasok si Jesus bilang tagapanguna alang-alang sa atin[a], at naging dakilang pari magpakailanman ayon sa kaayusan ni Melquisedec[b].
  to: Kung saan pumasok si Jesus bilang tagapagpauna para sa atin[a], na naging dakilang pari magpakailanman ayon sa kaayusan ni Melquisedec[b].
  rationale: Pinalitan ang pang-ugnay upang malinaw na tumukoy sa dakong binanggit sa naunang talata, at ang “tagapanguna” ng “tagapagpauna” upang maipakita ang tiyak na diwa ng πρόδρομος. Inayos ang pagsasalin ng participle na γενόμενος bilang “na naging,” upang mapanatili ang pandiwang diwa ng pagiging dakilang pari nang hindi ito ginagawang hiwalay na pangunahing pangyayari. Hindi binibigyang-kahulugan ng salin ang pagiging dakilang pari bilang pagbabago sa likas na pagkatao ni Jesus.
