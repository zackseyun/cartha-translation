  text: ὅπου πρόδρομος ὑπὲρ ἡμῶν εἰσῆλθεν Ἰησοῦς, κατὰ τὴν τάξιν Μελχισέδεκ ἀρχιερεὺς γενόμενος εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/020.yaml
  text: where Jesus has entered as a forerunner on our behalf[b][a], having become a high priest forever according to the order of Melchizedek.
translation:
  language: tl
  text: Kung saan pumasok si Jesus bilang tagapagpauna para sa atin[a], na naging dakilang pari magpakailanman ayon sa kaayusan ni Melquisedec[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “alang-alang sa atin.” Maaaring ipahayag ng pariralang Griego ang pagkilos para sa kapakinabangan ng iba; dito, binibigyang-diin din nito ang kinatawang pagpasok ni Jesus.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ayon sa orden ni Melquisedec.” Alingawngaw ito ng Awit 110:4.
    reason: cross_reference
lexical_decisions:
- source_word: ὅπου
  choice: Doon
  rationale: Tumutukoy ito sa dakong nasa kabila ng tabing sa naunang talata at pinananatili ang lokatibong diwa nang hindi nagdaragdag ng paliwanag.
- source_word: πρόδρομος
  choice: tagapanguna
  rationale: Ipinahihiwatig ang isang nauunang pumasok at nagbubukas ng daan para sa mga susunod; natural at marangal ito sa makabagong Filipino.
- source_word: ὑπὲρ ἡμῶν
  choice: alang-alang sa atin
  rationale: Pinananatili ang diwa ng pagkilos para sa kapakinabangan at bilang kinatawan ng iba, nang hindi ito nililimitahan sa mas tiyak na kahulugang pamalit.
- source_word: εἰσῆλθεν
  choice: pumasok
  rationale: Payak at tumpak na katumbas ng kilos ng pagpasok; malinaw sa konteksto na may nananatiling kabuluhan ang naganap na kilos.
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Karaniwang anyo ng pangalan sa makabagong Filipino.
- source_word: κατὰ τὴν τάξιν Μελχισέδεκ
  choice: ayon sa kaayusan ni Melquisedec
  rationale: Pinananatili ang ideya ng huwaran o kaayusang kaugnay ni Melquisedec at ang alingawngaw ng Awit 110:4, nang hindi ipinapalagay na tumutukoy ito sa isang organisadong samahan.
- source_word: ἀρχιερεὺς
  choice: dakilang pari
  rationale: Karaniwan at malinaw na katawagan sa natatanging mataas na tungkuling pansaserdote na sentral sa Hebreo.
- source_word: γενόμενος
  choice: at naging
  rationale: Pinananatili ang pandiwang diwa ng pagkakaroon ng tungkuling dakilang pari. Ginamit ang likas na koordinasyon sa Filipino upang hindi labis na tukuyin kung temporal, sanhi, o kasabay ang relasyon ng participle sa pagpasok.
- source_word: εἰς τὸν αἰῶνα
  choice: magpakailanman
  rationale: Likas at malinaw na Filipino para sa walang-hanggang pananatili ng tungkulin.
theological_decisions:
- issue: Kaugnayan ng γενόμενος sa pagkakakilanlan ni Cristo
  choice: Isinaling “at naging dakilang pari” bilang pagtanggap o pagganap sa tungkulin, habang pinananatili ang pandiwang anyo.
  alternative: “matapos italagang dakilang pari” o “bilang dakilang pari”
  rationale: Hindi sinasabi ng talata na noon lamang umiral si Jesus o nagbago ang kaniyang likas na pagkatao. Gayunman, hindi rin dapat alisin sa salin ang diwa ng γενόμενος sa pamamagitan lamang ng isang tahasang pangngalang parirala.
- issue: Saklaw ng ὑπὲρ ἡμῶν
  choice: “alang-alang sa atin,” na maaaring magpahayag ng kapakinabangan at pagkatawan
  alternative: “para sa atin” o “bilang kapalit natin”
  rationale: Binibigyang-diin ng konteksto ang pagpasok ni Jesus na nauuna at para sa kaniyang mga tao. Hindi ginawang “bilang kapalit natin” upang hindi magpasok ng mas makitid na pormula ng pagpapalit na hindi tahasang sinasabi rito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tagapanguna,” “dakilang pari,” at “magpakailanman” bilang madaling maunawaang mga katawagang nagpapanatili sa larawan at teolohikal na bigat ng Griego. Ang “kaayusan” ay mas likas na Filipino kaysa “orden” at iniiwasang magmukhang pangalan ng isang organisasyon.
