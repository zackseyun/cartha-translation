lexical_decisions:
- source_word: καλὸν
  choice: mabuti
  rationale: Likas na inilalarawan ng καλόν ang ῥῆμα bilang mabuti, kapaki-pakinabang, o mahusay. Pinananatili ng “mabuti” ang positibong pagtataya nang hindi dinaragdagan ang kahulugan.
- source_word: γευσαμένους
  choice: nakatikim
  rationale: Pinananatili ng “nakatikim” ang metapora ng γεύομαι at ang ugnayan nito sa naunang talata. Hindi nito ipinapakahulugan kung mababaw o ganap ang karanasang tinutukoy.
- source_word: θεοῦ ῥῆμα
  choice: salita ng Diyos
  rationale: Ang ῥῆμα ay maaaring tumukoy sa sinabi o pahayag, ngunit ang “salita ng Diyos” ay malinaw, likas, at marangal sa modernong Tagalog, at ipinapakita ang Diyos bilang pinagmulan ng salita.
- source_word: δυνάμεις
  choice: mga kapangyarihan
  rationale: Maaaring tumukoy ang pangmaramihang δυνάμεις sa mga himala o makapangyarihang gawa, ngunit pinananatili ng “mga kapangyarihan” ang mas malawak na saklaw at ang tunay na kalabuan ng Griyego.
- source_word: τε
  choice: at
  rationale: Payak at likas na iniuugnay ng “at” ang δυνάμεις sa naunang layon, gaya ng ginagawa ng τε sa sugnay.
- source_word: μέλλοντος αἰῶνος
  choice: ng darating na panahon
  rationale: Ipinahihiwatig ng parirala ang eskatolohikal na kapanahunang hindi pa ganap na dumarating. Ang “darating na panahon” ay natural sa modernong Tagalog at malinaw na nakaugnay sa “mga kapangyarihan.”
theological_decisions:
- issue: Kahulugan ng “nakatikim” sa konteksto ng babala
  choice: Panatilihin ang “nakatikim” nang hindi dinaragdagan ng paliwanag tungkol sa lalim ng karanasan.
  alternative: “nakaranas” o “bahagya lamang na nakatikim”
  rationale: Pinananatili nito ang metapora ng γεύομαι at hindi nilulutas sa salin ang pinagtatalunang tanong kung gaano kalalim ang pakikibahagi ng mga taong tinutukoy.
- issue: Saklaw ng δυνάμεις sa eskatolohikal na konteksto
  choice: “mga kapangyarihan”
  alternative: “mga himala” o “makapangyarihang mga gawa”
  rationale: Maaaring tumukoy ang salita sa mahimalang pagpapamalas na kaugnay ng pagdating ng bagong kapanahunan, ngunit maaari rin itong magkaroon ng mas malawak na diwa. Iniiwasan ng salin na paliitin agad ang kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Pinanatili ang anyong parirala na nakaugnay sa mas mahabang pangungusap ng Hebreo 6:4–6; hindi ginawang ganap na nagsasariling pangungusap ang talata.
