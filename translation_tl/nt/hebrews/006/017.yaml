base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/017.yaml
  text: So when God desired to show more clearly to the heirs of the promise the unchangeable character of his purpose[a], he guaranteed it with an oath[b],
translation:
  language: tl
  text: Kaya, sa hangarin ng Diyos na lalong malinaw na ipakita sa mga tagapagmana ng pangako ang di-mababagong katangian ng kanyang layunin,[a] pinagtibay niya ito sa pamamagitan ng isang panunumpa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na ang kanyang pasya ay hindi mababago.”
    reason: lexical_alternative
  - marker: b
    text: Mas literal, “namagitan siya sa pamamagitan ng isang panunumpa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Kaya, dahil
  rationale: Ipinapahayag nito ang lohikal na kaugnayan sa naunang talakayan tungkol sa pangako at panunumpa ng Diyos; mas malinaw ito sa makabagong Tagalog kaysa sa literal na “kung saan.”
- source_word: περισσότερον
  choice: nang lalong malinaw
  rationale: Pinalalakas ng paghahambing na pang-abay ang pandiwang “ipakita” at likas na ipinahahayag sa Tagalog bilang mas malinaw na pagpapakita.
- source_word: βουλόμενος
  choice: nais
  rationale: Nagsasaad ito ng sinadya at kusang hangarin ng Diyos, hindi ng isang walang katiyakang pagnanais lamang.
- source_word: ἐπιδεῖξαι
  choice: ipakita
  rationale: Direkta at karaniwang salin ito ng pagpapakita o pagpapatunay; kasama ng “nang lalong malinaw,” naipahahayag ang diin ng parirala.
- source_word: τοῖς κληρονόμοις τῆς ἐπαγγελίας
  choice: sa mga tagapagmana ng pangako
  rationale: Pinananatili nito ang larawang legal at tipanan ng κληρονόμοι at ang tuwirang kaugnayan nito sa pangako.
- source_word: τὸ ἀμετάθετον τῆς βουλῆς αὐτοῦ
  choice: na hindi mababago ang kanyang layunin
  rationale: Malinaw at natural nitong ipinahahayag ang di-mababagong katangian ng sinadyang pasya o layunin ng Diyos nang hindi gumagamit ng teknikal na katawagang pilosopikal.
- source_word: ἐμεσίτευσεν
  choice: pinagtibay niya ito
  rationale: Sa konteksto, ipinahihiwatig ng bihirang pandiwa ang pagbibigay ng katiyakan o pagpapatibay sa pamamagitan ng panunumpa. Ang “ito” ay likas na tumutukoy sa ipinahayag na layunin/pangako.
- source_word: ὅρκῳ
  choice: sa pamamagitan ng panunumpa
  rationale: Ipinapakita ng datibo ang paraang ginamit; malinaw at marangal ang pariralang ito sa makabagong Tagalog.
theological_decisions:
- issue: Ang di-mababagong katangian ng layunin ng Diyos
  choice: hindi mababago ang kanyang layunin
  alternative: ang di-mababagong katangian ng kanyang pasya
  rationale: Pinananatili ng napiling salin ang tahasang diin ng teksto sa pagiging tiyak at di-nagbabago ng layunin ng Diyos, ngunit hindi nagdaragdag ng mas malawak na sistematikong pahayag tungkol sa kalikasan ng Diyos.
- issue: Ang diwa ng ἐμεσίτευσεν kaugnay ng panunumpa
  choice: pinagtibay niya ito sa pamamagitan ng panunumpa
  alternative: namagitan siya sa pamamagitan ng panunumpa
  rationale: Ipinahahayag ng “pinagtibay” ang tungkulin ng panunumpa bilang karagdagang katiyakan sa mga tagapagmana. Ang mas literal na “namagitan” ay posibleng salin ngunit maaaring magpahiwatig sa Tagalog ng pakikipagkasundo sa dalawang panig, na hindi tiyak na diwa rito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tagapagmana” upang mapanatili ang larawang legal at tipanan, at iniwasan ang teknikal o makalumang pananalitang hindi kailangan ng tekstong Griyego.
