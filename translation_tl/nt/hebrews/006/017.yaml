    issue: Di-likas na dobleng pang-ugnay na “Kaya, dahil.”
    rationale: Kapwa naihahayag ng “Kaya” at “dahil” ang lohikal na kaugnayan, ngunit ang kanilang pinagsamang gamit dito ay mabigat. Hindi kailangan ng Griyego ang hiwalay na sanhi na “dahil”; ang βουλόμενος ay mas mahusay na maipapahayag sa “sa hangarin ng Diyos na.”
  - severity: low
    issue: Ang τὸ ἀμετάθετον ay naisasalin bilang isang sugnay sa halip na ang tahasang kalidad na tinutukoy ng Griyego.
    rationale: Ang “na hindi mababago ang kanyang layunin” ay hindi mali sa diwa, ngunit ang “ang di-mababagong katangian ng kanyang layunin” ay mas eksakto at mas malinaw na pinananatili ang substantibong abstrakto ng pinagmulan.
