  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ οὕτως μακροθυμήσας ἐπέτυχεν τῆς ἐπαγγελίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/015.yaml
  text: And so[a], after waiting patiently, he obtained the promise.
translation:
  language: tl
  text: At sa gayon, matapos maghintay nang may pagtitiis, natamo niya ang pangako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “natanggap niya ang ipinangako.” Mas literal sa Griyego ang “natamo niya ang pangako.”
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Likas na pang-ugnay sa naunang talakayan tungkol kay Abraham.
- source_word: οὕτως
  choice: sa gayon
  rationale: Ipinahahayag ang paraan o kinalabasan kaugnay ng naunang salaysay; marangal at natural sa modernong Tagalog.
- source_word: μακροθυμήσας
  choice: matapos maghintay nang may pagtitiis
  rationale: Ipinakikita ang matiyagang paghihintay sa paglipas ng panahon at ang temporal na kaugnayan nito sa pangunahing pandiwa.
- source_word: ἐπέτυχεν
  choice: natamo
  rationale: Tumpak na nagpapahayag ng matagumpay na pagkamit nang hindi tiyakang nagsasabing ganap nang natupad ang lahat ng ipinangako.
- source_word: τῆς ἐπαγγελίας
  choice: ang pangako
  rationale: Pinananatili ang tahasang leksikal na anyo ng Griyego at ang ugnayan nito sa pangako ng Diyos sa konteksto.
theological_decisions:
- issue: Kung ang ἐπέτυχεν τῆς ἐπαγγελίας ay nangangahulugang natanggap ni Abraham ang ganap na katuparan o natamo niya ang pangako.
  choice: natamo niya ang pangako
  alternative: natanggap niya ang ipinangako
  rationale: Literal na tumutukoy ang Griyego sa pagkakamit ng ‘pangako,’ hindi tahasang sa buong katuparan nito. Pinananatili ng salin ang teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “sa gayon” upang mapanatili ang ugnayang lohikal, at “nang may pagtitiis” upang maging natural ang paglalarawan sa matiyagang paghihintay.
