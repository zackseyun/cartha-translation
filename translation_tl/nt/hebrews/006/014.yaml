translation:
  language: tl
  text: na nagsabi[a], “Tiyak na pagpapalain kita, at tiyak na pararamihin kita.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal na ayos sa Griyego: “nagpapala ay pagpapalain kita at nagpaparami ay pararamihin kita,” isang mariing pag-uulit na umaalingawngaw sa Genesis 22:17.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: na nagsasabi
  rationale: Ang kasalukuyang participle ay nagpapakilala sa nilalaman ng panunumpa ng Diyos; likas itong nag-uugnay sa naunang sugnay sa konteksto.
- source_word: Εἰ μὴν
  choice: Tiyak na
  rationale: Isa itong mariing pormula ng pagpapatibay sa isang panunumpa, hindi literal na kondisyunal na pahayag.
- source_word: εὐλογῶν εὐλογήσω
  choice: pagpapalain kita
  rationale: Ang inuulit na anyong pandiwa ay Semitikong paraan ng pagdidiin; ang ‘tiyak na’ ay malinaw at natural na naghahatid ng diin sa modernong Tagalog.
- source_word: σε
  choice: kita
  rationale: Tuwirang layon na ikalawang panauhang isahan, na tumutukoy kay Abraham.
- source_word: καὶ
  choice: at
  rationale: Payak na pangatnig na nag-uugnay sa dalawang pangako.
- source_word: πληθύνων πληθυνῶ σε
  choice: tiyak na pararamihin kita
  rationale: Pinananatili ng ‘pararamihin’ ang tuwirang kilos ng pandiwang Griyego, at inuulit ang ‘tiyak na’ upang maipakita ang katumbas na diin at paralelismo ng ikalawang pangako.
theological_decisions:
- issue: Paglalahad sa mariing pormula ng panunumpa mula sa pangako kay Abraham
  choice: Gamitin ang likas na Tagalog na ‘Tiyak na pagpapalain kita, at tiyak na pararamihin kita,’ habang inilalagay sa talababa ang literal na pag-uulit.
  alternative: ‘Sa pagpapala ay pagpapalain kita, at sa pagpaparami ay pararamihin kita.’
  rationale: Napananatili sa pangunahing teksto ang mariing puwersa at paralelismo ng dalawang pangako nang hindi nagiging artipisyal ang Tagalog; itinatala naman sa talababa ang anyo ng Griyego at ang alusyon sa Genesis 22:17.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang ‘pararamihin’ sa halip na mas interpretatibong ‘gagawin kitang πολυ/marami’ upang mapanatili ang pandiwang anyo at alusyon sa pangako kay Abraham.
