id: HEB.6.1
reference: Hebrews 6:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Διὸ ἀφέντες τὸν τῆς ἀρχῆς τοῦ Χριστοῦ λόγον ἐπὶ τὴν τελειότητα φερώμεθα, μὴ πάλιν θεμέλιον καταβαλλόμενοι μετανοίας ἀπὸ νεκρῶν ἔργων, καὶ πίστεως ἐπὶ θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/001.yaml
  text: Therefore[a], leaving the elementary message about the Messiah, let us be carried on to maturity, not laying again a foundation of repentance from dead works and of faith toward God[d][c][b],
translation:
  language: tl
  text: Kaya, iwanan na natin ang panimulang aral tungkol sa Mesiyas[a] at hayaan nating dalhin tayo tungo sa ganap na pag-unlad[c][b], nang hindi natin muling inilalatag ang pundasyon ng pagsisising tumatalikod sa mga patay na gawa at ng pananampalataya sa Diyos[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang pangunahing mensahe tungkol sa Mesiyas” o “ang batayang aral tungkol sa Mesiyas.” Ang “iwanan” dito ay paglagpas sa mga panimulang aral, hindi kinakailangang pagtatakwil sa mga iyon.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring “magpatuloy tayo” o “sumulong tayo.” Pasibo ang Griyego: mas literal, “dalhin tayo pasulong.”'
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “tungo sa kahustuhan,” “tungo sa kaganapan,” o “tungo sa kasakdalan.”
    reason: lexical_alternative
  - marker: d
    text: Mas literal, “pananampalatayang nakatuon sa Diyos.”
    reason: alternative_reading
lexical_decisions:
- source_word: Διὸ
  choice: Kaya
  rationale: Likas at malinaw na panandang naghihinuha mula sa naunang konteksto at nagpapakilala ng kasunod na panawagan.
- source_word: ἀφέντες
  choice: iwan na natin
  rationale: Pinananatili ang diwa ng pag-alis sa kasalukuyang pagtutuon sa mga panimulang aral. Hindi nito ipinahihiwatig na itinatakwil ang mga iyon, gaya ng ipinakikita ng talinghaga ng pundasyon sa kasunod na sugnay.
- source_word: τὸν τῆς ἀρχῆς τοῦ Χριστοῦ λόγον
  choice: ang panimulang aral tungkol sa Mesiyas
  rationale: Ang λόγος ay tumutukoy rito sa mensahe o aral, at ang mahirap na hanay ng mga henitibo ay pinakamalinaw na naipahahayag bilang paunang pagtuturo tungkol sa Mesiyas.
- source_word: Χριστοῦ
  choice: Mesiyas
  rationale: Ginagamit dito ang Χριστός bilang titulo; ang “Mesiyas” ay natural at malinaw sa modernong Filipino.
- source_word: ἐπὶ τὴν τελειότητα
  choice: tungo sa ganap na paglago
  rationale: Ipinahahayag ang pag-abot sa kahustuhan o kaganapan sa kaibahan sa panimulang pagtuturo, nang hindi awtomatikong ipinakahulugang kawalan ng anumang kasalanan.
- source_word: φερώμεθα
  choice: hayaan nating dalhin tayo pasulong
  rationale: Pinananatili ang pasibong tinig ng Griyego at ang panawagang nasa unang panauhang maramihan, ngunit ginagawang natural sa Filipino.
- source_word: θεμέλιον καταβαλλόμενοι
  choice: muling ilatag ang pundasyon
  rationale: Pinananatili ang talinghaga ng pagtatayo at natural itong pakinggan sa Filipino.
- source_word: μετανοίας ἀπὸ νεκρῶν ἔργων
  choice: pagsisising tumatalikod sa mga patay na gawa
  rationale: Ipinahahayag ng “tumatalikod” ang puwersa ng ἀπό at iniiwasang maging simpleng panghihinayang lamang ang “pagsisisi.” Pinananatili ng “mga patay na gawa” ang sadyang maigsi at posibleng maraming-kahulugang metapora.
- source_word: πίστεως ἐπὶ θεόν
  choice: pananampalataya sa Diyos
  rationale: Ito ang malinaw at likas na Filipino para sa pananampalatayang nakatuon o umaasa sa Diyos; nakatala sa talababa ang mas literal na direksiyonal na diwa.
theological_decisions:
- issue: Kung ang pag-iwan sa panimulang aral tungkol sa Mesiyas ay nangangahulugang pagtatakwil dito
  choice: Paglampas sa panimulang pagtuturo bilang kasalukuyang pokus upang sumulong
  alternative: Lubusang pagtalikod o pagtatakwil sa mensahe tungkol sa Mesiyas
  rationale: Ang kasunod na pahayag na huwag muling ilatag ang pundasyon ay nagpapahiwatig ng pagtatayo pa mula rito, hindi ng paggiba o pagtatakwil dito.
- issue: Kung ang τελειότης ay “kasakdalan” o “kahustuhan”
  choice: ganap na paglago
  alternative: kasakdalan; kaganapan; kahustuhan
  rationale: Sa paghahambing sa mga panimulang aral, ang konteksto ay tumutukoy sa lubos na pag-unlad o kahustuhan. Hindi tahasang nilulutas ng salin ang lahat ng saklaw ng salitang Griyego.
- issue: Kung dapat gawing aktibo ang pasibong φερώμεθα
  choice: Pinanatili ang pasibong diwa sa “hayaan nating dalhin tayo pasulong”
  alternative: sumulong tayo; magpatuloy tayo
  rationale: Hindi tinutukoy ng Griyego ang tagapagdala. Pinananatili ng salin ang pasibong anyo nang hindi ipinapangalan kung sino ang kumikilos.
- issue: Kahulugan ng “mga patay na gawa”
  choice: Pinanatili ang metaporang “mga patay na gawa”
  alternative: mga gawang walang buhay; mga gawang humahantong sa kamatayan
  rationale: Hindi tahasang nililinaw ng talata kung ang mga gawa ay walang bisa, nagmumula sa kalagayang patay, o humahantong sa kamatayan; ang literal na metapora ay nagpapanatili ng tensiyong ito.
translation_notes:
  register: Modernong Filipino na dignificado at madaling maunawaan. Ginamit ang “Mesiyas” bilang titulo, “panimulang aral” para sa malinaw na pagtuturo, at “ilatag ang pundasyon” upang mapanatili ang talinghaga. Hinati sa dalawang pangungusap para sa likas na pagbasa sa Filipino habang pinananatili ang lohikal na ugnayan ng mga sugnay.
