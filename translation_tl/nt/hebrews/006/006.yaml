  to: at tumalikod na[a], na muling panumbalikin sa pagsisisi[b], sapagkat muli nilang ipinapako sa krus para sa kanilang sarili ang Anak ng Diyos at inilalantad siya sa hayagang kahihiyan.
  rationale: Pinalitan ang "upang" ng "na" upang mapanatili ang pagkakaugnay ng infinitibo sa "imposible" sa Hebreo 6:4–5 at maiwasan ang maling diwang layunin. Pinino rin ang huling parirala upang mas natural at mas malapit sa diwa ng hayagang pampublikong kahihiyan. Walang binagong doktrinal na pagpapakahulugan o inalis na kalabuan.
