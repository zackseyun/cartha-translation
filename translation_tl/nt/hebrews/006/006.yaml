id: HEB.6.6
reference: Hebrews 6:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ παραπεσόντας, πάλιν ἀνακαινίζειν εἰς μετάνοιαν, ἀνασταυροῦντας ἑαυτοῖς τὸν υἱὸν τοῦ θεοῦ καὶ παραδειγματίζοντας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/006.yaml
  text: and having fallen away[a], to renew them again to repentance[b], since they are crucifying again for themselves the Son of God and exposing him to public shame.
translation:
  language: tl
  text: at tumalikod na[a], na muling panumbalikin sa pagsisisi[b], sapagkat muli nilang ipinapako sa krus para sa kanilang sarili ang Anak ng Diyos at inilalantad siya sa hayagang kahihiyan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “gumawa ng apostasya.” Ang pandiwang Griyego ay maaaring tumukoy sa isang malubhang pagtalikod.
    reason: lexical_alternative
  - marker: b
    text: O “habang muli nilang ipinapako sa krus para sa kanilang sarili ang Anak ng Diyos at inilalantad siya sa hayagang kahihiyan.” Maaaring unawain ang mga participle sa Griyego bilang kasabay ng pagpapanumbalik, bukod sa pagiging paliwanag kung bakit hindi ito magagawa.
    reason: alternative_reading
lexical_decisions:
- source_word: παραπεσόντας
  choice: tumalikod na
  rationale: Ipinahahayag nito ang isang malubhang paglayo o pagtalikod, nang hindi ipinapasok sa pangunahing teksto ang teknikal at maaaring denominasyonal na katawagang “apostasya.”
- source_word: πάλιν ἀνακαινίζειν
  choice: muling panumbalikin
  rationale: Ang “muli” ay kaugnay ng infinitibong “panumbalikin” at ipinahahayag ang pagbabalik sa dating kalagayan.
- source_word: εἰς μετάνοιαν
  choice: sa pagsisisi
  rationale: Ang εἰς ay nagpapahayag ng tunguhin, at ang “pagsisisi” ay likas at teolohikal na hindi labis na makitid na salin ng μετάνοια.
- source_word: ἀνασταυροῦντας
  choice: muli nilang ipinapako sa krus
  rationale: Pinananatili ang muling pagganap at ang nagpapatuloy na diwa ng present participle sa natural na Tagalog.
- source_word: ἑαυτοῖς
  choice: para sa kanilang sarili
  rationale: Pinananatili ang reflexive dative at ang diwang ang ginagawa ay sa kanilang sariling panig o kapinsalaan.
- source_word: τὸν υἱὸν τοῦ θεοῦ
  choice: ang Anak ng Diyos
  rationale: Tuwiran at karaniwang salin ng kristolohikal na titulo.
- source_word: παραδειγματίζοντας
  choice: inilalantad siya sa kahihiyan sa harap ng lahat
  rationale: Ipinahahayag ang pampublikong paglalantad sa pagkahiya o paghamak, hindi lamang pribadong pagdusta.
theological_decisions:
- issue: Pagkakaugnay ng talata sa pahayag na “imposible” sa naunang konteksto
  choice: Nagsisimula sa “at” at hindi inuulit ang “imposible,” kaya nananatiling nakasalalay ang balangkas sa Hebreo 6:4–6.
  alternative: “imposibleng ... muling panumbalikin ang mga tumalikod”
  rationale: Ang Griyego ay sintaktikong karugtong ng naunang talata; hindi dapat magdagdag ng bagong finite verb sa talatang ito.
- issue: Kalikasan ng pagtalikod
  choice: “tumalikod na”
  alternative: “nagtaksil sa pananampalataya” o “gumawa ng apostasya”
  rationale: Pinananatili ang bigat ng babala nang hindi nagpapasya sa mga sumunod na pagtatalo tungkol sa pagkawala ng kaligtasan, huwad na pananampalataya, o ibang uri ng pagtalikod.
- issue: Ugnayan ng ἀνασταυροῦντας at παραδειγματίζοντας sa pagpapanumbalik
  choice: 'Kausal: “sapagkat”'
  alternative: 'Temporal: “habang”'
  rationale: Malamang na ipinaliliwanag ng mga participle ang batayan ng pahayag, ngunit inilalagay sa talababa ang posibleng sabayang pagbasa upang mapanatili ang tunay na kalabuan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang pagkakabit ng talata sa naunang pangungusap at iniwasan ang teknikal na katawagang denominasyonal sa pangunahing teksto.
