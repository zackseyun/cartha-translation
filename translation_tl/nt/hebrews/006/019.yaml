id: HEB.6.19
reference: Hebrews 6:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἣν ὡς ἄγκυραν ἔχομεν τῆς ψυχῆς, ⸀ἀσφαλῆ τε καὶ βεβαίαν καὶ εἰσερχομένην εἰς τὸ ἐσώτερον τοῦ καταπετάσματος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/019.yaml
  text: We have this as an anchor of the soul[a], both secure and firm, and entering into the inner place behind the curtain,
translation:
  language: tl
  text: Ang pag-asang ito ay taglay natin bilang angkla ng kaluluwa—maaasahan at matatag, at pumapasok sa kaloob-loobang dako sa likod ng tabing.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “sa dakong nasa loob ng tabing” o “sa kabila ng tabing.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν
  choice: Ang pag-asang ito
  rationale: Ang panghalip na pambabae ay tumutukoy sa “pag-asa” sa naunang talata. Tahasang binanggit ang tinutukoy upang maging malinaw at natural sa Tagalog.
- source_word: ὡς ἄγκυραν
  choice: bilang angkla
  rationale: Pinananatili ang tuwirang paghahambing at ang larawang pandagat.
- source_word: ἔχομεν
  choice: taglay natin
  rationale: Natural at marangal na katumbas ng kasalukuyang “mayroon tayo,” at maayos na nakakabit sa pag-asang tinutukoy.
- source_word: τῆς ψυχῆς
  choice: ng kaluluwa
  rationale: Pinananatili ang karaniwang leksikal at metaporikal na diwa ng ψυχή nang hindi ito pinakikitid sa isip o damdamin lamang.
- source_word: ἀσφαλῆ
  choice: maaasahan
  rationale: Ipinahahayag ang katiwasayan at pagiging mapananaligan ng angkla sa paraang natural sa modernong Tagalog.
- source_word: τε καὶ
  choice: at
  rationale: Likas na pinag-uugnay sa Tagalog ang magkatambal na katangian sa pamamagitan ng “at”; hindi kailangang pilitin ang isang pormal na katumbas ng “both … and.”
- source_word: βεβαίαν
  choice: matatag
  rationale: Ipinapanatili ang diwa ng katibayan at hindi pag-uurong, habang inihihiwalay hangga't maaari sa “maaasahan.”
- source_word: εἰσερχομένην
  choice: pumapasok
  rationale: Pinananatili ang aktibong larawang ang pag-asa bilang angkla ay pumapasok sa panloob na dako, nang hindi ipinapaliwanag nang higit sa Griyego.
- source_word: εἰς τὸ ἐσώτερον
  choice: sa kaloob-loobang dako
  rationale: Ipinahahayag ang panloob na lugar ng santuwaryo nang hindi agad pinapangalanan o labis na tinutukoy ang eksaktong silid.
- source_word: τοῦ καταπετάσματος
  choice: sa likod ng tabing
  rationale: Natural na ipinapakita ang ipinahihiwatig na ugnayang pangkalawakan at pinananatili ang larawan ng harang sa santuwaryo.
theological_decisions:
- issue: Larawan ng makalangit na santuwaryo
  choice: sa kaloob-loobang dako sa likod ng tabing
  alternative: sa dakong nasa loob ng tabing; sa kabila ng tabing
  rationale: Malinaw na pinananatili ang larawan ng tabernakulo o templo ngunit hindi tinutukoy nang higit sa sinasabi ng talata kung anong dako o tabing ito.
- issue: Gramatikal na ugnayan ng pag-asa at angkla
  choice: Ang pag-asang ito ay taglay natin bilang angkla … at pumapasok
  alternative: Mayroon tayong angkla … na pumapasok
  rationale: Pinananatili ang pagtukoy ng ἣν sa pag-asa ng naunang talata at ang patuloy na metapora ng angkla, sa halip na gawing isang hiwalay na bagay ang angkla.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “tabing” sa halip na mas arkaikong “belo,” at pinanatili ang matapang na metapora ng angklang pumapasok sa panloob na santuwaryo.
