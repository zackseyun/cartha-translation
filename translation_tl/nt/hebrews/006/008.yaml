  text: ἐκφέρουσα δὲ ἀκάνθας καὶ τριβόλους ἀδόκιμος καὶ κατάρας ἐγγύς, ἧς τὸ τέλος εἰς καῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/008.yaml
  text: But if it bears thorns and thistles[a], it is worthless and near to being cursed, and its end is for burning.
translation:
  language: tl
  text: Ngunit kung nagbubunga ito ng mga tinik at dawag, wala itong pakinabang[a] at malapit na sa sumpa; ang kahihinatnan nito ay ang pagsunog.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “itinakwil.”'
    reason: Ipinakikita ang mahalagang alternatibong kahulugan ng ἀδόκιμος, na maaaring tumukoy sa bagay na hindi pumasa sa pagsubok at dahil dito ay tinanggihan.
lexical_decisions:
- source_word: ἐκφέρουσα
  choice: nagbubunga
  rationale: Ang kasalukuyang participle na pambabae ay tumutukoy sa lupang binanggit sa naunang talata. Likas sa Filipino ang “nagbubunga” sa patuloy na larawang pang-agrikultura.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita nito ang malinaw na pagsalungat sa lupang namumunga nang mabuti sa talata 7.
- source_word: ἀκάνθας καὶ τριβόλους
  choice: mga tinik at dawag
  rationale: Pinananatili ng pares na ito ang dalawang uri ng halamang matinik; karaniwan at madaling maunawaan ang “dawag” sa kontekstong pangbukid.
- source_word: ἀδόκιμος
  choice: wala itong pakinabang
  rationale: Sa agarang larawan ng lupa, ang salita ay tumutukoy sa hindi pumapasa sa pagsubok ng pagiging kapaki-pakinabang. Pinananatili sa talababa ang mas matinding alternatibong “itinakwil.”
- source_word: κατάρας ἐγγύς
  choice: malapit nang sumpain
  rationale: Natural itong pagpapahayag sa Filipino ng pagiging malapit sa isang sumpa, nang hindi dinaragdagan ang uri o ganap na katuparan ng sumpang iyon.
- source_word: τέλος
  choice: kahihinatnan
  rationale: Ipinahahayag nito ang maaaring diwang pangwakas at ang resulta ng lupa, at mas natural dito kaysa sa literal na “wakas.”
- source_word: εἰς καῦσιν
  choice: ay sunugin
  rationale: Pinananatili nito ang layunin o resultang pagsunog nang hindi tahasang ipinapakahulugan ang apoy bilang isang tiyak na doktrina ng huling paghuhukom.
theological_decisions:
- issue: Kung dapat bang tahasang ulitin ang “lupa” mula sa naunang talata
  choice: Gamitin ang “ito” at huwag ulitin ang “lupa.”
  alternative: “Ngunit ang lupang nagbubunga ng mga tinik at dawag...”
  rationale: Malinaw sa anyong pambabae ng participle at sa konteksto na lupa ang tinutukoy, ngunit hindi inuulit ang pangngalan sa Griyego. Natural na naipagpapatuloy ito ng “ito” sa Filipino.
- issue: Kung dapat bang isalin ang ἀδόκιμος bilang mas matinding “itinakwil”
  choice: “wala itong pakinabang” sa pangunahing teksto, na may “itinakwil” sa talababa
  alternative: “itinakwil”
  rationale: Ang agarang konteksto ay ang kapakinabangan ng lupa. Gayunman, tunay na saklaw ng salita ang ideya ng pagtanggi, kaya pinananatili iyon bilang alternatibo nang hindi ipinipilit sa pangunahing teksto.
- issue: Kung dapat bang ipaliwanag ang εἰς καῦσιν bilang tiyak na huling kaparusahan
  choice: Panatilihin lamang ang larawang “ang kahihinatnan nito ay sunugin.”
  alternative: “ang kahihinatnan nito ay kaparusahan sa apoy”
  rationale: Hindi tahasang tinutukoy ng talata ang buong doktrinal na kahulugan ng apoy. Pinananatili ng salin ang larawang pang-agrikultura at ang teolohikal na bigat nito nang walang dagdag na pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “dawag” bilang karaniwang salitang pang-agrikultura at ang semicolon upang malinaw na iugnay ang pagsusuri sa lupa at ang kahihinatnan nito.
