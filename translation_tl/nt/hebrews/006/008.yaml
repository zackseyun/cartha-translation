  revision_rationale: Inayos ang dalawang pariralang nangangailangan ng higit na tumpak at natural na Filipino. Ang “malapit na sa sumpa” ay mas malapit sa κατάρας ἐγγύς at pinananatili ang di-tiyak na saklaw ng parirala. Ang “ang kahihinatnan nito ay ang pagsunog” ay wastong Filipino at tumutugon sa εἰς καῦσιν nang hindi nagdaragdag ng doktrinal na pagpapaliwanag.
