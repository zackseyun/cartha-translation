  text: βαπτισμῶν ⸀διδαχὴν ἐπιθέσεώς τε χειρῶν, ἀναστάσεώς ⸀τε νεκρῶν καὶ κρίματος αἰωνίου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/002.yaml
  text: instruction about washings[a], the laying on of hands, the resurrection of the dead, and eternal judgment.
translation:
  language: tl
  text: turo tungkol sa mga ritwal na paghuhugas[a], pagpapatong ng mga kamay, muling pagkabuhay ng mga patay, at walang-hanggang paghatol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga bautismo.” Ang pangmaramihang salitang Griyego ay maaari ring tumukoy nang mas malawak sa mga ritwal na paghuhugas, at hindi lamang sa bautismong Kristiyano.
    reason: lexical_alternative
lexical_decisions:
- source_word: βαπτισμῶν
  choice: mga ritwal na paghuhugas
  rationale: Ang pangmaramihang anyo ay maaaring tumukoy sa iba't ibang seremonyal na paghuhugas, hindi lamang sa bautismong Kristiyano. Nililinaw ng “ritwal” ang seremonyal na diwa nang hindi inaalis ang alternatibong “mga bautismo” sa talababa.
- source_word: διδαχὴν
  choice: turo
  rationale: Natural at malinaw sa modernong Tagalog bilang bahagi ng talaan ng mga saligang paksa; hindi ito kasingsidhi ng teknikal o eklesiyastikong “doktrina.”
- source_word: ἐπιθέσεώς τε χειρῶν
  choice: pagpapatong ng mga kamay
  rationale: Ito ang natural at kinikilalang katawagan sa gawaing tinutukoy ng pariralang Griyego.
- source_word: ἀναστάσεώς τε νεκρῶν
  choice: muling pagkabuhay ng mga patay
  rationale: Pinananatili nito ang kolektibong diwa ng νεκρῶν at gumagamit ng karaniwang ekspresyon sa Tagalog.
- source_word: κρίματος αἰωνίου
  choice: walang-hanggang paghatol
  rationale: Tumpak na pinananatili ang “paghatol,” sa halip na paliitin ito tungo sa “kaparusahan” o “kondemnasyon,” at ipinahahayag ang pangmatagalang diwa ng αἰωνίου.
- source_word: τε ... τε καὶ
  choice: …, …, at …
  rationale: Natural na koordinasyon sa Tagalog ang payak na talaang may kuwit at “at”; hindi kailangang tumbasan nang hiwalay ang bawat katagang pang-ugnay.
theological_decisions:
- issue: Kahulugan ng βαπτισμῶν sa talaan ng mga saligang turo
  choice: mga ritwal na paghuhugas
  alternative: mga bautismo
  rationale: Mas malawak ang maaaring saklaw ng pangmaramihang salitang Griyego kaysa sa bautismong Kristiyano. Iniiwasan nitong magpasok ng tiyak na sakramental o denominasyonal na pagbasa, habang pinananatili sa talababa ang tunay na alternatibo.
- issue: Saklaw ng κρίματος αἰωνίου
  choice: walang-hanggang paghatol
  alternative: walang-hanggang kaparusahan
  rationale: “Paghatol” ang sinasabi ng Griyego, hindi tahasang “kaparusahan.” Pinananatili ng salin ang lawak at teolohikal na tensiyon ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “turo” sa halip na mas teknikal na “doktrina,” at “mga ritwal na paghuhugas” upang natural na maipahayag ang posibleng mas malawak na saklaw ng βαπτισμῶν.
