source:
  edition: SBLGNT
  text: οὐ γὰρ ἄδικος ὁ θεὸς ἐπιλαθέσθαι τοῦ ἔργου ὑμῶν ⸀καὶ τῆς ἀγάπης ἧς ἐνεδείξασθε εἰς τὸ ὄνομα αὐτοῦ, διακονήσαντες τοῖς ἁγίοις καὶ διακονοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/010.yaml
  text: For God is not unjust so as to forget your work and the love that you showed for his name in having served the saints and in continuing to serve them[a][b][c].
translation:
  language: tl
  text: Sapagkat hindi makatarungan para sa Diyos na limutin ang inyong gawain at ang pag-ibig na ipinakita ninyo para sa kanyang pangalan[a] sa paglilingkod ninyo noon sa mga banal[b] at sa patuloy ninyong paglilingkod sa kanila.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “alang-alang sa kanyang pangalan.”
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, mga kapwa mananampalataya; ang “mga banal” dito ay tumutukoy sa banal na bayan ng Diyos, hindi sa isang uring kinanonisa bilang mga santo noong kalaunan.
    reason: cultural_note
  - marker: c
    text: O “sa paglilingkod ninyo sa mga banal at sa patuloy ninyong paglilingkod sa kanila.”
    reason: previous_rendering
lexical_decisions:
- source_word: ἄδικος
  choice: gagawa ng kawalang-katarungan
  rationale: Iniiwasan nito ang alanganing dobleng pagtanggi na “hindi di-makatarungan,” ngunit pinananatili ang tuwirang diwa na hindi kikilos ang Diyos nang salungat sa katarungan.
- source_word: ἐπιλαθέσθαι
  choice: sa paglimot
  rationale: Pinananatili ang pangunahing kahulugang “limutin,” kasama ang kontekstuwal na diwang hindi babalewalain ng Diyos ang kanilang ginawa.
- source_word: τοῦ ἔργου ὑμῶν
  choice: sa inyong ginawa
  rationale: Mas natural sa modernong Tagalog kaysa “sa inyong gawain” sa konstruksyong ito, at naihahayag ang kolektibong diwa ng ἔργον.
- source_word: τῆς ἀγάπης
  choice: sa pag-ibig
  rationale: Ang “pag-ibig” ang tuwiran, malinaw, at karaniwang katumbas ng ἀγάπη.
- source_word: ἐνεδείξασθε
  choice: ipinakita ninyo
  rationale: Likas na ipinahahayag ang pag-ibig na napatunayan sa kongkretong paglilingkod.
- source_word: εἰς τὸ ὄνομα αὐτοῦ
  choice: sa kanyang pangalan
  rationale: 'Pinananatili ang larawan at bahagyang lawak ng kahulugan ng εἰς: pag-ibig na nakatuon sa pangalan ng Diyos at ipinamalas alang-alang dito; inilalagay sa talababa ang mas hayag na alternatibo.'
- source_word: διακονήσαντες
  choice: nang paglingkuran ninyo
  rationale: Ipinakikita ang naganap nang paglilingkod na nagpahayag ng kanilang pag-ibig.
- source_word: τοῖς ἁγίοις
  choice: ang mga banal
  rationale: Pinananatili ang katawagang pambagong tipan para sa mga taong ibinukod para sa Diyos, nang hindi ito nililimitahan sa mas huling kategorya ng mga kinanonisang santo.
- source_word: διακονοῦντες
  choice: patuloy silang paglingkuran
  rationale: Ginagawang malinaw ang nagpapatuloy na aspekto ng kasalukuyang pandiwari at ang kaibahan nito sa naunang aorist participle.
theological_decisions:
- issue: Kung itinuturo ng talata ang merito sa harap ng Diyos o ang makatarungang pagkilala ng Diyos sa ginawa ng mga mananampalataya
  choice: Inilalahad na hindi kikilos ang Diyos nang walang katarungan sa pamamagitan ng paglimot sa kanilang ginawa at pag-ibig, nang hindi sinasabing kinikita ng mga gawang ito ang kaligtasan.
  alternative: Basahing may utang na gantimpala ang Diyos dahil sa merito ng mga gawa ng tao.
  rationale: Ang Griyego ay tahasang nag-uugnay sa katarungan ng Diyos at sa hindi niya paglimot, ngunit hindi nito sinasabing ang mga gawa ang batayan ng kaligtasan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “gagawa ng kawalang-katarungan” upang maging natural ang negatibong pahayag tungkol sa ἄδικος nang hindi pinapawi ang diin sa katarungan ng Diyos. Pinanatili ang “mga banal” bilang terminong biblikal, na may paliwanag sa talababa.
