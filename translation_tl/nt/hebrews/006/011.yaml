  text: ἐπιθυμοῦμεν δὲ ἕκαστον ὑμῶν τὴν αὐτὴν ἐνδείκνυσθαι σπουδὴν πρὸς τὴν πληροφορίαν τῆς ἐλπίδος ἄχρι τέλους,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/011.yaml
  text: And we desire each one of you to show the same diligence for the full assurance of hope until the end[b][a],
translation:
  language: tl
  text: At nais naming magpakita ang bawat isa sa inyo ng gayunding pagsisikap tungo sa ganap na katiyakan ng pag-asa hanggang sa wakas.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tungo sa lubos na pagtitiwala na kaugnay ng pag-asa.” Ang salitang Griyego ay maaaring tumukoy sa ganap na katiyakan o lubos na pagtitiwala.
    reason: lexical_alternative
  - marker: b
    text: O “hanggang sa katapusan.” Idinidiin ng parirala ang patuloy na pagtitiyaga hanggang sa ganap na hantungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθυμοῦμεν
  choice: nais namin
  rationale: Ipinahahayag nito ang taimtim na hangaring pastoral nang hindi nagiging labis na emosyonal o di-likas sa modernong Tagalog.
- source_word: δὲ
  choice: At
  rationale: Mahinang panandang transisyon ito mula sa naunang katiyakan tungo sa panibagong paghikayat; likas sa daloy ang “At.”
- source_word: ἕκαστον ὑμῶν
  choice: ang bawat isa sa inyo
  rationale: 'Pinananatili nito ang distributibong diin: ang paghikayat ay para sa bawat indibidwal sa buong pangkat.'
- source_word: τὴν αὐτὴν
  choice: gayunding
  rationale: Tumutukoy ito sa pagsisikap na naipakita na sa pag-ibig at paglilingkod sa naunang konteksto.
- source_word: ἐνδείκνυσθαι
  choice: magpakita
  rationale: Malinaw at natural na ipinapahayag ang pagpapamalas o pagpapatunay ng isang katangian.
- source_word: σπουδὴν
  choice: pagsisikap
  rationale: Ipinahahayag ang masigasig, seryoso, at patuloy na pagkilos; mas karaniwan ito sa modernong Tagalog kaysa “kasigasigan” sa konstruksyong ito.
- source_word: πρὸς
  choice: upang
  rationale: Ipinakikita rito ang layunin o tunguhin ng ipinapakitang pagsisikap.
- source_word: πληροφορίαν τῆς ἐλπίδος
  choice: lubos kayong makatiyak sa inyong pag-asa
  rationale: Natural na Tagalog na pinananatili ang diwa ng ganap na katiyakan kaugnay ng pag-asa, nang hindi ipinapasiya kung lubos itong pansariling katiyakan o katiyakang nakaugnay sa katuparan ng ipinangako.
- source_word: ἄχρι τέλους
  choice: hanggang sa wakas
  rationale: Pinananatili ang temporal na diwa ng pagpapatuloy at pagtitiyaga hanggang sa hantungan.
theological_decisions:
- issue: Ang kahulugan ng “ganap na katiyakan ng pag-asa” kaugnay ng pagtitiyaga
  choice: “upang lubos kayong makatiyak sa inyong pag-asa”
  alternative: “tungo sa ganap na katiyakan ng pag-asa” o “tungo sa lubos na katuparan ng pag-asa”
  rationale: Maaaring saklawin ng Griyego kapwa ang pansariling katiyakan at ang matatag na katiyakang kalakip ng pag-asang nakasalig sa pangako. Hindi nililimitahan ng salin ang parirala sa isang sistemang doktrinal.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “pagsisikap” para sa likas na daloy at ang pandiwang pariralang “lubos kayong makatiyak” upang maiwasan ang mabigat at di-likas na nominal na konstruksyon.
