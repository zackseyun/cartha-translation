translation:
  language: tl
  text: At gagawin natin ito[a], kung pahihintulutan nga ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “kung papayagan nga ng Diyos.” Ang salitang Griego na isinaling “nga” ay nagbibigay-diin sa kondisyon.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Likas na pang-ugnay ito sa naunang pahayag at pinananatili ang tuloy-tuloy na daloy ng pangangatwiran.
- source_word: τοῦτο
  choice: ito
  rationale: Isahang panghalip na pamatlig na tumutukoy sa binanggit na hakbang o gawain sa naunang talata.
- source_word: ποιήσομεν
  choice: gagawin natin
  rationale: Tuwirang inililipat ang future active indicative ng ποιέω at nananatiling malinaw at natural sa Filipino.
- source_word: ἐάνπερ
  choice: kung talagang
  rationale: Pinananatili ng “kung” ang tunay na kondisyon, habang ipinahahayag ng “talagang” ang bahagyang pagdiriin ng περ nang hindi pinalalabis ang pag-aalinlangan.
- source_word: ἐπιτρέπῃ
  choice: ipahihintulot
  rationale: Ang anyong panghinaharap ay natural kasunod ng “gagawin natin” at tumpak na naghahatid ng diwang ‘magpahintulot’ sa kondisyong sugnay.
- source_word: ὁ θεός
  choice: ang Diyos
  rationale: Karaniwang marangal at natural na pagtukoy sa Diyos bilang simuno sa Filipino.
theological_decisions:
- issue: Kondisyon hinggil sa pahintulot ng Diyos
  choice: Ipinahahayag ng may-akda ang balak na gawin ang binanggit, ngunit malinaw na inilalagay iyon sa ilalim ng pahintulot ng Diyos.
  alternative: “Kung loloobin ng Diyos,” o isang pagpapakahulugang deterministiko na nagsasaad nang higit sa mismong teksto.
  rationale: Pinananatili ng salin ang tunay at may-diin na kondisyon ng ἐάνπερ at hindi ito ginagawang karaniwang idyoma lamang o pinalalawak tungo sa isang partikular na doktrina tungkol sa pagkilos ng Diyos.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinili ang “ipahihintulot” upang tumugma sa solemneng himig, habang ang talababa ay nagbibigay ng mas pangkaraniwang alternatibong “papayagan.”
