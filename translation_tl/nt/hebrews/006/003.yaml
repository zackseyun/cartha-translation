  - severity: low
    issue: Ang “talagang” ay hindi ang pinakanatural na paraan upang ilipat ang diin ng ἐάνπερ.
    rationale: Maaaring unawain ang “talagang” bilang pagbibigay-katiyakan o pagiging totoo ng kilos. Ang enklitikong “nga” ay nagbibigay ng banayad na diin sa kondisyon nang mas malapit sa gamit ng περ.
