  text: For when God made the promise to Abraham[a], since he could swear by no one greater, he swore by himself[b],
translation:
  language: tl
  text: Sapagkat nang mangako ang Diyos kay Abraham[a], yamang wala siyang sinumang higit sa kanya na mapanunumpaan, nanumpa siya sa sarili niya[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nangako ang Diyos kay Abraham.”
    reason: lexical_alternative
  - marker: b
    text: O, “yamang wala siyang sinumang higit sa kanya na maaari niyang panumpaan.”
    reason: previous_rendering
lexical_decisions:
- source_word: ἐπαγγειλάμενος
  choice: nang mangako
  rationale: Likas at tuwirang ipinapahayag ng pandiwaring ito ang paggawa ng Diyos ng pangako, habang pinananatili ang ugnayang pangyayari sa pangunahing pandiwang “nanumpa.”
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikita nitong ang talata ay nagbibigay ng paliwanag o batayan sa naunang sinabi.
- source_word: ἐπεὶ
  choice: yamang
  rationale: Ipinahahayag dito ang dahilan kung bakit nanumpa ang Diyos sa sarili niya.
- source_word: κατ’ οὐδενὸς ... μείζονος
  choice: wala siyang sinumang higit sa kanya
  rationale: Sa konteksto ng panunumpa, ang tinutukoy ay isang persona o awtoridad na higit sa Diyos, kaya ang “sinuman” ang natural na salin.
- source_word: ὀμόσαι / ὤμοσεν
  choice: panumpaan / nanumpa
  rationale: Pinananatili ng magkaugnay na anyong ito ang pag-uulit ng salitang-ugat sa Griyego at malinaw na tumutukoy sa panunumpa.
- source_word: καθ’ ἑαυτοῦ
  choice: sa sarili niya
  rationale: Ito ang natural na ekspresyon sa Filipino para sa panunumpa ng Diyos na ang sariling persona at awtoridad ang pinagbabatayan ng sumpa.
- source_word: Τῷ ... Ἀβραὰμ
  choice: kay Abraham
  rationale: Minamarkahan ng datibo si Abraham bilang tumanggap ng pangako.
theological_decisions:
- issue: Ang likas na katangian ng panunumpa ng Diyos
  choice: Nanumpa ang Diyos sa sarili niya sapagkat wala siyang sinumang higit sa kanya na maaari niyang panumpaan.
  alternative: Palawakin ito bilang tahasang pormulasyon tungkol sa mga katangian o doktrina ng Diyos.
  rationale: Pinananatili ng salin ang pahayag ng teksto tungkol sa natatanging kadakilaan ng Diyos nang hindi nagdaragdag ng susunod na mga pormulasyong teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “yamang” upang mapanatili ang lohikal na dahilan, at ang “panumpaan” upang maipahayag ang idiomang panunumpa sa isang higit na awtoridad.
