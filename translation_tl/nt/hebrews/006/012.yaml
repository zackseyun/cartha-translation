id: HEB.6.12
reference: Hebrews 6:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἵνα μὴ νωθροὶ γένησθε, μιμηταὶ δὲ τῶν διὰ πίστεως καὶ μακροθυμίας κληρονομούντων τὰς ἐπαγγελίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/012.yaml
  text: so that you may not become sluggish[a], but imitators of those who through faith and patience inherit the promises.
translation:
  language: tl
  text: upang hindi kayo maging matamlay, kundi tularan ninyo ang mga nagmamana ng mga pangako sa pamamagitan ng pananampalataya[a] at pagtitiyaga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pananalig” o, sa ilang konteksto, “katapatan.” Maaaring taglayin ng salitang Griyego ang diwa ng pagtitiwala o pagiging tapat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μὴ
  choice: upang hindi
  rationale: Pinananatili nito ang layunin o resultang ipinahihiwatig ng ἵνα μή at likas na nag-uugnay sa naunang pangungusap.
- source_word: νωθροὶ
  choice: matamlay
  rationale: Ipinahihiwatig nito ang pagiging mabagal o kulang sa sigla at pagsisikap, nang hindi kasingmapanghusga ng “tamad” at hindi rin makaluma.
- source_word: γένησθε
  choice: maging
  rationale: 'Pinananatili ang ingresibong diwa ng γίνομαι: babala ito laban sa pagpasok sa kalagayan ng pagiging matamlay.'
- source_word: μιμηταὶ
  choice: tularan ninyo
  rationale: Ang pandiwang parirala ay natural sa modernong Tagalog at malinaw na naghahayag ng panawagang gawing huwaran ang iba, bagaman pangngalan ang anyo sa Griyego.
- source_word: διὰ πίστεως
  choice: sa pamamagitan ng pananampalataya
  rationale: Ang “pananampalataya” ang malawak at karaniwang katumbas ng πίστις; hindi nito nililimitahan ang salita sa pansariling tiwala lamang o sa katapatan lamang.
- source_word: μακροθυμίας
  choice: pagtitiyaga
  rationale: Likas itong nagpapahayag ng matiyagang pagpapatuloy sa mahabang panahon at angkop sa konteksto ng hindi panghihina.
- source_word: κληρονομούντων
  choice: nagmamana
  rationale: Pinananatili nito ang talinghaga ng pagtanggap bilang mana at ang kasalukuyang katangiang ipinahihiwatig ng participle.
- source_word: τὰς ἐπαγγελίας
  choice: mga pangako
  rationale: Pinananatili ang tahasang maramihang anyo at ang paulit-ulit na wika ng mga pangako ng Diyos sa Hebreo.
theological_decisions:
- issue: Saklaw ng kahulugan ng πίστις sa kontekstong nagpapayo
  choice: pananampalataya
  alternative: pananalig; katapatan
  rationale: Maaaring saklawin ng πίστις ang mapagtiwalang pananalig at, sa ilang konteksto, ang katapatan. Pinananatili ng “pananampalataya” ang lawak at karaniwang teolohikal na gamit ng salita nang hindi tahimik na nilulutas ang posibleng nuansa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang natural na pandiwang “tularan ninyo” sa halip na ang matigas na literal na “maging mga tagatulad,” habang pinananatili ang ugnayan ng pananampalataya, pagtitiyaga, at pagmamana sa mga pangako.
