  text: ⸀ἄνθρωποι γὰρ κατὰ τοῦ μείζονος ὀμνύουσιν, καὶ πάσης αὐτοῖς ἀντιλογίας πέρας εἰς βεβαίωσιν ὁ ὅρκος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/016.yaml
  text: For people swear by one greater than themselves[b][a], and for them an oath is the end of every dispute for confirmation.
translation:
  language: tl
  text: Sapagkat nanunumpa ang mga tao sa pamamagitan ng isang higit na dakila kaysa sa kanila, at para sa kanila, ang panunumpa ang wakas ng bawat pagtatalo bilang pagpapatibay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O kaya: “ang panunumpa ang katapusan ng bawat pagtutol o kontrobersiya bilang pagpapatibay.”'
    reason: Ang ἀντιλογία ay maaaring tumukoy sa pagtatalo, pagtutol, o kontrobersiya; pinananatili ng tala ang mga leksikal na posibilidad nang hindi binabago ang pangunahing salin.
lexical_decisions:
- source_word: ἄνθρωποι
  choice: mga tao
  rationale: Pangkalahatang tumutukoy ito sa mga tao, hindi lamang sa mga lalaki; natural at tumpak ang “mga tao” sa makabagong Filipino.
- source_word: κατὰ τοῦ μείζονος
  choice: sa isang higit sa kanila
  rationale: Sa pormula ng panunumpa, ang κατά na may genitive ay tumutukoy sa kinikilalang nakahihigit na awtoridad. Pinananatili ng “isang higit sa kanila” ang di-tiyak na referent at ang paghahambing.
- source_word: ὀμνύουσιν
  choice: nanunumpa
  rationale: Direkta at likas na salin ng pandiwang tumutukoy sa pagsumpa o panunumpa.
- source_word: πάσης ... ἀντιλογίας
  choice: bawat pagtatalo
  rationale: Sa konteksto, ang ἀντιλογία ay pagtutol o alitang kailangang pasiyahan, hindi lamang lohikal na pagsalungat.
- source_word: πέρας
  choice: nagwawakas
  rationale: Ipinahahayag sa natural na Filipino ang diwa ng πέρας bilang hangganan o pagtatapos ng pagtatalo.
- source_word: εἰς βεβαίωσιν
  choice: nagbibigay-katiyakan
  rationale: Inilalarawan ang tungkulin ng sumpa bilang pagpapatibay o pagkumpirma sa pinag-uusapan; natural itong nagpapahayag ng layon o bunga ng parirala.
- source_word: ὁ ὅρκος
  choice: ang sumpa
  rationale: Ang “sumpa” rito ay pangakong pinagtitibay sa panunumpa, hindi isang maldisyon. Ang tiyak na anyo ay angkop sa pangkalahatang pahayag sa Filipino.
theological_decisions:
- issue: Pangkalahatang pagtukoy sa sangkatauhan
  choice: mga tao
  alternative: mga lalaki
  rationale: Ang ἄνθρωποι ay generic at ang kasabihan ay tungkol sa karaniwang gawain ng tao, hindi partikular sa mga lalaki.
- issue: Papel ng sumpa sa pagtatalo
  choice: nagbibigay-katiyakan at nagwawakas sa bawat pagtatalo
  alternative: ang wakas ng bawat pagtatalo para sa pagpapatibay
  rationale: Pinananatili ang dalawang kaugnay na ideya—pagpapatibay at pagwawakas—nang hindi ipinapalagay na laging moral o teolohikal na tama ang lahat ng sumpa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sumpa” sa kahulugang taimtim na pangakong pinagtitibay sa panunumpa; nilinaw ng pandiwang “nanunumpa” ang kahulugan upang maiwasang unawain ito bilang maldisyon.
