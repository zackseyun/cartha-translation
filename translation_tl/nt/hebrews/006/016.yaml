- from: Sapagkat nanunumpa ang mga tao sa isang higit sa kanila, at ang sumpa ang nagbibigay-katiyakan at nagwawakas sa bawat pagtatalo.[a]
  to: Sapagkat nanunumpa ang mga tao sa pamamagitan ng isang higit na dakila kaysa sa kanila, at para sa kanila, ang panunumpa ang wakas ng bawat pagtatalo bilang pagpapatibay.[a]
  rationale: 'Inayos ang idiom ng panunumpa upang malinaw na ang isang nakahihigit ang awtoridad na pinanunumpaan, pinalitan ang posibleng malabong "sumpa" ng "panunumpa," at inilapit ang sintaks sa Griyegong pahayag: para sa mga tao, ang panunumpa ang wakas ng bawat pagtatalo bilang pagpapatibay. Walang idinagdag na tiyak na pagkakakilanlan sa "isang higit na dakila."'
