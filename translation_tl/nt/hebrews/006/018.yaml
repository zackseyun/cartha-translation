  to: upang sa pamamagitan ng dalawang bagay na hindi mababago, kung saan imposibleng magsinungaling ang Diyos, tayo na tumakas upang makahanap ng kanlungan[b] ay magkaroon ng matinding pampalakas-loob na panghawakan ang pag-asang inilagay sa harap natin.[a]
