  source_fidelity: 'Ang draft ay wastong naghahatid ng layuning ipinahihiwatig ng ἵνα, ng dalawang di-mababagong bagay, ng mariing pahayag na imposibleng magsinungaling ang Diyos, at ng mga larawang pagtakas tungo sa kanlungan at paghawak sa pag-asa. Gayunman, ang “na tungkol sa mga iyon” ay masyadong makitid para sa ἐν οἷς: maaaring unawain itong ‘tungkol sa’ dalawang bagay, samantalang ang Griyego ay nag-uugnay sa imposibilidad ng pagsisinungaling ng Diyos sa mga bagay na iyon. Ang “kung saan” ay mas malapit sa saklaw ng panghalip na pamatlig nang hindi nagdaragdag ng paliwanag.'
