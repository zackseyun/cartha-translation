  text: ἵνα διὰ δύο πραγμάτων ἀμεταθέτων, ἐν οἷς ἀδύνατον ψεύσασθαι ⸀θεόν, ἰσχυρὰν παράκλησιν ἔχωμεν οἱ καταφυγόντες κρατῆσαι τῆς προκειμένης ἐλπίδος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/018.yaml
  text: so that through two unchangeable things[a], in which it is impossible for God to lie[b], we who have fled for refuge might have strong encouragement to take hold of the hope set before us.
translation:
  language: tl
  text: upang sa pamamagitan ng dalawang bagay na hindi mababago, kung saan imposibleng magsinungaling ang Diyos, tayo na tumakas upang makahanap ng kanlungan[b] ay magkaroon ng matinding pampalakas-loob na panghawakan ang pag-asang inilagay sa harap natin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “mahigpit na panghawakan ang pag-asang inilagay sa harap natin.” Ang pandiwang Griyego ay maaaring mangahulugang “dakmain,” “hawakan,” o “hawakang mahigpit.”
    reason: lexical_alternative
  - marker: b
    text: Ang “tumakas upang makahanap ng kanlungan” ay malamang na pumupukaw sa larawan ng paghahanap ng ligtas na kanlungan, at posibleng nagpapaalala sa mga lungsod-kanlungan sa Lumang Tipan.
    reason: cross_reference
lexical_decisions:
- source_word: ἵνα
  choice: upang
  rationale: Natural na panandang Filipino para sa layunin o nilalayong bunga ng naunang pahayag.
- source_word: διὰ δύο πραγμάτων ἀμεταθέτων
  choice: sa pamamagitan ng dalawang bagay na hindi mababago
  rationale: Pinananatili ang malawak na kahulugan ng πράγματα at ang di-mababagong katangian ng dalawang bagay, na sa konteksto ay pangako at panunumpa ng Diyos.
- source_word: ἐν οἷς
  choice: na tungkol sa mga iyon
  rationale: Mas malinaw sa Filipino kaysa literal na 'na sa mga iyon,' habang pinananatili ang ugnayan sa dalawang bagay.
- source_word: ἀδύνατον ψεύσασθαι θεόν
  choice: imposibleng magsinungaling ang Diyos
  rationale: Pinananatili ang mariing pahayag ng Griyego tungkol sa imposibilidad, nang hindi dinaragdagan ng pilosopikal na paliwanag.
- source_word: ἰσχυρὰν παράκλησιν
  choice: matibay na pampalakas-loob
  rationale: Sinasaklaw ng παράκλησις dito ang pagbibigay-lakas at katiyakan; ang 'matibay' ay natural na katumbas ng ἰσχυράν sa kontekstong ito.
- source_word: ἔχωμεν
  choice: ay magkaroon
  rationale: Kasunod ng 'upang,' natural na ipinapahayag sa Filipino ang nilalayong bunga ng subjunctive.
- source_word: οἱ καταφυγόντες
  choice: tayong mga tumakas upang manganlong
  rationale: Pinananatili ang kilos ng pagtakas at ang layuning makahanap ng kanlungan, sa halip na gawing abstraktong 'sumilong' lamang.
- source_word: κρατῆσαι
  choice: panghawakan
  rationale: Natural sa Filipino at naipahihiwatig kapwa ang pag-abot at ang mahigpit na paghawak; hindi nito nililimitahan ang pandiwa sa isang sandaling pagsunggab lamang.
- source_word: τῆς προκειμένης ἐλπίδος
  choice: ang pag-asang inilagay sa harap natin
  rationale: Pinananatili ang larawang ang pag-asa ay iniharap o inilagay sa harap ng mga mananampalataya.
theological_decisions:
- issue: Larawan ng pagtakas tungo sa kanlungan at paghawak sa pag-asa
  choice: Pinanatili ang kongkretong pananalitang 'tumakas upang manganlong' at 'panghawakan ang pag-asa.'
  alternative: tayong mga nanganlong ay magkaroon ng matibay na lakas ng loob na manatili sa pag-asa
  rationale: Hindi pinapantay sa abstraktong katiyakan ang dalawang masiglang larawan ng orihinal; pinananatili rin ang posibleng alusyon sa paghahanap ng asylum o kanlungan.
- issue: Katapatan ng Diyos
  choice: imposibleng magsinungaling ang Diyos
  alternative: hindi maaaring magsinungaling ang Diyos
  rationale: Mas tuwirang tinutumbasan nito ang impersonal at mariing ἀδύνατον, nang walang idinaragdag na sistematikong paliwanag tungkol sa likas ng Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'pampalakas-loob' sa halip na mas arkaikong 'kaaliwan,' at pinanatili ang kongkretong talinghaga ng pagtakas, pagkakanlong, at paghawak.
