  terminology: Napanatili ang “Diyos,” “pag-asa,” at “kanlungan” sa malinaw at di-sektaryang gamit. Ang “panghawakan” ay isang angkop na salin ng κρατῆσαι sa kontekstong ito. Ang mga panandang talababa ay wastong nakakabit sa kaugnay na mga parirala.
