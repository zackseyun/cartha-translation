id: HEB.6.4
reference: Hebrews 6:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἀδύνατον γὰρ τοὺς ἅπαξ φωτισθέντας γευσαμένους τε τῆς δωρεᾶς τῆς ἐπουρανίου καὶ μετόχους γενηθέντας πνεύματος ἁγίου
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/004.yaml
  text: For it is impossible[a], in the case of those who were once enlightened, and who tasted the heavenly gift, and became partakers of the Holy Spirit[c][b],
translation:
  language: tl
  text: Sapagkat, para sa mga minsang naliwanagan[a], nakatikim[b] ng makalangit na kaloob, at naging mga kabahagi ng Banal na Espiritu[c], imposible...
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “naliwanagan” ay maaaring tumukoy sa malawak na diwa ng pagtanggap ng espirituwal na liwanag o turo; ipinapakahulugan naman ito ng ilan bilang pagbabalik-loob o bilang kaliwanagang kaugnay ng bautismo.
    reason: alternative_reading
  - marker: b
    text: O “nakaranas.” Literal na “nakatikim” ang pandiwa, ngunit maaari itong tumukoy sa tunay na karanasan at hindi lamang sa bahagyang pagsubok.
    reason: lexical_alternative
  - marker: c
    text: O “nakibahagi sa Banal na Espiritu” o “naging mga kalahok sa Banal na Espiritu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδύνατον γὰρ
  choice: Sapagkat imposibleng
  rationale: Pinananatili ng “imposible” ang mariing panaguring nasa unahan ng Griyego, at likas na ipinahahayag ng “sapagkat” ang paliwanag na kaugnayan nito sa naunang pahayag.
- source_word: ἅπαξ φωτισθέντας
  choice: ang mga minsang naliwanagan
  rationale: Inilalarawan nito ang isang naganap nang karanasan ng pagtanggap ng espirituwal na liwanag, nang hindi nililimitahan ang kahulugan sa pagbabalik-loob o bautismo.
- source_word: γευσαμένους
  choice: nakatikim
  rationale: Pinananatili ang konkretong talinghaga ng Griyego. Maaari itong tumukoy sa tunay na pagdanas, kaya hindi ito pinalalabnaw bilang bahagya o mababaw na pagsubok lamang.
- source_word: τῆς δωρεᾶς τῆς ἐπουρανίου
  choice: ng kaloob na makalangit
  rationale: Natural at tuwirang katumbas ito na hindi nagpapasya kung ano mismo ang tinutukoy na kaloob.
- source_word: μετόχους γενηθέντας πνεύματος ἁγίου
  choice: naging mga kabahagi ng Banal na Espiritu
  rationale: Ipinahahayag ng “naging” ang pagpasok sa isang kalagayan, samantalang pinananatili ng “mga kabahagi” ang matibay ngunit hindi doktrinal na nililimitahang diwa ng pakikibahagi.
theological_decisions:
- issue: Kung ang φωτισθέντας ay espesipikong tumutukoy sa pagbabalik-loob o sa bautismo
  choice: minsang naliwanagan
  alternative: minsang nagbalik-loob; minsang nabautismuhan
  rationale: Metapora ng kaliwanagan ang ginamit ng Griyego at hindi nito tahasang tinutukoy ang pagbabalik-loob o bautismo. Pinananatili ng salin ang lawak at tensiyong teolohikal ng teksto.
- issue: Kung ang γευσαμένους ay nangangahulugan ng bahagyang pagtikim o ganap na karanasan
  choice: nakatikim
  alternative: nakaranas
  rationale: Maaaring magpahiwatig ang pandiwa ng tunay na karanasan, ngunit hindi malinaw sa salita lamang ang lawak nito. Hindi dapat pasyahan ng salin ang usapin tungkol sa pagtalikod at pananatili sa pananampalataya.
- issue: Kung ang pakikibahagi sa Banal na Espiritu ay dapat ipakahulugang ganap na nananahang pagliligtas o mas maluwag na pakikilahok
  choice: naging mga kabahagi ng Banal na Espiritu
  alternative: nakibahagi sa Banal na Espiritu; naging mga kalahok sa Banal na Espiritu
  rationale: Tuwirang isinasalin ang matibay na pananalita ng Griyego nang hindi ipinapasok ang isang natatanging doktrina tungkol sa kaligtasan o pagtalikod.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mahabang participial chain at ang kuwit sa hulihan dahil nagpapatuloy ang pangungusap sa kasunod na mga talata. Ginamit ang “mga kabahagi” sa halip na mas arkaikong “mga kasalo” upang maging natural ngunit mapanatili ang bigat ng pahayag.
