  rationale: Inayos ang ayos ng salita upang maging gramatikal at natural ang Filipino habang pinananatili ang nakabiting sintaks ng Griyego, na kinukumpleto lamang sa kasunod na talata. Pinalitan ang ‘kaloob na makalangit’ ng mas likas na ‘makalangit na kaloob’ nang walang pagbabago sa kahulugan. Idinagdag ang ellipsis upang malinaw na ang ‘imposible’ ay sinasadyang hinihintay ang kasunod na pandiwa sa pagpapatuloy ng pangungusap.
