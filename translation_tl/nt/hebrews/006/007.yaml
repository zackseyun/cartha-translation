  text: γῆ γὰρ ἡ πιοῦσα τὸν ἐπ’ αὐτῆς ⸂ἐρχόμενον πολλάκις⸃ ὑετόν, καὶ τίκτουσα βοτάνην εὔθετον ἐκείνοις δι’ οὓς καὶ γεωργεῖται, μεταλαμβάνει εὐλογίας ἀπὸ τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/007.yaml
  text: For land that drinks the rain that often comes upon it and produces vegetation useful to those for whose sake it is also cultivated receives blessing from God[a][b].
translation:
  language: tl
  text: Sapagkat ang lupang umiinom ng ulang madalas na bumabagsak dito at nagpapatubo ng mga halamang kapaki-pakinabang sa mga taong dahil sa kanila ay nililinang din ito ay tumatanggap ng pagpapala mula sa Diyos.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga halaman,” “halamang-luntian,” o “mga pananim” sa halip na “mga halamang.”
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring “sa mga taong naglilinang nito,” bagaman ang διά na may accusative ay mas karaniwang nagpapahiwatig ng dahilan o layunin: “sa mga taong dahil sa kanila ay nililinang din ito.”'
    reason: alternative_reading
lexical_decisions:
- source_word: γῆ
  choice: lupa
  rationale: Sa larawang pang-agrikultura, ang “lupa” ay likas at malawak na tumutukoy sa lupang nililinang, nang hindi nagiging kosmiko gaya ng “daigdig.”
- source_word: πιοῦσα
  choice: umiinom
  rationale: Pinananatili nito ang matingkad na pagsasatao sa lupa, sa halip na pahinain ang larawan sa “sumisipsip.”
- source_word: τὸν ἐπ’ αὐτῆς ἐρχόμενον πολλάκις ὑετόν
  choice: sa ulang madalas na bumabagsak dito
  rationale: Natural itong Tagalog na nagpapanatili sa dalas ng πολλάκις at sa pagdating ng ulan sa ibabaw ng lupa.
- source_word: τίκτουσα
  choice: nagpapatubo
  rationale: Sa kontekstong pang-agrikultura, malinaw at likas itong nagsasaad na ang lupa ay nagbubunga ng halamang tumutubo.
- source_word: βοτάνην
  choice: mga halaman
  rationale: Ang “mga halaman” ay madaling maunawaan at sapat ang lawak para sa plant growth o herbage, nang hindi nililimitahan sa isang tiyak na pananim.
- source_word: εὔθετον
  choice: kapaki-pakinabang
  rationale: Ipinapahayag nito ang praktikal na pagiging angkop o gamit ng halaman sa kontekstong pang-agrikultura.
- source_word: ἐκείνοις δι’ οὓς καὶ γεωργεῖται
  choice: sa mga taong siyang dahilan kung bakit ito nililinang
  rationale: Pinananatili nito ang pinakalikás na diwa ng διά na may accusative bilang dahilan o layunin—ang lupa ay nililinang alang-alang sa kanila—nang hindi ipinapalagay na sila mismo ang naglilinang.
- source_word: γεωργεῖται
  choice: nililinang
  rationale: Malawak at dignified itong katawagan sa pagtatrabaho o pag-aalaga sa lupang pansaka.
- source_word: μεταλαμβάνει
  choice: tumatanggap
  rationale: Malinaw at natural nitong ipinapahayag ang pagtamo ng pagpapala, habang hindi pinalalabis ang kahulugang “nakikibahagi.”
- source_word: εὐλογίας ἀπὸ τοῦ θεοῦ
  choice: pagpapala mula sa Diyos
  rationale: Direkta nitong pinananatili ang pinagmulan ng pagpapala at hindi ipinipilit ang di-tiyak na pantukoy na wala sa Griyego.
theological_decisions:
- issue: Ang talinghagang pang-agrikultura sa konteksto ng babala
  choice: Panatilihin nang tuwiran ang positibong larawan ng lupang mabunga at pinagpapala.
  alternative: Ipahiwatig sa salin ang isang tiyak na doktrina tungkol sa tunay o huwad na mananampalataya, pagtitiyaga, o pagtalikod.
  rationale: Ang mismong talata ay naglalahad ng positibong bahagi ng paghahambing. Hindi dapat ipasok ng salin ang isang pinagtatalunang sistematikong konklusyon na hindi tahasang sinasabi ng Griyego.
- issue: Ambiguwidad ng δι’ οὓς
  choice: “siyang dahilan kung bakit ito nililinang,” na nagpapahiwatig ng dahilan o layunin
  alternative: “ng mga taong naglilinang dito,” na itinuturing ang parirala bilang tagaganap
  rationale: Ang διά na sinusundan ng accusative ay karaniwang nagsasaad ng dahilan o layunin; gayunman, inilalagay sa talababa ang tradisyonal na alternatibong pagkaunawa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang pagsasatao sa lupang “umiinom” ng ulan at ang pang-agrikulturang talinghaga, habang iniwasan ang sobrang teknikal o makalumang pananalita.
