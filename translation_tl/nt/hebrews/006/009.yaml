id: HEB.6.9
reference: Hebrews 6:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Πεπείσμεθα δὲ περὶ ὑμῶν, ἀγαπητοί, τὰ κρείσσονα καὶ ἐχόμενα σωτηρίας, εἰ καὶ οὕτως λαλοῦμεν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/009.yaml
  text: But we are convinced of better things concerning you[a], beloved—things that belong to salvation—even though we speak in this way.
translation:
  language: tl
  text: Ngunit tungkol sa inyo, mga minamahal, kumbinsido kaming may mas mabubuting bagay—mga bagay na kaugnay ng kaligtasan[a]—kahit ganito kami magsalita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga bagay na kaakibat ng kaligtasan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πεπείσμεθα
  choice: kumbinsido kami
  rationale: Ipinahahayag ng perpektong panahunan ang isang matatag at nagpapatuloy na katiyakan; natural sa modernong Filipino ang “kumbinsido kami.”
- source_word: δὲ
  choice: Ngunit
  rationale: Malinaw nitong ipinakikita ang paglipat mula sa matinding babala sa mga naunang talata tungo sa positibong pagtitiwala sa mga mambabasa.
- source_word: περὶ ὑμῶν
  choice: tungkol sa inyo
  rationale: Tuwirang katumbas ng περί na may genitive at natural sa Filipino.
- source_word: ἀγαπητοί
  choice: mga minamahal
  rationale: Pinananatili ang mapagmahal at marangal na tono ng bokatibo nang hindi nagiging labis na kolokyal.
- source_word: τὰ κρείσσονα
  choice: mas mabubuting bagay
  rationale: Pinananatili ang pahambing na diwa ng substantibong pang-uri at malinaw itong nauunawaan sa Filipino.
- source_word: ἐχόμενα σωτηρίας
  choice: mga bagay na kaugnay ng kaligtasan
  rationale: Sinasalamin nito ang malawak na ugnayang ipinahihiwatig ng participle at genitive nang hindi tinutukoy kung ang mga bagay ay katibayan, kaakibat, o bunga ng kaligtasan.
- source_word: εἰ καὶ
  choice: kahit
  rationale: Natural na ipinahahayag ang konsesibong diwa sa sugnay.
- source_word: οὕτως
  choice: ganito
  rationale: Tumutukoy sa matindi at mapagbababalang paraan o nilalaman ng naunang pananalita.
- source_word: λαλοῦμεν
  choice: kami magsalita
  rationale: Simple at natural na salin ng kasalukuyang pandiwa na nagpapanatili sa unang panauhang maramihan.
theological_decisions:
- issue: Ugnayan ng ἐχόμενα sa σωτηρίας sa konteksto ng babala
  choice: mga bagay na kaugnay ng kaligtasan
  alternative: mga bagay na kaakibat ng kaligtasan
  rationale: Hindi nililinaw ng Griyego kung ang mga ito ay mga katibayan, kaakibat, epekto, o ibang uri ng mga realidad na nauugnay sa kaligtasan. Pinananatili ng pangunahing salin ang lawak at teolohikal na tensiyon ng pahayag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mga minamahal” upang mapanatili ang init ng pagtawag, at ang mga gitling upang malinaw na ibukod ang paliwanag tungkol sa “mas mabubuting bagay.”
