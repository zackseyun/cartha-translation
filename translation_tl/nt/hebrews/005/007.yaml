source:
  edition: SBLGNT
  text: ὃς ἐν ταῖς ἡμέραις τῆς σαρκὸς αὐτοῦ δεήσεις τε καὶ ἱκετηρίας πρὸς τὸν δυνάμενον σῴζειν αὐτὸν ἐκ θανάτου μετὰ κραυγῆς ἰσχυρᾶς καὶ δακρύων προσενέγκας καὶ εἰσακουσθεὶς ἀπὸ τῆς εὐλαβείας,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/007.yaml
  text: who[a], in the days of his flesh, having offered up both prayers and petitions with loud cries and tears to the one able to save him from death, and having been heard because of his reverence[b],
translation:
  language: tl
  text: na, sa mga araw ng kanyang buhay sa laman, ay naghandog ng mga panalangin at pagsusumamo, na may malalakas na daing at mga luha, sa kanya na may kapangyarihang magligtas sa kanya mula sa kamatayan[b]. At dininig siya dahil sa kanyang pagpipitagan[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dahil sa kanyang banal na pagkatakot.”
    reason: lexical_alternative
  - marker: b
    text: Ang “magligtas sa kanya mula sa kamatayan” ay maaari ring unawain bilang pagliligtas sa kanya mula sa kamatayan matapos siyang mamatay, ibig sabihin, sa pamamagitan ng muling pagkabuhay.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις τῆς σαρκὸς αὐτοῦ
  choice: noong nabubuhay pa siya sa laman
  rationale: Pinananatili ang kongkretong salitang σάρξ bilang “laman,” habang ipinahahayag sa likas na Tagalog na tumutukoy ito sa panahon ng kanyang buhay bilang tao.
- source_word: δεήσεις τε καὶ ἱκετηρίας
  choice: mga panalangin at pagsusumamo
  rationale: Ang “mga panalangin” ay malinaw at pangkaraniwan, samantalang ang “pagsusumamo” ay naghahayag ng taimtim at apurahang pakiusap at nagpapanatili ng pagkakaiba ng dalawang salitang Griyego.
- source_word: πρὸς τὸν δυνάμενον σῴζειν αὐτὸν ἐκ θανάτου
  choice: sa may kapangyarihang magligtas sa kanya mula sa kamatayan
  rationale: Ang “may kapangyarihan” ay natural na katumbas ng substantival participle. Hindi nililinaw nang labis ng “mula sa kamatayan” kung ito ay pag-iwas sa pagkamatay o pagliligtas palabas sa kamatayan sa pamamagitan ng muling pagkabuhay.
- source_word: μετὰ κραυγῆς ἰσχυρᾶς καὶ δακρύων
  choice: na may malalakas na daing at mga luha
  rationale: Ipinahahayag nito ang tindi at lakas ng κραυγή sa natural na modernong Tagalog; ang “daing” ay angkop sa konteksto ng taimtim na panalangin.
- source_word: προσενέγκας
  choice: naghandog siya
  rationale: Pinananatili ng “naghandog” ang posibleng sakripisyal na himig ng προσφέρω na mahalaga sa kontekstong makasaserdote ng Hebreo, nang hindi ito labis na binibigyang-kahulugan.
- source_word: εἰσακουσθεὶς
  choice: dininig siya
  rationale: Ang “dininig” ay nagpapahiwatig na pinakinggan nang may pagsang-ayon ang kanyang panalangin, ngunit hindi itinatakda ang eksaktong paraan ng sagot.
- source_word: ἀπὸ τῆς εὐλαβείας
  choice: dahil sa kanyang pagpipitagan
  rationale: Malapit ito sa kahulugan ng εὐλάβεια bilang pagpipitagan o banal na pagkatakot, at iniiwasan ang interpretibong pagdaragdag ng “pagpapasakop.”
theological_decisions:
- issue: Kahulugan ng ἀπὸ τῆς εὐλαβείας kaugnay ni Jesus
  choice: dahil sa kanyang pagpipitagan
  alternative: dahil sa kanyang banal na pagkatakot
  rationale: Pinananatili ng pangunahing salin ang paggalang at banal na pagpipitagan ni Jesus nang hindi ipinahihiwatig ang makasalanang takot o idinaragdag ang konsepto ng pagpapasakop na hindi tahasang nasa salita. Ang leksikal na alternatibo ay nasa talababa.
- issue: Saklaw ng “magligtas sa kanya mula sa kamatayan”
  choice: hindi tukuyin kung pag-iwas sa pagkamatay o pagliligtas sa pamamagitan ng muling pagkabuhay
  alternative: magligtas sa kanya palabas sa kamatayan
  rationale: Maaaring dalhin ng ἐκ θανάτου ang alinmang diwa. Pinananatili ng salin ang tunay na kalabuan at hindi ipinipilit ang isang teolohikal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Napanatili ang “laman” at “naghandog” dahil mahalaga ang kanilang kongkreto at makasaserdoteng himig. Inayos ang mga marker upang ang [a] ay tumukoy sa pagpipitagan at ang [b] sa pariralang tungkol sa kamatayan, alinsunod sa nilalaman ng bawat talababa.
