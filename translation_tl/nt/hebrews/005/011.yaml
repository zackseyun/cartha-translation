id: HEB.5.11
reference: Hebrews 5:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Περὶ οὗ πολὺς ἡμῖν ὁ λόγος καὶ δυσερμήνευτος λέγειν, ἐπεὶ νωθροὶ γεγόνατε ταῖς ἀκοαῖς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/011.yaml
  text: About this we have much to say[a], and it is hard to explain[c][b], since you have become dull in hearing.
translation:
  language: tl
  text: Marami kaming sasabihin tungkol dito[a], at mahirap itong ipaliwanag[b], sapagkat naging matamlay kayo sa pakikinig[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tungkol sa kanya.” Maaaring tumukoy ang panghalip sa Griyego kay Melquisedec, bagaman malamang na tumutukoy ito rito sa mas malawak na paksang tinatalakay.
    reason: alternative_reading
  - marker: b
    text: O “mahirap bigyang-kahulugan” o “mahirap ilahad.”
    reason: lexical_alternative
  - marker: c
    text: O “naging mabagal kayo sa pakikinig.” Ang parirala ay tumutukoy sa pagiging mabagal o hindi tumutugon sa pagtanggap ng turo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ οὗ
  choice: tungkol dito
  rationale: Natural itong tumutukoy sa paksang tinatalakay, habang pinananatili sa talababa ang posibleng personal na pagtukoy kay Melquisedec.
- source_word: πολὺς ἡμῖν ὁ λόγος
  choice: marami kaming sasabihin
  rationale: Idyomatikong Filipino ito para sa literal na diwang marami o mahaba ang talakay na nais iharap ng may-akda.
- source_word: δυσερμήνευτος λέγειν
  choice: mahirap itong ipaliwanag
  rationale: Ipinapakita ng parirala ang hirap ng pagpapahayag o paglalahad sa iba, hindi lamang ang pribadong pagbibigay-kahulugan.
- source_word: ἐπεὶ
  choice: sapagkat
  rationale: Malinaw nitong ipinahahayag na ang kalagayan ng mga tagapakinig ang dahilan kung bakit mahirap ilahad ang paksa.
- source_word: νωθροὶ γεγόνατε
  choice: naging matamlay kayo
  rationale: Pinananatili ng “naging” ang pagdating sa isang kasalukuyang kalagayan, at ipinahahayag ng “matamlay” ang kawalan ng sigla o pagtugon nang hindi agad tinatawag silang tamad.
- source_word: ταῖς ἀκοαῖς
  choice: sa pakikinig
  rationale: Pinananatili nito ang metapora ng pandinig ngunit mas malinaw kaysa “sa pandinig” na ang tinutukoy ay pagtanggap sa itinuturo, hindi kapansanan sa tainga.
theological_decisions:
- issue: Tinutukoy ng Περὶ οὗ
  choice: Pangunahing tumutukoy sa paksang kasalukuyang tinatalakay.
  alternative: 'Maaaring personal na tumukoy kay Melquisedec: “tungkol sa kanya.”'
  rationale: Posible sa balarila ang personal na pagtukoy dahil kababanggit lamang kay Melquisedec, ngunit mas natural sa daloy na ipakilala rito ang mas malawak na paksang ilalahad. Inilalagay sa talababa ang alternatibo upang hindi isara ang tunay na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang metapora ng pakikinig at ang perpektong aspekto ng γεγόνατε sa “naging,” habang iniwasan ang pananalitang maaaring mapagkamalang pisikal na kapansanan sa pandinig.
