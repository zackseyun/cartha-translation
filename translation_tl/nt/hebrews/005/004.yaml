  text: καὶ οὐχ ἑαυτῷ τις λαμβάνει τὴν τιμήν, ἀλλὰ καλούμενος ὑπὸ τοῦ θεοῦ, ⸀καθώσπερ καὶ Ἀαρών.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/004.yaml
  text: And no one takes this honor for himself[a], but is called by God, just as Aaron also was.
translation:
  language: tl
  text: Hindi inaangkin ng sinuman ang karangalang ito[a] para sa sarili; sa halip, tinatawag siya ng Diyos, gaya rin ni Aaron.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang karangalan.” Sa Griyego, “ang karangalan” lamang ang nakasaad; sa konteksto, tumutukoy ito sa dangal o katungkulan ng pagkapari.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ... τις
  choice: Hindi ... ng sinuman
  rationale: 'Likas na ipinahahayag sa Filipino ang negated indefinite bilang pangkalahatang pagtanggi: walang sinuman ang gumagawa nito.'
- source_word: ἑαυτῷ ... λαμβάνει
  choice: inaangkin ... para sa sarili
  rationale: Ipinakikita ng reflexive dative ang sariling pagkuha o pag-aangkin. Mas natural sa Filipino ang “inaangkin para sa sarili” kaysa literal na “kinukuha sa sarili,” at pinananatili nito ang kaibahan sa pagtawag ng Diyos.
- source_word: τὴν τιμήν
  choice: ang karangalang ito
  rationale: Ang τιμή ay tuwirang “karangalan,” at ang “ito” ay malinaw na tumutukoy sa karangalan ng pagkapangunahing pari sa agarang konteksto nang hindi pinapalitan ang salita ng “tungkulin.”
- source_word: ἀλλὰ καλούμενος ὑπὸ τοῦ θεοῦ
  choice: sa halip, tinatawag siya ng Diyos
  rationale: Pinananatili ang matinding pagsalungat at ang Diyos bilang gumaganap ng pagtawag. Isinasaad sa likas na pangungusap na Filipino ang ipinahihiwatig na sugnay ng Greek participle.
- source_word: καθώσπερ καὶ Ἀαρών
  choice: gaya rin ng pagtawag kay Aaron
  rationale: 'Nililinaw sa Filipino ang elipsis: si Aaron din ay tinawag ng Diyos. Hindi nito dinaragdagan ang diwa kundi tinutukoy lamang ang ipinahihiwatig na kilos.'
theological_decisions:
- issue: Kalikasan ng pagkatalaga sa pagkapari
  choice: Ang karangalang tinutukoy ay hindi inaangkin ng tao para sa sarili kundi kaugnay ng pagtawag ng Diyos, na ipinakita kay Aaron.
  alternative: Maaaring unawain ang “karangalan” bilang pangkalahatang karangalan, hindi partikular na karangalan ng pagkapari.
  rationale: Ang Hebreo 5:1–5 ay tahasang tumatalakay sa punong pari. Gayunman, nananatili sa salin ang pangkalahatang salitang “karangalan” sa halip na paliitin ito bilang “katungkulan,” kaya napapanatili ang mismong pananalita at saklaw ng Greek.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “inaangkin” upang likas na maipahayag ang sariling pagkuha ng karangalan, at ang “gaya rin ng pagtawag kay Aaron” upang maging malinaw ang elipsis ng Greek nang hindi nagdaragdag ng doktrinal na paliwanag.
