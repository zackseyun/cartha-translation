id: HEB.5.5
reference: Hebrews 5:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Οὕτως καὶ ὁ Χριστὸς οὐχ ἑαυτὸν ἐδόξασεν γενηθῆναι ἀρχιερέα, ἀλλ’ ὁ λαλήσας πρὸς αὐτόν· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/005.yaml
  text: 'So also the Messiah did not glorify himself to become high priest[a], but the one who spoke to him: “You are my Son[c][b]; today I have begotten you.”'
translation:
  language: tl
  text: 'Gayundin, hindi niluwalhati[b] ng Mesiyas[a] ang kanyang sarili upang maging punong pari, kundi ang nagsalita sa kanya ang nagluwalhati sa kanya:


    “Ikaw ang aking Anak;

    ngayon ay ipinanganak kita.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Cristo.” Ginamit dito ang salitang Griyego na Χριστός bilang titulo.
    reason: alternative_reading
  - marker: b
    text: O “pinarangalan.” Maaaring mangahulugan ang pandiwang Griyego ng pagluwalhati o pagpaparangal.
    reason: lexical_alternative
  - marker: c
    text: Sipi mula sa Awit 2:7.
    reason: cross_reference
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: Gayundin
  rationale: Likas at maikli itong naghahayag ng paghahambing sa naunang sinabi tungkol sa pagkahirang sa pagkapari.
- source_word: ὁ Χριστὸς
  choice: ang Mesiyas
  rationale: Ginagamit dito ang Χριστός bilang titulo sa konteksto ng banal na pagkahirang, kaya mas malinaw ang “Mesiyas” kaysa sa pangalang “Cristo.”
- source_word: οὐχ ἑαυτὸν ἐδόξασεν
  choice: hindi niluwalhati ... ang kanyang sarili
  rationale: Pinananatili nito ang reflexive na anyo at ang pangunahing diwa ng δοξάζω bilang pagluwalhati o pagpaparangal.
- source_word: γενηθῆναι ἀρχιερέα
  choice: upang maging pinakapunong pari
  rationale: Ipinahihiwatig ng γενηθῆναι ang pagpasok sa isang katungkulan. Ang “pinakapunong pari” ay malinaw at karaniwang katawagan sa modernong Filipino.
- source_word: ἀλλ’ ὁ λαλήσας πρὸς αὐτόν
  choice: Sa halip, ang lumuwalhati sa kanya ay ang nagsabi sa kanya
  rationale: 'Likas na nililinaw sa Filipino ang elipsis ng Griyego: ang Diyos, na nagsalita sa kanya, ang nagbigay ng karangalan. Hindi pinapangalanan ang Diyos, gaya rin ng pinagmulan.'
- source_word: Υἱός μου εἶ σύ
  choice: Ikaw ang aking Anak
  rationale: Pinananatili ang tuwirang pahayag at ang diin sa “Ikaw,” sa natural na ayos ng Filipino.
- source_word: ἐγὼ σήμερον γεγέννηκά σε
  choice: ngayon ay ipinanganak kita
  rationale: Tuwirang pinananatili ang larawan ng γεννάω at ang pormal na pananalita ng sipi, nang hindi ito ipinapakahulugan bilang partikular na pangyayaring teolohikal.
theological_decisions:
- issue: Pagkakasalin ng Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Titulo ang gamit sa argumento tungkol sa pagkahirang sa katungkulan; ipinakikita ng “Mesiyas” ang kahulugan nito nang hindi nagdaragdag ng doktrinal na paliwanag.
- issue: Kahulugan ng “ngayon ay ipinanganak kita” sa kontekstong tumutukoy sa Mesiyas
  choice: Panatilihin nang tuwiran ang sipi
  alternative: Ipaliwanag ito bilang pagluklok, muling pagkabuhay, o walang-hanggang pagkakapanganak
  rationale: Hindi tahasang nilulutas ng talata kung anong pangyayari ang tinutukoy ng sipi. Pinananatili ng salin ang teolohikal na tensiyon at hindi ipinapasok sa pangunahing teksto ang isang partikular na interpretasyon.
- issue: Nakatagong sugnay pagkatapos ng ἀλλά
  choice: Linawin na ang nagsalita ang lumuwalhati sa Mesiyas
  alternative: Panatilihin ang literal ngunit bitin na “kundi ang nagsabi sa kanya”
  rationale: Nauunawaan mula sa paghahambing ang nawawalang pandiwa. Kailangan itong ilantad sa Filipino upang maging buo at natural ang pangungusap, nang hindi binabago ang ipinahihiwatig ng Griyego.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “pinakapunong pari” bilang malinaw na katawagan sa ἀρχιερεύς. Inayos ang sipi bilang tula upang makita ang dalawang magkatapat na linya, at iniwasan ang anumang paliwanag na magpapasya sa pinagtatalunang teolohikal na kahulugan ng “ngayon.”
