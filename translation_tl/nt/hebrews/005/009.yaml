  text: and[a], having been made perfect, he became the source of eternal salvation to all who obey him[b],
translation:
  language: tl
  text: At, matapos siyang dalhin sa ganap na katuparan[a], siya ay naging pinagmumulan ng walang-hanggang kaligtasan para sa lahat ng tumatalima sa kanya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nang siya'y gawing ganap” o “nang siya'y ganapin.” Malamang na tumutukoy ang Griyego sa pagdadala sa ganap na katuparan ng kanyang tungkulin bilang saserdote at ng kanyang gawain ng pagtubos, hindi sa pagbuti mula sa kapintasang moral.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sumusunod sa kanya.” Ang salitang Griyego ay tumutukoy sa pakikinig na may masunuring pagtugon.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Likas na nag-uugnay sa naunang pahayag nang hindi dinaragdagan ang lohikal na relasyon.
- source_word: τελειωθεὶς
  choice: nang lubos na siyang maihanda
  rationale: Ipinahahayag ang pagdadala kay Jesus sa ganap na katuparan at kahandaan para sa kanyang tungkuling saserdote at gawain ng pagtubos, hindi ang pagwawasto sa isang dating kapintasang moral.
- source_word: ἐγένετο
  choice: siya ang naging
  rationale: Tuwirang ipinahahayag ang kalagayan o tungkuling ibinunga ng naunang kilos.
- source_word: πᾶσιν τοῖς ὑπακούουσιν αὐτῷ
  choice: para sa lahat ng sumusunod sa kanya
  rationale: Sa makabagong Tagalog, ang 'sumusunod sa kanya' ay likas na naghahatid ng patuloy at masunuring pagtugon na ipinahihiwatig ng ὑπακούω, nang hindi ito nililimitahan sa pakikinig lamang.
- source_word: αἴτιος
  choice: pinagmumulan
  rationale: Malinaw na naghahatid ng pananagutang sanhi o pinagmulan ng kaligtasan; higit na natural kaysa 'sanhi' at hindi gaya ng 'may-akda,' na maaaring unawaing pampanitikan.
- source_word: σωτηρίας αἰωνίου
  choice: walang-hanggang kaligtasan
  rationale: Pinananatili ang teolohikal na diwa ng σωτηρία at ang walang katapusang katangian ng αἰώνιος sa natural na Tagalog.
theological_decisions:
- issue: Kahulugan ng τελειωθεὶς tungkol kay Jesus
  choice: nang lubos na siyang maihanda
  alternative: nang siya'y gawing ganap; nang dalhin siya sa ganap na katuparan
  rationale: Iniiwasang ipahiwatig na dati siyang may kapintasang moral, habang pinananatili ang diwa ng pagkumpleto o pagdadala sa itinakdang layunin ng kanyang tungkulin at gawain.
- issue: Saklaw at kundisyon ng πᾶσιν τοῖς ὑπακούουσιν αὐτῷ
  choice: para sa lahat ng sumusunod sa kanya
  alternative: para sa lahat ng sumusunod nang may pagsunod sa kanya; para sa lahat ng tumatalima sa kanya
  rationale: Pinananatiling hayag ang masunuring pagtugon sa kanya at hindi ito pinapalitan ng mas makitid o mas malawak na pormulang doktrinal.
- issue: Papel ni Jesus bilang αἴτιος ng kaligtasan
  choice: siya ang naging pinagmumulan
  alternative: siya ang naging sanhi; siya ang naging may-akda
  rationale: Pinananatili ang pagiging sanhi at pananagutan ni Jesus sa kaligtasan nang hindi ipinapasok ang isang tiyak na sistemang teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “lubos na maihanda” upang maging natural sa karaniwang mambabasa at mapanatili ang telikong diwa ng τελειόω. Ginamit ang “sumusunod sa kanya” bilang mas idiomatikong pahayag ng masunuring pagtugon; ipinaliliwanag ng talababa ang mas tahasang alternatibong “tumatalima.”
