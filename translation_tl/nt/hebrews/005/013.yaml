  - marker: b
    text: Maaari ring “katarungan” sa halip na “katuwiran.”
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς
  choice: ang bawat
  rationale: 'Pinananatili ang distributibong diwa: bawat taong kabilang sa inilalarawang pangkat.'
- source_word: ὁ μετέχων γάλακτος
  choice: umiinom ng gatas
  rationale: Natural sa Filipino para sa talinghaga ng pagkonsumo ng gatas, nang hindi ipinapalagay na gatas lamang ang kinakain.
- source_word: ἄπειρος
  choice: walang kasanayan
  rationale: Ipinahihiwatig ang kakulangan sa karanasan o kahusayan, hindi ang lubos na kawalang-alam.
- source_word: λόγου δικαιοσύνης
  choice: sa salita tungkol sa katuwiran
  rationale: Ginagawang malinaw at natural ang ugnayang henitibo habang pinananatili sa talababa ang iba pang posibleng pagbasa nito.
- source_word: νήπιος
  choice: sanggol
  rationale: Pinananatili ang matalas na larawan ng kawalang-gulang na kaugnay ng gatas.
- source_word: γάρ ... γάρ
  choice: Sapagkat ... dahil
  rationale: Kapuwa paliwanag ang gamit, ngunit pinag-iba ang mga pang-ugnay para sa natural na daloy sa Filipino.
theological_decisions:
- issue: Kahulugan ng λόγου δικαιοσύνης
  choice: salita tungkol sa katuwiran
  alternative: salita ng katuwiran; mensahe tungkol sa katuwiran
  rationale: Maaaring ilarawan ng henitibo ang nilalaman o katangian ng salita. Hindi tiyak na nilulutas ng salin ang saklaw nito; itinatala ang mga alternatibo.
- issue: Pagkasalin ng δικαιοσύνη
  choice: katuwiran
  alternative: katarungan
  rationale: Mas malawak at karaniwan sa kontekstong moral at espirituwal ang “katuwiran,” ngunit tunay na bahagi ng semantikong saklaw ang “katarungan.”
- issue: Kasarian sa νήπιος ... ἐστιν
  choice: siya
  alternative: ang taong iyon
  rationale: Ang panlalaking anyo sa Griyego ay bahagi ng pangkalahatang konstruksiyon. Ang “siya” ay likas sa Filipino at hindi nagpapasok ng kasariang hindi kailangang tahasang ulitin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang talinghaga ng gatas at sanggol, at iniwasan ang sobrang teknikal o denominasyonal na pananalita.
