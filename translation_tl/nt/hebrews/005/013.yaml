  text: Sapagkat ang bawat umiinom ng gatas ay hindi pa bihasa sa salita tungkol sa katuwiran[a][b], sapagkat sanggol pa siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa salita ng katuwiran” o “sa mensahe tungkol sa katuwiran.”
