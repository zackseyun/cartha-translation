revisions:
- from: Sapagkat ang bawat pinakapunong pari, na pinipili mula sa mga tao, ay inaatasan para sa kapakanan ng mga tao sa mga bagay na may kaugnayan sa Diyos, upang maghandog siya ng mga kaloob at mga hain para sa mga kasalanan.
  to: Sapagkat ang bawat punong pari, na kinukuha mula sa mga tao, ay itinatalaga para sa kapakanan ng mga tao sa mga bagay na may kaugnayan sa Diyos, upang maghandog siya ng kapuwa mga kaloob at mga hain para sa mga kasalanan.
  rationale: Pinalitan ang hindi karaniwang “pinakapunong pari” ng pamantayang “punong pari.” Ginawang “na kinukuha mula sa mga tao” ang unang participial na parirala upang maipakita ang λαμβανόμενος, at “ay itinatalaga” ang καθίσταται upang malinaw ang paglalagay sa katungkulan. Idinagdag ang “kapuwa” upang maipakita ang τε καὶ nang hindi binabago ang saklaw ng “para sa mga kasalanan.”
