  text: Πᾶς γὰρ ἀρχιερεὺς ἐξ ἀνθρώπων λαμβανόμενος ὑπὲρ ἀνθρώπων καθίσταται τὰ πρὸς τὸν θεόν, ἵνα προσφέρῃ δῶρά τε καὶ θυσίας ὑπὲρ ἁμαρτιῶν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/001.yaml
  text: For every high priest[a], being taken from among men, is appointed on behalf of men in the things pertaining to God, so that he may offer both gifts and sacrifices for sins,
translation:
  language: tl
  text: Sapagkat ang bawat punong pari, na kinukuha mula sa mga tao, ay itinatalaga para sa kapakanan ng mga tao sa mga bagay na may kaugnayan sa Diyos, upang maghandog siya ng kapuwa mga kaloob at mga hain para sa mga kasalanan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πᾶς γὰρ ἀρχιερεὺς
  choice: Sapagkat ang bawat pinakapunong pari
  rationale: Ang distributibong Πᾶς na may pangngalang isahan ay likas na isinaling “bawat.” Ipinahihiwatig ng γὰρ ang pagpapaliwanag sa naunang argumento. Ang “pinakapunong pari” ang karaniwan at tiyak na katawagan sa katungkulan.
- source_word: ἐξ ἀνθρώπων λαμβανόμενος
  choice: na pinipili mula sa mga tao
  rationale: Nananatili ang pasibong diwa ng participle, habang natural sa Filipino ang “pinipili.” Ang ἀνθρώπων ay pangkalahatang tumutukoy sa sangkatauhan; sa kontekstong ito, sapat at likas ang “mga tao” nang hindi ikinukubli na lalaki ang makasaysayang mga paring tinutukoy.
- source_word: ὑπὲρ ἀνθρώπων
  choice: para sa kapakanan ng mga tao
  rationale: Ipinahahayag ng ὑπέρ ang pagkilos bilang kinatawan at para sa ikabubuti ng iba; malinaw itong naihahatid ng pariralang ito.
- source_word: καθίσταται
  choice: ay inaatasan
  rationale: Sa konteksto ng pagkakaloob ng tungkulin, ipinahihiwatig nito ang paglalagay o paghirang sa isang katungkulan. Ang “inaatasan” ay natural at pinananatili ang pasibong anyo.
- source_word: τὰ πρὸς τὸν θεόν
  choice: sa mga bagay na may kaugnayan sa Diyos
  rationale: Malapit ito sa idyomang Griyego at malinaw na tumutukoy sa mga usapin ng paglilingkod at pagsamba na nakatuon sa Diyos.
- source_word: ἵνα προσφέρῃ
  choice: upang maghandog siya
  rationale: Pinananatili ng “upang” ang layuning ipinahahayag ng ἵνα na may subjunctive.
- source_word: δῶρά τε καὶ θυσίας
  choice: mga kaloob at mga hain
  rationale: Pinananatili ang dalawang magkaibang terminong pangkulto. Hindi na kailangan sa natural na Filipino ang tahasang katumbas ng “both,” sapagkat malinaw na pinagsasama ng “at” ang dalawang uri.
- source_word: ὑπὲρ ἁμαρτιῶν
  choice: para sa mga kasalanan
  rationale: Ito ang natural na salin sa konteksto ng paghahain at pinananatili ang kaugnayan ng mga handog sa mga kasalanan nang hindi dinaragdagan ang paliwanag.
theological_decisions:
- issue: Kinatawang saklaw ng ἀνθρώπων
  choice: mga tao sa dalawang pagkakataon
  alternative: mga lalaki
  rationale: 'Bagaman morpolohikal na panlalaki at tumutukoy sa isang makasaysayang katungkulang ginagampanan ng mga lalaki, ang ἄνθρωπος/ἄνθρωποι ay karaniwang tumutukoy sa mga taong kabilang sa sangkatauhan, hindi lamang sa mga lalaking nasa hustong gulang. Pinananatili ng “mga tao” ang mahalagang teolohikal na punto: ang pari ay kinuha mula sa sangkatauhan at kumikilos para sa mga tao.'
- issue: Saklaw ng “mga kaloob at mga hain para sa mga kasalanan”
  choice: Panatilihin ang payak na ugnayang sintaktiko
  alternative: Ipaliwanag na mga hain lamang ang para sa mga kasalanan
  rationale: Maaaring unawain ang huling parirala bilang kaugnay ng pinagsamang “mga kaloob at mga hain.” Hindi dapat paliitin ng salin ang saklaw nito nang higit sa tahasang sinasabi ng Griyego.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “pinakapunong pari,” “maghandog,” at “mga hain” upang mapanatili ang wikang panrelihiyon at pangkulto nang hindi nagiging lipas o labis na teknikal. Walang talababa dahil walang mahalagang tekstuwal o leksikal na alternatibong kailangang ilagay sa pangunahing publikasyon.
