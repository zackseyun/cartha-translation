id: HEB.5.12
reference: Hebrews 5:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ γὰρ ὀφείλοντες εἶναι διδάσκαλοι διὰ τὸν χρόνον, πάλιν χρείαν ἔχετε τοῦ διδάσκειν ὑμᾶς ⸀τινὰ τὰ στοιχεῖα τῆς ἀρχῆς τῶν λογίων τοῦ θεοῦ, καὶ γεγόνατε χρείαν ἔχοντες γάλακτος, ⸀οὐ στερεᾶς τροφῆς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/012.yaml
  text: For although by this time you ought to be teachers[a], you again need someone to teach you the basic elements of the beginning of the oracles of God, and you have come to need milk[b], not solid food.
translation:
  language: tl
  text: Sapagkat, bagaman sa tagal ng panahong lumipas ay dapat maging mga guro na kayo, kailangan na naman ninyong may magturo sa inyo kung ano ang mga unang saligan[a] ng mga pahayag ng Diyos[b]. Humantong na kayo sa kalagayang kailangan ninyo ang gatas, hindi ang matigas na pagkain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ilang mga panimulang elemento.” Maaaring unawain ang Griyegong τινά bilang patanong na “kung ano ang” o bilang isang di-tiyak na panuring.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga pahayag ng Diyos” ay tumutukoy sa mga salita o kapahayagang mula sa Diyos, hindi sa paganong panghuhula o mga orakulo.
    reason: cultural_note
lexical_decisions:
- source_word: ὀφείλοντες εἶναι
  choice: dapat ... na kayo
  rationale: Ipinahahayag ang inaasahang pananagutan o nararapat na kalagayan nang hindi labis na legal ang himig.
- source_word: διδάσκαλοι
  choice: mga guro
  rationale: Karaniwan, malinaw, at likas na tawag sa mga taong nagtuturo sa iba.
- source_word: διὰ τὸν χρόνον
  choice: sa tagal ng panahong lumipas
  rationale: Ipinakikita na ang haba ng panahong lumipas ang dahilan kung bakit inaasahan na ang kanilang pagkam成熟, nang hindi nagdaragdag kung kailan nagsimula ang panahong iyon.
- source_word: πάλιν
  choice: na naman
  rationale: Likas na Filipino para sa pag-uulit o pag-urong sa dati nilang pangangailangang maturuan.
- source_word: χρείαν ἔχετε τοῦ διδάσκειν ὑμᾶς
  choice: kailangan na naman ninyong may magturo sa inyo
  rationale: Ginagawang natural sa Filipino ang articular infinitive at malinaw na ipinahihiwatig ang di-tinukoy na tagapagturo.
- source_word: τινὰ τὰ στοιχεῖα
  choice: mga panimulang elemento
  rationale: Ang στοιχεῖα ay mga saligang sangkap o rudimento; pinananatili ng “elemento” ang larawan ng mga pangunahing bahagi, habang ipinahahayag ng “panimulang” ang antas ng pagtuturo.
- source_word: τῆς ἀρχῆς
  choice: panimulang
  rationale: Isinasanib sa parirala upang maging natural sa Filipino habang pinananatili ang diin sa pinakamaagang yugto o pundasyon.
- source_word: τῶν λογίων τοῦ θεοῦ
  choice: ng mga pahayag ng Diyos
  rationale: Ang λόγια ay mga pahayag o kapahayagang mula sa Diyos, hindi lamang karaniwang mga salita at hindi rin paganong orakulo.
- source_word: γεγόνατε χρείαν ἔχοντες
  choice: Umabot na kayo sa kalagayang ... ang kailangan ninyo
  rationale: Ipinahahayag ang resultang kalagayan ng perfect tense—isang kalagayang kinahantungan at nagpapatuloy sa kasalukuyan.
- source_word: γάλακτος, οὐ στερεᾶς τροφῆς
  choice: gatas ... hindi matigas na pagkain
  rationale: Tuwirang pinananatili ang matingkad na metapora at paghahambing ng pagkaing para sa sanggol at pagkaing nangangailangan ng higit na kahinugan.
theological_decisions:
- issue: Metaporikal na paghahambing ng gatas at matigas na pagkain
  choice: Pinanatili ang metapora nang walang paliwanag sa pangunahing teksto.
  alternative: Ipaliwanag bilang “panimulang aral” at “mas malalim na aral.”
  rationale: Hindi tinutukoy ng talata ang isang teknikal o denominasyonal na kurikulum; pinananatili ng metapora ang retorika at tensiyon ng may-akda.
- issue: Saklaw ng “mga pahayag ng Diyos”
  choice: Isinalin bilang mga pahayag na mula sa Diyos nang hindi nililimitahan sa isang tiyak na korpus.
  alternative: “mga salita ng Diyos” o “mga orakulo ng Diyos”
  rationale: Masaklaw ang λόγια at hindi malinaw sa talata kung eksaktong aling mga pahayag ang tinutukoy; hindi dapat paliitin ang saklaw nang walang batayan.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “matigas na pagkain” bilang karaniwang katapat ng στερεὰ τροφή at pinanatili ang direktang pagsaway sa maramihang kausap. Iniwasang idagdag ang “sa pananampalataya” sa parirala tungkol sa lumipas na panahon dahil wala iyon sa Griyego.
