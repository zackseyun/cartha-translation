  naturalness: Mas natural ang “kailangan na naman ninyong may magturo sa inyo” kaysa sa impersonal na anyo, at malinaw ang “humantong na kayo sa kalagayang kailangan ninyo ang gatas.” Ang “mga unang saligan” ay isang likas at marangal na katapat ng στοιχεῖα τῆς ἀρχῆς nang hindi inuulit nang mabigat ang “panimulang elemento.”
  terminology: Ang “mga pahayag ng Diyos” ay angkop para sa λόγια τοῦ θεοῦ at hindi nagpapahiwatig ng paganong orakulo. Pinanatili ang “mga guro,” “gatas,” at “matigas na pagkain” bilang malinaw at di-denominasyonal na mga katawagan.
