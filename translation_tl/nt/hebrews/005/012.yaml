- from: Sapagkat bagaman sa tagal ng panahong lumipas ay dapat mga guro na kayo, kailangan na naman ninyong may magturo sa inyo ng mga panimulang elemento[a] ng mga pahayag ng Diyos[b]. Umabot na kayo sa kalagayang gatas ang kailangan ninyo, hindi matigas na pagkain.
