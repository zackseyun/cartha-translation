  source_fidelity: 'Tumpak na naipapahayag ng “gaya rin ng sinasabi niya sa ibang bahagi” ang καθὼς καὶ ἐν ἑτέρῳ λέγει, kabilang ang kasalukuyan at personal ngunit di-tahasang simuno ng λέγει. Ang sipi ay wasto: “Ikaw ay pari magpakailanman ayon sa kaayusan ni Melquisedec.” Napananatili nito ang tuwirang pagtawag, ang walang-hanggang panahon, at ang kahulugang pangkaayusan/kategorya ng τάξις.'
