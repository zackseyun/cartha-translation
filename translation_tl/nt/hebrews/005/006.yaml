id: HEB.5.6
reference: Hebrews 5:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καθὼς καὶ ἐν ἑτέρῳ λέγει· Σὺ ἱερεὺς εἰς τὸν αἰῶνα κατὰ τὴν τάξιν Μελχισέδεκ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/006.yaml
  text: just as he also says in another place[b][a], “You are a priest forever according to the order of Melchizedek,”
translation:
  language: tl
  text: gaya rin ng sinasabi niya sa ibang bahagi[a], “Ikaw ay pari magpakailanman ayon sa kaayusan ni Melquisedec.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa ibang lugar.” Literal na “sa iba,” na may ipinahihiwatig na bahagi ng Kasulatan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “alinsunod sa uri ng pagkapari ni Melquisedec.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς καὶ
  choice: gaya rin ng
  rationale: Likas na Filipino na nagpapanatili sa paghahambing ng καθώς at sa diwa ng καί na nag-uugnay sa ikalawang sipi sa nauna.
- source_word: ἐν ἑτέρῳ
  choice: sa ibang bahagi
  rationale: Ang parirala ay eliptikal, na may nauunawaang tinutukoy na ibang bahagi o talata ng Kasulatan. Ginagawang malinaw ito nang hindi labis na nagpapakahulugan.
- source_word: λέγει
  choice: sinasabi niya
  rationale: Pinananatili ang personal at pangkasalukuyang anyo ng pandiwa; hindi tahasang pinapangalanan ang simuno, gaya ng Griyego.
- source_word: Σὺ
  choice: Ikaw
  rationale: Pinananatili ang tuwirang pagtawag sa ikalawang panauhang isahan.
- source_word: ἱερεὺς
  choice: pari
  rationale: Karaniwan, malinaw, at angkop na salin ng ἱερεύς sa modernong Filipino.
- source_word: εἰς τὸν αἰῶνα
  choice: magpakailanman
  rationale: Likas at marangal na katumbas sa Filipino para sa walang hanggang pananatili.
- source_word: κατὰ τὴν τάξιν
  choice: ayon sa kaayusan ni
  rationale: Pinananatili ang ideya ng itinatag na kaayusan o uri ng pagkapari, habang nananatiling natural sa Filipino.
- source_word: Μελχισέδεκ
  choice: Melquisedec
  rationale: Ginamit ang nakaugaliang transliterasyong Filipino ng pangalang biblikal.
theological_decisions:
- issue: Tinutukoy na tagapagsalita sa pormula ng pagsipi
  choice: “sinasabi niya,” na hindi tahasang pinapangalanan ang simuno
  alternative: “sinasabi sa Kasulatan” o “sinasabi nito”
  rationale: Ipinapakita ng Hebreo ang Kasulatan bilang buhay at kasalukuyang pananalita, ngunit walang tahasang pangngalan para sa simuno rito. Pinananatili ng salin ang personal na anyo at ang bahagyang di-tiyak na pagtukoy.
- issue: Kahulugan ng τάξις sa sipi tungkol kay Melquisedec
  choice: “kaayusan” bilang itinatag na uri o hanay ng pagkapari
  alternative: “paraan” o “huwaran”
  rationale: Sa argumento ng Hebreo, tumutukoy ito sa natatanging pagkaparing inuugnay kay Melquisedec. Ang “kaayusan” ay nagpapanatili sa ugnayang ito nang hindi ito nililimitahan sa simpleng pagkakatulad lamang.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “pari” at “magpakailanman” bilang pamilyar na bokabularyong biblikal. Iningatan ang personal ngunit hindi tahasang pinangalanang simuno ng λέγει at ang saklaw ng kahulugan ng τάξις.
