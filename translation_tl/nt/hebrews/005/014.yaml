  text: τελείων δέ ἐστιν ἡ στερεὰ τροφή, τῶν διὰ τὴν ἕξιν τὰ αἰσθητήρια γεγυμνασμένα ἐχόντων πρὸς διάκρισιν καλοῦ τε καὶ κακοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/014.yaml
  text: But solid food is for the mature[b][a], who because of practice have their powers of discernment trained to distinguish both good and evil.
translation:
  language: tl
  text: Ngunit ang matigas na pagkain ay para sa mga may-gulang, na dahil sa palagiang pagsasanay[a] ay nahasa ang kanilang mga pandama[b] upang makilala ang mabuti at masama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dahil sa nakagawiang paggamit.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mga pandama”; ginagamit dito bilang talinghaga para sa kakayahang umunawa at kumilala.
    reason: lexical_alternative
lexical_decisions:
- source_word: τελείων
  choice: mga nasa hustong gulang
  rationale: Tumutukoy sa mga taong ganap na ang paglago, na kasalungat ng mga sanggol sa naunang konteksto. Iniiwasan nito ang di-kinakailangang pahiwatig na sila ay walang anumang kasalanan.
- source_word: στερεὰ τροφή
  choice: matigas na pagkain
  rationale: Pinananatili ang konkretong larawan ng pagkaing hindi gatas at ang paghahambing sa espirituwal na paglago.
- source_word: διὰ τὴν ἕξιν
  choice: dahil sa palagiang pagsasanay
  rationale: Ipinahahayag ang ἕξις bilang nakagawiang paggamit o paulit-ulit na pagsasanay na humahantong sa pagkahasa.
- source_word: τὰ αἰσθητήρια
  choice: kanilang mga pandama
  rationale: Pinananatili ang literal na metapora ng mga kakayahang pandama; nililinaw ng talababa na tumutukoy ito rito sa panloob na kakayahang umunawa at kumilala.
- source_word: γεγυμνασμένα ἐχόντων
  choice: nahasa
  rationale: 'Ipinakikita ang bunga ng naganap na pagsasanay: ang kanilang mga kakayahan ay nasa sanay nang kalagayan.'
- source_word: πρὸς διάκρισιν
  choice: upang makilala
  rationale: Natural na Filipino para sa layunin o bunga ng διάκρισις—ang pagkilala o pagtatangi sa dalawang bagay.
- source_word: καλοῦ τε καὶ κακοῦ
  choice: ang mabuti at masama
  rationale: Direktang pinananatili ang moral na pares; hindi kailangang tahasang tumbasan ang τε ng “kapuwa” sa natural na Filipino.
- source_word: δέ
  choice: Ngunit
  rationale: Malinaw na naghahayag ng pagsalungat sa gatas na para sa mga sanggol sa naunang talata.
theological_decisions:
- issue: Kahulugan ng τελείων sa konteksto ng espirituwal na paglago
  choice: mga nasa hustong gulang
  alternative: mga ganap; mga may-gulang
  rationale: Ang agarang konteksto ay naghahambing sa mga sanggol at sa mga umunlad na, hindi tahasang nagtuturo ng kawalang-kasalanan. Pinananatili ng salin ang talinghaga ng paglaki at ang tensiyong nakapaloob sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang talinghaga ng paglaki, matigas na pagkain, at mga pandama, habang ginawang natural ang balangkas ng pangungusap.
