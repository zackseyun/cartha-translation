reference: Hebrews 5:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ⸂δι’ αὐτὴν⸃ ὀφείλει, καθὼς περὶ τοῦ λαοῦ, οὕτως καὶ περὶ ⸀αὑτοῦ προσφέρειν ⸀περὶ ἁμαρτιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/003.yaml
  text: And because of this he is obligated[a], just as for the people, so also for himself, to offer for sins.
translation:
  language: tl
  text: At dahil dito[a], obligado siyang maghandog para sa mga kasalanan, kung paanong para sa sambayanan, gayundin para sa kanyang sarili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “dahil sa kanya.” Malamang na tumutukoy ito sa kahinaan ng punong pari na binanggit sa naunang talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ αὐτὴν
  choice: dahil dito
  rationale: Pinananatili ang sanhi at ang di-tahasang pambabaeng panghalip na pinakamalapit na tumutukoy sa kahinaang binanggit sa naunang talata, nang hindi inilalagay ang paliwanag sa pangunahing teksto.
- source_word: ὀφείλει
  choice: tungkulin niyang
  rationale: Malinaw na naghahayag ng obligasyon o kinakailangang gampanin, hindi lamang payo.
- source_word: καθὼς ... οὕτως καὶ
  choice: gaya rin ng
  rationale: Likas sa Tagalog at pinananatili ang paghahambing sa paghahandog para sa sarili at para sa sambayanan.
- source_word: τοῦ λαοῦ
  choice: sambayanan
  rationale: Tumutukoy sa bayang pinaglilingkuran ng punong pari sa kontekstong tipanan at paghahandog; marangal at malinaw nang hindi tahasang dinaragdag ang 'Israel.'
- source_word: περὶ αὑτοῦ
  choice: para sa kanyang sarili
  rationale: Tumpak at natural na nagpapahayag ng reflexive na diwa.
- source_word: προσφέρειν
  choice: maghandog
  rationale: Sa kontekstong makasaserdote, likas na taglay ng 'maghandog' ang sakripisyal na diwa; hindi na kailangang magdagdag ng bagay na wala nang tahasan sa Griyego.
- source_word: περὶ ἁμαρτιῶν
  choice: para sa mga kasalanan
  rationale: Pinananatili ang maikli at malawak na ugnayan ng paghahandog sa mga kasalanan nang hindi ito nililimitahan sa teknikal na katawagang 'handog para sa kasalanan.'
theological_decisions:
- issue: Tinutukoy ng 'dahil dito'
  choice: Pinananatiling di-tahas sa pangunahing teksto, na may talababa na iniuugnay ito sa kahinaan ng punong pari sa naunang talata.
  alternative: 'Tahasan sa teksto: ''dahil sa kahinaang ito''; o mas pangkalahatan: ''dahil sa kalagayang ito.'''
  rationale: Ang pinakamalapit at pinakanaaangkop na tinutukoy ay ang kahinaan sa Hebreo 5:2, ngunit hindi tahasang inuulit ng Griyego ang pangngalan kaya dapat panatilihin ang bahagyang kalabuan.
- issue: Bagay ng pandiwang 'maghandog'
  choice: Hindi idinagdag ang 'mga hain' o 'mga handog.'
  alternative: Maghandog ng mga hain para sa mga kasalanan.
  rationale: Walang tahasang layon ang προσφέρειν sa talata. Sapat nang ipinahihiwatig ng konteksto at ng pandiwang Tagalog na 'maghandog' ang gawaing pansakripisyo.
- issue: Pagkakasunod ng paghahambing
  choice: Inuna ang 'para sa kanyang sarili' kasunod ng layuning 'para sa mga kasalanan,' saka inihambing sa sambayanan.
  alternative: Gaya ng para sa sambayanan, gayundin para sa kanyang sarili, maghandog para sa mga kasalanan.
  rationale: Mas natural at madaling maunawaan sa modernong Tagalog habang pinananatili ang diwa na ang parehong obligasyon ay para sa sarili at sa sambayanan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling basahin. Ginamit ang 'sambayanan' para sa kolektibong λαός at ang 'maghandog' upang mapanatili ang kontekstong pansakripisyo nang hindi nagdaragdag ng tahasang layon na wala sa Griyego.
