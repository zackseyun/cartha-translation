  terminology: Ang “Pinakapunong Pari,” “orden,” at “Melquisedec” ay angkop na mga nakaugaliang terminong Filipino para sa titulong pangsaserdote, sa pormulang mula sa Awit 110:4, at sa pangalan. Ang paggamit ng malaking titik sa titulo ay angkop dahil tumutukoy ito sa natatanging titulong inilapat kay Jesus.
