  text: having been designated by God as a high priest according to the order of Melchizedek[a][b].
translation:
  language: tl
  text: na tinawag ng Diyos bilang Pinakapunong Pari ayon sa orden ni Melquisedec.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “pinangalanan ng Diyos bilang Pinakapunong Pari” o “itinalaga ng Diyos bilang Pinakapunong Pari.”
    reason: lexical_alternative
  - marker: b
    text: Tumutukoy ito sa Awit 110:4, kung saan sinasabing ang pagkapari ay “ayon sa orden ni Melquisedec.”
    reason: cross_reference
lexical_decisions:
- source_word: προσαγορευθεὶς
  choice: itinalaga
  rationale: Ang aorist passive participle ay tumutukoy sa ginawa ng Diyos sa pagkilala o pagtatalaga sa katayuan ni Jesus. Likas sa Filipino ang “itinalaga” sa kontekstong ito, ngunit maaari rin itong unawain bilang “tinawag” o “pinangalanan,” kaya inilalahad sa talababa ang mga leksikal na alternatibo.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: ng Diyos
  rationale: Tinutukoy ng ὑπό na may genitive ang Diyos bilang gumagawa sa pasibong pandiwa. Hindi idinagdag ang “Ama” dahil “Diyos” lamang ang nasa teksto.
- source_word: ἀρχιερεὺς
  choice: pinakapunong pari
  rationale: Karaniwan at malinaw na katumbas sa modernong Filipino ng titulong ἀρχιερεύς.
- source_word: κατὰ
  choice: ayon sa
  rationale: Ipinapahayag ng κατά ang pagsang-ayon o pagkakatulad sa isang itinakdang kaayusan o uri.
- source_word: τὴν τάξιν
  choice: orden
  rationale: Sa pormulang hinango sa Awit 110:4, tumutukoy ang τάξις sa isang kaayusan, uri, o huwaran ng pagkapari. Pinananatili ng “orden” ang pamilyar at teknikal na ugnayan ng parirala nang hindi ito ginagawang simpleng ranggo o pagkakasunod-sunod.
- source_word: Μελχισέδεκ
  choice: Melquisedec
  rationale: Ginamit ang nakaugaliang transliterasyong Filipino ng pangalan.
theological_decisions:
- issue: Kung ang προσαγορευθεὶς ay dapat isaling nagpapahiwatig ng paghirang sa tungkulin o ng pampublikong pagtawag/pagkilala
  choice: itinalaga ng Diyos bilang pinakapunong pari
  alternative: tinawag ng Diyos na pinakapunong pari; pinangalanan ng Diyos bilang pinakapunong pari
  rationale: Ang “itinalaga” ay natural at malinaw sa Filipino, ngunit hindi ipinipilit na ang talata ay nagtuturo ng ontolohikal na pagbabago. Pinananatili sa talababa ang saklaw ng pandiwa bilang pagtawag, pagpapangalan, o pagtatalaga.
- issue: Kahulugan ng “ayon sa orden ni Melquisedec”
  choice: panatilihin ang pormula at ang ugnay nito sa Awit 110:4
  alternative: ayon sa uri o huwaran ng pagkapari ni Melquisedec
  rationale: Hindi tahasang nilulutas ng talata kung ang τάξις ay orden, uri, o huwaran; ang pormulang “orden ni Melquisedec” ay nagpapanatili sa teolohikal at intertekstuwal na tensiyon.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang anyong parirala dahil ipinagpapatuloy nito ang pangungusap mula sa naunang talata. Ginamit ang “orden” bilang teknikal ngunit pamilyar na salitang panrelihiyon; ipinaliliwanag ng konteksto at talababa ang saklaw nito.
