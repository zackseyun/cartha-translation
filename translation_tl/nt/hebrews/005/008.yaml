  text: Bagaman siya ay Anak[a], natutuhan niya ang pagsunod mula sa mga tiniis niya[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Bagaman siya ang Anak.” Walang artikulo bago ang “Anak” sa Griyego; sa Tagalog, maaaring maunawaan ang parirala bilang pagtukoy sa kaniyang pagiging Anak o sa kaniya bilang ang Anak, ayon sa konteksto.
