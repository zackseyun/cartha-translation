lexical_decisions:
- source_word: καίπερ
  choice: Bagaman
  rationale: 'Malinaw na ipinahahayag ang concessive na ugnayan: sa kabila ng pagiging Anak niya, natutuhan niya ang pagsunod sa pamamagitan ng pagdurusa.'
- source_word: ὢν υἱός
  choice: siya ay Anak
  rationale: Likas at marangal sa modernong Filipino. Hindi nangangailangan ang Tagalog ng pantukoy na katumbas ng English na “a/the,” kaya napapanatili ang pagiging walang artikulo ng υἱός nang hindi sapilitang nilulutas ang tiyak na kahulugan nito.
- source_word: ἔμαθεν
  choice: natutuhan niya
  rationale: Tuwirang katumbas ng aorist na μανθάνω at pinananatili ang tunay na pagkatutong binabanggit ng talata.
- source_word: ἀφ’ ὧν
  choice: mula sa mga
  rationale: Ipinahahayag ang pinagmulan o batayan ng pagkatuto at maayos na inuugnay sa pangmaramihang relatibong anyo.
- source_word: ἔπαθεν
  choice: tiniis niya
  rationale: Ipinahahayag ang aktuwal na pagdurusang dinanas. Ang “tiniis” ay natural sa pariralang ito at hindi nagpapahiwatig na kusang-loob lamang o walang sakit ang karanasan.
- source_word: τὴν ὑπακοήν
  choice: ang pagsunod
  rationale: Likas na salin ng ὑπακοή bilang masunuring pagtugon o pagpapasakop; ang “ang” ay angkop sa balangkas na “natutuhan ... ang pagsunod.”
theological_decisions:
- issue: Ang katayuan ni Cristo bilang Anak kaugnay ng kaniyang pagkatuto
  choice: Bagaman siya ay Anak
  alternative: Bagaman siya ang Anak
  rationale: Ang Griyego ay may υἱός na walang artikulo. Dahil hindi kailangang ipakita ng Tagalog ang pagkakaibang “a/the” sa ganitong panaguring nominal, pinananatili ng “siya ay Anak” ang tunay na kalabuan nang hindi itinatanggi ang natatanging pagkakakilanlan ni Jesus sa konteksto.
- issue: Kung ang “natutuhan niya ang pagsunod” ay nagpapahiwatig ng dating pagsuway
  choice: Panatilihin ang tuwirang pahayag na “natutuhan niya ang pagsunod”
  alternative: Naranasan niya kung ano ang halaga ng pagsunod
  rationale: Tuwirang sinasabi ng Griyego na natutuhan niya ang pagsunod. Hindi ito dapat palitan ng paliwanag na mag-aalis sa teolohikal na tensiyon; ang talababa lamang ang naglilinaw na ang diin ay pagkatuto sa aktuwal na karanasan ng pagdurusa, hindi pagtutuwid sa dating pagsuway.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “natutuhan” at “tiniis” bilang kasalukuyang karaniwang anyo; pinanatili ang “Anak” na may malaking titik dahil si Jesus ang tiyak na tinutukoy sa konteksto.
