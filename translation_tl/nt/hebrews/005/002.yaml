id: HEB.5.2
reference: Hebrews 5:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: μετριοπαθεῖν δυνάμενος τοῖς ἀγνοοῦσι καὶ πλανωμένοις ἐπεὶ καὶ αὐτὸς περίκειται ἀσθένειαν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/002.yaml
  text: being able to deal gently with those who are ignorant and going astray[a], since he himself also is beset with weakness[b],
translation:
  language: tl
  text: Kaya niyang makitungo nang mahinahon sa mga walang pagkaunawa at naliligaw[a], sapagkat siya mismo ay nababalot din ng kahinaan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “inililigaw.” Maaaring unawain na may pasibong diwa ang participle sa Griyego.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “napalilibutan ng” o “nadaramtan ng” kahinaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετριοπαθεῖν
  choice: makitungo nang mahinahon
  rationale: Ipinapahayag ng pandiwa ang isang nasusukat at mapagtimping pakikitungo—hindi marahas ngunit hindi rin walang malasakit. Likas at malinaw ito sa makabagong Tagalog.
- source_word: δυνάμενος
  choice: Kaya niyang
  rationale: Pinananatili nito ang kakayahang inilalarawan ng participle habang bumubuo ng natural na pangungusap sa Tagalog.
- source_word: τοῖς ἀγνοοῦσι
  choice: sa mga walang pagkaunawa
  rationale: Pinananatili ang kalagayan ng hindi pagkaalam nang hindi ginagawang nakapirming katawagan o uri ng tao ang mga tinutukoy.
- source_word: πλανωμένοις
  choice: naliligaw
  rationale: Saklaw nito ang paglihis o pagkaligaw sa moral at espirituwal na diwa, habang hindi tiyak na itinatakda kung sila mismo ang kumikilos o inililigaw ng iba.
- source_word: ἐπεὶ
  choice: sapagkat
  rationale: Malinaw na ipinakikita ang dahilan ng mahinahong pakikitungo ng punong pari.
- source_word: καὶ αὐτὸς
  choice: siya mismo ... din
  rationale: Pinananatili ang personal na diin ng αὐτός at ang pandagdag na diwa ng καί na nag-uugnay sa pari sa mga pinaglilingkuran niya.
- source_word: περίκειται ἀσθένειαν
  choice: nababalot ... ng kahinaan
  rationale: Malapit ito sa larawang literal na napalilibutan o nadaramtan ng kahinaan, ngunit nananatiling natural at marangal sa Tagalog. Hindi nito nililimitahan ang kahinaan sa pisikal o moral lamang.
theological_decisions:
- issue: Uri ng pagkukulang ng mga inilalarawan ng ἀγνοοῦσι καὶ πλανωμένοις
  choice: Mga taong walang pagkaunawa at naliligaw, sa malawak na diwa
  alternative: Isang teknikal na pagtukoy lamang sa mga kasalanang hindi sinasadya sa sistemang Levitico
  rationale: May kaugnayan ang pananalita sa kontekstong makasaserdote, ngunit mas malawak ang mismong Griyego kaysa sa isang mahigpit na teknikal na kategorya. Hindi pinakikitid ng salin ang kahulugan.
- issue: Kahulugan ng ἀσθένεια kaugnay ng punong pari
  choice: Kahinaan o karupukan ng tao sa malawak na diwa
  alternative: Pisikal na kahinaan lamang o moral na kahinaan lamang
  rationale: Ang payak na “kahinaan” ay nagpapanatili sa lawak at tensiyon ng salita nang hindi nagpapasok ng doktrinal na paglilimita na wala sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “makitungo nang mahinahon” upang ihatid ang mapagtimping pagkilos, at “nababalot ng kahinaan” upang mapanatili ang matalinghagang lakas ng Griyego. Ang lahat ng marker ng talababa ay nasa pangunahing teksto.
