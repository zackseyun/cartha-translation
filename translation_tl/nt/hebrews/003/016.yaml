- from: Sapagkat sinu-sino ba ang nakarinig ngunit naghimagsik[a]? Hindi ba’t silang lahat na lumabas mula sa Ehipto sa pamamagitan ni Moises?
  to: Sapagkat sinu-sino ba ang naghimagsik matapos makarinig[a]? Hindi ba’t silang lahat ng lumabas mula sa Ehipto sa pamamagitan ni Moises?
  rationale: Pinalitan ang adversative na “ngunit” ng “matapos” upang maipakita ang temporal na tungkulin ng ἀκούσαντες at maiwasan ang dagdag na kontrast. Pinakinis din ang pariralang tumutukoy sa mga lumabas mula sa Ehipto. Walang binago sa kahulugan, sa retorikal na anyo, o sa lexical footnote.
