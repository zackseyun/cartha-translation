  yaml_path: translation/nt/hebrews/003/016.yaml
  text: For who[a], when they heard, rebelled? Was it not all those who came out of Egypt through Moses?
translation:
  language: tl
  text: Sapagkat sinu-sino ba ang naghimagsik matapos makarinig[a]? Hindi ba’t silang lahat ng lumabas mula sa Ehipto sa pamamagitan ni Moises?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pumukaw sa galit” (o “nagpasama ng loob”). Mas literal na maisasalin nang ganito ang pandiwang Griyego, ngunit dito ay tumutukoy ito sa mapanghimagsik na pagpukaw ng Israel sa galit ng Diyos sa ilang.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνες
  choice: sinu-sino
  rationale: Ipinahahayag ang maramihang tanong tungkol sa tiyak na mga taong tinutukoy; natural ito sa makabagong Tagalog.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na ugnayan ng talata sa naunang pangangatwiran.
- source_word: ἀκούσαντες
  choice: nakarinig
  rationale: Isinasalin nang tuwiran ang aorist participle at pinananatili ang kilos na nauna sa paghihimagsik.
- source_word: παρεπίκραναν
  choice: naghimagsik
  rationale: Sa konteksto ng salinlahi sa ilang, malinaw nitong ipinahahayag ang mapanghamong pagsuway na pumukaw sa galit ng Diyos, habang inilalagay sa talababa ang mas literal na kahulugan.
- source_word: ἀλλ’ οὐ πάντες
  choice: Hindi ba’t ... silang lahat
  rationale: Likas na Tagalog para sa retorikal na tanong na umaasang sang-ayon ang sagot; hindi kailangang hiwalay na isalin ang ἀλλά bilang “ngunit.”
- source_word: οἱ ἐξελθόντες ἐξ Αἰγύπτου
  choice: silang lahat na lumabas mula sa Ehipto
  rationale: Pinananatili ang substantival participle at ang spatial na diwa ng paglabas mula sa Ehipto.
- source_word: διὰ Μωϋσέως
  choice: sa pamamagitan ni Moises
  rationale: Pinananatili ang diwa ng agency o instrumentality ng διά na may genitive nang hindi ito pinalalawak bilang tahasang pamumuno.
theological_decisions:
- issue: Kahulugan ng παραπικραίνω sa konteksto ng salinlahi sa ilang
  choice: naghimagsik
  alternative: pumukaw sa galit; nagpasama ng loob
  rationale: Ang “naghimagsik” ay malinaw na naghahatid ng mapanghamong pagsuway ng Israel sa konteksto, ngunit hindi ikinukubli ang mas literal na leksikal na posibilidad, na inilalahad sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “sinu-sino” upang malinaw ang maramihang retorikal na tanong, at pinanatili ang “sa pamamagitan ni Moises” upang hindi labis na bigyang-kahulugan ang agency phrase.
