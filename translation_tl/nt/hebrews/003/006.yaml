revisions:
- from: Ngunit ang Mesiyas[a] ay tapat bilang Anak na namamahala sa kaniyang sambahayan. Tayo ang sambahayang iyon, kung patuloy nating panghahawakan nang matatag ang ating lakas ng loob[b] at ang ipinagmamalaki natin dahil sa ating pag-asa.[c]
  to: Ngunit ang Mesiyas[a] ay tapat bilang Anak na namamahala sa kaniyang sambahayan. Tayo ang kaniyang sambahayan, kung patuloy nating panghahawakan nang matatag ang ating lakas ng loob[b] at ang ating ipinagmamalaki sa pag-asa.[c]
  rationale: Pinalitan ang “sambahayan iyon” ng “kaniyang sambahayan” upang mapanatili ang ugnayan sa sambahayang pinamamahalaan nang hindi nilulutas kung ang panghalip ay tuwirang tumutukoy sa Diyos o sa Anak. Pinalitan din ang panandang sanhi na “dahil sa” ng “sa pag-asa” upang mas tapat na maipahayag ang kaugnayan ng καύχημα at ἐλπίς. Iningatan ang kondisyonal na puwersa ng ἐὰν at ang matatag na diwa ng κατάσχωμεν.
  reviewer_model: gpt-5.6-terra
