  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Χριστὸς δὲ ὡς υἱὸς ἐπὶ τὸν οἶκον αὐτοῦ· ⸀ὃς οἶκός ἐσμεν ἡμεῖς, ⸀ἐὰν τὴν παρρησίαν καὶ τὸ καύχημα τῆς ⸀ἐλπίδος κατάσχωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/006.yaml
  text: But the Messiah was faithful as a Son over his house[a], whose house we are[c][b], if we hold fast our boldness and the boast of our hope.
translation:
  language: tl
  text: Ngunit ang Mesiyas[a] ay tapat bilang Anak na namamahala sa kaniyang sambahayan. Tayo ang kaniyang sambahayan, kung patuloy nating panghahawakan nang matatag ang ating lakas ng loob[b] at ang ating ipinagmamalaki sa pag-asa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Cristo.” Ang Griyegong Χριστός ay maaaring gamitin bilang titulong “Mesiyas” o bilang pangalang “Cristo.”
    reason: alternative_reading
  - marker: b
    text: O “matapang na pagtitiwala.” Ang Griyegong παρρησία ay maaaring tumukoy sa pagiging hayag, malaya, at buong tapang na magsalita o kumilos.
    reason: lexical_alternative
  - marker: c
    text: O “ang ating pagmamalaki sa pag-asa” o “ang ating may-galak na pagtitiwala sa pag-asa.” Ang Griyegong καύχημα ay maaaring mangahulugang ipinagmamalaki, dahilan ng pagmamalaki, o may-galak na pagtitiwala.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς
  choice: ang Mesiyas
  rationale: Ginamit bilang titulo sa paghahambing kay Moises; inilalagay sa talababa ang pangalang anyong “Cristo” bilang tunay na alternatibo.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahahayag ang kaibahan sa paglilingkod ni Moises na binanggit sa naunang talata.
- source_word: ὡς υἱὸς
  choice: bilang Anak
  rationale: Pinananatili ang paghahambing at ang kristolohikal na pagtukoy ng υἱός; ang malaking titik ay nagpapakilala sa tinutukoy nang hindi nagdaragdag ng paliwanag na wala sa teksto.
- source_word: ἐπὶ τὸν οἶκον αὐτοῦ
  choice: na namamahala sa kaniyang sambahayan
  rationale: Ipinahahayag ng ἐπί ang awtoridad sa sambahayan. Mas malinaw sa modernong Tagalog ang “namamahala” kaysa literal na “nasa ibabaw,” at pinananatili ng “kaniyang” ang hindi ganap na tiyak na kaugnayan ng panghalip.
- source_word: ὃς οἶκός ἐσμεν ἡμεῖς
  choice: Tayo ang sambahayang iyon
  rationale: Natural na Tagalog na nagpapanatili sa larawang ang bayan mismo ang sambahayan, hindi ang gusali.
- source_word: ἐὰν
  choice: kung
  rationale: Pinananatili ang tunay na kondisyon nang hindi pinatitindi o nilulutas ang teolohikal na implikasyon nito.
- source_word: παρρησίαν
  choice: lakas ng loob
  rationale: Karaniwang pariralang Tagalog para sa hayag at matapang na pagtitiwala; hindi lamang ito panloob na katiyakan.
- source_word: καύχημα
  choice: ang ipinagmamalaki natin
  rationale: Pinananatili ang diwa ng pagmamapuri o ipinagbubunyi sa halip na pakinisin lamang bilang “pagtitiwala.”
- source_word: τῆς ἐλπίδος
  choice: dahil sa ating pag-asa
  rationale: Ipinapakita ang kaugnayan ng ipinagmamalaki sa pag-asa; likas na ipinahihiwatig ng unang panauhang maramihan ang “ating.”
- source_word: κατάσχωμεν
  choice: patuloy nating panghahawakan nang matatag
  rationale: Ipinahahayag ang matibay na pagpapanatili at ang kontekstuwal na diwa ng pagtitiyaga.
theological_decisions:
- issue: Titulo o pangalang anyo ng Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Ang paghahambing kay Moises ay umaangkop sa aktibong diwa ng titulo, ngunit kapwa posible sa kontekstong ito kaya inilalahad ang alternatibo.
- issue: Ang tinutukoy ng αὐτοῦ sa “kaniyang sambahayan”
  choice: Pinanatili ang panghalip na “kaniyang” nang hindi tahasang pinangalanan ang may-ari
  alternative: “sambahayan ng Diyos” o “sarili niyang sambahayan”
  rationale: Sa daloy mula sa naunang talata, maaaring unawain itong sambahayan ng Diyos, ngunit hindi dapat alisin sa salin ang sintaktikong puwang na maiugnay ito sa Anak.
- issue: Lakas ng kondisyong ἐὰν ... κατάσχωμεν
  choice: kung patuloy nating panghahawakan nang matatag
  alternative: sa kundisyong panghahawakan natin nang matatag
  rationale: Pinananatili ang kondisyon at panawagan sa pagtitiyaga nang hindi ipinapasya ang mga doktrinal na tanong tungkol sa pagtitiyaga o pagtalikod.
- issue: Ipinahiwatig na pagiging tapat ng Mesiyas
  choice: ay tapat
  alternative: 'iwanang eliptikal: “ngunit ang Mesiyas bilang Anak...”'
  rationale: Ang pandiwang ideya ay ipinagpapatuloy mula sa paglalarawan kay Moises sa agarang konteksto; kailangan itong sabihin sa Tagalog upang maging buo at malinaw ang pangungusap.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “sambahayan” upang malinaw na mga tao, hindi gusali, ang larawan. Ang “panghahawakan nang matatag” ay likas na pananalita sa Tagalog at pinananatili ang mapanghamong tono ng talata.
