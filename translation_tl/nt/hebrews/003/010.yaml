  text: τεσσεράκοντα ἔτη· διὸ προσώχθισα τῇ γενεᾷ ⸀ταύτῃ καὶ εἶπον· Ἀεὶ πλανῶνται τῇ καρδίᾳ· αὐτοὶ δὲ οὐκ ἔγνωσαν τὰς ὁδούς μου·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/010.yaml
  text: For forty years[a], therefore, I was provoked with this generation, and said, ‘They always go astray in their hearts[b], but they have not known my ways.’
translation:
  language: tl
  text: Kaya sa loob ng apatnapung taon, labis akong nagalit sa salinlahing ito[a] at sinabi ko, “Lagi silang naliligaw sa puso nila[b], ngunit hindi nila nakilala ang aking mga daan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “labis akong nayamot sa salinlahing ito” o “nasuklam ako sa salinlahing ito”; ang pandiwang Griyego ay nagpapahayag ng matinding di-pagsang-ayon at maaari ring magpahiwatig ng pagkasuklam.
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, isahan ang “puso,” na malamang na tumutukoy sa salinlahi bilang isang kabuuan; maaari rin itong isaling “sa kanilang mga puso.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τεσσεράκοντα ἔτη
  choice: Sa loob ng apatnapung taon
  rationale: Ipinahahayag nang likas sa Tagalog ang akusatibong nagsasaad ng haba ng panahon.
- source_word: διὸ
  choice: kaya
  rationale: Pinananatili ang ugnayang bunga o hinuha sa naunang pahayag, at natural ito sa makabagong Tagalog.
- source_word: προσώχθισα
  choice: labis akong nagalit
  rationale: Ipinahahayag ang matinding sama ng loob o pagkayamot na taglay ng pandiwa nang hindi ito pinatitindi hanggang sa tiyak na ‘namuhi’ o pinahihina bilang karaniwang galit lamang.
- source_word: τῇ γενεᾷ ταύτῃ
  choice: sa salinlahing ito
  rationale: Tuwirang tinutukoy ang pangkat ng mga taong nabuhay sa panahong iyon; ang ‘salinlahi’ ay marangal at pamilyar na katumbas ng γενεά.
- source_word: καὶ εἶπον
  choice: at sinabi ko
  rationale: Tahasan at natural na pinananatili ang unang panauhang nagsasalita.
- source_word: Ἀεὶ πλανῶνται
  choice: Lagi silang naliligaw
  rationale: Inilalarawan ang patuloy na paglihis nang hindi ipinapasiya kung ito ay kusang paglihis o pagkaligaw.
- source_word: τῇ καρδίᾳ
  choice: sa kanilang puso
  rationale: Pinananatili ang isahang ‘puso’ ng Griyego bilang kolektibong paglalarawan sa salinlahi, habang nananatiling mauunawaan sa Tagalog.
- source_word: αὐτοὶ δὲ
  choice: ngunit hindi nila
  rationale: Ang ‘ngunit’ ay malinaw na naghahatid ng pagsalungat na ipinahihiwatig ng δέ; ang panghalip ay likas na naisama sa ‘nila.’
- source_word: οὐκ ἔγνωσαν
  choice: hindi nila nakilala
  rationale: Pinananatili ng ‘nakilala’ ang posibleng higit-sa-kaisipang diwa ng pagkilala, sa halip na paliitin ito sa ‘naunawaan.’
- source_word: τὰς ὁδούς μου
  choice: ang aking mga daan
  rationale: Pinananatili ang karaniwang biblikal na talinghaga para sa mga pagkilos at itinakdang landas ng Diyos.
theological_decisions:
- issue: Tindi ng banal na pagkayamot sa προσώχθισα
  choice: labis akong nagalit
  alternative: namuhi ako; nainis ako
  rationale: Ipinakikita ang tunay at matinding pagtutol ng Diyos sa salinlahi nang hindi tiyak na ipinapakahulugang pagkamuhi o pinahihina bilang payak na pagkainis.
- issue: Kolektibong isahan sa τῇ καρδίᾳ
  choice: sa kanilang puso
  alternative: sa kanilang mga puso
  rationale: Pinananatili ang isahang anyo ng Griyego at ang posibleng kolektibong pagtingin sa buong salinlahi, sa halip na tahimik itong gawing indibiduwal na maramihan.
- issue: Saklaw ng ἔγνωσαν
  choice: hindi nila nakilala
  alternative: hindi nila naunawaan
  rationale: Hindi nililimitahan ang pagkilala sa intelektuwal na pagkaunawa lamang; nananatiling bukas ang kaugnay na moral at pakikipagtipang diwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang ‘salinlahi’ at ‘mga daan’ upang mapanatili ang biblikal na larawan nang hindi nagiging lipas o mahirap unawain. Ang ayos na ‘Sa loob ng apatnapung taon, kaya…’ ay sadyang sumusunod sa pagkakasunod ng sipi sa SBLGNT, kahit maaari ring gawing mas kolokyal na ‘Kaya sa loob ng apatnapung taon…’.
