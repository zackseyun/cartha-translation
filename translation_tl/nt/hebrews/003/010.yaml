- from: Sa loob ng apatnapung taon, kaya labis akong nagalit sa salinlahing ito[a] at sinabi ko, “Lagi silang naliligaw sa kanilang puso[b], ngunit hindi nila nakilala ang aking mga daan.”
  to: Kaya sa loob ng apatnapung taon, labis akong nagalit sa salinlahing ito[a] at sinabi ko, “Lagi silang naliligaw sa puso nila[b], ngunit hindi nila nakilala ang aking mga daan.”
  rationale: Inayos ang posisyon ng “kaya” para sa natural na modernong Tagalog. Pinalitan ang “kanilang puso” ng “puso nila” upang maipakita ang kolektibong isahang “puso” ng Griyego sa mas likas na anyo, habang pinananatili ang kalabuan kung kolektibo o distributibo ang pagtingin sa salinlahi. Bahagyang nilinaw rin ang talababa sa a upang hindi magmungkahi na ang “namuhi” ang tanging o kinakailangang lakas ng pandiwa.
