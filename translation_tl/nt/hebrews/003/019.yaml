  text: καὶ βλέπομεν ὅτι οὐκ ἠδυνήθησαν εἰσελθεῖν δι’ ἀπιστίαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/019.yaml
  text: And we see that they were not able to enter because of unbelief[a].
translation:
  language: tl
  text: At nakikita natin na hindi sila nakapasok dahil sa kawalan nila ng pananampalataya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kawalan ng katapatan.” Ang salitang Griyego ay maaaring tumukoy hindi lamang sa hindi paniniwala kundi pati sa di-matapat na pagtangging magtiwala.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang karaniwang pang-ugnay at ang daloy mula sa naunang pangangatwiran nang hindi nagdaragdag ng higit na diwang panghinuha.
- source_word: βλέπομεν
  choice: nakikita natin
  rationale: Tuwirang inilalarawan ang pangkasalukuyang pandiwa at pinananatili ang unang panauhang maramihan.
- source_word: ὅτι
  choice: na
  rationale: Likas na ipinakikilala sa Tagalog ang nilalaman ng nakikita.
- source_word: οὐκ ἠδυνήθησαν εἰσελθεῖν
  choice: hindi sila nakapasok
  rationale: Natural at malinaw sa modernong Tagalog; ipinahahayag ng anyong ito ang hindi nila nagawang pagpasok nang hindi nagpapabigat sa pangungusap.
- source_word: δι’
  choice: dahil sa
  rationale: Sa kasunod na accusative, nagsasaad ang διά ng dahilan o sanhi.
- source_word: ἀπιστίαν
  choice: kawalan nila ng pananampalataya
  rationale: Malinaw na ipinahahayag ang hindi paniniwala o pagtitiwala sa Diyos sa konteksto, habang inilalaan sa talababa ang posibleng diwa ng kawalan ng katapatan.
theological_decisions:
- issue: Kahulugan ng ἀπιστία kaugnay ng πίστις
  choice: kawalan nila ng pananampalataya
  alternative: kawalan ng katapatan
  rationale: Binibigyang-diin ng agarang konteksto ang pagtanggi ng Israel na maniwala at magtiwala sa pangako ng Diyos. Gayunman, maaari ring saklawin ng salita ang diwa ng di-matapat na pagtangging magtiwala, kaya pinananatili ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Pinanatili ang tuwirang retorikal na “nakikita natin” at iniwasan ang denominasyonal na pagpapakahulugan.
