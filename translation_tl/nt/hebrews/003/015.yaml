  text: while it is being said[a], “Today, if you hear his voice, do not harden your hearts as in the rebellion.”
translation:
  language: tl
  text: Habang sinasabi pa[a], “Ngayon, kung marinig ninyo ang kanyang tinig, huwag ninyong patigasin ang inyong mga puso, gaya noong paghihimagsik.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “gaya noong pagpukaw ng galit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ λέγεσθαι
  choice: habang sinasabi
  rationale: Ipinahahayag ang temporal na diwa ng ἐν kasama ang articular present passive infinitive at pinananatili ang nagpapatuloy na pagbigkas o bisa ng sipi sa natural na Tagalog.
- source_word: Σήμερον
  choice: Ngayon
  rationale: Natural na katumbas ng temporal na pang-abay at malinaw na naghahatid ng agarang panawagan ng Awit 95.
- source_word: ἐὰν ... ἀκούσητε
  choice: kung marinig ninyo
  rationale: Pinananatili ang kondisyonal na anyo at ang diwa ng aorist subjunctive nang hindi dinaragdagan ng obligasyong wala sa Griyego.
- source_word: τῆς φωνῆς αὐτοῦ
  choice: ang kanyang tinig
  rationale: Natural at marangal na Tagalog na nagpapanatili sa personal na pagtukoy sa tinig ng Diyos.
- source_word: Μὴ σκληρύνητε τὰς καρδίας ὑμῶν
  choice: huwag ninyong patigasin ang inyong mga puso
  rationale: Tuwirang pinananatili ang pagbabawal at ang biblikal na larawan ng puso bilang panloob na pagkatao, hindi lamang damdamin.
- source_word: ὡς ἐν τῷ παραπικρασμῷ
  choice: gaya noong paghihimagsik
  rationale: Ang παραπικρασμός ay tumutukoy sa mapanghamong paghihimagsik ng Israel sa ilang; malinaw ito sa modernong Tagalog at pinananatili ang pagtukoy sa isang nakaraang pangyayari.
theological_decisions:
- issue: Pagpapakahulugan sa παραπικρασμός sa sipi mula sa Awit 95
  choice: paghihimagsik
  alternative: pagpupukaw sa galit
  rationale: Mas malinaw na ipinahahayag ng “paghihimagsik” ang pagsuway at paghamon ng Israel sa Diyos. Inilalagay sa talababa ang mas literal na aspektong pagpukaw sa galit upang mapanatili ang leksikal at intertekstuwal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “tinig” at “mga puso” upang mapanatili ang biblikal na larawan, at ang “habang sinasabi” upang ihatid ang nagpapatuloy na diwa ng panimulang parirala.
