  text: For every house is built by someone[a], but God is the one who built all things.
translation:
  language: tl
  text: Sapagkat ang bawat bahay ay itinayo ng isang tao, ngunit ang nagtayo ng lahat ng bagay ay ang Diyos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς
  choice: bawat
  rationale: Kasama ng isahang οἶκος, distributibo ang πᾶς; natural na ipinapahayag ito ng “bawat bahay.”
- source_word: γὰρ
  choice: Sapagkat
  rationale: Nagbibigay ang γάρ ng paliwanag o batayan para sa naunang pangangatwiran.
- source_word: οἶκος
  choice: bahay
  rationale: Pinananatili nito ang konkretong larawang arkitektural at ang larong metaporikal sa konteksto nang hindi agad binibigyang-kahulugang “sambahayan.”
- source_word: κατασκευάζεται
  choice: ay itinayo
  rationale: Sa larawang tumutukoy sa bahay, malinaw at natural ang “itinayo” para sa pasibong anyo, bagaman maaari ring mangahulugan ang pandiwa na ihanda o ayusin.
- source_word: ὑπό τινος
  choice: ng isang tao
  rationale: Ang ὑπό na may genitive ay nagpapahayag ng gumagawa, at ang τις ay di-tiyak; sa konteksto ng pagtatayo ng bahay, natural ang “isang tao.”
- source_word: ὁ δὲ
  choice: ngunit ang
  rationale: Ipinahihiwatig ng δέ ang banayad na pagsalungat o paglipat mula sa pangkalahatang simulain tungo sa sukdulang pahayag.
- source_word: πάντα
  choice: lahat ng bagay
  rationale: Malawak at saklaw ang πάντα; hindi ito nililimitahan sa mga bahay lamang o pinalalawak sa mas interpretatibong “buong sansinukob.”
- source_word: κατασκευάσας
  choice: nagtayo
  rationale: Pinananatili ang ugnayang leksikal sa κατασκευάζεται at ang analohiya ng pagtatayo sa talata.
- source_word: θεός
  choice: ang Diyos
  rationale: Kinilala ng pangwakas na sugnay ang Diyos bilang nagtayo ng lahat ng bagay; natural sa Tagalog ang hulihang predikasyon na “ay ang Diyos.”
theological_decisions:
- issue: Pagkakilanlan ng nagtayo ng lahat ng bagay
  choice: “ang nagtayo ng lahat ng bagay ay ang Diyos”
  alternative: “ang Diyos ang nagtayo ng lahat ng bagay”
  rationale: 'Pinananatili ng napiling ayos ang estruktura at diin ng Griyego: unang inilalarawan ang “nagtayo ng lahat,” saka malinaw na kinikilala bilang Diyos, nang walang idinaragdag na paliwanag na lampas sa teksto.'
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang konkretong “bahay” at ang pag-uulit ng ugat na “tayo” upang marinig ang lohika ng analohiya.
