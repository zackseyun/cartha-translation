  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀλλὰ παρακαλεῖτε ἑαυτοὺς καθ’ ἑκάστην ἡμέραν, ἄχρις οὗ τὸ Σήμερον καλεῖται, ἵνα μὴ σκληρυνθῇ ⸂τις ἐξ ὑμῶν⸃ ἀπάτῃ τῆς ἁμαρτίας·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/013.yaml
  text: But encourage one another every day[b][a], as long as it is called “Today,” so that none of you may be hardened by the deceitfulness of sin.
translation:
  language: tl
  text: Ngunit palakasin ninyo ang loob ng isa’t isa araw-araw[b], habang tinatawag pa itong “Ngayon”[a], upang walang sinuman sa inyo ang mapatigas ng panlilinlang ng kasalanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Ngayon” ay alingawngaw ng Awit 95 at tumutukoy sa kasalukuyang panahong dapat tugunin ang panawagan ng Diyos.
    reason: cross_reference
  - marker: b
    text: Maaari ring isalin na “masidhing payuhan” o “hikayatin.” Ayon sa konteksto, maaaring mangahulugan ang pandiwang Griego ng pagpapalakas ng loob, masidhing pagpapayo, paghimok, o pag-aliw.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Sa halip
  rationale: Malinaw nitong ipinakikita ang matinding pagsalungat sa naunang babala at natural itong pakinggan sa Filipino.
- source_word: παρακαλεῖτε
  choice: hikayatin ninyo
  rationale: Saklaw ng pandiwa ang paghikayat, masidhing pagpapayo, at pagpapalakas ng loob. Sa konteksto, ang “hikayatin” ay natural at naipapahayag ang patuloy na pagtutulungan upang manatiling tapat.
- source_word: ἑαυτοὺς
  choice: ang isa’t isa
  rationale: Bagaman reflexive ang anyo, reciprocal ang diwa nito kasama ng pangmaramihang pautos; kapuwa pagkilos ang tinutukoy.
- source_word: καθ’ ἑκάστην ἡμέραν
  choice: araw-araw
  rationale: Natural at tuwirang ipinahahayag nito ang araw-araw na pag-uulit.
- source_word: ἄχρις οὗ
  choice: hangga’t
  rationale: Pinananatili nito ang diwa ng nagpapatuloy na panahon kung kailan kailangang tumugon.
- source_word: τὸ Σήμερον καλεῖται
  choice: tinatawag itong “Ngayon”
  rationale: Pinananatili ang pasibong “tinatawag” at ang natatanging, substantibong gamit ng “Ngayon,” na umaalingawngaw sa Awit 95. Ang “ito” ay likas na panumbas sa Filipino para sa ipinahihiwatig na kasalukuyang panahon.
- source_word: ἵνα μὴ
  choice: upang walang
  rationale: Natural nitong ipinapahayag sa Filipino ang layuning maiwasan ang binabalaang bunga.
- source_word: σκληρυνθῇ
  choice: mapatigas
  rationale: Pinananatili ng anyong balintiyak ang diwang may nangyayaring pagpapatigas sa tao, sa halip na gawin itong tahasang kusang pagkilos.
- source_word: τις ἐξ ὑμῶν
  choice: sinuman sa inyo
  rationale: Kasama ng negatibong sugnay, malinaw nitong ipinakikita na ang babala ay sumasaklaw sa bawat isa sa pamayanan.
- source_word: ἀπάτῃ τῆς ἁμαρτίας
  choice: dahil sa panlilinlang ng kasalanan
  rationale: Ipinahahayag nito ang kasalanan bilang mapanlinlang na sanhi o kasangkapan ng pagpapatigas, nang hindi labis na nilulutas ang eksaktong ugnayang semantiko ng datibo.
theological_decisions:
- issue: Mutual exhortation language
  choice: ang isa’t isa
  alternative: ang inyong sarili
  rationale: Reciprocal ang gamit ng pangmaramihang reflexive pronoun dito. Inililinaw ng salin ang pananagutan ng buong pamayanan sa isa’t isa nang hindi ginagawang pansarili lamang ang utos.
- issue: Kahulugan ng τὸ Σήμερον
  choice: “Ngayon” bilang kasalukuyang panahong umaalingawngaw sa Awit 95
  alternative: karaniwang pagtukoy lamang sa araw na ito
  rationale: Ipinakikita ng konteksto ng Hebreo 3 na ang “Ngayon” ay sipi at temang mula sa Awit 95. Pinananatili ng panipi ang bigat nito nang hindi nagdaragdag ng paliwanag sa pangunahing teksto.
- issue: Ahensiya sa pagpapatigas
  choice: mapatigas
  alternative: magmatigas
  rationale: Balintiyak ang σκληρυνθῇ. Hindi tahasang tinutukoy ng talata ang ganap na ahente, kaya pinananatili ang anyong balintiyak at ang tensiyong likha ng panlilinlang ng kasalanan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “hikayatin” bilang malawak at pangkaraniwang salitang angkop sa kapuwa pagpapayo at pagpapalakas. Pinanatili ang panipi sa “Ngayon” at ang balintiyak na “mapatigas” upang mapangalagaan ang intertekstuwal at teolohikal na tensiyon ng orihinal.
