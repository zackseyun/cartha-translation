  terminology: Pinanatili ang “kasalanan,” “Diyos,” at ang naka-paniping “Ngayon.” Ang “mapatigas” ay angkop na balintiyak na panumbas ng σκληρυνθῇ at hindi nagdaragdag ng tiyak na ahente.
