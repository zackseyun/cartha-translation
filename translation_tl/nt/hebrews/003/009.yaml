translation:
  language: tl
  text: kung saan sinubok ako ng inyong mga ninuno sa pagsubok[a], at nakita nila ang aking mga gawa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “kung saan sinubok ako ng inyong mga ninuno sa pamamagitan ng pagsubok” o “kung saan inilagay ako ng inyong mga ninuno sa pagsubok.” Mahirap tiyakin kung ang ἐν δοκιμασίᾳ ay nagsasaad ng paraan, kasangkapan, o kalagayan.
    reason: lexical_alternative
  - marker: b
    text: Maaaring unawain ayon sa konteksto na “gayunma’y nakita nila ang aking mga gawa” o “bagaman nakita nila ang aking mga gawa.” Ngunit payak na “at nakita” ang nasa Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ
  choice: kung saan
  rationale: Tumutukoy ito sa lugar sa ilang na binanggit sa naunang talata. Pinananatili ng “kung saan” ang pangunahing diwang panlunan, sa halip na gawing “nang.”
- source_word: ἐπείρασαν
  choice: sinubok
  rationale: Ipinahihiwatig ng pandiwa ang paglalagay sa Diyos sa pagsubok, na may negatibo at mapanghamong himig sa konteksto ng Awit 95.
- source_word: οἱ πατέρες ὑμῶν
  choice: ng inyong mga ninuno
  rationale: Ang “mga ninuno” ay likas at malinaw sa modernong Tagalog para sa mga naunang salinlahi ng bayan; iniiwasan din nito ang posibleng maling pagkaunawa na mga agarang ama lamang ang tinutukoy.
- source_word: ἐν δοκιμασίᾳ
  choice: sa isang pagsubok
  rationale: Pinananatili nito ang anyong may pang-ukol at ang pag-uulit ng konsepto ng pagsubok, nang hindi tiyakang nilulutas kung paraan, kalagayan, o kasangkapan ang ipinahihiwatig ng parirala.
- source_word: καὶ εἶδον
  choice: at nakita nila
  rationale: Tuwirang pinananatili ang payak na pag-uugnay ng καί. Hindi idinagdag sa pangunahing teksto ang diwang pasalungat na “gayunma’y” o “bagaman.”
- source_word: τὰ ἔργα μου
  choice: ang aking mga gawa
  rationale: Pinananatili ng “mga gawa” ang leksikal at biblikal na himig ng ἔργα, na tumutukoy sa mga ginawa ng Diyos sa ilang.
theological_decisions:
- issue: Hindi tahasang nakasulat na layon ng ἐπείρασαν
  choice: 'ako ay isinama bilang nauunawaang layon: “ako sinubok”'
  alternative: “sumubok ang inyong mga ninuno” nang walang tahasang layon
  rationale: Bagaman walang nakasulat na panghalip na με sa sugnay ng SBLGNT, malinaw sa konteksto ng sipi mula sa Awit 95 na ang Diyos ang sinubok. Kailangan ding ilantad ang layon upang maging likas at malinaw ang Tagalog.
- issue: Ugnayan ng pagkakita sa mga gawa at ng pagsubok
  choice: 'payak na pag-uugnay: “at nakita nila”'
  alternative: 'pasalungat: “gayunma’y nakita nila” o “bagaman nakita nila”'
  rationale: καί lamang ang nasa Griyego. Maaaring ipahiwatig ng konteksto ang pagsalungat, ngunit hindi iyon tahasang nilulutas sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mga ninuno” sa halip na literal na “mga ama” para sa likas na pagtukoy sa mga naunang salinlahi. Sadyang pinanatili ang bahagyang di-karaniwang pag-uulit sa “sinubok … sa isang pagsubok” upang huwag ikubli ang mahirap at posibleng maraming-kahulugang pariralang Griyego.
