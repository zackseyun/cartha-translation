- from: At si Moises naman ay tapat sa buong sambahayan ng Diyos[a] bilang lingkod, upang maging patotoo tungkol sa mga bagay na sasabihin pa[b].
  to: At si Moises naman ay tapat sa buong bahay niya[a] bilang lingkod, bilang patotoo tungkol sa mga bagay na sasabihin pa[b].
