  text: καὶ Μωϋσῆς μὲν πιστὸς ἐν ὅλῳ τῷ οἴκῳ αὐτοῦ ὡς θεράπων εἰς μαρτύριον τῶν λαληθησομένων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/005.yaml
  text: And Moses indeed was faithful in all his house as a servant[a], for a testimony of the things that would be spoken later[b],
translation:
  language: tl
  text: At si Moises naman ay tapat sa buong bahay niya[a] bilang lingkod, bilang patotoo tungkol sa mga bagay na sasabihin pa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “sa kaniyang buong sambahayan.” Literal na “sa buong bahay niya” ang Griyego. Sa konteksto ng Bilang 12:7 at Hebreo 3, nauunawaan itong tumutukoy sa sambahayan ng Diyos; pinananatili ng “bahay” ang larawang ipinagpapatuloy sa mga kasunod na talata.'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “bilang patotoo sa mga bagay na sasabihin pa.” Panghinaharap at balintiyak ang pariralang Griyego at hindi nito tahasang tinutukoy kung sino ang magsasalita.'
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ ... μὲν
  choice: At ... naman
  rationale: Pinananatili ng “At” ang ugnayan sa naunang talata, habang likas na ipinahihiwatig ng “naman” ang paghahambing na ipagpapatuloy sa kasunod na talata.
- source_word: πιστὸς
  choice: tapat
  rationale: Karaniwan at angkop na salin para sa pagiging maaasahan ni Moises sa paglilingkod sa Diyos.
- source_word: ἐν ὅλῳ τῷ οἴκῳ αὐτοῦ
  choice: sa buong sambahayan ng Diyos
  rationale: Ang “sambahayan” ay malinaw na tumutukoy sa mga taong nasasakupan ng Diyos, hindi lamang sa isang gusali. Ginawang tahasan ang Diyos bilang may-ari ayon sa sipi mula sa Bilang 12:7 at sa konteksto ng Hebreo 3, habang itinatala sa talababa ang mas literal na larawang “bahay.”
- source_word: ὡς θεράπων
  choice: bilang lingkod
  rationale: Ipinahahayag ang marangal na tungkulin ni Moises bilang tagapaglingkod at iniiwasang ipakahulugan ang mas matinding diwa ng “alipin” na karaniwang kaugnay ng δοῦλος.
- source_word: εἰς μαρτύριον
  choice: upang maging patotoo
  rationale: Ipinakikita ang layunin o bunga ng tapat na paglilingkod ni Moises bilang patotoo.
- source_word: τῶν λαληθησομένων
  choice: tungkol sa mga bagay na sasabihin pa
  rationale: Pinananatili ang panghinaharap at balintiyak na diwa ng participle nang hindi tinutukoy kung sino ang magsasalita, gaya ng nasa Griyego.
theological_decisions:
- issue: Ang kahulugan ng “bahay/sambahayan” kaugnay ni Moises
  choice: “sambahayan ng Diyos” bilang larangan ng paglilingkod ni Moises
  alternative: “buong bahay niya” o “kaniyang buong sambahayan”
  rationale: Sa konteksto at sa Bilang 12:7, ang tinutukoy ay ang sambahayan ng Diyos. Pinananatili ng talababa ang literal na larawang “bahay,” na mahalaga sa pagpapatuloy ng pangangatwiran sa mga kasunod na talata.
- issue: Diwa ng θεράπων
  choice: lingkod
  alternative: tagapaglingkod; tagapag-alaga
  rationale: May marangal at natatanging diwa ng paglilingkod ang salita. Ang “lingkod” ay natural sa makabagong Tagalog at hindi nag-aangkat ng mas matinding diwa ng pagkaalipin.
- issue: Saklaw ng “mga bagay na sasabihin pa”
  choice: Hindi tahasang tinukoy sa pangunahing teksto kung sino ang magsasalita o ang eksaktong nilalaman
  alternative: Ang mas buong paghahayag ng Diyos na nakasentro sa Anak
  rationale: Panghinaharap at balintiyak ang anyong Griyego. Bagaman maaaring tumukoy ito sa susunod na paghahayag ng Diyos, hindi iyon tahasang nililinaw ng parirala mismo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sambahayan” upang natural na maipahayag ang kolektibong kahulugan, at inilagay sa talababa ang mas literal na “bahay” upang mapanatili ang mahalagang talinghaga ng konteksto.
