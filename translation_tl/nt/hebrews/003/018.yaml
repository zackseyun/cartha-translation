  text: τίσιν δὲ ὤμοσεν μὴ εἰσελεύσεσθαι εἰς τὴν κατάπαυσιν αὐτοῦ εἰ μὴ τοῖς ἀπειθήσασιν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/018.yaml
  text: And to whom did he swear that they would not enter his rest[a], if not to those who disobeyed?
translation:
  language: tl
  text: At kanino siya sumumpa na hindi sila makapapasok sa kanyang kapahingahan, kundi sa mga sumuway?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίσιν
  choice: kanino
  rationale: Panghalip na pananong sa datibong maramihan na tumutukoy sa mga tao; natural sa Tagalog ang “kanino” sa retorikal na tanong.
- source_word: δὲ
  choice: At
  rationale: Ipinagpapatuloy nito ang magkakaugnay na mga tanong sa naunang talata nang hindi nagpapalabis ng pagsalungat.
- source_word: ὤμοσεν
  choice: sumumpa
  rationale: Tuwirang ipinahahayag ang taimtim na panunumpa o panata.
- source_word: μὴ εἰσελεύσεσθαι
  choice: na hindi sila makapapasok
  rationale: Ipinahahayag ng infinitive clause ang nilalaman ng sumpa. Ang “makapapasok” ay natural na anyong panghinaharap sa Tagalog at hindi kinakailangang magpahiwatig ng kawalan ng likas na kakayahan.
- source_word: εἰς τὴν κατάπαυσιν αὐτοῦ
  choice: sa kanyang kapahingahan
  rationale: Pinananatili ang mahalagang tema ng κατάπαυσις sa Hebreo bilang kapahingahang nauukol sa Diyos.
- source_word: εἰ μὴ
  choice: kundi
  rationale: Sa retorikal na tanong, natural na ipinakikilala ng “kundi” ang tanging inaasahang sagot.
- source_word: τοῖς ἀπειθήσασιν
  choice: sa mga sumuway
  rationale: Ipinakikita ng aorist participle ang aktuwal na pagtangging sumunod. Pinananatili ng “sumuway” ang kaibhan nito sa tahasang salitang “hindi sumampalataya” sa talata 19, habang hinahayaang makita sa konteksto ang malapit na ugnayan ng pagsuway at kawalan ng pananampalataya.
theological_decisions:
- issue: Kahulugan ng ἀπειθήσασιν sa babalang ito
  choice: mga sumuway
  alternative: mga hindi sumampalataya
  rationale: Ginagamit ng talata ang ἀπειθέω, hindi ἀπιστέω. Kaya pinananatili sa salin ang pagsuway bilang tahasang diwa, nang hindi binubura ang kaugnayan nito sa kawalan ng pananampalataya na nililinaw ng kasunod na talata.
- issue: Kahulugan ng κατάπαυσις
  choice: kanyang kapahingahan
  alternative: kanyang pahingahang dako
  rationale: Ang “kapahingahan” ay nagpapanatili sa tematikong lawak ng salita sa Hebreo at hindi ito nililimitahan agad sa isang pisikal na lugar.
translation_notes:
  register: Makabagong, malinaw, at marangal na Filipino. Pinanatili ang anyo ng retorikal na tanong at ang maikling diin ng Griyego.
