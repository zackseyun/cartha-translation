id: HEB.3.1
reference: Hebrews 3:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ὅθεν, ἀδελφοὶ ἅγιοι, κλήσεως ἐπουρανίου μέτοχοι, κατανοήσατε τὸν ἀπόστολον καὶ ἀρχιερέα τῆς ὁμολογίας ἡμῶν ⸀Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/001.yaml
  text: Therefore[a], holy brothers, sharers in a heavenly calling, consider Jesus, the apostle and high priest of our confession[c][b],
translation:
  language: tl
  text: Kaya nga, mga banal na kapatid[a], kayong mga kabahagi ng makalangit na pagtawag[b], pagtuunan ninyo ng pansin si Jesus, ang apostol at pinakapunong pari ng ating pagpapahayag[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga kapatid” ay tumutukoy dito sa buong komunidad ng mga mananampalataya, kabilang ang mga babae.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin na “mga nakikibahagi sa makalangit na pagtawag.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring unawain na “pagtuunan ninyo ng pansin ang ating ipinahahayag—si Jesus, ang apostol at pinakapunong pari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅθεν
  choice: Kaya nga
  rationale: Nagpapahayag ito ng kongklusyon o bunga mula sa naunang pangangatwiran, lalo na sa 2:17–18. Likas sa modernong Tagalog ang “Kaya nga” at malinaw ang lohikal na ugnayan.
- source_word: ἀδελφοὶ ἅγιοι
  choice: mga banal na kapatid
  rationale: Ang “kapatid” ang likas na kolektibong tawag sa Tagalog at maaaring tumukoy sa buong komunidad, babae man o lalaki. Pinananatili ng “banal” ang diwa ng pagiging ibinukod o itinalaga sa Diyos.
- source_word: κλήσεως ἐπουρανίου
  choice: sa makalangit na pagkatawag
  rationale: Pinananatili ng “pagkatawag” ang diwa ng banal na pagtawag, samantalang ang “makalangit” ay sadyang hindi nagtatakda kung pinagmulan, katangian, o hantungan ang pangunahing diin.
- source_word: μέτοχοι
  choice: mga kabahagi
  rationale: Tumpak at natural na ipinahahayag ng “kabahagi” ang aktuwal na pakikibahagi sa isang bagay, isang mahalagang konsepto sa Hebreo.
- source_word: κατανοήσατε
  choice: pagtuunan ninyo ng pansin
  rationale: Ang pautos ay humihingi ng masinsin at nakatuong pagsasaalang-alang, hindi lamang panandaliang pagtingin. Likas at malinaw ito sa kasalukuyang Tagalog.
- source_word: ἀπόστολον
  choice: apostol
  rationale: Pinananatili ang tahasang titulong ibinigay kay Jesus at ang kaugnayan nito sa pagiging isinugo, nang hindi ito nililimitahan sa mas huling gamit bilang katungkulan sa iglesia.
- source_word: ἀρχιερέα
  choice: punong pari
  rationale: Malinaw at kasalukuyang katawagan ito para sa mataas na katungkulang pansaserdote na sentral sa Hebreo, at iniiwasan nito ang mas makalumang “dakilang saserdote.”
- source_word: τῆς ὁμολογίας ἡμῶν
  choice: ng ating pagpapahayag
  rationale: Pinananatili nito ang siksik at bahagyang malabong ugnayang genitibo sa dalawang titulo. Hindi idinaragdag sa pangunahing teksto ang “pananampalataya,” na hindi tahasang naroon sa Griyego.
- source_word: Ἰησοῦν
  choice: Jesus
  rationale: Karaniwang anyo ng personal na pangalang Ἰησοῦς sa Tagalog.
theological_decisions:
- issue: Saklaw ng ἀδελφοὶ sa pagtawag
  choice: “mga kapatid” sa pangunahing teksto, na may talang nililinaw na saklaw nito ang buong nananampalatayang komunidad
  alternative: “mga kapatid na lalaki” o “mga kapatid na lalaki at babae”
  rationale: Bagaman panlalaking maramihan ang anyong Griyego, ang “mga kapatid” sa Tagalog ay likas na walang tinutukoy na kasarian at wastong naipahahayag ang kolektibong gamit nang hindi nagdaragdag o nagbubukod.
- issue: Paglalapat ng ἀπόστολον kay Jesus
  choice: Panatilihin ang titulong “apostol”
  alternative: “sugo” o “ang isinugo”
  rationale: Tahasan itong inilalapat ng talata kay Jesus. Ang pagpapanatili sa titulo ay nag-iingat sa teolohikal at pampanitikang lakas ng teksto nang hindi nagpapasok ng paliwanag sa pangunahing salin.
- issue: Ugnayan ng τῆς ὁμολογίας ἡμῶν sa mga titulo
  choice: “ang apostol at punong pari ng ating pagpapahayag”
  alternative: “ang ating ipinahahayag—si Jesus, ang apostol at punong pari”
  rationale: Maaaring iugnay ang parirala sa parehong titulo o unawain si Jesus bilang nilalaman ng ipinahahayag. Pinananatili sa teksto ang mas pormal at bukas na kayarian, habang itinatala ang ibang posibleng pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “punong pari” sa halip na mas makaluma o sektaryong “dakilang saserdote,” at pinanatili ang “apostol” dahil pamilyar ito at mahalaga sa mismong anyo ng teksto. Ang bahagyang pormal na “ng ating pagpapahayag” ay sinadyang panatilihin upang huwag tahimik na lutasin ang tunay na kalabuan ng Griyego.
