  yaml_path: translation/nt/hebrews/003/008.yaml
  text: do not harden your hearts as in the rebellion[a], as on the day of testing in the wilderness,
translation:
  language: tl
  text: huwag ninyong patigasin ang inyong mga puso, gaya noong paghihimagsik,[a] gaya noong araw ng pagsubok sa ilang,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ayon sa mga pangalang-pook na Hebreo sa likod ng Awit 95:8, “gaya sa Meriba, gaya noong araw sa Masa sa ilang.”
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ σκληρύνητε
  choice: huwag ninyong patigasin
  rationale: Tuwirang pagbabawal ito, at pinananatili ng aktibong anyo ang pananagutan ng mga kinakausap.
- source_word: τὰς καρδίας ὑμῶν
  choice: ang inyong mga puso
  rationale: Ang “mga puso” ay tumutukoy sa kalooban, pag-iisip, at panloob na pagkatao, hindi lamang sa damdamin; pinananatili rin ang maramihang tuwirang pakikipag-usap sa kapulungan.
- source_word: ὡς ἐν τῷ παραπικρασμῷ
  choice: gaya noong paghihimagsik
  rationale: Ang παραπικρασμός ay provokasyon o paghihimagsik laban sa Diyos. Likas sa Filipino ang “noong” sa pagtukoy sa makasaysayang pangyayari, habang ang “paghihimagsik” ay malinaw na naghahatid ng bigat na moral.
- source_word: κατὰ τὴν ἡμέραν τοῦ πειρασμοῦ
  choice: gaya nang araw na iyon ng pagsubok
  rationale: Ang κατά ay pinananatiling paghahambing na kaagapay ng naunang ὡς. Ang πειρασμός dito ay pagsubok sa konteksto ng pangyayari sa ilang, hindi lamang tukso.
- source_word: ἐν τῇ ἐρήμῳ
  choice: sa ilang
  rationale: Ang “ilang” ay maikli, natural, at may matatag na biblikal na gamit para sa pook ng paglalakbay ng Israel.
theological_decisions:
- issue: Paglalarawan sa makasaysayang pahiwatig ng Awit 95
  choice: Isinalin ang mga pangngalang Griyego bilang “paghihimagsik” at “pagsubok” sa pangunahing teksto.
  alternative: “gaya sa Meriba, gaya noong araw sa Masa sa ilang”
  rationale: Ang Hebreo ay sumisipi sa Griyegong anyo ng Awit, na gumagamit ng mga salitang naglalarawan sa pangyayari sa halip na mga pangalang-pook. Pinangangalagaan ng pangunahing teksto ang anyong Griyego, habang inilalagay sa talababa ang mahalagang pinagmulang Hebreo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “inyong” upang panatilihin ang maramihang pakikipag-usap, at “sa ilang” para sa pamilyar na himig-biblikal.
