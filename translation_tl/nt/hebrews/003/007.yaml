  text: Διό, καθὼς λέγει τὸ πνεῦμα τὸ ἅγιον· Σήμερον ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/007.yaml
  text: 'Therefore, just as the Holy Spirit says: “Today, if you hear his voice,”'
translation:
  language: tl
  text: 'Kaya, gaya ng sinasabi ng Banal na Espiritu: “Ngayon, kung maririnig ninyo ang kanyang tinig,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διό
  choice: Kaya
  rationale: Likas at malinaw na pang-ugnay sa modernong Tagalog na naghahayag ng kongklusyon mula sa naunang pangangatwiran.
- source_word: καθὼς
  choice: gaya ng
  rationale: Pinananatili ang paghahambing at pormula ng pagsipi nang natural sa Tagalog.
- source_word: λέγει
  choice: sinasabi
  rationale: Ang aspektong imperpektibo sa Tagalog ay angkop sa kasalukuyang pormula ng pagsipi at nagpapahiwatig na nananatiling nagsasalita ang kasulatan.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: ang Banal na Espiritu
  rationale: Pamantayan, tuwiran, at tumpak na katumbas ng pariralang Griyego nang walang idinagdag na diin.
- source_word: Σήμερον
  choice: Ngayon
  rationale: Tuwirang temporal na pang-abay at natural na simula ng sipi.
- source_word: ἐὰν
  choice: kung
  rationale: Tuwirang nagpapakilala sa kondisyong ipinahahayag ng Griyego.
- source_word: τῆς φωνῆς αὐτοῦ
  choice: ang kanyang tinig
  rationale: Pinananatili ang personal na diwa ng φωνή at natural na layon ng pandiwang 'marinig' sa Tagalog.
- source_word: ἀκούσητε
  choice: maririnig ninyo
  rationale: Natural na anyong pangkondisyon sa Tagalog para sa aorist subjunctive kasunod ng ἐὰν; hindi nito idinaragdag ang mas malakas na diwang 'sundin' o 'pakinggan.'
theological_decisions:
- issue: Pagkilala sa nagsasalita sa sipi mula sa Awit
  choice: Tuwirang iniuugnay ang sinasabi sa Banal na Espiritu.
  alternative: Ang Banal na Espiritu ay nagsasalita sa pamamagitan ng Kasulatan o ng salmista.
  rationale: Tahasan sa Griyego ang 'sinasabi ng Banal na Espiritu.' Pinananatili ito nang hindi pinalalawak tungo sa isang mas ganap na paliwanag tungkol sa inspirasyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang 'tinig' sa halip na 'boses' para sa dignidad ng siping pangkasulatan, ngunit nananatili itong madaling maunawaan.
