  source_fidelity: 'Tumpak na naipapahayag ang inferensiyang Διό (“Kaya”), ang pormula ng pagsipi na καθὼς λέγει (“gaya ng sinasabi”), at ang tuwirang atribusyon sa “Banal na Espiritu.” Buo ring naipapasa ang kondisyon ng sipi: “Ngayon, kung maririnig ninyo ang kanyang tinig.” Ang “maririnig ninyo” ay isang likas na Tagalog na pagbuo kasunod ng “kung” at hindi nagdaragdag ng diwang pagsunod na wala sa ἀκούσητε.'
