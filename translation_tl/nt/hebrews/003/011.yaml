translation:
  language: tl
  text: Gaya ng isinumpa ko sa aking poot[a], “Hinding-hindi sila makapapasok sa aking kapahingahan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griego, literal na “Kung makapapasok sila sa aking kapahingahan,” isang pormula ng panunumpa na ang ibig sabihin ay “Tiyak na hindi sila makapapasok sa aking kapahingahan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: Gaya ng
  rationale: Ipinakikilala nito ang nilalaman ng siniping panunumpa at natural na nag-uugnay sa naunang konteksto.
- source_word: ὤμοσα
  choice: isinumpa ko
  rationale: Tuwirang ipinahahayag ng aorist ng ὀμνύω ang taimtim na panunumpa.
- source_word: ἐν τῇ ὀργῇ μου
  choice: sa aking matinding galit
  rationale: Ang ὀργή ay galit na may mabigat at mapanghatol na puwersa; ipinahihiwatig ng “matinding” ang solemnidad nang hindi gumagamit ng di-pangkaraniwang salitang “poot.”
- source_word: Εἰ εἰσελεύσονται
  choice: Hinding-hindi sila makapapasok
  rationale: Isa itong eliptikong pormula ng panunumpa na may εἰ at pandiwang panghinaharap, na nagpapahayag ng tiyak at mariing pagtanggi, hindi ng karaniwang kondisyon.
- source_word: εἰς τὴν κατάπαυσίν μου
  choice: sa aking kapahingahan
  rationale: Pinananatili ng “kapahingahan” ang mahalagang tema sa Awit 95 at sa Hebreo nang hindi nililimitahan ang kahulugan sa lupain, langit, o pansariling kapanatagan.
theological_decisions:
- issue: Pagpapahayag sa pormula ng panunumpang Εἰ εἰσελεύσονται
  choice: Hinding-hindi sila makapapasok sa aking kapahingahan.
  alternative: Kung makapapasok sila sa aking kapahingahan.
  rationale: Bagaman kondisyunal ang literal na anyo, itinatanggi ng sinaunang pormula ng panunumpa ang posibilidad nang buong katiyakan. Nililinaw ng salin ang puwersa nito nang walang idinaragdag na aral.
- issue: Kahulugan ng κατάπαυσις sa konteksto
  choice: kapahingahan
  alternative: pahingahan
  rationale: Ang “kapahingahan” ay sapat na malawak upang mapanatili ang ugnayan sa kapahingahan ng Diyos at ang sinadyang teolohikal na tensiyon sa argumento ng Hebreo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “matinding galit” upang maihatid ang bigat ng ὀργή sa natural na pananalita, at “kapahingahan” upang mapanatili ang pangunahing motif ng Hebreo.
