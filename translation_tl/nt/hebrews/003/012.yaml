base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/012.yaml
  text: Watch out[a], brothers[c][b], lest there be in any of you an evil heart of unbelief in turning away from the living God.
translation:
  language: tl
  text: Mag-ingat kayo, mga kapatid[a], baka magkaroon ang sinuman sa inyo ng masamang pusong walang pananampalataya[b] sa pagtalikod sa Diyos na buháy.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay panlalaking maramihan, ngunit maaari itong tumukoy sa magkakahalong pangkat ng mga kapwa mananampalataya.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “masamang pusong di-tapat” o “masamang pusong hindi sumasampalataya.”
    reason: alternative_reading
  - marker: c
    text: Maaari ring isalin na “sa paglayo mula sa Diyos na buháy” o “sa paghiwalay sa Diyos na buháy.”
    reason: alternative_reading
lexical_decisions:
- source_word: βλέπετε
  choice: Mag-ingat kayo
  rationale: Ang pangkasalukuyang pautos na maramihan ay isang tuwirang babala; natural at malinaw sa modernong Tagalog ang “Mag-ingat kayo.”
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Bagaman panlalaking maramihan ang anyong Griyego, karaniwang ginagamit ito sa pagtawag sa kapwa mananampalataya bilang isang pangkat. Likas at saklaw ng “mga kapatid” sa Tagalog ang mga lalaki at babae.
- source_word: μήποτε ἔσται ἔν τινι ὑμῶν
  choice: upang walang sinuman sa inyo na magkaroon
  rationale: Ipinahahayag nito ang babala laban sa posibilidad na magkaroon ng gayong kalagayan ang alinman sa mga kausap. Mas natural ito sa Tagalog kaysa sa literal na “mayroong nasa sinuman sa inyo.”
- source_word: καρδία πονηρὰ ἀπιστίας
  choice: pusong masama at walang pananampalataya
  rationale: Pinananatili ng “puso” ang biblikal na diwa ng sentro ng pag-iisip, pagpapasya, at pagnanasa. Ang ἀπιστίας ay inilalarawang kakulangan ng pananampalataya, habang ang pang-ugnay na “at” ay nagbibigay ng malinaw at natural na Tagalog nang hindi inaalis ang posibleng diwang “di-tapat.”
- source_word: ἐν τῷ ἀποστῆναι
  choice: at sa gayo'y tumalikod
  rationale: Ikinakabit nito ang masamang pusong walang pananampalataya sa pagkilos na pagtalikod. Hindi nito ginagawang teknikal na terminong teolohikal ang pandiwa, at pinananatili ang ugnayang maaaring unawain bilang pagpapakita o bunga ng gayong puso.
- source_word: ἀπὸ θεοῦ ζῶντος
  choice: sa Diyos na buháy
  rationale: Ang “Diyos na buháy” ay natural na biblikal na katawagan sa Tagalog at tumutukoy nang tiyak sa Diyos, kahit walang artikulo ang Griyego.
theological_decisions:
- issue: Kung ang ἀπιστίας ay nangangahulugang kawalan ng pananampalataya o kawalan ng katapatan
  choice: walang pananampalataya
  alternative: di-tapat
  rationale: Sa malapit na konteksto ng Hebreo 3, nangingibabaw ang kabiguang maniwala sa salita ng Diyos. Gayunman, itinatala sa talababa ang posibleng diwa ng kawalan ng katapatan.
- issue: Kung ang ἀποστῆναι ay isasalin bilang teknikal na “tumalikod sa pananampalataya” o mas leksikal na “tumalikod”
  choice: tumalikod
  alternative: lumayo; tuluyang tumalikod sa pananampalataya
  rationale: Seryoso ang babala ng pandiwa, ngunit hindi kailangang ipasok sa pangunahing teksto ang mas huling teknikal na kategoryang teolohikal. Pinananatili ng “tumalikod” ang bigat at ang saklaw ng orihinal.
- issue: Eksaktong ugnayan ng ἐν τῷ ἀποστῆναι sa pusong masama at walang pananampalataya
  choice: at sa gayo'y tumalikod
  alternative: na tumatalikod; sa pagtalikod
  rationale: Maaaring ipahiwatig ng konstruksyon ang kalagayan, pagpapakita, o bunga. Ang salin ay nagpapanatili ng malapit na kaugnayan nang hindi mahigpit na nagpapasya sa iisang gramatikal na kategorya.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “mga kapatid” bilang likas na tawag sa kapwa mananampalataya at “Diyos na buháy” upang mapanatili ang biblikal na katawagan. Inilagay ang diin sa malinaw na babala nang hindi ginagawang teknikal ang “tumalikod.”
