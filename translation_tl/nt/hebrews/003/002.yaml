id: HEB.3.2
reference: Hebrews 3:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πιστὸν ὄντα τῷ ποιήσαντι αὐτὸν ὡς καὶ Μωϋσῆς ⸀ἐν τῷ οἴκῳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/002.yaml
  text: who was faithful to the one who appointed him[b][a], just as Moses also was in all his house.
translation:
  language: tl
  text: na tapat sa humirang sa kanya[a], gaya rin ni Moises sa kanyang bahay[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa gumawa sa kanya.” Maaaring mangahulugan ang pandiwang Griyego na “gumawa,” ngunit dito ay malamang na tumutukoy ito sa paghirang o pagtatalaga.
    reason: lexical_alternative
  - marker: b
    text: Mababasa sa ilang manuskrito ang “sa kanyang buong bahay,” na malapit na umaalingawngaw sa Bilang 12:7. Malamang na bahay ng Diyos ang tinutukoy.
    reason: textual_variant
lexical_decisions:
- source_word: πιστὸν ὄντα
  choice: na tapat
  rationale: Ang pariralang pandiwaring ito ay tumutukoy kay Jesus sa naunang talata. Ang sugnay na “na tapat” ay natural sa Tagalog at nagpapahayag ng katapatan at pagiging mapagkakatiwalaan, hindi ng simpleng pagsampalataya.
- source_word: τῷ ποιήσαντι αὐτὸν
  choice: sa humirang sa kanya
  rationale: Bagaman karaniwang nangangahulugang “gumawa” ang ποιέω, maaari itong tumukoy sa paghirang o pagtatalaga. Sa konteksto ng tungkulin ni Jesus at ng paghahambing kay Moises, malinaw at natural ang “humirang,” habang itinatala sa talababa ang tunay na leksikal na alternatibo.
- source_word: ὡς καὶ
  choice: gaya rin
  rationale: Likas na ipinahahayag ng “gaya rin” ang tuwirang paghahambing ng katapatan ni Jesus at ni Moises.
- source_word: Μωϋσῆς
  choice: Moises
  rationale: Ito ang nakasanayang makabagong anyo ng pangalan sa Filipino.
- source_word: ἐν τῷ οἴκῳ αὐτοῦ
  choice: sa kanyang bahay
  rationale: Pinananatili ng “bahay” ang larawang bubuuin sa mga susunod na talata tungkol sa bahay at tagapagtayo. Hindi tinutukoy nang tahasan kung kanino tumutukoy ang “kanyang,” kaya napapanatili ang anyo at bahagyang kalabuan ng Griyego.
theological_decisions:
- issue: Kahulugan ng ποιήσαντι kapag tumutukoy kay Jesus
  choice: humirang
  alternative: gumawa
  rationale: Posible sa salita ang “gumawa,” ngunit sa kontekstong ito ay malamang na tumutukoy ito sa paghirang o pagtatalaga sa isang tungkulin. Iniiwasan din ng “humirang” ang hindi kinakailangang pahiwatig na nilalang ang Anak, nang hindi ikinukubli ang alternatibong literal na kahulugan, na inilalagay sa talababa.
- issue: Tinutukoy ng αὐτοῦ sa “kanyang bahay”
  choice: pinanatiling “kanyang bahay”
  alternative: bahay ng Diyos
  rationale: Malamang na bahay ng Diyos ang tinutukoy dahil sa paghahambing kay Moises at sa alingawngaw ng Bilang 12:7, ngunit hindi ito tahasang nililinaw sa pangunahing teksto upang mapanatili ang panghalip at ang posibleng tensiyon sa orihinal.
- issue: Pagkakaroon ng salitang “buong” sa parirala tungkol sa bahay
  choice: hindi isinama sa pangunahing teksto
  alternative: sa kanyang buong bahay
  rationale: Wala ang katumbas ng “buong” sa ibinigay na pangunahing teksto ng SBLGNT, bagaman naroon ito sa ilang manuskrito at malapit na umaalingawngaw sa Bilang 12:7. Kaya inilagay ang mas mahabang pagbasa sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang “bahay” sa halip na “sambahayan” upang maipagpatuloy ang larawan ng bahay at tagapagtayo sa kasunod na argumento. Nagsisimula sa “na” dahil ang parirala ay nagpapatuloy sa pagtukoy kay Jesus mula sa Hebreo 3:1.
