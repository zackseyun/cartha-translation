  text: μέτοχοι γὰρ ⸂τοῦ Χριστοῦ γεγόναμεν⸃, ἐάνπερ τὴν ἀρχὴν τῆς ὑποστάσεως μέχρι τέλους βεβαίαν κατάσχωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/014.yaml
  text: For we have become sharers in the Messiah, if indeed we hold the beginning of our assurance firm to the end.
translation:
  language: tl
  text: Sapagkat naging mga kabahagi tayo ng Mesiyas[a], kung talagang pananatilihin nating matatag hanggang sa wakas ang pagtitiwalang[b] taglay natin mula pa sa simula.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga nakikibahagi sa Mesiyas” o “mga may bahagi sa Mesiyas.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “katiyakan” o “matatag na paninindigan.” Ang salitang Griyego ay maaari ring mangahulugang “saligan,” “katunayan,” o “tunay na kalagayan” sa ibang konteksto.
    reason: lexical_alternative
  - marker: c
    text: 'Mas pormal: “kung pananatilihin nating matatag hanggang sa wakas ang pasimula ng ating pagtitiwala.”'
    reason: formal_alternative
lexical_decisions:
- source_word: μέτοχοι
  choice: mga kabahagi
  rationale: Ipinahahayag nito ang mga taong may bahagi o nakikibahagi sa isang bagay. Likas at malinaw ang “mga kabahagi” sa makabagong Filipino at hindi nito nililimitahan kung ang diin ay pakikibahagi, pakikipag-ugnayan, o pagiging kasama.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikita ng pangatnig na ang pahayag ay nagbibigay ng dahilan o paliwanag sa naunang babala at panghihikayat.
- source_word: τοῦ Χριστοῦ
  choice: ng Mesiyas
  rationale: Ginagamit dito ang Χριστός bilang titulong tumutukoy sa ipinangakong Mesiyas. Pinananatili ng “ng” ang ugnayang genitibo nang hindi lubusang nilulutas ang saklaw nito.
- source_word: γεγόναμεν
  choice: naging ... tayo
  rationale: 'Pinananatili nito ang diwa ng perpektong pandiwa: isang kalagayang nagsimula na at nananatiling totoo sa kasalukuyan.'
- source_word: ἐάνπερ
  choice: kung talagang
  rationale: Masasalamin nito ang mariing kondisyon kaysa sa payak na “kung,” ngunit hindi nito ipinapaliwanag ang kondisyon ayon sa isang partikular na sistemang teolohikal.
- source_word: τὴν ἀρχὴν τῆς ὑποστάσεως
  choice: ang pagtitiwalang taglay natin mula pa sa simula
  rationale: Natural itong Filipino para sa pagtitiwala o matatag na disposisyong taglay mula sa pasimula. Inililipat ang literal na nominal na ayos upang maging malinaw, habang itinatala sa talababa ang mas pormal na anyo.
- source_word: μέχρι τέλους
  choice: hanggang wakas
  rationale: Tumutukoy ito sa patuloy na pananatili sa buong takbo hanggang sa kahihinatnan.
- source_word: βεβαίαν κατάσχωμεν
  choice: pananatilihin nating matatag
  rationale: Magkasamang ipinahahayag ng mga salitang ito ang matibay na paghawak at hindi pagbitiw. Ang anyong panghinaharap sa sugnay na kondisyon ay natural sa Filipino at hindi binabago ang kondisyonal na puwersa ng Griyego.
theological_decisions:
- issue: Kondisyon at pagtitiis hanggang wakas
  choice: Pinanatili ang tunay at mariing kondisyon sa “kung talagang ... hanggang wakas.”
  alternative: Maaaring ipakahulugan na ang pagtitiis ay patunay lamang ng naunang pakikibahagi, o na nakasalalay rito ang patuloy na pakikibahagi.
  rationale: Naghahayag ang Griyego ng kondisyon ngunit hindi nito tahasang nilulutas ang mga susunod na pagtatalong teolohikal tungkol sa pagtitiis, pagtalikod, o katiyakan. Hindi pinapanigan ng salin ang alinmang sistematikong pagbasa.
- issue: Saklaw ng genitibong τοῦ Χριστοῦ
  choice: “mga kabahagi ... ng Mesiyas”
  alternative: “mga nakikibahagi sa Mesiyas” o “mga kasama ng Mesiyas”
  rationale: Maaaring ipahiwatig ng parirala ang pakikibahagi sa Mesiyas o pagiging kasama/katuwang niya. Pinananatili sa teksto ang maikling genitibong anyo at inilalahad sa talababa ang mga pangunahing posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Sapagkat” upang mapanatili ang ugnayang paliwanag sa konteksto, “Mesiyas” para sa titulong Χριστός, at natural na ayos na “pagtitiwalang taglay natin mula pa sa simula” upang maiwasan ang alanganing literalismo. Lahat ng talababa ay may katumbas na pananda sa pangunahing teksto.
