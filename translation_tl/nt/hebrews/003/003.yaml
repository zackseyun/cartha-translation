id: HEB.3.3
reference: Hebrews 3:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πλείονος γὰρ ⸂οὗτος δόξης⸃ παρὰ Μωϋσῆν ἠξίωται καθ’ ὅσον πλείονα τιμὴν ἔχει τοῦ οἴκου ὁ κατασκευάσας αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/003.yaml
  text: For this one has been counted worthy of more glory than Moses, just as the one who built the house has greater honor than the house.
translation:
  language: tl
  text: Sapagkat ang isang ito ay itinuring na karapat-dapat sa higit na kaluwalhatian kaysa kay Moises, yamang ang nagtayo ng bahay ay may higit na karangalan kaysa sa bahay.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: ang isang ito
  rationale: Pinananatili ang demonstratibong pagtukoy sa naunang binanggit na si Jesus nang hindi nagdaragdag ng pangalang wala sa talata.
- source_word: ἠξίωται
  choice: itinuring na karapat-dapat
  rationale: Inihahayag ang perfect passive na pagtataya o pagkilalang karapat-dapat, sa halip na simpleng pagtanggap lamang.
- source_word: δόξης
  choice: kaluwalhatian
  rationale: Karaniwang salitang biblikal na tumutugma sa δόξα at naiiba sa τιμή sa kasunod na paghahambing.
- source_word: καθ’ ὅσον
  choice: kung paanong
  rationale: Natural na inilalahad ang antas at batayan ng paghahambing sa kontekstong ito nang hindi ginagawang purong sanhi ang parirala.
- source_word: κατασκευάσας
  choice: nagtayo
  rationale: Sa talinghaga ng bahay, malinaw at likas na salin ito para sa gumawa o naghanda nito.
- source_word: οἴκου
  choice: bahay
  rationale: Pinananatili ang konkretong larawan at ang posibleng mas malawak na diwa ng sambahayan o sambayanan sa konteksto, nang hindi ito tahasang nilulutas.
- source_word: τιμὴν
  choice: karangalan
  rationale: Pinananatili ang leksikal na pagkakaiba nito sa δόξης, bagaman magkaugnay ang dalawang konsepto.
theological_decisions:
- issue: Pagkakakilanlan ng οὗτος
  choice: Isinaling “ang isang ito” ayon sa tahasang demonstratibo ng Griyego.
  alternative: “Si Jesus” o “si Cristo”
  rationale: Malinaw sa konteksto ang tinutukoy, ngunit hindi tahasang inuulit ng talata ang pangalan; hindi ito idinagdag sa pangunahing teksto.
- issue: Kahulugan ng οἶκος
  choice: Pinanatiling “bahay.”
  alternative: “sambahayan” o “sambayanan ng Diyos”
  rationale: Mahalaga sa pangangatwiran ang larawan ng isang gusali, habang may mas malawak na teolohikal na gamit ang salita sa nakapaligid na konteksto; ang literal na larawan ang pinakamahusay na nagpapanatili sa dalawang antas.
translation_notes:
  register: Makabago at marangal na Filipino; malinaw sa karaniwang mambabasa. Pinanatili ang pagkakaiba ng “kaluwalhatian” at “karangalan” at ang retorikal na larawan ng bahay.
