id: HEB.3.17
reference: Hebrews 3:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τίσιν δὲ προσώχθισεν τεσσεράκοντα ἔτη; οὐχὶ τοῖς ἁμαρτήσασιν, ὧν τὰ κῶλα ἔπεσεν ἐν τῇ ἐρήμῳ;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/017.yaml
  text: And with whom was he angry for forty years? Was it not with those who sinned[a], whose bodies fell in the wilderness?
translation:
  language: tl
  text: At kanino siya nagalit sa loob ng apatnapung taon? Hindi ba sa mga nagkasala, na ang mga bangkay ay nabuwal sa ilang?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσώχθισεν
  choice: nagalit
  rationale: Likas at malinaw sa modernong Tagalog ang “nagalit” para sa pagkagalit o pagkamuhi na ipinahihiwatig ng pandiwa, nang hindi pinatitindi nang higit sa kailangan.
- source_word: τεσσεράκοντα ἔτη
  choice: sa loob ng apatnapung taon
  rationale: Karaniwang paraan ito sa Tagalog upang ipahayag ang tagal ng panahon.
- source_word: ἁμαρτήσασιν
  choice: mga nagkasala
  rationale: Tuwiran at natural nitong inilalarawan ang mga taong gumawa ng kasalanan sa salinlahing nasa ilang.
- source_word: κῶλα
  choice: mga bangkay
  rationale: Bagaman literal na maaaring tumukoy sa mga bahagi ng katawan, sa kontekstong ito ay tumutukoy ito sa mga katawang patay na naiwan sa ilang. Pinananatili ng “mga bangkay” ang matinding larawan ng paghatol.
- source_word: ἔπεσεν
  choice: nabuwal
  rationale: Pinananatili nito ang larawan ng pagbagsak at ipinahihiwatig ang kamatayan nang hindi idinaragdag ang salitang “namatay.”
- source_word: ἐν τῇ ἐρήμῳ
  choice: sa ilang
  rationale: Ang “ilang” ay maikli, biblikal, at malinaw na tumutukoy sa lugar ng paggala ng Israel, hindi lamang sa isang disyerto.
theological_decisions:
- issue: Ang ipinahihiwatig na simuno ng προσώχθισεν
  choice: siya, na tumutukoy sa Diyos
  alternative: tahasan ang “Diyos”
  rationale: Ipinahihiwatig ng konteksto na Diyos ang simuno. Pinananatili ng panghalip na “siya” ang anyo ng Griyego at ang ugnayan sa nakapaligid na talata nang hindi nagdaragdag ng pangngalan sa mismong teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “sa ilang” bilang pamilyar na katawagang biblikal at “mga bangkay” upang mapanatili ang bigat ng κῶλα sa konteksto.
