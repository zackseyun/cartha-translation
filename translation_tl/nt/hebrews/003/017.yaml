  source_fidelity: Tumpak ang salin sa dalawang retorikal na tanong. Ang “siya” ay wastong tumutukoy sa Diyos mula sa konteksto; ang “nagalit,” “sa loob ng apatnapung taon,” “mga nagkasala,” at “sa ilang” ay angkop na katumbas ng προσώχθισεν, τεσσεράκοντα ἔτη, ἁμαρτήσασιν, at ἐν τῇ ἐρήμῳ. Ang “mga bangkay ay nabuwal” ay wastong nagpapahayag ng larawan ng κῶλα ... ἔπεσεν sa konteksto ng paghatol sa ilang, nang hindi tahasang nagdaragdag ng “namatay.”
  naturalness: Natural at marangal ang modernong Tagalog. Ang “sa loob ng apatnapung taon” ay malinaw na pagpapahayag ng tagal. Bagaman matindi ang “mga bangkay,” angkop ito sa makasaysayan at mapanghatol na konteksto at maayos ang pagkakatugma nito sa “nabuwal.”
  terminology: 'Ang mga pangunahing katawagan ay pare-pareho at angkop sa rehistrong biblikal na modernong Filipino: “nagalit,” “nagkasala,” at “ilang.” Walang terminolohiyang sektaryan o doktrinal na idinagdag.'
