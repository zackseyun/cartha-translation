  text: and let us consider one another[a], to stir up love and good works,
translation:
  language: tl
  text: At pag-isipan nating mabuti ang isa’t isa upang mag-udyukan[a] sa pag-ibig at mabubuting gawa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pukawin” o “udyukan nang matindi.” Ang pangngalang Griyego na παροξυσμός ay maaaring tumukoy sa malakas na pag-uudyok o pagpukaw.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοῶμεν
  choice: pag-isipan natin nang mabuti
  rationale: 'Ang present subjunctive ay hortatory: isang sama-samang panawagan. Ipinahahayag ng parirala ang masusing pagbibigay-pansin, hindi lamang payak na pag-iisip.'
- source_word: ἀλλήλους
  choice: ang isa’t isa
  rationale: Karaniwang katumbas ng reciprocal pronoun at pinananatili ang pangkomunidad na diin ng talata.
- source_word: εἰς παροξυσμὸν
  choice: kung paano natin mahihikayat ... na
  rationale: Ipinahahayag ng εἰς ang layunin o kinalabasan, samantalang ang παροξυσμός ay malakas na pag-udyok o pagpukaw. Natural sa modernong Tagalog ang konstruksiyong ito at hindi nito ginagawang negatibo ang diwa.
- source_word: ἀγάπης
  choice: umibig
  rationale: Ginawang pandiwa upang maging natural kasunod ng 'mahihikayat ... na,' habang pinananatili ang diwa ng ἀγάπη bilang pag-ibig.
- source_word: καλῶν ἔργων
  choice: gumawa ng mabuti
  rationale: Natural at malinaw na Tagalog para sa 'mabubuting gawa'; hindi ito nagpapahiwatig ng anumang partikular na doktrina tungkol sa merito.
- source_word: καὶ
  choice: At / at
  rationale: Ang unang καί ay nag-uugnay sa naunang pangaral, at ang ikalawa ay nag-uugnay sa pag-ibig at mabubuting gawa.
theological_decisions:
- issue: Maaaring negatibo o matalim ang dating ng παροξυσμός
  choice: mahihikayat
  alternative: mapupukaw / mauudyukan nang matindi
  rationale: Positibo ang tuwirang mga layon—pag-ibig at mabubuting gawa—kaya ginamit sa pangunahing teksto ang natural na positibong salita, habang pinananatili sa talababa ang lakas at saklaw ng salitang Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang inclusive na hortatoryong 'natin' at natural na pariralang 'pag-isipan ... kung paano' upang ipakita na ang isa’t isa ang masusing isinasaalang-alang para sa layuning pukawin ang pag-ibig at mabubuting gawa.
