  text: ἀδύνατον γὰρ αἷμα ταύρων καὶ τράγων ἀφαιρεῖν ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/004.yaml
  text: For it is impossible for the blood of bulls and goats to take away sins[a].
translation:
  language: tl
  text: Sapagkat imposibleng alisin ng dugo ng mga toro at mga lalaking kambing ang mga kasalanan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tanggalin ang mga kasalanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδύνατον
  choice: imposible
  rationale: Panaguring pang-uri ito na kaugnay ng pawatas na ἀφαιρεῖν. Ang “imposible” ay natural sa makabagong Filipino at pinananatili ang ganap na diin ng pahayag.
- source_word: γὰρ
  choice: sapagkat
  rationale: Nagbibigay ito ng paliwanag at batayan sa naunang argumento; malinaw na ipinahahayag ng “sapagkat” ang ugnayang iyon.
- source_word: αἷμα
  choice: dugo
  rationale: Tahasang tumutukoy ang Griyego sa dugong inihahandog, isang mahalagang larawan sa argumento ng Hebreo, kaya hindi ito pinalitan ng “handog” o “kamatayan.”
- source_word: ταύρων
  choice: ng mga toro
  rationale: Pinananatili ang maramihang anyo at ang tuwirang kaugnayan nito sa “dugo.”
- source_word: τράγων
  choice: ng mga lalaking kambing
  rationale: Ang τράγος ay tiyak na lalaking kambing. Bagaman maaaring sapat sa ilang konteksto ang “kambing,” malinaw at natural pa rin sa Filipino ang mas eksaktong katawagan.
- source_word: ἀφαιρεῖν
  choice: alisin
  rationale: Tumpak at natural na ipinapahayag ng “alisin” ang pag-aalis o pagtanggal ng mga kasalanan nang hindi nagdaragdag ng paliwanag na teolohikal.
- source_word: ἁμαρτίας
  choice: mga kasalanan
  rationale: Pinananatili ang tahasang maramihang anyo ng Griyego.
theological_decisions:
- issue: Bisa ng dugo ng mga hayop sa pag-aalis ng mga kasalanan
  choice: Tahasang sinasabi ng talata na hindi kayang alisin ng dugo ng mga hayop ang mga kasalanan.
  alternative: Nagbibigay ang mga handog ng pansamantalang pagtatakip o rituwal na paglilinis ngunit hindi pangwakas na pag-aalis.
  rationale: Hindi ipinasok sa pangunahing teksto ang mas malawak na paliwanag tungkol sa saklaw o uri ng bisa ng mga handog. Pinananatili ng “alisin” ang pahayag at teolohikal na tensiyon ng Griyego sa loob ng argumento ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ayos na “imposibleng alisin ng dugo…” upang maging natural habang nananatiling malapit sa estruktura at diin ng Griyego.
