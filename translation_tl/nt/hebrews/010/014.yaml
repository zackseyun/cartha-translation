  yaml_path: translation/nt/hebrews/010/014.yaml
  text: For by one offering he has perfected for all time those who are being sanctified[a].
translation:
  language: tl
  text: Sapagkat sa pamamagitan ng iisang handog, ginawa niyang ganap magpakailanman ang mga patuloy na binabanal[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga patuloy na ginagawang banal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μιᾷ
  choice: iisang
  rationale: Binibigyang-diin ng anyong ito na isa lamang ang handog; natural sa Tagalog ang “iisang” bilang panuring sa “handog.”
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikita nito na ang talata ay nagbibigay ng paliwanag o batayan para sa naunang pahayag.
- source_word: προσφορᾷ
  choice: handog
  rationale: Tuwirang katumbas ito ng alay na inihahandog sa Diyos at hindi nito higit na nililimitahan ang salita sa “hain,” bagaman malinaw sa konteksto ang sakripisyal na diwa.
- source_word: τετελείωκεν
  choice: ginawa niyang ganap
  rationale: Ipinahahayag ng perpektong pandiwa ang natapos na gawa na may nananatiling bunga. Natural at malinaw sa modernong Tagalog ang “ginawa niyang ganap.”
- source_word: εἰς τὸ διηνεκές
  choice: magpakailanman
  rationale: Ipinahahayag nito ang walang-hanggang bisa ng naganap na gawain, at maayos itong umuugnay sa “ginawa niyang ganap.”
- source_word: τοὺς ἁγιαζομένους
  choice: ang mga pinababanal
  rationale: Ang aspektong imperpektibo ng “pinababanal” ay nagpapanatili sa patuloy na kilos ng kasalukuyang pasibong participle nang hindi nagiging mabigat ang pangungusap.
theological_decisions:
- issue: Ugnayan ng natapos na pagpapaganap at nagpapatuloy na pagpapabanal
  choice: 'Panatilihin ang dalawang dimensiyon: “ginawa niyang ganap magpakailanman” at “mga pinababanal.”'
  alternative: Ipaliwanag ang dalawa bilang pawang natapos na kalagayan, o gawing pawang nagpapatuloy na proseso.
  rationale: Sadyang pinagsasama ng Griyego ang natapos na gawa na may nananatiling bunga (τετελείωκεν) at ang nagpapatuloy na pasibong kilos o pagkakakilanlan (ἁγιαζομένους). Hindi nilulutas ng salin ang tensiyong ito ayon sa isang tiyak na sistemang doktrinal.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang bokabularyong biblikal na “handog,” “ganap,” at “pinababanal,” ngunit iniwasan ang lipas o labis na teknikal na pananalita.
