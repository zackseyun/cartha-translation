  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ δίκαιός ⸀μου ἐκ πίστεως ζήσεται, καὶ ἐὰν ὑποστείληται, οὐκ εὐδοκεῖ ἡ ψυχή μου ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/038.yaml
  text: But my righteous one will live by faith[a], and if he shrinks back[c][b], my soul takes no pleasure in him.
translation:
  language: tl
  text: Ngunit ang aking matuwid[b] ay mabubuhay sa pananampalataya[a]; at kung siya ay umurong, walang kaluguran ang aking kaluluwa sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa pagtitiwala” o “sa katapatan.” Saklaw ng salitang Griyego na pistis ang mga diwang ito.
    reason: lexical_alternative
  - marker: b
    text: Sa ilang manuskrito, “ang matuwid” lamang ang mababasa sa halip na “ang aking matuwid.”
    reason: textual_variant
lexical_decisions:
- source_word: ὁ δίκαιός μου
  choice: ang aking matuwid
  rationale: Ginawang pangngalan ang pang-uring may pantukoy, gaya sa Griyego. Likas sa Filipino ang “ang aking matuwid” at hindi nito kailangang tukuyin ang kasarian.
- source_word: ἐκ πίστεως
  choice: sa pananampalataya
  rationale: Ipinapahayag ng ἐκ ang batayan o pinagmumulan ng pamumuhay. “Sa pananampalataya” ang natural at karaniwang salin; inilalagay sa talababa ang maaari ring diwang pagtitiwala o katapatan.
- source_word: ζήσεται
  choice: mabubuhay
  rationale: Tuwirang isinasalin ang panghinaharap na anyo ng ζάω habang pinananatili ang posibleng lawak ng kahulugang buhay.
- source_word: ὑποστείληται
  choice: umurong
  rationale: Ipinahihiwatig ng pandiwa ang pag-atras o pagtalikod sa harap ng panggigipit. Maikli at natural ang “umurong” sa konteksto ng babala.
- source_word: οὐκ εὐδοκεῖ
  choice: hindi ... kinalulugdan
  rationale: Malapit itong tumutugma sa diwang hindi nasisiyahan o walang kaluguran, at natural sa marangal na Filipino.
- source_word: ἡ ψυχή μου
  choice: aking kaluluwa
  rationale: Pinananatili ang tahasang ekspresyong “aking kaluluwa” sa Griyego at ang alingawngaw nito sa kasulatang sinipi, sa halip na gawing simpleng “ako.”
- source_word: ἐν αὐτῷ
  choice: siya
  rationale: Sa pandiwang “kinalulugdan,” natural sa Filipino ang tuwirang pokus na “siya”; naipapahayag nito ang taong tinutukoy ng Griyegong ἐν αὐτῷ nang hindi pilit ang literal na pang-ukol.
theological_decisions:
- issue: Kahulugan ng πίστις sa ἐκ πίστεως
  choice: pananampalataya
  alternative: pagtitiwala o katapatan
  rationale: Pinipili sa pangunahing teksto ang karaniwang kahulugang “pananampalataya,” ngunit hindi isinasara ang tunay na leksikal na posibilidad ng pagtitiwala o katapatan.
- issue: Tinutukoy ng paksa sa kondisyong ἐὰν ὑποστείληται
  choice: ang kaparehong isahang taong unang tinawag na “aking matuwid”
  alternative: isang di-tiyak na taong naiiba sa “aking matuwid”
  rationale: Walang hayagang pagpapalit ng paksa sa Griyego. Pinananatili ng salin ang daloy at tensiyong teolohikal ng babala sa halip na lutasin ito.
- issue: Kasarian ng isahang reperente
  choice: siya
  alternative: lalaking panghalip na tahasang may kasarian
  rationale: Bagaman panlalaki ang anyong Griyego, ang panghalip na Filipino na “siya” ay likas na walang tinutukoy na kasarian at tumpak na nagpapanatili ng isahang reperente nang hindi nagpapasok ng kasariang hindi kailangang tahasang sabihin sa Filipino.
- issue: Tekstuwal na presensya ng μου
  choice: aking matuwid
  alternative: ang matuwid
  rationale: Sinusunod ang SBLGNT na may μου, habang itinatala sa talababa ang mahalagang baryanteng wala nito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang pariralang “aking kaluluwa” dahil tahasan ito sa Griyego at bahagi ng estilo ng sipi. Hindi na kailangan ang hiwalay na talababa tungkol sa panlalaking panghalip sapagkat ang Filipino na “siya” ay walang kasariang gramatikal.
