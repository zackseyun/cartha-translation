base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/019.yaml
  text: Therefore, brothers, since we have boldness to enter the holy places by the blood of Jesus,
translation:
  language: tl
  text: Kaya nga, mga kapatid[a], yamang may lakas-loob tayong pumasok sa mga banal na dako[b] sa pamamagitan ng dugo ni Jesus,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga kapatid” ay maaaring tumukoy sa lahat ng mananampalataya sa kongregasyon.
    reason: lexical_alternative
  - marker: b
    text: O “santuwaryo”; sa larawan ng tabernakulo sa Hebreo, tumutukoy ito sa banal na dako ng presensya ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔχοντες
  choice: yamang may … tayo
  rationale: Ang participle ay nagbibigay ng batayan para sa kasunod na panawagan. Likas sa Tagalog ang “yamang may” at napapanatili nito ang lohikal o sanhiing puwersa.
- source_word: οὖν
  choice: Kaya nga
  rationale: Malinaw nitong ipinahihiwatig ang kongklusyon o paghinuha mula sa naunang pangangatwiran.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Ang “mga kapatid” ay likas na tawag sa buong kongregasyon sa Tagalog at hindi kailangang tukuyin ang kasarian, samantalang pinananatili ang pampamilyang larawan ng Griyego.
- source_word: παρρησίαν
  choice: lakas-loob
  rationale: Ipinahahayag nito ang malaya at matatag na pagtitiwala sa paglapit sa Diyos, nang hindi ginagawang pangahas ang diwa.
- source_word: εἰς τὴν εἴσοδον
  choice: pumasok
  rationale: Ang pariralang nominal na tumutukoy sa pagpasok ay likas na naipapahayag sa Tagalog sa pamamagitan ng pandiwang “pumasok,” habang pinananatili ang diwa ng pagkakaroon ng daan o pahintulot.
- source_word: τῶν ἁγίων
  choice: mga banal na dako
  rationale: Tumutukoy ito sa banal na saklaw o santuwaryo ng presensya ng Diyos sa larawang-tabernakulo ng Hebreo. Pinananatili ng maramihang “mga banal na dako” ang anyo at lawak ng Griyego nang hindi ito nililimitahan agad sa Kabanal-banalang Dako.
- source_word: ἐν τῷ αἵματι Ἰησοῦ
  choice: sa pamamagitan ng dugo ni Jesus
  rationale: Likas nitong ipinapahayag ang dugo ni Jesus bilang paraan o batayan ng pagpasok at pinananatili ang sakripisyal na puwersa ng pahayag.
theological_decisions:
- issue: Saklaw ng τῶν ἁγίων
  choice: mga banal na dako na kaugnay ng banal na presensya ng Diyos
  alternative: ang santuwaryo; ang Kabanal-banalang Dako; ang mga banal na tao
  rationale: Ang tuloy-tuloy na larawan ng tabernakulo sa Hebreo ay pumapabor sa kahulugang pangkulto at panlunan. Hindi ito isinaling “Kabanal-banalang Dako” upang huwag paliitin nang higit sa hinihingi ng Griyego.
- issue: Saklaw ng ἀδελφοί
  choice: mga kapatid, bilang tawag sa buong kongregasyon
  alternative: mga kapatid na lalaki; mga kapatid na lalaki at babae
  rationale: Sa modernong Tagalog, ang “mga kapatid” ay natural na walang tiyak na kasarian at maaaring kumatawan sa buong kapulungan, habang tapat pa rin sa pampamilyang tawag ng teksto.
- issue: Puwersa ng παρρησία
  choice: lakas-loob na lumapit o pumasok
  alternative: pagtitiwala; kalayaan; katapangan
  rationale: Pinananatili ng “lakas-loob” ang matibay ngunit magalang na pagtitiwala sa paglapit sa Diyos, nang hindi binubura ang tensiyon sa pagitan ng banal na presensya at malayang pagpasok.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Kaya nga” para sa lohikal na ugnayan, “yamang” para sa batayan ng kasunod na panawagan, at “mga banal na dako” upang mapanatili ang larawang pangsantuwaryo at ang hindi ganap na tinukoy na saklaw ng Griyego.
