base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/036.yaml
  text: For you have need of endurance[a], so that after doing the will of God you may receive the promise.
translation:
  language: tl
  text: Sapagkat kailangan ninyo ng pagtitiyaga upang, matapos ninyong gawin ang kalooban ng Diyos, matanggap ninyo ang pangako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang ipinangako.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπομονῆς
  choice: pagtitiis
  rationale: Tumutukoy ang ὑπομονή sa matatag na pananatili sa gitna ng hirap o panggigipit. Likas at malinaw sa modernong Filipino ang “pagtitiis” at hindi nito dinaragdagan ang kahulugan ng teksto.
- source_word: χρείαν ἔχετε
  choice: kailangan ninyo ng
  rationale: Ang idyomang χρείαν ἔχειν ay nangangahulugang “mangailangan.” Ang “kailangan ninyo ng” ay tuwiran at natural sa Filipino.
- source_word: ἵνα
  choice: upang
  rationale: Ipinahahayag ng ἵνα ang layunin o inaasahang resulta; ang “upang” ay angkop sa marangal ngunit madaling maunawaang rehistro.
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: ang kalooban ng Diyos
  rationale: Tuwirang pinananatili nito ang genitibong parirala at ang karaniwang biblikal na katawagan sa Filipino.
- source_word: ποιήσαντες
  choice: matapos ninyong gawin
  rationale: Ang aorist participle ay karaniwang nagpapahiwatig ng kilos na nauuna sa pangunahing pandiwa. Nililinaw ng “matapos ninyong gawin” ang temporal na ugnayang iyon.
- source_word: κομίσησθε
  choice: matanggap ninyo
  rationale: Sa kontekstong ito, ang κομίζω ay nangangahulugang tumanggap o magtamo. Pinili ang “matanggap” bilang natural at malinaw na katumbas.
- source_word: τὴν ἐπαγγελίαν
  choice: ang pangako
  rationale: Maaaring tumukoy ang ἐπαγγελία sa pangako mismo o sa bagay na ipinangako. Pinananatili ng “ang pangako” ang anyo at tunay na kalabuan ng Griyego.
theological_decisions:
- issue: Kung ang ἐπαγγελίαν ay tumutukoy sa pangako mismo o sa katuparan/bagay na ipinangako
  choice: ang pangako
  alternative: ang ipinangako
  rationale: Literal na “ang pangako” ang Griyego, ngunit kasabay ng κομίσησθε maaari itong mangahulugang pagtanggap sa ipinangakong pagpapala. Pinananatili sa pangunahing teksto ang tensiyon ng pinagmulan at inilalagay sa talababa ang mas interpretatibong pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “Sapagkat” upang katawanin ang γάρ at iugnay ang talata sa naunang pangangatwiran; iniwasan ang labis na arkaiko o denominasyonal na pananalita.
