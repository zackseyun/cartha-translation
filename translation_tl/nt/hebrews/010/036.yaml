  rationale: Pinalitan ang “pagtitiis” ng “pagtitiyaga” upang mas maipahayag ang matatag na pagpapatuloy na tinutukoy ng ὑπομονή. Inayos ang bantas at ayos ng sugnay para sa natural na modernong Filipino, nang hindi binabago ang ugnayang temporal ng “matapos ninyong gawin” at “matanggap ninyo.” Pinanatili ang “ang pangako” at ang talababa upang huwag resolbahin ang kalabuan kung ang tinutukoy ay ang pangako o ang bagay na ipinangako.
