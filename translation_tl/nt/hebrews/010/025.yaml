id: HEB.10.25
reference: Hebrews 10:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: μὴ ἐγκαταλείποντες τὴν ἐπισυναγωγὴν ἑαυτῶν, καθὼς ἔθος τισίν, ἀλλὰ παρακαλοῦντες, καὶ τοσούτῳ μᾶλλον ὅσῳ βλέπετε ἐγγίζουσαν τὴν ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/025.yaml
  text: not neglecting our own gathering together[a], as is the habit of some[b], but encouraging one another—and all the more as you see the Day drawing near.
translation:
  language: tl
  text: na hindi pinababayaan ang ating pagtitipon[a], gaya ng nakaugalian ng ilan, kundi magpalakasan ng loob sa isa't isa—at lalo pa habang nakikita ninyong papalapit na ang Araw.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hindi iniiwan” o “hindi tinatalikuran ang ating pagtitipon.”
    reason: lexical_alternative
  - marker: b
    text: Ang “Araw” ay malamang na tumutukoy sa darating na Araw ng Panginoon o sa pangwakas na paghuhukom.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγκαταλείποντες
  choice: pinababayaan
  rationale: Saklaw nito ang pagpapabaya o pagtalikod sa isang gawain nang hindi awtomatikong nagpapahiwatig ng ganap na apostasya; natural din ito sa makabagong Tagalog.
- source_word: ἐπισυναγωγὴν ἑαυτῶν
  choice: ang ating pagtitipon
  rationale: Tumutukoy ito sa sama-samang pagkatipon ng mga mananampalataya. Iniiwasan ng “pagtitipon” ang pagpasok ng mas huling institusyonal na kahulugang gaya ng “serbisyo sa iglesia.”
- source_word: καθὼς ἔθος τισίν
  choice: gaya ng nakaugalian ng ilan
  rationale: Pinananatili nito ang diwa ng ἔθος bilang nakagawian o kinaugalian at ang banayad ngunit tahasang pagsaway.
- source_word: παρακαλοῦντες
  choice: nagpapalakas-loob sa isa't isa
  rationale: Sa konteksto ng pagtitiyaga at komunidad, ipinahahayag nito ang pagpapayo at paghikayat na nagpapatatag. Ang “sa isa't isa” ay di-tahasang layon na malinaw na ipinahihiwatig ng konteksto.
- source_word: τοσούτῳ μᾶλλον ὅσῳ
  choice: at lalo pang gawin ito habang
  rationale: Natural na inilalahad nito ang tumitinding pangangailangan habang papalapit ang tinutukoy na Araw.
- source_word: βλέπετε
  choice: nakikita ninyo
  rationale: Tuwirang salin ng pandiwang nasa ikalawang panauhang maramihan, nang hindi nililimitahan kung paano nila nakikilala ang paglapit.
- source_word: ἐγγίζουσαν τὴν ἡμέραν
  choice: papalapit na ang Araw
  rationale: Pinananatili ang buhay na larawang ang kinikilalang eskatolohikal na Araw ay nalalapit, nang hindi dinaragdagan ng katawagang wala sa Griyego.
theological_decisions:
- issue: Ang eskatolohikal na tinutukoy ng τὴν ἡμέραν
  choice: “ang Araw,” na may malaking titik
  alternative: “ang araw,” “ang Araw ng Panginoon,” o “ang araw ng paghuhukom”
  rationale: Ipinahihiwatig ng konteksto ang kinikilalang pangwakas na Araw. Ang malaking titik ay tumutulong na ipakita ito, ngunit hindi tahasang tinutukoy ng Griyego kung tatawagin itong Araw ng Panginoon o araw ng paghuhukom.
- issue: Ang di-tahasang layon ng παρακαλοῦντες
  choice: Idagdag ang “sa isa't isa”
  alternative: 'Iwanang walang tahasang layon: “kundi magpalakas-loob”'
  rationale: Malakas na ipinahihiwatig ng sama-samang konteksto ang gantihang pagkilos. Paglilinaw ito ng ugnayang pangdiskurso, hindi pagdaragdag ng doktrina.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pagtitipon” sa halip na mas institusyonal na katawagan, at “nagpapalakas-loob” upang maisama ang diwa ng paghikayat at pagpapatatag.
