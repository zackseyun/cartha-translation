  source_fidelity: Tumpak na naipapahayag ng draft ang pagbabawal sa pagpapabaya/pag-iwan sa pagtitipon, ang nakaugaliang gawin ng ilan, at ang papalapit na eskatolohikal na “Araw.” Ang “ating pagtitipon” ay angkop para sa τὴν ἐπισυναγωγὴν ἑαυτῶν, at hindi labis na institusyonal.
  naturalness: May bahagyang di-natural na gamit ang “nagpapalakas-loob sa isa't isa.” Sa makabagong Filipino, ang “magpalakas-loob” ay mas karaniwang tumutukoy sa pag-iipon ng sariling tapang; para sa mutuwal na παρακαλοῦντες, mas idiomatiko ang “magpalakasan ng loob.” Ang “at lalo pang gawin ito habang” ay nauunawaan ngunit nagdaragdag ng malabong “ito”; maaaring alisin nang hindi nawawala ang diin ng Griyego.
  terminology: Ang “pagtitipon,” “nakaugalian,” at “Araw” ay angkop. Ang malaking titik sa “Araw” ay maingat na naghuhudyat ng kinikilalang eskatolohikal na pagtukoy nang hindi idinaragdag ang “ng Panginoon” sa pangunahing teksto.
