  - severity: low
    issue: Ang “gawin ito” ay hindi tahasang nasa Griyego at maaaring magkaroon ng malabong saklaw.
    rationale: Bagaman katanggap-tanggap itong pagpapalinaw, sapat at mas tuwiran ang “lalo pa habang,” na pinananatili ang comparative force ng τοσούτῳ μᾶλλον ὅσῳ nang walang idinagdag na panghalip.
