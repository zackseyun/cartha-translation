  text: ἀνώτερον λέγων ὅτι ⸂Θυσίας καὶ προσφορὰς⸃ καὶ ὁλοκαυτώματα καὶ περὶ ἁμαρτίας οὐκ ἠθέλησας οὐδὲ εὐδόκησας, αἵτινες κατὰ ⸀νόμον προσφέρονται,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/008.yaml
  text: After saying above[a], “Sacrifices and offerings and whole burnt offerings and sin offerings you did not desire[c][b], nor did you delight in”—which are offered according to the law—
translation:
  language: tl
  text: Matapos niyang sabihin sa itaas, “Mga hain at mga handog, mga handog na sinusunog nang buo,[a] at mga handog para sa kasalanan[b] ay hindi mo ninais ni kinalugdan”—na inihahandog ayon sa Kautusan[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay tumutukoy sa mga handog na lubusang sinusunog sa altar.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “mga handog ukol sa kasalanan.”
    reason: lexical_alternative
  - marker: c
    text: Ibig sabihin, ayon sa Kautusan ni Moises.
    reason: cultural_note
lexical_decisions:
- source_word: ἀνώτερον λέγων
  choice: Matapos sabihin sa itaas
  rationale: Tumutukoy ito sa naunang bahagi ng sipi at natural na naghahanda sa kasunod na pahayag.
- source_word: Θυσίας καὶ προσφορὰς
  choice: mga handog na hain, mga kaloob
  rationale: Pinananatili ang dalawang magkaugnay ngunit magkahiwalay na katawagang panghandog; nililinaw ng “handog na hain” ang kultikong diwa ng θυσία.
- source_word: ὁλοκαυτώματα
  choice: mga handog na sinusunog nang buo
  rationale: Ipinahahayag ang tiyak na diwa ng handog na lubusang tinutupok sa altar, sa halip na ang maaaring malabong “sinunog na handog.”
- source_word: περὶ ἁμαρτίας
  choice: mga handog para sa kasalanan
  rationale: Pinananatili ang anyo at kaunting lawak ng pariralang Griyego habang malinaw na tumutukoy sa uring panghandog.
- source_word: οὐκ ἠθέλησας οὐδὲ εὐδόκησας
  choice: ay hindi mo ninais ni kinalugdan
  rationale: Pinananatili ang magkaibang diin ng pagnanais at pagkakaroon ng lugod o pagsang-ayon, nang hindi dinaragdagan ng tahasang layon ang ikalawang pandiwa.
- source_word: αἵτινες κατὰ νόμον προσφέρονται
  choice: gayong ang mga ito ay inihahandog ayon sa Kautusan
  rationale: Malinaw na ibinabalik ang panghalip sa lahat ng nakalistang handog at pinananatili ang tensiyon na ang mga ito ay itinakda ng Kautusan ngunit hindi ninais o kinalugdan sa sipi.
theological_decisions:
- issue: Ang negatibong pahayag tungkol sa mga handog na iniutos ng Kautusan
  choice: “hindi mo ninais ni kinalugdan”—gayong ang mga ito ay inihahandog ayon sa Kautusan
  alternative: “hindi mo ginusto ni ikinalugod,” na maaaring ipaliwanag bilang ganap na pagtanggi sa sistemang panghandog
  rationale: Pinananatili ang teolohikal na tensiyon ng teksto at hindi ipinapaliwanag nang lampas sa talata kung paano nauugnay ang kalooban ng Diyos sa mga handog na ayon sa Kautusan.
- issue: Pagkilala sa περὶ ἁμαρτίας bilang teknikal na uring panghandog
  choice: mga handog para sa kasalanan
  alternative: mga handog ukol sa kasalanan; mga handog pangkasalanan
  rationale: Malinaw ang kultikong gamit ngunit hindi isinasara ang literal na anyo ng parirala o dinaragdagan ng doktrinal na pagpapakahulugan.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang “Kautusan” bilang tiyak na katawagan sa Kautusan ni Moises. Ang dash sa hulihan ay nagpapanatili sa hindi pa tapos na daloy ng pangungusap patungo sa susunod na talata.
