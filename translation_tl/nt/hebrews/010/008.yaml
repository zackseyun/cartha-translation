revisions:
- from: Matapos sabihin sa itaas, “Ang mga handog na hain, mga kaloob, mga handog na sinusunog nang buo,[a] at mga handog para sa kasalanan[b] ay hindi mo ninais ni kinalugdan”—gayong ang mga ito ay inihahandog ayon sa Kautusan[c]—
  to: Matapos niyang sabihin sa itaas, “Mga hain at mga handog, mga handog na sinusunog nang buo,[a] at mga handog para sa kasalanan[b] ay hindi mo ninais ni kinalugdan”—na inihahandog ayon sa Kautusan[c]—
  rationale: Inalis ang di-likas na “handog na hain” at pinalitan ng magkahiwalay na “mga hain at mga handog.” Pinalitan ang “gayong ang mga ito ay” ng “na,” upang tumpak na maipakita ang pang-uring pagtukoy ng αἵτινες nang hindi ipinapasok ang isang tahasang konsesibong interpretasyon. Napanatili ang bukas na dash dahil nagpapatuloy ang pangungusap sa kasunod na talata.
