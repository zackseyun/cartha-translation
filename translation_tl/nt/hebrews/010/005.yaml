base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/005.yaml
  text: 'Therefore[a], when he comes into the world, he says: “Sacrifice and offering you did not desire, but a body you prepared for me.”'
translation:
  language: tl
  text: 'Kaya, sa pagpasok niya sa sanlibutan, sinasabi niya:


    “Hindi mo ninais ang hain at handog,

    ngunit naghanda ka para sa akin ng isang katawan[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa talatang ito, sinusundan ng Hebreo ang Griyegong pananalita ng Awit 40:6: “naghanda ka para sa akin ng isang katawan.” Ganito naman ang Hebreong teksto ng Awit 40:6: “binuksan mo ang aking mga tainga.”'
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: Kaya
  rationale: Malinaw at likas na ipinahihiwatig ang kongklusyon o bunga ng naunang pangangatwiran.
- source_word: εἰσερχόμενος εἰς τὸν κόσμον
  choice: sa pagpasok niya sa sanlibutan
  rationale: Pinananatili ang kasabayang diwa ng kasalukuyang participle nang hindi nagtatakda nang labis kung nakaraan o kasalukuyan ang kilos. Ang “sanlibutan” ay dignidad ngunit karaniwang salin ng κόσμος sa ganitong konteksto.
- source_word: λέγει
  choice: sinasabi niya
  rationale: Pinananatili ang kasalukuyang panahunan na karaniwang ginagamit sa Bagong Tipan sa pagpapakilala ng sipi sa Kasulatan.
- source_word: Θυσίαν καὶ προσφορὰν
  choice: hain at handog
  rationale: Pinananatiling magkaiba ang dalawang terminong panrelihiyon habang gumagamit ng payak at pamilyar na Filipino.
- source_word: οὐκ ἠθέλησας
  choice: Hindi mo ninais
  rationale: Ang “ninais” ay natural at may dignidad, at tumpak na naghahayag ng pagnanais o kalooban sa halip na simpleng pagkagusto.
- source_word: σῶμα
  choice: isang katawan
  rationale: Pinananatili ang kongkreto at isahang kahulugan ng salita at ang mahalagang gamit nito sa pangangatwiran ng Hebreo.
- source_word: δὲ
  choice: ngunit
  rationale: Malinaw na ipinakikita ang pagsalungat ng katawan sa naunang hain at handog.
- source_word: κατηρτίσω μοι
  choice: naghanda ka para sa akin
  rationale: Ang “naghanda” ay malinaw na katumbas ng καταρτίζω rito, at ang “para sa akin” ay natural na naghahayag ng diwa ng datibong μοι.
theological_decisions:
- issue: Magkaiba ang salitang sinipi ng Hebreo mula sa Griyegong Awit 40:6 at ang nasa Hebreong teksto ng Awit 40:6.
  choice: 'Isinalin ang mismong Griyegong teksto ng Hebreo: “naghanda ka para sa akin ng isang katawan.”'
  alternative: “Binuksan mo ang aking mga tainga,” ayon sa Hebreong teksto ng Awit 40:6.
  rationale: Ang tekstong isinasalin ay Hebreo 10:5, na malinaw na gumagamit ng σῶμα (“katawan”). Hindi ito dapat itugma nang palihim sa ibang anyo ng Awit; sa halip, ipinakikita sa talababa ang tunay na pagkakaiba.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “sanlibutan,” “hain,” at “handog” bilang pamilyar na bokabularyong biblikal nang hindi nagiging lipas o teknikal. Inilipat ang pananda ng talababa sa “katawan,” ang mismong salitang tinatalakay ng tala.
