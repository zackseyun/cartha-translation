  yaml_path: translation/nt/hebrews/010/033.yaml
  text: sometimes being publicly exposed to insults and afflictions[b][a], and at other times becoming partners with those who were treated that way.
translation:
  language: tl
  text: Minsan ay ginawa kayong tampulan ng madla sa pamamagitan ng mga paglibak at paghihirap[a], at minsan naman ay nakibahagi kayo sa dinaranas ng mga taong tinrato nang gayon[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “hayagang inilantad kayo sa mga paglibak at paghihirap.”
    reason: lexical_alternative
  - marker: b
    text: 'Posible rin: “nakibahagi kayo sa dinaranas ng mga namuhay o gumawi nang gayon.” Maaaring tumukoy ang pandiwang Griyego sa paraan ng pamumuhay, bagaman sa kontekstong ito ng pag-uusig ay mas malamang ang “mga taong tinrato nang gayon.”'
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτο μὲν ... τοῦτο δὲ
  choice: minsan ... at kung minsan naman
  rationale: Likas na ipinahahayag sa modernong Tagalog ang dalawang magkaugnay na anyo ng kanilang pagtitiis nang hindi nagiging matigas ang pananalita.
- source_word: ὀνειδισμοῖς
  choice: mga insulto
  rationale: Malinaw na ipinahahayag ang mapanlait na pananalita at pampublikong paghamak.
- source_word: θλίψεσιν
  choice: paghihirap
  rationale: Sapat ang lawak nito para sa matitinding kagipitan at pagdurusang dulot ng pag-uusig, nang hindi nililimitahan ang uri ng hirap.
- source_word: θεατριζόμενοι
  choice: hayagang inilantad kayo
  rationale: Pinananatili ang larawan ng paglalantad sa publiko bilang tampulan ng paghamak; ang mas matingkad na larawang 'ginawang panoorin ng madla' ay nasa talababa.
- source_word: κοινωνοὶ
  choice: mga kasama
  rationale: Ipinahahayag ang aktibong pakikiisa sa dinaranas ng iba, hindi lamang karaniwang pakikipagkaibigan.
- source_word: τῶν οὕτως ἀναστρεφομένων
  choice: ng mga tinrato nang gayon
  rationale: Sa konteksto ng pag-uusig, pinakamalamang na tumutukoy ito sa mga taong dumanas ng gayong pagtrato; pinananatili sa talababa ang posibleng kahulugang tumutukoy sa paraan ng pamumuhay.
- source_word: γενηθέντες
  choice: naging
  rationale: Natural at tuwirang ipinapakita ang pagpasok nila sa pakikiisa sa mga inuusig.
theological_decisions:
- issue: Kahulugan ng ἀναστρεφομένων sa konteksto
  choice: tumutukoy sa mga tinrato sa gayong paraan
  alternative: tumutukoy sa mga namuhay o gumawi sa gayong paraan
  rationale: Ang agarang konteksto ay tungkol sa paghamak, paghihirap, at pakikiisa sa mga inuusig. Gayunman, maaari ring tumukoy ang pandiwa sa paraan ng pamumuhay o paggawi, kaya hayagang itinatala ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang panghalip na “kayo” upang maging natural ang sugnay na may participle sa Griyego at mapanatili ang tuwirang pagtukoy sa mga mambabasa. Inilagay ang [a] pagkatapos ng buong pariralang saklaw ng mas matingkad na alternatibo, at ang [b] pagkatapos ng pariralang may tunay na leksikal na kalabuan.
