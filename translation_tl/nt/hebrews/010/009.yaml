base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/009.yaml
  text: Then he said[a], ‘Behold, I have come to do your will.’ He takes away the first so that he may establish the second.
translation:
  language: tl
  text: Pagkatapos ay sinabi niya, “Narito, naparito ako upang gawin ang kalooban mo.” Inaalis niya ang una upang itatag ang ikalawa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “una” at “ikalawa” ay malamang na tumutukoy sa unang kaayusan ng mga handog at sa pagsasagawa ng kalooban ng Diyos na natupad sa paghahandog ng Mesiyas. Maaari ring unawain ang mga ito nang mas makitid bilang dalawang pahayag sa siniping Awit, o nang mas malawak bilang luma at bagong tipan.
    reason: Pinapaliwanag ang malamang na tinutukoy habang pinananatili ang kaiklian at tunay na kalabuan ng Griyego sa pangunahing teksto.
lexical_decisions:
- source_word: τότε
  choice: Pagkatapos ay
  rationale: Ipinapakita ang pagkakasunod ng pahayag na ito sa naunang sipi at pangangatwiran, sa likas na modernong Tagalog.
- source_word: εἴρηκεν
  choice: sinabi niya
  rationale: Bagaman perpektong aspekto ang anyong Griyego at maaaring may patuloy na bisa ang sinabi, mas likas sa Tagalog ang payak na “sinabi niya”; hindi nito ipinagkakait ang bisa ng sipi sa kasalukuyang argumento.
- source_word: Ἰδοὺ
  choice: Narito
  rationale: Pinananatili ang mariin at marangal na pambungad ng pahayag nang hindi nagiging labis na makaluma.
- source_word: ἥκω
  choice: naparito ako
  rationale: Ipinahahayag ang pagdating na naganap na at ang presensiyang bunga nito; natural itong katumbas ng diwa ng ἥκω.
- source_word: τοῦ ποιῆσαι
  choice: upang gawin
  rationale: Malinaw na ipinapakita ang layunin ng pagparito, gaya ng articular infinitive sa Griyego.
- source_word: τὸ θέλημά σου
  choice: ang kalooban mo
  rationale: Ang “kalooban” ang tiyak at karaniwang salin para sa θέλημα sa kontekstong tumutukoy sa layunin o nais ng Diyos.
- source_word: ἀναιρεῖ
  choice: Inaalis niya
  rationale: Malapit sa kahulugang alisin o pawalang-bisa, ngunit hindi ipinapasok sa teksto ang mas tiyak na interpretasyong “pinawawalang-bisa” o “inaabolisa.”
- source_word: τὸ πρῶτον
  choice: ang una
  rationale: Pinananatili ang maikli at substantibong anyo ng Griyego, upang ang konteksto—hindi ang salin mismo—ang tumukoy sa tinutukoy nito.
- source_word: ἵνα
  choice: upang
  rationale: Malinaw at natural na ipinapahayag ang ugnayang layunin sa Tagalog.
- source_word: τὸ δεύτερον
  choice: ang ikalawa
  rationale: Pinananatili ang tuwirang paralelismo sa “ang una” at ang sadyang kaiklian ng Griyego.
- source_word: στήσῃ
  choice: itatag
  rationale: Ang “itatag” ay angkop sa diwa ng paglalagay o pagpapatibay na may bisa, at malinaw na kasalungat ng “inaalis.”
theological_decisions:
- issue: Tinutukoy ng “ang una” at “ang ikalawa”
  choice: Hindi tahasang pinangalanan sa pangunahing teksto; pinananatili ang “ang una” at “ang ikalawa.”
  alternative: Maaaring palawakin bilang unang kaayusan ng mga handog at ikalawang katuparan ng kalooban ng Diyos sa paghahandog ng Mesiyas; maaari ring unawain bilang dalawang pahayag sa sipi o, sa mas malawak na diwa, bilang luma at bagong tipan.
  rationale: Sa agarang konteksto ng Hebreo 10:8–10, malamang na inihahambing ang dating kaayusan ng mga handog sa pagsasakatuparan ng kalooban ng Diyos sa paghahandog ni Cristo. Gayunman, substantibong pang-uri lamang ang ginamit ng Griyego, kaya hindi nararapat na ilagay sa pangunahing teksto ang isang mas makitid na paliwanag.
- issue: Paksa ng “inaalis” at “itatag”
  choice: Pinanatili ang di-tiyak na “niya,” na sumusunod sa implicit na paksa ng Griyego at sa daloy ng sipi.
  alternative: Tahasang pangalanan si Cristo o ang Diyos bilang gumagawa.
  rationale: Hindi tahasang inuulit ng talata ang pangalan ng paksa. Ang pagdaragdag ng pangalan ay maaaring magpasya sa isang sintaktiko at teolohikong tanong na iniwan ng teksto sa konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “Narito” upang mapanatili ang tono ng kasulatan, samantalang ang “sinabi niya,” “naparito ako,” at “upang itatag” ay natural sa kasalukuyang gamit. Iniwasan ang labis na pagpapaliwanag sa pangunahing teksto.
