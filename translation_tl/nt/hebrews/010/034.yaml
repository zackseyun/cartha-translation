reference: Hebrews 10:34
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ γὰρ τοῖς ⸀δεσμίοις συνεπαθήσατε, καὶ τὴν ἁρπαγὴν τῶν ὑπαρχόντων ὑμῶν μετὰ χαρᾶς προσεδέξασθε, γινώσκοντες ἔχειν ⸀ἑαυτοὺς κρείττονα ⸀ὕπαρξιν καὶ μένουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/034.yaml
  text: For you also suffered together with the prisoners[a], and you accepted with joy the plundering of your possessions[b], knowing that you yourselves have a better and lasting possession.
translation:
  language: tl
  text: Sapagkat nakibahagi rin kayo sa pagdurusa ng mga bilanggo[a], at may galak ninyong tinanggap ang pag-agaw ng inyong mga ari-arian, yamang alam ninyong kayo mismo ay may higit na mabuti at nananatiling pag-aari.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nakiramay kayo sa mga bilanggo.” Maaaring mangahulugan ang pandiwang Griyego ng pakikiramay, ngunit malamang na kabilang dito ang pakikibahagi sa kanilang pagdurusa.
    reason: lexical_alternative
  - marker: b
    text: 'Ganito ang mababasa sa ilang manuskrito: “alam ninyong mayroon kayong higit na mabuting pag-aari sa langit, at ito ay nananatili.”'
    reason: textual_variant
lexical_decisions:
- source_word: δεσμίοις
  choice: mga bilanggo
  rationale: Tumutukoy ang δέσμιος sa mga taong nakagapos o nakabilanggo. Ang “mga bilanggo” ay tuwiran, malinaw, at natural sa modernong Filipino.
- source_word: συνεπαθήσατε
  choice: nakibahagi rin kayo sa pagdurusa
  rationale: Maaaring tumukoy ang συμπαθέω sa pakikiramay, ngunit ipinahihiwatig ng σύν- at ng konteksto ang aktibong pakikiisa sa dinaranas ng mga bilanggo, hindi lamang damdamin ng awa.
- source_word: ἁρπαγήν
  choice: pag-agaw
  rationale: Ang ἁρπαγή ay sapilitan o marahas at di-makatarungang pagkuha. Mas naipakikita ng “pag-agaw” ang puwersa nito kaysa sa mas opisyal na “pagkumpiska.”
- source_word: τῶν ὑπαρχόντων ὑμῶν
  choice: sa inyong mga ari-arian
  rationale: Ginamit bilang pangngalan ang participle upang tukuyin ang mga pag-aari o materyal na kagamitan ng mga mambabasa.
- source_word: μετὰ χαρᾶς
  choice: buong galak
  rationale: Likas sa Filipino ang pariralang ito at malinaw na ipinahahayag ang masayang pagtanggap nang hindi sinasabing ikinatuwa nila ang kawalang-katarungan mismo.
- source_word: προσεδέξασθε
  choice: tinanggap
  rationale: Sa konteksto ng sapilitang pagkawala, ipinapahayag ng “tinanggap” ang kusang pagtitiis sa nangyari nang hindi ipinahihiwatig na sinang-ayunan nila ang pang-aagaw.
- source_word: γινώσκοντες
  choice: sapagkat alam ninyo
  rationale: 'Ang participle ay may malinaw na diwang sanhi rito: tinanggap nila ang pagkawala nang may galak dahil batid nila ang mas mabuti at nananatiling pag-aari.'
- source_word: ἑαυτοὺς ἔχειν
  choice: kayo mismo ay may
  rationale: Pinananatili ng “kayo mismo” ang diin ng reflexive pronoun sa tekstong SBLGNT.
- source_word: κρείττονα
  choice: higit na mabuti
  rationale: Pinananatili nito ang paghahambing at ang paulit-ulit na tema ng “higit na mabuti” sa Hebreo.
- source_word: ὕπαρξιν
  choice: pag-aari
  rationale: Ang ὕπαρξις ay tumutukoy sa pag-aari o tinataglay. Ang isahang “pag-aari” ay nagpapanatili sa kolektibo o abstraktong gamit at sa ugnayang leksikal nito sa naunang ὑπαρχόντων.
- source_word: μένουσαν
  choice: nananatili
  rationale: Tahasang ipinahahayag nito ang pagpapatuloy at pagiging permanente ng mas mabuting pag-aari.
theological_decisions:
- issue: Kahulugan ng pakikiisa sa mga bilanggong mananampalataya
  choice: Ipinahayag bilang pakikibahagi sa kanilang pagdurusa.
  alternative: “Nakiramay kayo sa mga bilanggo.”
  rationale: Saklaw ng pandiwa ang pakikiramay, ngunit sa konteksto ng pag-uusig sa Hebreo 10:32–34, mas angkop ang aktibo at magastos na pakikiisa. Inilalahad sa talababa ang mas mahinang leksikal na alternatibo.
- issue: Kalikasan ng “higit na mabuti at nananatiling pag-aari”
  choice: Hindi tinukoy kung ito ay nasa langit, kaligtasan, mana, o gantimpala.
  alternative: “Mas mabuting pag-aari sa langit na nananatili.”
  rationale: Wala sa pangunahing tekstong SBLGNT ang “sa langit.” Pinananatili ng salin ang pangkalahatang pahayag at inilalagay sa talababa ang mas tiyak na pagbasa ng ilang manuskrito.
translation_notes:
  register: Modernong Filipino na dignidad at madaling maunawaan. Ginamit ang “nakibahagi sa pagdurusa” upang maging malinaw ang aktibong pakikiisa, “pag-agaw” upang mapanatili ang di-makatarungang puwersa ng pagkawala, at “pag-aari” upang mapanatili ang ugnayang leksikal sa dalawang magkaugnay na salitang Griyego. Inilipat ang mga marker sa mga pariralang talagang tinutukoy ng kani-kanilang talababa.
