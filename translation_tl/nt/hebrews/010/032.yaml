id: HEB.10.32
reference: Hebrews 10:32
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἀναμιμνῄσκεσθε δὲ τὰς πρότερον ἡμέρας, ἐν αἷς φωτισθέντες πολλὴν ἄθλησιν ὑπεμείνατε παθημάτων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/032.yaml
  text: But remember the former days[a], when, after you were enlightened, you endured a great struggle of sufferings[c][b],
translation:
  language: tl
  text: Ngunit alalahanin ninyo ang mga nagdaang araw, nang matapos kayong maliwanagan[a][b], tiniis ninyo ang matinding pakikibaka na puno ng mga pagdurusa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nang kayo ay maliwanagan.” Maaaring tumukoy ang Griyegong participle sa kasabay na pangyayari o sa isang pangyayaring nauna.
    reason: lexical_alternative
  - marker: b
    text: Ang “maliwanagan” ay maaaring tumukoy sa malawak na pagtanggap ng espirituwal na liwanag. Iba-iba ang pag-uugnay nito sa pagbabagong-loob, bautismo, o pagtuturo sa pananampalataya.
    reason: alternative_reading
  - marker: c
    text: Maaari ring “isang mabigat na pakikipagtunggali.” Ang salitang Griyego ay may diwa ng pakikibaka o paligsahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναμιμνῄσκεσθε
  choice: alalahanin ninyo
  rationale: Likas at malinaw na pautos sa maramihang kausap; sapat nitong naihahayag ang patuloy na bisa ng kasalukuyang pautos nang hindi nagiging mabigat ang pananalita.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita ang banayad na paglipat at pagsalungat mula sa naunang babala tungo sa panawagang alalahanin ang kanilang dating pagtitiis.
- source_word: τὰς πρότερον ἡμέρας
  choice: ang mga unang araw
  rationale: Natural na Filipino para sa naunang yugto ng karanasan ng mga mambabasa; hindi nito nililinaw nang higit sa sinasabi ng Griyego kung gaano kalayo sa nakaraan ang tinutukoy.
- source_word: ἐν αἷς
  choice: nang
  rationale: Ang literal na “kung kailan” o “sa mga araw na iyon” ay maaaring maging mabigat; ipinahahayag ng “nang” ang temporal na kaugnayan sa natural na Filipino.
- source_word: φωτισθέντες
  choice: matapos kayong maliwanagan
  rationale: Pinananatili ang metapora ng liwanag at ang pasibong anyo. Ipinakikita ng “matapos” ang malamang na nauunang kilos ng aorist participle, habang inilalahad sa talababa ang posibleng sabayang temporal na pagbasa.
- source_word: πολλὴν ἄθλησιν
  choice: matinding pakikipaglaban
  rationale: Ipinahahayag ang tindi ng πολλήν at ang diwa ng paligsahan o pakikibaka sa ἄθλησις sa paraang natural sa Filipino.
- source_word: ὑπεμείνατε
  choice: tiniis ninyo
  rationale: Tuwirang ipinahahayag ang aktuwal na pagtitiis nila sa harap ng pagdurusa.
- source_word: παθημάτων
  choice: sa mga pagdurusa
  rationale: Pinananatili ang malawak na saklaw ng παθήματα bilang mga dinanas na hirap o pagdurusa at natural itong inuugnay sa “pakikipaglaban” sa Filipino.
theological_decisions:
- issue: Kahulugan ng φωτισθέντες sa konteksto ng babala at panghihikayat
  choice: Panatilihin ang metaporikong “maliwanagan” nang hindi ito itinutumbas sa isang tiyak na pangyayaring doktrinal.
  alternative: “nang kayo ay sumampalataya,” “matapos kayong mabautismuhan,” o “matapos ninyong matanggap ang liwanag ng ebanghelyo”
  rationale: Ipinahihiwatig ng salita ang naunang espirituwal na pagtanggap ng liwanag, ngunit hindi tinutukoy ng talata kung ito ay pagbabagong-loob, bautismo, o pagtuturo sa pananampalataya. Ang “maliwanagan” ay nagpapanatili sa tunay na lawak at tensiyong teolohikal ng teksto.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “ninyo” para sa maramihang kausap at pinanatili ang metapora ng liwanag at ang diwa ng matinding paligsahan o pakikibaka.
