  terminology: Ang “maliwanagan” ay angkop at pinananatili ang metapora at pasibong diwa ng φωτισθέντες nang hindi ito itinatali sa pagbabagong-loob, bautismo, o pagtuturo. Ang “pakikibaka” ay angkop para sa ἄθλησις; pinananatili ng talababa ang alternatibong diwa ng paligsahan.
