- from: Ngunit alalahanin ninyo ang mga unang araw, nang matapos kayong maliwanagan[a][b], tiniis ninyo ang matinding pakikipaglaban[c] sa mga pagdurusa.
  to: Ngunit alalahanin ninyo ang mga nagdaang araw, nang matapos kayong maliwanagan[a][b], tiniis ninyo ang matinding pakikibaka na puno ng mga pagdurusa[c].
  rationale: Pinalitan ang “mga unang araw” ng “mga nagdaang araw” upang masaklaw ang temporal na diwa ng πρότερον. Inayos ang huling parirala upang hindi magmukhang ang mga pagdurusa ang nilalabanan, kundi ang pakikibaka ang siyang kinapapalooban ng mga pagdurusa. Nilinaw rin ang talababa tungkol sa temporal na pagbasa ng participle, habang pinananatili ang teolohikal na hindi-pagtitiyak ng “maliwanagan.”
