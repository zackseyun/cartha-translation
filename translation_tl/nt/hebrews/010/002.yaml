  text: ἐπεὶ οὐκ ἂν ἐπαύσαντο προσφερόμεναι, διὰ τὸ μηδεμίαν ἔχειν ἔτι συνείδησιν ἁμαρτιῶν τοὺς λατρεύοντας ἅπαξ ⸀κεκαθαρισμένους;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/002.yaml
  text: Otherwise[a], would they not have stopped being offered, because those who worship, having once been cleansed[b], would no longer have any consciousness of sins?
translation:
  language: tl
  text: Kung hindi, hindi ba sana tumigil na ang paghahandog ng mga iyon, dahil ang mga sumasamba na minsan nang nalinis[b] ay wala na sanang anumang kamalayan sa mga kasalanan[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “budhi hinggil sa mga kasalanan” o “kamalayan sa mga kasalanan.” Maaaring tumukoy ang salitang Griyego sa budhi, kamalayan, o pagkabatid ng mga kasalanan; dito, ang diin ay ang nagpapatuloy na kamalayan ng sala sa harap ng Diyos.
    reason: lexical_alternative
  - marker: b
    text: O, “minsan at magpakailanman nang nalinis.” Maaaring taglayin dito ng salitang “minsan” ang diwa ng isang tiyak at di-na-uuliting paglilinis.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: Kung hindi
  rationale: Sa pangangatwirang salungat sa katotohanan, ipinakikilala nito ang magiging bunga kung hindi totoo ang sinabi sa naunang talata. Likas sa Tagalog ang “Kung hindi” bilang katumbas ng “otherwise.”
- source_word: οὐκ ἂν ἐπαύσαντο προσφερόμεναι
  choice: hindi ba sana tumigil na ang paghahandog ng mga iyon
  rationale: Pinananatili ng “hindi ba sana” ang retorikal at salungat-sa-katotohanang tanong. Ang “mga iyon” ay tumutukoy sa mga handog na binanggit sa konteksto, at ang “paghahandog” ay nagpapahayag na patuloy na inihahandog ang mga ito.
- source_word: διὰ τὸ μηδεμίαν ἔχειν ἔτι
  choice: sapagkat ... hindi na sana ... pa
  rationale: Ipinahahayag ng “sapagkat” ang dahilan, samantalang ang “hindi na ... pa” ay natural na naghahatid ng diwa ng μηδεμίαν ... ἔτι.
- source_word: συνείδησιν ἁμαρτιῶν
  choice: makadarama pa ng pagkakasala
  rationale: Sa konteksto, tumutukoy ito sa nagpapatuloy na pagkadama ng sala sa harap ng Diyos, hindi sa pagkawala ng kakayahang makilala ang kasalanan. Mas natural ito sa modernong Tagalog kaysa sa literal ngunit abstraktong “kamalayan sa mga kasalanan”; inilalahad sa talababa ang leksikal na saklaw.
- source_word: τοὺς λατρεύοντας
  choice: ang mga sumasamba
  rationale: Pinananatili nito ang pandiwang diwa ng participle at malinaw na tumutukoy sa mga nakikibahagi sa pagsamba.
- source_word: ἅπαξ
  choice: minsan
  rationale: Ang pangunahing kahulugan ay “minsan,” ngunit sa kontekstong ito maaari rin itong magpahiwatig ng tiyak at di-na-uuliting paglilinis; pinananatili sa talababa ang mas mariing posibilidad.
- source_word: κεκαθαρισμένους
  choice: nang nalinis
  rationale: Ipinahahayag nito ang pasibong paglilinis. Kasama ng “minsan nang,” naihahatid ang natapos na kilos na may nananatiling bunga nang hindi pinabibigat ang pangungusap.
theological_decisions:
- issue: Ang kahulugan ng συνείδησιν ἁμαρτιῶν matapos malinis ang mga sumasamba
  choice: “makadarama pa ng pagkakasala,” bilang nagpapatuloy na pagkadama ng sala sa harap ng Diyos
  alternative: “magkakaroon pa ng kamalayan sa mga kasalanan” o “uusigin pa ng budhi dahil sa mga kasalanan”
  rationale: Ang argumento ay hindi nagsasabing nawawala ang moral na pagkilala sa kasalanan. Sinasabi nitong kung ganap na nakapaglilinis ang paulit-ulit na mga handog, mawawala ang nagpapatuloy na pagkadama ng sala na dahilan ng patuloy na paghahandog.
- issue: Ang puwersa ng ἅπαξ
  choice: “minsan,” na may talababa tungkol sa posibleng diwang minsan at magpakailanman
  alternative: “minsan at magpakailanman” sa pangunahing teksto
  rationale: Maaaring magkaroon ng mariing, di-na-uuliting diwa ang ἅπαξ sa konteksto, ngunit hindi kailangang ganap na isaad iyon sa pangunahing teksto. Pinananatili ng talababa ang tunay na leksikal na posibilidad nang hindi labis na tinutukoy ang kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang karaniwang “mga sumasamba” at “pagkakasala,” habang iniwasan ang sobrang teknikal na pananalita. Pinanatili ang retorikal na tanong at ang salungat-sa-katotohanang “sana.”
