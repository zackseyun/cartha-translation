  text: ἀθετήσας τις νόμον Μωϋσέως χωρὶς οἰκτιρμῶν ἐπὶ δυσὶν ἢ τρισὶν μάρτυσιν ἀποθνῄσκει·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/028.yaml
  text: Anyone who has set aside the law of Moses dies without mercy on the testimony of two or three witnesses[a].
translation:
  language: tl
  text: Ang sinumang tumanggi sa Kautusan ni Moises ay namamatay nang walang awa batay sa patotoo ng dalawa o tatlong saksi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “pinapatay.” Literal na sinasabi ng Griyego na “namamatay,” ngunit ang konteksto ay tungkol sa paglalapat ng parusang kamatayan sa ilalim ng Kautusan ni Moises.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθετήσας
  choice: tumanggi
  rationale: Ipinahahayag ng aorist participle ang pagtanggi o pagsasantabi sa awtoridad ng kautusan. Likas sa modernong Tagalog ang “tumanggi sa Kautusan” at hindi nito nililimitahan ang diwa sa isang paglabag lamang.
- source_word: τις
  choice: ang sinuman
  rationale: Pangkalahatan ang gamit ng indefinite pronoun; malinaw at natural ang “ang sinuman” sa Tagalog.
- source_word: νόμον Μωϋσέως
  choice: Kautusan ni Moises
  rationale: Tuwirang ipinapakita ang genitive construction at ginagamit ang karaniwang katawagan sa kalipunan ng kautusang kaugnay ni Moises.
- source_word: χωρὶς οἰκτιρμῶν
  choice: nang walang awa
  rationale: Natural na katumbas ito ng idyomatikong parirala at angkop sa kontekstong panghukuman.
- source_word: ἐπὶ δυσὶν ἢ τρισὶν μάρτυσιν
  choice: batay sa patotoo ng dalawa o tatlong saksi
  rationale: Ipinakikita ng ἐπί na ang patotoo ng mga saksi ang batayan ng hatol; kailangang ilantad sa Tagalog ang ipinahihiwatig na “patotoo” upang maging malinaw at natural.
- source_word: ἀποθνῄσκει
  choice: namamatay
  rationale: Pinananatili nito ang literal na anyo ng pandiwang Griyego at ang pangkalahatang paglalahad ng legal na kahihinatnan, habang ipinahihiwatig ng konteksto ang paglalapat ng parusang kamatayan.
theological_decisions:
- issue: Kung tahasang ipapahayag na pagbitay ang kahulugan ng ἀποθνῄσκει
  choice: namamatay
  alternative: pinapatay
  rationale: Ang konteksto ng Kautusan ni Moises ay tumutukoy sa parusang kamatayan, ngunit ang pandiwang Griyego mismo ay literal na “namamatay.” Pinananatili ng pangunahing teksto ang pagpipigil at tunay na anyo ng pinagmulan; inilalagay sa talababa ang mas tahasang legal na diwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Kautusan” bilang pamilyar na katawagang biblikal at ang “batay sa patotoo” upang natural na maipahayag ang legal na relasyon sa Griyego.
