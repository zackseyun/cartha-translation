  yaml_path: translation/nt/hebrews/010/037.yaml
  text: For yet a very little while[b][a], the one who is coming will come and will not delay.
translation:
  language: tl
  text: Sapagkat sandali na lamang—napakaikling sandali[a]—at ang darating ay darating at hindi mag-aantala.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, inuulit ang salitang Griyego para sa sukat o tagal; isang idyomang nagbibigay-diin sa napakaikling panahon.
    reason: lexical_alternative
  - marker: b
    text: O “hindi magtatagal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι γὰρ
  choice: Sapagkat ... na lamang
  rationale: Ang “sapagkat” ay nagpapanatili sa paliwanag na ugnayan ng γάρ sa naunang pangungusap, habang ang “na lamang” ay likas na naghahayag ng temporal na diwa ng ἔτι sa Filipino.
- source_word: μικρὸν ὅσον ὅσον
  choice: kaunting-kaunting panahon
  rationale: Ang pag-uulit ay likas na paraang Filipino upang ihatid ang matinding kaiklian ng idyomatikong pariralang Griyego.
- source_word: ὁ ἐρχόμενος
  choice: ang darating
  rationale: Pinananatili nito ang substantibong participle at ang posibleng mesianikong puwersa nito nang hindi iyon tahasang ipinapasya sa pamamagitan ng dagdag na katawagan o natatanging kapitalisasyon.
- source_word: ἥξει
  choice: ay darating
  rationale: Tuwirang hinaharap na anyo ito at pinananatili ang pandiwang alingawngaw sa “ang darating.”
- source_word: οὐ χρονίσει
  choice: hindi magtatagal
  rationale: Likas itong modernong Filipino para sa hindi pag-antala o hindi pagtatagal bago dumating; nililinaw ng talababa ang posibleng mas tuwirang salin.
theological_decisions:
- issue: Kung ang ὁ ἐρχόμενος ay dapat ihayag bilang tahasang mesianikong titulo o bilang pangkalahatang substantibong participle
  choice: ang darating
  alternative: Siya na dumarating / ang Isa na darating
  rationale: Ang konteksto ay malamang na tumutukoy sa Mesiyas, ngunit hindi minamarkahan ng Griyego ang parirala bilang pantanging pangalan. Pinananatili ng “ang darating” kapwa ang sanggunian at ang pormal na kalabuan.
translation_notes:
  register: Modernong Filipino na may marangal at biblikal na himig. Ginamit ang “kaunting-kaunting panahon” upang maging natural ngunit mapanatili ang diin ng pag-uulit sa Griyego; iniwasan ang arkaikong pananalita at ang sobrang tahasang paglalagay ng mesianikong titulo.
