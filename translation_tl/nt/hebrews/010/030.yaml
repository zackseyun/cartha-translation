base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/030.yaml
  text: For we know the one who said[a], “Vengeance is mine; I will repay,” and again[b], “The Lord will judge his people.”
translation:
  language: tl
  text: Sapagkat kilala natin ang nagsabi, “Akin ang paghihiganti[a]; ako ang gaganti,” at muli, “Hahatulan ng Panginoon ang kanyang bayan.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “Sa akin ang paghihiganti.”'
    reason: lexical_alternative
  - marker: b
    text: Umaalingawngaw ang sipi sa Deuteronomio 32:35–36. Sa orihinal na konteksto, maaaring kabilang sa “hahatulan” ang kaparusahan at pagbibigay-katuwiran; dito, idiniriin ng konteksto ng babala ang paghatol ng Diyos.
    reason: cross_reference
lexical_decisions:
- source_word: οἴδαμεν
  choice: kilala natin
  rationale: Ang οἶδα ay nasa anyong ganap ngunit may pangkasalukuyang diwa sa Koine. Dahil tao ang tuwirang layon—ang Diyos na nagsalita—mas natural ang “kilala natin” kaysa “alam natin.”
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na kaugnayan nito sa naunang talata at ang marangal na himig ng babala.
- source_word: τὸν εἰπόντα
  choice: ang nagsabi
  rationale: Likas at maikling salin ng substantival aorist participle na tumutukoy sa Diyos bilang tagapagsalita sa Kasulatan.
- source_word: Ἐμοὶ ἐκδίκησις
  choice: Akin ang paghihiganti
  rationale: Pinananatili ang mariin at eliptikong ayos ng Griyego habang malinaw at natural sa Filipino ang pag-aangkin ng karapatang gumanti.
- source_word: ἀνταποδώσω
  choice: ako ang gaganti
  rationale: Ipinahahayag ang pagbabayad o pagganti ayon sa ginawa ng isang tao. Ang “gaganti” ay malinaw at akma sa konteksto ng banal na paghuhukom.
- source_word: καὶ πάλιν
  choice: at muli
  rationale: Tuwirang pinananatili ang pormulang nagpapakilala sa ikalawang sipi nang hindi nagdaragdag ng pandiwa.
- source_word: Κρινεῖ
  choice: Hahatulan
  rationale: Saklaw ng κρίνω ang paghatol, pagpapasiya, at kung minsan ay pagbibigay-katuwiran. Ang “hahatulan” ang pinakamahusay na nagpapanatili sa hudisyal na diwa sa konteksto ng babala.
- source_word: κύριος
  choice: Panginoon
  rationale: Karaniwang marangal na salin ng κύριος kapag tumutukoy sa Diyos.
- source_word: τὸν λαὸν αὐτοῦ
  choice: ang kanyang bayan
  rationale: Natural na salin na nagpapanatili sa kolektibo at tipanang diwa ng λαός.
theological_decisions:
- issue: Ang saklaw ng paghatol sa sipi mula sa Deuteronomio
  choice: “Hahatulan ng Panginoon ang kanyang bayan”
  alternative: “Ipagtatanggol ng Panginoon ang kanyang bayan” o “Bibigyang-katuwiran ng Panginoon ang kanyang bayan”
  rationale: Sa pinagmulang konteksto, maaaring saklawin ng paghatol ang kaparusahan at pagbibigay-katuwiran. Gayunman, nasa konteksto ito ng matinding babala sa Hebreo 10, kaya pinananatili ng “hahatulan” ang malawak at mabigat na hudisyal na diwa nang hindi nililimitahan iyon sa kaparusahan lamang o sa pagtatanggol lamang.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “kilala natin” dahil ang layon ng pandiwa ay ang mismong nagsalita, hindi lamang isang pahayag na nalalaman. Napanatili ang maikli, mariin, at hudisyal na himig ng dalawang sipi.
