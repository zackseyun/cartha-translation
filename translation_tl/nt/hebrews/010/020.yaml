  yaml_path: translation/nt/hebrews/010/020.yaml
  text: which he inaugurated for us as a new and living way through the curtain—that is[a], his flesh[b],
translation:
  language: tl
  text: na pinasinayaan niya para sa atin bilang isang bago at buháy na daan sa pamamagitan ng kurtina—ibig sabihin[a], ang kanyang laman[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “iyon ay.”
    reason: lexical_alternative
  - marker: b
    text: Ipinaliliwanag ng pariralang “ang kanyang laman” ang larawan ng kurtina sa pamamagitan ng pag-uugnay nito sa laman ni Jesus.
    reason: cultural_note
lexical_decisions:
- source_word: ἣν
  choice: na
  rationale: Iniuugnay ng panghalip na pamanggit ang talata sa naunang pahayag nang hindi tahasang nililinaw ang pinatutungkulan nito.
- source_word: ἐνεκαίνισεν
  choice: pinasinayaan
  rationale: Ipinapahayag nito ang pagtatatag at pagbubukas ng isang bagay para sa bagong paggamit, kasama ang seremonyal na himig ng pandiwa.
- source_word: ἡμῖν
  choice: para sa atin
  rationale: Ipinakikita ang pakinabang sa mga mananampalataya, hindi lamang ang di-tuwirang layon.
- source_word: ὁδὸν
  choice: daan
  rationale: Natural ito sa Filipino sa literal at matalinghagang gamit, lalo na para sa paglapit sa Diyos.
- source_word: πρόσφατον
  choice: bago
  rationale: Malinaw nitong ipinahahayag na bagong itinatag ang daan; ang mas literal na 'sariwa' ay hindi natural sa kontekstong ito.
- source_word: ζῶσαν
  choice: buháy
  rationale: Pinananatili ang lantad na paglalarawan sa daan bilang nabubuhay, nang hindi ito binibigyang-kahulugang 'nagbibigay-buhay.'
- source_word: διὰ τοῦ καταπετάσματος
  choice: sa pamamagitan ng kurtina
  rationale: Ang καταπέτασμα ay ang kurtinang naghihiwalay sa mga bahagi ng tabernakulo o templo. Madaling maunawaan sa modernong Filipino ang 'kurtina.'
- source_word: τοῦτ’ ἔστιν
  choice: samakatuwid nga
  rationale: Natural na pormulang Filipino na naghuhudyat ng paliwanag o pagtukoy, habang ang talababa ay nagpapanatili sa mas tuwirang anyo.
- source_word: τῆς σαρκὸς αὐτοῦ
  choice: ng kanyang laman
  rationale: Pinananatili ng 'laman' ang literal at teolohikal na lapit ng σάρξ. Ang anyong paari ay sumusunod sa apposisyon ng Griyego at hindi nagdaragdag ng ikalawang 'sa pamamagitan ng.'
theological_decisions:
- issue: Pagkakaugnay ng kurtina at ng laman ni Jesus
  choice: “samakatuwid nga, ng kanyang laman” bilang paliwanag sa “kurtina”
  alternative: “samakatuwid nga, sa pamamagitan ng kanyang laman”
  rationale: Ang Griyego ay naglalagay ng genitibong parirala bilang paliwanag sa kurtina. Pinananatili ng salin ang siksik at bahagyang tensiyong metaporikal nito, sa halip na lutasin kung ang laman mismo ang kurtina o ang paraan ng pagdaan.
- issue: Pagsasalin ng σάρξ
  choice: laman
  alternative: katawan
  rationale: Literal dito ang pagtukoy sa laman ni Jesus. Mas hayag sa salitang pinagmulan ang 'laman' at hindi nito pinapaliit ang parirala sa mas pangkalahatang 'katawan.'
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “pinasinayaan” upang mapanatili ang seremonyal na diwa, “kurtina” para sa malinaw na makabagong bokabularyo, at “buháy” na may tuldik upang maiwasang mabasa bilang pangngalang “buhay.” Ang sipi ay bahagi ng pangungusap na nagpapatuloy mula sa talata 19, kaya nagsisimula sa “na” at nagtatapos sa gitling.
