id: HEB.10.1
reference: Hebrews 10:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Σκιὰν γὰρ ἔχων ὁ νόμος τῶν μελλόντων ἀγαθῶν, οὐκ αὐτὴν τὴν εἰκόνα τῶν πραγμάτων, κατ’ ἐνιαυτὸν ταῖς αὐταῖς θυσίαις ἃς προσφέρουσιν εἰς τὸ διηνεκὲς οὐδέποτε ⸀δύναται τοὺς προσερχομένους τελειῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/001.yaml
  text: For since the law has only a shadow of the good things to come[a], not the very form of the realities, it can never, by the same sacrifices that they continually offer year after year[c][b], perfect those who draw near.
translation:
  language: tl
  text: Sapagkat ang Kautusan ay may anino lamang ng mabubuting bagay na darating, hindi ang mismong larawan ng mga bagay.[a] Hindi nito kailanman magagawang gawing ganap[b] ang mga lumalapit[c] sa pamamagitan ng mga handog na iyon din na patuloy nilang inihahandog taon-taon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “hindi ang larawan mismo ng mga bagay.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “dalhin sa kaganapan” o “lubusang gawing ganap.”
    reason: lexical_alternative
  - marker: c
    text: Ang “mga lumalapit” ay tumutukoy sa mga lumalapit sa Diyos sa pagsamba.
    reason: cultural_note
lexical_decisions:
- source_word: Σκιὰν
  choice: anino
  rationale: Pinananatili ng “anino” ang metapora at ang kaibahan nito sa εἰκών, nang hindi ito agad binibigyang-kahulugang simbolo o hulang larawan.
- source_word: τῶν μελλόντων ἀγαθῶν
  choice: ng mabubuting bagay na darating
  rationale: Natural itong pahayag sa modernong Tagalog at pinananatili ang hinaharap na diwa ng participle nang hindi nililimitahan ang panahon ng katuparan.
- source_word: οὐκ αὐτὴν τὴν εἰκόνα τῶν πραγμάτων
  choice: hindi ang mismong larawan ng mga realidad
  rationale: Ipinahahayag ng “mismong larawan” ang diin ng αὐτήν at pinananatili ng “mga realidad” ang kaibahan sa anino, habang kinikilala sa talababa ang mas literal na “mga bagay.”
- source_word: κατ’ ἐνιαυτὸν ταῖς αὐταῖς θυσίαις ἃς προσφέρουσιν εἰς τὸ διηνεκές
  choice: sa pamamagitan ng pare-parehong mga handog na patuloy nilang inihahandog taon-taon
  rationale: Ipinakikita ng “sa pamamagitan” ang instrumental na gamit ng dative; ipinahahayag ng “pare-pareho,” “patuloy,” at “taon-taon” ang magkakapareho at paulit-ulit na paghahandog.
- source_word: οὐδέποτε δύναται
  choice: hindi nito kailanman magagawang
  rationale: Pinananatili nito kapwa ang ganap na pagtanggi ng οὐδέποτε at ang kakayahang tinutukoy ng δύναται.
- source_word: τοὺς προσερχομένους
  choice: ang mga lumalapit
  rationale: Pinananatili nitong hindi tahasang binanggit ang layon sa Griyego, habang ipinaliliwanag sa talababa ang kontekstong paglapit sa Diyos sa pagsamba.
- source_word: τελειῶσαι
  choice: gawing ganap
  rationale: Pinananatili nito ang mahalagang bokabularyo ng τελειόω sa Hebreo at ang diwa ng pagdadala sa nilalayong kalagayan, nang hindi ito awtomatikong nililimitahan sa kawalang-kasalanang moral.
theological_decisions:
- issue: Ang kaibahan ng anino at larawan/realidad sa teolohiya ng paghahandog
  choice: Ang Kautusan ay may anino ng mga darating na kabutihan, ngunit hindi ang mismong larawang katumbas ng mga realidad.
  alternative: Ang Kautusan ay isang simbolikong larawan ng mga pagpapalang darating.
  rationale: Tahasang pinaghahambing ng teksto ang σκιά at εἰκών. Pinananatili ng salin ang kaibahang ito nang hindi minamaliit ang bigay-Diyos na papel ng Kautusan o itinuturing itong pangwakas na realidad.
- issue: Ang kahulugan ng τελειῶσαι sa konteksto ng mga handog
  choice: gawing ganap
  alternative: lubusang gawing karapat-dapat; dalhin sa kaganapan
  rationale: Ang pandiwa ay may mahalagang papel sa Hebreo kaugnay ng ganap na paglapit sa Diyos. Ang “gawing ganap” ay nagpapanatili sa teolohikal na tensiyon at hindi tahasang nagpapakahulugan nito bilang moral na kawalang-kapintasan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Kautusan” bilang terminong biblikal ngunit karaniwang nauunawaan; iniwasan ang labis na teknikal o denominasyonal na pananalita. Hinati sa dalawang pangungusap para sa linaw, habang pinananatili ang lohikal na ugnayan ng orihinal.
