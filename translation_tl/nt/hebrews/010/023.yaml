base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/023.yaml
  text: Let us hold fast the confession of our hope without wavering[a], for the one who promised is faithful.
translation:
  language: tl
  text: Mahigpit nating panghawakan ang pagpapahayag ng ating[a] pag-asa nang walang pag-uurong-sulong, sapagkat tapat ang nangako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang pagpapahayag ng pag-asa.” Walang tahasang salitang “ating” sa Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέχωμεν
  choice: Panghawakan nating mabuti
  rationale: Ang hortatoryong unang panauhang maramihan ay ginawang likas na sama-samang paghihikayat sa Tagalog; ipinahihiwatig ng “panghawakan” at “mabuti” ang matatag na pagpapanatili.
- source_word: ὁμολογίαν
  choice: ang pagpapahayag
  rationale: Sa konteksto, tumutukoy ito sa hayag na pag-amin o pagpapahayag ng pinaniniwalaan; mas natural sa karaniwang modernong Tagalog ang “pagpapahayag” kaysa “propesyon” o “kompesyon.”
- source_word: τῆς ἐλπίδος
  choice: ng ating pag-asa
  rationale: Walang tahasang panghalip na “ating” sa Griyego, ngunit likas itong ipinahihiwatig ng sama-samang paghihikayat. Itinala sa talababa ang mas pormal na alternatibo.
- source_word: ἀκλινῆ
  choice: nang hindi nag-aalinlangan
  rationale: Inihahatid nito ang diwa ng pagiging hindi natitinag o lumilihis, sa natural at malinaw na Tagalog.
- source_word: πιστὸς
  choice: tapat
  rationale: Pinananatili nito ang karaniwang biblikal at teolohikal na diwa ng pagiging mapagkakatiwalaan at tumutupad sa salita.
- source_word: ὁ ἐπαγγειλάμενος
  choice: ang nangako
  rationale: Likas at maikli itong salin ng substantibong participle; hindi tahasang pinangalanan ang Diyos, gaya rin ng Griyego.
theological_decisions:
- issue: Di-tahasang tinutukoy ng “ang nangako”
  choice: Hindi tahasang idinagdag ang “Diyos.”
  alternative: “sapagkat tapat ang Diyos na nangako”
  rationale: Malinaw sa konteksto na Diyos ang tinutukoy, ngunit hindi siya tahasang pinangalanan sa Griyego; pinananatili ng salin ang ganitong pagiging di-tahas.
- issue: Pagdaragdag ng “ating” sa “pag-asa”
  choice: “ang pagpapahayag ng ating pag-asa”
  alternative: “ang pagpapahayag ng pag-asa”
  rationale: Nililinaw ng “ating” ang komunal na diwa ng pangungusap at likas ito sa Tagalog, ngunit hindi nito itinatago na walang tahasang possessive sa Griyego; kaya may talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Iniwasan ang sobrang teknikal o denominasyonal na pananalita habang pinananatili ang sama-samang paghihikayat at ang pagiging di-tahas ng paksa sa hulíng sugnay.
