lexical_decisions:
- source_word: ἀλλ’
  choice: Ngunit
  rationale: Likas at maikling panandang pasalungat ito, na nag-uugnay sa pahayag ng naunang talata na hindi kayang gawing ganap ng mga hain ang mga sumasamba.
- source_word: ἐν αὐταῖς
  choice: sa mga haing ito
  rationale: Ang panghalip ay tumutukoy sa mga hain na binanggit sa naunang konteksto. Nilinaw ang tinutukoy upang maging natural at madaling maunawaan sa Tagalog nang walang idinaragdag na bagong diwa.
- source_word: ἀνάμνησις
  choice: pagpapaalaala
  rationale: Ipinahihiwatig ng salita ang pagbabalik sa isip o pagpapaalaala. Pinananatili ng anyong pangngalan ang pagkakabuo at diin ng Griyego.
- source_word: ἁμαρτιῶν
  choice: sa mga kasalanan
  rationale: 'Ito ang likas na Tagalog na pag-uugnay sa “pagpapaalaala”: ang mga kasalanan ang muling dinadala sa isip.'
- source_word: κατ’ ἐνιαυτόν
  choice: taon-taon
  rationale: Ipinapahayag ng parirala ang paulit-ulit na pangyayari sa bawat taon. Maikli, natural, at malinaw sa modernong Tagalog ang “taon-taon.”
theological_decisions:
- issue: Tinutukoy ng αὐταῖς
  choice: Ginawang tahasang “sa mga haing ito,” na tumutukoy sa paulit-ulit na mga hain sa naunang konteksto.
  alternative: Panatilihin lamang bilang “sa mga ito.”
  rationale: Malinaw sa konteksto na mga hain ang tinutukoy. Ang tahasang pagbanggit nito ay nagpapalinaw sa argumento nang hindi binabago ang teolohikal na diwa.
- issue: Diin ng κατ’ ἐνιαυτόν
  choice: Isinalin bilang “taon-taon” upang ipakita ang taunang pag-uulit.
  alternative: “bawat taon”
  rationale: Parehong posible ang dalawang anyo, ngunit bahagyang higit na naipadarama ng “taon-taon” ang paulit-ulit na katangian ng mga hain na mahalaga sa argumento ng Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “hain” bilang tuwirang katawagan sa sakripisyong panrelihiyon at pinanatili ang nominal na “pagpapaalaala” upang hindi labis na ipakahulugan kung sino ang tahasang gumagawa ng pagpapaalaala.
