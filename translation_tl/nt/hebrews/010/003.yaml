  text: But in these sacrifices there is a reminder of sins year after year,[a]
translation:
  language: tl
  text: Ngunit sa mga haing ito ay may pagpapaalaala tungkol sa mga kasalanan taon-taon.[a]
  philosophy: optimal-equivalence
  footnotes:
