revisions:
- from: Sa palagay ninyo, gaano pa kabigat na parusa ang nararapat tanggapin ng taong yumurak sa Anak ng Diyos, itinuring na pangkaraniwan[a] ang dugo ng tipan na sa pamamagitan nito ay pinabanal siya,[b] at lumapastangan sa Espiritu ng biyaya?[c]
  to: Sa palagay ninyo, gaano pa kabigat na parusa ang marapat sa taong yumurak sa Anak ng Diyos, itinuring na pangkaraniwan[a] ang dugo ng tipan na sa pamamagitan nito ay pinabanal siya,[b] at ininsulto ang Espiritu ng biyaya?[c]
  rationale: Inayos ang pagpapahayag ng hudisyal na pagiging marapat sa parusa at pinili ang mas tuwirang salin para sa pandiwang nagsasaad ng mapanghamak na pang-iinsulto. Hindi binago ang saklaw ng kahulugan, ang retorikal na tanong, ang mga pangunahing terminong teolohikal, o ang sintaktikong kalabuan ng “pinabanal siya.”
  reviewer_model: gpt-5.6-terra
