id: HEB.10.29
reference: Hebrews 10:29
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πόσῳ δοκεῖτε χείρονος ἀξιωθήσεται τιμωρίας ὁ τὸν υἱὸν τοῦ θεοῦ καταπατήσας, καὶ τὸ αἷμα τῆς διαθήκης κοινὸν ἡγησάμενος ἐν ᾧ ἡγιάσθη, καὶ τὸ πνεῦμα τῆς χάριτος ἐνυβρίσας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/029.yaml
  text: How much worse punishment do you think will be deserved by the one who has trampled underfoot the Son of God[a], and has regarded the blood of the covenant by which he was sanctified as common[c][b], and has insulted the Spirit of grace?
translation:
  language: tl
  text: Sa palagay ninyo, gaano pa kabigat na parusa ang marapat sa taong yumurak sa Anak ng Diyos, itinuring na pangkaraniwan[a] ang dugo ng tipan na sa pamamagitan nito ay pinabanal siya,[b] at ininsulto ang Espiritu ng biyaya?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “marumi” o “di-banal.”
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, ang sugnay na “na sa pamamagitan nito ay pinabanal siya” ay sintaktikong kaugnay ng taong inilalarawan sa talata; may ibang pagpapakahulugan sa tinutukoy ng “siya.” Pinananatili ng salin ang ganitong kalabuan at hindi nilulutas ang pagtatalong teolohikal.
    reason: alternative_reading
  - marker: c
    text: O, “umalipusta sa Espiritu ng biyaya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πόσῳ ... χείρονος
  choice: gaano pa kabigat
  rationale: Likas na Filipino para sa retorikal na paghahambing; ipinahahayag ang diwang mas mabigat o mas masamang kaparusahan nang hindi gumagamit ng pilit na literal na anyo.
- source_word: ἀξιωθήσεται τιμωρίας
  choice: parusa ang nararapat tanggapin
  rationale: Pinananatili ang hudisyal na diwa ng pagiging karapat-dapat sa parusa, ngunit gumagamit ng malinaw at natural na ayos sa Filipino.
- source_word: καταπατήσας
  choice: yumurak
  rationale: Pinananatili ang matinding larawang metaporikal ng pagyurak at tahasang paghamak.
- source_word: υἱὸν τοῦ θεοῦ
  choice: Anak ng Diyos
  rationale: Tuwiran at kinikilalang salin ng titulong kristolohikal.
- source_word: κοινὸν
  choice: pangkaraniwan
  rationale: 'Ipinakikita ang pagsalungat sa banal o itinalaga: itinuring ang dugong banal na para bang karaniwan lamang. Ang mga posibleng diwang ''marumi'' at ''di-banal'' ay inilagay sa talababa.'
- source_word: αἷμα τῆς διαθήκης
  choice: dugo ng tipan
  rationale: Pinananatili ang pormulang biblikal at ang kaugnayan nito sa handog at tipan.
- source_word: ἐν ᾧ ἡγιάσθη
  choice: na sa pamamagitan nito ay pinabanal siya
  rationale: Ipinahahayag ang instrumental na diwa ng ἐν ᾧ at pinananatili ang pasibong pandiwa at panghalip ng Griyego.
- source_word: ἐνυβρίσας
  choice: lumapastangan
  rationale: Malinaw na naghahatid ng mapanghamak at mapang-abusong pagtrato, at angkop sa marangal na rehistro ng talata.
- source_word: πνεῦμα τῆς χάριτος
  choice: Espiritu ng biyaya
  rationale: Tuwirang pinananatili ang pariralang teolohikal nang hindi ito ipinapaliwanag nang lampas sa teksto.
theological_decisions:
- issue: Tinutukoy ng ἡγιάσθη ('pinabanal siya')
  choice: 'Pinanatili ang natural na ugnayang panggramatika sa taong inilalarawan bilang nagkasala: ''pinabanal siya.'''
  alternative: Unawain ang tinutukoy bilang si Cristo, ang dugo, o ang sambayanan ng tipan.
  rationale: Ang isahang taong gumagawa ng mga kilos ang pinakamalapit na tinutukoy ayon sa sintaks. Hindi nilulutas ng salin ang mas malawak na pagtatalo tungkol sa apostasya at pananatili sa pananampalataya; inilalahad lamang nito ang anyo at tensiyon ng teksto.
- issue: Diwa ng κοινὸν kaugnay ng dugo ng tipan
  choice: pangkaraniwan
  alternative: marumi o di-banal
  rationale: Ang 'pangkaraniwan' ang pinakadirektang katapat sa pagsalungat ng karaniwan at banal, samantalang kinikilala sa talababa ang mas matitinding kontekstuwal na kahulugan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang 'yumurak' at 'lumapastangan' upang mapanatili ang tindi ng mga larawan sa Griyego, habang ang ayos ng retorikal na tanong ay ginawang natural sa Tagalog.
