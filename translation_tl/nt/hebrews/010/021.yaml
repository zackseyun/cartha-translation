  yaml_path: translation/nt/hebrews/010/021.yaml
  text: and a great priest over the house of God[b][a],
translation:
  language: tl
  text: at mayroon tayong isang dakilang pari[a] na namamahala sa sambahayan[b] ng Diyos,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “punong pari.” Madalas ilarawan sa Sulat sa mga Hebreo si Jesus bilang punong pari, ngunit literal na “isang dakilang pari” ang sinabi rito.
    reason: alternative_reading
  - marker: b
    text: O “bahay ng Diyos.” Ang parirala ay maaari ring tumukoy sa sambahayan ng Diyos, samakatuwid, sa kanyang bayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: at
  rationale: Karaniwang pang-ugnay ito sa naunang sugnay; ang “at” ay natural na nagpapatuloy sa pangungusap ng talata 19–21.
- source_word: ἱερέα
  choice: pari
  rationale: Ang ἱερεύς ay “pari,” hindi ang teknikal na katawagang ἀρχιερεύς na “punong pari.”
- source_word: μέγαν
  choice: dakilang
  rationale: Pinananatili nito ang tuwirang diwa ng kadakilaan o kataasan nang hindi ginagawang teknikal na titulong “punong pari.”
- source_word: ἐπὶ
  choice: namamahala sa
  rationale: Sa kontekstong ito, ipinahihiwatig ng ἐπί na may pananagutan at kapamahalaan ang pari sa sambahayan ng Diyos.
- source_word: τὸν οἶκον
  choice: sambahayan
  rationale: Maaaring mangahulugan ang οἶκος ng bahay o sambahayan. Dito, ang “sambahayan” ay natural na tumutukoy sa bayan ng Diyos, habang pinananatili sa talababa ang literal na larawang “bahay.”
- source_word: τοῦ θεοῦ
  choice: ng Diyos
  rationale: Tuwirang anyong paari na tumutukoy sa sambahayan bilang pag-aari ng Diyos.
theological_decisions:
- issue: Kung isasalin ang ἱερέα μέγαν bilang teknikal na titulong “punong pari”
  choice: dakilang pari
  alternative: punong pari
  rationale: Bagaman paulit-ulit na inilalarawan ng Hebreo si Jesus bilang punong pari, ἱερεύς + μέγας ang ginamit dito, hindi ἀρχιερεύς. Pinananatili ng “dakilang pari” ang natatanging pagkakabuo at hindi ipinapasok sa teksto ang teknikal na titulo.
- issue: Kung pananatilihin ang metaporang “bahay” o ilalahad ang kolektibong diwang “sambahayan”
  choice: sambahayan ng Diyos
  alternative: bahay ng Diyos
  rationale: Sa Hebreo, lalo na sa 3:2–6, ang οἶκος ay may diwang kolektibo at tipanang tumutukoy sa bayan ng Diyos. Ang “sambahayan” ay malinaw at natural sa modernong Tagalog, habang kinikilala sa talababa ang literal na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “mayroon tayong” upang natural na ipahayag ang ipinagpapatuloy na konstruksyon mula sa konteksto, at ang “namamahala sa” upang malinaw na ihatid ang kapamahalaang ipinahihiwatig ng ἐπί.
