id: HEB.10.7
reference: Hebrews 10:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τότε εἶπον· Ἰδοὺ ἥκω, ἐν κεφαλίδι βιβλίου γέγραπται περὶ ἐμοῦ, τοῦ ποιῆσαι, ὁ θεός, τὸ θέλημά σου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/007.yaml
  text: Then I said[a], ‘Behold, I have come—in the scroll of the book it is written about me—to do your will, O God.’
translation:
  language: tl
  text: Pagkatapos ay sinabi ko, “Narito, dumating ako—sa balumbon ng aklat[a] ay nakasulat tungkol sa akin—upang gawin ang kalooban mo, O Diyos.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang tinutukoy ay isang sinaunang balumbon o rolyo na sinusulatan, hindi isang makabagong aklat na may pabalat at magkakahiwalay na pahina.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Pagkatapos
  rationale: Likas at maikli itong panandang temporal sa Filipino para sa tugong ipinakikilala ng sipi.
- source_word: εἶπον
  choice: sinabi ko
  rationale: Tuwirang katumbas ito ng anyong aorist ng λέγω sa pormula ng pagsasalaysay.
- source_word: Ἰδοὺ
  choice: Narito
  rationale: Pinananatili nito ang mariin at marangal na pagpapakilala ng pahayag nang hindi nagiging lipas o labis na kolokyal.
- source_word: ἥκω
  choice: dumating ako
  rationale: Bagaman nasa anyong pangkasalukuyan, maaari itong magpahayag ng pagdating na may bisa sa kasalukuyan; natural itong ipinahahayag sa Filipino bilang “dumating ako.”
- source_word: ἐν κεφαλίδι βιβλίου
  choice: sa balumbon ng aklat
  rationale: Sa idyomang ito, ang κεφαλίς ay tumutukoy sa balumbon o rolyo na sinusulatan, hindi sa pamagat o kabanata. Pinananatili ng salin ang sinaunang larawang tinutukoy.
- source_word: γέγραπται
  choice: ay nakasulat
  rationale: Ipinahahayag nito ang isang bagay na naisulat at nananatiling nakatala, gaya ng karaniwang pormula sa pagsipi ng Kasulatan.
- source_word: περὶ ἐμοῦ
  choice: tungkol sa akin
  rationale: Ito ang malinaw at natural na katumbas ng περί na may genitive.
- source_word: τοῦ ποιῆσαι
  choice: upang gawin
  rationale: Ipinakikita ng articular infinitive ang layunin ng pagdating; malinaw itong naihahayag ng “upang gawin.”
- source_word: ὁ θεός
  choice: O Diyos
  rationale: Bagaman nominative ang anyo, ginagamit ito bilang tuwirang pagtawag; nililinaw ito ng “O Diyos.”
- source_word: τὸ θέλημά σου
  choice: ang kalooban mo
  rationale: Ang “kalooban” ang tumpak at kinikilalang katumbas ng θέλημα sa kontekstong ito.
theological_decisions:
- issue: Mesiyanikong pagtukoy sa sarili sa sipi ng Awit na inilalapat sa Hebreo
  choice: Pinanatili ang pahayag sa unang panauhan nang hindi tahasang dinaragdagan ng pagkakakilanlan ng nagsasalita bilang Mesiyas.
  alternative: Tahasang tukuyin sa pangunahing teksto na ang nagsasalita ay ang Mesiyas o si Cristo.
  rationale: Itinatakda ng nakapaligid na konteksto ng Hebreo ang paglalapat nito sa Anak, ngunit ang mismong talata ay nananatiling pahayag sa unang panauhan. Hindi dapat idagdag sa salin ang paliwanag na wala sa pangungusap.
translation_notes:
  register: Makabago ngunit marangal na Filipino; pinanatili ang solemneng “Narito” at ang tuwirang pagtawag na “O Diyos.” Inilagay ang talababa sa pariralang “balumbon ng aklat,” na siyang aktuwal na nililinaw nito.
