  yaml_path: translation/nt/hebrews/010/031.yaml
  text: It is a fearful thing to fall into the hands of the living God[a].
translation:
  language: tl
  text: Kakila-kilabot ang mahulog sa mga kamay ng Diyos na buháy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Nakatatakot ang mahulog sa mga kamay ng Diyos na buháy.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβερὸν
  choice: Kakila-kilabot
  rationale: Ipinahahayag ng φοβερός ang bagay na nagdudulot ng matinding takot o sindak. Ang “kakila-kilabot” ay natural at marangal sa makabagong Tagalog at angkop sa taimtim na bigat ng babala.
- source_word: τὸ ἐμπεσεῖν
  choice: ang mahulog
  rationale: Ang artikulo at aorist infinitive ay gumaganap bilang isang substantibong parirala. Likas itong maisalin na “ang mahulog,” at pinananatili nito ang larawan ng pagkasadlak sa kapangyarihan ng iba.
- source_word: εἰς χεῖρας
  choice: sa mga kamay
  rationale: Ang idyoma ay tumutukoy sa pagpasok sa kapangyarihan o paghatol ng isang tao. Pinananatili ng “sa mga kamay” ang mismong larawan at mga kaugnay na alusyon sa Kasulatan nang hindi tuwirang idinaragdag ang salitang “paghatol.”
- source_word: θεοῦ
  choice: ng Diyos
  rationale: Tuwirang genitibong nakaugnay sa “mga kamay”; walang dahilan sa konteksto upang palawakin o dagdagan ang katawagan.
- source_word: ζῶντος
  choice: na buháy
  rationale: Ang present participle ay tumuturing sa θεοῦ bilang “Diyos na buháy,” isang karaniwang pahayag sa Kasulatan na nagbibigay-diin sa aktibo at tunay na presensiya ng Diyos.
theological_decisions:
- issue: Lakas at saklaw ng babala
  choice: Isang pangkalahatan at taimtim na pahayag tungkol sa kakila-kilabot na pagkasadlak sa kapangyarihan at paghatol ng Diyos na buháy
  alternative: Isang makitid na pagtukoy lamang sa pansamantalang pagdidisiplina, o isang pahayag tungkol sa pag-iral na walang pahiwatig ng paghatol
  rationale: Tinatapos ng talata ang isang seryosong babala, at ang idyomang “mahulog sa mga kamay” ay may puwersang hudisyal sa konteksto. Gayunman, hindi idinagdag sa pangunahing teksto ang salitang “paghatol,” sapagkat ipinahihiwatig lamang ito ng idyomang Griyego at hindi tahasang binabanggit.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kakila-kilabot” upang mapanatili ang matinding puwersa ng φοβερὸν, habang ang alternatibong “nakatatakot” ay inilagay sa talababa. Nilagyan ng tuldik ang “buháy” upang malinaw ang bigkas at maiwasang mabasa bilang “bahay.”
