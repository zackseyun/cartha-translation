  yaml_path: translation/nt/hebrews/010/015.yaml
  text: And the Holy Spirit also testifies to us[a]; for after saying,
translation:
  language: tl
  text: At nagpapatotoo rin sa atin ang Banal na Espiritu,[a] sapagkat matapos niyang sabihin,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sumasaksi rin sa atin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρεῖ
  choice: pinatototohanan
  rationale: Ipinapahayag ng pandiwang nasa pangkasalukuyang panahunan ang patuloy o kasalukuyang pagpapatotoo. Likas ito sa modernong Tagalog at pinananatili ang diwa ng pagbibigay-saksi.
- source_word: δὲ
  choice: At
  rationale: Mahinang pang-ugnay ito na nagpapatuloy sa argumento, hindi isang mariing pagsalungat.
- source_word: ἡμῖν
  choice: sa atin
  rationale: Ang datibo kasama ng μαρτυρέω ay tumutukoy sa mga pinatutungkulan ng patotoo; kasama rito ng may-akda ang sarili niya at ang mga mambabasa o tagapakinig.
- source_word: καὶ
  choice: din
  rationale: Ipinakikita nito na ang Banal na Espiritu ay karagdagang saksi sa argumento.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: ang Banal na Espiritu
  rationale: Ito ang malinaw at karaniwang makabagong katawagan para sa tiyak na tinutukoy na Espiritu.
- source_word: μετὰ γὰρ τὸ εἰρηκέναι
  choice: sapagkat matapos niyang sabihin
  rationale: Ang μετά na may articular infinitive ay nagsasaad ng pagkakasunod sa panahon. Nililinaw ng panghalip na ang nauunawaang tagapagsalita ay ang Banal na Espiritu mula sa naunang sugnay.
theological_decisions:
- issue: Personal na pagkilos ng Banal na Espiritu bilang saksi
  choice: pinatototohanan din ito sa atin ng Banal na Espiritu
  alternative: nagbibigay-patotoo rin sa atin ang Banal na Espiritu
  rationale: Inilalarawan ng sintaks ang Banal na Espiritu bilang aktibong nagpapatotoo. Pinananatili ng salin ang personal na pagkilos na iyon nang hindi nagdaragdag ng paliwanag na wala sa teksto.
- issue: Hindi tahasang layon ng μαρτυρεῖ
  choice: ito
  alternative: 'walang tahasang layon: “pinatototohanan din sa atin ng Banal na Espiritu”'
  rationale: Walang nakasaad na tuwirang layon sa Griyego, ngunit kailangan ng likas na Tagalog ng malinaw na kayarian. Ang “ito” ay tumutukoy nang pangkalahatan sa patotoong kasunod at hindi tinutukoy nang mas makitid ang nilalaman nito.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “pinatototohanan” upang mapanatili ang diwa ng pagsaksi, at ang “matapos niyang sabihin” upang maging malinaw sa Tagalog ang nauunawaang simuno ng infinitive. Ang kuwit sa hulihan ay sadyang naghahanda sa siping sumusunod.
