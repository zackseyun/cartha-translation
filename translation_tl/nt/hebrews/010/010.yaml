  text: ἐν ᾧ θελήματι ἡγιασμένοι ⸀ἐσμὲν διὰ τῆς προσφορᾶς τοῦ σώματος Ἰησοῦ Χριστοῦ ἐφάπαξ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/010.yaml
  text: By that will we have been sanctified through the offering of the body of Jesus the Messiah once for all[a][b].
translation:
  language: tl
  text: Sa kaloobang iyon,[a] pinabanal na tayo sa pamamagitan ng minsan at magpakailanmang paghahandog ng katawan ng Mesiyas na si Jesus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Sa kaloobang iyon.” Tinutukoy nito ang kalooban ng Diyos na kababanggit sa konteksto.'
    reason: lexical_alternative
  - marker: b
    text: O “Jesus Cristo.” Ang Griyegong Χριστός (Christos) ay isang titulong nangangahulugang “Mesiyas.”
    reason: alternative_rendering
lexical_decisions:
- source_word: ἐν ᾧ θελήματι
  choice: Sa bisa ng kaloobang iyon
  rationale: Ipinahihiwatig ng parirala ang kalooban ng Diyos na kababanggit lamang at ang bisa o batayan nito. Likas sa modernong Tagalog ang “sa bisa ng,” samantalang iniingatan sa talababa ang mas literal na anyo.
- source_word: ἡγιασμένοι ἐσμὲν
  choice: pinabanal na tayo
  rationale: Ang periphrastic perfect ay tumutukoy sa isang naganap nang pagkilos na may nananatiling bunga. Ipinahahayag ito ng “pinabanal na” nang hindi ginagawang nagpapatuloy na proseso ang anyong Griyego.
- source_word: διὰ τῆς προσφορᾶς
  choice: sa pamamagitan ng … paghahandog
  rationale: Ang διά na may genitive ay nagsasaad ng paraan o kasangkapan; malinaw at natural itong naihahatid ng “sa pamamagitan ng.” Ang “paghahandog” ay nagpapanatili sa tuwirang diwa ng προσφορά nang hindi pinapalitan agad ng mas interpretatibong “sakripisyo.”
- source_word: τοῦ σώματος
  choice: ng katawan
  rationale: Pinananatili ang kongkretong pagtukoy sa katawan bilang siyang inihandog.
- source_word: Ἰησοῦ Χριστοῦ
  choice: ng Mesiyas na si Jesus
  rationale: Isinaayos ang pangalan at titulo ayon sa likas na balangkas ng Tagalog. Isinalin ang Χριστός bilang titulong “Mesiyas” upang manatiling malinaw ang kahulugan nito, sa halip na ituring lamang na bahagi ng pangalan.
- source_word: ἐφάπαξ
  choice: minsan at magpakailanman
  rationale: Ipinahahayag ng pariralang ito ang minsanan, ganap, at hindi na kailangang uliting katangian ng paghahandog. Inilapit ito sa “paghahandog” upang luminaw kung ano ang minsanang ginawa.
theological_decisions:
- issue: Aspekto at diwang teolohikal ng pagpapabanal
  choice: “pinabanal na tayo,” bilang naganap nang pagkilos na may nananatiling bunga
  alternative: “tayo ay banal” o “patuloy tayong pinababanal”
  rationale: Hindi simpleng pangkasalukuyan o progresibo ang ἡγιασμένοι ἐσμὲν. Pinananatili ng salin ang ganap ngunit patuloy na bunga nito nang hindi nagpapasok ng partikular na sistemang denominasyonal tungkol sa pagpapabanal.
- issue: Ang titulong Χριστός
  choice: “Mesiyas”
  alternative: “Cristo”
  rationale: Dito ay malinaw na maaaring maunawaan ang Χριστός bilang titulo. Ang “Mesiyas” ay nagpapanatili sa kahulugan ng titulo; itinatala sa talababa ang tradisyonal na anyong “Cristo.”
- issue: Saklaw ng ἐφάπαξ
  choice: Iniugnay sa mismong paghahandog bilang minsanan at hindi na mauulit
  alternative: Unawain lamang bilang “minsan” nang walang diin sa pagiging pangwakas
  rationale: Sa konteksto ng Hebreo 10, binibigyang-diin ng salita ang tiyak at di-mauulit na paghahandog, ngunit hindi dinaragdagan ng salin ang saklaw nito nang higit sa sinasabi ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang karaniwang “kalooban,” “pinabanal,” at “paghahandog” upang mapanatili ang biblikal at teolohikal na rehistro nang hindi nagiging lipas o labis na teknikal. Ang ayos na “Mesiyas na si Jesus” ay likas sa Tagalog at nililinaw na titulo ang Mesiyas.
