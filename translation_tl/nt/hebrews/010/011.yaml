  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ πᾶς μὲν ἱερεὺς ἕστηκεν καθ’ ἡμέραν λειτουργῶν καὶ τὰς αὐτὰς πολλάκις προσφέρων θυσίας, αἵτινες οὐδέποτε δύνανται περιελεῖν ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/011.yaml
  text: And every priest stands day after day ministering and offering the same sacrifices again and again[a], which can never take away sins.
translation:
  language: tl
  text: At ang bawat pari ay nakatayo araw-araw, naglilingkod at paulit-ulit na naghahandog ng parehong mga hain, na hindi kailanman makapag-aalis ng mga kasalanan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “makapagtanggal ng mga kasalanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ... ἱερεὺς
  choice: ang bawat pari
  rationale: Ang πᾶς na kasama ng pangngalang isahan ay may diwang distributibo. Likas sa modernong Tagalog ang “bawat pari” at hindi ito maling nililimitahan sa punong pari.
- source_word: ἕστηκεν
  choice: nakatayo
  rationale: Ipinahahayag ng ganap na anyo ng ἵστημι ang nananatiling kalagayan ng pagtayo. Pinananatili ng “nakatayo” ang malinaw na kaibahan sa pag-upo ng Mesiyas sa kasunod na talata.
- source_word: καθ’ ἡμέραν
  choice: araw-araw
  rationale: Natural at malinaw nitong ipinahahayag ang paulit-ulit na paglilingkod sa bawat araw.
- source_word: λειτουργῶν
  choice: naglilingkod
  rationale: Sa konteksto, tumutukoy ito sa sagradong paglilingkod ng pari. Sapat na malinaw ang “naglilingkod” dahil tahasang pari ang simuno.
- source_word: τὰς αὐτὰς ... θυσίας
  choice: gayunding mga hain
  rationale: Pinananatili ng “gayunding” ang diin sa pag-uulit ng parehong uri ng mga hain, at ang “hain” ang tiyak at karaniwang salitang Filipino para sa sakripisyong panrelihiyon.
- source_word: πολλάκις
  choice: paulit-ulit
  rationale: Malinaw at natural nitong ipinahahayag ang madalas at patuloy na pag-uulit na binibigyang-diin ng talata.
- source_word: προσφέρων
  choice: naghahandog
  rationale: Ang “naghahandog” ang karaniwang salin sa konteksto ng paghahain at nagpapanatili sa panrelihiyong diwa ng pandiwa.
- source_word: αἵτινες
  choice: na
  rationale: Natural na iniuugnay ng “na” ang paliwanag sa naunang “mga hain” nang hindi nagdaragdag ng interpretasyon.
- source_word: οὐδέποτε δύνανται
  choice: hindi kailanman makapag-
  rationale: Pinananatili nito ang ganap na kawalang-kakayahang ipinapahayag ng οὐδέποτε kasama ng δύνανται.
- source_word: περιελεῖν ἁμαρτίας
  choice: makapag-aalis ng mga kasalanan
  rationale: Tuwirang ipinahahayag ng “mag-alis” ang kahulugan ng περιαιρέω at hindi pinahihina ang pahayag tungkol sa kawalang-bisa ng paulit-ulit na mga hain sa pag-aalis ng kasalanan.
theological_decisions:
- issue: Kaugnayan ng tindig ng pari sa argumento ng Hebreo 10
  choice: Pinanatili ang “nakatayo” upang maipakita ang patuloy na paglilingkod ng mga pari at ang kaibahan nito sa pag-upo ng Mesiyas sa talata 12.
  alternative: Gawing mas malabo ang tindig sa pamamagitan ng pagsasaling nakatuon lamang sa kanilang paglilingkod.
  rationale: Sadyang mahalaga sa agarang konteksto ang kaibahan ng nakatayong pari at ng nakaupong Mesiyas; pinananatili ito nang walang idinadagdag na paliwanag sa mismong teksto.
- issue: Lawak ng kawalang-bisa ng mga hain
  choice: Isinalin bilang “hindi kailanman makapag-aalis ng mga kasalanan.”
  alternative: “Hindi lubos na makalutas sa mga kasalanan.”
  rationale: Ganap ang kawalang-kakayahang sinasabi ng Griyego sa argumento ng may-akda. Hindi dapat pahinain ng salin ang tuwirang pahayag nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang “pari,” “naglilingkod,” “naghahandog,” at “mga hain,” habang pinanatili ang retorikal na diin sa araw-araw at paulit-ulit na gawain.
