revisions:
- from: Lumapit tayo nang may pusong tapat[a], taglay ang lubos na katiyakan ng pananampalataya, yamang nawisikan na ang ating mga puso upang malinis[d] mula sa masamang budhi[b], at nahugasan na ang ating mga katawan ng malinis na tubig.[c]
  to: Lumapit tayo nang may pusong tapat[a], taglay ang lubos na katiyakan ng pananampalataya, yamang nalinis na sa pamamagitan ng pagwiwisik[d] ang ating mga puso mula sa masamang budhi[b], at nahugasan na ang ating mga katawan ng malinis na tubig.[c]
  rationale: Inayos ang sugnay ng pagwiwisik upang maging likas at walang kalabuan sa modernong Filipino. Pinananatili ng “sa pamamagitan ng pagwiwisik” ang ritwal na imahen ng ῥεραντισμένοι, samantalang ang “nalinis na ... mula sa masamang budhi” ay malinaw na naghahatid ng kontekstuwal na epekto ng parirala. Hindi binago ang pananaw na hindi tahasang kinikilala ang paghuhugas bilang bautismo.
