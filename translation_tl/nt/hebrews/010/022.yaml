  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: προσερχώμεθα μετὰ ἀληθινῆς καρδίας ἐν πληροφορίᾳ πίστεως, ῥεραντισμένοι τὰς καρδίας ἀπὸ συνειδήσεως πονηρᾶς καὶ λελουσμένοι τὸ σῶμα ὕδατι καθαρῷ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/022.yaml
  text: let us draw near with a true heart in full assurance of faith[d][c][b][a], with our hearts sprinkled clean from an evil conscience and our bodies washed with pure water.
translation:
  language: tl
  text: Lumapit tayo nang may pusong tapat[a], taglay ang lubos na katiyakan ng pananampalataya, yamang nalinis na sa pamamagitan ng pagwiwisik[d] ang ating mga puso mula sa masamang budhi[b], at nahugasan na ang ating mga katawan ng malinis na tubig.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “may tunay na puso.”
    reason: lexical_alternative
  - marker: b
    text: O “mula sa budhing inuusig ng pagkakasala.”
    reason: lexical_alternative
  - marker: c
    text: Maaaring pumukaw ang larawang ito sa pananalita tungkol sa ritwal na paglilinis at maaari rin itong marinig ng ilang mambabasa bilang alusyon sa bautismo, ngunit hindi tahasang tinutukoy ng talata kung anong paghuhugas ito.
    reason: cultural_note
  - marker: d
    text: 'Mas literal: “yamang nawisikan na ang ating mga puso mula sa masamang budhi.”'
    reason: translation_note
lexical_decisions:
- source_word: προσερχώμεθα
  choice: Lumapit tayo
  rationale: Hortatory subjunctive ito na nag-aanyaya sa magkakasamang paglapit. Pinananatili ng “Lumapit tayo” ang diwa ng paglapit sa Diyos sa konteksto ng pagpasok at pagsamba sa Hebreo.
- source_word: ἀληθινῆς καρδίας
  choice: may pusong tapat
  rationale: Ang ἀληθινός ay maaaring mangahulugang tunay, totoo, o tapat. Mas natural sa makabagong Tagalog ang “pusong tapat,” habang ipinahihiwatig pa rin ang pusong tunay at walang pagkukunwari.
- source_word: ἐν πληροφορίᾳ πίστεως
  choice: taglay ang lubos na katiyakan ng pananampalataya
  rationale: Ipinapahayag ng πληροφορία ang ganap o lubos na katiyakan. Hindi nilulutas ng salin kung ang katiyakan ay bunga, katangian, o kapuspusan ng pananampalataya.
- source_word: ῥεραντισμένοι τὰς καρδίας ἀπό
  choice: yamang nawisikan na ang ating mga puso upang malinis mula sa
  rationale: Ipinakikita ng ganap na balintiyak na pandiwaring ῥεραντισμένοι ang umiiral na kalagayang bunga ng isang natapos na pagkilos. Pinananatili ang larawan ng pagwiwisik, habang nililinaw sa natural na Tagalog ang ipinahihiwatig na paglilinis at paghiwalay mula sa masamang budhi.
- source_word: συνειδήσεως πονηρᾶς
  choice: masamang budhi
  rationale: Tuwirang pinananatili ng “masama” ang lawak ng πονηρός sa halip na paliitin ito sa damdamin lamang ng pagkakasala. Karaniwan at malinaw sa Tagalog ang “budhi” para sa συνείδησις.
- source_word: λελουσμένοι τὸ σῶμα
  choice: nahugasan na ang ating mga katawan
  rationale: Ang ganap na pandiwari ay nagsasaad ng kalagayang bunga ng natapos na paghuhugas. Ginawang maramihan ang distributibong isahan na σῶμα upang maging natural sa Tagalog dahil maramihan ang tinutukoy.
- source_word: ὕδατι καθαρῷ
  choice: ng malinis na tubig
  rationale: Ang καθαρός ay nangangahulugang malinis o dalisay. Ang “malinis na tubig” ay natural at pinananatili ang konteksto ng ritwal na paglilinis nang hindi nagdaragdag ng tiyak na sakramental na pagkakakilanlan.
theological_decisions:
- issue: Kung tahasang tutukuyin bilang bautismo ang paghuhugas sa tubig
  choice: Panatilihin ang larawan ng paghuhugas at paglilinis nang hindi tahasang tinatawag itong bautismo
  alternative: Tukuyin ito bilang bautismo, o ituring itong ganap na metapora lamang ng panloob na paglilinis
  rationale: Maaaring pumukaw ang pananalita sa mga ritwal na paghuhugas at maaari ring marinig bilang alusyon sa bautismo, ngunit hindi ito tahasang tinutukoy ng talata. Pinananatili ng salin ang sadyang lawak at tensiyong teolohikal ng teksto.
- issue: Kung isasalin ang πονηρᾶς bilang “nagkasalang” o “guilty”
  choice: masamang budhi
  alternative: budhing inuusig ng pagkakasala
  rationale: Ang Griyego ay nagsasabing “masama,” hindi lamang “may sala.” Iniiwasan nitong paliitin ang moral at ritwal na saklaw ng pahayag tungo sa isang sikolohikal na pakiramdam lamang.
- issue: Kung gagawing tahasan ang resulta ng paglilinis sa ῥεραντισμένοι
  choice: nawisikan ... upang malinis
  alternative: nawisikan ... mula sa
  rationale: Ang paglilinis ay ipinahihiwatig ng konteksto at ng ἀπό na nagpapakita ng paghiwalay mula sa masamang budhi. Idinagdag ang “upang malinis” para sa malinaw at likas na Tagalog, ngunit inilakip sa talababa ang mas pormal na anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tayo” upang panatilihin ang sama-samang panawagan; “budhi” para sa natural ngunit dignidad na bokabularyo; at mga anyong “nawisikan na” at “nahugasan na” upang ipakita ang natapos na pagkilos na may nagpapatuloy na bunga. Hindi tahasang kinilalang bautismo ang paghuhugas.
