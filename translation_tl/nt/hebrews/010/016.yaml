source:
  edition: SBLGNT
  text: Αὕτη ἡ διαθήκη ἣν διαθήσομαι πρὸς αὐτοὺς μετὰ τὰς ἡμέρας ἐκείνας, λέγει κύριος, διδοὺς νόμους μου ἐπὶ καρδίας αὐτῶν, καὶ ἐπὶ ⸂τὴν διάνοιαν⸃ αὐτῶν ἐπιγράψω αὐτούς,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/016.yaml
  text: 'This is the covenant that I will make with them after those days[a], says the Lord: putting my laws upon their hearts, and I will write them on their minds,'
translation:
  language: tl
  text: “Ito ang tipang gagawin ko sa kanila pagkatapos ng mga araw na iyon,” sabi ng Panginoon, “sa paglalagay ko ng aking mga kautusan sa kanilang mga puso, at isusulat ko ang mga iyon sa kanilang mga isip.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas natural sa Filipino: “Ilalagay ko ang aking mga kautusan sa kanilang mga puso, at isusulat ko ang mga iyon sa kanilang mga isip.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαθήκη
  choice: tipan
  rationale: Ang “tipan” ang karaniwang salitang Filipino para sa kasunduang may biblikal at teolohikal na bigat, at pinananatili nito ang ugnayan sa Jeremias 31.
- source_word: διαθήσομαι πρὸς αὐτούς
  choice: gagawin ko sa kanila
  rationale: Sa konteksto ng pakikipagtipan, likas sa Filipino ang “tipang gagawin ko sa kanila”; hindi natural ang literal na “patungo sa kanila.”
- source_word: μετὰ τὰς ἡμέρας ἐκείνας
  choice: pagkatapos ng mga araw na iyon
  rationale: Tuwirang pinananatili ang temporal na parirala nang hindi ito pinalalawak.
- source_word: κύριος
  choice: Panginoon
  rationale: Ito ang likas at tradisyonal na katumbas ng κύριος sa dignified modern Filipino.
- source_word: διδοὺς
  choice: sa paglalagay ko
  rationale: Pinananatili nito ang anyong di-ganap na pandiwa/partisipyo ng Griyego sa halip na tahimik itong gawing isa pang payak na pandiwang panghinaharap.
- source_word: νόμους μου
  choice: aking mga kautusan
  rationale: Pinananatili ang tahasang maramihan at ang kaugnayan sa νόμος; mas angkop dito ang “mga kautusan” kaysa sa mas malawak na “mga tagubilin.”
- source_word: ἐπὶ καρδίας αὐτῶν
  choice: sa kanilang mga puso
  rationale: Natural sa Filipino ang “sa” para sa matalinghagang paglalagay o pag-ukit sa puso, habang pinananatili ang larawan ng panloob na pagkakintal.
- source_word: τὴν διάνοιαν αὐτῶν
  choice: kanilang mga isip
  rationale: Ang “isip” ay malinaw at malawak na katumbas ng διάνοια; ang maramihang “mga isip” ay natural sa Filipino dahil marami ang tinutukoy ng αὐτῶν.
- source_word: ἐπιγράψω αὐτούς
  choice: isusulat ko ang mga iyon
  rationale: Ipinahahayag ng “isusulat” ang pagsulat o pag-ukit, at malinaw na tumutukoy ang “ang mga iyon” pabalik sa mga kautusan.
theological_decisions:
- issue: Sintaks ng sipi mula sa Jeremias
  choice: Panatilihin ang pagkakaiba ng partisipyong διδοὺς at ng tahasang pandiwang panghinaharap na ἐπιγράψω sa pamamagitan ng “sa paglalagay ko … at isusulat ko.”
  alternative: “Ilalagay ko ang aking mga kautusan … at isusulat ko ang mga iyon …”
  rationale: Mas madulas ang alternatibo sa Filipino, ngunit pinapantay nito ang dalawang anyong pandiwa. Pinananatili ng pangunahing salin ang bahagyang tensiyon at kakaibang ayos ng tekstong Griyego ng Hebreo nang nananatiling nauunawaan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “tipan,” “kautusan,” at “Panginoon” bilang mga salitang madaling maunawaan at may angkop na bigat sa kontekstong biblikal. Inilagay ang panipi ayon sa tuwirang pagsasalita, at pinanatili ang bahagyang di-karaniwang sintaks ng Griyego sa paraang mababasa pa rin nang natural.
