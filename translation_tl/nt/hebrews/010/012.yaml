  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀οὗτος δὲ μίαν ὑπὲρ ἁμαρτιῶν προσενέγκας θυσίαν εἰς τὸ διηνεκὲς ἐκάθισεν ἐν δεξιᾷ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/012.yaml
  text: But this one[a], after offering one sacrifice for sins for all time, sat down at the right hand of God[b],
translation:
  language: tl
  text: Ngunit siya[a], matapos maghandog ng iisang hain para sa mga kasalanan na may bisa magpakailanman[c], ay umupo sa kanan ng Diyos[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang isang ito”; mariing inihahambing si Cristo sa mga paring paulit-ulit na naghahandog sa naunang talata.
    reason: translation_explanation
  - marker: b
    text: Ang “sa kanan ng Diyos” ay umaalingawngaw sa Awit 110:1, isang mahalagang talata sa Hebreo tungkol sa pagdakila sa Mesiyas.
    reason: cross_reference
  - marker: c
    text: 'O maaaring iugnay nang mas malapit sa paghahandog: “matapos maghandog magpakailanman ng iisang hain para sa mga kasalanan.”'
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτος
  choice: siya
  rationale: Natural sa modernong Tagalog bilang pagtukoy kay Cristo; pinananatili ng kasunod na “Ngunit” at ng konteksto ang malinaw na paghahambing sa mga paring binanggit sa naunang talata.
- source_word: δὲ
  choice: Ngunit
  rationale: Malinaw na ipinakikita ang pagsalungat sa mga paring nakatayong nag-aalay nang paulit-ulit.
- source_word: μίαν ... θυσίαν
  choice: iisang handog
  rationale: Binibigyang-diin ang pagiging isa at hindi na inuulit ng handog, salungat sa maraming paulit-ulit na hain.
- source_word: ὑπὲρ ἁμαρτιῶν
  choice: para sa mga kasalanan
  rationale: Likas na Tagalog para sa layunin ng handog at pinananatili ang maramihang anyo ng ἁμαρτιῶν.
- source_word: προσενέγκας
  choice: matapos maghandog
  rationale: Ipinahahayag ang kilos na nauna sa pangunahing pandiwang “umupo,” ayon sa aorist participle.
- source_word: εἰς τὸ διηνεκές
  choice: na may bisa magpakailanman
  rationale: Ipinahahayag sa natural na Tagalog ang namamalaging bisa ng iisang handog, habang inilalantad sa talababa ang tunay na posibilidad ng ibang pagkakaugnay ng parirala.
- source_word: ἐκάθισεν
  choice: umupo
  rationale: Tuwirang salin na nagpapanatili sa natapos na kilos at sa kaibahan nito sa patuloy na pagtayo ng mga pari sa talatang 11.
- source_word: ἐν δεξιᾷ τοῦ θεοῦ
  choice: sa kanan ng Diyos
  rationale: Karaniwan at malinaw na pormula ng pagdakila, na nagpapanatili sa alusyon sa Awit 110:1.
theological_decisions:
- issue: Pagkakaugnay ng εἰς τὸ διηνεκές
  choice: 'Iniugnay sa namamalaging bisa ng iisang handog: “iisang handog ... na may bisa magpakailanman.”'
  alternative: Maaari itong iugnay nang mas tuwiran sa paghahandog—“naghandog magpakailanman ng iisang handog”—o sa pag-upo—“umupo magpakailanman sa kanan ng Diyos.”
  rationale: Sa daloy ng Hebreo 10, pangunahing itinatampok ang permanenteng bisa ng minsanang handog ni Cristo laban sa mga paulit-ulit na handog. Gayunman, dahil may sintaktikong kalabuan ang Griyego, pinananatili sa talababa ang alternatibong pagkakaugnay.
- issue: Lakas ng demonstratibong οὗτος
  choice: Isinaling “siya” para sa natural na daloy, na may talababa tungkol sa mas tahasang “ang isang ito.”
  alternative: “Ang isang ito” o “ang taong ito.”
  rationale: Ang literal na demonstratibo ay mabigat at maaaring tumunog na mapanghamak sa kasalukuyang Tagalog. Ang “siya” ay malinaw sa konteksto, habang naitatala sa talababa ang puwersa ng paghahambing.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “handog” sa halip na mas teknikal na “hain”; pinanatili ang tradisyonal at malinaw na “sa kanan ng Diyos.” Kailangang lumitaw sa pangunahing teksto ang lahat ng marker; ang [c] ay dapat ilagay pagkatapos ng “magpakailanman.”
