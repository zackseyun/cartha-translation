  yaml_path: translation/nt/hebrews/010/006.yaml
  text: In whole burnt offerings and sin offerings you took no pleasure[a].
translation:
  language: tl
  text: Hindi ka nalugod sa mga handog na sinunog nang buo at sa mga handog para sa kasalanan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “mga handog na sinusunog at mga handog para sa kasalanan.” Ang pariralang Griego na περὶ ἁμαρτίας ay isang idyomatikong katawagang pansakripisyo para sa handog na inihahandog dahil sa kasalanan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁλοκαυτώματα
  choice: mga handog na sinunog nang buo
  rationale: Ipinahahayag nito na ang mga handog ay lubusang tinutupok sa apoy, habang nananatiling natural at malinaw sa makabagong Tagalog.
- source_word: καὶ
  choice: at
  rationale: Payak na pangatnig na nag-uugnay sa dalawang uri ng handog.
- source_word: περὶ ἁμαρτίας
  choice: mga handog para sa kasalanan
  rationale: Sa kontekstong pansakripisyo, ito ay idyomatikong tumutukoy sa mga handog na inihahandog para sa kasalanan. Mas malinaw ito sa Tagalog kaysa sa literal na “tungkol sa kasalanan.”
- source_word: οὐκ εὐδόκησας
  choice: Hindi ka nalugod
  rationale: Pinananatili ang ikalawang panauhang isahan na tuwirang tumutukoy sa Diyos at ang diwang hindi Niya kinalugdan ang mga handog; dignified at natural ang “nalugod” sa konteksto.
theological_decisions:
- issue: Tiyak na terminolohiyang pansakripisyo sa sipi mula sa Awit 40 LXX
  choice: 'Panatilihin ang dalawang tiyak na uri: “mga handog na sinunog nang buo” at “mga handog para sa kasalanan.”'
  alternative: “mga handog na sinusunog at mga hain para sa kasalanan”
  rationale: Mahalaga sa pangangatwiran ng Hebreo ang pagkilala sa mga tiyak na uri ng handog. Hindi ginawang pangkalahatang “mga sakripisyo” ang mga ito, at hindi rin dinagdagan ng paliwanag na doktrinal.
- issue: Kahulugan ng οὐκ εὐδόκησας
  choice: “Hindi ka nalugod”
  alternative: “Hindi mo kinalugdan”
  rationale: Kapuwa posible, ngunit ang napili ay tuwiran, natural, at nagpapanatili sa evaluative na diwa ng pandiwa nang hindi pinalalabis ang emosyonal na kahulugan.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang “handog” bilang madaling maunawaang katawagang pansakripisyo, at ipinaliwanag ang buong pagsunog sa halip na gumamit ng teknikal o makalumang salitang maaaring malabo sa karaniwang mambabasa.
