base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/035.yaml
  text: Therefore[a], do not throw away your boldness, which has a great reward,
translation:
  language: tl
  text: Kaya huwag ninyong itapon ang inyong katapangan[a], na may malaking gantimpala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagtitiwala.” Ang salitang Griyego ay maaari ring tumukoy sa malaya at panatag na paglapit, lalo na sa Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἀποβάλητε
  choice: huwag ninyong itapon
  rationale: Ang aorist subjunctive na may μή ay pagbabawal. Pinananatili ng “itapon” ang diwa ng sinasadyang pagtalikod o pagbitaw, hindi ng basta pagkawala.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinakikita ang kongklusyon mula sa naunang paalaala at panghihikayat; natural at malinaw ito sa modernong Tagalog.
- source_word: τὴν παρρησίαν ὑμῶν
  choice: ang inyong katapangan
  rationale: Ang παρρησία ay tumutukoy sa malaya at matatag na lakas ng loob, lalo na sa paglapit sa Diyos at hayagang paninindigan. Ang “katapangan” ay nagpapanatili sa masiglang diwa, samantalang ang “pagtitiwala” ay lehitimong alternatibo.
- source_word: ἥτις ἔχει
  choice: sapagkat may kalakip itong
  rationale: Ang kwalitatibong panghalip ay nagpapaliwanag sa katangian o kahalagahan ng naunang katapangan. Mas natural sa Tagalog ang paliwanag na “sapagkat may kalakip itong” kaysa sa mekanikal na “na may.”
- source_word: μεγάλην μισθαποδοσίαν
  choice: malaking gantimpala
  rationale: Ang μισθαποδοσία ay kabayaran o gantimpala; sa positibong konteksto rito, malinaw at natural ang “gantimpala,” nang hindi labis na binibigyang-diin ang transaksiyonal na kahulugan.
theological_decisions:
- issue: Kahulugan ng παρρησία sa Hebreo 10:35
  choice: katapangan
  alternative: pagtitiwala; malayang paglapit
  rationale: Saklaw ng salita ang matatag na pagtitiwala, malayang paglapit sa Diyos, at hayagang paninindigan. Pinili ang “katapangan” upang mapanatili ang lakas ng panghihikayat, habang inilalahad sa talababa ang tunay na leksikal na alternatibo.
- issue: Ugnayan ng katapangan at gantimpala
  choice: may kalakip itong malaking gantimpala
  alternative: ito ay may malaking gantimpala
  rationale: Hindi tinutukoy ng talata ang eksaktong mekanismo ng paggantimpala. Ang salin ay nagpapanatili sa pahayag na may kaugnay na malaking gantimpala ang katapangang ito, nang hindi dinaragdagan ng denominasyonal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Kaya” para sa natural na lohikal na pag-uugnay at “huwag ninyong itapon” upang mapanatili ang matinding larawan ng sinasadyang pagbitaw.
