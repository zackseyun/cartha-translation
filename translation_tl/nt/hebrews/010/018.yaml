translation:
  language: tl
  text: Kung may kapatawaran sa mga ito[a], wala nang handog para sa kasalanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagpapatawad ng mga ito.” Ang “mga ito” ay tumutukoy sa mga kasalanan at mga gawang labag sa kautusan na binanggit sa naunang talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου
  choice: kung saan
  rationale: Likas na Filipino para sa saklaw o kalagayang ipinakikilala ng ὅπου, at pinananatili ang lohikal na anyo ng pangungusap.
- source_word: δὲ
  choice: hindi isinalin nang hiwalay
  rationale: Mahinang pang-ugnay o hudyat ng konklusyon ito rito; sapat nang ipinahihiwatig ng daloy ng pangungusap sa Filipino, at ang tahasang “ngayon” o “ngunit” ay maaaring magdagdag ng di-kinakailangang temporal o pasalungat na diin.
- source_word: ἄφεσις
  choice: kapatawaran
  rationale: Malinaw at karaniwang modernong salitang Filipino para sa pagpapatawad o pagpapawalang-sala sa mga kasalanan sa kontekstong ito.
- source_word: τούτων
  choice: sa mga ito
  rationale: Pinananatili ang demonstratibong pagtukoy nang hindi tahasang ipinapasok sa pangunahing teksto ang salitang “kasalanan”; ang tinutukoy ay nililinaw sa talababa.
- source_word: οὐκέτι
  choice: wala nang
  rationale: Likas at tiyak na nagpapahayag na hindi na nagpapatuloy o kinakailangan ang tinutukoy.
- source_word: προσφορὰ
  choice: handog
  rationale: Karaniwang terminong Filipino na nagpapanatili sa pangkalahatang sakripisyal na kahulugan ng προσφορά nang hindi ito pinaliliit sa isang mas tiyak na uri.
- source_word: περὶ ἁμαρτίας
  choice: para sa kasalanan
  rationale: Pinananatili ang sakripisyal na diwa ng parirala nang hindi ito labis na tinutukoy bilang isang teknikal na “handog para sa kasalanan” lamang.
theological_decisions:
- issue: Ang pangwakas na bisa ng handog ni Cristo
  choice: Sinasabi ng talata na kung may kapatawaran na, wala nang handog para sa kasalanan.
  alternative: Maaaring unawain bilang pagtukoy lamang sa pag-uulit ng mga handog na Levitico, o bilang mas malawak na pag-aalis sa lahat ng uri ng handog.
  rationale: 'Pinananatili ng salin ang tuwirang pahayag ng Griyego at ang tensiyon ng konteksto: hindi na kailangan ang handog para sa kasalanan, ngunit hindi nito pinalalawak ang pahayag sa lahat ng posibleng uri ng paghahandog.'
translation_notes:
  register: Modernong Filipino Tagalog na maikli, marangal, at madaling maunawaan. Ginamit ang “kapatawaran” at “handog” bilang pamilyar ngunit may bigat na mga terminong biblikal; iniwasan ang arkaiko o labis na teknikal na pananalita.
