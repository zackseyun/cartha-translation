lexical_decisions:
- source_word: τὸ λοιπὸν
  choice: mula noon
  rationale: Ginagamit ang pariralang Griyego bilang pang-abay na tumutukoy sa panahong kasunod ng paghahandog at pag-upo ng Anak na binanggit sa naunang talata.
- source_word: ἐκδεχόμενος
  choice: naghihintay
  rationale: Likas at malinaw ito sa modernong Tagalog at inilalarawan ang nagpapatuloy na kalagayan habang inaasahan ang tiyak na mangyayari; binabanggit sa talababa ang posibleng diin sa pananabik o pag-asa.
- source_word: ἕως
  choice: hanggang
  rationale: Karaniwang panandang temporal na nagpapahayag ng hantungan ng paghihintay.
- source_word: τεθῶσιν
  choice: ay gawing
  rationale: Pinananatili nito ang balintiyak na diwa ng aorist passive subjunctive ng τίθημι pagkatapos ng ἕως, habang natural ang pagkakabuo sa Tagalog.
- source_word: οἱ ἐχθροὶ αὐτοῦ
  choice: ang kanyang mga kaaway
  rationale: Tuwirang salin ng pangngalang may panghalip na paari.
- source_word: ὑποπόδιον τῶν ποδῶν αὐτοῦ
  choice: tuntungan ng kanyang mga paa
  rationale: Pinananatili ang kongkretong larawan at alingawngaw ng Awit 110:1; ang “tuntungan” ay dignificado at madaling maunawaan.
theological_decisions:
- issue: Larawan ng pagluklok ng Mesiyas mula sa Awit 110:1
  choice: Panatilihin ang kongkretong larawan na ang mga kaaway ay ginagawang “tuntungan ng kanyang mga paa.”
  alternative: hanggang malupig ang kanyang mga kaaway; hanggang mapasailalim sa kanyang mga paa ang kanyang mga kaaway
  rationale: Sadyang inuulit ng Hebreo ang larawan ng Awit 110:1. Ang pagpapanatili rito ay nag-iingat sa ugnayang intertekstuwal at teolohikal nang hindi nilulutas sa isang paliwanag lamang ang talinghaga.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Pinanatili ang anyong bahagi ng pangungusap dahil ang talata ay syntactically nakaugnay sa naunang pahayag. Ginamit ang “kanyang” para sa malinaw at karaniwang paari, at “tuntungan” upang mapanatili ang larawan ng Awit nang hindi nagiging labis na makaluma.
