base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/027.yaml
  text: but a fearful expectation of judgment[a], and a fury of fire about to consume the adversaries.
translation:
  language: tl
  text: kundi isang nakapangingilabot na paghihintay sa paghuhukom[a], at ang bagsik ng apoy na malapit nang tumupok sa mga sumasalungat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “isang nakatatakot na pag-asam sa hatol at ang nag-aalab na bagsik na malapit nang tumupok sa mga sumasalungat.”
    reason: Ipinakikita ang mga natural na alternatibo para sa ἐκδοχή, κρίσις, at sa siksik na pariralang πυρὸς ζῆλος.
lexical_decisions:
- source_word: φοβερὰ
  choice: nakapangingilabot
  rationale: Ipinahahayag ang matinding takot na likas sa inaasahang paghuhukom, sa dignified at natural na modernong Tagalog.
- source_word: δέ
  choice: kundi
  rationale: 'Sa kaugnayan nito sa pagtanggi sa naunang talata, malinaw na ipinakikita ng “kundi” ang kontrast: wala nang natitira kundi ito.'
- source_word: τις ἐκδοχὴ
  choice: ang … paghihintay
  rationale: Ang ἐκδοχή ay paghihintay o pag-asam sa darating. Hindi isinalin nang hiwalay ang τις bilang “isang tiyak na” dahil magiging di-natural at maaaring maling magpahiwatig ng katiyakan sa Tagalog; nadadala ng parirala ang di-tiyak ngunit tunay na bagay na naghihintay.
- source_word: κρίσεως
  choice: sa paghuhukom
  rationale: Pinananatili ang malawak na judicial sense ng κρίσις nang hindi paunang nililimitahan sa isang partikular na doktrinal na paliwanag.
- source_word: πυρὸς ζῆλος
  choice: ang bagsik ng apoy
  rationale: Ang ζῆλος sa kontekstong ito ay matinding maalab na puwersa o poot. Ang “bagsik ng apoy” ay natural sa Tagalog at pinananatili ang siksik at personipikadong larawan ng Griyego.
- source_word: ἐσθίειν
  choice: tumupok
  rationale: Karaniwang ginagamit ang “tumupok” sa mapanirang pagkilos ng apoy at tumpak na naghahatid ng diwang ‘consume/devour.’
- source_word: μέλλοντος
  choice: malapit nang
  rationale: Ipinahahayag ang nalalapit na kilos na taglay ng μέλλω nang hindi ito ginagawang tahasang pahayag tungkol sa eksaktong oras.
- source_word: τοὺς ὑπεναντίους
  choice: mga sumasalungat
  rationale: Tumutukoy sa mga nakahanay laban o kontra; mas tuwirang nagpapakita ng aktibong pagsalungat kaysa sa pangkalahatang “mga kaaway.”
theological_decisions:
- issue: Kalikasan ng larawan ng paghuhukom
  choice: Panatilihin ang matinding larawan ng apoy na tumutupok nang hindi ipinapaliwanag kung ito ay literal, metaporikal, o tahasang walang hanggan.
  alternative: Isalin bilang “walang-hanggang kaparusahan sa naglalagablab na apoy.”
  rationale: Malubha ang babala ng talata, ngunit hindi nito sa sarili nito tinutukoy ang lahat ng detalye ng paghuhukom; iniiwasan ng salin ang pagpasok ng higit na tiyak na sistemang doktrinal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at malinaw. Ginamit ang “nakapangingilabot,” “paghuhukom,” at “tumupok” upang mapanatili ang solemneng tono at matinding larawan ng orihinal nang hindi nagiging lipas o labis na teknikal.
