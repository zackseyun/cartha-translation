  text: Ἑκουσίως γὰρ ἁμαρτανόντων ἡμῶν μετὰ τὸ λαβεῖν τὴν ἐπίγνωσιν τῆς ἀληθείας, οὐκέτι περὶ ἁμαρτιῶν ἀπολείπεται θυσία,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/026.yaml
  text: For if we go on sinning deliberately after receiving the knowledge of the truth[a], there no longer remains a sacrifice for sins,
translation:
  language: tl
  text: Sapagkat kung patuloy tayong nagkakasala nang sinasadya matapos nating tanggapin ang kaalaman sa katotohanan[a], wala nang natitirang hain para sa mga kasalanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mas lubos na kaalaman sa katotohanan.” Ang salitang Griyego ay maaaring magpahiwatig ng mas buo o tiyak na kaalaman.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑκουσίως
  choice: sinasadya
  rationale: Malinaw at makabagong salitang Filipino para sa kusang-loob at sinasadyang pagkilos; iniiwasan ang mas legalistikong himig ng ibang katumbas.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na ugnayan ng talata sa naunang argumento.
- source_word: ἁμαρτανόντων ἡμῶν
  choice: kung patuloy tayong ... magkasala
  rationale: Ipinahahayag ang maaaring patuloy o nagpapatuloy na kilos ng pangkasalukuyang participle at ginagawang likas sa Filipino ang genitive absolute sa anyong kondisyonal.
- source_word: μετὰ τὸ λαβεῖν
  choice: matapos nating tanggapin
  rationale: Malinaw na ipinakikita ang temporal na pagkakasunod at ang naunang pagtanggap.
- source_word: ἐπίγνωσιν
  choice: kaalaman
  rationale: Likas at hindi labis na interpretatibong salin; ang posibleng diwa ng ganap o mas malalim na pagkakilala ay inilalagay sa talababa.
- source_word: τῆς ἀληθείας
  choice: sa katotohanan
  rationale: Likas na Filipino para sa genitive na ‘knowledge of the truth,’ habang pinananatili ang tiyak na katotohanang tinutukoy sa konteksto.
- source_word: οὐκέτι
  choice: wala nang
  rationale: Karaniwan at malinaw na pagpapahayag na mula sa puntong iyon ay hindi na nananatili ang tinutukoy.
- source_word: περὶ ἁμαρτιῶν
  choice: para sa mga kasalanan
  rationale: Ang ‘para sa’ ay angkop sa kontekstong pansakripisyo at malinaw sa ordinaryong mambabasa.
- source_word: ἀπολείπεται
  choice: natitirang
  rationale: Likas na naisasama sa pariralang ‘wala nang natitirang’ ang diwa ng nananatili o naiiwan.
- source_word: θυσία
  choice: handog
  rationale: Sa konteksto ng Hebreo, likas at dignified ang ‘handog’ bilang pansakripisyong alay; hindi nito nilulutas nang higit sa teksto ang eksaktong anyo ng handog.
theological_decisions:
- issue: Aspekto at pastoral/teolohikal na puwersa ng ἁμαρτανόντων
  choice: “kung patuloy tayong sinasadyang magkasala,” na tumutukoy sa nagpapatuloy na sinadyang pagkakasala
  alternative: “kung sinasadya nating magkasala,” na maaaring unawain bilang isang kilos lamang
  rationale: Ang pangkasalukuyang participle ay likas na maaaring magpahiwatig ng nagpapatuloy na pagkilos. Pinananatili nito ang bigat ng babala nang hindi ipinapahayag na tiyak na tumutukoy ito sa bawat isang hiwalay na kasalanang sinadya.
- issue: Saklaw ng ἐπίγνωσις sa konteksto ng babala
  choice: “kaalaman sa katotohanan,” nang hindi tinutukoy kung ito ay katumbas ng espirituwal na muling kapanganakan
  alternative: “ganap na pagkakilala sa katotohanan” o “nakapagliligtas na pagkakilala sa katotohanan”
  rationale: Sinasabi ng teksto na natanggap ang kaalaman sa katotohanan ngunit hindi nito tahasang nililinaw ang eksaktong teolohikal na kalagayan ng mga taong binabalaan. Kaya pinananatili ang tensiyon at hindi ipinapasok ang natatanging doktrina ng alinmang denominasyon.
- issue: Kahulugan ng natitirang handog
  choice: “wala nang natitirang handog para sa mga kasalanan,” nang hindi nagdaragdag ng paliwanag kung bakit o para kanino ito hindi na nananatili
  alternative: Pagpapaliwanag na wala nang ibang handog bukod kay Cristo
  rationale: Bagaman kaugnay ito ng mas malawak na argumento ng Hebreo tungkol sa handog ni Cristo, ang salin ng mismong talata ay hindi dapat magdagdag ng paliwanag na wala sa sugnay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘patuloy’ upang maipakita ang duratibong puwersa, at ‘sinasadyang magkasala’ para sa likas na ayos sa Filipino. Ang marker na [a] ay nasa pangunahing teksto at tumutugma sa talababa.
