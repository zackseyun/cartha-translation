  text: and I will no longer remember their sins and their lawless deeds[a][b].
translation:
  language: tl
  text: at ang kanilang mga kasalanan at ang kanilang mga gawang labag sa kautusan ay hinding-hindi ko na aalalahanin.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas pormal na salin: “Tiyak na hindi ko na aalalahanin ang kanilang mga kasalanan at ang kanilang mga gawang labag sa kautusan.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “mga gawang labag sa kautusan” ay salin ng ἀνομίαι; maaari ring isaling “mga paglabag sa kautusan” o, ayon sa tradisyon, “mga kasamaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: at
  rationale: Karaniwang pang-ugnay ito. Pinanatili sa simula sapagkat ipinagpapatuloy ng talata ang naunang sipi.
- source_word: τῶν ἁμαρτιῶν αὐτῶν
  choice: kanilang mga kasalanan
  rationale: Tuwiran at likas na salin ng pangmaramihang ἁμαρτιῶν kasama ng αὐτῶν.
- source_word: καὶ τῶν ἀνομιῶν αὐτῶν
  choice: at mga gawang labag sa kautusan
  rationale: Ipinahahayag ng ἀνομίαι ang mga gawa o asal na lumalabag sa kautusan. Mas malinaw ito sa karaniwang mambabasa kaysa sa tradisyonal ngunit hindi gaanong transparent na “mga kasamaan.”
- source_word: οὐ μὴ μνησθήσομαι
  choice: hindi ko ... aalalahanin
  rationale: Pinananatili ang biblikal na larawan ng pag-alaala, habang ang “hindi” kasama ng “na” ay natural na nagpapahayag ng mariing pagtanggi sa hinaharap sa Filipino.
- source_word: ἔτι
  choice: na
  rationale: Sa pariralang “hindi ko na aalalahanin,” likas na naihahatid ang diwang “hindi na” o “hindi na kailanman mula ngayon.”
theological_decisions:
- issue: Ang hindi pag-alaala ng Diyos sa mga kasalanan
  choice: Pinanatili ang tuwirang pahayag na “hindi ko na aalalahanin” bilang pangako ng Diyos sa tipan.
  alternative: “tiyak na hindi ko na aalalahanin” o pagpapakahulugang “hindi ko na ibibilang laban sa kanila”
  rationale: Mahalagang panatilihin ang biblikal na idyoma ng pag-alaala at hindi pag-alaala. Hindi ito pinalitan ng paliwanag tungkol sa pagkawala ng kaalaman, ni tahasang nilutas bilang “hindi ibibilang laban sa kanila,” upang mapanatili ang teolohikal na tensiyon ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang panimulang “at” dahil bahagi ito ng nagpapatuloy na sipi. Ang ayos na may “ay” ay nagbibigay-linaw sa dalawang magkatugmang layon nang hindi nagiging lipas o masalimuot.
