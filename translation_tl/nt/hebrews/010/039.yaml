  text: ἡμεῖς δὲ οὐκ ἐσμὲν ὑποστολῆς εἰς ἀπώλειαν, ἀλλὰ πίστεως εἰς περιποίησιν ψυχῆς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/039.yaml
  text: But we are not of shrinking back to destruction[d][c][b][a], but of faith to the preservation of the soul.
translation:
  language: tl
  text: Ngunit hindi tayo kabilang sa mga umuurong tungo sa kapahamakan,[a] kundi sa mga may pananampalataya tungo sa pagpapanatili ng buhay.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “umatras” o “tumalikod.” Ang salitang Griego ay tumutukoy sa pag-urong o pag-atras; inuunawa ito ng ilan sa mas matinding diwa na lubusang pagtalikod sa pananampalataya.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “katapatan.” Maaaring saklawin ng salitang Griego ang matiyagang pananatiling tapat, gayundin ang pananampalataya.
    reason: alternative_reading
  - marker: c
    text: Maaari ring “tungo sa pagkakamit ng buhay” o “tungo sa pagpapanatili ng kaluluwa/sarili.” Maaaring tumukoy ang pariralang Griego sa buhay o sa buong pagkatao, hindi lamang sa “kaluluwa” sa makitid na makabagong diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: Ngunit hindi tayo
  rationale: Pinananatili ang mariing panghalip na unang panauhang maramihan at ang pagsalungat sa naunang babala.
- source_word: οὐκ ἐσμὲν ὑποστολῆς
  choice: hindi tayo kabilang sa mga umuurong
  rationale: Ang anyong genitibo ay nagpapahiwatig ng pagiging kabilang sa isang uri. Mas natural ito sa makabagong Tagalog kaysa sa literal na 'hindi tayo sa pag-urong,' habang hindi pinatitindi ang salita bilang tahasang pagtalikod sa pananampalataya.
- source_word: εἰς ἀπώλειαν
  choice: tungo sa kapahamakan
  rationale: Ipinahahayag ng εἰς ang hantungan o kinalabasan. Ang 'kapahamakan' ay malinaw at mabigat ngunit hindi labis na nagpapakahulugan.
- source_word: ἀλλὰ πίστεως
  choice: kundi sa mga may pananampalataya
  rationale: Pinananatili ang tahasang pagsalungat at isinasalin ang πίστις bilang 'pananampalataya,' habang iniiwan sa talababa ang posibleng diwa ng katapatan at pagtitiyaga.
- source_word: εἰς περιποίησιν ψυχῆς
  choice: tungo sa pagpapanatili ng buhay
  rationale: Kaagapay ito ng 'tungo sa kapahamakan.' Ang 'pagpapanatili' ay umaayon sa agarang pagsalungat, at ang 'buhay' ay likas na naghahatid ng malawak na diwa ng ψυχή bilang buhay o buong sarili nang hindi nililimitahan ito sa makabagong konsepto ng kaluluwa.
theological_decisions:
- issue: Diwa ng πίστις na kasalungat ng ὑποστολή
  choice: pananampalataya
  alternative: katapatan o matiyagang pananatiling tapat
  rationale: Maaaring kasama sa πίστις dito ang matiyagang katapatan, ngunit hindi kinakailangang ipasiya ng pangunahing salin ang buong saklaw nito; kaya pinanatili ang karaniwang salin at inilagay ang ibang posibilidad sa talababa.
- issue: Diwa ng περιποίησις ψυχῆς
  choice: pagpapanatili ng buhay
  alternative: pagkakamit ng buhay; pagpapanatili ng kaluluwa o sarili
  rationale: Pinapaboran ng pagsalungat sa 'kapahamakan' ang diwa ng pagpapanatili, ngunit maaaring mangahulugan ang περιποίησις ng pagkakamit o pagtatamo. Hindi nilulutas nang tahimik ng salin ang lahat ng tensiyong leksikal, kaya itinatala ang mga alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang paulit-ulit na 'kabilang sa mga' upang gawing likas sa Tagalog ang eliptikong mga genitibo ng Griego, habang pinananatili ang mahigpit na pagtutulad ng dalawang magkasalungat na pangkat at ng kanilang mga hantungan.
