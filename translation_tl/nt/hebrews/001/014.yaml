- from: Hindi ba silang lahat ay mga espiritung naglilingkod, na isinusugo upang maglingkod alang-alang sa mga nakatakdang magmana ng kaligtasan?[a]
  to: Hindi ba lahat sila ay mga espiritung naglilingkod, na isinusugo upang maglingkod alang-alang sa mga magmamana ng kaligtasan?[a]
  rationale: Pinalitan ang “mga nakatakdang magmana” ng “mga magmamana” upang mapanatili ang futurong/prospektibong lakas ng μέλλω nang hindi nagdaragdag ng konsepto ng pagtatakda. Inayos din ang ayos ng retorikal na tanong para sa mas likas na Tagalog. Pinananatili ng talababa ang posibleng mas mariing prospective na salin nang hindi ipinipilit na ang pangyayari ay tiyak na nalalapit.
