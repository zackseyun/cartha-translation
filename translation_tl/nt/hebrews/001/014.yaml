  text: οὐχὶ πάντες εἰσὶν λειτουργικὰ πνεύματα εἰς διακονίαν ἀποστελλόμενα διὰ τοὺς μέλλοντας κληρονομεῖν σωτηρίαν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/014.yaml
  text: Are they not all ministering spirits, being sent out for service for the sake of those who are about to inherit salvation?[a]
translation:
  language: tl
  text: Hindi ba lahat sila ay mga espiritung naglilingkod, na isinusugo upang maglingkod alang-alang sa mga magmamana ng kaligtasan?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga malapit nang magmana ng kaligtasan.” Ang pananalitang Griyego ay may diwang nakatuon sa hinaharap.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχὶ
  choice: Hindi ba
  rationale: Ipinahahayag ang retorikal na tanong na umaasang sasang-ayon ang mambabasa.
- source_word: πάντες
  choice: silang lahat
  rationale: Pinananatili ang saklaw na sumasaklaw sa lahat ng anghel na tinutukoy.
- source_word: λειτουργικὰ πνεύματα
  choice: mga espiritung naglilingkod
  rationale: Likas sa modernong Tagalog at pinananatili ang diwa ng paglilingkod, kabilang ang marangal o banal na konteksto, nang hindi nagpapahiwatig ng posisyon sa simbahan.
- source_word: εἰς διακονίαν
  choice: upang maglingkod
  rationale: Malinaw na ipinapakita ang layunin ng pagsusugo; mas natural ito sa Tagalog kaysa pilit na pagpapanatili sa anyong pangngalan.
- source_word: ἀποστελλόμενα
  choice: na isinusugo
  rationale: Ang aspektong di-ganap at tinig na balintiyak ay kumakatawan sa present passive participle at sa patuloy o karaniwang pagsusugo sa kanila.
- source_word: διὰ
  choice: alang-alang sa
  rationale: Ipinapahayag ang pakinabang o kapakanan ng mga taong tatanggap ng paglilingkod.
- source_word: τοὺς μέλλοντας
  choice: mga nakatakdang
  rationale: Pinananatili ang prospektibo at nakaharap-sa-hinaharap na diwa ng μέλλω, ngunit hindi nito kinakailangang ipahiwatig ang isang tiyak na doktrina ng predestinasyon.
- source_word: κληρονομεῖν
  choice: magmana
  rationale: Pinananatili ang mahalagang larawan ng pagmamana at pagiging tagapagmana sa Hebreo.
- source_word: σωτηρίαν
  choice: kaligtasan
  rationale: Karaniwan, malinaw, at angkop na terminong teolohikal sa Tagalog.
theological_decisions:
- issue: Diwa ng μέλλοντας κληρονομεῖν σωτηρίαν
  choice: mga nakatakdang magmana ng kaligtasan
  alternative: mga magmamana ng kaligtasan
  rationale: Ipinakikita ng salin ang prospektibo o nakaharap-sa-hinaharap na diwa nang hindi tinutukoy kung gaano kalapit ang pangyayari o nagtataguyod ng natatanging doktrina tungkol sa katiyakan o predestinasyon. Nililinaw ng talababa ang mas payak na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang pandiwang “upang maglingkod” para sa likas na daloy ng Tagalog, habang pinanatili ang retorikal na tanong, ang pagiging espiritu ng mga anghel, at ang larawan ng pagmamana.
