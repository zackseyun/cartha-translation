review_pass:
  verdict: revise
  source_fidelity: Ang “mga nakatakdang magmana” ay mas malakas kaysa sa μέλλοντας. Ang salita ay nagpapahiwatig ng hinaharap/prospektibong pagmamana, ngunit hindi nito tahasang sinasabi na ang mga tao ay itinalaga o itinakda. Ang “mga magmamana” ay tapat na pinananatili ang futurong diwa at ang larawan ng mana.
  naturalness: Mas natural sa modernong Tagalog ang “Hindi ba lahat sila ay” kaysa “Hindi ba silang lahat ay.” Ang magkaugnay na “naglilingkod” at “upang maglingkod” ay bahagyang paulit ngunit sumasalamin sa magkahiwalay na λειτουργικά at διακονία at nananatiling malinaw.
  terminology: Ang “mga espiritung naglilingkod,” “isinusugo,” “magmana,” at “kaligtasan” ay angkop, malinaw, at marangal na mga termino. Iniiwasan ng rebisyon ang di-kinakailangang predestinarian na pahiwatig ng “nakatalaga.”
  issues:
  - severity: medium
    issue: Ang “mga nakatakdang magmana” ay nagdaragdag ng ideya ng pagtatakda o predestinasyon.
    rationale: Ang μέλλοντας na may infinitive ay pangunahing nagpapahayag ng prospektibo o futurong kilos. Hindi ligtas na ipasok ang “nakatalaga,” sapagkat higit itong tiyak kaysa sa Griyego at maaaring magpahiwatig ng doktrinal na pagbasa.
  - severity: low
    issue: Medyo di-likas ang ayos na “Hindi ba silang lahat ay.”
    rationale: Ang “Hindi ba lahat sila ay” ang mas karaniwan at makinis na ayos sa modernong Filipino Tagalog, nang walang pagbabago sa saklaw ng πάντες.
  revised_text: Hindi ba lahat sila ay mga espiritung naglilingkod, na isinusugo upang maglingkod alang-alang sa mga magmamana ng kaligtasan?[a]
