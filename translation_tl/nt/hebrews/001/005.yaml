id: HEB.1.5
reference: Hebrews 1:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Τίνι γὰρ εἶπέν ποτε τῶν ἀγγέλων· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε, καὶ πάλιν· Ἐγὼ ἔσομαι αὐτῷ εἰς πατέρα, καὶ αὐτὸς ἔσται μοι εἰς υἱόν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/005.yaml
  text: For to which of the angels did he ever say[a], “You are my Son; today I have begotten you”? And again, “I will be to him a father[c][b], and he will be to me a son”?
translation:
  language: tl
  text: 'Sapagkat kanino sa mga anghel sinabi ng Diyos kailanman,[a]


    “Ikaw ang aking Anak;

    ngayon ay ako ang naging ama mo”?[b]


    At muli,


    “Ako ay magiging Ama niya,

    at siya ay magiging anak ko”?[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “sinabi niya anumang panahon.”'
    reason: lexical_alternative
  - marker: b
    text: Sipi mula sa Awit 2:7. Ang “ngayon ay ako ang naging ama mo” ay pagsasalin ng pananalitang “ngayon ay ipinanganak kita” sa diwang aktibo ng isang ama. Inuugnay ang pariralang ito sa pagluklok sa hari, muling pagkabuhay, o sa walang-hanggang kaugnayan ng Anak sa Ama. Hindi nagpapasya ang salin sa mga pagpapakahulugang ito.
    reason: cross_reference
  - marker: c
    text: 'Sipi mula sa 2 Samuel 7:14. Maaari ring idiomatikong isalin: “Ako ang magiging ama niya, at siya ang magiging anak ko.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Τίνι γὰρ ... τῶν ἀγγέλων
  choice: Sapagkat kanino sa mga anghel
  rationale: Pinananatili ang paliwanag na ugnayan ng γὰρ sa naunang argumento at ang paghahambing sa lahat ng anghel. Likas sa Filipino ang “kanino sa mga anghel” kaysa sa mas mekanikal na “sa alin sa mga anghel.”
- source_word: εἶπέν ποτε
  choice: kailanman sinabi ng Diyos
  rationale: Ipinahahayag ng “kailanman” ang retorikal na diwa ng ποτέ—wala ni isang pagkakataon. Idinagdag ang “ng Diyos” bilang malinaw na paksa mula sa konteksto at sa dalawang sipi; hindi nito binabago ang tinutukoy ng Griyego.
- source_word: ἀγγέλων
  choice: mga anghel
  rationale: Sa Hebreo 1, malinaw na mga makalangit na anghel ang tinutukoy, hindi mga taong mensahero.
- source_word: Υἱός μου εἶ σύ
  choice: Ikaw ang aking Anak
  rationale: Natural na ayos sa Filipino na pinananatili ang tuwirang pagtukoy sa natatanging Anak sa argumento ng kabanata.
- source_word: σήμερον γεγέννηκά σε
  choice: ngayon ay ipinanganak kita
  rationale: Ang “ipinanganak kita” ay tuwiran at marangal na katumbas ng γεννάω sa aktibong pahayag ng ama. Pinananatili nito ang metapora at hindi tinutukoy kung ang “ngayon” ay tumutukoy sa pagluklok, muling pagkabuhay, o walang-hanggang kaugnayan.
- source_word: καὶ πάλιν
  choice: At sinabi rin niya
  rationale: Malinaw at natural na pormulang Filipino para sa pagpapakilala ng isa pang sipi sa Kasulatan.
- source_word: Ἐγὼ ἔσομαι αὐτῷ εἰς πατέρα
  choice: Ako ay magiging Ama niya
  rationale: Idiomatiko sa Filipino at tapat sa relasyong ipinahahayag ng εἰς πατέρα. Ang literal na “magiging isang ama para sa kanya” ay mas mabigat at maaaring magpahiwatig na isa lamang siya sa maraming ama.
- source_word: καὶ αὐτὸς ἔσται μοι εἰς υἱόν
  choice: at siya ay magiging anak ko
  rationale: Pinananatili ang balanseng paralelismo at ang pormulang tipan ng sipi sa natural na Filipino.
theological_decisions:
- issue: Kahulugan ng “ngayon ay ipinanganak kita”
  choice: Panatilihin ang pananalita ng Awit 2:7 nang hindi nililinaw sa mismong salin kung aling teolohikal o makasaysayang pangyayari ang tinutukoy.
  alternative: Ipaliwanag ito bilang pagluklok sa hari, muling pagkabuhay, pagkakatawang-tao, o walang-hanggang pagkakaugnay ng Anak sa Ama.
  rationale: Hindi tahasang nilulutas ng talata ang lahat ng posibleng saklaw ng sipi. Ang tuwirang salin ay nagpapanatili sa tunay na teolohikal na tensiyon at sa gamit nito sa pangangatwiran ng Hebreo.
- issue: Pagkakaiba ng “Anak” at “anak” sa dalawang sipi
  choice: Gamitin ang “Anak” sa unang tuwirang titulo at “anak” sa ikalawang pormulang tipan.
  alternative: Gawing malaking titik ang dalawa upang gawing tahasan ang kristolohikal na aplikasyon, o maliit na titik ang dalawa upang iwasan ang interpretatibong kapitalisasyon.
  rationale: Iniuukol ng Hebreo ang dalawang sipi sa Anak, ngunit tuwirang titulo ang una samantalang mula sa pormulang tipan ng 2 Samuel 7:14 ang ikalawa. Pinananatili nito ang pampanitikang pagkakaiba nang hindi ikinakaila ang kristolohikal na konteksto.
- issue: Paksa ng pandiwang “sinabi”
  choice: Tukuyin bilang “Diyos” sa salin.
  alternative: Panatilihin ang implicit na “siya,” gaya ng anyong Griyego.
  rationale: Maliwanag sa konteksto na Diyos ang nagsasalita sa Kasulatan. Ang tahasang pangngalan ay kailangan para sa malinaw at likas na Filipino at hindi nagdaragdag ng bagong interpretasyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “Sapagkat” upang mapanatili ang paliwanag na ugnayan sa naunang talata. Inayos bilang patula ang mga sipi para luminaw ang paralelismo. Iniwasan ang sobrang literal ngunit di-likas na hulma sa ikalawang sipi, habang inilagay ang pormal na alternatibo sa talababa.
