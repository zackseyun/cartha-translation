  to: 'Sapagkat kanino sa mga anghel sinabi ng Diyos kailanman,[a]


    “Ikaw ang aking Anak;

    ngayon ay ako ang naging ama mo”?[b]


    At muli,


    “Ako ay magiging Ama niya,

    at siya ay magiging anak ko”?[c]'
  rationale: Inayos ang unang tanong para sa mas likas na ayos ng salita. Pinalitan ang “ipinanganak kita” upang malinaw na ang nagsasalita ay ama at upang maiwasan ang karaniwang implikasyong pagsisilang ng ina sa Filipino. Pinanatili ang metaporang pagiging ama at ang hindi pagdedesisyon sa mga pinagtatalunang pagpapakahulugan. Ginawang “At muli” ang pangalawang panandang sipi at itinuwid ang paglalarawan ng alternatibo sa talababa c.
