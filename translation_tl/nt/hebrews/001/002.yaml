    rationale: 'Iisa ang anyo ng dalawang panghalip ngunit magkaiba ang tinutukoy: ang Anak sa una at ang Diyos sa ikalawa. Ang pagbanggit sa “Diyos” bilang paksa ng “ginawa” ay nag-aalis ng kalabuan nang hindi nagdaragdag ng kahulugan.'
