base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/002.yaml
  text: in these last days he has spoken to us in a Son[a], whom he appointed heir of all things[b], through whom he also made the ages.
translation:
  language: tl
  text: Sa mga huling araw na ito ay nagsalita siya sa atin sa pamamagitan ng isang Anak[a], na itinalaga niyang tagapagmana ng lahat ng bagay. Sa pamamagitan niya ay ginawa rin ng Diyos ang mga kapanahunan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa isang Anak.” Literal na “sa isang Anak” ang Griyego, at walang artikulo bago ang “Anak”; itinatampok nito ang paraan at sukdulang katangian ng pagsasalita ng Diyos.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ang sansinukob” o “ang mga daigdig.” Ang Griyegong “mga kapanahunan” ay maaaring tumukoy sa mismong mga panahon at, sa pagpapalawak, sa buong nilikhang kaayusan.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπ’ ἐσχάτου τῶν ἡμερῶν τούτων
  choice: sa mga huling araw na ito
  rationale: Natural na pariralang temporal sa Filipino na pinananatili ang eskatolohikal na diin ng Griyego.
- source_word: ἐλάλησεν
  choice: nagsalita
  rationale: Tuwirang ipinapahayag ang natapos na kilos ng aorist; malinaw at likas ito sa Filipino sa paghahambing sa naunang pagsasalita sa pamamagitan ng mga propeta.
- source_word: ἐν υἱῷ
  choice: sa isang Anak
  rationale: Pinananatili ng “sa” ang di-karaniwang gamit ng ἐν, at ipinakikita ng “isang Anak” na walang artikulo ang υἱῷ, nang hindi ito ginagawang “kanyang Anak” o basta ahensiyang “sa pamamagitan ng Anak.”
- source_word: ὃν ἔθηκεν
  choice: na itinalaga niya
  rationale: Sa kontekstong may tungkuling “tagapagmana,” ang τίθημι ay nangangahulugang magtalaga o maglagay sa isang katayuan.
- source_word: κληρονόμον πάντων
  choice: tagapagmana ng lahat ng bagay
  rationale: Malinaw at karaniwang katumbas na pinananatili ang malawak na saklaw ng πάντων.
- source_word: δι’ οὗ
  choice: sa pamamagitan niya
  rationale: Likas na Filipino para sa διά na may genitive, na nagpapahayag ng namamagitang ahensiya.
- source_word: ἐποίησεν
  choice: ginawa
  rationale: Hindi nito sinisikipan ang malawak na ποιέω tungo sa mas tiyak na “nilalang,” ngunit ang konteksto ay nananatiling kosmolohikal.
- source_word: τοὺς αἰῶνας
  choice: mga kapanahunan
  rationale: Pinananatili ang pangunahing temporal na anyo at ang posibleng temporal-kosmikong lawak ng αἰῶνες; inilalahad sa talababa ang mga katumbas na tumutukoy sa buong nilikhang kaayusan.
theological_decisions:
- issue: Kristolohikal na bigat ng ἐν υἱῷ
  choice: “sa isang Anak,” upang mapanatili ang walang-artikulong anyo at ang paraan o katangian ng sukdulang pagsasalita ng Diyos
  alternative: “sa pamamagitan ng isang Anak” o “sa Anak”
  rationale: Ang “sa pamamagitan” ay maaaring limitahan ang parirala sa ahensiya lamang, samantalang ang “sa Anak” ay nagdaragdag ng tiyak na artikulong wala sa Griyego. Ang napiling anyo ay sadyang pinananatili ang kakaibang diin ng orihinal.
- issue: Saklaw ng τοὺς αἰῶνας kaugnay ng papel ng Anak sa paglikha
  choice: “mga kapanahunan” sa pangunahing teksto, na may talababa para sa “sansinukob” o “mga daigdig”
  alternative: “sansinukob,” “mga daigdig,” o “daigdig”
  rationale: Maaaring tumukoy ang αἰῶνες sa mga panahon at, sa pagpapalawak, sa buong nilikhang kaayusan. Hindi nililimitahan ng salin ang sadyang malawak na temporal-kosmikong pahiwatig nito.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “tagapagmana,” “itinalaga,” at “mga kapanahunan” bilang madaling maunawaang mga salitang nagpapanatili sa pormal at teolohikal na bigat ng talata. Ang “sa isang Anak” ay sadyang bahagyang di-karaniwan upang hindi mawala ang tunay na gramatikal at retorikal na tensiyon ng Griyego.
