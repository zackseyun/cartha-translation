    issue: Ang “sa isang Anak” ay hindi idiomatiko at semantikong malabo sa Filipino.
    rationale: Bagaman sinusubukan nitong tularan ang ἐν υἱῷ, ang pariralang Filipino ay karaniwang maririnig bilang lokasyon o bilang pagtukoy sa isang di-tiyak na bata. Ang “sa pamamagitan ng isang Anak” ay malinaw na Filipino at isang leksikal na posibilidad na kinikilala rin ng audit trail.
  - severity: low
