  source_fidelity: 'Ang pangunahing diwa ay tapat sa Griyego: ang Diyos ay nagsalita sa huling mga araw, itinalaga ang Anak bilang tagapagmana ng lahat, at ginawa ang mga kapanahunan sa pamamagitan niya. Gayunman, ang “sa isang Anak” ay hindi likas sa modernong Filipino at madaling maunawaang lokatibo (“sa loob/sa isang anak”) sa halip na paraan o ahensiya ng pagsasalita. Ang “sa pamamagitan ng isang Anak” ay isang kinikilalang posibleng pagbasa at mas malinaw na naghahatid ng ugnayan sa Filipino. Inilipat din ang angkla ng talababa b upang tumukoy mismo sa “mga kapanahunan.”'
  naturalness: 'Ang binagong pangungusap ay mas natural at malinaw: iniiwasan nito ang magkakasunod at malabong “sa pamamagitan niya ay ginawa rin niya,” habang malinaw pa ring ang Diyos ang gumawa at ang Anak ang namamagitang ahensiya.'
  terminology: Ang “Anak,” “itinalaga,” “tagapagmana,” at “mga kapanahunan” ay angkop sa marangal ngunit makabagong rehistro. Pinananatili ng “mga kapanahunan” ang temporal-kosmikong lawak ng αἰῶνας; ipinapaliwanag ng talababa ang mga alternatibong kosmolohikal na salin.
  issues:
