  text: ἠγάπησας δικαιοσύνην καὶ ἐμίσησας ἀνομίαν· διὰ τοῦτο ἔχρισέν σε ὁ θεός, ὁ θεός σου, ἔλαιον ἀγαλλιάσεως παρὰ τοὺς μετόχους σου·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/009.yaml
  text: You have loved righteousness and hated lawlessness; therefore God[a], your God, has anointed you with the oil of gladness beyond your companions.
translation:
  language: tl
  text: Inibig mo ang katuwiran[a] at kinapootan mo ang paglabag sa kautusan; kaya pinahiran ka ng Diyos, ang Diyos mo, ng langis ng kagalakan nang higit sa iyong mga kasama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “katarungan.” Maaaring tumukoy ang salitang Griyego sa katuwiran o katarungan; “katuwiran” ang ginamit sa pangunahing teksto dahil nangingibabaw dito ang moral na katangian.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγάπησας
  choice: Inibig mo
  rationale: Ang payak na aspektong naganap ay angkop sa aorist at natural sa marangal na sipi; malinaw rin ang tuwirang pagtutol nito sa “kinapootan mo.”
- source_word: δικαιοσύνην
  choice: katuwiran
  rationale: Saklaw ng “katuwiran” ang moral na pagiging matuwid na nangingibabaw sa konteksto, habang inilalagay sa talababa ang lehitimong kahulugang “katarungan.”
- source_word: ἐμίσησας
  choice: kinapootan mo
  rationale: Pinananatili nito ang matinding moral na salungatan sa “inibig mo” at mas marangal ang himig kaysa sa karaniwang “kinamuhian.”
- source_word: ἀνομίαν
  choice: paglabag sa kautusan
  rationale: Likas at malinaw itong paraan sa modernong Tagalog upang ipahayag ang pagsuway o paglabag na tinutukoy ng ἀνομία, nang hindi gumagamit ng malabo o lipas na salita.
- source_word: διὰ τοῦτο
  choice: kaya
  rationale: Maikli at natural itong nag-uugnay sa naunang saloobin at sa sumunod na pagpapahid, habang pinananatili ang sanhi o hinuha.
- source_word: ἔχρισέν σε
  choice: pinahiran ka
  rationale: Pinananatili nito ang literal na larawan ng pagpapahid at ang maharlika o mesiyanikong pahiwatig ng χρίω.
- source_word: ὁ θεός, ὁ θεός σου
  choice: ng Diyos, ng Diyos mo
  rationale: Tuwirang pinananatili ang pag-uulit at ang relasyonal na pahayag ng Griyego nang walang idinagdag na paliwanag na teolohikal.
- source_word: ἔλαιον ἀγαλλιάσεως
  choice: langis ng kagalakan
  rationale: Pinananatili ang matalinghagang larawan ng langis at ang masidhing masayang diwa ng ἀγαλλίασις sa dignidad ng sipi.
- source_word: παρὰ τοὺς μετόχους σου
  choice: nang higit sa iyong mga kasama
  rationale: Ipinahahayag ng “nang higit sa” ang paghahambing ng παρά, at sapat na malawak ang “mga kasama” upang hindi paliitin ang maaaring ugnayang tinutukoy ng μέτοχοι.
theological_decisions:
- issue: Saklaw ng δικαιοσύνη sa siping maharlika at mesiyaniko
  choice: katuwiran
  alternative: katarungan
  rationale: Itinatampok ng “katuwiran” ang moral na katangiang kasalungat ng paglabag sa kautusan. Gayunman, tunay na saklaw rin ng salita ang “katarungan,” kaya pinanatili ito sa talababa sa halip na tahimik na alisin.
- issue: Kristolohikal na puwersa ng “Diyos, ng Diyos mo”
  choice: Panatilihin ang pag-uulit at relasyonal na pahayag nang walang pagpapalawak
  alternative: Magdagdag ng paliwanag tungkol sa ugnayan ng Diyos at ng Anak
  rationale: Ang teksto mismo ay kapuwa nagtataas sa Anak at nagsasabing “Diyos mo.” Pinananatili ng salin ang teolohikal na tensiyong ito at hindi nag-aangkat ng paliwanag mula sa isang partikular na sistemang doktrinal.
- issue: Kalikasan ng pagpapahid at paghahambing sa mga kasama
  choice: Literal na “pinahiran” at “nang higit sa iyong mga kasama”
  alternative: Ipaliwanag bilang paghirang sa hari o bilang higit na bahagi ng kagalakan
  rationale: Hindi tahasang nililinaw ng talata kung ang diin ay nasa dami o antas ng langis, kagalakan, o karangalan ng pagpapahid. Pinananatili ng salin ang masinsing larawan at paghahambing nang hindi ito nilulutas sa paraprasis.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang balanseng pares na “Inibig mo … kinapootan mo,” pinanatili ang biblikal na larawan ng pagpapahid ng langis, at iniwasan ang lipas o labis na teknikal na pananalita.
