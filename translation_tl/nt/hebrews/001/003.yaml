revisions:
- from: Siya ang ningning ng kaluwalhatian ng Diyos at ang eksaktong tatak ng Kanyang tunay na pagkatao.[a] Pinananatili niya ang lahat ng bagay sa pamamagitan ng kanyang makapangyarihang salita. Matapos niyang linisin ang mga kasalanan sa pamamagitan ng kanyang sarili,[b] umupo siya sa kanan ng Kataas-taasang Diyos sa kaitaasan.[c]
  to: Siya ang ningning ng kaluwalhatian ng Diyos at ang eksaktong tatak ng kaniyang pagkatao.[a] Pinananatili niya ang lahat ng bagay sa pamamagitan ng kaniyang makapangyarihang salita. Matapos niyang magsagawa ng paglilinis sa mga kasalanan sa pamamagitan ng kaniyang sarili,[b] umupo siya sa kanan ng Kadakilaan sa kaitaasan.[c]
