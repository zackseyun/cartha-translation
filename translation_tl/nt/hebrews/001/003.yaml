review_pass:
  verdict: revise
  source_fidelity: 'Ang pangunahing diwa ay tapat sa Griyego: ang Anak ay ningning ng kaluwalhatian ng Diyos, eksaktong tatak ng kanyang realidad, tagapagpanatili ng lahat, gumawa ng paglilinis kaugnay ng mga kasalanan, at umupo sa kanan ng Kadakilaan. Gayunman, ang “linisin ang mga kasalanan” ay maaaring mangahulugang ang mga kasalanan mismo ang nililinis, samantalang ang καθαρισμὸν τῶν ἁμαρτιῶν ay tumutukoy sa paglilinis na may kinalaman sa mga kasalanan. Ang “tunay na pagkatao” ay nagdaragdag din ng diin na wala sa ὑπόστασις.'
  naturalness: Marangal at madaling basahin ang Tagalog. Mas malinaw at mas natural ang pangngalang “paglilinis sa mga kasalanan” kaysa pandiwang “linisin ang mga kasalanan.” Ang “Kadakilaan” ay mas malapit na katumbas ng reverential title na μεγαλωσύνη kaysa “Kataas-taasang Diyos,” kahit malinaw namang tumutukoy ang titulo sa Diyos.
  terminology: Ang “ningning,” “kaluwalhatian,” “eksaktong tatak,” at “makapangyarihang salita” ay angkop. Pinanatili ang “sa pamamagitan ng kaniyang sarili” upang katawanin ang SBLGNT na δι’ αὑτοῦ at ang talababa para sa baryante. Ginamit ang “Kadakilaan” upang hindi palitan ng mas malayang katawagan ang pamagat na μεγαλωσύνη.
  issues:
  - severity: medium
    issue: “linisin ang mga kasalanan”
    rationale: Hindi ito ang pinakanatural o pinakatumpak na paraan upang ipahayag ang “making purification for sins”; maaari nitong ipahiwatig na ang kasalanan ang bagay na nililinis. Ang “magsagawa ng paglilinis sa mga kasalanan” ay mas malapit sa pangngalang καθαρισμός at pinananatili ang saklaw ng genitive.
  - severity: low
    issue: “tunay na pagkatao” para sa ὑπόστασις
    rationale: Ang “tunay” ay dagdag na pagpapatingkad na wala sa pinagmulan. Ang “pagkatao” ay nananatiling madaling maunawaan ngunit hindi idinaragdag ang naturang diin.
  - severity: low
    issue: “Kataas-taasang Diyos” para sa μεγαλωσύνη
    rationale: Tamang-tama ang reperente, ngunit ang Griyego ay gumagamit ng reverential abstract title na “Majesty.” Ang “Kadakilaan” ay mas malapit at natural pa rin sa marangal na rehistro.
