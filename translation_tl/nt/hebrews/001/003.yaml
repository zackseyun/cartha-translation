id: HEB.1.3
reference: Hebrews 1:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὃς ὢν ἀπαύγασμα τῆς δόξης καὶ χαρακτὴρ τῆς ὑποστάσεως αὐτοῦ, φέρων τε τὰ πάντα τῷ ῥήματι τῆς δυνάμεως, ⸂δι’ αὑτοῦ⸃ καθαρισμὸν ⸂τῶν ἁμαρτιῶν ποιησάμενος⸃ ἐκάθισεν ἐν δεξιᾷ τῆς μεγαλωσύνης ἐν ὑψηλοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/003.yaml
  text: He[a], being the radiance of his glory and the exact imprint of his being, and sustaining all things by the word of his power, after making purification for sins through himself[b], sat down at the right hand of the Majesty on high[c],
translation:
  language: tl
  text: Siya ang ningning ng kaluwalhatian ng Diyos at ang eksaktong tatak ng kaniyang pagkatao.[a] Pinananatili niya ang lahat ng bagay sa pamamagitan ng kaniyang makapangyarihang salita. Matapos niyang magsagawa ng paglilinis sa mga kasalanan sa pamamagitan ng kaniyang sarili,[b] umupo siya sa kanan ng Kadakilaan sa kaitaasan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang eksaktong larawan ng Kaniyang kalikasan,” “substansiya,” o “mismong pag-iral.”
    reason: lexical_alternative
  - marker: b
    text: Hindi kasama sa ilang manuskrito ang “sa pamamagitan ng kaniyang sarili”; kasama ang parirala ayon sa tekstong SBLGNT.
    reason: textual_variant
  - marker: c
    text: O “sa matataas na dako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαύγασμα
  choice: ningning
  rationale: Natural at marangal sa modernong Tagalog; ipinahahayag nito ang maningning na kaluwalhatian nang hindi ipinahihiwatig na isa lamang siyang repleksiyon.
- source_word: δόξα
  choice: kaluwalhatian
  rationale: Karaniwang salitang biblikal na nagpapanatili sa bigat ng banal na karangalan at kaningningan.
- source_word: χαρακτήρ
  choice: eksaktong tatak
  rationale: Pinananatili ang kongkretong larawan ng tatak o impresyong ganap na tumutugma sa pinagmulan.
- source_word: ὑπόστασις
  choice: tunay na pagkatao
  rationale: Ipinahahayag ang saligang realidad o mismong pagiging umiiral ng Diyos nang hindi tuwirang ipinapasok ang teknikal na bokabularyo ng mga kredo; nililinaw sa talababa ang mga alternatibo.
- source_word: φέρων
  choice: pinananatili
  rationale: Ipinahahayag ang patuloy at aktibong pag-alalay at pagpapanatili sa lahat ng bagay.
- source_word: τὰ πάντα
  choice: lahat ng bagay
  rationale: Pinananatili ang malawak at walang itinakdang saklaw ng Griyego.
- source_word: τῷ ῥήματι τῆς δυνάμεως
  choice: sa pamamagitan ng kanyang makapangyarihang salita
  rationale: Natural na Tagalog para sa literal na 'salita ng kanyang kapangyarihan,' habang pinananatiling instrumento ang kanyang salita at malinaw na sa kanya ang kapangyarihan.
- source_word: δι’ αὑτοῦ
  choice: sa pamamagitan ng kanyang sarili
  rationale: Tuwirang isinasalin ang tekstong nasa SBLGNT at pinananatili ang karaniwang puwersa ng διά.
- source_word: καθαρισμὸν τῶν ἁμαρτιῶν
  choice: linisin ang mga kasalanan
  rationale: Natural na Tagalog na nagpapanatili sa paglilinis bilang tugon sa mga kasalanan; ang kultiko at sakripisyal na pahiwatig ay hindi dinaragdagan o inaalis.
- source_word: ἐν δεξιᾷ
  choice: sa kanan
  rationale: Karaniwang idyomang biblikal para sa marangal at makapangyarihang posisyon.
- source_word: τῆς μεγαλωσύνης
  choice: ng Kataas-taasang Diyos
  rationale: Ginagawang malinaw sa Tagalog na ang abstraktong titulong 'Kadakilaan' ay tumutukoy sa Diyos, nang hindi gumagamit ng hindi likas na parirala.
- source_word: ἐν ὑψηλοῖς
  choice: sa kaitaasan
  rationale: Pinananatili ang lokatibong larawan at ang posibleng diwa ng makalangit na kaitaasan.
theological_decisions:
- issue: Ontolohikal na diwa ng ὑπόστασις
  choice: tunay na pagkatao
  alternative: kalikasan; substansiya; mismong pag-iral
  rationale: Pinananatili ang malakas na pahayag tungkol sa tunay na realidad ng Diyos ngunit iniiwasang gawing tuwirang teknikal na pormula ng mga sumunod na kredo ang talata.
- issue: Kristolohikal na puwersa ng ἀπαύγασμα at χαρακτήρ
  choice: ningning ... eksaktong tatak
  alternative: repleksiyon ... larawan
  rationale: Hindi pinahihina ang ganap na pakikibahagi ng Anak sa kaluwalhatian ng Diyos at ang eksaktong pagtutugma niya sa realidad ng Diyos.
- issue: Tekstuwal na baryante sa δι’ αὑτοῦ
  choice: isinama ang 'sa pamamagitan ng kanyang sarili'
  alternative: alisin ang parirala; 'sa pamamagitan niya mismo'
  rationale: Kasama ang parirala sa ibinigay na SBLGNT; inilalahad sa talababa ang pagkakaiba ng ilang manuskrito.
- issue: Pagtukoy ng panghalip na αὐτοῦ
  choice: nilinaw bilang 'ng Diyos' sa unang sugnay
  alternative: panatilihin lamang bilang 'kanyang'
  rationale: Kinakailangan sa natural na Tagalog ang malinaw na reperente; tumutukoy ito sa Diyos na binanggit sa naunang konteksto, hindi sa Anak mismo.
- issue: Pamagat na τῆς μεγαλωσύνης
  choice: Kataas-taasang Diyos
  alternative: Kadakilaan; Dakilang Diyos
  rationale: Ipinapakita ang reverential circumlocution na tumutukoy sa Diyos at iniiwasan ang malabo at hindi natural na abstraktong titulo sa Tagalog.
translation_notes:
  register: 'Modernong Filipino Tagalog na marangal at madaling maunawaan. Hinati sa tatlong pangungusap ang mahabang Griyegong pangungusap para sa likas na daloy, ngunit pinanatili ang lohikal na pagkakasunod: kung sino ang Anak, ang patuloy niyang gawa, ang paglilinis niya sa mga kasalanan, at ang pag-upo niya sa kanan ng Diyos. Ginamit ang magalang na malaking titik sa panghalip na tumutukoy sa Diyos Ama, ngunit maliit na titik para sa Anak alinsunod sa modernong editoryal na estilo.'
