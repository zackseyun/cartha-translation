base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/008.yaml
  text: But of the Son he says[a], “Your throne, O God, is forever and ever[b], and the scepter of uprightness is the scepter of your kingdom.”
translation:
  language: tl
  text: Ngunit tungkol sa Anak ay sinasabi niya:[a] “Ang trono mo, O Diyos, ay magpakailanman,[b] at ang setro ng katuwiran ang setro ng iyong kaharian.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, bagaman di-gaanong malamang: “Ang Diyos ang iyong trono magpakailanman.” Pinagtatalunan ang sintaks ng Griyego, ngunit higit na angkop sa konteksto at sa bisa ng sipi ang tuwirang pagtawag na “Ang trono mo, O Diyos.”'
    reason: alternative_reading
  - marker: b
    text: Maaaring isalin ang “katuwiran” bilang “pagkamatuwid.” Ang salitang Griyego ay tumutukoy sa pagiging matuwid, wasto, o makatarungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς δὲ τὸν υἱόν
  choice: Ngunit tungkol sa Anak ay sinabi niya
  rationale: Ipinahahayag ang ipinahihiwatig na pandiwa ng pagsasalita at pinananatili ang paghahambing sa naunang sinabi tungkol sa mga anghel. Natural sa Filipino ang “tungkol sa Anak” para sa referensiyal na gamit ng πρός dito.
- source_word: υἱόν
  choice: ang Anak
  rationale: Pinananatili ang tiyak at titulong gamit ng salita at ang kaibahan ng Anak sa mga anghel.
- source_word: Ὁ θρόνος σου ὁ θεὸς
  choice: Ang trono mo, O Diyos
  rationale: Binabasa ang ὁ θεός bilang tuwirang pagtawag, na siyang pinakamalamang ayon sa konteksto at lakas ng sipi. Inilalagay sa talababa ang posible ngunit di-gaanong malamang na predikatibong pagbasa.
- source_word: εἰς τὸν αἰῶνα τοῦ αἰῶνος
  choice: magpakailanman
  rationale: Karaniwan at marangal na katumbas sa Filipino ng idyomang nagsasaad ng walang-hanggang tagal.
- source_word: ῥάβδος
  choice: setro
  rationale: Sa konteksto ng paghahari, tumutukoy ito sa sagisag ng kapangyarihan ng hari, hindi lamang sa isang pamalo o tungkod.
- source_word: τῆς εὐθύτητος
  choice: ng katuwiran
  rationale: Ang εὐθύτης ay tumutukoy sa pagiging matuwid o wasto. Ang “katuwiran” ay natural at dignified sa Filipino sa paglalarawan ng makatarungang paghahari; ang “pagkamatuwid” ay inilalagay bilang leksikal na alternatibo sa talababa.
- source_word: ῥάβδος τῆς βασιλείας σου
  choice: ang setro ng iyong kaharian
  rationale: Pinananatili ang malinaw na larawang maharlika at ang tuwirang kahulugan ng βασιλεία bilang kaharian o sakop ng paghahari.
theological_decisions:
- issue: Kung ang ὁ θεός ay tuwirang pagtawag sa Anak bilang Diyos o panaguri sa pahayag na “Ang Diyos ang iyong trono.”
  choice: 'Tuwirang pagtawag: “Ang trono mo, O Diyos.”'
  alternative: “Ang Diyos ang iyong trono magpakailanman.”
  rationale: Mas angkop ang bokatibong pagbasa sa daloy ng Hebreo 1 at sa bisa ng sipi na nagtatanghal sa natatanging kalagayan ng Anak. Gayunman, dahil pinagtatalunan ang sintaks at posible ang alternatibo, hindi ito ikinukubli kundi itinatala sa talababa.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang “setro” para sa larawang maharlika at “O Diyos” upang malinaw na maipakita ang tuwirang pagtawag. Ang mga marker na [a] at [b] ay kapuwa nasa pangunahing teksto.
