base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/006.yaml
  text: And when he again brings the Firstborn into the world[a], he says[b], “And let all God’s angels worship him.”
translation:
  language: tl
  text: At kapag muli niyang dinala ang Panganay sa sanlibutan[a], sinasabi niya, “At sambahin siya ng lahat ng anghel ng Diyos.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “At muli, kapag dinala niya ang Panganay sa sanlibutan, sinasabi niya: ‘Sambahin siya ng lahat ng anghel ng Diyos.’” Maaaring iugnay ang salitang Griyego para sa “muli” sa “dinala” o sa “sinasabi niya.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν
  choice: kapag
  rationale: Nagsisimula ito ng sugnay na temporal. Ang “kapag” ay natural sa makabagong Tagalog at maaaring tumukoy sa tiyak na pangyayaring nasa pananaw ng talata.
- source_word: δὲ
  choice: At
  rationale: Banayad na pang-ugnay ito na nagpapatuloy sa argumento nang hindi nagpapahiwatig ng matinding pagsalungat.
- source_word: πάλιν
  choice: muli
  rationale: Sa pangunahing teksto, inuugnay ito sa “dalhin.” Gayunman, maaari rin itong iugnay sa “sinasabi niya”; pinananatili sa talababa ang tunay na kalabuan.
- source_word: εἰσαγάγῃ
  choice: dalhin
  rationale: Natural at malinaw na salin ng pagkilos na pagdadala sa loob o pagpasok; ang anyong “kapag ... dalhin” ay angkop sa sugnay na hindi pa tiyak ang panahon sa Tagalog.
- source_word: τὸν πρωτότοκον
  choice: ang Panganay
  rationale: Pinananatili ang kristolohikal na titulong “Panganay,” kabilang ang mga pahiwatig nito tungkol sa pagiging anak at kataasan, nang hindi ito ipinapaliwanag nang higit sa teksto.
- source_word: εἰς τὴν οἰκουμένην
  choice: sa sanlibutan
  rationale: Ang οἰκουμένη ay maaaring tumukoy sa tinatahanang daigdig o sa mundo. Ang “sanlibutan” ay natural, marangal, at sapat ang lawak sa konteksto.
- source_word: λέγει
  choice: sinasabi niya
  rationale: Pinananatili ang kasalukuyang aspekto ng Griyego at hindi idinaragdag ang “sa Kasulatan,” bagaman malinaw iyon sa konteksto.
- source_word: προσκυνησάτωσαν
  choice: sambahin
  rationale: Sa konteksto ng Hebreo 1, kung saan ang lahat ng anghel ay inuutusang magbigay-galang sa Anak, ang “sambahin” ang pinakamahusay na katumbas ng puwersa ng pandiwa.
- source_word: αὐτῷ
  choice: siya
  rationale: Natural na layon ng pandiwang “sambahin” sa Tagalog.
- source_word: πάντες ἄγγελοι θεοῦ
  choice: lahat ng mga anghel ng Diyos
  rationale: Malinaw at malapit sa anyong henitibo ng Griyego; iniiwasan nitong ipakahulugan nang higit sa kinakailangan kung pag-aari, kaugnayan, o pinagmulan ang diin.
theological_decisions:
- issue: Saklaw ng πάλιν
  choice: 'Iniuugnay ang “muli” sa “dalhin”: “kapag muli niyang dalhin ang Panganay.”'
  alternative: 'Iugnay ang “muli” sa “sinasabi niya”: “At muli, kapag dalhin niya ang Panganay sa sanlibutan, sinasabi niya...”'
  rationale: Parehong pinahihintulutan ng Griyego ang dalawang pagbasa. Pinili sa pangunahing teksto ang pagbasa na umaayon sa pagkakalagay ng πάλιν bago ang εἰσαγάγῃ, ngunit inilalahad sa talababa ang alternatibo upang hindi mawala ang tunay na sintaktikong kalabuan.
- issue: Puwersa ng προσκυνέω patungkol sa Anak
  choice: sambahin
  alternative: yumukod sa harap niya / magbigay-pugay sa kanya
  rationale: Dahil sa argumento ng Hebreo 1 tungkol sa kataasan ng Anak sa mga anghel at sa utos sa lahat ng anghel ng Diyos, ang “sambahin” ang pinakamalinaw na kumakatawan sa puwersa ng pandiwa rito, nang hindi nagdaragdag ng paliwanag na wala sa teksto.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang “Panganay” bilang titulo at “sanlibutan” bilang malawak at pamilyar na katumbas ng οἰκουμένη. Pinanatili ang bahagyang pormal na himig ng sipi nang hindi gumagamit ng lipas na pananalita.
