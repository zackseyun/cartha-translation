id: HEB.1.7
reference: Hebrews 1:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ πρὸς μὲν τοὺς ἀγγέλους λέγει· Ὁ ποιῶν τοὺς ἀγγέλους αὐτοῦ πνεύματα, καὶ τοὺς λειτουργοὺς αὐτοῦ πυρὸς φλόγα·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/007.yaml
  text: And about the angels he says[a], “He makes his angels winds, and his ministers a flame of fire.”
translation:
  language: tl
  text: 'At tungkol naman sa mga anghel ay sinasabi niya: “Ginagawa niyang mga hangin[a] ang kanyang mga anghel, at ningas ng apoy ang kanyang mga lingkod.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “mga espiritu”: maaaring mangahulugan ang salitang Griyego ng “mga hangin” o “mga espiritu.”'
    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς μὲν τοὺς ἀγγέλους
  choice: tungkol naman sa mga anghel
  rationale: Ipinahahayag ng πρός ang paksa o tinutukoy ng sinasabi ng Diyos, hindi ang tuwirang kinakausap; ipinananatili rin ng “naman” ang paghahambing na ipinahihiwatig ng μέν.
- source_word: λέγει
  choice: sinasabi niya
  rationale: Pinananatili ang pangkasalukuyang anyo ng pormula ng pagsipi at malinaw na ang Diyos ang nagsasalita sa konteksto.
- source_word: Ὁ ποιῶν
  choice: Ginagawa niya
  rationale: Natural na pandiwang Filipino ito para sa aktibong articular participle at hindi nito dinaragdagan ang kahulugan ng paghirang o pagtatalaga.
- source_word: ἀγγέλους
  choice: mga anghel
  rationale: Ang konteksto ng Hebreo 1 ay tungkol sa mga makalangit na anghel, kaya mas tiyak ito kaysa “mga mensahero.”
- source_word: πνεύματα
  choice: mga hangin
  rationale: Maaaring mangahulugan ang salita ng “mga hangin” o “mga espiritu.” Mas angkop sa makatang paralelismo sa ningas ng apoy at sa saligang Hebreo ng Awit 104:4 ang “mga hangin”; pinananatili sa talababa ang tunay na kalabuan.
- source_word: λειτουργοὺς
  choice: mga lingkod
  rationale: Ipinahahayag nito ang mga gumaganap ng paglilingkod nang hindi nag-aangkat ng makabagong titulong pansimbahan na maaaring ipahiwatig ng “mga ministro.”
- source_word: πυρὸς φλόγα
  choice: ningas ng apoy
  rationale: Pinananatili ang isahang makatang larawan ng parirala at natural ito sa kasalukuyang Filipino.
- source_word: αὐτοῦ
  choice: kanyang
  rationale: Natural na anyong paari sa Filipino, na tumutukoy sa Diyos sa konteksto ng sipi.
theological_decisions:
- issue: Kahulugan ng πνεύματα sa sipi mula sa Awit 104:4
  choice: mga hangin
  alternative: mga espiritu
  rationale: Ang “mga hangin” ang higit na umaayon sa saligang Hebreo at sa paralelismong makata sa “ningas ng apoy,” ngunit tunay na pinahihintulutan ng Griyego ang “mga espiritu,” kaya hindi ito ikinukubli at inilalagay sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga lingkod” sa halip na “mga ministro” upang maiwasan ang makabagong denominasyonal o pansimbahang kahulugan, habang nananatili ang diwa ng paglilingkod. Ang panandang [a] ay nakalagay kaagad pagkatapos ng salitang may leksikal na kalabuan.
