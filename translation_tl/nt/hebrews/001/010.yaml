id: HEB.1.10
reference: Hebrews 1:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καί· Σὺ κατ’ ἀρχάς, κύριε, τὴν γῆν ἐθεμελίωσας, καὶ ἔργα τῶν χειρῶν σού εἰσιν οἱ οὐρανοί·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/010.yaml
  text: And[a], “You, Lord, in the beginning laid the foundation of the earth, and the heavens are the works of your hands.”
translation:
  language: tl
  text: At[a], “Ikaw, Panginoon, sa pasimula ay naglagay ng pundasyon ng lupa, at ang kalangitan ay mga gawa ng iyong mga kamay.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa simula.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καί
  choice: At
  rationale: Nagpapakilala ito ng karagdagang sipi sa magkakasunod na mga sipi; pinananatili ng payak na “At” ang ugnayan nang hindi dinaragdagan ang kahulugan.
- source_word: Σὺ
  choice: Ikaw
  rationale: Tahasan at may diin ang panghalip sa Griyego; pinananatili ito sa tuwirang pagtawag.
- source_word: κατ’ ἀρχάς
  choice: sa pasimula
  rationale: Likas at marangal na pariralang tumutukoy sa unang yugto o pinagmulan, na angkop sa konteksto ng paglikha.
- source_word: κύριε
  choice: Panginoon
  rationale: Bokatibo ng κύριος; pinananatili ang tuwirang pagtawag at ang bigat nito sa siping inilalapat sa Anak.
- source_word: τὴν γῆν
  choice: ang lupa
  rationale: Sa konteksto ng paglikha at bilang katambal ng kalangitan, tumutukoy ito sa daigdig, hindi sa isang partikular na lupain; “lupa” ang natural na katawagan sa pariralang ito.
- source_word: ἐθεμελίωσας
  choice: naglagay ng pundasyon ng
  rationale: Pinananatili nito ang malinaw na larawang pang-arkitektura ng pandiwang θεμελιόω.
- source_word: ἔργα
  choice: mga gawa
  rationale: Tuwiran at natural itong tumutukoy sa mga bagay na ginawa, lalo na kasama ng “iyong mga kamay.”
- source_word: τῶν χειρῶν σού
  choice: ng iyong mga kamay
  rationale: Pinananatili ang konkretong larawang antropomorpiko ng pinagmulang sipi.
- source_word: οἱ οὐρανοί
  choice: ang kalangitan
  rationale: Natural na kolektibong salin sa modernong Tagalog para sa maramihang οὐρανοί sa konteksto ng paglikha.
theological_decisions:
- issue: Paglalapat sa Anak ng pananalita sa Awit 102 na nakaukol sa Panginoon
  choice: Pinanatili ang tuwirang tawag na “Ikaw, Panginoon” nang hindi pinahihina.
  alternative: Gawing mas malabo o neutral ang pagtawag upang bawasan ang kristolohikal na bigat ng sipi.
  rationale: Tahasan sa Griyego ang κύριε sa loob ng tuwirang pagtawag. Dapat panatilihin ng salin ang paglalapat ng may-akda ng Hebreo sa Anak nang walang idinaragdag na paliwanag na wala sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Pinanatili ang anyo ng sipi, ang metaporang pundasyon, at ang tuwirang pagtawag sa Panginoon; iniwasan ang sobrang arkaiko o denominasyonal na pananalita.
