  text: Πολυμερῶς καὶ πολυτρόπως πάλαι ὁ θεὸς λαλήσας τοῖς πατράσιν ἐν τοῖς προφήταις
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/001.yaml
  text: Long ago[c][b][a], God spoke to the fathers in many parts and in many ways by the prophets.
translation:
  language: tl
  text: Noong unang panahon, nagsalita ang Diyos sa mga ninuno[a] sa maraming bahagi at sa iba't ibang paraan sa pamamagitan ng mga propeta[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa mga ama.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa mga propeta”; sa literal, “sa mga propeta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολυμερῶς
  choice: sa maraming bahagi
  rationale: Pinananatili nito ang diwa ng paghahayag na ibinigay sa maraming bahagi o bahagi-bahagi, at malinaw itong naihihiwalay sa kasunod na πολυτρόπως, na tumutukoy naman sa sari-saring paraan.
- source_word: πολυτρόπως
  choice: sa iba't ibang paraan
  rationale: Natural ito sa modernong Tagalog at malinaw na nagpapahayag ng pagkakaiba-iba ng paraan o anyo ng pagsasalita ng Diyos.
- source_word: πάλαι
  choice: Noong unang panahon
  rationale: Dignified at madaling maunawaang pahayag ito para sa isang panahong matagal nang lumipas, nang hindi gumagamit ng lipas na pananalita.
- source_word: ὁ θεὸς
  choice: ang Diyos
  rationale: Tuwirang katumbas ng tahasang simuno sa Griyego.
- source_word: λαλήσας
  choice: nagsalita
  rationale: Bagaman participle sa Griyego at kaugnay ng pangunahing pandiwa sa talata 2, ang pandiwang may panahunan ay mas natural sa isang nakahiwalay na salin ng talata 1 at pinananatili ang temporal na paghahambing.
- source_word: τοῖς πατράσιν
  choice: sa mga ninuno
  rationale: Sa kontekstong pangkasaysayan ng tipan, tumutukoy ito sa mga naunang salinlahing pinagsalitaan ng Diyos. Mas natural at mas saklaw sa kasalukuyang Tagalog ang “mga ninuno”; itinatala sa talababa ang literal na “mga ama.”
- source_word: ἐν τοῖς προφήταις
  choice: sa pamamagitan ng mga propeta
  rationale: 'Ipinahahayag nito ang instrumental na gamit ng ἐν: ang Diyos ang nagsasalita at ang mga propeta ang kaniyang mga tagapamagitan, habang itinatala ang literal na anyo sa talababa.'
theological_decisions:
- issue: Ugnayan ng participial na λαλήσας sa pangunahing pandiwa ng Hebreo 1:2
  choice: 'Gumamit ng pandiwang may panahunan sa talata 1: “nagsalita ang Diyos.”'
  alternative: 'Mas pormal na panatilihin ang participle: “Ang Diyos, na nagsalita...”'
  rationale: Hindi natural at sintaktikong bitin sa Tagalog ang mahigpit na participial na anyo kapag hiwalay ang talata. Pinananatili ng napiling anyo ang dating pagsasalita ng Diyos at hindi inuunahan o nilulutas ang paghahambing na makukumpleto sa talata 2.
- issue: Pagpapakahulugan sa τοῖς πατράσιν
  choice: “sa mga ninuno,” na may literal na alternatibong “sa mga ama” sa talababa
  alternative: “sa mga ama” sa pangunahing teksto
  rationale: Ang “mga ninuno” ay natural na tumutukoy sa mga naunang salinlahi sa konteksto, samantalang pinananatili ng talababa ang kasariang taglay ng literal na salitang Griyego nang hindi nagdaragdag ng “ating,” na wala sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling basahin. Pinanatili ang pagkakaiba ng “sa maraming bahagi” at “sa iba't ibang paraan,” at iniwasan ang sobrang literal na ayos na magiging bitin bilang isang hiwalay na talata.
