language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πρὸς τίνα δὲ τῶν ἀγγέλων εἴρηκέν ποτε· Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ὑποπόδιον τῶν ποδῶν σου;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/013.yaml
  text: But to which of the angels has he ever said[a], ‘Sit at my right hand until I make your enemies a footstool for your feet’?”
translation:
  language: tl
  text: Ngunit kanino sa mga anghel niya kailanman sinabi, “Maupo ka sa kanan ko hanggang sa gawin kong tuntungan ng iyong mga paa ang iyong mga kaaway”?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρὸς τίνα δὲ τῶν ἀγγέλων
  choice: Ngunit kanino sa mga anghel
  rationale: Ang πρός kasunod ng τίνα sa pandiwa ng pagsasalita ay likas na nangangahulugang “kanino.” Isinalin ang δέ bilang “Ngunit” upang mapanatili ang paghahambing at pagsalungat sa naunang argumento.
- source_word: εἴρηκέν ποτε
  choice: niya kailanman sinabi
  rationale: Ipinahahayag ng “kailanman” ang ποτέ, samantalang ang ayos na “niya ... sinabi” ay natural sa retorikal na tanong sa Filipino at pinananatiling di-tiyak sa mismong sugnay ang tinutukoy na tagapagsalita ayon sa konteksto.
- source_word: Κάθου
  choice: Maupo ka
  rationale: Ang “Maupo ka” ay natural, magalang, at dignidad na pautos sa modernong Filipino; mas angkop ito kaysa sa mas matigas na “Umupo ka” para sa pormulang maharlikang pagluklok.
- source_word: ἐκ δεξιῶν μου
  choice: sa kanan ko
  rationale: Ito ang natural na idyomang Filipino para sa lokasyon sa dakong kanan, na sa sipi ay nagpapahiwatig ng natatanging karangalan at awtoridad nang hindi ito ipinapaliwanag sa mismong salin.
- source_word: ἕως ἂν θῶ
  choice: hanggang sa gawin kong
  rationale: Ang ἕως ἂν kasama ng aorist subjunctive ay tumutukoy sa inaasahang pangyayari sa hinaharap. Ang “gawin kong” ay akma sa panaguring μεταφορά na “tuntungan.”
- source_word: τοὺς ἐχθρούς σου
  choice: ang iyong mga kaaway
  rationale: Tuwirang pinananatili ang maramihang tahasang layon at ang ikalawang panauhang panghalip.
- source_word: ὑποπόδιον τῶν ποδῶν σου
  choice: tuntungan ng iyong mga paa
  rationale: Pinananatili ng “tuntungan ng iyong mga paa” ang konkretong larawan ng lubusang pagpapasakop at ang genitibong ugnayan ng parirala, sa natural at dignidad na Filipino.
theological_decisions:
- issue: Pagpapanatili sa kristolohikal na lakas ng sipi mula sa Awit 110:1 nang hindi ito labis na ipinapaliwanag
  choice: 'Pinanatili ang tuwirang pahayag ng pagluklok: “Maupo ka sa kanan ko hanggang sa gawin kong tuntungan ng iyong mga paa ang iyong mga kaaway.”'
  alternative: Ipaliwanag ang larawan bilang “hanggang sa lubusan kong talunin ang iyong mga kaaway.”
  rationale: Nakasalalay ang argumento ng Hebreo sa mismong larawan at pananalita ng Kasulatan na hindi sinabi sa alinmang anghel. Kaya pinanatili ang maharlikang pagluklok at larawan ng pagpapasakop sa halip na palitan ito ng paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignidad, at angkop sa pampublikong pagbasa. Ginamit ang “Maupo ka” bilang natural ngunit marangal na pautos, at “tuntungan ng iyong mga paa” upang mapanatili ang biblikal na larawan nang hindi nagiging lipas o labis na teknikal.
