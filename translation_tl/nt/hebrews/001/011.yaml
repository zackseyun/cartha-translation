lexical_decisions:
- source_word: αὐτοὶ
  choice: sila
  rationale: Tumutukoy sa langit at lupa sa naunang talata. Likas sa Tagalog ang “sila”; ang diin ay naihahatid ng malinaw na pagsalungat sa “ikaw.”
- source_word: ἀπολοῦνται
  choice: mawawala
  rationale: Ipinahahayag dito ang pagdating sa wakas o paglaho. Iniiwasan ng “mawawala” ang posibleng pahiwatig ng kapahamakang espirituwal ng “mapapahamak” at ang tahasang panlabas na tagagawa na maaaring ipahiwatig ng “wawasakin.”
- source_word: σὺ δὲ
  choice: ngunit ikaw
  rationale: Pinananatili ang matinding pagsalungat sa lumilipas na nilikha at sa nananatiling kinakausap.
- source_word: διαμένεις
  choice: nananatili
  rationale: Tumpak na naghahayag ng patuloy na pag-iral at natural na kabaligtaran ng pagkawala ng nilikha.
- source_word: πάντες
  choice: silang lahat
  rationale: Malinaw na sama-samang tumutukoy sa mga nilikhang bagay na nabanggit at pinananatili ang saklaw ng πάντες.
- source_word: ὡς ἱμάτιον
  choice: gaya ng isang kasuotan
  rationale: Malawak at dignified ang “kasuotan,” at hindi nito nililimitahan ang larawan sa isang tiyak na uri ng damit.
- source_word: παλαιωθήσονται
  choice: maluluma
  rationale: Inihahatid ang pagiging luma o pudpod sa paglipas ng panahon at ang talinghaga ng kasuotan nang maikli at natural.
theological_decisions:
- issue: Ang kinakausap at ang kristolohikal na bisa
  choice: Pinanatili ang tuwirang pagtukoy sa ikalawang panauhan sa “ikaw ay nananatili.”
  alternative: Idagdag sa teksto na ang kinakausap ay ang Anak.
  rationale: Sa konteksto, iniuukol ng Hebreo 1 sa Anak ang siping ito mula sa Awit 102. Pinananatili ng salin ang tuwirang pananalita at mataas na kristolohiya ng konteksto nang hindi nagdaragdag ng paliwanag na wala sa mismong talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mawawala” sa halip na “mapapahamak” upang maiwasan ang di-sinasadyang espirituwal na pakahulugan, at “maluluma” upang natural na mapanatili ang larawan ng kasuotang kumukupas sa paglipas ng panahon.
