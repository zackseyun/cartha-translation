base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/012.yaml
  text: and like a cloak you will roll them up[a]; like a garment they will be changed. But you are the same[b], and your years will not fail.
translation:
  language: tl
  text: At gaya ng balabal, gugulungin mo sila[a]; gaya ng kasuotan, mababago sila. Ngunit ikaw ay gayon pa rin, at ang iyong mga taon ay hindi magwawakas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “gaya ng damit, mababago sila.”'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring: “ang iyong mga taon ay hindi kailanman matatapos.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσεὶ περιβόλαιον
  choice: gaya ng balabal
  rationale: Pinananatili ang paghahambing at ang larawan ng panlabas na kasuotang ibinabalot sa katawan. Ang “balabal” ay malinaw, marangal, at karaniwang nauunawaan sa makabagong Filipino.
- source_word: ἑλίξεις
  choice: gugulungin mo
  rationale: Isinasalin ang kilos ng pagrolyo o pagtupi nang hindi ginagawang lipas o labis na teknikal ang pananalita. Ang “gugulungin” ay likas na Filipino at angkop sa larawan ng isang balabal.
- source_word: αὐτούς
  choice: sila
  rationale: Tumutukoy pabalik sa mga nilikha sa naunang konteksto at pinananatili ang pangmaramihang panghalip.
- source_word: ὡς ἱμάτιον
  choice: gaya ng kasuotan
  rationale: Pinananatili ang ikalawang paghahambing sa damit at ang bahagyang pagkakaiba nito sa mas tiyak na “balabal.”
- source_word: ἀλλαγήσονται
  choice: mababago sila
  rationale: 'Malinaw na pinananatili ang pasibong diwa: ang mga nilikha ang sasailalim sa pagbabago.'
- source_word: σὺ δὲ ὁ αὐτὸς εἶ
  choice: Ngunit ikaw ay ikaw pa rin
  rationale: Likas na Filipino na malapit sa literal na “ikaw ay siya ring iyon/ikaw ang siya ring ikaw,” at malinaw na ipinakikita ang kaibahan sa nagbabagong sangnilikha nang hindi gumagamit ng mas teknikal na terminong teolohikal.
- source_word: τὰ ἔτη σου οὐκ ἐκλείψουσιν
  choice: ang iyong mga taon ay hindi magwawakas
  rationale: Pinananatili ang metaporang “mga taon” at malinaw na ipinahahayag ang diwa ng ἐκλείπω bilang hindi pagkaputol o pagtatapos.
theological_decisions:
- issue: Wika tungkol sa di-pagbabago ng Anak sa isang kristolohikal na sipi
  choice: Ngunit ikaw ay ikaw pa rin
  alternative: Ngunit hindi ka nagbabago
  rationale: Ang piniling anyo ay mas malapit sa ὁ αὐτός at pinananatili ang pahayag tungkol sa nagpapatuloy na pagkakakilanlan ng Anak. Hindi nito ipinapasok ang mas teknikal na pormulasyong doktrinal, bagaman nananatili ang malinaw na kaibahan sa nababagong sangnilikha.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Iniwasan ang lipas na “babalumbunin” at ang teknikal o hiram na “irorolyo,” habang pinananatili ang patulang larawan at magkatimbang na mga sugnay.
