  text: having become as much superior to the angels as the name he has inherited is more excellent than theirs.
translation:
  language: tl
  text: Naging higit na dakila siya kaysa sa mga anghel, kung gaano higit na marangal ang pangalang minana niya kaysa sa kanila.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Naging higit siyang mabuti kaysa sa mga anghel … higit na natatangi kaysa sa kanila.”
    reason: lexical_alternative
  - marker: b
    text: Ipinapakita ng kasunod na konteksto na ang “pangalan” ay nauugnay sa kanyang katayuan bilang Anak.
    reason: cross_reference
lexical_decisions:
- source_word: τοσούτῳ ... ὅσῳ
  choice: higit ... kung paanong higit
  rationale: 'Ipinahahayag nito ang magkaugnay at proporsiyonal na paghahambing: ang antas ng pagiging nakatataas ng Anak ay tumutugma sa higit na karangalan ng pangalang minana niya.'
- source_word: κρείττων
  choice: nakatataas
  rationale: Sa konteksto, tumutukoy ito sa higit na katayuan o ranggo kaysa sa mga anghel, hindi sa moral na pagiging mas mabuti.
- source_word: γενόμενος
  choice: naging
  rationale: Tuwirang pinananatili ang diwa ng pagpasok sa isang kalagayan nang hindi ipinahihiwatig na nilalang ang Anak.
- source_word: τῶν ἀγγέλων
  choice: kaysa sa mga anghel
  rationale: Likas na Filipino para sa genitibong ginagamit kasunod ng pahambing.
- source_word: διαφορώτερον
  choice: higit na marangal
  rationale: Ipinahahayag ang nakahihigit na pagkakilala at karangalan ng pangalan; iniiwasan ang mahinang saling 'mas naiiba.'
- source_word: παρ’ αὐτοὺς
  choice: kaysa sa kanila
  rationale: Pinananatili ang maikli at bahagyang eliptikong paghahambing ng Griyego; nauunawaan sa konteksto na inihahambing ang pangalan o katayuan ng Anak sa nauukol sa mga anghel.
- source_word: κεκληρονόμηκεν
  choice: minana niya
  rationale: Natural sa Filipino at ipinahahayag ang pagkamana; ang resultang nananatili mula sa perpektong aspekto ay malinaw sa konteksto.
- source_word: ὄνομα
  choice: ang pangalang
  rationale: Pinananatili ang literal na 'pangalan' at hinahayaang linawin ng mga susunod na talata ang tiyak na pagkakakilanlan at katayuang ipinahahayag nito.
theological_decisions:
- issue: Ang implikasyong Cristolohikal ng γενόμενος ('naging')
  choice: Isinalin nang tuwiran bilang 'naging,' na sa konteksto ay tumutukoy sa nahayag o nakamit na nakatataas na katayuan ng Anak kaugnay ng mga anghel.
  alternative: Gawing 'ginawang' o ipakahulugang nilalang ang Anak o noon lamang naging banal.
  rationale: Pinananatili ng salin ang kilos na nasa Griyego ngunit hindi nagdaragdag ng pahiwatig tungkol sa pagkalalang o pagbabago ng likas na pagka-Diyos ng Anak.
- issue: Kahulugan ng ὄνομα ('pangalan')
  choice: Panatilihin ang 'pangalan' at hayaang tukuyin ng kasunod na konteksto ang anak na titulo at katayuan.
  alternative: Isalin agad bilang 'titulong Anak' o palitan ng 'karangalan' o 'ranggo.'
  rationale: Ang mismong talata ay nagsasabing 'pangalan'; ang mga kasunod na sipi ang nagbibigay-linaw rito. Pinananatili nito ang daloy at tunay na lawak ng pahayag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'nakatataas' para malinaw na ranggo o katayuan ang paghahambing, at pinanatili ang 'pangalan' upang hindi unahan ang paliwanag ng kasunod na konteksto.
