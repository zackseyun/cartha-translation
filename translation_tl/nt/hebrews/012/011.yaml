  text: πᾶσα ⸀δὲ παιδεία πρὸς μὲν τὸ παρὸν οὐ δοκεῖ χαρᾶς εἶναι ἀλλὰ λύπης, ὕστερον δὲ καρπὸν εἰρηνικὸν τοῖς δι’ αὐτῆς γεγυμνασμένοις ἀποδίδωσιν δικαιοσύνης.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/011.yaml
  text: All discipline seems for the present to be not joy but sorrow[a]; yet later it yields the peaceful fruit of righteousness to those who have been trained by it.
translation:
  language: tl
  text: Sa kasalukuyan, ang bawat pagdidisiplina ay tila hindi kagalakan kundi kalungkutan; ngunit kalaunan, ibinibigay nito sa mga nahubog sa pamamagitan nito ang mapayapang bunga ng katuwiran[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “katarungan.” Maaaring tumukoy ang salitang Griyego sa katuwiran o katarungan; dito, malamang na tumutukoy ito sa matuwid na pamumuhay na ibinubunga ng pagdidisiplina ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδεία
  choice: pagdidisiplina
  rationale: Saklaw nito ang mapagmahal na pagtutuwid at patuloy na pagsasanay ng isang magulang, gaya ng hinihingi ng konteksto sa Hebreo 12, at hindi lamang pagpaparusa.
- source_word: πρὸς μὲν τὸ παρὸν
  choice: sa kasalukuyan
  rationale: Malinaw nitong ipinakikita ang pansamantalang karanasan na inihahambing sa ὕστερον, ‘kalaunan.’
- source_word: οὐ δοκεῖ
  choice: tila
  rationale: Pinananatili nito ang diwa ng nakikitang anyo o karanasan, sa halip na gawing ganap na pahayag.
- source_word: χαρᾶς ... ἀλλὰ λύπης
  choice: hindi nagdudulot ng kagalakan kundi kalungkutan
  rationale: Pinananatili ang salungatan ng dalawang pangngalan, ngunit gumagamit ng likas na kayarian sa makabagong Tagalog.
- source_word: ὕστερον
  choice: kalaunan
  rationale: Tuwirang ipinahahayag ang resultang dumarating pagkatapos ng kasalukuyang hirap.
- source_word: καρπὸν εἰρηνικὸν
  choice: mapayapang bunga
  rationale: Pinananatiling tuwirang panuring ng ‘bunga’ ang εἰρηνικόν, nang hindi nililimitahan ito sa bungang lumilikha lamang ng kapayapaan.
- source_word: τοῖς δι’ αὐτῆς γεγυμνασμένοις
  choice: sa mga nahubog sa pamamagitan nito
  rationale: Ipinahihiwatig ng ‘nahubog’ ang namamalaging resultang dulot ng paulit-ulit na pagsasanay, habang pinananatili ng ‘sa pamamagitan nito’ ang tahasang ugnayan sa pagdidisiplina.
- source_word: ἀποδίδωσιν
  choice: ibinibigay
  rationale: Likas itong gamitin sa Tagalog para sa resultang inihahatid ng pagdidisiplina at naiiwasan ang alanganing pag-uulit ng ‘nagbubunga’ at ‘bunga.’
- source_word: δικαιοσύνης
  choice: katuwiran
  rationale: Ang ‘katuwiran’ ang pinakamalawak at pinakanatural na katumbas dito para sa matuwid na kalagayan o asal na nalilikha ng pagdidisiplina; pinananatili sa talababa ang posibleng ‘katarungan.’
theological_decisions:
- issue: Kahulugan ng παιδεία bilang pagkilos ng Diyos sa mga mananampalataya
  choice: mapaghubog na pagdidisiplina na kinabibilangan ng pagtutuwid at pagsasanay
  alternative: parusa lamang; pagtuturo lamang
  rationale: Inilalarawan ng Hebreo 12:5–10 ang pagkilos ng Diyos sa ugnayang Ama-anak at bilang paghahanda sa kabanalan. Hindi nilulutas ng salin ang pagdidisiplina tungo sa pagganti lamang o pagtuturo lamang.
- issue: Kahulugan ng δικαιοσύνης
  choice: katuwiran
  alternative: katarungan
  rationale: Sa konteksto, pinakamalamang na tumutukoy ito sa matuwid na bunga sa buhay ng taong hinubog ng Diyos, ngunit maaari ring dalhin ng salitang Griyego ang diwa ng katarungan; kaya pinananatili ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang ‘pagdidisiplina’ at ‘nahubog’ upang maipahayag kapwa ang pagtutuwid at ang patuloy na pagsasanay, nang hindi ipinapakahulugang pagpaparusa lamang.
