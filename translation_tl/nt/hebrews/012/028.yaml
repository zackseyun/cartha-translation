id: HEB.12.28
reference: Hebrews 12:28
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: διὸ βασιλείαν ἀσάλευτον παραλαμβάνοντες ἔχωμεν χάριν, δι’ ἧς ⸀λατρεύωμεν εὐαρέστως τῷ θεῷ μετὰ ⸂εὐλαβείας καὶ δέους⸃,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/028.yaml
  text: Therefore[a], since we are receiving an unshakable kingdom, let us have grace, through which we may serve God acceptably with reverence and awe,
translation:
  language: tl
  text: Kaya, yamang tinatanggap natin ang isang kahariang hindi matitinag, taglayin natin ang biyaya[a], upang sa pamamagitan nito ay makapaglingkod tayo sa Diyos sa paraang kalugod-lugod sa kanya, nang may pagpipitagan at pagkatakot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “magpasalamat tayo.” Ang pariralang Griyego na ἔχωμεν χάριν ay maaaring mangahulugang “taglayin natin ang biyaya” o gamitin bilang idyoma para sa pagiging mapagpasalamat.'
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: Kaya
  rationale: Likas na panandang naghihinuha sa modernong Tagalog at malinaw na nag-uugnay sa naunang sinabi tungkol sa pagyanig at pag-aalis ng mga bagay na nilikha.
- source_word: βασιλείαν ἀσάλευτον
  choice: isang kahariang hindi matitinag
  rationale: Pinananatili ang larawan ng pagyanig at ang tuwirang pagsalungat nito sa mga bagay na nayayanig sa konteksto.
- source_word: παραλαμβάνοντες
  choice: yamang tinatanggap natin
  rationale: Ipinapakita ang pangkasalukuyan at nagpapatuloy na diwa ng participle at ang batayang dahilan ng kasunod na panawagan.
- source_word: ἔχωμεν χάριν
  choice: manatili tayo sa biyaya
  rationale: Ang literal na 'magkaroon tayo ng biyaya' ay hindi gaanong likas sa Tagalog. Ang 'manatili tayo sa biyaya' ay nagpapanatili sa χάρις bilang biyaya at nagbibigay ng malinaw na antecedent sa 'sa pamamagitan nito,' nang hindi ito tuwirang ginagawang pasasalamat. Inilalagay sa talababa ang kapani-paniwalang idyomatikong pagbasa na 'magpasalamat tayo.'
- source_word: δι’ ἧς
  choice: sa pamamagitan nito
  rationale: Pinananatili ang instrumental na gamit ng διά at malinaw na itinuturo pabalik sa 'biyaya.'
- source_word: λατρεύωμεν
  choice: makapaglingkod tayo
  rationale: Saklaw ng 'maglingkod' ang paglilingkod o pagsambang iniaalay sa Diyos at hindi ito nililimitahan sa panloob na pagsamba lamang.
- source_word: εὐαρέστως τῷ θεῷ
  choice: sa Diyos sa paraang kalugod-lugod sa kanya
  rationale: Natural sa Tagalog at malinaw na ang Diyos ang pinaglilingkuran at ang humahatol kung kalugod-lugod ang paglilingkod.
- source_word: μετὰ εὐλαβείας καὶ δέους
  choice: nang may pagpipitagan at pagkasindak
  rationale: 'Ibinubukod ang dalawang magkakaugnay ngunit di-magkaparehong diwa: magalang at banal na paggalang sa εὐλάβεια, at matinding sindak o awe sa δέος.'
theological_decisions:
- issue: Kahulugan ng χάριν sa ἔχωμεν χάριν
  choice: biyaya
  alternative: magpasalamat tayo / magkaroon tayo ng pasasalamat
  rationale: Maaaring mangahulugan ang parirala ng pagkakaroon ng biyaya o, bilang idyoma, ng pagiging mapagpasalamat. Ang pambabaeng panghalip sa δι’ ἧς ay natural na tumutukoy sa χάριν bilang kasangkapan ng kalugod-lugod na paglilingkod. Gayunman, tunay at matagal nang kinikilalang posibilidad ang pagbasa na 'magpasalamat tayo,' kaya pinananatili ito sa talababa.
- issue: Lakas ng δέος
  choice: pagkasindak
  alternative: pagkamangha
  rationale: Ang δέος ay may sangkap ng takot o sindak sa harap ng banal na kadakilaan; ang 'pagkamangha' lamang ay maaaring magpahina sa bigat nito, lalo na sa kasunod na pahayag na ang Diyos ay apoy na tumutupok.
translation_notes:
  register: Makabago at marangal na Filipino, naiiwasan ang labis na arkaikong pananalita. Ginamit ang 'kahariang hindi matitinag' upang mapanatili ang pangunahing larawan sa konteksto. Ang 'pagkasindak' ay sadyang mas mabigat kaysa 'pagkamangha' upang mapanatili ang tensiyon ng banal na paggalang at takot.
