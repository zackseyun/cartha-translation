  to: Kaya, yamang tinatanggap natin ang isang kahariang hindi matitinag, taglayin natin ang biyaya[a], upang sa pamamagitan nito ay makapaglingkod tayo sa Diyos sa paraang kalugod-lugod sa kanya, nang may pagpipitagan at pagkatakot.
