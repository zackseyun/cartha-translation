id: HEB.12.23
reference: Hebrews 12:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐκκλησίᾳ πρωτοτόκων ⸂ἀπογεγραμμένων ἐν οὐρανοῖς⸃, καὶ κριτῇ θεῷ πάντων, καὶ πνεύμασι δικαίων τετελειωμένων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/023.yaml
  text: and to the assembly of the firstborn who are enrolled in the heavens[a], and to God, the judge of all, and to the spirits of righteous people made perfect,
translation:
  language: tl
  text: at sa kapulungan ng mga panganay na nakatala sa mga langit[a], at sa Diyos, ang Hukom ng lahat, at sa mga espiritu ng mga taong matuwid na ginawang ganap,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa langit.” Pangmaramihan sa Griyego ang “sa mga langit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: kapulungan
  rationale: Pinananatili nito ang diwa ng isang nagkakatipong sambayanan nang hindi agad ipinapasok ang institusyonal na kahulugan ng “iglesya.” Ang konteksto ay ang makalangit na Sion at ang nagkakatipong bayan ng Diyos.
- source_word: πρωτοτόκων
  choice: mga panganay
  rationale: Ang pangmaramihang anyo sa Griyego ay tumutukoy sa isang pangkat na may katayuan o pribilehiyo ng panganay. Hindi idinagdag ang “mga anak na lalaki” sapagkat wala iyon nang tahasan sa teksto.
- source_word: ἀπογεγραμμένων
  choice: na nakatala
  rationale: Ipinahihiwatig ng ganap na balintiyak na pandiwari ang pagtatala na naisagawa na at nananatiling may bisa. Likas sa Tagalog ang “nakatala” at pinananatili nito ang larawan ng isang opisyal na talaan.
- source_word: ἐν οὐρανοῖς
  choice: sa mga langit
  rationale: Pinananatili ang pangmaramihang anyo ng Griyego. Bagaman mas karaniwan sa modernong Tagalog ang “sa langit,” malinaw at marangal pa rin ang “sa mga langit”; inilagay sa talababa ang mas idyomatikong alternatibo.
- source_word: κριτῇ θεῷ πάντων
  choice: sa Diyos, ang Hukom ng lahat
  rationale: Inilalahad ang “Hukom ng lahat” bilang pagtukoy sa Diyos, habang ipinagpapatuloy ang hanay ng mga nilapitan sa pangungusap.
- source_word: πνεύμασι
  choice: mga espiritu
  rationale: Ito ang tuwirang kahulugan ng salita at hindi nagdaragdag ng paliwanag tungkol sa kalagayan ng mga taong tinutukoy.
- source_word: δικαίων
  choice: mga taong matuwid
  rationale: Malinaw nitong ipinakikitang mga tao ang tinutukoy at hindi nito nililimitahan ang pahayag sa mga lalaki lamang.
- source_word: τετελειωμένων
  choice: na ginawang ganap
  rationale: Pinananatili nito ang balintiyak na anyo at ang mahalagang tema sa Hebreo ng pagiging ganap o pagdadala sa kaganapan.
theological_decisions:
- issue: Pagkakakilanlan ng “mga panganay”
  choice: Isang pangmaramihang katawagan sa bayan ng Diyos na may katayuan o mana ng panganay.
  alternative: Si Cristo lamang bilang Panganay, na siyang may-ari ng kapulungan.
  rationale: Malinaw na pangmaramihan ang πρωτοτόκων, kaya pinananatili ng salin ang kolektibong pagtukoy nang hindi nagdaragdag ng paliwanag sa mismong talata.
- issue: Tinutukoy ng “mga espiritu ng mga taong matuwid na ginawang ganap”
  choice: Mga espiritu ng matutuwid na tao na ginawang ganap.
  alternative: Lahat ng taong matuwid, katawanin man o hindi.
  rationale: Likas na tumutukoy ang parirala sa mga taong matuwid sa kanilang espirituwal na kalagayan, ngunit hindi dinaragdagan ng salin ang sinasabi ng teksto tungkol sa kalagayan nila o sa buhay pagkamatay.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang anyong listahan at ang bahagyang pormal na himig ng konteksto. Ginamit ang “kapulungan” sa halip na “iglesya,” “mga panganay” upang mapanatili ang pangmaramihan, at “mga langit” upang katawanin ang anyo ng Griyego; may talababa para sa mas karaniwang “langit.”
