id: HEB.12.6
reference: Hebrews 12:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὃν γὰρ ἀγαπᾷ κύριος παιδεύει, μαστιγοῖ δὲ πάντα υἱὸν ὃν παραδέχεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/006.yaml
  text: For the Lord disciplines the one he loves[b][a], and he scourges every son whom he receives.
translation:
  language: tl
  text: Sapagkat dinidisiplina ng Panginoon ang minamahal niya, at hinahagupit[a] niya ang bawat anak[b] na tinatanggap niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hinahampas ng latigo.” Mariin ang pandiwang Griyego at naglalarawan ng matinding pagdidisiplina.
    reason: lexical_alternative
  - marker: b
    text: Literal na “bawat anak na lalaki.” Sa kontekstong ito, kumakatawan ang pananalita sa lahat ng kinikilala ng Diyos bilang mga anak niya.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikita nito na ang talata ang nagbibigay ng batayan o dahilan para sa naunang pahayag.
- source_word: ἀγαπᾷ
  choice: minamahal
  rationale: Likas at tuwirang katumbas ito ng pandiwang tumutukoy sa pag-ibig ng Panginoon.
- source_word: κύριος
  choice: Panginoon
  rationale: Pinananatili nito ang titulong κύριος at ang teolohikal na bigat nito.
- source_word: παιδεύει
  choice: dinidisiplina
  rationale: Saklaw nito ang pagtutuwid at pagsasanay, hindi lamang pagpaparusa.
- source_word: μαστιγοῖ
  choice: hinahagupit
  rationale: Pinananatili nito ang marahas at matinding larawan ng paghampas nang hindi pinahihina ang salitang Griyego.
- source_word: δὲ
  choice: at
  rationale: Nagdurugtong ito rito ng kasunod na sugnay sa halip na magpahayag ng mariing pagsalungat.
- source_word: πάντα υἱὸν
  choice: bawat anak
  rationale: Sa makabagong Tagalog, ang “anak” ang natural na katawagang pampamilya at hindi kailangang tukuyin ang kasarian; nililinaw sa talababa na “anak na lalaki” ang literal na anyo ng Griyego at kumakatawan ito sa mga kinikilalang anak ng Diyos.
- source_word: παραδέχεται
  choice: tinatanggap
  rationale: Ipinahahayag nito ang pagtanggap o pagkilala nang may pagsang-ayon sa loob ng ugnayang pampamilya.
theological_decisions:
- issue: Ang katawagang υἱός sa konteksto ng pagdidisiplina at pagiging anak ng Diyos
  choice: bawat anak
  alternative: bawat anak na lalaki
  rationale: Mas natural sa Tagalog ang “anak,” samantalang inilalahad sa talababa ang literal na panlalaking anyo at ang kinatawang gamit nito. Sa gayon, napapanatili ang larawang pampamilya nang hindi nagmumukhang mga lalaki lamang ang tinutukoy.
- issue: Ang tindi ng μαστιγοῖ kaugnay ng pagdidisiplina ng Diyos
  choice: hinahagupit
  alternative: hinahampas ng latigo
  rationale: Hindi pinahihina ng “hinahagupit” ang mabigat na talinghaga. Pinananatili nito ang tensiyon sa pagitan ng pag-ibig ng Panginoon at ng masakit na pagdidisiplina.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “dinidisiplina” para sa mapagtuwid at mapaghubog na diwa, habang pinanatili ng “hinahagupit” ang matinding larawan ng orihinal.
