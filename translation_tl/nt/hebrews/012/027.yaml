base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/027.yaml
  text: This phrase, “Yet once more,” indicates the removal of the things being shaken—as things that have been made—so that the things not being shaken may remain.
translation:
  language: tl
  text: Ang mga salitang “Minsan pa” ay nagpapahiwatig ng pag-aalis ng mga bagay na niyayanig—bilang mga bagay na ginawa[a]—upang manatili ang mga bagay na hindi niyayanig.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bilang mga nilikhang bagay.” Literal na sinasabi sa Griyego, “bilang mga bagay na ginawa.”
    reason: lexical_alternative
  - marker: b
    text: O “ang mga bagay na hindi mayayanig”; maaari ring “ang hindi natitinag.”
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ δὲ Ἔτι ἅπαξ
  choice: Ang mga salitang “Minsan pa”
  rationale: Ginagawang paksa ng artikulong neuter ang siniping pahayag. Likas sa Tagalog ang “ang mga salitang” upang malinaw na ang mismong parirala ang ipinapaliwanag; hindi na kailangang isalin nang hiwalay ang banayad na pang-ugnay na δέ.
- source_word: δηλοῖ
  choice: ay nagpapahiwatig
  rationale: Ipinakikilala ng pandiwa ang kahulugang mahihinuha mula sa siniping parirala. Ang “nagpapahiwatig” ay malinaw at natural, nang hindi labis na pinatitindi bilang tahasang pagpapatunay.
- source_word: τῶν σαλευομένων
  choice: sa mga bagay na niyayanig
  rationale: Pinananatili ng “niyayanig” ang pasibong aspektong nagpapatuloy ng kasalukuyang participle at ang tuwirang kaibahan nito sa mga bagay na hindi niyayanig.
- source_word: μετάθεσιν
  choice: pag-aalis
  rationale: Sa konteksto, tumutukoy ito sa pagtanggal o pag-alis, hindi lamang sa pagbabago o paglilipat.
- source_word: ὡς πεποιημένων
  choice: bilang mga bagay na ginawa
  rationale: Pinananatili ng “bilang” ang ὡς at ng “ginawa” ang pagiging mga bagay na nagawa o nalikha. May talababa para sa natural at wastong alternatibong “mga nilikhang bagay.”
- source_word: ἵνα μείνῃ
  choice: upang manatili
  rationale: Natural na ipinahahayag ng “upang” ang layunin o kinalabasan ng ἵνα, habang pinananatili ng “manatili” ang diwa ng pananatili.
- source_word: τὰ μὴ σαλευόμενα
  choice: ang mga bagay na hindi niyayanig
  rationale: Pinananatili nito ang pormal na parallelismo sa “mga bagay na niyayanig” at hindi agad ipinapasok ang mas interpretatibong ideya ng kawalang-kakayahang mayanig.
theological_decisions:
- issue: Kung isasalin ang τὰ μὴ σαλευόμενα bilang kawalang-kakayahang mayanig o bilang mga bagay na hindi niyayanig
  choice: ang mga bagay na hindi niyayanig
  alternative: ang mga bagay na hindi mayayanig / ang hindi natitinag
  rationale: Magkatapat sa Griyego ang mga participle na “niyayanig” at “hindi niyayanig.” Pinananatili ng napiling salin ang pagkakatapat at ang tunay na tekstuwal na puwang, sa halip na agad itong iayon sa tahasang “kahariang hindi mayayanig” sa susunod na talata.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “niyayanig” sa dalawang magkatapat na parirala upang mapanatili ang anyo at tensiyon ng Griyego; iniwasan ang mas kolokyal na pananalita at ang denominasyonal na pagpapaliwanag.
