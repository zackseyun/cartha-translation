  naturalness: 'May maliit ngunit kapaki-pakinabang na pagwawasto: mas malinaw at idiomatiko ang “pag-aalis ng mga bagay na niyayanig” kaysa “pag-aalis sa mga bagay na niyayanig.” Ang una ay tuwirang nagpapahayag na ang mga bagay ang inaalis, samantalang ang “sa” ay maaaring magpahiwatig ng pag-aalis mula sa isang lugar o kaugnay ng mga bagay.'
  terminology: Ang “niyayanig” ay mabuti at pare-pareho sa magkabilang panig ng contrast. Ang “bilang mga bagay na ginawa” ay mapanatiling malapit sa ὡς πεποιημένων; ang talababa ay nagbibigay ng natural na alternatibo nang hindi pinapalitan ang pangunahing salin. Wasto ring hindi gawing pangunahing teksto ang mas interpretatibong “hindi mayayanig.”
