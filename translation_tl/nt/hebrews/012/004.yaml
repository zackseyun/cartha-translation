translation:
  language: tl
  text: Hindi pa kayo nanindigan laban sa kasalanan hanggang sa magdanak ang dugo sa inyong pakikipaglaban.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Hindi pa kayo nanindigan hanggang sa dugo.” Mas literal sa Griyego ang “hindi pa hanggang sa dugo kayo nanindigan,” isang idyomang nangangahulugang paglaban hanggang sa punto ng pagdanak ng dugo.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔπω
  choice: Hindi pa
  rationale: Likas at malinaw na katumbas sa modernong Tagalog ng temporal na diwa na hindi pa naaabot ang binabanggit na hangganan.
- source_word: μέχρις αἵματος
  choice: hanggang sa punto ng pagdanak ng dugo
  rationale: Ipinapahayag nito ang hangganang umaabot sa pagdanak ng dugo, habang iniiwasan ang hindi likas na literal na pariralang “hanggang sa dugo.”
- source_word: ἀντικατέστητε
  choice: kayo lumalaban
  rationale: Ang pandiwa ay tumutukoy sa matatag na paglaban o pagsalungat; ang “lumalaban” ay natural sa Tagalog at angkop sa larawan ng tunggalian.
- source_word: πρὸς τὴν ἁμαρτίαν
  choice: sa kasalanan
  rationale: Sa konstruksiyong “lumalaban sa,” malinaw na ipinahihiwatig ng Tagalog ang pagsalungat. Pinananatiling pangkalahatan ang tinutukoy ng “kasalanan,” gaya ng Griyego.
- source_word: ἀνταγωνιζόμενοι
  choice: lumalaban
  rationale: Ang participle ay may diwa ng patuloy na pakikipagtunggali. Isinama ito sa pangunahing pandiwang Tagalog upang maiwasan ang mabigat at paulit-ulit na “sa inyong pakikipaglaban ... ay lumaban.”
theological_decisions:
- issue: Ang tinutukoy ng “kasalanan” sa konteksto
  choice: Panatilihin itong pangkalahatan bilang “kasalanan.”
  alternative: Ang makasalanang pagsalungat ng mga mang-uusig; kasalanan sa pangkalahatan; o tuksong talikuran ang pananampalataya.
  rationale: Hindi tahasang nililimitahan ng talata ang tinutukoy. Pinananatili ng salin ang sadyang lawak at tensiyong teolohikal ng Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “pagdanak ng dugo” upang likas na maipahayag ang idyomang Griyego nang hindi tiyakang nililimitahan ito sa kamatayan o pagkamartir.
