  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐκλέλησθε τῆς παρακλήσεως, ἥτις ὑμῖν ὡς υἱοῖς διαλέγεται, Υἱέ μου, μὴ ὀλιγώρει παιδείας κυρίου, μηδὲ ἐκλύου ὑπ’ αὐτοῦ ἐλεγχόμενος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/005.yaml
  text: 'And you have forgotten the exhortation that addresses you as sons: “My son[a], do not regard lightly the Lord’s discipline[c][b], nor lose heart when you are reproved by him.”'
translation:
  language: tl
  text: 'At nalimutan na ninyo ang pangaral na nangungusap sa inyo bilang mga anak[a]:


    “Anak ko[a], huwag mong balewalain ang pagdidisiplina[b] ng Panginoon,[c]

    ni panghinaan ng loob kapag sinasaway ka niya.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “bilang mga anak na lalaki” at “Anak kong lalaki.” Pinananatili nito ang pananalita ng Kawikaan at ang tema ng pagiging anak sa bahaging ito. Sa Tagalog, maaaring tumukoy ang “mga anak” at “Anak ko” sa lahat ng kinakausap nang walang markang kasarian.
    reason: lexical_alternative
  - marker: b
    text: Ang “pagdidisiplina” ay maaari ring tumukoy sa “pagsasanay,” “pagtuturo,” o “pagtutuwid,” hindi lamang sa pagpaparusa.
    reason: lexical_alternative
  - marker: c
    text: Sipi o pagtukoy sa Kawikaan 3:11.
    reason: cross_reference
lexical_decisions:
- source_word: ἐκλέλησθε
  choice: nalimutan na ninyo
  rationale: Ipinahahayag ng perpektong anyo ang kasalukuyang kalagayang bunga ng pagkalimot; natural sa Tagalog ang “nalimutan na ninyo” at nananatili ang tono ng pagsaway.
- source_word: παρακλήσεως
  choice: pangaral
  rationale: Sa kontekstong nagpapakilala ng isang babala mula sa Kawikaan, malinaw na naihahatid ng “pangaral” ang diwang nagpapayo at sumasaway, nang hindi ito ginagawang basta parusa.
- source_word: ἥτις ... διαλέγεται
  choice: na nangungusap
  rationale: Napananatili nito ang larawan ng Kasulatan na tuwirang nakikipag-usap sa mga mambabasa, sa natural at marangal na Tagalog.
- source_word: ὡς υἱοῖς
  choice: bilang mga anak
  rationale: Karaniwang hindi minamarkahan ng “anak” ang kasarian sa Tagalog. Natural itong tumutukoy sa lahat ng kinakausap, habang nililinaw sa talababa na “mga anak na lalaki” ang tahasang anyo ng Griyego.
- source_word: Υἱέ μου
  choice: Anak ko
  rationale: Ito ang natural na Tagalog para sa isahang bokatibong “aking anak na lalaki”; pinananatili nito ang magulang-anak na pananalita ng Kawikaan nang hindi nagdaragdag ng di-natural na parirala.
- source_word: ὀλιγώρει
  choice: huwag mong balewalain
  rationale: Tumpak nitong ipinahahayag ang pagtrato sa isang bagay na parang walang halaga o kabuluhan, nang hindi pinalalakas tungo sa “kamuhian.”
- source_word: παιδείας
  choice: pagdidisiplina
  rationale: Saklaw nito ang paghubog, pagsasanay, at pagtutuwid sa loob ng ugnayang magulang-anak; hindi nito nililimitahan ang salita sa pagpaparusa lamang.
- source_word: κυρίου
  choice: ng Panginoon
  rationale: Direktang pinananatili ang genitibong kaugnayan at ang kinikilalang banal na titulong κύριος.
- source_word: ἐκλύου
  choice: panghinaan ng loob
  rationale: Natural nitong ipinahahayag ang panloob na panghihina o pagsuko sa ilalim ng pagtutuwid.
- source_word: ἐλεγχόμενος
  choice: kapag sinasaway ka
  rationale: Ang “sinasaway” ay angkop sa konteksto ng mapagtuwid na pagdidisiplina at pinananatili ang lakas ng ἐλέγχω nang hindi ito ginagawang mas mabagsik kaysa kailangan.
theological_decisions:
- issue: Pananalitang υἱοῖς / Υἱέ na may kasariang panlalaki
  choice: Gamitin ang natural na “mga anak” / “Anak ko” sa pangunahing teksto at linawin sa talababa ang literal na panlalaking anyo.
  alternative: mga anak na lalaki / Anak kong lalaki
  rationale: Tahasan ang “mga anak na lalaki” sa Griyego at mahalaga ito sa tema ng pagiging anak sa Hebreo, ngunit ang “anak” sa Tagalog ay likas na walang markang pangkasarian. Ang pagdaragdag ng “lalaki” sa pangunahing teksto ay magiging di-natural at maaaring magmukhang ang mga lalaking mambabasa lamang ang kinakausap. Pinananatili ng talababa ang anyo at intertekstuwal na ugnayan nang hindi sinisira ang natural na Tagalog.
- issue: Saklaw ng παιδεία sa ugnayan ng Diyos at ng kaniyang mga anak
  choice: pagdidisiplina
  alternative: pagsasanay; pagtuturo; pagtutuwid
  rationale: Hinahayaan ng “pagdidisiplina” na manatiling magkasama ang mapaghubog na pagsasanay at masakit na pagtutuwid. Hindi nito nilulutas ang tensiyon sa pamamagitan ng pagpapakahulugang parusa lamang o pagtuturo lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “pangaral,” “nangungusap,” at “ni panghinaan” upang mapanatili ang solemne ngunit madaling maunawaang himig ng sipi. Ang ayos ng mga talababa ay ginawang sunod-sunod na [a], [b], [c], at bawat pananda ay nasa pangunahing teksto.
