  text: ἀλλὰ προσεληλύθατε Σιὼν ὄρει καὶ πόλει θεοῦ ζῶντος, Ἰερουσαλὴμ ἐπουρανίῳ, καὶ μυριάσιν ἀγγέλων, πανηγύρει
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/022.yaml
  text: But you have come to Mount Zion and to the city of the living God[a], the heavenly Jerusalem, and to myriads of angels in festal gathering[b],
translation:
  language: tl
  text: Ngunit, lumapit na kayo sa Bundok Zion at sa lungsod ng Diyos na buháy, sa makalangit na Jerusalem, at sa di-mabilang na mga anghel sa masayang pagtitipon[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “sa di-mabilang na mga anghel, sa isang masayang pagtitipon.” Maaaring iugnay ng sintaks sa Griyego ang “masayang pagtitipon” sa mga anghel o ituring itong hiwalay na bahagi ng talaan. Ang salitang isinaling “di-mabilang” ay maaari ring mangahulugang “sampu-sampung libo.”'
    reason: alternative_reading_and_lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Sa halip
  rationale: Malinaw nitong itinatampok ang matinding paghahambing sa Bundok Sinai na inilarawan sa naunang konteksto.
- source_word: προσεληλύθατε
  choice: lumapit na kayo
  rationale: Ipinahihiwatig ng perpektong aspekto ang naganap nang paglapit na may nananatiling bunga sa kasalukuyan; natural itong naipapahayag ng “lumapit na kayo.”
- source_word: Σιὼν ὄρει
  choice: sa Bundok Zion
  rationale: Pinananatili ang larawan ng bundok at ang kinikilalang anyo ng pangalang Zion sa modernong Tagalog.
- source_word: πόλει θεοῦ ζῶντος
  choice: sa lungsod ng Diyos na buháy
  rationale: Pinananatili ang ugnayang paari at ang mahalagang paglalarawan sa Diyos bilang buháy.
- source_word: Ἰερουσαλὴμ ἐπουρανίῳ
  choice: sa makalangit na Jerusalem
  rationale: Tuwirang isinasalin ang pang-uri at pinananatili itong karagdagang pagtukoy sa lungsod ng Diyos na buháy.
- source_word: μυριάσιν ἀγγέλων
  choice: sa di-mabilang na mga anghel
  rationale: Ang μυριάς ay maaaring literal na sampu-sampung libo o, sa gamit dito, napakaraming hindi mabilang; ang salin ay natural at pinananatiling bukas ang eksaktong bilang.
- source_word: πανηγύρει
  choice: na nagdiriwang bilang isang kapulungan
  rationale: Ipinapahayag ang diwa ng isang masaya at pampublikong pagtitipon habang inuugnay, sa pangunahing teksto, sa naunang hukbo ng mga anghel.
theological_decisions:
- issue: Ugnayang sintaktiko ng πανηγύρει
  choice: 'Iniuugnay sa “di-mabilang na mga anghel”: nagdiriwang sila bilang isang kapulungan.'
  alternative: 'Maaari itong simula ng hiwalay na elemento sa talaan: “sa di-mabilang na mga anghel, sa isang kapulungang nagdiriwang.”'
  rationale: Pinahihintulutan ng hanay ng mga datibo sa Griyego ang dalawang pagbasa. Ang pag-uugnay sa mga anghel ay nagbibigay ng malinaw na diwa, ngunit tunay na malabo ang sintaks kaya inilalahad sa talababa ang alternatibo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “buháy” na may tuldik upang malinaw na tumukoy sa living at hindi sa salitang “bahay.” Pinanatili ang patungong galaw sa magkakasunod na “sa,” at iniwasang gawing mas tiyak kaysa sa Griyego ang malabong ugnayan ng πανηγύρει.
