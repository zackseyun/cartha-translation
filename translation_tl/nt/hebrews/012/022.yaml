revisions:
- from: Sa halip, lumapit na kayo sa Bundok Zion at sa lungsod ng Diyos na buháy, sa makalangit na Jerusalem, at sa di-mabilang na mga anghel na nagdiriwang bilang isang kapulungan[a],
