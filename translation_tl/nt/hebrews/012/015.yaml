base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/015.yaml
  text: watching carefully lest anyone fall short of the grace of God[a], lest any root of bitterness springing up cause trouble, and through it many be defiled[b],
translation:
  language: tl
  text: 'Magbantay kayong mabuti: baka may sinumang hindi makaabot sa biyaya ng Diyos[a]; baka may ugat ng kapaitan na sumisibol at manggulo, at sa pamamagitan nito ay madungisan ang marami[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “hindi matamo ang biyaya ng Diyos.” Ang pananalitang Griyego ay maaaring mangahulugang hindi maabot ang iniaalok o magkulang dito.
    reason: lexical_alternative
  - marker: b
    text: Ang “ugat ng kapaitan” ay malamang na umaalingawngaw sa Deuteronomio 29:18, kung saan ang isang nakalalasong ugat ay larawan ng kataksilan sa tipan na kumakalat sa pamayanan.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπισκοποῦντες
  choice: Magbantay kayong mabuti
  rationale: Ipinahahayag nito ang patuloy at sama-samang mapanuring pagbabantay na hinihingi ng kasalukuyang pandiwaring Griyego, sa natural na modernong Tagalog.
- source_word: μή τις ὑστερῶν ἀπὸ τῆς χάριτος τοῦ θεοῦ
  choice: baka may sinumang hindi makaabot sa biyaya ng Diyos
  rationale: Ang ὑστερέω kasunod ng ἀπό ay maaaring tumukoy sa hindi pag-abot o pagkukulang. Pinananatili ng 'hindi makaabot' ang babala nang hindi nagpapasya kung ito ay pagkawala, hindi pagtanggap, o kakulangan ng biyaya.
- source_word: χάριτος
  choice: biyaya
  rationale: Ang 'biyaya' ang karaniwan at angkop na salitang Filipino para sa χάρις dito, at pinananatili nito ang teolohikal at tipanang bigat ng pahayag.
- source_word: ῥίζα πικρίας
  choice: ugat ng kapaitan
  rationale: Malapit ito sa anyong Griyego at pinananatili ang larawang malamang na umaalingawngaw sa Deuteronomio 29:18.
- source_word: ἄνω φύουσα
  choice: na sumibol
  rationale: Likas na inilalarawan ng 'sumibol' ang paglitaw at paglago ng ugat; hindi na kailangang tahasang isalin ang direksiyong 'paitaas' upang maihatid ang larawan.
- source_word: ἐνοχλῇ
  choice: manggulo
  rationale: Tumpak at natural nitong ipinahahayag ang pagdudulot ng ligalig o kapinsalaan sa pamayanan.
- source_word: δι’ αὐτῆς
  choice: sa pamamagitan nito
  rationale: Pinananatili nito ang instrumental na diwa ng διά at ang reperensiya ng pambabaeng panghalip sa 'ugat' ayon sa balarilang Griyego.
- source_word: μιανθῶσιν πολλοί
  choice: madungisan ang marami
  rationale: Ang 'madungisan' ay nagpapanatili sa moral at panrelihiyong bigat ng μιαίνω, sa halip na gawing karaniwang kaguluhan lamang ang epekto nito.
theological_decisions:
- issue: Kung ang 'hindi makaabot sa biyaya ng Diyos' ay nangangahulugang pagkawala ng kaligtasan, hindi pagtanggap sa biyaya, o pagkahiwalay sa pamayanan
  choice: Isinaling walang pagpapasyang doktrinal bilang 'hindi makaabot sa biyaya ng Diyos.'
  alternative: Maaaring isalin na 'hindi matamo ang biyaya ng Diyos' o 'mawalan ng biyaya ng Diyos.'
  rationale: Pinahihintulutan ng Griyego ang diwang hindi pag-abot sa iniaalok, ngunit hindi nilulutas ng talata ang mga susunod na pagtatalong doktrinal tungkol sa apostasya at pananatili sa pananampalataya.
- issue: Kung pahihinain ang μιαίνω bilang simpleng kaguluhang panlipunan
  choice: Pinanatili ang mas mabigat na 'madungisan.'
  alternative: Maaaring sabihing 'maimpluwensiyahan' o 'mapinsala,' ngunit mas mahina ang mga ito.
  rationale: May moral at panrelihiyong lakas ang pandiwa, kaya hindi sapat ang salitang tumutukoy lamang sa pagkagambala.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'magbantay kayong mabuti' upang maging tuwiran ang sama-samang pananagutan, at pinanatili ang metaporang 'ugat ng kapaitan' at ang mabigat na salitang 'madungisan.'
