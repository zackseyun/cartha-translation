  text: Διὸ τὰς παρειμένας χεῖρας καὶ τὰ παραλελυμένα γόνατα ἀνορθώσατε,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/012.yaml
  text: Therefore[a], strengthen your drooping hands and your weakened knees,
translation:
  language: tl
  text: Kaya[a], palakasin ninyo ang mga kamay na nakalaylay at ang mga tuhod na nanghihina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas pormal, “itaas ninyo ang mga kamay na nakalaylay at ang mga tuhod na nanghihina.” Umaalingawngaw ang pananalitang ito sa Isaias 35:3 ayon sa tradisyong Griyego at gumagamit ng larawan ng katawan para sa panibagong tapang at pagtitiis.
    reason: cross_reference
lexical_decisions:
- source_word: Διὸ
  choice: Kaya
  rationale: Nagpapahiwatig ito ng kongklusyon at paghimok batay sa naunang pagtalakay tungkol sa pagtitiis at disiplina. Likas at malinaw sa modernong Tagalog ang “Kaya.”
- source_word: τὰς παρειμένας χεῖρας
  choice: ang mga kamay na nakalaylay
  rationale: Pinananatili ng “nakalaylay” ang kongkretong larawan ng mga kamay na lumuwag o bumagsak dahil sa panghihina, at umaalingawngaw sa pananalita ng Isaias 35:3 sa tradisyong Griyego.
- source_word: τὰ παραλελυμένα γόνατα
  choice: ang mga tuhod na nanghihina
  rationale: Ipinahihiwatig ng perfect participle ang mga tuhod na nanghina o nawalan ng lakas. Iniiwasan ng “nanghihina” ang maling klinikal na pakahulugang maaaring idulot ng “paralisado,” habang pinananatili ang larawan ng pagkapagod.
- source_word: ἀνορθώσατε
  choice: palakasin ninyo
  rationale: Ang aorist imperative ay isang tuwirang panawagan sa mapagpasyang pagkilos. Sa konteksto ng pagtitiis, natural na ipinahahayag ng “palakasin ninyo” ang pagpapanumbalik ng sigla, samantalang nananatili sa pangungusap ang larawang pangkatawan.
theological_decisions:
- issue: Matalinghagang paghimok gamit ang larawan ng panghihina ng katawan
  choice: Ipahayag ang utos bilang pagpapalakas para sa panibagong tapang at pagtitiis, habang pinananatili ang mga larawan ng kamay at tuhod.
  alternative: 'Mas pormal: “itaas ninyo ang mga kamay na nakalaylay at ang mga tuhod na nanghihina.”'
  rationale: Ang konteksto ng Hebreo 12 ay pagtitiis at disiplina. Hindi lamang pisikal na postura ang tinutukoy; ginagamit ang pangkatawang larawan upang manawagan sa panibagong lakas. Hindi nilulutas nang labis ang talinghaga sapagkat nananatili ang mga kamay at tuhod sa salin.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “ninyo” upang ipakita na maramihan ang kausap. Iniwasan ang masyadong klinikal na “paralisadong mga tuhod” at ang mas lumang tunog na “manghina ang mga kamay,” ngunit pinanatili ang kongkretong talinghaga.
