  source_fidelity: Tapat ang salin sa lohika ng Διὸ sa “Kaya” at sa utos na ἀνορθώσατε. Ang “palakasin ninyo” ay isang likas na kontekstuwal na pagsasalin ng panawagang ibangon/panumbalikin ang lakas, habang malinaw na pinananatili ang mga larawang “kamay” at “tuhod.” Ang “nakalaylay” ay angkop para sa παρειμένας, at ang “nanghihina” ay maingat na naghahatid ng pagpapahinang ipinahihiwatig ng παραλελυμένα nang walang di-kailangang klinikal na kahulugan.
