id: HEB.12.10
reference: Hebrews 12:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἱ μὲν γὰρ πρὸς ὀλίγας ἡμέρας κατὰ τὸ δοκοῦν αὐτοῖς ἐπαίδευον, ὁ δὲ ἐπὶ τὸ συμφέρον εἰς τὸ μεταλαβεῖν τῆς ἁγιότητος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/010.yaml
  text: For they disciplined us for a few days as seemed best to them[a], but he does so for our benefit[b], so that we may share in his holiness.
translation:
  language: tl
  text: Sapagkat sa loob ng maikling panahon[a], dinisiplina nila tayo ayon sa inaakala nilang tama[b]; ngunit dinidisiplina niya tayo para sa ating ikabubuti, upang makibahagi tayo sa kanyang kabanalan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa loob ng ilang araw.” Binibigyang-diin ng pariralang Griyego ang maikling tagal ng pagdidisiplina ng mga ama sa lupa.
    reason: lexical_alternative
  - marker: b
    text: O “ayon sa kung ano ang sa tingin nila ay pinakamabuti.” Ang parirala ay tumutukoy sa sarili nilang paghatol, hindi kinakailangang sa kung ano ang ganap na tama.
    reason: lexical_nuance
lexical_decisions:
- source_word: πρὸς ὀλίγας ἡμέρας
  choice: sa loob ng maikling panahon
  rationale: Idyomatiko ang parirala at itinatampok ang limitadong tagal ng pagdidisiplina ng mga ama sa lupa. Mas natural ito sa modernong Tagalog kaysa sa literal na “sa loob ng ilang araw,” habang pinananatili ang temporal na paghahambing.
- source_word: κατὰ τὸ δοκοῦν αὐτοῖς
  choice: ayon sa inaakala nilang tama
  rationale: Ipinahihiwatig ng δοκοῦν ang pansariling paghatol—ang sa tingin nila ay nararapat—nang hindi sinasabing talagang tama ang bawat pasiya nila.
- source_word: ἐπαίδευον
  choice: dinisiplina
  rationale: Sa konteksto ng Hebreo 12, ang παιδεύω ay tumutukoy sa pagdidisiplina at pagsasanay ng magulang, hindi lamang sa pagpaparusa.
- source_word: ὁ δὲ
  choice: ngunit dinidisiplina niya tayo
  rationale: Ang di-tahasang simuno ay ang Diyos ayon sa konteksto. Inulit ang pandiwa upang maging natural at malinaw sa Tagalog nang hindi tahasang idinaragdag ang pangalang “Diyos.”
- source_word: ἐπὶ τὸ συμφέρον
  choice: para sa ating ikabubuti
  rationale: Ipinapahayag nito ang layuning nakatuon sa kapakinabangan natin; malinaw at likas ang “ating ikabubuti” sa modernong Tagalog.
- source_word: εἰς τὸ μεταλαβεῖν
  choice: upang makibahagi tayo sa
  rationale: Pinananatili ng “upang” ang layuning ipinahahayag ng konstruksyon, at tumpak na inilalarawan ng “makibahagi” ang μεταλαμβάνω.
- source_word: ἁγιότητος αὐτοῦ
  choice: kanyang kabanalan
  rationale: Ang ἁγιότης ay kabanalan bilang katangiang taglay ng Diyos. Pinananatili ng panghalip ang anyo ng Griyego at malinaw ang tinutukoy nito sa konteksto.
theological_decisions:
- issue: Ang tinutukoy ng isahang simunong ὁ δὲ
  choice: Ang Diyos ang tinutukoy, ngunit pinanatiling panghalip na “niya.”
  alternative: Tahasang isalin na “ngunit dinidisiplina tayo ng Diyos.”
  rationale: Malinaw sa Hebreo 12:5–11 ang paghahambing ng mga ama sa lupa at ng Diyos bilang Ama. Pinananatili ng panghalip ang di-tahasang anyo ng Griyego nang hindi nagiging malabo sa konteksto.
- issue: Ang kahulugan ng pakikibahagi sa kabanalan ng Diyos
  choice: Isinalin bilang “makibahagi tayo sa kanyang kabanalan” nang hindi nililimitahan sa isang tiyak na sistemang doktrinal.
  alternative: Ipaliwanag ito bilang katayuang kabanalan lamang o bilang patuloy na pagpapabanal lamang.
  rationale: Sinasabi ng talata na layunin ng disiplina ng Diyos ang pakikibahagi sa kanyang kabanalan, ngunit hindi nito ganap na nililinaw rito ang paraan o saklaw nito. Pinananatili ng salin ang bigat at tensiyong teolohikal.
translation_notes:
  register: Gumamit ng makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang bokabularyo ng pagdidisiplina sa konteksto ng magulang, gayundin ang teolohikal na bigat ng “kabanalan,” nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
