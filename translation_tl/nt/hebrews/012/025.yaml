id: HEB.12.25
reference: Hebrews 12:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Βλέπετε μὴ παραιτήσησθε τὸν λαλοῦντα· εἰ γὰρ ἐκεῖνοι οὐκ ⸀ἐξέφυγον ⸂ἐπὶ γῆς παραιτησάμενοι τὸν⸃ χρηματίζοντα, ⸀πολὺ μᾶλλον ἡμεῖς οἱ τὸν ἀπ’ οὐρανῶν ἀποστρεφόμενοι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/025.yaml
  text: See to it that you do not refuse the one who is speaking[a]. For if those did not escape when they refused the one who warned them on earth[b], much less will we if we turn away from the one who warns from heaven.
translation:
  language: tl
  text: Tiyakin ninyong hindi ninyo tanggihan ang nagsasalita. Sapagkat kung hindi nakaligtas ang mga tumanggi sa nagbabala sa kanila sa lupa, lalo tayong hindi makaliligtas kung tatalikuran natin ang nagbababala mula sa langit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “lalo na tayo, na tumatalikod sa isa mula sa langit.” Ipinauunawa mula sa naunang sugnay ang pandiwang “makaliligtas”; hindi rin inuulit sa huling parirala ang pandiwang “nagsasalita” o “nagbababala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπετε
  choice: Tiyakin ninyo
  rationale: Isang maramihang pautos na may diwa ng mahigpit na pag-iingat; natural itong panawagan sa modernong Tagalog.
- source_word: μὴ παραιτήσησθε / παραιτησάμενοι
  choice: hindi ninyo tanggihan / mga tumanggi
  rationale: Pinananatili ng “tanggihan” ang pag-uugnay ng magkaparehong pandiwa sa dalawang sugnay at ang diwa ng pagtanggi sa mensahe o nagsasalita.
- source_word: τὸν λαλοῦντα
  choice: ang nagsasalita
  rationale: Pinananatili ang kasalukuyang aspektong ipinahihiwatig ng participle at hindi tinutukoy nang higit sa teksto kung sino ang nagsasalita.
- source_word: ἐξέφυγον
  choice: hindi nakaligtas
  rationale: Likas na katumbas sa Tagalog para sa hindi pag-iwas sa kinahinatnang hatol o kaparusahan.
- source_word: ἐπὶ γῆς
  choice: sa lupa
  rationale: Pinananatili ang tahasang paghahambing sa “mula sa langit” nang hindi ipinapasok ang Sinai sa pangunahing teksto.
- source_word: χρηματίζοντα
  choice: nagbigay sa kanila ng babala
  rationale: Ipinahahayag ang kontekstuwal na diwa ng makapangyarihan o banal na babala; ang “sa kanila” ay likas na ipinahiwatig na layon.
- source_word: πολὺ μᾶλλον
  choice: lalo tayong hindi makaliligtas
  rationale: Natural na Tagalog para sa argumento mula sa mas magaan tungo sa mas mabigat, habang ipinapahayag ang pandiwang “makaliligtas” na ipinauunawa lamang sa Griyego.
- source_word: ἀποστρεφόμενοι
  choice: kung tatalikuran natin
  rationale: Malinaw na inilalahad ang kondisyunal na puwersa ng participle at ang diwa ng sadyang pagtalikod.
- source_word: τὸν ἀπ’ οὐρανῶν
  choice: ang nagbababala mula sa langit
  rationale: Ginagawang natural sa Tagalog ang elliptikong parirala at pinananatili ang kaibahan ng lupa at langit; ang pandiwang “nagbababala” ay inuulit mula sa naunang sugnay para sa linaw.
theological_decisions:
- issue: Pagkakakilanlan ng nagsasalita o nagbababala
  choice: Panatilihin ang pangkalahatang paglalarawang “ang nagsasalita” at “ang nagbababala mula sa langit.”
  alternative: Tahasang pangalanan bilang Diyos o Cristo.
  rationale: Hindi tahasang pinapangalanan ng talata ang tinutukoy; hinahayaan ng salin na matukoy ito mula sa konteksto nang hindi nilulutas ang tunay na teolohikal na tensiyon.
- issue: Ellipsis sa huling sugnay
  choice: Ipahayag ang ipinauunawang pandiwa bilang “lalo tayong hindi makaliligtas.”
  alternative: Panatilihin ang mas literal ngunit putol na anyong “lalo pa tayo, na tumatalikod...”
  rationale: Malinaw na hinango ang pandiwa sa naunang “hindi nakaligtas.” Kailangan itong ipahayag upang maging buo at likas ang pangungusap sa modernong Tagalog, nang walang idinaragdag na doktrina.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang maramihang “ninyo” at inklusibong “tayo/natin” ayon sa pagbabago ng persona sa Griyego. Iniwasan ang arkaiko at sobrang teknikal na pananalita.
