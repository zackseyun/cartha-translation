base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/020.yaml
  text: 'For they could not endure what was being commanded: “If even an animal touches the mountain[a], it will be stoned.”'
translation:
  language: tl
  text: 'Sapagkat hindi nila matiis ang iniutos: “Kung kahit isang hayop ay humipo sa bundok[a], babatuhin ito.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Idinaragdag ng ilang manuskrito ang “o papanaín,” na umaalingawngaw sa Exodo 19:12–13.
    reason: textual_variant
lexical_decisions:
- source_word: οὐκ ἔφερον
  choice: hindi nila matiis
  rationale: Likas at malinaw na ipinapahayag nito ang kawalan nila ng kakayahang tanggapin o tiisin ang mabigat na utos.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili nito ang paliwanag na kaugnayan ng talata sa naunang pahayag.
- source_word: τὸ διαστελλόμενον
  choice: ang iniutos
  rationale: Ipinapahayag nito ang makapangyarihang utos na tinutukoy ng substantival passive participle nang hindi nagpapasok ng dagdag na detalye.
- source_word: Κἂν
  choice: Kahit
  rationale: Sa kondisyong ito, natural na naihahatid ng “kahit” ang diin na saklaw maging ang isang hayop.
- source_word: θηρίον
  choice: hayop
  rationale: Ang pangkalahatang salitang “hayop” ay malinaw sa modernong Tagalog at hindi nililimitahan ang kahulugan sa mabangis o mailap na hayop.
- source_word: θίγῃ
  choice: dumikit
  rationale: Ang “dumikit” ay natural na tumutukoy sa pisikal na pagsayad o paghipo sa bundok sa kontekstong ito.
- source_word: τοῦ ὄρους
  choice: sa bundok
  rationale: Tuwirang salin ito na hindi tahasang nagdaragdag ng pangalang Sinai, yamang “ang bundok” lamang ang nasa Griyego.
- source_word: λιθοβοληθήσεται
  choice: babatuhin ito hanggang mamatay
  rationale: Nililinaw nito ang nakamamatay na kaparusahang ipinahihiwatig ng pandiwang λιθοβολέω, habang pinananatili ang tinig na ang hayop ang tatanggap ng parusa.
theological_decisions:
- issue: Kaugnayan ng sipi sa utos sa Sinai
  choice: Sinunod ang maikling anyo ng sipi sa SBLGNT at hindi idinagdag sa pangunahing teksto ang pariralang tungkol sa palaso.
  alternative: Idagdag ang “o papanain” ayon sa ilang manuskrito at sa pag-alingawngaw ng Exodo 19:12–13.
  rationale: Nagtatapos ang ibinigay na tekstong Griyego sa λιθοβοληθήσεται. Iniiwasan ng salin ang paghaharmonisa, habang itinatala sa talababa ang tunay na variant ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Sapagkat” upang panatilihin ang lohikal na ugnayan, at ang sipi ay pinanatiling tuwiran at mariin.
