review_pass:
  verdict: revise
  source_fidelity: Kailangang alisin ang “hanggang mamatay,” sapagkat wala itong hayag na katumbas sa λιθοβοληθήσεται. Ang pandiwang Griyego ay nangangahulugang ‘babatuín’/‘pagbabatuín’; bagaman karaniwang nakamamatay ang parusa sa pinagmulang utos, hindi ito kailangang ilahad nang dagdag sa salin. Ang “Kung kahit isang hayop ay humipo” ay malinaw na naghahatid ng kondisyunal at mariing saklaw ng Κἂν.
  naturalness: Mas natural at tuwiran sa modernong Filipino ang “Kung kahit isang hayop ay humipo sa bundok, babatuhin ito.” Ang “dumikit” ay posible, ngunit ang “humipo” ay mas malawak at mas malapit sa θίγῃ sa kontekstong ito.
  terminology: Pinananatili ang “utos” para sa τὸ διαστελλόμενον, “hayop” para sa θηρίον, at “bundok” para sa ὄρος. Itinatama ang anyo ng pandiwa sa talababa sa “papanaín,” na nangangahulugang tamaan o patayin sa pamamagitan ng palaso.
  issues:
  - severity: medium
    issue: Ang “hanggang mamatay” ay dagdag na pagpapaliwanag sa pangunahing teksto.
    rationale: Ang SBLGNT ay may λιθοβοληθήσεται lamang, ‘babatuhin’ o ‘pagbabatuin.’ Hindi dapat ipasok sa salin ang resulta ng parusa na hindi tahasang isinasaad sa talata.
  - severity: low
    issue: Hindi gaanong malinaw ang kondisyunal na puwersa ng “Kahit hayop ay dumikit.”
    rationale: Ang Κἂν ay kondisyunal na may diin. Mas malinaw ang “Kung kahit isang hayop ay humipo.”
  - severity: low
    issue: Ang “papanain” sa talababa ay maaaring maunawaan bilang pagpapagawa sa iba na pumana.
    rationale: Ang “papanaín” ang mas angkop na anyo para sa ‘shot with an arrow.’
  revised_text: 'Sapagkat hindi nila matiis ang iniutos: “Kung kahit isang hayop ay humipo sa bundok[a], babatuhin ito.”'
  revised_footnotes:
  - marker: a
    text: Idinaragdag ng ilang manuskrito ang “o papanaín,” na umaalingawngaw sa Exodo 19:12–13.
    reason: textual_variant
  revision_rationale: 'Inayos ang salin upang mas mahigpit na tumugma sa Griyego: malinaw na kondisyunal ang sipi, ngunit walang idinagdag na hayag na resulta na ‘hanggang mamatay.’ Pinanatili ang maikling anyo ng SBLGNT at ang tekstuwal na variant ay nasa talababa lamang.'
