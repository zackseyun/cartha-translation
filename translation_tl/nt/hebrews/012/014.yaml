base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/014.yaml
  text: Pursue peace with everyone[a], and the holiness without which no one will see the Lord.
translation:
  language: tl
  text: Pagsikapan ninyo ang kapayapaan sa pakikitungo sa lahat at ang kabanalan, na kung wala ang kabanalan ay walang sinumang makakakita sa Panginoon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰρήνην
  choice: kapayapaan sa pakikitungo
  rationale: Ipinahihiwatig ng kasunod na μετὰ πάντων na ang tinutukoy ay kapayapaan sa ugnayan sa ibang tao, hindi lamang panloob na kapanatagan.
- source_word: διώκετε
  choice: Pagsikapan ninyo
  rationale: Ipinapanatili nito ang masigasig at patuloy na paghahangad na ipinahihiwatig ng διώκω, sa natural na modernong Tagalog.
- source_word: μετὰ πάντων
  choice: sa lahat
  rationale: 'Malinaw at natural nitong pinananatili ang pangkalahatang saklaw: lahat ng tao.'
- source_word: τὸν ἁγιασμόν
  choice: ang kabanalan
  rationale: Ang kabanalan ay malinaw sa karaniwang mambabasa at nasasaklaw nito ang banal na kalagayan at pamumuhay, habang kinikilala sa talababa ang posibleng diwang proseso ng pagpapakabanal.
- source_word: οὗ χωρὶς
  choice: kung wala ang kabanalan
  rationale: Inuulit ang pangngalan upang maging malinaw sa Tagalog na ang panlalaking isahang panghalip na οὗ ay tumutukoy sa ἁγιασμόν, nang hindi binabago ang kahulugan.
- source_word: οὐδεὶς ὄψεται
  choice: walang sinumang makakakita
  rationale: Tuwirang pinananatili ang ganap na pagtanggi at ang panghinaharap na diwa ng pandiwa.
- source_word: τὸν κύριον
  choice: sa Panginoon
  rationale: Pinananatili ang titulong κύριος nang hindi tinutukoy kung ang referent ay ang Diyos Ama o ang Panginoong Jesus.
theological_decisions:
- issue: Kahulugan ng ἁγιασμός sa isang pangaral
  choice: kabanalan
  alternative: pagpapakabanal
  rationale: Mas natural at madaling maunawaan ang “kabanalan” bilang banal na kalagayan at uri ng pamumuhay na dapat pagsikapan. Gayunman, hindi isinasara ang posibleng diwa ng proseso, kaya inilagay ang “pagpapakabanal” sa talababa.
- issue: Referent ng τὸν κύριον
  choice: Panginoon
  alternative: Diyos; Panginoong Jesus
  rationale: Hindi tinutukoy ng tekstong Griyego nang higit sa “ang Panginoon,” kaya hindi nilulutas ng salin ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ang “kapayapaan sa pakikitungo” ay nilinaw bilang panlipunang kapayapaan, at ang “Panginoon” ay sadyang iniwang hindi tinukoy ang referent.
