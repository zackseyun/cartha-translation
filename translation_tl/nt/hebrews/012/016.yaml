  text: μή τις πόρνος ἢ βέβηλος ὡς Ἠσαῦ, ὃς ἀντὶ βρώσεως μιᾶς ἀπέδετο τὰ πρωτοτόκια ⸀ἑαυτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/016.yaml
  text: that no one be sexually immoral or godless like Esau, who sold his own birthright for a single meal.
translation:
  language: tl
  text: Tiyakin ninyo na walang sinumang imoral sa pakikipagtalik o walang paggalang sa banal gaya ni Esau, na ipinagbili ang sarili niyang karapatan bilang panganay kapalit ng isang pagkain.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πόρνος
  choice: imoral sa pakikipagtalik
  rationale: Tuwirang ipinahahayag ang seksuwal na diwa ng salita sa malinaw at makabagong Tagalog nang hindi nililimitahan sa isang partikular na uri ng seksuwal na kasalanan.
- source_word: βέβηλος
  choice: lumalapastangan sa Diyos
  rationale: Ipinahahayag ang diwa ng taong itinuturing na karaniwan o walang kabanalan ang mga banal na bagay. Mas malinaw ito sa karaniwang mambabasa kaysa sa salitang 'lapastangan' lamang, habang pinananatili ang relihiyosong puwersa ng konteksto.
- source_word: ἀντὶ βρώσεως μιᾶς
  choice: kapalit ng isang kainan
  rationale: Pinananatili ang diin sa iisang pagkain bilang napakaliit na kapalit ng karapatan bilang panganay.
- source_word: ἀπέδετο
  choice: ipinagbili
  rationale: Karaniwang kahulugan ng pandiwa sa gitnang tinig dito; malinaw na kusang isinuko ni Esau ang karapatan kapalit ng pagkain.
- source_word: τὰ πρωτοτόκια ἑαυτοῦ
  choice: ang sarili niyang karapatan bilang panganay
  rationale: Inililinaw na ang tinutukoy ay ang natatanging karapatan at pribilehiyo ng panganay, at pinananatili ang emphatic na 'sarili niyang'.
theological_decisions:
- issue: Pag-uugnay ng πόρνος at βέβηλος kay Esau
  choice: Pinananatiling kapwa nasa iisang babala ang seksuwal na imoralidad at paglapastangan sa Diyos, na sinusundan ng halimbawa ni Esau.
  alternative: Ituring si Esau bilang halimbawa lamang ng βέβηλος at hindi ng πόρνος.
  rationale: Ang Griyegong ayos ay maaaring magbigay-daan sa tanong kung parehong paglalarawan kay Esau ang dalawang termino. Hindi nilulutas ng salin nang tahasan ang saklaw; pinananatili nito ang pagkakasunod at tensiyon ng orihinal.
- issue: Kahulugan ng βέβηλος
  choice: lumalapastangan sa Diyos
  alternative: walang pagkilala sa kabanalan; hindi maka-Diyos; lapastangan
  rationale: Sa halimbawa ni Esau, ang punto ay ang paghamak sa sagradong halaga ng karapatan bilang panganay. Ang salin ay hindi nagsasabing ateista siya, kundi inilalarawan ang pagtrato niya sa banal na bagay.
translation_notes:
  register: Makabagong, dignified, at madaling maunawaang Filipino. Ginamit ang pangmaramihang 'ninyo' dahil ang babala ay nakatuon sa buong pamayanan. Iniwasan ang sobrang teknikal na 'pagkapanganay' bilang pangngalan at ginamit ang natural na 'karapatan bilang panganay.'
