id: HEB.12.17
reference: Hebrews 12:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἴστε γὰρ ὅτι καὶ μετέπειτα θέλων κληρονομῆσαι τὴν εὐλογίαν ἀπεδοκιμάσθη, μετανοίας γὰρ τόπον οὐχ εὗρεν, καίπερ μετὰ δακρύων ἐκζητήσας αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/017.yaml
  text: For you know that afterward[a], when he wanted to inherit the blessing, he was rejected, for he found no opportunity for repentance[b], though he sought it with tears.
translation:
  language: tl
  text: Sapagkat alam ninyo na nang maglaon, nang gusto niyang manahin ang pagpapala, tinanggihan siya. Wala na siyang nakitang pagkakataon upang magsisi,[a] kahit hinanap niya iyon[b] nang may luha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “wala siyang nakitang paraan upang mabago ang pasiya.” Maaaring ang ibig sabihin ay wala nang pagkakataong baligtarin ang naging bunga, o hindi niya napagbago ang pasiya ni Isaac.
    reason: alternative_reading
  - marker: b
    text: Ang “iyon” ay maaaring tumukoy sa pagpapala o, bagaman mas hindi malamang, sa pagsisisi o pagkakataong magsisi. Malabo sa Griyego ang tinutukoy ng panghalip.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴστε
  choice: alam ninyo
  rationale: Ang anyong perpekto ng οἶδα ay may pangkasalukuyang diwa; likas sa Tagalog ang “alam ninyo” bilang pagtukoy sa dati nang kaalaman ng mga mambabasa.
- source_word: μετέπειτα
  choice: nang maglaon
  rationale: Malinaw at likas na panandang temporal para sa isang pangyayaring sumunod.
- source_word: θέλων
  choice: nang gusto niya
  rationale: Isinasalin ang participle bilang sugnay na temporal at pinananatili ang diwa ng pagnanais nang hindi ito pinalalabis.
- source_word: κληρονομῆσαι
  choice: manahin
  rationale: Tuwirang katumbas ng pagtanggap bilang mana at angkop sa pagpapalang pantahanan sa salaysay tungkol kay Esau.
- source_word: τὴν εὐλογίαν
  choice: ang pagpapala
  rationale: Tumutukoy sa tiyak na pagpapala ng ama sa salaysay, nang hindi nagdaragdag ng paliwanag sa pangunahing teksto.
- source_word: ἀπεδοκιμάσθη
  choice: tinanggihan siya
  rationale: Ipinahahayag ang pasibong pagtanggi nang malinaw at hindi naglalagay ng teknikal na doktrinal na kahulugan.
- source_word: μετανοίας ... τόπον
  choice: pagkakataon upang magsisi
  rationale: Natural na Tagalog para sa idyomang “makahanap ng lugar/saklaw para sa pagsisisi,” habang pinananatili sa talababa ang posibleng kahulugang pagbabago ng pasiya.
- source_word: καίπερ
  choice: kahit
  rationale: Natural na panandang pasalungat para sa concessive na ugnayan.
- source_word: μετὰ δακρύων
  choice: nang may luha
  rationale: Tuwirang paglalarawan sa paraan o kalagayan ng paghahanap.
- source_word: ἐκζητήσας αὐτήν
  choice: hinanap niya iyon
  rationale: Ang “iyon” ay hindi tahasang nagtatakda kung pagpapala o pagkakataong magsisi ang tinutukoy ng panghalip, kaya naiiwan ang tunay na kalabuan ng Griyego.
theological_decisions:
- issue: Ang kahulugan ng μετανοίας τόπον at ang tinutukoy ng αὐτήν
  choice: Sa pangunahing teksto, walang pagkakataon si Esau upang magsisi, at “iyon” ang hinanap niya nang may luha; ipinaliliwanag sa mga talababa ang kalabuan.
  alternative: Maaaring ang ibig sabihin ay wala siyang paraan upang mabago ang naging bunga, o hindi niya napagbago ang pasiya ni Isaac; maaari ring ang “iyon” ay tuwirang tumukoy sa pagpapala.
  rationale: Parehong pambabae sa Griyego ang “pagpapala” at “pagsisisi,” kaya hindi tiyak ang tinutukoy ng panghalip. Hindi dapat lutasin ng salin ang isang kalabuan na pinananatili ng pinagmulang teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nang maglaon” at “pagkakataon upang magsisi” para sa likas na daloy, habang ang mga talababa ay nagpapanatili sa leksikal at teolohikal na kalabuan ng Griyego.
