  text: καὶ διαθήκης νέας μεσίτῃ Ἰησοῦ, καὶ αἵματι ῥαντισμοῦ κρεῖττον λαλοῦντι παρὰ τὸν Ἅβελ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/024.yaml
  text: and to Jesus[a], the mediator of a new covenant[b], and to the sprinkled blood that speaks better than Abel.
translation:
  language: tl
  text: at kay Jesus, ang tagapamagitan ng isang bagong tipan, at sa dugong iwinisik[b] na nagsasalita nang mas mabuti kaysa kay Abel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kaysa sa dugo ni Abel.” Ang literal na nasa Griyego ay “kaysa kay Abel,” na malamang na tumutukoy sa dugo ni Abel na sumisigaw mula sa lupa (Gen 4:10).
    reason: alternative_reading
  - marker: b
    text: Ang “dugong iwinisik” ay dugong ginagamit sa ritwal na pagwiwisik; ipinapaalala nito ang pagpapatibay ng tipan at ritwal na paglilinis.
    reason: cultural_note
lexical_decisions:
- source_word: διαθήκης νέας
  choice: ng isang bagong tipan
  rationale: Ang “tipan” ang likas at teolohikal na angkop na salin ng διαθήκη sa Hebreo. Pinananatili ng “isang bagong tipan” ang kawalan ng pantukoy sa Griyego nang hindi itinatangging ito ang tipang ipinangako sa Kasulatan.
- source_word: μεσίτῃ
  choice: tagapamagitan
  rationale: Karaniwang salitang Filipino ito para sa isang namamagitan sa mga panig at pinananatili nito ang legal at pangtipang diwa ng salita.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Ginamit ang pamantayang anyo ng pangalan sa modernong Filipino.
- source_word: αἵματι ῥαντισμοῦ
  choice: dugong iwinisik
  rationale: Malinaw nitong ipinahihiwatig ang dugong inilalapat sa pamamagitan ng ritwal na pagwiwisik, habang nananatiling natural sa Filipino.
- source_word: κρεῖττον
  choice: mas mabuti
  rationale: Pinananatili nito ang paulit-ulit na tema ng paghahambing sa Hebreo at natural itong pakinggan sa kasalukuyang Filipino.
- source_word: λαλοῦντι
  choice: na nagsasalita
  rationale: Isinasalin nito ang kasalukuyang pandiwaring tumutukoy sa dugo at pinananatili ang personipikasyon sa teksto.
- source_word: παρὰ τὸν Ἅβελ
  choice: kaysa kay Abel
  rationale: Tuwirang pinananatili nito ang maikli at eliptikong paghahambing ng Griyego, na tahasang bumabanggit kay Abel at hindi sa kanyang dugo.
theological_decisions:
- issue: Ang tinutukoy sa paghahambing kay Abel
  choice: “mas mabuti kaysa kay Abel” sa pangunahing teksto
  alternative: “mas mabuti kaysa sa dugo ni Abel”
  rationale: Malakas ang pahiwatig sa dugo ni Abel na sumisigaw mula sa lupa (Gen 4:10), ngunit si Abel mismo ang tahasang pinangalanan sa Griyego. Pinananatili ng salin ang tunay na ikli at kalabuan ng teksto, at inilalagay sa talababa ang malamang na pahiwatig.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “tagapamagitan” at “tipan” bilang malinaw at kinikilalang terminong biblikal. Inilagay ang [b] kaagad pagkatapos ng pariralang ipinaliliwanag nito at ang [a] pagkatapos ng paghahambing kay Abel.
