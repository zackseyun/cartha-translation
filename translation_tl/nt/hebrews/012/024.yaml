  source_fidelity: 'Tumpak na naisasalin ang mga pangunahing elemento ng Griyego: si Jesus bilang tagapamagitan ng isang bagong tipan, ang dugong iwinisik, at ang sadyang maikli at eliptikong paghahambing kay Abel. Ang pangunahing kailangang ayusin ay ang pang-abay na anyo sa paghahambing: ang λαλοῦντι ay mas natural na maipapahayag bilang “nagsasalita nang mas mabuti,” hindi “nagsasalita ng mas mabuti.”'
  naturalness: Marangal at malinaw ang rehistro. Gayunman, ang “nagsasalita ng mas mabuti” ay hindi likas na Filipino sa kahulugang “speaks better”; “nagsasalita nang mas mabuti” ang wastong at natural na gamit. Ang talababa tungkol sa pagwiwisik ay maaari ring gawing mas tuwiran at hindi labis na magpahiwatig na ang parirala mismo ay nagsasaad ng paghahandog.
  terminology: Ang “tagapamagitan,” “bagong tipan,” at “dugong iwinisik” ay angkop na modernong Filipino at pinananatili ang mahalagang pangtipan at ritwal na mga termino. Ang “kaysa kay Abel” ay wastong pinananatili ang elipsis ng Griyego; ang alternatibong pagpapalawak sa dugo ni Abel ay nararapat lamang sa talababa.
  issues:
