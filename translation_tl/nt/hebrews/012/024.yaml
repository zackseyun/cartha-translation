    issue: Maling gamit ng “ng” sa pariralang “nagsasalita ng mas mabuti.”
    rationale: Pang-abay ang “mas mabuti” sa paglalarawan kung paano nagsasalita ang dugo; kaya “nang mas mabuti” ang natural at wastong Filipino.
  - severity: low
    issue: Ang talababa [b] ay maaaring magmungkahi nang higit sa tahasang sinasabi ng parirala sa pamamagitan ng “dugong inihahandog.”
    rationale: Ang αἷμα ῥαντισμοῦ ay tumutukoy sa dugong kaugnay ng ritwal na pagwiwisik. Maaaring ipaliwanag ang larawang pangtipan at paglilinis nang hindi ipinapasok sa depinisyon ang paghahandog bilang tahasang nilalaman ng parirala.
