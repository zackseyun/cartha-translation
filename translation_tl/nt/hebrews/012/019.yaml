  text: and to the sound of a trumpet and to a voice of words[b][a], whose hearers begged that no further word be spoken to them.
translation:
  language: tl
  text: at sa tunog ng trumpeta at sa tinig na bumibigkas ng mga salita[b]—na ang mga nakarinig nito ay nakiusap na huwag na silang kausapin pa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “na ang mga nakarinig ng lahat ng iyon ay nakiusap na huwag na silang kausapin pa,” kung ang kaugnay na panghalip ay tumutukoy nang mas malawak sa buong pagpapakita sa Sinai at hindi lamang sa “tinig na bumibigkas ng mga salita.”
    reason: alternative_reading
  - marker: b
    text: Tingnan ang Exodo 20:18–19 at Deuteronomio 5:23–27 tungkol sa pakiusap ng mga Israelita na huwag na nilang tuwirang marinig ang tinig ng Diyos.
    reason: cross_reference
lexical_decisions:
- source_word: σάλπιγγος ἤχῳ
  choice: sa tunog ng trumpeta
  rationale: Tuwirang inilalarawan nito ang narinig sa Sinai. Ang “tunog” ay malapit sa ἦχος at hindi nagdaragdag ng di-tiyak na tindi gaya ng maaaring ipahiwatig ng “malakas na hudyat.”
- source_word: φωνῇ ῥημάτων
  choice: sa tinig na bumibigkas ng mga salita
  rationale: Ipinahihiwatig ng parirala na malinaw na pananalita, hindi basta ingay, ang narinig. Mas natural ito sa makabagong Tagalog kaysa sa literal ngunit alanganing “tinig ng mga salita,” habang pinananatili ang matingkad na larawan ng tinig at mga salita.
- source_word: ἧς
  choice: na nang marinig ng mga tao
  rationale: Ang pambabaeng panghalip na ἧς ay pinakamalapit na tumutukoy sa φωνῇ (“tinig”). Hinayaan ng kayariang Tagalog na manatiling posible sa konteksto ang mas malawak na pagtukoy sa buong narinig na pagpapakita sa Sinai.
- source_word: οἱ ἀκούσαντες
  choice: nang marinig ng mga tao
  rationale: Natural na isinasalin nito ang substantival participle bilang mga taong nakarinig, na sa konteksto ay ang mga Israelita.
- source_word: παρῃτήσαντο
  choice: nakiusap silang
  rationale: Ipinakikita ng “nakiusap” ang marubdob na paghiling na huwag na silang tuwirang kausapin, nang hindi ito pinapakahulugang simpleng pagtanggi lamang.
- source_word: μὴ προστεθῆναι αὐτοῖς λόγον
  choice: huwag nang magsalita pa sa kanila
  rationale: Natural nitong ipinapahayag ang ιδyomang “huwag nang dagdagan pa ng salita para sa kanila” at pinananatili ang diwa ng pagpapatuloy ng tuwirang pagsasalita.
theological_decisions:
- issue: Ang tinutukoy ng sugnay na nagsisimula sa ἧς
  choice: Sa pangunahing teksto, pinakamalapit itong tumutukoy sa “tinig na bumibigkas ng mga salita.”
  alternative: Maaaring mas malawak itong tumukoy sa buong nakatatakot na narinig sa Sinai, kabilang ang tunog ng trumpeta at ang tinig.
  rationale: Sinusuportahan ng pambabaeng isahang ἧς at ng pinakamalapit na pambabaeng pangngalang φωνῇ ang pagtukoy sa tinig. Gayunman, ipinakikita ng konteksto na umurong ang mga nakarinig dahil sa kabuuang pagpapakita sa Sinai, kaya inilalahad sa talababa ang mas malawak na posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang anyong dugtong ng talata sa naunang pangungusap sa pamamagitan ng panimulang “at.” Ginamit ang “bumibigkas” upang natural na maipahayag ang artikuladong pananalita nang hindi pinapawi ang solemneng larawan ng orihinal.
