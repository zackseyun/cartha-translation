  text: οὗ ἡ φωνὴ τὴν γῆν ἐσάλευσεν τότε, νῦν δὲ ἐπήγγελται λέγων· Ἔτι ἅπαξ ἐγὼ ⸀σείσω οὐ μόνον τὴν γῆν ἀλλὰ καὶ τὸν οὐρανόν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/026.yaml
  text: whose voice shook the earth then[a], but now he has promised, saying[b], “Yet once more I will shake not only the earth but also the heaven.”
translation:
  language: tl
  text: 'Ang tinig niya ang yumanig sa lupa noon, ngunit ngayo''y nangako siya: “Minsan pa, yayanigin ko hindi lamang ang lupa kundi pati ang langit.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sipi mula sa Hagai 2:6.
    reason: cross_reference
lexical_decisions:
- source_word: οὗ ἡ φωνὴ
  choice: Ang tinig niya
  rationale: Likas na ipinahahayag sa Tagalog ang genitibong panghalip bilang “niya”; pinananatili ng “tinig” ang personal na banal na tagapagsalita at ang kaugnayan sa naunang konteksto.
- source_word: ἐσάλευσεν
  choice: ang yumanig
  rationale: Ang “yumanig” ay malinaw at masiglang katumbas ng aorist na pandiwa para sa nangyaring pagyanig; ipinapakita ng pangungusap na ang tinig ang naging sanhi nito.
- source_word: τὴν γῆν
  choice: sa lupa
  rationale: Sa pagtutunggali nito sa “langit,” ang γῆ ay tumutukoy sa lupa bilang malawak na bahagi ng nilikha, hindi lamang sa isang lupain o rehiyon.
- source_word: τότε, νῦν δὲ
  choice: noon, ngunit ngayo'y
  rationale: Pinananatili nito ang malinaw na temporal na pagtutunggali sa pagitan ng nakaraang pagyanig at ng pangakong may bisa ngayon.
- source_word: ἐπήγγελται
  choice: nangako siya
  rationale: Ipinahahayag ng “nangako” ang kahulugan ng perpektong anyo ng ἐπαγγέλλομαι at ang nananatiling bisa ng pangako; ginawang hayag ang likas na paksa upang maging natural sa Tagalog.
- source_word: Ἔτι ἅπαξ
  choice: Minsan pa
  rationale: Natural at dignidad na pariralang Tagalog para sa isa pang pagyanig; hindi nito ipinapakahulugang paulit-ulit pa pagkatapos nito.
- source_word: σείσω
  choice: yayanigin ko
  rationale: Tumpak na hinaharap na anyo na nagpapanatili sa larawan ng malawakang pagyanig.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: hindi lamang ... kundi pati
  rationale: Karaniwan at malinaw na katumbas sa modernong Tagalog ng korelatibong konstruksiyon.
- source_word: τὸν οὐρανόν
  choice: ang langit
  rationale: Ang “langit” ang natural na salin ng isahang οὐρανός at pinananatili ang malawak na pares na “lupa ... langit” nang hindi nililimitahan ito sa pisikal na himpapawid lamang.
theological_decisions:
- issue: Tinutukoy ng οὗ at ang di-hayag na gumagawa ng ἐπήγγελται
  choice: Ang Diyos ang siyang may tinig na yumanig sa lupa at siya ring nangako.
  alternative: Isang mas impersonal na ayos na hindi malinaw kung sino ang nangako.
  rationale: Itinuturo ng naunang konteksto at ng sipi mula sa Hagai na ang Diyos ang tagapagsalita. Nililinaw ito ng “niya” at “siya” nang walang idinaragdag na doktrinal na detalye.
- issue: Saklaw ng “lupa” at “langit”
  choice: Pinanatili ang malawak at kosmikong pares na “lupa ... langit.”
  alternative: “Lupain ... himpapawid.”
  rationale: Ang pagtutunggali ng γῆ at οὐρανός sa sipi ay sumasaklaw sa kaayusan ng nilikha; ang mas makitid na mga salita ay maaaring magbawas sa saklaw nang walang sapat na batayan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, maikli, at marangal. Ginamit ang pinaikling “ngayo'y” upang mapanatili ang maayos na daloy. Hindi na isinama ang leksikal na talababa ng English consultation layer tungkol sa “the heaven,” sapagkat natural nang naipapahayag ng Tagalog na “ang langit” ang isahan at may pantukoy na Griyego; ang gayong talababa ay hindi nagbibigay ng makabuluhang alternatibo sa target na wika.
