id: HEB.12.13
reference: Hebrews 12:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ τροχιὰς ὀρθὰς ⸀ποιεῖτε τοῖς ποσὶν ὑμῶν, ἵνα μὴ τὸ χωλὸν ἐκτραπῇ, ἰαθῇ δὲ μᾶλλον.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/013.yaml
  text: and make straight paths for your feet[a], so that the lame may not be turned aside[b], but rather be healed.
translation:
  language: tl
  text: at gumawa kayo ng mga tuwid na landas para sa inyong mga paa,[a] upang ang pilay ay hindi malihis[b] kundi sa halip ay gumaling.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Umaalingawngaw ang pananalitang ito sa Kawikaan 4:26 at ipinagpapatuloy nito ang larawan ng maingat at disiplinadong paglakad.
    reason: cross_reference
  - marker: b
    text: Maaari ring isalin na “maalis sa ayos” o “malinsad”; maaaring magkaroon ng mas medikal na diwa ang pandiwang Griyego sa loob ng larawang tumutukoy sa katawan.
    reason: lexical_alternative
lexical_decisions:
- source_word: τροχιὰς
  choice: mga landas
  rationale: Bagaman maaari itong tumukoy nang literal sa mga bakas o uka ng gulong, ang “mga landas” ang pinakanatural sa makabagong Tagalog at pinananatili ang larawan ng paraan ng paglakad o pamumuhay.
- source_word: ὀρθὰς
  choice: tuwid
  rationale: Ipinapahayag nito ang isang direkta at wastong nakaayos na daan at umaalingawngaw sa kawikaan tungkol sa pagtutuwid ng landas.
- source_word: ποιεῖτε
  choice: gumawa kayo
  rationale: Tuwiran nitong isinasalin ang pautos na anyo at inilalahad ang aktibong pananagutan ng mga kinakausap.
- source_word: τοῖς ποσὶν ὑμῶν
  choice: para sa inyong mga paa
  rationale: 'Pinananatili nito ang ugnayang nasa Griyego: ang mga landas ay ginagawa para sa mga paa, kasabay ng patuloy na larawan ng paglakad.'
- source_word: τὸ χωλὸν
  choice: ang pilay
  rationale: Pinananatili ng bahagyang bukas na pananalitang ito ang di-tiyak na saklaw ng Griyego—maaaring tumukoy sa pilay o mahinang nasa larawan—nang hindi ito nililimitahan sa isang partikular na tao o espirituwal na kahulugan.
- source_word: ἐκτραπῇ
  choice: malihis
  rationale: Malinaw nitong naihahatid ang karaniwang diwang paglihis mula sa landas; inilalagay sa talababa ang posibleng medikal na diwa ng pagkaalis sa ayos o pagkalinsad.
- source_word: ἰαθῇ
  choice: gumaling
  rationale: Natural itong katumbas ng pandiwang nangangahulugang mapagaling at pinananatili ang larawan ng katawan at pagpapanumbalik.
- source_word: μᾶλλον
  choice: kundi sa halip
  rationale: 'Malinaw nitong ipinapakita ang paghahambing ng dalawang maaaring kahinatnan: hindi paglihis kundi paggaling.'
theological_decisions:
- issue: Kung literal o metaporikal ang larawan ng pilay at paggaling
  choice: Panatilihin ang mismong larawan ng katawan nang hindi tinutukoy kung ito ay literal na kapansanan, espirituwal na kahinaan, o pangkalahatang larawan ng isang nanganganib.
  alternative: Tahasang tukuyin ang “pilay” bilang mga mananampalatayang mahina sa espirituwal.
  rationale: Hindi nililinaw ng Griyego ang tinutukoy, at ang konteksto ng pagpapayo ay gumagamit ng mga larawang may kaugnayan sa katawan at paglakad. Pinananatili ng salin ang tunay na kalabuan at tensiyon ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang maikli at masinsing anyo ng pangungusap, pati ang larawan ng landas, mga paa, pagkapilay, at paggaling. Inayos ang pagkakalagay ng mga pananda ng talababa ayon sa mismong pariralang kanilang ipinapaliwanag.
