id: HEB.12.9
reference: Hebrews 12:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἶτα τοὺς μὲν τῆς σαρκὸς ἡμῶν πατέρας εἴχομεν παιδευτὰς καὶ ἐνετρεπόμεθα· οὐ ⸀πολὺ μᾶλλον ὑποταγησόμεθα τῷ πατρὶ τῶν πνευμάτων καὶ ζήσομεν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/009.yaml
  text: Furthermore[a], we had our earthly fathers as disciplinarians, and we respected them[c][b]. Shall we not much more submit to the Father of spirits and live?
translation:
  language: tl
  text: Bukod dito, mayroon tayong mga ama nating tao[a] na nagdidisiplina sa atin[b], at iginagalang natin sila. Hindi ba lalo tayong magpapasakop sa Ama ng mga espiritu[c] at mabubuhay?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga ama ng ating laman”; ibig sabihin, ang ating mga amang tao ayon sa pisikal na pinagmulan.
    reason: lexical_alternative
  - marker: b
    text: O “mga tagapagtuwid natin.”
    reason: lexical_alternative
  - marker: c
    text: Maaaring tumukoy ang “Ama ng mga espiritu” lalo na sa Ama ng ating mga espiritu, bilang kaibahan sa ating mga amang tao; ngunit mas malawak ang pagkakasabi sa Griyego.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶτα
  choice: Bukod dito
  rationale: Nagdaragdag ito ng isa pang punto sa pangangatwirang mula sa mas maliit tungo sa mas dakila, hindi lamang ng sunod na pangyayari.
- source_word: τοὺς μὲν τῆς σαρκὸς ἡμῶν πατέρας
  choice: mga ama sa laman
  rationale: Malapit ito sa literal na 'mga ama ng ating laman' at malinaw na tumutukoy sa mga amang tao ayon sa pisikal na pinagmulan, bilang kaibahan sa Ama ng mga espiritu.
- source_word: παιδευτὰς
  choice: na nagdidisiplina sa atin
  rationale: Natural sa modernong Tagalog at pinananatili ang kaugnayan sa disiplina at pagsasanay sa buong konteksto ng Hebreo 12.
- source_word: ἐνετρεπόμεθα
  choice: iginagalang natin sila
  rationale: Ipinahahayag ang mapitagang paggalang sa mga amang nagdidisiplina nang hindi pinalalakas tungo sa takot o pangamba.
- source_word: οὐ πολὺ μᾶλλον
  choice: Hindi ba lalo tayong dapat
  rationale: Likas na Tagalog para sa retorikal na tanong at malinaw na naihahatid ang a fortiori na diin.
- source_word: ὑποταγησόμεθα
  choice: magpasakop
  rationale: Tumpak at karaniwang salitang Tagalog para sa pagpapailalim ng sarili sa awtoridad.
- source_word: τῷ πατρὶ τῶν πνευμάτων
  choice: sa Ama ng mga espiritu
  rationale: Pinananatili ang malawak at tahasang genitibong parirala ng Griyego nang hindi ito nililimitahan sa 'ating mga espiritu' lamang.
- source_word: ζήσομεν
  choice: upang tayo'y mabuhay
  rationale: Sa retorikal na pangungusap, natural nitong ipinakikita ang buhay bilang bunga o layon ng pagpapasakop, habang pinananatili ang ugnayan ng dalawang pandiwa.
theological_decisions:
- issue: Kahulugan ng 'Ama ng mga espiritu'
  choice: Ama ng mga espiritu
  alternative: Ama ng ating mga espiritu; Ama ng mga espirituwal na nilalang
  rationale: Hindi tahasang sinasabi ng Griyego na 'ating' mga espiritu. Pinananatili ng salin ang mas malawak na pahayag at ang kaibahan sa mga amang tao nang hindi nilulutas ang saklaw nito.
- issue: Ugnayan ng pagpapasakop at buhay
  choice: upang tayo'y mabuhay
  alternative: at mabubuhay tayo; at tayo'y mabuhay
  rationale: Maaaring marinig ang καὶ ζήσομεν bilang kasunod na resulta o buhay na kaugnay ng pagpapasakop. Ang 'upang' ay likas sa Tagalog sa retorikal na tanong ngunit hindi tinutukoy kung pansamantala, espirituwal, o walang hanggang buhay ang saklaw.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang 'ama sa laman' upang mapanatili ang kongkretong kaibahan ng σάρξ at πνεύματα, kalakip ang paliwanag sa talababa. Iniwasan ang 'makasalanang kalikasan,' na hindi kahulugan ng σάρξ dito.
