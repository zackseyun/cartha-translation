  naturalness: Mas natural at matatag sa modernong Filipino Tagalog ang “Ituon natin ang ating paningin,” “tagapanguna at tagapagpasakdal,” at “sa kanang bahagi ng trono ng Diyos.” Pinananatili ng “hinamak ang kahihiyan” ang marangal ngunit malinaw na rehistro.
  terminology: Ginamit ang “pananampalataya” para sa πίστις nang walang idinagdag na “ating”; nananatili sa talababa ang “katapatan” at “ating pananampalataya.” Ang “tagapanguna” at “tagapagpasakdal” ay mas tuwirang katapat ng ἀρχηγός at τελειωτής kaysa sa mga anyong pandiwa sa draft.
