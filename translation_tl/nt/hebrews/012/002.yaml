id: HEB.12.2
reference: Hebrews 12:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀφορῶντες εἰς τὸν τῆς πίστεως ἀρχηγὸν καὶ τελειωτὴν Ἰησοῦν, ὃς ἀντὶ τῆς προκειμένης αὐτῷ χαρᾶς ὑπέμεινεν σταυρὸν αἰσχύνης καταφρονήσας, ἐν δεξιᾷ τε τοῦ θρόνου τοῦ θεοῦ κεκάθικεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/002.yaml
  text: fixing our eyes on Jesus[a], the pioneer and perfecter of faith, who for the joy set before him endured the cross, despising the shame[b], and has sat down at the right hand of the throne of God.
translation:
  language: tl
  text: Ituon natin ang ating paningin kay Jesus[a], ang tagapanguna at tagapagpasakdal ng pananampalataya. Alang-alang sa kagalakang inilagay sa harap niya[c], tiniis niya ang krus, habang hinahamak ang kahihiyan[b], at naupo na siya sa kanang bahagi ng trono ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “ang tagapanguna at tagapagpasakdal ng katapatan,” o “ang tagapanguna at tagapagpasakdal ng ating pananampalataya.” Siksik ang pariralang Griyego, at ang salitang πίστις ay maaari ring mangahulugang “katapatan” o tumukoy sa pananampalataya ng mga mananampalataya.'
    reason: alternative_reading
  - marker: b
    text: 'Maaari ring isalin: “binale-wala ang kahihiyan.” Ang diwa ay itinuring niyang hindi dapat magpasiya ang kahihiyang kaakibat ng pagpapako sa krus.'
    reason: lexical_alternative
  - marker: c
    text: O, “sa halip na ang kagalakang inilagay sa harap niya.” Ang salitang Griyegong ἀντί ay maaari ring magkaroon ng kahulugang ito, bagaman sa konteksto ang pangunahing salin ay nauunawaan bilang pagtitiis alang-alang sa kagalakang nasa unahan.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀφορῶντες
  choice: Ituon natin ang ating mga mata
  rationale: Ipinahihiwatig ng participle ang paglayo ng pansin sa ibang bagay at matamang pagtitig sa isang tiyak na persona. Natural sa modernong Tagalog ang hortatoryong anyo dahil nakaugnay ito sa pangunahing panawagan sa talata 1.
- source_word: ἀρχηγὸν
  choice: ang nangunguna
  rationale: Sinasaklaw nito ang ideya ng nagpapasimula at nauuna sa landas. Mas madaling maunawaan kaysa sa literal ngunit di-karaniwang “tagapanguna,” at umaangkop sa larawan ng takbuhan.
- source_word: τελειωτὴν
  choice: nagpapasakdal
  rationale: Ipinahahayag nito ang pagdadala sa nilalayong kaganapan, hindi lamang ang pagtatapos. Pinananatili rin nito ang matibay na teolohikal na diwa nang hindi dinaragdagan ang layon na hindi tahasang sinabi sa Griyego.
- source_word: τῆς πίστεως
  choice: sa pananampalataya
  rationale: Hindi idinagdag ang “ating,” sapagkat wala ito sa Griyego. Pinananatili sa talababa ang posibilidad na tumukoy ang πίστις sa katapatan o, sa konteksto, sa pananampalataya ng mga mananampalataya.
- source_word: ἀντὶ τῆς προκειμένης αὐτῷ χαρᾶς
  choice: Dahil sa kagalakang inilagay sa harap niya
  rationale: Sa konteksto ng pagtitiis tungo sa layunin, ipinakikita nito ang kagalakan bilang inaasahang motibasyon. Ang “inilagay sa harap niya” ay nagpapanatili sa larawan ng isang layuning nasa unahan.
- source_word: ὑπέμεινεν σταυρὸν
  choice: tiniis niya ang krus
  rationale: Malinaw at likas na ipinahahayag ng “tiniis” ang matatag na pagharap sa pagdurusa; tiyak sa konteksto ang “krus” bilang krus ni Jesus.
- source_word: αἰσχύνης καταφρονήσας
  choice: hinamak ang kahihiyan
  rationale: Ang καταφρονέω ay pagtingin sa isang bagay bilang hindi karapat-dapat magpasya o pumigil. Pinananatili ng “hinamak” ang lakas ng pananalita; nililinaw sa talababa ang mas banayad na alternatibo.
- source_word: ἐν δεξιᾷ ... τοῦ θρόνου τοῦ θεοῦ
  choice: sa kanan ng trono ng Diyos
  rationale: Natural na Tagalog ito at pinananatili ang larawan ng dakilang karangalan at kapamahalaan.
- source_word: κεκάθικεν
  choice: naupo na siya
  rationale: Ang “na” ay nagpapahiwatig ng natapos na pagkilos na may nananatiling bunga, na angkop sa perfect tense ng Griyego.
theological_decisions:
- issue: Kahulugan ng τῆς πίστεως sa pariralang ἀρχηγὸν καὶ τελειωτὴν
  choice: Si Jesus ang nangunguna at nagpapasakdal sa pananampalataya.
  alternative: Si Jesus ang nangunguna at nagpapasakdal sa katapatan; o sa ating pananampalataya.
  rationale: Siksik at walang tahasang layon ang pariralang Griyego. Hindi dapat tahimik na idagdag ang “ating” o lubusang ipasiya na “katapatan” lamang ang ibig sabihin, kaya pinanatili ang ambiguity sa talababa.
- issue: Diwa ng ἀντὶ τῆς προκειμένης αὐτῷ χαρᾶς
  choice: Tiniis ni Jesus ang krus dahil sa kagalakang nasa harap niya bilang inaasahang layunin.
  alternative: Tiniis ni Jesus ang krus sa halip na piliin ang kagalakang nasa harap niya.
  rationale: Bagaman maaaring mangahulugan ang ἀντί na “sa halip na,” mas umaayon sa daloy tungkol sa pagtitiis at pag-abot sa layunin ang kagalakan bilang motibasyong nasa hinaharap.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “Ituon natin” upang likas na iugnay ang participle sa panawagan ng naunang sugnay. Iniwasan ang labis na teknikal na “tagapagtatag” o “tagapagpasakdal,” ngunit pinanatili ang teolohikal na bigat at ang tunay na ambiguity sa mga talababa.
