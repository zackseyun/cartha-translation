id: HEB.12.3
reference: Hebrews 12:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἀναλογίσασθε γὰρ τὸν τοιαύτην ὑπομεμενηκότα ὑπὸ τῶν ἁμαρτωλῶν εἰς ⸀ἑαυτοὺς ἀντιλογίαν, ἵνα μὴ κάμητε ταῖς ψυχαῖς ὑμῶν ἐκλυόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/003.yaml
  text: For consider the one who endured such opposition from sinners against himself[a], so that you may not grow weary[b], becoming discouraged in your souls.
translation:
  language: tl
  text: Pag-isipan ninyong mabuti ang nagtiis ng gayong pagsalungat ng mga makasalanan laban sa kanilang sarili,[a] upang hindi kayo mapagod at panghinaan ng loob.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ganito ang mababasa sa SBLGNT: “laban sa kanilang sarili.” Sa ilang manuskrito ay “laban sa kanyang sarili.” Sa konteksto, ang pagsalungat ay nakatuon kay Jesus.'
    reason: textual_variant
  - marker: b
    text: 'Mas literal: “upang hindi kayo mapagod habang nanghihina ang inyong kalooban.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναλογίσασθε
  choice: Pag-isipan ninyong mabuti
  rationale: Ipinahahayag ang pautos na sadyang magbulay at magsaalang-alang nang mabuti, sa natural na makabagong Tagalog.
- source_word: τοιαύτην
  choice: gayong
  rationale: Pinananatili ang malawak na diin sa uri o tindi ng pagsalungat nang hindi nililimitahan sa ‘napakatindi.’
- source_word: ὑπομεμενηκότα
  choice: ang nagtiis
  rationale: Tumutukoy sa taong matatag na dumanas ng pagsalungat; ang konteksto sa talata 2 ang kumikilala sa kanya bilang si Jesus.
- source_word: ἁμαρτωλῶν
  choice: mga makasalanan
  rationale: Tuwirang katumbas na nagpapanatili sa moral na paglalarawan ng tekstong Griyego.
- source_word: ἀντιλογίαν
  choice: pagsalungat
  rationale: Saklaw nito ang pagkontra o paghamon na dinanas ni Jesus, at hindi ito nililimitahan sa pasalitang pagtutol lamang.
- source_word: κάμητε
  choice: mapagod
  rationale: Natural na salin ng pagiging hapo o pagod sa patuloy na pagtitiis.
- source_word: ταῖς ψυχαῖς ὑμῶν ἐκλυόμενοι
  choice: panghinaan ng loob
  rationale: Karaniwang makabagong idyoma para sa panloob na panghihina o pagkawala ng tibay; inilalahad sa talababa ang mas malapit na anyo ng parirala.
theological_decisions:
- issue: Tinutukoy ng ‘ang nagtiis’
  choice: Hindi inuulit ang pangalang Jesus sa mismong talata.
  alternative: ‘si Jesus, na nagtiis’
  rationale: Malinaw na kinikilala ng Hebreo 12:2 si Jesus bilang tinutukoy, ngunit pinananatili rito ang di-tahasang pagtukoy ng Griyego.
- issue: Bilang ng reflexive pronoun sa εἰς ἑαυτούς
  choice: ‘laban sa kanilang sarili’ sa pangunahing teksto
  alternative: ‘laban sa kanyang sarili’
  rationale: Sinusunod ng pangunahing teksto ang plural na ἑαυτούς ng SBLGNT kahit mahirap ang diwa nito; hindi tahimik na pinapalitan ng kontekstuwal na singular. Inilalahad sa talababa ang mahalagang baryanteng singular at ang malinaw na kontekstuwal na direksiyon ng pagsalungat.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pangmaramihang ‘ninyo/kayo’ ayon sa Griyego. Pinanatili sa pangunahing teksto ang mahirap na plural na pagbasa ng SBLGNT at ipinaliwanag ang baryante sa talababa.
