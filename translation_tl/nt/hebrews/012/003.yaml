  source_fidelity: 'Tapat ang pangunahing teksto sa SBLGNT: pinananatili nito ang mahirap na pangmaramihang ἑαυτούς bilang “laban sa kanilang sarili,” sa halip na tahimik na gamitin ang kontekstuwal na mas madaling singular na baryant. Wasto ring naipahayag ang utos na Ἀναλογίσασθε, ang pagtitiis, ang pagsalungat mula sa mga makasalanan, at ang layuning huwag mapagod o panghinaan ng loob.'
  naturalness: Natural at malinaw ang “Pag-isipan ninyong mabuti” at “upang hindi kayo mapagod at panghinaan ng loob” sa makabagong Filipino. Ang “laban sa kanilang sarili” ay sadyang mabigat at semantikong mahirap, ngunit kinakailangan ito upang ipakita ang pagbasa ng SBLGNT; maayos itong nililinaw ng talababa.
  terminology: Ang “mga makasalanan,” “pagsalungat,” “nagtiis,” at “panghinaan ng loob” ay angkop sa marangal ngunit modernong rehistro. Hindi idinaragdag sa teksto ang pangalang Jesus, samantalang sapat na ipinaliliwanag ng talababa ang kontekstuwal na reperensiya.
