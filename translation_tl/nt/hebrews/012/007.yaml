source:
  edition: SBLGNT
  text: εἰς παιδείαν ὑπομένετε· ὡς υἱοῖς ὑμῖν προσφέρεται ὁ θεός· τίς ⸀γὰρ υἱὸς ὃν οὐ παιδεύει πατήρ;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/007.yaml
  text: Endure for discipline[a]; God is dealing with you as with sons[b]. For what son is there whom a father does not discipline?
translation:
  language: tl
  text: Magtiis kayo para sa pagdidisiplina[a]. Tinatrato kayo ng Diyos bilang mga anak na lalaki[b]. Sapagkat sinong anak na lalaki ang hindi dinidisiplina ng ama?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Tiisin ninyo ito bilang pagdidisiplina.” Maaaring unawain ang Griyego bilang panawagang magtiis alang-alang sa pagdidisiplina o ituring na pagdidisiplina ang dinaranas.
    reason: alternative_reading
  - marker: b
    text: Sa Griyego, “mga anak na lalaki.” Sinasalamin ng katawagan ang paghahambing ng ama at anak na lalaki sa pangangatwiran; hindi lamang mga lalaki ang saklaw ng aplikasyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς παιδείαν
  choice: para sa pagdidisiplina
  rationale: Pinananatili nito ang posibleng layon o bunga ng εἰς habang ipinapahayag ang mapaghubog at mapagtuwid na diwa ng παιδεία. Nananatili sa talababa ang maaari ring pagbasa na ang dinaranas ay ituring na pagdidisiplina.
- source_word: ὑπομένετε
  choice: Magtiis kayo
  rationale: Maaaring anyong paturol o pautos ang pandiwa, ngunit sa konteksto ay likas itong gumaganap bilang panawagan. Hindi dinagdagan ng tahasang layon na wala sa Griyego.
- source_word: ὡς υἱοῖς
  choice: bilang mga anak na lalaki
  rationale: Pinananatili ang paghahambing at ang tahasang talinghagang ama–anak na lalaki sa argumento, sa halip na gawing walang kasarian ang larawan.
- source_word: προσφέρεται
  choice: Tinatrato kayo
  rationale: Likas na Filipino para sa idyomatikong diwang kumikilos o nakikitungo ang Diyos sa kanila sa isang partikular na paraan.
- source_word: τίς γὰρ υἱὸς ὃν οὐ παιδεύει πατήρ
  choice: Sapagkat sinong anak na lalaki ang hindi dinidisiplina ng kanyang ama?
  rationale: Pinananatili ang retorikal na tanong at ang leksikal na ugnayan ng παιδεία at παιδεύει sa pamamagitan ng pagdidisiplina/dinidisiplina. Ang 'kanyang ama' ay likas sa Filipino at ipinahihiwatig ng relasyong inilalarawan.
theological_decisions:
- issue: Wikang pampamilya na may tiyak na kasarian sa paghahambing ng ama at anak na lalaki
  choice: Panatilihin ang “mga anak na lalaki” sa pangunahing teksto
  alternative: mga anak
  rationale: Tahasang υἱοί ang ginamit at nakasalalay ang pangangatwiran sa larawan ng ama at mga anak na lalaki. Nililinaw sa talababa na hindi lamang mga lalaki ang saklaw ng aplikasyon.
- issue: Ugnayan ng pagtitiis at pagdidisiplina
  choice: “Magtiis kayo para sa pagdidisiplina” na may alternatibo sa talababa
  alternative: “Tiisin ninyo ito bilang pagdidisiplina”
  rationale: Ang εἰς παιδείαν ay maaaring unawain bilang layon/bunga o bilang pagtingin sa dinaranas na isang pagdidisiplina. Hindi dapat tahimik na alisin ang tunay na kalabuan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “pagdidisiplina” upang mapanatili ang mapagtuwid at mapaghubog na diwa at ang pag-uulit ng magkaugat na mga salitang Griyego. Ang “anak na lalaki” ay sadyang pinanatili para sa tiyak na larawang pampamilya ng talata.
