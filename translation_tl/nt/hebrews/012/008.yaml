  text: εἰ δὲ χωρίς ἐστε παιδείας ἧς μέτοχοι γεγόνασι πάντες, ἄρα νόθοι ⸂καὶ οὐχ υἱοί ἐστε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/008.yaml
  text: But if you are without discipline, of which all have become sharers, then you are illegitimate children and not sons.
translation:
  language: tl
  text: Ngunit kung hindi kayo dinidisiplina, ng pagdidisiplina na naranasan ng lahat, kung gayon, kayo ay mga anak sa labas at hindi mga anak na lalaki.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδείας
  choice: pagdidisiplina
  rationale: Sa konteksto, tumutukoy ito sa mapagtuwid na pagsasanay ng isang magulang, hindi lamang sa parusa o pangkalahatang edukasyon.
- source_word: μέτοχοι γεγόνασι
  choice: tinatanggap
  rationale: Natural na ipinahahayag sa Filipino ang pakikibahagi ng lahat sa pagdidisiplina; iniiwasan ang masalimuot na literal na 'naging mga kabahagi.'
- source_word: νόθοι
  choice: mga anak sa labas
  rationale: Tuwirang modernong katumbas para sa mga anak na ipinanganak sa labas ng kinikilalang pag-aasawa; hindi ginagamit ang mapanlait at lipas na 'bastardo.'
- source_word: υἱοί
  choice: tunay na mga anak
  rationale: Bagaman literal na 'mga anak na lalaki,' ang paghahambing ay tungkol sa lehitimong katayuan sa pamilya. Ang 'mga anak' ay natural at saklaw ang kausap, habang nililinaw ng 'tunay' ang ipinahihiwatig na pagkilala bilang anak.
theological_decisions:
- issue: Saklaw ng πάντες ('lahat')
  choice: Pinanatiling 'lahat' nang walang idinagdag na tahasang tinutukoy.
  alternative: Lahat ng anak ng Diyos / lahat ng tunay na anak
  rationale: Hindi tahasang inuulit ng Griyego ang pangngalan; hinahayaan ng salin na ang konteksto ang magtakda sa saklaw nito.
- issue: Ugnayan ng pagdidisiplina at pagiging anak
  choice: Pinanatili bilang kondisyong paghahambing, hindi bilang sistematikong pahayag tungkol sa kaligtasan.
  alternative: Kung hindi kayo dinidisiplina, hindi kayo ligtas o hindi kayo anak ng Diyos
  rationale: Mas tiyak ang ganitong alternatibo kaysa sa mismong talata at nilulutas nito ang teolohikal na tensiyong sadyang matindi sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'kayo ay' upang panatilihin ang mariing konklusyon ng ἄρα, at iniwasan ang teknikal o mapanlait na bokabularyo.
