  text: Οὐ γὰρ προσεληλύθατε ⸀ψηλαφωμένῳ καὶ κεκαυμένῳ πυρὶ καὶ γνόφῳ καὶ ⸀ζόφῳ καὶ θυέλλῃ
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/018.yaml
  text: For you have not come to what can be touched[a], and to a blazing fire, and to darkness and gloom and storm[b],
translation:
  language: tl
  text: Sapagkat hindi kayo lumapit sa bagay na maaaring hipuin, sa naglalagablab na apoy, sa makapal na dilim, sa pusikit na kadiliman, at sa unos,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐ γὰρ
  choice: Sapagkat hindi
  rationale: Pinananatili ng “sapagkat” ang paliwanag na ugnayan ng γάρ sa naunang pangangatwiran, at tuwirang ipinahahayag ng “hindi” ang negasyon.
- source_word: προσεληλύθατε
  choice: kayo lumapit
  rationale: Ang perpektong anyo ay nagpapahiwatig ng paglapit na may nananatiling resulta. Likas sa Tagalog ang “lumapit” at pinananatili nito ang larawan ng paglapit sa presensiya o lugar.
- source_word: ψηλαφωμένῳ
  choice: sa nahihipo
  rationale: Ang substantibong “nahihipo” ay nagpapahayag ng isang bagay na maaaring hipuin nang hindi nagdaragdag ng pangngalang “bundok,” na wala sa tekstong Griyego ng talatang ito.
- source_word: κεκαυμένῳ πυρί
  choice: sa naglalagablab na apoy
  rationale: Ipinahahayag nito ang apoy na nasa patuloy at matinding kalagayan ng pagliyab, sa natural at malinaw na modernong Tagalog.
- source_word: γνόφῳ
  choice: sa makapal na dilim
  rationale: Ang γνόφος ay tumutukoy sa makapal o matinding dilim. Ginamit ang “makapal” upang maiba ito sa kasunod na malapit ang kahulugang salita.
- source_word: ζόφῳ
  choice: pusikit na kadiliman
  rationale: Ang ζόφος ay madilim at nakapanghihilakbot na kadiliman. Ang “pusikit na kadiliman” ay nagpapanatili sa retorikal na pag-iipon ng magkakaugnay na larawan nang hindi ito ipinapareho sa γνόφος.
- source_word: θυέλλῃ
  choice: unos
  rationale: Ang θύελλα ay isang marahas na bagyo o tempest. Ang “unos” ay maikli, marangal, at pamilyar sa modernong mambabasa.
theological_decisions:
- issue: Kung idaragdag ang “bundok” bilang nilapitan
  choice: Hindi idinagdag ang “bundok” sa pangunahing teksto; pinanatiling di-tiyak ang nahihipong bagay.
  alternative: “sa bundok na nahihipo”
  rationale: Bagaman malinaw sa nakapaligid na konteksto na Bundok Sinai ang tinutukoy, walang ὄρος (“bundok”) sa Griyego ng talatang ito. Pinananatili ng salin ang di-tiyak na anyo ng pinagmulan, samantalang nililinaw ng talababa ang ipinahihiwatig ng konteksto.
- issue: Pagkakaugnay ng mga pariralang may καί
  choice: Isinalin ang paulit-ulit na καί bilang magkakasunod na “at,” na saklaw ng unang “hindi.”
  alternative: Ulitin ang “ni” bago ang bawat kasunod na parirala.
  rationale: Mas malapit ang magkakasunod na “at” sa pormal na pag-iipon ng mga larawan sa Griyego, habang malinaw pa ring saklaw ng negasyon ang buong talaan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal. Pinanatili ang mahabang retorikal na talaan at ang pagkakaiba ng dalawang magkakalapit na salita para sa dilim. Ginamit ang “unos” bilang madaling maunawaang salitang pampanitikan nang hindi nagiging lipas.
