  text: καί, οὕτω φοβερὸν ἦν τὸ φανταζόμενον, Μωϋσῆς εἶπεν· Ἔκφοβός εἰμι καὶ ἔντρομος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/021.yaml
  text: And so terrifying was the sight that Moses said[b][a], “I am fearful and trembling.”
translation:
  language: tl
  text: At gayon na lamang nakapangingilabot ang tanawing iyon[a] kaya sinabi ni Moises[b], “Takot na takot ako at nanginginig.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang lumitaw” o “ang nakitang pangyayari.” Ang pananalitang Griyego ay tumutukoy sa nakikitang pagpapakita sa Sinai.
    reason: lexical_alternative
  - marker: b
    text: Ang mga salitang ito ay hindi eksaktong sipi mula sa Lumang Tipan, ngunit inilalarawan nito ang takot ni Moises na kaugnay ng pangyayari sa Sinai; ihambing sa Deuteronomio 9:19.
    reason: cross_reference
lexical_decisions:
- source_word: καί
  choice: At
  rationale: Nag-uugnay sa talata sa naunang paglalarawan ng Sinai.
- source_word: οὕτω φοβερὸν ἦν
  choice: napakakilabot
  rationale: Likas na ipinahahayag sa modernong Tagalog ang matinding antas ng sindak na tinutukoy ng οὕτω at φοβερόν.
- source_word: τὸ φανταζόμενον
  choice: ang tanawing iyon
  rationale: Tumutukoy sa nakikitang pagpapakita o pangyayari sa Sinai; malinaw at natural ang “tanawin” habang pinananatili sa talababa ang mga posibleng kahulugan.
- source_word: Μωϋσῆς εἶπεν
  choice: sinabi ni Moises
  rationale: Tuwirang salin ng payak na pandiwa ng pagsasalita at ng pangalan.
- source_word: Ἔκφοβός εἰμι
  choice: Takot na takot ako
  rationale: Ipinahahayag ang matinding takot ng ἔκφοβος nang natural at mariin.
- source_word: καὶ ἔντρομος
  choice: at nanginginig
  rationale: Pinananatiling hiwalay ang pisikal na panginginig na idinaragdag ng ἔντρομος sa matinding takot.
theological_decisions:
- issue: Kaugnayan ng sinabi ni Moises sa salaysay tungkol sa Sinai
  choice: Tuwirang ihayag sa pangunahing teksto na sinabi ito ni Moises bilang tugon sa nakapangingilabot na pagpapakita sa Sinai.
  alternative: Ituring sa pangunahing teksto ang mga salita bilang malayang buod lamang ng takot ni Moises mula sa tradisyon ng Sinai.
  rationale: Iniuugnay mismo ng Griyegong teksto kay Moises ang pahayag. Hindi dapat lutasin sa pangunahing teksto ang tanong kung saan eksaktong nagmula ang mga salita; nililinaw ito sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “napakakilabot” para sa matinding puwersa ng φοβερόν, at pinanatiling magkahiwalay ang “takot na takot” at “nanginginig” upang maipakita ang dalawang salitang Griyego.
