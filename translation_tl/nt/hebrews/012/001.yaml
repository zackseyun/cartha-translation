id: HEB.12.1
reference: Hebrews 12:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Τοιγαροῦν καὶ ἡμεῖς, τοσοῦτον ἔχοντες περικείμενον ἡμῖν νέφος μαρτύρων, ὄγκον ἀποθέμενοι πάντα καὶ τὴν εὐπερίστατον ἁμαρτίαν, δι’ ὑπομονῆς τρέχωμεν τὸν προκείμενον ἡμῖν ἀγῶνα,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/001.yaml
  text: Therefore[a], since we also have so great a cloud of witnesses surrounding us, laying aside every weight and the sin that so easily entangles, let us run with endurance the race set before us,
translation:
  language: tl
  text: Kaya nga, yamang napalilibutan din tayo ng napakalaking ulap ng mga saksi na nakapaligid sa atin, iwaksi natin ang bawat pabigat at ang kasalanang madaling bumibitag[a], at takbuhin natin nang may pagtitiis ang karerang nakalaan sa harap natin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ang kasalanang mahigpit na kumakapit” o “ang kasalanang madaling sumasilo.” Bihira ang pang-uring Griyego at maaaring idiin ang pagbitag, pagkakasilo, o mahigpit na pagkapit.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοιγαροῦν
  choice: Kaya nga
  rationale: Likas na panandang naghihinuha ng konklusyon mula sa naunang paglalahad, lalo na sa kabanata 11.
- source_word: τοσοῦτον ... νέφος μαρτύρων
  choice: napakalaking ulap ng mga saksi
  rationale: Pinananatili ang matingkad na metapora ng napakaraming saksi at ang diin ng τοσοῦτον.
- source_word: περικείμενον ἡμῖν
  choice: napalilibutan din tayo
  rationale: Malinaw at natural na ipinahahayag na ang mga saksi ay nasa buong paligid, nang hindi dinaragdagan ang ideya na sila ay mga tagapanood.
- source_word: μάρτυρων
  choice: mga saksi
  rationale: Pinananatili ang lawak ng salitang maaaring tumukoy sa mga nagpapatotoo; hindi ipinapasok sa salin ang mas tiyak ngunit di-tiyak na pagbasa na sila ay nanonood mula sa langit.
- source_word: ὄγκον πάντα
  choice: bawat pabigat
  rationale: Ipinahahayag ang anumang bigat o sagabal na nagpapabagal sa mananakbo at nananatiling natural sa modernong Tagalog.
- source_word: ἀποθέμενοι
  choice: iwaksi natin
  rationale: Iniaangkop ang participle sa pangunahing panawagan upang maging malinaw at likas sa Tagalog ang tiyak na pag-aalis ng mga sagabal.
- source_word: εὐπερίστατον
  choice: napakadaling pumigil sa atin
  rationale: Ipinahahayag ang epekto nito sa larawan ng pagtakbo nang hindi kunwaring tiyak ang pambihira at pinagtatalunang salita; inilalahad sa talababa ang ibang posibleng diwa.
- source_word: ἁμαρτίαν
  choice: ang kasalanan
  rationale: Pinananatili ang tiyak na anyo ng Griyego nang hindi tinutukoy kung anong partikular na kasalanan iyon.
- source_word: δι’ ὑπομονῆς
  choice: nang may pagtitiis
  rationale: Ipinahahayag ang matatag at nagpapatuloy na pagtitiis sa gitna ng hirap.
- source_word: τρέχωμεν
  choice: takbuhin natin
  rationale: Natural na panawagang first-person plural sa Tagalog at pinananatili ang larawan ng pagtakbo.
- source_word: τὸν προκείμενον ἡμῖν ἀγῶνα
  choice: ang takbuhing inilagay sa harap natin
  rationale: Dahil sa tahasang pandiwang 'tumakbo,' ang 'takbuhin' ang pinakamalinaw na kontekstuwal na diwa ng ἀγών; pinananatili rin ang ideya ng landasing nakalaan sa harap natin.
theological_decisions:
- issue: Diwa ng “mga saksi” kaugnay ng Hebreo 11
  choice: Mga taong ang buhay ay nagpapatotoo sa pananampalataya, habang nananatili ang larawang nakapaligid sila sa atin
  alternative: Pangunahin silang mga makalangit na tagapanood na nagmamasid sa mga mananampalataya
  rationale: Itinuturo ng agarang konteksto ang mga halimbawa sa kabanata 11. Ang saling “mga saksi” ay hindi nagpapasya kung sila rin ay aktuwal na nanonood, kaya napapanatili ang interpretatibo at teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang mga larawang “ulap,” “pabigat,” at “takbuhin,” habang iniwasan ang sobrang literal na ayos na magiging asiwa sa Tagalog.
