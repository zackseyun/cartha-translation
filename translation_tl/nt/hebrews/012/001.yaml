revisions:
- from: Kaya nga, yamang napalilibutan din tayo ng napakalaking ulap ng mga saksi, iwaksi natin ang bawat pabigat at ang kasalanang napakadaling pumigil sa atin[a], at takbuhin natin nang may pagtitiis ang takbuhing inilagay sa harap natin.
  to: Kaya nga, yamang napalilibutan din tayo ng napakalaking ulap ng mga saksi na nakapaligid sa atin, iwaksi natin ang bawat pabigat at ang kasalanang madaling bumibitag[a], at takbuhin natin nang may pagtitiis ang karerang nakalaan sa harap natin.
  rationale: Binago ang pangunahing salin ng εὐπερίστατον upang panatilihin ang larawang pagkakabigat o pagkakasilo sa mananakbo, nang hindi inaangking tiyak ang kahulugan ng pambihirang salitang Griyego. Inayos din ang parirala para sa “surrounding us” at ang katumbas ng ἀγών upang maging mas natural sa modernong Tagalog. Hindi binabago ng rebisyon ang bukas na interpretasyon ng “mga saksi.”
