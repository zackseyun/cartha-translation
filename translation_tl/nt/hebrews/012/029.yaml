id: HEB.12.29
reference: Hebrews 12:29
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ γὰρ ὁ θεὸς ἡμῶν πῦρ καταναλίσκον.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/029.yaml
  text: For our God is a consuming fire[a][b].
translation:
  language: tl
  text: Sapagkat ang Diyos natin ay apoy na tumutupok.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Umaalingawngaw rito ang Deuteronomio 4:24, kung saan inilalarawan ang Diyos bilang “apoy na tumutupok.”
    reason: cross_reference
  - marker: b
    text: Maaari ring isalin na “apoy na lumalamon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Sapagkat
  rationale: Ipinahahayag ng γὰρ ang paliwanag o dahilan na kaugnay ng naunang babala; likas na isinasalin ito bilang “Sapagkat” sa Filipino. Hindi na hiwalay na isinalin ang καὶ upang maiwasan ang pilit na pagkakabuo.
- source_word: ὁ θεὸς ἡμῶν
  choice: ang Diyos natin
  rationale: Likas at malinaw na anyong paari sa modernong Filipino, habang pinananatili ang sama-samang diwa ng “ating Diyos.”
- source_word: πῦρ
  choice: apoy
  rationale: Tuwirang salin na nagpapanatili sa matinding metapora at sa alusyon sa Deuteronomio 4:24.
- source_word: καταναλίσκον
  choice: na tumutupok
  rationale: Ipinapakita ng pariralang ito ang aktibong bisa ng kasalukuyang pandiwaring Griyego at natural itong pakinggan sa Filipino. Hindi nito nililimitahan ang larawan sa pisikal na pagsunog lamang.
theological_decisions:
- issue: Metaporikong paglalarawan sa Diyos bilang apoy
  choice: 'Panatilihin nang tuwiran: “ang Diyos natin ay apoy na tumutupok”'
  alternative: “ang Diyos natin ay tulad ng apoy na tumutupok”
  rationale: Walang panandang paghahambing sa Griyego. Pinananatili ng tuwirang pahayag ang lakas at tensiyon ng metapora, ang konteksto ng babala, at ang ugnayan sa Deuteronomio 4:24 nang hindi ito pinahihinang gawing pagtutulad.
translation_notes:
  register: Modernong Filipino Tagalog na maikli, marangal, at madaling maunawaan. Pinili ang “Diyos natin” kaysa “ating Diyos” dahil mas natural sa karaniwang pananalita, ngunit nananatiling angkop sa banal na kasulatan. Ang “tumutupok” ay nagpapanatili sa tradisyonal na biblikal na larawan habang nauunawaan pa rin ng modernong mambabasa.
