id: JUD.1.12
reference: Jude 1:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὗτοί εἰσιν ⸀οἱ ἐν ταῖς ἀγάπαις ὑμῶν σπιλάδες συνευωχούμενοι, ἀφόβως ἑαυτοὺς ποιμαίνοντες, νεφέλαι ἄνυδροι ὑπὸ ἀνέμων παραφερόμεναι, δένδρα φθινοπωρινὰ ἄκαρπα δὶς ἀποθανόντα ἐκριζωθέντα,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/012.yaml
  text: These are hidden reefs at your love feasts[a], feasting together without fear, shepherding themselves; waterless clouds carried along by winds; autumn trees without fruit, twice dead[c][b], uprooted.
translation:
  language: tl
  text: Ang mga taong ito ay mga nakatagong bahura sa inyong mga piging ng pag-ibig[a]. Nakikipagpiging sila nang walang takot, at sarili nila ang pinapastol[b]. Para silang mga ulap na walang tubig, na tinatangay ng mga hangin; mga punong walang bunga sa taglagas—dalawang beses nang patay[c] at nabunot pati ang mga ugat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga dungis” o “mga batik” sa inyong mga piging ng pag-ibig. Maaaring moral ang diwa ng salitang Griyego, ngunit maaari rin itong tumukoy sa mapanganib na mga bahura; ang huli ay angkop sa sunod-sunod na matitingkad na larawan ni Judas.
    reason: alternative_reading
  - marker: b
    text: Ang “sarili nila ang pinapastol” ay maaari ring isaling “sarili nila ang pinakakain,” na nagdiriin sa kanilang makasariling asal. Ihambing ang Ezekiel 34, tungkol sa mga pastol na sarili ang pinakakain sa halip na ang kawan.
    reason: lexical_alternative_and_cross_reference
  - marker: c
    text: Sa literal, “makalawang patay.” Hindi ipinaliliwanag dito ni Judas kung sa anong dalawang paraan sila patay; pinalalakas pa ng kasunod na “nabunot pati ang mga ugat” ang larawan ng ganap na kawalan ng buhay.
    reason: clarification
lexical_decisions:
- source_word: σπιλάδες
  choice: mga nakatagong bahura
  rationale: Pinananatili ang larawan ng lingid at mapanganib na mga bahura sa gitna ng sunod-sunod na matitingkad na metapora; inilalahad sa talababa ang posibleng kahulugang moral na “mga dungis” o “mga batik.”
- source_word: ἀγάπαις
  choice: mga piging ng pag-ibig
  rationale: Ang pangmaramihang anyo ay tumutukoy sa sama-samang kainan ng mga mananampalataya; pinananatili rin nito ang tuwirang ugnayan sa salitang “pag-ibig.”
- source_word: συνευωχούμενοι
  choice: nakikipagpiging
  rationale: Likas na ipinahahayag sa Tagalog ang pakikibahagi nila sa sama-samang piging nang hindi nagdaragdag ng tahasang “sa inyo,” na wala sa pandiwari.
- source_word: ἀφόβως
  choice: walang takot
  rationale: Pinananatili ang kalabuan kung ito ay kawalan ng pangamba, pagpipigil, o paggalang, sa halip na pumili ng mas makitid na paliwanag.
- source_word: ἑαυτοὺς ποιμαίνοντες
  choice: sarili lamang nila ang pinapastol
  rationale: Pinananatili ang metapora ng pagpapastol at malinaw na ipinakikita ang pansariling tunguhin; ang posibleng “sarili lamang nila ang pinakakain” ay inilalagay sa talababa.
- source_word: νεφέλαι ἄνυδροι
  choice: mga ulap na walang tubig
  rationale: Kongkreto at madaling maunawaang larawan na tapat sa Griyego at nagpapahiwatig ng pangakong walang naibibigay.
- source_word: παραφερόμεναι
  choice: tinatangay
  rationale: Natural na Tagalog para sa pasibong pagdadala ng panlabas na puwersa, dito ay ng mga hangin.
- source_word: δένδρα φθινοπωρινὰ ἄκαρπα
  choice: mga punong walang bunga sa taglagas
  rationale: Iniuugnay nang malinaw ang kawalan ng bunga sa panahong taglagas habang pinananatiling kongkreto ang larawan.
- source_word: δὶς ἀποθανόντα
  choice: makalawang patay
  rationale: Pinananatili ang matindi at sadyang palaisipang pananalita ng orihinal sa halip na ipakahulugang “lubusang patay.”
- source_word: ἐκριζωθέντα
  choice: nabunot pati ang mga ugat
  rationale: Mas natural at malinaw sa karaniwang Tagalog kaysa sa literal na “nabunot,” at ipinakikita ang ganap na pagkakahiwalay sa pinagmumulan ng buhay.
theological_decisions:
- issue: Kahulugan ng σπιλάδες kaugnay ng mga taong tinutuligsa
  choice: mga nakatagong bahura na lihim na panganib sa sama-samang piging
  alternative: mga dungis o mga batik sa mga piging ng pag-ibig
  rationale: Ang “mga nakatagong bahura” ay umaangkop sa hanay ng mga metapora ng kalikasan at sa ideya ng lingid na panganib. Gayunman, tunay na posibilidad ang moral na kahulugang “mga dungis/batik,” kaya pinananatili ito sa talababa.
- issue: Diwa ng ποιμαίνοντες sa ἑαυτοὺς ποιμαίνοντες
  choice: pinanatili ang metapora ng pagpapastol
  alternative: sarili lamang nila ang pinakakain
  rationale: Karaniwang nangangahulugang “magpastol” ang pandiwa at nagpapahintulot ng ugnayan sa Ezekiel 34. Posible rin ang diwang pagpapakain, ngunit mas mabilis nitong nililimitahan ang larawan.
- issue: Diwa ng “makalawang patay”
  choice: pinanatili ang retorikal na pariralang walang pagpapaliwanag sa pangunahing teksto
  alternative: lubusang patay
  rationale: Hindi tahasang nilulutas ng Griyego kung paano binibilang ang dalawang kamatayan; dapat mapanatili ang teolohikal at retorikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “piging ng pag-ibig” bilang tiyak na katawagan sa sama-samang kainan ng mga mananampalataya. Pinanatili ang magkakasunod na metapora at ang matinding pariralang “makalawang patay,” habang ang mga tunay na alternatibong leksikal ay inilagay sa mga talababa.
