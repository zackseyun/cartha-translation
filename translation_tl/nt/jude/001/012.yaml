revisions:
- from: Ang mga taong ito ay mga nakatagong bahura sa inyong mga piging ng pag-ibig[a]. Walang takot silang nakikipagpiging at sarili lamang nila ang pinapastol[b]. Para silang mga ulap na walang tubig, na tinatangay ng mga hangin; mga punong walang bunga sa taglagas—makalawang patay[c] at nabunot pati ang mga ugat.
  to: Ang mga taong ito ay mga nakatagong bahura sa inyong mga piging ng pag-ibig[a]. Nakikipagpiging sila nang walang takot, at sarili nila ang pinapastol[b]. Para silang mga ulap na walang tubig, na tinatangay ng mga hangin; mga punong walang bunga sa taglagas—dalawang beses nang patay[c] at nabunot pati ang mga ugat.
  rationale: Inayos ang dalawang pananalitang hindi pinakamakinis sa modernong Filipino Tagalog. Inalis ang hindi kinakailangang dagdag na "lamang" upang hindi lumampas sa reflexive na ἑαυτούς. Pinalitan ang "makalawang patay" ng mas natural na "dalawang beses nang patay," ngunit iniwan sa talababa ang literal na anyo at hindi binigyan ng doktrinal o interpretatibong paliwanag ang "twice dead." Inayos din ang pagkakasunod ng unang sugnay para sa mas likas na daloy at nilinaw ang saklaw ng mga panipi sa talababa a.
