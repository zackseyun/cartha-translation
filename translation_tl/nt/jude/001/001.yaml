id: JUD.1.1
reference: Jude 1:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἰούδας Ἰησοῦ Χριστοῦ δοῦλος, ἀδελφὸς δὲ Ἰακώβου, τοῖς ἐν θεῷ πατρὶ ⸀ἠγαπημένοις καὶ Ἰησοῦ Χριστῷ τετηρημένοις κλητοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/001.yaml
  text: 'Jude[a], a servant of Jesus the Messiah and brother of James, to those who are loved in God the Father and kept for Jesus the Messiah[c][b], called:'
translation:
  language: tl
  text: Si Judas,[a] na alipin ni Jesu-Cristo at kapatid ni Santiago, sa mga tinawag, minamahal sa Diyos na Ama[c], at iniingatan para kay Jesu-Cristo:[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pangalang Griyego ay maaari ring isulat na “Jude,” ayon sa kombensiyong ginagamit sa ilang wika upang maipakitang hindi ito si Judas Iscariote.
    reason: name_rendering
  - marker: b
    text: O “iniingatan ni Jesu-Cristo.” Maaaring ipahiwatig ng datibong Griyego ang gumagawa ng pag-iingat (“ni”) o ang pinag-uukulan nito (“para kay”).
    reason: alternative_reading
  - marker: c
    text: May ilang manuskritong “ginawang banal sa Diyos na Ama” sa halip na “minamahal sa Diyos na Ama.”
    reason: textual_variant
lexical_decisions:
- source_word: Ἰούδας
  choice: Judas
  rationale: Ang karaniwang anyong Tagalog ng pangalang Ἰούδας ay “Judas.” Hindi kailangang gamitin ang kombensiyong Ingles na “Jude,” at nililinaw naman ng talata ang pagkakakilanlan ng may-akda.
- source_word: δοῦλος
  choice: alipin
  rationale: Tuwirang ipinahahayag ng “alipin” ang nakataling paglilingkod at lubos na pag-aari o katapatan na nasa δοῦλος; mas matindi ito kaysa “lingkod.”
- source_word: Χριστοῦ / Χριστῷ
  choice: Cristo
  rationale: Sa modernong Tagalog, kinikilala ang “Cristo” bilang titulong katumbas ng Mesiyas at bahagi ng nakaugaliang anyong “Jesu-Cristo,” nang hindi ito tinatratong karaniwang apelyido.
- source_word: ἀδελφὸς δὲ Ἰακώβου
  choice: at kapatid ni Santiago
  rationale: Mahinang pang-ugnay ang δέ rito, kaya natural ang “at.” Ang “kapatid ni Santiago” ay malinaw at hindi nagdaragdag ng tiyak na artikulong wala sa Griyego.
- source_word: ἐν θεῷ πατρὶ
  choice: sa Diyos Ama
  rationale: Pinananatili ng “sa” ang malawak na saklaw ng ἐν bilang kalagayan o esfera ng pag-ibig, sa halip na tukuying ang kahulugan ay simpleng ahensiyang “ng Diyos Ama.”
- source_word: ἠγαπημένοις
  choice: minamahal
  rationale: Ipinahahayag nito ang patuloy at nananatiling kalagayang bunga ng pag-ibig ng Diyos, at natural ito sa kasalukuyang Tagalog.
- source_word: τετηρημένοις
  choice: iniingatan para kay
  rationale: Ipinahahayag ng “iniingatan” ang nagpatuloy na kalagayan ng pag-iingat. Ang “para kay” ang pangunahing basa sa datibong Ἰησοῦ Χριστῷ, habang inilalagay sa talababa ang tunay na posibilidad na si Cristo ang gumagawa ng pag-iingat.
- source_word: κλητοῖς
  choice: mga tinawag
  rationale: Ginagamit ang pang-uri bilang pangngalan para sa mga tumanggap ng liham. Ang “mga tinawag” ay natural sa Tagalog at pinananatili ang teolohikal na bigat ng pagtawag.
theological_decisions:
- issue: Kaugnayan ng τετηρημένοις sa Ἰησοῦ Χριστῷ
  choice: iniingatan para kay Jesu-Cristo
  alternative: iniingatan ni Jesu-Cristo
  rationale: Maaaring ipahiwatig ng datibo ang layon o kapakinabangan (“para kay”) o ang gumagawa (“ni”). Pinili sa teksto ang unang basa ngunit pinanatili sa talababa ang tunay na sintaktikong kalabuan.
- issue: Basa sa ἠγαπημένοις
  choice: minamahal
  alternative: ginawang banal
  rationale: Sinusunod ng pangunahing teksto ang SBLGNT na ἠγαπημένοις. Mahalaga ang variant na ἡγιασμένοις sa ilang manuskrito kaya itinala ito nang hindi isinasama sa pangunahing teksto.
- issue: Ugnayang gramatikal ng κλητοῖς
  choice: “mga tinawag” bilang pangunahing katawagan sa mga tatanggap
  alternative: “at tinawag” bilang ikatlong magkahanay na paglalarawan
  rationale: Sa Griyego, ang κλητοῖς ay pang-uring substantibo na kasunod ng artikulong τοῖς, samantalang inilalarawan pa ang mga tinawag ng dalawang participle. Ang ayos na “sa mga tinawag, minamahal… at iniingatan…” ay natural sa Tagalog at tapat sa kayarian.
translation_notes:
  register: Modernong, marangal, at madaling maunawaang Tagalog. Ginamit ang “alipin” upang mapanatili ang lakas ng δοῦλος, at inayos ang mga parirala ayon sa natural na daloy ng Tagalog habang pinananatili ang kalabuan ng datibo at ang mahalagang variant ng teksto.
