id: JUD.1.17
reference: Jude 1:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ὑμεῖς δέ, ἀγαπητοί, μνήσθητε τῶν ῥημάτων τῶν προειρημένων ὑπὸ τῶν ἀποστόλων τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/017.yaml
  text: But you[a], beloved, remember the words spoken beforehand by the apostles of our Lord Jesus the Messiah.
translation:
  language: tl
  text: Ngunit kayo, mga minamahal, alalahanin ninyo ang mga salitang nauna nang sinabi ng mga apostol ng ating Panginoong Jesus na Mesiyas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “Jesucristo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς δέ
  choice: Ngunit kayo
  rationale: Pinananatili ang pagsalungat ng δέ at ang diin sa Ὑμεῖς, habang likas pa rin sa makabagong Filipino.
- source_word: ἀγαπητοί
  choice: mga minamahal
  rationale: Isang magiliw na pantawag sa maramihan na nagpapanatili ng init at marangal na himig ng liham.
- source_word: μνήσθητε
  choice: alalahanin ninyo
  rationale: Tuwirang pautos na tumutukoy sa muling paggunita sa naituro na sa kanila.
- source_word: τῶν ῥημάτων τῶν προειρημένων
  choice: ang mga salitang nauna nang sinabi
  rationale: Ipinahahayag ang mga binigkas na pahayag at ang temporal na diwa ng προειρημένων nang hindi ito nililimitahan sa hulang panghinaharap.
- source_word: ὑπὸ τῶν ἀποστόλων
  choice: ng mga apostol
  rationale: Ang “apostol” ang kinikilalang salin sa Bagong Tipan at angkop sa mga awtorisadong saksi at sugo na tinutukoy rito.
- source_word: τοῦ κυρίου ἡμῶν
  choice: ng ating Panginoon
  rationale: Pinananatili ang ugnayang genitibo ng mga apostol sa kanilang Panginoon at ang nakaugaliang marangal na katawagan.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus na Mesiyas
  rationale: Isinasalin ang Χριστός bilang titulong “Mesiyas” at ginagamit ang “na” upang maging malinaw at likas sa Filipino na ito ay titulo ni Jesus.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστοῦ sa Ἰησοῦ Χριστοῦ
  choice: Mesiyas
  alternative: Cristo
  rationale: Pinananatili ng “Mesiyas” ang kahulugan ng titulong Χριστός sa halip na magmukha itong apelyido; inilalagay sa talababa ang tradisyonal na “Cristo” upang mapanatili ang lehitimong alternatibo at pamilyar na anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ang “mga minamahal” ay nagpapanatili ng mapagmahal na himig ng προσφώνησις, at ang “nauna nang sinabi” ay natural na naghahatid ng temporal na diwa nang hindi ipinapalagay na tiyak na hula ang tinutukoy.
