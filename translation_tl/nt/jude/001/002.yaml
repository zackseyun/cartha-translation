  text: May mercy and peace and love be multiplied to you[a].
translation:
  language: tl
  text: Dumami nawa sa inyo ang awa at kapayapaan at pag-ibig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lumago” o “sumagana” sa halip na “dumami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεος
  choice: awa
  rationale: Ang “awa” ang likas at karaniwang katumbas sa modernong Tagalog at pinananatili ang diwang mapagmalasakit at mapagkaloob ng ἔλεος.
- source_word: ὑμῖν
  choice: sa inyo
  rationale: Ang datibong panghalip sa pormula ng pagbati at pagpapala ay natural na isinasalin na “sa inyo.”
- source_word: εἰρήνη
  choice: kapayapaan
  rationale: Pinananatili ng “kapayapaan” ang malawak na diwa ng εἰρήνη, kabilang ang katiwasayan at maayos na ugnayan, nang hindi ito labis na ipinapaliwanag.
- source_word: ἀγάπη
  choice: pag-ibig
  rationale: Ang “pag-ibig” ang malinaw, dignified, at kasalukuyang katumbas ng ἀγάπη.
- source_word: πληθυνθείη
  choice: sumagana nawa
  rationale: Ipinahahayag ng “nawa” ang optatibong hangarin, samantalang ang “sumagana” ay likas sa Tagalog at pinananatili ang larawan ng pagdami o paglaganap.
- source_word: καὶ ... καὶ ... καὶ
  choice: at ... at ... at
  rationale: Pinanatili ang inuulit na “at” upang maipakita ang maindayog at maringal na pagkakaipon ng tatlong pagpapala.
theological_decisions:
- issue: Pagpapahayag ng optatibong pormula ng pagpapala
  choice: Sumagana nawa sa inyo ang awa at kapayapaan at pag-ibig.
  alternative: Nawa'y paramihin sa inyo ang awa at kapayapaan at pag-ibig.
  rationale: Malinaw na ipinahahayag ng “nawa” ang isang panalangin o hangarin, hindi isang tahasang pangako. Ang “sumagana” ay mas natural kaysa sa pasibong “paramihin” habang hindi tinutukoy kung sino ang nagpapasagana, gaya ng orihinal.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Pinanatili ang paulit-ulit na “at” at ang pormulang “nawa” upang maingatan ang ritmo at diwa ng pagpapala.
