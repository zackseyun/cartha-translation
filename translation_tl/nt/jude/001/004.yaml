id: JUD.1.4
reference: Jude 1:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: παρεισέδυσαν γάρ τινες ἄνθρωποι, οἱ πάλαι προγεγραμμένοι εἰς τοῦτο τὸ κρίμα, ἀσεβεῖς, τὴν τοῦ θεοῦ ἡμῶν χάριτα μετατιθέντες εἰς ἀσέλγειαν καὶ τὸν μόνον ⸀δεσπότην καὶ κύριον ἡμῶν Ἰησοῦν Χριστὸν ἀρνούμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/004.yaml
  text: For certain men have slipped in unnoticed[a], who long ago were designated for this judgment, ungodly men who turn the grace of our God into sensuality and deny our only Master and Lord[d][c][b], Jesus the Messiah.
translation:
  language: tl
  text: Sapagkat may ilang taong palihim na nakapasok[a]. Matagal na silang itinakda para sa hatol na ito[b]. Wala silang paggalang sa Diyos; ginagawang kahalayan ang biyaya ng ating Diyos[c], at itinatakwil nila ang iisa nating Pinuno at Panginoon, si Jesus na Mesiyas[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nakapasok nang hindi napapansin” o “palihim na nakapuslit.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “matagal nang naisulat tungkol sa kanila kaugnay ng hatol na ito.” Maaaring tumukoy ang Griyego sa naunang pagkakasulat o sa naunang pagtatalaga; hindi nito tahasang nilulutas kung paano nauugnay ang mga taong ito sa hatol.
    reason: alternative_reading
  - marker: c
    text: Maaari ring isalin na “mahalay na pamumuhay,” “pamumuhay na walang pagpipigil,” o “kahalayan.”
    reason: lexical_alternative
  - marker: d
    text: Sa Griyego, “Iēsoun Christon” (“Jesus Christ”); isinalin ang Χριστός bilang titulong “Mesiyas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεισέδυσαν
  choice: nakapasok sa inyong hanay nang hindi napapansin
  rationale: Ipinahihiwatig ng pandiwa ang palihim na pagpasok. Nililinaw ng “sa inyong hanay” ang panlipunang diwa ng pagpasok nang hindi nagpapasok ng bagong teolohikal na ideya.
- source_word: πάλαι προγεγραμμένοι
  choice: matagal nang naisulat ang tungkol sa kanila
  rationale: Pinananatili nito ang literal na diwa ng naunang pagkakasulat at iniiwasang ipasya sa pangunahing teksto kung ang tinutukoy ay naunang pahayag sa Kasulatan o pagtatalaga nang una pa.
- source_word: κρίμα
  choice: hatol
  rationale: Ang “hatol” ay karaniwan at malinaw na salitang panghukuman, at hindi nito labis na nililimitahan ang kahulugan sa kaparusahan lamang.
- source_word: ἀσεβεῖς
  choice: wala silang paggalang sa Diyos
  rationale: Likas at madaling maunawaang Filipino ito para sa kawalang-pitagan sa Diyos na ipinahihiwatig ng salita.
- source_word: χάριτα
  choice: biyaya
  rationale: Ito ang kinagisnan at tumpak na salin sa kontekstong teolohikal ng mapagpalang pagkakaloob ng Diyos.
- source_word: μετατιθέντες εἰς ἀσέλγειαν
  choice: ginagawa nilang dahilan sa mahalay na pamumuhay
  rationale: Ipinapahayag nito sa natural na Filipino ang pagbaluktot sa biyaya upang bigyang-matwid ang asal na walang pagpipigil, habang hindi nililimitahan ang salita sa isang partikular na seksuwal na gawa.
- source_word: μόνον δεσπότην καὶ κύριον
  choice: nag-iisa nating Pinuno at Panginoon
  rationale: Kapuwa kinakatawan ang dalawang titulo. Ang “Pinuno” ay nagpapahayag ng personal at pinakamataas na awtoridad nang hindi kasing-pyudal ng “Amo,” samantalang pinananatili ang “Panginoon” para sa κύριος.
- source_word: Ἰησοῦν Χριστόν
  choice: Jesus na Mesiyas
  rationale: Itinuturing ang Χριστός bilang titulo at isinasalin itong “Mesiyas” sa likas na anyong Filipino.
- source_word: ἀρνούμενοι
  choice: itinatakwil
  rationale: Saklaw nito ang hayagang pagkakaila at praktikal na hindi pagkilala sa awtoridad ni Jesus.
theological_decisions:
- issue: Kahulugan ng προγεγραμμένοι εἰς τοῦτο τὸ κρίμα
  choice: Naunang naisulat ang tungkol sa kanila kaugnay ng hatol na ito
  alternative: Nauna silang itinalaga para sa hatol na ito
  rationale: Maaaring tumukoy ang Griyego sa naunang pagkakasulat o sa naunang pagtatalaga. Ang salin ay nagpapanatili sa una at mas tuwirang leksikal na posibilidad, habang inilalahad sa talababa ang isa pa at hindi nagpapasya nang labis tungkol sa indibidwal na predestinasyon.
- issue: Tinutukoy ng “nag-iisang Pinuno at Panginoon”
  choice: Ang dalawang titulo ay kapuwa tumutukoy kay Jesus na Mesiyas
  alternative: Ang “Pinuno” ay tumutukoy sa Diyos Ama at ang “Panginoon” ay kay Jesus na Mesiyas
  rationale: Pinakanatural sa balangkas ng Griyego na magkasamang iugnay kay Ἰησοῦν Χριστόν ang dalawang titulo, bagaman kinikilala ang ibang posibleng pagbasa.
- issue: Saklaw ng ἀσέλγεια
  choice: mahalay na pamumuhay
  alternative: kahalayan; pamumuhay na walang pagpipigil
  rationale: 'Madalas itong may seksuwal na sangkap ngunit mas malawak ang diwa nito: kahiya-hiyang pagpapakasasa at kawalan ng pagpipigil. Hindi ito pinakikitid sa isang uri lamang ng kasalanan.'
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasan ang makalumang “Amo” at ang teknikal na pananalitang pangdoktrina. Hinati sa tatlong pangungusap ang mahabang pangungusap na Griyego upang maging madaling sundan, ngunit pinanatili ang mga ugnayang lohikal at ang bigat ng babala.
