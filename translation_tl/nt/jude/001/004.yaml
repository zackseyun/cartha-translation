  to: Sapagkat may ilang taong palihim na nakapasok[a]. Matagal na silang itinakda para sa hatol na ito[b]. Wala silang paggalang sa Diyos; ginagawang kahalayan ang biyaya ng ating Diyos[c], at itinatakwil nila ang iisa nating Pinuno at Panginoon, si Jesus na Mesiyas[d].
  rationale: Inalis ang di-sinasabing “sa inyong hanay.” Pinalitan ang pariralang nagpapahiwatig lamang ng pagbibigay-dahilan upang maipakita ang tuwirang pagpapalit o pagbabaligtad ng biyaya tungo sa kahalayan. Ginawang mas malinaw ang pangunahing pagbasa ng προγεγραμμένοι εἰς τοῦτο τὸ κρίμα, ngunit pinanatili sa talababa ang makabuluhang alternatibong pagbasa na may kinalaman sa naunang pagkakasulat. Hindi binabago ng salin ang hindi pa nalulutas na teolohikal na usapin ng parirala.
