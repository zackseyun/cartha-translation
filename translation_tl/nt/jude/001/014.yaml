revisions:
- from: Tungkol din sa mga taong ito ay nagpahayag ng propesiya si Enoc[a], ang ikapito mula kay Adan. Sinabi niya, “Tingnan ninyo,[b] dumating ang Panginoon kasama ang laksa-laksang banal na mga lingkod niya.[c]”
  to: Nagpropesiya rin tungkol sa mga taong ito si Enoc[a], ang ikapito mula kay Adan. Sinabi niya, “Narito,[b] dumating ang Panginoon kasama ang kaniyang laksa-laksang mga banal.[c]”
  rationale: Inalis ang dagdag na “mga lingkod” upang mapanatili ang di-tiyak na pagkakakilanlan ng “mga banal,” pinalitan ang interheksiyon ng “Narito” upang hindi magdagdag ng kausap, at ginawang “nagpropesiya” ang pandiwa para sa mas natural na salin. Pinanatili ang kontekstuwal ngunit maingat na “tungkol sa mga taong ito,” ang nakaraang panahunan ng “dumating,” at ang hindi-tinutukoy na “Panginoon.”
