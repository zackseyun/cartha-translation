id: JUD.1.14
reference: Jude 1:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Προεφήτευσεν δὲ καὶ τούτοις ἕβδομος ἀπὸ Ἀδὰμ Ἑνὼχ λέγων· Ἰδοὺ ἦλθεν κύριος ἐν ἁγίαις μυριάσιν αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/014.yaml
  text: And Enoch[a], the seventh from Adam, also prophesied to these, saying, “Behold[c][b], the Lord came with his holy myriads,”
translation:
  language: tl
  text: Nagpropesiya rin tungkol sa mga taong ito si Enoc[a], ang ikapito mula kay Adan. Sinabi niya, “Narito,[b] dumating ang Panginoon kasama ang kaniyang laksa-laksang mga banal.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “laban sa mga taong ito” o “hinggil sa mga taong ito.” Maaaring tumukoy ang Griyegong τούτοις sa mga taong paksa ng propesiya; sa konteksto, sila ang mga di-makadiyos na nakapasok sa kapulungan.
    reason: lexical_alternative
  - marker: b
    text: Ang sipi ay kahawig ng 1 Enoc 1:9.
    reason: cross_reference
  - marker: c
    text: Maaari ring “kasama ang sampu-sampung libo niyang mga banal.” Ang μυριάσιν ay maaaring mangahulugang “mga laksa” o “sampu-sampung libo” at tumutukoy sa napakaraming mga banal.
    reason: lexical_alternative
lexical_decisions:
- source_word: Προεφήτευσεν
  choice: nagpahayag ng propesiya
  rationale: Pinananatili ang diwa ng προφητεύω bilang propetikong pagpapahayag at hindi ito nililimitahan sa paghula lamang sa hinaharap.
- source_word: δὲ καὶ
  choice: din
  rationale: Ipinahahayag ang banayad na pag-uugnay at pandagdag na puwersa nang natural sa modernong Tagalog.
- source_word: τούτοις
  choice: tungkol sa mga taong ito
  rationale: Maaaring tumukoy ang datibo sa mga taong tinatalakay ng propesiya; sa konteksto, sila ang mga taong di-makadiyos na naunang binanggit. Iniiwasan ng pangunahing teksto ang di-natural na 'sa mga ito'.
- source_word: ἕβδομος ἀπὸ Ἀδὰμ
  choice: ang ikapito mula kay Adan
  rationale: Tuwirang pinananatili ang pananalitang pangangkanan nang hindi ginagawang 'ikapitong salinlahi,' na higit na tiyak kaysa sa Griyego.
- source_word: Ἑνὼχ
  choice: Enoc
  rationale: Karaniwang anyo ng pangalan sa tradisyong Bibliyang Filipino.
- source_word: λέγων
  choice: Sinabi niya
  rationale: Natural na paraan sa Tagalog upang ipakilala ang tuwirang sipi.
- source_word: Ἰδοὺ
  choice: Tingnan ninyo
  rationale: Nananatili ang maringal at pantawag-pansing puwersa ng interheksiyon sa malinaw na modernong Filipino.
- source_word: ἦλθεν
  choice: dumating
  rationale: Tapat sa aorist na anyong nakaraan; hindi tahasang ginagawang hinaharap ang posibleng propetikong gamit nito.
- source_word: κύριος
  choice: ang Panginoon
  rationale: Karaniwan at maringal na salin ng κύριος, nang hindi tinutukoy nang higit sa sinasabi ng teksto kung sino ang tinutukoy.
- source_word: ἐν ἁγίαις μυριάσιν αὐτοῦ
  choice: kasama ang laksa-laksang banal na mga lingkod niya
  rationale: Ipinahahayag ng 'laksa-laksa' ang μυριάσιν bilang napakalaking bilang; ang 'mga lingkod' ay nagbibigay ng natural na pangngalang tinutukoy ng pang-uri nang hindi tahasang dinaragdagan ang 'mga anghel.' Itinatala sa talababa ang mas pormal na alternatibo.
theological_decisions:
- issue: Pagkakakilanlan ng 'Panginoon' sa sipi ni Enoc
  choice: Panatilihin lamang ang 'Panginoon.'
  alternative: Tukuyin ito bilang Diyos sa konteksto ng 1 Enoc o bilang si Jesus sa pagkakagamit ni Judas.
  rationale: κύριος lamang ang sinasabi ng Griyego; pinananatili ng salin ang posibleng teolohikal na tensiyon sa halip na lutasin ito.
- issue: Kalikasan ng sipi mula sa 1 Enoc
  choice: Iharap ito bilang propesiyang sinabi ni Enoc at banggitin lamang sa talababa ang pagkakahawig sa 1 Enoc 1:9.
  alternative: Magpahayag sa pangunahing teksto ng pasiya tungkol sa kanonikal na katayuan o eksaktong pinagmulan nito.
  rationale: Iyon ang paraan ng paglalahad ni Judas; hindi dapat magdagdag ang salin ng doktrinal na pasiyang hindi binibigkas ng talata.
- issue: Panahunan ng ἦλθεν
  choice: dumating
  alternative: darating
  rationale: Pinananatili ang anyong nakaraan ng Griyego at ang posibleng 'prophetic past' nang hindi tahasang nilulutas ito bilang hinaharap.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit maringal. Ginamit ang 'Enoc,' 'Adan,' at 'Panginoon' bilang pamilyar na anyong biblikal. Inilagay ang lahat ng marker [a]–[c] sa pangunahing teksto at iniugnay sa kaukulang salita o parirala.
