  naturalness: Mas natural at tuwiran sa modernong Filipino ang “nagpropesiya” kaysa “nagpahayag ng propesiya.” Ang binagong ayos ay nananatiling malinaw at maringal.
  terminology: Pinanatili ang mga pamilyar na anyong “Enoc,” “Adan,” at “Panginoon.” Ginamit ang “mga banal” upang huwag tukuyin nang lampas sa teksto ang banal na kasama ng Panginoon.
