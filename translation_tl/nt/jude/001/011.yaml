id: JUD.1.11
reference: Jude 1:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὐαὶ αὐτοῖς, ὅτι τῇ ὁδῷ τοῦ Κάϊν ἐπορεύθησαν, καὶ τῇ πλάνῃ τοῦ Βαλαὰμ μισθοῦ ἐξεχύθησαν, καὶ τῇ ἀντιλογίᾳ τοῦ Κόρε ἀπώλοντο.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/011.yaml
  text: Woe to them[a], because they have walked in the way of Cain, and have poured themselves out for pay into Balaam’s error, and have perished in Korah’s rebellion.
translation:
  language: tl
  text: Kahabag-habag sila! Sapagkat tinahak nila ang landas ni Cain, at dahil sa bayad ay padalus-dalos silang nagpakasasa sa kamalian ni Balaam[a], at nalipol sila sa paghihimagsik ni Korah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “at dahil sa pakinabang ay sumugod sila nang walang taros sa kamalian ni Balaam.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαὶ αὐτοῖς
  choice: Kahabag-habag sila!
  rationale: Nananatili ang lakas ng propetikong pahayag ng paghatol; higit itong natural sa modernong Tagalog kaysa sa literal ngunit di-likas na anyong “Kaabahan sa kanila.”
- source_word: τῇ ὁδῷ τοῦ Κάϊν ἐπορεύθησαν
  choice: tinahak nila ang landas ni Cain
  rationale: Pinananatili ang talinghaga ng ὁδός bilang paraan ng pamumuhay, habang natural na ipinahahayag sa Tagalog ang ἐπορεύθησαν.
- source_word: τῇ πλάνῃ τοῦ Βαλαὰμ
  choice: sa pagkaligaw ni Balaam
  rationale: Ang πλάνη ay maaaring tumukoy sa kamalian, panlilinlang, o pagkaligaw. Pinananatili ng “pagkaligaw” ang larawang paglihis sa wastong landas at ang kaugnayan nito sa naunang talinghaga.
- source_word: μισθοῦ
  choice: dahil sa bayad
  rationale: Malinaw na ipinahahayag ang mapag-imbot o upahang motibo nang hindi nililimitahan ang μισθός sa isang partikular na uri ng kabayaran.
- source_word: ἐξεχύθησαν
  choice: ibinuhos nila ang kanilang sarili
  rationale: Pinananatili ang matingkad at mahirap na metapora ng pandiwa sa halip na ganap itong gawing interpretatibong “sumugod nang walang taros.”
- source_word: τῇ ἀντιλογίᾳ τοῦ Κόρε
  choice: sa paghihimagsik ni Corah
  rationale: Sa pahiwatig sa Bilang 16, ang ἀντιλογία ay tumutukoy sa aktuwal na pagsalungat o paghihimagsik ni Corah; “paghihimagsik” ang pinakamalinaw sa kontekstong ito.
- source_word: ἀπώλοντο
  choice: napahamak sila
  rationale: Nagpapahayag ng kapahamakan o pagkalipol nang hindi labis na tinutukoy ang eksaktong paraan nito.
- source_word: Κάϊν / Βαλαὰμ / Κόρε
  choice: Cain / Balaam / Corah
  rationale: Ginamit ang mga pangalang karaniwang makikilala sa tradisyong Bibliyang Tagalog; ang “Corah” ay nagpapanatili rin ng pagkakaiba sa karaniwang salitang “Korah” sa modernong Filipino.
theological_decisions:
- issue: Ang siksik at metaporikal na pariralang τῇ πλάνῃ τοῦ Βαλαὰμ μισθοῦ ἐξεχύθησαν
  choice: at dahil sa bayad ay ibinuhos nila ang kanilang sarili sa pagkaligaw ni Balaam
  alternative: at dahil sa pakinabang ay sumugod sila nang walang taros sa kamalian ni Balaam
  rationale: Pinananatili ng pangunahing salin ang larawan ng “pagbuhos” at ang motibong μισθοῦ, kahit sadyang kapansin-pansin ang metapora. Inilalagay sa talababa ang mas idyomatikong pagbasa upang hindi palihim na lutasin ang tunay na kahirapan ng parirala.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang tatluhang pagkakatulad ng mga halimbawa kina Cain, Balaam, at Corah, pati ang solemneng himig ng paghatol.
