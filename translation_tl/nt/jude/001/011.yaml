  to: Kahabag-habag sila! Sapagkat tinahak nila ang landas ni Cain, at dahil sa bayad ay padalus-dalos silang nagpakasasa sa kamalian ni Balaam[a], at nalipol sila sa paghihimagsik ni Korah.
  rationale: Inayos ang di-likas na literal na larawan ng “ibinuhos nila ang kanilang sarili” sa isang malinaw na Tagalog na nagpapahiwatig ng walang-pigil at mapagsariling pagsuong na hinihingi ng metaporikal na ἐξεχύθησαν sa kontekstong ito. Pinanatili ang motibong “dahil sa bayad,” ang tatluhang paralelismo, at ang talababa para sa alternatibong mas dinamikong pagbasa. Pinalakas din ang huling pandiwa at ginawang “Korah” ang pangalan.
