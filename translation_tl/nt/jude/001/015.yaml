  naturalness: Natural at marangal sa modernong Filipino Tagalog ang “magsagawa ng paghatol,” “patunayang may-sala,” at “mabibigat na salitang.” Ang “ukol sa” ay bahagyang pormal ngunit angkop sa hudisyal na rehistro at pinananatili ang saklaw ng Griyegong περὶ.
