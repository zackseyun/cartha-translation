  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ποιῆσαι κρίσιν κατὰ πάντων καὶ ἐλέγξαι ⸂πάντας τοὺς ἀσεβεῖς⸃ περὶ πάντων τῶν ἔργων ἀσεβείας αὐτῶν ὧν ἠσέβησαν καὶ περὶ πάντων τῶν σκληρῶν ὧν ἐλάλησαν κατ’ αὐτοῦ ἁμαρτωλοὶ ἀσεβεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/015.yaml
  text: to execute judgment against all and to convict all the ungodly concerning all their ungodly deeds that they committed in ungodliness[c][b][a], and concerning all the harsh things that ungodly sinners have spoken against him.
translation:
  language: tl
  text: upang magsagawa ng paghatol laban sa lahat at patunayang may-sala[a] ang lahat ng di-makadiyos ukol sa lahat ng kanilang gawang di-makadiyos na ginawa nila sa paraang di-makadiyos, at ukol sa lahat ng mabibigat na salitang[b] sinabi laban sa kanya[c] ng mga makasalanang di-makadiyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “ilantad ang kasalanan” o “patunayang nagkasala.” Ang pandiwang Griyego ay maaaring tumukoy sa paglalantad ng kamalian, ngunit hudisyal ang konteksto nito kasabay ng “magsagawa ng paghatol.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isaling “matitigas na salita,” “malulupit na salita,” o “mapanlabang salita.” Ang salitang Griyego ay tumutukoy sa mabigat, marahas, o mapanlait na pananalita.
    reason: lexical_alternative
  - marker: c
    text: Ang “kanya” ay tumutukoy, ayon sa konteksto, sa Panginoong binanggit sa naunang talata.
    reason: cross_reference
lexical_decisions:
- source_word: ποιῆσαι κρίσιν κατὰ πάντων
  choice: upang hatulan ang lahat
  rationale: Ipinahahayag ng parirala ang pagsasagawa ng hatol laban sa lahat. Mas natural sa modernong Tagalog ang “hatulan” kaysa sa literal na “magsagawa ng paghatol,” habang nananatili ang diwang hudisyal.
- source_word: ἐλέγξαι
  choice: patunayang nagkasala
  rationale: Sa kontekstong hudisyal, hindi lamang ito pagsaway kundi paglalantad at pagpapatunay ng pagkakasala.
- source_word: πάντας τοὺς ἀσεβεῖς
  choice: ang lahat ng hindi kumikilala sa Diyos
  rationale: Ang ἀσεβής ay tumutukoy sa kawalan ng paggalang o wastong pagkilala sa Diyos. Ang pariralang ito ay malinaw at dignified sa modernong Tagalog, at pinananatili ang kaugnayan sa inuulit na salitang-ugat na ἀσεβ-.
- source_word: περὶ πάντων τῶν ἔργων ἀσεβείας αὐτῶν
  choice: dahil sa lahat ng masasama nilang gawa
  rationale: Ang περί dito ay tumutukoy sa mga batayan ng pagpapatunay ng sala. Ang “masasamang gawa” ay natural na pagpapahayag ng mga gawang bunga ng kawalan ng pagkilala sa Diyos.
- source_word: ὧν ἠσέβησαν
  choice: na ginawa nila nang walang pagkilala sa Diyos
  rationale: Pinananatili nito, hangga't natural sa Tagalog, ang tahasang pag-uulit ng ἀσεβ- na nagbibigay-diin sa talata.
- source_word: σκληρῶν
  choice: mapangahas na salita
  rationale: Sa konteksto ng pagsasalita laban sa Panginoon, ang σκληρός ay maaaring mangahulugang marahas, matigas, o mapanghamon. Ang “mapangahas” ay naghahatid ng mapanlaban at lapastangang himig nang hindi nililimitahan sa simpleng magaspang na pananalita.
- source_word: ἐλάλησαν κατ’ αὐτοῦ
  choice: sinabi laban sa kanya
  rationale: Tuwirang pinananatili ang adversatibong diwa ng κατά at ang panghalip ng Griyego.
- source_word: ἁμαρτωλοὶ ἀσεβεῖς
  choice: mga makasalanang hindi kumikilala sa Diyos
  rationale: Pinananatili ang dalawang magkaugnay ngunit magkaibang paglalarawan at ang diin sa kawalan ng pagkilala sa Diyos.
theological_decisions:
- issue: Tinutukoy ng αὐτοῦ sa “sinabi laban sa kanya”
  choice: Panatilihin ang panghalip na “kanya” sa pangunahing teksto.
  alternative: “sinabi laban sa Panginoon” o “sinabi laban sa Diyos”
  rationale: Itinuturo ng konteksto sa talata 14 na ang tinutukoy ay ang Panginoon, ngunit panghalip ang ginamit ng Griyego. Hindi ito tahasang pinalitan upang maiwasang lampasan ang anyo at natitirang tensiyon ng teksto.
- issue: Pag-uulit ng salitang-ugat na ἀσεβ-
  choice: Iugnay ang mga parirala sa “hindi kumikilala sa Diyos” at “walang pagkilala sa Diyos.”
  alternative: Gamitin lamang ang “masama” o “di-maka-Diyos” sa bawat paglitaw.
  rationale: Mahalaga sa retorika ng talata ang apat na anyo ng ἀσεβ-. Ang salin ay nagsisikap na panatilihin ang ugnayang ito nang hindi nagiging labis na literal o hindi natural.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal at malinaw na himig. Iniwasan ang teknikal o denominasyonal na pananalita. Ginamit ang “hindi kumikilala sa Diyos” upang ihayag ang ἀσεβής nang mas malinaw kaysa sa maaaring malabong “di-maka-Diyos,” at pinanatili ang panghalip na “kanya” sa halip na tahasang tukuyin ang referent.
