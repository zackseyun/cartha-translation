  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἑαυτοὺς ἐν ἀγάπῃ θεοῦ τηρήσατε προσδεχόμενοι τὸ ἔλεος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/021.yaml
  text: keep yourselves in the love of God[c][b][a], waiting for the mercy of our Lord Jesus the Messiah unto eternal life.
translation:
  language: tl
  text: Manatili kayo sa pag-ibig ng Diyos[a], habang hinihintay ninyo ang awa ng ating Panginoong Jesus na Mesiyas[b], tungo sa buhay na walang hanggan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa pag-ibig ng Diyos sa inyo” o “sa pag-ibig ninyo sa Diyos.”
    reason: alternative_reading
  - marker: b
    text: 'Griyego: “Jesus Christ”; isinalin dito ang Χριστός bilang titulong “Mesiyas.”'
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “para sa buhay na walang hanggan” o “na humahantong sa buhay na walang hanggan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τηρήσατε
  choice: Manatili kayo
  rationale: Ang aorist active imperative ay tuwirang utos sa maramihan. Sa modernong Tagalog, natural na ipinahahayag ng “manatili kayo” ang pananagutang patuloy na panatilihin ang sarili sa isang kalagayan, nang hindi nagiging mabigat o mekanikal ang “panatilihin ninyo ang inyong mga sarili.”
- source_word: ἐν ἀγάπῃ θεοῦ
  choice: sa pag-ibig ng Diyos
  rationale: 'Pinananatili nito ang maaaring higit sa isang kahulugan ng genitibong θεοῦ: maaaring pag-ibig ng Diyos sa mga mananampalataya o pag-ibig na nakatuon sa Diyos.'
- source_word: προσδεχόμενοι
  choice: habang hinihintay ninyo
  rationale: Ipinahahayag ng present participle ang nagpapatuloy at mapaghintay na saloobing kasabay ng pangunahing utos. Ang “habang” ay malinaw na nag-uugnay dito sa “manatili kayo.”
- source_word: ἔλεος
  choice: awa
  rationale: Karaniwan at malinaw na katumbas sa Tagalog para sa mahabaging pagkilos o kaloob na hindi pinagbabatayan ng karapatan ng tumatanggap.
- source_word: κυρίου
  choice: Panginoon
  rationale: Pamantayang salin ng κύριος bilang titulo sa kontekstong ito.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus na Mesiyas
  rationale: Isinalin ang Χριστός bilang titulong “Mesiyas” sa halip na ituring lamang itong bahagi ng pangalan. Ang “na” ay natural na panandang Tagalog para sa titulong ikinakabit kay Jesus.
- source_word: εἰς ζωὴν αἰώνιον
  choice: tungo sa buhay na walang hanggan
  rationale: Ang “tungo sa” ay nagpapanatili sa diwa ng direksiyon, layunin, o hantungan ng εἰς nang hindi tiyak na nilulutas kung ito ay pinakamahusay na unawaing “para sa” o “humahantong sa.”
theological_decisions:
- issue: Kahulugan ng genitive sa ἀγάπῃ θεοῦ
  choice: Pinanatili ang maluwag na “pag-ibig ng Diyos.”
  alternative: “pag-ibig ng Diyos sa inyo” o “pag-ibig ninyo sa Diyos”
  rationale: Hindi tahasang nilulutas ng Griyego kung Diyos ang pinagmumulan o ang layon ng pag-ibig; kaya hindi rin ito tahasang nilutas sa pangunahing teksto.
- issue: Pagpapahayag sa Χριστοῦ
  choice: Mesiyas
  alternative: Cristo
  rationale: May puwersa pa rin itong titulo sa parirala, kaya isinalin ang kahulugan nito sa halip na basta transliterahin.
- issue: Ugnayan ng εἰς ζωὴν αἰώνιον sa naunang parirala
  choice: tungo sa buhay na walang hanggan
  alternative: “para sa buhay na walang hanggan” o “na humahantong sa buhay na walang hanggan”
  rationale: Ang mas maikli at direksiyonal na pananalita ay nagpapanatili sa saklaw at kaugnayang hindi lubos na tinutukoy ng Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “manatili kayo” upang maiwasan ang di-natural na literalismong “panatilihin ninyo ang inyong mga sarili,” habang pinananatili ang tuwirang lakas ng utos. Lahat ng talababa ay minarkahan sa pangunahing teksto.
