  text: οὗτοί εἰσιν οἱ ἀποδιορίζοντες, ψυχικοί, πνεῦμα μὴ ἔχοντες.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/019.yaml
  text: These are the ones who cause divisions[a], worldly people[c][b], not having the Spirit.
translation:
  language: tl
  text: Sila ang mga nagdudulot ng pagkakabaha-bahagi[a]. Namumuhay sila ayon lamang sa likas na pagkatao[b] at hindi taglay ang Espiritu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga humihiwalay” o “ang mga naghahasik ng pagkakabaha-bahagi.”
    reason: lexical_alternative
  - marker: b
    text: O “mga makamundo” o “hindi espirituwal.”
    reason: lexical_alternative
  - marker: c
    text: O “espiritu,” bagaman sa konteksto ay malamang na tumutukoy ito sa Banal na Espiritu.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτοί
  choice: Sila
  rationale: Tumutukoy pabalik sa mga taong inilalarawan sa konteksto at natural itong pakinggan sa makabagong Tagalog.
- source_word: οἱ ἀποδιορίζοντες
  choice: ang mga lumilikha ng pagkakabaha-bahagi
  rationale: 'Ipinapahayag ang malamang na aktibong diwa ng pandiwari: ang mga taong nagdudulot ng pagkakahati. Pinananatili sa talababa ang posibleng diwang sila mismo ang humihiwalay.'
- source_word: ψυχικοί
  choice: namumuhay ... ayon lamang sa likas na pagkatao
  rationale: Ipinakikita ang pagsalungat sa pagkakaroon ng Espiritu nang hindi ipinapakahulugang likas na masama ang sangnilikha o katawan. Mas malinaw ito sa karaniwang mambabasa kaysa sa literal ngunit malabong 'makalikas.'
- source_word: πνεῦμα
  choice: ang Espiritu
  rationale: Sa konteksto, malamang na tumutukoy sa Banal na Espiritu; gayunman, pinananatili sa talababa ang posibleng pangkalahatang saling 'espiritu.'
- source_word: μὴ ἔχοντες
  choice: wala sa kanila
  rationale: Natural na Tagalog na nagpapanatili sa payak na pagtanggi ng Griyego at mahigpit na inuugnay ito sa Espiritu.
theological_decisions:
- issue: Ang tinutukoy ng πνεῦμα
  choice: ang Banal na Espiritu, na isinalin sa pangunahing teksto bilang “ang Espiritu”
  alternative: espiritu sa pangkalahatan o espiritung pantao
  rationale: Ang tahasang pagsalungat sa ψυχικοί at ang konteksto ng Judas ay higit na pumapabor sa Banal na Espiritu, ngunit hindi lubos na tinutukoy iyon ng anyo ng salita lamang kaya nakatala ang alternatibo.
- issue: Diwa ng ψυχικοί
  choice: mga taong namumuhay ayon lamang sa likas na pagkatao
  alternative: mga makamundo o hindi espirituwal
  rationale: Pinananatili nito ang kaibhan sa Espiritu nang hindi ipinapasok ang ideyang materyalismo lamang ang tinutukoy; inilalagay sa talababa ang maiikling alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Hinati sa dalawang pangungusap upang maging natural ang sunod-sunod na paglalarawan, habang pinananatili ang lohikal na ugnayan at tunay na mga alternatibong leksikal.
