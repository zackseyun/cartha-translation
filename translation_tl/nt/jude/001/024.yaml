    rationale: Sa modernong Filipino, mas karaniwan itong mabasa bilang ‘maging maingat tungkol sa inyo.’ Ang “ingatan kayo” ang tuwirang nagpapahayag ng pangangalaga o pag-iingat sa mga kausap.
  - severity: low
    issue: Hindi gaanong natural ang “At sa kanya na may kakayahang” at ang hiwalay na “maiharap kayo.”
    rationale: Ang datibong pambungad ay maaaring simulan sa “Sa kanya,” at ang dalawang infinitive na kapwa nakasalalay sa δυναμένῳ ay mas malinaw bilang “may kapangyarihang ingatan … at iharap ….”
