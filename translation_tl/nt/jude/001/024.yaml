  text: Τῷ δὲ δυναμένῳ φυλάξαι ⸀ὑμᾶς ἀπταίστους καὶ στῆσαι κατενώπιον τῆς δόξης αὐτοῦ ἀμώμους ἐν ἀγαλλιάσει
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/024.yaml
  text: To the one who is able to keep you from stumbling and to present you blameless before his glory with rejoicing[c][b][a],
translation:
  language: tl
  text: Sa kanya na may kapangyarihang ingatan kayo upang hindi kayo matisod[a] at iharap kayong walang kapintasan[b] sa harap ng kanyang kaluwalhatian nang may kagalakan,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “upang hindi kayo mahulog.” Ang salitang Griyego ay may diwa ng hindi pagkatisod o hindi pagkahulog.'
    reason: lexical_alternative
  - marker: b
    text: 'O: “walang dungis.” Maaari ring ipahiwatig ng salitang Griyego ang pagiging walang depekto o kapintasan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῷ ... δυναμένῳ
  choice: sa kanya na may kakayahang
  rationale: Pinananatili nito ang anyong pandiwari at ang datibong tungkulin nito sa doksolohiyang nagpapatuloy sa talata 25, habang natural sa Filipino.
- source_word: δὲ
  choice: At
  rationale: Mahinang panandang panlipat ito tungo sa pangwakas na doksolohiya; ang “At” ay likas sa Filipino at hindi nagpapahiwatig ng matinding pagsalungat.
- source_word: φυλάξαι ὑμᾶς ἀπταίστους
  choice: mag-ingat sa inyo upang hindi kayo matisod
  rationale: Ipinahahayag ng “mag-ingat” ang pag-iingat o pag-iingat na mapanatili, at pinananatili ng “hindi kayo matisod” ang metapora ng ἀπταίστους nang hindi ito nililimitahan sa isang tiyak na doktrinal na pagbasa.
- source_word: καὶ στῆσαι
  choice: at maiharap kayo
  rationale: Bagaman literal na tumutukoy sa pagpapatayo, ipinahihiwatig ng konteksto ang pagpapaharap o paghaharap sa harap ng banal na kaluwalhatian; natural dito ang “maiharap kayo.”
- source_word: κατενώπιον τῆς δόξης αὐτοῦ
  choice: sa harap ng kanyang kaluwalhatian
  rationale: Malapit ito sa Griyegong “before his glory” at hindi dinaragdagan ng salitang “presensya,” bagaman maaaring ipinahihiwatig iyon ng parirala.
- source_word: ἀμώμους
  choice: walang kapintasan
  rationale: Nauunawaan ng karaniwang mambabasa at naipahihiwatig kapwa ang kawalang-sala at ang larawang walang dungis o depekto.
- source_word: ἐν ἀγαλλιάσει
  choice: at may kagalakan
  rationale: Likas na Filipino ito para sa masidhing kagalakang ipinahihiwatig ng ἀγαλλίασις, nang hindi tahasang nagdaragdag ng “dakila” o “labis.”
theological_decisions:
- issue: Kung ang τῆς δόξης αὐτοῦ ay isasaling literal bilang “kanyang kaluwalhatian” o palalawakin bilang “kanyang maluwalhating presensya”
  choice: kanyang kaluwalhatian
  alternative: kanyang maluwalhating presensya
  rationale: Tahasang “kaluwalhatian” ang nasa Griyego. Pinananatili ng salin ang teolohikal na bigat at iniiwasan ang pagpapaliwanag na wala mismo sa teksto.
- issue: Kung ang ἀπταίστους ay tumutukoy sa pagkatisod o sa ganap na pagkahulog/pagtalikod
  choice: upang hindi kayo matisod
  alternative: upang hindi kayo mahulog
  rationale: Pinananatili ng “matisod” ang pangunahing larawan ng salita at hindi tahimik na nilulutas kung tumutukoy ito sa pang-araw-araw na pagkakasala, pagkakamali, o pangwakas na pagtalikod.
- issue: Kung ang ἀμώμους ay dapat idiing moral lamang o panatilihin din ang larawang pansakripisyo ng pagiging walang dungis
  choice: walang kapintasan
  alternative: walang dungis
  rationale: Ang “walang kapintasan” ay malinaw at dignificado sa modernong Filipino, habang hindi nito isinasara ang posibleng alingawngaw ng pagiging walang depekto o dungis.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at madaling maunawaan. Napanatili ang anyo ng di-kumpletong doksolohiya na nagpapatuloy sa talata 25. Inilagay ang mga talababa kaagad sa mga salitang tinutukoy ng mga ito.
