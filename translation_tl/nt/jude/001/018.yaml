  text: ὅτι ἔλεγον ⸀ὑμῖν· ⸂Ἐπ’ ἐσχάτου χρόνου⸃ ἔσονται ἐμπαῖκται κατὰ τὰς ἑαυτῶν ἐπιθυμίας πορευόμενοι τῶν ἀσεβειῶν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/018.yaml
  text: that they were saying to you[a], “In the last time there will be mockers[b], going according to their own ungodly desires.”
translation:
  language: tl
  text: na sinasabi nila noon sa inyo, “Sa huling panahon[a] ay magkakaroon ng mga manunuya[b] na namumuhay ayon sa sarili nilang mga di-makadiyos na pagnanasa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Sa panahon ng kawakasan” o “Sa katapusan ng panahon.” Pang-isahan ang salitang Griyego na “panahon,” hindi “mga araw.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga mapanlibak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: sinasabi nila noon
  rationale: Ipinahihiwatig ng imperfect ang paulit-ulit o nagpapatuloy na pagsasalita sa nakaraan. Likas sa Tagalog ang “sinasabi nila noon” at napapanatili nito ang aspektong iyon.
- source_word: Ἐπ’ ἐσχάτου χρόνου
  choice: Sa huling panahon
  rationale: Pinananatili nito ang pang-isahang χρόνος (“panahon”), sa halip na gawing “mga huling araw,” at malinaw pa rin ang eskatolohikal na diwa.
- source_word: ἐμπαῖκται
  choice: mga manunuya
  rationale: Karaniwan at malinaw na salitang Tagalog ito para sa mga taong nangungutya o humahamak. Ang “mga mapanlibak” ay maaari ring salin.
- source_word: κατὰ τὰς ἑαυτῶν ἐπιθυμίας
  choice: ayon sa sarili nilang mga pagnanasa
  rationale: Ang “ayon sa” ay tumpak na nagpapahayag ng pagsunod o pag-aayon na nasa κατά. Mas malawak ang “mga pagnanasa” kaysa “kahalayan” at hindi nito nililimitahan ang kahulugan sa seksuwal na pagnanasa.
- source_word: πορευόμενοι
  choice: namumuhay
  rationale: Bagaman literal na tumutukoy sa paglakad o pagpunta, dito ay inilalarawan nito ang paraan ng pamumuhay. Mas natural sa modernong Tagalog ang “namumuhay ayon sa.”
- source_word: τῶν ἀσεβειῶν
  choice: mga pagnanasang hindi kumikilala sa Diyos
  rationale: Iniuugnay ng genitive ang kawalan ng paggalang o pagkilala sa Diyos sa mga pagnanasa. Malinaw at dignidad ang parirala, at iniiwasan nito ang posibleng kalabuan ng teknikal na “di-makadiyos.”
theological_decisions:
- issue: Pahayag tungkol sa huling panahon
  choice: Sa huling panahon
  alternative: Sa panahon ng kawakasan; Sa katapusan ng panahon; Sa mga huling araw
  rationale: Pinananatili ng salin ang pang-isahang “panahon” sa Griyego at hindi ito iniaayon sa mas pamilyar na pariralang “mga huling araw” mula sa ibang talata.
- issue: Moral at panrelihiyong katangian ng mga pagnanasa
  choice: mga pagnanasang hindi kumikilala sa Diyos
  alternative: mga di-makadiyos na pagnanasa; mga pagnanasa ng kasamaan
  rationale: Pinananatili nito ang paghatol ng teksto na ang mga pagnanasa ay salungat sa wastong pagkilala at paggalang sa Diyos, nang hindi ipinapalagay na seksuwal lamang ang tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignidad, at madaling maunawaan. Ginamit ang “namumuhay” bilang likas na idyoma para sa metaporikal na paglakad, habang pinanatili ang pang-isahang “huling panahon” at ang malawak na kahulugan ng “mga pagnanasa.”
