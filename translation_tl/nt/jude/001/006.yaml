id: JUD.1.6
reference: Jude 1:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀγγέλους τε τοὺς μὴ τηρήσαντας τὴν ἑαυτῶν ἀρχὴν ἀλλὰ ἀπολιπόντας τὸ ἴδιον οἰκητήριον εἰς κρίσιν μεγάλης ἡμέρας δεσμοῖς ἀϊδίοις ὑπὸ ζόφον τετήρηκεν·
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/006.yaml
  text: And the angels who did not keep their own domain[a], but abandoned their proper dwelling[c][b], he has kept in eternal chains under gloom for the judgment of the great day.
translation:
  language: tl
  text: At ang mga anghel na hindi iningatan ang sarili nilang katayuan[a], kundi iniwan ang sarili nilang tirahan[b], ay iningatan niya sa mga tanikalang walang hanggan, sa ilalim ng pusikit na dilim[c], para sa paghuhukom sa dakilang araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sarili nilang nasasakupan” o “sarili nilang pamamahala.”
    reason: lexical_alternative
  - marker: b
    text: O “sarili nilang tahanan” o “nararapat nilang tirahan.”
    reason: lexical_alternative
  - marker: c
    text: O “matinding karimlan”; ang salitang Griyego ay tumutukoy sa malalim at pusikit na dilim.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλους
  choice: mga anghel
  rationale: Sa konteksto ng makalangit na paghihimagsik at paghuhukom, supernatural na mga nilalang ang malinaw na tinutukoy, hindi mga taong mensahero.
- source_word: τηρήσαντας / τετήρηκεν
  choice: hindi nanatili / pinanatili niya
  rationale: 'Ang dalawang anyo ng τηρέω ay isinalin gamit ang magkaugnay na salitang “nanatili/pinanatili” upang maipakita ang sinadyang pag-uulit at paghahambing: hindi sila nanatili sa itinakdang saklaw nila, kaya pinanatili sila para sa paghuhukom. Iniwasan ang “iningatan” dahil maaari itong magpahiwatig ng pagprotekta sa kanila.'
- source_word: τὴν ἑαυτῶν ἀρχὴν
  choice: sarili nilang nasasakupan
  rationale: Maaaring tumukoy ang ἀρχή sa awtoridad, katayuan, o saklaw. Ang “nasasakupan” ay nagpapahayag ng itinakdang larangan o kalagayan nang hindi nililimitahan ang kahulugan sa pamamahalang politikal o sa temporal na “pasimula.”
- source_word: ἀπολιπόντας
  choice: iniwan
  rationale: Natural at malinaw sa modernong Tagalog ang “iniwan”; sa kasalungat na sugnay at sa konteksto ng hatol, sapat nitong ipinahihiwatig ang kusang pagtalikod.
- source_word: τὸ ἴδιον οἰκητήριον
  choice: kanilang angkop na tahanan
  rationale: Ang οἰκητήριον ay tirahan, at ipinakikita ng “angkop” ang kontekstuwal na diwa ng ἴδιον bilang tahanang ukol o nararapat sa kanila.
- source_word: εἰς κρίσιν μεγάλης ἡμέρας
  choice: para sa paghuhukom sa dakilang araw
  rationale: Pinananatili ng “para sa” ang direksiyon o layuning ipinahahayag ng εἰς, nang hindi ito ginagawang “hanggang,” na mas interpretatibo.
- source_word: δεσμοῖς ἀϊδίοις
  choice: sa mga tanikalang walang hanggan
  rationale: Ang “tanikala” ay matingkad at natural para sa δεσμός, at ang “walang hanggan” ay malinaw na katumbas ng namamalaging diwa ng ἀΐδιος.
- source_word: ὑπὸ ζόφον
  choice: sa ilalim ng pusikit na dilim
  rationale: Ang ζόφος ay higit sa karaniwang dilim at tumutukoy sa matinding karimlan; pinananatili ng “sa ilalim” ang larawan ng ὑπό.
- source_word: τε
  choice: At
  rationale: Likas na iniuugnay ng “At” ang halimbawang ito sa naunang halimbawa ng paghuhukom.
theological_decisions:
- issue: Kalikasan ng kasalanan ng mga anghel
  choice: Isinasaad lamang na hindi sila nanatili sa sarili nilang nasasakupan at iniwan nila ang angkop nilang tahanan.
  alternative: Tahasang tukuyin ito bilang tradisyon tungkol sa Genesis 6 o bilang pangkalahatang unang pagbagsak ng mga anghel.
  rationale: Bagaman maaaring tumukoy si Judas sa isang kilalang tradisyong Judio, hindi ipinaliliwanag ng mismong pangungusap kung ano ang tiyak na pangyayari. Pinananatili ng salin ang kalabuan at tensiyong nasa Griyego.
- issue: Lakas ng ἀΐδιος
  choice: walang hanggan
  alternative: walang katapusan; namamalagi
  rationale: Malinaw at karaniwang ipinahahayag ng “walang hanggan” ang permanenteng tagal, nang hindi nagdaragdag ng paliwanag na lampas sa sinasabi ng talata.
- issue: Di-tahasang simuno ng τετήρηκεν
  choice: niya
  alternative: ng Diyos; ng Panginoon
  rationale: Walang tahasang pangngalan para sa simuno sa mismong sugnay. Ang panghalip ay hindi nagpapasok ng interpretatibong pagkakakilanlan na hindi binanggit sa talata.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “tanikala,” “pusikit na dilim,” at “dakilang araw” upang mapanatili ang solemneng himig at matitingkad na larawan ng teksto. Ang “niya” ay sadyang hindi pinalitan ng isang tahasang banal na titulo upang huwag lutasin ang di-tahasang simuno ng Griyego.
