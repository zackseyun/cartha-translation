base_translation:
  language: en
  yaml_path: translation/nt/jude/001/023.yaml
  text: save others by snatching them out of the fire[a]; and have mercy on others with fear[d][c][b], hating even the tunic stained by the flesh.
translation:
  language: tl
  text: Iligtas ninyo ang iba sa pamamagitan ng pag-agaw sa kanila mula sa apoy[a]. Sa iba naman ay maawa kayo nang may takot[b], habang kinapopootan ninyo maging ang damit na nadungisan ng laman[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sagipin ninyo ang iba, habang inaagaw ninyo sila mula sa apoy.” Maaaring tumukoy ang larawan sa nalalapit na paghuhukom o sa matinding espirituwal na panganib.
    reason: alternative_reading
  - marker: b
    text: Ang “nang may takot” ay maaaring mangahulugang may mapitagang takot sa Diyos o may pag-iingat upang hindi rin madungisan ng kasamaan.
    reason: lexical_alternative
  - marker: c
    text: O “maging ang tunikang nadungisan ng makasalanang kalikasan.” Sa Griyego, “laman”; ang χιτών ay isang kasuotang panloob o tunika.
    reason: lexical_alternative
lexical_decisions:
- source_word: σῴζετε
  choice: iligtas ninyo
  rationale: Pinananatili nito ang bigat ng pandiwang 'magligtas' at ang pautos na diwa sa konteksto, habang ang kasunod na parirala ang nagpapakita ng agarang pagsagip.
- source_word: ἐκ πυρὸς ἁρπάζοντες
  choice: sa pamamagitan ng pag-agaw sa kanila mula sa apoy
  rationale: Ipinakikita ng participle ang paraan ng pagliligtas; ang 'pag-agaw' ay naghahatid ng puwersa at pagmamadali ng larawan.
- source_word: ἐλεᾶτε
  choice: maawa kayo
  rationale: Natural at tuwirang pautos sa modernong Tagalog, na hindi nawawala ang diwa ng aktibong pagpapakita ng awa.
- source_word: ἐν φόβῳ
  choice: nang may takot
  rationale: Pinananatili ang tunay na kalabuan kung ito ay takot sa Diyos, maingat na pag-iwas sa pagkahawa ng kasamaan, o kapuwa.
- source_word: μισοῦντες
  choice: na kinapopootan
  rationale: Pinananatili ang matalim na moral na pagtutol na kaakibat ng pagpapakita ng awa, nang hindi ipinahihiwatig na ang tao mismo ang kinapopootan.
- source_word: χιτῶνα
  choice: damit
  rationale: Bagaman tumutukoy ang χιτών sa kasuotang panloob o tunika, mas malinaw at natural sa karaniwang mambabasang Tagalog ang 'damit'; ipinapaliwanag sa talababa ang mas tiyak na kahulugan.
- source_word: ἐσπιλωμένον
  choice: nadungisan
  rationale: Ang anyo ay nagpapahayag ng kalagayang nadungisan na; ang salitang ito ay angkop kapuwa sa larawan ng damit at sa moral na karumihan.
- source_word: σάρξ
  choice: laman
  rationale: Tuwirang pinananatili ang metapora ng Griyego at iniiwasang gawing tahasang 'makasalanang kalikasan' ang isang pariralang may interpretatibong kalabuan.
theological_decisions:
- issue: Kahulugan ng 'apoy' sa larawan ng pagsagip
  choice: Panatilihin ang 'apoy' nang hindi tinutukoy sa pangunahing teksto kung ito ay pangwakas na paghuhukom o kasalukuyang espirituwal na panganib.
  alternative: Tahasan itong tukuyin bilang impiyerno, paghuhukom, o mapaminsalang espirituwal na kalagayan.
  rationale: Hindi tahasang nililinaw ng talata ang tinutukoy ng apoy, kaya pinananatili ang lakas at kalabuan ng larawan.
- issue: Kahulugan ng σάρξ sa 'nadungisan ng laman'
  choice: Gamitin ang 'laman' sa pangunahing teksto.
  alternative: makasalanang kalikasan
  rationale: Ang parirala ay tumutukoy sa moral na karumihan, ngunit ang 'laman' ang nagpapanatili sa metapora at hindi nagpapasok ng mas sistematikong paliwanag sa teksto.
- issue: Saklaw ng 'nang may takot'
  choice: Iugnay ito sa paraan ng pagpapakita ng awa nang hindi nilulutas ang uri ng takot.
  alternative: Isalin bilang 'nang may paggalang sa Diyos' o 'nang may pag-iingat.'
  rationale: Maaaring tumukoy ang φόβος sa mapitagang takot sa Diyos o sa maingat na pag-iwas na madungisan din; kapuwa makatwiran sa konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang 'ninyo/kayo' upang malinaw ang pautos na maramihan. Pinanatili ang matingkad na larawan ng apoy, pag-agaw, dungis, at laman, habang iniwasan ang arkaikong bokabularyo at labis na interpretasyon.
