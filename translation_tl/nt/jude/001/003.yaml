    issue: “Minsan at magpakailanman” para sa ἅπαξ
    rationale: Ang “magpakailanman” ay karaniwang nagsasaad ng kawalang-hanggan, hindi ng minsanan at tiyak na pagkilos. Ang “minsanan nang” ay mas natural na naghahatid ng force ng ἅπαξ sa ugnayan nito sa pagkakapasa.
  - severity: medium
    issue: “Ipinagkatiwala” para sa παραδοθείσῃ
    rationale: Bagaman posible sa mas maluwag na pagpapakahulugan, ang pandiwang ito ay maaaring magpahiwatig na ang mga banal ay inatasang mangasiwa. Ang παραδίδωμι dito ay mas tuwirang “ipinasa” o “inihatid.”
