id: JUD.1.3
reference: Jude 1:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἀγαπητοί, πᾶσαν σπουδὴν ποιούμενος γράφειν ὑμῖν περὶ τῆς κοινῆς ⸀ἡμῶν σωτηρίας ἀνάγκην ἔσχον γράψαι ὑμῖν παρακαλῶν ἐπαγωνίζεσθαι τῇ ἅπαξ παραδοθείσῃ τοῖς ἁγίοις πίστει.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/003.yaml
  text: Beloved[a], although I was making every effort to write to you about our common salvation, I found it necessary to write[d][c][b], urging you to contend earnestly for the faith once for all delivered to the saints.
translation:
  language: tl
  text: Mga minamahal, bagaman buong sikap akong naghahangad na sumulat sa inyo tungkol sa kaligtasang pinagsasaluhan natin, nakita kong kailangang sumulat upang himukin kayong puspusang ipaglaban ang pananampalataya[a] na minsanan nang ipinasa[b] sa mga banal.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dito, ang “pananampalataya” ay malamang na tumutukoy sa kabuuan ng aral at paniniwalang Kristiyano na ipinasa sa mga mananampalataya, hindi lamang sa personal na kilos ng paniniwala.
    reason: alternative_reading
  - marker: b
    text: O, “ipinagkatiwala.” Binibigyang-diin nito ang pagkakapasa ng aral sa sambayanan.
    reason: lexical_alternative
  - marker: c
    text: Ang “mga banal” ay tumutukoy sa banal na bayan ng Diyos, samakatuwid, sa mga mananampalataya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Mga minamahal
  rationale: Pinananatili nito ang magiliw na panawagan at ang tuwirang kaugnayan nito sa pag-ibig, sa natural at marangal na Tagalog.
- source_word: πᾶσαν σπουδὴν ποιούμενος
  choice: bagaman buong sikap kong nais
  rationale: Ipinahihiwatig ng idyoma ang matinding sigasig at pagsisikap. Ang 'bagaman' ay nagpapakita ng kontras sa sumunod na pangangailangang baguhin ang paksa ng liham.
- source_word: περὶ τῆς κοινῆς ἡμῶν σωτηρίας
  choice: tungkol sa kaligtasang pinagsasaluhan natin
  rationale: Ang κοινῆς ay tumutukoy sa kaligtasang magkakasamang taglay o pinakikinabangan ng manunulat at ng mga mambabasa.
- source_word: ἀνάγκην ἔσχον
  choice: nakita kong kailangang
  rationale: Natural itong katumbas ng idyomang nagsasaad ng pangangailangang dulot ng kalagayan, nang hindi labis na ipinahihiwatig na sapilitang pinakilos ang manunulat.
- source_word: παρακαλῶν
  choice: upang himukin
  rationale: Ipinapahayag nito ang taimtim na pakiusap o paghimok na siyang layunin ng pagsulat.
- source_word: ἐπαγωνίζεσθαι
  choice: puspusang ipaglaban
  rationale: Inihahatid ng 'puspusan' ang pinatinding diwa ng pandiwa, samantalang ang 'ipaglaban' ay malinaw na nagsasaad ng matatag na pagtatanggol.
- source_word: τῇ ... πίστει
  choice: ang pananampalataya
  rationale: Sa kontekstong ipinagkatiwala ito sa sambayanan, malamang na tumutukoy ito sa nilalaman ng paniniwalang Cristiano, ngunit pinananatili ng salin ang karaniwang terminong may likas na lawak.
- source_word: ἅπαξ
  choice: minsan at magpakailanman
  rationale: Ipinakikita nito ang tiyak at hindi na inuulit na katangian ng pagkakatiwala, na akma sa puwersa ng ἅπαξ sa konteksto.
- source_word: παραδοθείσῃ
  choice: ipinagkatiwala
  rationale: Sinasalamin nito ang paghahatid ng isang mahalagang aral sa pangangalaga ng sambayanan; ang mas tuwirang diwang 'ipinasa' ay itinatala sa talababa.
- source_word: τοῖς ἁγίοις
  choice: sa mga banal
  rationale: Pinananatili nito ang katawagang ἅγιοι para sa mga taong ibinukod para sa Diyos, habang nililinaw sa talababa na tumutukoy ito sa mga mananampalataya.
theological_decisions:
- issue: Kahulugan ng τῇ πίστει
  choice: Ang kabuuan ng pananampalatayang itinuro at ipinagkatiwala sa sambayanan
  alternative: Ang personal na pagtitiwala o paniniwala ng bawat mananampalataya
  rationale: Ang paglalarawang ito bilang minsan at magpakailanman na ipinagkatiwala sa mga banal ay higit na angkop sa isang kalipunan ng turo o ipinahahayag na paniniwala, hindi lamang sa kilos ng personal na pananalig.
- issue: Puwersa ng ἅπαξ παραδοθείσῃ
  choice: Tiyak at minsan lamang na pagkakatiwala
  alternative: Isang pagkakatiwalang minsang naganap, nang walang tahasang diin sa pagiging pangwakas
  rationale: Sa kontekstong ito, ang ἅπαξ ay may malakas na diwa ng isang minsanang gawa na hindi na kailangang ulitin; gayunman, hindi nito tinutukoy ang lahat ng paraan ng patuloy na pagpapahayag o pagtuturo ng pananampalataya.
translation_notes:
  register: Modernong Filipino Tagalog na magalang at pastoral ang himig. Pinanatili ang pag-uulit ng “sumulat” upang katawanin ang γράφειν ... γράψαι, ngunit hindi na inulit ang “sa inyo” sa ikalawang sugnay para sa likas na daloy. Ginamit ang “puspusang ipaglaban” upang ihatid ang tindi ng ἐπαγωνίζεσθαι nang hindi ginagawang tahasang marahas ang pahayag.
