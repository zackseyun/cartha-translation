revisions:
- from: Mga minamahal, bagaman buong sikap kong nais na sumulat sa inyo tungkol sa kaligtasang pinagsasaluhan natin, nakita kong kailangang sumulat upang himukin kayong puspusang ipaglaban ang pananampalataya[a] na minsan at magpakailanman ay ipinagkatiwala[b] sa mga banal.[c]
  to: Mga minamahal, bagaman buong sikap akong naghahangad na sumulat sa inyo tungkol sa kaligtasang pinagsasaluhan natin, nakita kong kailangang sumulat upang himukin kayong puspusang ipaglaban ang pananampalataya[a] na minsanan nang ipinasa[b] sa mga banal.[c]
  rationale: Inayos ang unang sugnay upang mas natural na katawanin ang masigasig na layon ng manunulat. Pinalitan ang “minsan at magpakailanman” ng “minsanan nang” upang ipahayag ang minsanan at tiyak na pagkakapasa nang hindi nagpapahiwatig ng walang-hanggang proseso. Ginawang “ipinasa” ang pangunahing salin ng παραδοθείσῃ, at inilipat ang “ipinagkatiwala” sa talababa bilang leksikal na alternatibo. Pinanatili ang lawak ng “pananampalataya” sa teksto at ang paliwanag nito sa talababa.
