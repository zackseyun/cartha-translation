  verdict: revise
  source_fidelity: Kailangan ang ilang pagbabago para mas tumpak na maihatid ang aspektong di-ganap ng πᾶσαν σπουδὴν ποιούμενος at ang kahulugan ng ἅπαξ παραδοθείσῃ. Ang “minsan at magpakailanman” ay maaaring mangahulugang walang-hanggang nagaganap ang pagkakatiwala, samantalang ang Griyego ay tumutukoy sa minsanan at tiyak na pagkakapasa. Ang “ipinasa” ay mas tuwirang katumbas ng παραδοθείσῃ kaysa “ipinagkatiwala,” na nagdaragdag ng diwang pag-aatas ng pangangalaga.
  naturalness: Ang “buong sikap kong nais na sumulat” ay hindi gaanong likas at bahagyang lumilihis tungo sa simpleng pagnanais. Ang “buong sikap akong nagsisikap na sumulat” ay malinaw ngunit paulit-ulit; ang “buong sikap akong naghahangad na sumulat” ay mas maayos at pinananatili ang masigasig na layon. Ang binagong pangungusap ay nananatiling magalang at pastoral sa modernong Filipino.
  terminology: Ang “Mga minamahal,” “kaligtasang pinagsasaluhan natin,” “pananampalataya,” at “mga banal” ay angkop. Pinalitan ang baybay na “Cristiano” ng karaniwang modernong “Kristiyano.” Ang talababa tungkol sa “mga banal” ay ginawang paliwanag na walang di-kinakailangang polemikal na paghahambing.
