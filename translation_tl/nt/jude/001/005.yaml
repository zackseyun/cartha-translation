id: JUD.1.5
reference: Jude 1:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ὑπομνῆσαι δὲ ὑμᾶς βούλομαι, εἰδότας ⸂ὑμᾶς ἅπαξ⸃ ⸀πάντα, ὅτι ⸀Ἰησοῦς λαὸν ἐκ γῆς Αἰγύπτου σώσας τὸ δεύτερον τοὺς μὴ πιστεύσαντας ἀπώλεσεν,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/005.yaml
  text: I want to remind you[a], though you know all things once for all, that Jesus, having saved a people out of the land of Egypt, afterward destroyed those who did not believe.
translation:
  language: tl
  text: Nais ko kayong paalalahanan[a], bagaman minsan na ninyong nalaman ang lahat ng ito, na si Jesus, matapos magligtas ng isang bayan mula sa lupain ng Ehipto, ay nilipol naman ang mga hindi sumampalataya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang manuskrito, “ang Panginoon” o “ang Diyos” ang mababasa sa halip na “Jesus.”
    reason: textual_variant
lexical_decisions:
- source_word: Ὑπομνῆσαι ... βούλομαι
  choice: Nais ko kayong paalalahanan
  rationale: Likas at marangal na Filipino para sa pagpapahayag ng hangaring ipagunita sa mga mambabasa ang alam na nila.
- source_word: εἰδότας ὑμᾶς ἅπαξ πάντα
  choice: bagaman alam na ninyo ang lahat ng ito minsan at magpakailanman
  rationale: Ipinapahayag ang concessive na diwa ng participle at pinananatili ang lakas ng ἅπαξ bilang kaalamang natanggap nang minsan at may nananatiling bisa; ang πάντα ay inuunawa ayon sa konteksto bilang 'lahat ng ito.'
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Tuwirang isinasalin ang pagbasa ng SBLGNT at pinananatili ang matinding kristolohikal na pahayag tungkol sa paglabas mula sa Egipto.
- source_word: λαὸν
  choice: isang bayan
  rationale: Pinananatili ang panlahatang diwa ng anarthrous λαόν nang hindi labis na tinutukoy ang reperente.
- source_word: ἐκ γῆς Αἰγύπτου
  choice: mula sa lupain ng Egipto
  rationale: Pinananatili ang malinaw na alingawngaw ng wika ng Exodo.
- source_word: σώσας
  choice: matapos iligtas
  rationale: Malinaw na ipinahihiwatig na nauna ang pagliligtas sa pangunahing kilos ng paglipol.
- source_word: τὸ δεύτερον
  choice: pagkatapos
  rationale: Natural na Filipino para sa kasunod na kilos; iniiwasan ang malabong literal na 'sa ikalawang pagkakataon.'
- source_word: τοὺς μὴ πιστεύσαντας
  choice: ang mga hindi sumampalataya
  rationale: Karaniwang biblikal ngunit nauunawaang salin ng pagkabigong maniwala o magtiwala.
- source_word: ἀπώλεσεν
  choice: nilipol niya
  rationale: Tuwiran at mabigat na salitang angkop sa hatol na sinasaad ng pandiwa.
theological_decisions:
- issue: Ang kristolohikal na simuno sa pangungusap tungkol sa Exodo
  choice: Jesus sa pangunahing teksto
  alternative: ang Panginoon; ang Diyos
  rationale: Ἰησοῦς ang nasa ibinigay na tekstong Griyego. Pinananatili nito ang tunay at mahalagang teolohikal na tensiyon sa halip na pahinain o iayon sa ibang pagbasa.
- issue: Saklaw ng πάντα
  choice: lahat ng ito
  alternative: lahat ng bagay
  rationale: Sa konteksto, tumutukoy ito sa magkakasunod na halimbawang pangkasaysayan na ipinagugunita ni Judas, hindi kinakailangang sa ganap na kaalaman sa lahat ng bagay.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang maramihang magalang na 'kayo/ninyo' at ang karaniwang biblikal na 'sumampalataya.' Ang bantas na tutuldok ay nililinaw na ang sumusunod ay nilalaman ng paalala.
