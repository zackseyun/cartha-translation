  naturalness: Natural at angkop ang “nilalait” at “mga hayop na walang katwiran.” Mas malinaw at mas idiomatiko ang “anumang nalalaman nila nang likas” kaysa “anumang likas nilang nalalaman,” na maaaring magpahiwatig na likas na taglay nila ang kaalaman imbes na likas ang paraan ng pag-alam.
  terminology: Ang “nilalait” ay angkop na salin ng βλασφημοῦσιν sa kontekstong ito at hindi sapilitang nililimitahan sa pagsasalita laban sa Diyos. Ang “walang katwiran” ay tumpak at marangal para sa ἄλογα. Ang “napapahamak” ay pinananatiling bukas ang saklaw ng φθείρονται—pagkasira, katiwalian, o kapahamakan—nang hindi nag-uutos ng isang partikular na teolohikal na pagbasa.
