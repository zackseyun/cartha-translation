  to: Ngunit nilalait ng mga taong ito ang anumang hindi nila nauunawaan[a]. At ang anumang nalalaman nila nang likas, gaya ng mga hayop na walang katwiran[b], sa mga bagay na iyon ay napapahamak sila[c].
