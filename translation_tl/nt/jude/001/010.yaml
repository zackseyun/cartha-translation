  text: οὗτοι δὲ ὅσα μὲν οὐκ οἴδασιν βλασφημοῦσιν, ὅσα δὲ φυσικῶς ὡς τὰ ἄλογα ζῷα ἐπίστανται, ἐν τούτοις φθείρονται.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/010.yaml
  text: But these people slander whatever they do not understand[a], and whatever they understand naturally, like irrational animals[c][b], by these things they are corrupted.
translation:
  language: tl
  text: Ngunit nilalait ng mga taong ito ang anumang hindi nila nauunawaan[a]. At ang anumang nalalaman nila nang likas, gaya ng mga hayop na walang katwiran[b], sa mga bagay na iyon ay napapahamak sila[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nilalapastangan” ang anumang hindi nila nalalaman.
    reason: lexical_alternative
  - marker: b
    text: O “anumang nalalaman nila nang likas, tulad ng mga hayop na hindi nangangatuwiran.”
    reason: lexical_alternative
  - marker: c
    text: O “sa mga bagay na ito sila nasisira.”
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: mga taong ito
  rationale: Malinaw na tumutukoy sa mga mapanlinlang na taong tinuligsa sa konteksto, nang hindi ipinapalagay na mga lalaki lamang sila.
- source_word: βλασφημοῦσιν
  choice: nilalait
  rationale: Saklaw nito ang mapang-abusong pagsasalita laban sa hindi nila nauunawaan, nang hindi nililimitahan ang diwa sa tahasang paglapastangan sa Diyos.
- source_word: ὅσα μὲν οὐκ οἴδασιν
  choice: ang anumang hindi nila nauunawaan
  rationale: Sa paghahambing sa likas na kaalaman sa kasunod na sugnay, ang punto ay kawalan ng pagkaunawa, hindi lamang kawalan ng impormasyon.
- source_word: φυσικῶς
  choice: likas nilang
  rationale: Natural at maikli sa Filipino, at ipinapahayag ang kaalamang nagmumula sa likas na hilig o pandama.
- source_word: ἄλογα ζῷα
  choice: mga hayop na walang katwiran
  rationale: Pinananatili ang paghahambing sa mga nilalang na walang kakayahang mangatuwiran, sa dignified at madaling maunawaang pananalita.
- source_word: ἐπίστανται
  choice: nalalaman
  rationale: Ang pandiwa ay tumutukoy sa limitadong kaalamang likas sa kanila; ang “nalalaman” ay malinaw at natural sa pagkakaiba nito sa tunay na pagkaunawa.
- source_word: ἐν τούτοις
  choice: siya ring
  rationale: Ikinakabit nito ang kapahamakan sa mismong mga bagay na likas nilang nalalaman at sinusunod; ipinaliliwanag sa talababa ang mas literal na “sa mga bagay na ito.”
- source_word: φθείρονται
  choice: nagpapahamak sa kanila
  rationale: Ipinahahayag ang pagkapinsala o pagkaranas ng kapahamakan na dulot ng mga bagay na iyon, habang iniiwasang limitahan ang salita sa moral na katiwalian lamang.
theological_decisions:
- issue: Diwa ng βλασφημέω kapag hindi tahasang Diyos ang layon
  choice: nilalait
  alternative: nilalapastangan
  rationale: Hinahatulan ng talata ang mapang-abusong pagsasalita tungkol sa hindi nila nauunawaan. Hindi ipinapalagay ng salin na Diyos lamang ang tuwirang pinatutungkulan.
- issue: Diwa ng φθείρονται
  choice: nagpapahamak sa kanila
  alternative: sa mga bagay na ito sila nasisira
  rationale: Maaaring tumukoy ang anyo sa pagkasira, katiwalian, o tuluyang kapahamakan. Pinananatili ng pangunahing salin ang mabigat na bunga at ang ugnayang sanhi, habang inilalahad sa talababa ang mas literal at mas bukas na alternatibo.
translation_notes:
  register: Modernong Filipino na dignified ngunit madaling maunawaan. Ginamit ang “walang katwiran” sa halip na mas teknikal na “irasyonal,” at iniwasan ang sobrang kolokyal o denominasyonal na pananalita.
