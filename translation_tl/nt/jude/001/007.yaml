id: JUD.1.7
reference: Jude 1:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὡς Σόδομα καὶ Γόμορρα καὶ αἱ περὶ αὐτὰς πόλεις, τὸν ὅμοιον ⸂τρόπον τούτοις⸃ ἐκπορνεύσασαι καὶ ἀπελθοῦσαι ὀπίσω σαρκὸς ἑτέρας, πρόκεινται δεῖγμα πυρὸς αἰωνίου δίκην ὑπέχουσαι.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/007.yaml
  text: just as Sodom and Gomorrah and the cities around them[a], having in like manner committed sexual immorality and gone after other flesh, are set forth as an example[b], undergoing the punishment of eternal fire.
translation:
  language: tl
  text: Tulad ng Sodoma at Gomorra at ng mga lunsod sa paligid ng mga ito, na sa katulad na paraan[a] ay nagpakasasa sa seksuwal na imoralidad at naghabol sa ibang laman[b], ay inilalahad bilang isang halimbawa habang dinaranas nila ang kaparusahan ng walang-hanggang apoy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na pananalita, “sa paraang katulad ng mga ito.” Maaaring tumukoy ang “mga ito” sa mga anghel na binanggit sa talata 6 o, sa mas malawak na diwa, sa mga naunang halimbawa ng paghihimagsik at paghatol.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “naiibang laman”; ayon sa tradisyon, “kakaibang laman.” Pinanatiling literal ang parirala at hindi nilimitahan sa isang tiyak na interpretasyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: Tulad ng
  rationale: Malinaw at likas na ipinakikilala nito ang paghahambing sa mga naunang halimbawa.
- source_word: Σόδομα καὶ Γόμορρα
  choice: Sodoma at Gomorra
  rationale: Ginamit ang karaniwang anyong Filipino ng mga pangalang ito sa Bibliya.
- source_word: αἱ περὶ αὐτὰς πόλεις
  choice: ang mga lunsod sa paligid ng mga ito
  rationale: Pinananatili ang heograpikong diwa ng περὶ kasama ng accusative sa natural na Tagalog.
- source_word: τὸν ὅμοιον τρόπον τούτοις
  choice: sa gayunding paraan
  rationale: Pinananatili ang paghahambing ngunit hindi sapilitang tinutukoy kung sino ang tinutukoy ng τούτοις; inilalahad sa talababa ang mas literal na anyo.
- source_word: ἐκπορνεύσασαι
  choice: nagpakasasa sa seksuwal na imoralidad
  rationale: Tuwirang ipinahahayag ang seksuwal na kasalanan at naipadarama ang matinding diwa ng tambalang pandiwa nang hindi gumagamit ng malabong eupemismo.
- source_word: ἀπελθοῦσαι ὀπίσω
  choice: naghabol sa
  rationale: Likas na idyomang Filipino na nagpapanatili sa larawan ng paghahangad o paghabol.
- source_word: σαρκὸς ἑτέρας
  choice: ibang laman
  rationale: Literal na pinananatili ang σάρξ at ang diwa ng ἑτέρας nang hindi nililimitahan ang parirala sa isang pinagtatalunang interpretasyon.
- source_word: πρόκεινται
  choice: inilalantad sila
  rationale: Ipinahahayag ang diwa ng hayagang paglalagay o paghaharap sa paningin bilang kapansin-pansing halimbawa.
- source_word: δεῖγμα
  choice: isang halimbawa
  rationale: Tuwirang katumbas na ang babalang puwersa ay malinaw mula sa konteksto ng kaparusahan.
- source_word: πυρὸς αἰωνίου
  choice: ng walang-hanggang apoy
  rationale: Tuwirang pinananatili ang bigat ng αἰωνίου nang hindi ito pinalalawak bilang sistematikong pahayag.
- source_word: δίκην ὑπέχουσαι
  choice: habang dinaranas nila ang parusa
  rationale: Pinananatili ang hudisyal na diwa ng idyoma at ang kasabay na participial na ugnayan sa pangunahing pandiwa.
theological_decisions:
- issue: Ang tinutukoy ng τούτοις sa τὸν ὅμοιον τρόπον τούτοις
  choice: 'Ginawang di-tiyak ang pangunahing teksto: “sa gayunding paraan.”'
  alternative: “sa paraang katulad ng mga ito,” na maaaring tumukoy sa mga anghel sa talata 6 o sa mas malawak na mga naunang halimbawa ng paghihimagsik at paghatol.
  rationale: Tiyak ang paghahambing sa Griyego ngunit pinagtatalunan ang antecedent ng panghalip; hindi dapat sapilitang lutasin ng salin ang tunay na kalabuan.
- issue: Kahulugan ng σαρκὸς ἑτέρας
  choice: “ibang laman”
  alternative: “naiibang laman” o isang mas tiyak na pagpapakahulugang tumutukoy sa homoseksuwal na gawain o sa pagtawid sa hangganan ng mga anghel at tao.
  rationale: Literal at sadyang hindi tiyak ang parirala sa konteksto; pinananatili ng salin ang teolohikal at interpretatibong tensiyon.
- issue: Puwersa ng πυρὸς αἰωνίου
  choice: “walang-hanggang apoy”
  alternative: “apoy na walang hanggan”
  rationale: Tuwirang isinasalin ang pananalita ng teksto nang hindi pinahihina o pinalalawak lampas sa sinasabi ng talata.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang literal na “ibang laman” dahil mahalaga ang sadyang kalabuan nito, samantalang ginawang likas sa Tagalog ang balangkas ng pangungusap at ang mga participle.
