  text: ὑμεῖς δέ, ἀγαπητοί, ⸂ἐποικοδομοῦντες ἑαυτοὺς τῇ ἁγιωτάτῃ ὑμῶν πίστει⸃, ἐν πνεύματι ἁγίῳ προσευχόμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/020.yaml
  text: But you[a], beloved, building yourselves up in your most holy faith and praying in the Holy Spirit[c][b],
translation:
  language: tl
  text: Ngunit kayo, mga minamahal, patuloy ninyong patatagin ang inyong mga sarili sa inyong kabanal-banalang pananampalataya[a], at manalangin sa Banal na Espiritu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nakasalig sa inyong kabanal-banalang pananampalataya.” Maaaring ilarawan ng Griyego ang pananampalataya bilang saligang pinagtatayuan, gayundin bilang kaugnayan kung saan pinatatatag ang mga sarili. Ang “pananampalataya” ay maaari ring mangahulugang “pagtitiwala” o “katapatan,” ngunit dito ay malamang na tumutukoy sa pananampalatayang sama-samang pinanghahawakan ng pamayanan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa pamamagitan ng Banal na Espiritu.” Maaaring idiin ng parirala ang pananalangin sa saklaw o impluwensiya ng Espiritu, o ang Espiritu bilang nagbibigay-kakayahan sa pananalangin.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: Ngunit kayo
  rationale: Ipinakikita ng δέ ang pagsalungat sa mga taong binanggit sa naunang konteksto, at binibigyang-diin ng tahasang ὑμεῖς ang mga kausap.
- source_word: ἀγαπητοί
  choice: mga minamahal
  rationale: Pinananatili nito ang magiliw ngunit marangal na tawag sa mga kapwa mananampalataya nang hindi nagiging masyadong kolokyal.
- source_word: ἐποικοδομοῦντες ἑαυτούς
  choice: patatagin ninyo ang inyong sarili
  rationale: Natural sa modernong Tagalog ang 'patatagin' para sa metapora ng pagpapatibay o pagtatayo. Ang pangmaramihang 'kayo' at kolektibong 'inyong sarili' ay nagpapanatili sa reflexive at panlahatang diwa.
- source_word: τῇ ἁγιωτάτῃ ὑμῶν πίστει
  choice: sa inyong kabanal-banalang pananampalataya
  rationale: Ang 'sa' ay sadyang maluwag upang maipahiwatig ang kaugnayan o saligan ng pagpapatatag. Isinasalin ng 'kabanal-banalang' ang superlatibong ἁγιωτάτῃ, at ng 'pananampalataya' ang πίστις sa malamang na diwa ng sama-samang pananampalatayang Kristiyano.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: sa Banal na Espiritu
  rationale: Pinakamalamang na tumutukoy ito sa banal na Espiritu. Pinananatili ng 'sa' ang posibilidad na tumukoy ang ἐν sa saklaw o impluwensiya, nang hindi tahasang nililimitahan ito sa instrumental na diwa.
- source_word: προσευχόμενοι
  choice: habang nananalangin
  rationale: Pinananatili nito ang kasabay na kilos ng participle at ang bukas na daloy ng pangungusap patungo sa susunod na talata.
theological_decisions:
- issue: Diwa ng πίστις sa 'inyong kabanal-banalang pananampalataya'
  choice: Ang pananampalatayang pinanghahawakan ng pamayanan ng mga mananampalataya
  alternative: Personal na pagtitiwala o katapatan
  rationale: Sa liham ni Judas, ang 'pananampalataya' ay malamang na tumutukoy sa ibinahaging pananampalatayang tinanggap ng pamayanan. Gayunman, hindi lubusang isinasara ng salin ang mas personal na diwa ng pagtitiwala.
- issue: Tinutukoy ng ἐν πνεύματι ἁγίῳ
  choice: Ang Banal na Espiritu
  alternative: Isang banal na disposisyon ng espiritu ng tao
  rationale: Sa gamit ng unang mga Kristiyano at sa konteksto ng pananalangin, mas natural itong tumukoy sa Banal na Espiritu, bagaman walang artikulo ang parirala sa Griyego.
- issue: Gamit ng ἐν sa pananalangin
  choice: sa Banal na Espiritu
  alternative: sa pamamagitan ng Banal na Espiritu
  rationale: Hindi tiyak kung higit na binibigyang-diin ang saklaw o impluwensiya ng Espiritu o ang kanyang pagkilos bilang tagapagbigay-kakayahan. Pinananatili ng 'sa' ang tensiyong ito, at inilalagay sa talababa ang instrumental na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang pautos na 'patatagin ninyo' upang maging natural ang lakas ng panghihikayat ng participle sa konteksto, habang ang 'habang nananalangin' ay nagpapanatili sa participial na ugnayan at sa pagpapatuloy ng pangungusap.
