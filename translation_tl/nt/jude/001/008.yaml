  text: Ὁμοίως μέντοι καὶ οὗτοι ἐνυπνιαζόμενοι σάρκα μὲν μιαίνουσιν, κυριότητα δὲ ἀθετοῦσιν, δόξας δὲ βλασφημοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/008.yaml
  text: Yet in the same way, these people also, relying on dreams, defile the flesh, reject authority, and slander glorious ones.
translation:
  language: tl
  text: Gayunman, tulad din nila, ang mga taong ito, na nananaginip,[a] ay dinudungisan ang laman, itinatakwil ang kapamahalaan, at nilalait ang mga maluwalhati.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “na umaasa sa mga panaginip” o “na ibinabatay ang kanilang ginagawa sa mga panaginip.” Ang participle sa Griyego ay maaaring tumukoy lamang sa pananaginip, ngunit maaari rin nitong ipahiwatig na ginagamit nila ang mga panaginip bilang batayan ng kanilang asal.'
    reason: lexical_alternative
  - marker: b
    text: 'Ang “mga maluwalhati” ay malamang na tumutukoy sa matataas na nilalang sa langit, marahil sa mga anghel. Sa Griyego: “mga kaluwalhatian.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁμοίως μέντοι
  choice: Gayunman, tulad nila
  rationale: Pinananatili ng “Gayunman” ang bahagyang pagsalungat ng μέντοι, samantalang inuugnay ng “tulad nila” ang οὗτοι sa naunang mga halimbawang binanggit sa konteksto.
- source_word: οὗτοι
  choice: ang mga taong ito rin
  rationale: Likas at malinaw sa modernong Tagalog; hindi ito nagdaragdag ng pahiwatig na lalaki lamang ang tinutukoy.
- source_word: ἐνυπνιαζόμενοι
  choice: na umaasa sa mga panaginip
  rationale: Ipinahahayag ang malamang na diwang ang kanilang asal ay ibinabatay nila sa mga panaginip, habang inilalagay sa talababa ang mas pormal na saling “nananaginip.”
- source_word: σάρκα
  choice: ang laman
  rationale: Pinananatili ang kongkretong salitang Griyego nang hindi ito nililimitahan sa “katawan” o binibigyan ng teknikal na kahulugang “makasalanang kalikasan.”
- source_word: μιαίνουσιν
  choice: dinudungisan
  rationale: Ang “dinudungisan” ay angkop sa moral at ritwal na puwersa ng pandiwa at sa matinding tono ng liham.
- source_word: κυριότητα
  choice: ang kapamahalaan
  rationale: Pinananatili ang lawak ng κυριότης—maaaring tumukoy sa paghahari, pagka-Panginoon, o saklaw ng awtoridad—nang hindi tiyak na ipinapako ang tinutukoy.
- source_word: ἀθετοῦσιν
  choice: itinatakwil
  rationale: Malakas at tuwirang katumbas ng pagtanggi o pagtataboy sa bagay na dapat kilalanin.
- source_word: δόξας
  choice: ang mga maluwalhati
  rationale: Isinasalin ang pangmaramihang “mga kaluwalhatian” bilang mga nilalang o persona na maluwalhati, ngunit hindi agad tinutukoy bilang mga anghel.
- source_word: βλασφημοῦσιν
  choice: nilalait
  rationale: Malinaw na tumutukoy sa mapang-abuso at mapanirang pananalita; hindi nito nililimitahan ang pandiwa sa pamumusong laban sa Diyos lamang.
theological_decisions:
- issue: Ang tinutukoy ng δόξας
  choice: malawak na katawagan para sa mga nilalang na dakila o maluwalhati
  alternative: mga anghel; mga makalangit na kamahalan; abstraktong “mga kaluwalhatian”
  rationale: Ipinahihiwatig ng kasunod na talata ang mga makalangit na nilalang, ngunit hindi tahasang sinasabi ng pangngalan na “mga anghel.” Pinananatili ng pangunahing teksto ang lawak ng Griyego at ipinapaliwanag sa talababa ang malamang na tinutukoy.
- issue: Puwersa ng ἐνυπνιαζόμενοι
  choice: iniuugnay ang kanilang kilos sa pag-asa o pagbabatay sa mga panaginip
  alternative: nanaginip lamang sila; kumikilos habang nananaginip
  rationale: Maaaring ilarawan ng participle ang batayan o paraan ng kanilang pagkilos. Ipinahahayag ito ng pangunahing salin, ngunit pinananatili sa talababa ang mas literal at hindi gaanong interpretibong alternatibo.
- issue: Ang tinutukoy ng κυριότητα
  choice: hindi tinukoy na kapamahalaan o paghahari
  alternative: pagka-Panginoon ng Diyos o ni Cristo; kapamahalaan ng mga anghel; awtoridad sa pangkalahatan
  rationale: Hindi sapat na tiyak ang anyong Griyego upang tahasang tukuyin ang mayhawak ng kapamahalaan. Kaya hindi nilulutas ng salin ang teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “laman,” “kapamahalaan,” at “mga maluwalhati” upang mapanatili ang mahahalagang ambiguidad ng Griyego; iniwasan ang mas teknikal o denominasyonal na pagpapaliwanag sa pangunahing teksto.
