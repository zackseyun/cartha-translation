  source_fidelity: Tumpak ang “At mahabag kayo sa mga nag-aalinlangan” para sa καὶ οὓς μὲν ἐλεᾶτε διακρινομένους. Naipapahayag ng “mahabag kayo sa” ang pautos na ἐλεᾶτε, at ang “mga nag-aalinlangan” ay isang makatuwirang pangunahing pagbasa ng διακρινομένους. Hindi pinipilit ng salin ang di-isinasaad na katumbas ng μέν, na natural dahil ang kaagapay nitong ayos ay nagpapatuloy sa susunod na talata.
