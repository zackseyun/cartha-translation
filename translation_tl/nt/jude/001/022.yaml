  text: καὶ οὓς μὲν ⸀ἐλεᾶτε ⸂διακρινομένους,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/022.yaml
  text: And have mercy on those who are doubting,[a]
translation:
  language: tl
  text: At mahabag kayo sa mga nag-aalinlangan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga nag-uurong-sulong”; maaari ring “mga nakikipagtalo.” Maaaring magtaglay ng higit sa isang diwa ang participle sa Griyego sa kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Payak na pang-ugnay ito sa naunang mga tagubilin; natural at tuwiran ang “At” sa Filipino.
- source_word: οὓς μὲν
  choice: sa mga
  rationale: Tumutukoy ito sa isang pangkat sa loob ng sunod-sunod na pangkat. Hindi kailangang tahasang isalin ang μέν bilang “sa isang banda,” dahil mabigat iyon sa Filipino at makukumpleto ang paghahambing sa kasunod na talata.
- source_word: ἐλεᾶτε
  choice: mahabag kayo sa
  rationale: Ipinahahayag ng pautos na pandiwa ang aktibong pagpapakita ng awa o habag. Ang “mahabag kayo sa” ay natural, malinaw, at marangal sa modernong Filipino.
- source_word: διακρινομένους
  choice: mga nag-aalinlangan
  rationale: Maaaring tumukoy ang participle sa pag-aalinlangan, pag-uurong-sulong, o pakikipagtalo. Ang “nag-aalinlangan” ang pinakamalinaw na pangunahing salin sa kontekstong humihiling ng habag, habang inilalahad sa talababa ang tunay na mga alternatibo.
theological_decisions:
- issue: Diwa ng διακρινομένους sa tagubiling pastoral para sa mga taong nanganganib
  choice: mga nag-aalinlangan
  alternative: mga nag-uurong-sulong; posibleng mga nakikipagtalo
  rationale: Inilalarawan ng pangunahing salin ang pangkat bilang hindi tiyak o nagdududa, sa halip na tiyak na mapanlaban, na angkop sa utos na mahabag. Gayunman, hindi lubos na nilulutas ng konteksto ang lawak ng salitang Griyego, kaya pinananatili sa talababa ang ibang posibleng diwa.
translation_notes:
  register: Modernong Filipino na natural at marangal. Pinili ang “mahabag kayo” kaysa sa mas literal ngunit di-gaanong likas na mga anyo; pinanatili ang ambigüidad ng huling participle sa talababa.
