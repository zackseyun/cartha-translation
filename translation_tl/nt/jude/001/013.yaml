  text: κύματα ἄγρια θαλάσσης ἐπαφρίζοντα τὰς ἑαυτῶν αἰσχύνας, ἀστέρες πλανῆται οἷς ὁ ζόφος τοῦ σκότους εἰς αἰῶνα τετήρηται.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/013.yaml
  text: wild waves of the sea[a], foaming up their own shames; wandering stars[b], for whom the gloom of darkness has been reserved forever.
translation:
  language: tl
  text: mababangis na alon ng dagat, na bumubula ng sarili nilang mga kahihiyan[a]; mga bituing gumagala, na para sa kanila’y inilaan ang pusikit na kadiliman magpakailanman.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na ibinubuga ang sarili nilang kahihiyan” o “na bumubula ng sarili nilang mga kahiya-hiyang gawa.” Ang maramihang salitang Griyego ay maaaring tumukoy sa kanilang kasiraan o sa mga gawang naglalantad nito.
    reason: lexical_alternative
  - marker: b
    text: O “ang karimlan ng kadiliman” o “ang pusikit na dilim.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κύματα ἄγρια θαλάσσης
  choice: mababangis na alon ng dagat
  rationale: Pinananatili ang matingkad na larawan ng marahas at di-mapigil na mga alon; natural at marangal ito sa makabagong Tagalog.
- source_word: ἐπαφρίζοντα
  choice: na bumubula
  rationale: Isinasalin ang kasalukuyang kilos ng paglikha o pagpapalabas ng bula nang hindi dinaragdagan ang larawan.
- source_word: τὰς ἑαυτῶν αἰσχύνας
  choice: ng sarili nilang mga kahihiyan
  rationale: Pinananatili ang mariing 'sarili nila' at ang kapansin-pansing anyong maramihan ng αἰσχύνας, habang hinahayaang tumukoy ito sa mga bagay na kahiya-hiya o sa idinudulot na kahihiyan.
- source_word: ἀστέρες πλανῆται
  choice: mga bituing palaboy
  rationale: Ipinahahayag ang diwa ng mga bituing gumagala o lumilihis nang hindi ipinapasok ang makabagong teknikal na kahulugan ng 'planeta.'
- source_word: ὁ ζόφος τοῦ σκότους
  choice: pusikit na kadiliman
  rationale: Natural na Tagalog na nagpapahayag ng matindi at nakapanghihilakbot na dilim; inilalagay sa talababa ang mas pormal na genitibong alternatibo.
- source_word: εἰς αἰῶνα
  choice: magpakailanman
  rationale: Sa konteksto ng paghatol, ito ang natural na pagpapahayag ng patuloy at walang-hanggang tagal.
- source_word: τετήρηται
  choice: pinaglaanan
  rationale: 'Ipinahahayag ang perpektong pasibong kalagayan: ang kadiliman ay naitakda at nananatiling nakalaan para sa kanila.'
theological_decisions:
- issue: Tagal at bigat ng larawan ng pangwakas na paghatol sa εἰς αἰῶνα
  choice: magpakailanman
  alternative: sa walang hanggan; para sa panahon
  rationale: Sa kontekstong ito, pinakamalinaw na ipinahahayag ng parirala ang walang-takdang pagpapatuloy ng paghatol, nang walang idinaragdag na sistematikong paliwanag.
- issue: Posibleng saklaw ng αἰσχύνας
  choice: mga kahihiyan
  alternative: mga kahiya-hiyang gawa; sariling kahihiyan
  rationale: Pinananatili ng maramihang anyo ang sadyang matalas na pananalita at hindi nilulutas kung ang tinutukoy ay ang kanilang kasiraan o ang mga gawang naglalantad nito.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Pinanatili ang patulang hanay ng mga metapora at ang matinding tono ng paghatol. Ginamit ang 'palaboy' para sa galaw ng mga bituin, hindi bilang teknikal na terminong astronomiko.
