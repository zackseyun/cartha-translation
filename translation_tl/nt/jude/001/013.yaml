  naturalness: Ang 'bumubula ng sarili nilang mga kahihiyan' ay sadyang matalinghaga ngunit katanggap-tanggap sa patulang rehistro. Ang 'mga bituing gumagala' ay higit na likas at marangal kaysa 'mga bituing palaboy,' na may di-kailangang konotasyong panlipunan sa modernong Tagalog.
