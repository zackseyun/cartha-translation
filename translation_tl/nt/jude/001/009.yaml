  to: Ngunit si Miguel na punong anghel, nang nakikipagtalo siya sa diyablo tungkol sa katawan ni Moises, ay hindi nangahas na magbitiw ng mapanirang hatol laban sa kanya,[a] kundi sinabi niya, “Sawayin ka nawa ng Panginoon.”[b]
