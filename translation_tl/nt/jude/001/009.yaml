  naturalness: 'May maliit ngunit malinaw na suliranin sa "magbitiw laban dito ng ... hatol": ang "dito" ay hindi natural na pantukoy sa isang persona at hindi rin pinakamadulas ang ayos ng mga parirala. Ang "magbitiw ng ... hatol laban sa kanya" ay mas likas at walang pagbabago sa kahulugan.'
