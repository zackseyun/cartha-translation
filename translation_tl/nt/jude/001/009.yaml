  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ Μιχαὴλ ὁ ἀρχάγγελος, ὅτε τῷ διαβόλῳ διακρινόμενος διελέγετο περὶ τοῦ Μωϋσέως σώματος, οὐκ ἐτόλμησεν κρίσιν ἐπενεγκεῖν βλασφημίας, ἀλλὰ εἶπεν· Ἐπιτιμήσαι σοι κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/009.yaml
  text: But Michael the archangel[a], when he was disputing with the devil and arguing about Moses' body, did not dare to bring a slanderous judgment against him, but said[b], “May the Lord rebuke you.”
translation:
  language: tl
  text: Ngunit si Miguel na punong anghel, nang nakikipagtalo siya sa diyablo tungkol sa katawan ni Moises, ay hindi nangahas na magbitiw ng mapanirang hatol laban sa kanya,[a] kundi sinabi niya, “Sawayin ka nawa ng Panginoon.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “isang mapang-alipustang paratang.” Mahirap ang pagkakabuo ng pariralang Griyego at maaari rin itong tumukoy sa isang mapang-alipustang hatol.
    reason: lexical_alternative
  - marker: b
    text: Umaalingawngaw ang pananalitang ito sa Zacarias 3:2, kung saan sinaway ng Panginoon si Satanas.
    reason: cross_reference
lexical_decisions:
- source_word: ἀρχάγγελος
  choice: punong anghel
  rationale: Likas at malinaw na salin sa modernong Filipino ng titulong tumutukoy sa isang anghel na may mataas na katungkulan.
- source_word: διαβόλῳ
  choice: diyablo
  rationale: Dito, ang salita ay pantukoy sa personal na espirituwal na kalaban; ang “diyablo” ang karaniwan at madaling maunawaang tawag sa Filipino.
- source_word: διακρινόμενος διελέγετο
  choice: nakikipagtalo
  rationale: Magkalapit at magkakaugnay ang dalawang pandiwang Griyego, kapuwa naglalarawan ng patuloy na pakikipagtalo. Pinagsama ang mga ito upang maiwasan ang hindi likas na pag-uulit sa Filipino nang hindi nawawala ang diwang adversarial.
- source_word: περὶ τοῦ Μωϋσέως σώματος
  choice: tungkol sa katawan ni Moises
  rationale: Natural na Filipino na tapat sa tiyak at kongkretong paksa ng pagtatalo.
- source_word: οὐκ ἐτόλμησεν
  choice: hindi siya nangahas
  rationale: Tuwirang ipinapahayag ang ideya ng hindi pagkukusa o hindi pangangahas na gawin ang kasunod na kilos.
- source_word: κρίσιν ἐπενεγκεῖν βλασφημίας
  choice: magbitiw laban dito ng mapanirang hatol
  rationale: Pinananatili ang legal o mapanghatol na diwa ng κρίσις at ang mapanirang o mapang-alipustang diwa ng βλασφημία, habang kinikilalang mahirap at maaaring unawain sa higit sa isang paraan ang pariralang Griyego.
- source_word: Ἐπιτιμήσαι σοι κύριος
  choice: Sawayin ka nawa ng Panginoon
  rationale: Ang “nawa” ay malinaw na nagpapahayag sa Filipino ng optative—isang panawagan o kahilingan na ang Panginoon ang sumaway.
- source_word: κύριος
  choice: Panginoon
  rationale: Pamantayan at marangal na salin ng κύριος sa kontekstong ito.
theological_decisions:
- issue: Ang pagpipigil ni Miguel sa paghatol laban sa diyablo
  choice: Hindi nagbitiw si Miguel ng sarili niyang mapanirang hatol; sa halip, nanawagan siyang ang Panginoon ang sumaway.
  alternative: Maaaring unawain ang parirala bilang hindi niya pagbigkas ng isang mapang-alipustang paratang o ng isang hatol na may kalapastanganan.
  rationale: Pinananatili ng salin ang malinaw na paghahambing sa teksto—ang hindi ginawa ni Miguel at ang panawagan niya sa awtoridad ng Panginoon—nang hindi nagdaragdag ng isang tiyak na sistema tungkol sa kapangyarihan o ranggo ng mga anghel.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “punong anghel” sa halip na hiram na “arkanghel” upang maging hayag ang kahulugan ng titulo. Pinagsama ang dalawang magkakaugnay na pandiwa ng pakikipagtalo para sa natural na daloy, at pinanatili sa talababa ang tunay na kalabuan ng κρίσιν ἐπενεγκεῖν βλασφημίας.
