id: JUD.1.16
reference: Jude 1:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὗτοί εἰσιν γογγυσταί, μεμψίμοιροι, κατὰ τὰς ἐπιθυμίας ⸀αὐτῶν πορευόμενοι, καὶ τὸ στόμα αὐτῶν λαλεῖ ὑπέρογκα, θαυμάζοντες πρόσωπα ὠφελείας χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/016.yaml
  text: These are grumblers[a], malcontents, walking according to their own desires, and their mouth speaks arrogant things[c][b], showing favoritism for the sake of gain.
translation:
  language: tl
  text: Ang mga taong ito ay mga reklamador at hindi nasisiyahan sa kanilang kalagayan.[a] Namumuhay sila ayon sa sarili nilang mga pagnanasa,[b] at ang bibig nila ay nagsasalita ng mapagmataas na mga salita.[c] Pinapaboran nila ang mga tao[d] para sa pakinabang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga taong laging nagrereklamo tungkol sa kanilang sinapit.”
    reason: lexical_alternative
  - marker: b
    text: O “sarili nilang masasamang pita.” Hindi lamang pagnanasang seksuwal ang maaaring saklaw ng salita.
    reason: alternative_reading
  - marker: c
    text: Sa mas literal na salin, “ang bibig nila ay nagsasalita ng mga labis-labis na bagay,” ibig sabihin, mapagmataas o mapagmalaking pananalita.
    reason: lexical_alternative
  - marker: d
    text: Sa literal, “humahanga sa mga mukha”—isang idyoma para sa pagkiling o pagbibigay ng pabor sa mga tao.
    reason: idiom_explanation
lexical_decisions:
- source_word: γογγυσταί
  choice: mga reklamador
  rationale: Tumutukoy ito sa mga taong ugali ang pabulong o paulit-ulit na pagrereklamo. Ang “mga reklamador” ay malinaw at natural sa makabagong Filipino.
- source_word: μεμψίμοιροι
  choice: hindi nasisiyahan sa kanilang kalagayan
  rationale: Ang bihirang salitang ito ay tumutukoy sa mga taong nagrereklamo tungkol sa kanilang sinapit o kalagayan. Iniiwasan ng saling ito ang di-likas na katawagang teknikal at nililinaw ang kaibhan nito sa pangkalahatang pagrereklamo.
- source_word: κατὰ τὰς ἐπιθυμίας αὐτῶν πορευόμενοι
  choice: namumuhay ... ayon sa sarili nilang mga pagnanasa
  rationale: Ang πορευόμενοι ay ginamit sa matalinghagang diwang “namumuhay” o “gumagawi.” Malawak ang saklaw ng ἐπιθυμίαι, kaya “mga pagnanasa” ang ginamit sa halip na limitahan ito sa seksuwal na pagnanasa.
- source_word: τὸ στόμα αὐτῶν λαλεῖ ὑπέρογκα
  choice: nagsasalita nang may kayabangan
  rationale: Ang ὑπέρογκα ay naglalarawan ng mapagmataas, eksaherado, o mapagmalaking pananalita. Natural sa Filipino ang pandiwang anyo, samantalang inilalahad sa talababa ang mas literal na larawan ng Griyego.
- source_word: θαυμάζοντες πρόσωπα
  choice: pinapaboran nila ang mga tao
  rationale: Ang literal na idyomang “humahanga sa mga mukha” ay tumutukoy sa pagkiling o pagbibigay ng pabor sa mga tao. Ipinahahayag ng salin ang kahulugang idyomatiko nito.
- source_word: ὠφελείας χάριν
  choice: para sa sariling pakinabang
  rationale: Ipinahahayag ng parirala ang mapagsariling layunin ng kanilang pagkiling. Ipinahihiwatig ng konteksto na sila mismo ang naghahangad na makinabang.
- source_word: οὗτοί εἰσιν
  choice: Ang mga taong ito ay
  rationale: Ginagawang hayag ng “mga taong” ang tinutukoy ng demonstratibo at nananatiling tuwiran ang pagkakakilanlan.
theological_decisions:
- issue: Saklaw ng moral na kahulugan ng ἐπιθυμίαι
  choice: mga pagnanasa sa pangunahing teksto
  alternative: masasamang pita; mga makamundong pagnanasa
  rationale: Maaaring tumukoy ang salita sa matitinding pagnanasa sa pangkalahatan, bagaman malinaw na negatibo ang gamit nito sa konteksto. Hindi ito nilimitahan sa pagnanasang seksuwal o sa isang partikular na uri ng kasalanan.
- issue: Idyomatikong kahulugan ng θαυμάζοντες πρόσωπα
  choice: pinapaboran nila ang mga tao
  alternative: nambobola sila ng mga tao; humahanga sila sa mga mukha
  rationale: Ang idyoma ay nagsasaad ng pagkiling sa mga tao para sa kapakinabangan. Pinananatili ng salin ang etikal na diin nang hindi ipinapalagay na pambobola lamang ang paraan nila.
- issue: Likas na larawan sa τὸ στόμα αὐτῶν λαλεῖ ὑπέρογκα
  choice: nagsasalita nang may kayabangan
  alternative: ang kanilang bibig ay nagsasalita ng mga labis na bagay
  rationale: Ang mas literal na anyo ay di-likas sa Filipino. Inililipat ng pangunahing salin ang malinaw na diwa ng mapagmataas at mapagmalaking pananalita, habang pinananatili sa talababa ang larawan at posibleng diin ng Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga reklamador” bilang karaniwang katawagan, “kalagayan” upang ihayag ang natatanging diwa ng μεμψίμοιροι, at “pinapaboran” upang natural na maisalin ang idyomang Griyego. Hinati sa maiikling pangungusap para sa madaling pagbasa nang hindi binabago ang sunod-sunod na mga paratang.
