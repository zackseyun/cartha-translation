  to: Ang mga taong ito ay mga reklamador at hindi nasisiyahan sa kanilang kalagayan.[a] Namumuhay sila ayon sa sarili nilang mga pagnanasa,[b] at ang bibig nila ay nagsasalita ng mapagmataas na mga salita.[c] Pinapaboran nila ang mga tao[d] para sa pakinabang.
