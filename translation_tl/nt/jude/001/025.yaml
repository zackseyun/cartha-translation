id: JUD.1.25
reference: Jude 1:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀μόνῳ θεῷ σωτῆρι ἡμῶν ⸂διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν⸃ ⸀δόξα μεγαλωσύνη κράτος καὶ ἐξουσία ⸂πρὸ παντὸς τοῦ αἰῶνος⸃ καὶ νῦν καὶ εἰς πάντας τοὺς αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/025.yaml
  text: to the only God our Savior[a], through Jesus the Messiah our Lord, be glory, majesty, dominion, and authority, before all time and now and forever[b]. Amen.
translation:
  language: tl
  text: Sa iisang Diyos na ating Tagapagligtas, sa pamamagitan ni Jesus na Mesiyas, na ating Panginoon, sumaiyo ang kaluwalhatian, kadakilaan, kapangyarihan, at awtoridad, bago pa ang lahat ng panahon, ngayon, at magpakailanman.[a] Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas literal na anyo: “bago ang bawat kapanahunan ... at hanggang sa lahat ng mga kapanahunan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μόνῳ θεῷ
  choice: sa iisang Diyos
  rationale: Ipinahahayag ng μόνος ang pagiging natatangi ng Diyos. Natural at marangal sa modernong Tagalog ang “iisang Diyos” sa ganitong doxolohiya.
- source_word: σωτῆρι ἡμῶν
  choice: na ating Tagapagligtas
  rationale: Karaniwang katumbas ng σωτήρ ang “Tagapagligtas,” at malinaw nitong pinananatili ang diwang mapagligtas.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: sa pamamagitan ni Jesus na Mesiyas
  rationale: Ang διά na may genitive ay nagpapahiwatig ng paraan o pamamagitan. Isinalin ang Χριστός bilang titulong “Mesiyas,” hindi bilang pangalan lamang.
- source_word: τοῦ κυρίου ἡμῶν
  choice: na ating Panginoon
  rationale: Ang pariralang genitive ay tumutukoy kay Jesus na Mesiyas; nililinaw ng “na” ang apposisyon sa natural na Tagalog.
- source_word: δόξα μεγαλωσύνη κράτος καὶ ἐξουσία
  choice: ang kaluwalhatian, kadakilaan, kapangyarihan, at awtoridad
  rationale: Pinananatili ang apat na magkakaugnay ngunit magkakaibang katangian. Ang κράτος ay “kapangyarihan,” samantalang ang ἐξουσία ay “awtoridad,” upang hindi pag-isahin ang kanilang diwa.
- source_word: πρὸ παντὸς τοῦ αἰῶνος
  choice: bago pa ang lahat ng panahon
  rationale: Malinaw at idiomatikong ipinahahayag nito ang pag-iral bago ang buong saklaw ng panahon, habang ang mas literal na anyo ay inilalagay sa talababa.
- source_word: καὶ νῦν καὶ εἰς πάντας τοὺς αἰῶνας
  choice: ngayon, at magpakailanman
  rationale: Natural na Tagalog ito para sa kasalukuyan at walang-hanggang saklaw ng doxolohiya.
theological_decisions:
- issue: Ang pamamagitan sa doxolohiya
  choice: Ang papuri ay iniuukol sa iisang Diyos na ating Tagapagligtas sa pamamagitan ni Jesus na Mesiyas, na ating Panginoon.
  alternative: Maaaring iugnay nang mas maluwag ang pariralang “sa pamamagitan ni Jesus,” ngunit nagpapahiwatig pa rin ito ng pamamagitan.
  rationale: Pinakanatural sa sintaks na iugnay ang διὰ Ἰησοῦ Χριστοῦ sa ipinagkakaloob na papuri, nang hindi pinag-iisa ang tinutukoy na Diyos at si Jesus o inaalis ang tungkulin ni Jesus bilang tagapamagitan.
- issue: Pagsasalin sa Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Dito ay gumaganap ang Χριστός bilang titulo. Ang “Mesiyas” ay tahasang nagpapanatili sa kahulugan nito sa halip na tratuhin lamang itong bahagi ng pangalan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog para sa isang doxolohiya. Ginamit ang “awtoridad” bilang karaniwang salitang Filipino upang maibukod ang ἐξουσία sa κράτος. Ang marker na [a] ay inilagay pagkatapos ng buong pariralang tumutukoy sa panahon.
