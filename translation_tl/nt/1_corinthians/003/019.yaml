id: 1CO.3.19
reference: 1 Corinthians 3:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἡ γὰρ σοφία τοῦ κόσμου τούτου μωρία παρὰ τῷ θεῷ ἐστιν· γέγραπται γάρ· Ὁ δρασσόμενος τοὺς σοφοὺς ἐν τῇ πανουργίᾳ αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/019.yaml
  text: For the wisdom of this world is foolishness with God[a]. For it is written[b], “He catches the wise in their craftiness.”
translation:
  language: tl
  text: Sapagkat ang karunungan ng mundong ito ay kahangalan sa paningin ng Diyos.[a] Sapagkat nasusulat,[b] “Hinuhuli niya ang marurunong sa sarili nilang katusuhan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa Diyos”; ibig sabihin, sa paningin o paghatol ng Diyos.
    reason: lexical_alternative
  - marker: b
    text: Ang sipi ay mula sa Job 5:13.
    reason: scripture_reference
lexical_decisions:
- source_word: σοφία
  choice: karunungan
  rationale: Karaniwang katumbas ng σοφία at pinananatili ang kaibahan ng inaangking karunungan ng mundo sa pagtataya ng Diyos.
- source_word: κόσμου τούτου
  choice: ng mundong ito
  rationale: Tuwirang ipinapahayag ang kasalukuyang makasanlibutang kaayusang tinutukoy ng κόσμος τοῦτος.
- source_word: μωρία
  choice: kahangalan
  rationale: Natural at malinaw na salin ng μωρία, na kaayon ng paulit-ulit na paghahambing ni Pablo sa kontekstong ito.
- source_word: παρὰ τῷ θεῷ
  choice: sa paningin ng Diyos
  rationale: 'Ipinahahayag ang evaluative na diwa ng παρά na may datibo: ganito ito sa pagtataya o paghatol ng Diyos.'
- source_word: γέγραπται
  choice: nasusulat
  rationale: Dignified at nakaugaliang pormula sa Filipino para sa perfect passive na nagpapakilala ng sipi sa Kasulatan.
- source_word: δρασσόμενος
  choice: Hinuhuli niya
  rationale: Ipinahahayag ang pagdakip o pagsilo; natural sa Filipino at angkop sa kawikaang lakas ng sipi.
- source_word: σοφοὺς
  choice: ang marurunong
  rationale: Tumutukoy sa mga taong itinuturing na marunong nang hindi nagdaragdag ng pagtukoy sa kasarian.
- source_word: πανουργίᾳ
  choice: katusuhan
  rationale: Taglay ang negatibong diwa ng tusong katalinuhan o mapanlinlang na pagkamadiskarte sa kontekstong ito.
theological_decisions:
- issue: Pagpapahayag ng pagtataya ng Diyos sa karunungan ng mundo
  choice: sa paningin ng Diyos
  alternative: sa harap ng Diyos; sa Diyos
  rationale: Nililinaw ang likas na evaluative na kahulugan ng παρὰ τῷ θεῷ nang hindi binabago ang teolohikal na paghahambing.
- issue: Pagbibigay ng paksa sa sipi mula sa Job 5:13
  choice: Hinuhuli niya ang marurunong
  alternative: Ang humuhuli sa marurunong
  rationale: Ang articular participle ay tumutukoy sa Diyos; natural sa Filipino ang tahasang panghalip, at hindi ito nagdaragdag ng bagong teolohikal na pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Sapagkat” upang mapanatili ang dalawang γάρ, at “nasusulat” bilang pamilyar na pormula sa pagsipi ng Kasulatan.
