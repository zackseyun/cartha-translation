id: 1CO.3.16
reference: 1 Corinthians 3:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Οὐκ οἴδατε ὅτι ναὸς θεοῦ ἐστε καὶ τὸ πνεῦμα τοῦ θεοῦ ⸂οἰκεῖ ἐν ὑμῖν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/016.yaml
  text: Do you not know that you are God’s temple and that God’s Spirit dwells in you?[a][b][c]
translation:
  language: tl
  text: Hindi ba ninyo alam na kayo ang templo ng Diyos[a][b] at nananahan sa inyo ang Espiritu ng Diyos?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “santuwaryo ng Diyos.”
    reason: lexical_alternative
  - marker: b
    text: Maramihan ang “kayo”; ang komunidad sa Corinto ang sama-samang kinakausap ni Pablo.
    reason: cultural_note
  - marker: c
    text: O “sa gitna ninyo.”
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐκ οἴδατε
  choice: Hindi ba ninyo alam
  rationale: Likas at marangal na anyo ng retorikal na tanong sa modernong Filipino; pinananatili nito ang diin ng Griyego.
- source_word: ναὸς θεοῦ
  choice: templo ng Diyos
  rationale: Ang ναός ay tumutukoy sa templo o santuwaryo mismo, hindi sa buong bakuran nito. Malinaw sa karaniwang mambabasa ang “templo” at napapanatili ang larawan ng banal na tahanan.
- source_word: ἐστε
  choice: kayo ang
  rationale: Ipinakikita ng “kayo” ang ikalawang panauhang maramihan. Hindi dinaragdagan ng “sama-sama” ang pangunahing teksto, kaya nananatili ang anyo at saklaw ng pinagmulan.
- source_word: τὸ πνεῦμα τοῦ θεοῦ
  choice: ang Espiritu ng Diyos
  rationale: Direkta at natural na katumbas na nagpapanatili sa ugnayang ipinahahayag ng genitibo.
- source_word: οἰκεῖ
  choice: nananahan
  rationale: Ipinahahayag ang patuloy na paninirahan at angkop sa larawan ng templo; mas marangal at mas tiyak kaysa sa simpleng “nakatira.”
- source_word: ἐν ὑμῖν
  choice: sa inyo
  rationale: Pinananatili ang maaaring kahulugang “sa loob ninyo” habang hindi isinasara ang kolektibong diwang “sa gitna ninyo.”
theological_decisions:
- issue: Kung pangunahing tumutukoy ang talata sa bawat mananampalataya o sa buong kongregasyon
  choice: Pinanatili ang maramihang “kayo” nang hindi dinaragdagan ng “bawat isa” o “sama-sama.”
  alternative: “Kayong sama-sama ang templo ng Diyos” o “bawat isa sa inyo ay templo ng Diyos.”
  rationale: Maramihan ang ἐστε at ὑμῖν, at sa konteksto ay kinakausap ni Pablo ang komunidad. Gayunman, walang tahasang katumbas ng “sama-sama” o “bawat isa,” kaya hindi dapat paliitin o palawakin nang lampas sa sinabi ng teksto.
- issue: Kung ang ἐν ὑμῖν ay dapat unawain bilang paninirahan “sa loob” o presensiya “sa gitna” ng komunidad
  choice: “sa inyo” sa pangunahing teksto
  alternative: “sa gitna ninyo”
  rationale: Maaaring dalhin ng parirala ang dalawang diwa sa kolektibong konteksto. Ang “sa inyo” ay malapit sa anyo ng Griyego at pinananatili ang tunay na kalabuan; inilalagay sa talababa ang alternatibo.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang “ninyo/inyo” upang malinaw ang maramihang kausap; iniwasan ang tahasang “sama-sama” sa pangunahing teksto upang hindi magdagdag sa Griyego. Nakalagay ang lahat ng marker na [a], [b], at [c] sa pangunahing teksto.
