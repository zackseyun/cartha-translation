base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/004.yaml
  text: For whenever someone says[a], “I am of Paul,” and another, “I am of Apollos,” are you not merely human?
translation:
  language: tl
  text: Sapagkat kapag may nagsasabi, “Kay Pablo ako,” at may isa namang nagsasabi, “Kay Apolos ako,” hindi ba't mga tao lamang kayo?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas literal: “Hindi ba''t mga tao kayo?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: kapag
  rationale: Ipinahihiwatig ng ὅταν ang isang di-tiyak o paulit-ulit na kalagayan; likas itong naipapahayag sa Tagalog sa pamamagitan ng “kapag.”
- source_word: γὰρ
  choice: sapagkat
  rationale: Pinananatili nito ang paliwanag na kaugnayan ng talata sa naunang pangangatwiran ni Pablo.
- source_word: λέγῃ τις
  choice: may nagsasabi
  rationale: Natural na Tagalog ito para sa di-tiyak at pangkalahatang tinutukoy na isang tao.
- source_word: Ἐγὼ μέν εἰμι Παύλου
  choice: Kay Pablo ako
  rationale: Maikli at natural na pormula ito ng pagkakampi o pagpanig, at hindi nito ipinapalagay na pagmamay-ari ang ugnayan.
- source_word: ἕτερος δέ
  choice: at ang isa naman
  rationale: Malinaw nitong naipapakita ang magkatambal na paghahambing ng μέν … δέ.
- source_word: Ἐγὼ Ἀπολλῶ
  choice: Kay Apolos ako
  rationale: Pinupunan sa Tagalog ang elipsis mula sa unang pahayag at pinananatili ang magkatulad na pormula ng pagpanig.
- source_word: οὐκ ἄνθρωποί ἐστε;
  choice: hindi ba't kumikilos lamang kayo ayon sa tao?
  rationale: Sa konteksto, ang retorikal na tanong ay sumasaway sa asal na pinamumunuan ng karaniwang pamantayan ng tao. Nililinaw ng “kumikilos” ang pragmatikong diwa, samantalang itinatala sa talababa ang mas literal na anyo.
theological_decisions:
- issue: Kung ang ἄνθρωποι ay tumutukoy sa likas na pagiging tao o sa asal na makamundo/karaniwan
  choice: kumikilos lamang kayo ayon sa tao
  alternative: hindi ba't mga tao lamang kayo?
  rationale: Hindi naman itinatanggi ni Pablo na tao ang mga taga-Corinto; sa konteksto ng paninibugho at pagkakampi (3:3), ang tanong ay bumabatikos sa kanilang pag-uugali. Gayunman, pinananatili sa talababa ang leksikal na mas literal at sadyang maigting na pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang likas na “Kay Pablo/Apolos ako” para sa partidistang pagpanig, at iniwasan ang mas mabigat o denominasyonal na bokabularyo.
