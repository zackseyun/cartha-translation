translation:
  language: tl
  text: Sapagkat kami ay mga kamanggagawa ng Diyos[a]; kayo ang bukid ng Diyos, ang gusali ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kamanggagawang kasama ng Diyos.”
    reason: alternatibong pag-unawa sa θεοῦ συνεργοί
lexical_decisions:
- source_word: γάρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na ugnayan ng talata sa naunang pangangatwiran.
- source_word: συνεργοί
  choice: mga kamanggagawa
  rationale: Likas at malinaw sa makabagong Filipino, at ipinahahayag ang sama-samang paggawa nang hindi nagpapalawak sa diwa.
- source_word: θεοῦ (kasama ng συνεργοί)
  choice: ng Diyos
  rationale: Pinananatili ang anyong henitibo at, ayon sa konteksto, natural na maunawaan bilang mga manggagawang nauukol sa Diyos o naglilingkod sa kanya. Hindi nito tahimik na ipinapalagay na kapantay nilang kamanggagawa ang Diyos.
- source_word: γεώργιον
  choice: bukid
  rationale: Payak at karaniwang salita na malinaw na naghahatid ng larawang pansakahan.
- source_word: οἰκοδομή
  choice: gusali
  rationale: Natural at tuwirang salin na naghahanda sa metapora ng pagtatayo sa mga susunod na talata.
- source_word: ἐστε
  choice: kayo ang
  rationale: Tahasang kinakatawan ang pangalawang panauhang maramihan sa Griyego.
theological_decisions:
- issue: Kung ang θεοῦ συνεργοί ay nangangahulugang “mga kamanggagawa ng Diyos” o “mga kamanggagawang kasama ng Diyos”
  choice: mga kamanggagawa ng Diyos
  alternative: mga kamanggagawang kasama ng Diyos
  rationale: Maaaring pagtalunan ang gamit ng henitibo sa Griyego. Sa agarang konteksto, binibigyang-diin ni Pablo na ang mga lingkod ay sa Diyos at naglilingkod sa ilalim niya, samantalang ang mga taga-Corinto ay pag-aari ng Diyos. Pinananatili sa talababa ang tunay na posibleng alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kamanggagawa,” “bukid,” at “gusali” upang mapanatili ang dalawang magkasunod na metapora at ang maigsi, balanseng ayos ng Griyego.
