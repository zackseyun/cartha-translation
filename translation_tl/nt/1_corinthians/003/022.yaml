base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/022.yaml
  text: whether Paul or Apollos or Cephas or the world or life or death or things present or things to come—all are yours,
translation:
  language: tl
  text: Pablo man, Apolos man, Cefas man, ang mundo man, ang buhay man, ang kamatayan man, ang mga bagay sa kasalukuyan man, o ang mga bagay na darating—lahat ay sa inyo,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴτε … εἴτε
  choice: maging … o
  rationale: Ang paulit-ulit na εἴτε ay nag-uugnay ng sunod-sunod na mga kabilang sa saklaw ng pahayag. Likas sa modernong Tagalog ang “maging … o” at napapanatili nito ang retorikal na pag-iisa ng buong talaan.
- source_word: Παῦλος
  choice: Pablo
  rationale: Karaniwang anyo ng pangalang Paul sa Tagalog na tradisyong biblikal.
- source_word: Ἀπολλῶς
  choice: Apolos
  rationale: Likas na transliterasyon sa Tagalog ng pangalang Griyego.
- source_word: Κηφᾶς
  choice: Cefas
  rationale: Pinananatili ang Semitikong anyo ng pangalang nasa tekstong Griyego sa halip na palitan ito ng katumbas na pangalang Pedro.
- source_word: κόσμος
  choice: ang mundo
  rationale: Malinaw at karaniwang katumbas na sapat ang lawak upang tukuyin ang daigdig o kaayusan ng sanlibutan sa argumento ni Pablo.
- source_word: ζωή
  choice: ang buhay
  rationale: Tuwiran at natural na katumbas ng pangngalan.
- source_word: θάνατος
  choice: ang kamatayan
  rationale: Tuwirang katumbas na pinananatili ang matinding pagsalungat nito sa buhay.
- source_word: ἐνεστῶτα
  choice: ang mga bagay sa kasalukuyan
  rationale: Ang substantibong participle ay tumutukoy sa mga kasalukuyang realidad; malinaw sa Tagalog ang pariralang ito at mahusay itong katambal ng “mga bagay na darating.”
- source_word: μέλλοντα
  choice: ang mga bagay na darating
  rationale: Ang substantibong participle ay tumutukoy sa mga realidad sa hinaharap; natural at malinaw ang salin.
- source_word: πάντα
  choice: lahat
  rationale: Binubuod nito nang walang pagtatangi ang buong talaan ng mga tao at mga bagay.
- source_word: ὑμῶν
  choice: ay sa inyo
  rationale: Ipinahahayag ng genitive ang pag-aari o kaugnayang pag-aangkin. Ang “sa inyo” ay tuwiran at likas, habang hindi dinaragdagan ang teksto ng paliwanag kung paano nauukol sa kanila ang lahat.
theological_decisions:
- issue: Saklaw at diwa ng πάντα ὑμῶν
  choice: lahat ay sa inyo
  alternative: lahat ay pag-aari ninyo / lahat ay para sa inyo
  rationale: Pinananatili ng “sa inyo” ang maikli at malawak na pahayag ng Griyego. Hindi nito ipinapasiya kung ito ay ganap na pagmamay-ari, pagpapasakop, o pagiging para sa kapakinabangan nila; ang kaugnay na paliwanag ay nasa mas malawak na konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at madaling maunawaan. Pinanatili ang anyong talaan at ang pangwakas na diin ng “lahat ay sa inyo.” Ginamit ang “Cefas” upang tumbasan ang mismong pangalang Κηφᾶς, hindi ang katumbas nitong “Pedro.”
