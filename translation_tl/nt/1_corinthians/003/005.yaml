base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/005.yaml
  text: What then is Apollos? And what is Paul? Servants through whom you believed[c][b][a], as the Lord gave to each one.
translation:
  language: tl
  text: Ano nga ba si Apolos[a]? At ano naman si Pablo? Mga lingkod[b] na sa pamamagitan nila ay sumampalataya kayo—ayon sa ibinigay ng Panginoon sa bawat isa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Sino nga si Apolos? At sino si Pablo?” “Ano” ang ginamit sa Griyego, na nagbibigay-diin sa kanilang tungkulin o katayuan sa halip na sa kanilang pagkakakilanlan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga tagapaglingkod.” Ang salitang Griyego ay tumutukoy rito sa mga taong naglilingkod, hindi kinakailangang sa pormal na katungkulan ng diyakono.
    reason: lexical_alternative
  - marker: c
    text: 'Elliptical ang huling parirala sa Griyego: hindi binabanggit kung ano ang ibinigay ng Panginoon sa bawat isa. Maaari rin itong unawaing “ayon sa itinakda ng Panginoon sa bawat isa.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Τί
  choice: Ano
  rationale: Pinananatili ng “ano” ang pambalarilang anyong neuter at ang diin ng tanong sa tungkulin o katayuan nina Apolos at Pablo, hindi lamang sa kanilang pagkakakilanlan.
- source_word: οὖν
  choice: nga
  rationale: Likas na ipinahihiwatig ng “nga” sa Tagalog ang pagbubuod o paghinuha mula sa naunang sinabi nang hindi labis na pinatitindi ang lohikal na ugnayan.
- source_word: δέ
  choice: At
  rationale: Ang “at” ay natural na nag-uugnay sa magkatambal na retorikal na tanong; hindi kailangan dito ang mas matinding pagsalungat na “ngunit.”
- source_word: διάκονοι
  choice: mga lingkod
  rationale: Tumutukoy ito sa mga taong naglilingkod bilang mga kasangkapan o ahente, hindi kinakailangang sa pormal na katungkulan ng diyakono.
- source_word: δι’ ὧν
  choice: sa pamamagitan nila
  rationale: 'Malinaw na ipinapahayag nito ang instrumental na diwa ng διά na may genitive: sila ang mga kasangkapang ginamit, hindi ang pinagmulan ng pananampalataya.'
- source_word: ἐπιστεύσατε
  choice: sumampalataya kayo
  rationale: Direkta at likas itong salin ng aorist na pandiwa at tumutukoy sa kanilang pagkilos na manampalataya nang walang idinaragdag na paliwanag.
- source_word: καὶ ἑκάστῳ ὡς ὁ κύριος ἔδωκεν
  choice: ayon sa ibinigay ng Panginoon sa bawat isa
  rationale: Likas sa Tagalog ang pariralang ito at hindi nito pinapangalanan kung ano ang ibinigay—gawain, kaloob, pagkakataon, o bunga—kaya nananatili ang ellipsis ng Griyego.
- source_word: κύριος
  choice: Panginoon
  rationale: Ito ang karaniwan at marangal na salin ng κύριος at hindi nito labis na tinutukoy sa pangunahing teksto kung sino ang tinutukoy.
theological_decisions:
- issue: Tinutukoy ng κύριος
  choice: Iniwan sa teksto bilang “Panginoon,” na maaaring unawain sa konteksto bilang Panginoong Jesus.
  alternative: Tahasang tukuyin bilang Diyos o bilang Panginoong Jesus.
  rationale: Hindi pinapangalanan ng talata ang tinutukoy; pinananatili ng salin ang anyo at posibleng tensiyon ng pinagmulan.
- issue: Ellipsis sa “ayon sa ibinigay ng Panginoon sa bawat isa”
  choice: Hindi tinukoy sa pangunahing teksto ang bagay na ibinigay.
  alternative: “ayon sa gawaing itinakda ng Panginoon sa bawat isa” o “ayon sa bahaging ibinigay ng Panginoon sa bawat isa.”
  rationale: Walang hayag na layon ang ἔδωκεν sa Griyego. Ang pagdaragdag ng “gawain,” “bahagi,” o “kaloob” ay magpapasya sa isang bagay na iniwang bukas ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang retorikal na “Ano” at ang hindi tahasang layon ng “ibinigay,” habang iniwasan ang teknikal o denominasyonal na pananalita.
