id: 1CO.3.13
reference: 1 Corinthians 3:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἑκάστου τὸ ἔργον φανερὸν γενήσεται, ἡ γὰρ ἡμέρα δηλώσει· ὅτι ἐν πυρὶ ἀποκαλύπτεται, καὶ ἑκάστου τὸ ἔργον ὁποῖόν ἐστιν τὸ πῦρ ⸀αὐτὸ δοκιμάσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/013.yaml
  text: each one’s work will become evident[a], for the Day will disclose it, because it is revealed in fire[b], and the fire itself will test what sort of work each one has.
translation:
  language: tl
  text: Mahahayag ang gawa ng bawat isa, sapagkat ihahayag ito ng Araw[a], sapagkat ang Araw ay mahahayag sa apoy[b]; at ang apoy mismo ang susubok kung anong uri ang gawa ng bawat isa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Malamang na ang “Araw” ay tumutukoy sa hinaharap na araw ng pagsusuri o paghatol ng Diyos.
    reason: cross_reference
  - marker: b
    text: Maaari ring isalin ang pariralang Griyego na ἐν πυρί bilang “sa pamamagitan ng apoy.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκάστου
  choice: ng bawat isa
  rationale: Pinananatili ang distributibong diwa ng genitive singular at ang indibidwal na pagsusuri nang hindi nagdaragdag ng kasarian.
- source_word: τὸ ἔργον
  choice: ang gawa
  rationale: Malawak at likas na katumbas ito na maaaring tumukoy sa bunga o kalidad ng gawain ng bawat tagapagtayo sa konteksto.
- source_word: φανερὸν γενήσεται
  choice: mahahayag
  rationale: Likas na Filipino ito para sa magiging lantad o maliwanag sa hinaharap, nang hindi labis na pinahahaba ang parirala.
- source_word: ἡ ἡμέρα
  choice: ang Araw
  rationale: Ang tiyak na pantukoy at konteksto ay tumutukoy sa natatanging araw ng pagsusuri ng Diyos; ipinahihiwatig ng malaking titik ang espesipikong gamit.
- source_word: δηλώσει
  choice: ilalantad
  rationale: Ipinapahayag nito ang paggawa ng isang bagay na malinaw at nakikita, at naiiwasang ulitin lamang ang salitang 'mahahayag.'
- source_word: ἐν πυρὶ
  choice: sa apoy
  rationale: Pinananatili ng 'sa' ang posibilidad na lokatibo ('sa apoy') o instrumental ('sa pamamagitan ng apoy'), na nililinaw sa talababa.
- source_word: ἀποκαλύπτεται
  choice: mahahayag
  rationale: Tuwirang inilalarawan nito ang pagbubunyag o paglalantad nang hindi tinutukoy nang higit sa Griyego kung sino ang gumagawa nito.
- source_word: ὁποῖόν ἐστιν
  choice: kung anong uri
  rationale: Itinatampok nito ang uri o kalidad ng gawa, hindi lamang ang pag-iral nito.
- source_word: δοκιμάσει
  choice: susubok
  rationale: Saklaw nito ang pagsusuri upang matukoy ang tunay na uri o kalidad ng gawa.
- source_word: αὐτὸ
  choice: mismo
  rationale: Pinananatili ang mariing diin na ang apoy mismo ang nagsasagawa ng pagsubok.
theological_decisions:
- issue: Kung ang ἡ ἡμέρα ay pangkaraniwang araw o ang hinaharap na Araw ng banal na pagsusuri.
  choice: Isinalin bilang 'ang Araw' at ginamitan ng malaking titik.
  alternative: ang araw
  rationale: Sa konteksto, tumutukoy ito sa natatanging hinaharap na panahon ng pagsusuri ng Diyos; hindi na dinagdagan ng salitang 'paghuhukom' sa pangunahing teksto.
- issue: Ang maaaring tukuyin ng nakatagong simuno sa ἀποκαλύπτεται.
  choice: Ginamit ang 'ito' upang hindi labis na lutasin sa salin ang ugnayang sintaktiko.
  alternative: mahahayag ang Araw sa apoy
  rationale: Malamang na ipinagpapatuloy ng pandiwa ang 'Araw' bilang simuno, ngunit pinananatili ng panghalip ang maigsi at bahagyang bukas na anyo ng Griyego.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang 'gawa' sa halip na mas teknikal na 'gawain' o 'paglilingkod,' at pinanatili ang maikli at mariing daloy ng talata.
