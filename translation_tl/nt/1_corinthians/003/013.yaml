  source_fidelity: Kailangang gawing malinaw na ang simuno ng ἀποκαλύπτεται (“mahahayag”) ay “ang Araw,” hindi ang “gawa.” Sa kasalukuyang anyo, ang “ito” pagkatapos ng “gawa” ay likas na mababasa bilang tumutukoy sa gawa at sa gayon ay naililihis ang sintaksis ng Griyego.
  naturalness: Ang pangkalahatang rehistro ay makabago at malinaw. Ang pag-uulit ng “ang Araw” sa ikalawang sugnay ay bahagyang mas mabigat ngunit kinakailangan upang maiwasan ang hindi wastong antecedent ng panghalip at nananatiling natural sa marangal na Filipino.
  terminology: Ang “gawa,” “Araw,” “apoy,” at “susubok” ay angkop na mga katumbas. Napananatili ng “Araw” ang tiyak na eskatolohikal na pagtukoy nang hindi nagdaragdag ng pagpapakahulugang doktrinal. Ang talababa sa “sa apoy” ay wastong nag-iingat ng posibleng instrumental na pagbasa.
