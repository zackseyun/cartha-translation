  text: ὁ φυτεύων δὲ καὶ ὁ ποτίζων ἕν εἰσιν, ἕκαστος δὲ τὸν ἴδιον μισθὸν λήμψεται κατὰ τὸν ἴδιον κόπον,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/008.yaml
  text: The one who plants and the one who waters are one[a], and each will receive his own reward according to his own labor.
translation:
  language: tl
  text: Ang nagtatanim at ang nagdidilig ay iisa[a], at bawat isa ay tatanggap ng sarili niyang gantimpala ayon sa sarili niyang pagpapagal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagkakaisa” o “iisa ang layunin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φυτεύων
  choice: ang nagtatanim
  rationale: Likas na isinasalin ang articular present participle bilang pariralang tumutukoy sa gumagawa; malinaw ito at pinananatili ang larawang pang-agrikultura.
- source_word: ποτίζων
  choice: ang nagdidilig
  rationale: Tumutugma ito sa substantival participle at natural sa makabagong Tagalog habang pinananatili ang metapora ng pagtatanim.
- source_word: ἕν
  choice: iisa
  rationale: Pinananatili ng “iisa” ang maikli at sadyang malawak na pahayag ng Griyego tungkol sa pagkakaisa, nang hindi ipinapakahulugang iisang persona sila; inilalahad sa talababa ang mga posibleng pagpapakahulugan.
- source_word: μισθὸν
  choice: gantimpala
  rationale: Ang “gantimpala” ay angkop sa konteksto ng paglilingkod at hindi nililimitahan ang salita sa sahod na salapi, bagaman taglay pa rin ang diwa ng kabayaran.
- source_word: λήμψεται
  choice: tatanggap
  rationale: Natural at tuwirang katumbas ito ng future form sa Griyego.
- source_word: κατὰ
  choice: ayon sa
  rationale: Pinananatili nito ang ugnayang panukat o batayan sa pagitan ng gantimpala at pagpapagal.
- source_word: κόπον
  choice: pagpapagal
  rationale: Ipinahahayag ng “pagpapagal” ang matrabaho at masikap na paggawa na taglay ng κόπος, at natural ito sa marangal na modernong Tagalog.
- source_word: ἴδιον
  choice: sarili niyang / sarili niyang
  rationale: Pinananatili ng pag-uulit ang indibiduwal na diin ng dalawang paglitaw ng ἴδιον sa Griyego.
theological_decisions:
- issue: Kahulugan ng ἕν εἰσιν (“ay iisa”)
  choice: Pinanatili ang “ay iisa,” na nagpapahayag ng pagkakaisa ng nagtatanim at nagdidilig sa gawain o layunin nang hindi sila itinuturing na iisang persona.
  alternative: “Ay nagkakaisa” o “iisa ang layunin.”
  rationale: Ang neuter singular na ἕν ay tumutukoy sa pagkakaisa, hindi sa personal na identidad. Sa konteksto, sinasalungat ni Pablo ang pagkakampi-kampi habang kinikilala pa rin ang magkakaibang gawain at indibiduwal na pananagutan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignified, at madaling maunawaan. Pinanatili ang metaporang pang-agrikultura, ang pagkakaiba ng mga manggagawa, at ang siksik na pahayag na “iisa,” kasama ang talababa upang hindi ikulong ang tunay na lawak ng kahulugan.
