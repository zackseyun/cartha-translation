  source_fidelity: Ang pangungusap ay wastong naghahayag ng kundisyon, pananatili, at pagtanggap ng μισθός. Gayunman, ang “gawa ng sinumang nagtayo” ay hindi gaanong malinaw na iniuugnay ang relatibong ὃ ἐποικοδόμησεν sa mismong “gawa”; maaari itong basahing gawa lamang ng isang taong nagtatayo. Mas tapat ang “ang itinayo ng sinuman,” na tuwirang tumutukoy sa bagay/gawang itinayo sa ibabaw ng pundasyon.
  naturalness: Natural at dignificado ang “Kung ... tatanggap siya ng gantimpala.” Mas maigsi at mas likas sa modernong Filipino ang “ang itinayo ng sinuman” kaysa “ang gawa ng sinumang nagtayo.”
  terminology: Ang “gantimpala” ay angkop na malawak na salin ng μισθός sa kontekstong ito. Ang “pundasyon” ay isang makatwirang pagpapalinaw ng ipinahihiwatig na bagay na pinagpatungan ng ἐποικοδόμησεν sa agarang konteksto, at hindi nagpapataw ng doktrinal na pagbasa.
