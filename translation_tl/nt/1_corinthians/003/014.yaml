  text: If anyone’s work that he built on remains[b][a], he will receive a reward.
translation:
  language: tl
  text: Kung mananatili[a] ang itinayo ng sinuman sa ibabaw ng pundasyon, tatanggap siya ng gantimpala[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magpapatuloy” o “makatatagal.”
    reason: lexical_alternative
  - marker: b
    text: O “kabayaran” o “sahod.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ
  choice: Kung
  rationale: Likas at tuwirang nagpapahayag ng payak na kondisyon.
- source_word: τινος τὸ ἔργον
  choice: ang gawa ng sinuman
  rationale: Pinananatili ang di-tiyak na pagtukoy at ang ugnayang paari nang natural sa Tagalog.
- source_word: μενεῖ
  choice: mananatili
  rationale: Tuwirang katumbas ng ideyang manatili o magpatuloy; hindi nito labis na ipinapasok ang larawan ng pagkaligtas sa apoy.
- source_word: ὃ ἐποικοδόμησεν
  choice: nagtayo sa ibabaw ng pundasyon
  rationale: Ipinahihiwatig ng tambalang pandiwa ang pagtatayo sa ibabaw ng isang naunang pundasyon. Ginawang tahasan ang pundasyon upang maging malinaw at natural sa Tagalog ayon sa konteksto.
- source_word: μισθὸν
  choice: gantimpala
  rationale: Angkop sa konteksto ng pagsusuri at kabayaran, habang hindi nililimitahan sa sahod na pangkabuhayan.
- source_word: λήμψεται
  choice: tatanggap siya
  rationale: Natural, dignificado, at wastong hinaharap na anyo sa Tagalog.
theological_decisions:
- issue: Kalikasan ng μισθός sa banal na pagsusuri
  choice: gantimpala
  alternative: kabayaran o sahod
  rationale: Hindi tinutukoy ng talata ang eksaktong anyo ng matatanggap; pinananatiling malawak ng “gantimpala” ang diwa ng recompense nang hindi ipinapalagay ang partikular na doktrina.
translation_notes:
  register: Modernong Filipino na malinaw at dignificado. Ginamit ang “sinuman” at ang kasunod na “siya” bilang natural na pagtukoy sa isang di-tiyak na tao. Tahasang binanggit ang “pundasyon,” na ipinahihiwatig ng ἐποικοδόμησεν at malinaw sa malapit na konteksto.
