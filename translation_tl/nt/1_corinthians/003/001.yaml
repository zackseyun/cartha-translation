base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/001.yaml
  text: And I[a], brothers, was not able to speak to you as spiritual people, but as fleshly people[b], as infants in Messiah.
translation:
  language: tl
  text: At ako, mga kapatid[a], ay hindi nakayang magsalita sa inyo bilang mga taong espirituwal, kundi bilang mga taong makalaman[b], bilang mga sanggol kay Mesiyas.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay nasa panlalaking anyo at maaari ring isaling “mga kapatid na lalaki”; sa kontekstong ito, maaaring kabilang sa pagtawag ang mga kapatid na babae.
    reason: lexical_alternative
  - marker: b
    text: O “mga taong ayon sa laman.”
    reason: lexical_alternative
  - marker: c
    text: O “kay Cristo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀγώ
  choice: At ako
  rationale: Pinananatili ang pang-ugnay na καί at ang tahasang panghalip na ἐγώ, na nagdurugtong sa naunang sinabi at nagtatampok sa personal na sinabi ni Pablo nang hindi labis ang diin.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Ang “mga kapatid” ay likas at marangal sa modernong Tagalog; maaari itong tumukoy sa mga kapatid sa pananampalataya anuman ang kasarian, samantalang itinatala sa talababa na panlalaking anyo ang salitang Griyego.
- source_word: οὐκ ἠδυνήθην
  choice: hindi nakapagsalita
  rationale: Sa pariralang “hindi nakapagsalita,” likas na naihahayag ang nakaraang kawalan ng kakayahang magsalita sa kanila sa paraang binabanggit.
- source_word: λαλῆσαι ὑμῖν
  choice: magsalita sa inyo
  rationale: Tuwirang salin ng pawatas at layong nasa datibo, at karaniwan sa modernong Tagalog.
- source_word: πνευματικοῖς
  choice: mga taong espirituwal
  rationale: Ginagawang tahasan ang substantibong pang-uri sa pamamagitan ng “mga taong,” nang hindi tinutukoy kung ang ibig sabihin ay puspos, may-gulang, o pinapatnubayan ng Espiritu.
- source_word: σαρκίνοις
  choice: mga taong makalaman
  rationale: Pinananatili ang tuwirang pagsalungat sa “espirituwal” at ang kaugnayan sa σάρξ, nang hindi ito pinapalitan ng higit na mapanghusgang “makamundo” o “makasalanan.”
- source_word: νηπίοις
  choice: mga sanggol
  rationale: Pinananatili ang malinaw na talinghaga ng kawalang-gulang at ang diin ng νηπίοις.
- source_word: ἐν Χριστῷ
  choice: nakay Mesiyas
  rationale: Ang “nakay” ay natural na paraang Tagalog upang ipahayag ang relasyonal na gamit ng ἐν sa karaniwang pariralang Paulino, habang pinananatili ng “Mesiyas” ang titulong Χριστός.
theological_decisions:
- issue: Saklaw ng “mga kapatid” (ἀδελφοί)
  choice: mga kapatid
  alternative: mga kapatid na lalaki
  rationale: Bagaman panlalaking maramihan ang anyong Griyego, ang pagtawag ay nakatuon sa kongregasyon at maaaring sumaklaw sa mga lalaki at babae. Ang natural na “mga kapatid” sa Tagalog ay hindi kailangang magtakda ng kasarian; nililinaw ng talababa ang anyong Griyego.
- issue: Kahulugan ng σαρκίνοις
  choice: mga taong makalaman
  alternative: mga taong ayon sa laman
  rationale: Hindi tahasang nilulutas kung inilalarawan ni Pablo ang pagiging nilalang na laman, ang espirituwal na kawalang-gulang, o asal na pinangingibabawan ng laman. Iniiwasan ang mas interpretibong “makamundo” at “makasalanan.”
- issue: Paglalarawan sa Χριστῷ
  choice: Mesiyas
  alternative: Cristo
  rationale: Pinananatili ang puwersa ng Χριστός bilang titulo. Ibinibigay sa talababa ang nakaugaliang transliterasyong “Cristo” nang hindi itinuturing na magkaiba ang tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang paulit-ulit na “gaya ng” upang maipakita ang dalawang paghahambing ng Griyego. Ang “espirituwal/makalaman” ay sadyang nagpapanatili sa teolohikal na pagsalungat at hindi ito pinasimple bilang “mabuti/masama” o “may-gulang/musmos.”
