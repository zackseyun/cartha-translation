  text: So neither the one planting is anything[a], nor the one watering, but God who causes the growth.
translation:
  language: tl
  text: Kaya nga, hindi mahalaga ang nagtatanim, ni ang nagdidilig, kundi ang Diyos na nagpapalago.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang Diyos na nagbibigay ng paglago.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Kaya
  rationale: Ipinahahayag nito ang bunga o kongklusyon mula sa naunang pangangatwiran, sa natural na makabagong Tagalog.
- source_word: ὁ φυτεύων
  choice: ang nagtatanim
  rationale: Pinananatili ang substantibong anyo ng participle at ang larawan ng gawaing pagtatanim.
- source_word: ἐστίν τι
  choice: ang mahalaga
  rationale: Isinasalin nang idiomatiko ang Griyegong ‘ay anuman’ bilang usapin ng kabuluhan o kahalagahan sa konteksto, nang hindi ipinahihiwatig na literal na walang anumang pag-iral o silbi ang mga manggagawa.
- source_word: ὁ ποτίζων
  choice: ang nagdidilig
  rationale: Natural na katumbas sa Tagalog at pinananatili ang paralelismo sa ‘ang nagtatanim.’
- source_word: ἀλλ’
  choice: kundi
  rationale: Ang ‘kundi’ ang natural na panalungat kasunod ng negatibong sugnay at malinaw na inililipat ang diin mula sa mga manggagawa tungo sa Diyos.
- source_word: ὁ αὐξάνων
  choice: na nagpapalago
  rationale: Ipinapakita ang Diyos bilang aktibong sanhi ng paglago, habang hindi nagdaragdag ng tahasang layon na wala sa Griyego.
- source_word: θεός
  choice: ang Diyos
  rationale: Pinananatili ang malinaw at mariing pagtukoy sa Diyos bilang tunay na pinagmumulan ng paglago.
theological_decisions:
- issue: Ang paghahambing sa papel ng mga manggagawa at ng Diyos
  choice: hindi ang nagtatanim o ang nagdidilig ang mahalaga, kundi ang Diyos
  alternative: walang halaga ang nagtatanim ni ang nagdidilig
  rationale: Pinananatili ang mariing pagpapababa sa katayuan ng mga taong manggagawa kung ihahambing sa Diyos, ngunit iniiwasan ang posibleng di-sinasadyang pahiwatig na ganap na walang silbi ang kanilang paglilingkod.
translation_notes:
  register: Makabagong, malinaw, at marangal na Filipino. Inayos ang ayos ng pangungusap upang maging natural sa Tagalog habang pinananatili ang paralelismo at mariing pagtutol sa pagitan ng mga taong manggagawa at ng Diyos.
