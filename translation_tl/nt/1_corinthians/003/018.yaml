base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/018.yaml
  text: Let no one deceive himself[a]. If anyone among you thinks he is wise in this age, let him become foolish[b], so that he may become wise.
translation:
  language: tl
  text: Huwag dayain ng sinuman ang sarili niya. Kung may sinuman sa inyo na nag-aakalang marunong[a] siya sa kapanahunang ito, maging hangal siya[b] upang maging marunong.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “marunong ayon sa mga pamantayan ng kapanahunang ito.”'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring: “maging isang mangmang.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδεὶς ἑαυτὸν ἐξαπατάτω
  choice: Huwag dayain ng sinuman ang kanyang sarili
  rationale: Pinananatili ang pangkalahatang pagbabawal at ang tahasang reflexive na layon, sa natural at dignified na modernong Tagalog.
- source_word: δοκεῖ σοφὸς εἶναι
  choice: nag-aakalang marunong siya
  rationale: Ipinahahayag ang sariling pagtataya na tinutukoy ng δοκεῖ; ang “marunong” ay likas na salin ng σοφός sa kontekstong ito.
- source_word: ἐν ὑμῖν
  choice: sa inyo
  rationale: Natural na tumutukoy sa isang tao sa loob ng pamayanan ng mga kausap.
- source_word: ἐν τῷ αἰῶνι τούτῳ
  choice: sa kapanahunang ito
  rationale: Pinananatili ang temporal at teolohikal na diwa ng αἰών sa halip na gawing simpleng “mundo.”
- source_word: μωρὸς γενέσθω
  choice: maging mangmang siya
  rationale: Pinananatili ang utos at ang matalim na kabalintunaan ng pagiging μωρός upang maging σοφός.
- source_word: ἵνα γένηται σοφός
  choice: upang maging tunay na marunong
  rationale: Pinananatili ang layuning ipinahahayag ng ἵνα. Idinagdag ang “tunay na” upang luminaw sa Tagalog ang kaibhan sa inaakalang karunungan nang hindi tinutukoy ang isang denominasyonal na pagbasa.
theological_decisions:
- issue: Kahulugan ng αἰών sa paghahambing ni Pablo
  choice: kapanahunang ito
  alternative: mundong ito; ayon sa mga pamantayan ng kapanahunang ito
  rationale: Ang “kapanahunan” ay nagpapanatili sa temporal na dimensiyon at sa paghaharap ng kasalukuyang kapanahunan at ng karunungan ng Diyos.
- issue: Kabalintunaan ng μωρός at σοφός
  choice: maging mangmang siya upang maging tunay na marunong
  alternative: maging isang hangal siya upang maging marunong
  rationale: 'Pinananatili ang teolohikal na tensiyon: ang inaakalang marunong ay kailangang tumanggap ng kalagayang itinuturing na mangmang ayon sa kasalukuyang kapanahunan. Hindi nililinaw nang lampas sa sinasabi ng teksto kung ano ang lahat ng praktikal na saklaw nito.'
- issue: Pangkalahatang panlalaking isahan
  choice: sinuman … kanyang sarili … siya
  alternative: walang sinuman ang mandaya sa sarili nila
  rationale: Ang “sinuman” at “siya” ay natural at pangkalahatan sa modernong Tagalog, habang pinananatili ang isahang estruktura ng Griyego nang hindi nagdaragdag ng kasarian na hindi kailangang ipilit sa Tagalog.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignified, at madaling maunawaan. Ginamit ang “kapanahunan” para sa αἰών at pinanatili ang retorikal na kabalintunaan ng talata. Ang bawat talababa ay may katumbas na marker sa pangunahing teksto.
