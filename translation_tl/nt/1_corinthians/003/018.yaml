- from: Huwag dayain ng sinuman ang kanyang sarili. Kung may sinuman sa inyo na nag-aakalang marunong siya sa kapanahunang ito[a], maging mangmang siya[b] upang maging tunay na marunong.
  to: Huwag dayain ng sinuman ang sarili niya. Kung may sinuman sa inyo na nag-aakalang marunong[a] siya sa kapanahunang ito, maging hangal siya[b] upang maging marunong.
  rationale: Inalis ang “tunay na” upang hindi magdagdag ng interpretatibong paglilinaw na wala sa pinagmulan. Pinalitan ang “mangmang” sa pangunahing teksto ng “hangal” upang mas tumpak na maipahayag ang μωρός, habang pinanatili ang “mangmang” bilang isang posibleng alternatibo sa talababa. Inilipat ang marker a upang malinaw na ikabit ang alternatibong pagbasa sa “marunong ... sa kapanahunang ito.”
