  text: and you are Messiah's[b][a], and Messiah is God's.
translation:
  language: tl
  text: at kayo ay pag-aari ng Mesiyas, at ang Mesiyas ay pag-aari ng Diyos.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “kayo ay sa Mesiyas, at ang Mesiyas ay sa Diyos.”
    reason: lexical_alternative
  - marker: b
    text: Sa mga tradisyonal na salin, madalas na “Cristo” ang ginagamit sa halip na “Mesiyas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: kayo
  rationale: Panghalip na ikalawang panauhang maramihan; likas na ipinahahayag ng “kayo” ang maramihang kausap nang hindi nagdaragdag ng diin.
- source_word: δὲ
  choice: at
  rationale: Dito, ipinagpapatuloy ng δέ ang magkakaugnay at bahagyang magkakatunggaling mga pahayag; natural na naihahatid ito ng “at.”
- source_word: Χριστοῦ
  choice: sa Mesiyas
  rationale: Henitibong nagsasaad ng pag-aari o kaugnayan. Pinananatili ng “Mesiyas” ang tungkulin ng Χριστός bilang titulo, at malinaw sa Tagalog ang “kayo ay sa Mesiyas.”
- source_word: Χριστὸς
  choice: ang Mesiyas
  rationale: Inuulit ang titulo sa nominativo upang mapanatili ang simetriya ng dalawang sugnay.
- source_word: θεοῦ
  choice: sa Diyos
  rationale: Henitibong nagpapahayag ng pag-aari o kaugnayan; ang “sa Diyos” ay tuwiran at sadyang hindi nagpapaliwanag nang higit sa maikling Griyego.
theological_decisions:
- issue: Paano isasalin ang magkatulad na henitibong Χριστοῦ at θεοῦ nang hindi pinapahina o ipinapaliwanag nang labis ang ugnayang teolohikal.
  choice: Gamitin ang magkatulad na anyong “kayo ay sa Mesiyas, at ang Mesiyas ay sa Diyos.”
  alternative: “kayo ay pag-aari ng Mesiyas, at ang Mesiyas ay pag-aari ng Diyos”
  rationale: Ang “sa” ay nagpapanatili sa ikli, paralelismo, at lawak ng kahulugan ng Griyego. Ang “pag-aari ng” ay mas tahasang nagsasaad ng pagmamay-ari at maaaring paliitin ang relational na puwersa ng henitibo.
translation_notes:
  register: Modernong Filipino na maikli at marangal. Ang inuulit na “sa” ay natural sa Tagalog at pinananatili ang siksik na paralelismo at tunay na teolohikal na tensiyon ng orihinal.
