  naturalness: Hindi idiomatiko ang “kayo ay sa Mesiyas.” Mas malinaw at natural ang “pag-aari ng,” na naglalahad ng ipinahihiwatig na copula at genitibo nang walang dagdag na teolohikal na pagpapaliwanag. Ang magkatulad na parirala sa dalawang sugnay ay nagpapanatili rin ng retorikal na paralelismo.
