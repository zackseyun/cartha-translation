id: 1CO.3.10
reference: 1 Corinthians 3:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Κατὰ τὴν χάριν τοῦ θεοῦ τὴν δοθεῖσάν μοι ὡς σοφὸς ἀρχιτέκτων θεμέλιον ⸀ἔθηκα, ἄλλος δὲ ἐποικοδομεῖ. ἕκαστος δὲ βλεπέτω πῶς ἐποικοδομεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/010.yaml
  text: According to the grace of God given to me[a], like a wise master builder I laid a foundation, and another builds on it[c][b]. But let each one be careful how he builds.
translation:
  language: tl
  text: Ayon sa biyaya ng Diyos na ibinigay sa akin, naglagay ako ng pundasyon bilang isang marunong na punong tagapagtayo[a], at may ibang nagtatayo sa ibabaw nito. Ngunit mag-ingat ang bawat isa kung paano siya nagtatayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “marunong na arkitekto.” Ang salitang Griyego ay tumutukoy sa isang punong tagapagtayo na nangangasiwa sa pagtatayo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατὰ
  choice: Ayon sa
  rationale: Ipinahahayag nito ang pagkakaayon ng gawain ni Pablo sa biyayang ipinagkaloob sa kaniya, hindi lamang ang paraan o kasangkapang ginamit.
- source_word: χάριν
  choice: biyaya
  rationale: 'Pinananatili nito ang karaniwang teolohikal na bigat ng χάρις sa mga sulat ni Pablo: ang kagandahang-loob at pagpapalakas na nagmumula sa Diyos.'
- source_word: τὴν δοθεῖσάν μοι
  choice: na ibinigay sa akin
  rationale: Tuwirang ipinakikita na ang biyaya ay ipinagkaloob kay Pablo.
- source_word: ὡς σοφὸς ἀρχιτέκτων
  choice: bilang isang marunong na punong tagapagtayo
  rationale: Ang ὡς ay tumutukoy sa papel o kapasidad ni Pablo; ang ἀρχιτέκτων sa sinaunang gamit ay punong tagapagtayong nangangasiwa sa pagtatayo, hindi lamang makabagong arkitekto.
- source_word: θεμέλιον ἔθηκα
  choice: naglagay ako ng pundasyon
  rationale: Natural na pariralang Filipino para sa paglalagay o pagtatatag ng pundasyon, at pinananatili ang metapora ng pagtatayo.
- source_word: ἄλλος δὲ ἐποικοδομεῖ
  choice: at may ibang nagtatayo sa ibabaw nito
  rationale: 'Ginagawang malinaw ang ipinahihiwatig na layon ng tambalang pandiwa: pagtatayo sa ibabaw ng nailagay nang pundasyon.'
- source_word: ἕκαστος δὲ βλεπέτω
  choice: Ngunit mag-ingat ang bawat isa
  rationale: Ipinahahayag ng pautos na βλεπέτω ang mapagbantay at maingat na pagsusuri sa sariling paraan ng pagtatayo.
- source_word: πῶς ἐποικοδομεῖ
  choice: kung paano siya nagtatayo
  rationale: Pinananatili ang pag-uulit ng pandiwa at ang pokus sa paraan o kalidad ng pagtatayo; hindi na inuulit ang 'sa ibabaw nito' dahil malinaw na sa konteksto.
theological_decisions:
- issue: Saklaw ng panlalaking anyong isahan sa ἕκαστος at ἐποικοδομεῖ
  choice: ang bawat isa ... siya
  alternative: ang bawat lalaki ... nagtatayo siya; o bawat tao ... sila
  rationale: Ang panlalaking isahan sa Griyego ay may pangkalahatang kinatawang diwa at hindi limitado sa mga lalaki. Ang 'bawat isa ... siya' ay natural na isahan sa Filipino at hindi nagpapasok ng eksklusibong kasarian.
- issue: Diwa ng χάρις sa atas ni Pablo
  choice: biyaya
  alternative: kagandahang-loob; kaloob
  rationale: Hindi nililinaw nang lampas sa teksto kung ang diin ay pabor, atas, o banal na pagpapalakas; pinananatili ng 'biyaya' ang lawak at teolohikal na tensiyon ng salita.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'punong tagapagtayo' upang maipakita ang sinaunang saklaw ng ἀρχιτέκτων, at ang 'siya' bilang natural na pangkalahatang panghalip na isahan. Ang lahat ng footnote marker ay nasa pangunahing teksto.
source_grounding:
  english_pob_role: consult_only
