  source_fidelity: 'Tapat ang salin sa Griyego: pinananatili nito ang pangkalahatang kundisyon (“Kung sinuman”), ang pag-uulit ng φθείρω sa magkatugmang “sinisira/sisirain,” ang seryosong babala ng paghahatol ng Diyos, at ang pagkakakilanlan ng maramihang “kayo” bilang iisang templo ng Diyos.'
