  terminology: Ang “templo,” “banal,” at “sinisira/sisirain” ay angkop at pare-pareho sa pangunahing kahulugan at tindi ng mga salitang Griyego. Maayos ding naipapaliwanag ng mga talababa ang saklaw na kolektibo ng “kayo” at ang mga posibleng leksikal na kulay ng φθείρω.
