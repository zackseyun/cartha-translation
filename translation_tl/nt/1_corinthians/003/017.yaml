id: 1CO.3.17
reference: 1 Corinthians 3:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἴ τις τὸν ναὸν τοῦ θεοῦ φθείρει, φθερεῖ τοῦτον ὁ θεός· ὁ γὰρ ναὸς τοῦ θεοῦ ἅγιός ἐστιν, οἵτινές ἐστε ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/017.yaml
  text: If anyone destroys God's temple[a], God will destroy him; for God's temple is holy[b], and you are that temple.
translation:
  language: tl
  text: Kung sinisira ng sinuman ang templo ng Diyos[a], sisirain siya ng Diyos. Sapagkat banal ang templo ng Diyos—at kayo ang templong iyon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinapasamâ” o “nilalapastangan”; iisang pandiwang Griyego ang ginamit sa “sinisira” at “sisirain.”
    reason: lexical_alternative
  - marker: b
    text: Maramihan ang “kayo”; sama-samang tinutukoy ni Pablo ang kapulungan bilang templo ng Diyos.
    reason: cultural_note
lexical_decisions:
- source_word: ναός
  choice: templo
  rationale: Ang “templo” ay natural at malinaw sa modernong Tagalog at tumutukoy sa banal na tahanan ng Diyos, hindi lamang sa isang pangkalahatang gusali.
- source_word: φθείρει / φθερεῖ
  choice: sinisira / sisirain
  rationale: Pinanatili ang pag-uulit ng iisang pandiwa at ang bigat ng babala. Maaaring mangahulugan din ang pandiwa ng pagpapasamâ o paglapastangan ayon sa konteksto.
- source_word: τοῦτον
  choice: siya
  rationale: Tumutukoy ito pabalik sa nag-iisang di-tiyak na “sinuman”; natural sa Tagalog ang “siya” nang hindi tinutukoy ang kasarian.
- source_word: ἅγιος
  choice: banal
  rationale: Karaniwan at tuwirang katumbas ito na nagpapanatili sa diwa ng kabanalan at pagkakatalaga sa Diyos.
- source_word: οἵτινές ἐστε ὑμεῖς
  choice: at kayo ang templong iyon
  rationale: Malinaw at natural nitong ipinakikita na ang maramihang “kayo” ay kinikilala bilang iisang templo.
- source_word: ὑμεῖς
  choice: kayo
  rationale: Tahasan nitong pinananatili ang maramihang bilang ng panghalip sa Griyego.
theological_decisions:
- issue: Kung ang templo ng Diyos ay pangunahing tumutukoy sa indibidwal na mananampalataya o sa buong kapulungan
  choice: Ang “kayo” na maramihan ay tumutukoy sa kapulungan bilang isang kabuuan na siyang templo ng Diyos.
  alternative: Maaaring iugnay ang talata sa bawat indibidwal na mananampalataya batay sa mas malawak na teolohiya ng Bagong Tipan.
  rationale: Sa gramatika ng talata, ang pang-isahang “templo” ay itinumbas sa maramihang “kayo,” kaya pinakamalikas sa konteksto ang kolektibong pagtukoy sa kapulungan.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “sinisira/sisirain” upang mapanatili ang pag-uulit at tindi ng orihinal, at ang gitling na em upang idiin nang natural ang kolektibong pagkakakilanlan ng mga mambabasa.
