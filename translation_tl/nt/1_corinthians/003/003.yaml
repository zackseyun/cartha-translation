id: 1CO.3.3
reference: 1 Corinthians 3:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἔτι γὰρ σαρκικοί ἐστε. ὅπου γὰρ ἐν ὑμῖν ζῆλος καὶ ⸀ἔρις, οὐχὶ σαρκικοί ἐστε καὶ κατὰ ἄνθρωπον περιπατεῖτε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/003.yaml
  text: For you are still fleshly. For where there is jealousy and strife among you[a], are you not fleshly and walking according to man?
translation:
  language: tl
  text: Sapagkat makalaman pa rin kayo. Dahil may inggit at alitan sa gitna ninyo, hindi ba kayo makalaman at namumuhay ayon sa paraan ng tao?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “namumuhay sa paraang pantao lamang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι
  choice: pa rin
  rationale: Likas na ipinapahayag sa modernong Tagalog ang nagpapatuloy na kalagayan at pinananatili ang diin ng pagsaway ni Pablo.
- source_word: γὰρ
  choice: sapagkat / dahil
  rationale: Pinananatili ang paliwanag na ugnayan ng dalawang sugnay; ginamit ang magkaibang likas na katumbas upang maiwasan ang matigas na pag-uulit sa Tagalog.
- source_word: σαρκικοί
  choice: makalaman
  rationale: Pinananatili ang kaugnayan sa σάρξ o “laman” at ang talinghaga ni Pablo, sa halip na ipakahulugan agad bilang “makasalanan” o “makamundo.”
- source_word: ὅπου
  choice: may ... sa gitna ninyo
  rationale: 'Inihahatid nang natural sa Tagalog ang lokatibong diwa: ang inggit at alitan na nasa kanilang kalipunan ang patunay ng kanilang kalagayan.'
- source_word: ζῆλος
  choice: inggit
  rationale: Sa negatibong konteksto at katambal ng ἔρις, tumutukoy ito sa mapanirang selos o inggit; ang “inggit” ay mas malinaw sa kasalukuyang gamit kaysa “paninibugho.”
- source_word: ἔρις
  choice: alitan
  rationale: Saklaw nito ang hidwaan at pagtatalo nang hindi nililimitahan ang salita sa pasalitang pag-aaway lamang.
- source_word: οὐχὶ
  choice: hindi ba kayo
  rationale: Pinananatili ang retorikal na tanong na umaasang sasang-ayon ang mga mambabasa.
- source_word: κατὰ ἄνθρωπον
  choice: ayon sa paraan ng tao
  rationale: Malapit ito sa anyo ng isahang ἄνθρωπον at hindi agad nilulutas ang etikal at teolohikal na diin ng parirala.
- source_word: περιπατεῖτε
  choice: namumuhay
  rationale: Ang literal na “lumalakad” ay maaaring maging malabo rito sa ordinaryong Tagalog; malinaw na naihahatid ng “namumuhay” ang talinghaga ng asal at paraan ng pamumuhay.
theological_decisions:
- issue: Pagpapahayag sa σαρκικοί na kaugnay ng σάρξ
  choice: makalaman
  alternative: makamundo; kumikilos ayon sa makasalanang kalikasan
  rationale: Pinananatili ng “makalaman” ang sadyang bokabularyo ni Pablo tungkol sa laman at hindi nagdaragdag ng isang ganap na paliwanag tungkol sa “makasalanang kalikasan” na wala sa mismong pang-uri.
- issue: Kahulugan ng κατὰ ἄνθρωπον
  choice: ayon sa paraan ng tao
  alternative: gaya lamang ng karaniwang tao; sa paraang pantao
  rationale: Pinananatili sa pangunahing teksto ang kakaiba ngunit nauunawaang pahayag ng Griyego. Ibinibigay sa talababa ang mas idyomatikong posibilidad nang hindi ipinipilit na iyon lamang ang kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran at marangal. Pinanatili ang “makalaman” bilang mahalagang terminong teolohikal, samantalang isinalin ang περιπατεῖτε bilang “namumuhay” upang maging malinaw sa karaniwang mambabasa. Inilagay ang talababa pagkatapos ng pariralang tinutukoy nito.
