  yaml_path: translation/nt/1_corinthians/003/020.yaml
  text: And again[a], “The Lord knows the thoughts of the wise[c][b], that they are futile.”
translation:
  language: tl
  text: At muli, “Alam ng Panginoon na walang saysay ang mga iniisip ng marurunong.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga pangangatwiran” ang “mga iniisip,” at maaari ring “walang kabuluhan” o “hungkag” ang “walang saysay.”
    reason: lexical_alternative
  - marker: b
    text: Sipi mula sa Awit 94:11 (93:11 sa Septuagint).
    reason: cross_reference
lexical_decisions:
- source_word: καὶ πάλιν
  choice: At muli
  rationale: Ipinakikilala nito ang isa pang sipi bilang karagdagang patunay; maikli at natural ito sa modernong Tagalog.
- source_word: Κύριος
  choice: ang Panginoon
  rationale: Karaniwang marangal at malinaw na katumbas ng κύριος sa kontekstong tumutukoy sa Diyos.
- source_word: γινώσκει
  choice: Alam
  rationale: Tuwirang ipinahahayag ang kaalaman ng Panginoon nang walang dagdag na pagpapakahulugan.
- source_word: διαλογισμοὺς
  choice: mga pangangatwiran
  rationale: Saklaw nito ang mga iniisip at proseso ng pangangatuwiran, at angkop sa konteksto ng karunungang pantao.
- source_word: τῶν σοφῶν
  choice: ng marurunong
  rationale: Likas na substantibong gamit sa Tagalog at hindi nililimitahan sa kasarian o sa pormal na pinag-aralan.
- source_word: ὅτι
  choice: na
  rationale: Ipinakikilala nito ang nilalaman ng nalalaman ng Panginoon, hindi ang dahilan ng kaniyang pagkaalam.
- source_word: μάταιοι
  choice: walang saysay
  rationale: Natural at malinaw na ipinahihiwatig ang pagiging hungkag o walang kabuluhan ng mga pangangatwiran.
