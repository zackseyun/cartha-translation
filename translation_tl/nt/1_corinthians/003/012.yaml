  text: If anyone builds on the foundation with gold, silver, precious stones, wood, hay, straw,
translation:
  language: tl
  text: Kung may sinumang magtayo sa ibabaw ng pundasyon gamit ang ginto, pilak, mahahalagang bato, kahoy, tuyong damo, dayami,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δέ τις
  choice: Kung may sinuman
  rationale: Likas na nagpapahayag ng bukás at pangkalahatang kondisyon sa Filipino. Hindi isinama ang hiwalay na panandang panayam para sa δέ sapagkat banayad lamang ang pag-usad nito sa argumento at malinaw na ang ugnayan sa konteksto.
- source_word: ἐποικοδομεῖ ἐπὶ τὸν θεμέλιον
  choice: magtayo sa ibabaw ng pundasyon
  rationale: Pinananatili ang larawan ng pagtatayo sa nauna nang inilatag na pundasyon; malinaw at natural ang parirala sa modernong Filipino.
- source_word: χρυσόν
  choice: ginto
  rationale: Tuwirang katawagan sa materyal.
- source_word: ἄργυρον
  choice: pilak
  rationale: Tuwirang katawagan sa materyal at kaagapay ng ginto sa talaan.
- source_word: λίθους τιμίους
  choice: mahahalagang bato
  rationale: Sinasaklaw nito ang mga batong mamahalin o mataas ang halaga nang hindi nililimitahan ang kahulugan sa maliliit na hiyas.
- source_word: ξύλα
  choice: kahoy
  rationale: Karaniwang pangngalang pangmasa sa Filipino para sa materyal na ginagamit sa pagtatayo.
- source_word: χόρτον
  choice: tuyong damo
  rationale: Sa talaan ng mga materyales, ipinahihiwatig nito ang hay; mas malinaw ang “tuyong damo” kaysa sa hiram o di-karaniwang katawagan.
- source_word: καλάμην
  choice: dayami
  rationale: Angkop sa tuyong tangkay na natitira matapos anihin ang butil at malinaw na naipag-iiba sa tuyong damo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang metapora ng pundasyon at pagtatayo, pati ang pagkakasunod ng anim na materyales. Ginamit ang “o” bago ang huling aytem upang maging natural ang talaan sa Filipino nang hindi binabago ang lohika ng Griyego.
