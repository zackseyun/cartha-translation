id: 1CO.3.21
reference: 1 Corinthians 3:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὥστε μηδεὶς καυχάσθω ἐν ἀνθρώποις· πάντα γὰρ ὑμῶν ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/021.yaml
  text: So then[a], let no one boast in people[b], for all things are yours.
translation:
  language: tl
  text: Kaya, huwag ipagmalaki ninuman ang mga tao[a], sapagkat ang lahat ng bagay ay sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ayon sa konteksto, “mga pinuno.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: Kaya
  rationale: Ipinahihiwatig nito ang kongklusyong hinango mula sa naunang pangangatwiran; natural at malinaw sa modernong Tagalog ang “Kaya.”
- source_word: μηδεὶς
  choice: ninuman
  rationale: 'Pinananatili nito ang pangkalahatang saklaw ng pagbabawal: walang sinuman ang dapat gumawa nito.'
- source_word: καυχάσθω
  choice: huwag ipagmalaki
  rationale: Nananatili ang diwa ng pagmamapuri o pagyayabang batay sa isang tao, habang natural ang anyo ng pagbabawal sa Tagalog.
- source_word: ἐν ἀνθρώποις
  choice: ang mga tao
  rationale: Sa konstruksyong kasama ng καυχάομαι, ipinakikita ng ἐν ang batayan ng pagmamalaki. Ang “mga tao” ay tapat sa pangkalahatan at maramihang ἀνθρώποις, nang hindi nililimitahan sa mga lalaki o tahasang ginagawang “mga pinuno.”
- source_word: πάντα
  choice: ang lahat ng bagay
  rationale: Pinananatili ang malawak at komprehensibong saklaw ng neuter plural at ang retorikal na diin ni Pablo.
- source_word: γὰρ
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang pagbabawal.
- source_word: ὑμῶν ἐστιν
  choice: ay sa inyo
  rationale: Natural na ipinahahayag sa Tagalog ang pag-aari habang nananatiling tuwiran ang pahayag.
theological_decisions:
- issue: Kung ang ἀνθρώποις ay dapat tahasang isaling “mga pinuno”
  choice: Pinanatili sa pangunahing teksto ang mas malawak na “mga tao.”
  alternative: mga pinuno
  rationale: Ang konteksto ay tumutukoy kina Pablo, Apolos, at Cefas, kaya posibleng mga pinuno ang partikular na tinutukoy; gayunman, mas malawak ang mismong salitang Griyego at hindi dapat paliitin nang walang pahiwatig.
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Ginamit ang “ninuman” para sa maikli at maayos na daloy; ang “mga tao” ay likas na pangkalahatan sa Tagalog at hindi nangangailangan ng hiwalay na tala tungkol sa kasarian.
