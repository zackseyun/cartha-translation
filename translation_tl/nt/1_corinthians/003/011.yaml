  yaml_path: translation/nt/1_corinthians/003/011.yaml
  text: For no one can lay another foundation besides the one already laid[a], which is Jesus the Messiah.
translation:
  language: tl
  text: Sapagkat walang sinumang makapaglalagay ng ibang pundasyon maliban sa pundasyong nailagay na, na siyang si Jesus, ang Mesiyas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “si Jesu-Cristo.”'
    reason: Tradisyonal na alternatibong anyo para sa Ἰησοῦς Χριστός.
lexical_decisions:
- source_word: θεμέλιον
  choice: pundasyon
  rationale: Tuwirang tumutukoy ito sa pundasyon ng isang gusali at pinananatili ang talinghaga ni Pablo tungkol sa pagtatayo.
- source_word: γὰρ
  choice: sapagkat
  rationale: Ipinakikita nito na ang pangungusap ay nagbibigay ng dahilan o paliwanag sa naunang pahayag.
- source_word: ἄλλον
  choice: ibang
  rationale: Ipinahihiwatig nito ang isang naiiba o karagdagang pundasyon.
- source_word: οὐδεὶς δύναται θεῖναι
  choice: walang sinumang makapaglalagay
  rationale: Natural nitong pinagsasama sa Filipino ang pangkalahatang pagtanggi, kakayahan, at kilos ng paglalagay ng pundasyon.
- source_word: παρὰ τὸν κείμενον
  choice: maliban sa nailagay na
  rationale: Pinananatili ng “maliban sa” ang eksklusibong diwa ng παρά, samantalang ipinahihiwatig ng “nailagay na” na ang pundasyon ay nakalagay na at nananatili roon.
- source_word: ὅς ἐστιν
  choice: —si
  rationale: Ginagamit ang gitling upang natural na ipakilala sa Filipino ang tiyak na pagkakakilanlan ng pundasyon nang hindi binabago ang talinghaga.
- source_word: Ἰησοῦς Χριστός
  choice: si Jesus, ang Mesiyas
  rationale: Isinasalin ang Χριστός bilang titulong “Mesiyas” at pinananatili ang pangalang Jesus sa malinaw at likas na anyong Filipino.
theological_decisions:
- issue: Pagbibigay-kahulugan sa Χριστός sa Ἰησοῦς Χριστός
  choice: si Jesus, ang Mesiyas
  alternative: si Jesus Cristo
  rationale: Pinananatili ng pangunahing salin ang kahulugan ng Χριστός bilang titulo sa kontekstong kinikilala si Jesus bilang nag-iisang pundasyon. Inilalagay sa talababa ang tradisyonal na anyo nang hindi ipinapalagay na apelyido lamang ang Χριστός.
- issue: Pagkakakilanlan ni Jesus at ng pundasyon
  choice: —si Jesus, ang Mesiyas
  alternative: na siyang si Jesus, ang Mesiyas
  rationale: Tahasang pinananatili ang pagkakakilanlan sa Greek na ὅς ἐστιν, ngunit gumagamit ng mas natural na Filipino at hindi ipinapaliwanag nang lampas sa sinabi ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “makapaglalagay ng pundasyon” bilang karaniwang pananalita sa talinghaga ng pagtatayo; ang gitling ay tumutulong upang maiwasan ang alanganing sunod-sunod na “na” habang pinananatili ang tuwirang pagkakakilanlan.
