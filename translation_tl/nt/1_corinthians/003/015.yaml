base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/015.yaml
  text: If anyone’s work is burned up[a], he will suffer loss, but he himself will be saved—yet as through fire.
translation:
  language: tl
  text: Kung masunog ang gawa ng sinuman, magdaranas siya ng kawalan; ngunit siya mismo ay maliligtas—tulad ng isang dumaraan sa apoy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ngunit para bang nakatakas lamang sa apoy.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ τινος
  choice: Kung ... ng sinuman
  rationale: Pinananatili nito ang payak na kondisyon at di-tiyak na pagtukoy sa sinumang taong tinutukoy.
- source_word: τὸ ἔργον
  choice: ang gawa
  rationale: Ang “gawa” ay malawak at maikli, at naaangkop sa bunga ng paggawa o pagtatayo ng tao sa konteksto.
- source_word: κατακαήσεται
  choice: masunog
  rationale: Sa konteksto ng pagsubok sa pamamagitan ng apoy, ipinahihiwatig ng pandiwa na lubusang natutupok ang gawa; natural sa Tagalog ang “masunog” nang hindi dinaragdagan ang larawan.
- source_word: ζημιωθήσεται
  choice: mawawalan siya
  rationale: Ipinahahayag nito ang pagdanas ng kawalan nang hindi tinutukoy kung ano mismo ang nawala o ipinapasok ang salitang “gantimpala,” na hindi tahasang nasa Griyego.
- source_word: αὐτὸς δὲ
  choice: ngunit siya mismo
  rationale: Pinananatili ng “siya mismo” ang diin at ang kaibahan sa pagitan ng natupok na gawa at ng taong maliligtas.
- source_word: σωθήσεται
  choice: ay maliligtas
  rationale: Ang “maliligtas” ang tuwirang katumbas na angkop sa gamit ni Pablo at nagpapanatili sa teolohikal na bigat ng pahayag.
- source_word: οὕτως δὲ ὡς διὰ πυρός
  choice: subalit gaya ng pagdaan sa apoy
  rationale: Pinananatili nito ang maikli at matingkad na larawan ng pagdaan sa apoy, nang hindi nagpapasya kung ito ay paglilinis, kaparusahan, o bahagyang pagtakas.
theological_decisions:
- issue: Kung dapat bang ipakahulugan ang huling parirala bilang purgatoryal na paglilinis o bilang bahagyang pagtakas lamang.
  choice: subalit gaya ng pagdaan sa apoy
  alternative: subalit para bang nakatakas lamang sa apoy
  rationale: Hindi lubusang ipinaliliwanag ng Griyego ang talinghaga. Pinananatili ng napiling salin ang teolohikal na tensiyon at iniiwasang ipasok ang isang denominasyonal na paliwanag.
- issue: Kung dapat tukuyin ang nawalang bagay bilang gantimpala.
  choice: mawawalan siya
  alternative: mawawalan siya ng gantimpala
  rationale: Bagaman maaaring ipahiwatig ng konteksto ang gantimpala, walang tahasang layon ang ζημιωθήσεται. Hindi ito dinagdagan upang mapanatili ang saklaw ng orihinal.
translation_notes:
  register: Makabagong Filipino na natural at marangal. Ginamit ang “gawa” at “mawawalan” upang maging malinaw sa karaniwang mambabasa, habang pinananatili ang maigsi at hindi ganap na ipinaliwanag na larawan ng apoy.
