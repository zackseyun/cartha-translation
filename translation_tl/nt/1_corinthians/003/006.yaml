  text: I planted[a], Apollos watered, but God gave the growth.
translation:
  language: tl
  text: Ako ang nagtanim, si Apolos ang nagdilig, ngunit ang Diyos ang patuloy na nagpapalago.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγὼ
  choice: Ako ang
  rationale: Pinananatili ang diin ng tahasang panghalip sa Griyego sa natural na paraang Tagalog.
- source_word: ἐφύτευσα
  choice: nagtanim
  rationale: Tuwirang pinananatili ang larawang pang-agrikultura at ang kaibahan nito sa pagdidilig.
- source_word: Ἀπολλῶς
  choice: Apolos
  rationale: Ginamit ang karaniwang anyong Tagalog ng pangalan.
- source_word: ἐπότισεν
  choice: nagdilig
  rationale: Natural at maikling katumbas na nagpapatuloy sa larawan ng pagtatanim.
- source_word: ἀλλὰ
  choice: ngunit
  rationale: Malinaw at marangal na panandang nagpapakita ng matibay na pagsalungat.
- source_word: ὁ θεὸς
  choice: ang Diyos
  rationale: Ipinakikilala ang Diyos bilang siyang gumagawa ng mapagpasyang pagkilos, kaiba sa mga manggagawang tao.
- source_word: ηὔξανεν
  choice: ang patuloy na nagpapalago
  rationale: Ipinahahayag ang nagpatuloy na pagkilos na ipinahihiwatig ng imperfect, habang natural na inilalarawan ang Diyos bilang sanhi ng paglago.
theological_decisions:
- issue: Pagkilos ng Diyos kaugnay ng paglilingkod ng tao
  choice: May tunay na ginampanang gawain sina Pablo at Apolos, ngunit ang Diyos ang patuloy na nagpapalago.
  alternative: Ang Diyos ang nagbigay ng paglago.
  rationale: Pinananatili nito ang tensiyon sa teksto sa pagitan ng tunay na paggawa ng tao at ng mapagpasyang pagkilos ng Diyos, nang walang idinaragdag na doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na maikli, natural, at marangal. Ang parallel na ‘nagtanim / nagdilig / nagpapalago’ ay nagpapanatili sa agrikultural na talinghaga at sa retorikal na paghahambing.
