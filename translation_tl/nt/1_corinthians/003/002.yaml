id: 1CO.3.2
reference: 1 Corinthians 3:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: γάλα ὑμᾶς ἐπότισα, ⸀οὐ βρῶμα, οὔπω γὰρ ἐδύνασθε. ἀλλ’ ⸀οὐδὲ ἔτι νῦν δύνασθε,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/002.yaml
  text: I fed you milk[a], not solid food, for you were not yet able. But even now you are still not able[b],
translation:
  language: tl
  text: Gatas ang ipinainom ko sa inyo, hindi matigas na pagkain[a], sapagkat hindi pa ninyo kaya noon. Ngunit kahit ngayon, hindi pa rin ninyo kaya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “pagkain” lamang; ginamit dito ang “matigas na pagkain” upang ipakita ang paghahambing sa gatas.
    reason: lexical_alternative
lexical_decisions:
- source_word: γάλα
  choice: gatas
  rationale: Tuwirang katumbas ito at pinananatili ang larawan ng pagpapakain na ginamit ni Pablo.
- source_word: ἐπότισα
  choice: ipinainom ko
  rationale: Ang pandiwa ay tumutukoy sa pagbibigay ng maiinom. Likas sa Tagalog ang “ipinainom” at mas malapit ito sa anyo ng Griyego kaysa sa mas malawak na “ipinakain.”
- source_word: βρῶμα
  choice: matigas na pagkain
  rationale: Karaniwang nangangahulugang “pagkain” ang salita, ngunit nililinaw ng “matigas” ang tahasang paghahambing sa gatas sa natural na Tagalog.
- source_word: οὔπω γὰρ ἐδύνασθε
  choice: sapagkat hindi pa ninyo kaya noon
  rationale: Ipinahahayag ng “hindi pa” ang temporal na pagtanggi, at nililinaw ng “noon” ang nakaraang kakayahang tinutukoy ng imperfect na pandiwa.
- source_word: ἀλλ’ οὐδὲ ἔτι νῦν δύνασθε
  choice: Ngunit kahit ngayon, hindi pa rin ninyo kaya
  rationale: Pinagsasama ng “kahit ngayon” at “hindi pa rin” ang diin sa kasalukuyan at ang pagpapatuloy ng kanilang kawalan ng kakayahan.
theological_decisions:
- issue: Kahulugan ng talinghaga tungkol sa gatas at pagkain
  choice: Panatilihin ang mismong larawan ng gatas at matigas na pagkain nang hindi ipinapaliwanag sa talata kung anong uri ng turo ang tinutukoy.
  alternative: Isalin nang paliwanag bilang “mga panimulang aral” at “mas malalalim na aral.”
  rationale: Talinghaga ang ginamit ng Griyego. Ang pagpapanatili nito ay umiiwas sa pagpasok ng interpretasyong hindi tahasang sinasabi ng teksto.
- issue: Hindi tahasang layon ng “kaya”
  choice: Iwanang hindi binabanggit kung ano mismo ang hindi nila kaya.
  alternative: Idagdag ang “tanggapin” o “unawain.”
  rationale: Walang tahasang layon ang δύνασθε sa sugnay. Pinananatili ng salin ang tunay na puwang na ito sa teksto sa halip na magtakda ng isang interpretasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ang “ipinainom” ay natural at tumpak, samantalang ang magkatugmang “hindi pa ninyo kaya noon” at “hindi pa rin ninyo kaya” ay nagpapanatili sa diin at pag-usad ng panahon sa Griyego.
