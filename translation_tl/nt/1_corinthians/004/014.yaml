  yaml_path: translation/nt/1_corinthians/004/014.yaml
  text: I am not writing these things to shame you[b][a], but admonishing you as my beloved children.
translation:
  language: tl
  text: Hindi ko isinusulat ang mga bagay na ito upang ipahiya kayo, kundi pinapayuhan ko kayo bilang minamahal kong mga anak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “binabalaan ko kayo bilang minamahal kong mga anak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντρέπων
  choice: upang ipahiya
  rationale: Sa ilalim ng οὐκ at kaugnay ng γράφω, ipinahahayag nito ang itinatangging layunin ng pagsulat. Pinananatili ng “ipahiya” ang lakas ng kontekstong dangal at kahihiyan.
- source_word: γράφω ταῦτα
  choice: isinusulat ko ang mga bagay na ito
  rationale: Pinananatili ang pangkasalukuyang kilos ng γράφω at ang maramihang ταῦτα sa natural na Tagalog.
- source_word: ἀλλ’
  choice: kundi
  rationale: Likas na ipinakikita ang tuwirang pagsalungat sa naunang sugnay na may “hindi.”
- source_word: ὡς
  choice: bilang
  rationale: Ipinahahayag ang ugnayang pinagbabatayan ng pagpapayo nang hindi dinaragdagan ang kahulugan.
- source_word: τέκνα μου ἀγαπητὰ
  choice: minamahal kong mga anak
  rationale: Ang τέκνα ay sumasaklaw sa lahat ng kasarian, at ang “minamahal” ay nagpapanatili sa magiliw at marangal na tono ng ἀγαπητά.
- source_word: νουθετῶν
  choice: pinapayuhan ko kayo
  rationale: Sa kontekstong ito, ang νουθετέω ay mapagmahal ngunit mapagtuwid na pagpapayo. Natural sa modernong Tagalog ang “pinapayuhan,” samantalang maaaring kabilang din sa salita ang babala, gaya ng nililinaw sa talababa.
theological_decisions:
- issue: Tono ng mapagtuwid na pagkalinga ni Pablo
  choice: “pinapayuhan ko kayo bilang minamahal kong mga anak”
  alternative: “binabalaan ko kayo bilang minamahal kong mga anak”
  rationale: Pinananatili ng salin ang tunay na pagtutuwid ngunit inilalagay ito sa hayagang mapagmahal na ugnayan. Hindi nito ginagawang malupit na pagsaway lamang o banayad na payo lamang ang νουθετῶν.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “mga anak” bilang gender-inclusive at ang “pinapayuhan” upang pagsamahin ang mapagmahal na tono at mapagtuwid na layunin.
