  source_fidelity: 'Tapat ang salin sa pangunahing estruktura at kahulugan ng Griyego: ang “Hindi ko isinusulat ang mga bagay na ito upang ipahiya kayo” ay wastong naghahayag ng itinatangging layunin ng οὐκ ἐντρέπων ... γράφω ταῦτα, at ang “kundi pinapayuhan ko kayo” ay sapat na natural na Tagalog para sa mapagtuwid na νουθετῶν. Napananatili ang maramihang “mga bagay na ito,” ang pagsalungat ng ἀλλά, at ang mapagmahal na ugnayan sa τέκνα μου ἀγαπητά.'
  naturalness: Natural, malinaw, at marangal ang modernong Filipino Tagalog. Ang “bilang minamahal kong mga anak” ay angkop sa pastoral na rehistro. Bagaman mas magaan nang kaunti ang “pinapayuhan” kaysa sa ilang gamit ng “admonishing,” hindi nito inaalis ang kontekstuwal na mapagtuwid na diwa, at sinusuportahan ito ng talababa.
  terminology: Wasto ang “ipahiya” para sa ἐντρέπων at ang gender-inclusive na “mga anak” para sa τέκνα. Ang “minamahal” ay angkop na katumbas ng ἀγαπητά. Ang alternatibong “binabalaan” sa talababa ay lehitimong lexical na posibilidad para sa νουθετῶν, nang hindi ipinipilit na iyon lamang ang kahulugan.
