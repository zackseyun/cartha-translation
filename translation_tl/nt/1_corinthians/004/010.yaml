id: 1CO.4.10
reference: 1 Corinthians 4:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἡμεῖς μωροὶ διὰ Χριστόν, ὑμεῖς δὲ φρόνιμοι ἐν Χριστῷ· ἡμεῖς ἀσθενεῖς, ὑμεῖς δὲ ἰσχυροί· ὑμεῖς ἔνδοξοι, ἡμεῖς δὲ ἄτιμοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/010.yaml
  text: We are fools for Messiah[a], but you are wise in Messiah; we are weak, but you are strong; you are honored[c][b], but we are dishonored.
translation:
  language: tl
  text: Kami ay mga hangal dahil sa Mesiyas[a], ngunit kayo ay marurunong sa Mesiyas[b]; kami ay mahihina, ngunit kayo ay malalakas; kayo ay pinararangalan[c], ngunit kami ay walang karangalan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “alang-alang sa Mesiyas.” Ang pariralang Griyego ay maaaring tumukoy sa dahilan o layunin.
    reason: lexical_alternative
  - marker: b
    text: Ang “sa Mesiyas” ay salin ng karaniwang pahayag ni Pablo na ἐν Χριστῷ; maaari itong unawain bilang pagiging kaugnay o kaisa ng Mesiyas.
    reason: lexical_alternative
  - marker: c
    text: Ang “pinararangalan” at “walang karangalan” ay tumutukoy lalo na sa katayuan at pagtingin ng ibang tao sa kanila, hindi lamang sa kanilang pansariling damdamin.
    reason: cultural_note
lexical_decisions:
- source_word: μωροὶ
  choice: mga hangal
  rationale: Pinananatili ang matalim at mapanuyang paghahambing ni Pablo, at mas tuwiran ito kaysa sa abstraktong “mangmang.”
- source_word: διὰ Χριστόν
  choice: dahil sa Mesiyas
  rationale: Ang διά na may accusative ay maaaring magpahayag ng dahilan o kapakanan; ang “dahil sa” ay likas sa modernong Tagalog at akma sa konteksto, habang itinatala sa talababa ang ibang posibilidad.
- source_word: φρόνιμοι
  choice: marurunong
  rationale: Tuwirang katapat ng “mga hangal” at pinananatili ang retorikal na balanse.
- source_word: ἐν Χριστῷ
  choice: sa Mesiyas
  rationale: Pinananatili ang sadyang malawak na Pauline expression na ἐν Χριστῷ sa halip na paliitin ito sa isang tiyak na paliwanag gaya ng “sa pakikipag-isa.”
- source_word: ἀσθενεῖς / ἰσχυροί
  choice: mahihina / malalakas
  rationale: Natural at tuwirang magkasalungat na mga salita na hindi labis na nililimitahan ang kahulugan sa katawan, kapangyarihan, o katayuan lamang.
- source_word: ἔνδοξοι / ἄτιμοι
  choice: pinararangalan / walang karangalan
  rationale: Ipinahahayag ang pampublikong dangal at kahihiyang nakapaloob sa paghahambing, habang pinananatili ang malinaw na pagsalungat.
- source_word: ἡμεῖς / ὑμεῖς
  choice: kami / kayo
  rationale: Pinananatili ang mariing paghahambing ng mga apostol at ng mga taga-Corinto.
theological_decisions:
- issue: Pagsasalin ng Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Dito ay pinananatili ang titulong “Mesiyas,” nang hindi ito tinatratong pangalan lamang.
- issue: Saklaw ng ἐν Χριστῷ
  choice: sa Mesiyas
  alternative: sa pakikipag-isa sa Mesiyas
  rationale: Ang mas pormal na anyo ay nagpapanatili sa lawak at teolohikal na tensiyon ng karaniwang pahayag ni Pablo, sa halip na tahasang tukuyin ang uri ng kaugnayan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang tatlong sunod-sunod at mapanuyang paghahambing sa pamamagitan ng inuulit na “kami” at “kayo,” pati ang mga panandang “ngunit.”
