  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Οὕτως ἡμᾶς λογιζέσθω ἄνθρωπος ὡς ὑπηρέτας Χριστοῦ καὶ οἰκονόμους μυστηρίων θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/001.yaml
  text: 'This is how a person should regard us: as servants of Messiah and stewards of the mysteries of God[a][b].'
translation:
  language: tl
  text: 'Ganito dapat kaming ituring ng sinuman: mga lingkod ng Mesiyas[a] at mga katiwala ng mga hiwaga ng Diyos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Cristo.” Ang salitang Griyego na Χριστός ay isang titulong nangangahulugang ang Pinahiran.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὕτως
  choice: Ganito
  rationale: Natural na ipinakikita ang paraan kung paano dapat kilalanin o ituring sina Pablo at ang mga kasama niya.
- source_word: ἡμᾶς
  choice: kami
  rationale: Tumutukoy kay Pablo at sa mga kapwa niya lingkod na binabanggit sa konteksto; ang eksklusibong “kami” ang angkop sa Tagalog.
- source_word: λογιζέσθω
  choice: dapat ituring
  rationale: Ipinahahayag ang normatibong utos na bumuo ng ganitong pagkilala sa kanila, sa natural na modernong Tagalog.
- source_word: ἄνθρωπος
  choice: sinuman
  rationale: Bagaman panlalaking isahan ang anyong Griyego, pangkalahatan ang gamit nito rito. Likas na naihahayag ng “sinuman” ang kahulugang sinumang tao nang hindi nililimitahan sa lalaki.
- source_word: ὡς
  choice: bilang diwa ng tutuldok
  rationale: Sa Tagalog, natural na ipinahihiwatig ng tutuldok pagkatapos ng “ituring” ang kapasidad na tinutukoy ng ὡς; hindi kailangang ulitin ang “bilang.”
- source_word: ὑπηρέτας
  choice: mga lingkod
  rationale: Nagsasaad ng mga nasa ilalim ng awtoridad na naglilingkod, ngunit hindi nito taglay ang tiyak na katayuang ipinahihiwatig ng salitang Griyego para sa alipin.
- source_word: Χριστοῦ
  choice: ng Mesiyas
  rationale: Gumaganap dito bilang titulo ng pinahirang hari na pinaglilingkuran nila; pinananatili ng “Mesiyas” ang titular na diwa.
- source_word: οἰκονόμους
  choice: mga katiwala
  rationale: Tumpak na inilalarawan ang mga tagapangasiwang pinagkatiwalaan ng pananagutan sa pag-aari o sambahayan ng iba.
- source_word: μυστηρίων
  choice: mga hiwaga
  rationale: Pinananatili ang katawagan ni Pablo para sa mga katotohanang mula sa Diyos na hindi likas na nalalaman at inihahayag niya, nang hindi nagdaragdag ng paliwanag sa mismong talata.
- source_word: θεοῦ
  choice: ng Diyos
  rationale: 'Pinananatili ang ugnayang genitibo: ang mga hiwaga ay sa Diyos at nagmumula sa kanya.'
theological_decisions:
- issue: Pagpapahayag sa Χριστοῦ
  choice: ng Mesiyas
  alternative: ni Cristo
  rationale: Sa kontekstong ito, aktibo ang diwa ng Χριστός bilang titulo ng pinahirang hari. Ang “Mesiyas” ay malinaw at likas sa modernong Filipino, habang inilalagay sa talababa ang tradisyonal na alternatibo.
- issue: Pangkalahatang gamit ng ἄνθρωπος
  choice: sinuman
  alternative: isang tao
  rationale: Hindi partikular na lalaki ang tinutukoy ng Griyego kundi ang sinumang magbibigay-hatol tungkol sa mga apostol. Pinananatili ng “sinuman” ang pangkalahatang saklaw at mas natural ito kaysa sa literal ngunit maaaring malabong “isang tao.”
- issue: Diwa ng μυστηρίων θεοῦ
  choice: mga hiwaga ng Diyos
  alternative: mga lihim na ipinahayag ng Diyos
  rationale: Hindi tahasang sinasabi ng parirala rito kung paano o kailan inihayag ang mga hiwaga. Ang mas maikling anyo ay nagpapanatili sa lawak at teolohikal na tensiyon ng salita.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “sinuman” para sa likas na pangkalahatang diwa, “lingkod” sa halip na “alipin,” at “katiwala” upang mapanatili ang talinghaga ng ipinagkatiwalang pamamahala.
