  text: ἐλεύσομαι δὲ ταχέως πρὸς ὑμᾶς, ἐὰν ὁ κύριος θελήσῃ, καὶ γνώσομαι οὐ τὸν λόγον τῶν πεφυσιωμένων ἀλλὰ τὴν δύναμιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/019.yaml
  text: But I will come to you soon[a], if the Lord wills, and I will find out not the speech of those who are puffed up[b], but the power.
translation:
  language: tl
  text: Ngunit pupunta ako sa inyo sa madaling panahon, kung loloobin ng Panginoon, at aalamin ko, hindi ang pananalita ng mga nagmamalaki[a], kundi ang kapangyarihan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga nagmamalaki” ay salin ng salitang paulit-ulit na ginagamit ni Pablo sa liham na ito para sa mga taong waring napintog dahil sa kapalaluan o pagmamataas.
    reason: cross_reference
lexical_decisions:
- source_word: ἐλεύσομαι
  choice: pupunta ako
  rationale: Payak na panghinaharap ang diwa; natural sa Filipino ang “pupunta ako sa inyo” para sa pagkilos ni Pablo patungo sa mga taga-Corinto.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahahayag ang banayad na pagsalungat sa naunang sinabi.
- source_word: ταχέως
  choice: sa lalong madaling panahon
  rationale: Sa konteksto, tumutukoy ito sa nalalapit na panahon ng pagpunta, hindi lamang sa bilis ng pagkilos.
- source_word: ἐὰν ὁ κύριος θελήσῃ
  choice: kung loloobin ng Panginoon
  rationale: Natural at marangal na Filipino na pinananatili ang kondisyon at ang pagdepende sa kalooban ng Panginoon.
- source_word: γνώσομαι
  choice: aalamin ko
  rationale: Ipinahihiwatig na personal na susuriin at matitiyak ni Pablo ang tunay na kalagayan pagdating niya.
- source_word: τὸν λόγον
  choice: ang pananalita
  rationale: Pinananatili ang malawak na kahulugan ng λόγος bilang sinasabi o pagsasalita, at ang tuwirang pagsalungat nito sa δύναμις.
- source_word: τῶν πεφυσιωμένων
  choice: ng mga nagmamalaki
  rationale: Natural na ipinapahayag sa Filipino ang patuloy na kalagayan ng kapalaluan, bagaman hindi nito literal na inuulit ang metapora ng pagiging “napintog.”
- source_word: τὴν δύναμιν
  choice: ang kapangyarihan
  rationale: Pinananatili ang maikli at sadyang malawak na termino, nang hindi nililimitahan sa himala, awtoridad, o bisa lamang.
theological_decisions:
- issue: Tinutukoy ng “Panginoon”
  choice: Panginoon
  alternative: Panginoong Jesus; Diyos
  rationale: ὁ κύριος lamang ang nasa Griyego. Hindi tinukoy sa salin kung si Jesus o ang Ama ang partikular na tinutukoy, kaya napapanatili ang tekstuwal na kawalan ng higit na espesipikasyon.
- issue: Pagsalungat ng λόγος at δύναμις
  choice: pananalita ... kapangyarihan
  alternative: retorika ... apostolikong awtoridad; turo ... mahimalang kapangyarihan
  rationale: Pinananatili ang malawak na tensiyon sa pagitan ng sinasabi at ng aktuwal na kapangyarihan, nang hindi ito ipinapako sa isang tiyak na pagpapakita.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “pupunta” sa halip na mas pormal ngunit di-gaanong pangkaraniwang “paririto,” at “pananalita” upang mapanatili ang mas pormal at malawak na diwa ng λόγος.
