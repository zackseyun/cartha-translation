id: 1CO.4.5
reference: 1 Corinthians 4:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὥστε μὴ πρὸ καιροῦ τι κρίνετε, ἕως ἂν ἔλθῃ ὁ κύριος, ὃς καὶ φωτίσει τὰ κρυπτὰ τοῦ σκότους καὶ φανερώσει τὰς βουλὰς τῶν καρδιῶν, καὶ τότε ὁ ἔπαινος γενήσεται ἑκάστῳ ἀπὸ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/005.yaml
  text: Therefore[a], do not judge anything before the time, until the Lord comes, who will also bring to light the hidden things of darkness and reveal the purposes of the hearts[c][b]. Then each one’s praise will come from God.
translation:
  language: tl
  text: Kaya huwag kayong humatol sa anuman bago sumapit ang panahon[a], hanggang sa dumating ang Panginoon. Siya ang maglalantad sa liwanag ng mga bagay na nakatago sa dilim at maghahayag ng mga layunin ng mga puso[b][c]. At pagkatapos, tatanggap ang bawat isa ng papuri mula sa Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bago ang panahon” o “nang wala pa sa tamang panahon.” Maaaring tumukoy ang pariralang Griego sa pagkilos bago dumating ang angkop na panahon.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga balak ng mga puso” o “mga motibo ng mga puso.”
    reason: lexical_alternative
  - marker: c
    text: Ibig sabihin, sa pangwakas na pagsusuri ng Panginoon pagdating niya, kapag inihayag niya ang mga bagay na nakatago.
    reason: cross_reference
lexical_decisions:
- source_word: ὥστε
  choice: Kaya
  rationale: Ipinahihiwatig nito ang kongklusyong nagmumula sa naunang pangangatwiran at natural itong pakinggan sa makabagong Tagalog.
- source_word: μὴ πρὸ καιροῦ τι κρίνετε
  choice: huwag kayong humatol sa anuman bago sumapit ang panahon
  rationale: Pinananatili ng “sa anuman” ang malawak na saklaw ng τι, samantalang ang “bago sumapit ang panahon” ay malapit sa πρὸ καιροῦ nang hindi idinaragdag na tahasang “itinakda” ang panahon.
- source_word: ἕως ἂν ἔλθῃ ὁ κύριος
  choice: hanggang sa dumating ang Panginoon
  rationale: Tuwirang ipinapahayag ang hangganang temporal ng pagbabawal at pinananatili ang titulong κύριος bilang “Panginoon.”
- source_word: φωτίσει τὰ κρυπτὰ τοῦ σκότους
  choice: maglalantad sa liwanag ng mga bagay na nakatago sa dilim
  rationale: Inilalarawan ng φωτίσει ang pagsisiwalat, hindi lamang pisikal na pag-iilaw; natural na naihahatid ng pariralang ito ang talinghaga at ang kaibahan ng liwanag at dilim.
- source_word: φανερώσει τὰς βουλὰς τῶν καρδιῶν
  choice: maghahayag ng mga layunin ng mga puso
  rationale: Malawak ang “mga layunin” upang masaklaw ang mga balak o intensiyon ng βουλαί nang hindi ito nililimitahan sa sikolohikal na “motibo”; pinananatili rin ang maramihang “mga puso.”
- source_word: τότε ὁ ἔπαινος γενήσεται ἑκάστῳ ἀπὸ τοῦ θεοῦ
  choice: At saka tatanggap ang bawat isa ng papuri mula sa Diyos
  rationale: Natural sa Tagalog ang “tatanggap” at malinaw nitong pinananatili na ang papuri para sa bawat isa ay nagmumula sa Diyos sa panahong iyon.
theological_decisions:
- issue: Saklaw at panahon ng paghatol
  choice: Ipinagbabawal ang paghatol bago ang nararapat na panahon, kaugnay ng pagdating at pagsisiwalat ng Panginoon.
  alternative: Ganap na ipinagbabawal ang lahat ng uri ng paghatol sa lahat ng pagkakataon.
  rationale: Malawak ang pananalitang “sa anuman,” ngunit nililimitahan mismo ng teksto ang utos sa panahon bago dumating ang Panginoon; hindi ipinapasok sa salin ang isang ganap na pagbabawal na lampas sa konteksto.
- issue: Pagkakakilanlan ng “Panginoon”
  choice: Pinanatili ang titulong “Panginoon” nang hindi tahasang dinaragdagan ng pangalang Jesus.
  alternative: Isalin bilang “Panginoong Jesus” o bilang pangkalahatang pagtukoy sa Diyos.
  rationale: Sa kontekstong Paulino, likas itong tumutukoy kay Jesus sa kanyang pagdating, ngunit κύριος lamang ang tahasang nasa talata kaya hindi pinalawak ang salin.
- issue: Kalikasan ng papuri sa huling sugnay
  choice: Ang bawat isa ay tatanggap ng papuring nagmumula sa Diyos.
  alternative: Gantimpala o hatol ang tatanggapin ng bawat isa.
  rationale: ἔπαινος ay tiyak na “papuri,” kaya hindi ito pinalitan ng mas malawak na “gantimpala” o ng “hatol,” kahit nasa konteksto ito ng banal na pagsusuri.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “humatol” at “maglalantad sa liwanag” upang mapanatili ang tonong panghukuman at ang talinghaga ng paghahayag nang hindi maging labis na teknikal. Lahat ng panandang talababa [a], [b], at [c] ay nasa pangunahing teksto.
