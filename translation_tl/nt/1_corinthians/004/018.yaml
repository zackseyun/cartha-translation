  text: Some have become puffed up[b][a], as though I were not coming to you.
translation:
  language: tl
  text: May ilang naging palalo[a], na para bang hindi ako pupunta sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pandiwa ay may larawang “pinalobo” o “pinapintog,” isang metapora para sa mapagmataas na pagpapahalaga sa sarili. Paulit-ulit itong ginagamit ni Pablo sa 1 Corinto; ihambing ang 1 Corinto 4:6, 19; 5:2; 8:1; 13:4.
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: ὡς
  choice: na para bang
  rationale: Likas sa modernong Tagalog at pinananatili ang diwa ng isang maling palagay o ipinapalagay na kalagayan.
- source_word: μὴ ἐρχομένου ... μου πρὸς ὑμᾶς
  choice: hindi ako pupunta sa inyo
  rationale: Ginagawang likas na sugnay sa Tagalog ang genitive participial construction; sa ilalim ng ὡς, isa itong ipinapalagay na kalagayan at hindi tuwirang pahayag ni Pablo.
- source_word: δέ
  choice: —
  rationale: Mahinang pang-ugnay ito at hindi kailangang tahasang isalin upang maging maayos at natural ang pangungusap sa Tagalog.
- source_word: ἐφυσιώθησάν
  choice: nagmapagmalaki
  rationale: Malinaw at likas na ipinahahayag sa Tagalog ang pagmamataas na tinutuligsa ni Pablo. Inilalagay sa talababa ang mas literal na larawang ‘nagpalalo’ o ‘napintog sa pagmamataas’ upang mapanatili ang paulit-ulit niyang metapora.
- source_word: τινες
  choice: Ang ilan sa inyo
  rationale: Tumutukoy sa isang bahagi lamang ng mga taga-Corinto; nililinaw ng ‘sa inyo’ ang sanggunian ayon sa konteksto at sa kasunod na πρὸς ὑμᾶς.
theological_decisions:
- issue: Paglalarawan sa pagmamataas ng ilang taga-Corinto
  choice: nagmapagmalaki
  alternative: nagpalalo; napintog sa pagmamataas
  rationale: Ang pangunahing salin ay madaling maunawaan ng karaniwang mambabasa nang hindi nagdaragdag ng natatanging doktrina. Itinatala sa talababa ang literal na larawang ginagamit ni Pablo upang makita ang retorikal na pagkakaugnay nito sa ibang bahagi ng liham.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang ‘na para bang’ upang ipakitang maling palagay ng ilan ang hindi pagpunta ni Pablo, at hindi ito pahayag na talagang hindi siya pupunta.
