  text: τίς γάρ σε διακρίνει; τί δὲ ἔχεις ὃ οὐκ ἔλαβες; εἰ δὲ καὶ ἔλαβες, τί καυχᾶσαι ὡς μὴ λαβών;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/007.yaml
  text: For who makes you different? And what do you have that you did not receive? And if you did receive it[a], why do you boast as if you had not received it?
translation:
  language: tl
  text: Sapagkat sino ba ang nagtatangi sa iyo?[a] At ano ang mayroon ka na hindi mo tinanggap? At kung tinanggap mo nga ito, bakit ka nagmamalaki na para bang hindi mo ito tinanggap?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “Sino ang gumagawa sa iyo na naiiba?” Ang pandiwang Griyego ay maaaring mangahulugang “nagtatangi,” “nagbubukod,” o “gumagawa na naiiba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς γάρ σε διακρίνει
  choice: Sapagkat sino ba ang nagtatangi sa iyo?
  rationale: Ang διακρίνει ay maaaring tumukoy sa pagkilala o paggawa ng pagkakaiba. Pinananatili ng “nagtatangi sa iyo” ang tanong kung sino ang dahilan ng anumang pagkakaiba o natatanging kalagayan ng kausap, nang hindi tuwirang ipinapasok sa teksto ang ideya ng pagiging nakahihigit. Isinasalin ng “Sapagkat” ang γάρ bilang batayan ng naunang pagsaway, at nagbibigay ng likas na diin ang “ba” sa retorikal na tanong.
- source_word: τί δὲ ἔχεις
  choice: At ano ang mayroon ka
  rationale: Banayad na pang-ugnay ang δὲ rito; natural na naiuugnay ng “At” ang sunod-sunod na mga tanong nang hindi nagpapahiwatig ng mas matinding pagsalungat kaysa nasa Griyego.
- source_word: ὃ οὐκ ἔλαβες
  choice: na hindi mo tinanggap
  rationale: Tuwirang ipinahahayag nito na ang anumang taglay ng kausap ay tinanggap, hindi nagmula sa sarili. Ang pangnagdaang “tinanggap” ay angkop sa aorist na ἔλαβες.
- source_word: εἰ δὲ καὶ ἔλαβες
  choice: At kung tinanggap mo nga ito
  rationale: Ipinahahayag ng “nga” ang diin ng καὶ sa kondisyong ito. Idinagdag ang “ito” bilang likas na pantukoy sa bagay na binanggit sa naunang tanong.
- source_word: τί καυχᾶσαι
  choice: bakit ka nagmamalaki
  rationale: Karaniwan at malinaw na katumbas ng καυχᾶσαι ang “nagmamalaki,” at napananatili nito ang tuloy-tuloy na saloobing sinasaway ni Pablo.
- source_word: ὡς μὴ λαβών
  choice: na para bang hindi mo ito tinanggap
  rationale: 'Likas na ipinahahayag ng “para bang” ang inaakalang kalagayang salungat sa katotohanan: kumikilos ang kausap na wari''y hindi siya tumanggap. Inuulit ang “ito” para sa linaw sa Tagalog.'
theological_decisions:
- issue: Saklaw ng tinanggap na bagay at ng pagkakaibang tinutukoy ni Pablo
  choice: Pinananatiling pangkalahatan ang “ano ang mayroon ka” at “nagtatangi sa iyo,” kaya maaaring saklawin ang mga kaloob, tungkulin, katayuan, o ibang kalamangan na tinanggap lamang.
  alternative: Limitahan ang talata sa mga espirituwal na kaloob o mga tungkulin sa paglilingkod.
  rationale: Bagaman tungkol sa mga lingkod, pagmamapuri, at pagkakampi-kampi ang malapit na konteksto, pangkalahatan ang pananalita ng Griyego. Hindi dapat paliitin ng salin ang saklaw na hindi naman nililimitahan ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang magkakaugnay na retorikal na tanong at pangkaraniwang mga salitang “tinanggap” at “nagmamalaki.” Ang “nagtatangi” ay sadyang nagpapanatili ng lawak ng Griyego, at nililinaw sa talababa ang iba pang posibleng diwa.
