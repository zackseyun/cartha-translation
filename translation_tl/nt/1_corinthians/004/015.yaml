id: 1CO.4.15
reference: 1 Corinthians 4:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐὰν γὰρ μυρίους παιδαγωγοὺς ἔχητε ἐν Χριστῷ, ἀλλ’ οὐ πολλοὺς πατέρας, ἐν γὰρ Χριστῷ Ἰησοῦ διὰ τοῦ εὐαγγελίου ἐγὼ ὑμᾶς ἐγέννησα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/015.yaml
  text: For even if you have countless guardians in Messiah[a], yet not many fathers; for in Messiah Jesus, through the gospel[d][c][b], I became your father.
translation:
  language: tl
  text: Sapagkat kahit magkaroon kayo ng di-mabilang na mga tagapag-alaga[a] kay Mesiyas, hindi naman marami ang inyong mga ama. Sapagkat kay Jesus na Mesiyas, sa pamamagitan ng magandang balita, ako ang naging ama ninyo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sampung libong tagapag-alaga.” Ang salitang Griego para sa “tagapag-alaga” ay tumutukoy sa taong nangangasiwa at dumidisiplina sa isang bata, hindi lamang sa isang guro.
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: Sa literal, “ipinanganak ko kayo” o “isinilang ko kayo.” Talinghaga ito para sa papel ni Pablo sa pagdating nila sa pananampalataya sa pamamagitan ng magandang balita.
    reason: lexical_alternative
lexical_decisions:
- source_word: μυρίους
  choice: di-mabilang
  rationale: Bagaman literal na “sampung libo,” madalas itong gamitin bilang idyoma para sa napakaraming bilang; ipinahahayag ng “di-mabilang” ang retorikal na paghahambing sa “hindi ... marami.”
- source_word: παιδαγωγοὺς
  choice: mga tagapag-alaga
  rationale: Sa kontekstong Greco-Romano, tumutukoy ito sa tagapangasiwa at tagadisiplina ng isang bata, hindi pangunahin sa guro sa silid-aralan.
- source_word: ἐν Χριστῷ / ἐν Χριστῷ Ἰησοῦ
  choice: sa Mesiyas / kay Mesiyas Jesus
  rationale: Pinananatili ang Χριστός bilang titulong “Mesiyas.” Ginamit ang “sa” at “kay” ayon sa likas na gamit sa Filipino habang iniiwan ang malawak na kahulugan ng ugnayang ipinahahayag ng ἐν.
- source_word: πατέρας
  choice: mga ama
  rationale: Tuwirang pinananatili ang talinghaga ng pagkaama nang hindi dinaragdagan ng salitang “espirituwal.”
- source_word: διὰ τοῦ εὐαγγελίου
  choice: sa pamamagitan ng magandang balita
  rationale: Ipinahahayag ng διά na may genitive ang paraan o kasangkapan; malinaw at natural sa Filipino ang pariralang ito.
- source_word: ἐγέννησα
  choice: ako ang naging ama ninyo
  rationale: Literal itong tumutukoy sa pag-aanak o pagsilang, ngunit dito ay metaporikal. Ang salin ay likas sa modernong Filipino at pinananatili ang ugnayan nito sa naunang “mga ama.”
theological_decisions:
- issue: Ang talinghaga ni Pablo tungkol sa pagiging ama
  choice: “ako ang naging ama ninyo”
  alternative: “ipinanganak ko kayo” o “ako ang nagkaanak sa inyo”
  rationale: Pinananatili nito ang natatanging papel ni Pablo sa pagdating nila sa pananampalataya sa pamamagitan ng magandang balita, nang hindi naglalagay ng sakramental, klerikal, o biyolohikal na kahulugang wala sa teksto.
- issue: Kahulugan ng ἐν Χριστῷ
  choice: “sa Mesiyas” / “kay Mesiyas Jesus”
  alternative: “kay Cristo” / “kay Cristo Jesus”
  rationale: Pinananatili ang titulo bilang “Mesiyas” at hindi nilulutas nang labis ang mayamang ugnayang saklaw ng pariralang Paulino.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinili ang “magandang balita” sa halip na mas teknikal na “ebanghelyo,” at pinanatili ang “Mesiyas” bilang titulo. Ang ayos ng pangungusap ay malapit sa Griego ngunit natural sa Tagalog.
