  naturalness: Marangal at malinaw ang karamihan ng salin. Mas natural ang paggamit ng "kay Mesiyas" para sa parehong Pauline na parirala, at "kay Jesus na Mesiyas" para sa pariralang may personal na pangalan. Ang "ako ang naging ama ninyo" ay nananatiling malinaw na metapora sa konteksto.
