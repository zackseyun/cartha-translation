id: 1CO.4.13
reference: 1 Corinthians 4:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀δυσφημούμενοι παρακαλοῦμεν· ὡς περικαθάρματα τοῦ κόσμου ἐγενήθημεν, πάντων περίψημα ἕως ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/013.yaml
  text: When slandered[a], we appeal; we have become like the world's refuse, the scum of all things[b], until now.
translation:
  language: tl
  text: Kapag sinisiraan kami[a], nakikiusap kami. Naging para kaming basura ng sanlibutan, ang maruming tira ng lahat[b], hanggang ngayon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Kapag nilalait kami, nakikiusap kami.” Ang pandiwang Griyego ay maaaring mangahulugang makiusap, humimok, o magpalakas ng loob. Sa kontekstong ito, malamang na tumutukoy ito sa isang mapagpayapang tugon sa pang-aabuso.
    reason: lexical_alternative
  - marker: b
    text: Ang dalawang pambihira at napakatinding salitang isinaling “basura” at “maruming tira” ay tumutukoy sa itinatapon, kinakaskas, o inaalis sa paglilinis. Ginagamit dito ang mga ito upang ipakita ang sukdulang paghamak ng lipunan; posible rin ang alingawngaw ng mga sinaunang kaugalian sa paglilinis, ngunit hindi tiyak.
    reason: cultural_note
lexical_decisions:
- source_word: δυσφημούμενοι
  choice: Kapag sinisiraan kami
  rationale: Ipinahahayag ng pasibong pandiwaring Griyego na sila ay pinagsasalitaan nang masama o mapanirang-puri. Natural sa Tagalog ang temporal na “Kapag,” at hindi nito nililimitahan ang diwa sa isang pagkakataon lamang.
- source_word: παρακαλοῦμεν
  choice: mahinahon kaming nakikiusap
  rationale: Sa konteksto ng tugon sa pang-aabuso, tumutukoy ito sa mapagpayapa at hindi mapaghiganting pakiusap. Ang “nakikiusap” ay natural na katumbas; nililinaw ng “mahinahon” ang kontekstuwal na paraan ng pagtugon, hindi isang hiwalay na tahasang pang-abay sa Griyego.
- source_word: ὡς
  choice: para kaming
  rationale: Pinananatili nito ang paghahambing sa halip na gawing ganap na pagkakakilanlan.
- source_word: περικαθάρματα
  choice: basura
  rationale: Ang pambihirang salita ay tumutukoy sa itinapon o inalis sa paglilinis at, sa konteksto, sa mga taong itinuturing na sukdulang hamak. Ang “basura” ay kasalukuyan, malinaw, at matindi.
- source_word: τοῦ κόσμου
  choice: ng sanlibutan
  rationale: Pinananatili ang malawak na saklaw ng κόσμος at ang ugnayang henitibo. Dignified at pamilyar sa wikang biblikal ang “sanlibutan.”
- source_word: ἐγενήθημεν
  choice: Naging
  rationale: Likas sa Tagalog ang simpleng aspektong naganap, habang ang kasunod na “hanggang ngayon” ang naghahayag na nananatili ang kalagayan sa kasalukuyan.
- source_word: πάντων
  choice: ng lahat
  rationale: Pinananatili ang sadyang malawak at posibleng di-tiyak na saklaw ng genitive plural, nang hindi ito nililimitahan sa mga tao lamang.
- source_word: περίψημα
  choice: mga latak
  rationale: Inilalarawan nito ang walang-halagang nalalabi o dumi at pinananatili ang matinding paghamak. Ang pangmaramihang anyo ay natural dahil tumutukoy si Pablo sa “kami.”
- source_word: ἕως ἄρτι
  choice: hanggang ngayon
  rationale: Tuwirang at natural na temporal na pahayag na nagsasaad ng pagpapatuloy hanggang sa sandali ng pagsulat.
theological_decisions:
- issue: Pagpapakahulugan sa magkatambal na περικαθάρματα at περίψημα
  choice: Isinalin bilang matinding pananalita ng panlipunang paghamak—“basura” at “mga latak”—nang hindi ginagawang tahasang rituwal o pantubos ang kahulugan.
  alternative: Maaaring isalin bilang “dumi” at “mga kaskas,” o ipahiwatig sa pangunahing teksto ang pinagtatalunang kaugnayan sa mga bagay o taong inaalis sa rituwal na paglilinis.
  rationale: Ang malinaw na diin ng konteksto ay ang sukdulang kahihiyan at paghamak na dinaranas ng mga apostol. Posible ang background ng paglilinis o rituwal, ngunit hindi sapat ang ebidensiya upang gawin itong tiyak na doktrinal na pahayag sa pangunahing teksto.
- issue: Lakas ng diwa ng παρακαλοῦμεν
  choice: “mahinahon kaming nakikiusap,” bilang mapagpayapang tugon sa paninirang-puri
  alternative: “nakikiusap kami” o “pinapayuhan namin sila,” nang walang paglalarawan sa paraan ng pagtugon
  rationale: Malawak ang saklaw ng pandiwa—maaaring mangahulugang makiusap, humimok, o magpalakas ng loob. Sa antitesis ng talata, malamang na mapagpayapa at hindi mapaghiganti ang tugon; gayunman, ipinapaliwanag sa talababa na ang “mahinahon” ay kontekstuwal at hindi tahasang pang-abay sa Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “sanlibutan” bilang pamilyar at dignified na salitang biblikal; ang “basura” at “mga latak” ay sadyang matitindi upang mapanatili ang talim ng mga pambihirang terminong Griyego. Lahat ng marker ng talababa ay nasa pangunahing teksto.
