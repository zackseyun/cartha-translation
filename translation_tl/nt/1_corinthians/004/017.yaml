source:
  edition: SBLGNT
  text: διὰ τοῦτο ἔπεμψα ὑμῖν Τιμόθεον, ὅς ἐστίν ⸂μου τέκνον⸃ ἀγαπητὸν καὶ πιστὸν ἐν κυρίῳ, ὃς ὑμᾶς ἀναμνήσει τὰς ὁδούς μου τὰς ἐν Χριστῷ ⸀Ἰησοῦ, καθὼς πανταχοῦ ἐν πάσῃ ἐκκλησίᾳ διδάσκω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/017.yaml
  text: For this reason I sent Timothy to you[a], who is my beloved and faithful child in the Lord. He will remind you of my ways in Messiah Jesus[b], just as I teach everywhere in every church.
translation:
  language: tl
  text: Dahil dito, isinugo ko sa inyo si Timoteo, na minamahal kong anak[a] at tapat sa Panginoon. Ipapaalala niya sa inyo ang mga pamamaraan ko kay Mesias Jesus,[b] gaya ng itinuturo ko saanman, sa bawat iglesya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “minamahal at tapat kong anak na lalaki sa Panginoon.” Ang salitang Griyego na τέκνον ay higit na literal na “anak,” ngunit maaari itong isaling “anak na lalaki” sa kontekstong ito.'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “kay Cristo Jesus.” Ang salitang Griyego na Χριστός ay isang titulong nangangahulugang “Mesias.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Dahil dito
  rationale: Likas na panandang sanhi sa Tagalog at malinaw na tumutukoy sa naunang pangangatuwiran.
- source_word: ἔπεμψα
  choice: isinugo ko
  rationale: Ang payak na nagdaang anyo ay tumutugma sa aorist; ipinahihiwatig ng “isinugo” na may layuning gampanan si Timoteo.
- source_word: Τιμόθεον
  choice: Timoteo
  rationale: Karaniwang anyo ng pangalang Timothy sa mga saling Tagalog.
- source_word: τέκνον
  choice: anak
  rationale: Hindi tinutukoy ng τέκνον ang kasarian sa mismong salita; natural na naipapahayag ng “anak” ang pampamilyang talinghaga ni Pablo.
- source_word: ἀγαπητὸν
  choice: minamahal kong
  rationale: Nagpapanatili sa init at dangal ng paglalarawan, habang natural ang pagkakasunod sa Tagalog.
- source_word: πιστὸν
  choice: tapat
  rationale: Pinananatili ang posibleng diwa ng katapatan at pagiging mapagkakatiwalaan sa paglilingkod.
- source_word: ἐν κυρίῳ
  choice: sa Panginoon
  rationale: Natural na katumbas ng pormulang Paulino na tumutukoy sa ugnayan at saklaw ng buhay kay Cristo.
- source_word: ἀναμνήσει
  choice: Ipapaalala niya
  rationale: Tuwirang ipinapahayag ang hinaharap na pagkilos ni Timoteo.
- source_word: τὰς ὁδούς μου
  choice: ang mga pamamaraan ko
  rationale: Ipinahahayag ang metaporikal na diwa ng ὁδοί bilang mga huwaran ng pamumuhay, ministeryo, at pagtuturo; mas natural ito kaysa literal na “mga daan ko.”
- source_word: τὰς ἐν Χριστῷ Ἰησοῦ
  choice: kay Mesias Jesus
  rationale: Ang “kay” ay natural na Tagalog para sa relasyonal na ἐν sa ganitong pormulang Paulino, at pinananatili ng “Mesias” ang titular na kahulugan ng Χριστός.
- source_word: καθὼς
  choice: gaya ng
  rationale: Malinaw na nagpapakita ng pagtutugma sa ipapaalala ni Timoteo at sa palagiang itinuturo ni Pablo.
- source_word: πανταχοῦ ἐν πάσῃ ἐκκλησίᾳ
  choice: saanman, sa bawat iglesya
  rationale: Pinananatili ang dalawang saklaw ng Griyego—lahat ng lugar at bawat kapulungan—sa natural at maikling Tagalog.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστός sa ἐν Χριστῷ Ἰησοῦ
  choice: Mesias Jesus
  alternative: Cristo Jesus
  rationale: Gumaganap dito ang Χριστός bilang titulo; ang “Mesias” ay naghahayag ng kahulugan nito sa halip na basta ilipat lamang ang tunog.
- issue: Saklaw ng “mga pamamaraan ko”
  choice: Mga huwaran ni Pablo sa pamumuhay, paglilingkod, at pagtuturo kay Mesias
  alternative: Mga daan ko; ang aking pamumuhay
  rationale: Metaporikal ang ὁδοί at malawak ang saklaw nito. Hindi ito nililimitahan sa mga ruta ng paglalakbay o sa pribadong asal lamang.
- issue: Ugnayan ng πιστόν at ἐν κυρίῳ
  choice: tapat sa Panginoon
  alternative: mapagkakatiwalaang anak ko sa Panginoon
  rationale: Pinananatili ng pangunahing teksto ang pinakamalapit at natural na pagkakaugnay ng “tapat” at “sa Panginoon,” habang kinikilala sa talababa ang posibleng ibang pagbuo ng parirala.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “iglesya” bilang malawak na nauunawaang katawagan sa lokal na kapulungan, at iniwasan ang sobrang literal na “mga daan ko” upang hindi mapagkamalang mga rutang nilalakbay.
