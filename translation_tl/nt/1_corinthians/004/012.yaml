  text: καὶ κοπιῶμεν ἐργαζόμενοι ταῖς ἰδίαις χερσίν· λοιδορούμενοι εὐλογοῦμεν, διωκόμενοι ἀνεχόμεθα,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/012.yaml
  text: and we labor[a], working with our own hands. When insulted, we bless; when persecuted, we endure;
translation:
  language: tl
  text: At nagpapakahirap kami sa pagtatrabaho gamit ang sarili naming mga kamay. Kapag nilalait kami[a], nagpapala kami; kapag inuusig kami, nagtitiis kami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kapag iniinsulto kami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κοπιῶμεν
  choice: nagpapakahirap kami
  rationale: Ipinahihiwatig ng pandiwa ang matinding paggawa na may kasamang pagod, hindi lamang ang karaniwang pagtatrabaho.
- source_word: ἐργαζόμενοι
  choice: na nagtatrabaho
  rationale: Ang participle ay nagpapaliwanag kung paano sila nagpapakahirap; pinananatili nitong hiwalay ang diin sa matinding pagod at sa gawaing-kamay.
- source_word: ταῖς ἰδίαις χερσίν
  choice: gamit ang sarili naming mga kamay
  rationale: Likas ito sa modernong Tagalog at pinananatili ang diin ng ἰδίαις sa sariling paggawa ng mga apostol.
- source_word: λοιδορούμενοι
  choice: kapag nilalait kami
  rationale: Pinananatili ang passive na anyo at inilalahad nang natural ang kalagayang sinasagot nila ng pagpapala. Saklaw ng “nilalait” ang mapanirang pandiwang paghamak.
- source_word: εὐλογοῦμεν
  choice: nagpapala kami
  rationale: Pinananatili ang mahalagang biblikal na salitang “pagpapala” at ang tahasang kaibahan nito sa panlalait, nang hindi nagdaragdag ng hindi binanggit na layon.
- source_word: διωκόμενοι
  choice: kapag inuusig kami
  rationale: Sa konteksto, ang pandiwa ay tumutukoy sa pag-uusig, at ang sugnay na “kapag” ay natural na nagpapakita ng kalagayan ng kanilang pagtugon.
- source_word: ἀνεχόμεθα
  choice: nagtitiis kami
  rationale: Inihahayag nito ang patuloy na pagtitiis sa masamang pagtrato nang hindi nagdaragdag ng tahasang layon na wala sa Griyego.
theological_decisions:
- issue: Etikal na tugon sa masamang pagtrato
  choice: 'Inilalarawan ang ginagawa ng mga apostol: nagpapala sila kapag nilalait at nagtitiis kapag inuusig.'
  alternative: Gawing tuwirang utos sa lahat ng mananampalataya ang mga kilos na ito.
  rationale: Ang talata ay isang paglalarawan sa asal ng mga apostol, hindi tuwirang pautos. Napananatili ng salin ang etikal na bigat nito nang hindi ginagawang pormal na utos ang pangungusap.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “nagpapakahirap” upang ipakita ang mabigat at nakapapagod na paggawa, at “gamit ang sarili naming mga kamay” para sa natural ngunit mariing paglalarawan ng gawaing-kamay. Pinanatili ang maikli at magkakatapat na ayos ng mga tugon sa panlalait at pag-uusig.
