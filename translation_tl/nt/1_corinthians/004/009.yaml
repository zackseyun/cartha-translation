id: 1CO.4.9
reference: 1 Corinthians 4:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: δοκῶ ⸀γάρ, ὁ θεὸς ἡμᾶς τοὺς ἀποστόλους ἐσχάτους ἀπέδειξεν ὡς ἐπιθανατίους, ὅτι θέατρον ἐγενήθημεν τῷ κόσμῳ καὶ ἀγγέλοις καὶ ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/009.yaml
  text: For it seems to me that God has displayed us[a], the apostles, last of all, like men sentenced to death, because we have become a spectacle to the world[c][b], both to angels and to men.
translation:
  language: tl
  text: Sapagkat sa palagay ko, itinanghal ng Diyos kaming mga apostol bilang pinakahuli sa lahat, gaya ng mga taong hinatulang mamatay[a], sapagkat kami ay naging panoorin[b] sa harap ng sanlibutan, ng mga anghel, at ng mga tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “gaya ng mga taong nakatalagang mamatay.” Ang salitang Griyego ay tumutukoy sa mga taong itinakda para sa kamatayan, malamang na may larawang kaugnay ng arena.
    reason: lexical_alternative
  - marker: b
    text: Mas literal, “tanghalan”; dito, ang diwa ay isang hayagang panoorin.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκῶ γάρ
  choice: Sapagkat sa palagay ko
  rationale: Pinananatili ang paliwanag na ugnayan ng γάρ at ang personal, bahagyang maingat na pagtataya ni Pablo sa δοκῶ.
- source_word: ἡμᾶς τοὺς ἀποστόλους
  choice: kaming mga apostol
  rationale: Likas na Tagalog na nagpapahayag sa appositional na pagkakakilanlan ng pangkat na tinutukoy ni Pablo.
- source_word: ἐσχάτους ἀπέδειξεν
  choice: itinanghal ... bilang pinakahuli sa lahat
  rationale: Ipinahahayag ng “itinanghal” ang hayagang paglalantad o pagpapakita, at ng “pinakahuli sa lahat” ang mariing puwesto ng ἐσχάτους.
- source_word: ὡς ἐπιθανατίους
  choice: gaya ng mga taong hinatulang mamatay
  rationale: Ipinakikita ang mga taong nakatalaga sa kamatayan at pinananatili ang malamang na larawang mula sa pampublikong arena.
- source_word: θέατρον ἐγενήθημεν
  choice: kami ay naging panoorin
  rationale: 'Natural na inililipat ang metapora: ang mga apostol ang hayagang pinagmamasdan, hindi ang gusali o tanghalan mismo.'
- source_word: τῷ κόσμῳ
  choice: ng sanlibutan
  rationale: Ipinapahayag ang sanlibutan bilang kabuuang madlang nakamasid; nililinaw ng kasunod na parirala ang saklaw nito.
- source_word: καὶ ἀγγέλοις καὶ ἀνθρώποις
  choice: ng mga anghel at ng mga tao
  rationale: Pinananatili ang magkatambal na makalangit at pantaong mga tagamasid nang hindi nililimitahan ang ἀνθρώποις sa kalalakihan.
theological_decisions:
- issue: Kahulugan ng ἀγγέλοις
  choice: mga anghel, bilang makalangit na mga nilalang na nakamasid
  alternative: mga sugo
  rationale: Sa pagkakatambal nito sa “sanlibutan” at “mga tao,” ang pinakanatural na diwa ay mga makalangit na nilalang; hindi na dinaragdagan ang teksto ng tiyak na doktrina tungkol sa kanilang papel.
- issue: Saklaw ng τῷ κόσμῳ at ng kasunod na mga dative
  choice: Ang “mga anghel at mga tao” ay nagpapaliwanag sa madlang saklaw ng “sanlibutan.”
  alternative: 'Tatlong ganap na magkakahiwalay na pangkat: sanlibutan, mga anghel, at mga tao'
  rationale: Maaaring basahin ang mga dative bilang magkakaugnay na paglalarawan ng pandaigdig at kosmikong madla. Pinananatili ng gitling ang retorikal na ugnayan nang hindi ipinipilit ang isang teknikal na paliwanag.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “sanlibutan” para sa kosmikong lawak ng κόσμος at ang “itinanghal” upang mapanatili ang pampublikong larawan na nagpapatuloy sa “panoorin.”
