base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/004.yaml
  text: For I am aware of nothing against myself[a], but I am not justified by this[c][b]; the one who examines me is the Lord.
translation:
  language: tl
  text: Sapagkat wala akong nalalamang laban sa aking sarili,[a] ngunit hindi dahil dito ay pinawalang-sala na ako;[b] ang sumusuri sa akin[c] ay ang Panginoon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “wala akong nalalamang anumang laban sa aking sarili” o “wala akong nalalamang pagkakasala sa aking sarili.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “itinuring na matuwid na ako” o “napatunayang tama na ako.” Gumamit ang Griyego ng salitang panghukuman na ginagamit din ni Pablo para sa pagpapawalang-sala o pagtuturing na matuwid.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin na “humahatol sa akin” o “nagsisiyasat sa akin.” Ang pandiwa ay maaaring mangahulugang sumuri, magsiyasat, o magtaya sa isang kontekstong panghukuman.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲν γὰρ ἐμαυτῷ σύνοιδα
  choice: Sapagkat wala akong nalalamang laban sa aking sarili
  rationale: Ipinahahayag ng idyomang σύνοιδα na walang nalalamang paratang o pagkakasala si Pablo sa sarili niyang budhi. Likas sa modernong Tagalog ang 'wala akong nalalamang laban sa aking sarili,' at napapanatili nito ang himig na moral at panghukuman nang hindi sinasabing talagang wala siyang kasalanan.
- source_word: ἀλλ’ οὐκ ἐν τούτῳ δεδικαίωμαι
  choice: ngunit hindi dahil dito ay pinawalang-sala na ako
  rationale: Ang δεδικαίωμαι ay perfect passive at may panghukuman na diwa sa konteksto. Ang 'pinawalang-sala na ako' ay malinaw sa karaniwang mambabasa at pinananatili ang diwa ng isang hatol; ang 'hindi dahil dito' ay nagpapakitang ang malinis na sariling budhi ay hindi batayan ng hatol.
- source_word: ὁ δὲ ἀνακρίνων με
  choice: ang sumusuri sa akin
  rationale: Ang ἀνακρίνω ay maaaring tumukoy sa masusing pagsusuri, pagsisiyasat, o paghatol. Pinananatili ng 'sumusuri' ang lawak ng salita at hindi nito agad ginagawang pangwakas na paghatol ang proseso.
- source_word: κύριός
  choice: ang Panginoon
  rationale: Tiyak ang tinutukoy ng κύριος, kaya natural ang 'ang Panginoon.' Hindi ito pinalawak bilang 'Panginoong Jesus' sapagkat hindi iyon tahasang sinasabi sa talata.
theological_decisions:
- issue: Panghukuman at teolohikal na diwa ng δεδικαίωμαι
  choice: pinawalang-sala na ako
  alternative: itinuring na matuwid na ako; napatunayang tama na ako
  rationale: Ang agarang konteksto ay pagsusuri at paghatol sa paglilingkod ni Pablo. Kaya pinili ang karaniwang pariralang panghukuman nang hindi ginagawang ganap na pahayag ang talata tungkol sa mas malawak na doktrina ng pagpapawalang-sala.
- issue: Kaugnayan ng malinis na budhi at obhetibong hatol
  choice: hindi dahil dito ay pinawalang-sala na ako
  alternative: hindi nito pinatutunayang tama ako
  rationale: 'Pinananatili ng salin ang tensiyon: walang nalalamang paratang si Pablo laban sa sarili, ngunit hindi sapat ang sariling pagsusuri upang magtakda ng hatol.'
- issue: Pagkakakilanlan ng κύριος
  choice: ang Panginoon
  alternative: ang Panginoong Jesus
  rationale: Hindi idinaragdag sa pangunahing teksto ang pagkakakilanlang hindi tahasang binanggit ng Griyego, kahit maaaring maunawaan iyon mula sa mas malawak na konteksto ni Pablo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'Sapagkat' upang ipakita ang paliwanag na ugnayan sa naunang pahayag. Ang 'pinawalang-sala' ay mas natural kaysa sa abstraktong 'inaring-ganap' at nagpapanatili ng panghukuman na diwa. Inilagay ang bawat talababa kaagad sa bahaging nililinaw nito.
