  terminology: Ang “mga kapatid,” “iniangkop,” “nasusulat,” at “Apolos” ay angkop. Pinananatili ang “Huwag lumampas sa nasusulat” bilang malinaw na pagsasalin ng pinagtatalunang eliptikong parirala, habang itinatala ng talababa ang higit na literal na anyo.
