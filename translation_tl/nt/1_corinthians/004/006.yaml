reference: 1 Corinthians 4:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ταῦτα δέ, ἀδελφοί, μετεσχημάτισα εἰς ἐμαυτὸν καὶ ⸀Ἀπολλῶν δι’ ὑμᾶς, ἵνα ἐν ἡμῖν μάθητε τό· Μὴ ὑπὲρ ⸀ἃ ⸀γέγραπται, ἵνα μὴ εἷς ὑπὲρ τοῦ ἑνὸς φυσιοῦσθε κατὰ τοῦ ἑτέρου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/006.yaml
  text: 'These things, brothers, I have applied to myself and Apollos for your sake, so that in us you may learn this: “Do not go beyond what is written,” so that none of you may be puffed up in favor of one against another.'
translation:
  language: tl
  text: 'Ang mga bagay na ito, mga kapatid,[a] ay iniangkop ko sa aking sarili at kay Apolos alang-alang sa inyo, upang sa amin ay matutuhan ninyo ito: “Huwag lumampas sa nasusulat,”[b] upang walang sinuman sa inyo ang magmalaki pabor sa isa laban sa isa pa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay nasa anyong panlalaki na “mga kapatid na lalaki,” ngunit maaari itong itawag sa isang pangkat na binubuo ng mga lalaki at babae.
    reason: cultural_note
  - marker: b
    text: Eliptiko ang Griyego; mas literal, “ang ‘hindi higit sa kung ano ang nasusulat.’” Maaaring isa itong kasabihan o sawikain.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: Ang mga bagay na ito
  rationale: Pinananatili ang pangmaramihang demonstratibo at ang pagtukoy nito sa naunang talakayan.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Natural at dignidad na katawagan sa Filipino na maaaring tumukoy sa magkakapatid sa pananampalataya anuman ang kasarian; nililinaw sa talababa ang anyong panlalaki ng Griyego.
- source_word: μετεσχημάτισα
  choice: iniangkop ko
  rationale: Ipinahahayag ang retorikal na paglilipat o paglalapat ng naunang usapan kina Pablo at Apolos nang hindi labis na nagpapaliwanag.
- source_word: εἰς ἐμαυτὸν καὶ Ἀπολλῶν
  choice: sa aking sarili at kay Apolos
  rationale: Tuwirang pinananatili kung kanino iniangkop ni Pablo ang talakayan.
- source_word: δι’ ὑμᾶς
  choice: alang-alang sa inyo
  rationale: Likas na Filipino para sa kapakinabangan o layuning ipinahihiwatig ng διά na may akusatibo.
- source_word: ἵνα ἐν ἡμῖν μάθητε
  choice: upang sa pamamagitan namin ay matutuhan ninyo
  rationale: Ipinakikitang sina Pablo at Apolos ang halimbawa o paraan ng pagkatuto, habang hindi isinasara ang bahagyang siksik na diwa ng ἐν ἡμῖν.
- source_word: τό· Μὴ ὑπὲρ ἃ γέγραπται
  choice: 'ito: “Huwag lumampas sa nasusulat,”'
  rationale: Ginagawang malinaw sa Filipino ang eliptikong kasabihan bilang babala, ngunit itinatala sa talababa ang literal na kasiksikan at posibleng anyong sawikain nito.
- source_word: γέγραπται
  choice: nasusulat
  rationale: Karaniwang Filipino na pormula para sa perpektong pasibong tumutukoy sa nakasulat na teksto, lalo na sa Kasulatan.
- source_word: φυσιοῦσθε
  choice: magmalaki
  rationale: Natural na katumbas ng pagiging mapagmataas o palalo; mas malinaw sa ordinaryong mambabasa kaysa sa literal na larawang 'magpalobo.'
- source_word: ὑπὲρ τοῦ ἑνὸς ... κατὰ τοῦ ἑτέρου
  choice: dahil kumakampi siya sa isa laban sa iba
  rationale: Malinaw na ipinahahayag ang pagkiling sa isang pinuno o pangkat laban sa isa pa sa konteksto ng pagkakampi-kampi.
theological_decisions:
- issue: Kahulugan ng eliptikong pariralang τό· Μὴ ὑπὲρ ἃ γέγραπται
  choice: 'Isinalin bilang paalala: “Huwag lumampas sa nasusulat.”'
  alternative: “Hindi lampas sa nasusulat” o “Ang ‘hindi lampas sa nasusulat.’”
  rationale: Ang Griyego ay walang tahasang pandiwa sa sipi at maaaring isang kasabihan, ngunit sa pangungusap ay natural itong gumaganap bilang aral o babala. Nililinaw ng salin ang puwersa nito habang pinananatili sa talababa ang tunay na elipsis at alternatibo.
- issue: Saklaw ng ἀδελφοί
  choice: “mga kapatid,” na natural na inklusibo sa Filipino
  alternative: “mga kapatid na lalaki”
  rationale: Bagaman panlalaki ang anyong Griyego, malamang na buong kongregasyon ang kinakausap. Ang “mga kapatid” ay hindi nagdaragdag ng kasarian sa Filipino at ang datos ng orihinal ay ipinababatid sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignidad, at angkop sa pampublikong pagbasa. Ginamit ang “iniangkop” para sa retorikal na paglalapat, “nasusulat” para sa pormulang pangkasulatan, at “kumakampi” upang likas na maipahayag ang konteksto ng pagkakampi-kampi. Lahat ng marka ng talababa ay nasa pangunahing teksto.
