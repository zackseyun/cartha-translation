  to: Busóg na busóg na kayo! Mayayaman na kayo! Naghahari na kayo nang wala kami! Sana nga’y naghahari na kayo, upang kami rin ay makapaghari kasama ninyo.[a]
  rationale: Inalis ang “tunay,” na idinaragdag lamang ng interpretasyon ang katiyakang hindi tahasang nasa Griyego. Napanatili ang masidhing hangarin ng “Sana nga,” ang retorikal na pag-uulit ng “na,” at ang malinaw na diwa ng magkasamang paghahari. Inayos din ang mga talababa upang ang natitirang angkla ay tumukoy sa mahalagang paliwanag tungkol sa ironya.
