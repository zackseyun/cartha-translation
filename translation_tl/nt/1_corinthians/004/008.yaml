id: 1CO.4.8
reference: 1 Corinthians 4:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἤδη κεκορεσμένοι ἐστέ, ἤδη ἐπλουτήσατε, χωρὶς ἡμῶν ἐβασιλεύσατε· καὶ ὄφελόν γε ἐβασιλεύσατε, ἵνα καὶ ἡμεῖς ὑμῖν συμβασιλεύσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/008.yaml
  text: Already you have had your fill[a]; already you have become rich; apart from us you have become kings. And I wish indeed that you had become kings[c][b], so that we also might reign with you.
translation:
  language: tl
  text: Busóg na busóg na kayo! Mayayaman na kayo! Naghahari na kayo nang wala kami! Sana nga’y naghahari na kayo, upang kami rin ay makapaghari kasama ninyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mapanuyang nagsasalita si Pablo: kumikilos ang mga taga-Corinto na para bang lubos na silang busóg, mayaman, at naghahari na.'
    reason: Nililinaw ang retorikal na tono na makikita sa mas malawak na konteksto.
lexical_decisions:
- source_word: ἤδη
  choice: na
  rationale: Sa mga pahayag na “busóg na busóg na” at “mayayaman na,” likas na ipinahihiwatig ng inuulit na “na” ang temporal na diin ng ἤδη at pinananatili ang retorikal na pag-uulit.
- source_word: κεκορεσμένοι ἐστέ
  choice: busóg na busóg na kayo
  rationale: Ipinahahayag ang kasalukuyang kalagayang bunga ng pagkabusog; ang pag-uulit na “busóg na busóg” ay natural sa Tagalog at mabisa sa matalim na ironya.
- source_word: ἐπλουτήσατε
  choice: mayayaman na kayo
  rationale: Natural na inilalarawan sa Tagalog ang sinasabing nakamit nang kalagayan ng kasaganaan, habang nananatiling kapantay ng naunang sugnay ang maikli at mariing anyo.
- source_word: χωρὶς ἡμῶν
  choice: nang wala kami
  rationale: Tuwirang ipinakikita na inaakala nilang nakapaghari sila nang hiwalay sa mga apostol; natural ito sa modernong Tagalog.
- source_word: ἐβασιλεύσατε
  choice: naghahari na kayo
  rationale: Pinananatili ang tahasang larawang maharlika ng βασιλεύω nang hindi idinaragdag ang di-tiyak na kahulugang “nagsimulang” o ginagawang pangngalang “mga hari.”
- source_word: ὄφελόν γε
  choice: Sana nga’y tunay
  rationale: Ang “sana nga” ay likas na pahayag ng masidhing hangarin, at ang “tunay” ay nililinaw ang kaibahan ng aktuwal na paghahari sa mapanuyang pag-aangkin nang hindi inaalis ang tensiyon ng talata.
- source_word: ἵνα
  choice: upang
  rationale: Malinaw at marangal na pananda ng layunin o resultang inaasam.
- source_word: συμβασιλεύσωμεν
  choice: makapaghari rin kaming kasama ninyo
  rationale: Ipinananatili ang diwa ng posibilidad sa subjunctive at ang kasamang paghahari na tahasang nasa συν-.
theological_decisions:
- issue: Ang tono ng unang tatlong pahayag
  choice: Pinanatili bilang matatalim na mapanuyang pahayag sa pamamagitan ng maiikli at padamdam na sugnay.
  alternative: Basahin bilang literal na papuri o walang-markang paglalarawan.
  rationale: Ipinakikita ng 1 Corinto 4:7–13 ang salungatan sa pagitan ng mataas na tingin ng mga taga-Corinto sa sarili at ng pagdurusa ng mga apostol.
- issue: Ang kahulugan ng paghahari
  choice: Pinanatili ang tahasang larawan ng paghahari.
  alternative: Paluwagin bilang pagiging matagumpay, makapangyarihan, o mataas ang katayuan.
  rationale: Ang βασιλεύω at συμβασιλεύω ay hayagang tumutukoy sa paghahari; mahalaga ang larawang ito sa retorikal at maaaring eskatolohikal na tensiyon ng talata.
- issue: Ang hangarin ni Pablo sa ikalawang pagbanggit ng paghahari
  choice: Isinalin bilang paghahangad na maging tunay ang kanilang paghahari, habang nananatili ang bakas ng ironya.
  alternative: Ituring na pawang pangungutya lamang o bilang simpleng pahayag na tunay na silang naghahari.
  rationale: Ang ὄφελόν γε ay nagpapahayag ng tunay na hangarin sa loob ng mapanuyang konteksto; hindi dapat lubusang alisin ang alinmang panig ng tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang maiikli at padamdam na sugnay upang maipadama ang retorikal na talas at pag-uulit ng Griyego. Ang “naghahari” ay mas tumpak kaysa “naging mga hari” dahil pandiwa ang βασιλεύω at hindi nito kinakailangang ipahiwatig ang pagkuha ng titulong hari.
