  text: ἐμοὶ δὲ εἰς ἐλάχιστόν ἐστιν, ἵνα ὑφ’ ὑμῶν ἀνακριθῶ ἢ ὑπὸ ἀνθρωπίνης ἡμέρας· ἀλλ’ οὐδὲ ἐμαυτὸν ἀνακρίνω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/003.yaml
  text: But to me it is a very small thing that I should be examined by you or by any human court; in fact[a], I do not even examine myself.
translation:
  language: tl
  text: Ngunit para sa akin, napakaliit na bagay lamang na ako’y siyasatin ninyo o ng alinmang hukuman ng tao.[a] Ni hindi ko nga sinisiyasat ang sarili ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, literal na “araw ng tao,” isang di-karaniwang pahayag na tumutukoy sa pantaong pagsusuri o paghatol.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμοὶ
  choice: para sa akin
  rationale: Dative of reference ito at likas na ipinapahayag sa modernong Tagalog ang personal na pananaw ni Pablo.
- source_word: εἰς ἐλάχιστόν ἐστιν
  choice: napakaliit na bagay lamang
  rationale: Ipinahihiwatig ng parirala na napakaliit ng halaga o kabuluhan ng bagay; pinananatili ng salin ang diin nang hindi nagiging malamya.
- source_word: ἵνα
  choice: na
  rationale: Ipinakikilala rito ang nilalaman ng itinuturing ni Pablo na maliit na bagay.
- source_word: ἀνακριθῶ
  choice: siyasatin
  rationale: Tumutukoy sa masusing pagsusuri o pagbusisi, hindi kinakailangang sa pangwakas na paghatol; ang 'siyasatin' ay angkop din sa legal at personal na konteksto.
- source_word: ὑφ’ ὑμῶν
  choice: ninyo
  rationale: Tuwirang ipinapahayag ang gumagawa ng pagsusuri at pinananatili ang ikalawang panauhang maramihan.
- source_word: ἢ ὑπὸ ἀνθρωπίνης ἡμέρας
  choice: o ng alinmang hukuman ng tao[a]
  rationale: Ang literal na 'araw ng tao' ay idyomatikong tumutukoy sa pantaong pagdinig, pagsusuri, o paghatol. Malinaw sa karaniwang mambabasa ang 'hukuman ng tao,' habang inilalagay sa talababa ang literal na anyo.
- source_word: ἀλλ’ οὐδὲ
  choice: Ni hindi ko nga
  rationale: 'Ipinapakita nito ang mariing pag-usad ng argumento: hindi lamang maliit sa kaniya ang pagsusuri ng iba, kundi hindi rin niya sinusuri maging ang sarili niya.'
- source_word: ἐμαυτὸν
  choice: ang sarili ko
  rationale: Likas na salin ng reflexive object sa modernong Tagalog.
- source_word: ἀνακρίνω
  choice: sinisiyasat
  rationale: Pinananatili ang ugnayang leksikal sa naunang ἀνακριθῶ at iniiwasang ipakahulugan ito bilang pangwakas na paghatol.
theological_decisions:
- issue: Kahulugan ng ἀνθρωπίνης ἡμέρας
  choice: hukuman ng tao
  alternative: araw ng tao; pantaong paghatol; pantaong pagsusuri
  rationale: Sa konteksto, ang di-karaniwang parirala ay kabaligtaran ng araw o paghatol ng Panginoon at tumutukoy sa pantaong pagsusuri. Idyomatikong isinalin sa pangunahing teksto ngunit pinanatili sa talababa ang literal na larawan upang hindi maitago ang anyo at posibleng alusyon ng Griyego.
- issue: Saklaw ng ἀνακρίνω
  choice: siyasatin
  alternative: hatulan; usisain
  rationale: Ang pandiwa ay maaaring may legal na himig ngunit pangunahing tumutukoy sa pagsusuri o pagbusisi. Ang 'siyasatin' ay hindi nagpapalagay na pangwakas na hatol na ang tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at madaling maunawaan. Ginamit ang 'siyasatin' upang mapanatili ang legal na himig at pagkakapareho ng dalawang anyo ng ἀνακρίνω, at ang talababa upang maipakita ang literal na 'araw ng tao' nang hindi ginagawang malabo ang pangunahing teksto.
