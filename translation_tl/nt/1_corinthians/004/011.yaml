  text: ἄχρι τῆς ἄρτι ὥρας καὶ πεινῶμεν καὶ διψῶμεν καὶ γυμνιτεύομεν καὶ κολαφιζόμεθα καὶ ἀστατοῦμεν
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/011.yaml
  text: Up to this present hour we are hungry and thirsty[a], and poorly clothed, and beaten[c][b], and homeless.
translation:
  language: tl
  text: Hanggang sa oras na ito, nagugutom kami at nauuhaw, salat sa pananamit[a], binubugbog, at walang pirmihang matuluyan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hubad.” Maaari ring mangahulugan ang salitang Griyego na kulang o hindi sapat ang damit, hindi lamang lubos na walang saplot.
    reason: lexical_alternative
  - marker: b
    text: O “walang permanenteng tirahan” o “palipat-lipat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι τῆς ἄρτι ὥρας
  choice: Hanggang sa oras na ito
  rationale: Likas na pariralang Filipino para sa patuloy na kalagayan hanggang sa kasalukuyan; pinananatili nito ang diin ng ἄρτι at ang konkretong ὥρα.
- source_word: πεινῶμεν
  choice: nagugutom kami
  rationale: Ipinahahayag ng pangkasalukuyang pandiwa ang nagpapatuloy na pagkagutom; malinaw at natural ito sa modernong Filipino.
- source_word: διψῶμεν
  choice: nauuhaw
  rationale: Natural na katambal ng “nagugutom” at nagpapahayag ng nagpapatuloy na pagkauhaw nang hindi pinaiigting ang diwa.
- source_word: γυμνιτεύομεν
  choice: salat sa pananamit
  rationale: Maaaring tumukoy ang pandiwa sa kakulangan ng sapat na damit, hindi lamang sa lubos na kahubaran. Naipahahayag ng salin ang materyal na kasalatan nang hindi nagpapalabis.
- source_word: κολαφιζόμεθα
  choice: binubugbog
  rationale: Ipinahahayag ng pasibong pangkasalukuyang anyo ang paulit-ulit o nagpapatuloy na pisikal na pagmamalupit; karaniwan at malinaw ang “binubugbog.”
- source_word: ἀστατοῦμεν
  choice: walang pirmihang matuluyan
  rationale: Pinananatili nito ang diwa ng kawalan ng nakapirming tirahan o matatag na lugar, nang hindi nililimitahan ang salita sa isang modernong kategoryang panlipunan lamang.
- source_word: καὶ ... καὶ ... καὶ ...
  choice: at ... at ... at ...
  rationale: Hangga't likas sa Filipino, pinananatili ang pinagsama-samang ritmo ng sunod-sunod na καί upang madama ang walang tigil na talaan ng mga paghihirap.
theological_decisions:
- issue: Kalikasan ng paglalarawan ni Pablo sa kalagayan ng mga apostol
  choice: Tuwirang talaan ng aktuwal at nagpapatuloy na kasalatan at pagmamalupit
  alternative: Pangunahing retorikal o eksaheradong paglalarawan
  rationale: Gumagamit ang teksto ng payak na mga pandiwang nasa pangkasalukuyan para sa kongkretong paghihirap. Hindi pinalalabis o pinahihina ng salin ang mga ito.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “pirmihang” bilang karaniwan ngunit marangal na salita para sa settled o fixed, at iniwasan ang sobrang teknikal o makalumang pananalita.
