  text: In this case[a], moreover[c][b], it is required of stewards that one be found faithful.
translation:
  language: tl
  text: Sa bagay na ito, hinihingi sa mga katiwala na matagpuang tapat ang bawat isa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Dito nga, hinahanap sa mga katiwala na matagpuang tapat ang isa.” Ang “hinahanap” dito ay tumutukoy sa inaasahan o hinihingi sa kanila.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧδε λοιπὸν
  choice: Kaya
  rationale: Sa konteksto, ang dalawang salitang pangdiskurso ay magkasamang nag-uugnay sa pahayag sa naunang paglalarawan sa mga apostol bilang mga katiwala. Ang “Kaya” ay natural sa Filipino at nagpapahayag ng bunga o susunod na punto nang hindi gumagamit ng mabigat at paulit-ulit na mga pananda.
- source_word: ζητεῖται
  choice: ang hinihingi
  rationale: Bagaman literal na tumutukoy sa paghahanap, sa konstruksiyong ito ay ipinahihiwatig nito ang inaasahan o hinihingi sa mga katiwala.
- source_word: ἐν τοῖς οἰκονόμοις
  choice: sa mga katiwala
  rationale: Ang “sa mga katiwala” ay natural na Filipino para sa pangkat na pinatutungkulan ng kahingian at pinananatili ang talinghaga ng ipinagkatiwalang pamamahala.
- source_word: ἵνα πιστός τις εὑρεθῇ
  choice: ay ang bawat isa ay matagpuang tapat
  rationale: Ipinahahayag ng ἵνα ang nilalaman ng hinihingi. Ang “matagpuang tapat” ay nagpapanatili sa pasibong εὑρεθῇ at sa diwa ng πιστός bilang mapagkakatiwalaan sa iniatang na tungkulin. Ipinakikita ng “bawat isa” na indibidwal ang pananagutan nang hindi nililimitahan sa kasarian.
theological_decisions:
- issue: Pangkalahatang isahan at katumpakan sa kasarian
  choice: ang bawat isa ay matagpuang tapat
  alternative: may isang matagpuang tapat; matagpuan silang tapat
  rationale: Ang τις ay di-tiyak na isahan at ang gamit nito ay pangkalahatan, hindi tumutukoy lamang sa lalaki. Ang “bawat isa” ay malinaw na naglalapat ng kahingian sa bawat katiwala, samantalang iniiwasan ang maling pagpapakahulugang iisang tao lamang ang kailangang maging tapat.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang “katiwala” bilang madaling maunawaang katawagang nagdadala ng talinghaga ng pamamahala sa bagay na ipinagkatiwala. Isinama ang talababa upang maipakita ang mas literal na anyo ng ζητεῖται at ang di-tiyak na isahan ng τις.
