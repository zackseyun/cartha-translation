id: 1CO.4.16
reference: 1 Corinthians 4:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: παρακαλῶ οὖν ὑμᾶς, μιμηταί μου γίνεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/016.yaml
  text: 'Therefore I urge you: become imitators of me[a][b].'
translation:
  language: tl
  text: 'Kaya hinihimok ko kayo: tularan ninyo ako.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “maging mga tagatulad ko.”
    reason: lexical_alternative
  - marker: b
    text: 'Sa ibang bahagi ay nililinaw ni Pablo: “Tularan ninyo ako, gaya ng pagtulad ko kay Cristo” (1 Corinto 11:1).'
    reason: cross_reference
lexical_decisions:
- source_word: παρακαλῶ
  choice: hinihimok ko
  rationale: Ipinahahayag nito ang taimtim at mapanghikayat na panawagan ni Pablo sa natural at marangal na modernong Tagalog.
- source_word: οὖν
  choice: Kaya
  rationale: Malinaw nitong iniuugnay ang tagubilin sa naunang pangangatwiran bilang bunga o kongklusyon nito.
- source_word: ὑμᾶς
  choice: kayo
  rationale: Tuwirang katumbas ng panghalip na ikalawang panauhang maramihan.
- source_word: μιμηταί
  choice: tularan
  rationale: Ang pandiwang 'tularan' ay natural na nagpapahayag ng paggaya o pagsunod sa huwaran ng isang tao, nang hindi pinahihina ang tuwirang pagtukoy kay Pablo.
- source_word: μου
  choice: ako
  rationale: Si Pablo mismo ang tahasang inilalahad na huwarang tutularan.
- source_word: γίνεσθε
  choice: tularan ninyo
  rationale: Ang pautos na diwa ay naipahahayag nang natural sa Tagalog. Bagaman maaaring idiin ng γίνεσθε ang pagpasok sa isang kalagayan ('maging'), magiging mabigat at di-likas ang literal na 'maging mga tagatulad ko.'
theological_decisions:
- issue: Maaaring magmukhang labis ang panawagan ni Pablo na tularan siya kapag inihiwalay sa mas malawak na kontekstong nakasentro kay Cristo.
  choice: Panatilihin sa pangunahing teksto ang tuwirang utos na 'tularan ninyo ako.'
  alternative: Sundan ninyo ang aking halimbawa.
  rationale: Tahasang itinatanghal ng Griyego si Pablo bilang agarang huwaran. Hindi dapat palambutin o dagdagan sa pangunahing teksto ang pahayag; inilalagay sa talababa ang kaugnay na paglilinaw mula sa 1 Corinto 11:1.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, dignified, at madaling maunawaan. Pinili ang 'hinihimok' para sa taimtim na παρακαλῶ at ang natural na pandiwang 'tularan' sa halip na mabigat na nominal na anyong 'mga tagatulad.'
