  yaml_path: translation/nt/1_corinthians/004/020.yaml
  text: For the kingdom of God is not in word[a], but in power.
translation:
  language: tl
  text: Sapagkat ang kaharian ng Diyos ay hindi sa salita[a] kundi sa kapangyarihan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pananalita” o “sa mga salita lamang”; ang ipinaghahambing ay pananalitang walang bisa at kapangyarihang may tunay na epekto.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Sapagkat ... hindi
  rationale: Ipinakikita ng γάρ na nagbibigay ang talata ng dahilan para sa naunang pahayag; natural itong ihatid sa Tagalog bilang “Sapagkat,” habang tuwirang isinasalin ng “hindi” ang οὐ.
- source_word: ἐν λόγῳ
  choice: nakikita sa mga salita
  rationale: Maaaring tumukoy ang λόγος sa salita, pananalita, o usapan. Sa kaibahan nito sa δύναμις, ang punto ay hindi basta pananalita; idinagdag ang “nakikita” bilang natural na paraan sa Tagalog upang maipahayag ang diwang umiiral o nahahayag “sa” isang bagay nang hindi nililimitahan ang kahulugan sa retorika lamang.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ang kaharian ng Diyos
  rationale: Karaniwan, malinaw, at tumpak na salin ito na nagpapanatili sa posibleng diwa ng parehong paghahari at sakop ng paghahari nang hindi pumipili lamang sa isa.
- source_word: ἀλλ’ ἐν δυνάμει
  choice: kundi sa kapangyarihan
  rationale: Ang δύναμις ay tuwirang nangangahulugang kapangyarihan at bumubuo ng mariing paghahambing sa λόγος. Hindi tinukoy ng salin kung ito ay himala, pagbabagong-buhay, awtoridad ng apostol, o isang mas makitid na gawain ng Espiritu.
theological_decisions:
- issue: Likas ng paghahambing sa pagitan ng “salita” at “kapangyarihan”
  choice: Ang kaharian ng Diyos ay hindi nahahayag sa pananalita lamang kundi sa mabisang kapangyarihan.
  alternative: Ang kapangyarihan ay partikular na tumutukoy sa mga himala, sa nabagong pamumuhay at pagdidisiplina sa iglesya, o sa awtoridad ng apostol.
  rationale: Malawak lamang ang paghahambing sa Griyego. Pinananatili ng salin ang pagiging bukas ng tinutukoy na kapangyarihan at hindi ito nililimitahan nang higit sa sinasabi ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Sapagkat” upang malinaw na iugnay ang paliwanag sa naunang talata. Ang “nakikita sa” ay likas na ekspresyon sa Filipino para sa Griyegong ἐν sa ganitong paghahambing; pinananatili ng talababa ang mas literal na mga alternatibo.
