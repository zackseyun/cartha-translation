base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/021.yaml
  text: What do you want? Should I come to you with a rod[b][a], or with love and a spirit of gentleness?
translation:
  language: tl
  text: Ano ang gusto ninyo? Pupunta ba ako sa inyo dala ang pamalo, o may pag-ibig at espiritu ng kaamuan?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “may pag-ibig at kaamuan ng espiritu.” Ang “espiritu” ay maaaring tumukoy sa maamong disposisyon ni Pablo; nauunawaan naman ito ng ilan bilang di-tuwirang pagtukoy sa pagkilos ng Banal na Espiritu.
    reason: lexical_alternative_and_alternative_reading
lexical_decisions:
- source_word: τί θέλετε
  choice: Ano ang gusto ninyo?
  rationale: Direkta at natural na retorikal na tanong sa modernong Tagalog; pinananatili nito ang hamon ng Griyego.
- source_word: ἐν ῥάβδῳ
  choice: na may pamalo
  rationale: Ang “pamalo” ay nagpapanatili sa literal at matalim na larawang pandisiplina ng ῥάβδος, sa halip na agad itong ipaliwanag bilang “disiplina.”
- source_word: ἔλθω πρὸς ὑμᾶς
  choice: Pupunta ba ako sa inyo
  rationale: Natural na Tagalog para sa deliberatibong aorist subjunctive at angkop sa retorikal na pagpili na inihaharap ni Pablo.
- source_word: ἢ
  choice: o
  rationale: Tuwirang ipinapakita ang pagsalungat ng dalawang paraan ng pagpunta.
- source_word: ἐν ἀγάπῃ
  choice: may pag-ibig
  rationale: Kaagapay ng “may pamalo,” ipinahahayag nito ang pag-ibig bilang katangian ng paraan ng pagpunta ni Pablo.
- source_word: πνεύματί τε πραΰτητος
  choice: at espiritu ng kahinahunan
  rationale: Pinananatili ang salitang πνεῦμα at ang ugnayang genitibo ng πραΰτης. Ang “kahinahunan” ay marangal at natural, at tumutukoy sa mahinahong disposisyon nang hindi lubusang isinasara ang posibilidad ng pagkilos ng Banal na Espiritu.
theological_decisions:
- issue: Kahulugan ng πνεύματι sa πνεύματί τε πραΰτητος
  choice: espiritu ng kahinahunan, pangunahing tumutukoy sa disposisyon o paraan ng pakikitungo ni Pablo
  alternative: Espiritu ng kahinahunan, bilang di-tuwirang pagtukoy sa pagkilos ng Banal na Espiritu
  rationale: 'Ang agarang paghahambing ay sa dalawang paraan ng pagpunta ni Pablo: may pandisiplinang pamalo o may mapagmahal na kahinahunan. Hindi tahasang tinutukoy ng walang-artikulong πνεῦμα ang Banal na Espiritu, kaya maliit na titik ang ginamit; gayunman, pinananatili ng talababa ang tunay na interpretatibong posibilidad.'
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Pinanatili ang konkretong metapora ng “pamalo” at ang ambiguwidad ng “espiritu,” nang hindi ipinapasok ang isang denominasyonal na pagpapakahulugan.
