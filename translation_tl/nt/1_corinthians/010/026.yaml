  text: For the earth is the Lord’s[a], and all that fills it.
translation:
  language: tl
  text: Sapagkat ang lupa ay sa Panginoon, at ang lahat ng nilalaman nito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sipi mula sa Awit 24:1. Mas literal: “at ang kapuspusan nito,” ibig sabihin, ang lahat ng nilalaman nito.'
    reason: cross_reference_and_literal_rendering
lexical_decisions:
- source_word: κυρίου
  choice: sa Panginoon
  rationale: Ang genitibong τοῦ κυρίου ay nagpapahayag ng pag-aari. Sa natural na Tagalog, malinaw itong naihahayag ng “ang lupa ay sa Panginoon,” habang pinananatili ang pamagat na “Panginoon.”
- source_word: γάρ
  choice: Sapagkat
  rationale: Ipinakikilala ng γάρ ang batayang kasulatan para sa naunang pangangatwiran; natural at malinaw itong naihahayag ng “Sapagkat.”
- source_word: γῆ
  choice: lupa
  rationale: Sa sipi mula sa Awit 24:1 at sa pagkakaugnay nito sa πλήρωμα, ang γῆ ay tumutukoy sa buong lupa, hindi lamang sa isang lupain.
- source_word: πλήρωμα
  choice: ang lahat ng naroon
  rationale: Dito, ang πλήρωμα ay tumutukoy sa lahat ng nilalaman o nasa lupa. Ang “ang lahat ng naroon” ay natural sa modernong Tagalog at naiiwasan ang di-likas na literal na “kapuspusan nito.”
- source_word: αὐτῆς
  choice: naroon
  rationale: Ang panghalip ay tumutukoy pabalik sa γῆ. Sa pariralang “lahat ng naroon,” likas na naipahahayag sa Tagalog ang lahat ng nasa lupa.
theological_decisions:
- issue: Pagpapahayag ng κύριος sa siping may bigat na tipan at teolohiya
  choice: Panginoon
  alternative: YHWH / May-ari
  rationale: Ang teksto ni Pablo ay may κύριος, kaya “Panginoon” ang tuwirang salin. Hindi ginawang “YHWH” mula sa Hebreong pinagmulan ng sipi, at hindi rin ginawang “May-ari,” upang hindi ipalit ang paliwanag sa mismong titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ang lupa ay sa Panginoon” bilang likas na pahayag ng pag-aari, at “ang lahat ng naroon” bilang madaling maunawaang katumbas ng idyomatikong πλήρωμα αὐτῆς.
