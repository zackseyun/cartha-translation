  text: Let no one seek his own good[a], but that of the other person.
translation:
  language: tl
  text: Huwag hanapin ng sinuman ang sarili niyang kapakanan, kundi ang kapakanan ng iba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Huwag hanapin ng sinuman kung ano ang sa sarili niya, kundi kung ano ang sa iba.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδεὶς
  choice: Huwag ... ng sinuman
  rationale: Likas na paraan sa makabagong Tagalog upang ipahayag ang pangkalahatang pagbabawal na dala ng negatibong paksa at pautos na pandiwa.
- source_word: ζητείτω
  choice: hanapin
  rationale: Pinananatili ang payak at malawak na diwa ng ζητέω na ‘hanapin’ o ‘pagsikapang makamit,’ nang hindi nililimitahan sa materyal na pakinabang.
- source_word: τὸ ἑαυτοῦ
  choice: ang sarili niyang kapakanan
  rationale: Elliptical ang Griyego, literal na ‘ang sa sarili niya.’ Ang ‘kapakanan’ ay natural sa Tagalog at naaayon sa kontekstong inuuna ang ikabubuti ng iba.
- source_word: ἀλλὰ
  choice: kundi
  rationale: Ang ‘kundi’ ang natural na panalungat matapos ang negatibong sugnay at malinaw na naghahambing sa sariling kapakanan at sa kapakanan ng iba.
- source_word: τὸ τοῦ ἑτέρου
  choice: ang kapakanan ng iba
  rationale: Elliptical din ang parirala. Ang ἑτέρου ay tumutukoy sa ibang tao bilang katapat ng sarili; ang ‘iba’ ay maikli, natural, at pangkalahatan sa Tagalog.
theological_decisions:
- issue: Paglalantad sa ipinahihiwatig na layon ng τὸ ἑαυτοῦ / τὸ τοῦ ἑτέρου
  choice: Isalin bilang ‘sarili niyang kapakanan’ at ‘kapakanan ng iba’
  alternative: ‘kung ano ang sa sarili niya ... kung ano ang sa iba’
  rationale: Hindi tahasang binabanggit sa Griyego ang bagay na hinahanap. Ipinahihiwatig ng 1 Corinto 10:23–33 ang ikabubuti o kapakanan ng kapwa. Ginagawang natural ng ‘kapakanan’ ang pangungusap sa Tagalog habang inilalagay sa talababa ang mas literal at mas malabong anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘kapakanan’ upang likas na maipahayag ang elliptical na Griyego, habang pinananatili sa talababa ang mas literal na pagbasa.
