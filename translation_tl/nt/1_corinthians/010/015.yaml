  terminology: Wasto at pare-pareho ang mga pangunahing termino. Ang “humatol” ay may sapat na lawak para sa evaluative na κρίνατε, at ang “mabuting pagpapasya” ay hindi nagdadagdag ng teolohikal o interpretatibong pahayag.
