id: 1CO.10.15
reference: 1 Corinthians 10:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὡς φρονίμοις λέγω· κρίνατε ὑμεῖς ὅ φημι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/015.yaml
  text: I speak as to sensible people[b][a]; judge for yourselves what I say.
translation:
  language: tl
  text: Nagsasalita ako sa inyo bilang mga taong may mabuting pagpapasya[a]; kayo mismo ang humatol sa sinasabi ko.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga taong matatalino” o “mga taong maingat magpasya.”
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring: “kayo mismo ang magpasya tungkol sa sinasabi ko.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: bilang
  rationale: Ipinakikilala nito kung paano itinuturing ni Pablo ang mga kausap niya habang nagsasalita siya sa kanila.
- source_word: φρονίμοις
  choice: mga taong may mabuting pagpapasya
  rationale: Ipinahahayag ng φρόνιμος ang praktikal na karunungan, pag-iingat, at matinong paghatol. Natural sa makabagong Filipino ang pariralang ito at hindi nito pinalalabis ang diwa bilang ganap na 'marunong.'
- source_word: λέγω
  choice: Nagsasalita ako
  rationale: Ang λέγω ay maaaring 'magsabi' o 'magsalita.' Dito, akma ang 'nagsasalita ako sa inyo' sa paraan ng tuwirang pakikipag-usap ni Pablo.
- source_word: κρίνατε
  choice: humatol
  rationale: Ang aorist imperative ay panawagan sa isang tiyak na pagsusuri o paghatol. Pinananatili ng 'humatol' ang lakas at evaluative na diwa ng κρίνω.
- source_word: ὑμεῖς
  choice: kayo mismo
  rationale: Hayag at emphatic ang panghalip sa Griyego; natural na naipakikita sa Filipino ang diin sa pamamagitan ng 'kayo mismo.'
- source_word: ὅ
  choice: sa sinasabi
  rationale: Ang neuter relative pronoun ang layon ng φημι. Sa Filipino, natural na naisasalin ang buong parirala bilang 'sa sinasabi ko.'
- source_word: φημι
  choice: sinasabi ko
  rationale: Ang φημί ay nangangahulugang magsabi o magpahayag. Ang 'sinasabi ko' ay malinaw at likas sa kasalukuyang Filipino.
theological_decisions:
- issue: Retorikal na paglalarawan sa mga kausap
  choice: Tinatawag ni Pablo ang mga taga-Corinto na mga taong may kakayahang magpasya nang mabuti, nang hindi ipinahihiwatig na sinasang-ayunan niya ang lahat ng kanilang asal.
  alternative: Maaaring ituring na ironiko ang pagtawag sa kanila na marurunong, o bilang tahasang papuri sa kanilang karunungan.
  rationale: Inaanyayahan sila ng talata na suriin ang kaniyang pangangatuwiran. Pinananatili ng salin ang positibo ngunit katamtamang paglalarawan at hindi ipinapasya kung ito ay ironiko o lubos na papuri.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang 'may mabuting pagpapasya' upang ihatid ang praktikal na karunungan ng φρόνιμος, at ang 'kayo mismo' upang mapanatili ang diin ng ὑμεῖς.
