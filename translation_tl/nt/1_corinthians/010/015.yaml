  source_fidelity: Tapat ang salin sa Griyego. Ang “bilang mga taong may mabuting pagpapasya” ay maingat na naghahatid ng πρακτικal na pagkamatalino o pag-iingat ng φρονίμοις nang hindi ipinipilit na ganap na papuri o ironya. Napananatili rin ang mariing ὑμεῖς sa “kayo mismo,” at ang panawagan ng κρίνατε sa “humatol.”
