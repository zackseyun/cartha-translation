  to: Kung paanong ako rin ay nakikibagay sa lahat ng tao sa lahat ng bagay[a], hindi ko hinahangad ang sarili kong kapakinabangan kundi ang kapakinabangan ng nakararami[b], upang sila ay maligtas.
