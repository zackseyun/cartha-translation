  text: καθὼς κἀγὼ πάντα πᾶσιν ἀρέσκω, μὴ ζητῶν τὸ ἐμαυτοῦ ⸀σύμφορον ἀλλὰ τὸ τῶν πολλῶν, ἵνα σωθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/033.yaml
  text: just as I also please everyone in everything[a], not seeking my own advantage but that of the many[b], so that they may be saved.
translation:
  language: tl
  text: Kung paanong ako rin ay nakikibagay sa lahat ng tao sa lahat ng bagay[a], hindi ko hinahangad ang sarili kong kapakinabangan kundi ang kapakinabangan ng nakararami[b], upang sila ay maligtas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lahat ng bagay para sa lahat ng tao.” Mas literal sa Griyego ang “lahat ng bagay sa lahat [ng tao],” na nagpapahayag ng malawak na pakikibagay para sa ikabubuti ng iba.
    reason: lexical_alternative
  - marker: b
    text: O “ang sarili kong pakinabang kundi ang pakinabang ng nakararami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: kung paanong
  rationale: Malinaw na nagpapakilala ng paghahambing sa naunang tagubilin at likas sa makabagong Filipino.
- source_word: κἀγὼ
  choice: ako rin
  rationale: Pinananatili ang diwang ‘at ako’ o ‘ako rin,’ kung saan inihaharap ni Pablo ang sarili bilang halimbawa.
- source_word: πάντα πᾶσιν
  choice: ang lahat sa lahat ng bagay
  rationale: Pinananatili ang malawak at sadyang di-ganap na tiyak na saklaw ng Griyegong idyoma nang hindi ito inihahalo sa naiibang pananalita ng 1 Corinto 9:22.
- source_word: ἀρέσκω
  choice: sinisikap ... bigyang-kasiyahan
  rationale: Likas itong katumbas ng ‘please’ sa Filipino; ipinahihiwatig ng ‘sinisikap’ ang kusang pakikibagay, samantalang nililinaw ng kasunod na sugnay na hindi pambobola o paghahangad ng pagsang-ayon ang layunin.
- source_word: μὴ ζητῶν
  choice: hindi hinahangad
  rationale: Tuwirang ipinapahayag ang nagpapatuloy na paraan o motibo ng kilos ni Pablo.
- source_word: τὸ ἐμαυτοῦ σύμφορον
  choice: ang sarili kong kapakinabangan
  rationale: Ang ‘kapakinabangan’ ay natural at dignified na salin ng σύμφορον at pinananatili ang pagtutunggali ng sariling pakinabang at pakinabang ng iba.
- source_word: ἀλλὰ τὸ τῶν πολλῶν
  choice: kundi ang kapakinabangan ng nakararami
  rationale: Ginagawang hayag sa Filipino ang eliptikong pangngalan mula sa naunang sugnay, habang pinananatili ang κυριολεκτικό na ‘nakararami’ sa halip na gawing ‘iba.’
- source_word: ἵνα σωθῶσιν
  choice: upang sila ay maligtas
  rationale: Pinananatili ang sugnay ng layunin at ang balintiyak na anyo, nang hindi tinutukoy sa salin ang tagaganap na hindi tahasang binanggit rito.
theological_decisions:
- issue: Saklaw at kahulugan ng σωθῶσιν
  choice: upang sila ay maligtas
  alternative: upang sila ay matulungan / maingatan
  rationale: Sa kontekstong Pablo at ebanghelistiko, ang pandiwa ay may karaniwang kahulugang ukol sa kaligtasan. Pinananatili ng salin ang balintiyak at hindi ito pinapahina tungo sa panlipunang pakinabang lamang.
- issue: Kahulugan ng pagbibigay-kasiyahan ni Pablo sa iba
  choice: pakikibagay para sa kanilang kapakinabangan
  alternative: paghahangad ng pagsang-ayon ng tao
  rationale: Ang kasunod na paliwanag—na hindi niya hinahangad ang sarili niyang kapakinabangan kundi ang sa nakararami—ang nagtatakda sa kahulugan. Kaya hindi ito kompromiso o pambobola, bagaman pinananatili ang leksikal na diwa ng ἀρέσκω.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘sila ay’ sa halip na pinaikling ‘sila’y’ para sa madaling pagbasa, at inulit ang ‘kapakinabangan’ upang maging malinaw sa Filipino ang elipsis ng Griyego.
