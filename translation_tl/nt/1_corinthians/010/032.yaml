translation:
  language: tl
  text: Huwag kayong maging sanhi ng pagkatisod ng mga Hudyo, ng mga Griyego,[a] o ng iglesya ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga Griyego” rito ay malamang na malawak na tumutukoy sa mga hindi Hudyo sa kapanahunan ni Pablo; “mga Griyego” ang mismong sinasabi ng tekstong Griyego.
    reason: cultural_note
lexical_decisions:
- source_word: ἀπρόσκοποι
  choice: Huwag kayong maging sanhi ng pagkatisod
  rationale: Ipinahahayag nito ang pagiging hindi sanhi ng pagkatisod o pagkakasala ng iba sa konteksto ng pakikitungo sa tatlong pangkat; mas malinaw ito sa modernong Tagalog kaysa sa payak na “maging walang kapintasan.”
- source_word: γίνεσθε
  choice: Huwag kayong maging
  rationale: Ang pangkasalukuyang pautos ay likas na naipahahayag bilang patuloy na tagubilin sa maramihang kausap.
- source_word: Ἰουδαίοις
  choice: mga Judio
  rationale: Tumutukoy rito sa bayang Judio bilang pangkat na etniko at panrelihiyon, hindi lamang sa mga taga-Judea.
- source_word: Ἕλλησιν
  choice: mga Griyego
  rationale: Pinananatili ang tahasang leksikal na kahulugan ng tekstong Griyego; ipinapaliwanag sa talababa ang malawak na gamit nito sa konteksto.
- source_word: ἐκκλησίᾳ τοῦ θεοῦ
  choice: iglesya ng Diyos
  rationale: Karaniwan at tumpak na tawag sa kapulungan o pamayanan ng mga mananampalataya, habang pinananatili ang anyong “ng Diyos.”
theological_decisions:
- issue: Pagkakaugnay ng tatlong pangkat sa etikang tagubilin ni Pablo
  choice: Inuutusan ang mga mambabasa na huwag maging sanhi ng pagkatisod ng mga Judio, mga Griyego, o ng iglesya ng Diyos.
  alternative: Maaaring unawain ang “mga Griyego” bilang pangkalahatang tawag sa lahat ng hindi Judio, o ang tagubilin bilang pangunahing estratehiyang misyonero.
  rationale: Tahasan mismong binabanggit ng talata ang tatlong pangkat. Hindi pinalalawak o pinakikitid ng salin ang mga ito at hindi rin ipinapasya kung ang utos ay limitado sa estratehiyang misyonero.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “pagkatisod” bilang pamilyar na biblikal at etikal na larawan, at iniwasan ang mas teknikal o denominasyonal na pananalita.
