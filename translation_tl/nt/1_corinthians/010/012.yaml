translation:
  language: tl
  text: Kaya ang sinumang nag-aakalang nakatayo siya ay mag-ingat na hindi siya mabuwal.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: Kaya
  rationale: Nagpapahayag ito ng kongklusyon mula sa naunang mga babala at likas pakinggan sa makabagong Tagalog.
- source_word: ὁ δοκῶν
  choice: ang sinumang nag-aakalang
  rationale: Ang articular present participle ay tumutukoy sa isang kinatawang tao; malinaw na naihahayag ng “ang sinumang nag-aakalang” ang pangkalahatang bisa nito.
- source_word: ἑστάναι
  choice: nakatayo siya
  rationale: Ang perfect infinitive ay nagpapahiwatig ng kalagayan ng pagiging nakatayo; hindi idinagdag ang “matatag” sapagkat wala itong tahasang katumbas sa Griyego.
- source_word: βλεπέτω
  choice: mag-ingat
  rationale: Ang present imperative ay isang mariing panawagan sa patuloy na pag-iingat; natural at malinaw ito sa Tagalog.
- source_word: μὴ πέσῃ
  choice: na hindi siya mabuwal
  rationale: Ang μή kasama ng aorist subjunctive pagkatapos ng pautos ay naghahayag ng babala o negatibong layunin. Pinananatili ng “mabuwal” ang metapora ng pagkakatayo at pagbagsak.
theological_decisions:
- issue: Kahulugan ng “mabuwal” sa babala ni Pablo
  choice: Panatilihin ang pangkalahatang babalang “mabuwal” nang hindi tinutukoy kung ito ay pagtalikod, pagkakasala, o pagsapit ng hatol.
  alternative: Mahulog sa kasalanan; mahatulan; tumalikod sa pananampalataya.
  rationale: Nagbababala ang konteksto laban sa labis na pagtitiwala sa sarili sa liwanag ng mga pagkabigo ng Israel, ngunit hindi espesipiko ang πέσῃ. Pinananatili ng masaklaw na salita ang tunay na teolohikal na tensiyon.
- issue: Kinatawang pananalitang nasa panlalaking isahan
  choice: Gamitin ang “siya” bilang panghalip na isahan na maaaring tumukoy sa sinumang tao.
  alternative: Gumamit ng maramihang panghalip o ulitin ang “ang tao.”
  rationale: Panlalaking isahan ang anyong Griyego ngunit kinatawan ang gamit. Sa Tagalog, hindi nakatali sa kasarian ang “siya,” kaya tumpak itong nagpapanatili sa isahan nang hindi nagdaragdag ng kasarian.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang metapora ng pagkakatayo at pagkabuwal at iniwasang gawing mas tiyak kaysa sa Griyego ang uri ng pagbagsak.
