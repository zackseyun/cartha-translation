id: 1CO.10.19
reference: 1 Corinthians 10:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τί οὖν φημι; ὅτι ⸂εἰδωλόθυτόν τί ἐστιν, ἢ ὅτι εἴδωλόν⸃ τί ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/019.yaml
  text: What then am I saying? That food sacrificed to idols is anything[b][a], or that an idol is anything?
translation:
  language: tl
  text: Kaya ano ang sinasabi ko? Na may kabuluhan ang pagkaing inihandog sa mga diyus-diyosan,[a] o na may kabuluhan ang isang diyus-diyosan?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na may anumang halaga ang isang handog sa diyus-diyosan.”
    reason: lexical_alternative
  - marker: b
    text: Hindi sinasabi ni Pablo na ang mga diyus-diyosan ay tunay na mga diyos o na ang pagkaing inihandog sa kanila ay may likas na espirituwal na bisa sa sarili nito.
    reason: cross_reference
lexical_decisions:
- source_word: τί οὖν φημι
  choice: Kaya ano ang sinasabi ko?
  rationale: Pinananatili ang retorikal na tanong, pangkasalukuyang aspekto, at unang panauhan; natural din ito sa daloy ng argumento sa Filipino.
- source_word: ὅτι
  choice: Na
  rationale: Tuwirang ipinakikilala ang nilalaman ng maaaring ipakahulugan sa sinabi ni Pablo nang hindi dinaragdagan ang paliwanag.
- source_word: εἰδωλόθυτόν
  choice: pagkaing inihandog sa mga diyus-diyosan
  rationale: Malinaw na tumutukoy sa pagkaing kaugnay ng paghahandog sa mga diyus-diyosan at angkop sa konteksto ng pagkain sa 1 Corinto 8–10.
- source_word: τί ἐστιν
  choice: may kabuluhan
  rationale: Ipinahahayag ang idyomatikong diwa na may tunay na halaga o bisa sa kaugnay na usapin, habang hindi tinutukoy nang labis kung pag-iral, kapangyarihan, o espirituwal na kahalagahan ang nasa isip.
- source_word: ἢ
  choice: o
  rationale: Pinananatili ang payak na pangatnig na nag-uugnay sa dalawang magkatulad na sugnay.
- source_word: εἴδωλον
  choice: isang diyus-diyosan
  rationale: Karaniwan at tiyak na salin sa kontekstong tumutukoy sa bagay na sinasamba bilang diyos.
theological_decisions:
- issue: Kung ipinapahiwatig ba ni Pablo na may tunay na pag-iral o espirituwal na kabuluhan ang handog sa diyus-diyosan o ang diyus-diyosan mismo
  choice: Panatilihin bilang dalawang retorikal na tanong gamit ang “may kabuluhan.”
  alternative: “Na talagang umiiral ang handog sa diyus-diyosan, o na talagang umiiral ang isang diyus-diyosan?”
  rationale: Hindi tahasang nilulutas ng τί ἐστιν kung pag-iral, halaga, o bisa ang tinutukoy. Ang “may kabuluhan” ay nagpapanatili ng tensiyon at hindi ipinapasok sa pangunahing teksto ang isang pilosopikal o denominasyonal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “diyus-diyosan” bilang karaniwang katawagan sa idol at “may kabuluhan” upang maging natural sa Filipino habang pinananatili ang saklaw at retorikal na puwersa ng Greek na τί ἐστιν.
