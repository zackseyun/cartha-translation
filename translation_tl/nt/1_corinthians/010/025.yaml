id: 1CO.10.25
reference: 1 Corinthians 10:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πᾶν τὸ ἐν μακέλλῳ πωλούμενον ἐσθίετε μηδὲν ἀνακρίνοντες διὰ τὴν συνείδησιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/025.yaml
  text: Eat whatever is sold in the meat market[a], asking no questions for the sake of conscience,
translation:
  language: tl
  text: Kainin ninyo ang anumang ipinagbibili sa pamilihan ng karne, nang hindi nagtatanong[a] alang-alang sa budhi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nang walang sinisiyasat”; ang diwa ay huwag alamin ang pinagmulan ng karne.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν τὸ ... πωλούμενον
  choice: ang anumang ipinagbibili
  rationale: 'Likas sa makabagong Tagalog ang “anumang ipinagbibili” at pinananatili nito ang malawak na saklaw ng substantival na parirala: lahat o anumang ibinebenta.'
- source_word: ἐν μακέλλῳ
  choice: sa pamilihan ng karne
  rationale: Ang μάκελλον ay tumutukoy sa pamilihang pinagbebentahan ng karne, hindi lamang sa isang pangkalahatang palengke.
- source_word: ἐσθίετε
  choice: Kainin ninyo
  rationale: Tuwirang pautos ito sa maramihan. Ang “Kainin ninyo” ay malinaw at natural sa Tagalog.
- source_word: μηδὲν ἀνακρίνοντες
  choice: nang hindi nagtatanong
  rationale: Sa konteksto, ang ἀνακρίνω ay tumutukoy sa pagtatanong o pagsisiyasat tungkol sa pinagmulan ng karne. Hindi idinagdag sa pangunahing teksto ang bagay na itinatanong upang mapanatili ang anyo at lawak ng Griyego.
- source_word: διὰ τὴν συνείδησιν
  choice: alang-alang sa budhi
  rationale: Ipinahahayag ng parirala ang pagsasaalang-alang sa budhi nang hindi labis na tinutukoy kung kaninong budhi iyon.
theological_decisions:
- issue: Tinutukoy ng “budhi”
  choice: Panatilihing pangkalahatan bilang “budhi.”
  alternative: “inyong budhi” o “budhi ng ibang tao”
  rationale: Ang Griyego ay nagsasabing τὴν συνείδησιν, “ang budhi,” at hindi tahasang tinutukoy sa talatang ito kung kanino iyon. Pinananatili ng salin ang sadyang kalabuan hanggang linawin ito ng kasunod na konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “pamilihan ng karne” para sa tiyak na tagpuan at “alang-alang sa budhi” upang mapanatili ang etikal na diin at ang hindi tiyak na tinutukoy ng “budhi.”
