  text: ⸀Πάντα ἔξεστιν· ἀλλ’ οὐ πάντα συμφέρει. ⸁πάντα ἔξεστιν· ἀλλ’ οὐ πάντα οἰκοδομεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/023.yaml
  text: “All things are permitted,” but not all things are beneficial[a]. “All things are permitted,” but not all things build up.
translation:
  language: tl
  text: “Pinahihintulutan ang lahat ng bagay,” ngunit hindi lahat ay kapaki-pakinabang.[a] “Pinahihintulutan ang lahat ng bagay,” ngunit hindi lahat ay nakapagpapatibay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Naaayon sa batas ang lahat ng bagay.” Ang salitang Griyego ay maaaring tumukoy sa pinahihintulutan o naaayon sa batas. Ipinakikita ng mga panipi ang malamang na kasabihan ng mga taga-Corinto na nililimitahan ni Pablo; maaari ring basahin ang parirala nang walang mga panipi.
    reason: lexical_alternative_and_interpretive_punctuation
lexical_decisions:
- source_word: Πάντα
  choice: ang lahat ng bagay
  rationale: Ginagamit ang pang-uri bilang pangngalan at tumutukoy nang malawakan. Pinananatili ng pariralang ito ang pangkalahatan at paulit-ulit na anyo ng pahayag.
- source_word: ἔξεστιν
  choice: pinahihintulutan
  rationale: Ipinahahayag nito kung ano ang pinapayagan o itinuturing na maaari. Malinaw ito sa modernong Filipino at hindi labis na legal ang dating.
- source_word: ἀλλ’
  choice: ngunit
  rationale: Tuwirang ipinakikita ang maikli at mariing pagsalungat sa dalawang sugnay.
- source_word: συμφέρει
  choice: kapaki-pakinabang
  rationale: Tumutukoy sa kung ano ang nakabubuti o may pakinabang, hindi lamang sa pinansiyal na tubo.
- source_word: οἰκοδομεῖ
  choice: nakapagpapatibay
  rationale: Inililipat sa natural na Filipino ang metaporikal na diwa ng pagpapatatag o pagpapalakas sa iba o sa pamayanan, bagaman hindi gaanong lantad ang literal na larawan ng pagtatayo.
theological_decisions:
- issue: Kung ang Πάντα ἔξεστιν ay sipi ng kasabihan ng mga taga-Corinto
  choice: Nilagyan ng panipi ang “Pinahihintulutan ang lahat ng bagay” sa dalawang paglitaw nito.
  alternative: Maaaring alisin ang mga panipi at basahin ito bilang sariling pahayag ni Pablo na agad niyang nililimitahan.
  rationale: Malamang na inuulit ni Pablo ang isang kasabihan ng mga taga-Corinto at saka ito itinutuwid o nililimitahan. Gayunman, wala sa sinaunang mga manuskrito ang makabagong panipi, kaya ipinapaliwanag sa talababa ang interpretatibong pasyang ito.
- issue: Saklaw ng οἰκοδομεῖ
  choice: nakapagpapatibay
  alternative: nakapagpapatatag sa iba; nakapagpapatibay sa kapulungan
  rationale: Hindi tahasang binabanggit sa talata ang layon ng pagpapatibay. Pinananatili ng salin ang pagiging di-tiyak nito sa halip na idagdag ang “sa iba” o “sa iglesia,” kahit malakas ang kontekstuwal na diwang pampamayanan.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Pinanatili ang maikli at magkatulad na ayos ng dalawang pahayag. Ginamit ang “nakapagpapatibay” upang maging natural sa Filipino habang pinananatili ang diwang metaporikal at pampamayanan ng οἰκοδομεῖ.
