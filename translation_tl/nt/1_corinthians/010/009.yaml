  text: Nor should we put Messiah to the test[b][a], as some of them tested him and were being destroyed by the snakes.
translation:
  language: tl
  text: Huwag din nating subukin ang Mesiyas[a], tulad ng ilang sa kanila na sumubok sa kanya at pinapatay ng mga ahas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang manuskrito, “ang Panginoon” sa halip na “ang Mesiyas.”
    reason: textual_variant
lexical_decisions:
- source_word: μηδὲ
  choice: Huwag din nating
  rationale: Ipinagpapatuloy nito ang sunod-sunod na mga pagbabawal sa talata at pinananatili ang panghikayat na anyong unang panauhang maramihan.
- source_word: ἐκπειράζωμεν
  choice: subukin
  rationale: Ipinahihiwatig ng pandiwa ang di-wastong paglalagay sa isang tao sa pagsubok; natural sa Filipino ang “subukin” at hindi nito ipinapalagay na maaaring matukso ang Mesiyas na gumawa ng masama.
- source_word: τὸν Χριστόν
  choice: ang Mesiyas
  rationale: Ang Χριστός ay titulong nangangahulugang ang Pinahiran; kaya isinalin itong “Mesiyas” sa halip na ituring na pangalang “Cristo.”
- source_word: καθώς τινες αὐτῶν ἐπείρασαν
  choice: gaya ng ginawa ng ilan sa kanila
  rationale: Natural na iniiwasan sa Filipino ang mabigat na pag-uulit ng “subukin”; malinaw mula sa naunang sugnay na ang ginawa nila ay pagsubok sa Mesiyas.
- source_word: ὑπὸ τῶν ὄφεων
  choice: ng mga ahas
  rationale: Ang “ahas” ang karaniwan at malinaw na makabagong katumbas ng ὄφις.
- source_word: ἀπώλλυντο
  choice: nilipol sila
  rationale: Ipinapahayag nito ang mapaminsalang pagkamatay na dulot ng mga ahas. Mas natural ito kaysa sa literal ngunit mabigat na “patuloy silang nililipol,” bagaman hindi ganap na naipakikita ang imperpektibong aspekto.
theological_decisions:
- issue: Referente at tekstuwal na anyo ng τὸν Χριστόν
  choice: ang Mesiyas
  alternative: ang Panginoon; si Cristo
  rationale: Χριστόν ang teksto ng SBLGNT at tinutukoy nito ang Mesiyas bilang siyang sinubok ng ilan sa Israel sa ilang. Mahalaga ang baryanteng “Panginoon,” kaya inilagay ito sa talababa sa halip na tahimik na piliin o alisin.
translation_notes:
  register: 'Makabago, malinaw, at marangal na Filipino. Ginamit ang “Mesiyas” bilang salin ng titulo at “mga ahas” bilang karaniwang katawagan. Isang talababa lamang ang kailangan: ang “serpents” ay walang hiwalay na mahalagang leksikal na alternatibo sa Filipino bukod sa mas di-karaniwang “mga serpiyente.”'
