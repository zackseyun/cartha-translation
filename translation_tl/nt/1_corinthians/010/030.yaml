  text: If I partake with thankfulness[a], why am I denounced for that for which I give thanks?
translation:
  language: tl
  text: Kung nakikibahagi ako nang may pasasalamat[a], bakit ako sinisiraan dahil sa ipinagpapasalamat ko?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kung nakikibahagi ako sa pamamagitan ng biyaya, bakit ako sinisiraan dahil sa ipinagpapasalamat ko?” Ang Griyegong χάριτι ay maaari ring isaling “sa pamamagitan ng biyaya,” ngunit dahil sa kasunod na “ipinagpapasalamat ko,” nauunawaan ito ng marami rito bilang “nang may pasasalamat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριτι
  choice: nang may pasasalamat
  rationale: Sa konteksto ng pagkain at ng kasunod na εὐχαριστῶ, ipinahihiwatig nito ang pakikibahaging may pasasalamat. Pinananatili sa talababa ang posibleng kahulugang “sa pamamagitan ng biyaya.”
- source_word: μετέχω
  choice: nakikibahagi
  rationale: Likas at marangal na salin para sa pakikibahagi o pagkain sa kontekstong ito, nang hindi nililimitahan ang pandiwa sa simpleng “kumakain.”
- source_word: βλασφημοῦμαι
  choice: sinisiraan
  rationale: Kapag tao ang pinatutungkulan, ang pandiwa ay tumutukoy sa mapanirang o masamang pananalita laban sa kaniya, hindi kinakailangang pamumusong sa Diyos.
- source_word: ὑπὲρ οὗ
  choice: dahil sa bagay na
  rationale: Ipinapahayag ang sanhi o batayan ng paninira at natural sa modernong Tagalog.
- source_word: εὐχαριστῶ
  choice: ipinagpapasalamat ko
  rationale: Tumpak na naghahayag ng pagbibigay-pasalamat habang hindi idinaragdag ang “sa Diyos,” na implicit ngunit hindi tahasang nasa Griyego.
- source_word: τί
  choice: bakit
  rationale: Sa retorikal na tanong, idiomatikong nangangahulugan itong “bakit.”
- source_word: ἐγὼ ... ἐγὼ
  choice: ako ... ko
  rationale: Nananatili ang unang panauhan sa natural na balangkas ng Tagalog; hindi na kailangan ang pilit na pag-uulit ng malayang panghalip.
theological_decisions:
- issue: Kahulugan ng χάριτι kaugnay ng pagkain at pasasalamat
  choice: may pasasalamat
  alternative: sa pamamagitan ng biyaya
  rationale: Mas pinapaboran ng kasunod na εὐχαριστῶ (“ipinagpapasalamat ko”) ang diwa ng pasasalamat. Gayunman, tunay na posible sa leksikon ang “biyaya,” kaya hindi ito inalis kundi inilagay sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “nakikibahagi” upang mapanatili ang saklaw ng μετέχω at ang “sinisiraan” para sa masamang pananalita laban sa isang tao.
