translation:
  language: tl
  text: At kumain silang lahat ng iisang espirituwal na pagkain[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mahimalang pagkain.” Malamang na tumutukoy ang parirala sa manna sa ilang at maaaring may tipolohikal na pahiwatig sa kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: at
  rationale: Karaniwang pang-ugnay na nagdurugtong sa talatang ito sa naunang pahayag.
- source_word: πάντες
  choice: silang lahat
  rationale: Tumutukoy sa buong pangkat ng Israel at malinaw na pinananatili ang diin sa kanilang kabuuan.
- source_word: τὸ αὐτὸ
  choice: iisang
  rationale: Likas na salin sa Filipino para sa pagkakapareho o iisang pagkakakilanlan ng pagkaing kinain ng lahat.
- source_word: πνευματικὸν
  choice: espirituwal
  rationale: Pinananatili ang karaniwang kahulugan ng salitang ginagamit ni Pablo nang hindi ito pinakikitid sa 'mula sa Espiritu' o pinapakahulugang supernatural lamang.
- source_word: βρῶμα
  choice: pagkain
  rationale: Tuwiran at natural na katumbas ng pangkalahatang katawagan para sa pagkain.
- source_word: ἔφαγον
  choice: kumain
  rationale: Payak na pagsasalaysay ng nakaraang kilos, ayon sa aorist indicative.
theological_decisions:
- issue: Kahulugan ng “espirituwal na pagkain” sa tipolohiyang tungkol sa ilang
  choice: Panatilihin sa pangunahing teksto ang “espirituwal na pagkain” nang hindi tahasang tinutukoy bilang manna o bilang Hapunan ng Panginoon.
  alternative: “makahimalang pagkain,” “pagkaing mula sa Espiritu,” o tahasang “manna”
  rationale: Malamang na ipinahihiwatig ni Pablo ang manna sa ilang, ngunit may tipolohikal ding bisa ang pananalita sa konteksto. Pinananatili ng salin ang tunay na lawak at tensiyong teolohikal ng orihinal.
translation_notes:
  register: Modernong Filipino na simple ngunit marangal. Ginamit ang “iisang” para sa natural at malinaw na pagpapahayag ng τὸ αὐτὸ, at pinanatili ang terminong “espirituwal” upang huwag paliitin ang kahulugan ng πνευματικόν.
