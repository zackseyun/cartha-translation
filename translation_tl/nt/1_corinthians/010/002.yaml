lexical_decisions:
- source_word: πάντες
  choice: silang lahat
  rationale: Tumutukoy ito nang sama-sama sa lahat ng Israelitang tinatalakay at pinananatili ang paulit-ulit na diin ni Pablo sa “lahat” sa konteksto.
- source_word: εἰς τὸν Μωϋσῆν
  choice: tungo kay Moises
  rationale: Pinananatili ng “tungo kay Moises” ang di-pangkaraniwang εἰς na parirala at ang pagkakatulad nito sa pananalita tungkol sa bautismo, nang hindi nililimitahan ang kahulugan sa pakikiisa, pagkakaugnay, o katapatan lamang.
- source_word: ἐβαπτίσαντο
  choice: ay binautismuhan
  rationale: Bagaman anyong panggitna ang pandiwang Griyego, likas itong maisasalin sa Filipino bilang balintiyak. Pinananatili ng “binautismuhan” ang kinikilalang kahulugan ng βαπτίζω at ang tipolohikal na gamit ni Pablo.
- source_word: ἐν τῇ νεφέλῃ
  choice: sa ulap
  rationale: Ang “sa ulap” ay likas sa Filipino at pinananatili ang lawak ng ἐν, na maaaring magpahiwatig ng kinalalagyan, kasangkapan, o kaugnayan.
- source_word: ἐν τῇ θαλάσσῃ
  choice: sa dagat
  rationale: Pinananatili nito ang ἐν at ang tuwirang pagkakatulad sa “sa ulap”; hindi nito pinapalitan ang sinabi ni Pablo ng “sa pamamagitan ng dagat” o “tumawid sa dagat.”
theological_decisions:
- issue: Kahulugan ng pagiging “binautismuhan tungo kay Moises” ng Israel
  choice: Panatilihin ang tipolohikal at kinatawang pananalita nang hindi ito lubusang ipinapaliwanag sa pangunahing teksto.
  alternative: “nakipag-isa kay Moises” o “napasailalim sa pamumuno ni Moises”
  rationale: Iniuugnay ni Pablo ang karanasan ng Israel sa paglabas sa Ehipto sa bautismong Kristiyano. Ang mas malayang pagpapakahulugan ay maaaring pumili ng isang paliwanag at mawala ang sinadyang tensiyon at pagkakatulad ng teksto.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Sadyang bahagyang di-karaniwan ang “tungo kay Moises” upang mapanatili ang pambihirang hulma at teolohikal na tensiyon ng Griyego; nililinaw ng talababa ang mga posibleng diwa nang hindi ipinapasok ang mga iyon sa pangunahing teksto.
