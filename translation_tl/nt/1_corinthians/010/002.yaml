  footnotes:
  - marker: a
    text: O “nakaugnay kay Moises” o “napasailalim sa pamumuno ni Moises.” Di-karaniwan ang Griyegong parirala, na literal na “papasok kay Moises,” at pinananatili nito ang tipolohikal na pagkakatulad sa bautismo.
