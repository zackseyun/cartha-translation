  text: μηδὲ πορνεύωμεν, καθώς τινες αὐτῶν ἐπόρνευσαν, καὶ ἔπεσαν μιᾷ ἡμέρᾳ εἴκοσι τρεῖς χιλιάδες.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/008.yaml
  text: Nor should we commit sexual immorality[a], as some of them committed sexual immorality[b], and twenty-three thousand fell in one day.
translation:
  language: tl
  text: Huwag din tayong gumawa ng imoral na gawaing seksuwal, gaya ng ginawa ng ilan sa kanila; at dalawampu’t tatlong libo ang nabuwal[a] sa isang araw.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “namatay” o “pinatay sa hatol.” Ang literal na sabi sa Griyego ay “nabuwal,” isang karaniwang paraan ng pagtukoy sa pagkamatay sa ilalim ng hatol.
    reason: lexical_alternative
  - marker: b
    text: Dalawampu’t apat na libo ang iniulat sa Bilang 25:9. Dito ay sinabi ni Pablo na dalawampu’t tatlong libo ang nabuwal “sa isang araw.” Posibleng ang bilang dito ay para sa mga namatay nang araw na iyon, samantalang ang nasa Bilang ay ang mas malaking kabuuan; gayunman, pinananatili ng salin ang sinabi ni Pablo nang hindi pinagkakasundo ang dalawang bilang.
    reason: cross_reference
lexical_decisions:
- source_word: μηδὲ
  choice: Huwag din
  rationale: Ipinagpapatuloy nito ang sunod-sunod na mga babala at likas na ipinapahayag sa modernong Tagalog ang nagbabawal na hortatory subjunctive.
- source_word: πορνεύωμεν / ἐπόρνευσαν
  choice: gumawa ng mga imoral na gawaing seksuwal / ginawa
  rationale: Malinaw at kasalukuyang pananalita ito para sa malawak na saklaw ng πορνεύω, nang hindi ito nililimitahan sa isang partikular na uri ng seksuwal na kasalanan. Pinananatili rin ng salitang “ginawa” sa ikalawang sugnay ang pag-uulit ng diwa nang hindi nagiging mabigat ang Tagalog.
- source_word: καθώς
  choice: gaya ng
  rationale: Likas na naghahayag ng paghahambing sa ginawa ng ilan sa Israel.
- source_word: τινες αὐτῶν
  choice: ilan sa kanila
  rationale: Tuwirang tumutukoy sa ilang kabilang sa salinlahi ng Israel sa ilang.
- source_word: ἔπεσαν
  choice: nabuwal
  rationale: Pinananatili nito ang larawang “nahulog/nabuwal” ng πίπτω habang ipinahihiwatig ng konteksto na namatay sila sa hatol. Ipinaliliwanag sa talababa ang diwa.
- source_word: μιᾷ ἡμέρᾳ
  choice: sa loob ng isang araw
  rationale: Malinaw na ipinapahayag ang panahong kinasaklawan at ang biglaang lawak ng pangyayari.
- source_word: εἴκοσι τρεῖς χιλιάδες
  choice: dalawampu’t tatlong libo
  rationale: Tuwirang isinasalin ang bilang na nasa tekstong Griyego.
theological_decisions:
- issue: Ugnayan ng bilang dito sa Bilang 25:9
  choice: Pinanatili sa pangunahing teksto ang “dalawampu’t tatlong libo.”
  alternative: Palitan ito ng “dalawampu’t apat na libo” upang itugma sa Bilang 25:9, o tahasang ipaliwanag sa teksto na subtotal ang isa at kabuuang bilang ang isa.
  rationale: Malinaw na dalawampu’t tatlong libo ang nasa tekstong Griyego ng 1 Corinto 10:8. Hindi tungkulin ng salin na alisin ang tensiyon sa pamamagitan ng tahimik na pagtutugma; ang posibleng paliwanag ay inilalagay lamang sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Iniwasan ang mas makitid at medyo makalumang “makiapid,” gayundin ang tahimik na paglutas sa pagkakaiba ng mga bilang.
