  source_fidelity: 'Tapat ang salin sa mga pangunahing elemento ng Griyego: ang saklaw na “lahat” at “iisa,” ang aorist na “uminom,” ang imperfect na “umiinom,” ang anarthrous na “isang ... bato,” ang nagpapatuloy na diwa ng ἀκολουθούσης sa “sumusunod,” at ang tuwirang panaguring “ang bato ay ang Mesiyas.” Hindi nito binabawasan ang πνευματικός sa “simboliko” o “mahimalang.”'
