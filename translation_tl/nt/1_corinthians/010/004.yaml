base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/004.yaml
  text: and all drank the same spiritual drink[a], for they were drinking from a spiritual rock that followed them[b], and the rock was the Messiah.
translation:
  language: tl
  text: at uminom silang lahat ng iisang espirituwal na inumin, sapagkat umiinom sila mula sa isang espirituwal na batong sumusunod sa kanila[a], at ang bato ay ang Mesiyas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “batong sumunod sa kanila.” Ipinahihiwatig ng anyong Griyego ang nagpapatuloy na pagsunod.
    reason: lexical_alternative
  - marker: b
    text: 'Griyego: “Cristo.” Isinaling “Mesiyas” dito sapagkat ang Χριστός ay ginagamit bilang titulo.'
    reason: alternative_reading
lexical_decisions:
- source_word: πνευματικὸν ... πόμα
  choice: espirituwal na inumin
  rationale: Pinananatili nito ang salita at teolohikal na bigat ni Pablo, pati ang pagkakatulad nito sa “espirituwal na pagkain” sa naunang talata, nang hindi ito nililimitahan sa “simboliko” o “mahimalang” inumin.
- source_word: ἔπιον
  choice: uminom
  rationale: Ang aorist ay nagbubuod sa magkakatulad na karanasan ng buong salinlahi sa ilang; natural sa Tagalog ang payak na aspektong naganap na “uminom.”
- source_word: ἔπινον
  choice: umiinom sila
  rationale: Ipinahihiwatig ng imperfect ang nagpapatuloy o paulit-ulit na kilos; naihihiwalay din nito ang anyo sa naunang “uminom.”
- source_word: ἐκ πνευματικῆς ἀκολουθούσης πέτρας
  choice: mula sa isang espirituwal na batong sumusunod sa kanila
  rationale: Ang “isang” ay angkop sa pangngalang walang pantukoy sa pariralang Griyego; pinananatili ng “sumusunod” ang nagpapatuloy na aspekto ng present participle at ang tunay na kakaibang larawan ng teksto.
- source_word: πέτρα
  choice: bato
  rationale: Ang “bato” ang natural at dignidad na katumbas sa modernong Tagalog at pinananatili ang tipolohikal na larawan.
- source_word: ἡ πέτρα δὲ ἦν
  choice: at ang bato ay
  rationale: Mahinang pandugtong ang δέ rito; natural ang “at” at hindi nito pinalalabis ang pagsalungat.
- source_word: ὁ Χριστός
  choice: ang Mesiyas
  rationale: Sa panaguring ito, ang Χριστός ay gumaganap bilang titulo. Inihahayag ng “Mesiyas” ang kahulugan nito sa halip na ituring lamang na tila personal na pangalan.
- source_word: πάντες τὸ αὐτὸ
  choice: silang lahat ng iisang
  rationale: Pinananatili nito ang diin ni Pablo na ang buong pangkat ay nakibahagi sa parehong karanasan.
theological_decisions:
- issue: Ang pahayag na “ang bato ay ang Mesiyas”
  choice: 'Tuwirang pinanatili ang tipolohikal at kristolohikal na pagkakakilanlan: “ang bato ay ang Mesiyas.”'
  alternative: “Ang bato ay kumakatawan sa Mesiyas.”
  rationale: Tuwirang ekwatibong sugnay ang ἡ πέτρα δὲ ἦν ὁ Χριστός. Hindi dapat pahinain ang pahayag bilang representasyon lamang ni ipaliwanag kung paano eksaktong nauugnay ang materyal na bato at ang Mesiyas.
- issue: Kahulugan ng “espirituwal” para sa inumin at bato
  choice: Pinanatili ang “espirituwal.”
  alternative: “simboliko” o “mahimalang”
  rationale: May sadyang teolohikal na bigat ang πνευματικός at maaaring tumukoy sa kaloob ng Diyos, larangan ng Espiritu, at tipolohikal na kabuluhan. Ang mas tiyak na mga salita ay magpapakitid sa saklaw ng Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “espirituwal” upang mapanatili ang terminolohiya ni Pablo, “Mesiyas” para sa titulong Χριστός, at “batong sumusunod” upang ihayag ang nagpapatuloy na aspekto nang hindi ipinapaliwanag o pinapahina ang kakaibang tipolohikal na larawan.
