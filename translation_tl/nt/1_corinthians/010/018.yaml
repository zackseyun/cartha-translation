source:
  edition: SBLGNT
  text: βλέπετε τὸν Ἰσραὴλ κατὰ σάρκα· ⸀οὐχ οἱ ἐσθίοντες τὰς θυσίας κοινωνοὶ τοῦ θυσιαστηρίου εἰσίν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/018.yaml
  text: 'Consider Israel according to the flesh: are not those who eat the sacrifices participants in the altar?[a][b][c]'
translation:
  language: tl
  text: Isaalang-alang ninyo ang Israel ayon sa laman:[a] hindi ba’t ang mga kumakain ng mga hain ay nakikibahagi sa altar?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang Israel ayon sa likas na angkan” o “ang Israel ayon sa pisikal na pinagmulan.”
    reason: lexical_alternative
  - marker: b
    text: O “mga kabahagi ng altar” o “nakikisalo sa altar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπετε
  choice: Isaalang-alang ninyo
  rationale: Ang maramihang pautos ay nananawagan dito ng mapanuring pansin sa halimbawang ihaharap ni Pablo, hindi lamang ng literal na pagtingin.
- source_word: Ἰσραὴλ κατὰ σάρκα
  choice: ang Israel ayon sa laman
  rationale: Pinananatili ang tahasang pananalita ni Pablo tungkol sa ‘laman’ at ang posibleng teolohikal na tensiyon nito; sa konteksto, tumutukoy ito sa Israel ayon sa likas o pisikal na angkan, hindi sa ‘makasalanang kalikasan.’
- source_word: οὐχ ... εἰσίν;
  choice: hindi ba’t ... ?
  rationale: Likas na anyong Filipino ng retorikal na tanong na umaasang sasang-ayon ang kausap.
- source_word: οἱ ἐσθίοντες
  choice: ang mga kumakain
  rationale: Pinananatili ang kongkretong kilos ng pagkain sa substantibong kasalukuyang pandiwari.
- source_word: τὰς θυσίας
  choice: mga hain
  rationale: Maikli, malinaw, at karaniwang salin para sa mga inihahandog na sakripisyo sa kontekstong panrelihiyon.
- source_word: κοινωνοὶ τοῦ θυσιαστηρίου
  choice: nakikibahagi sa altar
  rationale: Ipinahahayag ang tunay na pakikilahok o pakikisalo na kaugnay ng altar, habang natural sa makabagong Filipino at hindi ipinapakahulugang literal na hinahati ang altar.
theological_decisions:
- issue: Kahulugan ng ‘Israel ayon sa laman’
  choice: Pinanatili ang pariralang ‘ayon sa laman,’ na sa kontekstong ito ay tumutukoy sa Israel ayon sa likas o pisikal na angkan.
  alternative: ‘Ang Israel ayon sa likas na angkan’ o ‘ang bayang Israel’
  rationale: Hindi nilulutas ng salin ang mas malawak na usaping teolohikal tungkol sa Israel; pinananatili nito ang natatanging pananalita ni Pablo habang nililinaw sa talababa ang kahulugan sa konteksto.
- issue: Ugnayan ng mga kumakain at ng altar
  choice: ‘nakikibahagi sa altar’
  alternative: ‘mga kabahagi ng altar’ o ‘nakikisalo sa altar’
  rationale: Ang genitibong τοῦ θυσιαστηρίου kasunod ng κοινωνοί ay nagpapahiwatig ng pakikibahaging kaugnay ng altar at ng paghahaing kinakatawan nito. Hindi dinaragdagan ng salin ang teksto ng tiyak na doktrina tungkol sa paraan ng pakikibahagi.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang ‘Isaalang-alang ninyo’ para sa mapanuring apela at ang ‘hindi ba’t’ para sa natural na retorikal na tanong. Pinanatili ang ‘ayon sa laman’ upang huwag burahin ang sadyang pananalita at tensiyon ng orihinal.
