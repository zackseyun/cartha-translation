base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/028.yaml
  text: But if someone says to you, “This has been offered in sacrifice,” do not eat it, for the sake of the one who informed you and for conscience’ sake.
translation:
  language: tl
  text: Ngunit kung may magsabi sa inyo, “Ito ay inihandog bilang hain,”[a] huwag ninyong kainin, alang-alang sa nagsabi sa inyo at alang-alang sa budhi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Ito ay karneng inihandog bilang hain.” Ang salitang Griyego ay tumutukoy sa isang bagay na inihandog sa paghahain.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, alang-alang sa budhi ng taong nagbigay-alam, hindi sa inyong sariling budhi; tingnan ang kasunod na talata.
    reason: cross_reference
lexical_decisions:
- source_word: ἐὰν δέ τις ὑμῖν εἴπῃ
  choice: Ngunit kung may magsabi sa inyo
  rationale: Ang ἐὰν na may aorist subjunctive ay naghaharap ng isang posibleng kalagayan; ang τις ay likas na isinaling “may,” at pinananatili ng “ngunit” ang pagsalungat ng δέ sa naunang konteksto.
- source_word: Τοῦτο ἱερόθυτόν ἐστιν
  choice: Inihandog ito bilang hain
  rationale: Ang ἱερόθυτος ay tumutukoy sa bagay na inihandog sa isang paghahain, lalo na sa pagkaing mula rito. Hindi idinagdag ang “sa diyos-diyosan” sapagkat wala iyon sa mismong salita, bagaman maaaring ipahiwatig ng mas malawak na konteksto.
- source_word: μὴ ἐσθίετε
  choice: huwag ninyong kainin
  rationale: Ang present imperative na may μή ay pagbabawal. Likas sa Filipino ang paglalagay ng layong “-in,” na tumutukoy sa pagkaing binanggit.
- source_word: δι’ ἐκεῖνον τὸν μηνύσαντα
  choice: alang-alang sa nagsabi sa inyo
  rationale: Ang διά na may accusative ay nagpapahayag ng pagsasaalang-alang. Ang μηνύσαντα ay nangangahulugang nagbigay-alam o nagsabi; mas natural dito ang “nagsabi sa inyo.”
- source_word: καὶ τὴν συνείδησιν
  choice: at alang-alang sa budhi
  rationale: Ang συνείδησις ay “budhi.” Inuulit ang “alang-alang” upang maging malinaw at natural ang ugnayan nito sa naunang parirala, habang hindi tinutukoy sa pangunahing teksto kung kaninong budhi iyon.
theological_decisions:
- issue: Kaninong budhi ang tinutukoy ng τὴν συνείδησιν
  choice: Hindi tahasang tinukoy sa pangunahing teksto; ipinapaliwanag sa talababa na budhi ito ng taong nagbigay-alam.
  alternative: Tahasang isalin na “alang-alang sa budhi ng taong iyon.”
  rationale: Sa mismong talata ay maikli at maaaring tila hindi tiyak ang parirala, ngunit nililinaw ng kasunod na talata na hindi sariling budhi ng kakain ang tinutukoy kundi ang budhi ng iba. Pinananatili ng pangunahing teksto ang daloy at anyo ng Griyego, at ibinibigay ng talababa ang kontekstuwal na paglilinaw.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “budhi” bilang karaniwang salin ng συνείδησις at ang “alang-alang” upang likas na maipahayag ang etikal na pagsasaalang-alang. Iniwasan ang mas interpretibong “inihandog sa diyos-diyosan” sa pangunahing teksto upang huwag magdagdag sa leksikal na nilalaman ng ἱερόθυτος.
