id: 1CO.10.14
reference: 1 Corinthians 10:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Διόπερ, ἀγαπητοί μου, φεύγετε ἀπὸ τῆς εἰδωλολατρίας.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/014.yaml
  text: Therefore[a], my beloved, flee from idolatry.
translation:
  language: tl
  text: Kaya nga, mga minamahal ko, layuan ninyo ang pagsamba sa mga diyos-diyosan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “idolatriya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διόπερ
  choice: Kaya nga
  rationale: Nagpapahayag ito ng konklusyon mula sa naunang pangangatwiran. Likas sa modernong Tagalog ang “Kaya nga” at malinaw na pinananatili ang lohikal na ugnayan.
- source_word: ἀγαπητοί μου
  choice: mga minamahal ko
  rationale: Isang magiliw na tuwirang pagtawag ito sa maramihang kausap. Pinananatili ng “mga minamahal ko” ang init at dignidad ng pananalita ni Pablo.
- source_word: φεύγετε ἀπὸ
  choice: layuan ninyo
  rationale: Ang pangkasalukuyang pautos na maramihan ay mariing humihiling ng pag-iwas at paghiwalay sa isang panganib. Mas natural sa Tagalog ang “layuan ninyo” kaysa literal na “tumakas kayo mula sa,” habang nananatili ang lakas ng utos.
- source_word: τῆς εἰδωλολατρίας
  choice: ang pagsamba sa mga diyos-diyosan
  rationale: Tumutukoy ang salita sa pagsamba o paglilingkod sa mga idolo. Ang tahasang pariralang ito ay mas madaling maunawaan ng karaniwang mambabasa kaysa “idolatriya” at hindi nililimitahan ang diwa sa panloob na saloobin lamang.
theological_decisions:
- issue: Saklaw ng ipinagbabawal
  choice: Isang tuwirang utos na layuan ang pagsamba sa mga diyos-diyosan at ang pakikibahagi sa kaugnay nitong mga gawain
  alternative: Babala lamang laban sa panloob na debosyon sa mga diyos-diyosan
  rationale: Sa konteksto, nagbababala si Pablo laban sa pakikibahagi sa mga paganong handaan at gawaing panrelihiyon. Kaya pinananatili ng salin ang malawak na diwa ng εἰδωλολατρία at hindi ito pinapakitid sa panloob na paniniwala lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga minamahal ko” bilang mainit ngunit hindi lipas na pagtawag, at “layuan ninyo” bilang natural at mariing pautos sa maramihang kausap.
