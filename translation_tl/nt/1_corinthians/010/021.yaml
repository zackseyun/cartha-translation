id: 1CO.10.21
reference: 1 Corinthians 10:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὐ δύνασθε ποτήριον κυρίου πίνειν καὶ ποτήριον δαιμονίων· οὐ δύνασθε τραπέζης κυρίου μετέχειν καὶ τραπέζης δαιμονίων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/021.yaml
  text: You cannot drink the cup of the Lord and the cup of demons[a]; you cannot partake of the table of the Lord and the table of demons.
translation:
  language: tl
  text: Hindi kayo maaaring uminom mula sa kopa ng Panginoon at mula sa kopa ng mga demonyo; hindi kayo maaaring makibahagi sa hapag ng Panginoon at sa hapag ng mga demonyo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ δύνασθε
  choice: hindi kayo maaaring
  rationale: Likas at tuwirang Filipino ito para sa paulit-ulit na pahayag ng kawalan ng posibilidad o ganap na di-pagkakatugma.
- source_word: ποτήριον
  choice: kopa
  rationale: Karaniwang makabagong katumbas na nagpapanatili sa konkretong larawan at sa pahiwatig ng pakikibahagi sa ritwal.
- source_word: κυρίου
  choice: ng Panginoon
  rationale: Tuwirang ipinapahayag ang genitibo at pinananatili ang pagkakapantay ng mga pariralang “ng Panginoon” at “ng mga demonyo.”
- source_word: πίνειν
  choice: uminom mula sa
  rationale: Mas natural sa Filipino kaysa sa literal ngunit alanganing pagtrato sa “kopa” bilang tuwirang layon; malinaw pa ring ang tinutukoy ay pag-inom sa kopa.
- source_word: δαιμονίων
  choice: mga demonyo
  rationale: Tuwiran at malinaw na katumbas na nagpapanatili sa personal at espirituwal na diwa ng salita.
- source_word: τραπέζης
  choice: hapag
  rationale: Pinananatili ang larawan ng mesang pinagsasaluhan, kasama ang kontekstong panrelihiyon, nang hindi nagdaragdag ng salitang “altar.”
- source_word: μετέχειν
  choice: makibahagi sa
  rationale: Natural na modernong Filipino para sa aktuwal na pakikilahok o pagkakaroon ng bahagi; hindi nito nilalabnaw ang diwa tungo sa basta pagdalo lamang.
- source_word: καὶ
  choice: at
  rationale: Pinananatili ang magkatulad na kayarian at mariing paghahambing ng dalawang sugnay.
theological_decisions:
- issue: Lakas ng paulit-ulit na pagtanggi tungkol sa pakikibahagi sa hapag ng Panginoon at sa pagsambang kaugnay ng mga demonyo
  choice: Ganap na di-pagkakatugma, na ipinahayag sa “hindi kayo maaaring” sa dalawang sugnay
  alternative: Isang payo lamang na iwasan ito, sa halip na isang mariing pahayag ng di-pagkakatugma
  rationale: Ang dalawang paggamit ng οὐ δύνασθε ay kategoryal. Pinananatili ng salin ang lakas nito nang hindi ipinapaliwanag kung ang kawalan ng posibilidad ay moral, espirituwal, o ritwal.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “kopa” at “hapag” upang mapanatili ang kongkreto at panrelihiyong larawan ng Griyego; iniwasan ang mas makalumang “saro” at ang labis na nagpapaliwanag na mga paraphrase.
