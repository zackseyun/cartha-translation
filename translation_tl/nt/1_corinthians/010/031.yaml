base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/031.yaml
  text: Therefore, whether you eat or drink, or whatever you do, do everything for the glory of God.
translation:
  language: tl
  text: Kaya, kumain man kayo o uminom man kayo o anuman ang gawin ninyo, gawin ninyo ang lahat para sa kaluwalhatian ng Diyos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἴτε ... εἴτε ... εἴτε
  choice: kumain man ... o uminom, o anuman
  rationale: Ginagamit ang “man ... o ... o” upang likas na maipahayag sa modernong Tagalog ang magkakaugnay na mga maaaring kalagayan, habang pinananatili ang retorikal na ayos ng Griyego.
- source_word: οὖν
  choice: Kaya
  rationale: Naghuhudyat ang οὖν ng kongklusyon mula sa naunang pagtalakay. Ang “Kaya” ay malinaw, natural, at angkop sa isang paghihikayat.
- source_word: ἐσθίετε
  choice: kumain kayo
  rationale: Bagaman nasa present tense ang Griyego, pangkalahatan o kinagawiang gawain ang tinutukoy. Natural sa Tagalog ang anyong “kumain man kayo” sa ganitong pangkalahatang pahayag.
- source_word: πίνετε
  choice: uminom
  rationale: Tulad ng ἐσθίετε, pangkalahatan ang gamit nito. Hindi na kailangang ulitin ang “kayo” dahil malinaw itong saklaw ng magkakaugnay na sugnay.
- source_word: τι ποιεῖτε
  choice: anuman ang gawin ninyo
  rationale: Pinalalawak ng τι ang saklaw lampas sa pagkain at pag-inom. Ang “anuman ang gawin ninyo” ay natural at nagpapanatili sa malawak na diwa ng parirala.
- source_word: πάντα ... ποιεῖτε
  choice: gawin ninyo ang lahat
  rationale: Ipinahahayag ng πάντα ang kabuuang saklaw, at inuulit ng salin ang pandiwang “gawin” gaya ng pag-uulit ng ποιεῖτε sa Griyego.
- source_word: εἰς δόξαν
  choice: para sa kaluwalhatian
  rationale: Ipinahahayag ng εἰς dito ang layunin o tunguhin. Malinaw at karaniwan sa modernong Tagalog ang “para sa kaluwalhatian.”
- source_word: θεοῦ
  choice: ng Diyos
  rationale: Tuwirang ipinapahayag ng “ng Diyos” ang ugnayang henitibo at pinananatili ang pamilyar at teolohikal na mahalagang pariralang “kaluwalhatian ng Diyos.”
theological_decisions:
- issue: Saklaw ng paghihikayat ni Pablo
  choice: 'Isang malawak na prinsipyong etikal: ang lahat ng gawain, kasama ang karaniwang pagkain at pag-inom, ay dapat ituon sa kaluwalhatian ng Diyos.'
  alternative: Isang mas makitid na tagubilin na limitado lamang sa usapin ng pagkain at pag-inom.
  rationale: Mula sa tiyak na mga halimbawa ng pagkain at pag-inom, lumalawak ang pangungusap tungo sa “anuman ang gawin ninyo” at “ang lahat.” Kaya naglalahad ito ng pangkalahatang prinsipyo na nagmumula pa rin sa agarang konteksto ng usapin tungkol sa pagkain.
translation_notes:
  register: Modernong Filipino Tagalog na natural, maikli, at marangal. Pinili ang “Kaya” sa halip na mas pormal na “Samakatuwid,” at pinanatili ang pamilyar na pariralang “kaluwalhatian ng Diyos.”
