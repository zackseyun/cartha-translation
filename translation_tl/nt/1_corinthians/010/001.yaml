base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/001.yaml
  text: For I do not want you to be unaware[a], brothers, that our fathers were all under the cloud, and all passed through the sea,
translation:
  language: tl
  text: Sapagkat hindi ko nais, mga kapatid,[a] na hindi ninyo malaman na ang lahat ng ating mga ninuno ay nasa ilalim ng ulap, at silang lahat ay dumaan sa dagat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga kapatid” ay tumutukoy rito sa buong kongregasyon, kapwa mga lalaki at mga babae.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ θέλω ... ἀγνοεῖν
  choice: ayaw kong hindi ninyo malaman
  rationale: Pinananatili ang minarkahang negatibong anyo ng karaniwang pahayag ni Pablo, ngunit gumagamit ng likas at malinaw na modernong Tagalog.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag na kaugnayan nito sa naunang pangangatwiran.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Ang “mga kapatid” ay likas na tawag sa buong kongregasyon sa Tagalog at hindi kailangang markahan ayon sa kasarian.
- source_word: οἱ πατέρες ἡμῶν
  choice: ating mga ninuno
  rationale: Sa kontekstong pangkasaysayan, malinaw na tumutukoy ito sa naunang salinlahi ng Israel; pinananatili ng “ating” ang pakikiisa ni Pablo at ng mga mambabasa sa kuwentong iyon.
- source_word: πάντες
  choice: ang lahat ... silang lahat
  rationale: Pinananatili ang dalawang pag-uulit ng πάντες, na mahalaga sa retorika ng talata at ng kasunod na babala.
- source_word: ὑπὸ τὴν νεφέλην ἦσαν
  choice: ay nasa ilalim ng ulap
  rationale: Tuwirang pinananatili ang larawan ng ulap sa salaysay ng paglabas mula sa Ehipto nang hindi nagdaragdag ng interpretasyon.
- source_word: διὰ τῆς θαλάσσης διῆλθον
  choice: dumaan sa gitna ng dagat
  rationale: Malinaw na ipinahahayag ang paggalaw sa loob at paglagpas sa dagat; likas ito sa Tagalog at pinananatili ang larawan ng Exodo.
theological_decisions:
- issue: Ang saklaw ng ἀδελφοί sa pagtawag sa kongregasyon
  choice: mga kapatid
  alternative: mga kapatid na lalaki at babae
  rationale: Sa modernong Tagalog, ang “mga kapatid” ay likas na kolektibong katawagan na maaaring tumukoy sa kapwa lalaki at babae, habang nananatiling malapit sa larawang pampamilya ng Griyego.
- issue: Ang pakikiisa ng kongregasyong kabilang ang mga Hentil sa Israel sa οἱ πατέρες ἡμῶν
  choice: ating mga ninuno
  alternative: ating mga ama
  rationale: Pinananatili ng panghalip na “ating” ang sadyang pakikiisa ng mga mambabasa sa kasaysayan ng Israel. Ang “mga ninuno” ang mas malinaw at likas na tawag sa makasaysayang naunang salinlahi sa Tagalog, nang hindi ipinapalagay na literal silang mga magulang ng bawat mambabasa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang negatibong pormulasyon at ang dalawang pag-uulit ng “lahat,” habang iniwasan ang sobrang teknikal o makalumang pananalita.
