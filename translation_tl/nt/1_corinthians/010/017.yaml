  text: ὅτι εἷς ἄρτος, ἓν σῶμα οἱ πολλοί ἐσμεν, οἱ γὰρ πάντες ἐκ τοῦ ἑνὸς ἄρτου μετέχομεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/017.yaml
  text: Because there is one bread[a], we who are many are one body, for we all partake of the one bread.
translation:
  language: tl
  text: Sapagkat iisa ang tinapay[a], tayong marami ay iisang katawan, dahil lahat tayo ay nakikibahagi sa iisang tinapay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang buong tinapay” sa kapuwa paglitaw ng “iisang tinapay.” Ang Griyegong ἄρτος ay maaaring tumukoy sa isang buong tinapay bilang isang yunit, na higit na nagpapatingkad sa larawan ng maraming taong nagsasalo mula sa iisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Sapagkat
  rationale: Ipinakikilala nito ang paliwanag o batayan ng naunang pahayag; malinaw at likas sa Filipino ang “sapagkat” para sa ugnayang sanhi.
- source_word: εἷς ἄρτος
  choice: iisa ang tinapay
  rationale: Maaaring tumukoy ang ἄρτος sa tinapay sa pangkalahatan o sa isang buong tinapay. Pinananatili ng “tinapay” ang larawan at kaugnayan nito sa hapunan, habang idinidiin ng “iisa” ang kaisahan.
- source_word: ἓν σῶμα
  choice: iisang katawan
  rationale: Tuwirang pinananatili ang larawan ng σῶμα at ang mariing pagtut contrast ng maraming tao at ng iisang katawan.
- source_word: οἱ πολλοί
  choice: tayong marami
  rationale: Likas na Filipino itong tumutukoy sa maramihang mga kabilang sa nagsasalitang pangkat at pinananatili ang pagsalungat ng “marami” at “iisa.”
- source_word: γὰρ
  choice: dahil
  rationale: Nagbibigay ito ng paliwanag sa pagiging iisang katawan. Ang “dahil” ay malinaw at natural sa loob ng pangungusap.
- source_word: πάντες
  choice: tayong lahat
  rationale: Pinananatili nito ang diin na ang buong pangkat ay kapuwa nakikibahagi.
- source_word: ἐκ τοῦ ἑνὸς ἄρτου
  choice: sa iisang tinapay
  rationale: Sa kasamang pandiwang μετέχομεν, ipinahihiwatig ng ἐκ ang pinagmumulan o bagay na pinagsasaluhan. Likas sa Filipino ang “nakikibahagi sa” at hindi nito nilulutas nang lampas sa teksto ang uri ng pakikibahagi.
- source_word: μετέχομεν
  choice: nakikibahagi
  rationale: Ipinahahayag nito ang aktuwal at sama-samang pakikibahagi, at angkop ito sa konteksto ng pagkain at pakikipag-isa.
theological_decisions:
- issue: Ugnayan ng iisang tinapay at ng iisang katawan
  choice: 'Pinananatili ang tuwirang ugnayan: ang marami ay iisang katawan dahil lahat ay nakikibahagi sa iisang tinapay.'
  alternative: Maaaring idiin ang tinapay bilang sagisag lamang ng pagkakaisa, o ipahayag na ang pakikibahagi rito ang sakramental na lumilikha ng pagkakaisa.
  rationale: Mahigpit na inuugnay ng Griyego ang pinagsasaluhang tinapay at ang pagkakaisa ng mga mananampalataya, ngunit hindi nito sa talatang ito lamang nilulutas ang mga sumunod na pagtatalo tungkol sa likas ng Hapunan ng Panginoon. Kaya pinananatili ng salin ang teolohikal na tensiyon nang walang idinaragdag na denominasyonal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tayong marami” at “nakikibahagi” upang maging natural sa karaniwang mambabasa habang pinananatili ang pagkakaiba ng marami at iisa at ang hindi lubusang nilulutas na teolohikal na ugnayan ng tinapay at katawan.
