  text: συνείδησιν δὲ λέγω οὐχὶ τὴν ἑαυτοῦ ἀλλὰ τὴν τοῦ ἑτέρου· ἱνατί γὰρ ἡ ἐλευθερία μου κρίνεται ὑπὸ ἄλλης συνειδήσεως;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/029.yaml
  text: I mean the other person's conscience[a], not your own[b]. For why is my freedom judged by another conscience?
translation:
  language: tl
  text: Ang tinutukoy ko ay ang budhi ng ibang tao[a], hindi ang sarili mong budhi. Bakit nga hinahatulan ng budhi ng iba ang kalayaan ko?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “hindi ang sarili niya, kundi ang sa iba.” Sinusuportahan ng konteksto ang diwang “hindi ang sarili mong budhi, kundi ang budhi ng ibang tao.”'
    reason: lexical_alternative
  - marker: b
    text: Maaaring unawain ang retorikal na tanong bilang sariling hamon ni Pablo o bilang isang pagtutol na binibigkas niya; walang hayag na panandang pagsipi sa Griyego.
    reason: alternative_reading
lexical_decisions:
- source_word: συνείδησιν
  choice: budhi
  rationale: Ang “budhi” ang natural at tiyak na salin sa modernong Filipino para sa moral na kamalayang sumusuri sa kilos.
- source_word: δὲ λέγω
  choice: Ang tinutukoy ko ay
  rationale: Dito, nililinaw ni Pablo ang ibig niyang sabihin sa naunang pahayag; natural na ipinahahayag ng pariralang ito ang paglilinaw nang hindi nagdaragdag ng temporal na “ngayon.”
- source_word: οὐχὶ τὴν ἑαυτοῦ ἀλλὰ τὴν τοῦ ἑτέρου
  choice: ang budhi ng ibang tao, hindi ang sarili mong budhi
  rationale: Nililinaw ng konteksto ang paghahambing sa budhi ng kausap at sa budhi ng ibang tao. Inayos ang pagkakasunod upang maging malinaw at natural sa Filipino, habang itinatala sa talababa ang mas literal na anyo.
- source_word: ἱνατί γὰρ
  choice: Sapagkat bakit
  rationale: Pinananatili ng “sapagkat” ang paliwanag na ugnayan ng γάρ at ng “bakit” ang retorikal na puwersa ng ἱνατί.
- source_word: ἐλευθερία
  choice: kalayaan
  rationale: Ito ang malinaw at karaniwang katumbas sa modernong Filipino at angkop sa usapin ng mga gawaing ipinahihintulot.
- source_word: κρίνεται
  choice: hahatulan
  rationale: Ipinahahayag nito ang pagkakaroon ng paghatol o pasiya tungkol sa kalayaan ng nagsasalita, nang hindi tahasang nililimitahan ang kahulugan sa pormal na pagkondena.
- source_word: ὑπὸ ἄλλης συνειδήσεως
  choice: ng budhi ng iba
  rationale: Likas sa Filipino ang ganitong pagpapahayag ng gumagawa ng paghatol at malapit ito sa malawak na kahulugan ng Griyego.
theological_decisions:
- issue: Tinutukoy ng panghalip sa paghahambing ng mga budhi
  choice: Nililinaw ni Pablo na ang tinutukoy niya ay ang budhi ng ibang tao, hindi ang sariling budhi ng kausap.
  alternative: 'Maaaring isalin nang mas literal: “hindi ang sarili niya, kundi ang sa iba.”'
  rationale: Bagaman ikatlong panauhan ang anyo ng ἑαυτοῦ, ipinakikita ng konteksto na kinakausap ni Pablo ang mga taga-Corinto tungkol sa budhi ng ibang tao. Pinananatili sa talababa ang pormal na alternatibo.
- issue: Nagsasalita sa retorikal na tanong
  choice: Iniwan ang pangungusap bilang retorikal na tanong nang hindi tinutukoy kung sarili itong hamon ni Pablo o pagtutol na binibigkas niya.
  alternative: Maaaring unawain ito bilang pagtutol ng isang kausap na sinipi ni Pablo nang walang hayag na panandang pagsipi.
  rationale: Walang panandang pagbabago ng nagsasalita sa Griyego, kaya hindi dapat tahimik na lutasin ng salin ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “budhi” sa halip na mas teknikal na “konsensiya,” at iniwasan ang pagdaragdag ng panandang temporal na wala sa Griyego.
