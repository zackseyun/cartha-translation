  text: ⸀εἴ τις καλεῖ ὑμᾶς τῶν ἀπίστων καὶ θέλετε πορεύεσθαι, πᾶν τὸ παρατιθέμενον ὑμῖν ἐσθίετε μηδὲν ἀνακρίνοντες διὰ τὴν συνείδησιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/027.yaml
  text: If one of the unbelievers invites you and you want to go[a], eat whatever is set before you[b], asking no questions for the sake of conscience.
translation:
  language: tl
  text: Kung anyayahan kayo ng isa sa mga hindi sumasampalataya at gusto ninyong pumunta, kainin ninyo ang anumang ihain sa inyo nang hindi nag-uusisa[a], alang-alang sa budhi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “nang walang sinisiyasat” o “nang hindi nagtatanong.” Ang diwa ay huwag siyasatin ang pinagmulan ng pagkain.
    reason: lexical_alternative
  - marker: b
    text: Nililinaw sa kasunod na talata ang tungkol sa “budhi,” kung saan ipinag-iiba ni Pablo ang budhi ng ibang tao at ang sariling budhi.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπίστων
  choice: hindi sumasampalataya
  rationale: Likas at malinaw sa makabagong Filipino bilang pagtukoy sa taong wala sa pananampalatayang Kristiyano, nang hindi nagdaragdag ng mapanlibak na himig.
- source_word: καλεῖ
  choice: anyayahan
  rationale: Sa konteksto ng pagkain, ang kahulugan ay pag-anyaya, hindi simpleng pagtawag.
- source_word: θέλετε πορεύεσθαι
  choice: gusto ninyong pumunta
  rationale: Natural na Filipino na nagpapanatili sa kusang pagnanais o pagpayag na tanggapin ang paanyaya.
- source_word: πᾶν τὸ παρατιθέμενον ὑμῖν
  choice: ang anumang ihain sa inyo
  rationale: Malinaw na tumutukoy sa anumang pagkaing inihahain sa hapag at natural kaysa sa sobrang literal na 'lahat ng inilalagay sa harap ninyo.'
- source_word: ἐσθίετε
  choice: kainin ninyo
  rationale: Tuwirang pautos na angkop sa pangkalahatang tagubilin ng talata.
- source_word: μηδὲν ἀνακρίνοντες
  choice: nang hindi nagtatanong tungkol dito
  rationale: Ipinahahayag ang diwa ng hindi pagsisiyasat o pagtatanong tungkol sa pinagmulan ng pagkain, habang iniiwasang magdagdag ng impormasyong hindi tahasang nasa teksto.
- source_word: διὰ τὴν συνείδησιν
  choice: alang-alang sa budhi
  rationale: Pinananatili ang maikli at sadyang hindi pa tiyak na pagtukoy sa budhi, na nililinaw sa kasunod na talata.
theological_decisions:
- issue: Kung kaninong budhi ang tinutukoy ng συνείδησις
  choice: Hindi tinukoy sa pangunahing teksto; isinaling pangkalahatan bilang 'budhi.'
  alternative: Tahasang tukuyin bilang sariling budhi ng mananampalataya o budhi ng ibang tao.
  rationale: Hindi tahasang tinutukoy ng talatang ito kung kaninong budhi iyon; ang kasunod na talata ang nagbibigay ng paglilinaw. Pinananatili rito ang tunay na ambiguity ng Griyego.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang magalang na pangmaramihang 'kayo/ninyo' at ang karaniwang salitang 'budhi.'
