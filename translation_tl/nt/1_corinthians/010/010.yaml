id: 1CO.10.10
reference: 1 Corinthians 10:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: μηδὲ γογγύζετε, ⸀καθάπερ τινὲς αὐτῶν ἐγόγγυσαν, καὶ ἀπώλοντο ὑπὸ τοῦ ὀλοθρευτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/010.yaml
  text: And do not grumble[a], just as some of them grumbled and were destroyed by the destroyer.
translation:
  language: tl
  text: Huwag din kayong magreklamo, gaya ng ilan sa kanila na nagreklamo at pinuksa ng tagapuksa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang anghel na tagapuksa.” Sa Griyego, “ang tagapuksa” ang nakasulat; maaaring tumutukoy ito sa tagapagpatupad ng paghatol sa Israel.
    reason: alternative_reading
lexical_decisions:
- source_word: μηδὲ
  choice: Huwag din
  rationale: Ipinagdurugtong nito ang utos sa naunang serye ng mga babala at pagbabawal. Likas sa modernong Tagalog ang “Huwag din” at napapanatili nito ang puwersa ng pang-ugnay.
- source_word: γογγύζετε
  choice: kayong magreklamo
  rationale: Ang “magreklamo” ay malinaw at kasalukuyang salitang tumutukoy sa pagpapahayag ng kawalang-kasiyahan. Higit itong madaling maunawaan kaysa sa tradisyonal ngunit di-gaanong karaniwang “magbulung-bulungan.”
- source_word: καθάπερ
  choice: gaya ng
  rationale: Malinaw nitong ipinakikita na ang nangyari sa ilang Israelita ay halimbawang babala para sa mga mambabasa.
- source_word: τινὲς αὐτῶν
  choice: ilan sa kanila
  rationale: Tuwirang inilalarawan nito ang ilan mula sa pangkat ng mga Israelitang tinutukoy sa konteksto.
- source_word: ἐγόγγυσαν
  choice: nagreklamo
  rationale: Ginamit ang parehong salitang-ugat gaya sa unang pandiwa upang mapanatili ang sinadyang pag-uulit ng Griyego.
- source_word: ἀπώλοντο
  choice: pinuksa
  rationale: Ang anyo at kasunod na pariralang nagsasaad ng gumagawa ay nagpapahiwatig na sumapit sa kanila ang pagkawasak mula sa isang panlabas na tagapagpasapit nito. Ang “pinuksa” ay maikli, matindi, at akma sa “tagapuksa.”
- source_word: ὑπὸ τοῦ ὀλοθρευτοῦ
  choice: ng tagapuksa
  rationale: Ang Griyego ay gumagamit ng pangngalang pantukoy na “ang tagapuksa,” hindi tahasang “anghel.” Pinananatili ng saling ito ang katawagan nang hindi dinaragdagan ang pagkakakilanlan ng gumagawa.
theological_decisions:
- issue: Pagkakakilanlan ng ὁ ὀλοθρευτής
  choice: ang tagapuksa
  alternative: ang anghel na tagapuksa
  rationale: Hindi tahasang tinatawag ng Griyego na anghel ang tagapuksa. Kaya pinananatili sa pangunahing teksto ang mas di-tiyak na katawagan, samantalang inilalagay sa talababa ang posibleng pagpapakahulugan batay sa mga salaysay ng paghatol sa Israel.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Iniwasan ang makalumang “magbulung-bulungan,” at pinanatili ang matinding ugnayan ng “pinuksa” at “tagapuksa.”
