  text: ἢ παραζηλοῦμεν τὸν κύριον; μὴ ἰσχυρότεροι αὐτοῦ ἐσμεν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/022.yaml
  text: Or are we provoking the Lord to jealousy? Surely we are not stronger than he is, are we?
translation:
  language: tl
  text: O pinupukaw ba natin ang paninibugho ng Panginoon? Hindi naman tayo mas malakas kaysa sa kanya, hindi ba?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραζηλοῦμεν
  choice: pinupukaw ba natin ang paninibugho
  rationale: Ipinahahayag ang diwa ng pag-uudyok sa Panginoon na magselos o manibugho, habang pinananatili ang retorikal na tanong.
- source_word: τὸν κύριον
  choice: ang Panginoon
  rationale: Karaniwan, marangal, at kontekstuwal na salin ng κύριος.
- source_word: ἰσχυρότεροι αὐτοῦ
  choice: mas malakas kaysa sa kanya
  rationale: Tuwirang paghahambing na likas sa modernong Tagalog at tapat sa comparative na ἰσχυρότεροι.
theological_decisions:
- issue: Ang paninibugho ng Panginoon
  choice: Pinanatili ang paninibugho bilang katangian ng tugon ng Panginoon sa pagtataksil o karibal na pagsamba.
  alternative: Galitin ang Panginoon
  rationale: Mas tiyak ang παραζηλόω kaysa sa pangkalahatang 'galitin' at mahalaga ito sa konteksto ng pakikibahagi sa idolatriya.
- issue: Lakas ng ikalawang retorikal na tanong
  choice: Hindi naman tayo mas malakas kaysa sa kanya, hindi ba?
  alternative: Tiyak na hindi tayo mas malakas kaysa sa kanya, hindi ba?
  rationale: Ipinahihiwatig ng μή ang inaasahang sagot na hindi; ang 'naman' at hulaping 'hindi ba?' ay natural na naghahatid nito nang hindi nagdaragdag ng tahasang salitang wala sa Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Pinanatili ang dalawang retorikal na tanong at ang tensiyong likha ng babala.
