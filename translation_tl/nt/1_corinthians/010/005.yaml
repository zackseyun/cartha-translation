  text: Nevertheless[a], God was not pleased with most of them, for they were struck down in the wilderness.
translation:
  language: tl
  text: Gayunman, hindi kinalugdan ng Diyos ang karamihan sa kanila, sapagkat nakahandusay sila[a] sa ilang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nabuwal” o “ibinuwal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Gayunman
  rationale: Malinaw na ipinakikita ang matinding pagsalungat sa mga pribilehiyong binanggit sa naunang mga talata, at natural ito sa makabagong Tagalog.
- source_word: οὐκ ἐν τοῖς πλείοσιν αὐτῶν ηὐδόκησεν ὁ θεός
  choice: hindi kinalugdan ng Diyos ang karamihan sa kanila
  rationale: Natural na inililipat sa Tagalog ang idyomatikong gamit ng εὐδοκέω na may ἐν, habang pinananatili ang dami na tinutukoy ng τοῖς πλείοσιν.
- source_word: κατεστρώθησαν
  choice: nabuwal sila
  rationale: Ipinahihiwatig ang pagkamatay at pagkalugmok ng mga Israelita sa paghatol, habang pinananatili ang konkretong larawan ng mga katawang nakahandusay sa ilang at hindi labis na tinutukoy ang sanhi.
- source_word: γὰρ
  choice: kaya
  rationale: Sa Tagalog, natural na inihahayag ang paliwanag bilang bunga o patunay ng hindi pagkalugod ng Diyos; pinananatili nito ang lohikal na ugnayan sa pangungusap.
- source_word: ἐν τῇ ἐρήμῳ
  choice: sa ilang
  rationale: Ang “ilang” ay maikli, dignified, at tradisyonal ngunit nauunawaang katumbas ng ilang na dinaanan ng Israel.
theological_decisions:
- issue: Kalikasan ng paghatol na inilalarawan ng κατεστρώθησαν
  choice: Ang karamihan sa mga Israelita ay nabuwal at namatay sa ilang sa konteksto ng paghatol ng Diyos.
  alternative: Ang kanilang mga katawan ay basta nakahandusay o nakakalat sa ilang, nang hindi itinatampok ang paghatol.
  rationale: Ipinakikita ng konteksto ang babala mula sa sinapit ng Israel. Ang “nabuwal” ay nagpapanatili sa larawan at bigat ng kamatayan nang hindi nagdaragdag ng paraang hindi tahasang sinabi ng teksto.
translation_notes:
  register: Makabago, natural, at marangal na Tagalog. Ginamit ang “kinalugdan” upang ipahayag ang pagkalugod o pagsang-ayon ng Diyos, at “sa ilang” upang mapanatili ang biblikal na tagpuan nang hindi maging mabigat ang pananalita.
