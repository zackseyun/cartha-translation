id: 1CO.10.6
reference: 1 Corinthians 10:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ταῦτα δὲ τύποι ἡμῶν ἐγενήθησαν, εἰς τὸ μὴ εἶναι ἡμᾶς ἐπιθυμητὰς κακῶν, καθὼς κἀκεῖνοι ἐπεθύμησαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/006.yaml
  text: These things became examples for us[a], so that we might not be people who desire evil things, just as they also desired them.
translation:
  language: tl
  text: Ang mga bagay na ito ay naging mga halimbawa para sa atin[a], upang hindi tayo maging mga taong naghahangad ng masasamang bagay, kung paanong naghangad din sila ng masasamang bagay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga tipo para sa atin” o “mga huwaran para sa atin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: Ang mga bagay na ito
  rationale: Tumutukoy sa mga pangyayari sa ilang na kababanggit lamang; pinananatili ang malawak na demonstratibong pananalita nang hindi dinaragdagan ang interpretasyon.
- source_word: δὲ
  choice: hindi isinalin nang hiwalay
  rationale: Mahinang panandang diskurso ito na likas nang naipahihiwatig ng daloy sa Filipino; ang tahasang “ngayon” o “ngunit” ay maaaring magdagdag ng di-kailangang temporal o panalungat na diin.
- source_word: τύποι
  choice: mga halimbawa
  rationale: Sa kontekstong mapagbabala, malinaw nitong ipinahahayag na ang mga naunang pangyayari ay mga huwarang nagbibigay-aral, habang inilalagay sa talababa ang mas literal na “mga tipo” at ang “mga huwaran.”
- source_word: ἡμῶν
  choice: para sa atin
  rationale: 'Likas na Filipino para sa kaugnayang ipinahahayag ng genitive: ang mga halimbawa ay may kabuluhan at aral para sa pamayanang kinakausap.'
- source_word: ἐγενήθησαν
  choice: naging
  rationale: Pinananatili ang diwa ng pagdating o pagkakaroon ng tungkuling maging halimbawa, sa halip na simpleng “ay.”
- source_word: εἰς τὸ μὴ εἶναι
  choice: upang hindi tayo maging
  rationale: Pinananatili ang anyong may εἶναι at ang layunin o nilalayong bunga ng mga halimbawang ito.
- source_word: ἐπιθυμητὰς
  choice: mga taong naghahangad
  rationale: Isinasalin ang pangngalang tumutukoy sa mga taong may paghahangad; mas natural ito kaysa sa artipisyal na “mga tagapagnasa” at hindi nililimitahan sa seksuwal na pagnanasa.
- source_word: κακῶν
  choice: ng masasamang bagay
  rationale: Ipinakikita bilang layon ng paghahangad at pinananatili ang moral na bigat ng κακός.
- source_word: καθὼς
  choice: gaya ng
  rationale: Likas na nagpapakilala sa paghahambing sa salinlahing nasa ilang.
- source_word: κἀκεῖνοι
  choice: nila
  rationale: Naipapaloob sa panghalip ang pagtukoy sa mga taong iyon; ang dagdag na diwa ng καί ay sapat nang nahahayag ng paghahambing sa Filipino.
- source_word: ἐπεθύμησαν
  choice: paghahangad
  rationale: Inuulit ang ugat na “hangad” upang mapanatili ang leksikal na ugnayan sa ἐπιθυμητάς; nauunawaan mula sa naunang parirala na masasamang bagay ang hinangad nila.
theological_decisions:
- issue: Kahulugan ng τύποι kaugnay ng mga karanasan ng Israel sa ilang
  choice: mga halimbawa
  alternative: mga tipo; mga huwaran
  rationale: Ang agarang konteksto ay moral na babala at pagtuturo. Ang “mga halimbawa” ay nagpapanatili ng puwersang ito nang hindi ipinapasok ang isang makitid o teknikal na sistemang tipolohikal; ang tunay na lawak ng salita ay kinikilala sa talababa.
- issue: Lakas at saklaw ng ἐπιθυμητάς / ἐπεθύμησαν
  choice: mga taong naghahangad / paghahangad
  alternative: mga taong nananabik; mga taong nag-iimbot
  rationale: Malawak ang tinutukoy na makasalanang pagnanasa, hindi lamang seksuwal na pagnanasa o pag-iimbot sa pag-aari. Ang “naghahangad” ay nagpapanatili ng saklaw at ng pag-uulit ng salitang-ugat.
- issue: Layunin o bunga sa εἰς τὸ μὴ εἶναι
  choice: upang
  alternative: kaya hindi dapat; na ang bunga ay hindi
  rationale: Ang konstruksyon ay maaaring magtaglay ng layunin at bunga. Ang “upang” ay natural sa Filipino at hindi labis na nagpapaliwanag sa ugnayan.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Pinanatili ang bahagyang pormal na “naging mga halimbawa” at ang tahasang “mga taong naghahangad” upang katawanin ang anyong pangngalan ng Griyego, nang hindi nagiging artipisyal. Ang marker na [a] ay inilagay kaagad pagkatapos ng pariralang tinutukoy nito.
