id: 1CO.10.11
reference: 1 Corinthians 10:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ταῦτα ⸀δὲ ⸂τυπικῶς συνέβαινεν⸃ ἐκείνοις, ἐγράφη δὲ πρὸς νουθεσίαν ἡμῶν, εἰς οὓς τὰ τέλη τῶν αἰώνων ⸀κατήντηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/011.yaml
  text: These things happened to them as examples[a], but they were written for our instruction[c][b], on whom the ends of the ages have come.
translation:
  language: tl
  text: Nangyari sa kanila ang mga bagay na ito bilang mga halimbawa[a], ngunit isinulat ang mga iyon upang tayo'y maturuan[b]—tayong dinatnan ng mga wakas ng mga panahon.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bilang mga huwaran” o “sa paraang tipolohikal”; inilalahad ni Pablo ang mga pangyayaring ito bilang mga padron na may aral para sa mga sumunod na mananampalataya.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “upang tayo'y paalalahanan” o “upang tayo'y bigyang-babala”; kasama sa salitang Griyego ang pagtuturong nagwawasto at nagbababala.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “ang wakas ng mga panahon ay dumating.” Maramihan sa Griyego ang literal na “mga wakas ng mga panahon,” kaya pinananatili rito ang natatanging pananalita ni Pablo tungkol sa kasaysayan ng pagliligtas.
    reason: alternative_reading
lexical_decisions:
- source_word: τυπικῶς
  choice: bilang mga halimbawa
  rationale: Ipinahihiwatig ng pang-abay na ang mga pangyayari ay nagsisilbing mga huwaran o padron na may aral para sa mga sumunod na mananampalataya. Likas at malinaw sa modernong Tagalog ang “bilang mga halimbawa,” samantalang mas teknikal ang “bilang mga tipo” o “tipolohikal.”
- source_word: συνέβαινεν
  choice: nangyari
  rationale: Tumutukoy ito sa mga naganap sa salinlahing nasa ilang. Bagaman imperfect ang anyo, sapat na naipahahayag ng payak na “nangyari” at ng maramihang simuno ang sunod-sunod na mga pangyayari.
- source_word: ἐκείνοις
  choice: sa kanila
  rationale: Ang panghalip na datibo ay tumutukoy sa naunang binanggit na salinlahi sa ilang; natural at tumpak ang “sa kanila.”
- source_word: ἐγράφη
  choice: isinulat ang mga iyon
  rationale: Bagaman isahan ang pandiwang Griyego, tumutukoy ito sa nakasulat na salaysay ng mga pangyayaring binanggit. Iniiwasan ng “ang mga iyon” ang malabong walang simunong pagkakasunod at nananatiling natural sa Tagalog.
- source_word: πρὸς νουθεσίαν ἡμῶν
  choice: upang tayo'y maturuan
  rationale: Saklaw ng νουθεσία ang pagtuturong may pagwawasto at babala. Madaling maunawaan ang “maturuan,” habang ipinapaliwanag sa talababa ang mas matinding diwa ng salita.
- source_word: εἰς οὓς
  choice: tayong dinatnan
  rationale: Naipahahayag nito ang direksiyon at pagdating ng eskatolohikal na realidad sa mga taong tinutukoy, nang natural sa Tagalog.
- source_word: τὰ τέλη τῶν αἰώνων
  choice: ang mga wakas ng mga panahon
  rationale: Pinananatili ang kapansin-pansing maramihan ng parehong τέλη at αἰώνων upang hindi pakinisin o lutasin ang tensiyong pangkasaysayan ng pagliligtas sa pananalita ni Pablo.
- source_word: κατήντηκεν
  choice: dinatnan
  rationale: Ipinahahayag ng anyong perfect ang pagdating na naganap na at may patuloy na kaugnayan sa kasalukuyan. Sa konstruksiyong “tayong dinatnan,” likas itong pakinggan sa Tagalog.
theological_decisions:
- issue: Ang pahayag ni Pablo na τὰ τέλη τῶν αἰώνων
  choice: ang mga wakas ng mga panahon
  alternative: ang wakas ng mga panahon; ang kaganapan ng mga panahon
  rationale: Pinananatili ng salin ang maramihang pananalita at ang eskatolohikal na tensiyon ng Griyego sa halip na gawing iisang “wakas” o ipakahulugang “kaganapan.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “tayo'y” para sa maayos at bahagyang pormal na daloy; iniwasan ang teknikal na “tipolohikal” sa pangunahing teksto ngunit pinanatili ito bilang paliwanag sa talababa.
