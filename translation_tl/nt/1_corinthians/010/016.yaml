id: 1CO.10.16
reference: 1 Corinthians 10:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τὸ ποτήριον τῆς εὐλογίας ὃ εὐλογοῦμεν, οὐχὶ κοινωνία ⸂ἐστὶν τοῦ αἵματος τοῦ Χριστοῦ⸃; τὸν ἄρτον ὃν κλῶμεν, οὐχὶ κοινωνία τοῦ σώματος τοῦ Χριστοῦ ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/016.yaml
  text: The cup of blessing that we bless—is it not a sharing in the blood of Messiah? The bread that we break—is it not a sharing in the body of Messiah?[a][b]
translation:
  language: tl
  text: Ang kopa ng pagpapala na binabasbasan natin—hindi ba ito pakikibahagi sa dugo ng Mesiyas? Ang tinapay na ating pinipira-piraso—hindi ba ito pakikibahagi sa katawan ng Mesiyas?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pakikilahok sa”; ayon sa nakaugaliang salin, “pakikiisa sa.”
    reason: lexical_alternative
  - marker: b
    text: Griyego “Christou”; isinaling “Mesiyas” dito sapagkat ginagamit ang Χριστός bilang titulo. Ayon sa nakaugaliang salin, “Kristo.”
    reason: alternative_reading
lexical_decisions:
- source_word: ποτήριον
  choice: kopa
  rationale: Ang “kopa” ay malinaw at natural sa modernong Filipino at hindi nagdadala ng mas makaluma o espesyalisadong himig ng “saro” o “kalis.”
- source_word: τῆς εὐλογίας
  choice: ng pagpapala
  rationale: Tuwirang pinananatili nito ang εὐλογία bilang “pagpapala,” nang hindi nililimitahan ang parirala sa pagpapasalamat lamang.
- source_word: ὃ εὐλογοῦμεν
  choice: na ating pinagpapala
  rationale: Pinananatili nito ang pag-uulit ng magkaugnay na εὐλογία at εὐλογοῦμεν at hindi labis na tinutukoy kung paano isinasagawa ang pagpapala.
- source_word: οὐχὶ
  choice: hindi ba ito
  rationale: Pinananatili ang anyo ng retorikal na tanong na umaasa ng positibong sagot.
- source_word: κοινωνία
  choice: pakikibahagi sa
  rationale: Ipinahahayag nito ang tunay na paglahok o pakikibahagi nang hindi agad ipinapasok ang isang teknikal at denominasyonal na pagkaunawa sa sakramento.
- source_word: τοῦ αἵματος
  choice: sa dugo
  rationale: Tuwirang salin na nagpapanatili sa bigat na tipanan at paghahain ng larawan ng dugo.
- source_word: τοῦ Χριστοῦ
  choice: ng Mesiyas
  rationale: Dito ay nananatiling buhay ang Χριστός bilang titulo ng Pinahiran, kaya “Mesiyas” ang ginamit; inilagay sa talababa ang tradisyonal na “Kristo.”
- source_word: ἄρτον
  choice: tinapay
  rationale: Ito ang karaniwan at sapat na katumbas; hindi kinakailangang tukuyin sa talatang ito na isang buong limpak o loaf ang tinutukoy.
- source_word: ὃν κλῶμεν
  choice: na ating pinipira-piraso
  rationale: Natural nitong inilalarawan ang konkretong kilos ng pagputol o pagbasag ng tinapay nang hindi dinaragdagan ang kahulugan.
- source_word: τοῦ σώματος
  choice: sa katawan
  rationale: Tuwirang pinananatili ang cristolohikal at sakramental na bigat ng parirala nang hindi nilulutas ang paraan ng ugnayang ipinahahayag.
theological_decisions:
- issue: Kahulugan ng κοινωνία sa kontekstong sakramental
  choice: pakikibahagi sa
  alternative: pakikilahok sa; pakikiisa sa
  rationale: Ipinakikita ng talata ang tunay na pakikibahagi sa dugo at katawan ng Mesiyas, ngunit hindi nito sa salin pa lamang nilulutas ang mga pagtatalo tungkol sa paraan ng presensiya sa hapunan.
- issue: Paglalapat ng Χριστός bilang titulo
  choice: Mesiyas
  alternative: Kristo
  rationale: Sa pariralang tumutukoy sa dugo at katawan ng Χριστός, nananatiling makahulugan ang titulo ng Pinahiran; pinananatili rin ang nakaugaliang anyo bilang alternatibo.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang retorikal na paralelismo at ang pag-uulit ng “pagpapala/pinagpapala.” Iniwasan ang “kalIs” at iba pang salitang maaaring magpasok ng mas tiyak na liturhikal o denominasyonal na himig.
