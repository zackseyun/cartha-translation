reference: 1 Corinthians 10:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: μηδὲ εἰδωλολάτραι γίνεσθε, καθώς τινες αὐτῶν· ὥσπερ γέγραπται· Ἐκάθισεν ὁ λαὸς φαγεῖν καὶ πεῖν, καὶ ἀνέστησαν παίζειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/007.yaml
  text: Do not become idolaters[a], as some of them were; just as it is written, “The people sat down to eat and drink, and rose up to play.”
translation:
  language: tl
  text: Huwag din kayong maging mga sumasamba sa diyus-diyosan, gaya ng ilan sa kanila; gaya ng nasusulat, “Umupo ang mga tao upang kumain at uminom, at tumayo sila upang maglaro[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “magpakasaya” o “magdiwang.” Ang sipi ay mula sa Exodo 32:6, kung saan ang “paglalaro” ay kaugnay ng piging ng Israel sa paligid ng gintong guya.
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲ
  choice: Huwag din
  rationale: Ipinagpapatuloy nito ang magkakaugnay na mga pagbabawal sa konteksto; likas sa Tagalog ang “Huwag din” at naipapakita nito ang dugtong na diwa ng μηδέ.
- source_word: εἰδωλολάτραι
  choice: mga sumasamba sa diyus-diyosan
  rationale: Mas malinaw at karaniwan sa modernong Tagalog kaysa sa teknikal na “mga idolatro,” habang tumpak na tumutukoy sa mga nagsasagawa ng pagsamba sa mga diyus-diyosan.
- source_word: γίνεσθε
  choice: maging
  rationale: Pinananatili ng “maging” ang diwa ng pagpasok o pagkahulog sa gayong kalagayan o gawain, hindi lamang ang pananatili rito.
- source_word: καθώς τινες αὐτῶν
  choice: gaya ng ilan sa kanila
  rationale: Likas na paghahambing ito sa Tagalog at hindi na kailangang ulitin ang pandiwang “naging,” na nauunawaan mula sa pangunahing sugnay.
- source_word: ὥσπερ γέγραπται
  choice: Gaya ng nasusulat
  rationale: Karaniwan at marangal na pormula sa pagsipi ng Kasulatan; naipahihiwatig ng “nasusulat” ang nananatiling bisa ng nakasulat.
- source_word: Ἐκάθισεν ὁ λαὸς
  choice: Umupo ang mga tao
  rationale: Tuwirang inilalarawan ang kolektibong λαός sa natural na salaysay na Tagalog.
- source_word: φαγεῖν καὶ πεῖν
  choice: upang kumain at uminom
  rationale: Tumpak na inililipat ang layon ng pag-upo na ipinahahayag ng dalawang infinitive.
- source_word: ἀνέστησαν
  choice: tumayo sila
  rationale: Natural na katumbas ng pagbangon mula sa pagkakaupo at pinananatili ang galaw ng salaysay.
- source_word: παίζειν
  choice: upang maglaro
  rationale: Pinananatili ang pangunahing leksikal na diwa at ang sadyang kaluwagan ng salitang Griyego; ang mas kontekstuwal na kahulugang masayang pagdiriwang ay inilalagay sa talababa.
theological_decisions:
- issue: Gaano kalinaw na ipapakita sa παίζειν ang konteksto ng Exodo 32 at ng pagsamba sa gintong guya
  choice: Panatilihin sa pangunahing teksto ang “maglaro,” at ipaliwanag sa talababa ang posibleng diwa ng magulong o masayang pagdiriwang.
  alternative: “magpakasaya” o “magdiwang nang magulo”
  rationale: Maaaring mangahulugan ang παίζειν ng paglalaro, ngunit sa Exodo 32:6 kaugnay ito ng piging para sa diyus-diyosan. Ang mas literal na pangunahing teksto ay nagpapanatili ng tunay na kaluwagan ng salita, samantalang inilalantad ng talababa ang puwersa ng konteksto nang hindi ito ipinipilit sa salin.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang karaniwang pariralang “sumasamba sa diyus-diyosan” sa halip na teknikal o hindi gaanong pamilyar na katawagan. Pinanatili sa sipi ang payak na salaysay at ang leksikal na kaluwagan ng παίζειν.
