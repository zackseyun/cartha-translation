revisions:
- from: Walang tuksong dumating sa inyo maliban sa karaniwang nararanasan ng tao.[a] Ngunit tapat ang Diyos. Hindi niya hahayaang tuksuhin kayo nang higit sa inyong makakaya; sa halip, kasabay ng tukso ay ilalaan din niya ang daang malalabasan,[b][c] upang makayanan ninyo itong tiisin.
  to: Walang tukso ang dumating sa inyo maliban sa karaniwang nararanasan ng tao.[a] Ngunit tapat ang Diyos. Hindi niya hahayaang tuksuhin kayo nang higit sa inyong makakaya; sa halip, kasabay ng tukso ay maglalaan din siya ng daan palabas,[b][c] upang makayanan ninyong tiisin ito.
