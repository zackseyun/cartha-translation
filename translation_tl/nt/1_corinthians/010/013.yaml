id: 1CO.10.13
reference: 1 Corinthians 10:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πειρασμὸς ὑμᾶς οὐκ εἴληφεν εἰ μὴ ἀνθρώπινος· πιστὸς δὲ ὁ θεός, ὃς οὐκ ἐάσει ὑμᾶς πειρασθῆναι ὑπὲρ ὃ δύνασθε, ἀλλὰ ποιήσει σὺν τῷ πειρασμῷ καὶ τὴν ἔκβασιν τοῦ ⸀δύνασθαι ὑπενεγκεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/013.yaml
  text: No temptation has overtaken you except what is common to man[a]. But God is faithful, who will not allow you to be tempted beyond what you are able, but with the temptation will also provide the way out[c][b], so that you may be able to endure it.
translation:
  language: tl
  text: Walang tukso ang dumating sa inyo maliban sa karaniwang nararanasan ng tao.[a] Ngunit tapat ang Diyos. Hindi niya hahayaang tuksuhin kayo nang higit sa inyong makakaya; sa halip, kasabay ng tukso ay maglalaan din siya ng daan palabas,[b][c] upang makayanan ninyong tiisin ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “maliban sa bagay na pantao” o “maliban sa karaniwan sa sangkatauhan.”
    reason: lexical_alternative
  - marker: b
    text: Ang mga salitang isinaling “tukso” at “tuksuhin” ay maaari ring isaling “pagsubok” at “subukin” sa talatang ito.
    reason: lexical_alternative
  - marker: c
    text: O “ang pagtakas” o “ang kinalabasan.” Binibigyang-diin ng parirala ang paglalaan ng Diyos na nagbibigay-kakayahang magtiis.
    reason: lexical_alternative
lexical_decisions:
- source_word: πειρασμός / πειρασθῆναι
  choice: tukso / tuksuhin
  rationale: Saklaw ng mga salitang Griyego ang tukso, pagsubok, o matinding pagsubok. Dahil nagbababala ang konteksto laban sa masasamang pagnanasa at idolatriya, pangunahing ginamit ang moral na diwang “tukso,” habang pinanatili sa talababa ang “pagsubok.”
- source_word: εἴληφεν
  choice: dumating sa inyo
  rationale: Ipinahihiwatig ng perpektong anyo na ang tukso ay sumapit o nakaranas na silang sakmalin. Ang “dumating sa inyo” ay natural sa modernong Tagalog nang hindi labis na pinatitindi ang larawan.
- source_word: εἰ μὴ ἀνθρώπινος
  choice: maliban sa karaniwang nararanasan ng tao
  rationale: Ang ἀνθρώπινος ay tumutukoy sa bagay na pantao o karaniwan sa sangkatauhan. Malinaw sa saling ito na hindi natatangi o higit-sa-tao ang kanilang karanasan.
- source_word: πιστός
  choice: tapat
  rationale: Ang “tapat” ay likas at marangal na katumbas na nagpapahayag ng pagiging maaasahan ng Diyos.
- source_word: οὐκ ἐάσει
  choice: Hindi niya hahayaang
  rationale: Tuwirang ipinapahayag nito na hindi pahihintulutan ng Diyos ang tukso nang lampas sa itinakdang hangganan.
- source_word: ὑπὲρ ὃ δύνασθε
  choice: nang higit sa inyong makakaya
  rationale: Pinananatili nito ang diwa ng kakayahan sa δύνασθε at natural itong pakinggan sa Tagalog.
- source_word: ποιήσει
  choice: ilalaan
  rationale: Bagaman literal na “gagawa,” sa kaugnayan nito sa ἔκβασις ay tumutukoy ito sa aktibong paglalaan ng Diyos.
- source_word: σὺν τῷ πειρασμῷ
  choice: kasabay ng tukso
  rationale: 'Pinananatili ng “kasabay” ang ideya ng accompaniment: ang paglalaan ng Diyos ay kaakibat ng tukso, hindi lamang kasunod nito.'
- source_word: ἔκβασιν
  choice: daang malalabasan
  rationale: Ipinahihiwatig ng ἔκβασις ang paglabas, pagtakas, o kinalabasan. Ang “daang malalabasan” ay natural at hindi nangangahulugang basta aalisin agad ang tukso.
- source_word: τοῦ δύνασθαι ὑπενεγκεῖν
  choice: upang makayanan ninyo itong tiisin
  rationale: 'Ipinakikita ng sugnay ang layunin o bunga: ang inilaan ng Diyos ay nagbibigay-kakayahang manatiling matatag sa ilalim ng tukso.'
theological_decisions:
- issue: Saklaw ng πειρασμός/πειρασθῆναι at ang katapatan ng Diyos
  choice: Ginamit ang “tukso/tuksuhin,” na may “pagsubok/subukin” bilang alternatibo sa talababa.
  alternative: pagsubok / subukin
  rationale: Pinapaboran ng konteksto ang moral na tukso, ngunit hindi isinasara ng Griyego ang mas malawak na diwa ng pagsubok. Hindi rin ipinahihiwatig ng salin na ang Diyos ang nang-uudyok sa kasamaan; ang tahasang sinasabi ng talata ay nililimitahan niya ang karanasan at naglalaan siya ng ikatatagal.
- issue: Ugnayan ng “daang malalabasan” at pagtitiis
  choice: Isinaling paraan ng paglabas na nagbibigay-kakayahang magtiis, hindi bilang pangakong agarang pag-aalis ng tukso.
  alternative: ang pagtakas; ang kinalabasan
  rationale: Iniuugnay mismo ng pangwakas na sugnay ang ἔκβασις sa kakayahang magtiis. Kaya pinananatili ang tensiyon sa pagitan ng paglabas at pagtitiis sa halip na ipakahulugang tiyak na agarang paglaya.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “ninyo/kayo” para sa maramihang kausap. Iniwasan ang teknikal o denominasyonal na pananalita. Ang mga marker na [a], [b], at [c] ay lahat nakalagay sa pangunahing teksto.
