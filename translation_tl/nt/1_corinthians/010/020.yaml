id: 1CO.10.20
reference: 1 Corinthians 10:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀλλ’ ὅτι ἃ ⸀θύουσιν, δαιμονίοις ⸂καὶ οὐ θεῷ θύουσιν⸃, οὐ θέλω δὲ ὑμᾶς κοινωνοὺς τῶν δαιμονίων γίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/020.yaml
  text: No[a], but what they sacrifice, they sacrifice to demons and not to God, and I do not want you to become sharers with demons.
translation:
  language: tl
  text: Hindi; sa halip, ang kanilang inihahandog ay inihahandog nila sa mga demonyo at hindi sa Diyos, at ayaw kong maging mga kabahagi kayo ng mga demonyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “maging mga kasalo kayo ng mga demonyo” o “makibahagi kayo sa mga demonyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’ ὅτι
  choice: Hindi. Sa halip,
  rationale: Ipinahihiwatig ng parirala ang pagtutuwid sa maaaring maling pagkaunawa mula sa naunang talata. Likas sa modernong Tagalog ang “Hindi. Sa halip,” at malinaw nitong naipapakita ang salungat na punto.
- source_word: ἃ θύουσιν
  choice: ang inihahandog nila
  rationale: Tumutukoy ang panghalip na neuter sa anumang iniaalay bilang handog; hindi na kailangang dagdagan ng mas tiyak na bagay na wala sa Griyego.
- source_word: θύουσιν
  choice: inihahandog
  rationale: Sa kontekstong panrelihiyon, ang θύω ay tumutukoy sa paghahandog bilang sakripisyo. Pinananatili ng “inihahandog” ang rituwal na diwa sa natural na Tagalog.
- source_word: δαιμονίοις
  choice: sa mga demonyo
  rationale: Sa gamit ng Bagong Tipan, tumutukoy ang δαιμόνιον sa mga demonyo, hindi sa mga neutral na mabababang diyos o espiritu.
- source_word: καὶ οὐ θεῷ
  choice: at hindi sa Diyos
  rationale: Malinaw sa konteksto ang pagtatambis sa mga demonyo at sa tunay na Diyos; kaya tiyak na “Diyos,” hindi “isang diyos,” ang nararapat.
- source_word: οὐ θέλω δὲ
  choice: at ayaw kong
  rationale: Ang δέ ay banayad na nagdurugtong at nagpapasulong sa pahayag. Natural sa Tagalog ang “at ayaw kong” nang hindi pinalalakas nang labis ang pagsalungat.
- source_word: κοινωνοὺς
  choice: kabahagi
  rationale: Ipinahihiwatig ng κοινωνός ang aktuwal na pakikibahagi o pakikipag-ugnayan. Ang “kabahagi” ay malinaw at marangal, at umaangkop sa argumento tungkol sa pakikibahagi sa mga talata 16–18.
- source_word: τῶν δαιμονίων
  choice: ng mga demonyo
  rationale: Pagkatapos ng “kabahagi,” natural na ipinapahayag sa Tagalog ng pariralang “ng mga demonyo” ang pakikibahaging kasama o kaugnay ng mga demonyo, hindi ang pag-aari nila.
- source_word: γίνεσθαι
  choice: maging
  rationale: Ipinapakita ng γίνομαι ang pagpasok sa isang kalagayan. Ang “maging” ay natural na Tagalog at pinananatili ang babala laban sa pagkakaroon ng gayong pakikibahagi.
theological_decisions:
- issue: Kalikasan ng paganong paghahandog
  choice: Tuwirang sinasabi na ang mga paganong handog ay inihahandog sa mga demonyo at hindi sa Diyos.
  alternative: Ituring ito bilang retorika lamang tungkol sa panlipunang kahulugan ng mga piging sa templo o bilang talinghaga lamang para sa mga huwad na diyos.
  rationale: Dapat panatilihin nang hindi pinahihina ang tahasang pagtatambis na “sa mga demonyo at hindi sa Diyos,” ngunit hindi rin dapat magdagdag ng paliwanag na lampas sa sinasabi ng talata.
- issue: Diwa ng κοινωνοὺς τῶν δαιμονίων
  choice: Tunay na pakikibahagi o kaugnayan sa mga demonyo.
  alternative: Pakikisalamuha lamang sa mga sumasamba sa diyus-diyosan, o ganap na katapatan at pagsamba sa mga demonyo.
  rationale: Sa kalapit na konteksto, ang κοινωνία ay tunay na pakikibahagi. Pinananatili ng “maging kabahagi kayo ng mga demonyo” ang bigat ng pahayag nang hindi ito pinalalabis bilang ganap na katapatan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang pag-uulit ng “inihahandog” dahil mahalaga ito sa diin at ayos ng Griyego. Inilagay ang talababa sa “maging kabahagi kayo ng mga demonyo,” na siyang pariralang may leksikal na alternatibo.
