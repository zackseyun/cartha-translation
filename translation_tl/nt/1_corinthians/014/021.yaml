source:
  edition: SBLGNT
  text: ἐν τῷ νόμῳ γέγραπται ὅτι Ἐν ἑτερογλώσσοις καὶ ἐν χείλεσιν ⸀ἑτέρων λαλήσω τῷ λαῷ τούτῳ, καὶ οὐδ’ οὕτως εἰσακούσονταί μου, λέγει κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/021.yaml
  text: 'In the Law it is written: “By people of other tongues and by the lips of foreigners I will speak to this people[d][c][b][a], and not even in this way will they listen to me,” says the Lord.'
translation:
  language: tl
  text: 'Nasusulat sa Kautusan: “Sa pamamagitan ng mga taong may ibang wika at ng mga labi ng mga dayuhan ay magsasalita ako sa bayang ito[a]; at kahit sa ganitong paraan ay hindi pa rin sila makikinig sa akin[b],” sabi ng Panginoon.[c][d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sa ibang mga wika at sa mga labi ng iba.”
    reason: lexical_alternative
  - marker: b
    text: O “tatalima sa akin.”
    reason: lexical_alternative
  - marker: c
    text: Inuulit ng sipi ang diwa ng Isaias 28:11–12.
    reason: cross_reference
  - marker: d
    text: Dahil sa siping ito ay ang Diyos ng Israel ang nagsasalita, isinasalin ito ng ilan bilang “sabi ng PANGINOON” upang ipakita ang Hebreong pinagmulan nito.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ νόμῳ
  choice: sa Kautusan
  rationale: Bagaman mula sa Isaias ang sipi at hindi sa Pentateuco, ginagamit dito ang νόμος bilang malawak na tawag sa Kasulatan ng Israel. Pinananatili ng “Kautusan” ang karaniwang katawagang ito.
- source_word: γέγραπται
  choice: nasusulat
  rationale: Likas at kinikilalang pormula sa Filipino para sa ganap na pasibong anyong nagpapakilala ng sipi mula sa Kasulatan.
- source_word: ἐν ἑτερογλώσσοις
  choice: sa pamamagitan ng mga taong may ibang wika
  rationale: Ipinahahayag ang instrumental na diwa ng ἐν at ang kahulugan ng ἑτερογλώσσοις na may ibang wika, habang pinananatili ang ugnayan sa paksa ng mga wika sa konteksto.
- source_word: ἐν χείλεσιν ἑτέρων
  choice: ng mga labi ng mga dayuhan
  rationale: Pinananatili ang larawang “mga labi,” at ipinakikitang ang ἑτέρων ay tumutukoy sa mga taong iba ang bayan o wika, hindi lamang sa sinumang iba.
- source_word: λαλήσω
  choice: magsasalita ako
  rationale: Tuwirang modernong katumbas ng payak na hinaharap ng λαλέω at angkop sa pagsasalita ng Diyos.
- source_word: τῷ λαῷ τούτῳ
  choice: sa bayang ito
  rationale: Ang “bayan” ay likas na salin ng λαός bilang isang pangkat ng mga tao, lalo na sa siping tumutukoy sa bayang tipan.
- source_word: οὐδ’ οὕτως
  choice: ngunit kahit sa ganitong paraan ay hindi pa rin
  rationale: 'Pinananatili ang diin: kahit gumamit ang Diyos ng ganitong pambihirang paraan, hindi pa rin tutugon ang bayan.'
- source_word: εἰσακούσονταί μου
  choice: sila makikinig sa akin
  rationale: Ang “makikinig sa akin” ay malinaw at natural sa kasalukuyang Filipino; maaari ring saklawin ng pandiwa ang diwang pagtalima.
- source_word: λέγει κύριος
  choice: sabi ng Panginoon
  rationale: Natural na pormula ng pagsipi sa Filipino at tuwirang tinutumbasan ang κύριος bilang “Panginoon.”
theological_decisions:
- issue: Paglalarawan sa κύριος sa sipi kung saan nagsasalita ang Diyos ng Israel
  choice: Panginoon
  alternative: PANGINOON
  rationale: κύριος ang nasa tekstong Griyego, kaya “Panginoon” ang nasa pangunahing teksto. Gayunman, ang sipi ay mula sa kontekstong Hebreo na tumutukoy sa banal na pangalan, kaya itinatala sa talababa ang “PANGINOON” bilang maaaring salin.
- issue: Diwa ng εἰσακούσονταί μου
  choice: makikinig sa akin
  alternative: tatalima sa akin
  rationale: Hindi tahasang nilulutas ng pangunahing salin kung simpleng pakikinig o mas malalim na pagtalima ang diin; ang posibleng diwa ng pagtalima ay inilalagay sa talababa.
translation_notes:
  register: Gumamit ng moderno, malinaw, at marangal na Filipino. Pinanatili ang tradisyonal ngunit nauunawaang “Kautusan,” “nasusulat,” at “Panginoon,” samantalang ginawang natural ang ayos ng pangungusap at ang pariralang “makikinig sa akin.”
