base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/025.yaml
  text: the secrets of his heart become evident[a], and so, falling on his face, he will worship God, declaring that God truly is among you.
translation:
  language: tl
  text: Nalalantad ang mga lihim ng kanyang puso, at sa gayon ay magpapatirapa siya at sasamba sa Diyos, habang ipinahahayag niya, “Tunay ngang nasa gitna ninyo ang Diyos.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “Tunay ngang nasa inyo ang Diyos.”'
    reason: Pinananatili ang posibleng kahulugan ng ἐν ὑμῖν na maaaring tumukoy sa presensya ng Diyos sa loob ng mga mananampalataya, hindi lamang sa kanilang kalagitnaan bilang kapulungan.
lexical_decisions:
- source_word: τὰ κρυπτὰ
  choice: mga lihim
  rationale: Likas na tumutukoy sa mga bagay na nakatago sa kalooban ng tao; mas natural sa modernong Tagalog kaysa sa literal na “mga nakatagong bagay.”
- source_word: τῆς καρδίας αὐτοῦ
  choice: ng kanyang puso
  rationale: Pinananatili ang biblikal na katawagang “puso” bilang sentro ng mga iniisip at hangarin, sa halip na ipakahulugang “kalooban” lamang.
- source_word: φανερὰ γίνεται
  choice: nalalantad
  rationale: Ipinahahayag ang paglabas sa hayag ng dating nakatago. Natural at malinaw ito sa Tagalog, bagaman bahagyang pinagsasanib ang inceptive na diwa ng γίνεται.
- source_word: καὶ οὕτως
  choice: at sa gayon
  rationale: 'Pinananatili ang ugnayang bunga: ang pagkalantad ng puso ang humahantong sa kasunod na pagtugon.'
- source_word: πεσὼν ἐπὶ πρόσωπον
  choice: magpapatirapa siya
  rationale: Ang “magpatirapa” ang natural at dignified na Tagalog para sa pagbagsak nang nakadapa bilang kilos ng pagpapakumbaba at pagsamba.
- source_word: προσκυνήσει τῷ θεῷ
  choice: sasamba sa Diyos
  rationale: Sa konteksto, relihiyosong pagsamba sa Diyos ang malinaw na diwa; naipahiwatig na ng “magpapatirapa” ang pisikal na postura.
- source_word: ἀπαγγέλλων
  choice: na ipinahahayag
  rationale: Nagpapakita ng tahasan at maringal na pagkilala habang siya ay sumasamba, nang hindi ipinapalagay na pormal na pangangaral ito.
- source_word: Ὄντως
  choice: Tunay na
  rationale: Pinananatili ang mariing pagkilala na ang kanyang konklusyon ay totoo at tiyak.
- source_word: ἐν ὑμῖν
  choice: nasa gitna ninyo
  rationale: Ang konteksto ay ang nagkakatipong kapulungan, kaya malinaw nitong ipinahahayag ang presensya ng Diyos sa kanilang kalagitnaan habang pinananatili sa talababa ang posibleng “nasa inyo.”
theological_decisions:
- issue: Diwa ng ἐν ὑμῖν sa pangwakas na pahayag
  choice: nasa gitna ninyo
  alternative: nasa inyo
  rationale: Ang agarang konteksto ay ang pagtitipon ng iglesya at ang pagkilala ng tagalabas sa presensya ng Diyos sa kapulungan. Gayunman, maaaring mangahulugan ang Griyego ng “nasa inyo,” kaya hindi inaalis ang posibilidad na iyon at inilalagay ito sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “magpapatirapa” upang maigsi ngunit matingkad na mailarawan ang postura, at “nasa gitna ninyo” para sa korporatibong konteksto ng pagtitipon.
