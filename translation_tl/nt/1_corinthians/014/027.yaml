  text: εἴτε γλώσσῃ τις λαλεῖ, κατὰ δύο ἢ τὸ πλεῖστον τρεῖς, καὶ ἀνὰ μέρος, καὶ εἷς διερμηνευέτω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/027.yaml
  text: If anyone speaks in a tongue[a], let there be two, or at most three, and each in turn, and let one interpret.
translation:
  language: tl
  text: Kung may nagsasalita ng isang wika[a], dalawa lamang sila, o tatlo kung pinakamarami; magsalita sila nang isa-isa, at magpaliwanag ang isa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa isang dila.” Ang salitang Griyego ay maaaring mangahulugang “dila” o “wika.” Sa kabanata 12–14, ito ang katawagang ginagamit ni Pablo para sa kaloob na ito; hindi nito nililinaw kung anong uri ng wika o pananalita ang tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: γλώσσῃ
  choice: sa isang wika
  rationale: Ang γλῶσσα ay maaaring tumukoy sa dila o wika at, sa 1 Corinto 12–14, sa kaloob na pagsasalita sa mga wika. Natural sa modernong Tagalog ang “sa isang wika,” habang hindi nito tinutukoy kung ito ay wikang pantao o ibang uri ng pananalita.
- source_word: τις
  choice: may
  rationale: Sa kondisyunal na pangungusap, likas na ipinahahayag ng “kung may” ang di-tiyak at pangkalahatang diwa ng τις.
- source_word: λαλεῖ
  choice: nagsasalita
  rationale: Ang pangkasalukuyang pandiwa sa pangkalahatang kondisyon ay natural na isinalin bilang “nagsasalita.”
- source_word: κατὰ δύο ἢ τὸ πλεῖστον τρεῖς
  choice: dalawa lamang, o tatlo kung pinakamarami
  rationale: Nililimitahan ng parirala ang bilang ng mga magsasalita; malinaw at natural sa Tagalog ang ganitong ayos nang hindi dinaragdagan ang tagubilin.
- source_word: ἀνὰ μέρος
  choice: isa-isa silang magsalita
  rationale: Ipinahihiwatig nito ang salitan at hindi sabay-sabay na pagsasalita. Inulit ang pandiwa sa Tagalog para sa likas at malinaw na pahayag.
- source_word: εἷς
  choice: may isang
  rationale: Ang bilang ay ginagamit bilang pangngalan at tumutukoy sa isang taong gagawa ng pagpapaliwanag.
- source_word: διερμηνευέτω
  choice: magpaliwanag
  rationale: Sa konteksto, ang utos ay gawing nauunawaan ng kapulungan ang sinabi. Ang “magpaliwanag” ay natural sa Tagalog at hindi kasingkipot ng “magsalin,” bagaman maaari ring mangahulugan ang pandiwa ng pagsasalin o interpretasyon.
theological_decisions:
- issue: Kahulugan ng γλώσσῃ sa konteksto ng mga kaloob na espirituwal
  choice: Isinalin bilang “sa isang wika,” na may talababa tungkol sa tradisyonal na katawagang “wika/dila,” nang hindi tinutukoy ang likas ng penomenon.
  alternative: Gamitin ang “sa isang dila” o tahasang tukuyin ito bilang ekstátikong pananalita o banyagang wikang pantao.
  rationale: Hindi nilulutas ng talata kung ang pananalita ay wikang pantao, makalangit, o ibang uri. Pinananatili ng salin at talababa ang leksikal at teolohikal na pagiging bukás.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “kung pinakamarami” upang maipahayag nang natural ang pinakamataas na bilang, at “isa-isa” upang idiin ang salitang pagsasalita.
