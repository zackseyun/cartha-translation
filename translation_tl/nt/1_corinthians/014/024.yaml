  text: ἐὰν δὲ πάντες προφητεύωσιν, εἰσέλθῃ δέ τις ἄπιστος ἢ ἰδιώτης, ἐλέγχεται ὑπὸ πάντων, ἀνακρίνεται ὑπὸ πάντων,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/024.yaml
  text: But if all prophesy[a], and some unbeliever or uninstructed person enters, he is convicted by all; he is examined by all.
translation:
  language: tl
  text: Ngunit kung ang lahat ay nagpapahayag ng propesiya, at pumasok ang isang taong hindi sumasampalataya o walang kabatiran[a], sasawayin siya ng lahat at susuriin siya ng lahat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “taong taga-labas.” Ang salitang Griyego ay maaaring tumukoy sa isang taong walang sapat na kaalaman o hindi pamilyar sa mga gawain ng pangkat na nagsasalita, o sa isang taong hindi kabilang sa pangkat na iyon.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: ang lahat
  rationale: Pinananatili ang tuwirang pangkalahatang pagtukoy sa lahat ng nagsasalita sa pagtitipon.
- source_word: προφητεύωσιν
  choice: nagpapahayag ng propesiya
  rationale: Pinananatili ang natatanging kategorya ng propesiya sa kabanata nang hindi ito nililimitahan sa isang paliwanag lamang.
- source_word: ἄπιστος
  choice: hindi sumasampalataya
  rationale: Likas at malinaw itong tumutukoy sa isang taong hindi nananampalataya, gaya ng hinihingi ng konteksto.
- source_word: ἰδιώτης
  choice: taong walang kabatiran
  rationale: Ipinahihiwatig nito ang taong walang sapat na kaalaman o pamilyaridad sa nangyayari sa pagtitipon, nang hindi tiyak na ipinapalagay na hindi siya kabilang sa pamayanan.
- source_word: ἐλέγχεται
  choice: masusumbatan
  rationale: Ipinapahayag nito ang paglalantad at paghatol sa mali ng isang tao na nagbubunga ng pagkadama ng kasalanan, ngunit hindi ito pinalalabis bilang pangwakas na hatol.
- source_word: ἀνακρίνεται
  choice: masusuri
  rationale: Pinananatili ang diwa ng masusing pagsusuri o pagtatasa nang hindi ito awtomatikong ginagawang paghatol o pagkondena.
- source_word: ὑπὸ πάντων
  choice: ng lahat
  rationale: Pinananatili ang ahensiya at ang sinadyang pag-uulit ng parirala sa Griyego.
- source_word: δέ
  choice: Ngunit / at
  rationale: Ang unang δέ ay naghuhudyat ng pagsalungat sa naunang kalagayan; ang ikalawa ay likas na iniuugnay sa pagpasok ng tao.
- source_word: τις
  choice: isang
  rationale: Likas na ipinapahayag sa Filipino ang di-tiyak na pagtukoy bago ang dalawang posibleng paglalarawan sa taong pumapasok.
theological_decisions:
- issue: Kahulugan ng ἰδιώτης sa konteksto ng pagtitipon
  choice: taong walang kabatiran
  alternative: taong taga-labas
  rationale: Nakasentro ang agarang konteksto sa pagkaunawa sa sinasabi sa pagtitipon. Hindi ipinapasiya ng pangunahing teksto na ang tao ay tiyak na ganap na nasa labas ng pamayanang Kristiyano; inilalagay sa talababa ang lehitimong alternatibo.
- issue: Lakas ng kahulugan ng ἐλέγχεται
  choice: masusumbatan
  alternative: mapatutunayang nagkamali / mahihikayat
  rationale: Ang pandiwa ay may diwa ng paglalantad at pagkumbinsi tungkol sa pagkakamali o kasalanan. Ang “masusumbatan” ay nagpapanatili ng moral na bigat nang hindi ipinapalagay ang legal na pagkondena.
translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Pinanatili ang pag-uulit ng “ng lahat” at ang dalawang magkaugnay ngunit hindi magkaparehong pandiwa. Inilagay ang talababa pagkatapos ng pariralang isinasalin mula sa ἰδιώτης upang malinaw ang tinutukoy nito.
