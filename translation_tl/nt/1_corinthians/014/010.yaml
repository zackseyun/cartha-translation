  yaml_path: translation/nt/1_corinthians/014/010.yaml
  text: There are perhaps many kinds of languages in the world[a], and none is without meaning.
translation:
  language: tl
  text: Marahil ay napakaraming uri ng wika sa mundo[a], at walang isa man sa mga iyon ang walang kahulugan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Marahil ay napakaraming uri ng tunog sa mundo, at walang isa man ang walang tinig.”
    reason: Pinananatili ang mas literal na mga posibilidad ng φωνῶν (“mga tunog/mga tinig”) at ἄφωνον (“walang tinig”), yamang maaaring tumukoy ang mga ito sa tunog o tinig, hindi lamang sa wika at kahulugan.
lexical_decisions:
- source_word: τοσαῦτα εἰ τύχοι
  choice: marahil ay napakaraming
  rationale: Pinagsasama nito ang diwa ng malaking bilang sa τοσαῦτα at ang nagpapalumanay na ιδyomang εἰ τύχοι, sa natural na ayos ng modernong Tagalog.
- source_word: γένη
  choice: uri
  rationale: Ang “uri” ang karaniwan at malinaw na katumbas para sa mga klase o pagkakaiba-iba.
- source_word: φωνῶν
  choice: ng wika
  rationale: Bagaman maaaring mangahulugang “mga tunog” o “mga tinig” ang φωναί, ang konteksto ng 1 Corinto 14 ay tungkol sa mauunawaang pananalita; pinananatili sa talababa ang mas literal na posibilidad.
- source_word: ἐν κόσμῳ
  choice: sa mundo
  rationale: Tuwiran at natural na katumbas ng parirala.
- source_word: οὐδὲν ἄφωνον
  choice: walang isa man sa mga iyon ang walang kahulugan
  rationale: Ipinahahayag nito ang kontekstuwal na diwa na walang wika o uri ng pananalita ang salat sa ipinahihiwatig; iniiwasan din nito ang malabong literalismong “walang tunog.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “wika” at “kahulugan” sa pangunahing teksto dahil sa konteksto ng mauunawaang pananalita, habang inilagay sa talababa ang tunay na leksikal na ambiguwidad.
