id: 1CO.14.12
reference: 1 Corinthians 14:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ἐπεὶ ζηλωταί ἐστε πνευμάτων, πρὸς τὴν οἰκοδομὴν τῆς ἐκκλησίας ζητεῖτε ἵνα περισσεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/012.yaml
  text: So also you[a], since you are eager for spiritual gifts, seek to abound for the building up of the church.
translation:
  language: tl
  text: Gayundin naman kayo. Yamang masigasig kayo sa mga espirituwal na kaloob[a], sikapin ninyong managana para sa pagpapatibay ng iglesya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “mga espiritu”; maaari ring unawaing “mga espirituwal na bagay.” Ipinahihiwatig ng konteksto ang mga kaloob o pagpapahayag ng Espiritu.
    reason: Pinananatili ang mas literal at malabong anyo ng πνευμάτων habang ipinapaliwanag kung bakit “mga espirituwal na kaloob” ang nasa pangunahing teksto.
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: Gayundin naman kayo
  rationale: Iniuugnay nito ang tagubilin sa naunang paghahambing ni Pablo at pinananatili ang puwersa ng οὕτως καί.
- source_word: ἐπεὶ
  choice: Yamang
  rationale: Likas na nagpapakilala ng batayan o dahilan ng kasunod na tagubilin.
- source_word: ζηλωταί
  choice: masigasig
  rationale: Ipinahahayag ang matinding hangarin o sigasig nang hindi gumagamit ng masyadong teknikal o negatibong salita.
- source_word: πνευμάτων
  choice: mga espirituwal na kaloob[a]
  rationale: Sa konteksto ng 1 Corinto 12–14, ang tinutukoy ay mga kaloob o pagpapahayag na may kaugnayan sa Espiritu. Dahil mas maikli at mas malabo ang Griyego, pinanatili sa talababa ang mas literal na mga posibilidad.
- source_word: πρὸς τὴν οἰκοδομὴν
  choice: para sa pagpapatibay
  rationale: Ipinakikita ang layuning palakasin ang kapulungan. Ang “pagpapatibay” ay natural sa Filipino at naihahatid ang diwa ng metaporang pagtatayo.
- source_word: τῆς ἐκκλησίας
  choice: ng iglesya
  rationale: Karaniwan at kontekstuwal na katumbas ng ἐκκλησία bilang nagkakatipong pamayanan ng mga mananampalataya.
- source_word: ζητεῖτε ἵνα περισσεύητε
  choice: sikapin ninyong managana
  rationale: Pinagsasama ang sadyang pagsisikap ng ζητεῖτε at ang diwa ng kasaganaan o pag-apaw ng περισσεύητε, nang hindi nagdaragdag ng tahasang layon na wala sa Griyego.
theological_decisions:
- issue: Kahulugan ng πνευμάτων
  choice: mga espirituwal na kaloob
  alternative: mga espiritu; mga espirituwal na bagay
  rationale: Itinuturo ng agarang konteksto ang mga kaloob at pagpapahayag ng Espiritu, lalo na ang pagsasalita sa mga wika at propesiya. Gayunman, hindi tahasang nakasulat sa Griyego ang salitang “kaloob,” kaya inilalahad sa talababa ang literal na anyo at isa pang posibleng pagkaunawa.
- issue: Ugnayan ng περισσεύητε sa pagpapatibay ng iglesya
  choice: managana para sa pagpapatibay ng iglesya
  alternative: manguna sa pagpapatibay ng iglesya; managana sa mga kaloob na nagpapatibay sa iglesya
  rationale: Pinananatili ng salin ang diwa ng kasaganaan at ang direksiyong ipinahahayag ng πρὸς, ngunit hindi nito tahasang idinaragdag na ang layon ng “managana” ay ang mga kaloob, sapagkat walang nakasaad na gayong layon sa Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “iglesya” bilang pamilyar na katawagan sa lokal na pamayanan ng mga mananampalataya. Ang “managana” ay sadyang pinili upang mapanatili ang larawan ng kasaganaan sa περισσεύητε, kahit bahagyang mas pormal ito kaysa sa “humigit” o “manguna.”
