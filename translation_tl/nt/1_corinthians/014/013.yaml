  text: Therefore[b][a], the one who speaks in a tongue should pray that he may interpret.
translation:
  language: tl
  text: Kaya, ang nagsasalita sa isang wika[a] ay manalangin upang siya ay makapagpaliwanag.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa isang dila.” Ang salitang Griyego ay maaaring mangahulugang “dila” o “wika”; ginagamit ito sa kabanatang ito para sa pananalitang kailangang ipaliwanag upang maunawaan ng kapulungan.
    reason: lexical_alternative
  - marker: b
    text: Ang pandiwa sa Griyego ay isahan at tumutukoy bilang kinatawan sa sinumang nagsasalita sa isang wika.
    reason: grammatical_clarification
lexical_decisions:
- source_word: Διὸ
  choice: Kaya
  rationale: Nagpapahayag ito ng kongklusyon mula sa naunang sinabi; likas at malinaw sa makabagong Filipino ang “Kaya.”
- source_word: ὁ λαλῶν
  choice: ang nagsasalita
  rationale: Ang substantibong pangkasalukuyang participle ay tumutukoy sa sinumang gumagawa nito at pinananatili ang kilos ng pagsasalita.
- source_word: γλώσσῃ
  choice: sa isang wika
  rationale: Pinananatili ang isahan at ang di-tiyak na kahulugan ng γλῶσσα sa kabanata, nang hindi ipinapasiyang karaniwang wikang pantao lamang o ibang uri ng pananalita ang tinutukoy.
- source_word: προσευχέσθω
  choice: ay manalangin
  rationale: Ang pangatlong-panauhang pangkasalukuyang pautos ay isinalin bilang tuwirang payo o utos sa paraang likas at marangal sa Filipino.
- source_word: ἵνα
  choice: upang
  rationale: Malinaw na ipinahihiwatig ang layunin o hinihiling na bunga ng panalangin.
- source_word: διερμηνεύῃ
  choice: makapagpaliwanag
  rationale: Tumutukoy sa paggawang nauunawaan ng iba ang sinabi. Hindi ginamit ang “magsalin,” na maaaring maging masyadong makitid, o ang mas mahabang pariralang maaaring magdagdag ng bagay na hindi tahasang nasa Griyego.
theological_decisions:
- issue: Kahulugan ng γλώσσῃ sa 1 Corinto 12–14
  choice: wika
  alternative: dila; ibang wika
  rationale: Ang “wika” ay natural sa Filipino at maaari pa ring tumukoy sa pananalitang kailangang ipaliwanag. Iniiwasan ng salin ang “ibang,” na wala sa tekstong Griyego, at hindi nito nilulutas ang pagtatalo kung karaniwang wikang pantao, ekstatikong pananalita, o mas malawak na kategorya ang tinutukoy.
- issue: Kinatawang isahan sa ὁ λαλῶν at διερμηνεύῃ
  choice: ang nagsasalita … siya
  alternative: sinumang nagsasalita … makapagpaliwanag
  rationale: Pinananatili ang isahang estruktura ng Griyego. Sa Filipino, ang “siya” ay hindi tumutukoy sa kasarian, kaya naipahahayag ang pangkalahatang saklaw nang hindi nagdaragdag ng panlalaking limitasyon.
translation_notes:
  register: Makabagong Filipino na malinaw, marangal, at angkop sa pampublikong pagbasa. Iniwasan ang sobrang teknikal o denominasyonal na pananalita; pinanatili ang maigsi at tuwirang anyo ng talata.
