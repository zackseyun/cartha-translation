id: 1CO.14.22
reference: 1 Corinthians 14:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὥστε αἱ γλῶσσαι εἰς σημεῖόν εἰσιν οὐ τοῖς πιστεύουσιν ἀλλὰ τοῖς ἀπίστοις, ἡ δὲ προφητεία οὐ τοῖς ἀπίστοις ἀλλὰ τοῖς πιστεύουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/022.yaml
  text: So then[a], tongues are for a sign not to those who believe but to unbelievers[b], while prophecy is not to unbelievers but to those who believe.
translation:
  language: tl
  text: Kaya nga, ang mga wika[a] ay tanda, hindi para sa mga sumasampalataya kundi para sa mga hindi sumasampalataya[b]; samantalang ang propesiya ay hindi para sa mga hindi sumasampalataya kundi para sa mga sumasampalataya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga dila.” Maaaring tumukoy ang salitang Griyego sa mga wika, ngunit sa 1 Corinto 12–14 hindi nito nilulutas kung anong uri ng pananalita ang tinutukoy.
    reason: lexical_alternative
  - marker: b
    text: Dahil sa naunang sipi mula sa Isaias 28:11–12, nauunawaan ng ilan ang “tanda” bilang tanda ng paghatol.
    reason: cross_reference
lexical_decisions:
- source_word: ὥστε
  choice: Kaya nga
  rationale: Ipinahahayag ang konklusyong hinango sa naunang pangangatwiran at natural itong pakinggan sa makabagong Filipino.
- source_word: γλῶσσαι
  choice: mga wika
  rationale: Maaaring tumukoy ang γλῶσσαι sa mga wika o sa pagsasalita sa mga wika. Pinananatili ng “mga wika” ang katawagang nakasanayan sa konteksto nang hindi tinutukoy kung banyagang mga wika o ibang uri ng pananalita ang eksaktong ibig sabihin.
- source_word: εἰς σημεῖόν
  choice: ay tanda
  rationale: Likas na Filipino ito para sa pagiging o paggampan bilang tanda, habang hindi dinaragdagan kung positibo, mapagpatunay, o mapanghatol ang tanda.
- source_word: τοῖς πιστεύουσιν
  choice: para sa mga sumasampalataya
  rationale: Pinananatili ang pandiwang diwa ng substantival participle at malinaw na itinatapat sa mga hindi sumasampalataya.
- source_word: τοῖς ἀπίστοις
  choice: para sa mga hindi sumasampalataya
  rationale: Direkta at madaling maunawaang katumbas na nagpapanatili sa malinaw na pagsalungat sa τοῖς πιστεύουσιν.
- source_word: προφητεία
  choice: propesiya
  rationale: Direktang katawagan para sa kaloob o gawain ng pagpapahayag na tinatalakay sa kabanata, nang hindi ito nililimitahan sa paghula sa hinaharap.
- source_word: δὲ
  choice: samantalang
  rationale: Malinaw at maayos na ipinakikita ang paghahambing at pagsalungat ng mga wika at propesiya.
theological_decisions:
- issue: Kahulugan ng γλῶσσαι sa konteksto ng mga kaloob
  choice: Isinaling “mga wika” nang hindi tinutukoy ang eksaktong anyo ng pananalita.
  alternative: mga banyagang wika; ekstátikong pananalita; pagsasalita sa iba't ibang wika
  rationale: Hindi nilulutas ng mismong talata ang pinagtatalunang likas ng γλῶσσαι, kaya pinananatili ang saklaw at tensiyon ng salitang Griyego.
- issue: Lakas at kahulugan ng σημεῖον para sa mga hindi sumasampalataya
  choice: Isinaling neutral bilang “tanda.”
  alternative: tandang nagpapatunay; tanda ng paghatol
  rationale: Tanda lamang ang tahasang sinasabi ng Griyego. Maaaring magpahiwatig ng paghatol ang naunang sipi sa Isaias, ngunit hindi iyon dapat ipasok bilang tiyak na kahulugan sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang magkatugmang “mga sumasampalataya” at “mga hindi sumasampalataya” upang mapanatili ang simetriya ng Griyego; iniwasan ang mas teknikal na “mananampalataya/di-mananampalataya” para manatiling hayag ang pandiwang diwa.
