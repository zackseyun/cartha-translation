  text: For you are indeed giving thanks well[a], but the other person is not built up.
translation:
  language: tl
  text: Sapagkat maayos nga ang pagbibigay mo ng pasasalamat, ngunit ang ibang tao ay hindi napapatibay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “hindi naitatayo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ
  choice: mo
  rationale: Ipinahihiwatig ng panghalip na paari sa “pagpapasalamat mo” ang tuwirang pagtukoy sa isang kausap, gaya ng ikalawang panauhang isahan sa Griyego.
- source_word: μὲν γὰρ
  choice: Sapagkat ... nga
  rationale: Pinananatili ng “sapagkat” ang paliwanag na ipinahihiwatig ng γάρ, samantalang kinikilala ng “nga” ang unang punto bago ang kasunod na pagsalungat.
- source_word: καλῶς
  choice: maayos
  rationale: Likas at malinaw na katumbas ito ng paggawa nang mabuti o wasto sa kontekstong ito.
- source_word: εὐχαριστεῖς
  choice: ang pagpapasalamat mo
  rationale: Ipinahahayag nito ang pagbibigay ng pasasalamat sa Diyos sa pagtitipon. Bagaman ginawang pariralang pangngalan para sa likas na daloy sa Tagalog, nananatili ang aktuwal na kilos ng kausap at hindi ipinahihiwatig na posibilidad lamang.
- source_word: ἀλλ’
  choice: ngunit
  rationale: Malinaw nitong ipinakikita ang matibay na pagsalungat sa pagitan ng maayos na pagpapasalamat at ng kawalan ng pakinabang sa iba.
- source_word: ὁ ἕτερος
  choice: ang ibang tao
  rationale: Tumutukoy ito sa ibang taong naroon, lalo na sa nakikinig, nang hindi nagdaragdag ng mas tiyak na papel na wala sa teksto.
- source_word: οὐκ οἰκοδομεῖται
  choice: ay hindi napapatibay
  rationale: Inihahatid ng “napapatibay” ang pasibong diwa ng espirituwal na pagpapalakas sa kapulungan sa natural na makabagong Tagalog; inilalahad sa talababa ang literal na larawan ng pagtatayo.
theological_decisions:
- issue: Ang talinghaga ng οἰκοδομέω tungkol sa pagpapatibay sa kapulungan
  choice: ay hindi napapatibay
  alternative: ay hindi naitatayo
  rationale: Ang “napapatibay” ay malinaw sa karaniwang mambabasa at angkop sa konteksto ng espirituwal na kapakinabangan, habang pinananatili sa talababa ang larawan ng pagtatayo at hindi nililimitahan ito sa isang partikular na doktrinal na paliwanag.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinananatili ang paliwanag at konsesibong diin ng μὲν γὰρ sa “Sapagkat ... nga,” gayundin ang malinaw na pagsalungat ng ἀλλά sa “ngunit.”
