base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/004.yaml
  text: The one who speaks in a tongue builds up himself[c][b][a], but the one who prophesies builds up the church.
translation:
  language: tl
  text: Ang nagsasalita sa isang wika[a] ay nagpapatibay sa sarili niya[b], ngunit ang nagpapahayag ng propesiya ay nagpapatibay sa iglesya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa isang lengguwahe.” Sa kabanatang ito, malamang na tumutukoy ang salita sa kaloob ng pagsasalita sa mga wika; pinagtatalunan ang tiyak na kalikasan ng pananalitang ito.
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, panlalaking isahan ang anyo, ngunit kinatawan ito ng sinumang gumagawa ng kilos.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “kapulungan” o “kongregasyon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαλῶν
  choice: Ang nagsasalita
  rationale: Ang artikulo at pangkasalukuyang pandiwaring Griyego ay tumutukoy sa isang kinatawang tao na gumagawa ng kilos; pinananatili rin nito ang pagkakatulad ng ayos sa “ang nagpapahayag ng propesiya.”
- source_word: γλώσσῃ
  choice: sa isang wika
  rationale: Pinananatili ang isahan ng anyong Griyego. Ang “wika” ay likas sa modernong Tagalog at hindi nagpapasya kung ito ay karaniwang wikang banyaga, ekstatikong pananalita, o ibang uri ng kaloob na pananalita.
- source_word: ἑαυτὸν
  choice: sa sarili niya
  rationale: Isinasalin ang panumbalik na panghalip na isahang panlalaki nang natural sa Tagalog; kinatawan ang gamit nito at hindi limitado sa mga lalaki.
- source_word: οἰκοδομεῖ
  choice: nagpapatibay
  rationale: Matalinghaga ang pandiwa para sa espirituwal na pagpapalakas o kapakinabangan. Mas malinaw at natural ang “nagpapatibay” kaysa sa literal na larawang “nagtatayo.”
- source_word: ὁ δὲ προφητεύων
  choice: ngunit ang nagpapahayag ng propesiya
  rationale: Isinasalin ang substantibong pandiwari at ang banayad na pagsalungat ng δέ. Nililinaw ng “nagpapahayag ng propesiya” ang kilos nang hindi dinaragdagan ang nilalaman nito.
- source_word: ἐκκλησίαν
  choice: sa iglesya
  rationale: Sa konteksto, tumutukoy ito sa nagkakatipong pamayanang Cristiano. Karaniwan at madaling maunawaan ang “iglesya,” habang kinikilala sa talababa ang “kapulungan” at “kongregasyon.”
theological_decisions:
- issue: Kahulugan ng γλώσσῃ sa 1 Corinto 12–14
  choice: “sa isang wika,” na may talababa tungkol sa kaloob na pananalita
  alternative: “sa isang dila,” “sa ibang wika,” o tahasang “sa kaloob na mga wika”
  rationale: Ang konteksto ay tungkol sa kaloob ng pananalita, ngunit pinagtatalunan ang tiyak na kalikasan nito. Hindi nilulutas ng salin ang tunay na kalabuan ng teksto.
- issue: Kinatawang gamit ng isahang panlalaking anyo
  choice: “Ang nagsasalita … sa sarili niya”
  alternative: “Sinumang nagsasalita … sa kanyang sarili” o isang tahasang walang-kasariang pormulasyon
  rationale: Natural sa Tagalog ang “niya” at hindi nito kailangang tukuyin ang kasarian, samantalang napapanatili ang isahang kinatawang diwa ng Griyego.
- issue: Saklaw ng ἐκκλησίαν
  choice: “iglesya”
  alternative: “kapulungan” o “kongregasyon”
  rationale: Ang tinutukoy ay ang nagkakatipong pamayanang Cristiano, hindi pangunahing gusali o institusyon. Inilalagay sa talababa ang mga posibleng katumbas upang mapanatili ang saklaw ng termino.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “nagpapatibay” para sa matalinghagang οἰκοδομεῖ at iniwasang ipakahulugan ang “wika” ayon sa isang partikular na doktrina. Ang mga marker [a], [b], at [c] ay nakalagay mismo sa pangunahing teksto.
