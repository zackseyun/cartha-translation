  text: And the spirits of prophets are subject to prophets,[a]
translation:
  language: tl
  text: At ang mga espiritu ng mga propeta ay napasasailalim sa mga propeta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “ang mga espiritung nauugnay sa mga propeta ay napasasailalim sa mga propeta.” Maaaring tumukoy ang parirala sa mga propetikong udyok o sa espirituwal na gawaing nauugnay sa mga propeta, na nagdidiin sa pagpipigil sa sarili sa pagpapahayag ng propesiya.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Likas na pang-ugnay ito sa Filipino at pinananatili ang daloy ng karagdagang katuwiran ni Pablo.
- source_word: πνεύματα
  choice: mga espiritu
  rationale: Pinananatili nito ang tuwirang kahulugan at ang tunay na kalabuan ng parirala; hindi ito tahasang ginawang “mga pahayag” o “mga kaloob.”
- source_word: προφητῶν
  choice: ng mga propeta
  rationale: Tuwirang ipinapahayag ang ugnayang henitibo nang hindi nagpapasiya kung ang tinutukoy ay espiritu, udyok, o espirituwal na gawain na kaugnay ng mga propeta.
- source_word: προφήταις
  choice: sa mga propeta
  rationale: Ang datibo kasama ng ὑποτάσσεται ay likas na maisasalin bilang pinagpapasakupan.
- source_word: ὑποτάσσεται
  choice: ay nagpapasakop
  rationale: Ipinahahayag ang pagiging nasa ilalim ng pamamahala o kontrol, at umaayon sa pangkalahatang pahayag na may maramihang simuno sa Filipino.
theological_decisions:
- issue: Kahulugan ng “mga espiritu ng mga propeta” kaugnay ng pagpipigil sa propesiya
  choice: Pinanatili sa pangunahing teksto ang “mga espiritu ng mga propeta,” habang ipinakikita ng “nagpapasakop” na hindi inaalis ng gawaing propetiko ang pananagutan at pagpipigil ng propeta.
  alternative: Maaaring tumukoy ito sa mga espirituwal na udyok o gawain na nauugnay sa mga propeta; maaari ring unawain bilang mga espiritu ng mga propeta na nagpapasakop sa ibang mga propeta.
  rationale: Sa konteksto ng maayos na pagpapahayag ng propesiya, binibigyang-diin ang kaayusan at pananagutan. Gayunman, hindi nilulutas ng salin ang eksaktong tinutukoy ng πνεύματα o kung ang “mga propeta” ay pansarili o pangkapuwa ang saklaw.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang teknikal ngunit karaniwang salitang “espiritu” at iniwasan ang paliwanag na paraphrase sa pangunahing teksto.
