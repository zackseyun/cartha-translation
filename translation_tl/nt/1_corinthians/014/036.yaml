id: 1CO.14.36
reference: 1 Corinthians 14:36
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἢ ἀφ’ ὑμῶν ὁ λόγος τοῦ θεοῦ ἐξῆλθεν, ἢ εἰς ὑμᾶς μόνους κατήντησεν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/036.yaml
  text: Or did the word of God go out from you[b][a], or has it reached only you?
translation:
  language: tl
  text: O sa inyo ba nagmula ang salita ng Diyos,[a] o sa inyo lamang ba ito nakarating?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa inyo ba lumabas ang salita ng Diyos?”
    reason: lexical_alternative
  - marker: b
    text: O “kayo lamang ba ang inabutan nito?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: O
  rationale: Pinananatili ang disjunctive at interrogative na anyo ng Griyego; ang talas ng pagsaway ay naipapahayag ng dalawang retorikal na tanong.
- source_word: ἀφ’ ὑμῶν
  choice: sa inyo ... nagmula
  rationale: Ipinahahayag ng ἀπό na may genitive ang pinagmulan. Likas sa modernong Tagalog ang pariralang ito at malinaw nitong hinahamon ang pag-aakalang sila ang pinagmulan.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: ang salita ng Diyos
  rationale: Pinananatili ang malawak at pormal na pahayag ng Griyego nang hindi nililimitahan sa ebanghelyo lamang o sa isang propetikong pahayag.
- source_word: ἐξῆλθεν
  choice: nagmula
  rationale: Sa ugnayan nito sa ἀφ’ ὑμῶν, natural na ipinahahayag ng “nagmula” ang ideya ng paglabas mula sa isang pinagmulan. Nasa talababa ang mas literal na larawang “lumabas mula.”
- source_word: εἰς ὑμᾶς μόνους
  choice: sa inyo lamang
  rationale: Malinaw at natural na pinananatili ang diin sa pagiging eksklusibong tagatanggap.
- source_word: κατήντησεν
  choice: nakarating
  rationale: Tumpak na inilalarawan ang pagdating o pag-abot sa isang destinasyon at angkop sa aspektong Tagalog para sa naganap na pagdating na may kasalukuyang kabuluhan.
theological_decisions:
- issue: Tinutukoy ng “salita ng Diyos”
  choice: Pinanatili bilang “ang salita ng Diyos” nang hindi nililimitahan ang saklaw.
  alternative: “ang mensahe ng Diyos,” “ang ebanghelyo,” o “propetikong pahayag”
  rationale: Maaaring saklawin sa konteksto ang ebanghelyo at apostolikong turo, at posibleng kaugnay rin ito ng pagsasalita sa kapulungan. Hindi nilulutas ng salin ang tunay na lawak ng parirala.
- issue: Lakas ng retorikal na pagsaway
  choice: Dalawang tanong na nagsisimula sa “O”
  alternative: Magsimula sa padamdam na “Ano!” o isang mas tahasang pagsaway
  rationale: Ang ἢ ay karaniwang disjunctive na “o.” Pinananatili ng anyong patanong ang talas nang hindi nagdaragdag ng salitang wala sa Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “nagmula” at “nakarating” upang maging malinaw sa karaniwang mambabasa habang pinananatili sa mga talababa ang mahahalagang alternatibong larawan ng mga pandiwang Griyego.
