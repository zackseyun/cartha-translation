id: 1CO.14.28
reference: 1 Corinthians 14:28
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐὰν δὲ μὴ ᾖ ⸀διερμηνευτής, σιγάτω ἐν ἐκκλησίᾳ, ἑαυτῷ δὲ λαλείτω καὶ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/028.yaml
  text: But if there is no interpreter[a], he must keep silent in the church and speak to himself and to God.
translation:
  language: tl
  text: Ngunit kung walang tagapagpaliwanag, manahimik siya sa pagtitipon[a] at magsalita sa sarili niya at sa Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kapulungan” o “sa kongregasyon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διερμηνευτής
  choice: tagapagpaliwanag
  rationale: Tumutukoy sa taong naghahatid ng kahulugan ng isang wikang sinasalita upang maunawaan ito ng iba. Mas natural sa kontekstong ito ang “tagapagpaliwanag” kaysa “tagapagsalin,” na maaaring magpahiwatig lalo na ng pagsasalin ng nakasulat na teksto.
- source_word: σιγάτω
  choice: manahimik siya
  rationale: Ikatlong panauhang pang-isahang pautos ito. Pinananatili ng “manahimik siya” ang lakas ng tagubilin sa natural at marangal na Tagalog.
- source_word: ἐν ἐκκλησίᾳ
  choice: sa pagtitipon
  rationale: Sa konteksto ng 1 Corinto 14, tumutukoy ito sa nagkakatipong kapulungan ng mga mananampalataya, hindi pangunahing sa gusali. Iniiwasan ng “sa pagtitipon” ang posibleng pag-unawa sa “simbahan” bilang lugar lamang.
- source_word: ἑαυτῷ
  choice: sa sarili niya
  rationale: Tuwirang isinasalin ang panghalip na pabalik sa sarili nang hindi idinaragdag ang “nang palihim” o “nang mag-isa,” na wala sa teksto.
- source_word: λαλείτω
  choice: magsalita
  rationale: Pinananatili ang anyong pautos at ang payak, neutral na kahulugan ng pandiwa.
- source_word: τῷ θεῷ
  choice: sa Diyos
  rationale: Tuwirang ipinapakita ang isa pang pinatutunguhan ng pagsasalita.
- source_word: ἐὰν δὲ μὴ ᾖ
  choice: Ngunit kung walang
  rationale: Natural na Tagalog para sa kondisyong nagsasaad na walang naroroong tagapagpaliwanag.
theological_decisions:
- issue: Saklaw ng utos na manahimik sa nagkakatipong kapulungan
  choice: Ang pagsasalita sa publiko sa pagtitipon ang itinitigil kapag walang tagapagpaliwanag, habang nananatili ang pagsasalita sa sarili at sa Diyos.
  alternative: Lubusang itigil ng tao ang lahat ng uri ng pagsasalita.
  rationale: Ang pagtutunggali ng “manahimik ... sa pagtitipon” at “magsalita sa sarili niya at sa Diyos” ay nagpapakitang ang ipinagbabawal ay ang pagsasalitang nakatuon sa kapulungan. Hindi nililinaw ng salin kung maririnig o hindi ang natitirang pagsasalita, kaya napapanatili ang tunay na puwang ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pagtitipon” upang idiin ang nagkakatipong pamayanan, at iniwasan ang mga dagdag na salitang maaaring magtakda kung pribado o naririnig ang pagsasalita.
