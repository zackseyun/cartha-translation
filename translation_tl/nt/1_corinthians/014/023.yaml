id: 1CO.14.23
reference: 1 Corinthians 14:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐὰν οὖν συνέλθῃ ἡ ἐκκλησία ὅλη ἐπὶ τὸ αὐτὸ καὶ πάντες ⸂λαλῶσιν γλώσσαις⸃, εἰσέλθωσιν δὲ ἰδιῶται ἢ ἄπιστοι, οὐκ ἐροῦσιν ὅτι μαίνεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/023.yaml
  text: Therefore[a], if the whole church comes together in one place and all speak in tongues, and uninstructed people or unbelievers enter[b], will they not say that you are out of your minds?
translation:
  language: tl
  text: Kaya, kung ang buong iglesya ay magtipon sa iisang lugar at lahat ay magsalita sa mga dila[a], at may pumasok na mga hindi naturuan[b] o mga hindi sumasampalataya, hindi ba nila sasabihin na wala kayo sa katinuan?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga wika.” Maaaring mangahulugan ang salitang Griyego ng “mga wika,” ngunit ang “mga dila” ang nakaugaliang katawagan sa kontekstong ito at hindi nito itinatakda ang eksaktong uri ng pananalitang tinutukoy.
    reason: alternative_reading
  - marker: b
    text: O “mga hindi pamilyar.” Malamang na tumutukoy ito sa mga hindi naturuan o hindi pamilyar sa mga gawain ng kapulungan, at ibinubukod sila rito sa “mga hindi sumasampalataya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Likas sa modernong Tagalog at malinaw na naghahayag ng kongklusyon mula sa naunang pangangatwiran.
- source_word: συνέλθῃ ἡ ἐκκλησία ὅλη ἐπὶ τὸ αὐτό
  choice: magtipon sa iisang lugar ang buong iglesya
  rationale: Pinananatili ang pagkilos ng pagtitipon, ang kabuuan ng kongregasyon, at ang diwang panlunan ng idyomang ἐπὶ τὸ αὐτό.
- source_word: λαλῶσιν γλώσσαις
  choice: magsalita ... sa mga wika
  rationale: Ang “mga wika” ay natural na katumbas ng γλώσσαι sa Tagalog at hindi nito ipinapalagay kung ang penomenon ay karaniwang wikang pantao, ekstatikong pananalita, o pareho; nililinaw ng talababa ang nakaugaliang katawagang “mga dila.”
- source_word: ἰδιῶται
  choice: mga taong walang kabatiran
  rationale: Ipinahihiwatig na hindi sila pamilyar o naturuan tungkol sa gawain ng kapulungan, nang hindi sila awtomatikong ipinapantay sa kasunod na “mga hindi sumasampalataya.”
- source_word: ἄπιστοι
  choice: mga hindi sumasampalataya
  rationale: Tuwirang inililipat ang kahulugan at pinananatili ang pagkakaiba nito sa ἰδιῶται.
- source_word: μαίνεσθε
  choice: nasisiraan kayo ng bait
  rationale: Natural at matindi sa Tagalog, at naghahatid ng paratang na wala sa matinong pag-iisip nang hindi lubhang kolokyal.
- source_word: οὐκ ἐροῦσιν ὅτι
  choice: hindi ba nila sasabihing
  rationale: Pinananatili ang retorikal na tanong na umaasang sasang-ayon ang mambabasa.
theological_decisions:
- issue: Kalikasan ng γλώσσαι sa 1 Corinto 14
  choice: “mga wika” sa pangunahing teksto, na may “mga dila” bilang alternatibo sa talababa
  alternative: “mga dila” sa pangunahing teksto
  rationale: Sa Tagalog, parehong may tradisyonal at interpretibong bigat ang “mga dila,” samantalang literal ding maaaring tumukoy ang γλώσσαι sa mga wika. Ang pangunahing salin at talababa ay magkasamang nagpapanatili sa tunay na kalabuan nang hindi nagpapasya kung anong uri ng pananalita ang tinutukoy.
- issue: Pagkakaiba ng ἰδιῶται at ἄπιστοι
  choice: Pinag-iba bilang “mga taong walang kabatiran” at “mga hindi sumasampalataya”
  alternative: “mga tagalabas o mga hindi sumasampalataya”
  rationale: Maaaring tumukoy ang ἰδιῶται sa mga hindi pamilyar o hindi naturuan sa gawain ng kapulungan. Ang hiwalay na salin ay umiiwas na pag-isahin ang dalawang katawagan ni Pablo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “iglesya” para sa nagkakatipong pamayanang Kristiyano; iniwasan ang sobrang teknikal o sektaryong pananalita.
