    rationale: Maaari itong magtunog na unti-unti kayong nawawalan ng bait. Ang “wala kayo sa katinuan” ay likas na pananalita para sa paratang na wala sa wastong pag-iisip.
  - severity: low
    issue: Ang “mga taong walang kabatiran” ay malabo at maaaring tumukoy sa pangkalahatang kawalan ng kaalaman.
    rationale: Ang “mga hindi naturuan,” na nililinaw ng talababa bilang hindi pamilyar sa mga gawain ng kapulungan, ay mas malapit sa kontekstuwal na puwersa ng ἰδιῶται.
