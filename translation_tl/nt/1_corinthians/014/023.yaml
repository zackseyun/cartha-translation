  source_fidelity: 'Ang balangkas ng talata ay tapat sa Griyego: naipapahayag ang kondisyonal na pagtitipon ng buong iglesia sa isang lugar, ang pagsasalita ng lahat sa γλώσσαις, ang pagkakaiba ng ἰδιῶται at ἄπιστοι, at ang retorikal na tanong. Gayunman, ang “mga wika” sa pangunahing teksto ay mas madaling mabasa bilang mga karaniwang wikang pantao; mas mainam ang nakaugaliang “mga dila” upang mapanatili ang bukas na kahulugan ng γλώσσαις.'
  naturalness: Mas natural ang ayos na “kung ang buong iglesya ay magtipon...” at ang pananalitang “wala kayo sa katinuan” kaysa “nasisisiraan kayo ng bait,” na maaaring magpahiwatig ng unti-unting pagkawala ng katinuan.
  terminology: Ang “iglesya” at “mga hindi sumasampalataya” ay angkop. Pinalitan ang “mga taong walang kabatiran” ng “mga hindi naturuan” upang mas tuwirang maipakita ang ἰδιῶται bilang mga hindi pamilyar o hindi naihanda sa mga gawain ng kapulungan, nang hindi ipinapantay sa mga hindi sumasampalataya.
  issues:
  - severity: medium
    issue: Ang pangunahing saling “mga wika” para sa γλώσσαις ay maaaring magpahiwatig ng tiyak na mga wikang pantao.
