  naturalness: 'Malinaw at angkop ang rehistro. Gayunman, ang “kung hindi malinaw ang pagkakaiba ng mga tono nito” ay bahagyang malabo: maaaring ikabit ang “nito” sa pinakamalapit na pangngalang “lira,” sa halip na sa bawat instrumentong binabanggit bilang halimbawa. Ang paggamit ng “ito” bilang pangkalahatang pantukoy sa alinmang instrumento ay mas tuwiran.'
