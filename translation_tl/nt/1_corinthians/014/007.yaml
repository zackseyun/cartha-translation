base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/007.yaml
  text: Even lifeless things that produce sound—whether flute or harp—if they do not give a distinction in the notes[a], how will what is played on the flute or on the harp be recognized?
translation:
  language: tl
  text: Maging ang mga bagay na walang buhay na lumilikha ng tunog—plauta man o lira[a]—kung hindi ito nagbibigay ng pagkakaiba sa mga tono, paano makikilala ang tinutugtog sa plauta o sa lira?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “plauta” ay maaari ring isaling “pipa.” Ang “lira” ay tumutukoy sa isang sinaunang instrumentong may kuwerdas; maaari rin itong isaling “alpa,” bagaman mas tiyak ang “lira.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμως
  choice: Maging
  rationale: Ipinakikilala nito nang may diin ang paghahambing sa mga bagay na walang buhay; natural sa Filipino ang “Maging” sa ganitong gamit.
- source_word: τὰ ἄψυχα
  choice: ang mga bagay na walang buhay
  rationale: Pinananatili ang malawak na kahulugan ng mga bagay na hindi buháy, na sa konteksto ay mga instrumentong pangmusika.
- source_word: φωνὴν διδόντα
  choice: na lumilikha ng tunog
  rationale: Likas na salin sa modernong Filipino ng literal na ideyang “nagbibigay ng tunog.”
- source_word: εἴτε αὐλὸς εἴτε κιθάρα
  choice: plauta man o lira
  rationale: Ang αὐλός ay instrumentong hinihipan at ang κιθάρα ay sinaunang instrumentong may kuwerdas. Mas tiyak sa kasaysayan ang “lira” kaysa “alpa,” habang madaling maunawaan ang “plauta.”
- source_word: ἐὰν διαστολὴν τοῖς φθόγγοις μὴ δῷ
  choice: kung hindi malinaw ang pagkakaiba ng mga tono nito
  rationale: Natural na ipinapahayag sa Filipino ang pangangailangang malinaw na mapag-iba ang mga tunog o nota upang makilala ang tugtugin.
- source_word: πῶς γνωσθήσεται
  choice: paano makikilala
  rationale: Ang pasibong anyo ay tumutukoy sa pagkilala o pagtukoy sa tugtugin.
- source_word: τὸ αὐλούμενον ἢ τὸ κιθαριζόμενον
  choice: ang tinutugtog sa plauta o sa lira
  rationale: Ipinahahayag ng dalawang articular passive participle ang musikang tinutugtog sa bawat instrumento, hindi lamang ang mga instrumento mismo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang retorikal na tanong at ang paghahambing sa dalawang uri ng instrumentong pangmusika.
