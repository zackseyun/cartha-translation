revisions:
- from: Sapagkat maaari kayong lahat na magpahayag ng propesiya, nang isa-isa,[a] upang matuto ang lahat at mapalakas ang loob ng lahat.[b]
  to: Sapagkat makapagpapahayag kayong lahat ng propesiya nang paisa-isa,[a] upang ang lahat ay matuto at mapalakas ang loob.[b]
  rationale: Pinalitan ang hindi gaanong likas na “nang isa-isa” ng “nang paisa-isa,” ang karaniwang Filipino para sa kahulugang “one by one/one at a time.” Inayos ang sugnay ng layunin upang maging mas daloy ang Filipino habang pinananatili ang ikalawa at ikatlong pag-uulit ng πάντες. Sa talababa, ang “mahikayat” ay mas malapit sa diwa ng exhortation kaysa “mapayuhan,” bagaman nananatiling malawak ang pangunahing saling “mapalakas ang loob.”
