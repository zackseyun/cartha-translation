base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/031.yaml
  text: For you can all prophesy one by one[b][a], so that all may learn and all may be encouraged.
translation:
  language: tl
  text: Sapagkat makapagpapahayag kayong lahat ng propesiya nang paisa-isa,[a] upang ang lahat ay matuto at mapalakas ang loob.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isa-isa.”
    reason: lexical_alternative
  - marker: b
    text: O “mahikayat” o “maaliw.” Ang pandiwang Griyego ay maaaring mangahulugang palakasin ang loob, himukin, o aliwin, ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: δύνασθε
  choice: maaari kayong
  rationale: Ipinahahayag ng pandiwa ang kakayahan o posibilidad. Likas sa modernong Filipino ang “maaari kayong” sa konteksto ng praktikal na tagubilin.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag o batayan nito kaugnay ng naunang tagubilin.
- source_word: καθ’ ἕνα
  choice: nang isa-isa
  rationale: Ipinahahayag ang sunod-sunod at maayos na pagsasalita ng tig-iisang tao; maaari rin itong unawain bilang “nang paisa-isa.”
- source_word: πάντες
  choice: lahat
  rationale: Pinananatili ang tatlong ulit na πάντες at ang lawak nito nang hindi nililimitahan ang unang gamit sa “lahat ng propeta” o “lahat kayo.”
- source_word: προφητεύειν
  choice: magpahayag ng propesiya
  rationale: Pinananatili ang kinikilalang kategorya ng gawaing προφητεύειν nang hindi ito pinakikitid sa isang paliwanag lamang; mas natural ito sa Filipino kaysa sa bihirang pandiwang “manghula,” na maaari ring magpahiwatig ng simpleng paghula.
- source_word: ἵνα
  choice: upang
  rationale: Malinaw at natural na ipinahahayag ang layunin o bunga ng sugnay.
- source_word: μανθάνωσιν
  choice: matuto
  rationale: Pinananatili ang pangkalahatang diwa ng pagkatuto sa sugnay na nagpapahayag ng layunin.
- source_word: παρακαλῶνται
  choice: mapalakas ang loob
  rationale: Malawak at natural na katumbas ito ng pasibong παρακαλέω sa konteksto ng pagpapatibay sa kapulungan, habang kinikilala sa talababa na maaari rin itong tumukoy sa pagpapayo o pag-aliw.
theological_decisions:
- issue: Saklaw ng πάντες (“lahat”) sa tagubilin para sa kapulungan
  choice: Pinanatili ang “lahat” sa bawat paglitaw nang hindi tinutukoy kung ang una ay “lahat kayo” o “lahat ng mga propeta.”
  alternative: Tahasang isalin ang una bilang “lahat kayo” o “lahat ng mga propeta.”
  rationale: Magkakaiba ang malamang na tinutukoy ng unang πάντες at ng dalawang kasunod, ngunit hindi iyon tahasang nililimitahan ng Griyego. Pinananatili ng salin ang pag-uulit at hinahayaang linawin ng konteksto ang saklaw.
- issue: Saklaw ng παρακαλῶνται
  choice: “mapalakas ang loob” sa pangunahing teksto, na may talababa para sa “mapayuhan” at “maaliw.”
  alternative: “mapayuhan” o “maaliw” lamang sa pangunahing teksto.
  rationale: Maaaring magdala ang παρακαλέω ng diwa ng pagpapalakas-loob, pagpapayo, o pag-aliw. Ang pangunahing pagpili ay angkop sa pangkalahatang layunin ng pagpapatibay sa kapulungan nang hindi ikinukubli ang ibang lehitimong diwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “magpahayag ng propesiya” upang maiwasan ang karaniwang maling pahiwatig ng “manghula,” at pinanatili ang paulit-ulit na “lahat” na mahalaga sa retorika ng talata.
