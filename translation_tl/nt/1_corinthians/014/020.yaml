  - severity: medium
    issue: 'May maling anyo sa talababa b: “kasamang moral.”'
    rationale: Ang “kasamang moral” ay hindi wastong pagpapahayag ng kahulugang “moral evil/badness.” Maaaring gamitin ang “kabuktutan” upang maipakita ang saklaw ng salitang Griyego nang hindi nililimitahan sa interpersonal na masamang hangarin.
