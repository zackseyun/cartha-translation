  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἀδελφοί, μὴ παιδία γίνεσθε ταῖς φρεσίν, ἀλλὰ τῇ κακίᾳ νηπιάζετε, ταῖς δὲ φρεσὶν τέλειοι γίνεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/020.yaml
  text: Brothers[a], do not become children in your thinking, but be infants in evil[b]; yet in your thinking become mature.
translation:
  language: tl
  text: Mga kapatid[a], huwag kayong maging mga bata sa pag-iisip. Sa halip, maging mga sanggol kayo sa kasamaan[b], ngunit maging may-gulang kayo sa pag-iisip.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, ang salita ay nasa anyong panlalaking maramihan, ngunit ginagamit dito bilang panawag sa buong kongregasyon.
    reason: lexical_alternative
  - marker: b
    text: O “masamang hangarin”; ang Griyegong κακία ay maaaring mangahulugang kasamaan, kabuktutan, o masamang hangarin.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: Mga kapatid
  rationale: Ang pangmaramihang panawag ay likas na isinasalin sa Filipino bilang “mga kapatid,” na maaaring tumukoy sa buong kongregasyon nang hindi kailangang tukuyin ang kasarian; nililinaw sa talababa ang anyong panlalaki ng Griyego.
- source_word: παιδία
  choice: mga bata
  rationale: Tumutukoy ito sa mga bata sa pangkalahatan at nagpapanatili ng kaibahan sa mas tiyak na νηπιάζετε, “maging mga sanggol.”
- source_word: γίνεσθε
  choice: maging
  rationale: Ipinahahayag ng “maging” ang pagpasok o paglago sa isang kalagayan at napapanatili ang pag-uulit ng pandiwa sa una at huling sugnay.
- source_word: ταῖς φρεσίν / ταῖς δὲ φρεσὶν
  choice: sa pag-iisip
  rationale: Natural itong tumutukoy sa kakayahang umunawa o paraan ng pag-iisip, at malinaw na inuulit ang saklaw ng dalawang magkatapat na utos.
- source_word: τῇ κακίᾳ
  choice: sa kasamaan
  rationale: Pinananatili ng “kasamaan” ang malawak na diwang moral ng κακία; inilalagay sa talababa ang mas makitid na posibleng diwang “masamang hangarin.”
- source_word: νηπιάζετε
  choice: maging mga sanggol
  rationale: Tuwirang pinananatili ang larawang maging sanggol at ang sinadyang kaibahan nito sa “mga bata” at sa mga ganap na ang gulang.
- source_word: τέλειοι
  choice: ganap na ang gulang
  rationale: Sa konteksto, ang τέλειοι ay kabaligtaran ng pagiging bata at tumutukoy sa hustong gulang o pagkamaygulang, hindi sa kawalang-kasalanan o absolutong pagiging perpekto.
- source_word: ἀλλὰ ... δὲ
  choice: Sa halip ... ngunit
  rationale: 'Ipinakikita ng mga pang-ugnay ang dalawang magkasunod na pagtutuwid: maging sanggol tungkol sa kasamaan, ngunit nasa hustong gulang tungkol sa pag-iisip.'
theological_decisions:
- issue: Panawag sa kongregasyon na may anyong panlalaki
  choice: Gamitin ang likas at inklusibong Filipino na “Mga kapatid” sa pangunahing teksto, at ipaliwanag ang anyong Griyego sa talababa.
  alternative: “Mga kapatid na lalaki” o “Mga kapatid na lalaki at babae”
  rationale: Ang Ἀδελφοί ay anyong panlalaking maramihan ngunit karaniwang panawag sa buong kapulungan. Sa Filipino, hindi minamarkahan ng “kapatid” ang kasarian, kaya tumpak nitong naihahatid ang gamit sa konteksto habang pinananatiling malinaw sa talababa ang anyo ng pinagmulan.
- issue: Kahulugan ng τέλειοι
  choice: Unawain bilang pagiging ganap na ang gulang o may-gulang sa pag-iisip.
  alternative: “maging perpekto”
  rationale: Ang tahasang pagtutulad sa mga bata at mga sanggol ang nagpapakitang pagkamaygulang ang diin, hindi isang doktrina ng walang-salang pagiging perpekto.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang paulit-ulit na “sa pag-iisip” at ang tatluhang kaibahan ng mga bata, mga sanggol, at mga ganap na ang gulang. Ginamit ang “ganap na ang gulang” sa halip na mas abstraktong “may-gulang” upang buhayin ang metapora ng paglaki.
