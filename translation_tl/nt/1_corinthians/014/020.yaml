  source_fidelity: 'Tapat ang pangunahing istruktura at mga pagkakaiba ng talata: παιδιά/νηπιάζετε/τέλειοι ay naihiwalay bilang mga bata, mga sanggol, at pagkamaygulang; ang κακία ay wastong naipahayag bilang malawak na kasamaan. Gayunman, ang “maging ganap na ang gulang ninyo” ay hindi likas na pagbubuo sa Filipino at bahagyang lumalabo ang pang-utos na paralelismo ng γίνεσθε.'
  naturalness: Ang “Mga kapatid” at “sa pag-iisip” ay natural sa modernong Filipino. Mas malinaw at idiomatiko ang “maging may-gulang kayo sa pag-iisip” kaysa “maging ganap na ang gulang ninyo sa pag-iisip.” Dapat ding itama ang “kasamang moral” sa talababa, sapagkat mali ang anyo at hindi nito naipapahayag nang maayos ang saklaw ng κακία.
  terminology: Ang “Mga kapatid” ay angkop na panawag sa kongregasyon sa Filipino at maayos ang talababa tungkol sa anyong panlalaking maramihan ng Griyego. Ang “may-gulang” ay angkop para sa τέλειοι sa kontekstong ito; hindi nito ipinahihiwatig ang ganap na pagiging perpekto. Ang “kasamaan” ay angkop para sa κακία, na may “masamang hangarin” bilang posibleng mas makitid na alternatibo.
