base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/019.yaml
  text: But in the church I would rather speak five words with my mind[a], so that I may also instruct others, than ten thousand words in a tongue.
translation:
  language: tl
  text: Ngunit sa pagtitipon ng iglesya, mas gusto kong magsalita ng limang salita gamit ang aking isip, upang maturuan ko rin ang iba, kaysa sampung libong salita sa isang wika.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay maaari ring mangahulugang “dila.” Dito, tumutukoy ito sa uri ng pagsasalitang tinatalakay sa 1 Corinto 12–14.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ἐκκλησίᾳ
  choice: sa pagtitipon ng iglesya
  rationale: Tinutukoy rito ang nagkakatipong pamayanang Kristiyano. Nililinaw ng “pagtitipon” na hindi gusali ang tinutukoy, habang pinananatili ng “iglesya” ang karaniwang katawagan sa pamayanan.
- source_word: θέλω ... ἢ
  choice: mas gusto kong ... kaysa
  rationale: Bagaman literal na “nais ko” ang θέλω, ipinahihiwatig ng paghahambing na mas pinipili ni Pablo ang isang uri ng pagsasalita kaysa sa isa pa.
- source_word: πέντε λόγους
  choice: limang salita
  rationale: Pinananatili nito ang tuwiran at matinding paghahambing sa “sampung libong salita.”
- source_word: τῷ νοΐ μου
  choice: nang may pang-unawa
  rationale: Natural itong Tagalog para sa pagsasalitang may aktibong pag-unawa ng isip, na siyang kaibahan sa pagsasalita sa isang wikang hindi naipauunawa sa kapulungan. Hindi ito nagpapakilala ng paliwanag na wala sa teksto.
- source_word: λαλῆσαι
  choice: magsalita
  rationale: Ito ang natural at malawak na katumbas sa konteksto ng pampublikong pagsasalita.
- source_word: ἵνα καὶ ἄλλους κατηχήσω
  choice: upang maturuan ko rin ang iba
  rationale: Ang κατηχέω ay tumutukoy sa pasalitang pagtuturo. Ang “maturuan” ay malinaw at hindi nag-aangkat ng mas huling teknikal na kahulugan ng katekesis.
- source_word: μυρίους λόγους
  choice: sampung libong salita
  rationale: Pinananatili ang tiyak at dramatikong bilang ng Griyego sa halip na gawing pangkalahatang “napakaraming salita.”
- source_word: ἐν γλώσσῃ
  choice: sa isang wika
  rationale: Maaaring tumukoy ang γλῶσσα sa dila o wika at ginagamit dito para sa uri ng pagsasalitang tinatalakay sa 1 Corinto 12–14. Ang “isang wika” ay natural sa Tagalog at pinananatili ang isahan nang hindi ipinapasiya ang eksaktong kalikasan ng pangyayari.
theological_decisions:
- issue: Kahulugan ng γλῶσσα sa 1 Corinto 12–14
  choice: sa isang wika
  alternative: sa isang dila; sa mga wika
  rationale: Hindi natural sa modernong Tagalog ang literal na “sa isang dila,” samantalang babaguhin ng “sa mga wika” ang isahang anyo. Pinananatili ng “sa isang wika” ang terminolohiya ng talata nang hindi ito ipinapaliwanag bilang tiyak na banyagang wika o ekstatikong pananalita.
- issue: Ugnayan ng νοῦς sa nauunawaang pagsasalita
  choice: nang may pang-unawa
  alternative: gamit ang aking isip; sa pamamagitan ng aking isip
  rationale: Ipinapakita ng konteksto ang kaibahan ng pananalitang nakapagtuturo sa iba at pananalitang hindi nila nauunawaan. Ang salin ay hindi nagsasabing walang isip ang nagsasalita sa wika, kundi pinananatili ang diin sa nauunawaang pananalita.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “pagtitipon ng iglesya” upang maiwasang mapagkamalang gusali ang ἐκκλησία, at pinanatili ang retorikal na paghahambing ng lima at sampung libo.
