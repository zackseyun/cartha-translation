  naturalness: Ang rebisyong “gamit ang aking isip” ay malinaw at katanggap-tanggap sa modernong Filipino Tagalog sa ganitong pormal ngunit madaling unawaing rehistro. Nananatiling maayos ang retorikal na paghahambing ng limang salita at sampung libong salita.
  terminology: Ang “pagtitipon ng iglesya” ay angkop para sa ἐν ἐκκλησίᾳ at iniiwasang ituring na gusali ang iglesya. Ang “maturuan” ay tumpak at natural para sa κατηχήσω. Pinananatili ng “wika” at ng talababa ang leksikal na saklaw ng γλῶσσα nang hindi nagpapasya sa pinagtatalunang penomenon.
