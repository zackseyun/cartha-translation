id: 1CO.14.34
reference: 1 Corinthians 14:34
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Αἱ ⸀γυναῖκες ἐν ταῖς ἐκκλησίαις σιγάτωσαν, οὐ γὰρ ⸀ἐπιτρέπεται αὐταῖς λαλεῖν· ἀλλὰ ⸀ὑποτασσέσθωσαν, καθὼς καὶ ὁ νόμος λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/034.yaml
  text: The women should keep silent in the churches[a], for they are not permitted to speak, but should be in submission[c][b], just as the law also says.
translation:
  language: tl
  text: Manahimik ang mga babae sa mga iglesya[a], sapagkat hindi sila pinahihintulutang magsalita[b]. Sa halip, magpasakop sila, gaya rin ng sinasabi ng kautusan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga asawang babae sa mga iglesya”; maaaring mangahulugang “babae” o “asawang babae” ang salitang Griyego, depende sa konteksto.
    reason: alternative_reading
  - marker: b
    text: Hindi tinutukoy ng mismong talata kung anong uri ng pagsasalita ang tinutukoy; inuunawa ito ng ilan nang mas makitid batay sa nakapaligid na konteksto.
    reason: lexical_alternative
  - marker: c
    text: O “Kautusan”; maaaring partikular na tumutukoy si Pablo sa Kautusan ni Moises o, sa mas malawak na diwa, sa Kasulatan.
    reason: alternative_reading
lexical_decisions:
- source_word: γυναῖκες
  choice: mga babae
  rationale: Maaaring mangahulugang “mga babae” o “mga asawang babae” ang γυνή. Hindi tahasang binabanggit sa talata ang mga asawa nilang lalaki, kaya pinanatili sa pangunahing teksto ang mas malawak at likas na “mga babae,” habang inilagay sa talababa ang posibleng kahulugang “mga asawang babae.”
- source_word: ἐκκλησίαις
  choice: mga iglesya
  rationale: Sa gamit ni Pablo, karaniwang tumutukoy ang ἐκκλησία sa mga lokal na kapulungan ng mga mananampalataya. Ang “mga iglesya” ay natural sa modernong Filipino at maaari ring tumukoy sa mga kongregasyong nagtitipon.
- source_word: σιγάτωσαν
  choice: manahimik
  rationale: Ang kasalukuyang pautos ay humihiling ng pananahimik o pagpigil sa pagsasalita sa inilalarawang kalagayan. Ang “manahimik” ay tuwiran, natural, at umaayon sa gamit ng parehong pandiwa sa konteksto ng kaayusan sa kabanata.
- source_word: ἐπιτρέπεται
  choice: hindi sila pinahihintulutan
  rationale: Ipinahahayag ng pasibong anyo ang hindi pagbibigay ng pahintulot. Malinaw at tuwiran itong naihahatid ng “hindi sila pinahihintulutan.”
- source_word: λαλεῖν
  choice: magsalita
  rationale: Malawak at neutral ang kahulugan ng λαλέω. Hindi nililimitahan ng mismong pandiwa kung anong uri ng pagsasalita ang tinutukoy, kaya hindi nagdagdag ng mas makitid na pagpapakahulugan ang salin.
- source_word: ὑποτασσέσθωσαν
  choice: magpasakop sila
  rationale: Ang anyong pautos na middle/passive ay nagsasaad ng paglalagay ng sarili sa ilalim ng kaayusan o pagpapasakop. Natural at malinaw sa Filipino ang “magpasakop sila” nang hindi nagdaragdag ng bagay o taong pagpapasakupan na hindi tahasang nasa Griyego.
- source_word: νόμος
  choice: kautusan
  rationale: Maaaring tumukoy ang νόμος sa Kautusan ni Moises o sa kapahayagan ng Kasulatan nang mas malawak. Ang “kautusan” ay nagpapanatili sa pangkalahatang katawagan, at nililinaw ng talababa ang saklaw ng posibleng kahulugan.
- source_word: καθὼς καὶ ὁ νόμος λέγει
  choice: gaya rin ng sinasabi ng kautusan
  rationale: Pinananatili ng “gaya rin” ang paghahambing ng καθὼς at ang karagdagang diin ng καί, habang natural ang ayos sa Filipino.
theological_decisions:
- issue: Tinutukoy ng γυναῖκες
  choice: mga babae sa mga iglesya
  alternative: mga asawang babae sa mga iglesya
  rationale: Maaaring tumukoy ang salitang Griyego sa mga babae sa pangkalahatan o sa mga asawang babae. Dahil walang tahasang pagbanggit sa mga asawang lalaki sa mismong talata, ginamit sa pangunahing teksto ang mas malawak na kahulugan at pinanatili sa talababa ang alternatibo.
- issue: Saklaw ng pagbabawal na magsalita
  choice: tuwirang “magsalita,” nang hindi nililimitahan ang uri ng pagsasalita
  alternative: pagsasalitang nakagagambala o pagsasalitang kaugnay ng pagsusuri sa mga propesiya
  rationale: Ang mismong talata ay gumagamit lamang ng pangkalahatang pandiwang “magsalita.” Pinananatili ng salin ang hindi tinukoy na saklaw nito sa halip na ipasok sa pangunahing teksto ang isa sa mga pinagtatalunang paliwanag mula sa konteksto.
- issue: Kahulugan ng ὁ νόμος
  choice: ang kautusan
  alternative: ang Kautusan ni Moises; o ang Kasulatan sa mas malawak na diwa
  rationale: Hindi tiyak sa talata kung partikular na Kautusan ni Moises o mas malawak na kapahayagan ng Kasulatan ang tinutukoy. Hindi tinutukoy ng pangunahing salin ang isang natatanging sanggunian na hindi tahasang ibinigay ng teksto.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “iglesya,” “manahimik,” at “magpasakop” bilang mga pamilyar at natural na salitang panrelihiyon nang hindi nagpapasok ng denominasyonal na paliwanag. Inayos ang mga talababa sa lohikal na pagkakasunod ng mga marker sa pangunahing teksto.
