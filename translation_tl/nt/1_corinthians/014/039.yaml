base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/039.yaml
  text: So then[a], my brothers, be eager to prophesy, and do not forbid speaking in tongues.
translation:
  language: tl
  text: Kaya nga, mga kapatid ko[a], masigasig ninyong hangarin na magpahayag ng propesiya, at huwag ninyong ipagbawal ang pagsasalita ng mga wika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, panlalaking maramihan ang salitang isinaling “mga kapatid,” ngunit maaari nitong tukuyin nang inklusibo ang buong kongregasyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Kaya nga
  rationale: Nagpapahiwatig ito ng kongklusyon mula sa naunang talakayan; natural sa Filipino ang “Kaya nga” at napapanatili ang puwersang naghihinuha at nagbubuod.
- source_word: ἀδελφοί μου
  choice: mga kapatid ko
  rationale: Pinananatili ang tahasang κλητική na may “ko.” Bagaman panlalaking maramihan ang anyong Griyego, natural na walang kasariang itinatakda ang “mga kapatid” sa Filipino at maaari nitong tukuyin ang buong kongregasyon.
- source_word: ζηλοῦτε
  choice: hangarin ninyo
  rationale: Ang kasalukuyang pautos ay nananawagan ng patuloy at masigasig na paghahangad. Malinaw at dignified sa modernong Filipino ang “hangarin ninyo.”
- source_word: τὸ προφητεύειν
  choice: makapagsalita ng propesiya
  rationale: Inihahayag ang gawaing tinutukoy ng articular infinitive. Ang “makapagsalita ng propesiya” ay natural at iniiwasang ipakahulugan ito bilang pag-aari lamang ng abstraktong kaloob na “propesiya.”
- source_word: μὴ κωλύετε
  choice: huwag ninyong ipagbawal
  rationale: Tuwirang ipinapahayag ang pagbabawal ng present imperative na may μή; ang “ipagbawal” ang pinakamalapit sa kontekstong tagubilin sa kongregasyon.
- source_word: τὸ λαλεῖν γλώσσαις
  choice: ang pagsasalita sa mga wika
  rationale: Pinananatili ang articular infinitive bilang pangalan ng gawain at ang idiomang “mga wika,” na ang tiyak na katangian ay nililinaw ng talakayan sa kabanata nang hindi ito labis na ipinapakahulugan.
theological_decisions:
- issue: Kung ang ἀδελφοί ay tumutukoy lamang sa mga lalaki o sa buong kongregasyon
  choice: mga kapatid ko
  alternative: mga kapatid kong lalaki / mga kapatid kong lalaki at babae
  rationale: Panlalaking maramihan ang anyong Griyego ngunit maaari itong gamiting pangkalahatang tawag sa magkakahalong pangkat. Ang “mga kapatid” ay likas na inklusibo sa Filipino, habang ipinapaliwanag ng talababa ang anyong pinagmulan.
- issue: Kahulugan ng γλώσσαις sa konteksto
  choice: sa mga wika
  alternative: sa mga dila / sa ibang mga wika
  rationale: Ang literal na salita ay maaaring mangahulugang “mga dila” o “mga wika,” ngunit sa kontekstong ito tumutukoy ito sa paraan ng pagsasalita. Hindi idinaragdag ang “ibang” dahil wala itong tahasang katumbas sa talata.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang “ninyo” para sa pangmaramihang pakikipag-usap at pinanatili ang tuwirang himig ng apostolikong tagubilin.
