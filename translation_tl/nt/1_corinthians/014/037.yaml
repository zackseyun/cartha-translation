  text: Εἴ τις δοκεῖ προφήτης εἶναι ἢ πνευματικός, ἐπιγινωσκέτω ἃ γράφω ὑμῖν ὅτι κυρίου ⸀ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/037.yaml
  text: If anyone thinks he is a prophet or spiritual[a], let him recognize that what I am writing to you is a command of the Lord.
translation:
  language: tl
  text: Kung inaakala ng sinuman na siya ay isang propeta o taong espirituwal, kilalanin niya na ang isinusulat ko sa inyo ay utos ng Panginoon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ay ng Panginoon” o “ay pag-aari ng Panginoon.” Walang tahasang salitang “utos” sa Griyego; idinagdag ito sa salin upang linawin ang ipinahihiwatig na diwa sa konteksto.
    reason: alternative_reading
lexical_decisions:
- source_word: δοκεῖ
  choice: inaakala
  rationale: Ipinahahayag nito ang sariling pagturing o pag-aangkin ng isang tao, habang pinananatili ang bahagyang mapanuring tono ng konteksto.
- source_word: προφήτης
  choice: propeta
  rationale: Ito ang karaniwang katumbas at malinaw sa konteksto ng mga kaloob at pagsasalitang propetiko.
- source_word: πνευματικός
  choice: taong espirituwal
  rationale: Ginagawang natural sa Tagalog ang pang-uring ginamit bilang pangngalan, ngunit hindi nililimitahan ang kahulugan sa isang partikular na espirituwal na kaloob.
- source_word: ἐπιγινωσκέτω
  choice: kilalanin niya
  rationale: Pinananatili ang pautos na diwa ng pagkilala o tahasang pagtanggap sa awtoridad ng isinulat.
- source_word: ἃ γράφω ὑμῖν
  choice: ang isinusulat ko sa inyo
  rationale: Natural na ipinapahayag sa Tagalog ang kasalukuyang kilos ng pagsulat ng liham.
- source_word: κυρίου ἐστίν
  choice: ay utos ng Panginoon
  rationale: Ipinahahayag nito ang ipinahihiwatig na banal na awtoridad sa konteksto; nililinaw sa talababa na walang tahasang salitang 'utos' sa Griyego.
theological_decisions:
- issue: Ang eliptikong pariralang κυρίου ἐστίν
  choice: ay utos ng Panginoon
  alternative: ay sa Panginoon / ay pag-aari ng Panginoon
  rationale: Sa konteksto, iginiit ni Pablo ang nagbubuklod na awtoridad ng Panginoon sa kaniyang tagubilin. Gayunman, dahil literal na mas malawak ang pariralang Griyego, pinananatili sa talababa ang tunay na ambiguwidad.
- issue: Kasariang pambalarila sa τις ... προφήτης ... πνευματικός
  choice: siya ... niya
  alternative: ang taong iyon
  rationale: Ang mga panghalip na Tagalog ay walang kasariang pambalarila, kaya natural na naisasalin ang panlalaking anyong Griyego nang hindi nagdaragdag o nag-aalis ng tiyak na kasarian sa kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “taong espirituwal” sa halip na ang mas teknikal na “pinagkalooban ng Espiritu” upang mapanatili ang lawak ng πνευματικός. Inilagay ang pananda ng talababa sa sugnay na aktuwal nitong nililinaw.
