  text: Let two or three prophets speak[a], and let the others weigh what is said.
translation:
  language: tl
  text: Magsalita ang dalawa o tatlong propeta, at suriin ng iba ang kanilang sinabi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kilatisin,” “timbangin,” o “hatulan.” Ang pandiwang Griyego ay maaaring tumukoy sa maingat na pagtatasa sa propetikong pahayag.
    reason: lexical_alternative
lexical_decisions:
- source_word: προφῆται
  choice: mga propeta
  rationale: Tuwirang tumutukoy ang pangngalan sa mga propeta o mga nagsasalita bilang propeta; pinananatili ng saling ito ang katawagan ng Griyego nang hindi ito nililinaw nang higit sa teksto.
- source_word: δὲ
  choice: hindi isinalin nang hiwalay
  rationale: Mahinang panandang pang-ugnay ito sa sunod-sunod na tagubilin. Likas sa Tagalog na ipahiwatig ang paglipat sa daloy ng pangungusap nang walang tahasang katumbas.
- source_word: δύο ἢ τρεῖς
  choice: dalawa o tatlo
  rationale: Tuwirang pinananatili ang bilang at ang alternatibong ipinahahayag ng ἢ.
- source_word: λαλείτωσαν
  choice: ang magsalita
  rationale: Ipinahahayag ng anyong pautos ang pahintulot na may regulasyon o tagubilin; natural sa Tagalog ang hulma na “ang magsalita” sa ganitong konteksto.
- source_word: οἱ ἄλλοι
  choice: ng iba
  rationale: Pinananatiling pangkalahatan ang tinutukoy, gaya ng Griyego, nang hindi nagpapasiya kung sila ay ibang propeta, mga pinuno, o ang iba pang nasa kapulungan.
- source_word: διακρινέτωσαν
  choice: suriin
  rationale: Sa kontekstong ito, tumutukoy ang pandiwa sa maingat na pagtatasa o pagkilatis sa propetikong pahayag, hindi lamang sa paghatol o paghatol nang may parusa.
theological_decisions:
- issue: Kung sino ang tinutukoy na “iba”
  choice: Pinanatili ang pangkalahatang “iba.”
  alternative: “ibang mga propeta” o “iba pang nasa kapulungan”
  rationale: Hindi tahasang tinutukoy ng Griyego kung aling pangkat ang dapat magsuri, kaya hindi nilulutas ng salin ang tanong na iniwang bukas ng teksto.
- issue: Ano ang sinusuri
  choice: Idinagdag ang likas na layon na “ang kanilang sinabi.”
  alternative: “suriin” nang walang tahasang layon
  rationale: Nauunawaan sa konteksto na propetikong pananalita ang sinusuri. Ginagawang malinaw at natural ito sa Tagalog nang hindi binabago ang diwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang payak na “suriin” para madaling maunawaan, samantalang inilagay sa talababa ang iba pang posibleng kulay ng kahulugan.
