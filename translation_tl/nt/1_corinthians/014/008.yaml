  text: For if the trumpet gives an unclear sound[b][a], who will prepare for battle?
translation:
  language: tl
  text: Sapagkat kung magbigay ang trumpeta ng hindi malinaw na tunog[a], sino ang maghahanda para sa labanan[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “malabong tunog.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “para sa digmaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Sapagkat
  rationale: Ipinahahayag nito ang paliwanag na kaugnay ng naunang argumento; natural at malinaw ang “Sapagkat” sa modernong Tagalog.
- source_word: ἐὰν
  choice: kung
  rationale: Ang kondisyunal na “kung” ang likas na katumbas sa Tagalog sa halimbawang ito.
- source_word: ἄδηλον
  choice: hindi malinaw
  rationale: Tumutukoy ito sa tunog na hindi madaling makilala o maunawaan bilang hudyat; pinananatili ng parirala ang lawak ng kahulugan.
- source_word: φωνὴν
  choice: tunog
  rationale: Bagaman maaari itong mangahulugang “tinig,” ang tinutukoy rito sa konteksto ng trumpeta ay ang tunog na inilalabas nito.
- source_word: σάλπιγξ
  choice: trumpeta
  rationale: Karaniwan at madaling maunawaang katawagan sa instrumentong ginagamit bilang hudyat militar.
- source_word: δῷ
  choice: ang tunog ng trumpeta
  rationale: Sa halip na literal na “magbigay ng tunog,” ginamit ang likas na ayos na “kung hindi malinaw ang tunog” nang hindi binabago ang diwa ng Griyego.
- source_word: τίς
  choice: sino
  rationale: Direkta at natural na panimula ng retorikal na tanong.
- source_word: παρασκευάσεται
  choice: maghahanda
  rationale: Ipinahihiwatig ng anyong middle ang paghahanda ng isang tao sa sarili; natural na naipapaloob ito sa “maghahanda” sa Tagalog.
- source_word: εἰς πόλεμον
  choice: para sa labanan
  rationale: Sa konteksto ng hudyat ng trumpeta, ang “labanan” ay mas tiyak at natural kaysa “digmaan,” samantalang ang literal na alternatibo ay inilagay sa talababa.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikling retorikal na tanong at ang larawang militar, habang iniwasan ang alanganing literalismong “magbigay ng tunog.”
