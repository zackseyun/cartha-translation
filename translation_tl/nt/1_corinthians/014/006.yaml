id: 1CO.14.6
reference: 1 Corinthians 14:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀Νῦν δέ, ἀδελφοί, ἐὰν ἔλθω πρὸς ὑμᾶς γλώσσαις λαλῶν, τί ὑμᾶς ὠφελήσω, ἐὰν μὴ ὑμῖν λαλήσω ἢ ἐν ἀποκαλύψει ἢ ἐν γνώσει ἢ ἐν προφητείᾳ ἢ ἐν διδαχῇ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/006.yaml
  text: Now[a], brothers, if I come to you speaking in tongues[b], what will I benefit you unless I speak to you either by revelation or by knowledge or by prophecy or by teaching?
translation:
  language: tl
  text: Ngayon, mga kapatid[a], kung pumunta ako sa inyo na nagsasalita sa mga wika[b], ano ang maitutulong ko sa inyo malibang magsalita ako sa inyo sa pamamagitan ng kapahayagan, kaalaman, propesiya, o pagtuturo?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga kapatid” ay maaaring tumukoy sa mga kapatid na lalaki at babae; ang salitang Griyego ay panlalaking pangmaramihan ngunit maaari itong gamitin sa isang magkakahalong kongregasyon.
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, maaari ring isaling “mga dila.” Dito, tumutukoy ito sa penomenong tinatalakay sa 1 Corinto 12–14; hindi nililinaw ng salita mismo ang eksaktong kalikasan ng mga wikang ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: Νῦν δέ
  choice: Ngayon
  rationale: Likas na pananda ng paglipat sa kasalukuyang punto ng pangangatwiran ni Pablo; hindi nito labis na pinatitindi ang bahaging pasalungat ng δέ.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Ang “mga kapatid” ay likas at marangal na tawag sa Filipino at maaaring tumukoy sa buong kongregasyon, bagaman panlalaking pangmaramihan ang anyong Griyego.
- source_word: γλώσσαις λαλῶν
  choice: nagsasalita sa mga wika
  rationale: Pinananatili ng “mga wika” ang leksikal na kahulugan ng γλῶσσα at ang kaugnayan nito sa penomenong tinatalakay sa 1 Corinto 12–14, nang hindi ipinapasiya ang eksaktong kalikasan nito.
- source_word: τί ὑμᾶς ὠφελήσω
  choice: ano ang maitutulong ko sa inyo
  rationale: Natural na Filipino para sa pakinabang o tulong na matatanggap ng mga kausap; malinaw nitong naihahayag ang praktikal na diin ng ὠφελέω.
- source_word: ἐὰν μὴ
  choice: kung hindi
  rationale: Natural na katumbas sa Filipino ng kondisyong negatibo; sa pangungusap na ito, ipinahahayag nito ang diwang “maliban kung.”
- source_word: λαλήσω
  choice: magsasalita
  rationale: Pinananatili ang leksikal na ugnayan sa naunang λαλῶν at ang pokus sa pasalitang pakikipag-usap.
- source_word: ἐν ἀποκαλύψει
  choice: sa pamamagitan ng pahayag
  rationale: Ang ἐν ay inuunawang instrumental o modal; ang “pahayag” ay tumutukoy sa bagay na inihahayag o ibinubunyag ng Diyos.
- source_word: ἐν γνώσει
  choice: sa pamamagitan ng kaalaman
  rationale: Pinananatili ang instrumental na diwa at ang pagkakapantay-pantay ng apat na parirala.
- source_word: ἐν προφητείᾳ
  choice: sa pamamagitan ng propesiya
  rationale: Tuwirang katumbas na hindi nililimitahan ang propesiya sa paghula lamang at pinananatili ang kategorya ni Pablo.
- source_word: ἐν διδαχῇ
  choice: sa pamamagitan ng pagtuturo
  rationale: Natural na Filipino para sa διδαχή at kaagapay ng iba pang anyo ng malinaw at kapaki-pakinabang na pananalita.
theological_decisions:
- issue: Saklaw ng ἀδελφοί bilang tawag sa kongregasyon
  choice: mga kapatid
  alternative: mga kapatid na lalaki; mga kapatid na lalaki at babae
  rationale: Ang karaniwang “mga kapatid” sa Filipino ay hindi kailangang limitado sa mga lalaki at natural na sumasaklaw sa magkakahalong kongregasyon, habang hindi nagdaragdag ng mga salitang wala sa Griyego.
- issue: Kahulugan ng γλώσσαις sa kabanatang ito
  choice: mga wika
  alternative: mga dila; mga wikang kaloob ng Espiritu
  rationale: Ang “mga wika” ay nagpapanatili sa tunay na leksikal at kontekstuwal na lawak ng termino. Hindi nito ipinapasiya kung ang penomeno ay ordinaryong wikang pantao, ekstatikong pananalita, o ibang uri ng espirituwal na pananalita.
- issue: Gamit ng ἐν sa apat na magkakaparis na parirala
  choice: sa pamamagitan ng
  alternative: taglay ang; tungkol sa
  rationale: Malamang na instrumental o modal ang ἐν dito. Ipinakikita ng salin na ang pahayag, kaalaman, propesiya, at pagtuturo ang paraan o nilalaman ng pananalitang nakatutulong, nang hindi ginagawang ganap na tiyak ang hangganan ng mga kategoryang ito.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “ano ang maitutulong ko sa inyo” sa halip na mas literal ngunit di-likas na anyo, at pinanatili ang maindayog na apat na magkakaparis na kategorya sa hulihan.
