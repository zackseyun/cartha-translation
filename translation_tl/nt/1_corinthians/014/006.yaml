  to: Ngayon, mga kapatid[a], kung pumunta ako sa inyo na nagsasalita sa mga wika[b], ano ang maitutulong ko sa inyo malibang magsalita ako sa inyo sa pamamagitan ng kapahayagan, kaalaman, propesiya, o pagtuturo?
  rationale: Pinalitan ang “kung hindi ako magsasalita” ng “malibang magsalita ako” upang malinaw na maipahayag ang force ng ἐὰν μὴ. Pinalitan ang “pahayag” ng “kapahayagan” para sa ἀποκάλυψις, at pinasimple ang magkahanay na listahan upang maging natural sa Filipino habang pinananatili ang instrumental na diwa ng ἐν.
