  naturalness: Makinis at marangal ang karamihan ng salin. Mas tuwiran at natural sa modernong Filipino ang “malibang magsalita ako” para sa ganitong retorikal na tanong. Ang magkakaparis na listahan ay magiging mas malinaw kung isang beses lamang gagamitin ang “sa pamamagitan ng” at magkakahanay ang apat na pangngalan.
