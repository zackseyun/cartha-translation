id: 1CO.14.26
reference: 1 Corinthians 14:26
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Τί οὖν ἐστιν, ἀδελφοί; ὅταν συνέρχησθε, ⸀ἕκαστος ψαλμὸν ἔχει, διδαχὴν ἔχει, ⸂ἀποκάλυψιν ἔχει, γλῶσσαν⸃ ἔχει, ἑρμηνείαν ἔχει· πάντα πρὸς οἰκοδομὴν γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/026.yaml
  text: What then is it[a], brothers? When you come together, each one has a psalm, has a teaching, has a revelation, has a tongue, has an interpretation[b]. Let all things be done for building up.
translation:
  language: tl
  text: Ano ngayon ang ibig sabihin nito, mga kapatid[a]? Kapag nagtitipon kayo, ang bawat isa ay may salmo, may aral, may kapahayagan, may pagsasalita sa wika[b], may pagpapakahulugan. Gawin ang lahat para sa pagpapatibay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga kapatid” dito ay tumutukoy sa buong kongregasyon, kabilang ang mga babae at mga lalaki.
    reason: lexical_alternative
  - marker: b
    text: O, “pagsasalita sa dila.” Ang salitang Griyego ay maaaring mangahulugang dila o wika; hindi tiyak sa katawagan lamang kung anong uri ng pananalita ang tinutukoy.
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐστιν
  choice: Ano ngayon ang ibig sabihin nito
  rationale: Likas na Filipino para sa retorikal na tanong na naghahatid sa praktikal na buod ni Pablo, habang pinananatili ang diwa ng Griyego.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Sa Filipino, likas na tumutukoy ang “mga kapatid” sa mga lalaki at babae; pinananatili rin nito ang pampamilyang tawag sa kongregasyon.
- source_word: ὅταν συνέρχησθε
  choice: Kapag nagtitipon kayo
  rationale: Ipinahihiwatig ng “kapag” ang paulit-ulit o pangkalahatang pagkakataon ng pagtitipon, gaya ng ὅταν na may subjunctive.
- source_word: ἕκαστος
  choice: ang bawat isa
  rationale: 'Malinaw na pinananatili ang distributibong diin: sari-saring ambag ang dala ng bawat kalahok.'
- source_word: ψαλμὸν
  choice: salmo
  rationale: Pinananatili ang tiyak na katawagan sa isang awit ng papuri sa halip na palawakin ito bilang anumang awit.
- source_word: διδαχὴν
  choice: aral
  rationale: Karaniwan at malinaw na Filipino para sa nilalamang itinuturo; hindi nito ipinahihiwatig ang isang ganap nang sistemang doktrinal.
- source_word: ἀποκάλυψιν
  choice: kapahayagan
  rationale: Angkop na katawagan sa isang bagay na inihahayag o ibinubunyag sa kapulungan nang hindi dinaragdagan ang sinasabi ng teksto.
- source_word: γλῶσσαν
  choice: pagsasalita sa isang wika
  rationale: Nagiging natural sa Filipino ang literal na “may wika” habang pinananatiling bukas kung anong uri ng wika o pananalita ang tinutukoy.
- source_word: ἑρμηνείαν
  choice: pagpapakahulugan
  rationale: Tumutukoy sa pagbibigay ng mauunawaang kahulugan sa sinabi sa isang wika, nang hindi makitid na ipinapalagay na karaniwang pagsasalin lamang ito.
- source_word: πρὸς οἰκοδομὴν
  choice: para sa ikatitibay ng kapulungan
  rationale: Inihahatid sa natural na Filipino ang talinghaga ng pagpapatayo bilang sama-samang pagpapatibay; ang kapulungan ang malinaw na tinutukoy sa konteksto.
- source_word: γινέσθω
  choice: Gawin
  rationale: Malinaw na pautos sa Filipino na tumutugma sa imperatibong puwersa ng Griyego.
theological_decisions:
- issue: Saklaw ng ἀδελφοί sa pagtawag sa kongregasyon
  choice: mga kapatid
  alternative: mga kapatid na lalaki at babae
  rationale: Ang “mga kapatid” sa modernong Filipino ay likas na inklusibo at hindi kailangang pahabain sa pangunahing teksto; nililinaw ng talababa na buong kongregasyon ang kinakausap.
- issue: Kahulugan ng γλῶσσα sa 1 Corinto 12–14
  choice: pagsasalita sa isang wika
  alternative: pagsasalita sa ibang wika; pagsasalita sa dila
  rationale: Hindi tahasang pinagpapasyahan ng salin kung kilalang wikang pantao, ekstatikong pananalita, o mas malawak na penomenon ang tinutukoy. Ang talababa ay nagpapanatili sa leksikal na saklaw ng Griyego.
- issue: Tinutukoy ng οἰκοδομή
  choice: ikatitibay ng kapulungan
  alternative: pagpapatibay; ikauunlad ng lahat
  rationale: Sa konteksto ng sama-samang pagtitipon, ang komunidad ang pinatitibay. Ginagawang malinaw ito sa Filipino nang hindi nag-aangkat ng denominasyonal na kahulugan.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa pagbasa sa kapulungan. Pinanatili ang maindayog na pag-uulit ng “may,” ngunit ginawang natural ang pariralang tungkol sa γλῶσσα. Ginamit ang “kapulungan” upang tukuyin ang nagtitipong komunidad nang hindi umaasa sa isang denominasyonal na katawagan.
