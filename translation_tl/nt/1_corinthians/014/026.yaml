- from: Ano ngayon ang ibig sabihin nito, mga kapatid[a]? Kapag nagtitipon kayo, ang bawat isa ay may salmo, may aral, may kapahayagan, may pagsasalita sa isang wika[b], o may pagpapakahulugan. Gawin ang lahat para sa ikatitibay ng kapulungan.
  to: Ano ngayon ang ibig sabihin nito, mga kapatid[a]? Kapag nagtitipon kayo, ang bawat isa ay may salmo, may aral, may kapahayagan, may pagsasalita sa wika[b], may pagpapakahulugan. Gawin ang lahat para sa pagpapatibay.
