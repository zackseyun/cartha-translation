  text: ἐὰν οὖν μὴ εἰδῶ τὴν δύναμιν τῆς φωνῆς, ἔσομαι τῷ λαλοῦντι βάρβαρος καὶ ὁ λαλῶν ἐν ἐμοὶ βάρβαρος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/011.yaml
  text: Therefore[a], if I do not know the meaning of the voice, I will be a foreigner to the one speaking[b], and the one speaking will be a foreigner to me.
translation:
  language: tl
  text: Kaya, kung hindi ko alam ang kahulugan ng tinig[a], magiging banyaga ako para sa nagsasalita[b], at ang nagsasalita ay magiging banyaga sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lakas ng tinig”; ibig sabihin, ang kabuluhan o diwang ipinahihiwatig ng tinig.
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “barbaro”; dito ay tumutukoy sa taong nagsasalita ng banyagang wika o may pananalitang hindi nauunawaan, hindi kinakailangang di-sibilisado.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Kaya, kung
  rationale: Likas na ipinapakita sa Tagalog ang lohikal na bunga ng οὖν at ang kondisyon ng ἐὰν.
- source_word: μὴ εἰδῶ
  choice: hindi ko alam
  rationale: Pinananatili ang pangunahing diwa ng οἶδα na ‘malaman,’ habang malinaw pa rin sa konteksto.
- source_word: τὴν δύναμιν τῆς φωνῆς
  choice: ang kahulugan ng tinig
  rationale: Sa konteksto, ang δύναμις ay ang kabuluhan o diwang ipinahihiwatig ng φωνή; ‘kahulugan ng tinig’ ay malinaw at nananatiling malapit sa anyo ng Griyego.
- source_word: τῷ λαλοῦντι
  choice: sa nagsasalita
  rationale: Natural at tuwirang katumbas ng substantival participle.
- source_word: βάρβαρος
  choice: banyaga
  rationale: Dito ay tumutukoy sa taong banyaga o hindi nauunawaan sa pananalita, hindi kinakailangang ‘barbaro’ o di-sibilisado.
- source_word: ἐν ἐμοὶ
  choice: sa akin
  rationale: Natural na relational na katumbas sa katugmang pahayag ng talata.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang ‘tinig’ upang mapanatili ang φωνή at ang ‘banyaga’ upang maipahayag ang ugnayang dulot ng hindi pagkakaunawaan sa wika.
