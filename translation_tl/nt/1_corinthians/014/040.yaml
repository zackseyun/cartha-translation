translation:
  language: tl
  text: Ngunit gawin ang lahat nang naaangkop[a] at may kaayusan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nang marapat”; tumutukoy ang salitang Griyego sa bagay na angkop o nararapat.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: ang lahat
  rationale: Pinananatili ang malawak at sumasaklaw na diwa ng neuter plural sa isang natural na pariralang Tagalog.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig ang banayad na pagsalungat o paglipat tungo sa pangwakas na tagubilin.
- source_word: εὐσχημόνως
  choice: nang naaangkop
  rationale: Ipinapahayag ang pagkilos na angkop, marapat, at nararapat sa konteksto ng pagtitipon; natural ito sa modernong Tagalog nang hindi nililimitahan sa panlabas na disente lamang.
- source_word: κατὰ τάξιν
  choice: maayos
  rationale: Ipinapahayag ang pagsunod sa wastong kaayusan o pagkakasunod-sunod sa malinaw at karaniwang Tagalog.
- source_word: γινέσθω
  choice: gawin
  rationale: Ang ikatlong-panauhang pautos ay likas na naipapahayag sa Tagalog bilang pangkalahatang tagubiling gawin ang lahat sa ganitong paraan.
theological_decisions:
- issue: Saklaw ng utos ni Pablo sa konteksto ng pagsamba
  choice: Isang pangkalahatang tagubilin na maging angkop at maayos ang lahat sa pagtitipon
  alternative: Isang tuntuning nag-uutos ng iisang nakapirming pormal na ayos ng pagsamba, o isang prinsipyong tahasang sumasaklaw sa lahat ng gawain ng iglesya
  rationale: Binubuod ng talata ang agarang talakayan tungkol sa pagsasalita at kaayusan sa kapulungan. Pinananatili ng salin ang pangkalahatang saklaw ng Griyego nang hindi nagdaragdag ng partikular na modelong denominasyonal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “naaangkop” upang ihatid ang εὐσχημόνως nang hindi maging lipas o labis na pormal; ang “maayos” ay natural na katumbas ng κατὰ τάξιν sa konteksto.
