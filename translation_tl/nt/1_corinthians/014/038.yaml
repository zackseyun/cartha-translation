translation:
  language: tl
  text: Ngunit kung may sinumang hindi kumikilala rito[a][b], hindi rin siya kinikilala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “kung may sinumang hindi nagbibigay-pansin dito … hindi rin siya pinapansin.” Iisang pandiwang Griyego ang ginamit sa aktibo at pasibong anyo upang makabuo ng retorikal na pag-uugnay.
    reason: lexical_alternative
  - marker: b
    text: 'Sa ilang manuskrito, “kung may sinumang walang kaalaman, hayaan siyang manatiling walang kaalaman.” Ang tekstong sinunod dito ay may pasibong anyong paturol: “kung may sinumang hindi kumikilala, hindi rin siya kinikilala.”'
    reason: textual_variant
lexical_decisions:
- source_word: εἰ
  choice: kung
  rationale: Karaniwang panandang kondisyon na hindi nagpapasya kung totoo o hindi ang ipinapalagay na kalagayan.
- source_word: δέ
  choice: ngunit
  rationale: Ipinahihiwatig ang pagsalungat sa naunang pahayag tungkol sa pagkilala sa mga salita ni Pablo bilang utos ng Panginoon.
- source_word: τις
  choice: may … sinuman (ipinahayag bilang “may hindi”)
  rationale: Pangkalahatang tumutukoy sa sinumang tao; ang hulma na “kung may hindi” ay likas sa modernong Filipino.
- source_word: ἀγνοεῖ
  choice: hindi kumikilala
  rationale: Sa konteksto ng talata 37, tumutukoy ito sa hindi pagkilala o hindi pagkilala bilang may bisa sa apostolikong tagubilin. Hindi nito sapilitang nililimitahan ang diwa sa kawalan lamang ng kaalaman.
- source_word: ἀγνοεῖται
  choice: hindi … kinikilala
  rationale: 'Pinananatili ang pasibong anyo at ang retorikal na pag-uulit ng parehong pandiwa: ang hindi kumikilala ay hindi rin kinikilala. Hindi tinutukoy ang gumaganap, gaya ng Griyego.'
theological_decisions:
- issue: Diwa at di-tinukoy na tagaganap ng pasibong ἀγνοεῖται
  choice: “hindi rin siya kinikilala,” na maaaring magpahiwatig ng katugon o mapanghatol na bunga nang hindi tinutukoy kung sino ang hindi kumikilala sa kanya
  alternative: “hindi siya pinapansin”; “hindi siya kinikilala ng Diyos”; o, ayon sa ibang tekstuwal na pagbasa, “hayaan siyang manatiling walang kaalaman”
  rationale: Ang piniling tekstong Griyego ay pasibong pangkasalukuyang paturol, hindi pautos. Ang salin ay nagpapanatili sa pasibo, sa ugnayan ng dalawang anyo ng ἀγνοέω, at sa sadyang hindi pagbanggit sa tagaganap; sa gayon ay hindi nito nilulutas nang lampas sa teksto kung ang tinutukoy ay ang iglesya, ang Diyos, o kapuwa.
translation_notes:
  register: Modernong Filipino na maikli, dignificado, at madaling maunawaan. Ginamit ang “rito” upang likas na ipahayag ang ipinahihiwatig na layon mula sa konteksto, ngunit hindi tinukoy nang higit sa Griyego kung ano mismo ang saklaw nito. Pinanatili ng “kumikilala/kinikilala” ang pandiwang pag-uulit at ang teolohikal na tensiyon ng hindi pinangalanang tagaganap.
