  yaml_path: translation/nt/1_corinthians/014/009.yaml
  text: 'So also with you: if through the tongue you do not give intelligible speech[a], how will what is spoken be understood? For you will be speaking into the air.'
translation:
  language: tl
  text: 'Gayon din kayo: kung sa pamamagitan ng dila ay hindi kayo magbibigay ng pananalitang malinaw na mauunawaan[a], paano mauunawaan ang sinasabi? Sapagkat magsasalita kayo sa hangin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “malinaw na pananalita” o “mensahe na madaling makilala.” Binibigyang-diin ng salitang Griyego ang pananalitang malinaw at mauunawaan ng mga nakikinig.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: Gayon din naman kayo
  rationale: Likas na Tagalog na nag-uugnay sa naunang paghahalintulad at tuwirang kumakausap sa mga taga-Corinto.
- source_word: διὰ τῆς γλώσσης
  choice: sa pamamagitan ng dila
  rationale: Pinananatili ang kongkretong larawan ng dila at ang diwa ng paraang ginagamit sa pagsasalita.
- source_word: ἐὰν μὴ εὔσημον λόγον δῶτε
  choice: kung ... hindi kayo magsasalita nang malinaw at mauunawaan
  rationale: Ipinahahayag nang natural sa Tagalog ang pagbibigay ng pananalitang madaling makilala at maunawaan; ang literal na 'magbigay ng salita' ay magiging αwkward at maaaring magmukhang iisang salita lamang ang tinutukoy.
- source_word: πῶς γνωσθήσεται τὸ λαλούμενον
  choice: paano mauunawaan ang sinasabi?
  rationale: Sa konteksto ng pakikipagtalastasan, ang pasibong γινώσκω ay tumutukoy sa pagkaunawa ng nakikinig; ang substantibong participle ay natural na isinaling 'ang sinasabi.'
- source_word: ἔσεσθε γὰρ εἰς ἀέρα λαλοῦντες
  choice: Sapagkat para lamang kayong nagsasalita sa hangin
  rationale: Pinananatili ang metapora ng pagsasalitang walang nakauunawa; ang 'para lamang' ay natural na naghahayag ng bunga nang hindi ginagawang literal na pagbabago ng pagkakakilanlan.
