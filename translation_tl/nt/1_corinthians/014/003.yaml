  yaml_path: translation/nt/1_corinthians/014/003.yaml
  text: But the one who prophesies speaks to people for edification and encouragement and consolation[a][b][c].
translation:
  language: tl
  text: Ngunit ang nagpapahayag ng propesiya ay nagsasalita sa mga tao para sa kanilang pagpapatibay[a], pagpapalakas ng loob[b], at pag-aliw[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagpapatatag.” Literal na tumutukoy ang salita sa pagtatayo ng isang gusali.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang isinaling “pagpapalakas ng loob” ay maaari ring mangahulugang “paghihimok” o, sa ilang konteksto, “pagbibigay-aliw.”
    reason: lexical_alternative
  - marker: c
    text: O “pagbibigay-ginhawa” o “pagbibigay ng kaaliwan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ προφητεύων
  choice: Ngunit ang nagpapahayag ng propesiya
  rationale: Ang may pantukoy na pangkasalukuyang participle ay tumutukoy sa taong gumagawa ng kilos. Pinananatili ng “nagpapahayag ng propesiya” ang lawak ng kahulugan ng προφητεύω nang hindi ito nililimitahan sa pangangaral o panghuhula. Ipinahahayag ng “ngunit” ang banayad na pagsalungat ng δέ sa naunang talata.
- source_word: ἀνθρώποις
  choice: sa mga tao
  rationale: Ang datibong maramihan ay tumutukoy sa mga nakikinig. Pangkalahatan at hindi lamang panlalaki ang kahulugan nito.
- source_word: λαλεῖ
  choice: nagsasalita
  rationale: Tuwirang isinasalin ang pangkasalukuyang anyo ng λαλέω at likas itong iugnay sa “sa mga tao” sa Filipino.
- source_word: οἰκοδομὴν
  choice: para sa kanilang pagpapatibay
  rationale: Ginagamit dito ang metapora ng pagtatayo para sa espirituwal na pagpapalago o pagpapalakas. Mas malinaw sa karaniwang mambabasa ang “pagpapatibay” kaysa sa teknikal na “edipikasyon,” habang pinananatili ang anyong pangngalan ng tatluhang pahayag.
- source_word: παράκλησιν
  choice: pagpapalakas ng loob
  rationale: Maaaring mangahulugan ang παράκλησις ng paghihimok, pagpapalakas ng loob, o pag-aliw. Ang “pagpapalakas ng loob” ay likas sa modernong Filipino at naihihiwalay sa mas mapagpaginhawang diwa ng παραμυθία.
- source_word: παραμυθίαν
  choice: pag-aliw
  rationale: Tumutukoy ang παραμυθία sa pananalitang nagbibigay-aliw, ginhawa, o kaaliwan. Pinananatili ng “pag-aliw” ang pagkakaiba nito sa naunang “pagpapalakas ng loob.”
theological_decisions:
- issue: Kahulugan ng προφητεύων sa pagtitipon ng iglesya
  choice: nagpapahayag ng propesiya
  alternative: nangangaral; nagpapahayag ng isang pahayag mula sa Diyos; nanghuhula
  rationale: Inilalarawan ng talata ang epekto ng propesiya sa mga nakikinig ngunit hindi nito lubos na binibigyang-kahulugan ang gawain. Kaya pinananatili ang teolohikal na lawak at tensiyon ng termino nang hindi ipinapasok ang isang denominasyonal na paliwanag.
- issue: Ugnayan ng tatlong pangngalan sa pandiwang “nagsasalita”
  choice: para sa kanilang pagpapatibay, pagpapalakas ng loob, at pag-aliw
  alternative: nagsasalita ng pagpapatibay, pagpapalakas ng loob, at pag-aliw
  rationale: Maaaring ilarawan ng mga akusatibong pangngalan ang nilalaman o bunga/layunin ng pagsasalita. Ang “para sa” ay natural sa Filipino at tumutugma sa malinaw na praktikal na epekto sa konteksto, nang hindi ginagawang lubhang tiyak ang mekanismo ng propesiya.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Iniwasan ang teknikal at di-karaniwang “edipikasyon” at ang posibleng mapanlinlang na “nanghuhula.” Pinanatili ang tatluhang anyong pangngalan ng Griyego at inilagay ang bawat talababa sa mismong katumbas na salita.
