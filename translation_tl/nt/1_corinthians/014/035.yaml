  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰ δέ τι ⸀μαθεῖν θέλουσιν, ἐν οἴκῳ τοὺς ἰδίους ἄνδρας ἐπερωτάτωσαν, αἰσχρὸν γάρ ἐστιν γυναικὶ ⸂λαλεῖν ἐν ἐκκλησίᾳ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/035.yaml
  text: But if they want to learn anything[a], let them ask their own husbands at home[b], for it is shameful for a woman to speak in the assembly.
translation:
  language: tl
  text: Ngunit kung may nais silang matutuhan, magtanong sila sa kani-kanilang asawang lalaki sa bahay, sapagkat kahiya-hiya para sa isang babae[a] ang magsalita sa kapulungan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “asawang babae.” Maaaring mangahulugang “babae” o “asawang babae” ang salitang Griyego, depende sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: O “sa iglesya” o “sa kongregasyon”; tumutukoy ang salitang Griyego sa nagkakatipong kapulungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθεῖν
  choice: matutuhan
  rationale: Tuwirang ipinapahayag nito ang pagkatuto o pagkaalam; natural ang anyong “matutuhan” kasunod ng “nais.”
- source_word: ἐν οἴκῳ
  choice: sa bahay
  rationale: Ito ang natural na katumbas sa Filipino at pinananatili ang kaibahan ng tahanan sa nagkakatipong kapulungan.
- source_word: τοὺς ἰδίους ἄνδρας
  choice: ang kani-kanilang asawa
  rationale: Sa pariralang may ἰδίους at sa kontekstong pantahanan, malinaw na tumutukoy ang ἄνδρας sa mga asawang lalaki. Ang “kani-kanilang” ay likas na naghahayag ng distributibong diwa ng “their own.”
- source_word: ἐπερωτάτωσαν
  choice: tanungin nila
  rationale: Pinananatili nito ang pautos na lakas ng pandiwa at natural itong pakinggan sa makabagong Filipino.
- source_word: αἰσχρὸν
  choice: kahiya-hiya
  rationale: Pinananatili nito ang panlipunan at moral na bigat ng salitang Griyego nang hindi ito pinahihina tungo sa “di-angkop” lamang.
- source_word: γυναικὶ
  choice: para sa isang babae
  rationale: Maaaring mangahulugang “babae” o “asawang babae” ang γυνή. Ginamit sa pangunahing teksto ang mas pangkalahatang “babae,” habang inilagay sa talababa ang posibleng kahulugang “asawang babae.”
- source_word: λαλεῖν
  choice: magsalita
  rationale: Malawak at tuwirang katumbas ito ng λαλεῖν at hindi nito nililimitahan ang uri ng pagsasalitang tinutukoy.
- source_word: ἐν ἐκκλησίᾳ
  choice: sa kapulungan
  rationale: Tumutukoy rito ang ἐκκλησία sa nagkakatipong sambayanan. Iniiwasan ng “kapulungan” ang di-kinakailangang pahiwatig na gusali o institusyon.
theological_decisions:
- issue: Saklaw ng pahayag tungkol sa pagsasalita ng mga babae
  choice: Isalin ang sugnay ayon sa malawak na pagkakasabi nito nang hindi tinutukoy sa pangunahing teksto ang isang partikular na uri ng pagsasalita.
  alternative: Limitahan ito sa magulong pagtatanong, sa pagsusuri ng mga propesiya, o ituring itong sipi ng pananaw ng mga taga-Corinto.
  rationale: Sinasabi lamang ng Griyego na kahiya-hiya para sa isang babae ang magsalita sa kapulungan. Hindi tahasang tinutukoy ng mga salita mismo ang eksaktong saklaw, kaya pinananatili ng salin ang interpretatibong tensiyon.
- issue: Kung babae/asawang babae at lalaki/asawang lalaki ang kahulugan ng γυνή at ἀνήρ
  choice: Gamitin ang “asawa” para sa ἄνδρας at “babae” para sa γυναικί, at banggitin sa talababa ang “asawang babae” bilang alternatibo.
  alternative: Gamitin ang asawang babae/asawang lalaki sa kabuuan, o babae/mga lalaki sa kabuuan.
  rationale: Malakas na ipinahihiwatig ng “kani-kanilang” at ng kontekstong pantahanan na mga asawa ang tinutukoy ng ἄνδρας. Maaaring pangkalahatang “babae” o kontekstuwal na “asawang babae” ang γυναικί, kaya hindi inaalis ang ikalawang posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “kapulungan” upang idiin ang pagtitipon ng mga tao, at “kani-kanilang asawa” upang natural na maipahayag ang distributibong diwa ng pariralang Griyego.
