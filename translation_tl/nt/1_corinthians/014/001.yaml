  text: Διώκετε τὴν ἀγάπην, ζηλοῦτε δὲ τὰ πνευματικά, μᾶλλον δὲ ἵνα προφητεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/001.yaml
  text: Pursue love[a], and earnestly desire the spiritual things[c][b], but especially that you may prophesy.
translation:
  language: tl
  text: Pagsikapan ninyo ang pag-ibig, at taimtim ninyong hangarin ang mga bagay na espirituwal[a], lalo na ang makapagpahayag ng propesiya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kaloob na espirituwal” o “mga bagay ng Espiritu.” Mas malawak ang salitang Griyego kaysa sa “mga kaloob,” ngunit sa kontekstong ito ay nakatuon ito sa mga pagpapahayag na ibinibigay ng Espiritu sa kapulungan.
    reason: lexical_alternative
  - marker: b
    text: O “ngunit higit sa lahat, hangarin ninyong makapagpahayag ng propesiya.”
    reason: alternative_reading
lexical_decisions:
- source_word: Διώκετε
  choice: Sikapin ninyong mamuhay
  rationale: Ipinahahayag ng διώκετε ang masigasig at patuloy na paghahangad. Sa Tagalog, ang pariralang ito ay natural at aktibo, at naiiwasan ang di-likas na literal na 'habulin' kapag pag-ibig ang layon.
- source_word: τὴν ἀγάπην
  choice: sa pag-ibig
  rationale: Ang 'pag-ibig' ang karaniwan at malinaw na salin ng ἀγάπη at pinananatili ang tuwirang ugnayan sa kabanata 13.
- source_word: ζηλοῦτε
  choice: taimtim ninyong hangarin
  rationale: Ipinakikita nito ang matindi at positibong pagnanais na taglay ng ζηλοῦτε, sa dignified at likas na modernong Tagalog.
- source_word: τὰ πνευματικά
  choice: ang mga bagay na espirituwal
  rationale: Neutrong pangmaramihan at sadyang malawak ang pariralang Griyego. Pinananatili ng salin ang lawak nito sa halip na idagdag sa pangunahing teksto ang mas tiyak na 'mga kaloob,' bagaman mga pagpapahayag na bigay ng Espiritu ang pokus ng konteksto.
- source_word: μᾶλλον δὲ
  choice: lalo na
  rationale: Natural nitong ipinahahayag ang paghahambing at pagtatangi sa propesiya. Hindi kailangang isalin nang hiwalay ang δὲ bilang 'ngunit' dahil ang Tagalog na 'lalo na' ay malinaw na nag-uugnay at nagbibigay-diin.
- source_word: ἵνα προφητεύητε
  choice: ang makapagpahayag kayo ng propesiya
  rationale: Pinananatili nito ang nilalaman o layon ng paghahangad na ipinahahayag ng ἵνα at subjunctive, sa natural na ayos ng Tagalog.
- source_word: προφητεύητε
  choice: makapagpahayag ... ng propesiya
  rationale: Malinaw at nauunawaan ito sa modernong Tagalog habang pinananatili ang kinikilalang biblikal na kategorya ng propesiya.
theological_decisions:
- issue: Saklaw ng τὰ πνευματικά
  choice: mga bagay na espirituwal
  alternative: mga kaloob na espirituwal
  rationale: Pormal na mas malawak ang Griyego kaysa sa 'mga kaloob.' Bagaman nakatuon ang 1 Corinto 12–14 sa mga pagpapahayag o kaloob ng Espiritu sa kapulungan, hindi tahasang nililimitahan ng parirala ang kahulugan nito; kaya pinanatili sa teksto ang tunay na lawak at ipinaliwanag ang konteksto sa talababa.
- issue: Lakas ng pagtatangi ni Pablo sa propesiya
  choice: lalo na ang makapagpahayag kayo ng propesiya
  alternative: sa halip, hangarin ninyong makapagpahayag ng propesiya
  rationale: Ipinakikita ng μᾶλλον δὲ ang higit na pagpapahalaga sa propesiya sa kontekstong ito, ngunit hindi nito kinakailangang itanggi ang pagnanais sa iba pang espirituwal na bagay.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang maramihang 'ninyo/kayo' upang ipakita na ang mga utos ay para sa buong kapulungan. Iniwasan ang labis na teknikal o denominasyonal na pananalita.
