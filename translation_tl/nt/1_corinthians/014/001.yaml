    rationale: Ang μᾶλλον δὲ ay nagmamarka ng higit na pagbibigay-diin o pagpili, hindi kinakailangang pag-aalis ng iba pang espirituwal na bagay.
  revised_text: Pagsikapan ninyo ang pag-ibig, at taimtim ninyong hangarin ang mga bagay na espirituwal[a], lalo na ang makapagpahayag ng propesiya.[b]
