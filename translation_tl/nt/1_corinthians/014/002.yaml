  text: ὁ γὰρ λαλῶν γλώσσῃ οὐκ ἀνθρώποις λαλεῖ ⸀ἀλλὰ θεῷ, οὐδεὶς γὰρ ἀκούει, πνεύματι δὲ λαλεῖ μυστήρια·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/002.yaml
  text: For the one speaking in a tongue does not speak to people but to God, for no one understands; rather, he speaks mysteries in the Spirit.
translation:
  language: tl
  text: Sapagkat ang nagsasalita sa isang wika ay hindi nagsasalita sa mga tao kundi sa Diyos, sapagkat walang nakauunawa[a]; sa halip, nagsasalita siya ng mga hiwaga sa espiritu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “walang nakaririnig.” Ang pandiwang Griyego ay maaaring mangahulugang “makarinig” o, ayon sa ipinahihiwatig ng konteksto, “makaunawa.”
    reason: lexical_alternative
  - marker: b
    text: O, “sa Espiritu.” Maaaring tumukoy ang pariralang Griyego sa Banal na Espiritu o sa espiritu ng nagsasalita.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ λαλῶν
  choice: ang nagsasalita
  rationale: Ginagamit ang artikulo at pangkasalukuyang participle bilang pangngalan. Likas sa Tagalog ang “ang nagsasalita” at napapanatili nito ang pangkalahatang isahan nang hindi tinutukoy ang kasarian.
- source_word: γλώσσῃ
  choice: sa isang wika
  rationale: Pinananatili ang isahang anyo at ang di-tiyak na katangian ng tinutukoy. Hindi ginawang “ibang wika” upang hindi magdagdag ng salitang wala sa talata, at hindi rin nilinaw kung kilalang wikang pantao o espirituwal na pananalita ang ibig sabihin.
- source_word: ἀνθρώποις
  choice: sa mga tao
  rationale: Pangkalahatan at hindi tumutukoy lamang sa mga lalaki ang pangngalang maramihan.
- source_word: θεῷ
  choice: sa Diyos
  rationale: Tuwirang katumbas ng dative object ng λαλεῖ.
- source_word: ἀκούει
  choice: nakauunawa
  rationale: Bagaman pangunahing nangangahulugang “nakaririnig,” ipinahihiwatig ng konteksto ng kabanata na walang nakauunawa sa sinasabi. Inilagay sa talababa ang literal na alternatibo.
- source_word: πνεύματι
  choice: sa Espiritu
  rationale: Pinananatili ang anyong may “sa,” na hindi tahasang nagpapasya kung kasangkapan o kalagayan ang dative. Posibleng tumukoy sa Banal na Espiritu, habang inilalahad sa talababa ang posibilidad na espiritu ng nagsasalita ang tinutukoy.
- source_word: μυστήρια
  choice: mga hiwaga
  rationale: Napapanatili ng “mga hiwaga” ang teolohikal na bigat at di-gaanong nililinaw ang kahulugan kumpara sa “mga lihim na katotohanan.”
- source_word: δὲ
  choice: sa halip
  rationale: Malinaw at likas na ipinahahayag ang pagsalungat sa naunang pahayag.
theological_decisions:
- issue: Tinutukoy ng πνεύματι
  choice: sa Espiritu
  alternative: sa espiritu, na maaaring tumukoy sa espiritu ng nagsasalita
  rationale: Maaaring tumukoy ang pariralang Griyego sa Banal na Espiritu o sa espiritu ng taong nagsasalita. Ginamit sa pangunahing teksto ang isang makatuwirang pagbasa, ngunit pinanatili sa talababa ang tunay na teolohikal at sintaktikong kalabuan.
- issue: Kahulugan ng ἀκούει sa konteksto
  choice: nakauunawa
  alternative: nakaririnig
  rationale: Ang paksa sa konteksto ay ang pagkaunawa sa pananalita, ngunit leksikal na posible ang literal na “nakaririnig”; kaya hindi inalis ang alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang pag-uulit ng “nagsasalita” upang maipakita ang diin ng Griyego. Ginamit ang “hiwaga” sa halip na mas paliwanag na paraphrase, at iniwasan ang salitang “ibang” bago ang “wika” dahil wala itong tahasang katumbas sa tekstong Griyego.
