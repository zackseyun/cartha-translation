revisions:
- from: Ano ngayon ang dapat gawin? Mananalangin ako sa pamamagitan ng espiritu,[a] ngunit mananalangin din ako sa pamamagitan ng isip; aawit ako ng papuri sa pamamagitan ng espiritu,[b] ngunit aawit din ako ng papuri sa pamamagitan ng isip.[c]
  to: Ano ngayon ang dapat gawin? Mananalangin ako sa espiritu,[a] ngunit mananalangin din ako sa isip; aawit ako ng papuri sa espiritu,[b] ngunit aawit din ako ng papuri sa isip.[c]
  rationale: Pinalitan ang “sa pamamagitan ng espiritu/isip” ng “sa espiritu/isip” upang huwag ipataw ang instrumental na pagbasa sa datibong Griyego, mapanatili ang kalabuan ng πνεῦμα, at maipakita ang sinadyang paralelismo sa pagitan ng espiritu at isip. Inayos din ang talababa a upang hindi nito ulitin ang naging pangunahing salin.
