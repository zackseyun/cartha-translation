base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/015.yaml
  text: What then is to be done? I will pray with the spirit[a], but I will also pray with the mind; I will sing praise with the spirit[c][b], but I will also sing praise with the mind.
translation:
  language: tl
  text: Ano ngayon ang dapat gawin? Mananalangin ako sa espiritu,[a] ngunit mananalangin din ako sa isip; aawit ako ng papuri sa espiritu,[b] ngunit aawit din ako ng papuri sa isip.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa pamamagitan ng espiritu” o “sa tulong ng espiritu.” Hindi tahasang nililinaw ng Griyego kung ang “espiritu” ay tumutukoy sa Espiritu Santo, sa espiritu ng nagsasalita, o sa espirituwal na pagbigkas.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “aawit ako” o “tutugtog ako ng himig.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “nang may pagkaunawa” sa halip na “sa isip.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τί οὖν ἐστιν;
  choice: Ano ngayon ang dapat gawin?
  rationale: Ipinahahayag nito ang praktikal na kongklusyon ng retorikal na tanong, sa likas at malinaw na modernong Tagalog.
- source_word: προσεύξομαι
  choice: mananalangin ako
  rationale: Tuwirang katumbas ito ng anyong panghinaharap ng προσεύχομαι.
- source_word: τῷ πνεύματι
  choice: sa pamamagitan ng espiritu
  rationale: Pinananatili nito ang posibleng instrumental na diwa ng datibo at hindi tinutukoy kung Espiritu Santo, espiritu ng tao, o espirituwal na pagbigkas ang ibig sabihin.
- source_word: τῷ νοΐ
  choice: sa pamamagitan ng isip
  rationale: Tinutukoy ng νοῦς ang kakayahang umunawa at mag-isip; pinananatili rin ng parirala ang pagkakapantay ng anyo sa 'sa pamamagitan ng espiritu.'
- source_word: ψαλῶ
  choice: aawit ako ng papuri
  rationale: Sa konteksto ng pagsamba, ang ψάλλω ay tumutukoy sa pag-awit ng papuri, hindi lamang sa pangkalahatang pag-awit.
- source_word: δὲ καὶ
  choice: ngunit ... din
  rationale: Ipinakikita nito ang pagdaragdag na may banayad na pagtatambis sa pagitan ng espiritu at isip.
theological_decisions:
- issue: Kahulugan ng πνεῦμα sa pagtatambis ng espiritu at isip
  choice: espiritu
  alternative: Espiritu Santo; sarili kong espiritu
  rationale: Hindi tahasang nililinaw ng Griyego kung ang tinutukoy ay ang Espiritu Santo, espiritu ng nagsasalita, o espirituwal na pagbigkas. Kaya pinananatili ng salin ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang magkatulad na pariralang “sa pamamagitan ng” upang mapanatili ang paralelismo ng πνεύμα at νοῦς, habang inilalagay sa talababa ang mga likas na alternatibo.
