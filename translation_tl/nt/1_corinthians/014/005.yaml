  to: Nais kong magsalita kayong lahat sa mga wika, ngunit mas nais kong magpahayag kayo ng propesiya. Ang nagpapahayag ng propesiya ay higit kaysa sa nagsasalita sa mga wika, maliban kung magpapaliwanag siya[a], upang mapatibay ang iglesya[b].
