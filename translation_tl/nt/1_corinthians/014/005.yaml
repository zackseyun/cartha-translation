id: 1CO.14.5
reference: 1 Corinthians 14:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: θέλω δὲ πάντας ὑμᾶς λαλεῖν γλώσσαις, μᾶλλον δὲ ἵνα προφητεύητε· μείζων ⸀δὲ ὁ προφητεύων ἢ ὁ λαλῶν γλώσσαις, ἐκτὸς εἰ μὴ ⸀διερμηνεύῃ, ἵνα ἡ ἐκκλησία οἰκοδομὴν λάβῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/005.yaml
  text: I want all of you to speak in tongues[a], but even more that you would prophesy. The one who prophesies is greater than the one who speaks in tongues, unless he interprets[b], so that the church may receive edification.
translation:
  language: tl
  text: Nais kong magsalita kayong lahat sa mga wika, ngunit mas nais kong magpahayag kayo ng propesiya. Ang nagpapahayag ng propesiya ay higit kaysa sa nagsasalita sa mga wika, maliban kung magpapaliwanag siya[a], upang mapatibay ang iglesya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “maliban kung may magpaliwanag.” Ang pang-isahang pandiwa sa Griyego ay maaaring tumukoy sa mismong nagsasalita sa mga wika o, ayon sa mas malawak na konteksto, sa pagbibigay ng paliwanag ng ibang tao.'
    reason: alternative_reading
  - marker: b
    text: 'Ang “mapatibay” ay gumagamit ng larawang gaya ng pagtatayo: espirituwal na mapalakas at makinabang ang nagkakatipong kapulungan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλω
  choice: Nais ko
  rationale: Tuwirang ipinahahayag ang personal na hangarin ni Pablo sa isang dignified ngunit likas na modernong Tagalog.
- source_word: πάντας ὑμᾶς
  choice: kayong lahat
  rationale: Malinaw na pinananatili ang maramihan at ang saklaw na tumutukoy sa buong kapulungan.
- source_word: λαλεῖν γλώσσαις
  choice: magsalita sa mga wika
  rationale: Pinananatili ang literal na larawan ng γλῶσσα at ang karaniwang terminolohiya sa 1 Corinto 12–14 nang hindi ipinapalagay kung mga likas na wikang banyaga o ibang uri ng pananalita ang tinutukoy.
- source_word: μᾶλλον δὲ
  choice: ngunit higit kong nais
  rationale: Ipinapakita ang paghahambing ng kagustuhan, hindi ang pagtanggi sa pagsasalita sa mga wika.
- source_word: ἵνα προφητεύητε
  choice: na magpahayag kayo ng propesiya
  rationale: Natural sa modernong Tagalog at ipinahahayag ang nilalaman ng nais ni Pablo; mas malinaw ito sa ordinaryong mambabasa kaysa sa pandiwang 'magpropesiya.'
- source_word: μείζων
  choice: ay higit
  rationale: Pinananatili ang paghahambing ng Griyego nang hindi isinasalin bilang mas banal o mas mataas ang personal na katayuan.
- source_word: ὁ προφητεύων
  choice: ang nagpapahayag ng propesiya
  rationale: Pinananatili ang pangkalahatang substantival participle at ang pagkilos bilang batayan ng paghahambing.
- source_word: ὁ λαλῶν γλώσσαις
  choice: ang nagsasalita sa mga wika
  rationale: Kaagapay ng naunang participial expression at natural sa Tagalog.
- source_word: ἐκτὸς εἰ μὴ
  choice: maliban kung
  rationale: Karaniwan at malinaw na katumbas ng exception clause.
- source_word: διερμηνεύῃ
  choice: ipapaliwanag niya ang sinabi
  rationale: Ang pang-isahang pandiwa ay pinakamalapit na tumutukoy sa nagsasalita; ang 'ipapaliwanag ang sinabi' ay malinaw na naghahatid ng pagbibigay-kahulugan sa kapulungan, samantalang itinatala sa talababa ang posibleng ibang tagapagpaliwanag.
- source_word: ἡ ἐκκλησία
  choice: ang iglesya
  rationale: Karaniwang terminong Kristiyano sa Tagalog; sa konteksto, tumutukoy ito sa nagkakatipong kapulungan.
- source_word: οἰκοδομὴν λάβῃ
  choice: mapatibay
  rationale: Natural na Tagalog para sa metaporang pagtatayo o pagpapalakas ng kapulungan, at mas madaling maunawaan kaysa sa literal na 'tumanggap ng pagpapatibay.'
theological_decisions:
- issue: Paghihigit ng propesiya sa pagsasalita sa mga wika
  choice: Pinanatili ang payak na paghahambing na 'ay higit,' habang hinahayaang ipaliwanag ng layuning 'upang mapatibay ang iglesya' ang kontekstuwal na batayan nito.
  alternative: Isaling 'mas mahalaga' o ipakahulugang mas mataas sa espirituwal na ranggo.
  rationale: Ipinapakita ng sugnay ng layunin na kapakinabangan sa kapulungan ang pinag-uusapan, ngunit hindi dapat alisin sa salin ang tahasang lakas ng μείζων.
- issue: Tinutukoy na gumagawa ng διερμηνεύῃ
  choice: 'Ang nagsasalita sa mga wika ang pinakamalapit na paksa: ''ipapaliwanag niya.'''
  alternative: May ibang taong magpapaliwanag, o basta may maibigay na paliwanag.
  rationale: Walang tahasang bagong paksa sa pang-isahang pandiwa, kaya natural itong iugnay sa naunang pang-isahang nagsasalita. Gayunman, ipinahihintulot ng mas malawak na konteksto ang ibang tagapagpaliwanag, kaya pinanatili iyon sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “mga wika” upang mapanatili ang leksikal at kontekstuwal na kalabuan ng γλώσσαις, “magpahayag ng propesiya” para sa malinaw na ordinaryong gamit, at “iglesya” para sa nagkakatipong pamayanang Kristiyano.
