base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/014.yaml
  text: For if I pray in a tongue[a], my spirit prays[b], but my mind is unfruitful.
translation:
  language: tl
  text: Sapagkat kung nananalangin ako sa isang wika[a], nananalangin ang espiritu ko, ngunit hindi namumunga ang isip ko.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa isang dila.” Ang salitang Griyego ay maaaring tumukoy sa isang wikang pantao o sa “dila” bilang pananalitang kaloob ng Espiritu, gaya ng gamit sa kabanatang ito.
    reason: lexical_alternative
  - marker: b
    text: O “ngunit hindi namumunga ang pagkaunawa ko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: Sapagkat kung
  rationale: Pinananatili ng “sapagkat” ang paliwanag na ugnayan ng γάρ sa naunang argumento, at ng “kung” ang kondisyon ng ἐάν.
- source_word: προσεύχωμαι
  choice: nananalangin ako
  rationale: Natural na kasalukuyang anyo sa Filipino para sa present subjunctive sa kondisyong ito.
- source_word: γλώσσῃ
  choice: sa isang wika
  rationale: Maaaring tumukoy ang γλῶσσα sa wika o sa “dila”; ang “wika” ay malinaw at natural sa Filipino, habang ipinapaliwanag ng talababa ang natatanging gamit nito sa kabanata.
- source_word: τὸ πνεῦμά μου
  choice: ang espiritu ko
  rationale: Tuwirang sinasalamin ang possessive at pinananatili ang malamang na pagtukoy sa espiritu ng nagsasalita, nang hindi nagdaragdag ng interpretasyong wala sa Griyego.
- source_word: ὁ δὲ νοῦς μου
  choice: ngunit … ang isip ko
  rationale: Ang “isip” ang malawak at tuwirang katumbas ng νοῦς at pinananatili ang paghahambing sa “espiritu.”
- source_word: ἄκαρπός ἐστιν
  choice: hindi namumunga
  rationale: Pinananatili ang metapora ng ἄκαρπος sa natural na Filipino sa halip na paliitin ito sa “walang nauunawaan” o gawing abstraktong “hindi produktibo.”
theological_decisions:
- issue: Tinutukoy ng “ang espiritu ko” (τὸ πνεῦμά μου)
  choice: espiritu ng mismong nagsasalita
  alternative: ang Banal na Espiritu na nasa loob ng nagsasalita
  rationale: Ang possessive na “ko” at ang paghahambing sa “isip ko” ay pumapabor sa dalawang aspekto ng nagsasalita. Gayunman, hindi nilalagyan ng dagdag na paliwanag ang pangunahing teksto upang hindi lubusang isara ang teolohikal na usapin.
- issue: Kalikasan ng γλώσσῃ
  choice: “sa isang wika,” na maaaring tumukoy sa pananalitang kaloob ng Espiritu sa konteksto
  alternative: “sa isang dila” o tahasang “sa wikang hindi ko nauunawaan”
  rationale: Ang “wika” ay leksikal at natural, samantalang ang talababa ang nagpapanatili sa saklaw at tensiyon ng termino nang hindi ipinapalagay kung ito ay karaniwang wikang pantao o ibang uri ng pananalita.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “nananalangin” kaysa “nagdarasal” upang tumugma sa karaniwang rehistrong biblikal nang hindi nagiging lipas. Pinanatili ang metaporang “namumunga” at ang pagkakaiba ng “espiritu” at “isip.”
