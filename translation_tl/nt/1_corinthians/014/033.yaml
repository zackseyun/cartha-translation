base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/033.yaml
  text: For God is not a God of disorder but of peace[b][a], as in all the churches of the saints.
translation:
  language: tl
  text: Sapagkat ang Diyos ay hindi Diyos ng kaguluhan kundi ng kapayapaan,[a] gaya rin ng nangyayari sa lahat ng iglesya ng mga banal.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Sapagkat ang Diyos ay hindi Diyos ng kalituhan kundi ng kapayapaan.”'
    reason: lexical_alternative
  - marker: b
    text: Iniuugnay naman ng ilan ang pariralang “gaya rin ng nangyayari sa lahat ng iglesya ng mga banal” sa kasunod na talata sa halip na sa talatang ito.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκαταστασίας
  choice: kaguluhan
  rationale: Saklaw nito ang kawalan ng kaayusan sa sama-samang pagsamba at maaari ring tumukoy sa kalituhan; mas natural ito sa modernong Tagalog kaysa sa mas abstraktong “kawalang-kaayusan.”
- source_word: εἰρήνης
  choice: kapayapaan
  rationale: Karaniwang katumbas ito ng εἰρήνη at malinaw na kasalungat ng kaguluhan sa konteksto.
- source_word: ὁ θεὸς
  choice: ang Diyos
  rationale: Ipinahihiwatig ng tiyak na artikulong Griyego ang personal at tiyak na Diyos; natural sa Tagalog ang “ang Diyos.”
- source_word: γάρ
  choice: Sapagkat
  rationale: Ipinakikita nito na ang pahayag ay nagbibigay ng dahilan para sa naunang tagubilin tungkol sa kaayusan sa pagtitipon.
- source_word: ὡς
  choice: gaya ng sa
  rationale: Pinananatili ang maikli at bahagyang masiksik na paghahambing sa Griyego nang hindi nililinaw nang higit sa sinasabi ng teksto.
- source_word: ἐκκλησίαις
  choice: mga iglesya
  rationale: Karaniwan at angkop na tawag sa mga lokal na kapulungan ng mga mananampalataya sa kontekstong Paulino.
- source_word: τῶν ἁγίων
  choice: ng mga banal
  rationale: Pinananatili ang karaniwang katawagang Paulino para sa mga mananampalataya at ang ugnayang leksikal nito sa kabanalan.
theological_decisions:
- issue: Pagkakabit ng pariralang ὡς ἐν πάσαις ταῖς ἐκκλησίαις τῶν ἁγίων
  choice: Ikinabit sa talata 33 bilang paghahambing o pagtukoy sa lahat ng iglesya
  alternative: Ikabit sa kasunod na talata bilang panimula ng bagong pangungusap
  rationale: Sinusunod ng pangunahing teksto ang bantas ng ibinigay na SBLGNT, ngunit inilalahad sa talababa ang tunay na kalabuan sa sintaks at pagkakabaha-bahagi ng pangungusap.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “iglesya” at “mga banal” upang mapanatili ang pamilyar na bokabularyong biblikal; hindi inayos nang labis ang siksik na huling parirala upang mapanatili ang tunay na sintaktikong kalabuan.
