  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐπεὶ ἐὰν ⸀εὐλογῇς ⸀πνεύματι, ὁ ἀναπληρῶν τὸν τόπον τοῦ ἰδιώτου πῶς ἐρεῖ τὸ Ἀμήν ἐπὶ τῇ σῇ εὐχαριστίᾳ; ἐπειδὴ τί λέγεις οὐκ οἶδεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/016.yaml
  text: Otherwise[a], if you bless in the spirit, how will the one filling the place of the uninstructed say the Amen at your thanksgiving[c][b], since he does not know what you are saying?
translation:
  language: tl
  text: Sapagkat kung nagpapahayag ka ng pagpapala sa espiritu[b], paano masasabi ng isang taong walang sapat na kaalaman[a] ang “Amen” sa iyong pagpapasalamat[c], gayong hindi niya alam ang sinasabi mo?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tagalabas,” “karaniwang tao,” o “hindi naturuan.” Ang salitang Griyego ay maaaring tumukoy sa isang taong walang natatanging kaalaman o hindi nakauunawa sa sinasabi.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “gamit ang espiritu” o “sa pamamagitan ng espiritu.” Hindi hinihingi ng Griyego ang mas tiyak na pagpapakahulugan dito.
    reason: alternative_reading
  - marker: c
    text: Ang “pagpapasalamat” dito ay tumutukoy sa pagbibigay ng pasasalamat, at hindi kinakailangang sa kalaunang teknikal na katawagang “Eukaristiya.”
    reason: cultural_note
lexical_decisions:
- source_word: ἐπεὶ ἐὰν
  choice: Kung hindi naman, kapag
  rationale: Ipinahihiwatig ng parirala ang kahihinatnan o ibang kalagayang kaugnay ng naunang pangangatwiran. Likas sa Tagalog ang “Kung hindi naman, kapag” at pinananatili nito ang kondisyunal na diwa.
- source_word: εὐλογῇς
  choice: nagpapahayag ka ng pagpapala
  rationale: Tumutukoy ang pandiwa sa binibigkas na pagpapala o papuri sa pagsamba. Mas malinaw sa karaniwang Tagalog ang “nagpapahayag ng pagpapala” kaysa sa payak na “nagpapala” sa kontekstong ito.
- source_word: πνεύματι
  choice: sa espiritu
  rationale: Maaaring ipakahulugan ang datibo bilang saklaw o paraan. Hindi tinutukoy ng salin kung ito ay espiritu ng tao o pananalitang pinakikilos ng Espiritu.
- source_word: ὁ ἀναπληρῶν τὸν τόπον τοῦ ἰδιώτου
  choice: ang taong nasa kalagayan ng walang sapat na kaalaman
  rationale: Ipinahahayag nito ang taong sumasakop sa posisyon ng ἰδιώτης sa kapulungan, habang itinatampok ang kawalan niya ng sapat na pagkaunawa sa sinasabi.
- source_word: πῶς ἐρεῖ τὸ Ἀμήν
  choice: paano masasabi ... ang “Amen”
  rationale: Pinananatili ang kinaugaliang tugon ng pagsang-ayon sa sama-samang pagsamba at natural ang ayos ng pangungusap sa Tagalog.
- source_word: ἐπὶ τῇ σῇ εὐχαριστίᾳ
  choice: sa iyong pagpapasalamat
  rationale: Ang εὐχαριστία rito ay kilos o pahayag ng pasasalamat. Hindi nito kinakailangang tukuyin ang kalaunang teknikal na katawagang “Eukaristiya.”
- source_word: ἐπειδὴ τί λέγεις οὐκ οἶδεν
  choice: gayong hindi niya alam ang sinasabi mo
  rationale: Tuwirang inilalahad nito ang dahilan kung bakit hindi makatutugon ng “Amen” ang nakikinig; pinananatili ng “alam” ang payak na diwa ng οἶδεν.
theological_decisions:
- issue: Kahulugan ng πνεύματι sa konteksto ng pagsamba
  choice: sa espiritu
  alternative: sa pamamagitan ng Espiritu; gamit ang iyong espiritu
  rationale: Hindi sapilitang nilulutas ng Griyego kung ang tinutukoy ay espiritu ng nagsasalita o pananalitang pinakikilos ng Espiritu. Pinananatili ng salin ang tunay na kalabuan.
- issue: Kahulugan ng εὐχαριστίᾳ
  choice: pagpapasalamat
  alternative: Eukaristiya
  rationale: Ang agarang konteksto ay tungkol sa nauunawaang pasasalamat na binibigkas sa pagtitipon. Ang teknikal na sakramental na kahulugan ay hindi hinihingi ng teksto.
- issue: Pagkakakilanlan ng ἰδιώτης
  choice: walang sapat na kaalaman
  alternative: tagalabas; karaniwang tao; hindi naturuan
  rationale: Sa konteksto, pangunahing suliranin ang hindi pagkaunawa sa binibigkas. Gayunman, hindi tiyak kung ganap na tagalabas, karaniwang dumadalo, o taong hindi naturuan ang tinutukoy, kaya inilalahad sa talababa ang mga posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Amen” bilang pamilyar na tugon ng pagsang-ayon sa pagsamba. Iniwasan ang labis na teknikal o denominasyonal na pananalita, at pinanatili sa mga talababa ang mahahalagang leksikal at teolohikal na posibilidad.
