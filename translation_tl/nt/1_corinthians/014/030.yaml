  naturalness: Mas natural sa makabagong Filipino ang "may maihayag sa isa pang nakaupo" kaysa "may ihayag sa ibang nakaupo." Ang "naunang nagsasalita" ay malinaw at angkop sa konteksto, ngunit ang pautos na "tumahimik" ay mas idiomatiko kapag sinamahan ng "na" upang ipakitang dapat siyang huminto.
