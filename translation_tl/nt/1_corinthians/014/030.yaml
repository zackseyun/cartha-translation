  text: But if a revelation is given to another who is seated[b][a], let the first be silent.
translation:
  language: tl
  text: Ngunit kung may maihayag sa isa pang nakaupo[a], tumahimik na ang naunang nagsasalita.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kung may isang bagay na maihayag sa isa pang nakaupo.”
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, dapat huminto sa pagsasalita ang naunang nagsasalita upang makapagsalita ang isa pa.
    reason: contextual_clarification
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: Ngunit kung
  rationale: Ipinapakita ng δὲ ang bahagyang pagsalungat o bagong hakbang sa tagubilin, at ipinapahayag ng ἐὰν ang kondisyon.
- source_word: ἄλλῳ
  choice: sa ibang
  rationale: Tumutukoy ito sa ibang kalahok na naiiba sa kasalukuyang nagsasalita; natural at maikli ang parirala sa Filipino.
- source_word: ἀποκαλυφθῇ
  choice: may ihayag
  rationale: Pinananatili nito ang diwang pasibo ng paghahayag nang hindi tahasang pinapangalanan ang gumagawa, gaya ng Griyego.
- source_word: καθημένῳ
  choice: nakaupo
  rationale: Tuwirang inilalarawan ang ibang kalahok bilang nakaupo sa kapulungan.
- source_word: ὁ πρῶτος
  choice: ang naunang nagsasalita
  rationale: Bagaman literal na 'ang una,' malinaw sa konteksto na ito ang taong unang nagsasalita; nililinaw ito sa natural na Filipino.
- source_word: σιγάτω
  choice: tumahimik
  rationale: Pinananatili ang pautos na lakas ng pandiwa at sa konteksto ay nangangahulugang huminto sa pagsasalita upang makapagsalita ang iba.
theological_decisions:
- issue: Kalikasan at pinagmulan ng paghahayag sa pagtitipon
  choice: Isinalin bilang 'may ihayag' nang hindi tahasang tinutukoy ang Diyos bilang gumagawa.
  alternative: '''may ihayag ang Diyos'' o ''tumanggap ng isang pahayag'''
  rationale: Ipinahihiwatig ng konteksto ang banal na pinagmulan, ngunit hindi tahasang pinapangalanan ng talata ang gumagawa; pinananatili ng salin ang pagpipigil at pagiging pasibo ng orihinal.
- issue: Pagkakakilanlan ng ὁ πρῶτος
  choice: ang naunang nagsasalita
  alternative: ang una
  rationale: Ang konteksto ay tungkol sa mga propetang sunod-sunod na nagsasalita. Nililinaw ng salin ang tinutukoy nang hindi nagdaragdag ng denominasyonal na pakahulugan.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Ginamit ang 'nakaupo' sa halip na mas pormal na 'nakaluklok,' at ang 'naunang nagsasalita' upang maging malinaw ang konteksto ng kaayusan sa pagtitipon.
