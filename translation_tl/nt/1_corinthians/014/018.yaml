translation:
  language: tl
  text: Nagpapasalamat ako sa Diyos dahil nagsasalita ako ng mga wika nang higit kaysa sa inyong lahat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring literal na “nagsasalita ako ng mga dila nang higit kaysa sa inyong lahat.” Ang salitang Griyego ay maaaring mangahulugang “mga dila” o “mga wika”; dito, tumutukoy ito sa penomenong tinatalakay sa 1 Corinto 12–14.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχαριστῶ
  choice: Nagpapasalamat ako
  rationale: Ang kasalukuyang aktibong pandiwa sa unang panauhan ay likas at tuwirang naipahahayag sa modernong Tagalog bilang “Nagpapasalamat ako.”
- source_word: τῷ θεῷ
  choice: sa Diyos
  rationale: Ang datibong layon ng εὐχαριστέω ay likas na isinasalin bilang “sa Diyos” kasunod ng pandiwang “nagpapasalamat.”
- source_word: πάντων ὑμῶν μᾶλλον
  choice: nang higit kaysa sa inyong lahat
  rationale: Pinananatili nito ang tahasang paghahambing sa buong pangkat nang hindi ipinipilit kung kolektibo o paisa-isa ang diin.
- source_word: γλώσσαις
  choice: sa mga wika
  rationale: Ang γλῶσσα ay maaaring tumukoy sa dila o wika; sa konteksto ng 1 Corinto 12–14, “mga wika” ang natural na katawagang Tagalog sa kaloob na tinatalakay, nang hindi ipinapasya ang tiyak na likas ng penomenon.
- source_word: λαλῶ
  choice: nagsasalita ako
  rationale: Ang payak na aspektong di-ganap ng Tagalog ay angkop sa kasalukuyan at pangkalahatang pahayag ng Griyego.
theological_decisions:
- issue: Kahulugan ng γλώσσαις sa talatang tumatalakay sa kaloob ng mga wika
  choice: sa mga wika
  alternative: sa mga dila
  rationale: Ang “mga wika” ay likas at dignified sa modernong Tagalog at pinananatili ang katawagang ginagamit para sa penomenong tinatalakay sa 1 Corinto 12–14. Hindi nito nilulutas kung karaniwang wikang pantao, ekstatikong pananalita, o mas malawak na kategorya ang tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “mga wika” bilang pinakakaraniwang katawagang biblikal sa Tagalog, habang pinanatili sa talababa ang literal na alternatibong “mga dila” at ang likas na kalabuan ng termino.
