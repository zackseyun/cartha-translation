  text: οὐ γάρ ἐστιν ἀνὴρ ἐκ γυναικός, ἀλλὰ γυνὴ ἐξ ἀνδρός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/008.yaml
  text: For man is not from woman[a], but woman from man.
translation:
  language: tl
  text: Sapagkat ang lalaki ay hindi nagmula sa babae, kundi ang babae ay nagmula sa lalaki.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sapagkat ang asawang lalaki ay hindi nagmula sa asawang babae, kundi ang asawang babae ay nagmula sa asawang lalaki.” Ang mga salitang Griyego ay maaaring mangahulugang “lalaki/babae” o “asawang lalaki/asawang babae”; dito, pinili ang mas malawak na diwa na tumutukoy sa paglikha.
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: Sapagkat
  rationale: Nagbibigay ito ng batayan o paliwanag sa naunang pahayag; natural at malinaw na pang-ugnay ang “Sapagkat” sa argumentong ito.
- source_word: ἀνὴρ / ἀνδρός
  choice: lalaki
  rationale: Bagaman maaari ring mangahulugang “asawang lalaki,” ipinapakita ng pagtukoy sa paglikha at ng katambal na γυνή na mas malawak na “lalaki” ang tinutukoy.
- source_word: ἐκ / ἐξ
  choice: nagmula sa
  rationale: Ipinahahayag ng mga pang-ukol ang pinagmulan. Mas natural sa modernong Tagalog ang “nagmula sa” kaysa sa mas literal ngunit matigas na anyo.
- source_word: γυναικός / γυνὴ
  choice: babae
  rationale: Bagaman maaari ring mangahulugang “asawang babae,” ang konteksto ng paglikha ay tumutukoy sa babae bilang katapat ng lalaki.
- source_word: ἀλλὰ
  choice: kundi
  rationale: Ang “kundi” ay likas na nagpapahayag ng mariing pagsalungat matapos ang negatibong unang sugnay.
- source_word: ἐστιν
  choice: ay … nagmula
  rationale: Sa Tagalog, ang diwa ng kopula at pinagmulan ay natural na pinagsasama sa pariralang “ay … nagmula,” sa halip na tumbasan nang hiwalay ang ἐστιν.
theological_decisions:
- issue: Kung ang ἀνήρ/γυνή ay isasaling “lalaki/babae” o “asawang lalaki/asawang babae”
  choice: lalaki/babae
  alternative: asawang lalaki/asawang babae
  rationale: Ibinabatay ni Pablo ang pahayag sa salaysay ng paglikha at binibigyang-diin ang pinagmulan. Pinananatili ng “lalaki/babae” ang mas malawak na saklaw nang hindi itinatanggi ang posibleng kahulugang nauukol sa mag-asawa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, maikli, at marangal. Ginamit ang “nagmula sa” upang malinaw na maipahayag ang pinagmulan, at pinanatili sa talababa ang tunay na leksikal na kalabuan ng mga terminong Griyego.
