id: 1CO.11.14
reference: 1 Corinthians 11:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀οὐδὲ ⸂ἡ φύσις αὐτὴ⸃ διδάσκει ὑμᾶς ὅτι ἀνὴρ μὲν ἐὰν κομᾷ, ἀτιμία αὐτῷ ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/014.yaml
  text: Does not even nature itself teach you that if a man wears long hair[a], it is a dishonor to him[b],
translation:
  language: tl
  text: Hindi ba itinuturo sa inyo ng kalikasan mismo na kung mahaba ang buhok ng isang lalaki[a], iyon ay kahihiyan sa kanya[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagpapahaba ng buhok” o “nagsusuot ng mahabang buhok.” Ang pandiwang Griyego ay tumutukoy sa pagkakaroon o pagdadala ng mahabang buhok.
    reason: lexical_alternative
  - marker: b
    text: Ang “kalikasan mismo” ay maaaring tumukoy sa kaayusang nilikha, sa karaniwang pagkabatid ng tao, o sa itinuturing ng isang kultura na likas at angkop; hindi ito mas makitid na tinutukoy ng Griyego rito.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲ
  choice: Hindi ba
  rationale: Ipinapahayag bilang retorikal na tanong sa natural na Tagalog; naipahihiwatig ng “ba” ang inaasahang pagsang-ayon, habang ang pagpapatuloy mula sa naunang argumento ay nananatili sa konteksto.
- source_word: ἡ φύσις αὐτὴ
  choice: ang kalikasan mismo
  rationale: Pinananatili ng “mismo” ang diin ng αὐτή at iniiwang malawak ang maaaring tinutukoy ng φύσις.
- source_word: διδάσκει ὑμᾶς
  choice: itinuturo sa inyo
  rationale: Tuwirang katumbas na natural sa modernong Tagalog at pinananatili ang diwang didaktiko.
- source_word: ἀνὴρ
  choice: isang lalaki
  rationale: Ang tinutukoy rito ay lalaki bilang kasalungat ng babae sa susunod na talata, hindi partikular na asawa.
- source_word: ἐὰν κομᾷ
  choice: kung mahaba ang buhok ng isang lalaki
  rationale: Likas at malinaw sa Tagalog; saklaw nito ang pagkakaroon o pagpapahaba/pagsusuot ng mahabang buhok nang hindi nagdaragdag ng motibong wala sa Griyego.
- source_word: ἀτιμία
  choice: kahihiyan
  rationale: Karaniwang salitang Tagalog para sa kawalan ng dangal o kahiya-hiyang kalagayan, angkop sa kontekstong dangal at kahihiyan.
- source_word: αὐτῷ ἐστιν
  choice: iyon ay kahihiyan sa kanya
  rationale: Natural na Tagalog na nagpapanatili sa predikatibong ugnayan at personal na datibo.
theological_decisions:
- issue: Kahulugan ng φύσις sa pangangatwiran ni Pablo
  choice: Isinaling malawak bilang “kalikasan mismo” nang hindi nililimitahan ang tinutukoy.
  alternative: Kaayusang nilikha, likas na pagkabatid ng tao, o ang itinuturing ng kultura na likas at angkop.
  rationale: Hindi mas makitid na tinutukoy ng Griyego rito kung biyolohikal, moral-intuwitibo, o kultural ang diin; pinananatili ng salin ang tunay na kalabuan.
- issue: Saklaw ng κομᾷ
  choice: “mahaba ang buhok”
  alternative: “nagpapahaba ng buhok” o “nagsusuot ng mahabang buhok”
  rationale: Maaaring tumukoy ang pandiwa sa pagkakaroon, pagpapahaba, o pagdadala ng mahabang buhok; inilalahad sa talababa ang mga leksikal na posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang anyong retorikal na “Hindi ba” at iniwasan ang teknikal o denominasyonal na pagpapakahulugan.
