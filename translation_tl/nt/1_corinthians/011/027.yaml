  naturalness: Malinaw at marangal ang Tagalog. Ang “uminom sa kopa” ay natural na paraan upang ipahayag ang metonimikong “uminom ng kopa” nang hindi ipinahihiwatig na ang sisidlan mismo ang iniinom. Ang “magiging may sala kaugnay ng” ay bahagyang pormal ngunit angkop sa legal at taimtim na rehistro ng talata.
  terminology: Ang “Panginoon,” “katawan,” “dugo,” at “kopa” ay angkop at pare-pareho sa kontekstong ito. Napananatili rin ng “sa paraang hindi karapat-dapat” na hindi ang likas na pagiging karapat-dapat ng tao ang inilalarawan.
