base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/027.yaml
  text: Therefore[b][a], whoever eats the bread or drinks the cup of the Lord in an unworthy manner will be guilty concerning the body and blood of the Lord.
translation:
  language: tl
  text: Kaya, ang sinumang kumain ng tinapay o uminom sa kopa ng Panginoon sa paraang hindi karapat-dapat[a] ay magiging may sala kaugnay ng katawan at dugo ng Panginoon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “sa paraang hindi karapat-dapat” ay salin ng isang pang-abay. Inilalarawan nito kung paano kumakain o umiinom, hindi ang likas na pagiging karapat-dapat ng tao.
    reason: lexical_alternative
  - marker: b
    text: 'Mas tradisyonal at mas literal: “ay magiging may sala sa katawan at dugo ng Panginoon.” Maaaring ipahayag ng konstruksiyong Griyego ang pagkakasala o pananagutan kaugnay ng katawan at dugo ng Panginoon.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: Kaya
  rationale: Likas na panandang panghinuha sa modernong Tagalog at malinaw na nag-uugnay sa naunang talakayan tungkol sa Hapunan ng Panginoon.
- source_word: ὃς ἂν
  choice: ang sinuman
  rationale: Ipinahahayag ang pangkalahatan at walang-tiyak na saklaw ng pariralang Griyego.
- source_word: ἐσθίῃ τὸν ἄρτον
  choice: kumain ng tinapay
  rationale: Direkta at natural na salin; sapat na ang konteksto upang tukuyin ang tinapay na pinag-uusapan.
- source_word: ἢ
  choice: o
  rationale: 'Pinananatili ang disjunctive na puwersa ng Griyego: saklaw ng babala ang alinman sa dalawang kilos.'
- source_word: πίνῃ τὸ ποτήριον
  choice: uminom sa kopa
  rationale: Natural sa Tagalog ang metonimikong pahayag na tumutukoy sa pag-inom ng laman ng kopa, nang hindi dinaragdagan ang kahulugan.
- source_word: τοῦ κυρίου
  choice: ng Panginoon
  rationale: Karaniwang salin ng genitive at ng titulong κύριος sa kontekstong tumutukoy kay Jesus.
- source_word: ἀναξίως
  choice: sa paraang hindi karapat-dapat
  rationale: Malinaw na adverbial ang parirala at inilalarawan nito kung paano kumakain o umiinom, hindi ang likas na halaga o pagiging karapat-dapat ng tao.
- source_word: ἔνοχος ἔσται
  choice: ay magkakasala
  rationale: Ipinapahayag ang pananagutan at pagkakasala sa natural at taimtim na Tagalog.
- source_word: τοῦ σώματος καὶ τοῦ αἵματος τοῦ κυρίου
  choice: laban sa katawan at dugo ng Panginoon
  rationale: Ipinahahayag ang culpability o pananagutan kaugnay ng katawan at dugo, habang ang talababa ay nagpapanatili sa mas literal na anyo ng genitive.
theological_decisions:
- issue: Kahulugan ng ἀναξίως sa pakikibahagi sa Hapunan ng Panginoon
  choice: Ang hinahatulan ay ang pagkain o pag-inom sa paraang hindi karapat-dapat.
  alternative: Ang tinutukoy ay isang taong hindi karapat-dapat.
  rationale: Pang-abay ang ἀναξίως at binabago nito ang mga pandiwang “kumain” at “uminom”; hindi dapat gawing paglalarawan sa likas na katayuan ng nakikibahagi.
- issue: Puwersa ng ἢ sa pagitan ng pagkain at pag-inom
  choice: Pinanatili bilang “o,” kaya ang babala ay sumasaklaw sa alinmang kilos na gawin sa hindi karapat-dapat na paraan.
  alternative: Ituring ang dalawang kilos bilang nakapirming pares at isalin na “at.”
  rationale: Tahasan ang disjunctive na pangatnig sa tekstong Griyego at hindi ito dapat ihanay sa inaasahang liturhikal na pahayag.
- issue: Pananagutan sa katawan at dugo ng Panginoon
  choice: “magkakasala laban sa katawan at dugo ng Panginoon”
  alternative: “magiging may sala sa katawan at dugo ng Panginoon”
  rationale: Ang pangunahing salin ay malinaw at natural na naghahayag ng mabigat na pananagutan, samantalang itinatala sa talababa ang mas literal ngunit mas hindi likas na anyo.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “kopa” upang mapanatili ang solemneng at biblikal na metonimiya, at iniwasan ang anyong maaaring magpahiwatig na ang tao mismo ang likas na hindi karapat-dapat.
