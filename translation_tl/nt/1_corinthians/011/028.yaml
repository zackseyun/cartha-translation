  yaml_path: translation/nt/1_corinthians/011/028.yaml
  text: But let a man examine himself, and in this way let him eat from the bread and drink from the cup.
translation:
  language: tl
  text: Ngunit suriin ng bawat isa ang kanyang sarili, at sa ganitong paraan ay kumain siya mula sa tinapay at uminom mula sa kopa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοκιμαζέτω
  choice: suriin
  rationale: Ipinahahayag ang utos na siyasatin o subukin ang sarili, sa natural at dignified na modernong Tagalog.
- source_word: ἄνθρωπος
  choice: bawat isa
  rationale: Dito ay tumutukoy sa sinumang tao, hindi partikular sa lalaki; malinaw at likas sa Tagalog ang distributibong diwa sa konteksto.
- source_word: ἑαυτόν
  choice: ang kanyang sarili
  rationale: Pinananatili ang reflexive na tuon ng Griyego.
- source_word: οὕτως
  choice: at saka
  rationale: 'Ipinahahayag ang pagkakasunod at paraan: pagkatapos ng pagsusuri sa sarili, saka kumain at uminom.'
- source_word: ἐκ τοῦ ἄρτου ... ἐκ τοῦ ποτηρίου
  choice: mula sa tinapay ... mula sa kopa
  rationale: Pinananatili ang dalawang pariralang may ἐκ at ang simetrikong anyo ng orihinal.
theological_decisions:
- issue: Saklaw ng ἄνθρωπος
  choice: bawat isa
  alternative: isang lalaki
  rationale: Ang ἄνθρωπος ay karaniwang nangangahulugang tao o indibidwal at saklaw nito rito ang bawat kalahok; hindi kailangan ng konteksto ang partikular na kasariang panlalaki.
- issue: Ugnayan ng pagsusuri sa sarili at pakikibahagi
  choice: at saka
  alternative: at sa ganitong paraan
  rationale: Ipinakikita ang lohikal na pagkakasunod nang hindi ipinahihiwatig na ang pagsusuri ay awtomatikong humahantong sa pag-iwas sa pagkain at pag-inom; ang utos ay suriin ang sarili at saka makibahagi.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignified, at angkop sa pampublikong pagbasa. Ginamit ang “kopa” bilang karaniwang terminong biblikal ngunit madaling maunawaan.
