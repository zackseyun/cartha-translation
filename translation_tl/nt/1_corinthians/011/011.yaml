  text: Nevertheless[a], in the Lord woman is not apart from man, nor man apart from woman.
translation:
  language: tl
  text: Gayunman[a], sa Panginoon, ang babae ay hindi hiwalay sa lalaki, ni ang lalaki man ay hindi hiwalay sa babae.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang asawang babae ay hindi hiwalay sa asawang lalaki, ni ang asawang lalaki man ay hindi hiwalay sa asawang babae.” Ang mga salitang Griyego ay maaaring tumukoy sa babae at lalaki o sa asawang babae at asawang lalaki. Mas pinili rito ang mas malawak na kahulugan dahil waring pangkalahatan ang pahayag at hindi limitado sa pag-aasawa.
    reason: alternative_reading
lexical_decisions:
- source_word: πλὴν
  choice: Gayunman
  rationale: Ipinahihiwatig nito ang pagliko tungo sa isang mapagbalanse at mapaglimita sa naunang pangangatwiran.
- source_word: γυνή
  choice: babae
  rationale: Maaaring mangahulugang “babae” o “asawang babae,” ngunit ang pangkalahatang pahayag tungkol sa ugnayan ng dalawang kasarian ay pumapabor sa mas malawak na “babae.”
- source_word: ἀνήρ
  choice: lalaki
  rationale: Maaaring mangahulugang “lalaki” o “asawang lalaki,” ngunit ang konteksto ay pumapabor sa pangkalahatang kahulugang “lalaki.”
- source_word: χωρὶς
  choice: hiwalay sa
  rationale: Pinananatili nito ang diwa ng pagkakahiwalay o kawalan ng pagsasarili nang hindi dinaragdagan ang kahulugan ng teksto.
- source_word: ἐν κυρίῳ
  choice: sa Panginoon
  rationale: Natural sa modernong Tagalog at pinananatili ang karaniwang Pauline na diwa ng kalagayan o ugnayang nakapaloob sa Panginoon.
- source_word: οὔτε ... οὔτε
  choice: hindi ... at ... hindi rin
  rationale: Malinaw at likas na Tagalog na nagpapahayag ng magkatimbang na dalawang pagtanggi.
theological_decisions:
- issue: Kung ang γυνή / ἀνήρ ay isasaling “babae/lalaki” o “asawang babae/asawang lalaki”
  choice: babae/lalaki
  alternative: asawang babae/asawang lalaki
  rationale: Tinatalakay ng malapit na konteksto ang lalaki at babae kaugnay ng paglikha at pagsamba, at ang talata ay isang pangkalahatang pahayag ng kanilang pagtutumbasan sa Panginoon. Gayunman, tunay na leksikal na posibilidad ang marital na pagbasa kaya pinanatili ito sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at madaling maunawaan. Ginamit ang “Gayunman” para sa mapagbalanseng pagliko at ang “hindi ... hindi rin” upang maging natural habang pinananatili ang parallelismo.
