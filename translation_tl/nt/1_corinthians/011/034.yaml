id: 1CO.11.34
reference: 1 Corinthians 11:34
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀εἴ τις πεινᾷ, ἐν οἴκῳ ἐσθιέτω, ἵνα μὴ εἰς κρίμα συνέρχησθε. Τὰ δὲ λοιπὰ ὡς ἂν ἔλθω διατάξομαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/034.yaml
  text: If anyone is hungry[a], let him eat at home, so that you may not come together for judgment. And I will give directions about the rest when I come.
translation:
  language: tl
  text: Kung may nagugutom, kumain siya sa bahay, upang hindi kayo magtipon para sa paghatol.[a] Tungkol naman sa iba pang mga bagay, magbibigay ako ng mga tagubilin pagdating ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “para sa kahatulan.” Ang Griyegong κρίμα ay maaaring mangahulugang “paghatol” o “kahatulan.” Sa kontekstong ito, ang “paghatol” ay umaayon sa tinutukoy ni Pablo na kasalukuyang pagdidisiplina ng Panginoon, hindi tahasang sa pangwakas na kahatulan (tal. 29–32).
    reason: lexical_alternative
lexical_decisions:
- source_word: πεινᾷ
  choice: nagugutom
  rationale: Likas na modernong Tagalog para sa kasalukuyang kalagayan ng pagkagutom.
- source_word: ἐν οἴκῳ
  choice: sa bahay
  rationale: Tumutukoy sa pagkain sa sariling tahanan sa halip na sa pagtitipon ng iglesya.
- source_word: ἐσθιέτω
  choice: kumain siya
  rationale: Pinananatili ang pautos na lakas ng ikatlong panauhang isahan sa natural na Tagalog.
- source_word: εἰς κρίμα
  choice: humantong sa paghatol
  rationale: Ipinahahayag ang kinalabasan o layong ipinahihiwatig ng εἰς nang hindi agad nililimitahan ang κρίμα sa pangwakas na kaparusahan.
- source_word: συνέρχησθε
  choice: ang pagtitipon ninyo
  rationale: Natural na isinasalin ang pagparito nang sama-sama at pinananatili ang ugnayan nito sa pagtitipon ng kapulungan sa konteksto.
- source_word: Τὰ δὲ λοιπὰ
  choice: Tungkol naman sa iba pang mga bagay
  rationale: Malinaw at likas na transisyon patungo sa mga usaping hindi pa tinalakay.
- source_word: ὡς ἂν ἔλθω
  choice: pagdating ko
  rationale: Natural na tumutukoy sa inaasahang pagdating ni Pablo habang hindi binibigyang-diin ang tiyak na oras.
- source_word: διατάξομαι
  choice: magbibigay ako ng mga tagubilin
  rationale: Ipinahahayag ang kahulugang pag-aayos o pagtatakda ng dapat gawin sa malinaw na modernong Tagalog.
theological_decisions:
- issue: Kahulugan ng κρίμα sa babala tungkol sa pagtitipon para sa Hapunan ng Panginoon
  choice: paghatol
  alternative: kaparusahan o hatol na nagpaparusa
  rationale: Ang mas malawak na “paghatol” ay nagpapanatili sa saklaw ng salitang Griyego at umaayon sa agarang konteksto ng disiplina ng Panginoon sa 11:29–32, nang hindi tahasang ginagawa itong pangwakas na kaparusahan.
- issue: Di-tiyak na isahang τις at isahang pautos
  choice: Kung may nagugutom, kumain siya
  alternative: Kung may sinumang nagugutom, kumain ang taong iyon
  rationale: Pinananatili ang isahang pagtukoy ng Griyego sa isang natural at hindi mabigat na anyong Tagalog; walang kasariang idinaragdag na wala sa τις.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “kumain siya” bilang natural na isahang pautos at ang “pagtitipon ninyo” upang luminaw ang eklesyal na konteksto. Inilagay ang talababa pagkatapos mismo ng “paghatol,” ang salitang nililinaw nito.
