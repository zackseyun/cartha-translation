base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/019.yaml
  text: For there must also be factions among you[b][a], so that those who are approved may also become evident among you.
translation:
  language: tl
  text: Sapagkat kailangan ding magkaroon ng mga pangkat-pangkat[a] sa gitna ninyo, upang mahayag din sa gitna ninyo ang mga subok at karapat-dapat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga pagkakabaha-bahagi” o “mga sekta”; sa kalaunang gamit, “mga erehiya.” Dito, malamang na tumutukoy ito sa magkakatunggaling pangkat sa loob ng kapulungan.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga subok at karapat-dapat” ay maaari ring isaling “mga napatunayang tunay” o “mga nakapasa sa pagsubok.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δεῖ
  choice: kailangang magkaroon
  rationale: Pinananatili ang mariing diwa ng pangangailangan nang hindi tinutukoy kung ito ay dahil sa kalooban ng Diyos, sa praktikal na di-maiiwasan, o sa kapwa dahilan.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag na kaugnayan ng talata sa naunang pahayag.
- source_word: καὶ αἱρέσεις
  choice: ding magkaroon ng mga pangkat-pangkat
  rationale: Sa kontekstong ito, tumutukoy ang αἱρέσεις sa magkakatunggaling pangkat sa loob ng kapulungan, hindi kinakailangan sa pormal na maling aral na ipinahihiwatig ng salitang 'erehiya' sa kalaunang gamit.
- source_word: ἐν ὑμῖν
  choice: sa gitna ninyo
  rationale: Likas na salin para sa pagkakaroon ng mga pangkat sa loob mismo ng komunidad at pinananatili nito ang pag-uulit ng Griyego.
- source_word: ἵνα
  choice: upang
  rationale: Pinananatili ang maaaring diwa ng layunin o kinalabasan nang hindi sapilitang pinagpapasyahan ang pagitan ng dalawa.
- source_word: καὶ οἱ δόκιμοι
  choice: din ... kung sino ang mga subok at karapat-dapat
  rationale: Ipinahahayag ng δόκιμοι ang mga napatunayang tunay o karapat-dapat matapos masubok; pinananatili rin ng 'din' ang ikalawang καί.
- source_word: φανεροὶ γένωνται
  choice: mahayag
  rationale: Natural at marangal na Filipino para sa pagiging lantad o maliwanag ng dati ay hindi pa hayag.
theological_decisions:
- issue: Kahulugan ng αἱρέσεις
  choice: mga pangkat-pangkat
  alternative: mga pagkakabaha-bahagi; mga sekta; mga erehiya
  rationale: Ang agarang konteksto ay ang mga pagkakahati at magkakatunggaling pangkat sa kapulungan, kaya iniiwasan ang pagpasok ng kalaunang teknikal na kahulugan ng 'erehiya.'
- issue: Lakas at pinagmulan ng δεῖ
  choice: kailangan
  alternative: di-maiiwasan; itinakda ng Diyos
  rationale: Mariing sinasabi ng teksto ang pangangailangan ngunit hindi tahasang nililinaw kung ito ay providensiyal, praktikal na di-maiiwasan, o pareho; hindi ito nilulutas ng salin.
- issue: Diwa ng ἵνα
  choice: upang
  alternative: na ang resulta ay
  rationale: Maaaring magpahiwatig ang sugnay ng layunin o resulta. Ang 'upang' ay nagpapanatili ng ugnayan nang hindi nagdaragdag ng tahasang paliwanag tungkol sa banal na layunin.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang 'pangkat-pangkat' bilang likas na paglalarawan ng mga kampihan sa loob ng kapulungan; iniwasan ang 'erehiya' sa pangunahing teksto dahil maaari nitong ipasok ang kalaunang teknikal na kahulugang doktrinal.
