translation:
  language: tl
  text: Dahil dito, marami sa inyo ang mahihina at may sakit, at marami-rami ang natutulog[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin nang mas tahasan: “namatay.” Ginagamit dito ni Pablo ang “natutulog” bilang magalang na talinghaga para sa kamatayan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Dahil dito
  rationale: Malinaw nitong pinananatili ang ugnayang sanhi sa naunang pagtalakay tungkol sa maling pakikibahagi sa Hapunan ng Panginoon.
- source_word: ἐν ὑμῖν
  choice: sa inyo
  rationale: Likas sa modernong Tagalog at tumutukoy sa kalagayang umiiral sa loob ng pamayanan ng mga taga-Corinto.
- source_word: πολλοὶ
  choice: marami
  rationale: Tuwiran at karaniwang katumbas ng pang-uring ginamit bilang pangngalan.
- source_word: ἀσθενεῖς
  choice: mahihina
  rationale: Pinananatili ang pangkalahatang diwa ng panghihina at ang pagkakaiba nito sa mas tahasang pagkakasakit na kasunod.
- source_word: ἄρρωστοι
  choice: may sakit
  rationale: Natural at madaling maunawaang salin para sa pisikal na karamdaman.
- source_word: κοιμῶνται
  choice: natutulog
  rationale: Pinananatili ang talinghaga ng tekstong Griyego para sa kamatayan sa halip na tahasang palitan ito ng interpretasyong “namatay.”
- source_word: ἱκανοί
  choice: marami-rami
  rationale: Ipinahihiwatig ang kapansin-pansing dami nang hindi mekanikal na inuulit ang “marami.”
theological_decisions:
- issue: Kung literal na pagtulog o kamatayan ang tinutukoy ng κοιμῶνται
  choice: Pinanatili sa pangunahing teksto ang talinghagang “natutulog,” na ipinaliliwanag sa talababa bilang pagtukoy sa kamatayan.
  alternative: “namatay” o literal na “natutulog”
  rationale: Ang pagkakasunod-sunod na mahihina, may sakit, at natutulog sa konteksto ng paghatol ay malakas na nagpapahiwatig ng kamatayan. Gayunman, ang pagpapanatili sa talinghaga ay gumagalang sa anyo at himig ng pinagmulang teksto.
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Ginamit ang “mahihina” at “may sakit” upang mapanatili ang dalawang magkaibang antas ng pisikal na kalagayan, at “marami-rami” bilang natural na pagpapahayag ng ἱκανοί.
