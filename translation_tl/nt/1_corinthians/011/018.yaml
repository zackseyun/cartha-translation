id: 1CO.11.18
reference: 1 Corinthians 11:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πρῶτον μὲν γὰρ συνερχομένων ὑμῶν ἐν ἐκκλησίᾳ ἀκούω σχίσματα ἐν ὑμῖν ὑπάρχειν, καὶ μέρος τι πιστεύω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/018.yaml
  text: For[a], in the first place, when you come together in assembly, I hear that divisions exist among you, and in part I believe it.
translation:
  language: tl
  text: Sapagkat una sa lahat, kapag nagtitipon kayo bilang iglesya[a], nababalitaan kong may mga pagkakabaha-bahagi sa inyo, at hanggang sa isang antas ay pinaniniwalaan ko ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa pagtitipon” o “bilang kapulungan.” Ang salitang Griyego ay tumutukoy dito sa kongregasyong nagkakatipon, hindi partikular sa isang gusali.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρῶτον μὲν γὰρ
  choice: Sapagkat una sa lahat
  rationale: Pinananatili ang ugnayang nagbibigay-katwiran ng γάρ at ang panimulang tungkulin ng πρῶτον μὲν, kahit walang kasunod na pormal na μέν...δέ na tambalan.
- source_word: συνερχομένων ὑμῶν
  choice: kapag nagtitipon kayo
  rationale: Ang genitive absolute ay temporal; natural sa modernong Tagalog ang “kapag nagtitipon kayo” at angkop sa paulit-ulit na konteksto ng pagtitipon sa kabanata.
- source_word: ἐν ἐκκλησίᾳ
  choice: bilang iglesya[a]
  rationale: Tumutukoy sa kongregasyong nagkakatipon, hindi pangunahing sa gusali. Ipinahahayag ng “bilang iglesya” ang sama-samang identidad habang nagtitipon.
- source_word: ἀκούω
  choice: nababalitaan kong
  rationale: Sa konteksto, tumatanggap si Pablo ng ulat. Mas natural sa Tagalog ang “nababalitaan kong” kaysa literal na “naririnig kong,” nang hindi binabago ang batayan ng kanyang kaalaman.
- source_word: σχίσματα
  choice: mga pagkakabaha-bahagi
  rationale: Malinaw na inilalarawan ang mga pagkakahati sa loob ng pamayanan nang hindi ipinapalagay na pormal nang mga pangkat ang mga ito.
- source_word: ὑπάρχειν
  choice: may
  rationale: Ang eksistensiyal na “may” ang natural at maikling paraan sa Tagalog upang ipahayag na umiiral ang mga pagkakabaha-bahagi.
- source_word: καὶ μέρος τι
  choice: at bahagya
  rationale: Nililimitahan nito ang antas ng paniniwala ni Pablo at pinananatili ang kanyang pag-aalinlangan.
- source_word: πιστεύω
  choice: ko itong pinaniniwalaan
  rationale: Ginagawang hayag ng “ito” ang ipinahihiwatig na layon—ang ulat—nang walang idinadagdag na bagong diwa.
theological_decisions:
- issue: Kahulugan ng ἐκκλησία sa konteksto
  choice: ang nagtitipong kongregasyon, isinalin bilang “bilang iglesya”
  alternative: “sa pagtitipon” o “sa iglesya”
  rationale: Ang talata ay tungkol sa aktuwal na pagtitipon ng mga taga-Corinto para sa gawaing pangkongregasyon, hindi sa isang gusali. Pinananatili ng salin ang eklesyal na kahulugan nang hindi nag-aangkat ng mas huling konseptong nakasentro sa gusali.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “iglesya” para sa nakikilalang terminong eklesyal, ngunit nilinaw sa talababa na ang tinutukoy ay ang nagkakatipong kongregasyon. Ang “bahagya ko itong pinaniniwalaan” ay sadyang nagpapanatili sa limitadong pagtanggap ni Pablo sa ulat.
