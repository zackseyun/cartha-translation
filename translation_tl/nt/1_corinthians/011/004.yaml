  text: πᾶς ἀνὴρ προσευχόμενος ἢ προφητεύων κατὰ κεφαλῆς ἔχων καταισχύνει τὴν κεφαλὴν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/004.yaml
  text: Every man who prays or prophesies with something on his head dishonors his head[a][b].
translation:
  language: tl
  text: Ang bawat lalaking nananalangin o nagpapahayag ng propesiya na may anumang bagay na nasa kanyang ulo ay nagdudulot ng kahihiyan sa kanyang ulo[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ayon sa mas tradisyonal na salin, “na may takip sa ulo.” Literal na sinasabi ng Griyego na “may [isang bagay] sa o nakalaylay mula sa ulo,” at hindi nito tinutukoy kung ano mismo ang pantakip.
    reason: lexical_alternative
  - marker: b
    text: Ang “kanyang ulo” ay maaaring literal na tumukoy sa sarili niyang ulo, habang umaalingawngaw rin ang kaugnayang gamit ng “ulo” sa nakapaligid na konteksto.
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ἀνὴρ
  choice: Ang bawat lalaki
  rationale: Bagaman maaaring mangahulugang “asawang lalaki” ang ἀνήρ sa ilang konteksto, pangkalahatan ang pahayag dito at katapat ito ng “bawat babae” sa kasunod na talata. Pinananatili rin nito ang tiyak na pagtukoy sa lalaki.
- source_word: προσευχόμενος
  choice: nananalangin
  rationale: Likas at marangal na salin ito ng kasalukuyang participle na tumutukoy sa lalaking kasalukuyang gumagawa ng panalangin.
- source_word: προφητεύων
  choice: nagpapahayag ng propesiya
  rationale: Malinaw sa karaniwang mambabasa at tapat sa pagkilos na ipinahihiwatig ng pandiwa, nang hindi ipinapaliwanag nang higit sa sinasabi ng Griyego.
- source_word: κατὰ κεφαλῆς ἔχων
  choice: na may nakalagay sa kanyang ulo
  rationale: Hindi tahasang tinutukoy ng Griyego kung anong bagay ang nasa o nakalaylay mula sa ulo. Iniiwasan ng saling ito ang labis na pagtukoy sa isang partikular na pantakip.
- source_word: καταισχύνει
  choice: nagbibigay-kahihiyan sa
  rationale: Ipinahahayag nito ang pagdudulot ng kahihiyan o kawalan ng dangal at likas itong kaugnay ng bagay na “ulo” sa Filipino.
- source_word: τὴν κεφαλὴν αὐτοῦ
  choice: kanyang ulo
  rationale: Pinananatili ng payak na salin ang maaaring pagtukoy kapwa sa literal na ulo at, bilang alingawngaw ng talata 3, sa kaugnayang kahulugan ng “ulo.”
theological_decisions:
- issue: Kung ang κεφαλή sa huling sugnay ay tahasang literal na ulo o metaporikal na “ulo” sa kaugnayang binabanggit sa konteksto
  choice: Panatilihin ang kalabuan sa “kanyang ulo”
  alternative: “sarili niyang pisikal na ulo” o “ang siyang ulo niya”
  rationale: Maaaring sadyang nagsasanib sa pananalita ni Pablo ang literal na ulo at ang kaugnayang gamit ng “ulo” sa nakapaligid na konteksto; hindi ito dapat tahasang pagpasyahan sa pangunahing teksto.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “nagpapahayag ng propesiya” para sa malinaw na pangkaraniwang pagbasa, at pinanatili sa mga talababa ang leksikal at teolohikal na kalabuan ng talata.
