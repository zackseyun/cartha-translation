id: 1CO.11.22
reference: 1 Corinthians 11:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: μὴ γὰρ οἰκίας οὐκ ἔχετε εἰς τὸ ἐσθίειν καὶ πίνειν; ἢ τῆς ἐκκλησίας τοῦ θεοῦ καταφρονεῖτε, καὶ καταισχύνετε τοὺς μὴ ἔχοντας; τί ⸂εἴπω ὑμῖν⸃; ἐπαινέσω ὑμᾶς; ἐν τούτῳ οὐκ ἐπαινῶ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/022.yaml
  text: For do you not have houses for eating and drinking? Or do you despise the church of God and shame those who have nothing? What should I say to you? Should I praise you? In this I do not praise you[a].
translation:
  language: tl
  text: Wala ba kayong mga bahay upang doon kumain at uminom? O hinahamak ninyo ang iglesya ng Diyos at hinihiya ang mga walang-wala[a]? Ano ba ang dapat kong sabihin sa inyo? Pupurihin ko ba kayo? Sa bagay na ito, hindi ko kayo pinupuri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga mahihirap” o “mga walang makain.” Sa Griyego, literal na “mga walang taglay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκίας
  choice: mga bahay
  rationale: Tumutukoy ito sa mga pribadong tahanan, bilang paghahambing sa nagkakatipong iglesya. Likas at tuwiran sa Tagalog ang “mga bahay.”
- source_word: εἰς τὸ ἐσθίειν καὶ πίνειν
  choice: upang doon kumain at uminom
  rationale: Ipinapahayag ng parirala ang layunin. Nililinaw ng “doon” ang kaibahan ng bahay sa pagtitipon nang hindi nagdaragdag ng bagong diwa.
- source_word: ἐκκλησίας τοῦ θεοῦ
  choice: iglesya ng Diyos
  rationale: Tumutukoy sa nagkakatipong sambayanan na pag-aari ng Diyos. Ang “iglesya” ay karaniwan at hindi kailangang magpahiwatig ng gusali o institusyon lamang.
- source_word: καταφρονεῖτε
  choice: hinahamak
  rationale: 'Pinananatili nito ang matinding pagsaway: itinuturing nilang mababa o walang halaga ang iglesya ng Diyos.'
- source_word: καταισχύνετε
  choice: hinihiya
  rationale: Tuwirang inilalarawan nito ang pagdudulot ng kahihiyan sa ibang tao at natural ito sa modernong Tagalog.
- source_word: τοὺς μὴ ἔχοντας
  choice: mga walang-wala
  rationale: Malapit ito sa literal na “mga walang taglay” at likas na tumutukoy sa mga salat, habang hindi tahasang nililimitahan ang kakulangan sa pagkain lamang.
- source_word: τί εἴπω ὑμῖν;
  choice: Ano ba ang dapat kong sabihin sa inyo?
  rationale: Ipinadarama nito ang retorikal na pag-aalinlangan at pagsaway ng deliberative subjunctive.
- source_word: ἐπαινέσω ὑμᾶς;
  choice: Pupurihin ko ba kayo?
  rationale: Isang natural na retorikal na tanong sa Tagalog na malinaw na umaasa ng negatibong sagot.
- source_word: ἐν τούτῳ οὐκ ἐπαινῶ
  choice: Sa bagay na ito, hindi ko kayo pinupuri
  rationale: Pinananatili ang pagtukoy sa kasalukuyang usapin at ang pag-uulit ng pandiwang “purihin,” gaya ng Griyego.
theological_decisions:
- issue: Sino ang tinutukoy ng τοὺς μὴ ἔχοντας sa konteksto ng Hapunan ng Panginoon
  choice: mga walang-wala
  alternative: mga mahihirap; mga walang makain
  rationale: Malinaw sa konteksto na materyal na salat ang tinutukoy, ngunit mas malawak ang mismong Griyegong pananalita na literal na “mga walang taglay.” Pinananatili ng salin ang lawak nito, at inilalagay sa talababa ang mas tiyak na mga posibleng kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang mga tuwirang retorikal na tanong upang mapanatili ang tindi ng pagsaway ni Pablo, habang iniwasang gawing mas tiyak kaysa sa Griyego ang kakulangan ng mga taong hinihiya.
