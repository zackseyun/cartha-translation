  source_fidelity: Tumpak na naipapahayag ang paulit-ulit na ἐσθίει καὶ πίνει, ang κρίμα bilang “hatol,” ang masamang epekto ng ἑαυτῷ sa “laban sa kanyang sarili,” at ang μὴ διακρίνων τὸ σῶμα nang hindi idinadagdag sa pangunahing teksto ang “ng Panginoon.” Ang “dahil hindi niya kinikilala nang wasto” ay isang katanggap-tanggap na natural na pagpapahayag ng negatibong participle sa kontekstong ito.
  naturalness: Natural at malinaw ang modernong Filipino. Ang register ay marangal ngunit hindi mabigat. Ang pag-uulit ng “kumakain at umiinom” ay bahagyang matigas ngunit sinasadya at makatwiran upang mapanatili ang diin ng Griyego.
  terminology: Ang “hatol” ay angkop at hindi paunang nagpapakahulugang pangwakas na pagkondena. Ang “ang katawan” ay wastong pinananatiling bukás ang tinutukoy. Maayos ang tala sa tekstuwal na variant at ang tala sa posibleng saklaw ng διακρίνων.
