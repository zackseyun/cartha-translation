id: 1CO.11.29
reference: 1 Corinthians 11:29
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ γὰρ ἐσθίων καὶ ⸀πίνων κρίμα ἑαυτῷ ἐσθίει καὶ πίνει μὴ διακρίνων τὸ ⸀σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/029.yaml
  text: For the one who eats and drinks eats and drinks judgment on himself[b][a], not discerning the body.
translation:
  language: tl
  text: Sapagkat ang kumakain at umiinom ay kumakain at umiinom ng hatol laban sa kanyang sarili[a] dahil hindi niya kinikilala nang wasto ang katawan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hatol sa kanyang sarili.”
    reason: alternative_reading
  - marker: b
    text: O “hindi niya ibinubukod nang tama ang katawan.” Maaaring tumukoy ito sa pagkilala sa kahalagahan ng Hapunan ng Panginoon, sa nagkakatipong katawan ng mga mananampalataya, o sa dalawa. Sa ilang manuskrito, “katawan ng Panginoon” ang mababasa sa halip na “katawan.”
    reason: alternative_reading_and_textual_variant
lexical_decisions:
- source_word: κρίμα
  choice: hatol
  rationale: Ang κρίμα ay tumutukoy sa isang hatol o paghatol. Mas malawak at mas angkop dito ang “hatol” kaysa “kaparusahan” o “kondena,” lalo na't inilalarawan sa kasunod na mga talata ang disiplina ng Diyos, hindi agad ang pangwakas na kapahamakan.
- source_word: ἑαυτῷ
  choice: laban sa kanyang sarili
  rationale: Ipinahihiwatig ng datibong panghalip na ang kumakain at umiinom mismo ang nagdadala sa sarili ng masamang hatol; natural itong ipinapahayag sa Filipino bilang “laban sa kanyang sarili.”
- source_word: διακρίνων
  choice: kinikilala nang wasto
  rationale: Saklaw ng διακρίνω ang wastong pagkilala, pagsusuri, o pagbubukod. Pinananatili ng “kinikilala nang wasto” ang bigat na pangkaisipan at pangmoral nang hindi tiyakang nilulutas kung ano ang dapat kilalanin o ibukod.
- source_word: τὸ σῶμα
  choice: ang katawan
  rationale: Payak na “ang katawan” ang nasa pinakamaagang mababawi na teksto. Pinananatili nito ang posibleng pagtukoy sa katawan ni Cristo sa hapunan, sa nagkakatipong katawan ng mga mananampalataya, o sa dalawa.
- source_word: ὁ ... ἐσθίων καὶ πίνων
  choice: ang kumakain at umiinom
  rationale: Natural na generic singular sa Filipino ang “ang kumakain at umiinom” at malapit ito sa substantival participle ng Griyego.
- source_word: μὴ διακρίνων
  choice: dahil hindi niya kinikilala nang wasto
  rationale: Ipinapahayag ng sugnay na may “dahil” ang ugnayan ng kabiguang kumilala sa katawan at ng hatol na dinadala sa sarili, habang nananatiling natural sa modernong Filipino.
theological_decisions:
- issue: Kahulugan ng “ang katawan” sa konteksto ng Hapunan ng Panginoon
  choice: Panatilihin sa pangunahing teksto ang di-tiyak na “ang katawan.”
  alternative: “ang katawan ng Panginoon” o “ang katawan ng mga mananampalataya”
  rationale: “Ang katawan” lamang ang sinasabi ng tekstong Griyego. Dahil kapwa tampok sa konteksto ang kaugnayan ng hapunan kay Jesus at ang masamang pakikitungo ng mga taga-Corinto sa isa't isa, hindi dapat paliitin ng salin ang kahulugan.
- issue: Lakas ng κρίμα
  choice: hatol
  alternative: kondena o pangwakas na kaparusahan
  rationale: Sa talata 32, ibinubukod ni Pablo ang kasalukuyang paghatol at pagdidisiplina sa pagkondena kasama ng sanlibutan. Kaya hindi dapat ipahiwatig dito ng salin ang pangwakas na kapahamakan.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang pag-uulit ng “kumakain at umiinom” upang maipakita ang diin at ayos ng Griyego. Iniwasan ang teknikal o denominasyonal na pagpapakahulugan sa “katawan.”
