  source_fidelity: Ang “kapag nagtitipon kayo sa iisang lugar” ay tapat na salin ng συνερχομένων ... ἐπὶ τὸ αὐτό, at ang “Hapunan ng Panginoon” ay wastong katumbas ng κυριακὸν δεῖπνον. Ngunit ang “hindi na ... ang kinakain ninyo” ay nagdaragdag ng aspektong temporal na “na” (‘no longer’) na hindi tahasang nasa Griyego, at binabago ang mas siksik na impersonal/layuning konstruksiyon ng οὐκ ἔστιν ... φαγεῖν.
  naturalness: Natural at marangal sa makabagong Filipino ang rebisyong “hindi ito upang kumain ng Hapunan ng Panginoon.” Pinananatili nito ang bahagyang siksik at mapanuring puwersa ng Griyego nang hindi nagdaragdag ng temporal na kahulugan.
  terminology: Ang “Hapunan ng Panginoon” ay angkop, malinaw, at nakaugaliang katawagan para sa κυριακὸν δεῖπνον. Hindi kailangang baguhin ang terminong ito.
