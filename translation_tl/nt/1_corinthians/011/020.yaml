  yaml_path: translation/nt/1_corinthians/011/020.yaml
  text: Therefore[a], when you come together in the same place, it is not to eat the Lord’s supper,
translation:
  language: tl
  text: Kaya, kapag nagtitipon kayo sa iisang lugar, hindi ito upang kumain ng Hapunan ng Panginoon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaaring isalin: “hindi kayo kumakain ng Hapunan ng Panginoon.” Siksik ang pagkakasabi sa Griyego; idinidiin nito na dahil sa kanilang asal, ang kanilang pagkain ay hindi maituturing na Hapunan ng Panginoon.'
    reason: alternative_reading
lexical_decisions:
- source_word: συνερχομένων
  choice: kapag nagtitipon kayo
  rationale: 'Ang participle na kasama ng ὑμῶν ay temporal: tumutukoy ito sa pagkakataong sama-samang nagtitipon ang mga taga-Corinto. Likas at malinaw sa makabagong Tagalog ang “kapag nagtitipon kayo.”'
- source_word: οὖν
  choice: Kaya
  rationale: Ipinakikita nito ang paghinuha mula sa naunang pagsaway tungkol sa pagkakabaha-bahagi. Mas natural sa kasalukuyang Tagalog ang “Kaya” kaysa sa mas pormal na “Samakatuwid.”
- source_word: ἐπὶ τὸ αὐτό
  choice: sa iisang lugar
  rationale: Pinananatili nito ang diwang lokatibo ng idyoma—ang pagtitipon sa isang lugar—nang hindi inuulit lamang ang kahulugan ng “nagtitipon.”
- source_word: οὐκ ἔστιν ... φαγεῖν
  choice: hindi na ... ang kinakain ninyo
  rationale: Siksik at idyomatiko ang konstruksiyong Griyego. Sa konteksto, ang asal nila ay nangangahulugang hindi na wastong matatawag na Hapunan ng Panginoon ang kanilang kinakain. Pinananatili ng “hindi na” ang mapanuring diin nang hindi ito ginagawang pahayag tungkol sa pisikal o metapisikal na imposibilidad.
- source_word: κυριακὸν
  choice: ng Panginoon
  rationale: Ang pang-uri ay nangangahulugang nauukol o pag-aari ng Panginoon. Ang pariralang “ng Panginoon” ang malinaw at karaniwang katumbas nito sa Tagalog.
- source_word: δεῖπνον
  choice: Hapunan
  rationale: Ang “hapunan” ay ang kinikilalang katumbas sa pariralang ito at angkop sa sama-samang kainan sa konteksto. Ginamit ang malaking titik bilang bahagi ng nakaugaliang katawagang “Hapunan ng Panginoon.”
- source_word: κυριακὸν δεῖπνον
  choice: Hapunan ng Panginoon
  rationale: Ito ang malinaw at nakaugaliang katawagan sa Filipino para sa pagkain o hapunang nauukol sa Panginoon, nang hindi nagdaragdag ng denominasyonal na kahulugan.
theological_decisions:
- issue: Kung itinatanggi ni Pablo ang posibilidad na kainin ang hapunan o sinasabing hindi na maituturing na Hapunan ng Panginoon ang ginagawa nila
  choice: Dahil sa paraan ng kanilang pagtitipon at pagkain, hindi na wastong matatawag na Hapunan ng Panginoon ang kinakain nila.
  alternative: “Hindi kayo kumakain ng Hapunan ng Panginoon” o “hindi ito upang kainin ang Hapunan ng Panginoon.”
  rationale: Ipinakikita ng kasunod na konteksto (tal. 21–22) na ang mapaghati at makasariling asal nila ang tinutuligsa, hindi ang pisikal na posibilidad ng pagkain. Gayunman, inilalahad sa talababa ang mas tuwirang anyo upang mapanatili ang siksik at bahagyang malabong konstruksiyon ng Griyego.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “Kaya” para sa malinaw na lohikal na ugnayan, “nagtitipon” para sa karaniwang pananalita ng pamayanan, at ang pamilyar na katawagang “Hapunan ng Panginoon.”
