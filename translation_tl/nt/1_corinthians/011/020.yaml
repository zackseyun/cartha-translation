    issue: Ang “hindi na” ay nagdaragdag ng diwang temporal.
    rationale: Ang οὐκ ἔστιν ay may pagtanggi ngunit walang salitang katumbas ng “na” na nangangahulugang ‘hindi na mula ngayon.’ Ang punto sa konteksto ay na ang kanilang pagtitipon ay hindi tunay na para sa/pagkain ng Hapunan ng Panginoon, hindi kinakailangang na dati ay ganoon ngunit ngayo’y hindi na.
  - severity: low
    issue: Ang “ang kinakain ninyo” ay mas tiyak na pagpapaliwanag kaysa sa anyo ng Griyego.
    rationale: Katanggap-tanggap ito bilang interpretasyon, ngunit ang “hindi ito upang kumain” ay mas malapit sa infinitival na φαγεῖν at mas mahusay na pinananatili ang idyomatikong pag-igting ng orihinal.
