  yaml_path: translation/nt/1_corinthians/011/016.yaml
  text: But if anyone seems to be contentious[a], we have no such custom[b], nor do the churches of God.
translation:
  language: tl
  text: Ngunit kung may taong waring mahilig makipagtalo[a], wala kaming gayong kaugalian[b], ni ang mga iglesya ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “palaaway” o “mahilig sa alitan.”
    reason: lexical_alternative
  - marker: b
    text: Ang “gayong kaugalian” ay maaaring tumukoy sa pagiging mahilig makipagtalo o sa pinagtatalunang gawain na tinalakay sa mga naunang talata.
    reason: alternative_reading
lexical_decisions:
- source_word: δοκεῖ
  choice: nag-aakalang
  rationale: Maaaring mangahulugang “tila” o “nag-aakala/nag-iisip.” Sa pariralang ito, natural sa Tagalog ang “nag-aakalang dapat siyang,” habang hindi tahasang hinahatulan ang motibo ng tao.
- source_word: φιλόνεικος
  choice: dapat siyang makipagtalo
  rationale: Ipinapahayag ng salita ang pagiging mahilig sa alitan o pakikipagtalo. Ang “makipagtalo” ay malinaw at likas sa modernong Tagalog; ipinapaliwanag sa talababa ang iba pang posibleng diwa.
- source_word: τοιαύτην
  choice: gayong
  rationale: Pinananatili nitong pangkalahatan ang pagtukoy pabalik nang hindi tinutukoy kung aling kaugalian ang tinutukoy.
- source_word: συνήθειαν
  choice: kaugalian
  rationale: Tumutukoy ito sa nakasanayan o kinikilalang gawain. Ang “kaugalian” ay angkop sa pangkomunidad na konteksto at sapat na malawak upang mapanatili ang pinagtatalunang reperensiya.
- source_word: οὐκ ἔχομεν
  choice: wala kaming
  rationale: Tuwirang salin na hindi nagdaragdag ng mas matinding diwang gaya ng “hindi namin pinahihintulutan.”
- source_word: ἐκκλησίαι τοῦ θεοῦ
  choice: mga iglesya ng Diyos
  rationale: Pinananatili ang genitibong parirala at ang pagtukoy sa mga kapulungang pag-aari ng Diyos; karaniwan at marangal ang “iglesya” sa modernong Filipino.
theological_decisions:
- issue: Tinutukoy ng “wala kaming gayong kaugalian”
  choice: Iniwan itong malawak bilang “wala kaming gayong kaugalian,” nang hindi tinutukoy sa pangunahing teksto kung ito ay pakikipagtalo o ang gawaing pinag-uusapan sa mga naunang talata.
  alternative: Maaaring tahasang unawain bilang kawalan ng kaugaliang makipagtalo, o bilang kawalan ng pinagtatalunang gawaing tinalakay sa mga naunang talata.
  rationale: Maikli at hindi tiyak ang reperensiya ng τοιαύτην συνήθειαν sa Griyego. Pinananatili ng salin at talababa ang tunay na interpretatibong tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “iglesya” para sa ἐκκλησία at iniwasang lutasin sa pangunahing teksto ang tunay na kalabuan ng reperensiya.
