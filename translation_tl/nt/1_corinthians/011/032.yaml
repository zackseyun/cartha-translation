base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/032.yaml
  text: But when we are judged by the Lord[a], we are disciplined, so that we may not be condemned along with the world.
translation:
  language: tl
  text: Ngunit kapag hinahatulan tayo ng Panginoon,[a] dinidisiplina niya tayo upang hindi tayo mapatawan ng hatol na kaparusahan kasama ng sanlibutan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “habang hinahatulan tayo ng Panginoon, dinidisiplina niya tayo.” Ang mga anyong pangkasalukuyan sa Griyego ay maaaring magbigay-diin sa nagpapatuloy na pagkilos.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρινόμενοι
  choice: kapag hinahatulan tayo
  rationale: Ang pangkasalukuyang balintiyak na pandiwaring Griyego ay nauunawaang panahunan sa konteksto. Pinananatili ng “hinahatulan” ang diwang panghukuman nang hindi ipinapalagay na ito ay pangwakas na kaparusahan.
- source_word: δὲ
  choice: Ngunit
  rationale: Nagpapakita ito ng banayad na pagsalungat sa babala sa naunang talata.
- source_word: ὑπὸ κυρίου
  choice: ng Panginoon
  rationale: Ang ὑπό na may genitive ay tumutukoy sa gumagawa ng kilos. Hindi pinalawak sa “Panginoong Jesus” sapagkat κύριος lamang ang nasa teksto.
- source_word: παιδευόμεθα
  choice: dinidisiplina niya tayo
  rationale: Ipinahihiwatig ng παιδεύω rito ang pagtutuwid na may layuning hubugin, hindi lamang ang pagpaparusa. Ginawang tahasan ang likas na tagaganap sa Filipino upang maging natural at malinaw.
- source_word: ἵνα μὴ
  choice: upang hindi
  rationale: Pinananatili nito ang layunin o inaasahang bunga ng pagdidisiplina.
- source_word: σὺν τῷ κόσμῳ
  choice: kasama ng sanlibutan
  rationale: Ipinapahayag ng σύν ang pakikibahagi sa iisang kahihinatnan. Ang “sanlibutan” ay dignidad at pamilyar na salin ng κόσμος sa ganitong kontekstong teolohikal.
- source_word: κατακριθῶμεν
  choice: mahatulang
  rationale: Sa sugnay na ito, ang “mahatulang” ay tumutukoy sa hatol na nagpaparusa at naiiba sa mapagtuwid na paghatol sa unang bahagi. Ang kaibahan ay nililinaw ng konteksto at talababa nang hindi nagdaragdag ng salita sa pangunahing teksto.
theological_decisions:
- issue: Ugnayan ng kasalukuyang paghatol ng Panginoon at ng paghatol sa sanlibutan
  choice: Ipinakikita ng talata na ang paghatol ng Panginoon sa atin ay mapagtuwid na pagdidisiplina na naglalayong huwag tayong mapabilang sa hatol sa sanlibutan.
  alternative: Maaaring unawain ito nang mas pangkalahatan bilang pansamantalang kaparusahan, nang hindi tahasang nagtatangi sa mga mananampalataya at di-mananampalataya.
  rationale: Ang pagkakaiba ng κρίνω at κατακρίνω, kasama ng παιδεύω at ng sugnay na ἵνα μή, ay nagpapahiwatig ng pagkakaiba ng mapagtuwid na paghatol at ng hatol na nagpaparusa. Hindi nilulutas ng salin ang mas malawak na usapin tungkol sa pagtitiyaga o katiyakan ng kaligtasan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “dinidisiplina” bilang karaniwang salitang Filipino para sa mapagtuwid na paghubog, at “sanlibutan” upang mapanatili ang kolektibo at teolohikal na diwa ng κόσμος.
