base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/010.yaml
  text: For this reason the woman ought to have authority on her head[b][a], because of the angels.
translation:
  language: tl
  text: Dahil dito, ang babae ay dapat magkaroon ng awtoridad sa kaniyang ulo[a], dahil sa mga anghel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, bilang mas mapagpaliwanag na salin, “ang babae ay nararapat magsuot ng tanda ng awtoridad sa kaniyang ulo.” “Awtoridad” ang literal na sinasabi ng tekstong Griyego; wala rito ang tahasang mga salitang “tanda” o “panakip.”
    reason: alternative_reading
  - marker: b
    text: O “dahil sa mga mensahero,” bagaman mas malamang dito ang kahulugang “mga anghel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Dahil dito
  rationale: Likas na panandang sanhi at bunga sa Filipino na pinananatili ang paghinuha ni Pablo mula sa naunang pangangatuwiran.
- source_word: ὀφείλει
  choice: nararapat
  rationale: Ipinahahayag ang obligasyon o wastong dapat gawin nang hindi ito pinalalakas bilang tahasang legal na utos.
- source_word: ἡ γυνὴ
  choice: ang babae
  rationale: Pinananatili ang pangkalahatang isahan ng Griyego at hindi ito nililimitahan sa kahulugang 'asawa.'
- source_word: ἐξουσίαν
  choice: awtoridad
  rationale: Tuwirang katumbas ng salitang Griyego; hindi idinaragdag sa pangunahing teksto ang 'tanda' o 'panakip,' na wala namang tahasang salita sa orihinal.
- source_word: ἔχειν
  choice: magkaroon
  rationale: Pinananatili ang payak na kahulugang 'to have' sa halip na ipakahulugang 'magsuot.'
- source_word: ἐπὶ τῆς κεφαλῆς
  choice: sa kaniyang ulo
  rationale: Natural na Filipino na nagpapanatili sa malawak na ugnayang panlunan ng pariralang Griyego.
- source_word: διὰ τοὺς ἀγγέλους
  choice: dahil sa mga anghel
  rationale: Ang διά na may accusative ay nagpapahayag ng dahilan, at 'mga anghel' ang mas malamang na kahulugan dito ng ἀγγέλους.
theological_decisions:
- issue: Kahulugan ng ἐξουσίαν ἔχειν ἐπὶ τῆς κεφαλῆς
  choice: Panatilihin ang 'magkaroon ... ng awtoridad sa kaniyang ulo.'
  alternative: '''magsuot ng tanda ng awtoridad sa kaniyang ulo'' o ''magkaroon ng panakip sa ulo bilang tanda ng awtoridad'''
  rationale: Walang tahasang salitang Griyego para sa 'tanda' o 'panakip.' Dahil pinagtatalunan ang parirala, pinananatili ng pangunahing teksto ang tunay na kalabuan at inilalagay sa talababa ang karaniwang pagpapakahulugan.
- issue: Tinutukoy ng ἀγγέλους
  choice: mga anghel
  alternative: mga mensahero
  rationale: Maaaring mangahulugan ang ἄγγελος ng 'anghel' o 'mensahero,' ngunit mas malamang dito ang mga makalangit na nilalang. Hindi tinutukoy ng salin kung bakit sila binanggit.
- issue: Saklaw ng γυνή
  choice: babae
  alternative: asawa
  rationale: Bahagi ang talata ng mas malawak na pagtalakay tungkol sa lalaki at babae; hindi hinihingi ng Griyego na limitahan ito sa relasyong mag-asawa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Sadyang pinanatili ang di-pangkaraniwang pariralang 'awtoridad sa kaniyang ulo' upang huwag lutasin sa salin ang tunay na kalabuan ng Griyego; ipinaliliwanag ito sa talababa.
