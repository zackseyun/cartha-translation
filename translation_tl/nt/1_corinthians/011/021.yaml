  text: For each one goes ahead with his own supper when it is time to eat, and one is hungry while another gets drunk.
translation:
  language: tl
  text: Sapagkat sa pagkain, inuuna ng bawat isa ang sarili niyang hapunan[a], at ang isa ay gutom samantalang ang isa naman ay nalalasing.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “inuuna ng bawat isa ang sarili niyang pagkain bago ang iba”; maaaring idiin ng pandiwang Griyego ang pagkuha o pagkain nang mas maaga, o ang pagpapatuloy nang hindi hinihintay ang iba.
    reason: lexical_alternative
  - marker: b
    text: O “ang isa ay gutom, samantalang ang isa naman ay lasing.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: bawat isa
  rationale: 'Pinananatili ang pamamahaging diwa ng isahang anyo: isa-isa sa mga kalahok ang tinutukoy.'
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikitang paliwanag ang talata sa pagsaway na nauna rito.
- source_word: τὸ ἴδιον δεῖπνον
  choice: sarili niyang hapunan
  rationale: Ang δεῖπνον ay hapunan o pangunahing pagkain, at idiniriin ng ἴδιον na pansarili ito sa halip na pinagsasaluhang pagkain.
- source_word: προλαμβάνει
  choice: inuuna
  rationale: Naipahihiwatig ang pagkuha o pagkain nang mas maaga at ang pagpapatuloy nang hindi hinihintay ang iba, habang iniiwan sa talababa ang tunay na saklaw ng pandiwa.
- source_word: ἐν τῷ φαγεῖν
  choice: sa oras ng pagkain
  rationale: Natural na temporal na salin ng konstruksyong may articular infinitive, nang hindi dinaragdagan ang teksto ng tahasang paksa.
- source_word: ὃς μὲν ... ὃς δὲ
  choice: ang isa ... ang iba
  rationale: Likas na Filipino para sa paghahambing ng magkakaibang kalagayan ng mga kalahok.
- source_word: πεινᾷ
  choice: nagugutom
  rationale: Tuwirang inilalarawan ang kasalukuyang kalagayan ng isang kalahok.
- source_word: μεθύει
  choice: naglalasing
  rationale: Malinaw na ipinahahayag ang aktuwal na pagkalasing at ang kilos na humahantong dito, nang hindi pinahihina bilang simpleng labis na pagkain o pag-inom.
theological_decisions:
- issue: Isahang pamamahaging pagtukoy at kasarian
  choice: sarili niyang hapunan
  alternative: kanila-kaniyang hapunan
  rationale: May isahang pamamahaging anyo ang Griyego. Sa Filipino, natural na isahan ang “bawat isa” at hindi kinakailangang ipilit ang gramatikal na kasariang panlalaki na wala sa panghalip na “niya.”
- issue: Uri ng maling gawain sa Hapunan ng Panginoon
  choice: naglalasing
  alternative: lasing
  rationale: 'Hindi pinalalambot ang μεθύει: tunay na pagkalasing ang inilalarawan. Gayunman, kinikilala sa talababa na maaari ring idiin ng anyo ang kalagayang “lasing.”'
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “hapunan” upang mapanatili ang karaniwang diwa ng δεῖπνον at ang ugnay sa konteksto ng Hapunan ng Panginoon. Pinanatili sa mga talababa ang leksikal na kalabuan ng προλαμβάνει at ang posibleng stative na pagbasa sa μεθύει.
