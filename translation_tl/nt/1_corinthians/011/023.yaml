  text: Ἐγὼ γὰρ παρέλαβον ἀπὸ τοῦ κυρίου, ὃ καὶ παρέδωκα ὑμῖν, ὅτι ὁ κύριος Ἰησοῦς ἐν τῇ νυκτὶ ᾗ ⸀παρεδίδετο ἔλαβεν ἄρτον
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/023.yaml
  text: 'For I received from the Lord what I also delivered to you: that the Lord Jesus[a], on the night when he was being handed over, took bread'
translation:
  language: tl
  text: 'Sapagkat tinanggap ko mula sa Panginoon ang siya ring ipinasa ko sa inyo: na ang Panginoong Jesus ay kumuha ng tinapay noong gabing ipinapasa siya.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ayon sa tradisyonal na salin, “noong gabing siya ay ipinagkanulo.”
    reason: alternative_reading
lexical_decisions:
- source_word: παρέλαβον
  choice: tinanggap ko
  rationale: Likas na katumbas ng pagtanggap ni Pablo sa tradisyon o tagubilin, at pinananatili ang ugnayan nito sa kasunod na παρέδωκα.
- source_word: ἀπὸ τοῦ κυρίου
  choice: mula sa Panginoon
  rationale: Pinananatili ang Panginoon bilang pinagmulan nang hindi dinaragdagan ang nasa Griyego; kinikilala sa kasunod na sugnay na siya ang Panginoong Jesus.
- source_word: παρέδωκα
  choice: ibinigay
  rationale: Natural sa modernong Tagalog para sa pagpapasa ng natanggap na turo. Hindi ginamit ang 'ipinasa' upang hindi labis na idiomatiko, at naiiba nang sapat sa pasibong παρεδίδετο.
- source_word: ὅτι
  choice: na
  rationale: Natural na pananda sa Tagalog para ipakilala ang nilalaman ng ibinigay ni Pablo.
- source_word: κύριος
  choice: Panginoon
  rationale: Karaniwan at marangal na katumbas na nagpapanatili sa mapitagang at kristolohikal na bisa.
- source_word: ἐν τῇ νυκτὶ ᾗ
  choice: nang gabing
  rationale: Maikli at natural na temporal na parirala sa Tagalog na nagpapanatili sa diwa ng kaugnay na sugnay.
- source_word: παρεδίδετο
  choice: siya ay ibinibigay sa kamay ng iba
  rationale: Ipinahahayag ang prosesong diwa ng imperfect passive at pinananatili ang mas malawak na kahulugan ng paghahatid o pagsasakamay, sa halip na paliitin agad ito sa pagtataksil ni Judas.
- source_word: ἔλαβεν ἄρτον
  choice: kumuha ng tinapay
  rationale: Direkta, natural, at pamilyar na salin; hindi ipinapalagay ng walang-artikulong ἄρτον na kailangang tukuying isang buong tinapay.
theological_decisions:
- issue: Kahulugan ng παρεδίδετο sa salaysay ng pagtatatag
  choice: siya ay ibinibigay sa kamay ng iba
  alternative: siya ay ipinagkanulo
  rationale: Maaaring mangahulugan ang παραδίδωμι ng ibigay, ihatid, isakamay, o ipagkanulo ayon sa konteksto. Pinananatili ng pangunahing salin ang mas malawak na teolohikal na tensiyon sa pagitan ng pagkilos ng mga taong nagsakamay kay Jesus at ng mas malaking konteksto ng kanyang paghihirap; inilalagay sa talababa ang tradisyonal at kontekstuwal na posibleng salin.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang 'Sapagkat' para sa γάρ at ang pamilyar na 'Panginoong Jesus.' Ang 'ibinibigay sa kamay ng iba' ay sadyang bahagyang pormal upang mapanatili ang pasibong anyo at tunay na lawak ng Griyego.
