base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/024.yaml
  text: And after giving thanks[a], he broke it and said, “This is my body, which is for you[b]. Keep doing this in remembrance of me.”
translation:
  language: tl
  text: Matapos siyang magpasalamat, pinagputol niya ito at sinabi, “Ito ang aking katawan, na para sa inyo.[a][b] Patuloy ninyong gawin ito bilang pag-alaala sa akin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “alang-alang sa inyo” o “para sa kapakanan ninyo.”
    reason: lexical_alternative
  - marker: b
    text: 'Idinaragdag ng ilang manuskrito ang “pinagputol” pagkatapos ng “para sa inyo”: “Ito ang aking katawan, na pinagputol para sa inyo.”'
    reason: textual_variant
lexical_decisions:
- source_word: εὐχαριστήσας
  choice: matapos magpasalamat
  rationale: Ipinahahayag ng aorist participle ang kilos na nauna sa pagpuputol; natural sa modernong Tagalog ang “matapos magpasalamat.”
- source_word: ἔκλασεν
  choice: pinagputol-putol niya ito
  rationale: Ang pandiwa ay nangangahulugang binasag o pinagputol-putol. Tahasang inilagay ang “ito,” na tumutukoy sa tinapay sa konteksto, upang maging malinaw at natural sa Tagalog.
- source_word: Τοῦτό μού ἐστιν τὸ σῶμα
  choice: Ito ang aking katawan
  rationale: Tuwirang pinananatili ang copular na pahayag ng Griyego at hindi ito binibigyang-kahulugang “sumasagisag sa,” na magpapasya sa isang usaping teolohikal na hindi nilulutas ng mismong parirala.
- source_word: τὸ ὑπὲρ ὑμῶν
  choice: na para sa inyo
  rationale: Sinasaklaw ng “para sa inyo” ang kapakinabangan o pagkilos alang-alang sa mga kausap nang hindi nagdaragdag ng isang teknikal na paliwanag tungkol sa pagtubos.
- source_word: τοῦτο ποιεῖτε
  choice: Patuloy ninyong gawin ito
  rationale: Ginagawang hayag ng “patuloy” ang paulit-ulit o nakaugaliang puwersa ng present imperative sa konteksto ng utos na ito.
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: bilang pag-alaala sa akin
  rationale: Pinananatili nito ang diwa ng aktibong paggunita o pag-alaala sa malinaw at likas na Tagalog.
theological_decisions:
- issue: Kahulugan ng “Ito ang aking katawan” sa konteksto ng Hapunan ng Panginoon
  choice: Tuwirang isinalin bilang “Ito ang aking katawan.”
  alternative: “Ito ay sumasagisag sa aking katawan,” o isang saling tahasang nagtatakda ng paraan ng presensiya ni Cristo
  rationale: Hindi nilulutas ng salin ang mga sumunod na pagtatalong teolohikal tungkol sa literal, sakramental, o simbolikong pag-unawa; pinananatili nito ang mismong pahayag ng Griyego.
- issue: Puwersa ng ὑπὲρ ὑμῶν
  choice: “para sa inyo”
  alternative: “alang-alang sa inyo” o “para sa kapakanan ninyo”
  rationale: Malinaw ang kapakinabangan para sa mga kausap, ngunit hindi naglalagay ang salin ng mas tiyak na teorya ng pagtubos kaysa sa sinasabi ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal. Ginamit ang pamilyar na “pag-alaala” at ang natural na ayos na “Patuloy ninyong gawin ito,” habang iniwasan ang mga salitang nagpapasya sa doktrina ng Hapunan ng Panginoon.
