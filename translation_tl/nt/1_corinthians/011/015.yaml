base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/015.yaml
  text: But if a woman has long hair[a], it is her glory[b], because her hair has been given to her instead of a covering.
translation:
  language: tl
  text: Ngunit kung ang isang babae[a] ay may mahabang buhok, ito ay karangalan niya, sapagkat ang kanyang buhok ay ibinigay sa kanya sa halip na isang pantakip[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “asawa.” Maaaring mangahulugan ang salitang Griyego na “babae” o “asawa,” depende sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: O “bilang pantakip.” Maaaring magpahayag ang pang-ukol na Griyego ng pagtutumbas o pagpapalit; hindi sa pariralang ito lamang mapagpapasiyahan kung ang buhok mismo ang nagsisilbing pantakip o kung ibinigay ito bilang kaugnay na katumbas ng isang pantakip.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: isang babae
  rationale: Maaaring mangahulugan ang γυνή na “babae” o “asawa,” depende sa konteksto. Dito, pangkalahatang pahayag ang anyo ng pangungusap, kaya “isang babae” ang pinakanatural, habang inilalagay sa talababa ang leksikal na alternatibo.
- source_word: κομᾷ
  choice: mahaba ang buhok
  rationale: Ang κομάω ay tumutukoy sa pagkakaroon o pagsusuot ng mahabang buhok, hindi lamang sa pagkakaroon ng buhok. Natural at malinaw sa modernong Tagalog ang “mahaba ang buhok.”
- source_word: δόξα
  choice: karangalan
  rationale: Sa kontekstong ito, ang δόξα ay tumutukoy sa bagay na nagbibigay-dangal o kapurihan. Mas natural sa kasalukuyang Tagalog ang “karangalan” kaysa literal na “kaluwalhatian,” nang hindi pinapahina ang retorikal na diin.
- source_word: κόμη
  choice: buhok
  rationale: Tumutukoy ang κόμη sa buhok sa ulo, kadalasa’y may pahiwatig na mahaba. Dahil naipahayag na ng naunang pandiwa ang ideya ng mahabang buhok, sapat at hindi paulit-ulit ang “buhok.”
- source_word: ἀντί
  choice: sa halip na
  rationale: Karaniwang ipinapahayag ng ἀντί ang pagpapalit o pagtutumbas. Pinananatili ng “sa halip na” ang pangunahing puwersa nito, habang kinikilala sa talababa ang posibleng diwang “bilang.”
- source_word: περιβολαίου
  choice: isang pantakip
  rationale: Ang περιβόλαιον ay pangkalahatang tawag sa isang bagay na ipinambabalot o pantakip. Hindi ito nilimitahan sa “belo,” na mas tiyak kaysa sa salitang Griyego.
- source_word: δέδοται
  choice: ibinigay sa kanya
  rationale: Ang ganap na balintiyak na anyo ay naglalarawan ng kasalukuyang kalagayang bunga ng pagbibigay. Natural na naihahatid ito sa Tagalog ng “ibinigay sa kanya” sa loob ng sugnay.
theological_decisions:
- issue: Kung ang buhok mismo ang pantakip o kung ibinigay ito bilang katumbas o kapalit ng isang pantakip.
  choice: sa halip na isang pantakip
  alternative: bilang pantakip
  rationale: Pinananatili ng pangunahing salin ang karaniwang diwa ng pagpapalit sa ἀντί, ngunit hindi ipinipilit na nilulutas ng parirala ang mas malawak na usapin tungkol sa buhok at iba pang pantakip sa ulo. Itinatala sa talababa ang lehitimong diwa ng pagtutumbas.
- issue: Kung ang γυνή ay “babae” o “asawa.”
  choice: isang babae
  alternative: isang asawa
  rationale: Pangkalahatan ang pahayag sa talata at walang tahasang pagtukoy rito sa isang ugnayang mag-asawa. Gayunman, pinananatili sa talababa ang tunay na leksikal na posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “karangalan” sa halip na mas teknikal o lubhang pansimbahang “kaluwalhatian,” at ang pangkalahatang “pantakip” sa halip na mas tiyak na “belo.”
