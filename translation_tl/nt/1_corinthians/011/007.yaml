  text: ἀνὴρ μὲν γὰρ οὐκ ὀφείλει κατακαλύπτεσθαι τὴν κεφαλήν, εἰκὼν καὶ δόξα θεοῦ ὑπάρχων· ⸀ἡ γυνὴ δὲ δόξα ἀνδρός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/007.yaml
  text: For a man ought not to cover his head[a], since he is the image and glory of God[b]; but the woman is the glory of man.
translation:
  language: tl
  text: Sapagkat hindi dapat magtakip ng ulo ang lalaki[a], yamang siya ay larawan at kaluwalhatian ng Diyos; ngunit ang babae ay kaluwalhatian ng lalaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang mga salitang Griyego para sa “lalaki” at “babae” ay maaari ring mangahulugang “asawang lalaki” at “asawang babae,” depende sa konteksto.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνὴρ / ἀνδρός
  choice: lalaki / ng lalaki
  rationale: Pinananatili ang pangkalahatang pagtutol ng lalaki at babae sa konteksto. Maaari ring mangahulugang “asawang lalaki” ang ἀνήρ, kaya itinala ang posibilidad na iyon sa talababa.
- source_word: ὀφείλει
  choice: dapat
  rationale: Likas na ipinapahayag ng “dapat” ang normatibo o moral na pananagutan nang hindi pinatitindi bilang isang tahasang utos.
- source_word: κατακαλύπτεσθαι τὴν κεφαλήν
  choice: takpan ... ang kanyang ulo
  rationale: Direkta at likas na salin ito ng parirala. Hindi tinutukoy ng Griyego ang eksaktong uri ng pantakip, kaya hindi nilimitahan ang pangunahing teksto sa belo.
- source_word: εἰκὼν
  choice: larawan
  rationale: Karaniwang katumbas na nagpapanatili sa malamang na alusyon sa salaysay ng paglikha.
- source_word: δόξα
  choice: kaluwalhatian
  rationale: Ginamit sa dalawang paglitaw upang mapanatili ang pag-uugnay at buong teolohikal na bigat ng salita; ang “karangalan” ay mas makitid.
- source_word: ὑπάρχων
  choice: yamang siya ang
  rationale: Ipinakikita ng “yamang” na ang pagiging larawan at kaluwalhatian ng Diyos ang batayan ng naunang pahayag, at natural ito sa modernong Tagalog.
- source_word: ἡ γυνὴ
  choice: ang babae
  rationale: Pinananatili ang kinatawang kategoryang babae bilang katapat ng lalaki. Posible rin ang “asawang babae,” ngunit mas malawak ang daloy ng argumento.
theological_decisions:
- issue: Kung ang ἀνήρ at γυνή ay isasaling lalaki/babae o asawang lalaki/asawang babae
  choice: lalaki/babae
  alternative: asawang lalaki/asawang babae
  rationale: Ang agarang konteksto ay naghahambing sa lalaki at babae kaugnay ng pagtatakip ng ulo at ng teolohiya ng paglikha. Pinananatili ng saling ito ang mas malawak na saklaw, habang kinikilala sa talababa ang leksikal na posibilidad ng ugnayang mag-asawa.
- issue: Kung palalambutin ang hindi simetrikong pahayag ni Pablo
  choice: “ang babae ay kaluwalhatian ng lalaki”
  alternative: “ipinapakita ng babae ang kaluwalhatian ng lalaki” o “ang babae ay karangalan ng lalaki”
  rationale: Tuwirang gumagamit ang Griyego ng ἐστιν at δόξα. Pinananatili ng salin ang tunay na teolohikal na tensiyon sa halip na ipaliwanag o paliitin ito.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Pinanatili ang “larawan” at “kaluwalhatian” bilang mahahalagang terminong teolohikal, at iniwasan ang pagpapaliwanag sa pangunahing teksto nang higit sa sinasabi ng Griyego.
