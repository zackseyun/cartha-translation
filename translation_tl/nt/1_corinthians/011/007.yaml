  to: Sapagkat hindi dapat magtakip ng ulo ang lalaki[a], yamang siya ay larawan at kaluwalhatian ng Diyos; ngunit ang babae ay kaluwalhatian ng lalaki.
  rationale: Pinalitan ang konstruksyong “takpan ng lalaki ang kanyang ulo” ng mas likas na “magtakip ng ulo ang lalaki.” Dahil ang saling ito ay hindi na tahasang gumagamit ng “ulo” bilang hiwalay na pangngalan sa posisyong paglalagyan ng talababa, inalis ang marker b sa pangunahing teksto ngunit pinanatili ang talababa bilang kumpletong leksikal na tala para sa pariralang Griyego. Walang binagong kahulugan, teolohikal na diin, o saklaw ng lalaki/babae.
