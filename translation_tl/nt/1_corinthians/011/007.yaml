  source_fidelity: Tumpak na naipapasa ng draft ang normatibong ὀφείλει, ang konkretong pagtatakip ng ulo, ang sanhi sa participial na ὑπάρχων, at ang tuwirang magkatambal na pahayag tungkol sa larawan at kaluwalhatian. Ang lalaki/babae ay angkop na pangkalahatang salin para sa ἀνήρ/γυνή sa talatang ito, habang nananatiling nasa talababa ang leksikal na posibilidad na mag-asawa ang tinutukoy.
  naturalness: Ang “hindi dapat takpan ng lalaki ang kanyang ulo” ay mauunawaan, ngunit bahagyang mabigat at maaaring basahin na parang ang ulo ang bagay na tinatakpan ng isang lalaki. Ang mas likas na modernong Tagalog para sa kilos na ito ay “hindi dapat magtakip ng ulo ang lalaki,” na pinananatili ang kahulugang hindi tinutukoy ang uri ng pantakip.
  terminology: Ang “larawan,” “kaluwalhatian,” “Diyos,” “lalaki,” at “babae” ay angkop, pare-pareho, at nasa marangal ngunit modernong rehistro. Hindi dapat palitan ang “kaluwalhatian” ng mas makitid na “karangalan.”
