base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/017.yaml
  text: But in giving this instruction[a], I do not praise you, because you come together not for the better but for the worse.
translation:
  language: tl
  text: Ngunit sa pagbibigay ko ng tagubiling ito[a], hindi ko kayo pinupuri, sapagkat nagtitipon kayo hindi para sa ikabubuti kundi sa ikasasama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pagbibigay ko ng utos na ito.” Ang pandiwang Griyego ay maaaring mangahulugang magbigay ng tagubilin, direksiyon, o utos.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο δὲ
  choice: Ngunit ... ito
  rationale: Ang δὲ ay nagpapahiwatig ng bahagyang pagsalungat at paglipat tungo sa pagsaway; ang Τοῦτο ay tumutukoy sa tagubiling kasunod.
- source_word: παραγγέλλων
  choice: sa pagbibigay ko ng tagubilin
  rationale: Saklaw ng pandiwa ang pagbibigay ng tagubilin, direksiyon, o utos. Ang “tagubilin” ay likas sa makabagong Tagalog at nagpapanatili ng awtoridad nang hindi labis na pinatitindi ang himig.
- source_word: οὐκ ἐπαινῶ
  choice: hindi ko kayo pinupuri
  rationale: Tuwirang ipinapahayag ang pagtanggi ni Pablo na purihin sila at pinananatili ang ugnay sa papuri sa talata 2.
- source_word: ὅτι
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan kung bakit hindi sila pinupuri.
- source_word: συνέρχεσθε
  choice: kapag nagtitipon kayo
  rationale: Inilalarawan ang sama-samang pagtitipon ng kapulungan; malinaw at natural ang “nagtitipon” sa Tagalog.
- source_word: οὐκ εἰς τὸ κρεῖσσον ἀλλὰ εἰς τὸ ἧσσον
  choice: hindi ito sa ikabubuti kundi sa ikasasama
  rationale: 'Pinananatili ang magkatapat na paghahambing at ang di-tiyak na saklaw ng resulta: ang kanilang pagtitipon ay humahantong hindi sa mas mabuti kundi sa mas masama.'
theological_decisions:
- issue: Lakas ng awtoridad ng παραγγέλλων
  choice: tagubilin
  alternative: utos
  rationale: Maaaring mangahulugan ang Griyego ng mas mariing “utos,” ngunit ang “tagubilin” ay nagpapanatili ng apostolikong awtoridad at natural na himig nang hindi nagpapasok ng dagdag na tindi.
- issue: Kahulugan ng εἰς sa mga pariralang paghahambing
  choice: sa ikabubuti ... sa ikasasama
  alternative: para sa ikabubuti ... para sa ikasasama
  rationale: Maaaring magpahiwatig ang konstruksyon ng layunin o kinalabasan. Ang napiling anyo ay likas sa Tagalog at hindi mahigpit na nagtatakda kung layunin lamang o aktuwal na bunga ang tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sapagkat” para sa dignidad ng rehistro, “nagtitipon” para sa konteksto ng kapulungan, at magkatapat na “ikabubuti/ikasasama” upang mapanatili ang retorikal na balanse ng Griyego.
