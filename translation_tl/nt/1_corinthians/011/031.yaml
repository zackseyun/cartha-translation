translation:
  language: tl
  text: Ngunit kung hinahatulan natin ang ating sarili[a], hindi sana tayo hinahatulan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sinusuri natin ang ating sarili” o “kinikilatis natin ang ating sarili.” Ang pandiwang Griyego ay maaaring tumukoy sa mapanuring pagsusuri o pagtatasa, ngunit ginamit ang “hinahatulan” upang mapanatili ang ugnayan nito sa “hinahatulan” sa kasunod na sugnay.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Ngunit kung
  rationale: Pinananatili ng “kung” ang kondisyon at ng “ngunit” ang banayad na pagsalungat o paglipat na ipinahihiwatig ng δέ.
- source_word: ἑαυτοὺς
  choice: ang ating sarili
  rationale: Likas at malinaw na katumbas sa modernong Tagalog para sa panghalip na pabalik na layon.
- source_word: διεκρίνομεν
  choice: hinatulan
  rationale: Sa konteksto, tumutukoy ito sa mapanuring pagtatasa sa sarili. Pinananatili ng “hinatulan” ang mahalagang ugnayang pandiwa sa ἐκρινόμεθα sa kasunod na sugnay, habang inilalahad sa talababa ang ibang posibleng diwa.
- source_word: οὐκ ἂν
  choice: hindi sana
  rationale: Karaniwang paraan sa Tagalog upang ipahayag ang bunga ng kondisyong salungat sa aktuwal na nangyari.
- source_word: ἐκρινόμεθα
  choice: tayo hinatulan
  rationale: Pinananatili ang lexical na ugnayan sa unang sugnay at hindi pinatitindi ang kahulugan tungo sa pangwakas na kaparusahan o paghatol.
theological_decisions:
- issue: Kung ang ikalawang sugnay ay tumutukoy sa pangwakas na paghatol o sa paghatol/disiplinang mula sa Panginoon
  choice: Isinaling payak bilang “hinatulan,” na bukas sa paghatol ng Panginoon sa konteksto.
  alternative: “hinatulang maparusahan” o “hinatulan ng kapahamakan” bilang tahasang pangwakas na paghatol
  rationale: Ibinubukod ng talata 32 ang paghatol at pagdidisiplina ng Panginoon sa paghatol sa sanlibutan. Kaya hindi dapat ipasok sa talatang ito ang mas matinding diwa ng pangwakas na kapahamakan.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “hindi sana” para sa likas na pagpapahayag ng di-aktuwal na kondisyong bunga, at pinanatili ang pag-uulit ng “hinatulan” upang katawanin ang retorikal na ugnayan ng dalawang pandiwang Griyego.
