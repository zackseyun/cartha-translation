id: 1CO.11.12
reference: 1 Corinthians 11:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἡ γυνὴ ἐκ τοῦ ἀνδρός, οὕτως καὶ ὁ ἀνὴρ διὰ τῆς γυναικός· τὰ δὲ πάντα ἐκ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/012.yaml
  text: For just as the woman is from the man[a], so also the man is through the woman; but all things are from God.
translation:
  language: tl
  text: Sapagkat kung paanong ang babae ay mula sa lalaki,[a] gayundin naman ang lalaki ay sa pamamagitan ng babae. Ngunit ang lahat ng bagay ay mula sa Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “asawang babae” at “asawang lalaki,” kung inuunawa ang konteksto bilang mas makitid na tumutukoy sa ugnayang mag-asawa sa halip na sa pangkalahatang ugnayan ng babae at lalaki.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Sapagkat kung paanong
  rationale: Pinananatili ang paliwanag na gamit ng γάρ at ang paghahambing na ipinakikilala ng ὥσπερ.
- source_word: ἡ γυνὴ
  choice: ang babae
  rationale: Bagaman maaaring mangahulugang “asawa,” mas angkop dito ang pangkalahatang “babae” dahil tumutukoy ang talata sa paglalang at pagsilang.
- source_word: ἐκ τοῦ ἀνδρός
  choice: mula sa lalaki
  rationale: Ipinahahayag ng ἐκ ang pinagmulan at pinananatili ang pahiwatig sa paglalang ng babae mula sa lalaki.
- source_word: ὁ ἀνὴρ
  choice: ang lalaki
  rationale: Kaagapay ito ng “ang babae” at nagpapahayag ng pangkalahatang ugnayan, hindi lamang ng mag-asawa.
- source_word: διὰ τῆς γυναικός
  choice: sa pamamagitan ng babae
  rationale: Ipinahahayag ng διά na may genitive ang paraan o pamamagitan, na tumutukoy sa pagdating ng lalaki sa mundo sa pamamagitan ng babae.
- source_word: τὰ δὲ πάντα
  choice: Ngunit ang lahat ng bagay
  rationale: Pinananatili ng “ngunit” ang banayad na pagsalungat o paglipat ng δέ tungo sa Diyos bilang sukdulang pinagmulan.
- source_word: ἐκ τοῦ θεοῦ
  choice: mula sa Diyos
  rationale: Likas sa Tagalog at tumpak na ipinahahayag ang Diyos bilang pinagmulan ng lahat.
theological_decisions:
- issue: Kahulugan ng γυνή at ἀνήρ
  choice: babae at lalaki
  alternative: asawang babae at asawang lalaki
  rationale: Ang pagbanggit sa paglalang at sa pagsilang ay nagpapakitang mas malawak ang saklaw kaysa ugnayang mag-asawa lamang; gayunman, inilalagay sa talababa ang posibleng mas makitid na pagbasa.
- issue: Pagkakaiba ng ἐκ at διά sa pinagmulan ng babae at lalaki
  choice: “mula sa” para sa ἐκ at “sa pamamagitan ng” para sa διά
  alternative: Gamitin ang “mula sa” sa dalawang parirala
  rationale: 'Pinananatili nito ang sinadyang pagkakaiba: ang babae ay mula sa lalaki sa salaysay ng paglalang, samantalang ang lalaki ay dumarating sa pamamagitan ng babae sa pagsilang.'
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kung paanong … gayundin naman” upang likas na maipahayag ang paghahambing, at pinanatili ang pagkakaiba ng “mula sa” at “sa pamamagitan ng.”
