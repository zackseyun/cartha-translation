id: 1CO.11.1
reference: 1 Corinthians 11:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: μιμηταί μου γίνεσθε, καθὼς κἀγὼ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/001.yaml
  text: Become imitators of me[b][a], just as I also am of the Messiah.
translation:
  language: tl
  text: Maging mga tumutulad kayo sa akin, kung paanong tumutulad din ako sa Mesiyas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Cristo.”
    reason: alternative_reading
lexical_decisions:
- source_word: μιμηταί
  choice: mga tumutulad
  rationale: Tuwirang ipinahahayag nito ang sadyang paggaya sa halimbawa ng iba. Mas malinaw ito sa karaniwang mambabasa kaysa sa “mga tagatulad,” at mas tiyak kaysa sa mas malawak na “mga tagasunod.”
- source_word: μου
  choice: sa akin
  rationale: Ito ang likas na Filipino na katambal ng pandiwang “tumulad” at tumpak na nagpapahayag sa genitibong kaugnayan ng μιμηταί μου.
- source_word: γίνεσθε
  choice: Maging
  rationale: 'Pinananatili nito ang puwersa ng pautos na γίνεσθε: hinihimok silang maging o patuloy na mamuhay bilang mga tumutulad, hindi lamang inilalarawan kung ano na sila.'
- source_word: καθὼς
  choice: kung paanong
  rationale: Malinaw nitong pinananatili ang paghahambing sa pagitan ng pagtulad ng mga taga-Corinto kay Pablo at ng pagtulad ni Pablo sa Mesiyas.
- source_word: κἀγὼ
  choice: din ako
  rationale: 'Pinananatili ng “din” ang dagdag na diin ng καί sa pinaikling anyong κἀγώ: si Pablo mismo ay tumutulad din sa iba.'
- source_word: Χριστοῦ
  choice: sa Mesiyas
  rationale: Ang Χριστός ay isang titulong nangangahulugang “Mesiyas.” Ginamit ang “sa” dahil ito ang hinihingi ng likas na Filipino kapag ang ipinahiwatig na kaisipan ay “tumutulad ako sa Mesiyas.”
theological_decisions:
- issue: Pagpapakahulugan sa Χριστοῦ
  choice: Mesiyas
  alternative: Cristo
  rationale: Pinananatili ng “Mesiyas” ang kahulugan ng titulong Χριστός, samantalang ang tradisyonal na “Cristo” ay ibinigay sa talababa para sa pamilyaridad.
- issue: Ellipsis sa κἀγὼ Χριστοῦ
  choice: Inulit ang ipinahiwatig na pandiwang “tumutulad”
  alternative: “kung paanong ako rin ay sa Mesiyas”
  rationale: Hindi inuulit sa Griyego ang pangngalang μιμητής, ngunit malinaw itong ipinahihiwatig ng magkatulad na kayarian. Kailangang ihayag ang ipinahiwatig na diwa upang maging buo at likas sa Filipino, nang hindi binabago ang kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ang “Maging mga tumutulad” ay bahagyang mas pormal kaysa sa payak na “Tularan,” ngunit mas mahusay nitong pinananatili kapwa ang pangngalang μιμηταί at ang puwersa ng γίνεσθε.
