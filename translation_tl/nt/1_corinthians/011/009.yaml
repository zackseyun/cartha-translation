id: 1CO.11.9
reference: 1 Corinthians 11:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ γὰρ οὐκ ἐκτίσθη ἀνὴρ διὰ τὴν γυναῖκα, ἀλλὰ γυνὴ διὰ τὸν ἄνδρα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/009.yaml
  text: For indeed[a], man was not created for the woman, but woman for the man.
translation:
  language: tl
  text: Sapagkat hindi nga nilikha ang lalaki para sa babae, kundi ang babae para sa lalaki.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “dahil sa babae” / “dahil sa lalaki.” Ang Griyegong pang-ukol ay maaaring magpahiwatig ng dahilan o layunin; dito ay isinaling “para sa” ayon sa pangangatwirang nakatuon sa paglikha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Sapagkat … nga
  rationale: Ipinapakita ng “sapagkat” ang paliwanag na kaugnayan sa naunang pangangatwiran, habang likas na naihahatid ng “nga” ang bahagyang pagdiriin ng καί.
- source_word: ἐκτίσθη
  choice: nilikha
  rationale: Tuwirang katumbas ito ng κτίζω at malinaw na tumutukoy sa salaysay ng paglikha.
- source_word: ἀνὴρ / γυνὴ
  choice: lalaki / babae
  rationale: Dahil nakaugat ang pahayag sa salaysay ng paglikha, pangkalahatang lalaki at babae ang tinutukoy, hindi lamang mag-asawa.
- source_word: διὰ τὴν γυναῖκα / διὰ τὸν ἄνδρα
  choice: para sa babae / para sa lalaki
  rationale: Naipahahayag ng “para sa” ang layunin o kapakinabangan nang hindi labis na nililimitahan ang saklaw ng διά na may akusatibo; pinananatili rin nito ang balanseng pagkakatulad ng dalawang parirala.
- source_word: ἀλλὰ
  choice: kundi
  rationale: Ang “kundi” ang natural na panalungat sa Filipino pagkatapos ng sugnay na may “hindi.”
theological_decisions:
- issue: Kung ang ἀνήρ at γυνή ay isasaling “lalaki/babae” o “asawang lalaki/asawang babae”
  choice: lalaki/babae
  alternative: asawang lalaki/asawang babae
  rationale: Ang pandiwang “nilikha” ay nag-uugnay sa pahayag sa salaysay ng paglikha at sumusuporta sa mas malawak na pagtukoy sa lalaki at babae. Hindi ipinapasok ng salin ang mas makitid na interpretasyong para lamang sa pag-aasawa.
- issue: Kung ang διά ay tiyak na layunin o sanhi
  choice: para sa
  alternative: dahil sa
  rationale: Maaaring magpahiwatig ang διά na may akusatibo ng dahilan o layunin. Ang “para sa” ay akma sa pangangatwirang nakatuon sa paglikha, ngunit pinananatili sa talababa ang tunay na leksikal na posibilidad na “dahil sa.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Sapagkat … nga” upang natural na mapanatili kapwa ang paliwanag at pagdiriin ng καὶ γὰρ; pinanatili ang maikli at magkatimbang na anyo ng dalawang sugnay.
