id: 1CO.11.26
reference: 1 Corinthians 11:26
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁσάκις γὰρ ⸀ἐὰν ἐσθίητε τὸν ἄρτον τοῦτον καὶ τὸ ⸀ποτήριον πίνητε, τὸν θάνατον τοῦ κυρίου καταγγέλλετε, ἄχρι ⸀οὗ ἔλθῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/026.yaml
  text: For as often as you eat this bread and drink the cup[b][a], you proclaim the Lord’s death until he comes.
translation:
  language: tl
  text: Sapagkat sa tuwing kinakain ninyo ang tinapay na ito at iniinom ang kopa[a], ipinapahayag ninyo ang kamatayan ng Panginoon hanggang sa dumating siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “ang kopa,” hindi “ang kopang ito” sa talatang ito, bagaman malinaw sa kalapit na konteksto kung aling kopa ang tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁσάκις ... ἐὰν
  choice: sa tuwing
  rationale: 'Ipinahahayag ng parirala ang paulit-ulit ngunit hindi tiyak na pagkakataon: bawat pagkakataong ginagawa ito. Likas at malinaw sa modernong Tagalog ang “sa tuwing.”'
- source_word: γὰρ
  choice: sapagkat
  rationale: Nagbibigay ang γάρ ng paliwanag o batayan para sa naunang tagubilin; pinananatili ng “sapagkat” ang malinaw na ugnayang ito.
- source_word: ἐσθίητε ... πίνητε
  choice: kinakain ninyo ... iniinom
  rationale: Ang mga pandiwa sa sugnay na may ἐὰν ay tumutukoy sa pagkilos sa bawat pagkakataong mangyari ito. Ang aspektong imperpektibo sa Tagalog ay angkop sa paulit-ulit na kilos.
- source_word: τὸν ἄρτον τοῦτον
  choice: ang tinapay na ito
  rationale: Karaniwang kahulugan ng ἄρτος ang “tinapay,” at tahasang nasa Griyego ang demonstratibong τοῦτον, kaya “na ito.”
- source_word: τὸ ποτήριον
  choice: ang kopa
  rationale: May tiyak na pantukoy ang ποτήριον ngunit walang demonstratibong “ito” sa talatang ito. Ang “kopa” ay dignified at pamilyar sa kontekstong ito, habang tumpak na pinananatili ang pagkakaiba sa “tinapay na ito.”
- source_word: καταγγέλλετε
  choice: ipinapahayag ninyo
  rationale: Ang καταγγέλλω ay hayagang pagpapahayag o pagbabalita. Sapat na pormal at natural ang “ipinapahayag” nang hindi dinaragdagan ang kahulugan.
- source_word: τὸν θάνατον τοῦ κυρίου
  choice: ang kamatayan ng Panginoon
  rationale: Direktang pinananatili ng pariralang ito ang solemneng genitibong ugnayan sa Griyego.
- source_word: ἄχρι οὗ ἔλθῃ
  choice: hanggang sa dumating siya
  rationale: Nagtatakda ang sugnay ng hangganang temporal. Natural sa Tagalog ang “hanggang sa dumating siya,” at ang di-binanggit na simuno ay nauunawaan mula sa “Panginoon.”
theological_decisions:
- issue: Tinutukoy ng “siya” sa ἄχρι οὗ ἔλθῃ
  choice: Ang ipinahihiwatig na simuno ay ang Panginoong Jesus.
  alternative: 'Iwan ang pandiwa na walang hayag na panghalip: “hanggang dumating.”'
  rationale: Ang “Panginoon” ang pinakamalapit at pinakanatural na tinutukoy sa konteksto. Ginagawang malinaw ng kinakailangang anyong Tagalog ang ugnayan nang hindi nagdaragdag ng hiwalay na doktrina.
- issue: Pananalita tungkol sa Hapunan ng Panginoon
  choice: Tuwirang isalin ang pagkain ng tinapay, pag-inom sa kopa, at pagpapahayag ng kamatayan ng Panginoon.
  alternative: Gumamit ng parapraseng kumakatawan sa isang partikular na sakramental o memorialistang paliwanag.
  rationale: Sinasabi ng talata na ipinapahayag ng gawaing ito ang kamatayan ng Panginoon, ngunit hindi nito inilalahad dito ang isang ganap na teolohiya ng sakramento. Kaya hindi nilulutas ng salin ang tensiyong hindi nilulutas ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Pinili ang “kopa” sa halip na mas pang-araw-araw na “tasa” dahil ito ay natural sa biblikal at liturhikal na konteksto, ngunit hindi teknikal o sektaryan.
