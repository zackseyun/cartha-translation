  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πᾶσα δὲ γυνὴ προσευχομένη ἢ προφητεύουσα ἀκατακαλύπτῳ τῇ κεφαλῇ καταισχύνει τὴν κεφαλὴν ⸀αὐτῆς, ἓν γάρ ἐστιν καὶ τὸ αὐτὸ τῇ ἐξυρημένῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/005.yaml
  text: But every woman who prays or prophesies with her head uncovered dishonors her head[b][a], for that is one and the same as having been shaved.
translation:
  language: tl
  text: Ngunit ang bawat babaeng nananalangin o nagpapahayag ng propesiya na walang takip sa ulo[b] ay pinapahiya niya ang kaniyang ulo[a], sapagkat walang ipinagkaiba ito sa isang babaeng inahitan ang ulo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bawat asawang babae na nananalangin o nagpapahayag ng propesiya … ay pinapahiya ang kaniyang asawa/ulo.” Ang salitang Griyego para sa “babae” ay maaari ring mangahulugang “asawa,” at ang “ulo” ay maaaring unawain nang literal o metaporikal ayon sa konteksto.
    reason: alternative_reading
  - marker: b
    text: Hindi tinutukoy ng salitang “walang takip” kung ano mismo ang pantakip; magkakaiba ang pagkaunawa kung isang belo ang partikular na tinutukoy o, sa mas pangkalahatan, ang pagiging walang takip ng ulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: babae
  rationale: Maaaring mangahulugang “babae” o “asawa” ang γυνή ayon sa konteksto. Mas natural na pangkalahatan dito ang “bawat babae,” habang inilalahad sa talababa ang posibleng “asawa.”
- source_word: προσευχομένη ἢ προφητεύουσα
  choice: nananalangin o nagpapahayag ng propesiya
  rationale: Ipinahihiwatig ng mga present participle ang mga gawaing isinasagawa. Natural sa modernong Tagalog ang pariralang ito at malinaw na ang προφητεύω ay pagpapahayag ng propesiya, hindi lamang paghula.
- source_word: ἀκατακαλύπτῳ τῇ κεφαλῇ
  choice: nang walang takip ang ulo
  rationale: Pinananatili nitong pangkalahatan ang kawalan ng takip at hindi ipinapalagay kung belo, buhok, o ibang uri ng pantakip ang tinutukoy.
- source_word: καταισχύνει
  choice: nagbibigay-kahihiyan
  rationale: Inihahayag nito ang pampubliko at panlipunang diwa ng pagpapahiya o paglapastangan sa dangal, sa natural na Tagalog.
- source_word: τὴν κεφαλὴν αὐτῆς
  choice: sa kaniyang ulo
  rationale: Pinananatili ang literal na “kaniyang ulo” at ang posibilidad na pisikal o metaporikal ang tinutukoy, sa halip na lutasin ang tunay na kalabuan.
- source_word: ἓν γάρ ἐστιν καὶ τὸ αὐτό
  choice: sapagkat iyon ay walang ipinagkaiba
  rationale: Natural na Tagalog ito para sa mariing pagkakapantay o pagiging iisang bagay na ipinahahayag ng idyomang Griyego.
- source_word: τῇ ἐξυρημένῃ
  choice: sa pagkakaahit ng ulo niya
  rationale: Naipahahayag ng “pagkakaahit” ang kalagayang bunga ng natapos na pag-ahit, alinsunod sa perfect participle.
theological_decisions:
- issue: Kahulugan ng ikalawang κεφαλή sa “nagbibigay-kahihiyan sa kaniyang ulo”
  choice: Panatilihin sa pangunahing teksto ang malabong “kaniyang ulo,” nang hindi tinutukoy kung pisikal o metaporikal.
  alternative: Pisikal na ulo; o metaporikal na “ulo,” gaya ng kaniyang asawa/lalaki sa balangkas ng argumento.
  rationale: Literal na pinahihintulutan ng Griyego ang “kaniyang ulo,” ngunit nagbubukas ang nakapaligid na konteksto ng metaporikal na pagbasa. Hindi dapat tahimik na lutasin ng salin ang tensiyong ito.
- issue: Uri ng pantakip sa ἀκατακαλύπτῳ
  choice: Gamitin ang pangkalahatang “walang takip ang ulo.”
  alternative: Walang belo; o nakalugay/di-natatakpan ng buhok ang ulo.
  rationale: Sinasabi ng salita na walang takip ngunit hindi nito tahasang tinutukoy kung anong uri ng takip. Ang pagtukoy sa belo o buhok sa pangunahing teksto ay lalampas sa mismong leksikal na ebidensiya.
- issue: Saklaw ng γυνή
  choice: Isalin bilang “babae” sa pangunahing teksto.
  alternative: Asawa.
  rationale: Maaaring tumukoy ang γυνή sa babae o asawa. Ang “bawat babaeng nananalangin o nagpapahayag ng propesiya” ay mas likas na pangkalahatang pahayag, ngunit mahalagang panatilihin sa talababa ang pagbasa bilang asawa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “nagpapahayag ng propesiya” para sa madaling pagkaunawa, at iniwasang tukuyin ang eksaktong pantakip o lutasin ang kalabuan ng “ulo.” Ang mga panandang [a] at [b] ay kapuwa nasa pangunahing teksto.
