id: 1CO.11.6
reference: 1 Corinthians 11:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰ γὰρ οὐ κατακαλύπτεται γυνή, καὶ κειράσθω· εἰ δὲ αἰσχρὸν γυναικὶ τὸ κείρασθαι ἢ ξυρᾶσθαι, κατακαλυπτέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/006.yaml
  text: For if a woman does not cover her head[a], she should also have her hair cut off; but if it is disgraceful for a woman to have her hair cut off or to be shaved[b], she should cover her head.
translation:
  language: tl
  text: Sapagkat kung hindi nagtatakip ng ulo ang isang babae[a], magpagupit na rin siya nang maikli. Ngunit kung kahiya-hiya para sa isang babae ang magpagupit nang maikli o magpaahit ng ulo, magtakip siya ng ulo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “asawang babae” sa buong talata; ang Griyegong gynē ay maaaring mangahulugang “babae” o “asawang babae,” depende sa konteksto.
    reason: alternative_reading
  - marker: b
    text: Maaari ring isalin ang pandiwa na “maglambong siya”; ang Griyego ay nagsasaad na siya ay dapat matakpan, at ipinahihiwatig ng konteksto na ulo ang tinatakpan.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακαλύπτεται / κατακαλυπτέσθω
  choice: nagtatakip ng ulo / magtakip siya ng ulo
  rationale: Ang pandiwa ay nangangahulugang takpan o lambungan. Ipinahihiwatig ng konteksto na ulo ang tinatakpan, kaya tahasang binanggit ang “ulo” para sa likas at malinaw na Tagalog nang hindi tumutukoy sa isang tiyak na uri ng pantakip.
- source_word: γυνή
  choice: babae
  rationale: Maaaring mangahulugan ang γυνή ng “babae” o “asawang babae.” Walang tahasang pagbanggit sa asawa sa talatang ito, kaya ang “babae” ang hindi gaanong makitid na salin; inilagay sa talababa ang posibleng kahulugang “asawang babae.”
- source_word: κειράσθω / τὸ κείρασθαι
  choice: magpagupit nang maikli / ang magpagupit nang maikli
  rationale: Tumutukoy ang pandiwa sa paggupit o paggapas ng buhok nang maikli. Pinananatili ng saling ito ang pagkakaiba nito sa ganap na pag-aahit na tinutukoy ng ξυρᾶσθαι, at mas natural ito kaysa sa makalumang pananalita.
- source_word: καί
  choice: na rin
  rationale: 'Ipinakikita nito ang retorikal na kasunod na hakbang sa pangangatwiran: kung hindi siya magtatakip, tanggapin din niya ang pagpapagupit nang maikli.'
- source_word: αἰσχρόν
  choice: kahiya-hiya
  rationale: Naghahatid ito ng bigat ng kahihiyan at di-karangalang panlipunan na taglay ng salita sa konteksto.
- source_word: ξυρᾶσθαι
  choice: magpaahit ng ulo
  rationale: Tumutukoy ang pandiwa sa pag-aahit. Nilinaw ang ipinahihiwatig na ulo upang maging natural sa Tagalog at mapanatili ang kaibhan sa maikling paggupit.
- source_word: γὰρ ... δὲ
  choice: Sapagkat ... Ngunit
  rationale: Malinaw na ipinakikita ng mga pang-ugnay ang paliwanag at kasunod na pagsalungat sa daloy ng pangangatwiran.
theological_decisions:
- issue: Kung ang γυνή ay dapat isaling “babae” o “asawang babae”
  choice: babae
  alternative: asawang babae
  rationale: Pangkalahatan ang anyo ng pahayag at walang tahasang binanggit na asawang lalaki. Pinananatili ng “babae” ang mas malawak na posibilidad, samantalang kinikilala sa talababa ang lehitimong alternatibo ayon sa konteksto.
- issue: Kung ang κατακαλύπτεσθαι ay dapat isaling “magtakip ng ulo” o “maglambong”
  choice: magtakip ng ulo
  alternative: maglambong
  rationale: Ang Griyego ay nagsasaad ng pagiging natatakpan, at ang ulo ang ipinahihiwatig ng konteksto. Hindi nililimitahan ng “magtakip ng ulo” ang pantakip sa isang partikular na kasuotan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “magpagupit nang maikli” upang ipakita ang mas matinding paggupit na kaiba sa simpleng pagpapagupit, habang iniwasan ang makaluma o teknikal na “magpagapas ng buhok.”
