  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὡσαύτως καὶ τὸ ποτήριον μετὰ τὸ δειπνῆσαι, λέγων· Τοῦτο τὸ ποτήριον ἡ καινὴ διαθήκη ἐστὶν ἐν τῷ ἐμῷ αἵματι· τοῦτο ποιεῖτε, ὁσάκις ⸀ἐὰν πίνητε, εἰς τὴν ἐμὴν ἀνάμνησιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/025.yaml
  text: In the same way also[a], after supper, he took the cup, saying, “This cup is the new covenant in my blood. Keep doing this, whenever you drink it[b], in remembrance of me.”
translation:
  language: tl
  text: Gayundin, pagkatapos ng hapunan, kinuha niya ang kopa at sinabi, “Ang kopang ito ang bagong tipan[a] sa aking dugo. Patuloy ninyong gawin ito, sa tuwing umiinom kayo nito[b], bilang pag-alaala sa akin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay maaari ring mangahulugang “testamento,” ngunit higit na naaangkop dito ang “tipan” dahil sa kontekstong biblikal.
    reason: alternative_reading
  - marker: b
    text: O, “sa tuwing iinom kayo.” Ipinahahayag ng Griyegong parirala ang mga pagkakataong paulit-ulit na nagaganap.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσαύτως καὶ
  choice: Gayundin
  rationale: Likas na ipinahahayag sa Filipino ang pagtutugma nito sa naunang ginawa sa tinapay; sapat na naihahatid ng “Gayundin” ang diwa ng ὡσαύτως καί nang hindi mabigat ang pangungusap.
- source_word: τὸ ποτήριον
  choice: ang kopa
  rationale: Ang “kopa” ay malinaw na sisidlang inuman at angkop sa marangal ngunit madaling maunawaang rehistro; hindi nito ipinapalagay ang isang natatanging anyong liturhikal.
- source_word: μετὰ τὸ δειπνῆσαι
  choice: pagkatapos ng hapunan
  rationale: Ipinahahayag ng parirala ang panahon pagkatapos kumain. Ang “pagkatapos ng hapunan” ay maikli, natural, at naaayon sa konteksto ng salu-salo.
- source_word: λέγων
  choice: kinuha niya ang kopa at sinabi
  rationale: Ang participle ay literal na “sinasabi,” ngunit hinihingi ng natural na Filipino ang tahasang pandiwa. Ang “kinuha niya” ay ipinahihiwatig ng paralel na kilos sa naunang talata at nagpapabuo sa pangungusap nang hindi binabago ang mensahe.
- source_word: ἡ καινὴ διαθήκη
  choice: ang bagong tipan
  rationale: Ang “tipan” ang pinakanaaangkop sa konteksto ng dugong nagtatatag ng tipan at sa saligang larawan ng Lumang Tipan. Iniiwasan nito ang di-likas at posibleng mapanlinlang na “testamento.”
- source_word: ἐν τῷ ἐμῷ αἵματι
  choice: sa aking dugo
  rationale: Pinananatili ng “sa aking dugo” ang tuwirang anyo at lawak ng kahulugan ng ἐν, sa halip na ipakahulugan agad bilang “sa pamamagitan ng” o “pinagtibay ng.”
- source_word: τοῦτο ποιεῖτε
  choice: Patuloy ninyong gawin ito
  rationale: Ang present imperative, kasama ng kasunod na sugnay tungkol sa paulit-ulit na pag-inom, ay sumusuporta sa utos na patuloy o paulit-ulit na isagawa ito.
- source_word: ὁσάκις ἐὰν πίνητε
  choice: sa tuwing iinumin ninyo ito
  rationale: 'Ipinahahayag nito ang paulit-ulit na pagkakataon: tuwing nagaganap ang pag-inom. Idinagdag ang “ito” bilang likas na layon sa Filipino, na malinaw na tumutukoy sa kopa.'
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: bilang pag-alaala sa akin
  rationale: Ipinakikita ng “bilang pag-alaala sa akin” ang aktibong paggunita o komemorasyon nang hindi ito ginagawang paliwanag lamang tungkol sa simbolismo.
theological_decisions:
- issue: Kahulugan ng διαθήκη sa konteksto ng hapunan ng Panginoon
  choice: tipan
  alternative: testamento
  rationale: Ang alusyon sa dugong kaugnay ng pagtatatag ng tipan at ang saligang konteksto ng Kasulatan ay higit na sumusuporta sa “tipan.”
- issue: Ugnayan ng kopa at ng bagong tipan
  choice: Pinanatili ang tuwirang pahayag na “Ang kopang ito ang bagong tipan sa aking dugo.”
  alternative: “Ang kopang ito ay kumakatawan sa bagong tipang pinagtibay ng aking dugo.”
  rationale: Tuwirang ipinapahayag ng Griyego ang pagkakakilanlan at hindi nito nilulutas ang mga sumunod na pagtatalo tungkol sa presensiya o simbolismo. Pinananatili ng salin ang teolohikal na tensiyon nang walang idinadagdag na posisyong denominasyonal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kopa” at “tipan” bilang madaling makilalang mga salitang biblikal nang hindi nagpapasok ng natatanging wikang denominasyonal. Pinanatili ang tuwirang pahayag tungkol sa kopa, tipan, at dugo.
