  text: Ὥστε, ἀδελφοί μου, συνερχόμενοι εἰς τὸ φαγεῖν ἀλλήλους ἐκδέχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/033.yaml
  text: So then[a], my brothers, when you come together to eat, wait for one another.
translation:
  language: tl
  text: Kaya nga, mga kapatid ko[a], kapag nagtitipon kayo upang kumain, hintayin ninyo ang isa’t isa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “mga kapatid na lalaki”; madalas gamitin ang panlalaking anyong ito bilang tawag sa isang kongregasyong binubuo ng mga lalaki at babae.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: Kaya nga
  rationale: Naghahayag ito ng kongklusyon mula sa naunang pagsaway tungkol sa mga maling gawain sa hapunan ng Panginoon. Likas sa Filipino ang “Kaya nga” at napapanatili nito ang lohikal na ugnayan.
- source_word: ἀδελφοί μου
  choice: mga kapatid ko
  rationale: Ang bokatibong parirala ay literal na “mga kapatid ko.” Bagaman panlalaki ang anyo sa Griyego, karaniwang ginagamit ito sa buong kongregasyon. Ang “mga kapatid” ang likas at marangal na katumbas sa Filipino at maaari itong tumukoy sa kapwa lalaki at babae.
- source_word: συνερχόμενοι
  choice: kapag nagtitipon kayo
  rationale: Ang participle ay naglalarawan sa kalagayan o pagkakataon kung kailan dapat sundin ang utos. Ang “kapag nagtitipon kayo” ay natural at kaayon ng paulit-ulit na pananalita tungkol sa pagtitipon sa kabanatang ito.
- source_word: εἰς τὸ φαγεῖν
  choice: upang kumain
  rationale: Ang preposisyon at articular infinitive ay nagpapahayag ng layunin. Malinaw itong naihahayag ng “upang kumain” nang hindi dinaragdagan ang uri ng pagkain.
- source_word: ἀλλήλους
  choice: ang isa’t isa
  rationale: Ito ay reciprocal pronoun na tumutukoy sa magkabilang panig ng sama-samang pagkilos. Ang “isa’t isa” ang karaniwang katumbas sa Filipino.
- source_word: ἐκδέχεσθε
  choice: hintayin ninyo
  rationale: Sa konteksto ng ilan na nauunang kumain kaysa sa iba, ang pinakanaaangkop na kahulugan ay ang paghihintay bago magsimulang kumain. May mas malawak na posibilidad ang pandiwa na “tanggapin,” ngunit “hintayin” ang malinaw na praktikal na utos dito.
theological_decisions:
- issue: Ang panlalaking anyo ng ἀδελφοί bilang tawag sa kongregasyon
  choice: Gamitin ang “mga kapatid” sa pangunahing teksto at ipaliwanag sa talababa ang panlalaking anyo ng Griyego at ang malamang na saklaw nito sa buong kongregasyon.
  alternative: “mga kapatid na lalaki”
  rationale: Panlalaki ang gramatikal na anyo sa Griyego, ngunit madalas nitong tinutukoy ang magkakahalong kongregasyon. Sa Filipino, ang karaniwang “mga kapatid” ay tapat sa relasyong ipinahahayag ng salita at likas na hindi nagtatakda ng kasarian; nililinaw ng talababa ang anyo ng pinagmulan nang hindi ipinapalagay na mga lalaki lamang ang kinakausap.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikli at tuwirang anyo ng pangwakas na tagubilin, habang ang “nagkakatipon,” “upang kumain,” at “hintayin” ay natural sa karaniwang pagbasa sa Bibliya.
