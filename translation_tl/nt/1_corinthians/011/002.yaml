  yaml_path: translation/nt/1_corinthians/011/002.yaml
  text: I praise you because you remember me in everything and hold firmly to the traditions just as I delivered them to you[a].
translation:
  language: tl
  text: Pinupuri ko kayo sapagkat inaalala ninyo ako sa lahat ng bagay at mahigpit ninyong pinanghahawakan ang mga tradisyong ipinasa ko sa inyo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga aral” o “mga tagubilin.” Sa Griego, “mga tradisyon,” ibig sabihin, ang mga bagay na ipinasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπαινῶ
  choice: Pinupuri ko
  rationale: Tuwirang ipinapahayag ang positibong papuri ni Pablo at natural sa kasalukuyang Filipino.
- source_word: δὲ
  choice: hindi tahasang isinalin
  rationale: Mahinang panandang pangdiskurso ito rito; hindi kailangan ng hiwalay na salita sa Filipino, at ang paglalagay ng “ngayon” o “ngunit” ay maaaring magbigay ng labis na temporal o salungat na diwa.
- source_word: ὑμᾶς
  choice: kayo
  rationale: Pinananatili ang ikalawang panauhang maramihan.
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw na ipinakikilala ang dahilan ng papuri.
- source_word: πάντα μου μέμνησθε
  choice: lagi ninyo akong naaalala
  rationale: Sa idyomatikong ugnayan ng πάντα at μέμνησθε, maaaring tumukoy ang parirala sa patuloy o palagiang pag-alaala; natural ito sa Filipino, bagaman maaari ring unawain bilang “sa lahat ng bagay.”
- source_word: καθὼς παρέδωκα ὑμῖν
  choice: itinuro ko sa inyo
  rationale: Ipinahahayag sa natural na Filipino ang paghahatid o pagpapasa ni Pablo ng apostolikong aral at gawain; ang ideya ng ipinasa ay pinananatili rin sa salitang “tradisyon.”
- source_word: τὰς παραδόσεις
  choice: ang mga tradisyon
  rationale: Pinananatili ang pangunahing leksikal na diwa ng mga bagay na ipinamana o ipinasa, nang hindi ito nililimitahan sa alinmang kalaunang doktrinang denominasyonal.
- source_word: κατέχετε
  choice: mahigpit ninyong pinanghahawakan
  rationale: Ipinakikita ang aktibong pagpapanatili at matatag na pagsunod, hindi lamang simpleng pag-iingat.
theological_decisions:
- issue: Pagpapakahulugan sa παραδόσεις sa konteksto ng iglesya
  choice: mga tradisyon
  alternative: mga aral; mga tagubilin
  rationale: Ang tinutukoy ay mga bagay na ipinasa ni Pablo sa mga taga-Corinto. Pinananatili ng “mga tradisyon” ang kategorya ng ipinamanang apostolikong materyal nang hindi nag-aangkat ng kalaunang pananaw ng alinmang denominasyon.
- issue: Saklaw ng πάντα kasama ng μέμνησθε
  choice: lagi ninyo akong naaalala
  alternative: naaalala ninyo ako sa lahat ng bagay
  rationale: Maaaring magkaroon ang πάντα ng diwang pang-abay na “lagi” sa kontekstong ito. Ang pangunahing teksto ay ginawang natural sa Filipino, habang kinikilala sa tala ang mas literal na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sapagkat” para sa bahagyang pormal na himig ng liham at “pinanghahawakan” para sa matatag ngunit likas na pagpapahayag.
