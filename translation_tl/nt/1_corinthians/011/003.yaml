id: 1CO.11.3
reference: 1 Corinthians 11:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: θέλω δὲ ὑμᾶς εἰδέναι ὅτι παντὸς ἀνδρὸς ἡ κεφαλὴ ὁ Χριστός ἐστιν, κεφαλὴ δὲ γυναικὸς ὁ ἀνήρ, κεφαλὴ δὲ ⸀τοῦ Χριστοῦ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/003.yaml
  text: But I want you to know that the head of every man is Messiah[a], and the head of a woman is the man[b], and the head of Messiah is God.
translation:
  language: tl
  text: Ngunit nais kong malaman ninyo na ang ulo ng bawat lalaki ay ang Mesiyas[a], ang ulo naman ng babae ay ang lalaki[b], at ang ulo ng Mesiyas ay ang Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “ulo” ay maaari ring unawain bilang “pinagmulan” o “may awtoridad sa”; pinanatili sa pangunahing teksto ang metapora ng Griyego.
    reason: lexical_alternative
  - marker: b
    text: Ang “babae” at “lalaki” rito ay maaari ring basahing “asawang babae” at “asawang lalaki.”
    reason: alternative_reading
lexical_decisions:
- source_word: θέλω δὲ ὑμᾶς εἰδέναι
  choice: Ngunit nais kong malaman ninyo
  rationale: Natural at tuwirang ipinapahayag ang hangarin ni Pablo na may banayad na paglipat mula sa naunang talakayan.
- source_word: παντὸς ἀνδρὸς
  choice: bawat lalaki
  rationale: Pinananatili ang pangkalahatang kahulugan ng ἀνήρ dito, sa halip na agad itong limitahan sa 'asawa.'
- source_word: κεφαλή
  choice: ulo
  rationale: Pinananatili ang mismong metapora ng Griyego upang hindi pagpasiyahan sa salin kung ang diin ay pinagmulan, awtoridad, o ibang ugnayang ipinahihiwatig nito.
- source_word: ὁ Χριστός / τοῦ Χριστοῦ
  choice: ang Mesiyas / ng Mesiyas
  rationale: Isinasalin ang Χριστός bilang titulong 'Mesiyas' at pinananatiling pareho sa dalawang paglitaw.
- source_word: γυναικός
  choice: ng babae
  rationale: Ang γυνή ay maaaring mangahulugang babae o asawa; pinili ang mas pangkalahatang pagbasa sa pangunahing teksto.
- source_word: ὁ ἀνήρ
  choice: ang lalaki
  rationale: Tinutumbasan ang γυνή sa pangkalahatang pagbasa at iniiwan sa talababa ang posibleng kahulugang 'asawang lalaki.'
- source_word: ὁ θεός
  choice: ang Diyos
  rationale: Karaniwang salin ng θεός; natural sa Filipino ang pantukoy na 'ang' sa sugnay na ito.
theological_decisions:
- issue: Kahulugan ng κεφαλή sa tatlong magkakatulad na sugnay
  choice: Panatilihin bilang 'ulo' nang hindi nililinaw sa pangunahing teksto.
  alternative: '''pinagmulan'' o ''may awtoridad sa ibabaw ng'''
  rationale: Pinananatili nito ang tunay na metaporikal at teolohikal na tensiyon ng Griyego sa halip na lutasin iyon sa pamamagitan ng interpretatibong salin.
- issue: Kung ang ἀνήρ at γυνή ay lalaki/babae o mag-asawa
  choice: Gamitin ang 'lalaki' at 'babae' sa pangunahing teksto.
  alternative: '''asawang lalaki'' at ''asawang babae'''
  rationale: Pabor sa pangkalahatang pagbasa ang magkakatulad na ayos ng mga sugnay, ngunit tunay na posible sa bokabularyo at konteksto ang pagbasa tungkol sa mag-asawa.
- issue: Pahayag na ang ulo ng Mesiyas ay ang Diyos
  choice: Isalin nang tuwiran nang walang paliwanag na idinadagdag sa pangunahing teksto.
  alternative: Paraprasang nililimitahan ito sa isang partikular na uri ng kaayusan o tungkulin
  rationale: Iniiwasang pahinain, palawakin, o bigyan ng isang doktrinal na paliwanag ang mismong pahayag ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'nais kong malaman ninyo' bilang natural na pahayag, at pinanatili ang tatlong magkakatulad na sugnay at ang metaporang 'ulo.'
