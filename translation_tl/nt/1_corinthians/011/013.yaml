  text: 'Judge for yourselves: is it proper for a woman to pray to God with her head uncovered?[a]'
translation:
  language: tl
  text: 'Kayo na mismo ang humatol: nararapat bang manalangin sa Diyos ang isang babae na walang takip sa ulo?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang asawang babae,” kung ang γυνή ay inuunawa sa kahulugang pangmag-asawa ayon sa mas malawak na konteksto ng bahaging ito.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ὑμῖν αὐτοῖς
  choice: Kayo na mismo
  rationale: Natural na Filipino itong pagbibigay-diin sa sariling paghatol ng mga taga-Corinto, sa halip na literal ngunit di-likas na “sa inyong sarili.”
- source_word: κρίνατε
  choice: humatol
  rationale: Pinananatili nito ang tuwirang lakas ng aorist imperative at ang panawagan ni Pablo na magsuri at magpasya ang mga mambabasa.
- source_word: πρέπον ἐστὶν
  choice: nararapat ba
  rationale: Malinaw at marangal na katumbas ito ng tanong kung ang kilos ay angkop ayon sa kaayusan o kagandahang-asal.
- source_word: γυναῖκα
  choice: isang babae
  rationale: Maaaring mangahulugang “babae” o “asawang babae” ang γυνή. Dahil walang tahasang banggit sa asawa sa talatang ito at pangkalahatan ang tanong, “isang babae” ang pangunahing salin; inilalagay sa talababa ang posibleng kahulugang pangmag-asawa.
- source_word: ἀκατακάλυπτον
  choice: nang walang takip ang kanyang ulo
  rationale: Literal itong “walang takip,” ngunit ipinahihiwatig ng konteksto na ulo ang tinutukoy. Nililinaw iyon sa natural na Filipino nang hindi tinutukoy kung anong uri ng takip.
- source_word: τῷ θεῷ
  choice: sa Diyos
  rationale: Ang datibo kasunod ng προσεύχομαι ay tumutukoy sa pinatutungkulan ng panalangin; “sa Diyos” ang karaniwang natural na anyo sa Filipino.
- source_word: προσεύχεσθαι
  choice: manalangin
  rationale: Tuwiran at dignified na katumbas ng infinitibong “manalangin,” na nakasalalay sa tanong kung nararapat ang gayong paraan ng pagdarasal.
theological_decisions:
- issue: Kahulugan ng γυνή sa usapin ng pagtatakip ng ulo
  choice: isang babae
  alternative: isang asawang babae
  rationale: Hindi tahasang binabanggit ng talata ang isang asawa o mister, kaya hindi nililimitahan ng pangunahing salin ang pahayag sa mga may asawa. Gayunman, pinananatili sa talababa ang tunay na posibilidad ng kahulugang pangmag-asawa sa mas malawak na konteksto.
translation_notes:
  register: Makabagong Filipino na tuwiran, marangal, at madaling maunawaan. Ang “Kayo na mismo ang humatol” ay nagpapanatili sa retorikal na diin, habang ang “walang takip ang kanyang ulo” ay nililinaw ang ipinahihiwatig ng konteksto nang hindi nagdaragdag ng uri o anyo ng takip.
