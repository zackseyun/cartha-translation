  text: Βλέπετε γὰρ τὴν κλῆσιν ὑμῶν, ἀδελφοί, ὅτι οὐ πολλοὶ σοφοὶ κατὰ σάρκα, οὐ πολλοὶ δυνατοί, οὐ πολλοὶ εὐγενεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/026.yaml
  text: 'For consider your calling, brothers: not many of you were wise by human standards, not many were powerful, not many were of noble birth.'
translation:
  language: tl
  text: 'Sapagkat isaalang-alang ninyo ang inyong pagkatawag, mga kapatid[a]: hindi marami sa inyo ang marunong ayon sa pamantayan ng tao, hindi marami ang makapangyarihan, at hindi marami ang ipinanganak sa marangal na angkan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga kapatid” ay pantawag dito sa buong kongregasyon at kabilang dito ang mga babaeng mananampalataya gayundin ang mga lalaki.
    reason: cultural_note
lexical_decisions:
- source_word: Βλέπετε
  choice: isaalang-alang ninyo
  rationale: Maaaring anyong pautos o pasalaysay ang Griyego, ngunit sa konteksto ay hinihimok ni Pablo ang mga mambabasa na pag-isipan ang sarili nilang kalagayan. Likas sa modernong Tagalog ang “isaalang-alang ninyo” at napapanatili nito ang retorikal na puwersa.
- source_word: κλῆσιν
  choice: pagkatawag
  rationale: Tumutukoy ito sa pagtawag ng Diyos sa mga mananampalataya, hindi sa hanapbuhay o katayuan nila. Pinananatili ng “pagkatawag” ang anyong pangngalan at ang teolohikal na bigat ng salita.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Ang “mga kapatid” ay likas at marangal na pantawag sa buong kongregasyon sa Tagalog. Nililinaw sa talababa na kabilang dito ang mga babaeng mananampalataya.
- source_word: οὐ πολλοὶ ... σοφοὶ
  choice: hindi marami sa inyo ang marunong
  rationale: Ginagawang hayag ang ipinahihiwatig na pagtukoy sa mga taga-Corinto upang maging malinaw at natural sa Tagalog. Ang “marunong” ay angkop sa karunungang kinikilala ng lipunan.
- source_word: κατὰ σάρκα
  choice: ayon sa pamantayan ng tao
  rationale: Sa kontekstong ito, tumutukoy ang parirala sa pagsusuri batay sa karaniwang pananaw ng tao, hindi sa literal na laman o sa isang tiyak na doktrina tungkol sa makasalanang kalikasan.
- source_word: δυνατοί
  choice: makapangyarihan
  rationale: Saklaw nito ang lakas, kapangyarihan, o mataas na impluwensiyang panlipunan nang hindi nililimitahan ang kahulugan sa isang uri lamang ng kapangyarihan.
- source_word: εὐγενεῖς
  choice: ipinanganak sa marangal na angkan
  rationale: Malinaw nitong ipinahahayag ang mataas na pinagmulan o katayuang minana sa kapanganakan, sa halip na ipakahulugang marangal lamang ang asal.
theological_decisions:
- issue: Ang tinutukoy ng “pagkatawag”
  choice: Pinanatili bilang “pagkatawag sa inyo,” na sa konteksto ay pagtawag ng Diyos.
  alternative: “kalagayan ninyo nang tawagin kayo ng Diyos”
  rationale: Hindi ginawang tahasan sa pangunahing teksto ang Diyos bilang gumagawa sapagkat hindi siya pinangalanan sa mismong parirala, ngunit pinananatili ng salin ang karaniwang kahulugan ng κλῆσις kay Pablo nang hindi ito ginagawang propesyon o katayuan sa buhay.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang paulit-ulit na “hindi marami” upang maipakita ang diin at ritmo ng Griyego; ginamit ang “ayon sa pamantayan ng tao” bilang likas na pagpapahayag ng idyomang κατὰ σάρκα sa kontekstong ito.
