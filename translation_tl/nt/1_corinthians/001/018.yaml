  source_fidelity: Tumpak na naihahatid ng salin ang λόγος τοῦ σταυροῦ bilang mensaheng may kinalaman sa krus, ang magkatapat na kasalukuyang kalagayan ng mga napapahamak at ng mga inililigtas, at ang “kapangyarihan ng Diyos.” Ang “patuloy na inililigtas” ay mas malinaw na nagpapakita ng aspektong kasalukuyan at nagpapatuloy ng σῳζομένοις.
  naturalness: Natural at marangal ang pangungusap sa modernong Filipino. Ang pagdaragdag ng “patuloy na” ay nagpapalinaw sa diwang proseso nang hindi nagiging pilit.
  terminology: Ang “mensahe,” “krus,” “kahangalan,” at “kapangyarihan ng Diyos” ay angkop at matatag na mga katumbas. Ang “mensahe tungkol sa krus” ay natural na paraan upang ipahayag ang genitibong Griyego; itinatala ng talababa ang mas malapit na alternatibong “salita ng krus.”
