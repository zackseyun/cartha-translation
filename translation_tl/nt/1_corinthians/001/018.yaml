  text: Ὁ λόγος γὰρ ὁ τοῦ σταυροῦ τοῖς μὲν ἀπολλυμένοις μωρία ἐστίν, τοῖς δὲ σῳζομένοις ἡμῖν δύναμις θεοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/018.yaml
  text: For the message of the cross is foolishness to those who are perishing[b][a], but to us who are being saved it is the power of God.
translation:
  language: tl
  text: Sapagkat ang mensahe tungkol sa krus[a] ay kahangalan para sa mga napapahamak, ngunit para sa atin na patuloy na inililigtas[b], ito ang kapangyarihan ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “salita ng krus.”
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, ang “patuloy na inililigtas” ay nasa anyong naglalarawan sa kaligtasan bilang nagpapatuloy na realidad.
    reason: alternative_reading
lexical_decisions:
- source_word: λόγος
  choice: mensahe
  rationale: Sa konteksto, tumutukoy ito sa nilalamang ipinahahayag tungkol sa krus, hindi lamang sa isang salita. Ang “mensahe” ay likas at malinaw sa modernong Filipino.
- source_word: σταυροῦ
  choice: krus
  rationale: Pinananatili ang tuwirang larawan at maigting na pagpapahayag ni Pablo; maaari rin itong tumukoy sa pagkakapako ni Cristo sa krus.
- source_word: ἀπολλυμένοις
  choice: mga napapahamak
  rationale: Ipinahihiwatig ng present participle ang nagpapatuloy na kalagayan. Natural sa Filipino ang “napapahamak” at hindi nito pinahihina ang seryosong diwa ng pandiwa.
- source_word: μωρία
  choice: kahangalan
  rationale: Malinaw at dignified na katumbas ito ng μωρία at pinananatili ang matinding kaibahan sa kapangyarihan ng Diyos.
- source_word: σῳζομένοις
  choice: sa atin na inililigtas
  rationale: Pinananatili ng “inililigtas” ang aspektong nagpapatuloy ng present passive participle at ng tahasang ἡμῖν, “atin.”
- source_word: δύναμις θεοῦ
  choice: kapangyarihan ng Diyos
  rationale: Malapit ito sa anyo ng Griyego at pinananatili ang bigat ng panaguring nagbibigay-diin sa banal na kapangyarihan.
theological_decisions:
- issue: Aspekto ng kaligtasan sa σῳζομένοις
  choice: sa atin na inililigtas
  alternative: sa atin na ligtas
  rationale: Ang present participle ay natural na naghahayag ng nagpapatuloy na pagliligtas o kasalukuyang karanasan nito. Hindi nito nililimitahan ang kaligtasan sa isang natapos na pangyayari lamang.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “Sapagkat” upang ihayag ang paliwanag na ipinakikilala ng γάρ. Iningatan ang magkatapat na nagpapatuloy na kalagayan ng “napapahamak” at “inililigtas,” pati ang tahasang pagsasama ni Pablo sa “atin.”
