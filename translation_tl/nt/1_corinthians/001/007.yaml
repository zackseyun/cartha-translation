  text: ὥστε ὑμᾶς μὴ ὑστερεῖσθαι ἐν μηδενὶ χαρίσματι, ἀπεκδεχομένους τὴν ἀποκάλυψιν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/007.yaml
  text: so that you do not lack any gift as you eagerly await the revelation of our Lord Jesus the Messiah[a][b][c].
translation:
  language: tl
  text: Kaya hindi kayo nagkukulang sa anumang kaloob[a] habang sabik ninyong hinihintay ang paghahayag[b] ng ating Panginoong Jesu-Cristo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “anumang kaloob na espirituwal” o “anumang kaloob ng biyaya.”
    reason: lexical_alternative
  - marker: b
    text: O “pagpapakita nang hayagan.”
    reason: lexical_alternative
  - marker: c
    text: Sa Griyego, “Jesus Christ”; maaari ring isalin ang titulo bilang “Jesus na Mesiyas.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: Kaya
  rationale: Ipinahahayag ang bunga ng biyaya ng Diyos na binanggit sa naunang konteksto; natural at malinaw ito sa modernong Tagalog.
- source_word: ὑμᾶς μὴ ὑστερεῖσθαι
  choice: hindi kayo nagkukulang
  rationale: Tuwirang ipinahahayag ang kawalan ng kakulangan at pinananatili ang ugnayan sa kasalukuyang kalagayan ng mga taga-Corinto.
- source_word: ἐν μηδενὶ χαρίσματι
  choice: sa anumang kaloob
  rationale: Ang “kaloob” ay natural na katumbas ng χάρισμα bilang bagay na ipinagkaloob dahil sa biyaya, nang hindi agad nililimitahan sa isang tiyak na uri.
- source_word: ἀπεκδεχομένους
  choice: habang sabik ninyong hinihintay
  rationale: Pinananatili ang nagpapatuloy at masidhing paghihintay na ipinahihiwatig ng pinatinding pandiwa.
- source_word: ἀποκάλυψιν
  choice: paghahayag
  rationale: Malapit ito sa pangunahing diwa ng ἀποκάλυψις bilang pag-aalis ng pagkakubli; hindi nito tahimik na pinapalitan ang konsepto ng simpleng pagpapakita.
- source_word: τοῦ κυρίου ἡμῶν
  choice: ng ating Panginoon
  rationale: Karaniwan, marangal, at tumpak na salin ng parirala sa kontekstong Bagong Tipan.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesu-Cristo
  rationale: Sa pariralang ito, ang Χριστός ay gumaganap bilang nakasanayang, pangalang-tulad na katawagan; “Jesu-Cristo” ang natural at pormal na anyo sa Tagalog.
theological_decisions:
- issue: Saklaw ng χάρισμα
  choice: kaloob
  alternative: kaloob na espirituwal / kaloob ng biyaya
  rationale: Hindi tahasang naroon sa Griyego ang pang-uri na “espirituwal.” Ang payak na “kaloob” ay nagpapanatili sa lawak ng salita, habang ang konteksto ay nagpapahiwatig na ito ay bunga ng biyaya ng Diyos.
- issue: Diwa ng ἀποκάλυψις
  choice: paghahayag
  alternative: pagpapakita / pagpapakita nang hayagan
  rationale: Pinananatili ng “paghahayag” ang leksikal at eskatolohikal na diwa ng pag-aalis ng pagkakubli. Ang “pagpapakita” ay posibleng kontekstuwal na salin ngunit mas interpretatibo.
- issue: Pagpapakahulugan sa Χριστοῦ sa Ἰησοῦ Χριστοῦ
  choice: Jesu-Cristo
  alternative: Jesus na Mesiyas
  rationale: Dito ay bahagi ito ng nakasanayang tambalang katawagan at hindi hiwalay na itinatampok bilang titulo. Itinatala sa talababa ang mas lantad na salin ng titulong “Mesiyas.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kayo” at “ninyong” para sa maramihang kausap, “kaloob” sa halip na mas teknikal na tambalan sa pangunahing teksto, at “Jesu-Cristo” bilang nakasanayang pormal na anyo.
