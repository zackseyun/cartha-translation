id: 1CO.1.30
reference: 1 Corinthians 1:30
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐξ αὐτοῦ δὲ ὑμεῖς ἐστε ἐν Χριστῷ Ἰησοῦ, ὃς ἐγενήθη ⸂σοφία ἡμῖν⸃ ἀπὸ θεοῦ, δικαιοσύνη τε καὶ ἁγιασμὸς καὶ ἀπολύτρωσις,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/030.yaml
  text: And it is from him that you are in Messiah Jesus[a], who became for us wisdom from God, and righteousness and sanctification and redemption,
translation:
  language: tl
  text: Ngunit mula sa kanya, kayo ay nasa Mesiyas na si Jesus, na para sa atin ay naging karunungang mula sa Diyos, at katuwiran[a], pagpapabanal, at katubusan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “katarungan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ αὐτοῦ
  choice: dahil sa kanya
  rationale: Ipinahahayag nito na sa Diyos nagmumula ang kalagayan ng mga mananampalataya kay Jesus na Mesiyas, habang nananatiling natural sa makabagong Tagalog.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: na kay Jesus na Mesiyas
  rationale: Pinananatili ng “na kay” ang karaniwang biblikal na pananalita tungkol sa pakikiisa kay Jesus; isinasalin ang Χριστός bilang titulong “Mesiyas,” hindi bilang apelyido.
- source_word: ἐγενήθη
  choice: naging
  rationale: Tuwirang katumbas ito ng γίνομαι at ipinahahayag kung ano ang naging papel ni Jesus na Mesiyas para sa mga mananampalataya.
- source_word: σοφία ἡμῖν ἀπὸ θεοῦ
  choice: para sa atin ay naging karunungang mula sa Diyos
  rationale: Pinananatili ang diwang ang karunungan ay mula sa Diyos at si Jesus na Mesiyas ang naging karunungang ito para sa atin.
- source_word: δικαιοσύνη
  choice: katuwiran
  rationale: Ang “katuwiran” ang pinakanaaangkop sa soteriolohikal na konteksto, habang inilalagay sa talababa ang posibleng “katarungan.”
- source_word: ἁγιασμός
  choice: pagpapabanal
  rationale: Ipinahahayag nito ang paggawa o pagtatalaga bilang banal at nananatiling pamilyar na teolohikal na salita sa Tagalog.
- source_word: ἀπολύτρωσις
  choice: katubusan
  rationale: Karaniwan at tumpak itong salin para sa paglaya o pagtubos na ipinahihiwatig ng salita.
theological_decisions:
- issue: Ugnayan ng “karunungang mula sa Diyos” sa “katuwiran, pagpapabanal, at katubusan”
  choice: Pinanatili ang mga pangngalan bilang magkakasunod na paglalarawan nang walang dagdag na paliwanag o bantas na magtatakda sa mga ito bilang tahasang pagpapaliwanag lamang ng “karunungan.”
  alternative: Maaaring unawain ang tatlong huling pangngalan bilang pagpapaliwanag kung paano naging karunungan mula sa Diyos ang Mesiyas, o bilang magkakahanay na kaloob/papel kasama ng karunungan.
  rationale: Maluwag ang sintaks ng Griyego sa eksaktong relasyon ng apat na pangngalan. Ang payak na paghahanay ay nagpapanatili sa tunay na kalabuan at teolohikal na tensiyon.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “Jesus na Mesiyas” upang natural na maipakita na titulo ang Χριστός. Inilagay ang panandang [a] sa “katuwiran,” ang salitang tinutukoy ng talababa.
