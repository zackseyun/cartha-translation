id: 1CO.1.16
reference: 1 Corinthians 1:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐβάπτισα δὲ καὶ τὸν Στεφανᾶ οἶκον· λοιπὸν οὐκ οἶδα εἴ τινα ἄλλον ἐβάπτισα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/016.yaml
  text: I also baptized the household of Stephanas[a]; beyond that[b], I do not know if I baptized anyone else.
translation:
  language: tl
  text: Binawtismuhan ko rin ang sambahayan ni Estefanas[a]. Maliban doon, hindi ko alam kung may iba pa akong binawtismuhan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang bahay ni Estefanas.” Ang salitang Griyego ay maaaring tumukoy sa buong sambahayan, hindi lamang sa isang gusali.
    reason: lexical_alternative
  - marker: b
    text: O “kung binawtismuhan ko ang iba pa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβάπτισα
  choice: binawtismuhan ko
  rationale: Tuwirang tumutukoy ang pandiwa sa pangangasiwa ng bautismo. Karaniwan at malinaw sa modernong Tagalog ang “binawtismuhan,” nang hindi nagpapasya tungkol sa paraan ng bautismo.
- source_word: δὲ καὶ
  choice: rin
  rationale: Magkasamang nag-uugnay at nagdaragdag ang δὲ at καὶ sa naunang talaan. Likas na naipapahayag ito ng “rin” sa Tagalog.
- source_word: τὸν Στεφανᾶ οἶκον
  choice: ang sambahayan ni Estefanas
  rationale: Sa kontekstong ito, ang οἶκος ay malamang na tumutukoy sa sambahayan bilang pangkat ng mga tao, hindi lamang sa gusali. Mas malawak ang “sambahayan” kaysa “pamilya” at mas angkop kaysa literal na “bahay.”
- source_word: λοιπὸν
  choice: maliban doon
  rationale: Ipinakikita ng λοιπόν ang natitira bukod sa kababanggit na eksepsiyon. Malinaw at natural sa Tagalog ang “maliban doon.”
- source_word: οὐκ οἶδα
  choice: hindi ko alam
  rationale: Pinananatili nito ang tuwirang kahulugan ng Griyego. Bagaman pag-alaala ang ipinahihiwatig ng konteksto, hindi iyon tahasang idinadagdag sa salin.
- source_word: εἴ τινα ἄλλον ἐβάπτισα
  choice: kung may iba pa akong binawtismuhan
  rationale: Likas na ipinapahayag ng “kung may iba pa” ang kawalang-katiyakan tungkol sa sinumang karagdagang taong nabawtismuhan ni Pablo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “sambahayan” upang mapanatili ang lawak ng οἶκος, at “hindi ko alam” upang hindi gawing tahasang “hindi ko maalala” ang ipinahihiwatig lamang ng konteksto.
