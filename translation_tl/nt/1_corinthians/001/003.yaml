  yaml_path: translation/nt/1_corinthians/001/003.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a].
translation:
  language: tl
  text: Sumainyo nawa ang biyaya at kapayapaang mula sa Diyos na ating Ama at sa Panginoong Jesus na Mesiyas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “Panginoong Jesu-Cristo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: biyaya
  rationale: Karaniwan at makahulugang salin ng terminong ginagamit ni Pablo sa pagbati; pinananatili nito ang diwa ng kaloob at kagandahang-loob ng Diyos.
- source_word: ὑμῖν
  choice: sumainyo nawa
  rationale: Likas na pormula ng pagpapala sa Tagalog na naghahatid sa datibong diwa nang hindi ginagawang payak na pahayag lamang.
- source_word: εἰρήνη
  choice: kapayapaan
  rationale: Pinananatili ang malawak na diwa ng kapayapaan, kabilang ang maayos na ugnayan at ganap na kalagayan.
- source_word: ἀπὸ
  choice: mula sa
  rationale: Tuwirang ipinapakita ang pinagmumulan ng biyaya at kapayapaan.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Diyos na ating Ama
  rationale: Natural na Tagalog na pinananatili ang Diyos at 'ating Ama' bilang iisang tinutukoy.
- source_word: κυρίου
  choice: Panginoon
  rationale: Karaniwang salin ng κύριος na pinananatili ang bigat ng titulo.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesu-Cristo
  rationale: Ang 'Cristo' ang natural at kinikilalang anyong Tagalog ng Χριστός sa pormulang ito; nililinaw sa talababa ang leksikal na kahulugang 'Mesiyas'.
theological_decisions:
- issue: Kung pananatilihin ang iisang pinagmumulan ng biyaya at kapayapaan kaugnay ng Ama at ni Jesus
  choice: Isang pariralang 'mula sa' ang namamahala kapwa sa 'Diyos na ating Ama' at sa 'Panginoong Jesu-Cristo.'
  alternative: Ulitin ang 'mula sa' bago ang Panginoong Jesu-Cristo.
  rationale: Iisang ἀπό ang ginagamit sa Griyego para sa dalawang magkaugnay na tinutukoy; pinananatili ng salin ang koordinasyong ito nang walang idinadagdag na paliwanag na doktrinal.
- issue: Paglilipat ng Χριστός bilang titulo
  choice: Cristo sa pangunahing teksto, na may talababa na 'Mesiyas.'
  alternative: Panginoong Jesus na Mesiyas
  rationale: Sa modernong Tagalog, natural at dignidad ang 'Jesu-Cristo' sa pambungad na pagbating ito, habang pinananatili ng talababa ang lantad na kahulugan ng titulong Χριστός.
translation_notes:
  register: Modernong Filipino Tagalog na may dignidad at pamilyar na himig ng pagpapala. Ginamit ang 'sumainyo nawa' upang maging natural ang pagbati, at iniwasan ang labis na pagpapaliwanag sa loob ng talata.
