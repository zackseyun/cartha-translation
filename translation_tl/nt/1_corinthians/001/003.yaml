  terminology: Ang ‘biyaya,’ ‘kapayapaan,’ ‘Diyos na ating Ama,’ at ‘Panginoon’ ay angkop. Ang ‘Mesiyas’ ang mas malinaw na salin ng Χριστός bilang titulo; ang ‘Jesu-Cristo’ ay maaaring panatilihin bilang leksikal at nakagawiang alternatibo sa talababa.
