  text: ἐδηλώθη γάρ μοι περὶ ὑμῶν, ἀδελφοί μου, ὑπὸ τῶν Χλόης ὅτι ἔριδες ἐν ὑμῖν εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/011.yaml
  text: For it has been reported to me about you[a], my brothers, by Chloe’s people, that there are quarrels among you.
translation:
  language: tl
  text: Sapagkat ipinaalam sa akin tungkol sa inyo, mga kapatid ko[a], ng mga tao ni Chloe na may mga pagtatalo sa gitna ninyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “mga kapatid kong lalaki”; maaari itong gamitin bilang panawag sa buong komunidad ng mga mananampalataya, kasama ang mga babae.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδηλώθη
  choice: ipinaalam sa akin
  rationale: Likas na Filipino para sa pasibong pahayag na ang impormasyon ay ipinaabot kay Pablo; hindi nito tinutukoy kung sino mismo ang unang nag-ulat.
- source_word: γάρ
  choice: Sapagkat
  rationale: Pinananatili ang ugnayang nagpapaliwanag sa naunang pangungusap.
- source_word: περὶ ὑμῶν
  choice: tungkol sa inyo
  rationale: Tuwirang katumbas na natural sa makabagong Filipino.
- source_word: ἀδελφοί μου
  choice: mga kapatid ko
  rationale: Ang “kapatid” sa Filipino ay hindi nakatali sa kasarian, kaya natural nitong maipahahayag ang panawag na maaaring tumukoy sa buong komunidad habang hindi dinaragdagan ang teksto ng tahasang “mga babae.”
- source_word: ὑπὸ τῶν Χλόης
  choice: ng mga kasamahan ni Chloe
  rationale: Ipinahahayag ang mga taong kaugnay ni Chloe nang hindi labis na tinutukoy silang sambahayan, kamag-anak, alipin, o empleyado.
- source_word: ἔριδες
  choice: mga pagtatalo
  rationale: Tumutukoy sa mga alitan o sigalot sa pagitan ng mga tao at hindi ipinagkakamali sa mas malawak na konsepto ng pagkakahati-hati.
- source_word: ἐν ὑμῖν εἰσιν
  choice: may ... sa gitna ninyo
  rationale: Natural na eksistensiyal na konstruksiyon sa Filipino na malinaw na nagsasaad na umiiral ang mga pagtatalo sa komunidad.
theological_decisions:
- issue: Ang saklaw ng ἀδελφοί sa isang kongregasyong may mga lalaki at babae
  choice: mga kapatid ko
  alternative: mga kapatid kong lalaki; mga kapatid kong lalaki at babae
  rationale: Masculine plural ang anyong Griyego, ngunit maaari itong gamitin bilang panawag sa buong komunidad. Ang likas na salitang Filipino na “kapatid” ay walang minarkahang kasarian at pinananatili ang posibleng inklusibong saklaw nang hindi tahasang nilulutas ang usapin.
- issue: Pagkakakilanlan ng τῶν Χλόης
  choice: mga kasamahan ni Chloe
  alternative: sambahayan ni Chloe; mga tauhan ni Chloe
  rationale: Hindi nililinaw ng pariralang Griyego ang eksaktong uri ng ugnayan nila kay Chloe. Iniiwasan ng salin ang pag-aakalang sila ay sambahayan, kamag-anak, alipin, o empleyado.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Sapagkat” upang mapanatili ang paliwanag na ugnayan sa konteksto, at “mga kasamahan ni Chloe” upang mapanatili ang di-tiyak na kaugnayan ng pangkat kay Chloe.
