id: 1CO.1.8
reference: 1 Corinthians 1:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὃς καὶ βεβαιώσει ὑμᾶς ἕως τέλους ἀνεγκλήτους ἐν τῇ ἡμέρᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/008.yaml
  text: who will also establish you to the end[c][b][a], blameless in the day of our Lord Jesus the Messiah.
translation:
  language: tl
  text: Siya rin ang magpapatatag[a] sa inyo hanggang sa wakas—walang maiparatang[b] sa inyo sa araw ng ating Panginoong Jesus na Mesiyas.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “magpapatibay” o “magpapatunay.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “walang kapintasan” o “malaya sa anumang paratang.”
    reason: lexical_alternative
  - marker: c
    text: 'Griyego: “Cristo”; isinaling “Mesiyas” upang mapanatili ang kahulugan nito bilang titulo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βεβαιώσει
  choice: magpapatatag
  rationale: Ipinahahayag ng pandiwa ang paggawa sa isang tao na matatag at matibay. Likas sa makabagong Tagalog ang “magpapatatag” at hindi nito nililimitahan ang diwa sa pagpapatunay lamang.
- source_word: ἕως τέλους
  choice: hanggang sa wakas
  rationale: Pinananatili nito ang temporal na diwa ng pagpapatuloy hanggang sa pangwakas na hantungan.
- source_word: ἀνεγκλήτους
  choice: walang maiparatang sa inyo
  rationale: 'Inililitaw nito ang legal na kulay ng salitang Griyego: hindi maaaring sampahan ng makatuwirang paratang. Nananatili ring bukas ang kaugnayan nito sa kalagayan ng mga mananampalataya sa araw ng Panginoon.'
- source_word: ἐν τῇ ἡμέρᾳ
  choice: sa araw
  rationale: Natural sa Tagalog at pinananatili ang biblikal na idyoma para sa eskatolohikal na araw.
- source_word: κυρίου
  choice: Panginoon
  rationale: Karaniwan, marangal, at angkop na katumbas ng κύριος bilang titulo.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus na Mesiyas
  rationale: Ginagamit ang “Mesiyas” upang mapanatili ang kahulugan ng Χριστός bilang titulo, habang ang “Jesus na Mesiyas” ay malinaw at likas sa Tagalog.
theological_decisions:
- issue: Tinutukoy ng ὃς (“siya na”)
  choice: Ang “Siya” ay tumutukoy sa ating Panginoong Jesus na Mesiyas na binanggit sa naunang talata.
  alternative: Maaaring iugnay ito nang mas malawak sa Diyos na binanggit sa naunang konteksto.
  rationale: Ang pinakamalapit at pinakanatural na antecedent sa sintaks ay ang “ating Panginoong Jesus na Mesiyas” sa talata 7. Hindi na muling pinangalanan ang tinutukoy upang mapanatili ang pagkakaugnay ng mga talata.
- issue: Ugnayan ng ἀνεγκλήτους sa βεβαιώσει
  choice: 'Inilagay bilang predikatibong paglalarawan sa mga tatanggap: “walang maiparatang sa inyo.”'
  alternative: 'Isalin bilang layunin: “upang hindi kayo maparatangan.”'
  rationale: Walang tahasang pangatnig na nagsasaad ng layunin sa Griyego. Iniiwasan ng salin ang pagdaragdag ng “upang,” kaya nananatili ang posibilidad na ito ay resulta o kalagayang pananatilihin hanggang sa araw ng Panginoon.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang gitling na em upang malinaw na iugnay ang “walang maiparatang” sa mga tatanggap nang hindi nagdaragdag ng tahasang layuning wala sa Griyego. Ang “Panginoong Jesus na Mesiyas” ay natural na anyo sa Tagalog at pinananatiling titulo ang Mesiyas.
