base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/013.yaml
  text: Has Messiah been divided? Was Paul crucified for you? Or were you baptized into the name of Paul?[a][b]
translation:
  language: tl
  text: Nahati ba ang Mesiyas? Si Pablo ba ang ipinako sa krus para sa inyo? O binautismuhan ba kayo sa pangalan ni Pablo?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tungo sa pangalan ni Pablo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μεμέρισται
  choice: Nahati
  rationale: Ipinahahayag ng anyong ganap na balintiyak ang isang naganap na paghahati na may nananatiling resulta; natural sa Filipino ang “nahati” sa matinding retorikal na tanong.
- source_word: ὁ Χριστός
  choice: ang Mesiyas
  rationale: May pantukoy ang Χριστός at malinaw na gumaganap bilang titulo rito; pinananatili ng “ang Mesiyas” ang kahulugan nito bilang ang Pinahiran.
- source_word: μὴ
  choice: ipinahihiwatig ng retorikal na tanong
  rationale: Ang μὴ ay nagpapahiwatig na negatibo ang inaasahang sagot. Sapat na itong naihahatid ng anyong tanong sa natural na Filipino nang hindi idinaragdag ang “tiyak na hindi.”
- source_word: ἐσταυρώθη
  choice: ipinako sa krus
  rationale: Karaniwan, malinaw, at tuwirang katumbas ng aorist passive na pandiwa.
- source_word: ὑπὲρ ὑμῶν
  choice: para sa inyo
  rationale: Natural sa kasalukuyang Filipino at pinananatili ang malawak na diwa ng pagkilos alang-alang sa iba nang hindi nililimitahan ang teolohikal na saklaw.
- source_word: εἰς τὸ ὄνομα
  choice: tungo sa pangalan
  rationale: Pinananatili ng “tungo sa” ang direksiyonal at ugnayang puwersa ng εἰς, bagaman mas karaniwan sa Filipino ang “sa pangalan.”
- source_word: ἐβαπτίσθητε
  choice: binautismuhan ba kayo
  rationale: Tuwirang balintiyak na salin na natural at pinananatili ang retorikal na tanong.
theological_decisions:
- issue: Paglalapat ng Χριστός sa retorikal na tanong ni Pablo
  choice: ang Mesiyas
  alternative: ang Cristo
  rationale: Dahil may pantukoy at titulo ang gamit, inilalantad ng “Mesiyas” ang leksikal na diwa bilang ang Pinahiran; hindi nito ginagawang simpleng personal na pangalan ang termino.
- issue: Puwersa ng εἰς sa pormulang pambautismo
  choice: tungo sa pangalan ni Pablo
  alternative: sa pangalan ni Pablo
  rationale: Pinananatili ng “tungo sa” ang posibleng diwa ng pagpasok sa ugnayan o pagkakaugnay, nang hindi iyon tahasang ipinapaliwanag bilang pag-aari o katapatan.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Pinanatili ang tatlong maiikling retorikal na tanong at ang matalim na pagsaway ni Pablo. Ginamit ang “binautismuhan,” na pamilyar sa karaniwang mambabasang Filipino, at iniwasan ang pagpapaliwanag sa mismong teksto.
