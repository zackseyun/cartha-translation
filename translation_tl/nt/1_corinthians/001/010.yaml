revisions:
- from: 'Ngayon, mga kapatid, nakikiusap ako sa inyo sa pangalan ng ating Panginoong Jesu-Cristo[a]: magkaisa kayong lahat sa inyong sinasabi, at huwag magkaroon ng mga pagkakabaha-bahagi sa inyo. Sa halip, lubos kayong magkaisa sa iisang pag-iisip at iisang pagpapasiya.[b]'
  to: Mga kapatid, nakikiusap ako sa inyo sa pangalan ng Panginoon nating Jesus na Mesiyas[a] na iisa ang sinasabi ninyong lahat at walang maging pagkakabaha-bahagi sa inyo. Sa halip, magkaisa kayong lubos sa iisang pag-iisip at iisang pagpapasiya.[b]
  rationale: Inalis ang di-sinusuportahang “Ngayon,” isinalin ang Χριστός bilang “Mesiyas” sa pangunahing teksto, at pinatingkad ang literal ngunit likas na diwa ng iisang sinasabi. Iningatan ang pastoral na pakiusap, ang panawagan laban sa mga pagkakahati-hati, at ang magkaibang saklaw ng pag-iisip at pagpapasiya. Ang mga talababa ay inayos upang tumugma sa binagong teksto at magbigay ng makatwirang alternatibo.
