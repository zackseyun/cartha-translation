  naturalness: Natural at marangal ang “mga kapatid” at “nakikiusap ako sa inyo.” Ang “iisa ang sinasabi ninyong lahat” ay mas malapit sa τὸ αὐτὸ λέγητε πάντες at natural sa modernong Filipino. Ang “magkaisa kayong lubos” ay malinaw sa konteksto ng pagkakahati-hati.
  terminology: Ginamit ang “Panginoon nating Jesus na Mesiyas” upang maipakita ang tituladong Χριστός nang hindi umaasa lamang sa tradisyonal na anyong “Cristo.” Pinanatili ang kaibhan ng νοῦς at γνώμη bilang “pag-iisip” at “pagpapasiya.”
