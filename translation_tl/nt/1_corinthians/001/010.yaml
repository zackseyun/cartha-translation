id: 1CO.1.10
reference: 1 Corinthians 1:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, διὰ τοῦ ὀνόματος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἵνα τὸ αὐτὸ λέγητε πάντες, καὶ μὴ ᾖ ἐν ὑμῖν σχίσματα, ἦτε δὲ κατηρτισμένοι ἐν τῷ αὐτῷ νοῒ καὶ ἐν τῇ αὐτῇ γνώμῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/010.yaml
  text: I urge you[a], brothers, by the name of our Lord Jesus the Messiah, that you all say the same thing, and that there be no divisions among you[e][d][c][b], but that you be joined together in the same mind and in the same judgment.
translation:
  language: tl
  text: Mga kapatid, nakikiusap ako sa inyo sa pangalan ng Panginoon nating Jesus na Mesiyas[a] na iisa ang sinasabi ninyong lahat at walang maging pagkakabaha-bahagi sa inyo. Sa halip, magkaisa kayong lubos sa iisang pag-iisip at iisang pagpapasiya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: Jesu-Cristo. Ang “Mesiyas” ay tradisyonal na isinasaling “Cristo.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “magkaisa kayong lubos” ay maaari ring isaling “maibalik sa ayos” o “mabuong magkakaugnay.” Ang “pagpapasiya” ay maaari ring isaling “paghatol” o “paninindigan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ δὲ ὑμᾶς
  choice: Ngayon, ... nakikiusap ako sa inyo
  rationale: Ang παρακαλῶ ay isang taimtim na pakiusap, hindi lamang payak na utos. Ang δέ ay banayad na panandang pangdiskurso; natural itong ipinahihiwatig ng “Ngayon” sa Filipino nang hindi ginagawang matinding pagsalungat.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Ang “mga kapatid” ay natural at marangal na tawag sa buong sambayanang sumasampalataya sa Filipino, at hindi nito kailangang tukuyin ang kasarian kahit grammatically masculine ang Griyego.
- source_word: διὰ τοῦ ὀνόματος
  choice: sa pangalan ng
  rationale: Ipinahahayag ng διά na may genitive ang saligan o awtoridad ng pakiusap; ang “sa pangalan ng” ang likas na katumbas sa Filipino.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: ating Panginoong Jesu-Cristo
  rationale: Pinananatili ang kinagawiang Filipino na pangalang-titulong “Jesu-Cristo”; ang Cristo ay mula sa Χριστός at nangangahulugang Mesiyas, gaya ng nililinaw sa talababa.
- source_word: ἵνα τὸ αὐτὸ λέγητε πάντες
  choice: magkaisa kayong lahat sa inyong sinasabi
  rationale: Iniiwasan ang mekanikal na “sabihin ang iisang bagay” habang pinananatili ang diin sa pagkakaisa ng sinasabi, hindi lamang isang malabong pangkalahatang pagkakasundo.
- source_word: σχίσματα
  choice: mga pagkakabaha-bahagi
  rationale: Malinaw at kasalukuyang Filipino ito para sa mga pagkakahati o hidwaan sa loob ng kapulungan.
- source_word: κατηρτισμένοι
  choice: lubos kayong magkaisa
  rationale: Sa konteksto ng pagkakabaha-bahagi, ipinahahayag nito ang pagiging naibalik, nabuo, o naiangkop tungo sa pagkakaisa; ang “lubos na magkaisa” ay natural ngunit pinananatili sa talababa ang talinghaga ng pag-aayos o pagbubuo.
- source_word: ἐν τῷ αὐτῷ νοῒ
  choice: sa iisang pag-iisip
  rationale: Ang νοῦς ay tumutukoy sa isip, pagkaunawa, o paraan ng pag-iisip; pinananatili ang kaibhan nito sa γνώμη.
- source_word: ἐν τῇ αὐτῇ γνώμῃ
  choice: iisang pagpapasiya
  rationale: Maaaring tumukoy ang γνώμη sa pasiya, paninindigan, o paghatol. Ang “pagpapasiya” ay natural sa Filipino at naiiba sa “pag-iisip,” habang kinikilala sa talababa ang ibang posibleng diwa.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστός
  choice: Jesu-Cristo sa pangunahing teksto, na may talababa na “Mesiyas” ang kahulugan
  alternative: Jesus na Mesiyas
  rationale: Ang “Jesu-Cristo” ay natural at matatag nang anyo sa modernong Filipino, ngunit hindi ikinukubli ang kahulugan ng titulong Χριστός; malinaw itong ibinibigay sa talababa.
- issue: Saklaw ng ἀδελφοί
  choice: mga kapatid
  alternative: mga kapatid na lalaki / mga kapatid na lalaki at babae
  rationale: Bagaman masculine plural ang anyong Griyego, sa konteksto ay kinakausap ni Pablo ang buong kapulungan. Ang “mga kapatid” sa Filipino ay tumpak na maaaring sumaklaw sa lahat nang hindi nagdaragdag ng salitang wala sa teksto.
- issue: Uri ng pagkakaisang hinihingi
  choice: pagkakaisa sa sinasabi, pag-iisip, at pagpapasiya
  alternative: ganap na pagkakapareho ng lahat ng opinyon
  rationale: Hindi pinalalawak ang talata upang igiit ang lubos na pagkakapareho sa bawat opinyon. Pinananatili ang tatlong larangan ng teksto at ang tensiyon sa pagitan ng pagkakaiba at pagkakaisa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “mga kapatid” bilang natural na kolektibong tawag, at iniwasan ang labis na teknikal na “pagkakabahagi” o “schisma.”
