lexical_decisions:
- source_word: ἵνα
  choice: upang
  rationale: Likas na ipinahahayag ng “upang” ang layunin o nilalayong bunga ng sugnay.
- source_word: μή τις
  choice: walang sinuman
  rationale: Malinaw at natural nitong ipinahahayag sa Tagalog ang di-tiyak na simuno na itinatanggi.
- source_word: εἴπῃ
  choice: magsabi
  rationale: Ang anyong pasakali matapos ang ἵνα ay natural na naihahatid ng “magsabi” sa sugnay na nagsisimula sa “upang.”
- source_word: εἰς
  choice: tungo sa
  rationale: Pinananatili nito ang direksiyonal na puwersa ng εἰς at ang teolohikal na himig ng pagkakaugnay o pagkakakilanlan sa isang pangalan, sa halip na agad itong ipantay sa mas karaniwang “sa.”
- source_word: τὸ ἐμὸν ὄνομα
  choice: aking pangalan
  rationale: Tumpak, tuwiran, at natural na salin ng konstruksiyong nagpapahayag ng pag-aari.
- source_word: ἐβαπτίσθητε
  choice: binautismuhan kayo
  rationale: Pinananatili ang tahasang tinig na balintiyak. Ang “binautismuhan” ay karaniwang katawagang nauunawaan nang hindi nagtatakda ng partikular na paraang denominasyonal.
theological_decisions:
- issue: Pagpapakahulugan sa εἰς τὸ ἐμὸν ὄνομα sa konteksto ng bautismo
  choice: tungo sa aking pangalan
  alternative: sa aking pangalan
  rationale: Ang “tungo sa” ay nagpapanatili sa karaniwang direksiyonal na puwersa ng εἰς at sa posibleng diwa ng pakikipag-ugnay o pagkakakilanlan, nang hindi nilulutas ang teolohikal na tensiyon. Ang mas idyomatikong “sa aking pangalan” ay inilagay sa talababa bilang lehitimong alternatibo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinili ang “tungo sa” sa pangunahing teksto upang mapanatili ang direksiyonal na himig ng Griyegong εἰς, habang ibinigay sa talababa ang mas karaniwang pahayag na “sa aking pangalan.”
