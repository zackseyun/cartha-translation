  source_fidelity: Tumpak na naihahatid ng draft ang sugnay na layunin (ἵνα μή), ang di-tiyak na negatibong simuno (“walang sinuman”), at ang balintiyak na “kayo ay binautismuhan.” Gayunman, ang “binautismuhan kayo tungo sa aking pangalan” ay hindi natural na Filipino at hindi maayos ang pagkakaugnay ng pandiwang balintiyak at ng pariralang direksiyonal. Ang εἰς sa pariralang ito ay pinakamainam na ihatid sa pangunahing teksto sa idyomatikong “sa aking pangalan,” habang ang mas literal na direksiyonal na posibilidad ay nasa talababa.
