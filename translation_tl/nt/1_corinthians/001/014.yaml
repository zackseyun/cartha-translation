  rationale: Tumpak na ipinapahayag ang eksepsiyon, at ginagamit ang “kina” sapagkat dalawang pangalan ng tao ang kasunod.
- source_word: Κρίσπον
  choice: Crispo
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng pangalang Griyego.
- source_word: Γάϊον
