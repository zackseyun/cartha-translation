translation:
  language: tl
  text: upang walang sinumang tao[a] ang magmalaki sa harap ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “upang walang anumang laman ang magmalaki sa harap ng Diyos.” Dito, ang “laman” ay tumutukoy sa sangkatauhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως
  choice: upang
  rationale: Likas na panandang Filipino para sa layunin o kinalabasan, at pinananatili ang puwersa ng sugnay na Griyego.
- source_word: μὴ … πᾶσα
  choice: walang sinuman
  rationale: 'Kasama ng pandiwang nasa subjunctive, nagpapahayag ito ng ganap na pagbubukod: walang kahit isang kabilang sa sangkatauhan.'
- source_word: καυχήσηται
  choice: makapagmalaki
  rationale: Ipinahihiwatig ng anyong subjunctive sa sugnay ng layunin na hindi dapat magkaroon ng pagkakataon o batayan ang sinuman na magmalaki.
- source_word: πᾶσα σὰρξ
  choice: sinumang tao
  rationale: Ang literal na ‘lahat ng laman’ sa ilalim ng pagtanggi ay tumutukoy sa walang sinumang tao. Mas malinaw at natural ito sa modernong Tagalog, habang inilalagay sa talababa ang literal na larawan.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: sa harap ng Diyos
  rationale: Karaniwan at dignified na idyomang Tagalog para sa pagiging nasa presensiya o paningin ng Diyos.
theological_decisions:
- issue: Pagpapakahulugan sa σάρξ sa kontekstong Paulino
  choice: Isinalin sa pangunahing teksto bilang ‘tao,’ na may literal na ‘laman’ sa talababa.
  alternative: Panatilihin sa pangunahing teksto ang ‘laman.’
  rationale: Dito, ang σάρξ ay hindi tumutukoy sa isang ‘makasalanang kalikasan’ kundi sa sangkatauhan sa kahinaan nito sa harap ng Diyos. Ang ‘sinumang tao’ ay natural at malinaw sa Tagalog; pinananatili naman ng talababa ang literal na retorika at tunay na leksikal na anyo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, maikli, at marangal. Iniwasan ang masyadong literal ngunit di-likas na ‘walang laman,’ habang pinanatili sa talababa ang larawan ng orihinal.
