id: 1CO.1.23
reference: 1 Corinthians 1:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ κηρύσσομεν Χριστὸν ἐσταυρωμένον, Ἰουδαίοις μὲν σκάνδαλον ⸀ἔθνεσιν δὲ μωρίαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/023.yaml
  text: but we preach the Messiah crucified[a], to Jews a stumbling block and to Gentiles foolishness[b],
translation:
  language: tl
  text: ngunit ipinangangaral namin ang Mesiyas na ipinako sa krus[a]—isang katitisuran sa mga Judio at kahangalan sa mga Hentil[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang Cristong ipinako sa krus.”
    reason: alternative_reading
  - marker: b
    text: Sa Griyego, “mga bansa”; dito ay tumutukoy sa mga Hentil bilang kaibahan sa mga Judio.
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρύσσομεν
  choice: ipinangangaral namin
  rationale: Likas na salin para sa hayagang pagpapahayag ng mensahe, at pinananatili ang diin sa patuloy na gawain ng mga apostol.
- source_word: Χριστὸν
  choice: ang Mesiyas
  rationale: Gumaganap dito bilang titulo ng ipinahahayag na si Jesus, hindi lamang bilang pangalang pantangi.
- source_word: ἐσταυρωμένον
  choice: na ipinako sa krus
  rationale: Natural sa Tagalog at malinaw na naghahatid ng diwang pasibo ng pagkapako sa krus; ang anyong Griyego ay perfect passive participle.
- source_word: Ἰουδαίοις
  choice: sa mga Judio
  rationale: Ang talata ay nagpapakita ng etniko-relihiyosong paghahambing sa mga Hentil, kaya mas angkop ang “mga Judio” kaysa heograpikong katawagan.
- source_word: σκάνδαλον
  choice: isang katitisuran
  rationale: Pinananatili ang metapora ng bagay na nagiging sanhi ng pagkatisod, sa halip na patagin ito bilang simpleng “pagkayamot” o “pagkakasala.”
- source_word: ἔθνεσιν
  choice: sa mga Hentil
  rationale: Bagaman literal na maaaring tumukoy sa “mga bansa,” sa paghahambing sa mga Judio ay tumutukoy ito sa mga hindi Judio.
- source_word: μωρίαν
  choice: kahangalan
  rationale: Natural at dignified na katumbas ng bagay na itinuturing na mangmang o hangal, at tumutugma sa paulit-ulit na tema ng kabanata.
theological_decisions:
- issue: Titulo o anyong parang pangalan para sa Χριστός
  choice: ang Mesiyas
  alternative: ang Cristo
  rationale: Binibigyang-diin ng konteksto ang pagkakakilanlan at katayuang mesiyaniko ng ipinangangaral, kaya pinanatili bilang titulo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang gitling-pahaba upang natural na ipakilala ang dalawang magkatapat na tugon sa ipinangangaral na Mesiyas.
