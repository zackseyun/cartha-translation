  source_fidelity: 'Tapat ang salin sa Griyego: ang ἡμεῖς δέ ay naipahayag sa “ngunit … namin,” ang κηρύσσομεν sa “ipinangangaral,” at ang Χριστὸν ἐσταυρωμένον sa “ang Mesiyas na ipinako sa krus.” Napananatili rin ang dalawang magkatapat na pagtanggap: σκάνδαλον para sa mga Judio at μωρίαν para sa mga Hentil.'
