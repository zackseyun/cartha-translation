base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/020.yaml
  text: Where is the wise man? Where is the scribe? Where is the debater of this age? Has not God made the wisdom of the world foolish?[a][b][c]
translation:
  language: tl
  text: Nasaan ang marunong? Nasaan ang eskriba? Nasaan ang debatista ng kapanahunang ito?[a] Hindi ba't ginawang kahangalan ng Diyos ang karunungan ng sanlibutan?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kapanahunang ito” ay salin ng ibang salitang Griyego kaysa sa “sanlibutan” sa hulihan ng talata.
    reason: cross_reference
  - marker: b
    text: 'Maaari ring isalin: “Hindi ba''t ipinakita ng Diyos na kahangalan ang karunungan ng sanlibutan?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποῦ σοφός
  choice: Nasaan ang marunong?
  rationale: Pinananatili ang maikli at mapanghamong tanong. Ang pangngalang gamit ng pang-uri na σοφός ay likas na naipapahayag sa Filipino bilang “ang marunong” at maaaring kumatawan sa sinumang taong itinuturing na marunong.
- source_word: γραμματεύς
  choice: eskriba
  rationale: Direktang terminong pangkasaysayan ito para sa γραμματεύς at hindi nito nililimitahan ang kahulugan sa makabagong “iskolar” o sa “dalubhasa sa Kautusan” lamang.
- source_word: συζητητής
  choice: mahusay makipagtalo
  rationale: Ipinahahayag ang isang taong nakikipagtalakayan o nakikipagtalo. Idinagdag ang “mahusay” upang maging likas na pantukoy sa tao at maipakita ang retorikal na larawan ng kinikilalang debatista.
- source_word: τοῦ αἰῶνος τούτου
  choice: sa kapanahunang ito
  rationale: Ang “kapanahunan” ay malinaw at likas na katumbas ng αἰών, at pinananatili itong naiiba sa κόσμος sa huling bahagi ng talata.
- source_word: οὐχὶ ἐμώρανεν
  choice: Hindi ba't ginawa ... na kamangmangan
  rationale: Ang “Hindi ba't” ay tanong na umaasang sasang-ayon ang mambabasa. Pinananatili ng “ginawa ... na kamangmangan” ang posibleng causative na puwersa ng ἐμώρανεν.
- source_word: τὴν σοφίαν τοῦ κόσμου
  choice: ang karunungan ng sanlibutan
  rationale: Ang “karunungan” ang karaniwang katumbas ng σοφία. Ang “sanlibutan” ay dignified at madaling maunawaang katumbas ng κόσμος, at malinaw na naiiba sa “kapanahunan” para sa αἰών.
theological_decisions:
- issue: Pagkakaiba ng αἰών at κόσμος sa iisang talata
  choice: Isinalin ang αἰών bilang “kapanahunan” at ang κόσμος bilang “sanlibutan.”
  alternative: Isalin ang dalawa bilang “mundo” o “sanlibutan” para sa higit na pagkakapare-pareho.
  rationale: Magkaiba ang dalawang salitang Griyego. Pinananatili ng salin ang pagkakaiba sa pagitan ng kasalukuyang kapanahunan at ng karunungang inuugnay sa sanlibutan.
- issue: Puwersa ng ἐμώρανεν
  choice: “ginawa ... na kamangmangan”
  alternative: “ipinakitang kamangmangan”
  rationale: Pinananatili ng pangunahing teksto ang tuwirang causative na puwersa ng pandiwa, habang inilalagay sa talababa ang posibleng kahulugang deklaratibo o demonstratibo upang hindi tahimik na lutasin ang ambiguwidad.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang tatlong maiikling retorikal na tanong at ang pangwakas na tanong na umaasang positibo ang sagot. Ginamit ang “eskriba” bilang terminong pangkasaysayan at ang magkaibang “kapanahunan” at “sanlibutan” upang masalamin ang αἰών at κόσμος.
