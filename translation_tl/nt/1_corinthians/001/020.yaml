  terminology: Ang “eskriba,” “kapanahunang ito,” “karunungan,” at “sanlibutan” ay angkop. Pinananatili ng “kapanahunan” at “sanlibutan” ang sinadyang pagkakaiba ng dalawang terminong Griyego.
