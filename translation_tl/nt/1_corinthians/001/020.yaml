  to: Nasaan ang marunong? Nasaan ang eskriba? Nasaan ang debatista ng kapanahunang ito?[a] Hindi ba't ginawang kahangalan ng Diyos ang karunungan ng sanlibutan?[b]
  rationale: Inalis ang dagdag na ideya ng husay sa ikatlong tanong at pinalitan ito ng “debatista,” na tuwirang kumakatawan sa συζητητής. Pinalitan ang “kamangmangan” ng “kahangalan” upang masaklaw nang wasto ang pandiwang ἐμώρανεν at maging mas natural sa modernong Filipino. Hindi binago ang pagkakaiba ng αἰών at κόσμος, at iningatan ng talababa ang posibleng demonstratibong pag-unawa sa pandiwa.
