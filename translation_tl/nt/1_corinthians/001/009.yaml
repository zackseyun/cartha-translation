  terminology: Ang “Tapat,” “tinawag,” “Mesiyas,” at “Panginoon” ay angkop at pinananatili. Ang “Mesiyas” ay wastong salin ng Χριστός bilang titulo. Ang “pakikipag-isa” ay hindi nagpapataw ng sakramental o denominasyonal na pakahulugan, habang sapat na malawak para sa κοινωνία.
