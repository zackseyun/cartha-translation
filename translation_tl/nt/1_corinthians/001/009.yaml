- from: Tapat ang Diyos. Sa pamamagitan niya[a], tinawag kayo sa pakikiisa[b] sa kanyang Anak, si Jesus na Mesiyas[c], na ating Panginoon.
  to: Tapat ang Diyos. Sa pamamagitan niya[a] ay tinawag kayo tungo sa pakikipag-isa[b] sa kanyang Anak—si Jesus na Mesiyas[c], ang ating Panginoon.
  rationale: Pinalitan ang “pakikiisa” ng “pakikipag-isa” upang mas natural na maipahayag ang κοινωνία bilang pakikipag-ugnayan at pakikibahagi sa Anak. Idinagdag ang “tungo sa” upang malinaw na maipakita ang direksiyong εἰς, at inayos ang apposition sa pamamagitan ng em dash para malinaw na sina Jesus na Mesiyas at ang ating Panginoon ay iisang tinutukoy. Walang binagong kahulugan o idinagdag na doktrinal na pagpapakahulugan.
