reference: 1 Corinthians 1:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πιστὸς ὁ θεὸς δι’ οὗ ἐκλήθητε εἰς κοινωνίαν τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/009.yaml
  text: God is faithful[a], by whom you were called into fellowship with his Son[c][b], Jesus the Messiah our Lord.
translation:
  language: tl
  text: Tapat ang Diyos. Sa pamamagitan niya[a] ay tinawag kayo tungo sa pakikipag-isa[b] sa kanyang Anak—si Jesus na Mesiyas[c], ang ating Panginoon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “sa pamamagitan ng Diyos” o, ayon sa diwa, “ang Diyos ang tumawag sa inyo.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “pakikibahagi” o “pakikisama.”
    reason: lexical_alternative
  - marker: c
    text: Ang salitang Griego na Christos ay nangangahulugang “Mesiyas” o “Pinahiran.”
    reason: title_clarification
lexical_decisions:
- source_word: πιστὸς
  choice: Tapat
  rationale: Ipinapahayag nito ang maaasahan at di-nagbabagong katangian ng Diyos; likas at mabigat sa teolohikong gamit ang “tapat” sa Filipino.
- source_word: δι’ οὗ
  choice: Sa pamamagitan niya
  rationale: Pinananatili ang anyo ng διά na may genitive at ang Diyos bilang personal na tagapamagitan o gumaganap sa pagtawag, nang hindi ito pinapaliit sa simpleng “siya ang tumawag.”
- source_word: ἐκλήθητε
  choice: tinawag kayo
  rationale: Pinananatili ang pasibong anyo at karaniwang gamit ni Pablo para sa pagtawag ng Diyos.
- source_word: κοινωνίαν
  choice: pakikiisa
  rationale: Sinasaklaw nito ang relasyonal na pakikipag-ugnayan at aktuwal na pakikibahagi; mas angkop dito kaysa sa “pakikisama,” na maaaring magkaroon ng mas mababaw o kolokyal na diwa.
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: sa kanyang Anak
  rationale: Ang genitive na nakasalalay sa κοινωνία ay likas na ipinapahayag sa Filipino sa pamamagitan ng “sa,” na maaaring tumukoy sa pakikiisa o pakikibahagi kaugnay ng Anak.
- source_word: Ἰησοῦ Χριστοῦ
  choice: si Jesus na Mesiyas
  rationale: Isinasalin ang Χριστός bilang titulong “Mesiyas” at pinananatiling pangalan ang Jesus; ang “na” ay nagbibigay ng natural na apposisyon sa Filipino.
- source_word: τοῦ κυρίου ἡμῶν
  choice: na ating Panginoon
  rationale: Pinananatili ang hiwalay na pamagat na κύριος at ang kaugnayan nitong “ating,” habang malinaw na tumutukoy kay Jesus.
theological_decisions:
- issue: Kung ang δι’ οὗ ay dapat gawing mas likas na “na siyang tumawag” o panatilihing “sa pamamagitan niya.”
  choice: Sa pamamagitan niya
  alternative: na siyang tumawag sa inyo
  rationale: Ang napiling anyo ay mas tuwirang nagpapanatili sa διά at sa bahagyang di-karaniwang diin ng Griyego, sa halip na tahimik na ipalit ang payak na tuwirang ahensiya.
- issue: Kung ang κοινωνία ay pangunahing “pakikisama,” “pakikiisa,” o “pakikibahagi.”
  choice: pakikiisa
  alternative: pakikisama; pakikibahagi
  rationale: Hindi nililimitahan ng konteksto ang salita sa pakikipagkapwa lamang o sa isang tiyak na sakramental na diwa. Ang “pakikiisa” ay naglalaman kapwa ng ugnayan at pakikibahagi, habang inilalahad sa talababa ang mga lehitimong alternatibo.
- issue: Kung ang Χριστός ay ituturing na nakasanayang pangalang “Cristo” o isasalin bilang titulo.
  choice: Mesiyas
  alternative: Cristo
  rationale: Nananatiling semantikong aktibo ang titulo sa pagkakasunod na “Jesus Mesiyas”; kaya isinalin ang titulo sa halip na basta transliterahin.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Hinati sa dalawang pangungusap upang maiwasan ang mabigat at alanganing sugnay na “Tapat ang Diyos, na sa pamamagitan niya…” habang pinananatili ang lohika at pagkakasunod ng Griyego. Ginamit ang “kanyang” sa halip na mas pormal na “kaniyang,” at iniwasan ang sobrang teknikal o denominasyonal na pananalita.
