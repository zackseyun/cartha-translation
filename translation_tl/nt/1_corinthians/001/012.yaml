base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/012.yaml
  text: 'What I mean is this: each of you says[a], “I belong to Paul,” or “I belong to Apollos,” or “I belong to Cephas,” or “I belong to Messiah.”'
translation:
  language: tl
  text: 'Ang ibig kong sabihin ay ito: sinasabi ng bawat isa sa inyo, “Kay Pablo ako,” “Kay Apolos ako,” “Kay Cefas ako,” o “Kay Mesiyas[a] ako.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Kristo.”
    reason: Ibinibigay ang tradisyonal na transliterasyon ng Χριστός bilang alternatibong katawagan.
lexical_decisions:
- source_word: λέγω δὲ τοῦτο
  choice: Ang ibig kong sabihin ay ito
  rationale: Likas at malinaw na pananalita sa modernong Tagalog na pinananatili ang paglilinaw na ipinahihiwatig ng Griyego.
- source_word: ἕκαστος ὑμῶν λέγει
  choice: sinasabi ng bawat isa sa inyo
  rationale: Pinananatili ang distributibong diwa ng ἕκαστος at ang kasalukuyang kilos ng λέγει.
- source_word: Ἐγὼ μέν εἰμι Παύλου / Ἐγὼ δὲ Ἀπολλῶ / Ἐγὼ δὲ Κηφᾶ / Ἐγὼ δὲ Χριστοῦ
  choice: Kay Pablo ako … Kay Apolos ako … Kay Cefas ako … Sa Mesiyas ako
  rationale: Ang kay/sa … ako ay natural na Tagalog para sa pagkakabilang o pagkampi na ipinahihiwatig ng genitibo, nang hindi ito pinalalabis bilang pormal na pagiging alagad. Ginamit ang “sa” bago ang titulong “Mesiyas” upang maging natural ang Filipino.
- source_word: Κηφᾶ
  choice: Cefas
  rationale: Isinalin sa baybay-Filipino ang pangalang mismong ginamit ni Pablo, sa halip na palitan ito ng Pedro.
- source_word: Χριστοῦ
  choice: Mesiyas
  rationale: Isinalin bilang titulo ang Χριστός, alinsunod sa kahulugang ‘Pinahiran,’ sa halip na ituring lamang itong personal na pangalan.
theological_decisions:
- issue: Pagpapahayag ng Χριστοῦ sa loob ng mga pahayag ng pagkakampi
  choice: Mesiyas
  alternative: Cristo / Kristo
  rationale: Titulo ang Χριστός at nararapat isalin bilang “Mesiyas.” Hindi nilulutas ng salin kung ang huling pahayag ay lehitimong pag-aangkin o isa pang mapangkat na islogan; pinananatili itong kapantay sa estruktura ng iba pang pahayag.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ang paulit-ulit na hulma na “Kay/Sa … ako” ay maikli, natural, at nagpapanatili sa diin ng magkakatapat na pahayag sa Griyego.
