  - severity: low
    issue: “Cristo” ang baybay sa talababa.
    rationale: Mas karaniwan sa modernong Filipino Tagalog ang “Kristo.” Hindi nito binabago ang kahulugan ngunit pinaiigi ang ortograpiya at pagkakapare-pareho ng rehistro.
