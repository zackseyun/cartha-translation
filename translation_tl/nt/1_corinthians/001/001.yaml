id: 1CO.1.1
reference: 1 Corinthians 1:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Παῦλος κλητὸς ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ καὶ Σωσθένης ὁ ἀδελφὸς
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/001.yaml
  text: Paul[a], a called apostle of Messiah Jesus by the will of God, and Sosthenes our brother,
translation:
  language: tl
  text: Si Pablo, na tinawag na maging apostol ng Mesiyas na si Jesus[a] sa kalooban ng Diyos, at si Sostenes na kapatid natin,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, Cristo Jesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παῦλος
  choice: Pablo
  rationale: Ang “Pablo” ang nakagawiang anyo ng pangalang Παῦλος sa modernong Tagalog.
- source_word: κλητὸς ἀπόστολος
  choice: tinawag na maging apostol
  rationale: Likas sa Tagalog ang pariralang ito at malinaw nitong ipinahahayag na ang pagiging apostol ni Pablo ay bunga ng pagtawag sa kaniya, nang hindi binabago ang ugnayan ng pang-uri at pangngalan sa Griyego.
- source_word: ἀπόστολος
  choice: apostol
  rationale: Ito ang kinikilalang terminong Tagalog para sa isang isinugo at binigyan ng awtoridad sa natatanging tungkuling apostoliko.
- source_word: Χριστοῦ Ἰησοῦ
  choice: ng Mesiyas na si Jesus
  rationale: Pinananatili ng “Mesiyas” ang Χριστός bilang titulo, samantalang ang “na si Jesus” ay natural at malinaw na ayos sa Tagalog.
- source_word: διὰ θελήματος θεοῦ
  choice: sa kalooban ng Diyos
  rationale: Maikli at natural itong paraan sa Tagalog upang ipahayag na ang pagtawag kay Pablo ay nagmula o naganap sa bisa ng kalooban ng Diyos.
- source_word: Σωσθένης
  choice: Sostenes
  rationale: Ito ang natural at nakagawiang transliterasyon sa Tagalog ng pangalang Griyego.
- source_word: ὁ ἀδελφὸς
  choice: na kapatid natin
  rationale: Bagaman walang tahasang panghalip sa Griyego, ang artikulong ὁ sa ganitong pambungad ng liham ay likas na naipahahayag sa Tagalog bilang “kapatid natin,” na tumutukoy sa kapwa mananampalataya.
theological_decisions:
- issue: Pagpapahayag sa Χριστός sa pambungad ni Pablo
  choice: Mesiyas na si Jesus
  alternative: Cristo Jesus
  rationale: Dito ay makabuluhang panatilihin ang Χριστός bilang titulong “Mesiyas,” hindi lamang bilang bahaging tila apelyido; inilalagay sa talababa ang tradisyonal na anyong “Cristo Jesus.”
- issue: Kalikasan ng pagiging apostol ni Pablo
  choice: tinawag na maging apostol
  alternative: tinawag na apostol
  rationale: Ipinahahayag ng piniling anyo na ang “tinawag” ay tumutukoy sa banal na pagtatalaga sa tungkulin, hindi lamang sa katawagang ibinigay kay Pablo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang anyo ng hindi pa tapos na pangungusap sapagkat nagpapatuloy ang pambungad sa kasunod na talata.
