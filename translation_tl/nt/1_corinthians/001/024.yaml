  source_fidelity: 'Tumpak ang pangunahing pagtutumbas: ang κλητοῖς ay “mga tinawag,” ang Ἰουδαίοις at Ἕλλησιν ay “mga Judio” at “mga Griego,” at ang Χριστόν ay “Mesiyas.” Gayunman, ang “maging mga Judio o mga Griego” ay maaaring magpahiwatig ng alinman sa dalawang pangkat, samantalang ang τε καὶ ay tahasang “kapwa ... at ...” at pinagsasama ang dalawang pangkat sa saklaw ng mga tinawag.'
  naturalness: Natural at marangal ang pangungusap sa modernong Filipino. Mas malinaw at mas eksakto ang “kapwa mga Judio at mga Griego” kaysa “maging mga Judio o mga Griego.” Ang mga gitling ay tumutulong upang malinaw na ang pariralang ito ay paglilinaw sa “mga tinawag.”
  terminology: Ang “Mesiyas” ay angkop na salin ng titulong Χριστός at ang talababa na “O, Cristo” ay wastong leksikal na alternatibo. Ang “kapangyarihan ng Diyos” at “karunungan ng Diyos” ay wasto at pinananatili ang inuulit na estruktura ng Griyego.
