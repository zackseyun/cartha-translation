  text: αὐτοῖς δὲ τοῖς κλητοῖς, Ἰουδαίοις τε καὶ Ἕλλησιν, Χριστὸν θεοῦ δύναμιν καὶ θεοῦ σοφίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/024.yaml
  text: But to those who are called[a], both Jews and Greeks, Messiah is the power of God and the wisdom of God.
translation:
  language: tl
  text: Ngunit para sa mga tinawag—kapwa mga Judio at mga Griego—ang Mesiyas[a] ang kapangyarihan ng Diyos at ang karunungan ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, Cristo.
    reason: lexical_alternative
lexical_decisions:
- source_word: κλητοῖς
  choice: mga tinawag
  rationale: Ang pang-uri ay ginagamit bilang pangngalan para sa mga taong kinilala sa pamamagitan ng pagkatawag sa kanila; pinananatili ng “mga tinawag” ang pandiwang diwa at natural ito sa Tagalog.
- source_word: Ἰουδαίοις
  choice: mga Judio
  rationale: Sa pagtutumbas kay Pablo sa mga Judio at mga Griego, pangunahing tumutukoy ito sa pangkat na etniko at panrelihiyon.
- source_word: Ἕλλησιν
  choice: mga Griego
  rationale: Tahasang “mga Griego” ang nasa Griyego; hindi ito pinalawak sa interpretatibong “mga Hentil.”
- source_word: Χριστόν
  choice: Mesiyas
  rationale: Ginagamit dito ang Χριστός bilang titulo; isinasalin ng “Mesiyas” ang kahulugan nito sa halip na transliterasyon lamang.
- source_word: θεοῦ δύναμιν
  choice: ang kapangyarihan ng Diyos
  rationale: Pinananatili ang genitibong ugnayan at ang marangal, malinaw na anyo ng parirala.
- source_word: θεοῦ σοφίαν
  choice: ang karunungan ng Diyos
  rationale: Inuulit ang estruktura ng naunang parirala, gaya ng pagbibigay-diin sa pinagmulang teksto.
- source_word: implicit copula / verbless predicate relation
  choice: ang Mesiyas ang kapangyarihan ... at ang karunungan ...
  rationale: Walang hayag na copula sa Griyego at nakasalalay ang sugnay sa naunang talata; natural na ipinahahayag ng hulmaing “ang X ang Y” ang predikatibong ugnayan sa Tagalog nang hindi nagdaragdag ng bagong kilos.
theological_decisions:
- issue: Pagsasalin sa Χριστός bilang kristolohikal na titulo
  choice: Mesiyas
  alternative: Cristo
  rationale: Aktibo rito ang kahulugan bilang titulo. Pinananatili ng “Mesiyas” ang semantikong nilalaman ng Χριστός nang hindi nagdaragdag ng denominasyonal na interpretasyon.
- issue: Ugnayan ng Mesiyas sa kapangyarihan at karunungan ng Diyos
  choice: 'predikatibong pagkakakilanlan: “ang Mesiyas ang kapangyarihan ... at ang karunungan ...”'
  alternative: 'aposisyon lamang: “ang Mesiyas, kapangyarihan ... at karunungan ...”'
  rationale: Bagaman eliptikal ang Griyego at nakaugnay sa sintaks ng talata 23, malinaw ang predikatibong puwersa nito para sa mga tinawag; natural itong naipahahayag sa Tagalog sa hulmaing pinili.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “maging ... o ...” upang likas na ipahayag ang τε καὶ sa dalawang pangkat, at pinanatili ang pag-uulit ng “ng Diyos” para sa diin at paralelismo ng Griyego.
