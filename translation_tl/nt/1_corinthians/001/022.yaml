  text: ἐπειδὴ καὶ Ἰουδαῖοι ⸀σημεῖα αἰτοῦσιν καὶ Ἕλληνες σοφίαν ζητοῦσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/022.yaml
  text: For Jews ask for signs[c][b][a], and Greeks seek wisdom.
translation:
  language: tl
  text: Sapagkat[a] humihingi ng mga tanda[b] ang mga Judio, at naghahanap naman ng karunungan ang mga Griego.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Yamang humihingi ng mga tanda ang mga Judio, at naghahanap naman ng karunungan ang mga Griego.”'
    reason: alternative_reading
  - marker: b
    text: Ang “mga tanda” ay maaari ring unawain bilang “mga himalang tanda.”
    reason: lexical_alternative
  - marker: c
    text: Maaari itong isalin nang mas malawak bilang “mga Hentil,” ngunit malamang na pinananatili rito ni Pablo ang tiyak na balangkas na pangkulturang Griego dahil sa pagbanggit sa karunungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειδή
  choice: Sapagkat
  rationale: Ipinakikita nito ang ugnayang nagbibigay-dahilan sa naunang pahayag, habang nananatiling natural at malinaw sa modernong Tagalog.
- source_word: Ἰουδαῖοι
  choice: mga Judio
  rationale: Tumutukoy ito sa kinikilalang pangkat na Judio, na inihahambing dito sa mga Griego bilang mga kategoryang panrelihiyon at pangkultura.
- source_word: σημεῖα
  choice: mga tanda
  rationale: Tuwirang pinananatili ng “mga tanda” ang lawak ng salitang Griego; maaaring tumukoy ang konteksto sa mga himalang tanda nang hindi iyon ipinipilit sa pangunahing teksto.
- source_word: αἰτοῦσιν
  choice: humihingi
  rationale: Likas itong katumbas ng pandiwa at hindi nito pinalalakas ang diwa tungo sa “humihingi bilang kahilingan” o “nanghihingi nang may pag-uutos.”
- source_word: Ἕλληνες
  choice: mga Griego
  rationale: Pinananatili nito ang tiyak na balangkas na pangkulturang Griego, lalo na dahil agad na binabanggit ang karunungan; mas malawak at hindi gaanong tiyak ang “mga Hentil.”
- source_word: σοφίαν
  choice: karunungan
  rationale: Ito ang tuwirang katumbas at pinananatili ang malawak na saklaw ng konsepto sa halip na paliitin agad sa pilosopiya.
- source_word: ζητοῦσιν
  choice: naghahanap
  rationale: Natural itong Tagalog para sa patuloy na paghahanap na ipinahihiwatig ng kasalukuyang panahunan ng pandiwang Griego.
