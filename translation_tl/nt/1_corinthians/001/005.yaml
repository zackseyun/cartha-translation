  text: ὅτι ἐν παντὶ ἐπλουτίσθητε ἐν αὐτῷ, ἐν παντὶ λόγῳ καὶ πάσῃ γνώσει,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/005.yaml
  text: because in him you were enriched in every way, in all speech and all knowledge,
translation:
  language: tl
  text: sapagkat sa kanya ay pinayaman kayo sa lahat ng paraan—sa lahat ng pananalita at sa lahat ng kaalaman.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: sapagkat
  rationale: Sa konteksto, ipinapahayag ng sugnay ang dahilan ng pasasalamat ni Pablo; likas at malinaw sa Tagalog ang “sapagkat.”
- source_word: ἐν παντὶ
  choice: sa lahat ng paraan
  rationale: Malawak at idyomatiko ang parirala; ipinahahayag nito ang saklaw ng pagpapayaman nang hindi nililimitahan sa materyal na bagay.
- source_word: ἐπλουτίσθητε
  choice: pinayaman kayo
  rationale: 'Pinananatili nito ang pasibong diwa: tumanggap sila ng kayamanan mula sa Diyos, at hindi lamang sila yumaman sa sarili nilang pagsisikap.'
- source_word: ἐν αὐτῷ
  choice: sa kanya
  rationale: Pinananatili ang posibleng diwa ng kalagayan o pakikiugnay kay Cristo, sa halip na paliitin ito sa instrumental na “sa pamamagitan niya.”
- source_word: ἐν παντὶ λόγῳ
  choice: sa lahat ng pananalita
  rationale: Sa pagkakaparis nito sa γνώσει, malamang na tumutukoy ang λόγος sa kakayahang magpahayag o magsalita; natural at sapat na malawak ang “pananalita.”
- source_word: πάσῃ γνώσει
  choice: sa lahat ng kaalaman
  rationale: Tuwirang pinananatili nito ang malawak na saklaw ng γνώσις at ang paralelismo sa “lahat ng pananalita.”
