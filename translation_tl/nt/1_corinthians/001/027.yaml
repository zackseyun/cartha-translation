base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/027.yaml
  text: But God chose the foolish things of the world so that he might shame the wise[c][b][a], and God chose the weak things of the world so that he might shame the strong.
translation:
  language: tl
  text: Ngunit, pinili ng Diyos ang mga itinuturing ng sanlibutan na hangal[a] upang hiyain[b] ang marurunong, at pinili ng Diyos ang mga itinuturing ng sanlibutan na mahina[c] upang hiyain ang malalakas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang mga hangal sa sanlibutan.” Ang Griyego ay gumagamit ng pang-uring neuter plural bilang pangngalan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ilagay sa kahihiyan.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “ang mga mahina sa sanlibutan.” Muli, gumagamit ang Griyego ng pang-uring neuter plural bilang pangngalan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Sa halip
  rationale: Nagpapakita ito ng matinding pagsalungat sa naunang pahayag at natural na nag-uugnay sa konteksto.
- source_word: τὰ μωρὰ τοῦ κόσμου
  choice: ang mga itinuturing na hangal ng sanlibutan
  rationale: Ang neuter plural na pang-uri ay ginagamit bilang pangngalan. Pinananatili ng salin ang malawak na saklaw nito nang hindi nililimitahan sa mga tao lamang, habang ipinahihiwatig na ito ang pagtataya ng sanlibutan.
- source_word: ἐξελέξατο
  choice: pinili
  rationale: Karaniwan, malinaw, at dignified na katumbas ng sadyang pagpili ng Diyos.
- source_word: ἵνα
  choice: upang
  rationale: Malinaw na ipinapahayag ang layunin ng pagkilos.
- source_word: καταισχύνῃ
  choice: hiyain
  rationale: Direkta at natural na katumbas ng pandiwang nangangahulugang magdulot ng kahihiyan o ilagay sa kahihiyan.
- source_word: τοὺς σοφούς
  choice: ang marurunong
  rationale: Natural na substantibong gamit sa Tagalog at pinananatili ang retorikal na pagsalungat.
- source_word: τὰ ἀσθενῆ τοῦ κόσμου
  choice: ang mga itinuturing na mahina ng sanlibutan
  rationale: Pinananatili ang substantibong neuter plural at ang malawak na reperensiya nito, nang hindi tahasang nililimitahan sa mga tao.
- source_word: τὰ ἰσχυρά
  choice: ang malalakas
  rationale: Maikli at natural na katapat ng 'mahina'; nananatiling bukas kung mga tao, bagay, o puwersang itinuturing na makapangyarihan ang tinutukoy.
theological_decisions:
- issue: Kung ang mga substantibong neuter plural ay tumutukoy lamang sa mga tao
  choice: Gumamit ng malawak na pariralang “mga itinuturing na hangal/mahina”
  alternative: “mga taong hangal/mahina”
  rationale: Hindi tahasang nililimitahan ng gramatikang Griyego ang reperensiya sa mga tao, kaya hindi ito dapat paliitin sa salin.
translation_notes:
  register: Makabagong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “sanlibutan” upang mapanatili ang Paulinong diwa ng κόσμος, at ang “itinuturing na” upang maging natural sa Tagalog nang hindi ipinapalagay na tunay na hangal o mahina ang pinili ng Diyos.
