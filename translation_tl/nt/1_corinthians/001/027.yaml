    rationale: Maaaring mangahulugan ito ng “instead” at magmungkahi ng pagpapalit. Sa talatang ito, ang ἀλλά ay pangunahing adversative na pagsalungat sa naunang pahayag; “Ngunit” ang mas tuwirang katumbas.
  - severity: low
    issue: Posibleng malabong saklaw ng “itinuturing na hangal ng sanlibutan”
    rationale: Mas malinaw ang “itinuturing ng sanlibutan na hangal,” na tahasang inilalapat ang pagtataya sa sanlibutan at pinananatili ang hindi-tiyak na reperensiya ng substantibong neuter plural.
