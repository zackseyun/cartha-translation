revisions:
- from: Sa halip, pinili ng Diyos ang mga itinuturing na hangal ng sanlibutan[a] upang hiyain[b] ang marurunong, at pinili ng Diyos ang mga itinuturing na mahina ng sanlibutan[c] upang hiyain ang malalakas.
  to: Ngunit, pinili ng Diyos ang mga itinuturing ng sanlibutan na hangal[a] upang hiyain[b] ang marurunong, at pinili ng Diyos ang mga itinuturing ng sanlibutan na mahina[c] upang hiyain ang malalakas.
  rationale: Pinalitan ang “Sa halip” ng “Ngunit” upang mas tapat na maipahayag ang adversative na ἀλλά. Inayos ang parirala para sa μωρὰ/ἀσθενῆ τοῦ κόσμου upang luminaw ang kaugnayan ng pagtataya sa sanlibutan, samantalang nananatiling hindi ipinagpapalagay kung tao lamang ang tinutukoy. Pinanatili ang lahat ng kahulugan, mga anchor ng talababa, at ang purposive na “upang.”
