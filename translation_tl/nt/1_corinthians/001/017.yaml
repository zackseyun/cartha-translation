id: 1CO.1.17
reference: 1 Corinthians 1:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὐ γὰρ ἀπέστειλέν με Χριστὸς βαπτίζειν ἀλλὰ εὐαγγελίζεσθαι, οὐκ ἐν σοφίᾳ λόγου, ἵνα μὴ κενωθῇ ὁ σταυρὸς τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/017.yaml
  text: For Messiah did not send me to baptize[a], but to proclaim the good news—not in wisdom of speech[c][b], so that the cross of Messiah might not be emptied.
translation:
  language: tl
  text: Sapagkat hindi ako isinugo ng Mesiyas upang magbautismo, kundi upang ipahayag ang magandang balita—hindi sa karunungan ng pananalita[a]—upang hindi mawalan ng saysay ang krus ng Mesiyas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa mahusay at marunong na pananalita”; sa literal, “sa karunungan ng salita.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “upang hindi mawalan ng kabuluhan ang krus ng Mesiyas” o “upang hindi mawalan ng kapangyarihan ang krus ng Mesiyas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς / τοῦ Χριστοῦ
  choice: Mesiyas / ng Mesiyas
  rationale: Isinalin bilang makabuluhang titulo, hindi lamang bilang pangalang hiniram; pinanatili rin ang pagkakapareho sa dalawang paglitaw nito sa talata.
- source_word: βαπτίζειν
  choice: magbautismo
  rationale: Karaniwan at tiyak na terminong panrelihiyon sa modernong Filipino, nang hindi nililimitahan ang paraan ng bautismo.
- source_word: εὐαγγελίζεσθαι
  choice: ipahayag ang magandang balita
  rationale: Malinaw at likas na ipinapahayag ang diwa ng pandiwa sa halip na gumamit ng hindi gaanong transparent na terminong teknikal.
- source_word: σοφίᾳ λόγου
  choice: sa karunungan ng pananalita
  rationale: Malapit sa anyo ng Griyego at sadyang hindi nilulutas kung ang diin ay nasa mahusay na retorika, katalinuhan, o kapwa.
- source_word: κενωθῇ
  choice: mawalan ng saysay
  rationale: Likas na Filipino para sa metaporikal na pagiging walang laman o walang kabuluhan, habang hindi idinaragdag sa pangunahing teksto ang salitang 'kapangyarihan' na hindi tahasang nasa Griyego.
- source_word: σταυρὸς
  choice: krus
  rationale: Pamantayan, tuwiran, at angkop na katumbas sa kontekstong Paulino.
theological_decisions:
- issue: Kung isasalin ang Χριστός bilang titulo o pananatilihin ang tradisyonal na transliterasyong 'Cristo.'
  choice: Mesiyas
  alternative: Cristo
  rationale: Ipinakikita ng 'Mesiyas' ang kahulugan ng titulong Griyego at pinananatili ang puwersang kristolohikal nito, nang hindi ito tinatratong isang karaniwang personal na pangalan lamang.
- issue: Kung ipaliliwanag na ang krus ay mawawalan 'ng kapangyarihan.'
  choice: mawalan ng saysay
  alternative: mawalan ng kapangyarihan
  rationale: Hindi tahasang binabanggit ng κενωθῇ kung ano ang inaalis; kaya hindi idinagdag sa teksto ang isang interpretibong layon, at inilagay lamang ang mas paliwanag na pagbasa sa talababa.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang 'Sapagkat' upang iugnay ang talata sa naunang pangangatwiran ni Pablo. Ang em dash ay nagtatakda sa pariralang tungkol sa paraan ng pagpapahayag nang hindi binabago ang lohika ng pangungusap.
