translation:
  language: tl
  text: upang, gaya ng nasusulat, “Ang nagmamalaki ay magmalaki sa Panginoon.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Sinumang nagmamalaki ay magmalaki sa Panginoon.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: upang
  rationale: Ipinahahayag nito ang layunin o kinalabasang kaugnay ng naunang talata, habang nananatiling natural sa makabagong Tagalog.
- source_word: καθὼς γέγραπται
  choice: gaya ng nasusulat
  rationale: Karaniwang pormula ito sa Tagalog para ipakilala ang sipi mula sa Kasulatan; pinananatili nito ang paghahambing na ipinahihiwatig ng καθὼς at ang patuloy na bisa ng perfect passive na γέγραπται.
- source_word: Ὁ καυχώμενος
  choice: Ang nagmamalaki
  rationale: Isinasalin nito ang articular participle bilang pangngalang parirala. Ang “nagmamalaki” ay malinaw at natural, at maaaring tumukoy sa pagyayabang o paglalagak ng karangalan ayon sa konteksto.
- source_word: ἐν κυρίῳ
  choice: sa Panginoon
  rationale: Pinananatili ng “sa” ang sadyang malawak na ugnayan ng ἐν—ang Panginoon bilang wastong saklaw, batayan, o pinatutungkulan ng pagmamalaki—nang hindi ito nililimitahan sa isang paliwanag lamang.
- source_word: καυχάσθω
  choice: ay magmalaki
  rationale: Ang anyong pautos sa ikatlong panauhan ay natural na naihahayag sa Tagalog sa konstruksiyong “Ang … ay mag…,” nang hindi nagdaragdag ng hiwalay na salitang gaya ng “dapat.”
theological_decisions:
- issue: Lakas ng pautos sa καυχάσθω
  choice: Ang nagmamalaki ay magmalaki
  alternative: Ang nagmamalaki ay dapat magmalaki
  rationale: Pinananatili ng napiling anyo ang tuwirang pag-uutos o paghimok ng Griyego. Ang “dapat” ay posible ngunit maaaring magtunog bilang pangkalahatang obligasyon sa halip na mismong pautos.
- issue: Kahulugan ng ἐν κυρίῳ
  choice: sa Panginoon
  alternative: ang Panginoon ang ipagmalaki
  rationale: Ang “sa Panginoon” ay mas malapit sa pahayag ng Griyego at pinananatili ang posibilidad na ang Panginoon ang saklaw, batayan, o pinatutungkulan ng pagmamalaki. Ang alternatibo ay mas natural sa ilang konteksto ngunit mas tahasang ginagawang tuwirang layon ang Panginoon.
- issue: Pagkakakilanlan ng κύριος sa sipi
  choice: Panginoon
  alternative: YHWH
  rationale: Isinasalin ang salitang Griyegong κύριος nang tuwiran bilang “Panginoon,” nang hindi tahasang nilulutas sa salin ang ugnayan ng sipi sa tekstong pinagmulan nito at ang gamit ni Pablo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang anyong nakaugnay sa naunang talata sa pamamagitan ng “upang,” at iniwasan ang mas lumang ekspresyong “ayon sa nasusulat” upang maging natural nang hindi nawawala ang pormula ng pagsipi.
