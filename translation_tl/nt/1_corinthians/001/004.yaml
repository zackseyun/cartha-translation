  text: Εὐχαριστῶ τῷ θεῷ ⸀μου πάντοτε περὶ ὑμῶν ἐπὶ τῇ χάριτι τοῦ θεοῦ τῇ δοθείσῃ ὑμῖν ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/004.yaml
  text: I thank my God always for you because of the grace of God given to you in Messiah Jesus[b][a],
translation:
  language: tl
  text: Lagi akong nagpapasalamat sa aking Diyos para sa inyo[a], dahil sa biyaya ng Diyos na ibinigay sa inyo sa Mesiyas na si Jesus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tungkol sa inyo.”
    reason: lexical_alternative
  - marker: b
    text: O “sa pakikipag-isa sa Mesiyas na si Jesus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐχαριστῶ
  choice: nagpapasalamat ako
  rationale: Ang kasalukuyang panahunan ay likas na ipinahahayag sa Filipino sa anyong “nagpapasalamat,” na angkop sa patuloy o nakagawiang pasasalamat ni Pablo.
- source_word: τῷ θεῷ μου
  choice: sa aking Diyos
  rationale: Pinananatili nito ang tahasang panghalip na “aking” at natural na sumusunod sa pandiwang “nagpapasalamat.”
- source_word: πάντοτε
  choice: lagi
  rationale: Direkta, malinaw, at karaniwang katumbas ito ng malawak na diwang temporal ng πάντοτε.
- source_word: περὶ ὑμῶν
  choice: dahil sa inyo
  rationale: Sa pormula ng pasasalamat, ipinahahayag nito ang mga taga-Corinto bilang dahilan o paksa ng pasasalamat. Natural ang “dahil sa inyo,” habang inilalagay sa talababa ang mas pormal na “patungkol sa inyo.”
- source_word: ἐπὶ τῇ χάριτι
  choice: dahil sa biyaya
  rationale: Ang ἐπί na may datibo rito ay tumutukoy sa batayan o dahilan ng pasasalamat; malinaw itong naihahayag ng “dahil sa.”
- source_word: χάριτι
  choice: biyaya
  rationale: Ang “biyaya” ang kinikilalang salin ng χάρις at malinaw na nagpapahayag ng mapagkaloob na kagandahang-loob ng Diyos.
- source_word: τοῦ θεοῦ
  choice: ng Diyos
  rationale: Pinananatili ng pariralang ito ang genitibong anyo at hindi labis na nililinaw kung pag-aari o pinagmulan ang nangingibabaw na diwa.
- source_word: τῇ δοθείσῃ ὑμῖν
  choice: na ibinigay sa inyo
  rationale: Pinananatili nito ang pasibong diwa ng participle at ang mga taga-Corinto bilang tumanggap, habang ang Diyos ay nauunawaang tagapagbigay.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: sa Mesiyas na si Jesus
  rationale: Isinasalin ang titular na kahulugan ng Χριστός bilang “Mesiyas” at iniiwan sa “sa” ang sadyang malawak na puwersa ng ἐν, na maaaring tumukoy sa larangan, kaugnayan, o pakikipag-isa.
theological_decisions:
- issue: Kahulugan ng ἐν Χριστῷ Ἰησοῦ
  choice: sa Mesiyas na si Jesus
  alternative: sa pakikipag-isa sa Mesiyas na si Jesus
  rationale: Hindi tahasang nililinaw ng salin ang ἐν bilang mistikal o soteriolohikal na pakikipag-isa lamang; pinananatili ng “sa” ang lawak at tensiyon ng orihinal.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Mesiyas” upang ihayag ang titular na puwersa ng Χριστός; iniwasan ang sobrang teknikal na pananalita sa pangunahing teksto.
