translation:
  language: tl
  text: kung paanong pinagtibay sa gitna ninyo[b] ang patotoo tungkol sa Mesiyas[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang patotoo ng Mesiyas.”
