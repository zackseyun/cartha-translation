lexical_decisions:
- source_word: καθὼς
  choice: kung paanong
  rationale: Ipinakikilala nito ang pagtutugma sa naunang pahayag at likas na nag-uugnay sa pangungusap sa modernong Tagalog.
- source_word: μαρτύριον
  choice: patotoo
  rationale: Pinananatili ng “patotoo” ang diwang pagsaksi at pagpapahayag nang hindi ginagawang mas malawak na “mensahe” lamang.
- source_word: τοῦ Χριστοῦ
  choice: tungkol sa Mesiyas
  rationale: 'Binabasa ang genitibo bilang layon: ang patotoo ay tungkol sa Mesiyas. Ginagamit ang “Mesiyas” upang ipakita ang pamagat na kahulugan ng Χριστός.'
- source_word: ἐβεβαιώθη
  choice: pinagtibay
  rationale: Ipinahahayag ng pasibong pandiwa na ang patotoo ay ginawang matatag o napatunayang mapanghahawakan.
- source_word: ἐν ὑμῖν
  choice: sa gitna ninyo
  rationale: Ang maramihang kausap ay maaaring tumukoy sa pagpapatibay sa loob ng pamayanan; pinananatili ng parirala ang aspektong pangkomunidad nang hindi isinasara ang literal na “sa inyo.”
theological_decisions:
- issue: Lakas ng genitibo sa τοῦ Χριστοῦ
  choice: 'layong genitibo: “patotoo tungkol sa Mesiyas”'
  alternative: 'paksang genitibo o mas di-tiyak na ugnayan: “patotoo ng Mesiyas”'
  rationale: Sa konteksto, malamang na tinutukoy ang ipinahayag na patotoo tungkol kay Jesus na pinagtibay sa mga taga-Corinto, ngunit tunay na posible sa anyong Griego ang “patotoo ng Mesiyas,” kaya itinatala ito sa talababa.
- issue: Saklaw ng ἐν ὑμῖν
  choice: “sa gitna ninyo,” na tumutukoy sa pamayanan
  alternative: “sa inyo,” na maaaring unawaing nasa loob ninyo o sa inyong karanasan
  rationale: Dahil maramihan ang ὑμῖν at pangkomunidad ang konteksto, natural ang “sa gitna ninyo”; gayunman, pinahihintulutan ng Griego ang mas literal at sadyang malawak na “sa inyo.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang sugnay bilang karugtong ng naunang talata, kaya nagsisimula sa maliit na titik at nagtatapos sa kuwit. Ang mga panandang talababa [a] at [b] ay kapwa nasa pangunahing teksto.
