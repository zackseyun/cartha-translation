  text: καὶ τὰ ἀγενῆ τοῦ κόσμου καὶ τὰ ἐξουθενημένα ἐξελέξατο ὁ θεός, ⸀τὰ μὴ ὄντα, ἵνα τὰ ὄντα καταργήσῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/028.yaml
  text: And God chose the lowborn things of the world and the despised things[a], the things that are not, to nullify the things that are[b],
translation:
  language: tl
  text: At pinili ng Diyos ang mga mababa ang katayuan sa sanlibutan at ang mga hinahamak,[a] ang mga hindi umiiral, upang pawalang-bisa ang mga umiiral.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga itinuturing na walang halaga.”
    reason: lexical_alternative
  - marker: b
    text: O “gawing walang kabuluhan ang mga umiiral.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγενῆ
  choice: mga hamak sa sanlibutan
  rationale: Ipinahihiwatig ng salita ang kawalan ng marangal na pinagmulan o mataas na katayuan. Likas at maikli sa modernong Tagalog ang “mga hamak,” at pinananatili nito ang panlipunang diin ng konteksto.
- source_word: ἐξουθενημένα
  choice: mga hinahamak
  rationale: Ipinakikita ng perpektong participle ang mga itinuring at patuloy na itinuturing na walang halaga. Malinaw na naihahayag ng “mga hinahamak” ang paglapastangan o paghamak sa kanila.
- source_word: τὰ μὴ ὄντα
  choice: ang mga hindi umiiral
  rationale: Malapit itong sumusunod sa matindi at malawak na pananalita ni Pablo. Hindi nito nililimitahan ang parirala sa panlipunang kahulugang “mga walang halaga,” bagaman iyon ang ipinahihiwatig ng konteksto.
- source_word: τὰ ὄντα
  choice: ang mga umiiral
  rationale: Pinananatili nito ang tuwirang pagtutol sa “mga hindi umiiral” at ang balanseng retorika ng Griyego.
- source_word: καταργήσῃ
  choice: pawalang-bisa
  rationale: Ipinahihiwatig ng pandiwa ang pag-aalis ng bisa, kapangyarihan, o kabuluhan, hindi kinakailangang ganap na paglipol. Ang “pawalang-bisa” ay malinaw at maikli.
- source_word: ἐξελέξατο
  choice: pinili
  rationale: Karaniwan, natural, at tumpak itong katumbas ng sadyang pagpili ng Diyos.
theological_decisions:
- issue: Kung ang τὰ μὴ ὄντα / τὰ ὄντα ay dapat ipaliwanag bilang mga uring panlipunan o panatilihin bilang pahayag tungkol sa pag-iral.
  choice: 'Pinanatili ang literal na pagtutol: “ang mga hindi umiiral” / “ang mga umiiral.”'
  alternative: “ang mga itinuturing na walang halaga” / “ang mga itinuturing na mahalaga”
  rationale: Malinaw sa konteksto na tinatalakay ang katayuan ayon sa sanlibutan, ngunit sadyang mas malawak at matalim ang pananalita ni Pablo. Pinananatili ng salin ang parehong retorikal na puwersa at teolohikal na tensiyon nang hindi ipinipilit ang mas makitid na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ang pag-uulit na “mga hamak” at “mga hinahamak” ay sadyang pinanatili upang maipakita ang magkaugnay ngunit magkaibang diwa ng mababang katayuan at aktuwal na paghamak. Ginamit ang “sanlibutan” upang tumbasan ang κόσμος sa pamilyar na rehistrong biblikal.
