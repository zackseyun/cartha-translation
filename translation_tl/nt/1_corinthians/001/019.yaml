    rationale: Bagaman sinusubukan nitong ulitin ang ugat ng “pagkaunawa,” ang pangngalang “mga nakauunawa” ay hindi karaniwang tawag sa mga taong may discernment o intelligence sa modernong Filipino. Ang “mga may unawa” ay natural, maigsi, at pinananatili ang sinadyang pag-uugnay ng mga salita.
