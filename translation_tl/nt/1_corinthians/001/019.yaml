  text: γέγραπται γάρ· Ἀπολῶ τὴν σοφίαν τῶν σοφῶν, καὶ τὴν σύνεσιν τῶν συνετῶν ἀθετήσω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/019.yaml
  text: 'For it is written: “I will destroy the wisdom of the wise[a], and I will set aside the understanding of the intelligent.”'
translation:
  language: tl
  text: 'Sapagkat nasusulat: “Wawasakin ko ang karunungan ng marurunong, at iwawalang-bisa ko ang pagkaunawa ng mga may unawa.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γέγραπται
  choice: nasusulat
  rationale: Karaniwang pormula sa Filipino para sa pagsipi sa Kasulatan; pinananatili nito ang diwang ang nakasulat ay nananatiling may bisa.
- source_word: γάρ
  choice: Sapagkat
  rationale: Ipinakikita ang pagbibigay-batayan ni Pablo sa naunang pahayag at angkop sa marangal na daloy ng pangungusap.
- source_word: Ἀπολῶ
  choice: Wawasakin ko
  rationale: Tuwirang ipinahahayag ang hinaharap na pagkilos ng pagsira o pagdadala sa kapahamakan, nang hindi dinaragdagan ang lakas ng Griyego.
- source_word: τὴν σοφίαν τῶν σοφῶν
  choice: ang karunungan ng marurunong
  rationale: Pinananatili ang magkaugnay na mga salitang σοφία at σοφῶν at ang retorikal na pag-uulit ng orihinal.
- source_word: τὴν σύνεσιν τῶν συνετῶν
  choice: ang pagkaunawa ng mga nakauunawa
  rationale: Pinananatili ang ugnayang leksikal ng σύνεσις at συνετός, pati ang pagkakatulad ng kayarian sa unang sugnay.
- source_word: ἀθετήσω
  choice: iwawalang-bisa ko
  rationale: Ipinahahayag ang pagpapawalang-saysay o pagbabalewala sa pagkaunawang tinutukoy; mas tiyak ito kaysa sa simpleng 'isantabi' ngunit hindi labis na interpretatibo.
theological_decisions:
- issue: Paglalahad sa sipi mula sa Isaias habang pinananatili ang retorikal na paghaharap
  choice: Gumamit ng tuwirang mga pandiwang panghinaharap na “wawasakin ko” at “iwawalang-bisa ko.”
  alternative: “Dadalhin ko sa wala” at “itatakwil ko.”
  rationale: Pinananatili ng salin ang mariing pagkilos ng Diyos laban sa karunungan at pagkaunawa ng tao nang hindi ipinapasok ang isang tiyak na paliwanag na teolohikal.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ang “nasusulat” ay pamilyar na wikang pangkasulatan, samantalang ang “iwawalang-bisa” ay malinaw at kasalukuyang gamit. Walang talababa sapagkat sapat na nailalahad sa teksto ang saklaw ng kahulugan nang hindi kailangang pumili sa isang tunay na hindi malulutas na kalabuan.
