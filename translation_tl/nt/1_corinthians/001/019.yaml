  source_fidelity: Tumpak na naihahatid ng draft ang pormulang pangsipi (γέγραπται), ang pangatnig na nagbibigay-batayan (γάρ), at ang dalawang pandiwang panghinaharap. Ang “wawasakin ko” ay angkop para sa Ἀπολῶ, at ang “iwawalang-bisa ko” ay isang lehitimong salin ng ἀθετήσω.
  naturalness: Marangal at malinaw sa kabuuan, ngunit ang “pagkaunawa ng mga nakauunawa” ay hindi likas sa modernong Filipino at tunog pauli-ulit sa paraang hindi katumbas ng retorikal na paralelismo ng Griyego. Mas natural ang “pagkaunawa ng mga may unawa.”
  terminology: Ang “karunungan ng marurunong” ay mabisang pinananatili ang magkakaugnay na σοφία/σοφῶν. Ang “pagkaunawa ng mga may unawa” ay nagpapanatili ng paralelismo ng σύνεσις/συνετῶν nang mas idiomatiko. Hindi kailangan ang talababa; ang piniling “iwawalang-bisa” ay nasa saklaw ng ἀθετήσω at walang natitirang kalabuang kailangang ipakita sa mambabasa.
  issues:
