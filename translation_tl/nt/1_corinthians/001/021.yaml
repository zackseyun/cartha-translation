    reason: alternative_reading
  revision_rationale: Inayos ang pang-ugnay at bantas para sa natural na Filipino. Pinalitan ang interpretibong 'itinuturing na kahangalan' ng 'kahangalan,' na mas malapit sa μωρία at hindi paunang nilulutas ang retorikal na kabalintunaan. Ang 'mensaheng ipinahahayag' ay nagbibigay ng malinaw na katumbas ng κήρυγμα bilang nilalaman ng proklamasyon; pinananatili ng talababa ang pagbasa rito bilang gawa o paraan ng pangangaral.
