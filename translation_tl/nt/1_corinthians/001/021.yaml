source:
  edition: SBLGNT
  text: ἐπειδὴ γὰρ ἐν τῇ σοφίᾳ τοῦ θεοῦ οὐκ ἔγνω ὁ κόσμος διὰ τῆς σοφίας τὸν θεόν, εὐδόκησεν ὁ θεὸς διὰ τῆς μωρίας τοῦ κηρύγματος σῶσαι τοὺς πιστεύοντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/021.yaml
  text: For since[a], in the wisdom of God, the world did not know God through wisdom[b], God was pleased through the foolishness of the proclamation to save those who believe.
translation:
  language: tl
  text: Sapagkat, yamang sa karunungan ng Diyos ay hindi nakilala ng sanlibutan ang Diyos sa pamamagitan ng karunungan, minabuti ng Diyos na iligtas sa pamamagitan ng kahangalan ng mensaheng ipinahahayag[a] ang mga sumasampalataya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “sa pamamagitan ng kahangalan ng pangangaral.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπειδὴ γὰρ
  choice: Sapagkat yamang
  rationale: Pinananatili ang paliwanag na ugnayan ng γάρ at ang pangyayaring dahilan na ipinakikilala ng ἐπειδή, kahit bahagyang pormal ang ayos.
- source_word: ἐν τῇ σοφίᾳ τοῦ θεοῦ
  choice: sa karunungan ng Diyos
  rationale: Pinananatili ang likas na kalabuan ng ἐν—maaaring tumukoy sa saklaw o kaayusan ng karunungan ng Diyos—nang hindi ito ginagawang tahasang kasangkapan.
- source_word: οὐκ ἔγνω
  choice: hindi nakilala
  rationale: Ang 'nakilala' ay natural sa Tagalog at nagpapanatili sa lawak ng γινώσκω, kapwa pagkaunawa at pagkakilala, nang hindi nagpapasok ng dagdag na paliwanag.
- source_word: ὁ κόσμος
  choice: ang sanlibutan
  rationale: Karaniwang biblikal ngunit nauunawaang katumbas ng κόσμος, na rito'y kumakatawan sa sangkatauhan sa makamundong kaayusan nito.
- source_word: διὰ τῆς σοφίας
  choice: sa pamamagitan ng karunungan
  rationale: Malinaw na ipinahahayag ang diwa ng paraan o kasangkapan ng διά na may genitive, nang hindi idinaragdag na ito ay 'sariling' karunungan ng sanlibutan.
- source_word: εὐδόκησεν ὁ θεὸς
  choice: minabuti ng Diyos
  rationale: Natural at marangal na Filipino para sa pasiya ayon sa mabuting kalooban ng Diyos; mas angkop sa pangungusap kaysa literal na 'nalugod ang Diyos.'
- source_word: διὰ τῆς μωρίας τοῦ κηρύγματος
  choice: sa pamamagitan ng itinuturing na kahangalan ng ipinahahayag
  rationale: Ipinakikita ng 'itinuturing na' na ang mensahe ay hinahatulang hangal ayon sa pananaw ng sanlibutan, hindi na ito ay tunay na kahangalan sa Diyos. Ang 'ipinahahayag' ay pangunahing tumutukoy sa nilalaman ngunit hindi lubusang inaalis ang kilos ng pangangaral.
- source_word: σῶσαι
  choice: na iligtas
  rationale: Karaniwan at tumpak na salin ng σῴζω na nagpapanatili sa soteriolohikal na diwa.
- source_word: τοὺς πιστεύοντας
  choice: ang mga sumasampalataya
  rationale: Natural na substantibong parirala para sa present participle at hindi nagdaragdag ng doktrinal na detalye na wala sa Griyego.
theological_decisions:
- issue: Kahulugan ng διὰ τῆς μωρίας τοῦ κηρύγματος
  choice: Pangunahing tumutukoy sa ipinahahayag na mensahe na itinuturing ng sanlibutan na hangal.
  alternative: Maaaring tumukoy sa tila hangal na gawain o paraan ng pangangaral, o sadyang saklawin kapwa ang mensahe at ang gawain.
  rationale: Karaniwang tumutukoy ang κήρυγμα sa nilalaman ng ipinahahayag, ngunit maaari ring umugong dito ang pampublikong gawain ng pagpapahayag. Pinananatili ng pangunahing salin at talababa ang dalawang posibilidad nang hindi tinatawag na hangal ayon sa Diyos ang mensahe.
translation_notes:
  register: Modernong Filipino na marangal at malinaw. Ginamit ang 'sanlibutan' dahil pamilyar ito sa biblikal na diskurso, samantalang ang 'minabuti' at 'ipinahahayag' ay likas sa kasalukuyang gamit. Bahagyang pormal ang 'Sapagkat yamang' upang maingatan ang parehong pang-ugnay sa Griyego.
