  text: ὅτι τὸ μωρὸν τοῦ θεοῦ σοφώτερον τῶν ἀνθρώπων ἐστίν, καὶ τὸ ἀσθενὲς τοῦ θεοῦ ἰσχυρότερον τῶν ⸀ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/025.yaml
  text: Because the foolishness of God is wiser than people, and the weakness of God is stronger than people.
translation:
  language: tl
  text: Sapagkat ang kamangmangan ng Diyos ay mas matalino kaysa sa mga tao, at ang kahinaan ng Diyos ay mas malakas kaysa sa mga tao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: Sapagkat
  rationale: Ipinahahayag nito ang dahilan o paliwanag na kaugnay ng naunang pahayag.
- source_word: τὸ μωρὸν τοῦ θεοῦ
  choice: ang kamangmangan ng Diyos
  rationale: Pinananatili ang matalim at retorikal na anyo ng Griyego nang hindi ipinapalagay na talagang mangmang ang Diyos; nauunawaan ito sa konteksto bilang yaong itinuturing na kamangmangan kaugnay ng Diyos.
- source_word: σοφώτερον
  choice: mas marunong
  rationale: Pinananatili ang pahambing na diwa at ang tuwirang paghahambing sa mga tao.
- source_word: τῶν ἀνθρώπων
  choice: sa mga tao
  rationale: Ang ἄνθρωποι ay tumutukoy sa sangkatauhan o mga tao sa pangkalahatan, hindi lamang sa mga lalaki.
- source_word: τὸ ἀσθενὲς τοῦ θεοῦ
  choice: ang kahinaan ng Diyos
  rationale: Pinananatili ang balanseng paralelismo sa unang sugnay at ang sadyang kabalintunaan ng teksto.
- source_word: ἰσχυρότερον
  choice: mas malakas
  rationale: Natural na makabagong Tagalog para sa paghahambing ng lakas, habang tapat sa Griyegong pahambing.
theological_decisions:
- issue: Ang mga pariralang “kamangmangan ng Diyos” at “kahinaan ng Diyos” ay maaaring mapagkamalang literal na katangian ng Diyos.
  choice: Panatilihin ang mga parirala ayon sa retorikal na anyo ng orihinal.
  alternative: “Ang itinuturing na kamangmangan ng Diyos” at “ang itinuturing na kahinaan ng Diyos.”
  rationale: Sadyang gumagamit si Pablo ng matinding kabalintunaan. Ang pagdaragdag ng “itinuturing na” ay maaaring magpaliwanag ngunit pinapahina nito ang pahayag at nagdaragdag ng salitang wala sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang magkatimbang na kayarian ng dalawang sugnay at ang teolohikal na tensiyon ng orihinal.
