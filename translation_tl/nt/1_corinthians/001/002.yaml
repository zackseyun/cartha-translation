language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τῇ ἐκκλησίᾳ τοῦ θεοῦ, ⸂ἡγιασμένοις ἐν Χριστῷ Ἰησοῦ, τῇ οὔσῃ ἐν Κορίνθῳ,⸃ κλητοῖς ἁγίοις, σὺν πᾶσιν τοῖς ἐπικαλουμένοις τὸ ὄνομα τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἐν παντὶ τόπῳ ⸀αὐτῶν καὶ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/002.yaml
  text: 'To the church of God that is in Corinth[a], to those sanctified in Messiah Jesus, called to be saints, together with all those who call on the name of our Lord Jesus the Messiah in every place[d][c][b], theirs and ours:'
translation:
  language: tl
  text: 'Sa iglesya ng Diyos na nasa Corinto—sa mga pinabanal kay Mesiyas na si Jesus, na tinawag upang maging mga banal[a]—kasama ang lahat ng tumatawag sa pangalan ng ating Panginoong Jesus na Mesiyas, saanmang lugar—kanila at atin[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga banal na tinawag.”
    reason: lexical_alternative
  - marker: b
    text: Ang “saanmang lugar—kanila at atin” ay maaaring tumukoy sa bawat lugar kung saan tumatawag sa Panginoon ang mga mananampalataya, o sa bawat lugar na kapuwa nauukol sa kanila at sa atin.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: iglesya
  rationale: Ang “iglesya” ang likas at malawak na nauunawaang katawagan sa modernong Filipino para sa pamayanang tinutukoy ni Pablo, nang hindi ipinapalagay na gusali ang tinutukoy.
- source_word: ἡγιασμένοις
  choice: mga pinabanal
  rationale: Pinananatili nito ang balintiyak na diwa at ang resultang nagpapatuloy mula sa perpektong pandiwaring Griyego.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: dahil sa pakikipag-isa sa Mesiyas na si Jesus
  rationale: Natural nitong ipinahahayag sa Filipino ang ugnayang saklaw ng ἐν sa karaniwang pormulang Paulino. Hindi nito itinuturing na apelyido ang Χριστός, kundi pinananatili itong titulong “Mesiyas.”
- source_word: κλητοῖς ἁγίοις
  choice: tinawag na maging banal
  rationale: Ito ang malinaw at natural na Filipino para sa dalawang pang-uring Griyego, habang ipinakikita na ang kabanalan ay kaugnay ng pagkatawag ng Diyos.
- source_word: ἐπικαλουμένοις τὸ ὄνομα
  choice: tumatawag sa pangalan
  rationale: Pinananatili nito ang biblikal na diwa ng pananalangin, pagsamba, at pag-asa sa Panginoon.
- source_word: κυρίου
  choice: Panginoon
  rationale: Ito ang karaniwang marangal na katumbas ng κύριος sa kontekstong nagpapahayag ng pananampalataya.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus na Mesiyas
  rationale: Ipinakikita ng ayos na ito na ang “Mesiyas” ay titulo ni Jesus, hindi apelyido.
- source_word: ἐν παντὶ τόπῳ αὐτῶν καὶ ἡμῶν
  choice: saanmang lugar—kanila at atin
  rationale: Pinananatili ng gitling ang maigsi at hindi ganap na tiyak na pagkakaugnay ng “kanila at atin” sa “saanmang lugar.”
theological_decisions:
- issue: Paglilipat ng Χριστός
  choice: Mesiyas sa dalawang paglitaw
  alternative: Cristo
  rationale: May malinaw pa ring bisa bilang titulo ang Χριστός sa pagbating ito; ang “Mesiyas” ay tuwirang nagpapahayag ng titulong iyon nang hindi ito ginagawang wari’y apelyido.
- issue: Kahulugan ng κλητοῖς ἁγίοις
  choice: tinawag na maging banal
  alternative: mga banal na tinawag
  rationale: Mas natural sa Filipino ang pangunahing salin, ngunit hindi nito ipinahihiwatig na nakamit nila ang kabanalan sa sariling pagsisikap; ang alternatibo ay inilagay sa talababa upang mapanatili ang mas literal na kayarian.
- issue: Pagkakaugnay ng αὐτῶν καὶ ἡμῶν
  choice: panatilihin ang maigsi at malabong “kanila at atin”
  alternative: bawat lugar na para sa kanila at sa atin
  rationale: Hindi ganap na tiyak kung ang parirala ay tumutukoy sa mga lugar na kinaroroonan ng mga mananampalataya o sa mga lugar na kapuwa nauukol sa kanila at sa mga apostol; hindi dapat tahimik na pagpasyahan ang tanong.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “iglesya” para sa pamayanan, “Mesiyas” bilang tunay na titulo, at mga gitling upang maging malinaw ang mga pariralang panuring nang hindi inaalis ang sintaktikong pag-igting ng Griyego.
