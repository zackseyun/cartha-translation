  - severity: low
    issue: Ang “tinawag na maging banal” ay maaaring basahing isahan at hindi gaanong tuwirang tumutukoy sa pangkat bilang “mga banal.”
    rationale: Bagaman nauunawaan sa Filipino ang pang-uri bilang pangkalahatang katangian, ang “tinawag upang maging mga banal” ay mas malinaw para sa maramihang tagatanggap at maayos na naghahatid ng κλητοῖς ἁγίοις.
