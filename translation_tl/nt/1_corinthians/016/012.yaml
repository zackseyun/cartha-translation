reference: 1 Corinthians 16:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Περὶ δὲ Ἀπολλῶ τοῦ ἀδελφοῦ, πολλὰ παρεκάλεσα αὐτὸν ἵνα ἔλθῃ πρὸς ὑμᾶς μετὰ τῶν ἀδελφῶν· καὶ πάντως οὐκ ἦν θέλημα ἵνα νῦν ἔλθῃ, ἐλεύσεται δὲ ὅταν εὐκαιρήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/012.yaml
  text: Concerning Apollos our brother[a], I strongly urged him to come to you with the brothers; but it was not at all his will to come now[b]. Yet he will come when he has opportunity.
translation:
  language: tl
  text: Tungkol naman kay Apolos na ating kapatid,[a] mahigpit ko siyang hinimok na pumunta sa inyo kasama ng mga kapatid. Ngunit talagang hindi niya kaloobang pumunta ngayon.[b] Gayunman, pupunta siya kapag nagkaroon siya ng pagkakataon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “si Apolos, ang kapatid.” Walang tahasang panghalip na paari sa Griyego; literal na “si Apolos, ang kapatid.”
    reason: lexical_alternative
  - marker: b
    text: O “ngunit talagang ayaw niyang pumunta ngayon.” Mas literal na sinasabi ng Griyego, “talagang hindi niya kaloobang pumunta ngayon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Tungkol naman kay
  rationale: Likas na panandang liham sa Filipino para sa paglipat sa isang bagong paksa; ipinahahayag ng “naman” ang banayad na transisyon ng δέ nang hindi idinaragdag ang temporal na “ngayon.”
- source_word: Ἀπολλῶ τοῦ ἀδελφοῦ
  choice: Apolos na ating kapatid
  rationale: Ginamit ang nakaugaliang anyong Filipino na “Apolos.” Bagaman walang tahasang panghalip na paari sa Griyego, natural sa Filipino ang “ating kapatid” para sa kapwa mananampalataya; itinala sa talababa ang mas literal na anyo.
- source_word: πολλὰ παρεκάλεσα αὐτὸν
  choice: mahigpit ko siyang hinimok
  rationale: Ipinakikita ng πολλὰ ang tindi ng pakiusap. Ang “mahigpit na hinimok” ay malinaw at dignidadong Filipino, at hindi ipinapalagay na paulit-ulit ang paghihimok.
- source_word: ἵνα ἔλθῃ πρὸς ὑμᾶς
  choice: na pumunta sa inyo
  rationale: Natural na ipinahahayag sa Filipino ang nilalaman ng paghihimok sa pamamagitan ng sugnay na “na”; hindi idinagdag ang di-tahasang ideya ng pagdalaw.
- source_word: μετὰ τῶν ἀδελφῶν
  choice: kasama ng mga kapatid
  rationale: Tinutukoy ng konteksto ang mga partikular na kasamang naglalakbay. Sa Filipino, maaaring tumukoy ang “mga kapatid” sa mga lalaking tinutukoy rito nang hindi gumagamit ng lipas na “mga kapatid na lalaki.”
- source_word: καὶ πάντως οὐκ ἦν θέλημα
  choice: Ngunit talagang hindi niya kalooban
  rationale: Ipinahahayag ng “talagang hindi” ang mariing negasyon ng πάντως οὐκ. Pinananatili ng “kalooban” ang pangngalang θέλημα at ang likas na pagtukoy nito sa kagustuhan ni Apolos.
- source_word: νῦν
  choice: ngayon
  rationale: Tuwirang katumbas ng temporal na pang-abay at malinaw na tumutukoy sa kasalukuyang panahon.
- source_word: ἐλεύσεται δὲ
  choice: Gayunman, pupunta siya
  rationale: 'Ipinahahayag ng “gayunman” ang banayad na pagsalungat ng δέ: hindi siya pupunta ngayon, ngunit darating siya sa ibang pagkakataon.'
- source_word: ὅταν εὐκαιρήσῃ
  choice: kapag nagkaroon siya ng pagkakataon
  rationale: Sinasalamin ang εὐκαιρέω bilang pagkakaroon ng angkop o kanais-nais na pagkakataon, nang hindi ito pinabababa sa pansariling kaginhawahan lamang.
theological_decisions:
- issue: Ang paksa at diwa ng οὐκ ἦν θέλημα
  choice: Ang kalooban o kagustuhan ni Apolos ang tinutukoy.
  alternative: Hindi kalooban ng Diyos na pumunta siya ngayon.
  rationale: Si Apolos ang pinakamalapit at pinakanatural na tinutukoy sa konteksto. Walang palatandaan sa teksto na lumilipat ang paksa sa kalooban ng Diyos, kaya hindi idinagdag ang gayong teolohikal na kahulugan.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Pinanatili ang anyong pangngalan na “kalooban” upang maipakita ang pagkakabuo at bahagyang pormal na himig ng Griyego, habang inilakip sa talababa ang mas karaniwang “ayaw niya.”
