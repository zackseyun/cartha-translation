translation:
  language: tl
  text: Sumainyong lahat na nasa Mesiyas na si Jesus ang aking pag-ibig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “Cristo Jesus.” Ang titulong Griyego na Χριστός ay maaaring isaling “Mesiyas” o, ayon sa mas tradisyonal na gamit, “Cristo.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἡ ἀγάπη μου
  choice: ang pag-ibig ko
  rationale: Likas at malinaw na salin ng personal na pag-ibig ni Pablo; pinananatili ang tahasang panghalip na paari.
- source_word: μετὰ πάντων ὑμῶν
  choice: sumainyong lahat
  rationale: Ang μετά kasama ng maramihang panghalip ay nangangahulugang “kasama ninyong lahat.” Ang anyong “sumainyo” ay natural sa isang pangwakas na pagbati o hangarin at pinananatili ang saklaw na walang itinatangi.
- source_word: ἐν
  choice: sa
  rationale: Pinananatili ang malawak na diwa ng Pauline na ἐν bilang kinaroroonan o saklaw ng ugnayan, nang hindi ito nililimitahan sa “sa pamamagitan ng.”
- source_word: Χριστῷ Ἰησοῦ
  choice: Mesiyas na si Jesus
  rationale: Isinasalin ang titulong Χριστός bilang “Mesiyas” at inilalahad ang pangalan sa likas na ayos ng modernong Filipino. Hindi nito ginagawang simpleng apelyido ang titulo.
theological_decisions:
- issue: Pagpapahayag sa walang pandiwang pangwakas na pahayag
  choice: Sumainyong lahat ang pag-ibig ko
  alternative: Kasama ninyong lahat ang pag-ibig ko
  rationale: Walang tahasang pandiwa ang Griyego. Ang “sumainyo” ay nagpapahayag ng pangwakas na hangarin o pagpapala nang hindi ito ginagawang tuwirang pahayag na “naroon” na ang pag-ibig.
- issue: Pagsasalin ng Χριστός sa pariralang ἐν Χριστῷ Ἰησοῦ
  choice: Mesiyas na si Jesus
  alternative: Cristo Jesus
  rationale: Pinananatili ng “Mesiyas” ang kahulugan ng titulo. Inilalagay sa talababa ang tradisyonal at mas pangalang anyong “Cristo Jesus” upang kilalanin ang lehitimong alternatibo nang hindi inaalis ang kristolohikal na bigat ng salita.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang maikli at likas na anyong pangwakas na “Sumainyong lahat,” habang iniwasan ang labis na pagpapaliwanag sa mismong talata.
