  source_fidelity: Ang draft ay wastong kinikilala si Pablo at ang personal na katangian ng sulat, ngunit ang idinagdag na “sumulat” ay ginagawang ganap na pangungusap ang eliptikong Griyego at bahagyang mas matibay kaysa sa pormang “ang pagbati, sa aking sariling kamay—Pablo.” Mas malapit ang “nasa ... sulat-kamay” sa ipinahihiwatig ng Griyego nang hindi kailangang magdagdag ng pandiwa.
