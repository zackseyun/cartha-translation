  text: Ang pagbating ito ay nasa sarili kong sulat-kamay—Pablo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ ἀσπασμός
  choice: ang … pagbating ito
  rationale: Ang ἀσπασμός ay isang personal na pagbati; ginamit ang “ito” upang natural na tukuyin sa Tagalog ang pagbating nasa mismong talata.
- source_word: τῇ ἐμῇ χειρί
  choice: sa sarili kong kamay
  rationale: Pinananatili ang diin ng ἐμῇ sa personal na pagkakasulat ni Pablo, sa halip na sa pamamagitan ng isang tagasulat.
- source_word: Παύλου
  choice: Ako, si Pablo
  rationale: Ang anyong Griyego ay isang maikling pagkakakilanlan na kaugnay ng “sarili kong kamay.” Inilipat ito sa unahan para sa malinaw at likas na pangungusap sa Tagalog nang hindi binabago ang diwa.
