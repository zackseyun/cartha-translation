  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: κατὰ μίαν ⸀σαββάτου ἕκαστος ὑμῶν παρ’ ἑαυτῷ τιθέτω θησαυρίζων ὅ τι ⸀ἐὰν εὐοδῶται, ἵνα μὴ ὅταν ἔλθω τότε λογεῖαι γίνωνται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/002.yaml
  text: On the first day of every week[a], each of you is to set something aside, storing up whatever he may prosper in[c][b], so that collections will not be made when I come.
translation:
  language: tl
  text: Tuwing unang araw ng bawat linggo,[a] magtabi ang bawat isa sa inyo sa kanyang sarili ng halagang iniipon, ayon sa anumang kasaganang natatanggap niya.[b][c] Sa gayon, pagdating ko, hindi na kailangang mangolekta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Sa unang araw ng linggo.” Ipinahihiwatig ng pananalitang Griyego rito ang regular na gawaing ginagawa linggo-linggo.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa tabi ng kanyang sarili” o “sa kanyang sarili.” Maaaring mangahulugan itong personal na magtabi ang bawat isa, marahil sa bahay.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “ayon sa naging kasaganaan niya.” Ang diwa ay magtabi ang bawat isa ayon sa anumang pag-unlad o kasaganaang natatanggap niya.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ μίαν σαββάτου
  choice: Tuwing unang araw ng linggo
  rationale: Ipinahahayag ng κατὰ na may accusative ang paulit-ulit at lingguhang gawain. Likas sa makabagong Tagalog ang “tuwing” upang ipakita ang distributibong diwa.
- source_word: ἕκαστος ὑμῶν
  choice: ang bawat isa sa inyo
  rationale: Tuwirang pinananatili ang distributibong utos na para sa bawat kasapi ng kausap na pangkat.
- source_word: παρ’ ἑαυτῷ
  choice: sa ganang sarili
  rationale: Pinananatili nito ang diwang personal na pagtatabi nang hindi tiyakang ipinapalagay na sa bahay ito ginawa; ipinaliliwanag sa talababa ang mga posibleng pakahulugan.
- source_word: τιθέτω θησαυρίζων
  choice: magbukod ng anumang halaga at ipunin ito
  rationale: Inihahatid ng “magbukod” ang pautos na τιθέτω at ng “ipunin” ang patuloy na pag-iimbak na ipinahahayag ng θησαυρίζων.
- source_word: ὅ τι ἐὰν εὐοδῶται
  choice: ayon sa kanyang kinita
  rationale: Natural itong Tagalog para sa halagang naaayon sa naging pag-unlad o kasaganaan ng tao. Gayunman, mas malawak kaysa sahod lamang ang εὐοδῶται, kaya binabanggit sa talababa ang mas literal na alternatibo.
- source_word: ἵνα μὴ ὅταν ἔλθω τότε λογεῖαι γίνωνται
  choice: Sa gayon, hindi na kailangang mangolekta pagdating ko
  rationale: 'Malinaw na ipinahahayag ang layunin ng lingguhang pagtatabi: maiwasan ang pangongolekta sa mismong pagdating ni Pablo.'
theological_decisions:
- issue: Kung ang παρ’ ἑαυτῷ ay nangangahulugang tiyak na pagtatabi sa bahay o personal na pagtatabi lamang
  choice: Hindi tinukoy ang bahay; ginamit ang “sa ganang sarili.”
  alternative: “sa kanyang bahay”
  rationale: Maaaring tumukoy ang parirala sa pribadong pagtatabi, marahil sa bahay, ngunit hindi tahasang nasa Griyego ang salitang “bahay.” Pinananatili ng salin ang tunay na kalabuan.
- issue: Kung ang εὐοδῶται ay tumutukoy lamang sa sahod o sa anumang kasaganaang natanggap
  choice: “ayon sa kanyang kinita” na may paliwanag sa talababa
  alternative: “ayon sa kanyang kasaganaan”
  rationale: Ang konteksto ay halagang maibubukod, ngunit mas malawak ang pandiwa kaysa regular na sahod. Nililinaw ng talababa na ang batayan ay anumang naging pag-unlad o kasaganaang natanggap.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “magbukod” at “ipunin” upang ipakita kapwa ang pagtatabi at unti-unting pag-iimbak. Iniwasan ang masyadong teknikal o makalumang pananalita, at pinanatili sa mga talababa ang leksikal na kalabuan ng παρ’ ἑαυτῷ at εὐοδῶται.
