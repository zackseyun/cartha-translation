id: 1CO.16.11
reference: 1 Corinthians 16:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: μή τις οὖν αὐτὸν ἐξουθενήσῃ. προπέμψατε δὲ αὐτὸν ἐν εἰρήνῃ, ἵνα ἔλθῃ πρός ⸀με, ἐκδέχομαι γὰρ αὐτὸν μετὰ τῶν ἀδελφῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/011.yaml
  text: So then[a], let no one despise him. But send him on his way in peace, so that he may come to me, for I am expecting him with the brothers.
translation:
  language: tl
  text: Kaya huwag siyang hamakin ninuman. Sa halip, tulungan ninyo siyang makapagpatuloy nang payapa sa paglalakbay upang makarating siya sa akin, sapagkat hinihintay ko siya kasama ng mga kapatid[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring “mga kapatid na lalaki.” Maaari ring tumukoy ang “mga kapatid” sa mas malawak na pangkat ng mga kapwa mananampalataya o kamanggagawa na kasama niyang hinihintay ni Pablo.
    reason: lexical_alternative
lexical_decisions:
- source_word: μή τις οὖν
  choice: Kaya huwag ... ninuman
  rationale: Ipinahahayag ng μή kasama ng aorist subjunctive ang pagbabawal, at ng οὖν ang hinuha mula sa naunang tagubilin. Likas sa modernong Tagalog ang ayos na ito.
- source_word: ἐξουθενήσῃ
  choice: hamakin
  rationale: Tumutukoy ito sa pagtingin o pagtrato sa isang tao na parang walang halaga; maikli, malinaw, at sapat ang tindi ng “hamakin.”
- source_word: προπέμψατε
  choice: tulungan ninyo siyang makapagpatuloy ... sa paglalakbay
  rationale: Maaaring saklaw ng pandiwa ang pagpapahatid at pagbibigay ng kinakailangang tulong para sa patuloy na paglalakbay, hindi lamang ang simpleng pagpapaalis.
- source_word: ἐν εἰρήνῃ
  choice: nang payapa
  rationale: Ipinananatili nito ang diwa ng mapayapa, walang sagabal, at mabuting pagpapaalis sa kaniya.
- source_word: ἵνα ἔλθῃ πρός με
  choice: upang makarating siya sa akin
  rationale: Malinaw na ipinahahayag ng “upang” ang layuning taglay ng ἵνα at subjunctive.
- source_word: ἐκδέχομαι
  choice: hinihintay ko
  rationale: Natural sa Tagalog at nagpapahayag ng nagpapatuloy at may-pananabik na paghihintay.
- source_word: μετὰ τῶν ἀδελφῶν
  choice: kasama ng mga kapatid
  rationale: Ang “mga kapatid” ay likas na salin sa Tagalog para sa ἀδελφοί at hindi nito kinakailangang tukuyin ang kasarian; pinananatili sa talababa ang posibilidad na mga lalaki lamang o isang mas malawak na pangkat ang tinutukoy.
theological_decisions:
- issue: Saklaw ng ἀδελφῶν bilang katawagan sa pangkat ng mga mananampalataya o kamanggagawa
  choice: mga kapatid
  alternative: mga kapatid na lalaki; mga kapatid na lalaki at babae
  rationale: Mas natural at tunay sa gamit ng Tagalog ang “mga kapatid,” na maaaring tumukoy sa mga lalaking kapatid o sa halo-halong pangkat. Hindi nilulutas ng pangunahing teksto ang hindi tiyak na saklaw ng Griyego; nililinaw ito sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “hamakin” bilang matibay ngunit karaniwang salita, at pinalawak nang bahagya ang προπέμψατε upang maipahayag ang tulong para sa patuloy na paglalakbay. Ang panghalip na “siya” ay tumutukoy kay Timoteo ayon sa konteksto.
