translation:
  language: tl
  text: Gawin ninyo ang lahat nang may pag-ibig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “Mangyari ang lahat ng sa inyo sa pag-ibig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: ang lahat
  rationale: Ang neuter plural ay sumasaklaw sa lahat ng bagay o gawain; natural sa Tagalog ang “ang lahat” sa ganitong pangkalahatang utos.
- source_word: ὑμῶν
  choice: ninyo
  rationale: Ang genitive pronoun ay kaugnay ng πάντα at maaaring unawaing “lahat ng sa inyo” o, ayon sa diwa, lahat ng ginagawa ninyo. Pinananatili ng “ninyo” ang pahiwatig nang hindi labis na nililinaw.
- source_word: ἐν ἀγάπῃ
  choice: nang may pag-ibig
  rationale: Maaaring tumukoy ang ἐν sa paraan o kalagayan. Ang “nang may pag-ibig” ay likas na Tagalog para sa paraang dapat mamayani sa bawat kilos.
- source_word: γινέσθω
  choice: gawin
  rationale: Ang present imperative ng γίνομαι ay isang pangkalahatang paghikayat na mangyari o maisagawa ang lahat sa pag-ibig. Ginagawang tuwirang pautos ng “gawin” ang diwa sa natural na Tagalog.
theological_decisions: []
translation_notes:
  register: Maikli, marangal, at madaling maunawaan. Ginamit ang karaniwang “pag-ibig” at pinanatili sa talababa ang mas literal ngunit hindi gaanong likas na ayos ng Griyego.
