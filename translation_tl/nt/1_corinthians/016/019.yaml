  source_fidelity: Tumpak na naisasalin ng draft ang dalawang pagbati, ang mga iglesya ng Romanong Asia, ang mga pangalang Akila at Priska, ang pariralang “sa Panginoon,” at ang iglesyang kaugnay ng kanilang tahanan. Gayunman, ang “lubos” ay hindi ang pinakanatural na Tagalog na pagpapasidhi ng pagbati, at ang ayos na “Lubos kayong binabati ... nina Akila at Priska, kasama ang iglesya” ay bahagyang mabigat at maaaring pansamantalang lumabo ang saklaw ng “kasama.”
  naturalness: Mas natural sa makabagong Filipino ang “Taos-puso kayong binabati” para sa πολλὰ sa ganitong konteksto. Ang “kasama ng iglesyang nasa kanilang tahanan” ay malinaw na isinasama ang iglesya sa mga bumabati at mas malapit sa pagkakaugnay ng σὺν sa Griyego. Ang “nasa kanilang tahanan” ay nagpapanatili sa maingat na pananalitang “church in their house” nang hindi sapilitang idinaragdag ang pandiwang “nagtitipon.”
  terminology: Ang “iglesya,” “Panginoon,” “Akila,” at “Priska” ay angkop at magkakatugma sa source at audit trail. Napananatili ang “Priska,” samantalang maayos na ipinaliliwanag sa talababa ang anyong “Priskila.”
