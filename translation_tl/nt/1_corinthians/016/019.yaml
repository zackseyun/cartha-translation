source:
  edition: SBLGNT
  text: Ἀσπάζονται ὑμᾶς αἱ ἐκκλησίαι τῆς Ἀσίας. ⸀ἀσπάζεται ὑμᾶς ἐν κυρίῳ πολλὰ Ἀκύλας καὶ ⸀Πρίσκα σὺν τῇ κατ’ οἶκον αὐτῶν ἐκκλησίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/019.yaml
  text: The churches of Asia greet you[a]. Aquila and Prisca, together with the church in their house[b], greet you warmly in the Lord.
translation:
  language: tl
  text: Binabati kayo ng mga iglesya sa Asia.[a] Taos-puso kayong binabati sa Panginoon nina Akila at Priska,[b] kasama ng iglesyang nasa kanilang tahanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Asia” rito ay ang lalawigang Romano ng Asia sa kanlurang bahagi ng Asia Minor, hindi ang makabagong kontinente ng Asia.
    reason: cultural_note
  - marker: b
    text: “Priska” ang nasa Griyego rito; tinatawag din siyang “Priskila” sa ibang mga talata (halimbawa, Gawa 18:2, 18, 26; Roma 16:3).
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζονται / ἀσπάζεται
  choice: binabati
  rationale: Karaniwang tumutukoy ang ἀσπάζομαι sa pagbati o pagpaparating ng pagbati. Ang “binabati” ay natural at marangal sa makabagong Tagalog; hiwalay na ipinahayag sa “lubos” ang diin ng πολλὰ.
- source_word: αἱ ἐκκλησίαι
  choice: mga iglesya
  rationale: Sa gamit ni Pablo, ang ἐκκλησία ay karaniwang tumutukoy sa mga lokal na kongregasyong Kristiyano. Malinaw at pamilyar sa karaniwang mambabasa ang “mga iglesya.”
- source_word: τῆς Ἀσίας
  choice: sa Asia
  rationale: Tumutukoy ang Ἀσία sa lalawigang Romano ng Asia. Pinananatili sa pangunahing teksto ang maikling heograpikong pangalan at nililinaw ang makasaysayang kahulugan sa talababa.
- source_word: ἐν κυρίῳ
  choice: sa Panginoon
  rationale: Pinananatili nito ang karaniwang teolohikal at relasyonal na pananalita ni Pablo nang hindi dinaragdagan ang pangalan ni Jesus na hindi tahasang nasa parirala.
- source_word: πολλὰ
  choice: lubos
  rationale: Ginagamit dito ang πολλὰ bilang panuring na nagpapasidhi sa pagbati. Natural na ipinahahayag ng “lubos kayong binabati” ang masiglang diin nito sa Tagalog nang hindi pinipilit ang literal ngunit asiwa na “marami.”
- source_word: Ἀκύλας καὶ Πρίσκα
  choice: Akila at Priska
  rationale: Isinalin sa baybay na angkop sa Tagalog ang mga pangalang nasa Griyego. Pinanatili ang maikling anyong Πρίσκα sa halip na palitan ito ng mas mahabang anyong Priskila.
- source_word: σὺν τῇ κατ’ οἶκον αὐτῶν ἐκκλησίᾳ
  choice: kasama ang iglesyang nagtitipon sa kanilang tahanan
  rationale: Ang κατ’ οἶκον ay idyomatikong tumutukoy sa kongregasyong nagtitipon sa isang tahanan. Nililinaw ng saling ito ang likas na diwa ng parirala at iniiwasang ipakahulugan ang iglesya bilang sambahayan lamang.
theological_decisions:
- issue: Kahulugan ng ἐκκλησία sa konteksto ng isang tahanan
  choice: isang lokal na kongregasyong nagtitipon sa tahanan nina Akila at Priska
  alternative: ang kanilang sambahayan o isang institusyong tinatawag na “bahay-iglesya”
  rationale: Sa karaniwang gamit ni Pablo at sa pagkakabuo ng κατ’ οἶκον, pinakamalamang na isang kapulungan ng mga mananampalataya na nagtitipon sa kanilang tahanan ang tinutukoy, hindi lamang ang kanilang pamilya.
- issue: Paglilipat ng κύριος
  choice: Panginoon
  alternative: Guro o Amo
  rationale: Ang “Panginoon” ang natural na saling nagpapanatili sa pagkilala at relasyonal na lakas ng karaniwang pariralang Paulino na ἐν κυρίῳ.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “iglesya” bilang pamilyar na katawagan sa lokal na kongregasyong Kristiyano. Inilagay ang mga pananda ng talababa kaagad pagkatapos ng “Asia” at “Priska,” na siyang mga salitang nililinaw ng mga tala.
