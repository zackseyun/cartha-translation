  text: χαίρω δὲ ἐπὶ τῇ παρουσίᾳ Στεφανᾶ καὶ Φορτουνάτου καὶ Ἀχαϊκοῦ, ὅτι τὸ ⸀ὑμέτερον ὑστέρημα οὗτοι ἀνεπλήρωσαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/017.yaml
  text: And I rejoice at the coming of Stephanas and Fortunatus and Achaicus[a], because these men have made up for your absence.
translation:
  language: tl
  text: At nagagalak ako sa pagdating nina Estefanas, Fortunato, at Acaico,[a] sapagkat pinunan nila ang pagkukulang ninyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “pinunan ng mga taong ito ang anumang kulang mula sa inyo.” Malamang na tinutukoy ni Pablo ang hindi ninyo personal na makapiling siya, sa halip na isang moral na kapintasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρω
  choice: nagagalak ako
  rationale: Pinananatili ang tuwiran at personal na pagpapahayag ng kasiyahan ni Pablo sa kasalukuyang panahunan.
- source_word: δὲ
  choice: At
  rationale: Mahinang pang-ugnay ito sa konteksto, hindi matinding pagsalungat.
- source_word: ἐπὶ τῇ παρουσίᾳ
  choice: sa pagdating
  rationale: Tumutukoy sa pagdating at personal na presensiya ng tatlong lalaki, hindi sa teknikal na eskatolohikong kahulugan ng παρουσία.
- source_word: Στεφανᾶ καὶ Φορτουνάτου καὶ Ἀχαϊκοῦ
  choice: nina Estefanas, Fortunato, at Acaico
  rationale: Isinalin ang mga pangalan ayon sa natural at nakaugaliang anyong Filipino; ang 'nina' ay angkop sa magkakasamang pangalang pantangi.
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw na ipinakikilala nito ang dahilan ng kagalakan ni Pablo.
- source_word: τὸ ὑμέτερον ὑστέρημα
  choice: ang pagkukulang ninyo
  rationale: Pinananatili ang mas malawak at tunay na di-tiyak na kahulugan ng ὑστέρημα bilang anumang kulang, sa halip na itakda agad na pisikal na pagkawala lamang.
- source_word: οὗτοι
  choice: nila
  rationale: Natural na tumutukoy sa tatlong lalaking kababanggit lamang; malinaw na ang panghalip sa Filipino nang hindi inuulit ang 'ang mga lalaking ito.'
- source_word: ἀνεπλήρωσαν
  choice: pinunan
  rationale: Tumpak at natural na ipinahahayag ang pagpunô o pagtustos sa anumang kulang.
theological_decisions:
- issue: Kung ang τὸ ὑμέτερον ὑστέρημα ay tiyak na nangangahulugang kawalan ng personal na presensiya ng mga taga-Corinto
  choice: Pinanatili sa pangunahing teksto ang mas literal at malawak na 'pagkukulang ninyo.'
  alternative: Binawi nila ang lungkot na dulot ng hindi ninyo pagparito / pinunan nila ang kawalan ninyo.
  rationale: Maaaring personal na kawalan ang tinutukoy sa konteksto, ngunit hindi ito tahasang sinasabi ng Griyego. Iniiwasan ng salin na gawing tiyak ang isang malamang ngunit interpretatibong paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'nagagalak' at 'sapagkat' upang mapanatili ang dignidad ng liham nang hindi nagiging lipas o labis na pormal. Ang pangunahing teksto ay malapit sa Griyego at ang posibleng kontekstuwal na kahulugan ay inilagay sa talababa.
