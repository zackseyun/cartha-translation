id: 1CO.16.16
reference: 1 Corinthians 16:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἵνα καὶ ὑμεῖς ὑποτάσσησθε τοῖς τοιούτοις καὶ παντὶ τῷ συνεργοῦντι καὶ κοπιῶντι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/016.yaml
  text: that you also submit yourselves to such people[b][a], and to everyone who works and labors.
translation:
  language: tl
  text: na kayo rin ay magpasakop sa mga taong tulad nila[a], at sa bawat nakikiisa sa gawain[b] at nagpapagal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa gayong mga tao.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “katuwang sa gawain” o “nakikipagtulungan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: na
  rationale: Likas na ipinagpapatuloy nito sa Filipino ang pakiusap na sinimulan sa naunang talata, habang pinananatili ang puwersang pandugtong ng Griyego.
- source_word: καὶ ὑμεῖς
  choice: kayo rin
  rationale: Pinananatili nito ang diin na dapat ding tumugon nang ganito ang mga taga-Corinto.
- source_word: ὑποτάσσησθε
  choice: magpasakop
  rationale: Ipinahihiwatig nito ang kusang pagpapailalim o pagbibigay-galang sa kaayusan, nang hindi dinaragdagan ang teksto ng di-tiyak na ganap na pagsunod.
- source_word: τοῖς τοιούτοις
  choice: sa mga taong tulad nila
  rationale: Tumutukoy ito sa uri ng mga taong gaya nina Estefanas na nagtalaga ng sarili sa paglilingkod, nang hindi nililimitahan ang parirala ayon sa kasarian.
- source_word: παντὶ τῷ συνεργοῦντι
  choice: sa bawat nakikiisa sa gawain
  rationale: Inihahayag nito ang pandiwang diwa ng pakikipagtulungan sa iba. Ang ‘sa gawain’ ay likas na pagpapahayag sa Filipino ng ipinahihiwatig na magkatuwang na gawain.
- source_word: καὶ κοπιῶντι
  choice: at nagpapagal
  rationale: Pinananatili ng ‘nagpapagal’ ang diwa ng masikap at nakapapagod na paggawa, sa marangal ngunit nauunawaang pananalita.
theological_decisions:
- issue: Uri at saklaw ng ipinag-uutos na pagpapasakop
  choice: Panawagan na kusang magpasakop sa mga kinikilalang manggagawang tulad ng mga nabanggit sa konteksto
  alternative: Malawak na utos ng hirarkikal o ganap na pagsunod
  rationale: Ang agarang konteksto ay tungkol sa sambahayan ni Estefanas at sa lahat ng nakikiisa at nagpapagal sa gawain. Pinananatili ng ‘magpasakop’ ang lakas ng salita nang hindi ipinapasok ang isang absolutong institusyonal na doktrina na hindi tahasang sinasabi rito.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang ‘magpasakop’ at ‘nagpapagal’ upang mapanatili ang bigat ng orihinal, habang ang ‘nakikiisa sa gawain’ ay mas likas kaysa sa literal na ‘gumagawang kasama.’
