  text: The grace of the Lord Jesus be with you.
translation:
  language: tl
  text: Sumainyo nawa ang biyaya ng Panginoong Jesus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάρις
  choice: biyaya
  rationale: Ang “biyaya” ang likas at kinikilalang katumbas sa modernong Tagalog para sa mapagpalang kagandahang-loob na tinutukoy ng karaniwang bendisyon ni Pablo.
- source_word: κύριος
  choice: Panginoon
  rationale: Pinananatili ng “Panginoon” ang karaniwang titulo sa Bagong Tipan at ang puwersang kristolohikal nito; hindi sapat ang “Guro” o “Amo” sa ganitong bendisyon.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Isinasalin sa kinagawiang anyo sa Tagalog ang personal na pangalang Ἰησοῦ.
- source_word: μεθ’ ὑμῶν
  choice: sumainyo nawa
  rationale: Literal itong “kasama ninyo,” ngunit walang hayag na pandiwa ang Griyego. Ang “sumainyo nawa” ay natural at marangal na pormula ng pagpapala sa Tagalog at malinaw na naghahayag ng ipinahihiwatig na hangarin.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: ng Panginoong Jesus
  rationale: Sinusundan nito ang genitibong kayarian ng Griyego at pinananatili ang tunay na saklaw nito—maaaring pag-aari o pinagmulan—nang hindi tahasang nililimitahan sa “mula sa.”
theological_decisions:
- issue: Walang hayag na pandiwa sa pormula ng bendisyon
  choice: Ihayag ang ipinahihiwatig na hangarin sa “sumainyo nawa.”
  alternative: “Ang biyaya ng Panginoong Jesus ay kasama ninyo.”
  rationale: Ang “nawa” ay angkop sa puwersa ng pangwakas na pagpapala at hindi ginagawang simpleng pahayag lamang ang verbless na pormulang Griyego.
- issue: Ugnayan ng genitibong τοῦ κυρίου Ἰησοῦ sa χάρις
  choice: “biyaya ng Panginoong Jesus”
  alternative: “biyayang mula sa Panginoong Jesus”
  rationale: Pinananatili ng “ng” ang kaluwagan ng orihinal na genitibo at hindi sapilitang nilulutas kung ito ay pangunahing pag-aari o pinagmulan.
translation_notes:
  register: Maikli, natural, at marangal na modernong Tagalog. Ginamit ang tradisyonal ngunit malinaw na bendisyong “sumainyo nawa,” na madaling maunawaan at angkop sa pangwakas na pagbati.
