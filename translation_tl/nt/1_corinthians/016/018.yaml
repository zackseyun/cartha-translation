- from: Sapagkat pinanariwa nila ang aking espiritu at ang sa inyo. Kaya pahalagahan ninyo ang ganitong mga lalaki.[a]
  to: Sapagkat nagbigay sila ng ginhawa sa aking espiritu at sa inyo. Kaya kilalanin ninyo ang mga lalaking tulad nila.[a]
  rationale: Inayos ang salin upang maging mas natural sa modernong Filipino Tagalog habang pinananatili ang metaporikal na ginhawang dulot sa “espiritu,” ang lohikal na ugnayan ng “Sapagkat ... Kaya,” at ang partikular na panlalaking sanggunian sa mga lalaking nabanggit sa naunang konteksto. Hindi pinalalawak ng salin ang kahulugan tungo sa pormal na pagpaparangal.
