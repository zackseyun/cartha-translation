base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/018.yaml
  text: For they refreshed my spirit and yours[a]. Therefore acknowledge such men.
translation:
  language: tl
  text: Sapagkat nagbigay sila ng ginhawa sa aking espiritu at sa inyo. Kaya kilalanin ninyo ang mga lalaking tulad nila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pahalagahan ninyo” o “bigyan ninyo ng nararapat na pagkilala” ang mga lalaking tulad nila. Ang pariralang Griyego ay nasa panlalaking anyo at dito ay tumutukoy sa mga lalaking kababanggit lamang.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέπαυσαν
  choice: pinanariwa
  rationale: 'Metaporikal dito ang ἀναπαύω: nagdulot sila ng ginhawa at panibagong lakas sa kalooban, hindi lamang ng literal na pahinga.'
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikita ng γάρ na ang pahayag ay dahilan ng naunang sinabi.
- source_word: πνεῦμα
  choice: espiritu
  rationale: Tumutukoy ito sa panloob na kalagayan ng tao, hindi sa Banal na Espiritu; pinananatili ng “espiritu” ang terminolohiya at pahiwatig ni Pablo.
- source_word: τὸ ἐμὸν πνεῦμα καὶ τὸ ὑμῶν
  choice: ang aking espiritu at ang sa inyo
  rationale: Pinananatili ang maikli at eliptikong ayos ng Griyego, habang malinaw na ang “ang sa inyo” ay tumutukoy rin sa espiritu.
- source_word: ἐπιγινώσκετε
  choice: pahalagahan ninyo
  rationale: Sa konteksto, higit ito sa pagkilala sa pagkakakilanlan; hinihimok ang mga taga-Corinto na kilalanin ang halaga at paglilingkod ng mga taong iyon, nang hindi pinalalakas hanggang sa pormal na “parangalan.”
- source_word: οὖν
  choice: Kaya
  rationale: Likas na ipinahahayag sa modernong Tagalog ang konklusyon o bunga ng naunang dahilan.
- source_word: τοὺς τοιούτους
  choice: ang ganitong mga lalaki
  rationale: Tumutukoy ito sa mga lalaking kababanggit lamang—sina Estefanas, Fortunato, at Acaico—kaya pinananatili ang tiyak na panlalaking reperensiya.
theological_decisions:
- issue: Kasarian sa τοὺς τοιούτους
  choice: ang ganitong mga lalaki
  alternative: ang ganitong mga tao / ang mga taong tulad nila
  rationale: Bagaman maaaring maging pangkalahatan ang parirala sa ibang konteksto, dito ay bumabalik ito sa tatlong lalaking pinangalanan sa agarang konteksto. Hindi ito ginagawang neutral sa kasarian.
- issue: Kahulugan ng πνεῦμα
  choice: espiritu bilang panloob na kalagayan ng tao
  alternative: Banal na Espiritu / kalooban
  rationale: Ang pagmamay-aring “aking” at “sa inyo” ay nagpapakitang espiritu o panloob na pagkatao ng mga tao ang tinutukoy, hindi ang Banal na Espiritu; gayunman, pinananatili ang salitang “espiritu” upang huwag lubusang ipaliwanag ang metapora.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “pinanariwa” upang maipahayag ang panloob na ginhawa at pagpapanibagong-lakas, at ang “pahalagahan” upang ihatid ang nararapat na pagkilala sa kanilang ginawa.
