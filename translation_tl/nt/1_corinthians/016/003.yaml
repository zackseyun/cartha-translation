  text: And when I arrive[b][a], I will send with letters those whom you approve to carry your gift to Jerusalem.
translation:
  language: tl
  text: At kapag dumating ako, isusugo ko, kasama ng mga sulat, ang mga taong inyong sasang-ayunan upang dalhin sa Jerusalem ang inyong kaloob.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang inyong kaloob na bunga ng kagandahang-loob.” Ang salitang Griyego ay maaari ring mangahulugang “biyaya,” ngunit dito ay tumutukoy ito sa ambag na ipadadala sa Jerusalem.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring ayusin ang pagkakasunod: “At kapag dumating ako, ang mga taong inyong sasang-ayunan ay isusugo ko, kasama ng mga sulat, upang dalhin sa Jerusalem ang inyong kaloob.”'
    reason: syntactic_alternative
lexical_decisions:
- source_word: ὅταν δὲ παραγένωμαι
  choice: At pagdating ko
  rationale: Ipinahihiwatig ng ὅταν kasama ng aorist subjunctive ang isang pangyayari sa hinaharap. Banayad na pang-ugnay ang δέ, kaya natural itong isinalin na “At.”
- source_word: οὓς ἐὰν δοκιμάσητε
  choice: ang mga taong inyong sasang-ayunan
  rationale: Sa konteksto ng pagpili ng mga kinatawan, ang δοκιμάζω ay tumutukoy sa pagsusuri at pagsang-ayon. Ang “sasang-ayunan” ay malinaw at natural, habang nananatiling pahiwatig ang naunang pagsusuri.
- source_word: δι’ ἐπιστολῶν
  choice: na may dalang mga sulat
  rationale: Ang διά na may genitive ay maaaring magpahayag ng paraan o kasangkapan. Ipinakikita rito na ang mga isusugo ay sasamahan ng mga sulat, nang hindi ipinapalagay na tahasang tinawag ang mga iyon na mga sulat ng rekomendasyon.
- source_word: τούτους πέμψω
  choice: isusugo ko ... ang mga taong iyon
  rationale: Muling tinutukoy at binibigyang-diin ng τούτους ang mga taong sinang-ayunan. Sa natural na Tagalog, naipahahayag ito sa tahasang layon ng “isusugo ko.”
- source_word: ἀπενεγκεῖν
  choice: upang ihatid
  rationale: 'Nagsasaad ng layunin ang infinitive: isusugo ang mga kinatawan upang dalhin at maihatid ang ambag sa destinasyon nito.'
- source_word: τὴν χάριν ὑμῶν
  choice: ang inyong kaloob
  rationale: Sa konteksto ng pangongolekta para sa mga banal, ang χάρις ay tumutukoy sa konkretong ambag o kaloob. Pinananatili sa talababa ang kaugnay na diwa ng biyaya o kagandahang-loob.
- source_word: εἰς Ἰερουσαλήμ
  choice: sa Jerusalem
  rationale: Natural na salin sa Tagalog ng εἰς kasama ng pangalan ng lungsod ang “sa Jerusalem” kapag destinasyon ang tinutukoy.
theological_decisions:
- issue: Kahulugan ng χάρις sa konteksto ng pangongolekta
  choice: Konkretong kaloob o ambag para sa mga mananampalataya sa Jerusalem
  alternative: Biyaya sa abstraktong diwa, o gawang bunga ng kagandahang-loob
  rationale: Ang agarang konteksto ng 1 Corinto 16 ay ang pangongolekta para sa mga banal. Kaya tumutukoy ang χάρις sa aktuwal na kaloob, bagaman taglay pa rin nito ang pahiwatig ng bukal-sa-loob na pagbibigay.
translation_notes:
  register: Makabagong Filipino Tagalog na magalang at malinaw. Ginamit ang “isusugo” para sa pormal ngunit karaniwang biblikal na diwa ng pagpapadala bilang kinatawan; iniwasan ang mas interpretibong “mga sulat ng rekomendasyon.”
