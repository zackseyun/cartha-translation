base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/006.yaml
  text: and perhaps I will stay with you[a], or even spend the winter, so that you may send me on my way wherever I may go.
translation:
  language: tl
  text: At marahil ay mananatili ako sa inyo, o magpapalipas pa nga ng taglamig diyan, upang maihatid ninyo ako sa aking paglalakbay[a] saanman ako pumunta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tulungan ninyo akong magpatuloy sa aking paglalakbay.” Maaaring kabilang sa pandiwang Griego ang pagsama sa isang manlalakbay o pagbibigay ng kailangan niya sa kanyang pag-alis at pagpapatuloy.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ὑμᾶς
  choice: sa inyo
  rationale: Kasama ng pandiwang nangangahulugang manatili, likas itong tumutukoy sa pananatiling kapiling ng mga taga-Corinto; natural sa Tagalog ang “mananatili ako sa inyo.”
- source_word: δὲ
  choice: At
  rationale: Mahinang pang-ugnay ito na nagpapatuloy sa paglalahad ng mga plano ni Pablo, hindi matinding pagsalungat.
- source_word: τυχὸν
  choice: marahil
  rationale: Ipinahahayag nito ang posibilidad o pagiging di-tiyak ng plano.
- source_word: παραμενῶ
  choice: mananatili ako
  rationale: Tumpak at natural na salin sa konteksto ng pansamantalang pananatili habang naglalakbay.
- source_word: ἢ καὶ παραχειμάσω
  choice: o magpapalipas pa nga ng taglamig diyan
  rationale: Ipinakikita ng “pa nga” ang pinaigting na ikalawang posibilidad, at ang pandiwa ay tiyak na tumutukoy sa pagpapalipas ng taglamig sa isang lugar.
- source_word: ἵνα
  choice: upang
  rationale: Malinaw nitong pinananatili ang layuning ipinahahayag ng sugnay.
- source_word: προπέμψητε
  choice: matulungan ninyo ako sa pagpapatuloy ng aking paglalakbay
  rationale: Sa konteksto ng paglalakbay, maaaring saklaw ng pandiwa ang paghahatid, pagsama, o pagbibigay ng kailangan sa manlalakbay; hindi nito labis na nililimitahan ang uri ng tulong.
- source_word: οὗ ἐὰν πορεύωμαι
  choice: saanman ako pumaroon
  rationale: Pinananatili nito ang di-tiyak at nakasalalay pang patutunguhan.
