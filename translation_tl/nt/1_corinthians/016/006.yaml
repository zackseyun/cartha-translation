translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “diyan” upang malinaw na iugnay ang pagpapalipas ng taglamig sa lugar ng mga kausap. Ang “pumaroon” ay bahagyang pormal ngunit malinaw at angkop sa dignidad ng tekstong biblikal.
