  yaml_path: translation/nt/1_corinthians/016/008.yaml
  text: But I will stay in Ephesus until Pentecost[a].
translation:
  language: tl
  text: Ngunit mananatili ako sa Efeso hanggang Pentecostes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mananatili ako sa Efeso hanggang sa Pista ng mga Linggo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιμενῶ
  choice: mananatili ako
  rationale: Ang panghinaharap na anyo ng ἐπιμένω ay tumutukoy rito sa patuloy na pananatili ni Pablo sa isang lugar ayon sa kaniyang plano sa paglalakbay. Likas at malinaw sa modernong Tagalog ang “mananatili ako.”
- source_word: δὲ
  choice: Ngunit
  rationale: Nagpapahiwatig ang δέ ng banayad na pagsalungat o paglipat mula sa naunang pagtalakay sa paglalakbay; naipapakita ito ng “Ngunit” nang hindi labis na pinatitingkad ang pagsalungat.
- source_word: ἐν Ἐφέσῳ
  choice: sa Efeso
  rationale: Tuwirang lokatibo ang ἐν na may datibo. “Efeso” ang kinagawiang anyo ng pangalan ng lungsod sa Tagalog.
- source_word: ἕως τῆς πεντηκοστῆς
  choice: hanggang Pentecostes
  rationale: Ang ἕως na may henitibo ay nagsasaad ng hangganan ng panahon. “Pentecostes” ang kinagawiang katawagan sa Tagalog para sa πεντηκοστή, habang inilalahad sa talababa ang kaugnay na pangalang “Pista ng mga Linggo.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Pinanatili ang maikling anyo at banayad na pagsalungat ng Griyego; ginamit ang nakaugaliang pangalang “Pentecostes,” na may alternatibong katawagan sa talababa.
