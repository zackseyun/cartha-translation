translation:
  language: tl
  text: Binabati kayo ng lahat ng mga kapatid.[a] Batiin ninyo ang isa't isa ng banal na halik.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego na isinaling “mga kapatid” ay nasa anyong panlalaking maramihan, ngunit maaari itong tumukoy nang kolektibo sa mga kapwa mananampalataya, kabilang ang mga lalaki at babae.
    reason: lexical_alternative
  - marker: b
    text: Ang “banal na halik” ay isang kinaugaliang pagbati ng mga mananampalataya na nagpapahayag ng banal at mutwal na pakikisama.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσπάζονται
  choice: Binabati
  rationale: Sa konteksto ng liham, tumutukoy ang pandiwa sa pagpaparating ng pagbati. Natural at maikli sa Filipino ang “binabati,” at pinananatili nito ang kaugnayan sa kasunod na utos.
- source_word: οἱ ἀδελφοὶ πάντες
  choice: lahat ng kapatid
  rationale: Ang “kapatid” ang likas na salin ng ἀδελφοί sa Filipino at maaari ring tumukoy sa mga kapwa mananampalataya anuman ang kasarian. Hindi na kailangang dagdagan ang teksto upang maipakita ang posibleng kolektibong saklaw nito.
- source_word: ἀσπάσασθε
  choice: Batiin
  rationale: Tuwirang pautos ang anyo ng Griyego. Ang “Batiin” ay malinaw, natural, at katugma ng salin sa unang pangungusap.
- source_word: ἀλλήλους
  choice: ang isa't isa
  rationale: Karaniwang katumbas ito ng panghalip na nagpapahayag ng gantihang kilos at tahasang pinananatili ang ugnayang mutual sa utos.
- source_word: ἐν φιλήματι ἁγίῳ
  choice: ng banal na halik
  rationale: Natural sa Filipino ang konstruksyong “batiin … ng … halik” upang ipahayag ang paraan ng pagbati. Pinananatili ng “banal” ang natatanging katangian ng halik bilang kilos sa banal na pakikisama ng mga mananampalataya.
theological_decisions:
- issue: Saklaw ng ἀδελφοί sa kongregasyon
  choice: kapatid
  alternative: mga kapatid na lalaki; mga kapatid na lalaki at babae; mga kapwa mananampalataya
  rationale: Bagaman panlalaking maramihan ang anyong Griyego, maaari itong gamitin nang kolektibo para sa mga kapwa mananampalataya. Ang Filipino na “kapatid” ay likas na hindi tumutukoy sa isang kasarian lamang at pinananatili ang saklaw ng orihinal nang hindi ito nilulutas nang labis.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kapatid” dahil ito ang karaniwang katawagan sa kapwa mananampalataya at likas nitong napapanatili ang posibleng kolektibong kahulugan ng Griyego. Inilagay ang mga talababa sa mismong pariralang tinatalakay ng bawat isa.
