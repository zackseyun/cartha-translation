  text: But I will come to you when I have gone through Macedonia[a], for I am going through Macedonia.
translation:
  language: tl
  text: Ngunit pupunta ako sa inyo kapag nakadaan na ako sa Macedonia[a], sapagkat dadaan ako sa Macedonia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “kapag dumaan ako sa Macedonia.” Maaaring mas payak na isalin ang aorist subjunctive sa Griyego, ngunit ipinahihiwatig ng “kapag nakadaan na ako” na matatapos muna ang pagdaan ni Pablo sa Macedonia bago siya pumunta sa kanila.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐλεύσομαι
  choice: pupunta ako
  rationale: Ang panghinaharap na anyo ng ἔρχομαι ay nagpapahayag ng balak ni Pablo na maglakbay patungo sa mga taga-Corinto. Mas natural sa Tagalog ang “pupunta ako sa inyo” kaysa “darating ako sa inyo” sa ganitong pahayag ng plano.
- source_word: δὲ
  choice: Ngunit
  rationale: Nagpapahiwatig ito ng banayad na paglipat o pagsalungat kaugnay ng naunang plano sa paglalakbay; ang “Ngunit” ay angkop nang hindi nagpapahiwatig ng matinding pagsalungat.
- source_word: πρὸς ὑμᾶς
  choice: sa inyo
  rationale: Ang πρός na may accusative kasunod ng pandiwa ng pagkilos ay tumutukoy sa pagpunta sa kinaroroonan ng mga tao; likas sa Tagalog ang “sa inyo.”
- source_word: ὅταν
  choice: kapag
  rationale: Kasama ng aorist subjunctive, tumutukoy ito sa isang inaasahang pangyayari sa hinaharap. Ang “kapag” ay natural at nananatiling may bahagyang di-tiyak na katangian.
- source_word: Μακεδονίαν
  choice: Macedonia
  rationale: Karaniwang transliterasyon sa Filipino ng pangalan ng lalawigang Romano.
- source_word: διέλθω
  choice: nalampasan ko na
  rationale: Ang aorist subjunctive sa ilalim ng ὅταν ay tumutukoy sa pagdaan na mauuna at matatapos bago ang pagdalaw ni Pablo. Naipakikita ng “nalampasan ko na” ang pagkakumpleto, samantalang ang talababa ay nagbibigay ng mas payak na alternatibo.
- source_word: γὰρ
  choice: sapagkat
  rationale: Ipinapaliwanag nito kung bakit pagkatapos ng Macedonia ang pagdalaw; malinaw at marangal na panandang sanhi ang “sapagkat.”
- source_word: διέρχομαι
  choice: daraan ako
  rationale: Bagaman present indicative ang anyong Griyego, sa konteksto ay inilalahad nito ang nakatakdang ruta ni Pablo. Ang panghinaharap na “daraan ako” ang natural na katumbas sa Tagalog at pinananatili ang kaibahan nito sa natapos nang pagdaan sa naunang sugnay.
