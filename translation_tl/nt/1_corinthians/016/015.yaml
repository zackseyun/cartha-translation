  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί· οἴδατε τὴν οἰκίαν Στεφανᾶ, ὅτι ἐστὶν ἀπαρχὴ τῆς Ἀχαΐας καὶ εἰς διακονίαν τοῖς ἁγίοις ἔταξαν ἑαυτούς·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/015.yaml
  text: 'I urge you[a], brothers: you know the household of Stephanas, that they are the firstfruits of Achaia[b], and they devoted themselves to the service of the saints.'
translation:
  language: tl
  text: Hinihimok ko kayo, mga kapatid:[a] kilala ninyo ang sambahayan ni Estefanas, na siyang unang bunga ng Acaya,[b] at itinalaga nila ang kanilang sarili sa paglilingkod sa mga banal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay literal na “mga kapatid na lalaki,” ngunit karaniwang ginagamit bilang tawag na maaaring sumaklaw sa buong kongregasyon, kabilang ang mga babae.
    reason: lexical_alternative
  - marker: b
    text: Ang “unang bunga” ay malamang na tumutukoy sa ilan sa mga pinakaunang sumampalataya sa Acaya, habang pinananatili rin ang larawan ng unang bahaging ibinukod para sa Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: Hinihimok ko
  rationale: Ipinahahayag nito ang taimtim at mariing pakiusap ni Pablo nang hindi nagiging labis na pormal o mapag-utos.
- source_word: δὲ
  choice: hindi hiwalay na isinalin
  rationale: Banayad na panandang pantransisyon ito; sapat nang ipinahihiwatig ng pagsisimula ng bagong pakiusap, at ang “ngayon” ay maaaring maling unawaing panahunan.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Natural itong tawag sa buong kongregasyon sa Filipino at maaari itong tumukoy kapwa sa mga lalaki at babae, habang nananatiling malapit sa larawang pampamilya ng Griyego.
- source_word: οἴδατε
  choice: kilala ninyo
  rationale: Ang sambahayan ang layon, kaya mas natural sa Filipino ang “kilala ninyo” kaysa “alam ninyo.”
- source_word: οἰκίαν Στεφανᾶ
  choice: ang sambahayan ni Estefanas
  rationale: Sinasaklaw ng “sambahayan” ang pamilya at iba pang kabilang sa tahanan, hindi lamang ang gusali o mga kadugong kamag-anak.
- source_word: ἀπαρχὴ τῆς Ἀχαΐας
  choice: mga unang bunga sa Acaya
  rationale: Pinananatili ng “unang bunga” ang metapora ng ἀπαρχή at ang maaaring pahiwatig ng unang bahaging inihandog sa Diyos; ang “sa Acaya” ay natural na nagpapahayag na sila ang unang bunga mula sa rehiyong iyon.
- source_word: εἰς διακονίαν τοῖς ἁγίοις
  choice: sa paglilingkod sa mga banal
  rationale: Malinaw at likas itong Filipino para sa paglilingkod na nakatuon sa kapakanan ng mga mananampalataya, nang hindi ipinapalagay ang isang pormal na katungkulan sa iglesia.
- source_word: ἔταξαν ἑαυτούς
  choice: itinalaga nila ang kanilang sarili
  rationale: Ipinakikita nito ang sinadya at patuloy na pag-uukol nila ng sarili sa gawaing paglilingkod, hindi isang opisyal na paghirang.
theological_decisions:
- issue: Saklaw ng ἀδελφοί sa pagtawag sa kongregasyon
  choice: mga kapatid
  alternative: mga kapatid na lalaki
  rationale: Bagaman panlalaki ang anyong Griyego, karaniwan itong tawag sa buong kongregasyon. Ang “mga kapatid” sa Filipino ay likas na maaaring maging inklusibo nang hindi dinaragdagan ang pangunahing teksto.
- issue: Metapora ng ἀπαρχή
  choice: mga unang bunga sa Acaya
  alternative: mga unang sumampalataya sa Acaya
  rationale: Pinananatili ang metapora at ang posibleng pahiwatig ng pagkakatalaga sa Diyos sa halip na paliitin ito sa kronolohikal na kahulugan lamang.
- issue: Kolektibong pagtukoy sa sambahayan ni Estefanas
  choice: Sila
  alternative: Ito
  rationale: Ang οἰκία ay isahan sa gramatika ngunit tumutukoy sa mga taong bumubuo sa sambahayan; ang kasunod na ἑαυτούς ay tahasang maramihan. Kaya ang “Sila” ang natural at tumpak na pagtukoy sa Filipino.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “hinihimok,” “sambahayan,” at “paglilingkod” upang mapanatili ang taimtim na tono at mga ugnayang panlipunan sa teksto nang hindi maging makaluma. Ang “mga banal” ay pinanatili bilang makabuluhang katawagang Paulino para sa mga mananampalataya.
