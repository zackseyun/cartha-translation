  text: οὐ θέλω γὰρ ὑμᾶς ἄρτι ἐν παρόδῳ ἰδεῖν, ἐλπίζω ⸀γὰρ χρόνον τινὰ ἐπιμεῖναι πρὸς ὑμᾶς, ἐὰν ὁ κύριος ⸀ἐπιτρέψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/007.yaml
  text: For I do not want to see you now in passing[a], for I hope to remain with you for some time, if the Lord permits.
translation:
  language: tl
  text: Sapagkat ayaw ko kayong makita ngayon habang nagdaraan lamang ako[a], dahil umaasa akong manatili sa piling ninyo nang ilang panahon, kung ipahihintulot ng Panginoon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa pagdaan ko” o “habang nasa daan ako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ θέλω
  choice: ayaw ko
  rationale: Likas at tuwirang ipinapahayag nito ang personal na hangarin o intensiyon ni Pablo, nang hindi ito ginagawang labis na pormal.
- source_word: ἄρτι
  choice: ngayon
  rationale: Tumutukoy ito sa kasalukuyang panahon o kalagayan at natural na naipapahayag sa modernong Tagalog bilang “ngayon.”
- source_word: ἐν παρόδῳ
  choice: habang nagdaraan lamang ako
  rationale: Ipinahihiwatig ng parirala ang isang maikling pagdalaw habang nasa paglalakbay. Nilinaw ang paksa bilang “ako” upang maiwasan ang maling pakahulugang ang mga taga-Corinto ang nagdaraan.
- source_word: ἰδεῖν
  choice: makita
  rationale: Pinananatili nito ang literal na diwa ng “makita,” bagaman sa konteksto ay kasama rito ang pagdalaw.
- source_word: ἐλπίζω
  choice: umaasa ako
  rationale: Ipinapahayag nito ang inaasahan at ninanais ni Pablo nang walang katiyakan.
- source_word: χρόνον τινά
  choice: nang ilang panahon
  rationale: Nagsasaad ito ng di-tiyak ngunit makabuluhang haba ng panahon.
- source_word: ἐπιμεῖναι
  choice: manatili
  rationale: Tapat nitong ipinapahayag ang patuloy na pananatili ni Pablo sa piling nila.
- source_word: πρὸς ὑμᾶς
  choice: sa inyo
  rationale: Sa konteksto ng pananatili, natural itong tumutukoy sa pananatiling kasama o kapiling nila.
- source_word: ἐὰν ὁ κύριος ἐπιτρέψῃ
  choice: kung ipahihintulot ng Panginoon
  rationale: Pinananatili nito ang kondisyon at ang pagkilala na nakasalalay sa pahintulot ng Panginoon ang plano ni Pablo.
- source_word: κύριος
  choice: Panginoon
  rationale: Karaniwang salin ito ng κύριος at hindi nito tinutukoy nang higit sa sinabi ng teksto kung ang tahasang tinutukoy ay si Jesus o ang Diyos Ama.
theological_decisions:
- issue: Ang tinutukoy ng “Panginoon”
  choice: Panginoon
  alternative: Panginoong Jesus; Diyos
  rationale: Walang tahasang pantukoy ang Griyego bukod sa κύριος, kaya pinananatili ng salin ang pagiging bukas ng tinutukoy sa halip na magdagdag ng pagkakakilanlang hindi binanggit sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “habang nagdaraan lamang ako” upang maging malinaw ang panandaliang katangian ng balak na pagdalaw at upang hindi mapagkamalang ang mga kausap ang siyang nagdaraan.
