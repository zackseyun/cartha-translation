  to: Sapagkat ayaw ko kayong makita ngayon habang nagdaraan lamang ako[a], dahil umaasa akong manatili sa piling ninyo nang ilang panahon, kung ipahihintulot ng Panginoon.
  rationale: Pinalitan ang “sa inyo” ng “sa piling ninyo” upang maipahayag sa natural na Tagalog ang pananatili ni Pablo kasama ng kaniyang mga mambabasa, nang hindi dinaragdagan o binabago ang kahulugan ng Griyego. Napanatili ang lahat ng ibang kahulugan at ang footnote anchor.
