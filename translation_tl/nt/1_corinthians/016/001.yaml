  verdict: revise
  source_fidelity: 'Ang diwa ng salin ay wasto: ang λογεία ay isang paglikom/kontribusyon para sa mga ἅγιοι, at ang mga taga-Corinto ay inuutusang kumilos ayon sa tagubiling ibinigay sa mga iglesya sa Galacia. Gayunman, mas malinaw na ipakita ang estrukturang paghahambing ng Griyego (ὥσπερ ... οὕτως) kaysa sa kasalukuyang ayos na “gawin ... ang iniutos ko.”'
  naturalness: Ang “ambagan” ay nauunawaan ngunit mas kolokyal at maaaring magpahiwatig ng halagang inaambag ng bawat isa, sa halip na ng organisadong koleksiyon. Ang “koleksiyon” at ang konstruksiyong “kung paano ... gayon din” ay mas malinaw at angkop sa marangal na modernong Filipino.
  terminology: Pinananatili ang “mga banal” para sa ἅγιοι at “mga iglesya” para sa ἐκκλησίαις. Ang “tinagubilinan” ay tumpak para sa awtoritatibong διέταξα nang hindi mas matindi kaysa kailangan ang dating ng “iniutos.”
  issues:
