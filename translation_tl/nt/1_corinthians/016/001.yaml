  - severity: low
    issue: Hindi tuwirang naipapakita ang paghahambing na “kung paano ... gayon din.”
    rationale: Ang kasalukuyang pangungusap ay hindi mali, ngunit ang hayag na paralelismo ay mas malapit sa ὥσπερ ... οὕτως καὶ at mas madaling basahin.
  revised_text: 'Tungkol naman sa koleksiyon para sa mga banal[a]: kung paano ko tinagubilinan ang mga iglesya sa Galacia, gayon din ang gawin ninyo.'
