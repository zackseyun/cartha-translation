  text: Περὶ δὲ τῆς λογείας τῆς εἰς τοὺς ἁγίους, ὥσπερ διέταξα ταῖς ἐκκλησίαις τῆς Γαλατίας, οὕτως καὶ ὑμεῖς ποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/001.yaml
  text: Concerning the collection for the saints[a], as I directed the churches of Galatia, so you also are to do.
translation:
  language: tl
  text: 'Tungkol naman sa koleksiyon para sa mga banal[a]: kung paano ko tinagubilinan ang mga iglesya sa Galacia, gayon din ang gawin ninyo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “para sa bayan ng Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Tungkol naman sa
  rationale: Likas na panandang Filipino sa paglipat sa isang bagong paksa; pinananatili ng “naman” ang puwersang pandiskurso ng δέ nang hindi nagdaragdag ng temporal na “ngayon.”
- source_word: λογείας
  choice: ambagan
  rationale: Tumutukoy ito sa paglikom ng salapi. Ang “ambagan” ay natural sa makabagong Filipino at hindi ito labis na tinutukoy bilang rituwal na handog.
- source_word: τῆς εἰς τοὺς ἁγίους
  choice: para sa mga banal
  rationale: Malinaw na ipinapakita ang mga makikinabang sa ambagan at pinananatili ang karaniwang katawagan ni Pablo sa mga mananampalataya.
- source_word: διέταξα
  choice: iniutos ko
  rationale: Ipinahahayag ang awtoritatibong tagubilin ng διατάσσω. Sa kontekstong ito, natural at tuwiran ang “iniutos” nang hindi nagdaragdag ng kalupitan.
- source_word: ἐκκλησίαις
  choice: mga iglesya
  rationale: Karaniwan at tumpak na katawagan sa Filipino para sa mga lokal na kongregasyong Kristiyano.
- source_word: Γαλατίας
  choice: Galacia
  rationale: Itinatag na anyong Filipino ng pangalang heograpiko.
- source_word: οὕτως καὶ ὑμεῖς ποιήσατε
  choice: gawin din ninyo
  rationale: 'Pinananatili ang puwersa ng pautos at ang paghahambing: ang mga taga-Corinto ay dapat kumilos ayon sa gayunding tagubilin.'
theological_decisions:
- issue: Pagpapakahulugan sa ἅγιοι sa konteksto ng tulong-pinansyal
  choice: mga banal
  alternative: mga hinirang ng Diyos / mga mananampalataya
  rationale: Pinananatili ng “mga banal” ang mahalagang katawagang teolohikal ni Pablo para sa mga kabilang sa bayan ng Diyos, nang hindi ito nililimitahan sa mga taong pormal na kinanonisa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ambagan” bilang pangkaraniwang salitang tumutukoy sa sama-samang paglikom ng salapi, at “mga banal” upang mapanatili ang terminolohiyang Paulino. Ang lahat ng pananda ng talababa ay nasa pangunahing teksto.
