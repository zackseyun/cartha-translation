base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/010.yaml
  text: If Timothy comes[a], see that he may be with you without fear, for he is doing the Lord’s work[b], as I also am.
translation:
  language: tl
  text: Kung dumating si Timoteo, tiyakin ninyong malaya siya sa takot habang kasama ninyo, sapagkat ginagawa niya ang gawain ng Panginoon, gaya ko rin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐὰν δὲ
  choice: Kung
  rationale: Likas na ipinapahayag ang kondisyon; hindi kailangang gawing tahasang panalungat ang mahinang pang-ugnay na δέ sa kontekstong ito.
- source_word: ἔλθῃ Τιμόθεος
  choice: dumating si Timoteo
  rationale: Ang aorist subjunctive kasunod ng ἐάν ay tumutukoy sa isang posibleng pagdating sa hinaharap; natural dito ang “dumating.”
- source_word: βλέπετε ἵνα
  choice: tiyakin ninyong
  rationale: Ipinahahayag ang utos na aktibong pangalagaan o siguraduhin ang kalagayang kasunod.
- source_word: ἀφόβως γένηται πρὸς ὑμᾶς
  choice: makapiling ninyo siya nang walang takot
  rationale: Pinananatili ang diwa ng presensiya ni Timoteo sa piling nila at ang kalagayang malaya sa takot, nang hindi ito nililimitahan sa pansariling damdaming ligtas lamang.
- source_word: τὸ ἔργον κυρίου ἐργάζεται
  choice: ginagawa niya ang gawain ng Panginoon
  rationale: Pinananatili ang pag-uulit ng magkaugnay na pangngalan at pandiwa sa Griyego at ang nagpapatuloy na gawain.
- source_word: ὡς κἀγώ
  choice: gaya ko rin
  rationale: Likas na pinananatili ang elipsis ng Griyego at ang diwang ginagawa rin ni Pablo ang gayong gawain.
theological_decisions:
- issue: Tinutukoy ng κυρίου
  choice: Panginoon
  alternative: tahasang “Panginoong Jesus”
  rationale: Bagaman malamang na si Jesus ang tinutukoy sa gamit ni Pablo, “Panginoon” lamang ang nasa Griyego; hindi dinaragdagan ng salin ang pagkakakilanlan.
translation_notes:
  register: Makabagong Filipino na malinaw, marangal, at natural. Ginamit ang maramihang “ninyo/ninyong” para sa plural na ὑμᾶς at sa utos na βλέπετε.
