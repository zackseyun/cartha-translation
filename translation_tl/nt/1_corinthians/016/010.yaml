  source_fidelity: 'Ang pangunahing diwa ay tapat sa Griyego: isang kondisyonal na pagdating ni Timoteo, utos sa mga taga-Corinto na tiyaking wala siyang takot sa piling nila, at ang dahilan na ginagawa niya ang gawain ng Panginoon gaya rin ni Pablo. Gayunman, ang “makapiling ninyo siya” ay mas madaling mangahulugang samahan o makasama ninyo siya, at hindi nito gaanong malinaw na naihahayag ang kalagayan ni Timoteo na ἀφόβως.'
