  text: εἴ τις οὐ φιλεῖ τὸν ⸀κύριον, ἤτω ἀνάθεμα. ⸂Μαράνα θά⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/022.yaml
  text: If anyone does not love the Lord[a], let him be accursed[b]. Marana tha.
translation:
  language: tl
  text: Kung ang sinuman ay hindi nagmamahal sa Panginoon, mapasailalim siya sa sumpa.[a] Marana tha.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O ayon sa tradisyonal na katawagan, “maging anatema siya”; ibig sabihin, mapasailalim sa sumpa.
    reason: lexical_alternative
  - marker: b
    text: Aramaiko. Maaaring ibig sabihin, “Panginoon namin, pumarito ka!” o “Dumating na ang Panginoon namin.”
    reason: alternative_reading
lexical_decisions:
- source_word: φιλεῖ
  choice: nagmamahal
  rationale: Ang φιλέω rito ay tumutukoy sa personal na pag-ibig o pagmamahal sa Panginoon. Ang “nagmamahal” ang pinakanatural sa makabagong Tagalog at hindi labis na nililimitahan ang diwa sa pagkakaibigan o damdamin lamang.
- source_word: κύριον
  choice: Panginoon
  rationale: Sa kontekstong Paulino, tumutukoy ito kay Jesus bilang “Panginoon,” kaya pinananatili ang kinikilalang titulo at bigat nitong kristolohikal.
- source_word: ἤτω
  choice: mapasailalim siya
  rationale: Ang kasalukuyang pautos ng εἰμί ay may diwang jussive. Ang pariralang ito ay natural na naghahayag ng mariing hatol nang hindi ipinahihiwatig na ang mga mambabasa mismo ang magsasagawa ng pagsumpa.
- source_word: ἀνάθεμα
  choice: sa sumpa
  rationale: Ang ἀνάθεμα ay tumutukoy sa pagiging nasa ilalim ng sumpa o nakatalaga sa kapahamakan. Malinaw at kasalukuyang Tagalog ang “mapasailalim sa sumpa,” habang pinananatili sa talababa ang tradisyonal na katawagang “anatema.”
- source_word: Μαράνα θά
  choice: Marana tha
  rationale: Isa itong pahayag na Aramaiko na napanatili sa mga titik Griyego. Dahil pinagtatalunan ang eksaktong paghahati at kahulugan nito, pinananatili ang transliterasyon sa pangunahing teksto at inilalahad sa talababa ang dalawang pangunahing pagpapakahulugan.
theological_decisions:
- issue: Kahulugan ng Aramaikong pahayag na Μαράνα θά
  choice: 'Panatilihin bilang transliterasyon sa pangunahing teksto: “Marana tha.”'
  alternative: “Panginoon namin, pumarito ka!” o “Dumating na ang Panginoon namin.”
  rationale: Matatag ang anyo ng parirala sa teksto, ngunit tunay na malabo ang kahulugan dahil nakasalalay ito sa paghahati at pag-unawa sa Aramaiko. Ang transliterasyon ay nagpapanatili sa katangiang liturhikal at padamdam nito nang hindi agad nilulutas ang hindi tiyak.
- issue: Lakas ng hatol sa ἀνάθεμα
  choice: “mapasailalim siya sa sumpa”
  alternative: “sumpain siya” o tradisyonal na “maging anatema siya”
  rationale: Pinananatili ng salin ang solemneng bigat ng hatol at ang diwang jussive, ngunit iniiwasan ang di-natural o di-gaanong nauunawaang katawagang teknikal sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nagmamahal” sa halip na mas pampanitikang “umiibig,” at pinanatili ang “Marana tha” upang hindi pagpasiyahan ang tunay na kalabuan ng Aramaikong parirala. Ang mga pananda ng talababa ay ikinabit sa mismong mga salitang tinatalakay.
