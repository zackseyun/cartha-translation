id: 1CO.16.9
reference: 1 Corinthians 16:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: θύρα γάρ μοι ἀνέῳγεν μεγάλη καὶ ἐνεργής, καὶ ἀντικείμενοι πολλοί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/009.yaml
  text: For a great and effective door has opened to me[a], and there are many opponents.
translation:
  language: tl
  text: Sapagkat isang malaki at mabungang pinto ang nabuksan para sa akin[a], at marami ang sumasalungat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang malaki at mabungang pagkakataon ang nabuksan para sa akin.” Ginagamit ni Pablo ang “pinto” bilang talinghaga para sa isang bukás na pagkakataon sa paglilingkod.
    reason: lexical_alternative
lexical_decisions:
- source_word: θύρα
  choice: pinto
  rationale: Pinananatili ang literal na larawan ng ‘pinto,’ na ginagamit dito bilang talinghaga para sa bukás na pagkakataon sa paglilingkod.
- source_word: γάρ
  choice: sapagkat
  rationale: Nagbibigay ito ng dahilan para sa naunang sinabi ni Pablo tungkol sa kaniyang mga plano; ang ‘sapagkat’ ay malinaw at marangal sa modernong Tagalog.
- source_word: μοι
  choice: para sa akin
  rationale: Likas sa Tagalog ang ‘nabuksan para sa akin’ at ipinahahayag ang personal na pakinabang o kaugnayan nang hindi labis na tinutukoy ang ahensiya.
- source_word: ἀνέῳγεν
  choice: nabuksan
  rationale: Ipinahihiwatig ng anyong perpekto ang kasalukuyang kalagayang bunga ng pagkakabukas; likas na naihahatid ito ng ‘nabuksan’ sa konteksto.
- source_word: μεγάλη
  choice: malaki
  rationale: Pinananatili nito ang paglalarawan sa pinto at maaaring tumukoy kapuwa sa lawak at kahalagahan ng pagkakataon.
- source_word: ἐνεργής
  choice: mabunga
  rationale: Sa konteksto ng paglilingkod, ipinahihiwatig nito na ang bukás na pinto ay aktibo at may nagagawang resulta; mas natural ang ‘mabunga’ kaysa sa literal ngunit alanganing ‘epektibong pinto.’
- source_word: ἀντικείμενοι
  choice: ang sumasalungat
  rationale: Ang substantibong participle ay tumutukoy sa mga taong aktibong kumakalaban; malinaw ito nang hindi dinaragdagan ang tindi ng pananalita.
- source_word: πολλοί
  choice: marami
  rationale: Tuwirang katumbas at natural sa modernong Tagalog.
theological_decisions:
- issue: Ang ‘pinto’ bilang talinghaga para sa pagkakataon sa paglilingkod
  choice: Panatilihin ang talinghagang ‘pinto.’
  alternative: Isalin nang tuwiran bilang ‘isang malaki at mabungang pagkakataon ang nabuksan para sa akin.’
  rationale: Ang Griyego ay sadyang gumagamit ng larawan ng pinto. Ang pagpapanatili rito ay nangangalaga sa imahen at hindi tahimik na pinapalitan ng interpretasyon ang mismong pananalita.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang ‘mabunga’ upang maging likas ang talinghaga at maihatid ang pagiging produktibo ng ἐνεργής; pinanatili ang ‘pinto’ at ipinaliwanag ang diwa sa talababa.
