  naturalness: Malinaw, natural, at angkop sa makabagong Filipino ang “At kung nararapat na pumunta rin ako, sasama sila sa akin.” Ang “nararapat” ay may marangal ngunit hindi lipas na rehistro.
  terminology: Ang “nararapat” ay angkop para sa ἄξιον sa kontekstong pangpraktikal. Gayunman, ang “magiging sulit” sa talababa ay mas kolokyal at mas madaling magpahiwatig ng pagsusuring halaga-singaw kaysa ng pagiging angkop o nararapat; mas mabuting gamitin ang “angkop” o “makatuwiran” bilang leksikal na alternatibo.
  issues:
