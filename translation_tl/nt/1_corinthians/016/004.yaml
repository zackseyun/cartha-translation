    issue: Hindi gaanong angkop ang “magiging sulit” bilang pangunahing alternatibo sa talababa.
    rationale: Bagaman maaaring saklawin ng “worthwhile” ang ganitong diwa sa Ingles, ang ἄξιον sa impersonal na konstruksiyong ito ay mas tuwirang tumutukoy sa pagiging angkop, nararapat, o makatuwiran. Ang “magiging sulit” ay mas impormal at maaaring magpahiwatig ng halaga o pakinabang na hindi tahasang isinasaad ng Griyego.
