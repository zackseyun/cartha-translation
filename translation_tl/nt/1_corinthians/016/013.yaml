translation:
  language: tl
  text: Maging mapagmatyag; manindigan kayong matatag sa pananampalataya; magpakatapang kayo; maging malakas kayo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang huling utos na “Palakasin nawa kayo.” Pasibo ang anyo ng pandiwang Griyego, bagaman natural ding isalin ito bilang “maging malakas kayo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Γρηγορεῖτε
  choice: Maging mapagmatyag
  rationale: Ipinahahayag ng kasalukuyang pautos na maramihan ang patuloy na pagbabantay o pagiging handa; natural at marangal sa makabagong Tagalog ang “maging mapagmatyag.”
- source_word: στήκετε
  choice: manindigan kayong matatag
  rationale: Metaporikal ang στήκω at tumutukoy sa pananatiling matibay, hindi lamang sa literal na pagtayo.
- source_word: ἐν τῇ πίστει
  choice: sa pananampalataya
  rationale: Pinananatili ang may-artikulong parirala bilang larangan o nilalaman ng pananampalatayang Kristiyano, nang hindi ito labis na nililinaw sa teksto.
- source_word: ἀνδρίζεσθε
  choice: magpakatapang kayo
  rationale: Bagaman nagmula ang pandiwa sa salitang “lalaki,” idyomatiko itong panawagan na kumilos nang buong tapang. Ang “magpakatapang” ay natural sa Tagalog at angkop sa lahat ng kausap ni Pablo.
- source_word: κραταιοῦσθε
  choice: magpakalakas kayo
  rationale: Natural na pautos ito sa Tagalog at pinananatili ang maikli at mariing serye ng mga utos; inilalahad sa talababa ang posibleng pasibong diwa.
theological_decisions:
- issue: Kahulugan ng ἐν τῇ πίστει
  choice: sa pananampalataya
  alternative: sa inyong pananalig
  rationale: Sinusuportahan ng artikulo at konteksto ang pananampalataya bilang pinaninindigang pananampalatayang Kristiyano, ngunit hindi dinaragdagan ng “Kristiyano” ang mismong teksto.
- issue: May kasariang pinagmulan ng ἀνδρίζεσθε
  choice: magpakatapang kayo
  alternative: kumilos kayong gaya ng mga lalaki
  rationale: Ang buhay na idyomatikong kahulugan ng pandiwa ay lakas ng loob. Ang literal na hulma sa Tagalog ay madaling magpahiwatig na lalaki lamang ang tinutukoy, samantalang maramihan at pangkalahatan ang tagubilin sa iglesya.
- issue: Tinig ng κραταιοῦσθε
  choice: magpakalakas kayo
  alternative: palakasin kayo
  rationale: Maaaring idiomatikong ipahayag ang pasibong anyo bilang utos na maging malakas, ngunit pinananatili sa talababa ang posibilidad na “palakasin kayo,” na maaaring magpahiwatig ng lakas na tinatanggap.
translation_notes:
  register: Makabago, tuwiran, at marangal na Tagalog; pinanatili ang sunod-sunod at maiikling pautos ng Griyego. Gumamit ng semicolon upang malinaw ang apat na magkakaugnay na tagubilin.
