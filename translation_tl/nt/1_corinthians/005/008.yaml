language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὥστε ἑορτάζωμεν, μὴ ἐν ζύμῃ παλαιᾷ μηδὲ ἐν ζύμῃ κακίας καὶ πονηρίας, ἀλλ’ ἐν ἀζύμοις εἰλικρινείας καὶ ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/008.yaml
  text: Therefore let us keep the feast[a], not with old leaven, nor with the leaven of malice and wickedness[b], but with the unleavened bread of sincerity and truth.
translation:
  language: tl
  text: Kaya ipagdiwang natin ang kapistahan[a], hindi gamit ang lumang lebadura, ni gamit ang lebadura ng masamang hangarin at kasamaan, kundi gamit ang tinapay na walang lebadura[b] ng katapatan ng kalooban at katotohanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ganapin natin ang kapistahan” o “magdiwang tayo.” Ipinagpapatuloy ng Griyego ang larawan ng kapistahan ng Paskuwa mula sa naunang talata.
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “mga bagay na walang lebadura na nauukol sa katapatan ng kalooban at katotohanan.” Idinagdag ang “tinapay” upang luminaw ang larawan ng Paskuwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Kaya
  rationale: Likas at malinaw na panandang Filipino para sa kongklusyong hinango ni Pablo mula sa naunang pangangatuwiran.
- source_word: ἑορτάζωμεν
  choice: ipagdiwang natin ang kapistahan
  rationale: Pinananatili ang hortatoryong diwa ng pangkasalukuyang subjunctive at ang larawan ng kapistahan ng Paskuwa mula sa naunang talata.
- source_word: ζύμῃ παλαιᾷ
  choice: lumang lebadura
  rationale: Ang “lebadura” ay tuwirang katumbas na nauunawaan sa modernong Filipino at pinananatili ang larawan ng Paskuwa at tinapay na walang lebadura.
- source_word: κακίας
  choice: masamang hangarin
  rationale: Ipinahahayag ang diwa ng masamang kalooban o hangaring makapinsala, habang inihihiwalay ito sa mas malawak na πονηρία.
- source_word: πονηρίας
  choice: kasamaan
  rationale: Malinaw at karaniwang salitang Filipino para sa moral na kasamaan, at naiiba sa “masamang hangarin.”
- source_word: ἀζύμοις
  choice: tinapay na walang lebadura
  rationale: Ang Griyego ay substantibong “mga bagay na walang lebadura”; idinagdag ang “tinapay” upang maging malinaw ang larawan ng Paskuwa nang hindi binabago ang metapora.
- source_word: εἰλικρινείας
  choice: katapatan ng kalooban
  rationale: Mas natural at tiyak sa Filipino kaysa sa “sinseridad,” at ipinahahayag ang dalisay at hindi pakunwaring disposisyon.
- source_word: ἀληθείας
  choice: katotohanan
  rationale: Tuwiran at likas na katumbas na nagpapanatili sa pagkakapares nito sa εἰλικρίνεια.
theological_decisions:
- issue: Larawan ng Paskuwa at kapistahan sa pangaral ni Pablo
  choice: Panatilihin ang “ipagdiwang natin ang kapistahan” at “tinapay na walang lebadura.”
  alternative: “magdiwang tayo” at “mga bagay na walang lebadura”
  rationale: Tinutukoy ng naunang talata si Cristo bilang korderong pampaskuwa; kaya mahalagang huwag gawing pangkalahatang moral na panawagan lamang ang talata. Ang pagdaragdag ng “tinapay” ay nililinaw sa Filipino ang metapora ngunit minamarkahan sa talababa.
- issue: Ugnayan ng literal na kapistahan at metaporikal na pamumuhay
  choice: Panatilihin ang pananalitang maaaring tumukoy sa patuloy na pagdiriwang sa metaporikal na diwa nang hindi ipinapasyang literal na ritwal ang iniutos.
  alternative: Isalin bilang tahasang “mamuhay tayo” upang alisin ang larawan ng kapistahan.
  rationale: Ang ἑορτάζωμεν ay tunay na nangangahulugang ipagdiwang o ganapin ang isang kapistahan, ngunit ginagamit ito rito sa isang pinalawak na pangaral. Pinananatili ng salin ang sadyang tensiyon at larawan ng teksto.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang pamilyar na salitang biblikal na “lebadura” upang mapanatili ang larawan ng Paskuwa; iniwasan ang mas teknikal na “pampaalsa” at ang hiram na “sinseridad.”
