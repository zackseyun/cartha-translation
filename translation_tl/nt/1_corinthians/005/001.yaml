  text: Ὅλως ἀκούεται ἐν ὑμῖν πορνεία, καὶ τοιαύτη πορνεία ἥτις οὐδὲ ἐν τοῖς ⸀ἔθνεσιν, ὥστε γυναῖκά τινα τοῦ πατρὸς ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/001.yaml
  text: 'It is actually reported that there is sexual immorality among you, and sexual immorality of such a kind as is not even found among the Gentiles: a man has his father’s wife.'
translation:
  language: tl
  text: 'Talagang nababalitang may seksuwal na imoralidad sa gitna ninyo—at isang uri ng seksuwal na imoralidad na wala kahit sa mga Hentil[a]: may seksuwal na relasyon ang isang lalaki sa asawa ng kanyang ama.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa mga bansa”; isinasalin naman ito ng ilan na “sa mga pagano.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “magkaroon ng asawa ng kanyang ama”; idyoma ito para sa pakikipagrelasyong seksuwal sa asawa ng kanyang ama, na posibleng madrasta niya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅλως
  choice: Talagang
  rationale: Naghahatid ito ng diin at pagkagulat sa likas at makabagong Tagalog, sa halip na ng dami o kabuuan.
- source_word: ἀκούεται
  choice: nababalita
  rationale: Ang pasibong anyo ay tumutukoy sa isang bagay na naririnig bilang ulat; natural sa Tagalog ang “nababalita.”
- source_word: ἐν ὑμῖν
  choice: sa gitna ninyo
  rationale: Malinaw nitong ipinapakitang nagaganap ang bagay sa loob ng pamayanan ng mga taga-Corinto.
- source_word: πορνεία
  choice: seksuwal na imoralidad
  rationale: Malawak ang saklaw ng salita para sa ipinagbabawal na asal na seksuwal; hindi ito pinakikitid sa isang partikular na gawa.
- source_word: τοιαύτη πορνεία
  choice: isang uri ng seksuwal na imoralidad
  rationale: Pinananatili nito ang kwalitatibong diin ng τοιαύτη at ang pagkabigla sa uri ng kasalanang iniulat.
- source_word: οὐδὲ ἐν τοῖς ἔθνεσιν
  choice: wala kahit sa mga Hentil
  rationale: Ang “mga Hentil” ay tuwirang katumbas sa kontekstong Judio-Kristiyano at hindi nagdaragdag ng mapanghamak na kulay ng “mga pagano.” Ang “wala” ay natural na Tagalog para sa eliptikong Griyego.
- source_word: ὥστε
  choice: ':'
  rationale: Ipinakikilala nito ang tiyak na nilalaman ng nakagugulat na ulat; pinakamalinaw itong ihatid sa pamamagitan ng tutuldok.
- source_word: γυναῖκά τινα τοῦ πατρὸς
  choice: ang asawa ng kanyang ama
  rationale: Malapit ito sa literal na pahayag at hindi ipinapalagay sa pangunahing teksto ang mas tiyak na katawagang “madrasta.”
- source_word: ἔχειν
  choice: kinakasama
  rationale: Sa konteksto, ang ἔχειν ay idyomatikong tumutukoy sa pagkakaroon sa babae bilang seksuwal o mag-asawang kapareha. Mas malinaw sa modernong Tagalog ang “kinakasama” kaysa sa literal ngunit malabong “mayroon.”
theological_decisions:
- issue: Kung isasalin ang ἔθνεσιν bilang “mga Hentil” o “mga pagano”
  choice: mga Hentil
  alternative: mga bansa; mga pagano
  rationale: Etniko at panrelihiyong pagkakaiba ang pangunahing ipinahihiwatig ng salita; hindi kailangang dagdagan ng mas mapanghusgang tono.
- issue: Kung tatawagin ang babae na “madrasta” sa pangunahing teksto
  choice: asawa ng kanyang ama
  alternative: madrasta niya
  rationale: Hindi gumagamit ang Griyego ng tiyak na terminong pangkamag-anakan. Pinananatili ng salin ang pahayag ng teksto nang hindi nagdaragdag ng detalyeng hindi tahasang sinabi.
- issue: Kung literal na isasalin ang ἔχειν bilang “mayroon”
  choice: kinakasama
  alternative: may relasyon sa; mayroon bilang asawa o kapareha
  rationale: Ang literal na “may asawa ng kanyang ama” ay hindi malinaw o natural sa Tagalog. Ipinahahayag ng “kinakasama” ang idyomatikong diwa habang hindi tinutukoy nang labis ang legal na katayuan o eksaktong uri ng pagsasama.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang matinding pagkagulat ng pambungad, ang malawak na diwa ng πορνεία, at ang hindi tiyak na katawagan sa relasyon ng babae sa lalaki. Ginamit ang “kinakasama” upang maging malinaw ang idyomatikong ἔχειν nang hindi gumagamit ng bulgar o labis na tiyak na pananalita.
