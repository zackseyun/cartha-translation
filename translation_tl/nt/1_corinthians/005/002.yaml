  text: καὶ ὑμεῖς πεφυσιωμένοι ἐστέ, καὶ οὐχὶ μᾶλλον ἐπενθήσατε, ἵνα ⸀ἀρθῇ ἐκ μέσου ὑμῶν ὁ τὸ ἔργον τοῦτο ⸀ποιήσας;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/002.yaml
  text: And you are puffed up[a], and should you not rather have mourned, so that the one who did this deed might be removed from among you?
translation:
  language: tl
  text: At kayo pa ay nagmamataas! Hindi ba dapat sana, sa halip, ay nagdalamhati kayo, upang maalis mula sa gitna ninyo[a] ang gumawa ng bagay na ito?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mawala mula sa gitna ninyo.” Sa konteksto, malamang na tumutukoy ito sa pag-aalis sa taong iyon mula sa kapulungan bilang pagdidisiplina.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεφυσιωμένοι
  choice: nagmamataas
  rationale: Ipinahahayag nito ang nananatiling kalagayan ng kapalaluan na tinutukoy ng perfect participle. Likas ito sa modernong Tagalog at pinananatili ang diwa ng metaporang pagiging ‘napalaki’ ng pagmamataas nang hindi gumagamit ng pilit na literal na pananalita.
- source_word: οὐχὶ μᾶλλον
  choice: Hindi ba sa halip ay dapat sana
  rationale: Pinananatili nito ang matinding pagsaway sa anyo ng retorikal na tanong at ang pagtutunggali ng aktuwal nilang saloobin sa nararapat nilang naging tugon.
- source_word: ἐπενθήσατε
  choice: kayong nagdalamhati
  rationale: Ang ‘nagdalamhati’ ay nagpapahayag ng matindi at malalim na pagdadalamhati, mas malakas kaysa sa pangkalahatang ‘nalungkot,’ at angkop sa sama-samang tugon ng kapulungan.
- source_word: ἵνα ἀρθῇ
  choice: upang maalis
  rationale: Ang ‘upang’ ay malinaw na naghahatid ng layunin o inaasahang bunga, habang pinananatili ng ‘maalis’ ang balintiyak at ang lawak ng kahulugan ng αἴρω nang hindi agad tinutukoy kung sino ang kikilos.
- source_word: ἐκ μέσου ὑμῶν
  choice: sa gitna ninyo
  rationale: Natural at malinaw itong katumbas ng idyomang tumutukoy sa pag-aalis ng isang tao mula sa komunidad.
- source_word: ὁ τὸ ἔργον τοῦτο ποιήσας
  choice: ang gumawa ng gawang ito
  rationale: Tinutukoy nito ang nagkasala nang hindi nagdaragdag ng pangalan o paliwanag, at pinananatili ng ‘gawa’ ang bigat at pag-uulit ng salitang-ugat sa parirala.
theological_decisions:
- issue: Uri ng pag-aalis sa taong nagkasala
  choice: maalis sa gitna ninyo
  alternative: itiwalag; kunin o alisin ng Diyos
  rationale: Maaaring unawain nang mas malawak ang balintiyak na ἀρθῇ, ngunit itinuturo ng malapit na konteksto ng 1 Corinto 5:3–5, 13 ang pag-aalis mula sa kapulungan bilang pagdidisiplina. Hindi ginamit ang mas tiyak na ‘itiwalag’ upang mapanatili ang lawak at tensiyon ng pananalitang Griyego at huwag tahasang tukuyin ang gumagawa ng pag-aalis.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ang padamdam sa unang pangungusap ay naghahatid ng matinding pagsaway ni Pablo; ang retorikal na tanong ay pinanatili. Inilagay ang talababa sa pariralang ‘maalis sa gitna ninyo,’ na siyang aktuwal na tinutukoy ng paliwanag.
