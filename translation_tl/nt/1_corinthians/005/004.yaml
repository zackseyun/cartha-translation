id: 1CO.5.4
reference: 1 Corinthians 5:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐν τῷ ὀνόματι τοῦ κυρίου ἡμῶν ⸀Ἰησοῦ, συναχθέντων ὑμῶν καὶ τοῦ ἐμοῦ πνεύματος σὺν τῇ δυνάμει τοῦ κυρίου ἡμῶν ⸁Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/004.yaml
  text: In the name of our Lord Jesus[a], when you are assembled, and my spirit is with you, with the power of our Lord Jesus,
translation:
  language: tl
  text: Sa pangalan ng ating Panginoong Jesus[a], kapag nagkatipon kayo at kasama ninyo ang aking espiritu, kasama ang kapangyarihan ng ating Panginoong Jesus,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Siksik ang ayos ng Griyego. Maaari ring isaayos: “kapag kayo ay nagkatipon, at ang aking espiritu ay kasama ninyo.”'
    reason: Ipinapakita ang genitive absolute at ang ipinahihiwatig, ngunit hindi tahasang nakasulat, na presensiya ng espiritu ni Pablo.
lexical_decisions:
- source_word: ἐν τῷ ὀνόματι
  choice: Sa pangalan
  rationale: Pinananatili ang karaniwang idyomang Griyego na nagpapahiwatig ng pagkilos sa ilalim ng pangalan at awtoridad ni Jesus nang hindi ito nililimitahan sa isang paliwanag lamang.
- source_word: κυρίου
  choice: Panginoon
  rationale: Ito ang likas at nakaugaliang salin ng titulong κύριος sa Bagong Tipan at pinananatili ang bigat nitong kristolohikal.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Ginamit ang pamantayang anyo ng personal na pangalan sa modernong Filipino.
- source_word: συναχθέντων ὑμῶν
  choice: kapag nagkatipon kayo
  rationale: Isinalin ang aorist passive genitive absolute bilang likas na sugnay na temporal; ang anyong Filipino ay hindi kailangang tahasang magtakda kung ang pagtitipon ay kusang ginawa o ipinatawag.
- source_word: τοῦ ἐμοῦ πνεύματος
  choice: kasama ninyo ang aking espiritu
  rationale: Ginawang hayag ang ipinahihiwatig na presensiya ng espiritu ni Pablo upang maging malinaw sa Filipino, nang hindi ipinapaliwanag kung paano nagaganap ang presensiyang iyon.
- source_word: σὺν
  choice: kasama
  rationale: Pinananatili ang payak na diwa ng pakikisama o pag-iral na kalakip ng isa pa, sa halip na gawing tiyak na instrumental ang ugnayan.
- source_word: δυνάμει
  choice: kapangyarihan
  rationale: Ang kapangyarihan ay mas malawak kaysa pormal na awtoridad lamang at angkop sa epektibong lakas na tinutukoy sa konteksto.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: ng ating Panginoong Jesus
  rationale: Tuwirang pinananatili ang genitive upang manatiling bukas ang diwa ng pag-aari, pinagmulan, o kaugnayan ng kapangyarihan kay Jesus.
theological_decisions:
- issue: Ang uri ng presensiya ni Pablo sa pagtitipon
  choice: Ipinahahayag na kasama ng kapulungan ang espiritu ni Pablo sa di-pisikal na paraan.
  alternative: Maaari itong tumukoy lamang sa kaniyang saloobin o layunin, o kaya sa isang mas matinding mistikal na presensiya.
  rationale: Tinitiyak ng teksto ang di-pisikal na pakikibahagi ni Pablo ngunit hindi nito ipinaliliwanag ang mekanismo; hindi nagdagdag ang salin ng isang tiyak na doktrina.
- issue: Ang ugnayan ng “kasama ang kapangyarihan” sa ibang bahagi ng pangungusap
  choice: Pinanatili ang maluwag na pagkakaugnay ng parirala sa pagtitipon, espiritu ni Pablo, at pagkilos sa pangalan ni Jesus.
  alternative: Maaaring ipakahulugang ang kapangyarihan ang tahasang paraan o awtoridad ng isasagawang paghatol.
  rationale: Siksik ang sintaks ng Griyego, kaya iniwasang magdagdag ng pandiwa o simuno na magpapasya sa eksaktong ugnayan.
translation_notes:
  register: Modernong Filipino na pormal at marangal ngunit madaling maunawaan. Pinanatili ang anyong di-ganap na pangungusap at kuwit sa hulihan sapagkat nagpapatuloy ang diwa sa talata 5. Iniwasan ang teknikal o denominasyonal na pananalita.
