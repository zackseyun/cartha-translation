id: 1CO.5.10
reference: 1 Corinthians 5:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀οὐ πάντως τοῖς πόρνοις τοῦ κόσμου τούτου ἢ τοῖς πλεονέκταις ⸀καὶ ἅρπαξιν ἢ εἰδωλολάτραις, ἐπεὶ ⸀ὠφείλετε ἄρα ἐκ τοῦ κόσμου ἐξελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/010.yaml
  text: not at all meaning the sexually immoral of this world[a], or the greedy and swindlers, or idolaters[b], since then you would have to go out of the world.
translation:
  language: tl
  text: Hindi ko naman tinutukoy ang mga imoral sa pakikipagtalik na nasa sanlibutang ito, o ang mga sakim at mga mandarambong[a], o ang mga sumasamba sa mga diyos-diyosan. Sapagkat kung gayon, kailangan sana ninyong umalis sa sanlibutan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga mang-aagaw” o “mga nangingikil.” Ang salitang Griyego ay maaaring tumukoy sa mga kumukuha sa iba sa pamamagitan ng dahas o pagsasamantala.
    reason: lexical_alternative
  - marker: b
    text: Nililinaw ni Pablo na hindi niya ibig sabihing dapat iwasan ng mga mananampalataya ang lahat ng imoral na taong nasa labas ng iglesya; ihambing ang 1 Corinto 5:11.
    reason: cross_reference
lexical_decisions:
- source_word: οὐ πάντως
  choice: Hindi ko naman tinutukoy
  rationale: Sa konteksto, nililinaw ni Pablo ang saklaw ng nauna niyang sinabi. Likas sa modernong Tagalog ang pariralang ito at hindi nito ginagawang ganap na pagbabawal ang pakikipag-ugnayan.
- source_word: πόρνοις
  choice: mga imoral sa pakikipagtalik
  rationale: Pinananatili nito ang tiyak na seksuwal na diwa ng πόρνοις sa malinaw at kasalukuyang Tagalog.
- source_word: τοῦ κόσμου τούτου
  choice: na nasa sanlibutang ito
  rationale: Ang κόσμος dito ay tumutukoy sa lipunan o daigdig ng mga tao sa labas ng iglesya; pinananatili ng 'sanlibutang ito' ang tradisyonal ngunit nauunawaang larawan.
- source_word: πλεονέκταις
  choice: mga sakim
  rationale: Tumpak at karaniwang salita ang 'sakim' para sa taong laging naghahangad ng higit, kalakip ang maaaring mapagsamantalang diwa.
- source_word: ἅρπαξιν
  choice: mga mandarambong
  rationale: Sinasaklaw ng 'mandarambong' ang taong nang-aagaw o kumukuha sa iba sa dahas o pagsasamantala, nang hindi nililimitahan ang salita sa pandaraya lamang.
- source_word: εἰδωλολάτραις
  choice: mga sumasamba sa mga diyos-diyosan
  rationale: Mas malinaw ito sa ordinaryong modernong mambabasa kaysa sa teknikal na 'mga idolatrya' o 'mga idolatro,' at tumpak na inilalarawan ang gawain.
- source_word: ἐπεὶ ... ἄρα
  choice: Kung gayon
  rationale: Ipinahahayag nito ang lohikal na kahihinatnan ng ganap na pagbasa sa naunang tagubilin.
- source_word: ὠφείλετε
  choice: kailangan sana ninyong
  rationale: Sa argumentong ito, ang imperfect indicative ay nagpapahayag ng di-makatotohanang praktikal na pangangailangan; natural itong naihahatid ng 'kailangan sana.'
- source_word: ἐκ τοῦ κόσμου ἐξελθεῖν
  choice: umalis sa sanlibutan
  rationale: 'Pinananatili nito ang mariin at halos eksaheradong larawan: upang lubusang maiwasan ang gayong mga tao, kailangang lumabas mismo sa daigdig ng lipunan.'
theological_decisions:
- issue: Saklaw ng ipinag-uutos na paghiwalay sa nakapaligid na konteksto
  choice: Itinatanggi ni Pablo na ang nauna niyang tagubilin ay nangangahulugan ng lubusang pag-iwas sa lahat ng imoral na taong nasa labas ng iglesya.
  alternative: Lubusang paglayo sa lahat ng imoral na tao sa lipunan.
  rationale: 'Nililimitahan mismo ng talata ang naunang tagubilin: kung lubusan ang pag-iwas, kakailanganing umalis sa sanlibutan. Hindi ipinapasok ng salin ang sektaryang paghiwalay na hindi hinihingi ng teksto.'
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang 'sanlibutan' upang mapanatili ang magkapares na paglitaw ng κόσμος at ang matinding larawan ng pag-alis dito; iniwasan ang labis na teknikal o denominasyonal na pananalita.
