  naturalness: Malinaw at angkop sa modernong Filipino Tagalog ang karamihan ng salin. Ang “Sapagkat kung gayon” ay mas buo at likas sa argumentong ipinahahayag ni Pablo.
  terminology: Ang “mga imoral sa pakikipagtalik,” “mga sakim,” “mga mandarambong,” at “mga sumasamba sa mga diyos-diyosan” ay sapat na tumpak. Pinananatili ng “sanlibutan” ang magkakaugnay na gamit ng κόσμος sa talata.
