  text: For what is it to me to judge outsiders? Is it not those inside that you are to judge?[a][b]
translation:
  language: tl
  text: Sapagkat ano ang kinalaman ko sa paghatol sa mga nasa labas? Hindi ba ang mga nasa loob ang dapat ninyong hatulan?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Sapagkat bakit ako ang hahatol sa mga nasa labas?”
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, ang mga kabilang sa komunidad ng iglesya.
    reason: cultural_note
lexical_decisions:
- source_word: τί γάρ μοι
  choice: Sapagkat ano ang kinalaman ko
  rationale: Likas na ipinahahayag sa modernong Tagalog ang idyomang nagtatanong kung ano ang pananagutan o kinalaman ng nagsasalita, habang pinananatili ng “Sapagkat” ang paliwanag na puwersa ng γάρ.
- source_word: τοὺς ἔξω
  choice: mga nasa labas
  rationale: Pinananatili nito ang larawang panlipunan ng mga taong nasa labas ng komunidad at malinaw na katapat ng “mga nasa loob.”
- source_word: κρίνειν
  choice: paghatol
  rationale: Sapat ang lawak ng “paghatol” upang katawanin ang κρίνω, at sa konteksto ay maaaring tumukoy sa paghatol na kaugnay ng disiplina sa komunidad.
- source_word: οὐχὶ
  choice: Hindi ba
  rationale: Nananatili ang retorikal na tanong na umaasang sasang-ayon ang mambabasa.
- source_word: τοὺς ἔσω
  choice: mga nasa loob
  rationale: Tuwirang pinananatili ang kaibahan sa “mga nasa labas” nang hindi isinisiksik sa pangunahing teksto ang paliwanag na ito ay tungkol sa komunidad ng iglesya.
- source_word: ὑμεῖς κρίνετε
  choice: ang dapat ninyong hatulan
  rationale: Ipinahahayag ang obligasyonal na puwersang angkop sa konteksto, ngunit nananatili sa anyo ng retorikal na tanong.
theological_decisions:
- issue: Kung ang paghatol dito ay disiplina sa loob ng iglesya o pangkalahatang paghatol na moral
  choice: Pinananatili ang kaibahan ng mga nasa labas at mga nasa loob, na sa konteksto ay tumutukoy sa pananagutan ng komunidad sa sarili nitong mga kasapi.
  alternative: Unawain ito bilang pangkalahatang pagbabawal o pahintulot hinggil sa lahat ng uri ng paghatol na moral.
  rationale: Ang 1 Corinto 5:9–13 ay nakatuon sa disiplina sa komunidad. Hindi pinalalawak ng salin ang pahayag lampas sa saklaw nito, at ang talababa lamang ang nagpapaliwanag sa tinutukoy na komunidad.
- issue: Puwersa ng ὑμεῖς κρίνετε
  choice: “dapat ninyong hatulan,” na nagpapahiwatig ng tungkulin sa konteksto
  alternative: “hinahatulan ninyo,” bilang payak na paglalarawan
  rationale: Maaaring basahin ang anyong Griyego bilang deskriptibo, ngunit ang retorikal na tanong at konteksto ng tagubilin ay nagbibigay rito ng obligasyonal na puwersa. Itinatala sa talababa ang leksikal na alternatibo sa unang sugnay, habang hindi labis na nilulutas ang mas malawak na usaping teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang magkatambal na “mga nasa labas” at “mga nasa loob” upang mapanatili ang retorikal na kaibahan ng Griyego. Ang “ano ang kinalaman ko” ay likas na idyomang Tagalog at hindi kahoy na literalismo.
