id: 1CO.5.5
reference: 1 Corinthians 5:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: παραδοῦναι τὸν τοιοῦτον τῷ Σατανᾷ εἰς ὄλεθρον τῆς σαρκός, ἵνα τὸ πνεῦμα σωθῇ ἐν τῇ ἡμέρᾳ τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/005.yaml
  text: to hand such a man over to Satan for the destruction of the flesh[b][a], so that the spirit may be saved in the day of the Lord.
translation:
  language: tl
  text: ibigay ang gayong tao kay Satanas para sa kapahamakan ng laman,[a] nang sa gayon ay maligtas ang espiritu sa araw ng Panginoon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “para sa pagkawasak ng laman.” Maaaring tumukoy ang parirala sa matinding paghatol sa katawan, o, sa masagisag na diwa, sa pagwasak sa makalaman at makasalanang pagkiling ng taong ito.
    reason: lexical_alternative
  - marker: b
    text: Mababasa sa ilang manuskrito ang “ng ating Panginoong Jesus” o “ng Panginoong Jesus” sa halip na “ng Panginoon” lamang.
    reason: textual_variant
lexical_decisions:
- source_word: παραδοῦναι
  choice: ibigay ... kay
  rationale: Likas at malinaw sa Filipino ang “ibigay kay Satanas” bilang pagkilos ng pagtatalaga o pagsasakamay, habang pinananatili ang lakas ng παραδίδωμι.
- source_word: τὸν τοιοῦτον
  choice: ang gayong tao
  rationale: Tumutukoy ito sa partikular na lalaking nagkasala ngunit pinananatili rin ang bahagyang pangkalahatang himig ng parirala.
- source_word: Σατανᾷ
  choice: Satanas
  rationale: Karaniwang anyo ng pangalang ito sa modernong Filipino.
- source_word: εἰς ὄλεθρον τῆς σαρκός
  choice: upang mapuksa ang laman
  rationale: Ipinahahayag ang layunin o bunga ng εἰς at ang bigat ng ὄλεθρος, habang ang “laman” ay nagpapanatili sa tunay na kalabuan ng σάρξ sa konteksto.
- source_word: ἵνα
  choice: nang sa gayon ay
  rationale: Malinaw na ipinakikita ang layunin o inaasahang resulta ng pagkilos.
- source_word: τὸ πνεῦμα
  choice: ang espiritu
  rationale: Hindi idinagdag ang “kaniyang” sapagkat walang tahasang panghalip na paari sa Griyego.
- source_word: σωθῇ
  choice: maligtas
  rationale: Pinananatili ang pasibong diwa at ang wikang tumutukoy sa kaligtasan, nang hindi dinaragdagan ang paliwanag tungkol sa paraan nito.
- source_word: ἐν τῇ ἡμέρᾳ τοῦ κυρίου
  choice: sa araw ng Panginoon
  rationale: Natural na eskatolohikal na parirala sa Filipino at tapat sa SBLGNT na may simpleng κυρίου lamang.
theological_decisions:
- issue: Kahulugan ng “pagkapuksa ng laman”
  choice: Panatilihin sa pangunahing teksto ang malabong pariralang “mapuksa ang laman.”
  alternative: Maaaring tumukoy sa matinding paghatol sa katawan o sa pagwasak sa makalaman at makasalanang pagkiling ng tao.
  rationale: Hindi tiyak na nilulutas ng Griyego kung pisikal o masagisag ang tinutukoy; kaya hindi ito tahimik na pinili ng salin.
- issue: Tinutukoy ng “ang espiritu”
  choice: Isalin bilang “ang espiritu” nang walang “kaniyang.”
  alternative: “ang kaniyang espiritu”
  rationale: Bagaman malamang na espiritu ng nagkasala ang tinutukoy, walang tahasang paari sa pinagmulang teksto.
- issue: Pariralang “araw ng Panginoon”
  choice: Panatilihin ang “ng Panginoon.”
  alternative: “ng ating Panginoong Jesus” o “ng Panginoong Jesus”
  rationale: Ang ibinigay na SBLGNT ay κυρίου lamang; inilalagay sa talababa ang mas mahahabang pagbasa ng ibang manuskrito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang teolohikal na bigat at kalabuan ng “laman” at “espiritu,” at iniwasan ang pagdaragdag ng denominasyonal na pagpapakahulugan.
