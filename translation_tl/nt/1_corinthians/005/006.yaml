  yaml_path: translation/nt/1_corinthians/005/006.yaml
  text: Your boasting is not good[a]. Do you not know that a little leaven leavens the whole batch of dough?
translation:
  language: tl
  text: Hindi mabuti ang inyong pagyayabang. Hindi ba ninyo alam na ang kaunting pampaalsa ay nagpapaalsa sa buong masa ng harina?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καλὸν
  choice: mabuti
  rationale: Tuwirang ipinahahayag nito ang negatibong pagtataya ni Pablo sa pagyayabang ng mga taga-Corinto, at natural ito sa modernong Tagalog.
- source_word: καύχημα
  choice: pagyayabang
  rationale: Ipinapakita ng pangngalan ang kanilang pagmamapuri o pagyayabang; ang “pagyayabang” ay malinaw at angkop sa tono ng pagsaway.
- source_word: οὐκ οἴδατε
  choice: Hindi ba ninyo alam
  rationale: Pinananatili nito ang retorikal na tanong at ang karaniwang pormula ni Pablo nang natural sa Tagalog.
- source_word: μικρὰ ζύμη
  choice: kaunting pampaalsa
  rationale: Ang “pampaalsa” ay madaling maunawaan at tumutukoy sa sangkap na nagpapaalsa sa masa; pinananatili ng “kaunti” ang diin sa maliit na dami.
- source_word: ὅλον τὸ φύραμα
  choice: ang buong masa ng harina
  rationale: Ang φύραμα ay minasa o hinalong masa; malinaw sa pangkaraniwang mambabasa ang “masa ng harina” at pinananatili ng “buong” ang kabuuang saklaw.
- source_word: ζυμοῖ
  choice: napaalsa
  rationale: Pinananatili nito ang ugnayang leksikal sa “pampaalsa” at ang kilos ng pampaalsa sa buong masa.
theological_decisions:
- issue: Metaporang pampaalsa
  choice: Panatilihin ang larawan ng kaunting pampaalsa na nagpapaalsa sa buong masa nang hindi tahasang pinapangalanan ang tinutukoy nitong kasalanan o ang buong iglesya.
  alternative: Palawakin bilang “ang kaunting kasalanan ay nakasisira sa buong iglesya.”
  rationale: Ang Griyego ay gumagamit ng kasabihang metaporikal. Malinaw sa konteksto ang aplikasyon, ngunit hindi ito tahasang ipinaliliwanag sa mismong talata; kaya dapat panatilihin ang larawan at ang puwang nito para sa kontekstuwal na pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “masa ng harina” sa halip na tradisyonal ngunit maaaring malabong “bukol,” at “pampaalsa” sa halip na espesipikong modernong “lebadura,” upang mapanatili ang sinaunang larawang malawak ang kahulugan.
