id: 1CO.5.11
reference: 1 Corinthians 5:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: νῦν δὲ ἔγραψα ὑμῖν μὴ συναναμίγνυσθαι ἐάν τις ἀδελφὸς ὀνομαζόμενος ᾖ πόρνος ἢ πλεονέκτης ἢ εἰδωλολάτρης ἢ λοίδορος ἢ μέθυσος ἢ ἅρπαξ, τῷ τοιούτῳ μηδὲ συνεσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/011.yaml
  text: But now I wrote to you not to associate with anyone who is called a brother if he is sexually immoral or greedy or an idolater or abusive or a drunkard or a swindler—not even to eat with such a person.
translation:
  language: tl
  text: Ngunit ngayon, sumulat ako sa inyo na huwag kayong makisama sa sinumang tinatawag na kapatid na imoral sa pakikipagtalik, sakim, sumasamba sa diyos-diyosan, mapanlait, lasenggo, o mapagsamantala. Huwag man lamang kayong kumain na kasama ng gayong tao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ ἔγραψα
  choice: Ngunit ngayon ay sumulat ako
  rationale: Pinananatili ang aorist na ἔγραψα bilang nakaraang kilos at ang panandang pagsalungat na δέ, nang hindi ipinapalagay kung tumutukoy ito sa kasalukuyang liham o sa naunang pagsulat.
- source_word: μὴ συναναμίγνυσθαι
  choice: huwag makisama
  rationale: Likas sa modernong Tagalog at ipinahihiwatig ang patuloy na pakikihalubilo o pakikipag-ugnayan, hindi lamang pisikal na paglapit.
- source_word: ἀδελφὸς ὀνομαζόμενος
  choice: tinatawag na kapatid
  rationale: Pinananatili ang pagiging di-tiyak ng Griyego kung ang tao ay kinikilala, nag-aangkin, o basta tinatawag na kapatid.
- source_word: πόρνος
  choice: imoral sa pakikipagtalik
  rationale: Malinaw at malawak na katumbas para sa taong namumuhay sa seksuwal na imoralidad, nang hindi nililimitahan sa isang partikular na uri ng gawain.
- source_word: πλεονέκτης
  choice: sakim
  rationale: Karaniwan at tuwirang salita para sa taong gahaman o sakim sa pakinabang at pag-aari.
- source_word: εἰδωλολάτρης
  choice: sumasamba sa diyos-diyosan
  rationale: Mas madaling maunawaan ng karaniwang mambabasa kaysa sa teknikal na 'idolatro' at tumpak na nagpapahayag ng pagsamba sa mga diyus-diyosan.
- source_word: λοίδορος
  choice: mapang-abuso
  rationale: Ipinahihiwatig ang taong nanlalait o umaabuso sa pananalita; mas natural kaysa sa literal ngunit di-karaniwang 'mapanlait,' habang hindi nililimitahan sa pisikal na pang-aabuso ayon sa konteksto ng talaan.
- source_word: μέθυσος
  choice: lasenggo
  rationale: Natural na katawagan sa taong nakagawiang magpakalasing, hindi lamang isang taong minsang nalasing.
- source_word: ἅρπαξ
  choice: mandaraya
  rationale: Inilalarawan ang taong mapagsamantala o kumakamkam sa kapuwa. Ang 'mandaraya' ay malinaw sa pangkalahatang mambabasa, bagaman maaaring saklawin ng Griyego ang pangingikil at marahas na pagkamkam.
- source_word: μηδὲ συνεσθίειν
  choice: Huwag man lamang kayong kumaing kasama
  rationale: Pinananatili ang mariing μηδέ at ang kongkretong utos na huwag makisalo sa pagkain.
theological_decisions:
- issue: Saklaw ng pagbabawal sa pakikisama
  choice: Panatilihing nakatuon sa sinumang 'tinatawag na kapatid' na may ganitong asal.
  alternative: Ipakahulugang pagbabawal ito sa pakikisama sa lahat ng taong gumagawa ng mga kasalanang nakalista.
  rationale: Malinaw na nililimitahan ng ἀδελφὸς ὀνομαζόμενος ang tinutukoy; ang mas malawak na konteksto rin ay nagtatangi sa mga nasa loob at nasa labas ng iglesya.
- issue: Kahulugan ng pagkain kasama ang gayong tao
  choice: Isalin nang literal bilang karaniwang pakikisalo sa pagkain, nang walang dagdag na paliwanag sa pangunahing teksto.
  alternative: Tukuying eksklusibo itong tumutukoy sa Hapunan ng Panginoon o eksklusibo sa lahat ng panlipunang pagkain.
  rationale: Hindi nilulutas ng mismong parirala ang lawak o partikular na uri ng pagkain, kaya hindi dapat ipasok sa salin ang isang denominasyonal na pagpapakahulugan.
- issue: Katayuan ng 'tinatawag na kapatid'
  choice: Huwag tukuyin kung tunay o huwad ang pananampalataya ng taong iyon.
  alternative: Isaling 'nagkukunwaring kapatid' o 'nag-aangking kapatid.'
  rationale: Ang ὀνομαζόμενος ay nagsasaad na siya ay tinatawag sa gayong pangalan ngunit hindi tahasang humahatol sa tunay niyang espirituwal na kalagayan.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang tuwirang listahan at hinati sa dalawang pangungusap upang luminaw ang mariing pangwakas na utos. Walang idinagdag na footnote marker dahil walang footnote.
