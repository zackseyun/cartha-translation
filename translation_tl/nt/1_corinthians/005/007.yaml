base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/007.yaml
  text: Clean out the old leaven[a], so that you may be a new batch, just as you are unleavened. For Messiah, our Passover lamb[b], has been sacrificed.
translation:
  language: tl
  text: Alisin ninyo ang lumang lebadura, upang kayo’y maging bagong masa, kung paanong wala kayong lebadura. Sapagkat inihain na bilang handog ang Mesiyas[b], ang ating Paskuwa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ang Griyego ay literal na “ang ating Paskuwa.” Maaari itong tumukoy rito sa kordero o handog sa Paskuwa: “ang ating korderong pampaskuwa” o “ang ating handog sa Paskuwa.”'
    reason: lexical_alternative
  - marker: b
    text: Griyego Christos; isinaling “Mesiyas” dahil malinaw rito ang gamit nito bilang titulo sa konteksto ng Paskuwa.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκκαθάρατε
  choice: Alisin ninyo
  rationale: Ang aorist active imperative na maramihan ay isang tuwirang utos na lubusang alisin ang tinutukoy; natural at malinaw ang “alisin ninyo” sa makabagong Tagalog.
- source_word: παλαιὰν ζύμην
  choice: ang lumang pampaalsa
  rationale: Pinananatili ng “pampaalsa” ang larawan ng masa ng tinapay at ang kaugnayan nito sa Paskuwa; ipinahihiwatig ng “luma” ang dating impluwensiyang dapat alisin.
- source_word: ἵνα ἦτε νέον φύραμα
  choice: upang maging bago kayong masa ng tinapay
  rationale: Ipinahahayag ng ἵνα ang layunin o inaasahang bunga. Ang “masa ng tinapay” ay likas na katumbas ng φύραμα at nagpapanatili sa metapora ng pagluluto.
- source_word: καθώς ἐστε ἄζυμοι
  choice: kung paanong wala kayong pampaalsa
  rationale: Pinananatili ng “kung paanong” ang paghahambing ng καθώς at ang tensiyon sa pagitan ng utos na maging bago at ng kasalukuyan nilang kalagayan bilang walang pampaalsa.
- source_word: τὸ πάσχα ἡμῶν
  choice: ang ating Paskuwa
  rationale: 'Literal at sadyang malawak ang πάσχα: maaari itong tumukoy sa kapistahan, kordero, o handog sa Paskuwa. Pinananatili sa pangunahing teksto ang tunay na kalabuan at nililinaw sa talababa.'
- source_word: ἐτύθη
  choice: ay inihain na
  rationale: Ang passive ng θύω ay tumutukoy sa pagpatay bilang handog. Naipahahayag ng “inihain na” ang sakripisyal na diwa at ang naganap nang pangyayari.
- source_word: Χριστός
  choice: ang Mesiyas
  rationale: Dito ay prominenteng titulo ang Χριστός sa loob ng larawan ng Paskuwa, kaya “Mesiyas” ang higit na angkop kaysa sa anyong pangalang “Cristo.”
theological_decisions:
- issue: Ang kahulugan ng πάσχα kaugnay ng Mesiyas
  choice: ang ating Paskuwa
  alternative: ang ating korderong pampaskuwa / ang ating handog sa Paskuwa
  rationale: Hindi tahasang binabanggit ng Griyego ang “kordero” o “handog,” bagaman malinaw na sakripisyal ang konteksto dahil sa ἐτύθη. Pinananatili ng salin ang maigsi at bahagyang malabong pahayag ni Pablo, habang ipinapaliwanag ng talababa ang mga posibleng referent.
- issue: Pagsasalin sa Χριστός
  choice: ang Mesiyas
  alternative: si Cristo
  rationale: Ang konteksto ng Paskuwa ay nagbibigay-diin sa gamit nito bilang titulo. Hindi nito ipinapasok ang isang natatanging doktrinang denominasyonal.
- issue: Tensiyon sa pagitan ng utos at kasalukuyang identidad
  choice: “upang maging bago” kasabay ng “wala kayong pampaalsa”
  alternative: Ipaliwanag na lamang bilang ganap nang kalagayan o bilang purong utos
  rationale: 'Pinananatili ang retorikal at teolohikal na tensiyon ng teksto: inuutusan silang alisin ang luma upang maging bago, ngunit sinasabi ring sila ay wala nang pampaalsa.'
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “masa ng tinapay” upang maging malinaw ang metapora, at iniwasan ang mas teknikal o makalumang pananalitang gaya ng “purga” at “libadura.”
