revisions:
- from: Alisin ninyo ang lumang pampaalsa, upang maging bago kayong masa ng tinapay, kung paanong wala kayong pampaalsa. Sapagkat ang ating Paskuwa[a], ang Mesiyas[b], ay inihain na.
  to: Alisin ninyo ang lumang lebadura, upang kayo’y maging bagong masa, kung paanong wala kayong lebadura. Sapagkat inihain na bilang handog ang Mesiyas[b], ang ating Paskuwa[a].
  rationale: Pinalitan ang “pampaalsa” ng “lebadura” para sa mas tumpak at karaniwang terminong Filipino sa parehong bahagi ng metapora. Pinakinis ang ayos ng pangungusap tungkol sa bagong masa. Inayos ang huling sugnay upang malinaw ang sakripisyal na pandiwa ng ἐτύθη, habang ang “ating Paskuwa” ay nananatiling hindi labis na tinutukoy sa pangunahing teksto at ang mga posibleng pakahulugan ay nasa talababa.
