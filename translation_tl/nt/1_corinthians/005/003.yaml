  naturalness: Ang “wala riyan sa katawan” ay nauunawaan ngunit hindi likas na paraan sa modernong Filipino upang sabihing pisikal na wala ang isang tao. Mas natural ang “wala man ako riyan nang pisikal.” Ang muling pag-aayos ng mga sugnay ay nagpapalinaw kung ano ang binabago ng paghahambing na “na para bang naririyan ako.”
  terminology: Pinananatili ang “espiritu” nang walang malaking titik upang huwag ipilit na ang Banal na Espiritu ang tinutukoy. Ang “nakapaghatol na ako” ay naaayon sa κέκρικα at sa kontekstong pandisiplina, habang hindi lubusang pinapalitan ang pandiwang “humatol” ng mas interpretatibong “hinatulan.”
