  text: Ἐγὼ μὲν γάρ, ⸀ἀπὼν τῷ σώματι παρὼν δὲ τῷ πνεύματι, ἤδη κέκρικα ὡς παρὼν τὸν οὕτως τοῦτο κατεργασάμενον
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/003.yaml
  text: For I[a], though absent in body but present in spirit, have already judged, as though present[b], the one who has done this thing.
translation:
  language: tl
  text: Sapagkat ako, bagaman wala man ako riyan nang pisikal ngunit naririyan sa espiritu,[a] ay nakapaghatol na ako, na para bang naririyan ako, sa taong gumawa nito nang ganito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “naririyan sa espiritu” ay pinakamalamang na tumutukoy sa sariling espiritu ni Pablo, hindi tuwirang sa Banal na Espiritu.
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na ugnayan nito sa naunang pahayag.
- source_word: ἀπὼν τῷ σώματι
  choice: wala riyan sa katawan
  rationale: Likas na Filipino na nagpapahayag ng pisikal na pagkawala nang hindi nagpapahiwatig ng kamatayan o paghihiwalay ng kaluluwa sa katawan.
- source_word: παρὼν δὲ τῷ πνεύματι
  choice: ngunit naririyan sa espiritu
  rationale: Pinananatili ang tuwirang pagtutunggali ng katawan at espiritu at ang posibilidad na sariling espiritu ni Pablo ang tinutukoy, nang hindi nilulutas ang eksaktong paraan ng kanyang presensiya.
- source_word: ἤδη κέκρικα
  choice: ay humatol na
  rationale: Ipinahihiwatig ng aspektong perpekto ang pasyang naibigay na at nananatiling may bisa; malapit din ito sa kahulugan ng κρίνω.
- source_word: ὡς παρὼν
  choice: na para bang naririyan ako
  rationale: 'Malinaw at natural na inilalahad ang paghahambing: ang hatol niya ay gaya ng hatol ng isang aktuwal na naroroon.'
- source_word: τὸν οὕτως τοῦτο κατεργασάμενον
  choice: sa taong gumawa nito
  rationale: Natural sa Filipino at tapat sa substantibong participle. Ang οὕτως ay hindi ginawang hiwalay na pariralang pilit; sa konteksto, ang 'nito' ay tumutukoy sa gawaing kababanggit lamang.
theological_decisions:
- issue: Kahulugan ng παρὼν δὲ τῷ πνεύματι
  choice: Pinanatili bilang “naririyan sa espiritu,” na pinakamalamang na tumutukoy sa di-pisikal na pakikiisa at paghatol ni Pablo habang wala siya roon.
  alternative: Maaaring unawain bilang presensiya sa pamamagitan ng Banal na Espiritu o bilang isang mas matinding mistikong presensiya.
  rationale: Ang tuwirang pagtutunggali ng σώματι at πνεύματι ay likas na tumutukoy sa katawan at espiritu ni Pablo. Gayunman, hindi ipinaliliwanag ng salin kung paano nagaganap ang ganitong presensiya, kaya nananatili ang tensiyon ng teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “riyan/naririyan” sapagkat kausap ni Pablo ang mga taga-Corinto at tinutukoy ang lugar na kinaroroonan nila. Inilagay ang talababa pagkatapos ng buong pangungusap upang hindi gambalain ang magkaugnay na mga sugnay.
