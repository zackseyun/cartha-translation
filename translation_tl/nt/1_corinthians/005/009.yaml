translation:
  language: tl
  text: Isinulat ko sa inyo sa liham[a] na huwag kayong makisalamuha[b] sa mga taong namumuhay sa seksuwal na imoralidad[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa liham ko.” Maaaring tumukoy ang Griyego sa isang naunang liham na ipinadala ni Pablo o sa bahaging nauna rito sa liham na ito.
    reason: alternative_reading
  - marker: b
    text: O “makihalubilo” o “makisama.”
    reason: lexical_alternative
  - marker: c
    text: O “sa mga taong seksuwal na imoral.” Ang Griyegong πόρνοις ay tumutukoy sa mga taong nailalarawan ng seksuwal na imoralidad.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔγραψα
  choice: Isinulat ko
  rationale: Ang aorist indicative ay likas na maisasalin sa payak na aspektong naganap sa Tagalog; hindi nito nilulutas kung naunang liham o kasalukuyang liham ang tinutukoy.
- source_word: ὑμῖν
  choice: sa inyo
  rationale: Tumutukoy ang datibo sa mga taga-Corinto bilang pinag-ukulan ng pagsulat.
- source_word: ἐν τῇ ἐπιστολῇ
  choice: sa liham
  rationale: Pinananatili ang tiyak ngunit hindi ganap na natutukoy na sanggunian ng Griyego at iniiwang bukas kung naunang liham o ang kasalukuyang liham ang tinutukoy.
- source_word: μὴ συναναμίγνυσθαι
  choice: na huwag kayong makisalamuha
  rationale: Natural sa modernong Tagalog at ipinahahayag ang pakikihalubilo o pakikisama nang hindi agad nililimitahan sa isang partikular na uri ng ugnayan.
- source_word: πόρνοις
  choice: sa mga taong imoral sa pakikipagtalik
  rationale: Malinaw na inilalarawan ang mga taong kinikilala sa seksuwal na imoralidad; iniiwasan ang makitid o makalumang terminong maaaring tumukoy lamang sa isang uri ng gawa.
theological_decisions:
- issue: Kung aling liham ang tinutukoy
  choice: Isinalin bilang “sa liham” nang hindi tinutukoy kung naunang liham o kasalukuyang liham ito.
  alternative: “sa nauna kong liham” o “sa liham kong ito”
  rationale: Tiyak ang parirala sa Griyego, ngunit hindi nito mismong nilulutas ang historikal na sanggunian; pinananatili ng salin ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “liham” sa halip na makalumang “epistola,” at “imoral sa pakikipagtalik” upang maging nauunawaan nang hindi pinakikitid ang saklaw ng terminong Griyego.
