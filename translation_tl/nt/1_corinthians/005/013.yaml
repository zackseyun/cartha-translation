  yaml_path: translation/nt/1_corinthians/005/013.yaml
  text: But God judges those outside[c][b][a]. Remove the evil person from among yourselves.
translation:
  language: tl
  text: Ngunit ang Diyos ang humahatol sa mga nasa labas.[a][b] Alisin ninyo sa inyong hanay ang masamang tao.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga hindi kabilang sa kapulungan.”
    reason: lexical_alternative
  - marker: b
    text: Pangkasalukuyan ang pandiwang Griyego (“humahatol”), bagaman maaari rin itong isaling “hahatol” batay sa konteksto.
    reason: lexical_alternative
  - marker: c
    text: O, “Palayasin ninyo sa gitna ninyo ang masamang tao.” Umaalingawngaw rito ang mga pormula sa Deuteronomio tungkol sa pag-aalis ng kasamaan mula sa bayang nakipagtipan sa Diyos.
    reason: cross_reference
lexical_decisions:
- source_word: τοὺς ... ἔξω
  choice: mga nasa labas
  rationale: Ang pang-abay na may pantukoy ay ginagamit bilang pangngalan at tumutukoy sa mga taong hindi kabilang sa kapulungan. Pinananatili ng “mga nasa labas” ang relasyonal na diwa nang hindi nagdaragdag ng paliwanag.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita ng δέ ang banayad na pagsalungat sa paghatol sa mga nasa loob na binanggit sa naunang talata.
- source_word: κρίνει
  choice: humahatol
  rationale: Pangkasalukuyang panaganong paturol ang pandiwa. Ang “humahatol” ay nagpapanatili sa anyong pangkasalukuyan at maaari ring magpahayag ng pangkalahatang katotohanan.
- source_word: ἐξάρατε
  choice: Alisin ninyo
  rationale: Ang aorist imperative ay nag-uutos ng tiyak at mapagpasiyang pagkilos. Tuwiran at likas sa Filipino ang “alisin ninyo” at hindi ito nagdaragdag ng pamamaraang hindi tahasang nasa Griyego.
- source_word: τὸν πονηρὸν
  choice: ang taong masama
  rationale: Ang pang-uri ay ginamit bilang pangngalan at tumutukoy sa salarin sa konteksto. Likas at marangal sa Filipino ang “taong masama”; hindi nito pinapahina ang moral na paglalarawan, samantalang naiiwasan ang di-kinakailangang pag-angkat ng kasariang gramatikal bilang hiwalay na leksikal na diin.
- source_word: ἐξ ὑμῶν αὐτῶν
  choice: sa inyong hanay
  rationale: Ipinahihiwatig ng parirala ang pag-aalis mula sa loob ng mismong komunidad. Malinaw at idiomatiko sa modernong Filipino ang “sa inyong hanay.”
theological_decisions:
- issue: Kalikasan ng utos tungkol sa pagdidisiplina ng kapulungan
  choice: Inuutusan ang kapulungan na alisin sa kanilang hanay ang taong gumagawa ng masama, samantalang ang paghatol sa mga nasa labas ay ipinauubaya sa Diyos.
  alternative: Maaaring unawain ang utos sa mas pangkalahatang diwa bilang pag-aalis ng kasamaan sa komunidad, nang hindi tahasang tumutukoy sa pormal na pagpapatalsik.
  rationale: Sa konteksto ng 1 Corinto 5, isang tiyak na salarin sa loob ng kapulungan ang tinutukoy ni Pablo, at ipinaghahambing niya ang pananagutan ng mga nasa loob sa paghatol ng Diyos sa mga nasa labas. Gayunman, hindi gumagamit ang salin ng katawagang eklesyastikal na wala sa Griyego.
translation_notes:
  register: Modernong Filipino na tuwiran, marangal, at madaling maunawaan. Pinanatili ang banayad na pagsalungat, ang pangkasalukuyang anyo ng κρίνει, at ang tiyak ngunit hindi teknikal na utos sa komunidad.
