translation:
  language: tl
  text: Kayo naman ang katawan ng Mesiyas[a], at bawat isa ay bahagi nito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Cristo.” Ang salitang Griego na Χριστός ay maaaring isaling “Mesiyas” o “Cristo”; dito ay isinalin itong isang titulo.
    reason: alternative_reading
  - marker: b
    text: 'Maaari ring isalin: “at mga bahagi nang paisa-isa” o “at mga bahagi sa partikular.” Ipinahihiwatig ng parirala na ang bawat isa sa inyo ay bahagi ng iisang katawan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: Kayo
  rationale: Ang tahasang panghalip na pangalawang panauhang maramihan ay may diin; likas itong naihahayag ng “Kayo” sa Filipino.
- source_word: δέ
  choice: nga
  rationale: Dito, ang δέ ay nagpapahiwatig ng paglipat tungo sa tuwirang paglalapat ng naunang larawan ng katawan. Ang “nga” ay natural na nagbibigay-diin sa kongklusyon nang magdagdag ng temporal na diwa.
- source_word: σῶμα Χριστοῦ
  choice: ang katawan ng Mesiyas
  rationale: Tinutukoy nito ang sama-samang pagkakakilanlan ng mga kausap bilang katawan ng Mesiyas; pinananatili ng “katawan” ang metapora.
- source_word: Χριστοῦ
  choice: ng Mesiyas
  rationale: Ang Χριστός ay gumaganap bilang titulong mesiyaniko rito. Ang “Mesiyas” ay nagpapanatili sa kahulugan ng titulo; ibinibigay sa talababa ang nakaugaliang “Cristo.”
- source_word: μέλη
  choice: bahagi
  rationale: Sa konteksto ng katawan, tumutukoy ito sa mga sangkap o bahagi nito. Mas natural sa makabagong Filipino ang “bahagi” kaysa “miyembro” habang napapanatili ang metapora.
- source_word: ἐκ μέρους
  choice: bawat isa
  rationale: 'Distributibo ang parirala sa konteksto: sama-sama silang katawan, ngunit ang bawat isa ay isang bahagi. Iniiwasan nito ang maling pahiwatig ng “bahagya” o kakulangan.'
theological_decisions:
- issue: Pagpapakahulugan sa Χριστοῦ sa pahayag tungkol sa iglesia bilang katawan
  choice: Mesiyas
  alternative: Cristo
  rationale: Ginagamit dito ang Χριστός bilang titulo. Pinananatili ng “Mesiyas” ang semantikong laman nito nang hindi binabago ang pahayag tungkol sa sama-samang katawan.
- issue: Diwa ng ἐκ μέρους sa καὶ μέλη ἐκ μέρους
  choice: 'distributibo: “bawat isa ay bahagi nito”'
  alternative: “mga bahagi ayon sa kani-kaniyang bahagi” / “mga bahagi nang paisa-isa”
  rationale: Ipinakikita ng agarang konteksto ang iisang katawan at maraming bahagi. Nililinaw ng salin ang indibiduwal na pakikibahagi sa kabuuan, ngunit itinatala sa talababa ang mas literal na anyo upang mapanatili ang tekstuwal na lapit.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “kayo” para sa maramihang kausap at “bahagi” upang manatiling buhay ang metapora ng katawan. Ang “nga” ay banayad na naghuhudyat ng paglalapat mula sa naunang talakayan.
