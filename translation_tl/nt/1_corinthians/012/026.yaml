  source_fidelity: Tumpak na naihahatid ng salin ang dalawang magkatapat na kondisyon, ang pagdurusa ng isang bahagi at pakikidusa ng lahat, gayundin ang pagpaparangal sa isang bahagi at pakikigalak ng lahat. Ang “bahagi” ay angkop sa metapora ng katawan, at ang “pinararangalan” ay mahusay na kontekstuwal na salin ng δοξάζεται.
  naturalness: Ang “kasama nitong nagdurusa ang lahat ng bahagi” ay hindi likas at may di-gaanong malinaw na ugnayang panghalip sa modernong Tagalog. Mas tuwiran at natural ang “nakikidusa ang lahat ng bahagi.”
  terminology: Konsistent ang “bahagi” para sa μέλος. Ang “pinararangalan” ay angkop para sa δοξάζεται sa kontekstong ito. Pinananatili ng talababa ang “niluluwalhati” bilang leksikal na alternatibo nang hindi ipinipilit ang mas teknikal na pakahulugan.
  issues:
