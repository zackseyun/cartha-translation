    issue: Hindi likas ang pariralang “kasama nitong nagdurusa ang lahat ng bahagi.”
    rationale: Bagaman nilalayon nitong isalin ang συμπάσχει, ang ayos at panghalip na “nitong” ay mabigat at maaaring lumabo ang tinutukoy. Ang “nakikidusa ang lahat ng bahagi” ay malinaw na naghahayag ng sama-samang pagdurusa.
  - severity: low
    issue: Mas mabuting itugma ang talababa sa “lahat ng bahagi” kaysa “buong katawan.”
    rationale: Ang “buong katawan” ay makatwirang implikasyon ng metapora, ngunit ang Griyego at mismong salin ay tahasang nagsasabing “lahat ng bahagi.” Ang pagbabago ay nagpapanatili ng mas malapit na pagtutugma.
