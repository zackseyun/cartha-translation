  yaml_path: translation/nt/1_corinthians/012/026.yaml
  text: And if one member suffers[a], all the members suffer with it; if a member is honored, all the members rejoice with it.
translation:
  language: tl
  text: At kung nagdurusa ang isang bahagi, nakikidusa ang lahat ng bahagi; kung pinararangalan[a] ang isang bahagi, nakikigalak dito ang lahat ng bahagi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “niluluwalhati.” Sa kontekstong ito, malamang na ang diwa ay tumatanggap ng karangalan ang isang bahagi, at nakikibahagi sa galak ang lahat ng bahagi.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε … εἴτε
  choice: kung … kung
  rationale: Likas sa modernong Tagalog ang inuulit na “kung” para sa dalawang magkatapat na kalagayan, at napapanatili nito ang puwersa ng paghaharap ng mga sitwasyon.
- source_word: πάσχει
  choice: nagdurusa
  rationale: Malawak ang saklaw ng pandiwa at hindi nito nililimitahan ang dinaranas sa pisikal na sakit lamang.
- source_word: ἓν μέλος / μέλος
  choice: isang bahagi
  rationale: Sa talinghaga ng katawan, mas natural at malinaw sa karaniwang Tagalog ang “bahagi” kaysa “miyembro,” na maaaring magpahina sa larawang anatomikal.
- source_word: συμπάσχει
  choice: kasama nitong nagdurusa
  rationale: Ipinahahayag ang diwa ng tambalang pandiwa na ang ibang mga bahagi ay nakikibahagi sa pagdurusa ng isang bahagi.
- source_word: πάντα τὰ μέλη
  choice: lahat ng bahagi
  rationale: Pinananatili ang pag-uulit at ang talinghaga ng iisang katawan.
- source_word: δοξάζεται
  choice: pinararangalan
  rationale: Sa konteksto ng malasakit at ugnayan ng mga bahagi ng katawan, tumutukoy ito nang likas sa pagtanggap ng karangalan, bagaman maaari ring isalin nang mas literal bilang “niluluwalhati.”
- source_word: συγχαίρει
  choice: nakikigalak dito
  rationale: Malinaw na ipinahahayag ang sama-samang galak at ang pakikiisa sa bahaging pinararangalan.
theological_decisions:
- issue: Kahulugan ng δοξάζεται sa talinghaga ng katawan
  choice: pinararangalan
  alternative: niluluwalhati
  rationale: Ang agarang konteksto ay ang magkasamang malasakit at pakikiisa ng mga bahagi ng katawan. Ang “pinararangalan” ang pinakamalinaw na kahulugan dito, habang inilalagay sa talababa ang mas literal na alternatibo upang hindi maitago ang lawak ng salitang Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang pag-uulit, pagtutulad ng katawan, at magkatapat na diwa ng pakikiramay at pakikigalak.
