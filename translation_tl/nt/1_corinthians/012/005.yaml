translation:
  language: tl
  text: At may iba’t ibang uri ng paglilingkod[a], at iisa rin ang Panginoon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga paglilingkod” o “mga anyo ng paglilingkod.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang payak na pag-uugnay sa magkakatulad na pahayag sa mga talata 4–6.
- source_word: διαιρέσεις
  choice: iba’t ibang uri
  rationale: Ipinahahayag ang pagkakaiba-iba sa loob ng pagkakaisa, hindi ang pagkakahati-hati o alitan.
- source_word: διακονιῶν
  choice: paglilingkod
  rationale: Saklaw ng salitang ito ang mga gawain at anyo ng paglilingkod; likas at malinaw ito sa modernong Filipino nang hindi ipinapalagay na mga pormal na katungkulan lamang ang tinutukoy.
- source_word: εἰσιν
  choice: may
  rationale: Natural na paraang Filipino upang ipahayag ang pag-iral ng iba’t ibang uri ng paglilingkod.
- source_word: ὁ αὐτὸς
  choice: iisa
  rationale: Sa Filipino, malinaw na ipinakikita ng “iisa” na ang Panginoon ay siya ring Panginoon sa kabila ng iba’t ibang paglilingkod, at umaayon ito sa padron ng mga talata 4–6.
- source_word: κύριος
  choice: Panginoon
  rationale: Karaniwang salin ng titulong κύριος at pinananatili ang bigat nitong teolohikal nang hindi tahasang dinaragdagan ang tinutukoy nito.
theological_decisions:
- issue: Ang tinutukoy ng “Panginoon” sa tatluhang padron ng 1 Corinto 12:4–6
  choice: Pinanatili ang titulong “Panginoon” nang walang paliwanag sa pangunahing teksto; sa konteksto, malamang na tumutukoy ito sa Panginoong Jesus.
  alternative: Maaaring unawain bilang mas pangkalahatang pagtukoy sa Panginoon o sa Diyos.
  rationale: Binabanggit ng konteksto ang iisang Espiritu, iisang Panginoon, at iisang Diyos. Pinananatili ng salin ang mismong pagkakasabi ni Pablo at ang bahagyang puwang sa pagtukoy sa halip na tahasang lutasin ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “paglilingkod” bilang pangkalahatang pangngalan upang maiwasan ang posibleng makitid o institusyonal na dating ng “mga ministeryo.” Ang “ngunit” ay natural na nagpapatingkad sa pagkakaiba ng sari-saring paglilingkod at ng iisang Panginoon, bagaman payak na καὶ ang nasa Griyego.
