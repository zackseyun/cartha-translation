translation:
  language: tl
  text: Sapagkat ang katawan ay hindi iisang bahagi lamang, kundi marami.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ γὰρ
  choice: Sapagkat
  rationale: Ipinahihiwatig ng kombinasyon ang paliwanag na kaugnay ng naunang pangangatwiran. Likas sa modernong Tagalog ang “Sapagkat” at naipapahayag nito ang puwersang nagpapaliwanag nang hindi pilit na isinasalin nang hiwalay ang dalawang kataga.
- source_word: τὸ σῶμα
  choice: ang katawan
  rationale: Tuwirang salin ng simuno at pinananatili ang talinghaga ni Pablo sa halip na agad itong ipaliwanag bilang iglesya o katawan ni Cristo.
- source_word: οὐκ ἔστιν
  choice: ay hindi
  rationale: Tuwirang inililipat ang payak na pandiwang nag-uugnay at ang pagtanggi, nang walang idinadagdag na ideyang gaya ng “binubuo ng.”
- source_word: ἓν μέλος
  choice: iisang bahagi lamang
  rationale: Sa Tagalog, ang “bahagi” ang pinakanatural na tawag sa isang sangkap ng katawan sa ganitong paghahambing. Ang “iisang” ay naglilipat sa diin ng ἓν, at ang “lamang” ay likas na nagpapalinaw sa kaibahan sa “marami” nang hindi binabago ang diwa.
- source_word: ἀλλὰ πολλά
  choice: kundi marami
  rationale: Ang πολλά ay ginamit bilang pangngalang pang-uri, at nauunawaan mula sa naunang parirala na tumutukoy ito sa maraming bahagi. Pinananatili ng maikling “kundi marami” ang elipsis ng Griyego habang malinaw pa rin sa Tagalog.
theological_decisions:
- issue: Ang tinutukoy ng talinghagang “ang katawan”
  choice: Panatilihin ang “ang katawan” nang hindi pinalalawak sa “katawan ni Cristo.”
  alternative: ang katawan ni Cristo
  rationale: Bagaman ang mas malawak na konteksto ay tumutukoy sa iglesya bilang katawan ni Cristo, “ang katawan” lamang ang nasa talatang ito. Ang pagpapalawak nito ay maglalagay ng kontekstuwal na interpretasyon sa mismong salin.
translation_notes:
  register: Modernong Filipino Tagalog na payak, marangal, at madaling maunawaan. Ginamit ang “bahagi” sa halip na mas teknikal o di-likas na “sangkap,” habang pinananatili ang larawan ng katawan at ang maikling kaayusan ng orihinal.
