base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/011.yaml
  text: But one and the same Spirit works all these things[d][c][b][a], distributing to each one individually just as he wills.
translation:
  language: tl
  text: Ngunit ang lahat ng ito ay ginagawa ng iisa at siya ring Espiritu,[a] na namamahagi nang bukod-bukod sa bawat isa ayon sa kanyang kalooban.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isinasagawa” o “pinangyayari.” Binibigyang-diin ng “iisa at siya ring Espiritu” na iisa ang pinagmumulan ng magkakaibang kaloob.
    reason: lexical_alternative
  - marker: b
    text: O “ayon sa kanyang pasiya” o “ayon sa kanyang pinipili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα δὲ ταῦτα
  choice: Ngunit ang lahat ng ito
  rationale: Pinananatili ng “lahat ng ito” ang kabuuan ng mga kaloob na kababanggit lamang. Ang δέ ay isinaling “Ngunit” bilang banayad na paglipat at pagtutol mula sa pagkakaiba-iba ng mga kaloob tungo sa iisang pinagmumulan ng mga ito.
- source_word: ἐνεργεῖ
  choice: ginagawa
  rationale: Ipinapahayag ng pandiwa ang aktibong pagkilos o pagsasakatuparan. Ang “ginagawa” ay malinaw at likas sa modernong Tagalog, at hindi labis na nagtatakda kung paano kumikilos ang Espiritu.
- source_word: τὸ ἓν καὶ τὸ αὐτὸ πνεῦμα
  choice: ang iisa at siya ring Espiritu
  rationale: Binibigyang-diin ng Griyego na ang magkakaibang kaloob ay nagmumula sa mismong iisang Espiritu. Ang “iisa at siya ring” ay natural na Tagalog na nagpapanatili sa diin ng pagkakakilanlan at pagkakaisa.
- source_word: διαιροῦν
  choice: na namamahagi
  rationale: Ang participle ay nagpapaliwanag kung paano kumikilos ang Espiritu. Ang “namamahagi” ay angkop sa pagbibigay ng mga kaloob at pinananatili ang diwa ng paglalaan nang walang negatibong pahiwatig ng paghahati.
- source_word: ἰδίᾳ ἑκάστῳ
  choice: sa bawat isa
  rationale: Sapat na ipinahihiwatig ng distributibong pariralang “sa bawat isa” na ang pamamahagi ay indibidwal; ang pagdaragdag ng “nang paisa-isa” ay magiging mabigat at kalabisan sa natural na Tagalog.
- source_word: καθὼς βούλεται
  choice: ayon sa kanyang pasiya
  rationale: Ipinapahayag nito na ang pamamahagi ay ayon sa sariling kalooban o pagpili ng Espiritu. Ang “ayon sa kanyang pasiya” ay natural at marangal, at pinananatili ang sinadyang personal na pagkilos nang hindi nililimitahan ang pandiwa sa pagnanais lamang.
theological_decisions:
- issue: Ang tinutukoy ng πνεῦμα at ang personal na pagkilos sa βούλεται
  choice: Ang “Espiritu” ay tumutukoy sa Banal na Espiritu, at ang “kanyang pasiya” ay nagpapahayag ng personal na pagkukusa nito nang hindi gumagamit ng panghalip na may kasariang panlalaki.
  alternative: “ayon sa nais niya” o “ayon sa kalooban niya”
  rationale: Bagaman walang gramatikal na kasariang katumbas sa Tagalog para sa πνεῦμα, malinaw na iniuugnay ng βούλεται sa Espiritu ang pagkukusa at pagpapasiya. Ang “kanyang” ay natural sa Tagalog at hindi nag-aangkat ng usapin tungkol sa kasariang gramatikal, habang pinananatili ang personal na ahensiya sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Iniwasan ang mabigat na “nang paisa-isa sa bawat isa” dahil taglay na ng “sa bawat isa” ang indibidwal na diwa. Ginamit ang “Espiritu” na may malaking titik dahil ang konteksto ay tumutukoy sa Banal na Espiritu.
