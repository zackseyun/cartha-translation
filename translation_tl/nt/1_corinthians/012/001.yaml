  text: Concerning spiritual gifts, brothers, I do not want you to be uninformed.
translation:
  language: tl
  text: Tungkol naman sa mga kaloob na espirituwal[a], mga kapatid[b], ayaw kong hindi ninyo malaman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga bagay na espirituwal.” Mas malawak ang pariralang Griyego kaysa sa “mga kaloob,” bagaman nakatuon ang kabanatang ito sa mga kaloob na ibinibigay ng Espiritu.
    reason: alternative_reading
  - marker: b
    text: Panlalaking maramihan ang salitang Griyego, ngunit ginagamit ito ni Pablo bilang tawag sa kongregasyon at malamang na kabilang dito ang mga babae.
    reason: cultural_note
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Tungkol naman sa
  rationale: Ipinakikilala nito ang panibagong paksa; natural na naihahatid ng “naman” ang banayad na paglipat na ipinahihiwatig ng δέ nang hindi ito ginagawang temporal na “ngayon.”
- source_word: τῶν πνευματικῶν
  choice: mga kaloob na espirituwal
  rationale: Substantibadong pang-uri ang pariralang Griyego at maaaring tumukoy nang mas malawak sa “mga bagay na espirituwal.” Gayunman, nakatuon ang kasunod na konteksto sa mga kaloob at pagpapahayag na mula sa Espiritu, kaya malinaw at natural dito ang “mga kaloob na espirituwal”; pinananatili sa talababa ang mas malawak na diwa.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Ang “mga kapatid” ang natural at marangal na katawagan sa Filipino para sa kongregasyon. Hindi nito itinatakda ang kasarian, bagaman panlalaking maramihan ang anyong Griyego; nililinaw ito sa talababa.
- source_word: οὐ θέλω ὑμᾶς ἀγνοεῖν
  choice: ayaw kong wala kayong kaalaman
  rationale: Natural nitong ipinahahayag ang idyomang tumutukoy sa hangarin ni Pablo na huwag silang manatiling walang alam, nang walang mapanlait na dating ng ilang mas literal na salita.
theological_decisions:
- issue: Kahulugan ng τῶν πνευματικῶν
  choice: mga kaloob na espirituwal
  alternative: mga bagay na espirituwal; mga taong espirituwal
  rationale: Hindi tahasang naroon sa Griyego ang salitang “kaloob,” at nananatiling malawak ang anyo ng parirala. Gayunman, ang 12:4–11 ay tumatalakay sa sari-saring kaloob at pagpapahayag na ibinibigay ng Espiritu. Kaya ginamit ang kontekstuwal na diwa sa pangunahing teksto habang tahasang pinananatili sa talababa ang tunay na kalabuan.
translation_notes:
  register: Makabagong Filipino na natural, malinaw, at marangal. Ginamit ang “mga kapatid” bilang karaniwang inklusibong katawagan sa Filipino, habang ipinaliliwanag sa talababa ang anyong panlalaki ng Griyego. Lahat ng marker na [a] at [b] ay nasa pangunahing teksto.
