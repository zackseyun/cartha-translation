  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀ἑτέρῳ πίστις ἐν τῷ αὐτῷ πνεύματι, ⸀ἄλλῳ χαρίσματα ἰαμάτων ἐν τῷ ⸀ἑνὶ πνεύματι,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/009.yaml
  text: to another[a], faith by the same Spirit; to another, gifts of healings by the one Spirit[b],
translation:
  language: tl
  text: sa isa naman, pananampalataya[a] sa pamamagitan ng parehong Espiritu; at sa iba naman, mga kaloob ng mga pagpapagaling sa pamamagitan ng iisang Espiritu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “katapatan” o “pagtitiwala” para sa “pananampalataya” (πίστις).
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “mga kaloob ng mga pagpapagaling”; kapwa maramihan ang dalawang pangngalan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑτέρῳ
  choice: sa isa naman
  rationale: Ipinagpapatuloy ng datibong isahan ang pamamahagi ng mga kaloob mula sa naunang talata. Likas sa Tagalog ang “sa isa naman” at hindi nito labis na idinidiin ang posibleng pagkakaiba ng ἕτερος at ἄλλος.
- source_word: πίστις
  choice: pananampalataya
  rationale: Ito ang karaniwang katumbas ng πίστις sa sulat ni Pablo. Sa kontekstong ito, tumutukoy ito sa isang kaloob na mula sa Espiritu, ngunit hindi nililimitahan ng salin ang eksaktong anyo nito.
- source_word: ἐν τῷ αὐτῷ πνεύματι
  choice: sa pamamagitan ng iisang Espiritu
  rationale: Ang ἐν na may datibo ay nauunawaan dito bilang pagpapahayag ng kasangkapan o ahensiya. Ang “iisang Espiritu” ay likas sa Tagalog at pinananatili ang diin sa pagkakaisa.
- source_word: ἄλλῳ
  choice: sa iba naman
  rationale: Ipinagpapatuloy nito ang distributibong ayos. Ang “sa iba naman” ay malinaw at natural nang hindi pilit na lumilikha ng matalas na pagkakaiba sa naunang ἑτέρῳ.
- source_word: χαρίσματα
  choice: mga kaloob
  rationale: Pinananatili ang maramihang anyo at ang diwa ng mga biyayang ipinagkaloob.
- source_word: ἰαμάτων
  choice: ng mga pagpapagaling
  rationale: Pinananatili ang maramihang anyo ng Griyego, bagaman mas karaniwan sa Tagalog ang pang-isahang “pagpapagaling.”
- source_word: ἐν τῷ ἑνὶ πνεύματι
  choice: sa pamamagitan ng nag-iisang Espiritu
  rationale: Ipinapahayag ang ahensiya ng Espiritu at sinusunod ang ἑνί, na bahagyang naiiba sa naunang αὐτῷ. Ang “nag-iisang” ay nagtatampok na isa lamang ang Espiritu.
theological_decisions:
- issue: Kahulugan ng πίστις sa konteksto ng mga kaloob ng Espiritu
  choice: pananampalataya
  alternative: katapatan; pagtitiwala
  rationale: Pinananatili ang malawak na karaniwang kahulugan ng πίστις at hindi ipinapasok ang isang partikular na doktrina tungkol sa likas o pagpapatuloy ng kaloob na ito. Inilalahad sa talababa ang tunay na leksikal na mga alternatibo.
- issue: Tinutukoy ng πνεύματι
  choice: Espiritu, na tumutukoy sa Banal na Espiritu
  alternative: espiritu
  rationale: Malinaw sa 1 Corinto 12 at sa paulit-ulit na pormula ng pamamahagi ng mga kaloob na ang Banal na Espiritu ang tinutukoy. Ang malaking titik ay nagpapakita ng reperensiyang ito nang walang idinaragdag na sektaryang paliwanag.
- issue: Pagkakaiba ng αὐτῷ at ἑνὶ
  choice: iisang Espiritu; nag-iisang Espiritu
  alternative: parehong Espiritu; iisang Espiritu
  rationale: 'Pinananatili ang bahagyang pagbabago ng pananalita sa Griyego: αὐτῷ ay “iisang” sa kahulugang siya ring Espiritu, samantalang ἑνὶ ay tahasang “isa.” Hindi nito ipinahihiwatig na magkaiba ang tinutukoy.'
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang “sa isa naman … sa iba naman” upang maging natural ang distributibong balangkas. Sadyang pinanatili ang medyo di-karaniwang maramihang “mga pagpapagaling” dahil kapwa maramihan ang χαρίσματα at ἰαμάτων sa Griyego.
