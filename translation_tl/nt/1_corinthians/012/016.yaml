  to: At kung magsabi ang tainga[a], “Dahil hindi ako mata, hindi ako bahagi ng katawan,” hindi iyon dahilan upang hindi ito maging bahagi ng katawan.
  rationale: Inayos ang kundisyunal na pandiwa upang maging wastong modernong Tagalog at pinalitan ang “hindi na ito bahagi” ng “hindi ito maging bahagi” upang huwag magdagdag ng ideyang hindi na kabilang. Napanatili ang personipikasyon, lohikang retorikal, at pag-uulit ng “bahagi ng katawan.”
