base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/016.yaml
  text: And if the ear says[a], ‘Because I am not an eye, I am not of the body,’ it is not for this reason not of the body.
translation:
  language: tl
  text: At kung magsabi ang tainga[a], “Dahil hindi ako mata, hindi ako bahagi ng katawan,” hindi iyon dahilan upang hindi ito maging bahagi ng katawan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, inuulit ang pariralang literal na nangangahulugang “mula sa katawan.” Sa kontekstong ito, ang diwa ay “bahagi ng katawan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Payak na pang-ugnay ito sa naunang halimbawa tungkol sa mga bahagi ng katawan.
- source_word: ἐὰν εἴπῃ
  choice: kung sabihin
  rationale: Ipinahahayag ng ἐὰν na may aorist subjunctive ang isang pangkalahatang haka-hakang kalagayan; natural sa Tagalog ang “kung sabihin.”
- source_word: τὸ οὖς
  choice: ang tainga
  rationale: Karaniwang katawagang anatomikal at pinatatao sa paghahalintulad.
- source_word: Ὅτι
  choice: Dahil
  rationale: Ipinakikilala nito ang nilalaman ng sinabi ng tainga at ang dahilang ibinibigay nito.
- source_word: ὀφθαλμός
  choice: mata
  rationale: Tuwirang katumbas na anatomikal; hindi kailangan ng pantukoy sa panaguring Tagalog.
- source_word: ἐκ τοῦ σώματος
  choice: bahagi ng katawan
  rationale: Sa kontekstong ito, ang ἐκ ay tumutukoy sa pagiging kabilang sa katawan. Mas natural at malinaw ito kaysa sa literal ngunit di-likas na “mula sa katawan,” habang inuulit sa dalawang sugnay ang parehong parirala.
- source_word: οὐ παρὰ τοῦτο
  choice: hindi iyon nangangahulugang
  rationale: Natural na Tagalog na itinatanggi na ang naunang dahilan ay humahantong sa ipinapalagay na konklusyon.
- source_word: οὐκ ἔστιν ἐκ τοῦ σώματος
  choice: hindi na ito bahagi ng katawan
  rationale: Pinananatili ang negatibong pasubali at ang pag-uulit ng “bahagi ng katawan”; ipinakikita ng “na” ang ipinapalagay na bunga nang hindi nagdaragdag ng doktrinal na paliwanag.
theological_decisions:
- issue: Pagpapakinis sa retorika ng talinghaga tungkol sa katawan
  choice: Panatilihin ang pag-uulit ng “bahagi ng katawan” ngunit ipahayag ang lohika sa natural na Tagalog.
  alternative: “hindi dahil dito ay hindi ito mula sa katawan”
  rationale: 'Ang napakaliteral na alternatibo ay malabo at di-likas sa Tagalog. Ang pinili ay malinaw na nagpapanatili sa punto: ang nadaramang pagkakaiba ng isang bahagi ay hindi nag-aalis ng pagkalakip nito sa katawan, nang hindi pinalalawak ang eklesiyolohikal na paliwanag.'
translation_notes:
  register: Modernong Filipino na natural, marangal, at madaling maunawaan. Pinanatili ang personipikasyon ng tainga at ang retorikal na pag-uulit, ngunit iniwasan ang alanganing literalismo ng “mula sa katawan.”
