  text: καὶ γὰρ ἐν ἑνὶ πνεύματι ἡμεῖς πάντες εἰς ἓν σῶμα ἐβαπτίσθημεν, εἴτε Ἰουδαῖοι εἴτε Ἕλληνες, εἴτε δοῦλοι εἴτε ἐλεύθεροι, καὶ ⸀πάντες ἓν πνεῦμα ἐποτίσθημεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/013.yaml
  text: For indeed[a], in one Spirit we all were baptized into one body—whether Jews or Greeks[c][b], whether servants or free—and we all were given to drink one Spirit.
translation:
  language: tl
  text: Sapagkat sa iisang Espiritu[a], tayong lahat ay binautismuhan tungo sa iisang katawan—maging mga Judio man o mga Griyego, maging mga alipin man o mga malaya—at tayong lahat ay pinainom ng iisang Espiritu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pamamagitan ng iisang Espiritu.” Maaaring tumukoy ang salitang Griyego sa saklaw o kalagayan (“sa”) o sa paraan o ahensiya (“sa pamamagitan ng”).
    reason: alternative_reading
  - marker: b
    text: Maaaring isalin ang huling bahagi na “at tayong lahat ay binigyan ng iisang Espiritu upang inumin.” Maaari ring basahing “iisang espiritu,” bagaman malakas na itinuturo ng konteksto ang Banal na Espiritu.
    reason: lexical_and_alternative_reading
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Sapagkat
  rationale: Likas na ipinahahayag sa Tagalog ang paliwanag na ugnayan ng γὰρ; ang diin ng καί ay naihahatid ng kabuuang pangungusap nang hindi nagiging mabigat ang pananalita.
- source_word: ἐν ἑνὶ πνεύματι
  choice: sa iisang Espiritu
  rationale: Pinananatili ng “sa” ang posibleng diwang saklaw o kalagayan ng ἐν, habang hindi isinasara ang posibilidad na instrumento o ahensiya ang tinutukoy; nakatala ang alternatibo sa talababa.
- source_word: ἡμεῖς πάντες
  choice: tayong lahat
  rationale: Pinananatili ang tahasang kolektibo at mariing diin ng panghalip kasama ng πάντες.
- source_word: ἐβαπτίσθημεν
  choice: ay binautismuhan
  rationale: Karaniwan at angkop na salin ng pasibong βαπτίζω sa kontekstong eklesyal; hindi nito ipinapasok ang isang partikular na paraan ng bautismo.
- source_word: εἰς ἓν σῶμα
  choice: tungo sa iisang katawan
  rationale: Ipinahahayag ng “tungo sa” ang direksiyon o bunga ng εἰς—ang pagkakaugnay sa iisang katawan—habang pinananatili ang larawan ni Pablo.
- source_word: Ἰουδαῖοι ... Ἕλληνες
  choice: mga Judio ... mga Griego
  rationale: Pinananatili ang tahasang pangkat-etnikong paghahambing sa Griyego sa halip na palawakin ang Ἕλληνες bilang lahat ng mga Hentil.
- source_word: δοῦλοι ... ἐλεύθεροι
  choice: mga alipin ... mga malaya
  rationale: Ang magkatambal na mga termino ay tumutukoy sa malinaw na kalagayang panlipunan at legal; “alipin” ang tumpak na katapat ng bonded status.
- source_word: ἐποτίσθημεν
  choice: ay pinainom
  rationale: Natural na Tagalog na nagpapanatili sa pasibong diwa ng “binigyan o pinangyaring uminom” at sa metapora ng sama-samang pakikibahagi.
- source_word: ἓν πνεῦμα
  choice: iisang Espiritu
  rationale: Malakas na itinuturo ng kaagapay na unang sugnay at ng konteksto ang Banal na Espiritu; ang “iisang” ay natural na nagdiriin sa pagkakaisa.
theological_decisions:
- issue: Kung ang ἐν ἑνὶ πνεύματι ay nangangahulugang nasa saklaw ng Espiritu o sa pamamagitan ng Espiritu
  choice: sa iisang Espiritu
  alternative: sa pamamagitan ng iisang Espiritu
  rationale: Maaaring magpahiwatig ang ἐν ng saklaw, paraan, o ahensiya. Ang “sa” ang pinakamalapit na maikling anyo na hindi dogmatikong nagpapasiya sa tunay na kalabuan; inilalahad ang instrumental na pagbasa sa talababa.
- issue: Kung ang ikalawang ἓν πνεῦμα ay ang Banal na Espiritu o isang magkakasalong espirituwal na realidad
  choice: iisang Espiritu
  alternative: iisang espiritu
  rationale: Ang agarang konteksto ng nagkakaisang gawain ng Espiritu ay higit na pumapabor sa Banal na Espiritu, ngunit kinikilalang interpretatibo ang malaking titik.
- issue: Ang panlipunang katayuan sa δοῦλοι ... ἐλεύθεροι
  choice: mga alipin ... mga malaya
  alternative: mga lingkod ... mga taong malaya
  rationale: Dahil tahasang ikinokontra ang pagkaalipin sa kalayaan, kailangang ipakita ang bonded status at hindi lamang pangkalahatang paglilingkod.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “Judio,” “Griego,” at “alipin” para sa tumpak at kasalukuyang bokabularyo; iniwasan ang makalumang “Griyego” bilang pangngalang pantukoy sa tao at ang malabong “lingkod.”
