base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/018.yaml
  text: But as it is[a], God arranged the members, each one of them[b], in the body just as he desired.
translation:
  language: tl
  text: Ngunit ang totoo, inayos ng Diyos ang bawat bahagi sa katawan ayon sa kanyang kalooban.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “gaya ng kanyang ninais.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Ngunit ang totoo
  rationale: Ipinahahayag nito ang pagsalungat sa mga naunang haka-haka at ang pagbabalik sa aktuwal na kalagayan; mas malinaw ito kaysa sa temporal na “ngunit ngayon.”
- source_word: ὁ θεὸς
  choice: ang Diyos
  rationale: Tuwirang salin ng simuno; natural sa Tagalog ang pantukoy na “ang.”
- source_word: ἔθετο
  choice: inayos
  rationale: Sa talinghaga ng katawan, ipinahihiwatig ng pandiwa hindi lamang ang paglalagay kundi ang sinasadyang pagsasaayos ng mga bahagi sa kabuuan.
- source_word: τὰ μέλη
  choice: ang mga bahagi
  rationale: Sa modernong Tagalog, natural at madaling maunawaan ang “mga bahagi” para sa magkakaibang bahagi ng katawan; hindi ito nililimitahan sa mga biyas lamang.
- source_word: ἓν ἕκαστον αὐτῶν
  choice: ang bawat isa sa mga ito
  rationale: Pinananatili ang mariing distributibong diwa na ang bawat bahagi ay isa-isang isinasaalang-alang.
- source_word: ἐν τῷ σώματι
  choice: sa katawan
  rationale: Tuwiran at natural na paglalahad ng kinalalagyan sa loob ng talinghaga.
- source_word: καθὼς ἠθέλησεν
  choice: ayon sa kanyang kalooban
  rationale: Pinananatili ang bolisyunal na diwa ng ἠθέλησεν at ang layunin ng Diyos nang hindi gumagamit ng masyadong kaswal na pananalita.
theological_decisions:
- issue: Sinasadyang pagkakaayos ng Diyos sa bawat bahagi ng katawan
  choice: Ipinahahayag na inayos ng Diyos ang bawat bahagi ayon sa kanyang kalooban.
  alternative: Ipinahayag lamang na inilagay ng Diyos ang mga bahagi, nang hindi binibigyang-diin ang layunin o pagkakaayos.
  rationale: Sa konteksto ng argumento ni Pablo, ang pagkakaiba-iba ng mga bahagi ay hindi aksidente. Ang “inayos” at “ayon sa kanyang kalooban” ay nagpapanatili sa diin ng teksto nang hindi pinalalawak ito tungo sa doktrinang hindi tahasang sinasabi ng talata.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mga bahagi” sa halip na mas teknikal o makalumang “mga sangkap,” at pinanatili ang mariing “bawat isa.”
