base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/021.yaml
  text: But the eye cannot say to the hand[a], ‘I have no need of you,’ or again the head to the feet, ‘I have no need of you.’
translation:
  language: tl
  text: Ngunit hindi masasabi ng mata sa kamay, “Hindi kita kailangan,” ni hindi rin masasabi ng ulo sa mga paa, “Hindi ko kayo kailangan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ δύναται
  choice: hindi masasabi
  rationale: Likas na Filipino para sa kawalan ng kakayahang sabihin, hindi lamang sa pagiging di-nararapat nito.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahahayag ang pagsalungat sa konteksto habang natural ang daloy sa Filipino.
- source_word: ὁ ὀφθαλμός
  choice: ang mata
  rationale: Pinananatili ang literal na larawan ng bahagi ng katawan na mahalaga sa talinghaga ni Pablo.
- source_word: τῇ χειρί
  choice: sa kamay
  rationale: Tuwirang ipinapakita ang di-tuwirang layon at pinananatili ang larawan ng katawan.
- source_word: Χρείαν σου οὐκ ἔχω
  choice: Hindi kita kailangan
  rationale: Natural at malinaw na Filipino na tapat sa diwang walang pangangailangan sa kausap; ang “kita” ay wastong tumutukoy sa isahang kamay.
- source_word: ἢ πάλιν
  choice: o gayundin
  rationale: Ipinakikilala ang ikalawang kahalintulad na halimbawa nang hindi ipinahihiwatig ang literal na pag-uulit sa panahon.
- source_word: ἡ κεφαλή
  choice: ang ulo
  rationale: Pinananatili ang literal na talinghaga ng katawan.
- source_word: τοῖς ποσίν
  choice: sa mga paa
  rationale: Malinaw na pinananatili ang maramihang anyo ng Greek.
- source_word: Χρείαν ὑμῶν οὐκ ἔχω
  choice: Hindi ko kayo kailangan
  rationale: Ang “kayo” ay likas na nagpapakita sa Filipino na maramihan ang kausap, kaya naihahayag sa mismong teksto ang pagkakaiba ng σου at ὑμῶν.
theological_decisions:
- issue: Matalinghagang pananalita tungkol sa pagtutulungan ng mga bahagi ng katawan
  choice: Panatilihin ang literal na mga bahagi ng katawan nang walang paliwanag sa pangunahing teksto
  alternative: Tahasang tukuyin ang mga kaanib ng iglesya sa pangunahing teksto
  rationale: Nakabatay sa mismong talinghaga ng katawan ang punto ni Pablo; ang tahasang pagpapaliwanag rito bilang iglesya ay magiging komentaryo sa halip na salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kita” para sa isahang kamay at “kayo” para sa maramihang mga paa, kaya hindi na kailangan ang footnote ng English POB tungkol sa pagkakaiba ng singular at plural na “you.”
