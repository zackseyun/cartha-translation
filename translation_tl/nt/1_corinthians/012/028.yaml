id: 1CO.12.28
reference: 1 Corinthians 12:28
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ οὓς μὲν ἔθετο ὁ θεὸς ἐν τῇ ἐκκλησίᾳ πρῶτον ἀποστόλους, δεύτερον προφήτας, τρίτον διδασκάλους, ἔπειτα δυνάμεις, ⸀ἔπειτα χαρίσματα ἰαμάτων, ἀντιλήμψεις, κυβερνήσεις, γένη γλωσσῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/028.yaml
  text: And God has appointed in the church first apostles[a], second prophets, third teachers, then miracles, then gifts of healings, helps, administrations[c][b], kinds of tongues.
translation:
  language: tl
  text: 'At ang Diyos ay nagtalaga sa iglesya: una, mga apostol; ikalawa, mga propeta; ikatlo, mga guro; pagkatapos, mga himala[a]; pagkatapos, mga kaloob ng pagpapagaling, mga pagtulong, mga pamamahala[b], at iba’t ibang uri ng mga dila[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga makapangyarihang gawa.”
    reason: lexical_alternative
  - marker: b
    text: O “mga pagpatnubay” o “iba’t ibang paraan ng pamumuno.”
    reason: lexical_alternative
  - marker: c
    text: O “iba’t ibang uri ng mga wika.” Ang salitang Griyego ay maaaring mangahulugang “mga dila” o “mga wika”; hindi tahasang nilulutas ng talata ang eksaktong kalikasan ng tinutukoy.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔθετο
  choice: nagtalaga
  rationale: Ipinapahayag nito ang pagkilos ng Diyos sa pagtatalaga ng mga tao at gawain sa iglesya, sa halip na purong pisikal na paglalagay.
- source_word: ἐν τῇ ἐκκλησίᾳ
  choice: sa iglesya
  rationale: Ang “iglesya” ay natural at kinikilalang katawagan sa modernong Filipino para sa nagkakatipong bayan ng Diyos sa kontekstong ito.
- source_word: πρῶτον ... δεύτερον ... τρίτον
  choice: una ... ikalawa ... ikatlo
  rationale: Tuwirang pinananatili ang ayos ng Griyego nang hindi ipinapasiya kung ito ay ranggo, pagkakasunod sa panahon, o diin sa tungkulin.
- source_word: ἀποστόλους
  choice: mga apostol
  rationale: Pinananatili ang kinikilalang katawagan para sa apostolikong papel, hindi lamang ang pangkalahatang kahulugang “mga sugo.”
- source_word: προφήτας
  choice: mga propeta
  rationale: Karaniwan at malinaw na salin para sa mga gumaganap ng propetikong tungkulin.
- source_word: διδασκάλους
  choice: mga guro
  rationale: Natural at tuwirang salin ng tungkuling magturo sa iglesya.
- source_word: δυνάμεις
  choice: mga himala
  rationale: Sa listahan ng mga kaloob, tumutukoy ito sa mga pagpapakita ng kapangyarihan o makapangyarihang gawa. Ang “mga himala” ang pinakamalinaw na modernong salin; nasa talababa ang mas literal na alternatibo.
- source_word: χαρίσματα ἰαμάτων
  choice: mga kaloob ng pagpapagaling
  rationale: Natural sa Filipino at pinananatili ang diwa ng sari-saring kaloob na may kaugnayan sa mga pagpapagaling, bagaman hindi inuulit ang di-natural na maramihang anyo sa bawat pangngalan.
- source_word: ἀντιλήμψεις
  choice: mga pagtulong
  rationale: Ipinahahayag ang mga gawa o kakayahang umalalay at tumulong sa iba nang hindi ito ginagawang isang tiyak na opisina.
- source_word: κυβερνήσεις
  choice: mga pamamahala
  rationale: Sinasaklaw nito ang pagpatnubay, pangangasiwa, at pag-oorganisa nang hindi labis na ipinapalagay ang isang herarkikal na katungkulan.
- source_word: γένη γλωσσῶν
  choice: iba’t ibang uri ng mga wika
  rationale: Malinaw at natural sa Filipino. Dahil ang γλῶσσα ay maaari ring literal na “dila” at ang eksaktong uri ng penomenon ay pinagtatalunan, pinananatili sa talababa ang alternatibong katawagan at ang ambiguwidad.
theological_decisions:
- issue: Kung ang pagkakasunod ay permanenteng ranggo, kronolohikal na ayos, o retorikal na diin
  choice: Panatilihin lamang ang “una ... ikalawa ... ikatlo ... pagkatapos ... pagkatapos.”
  alternative: Ipaliwanag ito bilang herarkiya ng awtoridad, kronolohikal na paglitaw, o antas ng kahalagahan.
  rationale: Malinaw na may ayos ang listahan, ngunit hindi tahasang sinasabi ng talata kung anong uri ng ayos ito. Hindi nagdaragdag ang salin ng interpretasyong wala sa teksto.
- issue: Ang kahulugan ng γλῶσσαι sa kontekstong ito
  choice: Gamitin ang “mga wika” sa pangunahing teksto at ipakita sa talababa ang “mga dila” at ang saklaw ng salitang Griyego.
  alternative: Gamitin lamang ang “mga dila” o tahasang tukuyin itong karaniwang mga wikang pantao.
  rationale: Mas natural sa Filipino ang “mga wika,” ngunit hindi dapat tahasang ipasiya ng salin ang eksaktong kalikasan ng kaloob. Pinananatili ng talababa ang tunay na leksikal at teolohikal na usapin.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “iglesya,” “apostol,” at “propeta” bilang mga kilala at natural na katawagang biblikal. Ang bantas sa listahan ay nagpapalinaw sa pagkakasunod nang hindi nagdaragdag ng paliwanag tungkol sa ranggo.
