  text: ᾧ μὲν γὰρ διὰ τοῦ πνεύματος δίδοται λόγος σοφίας, ἄλλῳ δὲ λόγος γνώσεως κατὰ τὸ αὐτὸ πνεῦμα,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/008.yaml
  text: For to one is given through the Spirit a message of wisdom[a], and to another a message of knowledge according to the same Spirit[c][b],
translation:
  language: tl
  text: Sapagkat sa isa ay ibinibigay sa pamamagitan ng Espiritu ang mensahe ng karunungan[a], at sa iba naman ay ang mensahe ng kaalaman[b], ayon sa Espiritu ring iyon.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “salita ng karunungan” o “pahayag ng karunungan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “salita ng kaalaman” o “pahayag ng kaalaman.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “sa pamamagitan ng Espiritu ring iyon.” Iba ang pang-ukol sa Griyego rito kaysa sa naunang “sa pamamagitan ng Espiritu”; maaaring idiin nito ang pagkakaayon sa iisang Espiritu bilang pinagmumulan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ μὲν ... ἄλλῳ δὲ
  choice: sa isa ... sa iba naman
  rationale: Likas na ipinahahayag sa Tagalog ang pamamahagi at pagtutulad-pagsalungat ng dalawang datibong anyo, nang hindi na inuulit ang salitang 'tao.'
- source_word: διὰ τοῦ πνεύματος
  choice: sa pamamagitan ng Espiritu
  rationale: Pinananatili nito ang diwa ng διά na may genitive bilang paraan o tagapamagitan.
- source_word: δίδοται
  choice: ay ibinibigay
  rationale: 'Pinananatili ang pangkasalukuyang balintiyak: ang kaloob ay ipinagkakaloob, hindi sariling nalilikha.'
- source_word: λόγος σοφίας
  choice: mensahe ng karunungan
  rationale: Sa konteksto, ang λόγος ay isang ipinahahayag na mensahe o pananalita, hindi lamang isang salita; natural ito sa modernong Tagalog habang pinananatili ang ugnayang genitibo.
- source_word: λόγος γνώσεως
  choice: mensahe ng kaalaman
  rationale: Pinananatili ang paralelismo sa λόγος σοφίας at malinaw na isinasalin ang γνώσεως bilang 'ng kaalaman.'
- source_word: κατὰ τὸ αὐτὸ πνεῦμα
  choice: ayon sa Espiritu ring iyon
  rationale: Pinananatili ang natatanging diwa ng κατά bilang pagkakaayon at hindi ito ipinapantay nang tahimik sa naunang διά; ang 'ring iyon' ay tumutukoy sa iisang Espiritu.
theological_decisions:
- issue: Tinutukoy ng πνεύματος / πνεῦμα
  choice: Espiritu, na nauunawaang Banal na Espiritu
  alternative: espiritu ng tao
  rationale: Ang agarang konteksto ng 1 Corinto 12 ay tungkol sa iisang Espiritu na namamahagi ng iba't ibang kaloob. Ang malaking titik ay nagpapakita ng kontekstuwal na tinutukoy nang walang pagdaragdag sa teksto.
- issue: Kahulugan ng λόγος sa mga pahayag na λόγος σοφίας at λόγος γνώσεως
  choice: mensahe
  alternative: salita o pahayag
  rationale: Ipinahihiwatig ng konteksto ang isang ipinahahayag na komunikasyon. Gayunman, pinananatili sa mga talababa ang tunay na lawak ng λόγος at ang nakaugaliang saling 'salita.'
- issue: Pagkakaiba ng διά at κατά
  choice: sa pamamagitan ng ... ayon sa
  alternative: sa pamamagitan ng ... sa pamamagitan ng / mula sa
  rationale: Hindi pinapawi ang retorikal at semantikong pagkakaiba ng dalawang pang-ukol. Ang κατά ay maaaring magpahiwatig ng pagkakaayon sa iisang Espiritu, bagaman sa konteksto ay maaari rin itong maunawaan bilang pagkilos sa kapangyarihan o batayan ng Espiritu.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang 'mensahe' para sa natural na pagpapahayag, habang inilagay sa talababa ang mas literal at tradisyonal na 'salita' at ang alternatibong 'pahayag.'
