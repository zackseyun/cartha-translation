  text: εἰ ὅλον τὸ σῶμα ὀφθαλμός, ποῦ ἡ ἀκοή; εἰ ὅλον ἀκοή, ποῦ ἡ ὄσφρησις;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/017.yaml
  text: If the whole body were an eye[a], where would the hearing be? If the whole were hearing, where would the sense of smell be?
translation:
  language: tl
  text: Kung ang buong katawan ay isang mata[a], nasaan ang pandinig? Kung ang buong katawan naman ay pandinig, nasaan ang pang-amoy?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nasaan ang tainga? … nasaan ang ilong?” Mas literal na tinutukoy ng Griyego ang mga kakayahang makarinig at makaamoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅλον τὸ σῶμα
  choice: ang buong katawan
  rationale: Likas at tuwirang salin ito na pinananatili ang larawan ni Pablo tungkol sa katawan bilang isang kabuuan.
- source_word: ὀφθαλμός
  choice: isang mata
  rationale: Ang “isang mata” ay natural na panaguring pangngalan sa Filipino at pinananatili ang isahang sangkap ng katawan sa paghahambing.
- source_word: ποῦ
  choice: nasaan
  rationale: Tuwirang ipinahahayag ng “nasaan” ang retorikal na tanong sa loob ng ipinapalagay na kalagayan; malinaw na ang diwa ng kondisyon mula sa “kung.”
- source_word: ἀκοή
  choice: pandinig
  rationale: Tumutukoy ang salitang Griyego sa kakayahan o pandama ng pagdinig, hindi tuwiran sa tainga bilang bahagi ng katawan.
- source_word: ὅλον
  choice: ang buong katawan
  rationale: Bagaman eliptikal ang ikalawang sugnay sa Griyego, inuulit ang “buong katawan” sa Filipino upang maging malinaw at natural ang pangungusap nang hindi binabago ang diwa.
- source_word: ὄσφρησις
  choice: pang-amoy
  rationale: Ang “pang-amoy” ay karaniwang tawag sa kakayahang makaamoy at tumutugma sa pandamang ipinahahayag ng salitang Griyego.
theological_decisions:
- issue: Paglalarawan sa katawan sa pamamagitan ng mga pandama o ng mismong mga sangkap nito
  choice: Isinalin ang ἀκοή at ὄσφρησις bilang “pandinig” at “pang-amoy.”
  alternative: Isalin ang mga ito bilang “tainga” at “ilong” upang maging mas kongkreto ang paghahambing.
  rationale: Mga kakayahang pandama ang tuwirang tinutukoy ng mga pangngalang Griyego, hindi ang anatomikong tainga at ilong. Pinananatili ng salin ang eksaktong tensiyon ng larawan ni Pablo nang hindi ito ginagawang mas kongkreto kaysa sa pinagmulan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang “pandinig” at “pang-amoy” sa halip na teknikal na “pandamang pandinig” at “pandamang pang-amoy.”
