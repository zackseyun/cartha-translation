  source_fidelity: Tumpak na naipapasa ng draft ang paghuhusga ng tao sa mga bahaging itinuturing na mas mababa ang karangalan, ang pagbibigay sa mga ito ng higit na karangalan, at ang kaibhan ng mga bahaging hindi ipinakikita sa publiko. Gayunman, ang “lalo nating pinararangalan” ay mas maluwag kaysa sa tahasang pahambing na “higit na karangalan,” kaya ibinabalik ito sa mas malinaw na anyo.
  naturalness: Likas at angkop ang rehistro para sa makabagong Filipino. Ang “itinuturing nating” ay mas tuwiran at mas natural kaysa sa pagkakahiwalay ng “na sa palagay natin,” at ang “binibigyan natin ng higit na karangalan” ay malinaw na Tagalog.
  terminology: Ang “hindi gaanong marangal” ay pinananatili para sa ἀτιμότερα at ang “hindi angkop ilantad” para sa ἀσχήμονα. Ang “higit na kaaya-ayang anyo” ay angkop na kontekstuwal na salin ng εὐσχημοσύνη, na tumutukoy sa mas maayos o mas presentableng kaanyuan, hindi sa moral na kahalayan.
