id: 1CO.12.23
reference: 1 Corinthians 12:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἃ δοκοῦμεν ἀτιμότερα εἶναι τοῦ σώματος, τούτοις τιμὴν περισσοτέραν περιτίθεμεν, καὶ τὰ ἀσχήμονα ἡμῶν εὐσχημοσύνην περισσοτέραν ἔχει,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/023.yaml
  text: and those parts of the body that we think to be less honorable[a], on these we bestow greater honor, and our unpresentable parts have greater decorum[b],
translation:
  language: tl
  text: At ang mga bahagi ng katawan na itinuturing nating hindi gaanong marangal ay binibigyan natin ng higit na karangalan; at ang mga bahagi nating hindi angkop ilantad[a] ay may higit na kaaya-ayang anyo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi kaaya-ayang ipakita.” Ang salitang Griyego ay tumutukoy sa hindi maayos o hindi nararapat ipakita sa publiko.
    reason: lexical_alternative
  - marker: b
    text: O “higit na kaayusan” o “higit na pagiging kaaya-ayang tingnan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ δοκοῦμεν
  choice: na sa palagay natin
  rationale: Ipinapakita nito na pagtataya ng tao ang tinutukoy, hindi isang obhetibong katangian ng mga bahaging iyon.
- source_word: ἀτιμότερα
  choice: di-gaanong marangal
  rationale: Pinananatili ang pahambing na diwa at ang tuwirang pagtut contrast nito sa τιμή, nang hindi pinatitindi bilang lubusang kahiya-hiya.
- source_word: τοῦ σώματος
  choice: ng katawan
  rationale: Pinananatili ang kongkretong larawan ng katawan na mahalaga sa buong argumento.
- source_word: τούτοις τιμὴν περισσοτέραν περιτίθεμεν
  choice: ay lalo nating pinararangalan
  rationale: Likas sa modernong Tagalog at malinaw na naghahatid ng pagbibigay ng higit na τιμή, bagaman hindi literal na inuulit ang larawang 'ipinapatong' ang karangalan.
- source_word: τὰ ἀσχήμονα ἡμῶν
  choice: ang mga bahagi nating hindi angkop ilantad
  rationale: Ipinahahayag ang panlipunan at pangkatawang diwa ng mga bahaging hindi nararapat ipakita sa publiko, nang hindi agad nilalagyan ng moral na kahulugang 'mahalay.'
- source_word: εὐσχημοσύνην περισσοτέραν ἔχει
  choice: ay may higit na kaaya-ayang anyo
  rationale: Pinananatili ang gramatikal na pahayag na ang mga bahaging ito ay 'may' higit na kaayusan o pagiging presentable, at iniiwasan ang teknikal o di-likas na pananalita.
theological_decisions:
- issue: Kongkretong larawan ng katawan at karangalang panlipunan
  choice: Panatilihin ang pagtukoy sa literal na mga bahagi ng katawan.
  alternative: Tuwirang ipakahulugan ang mga bahagi bilang mga miyembrong mahina o mababa ang katayuan sa iglesya.
  rationale: Nakabatay ang argumento ni Pablo sa paghahambing ng pagtrato sa pisikal na katawan at sa iglesya. Dapat manggaling sa konteksto ang aplikasyon sa iglesya, hindi ipalit sa mismong larawan ng talata.
- issue: Kahulugan ng ἀσχήμονα
  choice: hindi angkop ilantad
  alternative: mahalay o kahiya-hiya
  rationale: Ang salita ay maaaring tumukoy sa hindi kaaya-aya o hindi nararapat ipakita sa publiko; ang piniling salin ay hindi nagpapasok ng mas matinding paghatol na moral kaysa sa hinihingi ng konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang kongkretong talinghaga ng katawan at ang paghahambing sa karangalan, habang iniwasan ang sobrang pormal na 'dekorum' at ang masyadong moralistikong 'mahalay.'
