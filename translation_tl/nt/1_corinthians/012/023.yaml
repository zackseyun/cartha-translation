- from: At ang mga bahagi ng katawan na sa palagay natin ay di-gaanong marangal, ay lalo nating pinararangalan; at ang mga bahagi nating hindi angkop ilantad[a] ay may higit na kaaya-ayang anyo[b].
  to: At ang mga bahagi ng katawan na itinuturing nating hindi gaanong marangal ay binibigyan natin ng higit na karangalan; at ang mga bahagi nating hindi angkop ilantad[a] ay may higit na kaaya-ayang anyo[b].
  rationale: Ginawang tahasan ang pahambing na “higit na karangalan” upang mas tapat na maipakita ang περισσοτέραν, habang pinananatili ang kongkretong larawan ng katawan, ang hindi moralistikong pag-unawa sa ἀσχήμονα, at ang mga umiiral na angkla at nilalaman ng talababa.
