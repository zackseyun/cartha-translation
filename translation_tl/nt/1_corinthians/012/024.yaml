  text: τὰ δὲ εὐσχήμονα ἡμῶν οὐ χρείαν ⸀ἔχει. ἀλλὰ ὁ θεὸς συνεκέρασεν τὸ σῶμα, τῷ ⸀ὑστεροῦντι περισσοτέραν δοὺς τιμήν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/024.yaml
  text: but our presentable parts have no need. Instead[a], God has composed the body, giving greater honor to the part that lacked it,
translation:
  language: tl
  text: Ngunit ang mga bahagi nating maayos tingnan ay hindi nangangailangan nito. Sa halip[a], pinagsama-sama ng Diyos ang katawan, na nagbibigay ng higit na karangalan sa bahaging kulang sa karangalan,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinag-isa” o “pinaghalo-halo.” Ang pandiwang Griyego ay maaaring magbigay-diin sa pagsasama o paghahalo ng mga bahagi upang maging isang buo.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐσχήμονα
  choice: mga bahagi nating kaaya-ayang tingnan
  rationale: Ipinahihiwatig ng εὐσχήμονα ang mga bahaging maayos o disenteng maiharap sa paningin, bilang kabaligtaran ng mga bahaging hindi gaanong kaaya-ayang tingnan sa naunang talata. Idinagdag ang “mga bahagi” mula sa konteksto.
- source_word: χρείαν ἔχει
  choice: hindi ito kailangan
  rationale: Likas na katumbas ito ng idyomang Griyego na nangangahulugang “walang pangangailangan.” Ang “ito” ay tumutukoy sa natatanging pag-aasikaso o paggalang na binanggit sa konteksto.
- source_word: συνεκέρασεν
  choice: pinag-isa
  rationale: Ipinakikita ng pandiwa ang pagsasama-sama ng magkakaibang bahagi tungo sa isang buo. Natural ang “pinag-isa” sa Filipino at hindi nito ginagawang mekanikal ang pagkilos ng Diyos; inilalagay sa talababa ang mas literal na larawan ng paghahalo o pagsasama.
- source_word: σῶμα
  choice: ang katawan
  rationale: Pinananatili ang pangunahing talinghaga ni Pablo tungkol sa katawan nang walang paliwanag na wala sa mismong teksto.
- source_word: τῷ ὑστεροῦντι
  choice: ang bahaging kulang nito
  rationale: Ang participle ay tumutukoy sa bahaging nagkukulang o nahuhuli. Ang “nito” ay natural na tumutukoy sa karangalang kasunod na binanggit, hindi sa likas na halaga ng bahagi.
- source_word: περισσοτέραν τιμήν
  choice: higit na karangalan
  rationale: Malinaw at natural nitong pinananatili ang pahambing na diwa ng περισσοτέραν at ang kahulugan ng τιμήν.
- source_word: δοὺς
  choice: at binigyan niya
  rationale: 'Inihahayag nito sa natural na Filipino ang kasabay o instrumental na ugnayan ng participle sa pangunahing pandiwa: pinag-isa ng Diyos ang katawan sa pamamagitan ng pagbibigay ng higit na karangalan.'
theological_decisions:
- issue: Ang saklaw ng pagkilos ng Diyos sa talinghaga ng katawan
  choice: Inilalarawan ang Diyos na sadyang pinag-iisa ang katawan at nagbibigay ng higit na karangalan sa bahaging kulang nito.
  alternative: Maaaring unawain ang pagkilos bilang simpleng paghahalo ng mga pisikal na bahagi o bilang pagtukoy lamang sa anatomiya ng tao.
  rationale: Pinananatili ng salin ang talinghaga at ang layuning ipinahihiwatig ng pagbibigay ng karangalan, ngunit hindi nito tahasang nililimitahan ang “katawan” sa anatomiya o sa iglesya lamang; ang mas malawak na konteksto ang gumagabay sa pag-unawa.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “kaaya-ayang tingnan” upang maipahayag ang panlabas na pagiging disente o presentable nang hindi gumagamit ng lipas o labis na pormal na salita.
