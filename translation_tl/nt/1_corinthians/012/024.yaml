  to: Ngunit ang mga bahagi nating maayos tingnan ay hindi nangangailangan nito. Sa halip[a], pinagsama-sama ng Diyos ang katawan, na nagbibigay ng higit na karangalan sa bahaging kulang sa karangalan,
