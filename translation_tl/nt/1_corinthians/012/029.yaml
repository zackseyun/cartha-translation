  text: μὴ πάντες ἀπόστολοι; μὴ πάντες προφῆται; μὴ πάντες διδάσκαλοι; μὴ πάντες δυνάμεις;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/029.yaml
  text: Not all are apostles[a], are they? Not all are prophets, are they? Not all are teachers, are they? Not all work miracles, do they?
translation:
  language: tl
  text: Hindi naman lahat ay mga apostol, hindi ba? Hindi naman lahat ay mga propeta, hindi ba? Hindi naman lahat ay mga guro, hindi ba? Hindi naman lahat ay gumagawa ng mga himala,[a] hindi ba?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas literal na anyo: “mga kapangyarihan” o “mga makapangyarihang gawa.” Ginagamit dito ang salitang Griyego bilang pinaikling pagtukoy sa paggawa ng mga himala.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: Hindi naman ... hindi ba?
  rationale: Ang μή sa bawat tanong ay umaasang negatibo ang sagot. Likas sa modernong Tagalog ang “Hindi naman ... hindi ba?” at napapanatili nito ang retorikal na diin.
- source_word: πάντες
  choice: lahat
  rationale: Tuwirang katumbas ito ng πάντες at pinananatili ang paulit-ulit na diin na hindi iisa ang tungkulin o kaloob ng lahat.
- source_word: ἀπόστολοι
  choice: mga apostol
  rationale: Karaniwang katawagan ito sa kinikilalang tungkulin sa kontekstong Paulino, hindi lamang sa pangkalahatang mga sugo.
- source_word: προφῆται
  choice: mga propeta
  rationale: Ito ang malinaw at nakaugaliang katumbas para sa mga taong nagpapahayag bilang mga propeta.
- source_word: διδάσκαλοι
  choice: mga guro
  rationale: Natural at malinaw itong katawagan sa mga nagtuturo sa kapulungan.
- source_word: δυνάμεις
  choice: gumagawa ng mga himala
  rationale: Bagaman pangngalan ang δυνάμεις (“mga kapangyarihan” o “mga himala”), metonimiko itong tumutukoy rito sa paggawa ng makapangyarihang mga gawa. Ang pandiwang salin ay malinaw sa Tagalog at hindi nagpapahiwatig na ang mga tao mismo ay mga himala.
theological_decisions:
- issue: Pagpapakahulugan sa δυνάμεις bilang huling bahagi ng talaan ng mga tungkulin at kaloob
  choice: Hindi naman lahat ay gumagawa ng mga himala, hindi ba?
  alternative: Hindi naman lahat ay may mga kapangyarihang gumawa ng himala, hindi ba? / Hindi naman lahat ay mga tagagawa ng makapangyarihang gawa, hindi ba?
  rationale: Ginagamit ng Griyego ang pangngalang “mga kapangyarihan/makapangyarihang gawa” bilang pinaikling pagtukoy sa paggawa ng mga himala. Ipinahahayag ng pandiwang anyo ang diwa nang natural, nang hindi nagpapasya sa isang partikular na doktrina tungkol sa mga kaloob.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Pinanatili ang apat na magkakatulad na retorikal na tanong at ang inaasahang negatibong sagot.
