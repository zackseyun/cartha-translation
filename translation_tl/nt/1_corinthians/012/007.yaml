  source_fidelity: Tumpak na naipapasa ng salin ang distributibong «sa bawat isa,» ang balintiyak na «ay ibinibigay,» ang «pagpapahayag ng Espiritu» para sa φανέρωσις τοῦ πνεύματος, at ang layuning kapakinabangan ng pamayanan. Ang «ng lahat» ay isang kontekstuwal na paglilinaw na suportado ng talata at ng agarang usapin tungkol sa katawan, habang pinananatili ng talababa ang mas malawak na leksikal na posibilidad.
