  text: ἑκάστῳ δὲ δίδοται ἡ φανέρωσις τοῦ πνεύματος πρὸς τὸ συμφέρον.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/007.yaml
  text: But to each one the manifestation of the Spirit is given for the common good[a].
translation:
  language: tl
  text: Ngunit sa bawat isa ay ibinibigay ang pagpapahayag ng Espiritu para sa kapakinabangan ng lahat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “para sa kung ano ang kapaki-pakinabang” o “para sa kabutihang panlahat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκάστῳ
  choice: sa bawat isa
  rationale: 'Pinananatili nito ang distributibong diwa: bawat indibidwal sa loob ng katawan ay binibigyan.'
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig nito ang banayad na pagsalungat o paglipat mula sa naunang pagtalakay, nang hindi labis na pinatitingkad ang pagkakaiba.
- source_word: δίδοται
  choice: ay ibinibigay
  rationale: Tuwirang inililipat ang pangkasalukuyang anyong balintiyak at pinananatili ang diwa ng isang kaloob.
- source_word: φανέρωσις
  choice: pagpapahayag
  rationale: Natural sa modernong Tagalog at ipinakikita ang diwa ng paggawa sa gawain ng Espiritu na hayag o nakikita; hindi nito nililimitahan ang tinutukoy sa pananalita lamang.
- source_word: τοῦ πνεύματος
  choice: ng Espiritu
  rationale: Malinaw sa konteksto na ang Banal na Espiritu ang tinutukoy, ngunit hindi idinaragdag ang salitang “Banal,” na wala sa mismong parirala.
- source_word: πρὸς τὸ συμφέρον
  choice: para sa kapakinabangan ng lahat
  rationale: Ipinahahayag nito ang pakinabang na nakatuon sa buong pamayanan ayon sa konteksto ng katawan, habang inilalagay sa talababa ang mas pangkalahatang posibleng kahulugan.
theological_decisions:
- issue: Ang tinutukoy ng “Espiritu”
  choice: Ang Banal na Espiritu ang tinutukoy, ngunit isinalin lamang na “Espiritu.”
  alternative: Isang pangkalahatang “espiritu.”
  rationale: Paulit-ulit na tinutukoy sa agarang konteksto ang iisa at parehong Espiritu bilang pinagmumulan ng mga kaloob; gayunman, ang salin ay nananatiling malapit sa mismong anyo ng Griyego.
- issue: Saklaw ng συμφέρον
  choice: Pakinabang ng lahat o ng buong pamayanan.
  alternative: Anumang kapaki-pakinabang, na hindi tahasang tinutukoy kung para kanino.
  rationale: Sinusuportahan ng konteksto ng kabanata—ang iisang katawan at magkakaugnay na mga kaloob—ang panlahatang pakinabang, ngunit pinananatili sa talababa ang tunay na leksikal na lawak ng parirala.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinili ang “pagpapahayag” bilang mas natural kaysa “manifestasyon,” habang pinananatili ang ideya ng hayag na pagkilos ng Espiritu. Ang “kapakinabangan ng lahat” ay madaling maunawaan at angkop sa kontekstong pangkomunidad.
