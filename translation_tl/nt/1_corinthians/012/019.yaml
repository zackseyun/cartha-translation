  text: If all were one member, where would the body be?
translation:
  language: tl
  text: Kung ang lahat ay iisang bahagi lamang, nasaan ang katawan?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ
  choice: Kung
  rationale: Likas na panandang kondisyon sa Filipino at angkop sa ipinapalagay na sitwasyon sa argumento.
- source_word: δὲ
  choice: —
  rationale: Mahinang pang-ugnay ito sa daloy ng retorika. Hindi na kailangang tumbasan nang tahasan sapagkat malinaw na ang ugnayan sa pangungusap at mas natural ang Filipino kung wala ito.
- source_word: ἦν
  choice: ay
  rationale: Sa sugnay na may “kung,” sapat at natural ang “ay” upang ipahayag ang ipinapalagay na kalagayan; hindi kailangang markahan nang hiwalay ang aspektong imperfect ng Griyego.
- source_word: τὰ πάντα
  choice: ang lahat
  rationale: Tumutukoy sa lahat ng bahagi nang sama-sama sa loob ng talinghaga ng katawan, hindi sa lahat ng bagay sa pangkalahatan.
- source_word: ἓν
  choice: iisang
  rationale: 'Ipinakikita ang eksklusibong pagkakapareho: ang lahat ay magiging isang uri o isang bahagi lamang.'
- source_word: μέλος
  choice: bahagi
  rationale: Sa modernong Filipino, ang “bahagi” ang malinaw at natural na tawag sa isang bahagi ng katawan at napapanatili nito ang talinghaga. Ang “miyembro” ay maaaring unawain agad bilang kasapi ng organisasyon at labis na magpaliwanag sa talinghaga.
- source_word: ποῦ
  choice: nasaan
  rationale: Direktang pinananatili ang retorikal na tanong tungkol sa pag-iral o kinaroroonan ng katawan sa ipinapalagay na sitwasyon.
- source_word: τὸ σῶμα
  choice: ang katawan
  rationale: Tuwirang salin na nagpapanatili sa tiyak ngunit hindi pinalawak na talinghaga ng teksto.
theological_decisions:
- issue: Saklaw ng talinghaga ng katawan
  choice: “ang katawan” lamang
  alternative: “ang katawan ni Cristo” o tahasang “ang iglesya”
  rationale: Bagaman inilalapat ng konteksto ang talinghaga sa sambayanan ni Cristo, “ang katawan” lamang ang sinasabi ng talatang ito. Hindi idinaragdag sa salin ang teolohikal na pagtukoy na wala sa mismong pangungusap.
translation_notes:
  register: Modernong, malinaw, at marangal na Filipino. Ginamit ang “iisang bahagi lamang” upang natural na maipahayag ang diin ng ἓν μέλος at ang ipinapalagay na kawalan ng pagkakaiba-iba sa katawan.
