base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/002.yaml
  text: You know that when you were Gentiles[a], you were led away to the mute idols[b], however you were led.
translation:
  language: tl
  text: Alam ninyo na noong kayo'y mga Hentil pa, anuman ang paraan ng pag-akay sa inyo, inaakay kayong palayo patungo sa mga piping diyus-diyosan.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga diyus-diyosang walang tinig” o “mga diyus-diyosang hindi makapagsalita.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “anuman ang paraan ng pag-akay sa inyo, dinadala kayong palayo patungo sa mga piping diyus-diyosan.” Binibigyang-diin ng Griyego ang nagpapatuloy na balintiyak na pagkilos nila sa ilalim ng dating impluwensiya.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδατε
  choice: Alam ninyo
  rationale: Likas at tuwirang panawagan ito sa kaalamang magkakasalo ang mga mambabasa at si Pablo.
- source_word: ἔθνη
  choice: mga Hentil
  rationale: Pinananatili nito ang etniko at panrelihiyong diwa ng dating kalagayan ng mga taga-Corinto nang hindi gumagamit ng mas mapanghusgang katawagang gaya ng “mga pagano.”
- source_word: πρὸς τὰ εἴδωλα
  choice: patungo sa mga diyus-diyosan
  rationale: Ipinahahayag ng πρός na may accusative ang direksiyon ng pagkilos; malinaw itong naihahatid ng “patungo sa.”
- source_word: τὰ ἄφωνα
  choice: walang tinig
  rationale: Itinatampok nito na hindi nakapagsasalita ang mga diyus-diyosan, at pinananatili ang posibleng retorikal na paghahambing sa mga pahayag na mula sa Espiritu sa konteksto.
- source_word: ὡς ἂν
  choice: sa anumang paraan
  rationale: 'Inihahatid nito ang di-tiyak o modal na diwa ng parirala: sa alinmang paraan sila inaakay.'
- source_word: ἤγεσθε
  choice: inaakay kayo
  rationale: Pinananatili ng aspektong di-ganap at tinig na balintiyak ang nagpapatuloy na pagkilos at ang pagiging tagatanggap nila ng impluwensiya.
- source_word: ἀπαγόμενοι
  choice: nadadala kayo
  rationale: Ipinakikita nito ang balintiyak na pagkilos na nagdadala sa kanila patungo sa mga diyus-diyosan, habang iniiwasang idagdag nang tahasan ang ideyang “naliligaw,” na hindi kinakailangang bahagi ng mismong salita.
theological_decisions:
- issue: Diwa ng ἔθνη sa dating kalagayan ng mga taga-Corinto
  choice: mga Hentil
  alternative: mga pagano; mga bansa
  rationale: Ang “mga Hentil” ang pinakamahusay na nagpapanatili sa etniko at panrelihiyong diwa nang hindi nagpapasok ng higit na mapanghusgang tono o ng malabong literalismo.
- issue: Paghahambing ng mga diyus-diyosang ἄφωνα sa pananalitang kaugnay ng Espiritu
  choice: mga diyus-diyosang walang tinig
  alternative: mga piping diyus-diyosan; mga diyus-diyosang hindi makapagsalita
  rationale: Pinananatili nito ang maikli ngunit mahalagang paglalarawan sa mga diyus-diyosan nang hindi pinalalawak ang ipinahihiwatig na teolohiya ng konteksto.
- issue: Dobleng balintiyak na paglalarawan sa dating pagkilos ng mga taga-Corinto
  choice: nadadala kayo … inaakay kayo
  alternative: inilalayo kayo … inaakay kayo; dinadala kayo … inaakay kayo
  rationale: Sinasalamin nito ang ἤγεσθε at ἀπαγόμενοι at pinananatili ang diin sa kanilang pagiging nasa ilalim ng dating impluwensiya, bagaman bahagyang paulit-ulit ang pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kayo'y” bilang likas na pinaikling anyo at ang “mga Hentil” bilang pamilyar na terminong biblikal. Sadyang pinanatili ang bahagyang pag-uulit ng “nadadala” at “inaakay” upang maipakita ang retorikal na diin at balintiyak na pagkilos sa Griyego.
