  text: so that there may be no division in the body[b][a], but that the members may have the same concern for one another.
translation:
  language: tl
  text: upang hindi magkaroon ng pagkakahati sa katawan[a], kundi upang ang mga bahagi ay magkaroon ng magkakatulad na malasakit sa isa't isa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pagkakabaha-bahagi” o “pagkabiyak.” Ang salitang Griyego ay maaaring mangahulugang hati, bitak, o punit; dito ay tumutukoy ito sa pagkakahati sa loob ng katawan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “magmalasakit nang pantay-pantay sa isa't isa” o “magkaroon ng iisang malasakit sa isa't isa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: upang
  rationale: Likas na panandang Filipino para sa layunin o inaasahang bunga, at pinananatili ang puwersa ng sugnay.
- source_word: σχίσμα
  choice: pagkakahati
  rationale: Ipinahihiwatig nito ang bitak o pagkakahati sa loob ng isang kabuuan, habang iniiwasan ang teknikal at makasaysayang dating ng “sisma.”
- source_word: σῶμα
  choice: katawan
  rationale: Tuwirang pinananatili ang metapora ni Pablo tungkol sa katawan.
- source_word: τὸ αὐτό
  choice: nang pantay-pantay
  rationale: Kasama ng μεριμνῶσι, maaaring ipahayag ng parirala na magkakapantay ang malasakit ng mga bahagi; natural ito sa modernong Tagalog, habang itinatala sa talababa ang mas literal na alternatibo.
- source_word: ὑπὲρ ἀλλήλων
  choice: sa isa't isa
  rationale: Ipinapakita ang tugunang direksiyon ng malasakit nang hindi ipinapasok ang diwang pamalit.
- source_word: μεριμνῶσι
  choice: magmalasakit
  rationale: Sa konteksto, positibong pag-aaruga o pagmamalasakit ang tinutukoy, hindi pagkabalisa.
- source_word: μέλη
  choice: mga bahagi nito
  rationale: Malinaw na tumutukoy sa mga bahagi ng katawan at pinananatili ang metapora; ang “nito” ay natural na nag-uugnay sa naunang “katawan.”
theological_decisions:
- issue: Pagpapahayag sa σχίσμα sa metapora ng iglesya bilang katawan
  choice: pagkakahati
  alternative: sisma; pagkakabaha-bahagi
  rationale: Ang “pagkakahati” ay nagpapakita ng pagkawatak sa loob ng katawan nang hindi ipinapasok ang mas huling teknikal na kahulugan ng “sisma.”
- issue: Kahulugan ng τὸ αὐτό kasama ng μεριμνῶσι
  choice: magmalasakit nang pantay-pantay
  alternative: magkaroon ng iisang malasakit
  rationale: Maaaring tumukoy ang Griyego sa parehong antas ng malasakit o sa iisang uri ng pagmamalasakit. Pinili ang natural na pagpapahayag ng pagkakapantay-pantay, ngunit pinanatili sa talababa ang tunay na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “pagkakahati” sa halip na teknikal na “sisma,” at “mga bahagi” sa halip na mas pormal o maaaring malabong “mga sangkap.”
