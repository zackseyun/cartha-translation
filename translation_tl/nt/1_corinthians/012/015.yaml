base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/015.yaml
  text: If the foot says[a], “Because I am not a hand, I am not of the body,” it is not for this reason not of the body, is it?
translation:
  language: tl
  text: Kung sabihin ng paa[a], “Dahil hindi ako kamay, hindi ako bahagi ng katawan,” hindi dahil dito kaya hindi ito bahagi ng katawan, hindi ba?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, sa mas idyomatikong paraan: “Hindi ako kabilang sa katawan … hindi iyon nangangahulugang hindi ito bahagi ng katawan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπῃ
  choice: Kung sabihin
  rationale: Ang ἐὰν na may aorist subjunctive ay naghaharap ng pangkalahatang kalagayang ipinapalagay; natural sa Filipino ang “Kung sabihin.”
- source_word: ὁ πούς
  choice: ang paa
  rationale: Pinananatili ang kongkretong larawan ng bahagi ng katawan na mahalaga sa talinghaga ni Pablo.
- source_word: Ὅτι
  choice: Dahil
  rationale: Bagaman maaari itong magpakilala lamang ng nilalaman ng sinabi, malinaw rito ang sanhi o batayan ng reklamo ng paa.
- source_word: χείρ
  choice: kamay
  rationale: Tuwirang pinananatili ang paghahambing ng paa at kamay.
- source_word: ἐκ τοῦ σώματος
  choice: bahagi ng katawan
  rationale: Sa kontekstong tumutukoy sa pagiging kabilang sa isang katawan, ito ang natural at tumpak na katumbas sa modernong Filipino; inuulit ito upang mapanatili ang retorika ng Griyego.
- source_word: οὐ παρὰ τοῦτο
  choice: hindi dahil dito
  rationale: Tuwirang itinatanggi na ang binanggit na dahilan ang nag-aalis sa paa sa katawan.
- source_word: οὐκ ἔστιν ἐκ τοῦ σώματος
  choice: hindi na ito bahagi ng katawan, hindi ba?
  rationale: Pinananatili ang negatibong pahayag at anyong retorikal na tanong, habang ginagawang malinaw sa Filipino na ang tinutukoy ay ang paa.
theological_decisions:
- issue: Antas ng pagpapakinis sa retorika ng talinghaga tungkol sa katawan
  choice: Panatilihin ang pag-uulit ng “bahagi ng katawan” at ang retorikal na tanong.
  alternative: “Hindi ibig sabihin niyon na hindi na ito kabilang sa katawan.”
  rationale: Pinananatili nito ang diin at lohika ng orihinal nang hindi ginagawang di-likas ang Filipino; walang idinaragdag na denominasyonal na pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bahagi ng katawan” sa halip na literal na “mula sa katawan,” sapagkat ang ἐκ sa kontekstong ito ay nagsasaad ng pagiging kabilang o pagiging sangkap ng katawan. Ang “hindi ba?” ay nagpapanatili sa retorikal na tanong ng Griyego.
