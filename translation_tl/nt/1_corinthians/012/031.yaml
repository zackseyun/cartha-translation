  text: ζηλοῦτε δὲ τὰ χαρίσματα τὰ ⸀μείζονα. καὶ ἔτι καθ’ ὑπερβολὴν ὁδὸν ὑμῖν δείκνυμι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/031.yaml
  text: But earnestly desire the greater gifts[b][a]. And I will show you a still more surpassing way.
translation:
  language: tl
  text: Ngunit taimtim ninyong hangarin ang mas dakilang mga kaloob.[a] At ipakikita ko sa inyo ang isang lalo pang mainam na daan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Ngunit taimtim ninyong hinahangad ang mas dakilang mga kaloob.” Maaaring basahin ang anyong Griyego na ζηλοῦτε bilang pang-utos o bilang pasalaysay sa kontekstong ito.'
    reason: alternative_reading
  - marker: b
    text: 'Ayon sa nakaugaliang salin: “isang lalong mahusay na daan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζηλοῦτε
  choice: taimtim ninyong hangarin
  rationale: Ipinahahayag nito ang masidhing pagnanais o sigasig. Pang-utos ang pinili sa pangunahing teksto, ngunit pinananatili sa talababa ang posibleng pagbasa rito bilang pasalaysay.
- source_word: χαρίσματα
  choice: mga kaloob
  rationale: Ang χάρισμα ay kaloob na nagmumula sa biyaya. Sapat dito ang “mga kaloob” dahil malinaw sa konteksto ng kabanata na tumutukoy ito sa mga kaloob ng Espiritu, nang hindi nagdaragdag ng salitang wala sa sugnay.
- source_word: μείζονα
  choice: mas dakila
  rationale: Pinananatili nito ang paghahambing na “greater” o “more important” nang hindi labis na ipinapaliwanag kung paano nakahihigit ang mga kaloob.
- source_word: καὶ ἔτι
  choice: At ... higit na
  rationale: Ipinagpapatuloy nito ang kaisipan habang ipinakikilalang ang susunod ay lampas pa sa naunang pagtalakay.
- source_word: καθ’ ὑπερβολὴν
  choice: higit na nakahihigit
  rationale: Ipinahahayag ng parirala ang pambihira o sukdulang antas ng kahigitan. Bahagyang di-karaniwan ngunit malinaw ang anyong ito at pinananatili ang mariing puwersa ng Griyego.
- source_word: ὁδὸν
  choice: daan
  rationale: Pinananatili ang metapora ng ὁδός bilang paraan, landas, o pamumuhay na naghahatid sa pagtalakay tungkol sa pag-ibig.
- source_word: δείκνυμι
  choice: ipakikita ko
  rationale: Bagaman nasa pangkasalukuyang anyo ang Griyego, natural sa Filipino ang panghinaharap sapagkat ilalahad pa lamang ni Pablo sa kasunod na bahagi ang daang tinutukoy.
theological_decisions:
- issue: Puwersa ng ζηλοῦτε
  choice: 'pang-utos: “taimtim ninyong hangarin”'
  alternative: 'pasalaysay: “taimtim ninyong hinahangad”'
  rationale: Maaaring unawain ang anyo bilang pang-utos o pasalaysay. Ang pang-utos ay angkop sa daloy ng mga tagubilin, ngunit inilalagay sa talababa ang alternatibo upang mapanatili ang tunay na kalabuan.
- issue: Ugnayan ng mga kaloob at ng higit na nakahihigit na daan
  choice: Hindi ipinapakahulugan sa talata mismo kung ano ang daan
  alternative: Tahasang tukuyin ito bilang pag-ibig
  rationale: Ipinakikilala ng konteksto ng kabanata 13 ang pag-ibig, ngunit hindi ito tuwirang pinangalanan sa talatang ito; pinananatili ng salin ang retorikal na paglipat ni Pablo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “kaloob” at “daan” upang mapanatili ang bokabularyo at metapora ng Griyego; iniwasan ang pagdaragdag ng “espirituwal” at ang tahasang pagbanggit sa “pag-ibig,” na kapwa ipinahihiwatig lamang ng mas malawak na konteksto.
