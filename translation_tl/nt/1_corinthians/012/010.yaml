id: 1CO.12.10
reference: 1 Corinthians 12:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀ἄλλῳ ἐνεργήματα δυνάμεων, ⸁ἄλλῳ προφητεία, ⸀1ἄλλῳ διακρίσεις πνευμάτων, ⸀ἑτέρῳ γένη γλωσσῶν, ⸀2ἄλλῳ ἑρμηνεία γλωσσῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/010.yaml
  text: to another[a], workings of miracles; to another, prophecy; to another, discernments of spirits; to another, kinds of tongues; to another[b], interpretation of tongues.
translation:
  language: tl
  text: sa isa naman, mga paggawa ng mga himala[a]; sa isa, propesiya; sa isa, mga pagkilatis sa mga espiritu; sa isa, iba’t ibang uri ng pagsasalita sa mga wika[b]; at sa isa naman, pagpapakahulugan sa mga wika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga pagkilos ng kapangyarihan” o “mga makapangyarihang gawa.”
    reason: lexical_alternative
  - marker: b
    text: O “iba’t ibang uri ng mga dila” at “pagpapakahulugan sa mga dila.” Ang salitang Griyego ay maaaring mangahulugang “mga dila” o “mga wika.” Ginamit ang “pagsasalita sa mga wika” upang maging natural sa Filipino, ngunit hindi nito nilulutas kung anong uri ng pananalita o mga wika ang tinutukoy ni Pablo.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνεργήματα
  choice: mga pagkilos
  rationale: Ipinapahiwatig ng pangngalan ang mga pagkilos o bungang nalilikha ng kapangyarihan. Pinananatili ng “mga pagkilos” ang anyong maramihan at ang diin sa aktibong paggawa.
- source_word: δυνάμεων
  choice: ng kapangyarihan
  rationale: Ito ang mas tuwirang salin at pinananatiling bukas kung ang tinutukoy ay kapangyarihan mismo o mga makapangyarihang gawa gaya ng mga himala.
- source_word: προφητεία
  choice: propesiya
  rationale: Karaniwan, maikli, at malawak na katumbas sa Filipino para sa kaloob na binabanggit, nang hindi ito nililimitahan sa paghula lamang.
- source_word: διακρίσεις
  choice: mga pagkilatis
  rationale: Ang maramihang anyo ay tumutukoy sa mga pagkilos o iba’t ibang anyo ng masusing pagkilala at pagsusuri.
- source_word: πνευμάτων
  choice: sa mga espiritu
  rationale: Pinananatili ang malawak na kahulugan ng Griyego at hindi tinutukoy kung mabuti, masama, pantao, o ibang uri ng mga espiritu ang tinutukoy.
- source_word: γένη
  choice: iba’t ibang uri
  rationale: Natural na Filipino para sa mga uri o kaurian at malinaw na ipinakikita ang pagkakaiba-iba.
- source_word: γλωσσῶν
  choice: pagsasalita sa mga wika / mga wika
  rationale: Hindi natural sa Filipino ang literal na “mga dila” para sa espirituwal na kaloob. Ipinahahayag ng “pagsasalita sa mga wika” ang gawain, habang nililinaw sa talababa na maaaring tumukoy ang salita sa “mga dila” o “mga wika” at hindi nito ganap na nilulutas ang likas na katangian ng kaloob.
- source_word: ἑρμηνεία
  choice: pagpapakahulugan
  rationale: Ipinahahayag nito ang paggawa sa sinabi upang maunawaan, nang hindi nililimitahan ang gawain sa salitang-sa-salitang pagsasalin.
- source_word: ἄλλῳ / ἑτέρῳ
  choice: sa isa naman / sa isa / sa iba
  rationale: Ipinakikita ng paulit-ulit na parirala ang pamamahagi ng magkakaibang kaloob sa magkakaibang tao. Ang bahagyang pag-iiba ng Filipino ay natural at hindi nagpapataw ng malaking pagkakaibang semantiko sa dalawang salitang Griyego.
theological_decisions:
- issue: Kalikasan ng δυνάμεων sa talaan ng mga kaloob
  choice: “mga pagkilos ng kapangyarihan,” na may “mga himala” bilang paliwanag sa talababa
  alternative: “paggawa ng mga himala” o “makapangyarihang mga gawa”
  rationale: Madalas tumukoy ang δυνάμεις sa mga himala, ngunit ang mas tuwirang salin sa pangunahing teksto ay nagpapanatili ng saklaw ng Griyego at hindi agad nilulutas ang ugnayan ng kapangyarihan at ng mga bungang gawa nito.
- issue: Kahulugan ng γλωσσῶν
  choice: “mga wika,” sa pariralang “pagsasalita sa mga wika,” na may paliwanag sa talababa
  alternative: literal na “mga dila,” o tahasang “mga wikang banyaga”
  rationale: Maaaring mangahulugan ang γλῶσσα ng dila o wika, at pinagtatalunan ang tiyak na kalikasan ng kaloob. Gumagamit ang salin ng natural na Filipino ngunit hindi ito tinutukoy bilang mga kilalang wikang pantao lamang o bilang ekstatikong pananalita lamang.
- issue: Tinutukoy ng πνευμάτων sa “mga pagkilatis sa mga espiritu”
  choice: Iniwan itong malawak bilang “mga espiritu.”
  alternative: “mga espiritung nasa likod ng mga pahayag,” “masasamang espiritu,” o “espiritu ng tao”
  rationale: Hindi tinutukoy ng Griyego ang eksaktong sanggunian; ang pagpapakitid dito ay magpapasok ng interpretasyong hindi hayag sa teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang maikli at magkakatulad na ayos ng talaan. Ginamit ang “pagkilatis” at “pagpapakahulugan” bilang pormal ngunit pangkaraniwang mga salitang angkop sa kontekstong panrelihiyon; iniwasan ang literal ngunit di-natural na “mga dila” sa pangunahing teksto.
