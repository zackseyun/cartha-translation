id: 1CO.12.3
reference: 1 Corinthians 12:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: διὸ γνωρίζω ὑμῖν ὅτι οὐδεὶς ἐν πνεύματι θεοῦ λαλῶν λέγει· Ἀνάθεμα ⸀Ἰησοῦς, καὶ οὐδεὶς δύναται εἰπεῖν· ⸂Κύριος Ἰησοῦς⸃ εἰ μὴ ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/003.yaml
  text: Therefore I make known to you that no one speaking by the Spirit of God says[a], “Jesus is accursed,” and no one is able to say[b], “Jesus is Lord,” except by the Holy Spirit.
translation:
  language: tl
  text: Kaya ipinaaalam ko sa inyo na walang sinumang nagsasalita sa pamamagitan ng Espiritu ng Diyos ang nagsasabi, “Nasa ilalim ng sumpa si Jesus”[a]; at walang sinumang makapagsasabi, “Si Jesus ay Panginoon”[b], maliban sa pamamagitan ng Banal na Espiritu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Sumpain si Jesus!” Ang Griyegong Ἀνάθεμα Ἰησοῦς ay isang matinding pahayag na walang tahasang pandiwa at maaaring magpahiwatig ng sumpang ipinapataw o ng kalagayang nasa ilalim ng sumpa.
    reason: lexical_alternative
  - marker: b
    text: 'Sa Griyego, “Panginoon si Jesus”; sa konteksto, isa itong pagpapahayag o pagkilala: “Si Jesus ay Panginoon.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διό
  choice: Kaya
  rationale: Likas na ipinahihiwatig sa modernong Tagalog ang konklusyon o bunga mula sa naunang talakayan.
- source_word: γνωρίζω ὑμῖν
  choice: ipinaaalam ko sa inyo
  rationale: Pinananatili ang tahasang diwang causative na ‘ginagawang malaman’ nang hindi idinaragdag ang di-hayag na pagnanais ng nagsasalita.
- source_word: ἐν πνεύματι θεοῦ
  choice: sa pamamagitan ng Espiritu ng Diyos
  rationale: Malinaw na naipahahayag ang instrumental na diwa ng ἐν habang hindi isinasara ang kaugnay na diwa ng pagkilos sa saklaw ng Espiritu.
- source_word: Ἀνάθεμα Ἰησοῦς
  choice: Nasa ilalim ng sumpa si Jesus
  rationale: Likas na pahayag sa Tagalog para sa verbless na pariralang Griyego at naipakikita ang kalagayang ipinahahayag ng ἀνάθεμα nang hindi ito ginagawang tahasang pautos.
- source_word: δύναται εἰπεῖν
  choice: makapagsasabi
  rationale: Ang anyong may ‘maka-’ ay maikli at likas na nagpapahayag ng kakayahan o posibilidad.
- source_word: Κύριος Ἰησοῦς
  choice: Si Jesus ay Panginoon
  rationale: Ipinapahayag nang malinaw ang confessional na diwa ng nominative verbless clause; iniiwasang mapagkamalan itong simpleng pantawag na ‘Panginoong Jesus.’
- source_word: εἰ μὴ
  choice: maliban
  rationale: Tumpak na minamarkahan ang tanging eksepsiyon sa naunang pangkalahatang negatibong pahayag.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: sa pamamagitan ng Banal na Espiritu
  rationale: Pinananatili ang parallel sa ‘Espiritu ng Diyos’ at malinaw na ipinahahayag ang ahensiya ng Banal na Espiritu.
theological_decisions:
- issue: Kahulugan ng κύριος sa pahayag na Κύριος Ἰησοῦς
  choice: Panginoon
  alternative: Guro o amo
  rationale: Ang ‘Panginoon’ ay nagpapanatili kapwa sa karaniwang kahulugan ng titulo at sa mabigat na kristolohikal na diwa nito, nang hindi dinaragdagan ang sinasabi ng teksto.
- issue: Saklaw ng kakayahang magsabi na ‘Si Jesus ay Panginoon’ sa pamamagitan ng Banal na Espiritu
  choice: Pinanatili ang pahayag ayon sa pagkakasabi nito
  alternative: Limitahan ito sa tapat na pag-amin lamang, o palawakin bilang ganap na paliwanag ng pagbabagong-buhay
  rationale: Iniuugnay ng talata ang tunay na pagkilala sa pagkapanginoon ni Jesus sa pagkilos ng Banal na Espiritu, ngunit hindi nito tahasang nililinaw ang lahat ng doktrinal na implikasyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang ‘ipinaaalam’ at ‘makapagsasabi’ bilang karaniwan ngunit dignified na pananalita. Pinanatili ang parallel na ‘sa pamamagitan ng’ sa dalawang pagtukoy sa Espiritu at iniwasang gawing teknikal o denominasyonal ang pahayag.
