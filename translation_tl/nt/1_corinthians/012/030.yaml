  to: Hindi naman lahat ay may mga kaloob ng pagpapagaling[a], hindi ba? Hindi naman lahat ay nagsasalita ng mga wika[b], hindi ba? Hindi naman lahat ay nagbibigay-kahulugan, hindi ba?
