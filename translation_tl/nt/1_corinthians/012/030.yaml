  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: μὴ πάντες χαρίσματα ἔχουσιν ἰαμάτων; μὴ πάντες γλώσσαις λαλοῦσιν; μὴ πάντες διερμηνεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/030.yaml
  text: Not all have gifts of healings[a], do they? Not all speak in tongues, do they? Not all interpret[b], do they?
translation:
  language: tl
  text: Hindi naman lahat ay may mga kaloob ng pagpapagaling[a], hindi ba? Hindi naman lahat ay nagsasalita ng mga wika[b], hindi ba? Hindi naman lahat ay nagbibigay-kahulugan, hindi ba?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kaloob ng mga pagpapagaling.” Pangmaramihan sa Griyego ang “pagpapagaling.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring unawaing “nagsasalita ng mga lengguwahe.” Sa kontekstong ito, tumutukoy ang salita sa kaloob na karaniwang tinatawag na “pagsasalita sa mga wika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πάντες
  choice: Hindi naman lahat ... hindi ba?
  rationale: Ang μή sa bawat tanong ay nagpapahiwatig na negatibo ang inaasahang sagot. Ang anyong ito ay likas sa modernong Filipino at pinananatili ang retorikal na diin na hindi taglay ng lahat ang bawat kaloob.
- source_word: χαρίσματα
  choice: mga kaloob
  rationale: Ang χάρισμα ay kaloob na nagmumula sa biyaya. Sapat at natural dito ang “mga kaloob,” yamang malinaw sa konteksto ng kabanata ang pinagmulan ng mga ito.
- source_word: ἰαμάτων
  choice: mga pagpapagaling
  rationale: Pangmaramihan ang ἰαμάτων. Pinananatili ng salin ang bilang at maaaring tumukoy sa sari-saring pagpapagaling o mga pagkakataon ng pagpapagaling.
- source_word: γλώσσαις
  choice: mga wika
  rationale: Sa konteksto ng 1 Corinto 12–14, tumutukoy ito sa espirituwal na kaloob na karaniwang tinatawag na pagsasalita sa mga wika. Hindi ginamit ang literal na “mga dila,” na magiging malabo sa modernong Filipino.
- source_word: λαλοῦσιν
  choice: nagsasalita
  rationale: Naglalarawan ang pangkasalukuyang pandiwa ng pangkalahatang gawain o katangian, kaya ang payak na “nagsasalita” ang likas na salin.
- source_word: διερμηνεύουσιν
  choice: nagbibigay-kahulugan
  rationale: Sa konteksto, ito ang paggawang nauunawaan ng iba ang sinasabi sa mga wika. Pinananatili ng “nagbibigay-kahulugan” ang saklaw na interpretasyon nang hindi nililimitahan sa teknikal na pagsasalin lamang.
theological_decisions:
- issue: Mga retorikal na tanong na may μή
  choice: Isinalin bilang mga tanong na malinaw na umaasa ng negatibong sagot
  alternative: Isalin bilang payak na “Lahat ba ay...?” nang hindi ipinahihiwatig ang inaasahang sagot
  rationale: Ipinapakita ng sintaks na hindi taglay ng bawat mananampalataya ang bawat kaloob. Pinananatili nito ang diin ni Pablo sa pagkakaiba-iba ng mga kaloob sa iisang katawan.
- issue: Saklaw ng διερμηνεύουσιν
  choice: nagbibigay-kahulugan
  alternative: nagsasalin; nagpapaliwanag
  rationale: Hindi tiyak sa salita lamang kung teknikal na pagsasalin o mas malawak na interpretasyon ang mekanismo. Ang napiling parirala ay hindi nagpapasya nang higit sa sinasabi ng konteksto.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “hindi naman lahat ... hindi ba?” upang natural na maipakita ang negatibong sagot na inaasahan ng tatlong magkakatulad na tanong. Inilagay ang talababa [b] pagkatapos ng “mga wika,” ang salitang talagang tinatalakay nito.
