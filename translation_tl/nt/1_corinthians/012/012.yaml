  text: Καθάπερ γὰρ τὸ σῶμα ἕν ἐστιν καὶ μέλη ⸂πολλὰ ἔχει⸃, πάντα δὲ τὰ μέλη τοῦ ⸀σώματος πολλὰ ὄντα ἕν ἐστιν σῶμα, οὕτως καὶ ὁ Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/012.yaml
  text: For just as the body is one and has many members[a], and all the members of the body, though they are many, are one body[b], so also is Messiah.
translation:
  language: tl
  text: Sapagkat kung paanong ang katawan ay iisa at maraming bahagi, at ang lahat ng bahagi ng katawan, bagaman marami, ay iisang katawan, gayundin ang Mesiyas.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Cristo.” Ang Griyegong Χριστός ay isinaling “Mesiyas” dito upang mapanatili ang kahulugan nito bilang titulo, at hindi lamang bilang pangalang pantangi.
    reason: alternative_reading
  - marker: b
    text: 'Sa literal, “gayundin ang Mesiyas.” Isa itong maigsing pahayag na ipinaliliwanag ng mga kasunod na talata: ang maraming bahagi ay bumubuo ng iisang katawan.'
    reason: cross_reference
lexical_decisions:
- source_word: Καθάπερ γὰρ
  choice: Sapagkat kung paanong
  rationale: Pinananatili ng “sapagkat” ang paliwanag na ugnayan ng γάρ sa naunang argumento, at ng “kung paanong” ang paghahambing na ipinahihiwatig ng καθάπερ.
- source_word: σῶμα
  choice: katawan
  rationale: Ito ang tuwiran at likas na salin sa metapora ni Pablo tungkol sa katawan.
- source_word: ἕν
  choice: iisa / iisang
  rationale: Ang “iisa” ay malinaw na nagpapahayag ng pagkakaisa sa kabila ng dami; ginamit ang anyong “iisang” bago ang pangngalan ayon sa likas na balarila ng Tagalog.
- source_word: μέλη
  choice: mga bahagi
  rationale: Sa konteksto ng pisikal na katawan, mas natural at malinaw ang “mga bahagi” kaysa “mga kasapi,” habang naihahanda pa rin nito ang aplikasyon sa mga tao sa mga kasunod na talata.
- source_word: πάντα δὲ τὰ μέλη τοῦ σώματος
  choice: at ang lahat ng bahagi ng katawan
  rationale: Mahinang pang-ugnay ang δέ rito, kaya likas ang “at” sa halip na isang mariing pasalungat na salita.
- source_word: πολλὰ ὄντα
  choice: bagaman marami
  rationale: Ipinahahayag nito sa natural na Tagalog ang konsesibong diwa ng pariralang participial.
- source_word: οὕτως καὶ
  choice: gayundin
  rationale: Maikli at natural na naghahayag ng katumbas na panig ng paghahambing.
- source_word: ὁ Χριστός
  choice: ang Mesiyas
  rationale: Pinananatili nito ang Χριστός bilang titulong nangangahulugang ang Pinahiran, sa halip na ituring lamang itong pangalang pantangi.
theological_decisions:
- issue: Pagkasalin sa ὁ Χριστός
  choice: ang Mesiyas
  alternative: si Cristo / ang Cristo
  rationale: Gumaganap dito ang Χριστός bilang isang teolohikal na titulo. Ang “Mesiyas” ay natural sa modernong Filipino at pinananatili ang titulong kahulugan nito.
- issue: Kahulugan ng “οὕτως καὶ ὁ Χριστός”
  choice: gayundin ang Mesiyas
  alternative: gayundin ang katawan ng Mesiyas / gayundin ang iglesya
  rationale: Sadyang maigsi at kapansin-pansin ang pahayag ni Pablo. Hindi ito pinalawak upang tukuyin nang tahasan ang “katawan ng Mesiyas” o “iglesya,” sapagkat gagawin niyon sa mismong salin ang interpretasyong ipinapaliwanag pa lamang ng kasunod na konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga bahagi” para sa metapora ng katawan at pinanatili ang siksik na teolohikal na pahayag sa hulihan nang hindi ito pinalalawak.
