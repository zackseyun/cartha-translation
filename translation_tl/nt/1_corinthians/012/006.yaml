  text: And there are varieties of workings[b][a], but it is the same God who works all things in all people.
translation:
  language: tl
  text: May iba't ibang uri ng mga gawain, ngunit iisang Diyos ang gumagawa ng lahat ng bagay sa lahat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa lahat ng tao.” Walang tahasang pangngalan sa Griyego; ipinahihiwatig ng konteksto na tumutukoy ito sa lahat ng mga kasapi na pinagkikilosan ng Diyos sa mga gawaing ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαιρέσεις
  choice: iba't ibang uri
  rationale: Likas sa modernong Tagalog at ipinahihiwatig ang pagkakaiba-iba nang hindi nagpapahiwatig ng hidwaan o pagkakabaha-bahagi.
- source_word: ἐνεργημάτων
  choice: pagkilos
  rationale: Tumutukoy sa mga gawa o bunga ng aktibong kapangyarihan; pinananatili rin nito ang ugnayang leksikal sa ἐνεργῶν, na isinaling “kumikilos.”
- source_word: ὁ δὲ αὐτὸς θεός
  choice: ngunit iisang Diyos
  rationale: 'Ipinakikita ng “ngunit” ang banayad na pagtutol: magkakaiba ang mga pagkilos, subalit iisa ang Diyos na pinagmumulan ng mga ito. Ang “iisang” ay likas na paraan sa Tagalog upang idiin ang pagkakakilanlan ng αὐτός sa konteksto.'
- source_word: ὁ ἐνεργῶν
  choice: ang kumikilos
  rationale: Natural na katumbas ng kasalukuyang participle at pinananatili ang aktibo at nagpapatuloy na diwa, pati ang kaugnayan nito sa “pagkilos.”
- source_word: τὰ πάντα
  choice: lahat ng ito
  rationale: Ang “lahat ng ito” ay natural sa Tagalog at, ayon sa agarang konteksto, tumutukoy sa sari-saring pagkilos na binanggit, bagaman mas literal na malawak ang Griyegong “lahat.”
- source_word: ἐν πᾶσιν
  choice: sa lahat
  rationale: Pinananatili ang kawalan ng tahasang pangngalan sa Griyego at sa gayon ay hindi ipinapasok sa pangunahing teksto ang “tao”; malinaw sa konteksto na tumutukoy ito sa mga kasapi ng sambayanan.
theological_decisions:
- issue: Saklaw ng pagkilos ng Diyos sa τὰ πάντα ἐν πᾶσιν
  choice: “kumikilos ng lahat ng ito sa lahat”
  alternative: “kumikilos ng lahat ng bagay sa lahat ng tao”
  rationale: Pinananatili ng salin ang lawak at bahagyang kalabuan ng Griyego habang hinahayaan ang konteksto ng mga kaloob sa kapulungan na gabayan ang pagbasa, nang hindi ginagawang tahasang pansansinukob o labis na nililimitahan ang pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “iba't ibang uri ng pagkilos” upang maipahayag ang pagkakaiba-iba at mapanatili ang pag-uugnay ng ἐνεργημάτων at ἐνεργῶν. Pinili ang “sa lahat” upang ingatan ang tunay na kalabuan ng orihinal.
