translation:
  language: tl
  text: Sa katunayan, maraming bahagi nga, ngunit iisa ang katawan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν
  choice: ang totoo
  rationale: Sa kontekstong ito, ipinakikita ng νῦν ang aktuwal na kalagayan bilang pagsalungat sa ipinapalagay sa naunang talata, hindi lamang ang panahong “ngayon.”
- source_word: δὲ
  choice: Ngunit
  rationale: Naghuhudyat ang δέ ng banayad na pagsalungat at pagbabalik sa aktuwal na kalagayan.
- source_word: πολλὰ ... μέλη
  choice: maraming bahagi
  rationale: Sa talinghaga ng katawan, ang μέλη ay mga bahaging bumubuo sa katawan. Likas at malinaw sa makabagong Filipino ang “mga bahagi.”
- source_word: μὲν ... δὲ
  choice: maraming bahagi ... ngunit iisa
  rationale: Ipinapakita ng magkaugnay na mga kataga ang timbang na pagsalungat ng marami at ng iisa; natural itong naihahayag sa Filipino sa pamamagitan ng “ngunit.”
- source_word: ἓν
  choice: iisa
  rationale: Binibigyang-diin ng anyong “iisa” ang pagkakaisa ng katawan sa kabila ng dami ng mga bahagi.
- source_word: σῶμα
  choice: katawan
  rationale: Pinananatili ng “katawan” ang tahasang larawang ginagamit ni Pablo at ang diwa ng pagkakaisa sa gitna ng pagkakaiba-iba.
theological_decisions:
- issue: Pagpapahayag sa μέλη sa talinghaga ng katawan
  choice: mga bahagi
  alternative: mga sangkap
  rationale: Mas malinaw at likas sa karaniwang modernong Filipino ang “mga bahagi” bilang mga bumubuo sa katawan. Posible rin ang “mga sangkap,” kaya inilalahad ito sa talababa nang hindi ginagawang teknikal o institusyonal ang talinghaga.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ang totoo” upang natural na maipahayag ang kontekstuwal na gamit ng νῦν, at ang pag-uulit ng “ngunit” ay nagpapanatili sa salungatan habang nananatiling madaling basahin.
