  text: Sa halip, lalong kailangan ang mga bahagi ng katawan na waring mas mahina.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Ngunit, higit na kailangan ang mga bahagi ng katawan na waring mas mahina.” Tahasang may pagpapasidhi ang Griyego: “lalong” o “higit na.”'
