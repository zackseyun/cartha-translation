lexical_decisions:
- source_word: ἀλλὰ πολλῷ μᾶλλον
  choice: Sa halip, lalo pang
  rationale: Pinananatili ang mariing pagsalungat ng ἀλλά at ang tahasang pagpapasidhi ng πολλῷ μᾶλλον, nang natural sa makabagong Tagalog.
- source_word: τὰ δοκοῦντα
  choice: na waring
  rationale: Ipinahihiwatig ng δοκέω ang anyo o palagay, hindi ang tiyak na tunay na kalagayan.
- source_word: μέλη τοῦ σώματος
  choice: mga bahagi ng katawan
  rationale: Natural at konkretong pananalita sa Tagalog na nagpapanatili sa metapora ng katawan; hindi ito tahasang ginawang 'mga kaanib'.
- source_word: ἀσθενέστερα ὑπάρχειν
  choice: mas mahina
  rationale: Inilalahad ang paghahambing sa lakas at iniuugnay sa 'waring' gaya ng kayarian ng Griyego.
- source_word: ἀναγκαῖά ἐστιν
  choice: kailangang-kailangan
  rationale: Ipinapahayag ang matinding pangangailangan sa malinaw at karaniwang Tagalog; maaari ring unawain bilang hindi maaaring wala.
theological_decisions:
- issue: Metaporang katawan sa konteksto ng iglesya
  choice: Panatilihin ang konkretong 'mga bahagi ng katawan.'
  alternative: Isaling tuwiran bilang 'mga kaanib ng iglesya.'
  rationale: Bagaman inilalapat ni Pablo ang katawan sa iglesya sa konteksto, ang mismong talata ay nananatili sa larawan ng mga bahagi ng katawan.
- issue: Kung tunay bang mahina ang tinutukoy na mga bahagi
  choice: Gamitin ang 'waring mas mahina.'
  alternative: Gawing 'mga itinuturing na mas mahina.'
  rationale: Pinananatili ng 'waring' ang posibilidad na anyo o palagay lamang ang kahinaan, nang hindi ipinapasiya kung kaninong pananaw iyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “waring” upang mapanatili ang pagkakaiba ng nakikitang kahinaan at tunay na kalagayan, at “kailangang-kailangan” upang natural na maipahayag ang ἀναγκαῖα.
