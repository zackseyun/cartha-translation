base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/004.yaml
  text: There are varieties of gifts[a], but the same Spirit.
translation:
  language: tl
  text: May iba't ibang uri ng mga kaloob[a], ngunit iisa ang Espiritu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga pagkakaiba-iba” o “mga pamamahagi ng mga kaloob.” Binibigyang-diin ng Griyego ang pagkakaiba-iba ng mga kaloob, hindi ang pagkakahati-hati sa iglesya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διαιρέσεις
  choice: iba't ibang uri
  rationale: Ipinahahayag nito ang pagkakaiba-iba ng mga kaloob sa loob ng isang kabuuan, hindi ang pagkakabaha-bahagi ng iglesya.
- source_word: δὲ ... δὲ
  choice: may ... ngunit
  rationale: Ang unang δέ ay mahinang pang-ugnay na likas na hindi na kailangang katawanin nang hiwalay sa Filipino; ang ikalawa ay malinaw na panalungat at isinaling “ngunit.”
- source_word: χαρισμάτων
  choice: mga kaloob
  rationale: Likas at malinaw itong katawagan sa mga kaloob na ipinagkakaloob ng biyaya sa kontekstong ito.
- source_word: τὸ ... αὐτὸ
  choice: iisa
  rationale: Idinidiin nito na sa kabila ng sari-saring kaloob, iisang Espiritu ang kanilang pinagmumulan.
- source_word: πνεῦμα
  choice: Espiritu
  rationale: Tinutukoy ng agarang konteksto ang banal na Espiritu na namamahagi ng mga kaloob.
theological_decisions:
- issue: Tinutukoy ng πνεῦμα
  choice: Espiritu, na tumutukoy sa Banal na Espiritu
  alternative: espiritu ng tao o isang espirituwal na kapangyarihan
  rationale: Sa 1 Corinto 12:3–11, ang Espiritu ang banal na pinagmumulan at tagapamahagi ng mga kaloob; sapat ang malaking titik upang ipakita ang tinutukoy nang hindi nagpapalawak sa pangunahing teksto.
translation_notes:
  register: Makabagong Filipino na malinaw, marangal, at likas pakinggan. Ginamit ang “iba't ibang uri” upang ihayag ang lehitimong pagkakaiba-iba, at ang “iisa” upang idiin ang nagkakaisang pinagmumulan.
