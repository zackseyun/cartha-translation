id: 1CO.6.13
reference: 1 Corinthians 6:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τὰ βρώματα τῇ κοιλίᾳ, καὶ ἡ κοιλία τοῖς βρώμασιν· ὁ δὲ θεὸς καὶ ταύτην καὶ ταῦτα καταργήσει. τὸ δὲ σῶμα οὐ τῇ πορνείᾳ ἀλλὰ τῷ κυρίῳ, καὶ ὁ κύριος τῷ σώματι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/013.yaml
  text: Food is for the stomach[a], and the stomach for food—but God will do away with both it and them. But the body is not for sexual immorality, but for the Lord[c][b], and the Lord for the body.
translation:
  language: tl
  text: Ang mga pagkain ay para sa tiyan, at ang tiyan ay para sa mga pagkain[a]—ngunit kapuwa ang tiyan at ang mga pagkain ay aalisin ng Diyos.[b] Subalit ang katawan ay hindi para sa seksuwal na imoralidad, kundi para sa Panginoon, at ang Panginoon ay para sa katawan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maraming tagapagpaliwanag ang itinuturing na kasabihan ito ng mga taga-Corinto na sinasagot ni Pablo. Ngunit walang panipi o ibang hayag na panandang pagsipi sa tekstong Griyego.
    reason: alternative_reading
  - marker: b
    text: 'Ang “aalisin” ay maaari ring isaling “wawasakin,” “papawiin,” o “pawawalang-bisa.” Sa literal: “kapuwa ito at ang mga ito,” na tumutukoy sa tiyan at sa mga pagkain.'
    reason: lexical_alternative
  - marker: c
    text: Pinananatili rito ang maikli at tugunang pananalita ng Griyego. Hindi nito tahasang sinasabi kung paano “para sa katawan” ang Panginoon.
    reason: theological_ambiguity
lexical_decisions:
- source_word: τὰ βρώματα
  choice: ang mga pagkain
  rationale: Pinananatili ang tahasang pangmaramihang anyo ng Griyego. Natural pa rin ito sa Filipino at angkop sa balanseng paralelismo ng kasabihan.
- source_word: τῇ κοιλίᾳ / ἡ κοιλία
  choice: para sa tiyan / ang tiyan
  rationale: Sa konteksto, tumutukoy ito sa sangkap ng katawan na kaugnay ng pagkain at pagtunaw. Mas malinaw at dignified ang “tiyan” kaysa sa mas kolokyal na mga alternatibo.
- source_word: καταργήσει
  choice: aalisin
  rationale: Ipinahahayag nito na wawakasan o papawiin ng Diyos ang kasalukuyang gamit o kaayusan nang hindi ipinipilit ang diwang lubusang pisikal na pagwasak.
- source_word: καὶ ταύτην καὶ ταῦτα
  choice: kapuwa ang tiyan at ang mga pagkain
  rationale: Inuulit ang malinaw na mga tinutukoy ng mga panghalip na Griyego upang maiwasan ang alanganing “ito at ang mga ito” sa Filipino.
- source_word: τὸ σῶμα
  choice: ang katawan
  rationale: Ito ang tuwiran at karaniwang katumbas, at pinananatili ang pisikal at teolohikal na kabuluhan ng katawan sa pangungusap.
- source_word: τῇ πορνείᾳ
  choice: para sa seksuwal na imoralidad
  rationale: Malawak at madaling maunawaang makabagong katumbas ito ng πορνεία; hindi ito nililimitahan sa isang partikular na uri lamang ng seksuwal na kasalanan.
- source_word: τῷ κυρίῳ / ὁ κύριος
  choice: para sa Panginoon / ang Panginoon
  rationale: Pinananatili ang karaniwang titulong teolohikal at ang maikli at tugunang pagkakaugnay ng Panginoon at ng katawan.
- source_word: δὲ
  choice: ngunit / subalit
  rationale: Ang unang δὲ ay naghuhudyat ng pagtutuwid matapos ang unang pahayag, at ang ikalawa ay nagtatangi sa katawan mula sa kaayusan ng pagkain at tiyan. Ang dalawang salitang pang-ugnay ay natural sa Filipino at malinaw ang mga antas ng pagsalungat.
theological_decisions:
- issue: Kung ang pambungad na pahayag ay isang kasabihan ng mga taga-Corinto na sinisipi ni Pablo
  choice: Inilagay ang pambungad sa panipi ngunit nilagyan ng talababa na kinikilalang hindi minarkahan ng tekstong Griyego ang pagsipi.
  alternative: Ilahad ito nang walang panipi bilang tuwirang pahayag ni Pablo.
  rationale: Malakas ang posibilidad na isa itong kasabihang sinasagot ni Pablo, ngunit hindi ito tiyak mula sa anyo ng Griyego. Kaya hayag sa mambabasa ang karaniwang pagbasa habang pinananatili sa talababa ang tunay na kalabuan.
- issue: Kahulugan ng καταργήσει para sa tiyan at mga pagkain
  choice: “aalisin” bilang pahayag ng pagwawakas o pagpawi
  alternative: “wawasakin” o “pawawalang-bisa”
  rationale: Hindi nito ipinipilit kung ang tinutukoy ay pisikal na pagwasak, pag-aalis ng gamit, o pagwawakas ng kaayusan. Nasa talababa ang mahahalagang posibleng diwa.
- issue: Lakas ng pariralang “ang Panginoon ay para sa katawan”
  choice: Pinanatili ang maikli at tugunang pahayag.
  alternative: Palawakin bilang “pinangangalagaan ng Panginoon ang katawan” o “ang Panginoon ay para sa ikabubuti ng katawan.”
  rationale: Hindi tinutukoy ng Griyego ang eksaktong paraan ng kaugnayan ng Panginoon sa katawan. Ang literal na paralelismo ay nagpapanatili sa siksik na teolohikal na pahayag at hindi nagdaragdag ng interpretasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang paralelismo ng orihinal, iniwasan ang makalumang “pakikiapid” dahil maaari itong maunawaan nang napakakitid, at hindi pinalawak ang huling sugnay upang mapanatili ang teolohikal na siksik at kalabuan nito.
