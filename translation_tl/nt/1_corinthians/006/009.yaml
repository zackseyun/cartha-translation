  to: 'O hindi ba ninyo alam na ang mga hindi matuwid ay hindi magmamana ng kaharian ng Diyos? Huwag kayong magpadaya: ni ang mga gumagawa ng seksuwal na imoralidad, ni ang mga sumasamba sa mga diyos-diyosan, ni ang mga nangangalunya, ni ang mga malalambot na lalaki[a], ni ang mga lalaking nakikipagtalik sa kapwa lalaki[b].'
