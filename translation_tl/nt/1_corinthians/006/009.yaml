language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἢ οὐκ οἴδατε ὅτι ἄδικοι ⸂θεοῦ βασιλείαν⸃ οὐ κληρονομήσουσιν; μὴ πλανᾶσθε· οὔτε πόρνοι οὔτε εἰδωλολάτραι οὔτε μοιχοὶ οὔτε μαλακοὶ οὔτε ἀρσενοκοῖται
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/009.yaml
  text: 'Or do you not know that the unrighteous will not inherit the kingdom of God? Do not be deceived: neither the sexually immoral[a], nor idolaters, nor adulterers, nor effeminate men[b], nor men who have sex with men'
translation:
  language: tl
  text: 'O hindi ba ninyo alam na ang mga hindi matuwid ay hindi magmamana ng kaharian ng Diyos? Huwag kayong magpadaya: ni ang mga gumagawa ng seksuwal na imoralidad, ni ang mga sumasamba sa mga diyos-diyosan, ni ang mga nangangalunya, ni ang mga malalambot na lalaki[a], ni ang mga lalaking nakikipagtalik sa kapwa lalaki[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego na μαλακοί ay literal na maaaring mangahulugang “malalambot.” Maaari rin itong tumukoy sa mga lalaking binabae, mahina sa moral, o—sa kontekstong ito—marahil sa mga lalaking bayaran sa pakikipagtalik o sa gumaganap ng pasibong papel sa pagtatalik ng mga lalaki.
    reason: lexical_alternative
  - marker: b
    text: Ang bihira at pinagtatalunang salitang Griyego na ἀρσενοκοῖται ay maaari ring isaling “mga lalaking nagsasagawa ng homoseksuwal na pagtatalik,” “mga sodomita,” o, sa mas malawak na diwa, “mga lalaking gumagawa ng ipinagbabawal na pakikipagtalik sa mga lalaki.” Iniuugnay ito ng marami sa pananalita ng Levitico sa saling Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: O
  rationale: Pinananatili ang matalim na retorikal na pagpapatuloy mula sa naunang pangangatwiran ni Pablo.
- source_word: οὐκ οἴδατε
  choice: hindi ba ninyo alam
  rationale: Likas at tuwirang katumbas ng karaniwang retorikal na pormula ni Pablo.
- source_word: ἄδικοι
  choice: ang mga hindi matuwid
  rationale: Pinananatili ang malawak na moral at teolohikal na diwa, sa halip na ituon lamang sa ilang maling gawa.
- source_word: θεοῦ βασιλείαν
  choice: kaharian ng Diyos
  rationale: Karaniwan, malinaw, at tapat na salin ng pariralang Griyego.
- source_word: κληρονομήσουσιν
  choice: magmamana
  rationale: Pinananatili ang larawan ng pamana at ang kaugnay nitong tipan at panghinaharap na diwa.
- source_word: μὴ πλανᾶσθε
  choice: Huwag kayong magpadaya
  rationale: Natural na babala sa Filipino na hindi nililimitahan kung ang panlilinlang ay mula sa sarili o sa iba.
- source_word: πόρνοι
  choice: mga gumagawa ng seksuwal na imoralidad
  rationale: Malawak at kasalukuyang pananalita na hindi nagpapakitid sa termino sa isang uri lamang ng seksuwal na kasalanan.
- source_word: εἰδωλολάτραι
  choice: mga sumasamba sa mga diyos-diyosan
  rationale: Mas madaling maunawaan ng karaniwang mambabasa kaysa sa teknikal na katawagang “mga idolatro.”
- source_word: μοιχοὶ
  choice: mga nangangalunya
  rationale: Tuwirang tumutukoy sa pakikiapid laban sa katapatan sa pag-aasawa.
- source_word: μαλακοὶ
  choice: mga lalaking malalambot
  rationale: Pinananatili ang pangunahing larawang leksikal na “malambot” at iniiwasang gawing tiyak sa pangunahing teksto ang pinagtatalunang seksuwal na kahulugan; inilalahad sa talababa ang mga posibleng pakahulugan.
- source_word: ἀρσενοκοῖται
  choice: mga lalaking nakikipagtalik sa kapwa lalaki
  rationale: Isang mapaglarawang salin na nakatuon sa gawain, hindi sa makabagong kategorya ng identidad; tumutugma sa malamang na ugnayan ng salita sa pananalita ng Levitico sa Griyego, habang kinikilala sa talababa na pinagtatalunan ang saklaw nito.
theological_decisions:
- issue: Magkaugnay ngunit pinagtatalunang kahulugan ng μαλακοὶ at ἀρσενοκοῖται
  choice: Isinalin bilang “mga lalaking malalambot” at “mga lalaking nakikipagtalik sa kapwa lalaki,” na may magkahiwalay na talababa.
  alternative: Maaaring unawain ang una bilang mga lalaking mahina sa moral, mga lalaking binabae, mga lalaking bayaran sa pakikipagtalik, o mga lalaking gumaganap ng pasibong papel sa pagtatalik ng mga lalaki; ang ikalawa naman bilang mga lalaking nagsasagawa ng homoseksuwal na pagtatalik, mga sodomita, o mas malawak na mga lalaking gumagawa ng ipinagbabawal na pakikipagtalik sa lalaki.
  rationale: Hindi lubos na tiyak ang eksaktong saklaw ng dalawang salita. Ang pangunahing teksto ay hindi gumagamit ng makabagong katawagan sa seksuwal na identidad at hindi rin tahimik na nagpapasya sa lahat ng pinagtatalunang detalye; ang mahahalagang alternatibo ay pinananatili sa mga talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “ni … ni …” upang mapanatili ang sunod-sunod na diin ng οὔτε. Ang mga pinagtatalunang terminong seksuwal ay isinalin nang hindi gumagamit ng makabagong kategorya ng identidad, at ang tunay na kalabuan ay malinaw na inilagay sa mga talababa.
