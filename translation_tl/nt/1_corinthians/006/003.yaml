  text: Do you not know that we will judge angels? How much more[a], the things of this life!
translation:
  language: tl
  text: Hindi ba ninyo alam na hahatulan natin ang mga anghel? Paano pa kaya[a] ang mga bagay na nauukol sa buhay na ito!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Lalo na ang mga bagay na nauukol sa buhay na ito!” o “Huwag nang banggitin pa ang mga bagay na nauukol sa buhay na ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ οἴδατε
  choice: Hindi ba ninyo alam
  rationale: Pinananatili ang karaniwang pormula ni Pablo na isang retorikal na tanong, sa natural at magalang na modernong Tagalog.
- source_word: ὅτι
  choice: na
  rationale: Likas na pananda sa Tagalog para sa nilalaman ng pandiwang “alam.”
- source_word: ἀγγέλους
  choice: mga anghel
  rationale: Sa kontekstong eskatolohikal at panghukuman, tumutukoy ito sa mga makalangit na nilalang, hindi sa mga taong mensahero.
- source_word: κρινοῦμεν
  choice: hahatulan natin
  rationale: Ang anyong panghinaharap ay pinananatili, at ang “hahatulan” ay hindi nagpapasiya kung paano o hanggang saan isasagawa ang paghatol.
- source_word: μήτιγε
  choice: lalo na
  rationale: Ipinahahayag nito ang pinatinding pangangatwiran mula sa mas dakilang bagay patungo sa mas maliit; nag-iiwan ang talababa ng iba pang posibleng paraan ng pagpapahayag.
- source_word: βιωτικά
  choice: ang mga bagay sa buhay na ito
  rationale: Malawak at tuwirang tumutukoy sa mga usaping nauukol sa karaniwang buhay sa daigdig, nang hindi nililimitahan sa isang partikular na uri ng alitan.
theological_decisions:
- issue: Ang kahulugan ng paghatol ng mga mananampalataya sa mga anghel
  choice: Panatilihin ang tuwirang pananalitang “hahatulan natin ang mga anghel.”
  alternative: “mamamahala tayo sa mga anghel” o “hahatulan natin ang mga nagkasalang anghel”
  rationale: Hindi tinutukoy ng teksto ang paraan, saklaw, o uri ng mga anghel na hahatulan; iniiwasan ng salin ang pagpasok ng isang tiyak na sistemang eskatolohikal.
- issue: Retorikal na ugnayan ng μήτιγε sa βιωτικά
  choice: “Lalo na ang mga bagay sa buhay na ito!”
  alternative: “Paano pa kaya ang mga bagay sa buhay na ito!” o “huwag nang banggitin pa ang mga bagay sa buhay na ito”
  rationale: Ipinakikita ng konteksto ang pangangatwiran mula sa higit na dakila patungo sa higit na maliit, ngunit may pagkakaiba sa posibleng idiomatikong pagpapahayag ng eliptikong parirala; kaya binabanggit ang mga alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “ninyo” bilang natural na pangmaramihang pagtukoy sa mga taga-Corinto, at pinanatili ang maikli at mariing retorikal na anyo ng Griyego.
