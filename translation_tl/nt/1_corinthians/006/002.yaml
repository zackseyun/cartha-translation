  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀ἢ οὐκ οἴδατε ὅτι οἱ ἅγιοι τὸν κόσμον κρινοῦσιν; καὶ εἰ ἐν ὑμῖν κρίνεται ὁ κόσμος, ἀνάξιοί ἐστε κριτηρίων ἐλαχίστων;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/002.yaml
  text: Or do you not know that the saints will judge the world? And if the world is judged by you[b][a], are you unworthy of the smallest courts?
translation:
  language: tl
  text: O hindi ba ninyo alam na hahatulan ng mga banal ang sanlibutan? At kung hahatulan ang sanlibutan sa pamamagitan ninyo,[a] hindi ba kayo karapat-dapat na humatol sa pinakamaliliit na usapin?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa gitna ninyo.” Mas literal ang pariralang Griyego na “kung ang sanlibutan ay hinahatulan sa gitna ninyo,” ngunit sa konteksto ay ipinahihiwatig na makikibahagi ang mga banal sa paghatol sa sanlibutan.
    reason: lexical_alternative
  - marker: b
    text: O “sa pinakamaliliit na hukuman.” Maaari ring tumukoy ang salitang Griyego sa mga hukuman o sa mga usaping dinidinig ng mga ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: O
  rationale: Ipinagpapatuloy nito ang matalas na retorikal na pangangatwiran ni Pablo mula sa naunang talata.
- source_word: οὐκ οἴδατε
  choice: hindi ba ninyo alam
  rationale: Likas na pormulang retorikal sa Filipino at malapit sa kahulugan ng pandiwang Griyego.
- source_word: οἱ ἅγιοι
  choice: mga banal
  rationale: Tumutukoy sa mga taong ibinukod para sa Diyos, ibig sabihin, sa mga mananampalataya bilang isang kabuuan; hindi nito nililimitahan ang tinutukoy sa isang natatanging pangkat.
- source_word: τὸν κόσμον
  choice: ang sanlibutan
  rationale: Ang 'sanlibutan' ay dignidad at karaniwang saling biblikal para sa κόσμος sa malawak nitong diwang pantao o pansanlibutan.
- source_word: κρινοῦσιν
  choice: hahatulan
  rationale: Pinananatili ang panghinaharap at ang pangunahing diwa ng paghatol nang hindi ipinapaliwanag ang tiyak na paraan nito.
- source_word: ἐν ὑμῖν
  choice: sa pamamagitan ninyo
  rationale: Ipinahahayag ang instrumental o kaugnay na diwa sa kontekstong panghukuman, samantalang inilalahad sa talababa ang mas literal na 'sa gitna ninyo.'
- source_word: ἀνάξιοί ἐστε
  choice: kayo ba ay hindi karapat-dapat
  rationale: Pinananatili ang mapanuring lakas ng ἀνάξιος at ang anyong retorikal ng tanong.
- source_word: κριτηρίων ἐλαχίστων
  choice: humatol sa pinakamaliliit na usapin
  rationale: Natural sa Filipino at angkop sa konteksto ng mga alitang dinadala sa hukuman; pinananatili sa talababa ang alternatibong tumutukoy sa maliliit na hukuman.
theological_decisions:
- issue: Pagkakakilanlan ng 'mga banal'
  choice: ang mga mananampalataya o bayan ng Diyos bilang kabuuan
  alternative: isang mas makitid na pangkat ng mga mananampalatayang namumukod sa kabanalan
  rationale: Sa karaniwang gamit ni Pablo, ang οἱ ἅγιοι ay katawagan sa mga Cristiano sa pangkalahatan, hindi sa isang elitistang pangkat.
- issue: Pakikibahagi ng mga banal sa paghatol sa sanlibutan
  choice: tunay silang makikibahagi sa paghatol sa hinaharap, ngunit hindi tinutukoy ang eksaktong paraan
  alternative: matalinghagang pagsusuring moral lamang, o ganap at nagsasariling kapangyarihang humatol
  rationale: Malinaw na sinasabi ng teksto na hahatol ang mga banal, ngunit hindi nito ipinaliliwanag kung paano isasagawa ang paghatol; kaya hindi ito nililinaw nang lampas sa sinabi ng teksto.
- issue: Kahulugan ng κριτηρίων ἐλαχίστων
  choice: ang pinakamaliliit o pinakamababang uri ng mga usaping kailangang hatulan
  alternative: ang pinakamaliliit o pinakamababang hukuman
  rationale: Maaaring tumukoy ang κριτήριον sa hukuman o sa usaping panghukuman. Ang pangunahing salin ay natural sa konteksto, habang pinananatili ng talababa ang leksikal na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'sanlibutan' at 'mga banal' bilang pamilyar ngunit nauunawaang mga katawagang biblikal. Inayos nang bahagya ang huling parirala upang maging natural sa Filipino, habang pinananatili sa mga talababa ang tunay na leksikal at sintaktikong kalabuan.
