  terminology: Ang “Mesiyas” ay angkop na salin ng Χριστός bilang titulo at ang alternatibong “Cristo” ay wastong inilalahad sa talababa. Ang “mga bahagi” ay katanggap-tanggap na panatilihin ang larawang μέλη sa magkabilang paggamit.
