revisions:
- from: Hindi ba ninyo alam na ang inyong mga katawan ay mga bahagi ng Mesiyas? Kung gayon, kukunin ko ba ang mga bahagi ng Mesiyas at gagawing mga bahagi ng isang babaeng nagbebenta ng aliw? Huwag nawang mangyari iyon.[a][b]
  to: Hindi ba ninyo alam na ang inyong mga katawan ay mga bahagi ng Mesiyas? Kung gayon, kukunin ko ba ang mga bahagi ng Mesiyas at gagawing mga bahagi ng isang prostituta? Huwag nawang mangyari![a][b]
  rationale: Pinalitan ang eupemistikong “babaeng nagbebenta ng aliw” ng “prostituta” upang malinaw na maisalin ang πόρνη nang walang pagdaragdag o pagpapalabnaw ng kahulugan. Inalis ang panghalip na “iyon” sa pangwakas upang maging mas tuwiran ang mariing optatibong pagtanggi. Dapat ding itama sa tala ng σώματα ang “nakakatawang pag-iral” bilang “aktuwal na pag-iral sa katawan” o “pisikal na mga katawan.”
  reviewer_model: gpt-5.6-terra
