id: 1CO.6.15
reference: 1 Corinthians 6:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὐκ οἴδατε ὅτι τὰ σώματα ὑμῶν μέλη Χριστοῦ ἐστιν; ἄρας οὖν τὰ μέλη τοῦ Χριστοῦ ποιήσω πόρνης μέλη; μὴ γένοιτο.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/015.yaml
  text: Do you not know that your bodies are members of Messiah? Shall I then take the members of Messiah and make them members of a prostitute? May it never be[a][b].
translation:
  language: tl
  text: Hindi ba ninyo alam na ang inyong mga katawan ay mga bahagi ng Mesiyas? Kung gayon, kukunin ko ba ang mga bahagi ng Mesiyas at gagawing mga bahagi ng isang prostituta? Huwag nawang mangyari![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Cristo” sa halip na “Mesiyas.” Ang Griegong titulong Χριστός ay maaaring gamitin bilang isinaling titulo (“Mesiyas”) o bilang anyong tulad ng isang pangalan (“Cristo”).
    reason: alternative_reading
  - marker: b
    text: O, “Hinding-hindi!” o “Huwag kailanman!” Ang Griegong μὴ γένοιτο ay isang mariing pagpapahayag ng pagtanggi.
    reason: lexical_alternative
lexical_decisions:
- source_word: σώματα
  choice: mga katawan
  rationale: Tumutukoy ito sa aktuwal at nakakatawang pag-iral ng mga mananampalataya, hindi lamang sa mga bahagi ng katawan.
- source_word: μέλη
  choice: mga bahagi
  rationale: Pinananatili nito ang larawang ang mga katawan ay mga bahaging kabilang sa isang mas malaking kabuuan; mas natural ito sa modernong Tagalog kaysa sa literal na 'mga sangkap' o 'mga biyas.'
- source_word: Χριστοῦ
  choice: ng Mesiyas
  rationale: Ginamit ang saling-titulo na 'Mesiyas' upang ihayag ang kahulugan ng Χριστός bilang ang Pinahiran, habang kinikilala sa talababa ang nakaugaliang 'Cristo.'
- source_word: ἄρας
  choice: kukunin
  rationale: Sa retorikal na tanong, malinaw at natural nitong ipinapahayag ang sinasadyang pagkuha sa mga bahaging nauukol sa Mesiyas.
- source_word: ποιήσω
  choice: gagawing
  rationale: Tuwiran nitong pinananatili ang matinding larawan ng paggawa sa mga bahagi ng Mesiyas bilang mga bahagi ng isang babaeng nagbebenta ng aliw.
- source_word: πόρνης
  choice: ng isang babaeng nagbebenta ng aliw
  rationale: Tiyak itong tumutukoy sa isang babaeng nakikipagtalik kapalit ng bayad. Ang parirala ay malinaw at dignidad-preserving sa kasalukuyang Tagalog, bagaman hindi nito pinapahina ang tahasang diwa ng salita.
- source_word: μὴ γένοιτο
  choice: Huwag nawang mangyari iyon
  rationale: Pinananatili nito kapwa ang anyong paghiling at ang mariing pagtanggi ni Pablo sa ipinapalagay na gawain.
- source_word: οὐκ οἴδατε
  choice: Hindi ba ninyo alam
  rationale: Natural na retorikal na tanong ito sa Tagalog at pinananatili ang apela sa kaalamang inaasahan nang taglay ng mga mambabasa.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστός sa paglalarawan ng pakikiisa ng katawan
  choice: Mesiyas
  alternative: Cristo
  rationale: Ang 'Mesiyas' ay nagpapanatili sa kahulugan nito bilang titulo. Gayunman, tunay na maaari rin itong gumana bilang pangalang 'Cristo,' kaya inilagay ang alternatibo sa talababa sa halip na alisin ang kalabuan.
- issue: Diwa ng μὴ γένοιτο
  choice: Huwag nawang mangyari iyon
  alternative: Hinding-hindi
  rationale: Ang pinili ay nagpapanatili sa optatibong anyo at sa mariing pagkasuklam sa konklusyon, samantalang ang alternatibo ay mas maikli ngunit hindi gaanong nakapagpapakita ng anyong paghiling.
- issue: Larawan ng μέλη sa dalawang kaugnayan
  choice: mga bahagi ng Mesiyas / mga bahagi ng isang babaeng nagbebenta ng aliw
  alternative: mga sangkap ni Cristo / mga sangkap ng isang bayarang babae
  rationale: Inulit ang parehong parirala upang mapanatili ang sadyang nakakagimbal na paghahambing ni Pablo at hindi mapaliit ang teolohikal na tensiyon ng pakikiisa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang retorikal na tanong, ang pag-uulit ng 'mga bahagi,' at ang mariing pagtatakwil sa hulihan. Ang 'babaeng nagbebenta ng aliw' ay piniling mas natural at hindi mapanlait kaysa sa 'patutot,' habang nananatiling tiyak ang leksikal na kahulugan.
