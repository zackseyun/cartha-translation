id: 1CO.6.4
reference: 1 Corinthians 6:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: βιωτικὰ μὲν οὖν κριτήρια ἐὰν ἔχητε, τοὺς ἐξουθενημένους ἐν τῇ ἐκκλησίᾳ, τούτους καθίζετε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/004.yaml
  text: So if you have courts for matters of this life[c][b][a], do you appoint as judges those who are of no standing in the church?
translation:
  language: tl
  text: Kaya, kung mayroon kayong mga kasong[a] may kinalaman sa pang-araw-araw na buhay, itinatalaga ba ninyo bilang mga hukom ang mga itinuturing na walang halaga sa iglesya?[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga usapin sa pang-araw-araw na buhay”; tumutukoy ang Griyego sa karaniwang makalupa o sibil na mga bagay.
    reason: lexical_alternative
  - marker: b
    text: O “ang mga hinahamak sa iglesya.” Maaaring tumukoy ang pananalitang Griyego, nang may kabalintunaan, sa mga taong itinuturing na walang halaga sa loob ng iglesya o sa mga walang katayuan ayon sa pananaw ng iglesya.
    reason: alternative_reading
  - marker: c
    text: 'May mga umuunawa rito bilang mapanuyang utos: “italaga ninyo bilang mga hukom ang mga itinuturing na walang halaga sa iglesya.”'
    reason: alternative_reading
lexical_decisions:
- source_word: βιωτικὰ
  choice: mga usaping nauukol sa buhay na ito
  rationale: Tumutukoy ito sa karaniwang makalupa, pang-araw-araw, o sibil na mga bagay; iniiwasan ng parirala ang moral na pahiwatig na maaaring dala ng “makamundo.”
- source_word: κριτήρια
  choice: mga usapin
  rationale: Maaaring tumukoy ang pangngalan sa mga hukuman, paghatol, o mga kasong dinidinig. Sa pangungusap na ito, mas natural sa Filipino ang “mga usapin,” habang ang judicial na diwa ay malinaw sa “itinatalaga ... na mga hukom.”
- source_word: ἐὰν ἔχητε
  choice: kung mayroon kayong
  rationale: Tuwirang pinananatili ang kondisyonal na anyo ng Griyego sa natural na Filipino.
- source_word: τοὺς ἐξουθενημένους
  choice: ang mga itinuturing na walang halaga
  rationale: Ipinahahayag nito ang mga taong minamaliit o itinuturing na walang katayuan, nang hindi tiyak na ipinapakahulugan kung sila ay mga tagaloob na hamak o mga taong walang katayuan sa pananaw ng iglesya.
- source_word: ἐν τῇ ἐκκλησίᾳ
  choice: sa iglesya
  rationale: Pinananatili ang tuwirang ugnayan sa kapulungan at ang kalabuan kung ang ibig sabihin ay nasa loob ng iglesya o ayon sa pagtataya nito.
- source_word: τούτους καθίζετε
  choice: itinatalaga ba ninyong mga hukom
  rationale: Ang literal na “pinauupo” ay may judicial na diwa ng pagluklok o pagtatalaga upang humatol; malinaw at natural itong naipahahayag bilang pagtatalaga ng mga hukom.
theological_decisions:
- issue: Anyo ng pangungusap at pagkakakilanlan ng “mga itinuturing na walang halaga”
  choice: 'Isinalin bilang retorikal na tanong: “itinatalaga ba ninyong mga hukom...?”'
  alternative: 'Maaaring unawain bilang mapanuyang utos: “italaga ninyo bilang mga hukom...” Maaari ring tumukoy ang parirala sa minamaliit na mga kasapi o sa mga tagalabas na walang katayuan sa iglesya.'
  rationale: Sinusuportahan ng bantas ng SBLGNT at ng konteksto ng pagsaway ang interrogative na pagbasa. Gayunman, hindi nilulutas ng salin ang sadyang malabong reperensiya ng ἐξουθενημένους ἐν τῇ ἐκκλησίᾳ.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “iglesya” para sa ἐκκλησία at iniwasan ang labis na teknikal na “tribunal.” Pinanatili ng mga talababa ang sintaktikong kalabuan at panunuya ng Griyego.
