  text: But brother goes to court against brother[b][a], and this before unbelievers?
translation:
  language: tl
  text: Sa halip, ang isang kapatid[b] ay nakikipaglitis laban sa kapatid, at ito pa’y sa harap ng mga hindi sumasampalataya[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa harap ng mga di-mananampalataya.” Malamang na tumutukoy ito sa mga hukuman sa labas ng pamayanang Kristiyano, ngunit “sa harap ng mga hindi sumasampalataya” lamang ang tahasang sinasabi ng Griyego.
    reason: lexical_alternative
  - marker: b
    text: Ang dalawang pagbanggit sa “kapatid” ay tumutukoy sa mga kapwa kabilang sa pamayanang Kristiyano.
    reason: cultural_note
lexical_decisions:
- source_word: ἀλλὰ
  choice: Sa halip
  rationale: Mariing ipinakikita ang pagsalungat sa nararapat sanang paghatol sa loob ng kapulungan na binanggit sa naunang talata.
- source_word: ἀδελφὸς μετὰ ἀδελφοῦ
  choice: ang isang kapatid ay nakikipag-usapin sa kapwa kapatid
  rationale: Pinananatili ang pampamilyang katawagang 'kapatid' at ang legal na pagsasalungatan. Sa modernong Filipino, ang 'nakikipag-usapin' ay likas na tumutukoy sa paghaharap ng magkabilang panig sa hukuman.
- source_word: κρίνεται
  choice: nakikipag-usapin
  rationale: Ginamit dito ang pandiwa sa legal o forensic na diwa, hindi lamang sa pangkalahatang kahulugang 'hinahatulan.'
- source_word: καὶ τοῦτο
  choice: at ... pa
  rationale: Ang 'pa' ay natural na naghahatid ng pagkagulat at mariing pagpuna ng parirala.
- source_word: ἐπὶ ἀπίστων
  choice: sa harap ng mga hindi sumasampalataya
  rationale: Pinananatili ang malawak na pagtukoy ng Griyego sa mga nasa labas ng pananampalataya nang hindi idinaragdag sa pangunahing teksto na sila ay mga hukom.
theological_decisions:
- issue: Saklaw ng ἀδελφός bilang katawagan sa loob ng kapulungang Cristiano
  choice: kapatid
  alternative: kapwa mananampalataya
  rationale: Ang 'kapatid' ay natural at hindi kinakailangang tukuyin ang kasarian sa Filipino, habang pinananatili ang pampamilyang wika ni Pablo para sa mga kabilang sa pamayanang Cristiano.
- issue: Saklaw ng ἀπίστων
  choice: mga hindi sumasampalataya
  alternative: mga hukom na hindi sumasampalataya
  rationale: Hindi tahasang sinasabi ng Griyego na 'mga hukom.' Pinananatili ng salin ang kaibahan ng mga mananampalataya at ng mga nasa labas ng pananampalataya nang hindi pinakikitid ang kahulugan.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang legal na idyomang 'nakikipag-usapin' at ang emphatic na 'pa' upang likas na maipahayag ang forensic na konteksto at retorikal na pagkagulat.
