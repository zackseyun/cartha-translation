  yaml_path: translation/nt/1_corinthians/006/008.yaml
  text: But you yourselves do wrong and defraud—and this to your brothers[a].
translation:
  language: tl
  text: Ngunit kayo pa mismo ang gumagawa ng mali at nandaraya—at sa mga kapatid pa ninyo[a]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa kontekstong ito, ang “mga kapatid” ay maaaring tumukoy sa mga kapwa mananampalataya, kapwa lalaki at babae.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ngunit
  rationale: Malinaw na ipinapakita ang matinding pagsalungat sa naunang sinabi nang hindi nagiging di-likas sa modernong Tagalog.
- source_word: ὑμεῖς
  choice: kayo pa mismo
  rationale: Ang hayag na panghalip sa Griyego ay may diin. Ipinapahayag ng “kayo pa mismo” ang pagkabigla at pagsaway na nakapaloob sa konteksto.
- source_word: ἀδικεῖτε
  choice: gumagawa ng mali
  rationale: Pinananatili nito ang malawak na diwa ng paggawa ng di-makatarungan o pananakit sa kapwa nang hindi nililimitahan sa isang partikular na uri ng kasalanan.
- source_word: ἀποστερεῖτε
  choice: nandaraya
  rationale: Ipinahihiwatig ng pandiwa ang pagkakait sa isang tao ng nararapat sa kaniya o ang pandaraya sa kaniya; ang “nandaraya” ay natural at angkop sa legal at pinansiyal na konteksto.
- source_word: καὶ τοῦτο
  choice: —at ... pa
  rationale: 'Ang gitling at katagang “pa” ay likas na naipapahayag sa Tagalog ang retorikal na diin: higit na mabigat ang ginawa dahil mga kapatid nila ang ginawan nila nito.'
- source_word: ἀδελφούς
  choice: mga kapatid
  rationale: Ang “mga kapatid” ay tapat sa larawan ng salitang Griyego at likas na walang tiyak na kasarian sa Tagalog; sa konteksto, maaari itong tumukoy nang malawakan sa mga kapwa mananampalataya.
theological_decisions:
- issue: Saklaw ng ἀδελφούς sa sambayanang Kristiyano
  choice: mga kapatid
  alternative: mga kapwa mananampalataya
  rationale: Mas direktang pinananatili ng “mga kapatid” ang anyo ng salitang Griyego, habang ang talababa ay nagpapaliwanag na maaari itong tumukoy sa mga kapwa mananampalataya sa pangkalahatan. Hindi nililimitahan ng salin ang tinutukoy sa mga lalaking kapatid lamang.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “kayo pa mismo” at ang ikalawang “pa” upang mapanatili ang mariing pagsaway ng Griyego; ang tandang padamdam ay naghahatid ng retorikal na bigat ng sugnay.
