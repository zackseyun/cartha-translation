  - severity: low
    issue: Maaaring pasinuhin ang ayos ng unang pangungusap.
    rationale: Mas likas sa modernong Filipino ang “isa na ngang lubos na pagkatalo para sa inyo” at mas malinaw ang “mga usaping legal” bilang katumbas ng κρίματα sa kontekstong ito.
