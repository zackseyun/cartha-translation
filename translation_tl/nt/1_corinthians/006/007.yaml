  text: ἤδη μὲν ⸀οὖν ὅλως ἥττημα ὑμῖν ἐστιν ὅτι κρίματα ἔχετε μεθ’ ἑαυτῶν· διὰ τί οὐχὶ μᾶλλον ἀδικεῖσθε; διὰ τί οὐχὶ μᾶλλον ἀποστερεῖσθε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/007.yaml
  text: Indeed[a], then, it is already altogether a defeat for you that you have lawsuits among yourselves[c][b]. Why not rather be wronged? Why not rather be defrauded?
translation:
  language: tl
  text: Sa katunayan, isa na ngang lubos na pagkatalo[a] para sa inyo ang pagkakaroon ninyo ng mga usaping legal[b] sa isa’t isa. Bakit hindi na lamang ninyo tiisin na gawan kayo ng masama? Bakit hindi na lamang ninyo tiisin na dayain[c] kayo?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kabiguan” o “kawalan.” Ang salitang Griyego ay tumutukoy sa pagkatalo o pagkalugi.
    reason: lexical_alternative
  - marker: b
    text: O “mga kaso” o “mga alitang dinadala sa hukuman.” Tumutukoy rito ang salitang Griyego sa mga usaping legal sa loob ng pamayanan.
    reason: lexical_alternative
  - marker: c
    text: O “pagkaitan” o “agawan.” Maaaring tumukoy ang salitang Griyego sa pandaraya o sa pagkakait ng pag-aari o ng nararapat sa isang tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη μὲν οὖν ὅλως
  choice: Sa katunayan, isa nang ganap na
  rationale: 'Pinagsama sa natural na Filipino ang panghihinuha at diin ng mga katagang Griyego: naroon na ang kalagayang inilalarawan, at lubos ang bigat ng pagtataya ni Pablo.'
- source_word: ἥττημα
  choice: pagkatalo
  rationale: 'Pinananatili nito ang matalim na retorikal na punto: talo na ang pamayanan sa mismong pagkakaroon ng ganitong mga usapin, anuman ang maging pasiya ng hukuman.'
- source_word: ὑμῖν ἐστιν
  choice: para sa inyo
  rationale: Tuwirang ipinapahayag ang dative of reference nang hindi idinaragdag ang konsepto ng kahihiyan na hindi tahasang nasa teksto.
- source_word: κρίματα
  choice: mga demanda
  rationale: Sa konteksto, tumutukoy ito sa mga alitang dinadala sa hukuman; malinaw at karaniwan sa modernong Filipino ang “mga demanda.”
- source_word: μεθ’ ἑαυτῶν
  choice: laban sa isa’t isa
  rationale: Ipinakikita ng konteksto na ang mga kasapi ng pamayanan ay nagsasakdal sa kapwa nila, kaya mas tiyak dito ang “laban” kaysa sa payak na “sa isa’t isa.”
- source_word: διὰ τί οὐχὶ μᾶλλον
  choice: Bakit hindi na lamang
  rationale: Pinananatili ang anyong retorikal at ang paghahambing na mas mabuting tiisin ang pinsala kaysa magdemanda sa kapwa mananampalataya.
- source_word: ἀδικεῖσθε
  choice: tiisin na gawan kayo ng masama
  rationale: Natural na Filipino itong pagpapahayag ng pasibong diwa ng pagdanas ng di-makatarungang pagtrato, nang hindi nililimitahan ang uri ng kasamaan.
- source_word: ἀποστερεῖσθε
  choice: tiisin na dayain kayo
  rationale: Ang pandiwa ay maaaring mangahulugang pagkaitan, agawan, o dayain. Ang “dayain” ay akma sa materyal at legal na konteksto ngunit nananatiling sapat na malawak.
theological_decisions:
- issue: Pagtataya ni Pablo sa pagdedemandahan sa loob ng pamayanan
  choice: “pagkatalo” bilang kasalukuyan nang kalagayan ng buong pamayanan
  alternative: “kabiguan” o “kawalan”
  rationale: Ipinahahayag ng talata na ang mismong pagkakaroon ng mga demanda ay isa nang pagkatalo; hindi na dinagdagan ng espesipikong kategoryang doktrinal o parusang hindi tahasang binanggit.
- issue: Panawagang magtiis ng kawalang-katarungan
  choice: 'Pinanatili bilang mga tanong na retorikal: “Bakit hindi na lamang ninyo tiisin…”'
  alternative: Gawing tuwirang utos na magpaapi o magpadaya
  rationale: Ang anyong tanong ng Griyego ay nagpapanatili ng lakas at tensiyon ng pahayag nang hindi ipinahihiwatig na utos itong pahintulutan ang lahat ng uri ng pang-aabuso sa bawat sitwasyon.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang pamilyar na terminong legal na “demanda,” habang iniwasan ang sobrang teknikal o makalumang pananalita. Ang magkatulad na hulma ng dalawang huling tanong ay sinadya upang mapanatili ang paralelismo at diin ng Griyego.
