  - severity: medium
    issue: Masyadong malawak ang “mga mapagsamantala” para sa ἅρπαγες.
    rationale: Maaaring tumukoy ang “mapagsamantala” sa sari-saring anyo ng pagsasamantala na walang sapilitang pag-agaw o mapanlamang na pagkakamit. Ang “mga nanlalamang,” na may mga alternatibong “mga mang-aagaw” at “mga mangingikil,” ay mas malapit sa saklaw ng salita.
