base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/010.yaml
  text: nor thieves[a], nor the greedy, nor drunkards, nor revilers[c][b], nor swindlers will inherit the kingdom of God.
translation:
  language: tl
  text: Hindi magmamana ng kaharian ng Diyos ang mga magnanakaw, mga sakim, mga lasenggo, mga mapanlait, at mga nanlalamang[a].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga mang-aagaw” o “mga mangingikil.”
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, hindi sila tatanggap ng bahagi sa kaharian ng Diyos.
    reason: clarification
lexical_decisions:
- source_word: κλέπται
  choice: mga magnanakaw
  rationale: Karaniwan at tuwirang tawag sa mga taong nagnanakaw; angkop sa anyo ng talaan ng mga bisyo.
- source_word: πλεονέκται
  choice: mga sakim
  rationale: Ipinahihiwatig ang mga taong pinaghaharian ng labis na paghahangad na magkaroon pa, lalo na ng materyal na pakinabang.
- source_word: μέθυσοι
  choice: mga lasenggo
  rationale: Tumutukoy sa mga taong kinikilala sa nakaugaliang paglalasing, hindi lamang sa sinumang minsang nalasing.
- source_word: λοίδοροι
  choice: mga mapanlait
  rationale: Saklaw nito ang mga taong mapang-insulto at mapang-abuso sa pananalita; mas malawak ito kaysa sa mga naninirang-puri lamang.
- source_word: ἅρπαγες
  choice: mga mapagsamantala
  rationale: Ipinahihiwatig ang mapang-agaw o mapanlamang na pagkuha ng pakinabang. Likas sa makabagong Filipino ang 'mapagsamantala' at hindi nito nililimitahan ang salita sa pisikal na pagnanakaw lamang.
- source_word: βασιλείαν θεοῦ
  choice: kaharian ng Diyos
  rationale: Nakaugaliang salin na nagpapanatili sa diwa ng paghahari at sakop ng Diyos.
- source_word: κληρονομήσουσιν
  choice: magmamana
  rationale: Pinananatili ang larawan ng pagtanggap bilang tagapagmana at ang panghinaharap na anyo ng pandiwa.
theological_decisions:
- issue: Lakas ng talaan ng mga bisyo at ang wika ng pagmamana
  choice: Pinanatili ang mga pangngalang tumutukoy sa mga taong kinikilala sa mga gawaing ito, nang hindi idinaragdag sa teksto ang salitang 'hindi nagsisisi.'
  alternative: Tukuyin ang mga ito bilang mga taong nakagawa lamang ng paisa-isang kilos, o tahasang idagdag na ang tinutukoy ay mga hindi nagsisisi.
  rationale: Ang maramihang pangngalan sa talaan ng mga bisyo ay likas na naglalarawan ng mga uri ng taong kinikilala sa mga asal na ito. Hindi dapat lutasin ng salin ang higit sa tahasang sinasabi ng Griyego.
- issue: Kahulugan ng pagmamana sa kaharian
  choice: Ginamit ang literal at teolohikal na mayamang pariralang 'magmamana ng kaharian ng Diyos.'
  alternative: Ipaliwanag sa pangunahing teksto bilang 'tatanggap ng bahagi sa kaharian ng Diyos.'
  rationale: Ang 'magmamana' ay malinaw sa Filipino at pinananatili ang larawan ng κληρονομήσουσιν; inilagay ang paliwanag sa talababa sa halip na ipalit sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang paulit-ulit na “ni” upang maipakita na karugtong ito ng naunang talaan at upang tularan ang diin ng οὔτε/οὐ. Ginamit ang maiikling katawagang pangmaramihan para manatili ang masinsing anyo ng vice list.
