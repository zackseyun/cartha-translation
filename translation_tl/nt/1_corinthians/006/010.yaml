  source_fidelity: Kailangang ipahayag sa Tagalog ang hayag na pagtanggi ng Griyego (οὔτε/οὐ ... κληρονομήσουσιν). Sa kasalukuyang anyo, ang “ni ... ay magmamana” ay walang pangunahing pantanggi at maaaring mabasa na tila magmamana nga ang mga nasa talaan. Ang “mga nanlalamang” ay mas tiyak na katumbas ng ἅρπαγες kaysa sa mas malawak na “mga mapagsamantala,” habang hindi ito ikinakahon sa pisikal na pagnanakaw.
  naturalness: Mas likas at malinaw sa makabagong Filipino ang unahing “Hindi magmamana ... ang” at pag-ugnayin ang mga kasapi ng talaan sa pamamagitan ng mga kuwit at “at.”
  terminology: Pinanatili ang “mga magnanakaw,” “mga sakim,” “mga lasenggo,” “mga mapanlait,” “kaharian ng Diyos,” at “magmamana.” Ginamit ang “mga nanlalamang” para sa mga taong mapang-agaw o mapangikil na kumukuha ng pakinabang sa iba.
