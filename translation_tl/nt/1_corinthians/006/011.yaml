  naturalness: Natural at angkop ang pangkalahatang rehistro, ngunit mas malinaw at mas tuwiran ang “At ilan sa inyo ay dating ganyan” kaysa “At ganyan ang ilan sa inyo noon.” Ang “itinuring kayong matuwid” ay mas natural at gramatikal na Tagalog kaysa sa kasalukuyang periprasis.
  terminology: Ang “hinugasan na kayo,” “pinabanal na kayo,” “Panginoong Jesus,” at “Espiritu ng ating Diyos” ay angkop. Ang “itinuring kayong matuwid” ay nag-iingat ng deklaratibo/hudisyal na puwersa ng ἐδικαιώθητε nang hindi dinaragdagan ang teksto o iniuugnay ang deklarasyon sa “kalagayan.”
