  to: At ilan sa inyo ay dating ganyan. Ngunit hinugasan na kayo; ngunit pinabanal na kayo; ngunit itinuring kayong matuwid sa pangalan ng Panginoong Jesus at sa Espiritu ng ating Diyos.[a]
  rationale: Inayos ang unang sugnay para sa mas likas na modernong Tagalog at pinalitan ang periprasis para sa ἐδικαιώθητε ng “itinuring kayong matuwid,” upang ang mga mambabasa—at hindi ang kanilang kalagayan—ang manatiling layon ng pandiwa. Pinanatili ang retorikal na pag-uulit ng “ngunit,” ang maingat na passive-like na salin ng ἀπελούσασθε, at ang ambiguwidad ng ἐν sa dalawang huling parirala.
