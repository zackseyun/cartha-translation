base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/011.yaml
  text: And such were some of you[a]. But you washed yourselves, but you were sanctified[c][b], but you were justified in the name of the Lord Jesus and in the Spirit of our God.
translation:
  language: tl
  text: At ilan sa inyo ay dating ganyan. Ngunit hinugasan na kayo; ngunit pinabanal na kayo; ngunit itinuring kayong matuwid sa pangalan ng Panginoong Jesus at sa Espiritu ng ating Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “hinugasan na kayo” ay maaari ring isaling “hinugasan ninyo ang inyong sarili.” Ang anyong Griyego ay maaaring unawaing reflexive, ngunit dito ay kasama ito ng “pinabanal na kayo” at “itinuring kayong matuwid.”
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ ταῦτά τινες ἦτε
  choice: At ganyan ang ilan sa inyo noon
  rationale: Natural na Tagalog na tumutukoy pabalik sa mga uri ng taong binanggit sa naunang talaan, habang ipinahihiwatig ng “noon” ang dating kalagayan.
- source_word: ἀλλὰ
  choice: ngunit
  rationale: Inulit sa bawat sugnay upang mapanatili ang mariing ritmo ng pagtutol at pagbabago sa Griyego.
- source_word: ἀπελούσασθε
  choice: hinugasan na kayo
  rationale: Ang anyo ay middle at maaaring unawaing reflexive, ngunit kasama ito sa dalawang malinaw na passive na kilos; pinananatili ng salin ang malamang na diwang tumanggap sila ng paghuhugas.
- source_word: ἡγιάσθητε
  choice: pinabanal na kayo
  rationale: Karaniwan, malinaw, at dignified na katumbas ng passive na ἁγιάζω sa wikang biblikal na Tagalog.
- source_word: ἐδικαιώθητε
  choice: itinuring na matuwid ang inyong kalagayan
  rationale: Ipinahahayag ang forensic na diwa ng δικαιόω nang hindi ipinapahiwatig na ginawa silang moral na walang kapintasan.
- source_word: ἐν τῷ ὀνόματι τοῦ κυρίου Ἰησοῦ
  choice: sa pangalan ng Panginoong Jesus
  rationale: Pinananatili ang malawak na saklaw ng ἐν—kapangyarihan, awtoridad, batayan, o larangan—sa natural na pariralang Tagalog.
- source_word: ἐν τῷ πνεύματι τοῦ θεοῦ ἡμῶν
  choice: sa Espiritu ng ating Diyos
  rationale: Ang “sa” ay nagpapanatili sa ambiguwidad ng ἐν sa halip na limitahan ito sa instrumental na “sa pamamagitan ng”; ang malaking titik ay tumutukoy sa Espiritu ng Diyos.
theological_decisions:
- issue: Tinig at ahensiya ng ἀπελούσασθε
  choice: hinugasan na kayo
  alternative: naghugas na kayo / hinugasan ninyo ang inyong sarili
  rationale: Maaaring reflexive ang middle form, ngunit ang pagkakasunod nito sa mga passive na “pinabanal” at “itinuring na matuwid” ay pumapabor sa passive-like na pagkaunawa. Inilalagay sa talababa ang tunay na alternatibo.
- issue: Kahulugan ng ἐδικαιώθητε
  choice: itinuring na matuwid ang inyong kalagayan
  alternative: pinawalang-sala kayo / inaring-ganap kayo
  rationale: Pinananatili ang hudisyal o deklaratibong puwersa ng pandiwa nang hindi gumagamit ng salitang maaaring hindi agad maunawaan ng karaniwang mambabasa.
- issue: Gamit ng ἐν sa huling dalawang parirala
  choice: sa pangalan ... at sa Espiritu
  alternative: sa pamamagitan ng pangalan ... at sa pamamagitan ng Espiritu
  rationale: Ang magkatulad na “sa” ay sumusunod sa parehong Griyegong pang-ukol at hindi tahimik na nagpapasiya kung ito ay instrumental, locative, o spheric.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Pinanatili ang tatlong ulit na “ngunit” upang marinig ang mariing retorika ni Pablo. Iniwasan ang mas teknikal na “inaring-ganap,” ngunit pinanatili ang deklaratibong diwa ng δικαιόω.
