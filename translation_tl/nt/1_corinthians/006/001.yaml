  text: Τολμᾷ τις ὑμῶν πρᾶγμα ἔχων πρὸς τὸν ἕτερον κρίνεσθαι ἐπὶ τῶν ἀδίκων, καὶ οὐχὶ ἐπὶ τῶν ἁγίων;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/001.yaml
  text: Does any one of you dare[a], when he has a case against another[b], to be judged before the unrighteous and not before the saints?
translation:
  language: tl
  text: May sinuman ba sa inyo na nangangahas, kapag may usapin laban sa iba, na magpahatol sa harap ng mga di-matuwid[a] at hindi sa harap ng mga banal[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga di-makatarungan.” Isinasalin ito ng ilan bilang “mga hindi mananampalataya,” ngunit ang salitang Griyego ay tumutukoy sa “mga di-matuwid.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mga banal” dito ay tumutukoy sa banal na bayan ng Diyos, samakatuwid, sa mga mananampalataya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τολμᾷ τις ὑμῶν
  choice: May sinuman ba sa inyo na nangangahas
  rationale: Pinananatili ang anyong retorikal na tanong at ang diwa ng τολμάω na mapangahas na pagkilos sa kontekstong ito.
- source_word: πρᾶγμα ἔχων
  choice: kapag may usapin siya
  rationale: Ang πρᾶγμα ay maaaring tumukoy sa isang bagay, usapin, o kasong legal; ang “usapin” ay natural at hindi labis na nagpapakitid sa kahulugan.
- source_word: πρὸς τὸν ἕτερον
  choice: laban sa isa pa
  rationale: Ipinahahayag ang salungatang legal o alitan habang pinananatiling pangkalahatan ang tinutukoy na kabilang panig.
- source_word: κρίνεσθαι
  choice: na magpasiya nito
  rationale: Sa gitnang/balintiyak na infinitive at kontekstong hudisyal, ipinahahayag nito ang pagpapadinig o pagpapasiya ng usapin; ang parirala ay mas likas sa modernong Filipino kaysa literal na “hatulan.”
- source_word: ἐπὶ τῶν ἀδίκων
  choice: sa harap ng mga di-matuwid
  rationale: Pinananatili ang moral at teolohikal na katawagan ng ἄδικος sa halip na palitan ito ng interpretatibong “mga hindi mananampalataya.”
- source_word: ἐπὶ τῶν ἁγίων
  choice: sa harap ng mga banal
  rationale: Ang “mga banal” ay tuwirang katumbas ng karaniwang katawagang Paulino para sa mga taong ibinukod ng Diyos.
theological_decisions:
- issue: Pagtutumbas sa ἀδίκων at ἁγίων
  choice: mga di-matuwid ... mga banal
  alternative: mga hindi mananampalataya ... mga mananampalataya
  rationale: Hindi tahasang sinasabi ng Griyego ang “hindi mananampalataya” at “mananampalataya.” Pinananatili ng salin ang matinding moral-teolohikal na paghahambing at ang tunay na puwang para sa interpretasyon.
- issue: Kinatawang isahan sa τις ... ἔχων
  choice: sinuman ... may usapin siya
  alternative: sinuman ... may usapin sila
  rationale: Pinananatili ang isahang balangkas ng Griyego, ngunit ginagamit ang karaniwang Filipino na “sinuman” upang maging likas at sumaklaw sa sinumang kabilang sa kapulungan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “usapin” at “magpasiya” upang maging likas ang legal na konteksto nang hindi labis na nililinaw ang uri ng kaso. Ang “mga banal” at “mga di-matuwid” ay sadyang nagpapanatili sa teolohikal na tensiyon ng orihinal.
