  naturalness: Hindi likas at hindi ganap ang “At hindi kayo sa inyong sarili.” Ang “At hindi kayo nabibilang sa inyong mga sarili” ay malinaw, likas sa makabagong Filipino, at tapat sa idyomatikong puwersa ng οὐκ ἐστὲ ἑαυτῶν.
  terminology: Ang “templo,” “Banal na Espiritu,” at isahang “inyong katawan” ay angkop. Pinananatili ang isahang katawan na may maramihang kausap, nang hindi nilulutas ang distributibo o representatibong pagbasa.
