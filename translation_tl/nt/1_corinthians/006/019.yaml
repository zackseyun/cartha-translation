base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/019.yaml
  text: Or do you not know that your body is a temple of the Holy Spirit within you[a], whom you have from God? And you are not your own[b],
translation:
  language: tl
  text: O hindi ba ninyo alam na ang inyong katawan ay templo ng Banal na Espiritung nasa inyo[a], na taglay ninyo mula sa Diyos? At hindi kayo nabibilang sa inyong mga sarili[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ng Banal na Espiritu na nasa inyo.”
    reason: lexical_alternative
  - marker: b
    text: Maaaring ang diwa ay “hindi ninyo pag-aari ang inyong mga sarili.” Isahan sa Griyego ang “katawan,” ngunit maramihan ang “inyong”; maaari itong tumukoy sa katawan ng bawat isa o kumatawan sa lahat bilang isang pangkat.
    reason: alternative_reading
lexical_decisions:
- source_word: ἢ
  choice: O
  rationale: Ipinananatili ang matalim na retorikal na pagpapatuloy mula sa naunang pangangatwiran.
- source_word: οὐκ οἴδατε
  choice: hindi ba ninyo alam
  rationale: Likas na makabagong Tagalog para sa karaniwang retorikal na pormula ni Pablo at malapit sa kahulugan ng οἶδα.
- source_word: τὸ σῶμα ὑμῶν
  choice: ang inyong katawan
  rationale: Pinananatili ang isahang “katawan” kasama ng maramihang “inyong,” upang hindi lutasin ang maaaring distributibo o representatibong diwa.
- source_word: ναὸς
  choice: templo
  rationale: Malinaw na tumutukoy sa banal na santuwaryo at pinananatili ang lakas ng metapora.
- source_word: τοῦ ἐν ὑμῖν ἁγίου πνεύματός
  choice: ng Banal na Espiritung nasa inyo
  rationale: Natural sa Tagalog at ipinakikitang ang templo ay sa Banal na Espiritu na nasa kanila, nang hindi dinaragdagan ang kahulugan.
- source_word: οὗ ἔχετε ἀπὸ θεοῦ
  choice: na nasa inyo mula sa Diyos
  rationale: Sa Tagalog, ang “Espiritung nasa inyo mula sa Diyos” ay natural na nagpapahayag na taglay nila ang Espiritu mula sa Diyos; iniiwasan nito ang alanganing literal na “na mayroon kayo mula sa Diyos.”
- source_word: καὶ οὐκ ἐστὲ ἑαυτῶν
  choice: At hindi kayo sa inyong sarili
  rationale: Pinananatili ang maikli at tahasang idyoma ng pag-aari; nililinaw ng talababa ang mas natural na kahulugan.
theological_decisions:
- issue: Ang tinutukoy ng οὗ at ang personal na pagtukoy sa Banal na Espiritu
  choice: Iugnay ang sugnay sa Banal na Espiritu sa pamamagitan ng “na,” ayon sa likas na balarila ng Tagalog.
  alternative: “na siyang nasa inyo mula sa Diyos” o “na tinanggap ninyo mula sa Diyos”
  rationale: Ang οὗ ay tumutukoy sa ἁγίου πνεύματός. Walang kasariang pambalarila ang panghalip sa Tagalog, kaya hindi kailangang magpasok ng panlalaking panghalip upang kilalaning personal ang tinutukoy.
- issue: Isahang “katawan” na may maramihang “inyong”
  choice: Panatilihin ang “ang inyong katawan.”
  alternative: “ang mga katawan ninyo” o “ang katawan ng bawat isa sa inyo”
  rationale: Pinananatili nito ang anyo at tunay na kalabuan ng Griyego kung distributibo ba ang pahayag sa bawat mananampalataya o representatibo.
- issue: Kahulugan ng οὐκ ἐστὲ ἑαυτῶν
  choice: Panatilihin sa teksto ang mas pormal na “hindi kayo sa inyong sarili,” na may paliwanag sa talababa.
  alternative: “hindi ninyo pag-aari ang inyong sarili” o “hindi kayo nabibilang sa inyong sarili”
  rationale: Iniiwasang gawing tahasang bagay na pag-aari ang tao sa pangunahing teksto habang pinananatili ang idyomatikong diwa ng Griyegong genitibo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang retorikal na “O hindi ba ninyo alam,” ang isahang “katawan” na may maramihang “inyong,” at ang bahagyang pormal na hulíng sugnay upang mapangalagaan ang anyo at tensiyon ng pinagmulan. Lahat ng talababa ay may katugmang marker sa pangunahing teksto.
