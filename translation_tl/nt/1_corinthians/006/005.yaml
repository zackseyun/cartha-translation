  yaml_path: translation/nt/1_corinthians/006/005.yaml
  text: I say this to your shame[a]. Is it really so[b], that there is not among you even one wise man who will be able to judge between his brothers?
translation:
  language: tl
  text: Sinasabi ko ito upang mapahiya kayo. Talaga bang wala ni isang marunong sa inyo na makapagpapasya sa alitan ng kapwa niya mananampalataya?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal, “sa pagitan ng kapatid niya.” Ang “kapatid” ay tumutukoy rito sa kapwa mananampalataya, lalaki man o babae. Elliptical ang pariralang Griyego: isang panig lamang ang tahasang binanggit, ngunit ipinahihiwatig ng konteksto ang alitan ng dalawang panig.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ἐντροπὴν ὑμῖν λέγω
  choice: Sinasabi ko ito upang mapahiya kayo
  rationale: Ipinahahayag nito ang layunin o bungang nakatuon sa kahihiyan ng mga kausap at pinananatili ang matinding pagsaway ni Pablo.
- source_word: οὕτως οὐκ ἔνι ἐν ὑμῖν
  choice: Talaga bang wala ... sa inyo
  rationale: Ginagawang likas sa Tagalog ang mapanuyang retorikal na tanong habang pinananatili ang diin ng οὕτως at ang pagtukoy sa kongregasyon.
- source_word: οὐδεὶς σοφὸς
  choice: ni isang marunong
  rationale: Ang 'ni isang' ay nagdadala ng mariing negatibo; ang substantibong 'marunong' ay natural at hindi ipinipilit ang kasariang gramatikal na hindi kailangang markahan sa Tagalog.
- source_word: ὃς δυνήσεται διακρῖναι
  choice: na makapagpapasya
  rationale: Ang 'makapagpapasya' ay nagpapahayag ng kakayahang gumawa ng hatol sa konteksto ng alitan; natural nitong naihahatid sa Tagalog ang prospective force ng future δυνήσεται.
- source_word: ἀνὰ μέσον τοῦ ἀδελφοῦ αὐτοῦ
  choice: sa alitan ng kapwa niya mananampalataya
  rationale: Elliptical ang Griyego pagkatapos ng 'sa pagitan'; nililinaw ng salin ang kontekstong legal na alitan nang hindi nagdaragdag ng tiyak na ikalawang partido. Ang ἀδελφός ay tumutukoy rito sa kasapi ng sambayanan ng pananampalataya.
theological_decisions:
- issue: Ang saklaw ng ἀδελφός sa isang kongregasyong binubuo ng mga lalaki at babae
  choice: kapwa niya mananampalataya
  alternative: kapatid niya
  rationale: Sa konteksto, ang ἀδελφός ay pananalitang pampamilya para sa kapwa kabilang sa kongregasyon. Iniiwasan ng pangunahing salin ang maling impresyong kadugo o lalaki lamang ang tinutukoy, habang itinatala sa talababa ang literal na larawan.
- issue: Ang elliptical na pariralang ἀνὰ μέσον τοῦ ἀδελφοῦ αὐτοῦ
  choice: sa alitan ng kapwa niya mananampalataya
  alternative: sa pagitan ng kapatid niya at ng isa pa
  rationale: Isang partido lamang ang hayagang binanggit sa umiiral na tekstong Griyego, bagaman likas na nangangailangan ng dalawang panig ang 'sa pagitan.' Pinananatili ng napiling salin ang di-tiyak na anyo at hindi tahasang nagdaragdag ng 'isa pa.'
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Pinanatili ang matalim na retorikal na pagsaway ni Pablo; ginamit ang 'makapagpapasya' sa halip na mas teknikal na 'mamagitan bilang tagahatol.'
