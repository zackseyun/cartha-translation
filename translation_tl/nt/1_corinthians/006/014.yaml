  text: ὁ δὲ θεὸς καὶ τὸν κύριον ἤγειρεν καὶ ἡμᾶς ἐξεγερεῖ διὰ τῆς δυνάμεως αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/014.yaml
  text: And God raised the Lord and will also raise us by his power.
translation:
  language: tl
  text: At muling binuhay ng Diyos ang Panginoon, at muli rin niya tayong bubuhayin sa pamamagitan ng kanyang kapangyarihan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: At
  rationale: Mahinang pang-ugnay ito na nagpapatuloy sa pangangatwiran ni Pablo; ang “At” ay natural at hindi nagpapahiwatig ng masidhing pagsalungat.
- source_word: θεὸς
  choice: ng Diyos
  rationale: Karaniwang salin ng θεός at malinaw na paksa ng parehong pagkilos ng muling pagbuhay.
- source_word: τὸν κύριον
  choice: ang Panginoon
  rationale: Ang κύριος ay titulong tumutukoy rito kay Jesus; pinananatili ng “Panginoon” ang kinikilalang kristolohikal na gamit nito.
- source_word: ἤγειρεν
  choice: muling binuhay
  rationale: Tumutukoy ang aorist na ἤγειρεν sa nakaraang pagkilos ng Diyos na buhayin si Jesus mula sa mga patay. Natural at malinaw sa modernong Tagalog ang “muling binuhay.”
- source_word: ἡμᾶς
  choice: tayo
  rationale: Inklusibong unang panauhang maramihan; dahil sa ayos ng pangungusap, ang “tayong” ang likas na anyong ginagamit sa teksto.
- source_word: ἐξεγερεῖ
  choice: muli rin niyang bubuhayin
  rationale: Pinananatili ang hinaharap na panahon at ang paralelismo sa muling pagbuhay sa Panginoon. Ipinapahayag ng “rin” ang kaugnay na καί.
- source_word: διὰ τῆς δυνάμεως αὐτοῦ
  choice: sa pamamagitan ng kanyang kapangyarihan
  rationale: Ang διά na may genitive ay nagpapahayag ng paraan o kasangkapan; ang pariralang ito ay malinaw at natural sa pormal ngunit madaling maunawaang Tagalog.
theological_decisions:
- issue: Tinutukoy ng panghinaharap na sugnay ang muling pagkabuhay
  choice: Aktuwal na muling pagbuhay sa mga mananampalataya sa hinaharap
  alternative: Pangkalahatang pagbibigay-katarungan ng Diyos o metaporikal na espirituwal na pagbangon
  rationale: Ang agarang konteksto ay tungkol sa katawan (1 Corinto 6:13–20), at ang tuwirang paralelismo sa muling pagbuhay ng Diyos sa Panginoon ay sumusuporta sa aktuwal na muling pagkabuhay. Hindi na dinagdagan ang salin ng “mula sa mga patay,” kaya hindi nito pinalalawak ang tahasang sinabi ng Griyego.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “muling binuhay/bubuhayin” sa halip na literal ngunit hindi likas na “ibinangon/babangunin” upang malinaw na maipahayag ang konteksto ng pagkabuhay na muli, habang pinananatili ang paralelismo ng dalawang pandiwa.
