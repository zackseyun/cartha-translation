base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/012.yaml
  text: “All things are lawful for me,” but not all things are beneficial[c][b][a]. “All things are lawful for me,” but I will not be mastered by anything.
translation:
  language: tl
  text: “Lahat ng bagay ay ipinahihintulot sa akin,”[a] ngunit hindi lahat ay kapaki-pakinabang.[b] “Lahat ng bagay ay ipinahihintulot sa akin,” ngunit hindi ako paghaharian ng anuman.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring walang panipi: Lahat ng bagay ay ipinahihintulot sa akin. Marami ang umuunawa rito bilang isang kasabihan ng mga taga-Corinto na sinisipi at saka nililimitahan ni Pablo.'
    reason: alternative_reading
  - marker: b
    text: Maaari ring “nakabubuti” o “may pakinabang.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “hindi ako mapapasailalim sa kapangyarihan ng anuman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντα μοι ἔξεστιν
  choice: Lahat ng bagay ay ipinahihintulot sa akin
  rationale: Pinananatili ang malawak at paulit-ulit na anyo ng parirala. Ang “ipinahihintulot” ay natural na katumbas ng ἔξεστιν at hindi labis na naglilimita sa kahulugan nito sa batas lamang.
- source_word: ἀλλ’ οὐ πάντα συμφέρει
  choice: ngunit hindi lahat ay kapaki-pakinabang
  rationale: Ang συμφέρει ay tumutukoy sa pagiging nakabubuti, kapaki-pakinabang, o may pakinabang. Ang “kapaki-pakinabang” ay malinaw at dignidad ang tono, nang walang labis na komersiyal na dating.
- source_word: οὐκ ἐγὼ ἐξουσιασθήσομαι
  choice: ngunit hindi ako magpapasakop sa kapangyarihan
  rationale: Ipinahahayag ang mariing ἐγώ at ang diwa ng hinaharap na pasibong ἐξουσιασθήσομαι—ang mapasailalim sa pamamahala o kontrol—sa natural na Filipino.
- source_word: ὑπό τινος
  choice: ng anuman
  rationale: Ang τινος ay maaaring tumukoy sa sinuman o anuman; sa konteksto ng mga gawain at pagnanasa, likas ang “anuman,” habang pinananatili ang malawak na saklaw.
theological_decisions:
- issue: Kung ang Πάντα μοι ἔξεστιν ay isang kasabihan ng mga taga-Corinto na sinisipi ni Pablo
  choice: Nilagyan ng panipi ang dalawang paglitaw bilang malamang na kasabihang sinisipi at nililimitahan ni Pablo.
  alternative: Basahin nang walang panipi bilang sariling pahayag ni Pablo na agad niyang binibigyan ng pasubali.
  rationale: Walang panipi sa mga sinaunang manuskrito, kaya interpretatibo ang paglalagay nito. Gayunman, malamang ang retorikal na pagbasa bilang kasabihan; pinananatili sa talababa ang tunay na kalabuan.
- issue: Diwa ng ἐξουσιασθήσομαι
  choice: hindi ako magpapasakop sa kapangyarihan ng anuman
  alternative: hindi ako paghaharian ng anuman
  rationale: Pinananatili ng napiling anyo ang larangan ng kapangyarihan at awtoridad ng salitang Griyego, nang hindi nagpapahiwatig ng isang partikular na doktrina tungkol sa kalayaan o pagkaalipin.
translation_notes:
  register: Modernong Filipino na malinaw, dignidad ang tono, at madaling maunawaan. Pinanatili ang paulit-ulit at parang-kasabihang estruktura ng Griyego. Ang “magpapasakop” ay idiomatikong aktibong anyo sa Filipino para sa kahulugang pasibong mapasailalim sa kapangyarihan, habang ang talababa ay nagbibigay ng mas pormal na alternatibo.
