  source_fidelity: 'Ang unang dalawang sugnay ay tumpak na naghahatid ng malawak na Πάντα, ng pag-uulit ng kasabihan, at ng συμφέρει bilang pagiging kapaki-pakinabang. Gayunman, ang “hindi ako magpapasakop” ay aktibo at boluntaryo ang ipinahihiwatig (“I will not submit myself”), samantalang ang ἐξουσιασθήσομαι ay pasibo: hindi siya magpapailalim sa pagkakakontrol o paghahari ng anuman. Ang “hindi ako paghaharian ng anuman” ay mas tapat sa tinig at diwa ng Griyego.'
  naturalness: Natural at malinaw ang “Lahat ng bagay ay ipinahihintulot sa akin” at “hindi lahat ay kapaki-pakinabang.” Ang “hindi ako paghaharian ng anuman” ay maikli, natural sa modernong Filipino, at angkop sa dignidad ng rehistro.
