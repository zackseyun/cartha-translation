base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/020.yaml
  text: For you were bought with a price[b][a]; therefore glorify God in your body.
translation:
  language: tl
  text: Sapagkat binili kayo sa isang halaga; kaya[a] luwalhatiin ninyo ang Diyos sa inyong katawan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kaya” ay maaari ring isaling “kung gayon” o hindi na tahasang isalin; ang salitang Griyego ay nagdaragdag ng diin at pagkaapurahan sa utos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγοράσθητε
  choice: binili kayo
  rationale: Pinananatili ang tahasang talinghaga ng pagbili sa aorist passive, sa likas at malinaw na modernong Tagalog.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinapakita na ang pahayag ay dahilan ng naunang panghihikayat.
- source_word: τιμῆς
  choice: sa isang halaga
  rationale: Ipinahihiwatig ng genitive of price ang halagang ibinayad at pinananatili ang larawang pangkalakalan nang hindi tinutukoy kung ano ang kabayaran.
- source_word: δοξάσατε
  choice: luwalhatiin ninyo
  rationale: Tuwirang inililipat ang mariing utos na magbigay-luwalhati sa Diyos.
- source_word: δὴ
  choice: kaya
  rationale: Ipinapahayag ang inferensiya at diin ng partikula sa utos; maaari rin itong unawain bilang dagdag na pagdidiin.
- source_word: ἐν τῷ σώματι ὑμῶν
  choice: sa inyong katawan
  rationale: Pinananatili ang konkretong katawan at ang lawak ng ἐν, habang likas sa Tagalog ang kolektibong panghalip na maramihan kasama ng pangngalang nasa isahan.
theological_decisions:
- issue: Talinghaga ng pagbili at pagtubos
  choice: Panatilihin ang “binili kayo sa isang halaga”
  alternative: tinubos kayo nang may kabayaran
  rationale: Marketplace language ang tahasang ginamit ng Griyego. Hindi ito pinalitan ng mas tiyak na terminong teolohikal na maaaring magpakitid sa talinghaga.
- issue: Etikang may kinalaman sa katawan
  choice: Isalin ang σῶμα bilang “katawan”
  alternative: sarili o buhay
  rationale: Ang agarang konteksto ay tumatalakay sa seksuwal na asal ng katawan, kaya hindi dapat palawakin ang salita sa isang paraphrase.
- issue: Lakas ng δὴ
  choice: Isama bilang “kaya”
  alternative: “kung gayon” o hindi isalin
  rationale: Pinananatili nito ang inferensiya at pagkaapurahan ng utos, bagaman hindi ganap na matutumbasan ng iisang salitang Tagalog ang lahat ng himig ng partikula.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pagbasa sa publiko. Pinili ang “luwalhatiin” upang mapanatili ang bigat ng δοξάζω, at ang “katawan” upang manatiling konkreto ang argumento ni Pablo.
