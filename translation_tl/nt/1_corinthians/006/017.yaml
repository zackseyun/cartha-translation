  text: But the one who joins himself to the Lord is one spirit with him[a][b][c].
translation:
  language: tl
  text: Ngunit ang nakikipag-isa sa Panginoon ay kaisa niya sa espiritu.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang nakaugnay sa Panginoon.” Maaaring ipahiwatig ng pandiwang Griyego ang kusang pakikiisa o ang kalagayan ng pagiging kaugnay.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ay isang espiritu.” Ipinahihiwatig ng Griyego ang “niya.” Maaari ring isulat na “Espiritu,” ngunit pinakamalamang na tumutukoy ang parirala sa pakikiisa ng mananampalataya sa Panginoon sa espiritu.
    reason: alternative_reading
lexical_decisions:
- source_word: κολλώμενος
  choice: nakikipag-isa
  rationale: Ipinahihiwatig ng pandiwa ang malapit na pagkapit o pakikiisa. Sa konteksto, inihahambing ni Pablo ang pakikiisang seksuwal sa talata 16 at ang pakikiisa sa Panginoon; ang “nakikipag-isa” ay natural sa modernong Tagalog at hindi nagpapasya nang lubusan kung kusang pagkilos o kalagayang dulot ng pagkakaugnay ang diin.
- source_word: τῷ κυρίῳ
  choice: sa Panginoon
  rationale: Ang κύριος ay tumutukoy rito sa Panginoong Jesus at may higit na bigat kaysa sa simpleng “panginoon” o “amo.”
- source_word: ἓν πνεῦμα
  choice: kaisa niya sa espiritu
  rationale: Pinananatili nito ang matibay na diwa ng pagkakaisa habang likas na ipinahahayag sa Tagalog ang ugnayan sa Panginoon. Ang “niya” ay ipinahiwatig ng Griyego at nilinaw mula sa konteksto.
- source_word: ὁ δὲ ... ἐστιν
  choice: Ngunit ang ... ay
  rationale: Ang artikulo at participle ay tumutukoy sa sinumang taong inilalarawan; natural at pangkalahatan ang anyong “ang ... ay” sa Tagalog nang hindi kailangang magtakda ng kasarian.
theological_decisions:
- issue: Kalikasan ng pagiging “isang espiritu”
  choice: Isinalin bilang tunay na espirituwal na pakikiisa sa Panginoon nang hindi ipinahihiwatig na nawawala ang pagkakaiba ng mananampalataya at ng Panginoon.
  alternative: Maaaring unawain bilang masidhing mistikong pagkakakilanlan, o bilang pagkakatulad lamang ng saloobin at layunin.
  rationale: Sa konteksto, itinatapat ni Pablo ang pagiging isang katawan sa talata 16 sa pagiging isang espiritu rito. Kailangang mapanatili ang lakas ng pagkakaisa nang hindi ito ginagawang lubos na pagsasanib ng pagkatao.
- issue: Pagdaragdag ng “niya”
  choice: Isinama ang “niya” upang maging malinaw at natural sa Tagalog kung kanino kaisa sa espiritu ang tao.
  alternative: “Ay isang espiritu” nang walang “niya.”
  rationale: Walang tahasang katumbas ng “niya” sa Griyego, ngunit malinaw na ipinahihiwatig ng kayarian at konteksto ang ugnayan sa Panginoon.
- issue: Maliit o malaking titik sa “espiritu”
  choice: Maliit na titik ang ginamit sapagkat pinakamalamang na inilalarawan ng parirala ang espirituwal na pakikiisa ng mananampalataya sa Panginoon.
  alternative: “Espiritu,” kung ituturing na tuwirang pagtukoy sa Banal na Espiritu.
  rationale: Hindi nakikilala sa sinaunang Griyegong teksto ang ganitong pagkakaiba sa capitalization, kaya interpretatibo ang pagpili; pinananatili sa talababa ang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nakikipag-isa” upang panatilihin ang malapit na ugnayan sa naunang talata, at “kaisa niya sa espiritu” upang maging likas sa Tagalog habang inilalantad sa talababa ang mas literal na anyo at interpretatibong usapin.
