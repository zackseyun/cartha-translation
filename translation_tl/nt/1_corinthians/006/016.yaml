source:
  edition: SBLGNT
  text: ⸀ἢ οὐκ οἴδατε ὅτι ὁ κολλώμενος τῇ πόρνῃ ἓν σῶμά ἐστιν; Ἔσονται γάρ, φησίν, οἱ δύο εἰς σάρκα μίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/016.yaml
  text: Or do you not know that the one who joins himself to a prostitute is one body with her? For[a], as he says[b], “The two will become one flesh.”
translation:
  language: tl
  text: O hindi ba ninyo alam na ang nakikipag-isa sa isang babaeng bayaran[a] ay iisang katawan kasama niya? Sapagkat, gaya ng sinasabi niya,[b] “Ang dalawa ay magiging isang laman.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ang nakakabit sa isang babaeng bayaran.” Sa konteksto, ang pakikipag-isang ito ay seksuwal.
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “sinasabi niya.” Ang sipi ay mula sa Genesis 2:24.
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: O
  rationale: Ipinagpapatuloy nito ang pangangatwiran ni Pablo sa pamamagitan ng isang retorikal na tanong.
- source_word: οὐκ οἴδατε
  choice: hindi ba ninyo alam
  rationale: Likas at tuwirang katumbas ito ng karaniwang retorikal na pormula ni Pablo.
- source_word: ὁ κολλώμενος
  choice: ang nakikipag-isa
  rationale: Ipinahihiwatig ng κολλάομαι ang pagdikit o pakikiugnay nang mahigpit. Sa konteksto, tumutukoy ito sa seksuwal na pakikipag-isa, ngunit hindi nilalagyan ng salin ng higit na paliwanag kaysa sa mismong pahayag.
- source_word: τῇ πόρνῃ
  choice: sa isang babaeng bayaran
  rationale: Partikular na tumutukoy ang πόρνη sa isang prostituta. Ang 'babaeng bayaran' ay malinaw, dignified, at karaniwang nauunawaan sa modernong Filipino.
- source_word: ἓν σῶμά ἐστιν
  choice: ay kaisang-katawan niya
  rationale: Pinananatili nito ang tahasang pahayag na sila ay 'isang katawan' at nililinaw ang ugnayang ipinahihiwatig ng Griyego nang hindi idinaragdag ang ideya ng pag-aasawa.
- source_word: Ἔσονται γάρ
  choice: Sapagkat … magiging
  rationale: Ipinakikita ng 'Sapagkat' na ang sipi ang batayan ng naunang pahayag; ang μέλλουσα anyo kasama ng εἰς ay natural na isinasaling 'magiging.'
- source_word: φησίν
  choice: gaya ng sinasabi niya
  rationale: Pinananatili ang pang-isahang 'niya' ng Griyego at hindi tahasang tinutukoy kung Diyos o Kasulatan ang nagsasalita.
- source_word: οἱ δύο
  choice: Ang dalawa
  rationale: Tuwirang pinananatili ang maikli at mariing pananalita ng sipi.
- source_word: εἰς σάρκα μίαν
  choice: isang laman
  rationale: Pinananatili ang tradisyonal at literal na larawan ng Genesis at ang pagkakaiba ng σάρξ ('laman') sa σῶμα ('katawan') sa unang bahagi ng talata.
theological_decisions:
- issue: Ang bisa ng sipi sa Genesis para sa seksuwal na pakikipag-isa sa labas ng pag-aasawa
  choice: Tuwirang iniuugnay ng salin ang pakikipag-isa sa babaeng bayaran sa pagiging kaisang-katawan, at saka binabanggit ang 'isang laman' ng Genesis bilang batayan.
  alternative: Limitahan ang sipi sa pag-aasawa lamang, o dagdagan ang talata ng tahasang doktrina tungkol sa pag-aasawa.
  rationale: Ginagamit mismo ni Pablo ang Genesis 2:24 kaugnay ng pakikipagtalik sa isang babaeng bayaran. Dapat mapanatili ang bigat at tensiyong teolohikal nito nang hindi nagdaragdag ng konklusyong wala sa tekstong Griyego.
- issue: Ang hindi tahasang tinukoy na tagapagsalita sa φησίν
  choice: gaya ng sinasabi niya
  alternative: gaya ng sinasabi ng Kasulatan / gaya ng sinabi ng Diyos
  rationale: Ang Griyego ay literal na 'sinasabi niya' at hindi pinapangalanan ang paksa. Pinananatili ng salin ang kalabuan sa halip na tahasang tukuyin ito.
translation_notes:
  register: Modernong Filipino na natural at marangal ang ginamit. Pinili ang 'nakikipag-isa' upang malinaw ang ugnayan ngunit mapanatili ang larawan ng orihinal; pinanatili rin ang mahalagang pagkakaiba ng 'katawan' at 'laman.'
