id: 1CO.6.18
reference: 1 Corinthians 6:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: φεύγετε τὴν πορνείαν· πᾶν ἁμάρτημα ὃ ἐὰν ποιήσῃ ἄνθρωπος ἐκτὸς τοῦ σώματός ἐστιν, ὁ δὲ πορνεύων εἰς τὸ ἴδιον σῶμα ἁμαρτάνει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/018.yaml
  text: Flee sexual immorality. Every sin that a person may commit is outside the body[a], but the one who commits sexual immorality sins against his own body.
translation:
  language: tl
  text: Layuan ninyo ang seksuwal na imoralidad. Ang bawat kasalanang maaaring gawin ng isang tao ay nasa labas ng katawan[a], ngunit ang gumagawa ng seksuwal na imoralidad ay nagkakasala laban sa sarili niyang katawan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hiwalay sa katawan.” Pinananatili rito ang matinding paghahambing ni Pablo; pinagtatalunan ang eksaktong saklaw ng pahayag.
    reason: lexical_alternative_and_exegetical_ambiguity
lexical_decisions:
- source_word: φεύγετε
  choice: Layuan ninyo
  rationale: Ang pangkasalukuyang pautos na maramihan ay nananawagan ng patuloy at agarang pag-iwas. Natural sa Filipino ang “layuan ninyo” at hindi nito pinalalabis ang larawan ng literal na pagtakbo.
- source_word: τὴν πορνείαν
  choice: ang seksuwal na imoralidad
  rationale: Malawak ang saklaw ng πορνεία at tumutukoy sa ipinagbabawal o imoral na seksuwal na gawain, hindi lamang sa isang partikular na uri nito.
- source_word: πᾶν ἁμάρτημα
  choice: Ang bawat kasalanan
  rationale: Pinananatili nito ang pangkalahatan at komprehensibong anyo ng parirala.
- source_word: ὃ ἐὰν ποιήσῃ ἄνθρωπος
  choice: na maaaring gawin ng isang tao
  rationale: Ipinahihiwatig ng ἐὰν kasama ng subjunctive ang posibilidad, samantalang ang ἄνθρωπος ay ginagamit dito sa pangkalahatan para sa sinumang tao. Natural at tumpak sa modernong Filipino ang “isang tao.”
- source_word: ἐκτὸς τοῦ σώματός ἐστιν
  choice: ay nasa labas ng katawan
  rationale: Tuwirang pinananatili ang spatial o metaporikal na pananalita at ang kaibahan nito sa sumusunod na sugnay.
- source_word: ὁ δὲ πορνεύων
  choice: ngunit ang gumagawa ng seksuwal na imoralidad
  rationale: Pinananatili ng pariralang ito ang pandiwang puwersa ng pangkasalukuyang participle at malinaw itong inuugnay sa πορνεία sa unang pangungusap.
- source_word: εἰς τὸ ἴδιον σῶμα ἁμαρτάνει
  choice: ay nagkakasala laban sa sarili niyang katawan
  rationale: Bagaman literal na maaaring tumukoy ang εἰς sa “tungo sa” o “sa loob ng,” natural na ipinapahayag ng “laban sa” ang kasalanang nakatuon sa sariling katawan. Binibigyang-diin ng “sarili niyang” ang ἴδιον.
theological_decisions:
- issue: Pangkalahatang gamit ng ἄνθρωπος
  choice: isang tao
  alternative: isang lalaki
  rationale: Bagaman panlalaki ang anyong gramatikal, pangkalahatan at representatibo ang gamit ng ἄνθρωπος dito. Hindi likas sa Filipino na gamitin ang “lalaki” kung ang tinutukoy ay sinumang tao, at maaaring magkamaling ipahiwatig niyon na kalalakihan lamang ang saklaw.
- issue: Ang pahayag na ang bawat kasalanan ay “nasa labas ng katawan”
  choice: Isinalin nang tuwiran at hindi ipinaliwanag sa pangunahing teksto
  alternative: Ituring na sipi ng isang sawikain ng mga taga-Corinto, o lagyan ng paliwanag upang limitahan ang pagiging ganap ng pahayag
  rationale: Mahirap at pinagtatalunan ang eksaktong interpretasyon, ngunit tuwirang inilalahad ng tekstong Griyego ang pahayag. Pinananatili ng salin ang tunay na tensiyon at hindi nagpapasok ng isang tiyak na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino na may marangal at malinaw na himig. Ginamit ang “seksuwal na imoralidad” upang mapanatili ang lawak ng terminong Griyego, at ang “isang tao” bilang likas na pangkalahatang pagtukoy sa Filipino.
