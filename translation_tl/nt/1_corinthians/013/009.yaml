  text: For we know in part[a], and we prophesy in part.
translation:
  language: tl
  text: Sapagkat hindi lubos ang nalalaman natin, at hindi rin lubos ang pagpapahayag natin ng propesiya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa bahagi.” Ang idyomang Griyego ay literal na “mula sa isang bahagi” at inuulit sa dalawang sugnay upang idiin na hindi ganap ang kaalaman at ang pagpapahayag ng propesiya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ μέρους
  choice: bahagi lamang
  rationale: Ipinapanatili nito ang paulit-ulit na larawan ng Griyegong idyomang nangangahulugang ‘sa isang bahagi’ o ‘hindi lubos,’ at inihahanda ang paghahambing sa ganap na darating sa kasunod na konteksto.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Malinaw nitong ipinakikita na ang pangungusap ay paliwanag sa naunang pahayag, habang nananatiling natural at marangal sa makabagong Filipino.
- source_word: γινώσκομεν
  choice: nalalaman natin
  rationale: Tuwiran nitong tinutumbasan ang diwang epistemiko ng γινώσκω nang hindi ito pinalalawak tungo sa mas tiyak na ‘lubos na nauunawaan.’
- source_word: καὶ
  choice: at
  rationale: Payak nitong pinag-uugnay ang dalawang magkatimbang na sugnay at pinananatili ang paralelismo.
- source_word: προφητεύομεν
  choice: ipinapahayag natin bilang propesiya
  rationale: Ipinahahayag nito ang gawaing προφητεύω sa konteksto ng mga kaloob na espirituwal, nang hindi nililimitahan ang kahulugan sa paghula sa hinaharap o sa pangkalahatang pangangaral.
theological_decisions:
- issue: Kahulugan ng gawaing propetiko sa iglesya
  choice: ipinapahayag natin bilang propesiya
  alternative: nangangaral tayo; hinuhulaan natin ang mga mangyayari
  rationale: Maaaring tumukoy ang pandiwang Griyego sa malawak na uri ng kinasihang pananalitang propetiko. Pinananatili ng salin ang lawak at tensiyong teolohikal nito sa halip na ipakahulugan lamang bilang prediksiyon o pangangaral.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Inulit ang ‘bahagi lamang’ upang mapanatili ang diin at paralelismo ng orihinal; iniwasan ang ‘bahagya lamang’ dahil maaari itong mangahulugang ‘halos hindi.’
