  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸂καὶ ἐὰν⸃ ψωμίσω πάντα τὰ ὑπάρχοντά μου, ⸄καὶ ἐὰν⸃ παραδῶ τὸ σῶμά μου, ἵνα ⸀καυθήσομαι, ἀγάπην δὲ μὴ ἔχω, οὐδὲν ὠφελοῦμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/003.yaml
  text: And if I give away all my possessions[a], and if I hand over my body so that I may be burned, but do not have love, I gain nothing.
translation:
  language: tl
  text: At kung ipamahagi ko ang lahat ng ari-arian ko, at kung ibigay ko ang katawan ko upang masunog ako[a], ngunit wala akong pag-ibig, wala akong mapapala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang ilang manuskrito ay kababasahan ng “upang makapagmalaki ako” sa halip na “upang masunog ako.”
    reason: textual_variant
lexical_decisions:
- source_word: ψωμίσω
  choice: ipamigay ... nang paisa-isa
  rationale: Ipinahihiwatig ng pandiwa ang pamamahagi sa mga bahagi o takal; natural sa Filipino ang “ipamigay nang paisa-isa” at napapanatili nito ang larawan ng aktuwal na pamamahagi.
- source_word: πάντα τὰ ὑπάρχοντά μου
  choice: ang lahat ng ari-arian ko
  rationale: Tumutukoy ang parirala sa lahat ng materyal na pag-aari ng nagsasalita; malinaw at karaniwan sa modernong Filipino ang “lahat ng ari-arian ko.”
- source_word: παραδῶ
  choice: ibigay ko
  rationale: Ipinapahayag nito ang kusang pagpapasakamay o pagbibigay ng katawan, nang hindi ipinapasok ang mas interpretatibong salitang “ihandog.”
- source_word: τὸ σῶμά μου
  choice: ang aking katawan
  rationale: Tuwirang salin ng kongkretong parirala, na hindi nangangailangan ng metaporikal na pagpapalawak.
- source_word: ἵνα καυθήσομαι
  choice: upang ako'y sunugin
  rationale: Sinusunod ang ibinigay na tekstong SBLGNT at pinananatili ang layunin o inaasahang resulta ng pagsasakamay sa katawan.
- source_word: ἀγάπην
  choice: pag-ibig
  rationale: Ang “pag-ibig” ang natural, malawak, at di-arkaismong katumbas ng ἀγάπη sa Filipino.
- source_word: οὐδὲν ὠφελοῦμαι
  choice: wala akong mapapala
  rationale: Natural na ipinahahayag sa Filipino ang kawalan ng anumang pakinabang o kapakinabangan sa nagsasalita.
- source_word: καὶ ἐὰν ... καὶ ἐὰν
  choice: At kahit ... at kahit
  rationale: Pinananatili ang inuulit at tumitinding kondisyunal na estruktura ni Pablo; ang “kahit” ay likas na nagpapahayag ng sukdulang hipotetikal na mga gawa.
theological_decisions:
- issue: Variant sa tekstong tumutukoy sa layunin ng pagbibigay ng katawan
  choice: Isinalin sa pangunahing teksto ang καυθήσομαι bilang “upang ako'y sunugin.”
  alternative: Ang ilang manuskrito ay may καυχήσωμαι, “upang ako'y makapagmalaki.”
  rationale: Ang ibinigay na SBLGNT ang sinusunod sa pangunahing teksto. Dahil malaki ang epekto ng variant sa kahulugan, tahasan itong inilalahad sa talababa sa halip na palampasin o pag-isahin ang dalawang pagbasa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang magkatugmang “at kahit” upang marinig ang retorikal na pag-igting ng talata, at iniwasan ang mga salitang maaaring magpasok ng partikular na doktrina.
