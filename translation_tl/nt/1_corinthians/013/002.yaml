id: 1CO.13.2
reference: 1 Corinthians 13:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸂καὶ ἐὰν⸃ ἔχω προφητείαν καὶ εἰδῶ τὰ μυστήρια πάντα καὶ πᾶσαν τὴν γνῶσιν, ⸄καὶ ἐὰν⸅ ἔχω πᾶσαν τὴν πίστιν ὥστε ὄρη ⸀μεθιστάναι, ἀγάπην δὲ μὴ ἔχω, οὐθέν εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/002.yaml
  text: And if I have prophecy and understand all mysteries and all knowledge[a], and if I have all faith so as to move mountains, but do not have love, I am nothing.
translation:
  language: tl
  text: At kung may propesiya ako at nauunawaan ko ang lahat ng hiwaga at lahat ng kaalaman, at kung taglay ko ang buong pananampalataya[a] na makapaglilipat ng mga bundok, ngunit wala akong pag-ibig, wala akong kabuluhan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “buong pagtitiwala”; hindi gaanong malamang, “buong katapatan.” Malawak ang saklaw ng kahulugan ng salitang Griyego, ngunit dito ay malamang na tumutukoy ito sa pambihirang pananampalataya.
    reason: lexical_alternative
lexical_decisions:
- source_word: προφητείαν
  choice: kaloob na magpahayag ng propesiya
  rationale: Sa konteksto ng mga kaloob na espirituwal, nililinaw ng parirala ang likas na Tagalog na diwa ng pangngalan nang hindi ito ginagawang katungkulan o tanggapan.
- source_word: εἰδῶ
  choice: nauunawaan ko
  rationale: Ang 'nauunawaan' ay angkop sa mga hiwaga at iniiwasang ulitin ang 'kaalaman,' habang pinananatili ang diwa ng ganap na pagkaunawa.
- source_word: μυστήρια
  choice: mga hiwaga
  rationale: Pinananatili nito ang terminong teolohikal ni Pablo para sa mga katotohanang nakakubli o inihayag, nang hindi labis na ipinapaliwanag.
- source_word: γνῶσιν
  choice: kaalaman
  rationale: Direkta at likas itong katumbas at pinananatili ang pagkakaiba nito sa pandiwang εἰδῶ.
- source_word: πᾶσαν τὴν πίστιν
  choice: buong pananampalataya
  rationale: Ang 'buong pananampalataya' ay natural na Tagalog para sa hyperbolikong kabuuan ng pambihirang pananampalatayang tinutukoy rito.
- source_word: ὥστε ὄρη μεθιστάναι
  choice: na makapaglilipat ng mga bundok
  rationale: Pinananatili nito ang larawang Griyego at malinaw na iniuugnay ang pambihirang bunga sa pananampalataya.
- source_word: ἀγάπην
  choice: pag-ibig
  rationale: Ang 'pag-ibig' ang malawak, dignificado, at karaniwang katumbas ng ἀγάπη sa modernong Tagalog.
- source_word: οὐθέν εἰμι
  choice: wala akong kabuluhan
  rationale: Natural at mariing Tagalog ito para sa literal na 'ako ay wala,' at tumutukoy sa kawalan ng halaga ng sarili sa ipinahahayag na kondisyon, hindi sa literal na di-pag-iral.
theological_decisions:
- issue: Kahulugan ng πίστις sa konteksto ng pambihirang kakayahang maglipat ng mga bundok
  choice: pananampalataya
  alternative: pagtitiwala; katapatan
  rationale: Ang konteksto ay malamang na tumutukoy sa pambihirang pananampalataya, hindi sa 'katapatan.' Gayunman, pinananatili sa talababa ang leksikal na lawak ng salita.
- issue: Lakas ng οὐθέν εἰμι
  choice: wala akong kabuluhan
  alternative: ako ay walang anuman
  rationale: Pinananatili ng napiling pahayag ang matinding pagtanggi ni Pablo sa sariling halaga kung walang pag-ibig, ngunit mas malinaw at natural ito sa modernong Tagalog kaysa sa salitang-saling anyo.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at madaling maunawaan. Gumamit ng 'taglay ko' upang maging natural ang magkahanay na mga kakayahan, at pinanatili ang retorikal na pag-uulit ng 'at kung.'
