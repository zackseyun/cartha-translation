  verdict: revise
  source_fidelity: Tumpak ang pangunahing paghahambing ng νήπιος at ἀνήρ at ang tatlong magkakatulad na pandiwa. Gayunman, ang “Nang ako'y maging” ay mas karaniwang tunog na panghinaharap o di-pa-naganap sa makabagong Filipino. Hindi nito malinaw na naihahatid ang natapos na paglipat na ipinahihiwatig ng γέγονα at ng kasunod na perpektong κατήργηκα.
  naturalness: Natural ang pangkalahatang ritmo, ngunit magiging mas tuwiran at idiomatiko ang “Noong bata pa ako” at “Nang maging lalaki na ako.” Ang “iniwan ko na” ay mas karaniwang katumbas ng pag-iwan/pagsasantabi sa mga bagay ng pagkabata kaysa “tinalikuran,” na maaaring magdagdag ng diwang tahasang pagtatakwil.
  terminology: Ang “bata” para sa νήπιος at “lalaki” para sa ἀνήρ ay angkop at pinananatili ang panlalaking larawan ng Griyego. Hindi kailangan ang “ganap,” sapagkat ang “lalaki” sa kontekstong katapat ng “bata” ay sapat nang nagpapahiwatig ng pagiging adulto at iniiwasan ang posibleng ibang pakahulugan ng “ganap.”
