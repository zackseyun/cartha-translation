  text: ὅτε ἤμην νήπιος, ⸂ἐλάλουν ὡς νήπιος, ἐφρόνουν ὡς νήπιος, ἐλογιζόμην ὡς νήπιος⸃· ⸀ὅτε γέγονα ἀνήρ, κατήργηκα τὰ τοῦ νηπίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/011.yaml
  text: When I was a child[a], I spoke like a child, I thought like a child, I reasoned like a child. When I became a man, I put away the things of the child.
translation:
  language: tl
  text: Noong bata pa ako, nagsasalita ako tulad ng bata, nag-iisip ako tulad ng bata, at nangangatuwiran ako tulad ng bata. Nang maging lalaki na ako, iniwan ko na ang mga bagay ng bata.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga asal ng bata” o “mga gawi ng bata.” Sa literal, “ang mga bagay ng bata.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νήπιος
  choice: bata
  rationale: Tumutukoy ito sa isang musmos o batang wala pa sa hustong gulang; ang “bata” ay natural sa Filipino at nagpapanatili ng paghahambing sa ganap na lalaki nang hindi nililimitahan ang kahulugan sa sanggol.
- source_word: ἐλάλουν
  choice: nagsasalita ako
  rationale: Tuwirang ipinapahayag ang pagsasalita at pinananatili ang ritmo ng tatlong magkakatulad na sugnay.
- source_word: ἐφρόνουν
  choice: nag-iisip ako
  rationale: Saklaw ng pandiwa ang pag-iisip o paraan ng pag-iisip; ang payak na “nag-iisip” ay malinaw at naiiba pa rin sa kasunod na pangangatuwiran.
- source_word: ἐλογιζόμην
  choice: nangangatuwiran ako
  rationale: Ipinahihiwatig nito ang pagtitimbang o pangangatwiran at mahusay na naipakikita ang kaibhan nito sa ἐφρόνουν.
- source_word: γέγονα
  choice: ako'y maging
  rationale: Bagaman nasa perpektong anyo ang Griyego, natural sa sugnay na χρονological na “nang” ang Filipino na “maging,” na naghahayag ng paglipat sa kalagayan ng pagiging nasa hustong gulang.
- source_word: ἀνήρ
  choice: ganap na lalaki
  rationale: Pinananatili ang tahasang panlalaking katawagan ng Griyego. Idinagdag ang “ganap” upang luminaw na nasa hustong gulang ang ipinantatapat sa bata, hindi lamang na lalaki ang kasarian.
- source_word: κατήργηκα
  choice: tinalikuran ko
  rationale: Sa talinghaga ng paglaki, ipinahihiwatig nito ang pag-aalis o pag-iwan sa dating nauukol sa pagkabata; natural at malinaw ang “tinalikuran” sa Filipino.
- source_word: τὰ τοῦ νηπίου
  choice: ang mga bagay ng bata
  rationale: Malapit ito sa literal na “the things of the child” at pinananatili ang lawak at bahagyang kalabuan ng parirala; ipinaliliwanag sa talababa ang mas idyomatikong mga posibilidad.
theological_decisions:
- issue: Panlalaking kaibhan sa ἀνήρ
  choice: ganap na lalaki
  alternative: nasa hustong gulang / ganap na tao
  rationale: Ang ἀνήρ ay tahasang panlalaking pangngalan, at ginagamit ni Pablo ang sarili bilang halimbawa. Pinananatili ng salin ang kasarian ng larawan nang hindi nagpapahiwatig na ang espirituwal na paggulang ay para lamang sa mga lalaki.
translation_notes:
  register: Makabago at dignidad na Filipino, na may paulit-ulit na hulma upang mapanatili ang retorikal na ritmo ng Griyego. Ginamit ang “ako'y” at “nang” bilang natural na anyong pampanitikan ngunit madaling maunawaan.
