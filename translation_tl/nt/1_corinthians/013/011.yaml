  - severity: low
    issue: “Tinalikuran ko” para sa κατήργηκα
    rationale: Katanggap-tanggap ito, ngunit maaaring magpahiwatig ng mas matinding pagtatakwil. Ang “iniwan ko na” ay natural sa metapora ng paglaki at mas malapit sa English audit trail na “put away,” nang hindi isinasara ang saklaw ng τὰ τοῦ νηπίου.
