  to: Noong bata pa ako, nagsasalita ako tulad ng bata, nag-iisip ako tulad ng bata, at nangangatuwiran ako tulad ng bata. Nang maging lalaki na ako, iniwan ko na ang mga bagay ng bata.[a]
  rationale: Inayos ang panahunan/aspekto upang ipakita ang natapos na paglipat mula pagkabata tungo sa pagiging lalaki, at pinalitan ang mas malakas na “tinalikuran” ng mas natural na “iniwan ko na.” Pinanatili ang pag-uulit, ang panlalaking ἀνήρ, at ang sinadyang malawak na “mga bagay ng bata.”
