  yaml_path: translation/nt/1_corinthians/013/010.yaml
  text: But when the perfect comes[b][a], the partial will be set aside.
translation:
  language: tl
  text: Ngunit kapag dumating ang ganap[a], aalisin na ang bahagya lamang[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “ang buo,” “ang ganap na kalagayan,” o “ang may-gulang.” Pinagtatalunan kung ano ang tinutukoy ng salitang Griyego na to teleion: pagiging buo, pagkamay-gulang, o ang pangwakas na kaganapan na papalit sa kasalukuyang kalagayang bahagya lamang.'
    reason: alternative_reading
  - marker: b
    text: Maaari ring “pawawalan ng bisa,” “mawawala,” o “lilipas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: kapag
  rationale: Likas na ipinapahayag sa Filipino ang isang inaasahang pangyayari sa hinaharap at pinananatili ang temporal na diwa ng sugnay.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita ang banayad na pagsalungat sa naunang kalagayan ng bahagyang kaalaman at propesiya.
- source_word: ἔλθῃ
  choice: dumating
  rationale: Ang aorist subjunctive kasunod ng ὅταν ay tumutukoy rito sa inaasahang pangyayari sa hinaharap; natural sa Filipino ang aspektong kontemplatibo pagkatapos ng “kapag.”
- source_word: τὸ τέλειον
  choice: ang ganap
  rationale: Sinasaklaw ng “ganap” ang ideya ng pagiging buo, lubos, o umabot sa kaganapan nang hindi tiyak na ipinapasiya kung ano ang tinutukoy ng neuter substantival phrase.
- source_word: τὸ ἐκ μέρους
  choice: ang bahagya lamang
  rationale: Ginagamit nang substantibo ang pariralang Griyego at tuwirang itinatapat sa “ang ganap”; nililinaw ng “lamang” ang diwa ng pagiging bahagi ngunit hindi kabuuan.
- source_word: καταργηθήσεται
  choice: mawawala na
  rationale: Ipinahihiwatig na ang bahagyang kalagayan ay matatapos o hindi na mananatiling umiiral. Pinananatili ng talababa ang mas teknikal na posibilidad na mawalan ito ng bisa o alisin.
theological_decisions:
- issue: Ang tinutukoy ng τὸ τέλειον
  choice: Isinalin nang pangkalahatan bilang “ang ganap,” nang hindi tinutukoy ang tiyak na referent.
  alternative: “ang ganap na kalagayan,” “ang buo,” o “ang may-gulang”; maaari rin itong unawain bilang eskatolohikal na kaganapan.
  rationale: Hindi tahasang kinikilala ng talata kung ano ang τὸ τέλειον. Pinananatili ng salin ang tunay na kalabuan at hindi ito iniuugnay nang tahasan sa isang partikular na doktrina gaya ng pagbabalik ni Cristo, ganap na kaalaman, espirituwal na pagkamay-gulang, o pagkabuo ng kanon.
- issue: Ang lakas ng καταργηθήσεται
  choice: “mawawala na” bilang likas na pahayag ng pagwawakas sa kasalukuyang bahagyang kalagayan.
  alternative: “aalisin,” “mawawalan ng bisa,” o “lilipas.”
  rationale: Maaaring mangahulugan ang pandiwa na gawing walang bisa o wakasan, hindi kinakailangang lipulin. Iniiwasan ng pangunahing salin ang labis na pagpapakahulugan habang inilalahad sa talababa ang mahahalagang alternatibo.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ang “ganap” ay sadyang maikli at malawak upang mapanatili ang interpretatibong tensiyon; ang mga marker na [a] at [b] ay kapwa nakalagay sa pangunahing teksto at tumutugma sa mga talababa.
