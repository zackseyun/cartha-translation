  naturalness: 'Nauunawaan ang draft, ngunit mas natural at mas malinaw ang magkakapantay na ayos na inuulit ang “nito” sa bawat pandiwa. Ang “binabata” at “tinitiis” ay magkaiba ngunit kapwa karaniwang Filipino: ang una ay pagdadala/pagpapasan ng bigat, at ang huli ay pagpapatuloy sa ilalim nito.'
  terminology: Ang “pinaniniwalaan nito ang lahat ng bagay” ay katanggap-tanggap na tuwirang salin ng πιστεύει πάντα. Ang “inaasahan nito ang lahat ng bagay” ay nagpapanatili ng siksik na anyo at saklaw ng ἐλπίζει πάντα. Inayos ang talababa sa πιστεύει upang gamitin ang mas natural na “nagtitiwala,” nang hindi ipinipilit na ang pag-ibig ay walang pagkilatis.
