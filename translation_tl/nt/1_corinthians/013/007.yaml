  text: πάντα στέγει, πάντα πιστεύει, πάντα ἐλπίζει, πάντα ὑπομένει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/007.yaml
  text: It bears all things[a], believes all things, hopes all things[b], endures all things.
translation:
  language: tl
  text: Binabata nito ang lahat ng bagay[a], pinaniniwalaan nito ang lahat ng bagay[b], inaasahan nito ang lahat ng bagay, at tinitiis nito ang lahat ng bagay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tinatakpan nito ang lahat ng bagay”; maaari ring magpahiwatig ang στέγει ng pagtatakip o pag-iingat, bukod sa pagdadala o pagtitiis.
    reason: lexical_alternative
  - marker: b
    text: O “nagtitiwala ito sa lahat ng bagay.” Hindi ibig sabihin nito na mapaniwalain ang pag-ibig, kundi may pagkiling itong magtiwala.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: ang lahat ng bagay
  rationale: Ang inuulit na neuter plural accusative ay malawak ang saklaw sa bawat pandiwa. Pinananatili ng “ang lahat ng bagay” ang apat na ulit at ang retorikal na lawak ng Griyego.
- source_word: στέγει
  choice: tinitiis
  rationale: Maaaring mangahulugan ang στέγω ng pagtatakip o, sa pinalawak na diwa, pagtitiis. Natural sa makabagong Tagalog ang “tinitiis” sa kontekstong ito, habang inilalagay sa talababa ang tunay na alternatibong “tinatakpan.”
- source_word: πιστεύει
  choice: pinaniniwalaan
  rationale: Direktang katumbas ito ng karaniwang diwa ng πιστεύω at pinananatili ang maikli at magkakatulad na ayos ng mga pandiwa. Ang posibleng diwang “pinagtitiwalaan” ay inilalagay sa talababa upang hindi ipakahulugang mapaniwalain ang pag-ibig.
- source_word: ἐλπίζει
  choice: inaasahan
  rationale: Ipinahahayag nito ang patuloy at likas na pag-asa ng pag-ibig, at natural itong kaagapay ng “ang lahat ng bagay” sa Tagalog.
- source_word: ὑπομένει
  choice: matiising hinaharap
  rationale: Ipinahahayag ng ὑπομένω ang pananatiling matatag sa ilalim ng hirap o bigat. Ang “matiising hinaharap” ay malinaw at likas sa Tagalog at naiiwasang maging halos kapareho lamang ng naunang “tinitiis.”
theological_decisions:
- issue: Kahulugan ng apat na ulit na πάντα kaugnay ng pag-ibig
  choice: Pinananatili ang komprehensibo at retorikal na “ang lahat ng bagay” bilang paglalarawan sa matatag na katangian ng pag-ibig.
  alternative: Unawain ito bilang ganap na pagsang-ayon sa lahat o walang-pagsusuring paniniwala sa anumang bagay.
  rationale: Ang konteksto ay patulang paglalarawan sa katangian ng ἀγάπη. Hindi nilulutas o nililimitahan ng salin ang lawak ng πάντα, ngunit hindi rin nito ipinahihiwatig na ang pag-ibig ay mapaniwalain o walang moral na pagk discernment.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang apat na magkatulad na parirala upang marinig ang mariing pag-uulit ng Griyego. Ginamit ang “nito” sapagkat ang paksa mula sa konteksto ay “ang pag-ibig.”
