  text: Love is patient[a], love is kind. It does not envy, it does not boast[b], it is not puffed up.
translation:
  language: tl
  text: Ang pag-ibig ay matiisin at mabait. Hindi ito naiinggit[a], hindi nagyayabang, at hindi nagmamataas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagseselos.” Ang pandiwang Griyego ay maaari ring mangahulugang “masigasig,” ngunit ang negatibong konteksto rito ay pumapabor sa diwa ng inggit o selos.
    reason: lexical_alternative
  - marker: b
    text: Sa literal na larawan ng Griyego, hindi ito “napintog” o “lumolobo” sa kapalaluan.
    reason: metaphor
lexical_decisions:
- source_word: ἀγάπη
  choice: pag-ibig
  rationale: Ang “pag-ibig” ang likas at malawak na katumbas sa modernong Tagalog at hindi nito nililimitahan ang diwa sa pagkakawanggawa lamang.
- source_word: μακροθυμεῖ
  choice: matiisin
  rationale: Ipinahihiwatig ng pandiwa ang matagal na pagtitiis, lalo na sa pakikitungo sa kapwa; malinaw at natural ang “matiisin.”
- source_word: χρηστεύεται
  choice: mabait
  rationale: Ipinapahayag ng bihirang pandiwang ito ang pagkilos nang may kabutihan. Ang “mabait” ay maikli at natural kasabay ng “matiisin,” bagaman nakapaloob dito ang aktibong pagpapakita ng kabaitan.
- source_word: ζηλοῖ
  choice: naiinggit
  rationale: Bagaman maaari itong tumukoy sa matinding pagsisikap o pagseselos, hinihingi ng negatibong konteksto rito ang diwa ng inggit o selos; “naiinggit” ang pinakatuwirang pahayag sa Tagalog.
- source_word: περπερεύεται
  choice: nagmamapuri
  rationale: Tumutukoy ito sa pagyayabang o mapagparangyang pagtataas sa sarili. Dignified at angkop sa register ng talata ang “nagmamapuri.”
- source_word: φυσιοῦται
  choice: nagmamataas
  rationale: Literal na larawan nito ang pagkalobo o pagiging napintog dahil sa kapalaluan. Natural na naipahahayag ng “nagmamataas” ang diwa, habang ipinaliliwanag sa talababa ang talinghaga.
- source_word: ἡ ἀγάπη ... ἡ ἀγάπη ... ⸂ἡ ἀγάπη⸃
  choice: Ang pag-ibig ... [ay] ... at ... Hindi ito
  rationale: Pinananatiling lantad ang “pag-ibig” sa simula, ngunit gumagamit ng “ito” sa mga kasunod na sugnay upang maging natural sa Tagalog at maiwasan ang mabigat na pag-uulit.
- source_word: οὐ
  choice: hindi
  rationale: Ang “hindi” ang karaniwang pananggi sa mga pandiwang ito sa modernong Tagalog.
theological_decisions:
- issue: Saklaw ng ἀγάπη sa etikal at teolohikal na konteksto
  choice: pag-ibig
  alternative: pagmamahal; pagkakawanggawa
  rationale: Pinananatili ng “pag-ibig” ang malawak na diwang etikal at kaugnay sa kapwa nang hindi ito pinakikitid sa pagbibigay ng tulong o abuloy.
- issue: Negatibong kahulugan ng ζηλοῖ
  choice: naiinggit
  alternative: nagseselos; masigasig
  rationale: May mas malawak na saklaw ang salitang Griyego, kabilang ang sigasig at selos, ngunit malinaw na negatibo ang hanay ng mga katangian dito. Hindi dapat ipakahulugan na itinatanggi ng talata ang lahat ng uri ng sigasig.
- issue: Talinghaga ng φυσιοῦται
  choice: nagmamataas
  alternative: lumolobo sa kapalaluan; palalo
  rationale: Natural sa Tagalog ang “nagmamataas,” samantalang pinananatili sa talababa ang larawang Griyego ng pagiging napintog o lumolobo sa kapalaluan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, maikli, at marangal. Ginamit ang magkakatugmang paglalarawan sa ugali ng pag-ibig at iniwasan ang arkaiko o labis na teknikal na pananalita.
