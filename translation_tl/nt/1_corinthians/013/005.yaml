  terminology: Ang "kahiya-hiya," "sariling kapakanan," at "masama" ay angkop sa modernong Filipino Tagalog at hindi nagpapataw ng doktrinal na pagpapakahulugan. Ginagamit ang "napupukaw sa galit" para sa παροξύνεται nang hindi idinaragdag ang "madali."
