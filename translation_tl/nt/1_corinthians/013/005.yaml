  source_fidelity: Ang unang dalawang sugnay ay wastong naghahatid ng ἀσχημονεῖ at ζητεῖ τὰ ἑαυτῆς. Ang "kapag pinupukaw" ay nagdaragdag ng isang hayag na kondisyong hindi isinasaad ng παροξύνεται. Ang "kasamaang ginawa rito" naman ay nililimitahan ang τὸ κακόν sa kasamaang ginawa laban sa pag-ibig, samantalang hindi tahasang tinutukoy ng Griyego ang gumagawa o ang pinagtutuunan ng masama. Ang rebisyon ay pinananatili ang pagkapukaw sa galit at ang metaporang pagtutuos nang walang ganitong dagdag na paglilinaw.
