  text: it does not behave disgracefully[a], it does not seek its own, it is not provoked[e][d][c][b], it does not count the wrong.
translation:
  language: tl
  text: Hindi ito kumikilos nang kahiya-hiya[a], hindi nito hinahanap ang sariling kapakanan[b], hindi ito napupukaw sa galit[c], at hindi nito ibinibilang ang masama[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “hindi ito gumagawa ng di-marapat” o “hindi ito umaasal nang bastos.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “hindi nito hinahanap ang sarili nitong mga bagay”; ibig sabihin, hindi ito makasarili.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin na “hindi ito madaling magalit.” Hindi tahasang nakasaad sa Griyego ang “madali.”
    reason: alternative_reading
  - marker: d
    text: Sa literal, “hindi nito ibinibilang ang masama.” Maaari ring unawain na “hindi ito nag-iingat ng talaan ng mga kasalanan.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσχημονεῖ
  choice: kumikilos nang kahiya-hiya
  rationale: Saklaw nito ang pagkilos na di-marapat, kahiya-hiya, o labag sa wastong asal, nang hindi nililimitahan sa simpleng kabastusan.
- source_word: ζητεῖ τὰ ἑαυτῆς
  choice: hinahanap ang sariling kapakanan
  rationale: Ipinahahayag ng idyoma ang makasariling paghahangad. Idinagdag ang 'kapakanan' upang maging likas at malinaw sa Tagalog, habang ang mas literal na anyo ay nasa talababa.
- source_word: παροξύνεται
  choice: nagagalit kapag pinupukaw
  rationale: Ipinananatili ang diwa ng pagkapukaw tungo sa matinding pagkainis o galit, nang hindi idinaragdag ang 'madali,' na wala sa Griyego.
- source_word: λογίζεται τὸ κακόν
  choice: itinatala ang kasamaang ginawa rito
  rationale: Pinananatili ang larawang may kinalaman sa pagtutuos o pagtatala, ngunit ginagawang natural sa Tagalog. Ang 'ginawa rito' ay kontekstuwal na paglilinaw at hindi tahasang nakasaad sa Griyego, kaya tinukoy sa talababa.
- source_word: ἀγάπη (implicit subject from context)
  choice: ito
  rationale: Ang pag-ibig ang ipinagpapatuloy na paksa mula sa naunang konteksto; natural sa Tagalog ang paggamit ng 'ito' sa sunud-sunod na paglalarawan.
theological_decisions:
- issue: Kung paiigtingin ang παροξύνεται bilang 'madaling magalit'
  choice: hindi ito nagagalit kapag pinupukaw
  alternative: hindi ito madaling magalit
  rationale: Walang katumbas na pang-abay para sa 'madali' sa Griyego. Pinananatili ng salin ang ideya ng pagkapukaw nang hindi nagdaragdag ng antas o dalas.
- issue: Kung ang λογίζεται τὸ κακόν ay isasalin bilang pangkalahatang pag-iisip ng masama o bilang pagtatala ng kasalanang dinanas
  choice: hindi nito itinatala ang kasamaang ginawa rito
  alternative: hindi nito ibinibilang ang masama
  rationale: Malakas ang metapora ng pagtutuos sa λογίζεται, at sa konteksto ng pakikipagkapuwa malamang na tumutukoy ang τὸ κακόν sa kasamaang dinanas. Gayunman, pinananatili sa talababa ang mas literal at mas malawak na posibilidad.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang 'kumikilos nang kahiya-hiya' upang mapanatili ang moral at panlipunang saklaw ng ἀσχημονεῖ; iniwasan ang sobrang kolokyal na pananalita. Ang magkakatulad na hulma ng mga sugnay ay nagpapanatili sa retorikal na ritmo ng talata.
