  to: Sapagkat ngayo’y nakakakita tayo sa pamamagitan ng salamin, sa isang palaisipan[a]; ngunit sa panahong iyon, harap-harapan na. Ngayo’y bahagi lamang ang nalalaman ko, ngunit sa panahong iyon, lubos kong malalaman, kung paanong lubos na akong nakilala.
  rationale: Inayos ang di-likas na pagkakaugnay ng “palaisipan,” ginawang mas malinaw ang idyomang “face to face,” at pinanatili ang lahat ng pangunahing larawan at ambiguwidad ng Greek. Ang talababa ay nananatiling nakaangkla sa αἴνιγμα at nililinaw na ang “malabo” ay isang interpretatibong alternatibo, hindi ang mas literal na anyo.
