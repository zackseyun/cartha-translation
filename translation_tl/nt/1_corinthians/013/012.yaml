id: 1CO.13.12
reference: 1 Corinthians 13:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: βλέπομεν γὰρ ἄρτι δι’ ἐσόπτρου ἐν αἰνίγματι, τότε δὲ πρόσωπον πρὸς πρόσωπον· ἄρτι γινώσκω ἐκ μέρους, τότε δὲ ἐπιγνώσομαι καθὼς καὶ ἐπεγνώσθην.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/012.yaml
  text: For now we see in a mirror[a], dimly, but then face to face. Now I know in part, but then I will know fully, just as I also have been fully known.
translation:
  language: tl
  text: Sapagkat ngayo’y nakakakita tayo sa pamamagitan ng salamin, sa isang palaisipan[a]; ngunit sa panahong iyon, harap-harapan na. Ngayo’y bahagi lamang ang nalalaman ko, ngunit sa panahong iyon, lubos kong malalaman, kung paanong lubos na akong nakilala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring isaling “malabo.” Mas literal, “sa isang palaisipan.” Ipinahihiwatig ng Griyego ang di-tuwiran at mahirap maunawaang pagkakita.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπομεν
  choice: nakakakita tayo
  rationale: Pinananatili ang payak na pandiwang pandama at ang talinghaga ng paningin.
- source_word: ἄρτι
  choice: ngayo’y
  rationale: Malinaw at maikli nitong itinatapat ang kasalukuyan sa τότε, ang panahong darating.
- source_word: δι’ ἐσόπτρου
  choice: sa pamamagitan ng salamin
  rationale: Ipinahahayag ang διά na may genitive bilang namamagitang paraan ng pagtingin, nang hindi ipinapalagay na tumitingin sa salamin na tila bintana.
- source_word: ἐν αἰνίγματι
  choice: na parang nasa isang palaisipan
  rationale: Pinananatili ang diwa ng αἴνιγμα bilang palaisipan—di-tuwiran at mahirap maunawaan—sa natural na Tagalog.
- source_word: τότε δὲ
  choice: ngunit pagdating ng panahong iyon
  rationale: Malinaw na ipinakikita ang pagsalungat sa ngayo’y at ang hinaharap na kalagayan.
- source_word: πρόσωπον πρὸς πρόσωπον
  choice: mukhaan
  rationale: Natural na idyomang Tagalog para sa tuwiran at hindi namamagitang pagtatagpo; ang literal na anyo ay inilalagay sa talababa.
- source_word: γινώσκω ἐκ μέρους
  choice: bahagi lamang ang nalalaman ko
  rationale: Natural na Tagalog na tapat sa limitadong kaalamang ipinahahayag ng ἐκ μέρους.
- source_word: ἐπιγνώσομαι
  choice: lubos kong malalaman
  rationale: Ipinakikita ang kaibhan sa bahagyang kaalaman ngunit hindi ipinahihiwatig ang pagkaalam sa lahat o banal na omniscience.
- source_word: καθὼς καὶ ἐπεγνώσθην
  choice: kung paanong lubos din akong nakilala
  rationale: Pinananatili ang pagkakatugma sa ἐπιγνώσομαι at ang passive na anyo, kaya hindi tahasang tinutukoy kung sino ang kumilala.
theological_decisions:
- issue: Lawak ng kaalaman sa hinaharap na ipinahihiwatig ng ἐπιγνώσομαι
  choice: lubos kong malalaman
  alternative: malalaman ko ang lahat
  rationale: Ang teksto ay naghahambing ng bahagyang kaalaman ngayon sa ganap o lubos na pagkilala sa hinaharap, ngunit hindi nito sinasabing magkakaroon ang tao ng walang-hanggang kaalamang tulad ng sa Diyos.
- issue: Pagkakakilanlan ng gumagawa sa passive na ἐπεγνώσθην
  choice: hindi tahasang pinangalanan ang kumilala
  alternative: kung paanong lubos akong nakilala ng Diyos
  rationale: Bagaman malamang na Diyos ang ipinahihiwatig ng konteksto, walang tahasang simuno sa Griyego; pinananatili ng salin ang ambiguwidad na iyon.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “mukhaan” bilang likas na idyoma, habang pinanatili sa pangunahing teksto at talababa ang palaisipang larawan ng αἴνιγμα.
