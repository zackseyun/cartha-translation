  text: Ἡ ἀγάπη οὐδέποτε ⸀πίπτει. εἴτε δὲ προφητεῖαι, καταργηθήσονται· εἴτε γλῶσσαι, παύσονται· εἴτε γνῶσις, καταργηθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/008.yaml
  text: Love never fails[a]. But whether there are prophecies, they will be set aside; whether tongues, they will cease; whether knowledge[c][b], it will be set aside.
translation:
  language: tl
  text: Ang pag-ibig ay hindi kailanman nabibigo.[a] May mga propesiya man, mawawalan ng bisa ang mga ito; may mga wika man,[b] titigil ang mga ito; may kaalaman man, mawawalan ito ng bisa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ang pag-ibig ay hindi kailanman bumabagsak” o “Ang pag-ibig ay hindi kailanman nagwawakas.”
    reason: lexical_alternative
  - marker: b
    text: O “mga dila.”
    reason: alternative_reading
  - marker: c
    text: Ang pandiwang isinaling “mawawalan ng bisa” ay siya ring ginamit sa sugnay tungkol sa “mga propesiya.”
    reason: cross_reference
lexical_decisions:
- source_word: ἀγάπη
  choice: pag-ibig
  rationale: Ang “pag-ibig” ang likas at malawak na katumbas sa modernong Filipino para sa pag-ibig na tinatalakay ni Pablo.
- source_word: οὐδέποτε πίπτει
  choice: hindi kailanman nabibigo
  rationale: Ipinahahayag nito ang di-nagmamaliw at maaasahang katangian ng pag-ibig, nang hindi lubusang ipinapantay ang πίπτει sa mga pandiwa ng paghinto sa kasunod na mga sugnay.
- source_word: προφητεῖαι
  choice: mga propesiya
  rationale: Karaniwang katawagan ito sa mga pahayag o gawain ng propesiya at nauunawaan sa konteksto ng 1 Corinto 12–14.
- source_word: καταργηθήσονται / καταργηθήσεται
  choice: mawawalan ng bisa
  rationale: Iisang parirala ang ginamit sa dalawang anyo ng καταργέω upang mapanatili ang ugnayang leksikal; ipinahihiwatig nito ang pagkawala ng bisa o tungkulin, hindi kinakailangang pagkalipol.
- source_word: γλῶσσαι
  choice: mga wika
  rationale: Ang “mga wika” ay natural sa modernong Filipino at hindi nagpapasiya kung karaniwang mga wikang pantao o isang karismatikong penomenon ang tiyak na tinutukoy.
- source_word: παύσονται
  choice: titigil
  rationale: Pinananatili nito ang payak na diwa ng paghinto at ang pagkakaiba nito sa καταργέω.
- source_word: γνῶσις
  choice: kaalaman
  rationale: Ito ang tuwirang katumbas at umaangkop sa kasunod na pagtalakay ni Pablo tungkol sa bahagyang pagk知—kaalaman.
theological_decisions:
- issue: Kahulugan ng πίπτει sa pahayag tungkol sa pag-ibig
  choice: hindi kailanman nabibigo
  alternative: hindi kailanman bumabagsak; hindi kailanman nagwawakas
  rationale: Ang “nabibigo” ay malinaw na nagpapakita ng namamalaging katangian ng pag-ibig, habang ang talababa ay nagpapanatili sa tunay na lawak ng metapora.
- issue: Kahulugan ng γλῶσσαι sa 1 Corinto 12–14
  choice: mga wika
  alternative: mga dila
  rationale: Iniiwasan ng “mga wika” ang di-likas na literalismo sa Filipino at hindi nito nilulutas ang pagtatalo tungkol sa eksaktong kalikasan ng kaloob.
- issue: Lakas ng καταργέω
  choice: mawawalan ng bisa
  alternative: aalisin; papawiin
  rationale: Pinananatili nito ang ideya ng pagkawala ng bisa o gawain nang hindi nagpapasok ng mas matinding pahiwatig ng lubos na pagkalipol.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “kung may” upang natural na punan ang elipsis ng Griyego, at pinanatili ang pagkakaiba ng καταργέω (“mawawalan ng bisa”) at παύω (“titigil”).
