revisions:
- from: Ang pag-ibig ay hindi kailanman nabibigo.[a] Ngunit kung may mga propesiya, mawawalan ang mga iyon ng bisa; kung may mga wika,[b] titigil ang mga iyon; kung may kaalaman, mawawalan iyon ng bisa.[c]
  to: Ang pag-ibig ay hindi kailanman nabibigo.[a] May mga propesiya man, mawawalan ng bisa ang mga ito; may mga wika man,[b] titigil ang mga ito; may kaalaman man, mawawalan ito ng bisa.[c]
  rationale: Pinalitan ang “kung may” ng “May ... man” upang maging likas ang Filipino at maipakita ang seryeng εἴτε nang hindi ginagawang karaniwang kondisyon ang mga sugnay. Pinasimple ang talababa b upang magbigay lamang ng neutral na leksikal na alternatibo at huwag lutasin ang pinagtatalunang saklaw ng “mga wika.” Napanatili ang lahat ng pagkakaibang pandiwa at ang mga angkla ng talababa.
