  text: it does not rejoice in unrighteousness, but rejoices with the truth.
translation:
  language: tl
  text: Hindi ito nagagalak sa kalikuan[a], kundi nakikigalak sa katotohanan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “masamang gawa” o “kawalang-katarungan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nakikigalak kasama ng katotohanan” o “nagagalak sa katotohanan.” Ang tambalang pandiwa sa Griyego ay maaaring mangahulugang nakikibahagi sa galak o nagagalak dahil sa katotohanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρει
  choice: nagagalak
  rationale: Likas at marangal na katumbas ito ng pandiwang nagsasaad ng galak; pinananatili rin nito ang paralelismo sa συγχαίρει.
- source_word: ἐπὶ τῇ ἀδικίᾳ
  choice: sa kalikuan
  rationale: Ang “sa” ay natural na nagpapahayag ng dahilan o bagay na ikinagagalak. Sinasaklaw ng “kalikuan” ang masamang gawa at kawalang-katarungan nang hindi nililimitahan ang diwa sa usaping legal o panlipunan lamang.
- source_word: συγχαίρει
  choice: nakikigalak
  rationale: Ipinahahayag ng “nakikigalak” ang dagdag na diwa ng συν-, yaitu ang pakikibahagi sa galak, habang nananatiling maikli at natural sa Tagalog.
- source_word: δὲ
  choice: kundi
  rationale: Pagkatapos ng negatibong sugnay, malinaw at natural na ipinakikita ng “kundi” ang mariing pagsalungat.
- source_word: τῇ ἀληθείᾳ
  choice: sa katotohanan
  rationale: Pinananatili nito ang malawak na diwa ng ἀλήθεια at ang moral na pagsalungat nito sa ἀδικία, nang hindi ito nililimitahan sa pananalita, asal, o mensahe ng ebanghelyo lamang.
theological_decisions:
- issue: Ang lawak ng ἀδικία sa etikal na pagsalungat kay Pablo
  choice: kalikuan
  alternative: masamang gawa; kawalang-katarungan
  rationale: Ang “kalikuan” ay may malawak na moral na bigat at maaaring sumaklaw sa paggawa ng mali at kawalang-katarungan, nang hindi nagpapasok ng mas makitid na legal o denominasyonal na pagbasa.
- issue: Kung ang συγχαίρει τῇ ἀληθείᾳ ay pakikigalak dahil sa katotohanan o kasama nito
  choice: nakikigalak sa katotohanan
  alternative: nakikigalak kasama ng katotohanan; nagagalak sa katotohanan
  rationale: Pinananatili ng “nakikigalak” ang puwersa ng tambalang pandiwa, samantalang ang “sa katotohanan” ay likas sa Tagalog at hindi tuluyang nilulutas kung ang katotohanan ang kasama sa galak o ang bagay na ikinagagalak.
translation_notes:
  register: Modernong Filipino Tagalog na maikli, marangal, at madaling maunawaan. Ginamit ang “ito” bilang pagpapatuloy sa paglalangkap-katao sa pag-ibig sa naunang mga talata; iniwasan ang labis na pormal o makalumang mga salita.
