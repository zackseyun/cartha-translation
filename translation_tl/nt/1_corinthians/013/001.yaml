id: 1CO.13.1
reference: 1 Corinthians 13:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἐὰν ταῖς γλώσσαις τῶν ἀνθρώπων λαλῶ καὶ τῶν ἀγγέλων, ἀγάπην δὲ μὴ ἔχω, γέγονα χαλκὸς ἠχῶν ἢ κύμβαλον ἀλαλάζον.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/001.yaml
  text: If I speak in the tongues of men and of angels[a], but do not have love[c][b], I have become sounding bronze or a clashing cymbal.
translation:
  language: tl
  text: Kung nagsasalita ako sa mga wika[a] ng mga tao at ng mga anghel, ngunit wala akong pag-ibig, ako'y naging tansong umaalingawngaw[b] o pompiyang kumakalansing.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga dila.” Ang salitang Griyego ay maaaring tumukoy sa dila, wika, o natatanging uri ng pagsasalita.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring unawain bilang “metal na umaalingawngaw,” gaya ng isang gong o batingaw. Tumutunog na metal ang pinangalanan sa Griyego, hindi isang tiyak na instrumento.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν
  choice: Kung
  rationale: Likas na panandang Filipino para sa kondisyon o ipinapalagay na kalagayan sa retorikal na pangungusap ni Pablo.
- source_word: ταῖς γλώσσαις
  choice: sa mga wika
  rationale: Maaaring tumukoy ang γλῶσσα sa dila, wika, o uri ng pananalita. Ang “mga wika” ay natural sa modernong Filipino at hindi nagpapasiya kung mga wikang makatao o kaloob na pagsasalita ang tinutukoy.
- source_word: τῶν ἀνθρώπων
  choice: ng mga tao
  rationale: Tumutukoy sa sangkatauhan bilang kabaligtaran ng mga anghel; malinaw at likas itong inklusibo sa Filipino.
- source_word: λαλῶ
  choice: nagsasalita ako
  rationale: Pinananatili ang pangkasalukuyang anyo sa loob ng kondisyong pangungusap.
- source_word: καὶ τῶν ἀγγέλων
  choice: at ng mga anghel
  rationale: Ang kaibahan sa mga tao at ang retorikal na pagpapataas ay pumapabor sa kahulugang mga makalangit na nilalang, hindi karaniwang mga mensahero.
- source_word: ἀγάπην
  choice: pag-ibig
  rationale: Karaniwan, marangal, at malawak na salitang Filipino para sa ἀγάπη, nang hindi nililimitahan sa romantikong pag-ibig o kawanggawa.
- source_word: δὲ μὴ ἔχω
  choice: ngunit wala akong
  rationale: Natural na ipinahahayag ang pagsalungat at kawalan ng pag-ibig.
- source_word: γέγονα
  choice: ako'y naging
  rationale: Pinananatili ang resultang kalagayan ng Greek perfect sa halip na gawing simpleng “ako ay.”
- source_word: χαλκὸς ἠχῶν
  choice: tansong umaalingawngaw
  rationale: Malapit sa larawan ng tekstong Griyego, na tahasang bumabanggit sa tumutunog na metal ngunit hindi tumutukoy ng isang tiyak na instrumento.
- source_word: ἢ κύμβαλον ἀλαλάζον
  choice: o pompiyang kumakalansing
  rationale: Ang “pompiya” ang karaniwang Filipino para sa cymbal, at ang “kumakalansing” ay naghahatid ng malakas at magaspang na tunog.
theological_decisions:
- issue: Kahulugan ng “mga wika ng mga tao at ng mga anghel”
  choice: Pinanatili bilang tuwirang retorikal na paghahambing nang hindi nagpapasiya kung literal na wika ng mga anghel o pagpapalabis ang tinutukoy.
  alternative: Unawain ito bilang aktuwal na makalangit na mga wika, o bilang hayperboleng tumutukoy sa pinakamataas na maiisip na pananalita.
  rationale: Hindi nilulutas ng talata ang tanong; dapat panatilihin ng salin ang tunay na ambiguwidad at retorikal na puwersa.
- issue: Larawan ng χαλκὸς ἠχῶν
  choice: Isinaling “tansong umaalingawngaw” nang walang idinagdag na tiyak na instrumento.
  alternative: “Batingaw na umaalingawngaw” o “gong na tumutunog.”
  rationale: Metal ang tahasang pinangalanan sa Griyego. Ang pagtukoy sa batingaw o gong ay posibleng pagpapaliwanag ngunit mas tiyak kaysa sa pinagmulan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “mga tao” sa inklusibong diwa at pinanatili ang matapang at bahagyang di-karaniwang metapora ng orihinal sa halip na palitan agad ng isang tiyak na instrumentong hindi tahasang binanggit.
