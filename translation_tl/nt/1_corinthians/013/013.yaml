base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/013.yaml
  text: 'And now these three remain: faith[a], hope, and love[c][b]. But the greatest of these is love.'
translation:
  language: tl
  text: 'At ngayon[a], nananatili[b] ang tatlong ito: pananampalataya[c], pag-asa, at pag-ibig. Ngunit ang pinakadakila sa mga ito ay ang pag-ibig.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Ngunit ngayon”; maaaring magpahiwatig ang pang-ugnay na Griyego ng pagpapatuloy o banayad na pagsalungat.
    reason: lexical_alternative
  - marker: b
    text: O “patuloy na umiiral”; ang pandiwa ay maaaring mangahulugang manatili, magpatuloy, o magtagal.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring unawain nang mas malawak bilang “pagtitiwala,” bagaman “pananampalataya” ang karaniwang salin dito.
    reason: alternative_reading
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: At ngayon
  rationale: Ang νυνί ay tumutukoy sa kasalukuyan o sa kalagayang binibigyang-diin sa pangwakas na pahayag, samantalang ang δέ ay banayad na pang-ugnay na maaaring magpahiwatig ng pagpapatuloy o pagsalungat. Likas sa Filipino ang “At ngayon,” habang pinananatili sa talababa ang “Ngunit ngayon.”
- source_word: μένει
  choice: nananatili
  rationale: Ipinahihiwatig ng μένω ang patuloy na pananatili o pag-iral, kabaligtaran ng mga kaloob na lilipas. Malinaw at natural sa makabagong Filipino ang “nananatili.”
- source_word: πίστις
  choice: pananampalataya
  rationale: Sa tatluhang pananampalataya, pag-asa, at pag-ibig, “pananampalataya” ang kinagawian at pinakamalinaw na salin. Posible rin ang mas malawak na diwang “pagtitiwala,” kaya itinala ito sa talababa.
- source_word: ἐλπίς
  choice: pag-asa
  rationale: Ang “pag-asa” ang natural at karaniwang katumbas ng ἐλπίς sa kontekstong Paulino; pinananatili nito ang positibo at teolohikal na diwa ng salita.
- source_word: ἀγάπη
  choice: pag-ibig
  rationale: Ang “pag-ibig” ang malinaw, dignificado, at pangkasalukuyang salin ng ἀγάπη, nang hindi nagdaragdag ng isang natatanging denominasyonal na pakahulugan.
- source_word: τὰ τρία ταῦτα
  choice: ang tatlong ito
  rationale: Tuwirang tumutukoy ang parirala sa tatlong kababanggit lamang at natural itong ipinapahayag sa Filipino bilang “ang tatlong ito.”
- source_word: μείζων ... τούτων
  choice: ang pinakadakila sa mga ito
  rationale: Bagaman anyong pahambing ang μείζων, ang pagkakabuo nito kasama ng τούτων ay nagraranggo sa pag-ibig sa loob ng tatlo. Ang pasukdol na “pinakadakila sa mga ito” ang malinaw at likas na pagpapahayag ng diwa sa Filipino.
theological_decisions:
- issue: Kahulugan ng πίστις sa mahalagang kontekstong Paulino
  choice: pananampalataya
  alternative: pagtitiwala; katapatan
  rationale: Matibay na ipinapahiwatig ng tatluhang “pananampalataya, pag-asa, at pag-ibig” ang “pananampalataya.” Hindi lubos na inaalis ang mas malawak na diwang “pagtitiwala,” ngunit hindi gaanong malamang rito ang “katapatan.”
- issue: Antas ng paghahambing sa μείζων
  choice: ang pinakadakila sa mga ito ay ang pag-ibig
  alternative: mas dakila sa mga ito ang pag-ibig
  rationale: Anyong pahambing ang salitang Griyego, ngunit sa konteksto ay kinikilala nito ang pag-ibig bilang nangingibabaw sa tatlo. Ipinahahayag ito nang malinaw ng pasukdol sa Filipino nang hindi binabago ang teolohikal na punto.
translation_notes:
  register: Makabago, natural, at dignipikadong Filipino ang ginamit. Pinanatili ang pamilyar na tatluhang “pananampalataya, pag-asa, at pag-ibig,” habang inilagay sa mga talababa ang tunay na mga alternatibong leksikal at pangdiskurso.
