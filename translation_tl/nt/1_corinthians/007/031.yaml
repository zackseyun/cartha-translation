  yaml_path: translation/nt/1_corinthians/007/031.yaml
  text: and those who use the world as not making full use of it[b][a]; for the present form of this world is passing away.
translation:
  language: tl
  text: At ang mga gumagamit ng sanlibutan ay parang hindi lubusang gumagamit nito[a]; sapagkat lumilipas ang anyo ng sanlibutang ito[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “parang hindi ito ginagamit nang lubusan”; maaari ring magtaglay ang pandiwa ng diwang “hindi ito inaabuso.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “panlabas na anyo” o “kasalukuyang kaayusan” ng sanlibutang ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρώμενοι (χράομαι)
  choice: gumagamit
  rationale: Tuwirang ipinapahayag ang paggamit o pakikitungo sa mga bagay ng sanlibutan at pinananatili ang ugnayan nito sa kasunod na καταχρώμενοι.
- source_word: τὸν κόσμον
  choice: ang sanlibutan
  rationale: Tumutukoy rito sa kasalukuyang kaayusang panlipunan at materyal, hindi lamang sa pisikal na daigdig. Ang “sanlibutan” ay dignified at pamilyar na katawagang biblikal sa Filipino.
- source_word: ὡς μὴ καταχρώμενοι
  choice: na para bang hindi nila ito lubusang ginagamit
  rationale: Pinananatili ang paglalaro ng mga salitang χράομαι at καταχράομαι at ang diwang hindi lubos na pagbuhos ng sarili sa paggamit nito, nang hindi nililimitahan ang kahulugan sa moral na pag-abuso.
- source_word: παράγει
  choice: lumilipas na
  rationale: Ipinahihiwatig ng pangkasalukuyang pandiwa ang nagpapatuloy nang paglipas at pansamantalang katangian ng kasalukuyang sanlibutan.
- source_word: τὸ σχῆμα
  choice: ang anyo
  rationale: Ang σχῆμα ay anyo, panlabas na kaayusan, o kasalukuyang kalagayan. Ang “anyo” ay maikli, natural, at hindi nagpapasya nang labis sa saklaw ng salita.
- source_word: τοῦ κόσμου τούτου
  choice: ng sanlibutang ito
  rationale: Pinananatili ang demonstratibong τούτου upang idiin ang kasalukuyang kaayusang lumilipas.
theological_decisions:
- issue: Kahulugan ng καταχρώμενοι kaugnay ng χρώμενοι
  choice: Gamitin ang sanlibutan nang hindi ito lubusang ginagamit o pinagbubuhusan ng sarili.
  alternative: Huwag abusuhin ang sanlibutan; o kumilos na para bang hindi talaga ito ginagamit.
  rationale: Ang magkaugnay na χρώμενοι at καταχρώμενοι ay lumilikha ng sadyang pag-uulit at tensiyon sa pagitan ng paggamit at lubusang paggamit. Hindi dapat ikulong ang teksto sa ideya lamang ng pag-abuso.
- issue: Kahulugan ng σχῆμα
  choice: Ang lumilipas ay ang kasalukuyang anyo o kaayusan ng sanlibutang ito.
  alternative: Panlabas na hitsura lamang ng sanlibutan; o ang likas na esensiya mismo ng sanlibutan.
  rationale: Ang σχῆμα ay tumutukoy sa kasalukuyang anyo o pagkakaayos, hindi malinaw na sa esensiya nito. Pinananatili ng saling “anyo” ang saklaw at tensiyon ng orihinal.
translation_notes:
  register: Modernong Filipino na may dignified na biblikal na himig. Ginamit ang “sanlibutan” para sa κόσμος at ang natural na pariralang “lumilipas na.” Inilagay ang bawat talababa kaagad pagkatapos ng pariralang tinutukoy nito.
