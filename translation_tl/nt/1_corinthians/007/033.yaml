translation:
  language: tl
  text: Ngunit ang lalaking may asawa ay iniintindi ang mga bagay ng sanlibutan[a]—kung paano niya mapalulugdan ang kanyang asawa—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga usapin ng mundong ito” o “mga bagay na nauukol sa sanlibutan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ γαμήσας
  choice: Ngunit ang lalaking may asawa
  rationale: Ang substantibong aorist participle ay tumutukoy sa lalaking nag-asawa, kaiba sa lalaking walang asawa sa konteksto. Ang “lalaking may asawa” ay likas sa modernong Tagalog at pinananatili ang panlalaking isahan.
- source_word: μεριμνᾷ
  choice: ay nag-aalala sa
  rationale: Maaaring mangahulugan ang pandiwa ng pag-aalala, pagmamalasakit, o pagbibigay-pansin. Dito, inilalarawan nito ang praktikal na pinagkakaabalahan ng may asawa, hindi kinakailangang makasalanang pagkabalisa.
- source_word: τὰ τοῦ κόσμου
  choice: mga bagay sa sanlibutan
  rationale: Tumutukoy ito sa mga bagay na kaugnay ng karaniwang pamumuhay sa kasalukuyang sanlibutan. Pinananatili ng salin ang maramihang anyo at hindi nito ipinapalagay na likas na masama ang mga ito.
- source_word: πῶς ἀρέσῃ
  choice: kung paano niya mapalulugdan
  rationale: 'Ipinapahayag ng πῶς kasama ng subjunctive ang nilalaman ng kanyang pag-aalala: kung paano niya mabibigyang-lugod ang kanyang asawa. Likas sa Tagalog ang “kung paano niya mapalulugdan.”'
- source_word: τῇ γυναικί
  choice: ang kanyang asawa
  rationale: Sa konteksto ng pag-aasawa, ang γυνή ay malinaw na nangangahulugang “asawa.” Ginagawang hayag ng “kanyang” ang relasyong likas na ipinahihiwatig sa Griyego.
theological_decisions:
- issue: Kung dapat bang bigyan ng negatibong moral na kahulugan ang κόσμος dito
  choice: Isinalin nang neutral bilang “sanlibutan” at ipinaliwanag bilang mga usapin ng karaniwang buhay.
  alternative: “makamundong mga bagay,” na maaaring magpahiwatig na masama ang mga ito
  rationale: Sa konteksto, ang punto ni Pablo ay ang praktikal na pananagutan ng buhay-may-asawa na maaaring humati sa pinag-uukulang pansin, hindi ang tahasang paghatol sa pag-aasawa o sa ordinaryong tungkulin.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang neutral na diwa ng κόσμος at ang bahagyang tensiyon ng μεριμνᾷ. Ang mga gitling sa hulihan ay umaayon sa pagpapatuloy ng pangungusap sa kasunod na talata.
