  text: τοῦτο δέ φημι, ἀδελφοί, ὁ καιρὸς συνεσταλμένος ⸂ἐστίν· τὸ λοιπὸν⸃ ἵνα καὶ οἱ ἔχοντες γυναῖκας ὡς μὴ ἔχοντες ὦσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/029.yaml
  text: 'This is what I mean[a], brothers: the time has been shortened, so that from now on even those who have wives should be as though they had none[b],'
translation:
  language: tl
  text: Ito ang ibig kong sabihin, mga kapatid:[a] pinaikli na ang takdang panahon.[b] Kaya mula ngayon, maging ang mga lalaking may asawa ay mamuhay na para bang wala silang asawa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga kapatid” ay salin ng panlalaking anyong maramihan sa Griyego, na maaari ring gamitin sa pagtawag sa magkahalong pangkat ng mga mananampalataya.
    reason: cultural_note
  - marker: b
    text: 'Maaari ring isalin: “umiksi na ang takdang panahon.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δέ φημι
  choice: Ito ang ibig kong sabihin
  rationale: Likas na pormula sa modernong Tagalog para sa pagpapakilala ng paglilinaw; pinananatili nito ang diwang paliwanag, hindi lamang ang literal na ‘sinasabi ko ito.’
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Ang ‘mga kapatid’ ang karaniwan at marangal na tawag sa mga kapwa mananampalataya sa Tagalog at likas itong maaaring tumukoy sa mga lalaki at babae.
- source_word: ὁ καιρός
  choice: ang takdang panahon
  rationale: Ipinahihiwatig ng καιρός ang isang mahalaga o itinakdang panahon, hindi lamang ang paglipas ng oras.
- source_word: συνεσταλμένος ἐστίν
  choice: pinaikli na
  rationale: Pinananatili ang kasalukuyang kalagayang bunga ng pagpapaikli na ipinahahayag ng periphrastic perfect; hindi tinutukoy kung sino ang gumawa nito.
- source_word: τὸ λοιπὸν
  choice: mula ngayon
  rationale: Malinaw at natural na ipinahahayag ang temporal na puwersa ng parirala para sa nalalabing panahon.
- source_word: ἵνα
  choice: Kaya
  rationale: Iniuugnay ang pinaikling panahon sa kasunod na paraan ng pamumuhay nang hindi mabigat o di-likas ang pangungusap sa Tagalog.
- source_word: οἱ ἔχοντες γυναῖκας
  choice: ang mga may asawa
  rationale: Natural na katumbas sa Tagalog sa konteksto ng pag-aasawa; bagaman ‘mga asawang babae’ ang literal na tinutukoy ng γυναῖκας, magiging alanganin at labis na mabigat ang ganoong tahasang pag-uulit.
- source_word: ὡς μὴ ἔχοντες
  choice: na para bang wala silang asawa
  rationale: Pinananatili ang matalim na paghahambing ng Griyego nang hindi ipinapaliwanag o pinahihinahon ang utos.
theological_decisions:
- issue: Lakas ng tagubilin ni Pablo tungkol sa pag-aasawa
  choice: Panatilihin ang tuwirang ‘mamuhay na para bang wala silang asawa.’
  alternative: Ipaliwanag bilang emosyonal na paglayo sa pag-aasawa o bawasan ang tensiyon nito sa ibang turo tungkol sa pananagutan sa asawa.
  rationale: Inilalagay ng talata ang karaniwang kalagayang panlipunan sa ilalim ng kagyat na pananaw sa panahon. Dapat manatili sa salin ang tunay na tensiyong ito sa halip na lutasin ito sa pamamagitan ng pagpapakahulugan.
- issue: Ugnayan ng ἵνα sa pinaikling panahon at sa kasunod na pamumuhay
  choice: Gamitin ang ‘Kaya’ upang ipakita ang malapit na lohikal na ugnayan.
  alternative: ‘Upang,’ na maaaring higit na magpahiwatig ng layunin kaysa bunga.
  rationale: Maaaring magpahayag ang ἵνα ng layunin o bunga sa ganitong konstruksiyon. Ang ‘Kaya’ ay natural sa Tagalog at hindi tahasang nagpapasiya na layunin lamang ang relasyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘mga kapatid’ bilang likas na katawagan sa kapwa mananampalataya at pinanatili ang matalim, hindi pinalabnaw na paghahambing tungkol sa mga may asawa.
