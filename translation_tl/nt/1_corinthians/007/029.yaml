  source_fidelity: Tumpak na naihahatid ang pormulang pambungad, ang perpektong diwa ng συνεσταλμένος ἐστίν, at ang matinding paghahambing na ὡς μὴ ἔχοντες. Gayunman, ang “mga may asawa” ay karaniwang sumasaklaw sa lahat ng taong kasal, samantalang ang οἱ ἔχοντες γυναῖκας ay tumutukoy sa mga lalaking may asawa/asawang babae. Maaaring panatilihin ang espesipikasyong ito nang hindi isinasalin ang γυναῖκας bilang di-likas na “mga asawang babae.”
