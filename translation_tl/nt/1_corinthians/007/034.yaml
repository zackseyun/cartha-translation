  terminology: Ang “Panginoon,” “banal,” “espiritu,” at “sanlibutan” ay pare-pareho, angkop sa rehistro ng Kasulatan, at hindi nagpapataw ng interpretasyong doktrinal. Ang “birhen” ay wastong pinananatili ang leksikal na tiyak na kahulugan ng παρθένος.
