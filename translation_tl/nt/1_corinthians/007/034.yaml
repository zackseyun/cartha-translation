id: 1CO.7.34
reference: 1 Corinthians 7:34
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀καὶ μεμέρισται. καὶ ἡ γυνὴ ⸂ἡ ἄγαμος⸃ καὶ ἡ ⸀παρθένος μεριμνᾷ τὰ τοῦ κυρίου, ἵνα ᾖ ἁγία καὶ ⸀τῷ σώματι καὶ ⸁τῷ πνεύματι· ἡ δὲ γαμήσασα μεριμνᾷ τὰ τοῦ κόσμου, πῶς ⸀ἀρέσῃ τῷ ἀνδρί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/034.yaml
  text: And she is divided. And the unmarried woman[a], that is, the virgin, is concerned about the things of the Lord, so that she may be holy both in body and in spirit. But the married woman is concerned about the things of the world, how she may please her husband.
translation:
  language: tl
  text: At nahahati siya. Ang babaeng walang asawa[a]—samakatuwid, ang birhen—ay nag-uukol ng pansin sa mga bagay ng Panginoon, upang maging banal siya kapwa sa katawan at sa espiritu. Ngunit ang babaeng may asawa ay nag-uukol ng pansin sa mga bagay ng sanlibutan, kung paano niya mapaluluguran ang kanyang asawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Ang babaeng walang asawa at ang birhen ay nag-uukol ng pansin sa mga bagay ng Panginoon.” Maaaring basahin ang Griyego bilang pagtukoy sa dalawang pangkat sa halip na bilang pagpapaliwanag na ang babaeng walang asawa ay ang birhen.
    reason: alternative_reading
lexical_decisions:
- source_word: μεμέρισται
  choice: nahahati siya
  rationale: Pinananatili nito ang pasibo at resultang diwa ng perpektong pandiwa, pati ang talinghaga ng nahahating mga interes, nang hindi ito nililimitahan sa mas interpretatibong ‘nagagambala.’
- source_word: γυνὴ ἡ ἄγαμος
  choice: ang babaeng walang asawa
  rationale: Sa paghahambing sa babaeng may asawa, malinaw at likas sa makabagong Tagalog ang ‘babaeng walang asawa.’
- source_word: παρθένος
  choice: ang birhen
  rationale: Tuwirang pinananatili ng ‘birhen’ ang tiyak na kahulugan ng salitang Griyego sa halip na palawakin ito bilang ‘dalaga.’
- source_word: γυνὴ ἡ ἄγαμος καὶ ἡ παρθένος
  choice: ang babaeng walang asawa—samakatuwid, ang birhen
  rationale: Ang appositional na pagbasa ay angkop sa isahang pandiwang μεριμνᾷ at malinaw sa Tagalog. Inilalagay sa talababa ang maaari ring koordinadong pagbasa.
- source_word: μεριμνᾷ
  choice: nag-uukol ng pansin
  rationale: Ipinahahayag nito ang nakatuong malasakit o pag-aasikaso nang hindi ipinapalagay na makasalanang pagkabalisa ang tinutukoy.
- source_word: τὰ τοῦ κυρίου
  choice: mga bagay ng Panginoon
  rationale: Pinananatili nito ang estruktural na paghahambing sa ‘mga bagay ng sanlibutan’ at ang karaniwang salin sa κύριος bilang ‘Panginoon.’
- source_word: ἵνα ᾖ ἁγία
  choice: upang maging banal siya
  rationale: Malinaw na ipinakikita ng ‘upang’ ang layunin o bunga at pinananatili ng ‘banal’ ang tahasang wika ng kabanalan.
- source_word: τῷ σώματι καὶ τῷ πνεύματι
  choice: kapwa sa katawan at sa espiritu
  rationale: Likas na ipinahahayag ng ‘kapwa ... at ...’ ang dalawang saklaw ng kabanalang binabanggit nang hindi nagpapasok ng higit na antropolohikal na paliwanag.
- source_word: ἡ δὲ γαμήσασα
  choice: ang babaeng may asawa
  rationale: Idyomatiko itong tumutukoy sa babaeng nasa kalagayang may asawa at malinaw na katapat ng ‘babaeng walang asawa.’
- source_word: τὰ τοῦ κόσμου
  choice: mga bagay ng sanlibutan
  rationale: Pinananatili nito ang paralelismo sa ‘mga bagay ng Panginoon’ nang hindi awtomatikong nagbibigay ng masamang moral na kahulugan.
- source_word: πῶς ἀρέσῃ τῷ ἀνδρί
  choice: kung paano niya mapaluluguran ang kanyang asawa
  rationale: Sa konteksto ng pag-aasawa, ang ἀνήρ ay ‘asawa,’ at natural na ipinahahayag ng ‘mapaluluguran’ ang layuning bigyang-lugod siya.
theological_decisions:
- issue: Kung ang ‘babaeng walang asawa’ at ‘birhen’ ay dalawang magkahiwalay na pangkat o ang ikalawa ay paglilinaw sa una
  choice: 'Appositional: ‘ang babaeng walang asawa—samakatuwid, ang birhen’'
  alternative: 'Koordinado: ‘ang babaeng walang asawa at ang birhen’'
  rationale: Mas sinusuportahan ng isahang pandiwa ang pinag-isang paksa, ngunit siksik at tunay na malabo ang sintaks ng Griyego. Kaya malinaw ang appositional na pagbasa sa pangunahing teksto habang pinananatili sa talababa ang koordinadong posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘nag-uukol ng pansin’ upang iwasan ang labis na negatibong dating ng ‘nag-aalala,’ at ‘sanlibutan’ upang mapanatili ang biblikal na paghahambing nang hindi maging kolokyal.
