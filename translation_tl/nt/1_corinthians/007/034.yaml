  source_fidelity: Tapat ang salin sa SBLGNT. Ang “nahahati siya” ay pinananatili ang resultative/passive na diwa ng μεμέρισται at ang pagpapatuloy nito mula sa naunang talata. Naipapahayag nang wasto ang pagkakaiba ng mga pinag-uukulan ng pansin, ang layuning “upang maging banal,” at ang saklaw na “sa katawan at sa espiritu.”
