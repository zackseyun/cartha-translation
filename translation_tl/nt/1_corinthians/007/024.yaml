id: 1CO.7.24
reference: 1 Corinthians 7:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἕκαστος ἐν ᾧ ἐκλήθη, ἀδελφοί, ἐν τούτῳ μενέτω παρὰ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/024.yaml
  text: Brothers[b][a], let each one remain with God in that condition in which he was called.
translation:
  language: tl
  text: Mga kapatid[b], manatili ang bawat isa sa piling ng Diyos[a] sa kalagayang kinaroroonan niya nang siya ay tawagin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa harap ng Diyos” o “sa presensiya ng Diyos.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mga kapatid” ay tawag dito sa buong kapulungan, kasama ang mga babae.
    reason: cultural_note
lexical_decisions:
- source_word: ἕκαστος
  choice: ang bawat isa
  rationale: Pinananatili nito ang distributibong isahan at malinaw na ikinakapit ang tagubilin sa bawat tao.
- source_word: ἐν ᾧ ... ἐν τούτῳ
  choice: sa kalagayang kinaroroonan niya
  rationale: Tumutukoy ang magkaugnay na parirala sa kalagayan o katayuan ng isang tao, ayon sa konteksto, hindi lamang sa pisikal na lugar.
- source_word: ἐκλήθη
  choice: siya ay tawagin
  rationale: Pinananatili ang balintiyak na anyo at hindi tahasang idinaragdag ang Diyos bilang gumagawa, gaya ng pagkaimpisit nito sa Griyego.
- source_word: ἀδελφοί
  choice: Mga kapatid
  rationale: Likas sa modernong Tagalog ang “mga kapatid” bilang tawag sa buong kapulungan at hindi nito kailangang limitahan ang tinutukoy sa mga lalaki.
- source_word: μενέτω
  choice: manatili
  rationale: Ang pautos na “manatili” ay nagpapahayag ng pagpapatuloy sa kasalukuyang kalagayan at umaayon sa paulit-ulit na tema ng talata.
- source_word: παρὰ θεῷ
  choice: sa piling ng Diyos
  rationale: Ipinahahayag nito ang pagiging malapit at ang pamumuhay na may kaugnayan sa Diyos, habang nananatiling bukas sa mga kahulugang “sa harap ng Diyos” at “sa presensiya ng Diyos.”
theological_decisions:
- issue: Kung tahasang babanggitin ang Diyos bilang tumawag
  choice: Panatilihin ang balintiyak na “siya ay tawagin” nang hindi idinaragdag ang “ng Diyos.”
  alternative: “siya ay tawagin ng Diyos”
  rationale: Malakas na ipinahihiwatig ng kontekstong Paulino na Diyos ang tumatawag, ngunit hindi tahasang binabanggit ang gumagawa sa Griyego.
- issue: Kung paanong isasalin ang ἀδελφοί sa isang kapulungang kinabibilangan ng mga babae
  choice: “Mga kapatid”
  alternative: “Mga kapatid na lalaki” o “mga kapatid na lalaki at babae”
  rationale: Sa Tagalog, ang “mga kapatid” ay likas na kolektibong tawag na maaaring sumaklaw sa buong kapulungan; pinananatili ng talababa ang paliwanag tungkol sa saklaw nito.
- issue: Kahulugan ng παρὰ θεῷ
  choice: “sa piling ng Diyos”
  alternative: “sa harap ng Diyos” o “sa presensiya ng Diyos”
  rationale: Maaaring magpahiwatig ang παρά na may datibo ng pagiging malapit o ng kaugnayan. Hindi dapat alisin ang siksik at bahagyang malabong diwa ng parirala.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “sa piling ng Diyos” upang maging likas sa Filipino habang pinananatili sa talababa ang mahahalagang alternatibong kahulugan. Ang ayos ng pangungusap ay bahagyang inayos para sa natural na daloy nang hindi binabago ang ugnayan ng mga parirala.
