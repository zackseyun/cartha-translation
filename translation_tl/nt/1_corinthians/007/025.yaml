source:
  edition: SBLGNT
  text: Περὶ δὲ τῶν παρθένων ἐπιταγὴν κυρίου οὐκ ἔχω, γνώμην δὲ δίδωμι ὡς ἠλεημένος ὑπὸ κυρίου πιστὸς εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/025.yaml
  text: Concerning virgins[a], I have no command from the Lord[c][b], but I give my judgment as one who by the Lord’s mercy is trustworthy.
translation:
  language: tl
  text: Tungkol naman sa mga birhen[a], wala akong utos mula sa Panginoon, ngunit nagbibigay ako ng aking pasya[b] bilang isang taong, sa awa ng Panginoon, ay mapagkakatiwalaan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga babaeng walang asawa”; sa ilang pagpapakahulugan sa konteksto, “mga birheng anak na babae.” Ang salitang Griyego ay “mga birhen.”
    reason: lexical_alternative
  - marker: b
    text: O “aking opinyon” o “aking payo.” Ipinag-iiba rito ni Pablo ang kanyang pinag-isipang pasya at ang isang tuwirang “utos mula sa Panginoon.”
    reason: alternative_reading
  - marker: c
    text: O “tapat.” Ang salitang Griyego ay maaaring mangahulugang “tapat” o “mapagkakatiwalaan/maaasahan”; sa kontekstong ito, malamang na ipinahihiwatig na maaasahang gabay si Pablo dahil sa awa ng Panginoon.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Tungkol naman sa
  rationale: Ipinakikilala nito ang panibagong paksa; likas sa modernong Tagalog ang “tungkol naman sa” at hindi ito nagdaragdag ng temporal na diwa.
- source_word: τῶν παρθένων
  choice: mga birhen
  rationale: Ang pangunahing kahulugan ng παρθένος ay birhen, karaniwang isang dalagang hindi pa nakikipagtalik. Pinananatili ng salin ang malawak na katawagan dahil pinagtatalunan ang tiyak na tinutukoy sa konteksto.
- source_word: ἐπιταγὴν κυρίου
  choice: utos mula sa Panginoon
  rationale: Ang ἐπιταγή ay utos o direktiba. Nililinaw ng “mula sa Panginoon” ang pinagmulan ng utos nang hindi nagpapahiwatig na walang awtoridad ang kasunod na pasya ni Pablo.
- source_word: γνώμην δὲ δίδωμι
  choice: ngunit ibinibigay ko ang aking pasya
  rationale: Ang γνώμη ay isang pinag-isipang pasya o pananaw, na ikinokontra rito sa isang tuwirang utos. Tapat din ang “ibinibigay ko” sa payak na present tense ng δίδωμι.
- source_word: ὡς ἠλεημένος ὑπὸ κυρίου
  choice: bilang isang taong, dahil sa awa ng Panginoon
  rationale: Ipinahahayag ng perfect passive participle na tumanggap si Pablo ng awa mula sa Panginoon. Ang “dahil sa awa” ay natural sa Tagalog at pinananatiling ang pagiging mapagkakatiwalaan niya ay bunga ng awang iyon.
- source_word: πιστὸς εἶναι
  choice: ay mapagkakatiwalaan
  rationale: Maaaring mangahulugan ang πιστός ng “tapat” o “mapagkakatiwalaan.” Sa kontekstong nagbibigay si Pablo ng pasya, malinaw na naipapahayag ng “mapagkakatiwalaan” ang pagiging maaasahan niya bilang tagapayo, habang itinatala sa talababa ang tunay na alternatibo.
theological_decisions:
- issue: Ang uri ng awtoridad ng pasya ni Pablo kung ihahambing sa isang utos mula sa Panginoon
  choice: Ipinakikita ng salin na walang ibinibigay si Pablo na tuwirang utos mula sa Panginoon tungkol sa usaping ito, ngunit nagbibigay siya ng pinag-isipang pasya bilang isang taong ginawang mapagkakatiwalaan sa awa ng Panginoon.
  alternative: Maaaring unawain na pribadong opinyon lamang ito na walang awtoridad, o na di-tuwirang tinutukoy ni Pablo ang isang hindi naitalang utos ni Jesus.
  rationale: Pinananatili ng pagkakaiba ng “utos” at “pasya” ang tensiyon sa pagitan ng kawalan ng tuwirang utos ng Panginoon at ng kredibilidad ng hatol ni Pablo. Hindi pinabababa ang kanyang sinabi bilang pansariling haka lamang at hindi rin ito itinataas bilang tuwirang utos ni Jesus.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “birhen,” “pasya,” at “mapagkakatiwalaan” bilang karaniwang salitang tumpak sa konteksto. Ang ayos ng sugnay ay nagpapanatili sa ugnayang lohikal ng Griyego nang hindi nagiging matigas o makaluma.
