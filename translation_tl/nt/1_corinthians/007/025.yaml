  rationale: 'Maliit lamang ang mga pagbabago: inayos ang daloy ng pangunahing pangungusap at ang idiomatikong pagpapahayag ng kaugnayan ng awa ng Panginoon sa pagiging mapagkakatiwalaan ni Pablo. Inayos din ang dalawang talababa para sa likas na modernong Tagalog at upang mas tumpak na maipakita ang mga alternatibong pagbasa nang hindi nililimitahan ang pangunahing salin.'
