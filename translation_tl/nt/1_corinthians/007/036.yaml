id: 1CO.7.36
reference: 1 Corinthians 7:36
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Εἰ δέ τις ἀσχημονεῖν ἐπὶ τὴν παρθένον αὐτοῦ νομίζει ἐὰν ᾖ ὑπέρακμος, καὶ οὕτως ὀφείλει γίνεσθαι, ὃ θέλει ποιείτω· οὐχ ἁμαρτάνει· γαμείτωσαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/036.yaml
  text: But if anyone thinks he is behaving improperly toward his virgin[a], if she is past her youth and it ought to be so, let him do what he wants; he is not sinning. Let them marry.
translation:
  language: tl
  text: Ngunit kung iniisip ng sinuman na hindi siya kumikilos nang nararapat sa birhen niya[a], kung lampas na sa kasibulan ang babae at nararapat na mangyari iyon, gawin niya ang nais niya. Hindi siya nagkakasala. Magpakasal sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa birhen niyang katipan”; ayon sa isa pang tradisyonal na pagkaunawa, “sa anak niyang dalaga.” Malabo sa Griyego ang eksaktong kaugnayan.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσχημονεῖν
  choice: hindi kumikilos nang nararapat
  rationale: Likas at malinaw na Filipino para sa pagkilos na hindi angkop o marangal, nang hindi pinalalabis bilang tahasang kahalayan.
- source_word: ἐπὶ τὴν παρθένον αὐτοῦ
  choice: sa birhen niya[a]
  rationale: Pinananatili ang literal na diwa ng παρθένος at ang tunay na kalabuan ng kaugnayan ng babae sa lalaki; nililinaw sa talababa ang mga pangunahing pagbasa.
- source_word: ὑπέρακμος
  choice: lampas na sa kasibulan
  rationale: Ipinahahayag ang pagiging lampas sa rurok o kasibulan ng kabataan nang hindi nagtatakda ng tiyak na modernong edad para sa pag-aasawa.
- source_word: καὶ οὕτως ὀφείλει γίνεσθαι
  choice: at nararapat na mangyari iyon
  rationale: Pinananatili ang pangkalahatan at hindi tiyak na pananalita ng Griyego tungkol sa nararapat o kinakailangang mangyari.
- source_word: ὃ θέλει ποιείτω
  choice: gawin niya ang nais niya
  rationale: Natural na pahintulot sa Filipino na pinananatili ang lakas ng pautos na anyo.
- source_word: οὐχ ἁμαρτάνει
  choice: Hindi siya nagkakasala
  rationale: Direktang ipinahahayag ang moral na pahintulot ng teksto.
- source_word: γαμείτωσαν
  choice: Magpakasal sila
  rationale: Pinananatili ang pangmaramihang pautos at malinaw na tumutukoy sa pag-aasawa ng dalawang panig.
theological_decisions:
- issue: Pagkakakilanlan ng “birhen niya” (παρθένον αὐτοῦ)
  choice: Pinananatili sa pangunahing teksto ang kalabuan sa pamamagitan ng “birhen niya.”
  alternative: Maaari itong tumukoy sa kanyang kasintahan o babaeng katipan, o sa kanyang anak na dalaga na nasa kanyang pangangalaga.
  rationale: Hindi tahasang tinutukoy ng Griyego ang relasyon, at kapwa may matagal nang batayan sa pagbasa ng talata ang dalawang pagpapakahulugan. Hindi dapat tahimik na piliin ng salin ang isa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ang “birhen niya” ay bahagyang di-karaniwan ngunit sinadyang panatilihin upang huwag lutasin ang kalabuan ng Griyego; ang talababa ang nagbibigay ng mga likas na alternatibo.
