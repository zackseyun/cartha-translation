  text: But I say this as a concession[a], not as a command.
translation:
  language: tl
  text: Ngunit sinasabi ko ito bilang isang pahintulot[a], hindi bilang utos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bilang pagbibigay-luwag” o “bilang konsesyon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: ito
  rationale: Pinananatili ng panghalip na “ito” ang likas na pagtukoy sa kaugnay na pahayag sa konteksto nang hindi ipinapasiya kung ang diin ay pabalik o pasulong.
- source_word: δὲ
  choice: Ngunit
  rationale: 'Ipinahihiwatig ng δέ ang banayad na pagsalungat: ang sinasabi ay isang pagpapahintulot, hindi isang utos.'
- source_word: λέγω
  choice: sinasabi ko
  rationale: Natural na kasalukuyang anyo ito sa modernong Filipino at tuwirang tumutugma sa present indicative.
- source_word: κατὰ συγγνώμην
  choice: bilang pagpapahintulot
  rationale: Ipinakikita ng parirala na ang pahayag ay nagpapahintulot sa halip na nag-uutos. Malinaw ito sa karaniwang mambabasa at hindi ipinagkakamali sa “kapatawaran.”
- source_word: οὐ κατ’ ἐπιταγήν
  choice: hindi bilang utos
  rationale: Tuwirang pinananatili nito ang pagsalungat sa pagitan ng pinahihintulutang kaluwagan at ng may-bisang utos.
theological_decisions:
- issue: Kung ang pahayag ni Pablo ay pahintulot lamang o isang di-tahasang utos na may mas mababang antas
  choice: Malinaw na inilalarawan ni Pablo ang pahayag bilang pagpapahintulot, hindi bilang utos.
  alternative: Maaaring ituring itong payong taglay pa rin ang di-tahasang apostolikong awtoridad.
  rationale: Tahasang pinaghahambing ng Griyego ang συγγνώμη at ἐπιταγή. Pinananatili ng salin ang kaibhang iyon nang hindi nagpapasiya nang higit sa sinasabi ng talata tungkol sa saklaw ng awtoridad ni Pablo.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Pinili ang “pagpapahintulot” upang ihatid ang permissive na diwa ng συγγνώμη at maiwasan ang karaniwang kahulugan ng “kapatawaran.”
