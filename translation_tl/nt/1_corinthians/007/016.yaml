revisions:
- from: Sapagkat paano mo nalalaman, asawang babae, kung ililigtas mo ang iyong asawa? O paano mo nalalaman, asawang lalaki, kung ililigtas mo ang iyong asawa?[a]
  to: Sapagkat paano mo malalaman, babae, kung maililigtas mo ang iyong asawa? O paano mo malalaman, lalaki, kung maililigtas mo ang iyong asawa?[a]
