  terminology: Ang “maililigtas” ay angkop at pinananatili ang σῴζω nang walang interpretatibong pagpapaliit sa pag-akay sa pananampalataya o pagpapanatili ng pagsasama. Ang “iyong asawa” ay natural na katumbas ng mga layong “iyong asawa” sa magkabilang sugnay; natutukoy ang kasarian ng asawa mula sa kasarian ng kausap at sa paralelismo.
