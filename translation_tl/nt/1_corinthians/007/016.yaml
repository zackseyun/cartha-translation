base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/016.yaml
  text: For how do you know[a], wife, whether you will save your husband? Or how do you know, husband, whether you will save your wife?
translation:
  language: tl
  text: Sapagkat paano mo malalaman, babae, kung maililigtas mo ang iyong asawa? O paano mo malalaman, lalaki, kung maililigtas mo ang iyong asawa?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin nang mas malapit sa anyo ng Griyego: “paano mo malalaman ... kung ililigtas mo ...?” Ang Griyego ay gumagamit ng pandiwang nasa anyong panghinaharap (“ililigtas”) sa isang di-tuwirang tanong; ipinahihiwatig ng “kung maililigtas mo” ang posibilidad na saklaw ng tanong, hindi ang tiyak na hula.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ οἶδας
  choice: Sapagkat paano mo nalalaman
  rationale: Ang τί kasama ng οἶδας sa retorikal na tanong ay likas na ipinapahayag sa Tagalog bilang “paano mo nalalaman,” habang pinananatili ng “sapagkat” ang nagpapaliwanag na puwersa ng γάρ.
- source_word: γύναι
  choice: asawang babae
  rationale: Bagaman maaaring mangahulugang “babae” o “asawang babae,” malinaw na pag-aasawa ang konteksto; tinutukoy rin ng anyong pantawag ang mismong asawa.
- source_word: ἄνερ
  choice: asawang lalaki
  rationale: Sa konteksto ng pag-aasawa, ang pantawag na ἄνερ ay tumutukoy sa asawang lalaki, hindi lamang sa isang lalaki.
- source_word: σώσεις
  choice: ililigtas mo
  rationale: Pinananatili nito ang anyong panghinaharap ng Griyego at ang malakas na diwang pangkaligtasan ng σῴζω, nang hindi ito pinapaliit sa pagpapanatili lamang ng pagsasama.
- source_word: τὸν ἄνδρα / τὴν γυναῖκα
  choice: ang iyong asawa
  rationale: Likas sa Tagalog ang tahasang paari; ang “asawa” ay angkop sa parehong kasarian sapagkat nililinaw na ng tuwirang pagtawag kung sino ang kinakausap.
- source_word: ἢ
  choice: O
  rationale: Pinananatili nito ang payak na pag-uugnay ng dalawang magkatulad na retorikal na tanong.
theological_decisions:
- issue: Kahulugan ng “ililigtas” sa konteksto ng pag-aasawa
  choice: Panatilihin ang “ililigtas” at hayaang manatili ang diwang pangkaligtasan nito.
  alternative: “maaakay sa pananampalataya” o “mapananatili ang inyong pagsasama”
  rationale: Karaniwang may bigat na pangkaligtasan ang σῴζω sa gamit ni Pablo. Hindi dapat paliitin ng salin ang kahulugan nito o lutasin ang teolohikal na tensiyon sa pamamagitan ng paliwanag na wala mismo sa teksto.
- issue: Puwersa ng hinaharap na σώσεις sa di-tuwirang tanong na may εἰ
  choice: “kung ililigtas mo”
  alternative: “kung maaari mong mailigtas”
  rationale: Pinananatili ng napiling anyo ang hinaharap na pandiwa ng Griyego, ngunit sa saklaw ng “kung” ay hindi ito tiyak na hula; nananatili itong posibilidad na itinatanong.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “asawang babae” at “asawang lalaki” sa tuwirang pagtawag upang malinaw ang kasarian ng kausap, ngunit “iyong asawa” sa layon upang manatiling natural at maiwasan ang mabigat na pag-uulit.
