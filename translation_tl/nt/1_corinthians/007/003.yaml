translation:
  language: tl
  text: Dapat ibigay ng asawang lalaki sa kanyang asawa ang nararapat sa kanya bilang asawa[a], at gayundin ng asawang babae sa kanyang asawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang tungkuling dapat tuparin sa kanya.” Mas literal, “ang utang” o “ang obligasyong dapat bayaran.” Sa konteksto, tumutukoy ito sa pananagutang magkatuwang na taglay ng mag-asawa sa isa’t isa sa kanilang ugnayang seksuwal.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυναικί / γυνή
  choice: asawa / babae
  rationale: Sa konteksto ng pag-aasawa, tumutukoy ang γυνή sa asawang babae. Ginamit ang “asawa” sa unang sugnay para luminaw ang ugnayan, at “babae” sa ikalawa upang mapanatili ang tahasang pagkakaiba at balanseng ayos ng Griyego.
- source_word: ἀνήρ / ἀνδρί
  choice: lalaki / asawa
  rationale: Sa konteksto, ang ἀνήρ ay asawang lalaki. Ang “lalaki” sa unang sugnay at “asawa” sa ikalawa ay likas sa Filipino at pinananatili ang magkatumbas na pananagutan.
- source_word: ὀφειλήν
  choice: ang nararapat dito bilang asawa
  rationale: Ang ὀφειλή ay literal na utang o obligasyong dapat ibigay. Ipinahahayag ng salin ang kontekstong pangmag-asawa nang hindi ginagawang mas tiyak kaysa sa mismong pangngalan.
- source_word: ἀποδιδότω
  choice: dapat ibigay
  rationale: Ipinakikita nito ang puwersa ng pautos at ang ideya ng pagbibigay ng isang bagay na nararapat o dapat tupdin.
- source_word: ὁμοίως δὲ καὶ
  choice: at gayundin
  rationale: Malinaw nitong ipinahahayag ang kapwa at magkatumbas na obligasyon ng mag-asawa.
theological_decisions:
- issue: Antas ng pagiging tahasan sa kahulugan ng ὀφειλή
  choice: “ang nararapat dito bilang asawa” sa pangunahing teksto
  alternative: “tungkulin bilang asawa” o “utang na dapat ibigay”
  rationale: Ipinahihiwatig ng kalapit na konteksto ang ugnayang seksuwal ng mag-asawa, ngunit mas malawak ang mismong salitang ὀφειλή. Pinananatili ng salin ang kontekstuwal na diwa at ang katumbasan ng pananagutan nang hindi ito labis na nililimitahan.
translation_notes:
  register: Modernong Filipino na natural at marangal. Iniwasan ang sobrang teknikal na “konjugal” at ang posibleng malabong “karapatan,” habang pinanatili ang simetriko at kapwa pananagutan ng lalaki at babae.
