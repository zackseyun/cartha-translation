base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/017.yaml
  text: Only[a], as the Lord has assigned to each one, as God has called each one, so let him walk[b]. And so I direct in all the churches.
translation:
  language: tl
  text: Ngunit[a] mamuhay ang bawat isa ayon sa itinakda ng Panginoon para sa kanya, ayon sa pagkatawag sa kanya ng Diyos. At ganito ang itinatagubilin ko sa lahat ng mga iglesya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Gayunman,” “Kaya lamang,” o “Maliban lamang.” Dito, ang pariralang Griyego ay nagpapakilala ng pangkalahatang tuntunin matapos ang naunang talakayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ μὴ
  choice: Gayunman
  rationale: Sa daloy ng talata, idiomatikong panandang pasalungat o panlipat ito, hindi literal na kondisyon na “kung hindi.” Likas sa makabagong Tagalog ang “Gayunman” at malinaw nitong ipinapasok ang pangkalahatang tuntunin ni Pablo.
- source_word: ἑκάστῳ / ἕκαστον
  choice: sa bawat isa / ang bawat isa
  rationale: Pinananatili ang distributibong diin ng dalawang paglitaw ng ἕκαστος hangga't natural sa Tagalog.
- source_word: ἐμέρισεν
  choice: itinalaga
  rationale: Ipinahihiwatig ng pandiwa ang bahaging ibinahagi o itinakda ng Panginoon sa bawat tao. Ang “itinalaga” ay natural at marangal, samantalang inilalahad sa talababa ang ibang posibleng diwa.
- source_word: ὁ κύριος
  choice: Panginoon
  rationale: Karaniwang salin ng κύριος bilang titulong tumutukoy sa Panginoon.
- source_word: κέκληκεν
  choice: pagkatawag sa kanya
  rationale: Ipinapahayag ng anyong pangngalan ang naganap na pagtawag na may patuloy na kaugnayan sa kasalukuyang pamumuhay, nang hindi tahasang nililimitahan ang uri o kalagayan ng pagtawag.
- source_word: ὁ θεός
  choice: Diyos
  rationale: Karaniwan at malinaw na salin ng θεός.
- source_word: οὕτως
  choice: ganito
  rationale: Pinananatili ang diwa ng “sa ganitong paraan,” lalo na sa pangwakas na pahayag tungkol sa tagubilin sa mga iglesya.
- source_word: περιπατείτω
  choice: mamuhay
  rationale: Ang literal na “lumakad” ay metapora para sa paraan ng pamumuhay. Mas tuwiran at likas sa ordinaryong makabagong Tagalog ang “mamuhay,” habang pinananatili sa talababa ang larawan ng orihinal.
- source_word: διατάσσομαι
  choice: itinatagubilin ko
  rationale: Ipinahahayag nito ang may-awtoridad na pag-uutos o pagsasaayos ni Pablo nang hindi nagbibigay ng labis na marahas na tono.
- source_word: ἐν ταῖς ἐκκλησίαις πάσαις
  choice: sa lahat ng iglesya
  rationale: Sa kontekstong Paulino, tumutukoy ang ἐκκλησίαι sa mga lokal na pamayanang Kristiyano; malinaw at nakagawian ang “mga iglesya.”
theological_decisions:
- issue: Pagkakaiba ng “Panginoon” at “Diyos”
  choice: 'Panatilihing magkahiwalay ang dalawang katawagan: “itinalaga ... ng Panginoon” at “pagkatawag ... ng Diyos.”'
  alternative: Ituring ang dalawang katawagan bilang estilistikong pagkakaiba lamang at pagsamahin ang tinutukoy.
  rationale: Magkaibang katawagan ang sadyang ginamit sa magkatabing parirala ng Griyego. Hindi ito pinag-isa ng salin upang hindi lutasin ang isang pagkakaibang iniwan ng teksto.
- issue: Kaugnayan ng banal na pagtawag sa kalagayan ng bawat isa
  choice: “ayon sa pagkatawag sa kanya ng Diyos”
  alternative: “ayon sa kalagayan niya nang tawagin siya ng Diyos”
  rationale: Hindi tahasang binabanggit ng Griyego ang “kalagayan.” Pinananatili ng napiling salin ang mas malawak na ugnayan ng pagtawag at pamumuhay sa halip na idagdag ang isang tiyak na interpretasyon.
- issue: Metapora ng περιπατείτω
  choice: Isalin sa likas na Tagalog bilang “mamuhay,” na may talababa sa literal na “lumakad.”
  alternative: Panatilihin sa pangunahing teksto ang “lumakad.”
  rationale: Sa Tagalog, maaaring mapagkamalang pisikal na paglakad ang utos kung walang paliwanag. Naipararating ng “mamuhay” ang malinaw na etikong diwa, habang hindi itinatago ng talababa ang metapora.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mamuhay” para sa agarang pagkaunawa ng karaniwang mambabasa, ngunit inilagay sa talababa ang literal na metapora. Iniwasan ang pagdaragdag ng “kalagayan” upang mapanatili ang lawak at bahagyang kalabuan ng pariralang Griyego.
