    rationale: Pangmaramihan ang Griyegong ταῖς ἐκκλησίαις πάσαις (“sa lahat ng mga iglesya”). Bagaman maaaring magkaroon ng pangkalahatang gamit ang isahan sa Tagalog, ang pagdaragdag ng “mga” ay malinaw na pinananatili ang bilang ng pinagmulan.
