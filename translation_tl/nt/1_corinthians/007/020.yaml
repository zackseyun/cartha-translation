translation:
  language: tl
  text: Ang bawat isa ay manatili sa pagkatawag na kinaroroonan niya nang siya ay tawagin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kalagayan,” “katayuan,” o “katayuan sa buhay.” Sa Griyego, “pagkatawag” ang salita, na inuugnay sa “tawagin” sa talatang ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: ang bawat isa
  rationale: 'Pinananatili nito ang distributibong diwa ng isahan: isa-isang iniuukol ang tagubilin sa bawat mananampalataya.'
- source_word: κλήσει
  choice: pagkatawag
  rationale: Pinananatili ang pangunahing kahulugang “calling” at ang pag-uugnay nito sa ἐκλήθη (“tinawag”), sa halip na ipakahulugan agad bilang kalagayan o katayuan sa buhay.
- source_word: ᾗ ἐκλήθη
  choice: kung saan siya tinawag
  rationale: Inilalarawan ang pagkatawag bilang larangang kinaroroonan nang tawagin ang tao, at pinananatili ang passive na “tinawag” nang hindi tahasang idinaragdag kung sino ang tumawag.
- source_word: μενέτω
  choice: ay manatili
  rationale: Likas at marangal na pautos sa Filipino na nagpapahiwatig ng pagpapatuloy sa kasalukuyang kalagayan.
theological_decisions:
- issue: Kahulugan ng κλῆσις sa konteksto
  choice: Panatilihin ang “pagkatawag” sa pangunahing teksto.
  alternative: “kalagayan,” “katayuan,” o “katayuan sa buhay”
  rationale: Ang konteksto ay tumutukoy sa mga kalagayang panlipunan at pansarili, ngunit sadyang magkaugnay sa Griyego ang κλήσει at ἐκλήθη. Pinananatili ng salin ang tensiyon sa pagitan ng tawag ng Diyos at ng kalagayan ng tao nang siya ay tawagin.
- issue: Kinatawang panlalaking isahan sa Griyego
  choice: Gamitin ang likas na neutral-sa-kasariang “siya” sa Filipino.
  alternative: Tahasan ang kasarian sa pamamagitan ng “lalaki” o “babae”
  rationale: Walang gramatikal na kasarian ang panghalip na “siya”; likas nitong naipatutupad ang tagubilin sa bawat mananampalataya nang hindi binabago ang isahang anyo.
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Pinanatili ang bahagyang di-karaniwang pariralang “pagkatawag kung saan” upang hindi mawala ang pag-uulit at sadyang tensiyon ng Griyegong κλήσει/ἐκλήθη; ipinaliliwanag sa talababa ang mas kontekstuwal na mga kahulugan.
