id: 1CO.7.32
reference: 1 Corinthians 7:32
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Θέλω δὲ ὑμᾶς ἀμερίμνους εἶναι. ὁ ἄγαμος μεριμνᾷ τὰ τοῦ κυρίου, πῶς ⸀ἀρέσῃ τῷ κυρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/032.yaml
  text: But I want you to be free from anxieties. The unmarried man is concerned with the things of the Lord[a], how he may please the Lord;
translation:
  language: tl
  text: Ngunit nais kong maging malaya kayo sa mga alalahanin. Ang lalaking walang asawa[a] ay nagmamalasakit sa mga bagay ng Panginoon—kung paano niya mabibigyang-lugod ang Panginoon;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Ang taong walang asawa.” Panlalaking isahan ang Griyego (“ang lalaking walang asawa”), bagaman mas malawak na tinatalakay ni Pablo sa konteksto ang mga kalagayan ng mga walang asawa at may asawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Θέλω δὲ
  choice: Ngunit nais kong
  rationale: Ang θέλω ay nagpapahayag ng pagnanais, at ang δέ ay banayad na panalungat o transisyon. Ang “Ngunit” ay angkop sa kaugnayan nito sa naunang talakayan.
- source_word: ὑμᾶς ἀμερίμνους εἶναι
  choice: maging malaya kayo sa mga alalahanin
  rationale: Ipinahihiwatig ng ἀμέριμνος ang pagiging walang balisa o labis na alalahanin. Natural sa modernong Filipino ang pariralang ito at hindi nito ipinahihiwatig ang kawalan ng malasakit.
- source_word: ὁ ἄγαμος
  choice: Ang lalaking walang asawa
  rationale: Ang Griyego ay panlalaking isahan. Pinananatili ng salin ang anyong iyon, lalo na't magkahiwalay na tinatalakay ni Pablo ang kalagayan ng lalaki at babae sa mga kasunod na talata.
- source_word: μεριμνᾷ
  choice: ay nagmamalasakit sa
  rationale: Maaaring mangahulugan ang pandiwa ng pagiging balisa o ng pag-uukol ng malasakit. Dito, positibo ang layon—ang mga bagay ng Panginoon—kaya ang “nagmamalasakit” ay natural at pinananatili ang semantikong ugnayan sa naunang “mga alalahanin.”
- source_word: τὰ τοῦ κυρίου
  choice: mga bagay ng Panginoon
  rationale: Malawak ang idyomang Griyego at tumutukoy sa mga bagay na nauukol sa Panginoon. Pinananatili ng salin ang lawak nito sa halip na paliitin sa isang tiyak na uri ng gawain.
- source_word: κυρίου / κυρίῳ
  choice: Panginoon
  rationale: Ang “Panginoon” ang karaniwang salin ng κύριος bilang titulong Kristiyano at pinananatili nito ang leksikal at teolohikal na bigat ng salita.
- source_word: πῶς ἀρέσῃ τῷ κυρίῳ
  choice: kung paano niya mabibigyang-lugod ang Panginoon
  rationale: Ang πῶς ay nagpapakilala sa paraan o layuning pinag-uukulan ng malasakit. Ang “mabibigyang-lugod” ay likas na Filipino at naipapahayag ang contemplated action ng subjunctive ἀρέσῃ.
theological_decisions:
- issue: Panlalaking isahang pagtukoy sa paghahambing ni Pablo sa mga walang asawa at may asawa
  choice: 'Pinanatili sa pangunahing teksto ang panlalaking isahan: “Ang lalaking walang asawa.”'
  alternative: “Ang taong walang asawa” o “Ang walang asawa.”
  rationale: Panlalaking isahan ang anyong Griyego, at sa mga karatig na talata ay magkahiwalay na tinatalakay ni Pablo ang mga kalagayan ng lalaki at babae. Nililinaw sa talababa na mas malawak ang konteksto nang hindi ginagawang neutral ang anyo ng mismong talata.
translation_notes:
  register: Modernong Filipino na may marangal at malinaw na himig. Ginamit ang “malaya sa mga alalahanin” upang iwasan ang impresyong hinihingi ni Pablo ang ganap na kawalan ng malasakit, at “nagmamalasakit” upang maipakita ang positibong pag-uukol ng pansin sa mga bagay ng Panginoon. Ang gatlang bago ang huling sugnay ay nagpapalinaw na ipinaliliwanag nito ang anyo o layon ng malasakit.
