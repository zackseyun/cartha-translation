base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/008.yaml
  text: 'I say to the unmarried and to the widows: it is good for them if they remain as I am[a][b].'
translation:
  language: tl
  text: 'Sinasabi ko naman sa mga walang asawa[a] at sa mga biyuda: mabuti para sa kanila kung mananatili silang tulad ko[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga lalaking walang asawa,” sapagkat panlalaking maramihan ang anyong Griyego; maaari ring kumatawan ang panlalaking anyo sa mas malawak na pangkat ayon sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: Literal na “tulad ko rin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω δὲ
  choice: Sinasabi ko naman
  rationale: Ang δέ ay banayad na pang-ugnay o pananda ng paglipat, at likas itong naipapahayag sa Filipino sa pamamagitan ng “naman” nang hindi pinalalakas bilang tahasang pagsalungat.
- source_word: τοῖς ἀγάμοις
  choice: sa mga walang asawa
  rationale: Ang ἄγαμος ay tumutukoy sa taong walang asawa. Bagaman panlalaking maramihan ang anyong Griyego, maaaring kumatawan ito sa mas malawak na pangkat ayon sa konteksto; pinananatili sa talababa ang posibleng mas tiyak na pagbasa.
- source_word: ταῖς χήραις
  choice: sa mga biyuda
  rationale: Tiyak na tumutukoy ang χήρα sa babaeng namatayan ng asawa; karaniwan at malinaw sa makabagong Filipino ang “biyuda.”
- source_word: καλὸν αὐτοῖς
  choice: mabuti para sa kanila
  rationale: Ipinahahayag ng καλόν ang pagiging mabuti, angkop, o kapuri-puri, hindi ang tahasang paghahambing na “mas mabuti.” Ang datibong αὐτοῖς ay likas na isinasaling “para sa kanila.”
- source_word: ἐὰν μείνωσιν
  choice: kung mananatili sila
  rationale: Pinananatili ng “kung” ang kondisyunal na ἐάν, at ipinahahayag ng “mananatili” ang pagpapatuloy sa kasalukuyang kalagayang walang asawa.
- source_word: ὡς κἀγώ
  choice: gaya ko
  rationale: Likas at malinaw sa Filipino ang “gaya ko” bilang pagtukoy ni Pablo sa sarili niyang kalagayan. Ang dagdag na diwa ng καί sa κἀγώ ay itinatala sa talababa.
theological_decisions:
- issue: Saklaw ng τοῖς ἀγάμοις kaugnay ng mga biyuda
  choice: Isinalin bilang “mga walang asawa,” na maaaring maging mas malawak na pangkat, habang hiwalay pa ring binabanggit ang mga biyuda.
  alternative: “mga lalaking walang asawa”
  rationale: Panlalaking maramihan ang anyong Griyego at maaaring tumukoy nang tiyak sa mga lalaki, ngunit maaari rin itong gamitin bilang katawagang kumakatawan sa mas malawak na pangkat. Hindi nilulutas nang tahimik ang kalabuan; inilalahad ang mas tiyak na posibilidad sa talababa.
- issue: Lakas ng καλὸν sa payo ni Pablo
  choice: “mabuti”
  alternative: “mas mabuti” o “nararapat”
  rationale: Walang anyong pahambing sa Griyego. Iniiwasan ng “mabuti” ang pagdaragdag ng mas malakas na paghahambing o ganap na obligasyong moral na hindi tahasang sinasabi ng teksto.
- issue: Kalagayang tinutukoy ng “gaya ko”
  choice: Iniwan ang maikli at pahiwatig na pananalita ni Pablo bilang “gaya ko.”
  alternative: “na manatiling walang asawa gaya ko”
  rationale: Malinaw sa konteksto ang tinutukoy, ngunit ang tahasang pagdaragdag ng “walang asawa” sa hulihan ay higit sa mismong mga salita ng talata. Pinananatili ng salin ang pagiging maikli ng orihinal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang “biyuda” sa halip na mas mabigat na pariralang “mga babaeng balo,” at ang “naman” bilang likas na banayad na panandang diskurso. Inilagay ang lahat ng pananda ng talababa sa mismong teksto.
