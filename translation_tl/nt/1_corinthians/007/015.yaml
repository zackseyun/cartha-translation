reference: 1 Corinthians 7:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰ δὲ ὁ ἄπιστος χωρίζεται, χωριζέσθω· οὐ δεδούλωται ὁ ἀδελφὸς ἢ ἡ ἀδελφὴ ἐν τοῖς τοιούτοις, ἐν δὲ εἰρήνῃ κέκληκεν ⸀ἡμᾶς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/015.yaml
  text: But if the unbeliever separates[a], let him separate. The brother or the sister is not enslaved in such cases[c][b], but God has called us in peace.
translation:
  language: tl
  text: Ngunit kung nakikipaghiwalay ang hindi mananampalataya[a], hayaan siyang makipaghiwalay. Ang kapatid na lalaki o ang kapatid na babae ay hindi naalipin[b] sa ganitong mga kalagayan; ngunit tinawag tayo[c] ng Diyos sa kapayapaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang asawang hindi mananampalataya.” Sa konteksto, ito ang tinutukoy.
    reason: lexical_alternative
  - marker: b
    text: O, “hindi nakatali.” Ang pandiwang Griyego ay mula sa δουλόω (“um-alipin” o “gawing alipin”), hindi sa mas karaniwang pandiwa para sa “gumapos” o “magtali.”
    reason: lexical_alternative
  - marker: c
    text: Sa ilang manuskrito, “kayo” sa halip na “tayo.”
    reason: textual_variant
lexical_decisions:
- source_word: ὁ ἄπιστος
  choice: ang hindi sumasampalataya
  rationale: Likas at substantibong parirala ito sa Tagalog. Sa konteksto, tumutukoy ito sa asawang hindi sumasampalataya, ngunit hindi idinagdag ang “asawa” sa pangunahing teksto upang mapanatili ang paraan ng pagkakasabi sa Griyego.
- source_word: χωρίζεται / χωριζέσθω
  choice: nakikipaghiwalay / hayaan siyang makipaghiwalay
  rationale: Pinananatili ang pag-uulit ng iisang pandiwa at hindi tinutukoy kung legal na diborsiyo o aktuwal na pag-alis lamang ang nasasangkot. Ipinahihiwatig ng pautos na anyo ang pagpapahintulot sa paghihiwalay, hindi ang pag-uutos na magdiborsiyo.
- source_word: οὐ δεδούλωται
  choice: hindi inalipin
  rationale: Ang δουλόω ay “um-alipin” o “gawing alipin,” hindi ang karaniwang pandiwa para sa “gumapos.” Ang anyong ito ay nananatiling malapit sa leksikal na lakas ng Griyego at hindi ginagawang tahasang pasiya tungkol sa muling pag-aasawa.
- source_word: ὁ ἀδελφὸς ἢ ἡ ἀδελφὴ
  choice: ang kapatid na lalaki o kapatid na babae
  rationale: Pinananatili ang tahasang pagbanggit sa kapatid na lalaki at babae bilang kapuwa mananampalataya, sa halip na palitan ang mga ito ng kontekstuwal ngunit interpretibong “asawang lalaki o asawang babae.”
- source_word: ἐν τοῖς τοιούτοις
  choice: sa ganitong mga kalagayan
  rationale: Natural na Tagalog ito para sa idyomatikong pariralang tumutukoy sa mga sitwasyong gaya ng inilalarawan sa talata.
- source_word: ἐν δὲ εἰρήνῃ
  choice: Sa halip, ... sa kapayapaan
  rationale: Pinananatili ng “sa kapayapaan” ang posibleng diwa ng saklaw o kalagayan ng pagtawag ng Diyos, samantalang ipinakikita ng “Sa halip” ang kontrast na dala ng δέ.
- source_word: κέκληκεν ἡμᾶς ὁ θεός
  choice: tinawag tayo ng Diyos
  rationale: Malinaw at likas na Tagalog ito para sa perpektong pandiwa at sa SBLGNT na pagbasa na ἡμᾶς, “tayo/us.”
theological_decisions:
- issue: Saklaw ng “hindi inalipin” kaugnay ng pagkalas ng kasal at muling pag-aasawa
  choice: Isinalin nang leksikal bilang “hindi inalipin” nang hindi ipinapasiya ang buong saklaw ng kalayaang tinutukoy.
  alternative: “Hindi nakatali,” na maaaring unawain bilang teknikal na pahintulot na muling mag-asawa, o bilang kalayaan lamang mula sa sapilitang paghabol sa lumalayong asawa.
  rationale: Hindi tahasang ipinaliliwanag ng talata ang lahat ng implikasyon ng kalayaang ito. Ang malapit na salin sa δουλόω ay nagpapanatili sa teolohikal na tensiyon at umiiwas sa pagpasok ng isang denominasyonal na konklusyon.
- issue: Tinutukoy ng ὁ ἄπιστος
  choice: Ginamit ang pangkalahatang “ang hindi sumasampalataya,” na sa konteksto ay ang asawang hindi sumasampalataya.
  alternative: Tahasan itong isalin na “ang asawang hindi sumasampalataya.”
  rationale: Malinaw sa konteksto ng pag-aasawa kung sino ang tinutukoy, ngunit hindi tahasang kasama sa pariralang Griyego ang salitang “asawa.”
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nakikipaghiwalay” upang mapanatili ang di-tiyak na saklaw ng χωρίζω at ang pag-uulit nito; ginamit ang “siya” upang hindi magdagdag ng kasariang hindi kinakailangan sa Tagalog. Ang “hindi inalipin” ay sadyang mas tuwiran kaysa tradisyonal na “hindi nakatali” dahil iyon ang pandiwang nasa Griyego.
