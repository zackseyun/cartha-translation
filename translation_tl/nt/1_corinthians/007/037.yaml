  to: Ngunit ang taong matatag ang paninindigan sa kanyang puso, na hindi napipilitan[a] kundi may kapangyarihan sa sarili niyang kalooban, at ipinasiya ito sa kanyang sariling puso—na panatilihin ang sarili niyang birheng dalaga[b]—ay mabuti ang gagawin niya.
  rationale: Idinagdag ang “birheng” upang maipahayag ang παρθένος nang hindi tinutukoy kung anak o katipan ang babae. Inayos din ang pananalita para sa mas likas na modernong Filipino at pinalitan ang talababa a ng wastong leksikal na alternatibo. Napanatili ang kalabuan ng pinagtatalunang parirala at ang mga pananda ng talababa.
