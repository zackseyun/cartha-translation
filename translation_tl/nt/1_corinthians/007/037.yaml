id: 1CO.7.37
reference: 1 Corinthians 7:37
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὃς δὲ ἕστηκεν ⸂ἐν τῇ καρδίᾳ αὐτοῦ ἑδραῖος⸃ μὴ ἔχων ἀνάγκην, ἐξουσίαν δὲ ἔχει περὶ τοῦ ἰδίου θελήματος, καὶ τοῦτο κέκρικεν ἐν τῇ ⸂ἰδίᾳ καρδίᾳ⸃, ⸀τηρεῖν τὴν ἑαυτοῦ παρθένον, καλῶς ⸀ποιήσει·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/037.yaml
  text: But whoever stands firm in his heart[a], having no necessity, but has authority over his own will[b], and has decided this in his own heart—to keep his own virgin—he will do well.
translation:
  language: tl
  text: Ngunit ang taong matatag ang paninindigan sa kanyang puso, na hindi napipilitan[a] kundi may kapangyarihan sa sarili niyang kalooban, at ipinasiya ito sa kanyang sariling puso—na panatilihin ang sarili niyang birheng dalaga[b]—ay mabuti ang gagawin niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na walang pangangailangan.”
    reason: lexical_alternative
  - marker: b
    text: Ang “sarili niyang birheng dalaga” ay maaaring tumukoy sa anak niyang dalaga o sa birheng katipan niya; pinagtatalunan ang kahulugan ng Griyego.
    reason: alternative_reading
lexical_decisions:
- source_word: ἕστηκεν ἐν τῇ καρδίᾳ αὐτοῦ ἑδραῖος
  choice: matatag sa pasiya ng kanyang puso
  rationale: Ipinahahayag ng parirala ang isang matibay at napagpasiyahang paninindigan sa kalooban; ang pagbanggit sa “pasiya” ay nagbibigay ng likas na Tagalog habang pinananatili ang καρδία bilang “puso.”
- source_word: μὴ ἔχων ἀνάγκην
  choice: hindi napipilitan
  rationale: Sa kontekstong ito, maaaring tumukoy ang ἀνάγκη sa pangangailangan, pamimilit, o puwersang nag-uudyok. Ang “hindi napipilitan” ay malinaw at likas, habang nasa talababa ang mas literal na alternatibo.
- source_word: ἐξουσίαν δὲ ἔχει περὶ τοῦ ἰδίου θελήματος
  choice: may kapangyarihan sa sarili niyang kalooban
  rationale: Pinananatili ng “kapangyarihan” ang diwa ng ἐξουσία bilang awtoridad o karapatang magpasya, at ng “kalooban” ang saklaw ng θέλημα bilang nais o pasiya.
- source_word: κέκρικεν
  choice: ipinasiya
  rationale: Ipinahihiwatig ng anyong perfect ang isang pasiyang nabuo na at nananatiling matibay.
- source_word: τηρεῖν
  choice: panatilihin
  rationale: Ang τηρέω ay nangangahulugang ingatan, panatilihin, o panatilihin sa isang kalagayan. Hindi idinagdag sa teksto ang “walang asawa” sapagkat hindi ito tahasang nasa Griyego.
- source_word: τὴν ἑαυτοῦ παρθένον
  choice: ang sarili niyang dalaga
  rationale: Ang παρθένος ay isang birheng babae o dalaga. Pinili ang likas na “dalaga,” ngunit pinanatili sa talababa ang tunay na pagtatalo kung anak na dalaga o babaeng katipan ang tinutukoy.
- source_word: καλῶς ποιήσει
  choice: gagawa nang mabuti
  rationale: Likas na katumbas ito ng idyomang nangangahulugang kikilos nang tama o kapuri-puri.
theological_decisions:
- issue: Ang tinutukoy ng τὴν ἑαυτοῦ παρθένον
  choice: Panatilihin sa pangunahing teksto ang hindi tiyak na “sarili niyang dalaga.”
  alternative: “anak niyang dalaga” o “birheng katipan niya”
  rationale: Hindi tiyak sa pariralang Griyego kung ama o tagapag-alaga ang nagpapasiya tungkol sa kanyang anak, o isang lalaki ang nagpapasiya tungkol sa kanyang katipan. Hindi dapat tahimik na lutasin ng salin ang tunay na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “puso” at “kalooban” upang mapanatili ang biblikal na paraan ng pagsasalita nang hindi nagiging lipas o teknikal. Lahat ng talababa ay may katugmang pananda sa pangunahing teksto.
