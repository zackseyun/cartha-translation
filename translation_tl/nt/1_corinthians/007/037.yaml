  - severity: low
    issue: 'Hindi tumpak at hindi likas ang talababa a: “na walang kinakailangang pumilit sa kanya.”'
    rationale: Ang ἀνάγκη ay “pangangailangan” o “pamimilit/puwersa,” hindi isang taong ‘kinakailangang pumilit.’ Ang “na walang pangangailangan” ay mas malapit na leksikal na alternatibo.
