  source_fidelity: Ang “hindi napipilitan,” “may kapangyarihan sa sarili niyang kalooban,” at “ipinasiya ... sa kanyang sariling puso” ay tapat sa saklaw ng ἀνάγκη, ἐξουσία/θέλημα, at κέκρικεν. Gayunman, ang “dalaga” lamang ay hindi sapat na naipahahayag ang παρθένος, na tumutukoy rin sa pagiging birhen. Ang “birheng dalaga” ay pinananatili ang katangiang ito nang hindi nilulutas kung anak ba o katipan ang tinutukoy.
  naturalness: Mas likas ang “matatag ang paninindigan sa kanyang puso” kaysa “matatag sa pasiya ng kanyang puso,” at ang “mabuti ang gagawin niya” ay mas karaniwang ayos sa modernong Filipino kaysa “gagawa nang mabuti.”
  terminology: Pinanatili ang “puso,” “kalooban,” at “panatilihin.” Ang “birheng dalaga” ay mas tumpak na katumbas ng παρθένος kaysa “dalaga” lamang at nananatiling hindi tiyak ang ugnayan ng lalaki sa babae.
  issues:
