  text: εἰ δὲ οὐκ ἐγκρατεύονται, γαμησάτωσαν, κρεῖττον γάρ ἐστιν ⸀γαμῆσαι ἢ πυροῦσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/009.yaml
  text: But if they do not have self-control[a], let them marry; for it is better to marry than to burn.
translation:
  language: tl
  text: Ngunit kung hindi nila kayang magpigil sa sarili, mag-asawa sila; sapagkat mas mabuting mag-asawa kaysa mag-alab.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “kaysa mag-alab.” Sa kontekstong ito, malamang na tumutukoy ito sa pag-aalab sa seksuwal na pagnanasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγκρατεύονται
  choice: mapigil ang kanilang sarili
  rationale: Ipinahahayag nito sa natural na modernong Tagalog ang pagsasagawa ng pagpipigil sa sarili, lalo na sa usaping seksuwal ng konteksto.
- source_word: γαμησάτωσαν
  choice: mag-asawa sila
  rationale: Pinananatili ang lakas ng pautos ng aorist imperative na nasa ikatlong panauhang maramihan, nang hindi ginagawang labis na matigas ang tono.
- source_word: κρεῖττον
  choice: mas mabuti
  rationale: Tuwirang katumbas ng pahambing na κρεῖττον at likas sa Tagalog.
- source_word: γαμῆσαι
  choice: mag-asawa
  rationale: Payak at tuwirang salin ng infinitive, kapantay sa balangkas ng πυροῦσθαι.
- source_word: πυροῦσθαι
  choice: mag-alab sa pagnanasa
  rationale: Pinananatili ang metapora ng pag-aalab at nililinaw ang malakas na ipinahihiwatig ng konteksto tungkol sa seksuwal na pagnanasa; ang mas literal na anyo ay inilalagay sa talababa.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita ang banayad na pagsalungat sa naunang pahayag.
theological_decisions:
- issue: Kahulugan ng πυροῦσθαι sa konteksto
  choice: mag-alab sa pagnanasa
  alternative: mag-alab; masunog sa paghuhukom
  rationale: Ang agarang talakayan tungkol sa pagpipigil sa sarili at pag-aasawa ay malakas na tumutukoy sa nag-aalab na seksuwal na pagnanasa, hindi sa paghuhukom. Gayunman, hindi tahasang binabanggit ng Griyego ang salitang “pagnanasa,” kaya pinananatili sa talababa ang mas literal na anyo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “mag-asawa” sa kahulugang pumasok sa pag-aasawa, at pinanatili ang metapora ng pag-aalab.
