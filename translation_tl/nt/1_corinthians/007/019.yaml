id: 1CO.7.19
reference: 1 Corinthians 7:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἡ περιτομὴ οὐδέν ἐστιν, καὶ ἡ ἀκροβυστία οὐδέν ἐστιν, ἀλλὰ τήρησις ἐντολῶν θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/019.yaml
  text: Circumcision is nothing[a], and uncircumcision is nothing, but keeping the commandments of God.
translation:
  language: tl
  text: Ang pagtutuli ay walang halaga[a], at ang di-pagtutuli ay walang halaga; ang mahalaga ay ang pagtupad sa mga utos ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ay walang kabuluhan,” sa parehong paglitaw ng “ay walang halaga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περιτομή
  choice: pagtutuli
  rationale: Karaniwang pangngalang Tagalog para sa circumcision; pinananatili nito ang pagtukoy sa tanda o kalagayang kaugnay ng tipan, hindi lamang sa kilos ng pagtutuli.
- source_word: οὐδέν ἐστιν
  choice: walang halaga
  rationale: Likas at malinaw sa modernong Tagalog, at pinananatili ang mariing pagmamaliit ni Pablo sa kabuluhan ng dalawang panlabas na kalagayan sa puntong tinatalakay.
- source_word: ἀκροβυστία
  choice: di-pagtutuli
  rationale: Tuwirang katapat ng “pagtutuli” at pinananatili ang simetriya ng Griyegong paghahambing.
- source_word: ἀλλά
  choice: ang mahalaga ay
  rationale: Ipinahahayag sa natural na Tagalog ang matinding pagsalungat sa naunang dalawang sugnay. Hindi nito ipinapalagay na kulang sa pandiwang Griyego ang isang tiyak na pandiwa; inililinaw lamang ang kontrast na likas sa pangungusap.
- source_word: τήρησις
  choice: pagtupad
  rationale: Angkop na nominal na anyo para sa pag-iingat, pagsunod, o pagtupad sa mga utos; mas natural sa Tagalog kaysa “pag-iingat” sa kontekstong ito.
- source_word: ἐντολῶν θεοῦ
  choice: mga utos ng Diyos
  rationale: Pinananatili ang kongkretong pangmaramihang “mga utos” at ang ugnayang genitibo sa Diyos.
theological_decisions:
- issue: Ang pagtataya ni Pablo sa pagtutuli at di-pagtutuli
  choice: Itinuturing na walang halaga ang dalawang kalagayang ito kung ihahambing sa pagtupad sa mga utos ng Diyos.
  alternative: Ganap na inaalis ng talata ang anumang moral na kabuluhan ng pagtutuli sa lahat ng posibleng pakahulugan.
  rationale: Parehong tinatawag ng Griyego na οὐδέν ang pagtutuli at di-pagtutuli, saka inihaharap bilang kontrast ang pagtupad sa mga utos ng Diyos. Pinananatili ng salin ang tensiyong ito nang hindi nagpapataw ng mas malawak na doktrinal na konklusyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang semicolon upang idiin ang paglipat mula sa dalawang panlabas na kalagayan tungo sa tunay na mahalaga.
