  text: Δοῦλος ἐκλήθης; μή σοι μελέτω· ἀλλ’ εἰ καὶ δύνασαι ἐλεύθερος γενέσθαι, μᾶλλον χρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/021.yaml
  text: Were you called as a servant? Do not let it trouble you. But if indeed you are able to become free[a], rather make use of it.
translation:
  language: tl
  text: Tinawag ka ba habang ikaw ay alipin? Huwag mo itong ikabalisa. Ngunit kung maaari ka ngang maging malaya, samantalahin mo iyon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa halip, pakinabangan mo ang kasalukuyan mong kalagayan,” ibig sabihin, manatili ka sa kalagayan mo. Hindi tahasang sinasabi sa Griyego kung ano ang dapat gamitin o pakinabangan, kaya kapuwa nauunawaan ang parirala sa dalawang paraang ito.
    reason: alternative_reading
lexical_decisions:
- source_word: Δοῦλος
  choice: alipin
  rationale: Tumutukoy ito sa kalagayang may pagkabihag at pagmamay-ari, hindi lamang sa isang tagapaglingkod; malinaw ito sa kasunod na posibilidad na maging malaya.
- source_word: ἐκλήθης
  choice: tinawag ka
  rationale: Pinananatili ang payak na pananalita ng Griyego at ang karaniwang diwa ni Pablo tungkol sa pagtawag ng Diyos, nang hindi nagdaragdag ng paliwanag na wala sa teksto.
- source_word: μή σοι μελέτω
  choice: huwag mo itong ikabalisa
  rationale: Likas na modernong Tagalog na nagpapahayag ng pag-aalala o pagkabagabag, alinsunod sa pastoral na himig ng pahayag.
- source_word: ἐλεύθερος γενέσθαι
  choice: maging malaya
  rationale: Tuwirang inilalarawan ang pagbabago ng kalagayan mula sa pagkaalipin tungo sa kalayaan.
- source_word: μᾶλλον χρῆσαι
  choice: samantalahin mo iyon
  rationale: Ang χράομαι ay nangangahulugang gamitin o pakinabangan. Sa pangunahing pagbasa, ang ipinahihiwatig na layon ay ang pagkakataong maging malaya, ngunit hindi tahasang binanggit ang layon sa Griyego kaya itinatala ang kabilang pagbasa sa talababa.
theological_decisions:
- issue: Kalabuan ng μᾶλλον χρῆσαι
  choice: Hinihikayat ni Pablo ang alipin na samantalahin ang pagkakataong maging malaya kung maaari.
  alternative: Gamitin o pakinabangan ang kasalukuyang kalagayan, samakatuwid ay manatili bilang alipin.
  rationale: Ang pinakamalapit na ipinahihiwatig na layon ay ang pagkakataong nakapaloob sa pariralang “kung maaari ka ngang maging malaya.” Gayunman, walang tahasang layon ang χρῆσαι, at matagal nang kinikilala ang alternatibong pagbasa; kaya hindi ito ikinukubli at inilalahad sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “alipin” upang malinaw ang panlipunang kalagayan at ang kaibhan nito sa pagiging malaya. Ang “samantalahin” ay natural sa diwang pakinabangan ang isang pagkakataon at hindi nilulutas nang palihim ang tunay na kalabuan ng Griyego, na pinananatili sa talababa.
