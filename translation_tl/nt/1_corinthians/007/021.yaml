  terminology: Ang “alipin” ay angkop para sa δοῦλος sa kontekstong tahasang nagsasalita tungkol sa posibilidad na maging malaya. Ang “malaya” ay wasto para sa ἐλεύθερος. Napananatili ng talababa ang mahalagang kalabuan ng μᾶλλον χρῆσαι nang hindi nagpapataw ng doktrinal na pagpapasya.
