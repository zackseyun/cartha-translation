  source_fidelity: 'Tapat ang salin sa pangunahing mga sangkap ng Griyego: ang Δοῦλος ay wastong isinaling “alipin”; ang ἐκλήθης ay nananatiling payak na “tinawag”; ang μή σοι μελέτω ay angkop na “Huwag mo itong ikabalisa”; at ang ἐλεύθερος γενέσθαι ay malinaw na “maging malaya.” Ang “samantalahin mo iyon” ay natural na pangunahing pagbasa ng μᾶλλον χρῆσαι bilang pagtukoy sa pagkakataong maging malaya, samantalang hindi ikinukubli ng talababa ang hindi binanggit na layon ng pandiwa at ang makasaysayang alternatibong pagbasa.'
