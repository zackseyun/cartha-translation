  naturalness: Natural ang karamihan ng pangungusap. Mas malinaw at mas matatas sa modernong Tagalog ang tuwirang ayos na 'hindi dapat diborsiyuhin ng asawang lalaki ang kanyang asawa' kaysa sa 'hindi dapat hiwalayan ng isang lalaki ang kanyang asawa.'
  terminology: Ang 'makipaghiwalay' ay mabuting katumbas ng χωρισθῇ sapagkat hindi nito awtomatikong ipinapalagay ang pormal na diborsiyo. Para sa ἀφιέναι sa ikalawang tagubilin, 'diborsiyuhin' ang malinaw na pangunahing salin sa kontekstong pangmag-asawa; pinananatili ng talababa ang mas literal na 'paalisin.' Ang 'asawang lalaki' ay kinakailangan para sa ἀνήρ dito.
