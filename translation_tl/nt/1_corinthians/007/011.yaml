    rationale: Bagaman maaaring tumukoy ang 'hiwalayan' sa pagtatapos ng pagsasama, hindi nito malinaw na naihihiwatig ang marital-divorce/dismissal sense ng ἀφιέναι at medyo mabigat ang passive na ayos. Ang 'diborsiyuhin' ay mas malinaw sa pangunahing teksto, na may literal na alternatibo sa talababa.
