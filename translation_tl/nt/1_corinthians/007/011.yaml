source:
  edition: SBLGNT
  text: ἐὰν δὲ καὶ χωρισθῇ, μενέτω ἄγαμος ἢ τῷ ἀνδρὶ καταλλαγήτω— καὶ ἄνδρα γυναῖκα μὴ ἀφιέναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/011.yaml
  text: But if she does separate[a], let her remain unmarried[b], or else be reconciled to her husband—and a husband must not divorce his wife.
translation:
  language: tl
  text: Ngunit kung makipaghiwalay man siya[a], manatili siyang walang asawa, o kaya'y makipagkasundo siya sa kanyang asawa—at hindi dapat diborsiyuhin[b] ng asawang lalaki ang kanyang asawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “Ngunit kahit makipaghiwalay siya.” Maaaring may bahagyang diwang concessive ang pariralang Griyego.
    reason: lexical_alternative
  - marker: b
    text: Mas literal, “paalisin” o “itaboy.” Sa kontekstong pangmag-asawa, maaari rin itong isalin na “huwag hiwalayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ καὶ
  choice: Ngunit kung ... man
  rationale: Ipinahihiwatig ng “man” ang posibleng concessive na puwersa ng καί, habang nananatiling natural ang kondisyon sa Tagalog.
- source_word: χωρισθῇ
  choice: makipaghiwalay
  rationale: Pinananatili nito ang pangkalahatang diwa ng paghihiwalay ng mag-asawa nang hindi agad itinutumbas sa pormal o legal na diborsiyo.
- source_word: μενέτω
  choice: manatili
  rationale: Tuwirang ipinapahayag nito ang patuloy na kalagayang iniuutos ng imperative.
- source_word: ἄγαμος
  choice: walang asawa
  rationale: Mas natural at malinaw ito sa modernong Tagalog kaysa sa mas teknikal na “di-may-asawa,” at tumutukoy nang tiyak sa marital status.
- source_word: καταλλαγήτω
  choice: makipagkasundo
  rationale: Natural nitong ipinapahayag ang pagpapanumbalik ng maayos na ugnayan sa asawa, alinsunod sa passive imperative na “be reconciled.”
- source_word: τῷ ἀνδρί
  choice: sa kanyang asawa
  rationale: Sa konteksto, ang ἀνήρ ay nangangahulugang asawang lalaki; sapat na ang “asawa” dahil malinaw na babae ang naunang paksa.
- source_word: ἄνδρα
  choice: isang lalaki
  rationale: Ginagawang tahasan ang lalaking kapareha sa ikalawang tagubilin at pinananatili ang magkapares na pagtukoy sa babae at lalaki.
- source_word: γυναῖκα
  choice: kanyang asawa
  rationale: Sa kontekstong pangmag-asawa, ang γυνή ay “asawa,” hindi lamang “babae”; ang “kanyang” ay natural na nagpapakita ng relasyon.
- source_word: μὴ ἀφιέναι
  choice: hindi dapat hiwalayan
  rationale: Ipinapahayag nito ang lakas ng pagbabawal at ang marital na diwa ng pagpapaalis o pakikipagdiborsiyo, nang hindi nakatali lamang sa modernong legal na termino.
theological_decisions:
- issue: Kung dapat bang iisang termino ang gamitin para sa χωρισθῇ at ἀφιέναι
  choice: Isalin ang χωρισθῇ bilang “makipaghiwalay” at ang ἀφιέναι bilang “hiwalayan,” na may talababa tungkol sa “paalisin” o “diborsiyuhin.”
  alternative: Isalin ang dalawang pandiwa bilang “diborsiyuhin,” o parehong bilang pangkalahatang “makipaghiwalay/hiwalayan.”
  rationale: Magkaiba ang dalawang pandiwang Griyego. Pinananatili ng salin ang posibleng pagkakaiba ng kusang paghihiwalay at pagpapaalis o diborsiyo, habang iniiwasang magpasok ng legal na katiyakang wala sa unang pandiwa.
- issue: Kung paano ipahahayag ang implicit na babaeng paksa
  choice: Gamitin ang “siya” sa unang sugnay, ayon sa naunang konteksto tungkol sa asawang babae.
  alternative: Ulitin ang “ang babae” o “ang asawang babae.”
  rationale: Walang tahasang pangngalan sa talata, ngunit malinaw mula sa agarang konteksto na babae ang paksa. Natural sa Tagalog ang “siya” at hindi ito nagdaragdag ng wala sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “makipaghiwalay” upang hindi labis na tukuyin ang legal na katangian ng unang kilos, at “hiwalayan” sa ikalawa upang maging natural sa Tagalog; inilagay sa talababa ang mas literal na “paalisin” at ang legal na “diborsiyuhin.”
