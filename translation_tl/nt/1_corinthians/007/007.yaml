base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/007.yaml
  text: But I want all men to be as I myself am. Yet each has his own gift from God, one in this way and another in that way.
translation:
  language: tl
  text: Ngunit nais kong ang lahat ay maging tulad ko. Gayunman, ang bawat isa ay may sariling kaloob mula sa Diyos—ang isa ay ganito, at ang isa naman ay ganoon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θέλω
  choice: nais ko sana
  rationale: Ipinapahayag ang kagustuhan ni Pablo nang natural sa Tagalog, nang hindi ito ginagawang utos.
- source_word: πάντας ἀνθρώπους
  choice: ang lahat
  rationale: Sa konteksto, tumutukoy ito sa lahat ng taong tinatalakay; natural at inklusibo ang 'ang lahat' sa modernong Tagalog nang hindi nagdaragdag ng hindi tahasang nasa teksto.
- source_word: χάρισμα
  choice: kaloob
  rationale: Karaniwang salin para sa biyayang ipinagkaloob ng Diyos at angkop sa bokabularyong teolohikal ng 1 Corinto.
- source_word: ἴδιον
  choice: sariling
  rationale: Pinananatili ang diin na ang bawat isa ay may kani-kaniyang kaloob.
- source_word: ὁ μὲν οὕτως, ὁ δὲ οὕτως
  choice: ang isa ay ganito, at ang iba naman ay ganoon
  rationale: Pinananatili ang sadyang di-tiyak at magkatapat na pahayag ng Griyego.
theological_decisions:
- issue: Kung ang kalagayan ni Pablo ay pamantayang inuutos sa lahat
  choice: ‘nais ko sana’ bilang personal na hangarin
  alternative: ‘ibig kong’ o isang mas pautos na pagkakasabi
  rationale: Ang θέλω ay nagsasaad ng kagustuhan; nililimitahan naman ng kasunod na pangungusap ang anumang pagbasa na pare-pareho ang kaloob ng lahat.
- issue: Kalikasan ng magkakaibang kaloob
  choice: Panatilihing di-tiyak ang ‘ganito…ganoon’
  alternative: Tukuyin ang mga ito bilang pag-aasawa at hindi pag-aasawa
  rationale: Bagaman ipinahihiwatig iyon ng konteksto, hindi tahasang pinangalanan ng talata ang dalawang kalagayan; nararapat panatilihin ang ambiguity ng orihinal.
translation_notes:
  register: Natural, kasalukuyan, at marangal na Filipino. Gumamit ng em dash upang malinaw na ipakilala ang magkatapat ngunit sadyang di-tiyak na mga uri ng kaloob.
