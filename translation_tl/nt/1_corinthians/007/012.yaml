base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/012.yaml
  text: But to the rest I say—I[a], not the Lord—if any brother has an unbelieving wife, and she consents to live with him, he must not divorce her.
translation:
  language: tl
  text: Ngunit sa iba pa ay ako ang nagsasabi—hindi ang Panginoon—kung ang isang kapatid na lalaki ay may asawang di-sumasampalataya, at pumapayag ang asawang ito na mamuhay kasama niya, huwag niya itong hiwalayan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “huwag niya itong iwan” o “huwag niya itong paalisin.” Mas literal na nangangahulugang “iwan” o “paalisin” ang pandiwang Griego, ngunit dito ay tumutukoy ito sa pagwawakas ng pagsasama bilang mag-asawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς δὲ λοιποῖς
  choice: Ngunit sa iba naman
  rationale: Tumutukoy ang λοιποί sa natitirang pangkat na hindi tuwirang natalakay sa naunang tagubilin; ipinahihiwatig ng “ngunit” at “naman” ang banayad na paglipat at paghahambing ng δέ.
- source_word: λέγω ἐγώ, οὐχ ὁ κύριος
  choice: ako ang nagsasabi—ako, hindi ang Panginoon—
  rationale: Pinananatili ng inulit na “ako” ang diin ng ἐγώ at ang paningit na paghahambing kay Pablo at sa Panginoon, nang hindi ipinahihiwatig na walang awtoridad ang tagubilin.
- source_word: ἀδελφὸς
  choice: kapatid na lalaki
  rationale: Tiyak na lalaki ang tinutukoy ng pangngalang panlalaki sa kontekstong ipinaparis sa “asawa,” kaya mas eksakto ito kaysa sa pangkalahatang “mananampalataya.”
- source_word: γυναῖκα ἔχει ἄπιστον
  choice: may asawang hindi sumasampalataya
  rationale: Likas na pahayag sa Filipino ang “may asawa,” at nililinaw ng kasunod na parirala na ang ἄπιστον ay kawalan ng pananampalatayang Cristiano, hindi pagtataksil sa asawa.
- source_word: καὶ αὕτη συνευδοκεῖ
  choice: at pumapayag itong
  rationale: Ipinahahayag ng συνευδοκεῖ ang kusang pagsang-ayon sa ipinapanukalang patuloy na pagsasama; natural at malinaw sa modernong Filipino ang “pumapayag.”
- source_word: οἰκεῖν μετ’ αὐτοῦ
  choice: mamuhay na kasama niya
  rationale: Tumutukoy ito sa magkasamang buhay sa tahanan, hindi lamang sa panandaliang pagtira sa iisang lugar.
- source_word: μὴ ἀφιέτω αὐτήν
  choice: huwag niya itong hiwalayan
  rationale: Sa konteksto ng pag-aasawa, ang ἀφίημι ay tumutukoy sa pag-iwan o pagpapaalis sa asawa na nagwawakas sa pagsasama; malinaw sa Filipino ang “hiwalayan,” habang inilalagay sa talababa ang mas literal na mga posibilidad.
theological_decisions:
- issue: Ang pahayag ni Pablo na “ako, hindi ang Panginoon”
  choice: Pinanatili bilang pagkakaiba sa pagitan ng tagubilin ni Pablo at ng isang tuwirang kasabihan ng Panginoon tungkol sa kasong ito.
  alternative: Unawain ito bilang pansariling opinyon ni Pablo na walang apostolikong awtoridad.
  rationale: Ipinakikita ng agarang konteksto na inilalapat ni Pablo ang tagubilin sa isang kalagayang hindi tuwirang tinalakay sa naunang kasabihan ng Panginoon. Hindi tahasang nilulutas ng salin ang usapin ng inspirasyon o antas ng awtoridad.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “kapatid na lalaki” para sa tiyak na kasariang tinutukoy, at ang “hindi sumasampalataya” upang maiwasang mapagkamalang pagtataksil sa asawa. Pinanatili ang paningit at diin sa “ako, hindi ang Panginoon.”
