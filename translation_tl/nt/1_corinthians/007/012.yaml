revisions:
- from: Ngunit sa iba naman ay ako ang nagsasabi—ako, hindi ang Panginoon—kung ang isang kapatid na lalaki ay may asawang hindi sumasampalataya, at pumapayag itong mamuhay na kasama niya, huwag niya itong hiwalayan.[a]
  to: Ngunit sa iba pa ay ako ang nagsasabi—hindi ang Panginoon—kung ang isang kapatid na lalaki ay may asawang di-sumasampalataya, at pumapayag ang asawang ito na mamuhay kasama niya, huwag niya itong hiwalayan.[a]
  rationale: Ginawang mas malinaw ang pagtukoy sa natitirang pangkat at sa asawang pumapayag, at pinasimple ang pagmamarka ng diin kay Pablo sa paraang natural sa Filipino. Hindi binago ang saklaw ng utos, ang kasariang ipinahihiwatig ng teksto, o ang maingat na pagkakaiba ng pahayag ni Pablo at ng tuwirang pahayag ng Panginoon.
