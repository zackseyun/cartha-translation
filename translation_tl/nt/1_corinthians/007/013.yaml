revisions:
- from: At kung ang isang babae ay may asawang hindi sumasampalataya, at pumapayag itong mamuhay kasama niya, huwag niyang iwan[a] ang kanyang asawa.
  to: At kung ang isang babae ay may asawang lalaking hindi sumasampalataya, at pumapayag ang asawang lalaki na manirahang kasama niya, huwag niyang iwan ang kanyang asawang lalaki.[a]
  rationale: Nilinaw ang kasarian ng ἀνήρ sa parehong pagbanggit sa pamamagitan ng “asawang lalaki.” Pinalitan ang “pumapayag itong mamuhay kasama niya” ng mas likas at mas tiyak na “pumapayag ang asawang lalaki na manirahang kasama niya.” Pinanatili ang “iwan” at ang talababa upang igalang ang lexical na lawak ng ἀφίημι at ang kontekstuwal na kahulugang pagwawakas ng pag-aasawa.
