base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/013.yaml
  text: And if a woman has an unbelieving husband[a], and he consents to live with her, she must not leave her husband.
translation:
  language: tl
  text: At kung ang isang babae ay may asawang lalaking hindi sumasampalataya, at pumapayag ang asawang lalaki na manirahang kasama niya, huwag niyang iwan ang kanyang asawang lalaki.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “hiwalayan.” Ang pandiwang Griyego ay maaaring literal na mangahulugang “iwan” o “paalisin”; dito, tumutukoy ito sa pagwawakas ng relasyong mag-asawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνὴ εἴ τις
  choice: kung ang isang babae
  rationale: Ipinakikilala nito ang isang pangkalahatang kalagayan. Bagaman maaaring mangahulugan ang γυνή na “asawa,” malinaw na ang usapan ay tungkol sa isang babaeng may asawa, at likas sa Tagalog ang “isang babae ay may asawang.”
- source_word: ἄνδρα ἄπιστον
  choice: asawang hindi sumasampalataya
  rationale: Sa konteksto ng pag-aasawa, ang ἀνήρ ay “asawang lalaki,” na natural na naipahahayag sa “asawa.” Ang ἄπιστος ay tumutukoy rito sa hindi nakikibahagi sa pananampalatayang Kristiyano, hindi sa pagiging taksil sa asawa.
- source_word: οὗτος
  choice: ito
  rationale: Ang panghalip na pamatlig ay tumutukoy pabalik sa asawang hindi sumasampalataya. Ang “ito” ay maikli at natural, nang hindi nagdaragdag ng diin.
- source_word: συνευδοκεῖ
  choice: pumapayag
  rationale: Ipinahahayag ng pandiwa ang kusang pagsang-ayon o pagpayag. Ang “pumapayag” ay malinaw at karaniwan sa modernong Tagalog.
- source_word: οἰκεῖν μετ’ αὐτῆς
  choice: mamuhay kasama niya
  rationale: Tumutukoy ito sa pagpapatuloy ng magkasamang buhay sa tahanan. Mas malinaw dito ang “mamuhay kasama niya” kaysa “makisama,” na maaari ring unawain bilang maayos na pakikitungo lamang.
- source_word: μὴ ἀφιέτω τὸν ἄνδρα
  choice: huwag niyang iwan ang kanyang asawa
  rationale: Maaaring literal na tumukoy ang ἀφίημι sa pag-iwan o pagpapaalis, ngunit sa kontekstong ito ay tumutukoy sa pagwawakas ng relasyong mag-asawa. Pinananatili ng “iwan” ang lawak ng pandiwang Griyego nang hindi ito nililimitahan agad sa isang tiyak na legal na proseso.
theological_decisions:
- issue: Saklaw ng utos na μὴ ἀφιέτω sa pag-aasawang magkaiba ang pananampalataya
  choice: huwag niyang iwan ang kanyang asawa
  alternative: huwag niyang hiwalayan ang kanyang asawa
  rationale: Ang “hiwalayan” ay malinaw na nagpapahiwatig ng pagwawakas sa pag-aasawa, ngunit maaaring maging mas tiyak kaysa sa mismong pandiwang Griyego. Ang “iwan” ay mas malapit sa anyo ng ἀφίημι, samantalang nililinaw ng talababa na pagwawakas ng relasyong mag-asawa ang tinutukoy sa konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “hindi sumasampalataya” upang maiwasan ang posibleng maling pagkaunawa sa “di-tapat,” at “mamuhay kasama” upang malinaw na tukuyin ang patuloy na pagsasama sa tahanan.
