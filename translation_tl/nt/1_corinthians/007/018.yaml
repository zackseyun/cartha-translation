base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/018.yaml
  text: Was anyone called while circumcised? He should not try to reverse it[a]. Was anyone called while uncircumcised? He should not be circumcised.
translation:
  language: tl
  text: May tinawag bang tuli na? Huwag niyang tangkaing alisin ang mga tanda ng kaniyang pagtutuli.[a] May tinawag bang hindi tuli? Huwag siyang magpatuli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Huwag siyang maging di-tuli”—ibig sabihin, huwag niyang tangkaing itago o alisin ang mga tanda ng pagtutuli.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιτετμημένος
  choice: nang tuli na siya
  rationale: Ipinapahayag ng perpektong participle ang umiiral na kalagayan bunga ng pagtutuli noong siya ay tinawag. Likas sa modernong Tagalog ang pariralang ito at malinaw ang pagkakapantay nito sa ikalawang sugnay.
- source_word: ἐκλήθη / κέκληταί
  choice: tinawag
  rationale: Pinananatili ang katawagang teolohikal ni Pablo nang hindi ito pinaliliit sa simpleng pag-anyaya o tahasang pinapakahulugang pagbabalik-loob. Hindi kailangang ipilit sa Tagalog ang pagkakaiba ng aorist at perfect dito, yamang hindi iyon pangunahing diin ng pangungusap.
- source_word: ἐπισπάσθω
  choice: huwag niyang tangkaing alisin ang mga tanda nito
  rationale: Tumutukoy ang pandiwa sa pagtatangkang itago o baligtarin ang nakikitang bunga ng pagtutuli. Malinaw ito sa ordinaryong mambabasa, samantalang pinananatili sa talababa ang mas literal na anyo.
- source_word: ἐν ἀκροβυστίᾳ
  choice: nang hindi pa siya tuli
  rationale: Ipinahahayag nito ang kalagayan ng tao noong siya ay tinawag. Natural at malinaw ito sa modernong Tagalog kaysa sa literal ngunit di-likas na 'nasa di-pagtutuli.'
- source_word: περιτεμνέσθω
  choice: huwag siyang magpatuli
  rationale: Ang present imperative na may μή ay pagbabawal. Ang 'magpatuli' ang karaniwan at tuwirang Tagalog para sa pagpapagawa ng pagtutuli.
theological_decisions:
- issue: Kahulugan ng 'tinawag' sa dalawang sugnay
  choice: Pinanatili ang 'tinawag,' na sa konteksto ay tumutukoy sa pagtawag ng Diyos habang nasa isang partikular na kalagayang panrelihiyon at panlipunan ang tao.
  alternative: Tahasan itong isaling 'naging Cristiano' o 'nagbalik-loob.'
  rationale: Sa konteksto ng 1 Corinto 7, ang pagtawag ay malamang na pagtawag ng Diyos tungo sa buhay kay Cristo. Gayunman, hindi ito pinalitan ng mas mapagpasyang paliwanag upang mapanatili ang salita at lawak ng pahayag ni Pablo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang simetrikong 'nang tuli na siya / nang hindi pa siya tuli' upang maipakita ang magkatapat na kalagayan sa dalawang tanong.
