  to: May tinawag bang tuli na? Huwag niyang tangkaing alisin ang mga tanda ng kaniyang pagtutuli.[a] May tinawag bang hindi tuli? Huwag siyang magpatuli.
  rationale: Inayos ang dalawang tanong sa likas at magkatapat na Filipino, inalis ang posibleng dagdag na temporal na kahulugan ng “pa,” at nilinaw ang tinutukoy ng unang pagbabawal. Pinanatili ang “tinawag,” “tuli,” “hindi tuli,” at “magpatuli” upang maging tapat sa saklaw at utos ng Griyego nang hindi ipinapasok ang paliwanag na doktrinal.
