  naturalness: Kailangan ng bahagyang rebisyon para sa mas natural at malinaw na modernong Filipino. Ang “May tinawag bang tuli na?” at “May tinawag bang hindi tuli?” ay maikli, simetriko, at natural sa kontekstong ito.
  terminology: Ang “tinawag” ay wastong pinananatili para sa καλέω. Ang “magpatuli” ay tumpak para sa περιτεμνέσθω. Pinalinaw ang unang pagbabawal bilang pag-aalis ng mga tanda ng sariling pagtutuli, upang hindi malabo ang panghalip na “nito.”
