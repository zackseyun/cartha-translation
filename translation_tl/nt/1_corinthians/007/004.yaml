id: 1CO.7.4
reference: 1 Corinthians 7:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἡ γυνὴ τοῦ ἰδίου σώματος οὐκ ἐξουσιάζει ἀλλὰ ὁ ἀνήρ· ὁμοίως δὲ καὶ ὁ ἀνὴρ τοῦ ἰδίου σώματος οὐκ ἐξουσιάζει ἀλλὰ ἡ γυνή.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/004.yaml
  text: The wife does not have authority over her own body[a], but the husband does; likewise also the husband does not have authority over his own body, but the wife does.
translation:
  language: tl
  text: Ang asawang babae ay walang kapangyarihan sa sarili niyang katawan,[a] kundi ang kanyang asawa; gayundin naman, ang asawang lalaki ay walang kapangyarihan sa sarili niyang katawan, kundi ang kanyang asawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi gumagamit ng kapangyarihan sa.” Ang pandiwang Griyego ay maaaring tumukoy sa pagkakaroon o paggamit ng kapangyarihan; dito, kapwa at magkatumbas ang kapangyarihan ng mag-asawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: asawang babae
  rationale: Sa konteksto ng pag-aasawa at ng katumbas na ἀνήρ, tumutukoy ito sa asawang babae, hindi sa babae sa pangkalahatan.
- source_word: ἀνήρ
  choice: asawang lalaki
  rationale: Sa mag-asawang konteksto at bilang katumbas ng γυνή, tumutukoy ito sa asawang lalaki, hindi sa lalaki sa pangkalahatan.
- source_word: ἰδίου σώματος
  choice: sarili niyang katawan
  rationale: Pinananatili nito ang diin ng ἴδιος sa sariling pag-aari o kaugnayan sa sarili, sa natural na modernong Tagalog.
- source_word: ἐξουσιάζει
  choice: may kapangyarihan sa
  rationale: Tuwirang ipinahahayag nito ang pagkakaroon ng awtoridad o kapamahalaan. Hindi nito pinahihina ang pandiwa bilang pag-aari lamang at hindi rin ito nagpapahiwatig ng labis na mapaniil na kontrol.
- source_word: ἀλλά
  choice: kundi
  rationale: 'Natural na minamarkahan ng “kundi” ang matinding pagsalungat sa negatibong sugnay: hindi ang sarili, kundi ang asawa.'
- source_word: ὁμοίως δὲ καὶ
  choice: gayundin naman
  rationale: Natural at malinaw nitong pinananatili ang simetriko at kapwa katumbas na ikalawang pahayag.
theological_decisions:
- issue: Likas ng kapangyarihan sa loob ng pag-aasawa
  choice: Panatilihin ang pahayag bilang magkatumbas na kapangyarihan ng bawat asawa kaugnay ng katawan ng isa’t isa.
  alternative: Isalin nang mas mahina bilang “hindi niya pag-aari ang sarili niyang katawan,” o mas matindi bilang “kinokontrol ng asawa ang kanyang katawan.”
  rationale: Eksaktong magkatimbang ang dalawang sugnay sa Griyego. Kaya hindi dapat magpasok ang salin ng iisang-panig na hirarkiya, mapaniil na kontrol, o ng mas mahinang ideya ng pag-aari lamang. Ang “may kapangyarihan sa” ay nagpapanatili rin sa maaaring diwa ng pagkakaroon o paggamit ng kapangyarihan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “asawang babae” at “asawang lalaki” upang iwasan ang kalabuan ng salitang “asawa” sa unang pagtukoy, habang ang “kanyang asawa” ay natural na sapat sa magkatugmang mga sugnay.
