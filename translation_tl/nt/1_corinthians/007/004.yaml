review_pass:
  verdict: approve
  source_fidelity: 'Tumpak na naisasalin ang magkatimbang na dalawang sugnay ng Griyego: ang bawat asawa ay hindi ang may kapangyarihan sa sarili niyang katawan, kundi ang kabilang asawa. Napananatili ang diin ng ἴδιος sa “sarili niyang katawan,” ang pagsalungat ng ἀλλά sa “kundi,” at ang simetriya ng ὁμοίως δὲ καὶ sa “gayundin naman.”'
  naturalness: Natural, malinaw, at marangal ang modernong Filipino Tagalog. Ang “asawang babae” at “asawang lalaki” ay angkop na paglilinaw sa unang banggit; ang “kanyang asawa” sa magkasingkahulugang kasunod na mga sugnay ay malinaw mula sa konteksto.
  terminology: Ang “may kapangyarihan sa” ay tapat at idiomatikong katumbas ng ἐξουσιάζει sa kontekstong ito. Hindi nito ginagawang simpleng pagmamay-ari ang pahayag at hindi rin ito nagdaragdag ng ideya ng pamimilit o dominasyon. Ang talababa ay nagbibigay ng lehitimong alternatibong pandiwang pagpapahayag at wastong itinatampok ang pagkakapalitan ng pahayag.
