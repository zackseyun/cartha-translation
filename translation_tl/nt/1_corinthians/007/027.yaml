  naturalness: Mas natural at dignified sa modernong Filipino ang “sa asawa” kaysa “sa isang asawa” sa ganitong pangkalahatang pahayag. Ang “maghangad ng pagkalag” ay medyo pormal ngunit nauunawaan at angkop sa rehistrong pangkasulatan; pinananatili rin nito ang metapora ng Griyego.
  terminology: Pinanatili ang “nakatali,” “pagkalag,” at “nakalaya” upang maitugma ang δέδεσαι, λύσιν, at λέλυσαι nang hindi ipinagpapalagay na diborsiyo lamang ang tinutukoy. Ang talababa ay nananatiling malinaw na interpretatibong alternatibo, hindi pangunahing salin.
