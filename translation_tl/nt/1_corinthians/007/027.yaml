  text: Are you bound to a wife? Do not seek release[a]. Are you released from a wife? Do not seek a wife.
translation:
  language: tl
  text: Nakatali ka ba sa asawa? Huwag kang maghangad ng pagkalag.[a] Nakalaya ka na ba mula sa asawa? Huwag kang humanap ng asawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, sa mas interpretatibong salin: “May asawa ka ba? Huwag kang maghangad ng diborsiyo. Hiwalay ka na ba sa asawa? Huwag kang humanap ng asawa.” Mas literal na binabanggit ng Griyego ang pagiging “nakatali,” ang “pagkalag,” at pagiging “nakalaya.”'
    reason: alternative_reading
lexical_decisions:
- source_word: δέδεσαι
  choice: nakatali ka
  rationale: Pinananatili ang larawan ng pagkakatali at ang aspektong nagresulta sa isang kasalukuyang kalagayan, habang natural pa rin sa modernong Tagalog.
- source_word: γυναικί
  choice: sa isang asawa
  rationale: Sa konteksto ng pag-aasawa, ang γυνή ay tumutukoy sa asawa; hindi tinukoy ng pangungusap sa Tagalog ang kasarian ng kinakausap nang higit sa kinakailangan.
- source_word: μὴ ζήτει
  choice: huwag mong hangarin / huwag kang humanap
  rationale: Ang ζητέω ay nangangahulugang maghanap o maghangad. Ginamit ang “hangarin” para sa paglaya at ang mas likas na “humanap” para sa asawa, nang hindi pinahihina ang pagbabawal.
- source_word: λύσιν
  choice: makalaya
  rationale: Ipinahahayag ang paglaya o pagkalag sa pagkakatali at iniiwasang gawing tahasang “diborsiyo” ang mas malawak na salitang Griyego.
- source_word: λέλυσαι
  choice: nakalaya ka
  rationale: Pinananatili ang ugnayang leksikal sa λύσιν at ang kasalukuyang kalagayang bunga ng pagkalag, nang hindi nagpapasya kung diborsiyo, pagkabalo, o ibang kalagayan ang tinutukoy.
- source_word: ἀπὸ γυναικός
  choice: mula sa isang asawa
  rationale: Tuwirang isinasalin ang ἀπό bilang “mula sa,” at ang γυνή bilang “asawa” ayon sa kontekstong pangmag-asawa.
- source_word: γυναῖκα
  choice: asawa
  rationale: Ang konteksto ay paghahanap ng mapapangasawa, kaya “asawa” ang natural at tumpak na salin.
theological_decisions:
- issue: Kung tahasang isasalin bilang pag-aasawa at diborsiyo o pananatilihin ang larawan ng pagkakatali at paglaya.
  choice: Pinanatili sa pangunahing teksto ang larawan ng pagiging “nakatali” at “nakalaya.”
  alternative: “May asawa ka ba? Huwag kang humanap ng diborsiyo. Diborsiyado ka ba? Huwag kang humanap ng asawa.”
  rationale: Gumagamit ang Griyego ng mga salitang may diwa ng pagtatali at pagkalag, hindi ng tahasang terminolohiya para sa diborsiyo. Pinananatili nito ang tunay na lawak at posibleng kalabuan ng pahayag.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ang “nakatali” at “nakalaya” ay sadyang nagpapanatili sa magkatapat na larawan ng Griyego; nililinaw ng talababa ang mas tiyak ngunit interpretatibong pagbasa.
