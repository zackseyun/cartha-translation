  source_fidelity: Tapat ang salin sa Griyego. Ang “Binili kayo” ay wastong pagsasalin ng aorist passive ἠγοράσθητε; ang “sa isang halaga” ay naipapahayag ang τιμῆς nang hindi tinutukoy ang halaga; at ang “huwag kayong maging” ay pinananatili ang puwersa ng μὴ γίνεσθε. Ang “mga alipin ng tao” ay malinaw na tumutugma sa δοῦλοι ἀνθρώπων at pinananatili ang mahalagang larawang pag-aari/pagpapasakop.
