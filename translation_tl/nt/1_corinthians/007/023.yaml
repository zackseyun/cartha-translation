  text: τιμῆς ἠγοράσθητε· μὴ γίνεσθε δοῦλοι ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/023.yaml
  text: You were bought with a price[a]; do not become servants of men.
translation:
  language: tl
  text: Binili kayo sa isang halaga; huwag kayong maging mga alipin ng tao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τιμῆς
  choice: sa isang halaga
  rationale: Ang henitibo kasunod ng ἀγοράζω ay nagpapahayag ng halagang ibinayad. Pinananatili ng parirala ang di-tiyak ngunit tunay na halaga ng pagbili.
- source_word: ἠγοράσθητε
  choice: Binili kayo
  rationale: Aorist passive indicative, ikalawang panauhang maramihan. Likas sa Tagalog ang “binili kayo” at pinananatili nito ang metapora ng pagbili.
- source_word: μὴ γίνεσθε
  choice: huwag kayong maging
  rationale: Pinananatili nito ang diwa ng γίνομαι na pagpasok o pagpapatuloy sa isang kalagayan, sa halip na simpleng “huwag kayong maging ganoon” bilang purong stative.
- source_word: δοῦλοι
  choice: mga alipin
  rationale: Mahalaga rito ang katayuan ng pag-aari at pagpapasakop, kaya mas tumpak ang “mga alipin” kaysa “mga lingkod.”
- source_word: ἀνθρώπων
  choice: ng tao
  rationale: Sa modernong Tagalog, ang “tao” ay natural na panlahatang katawagan para sa mga tao o sangkatauhan at malinaw na itinatapat ang pamamahala ng tao sa pag-aari ng Panginoon.
theological_decisions:
- issue: Paglalarawan sa δοῦλοι ἀνθρώπων sa konteksto ng pagbili at katapatan
  choice: mga alipin ng tao
  alternative: mga lingkod ng mga tao
  rationale: Ang “mga alipin” ang nagpapanatili sa tensiyon ng pag-aari at sukdulang pagpapasakop na likha ng metapora. Ang “ng tao” ay panlahatan at hindi nililimitahan ang tinutukoy sa kalalakihan.
translation_notes:
  register: Modernong Filipino Tagalog na maikli, marangal, at madaling maunawaan. Ginamit ang “tao” bilang kolektibo at panlahat; hindi kailangan ang talababa dahil malinaw ito sa kasalukuyang gamit.
