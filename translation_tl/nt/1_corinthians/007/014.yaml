id: 1CO.7.14
reference: 1 Corinthians 7:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἡγίασται γὰρ ὁ ἀνὴρ ὁ ἄπιστος ἐν τῇ γυναικί, καὶ ἡγίασται ἡ γυνὴ ἡ ἄπιστος ἐν τῷ ⸀ἀδελφῷ· ἐπεὶ ἄρα τὰ τέκνα ὑμῶν ἀκάθαρτά ἐστιν, νῦν δὲ ἅγιά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/014.yaml
  text: For the unbelieving husband has been made holy through his wife[a], and the unbelieving wife has been made holy through the brother; otherwise your children are unclean, but as it is[b], they are holy.
translation:
  language: tl
  text: Sapagkat ang asawang lalaking hindi sumasampalataya ay ginawang banal sa pamamagitan ng kaniyang asawa, at ang asawang babaeng hindi sumasampalataya ay ginawang banal sa pamamagitan ng kapatid na lalaki[a]; kung hindi, marumi ang inyong mga anak, ngunit ang totoo, banal sila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, “sa pamamagitan ng sumasampalatayang asawang lalaki.” Sa Griyego: “sa pamamagitan ng kapatid na lalaki,” na malamang ay paggamit ni Pablo ng “kapatid” para sa kapuwa mananampalataya.'
    reason: lexical_alternative
  - marker: b
    text: Ang “ginawang banal” dito ay tumutukoy sa kalagayang ibinukod o itinalaga kaugnay ng sumasampalatayang asawa at ng sambahayan; hindi nito kinakailangang sabihin na personal nang naligtas ang asawang hindi sumasampalataya.
    reason: cultural_note
lexical_decisions:
- source_word: ἡγίασται
  choice: ginawang banal
  rationale: Ipinahahayag ng perpektong balintiyak ang isang naganap na pagkilos na may nananatiling bunga. Pinananatili ng “ginawang banal” ang kaugnayan nito sa ἅγιά nang hindi ipinapalagay na awtomatikong naligtas ang hindi sumasampalatayang asawa.
- source_word: ἄπιστος
  choice: hindi sumasampalataya
  rationale: Sa konteksto, tumutukoy ito sa asawang hindi naniniwala, hindi sa taong taksil o hindi mapagkakatiwalaan.
- source_word: ἐν
  choice: sa pamamagitan ng
  rationale: Ipinahahayag nito ang relasyonal o instrumental na diwa ng ἐν sa pagkakaugnay ng mag-asawa, bagaman literal din itong maaaring isaling “sa.”
- source_word: ἀνήρ / γυνή
  choice: asawang lalaki / asawang babae
  rationale: Malinaw na pag-aasawa ang konteksto, kaya mas tiyak ang mga katawagang ito kaysa “lalaki” at “babae.”
- source_word: ἀδελφῷ
  choice: kapatid na lalaki
  rationale: Pinananatili ang tiyak na salitang ginamit ni Pablo sa halip na tahimik itong gawing “asawang lalaki”; ipinapaliwanag sa talababa ang malamang na tinutukoy nito.
- source_word: ἐπεὶ ἄρα
  choice: kung hindi
  rationale: Natural nitong ipinakikilala sa Filipino ang kahihinatnan kung hindi totoo ang naunang pahayag.
- source_word: ἀκάθαρτα
  choice: marumi
  rationale: Pinananatili nito ang ritwal at tipanang pahiwatig ng salitang Griyego at ang tuwirang pagsalungat nito sa “banal.”
- source_word: νῦν δὲ
  choice: ngunit ang totoo
  rationale: Ipinakikita ang aktuwal na kalagayan bilang pagsalungat sa ipinagpalagay na kahihinatnan; hindi pangunahing temporal ang νῦν dito.
- source_word: ἅγιά
  choice: banal
  rationale: Pinananatili ang leksikal at teolohikal na ugnayan nito sa “ginawang banal.”
theological_decisions:
- issue: Kahulugan ng pagiging “ginawang banal” ng asawang hindi sumasampalataya
  choice: Panatilihin ang pahayag na “ginawang banal” at ipaliwanag lamang na hindi nito kinakailangang sabihin ang personal na kaligtasan.
  alternative: Isaling “ibinukod” o ipakahulugang awtomatikong naligtas ang asawa.
  rationale: Iniuugnay ng talata ang kalagayan ng asawa sa mananampalatayang kabiyak at sa kalagayan ng mga anak. Hindi tahasang nilulutas ng teksto ang buong teolohikal na saklaw ng kabanalan, kaya pinananatili ang tensiyon nito.
- issue: Tinutukoy ng ἀδελφῷ
  choice: “kapatid na lalaki” sa pangunahing teksto, na malamang ay ang sumasampalatayang asawang lalaki
  alternative: Direktang “asawang lalaki” o “sumasampalatayang asawa”
  rationale: Ang Griyego ay sadyang gumagamit ng ἀδελφός sa ikalawang sugnay sa halip na ulitin ang ἀνήρ. Pinananatili ito sa teksto at nililinaw sa talababa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “asawang lalaki/babae” para sa malinaw at likas na pagtukoy sa mag-asawa. Pinanatili ang “kapatid na lalaki” dahil iyon ang anyo ng Griyego, kalakip ang paliwanag sa talababa. Ang mga panandang [a] at [b] ay kapuwa nasa pangunahing teksto.
