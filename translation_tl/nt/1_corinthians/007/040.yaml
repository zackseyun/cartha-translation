  terminology: Ang “mas maligaya” ay angkop, at ang talababa para sa “mas pinagpala” ay wastong lexical alternative. Ang “Espiritu ng Diyos” ay angkop para sa πνεῦμα θεοῦ. Pinananatili ang “ayon sa aking pasiya” bilang maingat na pastoral na paghatol, hindi tuwirang utos.
