source:
  edition: SBLGNT
  text: μακαριωτέρα δέ ἐστιν ἐὰν οὕτως μείνῃ, κατὰ τὴν ἐμὴν γνώμην, δοκῶ ⸀δὲ κἀγὼ πνεῦμα θεοῦ ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/040.yaml
  text: But she is happier if she remains as she is[a], according to my judgment—and I think that I also have the Spirit of God.
translation:
  language: tl
  text: Ngunit mas maligaya siya kung mananatili siya sa ganoong kalagayan[a], ayon sa aking pasiya—at sa palagay ko, ako man ay may Espiritu ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mas pinagpala.” Ang salitang Griyego ay maaaring tumukoy sa higit na kaligayahan o sa higit na pagiging pinagpala.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακαριωτέρα
  choice: mas maligaya
  rationale: Likas na ipinapahayag sa modernong Filipino ang paghahambing at ang praktikal na payong pastoral; maaari rin itong mangahulugang ‘mas pinagpala,’ kaya inilagay ang alternatibo sa talababa.
- source_word: ἐὰν οὕτως μείνῃ
  choice: kung mananatili siyang gayon
  rationale: Pinananatili ang pagtukoy ng οὕτως sa kalagayan ng babaeng hindi muling nag-aasawa nang hindi nagdaragdag ng paliwanag na wala sa mismong talata.
- source_word: κατὰ τὴν ἐμὴν γνώμην
  choice: ayon sa aking pasiya
  rationale: Ang γνώμη ay isang pinag-isipang paghatol o pasiya, hindi basta kaswal na opinyon; ang salin ay nagpapanatili sa anyo nitong payo.
- source_word: δοκῶ
  choice: sa palagay ko
  rationale: Pinananatili ang mahinahong paraan ng pagpapahayag ni Pablo nang hindi ginagawang tunay na pag-aalinlangan ang kaniyang sinabi.
- source_word: κἀγὼ
  choice: ko rin
  rationale: Likas na naihahatid ang dagdag na diin ng ‘ako rin’ sa ayos ng pangungusap sa Filipino.
- source_word: πνεῦμα θεοῦ
  choice: ang Espiritu ng Diyos
  rationale: Sa gamit ni Pablo, malamang na tumutukoy ito sa Espiritu ng Diyos bilang personal na banal na Espiritu, hindi lamang sa espirituwal na disposisyon.
- source_word: ἔχειν
  choice: taglay
  rationale: Ang ‘taglay’ ay dignidad at natural na katumbas ng ‘mayroon/have’ sa pahayag na taglay ang Espiritu, nang hindi kasingbigat ng ‘nagmamay-ari.’
theological_decisions:
- issue: Kung ang πνεῦμα θεοῦ ay tumutukoy sa Banal na Espiritu o sa pangkalahatang espirituwal na disposisyon
  choice: ang Espiritu ng Diyos
  alternative: isang espiritung mula sa Diyos; espirituwal na pagkaunawang mula sa Diyos
  rationale: Karaniwang tinutukoy ng pariralang ito sa mga sulat ni Pablo ang Espiritu ng Diyos. Ipinahihiwatig dito na ang pasiya ni Pablo ay ginagabayan ng Espiritu, ngunit hindi ito ginagawang tuwirang utos ng Panginoon.
- issue: Lakas ng δοκῶ sa pag-angkin ni Pablo na taglay niya ang Espiritu
  choice: sa palagay ko
  alternative: marahil; iniisip ko
  rationale: Ang pahayag ay mapagpakumbaba sa retorika ngunit tunay na pag-angkin ng awtoridad na ginagabayan ng Espiritu; hindi ito dapat palabuin bilang pagdududa ni Pablo kung taglay nga niya ang Espiritu.
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang ‘mananatili siyang gayon’ upang mapanatili ang anaporikong pahayag ng Griyego, at ang ‘pasiya’ upang ihatid ang pinag-isipang pastoral na paghatol nang hindi ito itinuturing na tuwirang utos.
