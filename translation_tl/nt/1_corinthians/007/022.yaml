  text: ὁ γὰρ ἐν κυρίῳ κληθεὶς δοῦλος ἀπελεύθερος κυρίου ἐστίν· ⸀ὁμοίως ὁ ἐλεύθερος κληθεὶς δοῦλός ἐστιν Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/022.yaml
  text: For the servant who was called in the Lord is the Lord’s freedman[a]; likewise[b], the free man who was called is Messiah’s servant.
translation:
  language: tl
  text: Sapagkat ang alipin na tinawag sa Panginoon ay pinalayang tao ng Panginoon[a]; gayundin, ang malayang taong tinawag ay alipin ng Mesiyas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay tumutukoy lalo na sa isang dating alipin na pinalaya (isang freedperson o freedman). Maaari ring isalin na “malayang taong kabilang sa Panginoon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: alipin
  rationale: Pinananatili ng “alipin” ang kalagayang nakagapos at ang matalim na kabalintunaan sa talata; mas mahina rito ang “lingkod.”
- source_word: ἐν κυρίῳ
  choice: sa Panginoon
  rationale: Malapit ito sa anyong Griyego at hindi nito nilulutas nang labis kung ang diin ay nasa pakikipag-isa, saklaw, o kaugnayan sa Panginoon.
- source_word: κληθεὶς
  choice: tinawag / nang tawagin
  rationale: Kapuwa anyo ay likas na nagpapahayag ng pasibong pagtawag; pinili ang magkatugmang mga parirala ayon sa natural na daloy ng Tagalog.
- source_word: ἀπελεύθερος
  choice: taong pinalaya
  rationale: Walang karaniwang makabagong salitang Tagalog na eksaktong katumbas ng legal na “freedman.” Ipinakikita ng pariralang ito na ang tinutukoy ay dating alipin na pinalaya.
- source_word: ἐλεύθερος
  choice: taong malaya
  rationale: Malinaw nitong ipinapanatili ang panlipunang kaibahan sa “alipin” nang hindi gumagamit ng di-kinakailangang panlalaking anyo sa Tagalog.
- source_word: Χριστοῦ
  choice: ng Mesiyas
  rationale: Isinasalin ang Χριστός bilang titulong “Mesiyas” at ipinapahayag ng “ng” ang pag-aari o pagpapasakop sa kanya.
- source_word: κύριος
  choice: Panginoon
  rationale: Pinananatili ang teolohikal na titulong ginagamit para kay Jesus at hindi ito pinapaliit sa karaniwang ugnayang amo-alipin.
theological_decisions:
- issue: Ang kabalintunaan ng kalagayang panlipunan at pag-aari kay Cristo
  choice: Pinanatili ang “alipin” sa magkabilang kaugnay na pahayag at ang “taong pinalaya” sa unang pahayag.
  alternative: Gamitin ang mas banayad na “lingkod” o ang pangkalahatang “malayang tao.”
  rationale: 'Sinasadyang pagbaligtarin ni Pablo ang dalawang kalagayan: ang alipin sa lipunan ay pinalaya ng Panginoon, samantalang ang malaya sa lipunan ay alipin ng Mesiyas.'
- issue: Kahulugan ng genitibong κυρίου sa ἀπελεύθερος κυρίου
  choice: “taong pinalaya ng Panginoon”
  alternative: “malayang taong kabilang sa Panginoon” o “taong pinalaya na pag-aari ng Panginoon”
  rationale: Natural sa Tagalog ang napiling anyo at pinananatili ang kaugnayan sa Panginoon, bagaman maaaring marinig ang “ng” bilang ahensiya at hindi lamang pag-aari; inililinaw ng talababa ang terminong panlipunan-legal.
- issue: Pagturing sa Χριστός bilang titulo
  choice: “Mesiyas”
  alternative: “Cristo”
  rationale: Aktibo rito ang diwa ng titulo ng pinahirang hari, kaya “Mesiyas” ang ginamit nang hindi nagdaragdag ng paliwanag sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang magkatimbang na ayos ng dalawang bahagi at ang matinding kaibahan ng “alipin,” “pinalaya,” at “malaya.”
