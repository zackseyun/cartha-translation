  text: ὥστε καὶ ὁ ⸀γαμίζων ⸂τὴν παρθένον ἑαυτοῦ⸃ καλῶς ποιεῖ, ⸂καὶ ὁ⸃ μὴ ⸁γαμίζων κρεῖσσον ⸀ποιήσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/038.yaml
  text: So then[a], the one who gives his own virgin in marriage does well, and the one who does not give her in marriage will do better.
translation:
  language: tl
  text: Kaya, ang nagpapakasal sa kanyang birheng dalaga[a] ay gumagawa ng mabuti, at ang hindi ipinapakasal ang babae ay gagawa ng mas mabuti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang nag-aasawa sa kanyang birheng kasintahan ay gumagawa ng mabuti, at ang hindi nag-aasawa sa kanya ay gagawa ng mas mabuti.” Isa pang karaniwang pagkaunawa ay “ang kanyang dalagang anak.” Mas likas na nangangahulugang “ipakasal” ang pandiwang Griyego rito, kaya pinananatili sa pangunahing teksto ang diwang iyon nang hindi tahasang tinutukoy ang eksaktong kaugnayan ng dalaga sa lalaki.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: Kaya
  rationale: Likas na panandang Filipino para sa kongklusyong hinango mula sa naunang pangangatwiran.
- source_word: γαμίζων
  choice: nagpapakasal
  rationale: Pinananatili ang causative na diwa ng γαμίζω—ang ipakasal ang isang tao—at hindi ito itinutumbas sa simpleng 'magpakasal' (γαμέω).
- source_word: τὴν παρθένον ἑαυτοῦ
  choice: sa dalagang nasa pangangalaga niya
  rationale: Ipinahahayag ang παρθένος bilang 'dalaga' at ang kaugnayang isinasaad ng ἑαυτοῦ nang hindi tiyak na tinatawag siyang anak. Mas natural ito sa Filipino kaysa sa literal ngunit malabong 'sarili niyang dalaga.'
- source_word: καλῶς ποιεῖ
  choice: ay gumagawa ng mabuti
  rationale: Pinananatili ang positibong pagtataya ng Griyego nang hindi ito ginagawang ganap na utos o moral na obligasyon.
- source_word: μὴ γαμίζων
  choice: ang hindi nagpapakasal sa kanya
  rationale: Parehong causative na diwa ang pinananatili; ang 'sa kanya' ay tumutukoy sa naunang dalaga.
- source_word: κρεῖσσον ποιήσει
  choice: ay gagawa ng mas mabuti
  rationale: Pinananatili ang anyong pahambing ng κρεῖσσον at ang aspektong panghinaharap ng ποιήσει; hindi ito ginawang pasukdol na 'pinakamabuti.'
theological_decisions:
- issue: Ang tinutukoy ng τὴν παρθένον ἑαυτοῦ at ang kahulugan ng γαμίζω
  choice: Pinanatili sa pangunahing teksto ang causative na 'nagpapakasal' at ginamit ang 'dalagang nasa pangangalaga niya' upang hindi tukuying anak ang dalaga.
  alternative: Maaaring unawain na lalaki ang nagpapakasal sa kanyang birheng kasintahan; karaniwang paliwanag din na ama ang nagpapakasal sa kanyang dalagang anak.
  rationale: Mas karaniwang causative ang γαμίζω, ngunit pinagtatalunan ang eksaktong kaugnayan ng lalaki sa dalaga. Iniiwasan ng salin na magpasok ng isang tiyak na rekonstruksiyong panlipunan habang inilalahad sa talababa ang mahahalagang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'dalaga' bilang natural na katumbas ng παρθένος sa kontekstong pag-aasawa, habang nililinaw sa talababa ang alternatibong 'birhen.'
