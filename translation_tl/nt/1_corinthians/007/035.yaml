  text: τοῦτο δὲ πρὸς τὸ ὑμῶν αὐτῶν ⸀σύμφορον λέγω, οὐχ ἵνα βρόχον ὑμῖν ἐπιβάλω, ἀλλὰ πρὸς τὸ εὔσχημον καὶ ⸀εὐπάρεδρον τῷ κυρίῳ ἀπερισπάστως.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/035.yaml
  text: I say this for your own benefit, not to put a noose on you, but for what is proper and for undistracted devotion to the Lord.
translation:
  language: tl
  text: Sinasabi ko ito para sa sarili ninyong kapakanan, hindi upang lagyan kayo ng silò, kundi para sa nararapat at sa paglalaan ng sarili sa Panginoon nang walang pagkagambala.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “kundi para sa kung ano ang nararapat at sa palagiang pagtuon sa Panginoon nang walang pagkagambala.” Ang salitang Griyego para sa “paglalaan ng sarili” ay bihira at maaari ring tumukoy sa matatag na pagdalo o pagtutok sa Panginoon.'
    reason: Inilalahad ang posibleng mas literal na saklaw ng εὐπάρεδρον nang hindi nililimitahan ito sa iisang paliwanag.
lexical_decisions:
- source_word: σύμφορον
  choice: kapakanan
  rationale: Tumutukoy sa kung ano ang kapaki-pakinabang para sa mga kausap; natural sa Filipino ang pariralang “para sa sarili ninyong kapakanan.”
- source_word: βρόχον
  choice: silò
  rationale: Pinananatili ang matingkad na metapora ng bitag o panaling sumisilo, sa halip na gawing pangkalahatang “paghihigpit.”
- source_word: εὔσχημον
  choice: mamuhay ... nang marangal
  rationale: Ipinahahayag ang ideya ng angkop, kagalang-galang, o maayos na asal sa likas na modernong Tagalog.
- source_word: εὐπάρεδρον
  choice: makapaglingkod ... nang buong-puso
  rationale: Sa konteksto, ipinahihiwatig nito ang palagian at tapat na pagtuon o paglalaan ng sarili sa Panginoon; iniwasan ang literal ngunit di-likas na “palaging pag-upo sa tabi.”
- source_word: ἀπερισπάστως
  choice: walang abala
  rationale: Tumutukoy sa pagiging hindi nahihila sa iba’t ibang direksiyon o hindi nagagambala.
theological_decisions:
- issue: Layunin ng payo ni Pablo tungkol sa kalagayang walang asawa
  choice: Inilahad bilang para sa kapakanan nila, hindi bilang sapilitang tali o pagbabawal.
  alternative: Ipakahulugan bilang isang obligadong tuntunin na pumipigil sa pag-aasawa.
  rationale: Malinaw na itinatanggi ng οὐχ ἵνα βρόχον ὑμῖν ἐπιβάλω na ang layunin niya ay magpataw ng silò o mapilit na pagpigil.
- issue: Ugnayan ng εὔσχημον at εὐπάρεδρον
  choice: 'Pinanatili bilang dalawang magkaugnay na layunin: marangal na pamumuhay at buong-pusong paglilingkod sa Panginoon.'
  alternative: Pagsamahin ang dalawa bilang iisang teknikal na konsepto ng debosyon.
  rationale: Ang καὶ ay likas na nag-uugnay sa dalawang magkahiwalay ngunit magkakaugnay na parirala.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “kayo/ninyo” para sa pangmaramihang kausap at “Panginoon” para sa κύριος. Ang pangunahing teksto ay bahagyang idiomatiko upang maging natural, habang inilalagay sa talababa ang mas pormal na alternatibo.
