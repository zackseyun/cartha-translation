  yaml_path: translation/nt/1_corinthians/007/001.yaml
  text: 'Concerning the matters you wrote about: it is good for a man not to touch a woman.[a]'
translation:
  language: tl
  text: 'Tungkol naman sa mga bagay na isinulat ninyo: mabuti para sa isang lalaki na huwag humipo ng babae.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “humipo ng babae” ay malamang na isang idyomang tumutukoy sa pakikipagtalik. Ang salitang Griyego para sa “babae” ay maaari ring mangahulugang “asawa.”
    reason: Nililinaw ang malamang na kahulugan nang hindi inaalis sa pangunahing teksto ang idyoma at ang likas na kalabuan nito.
lexical_decisions:
- source_word: Περὶ δὲ ὧν ἐγράψατε
  choice: Tungkol naman sa mga bagay na isinulat ninyo
  rationale: Ipinahahayag ng “naman” ang paglipat sa paksang binanggit sa liham ng mga taga-Corinto, nang hindi nagdaragdag ng salitang katumbas ng temporal na “ngayon.”
- source_word: καλὸν ἀνθρώπῳ
  choice: mabuti para sa isang lalaki
  rationale: Pinananatili ang payak na pahayag na “mabuti,” at ang “isang lalaki” ay angkop sa konteksto ng kasunod na γυναικός.
- source_word: γυναικὸς μὴ ἅπτεσθαι
  choice: huwag humipo ng babae
  rationale: Pinananatili ang konkretong idyoma ng Griyego at ang posibleng retorikal na anyo nito; nililinaw sa talababa ang malamang na seksuwal na kahulugan at ang saklaw ng γυνή.
theological_decisions:
- issue: Kung ang pahayag na “mabuti…” ay sipi mula sa liham ng mga taga-Corinto o tuwirang pahayag ni Pablo
  choice: Hindi nilagyan ng panipi
  alternative: Ilagay sa panipi bilang tuwirang sipi mula sa mga taga-Corinto
  rationale: Hindi tiyak sa tekstong Griyego kung saan nagsisimula o nagtatapos ang isang sipi; ang pag-iwas sa panipi ay nagpapanatili sa tunay na interpretatibong kalabuan.
- issue: Kahulugan ng “huwag humipo ng babae”
  choice: Panatilihin ang idyoma sa pangunahing teksto at ipaliwanag sa talababa
  alternative: Isalin nang tuwiran bilang “huwag makipagtalik sa babae”
  rationale: Malamang na tumutukoy ito sa seksuwal na pakikipag-ugnayan, ngunit ang literal na idyoma ay maaaring mahalaga sa retorika at sa usapin kung ito ay pahayag ng mga taga-Corinto.
translation_notes:
  register: Makabago at dignified na Filipino. Ginamit ang “Tungkol naman” bilang natural na panandang lumilipat ng paksa, at pinanatili ang maigsi at mariing anyo ng talata.
