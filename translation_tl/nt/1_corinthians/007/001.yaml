  source_fidelity: Tapat ang salin sa Περὶ δὲ ὧν ἐγράψατε bilang paglipat sa mga usaping isinulat ng mga taga-Corinto, nang hindi nagdaragdag ng temporal na “ngayon.” Napananatili rin ng “mabuti para sa isang lalaki na huwag humipo ng babae” ang anyo, pangkalahatang pahayag, at idyomatikong kalabuan ng καλὸν ἀνθρώπῳ γυναικὸς μὴ ἅπτεσθαι.
  naturalness: Ang “Tungkol naman sa mga bagay na isinulat ninyo” ay malinaw at katanggap-tanggap na modernong Filipino para sa transisyong epistolaryo. Maikli at marangal ang register. Bagaman literal at bahagyang pormal ang “humipo ng babae,” sinasadya ito upang mapanatili ang idyoma at naaayos ng talababa ang posibleng maling pagbasa.
  terminology: Ang “lalaki” at “babae” ay angkop na pinananatiling malawak na katumbas ng ἀνήρ/ἄνθρωπος sa kontekstong ito at γυνή. Maingat ang talababa sa pagsasabing maaari ring “asawa” ang γυνή at sa pagtukoy sa malamang na seksuwal na saysay nang hindi ito ipinipilit sa pangunahing teksto.
