  text: Τοῖς δὲ γεγαμηκόσιν παραγγέλλω, οὐκ ἐγὼ ἀλλὰ ὁ κύριος, γυναῖκα ἀπὸ ἀνδρὸς μὴ χωρισθῆναι—
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/010.yaml
  text: 'To the married I give this command—not I[a], but the Lord: a wife must not separate from her husband—'
translation:
  language: tl
  text: 'Sa mga may-asawa naman, ito ang iniuutos ko—hindi ako, kundi ang Panginoon: ang asawang babae ay huwag humiwalay[a] sa kanyang asawa—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “makipagdiborsiyo sa kanyang asawa.” Ang pandiwang Griyego ay tumutukoy sa paghihiwalay ng mag-asawa at, ayon sa konteksto, maaaring kabilang dito ang diborsiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς δὲ γεγαμηκόσιν
  choice: Sa mga may asawa naman
  rationale: Ang ganap na pandiwaring γεγαμηκόσιν ay tumutukoy sa mga nasa kalagayang may asawa. Ang “naman” ay likas na naghahatid ng banayad na paglipat na ipinahihiwatig ng δέ, nang hindi ito ginagawang matinding pagsalungat.
- source_word: παραγγέλλω
  choice: iniuutos ko ito
  rationale: Ipinapahayag ng παραγγέλλω ang makapangyarihang tagubilin. Direkta at natural sa makabagong Tagalog ang “iniuutos ko ito.”
- source_word: οὐκ ἐγὼ ἀλλὰ ὁ κύριος
  choice: hindi ako, kundi ang Panginoon
  rationale: Pinananatili nito ang mariing paghahambing sa Griyego nang hindi dinaragdagan o nilulutas ang ipinahihiwatig na kaugnayan ng utos ni Pablo at ng turo ng Panginoon.
- source_word: γυναῖκα
  choice: ang isang babae
  rationale: Bagaman maaaring mangahulugang “babae” o “asawang babae” ang γυνή, malinaw na babaeng may asawa ang tinutukoy dahil sa pambungad at sa kaugnayan nito sa ἀνήρ. Ang “isang babae” ay natural sa pangkalahatang utos at hindi nangangailangan ng mabigat na pariralang “asawang babae.”
- source_word: ἀπὸ ἀνδρός
  choice: sa kanyang asawa
  rationale: Sa konteksto ng pag-aasawa, “asawa” ang kahulugan ng ἀνήρ. Nililinaw ng “kanyang” ang relasyon, gaya ng likas sa Tagalog.
- source_word: μὴ χωρισθῆναι
  choice: huwag humiwalay
  rationale: Inihahatid ng anyong pautos na “huwag” ang nilalaman ng παραγγέλλω. Pinananatili ng “humiwalay” ang saklaw ng χωρίζω bilang paghihiwalay ng mag-asawa nang hindi agad nililimitahan ito sa pormal at legal na diborsiyo.
theological_decisions:
- issue: Kahulugan ng “hindi ako, kundi ang Panginoon”
  choice: Pinanatili ang tuwirang paghahambing na “hindi ako, kundi ang Panginoon.”
  alternative: Ipaliwanag sa mismong teksto na ito ay isang utos na naunang itinuro ng Panginoong Jesus.
  rationale: Hindi tahasang ipinapaliwanag ng talata ang likas ng paghahambing. Pinananatili ng salin ang tensiyon at hindi ipinahihiwatig na itinatanggi ni Pablo ang awtoridad ng sarili niyang pananalita.
- issue: Saklaw ng χωρισθῆναι sa pag-aasawa
  choice: humiwalay
  alternative: makipagdiborsiyo
  rationale: Maaaring sumaklaw ang salita sa paghihiwalay na may legal na diborsiyo, ngunit mas malawak ang leksikal na saklaw nito. Ang “humiwalay” ay umaayon din sa pagpapatuloy ng argumento sa susunod na talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Panginoon” bilang karaniwang katumbas ng κύριος. Pinanatili ang pangwakas na gitling sapagkat nagpapatuloy ang pangungusap sa kasunod na talata.
