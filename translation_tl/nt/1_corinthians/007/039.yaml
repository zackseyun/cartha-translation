language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Γυνὴ ⸀δέδεται ἐφ’ ὅσον χρόνον ζῇ ὁ ἀνὴρ αὐτῆς· ἐὰν ⸀δὲ κοιμηθῇ ὁ ἀνήρ, ἐλευθέρα ἐστὶν ᾧ θέλει γαμηθῆναι, μόνον ἐν κυρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/039.yaml
  text: A wife is bound for as long as her husband lives[a]; but if her husband dies, she is free to be married to whom she wishes[b], only in the Lord.
translation:
  language: tl
  text: Ang isang asawang babae ay nakatali hangga’t nabubuhay ang kanyang asawang lalaki. Ngunit kung mamatay[a] ang kanyang asawang lalaki, malaya siyang magpakasal sa sinumang nais niya—ngunit sa Panginoon lamang.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “makatulog”; karaniwang eupemismo ito sa Griyego para sa kamatayan.
    reason: lexical_alternative
  - marker: b
    text: Ang “sa Panginoon lamang” ay karaniwang inuunawang pag-aasawa lamang sa isang taong kabilang sa Panginoon, samakatuwid ay kapwa mananampalataya. Maaari rin itong idiin ang pag-aasawang naaayon sa katapatan sa Panginoon.
    reason: alternative_reading
lexical_decisions:
- source_word: Γυνή
  choice: isang asawa
  rationale: Sa konteksto ng pag-aasawa at sa tahasang pagbanggit sa kanyang asawa, ang kahulugan dito ay ‘asawang babae,’ ngunit natural sa modernong Filipino ang ‘isang asawa.’
- source_word: δέδεται
  choice: ay nakatali
  rationale: Ang perpektong balintiyak ay nagsasaad ng nagpapatuloy na kalagayang may bisa; pinananatili ng ‘nakatali’ ang legal at relasyonal na diwa nang walang idinadagdag na ‘sa batas.’
- source_word: ἐφ’ ὅσον χρόνον ζῇ
  choice: habang nabubuhay
  rationale: Natural at tuwirang ipinahahayag nito ang buong tagal na tinutukoy ng pariralang Griyego.
- source_word: ὁ ἀνὴρ αὐτῆς
  choice: ang kanyang asawa
  rationale: Sa kontekstong ito, ang ἀνήρ ay nangangahulugang ‘asawang lalaki,’ hindi lamang ‘lalaki’; sapat at natural sa Filipino ang ‘asawa.’
- source_word: κοιμηθῇ
  choice: mamatay
  rationale: Bagaman literal na ‘makatulog,’ karaniwang eupemismo ito para sa kamatayan. Mas malinaw at natural sa pangunahing tekstong Filipino ang ‘mamatay,’ habang itinatala sa talababa ang talinghaga ng orihinal.
- source_word: ἐλευθέρα ἐστίν
  choice: malaya siya
  rationale: Malinaw nitong ipinahahayag ang paglaya mula sa dating bigkis ng pag-aasawa.
- source_word: ᾧ θέλει γαμηθῆναι
  choice: magpakasal sa sinumang nais niya
  rationale: Natural ito sa Filipino at tumpak na ipinahahayag ang kalayaang pumili ng mapapangasawa, kahit hindi ginagaya ang balintiyak na anyo ng infinitibo.
- source_word: μόνον ἐν κυρίῳ
  choice: ngunit sa Panginoon lamang
  rationale: Pinananatili nito ang maigsi at teolohikal na siksik na parirala ng Griyego, pati ang naghihigpit na puwersa ng μόνον, nang hindi agad nilulutas ang saklaw ng ‘sa Panginoon.’
theological_decisions:
- issue: Kahulugan ng ‘sa Panginoon’ sa tagubilin tungkol sa muling pag-aasawa
  choice: Pinanatili bilang ‘sa Panginoon lamang’ sa pangunahing teksto.
  alternative: ‘sa isang kapwa mananampalataya lamang’ o ‘sa paraang naaayon sa Panginoon lamang’
  rationale: Ang ἐν κυρίῳ ay maikli at maaaring tumukoy sa pag-aasawa sa isang kabilang sa Panginoon o, nang mas malawak, sa pag-aasawang nasa saklaw ng katapatan sa Panginoon. Hindi dapat paliitin ang tunay na ambiguwidad sa pangunahing teksto.
- issue: Eupemismo para sa kamatayan
  choice: Isinalin sa pangunahing teksto bilang ‘mamatay,’ na may talababa tungkol sa literal na talinghaga.
  alternative: ‘makatulog’ o ‘pumanaw’
  rationale: Sa kontekstong ito, malinaw na kamatayan ang idiomatikong kahulugan ng κοιμηθῇ. Ang ‘makatulog’ ay maaaring mapagkamalang karaniwang pagtulog sa Filipino, kaya ang tuwirang kahulugan ang ginamit habang pinananatili sa talababa ang anyo ng Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang ‘asawa’ ayon sa likas na gamit sa Filipino at iniwasan ang mas mabigat na ‘asawang babae/lalaki’ dahil malinaw na ang mga panghalip at konteksto. Pinanatili ang ‘sa Panginoon’ upang huwag lampasan ang interpretibong siksik na anyo ng orihinal.
