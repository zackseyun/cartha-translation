  to: Ang isang asawang babae ay nakatali hangga’t nabubuhay ang kanyang asawang lalaki. Ngunit kung mamatay[a] ang kanyang asawang lalaki, malaya siyang magpakasal sa sinumang nais niya—ngunit sa Panginoon lamang.[b]
