  terminology: Ang “umiiyak,” “nagagalak,” at “bumibili” ay angkop. Ang “nagmamay-ari” ay wastong pandiwang katapat ng κατέχοντες sa kontekstong ito at pinananatili ang kaibhan ng pagbili at aktuwal na pag-aangkin o pagmamay-ari.
