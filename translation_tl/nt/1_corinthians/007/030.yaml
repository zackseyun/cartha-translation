  text: καὶ οἱ κλαίοντες ὡς μὴ κλαίοντες, καὶ οἱ χαίροντες ὡς μὴ χαίροντες, καὶ οἱ ἀγοράζοντες ὡς μὴ κατέχοντες,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/030.yaml
  text: and those who weep as not weeping[a], and those who rejoice as not rejoicing, and those who buy as not possessing,
translation:
  language: tl
  text: at ang mga umiiyak ay parang hindi umiiyak,[a] at ang mga nagagalak ay parang hindi nagagalak, at ang mga bumibili ay parang hindi nagmamay-ari,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “na para bang hindi umiiyak … na para bang hindi nagagalak … na para bang hindi nagmamay-ari.” Inuulit sa Griyego ang pariralang “parang hindi” upang ilarawan ang paraan o saloobin, hindi upang sabihing hindi talaga nangyayari ang mga ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: κλαίοντες
  choice: mga umiiyak
  rationale: Tuwirang inilalarawan ng substantival na kasalukuyang participle ang mga taong umiiyak; hindi ito nilimitahan sa mas interpretibong “nagdadalamhati.”
- source_word: ὡς μὴ κλαίοντες
  choice: mamuhay na parang hindi umiiyak
  rationale: Ipinahahayag ng ὡς μή kasama ng participle ang paraan o saloobin sa pamumuhay, hindi ang pagtanggi na tunay silang umiiyak. Idinagdag ang “mamuhay” upang maging likas at malinaw sa Tagalog ang pira-pirasong pariralang Griyego.
- source_word: χαίροντες
  choice: mga nagagalak
  rationale: Karaniwan at marangal na katumbas ito ng χαίρω, at pinananatili ang pagkakatapat nito sa “mga umiiyak.”
- source_word: ὡς μὴ χαίροντες
  choice: parang hindi nagagalak
  rationale: Pinananatili nito ang paulit-ulit na ὡς μή at ang retorikal na pagkakatulad ng mga sugnay nang hindi itinuturing na ipinagbabawal ang kagalakan.
- source_word: ἀγοράζοντες
  choice: mga bumibili
  rationale: Ito ang pinakanatural at tuwirang modernong Tagalog para sa karaniwang gawaing komersiyal na tinutukoy ng participle.
- source_word: κατέχοντες
  choice: may pag-aari
  rationale: Sa konteksto ng pagbili, ang κατέχω ay tumutukoy sa pagkakaroon o pag-angkin sa binili. Ang “may pag-aari” ay mas natural sa Tagalog kaysa sa literal na participial na “nagmamay-ari” pagkatapos ng “parang hindi.”
- source_word: καὶ
  choice: at
  rationale: Inulit ang “at” upang mapanatili ang pinagsama-samang ritmo at magkakatulad na kayarian ng Griyego.
theological_decisions:
- issue: Diwa ng paulit-ulit na ὡς μή (“parang hindi”)
  choice: Panatilihin ang mga karaniwang damdamin at ari-arian nang hindi lubusang nagpapatali sa mga ito.
  alternative: Unawain ito bilang tahasang pagbabawal sa pag-iyak, pagkagalak, o pagbili.
  rationale: Ang ὡς μή kasama ng participle ay nagpapahiwatig ng paraan o tindig, hindi ng ganap na pagtanggi. Pinananatili ng salin ang eskatolohikal na tensiyon ng konteksto nang hindi nagdaragdag ng asetiko o denominasyonal na pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mamuhay” sa unang sugnay upang maging malinaw na ang “parang hindi” ay tumutukoy sa paraan ng pamumuhay; umaabot ang elipsis nito sa kasunod na magkakatulad na sugnay. Pinanatili ang pambungad at paulit-ulit na “at” dahil bahagi ang talata ng nagpapatuloy na pangungusap at retorikal na serye.
