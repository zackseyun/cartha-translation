base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/028.yaml
  text: But even if you marry[a], you have not sinned; and if the virgin marries, she has not sinned. Yet such people will have tribulation in the flesh[b], and I am sparing you.
translation:
  language: tl
  text: Ngunit kung mag-asawa ka man, hindi ka nagkasala; at kung mag-asawa ang birhen, hindi siya nagkasala. Gayunman, ang mga taong mag-aasawa ay makararanas ng paghihirap sa laman[a], ngunit nais kong hindi ninyo maranasan ang gayon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “makararanas ng kagipitan sa kanilang makalupang buhay.” Ang “laman” dito ay malamang na tumutukoy sa mga hirap ng buhay na may katawan na kaakibat ng pag-aasawa, hindi sa “makasalanang kalikasan.”
    reason: lexical_alternative
  - marker: b
    text: O “ngunit iniingatan ko kayo” o “ngunit nais ko kayong hindi pagdaanin sa gayon.” Ipinahahayag ni Pablo ang layunin niyang iligtas sila mula sa nabanggit na paghihirap sa diwang huwag nila itong maranasan, hindi pagliligtas sa teolohikal na diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: γαμήσῃς
  choice: mag-asawa ka
  rationale: Ang kondisyong ἐὰν ... γαμήσῃς ay likas na naihahayag sa Filipino bilang “kahit mag-asawa ka,” na tumutukoy sa posibleng pag-aasawa nang hindi ito ginagawang utos.
- source_word: ἥμαρτες / ἥμαρτεν
  choice: hindi ka/siya nagkasala
  rationale: Tuwirang itinatanggi ng aorist indicative na kasalanan ang pag-aasawa; natural sa modernong Tagalog ang payak na aspektong “nagkasala.”
- source_word: ἡ παρθένος
  choice: ang birhen
  rationale: Pinananatili ang tiyak at literal na kahulugan ng παρθένος sa halip na palawakin ito bilang “babaeng walang asawa.”
- source_word: θλῖψιν
  choice: paghihirap
  rationale: Saklaw ng θλῖψις ang kapighatian, kagipitan, o matinding hirap. Ang “paghihirap” ay malinaw at hindi awtomatikong nagbibigay rito ng eskatolohikal na kahulugan.
- source_word: τῇ σαρκὶ
  choice: sa laman
  rationale: Pinananatili ang kongkretong salita ni Pablo at ang posibilidad na tumukoy ito sa buhay na may katawan o sa makalupang kalagayan, sa halip na ipakahulugang “makasalanang kalikasan.”
- source_word: οἱ τοιοῦτοι
  choice: ang mga taong nag-aasawa
  rationale: Nililinaw sa natural na Tagalog ang tinutukoy na uri ng mga tao mula sa naunang dalawang sugnay, nang hindi nagdaragdag ng bagong pangkat.
- source_word: φείδομαι
  choice: nais ko kayong iligtas dito
  rationale: Ipinahahayag ang mapagkalingang layunin ng pandiwa—ang huwag silang mapasailalim sa nabanggit na hirap. Idinagdag ang “dito” upang maging malinaw ang kaugnayan nito sa paghihirap, habang inilalahad sa talababa ang mas pormal na anyo.
theological_decisions:
- issue: Kahulugan ng σάρξ sa τῇ σαρκί
  choice: “sa laman,” na malamang ay tumutukoy sa hirap sa makalupa o pangkatawang buhay
  alternative: “sa buhay na ito” o “sa katawan”; hindi “sa makasalanang kalikasan”
  rationale: Sa konteksto, nagbababala si Pablo tungkol sa hirap na mararanasan ng mga mag-aasawa, hindi tungkol sa doktrina ng likas na pagkamakasalanan. Pinananatili ng pangunahing teksto ang talinghaga at nililinaw ng talababa ang malamang na diwa.
- issue: Lakas at aspekto ng φείδομαι
  choice: “nais ko kayong iligtas dito” bilang pagpapahayag ng pastoral na layunin
  alternative: “iniiwas ko kayo rito” o “pinag-iingatan ko kayo”
  rationale: Maaaring ilarawan ng present tense ang kasalukuyang pagkilos o hangarin ni Pablo. Hindi tiyak na tagumpay ang ipinahihiwatig, kaya pinananatili sa talababa ang mga alternatibong pagbasa.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “mag-asawa” bilang karaniwang pandiwa para sa pagpasok sa pag-aasawa, “birhen” upang mapanatili ang partikularidad ng παρθένος, at “sa laman” upang huwag patahimikin ang tunay na semantikong tensiyon ng parirala.
