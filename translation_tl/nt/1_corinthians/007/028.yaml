  naturalness: Natural at marangal ang pangkalahatang Tagalog. Mas idiomatiko at mas tumpak ang “kung mag-asawa ka man” para sa kondisyong ἐὰν δὲ καὶ. Ang “mga taong mag-aasawa” ay mas malinaw na tumutukoy sa mga taong binanggit pa lamang kaysa sa kasalukuyang-aspektong “mga taong nag-aasawa.”
