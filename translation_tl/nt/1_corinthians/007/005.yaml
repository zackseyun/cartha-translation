- from: Huwag ninyong pagkaitan ang isa’t isa, maliban marahil kung kapwa kayo sumasang-ayon na gawin ito sa loob ng ilang panahon upang maiukol ninyo ang inyong sarili sa pananalangin. Pagkatapos, magsama kayong muli[a] upang hindi kayo tuksuhin ni Satanas dahil sa kawalan ninyo ng pagpipigil sa sarili.
  to: Huwag ninyong pagkaitan ang isa’t isa, maliban marahil kung kapwa kayo sumasang-ayon sa loob ng ilang panahon upang makapagtuon kayo sa pananalangin. Pagkatapos, muling magsama kayo upang hindi kayo tuksuhin ni Satanas dahil sa kawalan ninyo ng pagpipigil sa sarili.
  rationale: Pinalitan ang di-gaanong natural na “maiukol ninyo ang inyong sarili” ng “makapagtuon kayo,” at inayos ang “magsama kayong muli” bilang “muling magsama kayo” para sa mas likas na daloy. Inilagay ang talababa sa pariralang “muling magsama” upang mapanatili ang ugnayan ng paliwanag at ng katumbas nitong Griyego. Hindi binago ang kahulugan o ang mahinhing antas ng pagpapahayag ng talata.
