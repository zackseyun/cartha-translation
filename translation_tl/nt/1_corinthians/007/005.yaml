review_pass:
  verdict: revise
  source_fidelity: Tumpak na naihahatid ng draft ang pagbabawal sa magkabilang mag-asawa, ang eksepsiyong nakasalig sa kapwa pagsang-ayon at pansamantalang tagal, ang layuning pananalangin, ang muling pagsasama, at ang tukso ni Satanas dahil sa kakulangan ng pagpipigil sa sarili. Ang “magsama kayong muli” ay angkop na mahinhing katumbas ng πάλιν ἐπὶ τὸ αὐτὸ ἦτε.
  naturalness: May bahagyang di-natural na ayos ang “upang maiukol ninyo ang inyong sarili sa pananalangin.” Mas likas sa modernong Filipino ang “upang makapagtuon kayo sa pananalangin,” na pinananatili ang diwa ng sinasadyang paglalaan ng sarili sa pananalangin.
  terminology: Ang “pagkaitan,” “kapwa kayo sumasang-ayon,” “Satanas,” “tuksuhin,” at “kawalan ng pagpipigil sa sarili” ay wasto, malinaw, at angkop sa marangal ngunit modernong rehistro. Pinananatili ng “muling magsama” ang mahinhing pananalita ng Griyego nang hindi nagdaragdag ng tahasang detalye sa pangunahing teksto.
  issues:
  - severity: low
    issue: Bahagyang di-idiomatiko ang “maiukol ninyo ang inyong sarili sa pananalangin.”
    rationale: Nauunawaan ang parirala, ngunit mas natural na Filipino ang “makapagtuon kayo sa pananalangin.” Mas malinaw nito na ang pansamantalang pag-iwas ay upang malayang makapag-ukol ng pansin sa pananalangin.
  revised_text: Huwag ninyong pagkaitan ang isa’t isa, maliban marahil kung kapwa kayo sumasang-ayon sa loob ng ilang panahon upang makapagtuon kayo sa pananalangin. Pagkatapos, muling magsama kayo upang hindi kayo tuksuhin ni Satanas dahil sa kawalan ninyo ng pagpipigil sa sarili.
