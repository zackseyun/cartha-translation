source:
  edition: SBLGNT
  text: μὴ ἀποστερεῖτε ἀλλήλους, εἰ μήτι ἂν ἐκ συμφώνου πρὸς καιρὸν ἵνα ⸀σχολάσητε ⸀τῇ προσευχῇ καὶ πάλιν ἐπὶ τὸ αὐτὸ ⸀ἦτε, ἵνα μὴ πειράζῃ ὑμᾶς ὁ Σατανᾶς διὰ τὴν ἀκρασίαν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/005.yaml
  text: Do not deprive one another[a], except perhaps by mutual agreement for a time, so that you may devote yourselves to prayer, and then come together again[b], so that Satan may not tempt you because of your lack of self-control.
translation:
  language: tl
  text: Huwag ninyong pagkaitan ang isa’t isa, maliban marahil kung kapwa kayo sumasang-ayon sa loob ng ilang panahon upang makapagtuon kayo sa pananalangin. Pagkatapos, muling magsama kayo upang hindi kayo tuksuhin ni Satanas dahil sa kawalan ninyo ng pagpipigil sa sarili.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποστερεῖτε
  choice: pagkaitan
  rationale: Sa konteksto ng pag-aasawa, tumutukoy ito sa hindi pagbibigay sa asawa ng nararapat sa kaniya. Pinananatili ng “pagkaitan” ang etikal na bigat nang walang komersiyal na pahiwatig ng “dayain.”
- source_word: ἀλλήλους
  choice: ang isa’t isa
  rationale: Karaniwang katumbas na nagpapahayag ng kapwa at pantay na pananagutan ng mag-asawa.
- source_word: εἰ μήτι ἂν
  choice: maliban marahil
  rationale: Ipinahihiwatig ng parirala ang isang may-pasubali at hindi absolutong eksepsiyon.
- source_word: ἐκ συμφώνου
  choice: kung kapwa kayo sumasang-ayon
  rationale: Malinaw na ipinapakita ang magkasamang pagsang-ayon ng dalawang asawa, hindi ang pasiya ng isa lamang.
- source_word: πρὸς καιρόν
  choice: sa loob ng ilang panahon
  rationale: Ipinapakita ang pansamantala at limitadong tagal ng paghihiwalay.
- source_word: σχολάσητε
  choice: maiukol ninyo ang inyong sarili
  rationale: Ipinahahayag ang sinasadyang paglalaan ng sarili at panahon sa isang gawain.
- source_word: τῇ προσευχῇ
  choice: sa pananalangin
  rationale: Natural na Filipino para sa gawaing tinutukoy ng isahang pangngalang Griyego bilang pangkalahatang pagsasagawa ng panalangin.
- source_word: πάλιν ἐπὶ τὸ αὐτὸ ἦτε
  choice: magsama kayong muli
  rationale: Pinananatili ang mahinhing di-tuwirang pananalita ng Griyego tungkol sa muling pagsasama bilang mag-asawa, na sa konteksto ay malamang na kabilang ang relasyong seksuwal.
- source_word: πειράζῃ
  choice: tuksuhin
  rationale: Dahil si Satanas ang gumagawa at kasalanan ang panganib sa konteksto, pang-aakit sa pagkakasala ang diwa, hindi neutral na pagsubok.
- source_word: Σατανᾶς
  choice: Satanas
  rationale: Karaniwang transliterasyon sa Filipino ng personal na pangalan.
- source_word: ἀκρασίαν
  choice: kawalan ng pagpipigil sa sarili
  rationale: Malinaw at kasalukuyang pananalita para sa kakulangan ng pagpipigil, lalo na sa seksuwal na konteksto.
theological_decisions:
- issue: Kung ang πάλιν ἐπὶ τὸ αὐτὸ ἦτε ay dapat gawing tahasang pagtukoy sa muling pakikipagtalik o panatilihing mas pangkalahatan
  choice: “magsama kayong muli,” na may paliwanag sa talababa
  alternative: “muling makipagtalik” o “muling magtalik”
  rationale: Ipinahihiwatig ng konteksto ang pagpapanumbalik ng relasyong pangmag-asawa, malamang kasama ang seksuwal na pagsasama, ngunit mahinahon at di-tuwiran ang pananalita ni Pablo. Pinananatili ng salin ang gayong paraan ng pagpapahayag.
- issue: Kung ang ὁ Σατανᾶς ay personal na pangalan o pangkalahatang “kalaban”
  choice: Satanas
  alternative: ang kalaban
  rationale: Sa gamit dito ni Pablo, tumutukoy ito sa personal na nilalang na si Satanas; ang transliterasyon ay hindi nagpapalabo sa personal na reperensiya.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “pagkaitan” upang panatilihin ang lakas ng pagbabawal, at “magsama kayong muli” upang mapanatili ang mahinhing pahiwatig ng orihinal.
