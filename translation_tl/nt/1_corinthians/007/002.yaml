source:
  edition: SBLGNT
  text: διὰ δὲ τὰς πορνείας ἕκαστος τὴν ἑαυτοῦ γυναῖκα ἐχέτω, καὶ ἑκάστη τὸν ἴδιον ἄνδρα ἐχέτω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/002.yaml
  text: But because of sexual immoralities[a], let each man have his own wife, and let each woman have her own husband.
translation:
  language: tl
  text: Ngunit dahil sa mga gawaing seksuwal na imoral[a], ang bawat lalaki ay magkaroon ng sarili niyang asawang babae, at ang bawat babae ay magkaroon ng sarili niyang asawang lalaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “seksuwal na imoralidad” (pang-isahan). Pangmaramihan ang nasa Griyego: “mga seksuwal na imoralidad.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ δὲ
  choice: Ngunit dahil sa
  rationale: Ang διά na may accusative ay nagsasaad ng sanhi, at ang δέ ay banayad na pagsalungat o paglipat ng diwa. Pinananatili ng “Ngunit dahil sa” ang dalawang tungkuling ito.
- source_word: τὰς πορνείας
  choice: mga seksuwal na imoralidad
  rationale: Ang πορνεία ay tumutukoy sa seksuwal na asal na imoral. Pinananatili ng “mga seksuwal na imoralidad” ang pangmaramihang anyo ng Griyego, bagaman mas karaniwan sa Filipino ang pang-isahang abstraktong parirala.
- source_word: ἕκαστος
  choice: ang bawat lalaki
  rationale: Ang panlalaking pang-isahan, na katapat ng ἑκάστη at kaugnay ng asawa sa kasunod na parirala, ay tumutukoy rito sa bawat lalaki, hindi sa pangkalahatang “bawat isa.”
- source_word: τὴν ἑαυτοῦ γυναῖκα
  choice: ng sarili niyang asawa
  rationale: Maaaring mangahulugan ang γυνή na “babae” o “asawang babae,” ngunit malinaw na “asawa” ang diwa sa pagtutumbas nito sa ἄνδρα at sa konteksto ng pag-aasawa. Ipinahahayag ng “sarili niyang” ang reflexive na pagmamay-ari sa ἑαυτοῦ.
- source_word: ἐχέτω
  choice: magkaroon
  rationale: Ang pangatlong-panauhang pautos ay natural na naihahayag sa Filipino sa anyong “magkaroon.” Pinananatili nito ang lakas ng tagubilin nang hindi ginagawang tahasang “dapat magpakasal” o “kailangang magkaroon.”
- source_word: καὶ ἑκάστη
  choice: at ... ang bawat babae
  rationale: Ang pambabaeng pang-isahang distributive ay katapat ng unang sugnay. Ang “bawat babae” ay malapit sa anyo ng Griyego, habang nililinaw ng kasunod na “asawa” ang relasyong pangmag-asawa.
- source_word: τὸν ἴδιον ἄνδρα
  choice: ng sarili niyang asawa
  rationale: Maaaring mangahulugan ang ἀνήρ na “lalaki” o “asawang lalaki”; sa pagtutumbas nito sa γυνή at sa konteksto, “asawa” ang natural na salin. Ipinahahayag ng “sarili niyang” ang diin ng ἴδιον.
theological_decisions:
- issue: Kung ang talata ay dapat isaling bilang payong magpakasal upang makaiwas sa kasalanang seksuwal o bilang tagubilin tungkol sa ugnayang pangmag-asawa
  choice: Isinalin nang tuwiran ang pautos bilang pagkakaroon ng bawat lalaki at babae ng sarili niyang asawa dahil sa mga seksuwal na imoralidad.
  alternative: Mas interpretatibong “dapat magpakasal” o “gampanan ang tungkulin sa asawa.”
  rationale: ἐχέτω (“magkaroon”) ang ginamit ng Griyego, hindi isang tahasang pandiwa para sa pagpapakasal o pakikipagtalik ng mag-asawa. Kaya hindi nilulutas ng salin ang interpretatibo at teolohikal na tensiyong iniiwan ng teksto.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “seksuwal na imoralidad” bilang kasalukuyan at malawak na katumbas ng πορνεία; iniwasan ang mas luma o mas makitid na katawagan. Ang magkaparehong “asawa” ay natural sa Filipino kahit magkaiba ang kasarian ng mga salitang Griyego; nililinaw ng “lalaki” at “babae” ang parallelismo.
