  naturalness: Ang binagong ayos na may “ang bawat ... ay magkaroon” ay mas maayos at natural bilang pautos na pangatlong panauhan. Ang “asawang babae/asawang lalaki” ay bahagyang mas tiyak kaysa sa karaniwang “asawa,” ngunit kailangan dito upang mapanatili ang sinadyang parallelismo at kasariang nasa Griyego.
  terminology: Pinanatili ang malawak at makabagong “seksuwal na imoralidad” para sa πορνεία, habang ang pangunahing teksto ay gumagamit ng plural na “mga gawaing seksuwal na imoral.” Hindi isinasalin ang ἐχέτω bilang “magpakasal” o bilang tungkuling seksuwal, sapagkat hindi iyon tahasang sinasabi ng pandiwa.
