  text: βρῶμα δὲ ἡμᾶς οὐ ⸀παραστήσει τῷ θεῷ· οὔτε ⸂γὰρ ἐὰν φάγωμεν, περισσεύομεν, οὔτε ἐὰν μὴ φάγωμεν, ὑστερούμεθα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/008.yaml
  text: But food will not commend us to God[a]; for neither if we eat do we abound[b], nor if we do not eat do we lack.
translation:
  language: tl
  text: Ngunit hindi tayo ilalapit ng pagkain sa Diyos[a]. Sapagkat kung kumakain tayo, wala tayong kalamangan; at kung hindi tayo kumakain, wala rin tayong kakulangan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hindi tayo ihaharap ng pagkain sa Diyos” o “hindi tayo ilalapit ng pagkain sa Diyos.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “hindi tayo nagkakaroon ng higit kung kumakain tayo, at hindi tayo nagkukulang kung hindi tayo kumakain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βρῶμα
  choice: pagkain
  rationale: Pangkalahatang salita ito para sa anumang pagkain, hindi lamang karne o isang partikular na handa.
- source_word: παραστήσει
  choice: inilalapit
  rationale: Ipinahihiwatig ng pandiwa ang pagharap o pagdadala sa presensya ng Diyos. Ang “inilalapit” ay natural sa Filipino at naipahahayag ang kaugnayan sa Diyos nang hindi ipinapalagay na pisikal lamang ang pagharap; inilalahad sa talababa ang mas literal na posibilidad.
- source_word: τῷ θεῷ
  choice: sa Diyos
  rationale: Natural na katumbas ng datibo kasunod ng “inilalapit,” at pinananatili ang Diyos bilang pinatutunguhan.
- source_word: οὔτε γὰρ ἐὰν φάγωμεν, περισσεύομεν
  choice: Sapagkat kung kumakain tayo, wala tayong kalamangan
  rationale: Sa konteksto, ang περισσεύομεν ay tumutukoy sa pagkakaroon ng higit o ng bentahe, hindi lamang sa materyal na kasaganaan.
- source_word: οὔτε ἐὰν μὴ φάγωμεν, ὑστερούμεθα
  choice: at kung hindi tayo kumakain, wala rin tayong kakulangan
  rationale: Pinananatili nito ang tuwirang pagsalungat ng pagkakaroon ng higit at pagkukulang, nang hindi ginagawang tahasang moral na paghatol ang pahayag.
- source_word: δὲ
  choice: Ngunit
  rationale: Naghuhudyat ito ng banayad na pagsalungat sa naunang talakayan.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikilala nito ang paliwanag sa unang pahayag.
theological_decisions:
- issue: Kung ang παραστήσει ay tumutukoy sa paglapit sa Diyos, pagtanggap ng Diyos, o pangkalahatang katayuan sa harap niya
  choice: Isinalin bilang “inilalapit ... sa Diyos,” na nagsasaad na ang pagkain mismo ay hindi nagbibigay ng espirituwal na kalamangan sa kaugnayan sa Diyos.
  alternative: “ihaharap ... sa Diyos” o “gagawing katanggap-tanggap sa Diyos”
  rationale: Sinasaklaw ng pandiwa ang ideya ng pagharap o pagdadala sa Diyos, habang maaaring ipahiwatig ng konteksto ang pagtanggap o katayuan sa harap niya. Pinananatili ng pangunahing salin at talababa ang saklaw na ito sa halip na ipako sa iisang doktrinal na paliwanag.
translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Ginamit ang magkatimbang na mga pariralang “walang kalamangan” at “walang kakulangan” upang mapanatili ang paralelismo ng Griyego nang hindi nagiging matigas o lipas ang pananalita.
