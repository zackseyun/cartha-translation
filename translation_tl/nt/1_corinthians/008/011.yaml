  text: ⸂ἀπόλλυται γὰρ⸃ ὁ ἀσθενῶν ⸀ἐν τῇ σῇ γνώσει, ⸂ὁ ἀδελφὸς⸃ δι’ ὃν Χριστὸς ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/011.yaml
  text: For the weak one is destroyed by your knowledge—the brother for whom Messiah died[a][b][c].
translation:
  language: tl
  text: Sapagkat, ang mahina—ang kapatid[b] na para sa kaniya ay namatay ang Mesiyas[c]—ay napapahamak[a] dahil sa kaalaman mo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nasisira” o “nalilipol.” Ang salitang Griyego ay maaaring tumukoy sa matinding pagkawasak o kapahamakan; hindi nito kusang nilulutas kung ang tinutukoy ay espirituwal na pinsala sa kasalukuyan, pangwakas na kapahamakan, o kapuwa.
    reason: alternative_reading
  - marker: b
    text: Ang “kapatid” dito ay kapuwa mananampalataya; maaaring saklawin ng diwa nito ang isang kapatid na lalaki o babae sa pananampalataya.
    reason: lexical_alternative
  - marker: c
    text: Sa Griyego, Christos, isang titulong nangangahulugang “Mesiyas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόλλυται
  choice: napapahamak
  rationale: Ipinahahayag ng kasalukuyang anyo ng pandiwa ang nagaganap o ibinubungang matinding kapahamakan. Pinananatili ng “napapahamak” ang bigat ng salita nang hindi tiyakang nilulutas kung espirituwal na pagkawasak sa kasalukuyan, pangwakas na pagkapahamak, o kapuwa ang tinutukoy.
- source_word: γάρ
  choice: Sapagkat
  rationale: Nagbibigay ito ng paliwanag sa naunang babala at natural na naipahahayag sa Tagalog sa pamamagitan ng “Sapagkat.”
- source_word: ὁ ἀσθενῶν
  choice: ang mahina
  rationale: Ang substantival participle ay tumutukoy sa “taong mahina.” Pinananatili ng maikling pariralang ito ang isahang pokus at hindi inuuna ang salitang “kapatid,” na hiwalay na lumilitaw sa hulihan ng talata.
- source_word: ἐν τῇ σῇ γνώσει
  choice: dahil sa kaalaman mo
  rationale: Bagaman maaaring literal na “sa iyong kaalaman,” ang ἐν dito ay nagpapahiwatig ng sanhi o paraang nauugnay sa paggamit ng kaalaman. Ang “dahil sa” ay malinaw at natural sa Tagalog.
- source_word: γνῶσις
  choice: kaalaman
  rationale: Tumutugma ito sa terminolohiya ni Pablo sa agarang konteksto at pinananatili ang kabalintunaan na ang ipinagmamalaking kaalaman ay nakapipinsala sa kapuwa mananampalataya.
- source_word: ὁ ἀδελφός
  choice: ang kapatid
  rationale: Pinananatili nito ang tahasang pangngalang panlalaking isahan sa Griyego, habang nililinaw sa talababa ang diwang kapuwa mananampalataya.
- source_word: δι’ ὃν
  choice: na para sa kanya
  rationale: 'Natural nitong ipinahahayag ang diwang benefaktibo ng διά na may accusative: siya ang taong alang-alang sa kanya ay namatay ang Mesiyas.'
- source_word: Χριστός
  choice: Mesiyas
  rationale: Ang Χριστός ay gumaganap dito bilang titulo. Ang “Mesiyas” ay tuwirang nagpapakita ng titulong ito sa halip na ituring itong pangalang pantangi lamang.
- source_word: ἀπέθανεν
  choice: namatay
  rationale: Tuwiran at natural na salin ng aorist indicative na tumutukoy sa naganap na kamatayan.
theological_decisions:
- issue: Kung ang ἀπόλλυται ay tiyak na tumutukoy sa pangwakas at walang-hanggang kapahamakan ng isang tunay na mananampalataya
  choice: napapahamak
  alternative: nalilipol; nasisira
  rationale: Malawak ang saklaw ng pandiwa at maaaring magpahiwatig ng matinding pagkawasak o pagkapahamak. Hindi nilulutas ng salin ang usapin kung pansamantalang espirituwal na pinsala, eskatolohikal na kapahamakan, o kapuwa ang nasa isip ni Pablo.
- issue: Kung gagawing tahasang gender-inclusive ang ἀδελφός sa pangunahing teksto
  choice: kapatid
  alternative: kapatid na lalaki; kapuwa mananampalataya
  rationale: Ang “kapatid” ay natural sa Tagalog, maaaring tumugma sa panlalaking isahan ayon sa konteksto, at hindi kinakailangang magpasok ng kasariang hindi laging lantad sa karaniwang gamit. Nililinaw ng talababa ang kahulugang kapuwa mananampalataya.
- issue: Kung isasalin ang Χριστός bilang “Cristo” o “Mesiyas”
  choice: Mesiyas
  alternative: Cristo
  rationale: Dito ay malinaw na gumaganap ang Χριστός bilang titulo, kaya ipinahahayag ng “Mesiyas” ang titulong kahulugan nito at ang redemptibong bigat ng kanyang kamatayan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kaalaman mo” sa halip na mas pormal na “iyong kaalaman,” at pinanatili ang em dash upang idiin na ang “mahina” ay siya ring kapatid na para sa kanya ay namatay ang Mesiyas.
