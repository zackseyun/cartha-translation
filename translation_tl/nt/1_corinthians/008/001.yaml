base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/001.yaml
  text: 'Concerning food sacrificed to idols: we know that we all have knowledge[a]. Knowledge puffs up[b], but love builds up.'
translation:
  language: tl
  text: 'Tungkol naman sa mga pagkaing inihandog sa mga diyos-diyosan[a]: alam nating tayong lahat ay may kaalaman[b]. Ang kaalaman ay nagpapalaki ng ulo, ngunit ang pag-ibig ay nagpapatibay.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “karneng inihandog sa mga diyos-diyosan” o “mga bagay na inihandog sa mga diyos-diyosan.”
    reason: lexical_alternative
  - marker: b
    text: 'Maaaring inuulit o tinutukoy rito ni Pablo ang isang kasabihan ng mga taga-Corinto: “tayong lahat ay may kaalaman.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Tungkol naman sa
  rationale: Likas na panandang Tagalog para sa paglipat ni Pablo sa isang bagong paksa; ipinahihiwatig ng “naman” ang ugnayang pandiskurso nang hindi nagdaragdag ng temporal na “ngayon.”
- source_word: τῶν εἰδωλοθύτων
  choice: mga pagkaing inihandog sa mga diyos-diyosan
  rationale: Malinaw at hindi labis na nililimitahan sa karne ang mga bagay na inihandog sa pagsamba sa mga diyos-diyosan.
- source_word: οἴδαμεν
  choice: alam natin
  rationale: Tuwirang salin ng pandiwang may kasalukuyang diwa at natural sa modernong Tagalog.
- source_word: ὅτι πάντες γνῶσιν ἔχομεν
  choice: tayong lahat ay may kaalaman
  rationale: Pinananatili ang saklaw ng πάντες at ang pag-uulit ng salitang “kaalaman,” nang hindi nagpapasya sa pangunahing teksto kung ito ay sariling pahayag ni Pablo o isang kasabihan ng mga taga-Corinto.
- source_word: ἡ γνῶσις
  choice: Ang kaalaman
  rationale: Pinananatili ang tuwirang leksikal na ugnayan sa naunang γνῶσιν at ang pangkalahatang diwa ng abstraktong pangngalan.
- source_word: φυσιοῖ
  choice: nagpapalaki ng ulo
  rationale: Natural at malinaw na idyomang Tagalog na nagpapanatili sa larawan ng paglobo at sa diwa ng pagmamataas.
- source_word: ἡ δὲ ἀγάπη
  choice: ngunit ang pag-ibig
  rationale: Ang “ngunit” ay malinaw na naghahayag ng salungat na paghahambing, at “pag-ibig” ang karaniwan at malawak na katumbas ng ἀγάπη.
- source_word: οἰκοδομεῖ
  choice: nagpapatibay
  rationale: Naghahatid ng larawang may kaugnayan sa pagtatayo habang natural na tumutukoy sa pagpapalakas o pagpapaunlad ng iba.
theological_decisions:
- issue: Kung ang “tayong lahat ay may kaalaman” ay isang tuwirang pangkalahatang pahayag ni Pablo o pagbanggit/pag-alingawngaw sa isang kasabihan ng mga taga-Corinto
  choice: Iniwan sa pangunahing teksto nang walang panipi o tahasang paglayo ni Pablo
  alternative: Lagyan ng panipi bilang kasabihan ng mga taga-Corinto
  rationale: Walang tahasang pananda ng pagsipi sa Griyego. Pinananatili ng salin ang tunay na kalabuan at ipinauubaya sa konteksto ang retorikal na puwersa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “diyos-diyosan” bilang karaniwang katawagan sa mga idolo at ang idyomang “nagpapalaki ng ulo” upang maging natural ang matalinghagang φυσιοῖ. Inilagay ang mga talababa sa mismong pariralang tinutukoy ng bawat isa.
