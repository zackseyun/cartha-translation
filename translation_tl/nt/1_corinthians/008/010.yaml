revisions:
- from: Sapagkat kung makita ka ng isang tao—ikaw na may kaalaman—na nakahilig sa hapag sa loob ng templo ng isang diyus-diyosan, hindi ba ang budhi niya, palibhasa’y mahina, ay “mapatatag”[a] upang kumain ng mga pagkaing inihandog sa mga diyus-diyosan?
  to: Sapagkat kung makita ka ng isang tao—ikaw na may kaalaman—na nakahilig sa hapag sa loob ng templo ng isang diyus-diyosan, hindi ba mapatitibay ang budhi ng taong iyon, na mahina, upang kumain ng mga pagkaing inihandog sa mga diyus-diyosan?[a]
  rationale: Pinalitan ang «mapatatag» ng «mapatitibay» upang mas tapat na maipahayag ang οἰκοδομηθήσεται at inalis ang mga paniping wala sa pinagmulan. Inayos din ang pagkakaugnay ng «mahina» upang tumukoy nang malinaw sa taong nakakakita. Nananatili ang ambigwidad at retorikal na tensiyon ng talata, samantalang inilalagay sa talababa ang mas idiomatikong pagpapakahulugan.
