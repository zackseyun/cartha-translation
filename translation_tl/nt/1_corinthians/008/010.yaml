id: 1CO.8.10
reference: 1 Corinthians 8:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐὰν γάρ τις ἴδῃ σὲ τὸν ἔχοντα γνῶσιν ἐν εἰδωλείῳ κατακείμενον, οὐχὶ ἡ συνείδησις αὐτοῦ ἀσθενοῦς ὄντος οἰκοδομηθήσεται εἰς τὸ τὰ εἰδωλόθυτα ἐσθίειν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/010.yaml
  text: For if someone sees you[a], who have knowledge, reclining in an idol’s temple, will not his conscience, being weak, be built up to eat food sacrificed to idols?
translation:
  language: tl
  text: Sapagkat kung makita ka ng isang tao—ikaw na may kaalaman—na nakahilig sa hapag sa loob ng templo ng isang diyus-diyosan, hindi ba mapatitibay ang budhi ng taong iyon, na mahina, upang kumain ng mga pagkaing inihandog sa mga diyus-diyosan?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mahihikayat” o “magkakalakas-loob.” Sa literal, “mapatitibay”; malamang na ironiko rito ang karaniwang wika ni Pablo tungkol sa pagpapatibay.
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: Sapagkat
  rationale: Nagbibigay ito ng paliwanag o dahilan na kaugnay ng naunang babala at pinananatili ang daloy ng pangangatwiran.
- source_word: τις
  choice: isang tao
  rationale: Likas na salin ng di-tiyak na pang-isahang tinutukoy sa isang ipotetikong kalagayan.
- source_word: ἴδῃ
  choice: makita
  rationale: Kasama ng ἐὰν, bumubuo ito ng kondisyong maayos na ipinahahayag sa Tagalog sa pamamagitan ng “kung makita.”
- source_word: σὲ τὸν ἔχοντα γνῶσιν
  choice: ikaw na may kaalaman
  rationale: Pinananatili ang tuwirang pagtukoy sa kausap at ang paglalarawan sa kaniya bilang may kaalaman, sa natural na modernong Tagalog.
- source_word: γνῶσιν
  choice: kaalaman
  rationale: Pinananatili ang mahalagang ugnayang leksikal sa tema ng kaalaman sa buong kabanata.
- source_word: ἐν εἰδωλείῳ
  choice: sa loob ng templo ng isang diyus-diyosan
  rationale: Malinaw na ipinahahayag ang kultikong lugar na tinutukoy ng εἰδωλεῖον nang hindi ginagawang pangkalahatang templo ng maraming diyus-diyosan.
- source_word: κατακείμενον
  choice: nakahilig sa hapag
  rationale: Inilalarawan ang karaniwang postura sa pagkain noong panahong iyon; idinagdag ang “sa hapag” upang maging malinaw sa modernong mambabasa na pagkain ang konteksto.
- source_word: οὐχὶ
  choice: hindi ba
  rationale: Pinananatili ang retorikal na tanong na umaasang sasang-ayon ang mambabasa.
- source_word: ἡ συνείδησις αὐτοῦ
  choice: ang budhi niya
  rationale: Direkta at likas na salin ng moral na kamalayang tinutukoy.
- source_word: ἀσθενοῦς ὄντος
  choice: palibhasa’y mahina
  rationale: Pinananatili ang paglalarawan sa kalagayan ng taong nakakakita; sadyang hindi nililinaw kung gramatikal na nakatuon ang kahinaan sa tao o sa kaniyang budhi.
- source_word: οἰκοδομηθήσεται
  choice: “mapatatag”
  rationale: Pinananatili ang metaporang pagtatayo o pagpapatibay at ang malamang na ironya ni Pablo, sapagkat ang bunga rito ay nakapipinsala. Ang panipi at talababa ay nagpapahiwatig ng di-karaniwang paggamit nang hindi inaalis ang tensiyon.
- source_word: εἰς τὸ τὰ εἰδωλόθυτα ἐσθίειν
  choice: upang kumain ng mga pagkaing inihandog sa mga diyus-diyosan
  rationale: Natural na ipinahahayag ang resultang o tendensiyang kahulugan ng konstruksyon at tumpak na tinutukoy ang pagkaing inihandog sa mga diyus-diyosan.
theological_decisions:
- issue: Ang kahulugan ng οἰκοδομηθήσεται sa konteksto ng nakapipinsalang panggagaya
  choice: “mapatatag”
  alternative: mahihikayat / magkakalakas-loob
  rationale: Karaniwang salita ito ni Pablo para sa pagpapatibay, ngunit ironiko rito dahil itinutulak ang mahinang tao sa gawaing salungat sa kaniyang budhi. Pinananatili ng “mapatatag” ang metapora at tensiyon; inilalagay sa talababa ang mas tuwirang pragmatikong diwa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “budhi” sa halip na mas teknikal na “konsensiya,” at “nakahilig sa hapag” upang maipakita ang sinaunang postura sa pagkain nang malinaw. Ang mga gitling na pahaba sa “ikaw na may kaalaman” ay nagpapanatili sa diin ng Griyegong parirala.
