  text: οὕτως δὲ ἁμαρτάνοντες εἰς τοὺς ἀδελφοὺς καὶ τύπτοντες αὐτῶν τὴν συνείδησιν ἀσθενοῦσαν εἰς Χριστὸν ἁμαρτάνετε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/012.yaml
  text: And so[a], by sinning against the brothers in this way and wounding their weak conscience[c][b], you are sinning against Messiah.
translation:
  language: tl
  text: Kaya, sa pagkakasala ninyo laban sa mga kapatid[a] sa ganitong paraan at sa pagsugat ninyo sa kanilang mahinang budhi, nagkakasala kayo laban sa Mesiyas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga kapatid” dito ay tumutukoy sa mga kapwa mananampalataya at kabilang dito ang mga lalaki at babae.
    reason: lexical_alternative
  - marker: b
    text: O “Cristo.” Ang salitang Griyego ay Χριστός (Christos), isang titulong nangangahulugang “Mesiyas” o “Pinahiran.”
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως δὲ
  choice: Kaya ... sa ganitong paraan
  rationale: Pinananatili ng “Kaya” ang banayad na pag-uugnay o paghinuha ng δέ, habang ang “sa ganitong paraan” ay tumutukoy pabalik sa paraang inilalarawan sa naunang konteksto ng οὕτως.
- source_word: ἁμαρτάνοντες εἰς τοὺς ἀδελφοὺς
  choice: sa pagkakasala ninyo laban sa mga kapatid
  rationale: Ipinakikita ng pariralang may “sa pagkakasala” ang ugnayang pangparaan ng participle sa pangunahing pandiwa; ang εἰς kasunod ng ἁμαρτάνω ay may diwang “laban sa.” Ang “mga kapatid” ay likas na katawagan sa Filipino para sa mga kapwa mananampalataya.
- source_word: τύπτοντες
  choice: sa pagsugat
  rationale: Bagaman literal na tumutukoy sa paghampas, matalinghaga rito ang τύπτω. Ang “pagsugat” ay natural sa Filipino at pinananatili ang matindi at nakapipinsalang larawan.
- source_word: αὐτῶν τὴν συνείδησιν ἀσθενοῦσαν
  choice: sa mahina nilang budhi
  rationale: Ang “budhi” ay malinaw at karaniwang katumbas ng συνείδησις. Pinananatili ng isahan ang anyo ng Griyego at ang distributibong diwa, samantalang ang “mahina” ay natural na paglalarawan sa ἀσθενοῦσαν.
- source_word: εἰς Χριστὸν ἁμαρτάνετε
  choice: nagkakasala kayo laban sa Mesiyas
  rationale: Muling nagpapahayag ang εἰς ng direksiyong laban sa isang persona. Ipinakikita ng “nagkakasala kayo” ang nagpapatuloy na aspekto ng present indicative. Isinasalin ang titularyong Χριστός bilang “Mesiyas.”
theological_decisions:
- issue: Saklaw ng ἀδελφοὺς sa pamayanang mananampalataya
  choice: mga kapatid
  alternative: mga kapatid na lalaki at babae; mga kapwa mananampalataya
  rationale: Masaklaw sa kasarian ang karaniwang gamit ng “mga kapatid” sa modernong Filipino at maaari itong tumukoy sa lahat ng kapwa mananampalataya nang hindi dinaragdagan ang teksto.
- issue: Pagkakasalin sa Χριστόν
  choice: Mesiyas
  alternative: Cristo
  rationale: Tunay na titulo ang Χριστός, kaya pinananatili ng “Mesiyas” ang kahulugang “Pinahiran.” Inilalagay sa talababa ang tradisyonal na “Cristo” bilang lehitimong alternatibo.
- issue: Ugnayan ng pagkakasala laban sa kapatid at laban sa Mesiyas
  choice: 'Pinanatili bilang tuwirang pagkakakilanlan ng bigat ng kilos: ang pananakit sa budhi ng kapatid ay pagkakasala laban sa Mesiyas'
  alternative: Ipaliwanag bilang hindi tuwirang pagkakasala lamang laban sa Mesiyas
  rationale: Tuwiran at walang paliwanag na pampaluwag ang Griyego; hindi dapat bawasan ang teolohikal na diin nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “budhi” sa halip na mas teknikal na “konsensiya,” at pinanatili ang paulit-ulit na “nagkakasala” upang maihatid ang retorikal at teolohikal na diin ng orihinal.
