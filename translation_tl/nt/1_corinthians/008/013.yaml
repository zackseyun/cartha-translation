  naturalness: Maliwanag at moderno ang draft. Mas tuwiran at mas natural sa isang tekstong pampanitikan ang magkatugmang “nagpapatisod” at “mapatisod,” kaysa sa paulit-ulit na mahaba at abstraktong “nagiging/maging dahilan ng pagkakasala.”
  terminology: Ang “magpatisod” ay malapit sa pangunahing larawan ng σκανδαλίζω at pinananatili ang saklaw nito; ang kontekstuwal na ugnay sa pagkakasala ay hindi kailangang ipasok sa mismong salin. Ang “Kaya nga” ay bahagyang mas angkop sa diin ng διόπερ.
