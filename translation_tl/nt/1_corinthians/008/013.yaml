  text: διόπερ εἰ βρῶμα σκανδαλίζει τὸν ἀδελφόν μου, οὐ μὴ φάγω κρέα εἰς τὸν αἰῶνα, ἵνα μὴ τὸν ἀδελφόν μου σκανδαλίσω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/013.yaml
  text: Therefore, if food causes my brother to stumble, I will certainly never eat meat forever, so that I may not cause my brother to stumble.
translation:
  language: tl
  text: Kaya nga, kung ang pagkain ay nagpapatisod sa kapatid ko, hindi na ako kakain ng karne magpakailanman, upang hindi ko mapatisod ang kapatid ko.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διόπερ
  choice: Kaya
  rationale: Natural at malinaw na naghahayag ng matibay na kongklusyon mula sa naunang pangangatwiran.
- source_word: βρῶμα
  choice: pagkain
  rationale: Pangkalahatang katawagan ito sa pagkain, na ipinag-iiba sa mas tiyak na κρέα, “karne,” sa kasunod na sugnay.
- source_word: σκανδαλίζει / σκανδαλίσω
  choice: nagiging dahilan ng pagkakasala / maging dahilan ng pagkakasala
  rationale: Sa konteksto, hindi lamang ito simpleng pagkatisod o pagkayamot kundi pag-udyok sa kapatid na kumilos laban sa budhi at sa gayon ay magkasala.
- source_word: τὸν ἀδελφόν μου
  choice: kapatid ko
  rationale: Pinananatili ang pang-isahang anyo at ang ugnayang pampananampalataya na ipinahihiwatig ng konteksto.
- source_word: οὐ μὴ φάγω
  choice: hinding-hindi na ako kakain
  rationale: Ipinahahayag ang napakalakas na pagtanggi ng οὐ μή kasama ng aorist subjunctive sa natural na Filipino.
- source_word: κρέα
  choice: karne
  rationale: Tiyak na tumutukoy sa laman o karne bilang pagkain, kaiba sa pangkalahatang βρῶμα.
- source_word: εἰς τὸν αἰῶνα
  choice: magpakailanman
  rationale: Direktang pinananatili ang matinding, literal na saklaw ng parirala sa halip na paliitin ito sa “kailanman” o “muli.”
- source_word: ἵνα μὴ
  choice: upang hindi
  rationale: Malinaw na pinananatili ang layuning ipinahahayag ng sugnay.
theological_decisions:
- issue: Saklaw ng pangakong umiwas sa karne
  choice: magpakailanman
  alternative: hindi na kailanman / hindi na muli
  rationale: Ang εἰς τὸν αἰῶνα ay sadyang mariin; pinananatili ng salin ang retorikal na lakas nito nang hindi ito ginagawang pangkalahatang utos sa lahat.
- issue: Kahulugan ng σκανδαλίζω
  choice: maging dahilan ng pagkakasala
  alternative: magpatisod / makasakit ng damdamin
  rationale: Ang konteksto ng kabanata ay ang pag-akay sa kapatid na lumabag sa kaniyang budhi, kaya mas angkop ang moral na diwa kaysa pisikal na pagkatisod o simpleng pagkayamot.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Pinanatili ang paralelismo ng dalawang paglitaw ng σκανδαλίζω at ang mariing pananalita ni Pablo, habang iniwasan ang artipisyal na literalismong “kakain ng karne magpakailanman.”
