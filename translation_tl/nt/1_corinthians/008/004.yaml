  text: Περὶ τῆς βρώσεως οὖν τῶν εἰδωλοθύτων οἴδαμεν ὅτι οὐδὲν εἴδωλον ἐν κόσμῳ, καὶ ὅτι οὐδεὶς ⸀θεὸς εἰ μὴ εἷς.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/004.yaml
  text: Therefore[a], concerning the eating of food sacrificed to idols, we know that an idol is nothing in the world[b], and that there is no God except one.
translation:
  language: tl
  text: Kaya, tungkol sa pagkain ng pagkaing inihandog sa mga diyus-diyosan, alam natin na ang diyus-diyosan ay walang tunay na pag-iral sa mundo,[a] at walang Diyos maliban sa iisa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang diyus-diyosan ay wala sa mundo.”
    reason: lexical_alternative
  - marker: b
    text: O, “walang diyos maliban sa isa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βρώσεως
  choice: pagkain
  rationale: Tumutukoy ang pangngalan sa mismong gawa ng pagkain. Sa pariralang “tungkol sa pagkain,” malinaw at natural sa modernong Tagalog ang pandiwang diwa nito.
- source_word: εἰδωλοθύτων
  choice: mga inihandog sa mga diyus-diyosan
  rationale: Tumutukoy ito sa mga pagkaing kaugnay ng paghahandog sa mga diyus-diyosan. Hindi ito nilimitahan sa karne lamang, ayon sa lawak ng salitang Griyego.
- source_word: οἴδαμεν
  choice: alam natin
  rationale: Pinananatili nito ang kasalukuyang diwa ng pandiwa at ang retorikal na pag-apela ni Pablo sa kaalamang itinuturing na magkakasalo sila.
- source_word: οὐδὲν εἴδωλον
  choice: ang diyus-diyosan ay walang tunay na pag-iral
  rationale: Ipinahahayag nito ang pagiging di-totoo o walang realidad ng diyus-diyosan bilang diyos, sa halip na sabihing maliit lamang ang halaga nito. Inilalagay sa talababa ang mas literal at siksik na anyo.
- source_word: ἐν κόσμῳ
  choice: sa mundo
  rationale: Natural itong katumbas ng κόσμος bilang larangan ng umiiral na daigdig o realidad.
- source_word: οὐδεὶς θεὸς εἰ μὴ εἷς
  choice: walang Diyos maliban sa iisa
  rationale: Malinaw at tuwirang pinananatili nito ang eksklusibong pahayag na iisa lamang ang Diyos, nang hindi nagdaragdag ng paliwanag na wala sa teksto.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinakikita nito ang lohikal na paglipat mula sa naunang talakayan, at mas natural ito sa kasalukuyang Tagalog kaysa sa mas mabigat na “Samakatuwid.”
theological_decisions:
- issue: Ang pahayag ni Pablo tungkol sa mga diyus-diyosan at sa pagiging iisa ng Diyos
  choice: Isinalin bilang matibay na pahayag na walang tunay na pag-iral ang diyus-diyosan bilang diyos at na walang Diyos maliban sa iisa.
  alternative: Maaaring gawing mas literal ang unang sugnay bilang “ang diyus-diyosan ay walang anuman sa mundo,” at maaaring gamitin ang maliit na titik sa “diyos” sa ikalawang sugnay.
  rationale: Pinananatili ng salin ang dalawang magkaugnay na punto ng Griyego—ang kawalan ng realidad ng mga diyus-diyosan bilang mga diyos at ang pagiging iisa ng Diyos—nang hindi ipinapasok ang mas huling pormulasyong teolohikal.
translation_notes:
  register: Gumamit ng natural, kasalukuyan, at marangal na Tagalog. Ang “mga inihandog” ay nauunawaan mula sa konteksto bilang mga pagkain at umiiwas sa di-kinakailangang paglilimita sa karne. Ang mga panandang [a] at [b] ay inilagay agad sa mga sugnay na tinutukoy ng bawat talababa.
