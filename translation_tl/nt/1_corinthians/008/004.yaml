revisions:
- from: Kaya, tungkol sa pagkain ng mga inihandog sa mga diyus-diyosan, alam natin na ang diyus-diyosan ay walang tunay na pag-iral sa mundo,[a] at walang Diyos maliban sa iisa.[b]
  to: Kaya, tungkol sa pagkain ng pagkaing inihandog sa mga diyus-diyosan, alam natin na ang diyus-diyosan ay walang tunay na pag-iral sa mundo,[a] at walang Diyos maliban sa iisa.[b]
  rationale: Nilinaw ang εἰδωλοθύτων bilang “pagkaing inihandog” upang maipahayag ang tinutukoy na handog na pagkain at ang akto ng pagkain nito. Inayos ang talababa a upang hindi magbigay ng maling kahulugan sa predikatibong οὐδὲν εἴδωλον, habang pinananatili ang pangunahing saling “walang tunay na pag-iral,” na ligtas at tumpak na pagpapahayag ng puwersa ng teksto.
