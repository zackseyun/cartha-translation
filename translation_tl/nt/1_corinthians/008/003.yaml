  text: But if anyone loves God[a], this one is known by him.
translation:
  language: tl
  text: Ngunit kung iniibig ng sinuman ang Diyos, siya ay kilala ng Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kinikilala ng Diyos” o “nakilala na ng Diyos.” Maaaring ipahiwatig ng perfect passive sa Griyego ang nagpapatuloy na kalagayan ng pagiging kilala ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δέ
  choice: Ngunit kung
  rationale: Pinananatili ng “kung” ang kondisyon at ng “ngunit” ang banayad na pagsalungat sa naunang pagtalakay tungkol sa kaalamang nagpapalalo at pag-ibig na nagpapatibay.
- source_word: τις
  choice: sinuman
  rationale: Likas at inklusibong panumbas sa di-tiyak at pangkalahatang panghalip.
- source_word: ἀγαπᾷ
  choice: iniibig
  rationale: Tuwirang salin ng pangkasalukuyang pandiwa ἀγαπάω; marangal at natural sa konteksto ng pag-ibig sa Diyos.
- source_word: τὸν θεόν
  choice: ang Diyos
  rationale: Karaniwang anyong Tagalog para sa tiyak na layon na tumutukoy sa Diyos.
- source_word: οὗτος
  choice: siya
  rationale: Malinaw na tumutukoy sa taong kababanggit lamang. Ang mas literal na “ang taong iyon” ay maaaring magtunog malayo o mapangbukod sa natural na Tagalog.
- source_word: ἔγνωσται
  choice: ay kilala
  rationale: Inihahayag ang kasalukuyang kalagayang bunga ng naunang pagkilala, na angkop sa perfect passive, nang hindi nililimitahan ang kahulugan sa simpleng pagkaalam, pagsang-ayon, o kaligtasan.
- source_word: ὑπ’ αὐτοῦ
  choice: ng Diyos
  rationale: Inuulit ang malinaw na pinatutungkulan ng panghalip upang maiwasan ang alanganing Tagalog na “niya” at mapanatili ang passive na diwa.
theological_decisions:
- issue: Kahulugan ng pagkilala ng Diyos sa tao
  choice: “kilala ng Diyos,” na pinananatiling malawak ang relasyonal na diwa
  alternative: “kinikilala ng Diyos,” “sinang-ayunan ng Diyos,” o “nakilala na ng Diyos”
  rationale: Maaaring magpahiwatig ang γινώσκω na ang Diyos ang simuno ng relasyonal na pagkilala o pagtanggap, hindi lamang ng kaalamang pangkaisipan. Hindi ipinipilit ng Griyego rito ang isang mas makitid na doktrinal na pakahulugan.
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “iniibig” sa halip na mas kolokyal na “minamahal” upang tumugma sa biblikal ngunit madaling maunawaang rehistro. Inulit ang “Diyos” sa hulihan para sa linaw ng tinutukoy.
