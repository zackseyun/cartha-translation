source:
  edition: SBLGNT
  text: Ἀλλ’ οὐκ ἐν πᾶσιν ἡ γνῶσις· τινὲς δὲ τῇ ⸀συνηθείᾳ ⸂ἕως ἄρτι τοῦ εἰδώλου⸃ ὡς εἰδωλόθυτον ἐσθίουσιν, καὶ ἡ συνείδησις αὐτῶν ἀσθενὴς οὖσα μολύνεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/007.yaml
  text: But not everyone has this knowledge[a]. Some, through familiarity with the idol until now, eat it as food sacrificed to an idol, and their conscience, being weak[b], is defiled.
translation:
  language: tl
  text: Ngunit hindi taglay ng lahat ang kaalamang ito. May ilan na, dahil sa nakagawiang kaugnayan nila sa diyus-diyosan hanggang ngayon[a][b], ay kumakain nito bilang pagkaing inihandog sa diyus-diyosan, at ang kanilang budhi, na mahina, ay nadudungisan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaaring mas literal na isalin: “dahil sa nakagawian hanggang ngayon na may kaugnayan sa diyus-diyosan.” Mahirap ang pariralang Griyego; ipinahihiwatig nito na ang ilan ay nasa ilalim pa rin ng impluwensiya ng kanilang nakagawiang kaugnayan sa pagsamba sa diyus-diyosan.'
    reason: lexical_alternative
  - marker: b
    text: Ilang manuskrito ang may “budhi” o kaugnay na ibang pagbasa sa bahaging ito, na nagbubunga ng pagbasa na may kaugnayan sa “budhi tungkol sa diyus-diyosan.” Sinusunod ng pangunahing teksto ang SBLGNT.
    reason: textual_variant
lexical_decisions:
- source_word: γνῶσις
  choice: kaalaman
  rationale: Pinananatili nito ang ugnayan sa naunang pahayag tungkol sa nalalaman ng mga taga-Corinto at sa pagkilalang walang tunay na pag-iral ang diyus-diyosan bilang isang diyos.
- source_word: συνήθεια
  choice: nakagawiang kaugnayan
  rationale: Saklaw nito kapwa ang diwa ng nakasanayang gawain at ang patuloy na impluwensiya ng dating kaugnayan sa pagsamba sa diyus-diyosan, nang hindi lubusang nilulutas ang mahirap na pariralang Griyego.
- source_word: ἕως ἄρτι τοῦ εἰδώλου
  choice: sa diyus-diyosan hanggang ngayon
  rationale: Hayagang pinananatili ang χρονological na diwa ng ἕως ἄρτι (‘hanggang ngayon’) at iniuugnay ang parirala sa nakagawiang kaugnayan sa diyus-diyosan.
- source_word: εἰδωλόθυτον
  choice: pagkaing inihandog sa diyus-diyosan
  rationale: Natural sa makabagong Tagalog at malinaw na tumutukoy sa pagkaing may kaugnayan sa paghahandog sa diyus-diyosan.
- source_word: συνείδησις
  choice: budhi
  rationale: Karaniwang salin sa kontekstong moral at etikal; tumutukoy sa panloob na pagkilala kung tama o mali ang isang kilos.
- source_word: ἀσθενής
  choice: mahina
  rationale: Pinananatili ang terminong ginagamit ni Pablo sa kabanatang ito para sa budhing hindi matatag tungkol sa usaping ito.
- source_word: μολύνεται
  choice: nadudungisan
  rationale: Ipinahahayag ang moral na pagkontamina ng budhi habang pinananatili ang pasibong anyo at bigat ng larawan.
theological_decisions:
- issue: Kung paano ilalarawan ang pagkain nang hindi ipinahihiwatig na tunay na mga diyos ang mga diyus-diyosan
  choice: kumakain nito bilang pagkaing inihandog sa diyus-diyosan
  alternative: kumakain ng handog sa diyus-diyosan
  rationale: 'Ipinakikita ng ‘bilang’ kung paano inuunawa ng kumakain ang kahulugang panrelihiyon ng pagkain; hindi nito pinatutunayang tunay na diyos ang diyus-diyosan. Nananatili ang tensiyon sa pangangatwiran ni Pablo: walang tunay na pagka-diyos ang diyus-diyosan, ngunit maaaring madungisan ang mahinang budhi.'
- issue: Ang lakas o pagiging sensitibo ng budhi
  choice: mahina ang kanilang budhi
  alternative: maselan ang kanilang budhi
  rationale: Ang tuwirang ‘mahina’ ang katumbas ng ἀσθενής at hindi nito binabago ang pagtataya ni Pablo tungo lamang sa modernong ideya ng pagiging sensitibo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “diyus-diyosan” bilang malinaw at karaniwang katumbas ng εἴδωλον, at ang “budhi” bilang likas na salin ng συνείδησις. Bahagyang pormal ang “nakagawiang kaugnayan” upang mapanatili ang tunay na hirap at kalabuan ng sintaks ng Griyego.
