  text: βλέπετε δὲ μή πως ἡ ἐξουσία ὑμῶν αὕτη πρόσκομμα γένηται τοῖς ⸀ἀσθενέσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/009.yaml
  text: But take care that this right of yours does not somehow become a stumbling block to the weak[a][b].
translation:
  language: tl
  text: Ngunit mag-ingat kayo, baka ang karapatan ninyong ito ay maging katitisuran sa mahihina.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kalayaan ninyong ito.” Ang salitang Griyego ay maaaring mangahulugang “awtoridad,” “karapatan,” o “kalayaan.” Dito, tumutukoy ito sa kalayaang inaangkin ng ilang mananampalataya na kumain ng pagkaing may kaugnayan sa mga diyus-diyosan.
    reason: lexical_alternative
  - marker: b
    text: Ang “mahihina” dito ay ang mga taong mahina ang budhi sa usaping ito.
    reason: cultural_note
lexical_decisions:
- source_word: βλέπετε
  choice: mag-ingat kayo
  rationale: Ang pautos na anyo ay nananawagan ng pagbabantay laban sa posibleng masamang bunga; natural at malinaw sa makabagong Tagalog ang “mag-ingat kayo.”
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinapakita nito ang banayad na pagsalungat at paglipat mula sa naunang paliwanag tungo sa babala.
- source_word: μή πως
  choice: baka
  rationale: Likas na ipinahahayag ng “baka” ang negatibong pag-iingat laban sa isang posibleng mangyari.
- source_word: ἡ ἐξουσία ὑμῶν αὕτη
  choice: ang karapatan ninyong ito
  rationale: Sa konteksto, tumutukoy ito sa inaangking kalayaan o karapatang kumain ng pagkaing may kaugnayan sa mga diyus-diyosan. Mas tiyak dito ang “karapatan” kaysa “kapangyarihan,” habang pinananatili sa talababa ang lehitimong alternatibong “kalayaan.”
- source_word: πρόσκομμα
  choice: katitisuran
  rationale: Pinananatili nito ang metapora ng isang bagay na nagiging dahilan upang mabuwal ang iba sa moral o espirituwal na diwa.
- source_word: γένηται
  choice: maging
  rationale: Direkta at natural na katumbas ng pagkakaroon o pagiging isang bagay sa sugnay ng pag-iingat.
- source_word: τοῖς ἀσθενέσιν
  choice: sa mahihina
  rationale: Pinananatili ang maikli at sadyang hindi lubos na nililinaw na pananalita ng Griyego; ipinapaliwanag ng konteksto at talababa na budhi ang tinutukoy na kahinaan.
theological_decisions:
- issue: Kahulugan ng ἐξουσία sa konteksto
  choice: Karapatan ng mga taga-Corinto hinggil sa pagkaing may kaugnayan sa mga diyus-diyosan
  alternative: Kalayaan, awtoridad, o kapangyarihan sa mas malawak na diwa
  rationale: Ang agarang konteksto ng kabanata ay ang inaangking kalayaang kumain. Inihahatid ng “karapatan” ang praktikal na usaping etikal nang hindi ipinapasok ang ideya ng institusyonal na awtoridad.
- issue: Kahulugan ng τοῖς ἀσθενέσιν
  choice: Mga kapatid na mahina ang budhi sa usaping ito
  alternative: Mga taong mahina sa pangkalahatan o mahina sa katawan
  rationale: Paulit-ulit na inuugnay ng kabanata ang kahinaan sa budhi. Gayunman, pinananatili sa pangunahing teksto ang payak na “mahihina” upang hindi palawakin nang labis ang mismong pananalita ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “katitisuran” upang mapanatili ang metapora ng Griyego, at “mag-ingat kayo, baka” bilang natural na babala. Ang mga alternatibong kahulugan at kontekstuwal na paglilinaw ay inilagay sa mga talababa sa halip na isiksik sa pangunahing teksto.
