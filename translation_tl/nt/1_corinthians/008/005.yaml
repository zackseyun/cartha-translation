  source_fidelity: Napananatili ng draft ang paliwanag na puwersa ng καὶ γάρ, ang kondisyunal na εἴπερ, ang saklaw na “sa langit o sa lupa,” at ang pag-uugnay ng θεοί at κύριοι. Gayunman, ang “gaya nga ng maraming …” ay walang pandiwa at hindi malinaw na naihahatid ang ὥσπερ bilang parentetikal na pagkilalang marami ngang tinatawag na diyos at panginoon.
  naturalness: Hindi ganap na natural o kumpleto sa modernong Filipino ang “gaya nga ng maraming ‘diyos’ at maraming ‘panginoon’.” Ang “at marami ngang …” ay malinaw, likas, at pinananatili ang nagpapatuloy na parentetikal na ayos sa pamamagitan ng mga dash.
  terminology: Ang “mga tinatawag na diyos” ay tapat at maingat para sa λεγόμενοι θεοί. Ang “mga panginoon” ay angkop para sa κύριοι at pinananatili ang leksikal na kaugnayan sa “Panginoon” sa talata 6. Hindi kailangan ng mga panipi sa ikalawang pagbanggit, sapagkat wala ang mga ito sa Griyego at sapat na ang naunang “tinatawag na” at ang paliwanag sa talababa.
  issues:
