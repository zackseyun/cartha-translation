    rationale: Ang “gaya ng” ay karaniwang nangangailangan ng isang malinaw na pinaghahambingan; wala rin itong pandiwang katumbas ng εἰσίν (“mayroon/umiiral”). Dahil dito, malabo ang parentetikal na pagkilala ng ὥσπερ εἰσὶν.
