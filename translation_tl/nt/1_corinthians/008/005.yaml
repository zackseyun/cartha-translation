  text: καὶ γὰρ εἴπερ εἰσὶν λεγόμενοι θεοὶ εἴτε ἐν οὐρανῷ εἴτε ἐπὶ γῆς, ὥσπερ εἰσὶν θεοὶ πολλοὶ καὶ κύριοι πολλοί,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/005.yaml
  text: For even if there are so-called gods[b][a], whether in heaven or on earth—as indeed there are many gods and many lords—
translation:
  language: tl
  text: Sapagkat kahit may mga tinatawag na diyos[a], maging sa langit o sa lupa—at marami ngang diyos at maraming panginoon[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga diumano'y diyos.” Ang salitang Griyego ay maaaring mangahulugang “tinatawag” o, ayon sa konteksto, “diumano'y”; ipinapakita ng huli ang paglayo ni Pablo sa pag-angking diyos ang mga ito.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga panginoon” ay salin ng pangmaramihang anyo ng salitang Griyego na karaniwang isinasaling “Panginoon.” Dito, tumutukoy ito sa maraming nilalang o kapangyarihang kinikilala ng mga tao sa titulong iyon, hindi sa iisang Panginoon sa talata 6.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Sapagkat kahit
  rationale: Ipinapanatili ng “sapagkat” ang paliwanag na ugnayan ng γάρ sa naunang pahayag, habang ipinahihiwatig ng “kahit” ang dagdag na diin ng καί at ang kasunod na pagpapalagay.
- source_word: εἴπερ
  choice: may
  rationale: Sa pariralang “kahit may,” natural na naipapahayag sa Tagalog ang kondisyong ipinagpapalagay ni Pablo para sa argumento, nang hindi ito ginagawang tahasang pagpapatunay.
- source_word: λεγόμενοι θεοὶ
  choice: mga tinatawag na diyos
  rationale: Pinananatili nito ang leksikal na posibilidad na “called gods” at ang distansiya ni Pablo sa kanilang pag-aangking pagka-diyos, nang hindi higit na nilulutas ang likas na kalabuan ng participle.
- source_word: εἴτε ἐν οὐρανῷ εἴτε ἐπὶ γῆς
  choice: maging sa langit o sa lupa
  rationale: Natural at malinaw na inilalahad ang magkatambal na saklaw ng mga diumano'y makalangit at makalupang kapangyarihan.
- source_word: ὥσπερ
  choice: gaya nga ng
  rationale: Ipinahihiwatig ang mapagtibay na pagkilala na marami ngang kinikilalang may ganitong mga titulo, habang pinananatili ang anyong parentetikal ng pahayag.
- source_word: θεοὶ πολλοὶ
  choice: maraming “diyos”
  rationale: Ang panipi ay nagpapakitang ito ang tawag o pagkilala sa kanila, hindi tahasang pagsang-ayon na tunay silang mga diyos sa kaparehong diwa ng iisang Diyos sa talata 6.
- source_word: κύριοι πολλοί
  choice: maraming “panginoon”
  rationale: Pinananatili ng “panginoon” ang ugnayang leksikal sa κύριος, samantalang ang maliit na titik at panipi ay nagbubukod sa kanila sa iisang Panginoon sa talata 6.
theological_decisions:
- issue: Ang retorikal na paglayo ni Pablo sa mga paganong diyos
  choice: “mga tinatawag na diyos,” na may panipi sa muling pagbanggit na “maraming ‘diyos’”
  alternative: “mga diumano'y diyos” o “mga tinaguriang diyos”
  rationale: Ang salin ay hindi nagpapatunay sa kanilang tunay na pagka-diyos, ngunit pinananatili ang posibilidad ng λεγόμενοι bilang simpleng “tinatawag,” alinsunod sa pagtutol ng konteksto sa mga diyus-diyosan.
- issue: Ang κύριοι bilang maraming kinikilalang pinuno o makapangyarihang nilalang, kaiba sa iisang Panginoon
  choice: “maraming ‘panginoon’”
  alternative: “maraming amo”
  rationale: Ang “panginoon” ang higit na nagpapanatili sa leksikal at teolohikal na pagtutugma sa κύριος ng talata 6; nililinaw ng maliit na titik at panipi na hindi sila ang iisang Panginoon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Sapagkat” para sa lohikal na ugnayan at “maging … o …” para sa natural na pares. Pinanatili ang em dash sapagkat nagpapatuloy ang pangungusap sa talata 6. Ang mga panipi sa ikalawang “diyos” at sa “panginoon” ay nagpapakita ng ipinagkakabit na titulo nang hindi nag-aangkat ng sektaryang paliwanag.
