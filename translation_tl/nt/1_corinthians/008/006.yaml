    rationale: Sinasabi nitong pinananatili ng “mga pariralang ‘pinagmulan’ at ‘sa pamamagitan’” ang kaibahan, ngunit ang pinag-uusapang ikalawang kalahati ay may idinagdag na “nalikha” at “umiiral.” Mas mainam ang talababang tuwirang nagpapaliwanag sa ellipsis at sa pagkakaiba ng ἐξ at διά.
