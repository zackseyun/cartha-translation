revisions:
- from: Ngunit para sa atin ay iisa ang Diyos, ang Ama, na pinagmulan ng lahat ng bagay at siyang layunin ng ating pag-iral[a]; at iisa ang Panginoon, si Jesus na Mesiyas[b], na sa pamamagitan niya ay nalikha ang lahat ng bagay at sa pamamagitan din niya ay umiiral tayo.[c]
  to: Ngunit para sa atin ay iisa ang Diyos, ang Ama, na pinagmulan ng lahat ng bagay, at tayo ay para sa kanya[a]; at iisa ang Panginoon, si Jesus na Mesiyas[b], na sa pamamagitan niya ang lahat ng bagay, at tayo rin ay sa pamamagitan niya.[c]
  rationale: Inalis ang mga pandiwang interpretibong idinagdag sa pangunahing teksto at ibinalik ang maigsi, magkaparis na estruktura ng Griyego. Napanatili ang modernong Tagalog at ang pagkakaiba ng mga preposisyon, habang ang talababa ay nagpapaliwanag sa ellipsis nang hindi ito nilulutas nang lampas sa teksto.
