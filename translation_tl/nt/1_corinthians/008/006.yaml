id: 1CO.8.6
reference: 1 Corinthians 8:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀλλ’ ἡμῖν εἷς θεὸς ὁ πατήρ, ἐξ οὗ τὰ πάντα καὶ ἡμεῖς εἰς αὐτόν, καὶ εἷς κύριος Ἰησοῦς Χριστός, δι’ οὗ τὰ πάντα καὶ ἡμεῖς δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/006.yaml
  text: yet for us there is one God[a], the Father, from whom are all things and we for him, and one Lord, Jesus the Messiah[c][b], through whom are all things and we through him.
translation:
  language: tl
  text: Ngunit para sa atin ay iisa ang Diyos, ang Ama, na pinagmulan ng lahat ng bagay, at tayo ay para sa kanya[a]; at iisa ang Panginoon, si Jesus na Mesiyas[b], na sa pamamagitan niya ang lahat ng bagay, at tayo rin ay sa pamamagitan niya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “at tayo ay para sa kanya” o “at tayo ay patungo sa kanya.” Maaaring magpahiwatig ang parirala ng direksiyon, hantungan, o layunin.'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “si Jesu-Cristo.” Ang Griyegong Χριστός ay maaaring gumana bilang titulong “Mesiyas” o bilang katawagang halos naging bahagi na ng pangalan.
    reason: alternative_reading
  - marker: c
    text: 'Eliptiko ang Griyego: walang tahasang pandiwa sa mga pariralang “sa pamamagitan niya ang lahat ng bagay” at “tayo ay sa pamamagitan niya.” Pinananatili rin ng “pinagmulan” at “sa pamamagitan” ang pagkakaiba ng Ama bilang pinagmulan at ni Jesus na Mesiyas bilang tagapamagitan.'
    reason: textual_clarity
lexical_decisions:
- source_word: ἀλλ’
  choice: Ngunit
  rationale: Malinaw na ipinahahayag ang pagsalungat sa naunang pagbanggit sa mga tinatawag na diyos at panginoon.
- source_word: ἡμῖν
  choice: para sa atin
  rationale: 'Ang datibo ay nagsasaad ng pananaw o kaugnayan: ito ang ipinahahayag ng mga mananampalataya.'
- source_word: εἷς θεὸς ὁ πατήρ
  choice: iisa ang Diyos, ang Ama
  rationale: Pinananatili ang mariing bilang at ang pagkakakilanlan sa Ama sa anyong likas sa modernong Tagalog.
- source_word: ἐξ οὗ τὰ πάντα
  choice: na pinagmulan ng lahat ng bagay
  rationale: Ang ἐξ ay nagsasaad ng bukal o pinagmulan; mas natural ito kaysa sa literal na 'mula sa kanya ang lahat ng bagay.'
- source_word: καὶ ἡμεῖς εἰς αὐτόν
  choice: at siyang layunin ng ating pag-iral
  rationale: Maaaring ipahayag ng εἰς ang direksiyon, hantungan, o layunin. Ginagawang malinaw ang elipsis nang hindi nililimitahan ang parirala sa isang mas makitid na kahulugan.
- source_word: εἷς κύριος
  choice: iisa ang Panginoon
  rationale: Pinananatili ang tuwirang pagkakatulad sa 'iisa ang Diyos' at ang bigat ng κύριος bilang titulo.
- source_word: Ἰησοῦς Χριστός
  choice: Jesus na Mesiyas
  rationale: Dito ay malakas ang gamit ng Χριστός bilang titulo; ang 'na Mesiyas' ay malinaw at natural sa Tagalog.
- source_word: δι’ οὗ τὰ πάντα
  choice: na sa pamamagitan niya ay nalikha ang lahat ng bagay
  rationale: Ang διά na may genitive ay nagsasaad ng tagapamagitan o ahensiya. Ang pandiwang 'nalikha' ay ipinahihiwatig ng konteksto ngunit hindi tahasang nasa Griyego, kaya itinatala ang alternatibo sa talababa.
- source_word: καὶ ἡμεῖς δι’ αὐτοῦ
  choice: at sa pamamagitan din niya ay umiiral tayo
  rationale: Nililinaw ang elipsis bilang pag-iral habang pinananatili ang kaugnayang ipinahahayag ng διά.
theological_decisions:
- issue: Ang ugnayan ng 'iisa ang Diyos' at 'iisa ang Panginoon' sa isang pahayag na monoteistiko
  choice: Pinanatili ang magkatimbang na pahayag tungkol sa Ama at kay Jesus na Mesiyas nang hindi pinag-iisa ang kanilang mga gampanin o pinahihina ang alinman.
  alternative: Gawing tahasan ang isang kalaunang pormulang teolohikal, o isalin ang 'Panginoon' sa paraang nababawasan ang bigat nito.
  rationale: Ibinubukod ng talata ang Ama at si Jesus sa pamamagitan ng 'pinagmulan/layunin' at 'sa pamamagitan,' habang isinasama sila sa mariing pahayag na 'iisa.' Dapat manatili ang tensiyong ito sa salin.
- issue: Ang magkakaibang preposisyong ἐξ, εἰς, at διά
  choice: Isinalin bilang pinagmulan, layunin, at sa pamamagitan upang mapanatili ang magkakaibang ugnayan.
  alternative: Patagin ang mga ito sa pangkalahatang 'mula' o 'dahil sa,' o gawing pare-pareho ang papel ng Ama at ng Anak.
  rationale: Mahalaga sa pangangatwiran ni Pablo ang pagkakaiba ng bukal, hantungan o layunin, at tagapamagitan.
- issue: Ang ipinahihiwatig na pandiwa sa dalawang sugnay tungkol sa 'lahat ng bagay' at 'tayo'
  choice: Ginamit ang 'nalikha' at 'umiiral' sa pangunahing teksto para sa malinaw na Tagalog, kasabay ng talababa sa mas literal na anyo.
  alternative: Panatilihin ang lubos na eliptikong 'mula sa kanya ang lahat ng bagay at tayo para sa kanya ... sa pamamagitan niya ang lahat ng bagay at tayo sa pamamagitan niya.'
  rationale: Walang tahasang pandiwa sa Griyego. Ang konteksto ay tumutukoy sa pinagmulan at pag-iral, ngunit hindi dapat itago na ang mga pandiwa ay ipinahiwatig lamang.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'iisa' para sa mariing paralelismo, 'Panginoon' bilang kinikilalang titulong panrelihiyon, at 'Mesiyas' upang ipakita ang titulong kahulugan ng Χριστός. Nilinaw sa teksto ang mga elipsis para sa likas na daloy, ngunit inilantad sa mga talababa ang mas literal at tunay na malabong mga anyo.
