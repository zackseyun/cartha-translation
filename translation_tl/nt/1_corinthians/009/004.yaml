translation:
  language: tl
  text: Wala ba kaming karapatang kumain at uminom?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “awtoridad na kumain at uminom.” Dito, ang “karapatan” ay tumutukoy sa lehitimong karapatan o kalayaan, malamang na may kaugnayan sa pagtanggap ng materyal na suporta sa pangangatwiran ni Pablo.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ οὐκ
  choice: Wala ba
  rationale: 'Ipinananatili nito ang anyong retorikal na tanong na umaasa ng positibong sagot: mayroon nga silang gayong karapatan.'
- source_word: ἔχομεν
  choice: kaming
  rationale: Sa likas na Tagalog, ang pandiwang 'mayroon' ay naipahihiwatig sa pariralang 'Wala ba kaming'; malinaw rin nitong pinananatili ang unang panauhang maramihan.
- source_word: ἐξουσίαν
  choice: karapatan
  rationale: Sa konteksto, tumutukoy ito sa lehitimong kalayaan o paghahabol ng mga apostol, hindi sa kapangyarihang mamahala.
- source_word: φαγεῖν καὶ πεῖν
  choice: kumain at uminom
  rationale: Direkta, natural, at magkatimbang na salin ng magkaugnay na mga pawatas.
theological_decisions:
- issue: Saklaw ng karapatang tinutukoy
  choice: Hindi tahasang idinagdag sa pangunahing teksto ang pagtanggap ng materyal na suporta.
  alternative: Linawin sa teksto bilang 'karapatang tumanggap ng pagkain at inumin bilang suporta.'
  rationale: Ipinahihiwatig ng konteksto ng 1 Corinto 9 ang suporta sa mga apostol, ngunit ang mismong talata ay nagsasabing 'kumain at uminom.' Pinananatili ng salin ang lawak at tensiyon ng orihinal habang ipinapaliwanag ang malamang na konteksto sa talababa.
translation_notes:
  register: Makabago at natural na Filipino, ngunit may dignidad. Ginamit ang 'Wala ba kaming' bilang karaniwang anyo ng retorikal na tanong; ang 'karapatan' ay mas malinaw sa pangkalahatang mambabasa kaysa 'awtoridad' sa kontekstong ito.
