  text: Οὐκ εἰμὶ ⸂ἐλεύθερος; οὐκ εἰμὶ ἀπόστολος⸃; οὐχὶ ⸀Ἰησοῦν τὸν κύριον ἡμῶν ἑόρακα; οὐ τὸ ἔργον μου ὑμεῖς ἐστε ἐν κυρίῳ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/001.yaml
  text: Am I not free? Am I not an apostle? Have I not seen Jesus our Lord? Are you not my work in the Lord?[a]
translation:
  language: tl
  text: Hindi ba ako malaya? Hindi ba ako apostol? Hindi ko ba nakita si Jesus, ang Panginoon natin? Hindi ba kayo ang aking gawain sa Panginoon?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλεύθερος
  choice: malaya
  rationale: Tuwirang ipinahahayag nito ang kalayaan ni Pablo at ang kaugnay na karapatan niyang tinatalakay sa konteksto.
- source_word: ἀπόστολος
  choice: apostol
  rationale: Tumutukoy ito sa kinikilalang tungkulin ni Pablo, hindi lamang sa isang karaniwang sugo.
- source_word: Ἰησοῦν τὸν κύριον ἡμῶν
  choice: si Jesus na ating Panginoon
  rationale: Pinananatili nito ang ayos at ugnayan ng mga salita sa Griyego habang natural pa rin sa modernong Tagalog.
- source_word: ἑόρακα
  choice: nakita
  rationale: Likas na anyo ito sa Tagalog para sa naganap na pagkakita na nananatiling mahalaga sa kasalukuyang pangangatwiran ni Pablo.
- source_word: ἔργον
  choice: bunga ng gawain
  rationale: Sa konteksto, ang mga taga-Corinto ang kinalabasan ng apostolikong pagpapagal ni Pablo; mas malinaw at natural ito kaysa sabihing sila mismo ang kanyang 'gawain.'
- source_word: ἐν κυρίῳ
  choice: sa Panginoon
  rationale: Pinananatili ang maikli at pamilyar na pariralang Pauline, na tumutukoy sa saklaw o kaugnayang kinaroroonan ng gawain.
- source_word: οὐκ / οὐχὶ / οὐ
  choice: Hindi ba ...? / Hindi ko ba ...?
  rationale: Ang mga negatibong tanong ay retorikal at umaasa ng sagot na oo; likas itong ipinahahayag sa Tagalog sa anyong 'Hindi ba…?'
theological_decisions:
- issue: Diwa ng pahayag ni Pablo na nakita niya si Jesus
  choice: Iniwan sa payak na anyong 'nakita si Jesus na ating Panginoon,' na sa konteksto ay sumusuporta sa pagka-apostol ni Pablo.
  alternative: Tahasan itong gawing 'nakita ang muling nabuhay na Panginoong Jesus.'
  rationale: Malamang na ang pagpapakita ng muling nabuhay na Jesus ang tinutukoy sa konteksto, ngunit hindi tahasang sinasabi ng Griyego ang 'muling nabuhay'; hindi ito idinaragdag upang mapanatili ang teolohikal na pag-igting.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang sunod-sunod na retorikal na tanong at ang teknikal na katawagang “apostol.”
