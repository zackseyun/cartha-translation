  to: Hindi ba ako malaya? Hindi ba ako apostol? Hindi ko ba nakita si Jesus, ang Panginoon natin? Hindi ba kayo ang aking gawain sa Panginoon?
  rationale: Pinalitan ang interpretibong “bunga ng gawain ko” ng “aking gawain” upang mapanatili ang metapora at saklaw ng ἔργον μου. Inayos ang pagpapahayag ng “Jesus, ang Panginoon natin” upang maging mas likas na modernong Filipino habang nananatiling tapat sa pagkakaugnay ni Jesus at ng titulong κύριος. Inalis ang hindi kinakailangang talababa.
