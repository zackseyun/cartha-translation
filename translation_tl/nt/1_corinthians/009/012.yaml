revisions:
- from: Kung nakikibahagi ang iba sa karapatang ito sa inyo[a], hindi ba lalo na kami? Ngunit hindi namin ginamit ang karapatang ito. Sa halip, tinitiis namin ang lahat upang hindi kami maglagay ng anumang hadlang sa Magandang Balita ng Mesiyas.[b]
  to: Kung ang iba ay may bahagi sa karapatang ito na may kaugnayan sa inyo[a], hindi ba lalo na kami? Ngunit hindi namin ginamit ang karapatang ito. Sa halip, tinitiis namin ang lahat upang hindi kami magdulot ng anumang hadlang sa Magandang Balita ng Mesiyas.[b]
  rationale: Inayos ang unang sugnay upang maging malinaw sa modernong Tagalog na ang tinutukoy ay karapatang may kaugnayan sa mga taga-Corinto, hindi isang karapatang pagmamay-ari nila. Inayos din ang pananalita tungkol sa hadlang upang maging mas natural habang pinananatili ang layuning huwag hadlangan ang Magandang Balita.
