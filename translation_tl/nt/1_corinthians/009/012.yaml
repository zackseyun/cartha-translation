id: 1CO.9.12
reference: 1 Corinthians 9:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰ ἄλλοι τῆς ⸂ὑμῶν ἐξουσίας⸃ μετέχουσιν, οὐ μᾶλλον ἡμεῖς; Ἀλλ’ οὐκ ἐχρησάμεθα τῇ ἐξουσίᾳ ταύτῃ, ἀλλὰ πάντα στέγομεν ἵνα μή ⸂τινα ἐγκοπὴν⸃ δῶμεν τῷ εὐαγγελίῳ τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/012.yaml
  text: If others share in this right over you[a], do not we even more? But we have not made use of this right; instead[b], we endure everything so that we may give no hindrance to the gospel of the Messiah.
translation:
  language: tl
  text: Kung ang iba ay may bahagi sa karapatang ito na may kaugnayan sa inyo[a], hindi ba lalo na kami? Ngunit hindi namin ginamit ang karapatang ito. Sa halip, tinitiis namin ang lahat upang hindi kami magdulot ng anumang hadlang sa Magandang Balita ng Mesiyas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “karapatang humiling sa inyo” o “awtoridad na may kaugnayan sa inyo.” Malamang na tinutukoy ng pariralang Griyego ang karapatan ng mga apostol na tumanggap ng materyal na suporta mula sa mga taga-Corinto.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Cristo.” Ginamit dito ang “Mesiyas” sapagkat ang salitang Griyego na Χριστός ay gumaganap bilang titulo. Ang “Magandang Balita ng Mesiyas” ay maaari ring maunawaang “Magandang Balita tungkol sa Mesiyas.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξουσίας / ἐξουσίᾳ
  choice: karapatan
  rationale: Sa konteksto, tumutukoy ito sa lehitimong karapatan ng mga apostol na tumanggap ng materyal na suporta. Mas natural dito ang “karapatan” kaysa “awtoridad.”
- source_word: τῆς ὑμῶν ἐξουσίας
  choice: karapatang ito sa inyo
  rationale: Pinananatili nito ang kaugnayan ng karapatan sa mga taga-Corinto nang hindi ipinahihiwatig na sila ang nagmamay-ari ng karapatan. Ipinaliliwanag sa talababa ang malamang na diwa ng paghingi o pagtanggap ng suporta mula sa kanila.
- source_word: μετέχουσιν
  choice: nakikibahagi
  rationale: Tuwirang ipinahahayag ang pakikibahagi o pagtatamasa ng isang karapatan.
- source_word: οὐ μᾶλλον ἡμεῖς;
  choice: hindi ba lalo na kami?
  rationale: Pinananatili ang retorikal na tanong at ang paghahambing na diin ng μᾶλλον sa natural na Tagalog.
- source_word: ἐχρησάμεθα
  choice: hindi namin ginamit
  rationale: Natural at malinaw na katumbas ng hindi paggamit o pagsasagawa ng nasabing karapatan.
- source_word: πάντα στέγομεν
  choice: tinitiis namin ang lahat
  rationale: Sa konteksto, ang στέγομεν ay tumutukoy sa pagtitiis o pagbata sa hirap, hindi sa literal na pagtatakip.
- source_word: τινα ἐγκοπὴν δῶμεν
  choice: maglagay ng anumang hadlang
  rationale: Ang ἐγκοπή ay isang sagabal o hadlang; ang pariralang ito ay natural na naghahatid ng layuning huwag mapigilan ang paglaganap ng Magandang Balita.
- source_word: εὐαγγελίῳ
  choice: Magandang Balita
  rationale: Malinaw at madaling maunawaang modernong Tagalog para sa εὐαγγέλιον, habang pinananatili ang natatanging mensaheng tinutukoy ni Pablo.
- source_word: Χριστοῦ
  choice: Mesiyas
  rationale: Gumaganap dito ang Χριστός bilang titulo. Ang “Mesiyas” ay nagpapanatili sa kahulugang ‘Pinahiran’ sa halip na ituring lamang itong personal na pangalan.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστοῦ
  choice: Mesiyas
  alternative: Cristo
  rationale: Ginamit ang “Mesiyas” dahil ang Χριστός ay gumaganap bilang titulo sa pariralang ito. Inilagay sa talababa ang tradisyonal na anyong “Cristo.”
- issue: Ugnayan ng genitibong τοῦ Χριστοῦ sa εὐαγγελίῳ
  choice: Magandang Balita ng Mesiyas
  alternative: Magandang Balita tungkol sa Mesiyas
  rationale: Pinananatili ng “ng Mesiyas” ang maaaring saklaw ng Griyego—ang balitang pag-aari, ipinahahayag, o tumutukoy sa Mesiyas—sa halip na paliitin agad ito sa isang uri lamang ng ugnayan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang maikli at mariing retorikal na tanong ni Pablo, pati ang lawak ng “lahat” at ang bahagyang kalabuan ng pariralang “Magandang Balita ng Mesiyas.”
