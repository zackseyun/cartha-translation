  text: εἰ ἡμεῖς ὑμῖν τὰ πνευματικὰ ἐσπείραμεν, μέγα εἰ ἡμεῖς ὑμῶν τὰ σαρκικὰ θερίσομεν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/011.yaml
  text: If we have sown spiritual things among you[a], is it too much if we reap material things from you?
translation:
  language: tl
  text: Kung naghasik kami sa inyo ng mga bagay na espirituwal, kalabisan ba kung aanihin namin mula sa inyo ang mga bagay na materyal[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga bagay na panlupa.” Inihahambing ng Griyego ang “mga bagay na espirituwal” sa mga bagay na nauukol sa pisikal o materyal na buhay.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ πνευματικὰ
  choice: mga bagay na espirituwal
  rationale: Ang pang-uring nasa anyong neuter plural ay ginamit bilang pangngalan at malawak na tumutukoy sa mga espirituwal na pakinabang o paglilingkod; pinananatili ng salin ang lawak at kaibahan nito sa τὰ σαρκικὰ.
- source_word: ἐσπείραμεν
  choice: naghasik kami
  rationale: Ang aorist ay tumutukoy sa nauna nang gawain nina Pablo sa paglilingkod, habang pinananatili ang talinghaga ng paghahasik.
- source_word: μέγα
  choice: kalabisan ba
  rationale: Sa retorikal na tanong, ipinahihiwatig ng μέγα kung labis o di-makatwiran ang inaasahang pagtanggap; natural itong ipinapahayag sa Filipino bilang 'kalabisan ba.'
- source_word: τὰ σαρκικὰ
  choice: mga bagay na materyal
  rationale: Sa konteksto, tumutukoy ito sa praktikal at pisikal na panustos, hindi sa makasalanang pagnanasa. Iniiwasan ng 'materyal' ang maling pahiwatig ng literal na 'makalaman.'
- source_word: θερίσομεν
  choice: aanihin namin
  rationale: Pinananatili ng aspektong panghinaharap ang anyo ng pandiwang Griyego at ipinagpapatuloy ang talinghaga ng paghahasik at pag-aani.
- source_word: ὑμῶν
  choice: mula sa inyo
  rationale: 'Ipinapahayag nito nang natural ang genitive of source: sa mga taga-Corinto magmumula ang materyal na panustos.'
- source_word: ἡμεῖς
  choice: kami / namin
  rationale: Ang tahasang panghalip ay may diin at tumutukoy sa pangkat ni Pablo na naglingkod sa mga taga-Corinto; ang eksklusibong 'kami' ang angkop sa Filipino.
theological_decisions:
- issue: Kahulugan ng τὰ σαρκικὰ bilang katapat ng τὰ πνευματικὰ
  choice: Mga bagay na materyal o panustos para sa paglilingkod
  alternative: Mga bagay na makalaman
  rationale: Ipinagtatanggol ni Pablo sa konteksto ang karapatan ng mga apostol na tumanggap ng panustos. Ang kaibahan ay espirituwal na paglilingkod laban sa materyal o pisikal na suporta, hindi kabanalan laban sa makasalanang asal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang eksklusibong 'kami' sapagkat kausap ni Pablo ang mga taga-Corinto, at pinanatili ang talinghaga ng paghahasik at pag-aani.
