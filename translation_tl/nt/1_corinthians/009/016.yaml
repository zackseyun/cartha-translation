base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/016.yaml
  text: For if I preach the gospel[a], I have no ground for boasting, for necessity is laid upon me[b]. For woe is me if I do not preach the gospel.
translation:
  language: tl
  text: Sapagkat kung ipinangangaral ko ang ebanghelyo[a], wala akong dahilan upang magmalaki, sapagkat may pangangailangang nakaatang sa akin. Sapagkat sa aba ko kung hindi ko ipangaral ang ebanghelyo!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ipinapahayag ko ang mabuting balita” at “ipahayag ko ang mabuting balita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐαγγελίζωμαι / εὐαγγελίσωμαι
  choice: ipinangangaral ko / ipangaral ang ebanghelyo
  rationale: Ang pandiwa ay tumutukoy sa pagpapahayag ng mabuting balita. Likas at pamilyar sa makabagong Filipino ang “ipangaral ang ebanghelyo,” at pinananatili nito ang hayagang pagpapahayag na ipinahihiwatig ng Griyego.
- source_word: καύχημα
  choice: dahilan para magmalaki
  rationale: Ipinahihiwatig ng salita ang batayan o dahilan ng pagmamalaki, hindi lamang ang mismong pagkilos ng pagyayabang. Natural sa Filipino ang pariralang ito.
- source_word: ἀνάγκη ... ἐπίκειται
  choice: nakaatang sa akin ang pangangailangang gawin ito
  rationale: Pinagsasama ng salin ang diwa ng isang hindi matatakasan o mapilit na pangangailangan at ng bagay na nakapatong o iniatang kay Pablo, nang hindi tinutukoy kung saan nagmula ang pag-aatas.
- source_word: οὐαί
  choice: sa aba ko
  rationale: Pinananatili nito ang taimtim na babala ng kapahamakan o matinding kasawian at ang estilong propetiko ng pahayag.
- source_word: γάρ
  choice: sapagkat / dahil / nga
  rationale: 'Isinalin ayon sa likas na daloy ng Filipino: ang unang dalawa ay nagpapakilala ng paliwanag, samantalang ang “nga” sa huling sugnay ay nagpapanatili sa pagbibigay-diin at kaugnayang paliwanag nang hindi nagiging mabigat ang pag-uulit.'
theological_decisions:
- issue: Ang kalikasan at pinagmulan ng pangangailangan ni Pablo na ipangaral ang ebanghelyo
  choice: Inilarawan itong isang pangangailangang nakaatang sa kanya, nang hindi tinutukoy ang pinagmulan nito.
  alternative: Tahasang sabihing ito ay utos ng Diyos, panloob na pamimilit, o tungkuling ipinagkatiwala sa kanya.
  rationale: Sinasabi ng talata na may pangangailangang nakaatang kay Pablo, ngunit hindi nito tahasang tinutukoy kung ito ay banal na atas, panloob na udyok, o panlabas na kalagayan. Pinananatili ng salin ang saklaw at tensiyon ng Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pamilyar na salitang “ebanghelyo,” habang inilagay sa talababa ang mas tuwirang kahulugang “mabuting balita.” Ang “Sa aba ko” ay sadyang pinanatili dahil ang taimtim at propetikong bigat nito ay angkop sa οὐαί.
