    issue: Idinagdag ng “gawin ito” ang isang hayagang bagay sa sugnay tungkol sa pangangailangang nakaatang kay Pablo.
    rationale: Ang Griyego ay ἀνάγκη γάρ μοι ἐπίκειται, “sapagkat may pangangailangang nakaatang sa akin,” at hindi tahasang nagsasabing “na gawin ito.” Bagaman mauunawaan sa konteksto na ang pangangaral ang tinutukoy, ang dagdag ay hindi kailangan at bahagyang nagpapaliit sa sadyang hindi tinukoy na pahayag.
