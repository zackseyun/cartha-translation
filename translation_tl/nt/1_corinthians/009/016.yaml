  verdict: revise
  source_fidelity: Kailangang alisin ang “gawin ito,” dahil walang hayagang katumbas na bagay sa Griyego pagkatapos ng ἀνάγκη ἐπίκειται. Sapat at mas tapat ang “may pangangailangang nakaatang sa akin,” na pinananatili ang hindi tinukoy na saklaw at pinagmulan ng pangangailangan. Ang natitirang mga pangunahing diwa—pangangaral ng ebanghelyo, kawalan ng batayan sa pagmamalaki, at taimtim na οὐαί—ay wastong naihahatid.
  naturalness: Natural at marangal sa makabagong Filipino ang “wala akong dahilan upang magmalaki,” “may pangangailangang nakaatang sa akin,” at “Sa aba ko.” Ang pag-uulit ng “sapagkat” ay katanggap-tanggap at sinasadyang tumutugma sa magkakasunod na γάρ nang hindi nagiging di-likas.
  terminology: Ang “ebanghelyo” ay matatag at pamilyar na terminong Filipino para sa εὐαγγέλιον na ipinahihiwatig ng pandiwa. Ang “ipangaral” ay angkop para sa εὐαγγελίζομαι; ang talababa ay nagbibigay ng wastong leksikal na kahaliling “ipahayag ... ang mabuting balita.” Ang “Sa aba ko” ay angkop na katumbas ng οὐαί at hindi nagpapasok ng partikular na doktrinal na paliwanag.
  issues:
