  text: Ἐλεύθερος γὰρ ὢν ἐκ πάντων πᾶσιν ἐμαυτὸν ἐδούλωσα, ἵνα τοὺς πλείονας κερδήσω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/019.yaml
  text: For though I am free from all[a], I made myself a servant to all, so that I might win more of them.
translation:
  language: tl
  text: Sapagkat kahit malaya ako sa lahat, ginawa kong alipin ng lahat ang aking sarili upang mas marami akong mahikayat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “upang mas marami akong makamit.” Dito, ang “makamit” ay talinghaga para sa paghikayat ng mga tao.
    reason: Pinananatili ang literal na talinghaga ng κερδαίνω bilang alternatibo habang natural ang pangunahing teksto.
lexical_decisions:
- source_word: Ἐλεύθερος
  choice: malaya
  rationale: Likas na katumbas ito ng pagiging hindi alipin o nasa ilalim ng kapangyarihan ng iba, at malinaw nitong itinatambal ang kalayaan sa kasunod na larawan ng pagkaalipin.
- source_word: ἐκ πάντων
  choice: sa lahat
  rationale: Sa pariralang “malaya ... sa lahat,” ipinahihiwatig na si Pablo ay hindi sakop ng sinuman. Pinananatili rin nito ang maikli at retorikal na pagkakatapat sa “ng lahat.”
- source_word: πᾶσιν
  choice: ng lahat
  rationale: Kasunod ng “ginawa kong alipin,” natural sa Filipino ang “alipin ng lahat” para tukuyin ang mga taong kusa niyang pinaglingkuran.
- source_word: ἐμαυτὸν ἐδούλωσα
  choice: ginawa kong alipin ... ang aking sarili
  rationale: Pinananatili nito ang mariing wika ng pagkaalipin at ang kusang pagpapasakop ni Pablo, na mahalaga sa kontrast sa “malaya.”
- source_word: ἵνα
  choice: upang
  rationale: Malinaw at marangal na panandang Filipino ito para sa layunin.
- source_word: τοὺς πλείονας
  choice: mas marami
  rationale: Tumutukoy ito sa mas malaking bilang ng mga tao; hindi nito pinalalakas ang diwa tungo sa “pinakamaraming maaari.”
- source_word: κερδήσω
  choice: mahikayat
  rationale: Sa konteksto ng ministeryo, natural nitong ipinahahayag ang talinghagang pagkamit ng mga tao nang hindi ipinahihiwatig na sila ay pag-aari o gantimpala.
theological_decisions:
- issue: Paglalarawan ng δουλόω bilang pagkaalipin
  choice: alipin
  alternative: lingkod
  rationale: Sentral sa pangungusap ang mariing kontrast ng pagiging “malaya” at kusang paggawa sa sarili bilang “alipin.” Ang “lingkod” ay mas banayad at maaaring magkubli sa puwersa ng talinghaga.
- issue: Kahulugan ng κερδήσω sa konteksto ng ebanghelismo
  choice: mahikayat
  alternative: makamit
  rationale: Ipinahahayag ng “mahikayat” ang paglapit ng mga tao sa mensahe sa konteksto, samantalang ang literal na “makamit” ay maaaring tumunog na parang pag-aari. Nililinaw ng talababa ang mas literal na talinghaga.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang retorikal na kontrast ng “malaya” at “alipin,” at iniwasan ang mas denominasyonal o mas mahinang katawagang “lingkod.”
