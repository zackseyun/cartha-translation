base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/018.yaml
  text: What then is my reward? That in preaching the good news I may present the good news free of charge[b][a], so as not to make full use of my right in the good news.
translation:
  language: tl
  text: 'Kung gayon, ano ang gantimpala ko? Ito: sa pangangaral ko ng magandang balita, maihandog ko ang magandang balita nang walang bayad[a], upang hindi ko lubusang gamitin ang karapatan ko kaugnay ng magandang balita[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “maipangaral ko ang magandang balita nang walang bayad.”
    reason: lexical_alternative
  - marker: b
    text: O “upang hindi ko lubusang gamitin ang karapatan ko sa paglilingkod para sa magandang balita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μισθός
  choice: gantimpala
  rationale: Tumutukoy ito sa kapalit o pakinabang na tinatanggap ni Pablo sa kanyang paglilingkod, hindi lamang sa literal na sahod; ang kabalintunaan ay ang gantimpala niya ay maipangaral ito nang walang bayad.
- source_word: εὐαγγελιζόμενος
  choice: sa pangangaral ko ng magandang balita
  rationale: Pinananatili ang pandiwang diwa ng participle at ang kasabay na kilos kaugnay ng paghahandog ng balita.
- source_word: ἀδάπανον
  choice: nang walang bayad
  rationale: Natural at malinaw na Filipino para sa bagay na inihahandog nang walang singil o gastos sa tumatanggap.
- source_word: θήσω τὸ εὐαγγέλιον
  choice: maihandog ko ito
  rationale: Ang literal na 'mailagay' ay hindi natural dito; ipinahihiwatig ng idyoma ang paghaharap o paghahandog ng magandang balita.
- source_word: εὐαγγέλιον
  choice: magandang balita
  rationale: Tuwirang ipinapahayag ang karaniwang kahulugan ng salitang Griyego sa natural na modernong Filipino.
- source_word: καταχρήσασθαι
  choice: lubusang gamitin
  rationale: Pinananatili ang diwang gamitin nang ganap, nang hindi ipinapalagay na inaabuso ni Pablo ang isang lehitimong karapatan.
- source_word: ἐξουσίᾳ
  choice: karapatan
  rationale: Sa konteksto ng kabanata, ito ang lehitimong karapatan ni Pablo na tumanggap ng materyal na suporta.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: sa paglilingkod para sa magandang balita
  rationale: 'Ginagawang natural sa Filipino ang ugnayang ipinahihiwatig ng parirala: ang karapatang kaugnay ng gawain o ministeryo ng magandang balita.'
theological_decisions:
- issue: Ang saklaw ng ἐξουσία ni Pablo
  choice: Lehitimong karapatang tumanggap ng suporta sa paglilingkod para sa magandang balita
  alternative: Mas malawak na apostolikong awtoridad, o paggamit ng awtoridad na may mapang-abusong pahiwatig
  rationale: Ang nakapaligid na talata ay nakatuon sa karapatan ng apostol sa materyal na suporta. Kaya 'karapatan' at 'lubusang gamitin' ang ginamit upang hindi magdagdag ng diwang pang-aabuso.
- issue: Pagpapakahulugan sa ἐν τῷ εὐαγγελίῳ
  choice: sa paglilingkod para sa magandang balita
  alternative: sa magandang balita
  rationale: Ang Griyego ay maikli at maaaring mangahulugang 'kaugnay ng magandang balita.' Nililinaw ng salin ang malamang na ministeryal na diwa habang iniiwasang gawing pag-aari o nilalaman mismo ng balita ang karapatan.
- issue: Pag-render sa εὐαγγέλιον
  choice: magandang balita
  alternative: ebanghelyo
  rationale: Ang 'magandang balita' ay malinaw at madaling maunawaan sa modernong Filipino, at tuwirang kumakatawan sa leksikal na diwa nang hindi nagdaragdag ng denominasyonal na kulay.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang 'Kung gayon' para sa οὖν at ang 'Ito:' upang malinaw na ipakilala ang sagot sa retorikal na tanong. Iniwasan ang sobrang teknikal na 'ebanghelyo' at ang posibleng mapang-abusong pahiwatig ng 'samantalahin.'
