source:
  edition: SBLGNT
  text: Ἐγὼ δὲ ⸂οὐ κέχρημαι οὐδενὶ⸃ τούτων. οὐκ ἔγραψα δὲ ταῦτα ἵνα οὕτως γένηται ἐν ἐμοί, καλὸν γάρ μοι μᾶλλον ἀποθανεῖν ἤ— τὸ καύχημά μου ⸂οὐδεὶς κενώσει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/015.yaml
  text: But I have made use of none of these things[a]. Yet I did not write these things so that it should be done this way for me[b], for I would rather die than—no one will nullify my boasting.
translation:
  language: tl
  text: Ngunit hindi ko ginamit ang alinman sa mga ito.[a] Hindi ko naman isinulat ang mga ito upang mangyari ang ganito sa akin, sapagkat mas nanaisin ko pang mamatay kaysa—walang sinumang magpapawalang-saysay sa ipinagmamalaki ko.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas tahasang ayon sa konteksto, “ang alinman sa mga karapatang ito.”
    reason: lexical_alternative
  - marker: b
    text: Naputol ang pangungusap sa Griyego pagkatapos ng “kaysa—” at nagpatuloy sa “walang sinumang magpapawalang-saysay sa ipinagmamalaki ko.” Maaari rin itong pakinisin bilang “kaysa hayaang pawalang-saysay ng sinuman ang ipinagmamalaki ko.”
    reason: alternative_reading
lexical_decisions:
- source_word: κέχρημαι
  choice: ginamit
  rationale: Likas at malinaw na katumbas ng paggamit o pakikinabang sa mga karapatang tinalakay; hindi nito ipinahihiwatig ang maling paggamit.
- source_word: οὐδενὶ τούτων
  choice: ang alinman sa mga ito
  rationale: Pinananatili ang pangkalahatang pagtukoy ng Griyego, habang nililinaw ng talababa na ang tinutukoy sa konteksto ay mga karapatan.
- source_word: ἔγραψα ... ταῦτα
  choice: isinulat ang mga ito
  rationale: Ang payak na aspektong naganap ay natural na naipahahayag sa Filipino sa anyong “isinulat”; tumutukoy ito sa naunang talakayan.
- source_word: ἵνα οὕτως γένηται ἐν ἐμοί
  choice: upang gawin ito para sa akin
  rationale: Ipinahahayag nang natural ang layunin at ang diwang si Pablo ay hindi sumusulat upang matanggap niya mismo ang gayong paglalaan.
- source_word: καλὸν γάρ μοι μᾶλλον ἀποθανεῖν
  choice: sapagkat mas nanaisin ko pang mamatay
  rationale: Natural na Filipino para sa matinding paghahambing ng kagustuhan sa Griyego.
- source_word: τὸ καύχημά μου
  choice: ang ipinagmamalaki ko
  rationale: Naipahahayag nito kapwa ang ipinagmamalaki at ang batayan ng pagmamalaki, nang hindi labis na nagpapaliwanag sa pangunahing teksto.
- source_word: κενώσει
  choice: mag-aalis ng saysay
  rationale: Isinasalin ang metaporikal na diwa ng “gawing hungkag/walang laman” bilang pag-aalis ng bisa o kabuluhan, sa natural na modernong Filipino.
theological_decisions:
- issue: Putol na sintaks pagkatapos ng ἤ (“kaysa—”)
  choice: 'Panatilihin ang gitling at ang biglang pagpapatuloy: “kaysa—walang sinumang…”'
  alternative: Pakinisin bilang “kaysa hayaang alisin ng sinuman ang saysay ng ipinagmamalaki ko.”
  rationale: Ang Griyego ay sadyang napuputol pagkatapos ng “kaysa,” kaya pinananatili ang retorikal na tindi at hindi tahimik na pinupunan ang hindi nakasaad.
translation_notes:
  register: Modernong Filipino na natural, marangal, at madaling maunawaan. Pinanatili ang biglang pagkaputol ng orihinal na pangungusap at iniwasan ang denominasyonal na pagpapakahulugan.
