  text: Μὴ κατὰ ἄνθρωπον ταῦτα λαλῶ ἢ ⸂καὶ ὁ νόμος ταῦτα οὐ⸃ λέγει;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/008.yaml
  text: Am I saying these things from a merely human perspective[a], or does not the Law also say these things?
translation:
  language: tl
  text: Sinasabi ko ba ang mga bagay na ito ayon lamang sa pananaw ng tao[a], o hindi ba sinasabi rin ito ng Kautusan?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ayon sa tao” o “mula sa pananaw ng tao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ
  choice: ba ...? Hindi ba
  rationale: Ipinahihiwatig ng unang μή na inaasahan ang negatibong sagot, samantalang ang οὐ sa ikalawang tanong ay inaasahang sasagutin nang sang-ayon. Likas sa Tagalog ang magkasunod na retorikal na tanong na ito.
- source_word: κατὰ ἄνθρωπον
  choice: ayon lamang sa pananaw ng tao
  rationale: Pinananatili ang diwang 'ayon sa tao' bilang batayan o pananaw na pawang pantao, at malinaw na inihahambing sa patotoo ng Kautusan.
- source_word: ταῦτα
  choice: ang mga bagay na ito / ito
  rationale: Sa unang paglitaw, pinananatili ang maramihang anyo at ang pagtukoy sa naunang pangangatwiran ni Pablo. Sa ikalawa, ang likas na Tagalog na 'ito' ay tumutukoy sa parehong kabuuan.
- source_word: λαλῶ
  choice: Sinasabi ko
  rationale: Natural na kasalukuyang pananalita sa Tagalog para sa ginagawa ni Pablo sa mismong pangangatwiran.
- source_word: ἢ
  choice: '?'
  rationale: Sa halip na piliting gumamit ng 'o' sa isang mabigat na pangungusap, ipinahahayag ang disjunction bilang ikalawang retorikal na tanong; nananatili ang paghahambing ng pawang pantao at ng sinasabi ng Kautusan.
- source_word: καὶ
  choice: rin
  rationale: 'Ang ''rin'' ang natural na panandang pandagdag sa Tagalog: ang Kautusan ay nagbibigay rin ng patotoo.'
- source_word: ὁ νόμος
  choice: ang Kautusan
  rationale: Tumutukoy sa Kautusang nasa Kasulatan, partikular sa sipi mula sa Deuteronomio sa kasunod na talata, hindi sa batas sa pangkalahatan.
- source_word: οὐ λέγει
  choice: Hindi ba sinasabi
  rationale: Pinananatili ang retorikal na tanong ng Griyego na umaasang sasang-ayon ang mambabasa.
theological_decisions:
- issue: Ang tinutukoy ng ὁ νόμος sa pangangatwiran ni Pablo
  choice: Kautusan bilang Kautusang nasa Kasulatan
  alternative: batas o tuntunin sa pangkalahatan
  rationale: Tahasan itong sinusundan ng pagsipi sa Deuteronomio 25:4; kaya ang 'Kautusan' ay nagpapanatili sa tiyak na reperensiyang ito nang hindi nagdaragdag ng doktrinal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'Kautusan' bilang kinikilalang katawagan sa Kautusang nasa Kasulatan. Ang dalawang retorikal na tanong ay mas natural sa Tagalog kaysa sa tuwirang paggaya sa Ingles na may 'o,' habang pinananatili ang lohikal na pagsalungat ng Griyego.
