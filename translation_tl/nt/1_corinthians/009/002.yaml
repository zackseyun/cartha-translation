  text: εἰ ἄλλοις οὐκ εἰμὶ ἀπόστολος, ἀλλά γε ὑμῖν εἰμι, ἡ γὰρ σφραγίς ⸂μου τῆς⸃ ἀποστολῆς ὑμεῖς ἐστε ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/002.yaml
  text: If I am not an apostle to others[a], yet I certainly am to you, for you are the seal of my apostleship in the Lord.
translation:
  language: tl
  text: Kahit hindi ako apostol para sa iba, apostol naman ako para sa inyo, sapagkat kayo ang selyo[a] ng aking pagiging apostol sa Panginoon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “katibayan” o “patunay” ng aking pagiging apostol. Ginagamit sa Griyego ang “selyo,” na pinananatili ang larawan ng isang bagay na nagpapatunay ng pagiging tunay o may bisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόστολος
  choice: apostol
  rationale: Sa pagtatanggol ni Pablo sa kaniyang tungkulin, tumutukoy ito sa kinikilalang pagkatawag at pagsusugo bilang apostol, hindi lamang sa isang karaniwang mensahero.
- source_word: ἀλλά γε
  choice: tiyak na apostol ako
  rationale: 'Ipinahahayag ng parirala ang mariing pagsalungat: anuman ang kalagayan niya kaugnay ng iba, tiyak ang pagiging apostol niya para sa mga taga-Corinto.'
- source_word: σφραγίς
  choice: tatak
  rationale: Pinananatili ng “tatak” ang larawan ng isang selyong nagpapatunay na tunay o may bisa ang isang bagay, habang natural itong nauunawaan sa makabagong Filipino.
- source_word: ἀποστολή
  choice: pagiging apostol
  rationale: Tumutukoy ito rito sa katayuan, tungkulin, at pagsusugo ni Pablo bilang apostol; mas natural sa Filipino ang “pagiging apostol” kaysa sa isang hiniram na abstraktong katawagan.
- source_word: ἐν κυρίῳ
  choice: sa Panginoon
  rationale: Pinananatili nito ang maikli at siksik na pariralang Paulino, na maaaring tumukoy sa kanilang kaugnayan at buhay sa Panginoon nang hindi ito nililimitahan sa simpleng ahensiya.
- source_word: ἄλλοις
  choice: para sa iba
  rationale: 'Ipinapakita nito ang relasyonal na diwa ng datibo: ang pagiging apostol ni Pablo kaugnay ng iba, bilang paghahambing sa malinaw niyang kaugnayan sa mga taga-Corinto.'
theological_decisions:
- issue: Saklaw at diin ng pahayag ni Pablo tungkol sa kaniyang pagiging apostol
  choice: Ipinapalagay ni Pablo, bilang retorikal na kondisyon, na maaaring hindi kilalanin o makita ng iba ang kaniyang pagiging apostol, ngunit mariin niyang sinasabing ang mga taga-Corinto mismo ang nagpapatunay nito.
  alternative: Literal na nililimitahan ni Pablo ang kaniyang pagiging apostol sa mga taga-Corinto lamang.
  rationale: Ang kondisyon at ang kasunod na dahilan ay bahagi ng pagtatanggol ni Pablo. Ang pag-iral ng iglesia sa Corinto bilang bunga ng kaniyang gawain ang nagsisilbing tatak ng kaniyang pagiging apostol, hindi bilang pagtatakda na sila lamang ang saklaw nito.
- issue: Kahulugan ng ἐν κυρίῳ
  choice: Pinanatili bilang “sa Panginoon,” na nag-uugnay sa mga taga-Corinto at sa bisa ng kanilang patotoo sa Panginoon.
  alternative: “Sa pamamagitan ng Panginoon,” na tahasang ginagawa itong pahayag tungkol sa ahensiya ng Panginoon.
  rationale: Hindi kailangang lutasin ng salin ang siksik na pariralang Paulino bilang ahensiya lamang; ang literal at natural na “sa Panginoon” ay nagpapanatili ng mas malawak na relasyonal na diwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang terminong “apostol,” ang natural na pariralang “pagiging apostol,” at ang kongkretong larawang “tatak.” Inilagay ang talababa sa “tatak,” ang salitang aktuwal na ipinaliliwanag nito.
