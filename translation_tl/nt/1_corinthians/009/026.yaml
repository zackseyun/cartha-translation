  text: 'So then[a], I run in this way: not aimlessly; in this way I box: not beating the air.'
translation:
  language: tl
  text: 'Kaya nga, ganito ako tumatakbo: hindi ako tumatakbo nang walang malinaw na layon[a]. Ganito ako nagboboksing: hindi ako sumusuntok sa hangin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nang walang katiyakan.” Maaaring idiin ng salitang Griyego ang kawalan ng linaw o ng tiyak na tunguhin; sa larawan ng karera, ipinahihiwatig ng “walang malinaw na layon” ang pagtakbong walang tiyak na patutunguhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοίνυν
  choice: Kaya nga
  rationale: Ipinapakita nito ang paghinuha at paglipat mula sa naunang larawan ng paligsahan tungo sa personal na pagsasabuhay ni Pablo.
- source_word: οὕτως
  choice: ganito
  rationale: Pinanatili ang dalawang paglitaw ng salita upang maipakita ang diin sa paraan ng pagtakbo at pagboboksing.
- source_word: τρέχω
  choice: ako tumatakbo
  rationale: Tuwirang pinananatili ang metapora ng pagtakbo at ang pangkasalukuyang paglalarawan ni Pablo sa sarili.
- source_word: ἀδήλως
  choice: hindi nang walang direksiyon
  rationale: Sa larawan ng karera, likas nitong ipinahihiwatig ang pagtakbong may malinaw na tunguhin, habang pinananatili ng talababa ang posibleng diwa ng kawalan ng katiyakan.
- source_word: πυκτεύω
  choice: ako nagboboksing
  rationale: Partikular na tumutukoy ang pandiwa sa pakikipagboksing; malinaw at karaniwan ang salitang ito sa modernong Filipino.
- source_word: ἀέρα
  choice: hangin
  rationale: Pinananatili ang literal na larawan ng mga suntok na walang tinatamaan.
- source_word: δέρων
  choice: sumusuntok
  rationale: Sa konteksto ng pagboboksing, natural na ipinapahayag nito ang kilos ng paghampas o pagtama gamit ang kamao.
