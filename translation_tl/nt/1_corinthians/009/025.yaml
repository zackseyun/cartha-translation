  to: Sinumang nakikipagpaligsahan ay nagpipigil sa sarili sa lahat ng bagay. Ginagawa nila iyon upang tumanggap ng koronang nasisira[a], ngunit tayo naman ay tumatanggap ng isang koronang hindi nasisira.
