base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/025.yaml
  text: Everyone who competes exercises self-control in all things. They do so in order to receive a perishable crown[a], but we an imperishable one.
translation:
  language: tl
  text: Sinumang nakikipagpaligsahan ay nagpipigil sa sarili sa lahat ng bagay. Ginagawa nila iyon upang tumanggap ng koronang nasisira[a], ngunit tayo naman ay tumatanggap ng isang koronang hindi nasisira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “putong”; tumutukoy ang salitang Griyego sa putong na iginagawad sa nagwagi sa mga paligsahang pampalakasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς
  choice: ang bawat
  rationale: Ipinahahayag ang distributibong diwa ng pang-isahang anyo at likas na tumutukoy sa sinumang kalahok.
- source_word: ἀγωνιζόμενος
  choice: nakikipagpaligsahan
  rationale: Ang konteksto ay palakasan at kompetisyon; malinaw nitong pinananatili ang larawan ng isang kalahok sa paligsahan.
- source_word: πάντα
  choice: sa lahat ng bagay
  rationale: Pinananatili ang malawak na saklaw ng pagpipigil at hindi ito nililimitahan sa pagkain o pagsasanay lamang.
- source_word: ἐγκρατεύεται
  choice: nagpipigil sa sarili
  rationale: Natural na Filipino para sa palagian at sinasadyang pagpipigil sa sarili.
- source_word: ἐκεῖνοι μὲν οὖν
  choice: ginagawa nila iyon
  rationale: Tumutukoy pabalik sa mga kalahok at likas na ipinahihiwatig ang naunang kilos, habang inihahanda ang paghahambing sa “tayo naman.”
- source_word: ἵνα
  choice: upang
  rationale: Malinaw at maikli nitong ipinahahayag ang layunin.
- source_word: φθαρτὸν
  choice: nasisira
  rationale: Bumubuo ng tuwirang salungatan sa “hindi nasisira” at hindi nililimitahan ang salita sa literal na pagkalanta lamang.
- source_word: στέφανον
  choice: korona
  rationale: Pinananatili ang maikli at pamilyar na larawan ng gantimpala at karangalan; nililinaw sa talababa ang putong na iginagawad sa paligsahan.
- source_word: λάβωσιν
  choice: tumanggap
  rationale: Angkop sa gantimpalang iginagawad sa nagwagi at natural sa layuning ipinahahayag ng ἵνα.
- source_word: ἡμεῖς δὲ ἄφθαρτον
  choice: ngunit tayo naman ay koronang hindi nasisira
  rationale: Pinananatili ang madiing paghahambing sa “sila” at isinusuplay sa Filipino ang naiwang pangngalang “korona” upang maging malinaw.
theological_decisions:
- issue: Ang kahulugan ng gantimpalang inilalarawan
  choice: Panatilihin ang larawan ng koronang gantimpala nang hindi tinutukoy nang mas eksakto ang doktrinal na kahulugan nito.
  alternative: Tahasang tukuyin ito bilang buhay na walang hanggan o bilang mga gantimpala sa langit.
  rationale: Hindi mismo nililinaw ng talata ang eksaktong tinutukoy ng korona; ang pagpapanatili sa metapora ay umiiwas sa pagpasok ng isang mas makitid na interpretasyong teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ang bawat” upang mapanatili ang distributibong diwa, at ang “tayo naman” upang maipakita ang malinaw na paghahambing ng dalawang pangkat.
