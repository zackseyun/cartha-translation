id: 1CO.9.20
reference: 1 Corinthians 9:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐγενόμην τοῖς Ἰουδαίοις ὡς Ἰουδαῖος, ἵνα Ἰουδαίους κερδήσω· τοῖς ὑπὸ νόμον ὡς ὑπὸ νόμον, ⸂μὴ ὢν αὐτὸς ὑπὸ νόμον⸃, ἵνα τοὺς ὑπὸ νόμον κερδήσω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/020.yaml
  text: And to the Jews I became as a Jew[a], so that I might win Jews; to those under the law[b], as under the law—though I myself am not under the law—so that I might win those under the law.
translation:
  language: tl
  text: Sa mga Judio, naging gaya ako ng isang Judio upang mapanalunan ko ang mga Judio[a]; sa mga nasa ilalim ng Kautusan[b], naging gaya ako ng isang nasa ilalim ng Kautusan—bagaman ako mismo ay wala sa ilalim ng Kautusan—upang mapanalunan ko ang mga nasa ilalim ng Kautusan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “makamit”; ang pandiwa ay maaaring mangahulugang makamit o mapanalunan ang isang tao.
    reason: lexical_alternative
  - marker: b
    text: Ang “Kautusan” dito ay malamang na tumutukoy sa Kautusan ni Moises.
    reason: cultural_note
lexical_decisions:
- source_word: ἐγενόμην
  choice: naging
  rationale: Pinananatili nito ang diwa ng pag-aangkop ni Pablo sa paraan ng pakikitungo niya sa iba, nang hindi ipinahihiwatig na nagbago ang kaniyang etnikong pagkakakilanlan.
- source_word: τοῖς Ἰουδαίοις ... ὡς Ἰουδαῖος
  choice: Sa mga Judio ... gaya ng isang Judio
  rationale: Malinaw na naipapakita ng “gaya” ang paghahambing at ang pakikibagay ni Pablo sa mga Judio.
- source_word: ἵνα ... κερδήσω
  choice: upang makamit ko
  rationale: Ang κερδαίνω ay literal na tumutukoy sa pagkamit o pagtatamo, ngunit dito ay tungkol sa pagkamit ng mga tao para sa layunin ng kaniyang misyon. Pinananatili ng “makamit” ang metapora nang hindi labis na ipinapaliwanag ang paraan ng pagkamit.
- source_word: τοῖς ὑπὸ νόμον
  choice: sa mga nasa ilalim ng Kautusan
  rationale: Likas sa Tagalog ang pariralang ito at pinananatili nito ang larawan ng pagiging sakop ng isang kinikilalang Kautusan.
- source_word: ὡς ὑπὸ νόμον
  choice: gaya ng isang nasa ilalim ng Kautusan
  rationale: Bahagyang pinalawak ang masiksik na Griyego upang maging malinaw at natural sa Tagalog, habang pinananatili ang kaagapay na ayos ng “gaya ng isang Judio.”
- source_word: μὴ ὢν αὐτὸς ὑπὸ νόμον
  choice: bagaman ako mismo ay wala sa ilalim ng Kautusan
  rationale: Ipinapahayag nito bilang kasalukuyang kalagayan ang pansing salungat sa naunang pahayag at pinananatili ang diin sa προσωπal na katayuan ni Pablo.
- source_word: αὐτὸς
  choice: ako mismo
  rationale: Pinananatili ng “mismo” ang pagbibigay-diin ng αὐτός.
- source_word: νόμος
  choice: Kautusan
  rationale: Ang malaking titik ay tumutulong na ipahiwatig ang kinikilalang kalipunan ng kautusan sa kontekstong Judio, habang hindi isinasama sa pangunahing teksto ang mas tiyak na paliwanag na “Kautusan ni Moises.”
theological_decisions:
- issue: Kahulugan ng pahayag ni Pablo na wala siya “sa ilalim ng Kautusan”
  choice: Tahasang isinalin bilang “bagaman ako mismo ay wala sa ilalim ng Kautusan,” nang walang idinagdag na paliwanag.
  alternative: “bagaman ako mismo ay wala sa ilalim ng Kautusan ni Moises” o isang pagpapaliwanag batay sa susunod na talata
  rationale: Ang mismong Griyego sa talatang ito ay nagsasabi lamang na hindi siya nasa ilalim ng Kautusan. Ang hindi pagpapaliwanag o paghaharmonisa rito ay nagpapanatili sa retorikal na paghahambing at teolohikal na tensiyon ng teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “Judio” at “Kautusan” bilang pamilyar na terminong biblikal; pinanatili ang paulit-ulit at magkatulad na kayarian ng Griyego upang maipakita ang retorika ni Pablo.
