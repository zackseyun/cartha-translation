  to: Sa mga Judio, naging gaya ako ng isang Judio upang mapanalunan ko ang mga Judio[a]; sa mga nasa ilalim ng Kautusan[b], naging gaya ako ng isang nasa ilalim ng Kautusan—bagaman ako mismo ay wala sa ilalim ng Kautusan—upang mapanalunan ko ang mga nasa ilalim ng Kautusan.
  rationale: Pinalitan ang “makamit ko” ng “mapanalunan ko” sa dalawang paglitaw upang maging likas ang Tagalog para sa pagkapanalo o paghikayat ng mga tao, nang hindi nagdaragdag ng teolohikal o paraang hindi ipinahahayag ng Griyego. Pinagdugtong din ang dalawang sugnay sa pamamagitan ng tuldok-kuwit upang mas maipakita ang iisang retorikal na pangungusap ng pinagmulan. Pinanatili ang lahat ng mahalagang pag-uulit, ang parentetikong paglilinaw, at ang maingat na talababa tungkol sa Kautusan.
