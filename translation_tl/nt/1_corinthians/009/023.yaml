  source_fidelity: Tapat ang salin sa Griyego. Ang “Ngunit” ay sapat para sa δέ; ang “ginagawa ko ang lahat ng ito” ay naihahatid ang komprehensibong πάντα at ang kasalukuyang ποιῶ; at ang “alang-alang sa magandang balita” ay angkop para sa διὰ τὸ εὐαγγέλιον. Ang “upang makibahagi rin ako rito” ay natural na Tagalog na paghahatid ng layuning ipinakikilala ng ἵνα at ng malawak na diwa ng συγκοινωνὸς αὐτοῦ γένωμαι. Hindi nito ipinipilit kung ang pakikibahagi ay sa mga pagpapala, pagsulong, o gawain ng magandang balita.
