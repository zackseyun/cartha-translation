  terminology: Wasto at pare-pareho ang “magandang balita” para sa εὐαγγέλιον, habang ang “ebanghelyo” ay maayos na ibinigay bilang alternatibong leksikal sa talababa. Pinananatili ng talababa b ang mas pormal na anyo ng “maging kapwa-kabahagi nito” at isang natural na alternatibo, nang hindi pinaliliit ang saklaw ng συγκοινωνός.
