  yaml_path: translation/nt/1_corinthians/009/023.yaml
  text: But I do all things for the sake of the good news[b][a], so that I may become a fellow participant in it.
translation:
  language: tl
  text: Ngunit ginagawa ko ang lahat ng ito alang-alang sa magandang balita[a], upang makibahagi rin ako rito[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ebanghelyo.”
    reason: lexical_alternative
  - marker: b
    text: 'Mas literal: “upang ako rin ay maging kapwa-kabahagi nito”; maaari ring “upang magkaroon din ako ng bahagi rito.”'
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: ang lahat ng ito
  rationale: Komprehensibo ang πάντα; idinagdag ang “ito” bilang likas na pantukoy sa mga gawaing binanggit sa naunang konteksto, nang hindi nililimitahan ang saklaw.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig ng δέ ang banayad na pagsalungat sa naunang pahayag; natural at malinaw dito ang “Ngunit.”
- source_word: ποιῶ
  choice: ginagawa ko
  rationale: Ang kasalukuyang panahunan ay nagpapahayag ng patuloy o nakaugaliang pagkilos ni Pablo; likas itong naihahatid ng “ginagawa ko.”
- source_word: διὰ τὸ εὐαγγέλιον
  choice: alang-alang sa magandang balita
  rationale: Ang διά na may akusatibo ay nagpapahayag dito ng dahilan, layunin, o kapakanan. Pinananatili ng “alang-alang sa” ang lawak na iyon, at madaling maunawaan ang εὐαγγέλιον bilang “magandang balita.”
- source_word: ἵνα
  choice: upang
  rationale: Malinaw na ipinakikilala ng ἵνα ang layunin ng kilos ni Pablo.
- source_word: συγκοινωνὸς
  choice: makibahagi rin
  rationale: Ipinahihiwatig ng συγκοινωνός ang pakikibahagi kasama ng iba. Ang “makibahagi rin” ay natural sa modernong Tagalog at naipapakita ang kasamang pakikilahok nang hindi tinutukoy kung biyaya, pagpapalaganap, o ministeryo lamang ang tinutukoy.
- source_word: αὐτοῦ
  choice: rito
  rationale: Pinakamalapit na tinutukoy nito ang neutrong εὐαγγέλιον. Ang “rito” ay idiomatikong tumutukoy sa magandang balita bilang bagay na kinabibilangan o pinakikibahagian.
- source_word: γένωμαι
  choice: makibahagi
  rationale: Ang aorist middle subjunctive ng γίνομαι kasama ng συγκοινωνός ay literal na “maging isang kapwa-kabahagi.” Sa Tagalog, likas na pinagsasama ang ideya sa pandiwang “makibahagi”; ibinibigay sa talababa ang mas pormal na anyo.
theological_decisions:
- issue: Ang kahulugan ng pakikibahagi ni Pablo kaugnay ng magandang balita
  choice: Panatilihing malawak ang “makibahagi rito,” na maaaring tumukoy sa mga pagpapala, pagsulong, o gawain ng magandang balita.
  alternative: Tahasang sabihing nakikibahagi siya sa mga pagpapala nito, sa pagpapalaganap nito, o sa ministeryo nito.
  rationale: Hindi nililinaw ng συγκοινωνός kung aling aspekto ng pakikibahagi ang pangunahing tinutukoy. Iniiwasan ng salin ang pagpasok ng isang makitid o sistematikong teolohikal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “magandang balita” sa pangunahing teksto para sa malinaw na kahulugan, habang inilagay ang tradisyonal na “ebanghelyo” sa talababa. Ang “makibahagi rin ako rito” ay mas likas kaysa sa nominal na “maging kapwa-kabahagi,” ngunit pinananatili sa talababa ang mas pormal na hugis ng Griyego.
