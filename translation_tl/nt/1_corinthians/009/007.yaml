id: 1CO.9.7
reference: 1 Corinthians 9:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τίς στρατεύεται ἰδίοις ὀψωνίοις ποτέ; τίς φυτεύει ἀμπελῶνα καὶ ⸂τὸν καρπὸν⸃ αὐτοῦ οὐκ ἐσθίει; ⸀τίς ποιμαίνει ποίμνην καὶ ἐκ τοῦ γάλακτος τῆς ποίμνης οὐκ ἐσθίει;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/007.yaml
  text: Who ever serves as a soldier at his own expense? Who plants a vineyard and does not eat its fruit? Or who shepherds a flock and does not drink from the milk of the flock?[a][b]
translation:
  language: tl
  text: Sino ba ang naglilingkod bilang kawal sa sarili niyang gastos? Sino ang nagtatanim ng ubasan at hindi kumakain ng bunga nito? O sino ang nagpapastol ng kawan at hindi umiinom ng gatas mula sa kawan?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “hindi kumakain mula sa gatas ng kawan.” Sa Tagalog, karaniwang sinasabing “umiinom” kapag gatas ang tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατεύεται
  choice: naglilingkod bilang kawal
  rationale: Tumutukoy ang pandiwa sa paglilingkod sa hukbo; pinananatili ng salin ang paghahalintulad sa gawain ng isang kawal nang hindi nililimitahan sa mismong pakikipagdigma.
- source_word: ἰδίοις ὀψωνίοις
  choice: na siya mismo ang gumagastos
  rationale: Ang ὀψώνιον ay maaaring tumukoy sa sahod o rasyon ng kawal, ngunit sa tanong ay ang diwa na hindi sariling gastos ng kawal ang paglilingkod niya. Likas at malinaw ito sa modernong Tagalog.
- source_word: ποτέ
  choice: ba
  rationale: Sa ganitong retorikal na tanong, natural na naipahihiwatig ng Tagalog na 'Sino ba ang...' ang diwang 'sino kailanman' nang hindi nagiging mabigat ang pangungusap.
- source_word: φυτεύει ἀμπελῶνα
  choice: nagtatanim ng ubasan
  rationale: Tuwirang pinananatili ang larawang agrikultural ng pagtatanim ng isang ubasan.
- source_word: τὸν καρπὸν αὐτοῦ
  choice: bunga nito
  rationale: Ang καρπός ay bunga o ani ng ubasan; 'bunga nito' ay literal at natural.
- source_word: ποιμαίνει ποίμνην
  choice: nagpapastol ng kawan
  rationale: Pinananatili nito ang tiyak na larawang pastoral ng pag-aalaga at pagpapakain sa kawan.
- source_word: ἐκ τοῦ γάλακτος τῆς ποίμνης
  choice: gatas mula sa kawan
  rationale: Pinananatili ang diwang pinagmumulan o pakikibahagi sa ibinibigay ng kawan.
- source_word: ἐσθίει
  choice: kumakain / umiinom
  rationale: Literal na 'kumakain' ang pandiwa sa dalawang tanong, ngunit natural sa Tagalog ang 'umiinom' kapag gatas ang tinutukoy; ipinaliliwanag sa talababa ang pagbabagong idyomatiko.
theological_decisions:
- issue: Panlalaking isahan bilang pangkalahatang halimbawa sa magkakasunod na τίς
  choice: Gumamit ng 'sino' at 'siya' bilang isahang pangkalahatang halimbawa
  alternative: Gumamit ng maramihang anyo o ulitin ang 'tao'
  rationale: Hindi minamarkahan ng 'sino' at 'siya' ang kasarian sa Tagalog, ngunit natural na pinananatili ang isahang anyo at retorikal na puwersa ng Griyego nang hindi nagdaragdag ng kasariang hindi kailangang ipahayag sa target na wika.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignified, at madaling maunawaan. Ginamit ang 'kawal' at 'kawan' upang mapanatili ang tiyak na mga larawang militar at pastoral; iniwasan ang mas teknikal o makalumang pagkakabuo.
