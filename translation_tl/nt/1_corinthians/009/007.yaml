  to: Sino ba ang naglilingkod bilang kawal sa sarili niyang gastos? Sino ang nagtatanim ng ubasan at hindi kumakain ng bunga nito? O sino ang nagpapastol ng kawan at hindi umiinom ng gatas mula sa kawan?[a]
  rationale: Pinalitan ang unang pagkakabuo upang malinaw na maipahayag na ang kawal ay hindi naglilingkod sa sariling gastos. Hindi binago ang kahulugan, retorikal na anyo, o mga larawang nasa talata. Pinanatili ang talababa dahil wasto nitong ipinapaliwanag ang idyomatikong paggamit ng “umiinom” para sa gatas.
