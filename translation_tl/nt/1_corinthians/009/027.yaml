  text: ἀλλὰ ὑπωπιάζω μου τὸ σῶμα καὶ δουλαγωγῶ, μή πως ἄλλοις κηρύξας αὐτὸς ἀδόκιμος γένωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/027.yaml
  text: But I discipline my body and make it my servant[a], lest somehow, after preaching to others[c][b], I myself should become disqualified.
translation:
  language: tl
  text: Ngunit mahigpit kong dinidisiplina ang aking katawan[a] at ginagawa ko itong alipin[b], baka pagkatapos kong mangaral sa iba ay ako mismo ay maging diskuwalipikado[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hinahampas ko ang aking katawan.” Literal na maaaring tumukoy ang pandiwang Griyego sa paghampas sa ilalim ng mata; dito ay metapora ito ng matinding pagdidisiplina sa sarili.
    reason: lexical_alternative
  - marker: b
    text: O “inaalipin ko ito” o “ginagawa ko itong alipin.”
    reason: lexical_alternative
  - marker: c
    text: O “di-aprubado” o “itinakwil.” Ang “diskuwalipikado” ay angkop sa larawang atletiko sa konteksto.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Sa halip
  rationale: Nagpapakita ito ng mariing pagsalungat sa naunang larawan ng takbo at pagpipigil sa sarili.
- source_word: ὑπωπιάζω
  choice: mahigpit kong dinidisiplina
  rationale: Ang pandiwa ay literal na maaaring tumukoy sa paghampas sa ilalim ng mata, ngunit dito ay metaporikal na nagpapahayag ng matinding pagdidisiplina sa sarili. Napananatili ng salin ang tindi nang hindi ipinapalagay na literal na pananakit sa sarili ang ibig sabihin.
- source_word: σῶμα
  choice: katawan
  rationale: Pinananatili ang kongkretong katawagan ni Pablo sa halip na gawing pangkalahatang 'sarili.'
- source_word: δουλαγωγῶ
  choice: ginagawa itong alipin ko
  rationale: Pinananatili nito ang malakas na metapora ng pagpapailalim sa pagkaalipin, sa halip na pahinain bilang simpleng pagkontrol.
- source_word: μή πως
  choice: upang ... ay hindi
  rationale: Natural nitong ipinahahayag sa Tagalog ang negatibong layunin o pinangangambahang kalalabasan.
- source_word: ἄλλοις
  choice: sa iba
  rationale: Likas na katumbas ng datibong tumutukoy sa mga pinangaralan.
- source_word: κηρύξας
  choice: matapos akong mangaral
  rationale: Malinaw na ipinahahayag ang naunang kilos ng aorist participle kaugnay ng pinangangambahang kalalabasan.
- source_word: ἀδόκιμος
  choice: matagpuang hindi karapat-dapat
  rationale: Ipinahahayag nito ang di-pagpasa sa pagsusuri o di-pagkamit ng pagsang-ayon, habang hindi nilulutas kung tiyak na tumutukoy ito sa kaligtasan, gantimpala, o pagiging karapat-dapat sa ministeryo.
- source_word: γένωμαι
  choice: matagpuan
  rationale: Sa ganitong konteksto, natural na ipinahahayag ng 'matagpuan' ang posibilidad na mapatunayang hindi pasado sa pagsusuri.
theological_decisions:
- issue: Saklaw ng babala sa ἀδόκιμος
  choice: Hindi karapat-dapat, sa loob ng larawang atletiko at pagsusuri
  alternative: Tuluyang itinakwil ng Diyos; o mawalan lamang ng gantimpala o pagiging kapaki-pakinabang sa ministeryo
  rationale: Seryoso ang babala, ngunit hindi tahasang nililinaw ng Griyego kung ito ay tungkol sa pangwakas na kaligtasan, gantimpala, o ministeryal na katayuan. Pinananatili ng salin ang tensiyong ito.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang 'Sa halip' para sa mariing kaibahan, 'mahigpit kong dinidisiplina' upang natural na ihatid ang matinding metapora, at 'alipin' upang mapanatili ang lakas ng δουλαγωγῶ. Inilagay ang mga panandang [a], [b], at [c] sa mismong teksto.
