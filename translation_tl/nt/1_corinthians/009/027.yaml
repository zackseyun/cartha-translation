  verdict: revise
  source_fidelity: Kailangang baguhin ang pangunahing pangatnig at ang sugnay ng pangamba. Ang ἀλλά ay payak na pagsalungat, kaya mas tumpak ang “Ngunit” kaysa “Sa halip.” Ang μή πως ay nagpapahayag ng pangamba (“baka”), hindi lamang layunin (“upang ... ay hindi”). Ang “matagpuang hindi karapat-dapat” ay nagdaragdag ng ideya ng pagkakatuklas/pagsusuri na wala sa γένωμαι at pinapahina ang atletikong diwa ng ἀδόκιμος.
  naturalness: Natural at marangal sa modernong Filipino ang “Ngunit mahigpit kong dinidisiplina ang aking katawan at ginagawa ko itong alipin, baka pagkatapos kong mangaral sa iba ay ako mismo ay maging diskuwalipikado.” Mas direkta ito kaysa sa dating pangungusap at malinaw ang saklaw ng “baka.”
  terminology: Pinananatili ang “katawan” para sa σῶμα at “alipin” para sa δουλαγωγῶ. Ang “diskuwalipikado” ay pinakamainam para sa ἀδόκιμος sapagkat pinananatili nito ang larawang atletiko at ang teolohikal na di-pagpapasya ng teksto.
  issues:
  - severity: medium
    issue: “Sa halip” para sa ἀλλά
    rationale: Ang “Sa halip” ay karaniwang nagpapahiwatig ng pagpapalit o alternatibo; ang ἀλλά rito ay pangatnig ng pagsalungat. “Ngunit” ang mas tuwirang katumbas.
  - severity: medium
    issue: “upang ... ay hindi” para sa μή πως
    rationale: Bagaman may aspektong layunin ang konstruksyon, ang μή πως ay may malinaw na himig ng pangamba o pag-iingat. “Baka” ang likas at mas tapat na Tagalog na katumbas.
  - severity: medium
    issue: “matagpuang hindi karapat-dapat” para sa ἀδόκιμος γένωμαι
    rationale: Ang “matagpuan” ay nagdaragdag ng pasibong ideya ng pagkakatuklas na hindi hayag sa γένωμαι. Ang “maging diskuwalipikado” ay mas malapit sa pandiwa at sa atletikong konteksto.
