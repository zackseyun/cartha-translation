  text: This is my defense to those who examine me[a].
translation:
  language: tl
  text: Ito ang aking pagtatanggol sa mga sumusuri sa akin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ito ang aking pagtatanggol sa harap ng mga humahatol sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολογία
  choice: pagtatanggol
  rationale: Tumutukoy ito sa sagot ni Pablo sa masusing pag-alam o pagpuna tungkol sa kanyang pagkaapostol at mga karapatan. Ang “pagtatanggol” ay malinaw at hindi nagpapahiwatig ng paghingi ng paumanhin.
- source_word: ἀνακρίνουσίν
  choice: sumusuri
  rationale: Ipinahihiwatig ng pandiwa ang masusing pag-iimbestiga o pagtatasa. Pinananatili ng “sumusuri” ang ganitong diwa nang hindi agad nagpapahiwatig ng pinal na hatol.
- source_word: Ἡ ἐμὴ
  choice: aking
  rationale: Likas at sapat na ipinahahayag ng “aking” ang pagmamay-ari; hindi kailangang dagdagan ng diin na wala naman sa konteksto.
- source_word: τοῖς ἐμὲ ἀνακρίνουσίν
  choice: sa mga sumusuri sa akin
  rationale: Ipinakikita ng pariralang may datibo kung kanino inihaharap o itinutuon ang pagtatanggol ni Pablo.
- source_word: ἐστιν αὕτη
  choice: Ito ang
  rationale: Natural sa Tagalog ang ayos na “Ito ang aking pagtatanggol,” at malinaw nitong kinikilala ang tinutukoy bilang pagtatanggol ni Pablo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na tuwiran, marangal, at madaling maunawaan. Ginamit ang “sumusuri” sa pangunahing teksto upang mapanatili ang diwa ng kritikal na pagsusuri nang hindi labis na gawing hudisyal ang pahayag; nasa talababa ang mas hudisyal na alternatibo.
