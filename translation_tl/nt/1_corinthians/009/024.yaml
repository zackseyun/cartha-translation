source:
  edition: SBLGNT
  text: Οὐκ οἴδατε ὅτι οἱ ἐν σταδίῳ τρέχοντες πάντες μὲν τρέχουσιν, εἷς δὲ λαμβάνει τὸ βραβεῖον; οὕτως τρέχετε ἵνα καταλάβητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/024.yaml
  text: Do you not know that those who run in a stadium all run[a], but one receives the prize? Run in this way[b], so that you may obtain it.
translation:
  language: tl
  text: Hindi ba ninyo alam na ang lahat ng tumatakbo sa istadyum[a] ay tumatakbo, ngunit iisa ang tumatanggap ng gantimpala? Tumakbo kayo sa gayong paraan[b] upang makamit ninyo ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa takbuhan.” Ang Griegong στάδιον ay tumutukoy sa lugar o pista ng takbuhan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “Tumakbo kayo nang sa gayon ay manalo” o “upang masunggaban ninyo ito.” Ang Griegong καταλάβητε ay maaaring mangahulugang “makamit,” “maabot,” o “masunggaban.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐκ οἴδατε
  choice: Hindi ba ninyo alam
  rationale: Pinananatili ang karaniwang retorikal na tanong ni Pablo at ang tuwirang diwa ng οἶδα sa natural na modernong Tagalog.
- source_word: ἐν σταδίῳ
  choice: sa takbuhan
  rationale: Tumutukoy ang στάδιον sa lugar o riles na pinagdarausan ng takbuhan. Mas malinaw sa karaniwang mambabasa ang “takbuhan” habang nananatili ang kongkretong larawang atletiko.
- source_word: τρέχοντες ... τρέχουσιν
  choice: ang lahat ng tumatakbo ... ay tumatakbo
  rationale: Pinananatili ang pag-uulit ng τρέχω upang maingatan ang diin at masiglang talinghaga ng orihinal.
- source_word: πάντες μὲν ... εἷς δὲ
  choice: ang lahat ... ngunit isa lamang
  rationale: Malinaw at likas na ipinahahayag ang paghahambing ng μέν...δέ; ang “lamang” ay natural na nagpapakita ng kaibahan ng lahat sa iisa.
- source_word: λαμβάνει
  choice: tumatanggap
  rationale: Ito ang tuwirang diwa ng pandiwa at hindi nito pinangungunahan ang mas interpretatibong “nanalo.”
- source_word: τὸ βραβεῖον
  choice: ang gantimpala
  rationale: Karaniwan at malinaw na katawagan sa gantimpalang ibinibigay sa nagwagi sa paligsahang atletiko.
- source_word: οὕτως
  choice: nang gayon
  rationale: Iniuugnay nito ang utos sa paraang inilalarawan ng naunang paghahambing, nang hindi nilalagyan ng paliwanag na wala sa teksto.
- source_word: τρέχετε
  choice: Tumakbo kayo
  rationale: Likas at mariing pautos sa Tagalog; malinaw rin sa “kayo” na maramihan ang kausap.
- source_word: ἵνα καταλάβητε
  choice: upang makamit ninyo iyon
  rationale: Sinasaklaw ng “makamit” ang diwa ng pag-abot o pagtatamo ng καταλαμβάνω sa konteksto ng gantimpala, habang ang “iyon” ay likas na tumutukoy sa nabanggit na gantimpala.
theological_decisions:
- issue: Paglalapat ng talinghaga ng takbuhan sa pagtitiyagang Kristiyano
  choice: Panatilihin ang larawang kompetitibo at ang mariing panawagang tumakbo upang makamit ang gantimpala, nang hindi ipinapaliwanag kung ito ay kaligtasan o ibang uri ng gantimpala.
  alternative: Isalin nang mas interpretatibo bilang “tumakbo kayo upang manalo” o tukuyin ang gantimpala ayon sa isang partikular na doktrina.
  rationale: Hinihimok ni Pablo ang disiplinado at may-layuning pagsisikap sa pamamagitan ng larawang atletiko. Hindi nilulutas ng talata mismo ang mas malawak na usapin tungkol sa biyaya, merito, pagtitiyaga, o gantimpala, kaya hindi iyon dapat idagdag sa salin.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang retorikal na tanong, pag-uulit ng “tumatakbo,” at kongkretong talinghaga ng paligsahan. Ginamit ang “takbuhan” sa halip na hiram na “istadyum” sa pangunahing teksto, ngunit inilagay ang leksikal na alternatibo sa talababa.
