  to: Hindi ba ninyo alam na ang lahat ng tumatakbo sa istadyum[a] ay tumatakbo, ngunit iisa ang tumatanggap ng gantimpala? Tumakbo kayo sa gayong paraan[b] upang makamit ninyo ito.
