id: 1CO.9.22
reference: 1 Corinthians 9:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐγενόμην τοῖς ⸀ἀσθενέσιν ἀσθενής, ἵνα τοὺς ἀσθενεῖς κερδήσω· τοῖς πᾶσιν ⸀γέγονα πάντα, ἵνα πάντως τινὰς σώσω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/022.yaml
  text: To the weak I became weak[a], so that I might win the weak. I have become all things to all people[b], so that by all means I might save some.
translation:
  language: tl
  text: Sa mahihina, naging mahina ako[a] upang mahikayat ko ang mahihina. Naging lahat ako sa lahat ng tao upang, sa lahat ng paraan[b], mailigtas ko ang ilan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mahina ang budhi.” Sa 1 Corinto, maaaring tumukoy ang “mahihina” lalo na sa mga taong madaling masugatan ang budhi.
    reason: lexical_alternative
  - marker: b
    text: O “sa bawat posibleng paraan.” Ang parirala ay tumutukoy sa paggamit ng lahat ng maaaring paraan upang maabot ang layunin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγενόμην
  choice: naging
  rationale: Tumutukoy ito sa kusang pakikibagay ni Pablo sa mga kalagayan ng kanyang paglilingkod; likas sa Tagalog ang “naging” at pinananatili nito ang diwa ng pagpasok sa isang kalagayan.
- source_word: ἀσθενέσιν / ἀσθενής / ἀσθενεῖς
  choice: mahihina / mahina / mahihina
  rationale: Pinananatili ang pag-uulit at retorikal na bisa ng salitang Griyego. Maaaring kabilang dito ang mahihina ang budhi, ngunit hindi nililimitahan ng talata ang kahulugan doon.
- source_word: κερδήσω
  choice: mahikayat ko
  rationale: Sa kontekstong misyonero, ang diwa ay mahikayat o makumbinsi ang mga tao, hindi magkaroon lamang ng pakinabang. Mas likas ito sa kasalukuyang Tagalog kaysa sa literal na “makamit ko” kapag tao ang layon.
- source_word: τοῖς πᾶσιν
  choice: sa lahat ng tao
  rationale: Pawang tao ang tinutukoy sa konteksto; nililinaw ng “tao” ang eliptikong pariralang Griyego nang hindi pinakikitid ang saklaw nito.
- source_word: γέγονα
  choice: naging
  rationale: Bagaman perpekto ang anyong Griyego at nagpapahiwatig ng kalagayang bunga ng patuloy na huwaran ng pagkilos, ang “naging” ang pinakanatural na anyo sa Tagalog sa pangungusap na ito.
- source_word: πάντα
  choice: lahat
  rationale: Pinananatili nito ang matindi at siksik na pahayag na “lahat sa lahat ng tao” nang hindi ito ipinapaliwanag nang higit sa sinasabi ng Griyego.
- source_word: πάντως
  choice: sa lahat ng paraan
  rationale: Ipinahihiwatig nito ang paggamit ng lahat ng posibleng paraan para sa layunin, nang hindi ipinapalagay na kabilang ang di-matuwid na kompromiso.
- source_word: τινὰς
  choice: ang ilan
  rationale: Pinananatili ang maingat at limitadong pahayag ni Pablo; hindi niya sinasabing maliligtas ang lahat sa pamamagitan ng kanyang gawain.
- source_word: σώσω
  choice: mailigtas ko
  rationale: Pinananatili ang tahasang wika ng kaligtasan at ang pagkakalahad kay Pablo bilang kasangkapan sa gawaing ito, nang hindi dinaragdagan ang sinasabi ng teksto tungkol sa sukdulang pinagmumulan ng kaligtasan.
theological_decisions:
- issue: Kahulugan ng “mahihina”
  choice: Malawak na isinaling “mahihina” sa pangunahing teksto.
  alternative: “mahihina ang budhi” o “walang kapangyarihan”
  rationale: Sa 1 Corinto, maaaring tumukoy ang salita sa mga taong madaling masugatan ang budhi, lalo na sa mga kabanata 8–10, ngunit nananatiling pangkalahatan ang mismong pananalita rito. Hindi dapat paliitin ng salin ang tunay na saklaw ng Griyego.
- issue: Lakas at ahensiya ng “mailigtas ko”
  choice: Ginamit ang tuwirang “mailigtas ko” bilang layuning pang-ebanghelyo ni Pablo.
  alternative: “maakay ko sa kaligtasan” o “makatulong akong iligtas”
  rationale: Tunay na wika ng kaligtasan ang σώζω. Ang mas mahinang salin ay magbabawas sa diin ng teksto, samantalang ang paliwanag na “makatulong” ay magdaragdag ng salitang wala rito. Pinananatili ng salin ang tensiyon ng pagkakalahad kay Pablo bilang gumaganap na kasangkapan.
- issue: Saklaw ng “naging lahat ako sa lahat ng tao”
  choice: Pinanatili ang malawak at matalinghagang pahayag.
  alternative: “nakibagay ako sa lahat ng uri ng tao”
  rationale: Ang “nakibagay” ay mas paliwanag at maaaring agad magtakda kung ano ang ibig sabihin ng pagiging “lahat.” Pinananatili ng pangunahing teksto ang retorikal na lawak at tensiyon ng orihinal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang tatlong ulit na “mahina/mahihina” at ang matalinghagang “naging lahat ako sa lahat ng tao” para sa retorikal na bisa ng Griyego. Inilagay ang talababa [b] sa pariralang “sa lahat ng paraan,” na siyang katumbas ng πάντως.
