  source_fidelity: 'Tumpak ang unang sugnay: ang “nang kusang-loob,” “ginagawa ko ito,” at “gantimpala” ay maayos na tumutugon sa ἑκών, τοῦτο πράσσω, at μισθόν. Gayunman, ang ikalawang sugnay ng draft ay may maling pagkakabuo at inuulit ang diwa ng ipinagkatiwalang tungkulin. Ang binagong salin ay malinaw na isinasalin ang οἰκονομίαν πεπίστευμαι bilang pananagutang pangasiwaan na ipinagkatiwala kay Pablo, nang hindi ipinapakahulugang wala siyang gantimpala sa isang doktrinal na paraan.'
