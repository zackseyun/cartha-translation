base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/017.yaml
  text: For if I do this willingly[a], I have a reward; but if unwillingly, I have been entrusted with a stewardship.
translation:
  language: tl
  text: Sapagkat kung ginagawa ko ito nang kusang-loob, may gantimpala ako; ngunit kung hindi ko ito ginagawa nang kusang-loob, ipinagkatiwala sa akin ang isang pananagutang pangasiwaan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “isang pangangasiwa ang ipinagkatiwala sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκὼν
  choice: nang kusang-loob
  rationale: Likas at malinaw itong salin ng kusang pagkilos at pinananatili ang tuwirang pagsalungat sa ἄκων.
- source_word: τοῦτο πράσσω
  choice: ginagawa ko ito
  rationale: Pinananatili nito ang malawak na pagtukoy ng Griyego sa gawaing ministeryal na tinatalakay sa konteksto nang hindi ito labis na tinutukoy.
- source_word: μισθὸν
  choice: gantimpala
  rationale: Maaaring tumukoy ang salita sa bayad o gantimpala; sa kontekstong ito, mas angkop ang “gantimpala” at hindi nito nililimitahan ang diwa sa suweldo.
- source_word: ἄκων
  choice: hindi kusang-loob
  rationale: Tumpak nitong pinananatili ang kabaligtaran ng ἑκὼν nang hindi idinaragdag ang mas matinding damdaming maaaring ipahiwatig ng “napipilitan” o “labag na labag sa kalooban.”
- source_word: οἰκονομίαν
  choice: tungkulin ... bilang katiwala
  rationale: Ipinahahayag nito sa natural na Tagalog ang pananagutang ipinagkatiwala sa isang katiwala, habang pinananatili ang larawan ng pamamahala sa ipinagkatiwalang gawain.
- source_word: πεπίστευμαι
  choice: ipinagkatiwala sa akin
  rationale: 'Isinasalamin nito ang pasibong kahulugan at ang nananatiling kalagayang bunga ng perpektong aspekto: natanggap ni Pablo ang pananagutang ipinagkatiwala sa kaniya.'
theological_decisions:
- issue: Ang kalikasan ng ministeryo ni Pablo sa ikalawang sugnay
  choice: Kahit hindi niya ito ginagawa nang kusang-loob, nananatili siyang may tungkuling ipinagkatiwala sa kaniya bilang katiwala.
  alternative: Tungkulin lamang at hindi gantimpala ang tinatanggap niya kapag hindi kusang-loob ang kaniyang pagkilos; o ipinaghahambing niya ang kusang paglilingkod at sapilitang katungkulan.
  rationale: Pinananatili ng salin ang tensiyon sa pagitan ng gantimpala para sa kusang paglilingkod at ng pananagutang ipinagkatiwala, nang hindi nagpapasok ng isang partikular na teorya tungkol sa ministeryo o pagtawag.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Ginamit ang “tungkulin ... bilang katiwala” upang maging natural ang οἰκονομία nang hindi mawala ang larawan ng ipinagkatiwalang pamamahala.
