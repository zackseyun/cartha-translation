revisions:
- from: Sapagkat nasusulat sa Kautusan ni Moises, “Huwag mong busalan ang baka habang gumigiik ito.”[a] Ang mga baka ba ang pinagmamalasakitan ng Diyos?
  to: Sapagkat nasusulat sa Kautusan ni Moises, “Huwag mong busalan ang baka habang ito’y gumigiik.”[a] Ang mga baka ba ang pinagmamalasakitan ng Diyos?
  rationale: Bahagyang inayos ang ayos ng panghalip sa sugnay na tumutukoy sa paggigiik upang luminaw na ang baka ang gumagawa ng kilos. Inayos din ang talababa sa mas likas na singular na “ang butil,” habang pinananatili ang alternatibong nagpapalinaw sa paraang pagtapak. Pinanatili ang iba pang salin dahil tapat ito sa Griyego, sa retorikal na puwersa ng μή, at sa angkop na rehistro.
