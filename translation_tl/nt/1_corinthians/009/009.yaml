  yaml_path: translation/nt/1_corinthians/009/009.yaml
  text: For it is written in the law of Moses[a], “You shall not muzzle an ox while it is threshing.” Is God concerned about oxen?
translation:
  language: tl
  text: Sapagkat nasusulat sa Kautusan ni Moises, “Huwag mong busalan ang baka habang ito’y gumigiik.”[a] Ang mga baka ba ang pinagmamalasakitan ng Diyos?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “habang tinatapakan nito ang butil.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν γὰρ τῷ Μωϋσέως νόμῳ
  choice: Sapagkat nasusulat sa Kautusan ni Moises
  rationale: Likas sa makabagong Tagalog ang “sa Kautusan ni Moises,” at malinaw nitong pinananatili ang kaugnayang ipinahahayag ng genitive na Μωϋσέως. Isinama ang γάρ bilang “sapagkat” upang mapanatili ang lohikal na ugnayan sa naunang pangangatwiran.
- source_word: γέγραπται
  choice: nasusulat
  rationale: Karaniwang pormulang Tagalog ito sa pagpapakilala ng sipi mula sa Kasulatan at naipahihiwatig ang nananatiling bisa ng nakasulat.
- source_word: Οὐ κημώσεις
  choice: Huwag mong busalan
  rationale: Ang “huwag” ay likas na anyo ng pagbabawal sa Tagalog, samantalang tuwirang katumbas ng κημόω ang “busalan.”
- source_word: βοῦν
  choice: ang baka
  rationale: Ang “baka” ang malinaw at pangkaraniwang tawag sa hayop na bovine sa Tagalog. Hindi na idinagdag ang “pantrabaho” sapagkat hindi iyon tahasang nasa salitang Griyego.
- source_word: ἀλοῶντα
  choice: habang gumigiik ito
  rationale: Ipinahahayag ng “habang” ang nagpapatuloy at kasabay na kilos ng present participle. Ang “gumigiik” ay maikli at tumpak; inilagay sa talababa ang mas kongkretong paglalarawan sa pagtapak sa mga butil.
- source_word: μὴ τῶν βοῶν μέλει τῷ θεῷ
  choice: Ang mga baka ba ang pinagmamalasakitan ng Diyos?
  rationale: Pinananatili nito ang retorikal na tanong at ang diin sa τῶν βοῶν nang hindi idinaragdag ang salitang “lamang,” na wala sa Griyego. Ang “pinagmamalasakitan” ay natural na nagpapahayag ng μέλει sa kontekstong ito.
theological_decisions:
- issue: Ang retorikal na tanong ni Pablo tungkol sa malasakit ng Diyos sa mga baka
  choice: 'Isinalin bilang tuwirang retorikal na tanong: “Ang mga baka ba ang pinagmamalasakitan ng Diyos?”'
  alternative: “Mga baka lamang ba ang pinagmamalasakitan ng Diyos?” o “Hindi naman mga baka ang pinagmamalasakitan ng Diyos, hindi ba?”
  rationale: Ang μή ay naghuhudyat ng inaasahang negatibong sagot, ngunit hindi tahasang sinasabi ng teksto ang “lamang” ni lubusang itinatanggi ang malasakit ng Diyos sa mga hayop. Kaya pinanatili ang tensiyong teolohikal nang walang paliwanag na idinagdag sa mismong talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang pamilyar na pormulang “nasusulat” at ang pangkaraniwang “baka,” habang iniwasan ang labis na pormal o sektaryang pananalita. Inilagay ang panandang [a] pagkatapos ng pariralang tinutukoy ng talababa.
