source:
  edition: SBLGNT
  text: μὴ οὐκ ἔχομεν ἐξουσίαν ἀδελφὴν γυναῖκα περιάγειν, ὡς καὶ οἱ λοιποὶ ἀπόστολοι καὶ οἱ ἀδελφοὶ τοῦ κυρίου καὶ Κηφᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/005.yaml
  text: Do we not have the right to take along a sister as a wife[a], as also the rest of the apostles and the brothers of the Lord and Cephas?
translation:
  language: tl
  text: Wala ba kaming karapatang isama sa paglalakbay ang isang asawang kapatid sa pananampalataya[a], gaya rin ng iba pang mga apostol, ng mga kapatid ng Panginoon, at ni Cefas?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na salin, “isang kapatid na babae, isang asawa”—ibig sabihin, isang asawang kapwa mananampalataya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουσίαν
  choice: karapatan
  rationale: Sa konteksto, tumutukoy ito sa lehitimong karapatan ng isang apostol, hindi lamang sa pangkalahatang awtoridad o kapangyarihan.
- source_word: ἀδελφὴν γυναῖκα
  choice: isang kapatid na babae bilang asawa
  rationale: Pinananatili nito ang dalawang sangkap ng pariralang Griyego—isang babaeng kapatid sa pananampalataya at isang asawa—nang hindi ipinapalagay na isa lamang siyang babaeng kasama.
- source_word: περιάγειν
  choice: magsama sa paglalakbay
  rationale: Ipinahihiwatig ng pandiwa rito ang pagsasama ng isang tao sa mga paglalakbay sa ministeryo; malinaw at natural ito sa makabagong Tagalog.
- source_word: ὡς καὶ
  choice: gaya ng
  rationale: Likas nitong ipinapahayag ang paghahambing sa ginagawa rin ng mga binanggit na apostol.
- source_word: οἱ λοιποὶ ἀπόστολοι
  choice: ibang mga apostol
  rationale: Natural sa Tagalog at wastong tumutukoy sa natitirang mga apostol bukod sa nagsasalita.
- source_word: οἱ ἀδελφοὶ τοῦ κυρίου
  choice: mga kapatid ng Panginoon
  rationale: Tuwirang pinananatili ang pariralang Griyego at hindi nilulutas ang pinagtatalunang eksaktong ugnayang pampamilya.
- source_word: Κηφᾶς
  choice: Cefas
  rationale: Pinananatili ang anyo ng pangalang ginamit sa tekstong Griyego sa halip na palitan ito ng Pedro.
theological_decisions:
- issue: Kahulugan ng “mga kapatid ng Panginoon”
  choice: Isinalin nang tuwiran bilang “mga kapatid ng Panginoon.”
  alternative: Mga kapatid sa laman, mga kapatid sa ama, o malalapit na kamag-anak ng Panginoon.
  rationale: Hindi mismo nilulutas ng pariralang Griyego ang mga sumunod na pagtatalo tungkol sa eksaktong ugnayan nila kay Jesus.
- issue: Kahulugan ng ἀδελφὴν γυναῖκα
  choice: “isang kapatid na babae bilang asawa”
  alternative: “isang asawang mananampalataya”
  rationale: Mas malapit ang pangunahing salin sa pormal na ayos ng Griyego at pinananatili ang kapatid-sa-pananampalataya at asawa bilang dalawang magkakaugnay na paglalarawan; nililinaw ng talababa ang diwa.
translation_notes:
  register: Makabagong, dignified, at madaling maunawaang Filipino. Ginamit ang “magsama sa paglalakbay” upang luminaw ang praktikal na diwa ng περιάγειν, habang pinanatili ang di-karaniwang anyo ng ἀδελφὴν γυναῖκα sa pangunahing teksto at ipinaliwanag ito sa talababa.
