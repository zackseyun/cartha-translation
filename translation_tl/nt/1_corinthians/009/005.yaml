revisions:
- from: Hindi ba may karapatan din kaming magsama sa paglalakbay ng isang kapatid na babae bilang asawa[a], gaya ng ibang mga apostol, ng mga kapatid ng Panginoon, at ni Cefas?
  to: Wala ba kaming karapatang isama sa paglalakbay ang isang asawang kapatid sa pananampalataya[a], gaya rin ng iba pang mga apostol, ng mga kapatid ng Panginoon, at ni Cefas?
  rationale: Pinalitan ang hindi likas na “magsama sa paglalakbay ng” ng “isama sa paglalakbay ang” upang malinaw na maihatid ang περιάγειν. Pinalitan ang posibleng mapanlinlang na “kapatid na babae bilang asawa” ng “asawang kapatid sa pananampalataya,” na natural sa Filipino at tumutugma sa idiomatikong diwa ng ἀδελφὴν γυναῖκα. Ang literal na anyo ay pinanatili sa talababa; hindi nito nilulutas ang anumang doktrinal na usapin hinggil sa “mga kapatid ng Panginoon.”
