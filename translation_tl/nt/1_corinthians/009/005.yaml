  terminology: Pinananatili ang “karapatan,” “Panginoon,” at “Cefas.” Ang “asawang kapatid sa pananampalataya” ay isang natural na paraan upang maihatid ang idiomatikong ἀδελφὴν γυναῖκα; pinananatili ng talababa ang literal na anyo ng Griyego.
