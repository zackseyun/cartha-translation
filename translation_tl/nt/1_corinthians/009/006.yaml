  yaml_path: translation/nt/1_corinthians/009/006.yaml
  text: Or is it only Barnabas and I who have no right not to work?[a]
translation:
  language: tl
  text: O kami lamang ba ni Bernabe ang walang karapatang hindi magtrabaho?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “awtoridad na hindi magtrabaho” o “kalayaang hindi maghanapbuhay.” Ang tinutukoy dito ay ang karapatang hindi magtrabaho para sa sariling ikabubuhay upang masuportahan habang naglilingkod.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: O
  rationale: Ipinagpapatuloy nito ang sunod na retorikal na tanong sa pangangatwiran ni Pablo.
- source_word: μόνος
  choice: lamang
  rationale: Binibigyang-diin nito na sina Pablo at Bernabe ang tanging ipinapalagay na hindi saklaw ng karapatang tinatalakay.
- source_word: ἐγὼ καὶ Βαρναβᾶς
  choice: kami … ni Bernabe
  rationale: Likas sa modernong Tagalog ang inklusibong pariralang “kami ni Bernabe” para sa Griyegong pinagsamang simuno na “ako at si Bernabe.”
- source_word: οὐκ ἔχομεν
  choice: walang
  rationale: Maikli at natural na paglalahad ng negatibong pag-aangkin sa isang retorikal na tanong.
- source_word: ἐξουσίαν
  choice: karapatan
  rationale: Sa konteksto, tumutukoy ito sa lehitimong karapatan ng mga apostol na tumanggap ng suporta, hindi sa kapangyarihang mamahala.
- source_word: μὴ ἐργάζεσθαι
  choice: hindi magtrabaho
  rationale: Pinananatili nito ang payak at malawak na diwa ng Griyego; ipinapaliwanag sa talababa ang kontekstuwal na pagtukoy sa pagtatrabaho para sa sariling ikabubuhay.
theological_decisions:
- issue: Kahulugan ng ἐξουσίαν sa konteksto
  choice: Karapatan ng mga apostol na hindi magtrabaho para tustusan ang sarili at sa halip ay tumanggap ng materyal na suporta sa ministeryo
  alternative: Pangkalahatang awtoridad o kalayaan na walang tiyak na kaugnayan sa materyal na suporta
  rationale: Ang nakapaligid na talata ay tumatalakay sa karapatan ng mga apostol sa pagkain at suporta, at sa kusang hindi paggamit ni Pablo sa karapatang iyon. Hindi pinalalawak ng pangunahing teksto ang pahayag nang higit sa mismong Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Pinanatili ang retorikal na tanong at ang bahagyang tensiyon ng pariralang “walang karapatang hindi magtrabaho,” habang nililinaw sa talababa ang konteksto.
