  source_fidelity: Tumpak na naipapahayag ng “O kami lamang ba ni Bernabe ang walang karapatang hindi magtrabaho?” ang retorikal na tanong ng ἢ μόνος ἐγὼ καὶ Βαρναβᾶς οὐκ ἔχομεν ἐξουσίαν μὴ ἐργάζεσθαι. Napananatili ang eksklusibong diin ng μόνος, ang pinagsamang simuno, at ang saklaw ng ἐξουσία bilang karapatan. Hindi labis na ipinapasok sa pangunahing teksto ang konteksto ng suportang pinansiyal.
  naturalness: Likas at malinaw sa modernong Filipino Tagalog ang “kami lamang ba ni Bernabe.” Ang “walang karapatang hindi magtrabaho” ay sadyang may bahagyang retorikal na tensiyon, ngunit nauunawaan at malapit sa porma ng Griyego; ang talababa ay nagbibigay ng sapat na paglilinaw nang hindi binabago ang pangunahing teksto.
  terminology: Ang “karapatan” ay angkop para sa ἐξουσία sa kontekstong ito. Ang “magtrabaho” ay malawak at hindi nagpapataw ng mas makitid na kahulugang “maghanapbuhay”; ang paliwanag tungkol sa sariling ikabubuhay at suporta sa paglilingkod ay nasa talababa lamang. Ang pangalang “Bernabe” ay wastong anyong Filipino.
