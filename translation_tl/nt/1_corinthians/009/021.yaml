id: 1CO.9.21
reference: 1 Corinthians 9:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τοῖς ἀνόμοις ὡς ἄνομος, μὴ ὢν ἄνομος ⸀θεοῦ ἀλλ’ ἔννομος ⸀Χριστοῦ, ἵνα ⸀κερδάνω ⸀τοὺς ἀνόμους·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/021.yaml
  text: To those outside the law[b][a], as one outside the law—though not being outside God’s law but under Messiah’s law—so that I might win those outside the law.
translation:
  language: tl
  text: Sa mga wala sa ilalim ng Kautusan[a], naging tulad ako ng isang wala sa ilalim ng Kautusan—bagaman hindi ako wala sa ilalim ng kautusan ng Diyos, kundi nasa ilalim ng kautusan ng Mesiyas[b]—upang mahikayat ko ang mga wala sa ilalim ng Kautusan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga walang Kautusan.” Dito, ang tinutukoy ay ang mga hindi nasa ilalim ng Kautusan ni Moises, hindi kinakailangang mga taong namumuhay nang walang moral na batas.
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, maaari ring unawain na “nasa loob ng kautusan ng Mesiyas.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνόμοις / ἄνομος / ἀνόμους
  choice: mga wala sa ilalim ng Kautusan / isang wala sa ilalim ng Kautusan
  rationale: Sa konteksto, tumutukoy ito sa mga hindi saklaw ng Kautusan ni Moises, hindi sa mga taong sadyang masama o suwail. Pinananatili ng salin ang tatlong pag-uulit at iniiwasan ang mapanlinlang na moral na diwa ng “mga walang batas.”
- source_word: ὡς
  choice: tulad ng
  rationale: Ipinahihiwatig nito ang pakikibagay ni Pablo sa kalagayan ng mga hindi saklaw ng Kautusan, hindi ang lubos niyang pagiging gayon.
- source_word: μὴ ὢν
  choice: bagaman hindi ako
  rationale: Likas na ipinahahayag sa Tagalog ang concessive na gamit ng participial clause na naglilimita sa naunang pahayag.
- source_word: θεοῦ
  choice: ng Diyos
  rationale: Likas na Tagalog na pagpapahayag ng genitive relation.
- source_word: ἔννομος
  choice: nasa ilalim ng kautusan
  rationale: Ipinahahayag ang pagiging saklaw o nasasakupan ng kautusan at malinaw na itinatapat sa pagiging wala sa ilalim nito.
- source_word: Χριστοῦ
  choice: ng Mesiyas
  rationale: Titular ang gamit ng Χριστός dito; kaya “Mesiyas” ang tuwirang salin, hindi ang anyong pangalang “Cristo.”
- source_word: ἵνα
  choice: upang
  rationale: Malinaw at marangal na panandang Tagalog para sa layunin.
- source_word: κερδάνω
  choice: mahikayat ko
  rationale: Sa kontekstong ebanghelistiko, ang diwa ay mahikayat o maakay ang mga tao, hindi magkaroon ng pakinabang na pananalapi. Mas natural ito kaysa literal na “mapanalunan ko” sa modernong Tagalog.
theological_decisions:
- issue: Kahulugan ng ἄνομος sa konteksto
  choice: Mga taong wala sa ilalim ng Kautusan ni Moises, lalo na ang mga Hentil
  alternative: Mga taong walang batas, masama, o suwail
  rationale: Itinatapat ng 1 Corinto 9:20–21 ang mga nasa ilalim ng Kautusan sa mga wala sa ilalim nito. Ipinakikita rin ng paglilinaw ni Pablo tungkol sa kautusan ng Diyos at ng Mesiyas na katayuang kaugnay ng Kautusan ang tinutukoy, hindi pangkalahatang kasamaan.
- issue: Diwa ng ἔννομος Χριστοῦ
  choice: Nasa ilalim ng kautusan ng Mesiyas
  alternative: Nasa loob ng kautusan ng Mesiyas; saklaw ng kautusan para sa Mesiyas
  rationale: 'Pinananatili nito ang legal at relasyonal na diwa: hindi itinuturing ni Pablo ang sarili na malaya sa kalooban ng Diyos, kundi saklaw ng kautusang kaugnay ng Mesiyas. Hindi nito ipinapantay nang walang paliwanag ang parirala sa buong tipan ng Kautusan ni Moises.'
- issue: Pagkasalin sa Χριστοῦ
  choice: Mesiyas
  alternative: Cristo
  rationale: Ang genitive ay gumaganap bilang titulo sa pariralang “kautusan ng Mesiyas,” kaya pinananatili ang kahulugan ng χριστός bilang ang Pinahiran o Mesiyas.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang malaking titik sa “Kautusan” kapag tumutukoy sa Kautusan ni Moises, ngunit maliit na titik sa “kautusan ng Diyos” at “kautusan ng Mesiyas” upang mapanatili ang pagkakaiba sa konteksto. Ang em dash ay nagpapanatili sa paglilinaw na pasingit ni Pablo.
