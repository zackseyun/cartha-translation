  source_fidelity: Tumpak na naihahatid ng salin ang tatlong ulit na ἀνόμος bilang mga taong hindi nasa ilalim ng Kautusan, ang concessive na μὴ ὢν, ang pagkakaiba ng kautusan ng Diyos at ng Mesiyas, at ang layuning ipinahahayag ng ἵνα. Ang “mahikayat ko” ay angkop sa ebanghelistikong diwa ng κερδάνω.
