base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/014.yaml
  text: In the same way[b][a], the Lord also commanded that those who proclaim the gospel should live from the gospel.
translation:
  language: tl
  text: Gayundin, iniutos ng Panginoon na ang mga nagpapahayag ng magandang balita[a] ay mabuhay mula sa magandang balita[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nangangaral ng magandang balita.”
    reason: lexical_alternative
  - marker: b
    text: O “magkaroon ng kabuhayan mula sa magandang balita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Sa gayunding paraan
  rationale: Malinaw na ipinahihiwatig ang paghahambing sa mga naunang halimbawa at natural ito sa makabagong Filipino.
- source_word: καὶ
  choice: din
  rationale: 'Ipinapakita ang karagdagang diin: bukod sa mga naunang halimbawa, nag-utos din ang Panginoon.'
- source_word: ὁ κύριος
  choice: ang Panginoon
  rationale: Karaniwan at marangal na katumbas ng κύριος; hindi pinalalawak sa 'Panginoong Jesus' upang mapanatili ang mismong anyo ng pinagmulan.
- source_word: διέταξεν
  choice: iniutos
  rationale: Ipinapahayag ang may-awtoridad na tagubilin, hindi lamang pagsasaayos o payo.
- source_word: τοῖς ... καταγγέλλουσιν
  choice: ang mga nagpapahayag
  rationale: Natural na substantibong parirala sa Filipino at pinananatili ang diwa ng hayagang pagpapahayag.
- source_word: τὸ εὐαγγέλιον
  choice: magandang balita
  rationale: Direkta, malinaw, at madaling maunawaang katumbas ng εὐαγγέλιον sa modernong Filipino.
- source_word: ἐκ τοῦ εὐαγγελίου
  choice: mula sa magandang balita
  rationale: Pinananatili ang anyong nagsasaad ng pinagmumulan sa Griyego, habang ang konteksto ang naglilinaw na kabuhayang suporta ang tinutukoy.
- source_word: ζῆν
  choice: mamuhay
  rationale: Natural na infinitibong Filipino kasunod ng 'iniutos' at pinananatili ang literal na larawan ng pamumuhay nang hindi agad ipinapaliwanag bilang paghahanapbuhay.
theological_decisions:
- issue: Tinutukoy ng 'Panginoon'
  choice: Pinanatili ang 'Panginoon'; sa konteksto, malamang na tumutukoy kay Jesus at sa kanyang turo tungkol sa pagsuporta sa mga manggagawa.
  alternative: Isang mas pangkalahatang pagtukoy sa Diyos.
  rationale: Hindi dinagdagan ng 'Jesus' ang salin sapagkat wala iyon sa mismong talata, kaya napapanatili ang antas ng pagpapahayag ng pinagmulan.
- issue: Kahulugan ng 'mamuhay mula sa magandang balita'
  choice: Kabuhayan o materyal na suporta para sa mga nagpapahayag ng magandang balita.
  alternative: Espirituwal na buhay na nagmumula sa magandang balita.
  rationale: Ang nakapaligid na argumento ay tungkol sa karapatan ng mga manggagawa na tumanggap ng suporta, ngunit pinanatili sa pangunahing teksto ang mas literal na parirala upang hindi sumobra ang pagpapakahulugan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang 'magandang balita' para sa εὐαγγέλιον at pinanatili ang bahagyang di-karaniwang 'mamuhay mula sa' upang katawanin ang Griyegong ἐκ ... ζῆν; nililinaw ng talababa ang kahulugang pangkabuhayan.
