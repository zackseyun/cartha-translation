id: 1CO.9.10
reference: 1 Corinthians 9:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἢ δι’ ἡμᾶς πάντως λέγει; δι’ ἡμᾶς γὰρ ἐγράφη, ὅτι ⸂ὀφείλει ἐπ’ ἐλπίδι⸃ ὁ ἀροτριῶν ἀροτριᾶν, καὶ ὁ ἀλοῶν ⸂ἐπ’ ἐλπίδι τοῦ μετέχειν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/010.yaml
  text: Or is he speaking entirely for our sake? Yes[a], it was written for our sake, because the one who plows ought to plow in hope[b], and the one who threshes ought to thresh in hope of sharing.
translation:
  language: tl
  text: O talagang para sa atin ang sinasabi niya? Oo[a], isinulat iyon para sa atin, sapagkat ang nag-aararo ay dapat mag-araro nang may pag-asa, at ang gumigiik ay dapat gumigiik nang may pag-asang makabahagi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang isinaling “talagang” ay maaari ring mangahulugang “tiyak” o “lubusan”; pinatitindi nito ang retorikal na tanong.
    reason: lexical_alternative
  - marker: b
    text: Hindi tahasang binabanggit sa Griyego kung saan siya umaasang makabahagi; ipinahihiwatig ng larawang pangsakahan na bahagi ito ng bunga o ani.
    reason: implicit_object
lexical_decisions:
- source_word: πάντως
  choice: talagang
  rationale: Sa retorikal na tanong, pinatitindi ng pang-abay ang pahayag. Likas sa modernong Tagalog ang “talagang” at naipahihiwatig nito ang “tiyak/ganap ngang” diwa nang hindi ipinipilit ang iisang posibleng pagbasa.
- source_word: δι’ ἡμᾶς
  choice: para sa atin
  rationale: Malinaw at likas na ipinapahayag nito ang pakinabang o layon ng διά na may accusative sa konteksto.
- source_word: ἐγράφη
  choice: isinulat iyon
  rationale: Tuwirang isinasalin ang aorist passive bilang naganap na pagsulat; ang “iyon” ay tumutukoy sa kasulatang binanggit sa naunang konteksto.
- source_word: ὀφείλει
  choice: dapat
  rationale: Pinananatili nito ang diwa ng nararapat o may katuwirang obligasyon nang hindi labis na pinatitindi bilang lubos na pamimilit.
- source_word: ἐπ’ ἐλπίδι
  choice: nang may pag-asa
  rationale: Natural sa Tagalog at ipinahahayag ang paraan at inaasahang bunga na nag-uudyok sa paggawa.
- source_word: ὁ ἀροτριῶν ἀροτριᾶν
  choice: ang nag-aararo ay dapat mag-araro
  rationale: Pinananatili ang pangkalahatang katauhan at ang pag-uulit ng pandiwa sa Griyego.
- source_word: ὁ ἀλοῶν
  choice: ang gumigiik
  rationale: Karaniwang salitang pang-agrikultura na tumutukoy sa naghihiwalay ng butil mula sa uhay; pinananatili rin ang paralelismo sa nag-aararo.
- source_word: τοῦ μετέχειν
  choice: makabahagi
  rationale: Tumpak na ipinahahayag ang pakikibahagi habang iniiwang di-tiyak ang bagay na pagbabahaginan, gaya ng Griyego.
theological_decisions:
- issue: Di-binanggit na layon ng μετέχειν
  choice: Hindi dinagdagan ng “sa ani”; isinalin lamang na “makabahagi.”
  alternative: “makabahagi sa ani” o “tumanggap ng bahagi sa ani”
  rationale: Walang tahasang layon ang Griyego. Bagaman ipinahihiwatig ng larawang pangsakahan ang ani, pinananatili ng salin ang pagiging implicit nito upang hindi paliitin ang saklaw ng aplikasyon ni Pablo.
- issue: Lakas at gamit ng πάντως
  choice: “talagang” sa loob ng retorikal na tanong, na sinusundan ng “Oo” bilang likas na sagot sa Tagalog
  alternative: “tiyak,” “lubusan,” o “sa lahat ng paraan”
  rationale: Maaaring magpahiwatig ang πάντως ng katiyakan o ganap na saklaw. Ang “talagang” ay nagpapanatili ng diin at natural na retorika; ipinapaliwanag ng talababa ang saklaw ng alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignified, at madaling maunawaan. Ginamit ang “gumigiik” bilang tumpak at pamilyar na terminong pangsakahan. Pinanatili ang paralelismo ng nag-aararo at gumigiik, gayundin ang di-tiyak na layon ng “makabahagi.”
