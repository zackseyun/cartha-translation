id: 1CO.9.13
reference: 1 Corinthians 9:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὐκ οἴδατε ὅτι οἱ τὰ ἱερὰ ἐργαζόμενοι ⸀τὰ ἐκ τοῦ ἱεροῦ ἐσθίουσιν, οἱ τῷ θυσιαστηρίῳ ⸀παρεδρεύοντες τῷ θυσιαστηρίῳ συμμερίζονται;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/013.yaml
  text: Do you not know that those who work in the temple eat from the temple[b][a], and those who serve at the altar share in what is offered on the altar?
translation:
  language: tl
  text: Hindi ba ninyo alam na ang mga naglilingkod sa templo ay kumakain mula sa templo[a], at ang mga naglilingkod sa altar ay tumatanggap ng bahagi mula sa mga handog sa altar[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “ang mga gumagawa kaugnay ng mga banal na bagay ay kumakain ng mga bagay mula sa templo.”'
    reason: lexical_alternative
  - marker: b
    text: 'Mas literal: “nakikibahagi sa altar,” ibig sabihin, tumatanggap sila ng bahagi mula sa mga haing inihahandog doon.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ οἴδατε
  choice: Hindi ba ninyo alam
  rationale: Pinananatili ang anyo ng retorikal na tanong na karaniwan kay Pablo at likas pakinggan sa makabagong Tagalog.
- source_word: οἱ τὰ ἱερὰ ἐργαζόμενοι
  choice: ang mga naglilingkod sa templo
  rationale: Bagaman literal na tumutukoy ang parirala sa paggawa kaugnay ng “mga banal na bagay,” ang konteksto ay serbisyo sa templo. Malinaw at natural itong ipinahahayag ng napiling salin, habang ibinibigay sa talababa ang mas literal na anyo.
- source_word: τὰ ἐκ τοῦ ἱεροῦ ἐσθίουσιν
  choice: ay kumakain mula sa templo
  rationale: Pinananatili ang konkretong larawan ng pagkain at ang templo bilang pinagmumulan ng ikabubuhay, nang hindi labis na ipinapaliwanag ang paraan ng pagtustos.
- source_word: ἱεροῦ
  choice: templo
  rationale: Ang ἱερόν ay karaniwang tumutukoy sa templo o buong saklaw nito, hindi lamang sa pinakaloob na santuwaryo.
- source_word: οἱ τῷ θυσιαστηρίῳ παρεδρεύοντες
  choice: ang mga naglilingkod sa altar
  rationale: Ipinahahayag ng παρεδρεύοντες ang palagiang pagdalo o paglilingkod sa tabi ng altar; natural at angkop sa kontekstong pangkulto ang “naglilingkod sa altar.”
- source_word: τῷ θυσιαστηρίῳ συμμερίζονται
  choice: tumatanggap ng bahagi mula sa mga handog sa altar
  rationale: Ang συμμερίζονται ay nagsasaad ng pakikibahagi o pagtanggap ng bahagi. Nililinaw ng salin ang ipinahihiwatig na bahagi sa mga hain, samantalang iniingatan sa talababa ang mas literal at bahagyang di-tiyak na pahayag na “nakikibahagi sa altar.”
theological_decisions:
- issue: Larawang pangtemplo at materyal na ikabubuhay ng mga naglilingkod
  choice: Inilalarawan ang mga naglilingkod sa templo at altar bilang tumatanggap ng pagkain o bahagi mula sa sagradong paglilingkod.
  alternative: Maaaring isalin nang mas literal ang huling parirala bilang “nakikibahagi sa altar.”
  rationale: Pinananatili nito ang paghahalintulad ni Pablo tungkol sa ikabubuhay na nagmumula sa sagradong paglilingkod, nang hindi nag-aangkat ng mga katawagan o kaayusang pansimbahan mula sa mga sumunod na panahon.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “templo” at “altar” bilang karaniwang katawagang madaling maunawaan. Ang retorikal na tanong at konkretong larawan ng pagkain at paghahati ng handog ay pinanatili.
