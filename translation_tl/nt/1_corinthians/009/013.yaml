  source_fidelity: 'Tapat ang salin sa dalawang magkatulad na halimbawa sa Griyego: ang mga gumagawa ng sagradong paglilingkod ay kumakain mula sa templo, at ang mga naglilingkod sa altar ay tumatanggap ng bahagi kaugnay ng mga handog sa altar. Ang pagpapaliwanag sa huling sugnay ay makatuwiran at hindi nagdaragdag ng doktrinal na kahulugan.'
