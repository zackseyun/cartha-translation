base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/007.yaml
  text: But we speak God's wisdom in a mystery[c][b][a], the hidden wisdom that God predestined before the ages for our glory.
translation:
  language: tl
  text: Ngunit sinasabi namin ang karunungan ng Diyos sa hiwaga[a], ang nakatagong karunungan na itinalaga ng Diyos[b] bago pa ang mga kapanahunan[c] para sa ating kaluwalhatian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bilang isang hiwaga” o “sa lihim.” Sa madalas na gamit ni Pablo, ang “hiwaga” ay tumutukoy sa plano ng Diyos na dating nakatago ngunit ngayo’y inihayag.
    reason: lexical_alternative
  - marker: b
    text: O “paunang itinalaga,” “itinakda nang una pa,” o “paunang ipinasya.”
    reason: lexical_alternative
  - marker: c
    text: O “bago pa ang lahat ng kapanahunan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλοῦμεν
  choice: sinasabi namin
  rationale: Likas at tuwirang salin ng ‘nagsasalita kami’; hindi nito pinalalakas ang diwa tungo sa mas pormal na ‘ipinapahayag.’
- source_word: θεοῦ σοφίαν
  choice: ang karunungan ng Diyos
  rationale: 'Pinananatili ang genitibong ugnayan: ang karunungan ay sa Diyos at nagmumula sa kanya.'
- source_word: ἐν μυστηρίῳ
  choice: sa isang hiwaga
  rationale: Pinananatili ng ‘hiwaga’ ang gamit ni Pablo para sa layunin ng Diyos na dating nakatago ngunit ngayo’y inihahayag; hindi ito basta palaisipan.
- source_word: τὴν ἀποκεκρυμμένην
  choice: ang karunungang itinago
  rationale: Malinaw na iniuugnay ang pambabaeng participle sa ‘karunungan,’ habang pinananatili ang diwa ng pagkakatago nito.
- source_word: προώρισεν
  choice: itinalaga na ... noong una
  rationale: Ipinahahayag ang malakas na diwa ng naunang pasiya o pagtatalaga ng Diyos nang hindi awtomatikong ikinakabit sa isang partikular na sistemang teolohikal.
- source_word: πρὸ τῶν αἰώνων
  choice: bago pa ang mga kapanahunan
  rationale: Malapit sa literal na ‘bago ang mga panahon/kapanahunan’ at pinananatili ang malawak na temporal at kosmikong pananaw ni Pablo.
- source_word: εἰς δόξαν ἡμῶν
  choice: para sa ating kaluwalhatian
  rationale: Tuwirang pinananatili ang layuning ipinahihiwatig ng εἰς at ang teolohikal na bigat ng δόξα.
theological_decisions:
- issue: Ang doctrinal na bigat ng προώρισεν
  choice: itinalaga na ng Diyos noong una
  alternative: itinakda ng Diyos nang una pa / paunang ipinasya ng Diyos
  rationale: Pinananatili ang tunay na diwa ng naunang pagtatalaga ng Diyos ngunit iniiwasang ipakahulugan ang talata ayon sa isang makitid na denominasyonal na sistema.
- issue: Ang kahulugan ng μυστήριον sa gamit ni Pablo
  choice: hiwaga
  alternative: lihim
  rationale: Ang ‘hiwaga’ ay nagpapanatili sa Pauline na diwa ng banal na layuning dating nakatago at kalauna’y inihayag, samantalang maaaring ipahiwatig ng ‘lihim’ na nananatili lamang itong hindi ibinubunyag.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Ginamit ang ‘sinasabi namin’ bilang payak na katumbas ng λαλοῦμεν, ‘hiwaga’ para sa Pauline na μυστήριον, at ‘mga kapanahunan’ upang mapanatili ang plural at kosmikong saklaw ng αἰῶνες.
