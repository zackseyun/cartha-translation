  terminology: Ang “Panginoon” para sa κυρίου at “Mesiyas” para sa Χριστοῦ ay angkop. Pinananatili ng “isip ng Mesiyas” ang malawak na genitive na diwa at hindi nilulutas ang anumang teolohikal na tanong na hindi tahasang nilulutas ng teksto.
