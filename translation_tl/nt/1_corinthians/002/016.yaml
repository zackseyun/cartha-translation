base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/016.yaml
  text: For who has known the mind of the Lord[b][a], that he may instruct him? But we have the mind of Messiah.
translation:
  language: tl
  text: Sapagkat sino ang nakaalam ng isip ng Panginoon[a] na makapagtuturo sa kanya? Ngunit taglay natin ang isip ng Mesiyas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Binabanggit dito ni Pablo ang Isaias 40:13.
    reason: cross_reference
  - marker: b
    text: O, “isip ni Cristo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς γὰρ
  choice: Sapagkat sino
  rationale: Likas na ipinahahayag ang retorikal na tanong at pinananatili ang paliwanag na ugnayan ng γὰρ sa naunang argumento.
- source_word: ἔγνω
  choice: nakaalam
  rationale: Ipinahihiwatig ng aspektong perpekto ang pagkakaroon ng kaalamang magbibigay-karapatang magturo sa Panginoon; natural itong ipinapahayag sa Filipino sa pamamagitan ng “nakaalam.”
- source_word: νοῦν
  choice: pag-iisip
  rationale: Saklaw nito ang isip, pagkaunawa, at paraan ng pagtingin; mas natural dito kaysa sa literal ngunit maaaring malabong “isip.”
- source_word: κυρίου
  choice: Panginoon
  rationale: Karaniwang katumbas ng κύριος at pinananatili ang tunog ng sipi mula sa Isaias 40:13.
- source_word: ὃς συμβιβάσει αὐτόν
  choice: upang maturuan niya siya
  rationale: 'Pinananatili ang anyo at diwa ng kaugnay na sugnay: ang sinumang umano''y nakaaalam sa pag-iisip ng Panginoon ay makapagtuturo sa kanya.'
- source_word: ἡμεῖς δὲ
  choice: Ngunit taglay natin
  rationale: Malinaw na itinatampok ang matinding pagsalungat at ang mariing “tayo” ng Griyego.
- source_word: Χριστοῦ
  choice: Mesiyas
  rationale: Dito ay gumagana ang Χριστός bilang titulo ng Pinahiran; “Mesiyas” ang malinaw at natural na salin nito sa modernong Filipino.
- source_word: ἔχομεν
  choice: taglay natin
  rationale: Ang “taglay” ay natural at marangal na paraan upang ipahayag ang pagkakaroon o pakikibahagi sa pag-iisip ng Mesiyas.
theological_decisions:
- issue: Pagkakakilanlan ng “Panginoon” sa sipi at ng “Mesiyas” sa pangwakas na pahayag
  choice: Panatilihing “Panginoon” sa sipi at “Mesiyas” sa huling sugnay
  alternative: Gawing tahasang iisang tinutukoy ang dalawang katawagan
  rationale: Ang teksto ay lumilipat mula sa κυρίου ng Isaias tungo sa Χριστοῦ nang hindi tahasang ipinaliliwanag ang relasyon ng dalawa; hindi dapat tahimik na lutasin ng salin ang teolohikal na tensiyong ito.
- issue: Kahulugan ng νοῦν Χριστοῦ
  choice: “pag-iisip ng Mesiyas”
  alternative: “isip ni Cristo” o “kaunawaan ng Mesiyas”
  rationale: 'Pinananatili ng anyong genitive ang sadyang lawak: maaaring tumukoy sa pag-iisip na pag-aari ng Mesiyas, sa paraan ng kanyang pag-iisip, o sa pakikibahagi rito ng komunidad.'
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “pag-iisip” upang maging natural at upang manatili ang pag-uulit ng νοῦν sa dalawang sugnay. Ang mga panghalip sa “maturuan niya siya” ay sumusunod sa sadyang maigsi at retorikal na anyo ng Griyego.
