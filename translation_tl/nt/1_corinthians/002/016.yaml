  rationale: 'Inayos ang kaugnay na sugnay upang maging malinaw at likas sa Filipino ang retorikal na tanong: ang nakaaalam ng isip ng Panginoon ang siya sanang makapagtuturo sa kanya. Pinalitan ang “pag-iisip” ng “isip” sa dalawang paglitaw upang mas tumpak at idiomatiko ang katumbas ng νοῦς. Hindi binago ang “Panginoon,” “Mesiyas,” ang pagsalungat na “Ngunit,” o ang mga footnote anchor at nilalaman.'
