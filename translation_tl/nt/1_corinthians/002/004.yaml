id: 1CO.2.4
reference: 1 Corinthians 2:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ὁ λόγος μου καὶ τὸ κήρυγμά μου οὐκ ἐν ⸂πειθοῖ σοφίας⸃ ἀλλ’ ἐν ἀποδείξει πνεύματος καὶ δυνάμεως,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/004.yaml
  text: And my speech and my proclamation were not with persuasive wisdom, but with a demonstration of the Spirit and of power,
translation:
  language: tl
  text: At ang aking pananalita at pangangaral ay hindi sa mapanghikayat na karunungan[a], kundi sa pagpapamalas ng Espiritu[b] at ng kapangyarihan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mapanghikayat na mga salita ng karunungan.”
    reason: lexical_alternative
  - marker: b
    text: O “espiritu.”
    reason: alternative_reading
lexical_decisions:
- source_word: λόγος
  choice: pananalita
  rationale: Sa konteksto, tumutukoy ito sa paraan ng pagsasalita ni Pablo at malinaw na naihihiwalay sa κήρυγμα.
- source_word: κήρυγμα
  choice: pangangaral
  rationale: Likas at malinaw itong salin sa makabagong Filipino para sa hayagang pagpapahayag ng mensahe, habang hindi ito ipinapantay sa λόγος.
- source_word: πειθοῖ σοφίας
  choice: sa mapanghikayat na karunungan
  rationale: Hindi nagdaragdag ang pangunahing teksto ng pangngalang “mga salita,” na wala namang tahasan sa Griyego, at pinananatili nito ang pagtutol sa pagpapamalas na mula sa Diyos.
- source_word: ἀποδείξει
  choice: pagpapamalas
  rationale: Ipinahihiwatig nito ang aktuwal na pagpapakita o paglalantad ng katibayan, bilang kabaligtaran ng panghihikayat lamang sa pamamagitan ng retorika.
- source_word: πνεύματος
  choice: Espiritu
  rationale: Ang konteksto ay tumutukoy sa pagkilos ng Espiritu ng Diyos; gayunman, inilalagay sa talababa ang posibleng saling “espiritu.”
- source_word: δυνάμεως
  choice: kapangyarihan
  rationale: Ito ang malinaw at karaniwang katumbas sa Filipino at likas na kaagapay ng “Espiritu” sa pangungusap.
theological_decisions:
- issue: Kung ang πνεύματος ay tumutukoy sa Banal na Espiritu o sa espiritu sa mas pangkalahatang diwa
  choice: Espiritu
  alternative: espiritu
  rationale: Sinusuportahan ng mas malawak na daloy ng 1 Corinto 2 ang pagtukoy sa Espiritu ng Diyos, ngunit pinananatili sa talababa ang tunay na posibilidad ng di-tiyak na maliit na titik.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang magkatapat na kayariang “hindi sa … kundi sa …” ng Griyego at iniwasang gawing labis na paliwanag ang pangunahing teksto.
source_grounding:
  english_pob_role: consult_only
