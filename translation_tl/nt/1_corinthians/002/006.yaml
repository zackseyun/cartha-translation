revisions:
- from: Gayunman, nagsasalita kami ng karunungan sa mga may-gulang[a]—ngunit hindi ito karunungan ng panahong ito ni ng mga pinuno ng panahong ito[b], na nauuwi sa wala[c].
  to: Gayunman, nagsasalita kami ng karunungan sa mga may-gulang[a], ngunit hindi ng karunungan ng panahong ito ni ng mga pinuno ng panahong ito[b], na pinawawalang-bisa[c].
  rationale: Pinalitan ang pangwakas na parirala upang mas maipakita ang kasalukuyang pasibong puwersa ng καταργουμένων. Ibinalik din ang inuulit na «karunungan» sa ikalawang sugnay upang mas malinaw na maitugma ang inuulit na σοφίαν. Inayos ang mga talababa para sa likas na Filipino at malinaw na paglalahad ng pinananatiling kalabuan.
