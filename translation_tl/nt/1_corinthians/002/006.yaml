id: 1CO.2.6
reference: 1 Corinthians 2:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Σοφίαν δὲ λαλοῦμεν ἐν τοῖς τελείοις, σοφίαν δὲ οὐ τοῦ αἰῶνος τούτου οὐδὲ τῶν ἀρχόντων τοῦ αἰῶνος τούτου τῶν καταργουμένων·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/006.yaml
  text: Yet we do speak wisdom among the mature[a], but not a wisdom of this age or of the rulers of this age[c][b], who are being brought to nothing.
translation:
  language: tl
  text: Gayunman, nagsasalita kami ng karunungan sa mga may-gulang[a], ngunit hindi ng karunungan ng panahong ito ni ng mga pinuno ng panahong ito[b], na pinawawalang-bisa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mga ganap” o “mga nasa hustong gulang”; dito, malamang na tumutukoy ito sa mga may sapat na espirituwal na gulang.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga pinuno ng panahong ito” ay maaaring tumukoy sa mga taong may kapangyarihan, sa mga espirituwal na kapangyarihan, o sa kapwa mga taong may kapangyarihan at espirituwal na kapangyarihan.
    reason: alternative_reading
  - marker: c
    text: Maaari ring “na lumilipas,” “na inaalis,” “na pinawawalang-bisa,” o “na inaalisan ng kapangyarihan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Σοφίαν
  choice: karunungan
  rationale: Tuwirang katumbas ng σοφία at inulit upang mapanatili ang diin ng Griyego.
- source_word: δὲ
  choice: Gayunman
  rationale: Ipinahahayag ang pagsalungat sa naunang konteksto sa natural na modernong Tagalog.
- source_word: λαλοῦμεν
  choice: nagsasalita kami
  rationale: Pinananatili ang karaniwang kahulugan ng λαλέω na ‘magsalita’ sa halip na gawing mas tiyak na ‘ipangaral’ o ‘ipahayag.’
- source_word: ἐν τοῖς τελείοις
  choice: sa mga may-gulang
  rationale: Sa konteksto, malamang na tumutukoy ang τέλειοι sa mga ganap o may sapat na espirituwal na gulang, hindi sa mga walang kasalanan. Ang ‘sa’ ay natural na pagpapahayag ng diwang ‘among.’
- source_word: οὐ τοῦ αἰῶνος τούτου
  choice: hindi ito karunungan ng panahong ito
  rationale: Ang ‘panahon’ ay nagpapanatili sa temporal na diwa ng αἰών at hindi ito ipinagkakamali sa κόσμος, ‘sanlibutan.’ Idinagdag ang ‘ito’ para sa malinaw at natural na ugnayan sa naunang ‘karunungan.’
- source_word: ἀρχόντων
  choice: mga pinuno
  rationale: Malawak at natural na katumbas na hindi nagpapasiya kung mga taong may kapangyarihan, mga espirituwal na kapangyarihan, o kapwa ang tinutukoy.
- source_word: τῶν καταργουμένων
  choice: na nauuwi sa wala
  rationale: Ipinahahayag ang patuloy na puwersa ng kasalukuyang participle at ang diwa ng καταργέω na mawalan ng bisa o kapangyarihan at humantong sa kawalan.
theological_decisions:
- issue: Kung sino ang ‘mga pinuno ng panahong ito’
  choice: Panatilihin ang malawak na katawagang ‘mga pinuno’ nang hindi tinutukoy kung tao o espirituwal na kapangyarihan.
  alternative: Mga pinunong politikal o panrelihiyon lamang; mga espirituwal na kapangyarihan lamang; o kapwa tao at espirituwal na kapangyarihan.
  rationale: Hindi nilulutas ng mismong pariralang Griyego ang pinagtatalunang reperensiya, kaya pinananatili ng salin ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang pag-uulit ng ‘karunungan,’ ang ‘panahong ito’ para sa αἰών, at ang kalabuan tungkol sa pagkakakilanlan ng mga pinuno. Ginamit ang gitling-pahaba upang malinaw na maipakita ang ikalawang, mapagsalungat na paglalarawan ng karunungan.
