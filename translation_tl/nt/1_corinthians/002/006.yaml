  source_fidelity: 'Ang pangunahing diwa ay tapat sa Griyego: pinanatili ang pag-uulit ng «karunungan», ang αἰών bilang «panahon», at ang malawak na «mga pinuno». Gayunman, ang «na nauuwi sa wala» ay higit na nagsasaad ng kahihinatnang wakas kaysa ng kasalukuyang pasibong participle na καταργουμένων (“na pinawawalang-bisa/inaalisan ng bisa”).'
  naturalness: Marangal at likas sa modernong Filipino Tagalog ang rebisyong pangungusap. Ang pag-uulit ng «karunungan» sa ikalawang sugnay ay mas malinaw na tumutugma sa inuulit na σοφίαν nang hindi nagiging di-natural ang daloy.
  terminology: Ang «mga may-gulang», «panahong ito», at «mga pinuno» ay angkop. Pinananatili ng «mga pinuno» ang hindi tiyak na saklaw ng ἀρχόντων. Inayos ang tala upang malinaw na ang ikatlong posibilidad ay kapwa mga taong may kapangyarihan at espirituwal na kapangyarihan, hindi ang malabong «sa kapwa».
