translation:
  language: tl
  text: At ako ay kasama ninyo sa kahinaan[a], sa takot, at sa matinding panginginig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “At dumating ako sa inyo sa kahinaan, sa takot, at sa matinding panginginig.”
    reason: Maaaring unawain ang ἐγενόμην πρὸς ὑμᾶς na nakatuon sa pagdating ni Pablo sa kanila, sa halip na sa kaniyang kalagayan habang kasama nila.
lexical_decisions:
- source_word: κἀγώ
  choice: At ako naman
  rationale: Pinananatili ang pang-ugnay na kaugnayan sa naunang pangungusap at ang malinaw na pagtukoy ni Pablo sa sarili; natural sa Tagalog ang “naman” bilang banayad na pansariling pagtuon.
- source_word: ἐν ἀσθενείᾳ
  choice: sa kahinaan
  rationale: Malawak ang saklaw ng ἀσθένεια bilang kahinaan o karupukan; ang “kahinaan” ang pinakatuwiran at hindi nililimitahan kung pisikal, emosyonal, o panlipunan ang tinutukoy.
- source_word: ἐν φόβῳ
  choice: sa takot
  rationale: Tuwirang inilalarawan ang kalagayan ni Pablo at hindi ito pinapalambot bilang paggalang lamang o pag-iingat.
- source_word: ἐν τρόμῳ πολλῷ
  choice: sa matinding panginginig
  rationale: Ang “panginginig” ay katumbas ng τρόμος, at ipinahahayag ng “matinding” ang pagpapalakas na dala ng πολλῷ sa natural na modernong Tagalog.
- source_word: ἐγενόμην πρὸς ὑμᾶς
  choice: ay kasama ninyo
  rationale: Sa konteksto, natural nitong ipinahahayag ang kalagayan ni Pablo habang kapiling ang mga taga-Corinto, habang pinananatili sa talababa ang posibleng diin sa pagdating.
