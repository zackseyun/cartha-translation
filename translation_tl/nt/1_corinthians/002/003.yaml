translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Pinanatili ang tatlong magkakatabing paglalarawan at ang ambiguwidad kung ang ἐγενόμην πρὸς ὑμᾶς ay tumutukoy sa pananatili niya sa piling nila o sa pagdating niya sa kanila.
