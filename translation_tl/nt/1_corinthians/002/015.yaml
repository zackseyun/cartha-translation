  yaml_path: translation/nt/1_corinthians/002/015.yaml
  text: But the spiritual person evaluates all things[b][a], yet he himself is evaluated by no one.
translation:
  language: tl
  text: Ngunit ang taong espirituwal[b] ay sumusuri sa lahat ng bagay[a], ngunit siya mismo ay hindi sinusuri ng sinuman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sinisiyasat,” “tinatasa,” “kinikilatis,” o “hinuhusgahan” sa dalawang paglitaw ng pandiwang Griyego.
    reason: lexical_alternative
  - marker: b
    text: 'Ang “taong espirituwal” ay salin ng isang pang-uring panlalaking isahan na ginamit bilang pangngalan. Pangkalahatan ang tinutukoy nito: isang taong inilalarawan bilang espirituwal, hindi lamang isang lalaki.'
    reason: cultural_note
lexical_decisions:
- source_word: πνευματικὸς
  choice: taong pinapatnubayan ng Espiritu
  rationale: Ang pang-uri ay ginamit bilang pangngalan at tumutukoy sa isang tao, anuman ang kasarian, na ang buhay at pagkaunawa ay nakaugnay sa Espiritu. Mas malinaw ito sa karaniwang Tagalog kaysa sa posibleng malabong “taong espirituwal.”
- source_word: ἀνακρίνει / ἀνακρίνεται
  choice: sinusuri / sinusuri
  rationale: Ipinahihiwatig ng pandiwa ang maingat na pagsisiyasat at pagtatasa. Pinanatili ang iisang salin sa aktibo at pasibong anyo upang maipakita ang pag-uulit sa Griyego.
- source_word: τὰ πάντα
  choice: ang lahat ng bagay
  rationale: Pinananatili nito ang malawak at hindi nililimitahang pananalita ng teksto.
- source_word: αὐτὸς
  choice: siya mismo
  rationale: Ipinapahayag nito ang diin ng panghalip na αὐτός nang hindi ginagawang tiyak sa kasariang lalaki ang pangkalahatang tinutukoy.
- source_word: ὑπ’ οὐδενὸς
  choice: ng sinuman
  rationale: 'Kasama ng “hindi,” natural nitong ipinapahayag sa Tagalog ang ganap na pagkakaila: “hindi ... ng sinuman.”'
theological_decisions:
- issue: Saklaw ng pahayag tungkol sa taong pinapatnubayan ng Espiritu
  choice: Pinanatili ang walang-tahasang-limitasyong “lahat ng bagay” at “hindi ... ng sinuman.”
  alternative: Tahasan itong limitahan sa “mga bagay na espirituwal” o sa isang tiyak na uri ng pagsusuri.
  rationale: Ganap ang anyo ng pahayag sa talata; ang konteksto ang nagbibigay ng balangkas nito. Ang pagdaragdag ng limitasyon sa pangunahing teksto ay magpapasya sa isang tensiyong hindi tahasang nilulutas ng Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pinapatnubayan ng Espiritu” upang maging natural at maipakita ang personal na kaugnayan sa Espiritu, habang iniwasan ang eksklusibong panlalaking pananalita. Inilagay ang [b] kaagad pagkatapos ng pariralang ipinaliliwanag nito at ang [a] pagkatapos ng unang “sinusuri,” ngunit saklaw ng talababa ang dalawang paglitaw.
