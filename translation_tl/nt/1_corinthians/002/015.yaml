  - severity: low
    issue: Hindi angkop ang “nakikilala” bilang lexical alternative para sa ἀνακρίνω.
    rationale: Sa kontekstong ito, ang pandiwa ay tumutukoy sa pagsisiyasat, pagtatasa, pagkilatis, o paghatol; ang “nakikilala” ay karaniwang tumutukoy sa pagkilala o pag-alam, hindi sa maingat na pagsusuri.
