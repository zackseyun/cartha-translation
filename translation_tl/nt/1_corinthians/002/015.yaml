  source_fidelity: Ang “taong pinapatnubayan ng Espiritu” ay isang pagpapaliwanag na wala sa pang-uring πνευματικός. Bagaman maaaring umayon sa kontekstong Pauline, ang “pinapatnubayan” ay nagdaragdag ng tiyak na relasyong pandiwa at nagpapakitid sa mas payak na “espirituwal.” Ang “sumusuri” / “sinusuri,” “lahat ng bagay,” “siya mismo,” at “hindi ... ng sinuman” ay tapat sa mga pangunahing anyo at diin ng Griyego.
  naturalness: Mas tuwiran at natural sa makabagong Filipino ang “Ang taong espirituwal ay sumusuri sa lahat ng bagay,” kaysa sa mas mahaba at mapagpaliwanag na “taong pinapatnubayan ng Espiritu.” Ang “ngunit” sa ikalawang sugnay ay nagpapanatili ng malinaw na paghahambing.
  terminology: Ginamit ang “taong espirituwal” para sa substantival na πνευματικός, nang hindi nililimitahan ang tinutukoy sa lalaki o nagdaragdag ng “pinapatnubayan.” Pinanatili ang parehong salitang-ugat na “sumusuri/sinusuri” para sa pag-uulit ng ἀνακρίνω. Inayos ang mga alternatibo sa talababa upang maiwasan ang “nakikilala,” na hindi sapat na katumbas ng pandiwang ito sa talata.
