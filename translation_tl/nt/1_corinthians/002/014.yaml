id: 1CO.2.14
reference: 1 Corinthians 2:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ψυχικὸς δὲ ἄνθρωπος οὐ δέχεται τὰ τοῦ πνεύματος τοῦ θεοῦ, μωρία γὰρ αὐτῷ ἐστίν, καὶ οὐ δύναται γνῶναι, ὅτι πνευματικῶς ἀνακρίνεται·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/014.yaml
  text: But the natural person does not accept the things of the Spirit of God[a], for they are foolishness to him, and he is not able to know them[b], because they are spiritually discerned.
translation:
  language: tl
  text: Ngunit hindi tinatanggap ng likas na tao[a] ang mga bagay ng Espiritu ng Diyos, sapagkat kahangalan ang mga iyon para sa kanya; at hindi rin niya kayang maunawaan ang mga iyon, sapagkat ang mga iyon ay sinusuri[b] sa espirituwal na paraan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “taong hindi espirituwal.”
    reason: lexical_alternative
  - marker: b
    text: O “tinataya” o “sinusuri nang mabuti”; ayon sa konteksto, maaari ring “nauunawaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ψυχικὸς
  choice: likas
  rationale: Ipinananatili ng “likas na tao” ang kaibahan nito sa πνευματικός nang hindi tahasang ipinapasok ang interpretasyong “walang Espiritu”; inilalagay sa talababa ang mas malinaw na alternatibo.
- source_word: ἄνθρωπος
  choice: tao
  rationale: Ang “tao” ay likas na pangkalahatang katawagan sa Filipino at hindi nangangahulugang lalaki lamang.
- source_word: δέχεται
  choice: tinatanggap
  rationale: Saklaw nito ang pagtanggap o pagkilala sa mga bagay bilang totoo at may bisa, hindi lamang ang pisikal na pagtanggap.
- source_word: τὰ τοῦ πνεύματος τοῦ θεοῦ
  choice: ang mga bagay ng Espiritu ng Diyos
  rationale: Pinananatili ang malawak at bahagyang di-tiyak na ugnayang ipinahahayag ng genitive sa Griyego.
- source_word: μωρία
  choice: kamangmangan
  rationale: Natural at marangal itong katumbas sa Filipino ng paghatol na ang isang bagay ay kahangalan o walang saysay.
- source_word: γνῶναι
  choice: maunawaan
  rationale: Sa konteksto, tumutukoy ito sa pagkilala at pag-unawa sa tunay na kabuluhan ng mga bagay, hindi lamang sa pagkakaroon ng impormasyong factual.
- source_word: πνευματικῶς
  choice: sa espirituwal na paraan
  rationale: Direktang ipinahahayag ang adverbial na paraan o saklaw nang hindi sapilitang tinutukoy ang Espiritu bilang tahasang tagaganap.
- source_word: ἀνακρίνεται
  choice: sinusuri
  rationale: Pinananatili nito ang diwa ng masusing pagsusuri o pagtataya; ang “nauunawaan” at “nakikilala” ay inilalagay bilang mga alternatibo dahil maaaring iyon ang diin sa konteksto.
theological_decisions:
- issue: Ang kaibahan ng ψυχικὸς ἄνθρωπος at ng espirituwal na pagsusuri
  choice: likas na tao
  alternative: taong hindi espirituwal; taong walang Espiritu
  rationale: Ang “likas na tao” ay nagpapanatili sa teolohikal na tensiyon ng teksto at hindi ginagawang higit na tahasan kaysa sa Griyego ang kalagayan o dahilan ng taong tinutukoy.
- issue: Ang tagaganap o paraan sa πνευματικῶς ἀνακρίνεται
  choice: sinusuri sa espirituwal na paraan
  alternative: sinusuri sa pamamagitan ng Espiritu; nauunawaan sa espirituwal na paraan
  rationale: Hindi tahasang pinapangalanan ng adverb na πνευματικῶς ang Espiritu bilang tagaganap, kaya pinananatili ang posibilidad na tumukoy ito sa paraan o saklaw ng pagsusuri.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang “likas na tao” bilang maikli ngunit bahagyang teknikal na parirala, na nililinaw sa talababa. Hinati sa dalawang pangungusap upang maging natural ang daloy nang hindi binabago ang lohika ng Griyego.
