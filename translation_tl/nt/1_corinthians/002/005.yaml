  text: ἵνα ἡ πίστις ὑμῶν μὴ ᾖ ἐν σοφίᾳ ἀνθρώπων ἀλλ’ ἐν δυνάμει θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/005.yaml
  text: so that your faith might not be in the wisdom of men[a], but in the power of God.
translation:
  language: tl
  text: upang ang inyong pananampalataya ay hindi nakasalig sa karunungan ng tao, kundi sa kapangyarihan ng Diyos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: upang
  rationale: Likas at malinaw na panandang Filipino para sa layuning ipinahahayag ng sugnay.
- source_word: ἡ πίστις ὑμῶν
  choice: ang inyong pananampalataya
  rationale: Tumutukoy sa pananampalataya ng mga taga-Corinto; pinananatili ng “inyong” ang pangmaramihang ikalawang panauhan.
- source_word: μὴ ᾖ ἐν
  choice: ay hindi nakasalig sa
  rationale: Sa kontekstong ito, ang ἐν ay nagpapahiwatig ng batayan o saligan. Mas natural sa modernong Tagalog ang “nakasalig sa” kaysa sa literal ngunit malabong “nasa.”
- source_word: σοφίᾳ ἀνθρώπων
  choice: karunungan ng tao
  rationale: Ang ἀνθρώπων ay tumutukoy sa sangkatauhan sa pangkalahatan, hindi lamang sa mga lalaking nasa hustong gulang. Ang pangkalahatang “tao” ay tumpak at natural sa Tagalog.
- source_word: δυνάμει θεοῦ
  choice: kapangyarihan ng Diyos
  rationale: Pinananatili ang tuwirang kaibahan sa karunungan ng tao at ang Diyos bilang pinagmumulan o batayan ng kapangyarihan.
theological_decisions:
- issue: Batayan o kinaroroonan ng pananampalataya sa pariralang ἐν ... ἀλλ’ ἐν
  choice: Isinaling “nakasalig sa” upang ipakita ang batayan ng pananampalataya.
  alternative: “nasa karunungan ... nasa kapangyarihan”
  rationale: Ang konteksto ay naghahambing sa pinagbabatayan ng pananampalataya, ngunit hindi dinaragdagan ang teksto ng paliwanag tungkol sa paraan ng pagkilos ng kapangyarihan ng Diyos.
- issue: Saklaw ng ἀνθρώπων
  choice: “tao” bilang pangkalahatang katawagan sa sangkatauhan
  alternative: “mga tao” o “karunungang pantao”
  rationale: Hindi nililimitahan ng Griyego ang diwa sa kalalakihan; natural na naipahahayag ng “tao” sa Filipino ang pangkalahatang sangkatauhan nang hindi nag-aangkat ng usaping denominasyonal.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Pinanatili ang maikling paralelismo at matinding kaibahan ng “hindi ... kundi.”
