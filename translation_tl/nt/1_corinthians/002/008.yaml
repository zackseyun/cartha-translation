  text: ἣν οὐδεὶς τῶν ἀρχόντων τοῦ αἰῶνος τούτου ἔγνωκεν, εἰ γὰρ ἔγνωσαν, οὐκ ἂν τὸν κύριον τῆς δόξης ἐσταύρωσαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/008.yaml
  text: which none of the rulers of this age has known[a], for if they had known it, they would not have crucified the Lord of glory.
translation:
  language: tl
  text: na hindi nakilala ng sinuman sa mga pinuno ng panahong ito[a]. Sapagkat kung nakilala nila iyon, hindi sana nila ipinako sa krus ang Panginoon ng kaluwalhatian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga pinuno ng panahong ito” ay maaaring tumukoy sa mga pinunong tao, mga kapangyarihang espirituwal, o sa kapuwa ng mga ito.
    reason: alternative_reading
lexical_decisions:
- source_word: ἣν
  choice: na … iyon
  rationale: Ang panghalip na pambabae at isahan ay tumutukoy sa karunungang binanggit sa naunang talata. Likas sa Tagalog ang pang-ugnay na “na,” habang nililinaw ng “iyon” sa kasunod na sugnay na ang karunungan pa rin ang tinutukoy.
- source_word: ἀρχόντων
  choice: mga pinuno
  rationale: Saklaw ng “mga pinuno” ang mga may kapangyarihang mamahala nang hindi nililimitahan ang tinutukoy sa mga pinunong tao lamang.
- source_word: αἰῶνος τούτου
  choice: panahong ito
  rationale: Ipinapahayag nito ang temporal na diwa ng αἰών at iniiwasang ipakahulugan agad bilang pisikal na “mundo.”
- source_word: ἔγνωκεν / ἔγνωσαν
  choice: nakilala / nakilala
  rationale: Pinananatili ng “nakilala” ang tuwirang diwa ng pagkakilala o pagkabatid, kasama ang posibilidad na hindi lamang kaalaman kundi pagkilala sa tunay na kabuluhan ng karunungan ang tinutukoy. Ang anyong “kung … hindi sana” ay likas na naghahatid ng salungat-sa-katotohanang kondisyon sa Tagalog.
- source_word: κύριον
  choice: Panginoon
  rationale: Karaniwan at marangal na salin ng κύριος bilang titulong may bigat na teolohikal.
- source_word: δόξης
  choice: kaluwalhatian
  rationale: Ito ang kinagawiang salin ng δόξα at pinananatili ang teolohikal at maringal na diwa nito.
- source_word: κύριον τῆς δόξης
  choice: Panginoon ng kaluwalhatian
  rationale: Pinananatili ang anyong henitibo ng Griyego sa halip na gawing “maluwalhating Panginoon,” kaya hindi binabawasan ang lakas at posibleng lawak ng titulo.
- source_word: ἐσταύρωσαν
  choice: ipinako sa krus
  rationale: Tiyak at likas na pariralang Tagalog para sa pagpatay sa pamamagitan ng pagpapako sa krus.
theological_decisions:
- issue: Pagkakakilanlan ng “mga pinuno ng panahong ito”
  choice: Hindi tinukoy kung sila ay mga pinunong tao, mga espirituwal na kapangyarihan, o kapuwa.
  alternative: Maaaring tukuyin nang tahasan bilang mga pinunong pampolitika at panrelihiyon, mga kapangyarihang espirituwal, o kapuwa.
  rationale: Maaaring saklawin ng Griyegong parirala ang alinman sa mga pagbasa na ito. Pinananatili ng pangunahing teksto ang tunay na kalabuan sa halip na lutasin ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Panginoon ng kaluwalhatian” upang mapanatili ang mataas na himig ng orihinal, habang nananatiling madaling maunawaan ang kabuuang pangungusap.
