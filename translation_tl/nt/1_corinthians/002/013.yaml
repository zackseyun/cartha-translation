base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/013.yaml
  text: These things we also speak[a], not in words taught by human wisdom, but in those taught by the Spirit, interpreting spiritual things to spiritual people.
translation:
  language: tl
  text: Ang mga bagay na ito ang sinasabi rin namin, hindi sa mga salitang itinuro ng karunungan ng tao, kundi sa mga salitang itinuro ng Espiritu, na ipinapahayag ang mga bagay na espirituwal sa pamamagitan ng mga salitang espirituwal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “na ipinaliliwanag ang mga bagay na espirituwal sa mga taong espirituwal.” Maaaring unawain ang anyong Griego na πνευματικοῖς bilang tumutukoy sa mga taong espirituwal sa halip na sa mga salitang espirituwal.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἃ καὶ λαλοῦμεν
  choice: Ito rin ang sinasabi namin
  rationale: Ang “ito” ay likas na tumutukoy sa mga katotohanang kababanggit lamang, at pinananatili ng “sinasabi namin” ang pasalitang diin ng λαλοῦμεν.
- source_word: οὐκ ἐν διδακτοῖς ἀνθρωπίνης σοφίας λόγοις
  choice: hindi sa mga salitang itinuro ng karunungan ng tao
  rationale: Pinananatili nito ang instrumental na diwa ng ἐν at malinaw na ipinakikitang karunungan ng tao ang pinagmulan ng pagtuturo.
- source_word: ἀλλ’ ἐν διδακτοῖς πνεύματος
  choice: kundi sa mga salitang itinuro ng Espiritu
  rationale: Inuulit nang tahasan ang ipinahihiwatig na λόγοις upang maging malinaw at natural sa Tagalog. Ginamit ang “Espiritu” bilang pagtukoy sa Espiritu ng Diyos sa konteksto.
- source_word: πνευματικοῖς πνευματικὰ συγκρίνοντες
  choice: na ipinapahayag ang mga bagay na espirituwal sa pamamagitan ng mga salitang espirituwal
  rationale: Ang πνευματικοῖς ay inuunawang neuter na tumutukoy sa ipinahihiwatig na “mga salita,” na umaangkop sa agarang paghahambing ng dalawang uri ng pananalita. Ang “ipinapahayag” ay natural na kumakatawan sa pagsasama o pagpapaliwanag ng espirituwal na nilalaman sa angkop na espirituwal na pananalita, habang inilalagay sa talababa ang tunay na alternatibong pagbasa.
theological_decisions:
- issue: Tinutukoy ng πνεύματος
  choice: ang Espiritu ng Diyos
  alternative: espiritu sa pangkalahatan
  rationale: Sa nakapaligid na talata, paulit-ulit na itinatambis ni Pablo ang Espiritu ng Diyos at ang karunungan ng tao; kaya personal at banal ang pinakamalamang na tinutukoy.
- issue: Kasarian at tinutukoy ng πνευματικοῖς
  choice: 'neuter: mga salitang espirituwal'
  alternative: 'masculine: mga taong espirituwal'
  rationale: Sinusuportahan ng agarang pagbanggit sa λόγοις at ng paghahambing ng mga salitang itinuro ng tao at ng Espiritu ang pagbasa na tumutukoy sa “mga salitang espirituwal.” Gayunman, maaaring basahin ang anyo bilang masculine at tumukoy sa mga taong espirituwal, kaya hindi inalis ang alternatibo.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Iniwasan ang sobrang teknikal na pananalita sa pangunahing teksto, ngunit pinanatili sa talababa ang mahalagang kalabuan ng huling pariralang Griego.
