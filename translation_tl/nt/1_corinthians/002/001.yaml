revisions:
- from: At ako, nang pumunta ako sa inyo, mga kapatid,[a] ay hindi dumating na may kahusayan sa pananalita o karunungan habang ipinahahayag ko sa inyo ang patotoo ng Diyos.[b]
  to: At ako, nang pumunta ako sa inyo, mga kapatid,[a] ay hindi ako dumating taglay ang matayog na pananalita o karunungan sa pagpapahayag sa inyo ng patotoo[b] ng Diyos.
  rationale: Inayos ang pananalita para sa mas likas na modernong Tagalog, ginawang “matayog na pananalita” ang retorikal na ὑπεροχὴ λόγου, at isinalin ang participial na καταγγέλλων sa pamamagitan ng “sa pagpapahayag” upang hindi magdagdag ng tahasang temporal na kahulugang “habang.” Inilipat ang marker b sa “patotoo,” ang salitang saklaw ng tekstuwal na baryante. Nananatiling hindi tinutukoy kung ang patotoo ay mula, tungkol, o pag-aari ng Diyos.
