id: 1CO.2.1
reference: 1 Corinthians 2:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Κἀγὼ ἐλθὼν πρὸς ὑμᾶς, ἀδελφοί, ἦλθον οὐ καθ’ ὑπεροχὴν λόγου ἢ σοφίας καταγγέλλων ὑμῖν τὸ ⸀μαρτύριον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/001.yaml
  text: And I[a], when I came to you, brothers, did not come with lofty speech or wisdom[b], proclaiming to you the testimony of God.
translation:
  language: tl
  text: At ako, nang pumunta ako sa inyo, mga kapatid,[a] ay hindi ako dumating taglay ang matayog na pananalita o karunungan sa pagpapahayag sa inyo ng patotoo[b] ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga kapatid” ay maaaring tumukoy sa lahat ng kapwa mananampalataya, kabilang ang mga babae sa kongregasyon.
    reason: cultural_note
  - marker: b
    text: 'Sa ilang manuskrito: ang hiwaga ng Diyos.'
    reason: textual_variant
lexical_decisions:
- source_word: Κἀγὼ
  choice: At ako
  rationale: Pinananatili ang pang-ugnay na καί at ang bahagyang pagdidiin sa unang panauhan nang hindi ito pinalalabis.
- source_word: ἐλθὼν … ἦλθον
  choice: nang pumunta ako … ay hindi dumating
  rationale: Likas na isinasalin ang participle bilang sugnay na pamanahon, habang pinananatili sa pangunahing pandiwa ang sentrong pahayag ni Pablo.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Ang “mga kapatid” ay likas sa modernong Tagalog at maaaring tumukoy sa magkakapatid sa pananampalataya, lalaki man o babae; nililinaw ito sa talababa.
- source_word: καθ’ ὑπεροχὴν λόγου ἢ σοφίας
  choice: may kahusayan sa pananalita o karunungan
  rationale: Ipinahahayag ang diwa ng kahanga-hanga o nakahihigit na retorika at karunungan nang hindi nagdaragdag ng mas tiyak na interpretasyon.
- source_word: καταγγέλλων
  choice: habang ipinahahayag
  rationale: Pinananatili ang kasabay na ugnayan ng participle sa pangunahing pandiwa at ang hayag, pampublikong diwa ng pagpapahayag.
- source_word: μαρτύριον
  choice: patotoo
  rationale: Tuwirang tumutugma sa nakalimbag na SBLGNT na μαρτύριον at pinananatili ang bigat ng terminong teolohikal.
- source_word: τοῦ θεοῦ
  choice: ng Diyos
  rationale: Hindi nilulutas kung ang patotoo ay mula sa Diyos, tungkol sa Diyos, o pag-aari ng Diyos; pinananatili ang tunay na kalabuan ng genitive.
theological_decisions:
- issue: Tekstuwal na baryante sa μαρτύριον
  choice: ang patotoo ng Diyos
  alternative: ang hiwaga ng Diyos
  rationale: Μαρτύριον (“patotoo”) ang basa ng SBLGNT; inilalagay sa talababa ang kilalang baryanteng μυστήριον (“hiwaga”) dahil may epekto ito sa salin.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “pumunta” sa pantulong na sugnay at “dumating” sa pangunahing sugnay upang maging natural ang pag-uulit ng ἐλθὼν … ἦλθον. Inilagay ang mga pananda ng talababa sa mismong bahaging kanilang nililinaw.
