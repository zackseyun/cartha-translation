reference: 1 Corinthians 2:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀλλὰ καθὼς γέγραπται· Ἃ ὀφθαλμὸς οὐκ εἶδεν καὶ οὖς οὐκ ἤκουσεν καὶ ἐπὶ καρδίαν ἀνθρώπου οὐκ ἀνέβη, ⸀ὅσα ἡτοίμασεν ὁ θεὸς τοῖς ἀγαπῶσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/009.yaml
  text: But just as it is written[a], “What no eye has seen, and no ear has heard[b], and what has not entered into the heart of man—what God has prepared for those who love him.”
translation:
  language: tl
  text: 'Ngunit gaya ng nasusulat: “Ang hindi nakita ng mata, ni narinig ng tainga, at hindi sumagi sa puso ng tao—ang mga bagay na inihanda ng Diyos para sa mga umiibig sa kanya.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ngunit
  rationale: Likas at marangal na panandang pasalungat na nag-uugnay sa naunang diwa.
- source_word: καθὼς γέγραπται
  choice: gaya ng nasusulat
  rationale: Pinananatili ang pormula ng pagsipi sa Kasulatan at ang nananatiling bisa ng pagkakasulat.
- source_word: Ἃ ... ὅσα
  choice: Ang hindi ... ang mga bagay na
  rationale: Ipinakikita ang panimulang paksa at ang muling pagtukoy rito, habang nananatiling natural sa Tagalog.
- source_word: ὀφθαλμὸς ... οὖς
  choice: mata ... tainga
  rationale: Tuwirang pinananatili ang magkatulad na pang-isahang pangkalahatang larawan sa Griyego.
- source_word: ἐπὶ καρδίαν ἀνθρώπου οὐκ ἀνέβη
  choice: hindi sumagi sa puso ng tao
  rationale: Ang “sumagi sa puso” ay likas na idyomang Filipino para sa isang bagay na pumasok sa kamalayan o naisip, habang pinananatili ang “puso” at ang pangkalahatang “tao.”
- source_word: ἡτοίμασεν
  choice: inihanda
  rationale: Ipinahahayag ang natapos na paghahanda ng Diyos; sapat na ipinahihiwatig ng konteksto ang patuloy na kabuluhan nito.
- source_word: τοῖς ἀγαπῶσιν αὐτόν
  choice: para sa mga umiibig sa kanya
  rationale: Inilalarawan ang patuloy na katangian ng mga taong umiibig sa Diyos sa natural at marangal na Tagalog.
theological_decisions:
- issue: Saklaw ng pangkalahatang ἀνθρώπου
  choice: puso ng tao
  alternative: puso ng isang tao; isip ng tao
  rationale: Ang “tao” ay likas na pangkalahatan at kabilang ang buong sangkatauhan; hindi na kailangan ang panlalaking anyo sa Tagalog. Pinananatili ang “puso” upang huwag paliitin ang biblikal na larawan tungo lamang sa intelektuwal na “isip.”
- issue: Kahulugan ng sipi sa konteksto
  choice: Hindi nilinaw sa mismong salin kung ang mga inihanda ay pangkasalukuyang kapahayagan o panghinaharap na pagpapala
  alternative: Dagdagan ng salitang tumutukoy sa langit o sa hinaharap
  rationale: Hindi iyon tahasang sinasabi ng talata; pinananatili ng salin ang lawak at tensiyong nasa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “sumagi sa puso” bilang natural na katumbas ng metapora, at iniwasan ang lumang “hindi pumasok sa puso” na maaaring maging mekanikal. Walang talababa dahil walang kailangang paglilinaw na hindi kayang dalhin ng pangunahing teksto.
