  text: οὐ γὰρ ἔκρινά ⸂τι εἰδέναι⸃ ἐν ὑμῖν εἰ μὴ Ἰησοῦν Χριστὸν καὶ τοῦτον ἐσταυρωμένον·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/002.yaml
  text: For I decided to know nothing among you except Jesus the Messiah—and him crucified[a].
translation:
  language: tl
  text: Sapagkat ipinasiya kong wala nang ibang alamin habang kasama ninyo maliban kay Jesus na Mesiyas—at siya ring ipinako sa krus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “Jesus Cristo.” Sa Griyego: “Jesus Mesiyas.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκρινά
  choice: ipinasiya
  rationale: Sa kontekstong ito, ang κρίνω ay tumutukoy sa isang matatag na pasiya, hindi sa paghatol sa hukuman. Likas at malinaw sa modernong Tagalog ang “ipinasiya.”
- source_word: τι εἰδέναι
  choice: wala akong ibang kilalanin
  rationale: Kasama ng οὐ at εἰ μὴ, naghahayag ito ng mahigpit na pagtatangi. Pinananatili ng “kilalanin” ang diwa ng εἰδέναι nang hindi ito ginagawang simpleng pagkuha ng bagong kaalaman.
- source_word: ἐν ὑμῖν
  choice: habang kasama ninyo
  rationale: Tumutukoy ang parirala sa panahon at kalagayan ng presensiya at paglilingkod ni Pablo sa mga taga-Corinto. Mas natural ito sa Tagalog kaysa sa literal na “sa loob ninyo.”
- source_word: εἰ μὴ
  choice: maliban kay
  rationale: Malinaw nitong ipinahahayag ang exceptive o nagtatanging gamit ng εἰ μὴ.
- source_word: Ἰησοῦν Χριστόν
  choice: Jesus na Mesiyas
  rationale: Ginagawang malinaw ng “na Mesiyas” na titulo ang Χριστός, habang natural na iniuugnay ito sa pangalang Jesus sa Tagalog.
- source_word: καὶ τοῦτον ἐσταυρωμένον
  choice: —at siya na ipinako sa krus
  rationale: Pinananatili ng “at siya” ang diin ng demonstratibong τοῦτον, at ng “ipinako sa krus” ang pasibong anyo at nakapirming pokus sa ipinakong si Jesus.
theological_decisions:
- issue: Paglilipat ng Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Dito ay malinaw na maaaring gumana ang Χριστός bilang titulo ni Jesus. Isinasalin ito bilang “Mesiyas” upang ihayag ang kahulugan ng titulo, habang inilalagay sa talababa ang tradisyonal na “Cristo.”
- issue: Diin ng καὶ τοῦτον ἐσταυρωμένον
  choice: —at siya na ipinako sa krus
  alternative: lalo na ang pagkakapako niya sa krus
  rationale: Hindi ginawang “lalo na” ang καί, sapagkat maaaring magdagdag iyon ng interpretibong antas. Pinananatili ang maikli at mariing pagtukoy kay Jesus mismo bilang ipinako sa krus.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “habang kasama ninyo” para sa likas na paglalahad ng konteksto, at pinanatili ang mariing huling parirala sa pamamagitan ng gatlang.
