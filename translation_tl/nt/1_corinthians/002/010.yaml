id: 1CO.2.10
reference: 1 Corinthians 2:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἡμῖν ⸀γὰρ ⸂ἀπεκάλυψεν ὁ θεὸς⸃ διὰ τοῦ ⸀πνεύματος, τὸ γὰρ πνεῦμα πάντα ἐραυνᾷ, καὶ τὰ βάθη τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/010.yaml
  text: For God has revealed these things to us through the Spirit[a], for the Spirit searches all things[b], even the depths of God.
translation:
  language: tl
  text: Sapagkat inihayag ng Diyos sa atin ang mga bagay na ito sa pamamagitan ng Espiritu[a], dahil sinasaliksik ng Espiritu ang lahat ng bagay, maging ang kalaliman ng Diyos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “inihayag ang mga ito sa atin”; hindi tahasang binanggit sa Griyego ang layon ng pandiwa at nauunawaan ito mula sa naunang konteksto.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “ang malalalim na bagay ng Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμῖν
  choice: sa atin
  rationale: Likas na ipinapahayag sa Tagalog ang datibong tumutukoy sa mga tumanggap ng paghahayag bilang “sa atin.”
- source_word: ἀπεκάλυψεν
  choice: ipinahayag
  rationale: Tuwirang katumbas ng aorist na pandiwa; ipinahihiwatig ng konteksto na ang Diyos ang naglantad ng dating nakatago.
- source_word: '[implicit object of ἀπεκάλυψεν]'
  choice: ang mga bagay na ito
  rationale: Walang tahasang layon sa Griyego, ngunit malinaw itong kinukuha mula sa naunang konteksto; pinananatili ng parirala ang ugnayang iyon.
- source_word: διὰ τοῦ πνεύματος
  choice: sa pamamagitan ng Espiritu
  rationale: Ipinapahayag ang paraan o tagapamagitan na diwa ng διά na may genitive.
- source_word: πνεῦμα
  choice: Espiritu
  rationale: Ang konteksto ng paghahayag at pagkilala sa kalaliman ng Diyos ay tumutukoy sa Espiritu ng Diyos; ang malaking titik ay malinaw at karaniwan sa modernong Tagalog.
- source_word: ἐραυνᾷ
  choice: sinasaliksik
  rationale: Pinananatili ang aktibo at masusing diwa ng paghahanap o pagsusuri.
- source_word: πάντα
  choice: ang lahat ng bagay
  rationale: Pinananatili ang malawak na saklaw ng salitang Griyego sa natural na Tagalog.
- source_word: καὶ
  choice: maging
  rationale: Ginagamit dito sa tumitinding diwa, na ipinapakita na kabilang pati ang sukdulang halimbawa na kasunod.
- source_word: τὰ βάθη τοῦ θεοῦ
  choice: ang kalaliman ng Diyos
  rationale: Pinananatili ang talinghaga ng lalim at ang bahagyang abstraktong pahayag ng orihinal nang hindi ito ipinapaliwanag nang higit sa teksto.
theological_decisions:
- issue: Kung ang πνεῦμα ay tumutukoy sa Banal na Espiritu o sa espiritu ng tao
  choice: Espiritu ng Diyos sa dalawang paglitaw
  alternative: espiritu ng tao sa pangkalahatang diwa
  rationale: Ang Espiritu ang paraan ng paghahayag ng Diyos at sinasabing sumasaliksik maging sa kalaliman ng Diyos, kaya malinaw na higit na naaayon sa konteksto ang Espiritu ng Diyos.
- issue: Kung ang “pagsasaliksik” ay nagpapahiwatig na may hindi alam ang Espiritu
  choice: Panatilihin ang pandiwang “sinasaliksik” nang walang paliwanag sa pangunahing teksto
  alternative: “lubos na nakaaalam” o “sinusuri”
  rationale: Ang ἐραυνᾷ ay talagang nangangahulugang nagsasaliksik o masusing sumusuri; hindi dapat palitan ang larawan upang lutasin ang posibleng teolohikal na tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Sapagkat” at “dahil” upang maging malinaw ang dalawang paliwanag na sugnay nang hindi nagiging mabigat ang daloy. Ang “kalaliman” ay nagpapanatili sa matalinghagang wika ng Griyego.
