  source_fidelity: Ang unang sugnay ay tapat sa diwang pangkalahatan ng τὰ τοῦ ἀνθρώπου bilang mga panloob na bagay ng tao, at maayos na naipapahayag ang τὸ ἐν αὐτῷ. Ang “Espiritu ng Diyos” ay angkop sa konteksto. Gayunman, ang “nakaalam” sa ikalawang sugnay ay mas madaling marinig bilang natapos na nakaraang pangyayari; ang perpektong ἔγνωκεν ay may kasalukuyang resultang diwa at dapat idiin ang patuloy na pagkabatid.
  naturalness: Natural at marangal ang Tagalog. Ang “nakaaalam” ay mas idiomatiko at mas malinaw kaysa “nakaalam” sa pangkalahatang pahayag na ito.
