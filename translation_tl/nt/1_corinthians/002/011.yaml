id: 1CO.2.11
reference: 1 Corinthians 2:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τίς γὰρ οἶδεν ἀνθρώπων τὰ τοῦ ἀνθρώπου εἰ μὴ τὸ πνεῦμα τοῦ ἀνθρώπου τὸ ἐν αὐτῷ; οὕτως καὶ τὰ τοῦ θεοῦ οὐδεὶς ⸀ἔγνωκεν εἰ μὴ τὸ πνεῦμα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/011.yaml
  text: For who among people knows the things of a person except the spirit of the person that is in him? In the same way[b][a], no one has known the things of God except the Spirit of God.
translation:
  language: tl
  text: Sapagkat sino sa mga tao ang nakaaalam ng mga bagay na nasa kalooban ng isang tao, maliban sa espiritu ng taong iyon na nasa kanya?[a] Gayundin, walang sinumang nakaaalam ng mga bagay na ukol sa Diyos maliban sa Espiritu ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga iniisip ng isang tao” sa halip na “mga bagay na nasa kalooban ng isang tao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθρώπων / ἀνθρώπου
  choice: mga tao / isang tao
  rationale: Pangkalahatan ang pagtukoy sa tao at hindi partikular sa lalaki; natural at tapat ito sa modernong Tagalog.
- source_word: τὰ τοῦ ἀνθρώπου
  choice: mga bagay na nasa kalooban ng isang tao
  rationale: Malawak ang saklaw ng parirala at tumutukoy sa panloob na mga bagay ng tao, hindi lamang sa hiwa-hiwalay na kaisipan. Ang “nasa kalooban” ay natural sa Tagalog habang pinananatili ang lawak ng diwa.
- source_word: πνεῦμα τοῦ ἀνθρώπου τὸ ἐν αὐτῷ
  choice: espiritu ng taong iyon na nasa kanya
  rationale: Pinananatili ang tuwirang ugnayang paari at ang pariralang nagsasaad na ang espiritu ay nasa taong tinutukoy, nang hindi dinaragdagan ang kahulugan.
- source_word: οὕτως καὶ
  choice: Gayundin
  rationale: Malinaw at likas na ipinahahayag ang pagkakatulad ng dalawang sugnay.
- source_word: ἔγνωκεν
  choice: nakaalam
  rationale: Sinasalamin ang aspektong perpekto ng pandiwang Griyego, habang nananatiling natural sa Tagalog.
- source_word: τὰ τοῦ θεοῦ
  choice: mga bagay na ukol sa Diyos
  rationale: Pinananatiling malawak ang kahulugan at ang pagkakatulad sa naunang parirala, sa halip na paliitin ito sa “mga kaisipan” lamang.
- source_word: πνεῦμα τοῦ θεοῦ
  choice: Espiritu ng Diyos
  rationale: Sa konteksto, tumutukoy ito sa sariling Espiritu ng Diyos na nakakabatid at naghahayag; ang malaking titik ay karaniwang paraan sa Tagalog upang ipakita ang personal na pagtukoy.
theological_decisions:
- issue: Kung ang πνεῦμα τοῦ θεοῦ ay dapat unawain bilang personal na banal na pagtukoy o bilang di-personal na “espiritu ng Diyos.”
  choice: Espiritu ng Diyos
  alternative: espiritu ng Diyos
  rationale: Ipinakikita ng agarang konteksto na ang tinutukoy ay ang Espiritu na nakaaalam at naghahayag ng mga bagay ng Diyos. Ang malaking titik ay nagpapakita ng referent nang hindi nagdaragdag ng detalyeng doktrinal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “nakaaalam” ayon sa pormal na baybay at pinanatili ang malawak na paralelismo sa pagitan ng mga bagay ng tao at ng Diyos.
