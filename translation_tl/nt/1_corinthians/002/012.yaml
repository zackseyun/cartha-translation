id: 1CO.2.12
reference: 1 Corinthians 2:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ οὐ τὸ πνεῦμα τοῦ κόσμου ἐλάβομεν ἀλλὰ τὸ πνεῦμα τὸ ἐκ τοῦ θεοῦ, ἵνα εἰδῶμεν τὰ ὑπὸ τοῦ θεοῦ χαρισθέντα ἡμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/012.yaml
  text: But we have not received the spirit of the world[a], but the Spirit from God[b], so that we may know the things graciously given to us by God.
translation:
  language: tl
  text: Ngunit hindi ang espiritu ng sanlibutan ang tinanggap natin, kundi ang Espiritung[a] mula sa Diyos, upang malaman natin ang mga bagay na ipinagkaloob[b] sa atin ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Griyego, iisang salita ang ginagamit para sa “espiritu” at “Espiritu.” Maaaring isalin: “espiritung mula sa Diyos.”'
    reason: theological_ambiguity
  - marker: b
    text: O “ibinigay sa atin bilang kaloob.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα τοῦ κόσμου
  choice: espiritu ng sanlibutan
  rationale: Pinananatili ng “espiritu” ang paghahambing sa kasunod na πνεῦμα, samantalang ang “sanlibutan” ay tumutukoy sa kaayusan ng sangkatauhang salungat sa Diyos, hindi lamang sa pisikal na daigdig.
- source_word: ἐλάβομεν
  choice: tinanggap natin
  rationale: Likas sa Filipino ang aspektong naganap sa “tinanggap”; ipinakikita ng konteksto ang patuloy na kabuluhan nito sa kasalukuyan.
- source_word: τὸ πνεῦμα τὸ ἐκ τοῦ θεοῦ
  choice: ang Espiritung mula sa Diyos
  rationale: Malapit ito sa anyo ng Griyego at malinaw na ipinahahayag ang Diyos bilang pinagmulan, nang hindi dinaragdagan ang teksto ng tahasang titulong wala rito.
- source_word: ἵνα εἰδῶμεν
  choice: upang malaman natin
  rationale: Pinananatiling hayag ang layuning ipinahahayag ng ἵνα at ang pangunahing diwa ng οἶδα na “malaman,” bagaman maaari rin itong maunawaang “maunawaan.”
- source_word: τὰ ... χαρισθέντα ἡμῖν
  choice: ang mga bagay na ipinagkaloob sa atin
  rationale: Ang malawak na pangmaramihang neuter ay hindi nililimitahan sa mga partikular na kaloob na espirituwal. Ang “ipinagkaloob” ay likas na nagpapahiwatig ng kusang-loob at mapagbiyayang pagbibigay.
theological_decisions:
- issue: Kung ang πνεῦμα τὸ ἐκ τοῦ θεοῦ ay tiyak na tumutukoy sa Banal na Espiritu
  choice: “Espiritu” na may malaking titik
  alternative: “espiritu” na may maliit na titik
  rationale: Sa agarang paghahambing sa “espiritu ng sanlibutan” at sa konteksto ng 1 Corinto 2, pinakamalamang na ang tinutukoy ay ang Espiritu ng Diyos. Gayunman, hindi tahasang kasama sa parirala ang salitang “Banal,” kaya hindi ito idinagdag at binanggit sa talababa ang pormal na alternatibo.
- issue: Saklaw ng τὰ χαρισθέντα
  choice: “mga bagay na ipinagkaloob”
  alternative: “mga kaloob”
  rationale: Pinananatili ang malawak na saklaw ng Griyego at iniiwasang ipakahulugan na mga espirituwal na kaloob lamang ang tinutukoy.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Ang “sanlibutan” ay pinili dahil malinaw nitong naihihiwalay ang makasalanang kaayusan ng mundo sa pisikal na “daigdig.” Ang “ipinagkaloob” ay karaniwang nauunawaan at nagpapanatili sa diwa ng biyaya na nasa χαρίζομαι.
