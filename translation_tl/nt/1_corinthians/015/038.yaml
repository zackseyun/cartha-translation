base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/038.yaml
  text: But God gives it a body as he willed[a], and to each of the seeds its own body.
translation:
  language: tl
  text: Ngunit binibigyan ito ng Diyos ng katawan ayon sa kanyang kalooban, at binibigyan niya ang bawat binhi ng sarili nitong katawan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang huling bahagi na “at bawat isa sa mga binhi ay binibigyan niya ng sarili nitong katawan.” Literal na sinasabi ng Griyego na “bawat isa sa mga binhi,” na maaaring gamitin sa distributibong diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: δίδωσιν
  choice: binibigyan
  rationale: Ang pangkasalukuyang anyo ay likas na isinasalin bilang “binibigyan.” Tuwirang pinananatili nito ang Diyos bilang gumagawa at ang larawan ng binhi na tumatanggap ng katawan.
- source_word: αὐτῷ
  choice: ito
  rationale: Ang panghalip na isahang datibo ay tumutukoy sa binhing binanggit sa naunang konteksto. Likas sa Tagalog ang ayos na “binibigyan ito … ng katawan.”
- source_word: σῶμα
  choice: katawan
  rationale: Ito ang karaniwang katumbas ng σῶμα at pinananatili ang mahalagang ugnayang leksikal sa talakayan tungkol sa muling pagkabuhay sa buong kabanata.
- source_word: καθὼς ἠθέλησεν
  choice: ayon sa kanyang niloob
  rationale: Ipinahahayag nito ang pasiya o kalooban ng Diyos nang hindi nagdaragdag ng paliwanag. Ang “niloob” ay dignified ngunit nauunawaan pa rin sa modernong Tagalog, at sinasalamin ang aspektong aorist ng ἠθέλησεν.
- source_word: ἑκάστῳ τῶν σπερμάτων
  choice: ang bawat isa sa mga binhi
  rationale: Pinananatili nito ang distributibong puwersa ng ἑκάστῳ at ang partitive na anyo ng “sa mga binhi,” sa halip na idagdag ang interpretibong ideya ng bawat “uri” ng binhi.
- source_word: ἴδιον σῶμα
  choice: sarili nitong katawan
  rationale: Ipinakikita ng ἴδιον na ang katawan ay natatangi at nauukol sa bawat binhi. Natural sa Tagalog ang “sarili nitong katawan” at hindi nito ipinapasok ang salitang “uri,” na wala sa Griyego.
theological_decisions:
- issue: Pagkilos at kalooban ng Diyos sa paghahalintulad ng binhi at katawan
  choice: Malinaw na ang Diyos ang nagbibigay ng katawan ayon sa kanyang niloob at nagbibigay sa bawat binhi ng sarili nitong katawan.
  alternative: Maaaring gawing mas interpretibo ang teksto sa pagsasabing nagbibigay ang Diyos ng katawan sa bawat “uri” ng binhi.
  rationale: Binibigyang-diin ng talata ang pagkilos at kalooban ng Diyos at ang pagkakaiba-iba ng katawang ibinibigay niya. Hindi idinaragdag ang konsepto ng “uri” o “species,” sapagkat hindi iyon tahasang nasa Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang paulit-ulit na “katawan” upang maingatan ang mahalagang terminolohiya ng kabanata. Inilagay ang panandang [a] sa hulihan ng pariralang tinutukoy ng talababa.
