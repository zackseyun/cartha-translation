source:
  edition: SBLGNT
  text: εὑρισκόμεθα δὲ καὶ ψευδομάρτυρες τοῦ θεοῦ, ὅτι ἐμαρτυρήσαμεν κατὰ τοῦ θεοῦ ὅτι ἤγειρεν τὸν Χριστόν, ὃν οὐκ ἤγειρεν εἴπερ ἄρα νεκροὶ οὐκ ἐγείρονται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/015.yaml
  text: Then we are even found to be false witnesses about God[a], because we testified about God that he raised the Messiah[b], whom he did not raise if in fact the dead are not raised.
translation:
  language: tl
  text: Kung gayon, lumalabas pa nga na kami ay mga huwad na saksi tungkol sa Diyos[a], sapagkat nagpatotoo kami laban sa Diyos na binuhay niyang muli ang Mesiyas[b]—na hindi naman niya binuhay na muli, kung totoo ngang hindi binubuhay na muli ang mga patay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaaring isalin: “mga huwad na saksi hinggil sa Diyos.” Ang genitive na pariralang Griyego ay maaaring tumukoy sa patotoong tungkol sa Diyos; gayunman, ang kasunod na “laban sa Diyos” ay nagpapakita ng tindi ng argumento.'
    reason: lexical_alternative
  - marker: b
    text: 'Griyego: “Cristo.” Ginamit dito ang “Mesiyas” sapagkat ang Χριστός ay gumaganap bilang titulo sa kontekstong ito.'
    reason: alternative_reading
lexical_decisions:
- source_word: εὑρισκόμεθα
  choice: lumalabas ... na kami ay
  rationale: Ipinahahayag ang pasibong diwa na sila ay nahahayag o napatutunayang gayon, sa natural na makabagong Tagalog.
- source_word: δὲ καὶ
  choice: Kung gayon ... pa nga
  rationale: Ipinakikita ang lohikal na bunga at ang mariing dagdag sa argumento ni Pablo.
- source_word: ψευδομάρτυρες
  choice: mga sinungaling na saksi
  rationale: Malinaw at natural na tumutukoy sa mga nagbibigay ng huwad na patotoo.
- source_word: τοῦ θεοῦ
  choice: tungkol sa Diyos
  rationale: Binabasa ang genitive bilang layon o paksa ng huwad na patotoo; iniiwasan ang malabong 'mga saksi ng Diyos.'
- source_word: ἐμαρτυρήσαμεν
  choice: nagpatotoo kami
  rationale: Pinananatili ang legal at pampublikong diwa ng pagbibigay-saksi at ang naganap nang apostolikong patotoo.
- source_word: κατὰ τοῦ θεοῦ
  choice: laban sa Diyos
  rationale: 'Pinananatili ang karaniwang adversatibong puwersa ng κατά na may genitive at ang tindi ng kondisyunal na argumento: kung mali ang kanilang pahayag, iniuugnay nila sa Diyos ang hindi niya ginawa.'
- source_word: ἤγειρεν
  choice: binuhay niyang muli
  rationale: Natural na Tagalog para sa pagkilos ng Diyos sa muling pagkabuhay, habang pinananatili ang Diyos bilang gumagawa.
- source_word: τὸν Χριστόν
  choice: ang Mesiyas
  rationale: Dito ay gumaganap ang Χριστός bilang titulong may pantukoy, kaya isinalin ang kahulugan sa halip na gamitin bilang pangalang 'Cristo.'
- source_word: εἴπερ ἄρα
  choice: kung totoo ngang
  rationale: Ipinahahayag ang mariing kondisyong ipinapalagay alang-alang sa argumento.
- source_word: νεκροὶ οὐκ ἐγείρονται
  choice: hindi binubuhay na muli ang mga patay
  rationale: 'Pinananatili ang pangkalahatang pahayag at ang pasibong diwa: may gumagawa ng muling pagbuhay sa mga patay.'
theological_decisions:
- issue: Pagpapakahulugan sa Χριστός
  choice: ang Mesiyas
  alternative: ang Cristo
  rationale: Ang artikulo at argumento tungkol sa muling pagkabuhay ay umaalalay sa titulong kahulugan; hindi nito ginagawang simpleng personal na pangalan ang termino.
- issue: Puwersa ng κατὰ τοῦ θεοῦ
  choice: laban sa Diyos
  alternative: tungkol sa Diyos
  rationale: 'Ang κατά na may genitive ay karaniwang adversatibo. Pinananatili ng salin ang matinding lohika: kung walang muling pagkabuhay, ang mga apostol ay nagpatotoo laban sa katotohanan ng Diyos sa pag-uugnay sa kanya ng isang gawang hindi niya ginawa. Inilalagay sa talababa ang mas mahinang posibleng pagbasa.'
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “binuhay na muli” bilang natural na pahayag para sa resurrection at pinanatili ang pag-uulit upang marinig ang retorikal na puwersa ng Griyego. Lahat ng talababa ay may katumbas na pananda sa pangunahing teksto.
