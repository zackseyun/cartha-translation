  to: Kung gayon, lumalabas pa nga na kami ay mga huwad na saksi tungkol sa Diyos[a], sapagkat nagpatotoo kami laban sa Diyos na binuhay niyang muli ang Mesiyas[b]—na hindi naman niya binuhay na muli, kung totoo ngang hindi binubuhay na muli ang mga patay.
  rationale: Pinalitan ang “mga sinungaling na saksi” ng “mga huwad na saksi” upang tuwirang maipahayag ang ψευδομάρτυρες at maiwasang magdagdag ng pahiwatig ng sinasadyang pandaraya. Pinanatili ang “tungkol sa Diyos” para sa τοῦ θεοῦ at “laban sa Diyos” para sa κατὰ τοῦ θεοῦ, sapagkat magkaiba ang gramatikal at retorikal na puwersa ng dalawang parirala sa Griyego. Inayos din ang talababa upang malinaw nitong tukuyin ang kasunod na pariralang nagpapabigat sa argumento.
