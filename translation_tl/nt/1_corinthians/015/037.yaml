  text: καὶ ὃ σπείρεις, οὐ τὸ σῶμα τὸ γενησόμενον σπείρεις ἀλλὰ γυμνὸν κόκκον εἰ τύχοι σίτου ἤ τινος τῶν λοιπῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/037.yaml
  text: And what you sow[a], you do not sow the body that will be, but a bare kernel[c][b], perhaps of wheat or of some other kind.
translation:
  language: tl
  text: At ang inihahasik mo ay hindi ang katawang mabubuo, kundi isang butil lamang—marahil ay trigo o iba pang uri ng binhi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπείρεις
  choice: inihahasik mo
  rationale: Pinananatili ng “inihahasik” ang tuwirang larawang agrikultural at ang pag-uulit ng pandiwa sa Griyego.
- source_word: σῶμα
  choice: katawan
  rationale: Mahalaga ang karaniwang kahulugang “katawan” sa mas malawak na talakayan ni Pablo tungkol sa muling pagkabuhay; hindi ito pinalalabnaw bilang “anyo” o “halaman.”
- source_word: τὸ γενησόμενον
  choice: katawang mabubuo
  rationale: Ipinahahayag ng “mabubuo” ang isang katawang iiral pa lamang, nang hindi nililimitahan ang γίνομαι sa simpleng paglaki ng halaman.
- source_word: γυμνὸν κόκκον
  choice: isang hubad na butil
  rationale: Ang “hubad” ay nagpapanatili sa kapansin-pansing talinghaga ng γυμνός, at ang “butil” ay angkop sa κόκκος sa halimbawang trigo.
- source_word: εἰ τύχοι
  choice: maaaring
  rationale: Natural na ipinahahayag ng “maaaring” ang di-tiyak at mapaghalimbawang diwa ng idyomang Griyego.
- source_word: σίτου ἤ τινος τῶν λοιπῶν
  choice: butil ng trigo o ng iba pang uri
  rationale: Tiyak na halimbawa ang trigo, samantalang pinananatiling bukas ng “iba pang uri” ang pagtukoy sa alinman sa natitirang mga uri ng butil.
theological_decisions:
- issue: Ugnayan ng inihahasik na butil sa katawang muling bubuhayin
  choice: Pinanatili ang salitang “katawan” at ang panghinaharap na “mabubuo” nang hindi ipinapaliwanag nang higit sa talinghaga.
  alternative: Isalin nang malaya bilang “halamang tutubo.”
  rationale: May pahiwatig ang talinghaga ng pagpapatuloy at pagbabago, ngunit hindi dapat palitan ng salin ang “katawan” ng isang purong botanikal na pagpapakahulugan o ipasok sa talata ang isang mas malawak na doktrina.
translation_notes:
  register: Makabago at marangal na Filipino; malinaw sa karaniwang mambabasa habang pinananatili ang sadyang matapang na larawang “hubad na butil.”
