revisions:
- from: At ang inihahasik mo ay hindi ang katawang mabubuo, kundi isang hubad na butil[a]—maaaring butil ng trigo o ng iba pang uri.
  to: At ang inihahasik mo ay hindi ang katawang mabubuo, kundi isang butil lamang—marahil ay trigo o iba pang uri ng binhi.
  rationale: Pinalitan ang pangunahing “isang hubad na butil” ng mas natural na “isang butil lamang,” na pinananatili ang kontrastang nasa γυμνὸν κόκκον nang walang hindi sinasadyang literal na pahiwatig ng “hubad.” Inilipat sa talababa ang mas literal na anyo. Nilinaw rin ang huling parirala bilang “iba pang uri ng binhi,” na tumutukoy sa ibang uri ng binhing maaaring ihasik.
