  text: Then he appeared to James[a], then to all the apostles.
translation:
  language: tl
  text: Pagkatapos, nagpakita siya kay Santiago[a]; pagkatapos, nagpakita siya sa lahat ng apostol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas literal: “nakita siya ni Santiago … ng lahat ng apostol.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα
  choice: Pagkatapos
  rationale: Nagsasaad ito ng kasunod na pangyayari sa talaan ng mga pagpapakita matapos ang muling pagkabuhay.
- source_word: ὤφθη
  choice: nagpakita siya
  rationale: Bagaman anyong pasibo ang pandiwa, karaniwan itong ginagamit bilang idyoma para sa pagpapakita ng isang persona; natural ito sa Filipino at hindi binabago ang diwa.
- source_word: Ἰακώβῳ
  choice: kay Santiago
  rationale: Ang datibo ang tumutukoy sa taong pinagpakitaan. “Santiago” ang kinagawiang anyo ng pangalan sa Bibliyang Filipino.
- source_word: εἶτα
  choice: at sumunod ay
  rationale: Pinananatili ang ikalawang hakbang sa pagkakasunod-sunod habang nagiging malinaw at natural ang daloy sa Filipino.
- source_word: ἀποστόλοις
  choice: mga apostol
  rationale: Sa kontekstong ito, tumutukoy ito sa kinikilalang mga saksi at isinugo, kaya pinananatili ang teknikal na katawagang “apostol.”
- source_word: πᾶσιν
  choice: lahat
  rationale: Tuwirang pinananatili ang diin sa kabuuan ng grupong tinatawag na mga apostol.
theological_decisions:
- issue: Pagkakakilanlan at saklaw ng “lahat ng apostol” kaugnay ni Santiago
  choice: Isinalin nang tuwiran bilang “lahat ng apostol,” nang hindi nililimitahan ang tinutukoy.
  alternative: Maaaring unawain bilang ang Labindalawa o bilang mas malawak na pangkat ng mga isinugong saksi.
  rationale: Hindi tinutukoy ng Griyegong teksto ang eksaktong mga kabilang sa pangkat. Pinananatili ng salin ang pagiging bukas ng pahayag at ang pagkakaiba ng pagpapakita kay Santiago at ng sumunod na pagpapakita sa lahat ng apostol.
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “Santiago” bilang kinagawiang pangalang biblikal at “apostol” bilang malinaw na teknikal na katawagan.
