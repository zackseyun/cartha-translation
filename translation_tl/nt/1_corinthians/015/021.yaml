revisions:
- from: Sapagkat kung paanong sa pamamagitan ng isang tao ay dumating ang kamatayan, sa pamamagitan din ng isang tao ay dumating ang muling pagkabuhay ng mga patay.[a][b]
  to: Sapagkat, yamang ang kamatayan ay dumating sa pamamagitan ng isang tao, ang muling pagkabuhay ng mga patay ay dumating din sa pamamagitan ng isang tao.[a][b]
  rationale: Pinalitan ang idinagdag na paghahambing na “kung paanong” ng sanhi/paliwanag na “Sapagkat, yamang,” alinsunod sa ἐπειδὴ γὰρ. Inayos din ang tala a upang maging tunay na leksikal na alternatibo at mas maingat na mailarawan ang saklaw ng διά. Walang idinagdag na pangalan o doktrinal na pagpapaliwanag sa pangunahing teksto.
