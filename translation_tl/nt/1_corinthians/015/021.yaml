  yaml_path: translation/nt/1_corinthians/015/021.yaml
  text: For since death came through a man[b][a], the resurrection of the dead also came through a man.
translation:
  language: tl
  text: Sapagkat, yamang ang kamatayan ay dumating sa pamamagitan ng isang tao, ang muling pagkabuhay ng mga patay ay dumating din sa pamamagitan ng isang tao.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa pamamagitan ng tao” sa dalawang sugnay; ang pang-ukol sa Griyego ay maaaring magpahayag ng ahensiya o paraan.
    reason: lexical_alternative
  - marker: b
    text: Ipinakikilala ng konteksto ang dalawang tao bilang si Adan at ang Cristo (tingnan ang 15:22, 45).
    reason: cross_reference
lexical_decisions:
- source_word: ἐπειδὴ γὰρ
  choice: Sapagkat kung paanong
  rationale: Ang γάρ ay nagpapaliwanag sa naunang pahayag, at ang ἐπειδή ay naghahain ng batayang katotohanan. Sa Filipino, ang pariralang ito ay natural na nagpapakita ng dahilan at naghahanda sa magkatugmang dalawang sugnay.
- source_word: δι’ ἀνθρώπου
  choice: sa pamamagitan ng isang tao
  rationale: Ang διά na may genitive ay maaaring tumukoy sa tagapamagitan o ahensiya. Pinananatili ng salin ang isahang ἄνθρωπος at ang sadyang pag-uulit sa dalawang sugnay.
- source_word: θάνατος
  choice: dumating ang kamatayan
  rationale: Walang tahasang pandiwa sa Griyego, kaya idinagdag ang “dumating” upang maging likas sa Filipino at maipahayag ang pagpasok ng kamatayan nang hindi dinaragdagan ang teolohikong nilalaman.
- source_word: καὶ
  choice: din
  rationale: Ipinakikita ng καί ang pagtutugma ng ikalawang sugnay sa una; natural itong naihahayag sa Filipino sa pamamagitan ng “din.”
- source_word: ἀνάστασις νεκρῶν
  choice: muling pagkabuhay ng mga patay
  rationale: Direkta at karaniwang katumbas ito ng parirala, at pinananatili ang konkretong pahayag tungkol sa muling pagkabuhay ng mga taong patay, hindi lamang isang malabong buhay pagkamatay.
theological_decisions:
- issue: Ang kinatawang pagtutulad at pagsalungat nina Adan at Cristo
  choice: Panatilihin ang “isang tao” sa dalawang sugnay at huwag pangalanan ang mga tao sa pangunahing teksto.
  alternative: “sa pamamagitan ni Adan … sa pamamagitan ni Cristo”
  rationale: Hindi tahasang binabanggit sa talatang ito ang kanilang mga pangalan, bagaman ipinakikilala sila ng konteksto. Pinananatili nito ang maikli at simetrikong pahayag ng Griyego nang hindi nagdaragdag sa teksto.
- issue: Kalikasan ng muling pagkabuhay
  choice: “muling pagkabuhay ng mga patay”
  alternative: “buhay pagkatapos ng kamatayan”
  rationale: Ang konteksto ng 1 Corinto 15 ay tungkol sa tunay na muling pagkabuhay ng mga patay; hindi ito dapat gawing pangkalahatan o espirituwalisadong pahayag lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang balanseng pag-uulit ng dalawang sugnay. Ginamit ang “kung paanong” upang maging natural ang verbless at mahigpit na magkatugmang kayarian sa Filipino, ngunit hindi idinagdag ang “gayon din” sapagkat sapat na ang “din” sa ikalawang sugnay.
