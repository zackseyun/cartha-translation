  text: Whether then it was I or they[a], so we proclaim and so you believed.
translation:
  language: tl
  text: Kaya, maging ako man o sila, ito ang ipinangangaral namin, at ito ang pinaniwalaan ninyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas literal: “ganito kami nangangaral, at ganito kayo naniwala.”'
    reason: Pinananatili ang posibilidad na ang οὕτως ay tumutukoy sa paraan, bagaman sa konteksto ay malamang na tinutukoy nito ang nilalaman ng mensahe.
lexical_decisions:
- source_word: εἴτε οὖν ἐγὼ εἴτε ἐκεῖνοι
  choice: Kaya, ako man o sila
  rationale: Ang “kaya” ay naghahayag ng kongklusyon mula sa naunang tala ng mga saksi, samantalang likas na naipapahayag ng “ako man o sila” ang magkaugnay na mga alternatibo ng εἴτε … εἴτε.
- source_word: οὕτως κηρύσσομεν
  choice: ito ang ipinangangaral namin
  rationale: Tumutukoy ang οὕτως sa mensaheng kababanggit lamang. Malinaw at natural sa makabagong Tagalog ang ganitong pagpapahayag ng nilalaman ng pampublikong pangangaral.
- source_word: καὶ οὕτως ἐπιστεύσατε
  choice: at ito rin ang pinaniwalaan ninyo
  rationale: 'Pinananatili ng “ito rin” ang pag-uulit at pagkakaugnay ng dalawang οὕτως: ang mensaheng ipinangaral ng mga apostol ang siya ring pinaniwalaan ng mga taga-Corinto. Ipinapahayag ng pangnagdaang anyo ang naunang pagtugon nila sa mensahe.'
theological_decisions:
- issue: Saklaw ng pagkakaisa ng pangangaral ng mga apostol
  choice: Iisa ang mensaheng ipinangangaral ni Pablo at ng ibang mga apostol sa kontekstong ito, at iyon ang pinaniwalaan ng mga taga-Corinto.
  alternative: 'Maaaring bigyang-diin ng οὕτως ang paraan: “ganito kami nangangaral, at ganito kayo naniwala.”'
  rationale: Iniuugnay ng paulit-ulit na οὕτως ang buod ng ebanghelyo sa 15:1–10 sa pangangaral at paniniwala, nang hindi nagpapasok ng mas malawak na doktrina tungkol sa simbahan na hindi tahasang sinasabi ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “ipinangangaral” para sa pampublikong pagpapahayag at ang “pinaniwalaan” upang maging tuwiran at maiwasang magdagdag ng bagay na hindi tahasang binanggit sa Griyego.
