id: 1CO.15.47
reference: 1 Corinthians 15:47
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ πρῶτος ἄνθρωπος ἐκ γῆς χοϊκός, ὁ δεύτερος ⸀ἄνθρωπος ἐξ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/047.yaml
  text: The first man was from the earth[a], made of dust; the second man is from heaven.
translation:
  language: tl
  text: Ang unang tao ay mula sa lupa, yari sa alabok[a]; ang ikalawang tao ay mula sa langit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “makalupa” o “mula sa alabok.” Ang salitang Griyego na χοϊκός ay umaalingawngaw sa paglalang kay Adan mula sa alabok.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρῶτος
  choice: unang
  rationale: Likas na katumbas ng ordinal na nagtatakda sa unang bahagi ng paghahambing ni Pablo.
- source_word: ἄνθρωπος
  choice: tao
  rationale: Tumutukoy nang isahan at kinatawan kay Adan at, sa ikalawang sugnay, kay Cristo; pinananatili ng “tao” ang malinaw at magkatulad na anyo ng dalawang sugnay.
- source_word: ἐκ γῆς
  choice: mula sa lupa
  rationale: Ipinahahayag ang pinagmulan at pinananatili ang pahiwatig sa paglalang kay Adan mula sa lupa.
- source_word: χοϊκός
  choice: yari sa alabok
  rationale: Ipinahahayag ang kahulugang materyal—gawa o yari sa alabok—at iniiwasan ang “makalupa” bilang pangunahing salin dahil maaari itong unawain bilang ugali o pananaw sa halip na sangkap.
- source_word: δεύτερος
  choice: ikalawang
  rationale: Pinananatili ang tuwirang pagtutulad sa “unang” tao.
- source_word: ἐξ οὐρανοῦ
  choice: mula sa langit
  rationale: Tumpak na naghahayag ng makalangit na pinagmulan; ang “langit” ay angkop sa konteksto kaysa “kalangitan,” na maaaring tumukoy lamang sa himpapawid.
theological_decisions:
- issue: Pagkakakilanlan ng “ikalawang tao”
  choice: Panatilihin ang “ikalawang tao” nang hindi idinaragdag ang pangalang Cristo.
  alternative: “Ang ikalawang tao, si Cristo, ay mula sa langit.”
  rationale: Malinaw sa konteksto na si Cristo ang tinutukoy, ngunit hindi siya tahasang pinangalanan sa talatang Griyego. Pinananatili ng salin ang paghahambing kay Adan nang walang dagdag na pagpapaliwanag sa mismong teksto.
- issue: Panahunan ng mga sugnay na walang tahasang pandiwang kopula
  choice: Gamitin ang likas na Tagalog na “ay mula,” na hindi nagtatakda ng tahasang panahunan.
  alternative: “Ang unang tao ay nagmula sa lupa … ang ikalawang tao ay nagmula sa langit.”
  rationale: Walang tahasang kopula sa alinmang sugnay sa Griyego. Ang walang-panahunang kayarian sa Tagalog ay natural at pinananatili ang ambiguwidad sa halip na ipilit ang nakaraan o kasalukuyang panahunan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang balanseng paralelismo ng “unang tao” at “ikalawang tao,” habang ang “yari sa alabok” ay madaling maunawaan at tapat sa larawang mula sa Genesis.
