base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/043.yaml
  text: It is sown in dishonor; it is raised in glory. It is sown in weakness; it is raised in power.
translation:
  language: tl
  text: Inihahasik ito sa kahihiyan; ibinabangon ito sa kaluwalhatian. Inihahasik ito sa kahinaan; ibinabangon ito sa kapangyarihan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπείρεται
  choice: inihahasik
  rationale: Pinananatili ang balintiyak na anyo at ang talinghaga ng paghahasik na ginagamit ni Pablo tungkol sa katawan sa nakapaligid na konteksto.
- source_word: ἀτιμίᾳ
  choice: walang karangalan
  rationale: Likas ito sa makabagong Filipino at malinaw na kabaligtaran ng “kaluwalhatian,” nang hindi nililimitahan ang diwa sa pansariling pagkapahiya.
- source_word: ἐγείρεται
  choice: ibinabangon
  rationale: Pinananatili ang balintiyak na pananalita ng Griyego at ang karaniwang larawan ng pagbangon sa konteksto ng muling pagkabuhay, habang hindi tahasang pinapangalanan ang gumagawa.
- source_word: δόξῃ
  choice: kaluwalhatian
  rationale: Ito ang kinikilalang salin na nagpapanatili sa bigat ng δόξα at sa tuwirang pagsalungat nito sa kawalan ng karangalan.
- source_word: ἀσθενείᾳ
  choice: kahinaan
  rationale: Tuwiran at malawak ang saklaw nito, kaya naipapahayag ang karupukan ng katawan nang hindi ginagawang pisikal lamang ang diwa.
- source_word: δυνάμει
  choice: kapangyarihan
  rationale: Pinananatili nito ang malawak na diwa ng δύναμις at ang malinaw na pagsalungat sa “kahinaan”; hindi ito nililimitahan sa lakas ng katawan.
theological_decisions:
- issue: Tinig at gumagawa sa muling pagkabuhay
  choice: Gumamit ng mga balintiyak na anyong “inihahasik” at “ibinabangon” nang hindi pinapangalanan ang Diyos bilang gumagawa.
  alternative: 'Tahasan: “ibinabangon ito ng Diyos.”'
  rationale: Balintiyak ang mga pandiwa sa Griyego. Ang pagpapanatili nito ay hindi lumalampas sa sinabi ng talata at iniiwang pahiwatig ang banal na pagkilos.
- issue: Tinutukoy ng di-hayag na simuno
  choice: Gamitin ang “ito,” na tumutukoy sa katawan mula sa agarang konteksto.
  alternative: Ulitin sa bawat sugnay ang “ang katawan.”
  rationale: Walang tahasang simuno sa mismong Griyegong talata, ngunit malinaw sa konteksto na katawan ang tinutukoy. Ang “ito” ay natural at hindi nagdaragdag ng di-kailangang pag-uulit.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikli at balanseng antithetical parallelism ng Griyego. Ang “walang/may” ay natural na nagpapahayag ng kalagayan o paraan na saklaw ng ἐν + datibo.
