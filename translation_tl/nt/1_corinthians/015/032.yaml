  to: Kung, sa pananaw ng tao lamang, nakipaglaban ako sa mababangis na hayop[b] sa Efeso, ano ang pakinabang nito sa akin? Kung hindi binubuhay ang mga patay, “Kumain tayo at uminom, sapagkat bukas ay mamamatay tayo.”[c]
