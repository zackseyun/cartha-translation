source:
  edition: SBLGNT
  text: εἰ κατὰ ἄνθρωπον ἐθηριομάχησα ἐν Ἐφέσῳ, τί μοι τὸ ὄφελος; εἰ νεκροὶ οὐκ ἐγείρονται, Φάγωμεν καὶ πίωμεν, αὔριον γὰρ ἀποθνῄσκομεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/032.yaml
  text: If[a], speaking in merely human terms, I fought with wild beasts in Ephesus, what does it profit me? If the dead are not raised[b], “Let us eat and drink[c], for tomorrow we die.”
translation:
  language: tl
  text: Kung, sa pananaw ng tao lamang, nakipaglaban ako sa mababangis na hayop[b] sa Efeso, ano ang pakinabang nito sa akin? Kung hindi binubuhay ang mga patay, “Kumain tayo at uminom, sapagkat bukas ay mamamatay tayo.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ang “nakipaglaban sa mababangis na hayop” ay maaaring unawain nang literal o bilang larawan ng pakikipaglaban sa malulupit na taong sumalansang kay Pablo. Hindi nilulutas ng pananalitang Griyego mismo ang tanong na ito.
    reason: alternative_reading
  - marker: c
    text: Sipi o alusyon sa Isaias 22:13.
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ ἄνθρωπον
  choice: sa pananalita ng tao lamang
  rationale: Likas itong salin ng idyomang maaaring tumukoy sa paraan ng pagsasalita o sa pananaw na makatao lamang, nang hindi nagdaragdag ng tiyak na pagpapakahulugan.
- source_word: ἐθηριομάχησα
  choice: nakipaglaban ako sa mababangis na hayop
  rationale: Pinananatili ang matingkad at literal na larawan ng pandiwang Griyego, habang hindi pinagpapasiyahan kung literal o patalinghaga ang tinutukoy.
- source_word: ἐν Ἐφέσῳ
  choice: sa Efeso
  rationale: Karaniwang anyong Filipino ng pangalan ng lugar.
- source_word: τί μοι τὸ ὄφελος
  choice: ano ang mapapakinabang ko?
  rationale: Natural na retorikal na tanong sa Filipino na tapat sa diwa ng pakinabang o kapakinabangan.
- source_word: νεκροὶ
  choice: ang mga patay
  rationale: Natural na substantibong anyo sa Filipino at angkop sa konteksto ng muling pagkabuhay.
- source_word: ἐγείρονται
  choice: binubuhay
  rationale: 'Pinananatili ang balintiyak na diwa: ang mga patay ay tumatanggap ng pagkabuhay, nang hindi tahasang idinaragdag sa talata kung sino ang gumagawa nito.'
- source_word: Φάγωμεν καὶ πίωμεν
  choice: Kumain tayo at uminom
  rationale: Tumpak at natural na pagpapahayag ng hortatory subjunctive sa Filipino.
- source_word: αὔριον γὰρ ἀποθνῄσκομεν
  choice: sapagkat bukas ay mamamatay tayo
  rationale: Natural na pahayag na nakatuon sa hinaharap at pinananatili ang alusyon sa Isaias 22:13.
theological_decisions:
- issue: Kung literal na pakikipaglaban sa mga hayop o patalinghagang paglalarawan sa malulupit na kalaban ang ἐθηριομάχησα
  choice: Panatilihin sa pangunahing teksto ang “nakipaglaban ako sa mababangis na hayop.”
  alternative: Isalin bilang pakikipaglaban sa malulupit na mga taong sumalansang kay Pablo sa Efeso.
  rationale: Hindi nilulutas ng salitang Griyego mismo kung literal o patalinghaga ang larawan. Pinananatili ng salin ang tunay na kalabuan at hindi nag-aangkat ng isang tiyak na rekonstruksiyong pangkasaysayan.
- issue: Saklaw ng κατὰ ἄνθρωπον
  choice: Unawain bilang maaaring tumukoy sa paraan ng pagsasalita, “sa pananalita ng tao lamang.”
  alternative: 'Unawain bilang pananaw o batayang makatao lamang: “mula sa pananaw ng tao lamang.”'
  rationale: Kapuwa posible ang paraan ng pagsasalita at pananaw. Ang pangunahing salin ay natural, at inilalahad sa talababa ang lehitimong alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mapapakinabang” bilang natural na retorikal na pananalita at pinanatili ang matinding larawan ng pakikipaglaban sa mababangis na hayop. Ang mga panandang talababa [a] at [b] ay kapuwa nasa pangunahing teksto.
