  text: καὶ καθὼς ἐφορέσαμεν τὴν εἰκόνα τοῦ χοϊκοῦ, ⸀φορέσομεν καὶ τὴν εἰκόνα τοῦ ἐπουρανίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/049.yaml
  text: And just as we have borne the image of the man of dust[a], we will also bear the image of the heavenly man.
translation:
  language: tl
  text: At kung paanong taglay natin ang larawan ng taong mula sa alabok, tataglayin din natin ang larawan ng taong mula sa langit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: May ilang manuskrito na nagsasabing, “taglayin din natin ang larawan ng taong mula sa langit.”
    reason: textual_variant
lexical_decisions:
- source_word: καθὼς
  choice: kung paanong
  rationale: Likas na naghahayag sa Tagalog ng malinaw na paghahambing at pagtutumbas sa dalawang sugnay.
- source_word: ἐφορέσαμεν
  choice: taglay natin
  rationale: Ipinahahayag ng 'taglay' ang patuloy na pagkakaroon o pagdadala ng larawan; mas natural ito kaysa sa literal na 'isinuot' sa kontekstong tumutukoy sa pagkakatulad sa sangkatauhang mula kay Adan.
- source_word: εἰκόνα
  choice: larawan
  rationale: Karaniwang katumbas ng εἰκών at pinananatili ang ugnayang tipolohikal sa pagitan ni Adan at ni Cristo nang hindi dinaragdagan ang kahulugan.
- source_word: τοῦ χοϊκοῦ
  choice: ng taong mula sa alabok
  rationale: Ipinapahiwatig ng χοϊκός ang pagiging mula o yari sa alabok at umaalingawngaw sa Genesis; idinagdag ang 'tao' ayon sa agarang paghahambing sa unang tao at sa taong mula sa langit.
- source_word: φορέσομεν
  choice: taglay rin natin sa hinaharap
  rationale: Pinananatili ang future indicative ng tekstong SBLGNT. Ang 'sa hinaharap' ay malinaw at natural na naghahayag ng aspektong panghinaharap nang hindi gumagamit ng mas mabigat na 'tataglayin natin,' na maaaring magpahiwatig na larawan ang tuwirang layon sa halip na kalagayang dinadala.
- source_word: τοῦ ἐπουρανίου
  choice: ng taong mula sa langit
  rationale: Pinananatili ang paralelismo sa 'taong mula sa alabok' at ang agarang kontekstong Adan–Cristo; ang 'mula sa langit' ay mas natural kaysa 'makalangit na tao' at hindi malabong tumukoy lamang sa katangian.
- source_word: καὶ
  choice: rin
  rationale: Inihahayag ang additive force ng ikalawang καί sa natural na ayos ng Tagalog.
theological_decisions:
- issue: Future indicative laban sa hortatory subjunctive sa ikalawang pandiwa
  choice: taglay rin natin sa hinaharap
  alternative: taglayin din natin
  rationale: Ang nakalimbag na SBLGNT ay may φορέσομεν, future indicative, kaya ang pangunahing teksto ay pangako o pahayag tungkol sa hinaharap na pagkakatulad sa taong mula sa langit. Ang mahalagang variant na hortatory subjunctive ay hindi isinasama sa pangunahing teksto ngunit pinananatili sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang simetrikong 'taong mula sa alabok / taong mula sa langit' upang mapanatili ang paralelismo at alusyon sa agarang konteksto. Ang marker na [a] ay inilagay matapos ang buong pangungusap dahil tumutukoy ito sa variant ng ikalawang sugnay.
