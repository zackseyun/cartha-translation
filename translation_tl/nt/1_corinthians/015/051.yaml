lexical_decisions:
- source_word: ἰδοὺ
  choice: Masdan ninyo
  rationale: Pinananatili ang puwersang pantawag-pansin at marangal na himig ng ἰδοὺ, habang nananatiling malinaw sa makabagong Filipino.
- source_word: μυστήριον
  choice: hiwaga
  rationale: Sa gamit ni Pablo, tumutukoy ito sa katotohanang mula sa Diyos na dating nakatago ngunit ngayo'y inihahayag, hindi lamang sa isang bagay na mahirap unawain.
- source_word: ὑμῖν λέγω
  choice: sinasabi ko sa inyo
  rationale: Likas na Filipino na pinananatili ang tuwirang pakikipag-usap at deklaratibong puwersa ng Griyego.
- source_word: πάντες οὐ κοιμηθησόμεθα
  choice: hindi tayong lahat ay matutulog
  rationale: 'Pinananatili ang metapora ng pagtulog para sa kamatayan at ang saklaw ng negasyon sa Griyego: hindi lahat ay mamamatay.'
- source_word: πάντες δὲ ἀλλαγησόμεθα
  choice: ngunit tayong lahat ay babaguhin
  rationale: Tuwirang ipinahahayag ang panghinaharap na pagbabagong tatanggapin ng lahat; ang “ngunit” ay naglilinaw sa paghahambing sa naunang sugnay.
theological_decisions:
- issue: Kahulugan ng “matutulog” sa konteksto ng muling pagkabuhay
  choice: Pinanatili ang “matutulog” bilang metapora para sa pisikal na kamatayan.
  alternative: “mamamatay” bilang mas interpretibong salin
  rationale: Pinananatili nito ang larawan at teolohikal na pananalita ni Pablo nang hindi nagpapasok ng turo tungkol sa kalagayan ng kaluluwa.
- issue: Makabuluhang tekstuwal na baryante
  choice: 'Sinunod sa pangunahing teksto ang SBLGNT: “hindi tayong lahat ay matutulog, ngunit tayong lahat ay babaguhin.”'
  alternative: 'May baryanteng ang diwa ay: “tayong lahat ay matutulog, ngunit hindi tayong lahat ay babaguhin.”'
  rationale: Ang ibinigay na tekstong Griyego ay malinaw na sumusuporta sa pangunahing salin; inilagay sa talababa ang makabuluhang baryante upang hindi ito maitago.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang biblikal na metapora ng pagtulog at ang solemneng pambungad, ngunit iniwasan ang labis na lipas o teknikal na pananalita.
