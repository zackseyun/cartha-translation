  text: 'Behold[a], I tell you a mystery: we will not all sleep, but we will all be changed[b],'
translation:
  language: tl
  text: 'Narito,[a] sinasabi ko sa inyo ang isang hiwaga: hindi tayong lahat ay matutulog, ngunit tayong lahat ay babaguhin.[b]'
  philosophy: optimal-equivalence
