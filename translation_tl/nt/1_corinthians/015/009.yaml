  text: ἐγὼ γάρ εἰμι ὁ ἐλάχιστος τῶν ἀποστόλων, ὃς οὐκ εἰμὶ ἱκανὸς καλεῖσθαι ἀπόστολος, διότι ἐδίωξα τὴν ἐκκλησίαν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/009.yaml
  text: For I am the least of the apostles[a], who am not worthy to be called an apostle, because I persecuted the church of God.
translation:
  language: tl
  text: Sapagkat ako ang pinakamababa sa mga apostol, na hindi ako karapat-dapat na tawaging apostol,[a] dahil inusig ko ang iglesia ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi ako angkop na tawaging apostol” o “hindi ako kuwalipikadong tawaging apostol.”
    reason: Ipinakikita ang saklaw ng kahulugan ng ἱκανός, na maaari ring tumukoy sa pagiging angkop o kuwalipikado.
lexical_decisions:
- source_word: γάρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na kaugnayan nito sa naunang pahayag habang natural sa makabagong Tagalog.
- source_word: ἐλάχιστος
  choice: pinakahamak
  rationale: Tumutukoy ito sa mababang katayuan o pagtingin ni Pablo sa sarili, hindi sa pisikal na kaliitan.
- source_word: ἀπόστολος / ἀποστόλων
  choice: apostol / mga apostol
  rationale: Pinananatili ang kinikilalang katawagan sa natatanging grupo at tungkulin, hindi lamang ang pangkalahatang diwang 'sugo.'
- source_word: ἱκανός
  choice: karapat-dapat
  rationale: Sa konteksto ng pagpapakumbaba ni Pablo dahil sa dati niyang pag-uusig, malinaw at natural itong katumbas; inilalahad sa talababa ang posibleng diwang pagiging angkop o kuwalipikado.
- source_word: καλεῖσθαι
  choice: tawaging
  rationale: Natural na pasibong anyo sa Tagalog na nagpapanatili sa diwa ng pagtawag o pagkilala sa kaniya bilang apostol.
- source_word: διότι
  choice: dahil
  rationale: Tuwirang ipinakikilala ang dahilan ng sinabi ni Pablo tungkol sa kaniyang sarili.
- source_word: ἐδίωξα
  choice: inusig ko
  rationale: Tumpak na ipinapahayag ang mapanlabang pagkilos ni Pablo noon laban sa mga mananampalataya.
- source_word: ἐκκλησίαν τοῦ θεοῦ
  choice: ang iglesya ng Diyos
  rationale: Karaniwan at dignified na katawagan sa pamayanan ng mga mananampalataya, habang pinananatili ang ugnayang genitibo.
- source_word: ὃς
  choice: at hindi ako
  rationale: Isinasalin ang kaugnay na sugnay sa natural na Tagalog; ang 'at' ay malinaw na nag-uugnay nito sa pagpapakilala ni Pablo bilang pinakahamak sa mga apostol.
theological_decisions:
- issue: Ang katangian ng pahayag ni Pablo tungkol sa pagiging apostol
  choice: Ipinahahayag ni Pablo na kabilang talaga siya sa mga apostol habang nagpapakumbaba at nagsasabing hindi siya karapat-dapat sa tawag na iyon.
  alternative: Itinatanggi ni Pablo ang kaniyang pagiging apostol, o tumutukoy lamang siya sa mababang katayuang panlipunan.
  rationale: Ipinapalagay ng 'ako ang pinakahamak sa mga apostol' na kabilang siya sa kanila, samantalang ang sumunod na sugnay ay nagpapahayag ng pagiging hindi karapat-dapat dahil sa dati niyang pag-uusig. Pinananatili ng salin ang tensiyong ito.
translation_notes:
  register: Makabagong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang 'pinakahamak' upang ipahayag ang mababang pagtingin ni Pablo sa sarili at ang 'iglesya' bilang pamilyar na terminong eklesyal.
