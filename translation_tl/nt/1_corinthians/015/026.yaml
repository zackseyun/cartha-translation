  text: ἔσχατος ἐχθρὸς καταργεῖται ὁ θάνατος,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/026.yaml
  text: The last enemy to be abolished is death[a].
translation:
  language: tl
  text: Ang huling kaaway na wawakasan ay ang kamatayan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na, “Ang huling kaaway na lilipulin ay ang kamatayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσχατος
  choice: huling
  rationale: Tumutukoy ito sa pinakahuli sa isang pagkakasunod-sunod at pinananatili ang eskatolohikal na daloy ng argumento ni Pablo.
- source_word: ἐχθρὸς
  choice: kaaway
  rationale: Likas at malinaw itong tawag sa isang kalaban o puwersang sumasalungat, at angkop sa pagsasatao sa kamatayan.
- source_word: καταργεῖται
  choice: wawakasan
  rationale: Ipinahahayag nito na ang kamatayan ay aalisan ng bisa at dadalhin sa katapusan. Natural ang anyong panghinaharap sa Filipino sa eskatolohikal na konteksto, bagaman pangkasalukuyang balintiyak ang anyong Griyego.
- source_word: ὁ θάνατος
  choice: ang kamatayan
  rationale: Pinananatili ng tiyak na pantukoy ang kamatayan bilang natatangi at isinataong huling kaaway.
theological_decisions:
- issue: Paglalarawan sa pagkatalo ng kamatayan sa καταργεῖται
  choice: wawakasan
  alternative: pinawawalang-bisa / lilipulin
  rationale: Ang “wawakasan” ay sumasaklaw sa pagdadala sa katapusan at pag-aalis ng bisa nang hindi nagpapasok ng mas tiyak na metapisikal na pahayag kaysa sa ipinahihintulot ng pandiwa. Inilalagay sa talababa ang mas matinding tradisyonal na alternatibo.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “wawakasan” upang likas na maipahayag ang eskatolohikal na pagkakasunod-sunod habang pinananatili ang saklaw ng καταργέω.
