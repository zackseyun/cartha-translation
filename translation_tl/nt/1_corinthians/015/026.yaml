  source_fidelity: Tapat ang salin sa Griyegong ἔσχατος ἐχθρὸς καταργεῖται ὁ θάνατος. Ang “Ang huling kaaway na wawakasan ay ang kamatayan” ay likas na Filipino na naghahayag ng eskatolohikal na pagkakasunod-sunod at ng pasibong pagwawakas/pagpapawalang-bisa na saklaw ng καταργεῖται, nang hindi ipinipilit ang ganap na pagkalipol bilang tanging kahulugan.
