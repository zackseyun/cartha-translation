  text: τὸ δὲ κέντρον τοῦ θανάτου ἡ ἁμαρτία, ἡ δὲ δύναμις τῆς ἁμαρτίας ὁ νόμος·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/056.yaml
  text: The sting of death is sin[b][a], and the power of sin is the law.
translation:
  language: tl
  text: Ang tibo ng kamatayan ay kasalanan, at ang kapangyarihan[a] ng kasalanan ay ang kautusan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “lakas”: “ang lakas ng kasalanan.”'
    reason: lexical_alternative
  - marker: b
    text: Malamang na ang “kautusan” ay pangunahing tumutukoy sa Kautusang ibinigay sa pamamagitan ni Moises sa pangangatwiran ni Pablo, bagaman maaari ring saklawin ng pananalita ang mas malawak na papel ng kautusan sa pagbubunyag at pagpapatindi ng kasalanan.
    reason: alternative_reading
lexical_decisions:
- source_word: κέντρον
  choice: tibo
  rationale: Tumutukoy ito sa matulis at nakapipinsalang panusok o pangsakit ng kamatayan. Pinananatili ng “tibo” ang talinghaga at ang kaugnayan nito sa naunang paghamon kay kamatayan.
- source_word: θανάτου
  choice: ng kamatayan
  rationale: 'Tuwirang ipinahahayag ang ugnayang genitibo: ang tibong taglay o ginagamit ng kamatayan.'
- source_word: ἁμαρτία
  choice: kasalanan
  rationale: Pinananatili ang anyong isahan, sapagkat inilalarawan ni Pablo ang kasalanan bilang isang kapangyarihan o prinsipyong kumikilos, hindi lamang bilang hiwa-hiwalay na mga pagkakasala.
- source_word: δύναμις
  choice: kapangyarihan
  rationale: Natural na ipinahahayag nito ang lakas o kakayahang nagbibigay-bisa sa kasalanan; ang “lakas” ay maaari ring salin.
- source_word: νόμος
  choice: ang kautusan
  rationale: Pinananatili ang malamang na pagtukoy sa Kautusang ibinigay sa pamamagitan ni Moises, ngunit hindi nililimitahan nang tahasan ang salita upang manatili ang mas malawak na diwa ng papel ng kautusan sa pagbubunyag at pagpapatindi ng kasalanan.
- source_word: δὲ … δὲ
  choice: at
  rationale: Ang mga pang-ugnay ay nagpapasulong at nagpapaliwanag ng pahayag, hindi nagpapakita ng matinding pagsalungat. Sapat na likas sa Filipino ang “at” sa pagitan ng dalawang sugnay.
theological_decisions:
- issue: Kahulugan ng νόμος sa pahayag na ito ang kapangyarihan ng kasalanan
  choice: Isinaling “ang kautusan” nang hindi nagdaragdag ng tahasang paliwanag sa pangunahing teksto.
  alternative: “ang Kautusan” bilang tiyak na pantukoy sa Kautusang Mosaiko, o “batas” bilang mas pangkalahatang prinsipyo
  rationale: Malakas ang kaugnayan nito sa Kautusang Mosaiko sa pangangatwiran ni Pablo, ngunit maaari ring saklawin ng pananalita ang mas malawak na papel ng kautusan sa paglalantad at pagpapatindi ng kasalanan. Pinananatili ng salin at talababa ang tensiyong ito.
translation_notes:
  register: Makabago, maikli, at marangal na Filipino. Ginamit ang “tibo” upang mapanatili ang kongkretong talinghaga ng matulis na panusok, at ang “kautusan” upang umayon sa bokabularyong biblikal nang hindi nagpapasok ng makitid na denominasyonal na pagbasa.
