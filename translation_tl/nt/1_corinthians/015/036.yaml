  yaml_path: translation/nt/1_corinthians/015/036.yaml
  text: Foolish one[b][a], what you sow is not made alive unless it dies.
translation:
  language: tl
  text: Hangal ka![a] Ang inihahasik mo ay hindi binibigyan ng buhay[b] maliban kung mamatay ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Taong walang unawa!”
    reason: lexical_alternative
  - marker: b
    text: O, “hindi nabubuhay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφρων
  choice: Hangal
  rationale: Tuwirang pagsaway ang bokatibo. Ang “Hangal” ay matalas ngunit natural sa makabagong Filipino at hindi pinahihina ang tono ni Pablo.
- source_word: σύ
  choice: ka
  rationale: Pinananatili ang tahasang panghalip at diin ng Griyego sa natural na ekspresyong “Hangal ka!”
- source_word: ὃ σπείρεις
  choice: ang inihahasik mo
  rationale: Pinananatili nito ang talinghaga at bokabularyo ng paghahasik, at natural itong tumutukoy sa anumang binhing inihahasik ng kausap.
- source_word: ζῳοποιεῖται
  choice: binubuhay
  rationale: Pinananatili ang balintiyak na anyo at ang diwa ng pagbibigay-buhay, na mahalaga sa konteksto ng muling pagkabuhay.
- source_word: ἐὰν μὴ
  choice: malibang
  rationale: Natural at tuwirang katumbas ito ng kondisyong “unless,” nang hindi nagdaragdag ng paliwanag.
- source_word: ἀποθάνῃ
  choice: mamatay ito
  rationale: Ang payak na anyong ito ay angkop sa kondisyong pangungusap at malinaw na ang inihahasik ang tinutukoy; hindi idinagdag ang “muna,” sapagkat wala iyon nang tahasan sa Griyego.
theological_decisions:
- issue: Ugnayan ng pagkamatay ng binhi at buhay sa muling pagkabuhay
  choice: Panatilihin ang talinghagang pang-agrikultura nang walang idinagdag na doktrinal na pagpapaliwanag.
  alternative: Gawing tahasang pormulang doktrinal tungkol sa muling pagkabuhay ng katawan.
  rationale: Ginagamit ni Pablo ang binhi bilang paghahambing sa konteksto ng muling pagkabuhay. Dapat panatilihin ng salin ang mismong larawan at ang tensiyon nito sa halip na ipaliwanag nang higit sa sinabi ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang matalas na pagsaway, ang diin sa “ka,” ang talinghaga ng paghahasik, at ang balintiyak na diwa ng pandiwang tumutukoy sa pagbibigay-buhay.
