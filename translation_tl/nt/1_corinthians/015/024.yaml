  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἶτα τὸ τέλος, ὅταν ⸀παραδιδῷ τὴν βασιλείαν τῷ θεῷ καὶ πατρί, ὅταν καταργήσῃ πᾶσαν ἀρχὴν καὶ πᾶσαν ἐξουσίαν καὶ δύναμιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/024.yaml
  text: Then comes the end[a], when he hands over the kingdom to God the Father[c][b], when he abolishes every rule and every authority and power.
translation:
  language: tl
  text: Pagkatapos, darating ang wakas[a], kapag ibinigay niya ang kaharian sa Diyos na Ama[b], kapag pinawalang-bisa niya ang bawat pamumuno, bawat awtoridad, at bawat kapangyarihan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kaganapan” o “katuparan.” Ang Griyegong τέλος ay maaaring mangahulugang wakas, layunin, o kaganapan.
    reason: lexical_alternative
  - marker: b
    text: 'Mas literal: “sa Diyos at Ama.”'
    reason: lexical_alternative
  - marker: c
    text: O “inalis na niya ang bisa ng.” Maaari ring unawain ang “pamumuno” bilang “tagapamahala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα
  choice: Pagkatapos
  rationale: Likas na nagmamarka sa susunod na yugto ng pagkakasunod-sunod na inilalahad ni Pablo.
- source_word: τὸ τέλος
  choice: ang wakas
  rationale: Pinananatili ang tuwirang temporal na diwa, habang kinikilala sa talababa na maaari rin itong tumukoy sa kaganapan o katuparan.
- source_word: ὅταν παραδιδῷ
  choice: kapag ibinigay na niya
  rationale: Ipinahahayag ang hinaharap na paglilipat ng kaharian sa natural na makabagong Tagalog; ang aspektong ganap ay angkop sa puntong tinutukoy ng sugnay.
- source_word: τὴν βασιλείαν
  choice: ang kaharian
  rationale: Karaniwang salin na akma sa larawan ng paglilipat ng maharlikang paghahari, nang hindi ikinakaila ang dinamikong diwa ng pamamahala.
- source_word: τῷ θεῷ καὶ πατρί
  choice: sa Diyos na Ama
  rationale: 'Natural na appositional na pagbasa sa Tagalog: ang Diyos, samakatuwid ay ang Ama.'
- source_word: ὅταν καταργήσῃ
  choice: matapos niyang pawalang-bisa
  rationale: Ipinakikita ang pag-aalis ng bisa o kapangyarihang kumilos, nang hindi ipinapalagay ang ganap na pagkalipol; ang 'matapos' ay malinaw na nag-uugnay sa naunang paghahatid ng kaharian bilang kasunod ng pagsupil sa mga kapangyarihan.
- source_word: πᾶσαν ἀρχὴν
  choice: ang bawat pamumuno
  rationale: Pinananatili ang posibleng abstraktong diwa ng ἀρχή bilang paghahari o kapangyarihang namumuno, sa halip na tahasang gawin itong personal na 'tagapamahala.'
- source_word: πᾶσαν ἐξουσίαν
  choice: bawat awtoridad
  rationale: Malinaw at kasalukuyang katumbas para sa karapatan o kapangyarihang mamahala.
- source_word: δύναμιν
  choice: kapangyarihan
  rationale: Malawak at likas na katumbas sa Tagalog para sa lakas o kapangyarihang gumagawa.
theological_decisions:
- issue: Ugnayan ng θεῷ at πατρί
  choice: 'Appositional: “Diyos na Ama”'
  alternative: 'Koordinado: “Diyos at Ama”'
  rationale: Pinakamalinaw at natural sa Tagalog ang pagtukoy sa Ama bilang Diyos na pinagbibigyan ng Anak ng kaharian, habang hindi gumagawa ng dagdag na pahayag tungkol sa pagka-Diyos ng Anak.
- issue: Lakas ng καταργήσῃ hinggil sa mga kapangyarihan
  choice: Pawalang-bisa o wakasan ang bisa ng mga ito
  alternative: Ganap na lipulin ang mga ito
  rationale: Ang pandiwa ay maaaring tumukoy sa pag-aalis ng bisa, gawain, o kapangyarihan. Hindi dapat ipasok sa salin ang mas tiyak na ideya ng ontolohikal na pagkalipol.
- issue: Referente ng ἀρχή
  choice: Abstrakto o kolektibong “pamumuno”
  alternative: Personal na “tagapamahala”
  rationale: Sa hanay na ἀρχή, ἐξουσία, at δύναμις, maaaring tumukoy ang salita sa saklaw o uri ng naghaharing kapangyarihan. Pinananatili ng “pamumuno” ang ambiguity sa halip na gawing tiyak na mga persona.
- issue: Temporal na relasyon ng dalawang ὅταν-sugnay
  choice: Ang paghahatid ng kaharian ay kasunod ng pagpapawalang-bisa sa lahat ng kapangyarihan
  alternative: Dalawang sabay o magkapantay na pangyayari na kapwa isinaling “kapag”
  rationale: Ang aorist subjunctive καταργήσῃ ay likas na maaaring magpahiwatig ng naunang natapos na pagkilos kaugnay ng present subjunctive παραδιδῷ. Gayunman, hindi nito nilulutas ang lahat ng detalye ng pagkakasunod-sunod.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “awtoridad” dahil karaniwan at madaling maunawaan, at iniwasan ang mas denominasyonal o arkaikong “pamunuan” at “mga principado.”
