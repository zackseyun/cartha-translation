- from: Pagkatapos ay darating ang wakas[a], kapag ibinigay na niya ang kaharian sa Diyos na Ama[b], matapos niyang pawalang-bisa ang bawat pamumuno, bawat awtoridad, at kapangyarihan.[c]
  to: Pagkatapos, darating ang wakas[a], kapag ibinigay niya ang kaharian sa Diyos na Ama[b], kapag pinawalang-bisa niya ang bawat pamumuno, bawat awtoridad, at bawat kapangyarihan.[c]
