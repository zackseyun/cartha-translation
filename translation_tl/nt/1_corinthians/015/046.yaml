id: 1CO.15.46
reference: 1 Corinthians 15:46
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀλλ’ οὐ πρῶτον τὸ πνευματικὸν ἀλλὰ τὸ ψυχικόν, ἔπειτα τὸ πνευματικόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/046.yaml
  text: But the spiritual is not first[a], but the natural[b]; afterward the spiritual.
translation:
  language: tl
  text: Ngunit hindi ang espirituwal ang nauuna[a], kundi ang likas[b]; pagkatapos, ang espirituwal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Hindi ang espirituwal na katawan ang nauuna ...” Hindi binanggit ni Pablo rito ang salitang “katawan,” bagaman tahasan itong ginamit sa nakapaligid na konteksto.'
    reason: alternative_reading
  - marker: b
    text: Ang “likas” ay salin ng Griyegong psychikon, na tumutukoy sa nauukol sa karaniwang buhay ng nilalang; maaari ring isalin nang mas literal na “pangkaluluwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πρῶτον
  choice: ang nauuna
  rationale: Ginagamit ito bilang pananda ng pagkakasunod-sunod. Ang “ang nauuna” ay likas sa modernong Tagalog at malinaw na ipinapakita kung alin ang dumarating muna.
- source_word: πνευματικόν
  choice: ang espirituwal
  rationale: Ang pang-uri ay may pantukoy, nasa neutral na isahan, at ginagamit bilang pangngalan. Pinananatili ng “ang espirituwal” ang maigsi at malawak na pahayag ng Griyego nang hindi tahasang idinaragdag ang salitang “katawan.”
- source_word: ψυχικόν
  choice: ang likas
  rationale: Tumutukoy ito sa nauukol sa karaniwang buhay ng nilalang, na ikinokontra sa buhay na nauukol sa Espiritu. Ang “likas” ay madaling maunawaan at hindi nagpapahiwatig ng moral na paghatol gaya ng maaaring idulot ng “di-espirituwal.”
- source_word: ἔπειτα
  choice: pagkatapos
  rationale: Malinaw nitong ipinapakita ang sumunod na yugto sa pagkakasunod-sunod.
- source_word: ἀλλ’ οὐ ... ἀλλὰ
  choice: Ngunit hindi ... kundi
  rationale: Ang pares na “hindi ... kundi” ay natural na Tagalog na nagpapanatili sa tuwirang pagtutuwid at paghahambing ng Griyego.
theological_decisions:
- issue: Kahulugan ng paghahambing ng ψυχικόν at πνευματικόν
  choice: 'Pagkakasunod ng dalawang kalagayan o kaayusan ng buhay ng tao: nauuna ang likas, at pagkatapos ay ang espirituwal.'
  alternative: Partikular na paghahambing ng likas na katawan at espirituwal na katawan; o paghahambing ng di-espirituwal at espirituwal na mga tao.
  rationale: Tahasan sa talata 44 ang “katawan,” ngunit hindi ito inuulit sa talata 46. Kaya pinananatili rito ang mga pang-uring ginamit bilang pangngalan upang huwag paliitin ang pahayag, habang ipinapaliwanag sa talababa ang malinaw na kaugnayan nito sa konteksto ng katawan at muling pagkabuhay.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at maigsi. Ginamit ang “hindi ... kundi” para sa natural na kontrast sa Tagalog, at hindi idinagdag sa pangunahing teksto ang “katawan” upang mapanatili ang pagkasiksik at tunay na lawak ng Griyego.
