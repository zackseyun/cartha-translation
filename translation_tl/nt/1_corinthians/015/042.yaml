base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/042.yaml
  text: 'So also is the resurrection of the dead: it is sown in corruption[a]; it is raised in incorruption.'
translation:
  language: tl
  text: 'Gayon din ang muling pagkabuhay ng mga patay: inihahasik na may pagkabulok[a]; ibinabangon na walang pagkabulok.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, inihahasik sa kalagayan ng pagkasira; ibinabangon sa kalagayan ng kawalang-pagkasira.
    reason: Ipinapakita ang mas malawak na salin ng magkatunggaling mga pangngalang φθορά at ἀφθαρσία; hindi lamang pisikal na pagkabulok ang maaaring saklaw ng mga ito.
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: Gayon din
  rationale: Maikli at likas na panandang naghahambing at bumubuo ng kongklusyon mula sa larawan ng binhi sa naunang konteksto.
- source_word: ἡ ἀνάστασις τῶν νεκρῶν
  choice: ang muling pagkabuhay ng mga patay
  rationale: Tuwirang pinananatili ang genitibong ugnayan at ang diin ni Pablo sa muling pagkabuhay ng mga taong patay.
- source_word: σπείρεται
  choice: inihahasik ito
  rationale: Pinananatili ang pangkasalukuyang anyong balintiyak at ang metapora ng paghahasik, sa halip na ipakahulugang tahasan bilang paglilibing.
- source_word: ἐν φθορᾷ
  choice: nasisira
  rationale: Likas sa modernong Filipino at ipinapahayag ang kalagayang lumilipas, nabubulok, at napapahamak nang hindi nililimitahan ang salita sa pisikal na pagkabulok lamang.
- source_word: ἐγείρεται
  choice: ibinabangon ito
  rationale: Pinananatili ang anyong balintiyak, na nagpapakitang ang binabanggit ay tumatanggap ng pagkilos sa muling pagkabuhay.
- source_word: ἐν ἀφθαρσίᾳ
  choice: hindi na masisira
  rationale: Lumilikha ng malinaw at likas na kasalungat ng “nasisira” at ipinahihiwatig ng “na” ang permanenteng pagbabago sa kalagayan.
theological_decisions:
- issue: Ang kalikasan at pagpapatuloy ng binubuhay na muli
  choice: Pinanatili ang metapora ng paghahasik at ang magkatugmang pandiwang balintiyak nang hindi tahasang idinaragdag ang “katawan.”
  alternative: Isalin nang paliwanag bilang “ang katawan ay inililibing ... binubuhay na muli na di-nasisira.”
  rationale: Sa konteksto, katawan ang tinatalakay, ngunit walang tahasang pangngalan sa sugnay na Griyego. Ang “ito” ay nagpapanatili sa ugnayan sa konteksto at sa tunay na pagkabuhay na muli nang hindi nagdaragdag ng paliwanag sa mismong talata.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “inihahasik” upang mapanatili ang larawang agrikultural at ang “nasisira / hindi na masisira” upang maipahayag nang natural ang simetrikong pagsalungat.
