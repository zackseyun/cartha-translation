    issue: Ang “hindi na masisira” ay may dagdag na “na.”
    rationale: Ipinahihiwatig nito na dati nang hindi nasisira o na tumigil ang isang dating proseso. Ang ἀφθαρσίᾳ ay nagsasaad lamang ng kalagayang walang pagkasira/di-nabubulok.
  - severity: low
    issue: Hindi ganap na parallel ang “nasisira / hindi na masisira” sa mga pangngalang kalagayan ng Griyego.
    rationale: Ang “na may pagkabulok / na walang pagkabulok” ay mas malinaw na naghahatid ng ἐν φθορᾷ at ἐν ἀφθαρσίᾳ at nagpapanatili ng antithesis.
