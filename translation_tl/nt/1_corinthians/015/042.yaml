  source_fidelity: Ang pangunahing diwa, metapora ng paghahasik, at mga pandiwang balintiyak ay napanatili. Gayunman, ang “hindi na masisira” ay nagdaragdag ng aspektong “hindi na” na wala sa Griyego, at ang “nasisira” ay hindi gaanong tuwirang naipapakita ang magkatapat na kalagayan ng φθορά at ἀφθαρσία.
  naturalness: Mas malinaw at likas sa modernong Filipino ang “na may pagkabulok ... na walang pagkabulok” kaysa “itong nasisira ... itong hindi na masisira,” habang nananatiling maigsi at parallel ang dalawang sugnay.
  terminology: Ang “muling pagkabuhay ng mga patay” at “ibinabangon” ay angkop. Ginamit ang “pagkabulok” bilang pangunahing salin upang maipahayag ang φθορά/ἀφθαρσία bilang magkatapat na kalagayan; ang mas malawak na “pagkasira/kawalang-pagkasira” ay inilagay sa talababa.
  issues:
