  text: οἷος ὁ χοϊκός, τοιοῦτοι καὶ οἱ χοϊκοί, καὶ οἷος ὁ ἐπουράνιος, τοιοῦτοι καὶ οἱ ἐπουράνιοι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/048.yaml
  text: As is the man of dust[a], so also are those of dust; and as is the heavenly man, so also are those who are heavenly.
translation:
  language: tl
  text: Kung ano ang taong mula sa alabok,[a] gayon din ang mga taong mula sa alabok; at kung ano ang taong makalangit, gayon din ang mga taong makalangit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Kung ano ang mula sa alabok, gayon din ang mga mula sa alabok; at kung ano ang makalangit, gayon din ang mga makalangit.”'
    reason: Ipinakikita ang substantibong anyo ng mga pang-uri sa Griyego, kung saan hindi tahasang nakasulat ang salitang “tao.”
lexical_decisions:
- source_word: οἷος ... τοιοῦτοι
  choice: Kung ano ... gayon din ...
  rationale: Likas sa Filipino ang pares na ito upang ipahayag ang pagtutugma ng kinatawang tao at ng mga kabilang sa kaniya, habang napapanatili ang mahigpit na paralelismo ng Griyego.
- source_word: χοϊκός
  choice: mula sa alabok
  rationale: Ipinahihiwatig ng salita ang pagiging yari o nagmula sa alabok/lupa. Pinananatili ng “mula sa alabok” ang alusyon sa pagkalalang kay Adan at iniiwasan ang di-likas o mapanlinlang na “maalikabok.”
- source_word: ὁ χοϊκός
  choice: ang taong mula sa alabok
  rationale: Bagaman substantibong pang-uri ang anyong Griyego, malinaw sa konteksto ng talata 45–49 na tumutukoy ito kay Adan bilang kinatawang tao. Ginagawang likas sa Filipino ng “tao” ang parirala nang hindi pinapangalanan si Adan sa mismong talata.
- source_word: οἱ χοϊκοί
  choice: ang mga taong mula sa alabok
  rationale: Tumutukoy ang maramihan sa mga taong may katangiang katulad ng taong mula sa alabok. Ang pag-uulit ng “mula sa alabok” ay nagpapanatili sa sadyang leksikal na ugnayan ng dalawang sugnay.
- source_word: ἐπουράνιος
  choice: makalangit
  rationale: Ang “makalangit” ay likas na pang-uri para sa nauukol sa langit at pinananatili ang kaibahan sa “mula sa alabok” nang hindi inaangkat ang eksaktong pananalita ng naunang talata na “mula sa langit.”
- source_word: ὁ ἐπουράνιος
  choice: ang taong makalangit
  rationale: Ipinagpapatuloy nito ang personal at kinatawang paghahambing kay Adan at kay Cristo sa konteksto. Ang idinagdag na “tao” ay nagpapalinaw sa substantibong pang-uri ngunit hindi tahasang ipinapasok ang pangalang Cristo.
- source_word: οἱ ἐπουράνιοι
  choice: ang mga taong makalangit
  rationale: Nililinaw ng “mga tao” na ang tinutukoy ay mga taong tumutugma sa taong makalangit, hindi mga anghel o iba pang nilalang sa langit; nananatili naman ang pang-uring “makalangit.”
theological_decisions:
- issue: Kung tahasang gagamitin ang “tao” sa dalawang isahang parirala
  choice: “ang taong mula sa alabok” at “ang taong makalangit”
  alternative: “ang mula sa alabok” at “ang makalangit”
  rationale: Sa agarang konteksto, magkatapat sina Adan at Cristo bilang mga kinatawang tao. Ang “tao” ay natural na paglilinaw sa Filipino at hindi nagdaragdag ng doktrinang wala sa konteksto.
- issue: Kung ang οἱ ἐπουράνιοι ay mga nilalang sa langit o mga taong tumutugma sa taong makalangit
  choice: “ang mga taong makalangit”
  alternative: “ang mga makalangit”
  rationale: Ang paksa ng konteksto ay ang muling pagkabuhay ng tao at ang pagdadala ng larawan ng taong makalangit. Iniiwasan ng “mga taong” ang maling pagkaunawang mga anghel ang tinutukoy.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang balanseng paralelismo at ang pag-uulit ng mga pangunahing salita. Ang “mula sa alabok” ay mas malinaw at natural kaysa “maalikabok,” samantalang ang “makalangit” ay nagpapanatili sa pang-uring anyo ng Griyego.
