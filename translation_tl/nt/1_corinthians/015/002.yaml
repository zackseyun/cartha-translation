  text: through which you also are being saved, if you hold firmly to the message I proclaimed as good news to you—unless you believed in vain.
translation:
  language: tl
  text: Sa pamamagitan nito ay inililigtas din kayo[a], kung matatag ninyong pinanghahawakan ang mensaheng ipinahayag ko sa inyo bilang mabuting balita[b]—maliban kung sumampalataya kayo nang walang kabuluhan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “naliligtas din kayo.” Ang kasalukuyang panahunan sa Greek ay maaaring magpahiwatig ng patuloy na pagkakaligtas o magpahayag ng kaligtasan sa mas pangkalahatang paraan.
    reason: lexical_alternative
  - marker: b
    text: 'Mas literal, ang parirala ay maaaring isalin na: “kung pinanghahawakan ninyo kung sa anong mensahe o pananalita ko ipinahayag sa inyo ang mabuting balita.” Hindi ganap na tiyak kung ang pariralang Greek ay tumutukoy sa mensahe mismo o sa paraan ng pagpapahayag nito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ οὗ
  choice: Sa pamamagitan nito
  rationale: Ang διά na may genitive ay nagpapahayag ng paraan o kasangkapan at tumutukoy pabalik sa mabuting balita sa talata 1.
- source_word: καὶ σῴζεσθε
  choice: ay inililigtas din kayo
  rationale: Pinananatili ng progresibong anyo ang posibleng patuloy na diwa ng Greek present passive, samantalang ipinahihiwatig ng “din” ang καί.
- source_word: τίνι λόγῳ
  choice: ang mensahe
  rationale: Sa konteksto, ang λόγος ay ang nilalaman ng ipinahayag na mabuting balita. Mas natural sa modernong Filipino ang “mensahe” kaysa literal na “salita,” habang nililinaw sa talababa ang mas malapit na anyo ng parirala.
- source_word: εὐηγγελισάμην
  choice: ipinahayag ko sa inyo bilang mabuting balita
  rationale: Hayagang pinananatili nito ang diwa ng pandiwa bilang pagpapahayag ng mabuting balita, hindi lamang pangkalahatang pangangaral.
- source_word: κατέχετε
  choice: matatag ninyong pinanghahawakan
  rationale: Ipinapahayag nito ang patuloy at matibay na pagkapit o pagpapanatili sa mensahe.
- source_word: ἐκτὸς εἰ μὴ
  choice: maliban na lamang kung
  rationale: Natural itong katumbas ng idyomang Greek na nagpapakilala ng isang eksepsiyon.
- source_word: εἰκῇ
  choice: nang walang kabuluhan
  rationale: Pinananatili nito ang diwa ng pagiging walang saysay, walang bunga, o walang pakinabang.
- source_word: ἐπιστεύσατε
  choice: sumampalataya kayo
  rationale: Tumutukoy ito sa ginawa nilang pagsampalataya nang tanggapin nila ang mabuting balita.
theological_decisions:
- issue: Aspekto ng kaligtasan sa σῴζεσθε
  choice: inililigtas din kayo
  alternative: naligtas din kayo / ligtas din kayo
  rationale: Ipinakikita ng salin ang posibleng patuloy na aspekto ng present passive nang hindi binubuo rito ang isang buong doktrina tungkol sa proseso ng kaligtasan. Nililinaw ng talababa ang lehitimong mas pangkalahatang pagbasa.
- issue: Kondisyon sa εἰ κατέχετε
  choice: kung matatag ninyong pinanghahawakan
  alternative: yamang pinanghahawakan ninyo / bilang katibayan na tunay ang inyong pananampalataya
  rationale: Pinananatili ang tunay na anyong kondisyonal ng pahayag at hindi ito ipinapaliwanag bilang retorikal lamang o bilang tiyak na katibayan ng isang partikular na doktrina tungkol sa pagtitiyaga.
- issue: Babala sa εἰκῇ ἐπιστεύσατε
  choice: maliban na lamang kung sumampalataya kayo nang walang kabuluhan
  alternative: maliban kung hindi tunay ang inyong pananampalataya
  rationale: Hindi ipinapantay ng salin ang “walang kabuluhan” sa “hindi tunay,” sapagkat lalampas iyon sa mismong sabi ng Greek at magpapasya sa teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “mensahe” para sa natural na daloy, “pinanghahawakan” para sa matatag at patuloy na pagkapit, at “walang kabuluhan” upang mapanatili ang babala nang hindi ito nilalagyan ng denominasyonal na paliwanag.
