  yaml_path: translation/nt/1_corinthians/015/017.yaml
  text: But if Messiah has not been raised[a], your faith is futile[b]; you are still in your sins.
translation:
  language: tl
  text: Ngunit kung ang Mesiyas[a] ay hindi muling binuhay[b], walang saysay[c] ang inyong pananampalataya; nasa inyong mga kasalanan pa rin kayo.
  philosophy: optimal-equivalence
