lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahahayag nito ang pagsalungat sa naunang pangangatwiran ni Pablo.
- source_word: Χριστὸς
  choice: ang Mesiyas
  rationale: Ginagamit dito ang Χριστός bilang titulong tumutukoy sa pinahiran ng Diyos. Likas sa modernong Filipino ang anyong “Mesiyas,” habang inilalahad sa talababa ang tradisyonal na “Cristo.”
- source_word: οὐκ ἐγήγερται
  choice: ay hindi muling binuhay
  rationale: Pinananatili ng balintiyak na anyo ang di-tahasang ahensiya ng Griyego at ang kasalukuyang bunga ng pangyayaring ipinahihiwatig ng perpektong pandiwa, nang hindi tahasang idinaragdag na Diyos ang gumawa.
- source_word: ματαία
  choice: walang saysay
  rationale: Malinaw at pangkasalukuyang Filipino ito para sa isang pananampalatayang walang bisa o hindi makapagdudulot ng inaasahang bunga sa ipinapalagay na kalagayan.
- source_word: ἡ πίστις ὑμῶν
  choice: ang inyong pananampalataya
  rationale: Ang πίστις dito ay tumutukoy sa kanilang paniniwala at pagtitiwala, kaya ang karaniwang “pananampalataya” ang pinakaangkop.
- source_word: ἔτι
  choice: pa rin
  rationale: Ipinahahayag nito ang nagpapatuloy na kalagayan kung hindi muling binuhay ang Mesiyas.
- source_word: ἐν ταῖς ἁμαρτίαις ὑμῶν
  choice: nasa inyong mga kasalanan
  rationale: Pinananatili nito ang larawang “nasa” o “loob ng” kanilang mga kasalanan nang hindi nililimitahan kung ang diin ay pagkakasala, kapangyarihan, o kalagayang dulot ng kasalanan.
theological_decisions:
- issue: Pananalita at ahensiya sa muling pagkabuhay
  choice: hindi muling binuhay
  alternative: hindi muling nabuhay
  rationale: Ang balintiyak na salin ay sumusunod sa anyong ἐγήγερται at hindi pinapangalanan ang gumawang hindi tahasang binanggit sa Griyego. Inilalagay sa talababa ang likas ding saling Filipino na maaaring mabasang di-balintiyak.
- issue: Pagsasalin ng Χριστός
  choice: ang Mesiyas
  alternative: ang Cristo
  rationale: Sa kontekstong ito, gumaganap ang Χριστός bilang titulong teolohikal ng pinahiran; pinananatili bilang alternatibo ang nakaugaliang anyong “Cristo.”
- issue: Kalagayan sa mga kasalanan
  choice: nasa inyong mga kasalanan pa rin kayo
  alternative: nananatili pa rin kayo sa inyong mga kasalanan
  rationale: Pinananatili ng napiling anyo ang metaporikong ἐν at ang tunay na lawak ng pahayag, nang hindi ipinapaliwanag kung ito ay pangunahing pagkakasala, kapangyarihan ng kasalanan, o kapwa.
translation_notes:
  register: Modernong Filipino na marangal at tuwiran. Ginamit ang “inyong” at “kayo” upang mapanatili ang pangmaramihang ikalawang panauhan. Iniwasan ang labis na teknikal o makalumang pananalita.
