  text: Where[a], O death, is your victory? Where, O death, is your sting?
translation:
  language: tl
  text: “Nasaan, O kamatayan, ang tagumpay mo?”[a] “Nasaan, O kamatayan, ang tibo mo?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa ilang manuskrito, ang unang sugnay ay mababasa: “Nasaan, O kamatayan, ang tibo mo?” Makikita ang pagbasa ring ito sa KJV at sa iba pang tradisyonal na salin.'
    reason: textual_variant
lexical_decisions:
- source_word: ποῦ
  choice: Nasaan
  rationale: Likas at tuwirang tanong sa Tagalog na nagpapanatili sa mapanuyang lakas ng retorikal na tanong nang walang idinagdag na diin.
- source_word: σου
  choice: mo
  rationale: Ang panghalip na genitive ay nagsasaad ng pag-aari; “mo” ang natural na katumbas sa dalawang sugnay.
- source_word: θάνατε
  choice: O kamatayan
  rationale: Tuwirang kinakausap at binibigyang-persona ang kamatayan. Pinananatili ng “O kamatayan” ang maringal at patulang anyo ng vocative.
- source_word: νῖκος
  choice: tagumpay
  rationale: Ang νῖκος ay tumutukoy sa tagumpay o pananaig. Ang “tagumpay” ay malinaw at umaayon sa konteksto ng muling pagkabuhay at sa naunang pahayag sa talata 54.
- source_word: κέντρον
  choice: kamandag
  rationale: Maaaring tumukoy ang κέντρον sa pantusok, panusok, o tibo. Sa personipikasyon ng kamatayan at sa paliwanag sa kasunod na talata, likas sa modernong Tagalog ang “kamandag” bilang nakamamatay na bisa ng isang tibo, bagaman hindi nito tuwirang inuulit ang konkretong larawang “tibo.”
theological_decisions:
- issue: Pagbasa ng kritikal na teksto sa unang sugnay
  choice: Isinalin ang νῖκος bilang “tagumpay” sa pangunahing teksto.
  alternative: Isalin ang unang sugnay gamit ang “kamandag” o “tibo” batay sa variant na κέντρον na makikita sa ilang manuskrito at sa tradisyong Textus Receptus/KJV.
  rationale: νῖκος ang nasa ibinigay na SBLGNT, kaya ang pangunahing teksto ay “tagumpay ... kamandag.” Umaayon din ito sa agarang konteksto, kung saan nilamon ang kamatayan sa tagumpay (tal. 54), habang iniingatan sa talababa ang kilalang alternatibong pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran ngunit maringal at patula. Ginamit ang “O kamatayan” upang mapanatili ang personipikasyon at apostrope. Inilagay ang talababa pagkatapos ng buong talata, at lumilitaw ang marker na [a] sa pangunahing teksto.
