id: 1CO.15.19
reference: 1 Corinthians 15:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰ ἐν τῇ ζωῇ ταύτῃ ⸂ἐν Χριστῷ ἠλπικότες ἐσμὲν⸃ μόνον, ἐλεεινότεροι πάντων ἀνθρώπων ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/019.yaml
  text: If we have hoped in Messiah for this life only[c][b][a], we are more pitiable than all people.
translation:
  language: tl
  text: Kung para lamang sa buhay na ito ang pag-asa natin sa Mesiyas,[a][c] higit tayong kaawa-awa kaysa sa lahat ng tao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Cristo.” Ang Griyegong titulong Χριστός ay maaaring isaling “Cristo” o “Mesiyas”; ginamit dito ang “Mesiyas” upang maipakita ang kahulugan nito bilang titulo.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “tayo ang pinakakaawa-awa sa lahat ng tao.” Maaaring ipahayag sa Filipino bilang pasukdol ang paghahambing sa Griyego.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “Kung sa buhay na ito lamang tayo umaasa sa Mesiyas.”
    reason: alternative_rendering
lexical_decisions:
- source_word: εἰ
  choice: Kung
  rationale: Karaniwang panandang kondisyon sa Filipino at tuwirang tumutugma sa gamit ng εἰ.
- source_word: ἐν τῇ ζωῇ ταύτῃ
  choice: para lamang sa buhay na ito
  rationale: Likas na pahayag sa Filipino para sa pag-asang limitado sa kasalukuyang buhay; kasama ng μόνον, malinaw nitong iniiwasan ang maling diwang ‘umaasa lamang’ bilang tanging ginagawa.
- source_word: ἐν Χριστῷ
  choice: sa Mesiyas
  rationale: Pinananatili ang Χριστός bilang titulo sa pamamagitan ng ‘Mesiyas.’ Ang ‘pag-asa ... sa Mesiyas’ ay likas na Filipino para sa pag-asang nakasalig sa kaniya.
- source_word: ἠλπικότες ἐσμὲν
  choice: ang pag-asa natin
  rationale: Ang nominal na parirala ay natural sa Filipino at naghahayag ng patuloy at matatag na pag-asang taglay hanggang sa kasalukuyan, na siyang puwersa ng periphrastic perfect.
- source_word: μόνον
  choice: lamang
  rationale: Inilagay katabi ng ‘buhay na ito’ upang malinaw na ang saklaw ng pag-asa, hindi ang kilos ng pag-asa, ang nililimitahan.
- source_word: ἐλεεινότεροι
  choice: higit tayong kaawa-awa
  rationale: Pinananatili ang anyong pahambing at ang diwang karapat-dapat kahabagan, sa halip na ‘miserable’ o naghihirap lamang.
- source_word: πάντων ἀνθρώπων
  choice: kaysa sa lahat ng tao
  rationale: Ang ἄνθρωποι ay tumutukoy sa sangkatauhan sa pangkalahatan, hindi lamang sa mga lalaki; pinananatili rin ang pangkalahatang paghahambing.
theological_decisions:
- issue: Pagpapahayag ng ἐν Χριστῷ sa pormulang Paulino
  choice: sa Mesiyas
  alternative: kay Cristo / nakay Cristo
  rationale: Ginamit ang ‘Mesiyas’ upang mapanatili ang kahulugan ng titulo. Ang ‘sa Mesiyas’ sa pariralang ‘pag-asa natin sa Mesiyas’ ay malinaw at natural, habang ang mas literal na ‘nakay Mesiyas’ ay maaaring tumunog na pilit sa pangungusap na ito.
- issue: Saklaw ng pahayag ni Pablo tungkol sa pag-asa
  choice: Ang kondisyon ay tumutukoy sa pag-asang limitado sa buhay na ito lamang
  alternative: Isang pinalawak na paliwanag tungkol sa kabilang-buhay
  rationale: Pinananatili ang retorikal na kondisyon ng talata nang hindi dinaragdagan ng doktrinal na paliwanag na wala mismo sa teksto.
- issue: Pahambing o pasukdol na diwa ng ἐλεεινότεροι
  choice: higit ... kaawa-awa kaysa sa lahat ng tao
  alternative: pinakakaawa-awa sa lahat ng tao
  rationale: Pinananatili sa pangunahing teksto ang tahasang pahambing na anyo ng Griyego, habang kinikilala sa talababa ang natural na pasukdol na pagpapahayag sa Filipino.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ang nominal na ayos na ‘ang pag-asa natin sa Mesiyas’ ay natural sa karaniwang mambabasa at nililinaw na ‘lamang’ ay tumutukoy sa ‘buhay na ito.’ Pinanatili ang ‘Mesiyas’ bilang titulo at iniwasan ang denominasyonal na pagpapalawak.
