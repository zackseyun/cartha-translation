id: 1CO.15.58
reference: 1 Corinthians 15:58
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ὥστε, ἀδελφοί μου ἀγαπητοί, ἑδραῖοι γίνεσθε, ἀμετακίνητοι, περισσεύοντες ἐν τῷ ἔργῳ τοῦ κυρίου πάντοτε, εἰδότες ὅτι ὁ κόπος ὑμῶν οὐκ ἔστιν κενὸς ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/058.yaml
  text: Therefore[a], my beloved brothers, become steadfast, immovable, always abounding in the work of the Lord, knowing that your labor in the Lord is not in vain.
translation:
  language: tl
  text: Kaya, mga minamahal kong kapatid[a], maging matatag kayo at di-natitinag, at laging sumagana sa gawain ng Panginoon, yamang alam ninyong ang inyong pagpapagal sa Panginoon ay hindi walang kabuluhan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego na isinaling “mga kapatid” ay nasa anyong panlalaking maramihan ngunit, depende sa konteksto, maaari itong tumukoy nang sama-sama sa mga kapwa mananampalataya, kabilang ang mga babae.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: Kaya
  rationale: Nagpapahayag ito ng kongklusyon mula sa naunang pangangatwiran tungkol sa muling pagkabuhay; natural sa modernong Tagalog ang “Kaya.”
- source_word: ἀδελφοί μου ἀγαπητοί
  choice: mga minamahal kong kapatid
  rationale: Ang “kapatid” ay likas na tawag sa kapwa mananampalataya sa Tagalog at maaaring tumukoy sa buong kongregasyon; pinananatili ng “minamahal kong” ang personal at mapagmahal na tono.
- source_word: ἑδραῖοι γίνεσθε
  choice: maging matatag kayo
  rationale: Pinananatili ng “maging” ang puwersa ng pautos na γίνεσθε, at inilalarawan ng “matatag” ang matibay na pagkakatatag.
- source_word: ἀμετακίνητοι
  choice: di-natitinag
  rationale: Nagpapahayag ng hindi mapaaalis o maitutulak mula sa kinatatayuan, sa natural at marangal na Tagalog.
- source_word: περισσεύοντες
  choice: laging sumasagana
  rationale: Ang “sumasagana” ay nagpapanatili sa diwa ng patuloy na kasaganaan o pag-uumapaw, hindi lamang kahusayan.
- source_word: ἐν τῷ ἔργῳ τοῦ κυρίου
  choice: sa gawain ng Panginoon
  rationale: Malawak ang “gawain” at hindi nito nililimitahan ang ἔργον sa pormal na ministeryo lamang.
- source_word: εἰδότες
  choice: yamang alam ninyo
  rationale: Ginagawang natural sa Tagalog ang adverbial participle at ipinahihiwatig ang makatuwirang batayan ng utos nang hindi labis na nagpapaliwanag.
- source_word: ὁ κόπος ὑμῶν
  choice: ang inyong pagpapagal
  rationale: Mas malinaw na naihahatid ng “pagpapagal” kaysa “gawain” ang mabigat at nakapapagod na pagsisikap na nasa κόπος.
- source_word: οὐκ ἔστιν κενὸς
  choice: hindi walang kabuluhan
  rationale: Karaniwang idyomang Tagalog ito para sa pagsisikap na hindi hungkag, walang saysay, o walang bunga; pinananatili rin ang negatibong porma ng Griyego.
- source_word: ἐν κυρίῳ
  choice: sa Panginoon
  rationale: Pinananatili ang malawak na teolohikal na ugnayan ng pariralang Paulino sa halip na paliitin ito sa “dahil sa” o “para sa.”
theological_decisions:
- issue: Saklaw ng ἀδελφοί
  choice: “mga kapatid” sa pangunahing teksto, na may talababa tungkol sa saklaw nito
  alternative: “mga kapatid na lalaki” o “mga kapatid na lalaki at babae”
  rationale: Bagaman panlalaking maramihan ang anyong Griyego, sa kontekstong liham sa buong iglesia ay maaari itong tumukoy sa mga mananampalatayang lalaki at babae. Ang “mga kapatid” ay natural sa Tagalog at hindi kailangang magdagdag ng salitang wala sa anyo ng pinagmulan.
- issue: Ugnayan ng pangwakas na ἐν κυρίῳ
  choice: 'Iniugnay sa “inyong pagpapagal”: “ang inyong pagpapagal sa Panginoon”'
  alternative: “hindi ito walang kabuluhan dahil sa Panginoon”
  rationale: Pinakamalapit sa ayos at karaniwang gamit ni Pablo na ang pagpapagal ay nagaganap sa ugnayan sa Panginoon; hindi nilulutas nang labis ang saklaw ng parirala.
- issue: Paglilipat ng κύριος
  choice: Panginoon
  alternative: Guro o Amo
  rationale: Ang “Panginoon” ang kinagawiang marangal at teolohikal na katumbas sa kontekstong ito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “di-natitinag” at “pagpapagal” upang mapanatili ang diin ng Griyego nang hindi nagiging lipas o labis na teknikal.
