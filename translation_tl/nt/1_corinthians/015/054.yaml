id: 1CO.15.54
reference: 1 Corinthians 15:54
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅταν δὲ τὸ ⸂φθαρτὸν τοῦτο ἐνδύσηται ἀφθαρσίαν καὶ τὸ⸃ θνητὸν τοῦτο ἐνδύσηται ⸀ἀθανασίαν, τότε γενήσεται ὁ λόγος ὁ γεγραμμένος· Κατεπόθη ὁ θάνατος εἰς νῖκος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/054.yaml
  text: 'But when this perishable puts on imperishability[a], and this mortal puts on immortality[d][c][b], then the written word will come to pass: “Death has been swallowed up in victory.”'
translation:
  language: tl
  text: 'Ngunit kapag ang nasisirang ito ay magbihis ng kawalang-kasiraan, at ang mortal na ito ay magbihis ng imortalidad, saka magaganap ang nasusulat na pahayag[a]: “Nilamon na ang kamatayan sa tagumpay.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang nasusulat na salita” o “ang kasabihang nasusulat.”
    reason: lexical_alternative
  - marker: b
    text: Sipi mula sa Isaias 25:8, ayon sa anyo ng tradisyong Griyego na sinipi ni Pablo.
    reason: cross_reference
lexical_decisions:
- source_word: φθαρτὸν
  choice: ang nasisirang ito
  rationale: Ginawang pangngalang pang-uri ang salita gaya sa Griyego, nang hindi tahasang idinaragdag ang “katawan,” bagaman iyon ang tinutukoy sa konteksto.
- source_word: ἐνδύσηται
  choice: mabihisan
  rationale: Pinananatili ang talinghaga ng pananamit habang gumagamit ng likas na anyong Filipino para sa pagkakamit ng isang bagong kalagayan.
- source_word: ἀφθαρσίαν
  choice: kawalang-kasiraan
  rationale: Malinaw na katapat ng “nasisisira” at ipinahihiwatig ang kalagayang hindi na saklaw ng pagkasira.
- source_word: θνητὸν
  choice: mortal
  rationale: Karaniwan at maikling salitang Filipino para sa isang nilalang o katawang maaaring mamatay; malinaw itong katambal ng “imortalidad.”
- source_word: ἀθανασίαν
  choice: imortalidad
  rationale: Likas at malawak na nauunawaang salin para sa kalagayang hindi na namamatay.
- source_word: γενήσεται
  choice: mangyayari
  rationale: Tuwirang ipinapahayag ang diwa ng γίνομαι na “mangyari” o “maganap,” nang hindi ipinapasok sa pangunahing teksto ang mas tiyak na wikang “matupad.”
- source_word: ὁ λόγος ὁ γεγραμμένος
  choice: ang nasusulat na pahayag
  rationale: Ang “pahayag” ay likas sa Filipino bilang pambungad sa siniping pangungusap, samantalang pinananatili ng “nasusulat” ang katangian nitong naitala na.
- source_word: Κατεπόθη
  choice: nilamon na
  rationale: Pinananatili ang mariing larawan at ang balintiyak na diwa nang hindi tinutukoy kung sino ang lumamon; ipinakikita ng “na” na sa panahong tinutukoy ay ganap na ang pangyayari.
- source_word: εἰς νῖκος
  choice: sa tagumpay
  rationale: Pinananatili ang ugnayan sa “tagumpay” nang hindi ito ginagawang tahasang gumaganap sa pandiwang “nilamon,” sapagkat εἰς at hindi isang tahasang panandang tagaganap ang nasa Griyego.
theological_decisions:
- issue: Ang kaugnayan ng γενήσεται sa siniping Kasulatan
  choice: “mangyayari ang nasusulat na pahayag”
  alternative: “matutupad ang nasusulat na pahayag”
  rationale: Ipinakikita ng talata na magkakatotoo ang nasusulat, ngunit ang payak na diwa ng γίνομαι ay “mangyari” o “maganap”; hindi kailangang gawing teknikal na pormula ng katuparan.
- issue: Ang aspekto ng Κατεπόθη sa pahayag na nakatuon sa hinaharap
  choice: “Nilamon na ang kamatayan”
  alternative: “Nilalamon ang kamatayan” o “Nilamon ang kamatayan”
  rationale: Mula sa puntong hinaharap na inilalarawan ni Pablo, ang pagkatalo ng kamatayan ay nakikitang ganap na; pinananatili rin ang balintiyak upang hindi tukuyin ang di-hayag na tagaganap.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang magkatambal na “nasisisira/kawalang-kasiraan” at “mortal/imortalidad,” gayundin ang talinghaga ng pagbibihis. Hindi tahasang idinagdag ang “katawan” upang mapanatili ang anyo at bahagyang di-tahasang katangian ng Griyego.
