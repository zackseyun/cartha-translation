base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/004.yaml
  text: and that he was buried[a], and that he has been raised on the third day according to the Scriptures[b],
translation:
  language: tl
  text: at siya ay inilibing, at siya ay binuhay na muli sa ikatlong araw ayon sa mga Kasulatan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pandiwang Griyego ay nasa perpektong anyo at maaaring magdiin na ang muling pagkabuhay ay isang naganap na pangyayaring may nananatiling bunga.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτάφη
  choice: inilibing
  rationale: Likas at tuwirang katumbas ito ng aorist passive ng θάπτω. Pinananatili nito ang tinig na balintiyak nang hindi nagdaragdag ng tiyak na uri o lugar ng libingan.
- source_word: ἐγήγερται
  choice: binuhay na muli
  rationale: Ang perfect passive ng ἐγείρω ay tumutukoy sa ginawa ng Diyos kay Cristo bilang natapos na pangyayari na may nananatiling bunga. Ang “binuhay na muli” ay malinaw at natural sa makabagong Filipino at pinananatili ang balintiyak na diwa, bagaman hindi lubos na naipapakita ng pandiwang Filipino lamang ang aspektong perpekto ng Griyego.
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: sa ikatlong araw
  rationale: Karaniwang katumbas ito ng pariralang datibo na nagsasaad ng panahon. Hindi idinagdag ang “pagkatapos” upang hindi tukuyin nang higit sa sinasabi ng Griyego ang paraan ng pagbibilang.
- source_word: κατὰ τὰς γραφάς
  choice: ayon sa mga Kasulatan
  rationale: Ipinapahayag nito ang pagkakaayon ng pangyayari sa patotoo ng mga sagradong Kasulatan at pinananatili ang paulit-ulit na pormula ni Pablo sa konteksto.
- source_word: γραΦάς
  choice: mga Kasulatan
  rationale: Tumutukoy ito sa kinikilalang mga sagradong kasulatan, hindi sa mga sulatin lamang sa pangkalahatan.
- source_word: ὅτι
  choice: siya ay
  rationale: Sa Filipino, hindi kailangang ulitin ang katumbas na “na” sa bawat sugnay kapag ipinagpapatuloy ang naunang pahayag. Ang ayos na “siya ay” ay nagpapanatili sa malinaw at pormal na ritmo ng sunod-sunod na pahayag.
- source_word: καὶ
  choice: at
  rationale: Pinanatili ang payak at paulit-ulit na pang-ugnay ng pormulang Griyego.
theological_decisions:
- issue: Aspekto at tinig ng pandiwa para sa muling pagkabuhay
  choice: binuhay na muli
  alternative: ibinangon; muling nabuhay
  rationale: 'Pinananatili ng “binuhay na muli” ang balintiyak na paglalahad: may kumilos upang buhayin siya, nang hindi tahasang pinapangalanan ang kumilos. Iniwasan ang “muling nabuhay” sapagkat maaari nitong gawing tahasang aktibo o kusang kilos ang pahayag. Ipinaliliwanag sa talababa ang nananatiling bunga na maaaring idiin ng perfect tense.'
- issue: Tinutukoy ng “mga Kasulatan”
  choice: mga Kasulatan
  alternative: mga Kasulatang Judio; mga banal na kasulatan
  rationale: Hindi pinalawak sa pangunahing teksto ang reperensiya. Sapat na ipinahihiwatig ng malaking titik at ng konteksto na kinikilalang sagradong corpus ang tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang balintiyak na anyo at ang magkakahanay na ritmo ng pahayag. Hindi ginamit ang mas lumang “muling ibinangon” bilang pangunahing salin dahil maaaring unang maunawaan iyon bilang pisikal na pagtayo o pag-angat sa karaniwang Filipino.
