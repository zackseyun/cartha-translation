id: 1CO.15.3
reference: 1 Corinthians 15:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Παρέδωκα γὰρ ὑμῖν ἐν πρώτοις, ὃ καὶ παρέλαβον, ὅτι Χριστὸς ἀπέθανεν ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν κατὰ τὰς γραφάς,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/003.yaml
  text: 'For I delivered to you as of first importance what I also received: that Messiah died for our sins according to the Scriptures[b][a],'
translation:
  language: tl
  text: 'Sapagkat ipinasa ko sa inyo bilang pinakamahalagang bagay ang tinanggap ko rin: na ang Mesiyas[a] ay namatay para sa ating mga kasalanan ayon sa mga Kasulatan[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang Cristo.” Ang salitang Griyego na Χριστός ay isang titulong nangangahulugang “Mesiyas” o “Pinahiran.”
    reason: alternative_reading
  - marker: b
    text: O “alinsunod sa mga Kasulatan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρέδωκα
  choice: ibinigay ko
  rationale: Sa konteksto, tumutukoy ito sa pagpapasa ng aral o tradisyong tinanggap. Likas sa Filipino ang “ibinigay ko” at pinananatili nito ang ugnayan sa “tinanggap ko,” bagaman maaari ring sabihing “ipinasa ko.”
- source_word: γὰρ
  choice: Sapagkat
  rationale: Nagpapakilala ito ng paliwanag kaugnay ng naunang pahayag at malinaw na pinananatili ang lohikal na ugnayan.
- source_word: ἐν πρώτοις
  choice: bilang pinakamahalaga
  rationale: Sa kontekstong ito, malamang na tumutukoy ang parirala sa pangunahing kahalagahan, hindi lamang sa pagkakasunod-sunod sa panahon.
- source_word: ὃ καὶ παρέλαβον
  choice: ang tinanggap ko rin
  rationale: Pinananatili nito ang parallel na kilos ng pagtanggap at pagbibigay ng mensahe.
- source_word: Χριστὸς
  choice: ang Mesiyas
  rationale: Ginamit bilang titulo sa maikling pahayag ng pananampalataya; ipinapakita ng “Mesiyas” ang titular at Judiong diwa ng Χριστός.
- source_word: ἀπέθανεν
  choice: namatay
  rationale: Ang aorist indicative ay likas na isinasalin dito sa payak na naganap na kilos.
- source_word: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: para sa ating mga kasalanan
  rationale: Natural at tradisyonal sa Filipino, habang hindi nililimitahan ang parirala sa isang partikular na teorya ng pagtubos.
- source_word: κατὰ τὰς γραφάς
  choice: ayon sa mga Kasulatan
  rationale: Ipinahahayag ang pagkakatugma o pagsang-ayon sa Kasulatan at pinananatili ang anyong maramihan ng γραφάς.
theological_decisions:
- issue: Pagkakasalin sa Χριστός
  choice: ang Mesiyas
  alternative: ang Cristo
  rationale: Malinaw ang gamit bilang titulo sa pormulang ito ng pananampalataya. Pinananatili ng “Mesiyas” ang kahulugang ‘pinahiran’ at ang kontekstong mesiyaniko; inilalagay sa talababa ang tradisyonal na “Cristo.”
- issue: Saklaw ng ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: para sa ating mga kasalanan
  alternative: dahil sa ating mga kasalanan
  rationale: Pinananatili ng “para sa” ang malawak na saklaw ng ὑπέρ at ang tunay na teolohikal na tensiyon nang hindi nagpapasok ng mas makitid na paliwanag sa pagtubos.
- issue: Kahulugan ng κατὰ τὰς γραφάς
  choice: ayon sa mga Kasulatan
  alternative: alinsunod sa mga Kasulatan
  rationale: Parehong maaaring magpahayag ng pagkakatugma sa Kasulatan; ang napili ay mas karaniwan at malinaw sa modernong Filipino.
translation_notes:
  register: Modernong Filipino na may dignidad at angkop sa pampublikong pagbasa. Ginamit ang “mga Kasulatan” bilang kinikilalang katawagan sa mga banal na kasulatan, at iniwasan ang sobrang teknikal o denominasyonal na pananalita.
