  to: 'Ngunit ang bawat isa ay bubuhayin ayon sa sariling pagkakasunod-sunod: ang Mesiyas[a] ang unang bunga, pagkatapos ay ang mga kabilang sa Mesiyas sa kanyang pagdating[b].'
  rationale: Inalis ang “takdang” upang huwag dagdagan ang saklaw ng τάγμα nang lampas sa kaayusan o pagkakasunod-sunod na ipinahahayag ng teksto. Inayos ang talababa b upang magbigay ng tunay na alternatibo sa pangunahing saling “pagdating,” at bahagyang nilinaw ang kahulugan ng Χριστός sa talababa a. Napanatili ang ipinahihiwatig na “bubuhayin,” na kinakailangan para sa likas at ganap na pangungusap sa Tagalog at malinaw na nagmumula sa naunang konteksto.
