reference: 1 Corinthians 15:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἕκαστος δὲ ἐν τῷ ἰδίῳ τάγματι· ἀπαρχὴ Χριστός, ἔπειτα οἱ τοῦ Χριστοῦ ἐν τῇ παρουσίᾳ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/023.yaml
  text: 'But each in his own order: Messiah the firstfruits[b][a], then those who belong to Messiah at his coming.'
translation:
  language: tl
  text: 'Ngunit ang bawat isa ay bubuhayin ayon sa sariling pagkakasunod-sunod: ang Mesiyas[a] ang unang bunga, pagkatapos ay ang mga kabilang sa Mesiyas sa kanyang pagdating[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang Cristo.” Ang titulong Griyego na Χριστός ay nangangahulugang “ang Pinahiran.”
    reason: alternative_reading
  - marker: b
    text: Maaari ring isaling “presensya” o “pagparito.” Sa kontekstong ito, tumutukoy ito sa kanyang pagdating sa hinaharap.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: ang bawat isa
  rationale: 'Pinananatili ang distributibong diwa: ang bawat isa sa mga tinutukoy na bubuhayin ay may takdang lugar sa pagkakasunod-sunod.'
- source_word: ἐν τῷ ἰδίῳ τάγματι
  choice: ayon sa kani-kaniyang takdang pagkakasunod-sunod
  rationale: Ang τάγμα ay maaaring tumukoy sa hanay, pangkat, o itinakdang kaayusan. Sa konteksto ng muling pagkabuhay, malinaw ang temporal na pagkakasunod-sunod, habang ipinahihiwatig ng “takdang” na hindi ito basta pagkakataon lamang.
- source_word: ἀπαρχὴ
  choice: unang bunga
  rationale: Pinananatili ang larawang pang-ani at panrelihiyon ng unang bahagi ng ani na inihahandog at nagsisilbing tanda ng kasunod na ani.
- source_word: Χριστός
  choice: ang Mesiyas
  rationale: Dito ay litaw ang gamit bilang titulo ng Pinahiran, hindi lamang bilang pangalang pantangi.
- source_word: οἱ τοῦ Χριστοῦ
  choice: ang mga kabilang sa Mesiyas
  rationale: Malinaw na ipinahahayag ang genitibong diwa ng pag-aari o kaugnayan nang hindi dinaragdagan ang kahulugan.
- source_word: παρουσίᾳ
  choice: pagdating
  rationale: Sa kontekstong eskatolohikal, tumutukoy ito sa hinaharap na pagdating ng Mesiyas; natural at malinaw ito sa makabagong Tagalog, habang inilalahad sa talababa ang ibang posibleng leksikal na diwa.
theological_decisions:
- issue: Kung paano isasalin ang Χριστός bilang titulong may eskatolohikal na diin
  choice: ang Mesiyas
  alternative: ang Cristo
  rationale: Ipinakikita ng talata ang Mesiyas at ang mga kabilang sa kanya bilang magkahiwalay na bahagi ng pagkakasunod-sunod ng muling pagkabuhay, kaya malinaw ang titulong diwa. Inilalagay sa talababa ang tradisyonal na “Cristo.”
- issue: Kung bibigyan ng teknikal na katawagan ang παρουσία
  choice: pagdating
  alternative: presensya o pagdating niya
  rationale: Ang “pagdating” ay malinaw na naghahatid ng hinaharap na pangyayaring tinutukoy ng konteksto nang hindi nagdaragdag ng mas tiyak na sistemang eskatolohikal.
- issue: Kung tahasang ilalagay ang pandiwang ipinahihiwatig mula sa naunang talata
  choice: bubuhayin
  alternative: 'panatilihin ang elipsis: “ang bawat isa ayon sa kani-kaniyang…”'
  rationale: Walang tahasang pandiwa sa Griyego ng talatang ito, ngunit dinadala nito ang “bubuhayin” mula sa talata 22. Kailangan itong ilagay upang maging buo at natural ang pangungusap sa Tagalog, nang hindi binabago ang diwa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “kani-kaniyang takdang pagkakasunod-sunod” upang maipahayag ang kaayusan nang hindi labis na pinaiigting ang posibleng larawang militar ng τάγμα. Ang “unang bunga” ay sadyang pinanatili bilang biblikal na larawang pang-ani.
