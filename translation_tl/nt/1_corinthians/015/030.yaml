translation:
  language: tl
  text: Bakit kami rin ay nasa panganib bawat oras?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas literal: “Ano rin ang dahilan at kami ay nasa panganib bawat oras?” Sa konteksto, ang diwa ay “Bakit kami rin ay nasa panganib bawat oras?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί
  choice: Bakit
  rationale: Sa konteksto ng retorikal na tanong, hinihingi ng τί ang dahilan o kabuluhan ng pagkilos, hindi ang isang bagay; natural na naihahatid ng “Bakit” ang puwersa ng argumento ni Pablo.
- source_word: καὶ
  choice: din naman
  rationale: Idinaragdag ng καὶ si Pablo at ang kaniyang mga kasama sa mga naunang halimbawang binanggit. Ang “din naman” ay natural sa Tagalog at malinaw na nagpapahayag ng ganitong pagdaragdag.
- source_word: ἡμεῖς
  choice: kami
  rationale: Ang tinutukoy ay si Pablo at ang kaniyang mga kasamang hiwalay sa mga kausap niyang taga-Corinto, kaya ang eksklusibong “kami” ang angkop sa Tagalog.
- source_word: κινδυνεύομεν
  choice: nalalagay sa panganib
  rationale: Tuwirang ipinapahayag nito ang pagiging nasa panganib nang hindi dinaragdagan ang kahulugan tungo sa mas tiyak na “isinasapanganib ang buhay.”
- source_word: πᾶσαν ὥραν
  choice: sa bawat oras
  rationale: Pinananatili nito ang masinsing larawan ng patuloy at paulit-ulit na pagharap sa panganib, habang nananatiling malinaw sa modernong Tagalog.
theological_decisions:
- issue: Retorikal na puwersa sa argumento ni Pablo tungkol sa muling pagkabuhay
  choice: Isinalin bilang retorikal na tanong na nagtatanong kung bakit patuloy na nahaharap sa panganib ang mga apostolikong manggagawa kung hindi binubuhay ang mga patay.
  alternative: Ano rin naman ang dahilan at nalalagay kami sa panganib sa bawat oras?
  rationale: Sinusuportahan ng Griyegong ayos at ng agarang konteksto ang kahulugang “Bakit,” ngunit pinananatili sa talababa ang mas literal na anyo ng τί upang hindi maitago ang anyong ambiguo ng pananalita.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “kami” upang mapanatili ang mahalagang inklusibo/eksklusibong kaibhan sa Tagalog; ang “din naman” ay nagpapakita ng dagdag na halimbawa sa argumento.
