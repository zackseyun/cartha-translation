base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/050.yaml
  text: 'I say this[a], brothers: flesh and blood cannot inherit the kingdom of God[b], nor does the perishable inherit the imperishable.'
translation:
  language: tl
  text: 'Ito ang sinasabi ko, mga kapatid[a]: ang laman at dugo[b] ay hindi maaaring magmana ng kaharian ng Diyos, at hindi rin magmamana ang nasisira ng hindi nasisira.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay nasa anyong panlalaking pangmaramihan, ngunit maaari nitong tukuyin nang inklusibo ang buong kongregasyon.
    reason: lexical_alternative
  - marker: b
    text: Ang “laman at dugo” ay idyoma para sa mortal na buhay ng tao sa kasalukuyan nitong kalagayan; hindi nito itinatanggi ang muling pagkabuhay na may katawan.
    reason: cultural_note
lexical_decisions:
- source_word: Τοῦτο δέ φημι
  choice: Ito ang sinasabi ko
  rationale: Likas at tuwirang paglalahad sa Tagalog; ipinahihiwatig ng ayos ng pangungusap ang banayad na paglipat ng δέ nang hindi nagdaragdag ng salitang temporal.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Ang “mga kapatid” ay likas sa modernong Tagalog at maaaring tumukoy sa buong kongregasyon nang hindi kailangang tukuyin ang kasarian.
- source_word: σὰρξ καὶ αἷμα
  choice: laman at dugo
  rationale: Pinananatili ang malinaw na idyoma ng Griyego at ang pagkakaugnay nito sa mortal na kalagayan ng tao.
- source_word: βασιλείαν θεοῦ
  choice: kaharian ng Diyos
  rationale: Karaniwan, malinaw, at pormal na katumbas na nagpapanatili sa teolohikal na bigat ng parirala.
- source_word: κληρονομῆσαι / κληρονομεῖ
  choice: magmana / mamanahin
  rationale: Pinananatili ang larawan ng pamana at ang pagkakapantay ng dalawang sugnay, gamit ang anyong likas sa kani-kanilang balangkas sa Tagalog.
- source_word: ἡ φθορά
  choice: ang nasisira
  rationale: Ipinahahayag ang pagiging saklaw ng pagkasira o pagkabulok, at pinananatiling pangkalahatan ang tinutukoy sa halip na magdagdag ng “katawan.”
- source_word: τὴν ἀφθαρσίαν
  choice: ang hindi nasisira
  rationale: Malinaw na itinatapat sa “ang nasisira” at hindi ipinapantay sa “kawalang-kamatayan,” na may kaugnayan ngunit ibang terminong Griyego.
theological_decisions:
- issue: Kahulugan ng “laman at dugo” kaugnay ng muling pagkabuhay
  choice: Idyoma para sa mortal at nasisirang buhay ng tao sa kasalukuyang kalagayan nito.
  alternative: Pagtanggi na ang anumang pisikal o materyal na katawan ay maaaring pumasok sa kaharian ng Diyos.
  rationale: Sa agarang konteksto, itinuturo ni Pablo ang pagbabago mula sa nasisira tungo sa hindi nasisira, hindi ang pagtalikod sa pagkakaroon ng katawan. Pinananatili ng salin ang idyoma at nililinaw ito sa talababa.
- issue: Saklaw ng ἀδελφοί
  choice: “mga kapatid,” na likas na maaaring tumukoy sa magkakapatid sa pananampalataya anuman ang kasarian
  alternative: “mga kapatid na lalaki”
  rationale: Bagaman panlalaking pangmaramihan ang anyong Griyego, karaniwan itong ginagamit ni Pablo bilang tawag sa buong kongregasyon. Hindi kailangang lagyan ng kasarian ang likas na inklusibong salitang Tagalog na “kapatid.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang idyomang “laman at dugo” at ang mariing pagkakatapat ng “nasisira” at “hindi nasisira,” habang iniwasang magdagdag ng “katawan” sa pangunahing teksto.
