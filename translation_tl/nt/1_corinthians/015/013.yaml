  text: εἰ δὲ ἀνάστασις νεκρῶν οὐκ ἔστιν, οὐδὲ Χριστὸς ἐγήγερται·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/013.yaml
  text: But if there is no resurrection of the dead[b][a], then not even Messiah has been raised.
translation:
  language: tl
  text: Ngunit kung walang muling pagkabuhay ng mga patay, maging ang Mesiyas ay hindi rin muling binuhay.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “si Cristo.” Ang Griegong titulong Χριστός ay maaaring isaling “Cristo” o “Mesiyas”; ginamit dito ang “Mesiyas” upang mapanatili ang kahulugan ng titulo.
    reason: alternative_reading
  - marker: b
    text: O “muling nabuhay.” Pasibo ang pandiwang Griego (“muling binuhay”), na maaaring magpahiwatig ng pagkilos ng Diyos nang hindi tahasang sinasabi kung sino ang kumilos.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Ngunit kung
  rationale: Ipinapakita ng εἰ ang kondisyon, at ng δέ ang banayad na pagsalungat o pag-usad ng argumento.
- source_word: ἀνάστασις νεκρῶν
  choice: muling pagkabuhay ng mga patay
  rationale: Likas at kinikilalang salin ito para sa pagkabuhay na muli ng mga taong patay bilang isang uri, nang hindi ginagawang pariralang pinagmulan na 'mula sa mga patay.'
- source_word: οὐκ ἔστιν
  choice: walang
  rationale: Malinaw at natural nitong ipinahahayag ang eksistensiyal na pagtanggi sa realidad ng muling pagkabuhay.
- source_word: οὐδὲ
  choice: maging ... ay hindi rin
  rationale: Pinananatili nito ang diin ng 'not even' at ang lohikal na bunga ng kondisyong nauna.
- source_word: Χριστὸς
  choice: ang Mesiyas
  rationale: Ginamit bilang titulong nangangahulugang ang Pinahiran, hindi bilang personal na pangalan; natural sa Filipino ang may pantukoy na 'ang.'
- source_word: ἐγήγερται
  choice: muling binuhay
  rationale: 'Pinananatili ang perpektong pasibong diwa: isang natapos na pagkilos na may kasalukuyang bisa, habang hindi tahasang pinapangalanan ang kumilos.'
theological_decisions:
- issue: Pagpapakahulugan sa Χριστός
  choice: ang Mesiyas
  alternative: si Cristo
  rationale: Pinananatili ang kahulugan nito bilang titulo sa argumentong teolohikal ni Pablo, habang kinikilala sa talababa ang nakaugaliang anyong 'Cristo.'
- issue: Tinig ng ἐγήγερται
  choice: muling binuhay
  alternative: muling nabuhay
  rationale: Ang pasibong anyo ay pinanatili upang ipahiwatig na may kumilos sa Mesiyas nang hindi idinaragdag sa teksto na ang Diyos ang gumawa nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang terminong biblikal na “muling pagkabuhay,” at iniwasan ang tahasang pagbanggit sa Diyos bilang kumilos dahil hindi siya pinangalanan sa talatang Griego.
