  text: and that he appeared to Cephas[c][b][a], then to the twelve.
translation:
  language: tl
  text: at na nagpakita siya kay Cefas[a][b], pagkatapos ay sa Labindalawa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “nakita siya ni Cefas.” Pormal na pasibo ang pandiwang Griyego, ngunit sa mga konteksto ng pagpapakita matapos ang muling pagkabuhay, karaniwan itong isinasaling “nagpakita.”'
    reason: lexical_alternative
  - marker: b
    text: Ang Cefas ay pangalang Aramaiko na katumbas ng Pedro.
    reason: cross_reference
  - marker: c
    text: Ang “Labindalawa” ay nakaugaliang katawagan sa pangkat ng mga apostol ni Jesus, kahit hindi labindalawa ang aktuwal na bilang ng pangkat sa bawat pagkakataon.
    reason: cultural_note
lexical_decisions:
- source_word: ὤφθη
  choice: nagpakita
  rationale: Ang aorist passive ng ὁράω ay karaniwang ginagamit sa mga salaysay ng pagpapakita matapos ang muling pagkabuhay. Ang “nagpakita” ay natural sa modernong Tagalog at hindi nagdaragdag ng paliwanag tungkol sa paraan ng pagpapakita.
- source_word: Κηφᾷ
  choice: kay Cefas
  rationale: Dative ito ng pangalang Κηφᾶς. Pinanatili ang anyo ng pangalang ginamit sa Griyego sa halip na palitan ito agad ng mas pamilyar na “Pedro.”
- source_word: εἶτα
  choice: pagkatapos ay
  rationale: Malinaw at natural nitong ipinapahayag ang pagkakasunod-sunod ng mga pagpapakita sa tradisyong binibigkas ni Pablo.
- source_word: τοῖς δώδεκα
  choice: sa labindalawa
  rationale: Pinananatili nito ang nakaugaliang katawagan sa pangkat ng mga apostol ni Jesus, nang hindi ito hinaharmonisa sa “labing-isa” o pinapalitan ng “mga apostol.”
- source_word: καὶ ὅτι
  choice: at na
  rationale: Ipinagpapatuloy nito ang magkakasunod na sugnay na nagsasaad ng nilalaman ng tradisyong tinanggap at ipinasa ni Pablo.
theological_decisions:
- issue: Wika ng pagpapakita matapos ang muling pagkabuhay
  choice: nagpakita siya
  alternative: nakita siya
  rationale: Karaniwang ipinahahayag ng “nagpakita” ang gamit ng ὤφθη sa kontekstong ito, ngunit inilalahad sa talababa ang mas pormal na pasibong salin upang mapanatili ang tunay na ambiguwidad ng anyong Griyego.
- issue: Ang katawagang “ang labindalawa” sa kabila ng pagkawala ni Judas
  choice: sa labindalawa
  alternative: sa labing-isa / sa mga apostol
  rationale: Ang tekstong Griyego ay gumagamit ng nakaugaliang katawagang τοῖς δώδεκα. Hindi ito binago ayon sa isang historikal na pagsasaayos o harmonisasyon.
translation_notes:
  register: Modernong Filipino Tagalog na maikli, natural, at marangal. Pinanatili ang sintaktikong ugnayan sa naunang mga talata sa pamamagitan ng “at na,” ang pangalang Cefas ayon sa Griyego, at ang tradisyonal na katawagang “labindalawa.”
