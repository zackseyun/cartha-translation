id: 1CO.15.12
reference: 1 Corinthians 15:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Εἰ δὲ Χριστὸς κηρύσσεται ὅτι ἐκ νεκρῶν ἐγήγερται, πῶς λέγουσιν ⸂ἐν ὑμῖν τινες⸃ ὅτι ἀνάστασις νεκρῶν οὐκ ἔστιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/012.yaml
  text: If the Messiah is proclaimed as having been raised from the dead[a], how can some among you say that there is no resurrection of the dead?
translation:
  language: tl
  text: Kung ipinangangaral na ang Mesiyas[a] ay ibinangon mula sa mga patay, paano nasasabi ng ilan sa inyo na walang muling pagkabuhay ng mga patay?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Cristo.” Ang Griegong Χριστός ay maaaring isaling “Mesiyas” o “Cristo”; pinanatili sa pangunahing teksto ang diwa nito bilang titulo.
    reason: alternative_reading
lexical_decisions:
- source_word: Χριστὸς
  choice: ang Mesiyas
  rationale: Ginamit bilang tiyak na titulong tumutukoy sa ipinangakong pinahiran ng Diyos; ang “ang” ay likas sa balarilang Tagalog.
- source_word: κηρύσσεται
  choice: ipinangangaral
  rationale: Pinananatili ang pangkasalukuyang anyong balintiyak at ang diwa ng hayagang pagpapahayag.
- source_word: ἐκ νεκρῶν
  choice: mula sa mga patay
  rationale: Likas na salin ng pananalitang tumutukoy sa pagbangon mula sa kalagayan o hanay ng mga patay, habang pinananatili ang maramihang diwa ng νεκρῶν.
- source_word: ἐγήγερται
  choice: ay ibinangon
  rationale: Pinananatili ang balintiyak na anyo at hindi tahasang pinapangalanan ang kumilos; ipinahihiwatig ng konteksto ang naganap na pagbangon na may nananatiling bunga.
- source_word: πῶς λέγουσιν
  choice: paano nasasabi
  rationale: Likas na retorikal na tanong sa Tagalog na naghahayag ng hindi pagkakatugma ng pahayag ng ilan sa ipinangangaral tungkol sa Mesiyas.
- source_word: ἐν ὑμῖν τινες
  choice: ilan sa inyo
  rationale: Malinaw at likas na tumutukoy sa isang pangkat sa loob ng pamayanang kinakausap.
- source_word: ἀνάστασις νεκρῶν
  choice: muling pagkabuhay ng mga patay
  rationale: Karaniwang malinaw na pananalita para sa pangkalahatang pagkabuhay na muli ng mga patay at pinananatili ang ugnayang henitibo.
- source_word: οὐκ ἔστιν
  choice: walang
  rationale: Pinakamaikli at likas na paraan sa Tagalog upang ipahayag ang eksistensiyal na pagtanggi.
theological_decisions:
- issue: Pagbibigay-salin sa Χριστός bilang titulo
  choice: ang Mesiyas
  alternative: si Cristo
  rationale: Sa pangungusap na ito, gumaganap ang Χριστός bilang titulong kristolohikal; ang “Mesiyas” ay nagpapanatili sa kahulugan ng titulo, samantalang inilalahad sa talababa ang nakaugaliang anyong “Cristo.”
- issue: Balintiyak na pagkabuhay ng Mesiyas
  choice: ay ibinangon
  alternative: ay muling nabuhay
  rationale: Pinananatili ng “ibinangon” ang balintiyak ng ἐγήγερται at ang hindi tahasang pagbanggit sa gumawa, sa halip na gawing tahasang kusang kilos ng Mesiyas.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang retorikal na diin ng tanong at ang pagkakaiba ng partikular na pagbangon ng Mesiyas at ng pangkalahatang muling pagkabuhay ng mga patay.
