  source_fidelity: Tapat ang salin sa Griyego. Napananatili ang pangkasalukuyang balintiyak ng κηρύσσεται sa “ipinangangaral,” ang naganap at balintiyak na diwa ng ἐγήγερται sa “ay ibinangon,” at ang retorikal na tanong ng πῶς. Ang “ilan sa inyo” ay wastong tumutugon sa ἐν ὑμῖν τινες, at ang “muling pagkabuhay ng mga patay” ay malinaw na katumbas ng ἀνάστασις νεκρῶν.
  naturalness: Likas, malinaw, at angkop sa makabagong Filipino Tagalog ang pangungusap. Ang ayos na “Kung ipinangangaral na ang Mesiyas ay ibinangon…” ay maayos at pinananatili ang diin ng kondisyunal na pangangatwiran.
