base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/041.yaml
  text: There is one glory of the sun[a], and another glory of the moon, and another glory of the stars; for star differs from star in glory.
translation:
  language: tl
  text: Iba ang kaluwalhatian ng araw[a], iba ang kaluwalhatian ng buwan, at iba ang kaluwalhatian ng mga bituin; sapagkat ang isang bituin ay naiiba sa ibang bituin sa kaluwalhatian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “karilagan” o “ningning” sa buong talata; ang Griyegong δόξα ay maaaring tumukoy rito sa nakikitang liwanag, ngunit pinananatili ng “kaluwalhatian” ang paulit-ulit na salita ni Pablo sa nakapaligid na argumento.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλη
  choice: iba ... iba ... iba
  rationale: Likas sa modernong Tagalog ang paulit-ulit na “iba” upang mapanatili ang paghahambing at pagkakaiba ng araw, buwan, at mga bituin.
- source_word: δόξα
  choice: kaluwalhatian
  rationale: Sa konteksto, tumutukoy ito sa nakikitang ningning o karilagan, ngunit pinananatili ng “kaluwalhatian” ang mahalagang pag-uugnay ng salita sa mas malawak na argumento ni Pablo tungkol sa muling pagkabuhay.
- source_word: ἡλίου / σελήνης / ἀστέρων
  choice: ng araw / ng buwan / ng mga bituin
  rationale: Tuwirang ipinapahayag ng mga pariralang ito ang ugnayang genitibo at pinananatili ang tatluhang pagkakasunod ng mga bagay sa langit.
- source_word: ἀστὴρ ... ἀστέρος
  choice: ang bawat bituin
  rationale: Natural na ipinahahayag sa Tagalog ang paghahambing ng isang bituin sa iba, nang hindi ipinahihiwatig na magkakaiba lamang ang mga uri.
- source_word: γὰρ
  choice: sapagkat
  rationale: Ipinakikilala nito ang paliwanag o batayan ng naunang pahayag.
- source_word: διαφέρει
  choice: magkakaiba
  rationale: Ipinapahayag nito ang pagkakaiba nang hindi ipinapasok ang mas malakas na diwang may nakahihigit.
- source_word: ἐν δόξῃ
  choice: sa kaluwalhatian
  rationale: Tinutukoy nito kung sa anong bagay nagkakaiba ang mga bituin at pinananatili ang pag-uulit ng pangunahing salitang δόξα.
theological_decisions:
- issue: Pagsasalin ng δόξα sa paghahambing sa mga bagay sa langit sa loob ng diskurso tungkol sa muling pagkabuhay
  choice: kaluwalhatian
  alternative: ningning; karilagan
  rationale: Bagaman nakikitang liwanag o karilagan ng mga bagay sa langit ang agarang diwa, pinananatili ng “kaluwalhatian” ang retorikal at teolohikal na kaugnayan sa mga katawang muling bubuhayin, nang hindi nilulutas nang labis ang saklaw ng salita.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang pag-uulit ng “kaluwalhatian” at ang tatluhang paghahambing. Ginamit ang “magkakaiba ... ang bawat bituin” bilang natural na Tagalog para sa singular-to-singular na paghahambing ng Griyego.
