base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/034.yaml
  text: Come to your senses rightly[a], and do not go on sinning; for some have ignorance of God[b]. I say this to your shame.
translation:
  language: tl
  text: Magpakatino kayo, gaya ng nararapat[a], at huwag kayong patuloy na magkasala[b], sapagkat may ilan na walang kaalaman tungkol sa Diyos. Sinasabi ko ito para mapahiya kayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Magbalik kayo sa matinong pag-iisip nang wasto.” Ang pandiwa ay literal na tumutukoy sa paghimasmas mula sa pagkalasing, ngunit malamang na metaporikal ang gamit dito.
    reason: lexical_alternative
  - marker: b
    text: O “huwag kayong magkasala” o “tumigil kayo sa pagkakasala.” Maaaring ipinahihiwatig ng pangkasalukuyang anyo ng pautos ang nagpapatuloy o nakagawiang pagkilos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκνήψατε
  choice: Magbalik kayo sa matinong pag-iisip
  rationale: Ang pandiwa ay literal na tumutukoy sa paghimasmas mula sa pagkalasing ngunit metaporikal dito. Ipinahahayag ng salin ang mapagpasiyang panawagang manumbalik sa malinaw at matinong pag-iisip nang hindi ginagawang literal ang pagkalasing.
- source_word: δικαίως
  choice: gaya ng nararapat
  rationale: Likas itong panuring sa utos at nagpapahiwatig ng pagkilos nang tama o angkop. Iniiwasan nitong bigyan ang salita ng higit na teknikal na teolohikal na kahulugan kaysa sa hinihingi ng konteksto.
- source_word: μὴ ἁμαρτάνετε
  choice: huwag kayong patuloy na magkasala
  rationale: Pinananatili nito ang maaaring nagpapatuloy o nakagawiang aspekto ng pangkasalukuyang pautos na may μή, nang hindi tiyak na ipinapalagay na iisang kasalanan ang kasalukuyang ginagawa ng lahat.
- source_word: ἀγνωσίαν θεοῦ
  choice: walang pagkakilala sa Diyos
  rationale: Natural na Filipino ito para sa kawalan ng kaalaman tungkol sa Diyos at pinananatili ang personal na bigat ng paratang. Hindi nito nilulutas nang labis kung simpleng impormasyong tungkol sa Diyos o mas malalim na pagkakilala ang tinutukoy.
- source_word: τινες
  choice: ang ilan
  rationale: Tumutukoy ito sa di-tiyak na bahagi ng pangkat nang hindi idinaragdag sa teksto kung sila ay tiyak na kabilang sa mga taga-Corinto o kaugnay lamang sa kanila.
- source_word: πρὸς ἐντροπὴν ὑμῖν
  choice: sa ikahihiya ninyo
  rationale: Pinananatili ang matinding pagsaway at ang kaugnayan nito sa kahihiyan ng mga kausap, habang hindi tahasang nilulutas kung pangunahing layunin o bunga ang kanilang pagkapahiya.
- source_word: λαλῶ
  choice: Sinasabi ko ito
  rationale: Natural na pangdiskursong salin na tumutukoy sa naunang pagsaway.
theological_decisions:
- issue: Bigat na moral ng δικαίως
  choice: gaya ng nararapat
  alternative: nang matuwid
  rationale: May malinaw na puwersang etikal ang pangungusap, ngunit ang pang-abay ay pinakamalapit na naglalarawan kung paano sila dapat manumbalik sa matinong pag-iisip. Hindi ipinapasok ang isang teknikal na doktrina ng katuwiran.
- issue: Saklaw ng ἀγνωσίαν θεοῦ
  choice: walang pagkakilala sa Diyos
  alternative: walang kaalaman tungkol sa Diyos
  rationale: Pinananatili ng napiling salin ang seryosong ugnayang at teolohikal na bigat ng parirala, ngunit hindi nito iginigiit na ganap na kawalan ng anumang impormasyon tungkol sa Diyos ang ibig sabihin.
- issue: Layunin o bunga ng πρὸς ἐντροπὴν ὑμῖν
  choice: sa ikahihiya ninyo
  alternative: upang mapahiya kayo
  rationale: Ang Griyego ay maaaring magpahiwatig ng nilalayong epekto o kinalabasan. Ang salin ay sadyang hindi lubos na nagpapasya sa pagitan ng mga ito.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “matinong pag-iisip” upang mapanatili ang larawan ng paghimasmas sa natural na paraan, at “sa ikahihiya ninyo” upang mapanatili ang tindi at bahagyang kalabuan ng pangwakas na parirala.
