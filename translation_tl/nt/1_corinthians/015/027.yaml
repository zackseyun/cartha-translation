id: 1CO.15.27
reference: 1 Corinthians 15:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πάντα γὰρ ὑπέταξεν ὑπὸ τοὺς πόδας αὐτοῦ. ὅταν δὲ εἴπῃ ὅτι πάντα ὑποτέτακται, δῆλον ὅτι ἐκτὸς τοῦ ὑποτάξαντος αὐτῷ τὰ πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/027.yaml
  text: For he has subjected all things under his feet. But when it says that all things have been subjected[a], it is clear that this excludes the one who subjected all things to him.
translation:
  language: tl
  text: Sapagkat “ipinasailalim niya ang lahat ng bagay sa ilalim ng kanyang mga paa.” Ngunit kapag sinabing, “Ang lahat ng bagay ay ipinasailalim,” malinaw na hindi kabilang dito[a] ang nagpasailalim ng lahat ng bagay sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “maliban sa nagpasailalim ng lahat ng bagay sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα / τὰ πάντα
  choice: lahat ng bagay
  rationale: Komprehensibo ang neuter plural at hindi lamang tumutukoy sa lahat ng tao; pinananatili rin nito ang alusyon sa Awit 8.
- source_word: ὑπέταξεν / ὑποτέτακται
  choice: ipinasailalim / ay ipinasailalim
  rationale: Ipinapahayag ng ὑποτάσσω ang paglalagay sa ilalim ng kapangyarihan o pamamahala. Ang “ipinasailalim” ay likas sa Filipino at pinananatili ang passive na diwa sa ikalawang gamit.
- source_word: ὑπὸ τοὺς πόδας αὐτοῦ
  choice: sa ilalim ng kanyang mga paa
  rationale: Pinananatili ang biblikal na larawang nagpapahiwatig ng ganap na pamamahala at tagumpay.
- source_word: ὅταν δὲ εἴπῃ
  choice: Ngunit kapag sinabing
  rationale: Ang impersonal na anyo sa Filipino ay likas na tumutukoy sa pahayag ng Kasulatan nang hindi tiyakang nagpapangalan ng simuno, na nananatiling hindi hayag sa Griyego.
- source_word: δῆλον
  choice: malinaw
  rationale: Direkta at pangkaraniwang salin ito ng impersonal na pahayag ng lohikal na kongklusyon.
- source_word: ἐκτὸς τοῦ ὑποτάξαντος αὐτῷ τὰ πάντα
  choice: hindi kabilang dito ang nagpasailalim ng lahat ng bagay sa kanya
  rationale: 'Ipinapahayag nang malinaw at natural ang eksepsiyong tinutukoy ng ἐκτός: ang nagpasailalim ng lahat ay hindi kasama sa “lahat ng bagay.”'
- source_word: αὐτῷ
  choice: sa kanya
  rationale: 'Pinananatili ang datibong ugnayan: sa kanya ipinasailalim ang lahat ng bagay.'
theological_decisions:
- issue: Ugnayan ng Anak at ng nagpasailalim ng lahat ng bagay
  choice: Malinaw na hindi kasama sa “lahat ng bagay” ang nagpasailalim ng mga ito sa kanya.
  alternative: “maliban sa nagpasailalim ng lahat ng bagay sa kanya”
  rationale: Pinananatili nito ang tahasang eksepsiyon at ang pagkakaiba ng Anak at ng Diyos na nagpasailalim ng lahat sa kanya, nang walang pagdaragdag ng paliwanag na wala sa talata.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang pag-uulit ng “ipinasailalim” at ang larawang “sa ilalim ng kanyang mga paa” dahil mahalaga ang mga ito sa argumento at sa alusyon sa Kasulatan.
