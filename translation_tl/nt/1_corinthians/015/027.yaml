  source_fidelity: Tumpak na naisasalin ang saklaw ng πάντα bilang “lahat ng bagay,” ang completed/passive force ng ὑποτέτακται, ang biblikal na larawang “sa ilalim ng kanyang mga paa,” at ang eksepsiyong ipinahahayag ng ἐκτός. Ang impersonal na “kapag sinabing” ay angkop para sa tinutukoy na pahayag ng Kasulatan at hindi labis na tinutukoy ang simuno.
  naturalness: Likas at malinaw ang modernong Filipino. Ang pag-uulit ng “ipinasailalim” ay nararapat, sapagkat sinasalamin nito ang sinadyang pag-uulit ng kaugnay na pandiwang Griyego sa argumento ni Pablo.
  terminology: Ang “lahat ng bagay,” “ipinasailalim,” at “sa ilalim ng kanyang mga paa” ay angkop na marangal na terminolohiya at pinananatili ang alusyong pangkasulatan. Hindi dinaragdagan ng salin ang pagkakakilanlan ng “nagpasailalim,” ngunit malinaw nitong ibinubukod ang taong/isa na iyon mula sa saklaw ng “lahat ng bagay.”
