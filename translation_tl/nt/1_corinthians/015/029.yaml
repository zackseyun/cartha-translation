  text: Ἐπεὶ τί ποιήσουσιν οἱ βαπτιζόμενοι ὑπὲρ τῶν νεκρῶν; εἰ ὅλως νεκροὶ οὐκ ἐγείρονται, τί καὶ βαπτίζονται ὑπὲρ ⸀αὐτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/029.yaml
  text: Otherwise[a], what will those do who are being baptized on behalf of the dead? If the dead are not raised at all, why then are they being baptized on their behalf?
translation:
  language: tl
  text: Kung hindi gayon,[a] ano ang gagawin ng mga nagpapabautismo alang-alang sa mga patay? Kung talagang hindi muling binubuhay ang mga patay, bakit pa sila nagpapabautismo alang-alang sa kanila?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “alang-alang sa mga patay” ay maaari ring isaling “para sa mga patay,” “dahil sa mga patay,” o, bagaman di-gaanong malamang, “sa ibabaw ng mga patay.” Maaaring maunawaan sa iba’t ibang paraan ang pang-ukol sa Griyego, at hindi tiyak kung anong gawain ang tinutukoy ni Pablo.
    reason: Pinananatili ang leksikal at makasaysayang kalabuan ng ὑπέρ nang hindi nagtataguyod ng isang partikular na paliwanag sa bautismo para sa mga patay.
lexical_decisions:
- source_word: Ἐπεὶ
  choice: Kung hindi gayon
  rationale: Sa daloy ng argumento, ipinakikilala nito ang kahihinatnan kung itatanggi ang muling pagkabuhay. Likas sa modernong Tagalog ang “Kung hindi gayon” bilang retorikal na transisyon.
- source_word: τί ποιήσουσιν
  choice: ano ang mapapala
  rationale: Bagaman literal na “ano ang gagawin,” sa kontekstong retorikal ay itinatanong ang magiging kabuluhan o pakinabang ng ginagawa nila. Inihahatid ng “ano ang mapapala” ang puwersa ng tanong nang hindi tinutukoy kung ano mismo ang kinalabasan.
- source_word: οἱ βαπτιζόμενοι
  choice: mga nagpapabautismo
  rationale: Ipinahihiwatig ng anyong pangkasalukuyan at balintiyak ang mga taong tumatanggap o sumasailalim sa bautismo bilang umiiral na gawain, nang hindi hinahatulan ang pagiging lehitimo nito.
- source_word: ὑπὲρ τῶν νεκρῶν
  choice: alang-alang sa mga patay
  rationale: Maaaring ipakahulugan ang ὑπέρ na “para sa,” “alang-alang sa,” “dahil sa,” o “sa ngalan ng.” Pinili ang likas ngunit hindi lubhang tiyak na “alang-alang sa,” at inilagay sa talababa ang tunay na kalabuan.
- source_word: εἰ ὅλως
  choice: Kung talagang
  rationale: Ipinapanatili ng “talagang” ang mariing puwersa ng ὅλως sa kondisyon.
- source_word: νεκροὶ οὐκ ἐγείρονται
  choice: hindi muling binubuhay ang mga patay
  rationale: Pinananatili ang balintiyak na anyo ng ἐγείρονται at ang karaniwang wika ni Pablo tungkol sa muling pagkabuhay, nang hindi tahasang pinapangalanan ang gumagawa.
- source_word: τί καὶ
  choice: bakit
  rationale: Sa inuulit na retorikal na tanong, natural na inihahatid ng “bakit” ang argumentatibong puwersa ng τί καί sa Tagalog.
- source_word: βαπτίζονται
  choice: sila nagpapabautismo
  rationale: Ang “nagpapabautismo” ay likas na Tagalog para sa kusang pagsailalim sa bautismo at ang aspektong di-ganap ay angkop sa gawaing tinutukoy.
- source_word: ὑπὲρ αὐτῶν
  choice: alang-alang sa mga ito
  rationale: Tumutukoy ang αὐτῶν pabalik sa mga patay. Pinananatili ng kaparehong parirala ang leksikal na pagkakatulad at hindi nilulutas ang kahulugan ng gawain.
theological_decisions:
- issue: Kahulugan ng bautismo ὑπὲρ τῶν νεκρῶν
  choice: Panatilihin ang hindi lubhang interpretatibong “nagpapabautismo alang-alang sa mga patay,” nang walang pag-endorso sa isang partikular na gawain o teolohiya.
  alternative: Maaaring “nagpapabautismo para sa mga patay,” “dahil sa mga patay,” o “sa ngalan ng mga patay.”
  rationale: Hindi tiyak ang eksaktong gawaing tinutukoy ni Pablo at maraming paliwanag ang iminungkahi rito. Dapat panatilihin ng salin ang kalabuan at ang retorikal na gamit nito sa argumento tungkol sa muling pagkabuhay, sa halip na magpasok ng doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “muling binubuhay” upang mapanatili ang balintiyak, at “nagpapabautismo” bilang natural na paglalarawan ng pagsailalim sa bautismo. Iniwasan ang denominasyonal na pagpapaliwanag sa mahiwagang gawaing binabanggit.
