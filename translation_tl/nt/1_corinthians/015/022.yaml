source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἐν τῷ Ἀδὰμ πάντες ἀποθνῄσκουσιν, οὕτως καὶ ἐν τῷ Χριστῷ πάντες ζῳοποιηθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/022.yaml
  text: For just as in Adam all die[a], so also in Messiah all will be made alive.
translation:
  language: tl
  text: Sapagkat kung paanong kay Adan ay namamatay ang lahat, gayundin naman kay Mesiyas ay bubuhayin ang lahat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “bubuhayin” ay maaari ring isaling “bibigyan ng buhay.”
    reason: Nililinaw ang posibleng natural na salin ng hinaharap na balintiyak na ζῳοποιηθήσονται nang hindi binabago ang kahulugan.
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Sapagkat kung paanong
  rationale: Pinananatili ng “sapagkat” ang paliwanag na ugnay ng γάρ sa naunang argumento, at ng “kung paanong” ang paghahambing na ipinahihiwatig ng ὥσπερ.
- source_word: ἐν τῷ Ἀδὰμ
  choice: kay Adan
  rationale: Ang “kay Adan” ay likas na katumbas sa Filipino ng siksik na pariralang ἐν τῷ Ἀδὰμ at pinananatiling bukas ang eksaktong kinatawan o korporatibong diwa ng ἐν, sa halip na gawing tahasang instrumental.
- source_word: πάντες
  choice: ang lahat
  rationale: Pinananatili ang malawak at walang tahasang limitasyong saklaw ng dalawang paglitaw ng πάντες, pati ang kanilang paralelismo.
- source_word: ἀποθνῄσκουσιν
  choice: namamatay
  rationale: Likas na ipinahahayag ng pangkasalukuyang anyo sa Filipino ang pangkalahatang realidad o kalagayang kaugnay ni Adan.
- source_word: οὕτως καὶ
  choice: gayundin naman
  rationale: Malinaw at natural nitong pinananatili ang katumbas na bahagi ng paghahambing at ang dagdag na diin ng καί.
- source_word: ἐν τῷ Χριστῷ
  choice: kay Mesiyas
  rationale: Isinasalin ang titulong Χριστός ayon sa kahulugan nitong “Mesiyas” at pinananatili ang tuwirang paralelismo sa “kay Adan.”
- source_word: ζῳοποιηθήσονται
  choice: bubuhayin
  rationale: Pinananatili ng panghinaharap na pandiwang balintiyak ang diwang tatanggap ang lahat ng pagkilos na nagbibigay-buhay, nang hindi tahasang dinaragdagan ang gumagawa na hindi pinangalanan sa talata.
theological_decisions:
- issue: Saklaw ng “lahat” sa dalawang sugnay
  choice: Panatilihing walang tahasang limitasyon ang “lahat” sa magkabilang bahagi.
  alternative: Limitahan ang ikalawang “lahat” sa lahat ng mananampalataya, o ipahayag na magkapareho sa lahat ng detalye ang saklaw ng dalawang gamit.
  rationale: Sadyang magkatapat sa Griyego ang πάντες ... πάντες, ngunit hindi nililinaw ng talatang ito lamang ang buong mekanismo o lawak ng pahayag. Hindi dapat lutasin sa salin ang nananatiling teolohikal na tensiyon.
- issue: Kahulugan ng ἐν sa “kay Adan” at “kay Mesiyas”
  choice: Gamitin ang magkatugmang “kay” sa dalawang parirala.
  alternative: “sa pamamagitan ni Adan/Mesiyas” o “kaisa ni Adan/Mesiyas.”
  rationale: Ang mga alternatibo ay maaaring magtakda nang labis sa instrumental o pakikipagkaisang kahulugan. Ang magkatugmang “kay” ay mas maikli at pinananatili ang kalabuan at paralelismo ng orihinal.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinili ang “Sapagkat kung paanong … gayundin naman” upang mapanatili ang lohikal na ugnay at balanseng paralelismo. Ginamit ang “Mesiyas” bilang salin ng titulong Χριστός.
