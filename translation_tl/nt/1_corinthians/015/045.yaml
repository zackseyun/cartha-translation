  naturalness: Ang “isang nilalang na may buhay” ay nauunawaan ngunit bahagyang hindi kasing-likas ng karaniwang Filipino na “isang nilalang na buhay.” Ang huli ay mas maikli, mas idiomatiko, at pinananatili ang diwang “living being” nang hindi ipinapasok ang ideya ng pag-aari ng buhay.
  terminology: Ang “unang tao,” “huling Adan,” at “espiritung nagbibigay-buhay” ay angkop at pare-pareho ang rehistro. Ang maliit na titik sa “espiritu” ay maingat na pinananatili ang kwalitatibong, walang-artikulong anyo ng πνεῦμα. Ang mga talababa ay wastong nakaangkla sa mga pariralang nililinaw nila.
