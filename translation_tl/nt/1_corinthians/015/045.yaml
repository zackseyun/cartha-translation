id: 1CO.15.45
reference: 1 Corinthians 15:45
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὕτως καὶ γέγραπται· Ἐγένετο ὁ πρῶτος ἄνθρωπος Ἀδὰμ εἰς ψυχὴν ζῶσαν· ὁ ἔσχατος Ἀδὰμ εἰς πνεῦμα ζῳοποιοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/045.yaml
  text: 'So also it is written: “The first man[a], Adam, became a living being”[b]; the last Adam became a life-giving spirit.'
translation:
  language: tl
  text: 'Gayon din ang nasusulat: “Ang unang tao, si Adan, ay naging isang nilalang na buhay”[a]; ang huling Adan ay naging espiritung nagbibigay-buhay.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang kaluluwang buháy,” ayon sa tradisyonal na pagkakasalin ng Genesis 2:7.
    reason: lexical_alternative
  - marker: b
    text: O “isang espiritu na nagbibigay ng buhay.” Inilalarawan ng parirala ang huling Adan bilang kabaligtaran ng una; kwalitatibo ang Griyego at hindi kinakailangang tahasang ipinapakahulugan na si Cristo ay ang Espiritu Santo bilang natatanging persona.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ γέγραπται
  choice: Gayon din ang nasusulat
  rationale: Pinananatili ng “Gayon din” ang ugnayan nito sa naunang pangangatwiran, at ang “ang nasusulat” ay likas at marangal na pormula sa Filipino para sa pagsipi sa Kasulatan.
- source_word: Ἐγένετο
  choice: ay naging
  rationale: Ipinahahayag nito ang pagdating sa isang kalagayan o kinalabasan, at natural itong katumbas ng γίνομαι sa kontekstong ito.
- source_word: ὁ πρῶτος ἄνθρωπος
  choice: ang unang tao
  rationale: Ang “tao” ay tumpak at natural sa Filipino, at pinananatili ang pagtukoy kay Adan bilang unang tao sa tipolohikal na paghahambing.
- source_word: Ἀδὰμ
  choice: Adan
  rationale: Ginamit ang nakaugaliang anyo ng pangalang Adam sa modernong saling Filipino.
- source_word: εἰς ψυχὴν ζῶσαν
  choice: isang nilalang na may buhay
  rationale: Sa alusyon sa Genesis 2:7, tumutukoy ang ψυχή sa buong buháy na nilalang o persona, hindi kinakailangang sa isang hiwalay na di-materyal na sangkap. Iniiwasan ng saling ito ang labis na pagpapakahulugan sa antropolohiya.
- source_word: ὁ ἔσχατος Ἀδὰμ
  choice: ang huling Adan
  rationale: Pinananatili nito ang kilala at tumpak na tipolohikal na paghahambing ni Pablo sa unang Adan at kay Cristo bilang huling Adan.
- source_word: εἰς πνεῦμα ζῳοποιοῦν
  choice: espiritung nagbibigay-buhay
  rationale: Direkta at natural nitong isinasalin ang anarthrous at kwalitatibong πνεῦμα at ang participleng ζῳοποιοῦν, nang hindi ginagawang tahasang pantanging pangalan ang “Espiritu.”
theological_decisions:
- issue: Ang antropolohikal na diwa ng ψυχή sa sipi mula sa Genesis
  choice: “isang nilalang na may buhay”
  alternative: “isang kaluluwang buháy”
  rationale: Sa Genesis 2:7, ang parirala ay naglalarawan kay Adan bilang isang buháy na nilalang o persona. Hindi nito tahasang itinuturo rito ang isang hiwalay na kaluluwang di-materyal; gayunman, inilalagay sa talababa ang tradisyonal na alternatibo.
- issue: Ang kahulugan ng “ang huling Adan ay naging espiritung nagbibigay-buhay”
  choice: Panatilihin ang kwalitatibo at tipolohikal na pahayag nang walang doktrinal na pagpapalawak.
  alternative: “ang huling Adan ay naging Espiritung nagbibigay-buhay” o “isang espiritu na nagbibigay ng buhay”
  rationale: Walang artikulo ang πνεῦμα, kaya hindi dapat gawing tahasang pagkakakilanlan ni Cristo sa Espiritu Santo bilang natatanging persona. Pinananatili ng salin ang tensiyon at paghahambing ng teksto nang hindi ito nilulutas sa pamamagitan ng dagdag na paliwanag.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “nilalang na may buhay” upang maging natural nang hindi nawawala ang alusyon sa paglikha, at maliit na titik ang “espiritu” upang mapanatili ang kwalitatibong anyo ng Griyego.
