  text: εἰ δὲ Χριστὸς οὐκ ἐγήγερται, κενὸν ⸀ἄρα τὸ κήρυγμα ἡμῶν, ⸀κενὴ καὶ ἡ πίστις ⸀ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/014.yaml
  text: And if Messiah has not been raised[a], then our proclamation is empty[c][b], and your faith is empty.
translation:
  language: tl
  text: At kung hindi pa muling binuhay ang Mesiyas[a], kung gayon, walang kabuluhan[b] ang aming pangangaral, at walang kabuluhan din ang inyong pananampalataya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “Cristo” sa halip na “Mesiyas” (Griyego: Christos).'
    reason: alternative_reading
  - marker: b
    text: O “walang laman” sa dalawang paglitaw ng salitang isinaling “walang kabuluhan.”
    reason: lexical_alternative
  - marker: c
    text: O “pagtitiwala” sa halip na “pananampalataya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς
  choice: ang Mesiyas
  rationale: Pinananatili ang kahulugan ng Χριστός bilang titulo ng pinahirang hari, sa halip na ituring lamang itong pangalang pantangi.
- source_word: ἐγήγερται
  choice: hindi muling binuhay
  rationale: Likas na pahayag ito sa modernong Tagalog para sa muling pagkabuhay at pinananatili nito ang tinig na balintiyak ng Griyego nang hindi tahasang tinutukoy ang gumaganap.
- source_word: κενὸν / κενὴ
  choice: walang kabuluhan
  rationale: Natural sa Tagalog para sa isang pangangaral at pananampalatayang nawalan ng tunay na batayan o bisa. Iisang salin ang ginamit sa dalawang paglitaw upang mapanatili ang paralelismo ni Pablo.
- source_word: ἄρα
  choice: kung gayon (ipinahihiwatig ng ayos ng pangungusap)
  rationale: Ang lohikal na bunga ay natural nang naipahahayag sa kayariang “At kung …, …”; hindi na kailangang magdagdag ng mabigat na panandang maaaring maging paulit-ulit sa Tagalog.
- source_word: κήρυγμα
  choice: ang ipinangangaral namin
  rationale: Saklaw nito kapuwa ang gawa at nilalaman ng hayagang pagpapahayag, at karaniwang nauunawaan ng mga modernong mambabasa.
- source_word: πίστις
  choice: pananampalataya
  rationale: Sa konteksto, tumutukoy ito sa tugon ng mga taga-Corinto na sumampalataya; ito ang pinakakaraniwan at angkop na salin, habang posible rin ang “pagtitiwala.”
theological_decisions:
- issue: Pananalita at gumaganap sa muling pagkabuhay
  choice: hindi muling binuhay
  alternative: hindi muling nabuhay
  rationale: Pinananatili ng pangunahing salin ang anyong balintiyak ng ἐγήγερται at hindi nito nilulutas nang tahasan kung sino ang gumaganap, habang ang alternatibo ay maaaring magtunog na tahasan o kusang pagkilos.
- issue: Kabuluhan ng pangangaral at pananampalataya kung walang muling pagkabuhay
  choice: walang kabuluhan
  alternative: walang laman
  rationale: Ipinahahayag nito ang kawalan ng matibay na nilalaman, batayan, o bisa nang hindi nililimitahan ang sinabi sa pagiging praktikal na walang pakinabang lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Mesiyas” bilang titulong madaling makilala, ang karaniwang pananalitang “muling binuhay” para sa konteksto ng pagkabuhay na muli, at inulit ang “walang kabuluhan” upang mapanatili ang retorikal na paralelismo ng Griyego.
