id: 1CO.15.52
reference: 1 Corinthians 15:52
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐν ἀτόμῳ, ἐν ῥιπῇ ὀφθαλμοῦ, ἐν τῇ ἐσχάτῃ σάλπιγγι· σαλπίσει γάρ, καὶ οἱ νεκροὶ ἐγερθήσονται ἄφθαρτοι, καὶ ἡμεῖς ἀλλαγησόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/052.yaml
  text: in an instant[a], in the blink of an eye, at the last trumpet. For the trumpet will sound, and the dead will be raised imperishable, and we will be changed.
translation:
  language: tl
  text: sa isang iglap[a], sa isang kisap-mata, sa pagtunog ng huling trumpeta. Sapagkat tutunog ang trumpeta, at ang mga patay ay ibabangon na hindi nasisira, at tayo ay babaguhin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa isang sandaling hindi mahahati,” samakatuwid ay sa napakaikling sandali.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἀτόμῳ
  choice: sa isang iglap
  rationale: Ang ἄτομος ay literal na tumutukoy sa hindi mahahati, ngunit dito ay nangangahulugang napakaikling sandali. Likas at malinaw sa modernong Tagalog ang “sa isang iglap.”
- source_word: ἐν ῥιπῇ ὀφθαλμοῦ
  choice: sa isang kisap-mata
  rationale: Karaniwang idyomang Tagalog ito para sa sukdulang bilis at biglaan, kaya mahusay nitong naihahatid ang larawang nasa Griyego.
- source_word: ἐν τῇ ἐσχάτῃ σάλπιγγι
  choice: sa huling pagtunog ng trumpeta
  rationale: Inihahayag nito ang panahong kaugnay ng huling trumpeta nang hindi nagpapasok ng partikular na sistemang eskatolohikal.
- source_word: σαλπίσει
  choice: tutunog ang trumpeta
  rationale: Ang pandiwa ay nangangahulugang patutunugin ang trumpeta o tutunog ito. Dahil kababanggit lamang sa trumpeta, malinaw at natural ang tahasang paksa sa Tagalog.
- source_word: οἱ νεκροὶ
  choice: ang mga patay
  rationale: Tumutukoy ang pang-uri na ginamit bilang pangngalan sa mga taong patay bilang isang pangkat; tuwiran at natural ang salin.
- source_word: ἐγερθήσονται
  choice: muling ibabangon
  rationale: Pinananatili ng anyong balintiyak ang di-binanggit na kumikilos at malinaw na ipinahihiwatig ang muling pagkabuhay sa konteksto.
- source_word: ἄφθαρτοι
  choice: na hindi na masisira
  rationale: Ipinahahayag ng ἄφθαρτος ang kalagayang hindi na saklaw ng pagkasira o kabulukan. Malinaw sa karaniwang mambabasa ang “hindi na masisira,” at ang “na” ay nagpapakitang ito ang magiging kalagayan ng mga ibabangon.
- source_word: ἡμεῖς
  choice: tayo
  rationale: Tahasang nasa Griyego ang panghalip at mahalagang panatilihin ang diin at paghahambing nito sa “mga patay,” nang hindi nililinaw nang higit sa sinasabi ng talata kung sino ang saklaw nito.
- source_word: ἀλλαγησόμεθα
  choice: babaguhin
  rationale: Tuwirang pinananatili nito ang hinaharap at balintiyak na anyo ng ἀλλάσσω, pati ang ideya ng pagbabago sa konteksto.
theological_decisions:
- issue: Ang huling trumpeta at ang pagkakasunod-sunod ng mga pangyayari sa wakas
  choice: sa huling pagtunog ng trumpeta
  alternative: sa pangwakas na trumpeta
  rationale: Malinaw na “huli” ang sinasabi ng Griyego, ngunit hindi dinaragdagan ng salin ang talata ng isang partikular na balangkas tungkol sa mga pangyayari sa wakas.
- issue: Ang tinutukoy ng “tayo” kaugnay ng mga patay at ng pagbabago
  choice: at tayo ay babaguhin
  alternative: at tayong mga nabubuhay pa ay babaguhin
  rationale: Pinananatili ang tahasang unang panauhang maramihan nang hindi idinaragdag sa mismong talata ang paliwanag mula sa mas malawak na konteksto.
- issue: Ang ahensiya sa muling pagkabuhay at pagbabago
  choice: muling ibabangon ... babaguhin
  alternative: muling babangon ... magbabago
  rationale: Pinananatili ng mga anyong balintiyak ang anyo ng Griyego at hindi tahasang pinapangalanan ang kumikilos kapag hindi ito pinangalanan sa sugnay.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “kisap-mata” bilang likas na idyoma at iniwasan ang teknikal o makalumang pananalita. Pinanatili ang teolohikal na pagiging bukás ng “huling trumpeta” at ang payak na “tayo.”
