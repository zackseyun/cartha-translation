source:
  edition: SBLGNT
  text: Γνωρίζω δὲ ὑμῖν, ἀδελφοί, τὸ εὐαγγέλιον ὃ εὐηγγελισάμην ὑμῖν, ὃ καὶ παρελάβετε, ἐν ᾧ καὶ ἑστήκατε,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/001.yaml
  text: I make known to you[a], brothers, the good news that I proclaimed to you, which you also received, in which you also stand,
translation:
  language: tl
  text: Ipinababatid ko sa inyo, mga kapatid[a], ang magandang balitang ipinahayag ko sa inyo, na tinanggap din ninyo, at dito rin kayo ay nananatiling matatag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay literal na “mga kapatid na lalaki,” ngunit madalas itong gamitin upang tawagin ang buong komunidad ng mga mananampalataya, kasama ang mga lalaki at babae.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γνωρίζω
  choice: Ipinababatid ko
  rationale: Tuwirang ipinapahayag nito ang diwang “ipaalam” o “ipabatid,” sa halip na gawing “ipinaaalala,” na hindi pangunahing kahulugan ng pandiwang Griyego rito.
- source_word: δὲ
  choice: hindi hiwalay na isinalin
  rationale: Banayad na panandang transisyon ito. Hindi kailangan ng tahasang “ngayon” o “ngunit” sa Filipino, sapagkat magiging mas natural ang daloy nang wala ang mga iyon at walang nawawalang mahalagang pagsalungat.
- source_word: ἀδελφοί
  choice: mga kapatid[a]
  rationale: Pinananatili ang katawagang pampamilya. Likas na hindi tinutukoy ng salitang “kapatid” sa Filipino ang kasarian, kaya akma ito sa malamang na pagtukoy ni Pablo sa buong kongregasyon; nililinaw sa talababa ang anyong panlalaki ng Griyego.
- source_word: τὸ εὐαγγέλιον
  choice: ang magandang balita
  rationale: Tuwirang inilalahad ang kahulugan ng εὐαγγέλιον sa malinaw at karaniwang modernong Filipino.
- source_word: εὐηγγελισάμην
  choice: ipinahayag ko
  rationale: Ipinahihiwatig nito ang hayagang pagpapabatid ng magandang balita. Mas natural ito kaysa sa pilit na pag-uulit ng “magandang balita” sa anyong pandiwa.
- source_word: παρελάβετε
  choice: tinanggap ninyo
  rationale: Saklaw nito ang pagtanggap sa mensahe o tradisyong ipinasa, nang hindi dinaragdagan ng mas matinding pansariling diwa ng “sinang-ayunan.”
- source_word: ἐν ᾧ
  choice: dito
  rationale: Ang “dito” ay natural na tumutukoy pabalik sa magandang balita bilang kalagayan o saligang kinatatayuan nila, at hindi inuunahan ang pahayag ng susunod na talata.
- source_word: ἑστήκατε
  choice: kayo naninindigan
  rationale: Ipinahahayag nito ang nagpapatuloy at matatag na kalagayang bunga ng naunang pagtayo, na siyang puwersa ng perfect tense sa konteksto.
theological_decisions:
- issue: Ang saklaw ng ἀδελφοί sa pagtawag sa kongregasyon
  choice: “mga kapatid” sa pangunahing teksto, na may talababa tungkol sa anyong panlalaki ng Griyego
  alternative: “mga kapatid na lalaki” o “mga kapatid na lalaki at babae”
  rationale: Ang “mga kapatid” ay natural at marangal sa Filipino, pinananatili ang talinghagang pampamilya, at maaaring tumukoy sa buong komunidad. Hindi nito ipinapasok sa pangunahing teksto ang salitang “babae,” ngunit hindi rin nito maling nililimitahan ang tawag sa mga lalaki lamang.
- issue: Ang kaugnayan ng mga mananampalataya sa magandang balita sa ἐν ᾧ καὶ ἑστήκατε
  choice: “dito rin kayo naninindigan”
  alternative: “sa pamamagitan nito ay naninindigan kayo” o “dito kayo nakatayo”
  rationale: Pinananatili ng “dito” ang ugnayang ἐν (“sa loob/dito”) at ang larawan ng matatag na pagtayo, nang hindi ginagawang tahasang kasangkapan o sanhi ang magandang balita bago ang pahayag sa talata 2.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “ipinababatid” upang mapanatili ang pormal ngunit madaling maunawaang himig, at ang “naninindigan” upang natural na maipahayag ang larawan ng matatag na pagtayo.
