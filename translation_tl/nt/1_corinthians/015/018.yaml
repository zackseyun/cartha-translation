  - severity: medium
    issue: Hindi natural at hindi tumpak na alternatibo ang talababang “nakay Cristo.”
    rationale: Ang pariralang ἐν Χριστῷ ay mas mahusay na maipapakita sa Tagalog bilang “kaisa ni Cristo” sa alternatibong tala. Hindi ito ibang tekstuwal na pagbasa kundi tradisyonal na pagpili ng katawagan para sa Χριστός.
