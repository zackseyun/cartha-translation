  source_fidelity: Tumpak na naihahayag ng “Kung gayon” ang inferensiyal na ἄρα, ng “din” ang καί, at ng “napahamak” ang ἀπώλοντο sa lohika ng talata. Napananatili rin ng “natulog” ang metapora ng κοιμηθέντες. Ang “kaisa ng Mesiyas” ay katanggap-tanggap na pagpapahayag ng ἐν Χριστῷ, bagaman maaaring bahagyang hindi agad malinaw ang saklaw nito nang walang wastong ayos ng parirala.
  naturalness: Mas malinaw at mas natural sa modernong Tagalog ang “mga kaisa ng Mesiyas na natulog” kaysa “mga natulog na kaisa ng Mesiyas,” dahil agad nitong ipinakikitang ang pagiging kaisa ng Mesiyas ang tumutukoy sa mga tao, hindi sa paraan ng kanilang pagtulog.
  terminology: Ang “Mesiyas” ay wastong salin ng Χριστός bilang titulo. Ang talababa para sa tradisyonal na termino ay dapat magbigay ng natural na Tagalog na alternatibo; ang “nakay Cristo” ay hindi angkop dito. Ang paliwanag sa “natulog” ay dapat ding iugnay sa konteksto, sa halip na magbigay ng sobrang pangkalahatang pahayag tungkol sa lahat ng paggamit sa Griyego.
  issues:
