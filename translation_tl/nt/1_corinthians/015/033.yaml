  yaml_path: translation/nt/1_corinthians/015/033.yaml
  text: 'Do not be deceived: bad company corrupts good morals[a].'
translation:
  language: tl
  text: 'Huwag kayong padaya: sinisira ng masasamang kasama ang mabubuting asal.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sinisira ng masasamang pag-uusap ang mabubuting asal.” Ang salitang Griyego ay maaaring tumukoy sa pakikisalamuha o sa pag-uusap; mas angkop sa konteksto ang mas malawak na diwang “mga kasama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πλανᾶσθε
  choice: Huwag kayong padaya
  rationale: Pinananatili nito ang anyong pagbabawal at ang posibilidad na ang panlilinlang ay mula sa iba o tinatanggap ng mismong mga mambabasa, nang hindi labis na nililinaw ang tinig na passive/middle.
- source_word: φθείρουσιν
  choice: sinisira
  rationale: Natural ito sa modernong Tagalog at malinaw na nagpapahayag ng unti-unti o ganap na pagpapasama sa mabuting asal; hindi nito pinatitindi ang diwa tungo sa pisikal na pagwasak.
- source_word: ἤθη
  choice: mga asal
  rationale: Tumutukoy ito sa nakagawiang moral na pagkilos o karakter. Ang “mga asal” ay payak at nauunawaan, at naipapakita rin ang anyong maramihan ng Griyego.
- source_word: χρηστὰ
  choice: mabubuti
  rationale: Tuwirang katumbas sa kontekstong etikal at hindi nagdaragdag ng diwang wala sa teksto.
- source_word: ὁμιλίαι
  choice: mga kasama
  rationale: Maaaring tumukoy ang salita sa pakikisalamuha, samahan, o pag-uusap. Sa konteksto ng kasabihan, natural na ipinahihiwatig ng “mga kasama” ang mga taong palaging nakakasalamuha, habang inilalagay sa talababa ang tunay na alternatibong “mga pag-uusap.”
- source_word: κακαί
  choice: masasamang
  rationale: Ipinahahayag nito ang nakapipinsalang katangiang moral ng mga kasama. Mas angkop dito ang “masasama” kaysa sa mas mahinang “di-mabuti.”
