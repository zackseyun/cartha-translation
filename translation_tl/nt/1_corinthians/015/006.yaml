base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/006.yaml
  text: Then he appeared to more than five hundred brothers at one time[a], most of whom remain until now[b], though some have fallen asleep.
translation:
  language: tl
  text: Pagkatapos nito, nagpakita siya sa mahigit limang daang kapatid sa iisang pagkakataon[a]. Karamihan sa kanila ay buhay pa hanggang ngayon, ngunit ang ilan ay nakatulog na[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Panlalaking pangmaramihan ang salitang Griego na isinaling “kapatid,” ngunit sa gamit ng mga unang Kristiyano ay maaari itong tumukoy sa mas malawak na pamayanan ng mga mananampalataya, kabilang ang mga lalaki at babae.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, namatay na. Ginagamit ni Pablo ang “nakatulog” bilang larawan ng kamatayan sa liwanag ng pag-asa sa muling pagkabuhay.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα
  choice: Pagkatapos
  rationale: Ipinahihiwatig nito ang kasunod na pangyayari sa sunod-sunod na paglalahad ni Pablo.
- source_word: ὤφθη
  choice: nagpakita siya
  rationale: Sa mga salaysay tungkol sa muling pagkabuhay, likas na ipinapahayag ng anyong ito na nagpakita si Cristo; ang tinutukoy na paksa ay malinaw mula sa naunang konteksto.
- source_word: ἐπάνω πεντακοσίοις ἀδελφοῖς
  choice: sa mahigit limang daang kapatid
  rationale: Ang ἐπάνω kasama ng bilang ay nangangahulugang “mahigit,” at ang “kapatid” ay likas na katawagan sa Filipino para sa mga kapananampalataya nang hindi nagtatakda ng kasarian.
- source_word: ἐφάπαξ
  choice: nang sabay-sabay
  rationale: Sa kontekstong ito, ipinapakita ng salita na nakita siya ng malaking pangkat sa iisang pagkakataon.
- source_word: οἱ πλείονες
  choice: Karamihan sa kanila
  rationale: Malinaw at likas itong katumbas ng substantibong pahambing na nangangahulugang ang nakararaming bahagi ng pangkat.
- source_word: μένουσιν ἕως ἄρτι
  choice: ay nabubuhay pa hanggang ngayon
  rationale: Bagaman literal na “nananatili hanggang ngayon,” malinaw sa paghahambing sa mga “natulog na” na ang tinutukoy ay ang patuloy nilang pagiging buhay. Iniiwasan din nito ang malabong impresyong nananatili sila sa isang lugar.
- source_word: τινὲς δὲ
  choice: bagaman ang ilan
  rationale: Pinananatili nito ang banayad na pagsalungat sa pagitan ng nakararaming buhay pa at ng ilang namatay na.
- source_word: ἐκοιμήθησαν
  choice: natulog na
  rationale: Pinananatili ang talinghaga ni Pablo para sa kamatayan, na mahalaga sa konteksto ng pag-asa sa muling pagkabuhay.
theological_decisions:
- issue: Saklaw ng ἀδελφοῖς sa pangkat na mahigit limang daan
  choice: kapatid
  alternative: mga kapatid na lalaki; mga kapatid na lalaki at babae
  rationale: Masculine plural ang anyong Griego, ngunit maaari itong tumukoy sa mas malawak na pamayanan ng mga mananampalataya. Ang salitang Filipino na “kapatid” ay tapat sa katawagan at likas na hindi nagtatakda kung lalaki lamang o halo ang pangkat; nililinaw sa talababa ang tunay na kalabuan.
- issue: Talinghaga ng pagtulog para sa kamatayan
  choice: natulog na
  alternative: namatay na
  rationale: Hindi pinapawi ang talinghaga ni Pablo, lalo na dahil nakapaloob ang talata sa kaniyang pangangatwiran tungkol sa muling pagkabuhay; nililinaw sa talababa ang kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nang sabay-sabay” upang idiin ang iisang pagkakataon, “nabubuhay pa” upang gawing malinaw ang kontekstuwal na diwa ng μένω, at “natulog na” upang mapanatili ang talinghaga ng orihinal.
