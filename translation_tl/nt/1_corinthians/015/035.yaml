translation:
  language: tl
  text: Ngunit may magsasabi[a], “Paano bubuhaying muli ang mga patay, at sa anong uri ng katawan sila darating?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Paano muling mabubuhay ang mga patay?” Balintiyak ang pandiwang Griyego, na literal na “ay ibinabangon” o “ay binubuhay,” at maaaring magpahiwatig na ang Diyos ang kumikilos.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀλλὰ
  choice: Ngunit
  rationale: Nagpapahiwatig ng salungat na paglipat tungo sa isang inaasahang tanong o pagtutol; natural at marangal sa modernong Filipino.
- source_word: ἐρεῖ τις
  choice: may magsasabi
  rationale: Pinananatili ang anyong panghinaharap at ang di-tiyak na tinutukoy, habang natural na ipinakikilala ang isang haka-hakang tagapagtanong.
- source_word: Πῶς ἐγείρονται οἱ νεκροί
  choice: Paano bubuhaying muli ang mga patay
  rationale: Ang “bubuhaying muli” ay nagpapanatili sa balintiyak na anyo ng ἐγείρονται at sa pahiwatig na may kumikilos na tagabuhay, nang hindi tahasang pinapangalanan ang Diyos.
- source_word: ποίῳ ... σώματι
  choice: anong uri ng katawan
  rationale: Ipinahahayag ang kwalitatibong diwa ng ποίῳ—hindi lamang kung anong katawan, kundi kung anong uri nito.
- source_word: δὲ
  choice: at
  rationale: Payak na iniuugnay ang ikalawang tanong sa una; walang kailangang matinding salungatan dito.
- source_word: ἔρχονται
  choice: ang taglay nila pagdating nila
  rationale: Pinananatili ang diwa ng “pagdating” sa ἔρχονται, habang ginagawang malinaw at natural sa Filipino ang kaugnayan nito sa katawan.
theological_decisions:
- issue: Pananalita at ahensiya sa muling pagkabuhay
  choice: Paano bubuhaying muli ang mga patay
  alternative: Paano muling mabubuhay ang mga patay
  rationale: Pinananatili ng napiling salin ang balintiyak na anyo ng Griyego at ang posibleng pahiwatig ng banal na ahensiya, nang hindi ginagawang tahasan ang hindi tahasang sinabi ng talata.
- issue: Kahulugan ng pagdating na may katawan
  choice: anong uri ng katawan ang taglay nila pagdating nila
  alternative: sa anong uri ng katawan sila darating
  rationale: Ang napiling ayos ay mas natural sa Filipino ngunit pinananatili ang ἔρχονται bilang “pagdating,” sa halip na ipakahulugang “paglitaw” o ulitin lamang ang “bubuhayin.”
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “bubuhaying muli” upang mapanatili ang balintiyak na anyo, at “anong uri ng katawan” upang maipakita ang kwalitatibong lakas ng ποίῳ.
