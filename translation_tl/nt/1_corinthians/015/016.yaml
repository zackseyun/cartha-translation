  yaml_path: translation/nt/1_corinthians/015/016.yaml
  text: For if the dead are not raised[a], not even Messiah has been raised.
translation:
  language: tl
  text: Sapagkat kung hindi muling binubuhay ang mga patay, kahit ang Mesiyas[a] ay hindi muling binuhay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “Cristo.” Ang titulong Griyego na Χριστός ay maaaring isaling “Mesiyas” o, ayon sa matagal nang tradisyon, “Cristo.”'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Sapagkat kung
  rationale: Pinananatili nito ang kondisyon ng εἰ at ang nagpapaliwanag na daloy ng γάρ sa argumento ni Pablo.
- source_word: νεκροὶ
  choice: ang mga patay
  rationale: Ang pangmaramihang pang-uri ay ginagamit bilang pangngalan at tumutukoy sa mga taong namatay sa pangkalahatan.
- source_word: οὐκ ἐγείρονται
  choice: hindi muling binubuhay
  rationale: Ang anyong balintiyak ay pinananatili, at nililinaw ng “muling” ang konteksto ng pagkabuhay mula sa kamatayan nang hindi ginagawang tahasang paksa ang Diyos.
- source_word: οὐδὲ
  choice: kahit … ay hindi
  rationale: 'Likas nitong ipinahahayag sa Tagalog ang mariing bunga: kung walang pagbuhay sa mga patay, maging ang Mesiyas ay hindi binuhay.'
- source_word: Χριστὸς
  choice: ang Mesiyas
  rationale: Isinasalin ang titulong Griyego ayon sa kahulugan nitong “Pinahiran,” sa halip na ituring lamang bilang personal na pangalan.
- source_word: ἐγήγερται
  choice: ay hindi muling binuhay
  rationale: Pinananatili ang balintiyak at ang natapos na pagkilos na may nananatiling bunga; sa kontekstong ito, ang payak na aspektong Tagalog ay natural na naghahatid ng diwang iyon.
theological_decisions:
- issue: Paglalahad sa Χριστός sa argumento tungkol sa muling pagkabuhay
  choice: ang Mesiyas
  alternative: ang Cristo
  rationale: Ang Χριστός ay may malinaw na lakas bilang titulo rito. Pinananatili ng “Mesiyas” ang kahulugan ng titulo, habang ang tradisyonal na “Cristo” ay ibinibigay bilang lehitimong alternatibo sa talababa.
- issue: Tagaganap ng pagbuhay sa mga patay
  choice: 'balintiyak: “muling binubuhay/binuhay”'
  alternative: tahasang “binubuhay ng Diyos”
  rationale: Hindi tahasang pinangalanan ng talata ang tagaganap, kaya hindi ito idinaragdag kahit ipinahihiwatig ng mas malawak na konteksto na Diyos ang bumubuhay.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “muling binubuhay” upang maging likas ang pahayag tungkol sa pagkabuhay mula sa kamatayan, habang pinananatili ang balintiyak at ang mariing lohika ng pangungusap.
