base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/039.yaml
  text: Not all flesh is the same flesh[a], but one kind is of humans, another flesh of animals, another of birds[b], and another of fish.
translation:
  language: tl
  text: Hindi pare-pareho ang lahat ng laman.[a] Ngunit iba ang laman ng mga tao, iba ang laman ng mga hayop,[b] iba ang laman ng mga ibon, at iba ang laman ng mga isda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Hindi iisa ang uri ng laman.”
    reason: Mas idyomatikong pagpapahayag ng pagkakaiba-iba ng mga uri na ipinahihiwatig ng Griyego.
  - marker: b
    text: O “mga alagang hayop.”
    reason: Ang κτηνῶν ay maaaring tumukoy nang mas partikular sa mga hayop na inaalagaan o domestikado.
lexical_decisions:
- source_word: σὰρξ
  choice: laman
  rationale: Literal ang gamit dito at tumutukoy sa pisikal na laman ng iba’t ibang nilalang, hindi sa makasalanang pagkatao. Pinananatili ng “laman” ang konkretong diwa ng salita.
- source_word: οὐ πᾶσα σὰρξ ἡ αὐτὴ σάρξ
  choice: Hindi magkakapareho ang lahat ng laman
  rationale: Natural ito sa makabagong Tagalog at pinananatili ang pag-uulit ng “laman” at ang paghahambing ng magkakaibang kategorya.
- source_word: ἄλλη
  choice: ibang uri
  rationale: Ipinahihiwatig ng ἄλλη ang pagkakaiba ayon sa kategorya. Nililinaw ng “ibang uri” ang serye nang hindi ginagawang magkaibang sangkap o kalikasan ang tinutukoy.
- source_word: ἀνθρώπων
  choice: mga tao
  rationale: Tumutukoy ito sa sangkatauhan sa pangkalahatan, hindi lamang sa mga lalaking nasa hustong gulang.
- source_word: κτηνῶν
  choice: mga hayop
  rationale: Sapat na malawak at karaniwan ang “mga hayop” para sa listahan, bagaman maaaring higit na partikular na tumukoy ang salita sa mga alagang hayop; inilagay ang alternatibo sa talababa.
- source_word: πτηνῶν
  choice: mga ibon
  rationale: Ang “mga ibon” ang likas at angkop na tawag sa kategoryang ito ng mga lumilipad na nilalang sa konteksto.
- source_word: ἰχθύων
  choice: mga isda
  rationale: Ito ang tuwiran at karaniwang katumbas sa Tagalog.
theological_decisions:
- issue: Kahulugan ng σάρξ sa konteksto ng muling pagkabuhay
  choice: Literal na “laman”
  alternative: “katawan” o metaporikal na “makasalanang pagkatao”
  rationale: Inihahambing ni Pablo rito ang pisikal na laman ng mga nilalang. Walang batayan sa konteksto upang gawing metapora ito para sa kasalanan, at ang “katawan” ay magpapalabo sa sadyang paggamit ng σάρξ.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “laman” upang mapanatili ang literal na bokabularyo ni Pablo, ngunit ginamit ang “ibang uri” sa listahan upang maging natural at malinaw ang paghahambing sa Tagalog.
