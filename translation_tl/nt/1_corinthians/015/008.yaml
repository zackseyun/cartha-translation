  text: And last of all[a], as to one untimely born, he appeared also to me.
translation:
  language: tl
  text: At pinakahuli sa lahat, nagpakita rin siya sa akin, na para bang ako’y isang ipinanganak nang wala sa panahon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “sa isang sanggol na nalaglag” o “sa isang sanggol na ipinalaglag.” Gumamit si Pablo ng isang matindi at mapagpakumbabang paglalarawan sa sarili.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσχατον δὲ πάντων
  choice: At sa kahuli-hulihan
  rationale: Ipinagpapatuloy ng δέ ang talaan, at ang ἔσχατον πάντων ay nagsasaad na ang pagpapakita kay Pablo ang pinakahuli sa pagkakasunod-sunod ng mga binanggit.
- source_word: ὡσπερεὶ
  choice: na para bang
  rationale: Pinananatili nito ang pahambing at bahagyang nagpapalambot na diwa ng kataga nang hindi ginagawang tahasang literal ang larawan.
- source_word: τῷ ἐκτρώματι
  choice: sa isang ipinanganak nang wala sa panahon
  rationale: Likas at nauunawaang Filipino ito na nagpapanatili sa diwa ng di-karaniwan at kahiya-hiyang kapanganakan; inilalagay sa talababa ang mas literal at mas matinding kahulugan ng salita.
- source_word: ὤφθη
  choice: nagpakita siya
  rationale: Sa konteksto ng mga pagpapakita ng muling nabuhay na Cristo, malinaw at natural na katumbas ng pasibong anyong Griyego ang pandiwang 'nagpakita.'
- source_word: κἀμοί
  choice: rin ... sa akin
  rationale: Pinananatili ng 'rin' ang pandagdag na diwa ng καί at isinasama si Pablo sa hanay ng mga pinagpakitaan.
theological_decisions:
- issue: Ang matinding paglalarawan ni Pablo sa sarili sa salitang ἐκτρώματι
  choice: Gamitin sa pangunahing teksto ang 'isang ipinanganak nang wala sa panahon,' na may mas literal na paliwanag sa talababa.
  alternative: isang nalaglag na sanggol; isang sanggol na ipinalaglag; isang ipinanganak sa di-karaniwang paraan
  rationale: Hindi tiyak sa talata ang eksaktong saklaw ng metapora. Pinananatili ng salin ang pagpapakababa at pagiging di-karaniwan nito nang hindi ipinapasok ang isang partikular na paliwanag tungkol sa pagiging apostol ni Pablo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ang 'kahuli-hulihan' ay natural sa talaang pasalaysay, samantalang ang talababa ay nagpapanatili sa nakagigitlang literal na puwersa ng ἔκτρωμα.
