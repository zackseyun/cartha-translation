  source_fidelity: Maayos na naihahatid ng draft ang pagkakasunod-sunod ng mga pagpapakita, ang pandagdag na «rin», at ang mapagpakumbabang metapora ng ἐκτρώματι. Gayunman, ang “na para bang sa isang …” ay hindi ganap na malinaw ang pagkakaugnay sa Filipino; dapat tahasang iugnay ang paghahambing kay Pablo mismo.
  naturalness: Natural ang “pinakahuli sa lahat” at “nagpakita rin siya sa akin.” Mas malinaw at mas likas ang “na para bang ako’y isang …” kaysa sa nakabiting pariralang “na para bang sa isang …” pagkatapos ng “sa akin.”
  terminology: Ang “ipinanganak nang wala sa panahon” ay katanggap-tanggap na pangunahing salin para sa metapora, kung may talababa na nagsasaad ng mas mariin at literal na diwa. Ang talababa ay dapat iwasang ipakahulugan ang ἐκτρώμα bilang tiyak na sinadyang pagpapalaglag lamang; ang “nalaglag” ay mahalagang literal na alternatibo.
