  source_fidelity: 'Tapat ang salin sa pangunahing diwa at anyo ng Griyego: ang καθ’ ἡμέραν ay “Araw-araw,” ang ἀποθνῄσκω ay nananatiling matingkad na “namamatay,” at ang νὴ ay naipapahayag bilang panunumpang “saksi ang.” Ang “pagmamalaki ko sa inyo na taglay ko sa Mesiyas na si Jesus” ay isang makatuwirang pagbasa ng sintaktikong malabong τὴν ὑμετέραν καύχησιν, ἣν ἔχω ἐν Χριστῷ Ἰησοῦ. Napananatili rin sa talababa ang alternatibong pagbasa.'
