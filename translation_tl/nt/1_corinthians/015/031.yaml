id: 1CO.15.31
reference: 1 Corinthians 15:31
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καθ’ ἡμέραν ἀποθνῄσκω, νὴ τὴν ὑμετέραν ⸀καύχησιν, ἣν ἔχω ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/031.yaml
  text: I die every day—by the boasting in you that I have in Messiah Jesus our Lord[a][b][c].
translation:
  language: tl
  text: Araw-araw akong namamatay[a]—saksi ang pagmamalaki ko sa inyo na taglay ko sa Mesiyas na si Jesus, ang ating Panginoon.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Bawat araw ay namamatay ako.”'
    reason: lexical_alternative
  - marker: b
    text: O “Kung paanong tiyak ang pagmamalaki ko sa inyo”; maaari ring unawain na “saksi ang inyong pagmamalaki.” Ang Griyegong pananalita ay tulad ng isang panunumpa, at pinagtatalunan ang pagkakaugnay ng parirala tungkol sa pagmamalaki.
    reason: alternative_reading
  - marker: c
    text: 'Tradisyonal na salin: “Cristo Jesus.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: Araw-araw
  rationale: Likas at malinaw na salin ng idyomang nangangahulugang “bawat araw” o “araw-araw,” habang pinananatili ang paulit-ulit na diwa.
- source_word: ἀποθνῄσκω
  choice: akong namamatay
  rationale: Pinananatili ang matingkad na pangkasalukuyang pahayag ni Pablo. Ang “nahaharap ako sa kamatayan” ay posibleng paliwanag ngunit mas interpretatibo.
- source_word: νὴ
  choice: saksi ang
  rationale: Ipinahihiwatig nito sa natural na Filipino ang mariing, panunumpang gamit ng partikula nang hindi ginagawang karaniwang sanhi lamang ang kasunod na parirala.
- source_word: τὴν ὑμετέραν καύχησιν
  choice: ang pagmamalaki ko sa inyo
  rationale: Maaaring tumukoy ang καύχησις sa pagmamalaki o batayan ng pagmamalaki. Dahil sa kasunod na “na taglay ko,” malamang na pagmamalaki ni Pablo tungkol sa mga taga-Corinto ang tinutukoy, ngunit inilalahad sa talababa ang tunay na sintaktikong kalabuan.
- source_word: ἣν ἔχω
  choice: na taglay ko
  rationale: Tuwirang ipinapahayag ang pag-aangkin sa kamag-anak na sugnay at mas malinaw ang kaugnayan nito sa “pagmamalaki.”
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: sa Mesiyas na si Jesus
  rationale: Isinasalin ang Χριστός bilang titulong “Mesiyas” at ang Ἰησοῦ bilang pangalang Jesus. Pinananatili ng “sa” ang mahalagang wikang Paulino ng pagiging nakaugnay sa Mesiyas.
- source_word: τῷ κυρίῳ ἡμῶν
  choice: ang ating Panginoon
  rationale: Natural at marangal na salin ng appositional na titulo at panghalip na paari.
theological_decisions:
- issue: Kung titulo o anyong parang pangalan ang Χριστῷ
  choice: Mesiyas na si Jesus
  alternative: Cristo Jesus
  rationale: May malinaw na puwersa bilang titulo ang Χριστός; kaya isinalin ito bilang “Mesiyas,” habang inilalagay sa talababa ang tradisyonal na anyo.
- issue: Kung kanino o tungkol kanino ang καύχησις na may ὑμετέραν
  choice: pagmamalaki ni Pablo sa mga taga-Corinto
  alternative: inyong pagmamalaki
  rationale: Mas pinapaboran ng “na taglay ko” ang pagmamalaking taglay ni Pablo tungkol sa kanila, ngunit hindi lubos na tiyak ang konstruksyon kaya pinananatili sa talababa ang kabilang pagbasa.
- issue: Puwersa ng νὴ at ugnayan nito sa pariralang tungkol sa pagmamalaki
  choice: 'panunumpang pahayag: “saksi ang”'
  alternative: “tunay nga, sa pamamagitan ng” o “kung paanong tiyak ang pagmamalaki ko sa inyo”
  rationale: Ang νὴ ay ginagamit sa mariing pagpapatunay o panunumpa. Ang eksaktong sintaktikong ugnayan ng kasunod na accusative phrase ay pinagtatalunan, kaya hindi ito tahimik na nilulutas.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “saksi ang” bilang likas na pananalitang panunumpa; pinanatili ang matinding “namamatay” sa halip na ipaliwanag bilang pagharap lamang sa panganib. Isinalin ang titulong Χριστός bilang “Mesiyas,” at inilantad sa mga talababa ang sintaktikong kalabuan.
