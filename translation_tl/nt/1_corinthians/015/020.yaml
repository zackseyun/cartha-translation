id: 1CO.15.20
reference: 1 Corinthians 15:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Νυνὶ δὲ Χριστὸς ἐγήγερται ἐκ νεκρῶν, ἀπαρχὴ τῶν ⸀κεκοιμημένων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/020.yaml
  text: But now Messiah has been raised from the dead[c][b][a], the firstfruits of those who have fallen asleep.
translation:
  language: tl
  text: Ngunit ngayon, ibinangon na mula sa mga patay ang Mesiyas[a], ang unang bunga[b] ng mga nakatulog na[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “si Cristo.” Ang “Mesiyas” at “Cristo” ay kapwa tumutukoy sa Pinahiran.
    reason: alternative_reading
  - marker: b
    text: Ang “unang bunga” ay ang unang bahagi ng ani na inihahandog sa Diyos; ipinahihiwatig nitong susunod pa ang buong ani.
    reason: cultural_note
  - marker: c
    text: Ang “mga nakatulog na” ay isang metapora para sa mga namatay, lalo na sa konteksto ng muling pagkabuhay.
    reason: lexical_alternative
lexical_decisions:
- source_word: Νυνὶ δὲ
  choice: Ngunit ngayon
  rationale: Ipinapakita ang mariing pagsalungat at pagwawasto sa naunang palagay na walang muling pagkabuhay.
- source_word: Χριστὸς
  choice: ang Mesiyas
  rationale: Isinalin bilang titulo upang maipahayag ang kahulugan ng Χριστός bilang ang Pinahiran, sa halip na ituring lamang itong pangalan.
- source_word: ἐγήγερται
  choice: ibinangon na
  rationale: Pinananatili ng anyong pasibo ang hindi tahasang binanggit na kumilos, samantalang ipinahihiwatig ng “na” ang naganap nang pagkilos at nananatiling bunga nito.
- source_word: ἐκ νεκρῶν
  choice: mula sa mga patay
  rationale: Likas na salin sa Filipino ng pariralang tumutukoy sa pagbangon mula sa kalagayan at hanay ng mga patay.
- source_word: ἀπαρχὴ
  choice: ang unang bunga
  rationale: 'Pinananatili ang larawang pang-ani at panghandog: ang unang bahagi ng ani na nagpapahiwatig na susunod ang kabuuan.'
- source_word: τῶν κεκοιμημένων
  choice: ng mga nakatulog na
  rationale: Pinananatili ang metapora ng pagtulog para sa kamatayan, na mahalaga sa konteksto ng muling pagkabuhay.
theological_decisions:
- issue: Tinig at ahensiya sa muling pagkabuhay
  choice: ibinangon na
  alternative: muling nabuhay na
  rationale: Pinananatili ang pasibong anyo ng Griyego nang hindi tahasang pinapangalanan ang kumilos.
- issue: Pagsasalin sa titulong Χριστός
  choice: ang Mesiyas
  alternative: si Cristo
  rationale: Ipinakikita rito ang titulong teolohikal at kinatawang papel ng Χριστός; inilalagay sa talababa ang nakaugaliang anyong “Cristo.”
- issue: Metapora ng pagtulog
  choice: mga nakatulog na
  alternative: mga namatay na
  rationale: Hindi pinapawi ang metapora ng orihinal, lalo na dahil nakaugnay ito sa pag-asang muling pagkabuhay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasan ang mga arkaikong anyo gaya ng “nangatutulog,” habang pinanatili ang larawan ng unang bunga at pagtulog.
