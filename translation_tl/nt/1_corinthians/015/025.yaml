base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/025.yaml
  text: For he must reign until he has put all his enemies under his feet[a][b].
translation:
  language: tl
  text: Sapagkat kailangan niyang maghari hanggang sa mailagay niya ang lahat ng kanyang mga kaaway sa ilalim ng kanyang mga paa[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “hanggang sa ilagay niya ang lahat ng kanyang mga kaaway sa ilalim ng kanyang mga paa.” Hindi hinihingi ng pananalitang Griyego ang malinaw na pagkakaiba sa aspekto sa pagitan ng dalawang saling ito.'
    reason: lexical_alternative
  - marker: b
    text: Ang larawang ang mga kaaway ay inilalagay “sa ilalim ng kanyang mga paa” ay biblikal na sagisag ng lubos na pagpapasakop. Ihambing ang Awit 110:1.
    reason: cross_reference
lexical_decisions:
- source_word: δεῖ
  choice: kailangan
  rationale: Ipinahahayag nito ang pangangailangan o tiyak na katuparan sa layunin ng Diyos. Likas at tuwiran sa makabagong Filipino ang “kailangan.”
- source_word: γὰρ
  choice: Sapagkat
  rationale: Nagbibigay ito ng paliwanag o batayan para sa naunang pahayag. Pinananatili ng “Sapagkat” ang malinaw na ugnayang lohikal.
- source_word: αὐτὸν βασιλεύειν
  choice: siyang maghari
  rationale: Bagaman akusatibo ang αὐτόν bilang simuno ng pawatas sa Griyego, natural itong ipinapahayag sa Filipino bilang “kailangan siyang maghari.” Pinananatili ng “maghari” ang diwa ng pamamahala bilang hari.
- source_word: ἄχρι οὗ
  choice: hanggang sa
  rationale: Tumutukoy ito sa hangganan sa panahon nang hindi kusang nagpapahiwatig na titigil ang paghahari pagkatapos ng puntong iyon.
- source_word: θῇ
  choice: mailagay
  rationale: Ang pandiwa ay mula sa τίθημι, “ilagay.” Ginamit ang “mailagay” upang natural na ipahayag ang inaasahang ganap na pagpapasakop at upang hindi sapilitang pangalanan ang di-hayag na gumagawa ng kilos sa sugnay na Griyego.
- source_word: πάντας τοὺς ἐχθροὺς
  choice: ang lahat ng kanyang kaaway
  rationale: Malinaw na ipinapahayag ng “lahat” ang kabuuan ng mga sumasalungat. Natural sa Filipino ang pang-isahang anyong “kaaway” pagkatapos ng “lahat ng.”
- source_word: ὑπὸ τοὺς πόδας αὐτοῦ
  choice: sa ilalim ng kanyang mga paa
  rationale: Tuwirang pinananatili ang biblikal na larawan ng lubos na pagpapasakop, na umaalingawngaw sa Awit 110:1.
theological_decisions:
- issue: Pansamantalang bisa ng ἄχρι οὗ (“hanggang sa”)
  choice: Isinalin bilang “hanggang sa” nang hindi ipinahihiwatig na matatapos ang paghahari ng Mesiyas kapag napasuko na ang mga kaaway.
  alternative: Isang saling tahasang nagsasabing titigil ang kanyang paghahari pagkatapos mapasuko ang mga kaaway.
  rationale: Itinatakda ng Griyego ang puntong inaabot ng kilos na tinatalakay, ngunit hindi nito sa sarili lamang sinasabi kung magpapatuloy o titigil ang paghahari pagkatapos noon.
- issue: Di-hayag na tagagawa ng θῇ
  choice: Ginamit ang “mailagay” upang hindi tahasang tukuyin kung sino ang naglalagay sa mga kaaway sa ilalim ng kanyang mga paa.
  alternative: “ilagay niya,” na tahasang itinuturing ang Mesiyas bilang tagagawa ng kilos.
  rationale: Walang hayag na simuno ang θῇ sa sugnay na Griyego. Maaaring iugnay ito sa Mesiyas, ngunit dahil sa alusyon sa Awit 110:1 maaari ring maunawaan ang Diyos bilang tagagawa; pinananatili ng salin ang posibilidad na ito nang hindi nilulutas ang tunay na tensiyon.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang tradisyonal at nakikilalang larawang “sa ilalim ng kanyang mga paa,” habang iniwasan ang sobrang teknikal o denominasyonal na pananalita.
