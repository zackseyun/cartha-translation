  verdict: revise
  source_fidelity: Tumpak na naipapahayag ng draft ang kinakailangang pagbabago at ang magkatambal na kaibhan ng φθαρτός/ἀφθαρσία at θνητός/ἀθανασία. Gayunman, ang “namamatay” ay mas karaniwang nangangahulugang kasalukuyang namamatay kaysa sa θνητός, na tumutukoy sa pagiging saklaw ng kamatayan. Mas tumpak ang “may kamatayan.”
  naturalness: Medyo mabigat ang ayos na “kailangang magbihis ng … ang katawang ito.” Mas malinaw at mas natural sa modernong Filipino na ilagay muna ang katawan bilang paksa. Ang “magsuot ng” ay isang likas na paraan upang mapanatili ang metapora ng ἐνδύσασθαι.
  terminology: Pinalitan ang “pagiging di-nasisira” ng “kawalang-kasiraan,” na mas maigsi, natural, at malinaw na katapat ng pagiging nasisira. Pinanatili ang “kawalang-kamatayan.” Ang “katawan” ay nananatiling isang kontekstuwal na paglilinaw at maayos na itinatala sa talababa.
  issues:
