    issue: Ang “katawang ito na namamatay” ay hindi ganap na katumbas ng θνητὸν τοῦτο.
    rationale: Ang θνητός ay “mortal,” o saklaw ng kamatayan; ang “namamatay” ay maaaring magpahiwatig na kasalukuyang nasa proseso ng pagkamatay. Ang “katawang ito na may kamatayan” ay mas tumpak.
  - severity: low
    issue: Medyo hindi likas ang ayos at pariralang “magbihis ng pagiging di-nasisira.”
    rationale: Bagaman nauunawaan, mas malinaw ang paksa-unang ayos at mas likas ang “magsuot ng kawalang-kasiraan,” habang napapanatili ang metapora ng pagsusuot.
