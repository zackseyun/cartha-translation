base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/053.yaml
  text: For this perishable body must put on imperishability[a], and this mortal body must put on immortality.
translation:
  language: tl
  text: Sapagkat ang katawang ito na nasisira[a] ay kailangang magsuot ng kawalang-kasiraan, at ang katawang ito na may kamatayan ay kailangang magsuot ng kawalang-kamatayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas pormal na salin: “Sapagkat itong nasisira ay kailangang magsuot ng kawalang-kasiraan, at itong may kamatayan ay kailangang magsuot ng kawalang-kamatayan.” Hindi tahasang binabanggit sa Griyego ang salitang “katawan” sa talatang ito, ngunit malinaw ang tinutukoy mula sa konteksto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεῖ
  choice: kailangang
  rationale: Likas at malinaw na ipinapahayag sa Filipino ang kinakailangan at tiyak na pagbabagong tinutukoy ni Pablo.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na ugnayan ng talata sa naunang pahayag.
- source_word: τὸ φθαρτὸν τοῦτο
  choice: ang katawang ito na nasisira
  rationale: Ang φθαρτός ay tumutukoy sa pagiging saklaw ng pagkasira. Idinagdag ang “katawan” ayon sa malinaw na konteksto ng muling pagkabuhay, habang ipinahihiwatig sa talababa na wala itong tahasang katumbas sa Griyego.
- source_word: ἐνδύσασθαι
  choice: magbihis ng
  rationale: Pinananatili ang metapora ng pagsusuot sa isang maikli at madaling maunawaang anyo.
- source_word: ἀφθαρσίαν
  choice: pagiging di-nasisira
  rationale: Direktang pinananatili ang salungatan sa “nasasira” at iniiwasan ang mas malabo o teknikal na “kawalang-kabulukan.”
- source_word: καὶ
  choice: at
  rationale: Natural na pang-ugnay sa magkatulad na mga sugnay.
- source_word: τὸ θνητὸν τοῦτο
  choice: ang katawang ito na namamatay
  rationale: Ipinahahayag ang pagiging saklaw ng kamatayan; ang “katawan” ay nilinaw mula sa konteksto.
- source_word: ἀθανασίαν
  choice: kawalang-kamatayan
  rationale: Karaniwan at tumpak na katumbas ng kalagayang hindi na saklaw ng kamatayan.
theological_decisions:
- issue: Pagdaragdag ng “katawan” kahit walang σώμα sa mismong talata
  choice: Isinama ang “katawan” sa dalawang sugnay para luminaw ang tinutukoy ng mga pang-uring ginamit bilang pangngalan.
  alternative: “Itong nasisira ay kailangang magbihis ng pagiging di-nasisira, at itong namamatay ay magbihis ng kawalang-kamatayan.”
  rationale: Malinaw sa 1 Corinto 15:42–54 na ang paksa ay ang muling pagkabuhay at pagbabago ng katawan. Nililinaw lamang ng salin ang pahiwatig ng konteksto at hindi nagdaragdag ng hiwalay na doktrinal na pahayag.
- issue: Metapora ng pananamit sa ἐνδύσασθαι
  choice: Pinanatili bilang “magbihis ng.”
  alternative: “Mabalutan ng” o “taglayin.”
  rationale: Ang literal na metapora ng pagsusuot ay mahalagang bahagi ng paglalarawan ni Pablo at hindi kailangang palitan ng interpretatibong paraphrase.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang magkatugmang pagsalungat ng “nasisira/di-nasisira” at “namamatay/kawalang-kamatayan,” pati ang metapora ng pagbibihis.
