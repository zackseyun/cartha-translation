  text: σπείρεται σῶμα ψυχικόν, ἐγείρεται σῶμα πνευματικόν. ⸀Εἰ ἔστιν σῶμα ψυχικόν, ⸂ἔστιν καὶ⸃ πνευματικόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/044.yaml
  text: It is sown a natural body; it is raised a spiritual body. If there is a natural body[a], there is also a spiritual body.
translation:
  language: tl
  text: Inihahasik ang katawang likas; ibinabangon ang katawang espirituwal. Kung may katawang likas[a], mayroon ding katawang espirituwal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “katawang may kaluluwa” ... “katawang espirituwal.” Hindi inihahambing dito ni Pablo ang materyal na katawan at isang di-materyal na pag-iral, kundi ang katawang pinakikilos ng karaniwang buhay ng tao at ang katawang pinakikilos ng Espiritu.
    reason: lexical_alternative
lexical_decisions:
- source_word: σπείρεται
  choice: Inihahasik
  rationale: Pinananatili ang pangkasalukuyang anyong balintiyak at ang larawan ng paghahasik na ginamit ni Pablo sa kalapit na konteksto.
- source_word: σῶμα
  choice: katawan
  rationale: Ito ang tuwiran at karaniwang katumbas; tumutukoy rito sa katawan ng tao sa kamatayan at muling pagkabuhay.
- source_word: ψυχικόν
  choice: likas
  rationale: Ipinahahayag ang katawang nauugnay sa karaniwang buhay ng tao nang hindi ipinahihiwatig na masama o basta materyal lamang. Ang mas literal na 'makaluluwa' ay malabo at di-likas sa modernong Filipino.
- source_word: ἐγείρεται
  choice: binubuhay
  rationale: Sa konteksto ng muling pagkabuhay, natural sa Filipino ang 'binubuhay' at malinaw nitong ipinahahayag ang pagbabangon mula sa kamatayan; pinananatili rin ang anyong balintiyak.
- source_word: πνευματικόν
  choice: espirituwal
  rationale: 'Pinananatili ang terminolohiya at tunay na lawak ng πνευματικός: katawang itinatangi o pinakikilos ng Espiritu, hindi isang di-materyal na pag-iral.'
- source_word: Εἰ
  choice: Kung
  rationale: Pinananatili ang kondisyunal na anyo ng Griyego sa halip na ipakahulugang 'yamang' o 'sapagkat'.
- source_word: καὶ
  choice: din
  rationale: Malinaw na naghahayag ng pandagdag na ugnayan sa pagitan ng katawang likas at katawang espirituwal.
theological_decisions:
- issue: Ang kaibahan ng katawang likas at katawang espirituwal
  choice: Pinanatili ang kaibahan sa pagitan ng katawang nauugnay sa karaniwang buhay ng tao at katawang nauugnay sa Espiritu.
  alternative: Katawang pisikal laban sa katawang di-pisikal, o 'katawang makaluluwa' laban sa 'katawang espiritu.'
  rationale: Hindi ipinapantay ng konteksto ang espirituwal sa di-materyal. Parehong tinatawag na σῶμα ang dalawang kalagayan, kaya pinananatili ng salin ang diwa ng muling pagkabuhay ng katawan nang hindi nilulutas nang labis ang saklaw ng mga pang-uri.
- issue: Di-tahasang tagagawa sa ἐγείρεται
  choice: Ginamit ang balintiyak na 'binubuhay' nang hindi pinangalanan ang Diyos sa pangunahing teksto.
  alternative: Binubuhay ng Diyos.
  rationale: Bagaman ang Diyos ang malinaw na tagagawa sa mas malawak na teolohiya at konteksto, hindi siya tahasang pinangalanan sa sugnay na ito; pinananatili ng salin ang anyo at bahagyang di-pagtukoy ng Griyego.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinili ang 'likas' sa halip na teknikal at malabong 'makaluluwa'; ipinaliwanag ang literal na alternatibo sa talababa. Ginamit ang 'binubuhay' bilang natural na idyoma sa konteksto ng muling pagkabuhay.
