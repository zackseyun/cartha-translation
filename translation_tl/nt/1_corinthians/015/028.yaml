base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/028.yaml
  text: But when all things are subjected to him[a], then the Son himself will also be subjected to the one who subjected all things to him[b], so that God may be all in all.
translation:
  language: tl
  text: Ngunit kapag ang lahat ng bagay ay naipasakop na sa kanya[a], ang Anak mismo ay ipapasakop din sa nagpasakop ng lahat ng bagay sa kanya, upang ang Diyos ay maging lahat sa lahat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang lahat”; paulit-ulit na ginagamit sa Griyego ang “lahat ng bagay” (τὰ πάντα), na nagpapanatili sa pansansinukob na saklaw ng argumento ni Pablo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “ang Diyos ay maging lahat ng bagay sa bawat isa.” Siksik at malawak ang ekspresyong Griyego na πάντα ἐν πᾶσιν, kaya hindi nito tahasang nililinaw kung tao o bagay ang tinutukoy ng huling “lahat.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Ngunit kapag
  rationale: Ipinahahayag ng ὅταν ang panahong darating, samantalang ang δέ ay banayad na nag-uugnay at nagtatangi sa susunod na yugto ng argumento.
- source_word: ὑποταγῇ
  choice: ay naipasakop na
  rationale: Pinananatili nito ang pasibong diwa ng aorist subjunctive at natural na ipinakikita sa Filipino ang pagkaganap na inaasahan bago ang kasunod na pangyayari.
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Tumutukoy sa Anak ayon sa konteksto at pinananatili ang direksiyon ng pagpapasakop.
- source_word: τὰ πάντα
  choice: ang lahat ng bagay
  rationale: Pinananatili ang inuulit na malawak at kosmikong saklaw ng neuter plural na parirala.
- source_word: τότε
  choice: '[ipinahihiwatig ng ayos ng pangungusap]'
  rationale: Sa Filipino, ang tahasang 'pagkatapos' ay hindi kailangang idagdag dahil malinaw na ipinahahayag ng sugnay na 'kapag ... na' ang temporal na pagkakasunod; iniiwasan nito ang mabigat at di-natural na pag-uulit.
- source_word: αὐτὸς ὁ υἱὸς
  choice: ang Anak mismo
  rationale: Ang 'mismo' ay natural na katumbas ng emphatic αὐτός at itinatampok ang Anak bilang persona.
- source_word: ὑποταγήσεται
  choice: ay pasasakop din
  rationale: Ang 'pasasakop' ay natural na Filipino na tumutugma sa hinaharap na passive form nang hindi ipinahihiwatig ang sapilitang paglaban; ang 'din' ay naglalahad ng kaugnayan nito sa naunang pangkalahatang pagpapasakop.
- source_word: τῷ ὑποτάξαντι
  choice: sa nagpasakop
  rationale: 'Maikli at malinaw na substantival na salin ng aorist active participle: ang gumawa ng pagpapasakop.'
- source_word: ἵνα ᾖ
  choice: upang ... ay maging
  rationale: Pinananatili ang layunin o kinalabasan na ipinahahayag ng ἵνα at subjunctive.
- source_word: ὁ θεὸς
  choice: ang Diyos
  rationale: Tuwirang salin ng nominative subject.
- source_word: πάντα ἐν πᾶσιν
  choice: lahat sa lahat
  rationale: Pinananatili ang siksik, malawak, at sadyang hindi ganap na tinutukoy na ekspresyon ni Pablo sa halip na paliitin ito sa mga tao lamang.
theological_decisions:
- issue: Ang pagpapasakop ng Anak sa Diyos
  choice: Tuwirang sabihing ang Anak mismo ay pasasakop sa nagpasakop ng lahat ng bagay sa kanya.
  alternative: Ipaliwanag sa teksto na ito ay tungkuling pagpapasakop lamang, o baguhin ang pananalita upang maiwasan ang anumang pagpapasakop.
  rationale: Malinaw na sinasabi ng Griyego ang panghinaharap na pagpapasakop ng Anak sa loob ng eskatolohikal na argumento. Hindi dapat bawasan ang pahayag o dagdagan ng mga teolohikal na paliwanag na wala sa talata.
- issue: Saklaw ng τὰ πάντα at πάντα ἐν πᾶσιν
  choice: Gamitin ang 'lahat ng bagay' at ang siksik na 'lahat sa lahat.'
  alternative: Gamitin ang 'lahat ng bagay sa bawat isa' o 'maging siyang lahat para sa lahat.'
  rationale: Ang paulit-ulit na πᾶς ay may komprehensibong saklaw. Ang mas tiyak na alternatibo ay maaaring magtakda nang labis kung mga tao, mga bagay, o iba pang kabuuan ang tinutukoy ng pangwakas na parirala.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang pag-uulit ng 'lahat ng bagay,' ang diin ng 'Anak mismo,' at ang teolohikal na tensiyon ng 'pasasakop.' Ginamit ang 'lahat sa lahat' sa pangwakas na parirala upang huwag paliitin ang tunay na ambiguwidad ng Griyego.
