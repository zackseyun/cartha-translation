  text: καὶ σώματα ἐπουράνια, καὶ σώματα ἐπίγεια· ἀλλὰ ἑτέρα μὲν ἡ τῶν ἐπουρανίων δόξα, ἑτέρα δὲ ἡ τῶν ἐπιγείων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/040.yaml
  text: And there are heavenly bodies and earthly bodies; but the glory of the heavenly is one kind[a], and the glory of the earthly is another.
translation:
  language: tl
  text: May mga katawang makalangit at may mga katawang makalupa[a]; ngunit iba ang kaluwalhatian ng mga makalangit, at iba naman ang kaluwalhatian ng mga makalupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga katawang selestiyal at terestriyal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σώματα
  choice: mga katawan
  rationale: Ang “katawan” ang tuwirang katumbas ng σῶμα at hindi nito nililimitahan kung mga bagay sa kalangitan, mga katawang muling binuhay, o iba pang uri ng katawang tinutukoy sa paghahambing.
- source_word: ἐπουράνια
  choice: makalangit
  rationale: Ang “makalangit” ay likas na katambal ng “makalupa” at pinananatili ang malawak na diwang nauukol o kabilang sa langit, nang hindi ito nililimitahan sa astronomiya.
- source_word: ἐπίγεια
  choice: makalupa
  rationale: Ang “makalupa” ay malinaw at kasalukuyang gamit para sa nauukol o kabilang sa lupa, at maayos na katapat ng “makalangit.”
- source_word: ἀλλὰ
  choice: ngunit
  rationale: Ipinahahayag ng “ngunit” ang payak na pagsalungat na minamarkahan ng ἀλλά habang pinananatili ang marangal na himig.
- source_word: ἑτέρα ... ἑτέρα
  choice: iba ... iba naman
  rationale: Ipinakikita ng pares na ito ang pagkakaiba ng uri o katangian, habang natural ang pag-uulit sa Filipino.
- source_word: δόξα
  choice: kaluwalhatian
  rationale: Pinananatili ng “kaluwalhatian” ang malawak na bokabularyong teolohikal ni Pablo, kasama ang agarang diwa ng ningning o karilagan, nang hindi ito pinakikitid sa pisikal na liwanag lamang.
- source_word: τῶν ἐπουρανίων ... τῶν ἐπιγείων
  choice: ng mga makalangit ... ng mga makalupa
  rationale: Sinusundan nito ang elipsis ng Griyego, na ang “mga katawan” ay nauunawaan mula sa unang sugnay, ngunit inuulit ang “kaluwalhatian” para sa likas at malinaw na daloy sa Filipino.
theological_decisions:
- issue: Ang tinutukoy ng “mga katawang makalangit” at “mga katawang makalupa”
  choice: Isinalin nang pangkalahatan bilang “mga katawang makalangit” at “mga katawang makalupa,” nang hindi nililimitahan ang tinutukoy.
  alternative: “mga katawan sa langit” at “mga katawan sa lupa,” o “mga nilalang sa langit” at “mga nilalang sa lupa”
  rationale: σώματα ang ginamit, hindi salitang tahasang nangangahulugang “mga nilalang.” Pinananatili ng salin ang paghahambing ni Pablo tungkol sa magkakaibang uri ng katawan at kaluwalhatian nang hindi ipinapasok ang isang tiyak na pagbasa tungkol sa mga anghel o mga bagay na astronomikal lamang.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Ginamit ang magkatambal na “makalangit” at “makalupa” upang mapanatili ang siksik at balanseng anyo ng Griyego; iniwasan ang teknikal na “selestiyal” at “terestriyal.”
