reference: 1 Corinthians 15:57
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τῷ δὲ θεῷ χάρις τῷ διδόντι ἡμῖν τὸ νῖκος διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/057.yaml
  text: But thanks be to God[a], who gives us the victory through our Lord Jesus the Messiah.
translation:
  language: tl
  text: Ngunit salamat sa Diyos, na nagbibigay sa atin ng tagumpay sa pamamagitan ng ating Panginoong Jesus, ang Mesiyas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tradisyonal na salin: “Jesu-Cristo.” Ang titulong Griego na Χριστός (Christos) ay nangangahulugang “Mesiyas.”'
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahahayag nito ang banayad na pagsalungat at paglipat mula sa pagtalakay sa kamatayan tungo sa pasasalamat.
- source_word: τῷ θεῷ χάρις
  choice: salamat sa Diyos
  rationale: Sa pormulang ito, ang χάρις ay pagpapahayag ng pasasalamat, hindi pagtukoy sa biyaya. Likas at marangal sa Filipino ang “salamat sa Diyos.”
- source_word: τῷ διδόντι
  choice: na nagbibigay
  rationale: Ang pangkasalukuyang participle ay naglalarawan sa Diyos bilang siyang patuloy o karaniwang nagbibigay.
- source_word: ἡμῖν
  choice: sa atin
  rationale: Tuwirang ipinapahayag ang tatanggap ng ibinibigay na tagumpay; sa konteksto, kabilang ang nagsasalita at ang mga mananampalataya.
- source_word: τὸ νῖκος
  choice: ang tagumpay
  rationale: Tumutukoy ito sa tiyak na tagumpay laban sa kamatayan na tinalakay sa mga naunang talata.
- source_word: διὰ
  choice: sa pamamagitan ng
  rationale: Kasama ng genitive, ipinahahayag ng διά ang paraan o tagapamagitan.
- source_word: τοῦ κυρίου ἡμῶν
  choice: ating Panginoon
  rationale: Pinananatili ang kristolohikal na titulong κύριος at ang panghalip na ἡμῶν; sa pangungusap, likas itong naging “ating Panginoong Jesus.”
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, ang Mesiyas
  rationale: Isinalin ang Χριστός bilang titulong “Mesiyas” sa halip na ituring lamang na bahagi ng pangalan. Ginamit ang appositive na anyo upang maging malinaw at natural sa Filipino.
theological_decisions:
- issue: Paglilipat ng Χριστοῦ sa pariralang Ἰησοῦ Χριστοῦ
  choice: “Jesus, ang Mesiyas” sa pangunahing teksto
  alternative: “Jesu-Cristo” o “Jesus Cristo”
  rationale: Ang Χριστός ay titulong nangangahulugang “Mesiyas.” Pinananatiling hayag ang kahulugan ng titulo, samantalang inilalagay sa talababa ang nakaugaliang anyo upang mapanatili ang pagiging pamilyar at masuri ang salin.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa pampublikong pagbasa. Pinanatili ang maikling himig ng pasasalamat at ang kasalukuyang diwa ng “nagbibigay.”
