id: 1CO.15.10
reference: 1 Corinthians 15:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: χάριτι δὲ θεοῦ εἰμι ὅ εἰμι, καὶ ἡ χάρις αὐτοῦ ἡ εἰς ἐμὲ οὐ κενὴ ἐγενήθη, ἀλλὰ περισσότερον αὐτῶν πάντων ἐκοπίασα, οὐκ ἐγὼ δὲ ἀλλὰ ἡ χάρις τοῦ θεοῦ ⸀ἡ σὺν ἐμοί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/010.yaml
  text: But by the grace of God I am what I am[a], and his grace toward me did not prove empty. On the contrary, I labored more than all of them—yet not I, but the grace of God that was with me.
translation:
  language: tl
  text: Ngunit dahil sa biyaya ng Diyos, ako ay kung ano ako. At ang biyaya niya sa akin ay hindi naging walang saysay[a]. Sa halip, nagpagal ako nang higit kaysa sa kanilang lahat—ngunit hindi ako, kundi ang biyaya ng Diyos na kasama ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “hindi naging hungkag” o “hindi nauwi sa wala.”
    reason: Ipinakikita ng κενός ang larawan ng pagiging hungkag at maaari ring mangahulugang walang bunga o walang kabuluhan.
lexical_decisions:
- source_word: χάριτι δὲ θεοῦ
  choice: Ngunit dahil sa biyaya ng Diyos
  rationale: Ang datibong χάριτι ay nagpapahayag ng batayan o paraang gumagawa sa kalagayan ni Pablo. Pinananatili ng “biyaya” ang pangunahing terminong teolohikal ni Pablo, at ipinahahayag ng “ngunit” ang banayad na pagsalungat ng δέ sa naunang konteksto.
- source_word: εἰμι ὅ εἰμι
  choice: ako ay kung ano ako
  rationale: Malapit nitong pinananatili ang mariing pag-uulit ng Griyego at hindi nililimitahan ang pahayag sa tungkulin, pagkatao, o katayuan lamang.
- source_word: ἡ χάρις αὐτοῦ ἡ εἰς ἐμὲ
  choice: ang biyaya niya sa akin
  rationale: Likas sa Tagalog ang “sa akin” at naipahahayag nito ang biyayang itinuon o ipinagkaloob kay Pablo.
- source_word: οὐ κενὴ ἐγενήθη
  choice: hindi naging walang saysay
  rationale: Naipahahayag nito na ang biyaya ay hindi nawalan ng bunga o kabuluhan, habang pinananatili sa talababa ang mas literal na larawang “hungkag.”
- source_word: ἀλλὰ περισσότερον αὐτῶν πάντων ἐκοπίασα
  choice: Sa halip, nagpagal ako nang higit kaysa sa kanilang lahat
  rationale: Ang “nagpagal” ay naghahatid ng mabigat at puspusang paggawa ng κοπιάω; ang “sa halip” ay malinaw na nagpapakita ng pagsalungat ng ἀλλά.
- source_word: οὐκ ἐγὼ δὲ ἀλλὰ ἡ χάρις τοῦ θεοῦ
  choice: ngunit hindi ako, kundi ang biyaya ng Diyos
  rationale: Pinananatili nito ang matinding pagwawasto ni Pablo sa sarili niyang pahayag nang hindi itinatanggi ang tunay niyang pagpapagal.
- source_word: ἡ σὺν ἐμοί
  choice: na kasama ko
  rationale: Tuwirang ipinahahayag ng “kasama ko” ang σύν na may datibo at iniuugnay ang parirala sa biyaya ng Diyos nang hindi dinaragdagan ang kahulugan.
theological_decisions:
- issue: Ugnayan ng pagpapagal ni Pablo at ng biyaya ng Diyos
  choice: Kapuwa pinagtitibay ang tunay na pagpapagal ni Pablo at ang mabisang pagkilos ng biyaya ng Diyos.
  alternative: Ipaliwanag ang pahayag bilang pantay na pagtutulungan ng Diyos at ni Pablo, o kaya’y bawasan ang katotohanan ng sariling pagpapagal ni Pablo.
  rationale: Tahasan sa Griyego na si Pablo ay “nagpagal,” ngunit agad din niyang sinasabing “hindi ako, kundi ang biyaya ng Diyos.” Pinananatili ng salin ang tensiyong ito sa halip na lutasin ayon sa isang sistemang teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinili ang “nagpagal” upang mapanatili ang diin sa puspusang paggawa, at ang bahagyang pormal na “ako ay kung ano ako” upang maingatan ang natatanging pag-uulit ng orihinal.
