    text: O “may ganap na katiyakan” o “may malaking katiyakan.” Hindi tahasang sinasabi ng Griyego kung kanino nakaugnay ang katiyakang ito.
    reason: lexical_alternative
  - marker: b
    text: O “kung ano kaming uri ng mga tao sa piling ninyo alang-alang sa inyo.”
    reason: lexical_alternative
  revision_rationale: The revision retains the draft’s sound terminology and the source’s ambiguity concerning the assurance, while correcting the unnatural expression for the missionaries’ demonstrated character. It also strengthens the connection introduced by καθώς, improves the parallel rhythm of the Greek prepositional phrases in natural Filipino, and places both footnote anchors at their relevant words.
