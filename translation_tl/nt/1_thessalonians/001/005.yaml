id: 1TH.1.5
reference: 1 Thessalonians 1:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτι τὸ εὐαγγέλιον ἡμῶν οὐκ ἐγενήθη εἰς ὑμᾶς ἐν λόγῳ μόνον ἀλλὰ καὶ ἐν δυνάμει καὶ ἐν πνεύματι ἁγίῳ ⸀καὶ πληροφορίᾳ πολλῇ, καθὼς οἴδατε οἷοι ἐγενήθημεν ⸀ἐν ὑμῖν δι’ ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/005.yaml
  text: because our gospel did not come to you in word only[a], but also in power and in the Holy Spirit and with great conviction[b], just as you know what kind of men we proved to be among you for your sake.
translation:
  language: tl
  text: sapagkat ang aming ebanghelyo ay dumating sa inyo hindi lamang sa salita kundi pati sa kapangyarihan, sa Espiritu Santo, at may lubos na katiyakan[a], gaya ng alam ninyo kung anong uri ng mga tao kami sa piling ninyo alang-alang sa inyo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “may ganap na katiyakan” o “may malaking katiyakan.” Hindi tahasang sinasabi ng Griyego kung kanino nakaugnay ang katiyakang ito.
    reason: lexical_alternative
  - marker: b
    text: O “kung ano kaming uri ng mga tao sa piling ninyo alang-alang sa inyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐαγγέλιον
  choice: ebanghelyo
  rationale: Karaniwan at tiyak na katawagang Filipino para sa apostolikong Mabuting Balita; pinananatili nito ang teknikal na diwa ng salita sa kontekstong Paulino.
- source_word: ἐγενήθη εἰς ὑμᾶς
  choice: dumating sa inyo
  rationale: Likas na katumbas sa Filipino ng idyomatikong pahayag tungkol sa pagdating at pagkilos ng ebanghelyo sa mga taga-Tesalonica.
- source_word: ἐν λόγῳ μόνον
  choice: hindi lamang sa salita
  rationale: Pinananatili ang paghahambing ng mensaheng binigkas lamang at ng pangangaral na may kasamang kapangyarihan at pagkilos ng Espiritu.
- source_word: ἐν δυνάμει
  choice: may kapangyarihan
  rationale: Mas natural sa Filipino kaysa sa literal na 'sa kapangyarihan' habang malinaw na pinananatili ang diin ng Griyego.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: sa Espiritu Santo
  rationale: Tumutukoy sa Espiritu Santo, gaya ng karaniwang gamit ni Pablo, hindi sa isang pangkalahatang espirituwal na kalagayan.
- source_word: πληροφορίᾳ πολλῇ
  choice: may lubos na katiyakan
  rationale: Inilalarawan ang kasaganaan o kapuspusan ng katiyakan nang hindi tahasang itinatakda kung ito ay nasa mga mangangaral, mga tagapakinig, o sa paraan ng pagdating ng ebanghelyo.
- source_word: καθὼς οἴδατε
  choice: Alam din ninyo
  rationale: Natural na Filipino na naghaharap sa sariling kaalaman ng mga mambabasa bilang pagpapatunay sa naunang pahayag.
- source_word: οἷοι ἐγενήθημεν
  choice: kung anong uri ng mga tao ang napatunayan naming maging
  rationale: Ipinahahayag ang nakitang pagkatao at asal nina Pablo at ng mga kasama niya; ang 'mga tao' ay mas likas at hindi nagdaragdag ng di-kailangang diin sa kasarian.
- source_word: ἐν ὑμῖν
  choice: sa piling ninyo
  rationale: Natural at marangal na pahayag para sa kanilang pamumuhay sa gitna ng mga taga-Tesalonica.
- source_word: δι’ ὑμᾶς
  choice: alang-alang sa inyo
  rationale: Pinakamalinaw na naghahayag ng kapakinabangan o layuning pastoral sa konteksto.
theological_decisions:
- issue: Tinutukoy ng πνεύματι ἁγίῳ
  choice: Espiritu Santo bilang banal na Espiritu ng Diyos
  alternative: isang banal na espiritu o espirituwal na kapangyarihan
  rationale: Sa gamit ni Pablo at sa paghahambing dito sa salita lamang, ang parirala ay pinakanatural na tumutukoy sa banal na pagkilos ng Espiritu Santo.
- issue: Saklaw ng πληροφορίᾳ πολλῇ
  choice: may lubos na katiyakan
  alternative: may matinding pananalig; may ganap na katiyakan
  rationale: Pinananatili ng salin ang pagiging hindi tahasang tinukoy ng Griyego kung kanino nakaugnay ang katiyakan, sa halip na paliitin ito sa damdamin lamang ng mga mangangaral o tagapakinig.
- issue: Paglalarawan sa mga misyonero sa οἷοι ἐγενήθημεν
  choice: kung anong uri ng mga tao ang napatunayan naming maging
  alternative: kung anong uri ng mga lalaki kami; kung paano kami namuhay
  rationale: Tumutukoy ito sa katangian at asal ng kilalang pangkat nina Pablo. Ang 'mga tao' ay tumpak sa sanggunian at natural sa Filipino, samantalang ang 'namuhay' ay mas interpretatibo.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang 'ebanghelyo' bilang pamilyar na terminong Kristiyano, habang iniwasan ang sobrang literal at alanganing ayos. Pinanatili ang hindi tiyak na saklaw ng 'katiyakan' sa pamamagitan ng talababa.
