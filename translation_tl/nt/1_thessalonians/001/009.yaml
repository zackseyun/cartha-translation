  text: αὐτοὶ γὰρ περὶ ἡμῶν ἀπαγγέλλουσιν ὁποίαν εἴσοδον ἔσχομεν πρὸς ὑμᾶς, καὶ πῶς ἐπεστρέψατε πρὸς τὸν θεὸν ἀπὸ τῶν εἰδώλων δουλεύειν θεῷ ζῶντι καὶ ἀληθινῷ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/009.yaml
  text: For they themselves report about us what kind of reception we had among you[a], and how you turned to God from idols to serve the living and true God[c][b],
translation:
  language: tl
  text: Sapagkat sila mismo ang nagbabalita tungkol sa amin kung anong uri ng pagdating namin sa inyo[a], at kung paano kayo bumaling sa Diyos mula sa mga diyos-diyosan upang maglingkod sa Diyos na buháy at tunay[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “kung anong uri ng pagpasok ang naging amin sa inyo.” Ang pananalitang Griego ay tumutukoy sa katangian at naging epekto ng pagdating namin sa kanila.
    reason: lexical_alternative
  - marker: b
    text: O, “kung paano kayo nagbalik-loob sa Diyos at tumalikod sa mga diyos-diyosan.”
    reason: alternative_reading
  - marker: c
    text: Ang “Diyos na buháy at tunay” ay itinatangi sa mga diyos-diyosang walang buhay; ihambing sa Jeremias 10:10.
    reason: cross_reference
lexical_decisions:
- source_word: αὐτοὶ
  choice: sila mismo
  rationale: 'Pinananatili nito ang pagbibigay-diin ng intensive pronoun: kusang nag-uulat ang ibang mga tao tungkol kina Pablo.'
- source_word: ἀπαγγέλλουσιν
  choice: nagbabalita
  rationale: Ipinahihiwatig ng pangkasalukuyang pandiwa ang patuloy na pagpaparating ng balita; natural ito sa modernong Tagalog.
- source_word: ὁποίαν εἴσοδον ἔσχομεν πρὸς ὑμᾶς
  choice: kung paano ninyo kami tinanggap nang dumating kami sa inyo
  rationale: Inihahayag nito sa natural na Tagalog ang uri, katangian, at naging epekto ng pagdating ng mga apostol, habang inilalagay sa talababa ang mas literal na anyo.
- source_word: πῶς ἐπεστρέψατε
  choice: kung paano kayo bumaling
  rationale: Pinananatili ang larawan ng pagtalikod sa isang direksiyon at pagharap sa iba, nang hindi ginagawang teknikal na terminong teolohikal ang pandiwa.
- source_word: πρὸς τὸν θεὸν ἀπὸ τῶν εἰδώλων
  choice: sa Diyos mula sa mga diyos-diyosan
  rationale: Kapuwa napapanatili ang patutunguhan ng pagbaling at ang pinanggalingan nito.
- source_word: εἰδώλων
  choice: mga diyos-diyosan
  rationale: Ito ang karaniwan at malinaw na katawagan sa Tagalog para sa mga idolong sinasamba.
- source_word: δουλεύειν
  choice: upang maglingkod
  rationale: Ang pandiwa ay mula sa larangan ng pagkaalipin at paglilingkod, ngunit sa kontekstong ito ay tumutukoy sa tapat na paglilingkod sa Diyos; hindi kailangang palalain bilang literal na pagkaalipin.
- source_word: θεῷ ζῶντι καὶ ἀληθινῷ
  choice: sa Diyos na buháy at tunay
  rationale: Malinaw nitong inilalarawan ang Diyos bilang buháy at tunay, salungat sa mga diyos-diyosang walang buhay at hindi tunay.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili nito ang paliwanag na ugnayan ng talata sa naunang pahayag.
theological_decisions:
- issue: Kalikasan ng pagbabalik-loob sa ἐπεστρέψατε πρὸς τὸν θεὸν ἀπὸ τῶν εἰδώλων
  choice: kung paano kayo bumaling sa Diyos mula sa mga diyos-diyosan
  alternative: kung paano kayo nagbalik-loob sa Diyos at tumalikod sa mga diyos-diyosan
  rationale: Ang aktibong anyo at metapora ng pagbaling ang pinananatili sa pangunahing teksto. Hindi nito ipinapasya sa pagsasalin ang mas malawak na pagtatalo tungkol sa pagkilos ng Diyos at pagtugon ng tao sa pagbabalik-loob.
- issue: Lakas ng δουλεύειν kaugnay ng Diyos
  choice: maglingkod
  alternative: maging alipin ng Diyos; sumamba
  rationale: Ipinapahayag ng konteksto ang tapat na paglilingkod at pagsamba bilang bagong katapatan sa Diyos. Ang “maglingkod” ay sapat na malawak upang mapanatili ang kahulugan nang hindi pinatitindi o pinakikitid ito.
- issue: Paglalarawan sa Diyos bilang ζῶντι καὶ ἀληθινῷ
  choice: Diyos na buháy at tunay
  alternative: buháy at tunay na Diyos
  rationale: Kapuwa posible sa Tagalog, ngunit ang napiling ayos ay natural at malinaw na nagtatangi sa Diyos mula sa mga diyos-diyosan nang hindi nagdaragdag ng doktrinal na paliwanag sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “diyos-diyosan” bilang pamilyar na panrelihiyong katawagan, “bumaling” upang mapanatili ang metapora ng orihinal, at “buháy” na may tuldik upang maiwasan ang maling basa.
