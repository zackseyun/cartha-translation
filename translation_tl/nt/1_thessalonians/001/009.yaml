    issue: Ang pangunahing teksto ay nagsasabing «kung paano ninyo kami tinanggap.»
    rationale: Ang ὁποίαν εἴσοδον ἔσχομεν πρὸς ὑμᾶς ay literal na tungkol sa uri ng kanilang pagdating o pagpasok sa mga mambabasa. Maaaring kasama sa konteksto ang naging pagtanggap at epekto nito, ngunit hindi ito dapat gawing tahasang kilos ng mga mambabasa sa pangunahing salin.
  - severity: low
    issue: Ang talababa a ay tumutukoy sa «pagdating nina Pablo,» samantalang ang unang panauhan na maramihan sa Griyego ay «namin.»
    rationale: Mas tumpak at hindi gaanong nagpapaliit ng tinutukoy ang «pagdating namin,» na sumasaklaw kay Pablo at sa kaniyang mga kasamang tagapangaral.
