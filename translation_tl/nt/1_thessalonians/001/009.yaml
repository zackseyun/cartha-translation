- from: Sapagkat sila mismo ang nagbabalita tungkol sa amin kung paano ninyo kami tinanggap nang dumating kami sa inyo[a], at kung paano kayo bumaling sa Diyos mula sa mga diyos-diyosan upang maglingkod sa Diyos na buháy at tunay[b][c].
  to: Sapagkat sila mismo ang nagbabalita tungkol sa amin kung anong uri ng pagdating namin sa inyo[a], at kung paano kayo bumaling sa Diyos mula sa mga diyos-diyosan upang maglingkod sa Diyos na buháy at tunay[b][c].
  rationale: Pinalitan ang interpretibong «kung paano ninyo kami tinanggap nang dumating kami sa inyo» ng «kung anong uri ng pagdating namin sa inyo.» Pinananatili nito ang bukas na saklaw ng ὁποίαν εἴσοδον—ang katangian, paraan, at epekto ng pagdating—nang hindi ipinapahayag bilang pangunahing diwa ang pagtanggap ng mga mambabasa. Inayon din ang talababa sa pangmaramihang «namin.»
