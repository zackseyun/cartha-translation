translation:
  language: tl
  text: Lagi kaming nagpapasalamat sa Diyos para sa inyong lahat, habang walang tigil naming binabanggit kayo sa aming mga panalangin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring iugnay ang “walang tigil” sa buong pahayag na “Lagi kaming nagpapasalamat sa Diyos para sa inyong lahat,” sa halip na partikular sa pagbanggit sa kanila sa mga panalangin.
    reason: Hindi tiyak sa ayos ng Griyego kung ang pang-abay na ἀδιαλείπτως ay tumutukoy lamang sa pagbanggit sa panalangin o sa mas malawak na pahayag ng pasasalamat.
lexical_decisions:
- source_word: Εὐχαριστοῦμεν
  choice: nagpapasalamat kami
  rationale: Ang kasalukuyang aktibong pandiwa sa unang panauhang maramihan ay likas na isinasalin sa Filipino bilang “nagpapasalamat kami,” at malinaw nitong ipinahahayag ang pasasalamat na iniuukol sa Diyos.
- source_word: τῷ θεῷ
  choice: sa Diyos
  rationale: Tinutukoy ng datibo ang pinag-uukulan ng pasasalamat; ang “sa Diyos” ang tuwiran at natural na katumbas.
- source_word: πάντοτε
  choice: lagi
  rationale: Ang “lagi” ay kasalukuyan, malinaw, at natural na katumbas ng temporal na diwa ng πάντοτε.
- source_word: περὶ πάντων ὑμῶν
  choice: para sa inyong lahat
  rationale: Ipinahahayag ng περί na may genitibo ang patungkol na diwa, samantalang pinananatili ng “inyong lahat” ang pagiging saklaw ng bawat kausap.
- source_word: μνείαν ποιούμενοι
  choice: kayong binabanggit
  rationale: Ang idyomang participyal ay literal na tumutukoy sa pagbanggit o pag-alaala sa panalangin. Mas tiyak sa kontekstong ito ang “binabanggit” kaysa sa mas malawak na “inaalala.”
- source_word: ἐπὶ τῶν προσευχῶν ἡμῶν
  choice: sa aming mga panalangin
  rationale: Natural na ipinahahayag sa Filipino ng “sa aming mga panalangin” ang pagbanggit na ginagawa habang nananalangin.
- source_word: ἀδιαλείπτως
  choice: walang tigil
  rationale: Pinananatili ng parirala ang malakas na retorikal na diwa ng patuloy at paulit-ulit na gawain, habang nananatiling natural sa modernong Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “lagi” at “walang tigil” upang maging malinaw sa karaniwang mambabasa, at pinanatili sa talababa ang tunay na kalabuan ng pagkakaugnay ng pang-abay sa Griyego.
