source:
  edition: SBLGNT
  text: καὶ ὑμεῖς μιμηταὶ ἡμῶν ἐγενήθητε καὶ τοῦ κυρίου, δεξάμενοι τὸν λόγον ἐν θλίψει πολλῇ μετὰ χαρᾶς πνεύματος ἁγίου,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/006.yaml
  text: And you became imitators of us and of the Lord[a], having received the word in much affliction with joy of the Holy Spirit,
translation:
  language: tl
  text: At kayo ay naging mga tumutulad sa amin at sa Panginoon nang tanggapin ninyo ang salita sa gitna ng matinding paghihirap, na may kagalakang mula sa Banal na Espiritu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “na may kagalakan ng Banal na Espiritu,” na maaaring mangahulugang kagalakang dulot ng Banal na Espiritu.
    reason: 'Pinananatili ang tunay na kalabuan ng genitive na πνεύματος ἁγίου: maaari itong unawain bilang pinagmulan o bilang kagalakang dulot ng Espiritu.'
lexical_decisions:
- source_word: μιμηταὶ
  choice: mga tumutulad
  rationale: Tuwirang pinananatili ang diwa ng paggaya o pagtulad sa isang halimbawa, sa halip na ang mas malawak na “mga tagasunod.”
- source_word: ἐγενήθητε
  choice: naging
  rationale: 'Ipinahahayag ang pagbabago ng kalagayan: sila ay naging mga taong tumutulad sa mga apostol at sa Panginoon.'
- source_word: τοῦ κυρίου
  choice: sa Panginoon
  rationale: Ang κύριος ay titulong tumutukoy rito kay Jesus; ang “Panginoon” ang likas at kinikilalang katumbas sa Filipino.
- source_word: δεξάμενοι
  choice: nang tanggapin ninyo
  rationale: Likas na inilalahad sa Filipino ang participle at iniuugnay ang pagtanggap sa salita sa kanilang pagiging mga tumutulad, nang hindi labis na tinutukoy kung temporal o paraan ang relasyon.
- source_word: τὸν λόγον
  choice: ang salita
  rationale: Pinananatili ang karaniwang bokabularyo ni Pablo para sa ipinahayag na mensahe, habang nananatiling malinaw sa konteksto.
- source_word: ἐν θλίψει πολλῇ
  choice: sa gitna ng matinding paghihirap
  rationale: Ipinahahayag ang matinding kapighatian o pagdurusa nang hindi ipinapasok ang posibleng eskatolohikal na pahiwatig ng “kapighatian” bilang teknikal na termino.
- source_word: μετὰ χαρᾶς
  choice: na may kagalakan
  rationale: Natural na Filipino para sa kasamang kagalakan habang tinatanggap nila ang salita.
- source_word: πνεύματος ἁγίου
  choice: mula sa Banal na Espiritu
  rationale: Inilalahad sa pangunahing teksto ang malamang na diwa ng pinagmulan ng kagalakan; pinananatili sa talababa ang mas pormal at hindi gaanong tiyak na ugnayang genitive.
theological_decisions:
- issue: Ugnayan ng genitive sa χαρᾶς πνεύματος ἁγίου
  choice: kagalakang mula sa Banal na Espiritu
  alternative: kagalakan ng Banal na Espiritu
  rationale: Malamang na inilalarawan ni Pablo ang Banal na Espiritu bilang pinagmulan ng kagalakan sa gitna ng paghihirap. Gayunman, hindi ganap na tinutukoy ng anyong Griyego ang relasyon, kaya pinananatili ang mas literal na posibilidad sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga tumutulad” upang mapanatili ang tahasang wika ng paggaya, at “matinding paghihirap” upang maging likas sa karaniwang mambabasa nang hindi nagdaragdag ng teknikal na kahulugan.
