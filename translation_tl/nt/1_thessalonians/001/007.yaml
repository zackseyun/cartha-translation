  text: so that you became an example to all the believers in Macedonia and in Achaia[a].
translation:
  language: tl
  text: kaya naging halimbawa kayo para sa lahat ng mananampalataya sa Macedonia at sa Acaya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “huwaran” o “modelo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: kaya
  rationale: Ipinahihiwatig nito ang bunga ng pagtanggap at pagtulad na binanggit sa naunang talata; natural sa modernong Tagalog ang “kaya.”
- source_word: γενέσθαι
  choice: naging
  rationale: Ang aorist infinitive sa konstruksyong ὥστε ay natural na naipahahayag sa Tagalog bilang pandiwang nagsasaad ng naging resulta.
- source_word: ὑμᾶς
  choice: kayo
  rationale: Tumutukoy ito sa mga taga-Tesalonica at malinaw na pinananatili ang pangmaramihang ikalawang panauhan.
- source_word: τύπον
  choice: halimbawa
  rationale: Sa kontekstong ito, tumutukoy ang τύπος sa huwarang maaaring tularan; “halimbawa” ang pinakanatural at madaling maunawaang salin, habang tunay ding posible ang “huwaran” o “padron.”
- source_word: πᾶσιν τοῖς πιστεύουσιν
  choice: sa lahat ng mananampalataya
  rationale: Substantibo ang gamit ng participle at tumutukoy sa lahat ng mga sumasampalataya; idiomatiko at maikli ang “mga mananampalataya.”
- source_word: ἐν τῇ Μακεδονίᾳ
  choice: sa Macedonia
  rationale: Tuwirang lokatibong parirala para sa rehiyon o lalawigang Romano.
- source_word: καὶ ἐν τῇ Ἀχαΐᾳ
  choice: at sa Acaia
  rationale: Pinananatili ang magkatimbang na pagtukoy sa ikalawang rehiyon at inuulit ang “sa” gaya ng paralelismo sa Griyego.
