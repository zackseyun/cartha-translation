translation:
  language: tl
  text: Alam namin, mga kapatid[a] na minamahal ng Diyos, ang pagkahirang sa inyo[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, panlalaking maramihan ang salita, ngunit sa mga liham ni Pablo madalas itong tumutukoy sa buong pamayanang sumasampalataya, mga lalaki at mga babae.
    reason: lexical_alternative
  - marker: b
