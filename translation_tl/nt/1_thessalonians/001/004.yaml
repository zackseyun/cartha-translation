  verdict: approve
  source_fidelity: Tumpak ang salin sa pangunahing mga bahagi ng Griyego. Ang “Alam namin” ay likas na paraan upang isalin ang participial na εἰδότες habang ipinagpapatuloy ang daloy mula sa naunang talata. Ang “mga kapatid na minamahal ng Diyos” ay wasto para sa ἀδελφοὶ ἠγαπημένοι ὑπὸ θεοῦ, at malinaw na naipapakita ng “ang pagkahirang sa inyo” na ang mga kausap ang saklaw ng ἐκλογὴν ὑμῶν, hindi ang mga pumipili.
  naturalness: Makabago, malinaw, at marangal ang Filipino. Natural ang “mga kapatid” bilang pagtawag sa isang kapulungan, at ang hulíng kuwit ay angkop dahil putol ng nagpapatuloy na pangungusap ang berso. Bagaman medyo pormal ang “pagkahirang,” ang pormalidad nito ay angkop sa rehistro at sa bigat ng terminong Griyego.
  terminology: Maayos ang “pagkahirang” bilang pangngalang katumbas ng ἐκλογή at hindi nito idinidikta ang anumang partikular na sistemang teolohikal. Ang “mga kapatid” ay tapat sa anyong panlalaking maramihan ng ἀδελφοί; wastong ipinaliwanag sa talababa ang karaniwang saklaw nitong buong pamayanan. Ang “minamahal ng Diyos” ay natural at pinananatili ang passive na ugnayan sa Diyos.
