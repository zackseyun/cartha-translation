  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἀναμένειν τὸν υἱὸν αὐτοῦ ἐκ τῶν οὐρανῶν, ὃν ἤγειρεν ἐκ τῶν νεκρῶν, Ἰησοῦν τὸν ῥυόμενον ἡμᾶς ⸀ἐκ τῆς ὀργῆς τῆς ἐρχομένης.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/010.yaml
  text: and to wait for his Son from heaven[a], whom he raised from the dead—Jesus, who rescues us from the coming wrath.
translation:
  language: tl
  text: at hintayin ang kanyang Anak mula sa langit, na muling binuhay niya mula sa mga patay—si Jesus, na nagliligtas[a] sa atin mula sa darating na poot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “na magliligtas”; nakatuon sa hinaharap ang konteksto, ngunit kasalukuyang pandiwari ang ginamit sa Griyego upang ilarawan si Jesus bilang siyang nagliligtas.
    reason: Pagpapanatili sa posibleng temporal na diwa ng kasalukuyang pandiwaring ῥυόμενον.
lexical_decisions:
- source_word: ἀναμένειν
  choice: hintayin
  rationale: Likas at malinaw sa makabagong Tagalog; ipinahihiwatig ng konteksto ang patuloy at may-pananabik na paghihintay.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: ang kanyang Anak
  rationale: Tuwirang pinananatili ang katawagang kristolohikal at ang kaugnayan ng Anak sa Diyos.
- source_word: ἐκ τῶν οὐρανῶν
  choice: mula sa langit
  rationale: Bagaman maramihan ang anyong Griyego, ang isahang “langit” ang likas na gamit sa Tagalog sa ganitong diwa.
- source_word: ὃν ἤγειρεν ἐκ τῶν νεκρῶν
  choice: na kanyang muling binuhay mula sa mga patay
  rationale: Ang “muling binuhay” ay malinaw at karaniwang pananalita para sa pagkabuhay na muli; pinananatili ng “mula sa mga patay” ang diwa ng ἐκ τῶν νεκρῶν.
- source_word: Ἰησοῦν
  choice: si Jesus
  rationale: Ginamit ang nakaugaliang anyo ng pangalang pantangi sa Tagalog.
- source_word: τὸν ῥυόμενον
  choice: na nagliligtas
  rationale: Isinasalin ang kasalukuyang pandiwaring Griyego bilang sugnay na naglalarawan kay Jesus bilang tagapagligtas, nang hindi ito tahasang nililimitahan sa hinaharap.
- source_word: ἐκ τῆς ὀργῆς
  choice: mula sa poot
  rationale: Mas tiyak na katumbas ng ὀργή ang “poot” kaysa sa mas malawak na “paghatol,” at likas ang “mula sa” para sa ἐκ.
- source_word: τῆς ἐρχομένης
  choice: na dumarating
  rationale: Pinananatili ang larawan ng poot na paparating, gayundin ang eskatolohikal na tunguhin, nang hindi tinutukoy ang eksaktong panahon o pangyayari.
theological_decisions:
- issue: Kalikasan ng “poot na dumarating”
  choice: Panatilihin ang “poot na dumarating” nang hindi tinutukoy kung ito ay huling paghatol, kapighatian sa wakas ng panahon, o poot ng Diyos sa mas pangkalahatang diwa.
  alternative: Isalin bilang “darating na paghatol” o tukuyin ito bilang isang partikular na pangyayari sa wakas ng panahon.
  rationale: Hindi makitid na binibigyang-kahulugan ng mismong talata ang parirala; pinananatili ng salin ang bigat at tensiyong teolohikal ng ὀργή nang hindi nagpapasok ng isang sistemang eskatolohikal.
- issue: Panahong ipinahihiwatig ng ῥυόμενον
  choice: “na nagliligtas sa atin”
  alternative: “na magliligtas sa atin” o “na kasalukuyang nagliligtas sa atin”
  rationale: Ang kasalukuyang pandiwari ay maaaring maglarawan kay Jesus ayon sa kanyang katangian at gawain bilang tagapagligtas. Bagaman nakatuon sa hinaharap ang “poot na dumarating,” hindi tahasang hinaharap na pandiwa ang ginamit sa Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kanyang” sa halip na mas pormal na “kaniyang,” at iniwasan ang labis na teknikal o denominasyonal na pananalita.
