  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀφ’ ὑμῶν γὰρ ἐξήχηται ὁ λόγος τοῦ κυρίου οὐ μόνον ἐν τῇ Μακεδονίᾳ ⸀καὶ Ἀχαΐᾳ, ⸀ἀλλ’ ἐν παντὶ τόπῳ ἡ πίστις ὑμῶν ἡ πρὸς τὸν θεὸν ἐξελήλυθεν, ὥστε μὴ χρείαν ⸂ἔχειν ἡμᾶς⸃ λαλεῖν τι·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/008.yaml
  text: For from you the word of the Lord has sounded forth[a], not only in Macedonia and Achaia, but in every place your faith toward God has gone out, so that we have no need to say anything.
translation:
  language: tl
  text: Sapagkat mula sa inyo ay umalingawngaw ang salita ng Panginoon, hindi lamang sa Macedonia at Acaya, kundi sa lahat ng dako ay lumaganap ang inyong pananampalataya sa Diyos.[a] Kaya hindi na namin kailangang magsalita ng anuman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na salin, “ang inyong pananampalatayang nakatuon sa Diyos.”
    reason: Pinananatili nito ang direksiyonal na diwa ng Griyegong πρὸς, na karaniwang isinasalin dito bilang “sa Diyos.”
lexical_decisions:
- source_word: ἀφ’ ὑμῶν
  choice: mula sa inyo
  rationale: Pinananatili ang larawan ng iglesya sa Tesalonica bilang pinagmulan kung saan umalingawngaw ang mensahe.
- source_word: ἐξήχηται
  choice: ay umalingawngaw
  rationale: Ipinapahayag ng pandiwa ang malakas na paglaganap ng tunog. Ang “umalingawngaw” ay natural sa Filipino at pinananatili ang pandinig na talinghaga at ang nagpapatuloy na bunga ng perfect tense.
- source_word: ὁ λόγος τοῦ κυρίου
  choice: ang salita ng Panginoon
  rationale: 'Pinananatili ang pamilyar at bahagyang bukás na parirala: salitang nagmumula sa Panginoon at/o tungkol sa Panginoon.'
- source_word: Μακεδονίᾳ καὶ Ἀχαΐᾳ
  choice: Macedonia at Acaya
  rationale: Ginamit ang karaniwang anyong Filipino ng mga pangalan ng rehiyon.
- source_word: ἐν παντὶ τόπῳ
  choice: sa lahat ng dako
  rationale: Natural na Filipino ito na nagpapanatili sa distributibong diwa ng “bawat lugar,” nang hindi nililimitahan sa mga rehiyong kababanggit lamang.
- source_word: ἡ πίστις ὑμῶν ἡ πρὸς τὸν θεόν
  choice: ang inyong pananampalataya sa Diyos
  rationale: Ang “pananampalataya” ang angkop na katumbas ng πίστις sa konteksto, at ang “sa Diyos” ang natural na Filipino para sa relasyong ipinahihiwatig ng πρὸς. Inilagay sa talababa ang mas literal na diwang “nakatuon sa Diyos.”
- source_word: ἐξελήλυθεν
  choice: ay lumaganap
  rationale: Ang literal na larawan ay paglabas o pagpunta sa iba’t ibang lugar. Ipinahahayag ng “lumaganap” ang pag-abot nito sa lahat ng dako at natural sa Filipino, bagaman hindi kasingkongkreto ng literal na “lumabas.”
- source_word: ὥστε μὴ χρείαν ἔχειν ἡμᾶς λαλεῖν τι
  choice: Kaya hindi na namin kailangang magsabi pa ng anuman
  rationale: Malinaw na inilalahad ang resultang ipinakikilala ng ὥστε. Ang “magsabi pa ng anuman” ay likas na Filipino at ipinakikita na wala nang kailangang idagdag ang mga apostol.
theological_decisions:
- issue: Kahulugan ng πίστις
  choice: pananampalataya
  alternative: katapatan; pagtitiwala
  rationale: Sa konteksto, tinutukoy ang tugon ng mga taga-Tesalonica sa Diyos, kaya “pananampalataya” ang pinakamalawak at pinakapamilyar na salin. Hindi sapat ang konteksto upang gawing pangunahing diwa ang kanilang pagiging tapat.
- issue: Ugnayang ipinahihiwatig ng πρὸς τὸν θεόν
  choice: sa Diyos
  alternative: nakatuon sa Diyos; patungo sa Diyos
  rationale: Ang πρὸς ay may direksiyonal na diwa, ngunit ang literal na “patungo sa Diyos” ay hindi likas na paglalarawan ng pananampalataya sa Filipino. Ang “sa Diyos” ang malinaw na pangunahing salin, habang pinananatili sa talababa ang direksiyonal na himig ng Griyego.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang matitingkad na larawan ng pag-alingawngaw at paglaganap, ngunit iniwasan ang sobrang literal at di-likas na ayos ng pangungusap.
