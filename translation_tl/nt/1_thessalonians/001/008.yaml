    rationale: Ang “pa” at ang pandiwang “magsabi” ay maaaring magpahiwatig ng pagdaragdag ng sasabihin. Ang Griyego ay nagsasabing wala silang pangangailangang magsalita ng anuman; hindi nito tahasang idinidiin ang ‘magdagdag pa.’
