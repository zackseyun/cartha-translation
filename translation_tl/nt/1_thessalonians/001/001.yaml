  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Παῦλος καὶ Σιλουανὸς καὶ Τιμόθεος τῇ ἐκκλησίᾳ Θεσσαλονικέων ἐν θεῷ πατρὶ καὶ κυρίῳ Ἰησοῦ Χριστῷ· χάρις ὑμῖν καὶ ⸀εἰρήνη.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/001.yaml
  text: 'Paul and Silvanus and Timothy[b][a], to the church of the Thessalonians in God the Father and the Lord Jesus the Messiah: grace to you and peace.'
translation:
  language: tl
  text: 'Mula kina Pablo, Silvano, at Timoteo, para sa iglesya ng mga taga-Tesalonica na nasa Diyos Ama at sa Panginoong Jesus na Mesiyas[a]: Sumainyo ang biyaya at kapayapaan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Panginoong Jesu-Cristo.” Ang Griyegong Χριστός ay nangangahulugang “Mesiyas”; ang “Cristo” ay ang nakaugaliang anyo nito sa Tagalog.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παῦλος
  choice: Pablo
  rationale: Karaniwang anyo ng pangalang Παῦλος sa Bibliyang Tagalog.
- source_word: Σιλουανὸς
  choice: Silvano
  rationale: Tuwirang inaangkop sa Tagalog ang anyong Griyego na Σιλουανός; mas tapat ito sa tekstong narito kaysa sa kahaliling pangalang Silas.
- source_word: Τιμόθεος
  choice: Timoteo
  rationale: Karaniwang anyo ng pangalang Τιμόθεος sa Bibliyang Tagalog.
- source_word: ἐκκλησίᾳ
  choice: iglesya
  rationale: Natural at malawak na nauunawaang katawagan sa makabagong Tagalog para sa nagkakatipong pamayanan ng mga mananampalataya.
- source_word: Θεσσαλονικέων
  choice: ng mga taga-Tesalonica
  rationale: Likas na Tagalog para sa pangmaramihang katawagan sa mga taong mula sa Tesalonica.
- source_word: ἐν
  choice: na nasa
  rationale: Pinananatili ang diwa ng ἐν bilang kalagayan o ugnayan nang hindi ito binibigyang-kahulugang 'pag-aari ng.'
- source_word: θεῷ πατρὶ
  choice: Diyos Ama
  rationale: Hindi idinagdag ang 'ating' sapagkat walang katumbas nito sa Griyego.
- source_word: κυρίῳ
  choice: Panginoon
  rationale: Pamantayang salin ng κύριος sa kontekstong ito.
- source_word: Ἰησοῦ Χριστῷ
  choice: Panginoong Jesu-Cristo
  rationale: Ang 'Cristo' ay likas at dignified na anyong Tagalog ng titulong Χριστός; ipinaliliwanag sa talababa ang kahulugang 'Mesiyas.'
- source_word: χάρις
  choice: biyaya
  rationale: Pamantayang salin ng karaniwang pagbating Paulino na χάρις.
- source_word: εἰρήνη
  choice: kapayapaan
  rationale: Pinananatili ang saklaw ng εἰρήνη at ang himig nito bilang pagbati.
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: Sumainyo ang biyaya at kapayapaan
  rationale: Natural na pormula ng pagbati sa Tagalog na malinaw na inuugnay sa mga tumatanggap ang biyaya at kapayapaan.
theological_decisions:
- issue: Pagbibigay-kahulugan sa Χριστός sa pagbati
  choice: 'Cristo sa pangunahing teksto, na may talababa: ''o Mesiyas'''
  alternative: Mesiyas sa pangunahing teksto
  rationale: Sa makabagong Tagalog, 'Jesu-Cristo' ang natural at nakaugaliang anyo, ngunit hindi itinatago ang aktibong kahulugan ng titulong Χριστός; inilalahad ang 'Mesiyas' sa talababa.
- issue: Ugnayang ipinahahayag ng ἐν θεῷ πατρὶ καὶ κυρίῳ Ἰησοῦ Χριστῷ
  choice: na nasa Diyos Ama at sa Panginoong Jesu-Cristo
  alternative: na kabilang sa Diyos Ama at sa Panginoong Jesu-Cristo
  rationale: Pinananatili ng 'nasa' ang lawak at teolohikal na tensiyon ng ἐν, sa halip na paliitin ito tungo sa pagmamay-ari o lokasyon lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang 'iglesya' bilang natural na katawagan sa pamayanang nagkakatipon; iniwasan ang pagdaragdag ng 'ating' sa 'Diyos Ama.'
