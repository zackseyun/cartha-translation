  text: μνημονεύοντες ὑμῶν τοῦ ἔργου τῆς πίστεως καὶ τοῦ κόπου τῆς ἀγάπης καὶ τῆς ὑπομονῆς τῆς ἐλπίδος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/003.yaml
  text: remembering your work of faith and labor of love and steadfastness of hope in our Lord Jesus the Messiah before our God and Father[b][a],
translation:
  language: tl
  text: habang inaalaala namin sa harap ng ating Diyos at Ama ang gawa ng inyong pananampalataya[a], ang pagpapagal ng inyong pag-ibig, at ang matatag na pagtitiis ng inyong pag-asa sa ating Panginoong Jesus na Mesiyas[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “katapatan” o “pagtitiwala” ang salitang isinaling “pananampalataya.”
    reason: lexical_alternative
  - marker: b
    text: 'Griyego: “Cristo”; isinaling “Mesiyas” dito sapagkat ginagamit ang Χριστός bilang titulo.'
    reason: alternative_reading
lexical_decisions:
- source_word: μνημονεύοντες
  choice: habang inaalaala namin
  rationale: Ipinakikitang ang pandiwaring pangkasalukuyan ay nagpapatuloy sa diwa ng naunang talata at tumutukoy sa patuloy na pag-alaala.
- source_word: ἔργου τῆς πίστεως
  choice: ang gawa na bunga ng inyong pananampalataya
  rationale: 'Pinananatili ang “gawa” para sa ἔργον, at likas na ipinahahayag sa Filipino ang malamang na ugnayan ng genitive: gawang nagmumula sa pananampalataya. Hindi nito itinatanggi ang posibleng diwang gawa na kinakikitaan ng pananampalataya.'
- source_word: κόπου τῆς ἀγάπης
  choice: ang pagpapagal na udyok ng inyong pag-ibig
  rationale: Ang “pagpapagal” ay naghahatid ng mabigat at masikap na paggawa na nasa κόπος; ipinahahayag ng “udyok” ang malamang na pag-ibig bilang pinagmumulan ng pagsisikap.
- source_word: ὑπομονῆς τῆς ἐλπίδος
  choice: ang matatag na pagtitiis na dulot ng inyong pag-asa
  rationale: Sinasaklaw ng “matatag na pagtitiis” ang pagtitiyaga sa ilalim ng hirap at ang katatagang ipinahihiwatig ng ὑπομονή.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: sa ating Panginoong Jesus na Mesiyas
  rationale: Ang parirala ay pinauugnay sa “pag-asa” bilang pinagtutuunan nito. Isinalin ang Χριστός bilang titulong “Mesiyas,” hindi bilang simpleng bahagi ng pangalan.
- source_word: ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: sa harap ng ating Diyos at Ama
  rationale: Pinananatili ang diwa ng paggawa o pag-alaala sa presensiya ng iisang tinutukoy na Diyos at Ama.
theological_decisions:
- issue: Diwa ng πίστις sa τῆς πίστεως
  choice: pananampalataya
  alternative: katapatan; pagtitiwala
  rationale: Ang “pananampalataya” ang pinakakaraniwang katumbas dito, ngunit maaaring taglayin ng πίστις ang diwa ng katapatan o pagtitiwala; pinananatili ang mga ito sa talababa.
- issue: Paglilipat ng Χριστοῦ
  choice: Mesiyas
  alternative: Cristo
  rationale: Gumaganap dito ang Χριστός bilang titulo. Ang “Mesiyas” ay tuwirang naghahatid ng kahulugan nito, samantalang inilalagay sa talababa ang pamilyar na anyong “Cristo.”
- issue: 'Ugnayan ng tatlong genitive: πίστεως, ἀγάπης, ἐλπίδος'
  choice: bunga/udyok/dulot
  alternative: gawa ng pananampalataya, pagpapagal ng pag-ibig, at pagtitiis ng pag-asa
  rationale: Malamang na inilalarawan ng mga genitive ang pinagmumulan o nagpapakilos sa gawa, pagpapagal, at pagtitiis. Gumamit ng likas na Filipino nang hindi ginagawang hiwalay na doktrinal na pahayag ang ugnayan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iningatan ang tatluhang balangkas—gawa, pagpapagal, at matatag na pagtitiis—habang ginawang likas sa Tagalog ang mga ugnayang genitive. Ang pangungusap ay nananatiling bukas dahil bahagi ito ng pangungusap na nagsimula sa naunang talata.
