translation:
  language: tl
  text: Gaya ng alam ninyo[a], pinakitunguhan namin ang bawat isa sa inyo gaya ng pakikitungo ng isang ama sa sarili niyang mga anak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas literal: “Gaya ng alam ninyo kung paanong ang bawat isa sa inyo, gaya ng isang ama sa sarili niyang mga anak.” Eliptiko ang sugnay sa Griyego at nakasalalay sa nakapaligid na pangungusap para sa ganap na pandiwang diwa nito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ
  choice: Gaya ng
  rationale: Pinananatili nito ang malinaw na paghahambing at ang pag-apela sa nalalaman ng mga taga-Tesalonica tungkol sa asal ng mga apostol.
- source_word: οἴδατε
  choice: alam ninyo
  rationale: Bagaman perpektong anyo sa Griyego, karaniwan itong may pangkasalukuyang kahulugang ‘alam’; natural ito sa modernong Tagalog.
- source_word: ὡς
  choice: kung paano / ipinahihiwatig sa kabuuang sugnay
  rationale: Ang unang ὡς ay nagpapakilala sa nilalaman ng kanilang nalalaman. Hindi na ito hiwalay na isinalin sa pangunahing teksto dahil mas natural sa Tagalog ang ‘Gaya ng alam ninyo’ kasunod ng ipinahiwatig na kilos.
- source_word: ἕνα ἕκαστον ὑμῶν
  choice: ang bawat isa sa inyo
  rationale: 'Ipinapakita nito ang mariing distributibong diwa: isa-isang pinakitunguhan ang mga mananampalataya.'
- source_word: ὡς
  choice: tulad ng
  rationale: Ang ikalawang ὡς ay tahasang naghahayag ng paghahambing sa isang ama.
- source_word: πατὴρ
  choice: isang ama
  rationale: Ang pangngalan ay walang artikulo at ginagamit sa paghahambing; natural itong isalin bilang ‘isang ama.’
- source_word: τέκνα
  choice: mga anak
  rationale: Malawak at hindi nakabatay sa kasarian ang τέκνα; ang ‘mga anak’ ang likas at tumpak na katumbas.
- source_word: ἑαυτοῦ
  choice: sarili niyang
  rationale: 'Pinananatili nito ang diin ng panghalip na reflexive: hindi basta mga anak, kundi ang sariling mga anak ng ama.'
- source_word: '[elliptical verbal idea from context]'
  choice: pinakitunguhan namin
  rationale: Hindi buo ang sugnay sa Griyego at nakasalalay sa nakapaligid na pangungusap. Ang malawak na pandiwang ito ay nagbibigay ng kinakailangang diwa nang hindi nililimitahan iyon sa isa lamang sa mga kilos na binabanggit sa konteksto.
theological_decisions:
- issue: Paglalagay ng ipinahihiwatig na kilos sa eliptikong sugnay
  choice: Isinalin gamit ang malawak na pandiwang ‘pinakitunguhan namin ang bawat isa sa inyo.’
  alternative: Panatilihin itong mas putol—‘Gaya ng alam ninyo kung paanong ang bawat isa sa inyo, tulad ng isang ama sa sarili niyang mga anak’—o maglagay ng mas tiyak na pandiwa gaya ng ‘pinayuhan namin.’
  rationale: Ang Griyegong sugnay ay eliptiko at kinukuha ang ganap na pandiwang diwa mula sa mas malawak na pangungusap. Ang ‘pinakitunguhan’ ay malinaw sa Tagalog ngunit hindi nagtatakda ng iisang pastoral na kilos lamang.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang ‘pinakitunguhan’ upang maging malinaw ang eliptikong pahayag habang pinananatili sa talababa ang anyo at tunay na sintaktikong kalabuan ng Griyego.
