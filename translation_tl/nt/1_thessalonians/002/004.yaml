revisions:
- from: Sa halip, kung paanong sinubok at pinagtibay kami ng Diyos upang ipagkatiwala sa amin ang mabuting balita, gayon kami nagsasalita—hindi bilang mga nagpapalugod sa mga tao, kundi sa Diyos[a] na sumusuri sa aming mga puso.
  to: Ngunit, kung paanong sinuri at pinagtibay kami ng Diyos upang ipagkatiwala sa amin ang mabuting balita, gayon kami nagsasalita—hindi bilang mga nagpapalugod sa mga tao, kundi bilang mga nagpapalugod sa Diyos na sumusuri sa aming mga puso.[a]
  rationale: Pinalitan ang “Sa halip” ng mas neutral na “Ngunit.” Inilahad ang pandiwang ipinahihiwatig sa ikalawang panig ng paghahambing upang maipahayag nang malinaw sa Filipino na ang Diyos, hindi ang mga tao, ang kanilang pinalulugdan. Ang talababa ay nagpapanatili ng kaalaman tungkol sa siksik na sintaks ng Griyego.
