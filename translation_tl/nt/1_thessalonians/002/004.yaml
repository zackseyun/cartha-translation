  text: ἀλλὰ καθὼς δεδοκιμάσμεθα ὑπὸ τοῦ θεοῦ πιστευθῆναι τὸ εὐαγγέλιον οὕτως λαλοῦμεν, οὐχ ὡς ἀνθρώποις ἀρέσκοντες ἀλλὰ ⸀θεῷ τῷ δοκιμάζοντι τὰς καρδίας ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/004.yaml
  text: But just as we have been approved by God to be entrusted with the gospel[a], so we speak—not as pleasing people, but God, who tests our hearts.
translation:
  language: tl
  text: Ngunit, kung paanong sinuri at pinagtibay kami ng Diyos upang ipagkatiwala sa amin ang mabuting balita, gayon kami nagsasalita—hindi bilang mga nagpapalugod sa mga tao, kundi bilang mga nagpapalugod sa Diyos na sumusuri sa aming mga puso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, tahasang binanggit ang “nagpapalugod” sa unang bahagi lamang ng paghahambing; ipinahihiwatig ito sa “kundi sa Diyos.” Inilahad ito sa Filipino upang maging malinaw at natural ang pangungusap.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεδοκιμάσμεθα
  choice: sinubok at pinagtibay kami
  rationale: Ipinahahayag nito kapuwa ang pagsusuring nakapaloob sa δοκιμάζω at ang positibong kinalabasan nito. Ang anyong ganap na balintiyak ay nagpapahiwatig ng natapos na pagsusuri na nananatili ang bunga.
- source_word: πιστευθῆναι τὸ εὐαγγέλιον
  choice: upang ipagkatiwala sa amin ang mabuting balita
  rationale: Dito, ang balintiyak na infinitive ay tumutukoy sa pagkakatiwala ng mensahe sa mga apostol, hindi sa kanilang pagsampalataya rito. Likas sa Filipino ang pariralang “ipagkatiwala sa amin.”
- source_word: τὸ εὐαγγέλιον
  choice: ang mabuting balita
  rationale: Direkta at malinaw nitong naihahatid ang kahulugan ng εὐαγγέλιον sa karaniwang makabagong Filipino habang pinananatili ang kahalagahan ng terminong Paulino.
- source_word: οὕτως λαλοῦμεν
  choice: gayon kami nagsasalita
  rationale: Pinananatili ng “gayon” ang lohikal na ugnayan ng kanilang pagsasalita sa naunang pagsubok, pagpapatibay, at pagkakatiwala ng Diyos.
- source_word: οὐχ ὡς ἀνθρώποις ἀρέσκοντες
  choice: hindi bilang mga nagpapalugod sa mga tao
  rationale: Pinananatili nito ang participial na anyo at ang tahasang unang panig ng paghahambing sa Griyego.
- source_word: ἀλλὰ θεῷ
  choice: kundi sa Diyos
  rationale: Pinananatili nito ang siksik at eliptikong kaibahan ng Griyego, kung saan ipinahihiwatig ngunit hindi inuulit ang “nagpapalugod.”
- source_word: τῷ δοκιμάζοντι
  choice: na sumusuri
  rationale: Ang pangkasalukuyang participle ay nagpapakita ng patuloy na pagsusuri ng Diyos. Ang “sumusuri” ay natural at may evaluative na diwa.
- source_word: τὰς καρδίας ἡμῶν
  choice: sa aming mga puso
  rationale: Pinananatili ng “mga puso” ang malawak na biblikal na diwa ng panloob na pagkatao at hindi ito nililimitahan sa isip o damdamin lamang.
theological_decisions:
- issue: Ang siksik na kaibahan sa pagitan ng pagpapalugod sa mga tao at sa Diyos
  choice: hindi bilang mga nagpapalugod sa mga tao, kundi sa Diyos
  alternative: hindi upang palugdan ang mga tao, kundi upang palugdan ang Diyos
  rationale: Tahasan lamang sa Griyego ang participle na “nagpapalugod” sa unang panig at ipinahihiwatig ito sa ikalawa. Pinananatili ng pangunahing teksto ang estilistikong siksik na anyo ni Pablo nang hindi itinatago ang kahulugan; nasa talababa ang mas idyomatikong pagpapalawak.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kami/aming” dahil tumutukoy si Pablo at ang kaniyang mga kasama sa kanilang sarili, na hiwalay sa mga mambabasa. Ang “Sa halip” ay natural na nagdadala ng ἀλλά bilang pagsalungat sa naunang diwa.
