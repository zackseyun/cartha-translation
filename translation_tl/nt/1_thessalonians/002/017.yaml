source:
  edition: SBLGNT
  text: Ἡμεῖς δέ, ἀδελφοί, ἀπορφανισθέντες ἀφ’ ὑμῶν πρὸς καιρὸν ὥρας, προσώπῳ οὐ καρδίᾳ, περισσοτέρως ἐσπουδάσαμεν τὸ πρόσωπον ὑμῶν ἰδεῖν ἐν πολλῇ ἐπιθυμίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/017.yaml
  text: But we[a], brothers, having been torn away from you for a short time—in person, not in heart—were all the more eager, with great longing[b], to see your face.
translation:
  language: tl
  text: Ngunit kami naman, mga kapatid[b], nang napahiwalay sa inyo[a] sa maikling panahon—sa pisikal na presensya, hindi sa puso—ay lalo pang nagsikap, taglay ang matinding pananabik, na makita kayo nang harapan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “nang maulila sa inyo.” Gumagamit ang Griego ng masidhing larawan ng pagkaulila o pangungulila upang ilarawan ang kanilang pagkakahiwalay.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga kapatid” ang panawag ni Pablo; sa kontekstong ito, malamang na saklaw nito ang buong pamayanan ng mga sumasampalataya, kabilang ang mga babae.
    reason: cultural_note
lexical_decisions:
- source_word: Ἡμεῖς δέ
  choice: Ngunit kami naman
  rationale: Ipinahihiwatig ng δέ ang banayad na pagsalungat o paglipat, habang pinananatili ng “kami naman” ang diin ng tahasang Ἡμεῖς.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Likas sa Filipino ang “mga kapatid” bilang tawag sa buong pamayanang sumasampalataya at hindi nito kailangang tukuyin ang kasarian, bagaman panlalaking maramihan ang anyong Griego.
- source_word: ἀπορφανισθέντες ἀφ’ ὑμῶν
  choice: nang mawalay sa inyo
  rationale: Ipinapahayag nito sa natural na Filipino ang masakit na pagkakahiwalay. Ang masidhing larawang literal na kaugnay ng pagkaulila ay pinanatili sa talababa.
- source_word: πρὸς καιρὸν ὥρας
  choice: sa maikling panahon
  rationale: Idyoma ito para sa maikling yugto, hindi kinakailangang literal na isang oras.
- source_word: προσώπῳ οὐ καρδίᾳ
  choice: sa harapan, hindi sa puso
  rationale: Pinananatili ang tuwirang paghahambing ng pisikal na pagkakalayo at nananatiling pagmamahal, pati ang larawan ng πρόσωπον.
- source_word: περισσοτέρως ἐσπουδάσαμεν
  choice: lalo pang nagsikap
  rationale: Sinasaklaw ng parirala ang parehong pinatinding pananabik at aktibong pagsisikap, sa halip na damdamin lamang.
- source_word: τὸ πρόσωπον ὑμῶν ἰδεῖν
  choice: makita kayong muli nang harapan
  rationale: Natural itong pahayag sa Filipino para sa personal at pisikal na pagkikita, habang inuulit ang diwa ng “harapan” sa naunang parirala.
- source_word: ἐν πολλῇ ἐπιθυμίᾳ
  choice: taglay ang matinding pananabik
  rationale: Ang ἐπιθυμία rito ay matindi at positibong pagnanais; malinaw itong naipahahayag ng “matinding pananabik.”
theological_decisions:
- issue: Saklaw ng panawag na ἀδελφοί
  choice: mga kapatid
  alternative: mga kapatid na lalaki; mga kapatid na lalaki at babae
  rationale: Bagaman panlalaking maramihan ang anyong Griego, karaniwang ginagamit ito ni Pablo bilang panawag sa buong kongregasyon. Ang “mga kapatid” ay tumpak at likas sa Filipino nang hindi nagdaragdag ng mga salitang wala sa teksto.
- issue: Larawan ng ἀπορφανισθέντες
  choice: mawalay sa inyo, na may literal na larawan sa talababa
  alternative: maulila sa inyo
  rationale: Ang literal na “maulila sa inyo” ay maaaring malabo o tunog-di-likas sa pangunahing teksto, ngunit mahalagang huwag mawala ang matinding larawan ng pangungulila at kawalan; kaya inilalahad ito sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang retorikal na ugnayan ng “sa harapan” at “makita ... nang harapan,” gayundin ang kaibahan ng pisikal na pagkawala at patuloy na pagkakaugnay sa puso.
