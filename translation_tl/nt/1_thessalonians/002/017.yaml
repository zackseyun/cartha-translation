  naturalness: Makabago at marangal ang rehistro. Mas malinaw at mas natural sa Filipino ang “sa pisikal na presensya, hindi sa puso” para sa kaibahang pisikal na pagkawala at patuloy na ugnayan ng damdamin. Ang “makita kayo nang harapan” ay nananatiling natural para sa literal na layuning makita sila nang personal.
  terminology: Ang “mga kapatid” ay angkop at likas na katumbas ng ἀδελφοί sa panawag ni Pablo. Ang “napahiwalay” ay mas mabigat kaysa “mawalay” at mas mahusay na nagpapahiwatig ng marahas o masakit na pagkakahiwalay na nasa ἀπορφανισθέντες, habang ang tala ay pinananatili ang larawan ng pagkaulila.
