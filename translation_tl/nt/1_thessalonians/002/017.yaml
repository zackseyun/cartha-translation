  to: Ngunit kami naman, mga kapatid[b], nang napahiwalay sa inyo[a] sa maikling panahon—sa pisikal na presensya, hindi sa puso—ay lalo pang nagsikap, taglay ang matinding pananabik, na makita kayo nang harapan.
  rationale: Inalis ang dagdag na “muli” upang manatili sa saklaw ng Griego. Pinalitan ang unang “sa harapan” ng “sa pisikal na presensya” upang malinaw na maihatid ang προσωπῳ οὐ καρδίᾳ, at ginawang “napahiwalay” upang bahagyang masalamin ang masidhing larawan ng ἀπορφανισθέντες. Napanatili ang talababa para sa literal na larawan ng pagkaulila at ang talababa sa saklaw ng “mga kapatid.”
