  text: For you yourselves know[a], brothers, that our coming to you was not in vain,
translation:
  language: tl
  text: Sapagkat kayo mismo ang nakaaalam, mga kapatid[a], na ang pagdating namin sa inyo ay hindi naging walang kabuluhan.
  philosophy: optimal-equivalence
  footnotes:
