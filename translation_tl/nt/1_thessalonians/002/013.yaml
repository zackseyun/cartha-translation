  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀Καὶ διὰ τοῦτο καὶ ἡμεῖς εὐχαριστοῦμεν τῷ θεῷ ἀδιαλείπτως, ὅτι παραλαβόντες λόγον ἀκοῆς παρ’ ἡμῶν τοῦ θεοῦ ἐδέξασθε οὐ λόγον ἀνθρώπων ἀλλὰ καθὼς ⸂ἀληθῶς ἐστὶν⸃ λόγον θεοῦ, ὃς καὶ ἐνεργεῖται ἐν ὑμῖν τοῖς πιστεύουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/013.yaml
  text: And because of this we also thank God continually[a], that when you received the word of God that you heard from us, you accepted it not as the word of men but, as it truly is, the word of God[c][b], which is also at work in you who believe.
translation:
  language: tl
  text: At dahil dito, kami rin ay walang tigil na nagpapasalamat sa Diyos, sapagkat nang tanggapin ninyo mula sa amin ang salita ng Diyos na inyong narinig,[a] tinanggap ninyo ito hindi bilang salita ng tao kundi bilang salita ng Diyos, na ito nga talaga,[b] at kumikilos din sa inyo na sumasampalataya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mensahe ng Diyos na narinig ninyo mula sa amin.” Siksik ang pagkakasabi sa Griyego at maaari itong likas na buksan sa higit sa isang paraan.
    reason: lexical_alternative
  - marker: b
    text: O “hindi bilang salita ng tao kundi, gaya nga ng tunay na ito, bilang salita ng Diyos.”
    reason: lexical_alternative
  - marker: c
    text: 'Maaari ring unawain na ang Diyos ang tinutukoy: “at ang Diyos ay kumikilos din sa inyo na sumasampalataya.”'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: At dahil dito
  rationale: Pinananatili ang tahasang ugnayang sanhi sa naunang konteksto, habang natural ang daloy sa makabagong Tagalog.
- source_word: εὐχαριστοῦμεν τῷ θεῷ ἀδιαλείπτως
  choice: patuloy din kaming nagpapasalamat sa Diyos
  rationale: Ipinahahayag ang nagpapatuloy at paulit-ulit na pasasalamat nang hindi gumagamit ng masyadong literal ngunit di-likas na pananalita.
- source_word: λόγον ἀκοῆς παρ’ ἡμῶν τοῦ θεοῦ
  choice: ang salita ng Diyos na narinig ninyo mula sa amin
  rationale: Natural na binubuksan ang siksik na konstruksiyong Griyego at pinananatili ang kaugnayan ng salita sa Diyos at ng pagkarinig nito sa pangangaral ng mga apostol.
- source_word: ἐδέξασθε
  choice: tinanggap ninyo iyon
  rationale: Ipinahihiwatig ang kusang pagtanggap at pagkilala, hindi lamang ang pasibong pagkarinig.
- source_word: οὐ λόγον ἀνθρώπων
  choice: hindi bilang salita ng tao
  rationale: Ang pang-isahang kolektibong 'tao' ay natural at inklusibo sa Tagalog at pinananatili ang kwalitatibong paghahambing.
- source_word: ἀλλὰ καθὼς ἀληθῶς ἐστὶν λόγον θεοῦ
  choice: kundi bilang salita ng Diyos—na siyang tunay na kalikasan nito
  rationale: Pinananatili ang diin na tunay ngang salita ng Diyos ang mensahe, habang nililinaw sa natural na Tagalog ang parentetikong καθὼς ἀληθῶς ἐστίν.
- source_word: ἐνεργεῖται
  choice: kumikilos
  rationale: Ipinahahayag ang patuloy at mabisang paggawa nang hindi labis na tinutukoy kung midyal o pasibo ang diwa ng anyo.
- source_word: τοῖς πιστεύουσιν
  choice: sa inyong mga sumasampalataya
  rationale: Pinananatili ang kasalukuyan at patuloy na katangian ng pananampalataya sa natural na Tagalog.
theological_decisions:
- issue: Ang tinutukoy ng panghalip na ὃς
  choice: 'Ang ''salita ng Diyos'' ang tinutukoy: ''Ang salitang ito ang kumikilos.'''
  alternative: 'Maaaring ang Diyos ang tinutukoy: ''Ang Diyos ang kumikilos din sa inyong mga sumasampalataya.'''
  rationale: Parehong panlalaking pang-isahan sa Griyego ang λόγος at θεός, ngunit ang 'salita' ang pinakamalapit at pinakaangkop na antecedent sa daloy. Inilalagay sa talababa ang tunay na alternatibo.
- issue: Diwa ng λόγον θεοῦ
  choice: salita ng Diyos
  alternative: mensahe ng Diyos
  rationale: Pinananatili ng 'salita' ang tahasang retorikal na paghahambing sa 'salita ng tao' at ang teolohikal na bigat ng teksto, nang hindi pinalalawak ang sinasabi ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'salita ng tao' sa halip na 'salita ng mga lalaki' sapagkat pangkalahatan ang ἀνθρώπων. Bahagyang hinati ang mahabang pangungusap upang maging madaling maunawaan, ngunit pinanatili ang lohikal at retorikal na daloy ng Griyego.
