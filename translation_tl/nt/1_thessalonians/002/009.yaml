  text: Μνημονεύετε γάρ, ἀδελφοί, τὸν κόπον ἡμῶν καὶ τὸν μόχθον· ⸀νυκτὸς καὶ ἡμέρας ἐργαζόμενοι πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν ἐκηρύξαμεν εἰς ὑμᾶς τὸ εὐαγγέλιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/009.yaml
  text: 'For you remember[a], brothers, our labor and hardship: working night and day so as not to burden any of you, we proclaimed to you the gospel of God.'
translation:
  language: tl
  text: 'Sapagkat naaalaala ninyo, mga kapatid[a], ang aming pagpapagal at paghihirap: habang nagtatrabaho kami gabi at araw upang hindi maging pabigat sa sinuman sa inyo, ipinahayag namin sa inyo ang mabuting balita ng Diyos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay nasa anyong panlalaking maramihan ngunit maaari nitong tukuyin nang inklusibo ang buong kongregasyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μνημονεύετε
  choice: naaalaala ninyo
  rationale: Ang pangkasalukuyang pasaklaw na anyong pandiwa sa ikalawang panauhang maramihan ay isang pahayag, hindi utos; natural nitong tinutukoy ang patuloy na pag-alaala ng mga taga-Tesalonica.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Ang “mga kapatid” ay likas at marangal na tawag sa Filipino at hindi kailangang tukuyin ang kasarian; sa konteksto, malamang na buong kongregasyon ang kinakausap.
- source_word: τὸν κόπον ἡμῶν καὶ τὸν μόχθον
  choice: ang aming pagpapagal at paghihirap
  rationale: Pinananatili ng “pagpapagal” ang diwa ng mabigat na paggawa sa κόπος, samantalang ipinahahayag ng “paghihirap” ang hirap at pasakit na kalakip ng μόχθος.
- source_word: νυκτὸς καὶ ἡμέρας ἐργαζόμενοι
  choice: nagtrabaho kami gabi at araw
  rationale: Likas sa Filipino ang “gabi at araw,” at malinaw na inilalahad ng sugnay ang gawaing kasabay at nagbibigay-konteksto sa pagpapahayag.
- source_word: πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν
  choice: upang hindi maging pabigat sa sinuman sa inyo
  rationale: Malinaw na layunin ang ipinahahayag ng konstruksyon; ang “maging pabigat” ay natural na Filipino para sa pagpapataw ng pinansiyal o praktikal na pasanin.
- source_word: ἐκηρύξαμεν εἰς ὑμᾶς
  choice: ipinahahayag namin sa inyo
  rationale: Ang “ipinahahayag” ay nagpapanatili sa diwa ng hayagang pag-aanunsiyo ng κηρύσσω, at ang “sa inyo” ay kumakatawan sa direksiyon ng εἰς ὑμᾶς.
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: ang mabuting balita ng Diyos
  rationale: Ang “mabuting balita” ay malinaw at kasalukuyang Filipino para sa εὐαγγέλιον; pinananatili ng “ng Diyos” ang sadyang maluwag na ugnayang genitibo nang hindi nagpapasiya kung ito ay pinagmulan, pag-aari, o nilalaman.
theological_decisions:
- issue: Saklaw ng ἀδελφοί
  choice: mga kapatid
  alternative: mga kapatid na lalaki; mga kapatid na lalaki at babae
  rationale: Bagaman panlalaking maramihan ang anyong Griyego, maaari nitong tukuyin nang inklusibo ang buong kongregasyon. Sa Filipino, ang “mga kapatid” ay likas na hindi minamarkahan ang kasarian at napapanatili ang pampamilyang tawag; nililinaw sa talababa ang saklaw nito.
- issue: Ugnayan sa pariralang τοῦ θεοῦ
  choice: ng Diyos
  alternative: mula sa Diyos; tungkol sa Diyos
  rationale: Hindi tahasang nilulutas ng genitibo kung Diyos ang pinagmulan, may-ari, o nilalaman ng mabuting balita, kaya pinananatili ang mas maluwag na “ng Diyos.”
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “mabuting balita” sa halip na mas teknikal na “ebanghelyo,” at inayos bilang dalawang pangungusap upang maging malinaw ang mahabang estrukturang Griyego nang hindi binabago ang ugnayan ng mga ideya.
