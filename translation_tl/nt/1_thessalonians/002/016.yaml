base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/016.yaml
  text: by hindering us from speaking to the Gentiles so that they may be saved[a], so as always to fill up the measure of their sins[b]. But wrath has come upon them at last.
translation:
  language: tl
  text: na humahadlang sa amin na magsalita sa mga Hentil upang maligtas sila, at sa gayon ay lagi nilang pinupuno ang sukat ng kanilang mga kasalanan. Ngunit sa wakas[a] ay dumating na sa kanila ang poot[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ang “sa wakas” (Griyego: εἰς τέλος) ay maaari ring mangahulugang “nang lubos,” “nang ganap,” o “hanggang sa katapusan.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “poot” ay malamang na tumutukoy sa banal na hatol, ngunit hindi tinutukoy rito ni Pablo kung ang ibig niyang sabihin ay isang hatol na nagaganap sa kasaysayan, ang pangwakas na hatol, o kapuwa ang mga ito.
    reason: alternative_reading
lexical_decisions:
- source_word: κωλυόντων
  choice: na humahadlang
  rationale: Ipinakikita ng kasalukuyang participle ang nagpapatuloy na paghadlang at ipinagpapatuloy nito ang paglalarawan sa naunang konteksto.
- source_word: τοῖς ἔθνεσιν
  choice: sa mga Hentil
  rationale: Sa kontekstong Paulino, tumutukoy ito sa mga hindi Judio, hindi sa mga bansang pampolitika.
- source_word: λαλῆσαι
  choice: na magsalita
  rationale: Tuwirang salin ng infinitive; ang konteksto ang nagpapahiwatig na tungkol sa mensahe ng kaligtasan ang pagsasalita.
- source_word: ἵνα σωθῶσιν
  choice: upang maligtas sila
  rationale: Pinananatili ang layuning ipinahahayag ng ἵνα at ang balintiyak na anyo ng pandiwang σωθῶσιν.
- source_word: εἰς τὸ ἀναπληρῶσαι
  choice: at sa gayon ay ... pinupuno
  rationale: Sinasalamin ang kinahinatnang bunga nang hindi ipinapalagay na sinadya nilang lubusin ang kanilang mga kasalanan.
- source_word: ἀναπληρῶσαι
  choice: pinupuno ang takal ng
  rationale: Ang 'takal' ay natural na pagpapahayag ng larawang ang mga kasalanan ay umaabot sa ganap na sukat.
- source_word: πάντοτε
  choice: lagi
  rationale: Tuwirang inilalarawan ang nagpapatuloy o paulit-ulit na padron.
- source_word: ἔφθασεν
  choice: sumapit na
  rationale: Ipinahahayag ang pagdating na naganap na at may kasalukuyang bigat; ang 'sumapit sa' ay likas na katumbas ng ἔφθασεν ἐπί.
- source_word: ὀργή
  choice: poot
  rationale: Pinananatili ang matinding teolohikal na bigat ng salita nang hindi ito agad pinapalitan ng mas interpretatibong 'hatol.'
- source_word: εἰς τέλος
  choice: sa wakas
  rationale: Natural na Tagalog para sa kahulugang pangwakas o pangkaganapan, habang inilalagay sa talababa ang iba pang tunay na posibleng pakahulugan.
theological_decisions:
- issue: Tinutukoy at saklaw ng 'poot'
  choice: Iniwan bilang 'poot,' na malamang ay banal na poot o hatol, ngunit hindi tinukoy kung kasalukuyang makasaysayang hatol, pangwakas na hatol, o kapuwa.
  alternative: Isalin nang tahasan bilang 'hatol ng Diyos' at tukuyin bilang isang partikular na makasaysayan o eskatolohikal na pangyayari.
  rationale: Hindi tahasang tinutukoy ng talata ang pangyayari o panahon; pinananatili ng salin ang teolohikal na tensiyon.
- issue: Lakas ng εἰς τὸ ἀναπληρῶσαι
  choice: 'Bunga o kinahinatnan: ''at sa gayon ay.'''
  alternative: 'Layunin: ''upang punuin.'''
  rationale: Iniiwasang ipahiwatig na ang pagpuno sa takal ng kasalanan ang kanilang sinasadyang layunin, habang pinananatili ang ugnayang bunga na posible sa konstruksiyon.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang 'Hentil' bilang pamilyar na katawagang biblikal sa mga hindi Judio, 'takal' upang mapanatili ang idyomatikong larawan ng kasalanang umaabot sa buong sukat, at 'sumapit na' upang maging natural ang aspektong naganap na may nananatiling kabuluhan.
