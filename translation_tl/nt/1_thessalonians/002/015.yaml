base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/015.yaml
  text: who also killed the Lord Jesus and the prophets[a], and drove us out, and are not pleasing to God, and are hostile to all people[c][b],
translation:
  language: tl
  text: na pumatay rin sa Panginoong Jesus[a] at sa mga propeta, at nagpalayas sa amin[b], at hindi nakalulugod sa Diyos, at laban sa lahat ng tao[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “pinatay ang Panginoong Jesus.”'
    reason: lexical_alternative
  - marker: b
    text: Ang pandiwa ay tumutukoy sa pagpapalayas o pagtataboy sa amin; mas tiyak ito kaysa sa mas pangkalahatang diwa ng pag-uusig.
    reason: lexical_alternative
  - marker: c
    text: Sa gramatika, ipinagpapatuloy ng paglalarawang ito ang pagtukoy sa pangkat na binanggit sa naunang talata. Hindi ito dapat unawain bilang isang pangkalahatang pahayag tungkol sa lahat ng Judio sa bawat panahon at lugar.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκτεινάντων
  choice: pumatay
  rationale: Tuwirang ipinapahayag ng pandiwang Griyego ang pagkitil ng buhay nang hindi idinaragdag ang mas tiyak na moral na pahiwatig ng ‘pumaslang.’
- source_word: κύριον Ἰησοῦν
  choice: Panginoong Jesus
  rationale: Pinananatili ang kinikilalang titulong kristolohikal na κύριος at ang karaniwang anyo ng pangalang Jesus sa Filipino.
- source_word: τοὺς προφήτας
  choice: sa mga propeta
  rationale: Likas na salin sa Filipino para sa kinikilalang hanay ng mga propeta; hindi kailangang tumbasan nang hiwalay ang artikulong Griyego.
- source_word: ἐκδιωξάντων
  choice: nagpalayas sa amin
  rationale: Ipinapakita nito ang tiyak at kongkretong diwa ng pagtataboy o pagpapaalis, sa halip na ang mas malawak na ‘umusig.’
- source_word: θεῷ μὴ ἀρεσκόντων
  choice: hindi nakalulugod sa Diyos
  rationale: Pinananatili ang patuloy at mapaglarawang puwersa ng kasalukuyang participle sa natural at marangal na Filipino.
- source_word: πᾶσιν ἀνθρώποις ἐναντίων
  choice: kalaban ng lahat ng tao
  rationale: Likas na ipinahahayag ang pagsalungat o pagkapoot na taglay ng ἐναντίος nang hindi pinahihina bilang simpleng pagkakaiba lamang.
- source_word: τῶν ... ἀποκτεινάντων ... ἐκδιωξάντων ... ἀρεσκόντων ... ἐναντίων
  choice: na pumatay rin ... at nagpalayas ... at hindi nakalulugod ... at kalaban ...
  rationale: Ang sugnay na nagsisimula sa ‘na’ ay nagpapanatili sa kaugnayan nito sa tinutukoy sa naunang talata at sa magkakasunod na paglalarawan ng tekstong Griyego.
- source_word: καὶ
  choice: rin / at
  rationale: Ang unang καί ay isinaling ‘rin’ upang ipakita ang pagdaragdag; ang mga kasunod ay ‘at’ upang mapanatili ang naiipong retorikal na diin.
theological_decisions:
- issue: Tinutukoy ng magkakasunod na participle
  choice: Ipinagpapatuloy ng talata ang paglalarawan sa partikular na pangkat na binanggit sa naunang talata.
  alternative: Isang pangkalahatan at walang-hanggang paghatol sa lahat ng Judio sa bawat panahon at lugar.
  rationale: Ang artikulo at mga participle sa genitive plural ay nakaugnay sa antecedent sa 2:14. Pinananatili ng ‘na’ ang ugnayang ito nang hindi pinalalawak ang saklaw na lampas sa tinutukoy sa konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong nakaugnay sa naunang talata at ang naiipong diin ng magkakasunod na paratang, nang hindi ginagawang hiwalay at pangkalahatang pahayag ang talata.
