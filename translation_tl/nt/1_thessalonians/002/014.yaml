id: 1TH.2.14
reference: 1 Thessalonians 2:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὑμεῖς γὰρ μιμηταὶ ἐγενήθητε, ἀδελφοί, τῶν ἐκκλησιῶν τοῦ θεοῦ τῶν οὐσῶν ἐν τῇ Ἰουδαίᾳ ἐν Χριστῷ Ἰησοῦ, ὅτι τὰ αὐτὰ ἐπάθετε καὶ ὑμεῖς ὑπὸ τῶν ἰδίων συμφυλετῶν καθὼς καὶ αὐτοὶ ὑπὸ τῶν Ἰουδαίων
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/014.yaml
  text: For you became imitators[a], brothers, of the churches of God that are in Judea in Messiah Jesus, because you also suffered the same things from your own countrymen[c][b], just as they did from the Jews.
translation:
  language: tl
  text: Sapagkat kayo, mga kapatid, ay naging mga tagagaya ng mga iglesya ng Diyos na nasa Judea at nakay Jesus na Mesiyas,[a] dahil dumanas din kayo ng gayunding mga bagay mula sa sarili ninyong mga kababayan, gaya ng dinanas nila mula sa mga Judio.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nakay Cristo Jesus.” Ang salitang Griyego na Χριστός ay nangangahulugang “Mesiyas” o “Pinahiran.”
    reason: alternative_reading
  - marker: b
    text: O, “mga taga-Judea.” Maaaring tumukoy ang salitang Griyego sa mga Judio o sa mga taga-Judea, ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: μιμηταὶ ἐγενήθητε
  choice: naging mga tagaya
  rationale: Pinananatili ng “naging” ang diwa ng ἐγενήθητε, at tahasang ipinahahayag ng “mga tagaya” ang paghahambing na nasa μιμηταί sa halip na palabuin ito bilang simpleng pagsunod.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Ang “mga kapatid” ay likas na tawag sa buong kapulungan sa Filipino at hindi kailangang tukuyin ang kasarian, bagaman panlalaking maramihan ang anyong Griyego.
- source_word: ἐκκλησιῶν τοῦ θεοῦ
  choice: mga iglesya ng Diyos
  rationale: Ang “iglesya” ang karaniwan at malinaw na katawagan sa mga lokal na pamayanang Kristiyano sa mga liham ni Pablo.
- source_word: τῶν οὐσῶν ἐν τῇ Ἰουδαίᾳ
  choice: na nasa Judea
  rationale: Tuwirang ipinakikita nito ang heograpikong pagkakakilanlan ng mga iglesya sa natural na ayos ng Filipino.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: nakay Jesus na Mesiyas
  rationale: Natural sa Filipino ang “nakay” para sa pakikipag-ugnayang ipinahahayag ng ἐν sa pariralang Paulino. Inilalantad ng “Mesiyas” ang kahulugan at titulong taglay ng Χριστός, habang ang ayos na “Jesus na Mesiyas” ay mas likas kaysa “Mesiyas Jesus.”
- source_word: τὰ αὐτὰ ἐπάθετε
  choice: dumanas din kayo ng gayunding mga bagay
  rationale: Ipinananatili nito ang malawak na “mga bagay” ng τὰ αὐτά at ang diwa ng pagdurusa sa ἐπάθετε nang hindi nililimitahan ang uri ng paghihirap.
- source_word: τῶν ἰδίων συμφυλετῶν
  choice: sarili ninyong mga kababayan
  rationale: Ipinahahayag ng “sarili ninyong” ang diin ng ἰδίων, at ng “mga kababayan” ang magkatuwang na etniko o panlipunang pagkakakilanlan ng συμφυλέται nang hindi nagpapahiwatig na mga lalaki lamang sila.
- source_word: τῶν Ἰουδαίων
  choice: mga Judio
  rationale: Ang “mga Judio” ang karaniwang etnorelihiyosong kahulugan dito. Hindi nito sa sarili nito ipinahihiwatig ang bawat Judio; tinutukoy sa konteksto ang mga partikular na nagpasakit sa mga iglesya sa Judea.
theological_decisions:
- issue: Kung isasalin ang Χριστός bilang titulo o gagamiting nakasanayang anyong “Cristo”
  choice: Jesus na Mesiyas
  alternative: Cristo Jesus
  rationale: Pinananatili sa pangunahing teksto ang kahulugan ng Χριστός bilang titulo. Ginamit ang natural na ayos sa Filipino upang hindi maging matigas ang parirala.
- issue: Saklaw ng τῶν Ἰουδαίων
  choice: mga Judio, nang walang dagdag na nagpapalawak sa saklaw
  alternative: mga taga-Judea
  rationale: Maaaring etnorelihiyoso o heograpiko ang Ἰουδαῖοι. Sa kontekstong ito, maaaring makalito ang “mga taga-Judea” sapagkat nasa Judea rin ang mga iglesyang pinag-uusapan. Gayunman, pinananatili sa talababa ang tunay na leksikal na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga kapatid” bilang natural na pangkongregasyong tawag, “iglesya” bilang karaniwang terminong eklesyal, at “kababayan” bilang di-nakasari at madaling maunawaang katumbas. Pinanatili ang dalawang sensitibong alternatibo—“Cristo” at “mga taga-Judea”—sa mga talababa.
