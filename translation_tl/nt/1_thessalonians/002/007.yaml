  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: δυνάμενοι ἐν βάρει εἶναι ὡς Χριστοῦ ἀπόστολοι· ἀλλὰ ἐγενήθημεν ⸀ἤπιοι ἐν μέσῳ ὑμῶν, ὡς ⸀ἐὰν τροφὸς θάλπῃ τὰ ἑαυτῆς τέκνα·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/007.yaml
  text: though we could have been a burden as apostles of the Messiah[a], yet we became gentle among you[c][b], as a nursing mother cherishes her own children.
translation:
  language: tl
  text: Bagaman maaari sana kaming magpabigat bilang mga apostol ng Mesiyas[b],[a] naging banayad naman kami sa gitna ninyo, gaya ng isang inang nagpapasuso na magiliw na nag-aaruga sa sarili niyang mga anak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “maaari sana naming igiit ang aming awtoridad” o “maaari sana kaming humingi ng nararapat sa amin” bilang mga apostol ng Mesiyas. Literal na sinasabi ng Griyego, “maaari sana kaming maging mabigat.”
    reason: lexical_alternative
  - marker: b
    text: 'Tradisyonal na salin: “mga apostol ni Cristo.”'
    reason: alternative_reading
lexical_decisions:
- source_word: δυνάμενοι
  choice: Bagaman maaari sana kaming
  rationale: Ipinahahayag ang diwang concessive ng participle dahil sa kasunod na ἀλλά, sa natural na Tagalog.
- source_word: ἐν βάρει εἶναι
  choice: magpabigat
  rationale: Pinananatili ang metapora ng bigat at ang lawak ng kahulugan—maaaring tumukoy sa pagpapasan ng pasanin, paggigiit ng awtoridad, o paghingi ng nararapat—nang hindi nililimitahan sa pinansiyal na pabigat.
- source_word: ὡς Χριστοῦ ἀπόστολοι
  choice: bilang mga apostol ng Mesiyas
  rationale: Ang Χριστοῦ ay gumaganap bilang titulo; natural na ipinahahayag ng “ng Mesiyas” ang genitive.
- source_word: ἀλλὰ ἐγενήθημεν
  choice: naging ... naman kami
  rationale: Pinananatili ng “naging” ang verbal force ng γίνομαι, at malinaw na minamarkahan ng “naman” ang pagsalungat.
- source_word: ἤπιοι
  choice: mahinahon
  rationale: Natural at marangal na katumbas ng pagiging banayad o gentle sa pakikitungo.
- source_word: ἐν μέσῳ ὑμῶν
  choice: sa gitna ninyo
  rationale: Malinaw at natural na salin na malapit sa anyo ng Griyego.
- source_word: ὡς ἐὰν τροφὸς
  choice: gaya ng isang inang nagpapasuso
  rationale: Ipinahahayag ang larawang maternal at mapag-aruga; iniiwasan ang modernong klinikal na dating ng “nars.”
- source_word: θάλπῃ
  choice: magiliw na nag-aaruga
  rationale: Ipinahahayag ang mainit, magiliw, at mapagkalingang pag-aalaga na saklaw ng pandiwa.
- source_word: τὰ ἑαυτῆς τέκνα
  choice: sa sarili niyang mga anak
  rationale: Pinananatili ang diin ng ἑαυτῆς na ang mga anak ay kanya mismo.
theological_decisions:
- issue: Pagbibigay-kahulugan sa Χριστοῦ
  choice: Mesiyas
  alternative: Cristo
  rationale: Dito ay titulo ang gamit ng Χριστός, kaya “Mesiyas” ang pangunahing salin; inilalagay sa talababa ang tradisyonal na “Cristo.”
- issue: Saklaw ng ἐν βάρει εἶναι
  choice: magpabigat
  alternative: igiit ang aming awtoridad / humingi ng nararapat sa amin
  rationale: Pinananatili ng pangunahing teksto ang metapora at hindi tiyak na saklaw ng parirala, habang inilalahad sa talababa ang mahahalagang interpretatibong posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Pinanatili ang metapora ng “bigat” at ang mapagmahal na larawang maternal, pati ang tunay na kalabuan ng saklaw ng apostolikong karapatan.
