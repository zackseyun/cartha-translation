  to: Bagaman maaari sana kaming magpabigat bilang mga apostol ng Mesiyas[b],[a] naging banayad naman kami sa gitna ninyo, gaya ng isang inang nagpapasuso na magiliw na nag-aaruga sa sarili niyang mga anak.
