source:
  edition: SBLGNT
  text: τίς γὰρ ἡμῶν ἐλπὶς ἢ χαρὰ ἢ στέφανος καυχήσεως— ἢ οὐχὶ καὶ ὑμεῖς— ἔμπροσθεν τοῦ κυρίου ἡμῶν Ἰησοῦ ἐν τῇ αὐτοῦ παρουσίᾳ;
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/019.yaml
  text: For what is our hope or joy or crown of boasting—is it not indeed you?—before our Lord Jesus at his coming[a].
translation:
  language: tl
  text: Sapagkat ano ang aming pag-asa, kagalakan, o putong na ipinagmamalaki namin—hindi ba kayo rin—sa harap ng ating Panginoong Jesus sa kanyang pagparito[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kanyang presensiya” o “sa kanyang pagdating.” Ang salitang Griyego na παρουσίᾳ ay maaaring tumukoy sa presensiya o pagdating; sa kontekstong ito, tumutukoy ito sa hinaharap na pagparito ng Panginoong Jesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς
  choice: ano
  rationale: Bagaman maaari itong mangahulugang “sino” o “ano,” ang mga kasunod na panaguring “pag-asa,” “kagalakan,” at “putong” ay mga bagay o abstraktong diwa; kaya “ano” ang likas na anyo sa Filipino, habang malinaw na kinikilala sa kasunod na tanong na ang tinutukoy ay ang mga mambabasa.
- source_word: γὰρ
  choice: sapagkat
  rationale: Pinananatili nito ang paliwanag na ugnayan ng talata sa naunang sinabi ni Pablo.
- source_word: ἐλπίς
  choice: pag-asa
  rationale: Ito ang tuwiran at karaniwang salin para sa tiyak at may pagtitiwalang paghihintay.
- source_word: χαρά
  choice: kagalakan
  rationale: Likas at marangal itong katumbas na nagpapanatili sa emosyonal na lakas ng salita.
- source_word: στέφανος καυχήσεως
  choice: putong na maipagmamalaki
  rationale: Ang στέφανος ay putong o koronang iginagawad bilang karangalan o tagumpay. Ang pariralang “na maipagmamalaki” ay likas sa Filipino at pinananatili ang kaugnayan nito sa καύχησις nang hindi ito ginagawang “putong ng kagalakan.”
- source_word: οὐχὶ καὶ ὑμεῖς
  choice: Hindi ba kayo rin
  rationale: Ang οὐχί ay nagpapahiwatig ng inaasahang sagot na oo, at ang καί ay likas na naihahayag ng “rin.”
- source_word: ἔμπροσθεν
  choice: sa harap ng
  rationale: Tuwiran at likas itong nagsasaad ng pagiging nasa presensiya ng isang tao.
- source_word: κυρίου
  choice: Panginoon
  rationale: Ito ang karaniwang salin ng κύριος at angkop sa pagkilala kay Jesus sa talata.
- source_word: παρουσίᾳ
  choice: pagparito
  rationale: Sa kontekstong eskatolohikal, malinaw na ipinahahayag ng “pagparito” ang hinaharap na pagdating ng Panginoong Jesus; pinananatili sa talababa ang mas malawak na leksikal na diwa ng presensiya o pagdating.
theological_decisions:
- issue: Ang kahulugan ng παρουσίᾳ sa kontekstong eskatolohikal
  choice: pagparito
  alternative: presensiya o pagdating
  rationale: Tinutukoy ng konteksto ang hinaharap na pagdating ng Panginoong Jesus, kaya malinaw at natural ang “pagparito.” Gayunman, hindi inaalis ang saklaw ng salitang Griyego na maaari ring tumukoy sa presensiya o pagdating; inilalahad iyon sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang retorikal na tanong at ang paliwanag na ugnayan sa naunang konteksto. Ginamit ang “putong” sa halip na “korona” upang maipakita ang larawan ng gantimpalang putong sa sinaunang daigdig, ngunit inayos ang kasunod na parirala bilang “na maipagmamalaki” para sa likas na daloy sa Filipino.
