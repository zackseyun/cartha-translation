  text: ⸀διότι ἠθελήσαμεν ἐλθεῖν πρὸς ὑμᾶς, ἐγὼ μὲν Παῦλος καὶ ἅπαξ καὶ δίς, καὶ ἐνέκοψεν ἡμᾶς ὁ Σατανᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/018.yaml
  text: Because we wanted to come to you—I[a], Paul, again and again—but Satan hindered us.
translation:
  language: tl
  text: Sapagkat ninais naming pumunta sa inyo—ako mismo, si Pablo, nang higit sa isang ulit[a]—ngunit hinadlangan kami ni Satanas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “minsan at makalawa,” isang idyomang nangangahulugang “higit sa isang ulit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: Sapagkat
  rationale: Nagpapakilala ito ng paliwanag o dahilan para sa naunang pahayag. Likas at marangal ang “sapagkat” sa ganitong ugnayan.
- source_word: ἠθελήσαμεν
  choice: ninais naming
  rationale: Ipinahahayag ng pandiwa ang hangarin o kusang pagnanais. Pinananatili ng “ninais naming” ang maramihang simuno at ang buod na aspekto ng aorist.
- source_word: ἐλθεῖν πρὸς ὑμᾶς
  choice: pumunta sa inyo
  rationale: Tuwirang pinananatili nito ang kilos patungo sa mga taga-Tesalonica nang hindi idinaragdag ang “bumalik” o nililimitahan sa kahulugang “dumalaw.”
- source_word: ἐγὼ μὲν Παῦλος
  choice: ako mismo, si Pablo
  rationale: Ibinubukod at binibigyang-diin nito si Pablo mula sa naunang “kami,” gaya ng diin ng ἐγώ at μέν.
- source_word: καὶ ἅπαξ καὶ δίς
  choice: nang higit sa isang ulit
  rationale: Ang literal na “minsan at makalawa” ay idyomatikong tumutukoy sa mahigit isang pagkakataon. Malinaw sa makabagong mambabasa ang napiling salin nang hindi pinalalabis ang dalas.
- source_word: ἐνέκοψεν
  choice: hinadlangan
  rationale: Ipinahahayag nito ang pagharang o pagpigil sa pagsulong, ngunit hindi kinakailangang magpahiwatig ng ganap at permanenteng pagpigil.
- source_word: ὁ Σατανᾶς
  choice: Satanas
  rationale: Ito ang nakagawiang salin ng personal na pangalan o titulong ginagamit sa Bagong Tipan at pinananatili ang tahasang personal na sanggunian.
theological_decisions:
- issue: Ang pagkilos ni Satanas sa paghadlang sa paglalakbay ni Pablo
  choice: hinadlangan kami ni Satanas
  alternative: pinigilan kami ng Kaaway
  rationale: Tahasang iniuugnay ng teksto kay Satanas ang paghadlang. Pinananatili ng salin ang personal niyang pagkilos nang hindi ito ginagawang isang impersonal na pangyayari o pinalalakas tungo sa ganap na determinismong hindi hinihingi ng ἐνέκοψεν.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ako mismo, si Pablo” upang maging natural ang pagbubukod kay Pablo sa loob ng pangungusap, at inilagay ang talababa sa pariralang aktuwal nitong ipinapaliwanag.
