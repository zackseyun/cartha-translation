base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/005.yaml
  text: For we never came with flattering speech[a], as you know[b], nor with a pretext for greed—God is witness.
translation:
  language: tl
  text: Sapagkat hindi kami kailanman dumating na may mapambolang pananalita[a], gaya ng alam ninyo, ni may pagkukunwaring nagtatakip sa kasakiman[b]—saksi ang Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “may pambobola”; sa literal, “sa salita ng pambobola.”
    reason: lexical_alternative
  - marker: b
    text: O, “ni may pantabing para sa kasakiman” o “ni may pagkukunwari dahil sa kasakiman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔτε γάρ ποτε
  choice: Sapagkat hindi kami kailanman
  rationale: Ang “Sapagkat” ay nagpapanatili sa ugnayang paliwanag ng γάρ sa naunang talata. Ang οὔτε kasama ng ποτέ ay likas na ipinahahayag sa Tagalog bilang mariing “hindi ... kailanman.”
- source_word: ἐν λόγῳ κολακείας
  choice: na may mapambolang pananalita
  rationale: Ang λόγος dito ay tumutukoy sa pananalita, hindi lamang sa isang salita, at ang κολακεία ay pambobolang naglalayong makuha ang loob ng iba. Likas at malinaw sa kasalukuyang Tagalog ang “mapambolang pananalita.”
- source_word: ἐγενήθημεν
  choice: dumating
  rationale: Sa konteksto ng pagdalaw ng mga misyonero, inilalarawan ng pandiwa kung paano sila dumating o nagpakilala sa mga taga-Tesalonica. Ang “dumating” ay natural at hindi labis na nagpapaliwanag.
- source_word: καθὼς οἴδατε
  choice: gaya ng alam ninyo
  rationale: Tuwirang pinananatili nito ang pag-apela ni Pablo sa sariling kaalaman ng mga mambabasa.
- source_word: ἐν προφάσει πλεονεξίας
  choice: ni nagkunwari upang pagtakpan ang kasakiman
  rationale: Maaaring mangahulugan ang πρόφασις ng dahilan, pagkukunwari, o panlabas na takip; ang πλεονεξία ay sakim na paghahangad ng pakinabang. Ipinahahayag ng salin ang ideya ng kasakimang ikinukubli sa likod ng isang pagkukunwari, sa natural na Tagalog.
- source_word: θεὸς μάρτυς
  choice: saksi ang Diyos
  rationale: Pinananatili nito ang maikli at taimtim na pag-apela sa Diyos bilang saksi, nang hindi nagdaragdag ng panghalip na wala sa Griyego.
theological_decisions:
- issue: Saklaw ng pagtatanggi ni Pablo tungkol sa paraan at motibo ng kanilang paglilingkod
  choice: Itinatanggi ng talata kapuwa ang mapambolang pananalita at ang pagkukunwaring nagtatakip sa kasakiman.
  alternative: Unawain ito bilang pangkalahatang pagtanggi sa lahat ng maingat o mahusay na retorika, o bilang pagtukoy lamang sa pandarayang pinansiyal.
  rationale: Tiyak na pinapangalanan ng Griyego ang κολακεία at πλεονεξία. Hindi nito hinahatulan ang lahat ng mahusay na pananalita, at bagaman maaaring kasama sa kasakiman ang salapi, hindi kailangang limitahan dito lamang ang kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mapambolang pananalita” sa halip na mas kolokyal na pananalita, at ang maikling “saksi ang Diyos” upang mapanatili ang taimtim na lakas ng hulihang parirala.
