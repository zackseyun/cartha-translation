  yaml_path: translation/nt/1_thessalonians/002/010.yaml
  text: You are witnesses[a], and God also, how devoutly and righteously and blamelessly we behaved toward you who believe[b],
translation:
  language: tl
  text: Kayo ang mga saksi, at gayundin ang Diyos, kung paanong namuhay kami nang banal, matuwid, at walang kapintasan sa inyo na mga sumasampalataya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa gitna ninyo na mga sumasampalataya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς μάρτυρες καὶ ὁ θεός
  choice: Kayo ang mga saksi, at gayundin ang Diyos
  rationale: Pinananatili ang mariing pagharap muna sa mga taga-Tesalonica at saka ang pagbanggit sa Diyos bilang saksi; nililinaw ng likas na Tagalog ang ipinahihiwatig na pandiwang 'ay'.
- source_word: ὡς
  choice: kung gaano
  rationale: Ipinakikilala nito ang paraan o antas na makikita sa asal ng mga misyonero at natural itong kasunod ng panawagan sa mga saksi.
- source_word: ὁσίως
  choice: kabanal
  rationale: Ipinahahayag ang asal na may kabanalan at debosyon sa harap ng Diyos; ang alternatibong 'taimtim sa Diyos' ay inilagay sa talababa upang ilantad ang dimensiyong nakatuon sa Diyos.
- source_word: δικαίως
  choice: matuwid
  rationale: Tuwirang naghahatid ng wastong asal sa moral na diwa at natural na kaagapay ng iba pang paglalarawan.
- source_word: ἀμέμπτως
  choice: walang kapintasan
  rationale: Nagsasaad ng asal na hindi mapaparatangan nang may katuwiran, nang hindi ipinahihiwatig ang ganap na kawalang-kasalanan.
- source_word: ὑμῖν
  choice: sa inyo
  rationale: Pinananatili ang malawak na gamit ng datibo at ang tunay na kalabuan kung ito ay tumutukoy sa pakikitungo sa kanila o pamumuhay sa gitna nila.
- source_word: τοῖς πιστεύουσιν
  choice: na mga sumasampalataya
  rationale: Pinananatili ang pandiwang lakas ng kasalukuyang participle at malinaw na tumutukoy sa mga kausap.
- source_word: ἐγενήθημεν
  choice: ang naging asal namin
  rationale: Sa piling ng mga pang-abay ng paraan, ang γίνομαι ay tumutukoy sa kung paano sila namuhay o kumilos; natural itong naipapahayag sa Tagalog bilang 'naging asal namin'.
theological_decisions:
- issue: Mga paglalarawang etikal sa asal ng mga apostolikong misyonero
  choice: Ang tatlong paglalarawan ay tumutukoy sa aktuwal nilang asal na nasaksihan ng Diyos at ng mga mananampalataya.
  alternative: Mere retorikal lamang ang pagtatanggol, o ipinapahayag nito ang ganap na kawalang-kasalanan.
  rationale: Pinananatili ng salin ang taimtim na pag-angkin ng integridad ngunit hindi nito dinaragdagan ang teksto ng pahayag tungkol sa ganap na moral na kasakdalan.
- issue: Relasyon ng datibong ὑμῖν sa kanilang asal
  choice: sa inyo
  alternative: sa gitna ninyo
  rationale: Ang 'sa inyo' ay likas sa Tagalog at hindi sapilitang nagpapasiya kung ang diin ay pakikitungo sa kanila o pamumuhay sa piling nila.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'walang kapintasan' sa halip na mas teknikal na anyo, at ang 'sa inyo' upang mapanatili ang kaluwagan ng datibong Griyego.
