    rationale: Pangngalan ang “kabanal” ngunit pang-uri ang “matuwid” at “walang kapintasan,” kaya hindi pantay ang estruktura. Ang magkakaparis na pang-abay pagkatapos ng “namuhay” ay mas malinaw at likas.
