  to: Kayo ang mga saksi, at gayundin ang Diyos, kung paanong namuhay kami nang banal, matuwid, at walang kapintasan sa inyo na mga sumasampalataya[a].
  rationale: Pinalitan ang “kung gaano” ng “kung paanong” upang maipahayag ang paraan na tinutukoy ng ὡς. Inayos ang panaguri upang ang tatlong paglalarawan ng asal ay magkakatugma at natural sa Filipino. Hindi isinama ang dating talababa para sa “kabanal,” dahil ang binagong pangunahing salin ay gumagamit na ng “nang banal”; pinanatili ang talababa para sa posibleng “sa gitna ninyo,” na kumakatawan sa alternatibong pag-unawa sa datibong ὑμῖν.
