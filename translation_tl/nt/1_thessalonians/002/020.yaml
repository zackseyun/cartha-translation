  source_fidelity: 'Tapat ang salin sa Griyego: ang hayag na maramihang “kayo” ay napapanatili, ang “Sapagkat” ay wastong nagpapakita ng paliwanag na γάρ, at ang “aming karangalan at kagalakan” ay maayos na tumutumbas sa ἡ δόξα ἡμῶν καὶ ἡ χαρά. Hindi kinakailangang magdagdag ng “mismo” para sa diin ng ὑμεῖς, sapagkat natural na ang ayos na “kayo ang.”'
