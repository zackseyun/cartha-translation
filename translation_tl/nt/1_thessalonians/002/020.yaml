  text: For you are our glory and joy[a].
translation:
  language: tl
  text: Sapagkat kayo ang aming karangalan at kagalakan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kapurihan” o “ipinagmamalaki” sa halip na “karangalan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: kayo
  rationale: Ang hayag na panghalip na pangalawang panauhang maramihan ay may diin; natural na naipahahayag ito sa Tagalog sa ayos na “kayo ang.”
- source_word: γάρ
  choice: Sapagkat
  rationale: Nagbibigay ito ng dahilan o paliwanag sa naunang pahayag at pinananatili ang lohikal na ugnayan.
- source_word: ἐστε
  choice: ang
  rationale: Sa pangungusap na panaguri sa Tagalog, likas na ipinahahayag ang copula sa pamamagitan ng ayos na “kayo ang,” nang walang hiwalay na katumbas ng “are.”
- source_word: ἡ δόξα ἡμῶν
  choice: aming karangalan
  rationale: Ang “karangalan” ay likas at marangal na salin ng δόξα sa ugnayang ito, habang pinananatili ang diwang ang mga taga-Tesalonica ang dahilan o pinagmumulan ng dangal ng mga misyonero.
- source_word: ἡ χαρά
  choice: kagalakan
  rationale: Tuwirang tumutukoy sa galak bilang pangngalan at angkop sa marangal ngunit madaling maunawaang rehistro.
theological_decisions:
- issue: Pagpapakahulugan sa δόξα sa isang personal na pahayag ni Pablo
  choice: karangalan
  alternative: kapurihan; ipinagmamalaki
  rationale: Hindi ito teknikal na pahayag-doktrina kundi paglalarawan sa mga mananampalataya bilang karangalan at kagalakan ng mga misyonero. Pinananatili ng “karangalan” ang lawak at bigat ng δόξα nang hindi ito nililimitahan sa personal na pagmamapuri.
translation_notes:
  register: Modernong Filipino Tagalog na maikli, natural, at marangal. Ginamit ang “Sapagkat” upang malinaw na iugnay ang talata sa naunang pahayag, at “kagalakan” upang mapanatili ang anyong pangngalan ng χαρά.
