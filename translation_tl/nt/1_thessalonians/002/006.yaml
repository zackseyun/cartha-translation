  source_fidelity: Tapat ang salin sa Griyego. Ang «ni hindi» ay angkop na dugtong sa naunang pagtanggi; ang «kami» ay wastong ipinahihiwatig ng konteksto. Naipapahayag ng «naghahangad ng papuri mula sa mga tao» ang ζητοῦντες ἐξ ἀνθρώπων δόξαν, at ang «mula man sa inyo o sa iba» ay malinaw na sumasaklaw sa ἀφ’ ὑμῶν ... ἀπ’ ἄλλων.
