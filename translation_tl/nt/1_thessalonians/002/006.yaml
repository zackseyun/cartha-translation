  yaml_path: translation/nt/1_thessalonians/002/006.yaml
  text: nor seeking glory from people[a], neither from you nor from others,
translation:
  language: tl
  text: ni hindi kami naghangad ng papuri mula sa mga tao[a]—mula man sa inyo o sa iba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “karangalan” o “kaluwalhatian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητοῦντες
  choice: naghangad
  rationale: Ipinapahayag ang pagsisikap o pagnanais na matamo ang isang bagay; natural itong Tagalog sa konteksto nang hindi dinaragdagan ang motibo.
- source_word: ἐξ ἀνθρώπων
  choice: mula sa mga tao
  rationale: Pangkalahatan ang ἄνθρωποι at hindi tumutukoy lamang sa mga lalaki.
- source_word: δόξαν
  choice: papuri
  rationale: Sa kontekstong ito, ang δόξα na nagmumula sa mga tao ay tumutukoy sa kanilang pagkilala o mataas na pagtingin. Mas likas at malinaw dito ang 'papuri' kaysa literal na 'kaluwalhatian,' habang inilalagay sa talababa ang iba pang lehitimong katumbas.
- source_word: οὔτε ... οὔτε ... οὔτε
  choice: ni hindi ... mula man ... o
  rationale: Pinananatili ang sunod-sunod na pagtanggi at ang ugnayan nito sa naunang sugnay, gamit ang likas na kayariang Tagalog.
- source_word: ἀφ’ ὑμῶν
  choice: mula man sa inyo
  rationale: Tuwirang isinasalin ang panghalip na pangmaramihan at ikinakabit sa alternatibong pares.
- source_word: ἀπ’ ἄλλων
  choice: o sa iba
  rationale: Maikli at natural na tumutukoy sa ibang mga tao bukod sa mga taga-Tesalonica.
theological_decisions:
- issue: Ang kahulugan ng δόξα na hinahangad
  choice: papuri o pagkilalang mula sa mga tao
  alternative: karangalan o kaluwalhatiang mula sa mga tao
  rationale: Nililinaw ng ἐξ ἀνθρώπων na pagkilala ng tao, hindi kaluwalhatiang mula sa Diyos, ang tinutukoy. Hindi nilulutas nang labis ang lawak ng δόξα; nakatala sa talababa ang mga posibleng katumbas.
translation_notes:
  register: Makabago, dignidad, at madaling maunawaang Filipino. Ginamit ang 'kami' dahil ang participle ay tumutukoy sa ipinahihiwatig na pangmaramihang simuno sa konteksto; pinananatili ng pambungad na 'ni hindi' ang pagkakaugnay sa naunang talata.
