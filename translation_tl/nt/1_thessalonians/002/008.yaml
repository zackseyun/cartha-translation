  to: Sa ganitong tindi ng pananabik namin sa inyo,[a] ikinalugod naming ibahagi sa inyo hindi lamang ang ebanghelyo ng Diyos kundi pati ang sarili naming mga buhay,[b] sapagkat napamahal na kayo sa amin.
