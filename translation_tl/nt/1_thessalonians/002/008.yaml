  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὕτως ὁμειρόμενοι ὑμῶν εὐδοκοῦμεν μεταδοῦναι ὑμῖν οὐ μόνον τὸ εὐαγγέλιον τοῦ θεοῦ ἀλλὰ καὶ τὰς ἑαυτῶν ψυχάς, διότι ἀγαπητοὶ ἡμῖν ⸀ἐγενήθητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/008.yaml
  text: So[a], longing for you in this way, we were pleased to share with you not only the gospel of God but also our own lives[b], because you had become dear to us.
translation:
  language: tl
  text: Sa ganitong tindi ng pananabik namin sa inyo,[a] ikinalugod naming ibahagi sa inyo hindi lamang ang ebanghelyo ng Diyos kundi pati ang sarili naming mga buhay,[b] sapagkat napamahal na kayo sa amin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dahil sa matindi naming pagmamahal sa inyo” o “dahil sabik na sabik kami sa inyo.” Bihira ang salitang Griyego na ginamit dito at nagpapahayag ng masidhing pananabik o pagmamahal.
    reason: lexical_alternative
  - marker: b
    text: O “ang sarili naming mga kaluluwa” o “ang aming mga sarili.” Dito, ipinahihiwatig ng “mga buhay” ang personal at mapagsakripisyong pagbibigay nila ng kanilang sarili.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως ὁμειρόμενοι ὑμῶν
  choice: Kaya, sa matindi naming pananabik sa inyo
  rationale: Ang οὕτως ay nag-uugnay sa naunang larawan ng mapagkalingang pag-aaruga, samantalang ang bihirang ὁμειρόμενοι ay nagpapahayag ng masidhing pananabik at pagmamahal. Pinananatili ng parirala ang ugnayan at emosyonal na diin nang natural sa Tagalog.
- source_word: εὐδοκοῦμεν
  choice: ikinalugod naming
  rationale: Ipinahihiwatig ng pandiwa ang kusang-loob na kasiyahan, hindi lamang pagsang-ayon.
- source_word: μεταδοῦναι
  choice: ibahagi
  rationale: Ang pandiwa ay tumutukoy sa pagbibigay ng bahagi mula sa sariling tinataglay at akma sa kapuwa ebanghelyo at buhay.
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: ang ebanghelyo ng Diyos
  rationale: Pinananatili nito ang tuwirang anyo ng genitive at ang pamilyar na bokabularyong ginagamit sa mga sulat ni Pablo.
- source_word: τὰς ἑαυτῶν ψυχάς
  choice: ang aming sariling buhay
  rationale: Sa konteksto, ang ψυχή ay tumutukoy sa buhay o buong sarili na kusang ibinibigay, hindi lamang sa di-materyal na kaluluwa. Ang 'sariling' ay nagpapanatili sa diin ng ἑαυτῶν.
- source_word: διότι
  choice: sapagkat
  rationale: Malinaw nitong ipinakikita ang dahilan ng kanilang kusang pagbabahagi ng sarili.
- source_word: ἀγαπητοὶ ἡμῖν ἐγενήθητε
  choice: napamahal na kayo sa amin
  rationale: Natural nitong ipinahahayag sa Tagalog ang pagdating sa kalagayang lubhang minamahal o mahalaga sa kanila, kasama ang init ng personal na ugnayan.
theological_decisions:
- issue: Kahulugan ng ψυχάς sa paglalarawan ni Pablo sa pagbibigay ng sarili
  choice: buhay
  alternative: mga kaluluwa; buong sarili
  rationale: Ang konteksto ay personal at mapagsakripisyong pagbibigay ng mga misyonero, hindi isang pahayag tungkol sa paghihiwalay ng katawan at kaluluwa. Pinananatili sa talababa ang mga leksikal na alternatibo.
- issue: Lakas ng ἀγαπητοί
  choice: napamahal na kayo sa amin
  alternative: kayo ay naging mga minamahal namin
  rationale: Pinananatili nito ang personal na pagmamahal at resultang kalagayan nang hindi nagdaragdag ng teknikal o denominasyonal na kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'ikinalugod,' 'ebanghelyo,' at 'sapagkat' bilang pormal ngunit karaniwang nauunawaang mga salita; iniwasan ang lipas o labis na teknikal na pananalita.
