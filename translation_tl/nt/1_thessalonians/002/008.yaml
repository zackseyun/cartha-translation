  terminology: Ang “ebanghelyo ng Diyos,” “ikinalugod,” at “napamahal na kayo sa amin” ay angkop at pare-pareho ang rehistro. Pinananatili ng “buhay” ang kontekstuwal na kahulugan ng ψυχαί nang hindi ipinipilit ang isang makitid na antropolohikal na kahulugan. Inaayos ang alternatibong talababa upang ang “our very selves” ay maging maramihang “mga sarili namin.”
