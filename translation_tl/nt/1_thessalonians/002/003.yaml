translation:
  language: tl
  text: Sapagkat ang aming panawagan[a] ay hindi nagmumula sa kamalian[b], ni sa karumihan, ni inihaharap nang may pandaraya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “panghihikayat.” Maaaring mangahulugan ang Griyegong παράκλησις ng panawagan, panghihikayat, o pagpapalakas ng loob ayon sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: O “panlilinlang.” Maaari ring tumukoy ang Griyegong πλάνη sa pagkaligaw o panlilinlang; mas tuwirang ipinahahayag ng kasunod na “pandaraya” ang sadyang panlilinlang.
    reason: lexical_alternative
lexical_decisions:
- source_word: παράκλησις
  choice: panawagan
  rationale: Ang “panawagan” ay natural na Filipino para sa taimtim na paghimok o pakiusap na inihaharap sa mga nakikinig. Hindi nito nililimitahan ang salita sa pagbibigay-aliw lamang o sa nilalaman ng mensahe lamang.
- source_word: πλάνης
  choice: kamalian
  rationale: 'Ipinahihiwatig ng ἐκ ang pinagmulan: ang panawagan ay hindi nagmumula sa mali o ligaw na kaisipan. Pinananatili ng “kamalian” ang posibleng kaibhan nito sa δόλος, na mas tuwirang tumutukoy sa sinasadyang pandaraya.'
- source_word: ἀκαθαρσίας
  choice: karumihan
  rationale: Pinananatili ng “karumihan” ang malawak na moral na diwa ng salita nang hindi ito nililimitahan sa seksuwal na kasalanan, sapagkat walang gayong pagtutukoy sa talata.
- source_word: δόλῳ
  choice: nang may pandaraya
  rationale: Malinaw na ipinahahayag ng “nang may pandaraya” ang paraan o kalagayang maaaring tukuyin ng ἐν at ang diwa ng sadyang panlilinlang o katusuhan.
- source_word: ἐκ ... ἐξ ... ἐν
  choice: nagmumula sa ... o ... ni ginagawa nang may ...
  rationale: Ibinubukod ng salin ang pinagmulan na ipinahihiwatig ng ἐκ/ἐξ mula sa paraan na ipinahihiwatig ng ἐν. Idinagdag ang “ginagawa” upang maging natural at malinaw sa Filipino ang huling parirala nang hindi binabago ang tatlong pagtanggi.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikita ng “Sapagkat” na ang pangungusap ay nagpapaliwanag at umuugnay sa naunang pahayag.
theological_decisions:
- issue: Saklaw ng ἀκαθαρσία sa pagtanggi ni Pablo
  choice: Isinalin nang malawak bilang “karumihan.”
  alternative: “seksuwal na karumihan” o “kalaswaan”
  rationale: Bagaman maaaring magkaroon ng seksuwal na pahiwatig ang salita sa ilang konteksto, hindi tinutukoy ng talatang ito ang isang partikular na uri ng karumihan. Iniiwasan ng malawak na salin ang pagpasok ng paratang na hindi tahasang sinasabi ng Griyego.
- issue: Ugnayan ng πλάνη at δόλος
  choice: Pinag-iba bilang “kamalian” at “pandaraya.”
  alternative: Isalin ang πλάνη bilang “panlilinlang,” na maaaring magpalapit sa kahulugan nito sa δόλος.
  rationale: Maaaring tumukoy ang πλάνη sa panlilinlang o pagkaligaw, ngunit ang δόλος ay mas malinaw na nagsasaad ng sinasadyang pandaraya. Pinananatili ng salin ang posibleng retorikal na kaibhan nang hindi itinatangging may saklaw na magkasanib ang mga salita.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “panawagan” sa halip na mas pormal o makalumang “pangangaral/pamamanhik,” at pinanatili ang tatlong bahagi ng pagtanggi pati ang pagkakaiba ng pinagmulan at paraan.
