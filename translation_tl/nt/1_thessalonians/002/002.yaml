  to: Ngunit pagkatapos naming magdusa at pagmalupitan at hamakin[a], gaya ng alam ninyo, sa Filipos, naglakas-loob kami sa aming Diyos[b] na sabihin sa inyo ang magandang balita ng Diyos sa gitna ng matinding pakikibaka[c].
