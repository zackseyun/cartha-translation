    issue: “ating Diyos” para sa ἐν τῷ θεῷ ἡμῶν
    rationale: Sa Tagalog, inklusibo ang “ating,” samantalang ang unang panauhang pangmaramihan sa talata ay ang mga misyonerong nagsasalita. Mas tumpak ang eksklusibong “aming Diyos,” nang hindi ipinagkakaila ang pananampalataya ng mga kausap.
  - severity: medium
    issue: “lapastanganin” bilang salin ng ὑβρισθέντες
    rationale: Ang “lapastanganin” ay karaniwang tumutukoy sa paglapastangan sa banal o sagrado at hindi sapat na tiyak para sa mapanghamak, marahas, at kahiya-hiyang pagtrato sa mga tao. Ang “pagmalupitan at hamakin” ay mas angkop at likas.
