source:
  edition: SBLGNT
  text: ἀλλὰ προπαθόντες καὶ ὑβρισθέντες καθὼς οἴδατε ἐν Φιλίπποις ἐπαρρησιασάμεθα ἐν τῷ θεῷ ἡμῶν λαλῆσαι πρὸς ὑμᾶς τὸ εὐαγγέλιον τοῦ θεοῦ ἐν πολλῷ ἀγῶνι.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/002.yaml
  text: But after we had already suffered and been shamefully mistreated[a], as you know, in Philippi[c][b], we were bold in our God to speak the gospel of God to you amid much conflict.
translation:
  language: tl
  text: Ngunit pagkatapos naming magdusa at pagmalupitan at hamakin[a], gaya ng alam ninyo, sa Filipos, naglakas-loob kami sa aming Diyos[b] na sabihin sa inyo ang magandang balita ng Diyos sa gitna ng matinding pakikibaka[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pagmalupitan nang kahiya-hiya,” “abusuhin,” o “tratuhin nang may pang-aalipusta.” Kasama sa pandiwang Griyego ang mapanghamak at kahiya-hiyang pagtrato, hindi lamang berbal na pang-iinsulto.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “buong tapang kaming nagsalita sa aming Diyos.” Ang pandiwang Griyego ay maaari nang magsama ng diwa ng matapang na pagsasalita; dito ay inihiwalay ang “naglakas-loob” upang maipakita ang kasunod na “sabihin.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “sa gitna ng malaking tunggalian” o “sa gitna ng matinding pagsalungat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ngunit
  rationale: Malinaw na ipinapakita ang matibay na pagsalungat sa naunang kaisipan nang hindi nagpapasok ng paliwanag na wala sa Griyego.
- source_word: προπαθόντες
  choice: matapos na kaming magdusa
  rationale: Ipinahihiwatig ng aorist participle at ng unlaping προ- na nauna ang pagdurusa sa pangunahing kilos.
- source_word: ὑβρισθέντες
  choice: lapastanganin
  rationale: Sinasaklaw ng “lapastanganin” ang mapang-abuso at mapanghamak na pagtrato, hindi lamang ang berbal na pang-iinsulto.
- source_word: καθὼς οἴδατε
  choice: gaya ng alam ninyo
  rationale: Likas at tuwirang paningit na umaapela sa nalalaman na ng mga taga-Tesalonica.
- source_word: ἐν Φιλίπποις
  choice: sa Filipos
  rationale: Karaniwang anyong Filipino ng pangalan ng lugar.
- source_word: ἐπαρρησιασάμεθα
  choice: naglakas-loob kami
  rationale: Ipinapahayag ang tapang at kalayaang magsalita, habang iniiwan sa kasunod na infinitive ang mismong kilos ng pagsasalita.
- source_word: ἐν τῷ θεῷ ἡμῶν
  choice: sa ating Diyos
  rationale: Pinananatili ang malawak na puwersa ng ἐν bilang saklaw o saligan ng katapangan at hindi ito nililimitahan sa tahasang instrumental na “sa tulong ng.”
- source_word: λαλῆσαι πρὸς ὑμᾶς
  choice: na sabihin sa inyo
  rationale: Natural sa modernong Tagalog at pinananatiling payak ang pandiwa, yamang ang nilalaman ay tinutukoy ng kasunod na parirala.
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: ang magandang balita ng Diyos
  rationale: Malinaw sa karaniwang mambabasa at pinananatili ang genitibong ugnayan, na maaaring tumukoy sa Diyos bilang pinagmulan o paksa nang hindi ito nilulutas.
- source_word: ἐν πολλῷ ἀγῶνι
  choice: sa gitna ng matinding pakikibaka
  rationale: Pinananatili ang larawang may tunggalian at matinding pagsisikap nang hindi ito agad nililimitahan sa panlabas na pagsalungat lamang.
theological_decisions:
- issue: Puwersa ng ἐν τῷ θεῷ ἡμῶν
  choice: sa ating Diyos
  alternative: sa tulong ng ating Diyos; dahil sa pagtitiwala sa ating Diyos
  rationale: Ang Griyego ay maaaring magpahiwatig ng saklaw, saligan, o kaugnayan ng katapangan sa Diyos. Ang salin ay sadyang hindi ginagawang instrumental o sikolohikal lamang ang parirala.
- issue: Kahulugan ng genitive sa τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: magandang balita ng Diyos
  alternative: magandang balitang mula sa Diyos; magandang balita tungkol sa Diyos
  rationale: Pinananatili ang tunay na lawak ng genitive sa halip na piliin lamang ang pinagmulan o nilalaman ng magandang balita.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “magandang balita” para sa εὐαγγέλιον at “Filipos” bilang nakagawiang anyong Filipino. Ang “ating Diyos” ay likas na inklusibo sa nagsasalita at sa mga kausap, alinsunod sa ἡμῶν.
