  naturalness: Natural at marangal ang rehistro, ngunit mas malinaw at mas maayos ang magkakatugmang pandiwa kung tahasang inuulit ang “namin” at inilalagay ang “kayong” sa huling paghimok.
  terminology: Ang “Diyos,” “kaharian,” at “kaluwalhatian” ay angkop at pare-pareho. Ang “mamuhay” ay likas na modernong Tagalog para sa metaporang περιπατεῖν, at ang talababa ay sapat na nagtatala ng literal na larawan.
