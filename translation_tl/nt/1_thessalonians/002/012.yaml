  text: παρακαλοῦντες ὑμᾶς καὶ παραμυθούμενοι καὶ μαρτυρόμενοι, εἰς τὸ ⸀περιπατεῖν ὑμᾶς ἀξίως τοῦ θεοῦ τοῦ καλοῦντος ὑμᾶς εἰς τὴν ἑαυτοῦ βασιλείαν καὶ δόξαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/012.yaml
  text: encouraging[a], comforting, and urging you to walk worthily of God[c][b], who calls you into his own kingdom and glory.
translation:
  language: tl
  text: Pinalalakas namin ang inyong loob, inaaliw namin kayo, at taimtim naming hinihimok kayong mamuhay[a] nang karapat-dapat sa Diyos, na tumatawag sa inyo tungo sa sarili niyang kaharian at kaluwalhatian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “lumakad.” Karaniwang metapora ito sa Biblia para sa paraan ng pamumuhay o pag-uugali.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλοῦντες
  choice: pinalalakas namin ang inyong loob
  rationale: Ipinahahayag ang patuloy at mapagkalingang pagpapalakas-loob sa konteksto ng paghahalintulad ni Pablo sa isang ama; hindi ito kasingtindi ng maaaring ipahiwatig ng “pinagsasabihan.”
- source_word: παραμυθούμενοι
  choice: inaaliw kayo
  rationale: Pinananatili ang natatanging diwa ng mapagmalasakit at nakaaaliw na pananalita, bagaman magkakapatong ang kahulugan nito at ng παρακαλοῦντες.
- source_word: μαρτυρόμενοι
  choice: taimtim na hinihimok
  rationale: Sa kontekstong ito, tumutukoy ito sa mariin at taimtim na pagpapatotoo o paghimok; malinaw sa karaniwang mambabasa ang “taimtim na hinihimok” nang hindi nawawala ang bigat.
- source_word: εἰς τὸ περιπατεῖν
  choice: na mamuhay
  rationale: Ang literal na “lumakad” ay metapora para sa asal o paraan ng pamumuhay. Sa modernong Tagalog, mas likas at agad na malinaw ang “mamuhay,” habang ipinapaliwanag sa talababa ang metapora.
- source_word: ἀξίως τοῦ θεοῦ
  choice: nang karapat-dapat sa Diyos
  rationale: Likas na Tagalog na pagpapahayag ng pamumuhay na naaayon sa pagkakilala at kaugnayan sa Diyos, nang hindi ipinahihiwatig na pinagkakakitaan ang pagtanggap ng Diyos.
- source_word: τοῦ καλοῦντος ὑμᾶς
  choice: na tumatawag sa inyo
  rationale: Pinananatili ang aspektong pangkasalukuyan ng participle at hindi ipinipilit kung ang pagtawag ay dapat unawain lamang bilang nakaraan o bilang tiyak na mekanismong teolohikal.
- source_word: εἰς τὴν ἑαυτοῦ βασιλείαν καὶ δόξαν
  choice: upang makibahagi sa sarili niyang kaharian at kaluwalhatian
  rationale: Ang εἰς ay nagpapahiwatig ng pagpasok tungo sa pakikibahagi; ang “sarili niyang” ay nagpapanatili sa diin ng ἑαυτοῦ, at nananatiling magkatambal ang kaharian at kaluwalhatian.
theological_decisions:
- issue: Kung pananatilihin sa pangunahing teksto ang metapora ng περιπατεῖν
  choice: Isalin bilang “mamuhay,” na may talababa tungkol sa literal na “lumakad”
  alternative: “lumakad”
  rationale: Bagaman mahalaga ang biblikal na metapora, sa kasalukuyang Tagalog ang “lumakad nang karapat-dapat” ay maaaring maunawaan bilang pisikal na paglakad. Ang “mamuhay” ang likas na katumbas ng nilalayong asal, at pinananatili ng talababa ang anyong metaporikal.
- issue: Ang panahon at bisa ng pagtawag ng Diyos sa τοῦ καλοῦντος
  choice: “na tumatawag sa inyo”
  alternative: “na tumawag sa inyo”
  rationale: Ang present participle ay natural na naipapahayag sa kasalukuyan. Hindi nito nilulutas nang labis ang teolohikal na tanong tungkol sa panahon o paraan ng banal na pagtawag.
- issue: Kahulugan ng εἰς bago ang kaharian at kaluwalhatian
  choice: “upang makibahagi sa”
  alternative: “papasok sa”
  rationale: Ipinahahayag nito ang tunguhin ng pagtawag at ang pakikibahagi sa kaharian at kaluwalhatian nang hindi ginagawang purong lokasyon ang mga ito.
translation_notes:
  register: 'Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “inyong/inyo” para sa maramihang kausap. Ang tatlong magkakaugnay na kilos ay pinanatiling magkakaiba ang himig: pagpapalakas-loob, pag-aliw, at taimtim na paghimok.'
