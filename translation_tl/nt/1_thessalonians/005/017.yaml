  yaml_path: translation/nt/1_thessalonians/005/017.yaml
  text: Pray without ceasing[a].
translation:
  language: tl
  text: Manalangin kayo nang walang tigil.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Patuloy kayong manalangin” o “Lagi kayong manalangin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδιαλείπτως
  choice: nang walang tigil
  rationale: Ipinahahayag ng pang-abay ang patuloy at matiyagang paraan ng pananalangin. Likas at maikli sa modernong Tagalog ang “nang walang tigil,” at pinananatili nito ang lakas ng Griyego nang hindi tahasang ipinapakahulugang dapat magsalita sa panalangin sa bawat segundo.
- source_word: προσεύχεσθε
  choice: Manalangin kayo
  rationale: Ang kasalukuyang pautos na nasa ikalawang panauhang maramihan ay isang panawagan sa patuloy o nakaugaliang pagkilos. Malinaw na ipinakikita ng “kayo” na maramihan ang kausap, samantalang naipahahayag na ng “nang walang tigil” ang patuloy na aspekto.
theological_decisions:
- issue: Praktikal na saklaw ng utos
  choice: Pinanatili ang tuwirang panawagan sa patuloy at matiyagang pananalangin.
  alternative: Ipaliwanag sa mismong talata na hindi ito nangangahulugan ng walang patid na binibigkas na panalangin sa bawat sandali.
  rationale: Maaaring tumukoy ang ἀδιαλείπτως sa walang humpay o palagiang pagpapatuloy. Hindi nilulutas ng salin ang tensiyon sa pamamagitan ng pagdaragdag ng paliwanag sa pangunahing teksto; inilalahad sa talababa ang mga likas na alternatibo.
translation_notes:
  register: Maikli, marangal, at likas sa modernong Filipino Tagalog. Ang “Manalangin” ay mas angkop sa biblikal na register kaysa sa mas pangkaraniwang “magdasal,” habang nananatiling madaling maunawaan.
