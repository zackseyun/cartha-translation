  text: τοῦ ἀποθανόντος ⸀περὶ ἡμῶν ἵνα εἴτε γρηγορῶμεν εἴτε καθεύδωμεν ἅμα σὺν αὐτῷ ζήσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/010.yaml
  text: who died for us[a], so that whether we are awake or asleep, we may live together with him.
translation:
  language: tl
  text: na namatay para sa atin, upang gising man tayo o natutulog, mabuhay tayong kasama niya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mapagbantay man tayo o natutulog.” Maaaring umalingawngaw ang parirala sa panawagang maging mapagbantay sa nakapaligid na konteksto, bagaman malamang na tumutukoy ito rito sa kung ang mga mananampalataya ay buhay pa o namatay na.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποθανόντος
  choice: na namatay
  rationale: Ang aorist participle ay tumutukoy kay Jesus na binanggit sa naunang talata. Ang sugnay na “na namatay” ang likas na katumbas sa Filipino.
- source_word: περὶ ἡμῶν
  choice: para sa atin
  rationale: Sa kontekstong ito, ang περί na may genitive ay nangangahulugang para sa kapakanan o alang-alang sa atin. Likas at malinaw ang “para sa atin” nang hindi nagdaragdag ng mas tiyak na paliwanag tungkol sa paraan ng kamatayan niya.
- source_word: ἵνα
  choice: upang
  rationale: Ipinahahayag nito ang layunin o nilalayong bunga; pinananatili ng “upang” ang puwersang iyon sa isang marangal ngunit pangkaraniwang rehistro.
- source_word: γρηγορῶμεν
  choice: gising man tayo
  rationale: Maaaring tumukoy ang pandiwa sa literal na pagiging gising o sa mapagbantay na kalagayan. Pinananatili ng “gising” ang talinghaga at ang posibleng pag-alingawngaw sa naunang panawagang magbantay.
- source_word: καθεύδωμεν
  choice: natutulog
  rationale: Likas itong katambal ng “gising” at pinananatili ang talinghaga. Malamang na tumutukoy rito sa mga mananampalatayang namatay, ngunit hindi iyon tahasang nilulutas sa pangunahing teksto.
- source_word: ἅμα σὺν αὐτῷ
  choice: kasama niya
  rationale: Magkasamang ipinahahayag ng ἅμα at σύν ang pakikisama o magkasamang pamumuhay kay Cristo. Sapat at natural sa Filipino ang “kasama niya” nang hindi mabigat ang pag-uulit.
- source_word: ζήσωμεν
  choice: mabuhay tayo
  rationale: Ang anyong subjunctive sa ilalim ng ἵνα ay likas na naihahayag sa “upang … mabuhay tayo,” na nagsasaad ng nilalayong bunga.
theological_decisions:
- issue: Kahulugan ng “gising” at “natutulog”
  choice: Pangunahing tumutukoy sa mga mananampalatayang buhay pa o namatay na, habang pinananatili ang talinghaga sa teksto.
  alternative: Maaaring tumukoy sa pagiging mapagbantay o pabaya sa espirituwal na kalagayan, bilang pagpapatuloy ng 5:6–7.
  rationale: Ang pangakong mabuhay kasama ni Cristo, buhay man o namatay na ang mananampalataya, ay umaayon sa 4:13–15. Gayunman, dahil inuulit ng mga salita ang bokabularyo ng pagbabantay sa agarang konteksto, hindi dapat alisin ang posibleng etikal na pag-alingawngaw.
translation_notes:
  register: Modernong Filipino na malinaw, maikli, at marangal. Pinanatili ang mga talinghagang “gising” at “natutulog” upang hindi tahasang lutasin sa pangunahing teksto ang tunay na kontekstuwal na tensiyon.
