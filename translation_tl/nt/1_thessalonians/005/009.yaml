id: 1TH.5.9
reference: 1 Thessalonians 5:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτι οὐκ ἔθετο ἡμᾶς ὁ θεὸς εἰς ὀργὴν ἀλλὰ εἰς περιποίησιν σωτηρίας διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/009.yaml
  text: For God did not appoint us for wrath[a], but for obtaining salvation through our Lord Jesus the Messiah[b],
translation:
  language: tl
  text: Sapagkat hindi tayo itinalaga ng Diyos para sa poot, kundi upang matamo natin ang kaligtasan[a] sa pamamagitan ng ating Panginoong Jesus, ang Mesiyas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “para sa pagkakamit ng kaligtasan,” “para maging atin ang kaligtasan,” o posibleng “para maingatan tungo sa kaligtasan.” Mas malawak ang saklaw ng pangngalang Griego na περιποίησις kaysa sa “matamo.”
    reason: lexical_alternative
  - marker: b
    text: 'Tradisyonal: “sa pamamagitan ng ating Panginoong Jesu-Cristo.” Isinalin dito ang titulong Griego na Χριστός bilang “Mesiyas” upang mapanatili ang kahulugan nito.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan o batayan ng naunang pahayag; likas sa Filipino ang “Sapagkat” at napapanatili nito ang ugnayang sanhi.
- source_word: ἔθετο
  choice: itinalaga
  rationale: Ang τίθημι kasama ng εἰς ay tumutukoy rito sa pagtatalaga tungo sa isang kahihinatnan. Hindi kasing-lakas ng “itinadhana” ang “itinalaga,” kaya hindi nito ipinapasok ang mas sistematikong pakahulugan kaysa sa sinasabi ng talata.
- source_word: εἰς ὀργὴν
  choice: para sa poot
  rationale: Pinananatili ng “poot” ang tuwirang kahulugan at bigat ng ὀργή sa eskatolohikal na konteksto ni Pablo; ang “hatol” ay magiging mas mapagpaliwanag at mas malawak.
- source_word: περιποίησιν σωτηρίας
  choice: upang matamo natin ang kaligtasan
  rationale: Likas at malinaw ito sa modernong Filipino at ipinapahayag ang pagtatamo bilang nilalayong kahihinatnan. Mas malawak ang saklaw ng περιποίησις, kaya inilalahad sa talababa ang iba pang maaaring diwa.
- source_word: διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: sa pamamagitan ng ating Panginoong Jesus, ang Mesiyas
  rationale: Ang διά na may genitive ay nagsasaad ng paraan o ahensiya. Isinalin ang Χριστός bilang titulong “Mesiyas,” at ginamit ang apposition na likas sa Filipino.
theological_decisions:
- issue: Kung bibigyan ang ἔθετο ng mas malakas na diwa ng predestinasyon
  choice: hindi tayo itinalaga ng Diyos para sa poot
  alternative: hindi tayo itinadhana ng Diyos para sa poot
  rationale: Ipinahahayag ng talata ang layunin o pagtatalaga ng Diyos, ngunit hindi hinihingi ng salita rito ang mas sistematikong pormulasyon tungkol sa predestinasyon.
- issue: Kung isasalin ang Χριστοῦ bilang titulo o gagamiting anyong tila bahagi ng pangalan
  choice: ang Mesiyas
  alternative: Cristo
  rationale: May teolohikal na kahulugan pa rin bilang titulo ang Χριστός kasunod ng pangalang Jesus. Pinananatili sa talababa ang tradisyonal na anyong “Cristo.”
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “Sapagkat” at “sa pamamagitan” para sa malinaw na daloy at pormal na bigat; iniwasan ang “itinadhana” upang huwag palakasin nang labis ang doktrinal na pahiwatig ng ἔθετο.
