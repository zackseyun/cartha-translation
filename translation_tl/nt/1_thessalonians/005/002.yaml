  text: αὐτοὶ γὰρ ἀκριβῶς οἴδατε ⸀ὅτι ἡμέρα κυρίου ὡς κλέπτης ἐν νυκτὶ οὕτως ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/002.yaml
  text: For you yourselves know very well that the day of the Lord comes like a thief in the night.
translation:
  language: tl
  text: Sapagkat kayo mismo ay lubos na nakaaalam na ang araw ng Panginoon ay dumarating gaya ng magnanakaw sa gabi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτοὶ
  choice: kayo mismo
  rationale: Pinananatili nito ang pagbibigay-diin ng intensive pronoun sa mga mambabasa, na likas ding pakinggan sa Filipino.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinahahayag nito ang paliwanag o dahilan na kaugnay ng naunang sinabi.
- source_word: ἀκριβῶς οἴδατε
  choice: lubos na nakaaalam
  rationale: Likas at marangal itong paraan upang ipahayag ang tiyak at ganap na kaalamang tinutukoy ng ἀκριβῶς kasabay ng οἴδατε.
- source_word: ἡμέρα κυρίου
  choice: araw ng Panginoon
  rationale: Pinananatili nito ang nakaugaliang biblikal at eskatolohikal na parirala at hindi ito ipinagkakamali sa isang lingguhang araw ng pagsamba.
- source_word: ὡς κλέπτης ἐν νυκτὶ
  choice: gaya ng magnanakaw sa gabi
  rationale: Tuwiran at likas na pinananatili ang paghahambing na nagpapahiwatig ng di-inaasahang pagdating.
- source_word: οὕτως ἔρχεται
  choice: ay dumarating
  rationale: Ang paraan ng pagdating na ipinahihiwatig ng οὕτως ay malinaw nang naihahayag ng pariralang “gaya ng magnanakaw sa gabi”; pinananatili ng “dumarating” ang matingkad na present tense na may hinaharap na sanggunian.
theological_decisions:
- issue: Kahulugan ng ἡμέρα κυρίου
  choice: araw ng Panginoon
  alternative: araw na ukol sa Panginoon / araw ng pagsamba ng Panginoon
  rationale: Sa konteksto, tumutukoy ito sa eskatolohikal na araw ng banal na pagkilos at paghatol, hindi sa lingguhang araw ng pagsamba.
- issue: Diwa ng paghahambing sa magnanakaw
  choice: Pinanatili bilang larawan ng di-inaasahang pagdating
  alternative: Palawakin ito bilang lihim na pagdating o iugnay sa isang tiyak na sistemang eskatolohikal
  rationale: Hindi nilulutas o dinaragdagan ng salin ang larawan nang higit sa sinasabi ng teksto; pinananatili nito ang diin sa biglaan at di-inaasahang pagdating.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “kayo mismo” upang mapanatili ang diin, at “lubos na nakaaalam” upang maipahayag ang tumpak na kaalamang tinutukoy nang hindi nagiging kolokyal.
