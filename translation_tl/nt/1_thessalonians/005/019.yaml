  yaml_path: translation/nt/1_thessalonians/005/019.yaml
  text: Do not quench the Spirit,[a]
translation:
  language: tl
  text: Huwag ninyong apulahin ang Espiritu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “espiritu.” Maaaring tumukoy nang mas pangkalahatan ang salitang Griyego sa espiritu, ngunit dito ay malamang na tumutukoy ito sa Espiritu Santo, lalo na dahil kasunod na binanggit ang mga propesiya.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: ang Espiritu
  rationale: Sa konteksto ng mga propesiya at pagsusuri sa kasunod na mga talata, malamang na tumutukoy ito sa Espiritu Santo. Hindi ginagamit sa Griyego ang kapitalisasyon upang tukuyin ang referent, kaya pinananatili sa talababa ang mas pangkalahatang posibilidad na “espiritu.”
- source_word: μὴ
  choice: Huwag ninyong
  rationale: Ang μή kasama ng pangkasalukuyang pautos ay bumubuo ng pagbabawal. Ang “huwag ninyong” ay likas na Filipino at ang pangmaramihang anyo ay angkop sa kausap ng liham.
- source_word: σβέννυτε
  choice: patayin ang apoy
  rationale: Ang σβέννυμι ay literal na tumutukoy sa pagpatay o pag-apula ng apoy. Nililinaw ng pariralang ito sa modernong Filipino ang metapora ng apoy nang hindi ito ginagawang pangkalahatang “hadlangan” o “sugpuin.”
theological_decisions:
- issue: Referent ng πνεῦμα
  choice: ang Espiritu, malamang ang Espiritu Santo
  alternative: ang espiritu; espirituwal na sigla o kaloob
  rationale: Ang kasunod na babala tungkol sa mga propesiya ay sumusuporta sa pagtukoy sa pagkilos ng Espiritu Santo sa kapulungan. Gayunman, maaaring mas pangkalahatan ang salitang Griyego, kaya hindi lubusang nilulutas ang tensiyon at inilalahad ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino na tuwiran, marangal, at madaling maunawaan. Pinanatili ang metapora ng pagpatay sa apoy sa halip na ipaliwanag lamang bilang paghadlang.
