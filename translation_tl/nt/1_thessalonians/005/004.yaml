base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/004.yaml
  text: But you[a], brothers, are not in darkness[b], so that the day would overtake you like a thief.
translation:
  language: tl
  text: Ngunit kayo, mga kapatid[a], ay wala sa kadiliman, kaya hindi kayo aabutan ng araw na iyon nang gaya ng isang magnanakaw[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga kapatid” dito ay tumutukoy sa mga kapatid sa pananampalataya, kapwa lalaki at babae.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, ang araw ng Panginoon na binabanggit sa agarang konteksto.
    reason: cross_reference
lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: Ngunit kayo
  rationale: Ipinapanatili ng “ngunit” ang pagsalungat sa naunang paglalarawan, at ng hayag na “kayo” ang diin ng panghalip.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Ang “mga kapatid” ay likas at marangal na katawagan sa modernong Tagalog at maaari itong tumukoy sa mga lalaki at babae nang hindi kailangang magdagdag ng mga salitang wala sa Griyego.
- source_word: ἐν σκότει
  choice: sa kadiliman
  rationale: Pinananatili nito ang larawang metaporikal at ang espirituwal at teolohikal na dating ng parirala.
- source_word: ἵνα
  choice: kaya hindi
  rationale: Sa negatibong pangungusap, malinaw at natural nitong ipinahahayag ang bunga o kalagayang inilalarawan ng ἵνα nang hindi tiyakang nagpapasya kung layunin o resulta ang nangingibabaw na diwa.
- source_word: ἡ ἡμέρα
  choice: ang araw na iyon
  rationale: Tinutukoy ng artikulo ang partikular na araw na nasa agarang konteksto; natural sa Tagalog ang “araw na iyon” nang hindi inilalagay sa pangunahing teksto ang buong pariralang “araw ng Panginoon.”
- source_word: ὡς κλέπτης
  choice: na gaya ng isang magnanakaw
  rationale: Pinananatili ang tahasang paghahambing at ang larawan ng di-inaasahang pagdating.
- source_word: καταλάβῃ
  choice: aabutan
  rationale: Ang “aabutan” ay natural na katumbas ng paghahabol o pagdating na umabot sa isang tao at hindi nito tuwirang idinaragdag ang interpretasyong “gugulatin.”
theological_decisions:
- issue: Saklaw ng kasariang tinutukoy ng ἀδελφοί
  choice: mga kapatid
  alternative: mga kapatid na lalaki at babae
  rationale: Hindi minamarkahan ng karaniwang Tagalog na “kapatid” ang kasarian, kaya natural nitong nasasaklaw ang buong kongregasyon habang nananatiling malapit sa katawagang Griyego.
- issue: Eskatolohikal na tinutukoy ng ἡ ἡμέρα
  choice: ang araw na iyon
  alternative: ang araw ng Panginoon
  rationale: Ang agarang konteksto ang nagpapakilalang ito ang araw ng Panginoon, ngunit “ang araw” lamang ang nasa talata; kaya inilalagay ang paglilinaw sa talababa sa halip na idagdag sa pangunahing teksto.
- issue: Ugnayang ipinahahayag ng ἵνα
  choice: kaya hindi kayo aabutan
  alternative: upang hindi kayo abutan
  rationale: Maaaring magpahiwatig ang ἵνα rito ng bunga o kalagayang kasunod ng pagiging wala sa kadiliman. Ang “kaya” ay natural sa Tagalog at hindi nagpapataw ng masidhing layuning teolohikal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang metapora ng kadiliman at magnanakaw; iniwasan ang sobrang literal na ayos na magiging di-likas sa Tagalog.
