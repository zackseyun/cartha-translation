  text: I put you under oath before the Lord to have this letter read to all the brothers[a][b].
translation:
  language: tl
  text: Pinasusumpa ko kayo sa harap ng Panginoon[a] na ipabasa ninyo ang liham na ito sa lahat ng mga kapatid[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pamamagitan ng Panginoon.” Maaaring mangahulugan ang pahayag sa Griyego na taimtim silang pinasusumpa ni Pablo, na ang Panginoon ang tinatawag na awtoridad.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Griyego para sa “mga kapatid” ay nasa panlalaking maramihang anyo, ngunit malamang na tumutukoy ito sa buong kongregasyon, kasama ang mga babae.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνορκίζω
  choice: Isinusumpa ko kayo
  rationale: Ipinahahayag nito ang taimtim na pagbibigay ng obligasyon sa ilalim ng panunumpa, at mas tuwirang pinananatili ang lakas ng pandiwa kaysa sa mas malawak na “mahigpit kong inaatasan.”
- source_word: τὸν κύριον
  choice: sa harap ng Panginoon
  rationale: Likas sa modernong Tagalog at ipinahihiwatig na ang Panginoon ang saksi at awtoridad sa taimtim na panunumpa; nananatiling posible ang pagbasa na “sa pamamagitan ng Panginoon,” kaya inilagay iyon sa talababa.
- source_word: ἀναγνωσθῆναι
  choice: na ipabasa
  rationale: Pinananatili nito ang pasibong diwa ng infinitive at likas na nagpapahiwatig na babasahin ang liham sa kapulungan, nang hindi idinaragdag sa pangunahing teksto ang tahasang “nang malakas.”
- source_word: τὴν ἐπιστολήν
  choice: ang liham na ito
  rationale: Ang tinutukoy ay ang kasalukuyang liham; natural at malinaw sa modernong Tagalog ang “liham na ito.”
- source_word: πᾶσιν τοῖς ἀδελφοῖς
  choice: sa lahat ng mga kapatid
  rationale: Ang “mga kapatid” ay natural na salin ng ἀδελφοῖς sa kontekstong pangkongregasyon at maaari sa Tagalog na tumukoy sa kapwa lalaki at babae, samantalang ipinapaliwanag sa talababa ang anyong panlalaki ng Griyego.
theological_decisions:
- issue: Saklaw ng ἀδελφοῖς sa kongregasyong malamang na binubuo ng mga lalaki at babae
  choice: mga kapatid
  alternative: mga kapatid na lalaki at babae
  rationale: Panlalaking maramihan ang anyong Griyego, ngunit madalas itong tumutukoy sa buong pamayanang Kristiyano. Ang “mga kapatid” sa Tagalog ay tumpak at likas na inklusibo nang hindi tahasang nagdaragdag ng mga salitang wala sa teksto.
- issue: Ugnayan ng τὸν κύριον sa ἐνορκίζω
  choice: sa harap ng Panginoon
  alternative: sa pamamagitan ng Panginoon
  rationale: Maaaring ipakahulugan ang accusative bilang pagtawag sa Panginoon na saksi o awtoridad, o bilang siyang pinagbabatayan ng panunumpa. Pinili ang mas natural na pangunahing pahayag at pinanatili ang tunay na alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na taimtim ngunit madaling maunawaan. Ginamit ang “isinusumpa” upang mapanatili ang lakas ng panunumpa, “ipabasa” para sa pasibong diwa, at “mga kapatid” bilang likas na katawagang pangkongregasyon.
