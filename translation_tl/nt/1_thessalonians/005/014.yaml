id: 1TH.5.14
reference: 1 Thessalonians 5:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: παρακαλοῦμεν δὲ ὑμᾶς, ἀδελφοί, νουθετεῖτε τοὺς ἀτάκτους, παραμυθεῖσθε τοὺς ὀλιγοψύχους, ἀντέχεσθε τῶν ἀσθενῶν, μακροθυμεῖτε πρὸς πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/014.yaml
  text: And we urge you[a], brothers, admonish the disorderly, encourage the fainthearted, help the weak[d][c][b], be patient with everyone.
translation:
  language: tl
  text: 'At hinihimok namin kayo, mga kapatid[a]: paalalahanan ninyo ang mga namumuhay nang walang kaayusan[b], palakasin ang loob ng mga pinanghihinaan[c], alalayan ang mahihina[d], at maging matiisin sa lahat ng tao.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga kapatid” ay tumutukoy rito sa buong kongregasyon.
    reason: Nililinaw ang inklusibong gamit ng masculine plural na ἀδελφοί sa konteksto.
  - marker: b
    text: Maaari ring “ang mga walang disiplina,” “ang mga suwail,” o, ayon sa konteksto ng mga sulat sa Tesalonica, “ang mga tamad.”
    reason: Pinananatili ang malawak at pinagtatalunang saklaw ng ἀτάκτους.
  - marker: c
    text: Maaari ring “aliwin ang mga nasisiraan ng loob” o “palakasin ang loob ng mga natatakot.”
    reason: Ipinakikita ang mga posibleng himig ng παραμυθεῖσθε at ὀλιγοψύχους.
  - marker: d
    text: Maaari ring “suportahan” o “umagapay sa mga mahihina.”
    reason: Pinananatili ang diwa ng ἀντέχεσθε bilang matatag na pag-alalay at pastoral na suporta.
lexical_decisions:
- source_word: παρακαλοῦμεν
  choice: hinihimok namin
  rationale: Nagpapahayag ito ng taimtim at mariing pastoral na pakiusap; natural sa makabagong Filipino ang “hinihimok” nang hindi pinahihina ang puwersa.
- source_word: δέ
  choice: At
  rationale: Nagsisilbi itong pagpapatuloy o paglipat ng diwa, hindi matinding pagsalungat.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Ang “mga kapatid” ay likas na katawagan sa Filipino at hindi tiyak sa kasarian, habang tapat sa pangkongregasyong gamit ng salitang Griyego.
- source_word: νουθετεῖτε
  choice: paalalahanan ninyo
  rationale: Saklaw nito ang mapagtuwid na pagpapayo o pagbababala na naglalayong magbago ang kinakausap; mas karaniwan at pastoral kaysa “sawayin.”
- source_word: ἀτάκτους
  choice: mga namumuhay nang walang kaayusan
  rationale: Pinananatili nito ang malawak na diwa ng pagiging wala sa ayos o disiplina at hindi agad nililimitahan sa katamaran.
- source_word: παραμυθεῖσθε
  choice: palakasin ang loob
  rationale: Ipinahihiwatig ng pandiwa ang magiliw na pagsasalitang nagbibigay-lakas, ginhawa, at katiyakan.
- source_word: ὀλιγοψύχους
  choice: mga pinanghihinaan
  rationale: Natural itong tumutukoy sa mga pinanghihinaan ng loob o nawawalan ng tapang nang hindi labis na nagpapakahulugan.
- source_word: ἀντέχεσθε
  choice: alalayan
  rationale: Sa kasamang genitive, tumutukoy ito sa pagkapit, pagsuporta, at pagtulong; malinaw na naihahayag ng “alalayan” ang patuloy na pagkalinga.
- source_word: τῶν ἀσθενῶν
  choice: ang mahihina
  rationale: Pinananatili ang malawak na kahulugan ng kahinaan—maaaring pisikal, moral, panlipunan, o espirituwal—nang hindi ito tinutukoy nang higit sa teksto.
- source_word: μακροθυμεῖτε
  choice: maging matiisin
  rationale: Tumutukoy ito sa mahabang pagtitiis sa pakikitungo sa mga tao; malinaw at marangal ang “matiisin” sa modernong Filipino.
- source_word: πρὸς πάντας
  choice: sa lahat
  rationale: Likas na Filipino itong pagpapahayag ng pag-uugaling dapat ipakita sa bawat tao.
theological_decisions:
- issue: Saklaw ng ἀδελφοί bilang tawag sa kongregasyon
  choice: Isinalin na “mga kapatid,” na natural na sumasaklaw sa buong kongregasyon sa Filipino.
  alternative: mga kapatid na lalaki; mga kapatid na lalaki at babae
  rationale: Bagaman masculine plural ang anyong Griyego, ang konteksto ay pakikipag-usap sa buong iglesya. Hindi kailangang lagyan ng kasarian ang likas na neutral at pangkongregasyong “mga kapatid.”
- issue: Uri ng kahinaan sa τῶν ἀσθενῶν
  choice: Pinanatiling pangkalahatan bilang “ang mahihina.”
  alternative: ang mahihina sa pananampalataya; ang mga maysakit
  rationale: Hindi tinutukoy ng talata kung pisikal, espirituwal, moral, o panlipunan ang kahinaan, kaya hindi ito dapat paliitin sa isang uri.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang magkatulad na anyong pautos upang mapanatili ang ritmo ng apat na utos. Iniwasan ang labis na teknikal o denominasyonal na pananalita at pinanatili sa mga talababa ang tunay na leksikal na kalabuan.
