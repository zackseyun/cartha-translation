source:
  edition: SBLGNT
  text: ⸀ὅταν λέγωσιν· Εἰρήνη καὶ ἀσφάλεια, τότε αἰφνίδιος αὐτοῖς ἐφίσταται ὄλεθρος ὥσπερ ἡ ὠδὶν τῇ ἐν γαστρὶ ἐχούσῃ, καὶ οὐ μὴ ἐκφύγωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/003.yaml
  text: When they say[a], “Peace and security,” then sudden destruction comes upon them, like labor pains upon a pregnant woman[c][b], and they will certainly not escape.
translation:
  language: tl
  text: Kapag sinasabi nila, “Kapayapaan at katiwasayan,”[a] bigla silang daratnan ng kapahamakan, gaya ng sakit ng panganganak na dumarating sa isang buntis,[b] at hinding-hindi sila makatatakas.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kapayapaan at seguridad.”
    reason: lexical_alternative
  - marker: b
    text: O “mga kirot ng panganganak.”
    reason: lexical_alternative
  - marker: c
    text: 'Mariin ang pagtanggi sa Griyego: “sa anumang paraan ay hindi sila makatatakas.”'
    reason: lexical_emphasis
lexical_decisions:
- source_word: ὅταν λέγωσιν
  choice: Kapag sinasabi nila
  rationale: Ipinahahayag ang di-tiyak ngunit inaasahang pangyayari sa hinaharap, habang pinananatili ang di-tiyak na pangmaramihang simuno ng Griyego.
- source_word: Εἰρήνη καὶ ἀσφάλεια
  choice: Kapayapaan at katiwasayan
  rationale: Ang “kapayapaan” ay tuwirang katumbas ng εἰρήνη, at ang “katiwasayan” ay likas na abstraktong katumbas ng ἀσφάλεια sa pahayag tungkol sa kalagayang ligtas at panatag.
- source_word: αἰφνίδιος αὐτοῖς ἐφίσταται ὄλεθρος
  choice: bigla silang daratnan ng kapahamakan
  rationale: Pinananatili ng “bigla” ang diin sa di-inaasahang pagdating; ang “daratnan” ay natural na salin ng pagdating sa kanila, at ang “kapahamakan” ay naghahayag ng matinding pagkawasak o ruin nang hindi tinutukoy ang eksaktong anyo o tagal nito.
- source_word: ἡ ὠδὶν
  choice: sakit ng panganganak
  rationale: Karaniwang makabagong Filipino para sa kirot na kaugnay ng panganganak at malinaw na pinananatili ang paghahambing.
- source_word: τῇ ἐν γαστρὶ ἐχούσῃ
  choice: sa isang buntis
  rationale: Natural at maikli itong katumbas ng literal na “sa babaeng may dinadala sa sinapupunan,” nang hindi nawawala ang larawan.
- source_word: οὐ μὴ ἐκφύγωσιν
  choice: hinding-hindi sila makatatakas
  rationale: Ang inuulit na “hindi” sa natural na Filipino ay naghahatid ng mariing pagtanggi ng οὐ μή tungkol sa hinaharap.
theological_decisions:
- issue: Kalikasan ng ὄλεθρος sa babalang eskatolohikal
  choice: kapahamakan
  alternative: pagkawasak; pagkapahamak
  rationale: Ipinakikita nito ang bigat at katiyakan ng hatol ngunit hindi tahasang nilulutas kung ang tinutukoy ay pagkalipol, walang hanggang kaparusahan, o ibang tiyak na doktrinal na paglalarawan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “katiwasayan” sa pangunahing teksto upang maging likas ang pampublikong pahayag na magkaparis sa “kapayapaan”; inilagay sa talababa ang mas teknikal na “seguridad.”
