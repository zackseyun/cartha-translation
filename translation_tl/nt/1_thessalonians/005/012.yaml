source:
  edition: SBLGNT
  text: Ἐρωτῶμεν δὲ ὑμᾶς, ἀδελφοί, εἰδέναι τοὺς κοπιῶντας ἐν ὑμῖν καὶ προϊσταμένους ὑμῶν ἐν κυρίῳ καὶ νουθετοῦντας ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/012.yaml
  text: We ask you[a], brothers, to acknowledge those who labor among you and lead you in the Lord and admonish you[c][b],
translation:
  language: tl
  text: Hinihiling namin sa inyo, mga kapatid,[a] na kilalanin[b] ang mga nagpapagal sa gitna ninyo, namumuno sa inyo sa Panginoon,[c] at nagpapayo at nagtutuwid sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga kapatid” ay katawagang pangkongregasyon at tumutukoy rito sa mga mananampalataya, kapwa lalaki at babae.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “pahalagahan” o “igalang.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “nangangasiwa sa inyo sa Panginoon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐρωτῶμεν
  choice: Hinihiling namin
  rationale: Naghahayag ito ng magalang na pakiusap o pastoral na paghiling, hindi ng tuwirang utos.
- source_word: δὲ
  choice: hindi tahasang isinalin
  rationale: Banayad na panandang pandiskurso ito; natural sa Filipino na ipahiwatig ang paglipat nang walang hiwalay na katumbas.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Natural at inklusibo sa gamit ng Filipino, habang tapat sa katawagang pampamayanan ng kongregasyon.
- source_word: εἰδέναι
  choice: kilalanin
  rationale: Sa idyomang ito, tumutukoy ito sa pagkilala at pagpapahalaga sa kanilang gawain, hindi lamang sa pagkakakilala sa kanila.
- source_word: κοπιῶντας
  choice: mga nagpapagal
  rationale: Pinananatili nito ang diin sa masikap at nakapapagod na paggawa.
- source_word: ἐν ὑμῖν
  choice: sa gitna ninyo
  rationale: Malinaw na tumutukoy sa paglilingkod nila sa loob ng kongregasyon.
- source_word: προϊσταμένους
  choice: namumuno sa inyo
  rationale: Ipinahahayag ang pamumuno o pangangasiwa nang hindi nagdaragdag ng tiyak na estrukturang denominasyonal.
- source_word: ἐν κυρίῳ
  choice: sa Panginoon
  rationale: Pinananatili ang sadyang malawak na ugnayan ng kanilang pamumuno sa Panginoon.
- source_word: νουθετοῦντας
  choice: nagbibigay sa inyo ng payong pagtutuwid
  rationale: Sinasaklaw ang pastoral na pagpapayo at ang mapagtuwid na lakas ng pandiwa, sa mas madaling maunawaang modernong Filipino kaysa sa teknikal na 'nagpapayo' lamang.
theological_decisions:
- issue: Saklaw ng katawagang ἀδελφοί
  choice: mga kapatid
  alternative: mga kapatid na lalaki; mga kapatid na lalaki at babae
  rationale: Ang 'mga kapatid' ay likas na katawagang pangkongregasyon sa Filipino at maaaring sumaklaw sa buong iglesia nang hindi pinapalitan ng tahasang dobleng anyo ang salitang Griyego.
- issue: Kahulugan ng εἰδέναι tungkol sa mga lider
  choice: kilalanin
  alternative: igalang; pahalagahan; alamin
  rationale: Ipinapakita nito ang pagkilala sa kanila at sa kanilang paglilingkod nang hindi ipinapasok ang mas malakas na ideya ng pagsunod o labis na pagpaparangal.
- issue: Lakas ng προϊσταμένους ὑμῶν ἐν κυρίῳ
  choice: namumuno sa inyo sa Panginoon
  alternative: nangangasiwa sa inyo sa Panginoon; nasa ibabaw ninyo sa Panginoon; nangangalaga sa inyo sa Panginoon
  rationale: Pinananatili ang tunay na elemento ng pamumuno habang iniiwasang tukuyin ang isang denominasyonal na modelo ng pamamahala.
translation_notes:
  register: Modernong Filipino na may marangal at malinaw na himig. Ginamit ang 'mga kapatid' bilang natural na katawagang pangkongregasyon, 'nagpapagal' upang mapanatili ang bigat ng masikap na paggawa, at 'payong pagtutuwid' upang maipahayag ang pastoral at mapagtuwid na diwa ng νουθετέω.
