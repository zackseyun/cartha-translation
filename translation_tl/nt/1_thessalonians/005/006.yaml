translation:
  language: tl
  text: Kaya nga, huwag tayong matulog gaya ng iba, kundi manatili tayong gising[a] at maging matino[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “maging mapagbantay.” Maaaring idiin ng pandiwang Griyego ang pagiging gising o ang mapagmatyag na pagbabantay.
    reason: lexical_alternative
  - marker: b
    text: O “huwag tayong malasing,” “maging malinaw ang isip,” o “maging mapagpigil.” Saklaw ng pandiwang Griyego ang pagiging hindi lasing at, sa pinalawak na diwa, ang malinaw na pag-iisip at pagpipigil sa sarili.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Kaya nga
  rationale: Magkasamang naghahayag ang dalawang kataga ng kongklusyon mula sa naunang sinabi. Likas sa modernong Tagalog ang “Kaya nga” at pinananatili nito ang diin ng paghihinuha.
- source_word: μὴ καθεύδωμεν
  choice: huwag tayong matulog
  rationale: Hortatoryong pangmaramihang anyo ito na may pagtanggi. Pinananatili ng salin ang larawan ng pagtulog sa halip na agad itong ipaliwanag bilang espirituwal o moral na kapabayaan.
- source_word: ὡς οἱ λοιποί
  choice: gaya ng iba
  rationale: Tumutukoy ang οἱ λοιποί sa ibang mga tao na ipinag-iiba sa mga mananampalataya sa konteksto. Maikli, natural, at hindi labis na tiyak ang “iba.”
- source_word: ἀλλὰ
  choice: kundi
  rationale: Pagkatapos ng negatibong sugnay, likas na ipinahahayag ng “kundi” ang mariing pagsalungat at ang positibong kahalili.
- source_word: γρηγορῶμεν
  choice: manatili tayong gising
  rationale: Pinananatili nito ang tuwirang pagsalungat sa “matulog” at kasabay na naipahihiwatig ang patuloy na pagbabantay. Inilalagay sa talababa ang mas tahasang “maging mapagbantay.”
- source_word: νήφωμεν
  choice: maging matino
  rationale: Saklaw ng νήφω ang pagiging hindi lango at, sa pinalawak na diwa, ang malinaw na pag-iisip at pagpipigil sa sarili. Natural sa Tagalog ang “maging matino” at hindi nito lubusang isinasara ang ugnayan ng mga diwang ito.
theological_decisions:
- issue: Matalinghagang diwa ng pagtulog at pagiging gising
  choice: Panatilihin sa pangunahing teksto ang larawan ng pagtulog at pagiging gising bilang etikal at espirituwal na panawagan.
  alternative: Ipaliwanag nang tuwiran bilang kapabayaan laban sa espirituwal na pagbabantay.
  rationale: Sa konteksto, inihahambing ang mga anak ng liwanag sa mga kaugnay ng gabi. Ang pagpapanatili sa larawan ay nag-iingat sa teolohikal na talinghaga ni Pablo nang hindi ito labis na ipinapaliwanag.
- issue: Saklaw ng νήφω
  choice: Isalin bilang “maging matino,” na maaaring magpahiwatig ng kalinawan ng isip, hindi pagkalango, at pagpipigil.
  alternative: “Huwag tayong magpakalango,” “maging malinaw ang isip,” o “maging mapagpigil.”
  rationale: Maaaring taglayin ng salita ang literal at matalinghagang pahiwatig ng kahinahunan at pagiging alerto. Hindi dapat paliitin ang kahulugan sa iisang abstraktong katangian lamang.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang inklusibong hortatoryong “tayo,” pinanatili ang pagtulog/pagiging gising na talinghaga, at iniwasan ang denominasyonal na pagpapakahulugan.
