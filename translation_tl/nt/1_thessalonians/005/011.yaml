  text: διὸ παρακαλεῖτε ἀλλήλους καὶ οἰκοδομεῖτε εἷς τὸν ἕνα, καθὼς καὶ ποιεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/011.yaml
  text: Therefore encourage one another and build up one another[a], just as you are also doing.
translation:
  language: tl
  text: Kaya palakasin ninyo ang loob ng isa't isa[a] at patatagin ang isa't isa, gaya ng ginagawa na ninyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “himukin ninyo ang isa't isa”; maaaring mangahulugan ang παρακαλεῖτε ng pagpapalakas ng loob o mas mariing paghimok sa kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Kaya
  rationale: Nagpapahayag ito ng konklusyon o bunga mula sa naunang pangangatwiran; natural sa makabagong Tagalog ang “Kaya.”
- source_word: παρακαλεῖτε
  choice: palakasin ninyo ang loob
  rationale: Saklaw ng pandiwa ang paghikayat at pagpapalakas ng loob. Ang pariralang ito ay natural at angkop sa konteksto ng pagpapalakas sa kapwa, habang pinananatili sa talababa ang posibilidad na “himukin.”
- source_word: ἀλλήλους
  choice: ang isa't isa
  rationale: Karaniwang katumbas sa Tagalog para sa gantihang kilos at malinaw na ipinapakita ang mutualidad.
- source_word: οἰκοδομεῖτε
  choice: patatagin
  rationale: Ipinahahayag ang paghubog at pagpapalakas sa kapwa sa natural na Tagalog. Hindi literal na pinanatili ang metapora ng pagtatayo dahil magiging alanganin ang “itayo ang isa't isa,” ngunit napananatili ang layunin ng metapora.
- source_word: εἷς τὸν ἕνα
  choice: ang isa't isa
  rationale: Idyomatikong ipinapahayag ang binigyang-diin na mutualidad ng Griyego; ang pag-uulit nito ay tumutugma sa dalawang utos.
- source_word: καθὼς καὶ ποιεῖτε
  choice: gaya ng ginagawa na ninyo
  rationale: Pinananatili ang paghahambing, ang papuring talagang ginagawa na nila ito, at ang nagpapatuloy na kilos ng pangkasalukuyang pandiwa.
theological_decisions:
- issue: Lakas ng παρακαλεῖτε sa kontekstong pastoral at mapagpayo
  choice: palakasin ninyo ang loob
  alternative: himukin ninyo
  rationale: Hindi tiyak na purong pag-aliw o mahigpit na pagpapayo ang ibig sabihin. Pinili ang malawak at natural na pahayag, at inilagay sa talababa ang lehitimong alternatibo upang hindi mawala ang ambiguwidad.
translation_notes:
  register: Makabagong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “isa't isa” upang idiomatikong mapanatili ang gantihang diin, at “patatagin” upang maihatid ang diwa ng metaporang οἰκοδομεῖτε nang hindi maging artipisyal ang Tagalog.
