  yaml_path: translation/nt/1_thessalonians/005/001.yaml
  text: Concerning the times and the seasons[a], brothers, you have no need to have anything written to you[b],
translation:
  language: tl
  text: Tungkol naman sa mga panahon at mga takdang pagkakataon[a], mga kapatid[b], hindi kailangang sulatan kayo,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga panahon at mga takdang pagkakataon” ay magkatambal na pananalita para sa mga yugto ng panahon at mga tiyak o itinakdang sandali, lalo na kaugnay ng mga pangyayari sa wakas.
    reason: cultural_note
  - marker: b
    text: Ang salitang Griyego ay literal na “mga kapatid na lalaki,” ngunit malamang na tinutukoy nito ang buong pamayanan ng mga mananampalataya, kabilang ang mga babae.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Tungkol naman sa
  rationale: Ang περί ay nagpapakilala ng paksa, at ang δέ ay naghuhudyat ng paglipat sa panibagong paksa. Likas sa Tagalog ang “tungkol naman sa” at hindi nito ginagawang tahasang pananda ng oras ang δέ.
- source_word: τῶν χρόνων καὶ τῶν καιρῶν
  choice: mga panahon at mga takdang pagkakataon
  rationale: Ang χρόνοι ay tumutukoy sa mga panahon o saklaw ng panahon, samantalang ang καιροί ay maaaring tumukoy sa mga angkop o itinakdang pagkakataon. Pinananatili ng salin ang dalawang magkaugnay ngunit hindi lubos na magkaparehong diwa.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Bagaman panlalaking maramihan ang anyong Griyego, karaniwang ginagamit ito bilang tawag sa buong sambayanang mananampalataya. Ang “mga kapatid” ay likas sa Tagalog, hindi nakatali sa kasarian, at tapat sa pampamilyang diwa ng katawagan.
- source_word: οὐ χρείαν ἔχετε
  choice: hindi na kailangang
  rationale: Ipinahahayag ng parirala ang kawalan ng pangangailangan. Ang “hindi na kailangang” ay natural na Tagalog sa konteksto; ipinahihiwatig ng “na” ang umiiral nang kaalaman ng mga kausap nang hindi binabago ang pangunahing diwa.
- source_word: ὑμῖν γράφεσθαι
  choice: sulatan pa kayo
  rationale: Ang γράφεσθαι ay pasibong pawatas at hindi tahasang pinapangalanan ang sumusulat. Ang impersonal na “sulatan pa kayo” ay nagpapanatili sa di-tahasang gumagawa at malinaw na inilalarawan ang mga kausap bilang tatanggap ng sulat.
theological_decisions:
- issue: Saklaw ng katawagang ἀδελφοί
  choice: mga kapatid
  alternative: mga kapatid na lalaki
  rationale: Ang gramatikal na anyo ay panlalaki, ngunit sa kontekstong pangkongregasyon ay malamang na saklaw nito ang buong pamayanan. Ang karaniwang Tagalog na “mga kapatid” ay nagpapanatili sa pampamilyang tawag nang hindi nag-aangking mga lalaki lamang ang kinakausap.
- issue: Ugnayan ng χρόνοι at καιροί sa kontekstong eskatolohikal
  choice: mga panahon at mga takdang pagkakataon
  alternative: mga panahon at mga kapanahunan
  rationale: Hindi pinagsasanib ang dalawang termino. Ipinakikita ng “takdang pagkakataon” ang posibleng diin ng καιρός sa angkop o itinakdang sandali, ngunit hindi nito tinutukoy kung anong mga pangyayari o petsa ang tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “naman” bilang likas na pananda ng paglipat ng paksa, at iniwasang magdagdag ng tahasang gumagawa sa pasibong pariralang Griyego.
