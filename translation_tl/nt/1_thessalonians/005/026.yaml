  text: Greet all the brothers with a holy kiss[a][b].
translation:
  language: tl
  text: Batiin ninyo ang lahat ng mga kapatid sa pamamagitan ng banal na halik.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay nasa panlalaking anyong pangmaramihan, ngunit maaari itong tumukoy sa lahat ng magkakapatid sa pananampalataya, kapwa lalaki at babae.
    reason: lexical_alternative
  - marker: b
    text: Ang “banal na halik” ay isang kinikilalang paraan noon ng pagpapahayag ng Kristiyanong pakikisama at pagmamahal.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Batiin ninyo
  rationale: Ang aorist middle imperative na pangmaramihan ay isang tuwirang tagubilin. Likas at malinaw sa modernong Tagalog ang “Batiin ninyo” para sa panlipunang diwa ng ἀσπάζομαι.
- source_word: τοὺς ἀδελφοὺς πάντας
  choice: ang lahat ng mga kapatid
  rationale: Saklaw ng πάντας ang buong pangkat. Ang “mga kapatid” ay natural na salin ng ἀδελφούς sa konteksto ng sambayanang sumasampalataya at hindi nito ipinipilit na lalaki lamang ang tinutukoy, bagaman panlalaking pangmaramihan ang anyong Griyego.
- source_word: ἐν φιλήματι ἁγίῳ
  choice: sa pamamagitan ng banal na halik
  rationale: Ipinahihiwatig ng ἐν ang paraan o kasamang kilos ng pagbati. Tiyak na “halik” ang φίλημα, at pinananatili ng “banal” ang panrelihiyon at moral na diwa ng ἁγίῳ.
theological_decisions:
- issue: Kasarian at saklaw ng ἀδελφούς sa konteksto ng kongregasyon
  choice: mga kapatid
  alternative: mga kapatid na lalaki; mga kapatid na lalaki at babae
  rationale: Bagaman panlalaking pangmaramihan ang anyong Griyego, ang karaniwang Tagalog na “mga kapatid” ay natural na hindi tiyak sa kasarian at maaaring tumukoy sa buong pamayanang sumasampalataya. Pinananatili sa talababa ang detalye tungkol sa anyong Griyego at posibleng malawak na saklaw nito.
- issue: Kalikasan ng “banal na halik”
  choice: banal na halik
  alternative: sagradong halik; halik ng kabanalan
  rationale: Pinananatili ng tuwirang parirala ang konkretong kilos at ang pagtatalaga rito bilang banal, nang hindi ito ginagawang isang denominasyonal na ritwal o pinapalitan ng makabagong katumbas.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “mga kapatid” dahil ito ang natural na katawagan sa pamayanang sumasampalataya sa Tagalog; nilinaw sa talababa ang gramatikal na kasarian at posibleng saklaw ng salitang Griyego. Ang “sa pamamagitan ng” ay malinaw na naghahayag ng paraan, bagaman bahagyang mas pormal kaysa “na may.”
