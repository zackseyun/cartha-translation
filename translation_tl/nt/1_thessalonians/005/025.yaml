  text: Brothers[a], pray for us.
translation:
  language: tl
  text: Mga kapatid,[a] ipanalangin ninyo kami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga kapatid” ay maaaring tumukoy sa mga kapatid na lalaki at babae—malamang na sa buong kongregasyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: Mga kapatid
  rationale: Ang pangmaramihang pantawag na ἀδελφοί ay likas na isinasalin sa Filipino bilang “mga kapatid.” Maaari itong tumukoy sa mga lalaki at babae sa buong kongregasyon nang hindi binabago ang anyo o nililinaw nang higit sa orihinal.
- source_word: προσεύχεσθε
  choice: ipanalangin ninyo
  rationale: Ang kasalukuyang pautos na pangmaramihan ay isang tuwirang pakiusap sa buong kongregasyon. Likas sa Filipino ang “ipanalangin ninyo” para sa paghiling na manalangin alang-alang sa isang tao; hindi na tahasang idinagdag ang aspektong “patuloy” dahil hindi iyon kailangang idiin sa maikling pahayag.
- source_word: περὶ
  choice: ipanalangin
  rationale: Kasama ng ἡμῶν, ipinapahayag ng περί ang taong ipinagdarasal. Sa Filipino, likas na isinama ang relasyong ito sa pandiwang “ipanalangin,” sa halip na gumamit ng hiwalay na katumbas ng pang-ukol.
- source_word: ἡμῶν
  choice: kami
  rationale: Ang unang panauhang pangmaramihang panghalip ay tumutukoy kay Pablo at sa mga kasama niya. Ginamit ang eksklusibong “kami” sapagkat hindi kabilang sa grupong tinutukoy ang mga kausap.
theological_decisions:
- issue: Kasarian at saklaw ng pantawag na Ἀδελφοί
  choice: Mga kapatid
  alternative: Mga kapatid na lalaki; Mga kapatid na lalaki at babae
  rationale: Ang “mga kapatid” ay karaniwan, marangal, at likas na pantawag sa Filipino para sa isang halo-halong kongregasyon. Pinananatili nito ang pampamilyang diwa at ang tunay na lawak ng maaaring tukuyin ng panlalaking pangmaramihang anyo sa Griyego, nang hindi nagdaragdag ng tahasang pares na wala sa teksto.
translation_notes:
  register: Maikli, tuwiran, at marangal na modernong Filipino. Ang “ipanalangin ninyo kami” ay mas natural kaysa sa “manalangin kayo para sa amin” at wastong gumagamit ng eksklusibong panghalip na “kami.”
