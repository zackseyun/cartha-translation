  yaml_path: translation/nt/1_thessalonians/005/022.yaml
  text: Abstain from every kind of evil[a].
translation:
  language: tl
  text: Lumayo kayo sa bawat uri ng kasamaan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bawat anyo ng kasamaan”; ayon sa tradisyon, “bawat anyong mukhang masama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέχεσθε
  choice: Lumayo kayo
  rationale: Ang pangkasalukuyang pautos na nasa ikalawang panauhang maramihan ay nananawagan ng patuloy na pag-iwas. Likas at malinaw sa modernong Filipino ang “lumayo kayo” at pinananatili nito ang lakas ng pautos.
- source_word: ἀπὸ
  choice: sa
  rationale: Kasama ng “lumayo,” likas sa Filipino ang pariralang “lumayo sa,” na nagpapahayag ng pag-iwas o paglalayo mula sa isang bagay.
- source_word: παντὸς
  choice: bawat
  rationale: Binabago nito ang isahang εἴδους at natural na nagpapahayag ng “bawat uri.”
- source_word: εἴδους
  choice: uri
  rationale: Sa kontekstong ito, mas malamang na tumutukoy ito sa uri o anyo kaysa sa panlabas na anyo lamang. Iniiwasan ng “uri” ang mapanlinlang na diwang dapat lamang iwasan ang anumang mukhang masama.
- source_word: πονηροῦ
  choice: kasamaan
  rationale: Tuwirang katumbas ito ng evil sa pariralang “bawat uri ng kasamaan” at natural sa marangal na modernong Filipino.
theological_decisions:
- issue: Kahulugan ng εἴδους sa pariralang ἀπὸ παντὸς εἴδους πονηροῦ
  choice: bawat uri ng kasamaan
  alternative: bawat anyo ng kasamaan; bawat anyong mukhang masama
  rationale: Mas malamang na ang parirala ay tumutukoy sa lahat ng uri o anyo ng kasamaan, hindi lamang sa anumang waring masama. Gayunman, inilalagay sa talababa ang mga alternatibo upang maging malinaw ang leksikal na saklaw at ang tradisyonal na pagbasa.
translation_notes:
  register: Maikli, marangal, at madaling maunawaan. Ginamit ang “lumayo kayo” sa halip na mas teknikal na “magpigil” upang malinaw na maipahayag ang patuloy na pag-iwas.
