  text: and to regard them very highly in love because of their work[a]. Be at peace among yourselves.
translation:
  language: tl
  text: at pahalagahan ninyo sila nang lubos at may pag-ibig dahil sa kanilang gawain.[a] Mamuhay kayong payapa sa isa't isa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “lubos na pahalagahan ninyo sila nang may pag-ibig.” Pambihira ang tindi ng pang-abay sa Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡγεῖσθαι
  choice: pahalagahan
  rationale: 'Sa konteksto, evaluative ang diwa: hinihimok ang mga mananampalataya na kilalanin ang mataas na halaga ng mga tinutukoy, hindi na ituring silang mga pinuno.'
- source_word: ὑπερεκπερισσοῦ
  choice: nang lubos
  rationale: Ipinapahayag nito sa natural na Tagalog ang pambihirang tindi ng bihirang pang-abay, habang inilalagay sa talababa ang mas mariing alternatibo.
- source_word: ἐν ἀγάπῃ
  choice: may pag-ibig
  rationale: Pinananatili ang mahalagang salitang ἀγάπη at malinaw na ipinapakitang ang pag-ibig ang paraan o saloobin ng pagpapahalaga.
- source_word: διὰ τὸ ἔργον αὐτῶν
  choice: dahil sa kanilang gawain
  rationale: Tuwirang ipinapahayag ang dahilan at pinananatili ang kongkretong pangngalang ἔργον bilang “gawain.”
- source_word: εἰρηνεύετε
  choice: Mamuhay kayong payapa
  rationale: Natural na utos ito sa modernong Tagalog at naipahihiwatig ang patuloy na pagsasagawa ng mapayapang pamumuhay.
- source_word: ἐν ἑαυτοῖς
  choice: sa isa't isa
  rationale: Malinaw at likas nitong ipinapahayag ang kapayapaan sa loob ng komunidad.
- source_word: καὶ
  choice: at
  rationale: Pinananatili ang pagkakaugnay ng pangungusap sa naunang tagubilin.
- source_word: αὐτούς
  choice: sila
  rationale: Tumutukoy ito sa mga taong binanggit sa naunang talata at natural na panghalip sa Tagalog.
