base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/018.yaml
  text: Give thanks in everything[b][a], for this is God's will in Messiah Jesus for you.
translation:
  language: tl
  text: Sa lahat ng kalagayan ay magpasalamat kayo[a], sapagkat ito ang kalooban ng Diyos para sa inyo na kay Mesiyas Jesus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “sa lahat ng bagay.” Tumutukoy ito sa bawat kalagayang kinaroroonan ng mga mananampalataya habang nagpapasalamat, at hindi kinakailangang sa pagpapasalamat dahil sa mismong kasamaan.'
    reason: lexical_alternative
  - marker: b
    text: 'Tradisyonal na salin: “kay Cristo Jesus.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν παντί
  choice: sa lahat ng kalagayan
  rationale: Ang ἐν na may datibong παντί ay tumutukoy sa kalagayan o saklaw kung saan dapat magpasalamat. Iniiwasan nitong ipahiwatig na dapat magpasalamat dahil sa mismong kasamaan.
- source_word: εὐχαριστεῖτε
  choice: magpasalamat kayo
  rationale: Tuwirang isinasalin ang pangmaramihang pautos. Likas sa Filipino ang anyong ito, habang ang patuloy na diwa ng present imperative ay hindi kailangang dagdagan ng salitang wala sa teksto.
- source_word: τοῦτο
  choice: ito
  rationale: Pinananatili ang maikli at bahagyang bukas na pagtukoy ng demonstratibo, na pinakamalapit na tumutukoy sa utos na magpasalamat.
- source_word: γὰρ
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan o batayan ng naunang utos.
- source_word: θέλημα θεοῦ
  choice: kalooban ng Diyos
  rationale: Karaniwan, malinaw, at marangal na katumbas ng pariralang Griyego.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: kay Mesiyas Jesus
  rationale: Ginagamit ang 'Mesiyas' bilang salin ng titulong Χριστός. Ang 'kay' ay likas na Filipino para sa ἐν bago ang pangalan ng tao, ngunit pinananatili sa talababa ang mas literal at tradisyonal na 'kay Cristo Jesus.'
- source_word: εἰς ὑμᾶς
  choice: para sa inyo
  rationale: Ipinahahayag nito na ang kalooban ng Diyos ay tumutukoy o nakatuon sa mga mambabasa.
theological_decisions:
- issue: Kung titulo o tradisyonal na anyo ang gagamitin para sa Χριστῷ
  choice: Mesiyas Jesus
  alternative: Cristo Jesus
  rationale: Ang Χριστός ay nananatiling makabuluhang titulo sa parirala, kaya isinalin bilang 'Mesiyas'; ibinigay sa talababa ang tradisyonal na anyo.
- issue: Kung ang pasasalamat ay nasa bawat kalagayan o dahil sa bawat bagay
  choice: sa lahat ng kalagayan
  alternative: sa lahat ng bagay
  rationale: Mas natural na ipinahihiwatig ng ἐν παντί ang kalagayang kinaroroonan ng pasasalamat, at hindi nito ipinapalagay na ang kasamaan mismo ang dahilan ng pasasalamat.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang 'sa lahat ng kalagayan' para maging likas at tumpak ang diwa ng ἐν παντί, at 'Mesiyas Jesus' upang mapanatili ang kahulugan ng titulong Χριστός.
