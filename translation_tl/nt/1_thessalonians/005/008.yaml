source:
  edition: SBLGNT
  text: ἡμεῖς δὲ ἡμέρας ὄντες νήφωμεν, ἐνδυσάμενοι θώρακα πίστεως καὶ ἀγάπης καὶ περικεφαλαίαν ἐλπίδα σωτηρίας·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/008.yaml
  text: But since we are of the day[a], let us be sober, having put on the breastplate of faith and love[b], and the hope of salvation as a helmet.
translation:
  language: tl
  text: Ngunit dahil kabilang tayo sa araw, manatili tayong matino. Isuot natin bilang baluti sa dibdib ang pananampalataya at pag-ibig[a], at bilang helmet ang pag-asa ng kaligtasan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “katapatan at pag-ibig.” Ang salitang Griyego na pistis ay maaaring mangahulugang “pananampalataya,” “pagtitiwala,” o “katapatan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: Ngunit yamang ... tayo
  rationale: Ipinapakita ng “ngunit” ang pagsalungat sa mga binanggit sa naunang konteksto, at ipinahihiwatig ng “yamang” ang lohikal na kaugnayan ng pagiging kabilang sa araw sa kasunod na panawagan.
- source_word: ἡμέρας ὄντες
  choice: kabilang tayo sa araw
  rationale: Ang genitibong ἡμέρας kasama ng ὄντες ay nagpapahayag ng pagkalakip o pag-aari sa larangan ng “araw,” hindi lamang ng oras. Pinananatili ng salin ang talinghaga sa natural na Tagalog.
- source_word: νήφωμεν
  choice: manatili tayong matino
  rationale: Maaaring tumukoy ang νήφω sa hindi pagkalasing at, sa talinghagang gamit, sa pagiging alerto at may pagpipigil sa sarili. Ang “matino” ay likas sa modernong Tagalog at nagpapanatili ng dalawang himig sa konteksto ng gabi, pagtulog, at paglalasing.
- source_word: ἐνδυσάμενοι
  choice: habang suot natin
  rationale: Inilalarawan ng participle ang kalagayan o paraang kaakibat ng panawagang manatiling matino. Ang “habang suot natin” ay natural na Tagalog at nagpapanatili sa larawan ng pagsusuot ng sandata nang hindi ginagawang hiwalay na pangunahing utos.
- source_word: θώρακα
  choice: baluti sa dibdib
  rationale: Tiyak na sandatang pananggalang sa katawan ang θώραξ. Mas malinaw sa karaniwang mambabasa ang “baluti sa dibdib” kaysa “baluti” lamang, habang pinananatili ang larawang militar.
- source_word: πίστεως
  choice: pananampalataya
  rationale: Sa pagkakapares nito sa pag-ibig at pag-asa, ang “pananampalataya” ang pinakaangkop na pangunahing salin. Posible rin ang diwang “katapatan,” kaya inilagay iyon sa talababa.
- source_word: ἀγάπης
  choice: pag-ibig
  rationale: Direkta, natural, at karaniwang salin ng ἀγάπη sa talaan ng mga birtud ni Pablo.
- source_word: περικεφαλαίαν
  choice: helmet
  rationale: Ang “helmet” ay karaniwan at madaling maunawaang modernong salitang Filipino para sa pananggalang sa ulo, at malinaw nitong pinananatili ang larawang militar.
- source_word: ἐλπίδα σωτηρίας
  choice: pag-asa ng kaligtasan
  rationale: Pinananatili nito ang posibleng ugnayan ng genitive—pag-asang nakatuon sa o kaugnay ng kaligtasan—nang hindi ito labis na binibigyang-kahulugan.
theological_decisions:
- issue: Kahulugan ng πίστις sa larawan ng baluti
  choice: pananampalataya
  alternative: katapatan; pagtitiwala
  rationale: Pinapaboran ng pagkakahanay sa pag-ibig at pag-asa ang birtud na “pananampalataya,” ngunit hindi inaalis ang posibleng diwa ng katapatan; kaya pinanatili ang alternatibo sa talababa.
- issue: Diwa ng ἡμέρας ὄντες
  choice: kabilang tayo sa araw
  alternative: tayo ay sa araw
  rationale: Ipinahahayag ng parirala ang pagkakabilang sa talinghagang larangan ng araw. Ang “kabilang” ay natural sa Tagalog ngunit hindi nagdaragdag ng tiyak na paliwanag na teolohikal tungkol sa pagkakakilanlan.
- issue: Ugnayan ng ἐλπίδα σωτηρίας at περικεφαλαίαν
  choice: ang pag-asa ng kaligtasan bilang helmet
  alternative: at bilang helmet, ang pag-asa ng kaligtasan
  rationale: Pareho ang appositional na diwa; pinili ang mas natural na ayos sa Tagalog at itinala sa talababa ang ayos na mas malapit sa pagkakasunod ng Griyego.
translation_notes:
  register: 'Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang karaniwang “helmet” sa halip na mas mahaba at di-gaanong tiyak na “pananggalang sa ulo.” Inilagay ang mga marker sa mismong bahaging tinutukoy ng bawat talababa: [a] pagkatapos ng “pag-ibig” para sa πίστις, at [b] pagkatapos ng pariralang tungkol sa helmet.'
