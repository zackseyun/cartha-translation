  yaml_path: translation/nt/1_thessalonians/005/021.yaml
  text: But test everything[a]; hold fast to what is good.
translation:
  language: tl
  text: Ngunit suriin ninyo ang lahat[a]; panghawakan ninyo ang mabuti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang lahat ng bagay.” Sa konteksto, lalo nang kasama rito ang pagsusuri sa mga pahayag na propetiko.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: ang lahat
  rationale: Ang panghalip na pangmaramihang walang tiyak na pangngalan ay malawak ang saklaw. Likas sa modernong Tagalog ang “ang lahat” at hindi nito nililimitahan ang utos sa mga propesiya lamang.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig ng δέ ang banayad na pagsalungat o paglipat mula sa naunang tagubilin. Ang “Ngunit” ay malinaw at natural nang hindi ginagawang napakatindi ang pagsalungat.
- source_word: δοκιμάζετε
  choice: suriin ninyo
  rationale: Ang pandiwa ay tumutukoy sa patuloy na pagsusuri upang malaman ang pagiging tunay o karapat-dapat ng isang bagay. Mas malinaw dito ang “suriin” kaysa “subukin,” na maaaring maunawaan bilang pagsubok sa pamamagitan ng karanasan o tukso.
- source_word: τὸ καλὸν
  choice: ang mabuti
  rationale: Ang pang-uring may pantukoy ay ginagamit bilang pangngalan at natural na naihahayag sa Tagalog bilang “ang mabuti,” na sumasaklaw sa anumang mapatutunayang mabuti.
- source_word: κατέχετε
  choice: panghawakan ninyo
  rationale: Ipinahihiwatig nito ang matatag at nagpapatuloy na pag-iingat o pananatili sa isang bagay matapos itong suriin. Ang “panghawakan” ay mas malakas kaysa simpleng “ingatan” o “panatilihin.”
theological_decisions:
- issue: Saklaw ng πάντα kaugnay ng konteksto ng propesiya at pagkilatis
  choice: Pinanatili ang malawak na “ang lahat,” habang ipinapaliwanag sa talababa na lalo nitong saklaw sa konteksto ang mga pahayag na propetiko.
  alternative: Limitahan ang salin sa “lahat ng propesiya” o “lahat ng sinasabi.”
  rationale: Bagaman binabanggit sa naunang talata ang mga propesiya, walang tahasang pangngalang naglilimita sa πάντα. Pinananatili ng salin ang lawak at tunay na tensiyon ng teksto sa halip na ipasok sa pangunahing teksto ang isang kontekstuwal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na maikli, marangal, at madaling maunawaan. Ginamit ang maramihang “ninyo” upang katawanin ang pangmaramihang mga pautos sa Griyego. Ang tuldok-kuwit ay nagpapanatili sa malapit na ugnayan ng pagsusuri at panghahawak sa mabuti.
