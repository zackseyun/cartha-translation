id: 1TH.5.24
reference: 1 Thessalonians 5:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πιστὸς ὁ καλῶν ὑμᾶς, ὃς καὶ ποιήσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/024.yaml
  text: Faithful is the one who calls you[a], who also will do it.
translation:
  language: tl
  text: Tapat ang tumatawag sa inyo; gagawin din niya ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Maaasahan ang tumatawag sa inyo; isasakatuparan din niya ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστὸς
  choice: Tapat
  rationale: Panaguring pang-uri ito na nagsasaad na maaasahan at hindi magkukulang ang Diyos. Likas at may angkop na bigat sa kontekstong ito ang “tapat.”
- source_word: ὁ καλῶν
  choice: ang tumatawag
  rationale: Ang artikulong present participle ay tumutukoy sa Diyos bilang siyang tumatawag sa kanila. Pinananatili ng “ang tumatawag” ang aspektong patuloy ng anyong Griyego nang natural sa Tagalog.
- source_word: ὑμᾶς
  choice: sa inyo
  rationale: Pangmaramihan ang panghalip at tumutukoy sa buong kapulungan; malinaw itong naipahahayag ng “sa inyo.”
- source_word: ὃς
  choice: niya
  rationale: 'Sa natural na Tagalog, ginawang hiwalay na sugnay ang kamag-anak na panghalip: “gagawin din niya.” Nananatiling iisang persona ang tumatawag at kikilos.'
- source_word: καὶ
  choice: din
  rationale: 'Ipinakikita ng “din” ang diin at pagpapatuloy: ang tumatawag ang siya ring gagawa.'
- source_word: ποιήσει
  choice: gagawin ... ito
  rationale: 'Malawak ang kahulugan ng pandiwa: gawin o isakatuparan. Ang “gagawin niya ito” ay maikli at natural, at hindi labis na tinutukoy ang bagay na ipinahihiwatig lamang ng Griyego.'
theological_decisions:
- issue: Hindi tahasang layon ng ποιήσει
  choice: “gagawin din niya ito,” na inuugnay sa ipinanalangin sa talata 23 nang hindi inuulit o pinalalawak iyon
  alternative: “isasakatuparan din niya ito”
  rationale: Walang tahasang layon ang pandiwang Griyego. Ipinahihiwatig ng malapit na konteksto ang pagpapabanal at pag-iingat na binanggit sa talata 23. Pinananatili ng “ito” ang kaiklian at bahagyang di-tiyak na pagtukoy ng orihinal.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang semicolon upang ipakita ang malapit na ugnayan ng katapatan ng Diyos at ng kaniyang pagkilos. Ang “sa inyo” ay pangmaramihan sa konteksto.
