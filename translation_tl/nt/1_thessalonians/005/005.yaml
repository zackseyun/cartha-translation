  yaml_path: translation/nt/1_thessalonians/005/005.yaml
  text: For you are all sons of light and sons of day[a]. We are not of night or of darkness.
translation:
  language: tl
  text: Sapagkat kayong lahat ay mga anak ng liwanag at mga anak ng araw.[a] Hindi tayo kabilang sa gabi ni sa kadiliman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga anak na lalaki ng liwanag at mga anak na lalaki ng araw.” Sa Griyego, idyoma ito para sa mga taong kabilang sa o nauukol sa liwanag at araw.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες γὰρ ὑμεῖς
  choice: Sapagkat kayong lahat
  rationale: Pinananatili ng “Sapagkat” ang paliwanag na ugnayan sa naunang talata, at ipinapahayag ng “kayong lahat” ang mariing inklusibong diwa ng πάντες.
- source_word: υἱοὶ φωτός
  choice: mga anak ng liwanag
  rationale: Ang “mga anak ng” ay likas na idyomatikong Filipino para sa mga taong kabilang sa o kinakikitaan ng isang katangian. Saklaw nito ang buong kapulungan, gaya ng kinatawang gamit ng panlalaking maramihan sa Griyego.
- source_word: υἱοὶ ἡμέρας
  choice: mga anak ng araw
  rationale: Pinananatili ang magkatulad na anyo ng dalawang parirala at ang sagisag ng araw bilang kabaligtaran ng gabi. Sa kontekstong ito, ang “araw” ay tumutukoy sa panahon ng liwanag, hindi sa araw na nasa kalangitan.
- source_word: οὐκ ἐσμὲν
  choice: Hindi tayo kabilang
  rationale: Pinananatili ang paglipat mula sa ikalawang panauhan na “kayo” tungo sa inklusibong unang panauhan na “tayo.” Ang “kabilang” ay natural na nagpapahayag ng ugnayang ipinahihiwatig ng mga kasunod na genitive.
- source_word: νυκτὸς οὐδὲ σκότους
  choice: sa gabi ni sa kadiliman
  rationale: Pinananatili ang pares na sagisag at ang mariing pagtanggi sa kapuwa gabi at kadiliman; natural sa Filipino ang “ni” pagkatapos ng negatibong pahayag.
theological_decisions:
- issue: Ang panlalaking pampamilyang sagisag sa υἱοὶ φωτός / υἱοὶ ἡμέρας
  choice: mga anak ng liwanag at mga anak ng araw
  alternative: mga anak na lalaki ng liwanag at mga anak na lalaki ng araw
  rationale: Bagaman literal na panlalaki ang υἱοί, ginagamit ito rito bilang idyoma ng pag-aari o katangian at tumutukoy sa lahat ng mananampalataya. Ang “mga anak” ang natural at inklusibong katumbas sa Filipino nang hindi nawawala ang pampamilyang sagisag; nililinaw ng talababa ang literal na anyo.
- issue: Paglipat mula sa ikalawang panauhan tungo sa unang panauhang maramihan
  choice: kayong lahat … Hindi tayo kabilang
  alternative: kayong lahat … Hindi kayo kabilang
  rationale: Malinaw na nagpapalit ang Griyego mula ὑμεῖς tungo sa ἐσμέν. Pinananatili ito upang maisama si Pablo at ang kaniyang mga kasama sa pahayag sa halip na pakinisin ang retorikal na pagbabago.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang biblikal na sagisag ng liwanag, araw, gabi, at kadiliman, ngunit ginamit ang natural na “kabilang” upang luminaw ang ugnayan. Ang “araw” ay inuunawa rito bilang daytime dahil sa tahasang pagtapat nito sa “gabi.”
