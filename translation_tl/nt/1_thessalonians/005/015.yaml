base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/015.yaml
  text: See to it that no one repays evil for evil to anyone[b][a], but always pursue what is good toward one another and toward all people.
translation:
  language: tl
  text: Tiyakin ninyong walang sinumang gumanti ng masama sa sinuman kapalit ng masama.[a] Sa halip, lagi ninyong pagsikapang gawin ang mabuti sa isa’t isa at sa lahat ng tao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Mag-ingat kayo, baka may gumanti ng masama sa sinuman kapalit ng masama.”
    reason: lexical_alternative
  - marker: b
    text: Ang “isa’t isa” at “lahat ng tao” ay malamang na tumutukoy muna sa kapwa mananampalataya at pagkatapos ay sa lahat ng tao sa mas malawak na saklaw.
    reason: cross_reference
lexical_decisions:
- source_word: ὁρᾶτε
  choice: Tiyakin ninyo
  rationale: Ang maramihang pautos ay idyomatikong panawagan sa buong kapulungan na magbantay at managot, hindi simpleng utos na tumingin.
- source_word: μή τις
  choice: na walang sinuman
  rationale: Ipinakikilala nito ang kilos na dapat tiyaking hindi mangyayari; malinaw at likas ito sa makabagong Tagalog.
- source_word: κακὸν ἀντὶ κακοῦ
  choice: masama sa masama
  rationale: Pinananatili nito ang pag-uulit at ang malawak na moral na diwa ng pormulang tumutukoy sa pagganti.
- source_word: τινι
  choice: kaninuman
  rationale: Tinutukoy ng datibong panghalip ang sinumang maaaring pag-ukulan ng pagganti at pinananatili ang malawak na saklaw.
- source_word: ἀποδῷ
  choice: gumanti
  rationale: Sa konteksto, ang pandiwa ay tumutukoy sa pagganti o pagbabalik ng masama bilang tugon sa naunang masama.
- source_word: πάντοτε
  choice: lagi
  rationale: Likas at tuwirang katumbas ito ng pang-abay na nagsasaad ng palagiang pagkilos.
- source_word: τὸ ἀγαθὸν
  choice: ang mabuti
  rationale: Pinananatili nito ang substantibong moral na kategorya nang hindi nililimitahan sa isang tiyak na uri ng kabutihan.
- source_word: διώκετε
  choice: pagsikapang gawin
  rationale: Ipinahahayag nito ang masigasig at aktibong paghahangad, hindi lamang ang pagkiling o pagnanais sa mabuti.
- source_word: εἰς ἀλλήλους
  choice: sa isa’t isa
  rationale: Likas nitong ipinahahayag ang direksiyon ng mabuting pagkilos sa loob ng magkakaugnay na pamayanan.
- source_word: καὶ εἰς πάντας
  choice: at sa lahat ng tao
  rationale: Ginagawang malinaw sa Tagalog ang malawak na saklaw ng πάντας, habang nananatili ang kaibahan nito sa ‘isa’t isa.’
theological_decisions:
- issue: Saklaw ng pananagutang etikal
  choice: Pinananatili ang paglawak mula sa ‘isa’t isa’ tungo sa ‘lahat ng tao.’
  alternative: Maaaring unawain ang ‘lahat’ bilang lahat lamang ng mga mananampalataya.
  rationale: Ang magkatambal na εἰς ἀλλήλους καὶ εἰς πάντας ay likas na nagpapahiwatig ng paglawak mula sa panloob na ugnayan ng pamayanan tungo sa mas malawak na pangkat, ngunit inilalahad ito sa talababa bilang malamang na diwa sa halip na gawing tahasang doktrina sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang maramihang ‘ninyo’ upang mapanatili ang pangkomunidad na utos, at ang ‘pagsikapang gawin’ upang maipakita ang masiglang lakas ng διώκετε nang hindi nagiging artipisyal ang pananalita.
