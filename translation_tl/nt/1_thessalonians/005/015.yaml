  source_fidelity: Tumpak na naipapahayag ng salin ang maramihang panawagan na pigilan ang paghihiganti, ang pag-uulit ng κακόν ('masama'), ang patuloy na masigasig na paghahangad ng mabuti, at ang saklaw na mula sa isa’t isa hanggang sa lahat ng tao. Nilinaw lamang ang pag-uugnay ng tatanggap ng pagganti upang hindi maging malabo ang Tagalog.
  naturalness: 'Ang pangunahing teksto ay halos likas, ngunit ang ''kaninuman'' na walang pang-ukol pagkatapos ng ''gumanti ng masama sa masama'' ay mabigat at maaaring magpalabo sa dalawang magkaibang gamit ng ''sa.'' Ang inayos na ayos ay mas malinaw sa modernong Filipino Tagalog. May di-ganap ding parirala sa talababa b: ''sa lahat nang mas malawak.'''
  terminology: Ang 'gumanti,' 'masama,' 'mabuti,' 'pagsikapang gawin,' 'isa’t isa,' at 'lahat ng tao' ay angkop, malinaw, at nasa marangal ngunit makabagong rehistro. Hindi nilulutas ng teksto ang pinagtatalunang saklaw ng 'lahat'; ang maingat na paliwanag ay nananatili sa talababa.
