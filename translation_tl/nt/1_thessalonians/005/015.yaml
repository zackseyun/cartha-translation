  - severity: medium
    issue: 'Di-ganap at di-likas ang huling bahagi ng talababa b: ''at pagkatapos ay sa lahat nang mas malawak.'''
    rationale: Hindi malinaw kung ano ang tinutukoy ng 'mas malawak.' Dapat itong kumpletuhin bilang 'lahat ng tao sa mas malawak na saklaw.'
