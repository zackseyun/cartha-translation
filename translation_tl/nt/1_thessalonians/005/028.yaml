translation:
  language: tl
  text: '**1 Tesalonica 5:28**


    Sumainyo ang biyaya ng Panginoon nating Jesus na Mesiyas.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάρις
  choice: biyaya
  rationale: Sa mga pangwakas na pagpapala ni Pablo, ang χάρις ay tumutukoy sa mapagbigay at di-nararapat na kabutihang nagmumula sa Diyos. Ang “biyaya” ang likas at kinikilalang katumbas nito sa makabagong Filipino.
- source_word: κυρίου
  choice: Panginoon
  rationale: Dito, ang κύριος ay titulong inilalapat kay Jesus; pinananatili ng “Panginoon” ang bigat at karaniwang gamit nito sa Kasulatan.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Ginamit ang karaniwang anyo ng pangalang ito sa Filipino.
- source_word: Χριστοῦ
  choice: Mesiyas
  rationale: Ang Χριστός ay isang titulong nangangahulugang “Pinahiran” o “Mesiyas.” Ang pariralang “Jesus na Mesiyas” ay malinaw sa karaniwang mambabasa at hindi ito ipinapakitang apelyido lamang.
- source_word: μεθ’ ὑμῶν
  choice: sumainyo
  rationale: Literal itong “kasama ninyo.” Sa isang pormula ng pagpapala na walang hayag na pandiwa sa Griyego, ang “sumainyo” ay maikli, natural, at tapat sa ipinahihiwatig na kahilingang manatili sa kanila ang biyaya.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστοῦ sa pangwakas na pagpapala
  choice: Jesus na Mesiyas
  alternative: Jesu-Cristo
  rationale: Pinananatiling malinaw ng napiling anyo na ang Χριστός ay titulo. Gayunman, ang “Jesu-Cristo” ay lehitimo at nakaugaliang anyo sa Filipino.
- issue: Puwesto at himig ng pormula ng pagpapala
  choice: Sumainyo ang biyaya…
  alternative: Ang biyaya… ay sumainyo
  rationale: Parehong posible, ngunit ang nauunang “Sumainyo” ay natural at marangal na pormula ng pagpapala sa Filipino, habang hindi dinaragdagan ng tahasang “nawa” ang walang pandiwang pormula sa Griyego.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang maikli at pamilyar na “sumainyo” para sa pangwakas na pagpapala, at ang “Jesus na Mesiyas” upang maipakitang titulo ang Χριστός.
