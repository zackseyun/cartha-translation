  yaml_path: translation/nt/1_thessalonians/005/007.yaml
  text: For those who sleep, sleep at night, and those who get drunk, get drunk at night.
translation:
  language: tl
  text: Sapagkat ang mga natutulog ay natutulog sa gabi, at ang mga naglalasing ay naglalasing sa gabi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag o batayan ng naunang pangaral at natural na nag-uugnay sa daloy ng pangungusap.
- source_word: οἱ καθεύδοντες ... καθεύδουσιν
  choice: ang mga natutulog ay natutulog
  rationale: Ginagawang pangkalahatang pagtukoy ang articular participle at pinananatili ang pag-uulit at paralelismong retorikal ng Griyego.
- source_word: νυκτός
  choice: sa gabi
  rationale: Likas na salin sa modernong Tagalog ng genitibong ginagamit bilang pang-abay na panahunan.
- source_word: οἱ μεθυσκόμενοι ... μεθύουσιν
  choice: ang mga naglalasing ay naglalasing
  rationale: Ipinahahayag ang karaniwang pagkilos ng paglalasing at pinananatili ang sadyang pag-uulit na kaagapay ng unang sugnay.
- source_word: καί
  choice: at
  rationale: Payak na pangatnig na nagdurugtong sa dalawang magkatimbang na sugnay.
theological_decisions:
- issue: Literal o metaporikal na pagpapahayag ng pagtulog at paglalasing
  choice: Panatilihin sa pangunahing teksto ang literal na mga larawang “natutulog” at “naglalasing.”
  alternative: Isalin bilang espirituwal na kawalang-malay at imoral na pamumuhay.
  rationale: Ginagamit ni Pablo ang pangkaraniwang asal sa gabi bilang larawan sa mas malawak na pangaral. Ang literal na pananalita ay nagpapanatili sa analogiya at hindi isinasama sa salin ang paliwanag nito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignificado, at madaling maunawaan. Pinanatili ang maikli at balanseng paralelismo ng orihinal.
