  source_fidelity: Kailangang baguhin ang “hanggang sa pagdating” tungo sa “sa pagdating.” Ang ἐν τῇ παρουσίᾳ ay tumutukoy sa kalagayan o panahon sa pagdating, hindi tahasang sa tagal ng pag-iingat hanggang roon. Ang “Diyos ng kapayapaan” ay mas tapat ding pinananatili ang nakapirming Pauline na titulo kaysa “Diyos na pinagmumulan ng kapayapaan.”
  naturalness: Ang binagong ayos ay natural sa modernong Filipino Tagalog at malinaw na ang buong espiritu, kaluluwa, at katawan ang paksa ng kahilingang mapanatiling walang kapintasan.
  terminology: Pinananatili ang “magpabanal,” “espiritu,” “kaluluwa,” “katawan,” at “Mesiyas.” Ibinabalik ng talababa ang tradisyonal na “Jesu-Cristo” at nagdaragdag ng talababa para sa triad upang hindi magpahiwatig ng isang partikular na doktrinang antropolohikal.
