    rationale: Ang Griyego ay gumagamit ng ἐν (“sa”) kaugnay ng παρουσία. Bagaman maaaring isipin sa konteksto ang patuloy na pag-iingat, hindi ito dapat gawing pangunahing semantikong nilalaman ng pang-ukol.
  - severity: medium
