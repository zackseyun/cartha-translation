  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ὁ θεὸς τῆς εἰρήνης ἁγιάσαι ὑμᾶς ὁλοτελεῖς, καὶ ὁλόκληρον ὑμῶν τὸ πνεῦμα καὶ ἡ ψυχὴ καὶ τὸ σῶμα ἀμέμπτως ἐν τῇ παρουσίᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ τηρηθείη.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/023.yaml
  text: May the God of peace himself sanctify you completely[b][a], and may your whole spirit and soul and body be kept blameless at the coming of our Lord Jesus the Messiah.
translation:
  language: tl
  text: Ang Diyos mismo ng kapayapaan ang magpabanal nawa sa inyo nang lubusan, at nawa’y mapanatiling walang kapintasan sa pagdating ng ating Panginoong Jesus na Mesiyas ang inyong buong espiritu, kaluluwa, at katawan.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ayon sa tradisyonal na katawagan, “ating Panginoong Jesu-Cristo.”
    reason: alternative_reading
  - marker: b
    text: Binabanggit ni Pablo ang “espiritu, kaluluwa, at katawan”; magkakaiba ang paliwanag kung itinuturo nito ang tatlong-bahaging pagtingin sa pagkatao o idinidiin lamang ang buong pagkatao.
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς δὲ ὁ θεὸς τῆς εἰρήνης
  choice: Ang Diyos mismo na pinagmumulan ng kapayapaan
  rationale: Pinananatili ng “mismo” ang diin ng Αὐτός. Ang “na pinagmumulan ng kapayapaan” ay likas na Filipino para sa genitibong τίτulong “Diyos ng kapayapaan,” nang hindi nililimitahan ang kahulugan sa payapang katangian lamang. Hindi isinalin nang hiwalay ang δέ sapagkat banayad itong panandang transisyon at magiging pilit ang tahasang pangatnig dito.
- source_word: ἁγιάσαι ὑμᾶς ὁλοτελεῖς
  choice: ang magpabanal nawa sa inyo nang lubusan
  rationale: Ang “nawa” ay naghahayag ng panalangin o hangarin ng optatibo. Pinananatili ng “magpabanal” ang ugnayan sa kabanalan, at ng “nang lubusan” ang saklaw ng ὁλοτελεῖς.
- source_word: ὁλόκληρον ὑμῶν
  choice: ang inyong buong
  rationale: Ipinahahayag ng ὁλόκληρον ang kabuuan o pagiging ganap; ang ayos na ito ay natural bago ang tatlong tahasang binanggit na sangkap.
- source_word: τὸ πνεῦμα καὶ ἡ ψυχὴ καὶ τὸ σῶμα
  choice: espiritu, kaluluwa, at katawan
  rationale: Pinananatili ang tatlong magkakaibang katawagan sa Griyego nang hindi nagpapasya kung teknikal itong paghahati sa pagkatao o retorikal na pagdidiin sa buong tao.
- source_word: ἀμέμπτως ... τηρηθείη
  choice: maingatan nawa nang walang kapintasan
  rationale: Ang anyong pasibo at optatibong panalangin ay pinananatili sa “maingatan nawa”; natural na inilalarawan ng “nang walang kapintasan” ang kalagayang hinihiling.
- source_word: ἐν τῇ παρουσίᾳ
  choice: hanggang sa pagdating
  rationale: Sa kontekstong eskatolohikal, παρουσία ay ang pagdating o presensiya ng Panginoon. Ang “hanggang sa” ay natural sa Filipino sa ideya ng pag-iingat na nagpapatuloy patungo sa sandaling iyon; ang mas pormal na “sa pagdating” ay ibinibigay sa talababa.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: ng ating Panginoong Jesus na Mesiyas
  rationale: Ang Χριστός ay isinaling bilang titulong “Mesiyas,” samantalang ang “Panginoong Jesus” ay likas at marangal na anyo sa Filipino.
theological_decisions:
- issue: 'Tatlong katawagan sa pagkatao: espiritu, kaluluwa, at katawan'
  choice: Panatilihin ang tatlong katawagan at ang pagdidiin sa kabuuan nang hindi ipinapaliwanag sa pangunahing teksto bilang isang sistemang tatluhang paghahati.
  alternative: Unawain ang listahan bilang retorikal na pagtukoy sa buong pagkatao, hindi bilang teknikal na antropolohiya.
  rationale: Tahasan ang tatlong termino sa Griyego, ngunit hindi pinagpapasyahan ng talata kung doktrinal itong paglalarawan ng tatlong hiwalay na bahagi. Dapat manatili ang tensiyong iyon.
- issue: Kahulugan ng Χριστοῦ
  choice: Mesiyas
  alternative: Cristo
  rationale: Ang Χριστός ay titulo na nangangahulugang Mesiyas o Pinahiran. Isinasalin ang kahulugan sa pangunahing teksto at pinananatili sa talababa ang tradisyonal na “Cristo.”
- issue: Saklaw ng ἀμέμπτως
  choice: Iugnay ang “walang kapintasan” sa pag-iingat sa buong espiritu, kaluluwa, at katawan.
  alternative: Ipakahulugang binabago nito ang paraan ng pag-iingat (“maingatan nang walang maipipintas”).
  rationale: Pinahihintulutan ng ayos ng Griyego ang predikatibong diwa; ang salin ay natural sa Filipino at hindi nagdaragdag ng paliwanag kung kanino nagmumula ang paghatol.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at malinaw. Ginamit ang “nawa” upang ipakita ang anyong panalangin. Iniwasan ang sobrang arkaikong ayos, ngunit pinanatili ang mga terminong “magpabanal,” “espiritu,” “kaluluwa,” at “Mesiyas” dahil mahalaga ang kanilang leksikal at teolohikal na pagkakaugnay.
