  text: Do not despise prophecies[a].
translation:
  language: tl
  text: Huwag ninyong hamakin ang mga propesiya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga pahayag na may propesiya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προφητείας
  choice: mga pahayag ng propesiya
  rationale: Ang akusatibong pangmaramihan ay tumutukoy sa mga pagkakataon o kapahayagan ng propesiya, hindi lamang sa propesiya bilang abstraktong konsepto. Likas sa modernong Filipino ang pariralang ito at pinananatili nito ang pangmaramihang diwa.
- source_word: μὴ
  choice: Huwag ninyong
  rationale: Karaniwang pagbabawal ito kasama ng pangkasalukuyang pautos. Ipinahahayag ng “ninyong” na pangmaramihan ang mga taong kinakausap.
- source_word: ἐξουθενεῖτε
  choice: hamakin
  rationale: Ibig sabihin ng pandiwa na ituring na walang halaga o lapastanganin. Ang “hamakin” ay maikli, natural, at mas malakas kaysa sa simpleng “tanggihan.”
theological_decisions:
- issue: Kahulugan ng προφητείας sa konteksto ng unang iglesyang Kristiyano
  choice: Panatilihin ang malawak na diwang “mga pahayag ng propesiya.”
  alternative: mga propesiya; mga mensaheng sinasabing mula sa Diyos
  rationale: Hindi nililinaw ng salitang Griyego ang eksaktong paraan o saklaw ng gawaing ito. Iniiwasan ng salin na ipasok ang paninindigan ng alinmang denominasyon tungkol sa pagpapatuloy o paghinto ng propesiya.
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang pangmaramihang “ninyong” upang katawanin ang ikalawang panauhang pangmaramihan ng Griyego; malinaw ngunit hindi pinasobrahan ang lakas ng pagbabawal.
