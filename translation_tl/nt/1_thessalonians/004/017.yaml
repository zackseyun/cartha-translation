  naturalness: Malinaw at marangal ang Tagalog. Mas tuwiran at likas ang “Pagkatapos nito” para sa ἔπειτα sa ugnayan nito sa naunang talata. Ang “magiging kasama ng Panginoon” ay nagpapanatili ng tahasang hinaharap na diwa ng ἐσόμεθα nang hindi umaasa sa modal na himig na maaaring madama sa “makakapiling.”
  terminology: Ang “Panginoon,” “mga ulap,” at “himpapawid” ay angkop sa rehistro at sa konteksto. Ang “aagawin” ay neutral at sapat na malakas para sa ἁρπαγησόμεθα, nang hindi nagdadagdag ng isang partikular na eskatolohikal na balangkas.
