  rationale: Inalis ang hindi tahasang “paitaas,” pinatingkad ang ugnayang pansunod sa naunang talata sa “Pagkatapos nito,” at ginawang mas tahasan ang hinaharap at patuloy na pakikisama sa Panginoon. Inilipat ang natitirang tala sa angkop na angkla sa pariralang “upang salubungin ang Panginoon sa himpapawid.” Hindi kailangan ang hiwalay na lexical-alternative footnote para sa “aagawin,” dahil malinaw at neutral na nitong isinasalin ang pandiwang Griyego.
