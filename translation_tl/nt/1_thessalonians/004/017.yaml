  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἔπειτα ἡμεῖς οἱ ζῶντες οἱ περιλειπόμενοι ἅμα σὺν αὐτοῖς ἁρπαγησόμεθα ἐν νεφέλαις εἰς ἀπάντησιν τοῦ κυρίου εἰς ἀέρα· καὶ οὕτως πάντοτε σὺν κυρίῳ ἐσόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/017.yaml
  text: Then we who are alive[a], who remain, will be caught up together with them in the clouds to meet the Lord in the air[b]; and so we will always be with the Lord.
translation:
  language: tl
  text: Pagkatapos nito, tayong mga buháy na nananatili pa ay sabay na aagawin kasama nila sa mga ulap upang salubungin ang Panginoon sa himpapawid[a]. At sa gayon, lagi tayong magiging kasama ng Panginoon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “upang makipagtagpo sa Panginoon sa himpapawid.” Maaaring tumukoy ang parirala sa pagpunta upang salubungin ang isang dumarating, ngunit hindi tinutukoy ng talatang ito ang mas malawak na pagkakasunod-sunod ng mga pangyayari pagkatapos ng pagtatagpong ito.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔπειτα
  choice: Pagkatapos
  rationale: Malinaw na ipinapakita ang kasunod na pangyayari matapos ang pagkabuhay ng mga namatay kay Cristo na binanggit sa naunang talata.
- source_word: οἱ ζῶντες οἱ περιλειπόμενοι
  choice: tayong mga buháy na nananatili pa
  rationale: 'Pinananatili ang dalawang paglalarawan: sila ay buháy at naririto pa sa panahong iyon, nang hindi ipinahihiwatig na nakaligtas sila mula sa isang tiyak na panganib.'
- source_word: ἅμα σὺν αὐτοῖς
  choice: sabay ... kasama nila
  rationale: Ipinahahayag kapwa ang pagsabay sa pangyayari at ang pakikisama sa mga muling binuhay.
- source_word: ἁρπαγησόμεθα
  choice: aagawin paitaas
  rationale: Ang pandiwang nasa anyong hinaharap at balintiyak ay nagpapahiwatig ng biglaan at makapangyarihang pagkilos sa kanila. Ang “paitaas” ay likas sa konteksto ng pagpunta sa mga ulap at himpapawid, ngunit hindi nagdaragdag ng isang sistemang eskatolohikal.
- source_word: ἐν νεφέλαις
  choice: sa mga ulap
  rationale: Pinananatili ang kongkretong maramihang larawan ng mga ulap at ang posibleng teopanikong alusyon nito.
- source_word: εἰς ἀπάντησιν τοῦ κυρίου
  choice: upang salubungin ang Panginoon
  rationale: Likas na Tagalog para sa sadyang pagpunta upang makipagtagpo sa isang dumarating, habang hindi tinutukoy ang susunod na direksiyon o mas malawak na pagkakasunod-sunod ng mga pangyayari.
- source_word: εἰς ἀέρα
  choice: sa himpapawid
  rationale: Ang “himpapawid” ay malinaw at marangal na katumbas ng lokasyong nasa hangin sa itaas.
- source_word: καὶ οὕτως
  choice: At sa gayon
  rationale: Ipinapakita ang bunga o kalagayang nagmumula sa inilarawang pangyayari.
- source_word: πάντοτε σὺν κυρίῳ ἐσόμεθα
  choice: lagi na tayong makakapiling ng Panginoon
  rationale: Likas na ipinahahayag ang patuloy at panghinaharap na pakikisama sa Panginoon; ang “lagi na” ay tuwirang tumutugma sa πάντοτε.
theological_decisions:
- issue: Ang kahulugan ng ἁρπαγησόμεθα sa mga pagtatalo tungkol sa tinatawag na “rapture”
  choice: aagawin paitaas
  alternative: dadalhin paitaas
  rationale: Tuwirang pinananatili ng “aagawin” ang biglaan at malakas na kilos ng pandiwa, ngunit hindi nito itinatakda ang tiyempo o anyo ng pangyayari ayon sa anumang sistemang denominasyonal.
- issue: Ang saklaw ng εἰς ἀπάντησιν τοῦ κυρίου
  choice: upang salubungin ang Panginoon
  alternative: upang makipagtagpo sa Panginoon
  rationale: Ipinahahayag nito ang paglabas o pagpunta upang harapin ang dumarating na Panginoon, ngunit iniiwang bukás ang mas malawak na pagkakasunod-sunod pagkatapos ng pagtatagpong ito sapagkat hindi iyon tinutukoy ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “buháy” na may tuldik upang maiwasan ang saglit na kalituhan sa pagbasa. Iniwasan ang teknikal na salitang “rapture” sa pangunahing teksto at ang anumang denominasyonal na pagpapakahulugan.
