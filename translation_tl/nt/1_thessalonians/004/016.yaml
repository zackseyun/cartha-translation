  text: For the Lord himself will descend from heaven with a command[a], with the voice of an archangel, and with the trumpet of God, and the dead in Messiah will rise first[b],
translation:
  language: tl
  text: Sapagkat ang Panginoon mismo ay bababa mula sa langit kasabay ng isang utos[a], ng tinig ng isang arkanghel, at ng trumpeta ng Diyos; at ang mga patay na nakaugnay sa Mesiyas ay unang babangon[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kasabay ng isang sigaw na nag-uutos.” Ang Griyegong κέλευσμα ay maaaring tumukoy sa isang utos, panawagan, o sigaw na nag-uutos.
    reason: lexical_alternative
  - marker: b
    text: 'Tradisyonal na salin: “ang mga patay kay Cristo ay unang babangon.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Sapagkat
  rationale: Nagpapakilala ito ng paliwanag sa naunang katiyakan; likas sa Tagalog ang “Sapagkat” para sa ganitong ugnayan.
- source_word: αὐτὸς ὁ κύριος
  choice: ang Panginoon mismo
  rationale: Pinananatili ng “mismo” ang mariing diin ng αὐτός sa mismong Panginoon bilang paksa.
- source_word: ἐν κελεύσματι
  choice: kasabay ng isang utos
  rationale: Ang κέλευσμα ay utos o panawagang nag-uutos. Ipinahihiwatig ng “kasabay ng” ang kalakip na pangyayari nang hindi ipinapalagay kung sino ang sumigaw.
- source_word: ἐν φωνῇ ἀρχαγγέλου
  choice: ng tinig ng isang arkanghel
  rationale: Tuwirang inililipat ang φωνή bilang “tinig”; dahil walang pantukoy ang ἀρχαγγέλου, hindi ito ginawang tiyak na “ang arkanghel.”
- source_word: ἐν σάλπιγγι θεοῦ
  choice: ng trumpeta ng Diyos
  rationale: Ang “trumpeta” ang karaniwang makabagong salin ng σάλπιγξ, at pinananatili ng pariralang “ng Diyos” ang genitibong kayarian.
- source_word: καταβήσεται ἀπ’ οὐρανοῦ
  choice: ay bababa mula sa langit
  rationale: Likas at malinaw na Tagalog para sa aktibong pagkilos na καταβήσεται at pinagmulan na ἀπ’ οὐρανοῦ.
- source_word: οἱ νεκροὶ ἐν Χριστῷ
  choice: ang mga namatay na nakaugnay sa Mesiyas
  rationale: Mas natural kaysa literal na “mga patay sa Mesiyas” at ipinapahayag ang relasyonal na diwa ng ἐν Χριστῷ, habang isinasalin ang Χριστός bilang titulong “Mesiyas.”
- source_word: ἀναστήσονται πρῶτον
  choice: ay unang bubuhayin
  rationale: Sa konteksto, malinaw na tumutukoy ito sa muling pagkabuhay. Bagaman nasa anyong middle ang pandiwa, maaaring magkaroon ng intransitibo o resureksiyonal na diwa; ang talababa ay nag-iingat ng mas pormal na “babangon.”
theological_decisions:
- issue: Kahulugan ng ἐν Χριστῷ
  choice: nakaugnay sa Mesiyas
  alternative: nasa Mesiyas; kay Cristo
  rationale: Iniiwasan nito ang malabo at di-likas na literalismong “sa Mesiyas,” ngunit hindi tinutukoy nang mas makitid kung paano umiiral ang ugnayang iyon. Pinananatili rin ang Χριστός bilang titulong “Mesiyas.”
- issue: Tinig ng arkanghel at utos
  choice: Hindi tinukoy kung kaninong tinig ang nagbibigay ng utos
  alternative: Ang Panginoon ang sumisigaw ng utos; ang arkanghel ang nagbibigay ng utos
  rationale: Magkahanay ang tatlong pariralang ἐν, ngunit hindi tahasang sinasabi ng Griyego kung ang utos at tinig ay iisang tunog o kung sino ang nagsasalita. Hindi ito nilutas ng salin.
- issue: Tinig ng isang arkanghel
  choice: isang arkanghel
  alternative: ang arkanghel
  rationale: Walang pantukoy ang ἀρχαγγέλου. Ang “isang” ay nagpapanatili sa di-tiyak na anyo nang hindi ipinapalagay na may iisang arkanghel lamang.
- issue: Diwa ng ἀναστήσονται
  choice: bubuhayin
  alternative: babangon
  rationale: Nililinaw ng pangunahing teksto ang resureksiyonal na kahulugan sa natural na Tagalog, habang inilalagay sa talababa ang mas pormal at aktibong anyo upang hindi maitago ang anyong pandiwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Panginoon,” “arkanghel,” “trumpeta,” at “Mesiyas” bilang mga salitang pamilyar sa karaniwang mambabasa. Ang semicolon ay naghihiwalay sa pagbaba ng Panginoon at sa kasunod na pagkabuhay ng mga namatay nang hindi pinuputol ang iisang pangungusap.
