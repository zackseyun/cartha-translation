translation:
  language: tl
  text: Tungkol naman sa pag-ibig sa mga kapatid[a], hindi na ninyo kailangan na may sumulat sa inyo[b], sapagkat kayo mismo ay tinuruan ng Diyos upang magmahalan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas tiyak: “pag-ibig sa mga kapuwa mananampalataya.” Ang salitang Griyego ay gumagamit ng larawan ng pagmamahalan sa loob ng isang pamilya.'
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, walang tahasang binanggit kung sino ang susulat; maaaring ipinahihiwatig ng konteksto si Pablo at ang kaniyang mga kasama.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Tungkol naman sa
  rationale: Ipinakikilala nito ang panibagong paksa habang pinananatili ng “naman” ang banayad na ugnayan sa naunang bahagi, nang hindi nagdaragdag ng salitang panahong katumbas ng “ngayon.”
- source_word: φιλαδελφίας
  choice: pag-ibig sa mga kapatid
  rationale: Ipinahahayag nito ang pag-ibig na tulad ng nasa isang pamilya sa loob ng sambayanan ng mga mananampalataya. Likas ito sa modernong Tagalog at hindi nililimitahan sa mga lalaking kapatid.
- source_word: οὐ χρείαν ἔχετε γράφειν ὑμῖν
  choice: hindi na kailangang may sumulat sa inyo
  rationale: Walang hayag na simuno ang infinitive na γράφειν. Ang “may sumulat” ay natural sa Tagalog at hindi labis na tinutukoy na sina Pablo at ang kaniyang mga kasama lamang ang ipinahihiwatig na manunulat.
- source_word: αὐτοὶ γὰρ ὑμεῖς
  choice: sapagkat kayo mismo
  rationale: Pinananatili ng “kayo mismo” ang diin ng magkasamang αὐτοί at ὑμεῖς; malinaw namang nagpapakita ng dahilan ang “sapagkat.”
- source_word: θεοδίδακτοί
  choice: tinuruan ng Diyos
  rationale: Malinaw at tuwirang pinananatili nito ang Diyos bilang tagapagturo, nang hindi gumagamit ng di-likas na tambalang salita.
- source_word: εἰς τὸ ἀγαπᾶν ἀλλήλους
  choice: na magmahalan
  rationale: Natural na ipinahahayag ng anyong gantihan na “magmahalan” ang pag-ibig sa isa’t isa at ang layon o bunga ng pagtuturo ng Diyos.
theological_decisions:
- issue: Pagkakaiba ng φιλαδελφία at ἀγαπᾶν sa iisang talata
  choice: Isinalin ang una bilang “pag-ibig sa mga kapatid” at ang ikalawa bilang pandiwang “magmahalan.”
  alternative: Isalin ang dalawang termino sa magkaparehong pangkalahatang salita para sa pag-ibig.
  rationale: Pinananatili nito ang paglipat mula sa tiyak na pag-ibig na pampamilya sa mga kapuwa mananampalataya tungo sa aktuwal at tugunang pagmamahalan, nang hindi pinalalabo ang pagkakaiba ng mga salitang Griyego.
- issue: Di-hayag na simuno ng γράφειν
  choice: Gumamit ng di-tiyak na “may sumulat sa inyo.”
  alternative: “Sulatan namin kayo” o “sumulat kami sa inyo.”
  rationale: Bagaman malamang na sina Pablo at ang kaniyang mga kasama ang ipinahihiwatig ng konteksto, walang tahasang simuno ang infinitive sa Griyego. Pinananatili ng salin ang hindi pagiging tiyak nito.
- issue: Pinagmulan ng pagtuturo tungkol sa pag-ibig
  choice: “tinuruan ng Diyos”
  alternative: “natutuhan ninyo mula sa Diyos”
  rationale: Pinananatili ng napiling anyo ang tahasang banal na pagkilos na nasa θεοδίδακτοι, nang hindi ipinapaliwanag kung paano isinagawa ng Diyos ang pagtuturo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling basahin. Ginamit ang “mga kapatid” bilang nakaugaliang inklusibong katawagan sa sambayanan ng mga mananampalataya, at “magmahalan” bilang likas na anyong gantihan para sa “ibigin ang isa’t isa.”
