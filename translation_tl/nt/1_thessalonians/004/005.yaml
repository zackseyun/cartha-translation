  source_fidelity: 'Tumpak na naipapahayag ang μὴ ἐν πάθει ἐπιθυμίας bilang paraan/kalagayang dapat iwasan: “hindi sa silakbo ng mahalay na pagnanasa.” Napapanatili rin ang paghahambing na καθάπερ καὶ, ang pagtukoy ng τὰ ἔθνη sa “mga Hentil,” at ang attributive na paglalarawan na “na hindi nakakakilala sa Diyos.”'
