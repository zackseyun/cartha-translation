lexical_decisions:
- source_word: μὴ ἐν πάθει ἐπιθυμίας
  choice: hindi sa silakbo ng mahalay na pagnanasa
  rationale: Ipinagpapatuloy ng “hindi” ang tagubilin sa naunang talata. Ang “sa silakbo” ay likas na paraan sa Filipino upang ipahayag ang kalagayan o paraang tinutukoy ng ἐν πάθει, samantalang pinananatili ng “mahalay na pagnanasa” ang seksuwal at negatibong diwa ng ἐπιθυμίας sa konteksto.
- source_word: καθάπερ καὶ
  choice: gaya rin ng
  rationale: Malinaw at likas na ipinahahayag nito ang paghahambing at pinananatili ang dagdag na puwersa ng καί.
- source_word: τὰ ἔθνη
  choice: mga Hentil
  rationale: Sa gamit ni Pablo, karaniwang tumutukoy ito sa mga di-Judio. Ang “mga Hentil” ang pinakatumpak na katawagang panrelihiyon at pangkasaysayan nang hindi idinaragdag ang mapanghamak na himig na maaaring taglayin ng ibang katawagan.
- source_word: τὰ μὴ εἰδότα τὸν θεόν
  choice: na hindi nakakakilala sa Diyos
  rationale: Inilalarawan ng pariralang participial ang patuloy na kalagayan ng mga tinutukoy. Ang “nakakakilala sa Diyos” ay natural at may personal-relasyonal na lawak na angkop sa εἰδότα, nang hindi nilulutas nang labis ang kahulugan nito.
theological_decisions:
- issue: Diwa ng πάθει ἐπιθυμίας sa tagubiling seksuwal
  choice: silakbo ng mahalay na pagnanasa
  alternative: marubdob na pagnanasa; mahalay na silakbo ng damdamin
  rationale: Tinutukoy ng konteksto ang di-maayos na pagnanasang seksuwal. Pinananatili ng salin ang lakas ng πάθος at ang naglalarawang genitive na ἐπιθυμίας, ngunit gumagamit ng natural na pariralang Filipino.
- issue: Saklaw ng τὰ ἔθνη
  choice: mga Hentil
  alternative: mga bansa; mga pagano
  rationale: Karaniwang tawag ito ni Pablo sa mga di-Judio, ngunit sa talatang ito lalo silang inilalarawan bilang mga hindi nakakakilala sa Diyos. Hindi ginawang “mga pagano” sa pangunahing teksto upang maiwasang ipalit ang mas interpretibong katawagan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ang “silakbo” ay madaling maunawaan at naipapakita ang puwersa ng matinding damdamin; ang “mahalay na pagnanasa” ay nililinaw ng kontekstong seksuwal. Pinanatili ang kuwit sa hulihan dahil bahagi ang talata ng nagpapatuloy na pangungusap mula sa naunang talata.
