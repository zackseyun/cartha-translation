  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τοῦτο γὰρ ὑμῖν λέγομεν ἐν λόγῳ κυρίου, ὅτι ἡμεῖς οἱ ζῶντες οἱ περιλειπόμενοι εἰς τὴν παρουσίαν τοῦ κυρίου οὐ μὴ φθάσωμεν τοὺς κοιμηθέντας·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/015.yaml
  text: 'For this we say to you by a word from the Lord: that we who are living[a], who remain until the coming of the Lord[c][b], will certainly not precede those who have fallen asleep.'
translation:
  language: tl
  text: 'Sapagkat ito ang sinasabi namin sa inyo sa pamamagitan ng isang salita mula sa Panginoon[a]: tayong mga buháy, na mananatili hanggang sa pagdating ng Panginoon[b], ay hinding-hindi mauuna sa mga nakatulog na[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa pamamagitan ng salita ng Panginoon.” Maaaring tumukoy ang Griyego sa isang sinabi ng Panginoong Jesus o sa isang pahayag na ibinigay sa awtoridad ng Panginoon.
    reason: alternative_reading
  - marker: b
    text: 'Maaari ring “presensiya” (Griyego: παρουσία).'
    reason: lexical_alternative
  - marker: c
    text: Ang “mga nakatulog na” ay isang metapora para sa mga mananampalatayang namatay na.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν λόγῳ κυρίου
  choice: sa pamamagitan ng isang salita mula sa Panginoon
  rationale: Ipinapakita nito na ang sinabi ni Pablo ay nakabatay sa salita at awtoridad ng Panginoon, habang hindi ipinapasiya kung iyon ay isang naipasa nang sinabi ni Jesus o isang pahayag na ibinigay sa awtoridad niya.
- source_word: οἱ ζῶντες
  choice: tayong mga buháy
  rationale: Likas at tuwirang isinasalin ang kasalukuyang participle at pinananatili ang pagsasama ni Pablo sa pangkat na tinutukoy niya.
- source_word: οἱ περιλειπόμενοι
  choice: na mananatili
  rationale: Tumutukoy ito sa mga nananatiling buháy hanggang sa itinakdang pangyayari, nang hindi idinaragdag ang maaaring ipahiwatig ng salitang “makaliligtas.”
- source_word: παρουσίαν
  choice: pagdating
  rationale: Sa kontekstong eskatolohikal, natural na ipinahahayag ng “pagdating” ang hinaharap na pagdating o pagharap ng Panginoon; inilalagay sa talababa ang mas malawak na diwang “presensiya.”
- source_word: οὐ μὴ φθάσωμεν
  choice: ay hinding-hindi mauuna
  rationale: Ang “hinding-hindi” ay naghahatid ng matinding pagtanggi ng οὐ μή, at ang “mauuna” ang angkop na kahulugan ng φθάνω sa paghahambing na ito.
- source_word: τοὺς κοιμηθέντας
  choice: sa mga nakatulog na
  rationale: Pinananatili nito ang metapora ng pagtulog para sa mga namatay sa halip na palitan agad iyon ng tahasang interpretasyon.
- source_word: κύριος / κυρίου
  choice: Panginoon
  rationale: Ito ang karaniwan at marangal na salin ng κύριος; sa talatang ito, tumutukoy ito kay Jesus.
theological_decisions:
- issue: Ang pinagmulan o paraan ng “salita mula sa Panginoon”
  choice: Gumamit ng pananalitang nagpapatunay sa awtoridad ng Panginoon ngunit hindi nagtatakda sa eksaktong paraan ng paghahatid.
  alternative: Maaaring ito ay isang sinabi mismo ni Jesus na naipasa sa iglesya, o isang pahayag na ibinigay kay Pablo sa awtoridad ng Panginoon.
  rationale: Hindi tiyak na nilulutas ng ἐν λόγῳ κυρίου kung alin sa dalawang paraang ito ang tinutukoy, kaya pinananatili ng salin ang tunay na kalabuan.
- issue: Ang kahulugan ng κοιμηθέντας
  choice: Pinanatili ang metapora ng pagtulog para sa mga namatay na mananampalataya.
  alternative: Tahasang isalin bilang “mga namatay.”
  rationale: Mahalaga sa himig at pag-asa ng konteksto ang larawang ginamit ni Pablo; ipinapaliwanag ito sa talababa nang hindi pinapawi sa pangunahing teksto.
- issue: Ang pagsama ni Pablo sa “tayong mga buháy”
  choice: Pinanatili ang unang panauhang maramihan nang hindi ipinapakahulugang tiyak na alam ni Pablo na aabutan niyang buháy ang pagdating.
  alternative: Gawing ikatlong panauhan, gaya ng “ang mga buháy,” upang iwasan ang gayong pahiwatig.
  rationale: Malinaw na gumagamit ang Griyego ng ἡμεῖς, kaya dapat itong panatilihin; hindi naman tahasang sinasabi ng anyo na tiyak ang personal na pananatiling buháy ni Pablo hanggang sa pagdating.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “hinding-hindi” upang natural na maipahayag ang mariing pagtanggi, at pinanatili ang metapora ng pagtulog. Ang tuldik sa “buháy” ay tumutulong na alisin ang posibleng kalituhan sa pagbasa.
