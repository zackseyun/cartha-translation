translation:
  language: tl
  text: upang mamuhay kayo nang maayos sa pakikitungo sa mga tagalabas at hindi mangailangan ng anuman.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “hindi mangailangan ng sinuman.” Maaaring idiin ng parirala ang hindi pag-asa sa ibang tao para sa sariling mga pangangailangan.
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: upang
  rationale: Likas na nagpapahayag sa Filipino ng layunin o inaasahang bunga ng naunang tagubilin.
- source_word: περιπατῆτε
  choice: mamuhay kayo
  rationale: Metaporikal itong tumutukoy sa paraan ng pamumuhay. Mas natural sa modernong Filipino ang “mamuhay” kaysa literal na “lumakad,” habang malinaw na napapanatili ang diwa.
- source_word: εὐσχημόνως
  choice: nang marangal
  rationale: Ipinahihiwatig nito ang kilos na angkop, kagalang-galang, at maayos sa paningin ng iba. Ang “nang marangal” ay natural at hindi nililimitahan ang kahulugan sa simpleng pagsunod sa kaayusan.
- source_word: πρὸς τοὺς ἔξω
  choice: sa harap ng mga taga-labas
  rationale: Pinananatili nito ang panlipunan at pampublikong aspeto ng pamumuhay kaugnay ng mga hindi kabilang sa pamayanang Cristiano, nang hindi nagdaragdag ng mas tiyak na teolohikal na katawagan.
- source_word: μηδενὸς χρείαν ἔχητε
  choice: hindi mangailangan ng anuman
  rationale: Pinakamalapit itong kumakatawan sa karaniwang gramatikal na diwa na huwag magkulang o mangailangan ng anumang bagay. Inilalagay sa talababa ang posibleng diwang huwag umasa sa sinuman.
theological_decisions:
- issue: Kahulugan ng μηδενὸς χρείαν ἔχητε
  choice: “hindi mangailangan ng anuman,” na nagpapahiwatig ng hindi pagkukulang o di-kinakailangang pag-asa sa iba para sa mga pangangailangan
  alternative: “hindi mangailangan ng sinuman”
  rationale: Sa konteksto ng pagtatrabaho sa sariling mga kamay, malamang na may kaugnayan ito sa materyal na kasapatan at pag-iwas sa pagiging pabigat. Gayunman, maaaring tumukoy ang anyo ng parirala sa bagay o tao, kaya pinananatili sa talababa ang alternatibo.
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “mamuhay” para sa metaporikal na “lumakad,” at “mga taga-labas” upang mapanatili ang katawagan ng teksto para sa mga nasa labas ng pamayanang Cristiano nang hindi ito labis na binibigyang-kahulugan.
