  text: Therefore encourage one another with these words[a].
translation:
  language: tl
  text: Kaya palakasin ninyo ang loob ng isa't isa sa pamamagitan ng mga salitang ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “aliwin ninyo ang isa't isa sa pamamagitan ng mga salitang ito.” Ang pandiwa ay maaaring mangahulugang palakasin ang loob, aliwin, o himukin; sa kontekstong ito, lalo nitong ipinahihiwatig ang pagbibigay-katiyakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Kaya
  rationale: Ipinahihiwatig ng ὥστε ang kongklusyon o praktikal na bunga ng naunang turo tungkol sa pagdating ng Panginoon at sa muling pagkabuhay ng mga mananampalataya. Natural at malinaw sa modernong Tagalog ang “Kaya.”
- source_word: παρακαλεῖτε
  choice: palakasin ninyo ang loob
  rationale: Maaaring tumukoy ang παρακαλέω sa pagpapalakas ng loob, pag-aliw, o masidhing paghikayat. Sa konteksto ng katiyakan para sa mga nagdadalamhati, ang “palakasin ang loob” ay likas na parirala at napapanatili ang saklaw ng paghimok at pag-aliw.
- source_word: ἀλλήλους
  choice: ang isa't isa
  rationale: 'Tuwirang ipinapahayag nito ang katumbasan ng utos: dapat gawin ito ng mga mananampalataya para sa bawat isa.'
- source_word: ἐν
  choice: sa pamamagitan ng
  rationale: Dito, ipinakikita ng ἐν ang paraan o kasangkapang ginagamit sa pagpapalakas ng loob. Mas malinaw ito kaysa sa literal ngunit hindi likas na “sa mga salitang ito.”
- source_word: τοῖς λόγοις τούτοις
  choice: mga salitang ito
  rationale: Tumutukoy ito pabalik sa tiyak na pahayag ni Pablo sa mga naunang talata. Pinananatili ng “mga salitang ito” ang kongkretong pagtukoy ng λόγοι.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “palakasin ang loob” bilang natural at malawak na katumbas ng παρακαλεῖτε, habang inilagay sa talababa ang mas tiyak na alternatibong “aliwin.”
