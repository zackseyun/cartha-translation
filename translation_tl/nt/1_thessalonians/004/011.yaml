translation:
  language: tl
  text: at gawin ninyong mithiin na mamuhay nang tahimik[a], asikasuhin ang sarili ninyong mga gawain[b], at magtrabaho gamit ang sarili ninyong mga kamay, gaya ng iniutos namin sa inyo,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “pagsikapan ninyong manahimik.”
