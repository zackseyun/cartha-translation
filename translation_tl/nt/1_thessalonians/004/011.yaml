  - marker: b
    text: Sa literal, “gawin ang sarili ninyong mga bagay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλοτιμεῖσθαι
  choice: gawin ninyong mithiin
  rationale: Ipinahihiwatig ng pandiwa ang pagpapahalaga sa isang bagay bilang marangal na layunin at ang masikap na paghahangad dito. Pinananatili ng salin ang kapansin-pansing diwa ng paggawa sa tahimik na pamumuhay bilang isang mithiin.
- source_word: ἡσυχάζειν
  choice: mamuhay nang tahimik
  rationale: Sa kontekstong ito, hindi lamang pananahimik sa pagsasalita ang tinutukoy kundi isang payapa at maayos na paraan ng pamumuhay.
- source_word: πράσσειν τὰ ἴδια
  choice: asikasuhin ang sarili ninyong mga gawain
  rationale: Idyoma ito para sa pag-aasikaso ng mga bagay na sariling pananagutan. Natural ito sa modernong Tagalog at hindi kasing-talim ng utos na huwag makialam sa iba.
- source_word: ἐργάζεσθαι
  choice: magtrabaho
  rationale: Karaniwan at malawak na salin ito para sa paggawa o pagpapagal.
- source_word: ταῖς χερσὶν ὑμῶν
  choice: sa pamamagitan ng sarili ninyong mga kamay
  rationale: Ipinapakita ang instrumental na gamit ng parirala at pinananatili ang diin sa personal na paggawa gamit ang kanilang sariling mga kamay.
- source_word: καθὼς
  choice: gaya ng
  rationale: Natural na nagpapakilala ng paghahambing sa nauna nang tagubilin ng mga apostol.
- source_word: παρηγγείλαμεν
  choice: iniutos namin
  rationale: Pinananatili nito ang may-awtoridad na lakas ng naunang tagubiling ibinigay ni Pablo at ng kanyang mga kasama.
theological_decisions:
- issue: Lakas ng apostolikong tagubilin
  choice: iniutos namin
  alternative: itinagubilin namin
  rationale: May awtoritatibong puwersa ang παραγγέλλω. Ang “iniutos” ay nagpapanatili sa bigat ng moral na tagubilin nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “gawin ninyong mithiin” upang mapanatili ang retorikal na diin ng Griyego, at ang “mamuhay nang tahimik” upang malinaw na paraan ng pamumuhay, hindi ganap na katahimikan, ang tinutukoy.
