  yaml_path: translation/nt/1_thessalonians/004/007.yaml
  text: For God did not call us for uncleanness[b][a], but in holiness.
translation:
  language: tl
  text: Sapagkat hindi tayo tinawag ng Diyos para sa karumihan[a], kundi sa kabanalan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “moral na karumihan.” Sa kontekstong ito, ang salitang Griyego ay lalo nang maaaring tumukoy sa seksuwal na karumihan.
    reason: lexical_alternative
  - marker: b
    text: O “pagpapabanal.” Maaaring tumukoy ang salitang Griyego sa kabanalan bilang kalagayan o sa proseso ng pagiging banal.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikita ng γάρ na ang pahayag na ito ang batayan ng naunang pangaral; natural at malinaw sa makabagong Tagalog ang “Sapagkat.”
- source_word: ἐκάλεσεν ἡμᾶς ὁ θεὸς
  choice: tinawag tayo ng Diyos
  rationale: Ang aorist indicative ay angkop na isalin sa payak na naganap na anyo. Pinananatili ng “tinawag” ang salita ng teksto nang hindi nilalagyan ng mas makitid na sistemang teolohikal.
- source_word: ἐπὶ ἀκαθαρσίᾳ
  choice: para sa karumihan
  rationale: Sa pariralang ito, ang ἐπί na may dative ay nagpapahiwatig ng layunin o kalagayang nilalayon. Ang “para sa karumihan” ay nagpapanatili sa malawak na diwa ng moral na karumihan, na sa konteksto ay lalo nang kaugnay ng seksuwal na kasalanan.
- source_word: ἐν ἁγιασμῷ
  choice: sa kabanalan
  rationale: Maaaring tumukoy ang ἁγιασμός sa kabanalan bilang kalagayan o sa pagpapabanal bilang proseso. Dahil kasalungat ito ng ἀκαθαρσία, natural ang “sa kabanalan,” habang nililinaw sa talababa ang tunay na alternatibo.
theological_decisions:
- issue: Kahulugan ng pagtawag ng Diyos
  choice: Isang tunay na pagtawag ng Diyos na siyang batayan ng banal na pamumuhay, nang hindi tinutukoy ang mekanismo nito.
  alternative: Isang pangkalahatang paanyaya lamang, o isang teknikal na doktrina ng mabisang pagtawag.
  rationale: Malinaw sa talata na ang pagtawag ng Diyos ang saligan ng etikal na pamumuhay, ngunit hindi nito ipinaliliwanag kung paano gumagana ang pagtawag. Kaya pinanatili ang karaniwang biblikal na salitang “tinawag.”
- issue: Diwa ng ἁγιασμός
  choice: “Kabanalan,” na maaaring magpahiwatig ng kalagayan at pamumuhay na banal.
  alternative: “Pagpapabanal,” na higit na tahasang tumutukoy sa proseso ng pagiging banal.
  rationale: Pinapaboran ng tuwirang pagsalungat sa karumihan ang “kabanalan,” ngunit tunay na nasa saklaw ng salitang Griyego ang proseso ng pagpapabanal at kaya ito ay inilagay sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “karumihan” at “kabanalan” upang mapanatili ang matibay na pagsalungat sa Griyego; ang posibleng diwa ng proseso sa ἁγιασμός ay pinanatili sa talababa.
