  naturalness: Marangal at modernong Tagalog ang draft, ngunit ang kasalukuyang estruktura na may tutuldok at “yamang” ay hindi gaanong likas at lumalabo ang saklaw ng huling layuning sugnay. Ang inayos na ayos ay mas malinaw habang pinananatili ang parentetikong pagkilalang isinasagawa na nila ang turo.
  terminology: Ang “mga kapatid,” “Panginoong Jesus,” “Diyos,” at “magbigay-lugod” ay angkop. Ang “mga kapatid” ay likas na maaaring tumukoy sa buong kapulungan sa Tagalog; ang talababa ay maingat na nililinaw ang anyong Griyego nang hindi nagpapataw ng pagbasa.
