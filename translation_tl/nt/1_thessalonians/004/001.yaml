id: 1TH.4.1
reference: 1 Thessalonians 4:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Λοιπὸν ⸀οὖν, ἀδελφοί, ἐρωτῶμεν ὑμᾶς καὶ παρακαλοῦμεν ἐν κυρίῳ Ἰησοῦ, ⸀ἵνα καθὼς παρελάβετε παρ’ ἡμῶν τὸ πῶς δεῖ ὑμᾶς περιπατεῖν καὶ ἀρέσκειν θεῷ, ⸂καθὼς καὶ περιπατεῖτε⸃, ἵνα περισσεύητε μᾶλλον.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/001.yaml
  text: Finally then[a], brothers, we ask and urge you in the Lord Jesus that, just as you received from us how you ought to walk and to please God, just as you are also walking, you abound more and more.
translation:
  language: tl
  text: Kaya nga, mga kapatid[a], hinihiling namin sa inyo at hinihimok namin kayo sa Panginoong Jesus na lalo pa kayong sumulong sa paraan ng pamumuhay at pagbibigay-lugod sa Diyos na tinanggap ninyo mula sa amin—at ito nga ang ginagawa ninyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay literal na “mga kapatid na lalaki,” ngunit madalas itong gamitin bilang tawag sa buong kapulungan, kabilang ang mga babae.
    reason: Nililinaw ang kasarian sa anyong Griyego at ang malamang na saklaw nito sa konteksto.
lexical_decisions:
- source_word: Λοιπὸν οὖν
  choice: Kaya nga
  rationale: Likas na panandang transisyon at paghinuha sa Tagalog; iniiwasan ang “Sa wakas,” na maaaring magpahiwatig na malapit nang matapos ang sulat kahit may mahaba pang bahagi.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Ang “mga kapatid” ay likas at marangal na tawag sa buong kapulungan sa Tagalog at hindi kailangang tukuyin ang kasarian sa pangunahing teksto.
- source_word: ἐρωτῶμεν ... καὶ παρακαλοῦμεν
  choice: hinihiling at hinihimok namin kayo
  rationale: 'Pinananatili ang dalawang magkaugnay ngunit magkaibang diwa: magalang na pakiusap at mariing paghimok.'
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: sa Panginoong Jesus
  rationale: Pinananatili ang “sa” at ang titulong kristolohikal na “Panginoon”; maaaring saklawin ng parirala ang pakikiisa kay Jesus at ang awtoridad ng panawagan.
- source_word: καθὼς παρελάβετε παρ’ ἡμῶν
  choice: yamang tinanggap ninyo mula sa amin
  rationale: Ang “tinanggap” ay malinaw na tumutukoy sa pagtanggap ng itinurong pamumuhay. Ginamit ang “yamang” upang natural na maiugnay ang batayang turo sa pakiusap nang hindi binabago ang nilalaman.
- source_word: τὸ πῶς δεῖ ὑμᾶς περιπατεῖν
  choice: kung paano kayo dapat mamuhay
  rationale: Sa kontekstong ito, ang περιπατεῖν ay talinghaga para sa asal o paraan ng pamumuhay. Ang “mamuhay” ang likas na katumbas sa modernong Tagalog, samantalang ang “dapat” ay nagpapahayag ng moral na pangangailangan ng δεῖ.
- source_word: καὶ ἀρέσκειν θεῷ
  choice: at magbigay-lugod sa Diyos
  rationale: Likas at tuwirang salin ng layuning maging kalugod-lugod sa Diyos, habang nananatiling kahanay ng “mamuhay.”
- source_word: καθὼς καὶ περιπατεῖτε
  choice: gaya nga ng ginagawa ninyo
  rationale: Kinikilala ang kasalukuyan na nilang pagsunod. Ang “nga” ay naghahatid ng nagpapatibay na puwersa ng καί, at iniiwasan ang alanganing pag-uulit ng “mamuhay.”
- source_word: ἵνα περισσεύητε μᾶλλον
  choice: lalo pa kayong sumulong dito
  rationale: Ipinahahayag ang paglampas sa kasalukuyang antas. Ang “sumulong” ay natural sa Tagalog para sa patuloy na pag-unlad sa paraang itinuro, at ang “dito” ay tumutukoy sa pamumuhay na nagbibigay-lugod sa Diyos.
theological_decisions:
- issue: Saklaw ng ἀδελφοί sa kapulungan
  choice: mga kapatid
  alternative: mga kapatid na lalaki; mga kapatid na lalaki at babae
  rationale: Bagaman panlalaking maramihan ang anyong Griyego, karaniwang ginagamit ito sa buong magkakahalong kapulungan. Ang “mga kapatid” sa Tagalog ay tapat sa ugnayang pampamilya at likas na hindi nagtatakda ng kasarian; nililinaw ito sa talababa.
- issue: Kahulugan ng ἐν κυρίῳ Ἰησοῦ
  choice: sa Panginoong Jesus
  alternative: sa pamamagitan ng Panginoong Jesus; sa awtoridad ng Panginoong Jesus
  rationale: Hindi nililimitahan ng salin ang ἐν sa instrumento lamang o awtoridad lamang; pinananatili nito ang posibleng diwa ng pakikiisa at awtoridad ng Panginoong Jesus.
- issue: Metapora ng περιπατεῖν
  choice: mamuhay
  alternative: lumakad
  rationale: Ang tinutukoy ay asal at kabuuang paraan ng pamumuhay, hindi literal na paglakad. Ang likas na Tagalog ay inuuna nang hindi nagdaragdag ng isang natatanging doktrinal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “kayo” para sa maramihang kausap, “Panginoong Jesus” bilang likas na anyo sa Tagalog, at mga gitling na pahaba upang luminaw ang parentetikong pagkilala na isinasagawa na nila ang itinuro.
