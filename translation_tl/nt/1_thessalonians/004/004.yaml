id: 1TH.4.4
reference: 1 Thessalonians 4:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰδέναι ἕκαστον ὑμῶν τὸ ἑαυτοῦ σκεῦος κτᾶσθαι ἐν ἁγιασμῷ καὶ τιμῇ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/004.yaml
  text: that each of you know how to acquire his own vessel in holiness and honor,
translation:
  language: tl
  text: na malaman ng bawat isa sa inyo kung paano magkaroon ng sariling sisidlan[a] sa kabanalan at karangalan,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sariling katawan”; maaari ring tumukoy sa pagkuha ng sariling asawa. Ang salitang Griyego ay literal na “sariling sisidlan.”
    reason: Ipinababatid ang mahalagang leksikal at interpretatibong kalabuan ng σκεῦος at κτᾶσθαι.
lexical_decisions:
- source_word: εἰδέναι
  choice: malaman ... kung paano
  rationale: Ipinapahayag nito ang praktikal na kaalamang hinihingi ng infinitive sa konteksto.
- source_word: ἕκαστον ὑμῶν
  choice: bawat isa sa inyo
  rationale: Tuwirang pinananatili ang indibiduwal na saklaw ng pahayag.
- source_word: τὸ ἑαυτοῦ σκεῦος
  choice: sariling sisidlan
  rationale: Pinananatili ang metaporang ‘sisidlan’ at ang tunay na kalabuan kung tumutukoy ito sa sariling katawan o sa asawa.
- source_word: κτᾶσθαι
  choice: magkaroon
  rationale: Sinasaklaw ng natural na Tagalog na ito ang diwa ng pagkamit o pagtataglay nang hindi sapilitang nagpapasya sa eksaktong kahulugan ng metaporang kasunod.
- source_word: ἐν ἁγιασμῷ καὶ τιμῇ
  choice: sa kabanalan at karangalan
  rationale: Malapit sa anyo at diwa ng Griyego at angkop sa marangal na modernong rehistro.
theological_decisions:
- issue: Kahulugan ng ‘sisidlan’ (σκεῦος)
  choice: Panatilihin ang metapora sa pangunahing teksto at ipaliwanag ang kalabuan sa talababa.
  alternative: Isalin nang tuwiran bilang ‘katawan’ o ‘asawa.’
  rationale: Kapuwa iminungkahi ang ‘sariling katawan’ at ‘asawa’ bilang kahulugan; hindi tiyak ang reperente sa mismong Griyego, kaya hindi ito dapat tahimik na pagpasyahan ng salin.
- issue: Kahulugan ng κτᾶσθαι
  choice: magkaroon
  alternative: angkinin, kunin, o pamahalaan
  rationale: Ang pandiwa ay maaaring mangahulugang kumuha o magkaroon/taglayin. Ang ‘magkaroon’ ay natural at hindi labis na naglilimita sa interpretasyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at malinaw. Sadyang pinanatili ang di-karaniwang metaporang ‘sisidlan’ sapagkat mahalaga ang kalabuan nito; nililinaw ito sa talababa.
