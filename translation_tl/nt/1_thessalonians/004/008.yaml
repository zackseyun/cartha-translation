  text: Therefore[a], whoever rejects this rejects not man but God[b], who also gives his Holy Spirit to you.
translation:
  language: tl
  text: Kaya nga, ang sinumang tumatanggi[a] ay hindi tao ang tinatanggihan kundi ang Diyos, na nagbibigay rin sa inyo ng kanyang Banal na Espiritu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagwawalang-bahala” o “nagsasantabi.” Ang pandiwang Griyego ay maaaring mangahulugang tumanggi, magwalang-bahala, o magsantabi.
    reason: lexical_alternative
  - marker: b
    text: Literal na “papasok sa inyo.” Ang pang-ukol na Griyego ay maaaring magpahiwatig ng direksiyong “papasok sa,” bagaman mas natural sa Tagalog dito ang “nagbibigay sa inyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιγαροῦν
  choice: Kaya nga
  rationale: Nagpapahayag ito ng kongklusyong ibinabatay sa naunang tagubilin. Likas sa modernong Tagalog ang “Kaya nga” at malinaw nitong naipakikita ang ugnayang lohikal.
- source_word: ὁ ἀθετῶν / ἀθετεῖ
  choice: ang sinumang tumatanggi ... tumatanggi
  rationale: Pangkalahatan ang diwa ng articular participle at hindi ito tumutukoy lamang sa lalaki. Pinananatili ng pag-uulit ng “tumatanggi” ang diin at paghahambing sa tekstong Griyego; maaari ring mangahulugan ang pandiwa ng pagwawalang-bahala o pagsasantabi sa isang may-awtoridad na tagubilin.
- source_word: οὐκ ἄνθρωπον ... ἀλλὰ τὸν θεόν
  choice: hindi sa tao ... kundi sa Diyos
  rationale: Pangkalahatan ang kahulugan ng ἄνθρωπον. Ang “sa tao” ay natural sa balangkas ng pandiwang “tumatanggi” at pinananatili ang maikli at tuwirang pagsalungat sa Diyos.
- source_word: τὸν καὶ διδόντα
  choice: na nagbibigay din
  rationale: Ginawang likas na sugnay na panlarawan sa Tagalog ang participle. Ipinahihiwatig ng pangkasalukuyang anyo ang patuloy o katangiang pagkilos ng Diyos, at sinasalamin ng “din” ang καί.
- source_word: τὸ πνεῦμα αὐτοῦ τὸ ἅγιον
  choice: kanyang Banal na Espiritu
  rationale: Sa kontekstong Paulino, tumutukoy ang parirala sa Banal na Espiritu ng Diyos. Likas at malinaw sa Tagalog ang ayos na ito.
- source_word: εἰς ὑμᾶς
  choice: sa inyo
  rationale: Bagaman karaniwang may diwang “papasok sa” ang εἰς, ang “nagbibigay sa inyo” ang natural na gamit sa Tagalog sa ganitong konteksto. Inilalahad sa talababa ang mas literal na posibilidad.
theological_decisions:
- issue: Tinutukoy ng “kanyang Banal na Espiritu”
  choice: Ang personal na Banal na Espiritu na ibinibigay ng Diyos sa mga mananampalataya
  alternative: Isang banal na espiritu bilang di-personal na kaloob o disposisyon
  rationale: Ang tiyak na pariralang τὸ πνεῦμα αὐτοῦ τὸ ἅγιον sa kontekstong Paulino ay likas na tumutukoy sa Banal na Espiritu. Hindi na dinagdagan ang teksto ng paliwanag na lampas sa pahayag nito.
- issue: Pangkalahatang saklaw ng ὁ ἀθετῶν
  choice: ang sinumang tumatanggi
  alternative: ang tumatanggi; siyang tumatanggi
  rationale: Ang panlalaking isahan sa Griyego ay kumakatawan sa sinuman at hindi limitado sa mga lalaki. Malinaw na pinananatili ng “sinumang” ang pangkalahatang saklaw.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang maikli at madiing paghahambing na “hindi sa tao ... kundi sa Diyos,” gayundin ang pag-uulit ng pandiwang nasa Griyego. Iniwasan ang pananalitang panlalaki lamang at ang pagdaragdag ng denominasyonal na paliwanag.
