  text: 'For this is the will of God: your sanctification—that you abstain from sexual immorality[a][b].'
translation:
  language: tl
  text: 'Sapagkat ito ang kalooban ng Diyos: ang inyong pagpapabanal[a]—na umiwas kayo sa seksuwal na imoralidad[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang inyong kabanalan.”
    reason: lexical_alternative
  - marker: b
    text: 'Griyego: porneia, isang malawak na katawagan para sa imoral na asal na seksuwal. Tradisyonal na isinasalin itong “pakikiapid.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλημα
  choice: kalooban
  rationale: Ang “kalooban” ang likas at karaniwang salin kapag tumutukoy sa ninanais at may-awtoridad na layunin ng Diyos; hindi nito pinahihina ang diwa gaya ng maaaring gawin ng “pagnanais.”
- source_word: ὁ ἁγιασμὸς ὑμῶν
  choice: ang inyong pagpapakabanal
  rationale: Ipinahihiwatig ng ἁγιασμός ang buhay na itinalaga sa Diyos at ang paghubog sa kabanalan. Ang “pagpapakabanal” ay mas madaling maunawaan kaysa sa teknikal na “sanctification” at naiuugnay nang maayos sa kasunod na paliwanag.
- source_word: ἀπέχεσθαι
  choice: na lumayo kayo
  rationale: Ang pawatas ay nagpapaliwanag sa nilalaman ng pagpapakabanal. Ang “na lumayo kayo” ay natural sa modernong Tagalog at nagpapahayag ng patuloy na pag-iwas nang hindi nagdaragdag ng utos na wala sa anyong Griyego.
- source_word: πορνείας
  choice: seksuwal na imoralidad
  rationale: Malawak ang saklaw ng πορνεία at tumutukoy sa ipinagbabawal na asal na seksuwal, hindi lamang sa isang partikular na uri nito. Pinananatili ng salin ang lawak ng termino.
- source_word: γάρ
  choice: Sapagkat
  rationale: Ipinakikita ng γάρ na ang pahayag ay nagbibigay ng batayan o dahilan para sa naunang pagpapayo; malinaw itong naihahatid ng “Sapagkat.”
theological_decisions:
- issue: Kahulugan ng ἁγιασμός sa konteksto ng etikal na pagpapayo
  choice: Isinalin bilang “pagpapakabanal,” na ang kongkretong etikal na nilalaman ay ipinaliliwanag ng kasunod na sugnay.
  alternative: “kabanalan” upang idiin ang kalagayan o katangian ng pagiging banal
  rationale: Hindi nililimitahan ng salin ang salita sa isang minsanang katayuan o sa isang proseso lamang. Pinananatili nito ang kaugnayan ng pagtatalaga sa Diyos at ng banal na pamumuhay.
- issue: Saklaw ng πορνεία
  choice: Malawak na isinalin bilang “seksuwal na imoralidad.”
  alternative: “pakikiapid”
  rationale: Maaaring maunawaan ang “pakikiapid” bilang mas makitid na uri ng gawaing seksuwal. Hindi dapat paliitin ng salin ang mas malawak na saklaw ng salitang Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “seksuwal” bilang kasalukuyang karaniwang baybay at pinanatili ang maikli at mariing ayos ng pangungusap sa Griyego.
