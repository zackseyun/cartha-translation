  text: Οὐ θέλομεν δὲ ὑμᾶς ἀγνοεῖν, ἀδελφοί, περὶ τῶν ⸀κοιμωμένων, ἵνα μὴ λυπῆσθε καθὼς καὶ οἱ λοιποὶ οἱ μὴ ἔχοντες ἐλπίδα.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/013.yaml
  text: But we do not want you to be uninformed[a], brothers, about those who have fallen asleep, so that you may not grieve as the rest do[b], who have no hope.
translation:
  language: tl
  text: Ngunit hindi namin nais, mga kapatid[b], na wala kayong kaalaman tungkol sa mga natutulog[a], upang hindi kayo magdalamhati gaya ng iba na walang pag-asa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “natutulog” ay metapora rito para sa mga mananampalatayang namatay.
    reason: lexical_alternative
  - marker: b
    text: Panlalaking maramihan ang salitang Griyego, ngunit pantawag ito rito sa kongregasyon at malamang na kabilang ang mga lalaki at babae.
    reason: cultural_note
lexical_decisions:
- source_word: Οὐ θέλομεν δὲ ὑμᾶς ἀγνοεῖν
  choice: Ngunit hindi namin nais na hindi ninyo malaman
  rationale: Pinananatili ang banayad na paglipat ng δέ at ang negatibong anyo ng θέλομεν ... ἀγνοεῖν, nang hindi gumagamit ng salitang maaaring magtunog-mapanghamak gaya ng “mangmang.”
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Ito ang natural at kinaugaliang pantawag sa isang kongregasyon sa Tagalog. Bagaman panlalaking maramihan ang anyong Griyego, maaaring saklaw ng gamit nito rito ang mga lalaki at babae.
- source_word: περὶ τῶν κοιμωμένων
  choice: ang tungkol sa mga natutulog
  rationale: Pinananatili ang metapora ng pagtulog para sa mga namatay sa halip na tuwirang palitan ito ng “mga namatay,” kaya nananatili ang kaugnayan nito sa pag-asang muling pagkabuhay.
- source_word: ἵνα μὴ λυπῆσθε
  choice: upang hindi kayo magdalamhati
  rationale: Ang “upang” ay nagpapahayag ng layunin, at ang “magdalamhati” ay angkop sa pagdadalamhati dahil sa kamatayan nang hindi ipinahihiwatig na ipinagbabawal ang lahat ng kalungkutan.
- source_word: καθὼς καὶ οἱ λοιποὶ
  choice: gaya ng iba
  rationale: Natural na inihahayag sa Tagalog ang paghahambing sa mga taong nasa labas ng tinutukoy na pangkat ng mga mananampalataya.
- source_word: οἱ μὴ ἔχοντες ἐλπίδα
  choice: na walang pag-asa
  rationale: Tuwiran at malinaw nitong pinananatili ang pagkakaiba batay sa pagkakaroon o kawalan ng pag-asa.
theological_decisions:
- issue: Kahulugan ng κοιμωμένων sa konteksto ng muling pagkabuhay
  choice: Panatilihin ang metaporang “mga natutulog.”
  alternative: mga namatay
  rationale: Ang pagtulog ay sadyang larawang ginamit ni Pablo para sa mga namatay; ang pagpapanatili rito ay hindi agad nag-aalis sa eskatolohikal na himig ng talata.
- issue: Saklaw ng ἀδελφοί
  choice: Isalin bilang “mga kapatid,” na may talababa tungkol sa anyo at saklaw ng salitang Griyego.
  alternative: mga kapatid na lalaki; mga kapatid na lalaki at babae
  rationale: Ang “mga kapatid” ang natural na katumbas sa Tagalog at hindi artipisyal na nagtatakda ng kasarian; nililinaw ng talababa na panlalaki ang anyong Griyego ngunit malamang na buong kongregasyon ang kinakausap.
- issue: Saklaw ng pagbabawal sa pagdadalamhati
  choice: “upang hindi kayo magdalamhati gaya ng iba”
  alternative: upang hindi kayo kailanman malungkot
  rationale: Iniuugnay ng pangungusap ang ipinagbabawal na uri ng pagdadalamhati sa pagdadalamhati ng mga walang pag-asa, sa halip na tahasang ipagbawal ang lahat ng kalungkutan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang metapora ng pagtulog at ang negatibong pormulasyon ng unang sugnay, habang ginamit ang likas na pantawag na “mga kapatid.”
