- from: Sapagkat ginagawa nga ninyo ito sa lahat ng mga kapatid sa buong Macedonia. Ngunit hinihimok namin kayo, mga kapatid,[a] na lalo pang sumagana rito.
  to: Sapagkat ginagawa nga ninyo ito para sa lahat ng mga kapatid na nasa buong Macedonia. Ngunit hinihimok namin kayo, mga kapatid,[a] na lalo pa kayong mag-ibayo.
  rationale: Pinalitan ang “sumagana rito” ng “lalo pa kayong mag-ibayo” upang maiwasan ang di-sinasadyang kahulugang materyal na kasaganaan at mapanatili ang paghihimok na lalo pang umunlad sa naunang binanggit na pag-ibig pangkapatiran. Inayos din ang pariralang pangheograpiya upang malinaw na ang mga kapatid, hindi ang kilos lamang, ang nasa buong Macedonia. Pinanatili ang footnote anchor at ang nilalaman nito.
