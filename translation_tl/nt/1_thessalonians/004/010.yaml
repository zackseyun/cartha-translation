  text: καὶ γὰρ ποιεῖτε αὐτὸ εἰς πάντας τοὺς ἀδελφοὺς τοὺς ἐν ὅλῃ τῇ Μακεδονίᾳ. παρακαλοῦμεν δὲ ὑμᾶς, ἀδελφοί, περισσεύειν μᾶλλον,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/010.yaml
  text: For indeed you are doing this toward all the brothers throughout all Macedonia. But we urge you[a], brothers, to abound still more,
translation:
  language: tl
  text: Sapagkat ginagawa nga ninyo ito para sa lahat ng mga kapatid na nasa buong Macedonia. Ngunit hinihimok namin kayo, mga kapatid,[a] na lalo pa kayong mag-ibayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga kapatid” dito ay tumutukoy sa mga kapwa mananampalataya at malamang na kabilang ang mga babae at lalaki sa mga iglesya.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Sapagkat ... nga
  rationale: Pinagsasama nito ang paliwanag na bisa ng γάρ at ang pagbibigay-diin ng καί sa natural na Tagalog.
- source_word: ποιεῖτε αὐτὸ
  choice: ginagawa ninyo ito
  rationale: Ipinahihiwatig ng pangkasalukuyang pandiwa ang nagpapatuloy nilang gawain, at ang “ito” ay tumutukoy pabalik sa pag-ibig sa kapwa mananampalataya.
- source_word: εἰς πάντας τοὺς ἀδελφοὺς
  choice: sa lahat ng mga kapatid
  rationale: Natural na ipinapahayag sa Tagalog ang direksiyon at mga tumatanggap ng kanilang pag-ibig; ang “mga kapatid” ay karaniwang katawagang pangkomunidad na maaaring sumaklaw sa babae at lalaki.
- source_word: τοὺς ἐν ὅλῃ τῇ Μακεδονίᾳ
  choice: sa buong Macedonia
  rationale: Pinananatili ang lawak na heograpiko ng ὅλῃ habang gumagamit ng payak at kasalukuyang Tagalog.
- source_word: παρακαλοῦμεν δὲ ὑμᾶς
  choice: Ngunit hinihimok namin kayo
  rationale: Ang παρακαλέω ay may diwang taimtim na paghimok dito, at ang “ngunit” ay kumakatawan sa banayad na paglipat ng δέ mula sa papuri tungo sa karagdagang hamon.
- source_word: περισσεύειν μᾶλλον
  choice: na lalo pang sumagana rito
  rationale: Ang “sumagana” ay nagpapanatili sa larawan ng pagdami o pag-apaw, samantalang ang “lalo pa” ay naghahatid ng paghahambing sa μᾶλλον. Idinagdag ang “rito” upang maging malinaw sa natural na Tagalog na ang tinutukoy ay ang naunang gawain ng pag-ibig.
theological_decisions:
- issue: Saklaw ng ἀδελφοί/ἀδελφούς sa isang kongregasyong may babae at lalaki
  choice: mga kapatid
  alternative: mga kapatid na lalaki at babae / mga kapwa mananampalataya
  rationale: Ang “mga kapatid” sa modernong Tagalog ay natural na maaaring tumukoy sa magkakapatid o kapwa mananampalataya anuman ang kasarian. Pinananatili nito ang talinghagang pampamilya ng Griyego nang hindi nililimitahan ang saklaw sa mga lalaki.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “hinihimok” para sa taimtim na pakiusap at “sumagana” upang mapanatili ang larawan ng περισσεύω. Ang marker na [a] ay inilagay pagkatapos ng ikalawang “mga kapatid,” kung saan tahasang kinakausap ni Pablo ang buong kapulungan.
