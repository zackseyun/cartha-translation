  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰ γὰρ πιστεύομεν ὅτι Ἰησοῦς ἀπέθανεν καὶ ἀνέστη, οὕτως καὶ ὁ θεὸς τοὺς κοιμηθέντας διὰ τοῦ Ἰησοῦ ἄξει σὺν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/014.yaml
  text: For if we believe that Jesus died and rose again[b][a], so also God will bring with him those who have fallen asleep through Jesus.
translation:
  language: tl
  text: Sapagkat kung naniniwala tayong namatay si Jesus at muling nabuhay, gayon din, dadalhin ng Diyos, kasama ni Jesus, ang mga nakatulog[a] sa pamamagitan ni Jesus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang mga namatay.” Ginagamit dito ni Pablo ang “nakatulog” bilang metapora para sa pagkamatay ng mga mananampalataya.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring unawain ang parirala bilang tumutukoy sa mga namatay na may kaugnayan kay Jesus, o bilang “dahil kay Jesus.” Ang “sa pamamagitan ni Jesus” (διὰ τοῦ Ἰησοῦ) ay maaaring magpahayag ng pamamagitan o malapit na kaugnayan kay Jesus; pinagtatalunan din kung pangunahing nakakabit ito sa “mga nakatulog” o sa pagkilos ng Diyos sa pagdadala sa kanila.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ γὰρ πιστεύομεν
  choice: Sapagkat kung naniniwala tayo
  rationale: Pinananatili ng “sapagkat” ang paliwanag na ugnayan ng γάρ sa naunang pahayag, habang ang “kung” ay tumutugma sa εἰ. Ang “naniniwala tayo” ay angkop sa sama-samang pagpapahayag ng pananampalataya rito.
- source_word: Ἰησοῦς ἀπέθανεν καὶ ἀνέστη
  choice: namatay si Jesus at muling nabuhay
  rationale: 'Tuwirang inilalarawan ang dalawang pangyayaring ipinahahayag: ang pagkamatay at muling pagkabuhay ni Jesus. Ang aktibong “muling nabuhay” ay nagpapanatili sa anyong intransitibo ng ἀνέστη.'
- source_word: οὕτως καὶ
  choice: gayon din
  rationale: Pinananatili ang pagtutulad at pag-uugnay sa pagkamatay at muling pagkabuhay ni Jesus nang hindi tinutukoy nang higit sa Griyego kung paano eksaktong magaganap ang kilos ng Diyos.
- source_word: ὁ θεὸς ... ἄξει σὺν αὐτῷ
  choice: dadalhin ng Diyos kasama niya
  rationale: Ang “dadalhin” ay natural na katumbas ng ἄξει, at ang “kasama niya” ay nagpapanatili sa ideya ng pagsama sa σὺν αὐτῷ. Ang panghalip ay likas na tumutukoy kay Jesus sa konteksto.
- source_word: τοὺς κοιμηθέντας
  choice: ang mga natulog na
  rationale: Pinananatili ang metapora ni Pablo na pagtulog para sa kamatayan sa halip na palitan agad ito ng “mga namatay.” Nililinaw ng talababa ang kahulugan sa konteksto.
- source_word: διὰ τοῦ Ἰησοῦ
  choice: sa pamamagitan ni Jesus
  rationale: Karaniwang ipinahahayag ng διά na may genitive ang paraan o tagapamagitan. Pinananatili ng salin ang posibilidad na ito, habang inilalahad sa talababa ang tunay na kalabuan ng pagkakaugnay at diwa ng parirala.
theological_decisions:
- issue: Ang metapora ng pagtulog sa κοιμηθέντας
  choice: Panatilihin sa pangunahing teksto ang “mga natulog na.”
  alternative: “mga namatay na”
  rationale: Mahalaga sa pangangaral at pag-asa ng talata ang larawan ng pagtulog, ngunit tunay pa ring kamatayan ang tinutukoy. Hindi dapat alisin ng salin ang metaporang ginamit ni Pablo.
- issue: Ang kahulugan at pagkakaugnay ng διὰ τοῦ Ἰησοῦ
  choice: Isalin bilang “sa pamamagitan ni Jesus” at panatilihin ang ibang posibilidad sa talababa.
  alternative: “kay Jesus,” “dahil kay Jesus,” o pag-uugnay nito sa pagkilos ng Diyos sa pagdadala
  rationale: Maaaring ipahayag ng parirala ang pamamagitan, sanhi, o malapit na kaugnayan kay Jesus, at pinagtatalunan din kung sa “mga natulog” o sa “dadalhin” ito pangunahing nakakabit. Hindi tahasang nilulutas ng pangunahing salin ang lahat ng sintaktikong posibilidad.
translation_notes:
  register: Modernong Filipino na may marangal ngunit madaling maunawaang himig. Ginamit ang likas na “naniniwala tayong” bilang pinaikling anyo sa pangungusap, pinanatili ang biblikal na metapora ng pagtulog, at iniwasan ang arkaikong “nangatutulog.”
