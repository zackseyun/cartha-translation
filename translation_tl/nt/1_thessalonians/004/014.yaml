  rationale: Inayos ang ayos ng pangungusap upang maging malinaw na si Jesus ang kasama ng mga dadalhin, at pinalitan ang di-likas na "natulog kay Jesus" sa talababa ng paglalarawang hindi nagpapataw ng isang interpretasyon sa pinagtatalunang pariralang διὰ τοῦ Ἰησοῦ. Napanatili ang metapora ng pagtulog at ang pangunahing pagbasa na “sa pamamagitan ni Jesus.”
