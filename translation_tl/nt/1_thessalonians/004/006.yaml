    rationale: Ang περὶ πάντων τούτων ay ‘hinggil sa/laban sa may kinalaman sa lahat ng ito.’ Nililinaw ng “tagapaghiganti hinggil sa lahat ng ito” ang saklaw ng panghukom na pahayag.
