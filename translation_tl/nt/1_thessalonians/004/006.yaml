  naturalness: Makabago at marangal ang pangkalahatang rehistro. Inaayos ang dalawang parirala upang maging mas natural ang daloy at maiwasan ang posibleng maling pagbasa na ang Panginoon ay tagapaghiganti “sa” mga bagay mismo, sa halip na tagapaghiganti hinggil sa mga ito.
  terminology: Ang “Panginoon,” “kapatid,” “magsamantala,” at “tagapaghiganti” ay angkop at pinananatili. Ang talababa ay maingat na inilalahad ang malamang na seksuwal na konteksto nang hindi ito ipinapasok bilang tahasang pakahulugan sa pangunahing teksto.
