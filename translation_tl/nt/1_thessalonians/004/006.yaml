reference: 1 Thessalonians 4:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τὸ μὴ ὑπερβαίνειν καὶ πλεονεκτεῖν ἐν τῷ πράγματι τὸν ἀδελφὸν αὐτοῦ, διότι ἔκδικος ⸀κύριος περὶ πάντων τούτων, καθὼς καὶ προείπαμεν ὑμῖν καὶ διεμαρτυράμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/006.yaml
  text: that no one should overstep and exploit his brother in this matter[a], because the Lord is an avenger concerning all these things[b], just as we also told you beforehand and solemnly warned you.
translation:
  language: tl
  text: Huwag lumampas sa nararapat at magsamantala ang sinuman sa kanyang kapatid[b] sa bagay na ito[a], sapagkat ang Panginoon ang tagapaghiganti hinggil sa lahat ng ito, gaya ng sinabi na namin sa inyo noon at mariin kayong binalaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “dayain ang kanyang kapatid sa usaping ito.” Maaaring mangahulugan ang Griyego ng pagsasamantala sa isang tao, at inuunawa ito ng ilan sa mas makitid na diwang pandaraya. Gayunman, dahil sa konteksto ng mga talata 3–5, malamang na mga seksuwal na paglabag ang tinutukoy.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Griyego ay panlalaki at isahan. Malamang na tumutukoy ito sa isang kapatid sa pananampalataya, bagaman maaaring mas malawak ang saklaw ng babalang etikal sa loob ng pamayanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ μὴ ὑπερβαίνειν
  choice: Huwag lumampas ang sinuman sa hangganan
  rationale: Ipinagpapatuloy ng mga pawatas na may artikulo ang nilalaman ng tagubilin sa naunang talata. Pinananatili ng “lumampas sa hangganan” ang larawan ng pagtawid sa isang moral na hangganan, habang ginagawang malinaw ng “ang sinuman” ang pangkalahatang saklaw.
- source_word: πλεονεκτεῖν
  choice: magsamantala
  rationale: Ipinahihiwatig ng pandiwa ang pagkuha ng di-nararapat na pakinabang kapalit ng kapinsalaan ng iba. Hindi ito nililimitahan ng “magsamantala” sa pandarayang pinansiyal at angkop din ito sa malamang na seksuwal na konteksto.
- source_word: ἐν τῷ πράγματι
  choice: sa bagay na ito
  rationale: Tiyak ang tinutukoy ayon sa konteksto ngunit nananatiling pangkalahatan ang mismong salitang Griyego. Inuugnay ng salin ang parirala sa usapin sa mga talata 3–5 nang hindi tahasang nagdaragdag ng wala sa teksto.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: sa kanyang kapatid
  rationale: Ang “kapatid” ay likas na salin sa Tagalog at maaari ring tumukoy sa kapatid sa pananampalataya. Hindi minarkahan ng pangngalang Tagalog ang kasariang panlalaki na nasa anyong Griyego, kaya ipinaliliwanag iyon sa talababa.
- source_word: ἔκδικος κύριος
  choice: ang Panginoon ang tagapaghiganti
  rationale: Pinananatili ng “tagapaghiganti” ang matinding puwersang panghukuman ng ἔκδικος—ang Panginoon ang nagpapatupad ng katarungan laban sa gumagawa ng mali—sa halip na pahinain ito bilang pangkalahatang pagpaparusa lamang.
- source_word: περὶ πάντων τούτων
  choice: sa lahat ng ito
  rationale: Pinananatili nitong malawak ang saklaw ng parirala at iniuugnay ito sa mga maling gawa na kasalukuyang tinatalakay.
- source_word: προείπαμεν
  choice: sinabi na namin sa inyo noon
  rationale: Malinaw at natural nitong ipinahahayag na nauna nang sinabi ng mga apostol ang babala, nang hindi inuulit ang diin ng kasunod na pandiwa.
- source_word: διεμαρτυράμεθα
  choice: mariin kayong binalaan
  rationale: Ipinahahayag nito ang taimtim at mariing puwersa ng pandiwa sa konteksto ng moral na tagubilin.
theological_decisions:
- issue: Ang tinutukoy ng “bagay na ito” at ang uri ng pagsasamantala
  choice: Pinanatili ang pangkalahatang pariralang “sa bagay na ito,” habang ipinapaliwanag sa talababa na malamang na seksuwal na maling gawain ang tinutukoy.
  alternative: Unawain ito bilang pandaraya sa negosyo o pangkalahatang pagsasamantala sa kapwa.
  rationale: Malakas na itinuturo ng agarang konteksto ng mga talata 3–5 ang seksuwal na kabanalan, ngunit hindi tahasang pinapangalanan ng πρᾶγμα ang usapin at maaari ring gamitin ang πλεονεκτεῖν sa mas pangkalahatang pandaraya. Kaya hindi isinara ng pangunahing teksto ang tunay na saklaw ng mga salita.
- issue: Saklaw ng ἀδελφός
  choice: Isinalin bilang “kapatid,” na likas sa Tagalog at maaaring tumukoy sa kapatid sa pananampalataya; nilinaw sa talababa ang panlalaking isahan ng Griyego.
  alternative: “lalaking kapatid” o “kapatid na lalaki”; “kapwa mananampalataya”
  rationale: Ang “lalaking kapatid” ay maaaring maling magpahiwatig ng kapatid sa dugo at hindi natural sa kontekstong ito, samantalang ang “kapwa mananampalataya” ay nagtatakda nang higit sa mismong leksikal na anyo. Pinakamainam na panatilihin ang “kapatid” at ilahad ang detalye sa talababa.
- issue: Puwersang panghukuman ng ἔκδικος κύριος
  choice: “ang Panginoon ang tagapaghiganti”
  alternative: “ang Panginoon ang nagpaparusa” o “ang Panginoon ang nagpapatupad ng katarungan”
  rationale: Pinananatili ng napiling anyo ang tensiyon at tindi ng pahayag na ang Panginoon mismo ang gaganti sa maling ginawa. Ang ideya ay makatarungang pagganti, hindi bugso ng personal na paghihiganti.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “magsamantala” bilang karaniwang salitang may sapat na bigat; pinanatili ang “tagapaghiganti” upang huwag pahinain ang matinding wikang panghukuman ng orihinal. Inilagay ang [b] kaagad sa “kapatid” at ang [a] sa “bagay na ito” upang malinaw ang kaugnayan ng bawat talababa.
