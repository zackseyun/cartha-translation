  yaml_path: translation/nt/1_thessalonians/004/002.yaml
  text: For you know what instructions we gave you through the Lord Jesus[a].
translation:
  language: tl
  text: Sapagkat alam ninyo kung anong mga tagubilin ang ibinigay namin sa inyo sa pamamagitan ng Panginoong Jesus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “sa ilalim ng awtoridad ng Panginoong Jesus.”
    reason: alternative_reading
lexical_decisions:
- source_word: οἴδατε
  choice: alam ninyo
  rationale: Ang οἶδα ay nasa anyong perfect ngunit karaniwang may pangkasalukuyang diwa sa Koine; likas itong ipahayag na “alam ninyo” sa Tagalog.
- source_word: γὰρ
  choice: sapagkat
  rationale: Ipinakikita ng γάρ na ang pangungusap ay nagbibigay ng paliwanag o batayan sa naunang sinabi; pinananatili ng “sapagkat” ang ugnayang ito.
- source_word: τίνας
  choice: kung anong mga
  rationale: Tumutukoy ito sa mga tagubiling alam ng mga mambabasa. Ang “kung anong mga” ay malinaw at pinananatili ang pangmaramihang diwa ng parirala.
- source_word: παραγγελίας
  choice: mga tagubilin
  rationale: Maaaring tumukoy ang παραγγελία sa may-awtoridad na tagubilin o utos. Ang “mga tagubilin” ay natural sa makabagong Tagalog at hindi labis na nagpapakitid sa saklaw ng salita.
- source_word: ἐδώκαμεν
  choice: ibinigay namin
  rationale: Tuwirang ipinahahayag nito ang aorist ng δίδωμι at likas itong katambal ng “mga tagubilin.”
- source_word: ὑμῖν
  choice: sa inyo
  rationale: Malinaw nitong ipinahahayag ang di-tuwirang layon ng pandiwa.
- source_word: διὰ τοῦ κυρίου Ἰησοῦ
  choice: sa pamamagitan ng Panginoong Jesus
  rationale: Ang διά na may genitive ay maaaring magpahayag ng paraan o tagapamagitan. Pinananatili ng saling ito ang anyo at posibleng lawak ng kahulugan ng Griyego.
- source_word: κυρίου
  choice: Panginoon
  rationale: Ang “Panginoon” ang karaniwan at marangal na salin ng κύριος sa kontekstong ito.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Ginagamit ang karaniwang anyo ng personal na pangalan sa Tagalog.
theological_decisions:
- issue: Diwa ng διὰ τοῦ κυρίου Ἰησοῦ
  choice: sa pamamagitan ng Panginoong Jesus
  alternative: sa awtoridad ng Panginoong Jesus
  rationale: Maaaring idiin ng parirala ang pamamagitan o ang awtoridad ni Jesus. Pinananatili ng pangunahing teksto ang mas tuwirang anyo ng Griyego, habang inilalagay sa talababa ang makatuwirang diwa ng awtoridad upang hindi tahimik na lutasin ang posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mga tagubilin” upang maipahayag ang may-awtoridad na diwa nang hindi nagiging labis na matigas, at pinanatili ang “sa pamamagitan ng” upang huwag paliitin ang kahulugan ng διά.
