  naturalness: Mas natural ang “napalakas ang loob namin dahil sa inyo” para sa ἐφ’ ὑμῖν sa kontekstong ito. Ang kasunod na “sa pamamagitan ng inyong pananampalataya” ang malinaw na nagtutukoy sa paraan o batayan ng pagpapalakas-loob.
