revisions:
- from: Dahil dito, mga kapatid[b], sa gitna ng lahat ng aming kagipitan at paghihirap, napalakas ang loob namin tungkol sa inyo sa pamamagitan ng inyong pananampalataya[a].
  to: Dahil dito, mga kapatid[b], sa gitna ng lahat ng aming kagipitan at paghihirap, napalakas ang loob namin dahil sa inyo, sa pamamagitan ng inyong pananampalataya[a].
  rationale: Inayos ang pariralang tumutukoy sa mga taga-Tesalonica upang maging idiomatiko sa Filipino. Pinanatili ang “sa pamamagitan ng inyong pananampalataya” upang tahasang maipahayag ang instrumental na διά na may genitive, at hindi binago ang kahulugan o mga talababa.
