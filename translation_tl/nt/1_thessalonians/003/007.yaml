  text: διὰ τοῦτο παρεκλήθημεν, ἀδελφοί, ἐφ’ ὑμῖν ἐπὶ πάσῃ τῇ ⸂ἀνάγκῃ καὶ θλίψει⸃ ἡμῶν διὰ τῆς ὑμῶν πίστεως,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/007.yaml
  text: For this reason[a], brothers, concerning you, in all our distress and affliction[b], we were comforted through your faith.
translation:
  language: tl
  text: Dahil dito, mga kapatid[b], sa gitna ng lahat ng aming kagipitan at paghihirap, napalakas ang loob namin dahil sa inyo, sa pamamagitan ng inyong pananampalataya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “katapatan” o “matatag na pananatili sa pananampalataya.” Ang salitang Griego na pistis ay maaaring mangahulugang pananampalataya, pagtitiwala, o katapatan; dito, malamang na kasama ang diwa ng pananatiling matatag ng mga taga-Tesalonica sa kanilang pananampalataya.
    reason: alternative_reading
  - marker: b
    text: Karaniwang tawag ni Pablo sa kongregasyon ang “mga kapatid” at maaari nitong saklawin ang buong sambayanan ng mga mananampalataya, kapwa lalaki at babae.
    reason: cultural_note
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Dahil dito
  rationale: Likas na panandang sanhi at pagbubuod ito sa Filipino, at malinaw nitong iniuugnay ang talata sa naunang balita ni Timoteo.
- source_word: παρεκλήθημεν
  choice: napalakas ang loob namin
  rationale: Sa konteksto, tumutukoy ang pasibong pandiwa sa kaaliwan at panibagong lakas ng loob na natanggap nina Pablo dahil sa mabuting balita; mas natural ito kaysa sa literal na “inaliw kami.”
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Ang “mga kapatid” ang karaniwan at marangal na tawag sa Filipino para sa kongregasyon; hindi nito kailangang tukuyin lamang ang mga lalaking mananampalataya.
- source_word: ἐφ’ ὑμῖν
  choice: tungkol sa inyo
  rationale: Pinananatili nito ang diwang ang kalagayan ng mga taga-Tesalonica ang paksa ng kanilang kapanatagan, nang hindi ipinahihiwatig na sila ang sanhi ng kagipitan.
- source_word: ἐπὶ πάσῃ τῇ ἀνάγκῃ καὶ θλίψει ἡμῶν
  choice: sa gitna ng lahat ng aming kagipitan at paghihirap
  rationale: Inilalarawan nito ang mga kalagayang kinaroroonan nila nang mapalakas ang kanilang loob, habang pinananatili ang dalawang magkaugnay ngunit magkahiwalay na katawagan sa pagdurusa.
- source_word: ἀνάγκῃ
  choice: kagipitan
  rationale: Ipinahahayag nito ang matinding pagkakapos o mapuwersang kalagayan nang hindi nalilimitahan sa simpleng “pangangailangan.”
- source_word: θλίψει
  choice: paghihirap
  rationale: Natural at mabigat na salitang Filipino ito para sa pagdurusa o kapighatiang dulot ng matinding pagsubok.
- source_word: διὰ τῆς ὑμῶν πίστεως
  choice: sa pamamagitan ng inyong pananampalataya
  rationale: 'Ipinakikita ng “sa pamamagitan ng” ang instrumental na gamit ng διά na may genitive: ang pananampalataya nila ang naging paraan upang mapalakas ang loob ng mga apostol.'
- source_word: πίστεως
  choice: pananampalataya
  rationale: Ito ang karaniwang salin ng πίστις at pinananatili ang pagtitiwala/paniniwala bilang pangunahing diwa; inilalagay sa talababa ang posibleng diin sa katapatan o pananatiling matatag.
theological_decisions:
- issue: Ang kahulugan ng πίστις kapag maaaring nakatuon din sa pananatiling matatag
  choice: pananampalataya
  alternative: katapatan o matatag na pananatili sa pananampalataya
  rationale: Ang pangunahing kahulugan dito ay ang patuloy na pananampalataya ng mga taga-Tesalonica, ngunit kalakip nito ang kanilang katatagan. Hindi nilulutas nang sapilitan ang posibleng saklaw ng salita; itinatala ang alternatibong diwa sa talababa.
- issue: Kung sino ang saklaw ng προσφωνητικό na ἀδελφοί
  choice: mga kapatid
  alternative: mga kapatid na lalaki at babae
  rationale: Ang anyong Griego ay panlalaking maramihan, ngunit karaniwang ginagamit ni Pablo bilang tawag sa buong kapulungan. Ang likas na “mga kapatid” sa Filipino ay maaaring sumaklaw sa lahat, at nililinaw ito sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “napalakas ang loob” bilang likas na pagpapahayag ng pagtanggap ng kaaliwan at pampatibay, at pinanatiling hiwalay ang “kagipitan” at “paghihirap.” Inilagay ang mga pananda ng talababa sa mismong mga salitang tinutukoy upang maiwasan ang kalituhan.
