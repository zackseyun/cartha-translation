  text: καὶ γὰρ ὅτε πρὸς ὑμᾶς ἦμεν, προελέγομεν ὑμῖν ὅτι μέλλομεν θλίβεσθαι, καθὼς καὶ ἐγένετο καὶ οἴδατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/004.yaml
  text: For even when we were with you[a], we kept telling you beforehand that we were going to suffer affliction, just as it also happened, and you know it.
translation:
  language: tl
  text: Sapagkat kahit noong kasama pa ninyo kami, paulit-ulit naming sinabi sa inyo noon pa na daranas kami ng paghihirap[a], gaya nga ng nangyari, at alam ninyo ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “daranas kami ng panggigipit,” “uusigin kami,” o “mapapaharap kami sa kapighatian.” Ang pandiwang Griyego ay maaaring tumukoy sa pagdanas ng panggigipit, kagipitan, o pag-uusig.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Sapagkat
  rationale: Ipinapakita nito ang paliwanag na kaugnayan sa naunang pahayag; hindi na kailangang piliting isalin nang hiwalay ang καί dahil likas nang nadarama ang diin sa Filipino.
- source_word: ὅτε πρὸς ὑμᾶς ἦμεν
  choice: noong kasama pa ninyo kami
  rationale: Likas at malinaw na katumbas ng pananatili nina Pablo sa piling ng mga taga-Tesalonica.
- source_word: προελέγομεν ὑμῖν
  choice: paulit-ulit naming sinabi sa inyo nang una
  rationale: Ang imperfect na προελέγομεν ay maaaring magpahiwatig ng paulit-ulit o nagpapatuloy na pagsasabi, at ang πρό- ay pinananatili sa “nang una.”
- source_word: ὅτι μέλλομεν θλίβεσθαι
  choice: na daranas kami ng paghihirap
  rationale: Ipinahahayag ng μέλλομεν ang inaasahang mangyayari, samantalang pinananatili ng “paghihirap” ang malawak na saklaw ng θλίβεσθαι nang hindi ito nililimitahan sa isang uri ng pag-uusig.
- source_word: καθὼς καὶ ἐγένετο
  choice: At iyon nga ang nangyari
  rationale: Natural na Filipino itong nagpapahayag na natupad ang naunang sinabi; ang “nga” ay naghahatid ng pagpapatibay na dala ng καί.
- source_word: καὶ οἴδατε
  choice: gaya ng alam ninyo
  rationale: Malinaw at likas na ipinauugnay nito ang kaalaman ng mga mambabasa sa pangyayaring kababanggit lamang.
theological_decisions:
- issue: Saklaw ng θλίβεσθαι
  choice: pangkalahatang paghihirap na maaaring kabilang ang panggigipit o pag-uusig
  alternative: tahasang pag-uusig o teknikal na eskatolohikal na kapighatian
  rationale: Hindi tinutukoy ng pandiwa rito ang iisang uri lamang ng pagdurusa. Pinananatili ng “paghihirap” ang lawak at tensiyon ng salitang Griyego.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “paulit-ulit” upang katawanin ang aspektong imperfect, at iniwasan ang “tribulasyon,” na maaaring magbigay ng mas teknikal o eskatolohikal na pakahulugan kaysa sa hinihingi ng konteksto.
