translation:
  language: tl
  text: Sapagkat ngayon ay nabubuhay kami[a], kung nananatili kayong matatag sa Panginoon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “nabubuhay kami” ay malamang na retorikal na pahayag ng panibagong sigla at lakas ng loob, hindi lamang ng pisikal na pananatiling buhay.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Sapagkat
  rationale: Ipinahahayag nito ang sanhi o paliwanag ng kaaliwang binanggit sa naunang konteksto. Likas sa Tagalog ang “sapagkat” at hindi nito pinapawi ang ugnayang nagpapaliwanag.
- source_word: νῦν
  choice: ngayon
  rationale: Tuwirang pinananatili ang temporal na diin sa kasalukuyang sigla ni Pablo at ng kanyang mga kasama.
- source_word: ζῶμεν
  choice: nabubuhayan kami
  rationale: Sa konteksto, ang literal na “nabubuhay kami” ay isang retorikal na pahayag ng panibagong sigla. Mas natural sa modernong Tagalog ang “nabubuhayan kami,” habang nililinaw ng talababa ang mas literal na anyo.
- source_word: ἐὰν
  choice: kung
  rationale: Pinananatili nito ang kondisyonal na anyo ng Griyego nang hindi ito ginagawang mas tiyak na “basta” o “yamang.”
- source_word: ὑμεῖς
  choice: kayo
  rationale: Ang tahasang panghalip ay pinananatili sa “kayong,” kaya nananatiling nakatuon ang pangungusap sa mga taga-Tesalonica.
- source_word: στήκετε
  choice: nananatili kayong matatag
  rationale: Ipinahahayag nito ang patuloy na katatagan o paninindigan na saklaw ng στήκω. Natural ito sa Tagalog at hindi tunog utos ang kasalukuyang pasalaysay na anyo.
- source_word: ἐν κυρίῳ
  choice: sa Panginoon
  rationale: Pinananatili ang malawak at pamilyar na ekspresyong Paulino tungkol sa saklaw o kaugnayan ng kanilang katatagan, nang hindi ito nililimitahan sa isang tiyak na doktrina.
theological_decisions:
- issue: Diwa ng “ngayon ay nabubuhay kami”
  choice: Retorikal na pahayag ng muling pagsigla o pag-asa dahil sa katatagan ng mga taga-Tesalonica
  alternative: Literal na pahayag na nakasalalay sa kanila ang pisikal na buhay ni Pablo at ng kanyang mga kasama
  rationale: Bagaman literal na “nabubuhay kami” ang Griyego, pastoral at retorikal ang puwersa nito sa konteksto. Pinananatili ng salin ang matinding pahayag sa natural na Tagalog, at itinatala sa talababa ang literal na anyo.
- issue: Kahulugan ng “sa Panginoon”
  choice: Katatagan sa loob ng kanilang kaugnayan sa Panginoon
  alternative: “Kaisa ng Panginoon” o “tapat sa Panginoon”
  rationale: Mayaman at malawak ang pariralang ἐν κυρίῳ. Ang “sa Panginoon” ay hindi nagsasara sa posibleng diwa nito o nag-aangkat ng natatanging doktrinang denominasyonal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “nabubuhayan” bilang natural na idyomatikong katumbas ng retorikal na ζῶμεν; iniwasan ang mas pormal ngunit hindi gaanong natural na “nakatayo kayong matatag.”
