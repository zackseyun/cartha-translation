reference: 1 Thessalonians 3:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐπέμψαμεν Τιμόθεον, τὸν ἀδελφὸν ἡμῶν καὶ ⸀συνεργὸν τοῦ ⸀θεοῦ ἐν τῷ εὐαγγελίῳ τοῦ Χριστοῦ, εἰς τὸ στηρίξαι ὑμᾶς καὶ παρακαλέσαι ⸀ὑπὲρ τῆς πίστεως ὑμῶν
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/002.yaml
  text: and we sent Timothy[a], our brother and God's fellow worker in the gospel of the Messiah, to strengthen you and to encourage you concerning your faith[b],
translation:
  language: tl
  text: at isinugo namin si Timoteo, ang aming kapatid at kamanggagawa ng Diyos[a] sa Magandang Balita ng Mesiyas[b], upang patatagin kayo at palakasin ang inyong loob tungkol sa inyong pananampalataya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kamanggagawang kasama ng Diyos.” Naiiba ang pananalita ng ilang manuskrito; kabilang sa mga pagbasa ang “lingkod ng Diyos.”
    reason: alternative_reading
  - marker: b
    text: Griyego, “Cristo”; isinalin ditong “Mesiyas” sapagkat kapansin-pansin ang gamit nito bilang titulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέμψαμεν
  choice: isinugo namin
  rationale: Ang aorist na ἐπέμψαμεν ay payak na pangnagdaang salaysay. Likas at marangal sa Filipino ang “isinugo namin,” at ang ayos nito ay malinaw na si Timoteo ang ipinadala.
- source_word: Τιμόθεον
  choice: Timoteo
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalan.
- source_word: ἀδελφὸν ἡμῶν
  choice: ang aming kapatid
  rationale: Pinananatili nito ang pampamilyang talinghaga ng Griyego at ang lapit ng ugnayan ng mga mananampalataya nang hindi ito pinalalawak bilang “kapatid sa pananampalataya.”
- source_word: συνεργὸν τοῦ θεοῦ
  choice: kamanggagawa ng Diyos
  rationale: 'Malapit ito sa anyo ng Griyego at pinananatili ang matapang at bahagyang bukás na ugnayang ipinahihiwatig ng genitive: si Timoteo ay kamanggagawang may kaugnayan sa Diyos. Hindi ito pinahina bilang “lingkod” sa pangunahing teksto.'
- source_word: ἐν τῷ εὐαγγελίῳ τοῦ Χριστοῦ
  choice: sa gawain ng Magandang Balita ng Mesiyas
  rationale: Ipinahihiwatig ng ἐν ang larangan ng paggawa ni Timoteo. Nililinaw ng “sa gawain” ang likas na diwa sa Filipino nang hindi tahasang nilulutas kung ang genitive na “ng Mesiyas” ay tumutukoy sa pinagmulan o nilalaman ng Magandang Balita.
- source_word: Χριστοῦ
  choice: Mesiyas
  rationale: Dito ay kapansin-pansin ang gamit bilang titulo; ang “Mesiyas” ang tuwirang katumbas. Nasa talababa ang tradisyonal na “Cristo.”
- source_word: εἰς τὸ στηρίξαι
  choice: upang patatagin
  rationale: Ang εἰς na may articular infinitive ay nagsasaad ng layunin. Ang “patatagin” ay natural at angkop sa pagpapatibay sa mga mananampalataya.
- source_word: παρακαλέσαι
  choice: palakasin ang inyong loob
  rationale: Sa kontekstong may pagsubok, ipinahahayag nito ang mapagtaguyod na diwa ng παρακαλέω—pagpapalakas-loob—nang hindi ito nililimitahan sa pag-aliw lamang o sa mahigpit na pangaral.
- source_word: ὑπὲρ τῆς πίστεως ὑμῶν
  choice: tungkol sa inyong pananampalataya
  rationale: Maaaring mangahulugan ang ὑπέρ na “tungkol sa” o “alang-alang sa.” Ang “tungkol sa” ay angkop sa layon ng pagpapalakas-loob at hindi labis na nagpapakahulugan.
- source_word: πίστεως
  choice: pananampalataya
  rationale: Ito ang karaniwang katumbas ng πίστις sa kontekstong tumutukoy sa pananalig ng mga taga-Tesalonica.
theological_decisions:
- issue: Paglilipat ng συνεργὸν τοῦ θεοῦ
  choice: kamanggagawa ng Diyos
  alternative: kamanggagawang kasama ng Diyos; lingkod ng Diyos
  rationale: Sinusunod ng pangunahing teksto ang SBLGNT at hindi pinahihina ang ένταση ng pahayag dahil lamang sa teolohikal na pag-aatubili. Binabanggit sa talababa ang ibang posibleng pag-unawa at ang mahahalagang naiibang pagbasa ng mga manuskrito.
- issue: Paglilipat ng Χριστοῦ sa εὐαγγελίῳ τοῦ Χριστοῦ
  choice: Mesiyas
  alternative: Cristo
  rationale: Gumaganap dito ang Χριστός bilang titulo. Pinananatili sa talababa ang tradisyonal na katawagang “Cristo” para sa mga mambabasang pamilyar dito.
- issue: Ugnayan ng genitive sa εὐαγγελίῳ τοῦ Χριστοῦ
  choice: Magandang Balita ng Mesiyas
  alternative: Magandang Balita tungkol sa Mesiyas; Magandang Balita mula sa Mesiyas
  rationale: Hindi tahasang nilulutas ng salin kung ang Mesiyas ang nilalaman o pinagmulan ng Magandang Balita; pinananatili nito ang tunay na lawak ng pariralang Griyego.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Ang “palakasin ang inyong loob” ay mas natural kaysa sa literal na “hikayatin” sa kontekstong pastoral. Isinama ang “sa gawain” upang maging malinaw at likas ang ugnayan ng kamanggagawa at ng Magandang Balita, habang nananatiling bukás ang genitive na “ng Mesiyas.”
