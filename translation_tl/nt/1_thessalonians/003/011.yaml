  rationale: Ibinalik ng rebisyon ang “aming daan” bilang hayag na layon ng pandiwa, na tumutugma sa τὴν ὁδὸν ἡμῶν. Pinananatili nito ang optative na kahilingan sa “Nawa’y,” ang diin ng αὐτός sa “mismo,” ang dalawang magkaugnay na simuno, at ang direksiyong “patungo sa inyo.” Ang tala [a] ay nilinaw upang ilarawan ang tampok na isahang pandiwang Griyego nang hindi inaangking minamarkahan ng Filipino ang bilang sa parehong paraan.
