  text: Αὐτὸς δὲ ὁ θεὸς καὶ πατὴρ ἡμῶν καὶ ὁ κύριος ἡμῶν ⸀Ἰησοῦς κατευθύναι τὴν ὁδὸν ἡμῶν πρὸς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/011.yaml
  text: May our God and Father himself[a], and our Lord Jesus[b], direct our way to you.
translation:
  language: tl
  text: Nawa’y ituwid ng ating Diyos at Ama mismo[a], at ng ating Panginoong Jesus, ang aming daan patungo sa inyo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, iisang pandiwang nasa isahang anyo ang ginagamit kasama ng magkaugnay na mga simunong “ating Diyos at Ama” at “ating Panginoong Jesus.”
    reason: cross_reference
  - marker: b
    text: O “Patnubayan nawa kami sa aming paglalakbay patungo sa inyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς
  choice: mismo
  rationale: Masinsing gamit ito ng αὐτός na nagbibigay-diin na ang Diyos at Ama mismo ang kikilos; natural itong inilalagay kasunod ng pariralang tinutukoy sa Filipino.
- source_word: δὲ
  choice: hindi tahasang isinalin
  rationale: Mahina at panlipat na pang-ugnay ang δέ rito. Hindi kailangan ang tahasang “ngayon” o “ngunit” sa Filipino, sapagkat maaari iyong magdagdag ng temporal o panalungat na diing wala sa konteksto.
- source_word: ὁ θεὸς καὶ πατὴρ ἡμῶν
  choice: ating Diyos at Ama
  rationale: Pinananatili nito ang dalawang titulo para sa iisang tinutukoy at ang panghalip na “ating.”
- source_word: ὁ κύριος ἡμῶν Ἰησοῦς
  choice: ating Panginoong Jesus
  rationale: Natural na anyong Filipino ito para sa τίτulong κύριος at pinananatili ang “ating” at ang pangalang Jesus.
- source_word: κατευθύναι
  choice: Patnubayan nawa ... upang makarating
  rationale: Ang aorist optative ay panalangin o paghiling. Sa Filipino, likas na ipinahahayag ng “nawa” ang himig na ito; ipinahihiwatig ng “patnubayan ... upang makarating” kapuwa ang paggabay at pagbubukas o pagtutuwid ng daan.
- source_word: τὴν ὁδὸν ἡμῶν
  choice: tayo ... upang makarating kami
  rationale: Ang literal na “aming daan” ay posibleng maging malabo o di-likas sa Filipino sa ganitong panalangin. Ang hulma ay malinaw na nagpapanatili sa diwa ng paglalakbay ng pangkat ni Pablo, habang ang “tayo” sa unang sugnay ay bunga ng iisang pandiwang Griyego na may dalawang simuno.
- source_word: πρὸς ὑμᾶς
  choice: sa inyo
  rationale: Ipinahahayag nito ang patutunguhan ng paglalakbay patungo sa mga taga-Tesalonica.
theological_decisions:
- issue: Isahang pandiwa para sa magkaugnay na mga simunong “ating Diyos at Ama” at “ating Panginoong Jesus”
  choice: Pinanatiling hayag ang Ama at si Jesus bilang kapuwa simuno ng iisang kahilingang “Patnubayan nawa.”
  alternative: Baguhin ang pangungusap upang magmukhang sa Diyos lamang pangunahing tumutukoy ang pandiwa, o gumamit ng magkahiwalay na pandiwa.
  rationale: Kapansin-pansin sa Griyego ang isahang optative na κατευθύναι kasama ng dalawang magkaugnay na simuno. Dapat mapanatili ang gramatikal at teolohikal na tensiyong ito nang hindi dinaragdagan ng paliwanag ang mismong talata.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “nawa” bilang likas na anyo ng panalangin o paghiling. Iniwasan ang panimulang “Ngayon” dahil hindi temporal ang δέ rito. Ang footnote [b] ang nagpapanatili sa mas literal na talinghaga ng pagtutuwid ng daan.
