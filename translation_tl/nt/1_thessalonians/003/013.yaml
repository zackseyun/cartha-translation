id: 1TH.3.13
reference: 1 Thessalonians 3:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰς τὸ στηρίξαι ὑμῶν τὰς καρδίας ἀμέμπτους ἐν ἁγιωσύνῃ ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν ἐν τῇ παρουσίᾳ τοῦ κυρίου ἡμῶν ⸀Ἰησοῦ μετὰ πάντων τῶν ἁγίων ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/013.yaml
  text: so that he may establish your hearts blameless in holiness before our God and Father at the coming of our Lord Jesus with all his holy ones[a].
translation:
  language: tl
  text: upang patatagin niya ang inyong mga puso na walang kapintasan sa kabanalan sa harap ng ating Diyos at Ama sa pagdating ng ating Panginoong Jesus, kasama ang lahat ng kanyang mga banal[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kasama ang lahat ng kanyang mga banal na tao.” Sa kontekstong ito, ang salitang Griyego para sa “mga banal” ay maaaring tumukoy sa mga banal na tao, sa mga anghel, o sa kapwa pangkat.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τὸ στηρίξαι
  choice: upang patatagin niya
  rationale: Ang εἰς na may articular infinitive ay nagpapahayag ng layunin o kinalabasan mula sa naunang talata. Likas sa Tagalog ang sugnay na may “upang,” at pinananatili nito ang puwersang purposibo.
- source_word: στηρίξαι
  choice: patatagin
  rationale: Ipinahihiwatig ng pandiwa ang pagpapalakas at pagpapanatiling matatag; ang “patatagin” ay natural sa pariralang “mga puso.”
- source_word: καρδίας
  choice: mga puso
  rationale: Pinananatili nito ang karaniwang metaporang biblikal para sa panloob na pagkatao, hindi lamang sa damdamin.
- source_word: ἀμέμπτους
  choice: walang kapintasan
  rationale: Malinaw at natural itong nagpapahayag ng kalagayang hindi mapupulaan o masisisi nang may batayan.
- source_word: ἐν ἁγιωσύνῃ
  choice: sa kabanalan
  rationale: Ang ἁγιωσύνη ay tumutukoy sa katangian o kalagayan ng pagiging banal; tuwiran at dignified ang “sa kabanalan.”
- source_word: ἔμπροσθεν
  choice: sa harap ng
  rationale: Ipinahahayag nito ang pagtayo sa paningin o presensya ng Diyos at karaniwang gamit sa Tagalog.
- source_word: τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: ating Diyos at Ama
  rationale: Pinananatili ang koordinadong katawagang “Diyos at Ama” at likas ang ayos sa Tagalog.
- source_word: παρουσίᾳ
  choice: pagdating
  rationale: Sa kontekstong eskatolohikal, ang παρουσία ay tumutukoy sa pagdating o pagparito ng Panginoon; “pagdating” ang malinaw at karaniwang katumbas.
- source_word: κυρίου ἡμῶν Ἰησοῦ
  choice: ating Panginoong Jesus
  rationale: Pinananatili ang kristolohikal na titulong κύριος bilang “Panginoon” at ang pangalan sa karaniwang anyong Filipino.
- source_word: μετὰ πάντων τῶν ἁγίων αὐτοῦ
  choice: kasama ang lahat ng kanyang mga banal
  rationale: Ang substantibong ἅγιοι ay maaaring tumukoy sa mga banal na tao, mga anghel, o kapwa pangkat. Hindi nililimitahan ng “mga banal” ang tinutukoy sa kontekstong ito.
theological_decisions:
- issue: Kung sino ang tinutukoy ng πάντων τῶν ἁγίων αὐτοῦ
  choice: lahat ng kanyang mga banal
  alternative: lahat ng kanyang mga banal na tao; lahat ng kanyang mga anghel
  rationale: Hindi tahasang nililinaw ng Griyego kung ang tinutukoy ay mga banal na tao, mga anghel, o pareho. Pinananatili ng salin at talababa ang tunay na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang biblikal na metaporang “mga puso” at iniwasang lutasin ang kalabuan tungkol sa pagkakakilanlan ng “mga banal.”
