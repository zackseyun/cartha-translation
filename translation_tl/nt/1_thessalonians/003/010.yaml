translation:
  language: tl
  text: Gabi’t araw, nang buong taimtim kaming nananalangin upang makita kayo nang harapan at punan ang mga kakulangan sa inyong pananampalataya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring, “punan ang nawawala sa inyong pananampalataya.” Maaaring mas malawak ang diwa ng Griyego: tugunan ang mga kakulangan o higit pang palakasin at ganapin ang inyong pananampalataya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νυκτὸς καὶ ἡμέρας
  choice: Gabi at araw
  rationale: Ang mga genitibong ginagamit bilang pang-abay ay nagpapahiwatig ng patuloy o paulit-ulit na gawain. Likas sa Filipino ang “gabi at araw” at napapanatili nito ang diin ng orihinal.
- source_word: ὑπερεκπερισσοῦ
  choice: taimtim na taimtim
  rationale: Ang pambihirang pang-abay na ito ay may napakalakas na intensibong diwa. Ang pag-uulit ay natural na paraang Filipino upang ipahayag ang sukdulang kataimtiman nang hindi nagiging mabigat o teknikal.
- source_word: δεόμενοι
  choice: nananalangin
  rationale: Tumutukoy ang participle sa taimtim na paghiling. Ang “nananalangin,” kasama ng intensibong panuring, ay malinaw at angkop sa kasalukuyang konteksto.
- source_word: εἰς τὸ ἰδεῖν
  choice: na makita
  rationale: Ang εἰς kasama ng articular infinitive ay nagpapahayag ng layunin. Ang “na makita” ay natural na kasunod ng “nananalangin” sa Filipino.
- source_word: ὑμῶν τὸ πρόσωπον
  choice: kayo nang harapan
  rationale: Literal itong “ang inyong mukha,” ngunit idyoma ito para sa personal na pagkikita. Inihahatid ng “kayo nang harapan” ang kongkreto at relasyonal na diwa sa natural na Filipino.
- source_word: καταρτίσαι
  choice: mapunan
  rationale: Maaaring mangahulugan ang pandiwa na ayusin, ibalik sa wastong kalagayan, ihanda, o gawing ganap. Kasama ng τὰ ὑστερήματα, natural ang “mapunan,” habang hindi nito labis na nililimitahan kung paano palalakasin o kukumpletuhin ang pananampalataya.
- source_word: τὰ ὑστερήματα
  choice: ang anumang kulang
  rationale: Ang pangngalang maramihan ay tumutukoy sa mga kakulangan. Ang kolektibong “anumang kulang” ay malinaw at natural, at hindi nagpapahiwatig na ganap na wala silang pananampalataya.
- source_word: τῆς πίστεως ὑμῶν
  choice: sa inyong pananampalataya
  rationale: Sa kontekstong ito, ang πίστις ay tumutukoy sa kanilang pananampalataya o pagtitiwala na kailangan pang mapatatag. Ang “pananampalataya” ang karaniwan at teolohikong hindi makitid na salin.
theological_decisions:
- issue: Pagpapakahulugan sa πίστις
  choice: pananampalataya
  alternative: pagtitiwala; katapatan
  rationale: Pinakamalamang na tumutukoy rito ang πίστις sa paniniwala at pagtitiwala ng mga taga-Tesalonica na kailangan pang patatagin, hindi pangunahin sa kanilang katapatan bilang asal. Gayunman, hindi lubusang hiwalay ang mga diwang ito.
- issue: Saklaw ng καταρτίσαι τὰ ὑστερήματα
  choice: mapunan ang anumang kulang
  alternative: maituwid o mapalakas ang kailangan pang ganapin
  rationale: 'Pinananatili ng salin ang larawan ng kakulangan nang hindi ipinahihiwatig na walang tunay na pananampalataya ang mga mambabasa. Maaaring mas malawak ang Griyego: pag-aayos, pagpapatatag, o pagdadala tungo sa higit na kaganapan.'
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kayo nang harapan” sa halip na literal na “ang inyong mukha” upang maging likas ang idyoma, at “taimtim na taimtim” upang maipahayag ang matinding diin ng ὑπερεκπερισσοῦ.
