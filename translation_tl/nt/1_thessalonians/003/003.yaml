base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/003.yaml
  text: so that no one would be shaken by these afflictions[c][b][a]. For you yourselves know that we are appointed for this.
translation:
  language: tl
  text: upang walang sinumang matinag[a] dahil sa mga paghihirap na ito.[b] Sapagkat alam na alam ninyo na itinakda tayo para rito.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “magambala” o “mawala sa katatagan.” Sa ibang konteksto, ang bihirang pandiwa ay maaari ring mangahulugang “malinlang” o “mahikayat sa pamamagitan ng pambobola.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga kapighatian” o “mga kagipitan.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “nakatalaga tayo para rito” o “ito ang nakalaan sa atin.”
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ μηδένα σαίνεσθαι
  choice: upang walang sinumang matinag
  rationale: Ang articular infinitive ay nagpapahayag ng layunin o bunga kaugnay ng naunang talata. Ang bihirang pandiwang σαίνεσθαι ay pinakamalamang na tumutukoy dito sa pagkagambala o pagkawala ng katatagan; natural at maikli sa Filipino ang “matinag.”
- source_word: ἐν ταῖς θλίψεσιν ταύταις
  choice: dahil sa mga paghihirap na ito
  rationale: Ang θλῖψις ay tumutukoy sa matitinding hirap, kagipitan, o pagdurusa. Bagaman karaniwang “sa” ang ἐν, ang “dahil sa” ay likas na nagpapahayag dito ng kalagayan o sanhi ng pagkatinag.
- source_word: αὐτοὶ γὰρ οἴδατε
  choice: Sapagkat alam na alam ninyo
  rationale: Ipinakikita ng αὐτοὶ ang diin sa mga mambabasa mismo. Ang “alam na alam ninyo” ay natural na paraan sa Filipino upang mapanatili ang diin, habang ang “sapagkat” ay nagpapahayag ng paliwanag na hatid ng γάρ.
- source_word: εἰς τοῦτο κείμεθα
  choice: itinakda tayo para rito
  rationale: Sa idyomang ito, ang κεῖμαι ay hindi lamang literal na “nakahimlay” kundi “nakatalaga” o “nakatakda.” Ang “itinakda” ay nagpapanatili sa pasibong diwa nang hindi tahasang tinutukoy kung sino ang gumawa, at ang “para rito” ay tumutukoy sa mga paghihirap na kababanggit.
theological_decisions:
- issue: Ang kaugnayan ng mga mananampalataya sa paghihirap sa εἰς τοῦτο κείμεθα
  choice: itinakda tayo para rito
  alternative: nakatalaga tayo para rito; ito ang nakalaan sa atin
  rationale: Ipinahahayag ng teksto na ang paghihirap ay bahagi ng nakatakdang kalagayan ng mga mananampalataya, ngunit hindi nito nililinaw rito ang isang mas detalyadong doktrina ng predestinasyon. Pinananatili ng “itinakda” ang bigat at pasibong anyo ng pahayag nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “matinag” para sa pastoral na diwa ng pagkawala ng katatagan, “mga paghihirap” bilang karaniwang salitang may sapat na bigat, at “alam na alam ninyo” upang likas na maipahayag ang diin ng αὐτοὶ.
