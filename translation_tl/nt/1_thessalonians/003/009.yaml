  text: τίνα γὰρ εὐχαριστίαν δυνάμεθα τῷ θεῷ ἀνταποδοῦναι περὶ ὑμῶν ἐπὶ πάσῃ τῇ χαρᾷ ᾗ χαίρομεν δι’ ὑμᾶς ἔμπροσθεν τοῦ θεοῦ ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/009.yaml
  text: For what thanksgiving can we repay to God concerning you[a], for all the joy with which we rejoice because of you before our God,
translation:
  language: tl
  text: Sapagkat anong pasasalamat ang maibabalik namin sa Diyos tungkol sa inyo[a], dahil sa lahat ng kagalakang ikinagagalak namin dahil sa inyo sa harap ng ating Diyos?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, sa mas karaniwang pananalita, “Paano kami makapagpapasalamat nang sapat sa Diyos dahil sa inyo?” Mas literal sa Griyego: “Anong pasasalamat ang maibabalik namin sa Diyos tungkol sa inyo?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνα … εὐχαριστίαν
  choice: anong pasasalamat
  rationale: Pinananatili ang tuwirang retorikal na tanong at ang anyong pangngalan ng εὐχαριστίαν, habang natural pa rin sa makabagong Tagalog.
- source_word: δυνάμεθα … ἀνταποδοῦναι
  choice: ang maibabalik namin
  rationale: Ipinahahayag ng “maibabalik” ang diwa ng pagbibigay bilang tugon o ganti, ngunit hindi kasing-transaksiyonal ng “maibabayad.” Ang tanong ay nagpapakita na hindi sapat ang anumang pasasalamat nila.
- source_word: περὶ ὑμῶν
  choice: dahil sa inyo
  rationale: Bagaman literal na tumutukoy ito sa “patungkol sa inyo,” sa kontekstong ito ang natural na Tagalog na “dahil sa inyo” ay malinaw na nagsasaad ng dahilan ng pasasalamat. Ang pag-uulit nito sa δι’ ὑμᾶς ay sumasalamin sa pag-uulit ng sanggunian sa mga taga-Tesalonica.
- source_word: ἐπὶ πάσῃ τῇ χαρᾷ
  choice: kapalit ng lahat ng kagalakan
  rationale: Iniuugnay ang buong kagalakan sa pasasalamat na ibinabalik sa Diyos. Ang “kapalit” ay nagpapanatili sa balangkas ng tugon na nasa ἀνταποδοῦναι, hindi literal na bayaran.
- source_word: ᾗ χαίρομεν
  choice: kagalakang ikinagagalak namin
  rationale: Pinananatili ang sinadyang pag-uugnay ng magkaugnay na salitang χαρά at χαίρω sa pamamagitan ng “kagalakan” at “ikinagagalak.”
- source_word: δι’ ὑμᾶς
  choice: dahil sa inyo
  rationale: Malinaw at natural na pagpapahayag ng sanhi na ipinahihiwatig ng διά na may accusative.
- source_word: ἔμπροσθεν τοῦ θεοῦ ἡμῶν
  choice: sa harap ng ating Diyos
  rationale: Tapat sa larawang pangkalagayan ng Griyego at likas na paraan sa Tagalog upang tukuyin ang presensiya ng Diyos.
theological_decisions:
- issue: Ang pasasalamat bilang bagay na “ibinabalik” sa Diyos
  choice: Pinanatili ang metapora sa “anong pasasalamat ang maibabalik namin sa Diyos.”
  alternative: “Paano kami makapagpapasalamat nang sapat sa Diyos dahil sa inyo?”
  rationale: Tahasan sa ἀνταποδοῦναι ang diwa ng pagbibigay bilang tugon. Hindi nito ipinahihiwatig na may literal na utang na maaaring bayaran sa Diyos; ipinakikita ng retorikal na tanong na hindi matutumbasan ng kanilang pasasalamat ang kagalakang natanggap nila.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Pinanatili ang retorikal na tanong, ang metapora ng pagbabalik ng pasasalamat, at ang pag-uulit ng “kagalakan/ikinagagalak.” Ginamit ang “ating Diyos” bilang likas na inklusibong katumbas ng τοῦ θεοῦ ἡμῶν.
