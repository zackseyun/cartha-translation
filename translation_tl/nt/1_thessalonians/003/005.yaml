  to: Dahil dito, nang hindi ko na matiis, nagsugo ako upang malaman ang tungkol sa inyong pananampalataya[a], baka tinukso kayo ng manunukso at mawalan ng saysay ang aming pagpapagal[b].
  rationale: Pinalitan ang “natukso kayo” ng “tinukso kayo” upang hindi maipahiwatig na tiyak na nagpadala sila sa tukso. Ginawang iisa ang “baka” upang natural na saklawin nito ang dalawang sugnay, at inilipat ang angkla ng talababa b sa mismong pariralang may alternatibong salin. Walang idinagdag na pagkakakilanlan sa manunukso o ibang teolohikal na interpretasyon.
