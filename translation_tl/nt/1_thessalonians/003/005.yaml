  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: διὰ τοῦτο κἀγὼ μηκέτι στέγων ἔπεμψα εἰς τὸ γνῶναι τὴν πίστιν ὑμῶν, μή πως ἐπείρασεν ὑμᾶς ὁ πειράζων καὶ εἰς κενὸν γένηται ὁ κόπος ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/005.yaml
  text: For this reason[a], when I could bear it no longer, I sent to learn about your faith[b], lest somehow the tempter had tempted you and our labor might be in vain.
translation:
  language: tl
  text: Dahil dito, nang hindi ko na matiis, nagsugo ako upang malaman ang tungkol sa inyong pananampalataya[a], baka tinukso kayo ng manunukso at mawalan ng saysay ang aming pagpapagal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “katapatan” o “pagtitiwala.” Maaaring magtaglay ang salitang Griyego ng magkakaugnay na mga diwang ito ayon sa konteksto.
    reason: alternative_reading
  - marker: b
    text: O “mauwi sa wala” o “masayang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Dahil dito
  rationale: Likas na panandang sanhi na malinaw na tumutukoy pabalik sa naunang paliwanag ni Pablo.
- source_word: κἀγὼ
  choice: ako
  rationale: Naipahihiwatig na sa anyong unang panauhan ng mga pandiwa ang ἐγώ; hindi kailangang piliting ilantad ang καί kung magiging mabigat sa Filipino.
- source_word: μηκέτι στέγων
  choice: nang hindi ko na matiis
  rationale: Natural na Filipino para sa pag-abot sa hangganan ng pagtitiis.
- source_word: ἔπεμψα
  choice: nagsugo ako
  rationale: Pinananatiling di-tiyak ang layon gaya ng Griyego sa talatang ito; si Timoteo ay nakikilala mula sa konteksto ngunit hindi idinaragdag sa teksto.
- source_word: εἰς τὸ γνῶναι
  choice: upang malaman ang tungkol sa
  rationale: Ipinahahayag ang layunin at ang diwang pagsisiyasat sa natural na Filipino.
- source_word: τὴν πίστιν ὑμῶν
  choice: inyong pananampalataya
  rationale: Karaniwan at angkop na salin ng πίστις sa kontekstong tumutukoy sa patuloy nilang pagtugon sa ebanghelyo; nasa talababa ang iba pang posibleng diin.
- source_word: μή πως
  choice: baka
  rationale: Maikli at natural na pagpapahayag ng pangamba o kinatatakutang posibilidad.
- source_word: ἐπείρασεν ὑμᾶς ὁ πειράζων
  choice: natukso kayo ng manunukso
  rationale: Pinananatili ang magkaugnay na ugat at ang diwa ng pag-akit palayo sa pananampalataya, hindi lamang isang neutral na pagsubok.
- source_word: ὁ πειράζων
  choice: ang manunukso
  rationale: Isinasalin ang substantibong participle bilang mapaglarawang katawagan nang hindi tahasang ipinapalit ang pangalang Satanas.
- source_word: εἰς κενὸν γένηται
  choice: mawalan ng saysay
  rationale: Natural na idyomang Filipino para sa pagiging walang bunga o walang kabuluhan habang napapanatili ang prospective na diwa ng subjunctive.
- source_word: ὁ κόπος ἡμῶν
  choice: ang aming pagpapagal
  rationale: Ipinahihiwatig ang mabigat at masikap na paggawa na taglay ng κόπος.
theological_decisions:
- issue: Saklaw ng kahulugan ng πίστις
  choice: pananampalataya
  alternative: katapatan; pagtitiwala
  rationale: Sa konteksto, pinakamalamang na tinutukoy ang patuloy na pananampalataya ng mga taga-Tesalonica, ngunit hindi isinasara ang magkakaugnay na diwa ng pagtitiwala at katapatan.
- issue: Pagkakakilanlan ng ὁ πειράζων
  choice: manunukso
  alternative: ang tumutukso; Satanas
  rationale: Pinananatili ang mapaglarawang katawagan ng Griyego. Bagaman malinaw na sataniko ang konteksto, hindi tahasang ginagamit rito ang pangalang Satanas.
- issue: Ugnayan ng dalawang kinatatakutang bunga sa μή πως
  choice: inuulit ang “baka” bago ang ikalawang sugnay
  alternative: isang “baka” lamang na sumasaklaw sa dalawang sugnay
  rationale: Nililinaw sa Filipino na kapwa saklaw ng pangamba ang posibleng pagtukso at ang pagkawalang-saysay ng pagpapagal, nang hindi binabago ang lohika ng Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nagsugo” sa halip na idagdag si Timoteo, sapagkat walang tahasang layon ang pandiwa sa mismong talata. Ang “pagpapagal” ay mas mabigat kaysa karaniwang “gawain” at angkop sa κόπος.
