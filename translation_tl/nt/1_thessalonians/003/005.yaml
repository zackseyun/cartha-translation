  naturalness: Malinaw at marangal ang daloy. Mas natural na isang “baka” ang sumaklaw sa magkaugnay na mga sugnay, gaya ng isang μή πως sa Griyego. Inililipat ang talababa b upang malinaw itong nakakabit sa “mawalan ng saysay,” na siyang pariralang tinutukoy nito.
  terminology: Ang “pananampalataya,” “manunukso,” at “pagpapagal” ay angkop na modernong Filipino para sa πίστις, ὁ πειράζων, at κόπος. Pinananatili ang mapaglarawang “manunukso” at hindi idinaragdag ang pangalang Satanas.
