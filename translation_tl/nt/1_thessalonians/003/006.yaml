id: 1TH.3.6
reference: 1 Thessalonians 3:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἄρτι δὲ ἐλθόντος Τιμοθέου πρὸς ἡμᾶς ἀφ’ ὑμῶν καὶ εὐαγγελισαμένου ἡμῖν τὴν πίστιν καὶ τὴν ἀγάπην ὑμῶν, καὶ ὅτι ἔχετε μνείαν ἡμῶν ἀγαθὴν πάντοτε ἐπιποθοῦντες ἡμᾶς ἰδεῖν καθάπερ καὶ ἡμεῖς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/006.yaml
  text: But now that Timothy has come to us from you and has brought us the good news of your faith and love[a], and that you always have a good remembrance of us, longing to see us just as we also long to see you,
translation:
  language: tl
  text: Ngunit ngayong dumating na sa amin si Timoteo mula sa inyo at ibinalita niya sa amin ang mabuting balita tungkol sa inyong pananampalataya[a] at pag-ibig, at na lagi ninyo kaming ginugunita nang may mabuting damdamin at nananabik kayong makita kami, gaya rin ng pananabik naming makita kayo,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “inyong katapatan.” Ang salitang Griyego na pistis ay maaaring mangahulugang pananampalataya, pagtitiwala, o katapatan.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄρτι δὲ
  choice: Ngunit ngayong
  rationale: Ipinapakita ang banayad na pagsalungat at paglipat mula sa naunang pangamba tungo sa kaginhawahan dahil sa bagong dating na balita.
- source_word: ἐλθόντος Τιμοθέου πρὸς ἡμᾶς ἀφ’ ὑμῶν
  choice: dumating na sa amin si Timoteo mula sa inyo
  rationale: Likas na Filipino para sa genitive absolute; ipinahihiwatig ng “dumating na” ang kamakailang pagdating na kaugnay ng ἄρτι.
- source_word: εὐαγγελισαμένου ἡμῖν
  choice: ibinalita niya sa amin ang mabuting balita
  rationale: Sa konteksto, tumutukoy ito sa kanais-nais na ulat ni Timoteo, habang pinananatili ang ugnayang leksikal sa wika ng mabuting balita.
- source_word: τὴν πίστιν
  choice: pananampalataya
  rationale: Karaniwan at angkop na salin ng πίστις dito bilang nagpapatuloy nilang pagtitiwala; pinananatili sa talababa ang posibleng diwang “katapatan.”
- source_word: τὴν ἀγάπην
  choice: pag-ibig
  rationale: Tuwiran at likas na salin ng ἀγάπη.
- source_word: μνείαν ἡμῶν ἀγαθὴν πάντοτε
  choice: lagi ninyo kaming ginugunita nang may mabuting damdamin
  rationale: Inihahatid ang positibong pag-alaala nang mas natural sa modernong Filipino kaysa sa literal na “may mabuting paggunita sa amin,” nang hindi ito ginagawang mas tiyak kaysa sa Griyego.
- source_word: ἐπιποθοῦντες ἡμᾶς ἰδεῖν
  choice: nananabik kayong makita kami
  rationale: Ang “nananabik” ay nagpapahayag ng matinding mapagmahal na pagnanais na likas sa ἐπιποθέω.
- source_word: καθάπερ καὶ ἡμεῖς ὑμᾶς
  choice: gaya rin ng pananabik naming makita kayo
  rationale: Nililinaw sa Filipino ang pandiwang ipinahihiwatig lamang sa Griyego at pinananatili ang magkatumbas na pananabik.
theological_decisions:
- issue: Maaaring mangahulugan ang πίστις ng pananampalataya, pagtitiwala, o katapatan.
  choice: inyong pananampalataya
  alternative: inyong katapatan
  rationale: Sa konteksto, malamang na ang ulat ay tungkol sa nagpapatuloy nilang pananampalataya, ngunit hindi inaalis ang lehitimong diwa ng katapatan kaya inilagay ito sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang mahabang daloy ng pangungusap at ang kuwit sa hulihan dahil nagpapatuloy ang sintaktikong kaisipan sa kasunod na talata.
