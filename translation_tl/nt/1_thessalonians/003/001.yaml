lexical_decisions:
- source_word: Διὸ
  choice: Kaya
  rationale: Nagpapahiwatig ito ng kongklusyon mula sa naunang konteksto at natural na nag-uugnay sa pangungusap sa modernong Tagalog.
- source_word: μηκέτι στέγοντες
  choice: nang hindi na namin ito matiis
  rationale: Ang μηκέτι ay nangangahulugang ‘hindi na,’ at ang στέγω sa konteksto ay tumutukoy sa hindi na makayanan ang bigat ng pag-aalala. Ang ‘matiis’ ay malinaw at natural nang hindi nilulutas kung ano mismo ang hindi nila matiis.
- source_word: εὐδοκήσαμεν
  choice: minabuti namin
  rationale: Ipinahahayag nito ang kusang pagsang-ayon o pasyang itinuring na mabuti. Ang ‘minabuti namin’ ay natural sa Tagalog at pinananatili ang positibong pasiya nang hindi ito ginagawang pawang damdamin ng kasiyahan.
- source_word: καταλειφθῆναι
  choice: maiwan
  rationale: Pinananatili ng ‘maiwan’ ang pasibong diwa ng aorist passive infinitive; hindi kailangan sa pangunahing teksto ang tahasang ‘maiwan sa likuran.’
- source_word: ἐν Ἀθήναις
  choice: sa Atenas
  rationale: Karaniwang lokatibong salin at kinikilalang modernong anyo sa Tagalog ng pangalan ng lungsod.
- source_word: μόνοι
  choice: nag-iisa
  rationale: Likas itong panaguring Tagalog para sa pagiging walang kasama. Bagaman isahan sa anyo ang ‘nag-iisa,’ ang panghalip na ‘namin’ ay nagpapanatili sa maramihang tinutukoy ng Griyego.
theological_decisions:
- issue: Tinutukoy ng unang panauhang maramihan at ang tensiyon nito sa mas malawak na konteksto
  choice: Pinanatili ang maramihang ‘namin’ at hindi ginawang ‘ako’ ang pahayag.
  alternative: Unawain ito bilang epistolary plural na pangunahing tumutukoy kay Pablo, o isaling ‘minabuti kong manatiling mag-isa.’
  rationale: Maramihan ang εὐδοκήσαμεν at μόνοι sa Griyego. Hindi dapat lutasin ng salin ang pinagtatalunang historikal na tanong kung si Pablo lamang o ang pangkat ng mga misyonero ang tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang ‘minabuti’ upang natural na maipahayag ang εὐδοκήσαμεν, at pinanatili ang maramihang ‘namin’ upang hindi harmonisahin ang talata sa isang isahang rekonstruksiyon.
