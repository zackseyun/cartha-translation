id: 1TH.3.12
reference: 1 Thessalonians 3:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὑμᾶς δὲ ὁ κύριος πλεονάσαι καὶ περισσεύσαι τῇ ἀγάπῃ εἰς ἀλλήλους καὶ εἰς πάντας, καθάπερ καὶ ἡμεῖς εἰς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/012.yaml
  text: And may the Lord cause you to increase and abound in love for one another and for all[a], just as we also do for you[b],
translation:
  language: tl
  text: Nawa'y palaguin at pasaganahin ng Panginoon ang inyong pag-ibig sa isa't isa at sa lahat[a], gaya rin ng pag-ibig namin sa inyo[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tungo sa isa't isa at tungo sa lahat.”
    reason: Ipinakikita nito ang mas literal na direksiyonal na diwa ng εἰς, bagaman mas natural sa Filipino ang “pag-ibig sa.”
  - marker: b
    text: Eliptikal ang huling parirala sa Griego; sa literal, “gaya rin namin sa inyo.” Ang “pag-ibig” ay nauunawaan mula sa naunang parirala.
    reason: Nililinaw kung bakit kailangang punan sa Filipino ang pandiwang o pangngalang ipinahihiwatig lamang sa orihinal.
lexical_decisions:
- source_word: ὑμᾶς δὲ
  choice: At ... kayo
  rationale: Ang δέ ay banayad na pag-uugnay, hindi matinding pagsalungat; natural itong isalin na “At.” Ang ὑμᾶς ang layon ng dalawang pandiwa.
- source_word: ὁ κύριος
  choice: ang Panginoon
  rationale: Pinananatili ang karaniwang banal at Kristolohikal na titulo nang hindi tahasang tinutukoy kung sino ang referent sa mismong salin.
- source_word: πλεονάσαι
  choice: palaguin
  rationale: Ipinahahayag ng pandiwang optative ang isang panalangin o hangarin; ang anyong palipat na “palaguin” ay nagpapanatili sa Panginoon bilang sanhi ng paglago.
- source_word: περισσεύσαι
  choice: pasaganahin
  rationale: Pinananatiling hiwalay sa “palaguin” ang ikalawang pandiwa at ipinahahayag ang diwa ng kasaganaan o labis na pagdami.
- source_word: τῇ ἀγάπῃ
  choice: sa pag-ibig
  rationale: Ipinakikita ng parirala ang larangan o bagay kung saan sila dapat lumago at sumagana.
- source_word: εἰς ἀλλήλους καὶ εἰς πάντας
  choice: sa isa't isa at sa lahat
  rationale: Natural itong paglalarawan sa mga pinag-uukulan ng pag-ibig. Pinananatiling malawak at hindi tinutukoy ang saklaw ng πάντας.
- source_word: καθάπερ καὶ ἡμεῖς εἰς ὑμᾶς
  choice: gaya rin ng pag-ibig namin sa inyo
  rationale: Eliptikal ang Griego. Inilalantad sa Filipino ang nauunawaang “pag-ibig” mula sa naunang parirala nang hindi nagdaragdag ng bagong kilos o kahulugan.
theological_decisions:
- issue: Tinutukoy ng “Panginoon”
  choice: Hindi tahasang tinukoy; pinanatili lamang ang titulong “Panginoon.”
  alternative: Tahasang tukuyin bilang si Jesus o bilang Diyos.
  rationale: Hindi nililinaw ng mismong talata ang referent, kaya hindi dapat lutasin ng salin ang nananatiling maaaring pagtalunan batay sa mas malawak na konteksto.
- issue: Saklaw ng πάντας
  choice: “lahat”
  alternative: “lahat ng tao” o “lahat ng mananampalataya”
  rationale: Malawak ngunit hindi espesipiko ang Griego. Pinananatili ng “lahat” ang bukas na saklaw nito.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang panalanging anyong “nawa” at pinanatili ang dalawang magkaugnay ngunit magkahiwalay na pandiwa. Ang “sa lahat” ay sadyang hindi pinalawak upang huwag paliitin o tukuyin nang labis ang saklaw.
