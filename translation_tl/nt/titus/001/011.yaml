  source_fidelity: 'Ang pangunahing diwa ay tapat sa Griyego: kinakailangang pigilan ang mga taong ito, sapagkat ang kanilang pagtuturo ay nakapipinsala sa buong sambahayan at inuudyukan ng kahiya-hiyang pakinabang. Gayunman, ang «ginugulo» ay mas mahina kaysa ἀνατρέπουσιν, na nagpapahiwatig ng pagsira, pagpapabagsak, o pagsira sa kaayusan. Ang talababa sa ἐπιστομίζειν ay kailangang itama: hindi «takpan» ang pangunahing literal na larawan kundi «ipasara/ihinto ang bibig.»'
