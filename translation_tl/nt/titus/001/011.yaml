  terminology: Ang «patahimikin,» «mga sambahayan,» at «kahiya-hiyang pakinabang» ay angkop. Pinananatili ng «patahimikin» ang malakas na utos na pigilan ang mapaminsalang pagtuturo nang hindi nagtatakda ng pisikal o sibil na paraan.
