  text: οὓς δεῖ ἐπιστομίζειν, οἵτινες ὅλους οἴκους ἀνατρέπουσιν διδάσκοντες ἃ μὴ δεῖ αἰσχροῦ κέρδους χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/011.yaml
  text: They must be silenced[c][b][a], since they are upsetting whole households by teaching what they ought not for the sake of shameful gain.
translation:
  language: tl
  text: Dapat silang patahimikin[a], sapagkat sinisira nila ang buong mga sambahayan[b] sa pagtuturo ng hindi dapat ituro alang-alang sa kahiya-hiyang pakinabang.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na salin, “Dapat ipasara ang kanilang mga bibig.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mga sambahayan” ay tumutukoy sa mga pamilya at iba pang kabilang sa isang tahanan, hindi lamang sa mga bahay bilang gusali.
    reason: cultural_note
  - marker: c
    text: O “maruming pakinabang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὓς δεῖ ἐπιστομίζειν
  choice: Dapat silang patahimikin
  rationale: Likas sa modernong Tagalog at malinaw na naghahayag ng pangangailangang pigilan ang kanilang mapaminsalang pagtuturo. Ang literal na larawan ng pagpigil sa bibig ay inilagay sa talababa.
- source_word: οἵτινες
  choice: sapagkat
  rationale: Ipinakikita ang paliwanag o dahilan kung bakit kailangan silang patahimikin.
- source_word: ὅλους οἴκους
  choice: ang buong mga sambahayan
  rationale: Ang οἶκος dito ay maaaring tumukoy sa buong yunit ng pamilya at mga kasambahay, hindi lamang sa gusali.
- source_word: ἀνατρέπουσιν
  choice: ginugulo
  rationale: Ipinahahayag ang malubhang paggambala o pagpapabagsak sa kaayusan ng mga sambahayan nang hindi ipinapalagay na lubos na silang nawasak.
- source_word: διδάσκοντες
  choice: sa pagtuturo
  rationale: Ipinakikita ang paraan kung paano nila ginugulo ang mga sambahayan.
- source_word: ἃ μὴ δεῖ
  choice: ng mga bagay na hindi dapat
  rationale: Pinananatili ang maikli at sadyang di-tiyak na pagtukoy sa nilalaman ng maling pagtuturo.
- source_word: αἰσχροῦ κέρδους χάριν
  choice: alang-alang sa kahiya-hiyang pakinabang
  rationale: Pinananatili ang tahasang paghatol sa kanilang motibong kumita sa paraang kahiya-hiya.
theological_decisions:
- issue: Uri ng pagpigil sa mga huwad na guro
  choice: Dapat silang patahimikin
  alternative: Dapat takpan ang kanilang mga bibig
  rationale: Ang teksto ay nag-uutos na matigil ang kanilang pagtuturo ngunit hindi tinutukoy ang pisikal, sibil, o iba pang paraan ng pagpigil; kaya hindi nagdagdag ng paraang wala sa Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “sambahayan” upang mapanatili ang panlipunang kahulugan ng οἶκος, at “patahimikin” upang ihatid ang puwersa ng idyomang Griyego nang hindi nagpapahiwatig ng isang partikular na paraan ng pagpapatahimik.
