  yaml_path: translation/nt/titus/001/013.yaml
  text: This testimony is true. For this reason[a], rebuke them sharply, so that they may be sound in the faith,
translation:
  language: tl
  text: Totoo ang patotoong ito. Dahil dito, mahigpit na sawayin mo sila upang maging malusog sila sa pananampalataya[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “maging maayos sa pananampalataya.” Ang pariralang Griyego ay maaaring tumukoy sa pagiging malusog sa kanilang pagsampalataya o sa pagiging wasto sa pananampalatayang Cristiano bilang kabuuan ng pinaniniwalaan.
    reason: alternative_reading
lexical_decisions:
- source_word: μαρτυρία
  choice: patotoo
  rationale: Ang “patotoo” ay angkop sa naunang siniping pahayag tungkol sa mga taga-Creta at pinananatili ang diwang nagpapatunay o nagbibigay-saksi.
- source_word: ἀληθής
  choice: totoo
  rationale: Likas at tuwirang panaguring Filipino para sa patotoong tumutugma sa realidad.
- source_word: δι’ ἣν αἰτίαν
  choice: kaya
  rationale: Malinaw at natural na ipinahahayag ang bunga o pasyang nagmumula sa naunang pahayag.
- source_word: ἔλεγχε
  choice: sawayin
  rationale: Ipinahahayag ng “sawayin” ang tuwiran at mapagtuwid na pagharap sa kamalian, ayon sa lakas ng pautos sa Griyego.
- source_word: ἀποτόμως
  choice: nang mahigpit
  rationale: Pinananatili nito ang tindi at pagiging matalas ng pagsaway nang hindi ipinahihiwatig na ito ay pagpaparusa.
- source_word: ὑγιαίνωσιν
  choice: maging matatag
  rationale: Natural itong Filipino para sa matalinghagang diwa ng pagiging malusog o maayos sa espirituwal at doktrinal na kalagayan, bagaman hindi nito literal na inuulit ang larawang pangkalusugan.
- source_word: ἐν τῇ πίστει
  choice: sa pananampalataya
  rationale: Pinananatili ng parirala ang posibilidad na tumukoy kapuwa sa personal na pananampalataya at sa pananampalatayang Cristiano bilang kinikilalang kabuuan ng paniniwala.
theological_decisions:
- issue: Kahulugan ng ἐν τῇ πίστει
  choice: sa pananampalataya
  alternative: sa kanilang pananampalataya / sa pananampalatayang Cristiano
  rationale: Maaaring tumukoy ang pariralang may pantukoy sa pananampalatayang Cristiano bilang nilalaman ng paniniwala, lalo na sa konteksto ng mga bulaang guro; maaari rin itong ilarawan bilang pagiging matatag sa mismong pagsampalataya. Hindi nilulutas nang tahimik ng salin ang tunay na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sawayin” upang mapanatili ang tuwirang lakas ng utos, at “nang mahigpit” upang ihayag ang tindi nito. Inilagay ang talababa sa “pananampalataya,” na siyang aktuwal na kinaroroonan ng leksikal at teolohikal na kalabuan.
