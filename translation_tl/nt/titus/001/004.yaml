source:
  edition: SBLGNT
  text: Τίτῳ γνησίῳ τέκνῳ κατὰ κοινὴν πίστιν· χάρις ⸀καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς καὶ ⸂Χριστοῦ Ἰησοῦ⸃ τοῦ σωτῆρος ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/004.yaml
  text: 'To Titus[b][a], my true child according to our common faith: grace and peace from God the Father and Messiah Jesus our Savior.'
translation:
  language: tl
  text: 'Kay Tito, ang tunay kong anak ayon sa pananampalatayang kapwa natin pinanghahawakan[a]: Sumaiyo ang biyaya at kapayapaan mula sa Diyos Ama at sa Mesias na si Jesus, na ating Tagapagligtas.[b]


    [a] O, “pananampalatayang pareho nating taglay.”


    [b] Sa Griyego, Χριστοῦ Ἰησοῦ, “Cristo Jesus”; isinalin dito bilang “Mesias na si Jesus” sapagkat ginagamit ang Χριστός bilang titulo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “pananampalatayang pareho nating taglay.”
    reason: Ipinapakita ang natural na alternatibong salin ng κοινὴν πίστιν bilang pananampalatayang magkasalo o pareho nilang taglay.
  - marker: b
    text: Sa Griyego, Χριστοῦ Ἰησοῦ, “Cristo Jesus”; isinalin dito bilang “Mesias na si Jesus” sapagkat ginagamit ang Χριστός bilang titulo.
    reason: Itinatala ang nakaugaliang anyong “Cristo Jesus” at ipinapaliwanag kung bakit “Mesias na si Jesus” ang pangunahing salin, nang mapanatili ang titulong puwersa ng Χριστός.
lexical_decisions:
- source_word: γνησίῳ τέκνῳ
  choice: tunay kong anak
  rationale: Ipinahahayag nito ang tunay na espirituwal na ugnayan ni Pablo kay Tito, hindi ang biyolohikal na pagiging anak. Idinagdag ang “kong” bilang likas na pagpapahayag sa Tagalog ng ugnayang ipinahihiwatig ng pagbati.
- source_word: κατὰ κοινὴν πίστιν
  choice: ayon sa pananampalatayang kapwa natin pinanghahawakan
  rationale: Pinananatili ng “ayon sa” ang ugnayang ipinahahayag ng κατά, samantalang malinaw at natural na ipinapakita ng “kapwa natin pinanghahawakan” ang κοινήν bilang pananampalatayang magkasalo sila.
- source_word: πίστιν
  choice: pananampalataya
  rationale: Sa konteksto, tumutukoy ito sa pananampalatayang Kristiyano na kapwa pinanghahawakan nina Pablo at Tito, hindi sa katapatan bilang katangian.
- source_word: χάρις καὶ εἰρήνη
  choice: biyaya at kapayapaan
  rationale: Ito ang karaniwan at tumpak na salin ng pormula ng pagpapala sa mga liham ni Pablo.
- source_word: θεοῦ πατρὸς
  choice: Diyos Ama
  rationale: Walang ἡμῶν pagkatapos ng πατρός sa tekstong Griyego, kaya hindi dinagdagan ng “ating” ang titulong ito.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Mesias na si Jesus
  rationale: Isinasalin ang Χριστός bilang titulong “Mesias” sa halip na tratuhing bahagi lamang ng pangalan; ang hulma na “Mesias na si Jesus” ay natural sa modernong Tagalog.
- source_word: σωτῆρος ἡμῶν
  choice: ating Tagapagligtas
  rationale: Tuwirang pinananatili ang mahalagang titulo at ang unang panauhang maramihang panghalip ng Griyego.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστός sa pariralang Χριστοῦ Ἰησοῦ
  choice: Mesias na si Jesus
  alternative: Cristo Jesus
  rationale: Pinananatili ng “Mesias” ang kahulugan ng titulong Griyego, habang inilalagay ito sa natural na ayos ng Tagalog.
- issue: Tinutukoy ng σωτῆρος ἡμῶν
  choice: Ang “ating Tagapagligtas” ay tumutukoy sa Mesias na si Jesus.
  alternative: Maaaring marinig ang titulo bilang mas maluwag na kaugnay ng buong pinagsamang parirala tungkol sa pinagmumulan ng biyaya at kapayapaan.
  rationale: Sa agarang sintaks, ang artikulong τοῦ at ang pariralang σωτῆρος ἡμῶν ay nasa aposisyon sa Χριστοῦ Ἰησοῦ, kaya likas nitong kinikilala si Jesus bilang Tagapagligtas.
- issue: Pahiwatig ng pandiwa sa χάρις καὶ εἰρήνη
  choice: Sumaiyo ang biyaya at kapayapaan
  alternative: Biyaya at kapayapaan sa iyo
  rationale: Walang tahasang pandiwa sa Griyego, ngunit ang “Sumaiyo” ay natural na pormula ng pagbati sa Tagalog at hindi ginagawang mas tiyak kaysa kailangan ang pinagmumulang pagpapala.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Sumaiyo” bilang pormal ngunit madaling maunawaang pormula ng pagpapala. Iniwasan ang di-likas na “Mesias Jesus” sa pamamagitan ng “Mesias na si Jesus,” nang hindi inaalis ang puwersa ng titulo.
