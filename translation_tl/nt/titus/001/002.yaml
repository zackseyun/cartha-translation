id: TIT.1.2
reference: Titus 1:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐπ’ ἐλπίδι ζωῆς αἰωνίου, ἣν ἐπηγγείλατο ὁ ἀψευδὴς θεὸς πρὸ χρόνων αἰωνίων
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/002.yaml
  text: in the hope of eternal life[a], which the God who does not lie promised before the ages began
translation:
  language: tl
  text: sa pag-asa sa buhay na walang hanggan, na ipinangako ng Diyos na hindi nagsisinungaling bago pa nagsimula ang mga panahon[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “bago pa nagsimula ang panahon.” Sa literal, ang Griyego ay nagsasabing “bago ang walang-hanggan/matitagal na mga panahon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπ’ ἐλπίδι
  choice: sa pag-asa
  rationale: Likas na salin ito sa Tagalog at pinananatili ang kaugnayan sa pag-asa nang hindi nililimitahan ang ἐπί sa sanhi, batayan, o layunin lamang.
- source_word: ζωῆς αἰωνίου
  choice: sa buhay na walang hanggan
  rationale: Ang pariralang ito ang nilalaman o layon ng pag-asa. Ang “buhay na walang hanggan” ay malinaw, natural, at karaniwang salin ng ζωή αἰώνιος.
- source_word: ἣν
  choice: na
  rationale: Ang pambabaeng pang-isahang panghalip na pamatlig ay pinakamalikas na tumutukoy sa “buhay na walang hanggan,” hindi sa “pag-asa.”
- source_word: ἐπηγγείλατο
  choice: ipinangako
  rationale: Tumpak at natural na kinakatawan ng “ipinangako” ang aorist middle ng ἐπαγγέλλομαι; hindi kailangang piliting ipahayag ang middle voice sa Tagalog.
- source_word: ὁ ἀψευδὴς θεὸς
  choice: ang Diyos na hindi nagsisinungaling
  rationale: Direktang pinananatili nito ang paglalarawan sa Diyos bilang hindi nagsisinungaling, nang hindi pinatitindi ang salita tungo sa “hindi maaaring magsinungaling.”
- source_word: πρὸ χρόνων αἰωνίων
  choice: bago pa nagsimula ang mga panahon
  rationale: Pinananatili nito ang maramihang χρόνων at ang diwang bago pa ang mga kapanahunan, habang nananatiling natural sa modernong Tagalog. Iniiwasan nitong gawing tiyak ang metapisikong kahulugang hindi tahasang nilulutas ng Griyego.
theological_decisions:
- issue: Ang temporal na pariralang πρὸ χρόνων αἰωνίων at ang pangako ng Diyos
  choice: bago pa nagsimula ang mga panahon
  alternative: bago pa nagsimula ang panahon; bago pa ang mga panahong walang hanggan; mula pa sa walang hanggan
  rationale: Malinaw na inilalagay ng Griyego ang pangako bago ang mga panahon, ngunit hindi nito sinasabi rito kung kanino ginawa ang pangako o kung paano ito dapat ipaliwanag sa metapisikong paraan. Pinananatili ng salin ang pahayag at ang teolohikal na tensiyon.
- issue: Ang paglalarawan sa Diyos bilang ἀψευδής
  choice: ang Diyos na hindi nagsisinungaling
  alternative: ang Diyos na hindi maaaring magsinungaling; ang tapat na Diyos
  rationale: Ang napiling salin ay tapat sa tuwirang diwa ng pang-uri at hindi nagdaragdag ng mas malakas na doktrinal na pahayag kaysa sa mismong teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “nagsisinungaling” sa halip na mas pormal na “nagsisinungaling kailanman” o mas interpretibong “hindi maaaring magsinungaling.” Ang [a] ay inilagay kaagad pagkatapos ng pariralang temporal na tinutukoy nito.
