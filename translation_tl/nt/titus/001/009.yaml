base_translation:
  language: en
  yaml_path: translation/nt/titus/001/009.yaml
  text: holding firmly to the trustworthy word in accordance with the teaching[b][a], so that he may be able both to exhort by sound teaching and to rebuke those who contradict it.
translation:
  language: tl
  text: Dapat siyang mahigpit na manghawak sa mapagkakatiwalaang salita[a] na naaayon sa turo, upang may kakayahan siyang humimok sa pamamagitan ng wastong pagtuturo at sawayin[b] ang mga sumasalungat dito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “tapat na salita.”
    reason: lexical_alternative
  - marker: b
    text: O, “pabulaanan” o “patunayang mali.” Maaaring tumukoy ang pandiwang Griyego sa pagsaway at pagtutuwid, gayundin sa paglalantad o pagpapatunay na mali ang isang sumasalungat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντεχόμενον
  choice: Mahigpit siyang manghawak
  rationale: Ipinahahayag nito ang matatag at patuloy na pagkapit sa mensahe. Likas sa modernong Tagalog ang parirala at napananatili nito ang aktibong diin ng Griyego.
- source_word: πιστοῦ λόγου
  choice: mapagkakatiwalaang salita
  rationale: Ang πιστός ay tumutukoy dito sa pagiging maaasahan o mapagkakatiwalaan, at pinananatili ng “salita” ang karaniwang saklaw ng λόγος bilang ipinahayag na mensahe.
- source_word: κατὰ τὴν διδαχήν
  choice: na naaayon sa turo
  rationale: Ipinakikita ng κατά na ang salita ay kaayon o kasang-ayon ng kinikilalang turo, hindi pansariling opinyon ng tagapanguna.
- source_word: παρακαλεῖν
  choice: manghikayat
  rationale: Saklaw nito ang paghikayat at masidhing paghimok. Sa konteksto ng pagtuturo, malinaw ito sa karaniwang mambabasa nang hindi nagiging teknikal.
- source_word: ἐν τῇ διδασκαλίᾳ τῇ ὑγιαινούσῃ
  choice: sa pamamagitan ng wastong pagtuturo
  rationale: Metaporikal na nangangahulugang malusog o matibay ang ὑγιαινούσῃ. Ang “wasto” ay natural na Tagalog para sa turong walang kapinsalaan, habang ang “pagtuturo” ay ang paraang ginagamit sa panghihikayat.
- source_word: ἀντιλέγοντας
  choice: mga sumasalungat dito
  rationale: Tumutukoy ang participle sa mga nagsasalita laban sa mapagkakatiwalaang salita o wastong turo. Nililinaw ng “dito” ang ipinahihiwatig na layon nang hindi pinipili nang labis sa pagitan ng dalawang malapit na reperente.
- source_word: ἐλέγχειν
  choice: sawayin
  rationale: Ipinakikita nito ang paglalantad at pagtutuwid sa kamalian, na maaaring may diin sa pagsaway o pagpapatunay na mali ang sumasalungat. Nasa talababa ang alternatibong “pabulaanan.”
- source_word: δυνατὸς ᾖ
  choice: upang magawa niya
  rationale: Natural nitong ipinahahayag sa Tagalog ang kakayahang nilalayon ng ἵνα-clause.
theological_decisions:
- issue: Ang tinutukoy ng “turo” at “mapagkakatiwalaang salita”
  choice: Inilalarawan ang kinikilalang mensaheng Kristiyano na kaayon ng turo, nang hindi ito ginagawang pansariling palagay ng tagapanguna.
  alternative: Pangkalahatang mabuting aral lamang o pribadong interpretasyon ng tagapanguna.
  rationale: Ang tiyak na artikulo sa διδαχή at ang gamit ng πιστὸς λόγος sa konteksto ng mga Liham Pastoral ay nagpapahiwatig ng matatag at kinikilalang turo, ngunit hindi nagdaragdag ang salin ng mga teknikal na kategoryang nabuo sa kalaunan.
- issue: Saklaw ng ἐλέγχειν laban sa mga sumasalungat
  choice: “sawayin,” na may kasamang diwa ng pagtutuwid at paglalantad ng kamalian
  alternative: “pabulaanan” o “patunayang mali”
  rationale: Pinagsasama ng pandiwa ang pastoral na pagtutuwid at ang pagharap sa maling pagsalungat. Pinananatili sa talababa ang mas argumentatibong diwa upang hindi mawala ang tunay na leksikal na saklaw.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal ngunit madaling maunawaang himig. Ginamit ang “turo/pagtuturo” sa halip na mas teknikal na “doktrina,” at “sawayin” sa pangunahing teksto habang pinananatili sa talababa ang diwa ng pagpapabulaan.
