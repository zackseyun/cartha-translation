  to: Dapat siyang mahigpit na manghawak sa mapagkakatiwalaang salita[a] na naaayon sa turo, upang may kakayahan siyang humimok sa pamamagitan ng wastong pagtuturo at sawayin[b] ang mga sumasalungat dito.
