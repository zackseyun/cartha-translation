    rationale: Ang Griyego ay participle na bahagi ng paglalarawan sa kinakailangang katangian ng tagapanguna. Ang “Dapat siyang mahigpit na manghawak” ay nagbibigay ng likas na Filipino na pormang kuwalipikasyonal nang hindi binabago ang diwa.
  - severity: low
    issue: Ang “upang magawa niyang” ay hindi gaanong tiyak para sa δυνατὸς ᾖ.
    rationale: Ang parirala ay tahasang tumutukoy sa kakayahan o pagiging may kakayahan. Ang “upang may kakayahan siyang” ay mas malapit at mas malinaw.
