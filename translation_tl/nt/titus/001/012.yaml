  text: εἶπέν τις ἐξ αὐτῶν, ἴδιος αὐτῶν προφήτης, Κρῆτες ἀεὶ ψεῦσται, κακὰ θηρία, γαστέρες ἀργαί·
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/012.yaml
  text: One of them[a], their own prophet, said, “Cretans are always liars, evil beasts, lazy gluttons.”
translation:
  language: tl
  text: 'Sinabi ito ng isa sa kanila—isang propeta nila mismo: “Ang mga taga-Creta ay laging mga sinungaling, masasamang mababangis na hayop, at tamad na matatakaw.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na, “mga tamad na tiyan.” Isang mapanuyang paglalarawan ito ng mga taong mahilig kumain ngunit ayaw magtrabaho.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπέν τις ἐξ αὐτῶν
  choice: Sinabi ng isa sa kanila
  rationale: Pinananatili nito ang di-tiyak na τις at ang partitive na diwa ng ἐξ αὐτῶν sa natural na Tagalog.
- source_word: ἴδιος αὐτῶν προφήτης
  choice: na sarili nilang propeta
  rationale: Ipinakikita ng ἴδιος na ang propetang binanggit ay kabilang mismo sa mga taga-Creta; ang anyong ito ay malinaw at likas sa modernong Tagalog.
- source_word: Κρῆτες
  choice: mga taga-Creta
  rationale: Ito ang karaniwang modernong Tagalog na katawagan sa mga taong mula sa Creta.
- source_word: ἀεὶ ψεῦσται
  choice: laging sinungaling
  rationale: Tuwirang inililipat ang ἀεί bilang “lagi” at ang ψεῦσται bilang “mga sinungaling,” habang pinananatiling matalas ang kasabihan.
- source_word: κακὰ θηρία
  choice: masasamang hayop
  rationale: Pinananatili ang literal na larawang-metapora ng θηρία at ang moral na bigat ng κακά nang hindi ito pinapalambot.
- source_word: γαστέρες ἀργαί
  choice: mga tamad na tiyan
  rationale: 'Literal na inililipat ang matingkad at kakaibang insulto: γαστέρες ay “mga tiyan” at ἀργαί ay “tamad” o “walang-ginagawa.” Ang talinghaga ay nauunawaan sa Tagalog at hindi kailangang ipakahulugang “matatakaw.”'
theological_decisions:
- issue: Paglalahad ng isang malupit na pangkalahatang pahayag tungkol sa mga taga-Creta
  choice: Isinalin nang tuwiran bilang sipi at hindi pinalambot ang negatibong pananalita
  alternative: Ipaliwanag o hinaan sa mismong teksto ang etnikong paglalahat
  rationale: Malinaw sa Griyego na sinisipi ang sinabi ng isa sa kanila, na tinawag na sarili nilang propeta. Pinananatili ng salin ang retorikal na tensiyon at hindi ginagawang tahasang unibersal na pahayag ng tagapagsalaysay ang sipi.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Pinanatili ang matalas na anyo ng siniping kasabihan at ang kongkretong metapora ng orihinal.
