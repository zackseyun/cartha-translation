  text: Τούτου χάριν ⸀ἀπέλιπόν σε ἐν Κρήτῃ ἵνα τὰ λείποντα ἐπιδιορθώσῃ, καὶ καταστήσῃς κατὰ πόλιν πρεσβυτέρους, ὡς ἐγώ σοι διεταξάμην,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/005.yaml
  text: For this reason I left you in Crete[a], so that you might set in order what remained and appoint elders in every city[c][b], as I directed you.
translation:
  language: tl
  text: Dahil dito, iniwan kita sa Creta upang ayusin mo ang mga bagay na hindi pa natatapos[a] at magtalaga ka ng mga nakatatanda sa bawat lungsod[b], gaya ng itinagubilin ko sa iyo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang mga bagay na kulang pa.”
    reason: lexical_alternative
  - marker: b
    text: O, “lungsod sa lungsod.”
    reason: lexical_alternative
  - marker: c
    text: O, “gaya ng iniutos ko sa iyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτου χάριν
  choice: Dahil dito
  rationale: Likas na makabagong Tagalog para sa pariralang nagsasaad ng dahilan, habang pinananatili ang ugnayan nito sa naunang sinabi.
- source_word: ἀπέλιπόν σε ἐν Κρήτῃ
  choice: iniwan kita sa Creta
  rationale: Tuwirang ipinahahayag na iniwan ni Pablo si Tito sa isla; hindi kailangang dagdagan ng diin na maaaring ipahiwatig ng “iniwan sa likuran.”
- source_word: ἵνα τὰ λείποντα ἐπιδιορθώσῃ
  choice: upang ayusin mo ang mga bagay na hindi pa natatapos
  rationale: Pinagsasama nito ang layuning ipinakikilala ng ἵνα, ang diwa ng pag-aayos o pagtutuwid sa ἐπιδιορθόω, at ang mga bagay na nananatiling hindi pa ganap sa τὰ λείποντα.
- source_word: καταστήσῃς
  choice: magtalaga ka
  rationale: Sa kontekstong ito, tumutukoy ang pandiwa sa pormal na paghirang o paglalagay ng mga tao sa isang tungkulin.
- source_word: κατὰ πόλιν
  choice: sa bawat lungsod
  rationale: Malinaw na ipinahahayag ang distributibong diwa ng κατά na isinasagawa ang pagtatalaga sa bawat lungsod.
- source_word: πρεσβυτέρους
  choice: mga nakatatanda
  rationale: Ipinapakita ng konteksto na mga kinikilalang lider ng iglesya ang tinutukoy, ngunit iniiwasan ng salin ang pagpasok ng mas huling katawagang natatangi sa isang denominasyon.
- source_word: ὡς ἐγώ σοι διεταξάμην
  choice: gaya ng itinagubilin ko sa iyo
  rationale: Ang “itinagubilin” ay nagpapahayag ng may-awtoridad na tagubilin nang hindi agad nilulutas kung dapat bang idiin ang mas malakas na diwang “iniutos.”
theological_decisions:
- issue: Katawagan sa tungkuling pang-iglesya sa πρεσβυτέρους
  choice: mga nakatatanda
  alternative: mga presbitero; mga elder; matatandang lalaki
  rationale: Ang talata ay tumutukoy sa mga kinikilalang lider ng iglesya, hindi lamang sa matatandang lalaki. Ang “mga nakatatanda” ay madaling maunawaan at hindi nag-aangkat ng partikular na balangkas ng pamamahala ng isang denominasyon.
- issue: Lakas ng διεταξάμην
  choice: itinagubilin
  alternative: iniutos; itinuro
  rationale: Maaaring magpahiwatig ang Griyego ng utos o may-awtoridad na tagubilin. Pinananatili ng “itinagubilin” ang awtoridad ni Pablo nang hindi labis na pinatitigas o pinahihina ang tono; nasa talababa ang mas matinding alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Creta,” ang karaniwang anyong Filipino ng pangalan ng isla. Ang “mga nakatatanda” ay binabasa rito bilang katawagan sa mga lider ng iglesya ayon sa konteksto, nang hindi itinatakda ang isang denominasyonal na sistema ng pamamahala.
