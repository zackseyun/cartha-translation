  text: ἐφανέρωσεν δὲ καιροῖς ἰδίοις, τὸν λόγον αὐτοῦ ἐν κηρύγματι ὃ ἐπιστεύθην ἐγὼ κατ’ ἐπιταγὴν τοῦ σωτῆρος ἡμῶν θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/003.yaml
  text: but in his own times he revealed his word through the proclamation with which I was entrusted[a], according to the command of God our Savior[c][b],
translation:
  language: tl
  text: ngunit sa mga panahong itinakda niya[a] ay inihayag niya ang kanyang salita sa pamamagitan ng pagpapahayag[b] na ipinagkatiwala sa akin[c], ayon sa utos ng Diyos na ating Tagapagligtas,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa mga takdang panahon.” Literal sa Griyego, “sa sarili niyang mga panahon,” na malamang ay tumutukoy sa mga panahong itinakda ng Diyos.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa pamamagitan ng pangangaral.” Ang salitang Griyego ay maaaring tumukoy sa gawa ng pagpapahayag o sa mensaheng ipinahahayag.
    reason: lexical_alternative
  - marker: c
    text: 'Maaari ring iugnay ang “na ipinagkatiwala sa akin” sa “kanyang salita”: “ang kanyang salita … na ipinagkatiwala sa akin.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐφανέρωσεν
  choice: inihayag niya
  rationale: Ipinahihiwatig ng konteksto na Diyos ang simuno. Ang “inihayag” ay natural sa modernong Tagalog at nagpapanatili sa diwang ginawang hayag ang dating hindi pa nahahayag.
- source_word: καιροῖς ἰδίοις
  choice: sa sarili niyang mga panahon
  rationale: Pinananatili nito ang maramihang “mga panahon” at ang puwersang paari ng ἰδίοις, na tumutukoy sa mga panahong itinakda ng Diyos.
- source_word: τὸν λόγον αὐτοῦ
  choice: ang kanyang salita
  rationale: Pinananatili ng “salita” ang tuwirang leksikal na ugnayan sa λόγος, habang nauunawaan sa konteksto bilang mensaheng mula sa Diyos.
- source_word: ἐν κηρύγματι
  choice: sa pamamagitan ng pagpapahayag
  rationale: Ipinakikita ng “sa pamamagitan ng” ang instrumentong gamit sa paghahayag. Ang “pagpapahayag” ay maaaring tumukoy sa gawa ng paghahayag o sa mensaheng ipinahahayag.
- source_word: ὃ
  choice: na
  rationale: Ang panghalip na pamukod ay pinakamalapit na iniuugnay sa “pagpapahayag,” ngunit likas sa Tagalog ang simpleng “na”; inilalahad sa talababa ang posibleng pag-uugnay nito sa “salita.”
- source_word: ἐπιστεύθην
  choice: ipinagkatiwala sa akin
  rationale: Sa anyong balintiyak na ito, ang pandiwa ay nangangahulugang may bagay na ipinagkatiwala kay Pablo, hindi na siya ay sumampalataya.
- source_word: κατ’ ἐπιταγὴν
  choice: ayon sa utos
  rationale: Natural at tumpak na ipinahahayag nito ang pagsunod o pag-ayon sa isang makapangyarihang kautusan.
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: ng Diyos na ating Tagapagligtas
  rationale: Malinaw at natural na appositional na pahayag ito sa Tagalog at pinananatili ang titulong “Tagapagligtas” para sa Diyos.
theological_decisions:
- issue: Ang ipinahihiwatig na simuno ng ἐφανέρωσεν at ang puwersang paari ng καιροῖς ἰδίοις
  choice: 'Diyos ang simuno: “sa sarili niyang mga panahon ay inihayag niya.”'
  alternative: 'Di-personal na pagbasa: “sa takdang panahon ay inihayag ito.”'
  rationale: Sa naunang konteksto, Diyos ang nangako bago pa nagsimula ang mga panahon at siya rin ang naghahayag. Pinananatili ng salin ang daloy na ito at ang paaring diwa ng ἰδίοις.
- issue: Ang tinutukoy ng panghalip na ὃ
  choice: Iniuugnay ito sa “pagpapahayag.”
  alternative: 'Maaari itong iugnay sa “kanyang salita”: “ang kanyang salita … na ipinagkatiwala sa akin.”'
  rationale: Ang κήρυγμα ang pinakamalapit na angkop na antecedent, at natural na maunawaan na ang pagpapahayag ang ipinagkatiwala kay Pablo. Gayunman, tunay na posible sa balarila ang pag-uugnay sa “salita,” kaya pinananatili ito sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang “ngunit” dahil nagpapatuloy ang talata mula sa naunang sugnay, at pinanatili ang pangwakas na kuwit upang ipakitang nagpapatuloy pa ang pangungusap sa Titus 1:4. Ginamit ang “Tagapagligtas” bilang pamilyar at marangal na katawagan.
