base_translation:
  language: en
  yaml_path: translation/nt/titus/001/016.yaml
  text: They profess to know God[a], but by their works they deny him[d][c][b], being detestable and disobedient and unfit for every good work.
translation:
  language: tl
  text: Ipinapahayag nilang kilala nila ang Diyos[a], ngunit itinatanggi nila siya sa pamamagitan ng kanilang mga gawa[b]. Sila ay kasuklam-suklam[c], masuwayin, at hindi angkop para sa anumang mabuting gawa[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Inaangkin nilang kilala nila ang Diyos.”
    reason: lexical_alternative
  - marker: b
    text: O “ngunit itinatanggi siya ng kanilang mga gawa.”
    reason: lexical_alternative
  - marker: c
    text: O “karima-rimarim.”
    reason: lexical_alternative
  - marker: d
    text: O “hindi kuwalipikado para sa bawat mabuting gawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὸν
  choice: ang Diyos
  rationale: Tuwirang layon ng ipinahahayag nilang kilala nila; ang karaniwang katawagan sa Diyos sa modernong Tagalog.
- source_word: ὁμολογοῦσιν
  choice: Ipinapahayag nila
  rationale: Ipinakikita ang hayagang pagsasabi o pag-aangkin na sinasalungat ng kanilang aktuwal na asal, nang hindi ipinapalagay na taimtim ang pahayag.
- source_word: εἰδέναι
  choice: kilala nila
  rationale: Natural na Tagalog para sa infinitibong 'makilala/alamin' kapag tao—dito, ang Diyos—ang tinutukoy.
- source_word: τοῖς δὲ ἔργοις
  choice: sa pamamagitan ng kanilang mga gawa
  rationale: 'Pinananatili ang posibleng instrumental na gamit ng datibo: ang kanilang mga kilos ang paraan o patunay ng pagtanggi.'
- source_word: ἀρνοῦνται
  choice: itinatanggi nila siya
  rationale: Direktang inililipat ang matinding pagsalungat sa unang sugnay; ang panghalip ay tumutukoy pabalik sa Diyos.
- source_word: βδελυκτοὶ
  choice: kasuklam-suklam
  rationale: Malinaw at matinding paglalarawan ng moral na karimarimarim, ngunit nananatiling marangal at likas sa Tagalog.
- source_word: ὄντες
  choice: Sila'y
  rationale: Ang Griyegong participle ay natural na inililipat bilang panibagong pangungusap na naglalarawan sa kanila, nang hindi binabago ang ugnayan ng mga katangian.
- source_word: ἀπειθεῖς
  choice: masuwayin
  rationale: Karaniwang Tagalog para sa pagtangging sumunod; naaangkop sa etikong konteksto.
- source_word: πρὸς πᾶν ἔργον ἀγαθὸν
  choice: sa anumang mabuting gawa
  rationale: Likas na Tagalog para sa saklaw ng kawalan ng pagiging karapat-dapat; ang 'anumang' ay idiomatikong nagpapahayag ng bawat uri ng mabuting gawa sa negatibong pahayag.
- source_word: ἀδόκιμοι
  choice: hindi karapat-dapat
  rationale: Ipinahahayag ang hindi pagpasa sa pamantayan o kawalan ng pagiging angkop para sa mabuting gawa, nang hindi labis na teknikal.
theological_decisions:
- issue: Ugnayan ng pasalitang pagpapahayag at praktikal na pagtanggi
  choice: Maaari nilang ipahayag na kilala nila ang Diyos, ngunit ang kanilang mga gawa mismo ang paraan ng pagtanggi nila sa kanya.
  alternative: Maaaring unawain ang pagtanggi bilang pangkalahatang pagtanggi sa katotohanan ng Diyos sa halip na sa Diyos mismo.
  rationale: Hayagang binabanggit ang Diyos sa unang sugnay, at likas na siya pa rin ang di-binanggit na layon ng ἀρνοῦνται. Pinananatili ng salin ang tensiyon sa pagitan ng sinasabi at ginagawa nang walang idinaragdag na doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “ipinapahayag” upang idiin ang panlabas na pag-aangkin, “mga gawa” upang mapanatili ang paulit-ulit na ἔργον, at “hindi karapat-dapat” bilang likas na paglilipat ng ἀδόκιμοι. Hinati sa dalawang pangungusap para sa likas na daloy nang pinananatili ang lohikal na pagkakaugnay.
