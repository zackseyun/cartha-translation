id: TIT.1.1
reference: Titus 1:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Παῦλος δοῦλος θεοῦ, ἀπόστολος δὲ Ἰησοῦ Χριστοῦ κατὰ πίστιν ἐκλεκτῶν θεοῦ καὶ ἐπίγνωσιν ἀληθείας τῆς κατ’ εὐσέβειαν
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/001.yaml
  text: Paul[a], a servant of God and an apostle of Jesus the Messiah, for the faith of God’s chosen ones and the knowledge of the truth that accords with godliness[c][b],
translation:
  language: tl
  text: Si Pablo, isang alipin ng Diyos at apostol ni Jesus, ang Mesiyas, para sa pananampalataya ng mga hinirang ng Diyos[a] at sa pagkakilala[b] sa katotohanang naaayon sa maka-Diyos na pamumuhay[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga pinili ng Diyos.”
    reason: lexical_alternative
  - marker: b
    text: O, “ganap na pagkakilala.”
    reason: lexical_alternative
  - marker: c
    text: O, “katotohanang humahantong sa maka-Diyos na pamumuhay.”
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλος
  choice: alipin
  rationale: Malinaw na ipinahahayag nito ang ganap na pag-aari at pagpapasakop ni Pablo sa Diyos; mas matindi ito kaysa “lingkod.”
- source_word: ἀπόστολος
  choice: apostol
  rationale: Ito ang kinikilalang katawagan sa taong isinugo at binigyan ng awtoridad, at angkop sa tungkulin ni Pablo.
- source_word: Ἰησοῦ Χριστοῦ
  choice: ni Jesus na Mesiyas
  rationale: Pinananatili ang Χριστός bilang titulo (“Mesiyas”) sa natural na anyong Filipino.
- source_word: κατὰ
  choice: para sa
  rationale: Ipinahihiwatig nito na ang pagkaapostol ni Pablo ay nakatuon sa pananampalataya at pagkakilala na sumusunod, habang hindi lubusang isinasara ang siksik na ugnayang sintaktiko ng Griyego.
- source_word: πίστιν
  choice: pananampalataya
  rationale: Karaniwan at angkop na salin dito, na tumutukoy sa pagtitiwala o paniniwala ng mga hinirang ng Diyos.
- source_word: ἐκλεκτῶν θεοῦ
  choice: mga hinirang ng Diyos
  rationale: Pinananatili nito ang diwa ng pagpili ng Diyos nang hindi nagdaragdag ng isang partikular na sistemang teolohikal.
- source_word: ἐπίγνωσιν
  choice: pagkakilala
  rationale: Mas personal at masigla kaysa payak na “kaalaman,” ngunit hindi ipinipilit sa pangunahing teksto ang posibleng masidhing diwang “ganap na pagkakilala.”
- source_word: ἀληθείας
  choice: katotohanan
  rationale: Tumutukoy sa kinikilalang katotohanang kaugnay ng mensahe at pananampalatayang Kristiyano.
- source_word: τῆς κατ’ εὐσέβειαν
  choice: na naaayon sa maka-Diyos na pamumuhay
  rationale: Pinananatili ang pangunahing diwa ng pagkakatugma sa εὐσέβεια nang hindi ipinipilit ang posibleng ugnayang bunga o layunin.
- source_word: εὐσέβειαν
  choice: maka-Diyos na pamumuhay
  rationale: Natural at malinaw itong naghahayag ng debosyon sa Diyos na nakikita sa paraan ng pamumuhay.
theological_decisions:
- issue: Kahulugan ng ἐκλεκτῶν θεοῦ
  choice: mga hinirang ng Diyos
  alternative: mga pinili ng Diyos
  rationale: Parehong ipinahahayag ang banal na pagpili; ang “hinirang” ay marangal at maikli ngunit hindi nito nilulutas ang mas malawak na mga pagtatalong doktrinal tungkol sa paghirang.
- issue: Ugnayang ipinahahayag ng κατὰ πίστιν ... καὶ ἐπίγνωσιν
  choice: para sa pananampalataya ... at sa pagkakilala
  alternative: ayon sa pananampalataya ... at pagkakilala
  rationale: Maaaring tumukoy ang parirala sa layunin o saklaw ng pagkaapostol ni Pablo, o sa pamantayang kaayon nito. Pinili ang malamang na misyunal na direksiyon habang kinikilala ang alternatibo.
- issue: Ugnayan ng katotohanan at εὐσέβεια
  choice: katotohanang naaayon sa maka-Diyos na pamumuhay
  alternative: katotohanang humahantong sa maka-Diyos na pamumuhay
  rationale: Hindi tiyak kung pangunahing pagkakatugma o bunga ang diin ng κατά. Pinananatili ng pangunahing salin ang mas pormal na ugnayan, at inilalagay sa talababa ang makatuwirang pagbasa bilang bunga.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “alipin” upang mapanatili ang lakas ng δοῦλος, “apostol” bilang kinikilalang katawagan, at “Mesiyas” bilang titulo. Ang pangungusap ay sadyang nagtatapos sa kuwit sapagkat nagpapatuloy ang pambungad na pangungusap sa kasunod na mga talata.
