  text: kundi mapagpatuloy sa mga panauhin, umiibig sa mabuti, matino, matuwid[a], banal[b], at may pagpipigil sa sarili[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “makatarungan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “maka-Diyos” o “debotado.”
    reason: lexical_alternative
  - marker: c
    text: 'Dalawang magkaugnay na katangian ang ginamit sa Griyego: ang σώφρονα ay tumutukoy sa pagiging matino, may wastong paghatol, at may pagpipigil, samantalang ang ἐγκρατῆ ay higit na tumutukoy sa pagpipigil o paghahari sa sarili.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: kundi
  rationale: Ipinakikita ang pagsalungat sa mga negatibong katangian sa naunang talata at natural itong nagdurugtong sa kasalukuyang talaan.
- source_word: φιλόξενον
  choice: mapagpatuloy sa mga panauhin
  rationale: Malinaw at likas na ipinahahayag ang pagiging bukas sa pagtanggap at pag-aasikaso sa mga panauhin o dayuhan.
- source_word: φιλάγαθον
  choice: umiibig sa mabuti
  rationale: 'Pinananatili ang tahasang diwa ng tambalang salita: pag-ibig sa anumang mabuti.'
- source_word: σώφρονα
  choice: mahinahon
  rationale: Ipinahahayag ang matinong pag-iisip, pagpipigil, at wastong pagtitimpi nang hindi ito ipinapareho sa mas tahasang pagpipigil sa sarili ng ἐγκρατῆ.
- source_word: δίκαιον
  choice: matuwid
  rationale: Likas na katawagang Filipino para sa wastong asal at moral na integridad; maaari rin itong tumukoy sa pagiging makatarungan.
- source_word: ὅσιον
  choice: banal
  rationale: Pinananatili ang bigat ng katangiang naaayon sa kabanalan at debosyon sa Diyos.
- source_word: ἐγκρατῆ
  choice: may pagpipigil sa sarili
  rationale: Tuwirang ipinahahayag ang pamamahala sa sariling pagnanasa at bugso ng damdamin, at iniingatan ang kaibhan nito sa σώφρονα.
theological_decisions:
- issue: Pagkilala sa magkaugnay ngunit magkaibang mga katangiang σώφρονα at ἐγκρατῆ
  choice: Isinalin ang σώφρονα bilang “mahinahon” at ang ἐγκρατῆ bilang “may pagpipigil sa sarili.”
  alternative: Maaaring isalin ang σώφρονα bilang “matino” o “mapagtimpi,” at ang ἐγκρατῆ bilang “disiplinado.”
  rationale: 'Magkalapit ang saklaw ng dalawang salita ngunit hindi sila dapat pag-isahin: higit na tumutukoy ang una sa matinong paghatol at kahinahunan, samantalang tahasan ang ikalawa sa paghahari sa sariling pagnanasa at impulses.'
- issue: Saklaw ng δίκαιον sa talaan ng mga katangian
  choice: “matuwid”
  alternative: “makatarungan”
  rationale: Sa konteksto, maaaring saklawin ng salita kapwa ang moral na katuwiran at makatarungang pakikitungo. Hindi nililimitahan ng “matuwid” ang kahulugan sa hudisyal na katarungan lamang.
- issue: Saklaw ng ὅσιον
  choice: “banal”
  alternative: “maka-Diyos” o “debotado”
  rationale: Pinananatili ng “banal” ang ugnayan sa kabanalan, bagaman maaari ring idiin ng salitang Griyego ang debosyon o paggalang sa Diyos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mapagpatuloy sa mga panauhin” sa halip na mas pormal na “mapagpatuloy sa mga estranghero,” at pinag-iba ang dalawang magkalapit na katangian ng pagpipigil upang mapanatili ang teksturang etikal ng Griyego.
