  text: Εἰσὶν γὰρ πολλοὶ ⸀καὶ ἀνυπότακτοι, ματαιολόγοι καὶ φρεναπάται, μάλιστα οἱ ἐκ ⸀τῆς περιτομῆς,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/010.yaml
  text: For there are many rebellious people[a], empty talkers and deceivers, especially those of the circumcision,
translation:
  language: tl
  text: Sapagkat marami ang mga suwail, mga nagsasalita ng walang kabuluhan at mga manlilinlang, lalo na ang mga mula sa pagtutuli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang mga kabilang sa pangkat ng pagtutuli” o “ang mga kabilang sa pagtutuli.” Malamang na tumutukoy ang parirala sa mga kalabang Hudyo o maka-Hudyong tao, ngunit hindi iyon tahasang tinutukoy sa Griyego.
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag o batayan ng naunang tagubilin at natural na nag-uugnay sa konteksto.
- source_word: πολλοὶ
  choice: marami
  rationale: Tuwirang katumbas ng pang-uring nagsasaad ng dami; ang tinutukoy na mga tao ay malinaw sa kasunod na mga paglalarawan.
- source_word: ἀνυπότακτοι
  choice: mga suwail
  rationale: Ipinahahayag ang pagtangging magpasakop sa wastong awtoridad; maikli, natural, at marangal sa modernong Filipino.
- source_word: ματαιολόγοι
  choice: mga nagsasalita ng walang kabuluhan
  rationale: Pinananatili ang diwa ng mga taong ang sinasabi ay hungkag o walang pakinabang nang hindi gumagamit ng di-natural na tambalang salita.
- source_word: φρεναπάται
  choice: mga manlilinlang
  rationale: Natural na katumbas para sa mga taong nanlilinlang o nagliligaw ng pag-iisip; hindi kailangang gawing lantad sa teksto ang literal na sangkap na 'isip.'
- source_word: μάλιστα
  choice: lalo na
  rationale: Natural na nagpapatingkad sa isang partikular na pangkat sa loob ng mas malaking grupo.
- source_word: οἱ ἐκ τῆς περιτομῆς
  choice: ang mga kabilang sa pagtutuli
  rationale: Malapit sa literal na 'mga mula/kabilang sa pagtutuli' at hindi tahasang nililimitahan ang tinutukoy sa mga Judio o sa isang pormal na partido.
theological_decisions:
- issue: Ang tinutukoy ng οἱ ἐκ τῆς περιτομῆς
  choice: ang mga kabilang sa pagtutuli
  alternative: ang mga kabilang sa pangkat na nagtataguyod ng pagtutuli; ang mga mula sa mga Judio
  rationale: Malamang na tumutukoy ito sa mga kalabang Judio o maka-Judiong guro, ngunit hindi tahasang sinasabi ng Griyego ang 'pangkat' o 'mga Judio.' Pinananatili ng salin ang pagiging di-ganap na tiyak ng parirala.
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “mga suwail” sa halip na mas teknikal na “mga hindi nagpapasakop,” at ipinaliwanag nang bahagya ang tambalang ματαιολόγοι upang maging malinaw sa karaniwang mambabasa. Ang hulíng parirala ay sadyang nananatiling bahagyang di-tiyak gaya ng Griyego.
