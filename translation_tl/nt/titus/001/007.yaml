  text: δεῖ γὰρ τὸν ἐπίσκοπον ἀνέγκλητον εἶναι ὡς θεοῦ οἰκονόμον, μὴ αὐθάδη, μὴ ὀργίλον, μὴ πάροινον, μὴ πλήκτην, μὴ αἰσχροκερδῆ,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/007.yaml
  text: For an overseer must be above reproach as God's steward[a], not self-willed, not quick-tempered, not given to wine, not violent, not greedy for shameful gain[b],
translation:
  language: tl
  text: Sapagkat ang tagapangasiwa[a], bilang katiwala ng Diyos, ay kailangang walang maiparatang sa kanya—hindi mapag-igiit ng sariling kagustuhan, hindi madaling magalit, hindi pala-inom, hindi marahas, at hindi sakim sa kahiya-hiyang pakinabang[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “obispo.” Ang salitang Griyego ay tumutukoy sa isang nangangasiwa; iniiwasan ng “tagapangasiwa” ang pag-aangkat ng mga mas huling kahulugang maaaring ikabit sa titulong “obispo.”
    reason: alternative_reading
  - marker: b
    text: O “sakim sa maruming pakinabang.” Binibigyang-diin ng Griyego ang pakinabang na hinahangad sa paraang kahiya-hiya sa moral na pananaw.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεῖ γὰρ
  choice: Sapagkat ... ay kailangang
  rationale: Pinananatili ang paliwanag na ugnayan sa naunang talata at malinaw na ipinapahayag ang pangangailangan o obligasyon.
- source_word: ἐπίσκοπον
  choice: tagapangasiwa
  rationale: Likas na salin ng tungkuling nangangasiwa at hindi nag-aangkat ng mas huling kahulugang pang-estruktura na maaaring ikabit sa titulong “obispo.”
- source_word: ἀνέγκλητον
  choice: walang maiparatang sa kanya
  rationale: Ipinahihiwatig na walang makatuwirang paratang na maihaharap, nang hindi ipinapalagay ang ganap na kawalang-kasalanan.
- source_word: ὡς θεοῦ οἰκονόμον
  choice: bilang katiwala ng Diyos
  rationale: Pinananatili ang diwa ng pamamahala sa ipinagkatiwala at pananagutan sa Diyos.
- source_word: αὐθάδη
  choice: mapagmatigas sa sariling kagustuhan
  rationale: Sinasaklaw ang pagiging makasariling iginigiit ang sariling gusto at matigas ang kalooban, sa halip na paliitin ito sa kayabangan lamang.
- source_word: ὀργίλον
  choice: madaling magalit
  rationale: Natural na Filipino para sa ugaling mabilis o laging nakahandang magalit, hindi lamang sa isang minsanang pagsiklab.
- source_word: πάροινον
  choice: mahilig sa alak
  rationale: Ipinapahayag ang pagkahilig o pagkababad sa alak nang hindi labis na tinutumbasan ng mas tiyak na “lasinggero.”
- source_word: πλήκτην
  choice: marahas
  rationale: Malinaw at kasalukuyang pananalita para sa taong nananakit o handang manakit.
- source_word: αἰσχροκερδῆ
  choice: sakim sa kahiya-hiyang pakinabang
  rationale: Pinananatili kapwa ang kasakiman at ang moral na kahiya-hiyang uri ng pakinabang; hindi ito nililimitahan sa tahasang pandaraya lamang.
theological_decisions:
- issue: Pagpapakahulugan sa ἐπίσκοπος bilang tungkulin sa iglesya
  choice: tagapangasiwa
  alternative: obispo
  rationale: Ang “tagapangasiwa” ay nagpapakita ng pangunahing diwa ng salitang Griyego nang hindi ipinapasok ang mga mas huling denominasyonal o herarkikal na kahulugan ng “obispo.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang em dash upang natural na ipakilala ang magkakasunod na negatibong katangian habang pinananatili ang daloy ng pangungusap. Ang “walang maiparatang sa kanya” ay mas madaling maunawaan kaysa sa mas teknikal na “di-mapupulaan.”
