  yaml_path: translation/nt/titus/001/006.yaml
  text: if anyone is above reproach[a], the husband of one wife[c][b], having faithful children not under accusation of debauchery or insubordinate.
translation:
  language: tl
  text: Kung ang sinuman ay walang maipipintas, asawang lalaki ng iisang babae[b], at may mga anak na tapat[a] na hindi napaparatangan ng walang pagpipigil na pamumuhay[c] o masuwayin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga anak na sumasampalataya.” Ang salitang Griyego na πιστά ay maaaring mangahulugang “tapat” o “sumasampalataya.”
    reason: alternative_reading
  - marker: b
    text: O, “lalaking tapat sa iisang babae.”
    reason: lexical_alternative
  - marker: c
    text: O, “magulong pamumuhay” o “walang pakundangang pamumuhay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέγκλητος
  choice: walang maipipintas
  rationale: Natural na pananalita para sa taong walang lehitimong maiparatang laban sa kaniya, nang hindi ipinahihiwatig ang ganap na kawalan ng kasalanan.
- source_word: μιᾶς γυναικὸς ἀνήρ
  choice: asawang lalaki ng iisang babae
  rationale: Pinananatili ang malinaw na anyong panlalaki at ang pormal na pagkakabuo ng pariralang Griyego, nang hindi nilulutas ang mga pinagtatalunang implikasyon nito.
- source_word: τέκνα
  choice: mga anak
  rationale: Karaniwan at natural na katumbas sa konteksto ng sambahayan.
- source_word: πιστά
  choice: tapat
  rationale: Pinananatili ang posibleng kahulugang maaasahan o matapat; inilalagay sa talababa ang alternatibong kahulugang sumasampalataya.
- source_word: κατηγορίᾳ
  choice: napaparatangan
  rationale: Napananatili ang diwang pang-akusasyon ng ἐν κατηγορίᾳ sa natural na Filipino.
- source_word: ἀσωτίας
  choice: walang pakundangang pamumuhay
  rationale: Ipinahahayag ang magastos, magulo, at walang pagpipigil na asal sa paraang malinaw sa makabagong mambabasa.
- source_word: ἀνυπότακτα
  choice: masuwayin
  rationale: Natural na salitang Filipino para sa pagtangging magpasakop sa wastong pamamahala o kaayusan.
theological_decisions:
- issue: Kahulugan ng πιστά sa τέκνα ἔχων πιστά
  choice: mga anak na tapat
  alternative: mga anak na sumasampalataya
  rationale: Maaaring tumukoy ang πιστά sa pagiging tapat o maaasahan, o sa pananampalataya. Pinananatili sa talababa ang tunay na ambiguwidad.
- issue: Saklaw ng μιᾶς γυναικὸς ἀνήρ
  choice: asawang lalaki ng iisang babae
  alternative: lalaking tapat sa iisang babae
  rationale: Mas malapit sa anyo ng Griyego ang pangunahing salin at hindi nito ipinapasya kung ang diin ay katayuang marital, katapatan sa asawa, o iba pang pinagtatalunang aplikasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong panlalaki ng pariralang marital at ang mga tunay na ambiguwidad ng πιστά at μιᾶς γυναικὸς ἀνήρ. Ang ayos na “hindi napaparatangan ... at hindi masuwayin” ay ginawang natural sa Filipino habang parehong iniuugnay sa “mga anak.”
