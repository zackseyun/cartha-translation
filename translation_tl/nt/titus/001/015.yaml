source:
  edition: SBLGNT
  text: ⸀πάντα καθαρὰ τοῖς καθαροῖς· τοῖς δὲ μεμιαμμένοις καὶ ἀπίστοις οὐδὲν καθαρόν, ἀλλὰ μεμίανται αὐτῶν καὶ ὁ νοῦς καὶ ἡ συνείδησις.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/015.yaml
  text: All things are pure to the pure; but to those who are defiled and unbelieving[a], nothing is pure. Instead, both their mind and their conscience are defiled.
translation:
  language: tl
  text: Ang lahat ng bagay ay malinis para sa mga malinis; ngunit para sa mga nadungisan at hindi sumasampalataya, walang anumang bagay na malinis.[a] Sa halip, kapuwa ang kanilang pag-iisip at budhi ay nadungisan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griego na isinaling “malinis” sa buong talata ay maaaring tumukoy kapuwa sa ritwal na kalinisan at sa moral na kadalisayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: Ang lahat ng bagay
  rationale: Komprehensibo ang anyong neuter plural. Pinananatili ng “ang lahat ng bagay” ang malawak at kasabihang himig ng unang sugnay.
- source_word: καθαρά / καθαρόν / καθαροῖς
  choice: malinis / mga malinis
  rationale: Maaaring tumukoy ang καθαρός sa ritwal o moral na kalinisan. Ang “malinis” ay likas sa Tagalog at naiiwang bukas ang dalawang diwa.
- source_word: τοῖς δὲ μεμιαμμένοις
  choice: para sa mga nadungisan
  rationale: Ipinahihiwatig ng perfect participle ang kasalukuyang kalagayang bunga ng pagdungis; naipapahayag ito nang natural ng “mga nadungisan.”
- source_word: ἀπίστοις
  choice: hindi sumasampalataya
  rationale: Sa konteksto, ang malinaw na salungatan ay sa tunay na pananampalataya, kaya mas tuwiran ito kaysa “hindi tapat.”
- source_word: οὐδὲν καθαρόν
  choice: walang anumang malinis
  rationale: Pinananatili ang panaguring ayos at ang pag-uulit ng salitang tumutugma sa καθαρά sa unang sugnay.
- source_word: ἀλλὰ
  choice: Sa halip
  rationale: Ipinakikita ang mariing pagsalungat at inililipat ang diin mula sa mga bagay sa panloob na kalagayan ng tao.
- source_word: μεμίανται
  choice: nadungisan
  rationale: Pinananatili ang ugnayang leksikal sa μεμιαμμένοις at ang diwa ng nagresultang kalagayan.
- source_word: νοῦς
  choice: pag-iisip
  rationale: Natural na tumutukoy sa kakayahang umunawa, humatol, at makakita ng kahulugan.
- source_word: συνείδησις
  choice: budhi
  rationale: Karaniwan at malinaw na salin para sa moral na kamalayan at panloob na paghatol.
- source_word: καὶ ... καὶ
  choice: kapuwa ... at
  rationale: Likas na ipinakikita sa Tagalog na parehong apektado ang pag-iisip at budhi.
theological_decisions:
- issue: Saklaw ng pananalita tungkol sa καθαρός
  choice: Isinalin bilang “malinis” sa buong talata, na maaaring tumukoy kapuwa sa ritwal at moral na kalinisan.
  alternative: “dalisay,” na mas malakas ang moral na himig ngunit hindi gaanong likas para sa ritwal na kategorya
  rationale: May kaugnayan ang konteksto sa mga usapin ng ritwal na kalinisan at mga tuntuning Judio, ngunit lumalawak ang pahayag tungo sa panloob na kalagayan ng tao. Hindi dapat paliitin ng salin ang kahulugan sa isa lamang sa mga aspektong ito.
translation_notes:
  register: Modernong Filipino Tagalog na dignipikado ngunit madaling maunawaan. Pinanatili ang maikli at balanseng anyo ng kasabihan, gayundin ang pag-uulit ng “malinis” at “nadungisan.”
