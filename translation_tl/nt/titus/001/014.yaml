  text: not paying attention to Jewish myths and commandments of people who turn away from the truth[a].
translation:
  language: tl
  text: na huwag nilang pagtuunan ng pansin ang mga kuwentong-kathang Judio at ang mga utos ng mga taong tumatalikod sa katotohanan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na hindi sila nagbibigay-pansin sa mga kuwentong-kathang Judio at mga utos ng mga taong tumatalikod sa katotohanan.”
    reason: Ipinakikita ang alternatibong salin ng προσέχοντες nang hindi binabago ang pinakamalapit na pambalarilang pag-uugnay ng ἀποστρεφομένων sa “mga tao.”
lexical_decisions:
- source_word: μὴ προσέχοντες
  choice: na huwag nilang pakinggan
  rationale: Ipinagpapatuloy ng pangkasalukuyang participle ang naunang tagubilin. Ang “pakinggan” ay likas sa modernong Tagalog at dito ay nangangahulugang magbigay-pansin o sumunod, hindi lamang makarinig.
- source_word: Ἰουδαϊκοῖς μύθοις
  choice: mga kuwentong-katha ng mga Judio
  rationale: Ang μῦθος ay tumutukoy sa mga kathang salaysay o alamat. Malinaw sa karaniwang mambabasa ang “kuwentong-katha,” at ipinahahayag ng “ng mga Judio” ang katangiang tinutukoy ng Ἰουδαϊκοῖς nang hindi dinaragdagan ang saklaw nito.
- source_word: ἐντολαῖς ἀνθρώπων
  choice: mga utos ng mga tao
  rationale: Pinananatili nito ang kaibahan ng mga utos na nagmumula lamang sa tao at ng katotohanan, habang iniiwasan ang pananalitang maaaring unawaing tumutukoy lamang sa kalalakihan.
- source_word: ἀποστρεφομένων
  choice: mga taong tumatalikod sa
  rationale: Pinananatili ng “tumatalikod” ang larawang pandiwa ng paglayo o pagtanggi at ang pangkasalukuyang aspekto ng participle.
- source_word: τὴν ἀλήθειαν
  choice: ang katotohanan
  rationale: Ito ang tuwiran at likas na salin; hindi nito labis na tinutukoy kung ano ang saklaw ng “katotohanan” sa talata.
theological_decisions:
- issue: Ang tinutukoy ng genitive participle na ἀποστρεφομένων
  choice: 'Iniuugnay ito sa “mga tao”: “mga utos ng mga taong tumatalikod sa katotohanan.”'
  alternative: Maaaring unawain nang mas maluwag na kapwa ang mga kuwentong-katha at mga utos ay kaugnay ng mga tumatalikod sa katotohanan.
  rationale: Ang pinakamalapit at pinakanatural na ugnayang pambalarila ay sa ἀνθρώπων, na kapwa genitive plural. Pinipili ang pagbasa ring ito nang hindi nagdaragdag ng tiyak na doktrinal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “kuwentong-katha” sa halip na mas lumang “kathang-isip” o “pabula,” at “mga tao” sa halip na “mga lalaki.”
