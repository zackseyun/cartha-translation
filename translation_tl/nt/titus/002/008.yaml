  naturalness: Mas natural at malinaw sa modernong Filipino ang “pananalitang wasto at hindi mapupuna” kaysa “mahusay at di-mapipintas na pananalita.” Ang “sapagkat” ay nagpapakita nang maayos sa batayan ng pagkapahiya nang hindi binabago ang kahulugan ng participial na parirala.
