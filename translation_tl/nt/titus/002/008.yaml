id: TIT.2.8
reference: Titus 2:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: λόγον ὑγιῆ ἀκατάγνωστον, ἵνα ὁ ἐξ ἐναντίας ἐντραπῇ μηδὲν ἔχων ⸂λέγειν περὶ ἡμῶν⸃ φαῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/008.yaml
  text: sound speech that cannot be condemned[a], so that the one who opposes us may be put to shame[c][b], having nothing evil to say about us.
translation:
  language: tl
  text: gumamit ka ng pananalitang wasto at hindi mapupuna,[a] upang mapahiya ang sumasalungat,[b] sapagkat wala siyang masabing masama tungkol sa atin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “malusog na pananalita” o “wastong mensahe.”
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “ang mula sa kabilang panig,” samakatuwid, ang isang kalaban.
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγον
  choice: pananalita
  rationale: Sa konteksto ng pagtuturo at huwarang asal ni Tito, tumutukoy ito sa nilalaman at paraan ng pagsasalita, hindi lamang sa isang salita.
- source_word: ὑγιῆ
  choice: mahusay
  rationale: Ang literal na diwa ay 'malusog,' ngunit sa Filipino ang 'mahusay' ay likas na naglalarawan ng pananalitang tama at kapaki-pakinabang nang hindi nagiging teknikal.
- source_word: ἀκατάγνωστον
  choice: di-mapipintas
  rationale: Ipinahihiwatig nito na walang makatuwirang batayan upang hatulan o punahin ang pananalita.
- source_word: ἵνα
  choice: upang
  rationale: Pinananatili ang layuning ipinakikita ng sugnay.
- source_word: ὁ ἐξ ἐναντίας
  choice: ang sumasalungat
  rationale: Likas na katumbas sa Filipino ng taong nasa kabilang panig o kumakalaban, nang hindi dinaragdagan ang tinutukoy ng pagsalungat.
- source_word: ἐντραπῇ
  choice: mapahiya
  rationale: Pinananatili ang pasibong diwa ng pagkapahiya dahil nabigo ang anumang paratang.
- source_word: μηδὲν ἔχων λέγειν
  choice: dahil wala siyang masasabing
  rationale: Likas na Filipino para sa participial construction na nagsasaad na wala siyang maihaharap na paratang.
- source_word: περὶ ἡμῶν
  choice: tungkol sa atin
  rationale: Tapat na pinananatili ang unang panauhang maramihan nang hindi nililimitahan o pinalalawak ang saklaw nito.
- source_word: φαῦλον
  choice: masama
  rationale: Karaniwan at malinaw na salitang Filipino na taglay ang moral na bigat ng mapanirang o kahiya-hiyang paratang.
theological_decisions:
- issue: Saklaw ng unang panauhang maramihan sa περὶ ἡμῶν
  choice: tungkol sa atin
  alternative: tungkol sa iyo; tungkol sa ating mga Cristiano; tungkol sa ating turo
  rationale: Tahasan ang unang panauhang maramihan sa Griyego. Hindi ito dapat gawing si Tito lamang o palawakin sa buong pamayanang Cristiano nang walang pahiwatig sa teksto.
- issue: Ugnayan ng participle na μηδὲν ἔχων sa pagkapahiya
  choice: dahil wala siyang masasabing masama
  alternative: na walang anumang masamang masasabi
  rationale: Ang 'dahil' ay natural na ipinakikita ang batayan ng pagkapahiya, habang hindi ginagawang hiwalay na utos o pangako ang parirala.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang 'pananalita' upang saklawin ang paraan at nilalaman ng pagsasalita, at ang 'di-mapipintas' upang maipahayag nang maikli ang kawalan ng makatwirang batayan sa paghatol.
