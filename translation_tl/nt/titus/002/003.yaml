base_translation:
  language: en
  yaml_path: translation/nt/titus/002/003.yaml
  text: Older women likewise are to be reverent in behavior[a], not slanderers nor enslaved to much wine, teachers of what is good[b],
translation:
  language: tl
  text: Gayundin, ang matatandang babae ay dapat ay may asal na angkop sa kabanalan. Hindi sila dapat maging mapanirang-puri[a] o naalipin ng labis na alak,[b] kundi mga tagapagturo ng mabuti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga maling tagapagparatang” o “mga tsismosang naninira.” Ang salitang Griyego ay kaugnay ng salitang madalas isaling “Diyablo,” ngunit dito ay tumutukoy sa mga taong naninira ng kapuwa.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “lulong sa maraming alak.” Mas literal na sinasabi ng Griyego na sila ay “naalipin ng maraming alak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρεσβύτιδας
  choice: matatandang babae
  rationale: Tumutukoy ito sa mga babaeng may edad, kaagapay ng pagtukoy sa matatandang lalaki sa naunang talata. Likas at malinaw sa makabagong Tagalog ang “matatandang babae.”
- source_word: ὡσαύτως
  choice: Gayundin
  rationale: Pinananatili nito ang malinaw na ugnayan ng tagubilin sa naunang pangkat.
- source_word: ἐν καταστήματι ἱεροπρεπεῖς
  choice: maging angkop sa kabanalan ang kanilang asal
  rationale: Ipinapahayag nito na ang panlabas na asal o pagkilos ay nararapat sa mga banal na bagay. Iniiwasan nitong tukuyin nang tahasan ang Diyos bilang layon ng pagpipitagan, sapagkat hindi iyon tahasang nakasaad sa Griyego.
- source_word: μὴ διαβόλους
  choice: hindi ... mapanirang-puri
  rationale: Sa listahang etikal na ito, ang διάβολος ay tumutukoy sa taong naninira o nagpaparatang, hindi sa Diyablo bilang isang pantanging katauhan.
- source_word: μηδὲ οἴνῳ πολλῷ δεδουλωμένας
  choice: ni alipin ng maraming alak
  rationale: Pinananatili ng “alipin” ang matinding larawan ng pagkakagapos o pagkontrol ng alak na nasa perfect passive participle na δεδουλωμένας.
- source_word: καλοδιδασκάλους
  choice: mga tagapagturo ng mabuti
  rationale: Nililinaw nito na ang mabuti ang nilalaman ng kanilang itinuturo, hindi lamang na mahusay silang magturo.
theological_decisions:
- issue: Larawan ng pagkaalipin sa paglalarawan ng ugnayan sa alak
  choice: Panatilihin ang “alipin ng maraming alak”
  alternative: “lulong sa maraming alak”
  rationale: Ang Griyego ay gumagamit ng larawan ng pagkaalipin at pagkontrol, kaya hindi ito pinalitan ng mas interpretibong wika tungkol sa pagkalulong.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang dalawang pangungusap upang maging natural ang mahabang serye ng mga panuring sa Griyego, habang pinananatili ang pagkakaugnay ng mga tagubilin.
