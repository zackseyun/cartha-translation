  text: Ταῦτα λάλει καὶ παρακάλει καὶ ἔλεγχε μετὰ πάσης ἐπιταγῆς· μηδείς σου περιφρονείτω.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/015.yaml
  text: Speak these things[a], and exhort and rebuke with all authority. Let no one disregard you.
translation:
  language: tl
  text: Sabihin mo ang mga bagay na ito, at magtagubilin at sumaway nang may buong awtoridad. Huwag kang hamakin ng sinuman.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “maliitin ka” o “ipagwalang-bahala ka.”
    reason: 'Ipinakikita ang leksikal na lawak ng περιφρονέω: hamakin, maliitin, o ituring na hindi dapat pansinin.'
lexical_decisions:
- source_word: Ταῦτα
  choice: ang mga bagay na ito
  rationale: Tumutukoy pabalik sa mga tagubilin sa kabanata nang hindi nililimitahan ang saklaw sa “mga turo” lamang.
- source_word: λάλει
  choice: Sabihin mo
  rationale: Tuwirang ipinahahayag ang patuloy na atas na ipabatid ang mga naunang tagubilin; hindi ito pinakikitid sa mas tiyak na “ituro.”
- source_word: παρακάλει
  choice: magtagubilin
  rationale: Sa kontekstong pastoral, ipinahahayag nito ang seryoso at mapanghikayat na paghimok na may direksiyong moral.
- source_word: ἔλεγχε
  choice: sumaway
  rationale: Ipinahahayag ang paglalantad at pagtutuwid sa mali sa isang natural at dignified na paraang Tagalog.
- source_word: μετὰ πάσης ἐπιταγῆς
  choice: nang may buong awtoridad
  rationale: Pinananatili ang bigat ng ganap na kapangyarihang iniatas para sa pagsasalita, paghimok, at pagsaway, nang hindi ipinahihiwatig na nagsasarili ang awtoridad ni Tito.
- source_word: μηδείς
  choice: ng sinuman
  rationale: Likas na katumbas sa Tagalog sa loob ng negatibong pautos na “Huwag mong hayaang ... ng sinuman.”
- source_word: σου
  choice: ka
  rationale: Likas na anyong layon sa Tagalog para sa taong maaaring hamakin.
- source_word: περιφρονείτω
  choice: hamakin
  rationale: Sinasaklaw ang pagtingin na mababa o walang halaga sa isang tao. Pinananatili sa talababa ang posibleng diin sa pagwawalang-bahala.
theological_decisions:
- issue: Lakas ng ministeryal na katayuan ni Tito sa μετὰ πάσης ἐπιταγῆς
  choice: Inuutusan si Tito na magsalita, magtagubilin, at sumaway nang may buong awtoridad.
  alternative: Magsalita lamang sa mapag-utos na tono, o ituring na ang awtoridad ay sa mensahe lamang at walang kaugnayan sa tungkulin ni Tito.
  rationale: Natural na inilalarawan ng parirala kung paano isasagawa ang magkakaugnay na pautos. Pinananatili ng salin ang bigat ng awtoridad ngunit hindi ito pinalalawak bilang nagsasariling personal na kapangyarihan.
- issue: Ayos ng pagbabawal sa μηδείς σου περιφρονείτω
  choice: Huwag mong hayaang hamakin ka ng sinuman.
  alternative: Huwag kang hamakin ng sinuman.
  rationale: Ang unang anyo ay mas natural na pautos sa modernong Tagalog at ipinahihiwatig na hindi dapat payagan ni Tito na maliitin siya, nang hindi sinasabi kung anong partikular na hakbang ang dapat niyang gawin.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “magtagubilin” upang pagsamahin ang mapanghikayat at mapag-atas na puwersa ng παρακαλέω; ang “buong awtoridad” ay karaniwan at malinaw sa kasalukuyang gamit. Ang marker na [a] ay inilagay kaagad pagkatapos ng sugnay na tinutukoy nito.
