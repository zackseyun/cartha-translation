base_translation:
  language: en
  yaml_path: translation/nt/titus/002/009.yaml
  text: Servants are to submit to their own masters in everything[a], to be pleasing, not argumentative[b],
translation:
  language: tl
  text: Ang mga alipin[a] ay dapat magpasakop sa sarili nilang mga amo sa lahat ng bagay, maging kalugud-lugod, at huwag sumalungat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga lingkod” o “mga aliping lingkod.” Maaaring tumukoy ang Griyegong doulous sa mga naglilingkod, ngunit malamang na pagkaalipin ang tinutukoy rito.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “huwag makipagtalo” o “huwag sumagot nang pabalang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Δούλους
  choice: mga alipin
  rationale: Sa kontekstong ito, ang δοῦλος ay tumutukoy sa mga taong nasa kalagayang legal at panlipunan ng pagkaalipin sa ilalim ng mga δεσπόταις. Pinananatili ng “mga alipin” ang mabigat na realidad ng teksto at hindi ito pinalalambot bilang simpleng paglilingkod.
- source_word: ἰδίοις δεσπόταις
  choice: sarili nilang mga amo
  rationale: Ang δεσπότης ay taong may pagmamay-ari o ganap na awtoridad sa sambahayang ito. Ang “amo” ang pinakanatural na salitang Filipino sa ugnayang amo at alipin, at isinasalin ng “sarili nilang” ang ἰδίοις.
- source_word: ὑποτάσσεσθαι
  choice: ay dapat magpasakop
  rationale: Ipinahahayag ng infinitibong ito ang inaasahang kusang paglalagay ng sarili sa ilalim ng awtoridad. Ang “dapat magpasakop” ay natural na naghahatid ng mapagtagubilin o paraenetikong puwersa.
- source_word: ἐν πᾶσιν
  choice: sa lahat ng bagay
  rationale: Pinananatili nito ang malawak at hindi nililimitahang pananalita ng Griyego nang hindi nagdaragdag ng paliwanag na wala sa talata.
- source_word: εὐαρέστους εἶναι
  choice: maging kalugud-lugod
  rationale: Ang εὐάρεστος ay nangangahulugang nakalulugod o katanggap-tanggap. Ang “maging kalugud-lugod” ay marangal at malinaw, at pinananatili ang serye ng mga infinitibong tagubilin.
- source_word: μὴ ἀντιλέγοντας
  choice: huwag sumagot nang pabalang
  rationale: Sa ugnayang amo at alipin, ang ἀντιλέγω ay malamang na tumutukoy sa pagsagot laban, pagsalungat sa salita, o pakikipagtalo. Natural na ipinahahayag ng pariralang ito ang gayong asal sa Filipino, habang inilalahad sa talababa ang iba pang posibleng salin.
theological_decisions:
- issue: Paglalarawan sa δοῦλος sa konteksto ng sambahayan
  choice: mga alipin
  alternative: mga lingkod; mga aliping lingkod
  rationale: Maliwanag sa pagbanggit sa δεσπόταις na ang tinutukoy ay mga taong nasa aktuwal na pagkaalipin, hindi lamang mga kusang tagapaglingkod. Inilalarawan ng salin ang sinaunang kalagayang panlipunan; hindi nito ipinahihiwatig na sinasang-ayunan ng talata o ng salin ang institusyon ng pang-aalipin.
- issue: Lawak ng ἐν πᾶσιν
  choice: sa lahat ng bagay
  alternative: sa bawat bagay; sa lahat ng paraan
  rationale: Pinananatili ang komprehensibong pananalita at ang tensiyong likas sa teksto sa halip na magdagdag ng mga eksepsiyong hindi tahasang binanggit sa talatang ito.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “amo” bilang karaniwang tawag sa may awtoridad sa isang alipin, at ang “sumagot nang pabalang” bilang natural na paglalarawan ng pasalitang pagsalungat. Inilipat ang panandang [a] kasunod ng “mga alipin” upang malinaw na tumukoy ang talababa sa salitang isinasalin nito.
