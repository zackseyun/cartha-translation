  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὃς ἔδωκεν ἑαυτὸν ὑπὲρ ἡμῶν ἵνα λυτρώσηται ἡμᾶς ἀπὸ πάσης ἀνομίας καὶ καθαρίσῃ ἑαυτῷ λαὸν περιούσιον, ζηλωτὴν καλῶν ἔργων.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/014.yaml
  text: who gave himself for us[a], so that he might redeem us from all lawlessness and purify for himself a people for his own possession, zealous for good works.
translation:
  language: tl
  text: na ibinigay ang kanyang sarili para sa atin, upang tubusin tayo mula sa lahat ng paglabag sa kautusan at linisin para sa kanyang sarili ang isang bayang natatanging pag-aari niya[a], na masigasig sa mabubuting gawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang bayang mahalagang pag-aari niya” o “isang natatanging bayan.” Ipinahihiwatig ng Griyego ang isang bayang natatanging nabibilang sa kanya, gaya ng pananalitang ginagamit tungkol sa bayan ng tipan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκεν ἑαυτὸν
  choice: ibinigay ang kanyang sarili
  rationale: Pinananatili nito ang kusang-loob na pagbibigay ng sarili at ang reflexive na diwa ng Griyego nang hindi nagdaragdag ng paliwanag.
- source_word: ὑπὲρ ἡμῶν
  choice: para sa atin
  rationale: Likas at malawak ang parirala sa Filipino; naipahahayag nito ang pagkilos alang-alang sa atin nang hindi nililimitahan sa iisang paliwanag tungkol sa pagtubos.
- source_word: ἵνα λυτρώσηται
  choice: upang tubusin tayo
  rationale: Ang “tubusin” ay malinaw na salitang Filipino na nagpapanatili sa diwa ng pagpapalaya at sa teolohikal na alingawngaw ng λύτρον/λυτρόομαι.
- source_word: ἀπὸ πάσης ἀνομίας
  choice: mula sa lahat ng pagsuway sa kautusan
  rationale: Mas tiyak ito kaysa sa pangkalahatang “kasamaan” at ipinahahayag ang diwa ng ἀνομία bilang kawalan o pagsuway sa batas, habang natural pa rin sa modernong Filipino.
- source_word: καθαρίσῃ
  choice: linisin
  rationale: Karaniwang salita itong nauunawaan kapwa sa moral at ritwal-tipang diwa ng καθαρίζω.
- source_word: ἑαυτῷ
  choice: para sa kanyang sarili
  rationale: Malinaw nitong ipinahahayag na ang nilinis na bayan ay inilaan at nabibilang sa kanya.
- source_word: λαὸν περιούσιον
  choice: isang bayang tanging kanya
  rationale: Natural itong Filipino at pinananatili ang diwa ng natatanging pag-aari at pagkapabilang sa Diyos na kaakibat ng wikang tipan.
- source_word: ζηλωτὴν καλῶν ἔργων
  choice: na masigasig sa mabubuting gawa
  rationale: Ang “masigasig” ay malinaw na nagpapahayag ng sabik at matapat na pagtatalaga sa paggawa ng mabuti.
theological_decisions:
- issue: Lakas ng ὑπὲρ ἡμῶν sa pagbibigay ni Cristo ng sarili
  choice: para sa atin
  alternative: alang-alang sa atin; bilang kahalili natin
  rationale: Maaaring magtaglay ang parirala ng diwang kapakinabangan at, ayon sa konteksto, pagkahalili. Pinananatili ng “para sa atin” ang lawak nito nang hindi ipinapasya sa salin ang isang partikular na modelo ng pagtubos.
- issue: Tipang diwa ng λαὸν περιούσιον
  choice: isang bayang tanging kanya
  alternative: isang bayang mahalagang pag-aari niya; isang natatanging bayan
  rationale: Pinananatili nito ang diin sa natatanging pag-aari at pagkapabilang sa kanya, pati ang alingawngaw ng pananalita sa Lumang Tipan, nang hindi ginagawang malabo lamang na “espesyal.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bayan” para sa λαός upang mapanatili ang kolektibo at tipang diwa; iniwasan ang sobrang teknikal o denominasyonal na pananalita.
