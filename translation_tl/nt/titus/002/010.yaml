  text: μὴ νοσφιζομένους, ἀλλὰ ⸂πᾶσαν πίστιν⸃ ἐνδεικνυμένους ἀγαθήν, ἵνα τὴν διδασκαλίαν ⸀τὴν τοῦ σωτῆρος ἡμῶν θεοῦ κοσμῶσιν ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/010.yaml
  text: not pilfering[a], but showing all good faith, so that in everything they may adorn the teaching of God our Savior.
translation:
  language: tl
  text: hindi kumukupit, kundi nagpapakita ng lubos na katapatan, upang sa lahat ng bagay ay maging kaakit-akit dahil sa kanila ang turo ng Diyos na ating Tagapagligtas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νοσφιζομένους
  choice: kumukupit
  rationale: Sa konteksto ng mga alipin at kanilang mga amo, tumutukoy ito sa palihim na pagkuha para sa sarili ng pag-aari ng iba. Likas at tiyak sa modernong Tagalog ang “kumukupit.”
- source_word: πᾶσαν πίστιν ἐνδεικνυμένους ἀγαθήν
  choice: nagpapakita ng lubos na katapatan
  rationale: Dito, ang πίστις ay tumutukoy sa pagiging tapat at mapagkakatiwalaan sa asal; ipinahahayag ng “lubos” ang saklaw ng πᾶσαν, habang ang positibong kalidad ng ἀγαθήν ay likas nang nahahayag sa “katapatan.”
- source_word: κοσμῶσιν
  choice: maging kaakit-akit dahil sa kanila
  rationale: Pinananatili nito ang diwa ng pagpapaganda o pag-aadorno, ngunit iniiwasan ang alanganing literal na pariralang “adornohan ang turo” sa Tagalog. Nililinaw rin na ang kanilang asal ang dahilan kung bakit nagiging kaakit-akit ang turo.
- source_word: διδασκαλίαν
  choice: turo
  rationale: Ang “turo” ay malinaw, natural, at madaling maunawaan sa modernong Tagalog, samantalang ang “doktrina” ay mas teknikal.
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: tungkol sa Diyos na ating Tagapagligtas
  rationale: Sa konstruksyon ng pangungusap sa Tagalog, nililinaw ng “tungkol sa” na ang turo ay nauukol sa Diyos. Tapat na pinananatili ang titulo na “Diyos na ating Tagapagligtas” nang hindi nagdaragdag ng referent na hindi tahasang binanggit.
- source_word: ἐν πᾶσιν
  choice: sa lahat ng bagay
  rationale: Natural nitong ipinahahayag ang malawak na saklaw ng kanilang asal.
theological_decisions:
- issue: Kahulugan ng πίστις sa kontekstong etikal
  choice: katapatan
  alternative: pananampalataya; pagiging mapagkakatiwalaan
  rationale: Bagaman madalas mangahulugan ng “pananampalataya” ang πίστις, sa utos sa mga alipin na huwag kumupit at magpakita ng maaasahang asal, malinaw na nangingibabaw ang kahulugang katapatan. Ang literal na “lahat ng mabuting pananampalataya” ay hindi natural at maaaring magbigay ng maling diwa sa Tagalog.
- issue: Referent ng “Diyos na ating Tagapagligtas”
  choice: Pinanatiling tuwirang tumutukoy sa Diyos
  alternative: Basahin sa mas malawak na gamit ng titulong “Tagapagligtas” para kay Cristo sa mga Liham Pastoral
  rationale: Ang mismong sugnay ay tahasang nagsasabing Diyos ang ating Tagapagligtas; hindi dapat ipasok sa salin ang isang mas tiyak na kristolohikal na referent na wala sa talatang ito.
- issue: Metapora ng κοσμῶσιν
  choice: maging kaakit-akit dahil sa kanila ang turo
  alternative: adornohan nila ang turo; parangalan nila ang turo
  rationale: Pinananatili ang metapora ng pagpapaganda sa natural na Tagalog. Hindi nito ipinahihiwatig na kulang ang katotohanan ng turo, kundi na ang mabuting asal ay nagpapakita ng kagandahan nito sa mga nakakakita.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “kumukupit” bilang tiyak at karaniwang salita sa palihim na pagkuha ng pag-aari ng amo, at “katapatan” upang natural na ihayag ang kontekstuwal na etikal na diwa ng πίστις.
