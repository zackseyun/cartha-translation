source:
  edition: SBLGNT
  text: πρεσβύτας νηφαλίους εἶναι, σεμνούς, σώφρονας, ὑγιαίνοντας τῇ πίστει, τῇ ἀγάπῃ, τῇ ὑπομονῇ.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/002.yaml
  text: Older men are to be temperate[a], dignified, self-controlled, sound in faith, in love, and in steadfastness.
translation:
  language: tl
  text: Ang matatandang lalaki ay dapat maging matino, kagalang-galang, may pagpipigil sa sarili, at matatag sa pananampalataya[a], sa pag-ibig, at sa pagtitiis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “katapatan.” Maaaring mangahulugan ang salitang Griego na πίστις ng “pananampalataya” o “katapatan,” depende sa konteksto.
    reason: alternative_reading
lexical_decisions:
- source_word: πρεσβύτας
  choice: matatandang lalaki
  rationale: Sa konteksto ng mga tagubilin ayon sa edad, tumutukoy ito sa mga lalaking may edad, hindi sa katungkulan ng mga elder sa iglesya.
- source_word: νηφαλίους
  choice: mahinahon
  rationale: Saklaw ng salita ang pagiging hindi lasing at, sa mas malawak na diwa, ang mahinahong pagpipigil at malinaw na pag-iisip. Ang “mahinahon” ay likas sa modernong Tagalog at hindi nililimitahan ang utos sa alak lamang.
- source_word: σεμνούς
  choice: kagalang-galang
  rationale: Ipinahihiwatig nito ang marangal at seryosong asal na karapat-dapat igalang, hindi lamang ang pagiging malungkutin o istrikto.
- source_word: σώφρονας
  choice: may pagpipigil sa sarili
  rationale: Malinaw nitong ipinapahayag ang disiplinadong paghatol at pagkontrol sa sariling kilos at pagnanasa.
- source_word: ὑγιαίνοντας
  choice: matibay
  rationale: Literal itong tumutukoy sa pagiging malusog o walang kapintasan. Sa kasamang mga birtud, ang “matibay” ay natural na Tagalog na nagpapanatili sa diwa ng kalakasan at katatagan.
- source_word: τῇ πίστει
  choice: sa pananampalataya
  rationale: Maaaring mangahulugan ang πίστις ng pananampalataya o katapatan. Pinili sa pangunahing teksto ang karaniwang “pananampalataya,” habang inilalahad sa talababa ang tunay na alternatibo.
- source_word: τῇ ἀγάπῃ
  choice: sa pag-ibig
  rationale: Karaniwan at tuwirang salin ito ng ἀγάπη at akma sa magkakatulad na pariralang pinamamahalaan ng ὑγιαίνοντας.
- source_word: τῇ ὑπομονῇ
  choice: sa pagtitiis
  rationale: Tumutukoy ang ὑπομονή sa matatag at matiyagang pananatili sa gitna ng hirap; malinaw at likas sa Tagalog ang “pagtitiis” sa ganitong talaan ng mga birtud.
- source_word: εἶναι
  choice: ay dapat maging
  rationale: Nakasalalay ang infinitive sa tagubilin mula sa naunang talata; ipinahahayag ng “dapat maging” ang puwersa ng utos sa natural na Tagalog.
theological_decisions:
- issue: Kahulugan ng πίστις sa talaan ng mga birtud
  choice: pananampalataya
  alternative: katapatan
  rationale: Kapuwa posible sa konteksto ang pagtitiwala/pananampalataya at ang pagiging tapat. Hindi tiyak na nilulutas ng talata ang pagkakaibang ito, kaya nasa pangunahing teksto ang karaniwang salin at nasa talababa ang alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang maikli at magkakatulad na ayos ng talaan ng mga katangian; iniwasan ang teknikal o denominasyonal na pananalita.
