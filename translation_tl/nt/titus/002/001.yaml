  yaml_path: translation/nt/titus/002/001.yaml
  text: But as for you[a], speak the things that are fitting for sound teaching.
translation:
  language: tl
  text: Ngunit ikaw, sabihin mo ang mga bagay na angkop sa wastong turo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “wastong doktrina.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Σὺ δὲ
  choice: Ngunit ikaw
  rationale: Ang tahasang panghalip na Σὺ kasama ng δὲ ay nagbibigay-diin sa paghahambing kay Tito at sa mga naunang binanggit; likas na naipapahayag ito sa Tagalog sa “Ngunit ikaw.”
- source_word: λάλει
  choice: sabihin mo
  rationale: Ang προστακτικό na λάλει ay malawak na utos na magsalita o magsabi. Pinananatili ng “sabihin mo” ang pandiwang diwa nang hindi ito nililimitahan sa pormal na pagtuturo lamang.
- source_word: ἃ
  choice: ang mga bagay na
  rationale: Ang panghalip na ουδέτερο πληθυντικό ay tumutukoy sa nilalaman ng dapat sabihin; pinananatili ng salin ang maramihang anyo.
- source_word: πρέπει
  choice: angkop sa
  rationale: Ipinapahayag ng πρέπω ang pagiging nararapat o naaayon. Ang “angkop sa” ay natural at malinaw sa modernong Tagalog.
- source_word: ὑγιαινούσῃ
  choice: wastong
  rationale: Metaporikal itong tumutukoy sa pagiging malusog, maayos, o walang kapintasan ng turo. Ang “wasto” ay idiomatiko sa Tagalog at malinaw na naghahatid ng diwa ng doktrinal na kalusugan.
- source_word: διδασκαλίᾳ
  choice: turo
  rationale: Maaaring tumukoy ang διδασκαλία sa gawain o nilalaman ng pagtuturo. Ang “turo” ay likas at madaling maunawaan, habang hindi nito isinasara ang alinmang diwa.
theological_decisions:
- issue: Pagpapakahulugan sa τῇ ὑγιαινούσῃ διδασκαλίᾳ
  choice: wastong turo
  alternative: malusog na turo; wastong doktrina
  rationale: Ang “wastong turo” ay naghahatid ng metaporikal na diwa ng doktrinal na kalusugan sa natural na Tagalog nang hindi gumagamit ng mas teknikal na “doktrina.” Inilalagay sa talababa ang alternatibong “wastong doktrina” upang mapanatili ang leksikal na lawak.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “Ngunit ikaw” upang mapanatili ang kontrastibong diin, at “wastong turo” bilang natural na katumbas ng metaporang Griyego.
