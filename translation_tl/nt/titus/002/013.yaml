  text: προσδεχόμενοι τὴν μακαρίαν ἐλπίδα καὶ ἐπιφάνειαν τῆς δόξης τοῦ μεγάλου θεοῦ καὶ σωτῆρος ἡμῶν ⸂Ἰησοῦ Χριστοῦ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/013.yaml
  text: as we await the blessed hope and the appearing of the glory of our great God and Savior[a], Jesus the Messiah,
translation:
  language: tl
  text: habang hinihintay natin ang pinagpalang pag-asa at ang pagpapakita ng kaluwalhatian ng ating dakilang Diyos at Tagapagligtas[a], si Jesus na Mesiyas,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, bagaman hindi gaanong malamang, “ang kaluwalhatian ng dakilang Diyos at ng ating Tagapagligtas na si Jesus na Mesiyas,” kung ituturing na dalawang magkaibang tinutukoy ang “Diyos” at “Tagapagligtas,” sa halip na iisang tinutukoy na si Jesus.
    reason: alternative_reading
lexical_decisions:
- source_word: προσδεχόμενοι
  choice: habang hinihintay natin
  rationale: Ipinagpapatuloy ng pandiwaring ito ang diwa ng naunang talata at nagpapahiwatig ng patuloy at sabik na paghihintay.
- source_word: τὴν μακαρίαν ἐλπίδα
  choice: ang pinagpalang pag-asa
  rationale: Likas at marangal itong parirala sa modernong Tagalog at pinananatili ang eskatolohikal na diwa ng pag-asang tiyak na inaasahan.
- source_word: ἐπιφάνειαν
  choice: pagpapakita
  rationale: Malinaw itong tumutukoy sa hayag at nakikitang pagpapakita, nang hindi gumagamit ng teknikal na salitang hiram.
- source_word: δόξης
  choice: kaluwalhatian
  rationale: Karaniwan at tuwirang katumbas ito na nagpapanatili sa kayariang 'pagpapakita ng kaluwalhatian.'
- source_word: τοῦ μεγάλου θεοῦ καὶ σωτῆρος ἡμῶν
  choice: ng ating dakilang Diyos at Tagapagligtas
  rationale: 'Pinananatili ng iisang pariralang ito ang pinaka­natural na pagbasa sa Griyego: iisang tinutukoy ng ''Diyos'' at ''Tagapagligtas.'''
- source_word: Ἰησοῦ Χριστοῦ
  choice: si Jesus na Mesiyas
  rationale: Isinasalin ang Χριστός bilang titulong 'Mesiyas' at ginagamit ang likas na anyong Tagalog para sa pagpapakilala sa pangalan.
theological_decisions:
- issue: Kung ang 'ating dakilang Diyos at Tagapagligtas' ay tumutukoy sa iisang persona, si Jesus, o sa dalawang persona, ang Diyos at si Jesus
  choice: 'Iisang persona: kinikilala si Jesus na Mesiyas bilang ating dakilang Diyos at Tagapagligtas.'
  alternative: 'Dalawang persona: ''ang dakilang Diyos at ang ating Tagapagligtas na si Jesus na Mesiyas.'''
  rationale: May iisang pantukoy sa Griyego para sa dalawang pangngalang pantukoy sa persona, at sinusundan ang mga ito ng 'Jesus na Mesiyas'; kaya pinaka­natural na iisang persona ang tinutukoy. Gayunman, inilalahad sa talababa ang mas di-malamang na alternatibo upang hindi ikubli ang usaping panggramatika at teolohiya.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “habang hinihintay natin” upang umugnay nang natural sa naunang pangungusap, at “si Jesus na Mesiyas” upang malinaw na ipakita ang aposisyon at ang tungkulin ng Χριστός bilang titulo.
