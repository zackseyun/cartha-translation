  yaml_path: translation/nt/titus/002/011.yaml
  text: For the grace of God has appeared[b][a], bringing salvation to all people.
translation:
  language: tl
  text: Sapagkat nahayag na ang biyaya ng Diyos, na nagdadala ng kaligtasan sa lahat ng tao.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “nahayag na, na nagliligtas sa lahat ng tao” o “nahayag na sa lahat ng tao.” Maaaring bahagyang magkaiba ang pag-uugnay sa Griyego ng salitang nangangahulugang “mapagligtas” at ng pariralang “lahat ng tao.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “tao” rito ay pangkalahatang tumutukoy sa sangkatauhan, hindi lamang sa mga lalaki.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπεφάνη
  choice: nahayag na
  rationale: 'Ang aorist na ἐπεφάνη ay intransitibo rito: lumitaw o naging hayag. Ang “nahayag na” ay likas sa Tagalog at ipinakikitang naganap na ang paghahayag nang hindi dinaragdagan ang diwa.'
- source_word: γὰρ
  choice: Sapagkat
  rationale: Nagbibigay ang γάρ ng batayan o paliwanag sa naunang pangangaral; malinaw itong naipahahayag ng “Sapagkat.”
- source_word: ἡ χάρις τοῦ θεοῦ
  choice: ang biyaya ng Diyos
  rationale: Pinananatili ng “biyaya” ang malawak na diwa ng χάρις bilang kagandahang-loob at mapagligtas na pagkilos ng Diyos. Ang “ng Diyos” ay tuwirang katumbas ng genitive.
- source_word: σωτήριος
  choice: na nagdadala ng kaligtasan
  rationale: Ang pang-uring σωτήριος ay tumutukoy sa biyayang mapagligtas o nagdudulot ng kaligtasan. Ang pariralang ito ay natural sa Tagalog at hindi nagpapasok ng dagdag na teolohikal na paliwanag.
- source_word: πᾶσιν ἀνθρώποις
  choice: sa lahat ng tao
  rationale: Ang ἀνθρώποις ay pangkalahatang tumutukoy sa sangkatauhan, hindi lamang sa mga lalaki. Pinananatili ng “lahat ng tao” ang lawak ng Griyego, habang ang “sa” ay maaaring tumugma sa ugnayang direksiyon, pakinabang, o pagtukoy sa konteksto.
theological_decisions:
- issue: Saklaw ng πᾶσιν ἀνθρώποις kaugnay ng kaligtasan
  choice: sa lahat ng tao
  alternative: para sa lahat ng tao; sa lahat ng uri ng tao
  rationale: Pinananatili ng salin ang pangkalahatang saklaw ng pahayag nang hindi nagpapasiya kung bawat indibidwal ang tinutukoy o ang lahat ng uri at pangkat ng tao. Hindi rin nito ipinapasok ang isang partikular na sistemang soteriolohikal.
- issue: Ugnayan ng σωτήριος at πᾶσιν ἀνθρώποις
  choice: na nagdadala ng kaligtasan sa lahat ng tao
  alternative: na nagliligtas sa lahat ng tao; nahayag sa lahat ng tao
  rationale: Maaaring bahagyang magkaiba ang pag-uugnay sa pang-uri at sa pariralang datibo. Ang pangunahing salin ay natural at malapit sa gramatika, samantalang inilalahad sa talababa ang tunay na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pamilyar na terminong “biyaya” at iniwasan ang teknikal na “salbipiko.” Ang pagkakasunod ng mga salita ay natural sa Tagalog habang pinananatili ang diin sa paghayag ng biyaya ng Diyos at ang malawak na saklaw ng pahayag.
