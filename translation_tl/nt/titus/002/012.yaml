id: TIT.2.12
reference: Titus 2:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: παιδεύουσα ἡμᾶς, ἵνα ἀρνησάμενοι τὴν ἀσέβειαν καὶ τὰς κοσμικὰς ἐπιθυμίας σωφρόνως καὶ δικαίως καὶ εὐσεβῶς ζήσωμεν ἐν τῷ νῦν αἰῶνι,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/012.yaml
  text: training us[a], so that, having renounced ungodliness and worldly desires, we might live self-controlled, righteous, and godly lives in the present age[c][b],
translation:
  language: tl
  text: Sinasanay tayo nito[a] upang, matapos nating talikuran ang kawalan ng paggalang sa Diyos at ang mga makamundong pagnanasa[b], mamuhay tayo nang may pagpipigil sa sarili, nang matuwid, at nang may debosyon sa Diyos[c] sa kasalukuyang kapanahunan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tinuturuan tayo nito” o “dinidisiplina tayo nito.” Saklaw ng salitang Griyego ang pagtuturong humuhubog sa pagkatao at asal.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga makamundong pita.”
    reason: lexical_alternative
  - marker: c
    text: Tatlong pang-abay ang nasa Griyego; inilalarawan ng mga ito ang pamumuhay na may pagpipigil sa sarili, nang matuwid, at may debosyon sa Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδεύουσα
  choice: Sinasanay tayo nito
  rationale: Ipinahihiwatig ng pandiwa ang patuloy na paghubog sa pamamagitan ng pagtuturo at pagdidisiplina. Ang “sinasanay” ay natural sa Filipino at nasasaklaw ang dalawang diwang ito; ang “nito” ay tumutukoy sa biyaya na paksa sa naunang talata.
- source_word: ἵνα
  choice: upang
  rationale: Malinaw na ipinapahayag ang layunin o bungang nilalayon ng pagsasanay.
- source_word: ἀρνησάμενοι
  choice: matapos nating talikuran
  rationale: Pinananatili ang aspektong nauuna ang tiyak na pagtakwil bago ilarawan ang bagong paraan ng pamumuhay.
- source_word: τὴν ἀσέβειαν
  choice: ang kawalan ng paggalang sa Diyos
  rationale: Tuwirang ipinapakita ang relihiyoso at moral na diwa ng pamumuhay na walang wastong pagpipitagan sa Diyos; mas malinaw ito sa karaniwang mambabasa kaysa “kalapastanganan” o “di-makadiyos na pamumuhay.”
- source_word: τὰς κοσμικὰς ἐπιθυμίας
  choice: ang mga makamundong pagnanasa
  rationale: Ipinahihiwatig ang mga pagnanasang hinuhubog ng kaayusan ng sanlibutan, nang hindi nililimitahan ang mga ito sa seksuwal o labis na matinding pagnanasa.
- source_word: σωφρόνως
  choice: nang may pagpipigil sa sarili
  rationale: Pinananatili ang mahalagang tema sa Tito ng mahinahon, disiplinado, at wastong pamamahala sa sarili.
- source_word: δικαίως
  choice: nang matuwid
  rationale: Likas na paraang pang-abay sa Filipino na nagsasaad ng pamumuhay ayon sa tama at makatarungan.
- source_word: εὐσεβῶς
  choice: nang may debosyon sa Diyos
  rationale: Ipinakikita ang pamumuhay na nakatuon sa Diyos at may pagpipitagan sa kanya. Iniiwasan nitong gawing malabo ang kahulugan sa pamamagitan lamang ng “maka-Diyos.”
- source_word: ζήσωμεν
  choice: mamuhay tayo
  rationale: Sa sugnay na pinangungunahan ng “upang,” natural na naipapahayag nito ang nilalayong paraan ng pamumuhay nang hindi ito ginagawang hiwalay na utos.
- source_word: ἐν τῷ νῦν αἰῶνι
  choice: sa kasalukuyang kapanahunan
  rationale: Pinananatili ang eskatolohikal na diwa ng αἰών bilang kasalukuyang panahon o kaayusan na ikinukumpara sa panahong darating.
theological_decisions:
- issue: Ang tatlong pang-abay na σωφρόνως καὶ δικαίως καὶ εὐσεβῶς
  choice: “nang may pagpipigil sa sarili, nang matuwid, at nang may debosyon sa Diyos”
  alternative: “may pagpipigil sa sarili, matuwid, at maka-Diyos na pamumuhay”
  rationale: Ang piniling anyo ay nagpapanatili sa tatlong salitang Griyego bilang magkakahiwalay na pang-abay na kapuwa naglalarawan kung paano dapat mamuhay, habang nananatiling natural sa Filipino.
- issue: Ang ugnayan ng ἀρνησάμενοι sa ζήσωμεν
  choice: “matapos nating talikuran … mamuhay tayo”
  alternative: “talikuran natin … at mamuhay tayo”
  rationale: Ipinakikita ng aorist participle ang pagtakwil bilang lohikal na nauuna sa naiibang pamumuhay. Gayunman, hindi nito ipinahihiwatig na minsanan lamang at hindi na kailangang panindigan ang pagtakwil.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “kawalan ng paggalang sa Diyos” at “debosyon sa Diyos” upang maging lantad ang magkasalungat na ugnayan ng ἀσέβεια at εὐσέβεια. Ang “kasalukuyang kapanahunan” ay bahagyang pormal ngunit madaling maunawaan at nagpapanatili sa diwa ng αἰών.
