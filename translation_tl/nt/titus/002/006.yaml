translation:
  language: tl
  text: Gayundin, himukin mo ang mga nakababatang lalaki[a] na magkaroon ng pagpipigil sa sarili.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kabataang lalaki.” Tiyak na tumutukoy ang Griyego sa mga lalaking mas bata, hindi sa lahat ng kabataan.
    reason: lexical_alternative
  - marker: b
    text: O “maging matino sa pag-iisip” o “maging mahinahon sa pag-iisip.” Binibigyang-diin ng Griyego ang matinong pagpapasiya at disiplinadong pagpipigil sa sarili.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοὺς νεωτέρους
  choice: ang mga nakababatang lalaki
  rationale: Ang artikulong may pang-uri sa accusative masculine plural ay tumutukoy sa mga lalaking mas bata, kaayon ng pagkakasunod-sunod ng mga pangkat ayon sa edad at kasarian sa konteksto. Pinananatili ng salin ang tiyak na panlalaking pagtukoy.
- source_word: ὡσαύτως
  choice: Gayundin
  rationale: Likas at maikli itong nag-uugnay sa tagubiling ito sa mga naunang kahalintulad na tagubilin.
- source_word: παρακάλει
  choice: hikayatin mo
  rationale: Ipinahahayag nito ang patuloy na paghimok o masidhing paghihikayat kay Tito nang hindi gumagamit ng salitang masyadong teknikal o makaluma.
- source_word: σωφρονεῖν
  choice: na magpigil sa sarili
  rationale: Malinaw nitong ipinahahayag sa makabagong Tagalog ang matinong pagpapasiya at disiplinadong pagpipigil na saklaw ng pandiwa sa kontekstong ito.
theological_decisions:
- issue: Saklaw ng kasarian sa νεωτέρους
  choice: tiyak na tumutukoy sa mga nakababatang lalaki
  alternative: mga nakababata sa pangkalahatan
  rationale: Masculine plural ang anyong Griyego, at ang agarang konteksto ay sunod-sunod na tumutukoy sa magkakaibang pangkat ayon sa edad at kasarian. Kaya hindi ginawang gender-neutral ang salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nakababatang lalaki” upang mapanatili ang paghahambing sa edad, at “magpigil sa sarili” bilang likas na pagpapahayag ng σωφρονεῖν.
