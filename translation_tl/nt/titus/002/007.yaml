  text: περὶ πάντα σεαυτὸν παρεχόμενος τύπον καλῶν ἔργων, ἐν τῇ διδασκαλίᾳ ⸀ἀφθορίαν, ⸀σεμνότητα,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/007.yaml
  text: in every way presenting yourself as an example of good works[a]; in your teaching, purity, dignity[e][d][c][b],
translation:
  language: tl
  text: Sa lahat ng bagay[a], ipakita mong ikaw ay huwaran[b] ng mabubuting gawa. Sa iyong pagtuturo[c], magpakita ka ng kawalang-katiwalian[d] at dignidad[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “sa lahat ng paraan” o “hinggil sa lahat ng bagay.” Dito, malamang na tumutukoy ito sa kabuuan ng asal ni Tito.
    reason: lexical_alternative
  - marker: b
    text: O “halimbawa” o “modelo.”
    reason: lexical_alternative
  - marker: c
    text: O “sa pagtuturo” o “sa doktrina.”
    reason: lexical_alternative
  - marker: d
    text: O “kadalisayan” o “integridad.” Ang salitang Griyego ay nagpapahiwatig ng pagiging malaya sa kabulukan o katiwalian.
    reason: lexical_alternative
  - marker: e
    text: O “marangal na kaseryosohan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ πάντα
  choice: Sa lahat ng bagay
  rationale: Ipinahahayag ng parirala ang malawak na saklaw ng asal ni Tito. Likas ito sa Filipino at hindi nililimitahan ang diwa sa paksa lamang na ‘tungkol sa lahat ng bagay.’
- source_word: σεαυτὸν παρεχόμενος
  choice: ipakita mong ikaw ay
  rationale: 'Pinananatili nito ang reflexive na diwa: si Tito mismo ang dapat magpakitang halimbawa sa iba. Mas natural ito sa Filipino kaysa sa literal na ‘iharap ang iyong sarili.’'
- source_word: τύπον
  choice: huwaran
  rationale: Sa kontekstong etikal, tumutukoy ito sa isang halimbawang dapat tularan. Ang ‘huwaran’ ay malinaw, marangal, at angkop sa kasalukuyang Filipino.
- source_word: καλῶν ἔργων
  choice: ng mabubuting gawa
  rationale: Tuwirang isinasalin ang pariralang henitibo at pinananatili ang malawak na etikal na kahulugan nito.
- source_word: ἐν τῇ διδασκαλίᾳ
  choice: Sa iyong pagtuturo
  rationale: Batay sa konteksto, tumutukoy ito sa gawain ni Tito sa pagtuturo. Ang paglalagay ng ‘iyong’ ay likas sa Filipino at hindi nagpapakitid sa kahulugan tungo lamang sa pormal na doktrina.
- source_word: ἀφθορίαν
  choice: kawalang-katiwalian
  rationale: Pinananatili nito ang pangunahing diwa ng pagiging walang kabulukan o korupsiyon nang hindi agad nagpapasya kung ang diin ay nasa kalinisan, katapatan, o integridad ng pagtuturo.
- source_word: σεμνότητα
  choice: dignidad
  rationale: Ipinahahayag nito ang marangal at seryosong katangiang karapat-dapat igalang; mas natural ito sa modernong Filipino kaysa sa literal na ‘kabigatan.’
theological_decisions:
- issue: Kung gagamit ng terminong pansimbahan para sa διδασκαλία
  choice: ‘pagtuturo’ ang ginamit sa halip na ‘doktrina’
  alternative: doktrina
  rationale: Saklaw ng talata kapuwa ang nilalaman at paraan ng pagtuturo ni Tito. Hindi hinihingi ng Griyego ang mas makitid at teknikal na terminong ‘doktrina.’
- issue: Kung paano tutukuyin ang ἀφθορίαν sa kaugnayan nito sa pagtuturo
  choice: Pinanatili ang malawak na ‘kawalang-katiwalian’
  alternative: kadalisayan; integridad
  rationale: Hindi tiyak sa mismong salita kung moral na kadalisayan, katapatan, o di-nasisirang kalidad ng pagtuturo ang pangunahing diin. Pinananatili ng salin at talababa ang tunay na lawak ng kahulugan.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Iniwasan ang sobrang literal na ‘iharap ang iyong sarili’ at ang teknikal na ‘doktrina,’ ngunit pinanatili ang lawak at bahagyang kalabuan ng ἀφθορίαν sa pamamagitan ng ‘kawalang-katiwalian’ at ng talababa.
