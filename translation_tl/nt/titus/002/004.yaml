  text: upang turuan nila[a] ang mga nakababatang babae[b] na maging mapagmahal sa kani-kanilang asawa at mga anak[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mapayuhan” o “turuan na maging matino”; saklaw ng pandiwa ang paggabay tungo sa maayos at matinong asal.
    reason: lexical_alternative
  - marker: b
