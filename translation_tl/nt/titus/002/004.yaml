lexical_decisions:
- source_word: ἵνα
  choice: upang
  rationale: Likas at malinaw na nagpapahayag ng layunin o kinalabasan ng naunang tagubilin.
- source_word: σωφρονίζωσι
  choice: maturuan nila
  rationale: Saklaw ng pandiwa ang pagpapayo at paghubog tungo sa matino at maayos na asal. Ang “maturuan” ay natural sa modernong Tagalog at nagpapanatili sa ideya ng mapaghubog na pagtuturo.
- source_word: τὰς νέας
  choice: ang mga nakababatang babae
  rationale: Ang pang-uring pambabae na may pantukoy ay tumutukoy sa mga nakababatang babae, kaibahan sa matatandang babae sa konteksto; hindi ito pinakitid sa “mga nakababatang asawa.”
- source_word: φιλάνδρους
  choice: maging mapagmahal sa kani-kanilang asawa
  rationale: Ipinapahayag ng pang-uri ang mapagmahal na disposisyon sa sariling asawa. Nililinaw ng “kani-kanilang” na bawat babae ay tinutukoy kaugnay ng sarili niyang asawa.
- source_word: εἶναι
  choice: maging
  rationale: Tuwirang ipinapakita ang katangiang nilalayong malinang sa mga nakababatang babae.
- source_word: φιλοτέκνους
  choice: mapagmahal sa kani-kanilang mga anak
  rationale: Ipinapahayag ang mapagmahal na disposisyon sa sariling mga anak at pinananatili ang pagkakapantay ng dalawang magkaugnay na katangian.
theological_decisions:
- issue: Saklaw ng tagubilin sa “mga nakababatang babae” sa konteksto ng sambahayan
  choice: Panatilihin ang pangkalahatang katawagang “mga nakababatang babae,” habang tuwirang isinasalin ang mga katangiang may kaugnayan sa asawa at mga anak.
  alternative: Isalin bilang “mga nakababatang may-asawa” o gawing pangkalahatang pahayag tungkol sa lahat ng kababaihan.
  rationale: Babae ang ipinahihiwatig ng Griyego, hindi tahasang “asawa.” Gayunman, ipinapalagay ng mga kasunod na katangian ang sitwasyon ng mga babaeng may asawa at mga anak. Hindi dapat palawakin o paliitin ng salin ang saklaw nang higit sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “nakababatang babae” upang mapanatili ang paghahambing sa konteksto, at ang “mapagmahal” upang katawanin ang dalawang magkatulad na pang-uring Griyego nang hindi ginagawang utos lamang na makadama ng pag-ibig.
