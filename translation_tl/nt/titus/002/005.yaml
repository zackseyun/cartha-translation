  yaml_path: translation/nt/titus/002/005.yaml
  text: self-controlled[a], pure, working at home, kind, being subject to their own husbands[c][b], so that the word of God may not be slandered.
translation:
  language: tl
  text: mapagpigil sa sarili, dalisay, gumagawa ng mga gawaing pambahay[a], mabait, at nagpapasakop sa kani-kanilang asawa[b], upang hindi malait ang salita ng Diyos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “abala sa tahanan” o “nangangalaga sa tahanan.” Bihira ang salitang Griyego at tumutukoy sa aktibong paggawa sa mga gawain ng sambahayan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “napasasakop sa kani-kanilang asawa.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “malapastangan” o “pagsalitaan ng masama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σώφρονας
  choice: mapagpigil sa sarili
  rationale: Ipinahahayag nito ang matinong pag-iisip na nakikita sa maingat na pagpipigil sa sarili; malinaw at likas ito sa makabagong Tagalog.
- source_word: ἁγνάς
  choice: dalisay
  rationale: Pinananatili ng “dalisay” ang malawak na diwa ng kadalisayang moral nang hindi ito nililimitahan sa seksuwal na kalinisan lamang.
- source_word: οἰκουργούς
  choice: masipag sa mga gawain sa tahanan
  rationale: Ang bihirang salitang Griyego ay tumutukoy sa aktibong paggawa at pagtupad sa mga pananagutan sa sambahayan. Ipinakikita ng salin ang paggawa nang hindi nagpapahiwatig na dapat manatili lamang sa loob ng bahay.
- source_word: ἀγαθάς
  choice: mabait
  rationale: Sa talaan ng mga katangian, likas na ipinahahayag ng “mabait” ang kabutihang nakikita sa pakikitungo sa iba.
- source_word: ὑποτασσομένας
  choice: nagpapasakop
  rationale: Pinananatili nito ang diwa ng kusang paglalagay ng sarili sa ilalim ng kaayusan, nang hindi nagdaragdag ng mas malawak na sistemang doktrinal.
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: sa kani-kanilang asawa
  rationale: Sa konteksto, ang ἀνδράσιν ay mga asawa ng mga babaeng tinutukoy. Ang “kani-kanilang” ay nagpapanatili sa saklaw na limitado sa sariling relasyong mag-asawa.
- source_word: ἵνα μὴ
  choice: upang hindi
  rationale: Likas nitong ipinahahayag sa Tagalog ang layuning ipinakikilala ng pariralang Griyego.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: ang salita ng Diyos
  rationale: Ito ang tuwiran at kinikilalang salin, at maaari nitong tukuyin ang mensahe ng Diyos sa kabuuan.
- source_word: βλασφημῆται
  choice: malait
  rationale: Ang pandiwa ay tumutukoy sa mapanirang o lapastangang pagsasalita. Ang “malait” ay malinaw at natural, samantalang maitatala sa talababa ang mas literal na “malapastangan.”
theological_decisions:
- issue: Pagpapakahulugan sa οἰκουργούς nang hindi pinalalabis ang ideya ng pagkakulong sa tahanan
  choice: masipag sa mga gawain sa tahanan
  alternative: nangangalaga sa tahanan; abala sa tahanan
  rationale: Binibigyang-diin ng salita ang produktibong gawain at pananagutan sa sambahayan, ngunit hindi nito tahasang sinasabing hindi maaaring gumawa ang babae sa labas ng tahanan.
- issue: Pagpapanatili sa kaayusang pansambahayan na ipinahahayag ng ὑποτασσομένας nang walang denominasyonal na dagdag
  choice: nagpapasakop sa kani-kanilang asawa
  alternative: napasasakop sa kani-kanilang asawa
  rationale: Malinaw na pinananatili ng salin ang pahayag ng talata tungkol sa pagpapasakop sa loob ng pag-aasawa, ngunit hindi nito pinalalawak iyon bilang isang ganap na sistema tungkol sa mga tungkulin ng kasarian.
- issue: Paglalarawan sa maaaring idulot sa salita ng Diyos
  choice: hindi malait ang salita ng Diyos
  alternative: hindi malapastangan ang salita ng Diyos; hindi pagsalitaan ng masama ang salita ng Diyos
  rationale: Pinananatili ng “malait” ang pasibong anyo at ang diwa ng pampublikong paghamak, habang kinikilala sa talababa ang mas literal at relihiyosong tunog na kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mga gawain sa tahanan” sa halip na “nagtatrabaho sa bahay” upang maiwasan ang makabagong kahulugang remote work, at iniwasan din ang pananalitang maaaring magpahiwatig ng sapilitang pagkakulong sa tahanan.
