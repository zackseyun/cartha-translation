base_translation:
  language: en
  yaml_path: translation/nt/titus/003/007.yaml
  text: so that[a], having been justified by his grace[b], we might become heirs according to the hope of eternal life.
translation:
  language: tl
  text: upang, matapos na ariing matuwid tayo sa pamamagitan ng kanyang biyaya, ay maging mga tagapagmana tayo ayon sa pag-asa sa buhay na walang hanggan.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “taglay ang pag-asa sa buhay na walang hanggan.”
    reason: lexical_alternative
  - marker: b
    text: Ang “aring matuwid” ay maaari ding isaling “ipahayag na matuwid.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: upang
  rationale: Likas na panandang Filipino para sa layunin o ibinungang kalagayan, at pinananatili ang puwersa ng sugnay na nasa pasakali.
- source_word: δικαιωθέντες
  choice: matapos tayong ariing matuwid
  rationale: Pinananatili ang tinig na balintiyak at ang kilos na nauuna sa pagiging mga tagapagmana. Ang “ariing matuwid” ay nagpapanatili rin ng ugnayang leksikal at teolohikal ng δικαιόω nang hindi ipinapaliwanag nang labis ang mekanismo nito.
- source_word: τῇ ἐκείνου χάριτι
  choice: sa pamamagitan ng kanyang biyaya
  rationale: Ipinahahayag ang instrumental na datibo sa natural na Filipino. Hindi tahasang pinapangalanan ang tinutukoy ng “kanyang,” kaya napapanatili ang antas ng kalabuan ng Griyego.
- source_word: κληρονόμοι
  choice: mga tagapagmana
  rationale: Karaniwang salin na malinaw sa modernong Filipino at nagpapanatili ng larawan ng mana.
- source_word: γενηθῶμεν
  choice: maging ... tayo
  rationale: Ipinahahayag ang pagpasok sa isang bagong kalagayan o katayuan, alinsunod sa aorist subjunctive ng γίνομαι pagkatapos ng ἵνα.
- source_word: κατ’ ἐλπίδα
  choice: ayon sa pag-asa
  rationale: Pinananatili ang ugnayang ipinahahayag ng κατά nang hindi ito nililimitahan sa kahulugang sanhi o batayan; ibinibigay sa talababa ang mas idyomatikong alternatibo.
- source_word: ζωῆς αἰωνίου
  choice: sa buhay na walang hanggan
  rationale: Natural at kinikilalang katumbas sa Filipino ng pag-asang nakatuon sa buhay na walang hanggan.
theological_decisions:
- issue: Kahulugan ng δικαιωθέντες sa konteksto ng kaligtasan
  choice: ariing matuwid
  alternative: ipahayag na matuwid
  rationale: Pinananatili ng “ariing matuwid” ang mahalagang terminong teolohikal at ang balintiyak na anyo nang hindi ipinapasya kung ang diin ay pasya, katayuan, o mas malawak na gawa ng Diyos.
- issue: Tinutukoy ng ἐκείνου (“kanyang”)
  choice: panatilihin ang panghalip na “kanyang”
  alternative: tukuyin nang tahasan bilang Diyos o si Jesu-Cristo
  rationale: Hindi tahasang pinapangalanan ng talata ang tinutukoy ng panghalip. Ang pagpapanatili rito ay umiiwas sa sapilitang paglutas sa posibleng pagtukoy nito batay sa mas malawak na konteksto.
- issue: Ugnayan ng κατ’ ἐλπίδα sa pagiging tagapagmana
  choice: ayon sa pag-asa sa buhay na walang hanggan
  alternative: may pag-asa sa buhay na walang hanggan
  rationale: Mas malapit ang pangunahing salin sa anyo ng Griyego at pinananatili ang teolohikal na tensiyon sa ugnayan ng mana at pag-asa; inilalahad sa talababa ang mas natural ngunit bahagyang mas mapagpaliwanag na anyo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “tagapagmana,” “biyaya,” at “buhay na walang hanggan” bilang pamilyar at malinaw na mga terminong biblikal; iniwasan ang mas makaluma o labis na teknikal na pananalita.
