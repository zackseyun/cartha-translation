base_translation:
  language: en
  yaml_path: translation/nt/titus/003/013.yaml
  text: Diligently send Zenas the lawyer and Apollos on their way[a], so that they may lack nothing.
translation:
  language: tl
  text: Buong sikap mong tulungang magpatuloy sa paglalakbay sina Zenas, na dalubhasa sa batas, at Apolos[a], upang hindi sila kapusin sa anuman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Buong sikap mong tulungan sina Zenas, na dalubhasa sa batas, at Apolos sa kanilang paglalakbay.” Maaaring kabilang sa pandiwa ang praktikal na tulong at paglalaan ng mga kailangan sa paglalakbay, hindi lamang ang pagpapadala sa kanila.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζηνᾶν
  choice: Zenas
  rationale: Isinatinig ang pangalang pantangi ayon sa karaniwang anyo nito sa modernong Tagalog.
- source_word: τὸν νομικὸν
  choice: na dalubhasa sa batas
  rationale: Ang νομικός ay tumutukoy sa taong bihasa sa batas. Pinananatili ng “dalubhasa sa batas” ang malawak na kahulugan nang hindi tiyakang ipinapalagay kung batas sibil o Kautusang Judio ang tinutukoy.
- source_word: Ἀπολλῶν
  choice: Apolos
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng pangalang pantangi.
- source_word: σπουδαίως
  choice: nang buong sikap
  rationale: Ipinahahayag nito ang masigasig at seryosong pag-aasikaso, nang hindi nililimitahan ang diwa sa pagmamadali lamang.
- source_word: πρόπεμψον
  choice: tulungan ... na makapagpatuloy sa kanilang paglalakbay
  rationale: Sa konteksto ng paglalakbay, karaniwang kasama sa pandiwa ang praktikal na pagtulong at paglalaan ng kailangan, hindi lamang ang pagpapaalis o pagpapadala.
- source_word: ἵνα μηδὲν αὐτοῖς λείπῃ
  choice: upang hindi sila kapusin sa anuman
  rationale: Natural na ipinahahayag sa Tagalog ang layunin ng sugnay habang pinananatili ang malawak na saklaw ng μηδέν, “anuman.”
theological_decisions:
- issue: Kung ang νομικός ay tiyak na dalubhasa sa Kautusang Judio o isang propesyonal sa batas
  choice: dalubhasa sa batas
  alternative: dalubhasa sa Kautusan; abogado
  rationale: Hindi sapat ang konteksto upang tiyakang tukuyin ang uri ng batas. Ang piniling salin ay nagpapanatili sa tunay na kalabuan ng Griyego at umiiwas sa makitid o makabagong propesyonal na pakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “kapusin sa anuman” bilang natural ngunit tapat na katumbas ng layuning wala silang kakulangin; iniwasan ang “abogado” upang hindi magpasok ng labis na makabagong propesyonal na kahulugan.
