id: TIT.3.3
reference: Titus 3:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἦμεν γάρ ποτε καὶ ἡμεῖς ἀνόητοι, ἀπειθεῖς, πλανώμενοι, δουλεύοντες ἐπιθυμίαις καὶ ἡδοναῖς ποικίλαις, ἐν κακίᾳ καὶ φθόνῳ διάγοντες, στυγητοί, μισοῦντες ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/003.yaml
  text: For we ourselves also were once foolish[a], disobedient, being led astray, enslaved to various desires and pleasures, spending our lives in malice and envy, hateful[b], hating one another.
translation:
  language: tl
  text: Sapagkat tayo rin noon ay mga hangal, masuwayin, inililigaw[a], inaalipin ng sari-saring pagnanasa at kalayawan. Namuhay tayo sa masamang hangarin at inggit; kasuklam-suklam[b] tayo at napopoot sa isa’t isa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nalilinlang.”
    reason: lexical_alternative
  - marker: b
    text: O “kinasusuklaman.” Ang salitang Griyego ay maaaring mangahulugang “kasuklam-suklam” o “kinasusuklaman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦμεν γάρ ποτε καὶ ἡμεῖς
  choice: Sapagkat tayo rin noon ay
  rationale: Pinananatili ng “Sapagkat” ang paliwanag na ugnayan ng γάρ sa naunang pahayag; ipinahahayag ng “tayo rin” ang inklusibong diin ng καὶ ἡμεῖς, at ng “noon” ang temporal na ποτε.
- source_word: ἀνόητοι
  choice: mga hangal
  rationale: Natural at tuwirang katumbas ito na maaaring tumukoy sa kakulangan ng pang-unawa at wastong moral na paghatol.
- source_word: ἀπειθεῖς
  choice: masuwayin
  rationale: Ipinahahayag nito ang pagtangging magpasakop o sumunod, na angkop sa konteksto ng talaan ng mga bisyo.
- source_word: πλανώμενοι
  choice: inililigaw
  rationale: Pinananatili nito ang malamang na pasibong diwa ng participle at hindi nililimitahan ang kahulugan sa intelektuwal na panlilinlang lamang.
- source_word: δουλεύοντες
  choice: inaalipin
  rationale: Malinaw nitong ipinakikita ang matinding larawan ng pagkaalipin sa mga pagnanasa at kalayawan, sa halip na pahinain iyon bilang simpleng paglilingkod.
- source_word: ἐπιθυμίαις καὶ ἡδοναῖς ποικίλαις
  choice: ng sari-saring pagnanasa at kalayawan
  rationale: Mas malawak ang “pagnanasa” kaysa seksuwal na pita lamang; ang “kalayawan” ay natural na negatibong katumbas ng ἡδοναί sa kontekstong ito. Ang “sari-sari” ay saklaw sa diwa ang dalawang pangngalan.
- source_word: ἐν κακίᾳ καὶ φθόνῳ διάγοντες
  choice: Namuhay tayo sa masamang hangarin at inggit
  rationale: Ipinahahayag ng “namuhay” ang nagpapatuloy na paraan ng pamumuhay. Ang “masamang hangarin” ay naghahatid ng interpersonal na diwa ng κακία nang mas natural kaysa “malisya” para sa karaniwang mambabasa.
- source_word: στυγητοί
  choice: kasuklam-suklam
  rationale: Ipinapahayag nito ang aktibong/pang-uri na pagbasa na ‘hateful, detestable’ at umaayon sa kasunod na pagkapoot sa isa’t isa; inilalagay sa talababa ang posibleng pasibong pagbasa.
- source_word: μισοῦντες ἀλλήλους
  choice: napopoot sa isa’t isa
  rationale: Tuwiran at natural na salin ng participle at reciprocal pronoun, habang pinananatili ang matinding diwa ng μισέω.
theological_decisions:
- issue: Diwa ng pagkaalipin sa δουλεύοντες, kung saan ang mga panginoon ay mga pagnanasa at kalayawan
  choice: inaalipin ng sari-saring pagnanasa at kalayawan
  alternative: naglilingkod sa sari-saring pagnanasa at kalayawan
  rationale: Ang malakas na wika ng pagkaalipin ang lantad sa Griyego at naglalarawan ng dating kalagayang moral nang hindi nagdaragdag ng isang sistemang doktrinal.
- issue: Aktibo o pasibong diwa ng στυγητοί
  choice: kasuklam-suklam
  alternative: kinasusuklaman
  rationale: Parehong posible sa anyong Griyego. Ang aktibong/pang-uri na pagbasa ay angkop sa talaan ng mga katangian at sa kasunod na “napopoot sa isa’t isa,” ngunit pinananatili sa talababa ang tunay na leksikal na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “sari-sari,” “masamang hangarin,” at “napopoot” upang mapanatili ang bigat ng talaan nang hindi nagiging lipas o teknikal. Lahat ng marker ng talababa ay nasa pangunahing teksto.
