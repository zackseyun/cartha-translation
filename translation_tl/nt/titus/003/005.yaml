base_translation:
  language: en
  yaml_path: translation/nt/titus/003/005.yaml
  text: not from works done in righteousness, which we ourselves did, but according to his mercy he saved us, through the washing of regeneration and renewal by the Holy Spirit,
translation:
  language: tl
  text: hindi dahil sa mga gawang ayon sa katuwiran na tayo mismo ang gumawa[a], kundi ayon sa kanyang awa ay iniligtas niya tayo sa pamamagitan ng paghuhugas ng muling kapanganakan[b] at ng pagpapanibagong dulot ng Espiritu Santo[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ayon sa katarungan.” Maaaring mangahulugan ang salitang Griyego ng “katuwiran” o “katarungan”; “katuwiran” ang ginamit dito ayon sa karaniwang gamit ni Pablo.
    reason: alternative_reading
  - marker: b
    text: Ang “paghuhugas” ay maaaring tumukoy sa bautismo, sa larawan ng paglilinis, o sa kapwa; hindi sapilitang nililinaw ng Griyego kung alin ang tinutukoy.
    reason: lexical_alternative
  - marker: c
    text: O “pagpapanibago ng Espiritu Santo.” Pinahihintulutan ng kayarian sa Griyego ang bahagyang magkakaibang pagkaunawa sa ugnayan ng “Espiritu Santo” at “pagpapanibago.”
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἐξ ἔργων τῶν ἐν δικαιοσύνῃ ἃ ἐποιήσαμεν ἡμεῖς
  choice: hindi dahil sa mga gawang ginawa natin mismo ayon sa katuwiran
  rationale: Ang “hindi dahil sa” ay likas na Tagalog para sa ἐκ bilang batayan o pinagmulan sa kontekstong ito. Pinananatili ng “natin mismo” ang diin ng tahasang ἡμεῖς, at ang “ayon sa katuwiran” ay malapit sa kahulugan ng ἐν δικαιοσύνῃ nang hindi ginagawang tila likas na matuwid ang mga gawa.
- source_word: ἀλλὰ κατὰ τὸ αὐτοῦ ἔλεος
  choice: kundi ayon sa kanyang awa
  rationale: Pinananatili ng “ayon sa” ang puwersa ng κατά bilang pamantayan o batayan at ang tuwirang pagsalungat sa mga gawa.
- source_word: ἔσωσεν ἡμᾶς
  choice: iniligtas niya tayo
  rationale: Ang “iniligtas” ang karaniwan at malinaw na salin ng σῴζω sa kontekstong tumutukoy sa kaligtasan.
- source_word: διὰ λουτροῦ
  choice: sa pamamagitan ng paghuhugas
  rationale: Ipinahahayag ng “sa pamamagitan ng” ang instrumental na διά. Ang “paghuhugas” ay nag-iiwan na bukas kung bautismo, larawan ng paglilinis, o kapwa ang tinutukoy ng λουτρόν.
- source_word: παλιγγενεσίας
  choice: ng muling kapanganakan
  rationale: Ang “muling kapanganakan” ay natural at madaling maunawaang Tagalog para sa παλιγγενεσία, habang pinananatili ang ideya ng bagong pagsilang o regenerasyon.
- source_word: καὶ ἀνακαινώσεως πνεύματος ἁγίου
  choice: at ng pagpapanibagong ginagawa ng Espiritu Santo
  rationale: Ang “pagpapanibago” ay tumutugma sa pangngalang ἀνακαίνωσις. Nililinaw ng “ginagawa ng” ang malamang na ahensiya ng Espiritu Santo, ngunit nilalagyan ng talababa ang posibleng ibang ugnayang gramatikal.
theological_decisions:
- issue: Kahulugan ng δικαιοσύνη
  choice: katuwiran
  alternative: katarungan
  rationale: Sa kontekstong Paulino, “katuwiran” ang mas angkop na pangunahing salin; pinananatili sa talababa ang lehitimong kahulugang “katarungan.”
- issue: Kahulugan ng λουτροῦ παλιγγενεσίας
  choice: paghuhugas ng muling kapanganakan
  alternative: paghuhugas na tumutukoy sa bautismo o paglilinis
  rationale: Hindi tahasang idinaragdag ang “bautismo,” sapagkat maaaring tumukoy ang Griyego sa bautismo, sa paglilinis bilang larawan, o sa dalawang ito.
- issue: Ugnayan ng πνεύματος ἁγίου sa ἀνακαινώσεως
  choice: pagpapanibagong ginagawa ng Espiritu Santo
  alternative: pagpapanibago ng Espiritu Santo
  rationale: Malamang na ang Espiritu Santo ang gumagawa o pinagmumulan ng pagpapanibago. Gayunman, pinananatili sa talababa ang higit na pormal at hindi gaanong tiyak na pagbasa ng pariralang genitibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “katuwiran,” “muling kapanganakan,” at “pagpapanibago” bilang pamilyar na bokabularyong biblikal nang hindi labis na teknikal. Napanatili ang ayos at teolohikal na tensiyon ng Griyego, at lahat ng talababa ay may katumbas na pananda sa pangunahing teksto.
