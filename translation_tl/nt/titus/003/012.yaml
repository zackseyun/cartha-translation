  text: Ὅταν πέμψω Ἀρτεμᾶν πρὸς σὲ ἢ Τυχικόν, σπούδασον ἐλθεῖν πρός με εἰς Νικόπολιν, ἐκεῖ γὰρ κέκρικα παραχειμάσαι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/012.yaml
  text: When I send Artemas or Tychicus to you[a], make every effort to come to me at Nicopolis[b], for I have decided to spend the winter there.
translation:
  language: tl
  text: Kapag isinugo ko sa iyo si Artemas o si Tiquico, gawin mo ang iyong makakaya na pumunta sa akin sa Nicopolis,[a] sapagkat napagpasiyahan kong doon magpalipas ng taglamig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magsikap kang pumunta sa akin sa Nicopolis.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν πέμψω
  choice: Kapag isinugo ko
  rationale: Ang ὅταν kasama ng aorist subjunctive ay tumutukoy rito sa isang tiyak ngunit mangyayari pa lamang na pagkakataon. Likas sa Tagalog ang “Kapag isinugo ko” para sa ganitong hinaharap na pangyayari.
- source_word: Ἀρτεμᾶν
  choice: Artemas
  rationale: Isinatinig ang pangalang pantangi ayon sa anyong madaling makilala sa modernong Tagalog.
- source_word: ἢ Τυχικόν
  choice: o si Tiquico
  rationale: Pinananatili ng “o” ang pagpili sa isa sa dalawang posibleng sugo; ginamit ang karaniwang anyong Tagalog ng pangalan.
- source_word: σπούδασον
  choice: sikapin mong ... agad
  rationale: Ipinahahayag nito ang masigasig at maagap na pagkilos. Ang “sikapin” ay hindi lamang utos na magmadali, samantalang ang “agad” ay naghahatid ng pahiwatig ng pagiging maagap.
- source_word: ἐλθεῖν πρός με
  choice: makapunta agad sa akin
  rationale: Ang direksiyon ay patungo sa nagsasalita. Sa natural na Tagalog, “makapunta sa akin” ang malinaw na pagpapahayag ng layunin ng paglalakbay.
- source_word: εἰς Νικόπολιν
  choice: sa Nicopolis
  rationale: Ipinakikita ng εἰς ang patutunguhan. Ang iisang “sa” sa Tagalog ay likas na tumutukoy sa lugar na kinaroroonan o pagtatagpuan kay Pablo nang hindi nagiging paulit-ulit.
- source_word: γὰρ
  choice: sapagkat
  rationale: Malinaw nitong iniuugnay ang dahilan sa naunang pakiusap sa isang marangal ngunit kasalukuyang rehistro.
- source_word: κέκρικα
  choice: napagpasiyahan ko
  rationale: Ang perfect tense ay nagpapahiwatig ng isang pasiyang nabuo na at nananatiling umiiral. Ang “napagpasiyahan ko” ay natural at nagpapanatili sa diwa ng isang tiyak na pasiya.
- source_word: παραχειμάσαι
  choice: magpalipas ng taglamig
  rationale: Tuwirang ipinahahayag ang pananatili sa isang lugar sa panahon ng taglamig.
