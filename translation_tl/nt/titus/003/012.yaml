  source_fidelity: 'Malapit sa Griyego ang pangunahing salin: wasto ang hinaharap na kontingensiya, ang pagpipilian sa pagitan nina Artemas at Tiquico, ang utos na pumunta kay Pablo sa Nicopolis, at ang naunang pasiya niyang doon magpalipas ng taglamig. Gayunman, ang idinagdag na “agad” ay hindi tahasang nasa σπούδασον; maaari itong magpahiwatig ng agarang pagdating sa halip na masigasig na pagsisikap.'
