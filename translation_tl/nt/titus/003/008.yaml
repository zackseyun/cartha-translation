source:
  edition: SBLGNT
  text: Πιστὸς ὁ λόγος, καὶ περὶ τούτων βούλομαί σε διαβεβαιοῦσθαι, ἵνα φροντίζωσιν καλῶν ἔργων προΐστασθαι οἱ πεπιστευκότες θεῷ. ταῦτά ⸀ἐστιν καλὰ καὶ ὠφέλιμα τοῖς ἀνθρώποις·
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/008.yaml
  text: This saying is trustworthy[a], and concerning these things I want you to insist confidently, so that those who have believed God may be careful to devote themselves to good works[b]. These things are good and beneficial for people.
translation:
  language: tl
  text: Mapagkakatiwalaan ang pahayag na ito. Nais kong mariin mong igiit ang mga bagay na ito[a] upang pagsikapan ng mga sumampalataya sa Diyos[b] ang paggawa ng mabubuting gawa.[c] Ang mga bagay na ito ay mabuti at kapaki-pakinabang sa mga tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mariin mong pagtibayin” o “ipahayag mo nang may katiyakan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “mga naniwala sa Diyos” o “mga nagtiwala sa Diyos.”
    reason: lexical_alternative
  - marker: c
    text: O, “manguna sa paggawa ng mabubuting gawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πιστὸς ὁ λόγος
  choice: Mapagkakatiwalaan ang pahayag na ito
  rationale: Ang λόγος ay tumutukoy sa naunang pahayag o mensahe, hindi lamang sa isang salita. Likas sa modernong Tagalog ang ayos na ito at pinananatili nito ang pormulang nagpapahayag ng pagiging maaasahan.
- source_word: περὶ τούτων
  choice: ang mga bagay na ito
  rationale: Direktang inuugnay nito ang utos ni Pablo sa mga naunang tinalakay.
- source_word: βούλομαί σε διαβεβαιοῦσθαι
  choice: Nais kong igiit mo nang buong katiyakan
  rationale: Ipinahahayag ng βούλομαι ang personal na nais, at ng διαβεβαιοῦσθαι ang matatag at may-katiyakang paggigiit. Iniiwasan ng salin ang mahinang diwang ‘banggitin’ lamang.
- source_word: ἵνα φροντίζωσιν
  choice: upang tiyaking
  rationale: Ipinahahayag ng φροντίζω ang maingat at sadyang pagbibigay-pansin. Sa Tagalog, natural na ipinakikita ng ‘tiyaking’ ang layuning humantong sa sinadyang pagkilos.
- source_word: καλῶν ἔργων προΐστασθαι
  choice: iuukol ... ang kanilang sarili sa mabubuting gawa
  rationale: Sa kontekstong ito, malamang na tumutukoy ang προΐστασθαι sa masigasig at patuloy na pagtatalaga ng sarili sa mabubuting gawa, bagaman posible rin ang diwang ‘manguna.’
- source_word: οἱ πεπιστευκότες θεῷ
  choice: mga sumampalataya sa Diyos
  rationale: Ipinahahayag ng perfect participle ang mga pumasok sa pananampalataya at nananatili rito. Ang ‘sumampalataya sa Diyos’ ang natural na Tagalog para sa dative construction, habang itinatala sa talababa ang posibleng diin sa paniniwala o pagtitiwala sa sinabi ng Diyos.
- source_word: ταῦτά ἐστιν καλὰ καὶ ὠφέλιμα τοῖς ἀνθρώποις
  choice: Ang mga bagay na ito ay mabuti at kapaki-pakinabang sa mga tao
  rationale: Pinananatili nito ang plural na tinutukoy ng ταῦτα at ang magkaibang diwa ng moral na kabutihan at praktikal na pakinabang. Generic ang ‘mga tao’ at hindi tumutukoy lamang sa mga lalaki.
theological_decisions:
- issue: Ugnayan ng pananampalataya at mabubuting gawa
  choice: Inilalahad ang mabubuting gawa bilang inaasahang bunga ng mga sumampalataya na.
  alternative: Ipakahulugan ang mabubuting gawa bilang batayan o paraan upang matamo ang kaligtasan.
  rationale: Nauuna sa kayarian ng Griyego ang nakumpleto at nagpapatuloy na kalagayan ng pananampalataya; ang pag-uukol sa mabubuting gawa ang nilalayong bunga nito. Hindi nagdaragdag ang salin ng sistemang doktrinal na wala sa talata.
- issue: Kahulugan ng πιστεύω na may dative na θεῷ
  choice: sumampalataya sa Diyos
  alternative: naniwala sa Diyos; nagtiwala sa Diyos o sa sinabi ng Diyos
  rationale: Ang pangunahing salin ang pinakanatural sa Tagalog at maaaring saklawin kapuwa ang pananampalataya at pagtitiwala. Pinananatili sa talababa ang mas tuwirang diwa ng paniniwala o pagtitiwala sa Diyos.
- issue: Saklaw ng προΐστασθαι
  choice: iuukol ... ang kanilang sarili
  alternative: manguna sa mabubuting gawa
  rationale: Maaaring tumukoy ang pandiwa sa masigasig na pagsasagawa o pagtatalaga, at maaari ring magtaglay ng diwang pangunguna. Ginamit ang mas angkop sa konteksto sa pangunahing teksto at pinanatili ang tunay na alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang ‘pahayag’ sa halip na literal na ‘salita,’ at ang ‘mabubuting gawa’ upang mapanatili ang ugnayang leksikal at teolohikal ng parirala sa iba pang bahagi ng liham. Ang mga alternatibong kahulugan na tunay na sinusuportahan ng Griyego ay inilagay sa mga talababa.
