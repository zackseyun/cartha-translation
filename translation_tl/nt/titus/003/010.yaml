  text: Reject a divisive person after a first and second warning,[a]
translation:
  language: tl
  text: Pagkatapos ng una at ikalawang pagsaway, iwasan mo ang taong nagdudulot ng pagkakabaha-bahagi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “taong mapagkampi-kampi” o “taong nagtataguyod ng pangkatin”; sa mga tradisyonal na salin, “taong erehe.” Malamang na tumutukoy ang salitang Griyego sa taong nagdudulot ng pagkakahati o sektaryang pangkatin.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἱρετικὸν
  choice: mapagkampi-kampi
  rationale: Tumutukoy dito sa taong lumilikha o nagtataguyod ng mga pangkatin at pagkakahati. Iniiwasan nito ang pagpasok ng mas huling teknikal na diwa ng “erehe,” habang malinaw na ipinahahayag ang mapaghating asal.
- source_word: ἄνθρωπον
  choice: tao
  rationale: Likas at tumpak na katumbas sa Filipino para sa isang indibidwal; hindi kailangang tukuyin ang kasarian sa kontekstong ito.
- source_word: μετὰ μίαν καὶ δευτέραν νουθεσίαν
  choice: pagkatapos ng una at ikalawang pagsaway
  rationale: Pinananatili ang pagkakasunod-sunod ng dalawang pagtatangkang magtuwid bago kumilos. Ang “pagsaway” ay may puwersang mapagwasto at babala, ngunit natural sa kasalukuyang Filipino.
- source_word: παραιτοῦ
  choice: iwasan mo
  rationale: Ipinahahayag ng gitnang pautos ang pagtanggi sa pakikisama o pakikitungo sa taong nagpapatuloy sa ganitong asal. Mas natural ito sa Filipino kaysa sa literal na “tanggihan,” na maaaring magmukhang pagtanggi lamang sa isang kahilingan.
theological_decisions:
- issue: Kung ang αἱρετικὸν ay isasalin sa mas huling teknikal na wikang doktrinal o ayon sa malamang na diwa nitong pangkatin at pagkakahati
  choice: taong mapagkampi-kampi
  alternative: taong erehe; taong mapaghatid ng pagkakabaha-bahagi
  rationale: Pinananatili ng salin ang malamang na unang-siglong diwa ng taong gumagawa ng mga pangkatin, nang hindi ipinapalagay na ang tinutukoy ay pormal na erehiya sa mas huling kahulugang eklesiastiko.
translation_notes:
  register: Modernong Filipino na tuwiran at marangal. Ginamit ang “mapagkampi-kampi” upang maging malinaw sa karaniwang mambabasa ang sektaryan at mapaghating asal, habang inilagay sa talababa ang tradisyonal na “erehe.”
