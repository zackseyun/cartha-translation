  text: μωρὰς δὲ ζητήσεις καὶ γενεαλογίας καὶ ⸀ἔρεις καὶ μάχας νομικὰς περιΐστασο, εἰσὶν γὰρ ἀνωφελεῖς καὶ μάταιοι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/009.yaml
  text: But avoid foolish controversies and genealogies and strife and quarrels about the law[b][a], for they are unprofitable and futile.
translation:
  language: tl
  text: Ngunit iwasan mo ang mga hangal na pagtatalo, mga talaangkanan, alitan, at mga pag-aaway tungkol sa kautusan[a], sapagkat walang pakinabang at walang kabuluhan ang mga ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga pag-aaway na may kinalaman sa kautusan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μωρὰς ζητήσεις
  choice: mga hangal na pagtatalo
  rationale: Ipinahihiwatig ng parirala ang mga usaping pinagtatalunan na hangal o walang katuturan, hindi ang mga neutral na tanong lamang.
- source_word: γενεαλογίας
  choice: mga talaangkanan
  rationale: Tuwirang salin ito na hindi nagpapasok ng tiyak na pagpapakahulugang pangkasaysayan na hindi tahasang ibinigay ng talata.
- source_word: ἔρεις
  choice: alitan
  rationale: Ang “alitan” ay likas na katumbas ng hidwaan o sigalot at naihihiwalay nang sapat sa kasunod na μάχας.
- source_word: μάχας νομικὰς
  choice: mga pag-aaway tungkol sa Kautusan
  rationale: Sa konteksto, tumutukoy ang μάχας sa mga alitang pasalita, samantalang nililinaw ng νομικάς na may kinalaman ang mga ito sa Kautusan, hindi sa paglilitis sa hukuman.
- source_word: περιΐστασο
  choice: iwasan mo
  rationale: Napananatili nito ang tuwirang pautos at ang diwang lumayo o huwag makisangkot.
- source_word: ἀνωφελεῖς
  choice: walang pakinabang
  rationale: Malinaw nitong ipinapahayag na hindi nakabubuti o nakatutulong ang mga ito.
- source_word: μάταιοι
  choice: walang kabuluhan
  rationale: Ipinapahayag nito ang pagiging hungkag at walang patutunguhan, habang pinananatili ang kaibhan mula sa “walang pakinabang.”
theological_decisions:
- issue: Likas ng “mga talaangkanan” at “mga pag-aaway tungkol sa Kautusan”
  choice: Panatilihing pangkalahatan ang mga termino at gamitin ang “Kautusan” bilang malamang na pagtukoy sa relihiyosong kautusan sa konteksto.
  alternative: Tukuyin ang mga talaangkanan bilang partikular na debateng Judio, haka-hakang proto-Gnostiko, o usapin lamang ng lahing pinagmulan; o isalin ang νομικὰς bilang pangkalahatang “legal.”
  rationale: Hindi sapat ang mismong talata upang matiyak ang isang partikular na sistemang pangkasaysayan. Ang pangkalahatang salin ay nagpapanatili sa tunay na lawak ng teksto at umiiwas sa pagpasok ng isang tiyak na doktrina o rekonstruksiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “talaangkanan” bilang pormal ngunit karaniwang salitang biblikal, at ang “Kautusan” na may malaking titik upang ipahiwatig ang malamang na relihiyosong diwa nang hindi tinutukoy ang isang mas makitid na uri ng pagtatalo.
