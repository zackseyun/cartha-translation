  text: οὗ ἐξέχεεν ἐφ’ ἡμᾶς πλουσίως διὰ Ἰησοῦ Χριστοῦ τοῦ σωτῆρος ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/006.yaml
  text: whom he poured out on us richly through Jesus the Messiah our Savior[b][a],
translation:
  language: tl
  text: na ibinuhos niya nang sagana sa atin sa pamamagitan ni Jesus, ang Mesiyas, na ating Tagapagligtas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Griyego: “Jesus Christ”; ang Χριστός ay isinalin dito bilang titulong “Mesiyas.”'
    reason: alternative_reading
lexical_decisions:
- source_word: οὗ
  choice: na
  rationale: Ang pang-ugnay na “na” ay likas sa Tagalog at tumutukoy pabalik sa Banal na Espiritu sa talata 5. Hindi nito kailangang piliting ipakita ang kasariang gramatikal ng panghalip sa Griyego.
- source_word: ἐξέχεεν
  choice: ibinuhos niya
  rationale: Ang “ibinuhos” ang tuwiran at karaniwang katumbas ng ἐκχέω, lalo na sa paglalarawan sa pagbuhos ng Espiritu. Pinananatili ng “niya” ang tahasang gumaganap na nasa pandiwang Griyego at ang kaugnayan nito sa naunang konteksto.
- source_word: ἐφ’ ἡμᾶς
  choice: sa atin
  rationale: Likas na ipinahahayag ng “sa atin” ang direksiyon ng pagbuhos tungo sa mga mananampalatayang kabilang ang nagsasalita at kausap.
- source_word: πλουσίως
  choice: nang sagana
  rationale: Ipinapahayag ng “nang sagana” ang kasaganaan ng pagkakaloob at mas natural ito sa modernong Tagalog kaysa sa isang mekanikal na pagtukoy sa kayamanan.
- source_word: διὰ
  choice: sa pamamagitan ni
  rationale: Sa kasamang genitive, ipinahahayag ng διά ang paraan o tagapamagitan; ang “sa pamamagitan ni” ang malinaw at likas na katumbas para sa isang tao.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus na Mesiyas
  rationale: Isinalin ang Χριστός bilang titulong “Mesiyas” sa halip na ituring lamang na bahagi ng pangalan. Ang anyong “Jesus na Mesiyas” ay malinaw at mauunawaan sa modernong Tagalog.
- source_word: τοῦ σωτῆρος ἡμῶν
  choice: na ating Tagapagligtas
  rationale: Pinananatili ng “ating Tagapagligtas” ang titulo at ang inclusive na pagmamay-ari ng ἡμῶν. Ang ikalawang “na” ay natural na nag-uugnay sa paglalarawang ito kay Jesus na Mesiyas.
theological_decisions:
- issue: Tinutukoy ng οὗ
  choice: Ang “na” ay tumutukoy sa Banal na Espiritu na binanggit sa Tito 3:5.
  alternative: Maaaring unawain ang pang-ugnay nang hindi tahasang ipinapakita kung personal o di-personal ang tinutukoy.
  rationale: Ang pinakamalapit na antecedent ay ang Banal na Espiritu. Gayunman, likas na hindi minamarkahan ng Tagalog na “na” ang pagkakaibang “whom/which,” kaya napapanatili rin ang anyong hindi labis na nagpapaliwanag.
- issue: Pagpapakahulugan sa Χριστός bilang titulo
  choice: Jesus na Mesiyas
  alternative: Jesucristo / Jesus Cristo
  rationale: Sa kontekstong ito, ang Χριστός ay makabuluhang titulo at katabi ng isa pang titulo, “ating Tagapagligtas.” Ipinakikita ng “Mesiyas” ang kahulugan sa halip na ilipat lamang ang tradisyonal na anyong “Cristo.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang talata bilang sugnay na nagpapatuloy mula sa talata 5, kaya nagsisimula ito sa “na.”
