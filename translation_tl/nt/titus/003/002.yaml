  text: μηδένα βλασφημεῖν, ἀμάχους εἶναι, ἐπιεικεῖς, πᾶσαν ἐνδεικνυμένους πραΰτητα πρὸς πάντας ἀνθρώπους.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/002.yaml
  text: to slander no one[a], to be peaceable, gentle[c][b], showing all meekness toward all people.
translation:
  language: tl
  text: huwag manirang-puri kaninuman[a], huwag maging palaaway, maging mahinahon, at magpakita ng lubos na kaamuan sa lahat ng tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “huwag magsalita ng masama laban kaninuman.” Maaaring tumukoy ang pandiwa sa mapang-abusong pananalita sa mas malawak na diwa kaysa sa pormal na paninirang-puri.
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδένα
  choice: kaninuman
  rationale: Likas na Filipino para sa negatibong di-tiyak na layon at pinananatili ang saklaw na walang sinuman.
- source_word: βλασφημεῖν
  choice: manirang-puri
  rationale: Sa kontekstong pakikitungo sa kapwa, tumutukoy ito sa mapanirang o mapang-abusong pananalita laban sa isang tao, hindi sa pamumusong laban sa Diyos. Nililinaw ng talababa ang mas malawak na posibleng diwa.
- source_word: ἀμάχους εἶναι
  choice: huwag maging palaaway
  rationale: Natural at malinaw na ipinahahayag ang pagiging ayaw makipag-away o makipagtalo, habang pinananatili ang negatibong anyo ng pang-uri.
- source_word: ἐπιεικεῖς
  choice: maging mahinahon
  rationale: Ipinahahayag ang mapagbigay, hindi-marahas, at makatuwirang pakikitungo sa paraang madaling maunawaan sa modernong Filipino.
- source_word: πᾶσαν ἐνδεικνυμένους πραΰτητα
  choice: magpakita ng lubos na kaamuan
  rationale: Ang 'magpakita' ay natural para sa participle, ang 'lubos' ay naghahatid ng diin ng πᾶσαν, at ang 'kaamuan' ay pinananatiling naiiba sa ἐπιεικεῖς.
- source_word: πρὸς πάντας ἀνθρώπους
  choice: sa lahat ng tao
  rationale: Natural na Filipino na naghahatid ng direksiyon ng asal at ng pangkalahatang saklaw sa lahat ng tao, hindi lamang sa mga lalaki.
theological_decisions:
- issue: Pangkalahatang kahulugan ng ἀνθρώπους
  choice: lahat ng tao
  alternative: lahat ng mga lalaki
  rationale: Dito, ang ἀνθρώπους ay tumutukoy sa sangkatauhan sa pangkalahatan; ang 'lahat ng tao' ay tumpak at hindi nagpapahiwatig ng maling paghihigpit sa kasarian.
- issue: Pagkakaiba ng ἐπιεικεῖς at πραΰτητα
  choice: mahinahon / kaamuan
  alternative: mabait / kahinahunan
  rationale: Pinananatili ang dalawang magkaugnay ngunit magkaibang katangian nang hindi ipinapakahulugan na ganap na magkasingkahulugan ang mga salitang Griyego.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang magkakatugmang pautos na 'huwag' at 'maging' upang maging natural ang serye ng mga tagubilin, bagaman sa Griyego ay nagpapatuloy ang mga ito mula sa namamahalang pandiwa sa naunang talata.
