  to: At matuto rin ang mga kapanalig natin[a] na magtuon sa mabubuting gawa[b] upang matugunan ang mahahalagang pangangailangan[c], nang sa gayon ay hindi sila maging walang bunga.
  rationale: Inayos ang mga pariralang hindi likas sa Filipino habang pinanatili ang saklaw ng kahulugan ng Griyego at ang layuning sugnay. Ang “mga kapanalig natin” ay isang natural na pangpamayanang pagsasalin sa kontekstong ito; ang talababa ay nagpapanatili ng mas literal na alternatibo. Walang doktrinal na interpretasyong idinagdag.
