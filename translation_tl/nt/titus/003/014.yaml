  text: μανθανέτωσαν δὲ καὶ οἱ ἡμέτεροι καλῶν ἔργων προΐστασθαι εἰς τὰς ἀναγκαίας χρείας, ἵνα μὴ ὦσιν ἄκαρποι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/014.yaml
  text: And let our people also learn to engage in good works for necessary needs[c][b][a], so that they may not be unfruitful.
translation:
  language: tl
  text: At matuto rin ang mga kapanalig natin[a] na magtuon sa mabubuting gawa[b] upang matugunan ang mahahalagang pangangailangan[c], nang sa gayon ay hindi sila maging walang bunga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga atin” o “ang sarili nating mga tao.”
    reason: lexical_alternative
  - marker: b
    text: O “italaga ang sarili sa mabubuting gawa”; maaari ring “manguna sa mabubuting gawa.”
    reason: lexical_alternative
  - marker: c
    text: O “mga apurahang pangangailangan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μανθανέτωσαν
  choice: matuto
  rationale: Ang ikatlong panauhang pangmaramihang pautos ay isinalin bilang isang tuwirang panawagan; likas sa Filipino ang “matuto” sa kayariang “At matuto rin...” nang hindi pinahihina ang puwersa ng pangaral.
- source_word: οἱ ἡμέτεροι
  choice: ang mga kabilang sa atin
  rationale: Tumutukoy ito sa mga taong kaugnay ng pamayanang kinabibilangan nina Pablo at Tito. Iniiwasan ng salin ang di-kinakailangang pagtatakda sa kasarian at pinananatili ang relasyonal na diwa ng literal na “mga atin.”
- source_word: καλῶν ἔργων
  choice: mabubuting gawa
  rationale: Tuwirang salin ito na nagpapanatili sa paulit-ulit na diin ng liham sa mabuti at kapaki-pakinabang na pagkilos.
- source_word: προΐστασθαι
  choice: maglaan ng sarili sa
  rationale: Sa pagkakaugnay nito sa “mabubuting gawa,” ipinahihiwatig nito ang masigasig at tuloy-tuloy na pakikibahagi. Pinananatili sa talababa ang maaaring diwang “manguna” dahil malawak ang saklaw ng pandiwa.
- source_word: εἰς τὰς ἀναγκαίας χρείας
  choice: upang matugunan ang mahahalagang pangangailangan
  rationale: Ipinahahayag ang layunin ng mabubuting gawa at iniiwasan ang di-likas na pag-uulit na “kinakailangang pangangailangan.” Ang “mahahalaga” ay malapit sa diwa ng mga pangangailangang kailangan o maaaring apurahan.
- source_word: ἵνα μὴ ὦσιν ἄκαρποι
  choice: nang sa gayon ay hindi sila maging mga taong walang bunga
  rationale: Pinananatili ang sugnay ng layunin at ang metapora ng pagiging “walang bunga,” sa halip na palitan ito ng mas mapagpaliwanag na “walang pakinabang” o “di-mabisa.”
theological_decisions:
- issue: Saklaw ng οἱ ἡμέτεροι
  choice: Mga kabilang sa pamayanang Kristiyano nina Pablo at Tito
  alternative: Mga sariling tauhan o kalalakihan lamang na kasama nila
  rationale: Ang pananalita ay relasyonal at pangpamayanan, at walang gramatikal o kontekstuwal na dahilan upang limitahan ito sa mga lalaki.
- issue: Diwa ng προΐστασθαι
  choice: Masigasig na paglalaan ng sarili sa mabubuting gawa
  alternative: Pangunguna sa mabubuting gawa
  rationale: Kapuwa posible sa saklaw ng pandiwa, ngunit sa konteksto ng Tito 3:8 at 3:14, higit na natural ang aktibong pagtatalaga at pagsasagawa kaysa isang tiyak na tungkuling pamumuno. Nananatili ang alternatibo sa talababa.
translation_notes:
  register: Makabago at marangal na Filipino, na madaling maunawaan sa karaniwang pagbasa. Pinanatili ang metaporang “walang bunga” at nilagyan ng talababa ang tunay na mga alternatibong kahulugan nang hindi pinipili nang palihim ang isang doktrinal na pagbasa.
