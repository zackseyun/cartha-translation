id: TIT.3.1
reference: Titus 3:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ὑπομίμνῃσκε αὐτοὺς ⸀ἀρχαῖς ἐξουσίαις ὑποτάσσεσθαι πειθαρχεῖν, πρὸς πᾶν ἔργον ἀγαθὸν ἑτοίμους εἶναι,
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/001.yaml
  text: Remind them to be subject to rulers and authorities[a], to be obedient, to be ready for every good work,
translation:
  language: tl
  text: Paalalahanan mo sila na magpasakop sa mga pinuno at mga awtoridad[a], maging masunurin, at maging handa sa bawat mabuting gawain,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magpasakop at sumunod sa mga pinuno at mga awtoridad.”
    reason: Posibleng iugnay sa parehong pandiwang “magpasakop” at “sumunod” ang mga katagang “mga pinuno at mga awtoridad.”
lexical_decisions:
- source_word: Ὑπομίμνῃσκε
  choice: Paalalahanan mo
  rationale: Ang pangkasalukuyang pautos ay maaaring magpahiwatig ng patuloy na pagpapaalala. Likas sa modernong Tagalog ang “Paalalahanan mo,” at hindi kailangang tahasang idagdag ang “patuloy” upang maipahayag ang utos.
- source_word: αὐτοὺς
  choice: sila
  rationale: Tumutukoy ang panghalip sa mga mananampalatayang dapat paalalahanan ni Tito.
- source_word: ἀρχαῖς
  choice: mga pinuno
  rationale: Sa kontekstong sibiko, tumutukoy ito sa mga namumuno o tagapamahala, hindi sa mga kapangyarihang espirituwal.
- source_word: ἐξουσίαις
  choice: mga may kapangyarihan
  rationale: Katuwang ng ἀρχαῖς, tumutukoy ito sa mga taong o institusyong may awtoridad. Pinananatili ng salin ang dalawang magkaugnay ngunit hindi lubusang magkaparehong katawagan.
- source_word: ὑποτάσσεσθαι
  choice: magpasakop
  rationale: Ipinahahayag nito ang pagkilala at pagpapailalim sa kaayusan ng pamamahala, nang hindi nagpapahiwatig ng pagkaalipin o walang-takdang pagsunod.
- source_word: πειθαρχεῖν
  choice: maging masunurin
  rationale: Ang pandiwa ay nangangahulugang sumunod sa awtoridad. Ang “maging masunurin” ay maayos na kaagapay ng “magpasakop” sa hanay ng mga pawatas.
- source_word: πρὸς πᾶν ἔργον ἀγαθὸν
  choice: sa bawat mabuting gawain
  rationale: Ipinahahayag ng parirala ang kahandaang nakatuon sa anumang mabuting gawa. Ang “bawat mabuting gawain” ay malinaw at likas sa Tagalog.
- source_word: ἑτοίμους εἶναι
  choice: maging handa
  rationale: Tumutukoy ito sa kalagayan ng pagiging handang kumilos; tuwiran at natural ang “maging handa.”
theological_decisions:
- issue: Saklaw ng pagpapasakop sa mga namamahalang sibiko
  choice: Isinalin ang talata bilang pangkalahatang utos na magpasakop at maging masunurin sa mga namumuno at may kapangyarihan, nang hindi sinasabing lubos at walang hangganan ang pagsunod sa bawat posibleng kalagayan.
  alternative: Isaling para bang hinihingi ang walang-pasubaling pagsunod sa anumang utos ng pamahalaan.
  rationale: Malinaw ang pangkalahatang panawagan ng teksto sa maayos na pakikitungo sa mga awtoridad, ngunit hindi nito tinatalakay rito ang mga hangganan ng pagsunod. Kaya pinananatili ang tensiyong iyon at iniiwasan ang dagdag na pagpapakahulugan.
- issue: Ugnayan ng πειθαρχεῖν sa ἀρχαῖς ἐξουσίαις
  choice: Sa pangunahing teksto, inihiwalay nang bahagya ang “maging masunurin,” gaya ng posibleng pagbasa na isa itong karagdagang pangkalahatang bilin.
  alternative: Unawaing ang parehong “magpasakop” at “sumunod” ay tuwirang may layon na “mga pinuno at mga may kapangyarihan.”
  rationale: Pinahihintulutan ng ayos ng Griyego ang dalawang pagkakaugnay. Inilalahad sa talababa ang alternatibo sa halip na tuluyang lutasin ang tunay na sintaktikong kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “mga may kapangyarihan” sa halip na mas teknikal na “mga awtoridad” upang maging likas sa karaniwang mambabasa, habang pinananatili ang pagkakaiba nito sa “mga pinuno.”
