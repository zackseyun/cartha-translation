  text: All who are with me greet you[a]. Greet those who love us in faith. Grace be with all of you.
translation:
  language: tl
  text: Binabati ka ng lahat ng kasama ko. Batiin mo ang mga nagmamahal sa atin sa pananampalataya.[a] Sumainyo nawa ang biyaya, kayong lahat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring unawain ang “sa pananampalataya” bilang pagtukoy sa pananampalataya bilang isang kinikilalang kabuuan; o “nang may katapatan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζονταί
  choice: Binabati
  rationale: Karaniwang gamit sa pangwakas na pagbati sa liham; tuwiran at natural sa modernong Tagalog.
- source_word: οἱ μετ’ ἐμοῦ πάντες
  choice: ang lahat ng kasama ko
  rationale: Pinananatili ang πάντες (“lahat”) at ang diwa ng mga kasamahan ng sumulat.
- source_word: ἄσπασαι
  choice: Batiin mo
  rationale: Tuwirang pautos na angkop sa personal na pagbati sa liham.
- source_word: φιλοῦντας
  choice: mga umiibig
  rationale: Ipinahahayag ang personal na pagmamahal o pagkagiliw ng φιλέω nang hindi ito pinahihina tungo sa simpleng pagmamalasakit.
- source_word: ἐν πίστει
  choice: sa pananampalataya
  rationale: Pinananatili ang payak at sadyang maluwag na diwa ng ἐν πίστει, nang hindi tiyakang ginagawang sanhi, paraan, o pagtukoy sa kabuuan ng doktrinang Kristiyano.
- source_word: ἡ χάρις
  choice: ang biyaya
  rationale: “Biyaya” ang likas at kinikilalang katumbas ng χάρις sa basbas na pangwakas.
- source_word: μετὰ πάντων ὑμῶν
  choice: Sumainyong lahat
  rationale: Likas na pormula ng basbas sa Tagalog na malinaw na nagpapanatili sa πάντων (“lahat”).
theological_decisions:
- issue: Kahulugan ng πίστις sa ἐν πίστει
  choice: pananampalataya
  alternative: ang pananampalataya; katapatan
  rationale: Maaaring tumukoy ang parirala sa pananampalataya bilang saklaw o batayan ng kanilang pag-ibig, sa kinikilalang pananampalataya, o—bagaman hindi gaanong malamang dito—sa katapatan. Pinananatili sa pangunahing teksto ang payak na “pananampalataya,” at inilalahad sa talababa ang tunay na mga posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na maikli, marangal, at angkop sa pangwakas na pagbati sa isang liham. Hindi pinalawak ang mga pormula nang higit sa hinihingi ng Griyego; pinanatili sa talababa ang kalabuan ng ἐν πίστει.
