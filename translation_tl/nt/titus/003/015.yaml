    rationale: Maaaring ipaliwanag ang alternatibong pagbasa bilang pagtukoy sa pananampalataya bilang isang kinikilalang kabuuan, nang hindi isinasalin mismo ang dagdag na «kinikilalang» bilang bahagi ng parirala.
