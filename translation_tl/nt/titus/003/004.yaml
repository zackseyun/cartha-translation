  text: ὅτε δὲ ἡ χρηστότης καὶ ἡ φιλανθρωπία ἐπεφάνη τοῦ σωτῆρος ἡμῶν θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/004.yaml
  text: But when the kindness and love for humanity of God our Savior appeared,[a]
translation:
  language: tl
  text: Ngunit nang mahayag ang kabutihang-loob ng Diyos na ating Tagapagligtas at ang pag-ibig niya sa sangkatauhan,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “pag-ibig niya sa mga tao”; ang salitang Griyego ay tumutukoy sa mapagkalingang malasakit o pag-ibig sa mga tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Ngunit nang
  rationale: Ang ὅτε ay nagpapakilala ng pangyayaring nasa panahon (‘nang’), at ang δέ ay nagpapahiwatig ng banayad na pagsalungat o paglipat mula sa naunang paglalarawan ng kasalanan ng tao tungo sa pagliligtas ng Diyos.
- source_word: χρηστότης
  choice: kabutihang-loob
  rationale: Ipinahihiwatig ng salita ang kabaitan, kabutihan, o mapagbigay na malasakit sa pakikitungo. Likas at marangal sa modernong Tagalog ang ‘kabutihang-loob’ at hindi nito inuulit lamang ang kahulugan ng kasunod na φιλανθρωπία.
- source_word: φιλανθρωπία
  choice: pag-ibig niya sa sangkatauhan
  rationale: Tumutukoy ito sa pag-ibig o mapagkalingang malasakit sa mga tao. Malinaw na ipinapakita ng ‘sa sangkatauhan’ ang pinatutungkulan ng pag-ibig, habang ang ‘niya’ ay likas na inuugnay ito sa Diyos na ating Tagapagligtas.
- source_word: ἐπεφάνη
  choice: mahayag
  rationale: Ang anyo ay nagpapahayag ng pagpapakita o pagiging hayag. Ang ‘mahayag’ ay natural sa sugnay na may ‘nang’ at pinananatili ang diwang pagpapamalas nang hindi tinutukoy kung paano ito naganap.
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: ng Diyos na ating Tagapagligtas
  rationale: Pinananatili nito ang Diyos bilang may-ari o pinagmumulan ng dalawang katangiang binanggit at ang ‘ating Tagapagligtas’ bilang titulong naglalarawan sa Diyos. Ang ayos ay malinaw at natural sa Tagalog.
theological_decisions:
- issue: Tinutukoy ng ‘Diyos na ating Tagapagligtas’
  choice: Pinanatili ang mismong titulong ‘Diyos na ating Tagapagligtas’ nang hindi nagdaragdag ng pangalan o paliwanag sa teksto.
  alternative: Tahasang tukuyin sa salin ang Diyos Ama, batay sa mas malawak na konteksto at sa pagkakilala kay Jesu-Cristo sa talata 6.
  rationale: Karaniwang tumutukoy ang titulong ito sa Ama sa mga Liham Pastoral, ngunit hindi tahasang sinasabi ng talatang ito lamang ang ‘Ama.’ Kaya pinananatili ng salin ang teolohikal na bigat at anumang likas na tensiyon ng pananalita nang hindi nilulutas ito sa loob ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘sangkatauhan’ upang katawanin ang kolektibong saklaw ng φιλανθρωπία; inilagay ang ‘niya’ upang maging malinaw at natural ang ugnayan ng parehong katangian sa Diyos nang hindi binabago ang kahulugan.
