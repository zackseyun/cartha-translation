  text: knowing that such a person is warped and is sinning[c][b][a], being self-condemned.
translation:
  language: tl
  text: Yamang alam mong ang gayong tao[b] ay nalihis na[a] at nagkakasala, at may hatol laban sa sarili niya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lumihis na” o “naging baluktot na.” Ipinahihiwatig ng perpektong pandiwang Griyego ang isang kalagayang bunga ng naunang paglihis.
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, panlalaking isahan ang parirala at maaari ring isaling “gayong lalaki.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “hinatulan ng sarili niyang hatol” o “sariling-hatol.” Ang salita ay maaaring mangahulugang ang sariling mga kilos o patotoo ng tao ang humahatol laban sa kanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: Alam mong
  rationale: Pinananatili nito ang pandiwaring kaugnay ng utos sa naunang talata at ang ipinahihiwatig na paksa na si Tito, nang hindi tahasang pinipiling sanhi o ibang ugnayang pang-abay.
- source_word: ἐξέστραπται
  choice: ay nalihis na
  rationale: Ipinahahayag ng “nalihis na” ang kasalukuyang kalagayang bunga ng naunang paglihis, na angkop sa perpektong anyo ng pandiwa. Hindi rin nito dinaragdagan ang teksto ng mas tiyak na uri ng kabulukan.
- source_word: ὁ τοιοῦτος
  choice: ang gayong tao
  rationale: Likas sa modernong Tagalog ang “gayong tao” para sa isang indibidwal na may katangiang katatapos banggitin. Bagaman panlalaking isahan ang anyong Griyego, maaaring tumukoy ang parirala sa uri ng taong inilalarawan nang hindi kinakailangang idiin ang kasarian.
- source_word: ἁμαρτάνει
  choice: nagkakasala
  rationale: Ang aspektong di-ganap ng “nagkakasala” ay natural na nagpapahiwatig ng kasalukuyan o nagpapatuloy na gawain nang hindi nagdaragdag ng salitang “patuloy.”
- source_word: ὢν
  choice: at
  rationale: Sa natural na Tagalog, naihahatid ng pang-ugnay na “at” ang malapit na kaugnayan ng huling paglalarawan sa naunang sugnay nang hindi pilit na ginagaya ang participle ng Griyego.
- source_word: αὐτοκατάκριτος
  choice: hinahatulan niya ang kanyang sarili
  rationale: 'Inihahatid nito ang mapanumbalik na diwa ng tambalang salita: ang sariling kalagayan, kilos, o patotoo ng tao ang humahatol laban sa kanya. Pinananatili ng talababa ang posibleng mas estadibong pagbasa.'
theological_decisions:
- issue: Kasarian ng tinutukoy sa ὁ τοιοῦτος
  choice: gayong tao
  alternative: gayong lalaki
  rationale: Bagaman panlalaking isahan ang balarilang Griyego, ang parirala ay tumutukoy sa indibidwal na mapaghati sa konteksto. Sa Tagalog, “tao” ang likas na generic na tawag at hindi nito ikinakaila na isang lalaki ang maaaring tuwirang tinutukoy.
- issue: Diwa ng αὐτοκατάκριτος
  choice: hinahatulan niya ang kanyang sarili
  alternative: hinatulan ng kanyang sarili / nahatulan dahil sa sarili niyang mga gawa
  rationale: Pinananatili nito ang bigat ng sariling paghatol o sariling patotoong laban sa tao, ngunit hindi ito ginagawang tahasang pahayag tungkol sa pangwakas na paghatol ng Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “nalihis na” upang maipakita ang nagresultang kalagayan, at “nagkakasala” upang mapanatili ang di-ganap na aspekto nang walang labis na pagpapakahulugan.
