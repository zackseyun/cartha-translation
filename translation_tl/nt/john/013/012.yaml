  to: Kaya, matapos niyang hugasan ang kanilang mga paa at kunin ang kanyang mga damit, humilig siya sa hapag[a]. Muli niyang sinabi sa kanila, “Nauunawaan ba ninyo kung ano ang ginawa ko para sa inyo[b]?”
