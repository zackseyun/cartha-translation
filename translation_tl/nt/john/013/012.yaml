base_translation:
  language: en
  yaml_path: translation/nt/john/013/012.yaml
  text: So when he had washed their feet and taken his garments and reclined again[a], he said to them[b], “Do you understand what I have done for you?”
translation:
  language: tl
  text: Kaya, matapos niyang hugasan ang kanilang mga paa at kunin ang kanyang mga damit, humilig siya sa hapag[a]. Muli niyang sinabi sa kanila, “Nauunawaan ba ninyo kung ano ang ginawa ko para sa inyo[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “umupo.” Ang pandiwang Griego ay tumutukoy sa paghilig sa hapag ayon sa kaugalian noon.
    reason: lexical_alternative
  - marker: b
    text: O, “sa inyo.” Maaaring ipahayag sa dalawang paraang ito ang datibong Griego.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅτε οὖν
  choice: Kaya matapos
  rationale: Pinagsasama nito ang panandang pasalaysay na οὖν at ang ugnayang temporal ng ὅτε sa natural na modernong Tagalog.
- source_word: ἔνιψεν τοὺς πόδας αὐτῶν
  choice: niyang hugasan ang kanilang mga paa
  rationale: Direkta at likas na salin; ipinakikita ng sugnay na temporal na natapos muna ang paghuhugas bago ang sumunod na mga kilos.
- source_word: ἔλαβεν τὰ ἱμάτια αὐτοῦ
  choice: kinuha niya ang kanyang mga damit
  rationale: Pinananatili ang payak na leksikal na diwa ng ἔλαβεν at ἱμάτια nang hindi tahasang dinaragdagan ng 'isinuot' o 'panlabas.'
- source_word: καὶ ἀνέπεσεν, πάλιν
  choice: at muling humilig sa hapag
  rationale: Sa konteksto ng pagkain, ang ἀναπίπτω ay tumutukoy sa paghilig sa hapag; ginagawang malinaw ng 'sa hapag' ang sinaunang ayos ng pagkain.
- source_word: Γινώσκετε
  choice: Nauunawaan ba ninyo
  rationale: Sa tanong tungkol sa kahulugan ng ginawa ni Jesus, ang 'nauunawaan' ay mas angkop kaysa simpleng 'alam.'
- source_word: τί πεποίηκα ὑμῖν
  choice: kung ano ang ginawa ko para sa inyo
  rationale: Pinananatili ng 'ginawa ko' ang natapos na gawa na may kasalukuyang kabuluhan; ang 'para sa inyo' ay natural na benefaktibong pagbasa sa konteksto, habang itinatala sa talababa ang posibleng 'sa inyo.'
theological_decisions:
- issue: Ayos ng katawan ni Jesus pagkabalik sa hapag
  choice: muling humilig sa hapag
  alternative: muling umupo; muling pumuwesto sa hapag
  rationale: Inilalarawan nito nang mas tumpak ang sinaunang kaugalian ng paghilig habang kumakain, nang hindi nagdaragdag ng doktrinal na interpretasyon.
- issue: Diwa ng datibong ὑμῖν
  choice: para sa inyo
  alternative: sa inyo
  rationale: Ang benefaktibong diwa ay nababagay sa konteksto ng paglilingkod, ngunit tunay na posible rin ang mas pormal na 'sa inyo,' kaya pinananatili iyon sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang 'humilig sa hapag' upang mapanatili ang historikal na larawan; hindi pinalitan ng mas pamilyar ngunit di-gaanong tiyak na 'umupo.'
