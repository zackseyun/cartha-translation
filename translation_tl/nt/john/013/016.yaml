  text: ἀμὴν ἀμὴν λέγω ὑμῖν, οὐκ ἔστιν δοῦλος μείζων τοῦ κυρίου αὐτοῦ οὐδὲ ἀπόστολος μείζων τοῦ πέμψαντος αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/016.yaml
  text: Truly[a], truly, I say to you, a servant is not greater than his master[c][b], nor is an apostle greater than the one who sent him.
translation:
  language: tl
  text: 'Tunay na tunay, sinasabi ko sa inyo: ang alipin[a] ay hindi nakahihigit sa kanyang panginoon[b], ni ang sugo[c] ay nakahihigit sa nagsugo sa kanya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lingkod,” ngunit mas malinaw na ipinahihiwatig ng “alipin” ang pagiging nasa ilalim ng kapangyarihan ng isang panginoon.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “amo.” Ang salitang Griyego ay maaari ring isaling “Panginoon,” ngunit dito ay ginagamit sa paghahambing ng alipin at ng may kapangyarihan sa kanya.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “apostol” o “isinugong kinatawan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Tunay na tunay
  rationale: Pinananatili nito ang pag-uulit at taimtim na diin ng pormulang madalas gamitin sa Juan, habang likas at malinaw sa makabagong Tagalog.
- source_word: λέγω ὑμῖν
  choice: sinasabi ko sa inyo
  rationale: Tuwirang isinasalin ang pormula ng pagsasalita at pinananatili ang anyong pangkasalukuyan.
- source_word: δοῦλος
  choice: alipin
  rationale: Ipinakikita ng salita ang isang taong nasa ilalim ng kapangyarihan ng panginoon, at mahalaga ang matinding ugnayang ito sa paghahambing ng talata.
- source_word: μείζων
  choice: nakahihigit
  rationale: Likas nitong ipinapahayag sa Tagalog ang pagiging mas mataas sa katayuan o awtoridad sa dalawang magkatulad na sugnay.
- source_word: κύριος
  choice: panginoon
  rationale: Ang maliit-na-titik na “panginoon” ay maaaring tumukoy sa taong may kapangyarihan sa alipin at pinananatili rin ang lawak ng salitang Griyego nang hindi ito awtomatikong ginagawang tuwirang titulo.
- source_word: ἀπόστολος
  choice: sugo
  rationale: Sa konteksto, ang pangunahing diwa ay isang taong isinugo o inatasan; malinaw ito sa kasunod na pariralang “nagsugo sa kanya.”
- source_word: τοῦ πέμψαντος αὐτόν
  choice: sa nagsugo sa kanya
  rationale: Likas at maikli itong salin ng articular participle at malinaw na pinananatili ang ugnayan ng sugo at nagsugo.
theological_decisions:
- issue: Ang kahulugan ng κύριος sa paghahambing
  choice: panginoon
  alternative: amo; Panginoon
  rationale: Ang agarang konteksto ay paghahambing ng alipin at may kapangyarihan sa kanya. Ang “panginoon” na maliit ang titik ay angkop sa panlipunang diwa ngunit hindi lubusang isinasara ang mas malawak na pahiwatig ng κύριος.
- issue: Ang kahulugan ng ἀπόστολος
  choice: sugo
  alternative: apostol
  rationale: Dahil ipinaparis ito sa “nagsugo sa kanya,” nangingibabaw rito ang pangkalahatang kahulugan na isang inatasang kinatawan. Iniiwasan ng “sugo” ang hindi kinakailangang paglilimita sa teknikal na katawagang pansimbahan, habang itinatala sa talababa ang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang taimtim na pag-uulit sa pambungad at ang magkatugmang ayos ng dalawang paghahambing.
