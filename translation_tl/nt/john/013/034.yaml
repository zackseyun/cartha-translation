  text: ἐντολὴν καινὴν δίδωμι ὑμῖν ἵνα ἀγαπᾶτε ἀλλήλους, καθὼς ἠγάπησα ὑμᾶς ἵνα καὶ ὑμεῖς ἀγαπᾶτε ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/034.yaml
  text: 'A new commandment I give to you: that you love one another[a]. Just as I loved you[b], you also are to love one another.'
translation:
  language: tl
  text: 'Isang bagong utos ang ibinibigay ko sa inyo: mahalin ninyo ang isa’t isa. Kung paanong minahal ko kayo, mahalin din ninyo ang isa’t isa.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “upang mahalin din ninyo ang isa’t isa.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐντολὴν καινὴν
  choice: isang bagong utos
  rationale: Ang “utos” ang likas at tuwirang katumbas ng ἐντολή sa Filipino, at pinananatili ng “bago” ang di-tiyak na saklaw ng καινός nang hindi ipinapaliwanag kung ang pagiging bago ay sa panahon, katangian, o katuparan.
- source_word: δίδωμι ὑμῖν
  choice: ang ibinibigay ko sa inyo
  rationale: Pinananatili nito ang pangkasalukuyang kilos, ang tahasang tagapagbigay, at ang mga tumatanggap ng utos, habang natural pa rin sa marangal na Filipino.
- source_word: ἵνα ἀγαπᾶτε ἀλλήλους
  choice: mahalin ninyo ang isa’t isa
  rationale: Sa pagkakasunod sa pagbibigay ng utos, ang ἵνα-clause ay naghahayag ng nilalaman ng utos. Ang anyong pautos sa Filipino ay malinaw at natural, at ang “isa’t isa” ay tumpak na nagpapahayag ng gantihang diwa ng ἀλλήλους.
- source_word: καθὼς ἠγάπησα ὑμᾶς
  choice: Kung paanong minahal ko kayo
  rationale: Ang “kung paanong” ay nagpapakita na ang pag-ibig ni Jesus ang huwaran o batayan ng pag-ibig nila, samantalang pinananatili ng “minahal” ang payak na aspektong naganap ng aorist nang hindi nagdaragdag ng paliwanag.
- source_word: ἵνα καὶ ὑμεῖς ἀγαπᾶτε ἀλλήλους
  choice: mahalin din ninyo ang isa’t isa
  rationale: Ipinakikita ng “din ninyo” ang diin ng καὶ ὑμεῖς, at inuulit ang parehong pananalita para sa ἀγαπᾶτε ἀλλήλους gaya ng sa unang sugnay.
theological_decisions:
- issue: Kung sa anong diwa “bago” ang utos
  choice: Iniwan bilang “bagong utos” nang walang dagdag na paliwanag sa pangunahing teksto.
  alternative: Ipaliwanag ito bilang bago sa panahon, bago sa katangian, o bagong naisakatuparan sa halimbawa ni Jesus.
  rationale: Hindi tinutukoy ng mismong talata ang eksaktong diwa ng pagiging bago; ang hindi pagpapalawak rito ay nagpapanatili sa tunay na teolohikal na puwang ng teksto.
- issue: Ugnayan ng ikalawang ἵνα-clause sa naunang pangungusap
  choice: 'Isinalin bilang panibagong pag-uutos: “mahalin din ninyo ang isa’t isa.”'
  alternative: 'Isalin bilang layunin o bunga: “upang mahalin din ninyo ang isa’t isa.”'
  rationale: Maaaring taglayin ng ἵνα ang puwersa ng nilalaman ng utos o ng layunin/bunga. Natural sa Filipino ang pangunahing salin, ngunit iniingatan sa talababa ang alternatibong sintaktikong pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mahalin ninyo ang isa’t isa” sa halip na mas pinaikling “magmahalan kayo” upang mas hayagang mapanatili ang pandiwa, ang pangmaramihang kausap, at ang gantihang pariralang inuulit sa Griyego.
