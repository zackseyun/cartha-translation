  terminology: Ang “utos” ay angkop para sa ἐντολή at pinananatili ang normatibong puwersa nito. Ang “bagong” ay hindi nagpapataw ng paliwanag sa uri ng pagiging bago. Ang “mahalin” ay pare-parehong ginagamit para sa mga anyo ng ἀγαπάω at pinananatili ang mahalagang pag-uulit ng salita.
