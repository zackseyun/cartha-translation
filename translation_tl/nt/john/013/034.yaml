  verdict: approve
  source_fidelity: Tumpak ang salin sa SBLGNT. Naipapahayag ang ἐντολὴν καινήν bilang “isang bagong utos,” ang pangkasalukuyang δίδωμι bilang “ang ibinibigay ko,” at ang dalawang pag-uulit ng ἀγαπᾶτε ἀλλήλους bilang “mahalin ninyo ang isa’t isa.” Ang “Kung paanong minahal ko kayo” ay wastong katumbas ng καθὼς ἠγάπησα ὑμᾶς, at ang “din ninyo” ay sapat na naghahatid ng diin ng καὶ ὑμεῖς.
