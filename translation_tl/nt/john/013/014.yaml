id: JHN.13.14
reference: John 13:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰ οὖν ἐγὼ ἔνιψα ὑμῶν τοὺς πόδας ὁ κύριος καὶ ὁ διδάσκαλος, καὶ ὑμεῖς ὀφείλετε ἀλλήλων νίπτειν τοὺς πόδας·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/014.yaml
  text: If I then[a], the Lord and the Teacher, have washed your feet, you also ought to wash one another’s feet.
translation:
  language: tl
  text: Kaya, kung ako, ang Panginoon[a] at ang Guro, ay naghugas ng inyong mga paa, dapat din ninyong hugasan ang mga paa ng isa’t isa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Amo.”
    reason: Ipinakikita ang posibleng kahulugan ng κύριος sa kontekstong tumutukoy sa may awtoridad, nang hindi inaalis ang karaniwang titulong “Panginoon” sa pangunahing teksto.
lexical_decisions:
- source_word: εἰ οὖν
  choice: Kaya, kung
  rationale: Pinananatili ang kondisyong ipinahihiwatig ng εἰ at ang lohikal na pagbubunga ng οὖν sa likas na ayos ng modernong Tagalog.
- source_word: ἐγὼ
  choice: ako
  rationale: Hayagang pinanatili ang panghalip upang maipahayag ang diin sa ginawa ni Jesus bilang batayan ng obligasyon ng mga alagad.
- source_word: ἔνιψα
  choice: naghugas
  rationale: Tumutukoy sa natapos na gawaing kababanggit lamang; likas sa Tagalog ang aspektong perpektibo rito.
- source_word: ὑμῶν τοὺς πόδας
  choice: inyong mga paa
  rationale: Likas na anyong paari sa Tagalog na tumpak na kumakatawan sa pariralang Griyego.
- source_word: ὁ κύριος
  choice: ang Panginoon
  rationale: Karaniwang salin ng κύριος bilang titulong ginagamit ni Jesus tungkol sa sarili; pinananatili rin nito ang kaibahan ng kaniyang mataas na katayuan at mapagpakumbabang ginawa.
- source_word: ὁ διδάσκαλος
  choice: ang Guro
  rationale: Isinalin bilang titulo at itinambal sa “ang Panginoon,” ayon sa tiyak na anyo ng dalawang pangngalan sa Griyego.
- source_word: καὶ ὑμεῖς
  choice: dapat din ninyo
  rationale: Ipinahahayag ng “din” ang pagtutumbas sa ginawa ni Jesus, samantalang ang hayagang “ninyo” ay nagpapanatili sa diin ng panghalip.
- source_word: ὀφείλετε
  choice: dapat
  rationale: Ipinapahayag ang moral na pananagutan o obligasyon nang hindi ginagawang mas mariing utos kaysa sa anyong Griyego.
- source_word: ἀλλήλων
  choice: ng isa’t isa
  rationale: Karaniwan at malinaw na salin ng panumbalikang panghalip sa Tagalog.
- source_word: νίπτειν τοὺς πόδας
  choice: hugasan ang mga paa
  rationale: Pinananatili ang kongkretong gawa ng paghuhugas ng bahagi ng katawan at hindi ito nilalabnaw bilang pangkalahatang paglilingkod.
theological_decisions:
- issue: Pagpapakahulugan sa κύριος bilang titulo ni Cristo
  choice: ang Panginoon
  alternative: ang Amo
  rationale: Ang “Panginoon” ang karaniwang panumbas sa titulong κύριος at pinananatili ang teolohikal na bigat nito, habang inilalahad sa talababa ang posibleng kahulugang “Amo.”
- issue: Kalikasan ng pananagutan hinggil sa paghuhugas ng paa
  choice: Panatilihin ang kongkretong pananalitang “hugasan ang mga paa ng isa’t isa”
  alternative: maglingkod sa isa’t isa nang may pagpapakumbaba
  rationale: Tuwirang binabanggit ng Griyego ang paghuhugas ng paa. Hindi dapat palitan sa pangunahing teksto ng isang mas malawak na pagpapakahulugan ang mismong gawaing sinasabi ng talata.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ang bahagyang minarkahang apposisyon na “ako, ang Panginoon at ang Guro” ay sadyang nagpapanatili sa diin at pagkakaayos ng Griyego, ngunit nananatiling madaling maunawaan.
