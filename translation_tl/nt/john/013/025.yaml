  terminology: Ang “Panginoon” para sa Κύριε ay wasto at pinananatili ang lawak ng katawagang Griyego. Ang “sino iyon?” ay likas at hindi labis na tinutukoy ang kasarian ng taong hinihingan ng pagkakakilanlan. Ang pangalang “Jesus” ay pinananatili.
