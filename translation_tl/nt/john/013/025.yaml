  text: ⸀ἀναπεσὼν ἐκεῖνος οὕτως ἐπὶ τὸ στῆθος τοῦ Ἰησοῦ λέγει αὐτῷ· Κύριε, τίς ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/john/013/025.yaml
  text: So he[a], leaning back in this way against Jesus' chest, says to him, “Lord, who is it?”
translation:
  language: tl
  text: Kaya, nakahilig[a] siya sa dibdib ni Jesus sa gayong paraan at sinabi niya sa kanya, “Panginoon, sino iyon?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nakasandal sa dibdib ni Jesus.” Ipinakikita ng Griyego ang posisyon sa pagkain noon habang nakahilig sa tabi ng hapag.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναπεσὼν
  choice: sumandal
  rationale: Sa konteksto ng hapunang kinakain habang nakahilig, ipinahihiwatig ng pandiwa ang pagkiling o pagsandal paatras. Likas sa modernong Tagalog ang “sumandal” at malinaw nitong naihahayag ang kilos patungo kay Jesus.
- source_word: ἐκεῖνος
  choice: siya
  rationale: Tumutukoy ang panghalip sa alagad na binanggit sa naunang talata. Hindi na kailangang idagdag ang “alagad,” na wala rito sa tekstong Griyego.
- source_word: οὕτως
  choice: nang gayon
  rationale: Iniuugnay nito ang kilos sa ayos ng pagkakahilig na inilarawan sa naunang talata, nang hindi dinaragdagan ang detalye.
- source_word: ἐπὶ τὸ στῆθος τοῦ Ἰησοῦ
  choice: sa dibdib ni Jesus
  rationale: Ang στῆθος ay tumutukoy sa dibdib. Ang “sa dibdib ni Jesus” ay natural at malinaw sa Tagalog para sa pisikal na posisyong inilalarawan.
- source_word: λέγει αὐτῷ
  choice: sinabi sa kanya
  rationale: Bagaman nasa historical present ang λέγει, karaniwang ginagamit sa salaysay na Tagalog ang nagdaang panahunan upang maging natural ang daloy.
- source_word: Κύριε
  choice: Panginoon
  rationale: Pinananatili ng “Panginoon” kapwa ang magalang na pagtawag kay Jesus at ang mas malawak na teolohikal na saysay ng κύριος sa Ebanghelyo ni Juan.
- source_word: τίς ἐστιν;
  choice: sino iyon?
  rationale: Natural itong tanong sa Tagalog para hingin ang pagkakakilanlan ng taong tinutukoy ni Jesus, habang hindi tahasang nilulutas ang anyo ng ipinahihiwatig na panghalip sa Griyego.
theological_decisions:
- issue: Pagbibigay-kahulugan sa κύριος bilang tuwirang pagtawag kay Jesus
  choice: Panginoon
  alternative: Ginoo
  rationale: Maaaring gumana ang κύριος bilang magalang na tawag, ngunit pinananatili ng “Panginoon” ang teolohikal na lawak ng katawagan sa Juan nang hindi ito nililimitahan sa karaniwang paggalang lamang.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “sumandal” upang mailarawan nang natural ang kilos sa konteksto ng paghilig sa hapag; iniwasan ang labis na pormal o lipas na pananalita.
