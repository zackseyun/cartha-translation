base_translation:
  language: en
  yaml_path: translation/nt/john/013/037.yaml
  text: Peter said to him[a], “Lord[b], why am I not able to follow you now? I will lay down my life for you.”
translation:
  language: tl
  text: Sinabi ni Pedro sa kanya, “Panginoon, bakit hindi ako makasunod sa iyo ngayon? Ibibigay ko ang buhay ko[a] para sa iyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay maaari ring isaling “kaluluwa,” ngunit sa idyomang ito ay tumutukoy ito sa buhay na handang isuko sa kamatayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: Sinabi
  rationale: Ginamit sa Griyego ang makasaysayang pangkasalukuyan, ngunit mas natural sa salaysay na Tagalog ang pangnagdaan.
- source_word: Κύριε
  choice: Panginoon
  rationale: Pinananatili nito ang magalang na pagtawag kay Jesus at ang posibleng teolohikal na bigat ng titulo nang hindi ito labis na binibigyang-kahulugan.
- source_word: διὰ τί οὐ δύναμαί
  choice: bakit hindi ako makasunod
  rationale: Natural na tanong sa Tagalog na malinaw na nagpapahayag ng kawalan ng kakayahan sa sandaling iyon.
- source_word: σοι ἀκολουθῆσαι
  choice: makasunod sa iyo
  rationale: Ang “sumunod” ay nagpapanatili kapuwa sa diwang pagpunta kasunod ni Jesus at sa mas malalim na diwa ng pagiging alagad.
- source_word: ἄρτι
  choice: ngayon
  rationale: Direkta at natural na katumbas ng panandang panahong tumutukoy sa kasalukuyang sandali.
- source_word: τὴν ψυχήν μου
  choice: ang buhay ko
  rationale: Sa pariralang ito, ang ψυχή ay tumutukoy sa buhay na handang isuko sa kamatayan, hindi lamang sa “kaluluwa” bilang hiwalay na konseptong metapisikal.
- source_word: ὑπὲρ σοῦ
  choice: para sa iyo
  rationale: Natural itong Tagalog at hinahayaang manatiling bukas kung ang diin ay alang-alang sa kapakanan ni Jesus o bilang paghahandog para sa kanya.
- source_word: θήσω
  choice: Iaalay ko
  rationale: Sa pagsasama nito sa ψυχή, ipinahihiwatig ng pandiwa ang kusang paghahandog o pagsasakripisyo ng sariling buhay; natural itong naipahahayag sa Tagalog sa “iaalay.”
theological_decisions:
- issue: Kahulugan ng ψυχή sa pahayag ni Pedro
  choice: Isinaling “buhay”
  alternative: kaluluwa
  rationale: Ang konteksto ay ang kahandaan ni Pedro na mamatay para kay Jesus. Ang “kaluluwa” ay maaaring magpahiwatig ng mas makitid na metapisikal na diwa na hindi siyang pangunahing punto rito.
- issue: Saklaw ng kahulugan ng ἀκολουθέω
  choice: Isinaling “sumunod”
  alternative: sumama; pumunta kasunod
  rationale: Pinananatili ng “sumunod” ang tensiyon sa pagitan ng literal na pagsama sa pupuntahan ni Jesus at ng mas malalim na pagsunod bilang alagad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “makasunod sa iyo” upang maging natural sa karaniwang mambabasa habang pinananatili ang literal at pang-alagad na mga pahiwatig ng pandiwang Griyego.
