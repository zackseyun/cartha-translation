  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀εἰδὼς ὅτι πάντα ⸀ἔδωκεν αὐτῷ ὁ πατὴρ εἰς τὰς χεῖρας, καὶ ὅτι ἀπὸ θεοῦ ἐξῆλθεν καὶ πρὸς τὸν θεὸν ὑπάγει,
base_translation:
  language: en
  yaml_path: translation/nt/john/013/003.yaml
  text: Jesus[a], knowing that the Father had given all things into his hands, and that he had come from God and was going to God[b],
translation:
  language: tl
  text: Alam ni Jesus na ibinigay na ng Ama sa kanyang mga kamay ang lahat ng bagay, at na siya ay nagmula sa Diyos[a] at patungo sa Diyos[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lumabas mula sa Diyos.”
    reason: lexical_alternative
  - marker: b
    text: O “pabalik sa Diyos”; payak na sinasabi ng Griyego na siya ay patungo sa Diyos.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰδὼς
  choice: Alam ni Jesus
  rationale: Ang participle ay nagbibigay ng kalagayan o batayan para sa kasunod na kilos. Likas sa modernong Tagalog ang “Alam ni Jesus,” at nililinaw nito ang di-tahasang simuno mula sa konteksto nang hindi dinaragdagan ang kahulugan.
- source_word: πάντα
  choice: ang lahat ng bagay
  rationale: Pinananatili nito ang malawak at komprehensibong saklaw ng neuter plural.
- source_word: ἔδωκεν
  choice: ibinigay na
  rationale: Ipinahihiwatig ng “na” na natapos na ang pagbibigay bago ang kilos sa tagpo, gaya ng ugnayang pandiskurso ng aorist sa participial clause.
- source_word: εἰς τὰς χεῖρας
  choice: sa kanyang mga kamay
  rationale: Pinananatili ang konkretong talinghaga ng kapamahalaan at pagkakatiwala; malinaw at likas din ang idyomang ito sa Tagalog.
- source_word: ὁ πατὴρ
  choice: ang Ama
  rationale: Tapat ito sa articular na titulong “ang Ama” at hindi nagdaragdag ng tahasang pang-angkin na wala sa Griyego.
- source_word: ἀπὸ θεοῦ
  choice: mula sa Diyos
  rationale: Pinananatili ang “Diyos” sa halip na palitan ito ng “Ama,” ayon sa mismong pananalita ng Griyego.
- source_word: ἐξῆλθεν
  choice: nanggaling
  rationale: Natural nitong ipinahahayag ang pinagmulan o pinanggalingan ni Jesus, habang ang mas literal na diwang “lumabas” ay inilalagay sa talababa.
- source_word: πρὸς τὸν θεὸν
  choice: sa Diyos
  rationale: Direkta nitong ipinahahayag ang patutunguhan nang hindi idinaragdag ang relasyonal na paliwanag na “upang makasama ang Diyos.”
- source_word: ὑπάγει
  choice: patungo
  rationale: Natural sa sugnay na ito at pinananatili ang kasalukuyan o nalalapit na pag-alis nang hindi tahasang idinaragdag ang “pabalik.”
theological_decisions:
- issue: Wika tungkol sa pinagmulan ni Cristo sa ἀπὸ θεοῦ ἐξῆλθεν
  choice: siya ay nanggaling sa Diyos
  alternative: siya ay lumabas mula sa Diyos
  rationale: Pinananatili nito ang mariing pahayag ni Juan tungkol sa pinagmulan at misyon ni Jesus, ngunit hindi ito pinapalawak tungo sa isang doktrinal na pormulang hindi tahasang nasa talata.
- issue: Wika tungkol sa patutunguhan sa πρὸς τὸν θεὸν ὑπάγει
  choice: patungo sa Diyos
  alternative: pabalik sa Diyos
  rationale: Ang “pabalik” ay maaaring maunawaan mula sa mas malawak na konteksto, ngunit hindi ito tahasang nasa sugnay. Kaya pinananatili ng pangunahing teksto ang payak na patutunguhan at ang tunay na antas ng pahiwatig.
translation_notes:
  register: Modernong Filipino Tagalog na simple, marangal, at madaling maunawaan. Pinanatili ang konkretong idyomang “sa kanyang mga kamay” at ang pamagat na “ang Ama.” Ang pangwakas na kuwit ay nagpapakitang nagpapatuloy ang pangungusap sa kasunod na talata.
