id: JHN.13.9
reference: John 13:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: λέγει αὐτῷ Σίμων Πέτρος· Κύριε, μὴ τοὺς πόδας μου μόνον ἀλλὰ καὶ τὰς χεῖρας καὶ τὴν κεφαλήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/009.yaml
  text: Simon Peter says to him[a], “Lord, not only my feet, but also my hands and my head.”
translation:
  language: tl
  text: Sinabi sa kanya ni Simon Pedro, “Panginoon,[a] hindi lamang ang mga paa ko, kundi pati ang mga kamay at ulo ko!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “Guro.” Sa Griyego: Kyrios.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: Sinabi
  rationale: Ginamit ang likas na nakaraang panahunan sa salaysay na Tagalog para sa Griyegong historical present; napapanatili ang pangyayaring isinasalaysay nang hindi nagiging artipisyal ang daloy.
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Tuwirang pinanatili ang panghalip ng Griyego sa halip na tahasang idagdag ang pangalang Jesus.
- source_word: Σίμων Πέτρος
  choice: Simon Pedro
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa modernong salin ng Bibliya sa Tagalog.
- source_word: Κύριε
  choice: Panginoon
  rationale: Pinananatili nito ang magalang na pagtawag at ang mas malawak na teolohikal na bisa ng κύριος sa Juan.
- source_word: μὴ ... μόνον ἀλλὰ καὶ
  choice: hindi lamang ... kundi pati
  rationale: 'Likas na katumbas sa Tagalog ng contrastive extension: hindi ang unang bagay lamang, kundi kasama rin ang mga sumunod.'
- source_word: τοὺς πόδας μου
  choice: ang mga paa ko
  rationale: Tuwirang salin ng maramihang pangngalan at panghalip na paari.
- source_word: τὰς χεῖρας
  choice: ang mga kamay
  rationale: Pinananatili ang maramihang anyo; ang paari ay likas na saklaw ng magkakaugnay na parirala at ipinahahayag sa hulí bilang “ko.”
- source_word: τὴν κεφαλήν
  choice: ulo ko
  rationale: Karaniwang kahulugan ng κεφαλή; ang “ko” ay natural na sumasaklaw sa mga kamay at ulo sa koordinasyong Tagalog.
theological_decisions:
- issue: Pagtawag kay Jesus bilang κύριος
  choice: Panginoon
  alternative: Guro
  rationale: Ang “Panginoon” ang karaniwang katumbas na nagpapanatili kapuwa ng paggalang sa kausap at ng posibleng mas malalim na kabuluhang teolohikal, nang hindi nilulutas nang sapilitan ang saklaw ng titulo sa mismong konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Sinabi” sa halip na literal na kasalukuyang “sinasabi” dahil iyon ang natural na paraan ng pagsasalaysay sa Tagalog; ang tandang padamdam ay umaayon sa mariing tugon ni Pedro.
