translation:
  language: tl
  text: Kung alam ninyo ang mga bagay na ito, mapalad kayo[a] kung isinasagawa ninyo ang mga ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinagpala,” “maligaya,” o “masuwerte.” Ang salitang Griyego ay tumutukoy sa isang kanais-nais at mabuting kalagayan, hindi lamang sa pakiramdam ng saya.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: Kung
  rationale: Tuwirang ipinapahayag ang kondisyon sa unang sugnay at pinananatili ang anyong pasubali ng Griyego.
- source_word: ταῦτα
  choice: ang mga bagay na ito
  rationale: Pinananatili ang pangmaramihang demonstratibo, na tumutukoy sa naunang halimbawa at turo ni Jesus.
- source_word: οἴδατε
  choice: alam ninyo
  rationale: Tuwirang katumbas ng pandiwang tumutukoy sa kaalaman o pagkabatid; hindi ito pinalawak tungo sa mas interpretatibong “nauunawaan.”
- source_word: μακάριοί ἐστε
  choice: pinagpala kayo
  rationale: Likas at marangal na salin na naghahayag ng kalagayang may pagpapala, hindi lamang ng pansariling damdamin ng saya.
- source_word: ἐὰν
  choice: kung
  rationale: Ipinakikita ang contingent na kondisyon ng pagsasagawa; natural ito sa modernong Tagalog.
- source_word: ποιῆτε
  choice: ginagawa ninyo
  rationale: Ipinahihiwatig ng aspektong pangkasalukuyan ang aktuwal o patuloy na pagsasabuhay, nang hindi dinaragdagan ang kahulugan ng pandiwa.
- source_word: αὐτά
  choice: ang mga ito
  rationale: Malinaw na ibinabalik ang panghalip sa “mga bagay na ito”; natural sa Tagalog ang bahagyang pag-uulit.
theological_decisions:
- issue: Pagbibigay-kahulugan sa μακάριοι sa konteksto ng pagiging alagad
  choice: pinagpala
  alternative: maligaya; mapalad
  rationale: Pinananatili ng “pinagpala” ang biblikal at teolohikal na bigat ng isang mabuting kalagayan o paglingap, sa halip na limitahan ito sa damdamin ng kaligayahan. Inilalahad sa talababa ang tunay na saklaw ng salita nang hindi ipinipilit na tahasang binanggit sa talata ang Diyos bilang tagapagpala.
translation_notes:
  register: Modernong Filipino Tagalog na simple, marangal, at madaling maunawaan. Pinanatili ang magkatambal na kondisyong “kung … kung” at ang pangmaramihang pagtukoy ng ταῦτα/αὐτά.
