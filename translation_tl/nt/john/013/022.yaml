  text: The disciples were looking at one another, at a loss about whom he was speaking.
translation:
  language: tl
  text: Nagkakatinginan ang mga alagad, litó kung sino ang tinutukoy niya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Nagkakatinginan ang mga alagad sa isa’t isa, naguguluhan kung sino ang pinag-uusapan niya.”
    reason: Ipinakikita ng alternatibo ang gantihang direksiyon ng εἰς ἀλλήλους nang tahasan at gumagamit ng “pinag-uusapan” bilang mas malapit na idiomatikong pagpapahayag ng περὶ τίνος λέγει.
lexical_decisions:
- source_word: ἔβλεπον
  choice: Nagtinginan
  rationale: Ipinahihiwatig ng aspektong imperpektibo ang nagpapatuloy o paulit-ulit na kilos; likas na ipinapahayag ng “nagtinginan” sa Filipino ang sabayang pagtingin sa isa't isa sa tagpong ito.
- source_word: εἰς ἀλλήλους
  choice: ang isa't isa (nakapaloob sa “nagtinginan”)
  rationale: Ang parirala ay tumutukoy sa gantihang pagtingin ng mga alagad; likas na naipapaloob ito sa pandiwang Filipino na “nagtinginan.”
- source_word: οἱ μαθηταὶ
  choice: ang mga alagad
  rationale: Tumutukoy ang artikulo sa kilalang pangkat sa konteksto; hindi idinagdag ang “niya” sapagkat hindi ito tahasang nasa Griyego.
- source_word: ἀπορούμενοι
  choice: na litó
  rationale: Ipinapahayag ng participle ang pagkalito at kawalan ng katiyakan; maikli, natural, at malinaw ang “na litó” para sa karaniwang mambabasa.
- source_word: περὶ τίνος
  choice: kung sino ang tinutukoy
  rationale: Nagtatanong ito tungkol sa taong pinag-uusapan. Sa Filipino, natural na naihahayag ang ugnayan sa “kung sino ang tinutukoy,” nang hindi tinutukoy ang pagkakakilanlan.
- source_word: λέγει
  choice: tinutukoy niya
  rationale: Bagaman literal na “sinasabi/pinagsasalitaan,” mas natural sa di-tuwirang tanong sa Filipino ang “tinutukoy niya”; nananatili ang diwa ng taong pinag-uusapan nang hindi nilulutas kung sino iyon.
theological_decisions: []
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang payak na “mga alagad” at ang idiomatikong “nagtinginan”; ang tuldik sa “litó” ay tumutulong upang malinaw ang bigkas. Ang talababa ay nagpapanatili ng mas literal na alternatibo at ng duratibong puwersa ng pandiwa.
