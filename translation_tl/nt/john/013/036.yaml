  verdict: revise
  source_fidelity: 'Kailangang itama ang ayos ng unang pangungusap: ang “Sinabi sa kanya ni Simon Pedro” ay hindi likas at maaaring magpalabo sa tungkulin ng “sa kanya.” Pinanatili ng rebisyon ang kasalukuyang anyong pasalaysay ng Λέγει sa pamamagitan ng “Sinabi,” na katanggap-tanggap na nakaraang-aspektong Tagalog na salaysay. Ang “hindi mo ako kayang sundan ngayon” ay tuwirang naghahayag ng kakayahan (δύνασαι), ng “ngayon” (νῦν), at ng pagsunod kay Jesus (μοι). Ang “kalaunan” ay mas tumpak na katumbas ng ὕστερον kaysa “sa bandang huli,” na maaaring magpahiwatig ng wakas o huling yugto.'
  naturalness: Mas natural sa modernong Filipino Tagalog ang “Sinabi ni Simon Pedro sa kanya.” Inalis ang “pa” sa “hindi mo pa ako kayang sundan ngayon,” sapagkat bagaman hindi mali, ang sabayang “pa” at “ngayon” ay hindi kailangan at ang pagkaantala ay malinaw na sa kasunod na “ngunit ... kalaunan.”
  terminology: Ang “Panginoon” para sa Κύριε ay angkop. Pinanatili ang magalang na “kayo” sa pagtawag ni Pedro kay Jesus at ang karaniwang “mo/ka” sa tugon ni Jesus kay Pedro. Ang “susunod ka sa akin” ay malinaw na pinananatili ang implicit na layon ng ἀκολουθήσεις.
