source:
  edition: SBLGNT
  text: Λέγει αὐτῷ Σίμων Πέτρος· Κύριε, ποῦ ὑπάγεις; ⸀ἀπεκρίθη Ἰησοῦς· Ὅπου ὑπάγω οὐ δύνασαί μοι νῦν ἀκολουθῆσαι, ⸂ἀκολουθήσεις δὲ ὕστερον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/036.yaml
  text: Simon Peter says to him[a], “Lord, where are you going?” Jesus answered, “Where I am going, you are not able to follow me now[b], but you will follow later.”
translation:
  language: tl
  text: Sinabi ni Simon Pedro sa kanya, “Panginoon, saan kayo pupunta?” Sumagot si Jesus, “Sa pupuntahan ko, hindi mo ako kayang sundan ngayon,[a] ngunit susunod ka sa akin kalaunan.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hindi mo ako masusundan ngayon.” Tahasang gumagamit ang Griyego ng pandiwang nagsasaad ng kakayahan.
    reason: lexical_alternative
  - marker: b
    text: Ang “susunod ka sa akin kalaunan” ay maaaring tumukoy sa pagsunod ni Pedro kay Jesus sa pagdurusa o kamatayan; hindi tinutukoy ng mismong pananalita kung paano.
    reason: cross_reference
lexical_decisions:
- source_word: Λέγει
  choice: Sinabi
  rationale: Ginamit ang likas na aspektong pangkuwento sa modernong Tagalog; bagaman pangkasalukuyan ang anyong Griyego bilang historical present, mas natural at marangal sa salaysay ang “Sinabi.”
- source_word: Κύριε
  choice: Panginoon
  rationale: Karaniwang salin ng tuwirang pagtawag na κύριε, na nagpapanatili ng paggalang at teolohikal na bigat ng titulo.
- source_word: ποῦ ὑπάγεις
  choice: saan kayo pupunta
  rationale: Natural na Tagalog para sa direksiyon ng pag-alis; ang “kayo” ay magalang na panghalip sa tuwirang pakikipag-usap kay Jesus.
- source_word: ἀπεκρίθη Ἰησοῦς
  choice: Sumagot si Jesus
  rationale: Maikli, malinaw, at karaniwang anyo sa diyalogo.
- source_word: Ὅπου ὑπάγω
  choice: Sa pupuntahan ko
  rationale: Pinananatili ang ugnayang pandiwa sa tanong ni Pedro nang hindi tinutukoy kung anong lugar o kalagayan ang tinutukoy.
- source_word: οὐ δύνασαί μοι νῦν ἀκολουθῆσαι
  choice: hindi mo pa ako kayang sundan ngayon
  rationale: Ang “kayang” ay tahasang nagpapanatili sa diwa ng kakayahan ng δύναμαι; ang “pa” at “ngayon” ay likas na nagpapakita ng pansamantalang kalagayan nang hindi binabago ang kontrast sa susunod na sugnay.
- source_word: ἀκολουθήσεις δὲ ὕστερον
  choice: ngunit susunod ka sa bandang huli
  rationale: Pinananatili ang panghinaharap at ang kontrast ng δέ; ang “sa bandang huli” ay hindi nagtatakda kung gaano katagal o sa anong paraan magaganap ang pagsunod.
theological_decisions:
- issue: Kahulugan ng pagsunod ni Pedro sa hinaharap
  choice: Hindi tinukoy sa pangunahing teksto kung ang pagsunod ay pagkamartir, muling pagpapatuloy bilang alagad, o pagsunod kay Jesus tungo sa kamatayan o kaluwalhatian.
  alternative: Tahasan itong iugnay sa pagkamartir ni Pedro o sa pagpapanumbalik sa kanya pagkatapos ng muling pagkabuhay.
  rationale: Sinasabi lamang ng Griyego na hindi siya makasusunod ngayon ngunit susunod siya sa bandang huli; dapat manatiling bukas ang teolohikal at pasalaysay na pahiwatig.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang magalang na “kayo” sa tanong ni Pedro kay Jesus, samantalang “mo/ka” ang sagot ni Jesus kay Pedro. Iniwasan ang salitang magtatakda sa eksaktong kahulugan ng hinaharap na pagsunod.
