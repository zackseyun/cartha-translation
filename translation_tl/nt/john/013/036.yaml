  to: Sinabi ni Simon Pedro sa kanya, “Panginoon, saan kayo pupunta?” Sumagot si Jesus, “Sa pupuntahan ko, hindi mo ako kayang sundan ngayon,[a] ngunit susunod ka sa akin kalaunan.”[b]
  rationale: Inayos ang sintaks ng pambungad na salaysay, pinasimple ang pagpapahayag ng pansamantalang kawalan ng kakayahan nang walang dagdag na aspektong hindi kailangan, at pinalitan ang “sa bandang huli” ng “kalaunan” upang mapanatiling bukas ang saklaw ng ὕστερον. Nananatiling hindi tinutukoy ng teksto kung paano magaganap ang hinaharap na pagsunod ni Pedro.
