base_translation:
  language: en
  yaml_path: translation/nt/john/013/008.yaml
  text: Peter said to him[a], “You will never wash my feet.” Jesus answered him, “If I do not wash you, you have no share with me.”
translation:
  language: tl
  text: Sinabi ni Pedro sa kanya, “Hinding-hindi mo huhugasan ang mga paa ko.” Sumagot si Jesus sa kanya, “Kung hindi kita hugasan, wala kang bahagi sa akin.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “wala kang bahagi sa piling ko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ μὴ νίψῃς … εἰς τὸν αἰῶνα
  choice: Hinding-hindi mo huhugasan
  rationale: Pinagsasama ng οὐ μή at εἰς τὸν αἰῶνα ang mariing pagtanggi sa isang kilos sa hinaharap. Likas at malinaw na ipinahahayag ito ng “hinding-hindi” sa modernong Tagalog.
- source_word: μου τοὺς πόδας
  choice: ang mga paa ko
  rationale: Tuwirang ipinahahayag ng Griyego ang maramihang layon at ang pagmamay-ari; natural sa Tagalog ang “ang mga paa ko.”
- source_word: νίψῃς / νίψω
  choice: huhugasan / hugasan
  rationale: Ang νίπτω ay karaniwang tumutukoy sa paghuhugas ng bahagi ng katawan. Sapat ang “hugasan” at hindi na dinaragdagan ng ideyang “linisin,” na hindi tahasang nasa teksto.
- source_word: ἀπεκρίθη
  choice: Sumagot
  rationale: Karaniwang pandiwang pasalaysay ito para sa tugon at natural sa salaysay ng Ebanghelyo.
- source_word: Ἐὰν μὴ νίψω σε
  choice: Kung hindi kita hugasan
  rationale: Pinananatili nito ang tahasang kondisyong “kung hindi” at ang personal na layon na si Pedro.
- source_word: οὐκ ἔχεις μέρος μετ’ ἐμοῦ
  choice: wala kang bahaging kasama ko
  rationale: Pinananatili ng “bahagi” ang malawak na saklaw ng μέρος, samantalang ang “kasama ko” ay tumutugma sa μετά na nagpapahiwatig ng pakikisama o kaugnayan, hindi “sa loob ko.”
theological_decisions:
- issue: Kahulugan ng pagkakaroon ng μέρος kasama ni Jesus
  choice: Ipinahayag bilang pagkakaroon ng “bahaging kasama” ni Jesus nang hindi nililinaw nang higit sa teksto ang eksaktong paraan nito.
  alternative: Unawain ito nang tiyak bilang sakramental na paglilinis, sagisag lamang ng mapagpakumbabang paglilingkod, o tuwirang pormula tungkol sa kaligtasan.
  rationale: Sinasabi ng talata na kailangan ang paghuhugas ni Jesus upang magkaroon si Pedro ng bahagi kasama niya, ngunit hindi tinutukoy ng mismong pangungusap ang eksaktong teolohikal na mekanismo. Kaya pinananatili ang tensiyon at lawak ng pahayag.
translation_notes:
  register: Modernong Filipino Tagalog na simple, marangal, at angkop sa salaysay. Ginamit ang “hinding-hindi” upang natural na maipahayag ang mariing pagtanggi ni Pedro. Ang “bahaging kasama ko” ay bahagyang di-karaniwang parirala ngunit mas malinaw na pinananatili ang literal na ugnayan ng μέρος at μετά; inilagay sa talababa ang mas pamilyar na “bahagi sa akin.”
