id: JHN.13.2
reference: John 13:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ δείπνου ⸀γινομένου, τοῦ διαβόλου ἤδη βεβληκότος εἰς τὴν καρδίαν ⸂ἵνα παραδοῖ αὐτὸν Ἰούδας Σίμωνος ⸀Ἰσκαριώτου⸃,
base_translation:
  language: en
  yaml_path: translation/nt/john/013/002.yaml
  text: And during supper[a], when the devil had already put it into the heart of Judas Iscariot, Simon's son, to betray him[c][b],
translation:
  language: tl
  text: At habang naghahapunan sila[a], naitanim na ng diyablo sa puso ni Judas Iscariote, na anak ni Simon, ang balak na ipagkanulo si Jesus[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “habang nagaganap ang hapunan.” Hindi sinasabi ng Griyego na tapos na ang hapunan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “inilagay na ng diyablo sa puso ni Judas na ibigay niya siya.” O “sinulsulan na ng diyablo si Judas.”
    reason: lexical_alternative
  - marker: c
    text: O “ibigay si Jesus” o “ipasa si Jesus.” Sa kontekstong ito, ipinahahayag ng “ipagkanulo” ang diwa ng pananalita. Maaari ring unawain ang pangalan bilang “Judas, na anak ni Simon Iscariote.”
    reason: alternative_reading
lexical_decisions:
- source_word: δείπνου γινομένου
  choice: habang naghahapunan sila
  rationale: Ipinahahayag ng genitive absolute ang kasabay na pangyayari. Likas ito sa modernong Tagalog at hindi nagpapahiwatig na tapos na ang hapunan.
- source_word: διάβολος
  choice: diyablo
  rationale: Sa salaysay ni Juan, tumutukoy ito sa personal na masamang nilalang; ang kinikilalang titulong “diyablo” ang malinaw na katumbas.
- source_word: ἤδη βεβληκότος εἰς τὴν καρδίαν
  choice: naitanim na ... sa puso ... ang balak
  rationale: Ang idyoma ay tumutukoy sa paglalagay o pagkikintal ng isang hangarin. Pinananatili ng “naitanim ... sa puso” ang talinghaga, samantalang nililinaw ng “ang balak” ang ipinahihiwatig na layon sa natural na Tagalog.
- source_word: καρδίαν
  choice: puso
  rationale: Pinananatili nito ang biblikal na talinghaga para sa kalooban at intensiyon, hindi lamang sa damdamin.
- source_word: ἵνα παραδοῖ
  choice: ang balak na ipagkanulo
  rationale: Sa konteksto ni Judas, ang παραδίδωμι ay may puwersang “ipagkanulo,” habang ang pagkakabuo ay natural na naghahayag ng layon sa Tagalog.
- source_word: αὐτόν
  choice: si Jesus
  rationale: Bagaman panghalip lamang ang Griyego, mas malinaw at natural sa hiwalay na talata ang tahasang pagtukoy kay Jesus, nang walang pagbabago sa tinutukoy.
- source_word: Ἰούδας Σίμωνος Ἰσκαριώτου
  choice: Judas Iscariote, na anak ni Simon
  rationale: May tekstuwal at sintaktikong kalabuan kung inuugnay ang “Iscariote” kay Judas o kay Simon. Ang pangunahing teksto ay sumusunod sa karaniwang pagkakakilanlan kay Judas bilang Iscariote, at inilalahad ng talababa ang alternatibong pagkakaugnay.
theological_decisions:
- issue: Ang pagkilos ng diyablo at pananagutan ni Judas
  choice: Inilalarawan ang diyablo bilang nagtanim ng balak sa puso ni Judas, ngunit si Judas pa rin ang gagawa ng pagkakanulo.
  alternative: “sinulsulan na ng diyablo si Judas” o pananalitang ginagawang tanging kumikilos ang diyablo
  rationale: Iniuugnay ng Griyego sa diyablo ang masamang impluwensiya ngunit hindi inaalis ang sariling pagkilos ni Judas. Pinananatili ng salin ang tensiyong ito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “habang naghahapunan sila” para sa natural na daloy, “diyablo” bilang nakaugaliang titulong biblikal, at “ipagkanulo” para sa kontekstuwal na puwersa ng παραδίδωμι. Ang lahat ng talababa ay may katumbas na pananda sa pangunahing teksto.
