id: JHN.13.18
reference: John 13:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὐ περὶ πάντων ὑμῶν λέγω· ἐγὼ οἶδα ⸀τίνας ἐξελεξάμην· ἀλλ’ ἵνα ἡ γραφὴ πληρωθῇ· Ὁ τρώγων ⸀μου τὸν ἄρτον ἐπῆρεν ἐπ’ ἐμὲ τὴν πτέρναν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/018.yaml
  text: 'I am not speaking about all of you[a]. I know whom I have chosen[c][b]. But this is so that the Scripture may be fulfilled: ‘The one who eats my bread has lifted up his heel against me.’'
translation:
  language: tl
  text: 'Hindi ako nagsasalita tungkol sa inyong lahat. Alam ko kung sinu-sino ang pinili ko. Ngunit ito ay upang matupad ang Kasulatan: “Ang kumakain ng tinapay ko ay nagtaas ng kanyang sakong laban sa akin.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sipi o alusyon sa Awit 41:9.
    reason: cross_reference
  - marker: b
    text: Ang “nagtaas ng kanyang sakong laban sa akin” ay isang matalinghagang pahayag ng pagkapoot at pagtataksil.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ περὶ πάντων ὑμῶν λέγω
  choice: Hindi ako nagsasalita tungkol sa inyong lahat
  rationale: Likas sa makabagong Tagalog at pinananatili ang saklaw ng pagtanggi at ang diwa ng περὶ bilang “tungkol sa.”
- source_word: οἶδα
  choice: Alam ko
  rationale: Bagaman perpektong anyo sa Griyego, pangkasalukuyan ang gamit ng οἶδα sa Koine.
- source_word: τίνας ἐξελεξάμην
  choice: kung sinu-sino ang pinili ko
  rationale: Ipinahahayag ang maramihang personal na layon ng τίνας at tuwirang isinasalin ang ἐκλέγομαι bilang “pinili,” nang hindi nilulutas ang teolohikal na saklaw nito.
- source_word: ἀλλ’ ἵνα ἡ γραφὴ πληρωθῇ
  choice: Ngunit ito ay upang matupad ang Kasulatan
  rationale: Pinananatili ang ugnayang layunin o kinalabasan ng ἵνα at ang pormulang katuparan, nang hindi nagdaragdag ng paliwanag hinggil sa sanhi o determinismo.
- source_word: Ὁ τρώγων μου τὸν ἄρτον
  choice: Ang kumakain ng tinapay ko
  rationale: Natural na ginagawang sugnay sa Tagalog ang substantival participle at iniuugnay ang μου sa ἄρτον bilang “tinapay ko.”
- source_word: ἐπῆρεν ἐπ’ ἐμὲ τὴν πτέρναν αὐτοῦ
  choice: ay nagtaas ng kanyang sakong laban sa akin
  rationale: Pinananatili ang matalinghagang larawan mula sa Awit sa halip na palitan ito ng tahasang “nagkanulo,” habang malinaw sa Tagalog ang kilos ng pagkapoot o pagtataksil.
theological_decisions:
- issue: Ugnayan ng pagpili ni Jesus sa magkakanulo
  choice: Tuwirang isalin ang ἐξελεξάμην bilang “pinili ko” nang walang dagdag na paliwanag tungkol sa uri ng pagpili.
  alternative: Tukuyin ito bilang pagpili para sa kaligtasan lamang o bilang paghirang sa pagkaapostol lamang.
  rationale: Hindi mismo nililinaw ng talata ang teolohikal na kategorya ng pagpili; pinananatili ng salin ang tensiyon sa konteksto nang hindi nagpapasok ng natatanging doktrina.
- issue: Lakas ng ἀλλ’ ἵνα kaugnay ng pagtataksil at Kasulatan
  choice: “Ngunit ito ay upang matupad ang Kasulatan”
  alternative: “Ngunit nangyari ito dahil kailangang magkatotoo ang Kasulatan.”
  rationale: Pinananatili nito ang wika ng katuparan at ang posibleng diwa ng layunin o kinalabasan, ngunit hindi dinaragdagan ang teksto ng mas mariing pahayag tungkol sa sanhi.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang metapora ng “sakong” dahil mahalaga ito sa sipi ng Kasulatan, at ipinaliwanag sa talababa sa halip na palitan ng interpretatibong paraphrase.
