  yaml_path: translation/nt/john/013/024.yaml
  text: So Simon Peter motioned to this one to ask who it might be about whom he was speaking[a].
translation:
  language: tl
  text: Kaya sinenyasan ni Simon Pedro ang alagad na iyon na itanong kung sino ang tinutukoy ni Jesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas pormal: “Kaya sinenyasan ni Simon Pedro ang alagad na ito na magtanong kung sino kaya ang tinutukoy niya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: νεύει
  choice: sinenyasan
  rationale: Tumutukoy ito sa di-berbal na pagbibigay ng hudyat o senyas. Natural sa modernong Filipino ang “sinenyasan” at hindi nito nililimitahan ang kilos sa pagtango lamang.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinapakita rito ang bunga o pagpapatuloy ng salaysay mula sa naunang talata; malinaw at likas ang “Kaya” sa konteksto.
- source_word: τούτῳ
  choice: ang alagad na iyon
  rationale: Ang demonstratibo ay tumutukoy sa alagad na kababanggit lamang. Ang paglalantad sa tinutukoy bilang “alagad” ay natural sa Filipino at nananatiling nakaugat sa konteksto.
- source_word: πυθέσθαι
  choice: na itanong
  rationale: 'Ipinahahayag ng infinitive ang layunin o nilalaman ng senyas ni Pedro: ang alagad ay magtanong.'
- source_word: τίς ἂν εἴη
  choice: kung sino
  rationale: Sa Filipino, sapat at natural ang “kung sino” sa di-tuwirang tanong; ang likas na kawalang-katiyakan ng tanong ay hindi nangangailangan ng pilit na katumbas ng ἄν at optative.
- source_word: περὶ οὗ λέγει
  choice: ang tinutukoy ni Jesus
  rationale: Idyomatikong ipinapahayag nito sa Filipino ang “kung tungkol kanino siya nagsasalita.” Ginawang tahasan ang “Jesus” upang maiwasan ang malabong reperensiya ng panghalip, nang hindi binabago ang tinutukoy sa konteksto.
