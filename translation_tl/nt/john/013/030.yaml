id: JHN.13.30
reference: John 13:30
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: λαβὼν οὖν τὸ ψωμίον ἐκεῖνος ⸂ἐξῆλθεν εὐθύς⸃. ἦν δὲ νύξ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/030.yaml
  text: So after taking the piece of bread[a], he went out immediately[c][b]. And it was night.
translation:
  language: tl
  text: Kaya, matapos kunin ang piraso ng tinapay[a], agad na lumabas ang taong iyon.[b] At gabi na noon.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang subo” o “ang piraso.” Ang Griyegong ψωμίον ay tumutukoy sa maliit na piraso ng tinapay o pagkain na ibinigay sa hapunan.
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “ang isang iyon”; mas mariin ito kaysa sa payak na “siya” at itinutuon ang pansin kay Judas.
    reason: lexical_alternative
  - marker: c
    text: Ang pagbanggit ni Juan na gabi na noon ay literal na pagtukoy sa oras at maaari ring umalingawngaw sa tema ng liwanag at kadiliman sa Ebanghelyo.
    reason: cross_reference
lexical_decisions:
- source_word: λαβὼν
  choice: matapos kunin
  rationale: Ipinahahayag nang natural sa Tagalog ang naunang kilos ng aorist participle at pinananatili ang pagkakasunod ng pagkuha at paglabas.
- source_word: οὖν
  choice: Kaya
  rationale: Ang οὖν ay nag-uugnay sa pangyayari sa naunang salaysay at maaaring magpahiwatig ng bunga o pagpapatuloy; ang “Kaya” ay maikli at natural.
- source_word: τὸ ψωμίον
  choice: ang piraso ng tinapay
  rationale: Ang ψωμίον ay tumutukoy sa maliit na piraso ng tinapay o pagkain; malinaw at karaniwan sa makabagong Tagalog ang saling ito.
- source_word: ἐκεῖνος
  choice: ang taong iyon
  rationale: Pinananatili nito ang mariing demonstratibong pagtukoy kay Judas sa halip na gawing payak na “siya.”
- source_word: ἐξῆλθεν
  choice: lumabas
  rationale: Tuwirang pinananatili ang diwang panlunan ng ἐξέρχομαι na paglabas.
- source_word: εὐθύς
  choice: agad
  rationale: Likas at eksaktong ipinahahayag ang dagliang pagkilos.
- source_word: ἦν δὲ νύξ
  choice: At gabi na noon
  rationale: Pinananatili ang payak na pagtukoy sa oras at ang maikli ngunit matimbang na bisa ng pangungusap, nang hindi ipinapasok sa salin ang posibleng simbolismo.
theological_decisions:
- issue: Posibleng simbolikong kahulugan ng “gabi” sa Ebanghelyo ni Juan
  choice: 'Isinalin ito bilang literal na pahayag tungkol sa oras: “At gabi na noon.”'
  alternative: Ipaliwanag sa pangunahing teksto na ang gabi ay sagisag ng espirituwal na kadiliman.
  rationale: Payak na pahayag tungkol sa oras ang Griyego, bagaman maaaring umalingawngaw rito ang tema ni Juan tungkol sa liwanag at kadiliman. Pinananatili ng salin ang parehong literal na saysay at posibilidad ng pahiwatig nang hindi ito ipinapaliwanag sa pangunahing teksto.
- issue: Mariing bisa ng ἐκεῖνος bilang pagtukoy kay Judas
  choice: “ang taong iyon”
  alternative: “siya”
  rationale: Ang demonstratibo ay higit na mariin kaysa karaniwang panghalip at maaaring lumilikha ng distansiya sa salaysay. Pinananatili ito nang walang idinaragdag na doktrinal na pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “matapos kunin” at “agad na lumabas” para sa natural na daloy, habang pinanatili ng “ang taong iyon” ang mariing demonstratibo ng Griyego. Ang maikling huling pangungusap ay sadyang nagpapanatili sa payak at masidhing himig ng orihinal.
