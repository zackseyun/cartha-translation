base_translation:
  language: en
  yaml_path: translation/nt/john/013/027.yaml
  text: And after the piece of bread[a], then Satan entered into him. So Jesus said to him, “What you are doing[b], do more quickly.”
translation:
  language: tl
  text: At nang matanggap niya ang piraso ng tinapay[a], saka pumasok sa kanya si Satanas. Kaya sinabi sa kanya ni Jesus, “Ang ginagawa mo, gawin mo nang mas mabilis.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “subo.” Ang salitang Griyego ay tumutukoy sa maliit na piraso ng pagkain—dito, malamang na sa isinawsaw na tinapay na ibinigay sa hapunan.
    reason: lexical_alternative
  - marker: b
    text: O “gawin mo agad.” Pahambing ang anyo ng salitang Griyego (“mas mabilis”), bagaman maaari itong ipahayag nang mas natural bilang “agad.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ψωμίον
  choice: piraso ng tinapay
  rationale: Tumutukoy ito sa isang maliit na piraso ng pagkain at, sa konteksto, sa tinapay na ibinigay sa hapunan. Malinaw at likas sa makabagong Tagalog ang “piraso ng tinapay.”
- source_word: εἰσῆλθεν εἰς ἐκεῖνον
  choice: pumasok sa kanya
  rationale: Pinananatili nito ang tuwirang larawan ng personal na pagpasok nang hindi dinaragdagan ng paliwanag tungkol sa lawak o uri ng kapangyarihan ni Satanas.
- source_word: ὁ Σατανᾶς
  choice: si Satanas
  rationale: Ito ang nakaugaliang anyo ng pangalang-titulo sa Tagalog; ang pantukoy na “si” ay angkop sa gamit dito bilang personal na katauhan.
- source_word: λέγει οὖν αὐτῷ ὁ Ἰησοῦς
  choice: Kaya sinabi sa kanya ni Jesus
  rationale: Likas sa salaysay na Tagalog ang pangnagdaang “sinabi,” samantalang ipinahahayag ng “kaya” ang ugnayang ipinahihiwatig ng οὖν.
- source_word: Ὃ ποιεῖς
  choice: Ang ginagawa mo
  rationale: Pinananatili nito ang kasalukuyan at nagpapatuloy o kagyat na diwa ng ποιεῖς; hindi ito pinalawak bilang “ang gagawin mo,” na magiging higit na interpretatibo.
- source_word: ποίησον
  choice: gawin mo
  rationale: Tuwiran at maikli itong katumbas ng mariing pautos na anyo sa Griyego.
- source_word: τάχιον
  choice: nang mas mabilis
  rationale: Pinananatili ng “mas mabilis” ang pahambing na anyo ng τάχιον, sa halip na pakinisin lamang bilang “agad” o “mabilis.”
theological_decisions:
- issue: Uri ng ginawa ni Satanas kay Judas
  choice: “pumasok sa kanya si Satanas”
  alternative: “sinaniban siya ni Satanas” o “kinontrol siya ni Satanas”
  rationale: Tuwirang sinasabi ng teksto na pumasok si Satanas sa kanya. Ang “sinaniban” o “kinontrol” ay maaaring magtakda ng mas tiyak na doktrina o antas ng kontrol kaysa sa mismong sinasabi ng talata.
translation_notes:
  register: Makabagong Filipino Tagalog na malinaw, marangal, at angkop sa salaysay. Ginamit ang likas na pangnagdaang pandiwa sa naratibo, habang pinanatili ang pahambing na diwa ng τάχιον at ang tuwirang teolohikal na pahayag tungkol sa pagpasok ni Satanas.
