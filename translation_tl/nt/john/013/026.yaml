  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀ἀποκρίνεται ὁ Ἰησοῦς· Ἐκεῖνός ἐστιν ᾧ ἐγὼ ⸀βάψω τὸ ψωμίον ⸂καὶ δώσω αὐτῷ⸃· ⸂βάψας οὖν⸃ τὸ ⸀ψωμίον δίδωσιν Ἰούδᾳ Σίμωνος ⸀Ἰσκαριώτου.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/026.yaml
  text: Jesus answers[a], “It is he to whom I will dip the piece of bread and give it.” So, having dipped the piece of bread, he gives it to Judas, the son of Simon Iscariot.
translation:
  language: tl
  text: Sumagot si Jesus, “Siya ang bibigyan ko ng piraso ng tinapay na ilulubog ko.” Kaya, matapos niyang ilubog ang piraso ng tinapay, ibinigay niya iyon kay Judas na anak ni Simon Iscariote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “kay Judas Iscariote na anak ni Simon.” Maaaring unawain sa alinman sa dalawang paraan ang pagkakasabi sa Griyego.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκρίνεται
  choice: Sumagot
  rationale: Ang makasaysayang pangkasalukuyan sa salaysay na Griyego ay likas na isinasalin sa Tagalog sa aspektong naganap; pinananatili ng “Sumagot” ang malinaw na kilos sa salaysay.
- source_word: Ἐκεῖνός ἐστιν
  choice: Siya ang
  rationale: Tuwirang tumutukoy ito sa taong kinikilala at natural sa modernong Tagalog.
- source_word: ᾧ ἐγὼ βάψω τὸ ψωμίον καὶ δώσω αὐτῷ
  choice: paglulubugan ko ng piraso ng tinapay at bibigyan ko nito
  rationale: Pinananatili ang tahasang panghinaharap ng βάψω at δώσω at ang iisang taong pinag-uukulan ng dalawang kilos. Ang “ilubog” ay karaniwang salita para sa paglubog ng pagkain at hindi nagpapahiwatig ng ritwal na paghuhugas.
- source_word: ψωμίον
  choice: piraso ng tinapay
  rationale: Malinaw at pangkaraniwang katumbas para sa maliit na piraso ng tinapay o pagkain.
- source_word: βάψας οὖν
  choice: Kaya matapos ilubog
  rationale: Ipinapakita ang bunga o pagpapatuloy na dala ng οὖν at ang kilos na nauna sa pangunahing pandiwa.
- source_word: δίδωσιν
  choice: ibinigay niya
  rationale: Ang makasaysayang pangkasalukuyan ay natural na inilalahad sa Tagalog bilang naganap na kilos, nang hindi nawawala ang pagkakasunod-sunod ng salaysay.
- source_word: Ἰούδᾳ Σίμωνος Ἰσκαριώτου
  choice: kay Judas na anak ni Simon Iscariote
  rationale: Sinusunod nito ang pinakamalapit na ugnayang gramatikal ng mga genitive, na maaaring magpakilalang si Simon ang tinatawag na Iscariote; inilalahad sa talababa ang isa pang posibleng pag-unawa.
theological_decisions:
- issue: Kung kanino tumutukoy ang bansag na “Iscariote” sa huling parirala
  choice: “Judas na anak ni Simon Iscariote”
  alternative: “Judas Iscariote na anak ni Simon”
  rationale: Ang pagkakasunod at anyo ng Griyegong Σίμωνος Ἰσκαριώτου ay maaaring unawaing kapwa tumutukoy kay Simon, ngunit maaari ring basahin ayon sa kinagawiang pagkakakilanlan kay Judas. Hindi nilulutas nang palihim ang tunay na kalabuan; nasa talababa ang alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural. Ginamit ang karaniwang “piraso ng tinapay” sa halip na mas makalumang salita, at iniangkop sa likas na aspektong pandiwa ng Tagalog ang mga makasaysayang pangkasalukuyan sa Griyego.
