  to: Sumagot si Jesus, “Siya ang bibigyan ko ng piraso ng tinapay na ilulubog ko.” Kaya, matapos niyang ilubog ang piraso ng tinapay, ibinigay niya iyon kay Judas na anak ni Simon Iscariote.[a]
