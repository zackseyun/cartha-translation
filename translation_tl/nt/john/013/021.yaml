  text: Ταῦτα εἰπὼν ⸀ὁ Ἰησοῦς ἐταράχθη τῷ πνεύματι καὶ ἐμαρτύρησεν καὶ εἶπεν· Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι εἷς ἐξ ὑμῶν παραδώσει με.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/021.yaml
  text: After saying these things[a], Jesus was troubled in spirit, and testified and said, “Truly, truly, I say to you, one of you will betray me.”
translation:
  language: tl
  text: Matapos sabihin ni Jesus ang mga bagay na ito, nabagabag siya sa kanyang kalooban. Nagpatotoo siya at nagsabi, “Tunay na tunay na sinasabi ko sa inyo, ipagkakanulo[a] ako ng isa sa inyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “ibibigay niya ako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα εἰπὼν
  choice: Pagkasabi nito
  rationale: Natural na temporal na parirala sa Tagalog na nagpapanatili sa pagkakasunod ng mga pangyayari at sa pagtukoy sa mga kasasabi pa lamang ni Jesus.
- source_word: ἐταράχθη τῷ πνεύματι
  choice: nabagabag si Jesus sa kanyang kalooban
  rationale: Ipinahahayag ang matinding panloob na pagkabalisa nang hindi dinaragdagan ang antas na hindi tahasang nasa Griyego. Mas natural sa kasalukuyang Tagalog ang “sa kanyang kalooban” kaysa sa literal ngunit alanganing “sa kanyang espiritu.”
- source_word: ἐμαρτύρησεν καὶ εἶπεν
  choice: Nagpatotoo siya at sinabi
  rationale: Pinananatili ang dalawang pandiwa at ang taimtim na katangian ng pahayag; ang “nagpatotoo” ay umaayon din sa mahalagang bokabularyo ng patotoo sa Juan.
- source_word: Ἀμὴν ἀμὴν
  choice: Tunay na tunay
  rationale: Pinananatili ang pag-uulit at mariing katiyakan ng natatanging pormula ni Jesus sa Juan sa paraang mauunawaan ng karaniwang mambabasa.
- source_word: λέγω ὑμῖν
  choice: sinasabi ko sa inyo
  rationale: Direkta at likas na katumbas sa Tagalog, na angkop sa taimtim na pambungad.
- source_word: εἷς ἐξ ὑμῶν
  choice: isa sa inyo
  rationale: Likas na Tagalog para sa partitive expression at pinananatili ang nakakagulat na katotohanang kabilang sa malalapit na alagad ang tinutukoy.
- source_word: παραδώσει με
  choice: ipagkakanulo ako
  rationale: Sa konteksto, malinaw na tumutukoy ito sa taksil na pagkilos ng isang alagad. Inilalagay sa talababa ang mas literal na kahulugang “ibibigay ako sa kamay ng iba.”
theological_decisions:
- issue: Paglalarawan sa panloob na pagkabagabag ni Jesus
  choice: nabagabag si Jesus sa kanyang kalooban
  alternative: nabagabag si Jesus sa kanyang espiritu
  rationale: Pinananatili ang tunay na panloob at makataong pagkabalisa ni Jesus nang walang idinaragdag na paliwanag na teolohikal; ang “kalooban” ay natural na paraan sa Tagalog upang tukuyin ang panloob na pagkatao sa kontekstong ito.
- issue: Kahulugan ng παραδίδωμι sa hula tungkol sa pagtataksil
  choice: ipagkakanulo ako
  alternative: ibibigay ako sa kamay ng iba
  rationale: Ipinababatid ng pangunahing salin ang pagtataksil na malinaw sa konteksto, habang pinananatili sa talababa ang mas literal na larawan ng paghahatid o pagbibigay sa kapangyarihan ng iba.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang solemneng pag-uulit sa “Tunay na tunay” at ang bokabularyong Juanino ng pagpapatotoo, habang iniwasan ang saling sobrang literal at hindi likas sa Tagalog.
