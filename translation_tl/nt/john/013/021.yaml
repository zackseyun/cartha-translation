  to: Matapos sabihin ni Jesus ang mga bagay na ito, nabagabag siya sa kanyang kalooban. Nagpatotoo siya at nagsabi, “Tunay na tunay na sinasabi ko sa inyo, ipagkakanulo[a] ako ng isa sa inyo.”
