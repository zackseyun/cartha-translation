id: JHN.13.13
reference: John 13:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὑμεῖς φωνεῖτέ με Ὁ διδάσκαλος καὶ Ὁ κύριος, καὶ καλῶς λέγετε, εἰμὶ γάρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/013.yaml
  text: You call me Teacher and Lord, and you speak rightly, for I am.
translation:
  language: tl
  text: Tinatawag ninyo akong Guro at Panginoon[a], at tama ang sinasabi ninyo, sapagkat gayon nga ako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Amo.” Ang salitang Griyego na kyrios ay maaaring tumukoy sa isang may awtoridad o kapangyarihan; pinanatili rito ang “Panginoon” bilang karaniwang salin ng titulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνεῖτέ
  choice: Tinatawag
  rationale: Sa konstruksiyong may mga titulong kasunod ng layon, natural at tuwirang katumbas sa Filipino ang “tinatawag ninyo akong …”.
- source_word: Ὁ διδάσκαλος
  choice: Guro
  rationale: Malinaw at karaniwang makabagong katawagan ito sa nagtuturo; hindi na kailangang ilipat nang hiwalay ang artikulong Griyego sa ganitong pangungusap.
- source_word: Ὁ κύριος
  choice: Panginoon
  rationale: Pinananatili nito ang karaniwang titulo para kay Jesus at ang bigat ng awtoridad o pagkakapanginoon na maaaring taglay ng κύριος.
- source_word: καλῶς λέγετε
  choice: tama ang sinasabi ninyo
  rationale: Likas itong Filipino para sa pagsang-ayon na wasto ang kanilang pagtawag sa kanya, habang kapwa naipapahayag ang καλῶς at λέγετε.
- source_word: εἰμὶ γάρ
  choice: sapagkat gayon nga ako
  rationale: Pinananatili nito ang maikli at mariing pagpapatunay ni Jesus nang hindi inuulit o pinalalawak nang tahasan ang dalawang titulo.
theological_decisions:
- issue: Ang κύριος bilang titulo ni Jesus
  choice: Panginoon
  alternative: Amo
  rationale: Mas mahusay na pinananatili ng “Panginoon” ang malawak na gamit ng titulong κύριος sa Bagong Tipan at ang teolohikal na bigat nito. Inilalagay sa talababa ang “Amo” bilang posibleng kahulugang nakatuon sa awtoridad, nang hindi iyon ginagawang pangunahing pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tama ang sinasabi ninyo” bilang likas na pagpapahayag ng καλῶς λέγετε, at ang “gayon nga ako” upang mapanatili ang maikli at mariing anyo ng εἰμὶ γάρ.
