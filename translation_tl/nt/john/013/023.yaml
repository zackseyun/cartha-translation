  text: ⸀ἦν ἀνακείμενος εἷς ⸀ἐκ τῶν μαθητῶν αὐτοῦ ἐν τῷ κόλπῳ τοῦ Ἰησοῦ, ὃν ἠγάπα ὁ Ἰησοῦς·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/023.yaml
  text: One of his disciples[a], whom Jesus loved, was reclining in Jesus' bosom.
translation:
  language: tl
  text: Ang isa sa mga alagad niya, na minamahal ni Jesus, ay nakahilig na malapit kay Jesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na, “nasa dibdib ni Jesus.” Inilalarawan ng pananalitang ito ang puwesto ng isang taong nakahilig sa tabi ng isa pa habang kumakain.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνακείμενος
  choice: nakahilig
  rationale: Tumutukoy ito sa nakahilig na ayos ng pagkain noong sinaunang panahon, hindi lamang sa karaniwang pag-upo sa hapag.
- source_word: εἷς ἐκ τῶν μαθητῶν αὐτοῦ
  choice: ang isa sa mga alagad niya
  rationale: Likas at tuwirang ipinapahayag nito sa Tagalog ang partitive na diwa ng pariralang Griyego.
- source_word: ἐν τῷ κόλπῳ τοῦ Ἰησοῦ
  choice: sa tabi ni Jesus
  rationale: Sa konteksto ng hapunan, inilalarawan ng κόλπος ang puwesto ng isang taong nakahilig na napakalapit sa dibdib o tagiliran ng katabi niya. Iniiwasan ng saling ito ang maling makabagong larawan habang pinananatili sa talababa ang literal na anyo.
- source_word: ὃν ἠγάπα ὁ Ἰησοῦς
  choice: na minamahal ni Jesus
  rationale: Tuwiran at likas itong salin ng sugnay na panuring, at pinananatili nito ang karaniwang kahulugan ng ἀγαπάω bilang pagmamahal.
theological_decisions:
- issue: Ang posisyon ng alagad na minamahal ni Jesus
  choice: Ilarawan sa pangunahing teksto ang pisikal na pagkalapit niya kay Jesus sa ayos ng paghilig sa hapag.
  alternative: “nasa dibdib ni Jesus” o “nakahilig sa dibdib ni Jesus”
  rationale: Pangunahing inilalarawan ng parirala ang ayos ng mga kumakain sa hapunan, hindi tahasang isang mistikong pakikiisa. Gayunman, pinananatili sa talababa ang literal na larawan at ang posibleng pagkaugnay nito sa pananalita ng Juan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nakahilig” upang maipakita ang sinaunang ayos sa hapunan; ang paulit-ulit na pangalang “Jesus” ay pinanatili upang maiwasan ang kalituhan sa panghalip.
