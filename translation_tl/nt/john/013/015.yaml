base_translation:
  language: en
  yaml_path: translation/nt/john/013/015.yaml
  text: For I have given you an example[a], so that just as I have done to you[c][b], you also may do.
translation:
  language: tl
  text: Sapagkat binigyan ko kayo ng halimbawa[a], upang gawin din ninyo ang ginawa ko sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “huwaran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπόδειγμα
  choice: halimbawa
  rationale: Tumutukoy ito sa isang huwarang ibinigay upang tularan. Ang “halimbawa” ang pinakanatural at malinaw sa makabagong Filipino; itinatala sa talababa ang “huwaran” bilang lehitimong alternatibo.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikita ng γάρ na ipinaliliwanag ng pangungusap ang naunang ginawa at itinuro ni Jesus.
- source_word: ἔδωκα
  choice: binigyan ko kayo
  rationale: Pinananatili ng payak na aspektong naganap ang aorist at natural itong tumutukoy sa pagkilos na katatapos lamang ni Jesus; hindi kailangang gawing tahasang perpektibo sa Filipino upang madama ang kasalukuyang kabuluhan nito.
- source_word: ἵνα
  choice: upang
  rationale: Malinaw at marangal na ipinahahayag ng “upang” ang layuning tinutukoy ng ἵνα.
- source_word: καθὼς
  choice: ang gaya ng
  rationale: Pinananatili nito ang ugnayang paghahambing sa pagitan ng ginawa ni Jesus at ng dapat gawin ng mga alagad.
- source_word: ἐποίησα ὑμῖν
  choice: ginawa ko sa inyo
  rationale: Ang “ginawa ko sa inyo” ay tuwirang kumakatawan sa malawak na kahulugan ng ποιέω at sa datibong ὑμῖν, nang hindi idinaragdag na ang datibo ay tiyak na benepaktibo. Natural din ito sa konteksto ng paghuhugas sa kanilang mga paa.
- source_word: καὶ ὑμεῖς
  choice: din ninyo
  rationale: Ipinahahayag ng “din” ang pagtutugma at pagkakasangkot ng mga alagad bilang mga gagawa rin ng katulad ng ginawa ni Jesus.
- source_word: ποιῆτε
  choice: gawin
  rationale: Kasunod ng “upang,” natural na ipinahahayag ng anyong ito sa Filipino ang nilalayon o inaasahang pagkilos, nang hindi ito ginagawang hiwalay na tahasang utos.
theological_decisions:
- issue: Lakas at saklaw ng panawagan ni Jesus na tularan siya
  choice: Iharap ang ginawa ni Jesus bilang halimbawang dapat tularan, nang hindi tinutukoy kung ito ay isang ritwal na utos para sa lahat ng panahon o isang pangkalahatang sagisag lamang.
  alternative: Isalin sa paraang tahasang nag-uutos ng pangkalahatang ritwal ng paghuhugas ng paa, o sa paraang inaalis ang anumang kongkretong paggaya.
  rationale: Malinaw sa talata na nagbigay si Jesus ng halimbawa upang gumawa rin ang mga alagad nang naaayon dito. Hindi naman nilulutas ng talatang ito lamang ang lahat ng tanong tungkol sa eksaktong anyo at saklaw ng paggayang iyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Sapagkat” at “upang” upang mapanatili ang lohikal at layuning ugnayan ng Griyego, habang natural ang ayos na “gawin din ninyo ang gaya ng ginawa ko sa inyo.”
