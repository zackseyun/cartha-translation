  naturalness: Ang “Ang nakapaligo na” at “malinis na siya nang lubusan” ay nauunawaan ngunit hindi pinakanatural sa modernong Tagalog. Mas likas ang “Ang naligo na” at “lubos nang malinis.” Ang “malinis kayo” ay mas tuwirang pangkasalukuyang pahayag kaysa “malilinis kayo,” na maaari ring mabasa bilang panghinaharap.
  terminology: Pinananatili ang “naligo” para sa λούω, “paghuhugas ... ng mga paa” para sa νίπτω, at “malinis” para sa καθαρός. Hindi idinaragdag ang anumang doktrinal na pagpapaliwanag sa pangunahing teksto. Ang pangalan na “Jesus” ay katanggap-tanggap sa modernong Filipino Tagalog.
