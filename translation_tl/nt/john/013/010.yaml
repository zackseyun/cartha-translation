  text: λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Ὁ λελουμένος ⸂οὐκ ἔχει χρείαν⸃ ⸂εἰ μὴ⸃ τοὺς πόδας νίψασθαι, ἀλλ’ ἔστιν καθαρὸς ὅλος· καὶ ὑμεῖς καθαροί ἐστε, ἀλλ’ οὐχὶ πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/010.yaml
  text: Jesus said to him[a], “The one who has bathed has no need except to wash his feet, but is completely clean. And you are clean, but not all of you.”
translation:
  language: tl
  text: Sinabi ni Jesus sa kanya, “Ang naligo na[a] ay hindi na kailangang maghugas pa, maliban na lamang sa paghuhugas ng kanyang mga paa, ngunit lubos nang malinis. At malinis kayo, ngunit hindi kayong lahat.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Magkaiba ang dalawang pandiwang Griyego: ang λούω ay “maligo” o maghugas ng buong katawan, samantalang ang νίπτω ay “maghugas,” karaniwan ng isang bahagi ng katawan gaya ng mga paa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ λελουμένος
  choice: Ang nakapaligo na
  rationale: Ang perpektong participle ng λούω ay tumutukoy sa taong nakaligo na at nananatili sa kalagayang bunga nito. Likas sa modernong Tagalog ang “nakapaligo na,” at hindi nito ginagawang tiyak sa lalaki ang pangkalahatang pahayag.
- source_word: οὐκ ἔχει χρείαν
  choice: ay hindi na kailangang
  rationale: Natural itong katumbas ng idyomang Griyego at malinaw na ipinahihiwatig ng “na” na wala nang karagdagang pangangailangan matapos maligo.
- source_word: εἰ μὴ
  choice: maliban sa
  rationale: Ipinakikilala nito ang tanging eksepsiyon sa naunang pahayag.
- source_word: τοὺς πόδας νίψασθαι
  choice: maghugas pa maliban sa kanyang mga paa
  rationale: Pinananatili ng “maghugas” ang kaibhan sa “nakapaligo,” habang natural na ipinahahayag ng “kanyang” na ang mga paa ay sa taong nakapaligo.
- source_word: καθαρὸς ὅλος
  choice: malinis na siya nang lubusan
  rationale: Pinananatili nito ang kabuuang diin ng ὅλος nang hindi nililimitahan ang pahayag sa pisikal na katawan lamang, kaya nananatiling bukas ang literal at simbolikong diwa.
- source_word: καὶ ὑμεῖς καθαροί ἐστε
  choice: At malilinis kayo
  rationale: Ang “kayo” ay malinaw na maramihan, at ang “malilinis” ay inuulit ang salitang-ugat ng naunang “malinis,” gaya sa Griyego.
- source_word: ἀλλ’ οὐχὶ πάντες
  choice: ngunit hindi kayong lahat
  rationale: Malinaw nitong ipinakikita na may eksepsiyon sa loob ng grupong kinakausap.
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Sinabi sa kanya ni Jesus
  rationale: Isinalin ang makasaysayang pangkasalukuyan bilang pangnagdaan, ayon sa natural na daloy ng salaysay sa Tagalog.
theological_decisions:
- issue: Literal na paghuhugas at simboliko o espirituwal na kalinisan
  choice: Panatilihin ang “nakapaligo,” “maghugas,” at “malinis” nang hindi tahasang ipinapaliwanag ang simbolismo sa pangunahing teksto.
  alternative: Idagdag ang “malinis sa espirituwal” o gamitin ang iisang pandiwa para sa λούω at νίπτω.
  rationale: Magkasabay na gumagana sa konteksto ang literal at simbolikong antas. Ang pagpapanatili sa magkaibang salitang “maligo” at “maghugas” ay hindi nagpapataw ng isang tiyak na paliwanag na doktrinal.
- issue: Pangkalahatang gamit ng panlalaking isahang participle
  choice: Ang nakapaligo na
  alternative: Ang lalaking nakapaligo na / Siya na nakapaligo na
  rationale: Bagaman panlalaking isahan sa gramatika ang participle, pangkalahatan ang gamit nito sa kasabihan. Natural at tumpak sa diwa ang “ang nakapaligo na.”
- issue: Saklaw ng καθαρὸς ὅλος
  choice: malinis na siya nang lubusan
  alternative: malinis na ang buo niyang katawan
  rationale: Ang “nang lubusan” ay nagpapanatili sa kabuuang diin ngunit hindi pinapaliit ang posibleng simbolikong diwa sa pisikal na katawan lamang.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal ngunit madaling maunawaang himig. Ginamit ang “nakapaligo” at “maghugas” upang marinig sa Tagalog ang mahalagang pagkakaiba ng dalawang pandiwang Griyego. Ang “kundi” ay nagpapanatili sa adversatibong ἀλλά, kahit bahagyang mas pormal ang ayos.
