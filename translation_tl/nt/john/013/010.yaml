revisions:
- from: Sinabi sa kanya ni Jesus, “Ang nakapaligo na[a] ay hindi na kailangang maghugas pa maliban sa kanyang mga paa, kundi malinis na siya nang lubusan. At malilinis kayo, ngunit hindi kayong lahat.”
  to: Sinabi ni Jesus sa kanya, “Ang naligo na[a] ay hindi na kailangang maghugas pa, maliban na lamang sa paghuhugas ng kanyang mga paa, ngunit lubos nang malinis. At malinis kayo, ngunit hindi kayong lahat.”
  rationale: Inayos ang sintaks upang malinaw na ang paghuhugas ng mga paa ang nag-iisang eksepsiyon. Pinalitan ang mga pariralang hindi gaanong likas ng modernong Tagalog, at ginawang malinaw na pangkasalukuyan ang pahayag sa mga alagad. Napanatili ang lexical na kaibhan ng dalawang pandiwang Griyego, ang paulit-ulit na “malinis,” ang pangmaramihang kausap, at ang eksepsiyon sa loob ng grupo.
