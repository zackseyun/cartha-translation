id: JHN.13.1
reference: John 13:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Πρὸ δὲ τῆς ἑορτῆς τοῦ πάσχα εἰδὼς ὁ Ἰησοῦς ὅτι ⸀ἦλθεν αὐτοῦ ἡ ὥρα ἵνα μεταβῇ ἐκ τοῦ κόσμου τούτου πρὸς τὸν πατέρα ἀγαπήσας τοὺς ἰδίους τοὺς ἐν τῷ κόσμῳ εἰς τέλος ἠγάπησεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/001.yaml
  text: Before the Feast of the Passover[a], Jesus, knowing that his hour had come to depart from this world to the Father, having loved his own who were in the world[b], loved them to the end.
translation:
  language: tl
  text: Bago sumapit ang Pista ng Paskuwa, alam ni Jesus na dumating na ang oras niya upang lisanin ang mundong ito at pumunta sa Ama. Nang minahal na niya ang mga sa kanya na nasa mundo, minahal niya sila hanggang wakas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “minahal niya sila nang lubos” o “hanggang sa sukdulan.” Maaaring saklaw ng pariralang Griego kapuwa ang pag-ibig hanggang sa huling sandali at ang pag-ibig sa ganap nitong kaganapan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρὸ δὲ τῆς ἑορτῆς τοῦ πάσχα
  choice: Bago ang Pista ng Paskuwa
  rationale: Ipinapahayag ng πρό na may genitive ang temporal na kahulugang “bago”; banayad lamang ang δέ at hindi kailangang gawing tahasang panalungat. Pinananatili ng “Pista ng Paskuwa” ang diwa ng ἑορτή at πάσχα.
- source_word: εἰδὼς
  choice: alam ni Jesus
  rationale: Natural na modernong Tagalog ito para sa kasabay na kamalayan ni Jesus, nang hindi ginagawang sanhi ang participle.
- source_word: ἦλθεν αὐτοῦ ἡ ὥρα
  choice: dumating na ang oras niya
  rationale: Pinananatili ang mahalagang idyomang Juanino tungkol sa itinakdang sandali ng pagdurusa, pag-alis, at pagluwalhati ni Jesus.
- source_word: ἵνα μεταβῇ ἐκ τοῦ κόσμου τούτου πρὸς τὸν πατέρα
  choice: upang lumisan sa mundong ito at pumunta sa Ama
  rationale: Ang “lumisan” ay angkop sa maringal na konteksto ng pag-alis ni Jesus, habang nililinaw ng “pumunta sa Ama” ang direksiyon ng μεταβῇ nang hindi ipinapaliwanag nang labis ang paraan nito.
- source_word: τοὺς ἰδίους τοὺς ἐν τῷ κόσμῳ
  choice: ang mga sariling kanya na nasa mundo
  rationale: Pinananatili ang malawak at relasyonal na diwa ng τοὺς ἰδίους at hindi ito nililimitahan sa “mga alagad,” bagaman sila ang agarang tinutukoy sa konteksto.
- source_word: εἰς τέλος
  choice: hanggang wakas
  rationale: Pinananatili ang sadyang maaaring temporal o kwalitatibong kahulugan ng parirala; inilalahad sa talababa ang kahulugang ganap o sukdulan.
- source_word: ἠγάπησεν αὐτούς
  choice: inibig niya sila
  rationale: Tuwirang isinasalin ang ἀγαπάω bilang “umibig,” sa dignified at natural na rehistrong biblikal.
theological_decisions:
- issue: Kahulugan ng εἰς τέλος sa sukdulang pahayag tungkol sa pag-ibig ni Jesus
  choice: hanggang wakas
  alternative: nang lubos / hanggang sa sukdulan
  rationale: Maaaring tumukoy ang parirala kapuwa sa pagpapatuloy ng pag-ibig hanggang sa huling sandali at sa ganap na tindi nito. Hindi nilulutas ng pangunahing teksto ang mayamang pag-aalinlangang ito; pinananatili sa talababa ang kwalitatibong diwa.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Hinati sa dalawang pangungusap ang mahabang estrukturang Griego upang maging natural sa Tagalog, habang pinananatili ang pagkakasunod ng kamalayan, pag-alis, at pag-ibig ni Jesus. Ginamit ang “Ama” bilang relasyonal na titulo at iniwasang paliitin ang “mga sariling kanya” tungo lamang sa mga alagad.
