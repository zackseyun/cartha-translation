revisions:
- from: Bago ang Pista ng Paskuwa, alam ni Jesus na dumating na ang oras niya upang lumisan sa mundong ito at pumunta sa Ama. Inibig niya ang mga sariling kanya na nasa mundo, at inibig niya sila hanggang wakas.[a]
  to: Bago sumapit ang Pista ng Paskuwa, alam ni Jesus na dumating na ang oras niya upang lisanin ang mundong ito at pumunta sa Ama. Nang minahal na niya ang mga sa kanya na nasa mundo, minahal niya sila hanggang wakas.[a]
  rationale: Pinalitan ang hindi idiomatikong “mga sariling kanya” ng “mga sa kanya,” na natural na Tagalog at pinananatili ang sadyang malawak na relasyonal na tinutukoy ng Griyego. Inayos din ang “lumisan sa mundong ito” tungo sa “lisanin ang mundong ito.” Ang “Nang minahal na niya” ay nagsisikap magpahayag ng antecedent na aorist participle nang hindi ginagawang doktrinal o sanhi ang ugnayan nito sa pangunahing pahayag na “minahal niya sila hanggang wakas.”
