base_translation:
  language: en
  yaml_path: translation/nt/john/013/020.yaml
  text: Truly[a], truly, I say to you, whoever receives anyone I send receives me[b], and whoever receives me receives the one who sent me.
translation:
  language: tl
  text: '“Katotohanan, katotohanang sinasabi ko sa inyo: ang tumatanggap sa sinumang isusugo ko ay tumatanggap sa akin; at ang tumatanggap sa akin ay tumatanggap sa nagsugo sa akin.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa konteksto, ang “nagsugo sa akin” ay tumutukoy sa Ama.
    reason: cross_reference
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Katotohanang-katotohanan
  rationale: Pinananatili ang pag-uulit at maringal na diin ng pormulang pambungad ni Jesus, sa wikang madaling maunawaan ng makabagong mambabasa.
- source_word: λέγω ὑμῖν
  choice: sinasabi ko sa inyo
  rationale: Tuwirang inililipat ang present indicative at ang panghalip na maramihan, habang pinananatili ang pormulang pananalita sa Juan.
- source_word: ὁ λαμβάνων
  choice: ang tumatanggap
  rationale: Ipinahahayag ang pangkalahatang diwa ng articular participle nang hindi nililimitahan sa kasarian.
- source_word: ἄν τινα πέμψω
  choice: sa sinumang isusugo ko
  rationale: Ang 'sinuman' ay nagpapanatili sa bukas at di-tiyak na saklaw ng τινα na kasama ng ἄν at subjunctive; ang 'isusugo ko' ay natural na naghahatid ng contingent/future force.
- source_word: λαμβάνει
  choice: tumatanggap
  rationale: Pinananatili ang leksikal na pag-uulit sa buong talata, na mahalaga sa sunod-sunod na ugnayan ng isinugo, ni Jesus, at ng nagsugo sa kaniya. Hindi ito pinaliit sa diwa lamang ng pagpapatuloy bilang panauhin.
- source_word: ὁ δὲ ἐμὲ λαμβάνων
  choice: at ang tumatanggap sa akin
  rationale: Ang δέ ay mahinang pang-ugnay rito, kaya natural ang 'at' sa papataas na paralelismo sa halip na ang mas pasalungat na 'ngunit.'
- source_word: τὸν πέμψαντά με
  choice: sa nagsugo sa akin
  rationale: Natural at maikli itong salin ng aorist participle at hindi nagdaragdag ng titulong 'Ama,' na hindi tahasang nasa mismong talata.
theological_decisions:
- issue: Pagkakakilanlan ng 'nagsugo sa akin'
  choice: nagsugo sa akin
  alternative: Ama na nagsugo sa akin
  rationale: Sa konteksto ng Juan, ang tinutukoy ay ang Ama, ngunit relasyonal na pananalita lamang ang ginamit ng talata. Pinananatili ng pangunahing teksto ang tahasang anyo ng Griyego, at nililinaw ng talababa ang kontekstuwal na pagkakakilanlan.
- issue: Pangkalahatang saklaw ng mga participle na nasa panlalaking anyo
  choice: ang tumatanggap
  alternative: ang lalaking tumatanggap
  rationale: Ang mga participle ay pangkalahatan at kumakatawan sa sinumang tao, hindi partikular sa mga lalaki; natural at tumpak ang walang-kasariang salin sa Tagalog.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang paulit-ulit na 'tumatanggap' upang maipakita ang mahalagang tanikala ng pagkatawan sa orihinal. Ang gitling sa 'Katotohanang-katotohanan' ay naghahatid ng mariing pag-uulit nang hindi gumagamit ng di-gaanong malinaw na 'Amen, amen.'
