  text: τεκνία, ἔτι μικρὸν μεθ’ ὑμῶν εἰμι· ζητήσετέ με, καὶ καθὼς εἶπον τοῖς Ἰουδαίοις ὅτι Ὅπου ⸂ἐγὼ ὑπάγω⸃ ὑμεῖς οὐ δύνασθε ἐλθεῖν, καὶ ὑμῖν λέγω ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/033.yaml
  text: Little children[a], I am with you a little while longer. You will seek me, and just as I said to the Jews, ‘Where I am going[b], you are not able to come,’ so now I also say to you.
translation:
  language: tl
  text: “Mga munting anak[a], kaunting panahon na lamang akong kasama ninyo. Hahanapin ninyo ako, at gaya ng sinabi ko sa mga Judio[b], ‘Kung saan ako pupunta, hindi kayo makakapunta,’ gayon din ang sinasabi ko ngayon sa inyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Griyegong pantawag ay nasa anyong diminutive at nagpapahiwatig ng magiliw na pagmamahal.
    reason: lexical_alternative
  - marker: b
    text: Sa ilang konteksto sa Juan, ang “mga Judio” ay maaaring tumukoy nang mas partikular sa mga pinunong Judio o mga awtoridad sa Judea.
    reason: alternative_reading
lexical_decisions:
- source_word: τεκνία
  choice: Mga anak ko
  rationale: Isang magiliw na pantawag na may anyong pampamilya at diminutibong diwa. Ang “Mga anak ko” ang pinakanatural na makabagong Tagalog para sa mapagmahal na pakikipag-usap; inilalahad sa talababa ang mas literal na anyo.
- source_word: ἔτι μικρὸν μεθ’ ὑμῶν εἰμι
  choice: kaunting panahon na lamang ninyo akong makakasama
  rationale: Ipinahahayag nito ang maikling panahong nalalabi habang kasama pa nila si Jesus. Natural sa Tagalog ang ayos na ito at pinananatili ang diwa ng patuloy ngunit malapit nang matapos na presensiya.
- source_word: ζητήσετέ με
  choice: Hahanapin ninyo ako
  rationale: Ang ζητέω ay maaaring mangahulugang hanapin o pagsikapang matagpuan. Ang “hahanapin” ay malinaw, natural, at hindi nagdaragdag ng motibong wala sa teksto.
- source_word: τοῖς Ἰουδαίοις
  choice: sa mga Judio
  rationale: Ito ang tuwirang salin ng pangkat na tinutukoy ng Griyego. Hindi ito kusang nililimitahan sa mga pinuno, bagaman inilalahad sa talababa ang posibleng mas makitid na pagtukoy ayon sa konteksto ni Juan.
- source_word: Ὅπου ἐγὼ ὑπάγω
  choice: Kung saan ako pupunta
  rationale: Natural na Tagalog para sa pook na patutunguhan ni Jesus. Hindi idinagdag ang “aalis” sapagkat sapat na sa konteksto ang “pupunta.”
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: hindi kayo makakapunta
  rationale: Ipinapahayag ang kawalan ng kakayahan o posibilidad na makarating, nang hindi ito ginagawang tahasang pagbabawal.
- source_word: καὶ ὑμῖν λέγω ἄρτι
  choice: sinasabi ko rin ngayon sa inyo
  rationale: Pinananatili ng “rin” ang paghahambing sa naunang sinabi sa mga Judio, at ng “ngayon” ang diin ng ἄρτι sa kasalukuyang pagsasabi sa mga alagad.
theological_decisions:
- issue: Saklaw ng katawagang Ἰουδαίοις sa Ebanghelyo ni Juan
  choice: mga Judio
  alternative: mga pinunong Judio
  rationale: Literal na tumutukoy ang salita sa “mga Judio.” Bagaman maaari itong tumukoy sa mga awtoridad ng Judea sa ilang konteksto ni Juan, hindi sapat ang talatang ito mismo upang ipasok ang mas makitid na pakahulugan sa pangunahing teksto.
- issue: Uri ng hindi pagpunta ng mga alagad
  choice: hindi kayo makakapunta
  alternative: hindi kayo maaaring pumunta
  rationale: Pinananatili nito ang kawalan ng kakayahan o posibilidad sa οὐ δύνασθε nang hindi nagpapasiya kung ito ay pagbabawal, pisikal na kawalan ng kakayahan, o pansamantalang hindi pag-access.
translation_notes:
  register: Makabago, natural, at marangal na Filipino Tagalog. Ginamit ang “Mga anak ko” upang maihatid ang magiliw na tono nang hindi tunog-luma o sapilitang literal; pinanatili ang tuwirang “mga Judio” at ang hindi tiyak na uri ng kawalan ng kakayahang pumunta.
