  naturalness: Natural at marangal ang karamihan ng salin. Mas tuwiran at natural sa Tagalog ang “kaunting panahon na lamang akong kasama ninyo,” na pinananatili rin ang pokus ng Griyego. Ang “Mga munting anak” ay malinaw na magiliw at mas malapit sa diminutibong τεκνία.
