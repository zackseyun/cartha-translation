translation:
  language: tl
  text: Pagkatapos, nagbuhos siya ng tubig sa palanggana at sinimulan niyang hugasan ang mga paa ng mga alagad at punasan ang mga ito gamit ang tuwalyang nakatali sa kanyang baywang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶτα
  choice: Pagkatapos
  rationale: Likas na panandang Filipino para sa kasunod na kilos sa salaysay.
- source_word: βάλλει ὕδωρ
  choice: nagbuhos siya ng tubig
  rationale: Sa konteksto ng tubig na inilalagay sa palanggana, ang idiomatikong diwa ng βάλλει ay pagbubuhos; ginamit ang aspektong naganap upang maging natural sa salaysay na Filipino.
- source_word: εἰς τὸν νιπτῆρα
  choice: sa palanggana
  rationale: Ang νιπτήρ ay sisidlang ginagamit sa paghuhugas; malinaw at karaniwang katumbas nito sa modernong Filipino ang “palanggana.”
- source_word: ἤρξατο νίπτειν
  choice: sinimulang hugasan
  rationale: Pinananatili ang inceptive na diwa ng ἤρξατο at ang tuwirang kahulugan ng νίπτειν.
- source_word: τοὺς πόδας τῶν μαθητῶν
  choice: ang mga paa ng mga alagad
  rationale: Natural na Filipino na malinaw na nagpapanatili sa ugnayang genitibo.
- source_word: ἐκμάσσειν
  choice: punasan ang mga iyon
  rationale: Saklaw ng pandiwa ang pagpahid o pagpapatuyo sa pamamagitan ng pagpahid; ang “mga iyon” ay tumutukoy nang malinaw sa mga paa.
- source_word: τῷ λεντίῳ
  choice: gamit ang tuwalya
  rationale: Ang λέντιον ay telang ginagamit na pamunas; “tuwalya” ang malinaw na katumbas sa konteksto.
- source_word: ᾧ ἦν διεζωσμένος
  choice: nakatali sa kanyang baywang
  rationale: Natural na ipinapahayag ang larawan ng telang ibinigkis sa katawan para sa paglilingkod, nang hindi gumagamit ng lipas na salitang “binigkisan.”
