  text: ⸂εἰ ὁ θεὸς ἐδοξάσθη ἐν αὐτῷ,⸃ καὶ ὁ θεὸς δοξάσει αὐτὸν ἐν ⸀αὑτῷ, καὶ εὐθὺς δοξάσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/032.yaml
  text: If God was glorified in him[a], God will also glorify him in himself[b], and will glorify him at once.
translation:
  language: tl
  text: Kung niluwalhati ang Diyos sa kanya[a], luluwalhatiin din siya ng Diyos sa sarili ng Diyos[b], at luluwalhatiin niya siya kaagad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Yamang niluwalhati ang Diyos sa kanya.” Ginagamit sa Griyego ang εἰ (“kung”), bagaman sa konteksto ay malamang na ipinapalagay na totoo ang kondisyon.
    reason: alternative_reading
  - marker: b
    text: O, ang “sa sarili ng Diyos” ay maaaring unawain bilang “sa piling ng Diyos” o “sa pamamagitan ng Diyos mismo”; siksik at mayamang teolohikal ang pananalitang Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: Kung
  rationale: Tuwirang pinananatili ang kondisyunal na anyo ng Griyegong εἰ. Bagaman malamang na ipinapalagay na totoo ang kondisyon sa konteksto, hindi ito tahimik na ginawang sanhi sa pangunahing teksto.
- source_word: ἐδοξάσθη
  choice: niluwalhati
  rationale: Pinananatili ang tinig na balintiyak at ang aspektong tumitingin sa pangyayari bilang buo; natural ito sa modernong Filipino.
- source_word: ἐν αὐτῷ
  choice: sa kanya
  rationale: Pinananatili ang payak at siksik na diwa ng ἐν αὐτῷ nang hindi ito pinakahulugang 'sa pamamagitan niya.'
- source_word: δοξάσει
  choice: luluwalhatiin
  rationale: Pinananatili ang hinaharap na anyo at ang leksikal na pagkakaugnay sa naunang 'niluwalhati.'
- source_word: ἐν αὑτῷ
  choice: sa kanyang sarili
  rationale: Malinaw na ibinabalik ang panghalip sa Diyos at pinananatili ang siksik na pananalita ng Griyego; inilalahad sa talababa ang ibang posibleng pag-unawa.
- source_word: εὐθύς
  choice: kaagad
  rationale: Natural at malinaw na Filipino na nagpapahayag ng agarang pagkilos.
theological_decisions:
- issue: Lakas ng kondisyunal na εἰ sa kontekstong ipinapalagay na totoo ang kondisyon
  choice: Panatilihin ang “Kung niluwalhati ang Diyos sa kanya” sa pangunahing teksto
  alternative: “Yamang niluwalhati ang Diyos sa kanya”
  rationale: Malakas ang pahiwatig ng konteksto na tunay ang kondisyon, ngunit ang εἰ ay tahasang kondisyunal. Pinananatili ng “kung” ang anyo at tensiyon ng Griyego, habang inilalagay sa talababa ang kontekstuwal na alternatibo.
- issue: Kahulugan ng ἐν αὑτῷ kaugnay ng pagluluwalhati ng Diyos sa Anak
  choice: “sa kanyang sarili”
  alternative: “kasama ng kanyang sarili” o “sa pamamagitan ng kanyang sarili”
  rationale: Ang literal at siksik na anyo ang pinanatili upang hindi paunang pagpasyahan kung lokatibo, pansamahan, o instrumental ang eksaktong diin.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang terminong “luwalhatiin” dahil mahalaga ang pag-uulit ng δοξάζω sa talata at sa teolohiya ni Juan. Ginamit ang “sa kanya” at “sa kanyang sarili” upang manatiling malapit sa siksik na mga pariralang Griyego nang hindi nagdaragdag ng interpretasyon.
