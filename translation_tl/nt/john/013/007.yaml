base_translation:
  language: en
  yaml_path: translation/nt/john/013/007.yaml
  text: Jesus answered and said to him[a], “What I am doing you do not know now[b], but you will understand after these things.”
translation:
  language: tl
  text: Sumagot si Jesus at sinabi niya sa kanya, “Hindi mo pa alam ngayon kung ano ang ginagawa ko, ngunit mauunawaan mo rin ito pagkatapos ng mga pangyayaring ito.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “pagkatapos ng mga pangyayaring ito” ay maaaring tumukoy sa mga susunod na pangyayari sa tagpong ito o, sa mas malawak na diwa, sa mga pangyayaring darating na magpapaliwanag sa ginawa ni Jesus.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: Sumagot … at sinabi
  rationale: Pinananatili ang dalawang pandiwang Griyego at likas pa rin itong pakinggan bilang panimulang pangungusap sa salaysay.
- source_word: Ὃ ἐγὼ ποιῶ
  choice: ang ginagawa ko
  rationale: Ipinahihiwatig ng pangkasalukuyang anyo ang kilos na kasalukuyang isinasagawa ni Jesus.
- source_word: οὐκ οἶδας ἄρτι
  choice: Hindi mo alam ngayon
  rationale: Pinananatili ang karaniwang diwa ng οἶδας bilang ‘alam’ at ang χρονικό na ἄρτι bilang ‘ngayon.’
- source_word: γνώσῃ
  choice: mauunawaan mo
  rationale: Ipinapakita ang pagdating sa pagkaunawa sa hinaharap at pinananatili sa Filipino ang pagkakaiba nito sa naunang ‘alam.’
- source_word: δὲ
  choice: ngunit
  rationale: Malinaw na minamarkahan ang pagsalungat ng kasalukuyang kawalan ng kaalaman at ng pagkaunawa sa hinaharap.
- source_word: μετὰ ταῦτα
  choice: pagkatapos ng mga bagay na ito
  rationale: Malapit sa pahayag na Griyego at hindi nililimitahan sa simpleng ‘mamaya’ ang posibleng saklaw ng tinutukoy.
theological_decisions:
- issue: Saklaw ng panahong tinutukoy ng μετὰ ταῦτα
  choice: Pinanatiling pangkalahatan bilang ‘pagkatapos ng mga bagay na ito.’
  alternative: ‘mamaya’ o tiyak na pagtukoy sa paliwanag matapos ang paghuhugas, sa krus at muling pagkabuhay, o sa gawain ng Espiritu
  rationale: Hindi tahasang itinatakda ng Griyego kung aling mga susunod na pangyayari ang magbibigay-linaw, kaya hindi ito nilutas nang interpretatibo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang bahagyang pormal na ‘pagkatapos ng mga bagay na ito’ upang maingatan ang pagiging bukas ng μετὰ ταῦτα.
