  yaml_path: translation/nt/john/013/035.yaml
  text: By this everyone will know that you are my disciples[b][a], if you have love for one another.
translation:
  language: tl
  text: 'Sa pamamagitan nito, malalaman ng lahat na kayo ay mga alagad ko: kung may pag-ibig kayo sa isa''t isa.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na anyo, “kung mayroon kayong pag-ibig sa isa't isa,” o “sa gitna ninyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Sa pamamagitan nito
  rationale: 'Ipinapahayag ang instrumental na diwa: ang pag-ibig sa isa''t isa ang tanda o batayan kung paano sila makikilala.'
- source_word: γνώσονται πάντες
  choice: malalaman ng lahat
  rationale: Natural sa modernong Tagalog at pinananatili ang panghinaharap at pangkalahatang saklaw ng Griyego.
- source_word: ἐμοὶ μαθηταί ἐστε
  choice: kayo ay mga alagad ko
  rationale: Pinananatili ng “mga alagad” ang ugnayan ng guro at tagasunod, at natural na ipinapahayag ng “ko” ang possessive dative.
- source_word: ἐὰν
  choice: kung
  rationale: Tuwirang pinananatili ang kondisyong ipinahahayag ng Griyego nang hindi ito ginagawang sanhi ng pagiging alagad.
- source_word: ἀγάπην ἔχητε ἐν ἀλλήλοις
  choice: umiibig kayo sa isa't isa
  rationale: Natural na Tagalog para sa pagkakaroon ng pag-ibig sa magkakaibang kasapi; malinaw na ipinahahayag ang mutuwal na direksiyon ng pag-ibig.
theological_decisions:
- issue: Likas ng kondisyong ipinakilala ng ἐὰν
  choice: kung umiibig kayo sa isa't isa
  alternative: kapag umiibig kayo sa isa't isa
  rationale: Pinananatili ng “kung” ang pormal na kondisyon at ang diwang ito ay tanda o katibayan ng pagiging alagad, hindi paraan upang maging karapat-dapat dito.
- issue: Saklaw ng πάντες
  choice: lahat
  alternative: lahat ng tao
  rationale: Ang “lahat” ay natural at inklusibo sa Tagalog at hindi nililimitahan sa kalalakihan ang generic na anyong panlalaki sa Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “alagad” bilang matatag at pamilyar na katawagan sa Ebanghelyo; iniwasan ang mas kahoy na “mayroon kayong pag-ibig sa gitna ng isa't isa” sa pangunahing teksto.
