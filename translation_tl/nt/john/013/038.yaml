  text: ⸀ἀποκρίνεται Ἰησοῦς· Τὴν ψυχήν σου ὑπὲρ ἐμοῦ θήσεις; ἀμὴν ἀμὴν λέγω σοι, οὐ μὴ ἀλέκτωρ φωνήσῃ ἕως οὗ ⸀ἀρνήσῃ με τρίς.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/038.yaml
  text: Jesus answered[a], “Will you lay down your life for me? Truly, truly, I say to you, the rooster will certainly not crow until you have denied me three times.”
translation:
  language: tl
  text: 'Sumagot si Jesus, “Ibibigay mo ba ang buhay mo para sa akin? Tunay na tunay, sinasabi ko sa iyo: tiyak na hindi titilaok ang tandang bago mo ako ikaila nang tatlong beses.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκρίνεται
  choice: Sumagot
  rationale: Likas na salaysay sa Filipino ang pangnagdaang anyo, kahit historical present ang Griyego.
- source_word: ψυχήν
  choice: buhay
  rationale: Sa pariralang τίθημι τὴν ψυχήν, tumutukoy ito sa pagsasakripisyo o pagbibigay ng sariling buhay, hindi partikular sa di-materyal na kaluluwa.
- source_word: ὑπὲρ ἐμοῦ
  choice: para sa akin
  rationale: Malinaw at natural na ipinahahayag nito ang kapakinabangan o pagsasakripisyo alang-alang kay Jesus.
- source_word: θήσεις
  choice: Ibibigay mo ba
  rationale: Sa Filipino, mas natural ang “ibigay ang buhay” kaysa literal na “ilapag ang buhay,” habang napananatili ang kahulugan ng idyomang Griyego.
- source_word: ἀμὴν ἀμὴν
  choice: Katotohanang-katotohanang
  rationale: Pinananatili ang dobleng mariing pormula na katangian ng pananalita ni Jesus sa Juan.
- source_word: οὐ μὴ
  choice: tiyak na hindi
  rationale: Ipinapakita ang napakalakas na pagtanggi ng Griyegong konstruksiyon.
- source_word: ἀλέκτωρ φωνήσῃ
  choice: titilaok ang tandang
  rationale: Ito ang karaniwan at idyomatikong paraan sa modernong Filipino para sa pagtilaok ng rooster.
- source_word: ἕως οὗ
  choice: hangga't hindi
  rationale: Sa negatibong pangungusap, natural nitong ipinahahayag na hindi muna titilaok ang tandang bago matupad ang kasunod na pangyayari.
- source_word: ἀρνήσῃ με
  choice: mo ako ikinakaila
  rationale: Ang “ikaila” ay tuwirang katumbas ng pagtanggi o hindi pagkilala kay Jesus; ang aspektong kontemplatibo ay angkop sa pangyayaring inaasahang magaganap bago tumilaok ang tandang.
- source_word: τρίς
  choice: nang tatlong beses
  rationale: Karaniwan at malinaw na modernong Filipino.
theological_decisions:
- issue: Kahulugan ng ψυχή sa konteksto ng pagsasakripisyo ng alagad
  choice: buhay
  alternative: kaluluwa
  rationale: Ang tanong ay tungkol sa pahayag ni Pedro na handa siyang mamatay para kay Jesus. Ang “buhay” ang nagpapanatili sa kongkretong diwa nang hindi nagdaragdag ng mas makitid na antropolohikal na kahulugan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “ibigay ang buhay” bilang natural na katumbas ng idyomang Griyego; pinanatili ang mariing pag-uulit sa “Katotohanang-katotohanan.”
