- from: 'Sumagot si Jesus, “Ibibigay mo ba ang buhay mo para sa akin? Katotohanang-katotohanang sinasabi ko sa iyo: tiyak na hindi titilaok ang tandang hangga''t hindi mo ako ikinakaila nang tatlong beses.”'
  to: 'Sumagot si Jesus, “Ibibigay mo ba ang buhay mo para sa akin? Tunay na tunay, sinasabi ko sa iyo: tiyak na hindi titilaok ang tandang bago mo ako ikaila nang tatlong beses.”'
  rationale: Inayos ang aspekto at temporal na pagpapahayag ng hula upang malinaw na ang tatlong pagkakaila ay magaganap bago tumilaok ang tandang. Pinalitan din ang hindi gaanong likas na pormulang “Katotohanang-katotohanan” ng “Tunay na tunay,” na pinananatili ang dobleng diin ng Griyego. Idinagdag ang talababa para sa alternatibong leksikal na “kaluluwa,” alinsunod sa audit trail.
