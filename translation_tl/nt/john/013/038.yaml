  verdict: revise
  source_fidelity: 'Tumpak ang pangunahing diwa: ang tanong ay tungkol sa pagbibigay ng buhay para kay Jesus, at ang hulang pagtanggi ni Pedro nang tatlong beses bago tumilaok ang tandang ay napananatili. Gayunman, ang “hangga''t hindi mo ako ikinakaila” ay aspektuwal na parang nagpapatuloy na kasalukuyang pagkakaila at hindi malinaw na naihahatid ang tatlong natapos na pagkakaila bago tumilaok ang tandang.'
  naturalness: Natural ang karamihan ng salin, lalo na ang “Ibibigay mo ba ang buhay mo para sa akin?” Ngunit mas idiomatiko at malinaw ang “bago mo ako ikaila nang tatlong beses” para sa temporal na ugnayan. Ang “Tunay na tunay” ay mas likas na modernong pormulang Filipino kaysa “Katotohanang-katotohanan.”
  terminology: Ang “buhay” ay wastong salin ng ψυχή sa idyomang ito. Ang “tandang” at “tilaok” ay angkop. Ang “ikaila” ay tuwirang tumutugon sa ἀρνήσῃ; ang talababa ay nagpapanatili ng leksikal na alternatibong “kaluluwa” nang hindi ito ipinipilit sa pangunahing teksto.
