base_translation:
  language: en
  yaml_path: translation/nt/john/013/011.yaml
  text: For he knew the one who was betraying him; for this reason he said[a], “Not all of you are clean.”
translation:
  language: tl
  text: Sapagkat alam niya kung sino ang magkakanulo[a] sa kanya; kaya sinabi niya, “Hindi lahat sa inyo ay malinis.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “ang magbibigay sa kanya sa mga kamay ng iba.” Sa kontekstong ito, tumutukoy ito sa pagkakanulo ni Judas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: kilala niya
  rationale: Ang anyo ng οἶδα ay nagsasaad dito ng umiiral na kaalaman ni Jesus; natural sa Filipino ang “kilala niya” para sa pagkakilala sa taong tinutukoy.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Nagbibigay ang γάρ ng paliwanag sa naunang pahayag; malinaw na ipinahihiwatig ito ng “Sapagkat.”
- source_word: τὸν παραδιδόντα αὐτόν
  choice: ang magkakanulo sa kanya
  rationale: Ang παραδίδωμι ay literal na “mag-abot” o “magbigay sa kamay ng iba,” ngunit sa konteksto ay tumutukoy sa pagtataksil ni Judas. Ang “magkakanulo” ay natural at malinaw sa Filipino, habang inilalahad sa talababa ang mas literal na diwa.
- source_word: διὰ τοῦτο
  choice: kaya
  rationale: 'Natural at tuwirang ipinapakita ng “kaya” ang ugnayang sanhi at bunga: dahil alam ni Jesus kung sino ang magkakanulo, sinabi niya ang sumunod.'
- source_word: εἶπεν ὅτι
  choice: sinabi niya
  rationale: Natural na ipinakikilala ng “sinabi niya” ang tuwirang sipi; naipapakita ng panipi ang tungkulin ng ὅτι.
- source_word: Οὐχὶ πάντες καθαροί ἐστε
  choice: Hindi kayong lahat ay malinis
  rationale: Pinananatili nito ang pagtukoy sa buong pangkat nang hindi sinasabing walang sinuman sa kanila ang malinis. Ang “malinis” ay nagpapanatili sa pisikal at espirituwal na alingawngaw ng καθαροί.
theological_decisions:
- issue: Kahulugan ng παραδιδόντα kaugnay ni Judas
  choice: magkakanulo
  alternative: magbibigay sa kamay ng iba / mag-aabot
  rationale: Sa salaysay ng pagpapakasakit, ang kilos ay pagtataksil, kaya malinaw ang “magkakanulo.” Gayunman, inilalagay sa talababa ang mas literal na larawan upang hindi mawala ang lawak ng salitang Griyego.
- issue: Kahulugan ng καθαροί sa konteksto ng paghuhugas ng paa
  choice: malinis
  alternative: dalisay
  rationale: Ang “malinis” ay nagpapanatili sa sadyang pag-uugnay ng pisikal na paghuhugas at espirituwal na kalagayan; ang “dalisay” ay maaaring magpaliit sa diwa tungo lamang sa moral o espirituwal na kadalisayan.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “Sapagkat” upang malinaw ang paliwanag at “kaya” para sa natural na daloy. Inilagay ang talababa pagkatapos ng buong pangungusap upang ipaliwanag ang “magkakanulo.”
