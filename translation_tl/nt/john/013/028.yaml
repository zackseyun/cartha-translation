  register: Makabago at marangal na Filipino. Ginamit ang “nakahilig sa hapag” upang mapanatili ang sinaunang paraan ng pagkain nang malinaw sa ordinaryong mambabasa. Hindi tinukoy sa pangalan ang mga panghalip sapagkat hindi rin sila tahasang pinangalanan sa talata.
