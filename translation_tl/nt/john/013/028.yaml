  yaml_path: translation/nt/john/013/028.yaml
  text: But none of those reclining at the table knew why he said this to him[a].
translation:
  language: tl
  text: Ngunit walang sinuman sa mga nakahilig sa hapag ang nakaalam kung bakit niya ito sinabi sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas pormal na pananalita, “para sa anong layunin niya ito sinabi sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: ito
  rationale: Pinananatili ng panghalip na pamatlig ang tuwirang pagtukoy sa naunang sinabi ni Jesus.
- source_word: δὲ
  choice: Ngunit
  rationale: 'Ipinahihiwatig ng δέ ang banayad na pagsalungat sa naunang talata: nagsalita si Jesus, ngunit hindi naunawaan ng mga kasalo ang layunin niya.'
- source_word: οὐδεὶς
  choice: walang sinuman
  rationale: Malinaw nitong ipinahahayag ang ganap na pagkakaila at likas itong sinusundan ng pariralang tumutukoy sa mga kasalo.
- source_word: ἔγνω
  choice: nakaalam
  rationale: Sa konteksto, tumutukoy ito sa hindi pagkaalam o hindi pagkaunawa sa dahilan ng sinabi; pinananatili ng “nakaalam” ang malawak na saklaw ng γινώσκω nang hindi labis na nagpapaliwanag.
- source_word: τῶν ἀνακειμένων
  choice: sa mga nakahilig sa hapag
  rationale: Ang ἀνάκειμαι ay tumutukoy sa kaugaliang paghilig habang kumakain; idinagdag ang “sa hapag” upang maging malinaw sa makabagong mambabasa ang tagpo ng salu-salo.
- source_word: πρὸς τί
  choice: kung bakit
  rationale: Likas na Tagalog ito para sa idyomang nagtatanong tungkol sa dahilan o layunin, habang ang mas pormal na kahulugang layon ay inilalagay sa talababa.
- source_word: εἶπεν αὐτῷ
  choice: niya ito sinabi sa kanya
  rationale: Tapat nitong pinananatili ang hindi tahasang pinangalanang simuno at tagatanggap sa Griyego, gayundin ang demonstratibong τοῦτο.
