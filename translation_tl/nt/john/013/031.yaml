    issue: “makalabas na siya” para sa ἐξῆλθεν
    rationale: Ang infinitive/abilitative na “makalabas” ay maaaring magdala ng diwang ‘nagawa o nagawang lumabas.’ Ang “lumabas na siya” ay mas direkta, idiomatiko, at pinananatili ang simpleng kilos ng pag-alis palabas.
  - severity: low
    issue: 'Pambungad ng talababa: “O”'
    rationale: Bagaman nauunawaan, mas likas at malinaw sa modernong Filipino ang “O kaya,” para ipakilala ang alternatibong salin.
