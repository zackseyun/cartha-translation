id: JHN.13.31
reference: John 13:31
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ὅτε ⸀οὖν ἐξῆλθεν ⸀λέγει Ἰησοῦς· Νῦν ἐδοξάσθη ὁ υἱὸς τοῦ ἀνθρώπου, καὶ ὁ θεὸς ἐδοξάσθη ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/031.yaml
  text: So when he had gone out[a], Jesus said, “Now the Son of Man has been glorified, and God has been glorified in him.”
translation:
  language: tl
  text: Kaya, nang lumabas na siya, sinabi ni Jesus, “Ngayon ay niluwalhati na ang Anak ng Tao, at ang Diyos ay niluwalhati na sa kanya.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “sa pamamagitan niya.” Maaaring unawain ang pariralang Griyego na ang Diyos ay niluwalhati sa Anak o sa pamamagitan ng Anak.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅτε οὖν
  choice: Kaya nang
  rationale: Pinagsasama nito ang temporal na diwa ng ὅτε at ang pagpapatuloy o bunga na ipinahihiwatig ng οὖν, sa natural na daloy ng salaysay sa Tagalog.
- source_word: ἐξῆλθεν
  choice: makalabas na siya
  rationale: Tumutukoy ito sa paglabas ni Judas sa naunang konteksto. Pinananatili ng “makalabas” ang diwang may paggalaw palabas, at ipinakikita ng “na” na nangyari muna ito bago nagsalita si Jesus.
- source_word: λέγει
  choice: sinabi
  rationale: Bagaman historical present ang Griyego, mas natural sa makabagong salaysay sa Tagalog ang pangnagdaang “sinabi.”
- source_word: Νῦν
  choice: Ngayon
  rationale: 'Tuwirang pinananatili ang temporal at diskursong diin ng νῦν: ang paglabas ni Judas ang nagbubukas sa sandaling ipinahahayag ni Jesus.'
- source_word: ἐδοξάσθη
  choice: niluwalhati na
  rationale: Pinananatili ang balintiyak na anyo at ang ideya na ang pagluluwalhati ay ipinahahayag bilang naganap o naitakda na sa kasalukuyang sandali, nang hindi nililimitahan kung ito ay tumutukoy sa krus, muling pagkabuhay, pagdakila, o sa kabuuan ng mga ito.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Ito ang kinikilalang titulo ni Jesus at pinananatili ang kaugnayan nito sa mas malawak na biblikal na tradisyon, lalo na sa Daniel 7.
- source_word: ὁ θεὸς
  choice: ang Diyos
  rationale: Tuwirang salin ng parirala at natural na anyo sa Tagalog.
- source_word: ἐν αὐτῷ
  choice: sa kanya
  rationale: Ito ang pinakadirektang relational o locative na salin ng ἐν αὐτῷ. Ang posibleng instrumental na diwang “sa pamamagitan niya” ay inilalagay sa talababa upang mapanatili ang tunay na kalabuan.
theological_decisions:
- issue: Saklaw ng pagluluwalhati sa Anak ng Tao
  choice: Hindi tinukoy kung ang pagluluwalhati ay ang krus lamang, ang muling pagkabuhay at pagdakila lamang, o ang buong magkakaugnay na pangyayari.
  alternative: Limitahan ang pahayag sa pagpapako sa krus lamang, o sa muling pagkabuhay at pagdakila lamang.
  rationale: Hindi nililinaw ng mismong talata ang saklaw. Pinananatili ng salin ang teolohikal na lawak at tensiyon ng pahayag ni Jesus.
- issue: Diwa ng ἐν αὐτῷ
  choice: sa kanya
  alternative: sa pamamagitan niya
  rationale: Maaaring unawain ang parirala bilang pagluluwalhati ng Diyos “sa” Anak o “sa pamamagitan” ng Anak. Pinananatili sa pangunahing teksto ang mas tuwirang salin at inilalahad sa talababa ang instrumental na posibilidad.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang tradisyonal ngunit buhay pa ring titulong “Anak ng Tao,” at iniwasan ang mga salitang magpapakitid sa teolohikal na saklaw ng pahayag.
