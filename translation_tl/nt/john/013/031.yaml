  verdict: revise
  source_fidelity: Tumpak ang pangunahing diwa at balintiyak na paglalahad ng dalawang ἐδοξάσθη, pati ang pagpapanatili ng ἐν αὐτῷ bilang “sa kanya.” Gayunman, ang “makalabas na siya” ay maaaring magpahiwatig ng kakayahang makalabas; ang payak na “lumabas na siya” ang mas tuwirang katumbas ng ἐξῆλθεν sa salaysay na ito.
  naturalness: Marangal at natural sa makabagong Filipino ang kabuuang pangungusap. Mas maayos ang daloy sa “Kaya, nang lumabas na siya,” at ang “O kaya” ay mas likas na pambungad sa talababa kaysa sa solong “O.”
  terminology: Ang “Anak ng Tao,” “Diyos,” at “niluwalhati” ay angkop, matatag na mga katawagang Filipino at hindi nagpapataw ng mas makitid na pagpapakahulugan sa pagluluwalhati.
  issues:
