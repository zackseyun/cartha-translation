  text: So he comes to Simon Peter. He says to him[a], “Lord, are you washing my feet?”
translation:
  language: tl
  text: Lumapit si Jesus kay Simon Pedro. Sinabi ni Pedro sa kanya, “Panginoon, ikaw ba ang maghuhugas ng mga paa ko?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχεται
  choice: lumapit
  rationale: Ang historikal na pangkasalukuyan ay isinalin sa likas na salaysay na Tagalog; ipinapahayag ng “lumapit” ang pagkilos patungo kay Simon Pedro.
- source_word: οὖν
  choice: Kaya
  rationale: Pinananatili ang ugnayang pasalaysay o bunga sa naunang pangyayari nang hindi nagiging labis na pormal.
- source_word: πρὸς Σίμωνα Πέτρον
  choice: kay Simon Pedro
  rationale: Ang πρός na may accusative ay nagsasaad ng pagkilos patungo sa isang tao; likas sa Tagalog ang “kay Simon Pedro.”
- source_word: λέγει αὐτῷ
  choice: Sinabi nito sa kanya
  rationale: Ginagawang malinaw ng “nito” na si Simon Pedro ang nagsalita kay Jesus; ang pangnagdaang anyo ay natural sa modernong salaysay sa Tagalog, at pinananatili ng “sa kanya” ang αὐτῷ.
- source_word: Κύριε
  choice: Panginoon
  rationale: Pinananatili ang magalang na pagtawag at ang posibleng kristolohikal na lalim ng κύριε sa Ebanghelyo ni Juan.
- source_word: σύ
  choice: mo
  rationale: Naipapahiwatig sa ayos ng tanong at sa panghalip na “mo” ang diin sa kausap; hindi kailangan ang di-likas na “ikaw mismo.”
- source_word: μου
  choice: ko
  rationale: Likas na pang-angkin sa Tagalog para sa mga paa ng nagsasalita.
- source_word: νίπτεις
  choice: huhugasan
  rationale: Ang νίπτω ay paghuhugas ng bahagi ng katawan. Sa konteksto, ang tanong ni Pedro ay natural na tumutukoy sa kilos na gagawin o kasisimulang gawin ni Jesus.
- source_word: τοὺς πόδας
  choice: ang mga paa
  rationale: Pinananatili ang maramihang anyo at inuugnay sa nagsasalita sa pamamagitan ng “ko.”
theological_decisions:
- issue: Paglalarawan sa κύριε sa pagtawag ni Pedro kay Jesus
  choice: Panginoon
  alternative: Ginoo
  rationale: Ang “Panginoon” ay maaaring magsaad kapwa ng magalang na pagtawag at ng mas malalim na pagkilala kay Jesus. Hindi tiyak sa anyo lamang kung alin ang pangunahing diin, kaya inilalahad sa talababa ang “Ginoo” bilang posibleng kahulugan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang natural na pangnagdaang salaysay sa halip na piliting tularan ang historikal na pangkasalukuyan ng Griyego. Nilinaw ng “nito” ang nagbago na tagapagsalita upang maiwasan ang kalituhan sa mga panghalip.
