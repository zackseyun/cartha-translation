  text: ἀπ’ ἄρτι λέγω ὑμῖν πρὸ τοῦ γενέσθαι, ἵνα ⸂πιστεύσητε ὅταν γένηται⸃ ὅτι ἐγώ εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/019.yaml
  text: From now on I am telling you before it happens[a], so that when it does happen, you may believe that I am he.
translation:
  language: tl
  text: Mula ngayon, sinasabi ko sa inyo bago pa ito mangyari, upang kapag nangyari na ito ay maniwala kayong ako nga iyon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “ako nga.” Ang pananalitang Griyego ay maaari ring umalingawngaw sa banal na pagpapakilala sa sarili sa Isaias at sa ibang bahagi ng Juan.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπ’ ἄρτι
  choice: Mula ngayon
  rationale: Likas na panandang temporal sa modernong Tagalog na pinananatili ang diwang mula sa kasalukuyang sandali pasulong.
- source_word: λέγω ὑμῖν
  choice: sinasabi ko na sa inyo
  rationale: Ipinahahayag ang kasalukuyang pagsasalita at ang pagbibigay-diin na sinasabi na ito ni Jesus ngayon.
- source_word: πρὸ τοῦ γενέσθαι
  choice: bago pa ito mangyari
  rationale: Malinaw na ipinapakita ang panahong nauuna sa pangyayaring tinutukoy, nang hindi tinutukoy nang higit sa ipinahihintulot ng Griyego kung ano ang pangyayari.
- source_word: ἵνα
  choice: upang
  rationale: Natural at marangal na panandang nagpapahayag ng layunin.
- source_word: πιστεύσητε
  choice: maniwala kayo
  rationale: Pinananatili ang karaniwang ugnayang leksikal ng πιστεύω sa pananampalataya o paniniwala, nang hindi ipinapasok ang mas tiyak na diwang 'magsimulang maniwala.'
- source_word: ὅταν γένηται
  choice: kapag nangyari na ito
  rationale: Ang 'kapag' ay angkop sa pangyayaring inaasahan sa hinaharap, at ang 'na' ay likas na nagbibigay-diin sa katuparan nito.
- source_word: ὅτι ἐγώ εἰμι
  choice: na ako nga iyon
  rationale: Nauunawaan itong pagpapakilala sa sarili sa Tagalog habang hindi nagdaragdag ng tiyak na katawagan o tahasang panaguri na wala sa Griyego. Inilalahad sa talababa ang mas literal at posibleng mas mabigat na anyo.
theological_decisions:
- issue: Ang ganap na pahayag na ἐγώ εἰμι sa konteksto ni Juan at ang posibleng alusyon nito sa banal na pagpapakilala sa sarili
  choice: ako nga iyon
  alternative: ako nga
  rationale: Ang pangunahing salin ay malinaw at likas bilang pagpapakilala sa sarili sa Tagalog, ngunit hindi nito pinapangalanan kung sino o ano ang 'iyon.' Pinananatili ng talababa ang mas literal na kawalan ng tahasang panaguri at binabanggit ang posibleng alusyon sa Isaias at sa ibang bahagi ng Juan, kaya hindi nilulutas nang sapilitan ang teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw sa karaniwang mambabasa ngunit may marangal na himig. Ginamit ang “upang” sa halip na mas kolokyal na “para” upang mapanatili ang angkop na rehistro; iniwasan ang makalumang “maganap” at pinili ang natural na “mangyari.”
