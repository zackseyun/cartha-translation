    issue: Ang 'anuman' para sa τι ay maaaring magpahiwatig ng mas malawak na saklaw kaysa sa hindi-tiyak na 'isang bagay.'
    rationale: Ang τι ay isang di-tiyak na panghalip ('something'), hindi isang malayang-pagpili na pahayag ('anything whatever').
  - severity: low
    issue: Hindi tuwirang malinaw ang pagkakaugnay ng 'o kaya'y magbigay siya' sa iniisip nilang sinasabi ni Jesus.
    rationale: Ang pagdaragdag ng 'na' bago ang ikalawang alternatibo ay mas malinaw na naghahayag na ito rin ang inaakala nilang utos ni Jesus.
