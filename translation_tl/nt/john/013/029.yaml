source:
  edition: SBLGNT
  text: τινὲς γὰρ ἐδόκουν, ἐπεὶ τὸ γλωσσόκομον ⸀εἶχεν Ἰούδας, ὅτι λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Ἀγόρασον ὧν χρείαν ἔχομεν εἰς τὴν ἑορτήν, ἢ τοῖς πτωχοῖς ἵνα τι δῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/029.yaml
  text: For some thought that[a], because Judas had the money box, Jesus was telling him[b], “Buy what we need for the feast,” or that he should give something to the poor.
translation:
  language: tl
  text: May ilan kasing nag-akala na, yamang si Judas ang may hawak ng lalagyan ng pera[a], sinasabi sa kanya ni Jesus, “Bilhin mo ang mga kailangan natin para sa kapistahan[b],” o kaya’y na magbigay siya ng isang bagay sa mga dukha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sisidlan ng pera.” Ang salitang Griyego ay tumutukoy sa lalagyan ng pondong ginagamit ng pangkat at hindi tiyak kung kahon o supot iyon.
    reason: lexical_alternative
  - marker: b
    text: Sa konteksto, ang “kapistahan” ay ang Kapistahan ng Paskuwa.
    reason: cross_reference
lexical_decisions:
- source_word: τινὲς γὰρ ἐδόκουν
  choice: May ilan kasing nag-akala
  rationale: Ang “may ilan” ay tumutukoy sa ilan sa mga naroon; ipinapahayag ng “kasi” ang paliwanag na gamit ng γάρ, at likas na salin ng ἐδόκουν sa salaysay ang “nag-akala.”
- source_word: ἐπεὶ
  choice: yamang
  rationale: Ipinakikita nito ang dahilan ng kanilang palagay nang hindi lumilikha ng alanganing pag-uulit ng “dahil” sa Filipino.
- source_word: τὸ γλωσσόκομον εἶχεν Ἰούδας
  choice: si Judas ang may hawak ng lalagyan ng pera
  rationale: Pinananatili ng “may hawak” ang pangunahing diwa ng εἶχεν at likas na ipinahihiwatig ang pangangalaga ni Judas sa pondong nasa lalagyan. Hindi nito labis na tinutukoy kung kahon o supot ang sisidlan.
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: sinasabi sa kanya ni Jesus
  rationale: Ang pangkasalukuyang anyo sa salaysay ay maayos na naihahatid ng aspektong di-ganap ng “sinasabi,” bilang nilalaman ng akala ng ilan.
- source_word: Ἀγόρασον ὧν χρείαν ἔχομεν
  choice: Bilhin mo ang mga kailangan natin
  rationale: Direkta at likas na utos ito sa modernong Filipino, habang malinaw na naihahatid ang relatibong pariralang Griyego.
- source_word: εἰς τὴν ἑορτήν
  choice: para sa kapistahan
  rationale: Ang ἑορτή ay relihiyosong kapistahan; hindi idinaragdag sa mismong teksto ang “Paskuwa,” bagaman nililinaw iyon ng konteksto at talababa.
- source_word: ἢ τοῖς πτωχοῖς ἵνα τι δῷ
  choice: o kaya’y magbigay siya ng anuman sa mga dukha
  rationale: Pinananatili ang di-tuwirang pananalita at ang layon o inaakalang kilos na ipinahahayag ng ἵνα at pasakaling pandiwa. Ang “anuman” ay likas na katumbas ng di-tiyak na τι.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kasi” sa loob ng likas na ayos na “May ilan kasing…” upang maipahayag ang γάρ nang hindi nagiging pormal o matigas ang pangungusap. Inilagay ang mga panandang [a] at [b] sa mismong mga salitang tinatalakay ng mga talababa.
