revisions:
- from: May ilan kasing nag-akala na, yamang si Judas ang may hawak ng lalagyan ng pera[a], sinasabi sa kanya ni Jesus, “Bilhin mo ang mga kailangan natin para sa kapistahan[b],” o kaya’y magbigay siya ng anuman sa mga dukha.
  to: May ilan kasing nag-akala na, yamang si Judas ang may hawak ng lalagyan ng pera[a], sinasabi sa kanya ni Jesus, “Bilhin mo ang mga kailangan natin para sa kapistahan[b],” o kaya’y na magbigay siya ng isang bagay sa mga dukha.
  rationale: Pinalitan ang 'anuman' ng 'isang bagay' upang mas tumpak na maihatid ang di-tiyak na τι. Nagdagdag ng 'na' sa ikalawang alternatibo upang luminaw na kapwa iniisip ng ilan na ito ang sinasabi ni Jesus. Pinanatili ang lahat ng kahulugan, mga pangalan, rehistro, at mga angkla ng talababa.
