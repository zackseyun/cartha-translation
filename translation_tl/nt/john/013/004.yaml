base_translation:
  language: en
  yaml_path: translation/nt/john/013/004.yaml
  text: He rises from the supper and lays aside his outer garments[a], and taking a towel[b], tied it around himself.
translation:
  language: tl
  text: Tumayo siya mula sa hapunan at hinubad ang kanyang mga panlabas na damit.[a] Pagkatapos, kumuha siya ng tuwalya at ibinigkis iyon sa kanyang baywang.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “itinabi ang kanyang mga panlabas na damit.”
    reason: lexical_alternative
  - marker: b
    text: O “ibinigkis iyon sa kanyang sarili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγείρεται
  choice: Tumayo siya
  rationale: Ang kasalukuyang panahunan ay makasaysayang pangkasalukuyan sa salaysay. Natural sa modernong Tagalog ang nakaraang panahunang “tumayo” at hindi nito binabago ang kilos.
- source_word: ἐκ τοῦ δείπνου
  choice: mula sa hapunan
  rationale: Ang δεῖπνον ay tumutukoy sa hapunan o salu-salo; pinananatili ng “hapunan” ang tiyak na tagpuan nang hindi gumagamit ng mas kolokyal na salita.
- source_word: τίθησιν τὰ ἱμάτια
  choice: hinubad ang kanyang mga panlabas na damit
  rationale: Sa konteksto, ang τίθημι ay pag-aalis o pagtatabi, at ang ἱμάτια ay mga panlabas na kasuotan. Iniiwasan nitong ipahiwatig na hinubad niya ang lahat ng damit.
- source_word: λαβὼν λέντιον
  choice: kumuha siya ng tuwalya
  rationale: Malinaw at likas na katumbas ang “tuwalya” para sa λέντιον, isang telang ginagamit sa paglilingkod.
- source_word: διέζωσεν ἑαυτόν
  choice: ibinigkis iyon sa kanyang baywang
  rationale: Ipinahahayag ng διαζώννυμι ang pagbibigkis sa sarili. Nililinaw ng “sa kanyang baywang” ang likas na kilos sa Tagalog; ang “iyon” ay tumutukoy sa tuwalya.
