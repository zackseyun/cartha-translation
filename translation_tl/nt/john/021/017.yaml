  to: Sinabi niya sa kanya sa ikatlong pagkakataon[a], “Simon, anak ni Juan, mahal mo ba ako?” Nalungkot si Pedro dahil sa ikatlong pagkakataon ay sinabi niya sa kanya, “Mahal mo ba ako?” Sinabi ni Pedro sa kanya, “Panginoon, alam mo ang lahat; alam mong mahal kita.”[b] Sinabi sa kanya ni Jesus, “Pakainin mo ang aking mga tupa.”
