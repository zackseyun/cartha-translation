source:
  edition: SBLGNT
  text: λέγει αὐτῷ τὸ τρίτον· Σίμων ⸀Ἰωάννου, φιλεῖς με; ἐλυπήθη ὁ Πέτρος ὅτι εἶπεν αὐτῷ τὸ τρίτον· Φιλεῖς με; καὶ ⸀εἶπεν αὐτῷ· Κύριε, ⸂πάντα σὺ⸃ οἶδας, σὺ γινώσκεις ὅτι φιλῶ σε. λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Βόσκε τὰ ⸀πρόβατά μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/017.yaml
  text: He said to him the third time[a], “Simon, son of John, do you love me?” Peter was grieved because he said to him the third time, “Do you love me?” And he said to him, “Lord, you know all things; you know that I love you.” Jesus said to him[b], “Feed my sheep.”
translation:
  language: tl
  text: Sinabi niya sa kanya sa ikatlong pagkakataon[a], “Simon, anak ni Juan, mahal mo ba ako?” Nalungkot si Pedro dahil sa ikatlong pagkakataon ay sinabi niya sa kanya, “Mahal mo ba ako?” Sinabi ni Pedro sa kanya, “Panginoon, alam mo ang lahat; alam mong mahal kita.”[b] Sinabi sa kanya ni Jesus, “Pakainin mo ang aking mga tupa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dito ay φιλέω (phileō, “magmahal, magkaroon ng pagmamahal”) ang pandiwang Griyego, samantalang ἀγαπάω (agapaō) ang ginamit ni Jesus sa naunang dalawang tanong. Para sa ilang tagapagpaliwanag, may mahalagang kaibahan ang mga ito; para naman sa iba, nagkakapatong ang kahulugan ng dalawang pandiwa sa kontekstong ito. Parehong “mahal” ang ginamit sa salin upang hindi magpataw ng mas matalim na kaibahan kaysa sa malinaw na ipinahihiwatig ng Griyego.
    reason: lexical_alternative
  - marker: b
    text: 'Dalawang magkaibang pandiwa para sa “alam” ang ginamit sa sagot ni Pedro: οἶδα (oida) at γινώσκω (ginōskō). Natural na “alam” ang katumbas ng kapuwa pandiwa rito sa Filipino. Maaaring may bahagyang pagkakaiba ang mga ito, ngunit hindi iyon maipahahayag nang natural nang walang labis na pagpapakahulugan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ τρίτον
  choice: sa ikatlong pagkakataon
  rationale: Likas at malinaw na pahayag sa modernong Filipino na pinananatili ang diin sa tatlong ulit na pagtatanong.
- source_word: Σίμων Ἰωάννου
  choice: Simon na anak ni Juan
  rationale: Ang genitibong Ἰωάννου ay patronimiko; tumutukoy ito kay Juan, hindi sa tradisyonal na anyong Jonas mula sa ibang talata.
- source_word: φιλεῖς / φιλῶ
  choice: mahal mo / mahal kita
  rationale: Ang φιλέω ay nagpapahayag ng pag-ibig o pagmamahal. Ang “mahal” ang pinakanatural at marangal na katumbas sa Filipino nang hindi ipinipilit ang isang matalim at pinagtatalunang kaibahan sa ἀγαπάω.
- source_word: ἐλυπήθη
  choice: nalungkot
  rationale: Tumpak at natural itong naghahayag ng dalamhati o emosyonal na sakit ni Pedro nang walang idinagdag na antas ng tindi.
- source_word: Κύριε
  choice: Panginoon
  rationale: Ang konteksto ng pakikipag-usap ni Pedro sa muling nabuhay na si Jesus ay humihiling ng higit sa isang magalang na “Ginoo.”
- source_word: πάντα σὺ οἶδας
  choice: alam mo ang lahat
  rationale: Pinananatili nito ang lawak at lakas ng πάντα sa malinaw at karaniwang Filipino.
- source_word: οἶδας ... γινώσκεις
  choice: alam mo ... alam mong
  rationale: Bagaman magkaiba ang dalawang pandiwang Griyego, kapuwa natural na isinasalin bilang “alam” dito. Ang sapilitang paggamit ng magkaibang pandiwa sa Filipino ay maaaring magpasok ng kahulugang hindi tiyak sa teksto.
- source_word: Βόσκε
  choice: Pakainin mo
  rationale: Partikular na tumutukoy ang βόσκω sa pagpapakain o pagbibigay ng pastulan, kaya mas eksakto ito kaysa sa pangkalahatang “alagaan.”
- source_word: πρόβατά
  choice: mga tupa
  rationale: Ang πρόβατα ay mga tupa, hindi partikular na mga batang tupa; pinananatili nito ang leksikal na kaibahan sa ἀρνία sa talata 15.
theological_decisions:
- issue: Kung dapat bang ipakita sa salin ang matalim na kaibahan ng φιλέω at ἀγαπάω sa pag-uusap
  choice: Isalin ang φιλέω bilang “mahal” nang hindi nagpapahiwatig sa pangunahing teksto ng ibang uri ng pag-ibig.
  alternative: Gumamit ng magkaibang parirala gaya ng “iniibig” at “may pagmamahal,” at ituring na tiyak na mahalaga sa teolohiya ang pagpapalit ng mga pandiwa.
  rationale: Hindi palaging matatag ang semantikong kaibahan ng dalawang pandiwa sa Griyegong Koine. Pinananatili ng “mahal” ang bigat ng usapan nang hindi nilulutas ang isang pinagtatalunang pagpapakahulugan; inilalahad ang pagkakaiba sa talababa.
- issue: Ang saklaw ng pahayag ni Pedro na “alam mo ang lahat”
  choice: Panatilihin bilang tuwirang pahayag tungkol sa malawak na kaalaman ni Jesus sa loob ng usapan.
  alternative: Limitahan ito sa “alam mo ang lahat tungkol dito,” o palawakin sa isang tahasang paliwanag tungkol sa omniscience.
  rationale: Tahasan sa Griyego ang “alam mo ang lahat.” Hindi ito dapat hinaan o dagdagan ng paliwanag na doktrinal na wala mismo sa pangungusap.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “Panginoon,” “mahal,” at “mga tupa” bilang pamilyar at angkop na mga salitang biblikal. Inayos ang ikalawang pangungusap bilang “tinanong siya ni Jesus” upang maging malinaw at natural ang reperensiya ng panghalip sa Filipino, nang hindi binabago ang nilalaman.
