  verdict: revise
  source_fidelity: 'Kailangang ayusin ang ikalawang pangungusap upang mas tuwirang maipakita ang Griyegong ἐλυπήθη ... ὅτι εἶπεν αὐτῷ: si Pedro ay nalungkot dahil sa ikatlong pag-uulit ng tanong. Ang draft na “tinanong siya ni Jesus” ay hindi mali sa sanggunian, ngunit pinapalitan nito ang masinsing pag-uulit ng “sinabi niya sa kanya” at di-kinakailangang ipinapasok ang pangalang Jesus sa bahaging iyon. Ang binagong teksto ay pinananatili ang lahat ng pangunahing detalye: ikatlong pagkakataon, anak ni Juan, φιλέω bilang “mahal,” dalawang “alam,” at βόσκε/πρόβατα bilang “pakainin ... mga tupa.”'
  naturalness: Natural at marangal sa modernong Filipino ang “Simon, anak ni Juan,” “Nalungkot si Pedro,” at “Sinabi ni Pedro sa kanya.” Mas malinaw ang hayag na “ni Pedro” sa huling tugon kaysa sa panghalip na “niya,” lalo na dahil may ilang pagpapalitan ng tagapagsalita sa talata.
  terminology: Ang “Panginoon,” “mahal,” at “mga tupa” ay angkop at pare-pareho sa register. Hindi ipinipilit ng “mahal” ang pinagtatalunang semantikong paghihiwalay ng φιλέω at ἀγαπάω. Ang “alam mo ang lahat; alam mong mahal kita” ay natural na nagpapanatili ng pag-uulit ng οἶδα at γινώσκω nang walang labis na interpretasyon.
