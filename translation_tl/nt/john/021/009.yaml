id: JHN.21.9
reference: John 21:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ὡς οὖν ἀπέβησαν εἰς τὴν γῆν βλέπουσιν ἀνθρακιὰν κειμένην καὶ ὀψάριον ἐπικείμενον καὶ ἄρτον.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/009.yaml
  text: So when they got out onto the land[a], they saw a charcoal fire laid there, and fish lying on it[b], and bread.
translation:
  language: tl
  text: Kaya nang makasampa sila sa lupa[a], nakita nila ang isang bunton ng nagbabagang uling na nakalatag doon, na may isdang nakapatong dito, at tinapay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “makarating sila sa pampang.” Mas literal na sinasabi ng Griyego na umahon sila patungo sa lupa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς οὖν
  choice: Kaya nang
  rationale: Pinagsasama nito ang panahong diwa ng ὡς at ang nag-uugnay na diwa ng οὖν sa natural na salaysay sa Tagalog.
- source_word: ἀπέβησαν εἰς τὴν γῆν
  choice: makababa sila sa lupa
  rationale: Malapit ito sa larawan ng Griyego na pagbaba o paglabas mula sa bangka patungo sa lupa, nang hindi nililimitahan ang γῆ sa mismong dalampasigan.
- source_word: βλέπουσιν
  choice: nakita nila
  rationale: Ang pangkasalukuyang anyo sa Griyego ay makasaysayang pangkasalukuyan; ang pangnagdaan ay mas natural sa makabagong salaysay sa Tagalog.
- source_word: ἀνθρακιὰν κειμένην
  choice: isang apoy na uling
  rationale: Malinaw nitong ipinahihiwatig ang apoy mula sa uling at pinananatili ang leksikal na kaugnayan sa Juan 18:18; ang lokasyong 'roon' ay natural na naghahatid sa diwa ng κειμένην.
- source_word: ὀψάριον ἐπικείμενον
  choice: isdang nakapatong dito
  rationale: Ang ὀψάριον ay isda bilang pagkain, at malinaw na ipinapahayag ng 'nakapatong dito' na nasa ibabaw ito ng apoy na uling nang hindi idinaragdag na luto na ito.
- source_word: ἄρτον
  choice: tinapay
  rationale: Ito ang natural at di-tiyak-sa-bilang na katumbas; hindi nito ipinipilit kung isang buong tinapay o higit pa ang tinutukoy.
theological_decisions:
- issue: Makasaysayang pangkasalukuyan sa salaysay
  choice: Isinalin ang βλέπουσιν sa pangnagdaang 'nakita nila.'
  alternative: 'Panatilihin ang masiglang pangkasalukuyan: ''nakikita nila.'''
  rationale: Estilistikong katangian ito ng salaysay, hindi pagbabagong teolohikal. Mas natural sa modernong Tagalog ang pangnagdaan habang napapanatili ang pagkakasunod-sunod ng mga pangyayari.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang konkretong larawan ng pagbaba sa lupa, apoy na uling, isdang nakapatong dito, at tinapay, nang hindi dinaragdagan ang teksto ng di-tiyak na detalye.
