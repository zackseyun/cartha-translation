  to: Sinabi niya ito upang ipahiwatig kung sa anong uri ng kamatayan niya luluwalhatiin ang Diyos.[a] At pagkasabi nito, sinabi niya sa kanya,[b] “Sumunod ka sa akin.”
  rationale: Inayos ang pangunahing sugnay upang ang “niya” ang malinaw na gumaganap ng pagluwalhati sa Diyos at ang “uri ng kamatayan” ang malinaw na tumutukoy sa paraan o uri ng kanyang kamatayan. Hindi pinalawak ang pahayag tungo sa pagkamartir o sa anumang partikular na paliwanag. Inayos din ang talababa a para sa likas na modernong Tagalog.
