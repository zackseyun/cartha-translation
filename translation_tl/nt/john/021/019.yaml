  yaml_path: translation/nt/john/021/019.yaml
  text: He said this to indicate by what kind of death he would glorify God[a]. And after saying this, he says to him[b], “Follow me.”
translation:
  language: tl
  text: Sinabi niya ito upang ipahiwatig kung sa anong uri ng kamatayan niya luluwalhatiin ang Diyos.[a] At pagkasabi nito, sinabi niya sa kanya,[b] “Sumunod ka sa akin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pamamagitan ng anong uri ng kamatayan.”
    reason: lexical_alternative
  - marker: b
    text: 'Pangkasalukuyang anyo ang ginamit sa Griyego: “sinasabi niya sa kanya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σημαίνων
  choice: upang ipahiwatig
  rationale: Ipinahahayag ng participle ang layunin o paliwanag ng naunang sinabi; natural sa modernong Tagalog ang “upang ipahiwatig” at pinananatili nito ang di-tuwirang pagpapakilala.
- source_word: ποίῳ θανάτῳ
  choice: kung anong uri ng kamatayan
  rationale: Pinananatili ng “uri” ang kwalitatibong diin ng ποίῳ, hindi lamang ang payak na “kung anong kamatayan.”
- source_word: δοξάσει τὸν θεόν
  choice: ang ipagbibigay niya ng kaluwalhatian sa Diyos
  rationale: Natural na Tagalog ito para sa pagkilos na magbibigay-luwalhati sa Diyos sa pamamagitan ng kamatayang tinutukoy, habang pinananatili ang Diyos bilang tumatanggap ng kaluwalhatian.
- source_word: καὶ τοῦτο εἰπὼν
  choice: At pagkasabi nito
  rationale: Maikli at likas na temporal na salin ng aorist participial construction.
- source_word: λέγει αὐτῷ
  choice: sinabi niya sa kanya
  rationale: Ginamit ang karaniwang nakaraang panahunan sa Tagalog upang maging natural ang salaysay; ang makasaysayang pangkasalukuyan ng Griyego ay itinala sa talababa.
- source_word: Ἀκολούθει μοι
  choice: Sumunod ka sa akin
  rationale: Natural at matatag na pautos sa Tagalog na maaaring tumukoy kapwa sa agarang pagsunod at sa nagpapatuloy na pagiging alagad.
theological_decisions:
- issue: Ang kahulugan ng pagbibigay ng kaluwalhatian sa Diyos sa pamamagitan ng kamatayan ni Pedro
  choice: Pinanatili ang pahayag na ang kamatayan niya ay magbibigay ng kaluwalhatian sa Diyos nang walang dagdag na paliwanag.
  alternative: Tahasang tukuyin na ang pagiging martir o tapat na pagpapatotoo ni Pedro ang magbibigay ng kaluwalhatian sa Diyos.
  rationale: Hindi ipinaliliwanag ng talata mismo kung paano magbibigay ng kaluwalhatian sa Diyos ang kamatayang ito; iniiwasan ng salin ang pagpasok ng interpretasyong higit sa sinabi ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang kwalitatibong diin sa uri ng kamatayan at iniwasang palawakin ang teolohikal na kahulugan ng “magbigay ng kaluwalhatian sa Diyos.”
