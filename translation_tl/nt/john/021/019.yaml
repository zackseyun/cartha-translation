    issue: Maliwanag na hindi wasto ang ugnayang panggramatika sa “kung anong uri ng kamatayan ang ipagbibigay niya ng kaluwalhatian sa Diyos.”
    rationale: Sa kasalukuyang anyo, ang “uri ng kamatayan” ay nagiging tila layon o paksa ng “ipagbibigay ... ng kaluwalhatian,” samantalang si Pedro ang paksa ng “luluwalhatiin,” at ang uri ng kamatayan ang paraan o kalagayan nito.
  - severity: low
    issue: Hindi likas ang alternatibong pananalita sa talababa a.
    rationale: Ang “sa pamamagitan ng kung anong paraan ng kamatayan” ay mabigat at paulit-ulit ang “paraan” at “kamatayan.” Mas malinaw ang “sa pamamagitan ng anong uri ng kamatayan.”
