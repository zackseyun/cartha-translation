  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀Ἐπιστραφεὶς ὁ Πέτρος βλέπει τὸν μαθητὴν ὃν ἠγάπα ὁ Ἰησοῦς ἀκολουθοῦντα, ὃς καὶ ἀνέπεσεν ἐν τῷ δείπνῳ ἐπὶ τὸ στῆθος αὐτοῦ καὶ εἶπεν· Κύριε, τίς ἐστιν ὁ παραδιδούς σε;
base_translation:
  language: en
  yaml_path: translation/nt/john/021/020.yaml
  text: Peter turned and saw the disciple whom Jesus loved following[a], who had also leaned back against his chest at the supper and said, “Lord[b], who is the one betraying you?”
translation:
  language: tl
  text: Lumingon si Pedro at nakita niya ang alagad na minamahal ni Jesus na sumusunod[a]—ang alagad na humilig din sa dibdib ni Jesus sa hapunan[b] at nagsabi, “Panginoon, sino po ang nagkakanulo sa inyo?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tahasang sinasabi sa Griyego kung kanino siya sumusunod; maaari ring unawaing “sumusunod sa kanya” o “sumusunod sa kanila.”
    reason: lexical_alternative
  - marker: b
    text: Ang pandiwang Griyego ay tumutukoy sa paghilig o pagrereklina sa hapag habang kumakain; maaari rin itong isaling “sumandal sa dibdib ni Jesus.”
    reason: cultural_and_lexical_clarification
lexical_decisions:
- source_word: Ἐπιστραφεὶς
  choice: Paglingon
  rationale: Likas na Filipino para sa aorist participle at malinaw na ipinakikita ang kilos bago nakita ni Pedro ang alagad.
- source_word: βλέπει
  choice: nakita
  rationale: Isinalin sa nakaraang panahunan ang historical present upang maging natural ang salaysay sa Filipino.
- source_word: τὸν μαθητὴν
  choice: ang alagad
  rationale: Karaniwang salin sa kontekstong biblikal at nagpapanatili ng pagkakaugnay sa bokabularyo ng Juan.
- source_word: ὃν ἠγάπα ὁ Ἰησοῦς
  choice: na minamahal ni Jesus
  rationale: Natural at tapat na salin ng sugnay; ang aspektong imperpektibo ay angkop na ipinahahayag ng “minamahal.”
- source_word: ἀκολουθοῦντα
  choice: sumusunod
  rationale: Hindi nilagyan ng tahasang layon sapagkat wala ring tahasang layon sa Griyego; pinananatili nito ang tunay na kalabuan kung kanino siya sumusunod.
- source_word: ἀνέπεσεν ... ἐπὶ τὸ στῆθος αὐτοῦ
  choice: sumandal sa dibdib ni Jesus
  rationale: Ipinahahayag sa natural na Filipino ang pagkiling o pagsandal mula sa posisyong nakahilig sa hapag; ginawang tahasan ang reperente ng panghalip upang maiwasan ang malabong “niya.”
- source_word: ἐν τῷ δείπνῳ
  choice: habang naghahapunan sila
  rationale: Natural na modernong Filipino para sa tagpo ng hapunan nang hindi nagpapahiwatig ng teknikal na liturhikong kahulugan.
- source_word: Κύριε
  choice: Panginoon
  rationale: Pamantayang salin na nagpapanatili kapuwa ng magalang na pagtawag at ng teolohikal na alingawngaw ng katawagan kay Jesus.
- source_word: ὁ παραδιδούς σε
  choice: ang magkakanulo sa inyo
  rationale: Sa konteksto ng pagpapahirap kay Jesus, ang παραδίδωμι ay tumutukoy sa pagkakanulo; ang “magkakanulo” ay natural sa Filipino at ang “sa inyo” ay magalang na panghalip para sa isahang kausap.
theological_decisions:
- issue: Historical present na βλέπει
  choice: 'Isinalin bilang nakaraang panahunan: “nakita”'
  alternative: 'Panatilihin ang kasalukuyang anyo: “nakikita”'
  rationale: Mas natural sa salaysay na Filipino ang nakaraang panahunan, at walang nawawalang teolohikal na diwa.
- issue: Hindi tahasang layon ng ἀκολουθοῦντα
  choice: “sumusunod,” na walang idinagdag na layon
  alternative: “sumusunod sa kanya” o “sumusunod sa kanila”
  rationale: Hindi tinutukoy ng Griyego kung kay Jesus lamang o kina Jesus at Pedro sumusunod ang alagad; hindi dapat tahimik na lutasin ng salin ang kalabuang ito.
- issue: Pagkakakilanlan ng minamahal na alagad
  choice: Pinanatiling “ang alagad na minamahal ni Jesus”
  alternative: Pangalanan siyang Juan
  rationale: Hindi siya pinapangalanan sa talata, kaya hindi ipinapasok sa teksto ang isang tradisyonal na pagkakakilanlan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, magalang, at marangal. Ginamit ang “po” at “inyo” sa tuwirang pagtawag kay Jesus. Iniwasan ang artipisyal na biblikal o arkaikong ayos, ngunit pinanatili ang katawagang “alagad” at “Panginoon.”
