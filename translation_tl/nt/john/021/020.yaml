revisions:
- from: Paglingon ni Pedro, nakita niyang sumusunod[a] ang alagad na minamahal ni Jesus. Siya rin ang sumandal sa dibdib ni Jesus habang naghahapunan sila[b] at nagtanong, “Panginoon, sino po ang magkakanulo sa inyo?”
  to: Lumingon si Pedro at nakita niya ang alagad na minamahal ni Jesus na sumusunod[a]—ang alagad na humilig din sa dibdib ni Jesus sa hapunan[b] at nagsabi, “Panginoon, sino po ang nagkakanulo sa inyo?”
  rationale: Inayos ang ugnayan ng relative clause upang ang alagad na sumusunod ay malinaw ding siyang humilig sa hapunan at nagtanong. Pinalitan ang panghinaharap na “magkakanulo” ng “nagkakanulo” upang maipakita ang anyong kasalukuyan ng Griyegong participle, nang hindi nagdaragdag ng interpretasyon. Napanatili ang hindi tahasang layon ng “sumusunod” at ang hindi pinangalanang pagkakakilanlan ng minamahal na alagad.
