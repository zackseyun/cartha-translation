revisions:
- from: Kaya matapos silang mag-almusal, sinabi ni Jesus kay Simon Pedro, “Simon, anak ni Juan, iniibig mo ba ako nang higit kaysa sa mga ito?[b]” Sumagot siya, “Oo, Panginoon; alam mong iniibig kita.[a]” Sinabi ni Jesus sa kanya, “Pakainin mo ang aking mga kordero.”
  to: Nang makapag-almusal na sila, sinabi ni Jesus kay Simon Pedro, “Simon, anak ni Juan, mahal mo ba ako nang higit kaysa sa mga ito?[b]” Sinabi ni Pedro sa kanya, “Oo, Panginoon; alam mong mahal kita.[a]” Sinabi ni Jesus sa kanya, “Pakainin mo ang aking mga kordero.”
  rationale: Pinalitan ang mas arkaikong “iniibig” ng modernong “mahal,” kapwa sa tanong at tugon, habang pinananatili ang parehong salin para sa dalawang pandiwang Griyego. Inayos din ang talababa upang tumugma sa pangunahing teksto at upang ilarawan nang walang labis na pagpapakahulugan ang pinagtatalunang pagkakaiba ng mga pandiwa. Pinanatili ang kalabuan ng “higit kaysa sa mga ito.”
