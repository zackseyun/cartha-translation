  verdict: revise
  source_fidelity: 'Tumpak sa kabuuan ang draft: naipapahayag nito ang pagkain sa umaga, ang patronimikong “anak ni Juan,” ang di-tiyak na paghahambing sa πλέον τούτων, at ang tiyak na utos na pakainin ang mga kordero. Gayunman, ang “iniibig” ay mas mataas at mas luma ang dating kaysa karaniwang modernong Filipino Tagalog; hindi ito ang pinakanatural na katumbas sa tuwirang pag-uusap.'
  naturalness: Mas natural at pangkasalukuyang Filipino ang “mahal mo ba ako?” at “mahal kita” kaysa “iniibig.” Ang “Nang makapag-almusal na sila” ay likas ding paraan upang ipahayag ang temporal na participial clause.
  terminology: Pinanatili ang “Jesus,” “Simon Pedro,” “Juan,” “Panginoon,” at “mga kordero.” Parehong “mahal” ang ginagamit para sa ἀγαπάω at φιλέω upang huwag igiit ang isang pinagtatalunang pagkakaibang leksikal; ang pagkakaiba ay maingat na inilalagay sa talababa.
