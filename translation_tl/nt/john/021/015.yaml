  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ὅτε οὖν ἠρίστησαν λέγει τῷ Σίμωνι Πέτρῳ ὁ Ἰησοῦς· Σίμων ⸀Ἰωάννου, ἀγαπᾷς με πλέον τούτων; λέγει αὐτῷ· Ναί, κύριε, σὺ οἶδας ὅτι φιλῶ σε. λέγει αὐτῷ· Βόσκε τὰ ἀρνία μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/015.yaml
  text: So when they had eaten breakfast[a], Jesus said to Simon Peter, “Simon, son of John, do you love me more than these?” He said to him, “Yes, Lord; you know that I love you.” He said to him[b], “Feed my lambs.”
translation:
  language: tl
  text: Nang makapag-almusal na sila, sinabi ni Jesus kay Simon Pedro, “Simon, anak ni Juan, mahal mo ba ako nang higit kaysa sa mga ito?[b]” Sinabi ni Pedro sa kanya, “Oo, Panginoon; alam mong mahal kita.[a]” Sinabi ni Jesus sa kanya, “Pakainin mo ang aking mga kordero.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dalawang magkaibang pandiwa ang ginamit sa Griyego: nagtanong si Jesus gamit ang ἀγαπάω (“mahalin”), at sumagot si Pedro gamit ang φιλέω (“mahalin; magkaroon ng pagmamahal”). Nakikita rito ng ilang tagapagpaliwanag ang isang pagkakaiba, samantalang itinuturing naman ito ng iba na estilistikong pagpapalit lamang. Parehong “mahal” ang ginamit sa pangunahing teksto upang hindi ipilit ang isang pagkakaibang hindi tahasang nililinaw ng konteksto.'
    reason: lexical_alternative
  - marker: b
    text: Ang “nang higit kaysa sa mga ito” ay maaaring mangahulugang “nang higit kaysa sa pagmamahal sa akin ng mga taong ito” o “nang higit kaysa sa pagmamahal mo sa mga bagay na ito.” Hindi tahasang tinutukoy ng Griyego ang pinaghahambingan.
    reason: alternative_reading
lexical_decisions:
- source_word: ἠρίστησαν
  choice: matapos silang mag-almusal
  rationale: Ang ἀριστάω ay tumutukoy sa pagkain sa umaga. Likas sa modernong Tagalog ang “mag-almusal,” at malinaw na nauna ang pagkain sa sumunod na pag-uusap.
- source_word: λέγει
  choice: sinabi
  rationale: Bagaman nasa historical present ang Griyego, mas natural sa salaysay na Tagalog ang pangnagdaan na “sinabi.”
- source_word: Σίμων Ἰωάννου
  choice: Simon, anak ni Juan
  rationale: Ang genitibong Ἰωάννου ay patronimiko at tuwirang nangangahulugang anak ni Juan; hindi ito pinalitan ng tradisyonal na anyong “anak ni Jonas.”
- source_word: ἀγαπᾷς / φιλῶ
  choice: iniibig / iniibig
  rationale: Parehong isinalin na “iniibig” upang hindi ipilit sa pangunahing teksto ang pinagtatalunang pagkakaiba ng dalawang pandiwang Griyego. Itinala ang salit-salitang pagkakaiba sa talababa.
- source_word: πλέον τούτων
  choice: nang higit kaysa sa mga ito
  rationale: Pinananatili ng parirala ang hindi tiyak na pinaghahambingan sa Griyego sa halip na tukuyin kung mga tao, mga bagay, o pag-ibig ng ibang mga alagad ang tinutukoy.
- source_word: κύριε
  choice: Panginoon
  rationale: Ang “Panginoon” ang angkop na tuwirang tawag kay Jesus sa konteksto at nagpapanatili ng paggalang sa κύριε.
- source_word: οἶδας
  choice: alam mo
  rationale: Ito ang tuwiran at natural na katumbas ng οἶδας sa pakiusap ni Pedro sa kaalaman ni Jesus.
- source_word: Βόσκε
  choice: Pakainin mo
  rationale: Ang βόσκω ay partikular na nangangahulugang magpakain, hindi lamang pangkalahatang mangalaga o magpastol.
- source_word: τὰ ἀρνία μου
  choice: ang aking mga kordero
  rationale: Pinananatili ng “mga kordero” ang larawan ng mga batang tupa, at ng “aking” ang pagmamay-ari at malasakit ni Jesus sa kawan.
theological_decisions:
- issue: Kung dapat bang malinaw na pag-ibahin ang ἀγαπάω at φιλέω
  choice: Parehong isalin na “iniibig” sa pangunahing teksto at ipaliwanag ang magkaibang pandiwang Griyego sa talababa.
  alternative: Isalin ang ἀγαπάω bilang “iniibig” at ang φιλέω bilang “minamahal” o “may pagmamahal.”
  rationale: Hindi tiyak kung sinadya ni Juan ang isang antas o uri ng pag-ibig, o kung estilistikong pagpapalit lamang ito. Ang paggamit ng iisang salitang Tagalog ay umiiwas sa pagpasok ng teolohikong antas ng pag-ibig na hindi tahasang itinakda ng konteksto.
- issue: Ang tinutukoy na paghahambing sa πλέον τούτων
  choice: Panatilihin ang di-tiyak na “nang higit kaysa sa mga ito.”
  alternative: “Higit kaysa sa pag-ibig sa akin ng mga ito” o “higit kaysa sa pag-ibig mo sa mga bagay na ito.”
  rationale: Hindi tahasang binabanggit ng Griyego ang batayan ng paghahambing. Ang pagpili ng iisang tiyak na pakahulugan ay magpapakitid sa tunay na saklaw ng pangungusap.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal ang ginamit. Pinanatili ang pangalang “Juan,” ang titulong “Panginoon,” at ang pastoral na larawang “mga kordero.” Inilagay ang mga pananda ng talababa sa mismong mga pariralang ipinapaliwanag ng mga ito.
