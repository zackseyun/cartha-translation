  text: λέγει αὐτῷ πάλιν δεύτερον· Σίμων ⸀Ἰωάννου, ἀγαπᾷς με; λέγει αὐτῷ· Ναί, κύριε, σὺ οἶδας ὅτι φιλῶ σε. λέγει αὐτῷ· Ποίμαινε τὰ πρόβατά μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/016.yaml
  text: He said to him again a second time[a], “Simon, son of John, do you love me?” He said to him, “Yes, Lord; you know that I love you.” He said to him[b], “Shepherd my sheep.”
translation:
  language: tl
  text: Muli niyang sinabi sa kanya, sa ikalawang pagkakataon, “Simon, anak ni Juan, mahal mo ba ako?” Sumagot siya, “Opo, Panginoon; alam mong mahal kita.” Sinabi niya sa kanya, “Alagaan mo ang aking mga tupa.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Magkaibang pandiwa para sa “mahal” ang ginamit sa Griyego: ἀγαπάω sa tanong ni Jesus at φιλέω sa sagot ni Pedro. Nakikita rito ng ilang tagapagpaliwanag ang pagkakaiba ng diwa, samantalang itinuturing naman ito ng iba na pagkakaiba lamang ng estilo. Parehong “mahal” ang ginamit sa pangunahing teksto upang hindi palakihin ang isang pagkakaibang hindi tiyak sa konteksto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν δεύτερον
  choice: muli ... sa ikalawang pagkakataon
  rationale: Pinananatili ang dalawang sangkap ng Griyego—ang pag-uulit at ang tiyak na bilang—kahit may sinasadyang pag-uulit din sa Filipino.
- source_word: Σίμων Ἰωάννου
  choice: Simon, anak ni Juan
  rationale: 'Ang genitibong Ἰωάννου ay patronimiko: si Simon ay anak ni Juan, hindi ni Jonas.'
- source_word: ἀγαπᾷς / φιλῶ
  choice: iniibig / iniibig
  rationale: Magkaiba ang dalawang pandiwang Griyego, ngunit malaki ang saklaw ng pagkakatulad ng gamit ng mga ito sa konteksto. Iisang natural na pandiwa ang ginamit sa pangunahing teksto, at inilalahad sa talababa ang tunay na pagkakaiba sa salita.
- source_word: Ναί, κύριε
  choice: Opo, Panginoon
  rationale: Ang “opo” ay natural na magalang na pagsang-ayon sa modernong Filipino at ang κύριε ay angkop na “Panginoon” sa kontekstong ito.
- source_word: σὺ οἶδας
  choice: alam mo
  rationale: Natural na naipahihiwatig ng panghalip na “mo” ang tahasang paksa ng Griyego nang hindi pinabibigat ang pangungusap.
- source_word: Ποίμαινε
  choice: Pastulan mo
  rationale: Pinananatili nito ang larawan ng gawaing pastol—pag-aalaga, paggabay, at pangangasiwa—sa halip na paliitin ang diwa sa pagpapakain lamang.
- source_word: τὰ πρόβατά μου
  choice: ang aking mga tupa
  rationale: Tuwirang pinananatili ang kongkretong larawang pastoral at ang pagmamay-ari ni Jesus.
theological_decisions:
- issue: Kung dapat bang pag-ibahin sa salin ang ἀγαπάω at φιλέω
  choice: Parehong isinalin na “iniibig” sa pangunahing teksto, na may paliwanag sa talababa.
  alternative: Isalin ang ἀγαπάω bilang “iniibig” at ang φιλέω bilang “minamahal” o “may pagmamahal.”
  rationale: Totoo ang pagkakaiba ng mga pandiwa sa Griyego, ngunit hindi malinaw kung may matinding teolohikal o sikolohikal na kaibahan dito. Iniiwasan ng pangunahing salin ang labis na pagpapakahulugan habang pinananatili ng talababa ang tekstuwal na pagkakaiba.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “Opo” bilang natural na magalang na tugon at “Pastulan” upang mapanatili ang metaporang pastoral. Ang bahagyang pleonasmong “muli ... sa ikalawang pagkakataon” ay sinadya upang katawanin ang πάλιν δεύτερον.
