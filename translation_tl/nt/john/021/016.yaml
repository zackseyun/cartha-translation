revisions:
- from: Muli niyang sinabi sa kanya sa ikalawang pagkakataon, “Simon, anak ni Juan, iniibig mo ba ako?” Sumagot siya, “Opo, Panginoon; alam mong iniibig kita.” Sinabi niya sa kanya, “Pastulan mo ang aking mga tupa.”[a]
  to: Muli niyang sinabi sa kanya, sa ikalawang pagkakataon, “Simon, anak ni Juan, mahal mo ba ako?” Sumagot siya, “Opo, Panginoon; alam mong mahal kita.” Sinabi niya sa kanya, “Alagaan mo ang aking mga tupa.”[a]
  rationale: Pinalitan ang mas makalumang “iniibig” ng natural na modernong “mahal,” habang pinanatili ang pagkakaibang leksikal sa talababa. Pinalitan ang “Pastulan mo” ng “Alagaan mo” upang maihatid ang mas malawak na pastoral na saklaw ng ποιμαίνω. Nananatili sa teksto ang parehong πάλιν at δεύτερον sa “Muli ... sa ikalawang pagkakataon.”
