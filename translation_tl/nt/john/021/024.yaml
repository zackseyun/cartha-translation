  text: Οὗτός ἐστιν ὁ μαθητὴς ὁ μαρτυρῶν περὶ τούτων καὶ ⸀ὁ γράψας ταῦτα, καὶ οἴδαμεν ὅτι ἀληθὴς ⸂αὐτοῦ ἡ μαρτυρία ἐστίν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/024.yaml
  text: This is the disciple who testifies about these things and who wrote these things[a], and we know that his testimony is true.
translation:
  language: tl
  text: Ito ang alagad na nagpapatotoo tungkol sa mga bagay na ito at sumulat ng mga bagay na ito, at alam natin na totoo ang kanyang patotoo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ginagamit sa Griyego ang magkaugnay na mga salitang “nagpapatotoo” at “patotoo” sa talatang ito.
    reason: lexical_connection
lexical_decisions:
- source_word: Οὗτός
  choice: Ito
  rationale: Likas na demonstratibo sa Filipino na tumutukoy sa alagad na kababanggit at nagpapanatili sa puwersang nagpapakilala.
- source_word: ὁ μαθητὴς
  choice: ang alagad
  rationale: Karaniwan, malinaw, at angkop na salin para sa tagasunod ni Jesus sa kontekstong Juanino.
- source_word: ὁ μαρτυρῶν
  choice: na nagpapatotoo
  rationale: Ipinahihiwatig ng kasalukuyang participle ang patuloy o katangiang gawain; natural sa modernong Filipino at pinananatili ang bokabularyo ng patotoo.
- source_word: περὶ τούτων
  choice: tungkol sa mga bagay na ito
  rationale: Tuwirang salin na nagpapanatili sa demonstratibong pagtukoy sa nilalaman ng salaysay.
- source_word: ὁ γράψας ταῦτα
  choice: at sumulat ng mga ito
  rationale: Ipinapakita ng pangnagdaang pandiwari ang natapos na pagsulat; malinaw at likas ang koordinadong sugnay sa Filipino.
- source_word: οἴδαμεν
  choice: alam natin
  rationale: Karaniwang katumbas ng pandiwang may anyong perfect ngunit kasalukuyan ang kahulugan; hindi tinutukoy kung sino ang kabilang sa “natin.”
- source_word: ἀληθὴς
  choice: totoo
  rationale: Pinakadirektang panaguring pang-uri para sa pagiging totoo ng patotoo, nang hindi dinaragdagan ng interpretasyong “maaasahan.”
- source_word: αὐτοῦ ἡ μαρτυρία
  choice: ang kanyang patotoo
  rationale: Likas na anyong paari sa Filipino at pinananatili ang ugnayang leksikal sa “nagpapatotoo.”
theological_decisions:
- issue: Pagkakakilanlan at tinig ng “alam natin”
  choice: Isinalin nang tuwiran bilang “alam natin” nang hindi tinutukoy ang mga nagsasalita.
  alternative: Unawain bilang editoryal na tinig ng ebanghelista o bilang pagpapatibay ng isang pamayanan ng mga saksi.
  rationale: Malinaw na unang panauhang maramihan ang Griyego ngunit hindi nito kinikilala ang tinutukoy; dapat panatilihin ng salin ang kalabuan hinggil sa may-akda o pamayanan.
translation_notes:
  register: Modernong Filipino na simple, marangal, at madaling maunawaan. Pinanatili ang pag-uulit ng bokabularyo ng patotoo at ang hindi tinukoy na saklaw ng unang panauhang maramihan.
