  yaml_path: translation/nt/john/021/010.yaml
  text: Jesus said to them[a], “Bring some of the fish that you have now caught.”
translation:
  language: tl
  text: Sinabi ni Jesus sa kanila, “Magdala kayo rito ng ilan sa mga isdang nahuli ninyo ngayon.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: Sinabi
  rationale: Ang pangkasalukuyang anyo sa Griyego ay historical present; natural itong isinasalaysay sa nakaraang panahunan sa Tagalog.
- source_word: Ἐνέγκατε
  choice: Magdala kayo rito
  rationale: Tuwirang utos ito sa maramihan. Nililinaw ng “rito” ang pagdadala patungo kay Jesus, na likas sa konteksto.
- source_word: ἀπὸ τῶν ὀψαρίων
  choice: ng ilan sa mga isda
  rationale: 'Partitibo ang ἀπό kasama ng genitive: hindi lahat ng huli kundi isang bahagi mula rito.'
- source_word: ὀψαρίων
  choice: mga isda
  rationale: Bagaman maaari itong tumukoy sa maliliit na isda o isdang pagkain, sa konteksto ay payak na tumutukoy ito sa mga isdang nahuli.
- source_word: ὧν ἐπιάσατε νῦν
  choice: na kahuhuli lamang ninyo
  rationale: Natural na ipinahahayag ng “kahuhuli lamang” ang katatapos at kasalukuyang kaugnayan ng paghuli na ipinahihiwatig ng νῦν.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “kayo” upang ipakita ang maramihang kausap at ang “kahuhuli lamang” bilang malinaw at karaniwang pagpapahayag ng isang kilos na katatapos lang.
