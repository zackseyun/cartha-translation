  to: Sinabi ni Jesus sa kanila, “Magdala kayo rito ng ilan sa mga isdang nahuli ninyo ngayon.”
  rationale: Pinalitan ang hindi gaanong natural na “kahuhuli lamang ninyo” ng malinaw na relative clause na “na nahuli ninyo ngayon,” upang mapanatili ang χρονological force ng νῦν at ang natural na gamit sa modernong Filipino Tagalog. Inayos din ang karaniwang ayos ng mga parirala sa unang sugnay. Napanatili ang partitibong “ilan sa mga isda” at ang maramihang utos.
