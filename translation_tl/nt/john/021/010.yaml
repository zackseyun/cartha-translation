  source_fidelity: Wastong naipapahayag ng draft ang utos na maramihan, ang partitibong diwa ng ἀπὸ τῶν ὀψαρίων, at ang pagtukoy sa mga isdang nahuli ng mga kausap. Gayunman, ang “kahuhuli lamang ninyo” ay hindi malinaw na natural na anyong pangkamag-anak sa modernong Tagalog at maaaring magpahina sa tiyak na ugnayan ng νῦν sa pagkakahuli. Ang “na nahuli ninyo ngayon” ay tuwirang tumutugon sa source nang hindi nagdaragdag ng antas ng diin na wala sa teksto.
