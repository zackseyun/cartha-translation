id: JHN.21.14
reference: John 21:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τοῦτο ἤδη τρίτον ἐφανερώθη ⸀ὁ Ἰησοῦς τοῖς ⸀μαθηταῖς ἐγερθεὶς ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/014.yaml
  text: This was now the third time Jesus was revealed to the disciples after he had been raised from the dead[a].
translation:
  language: tl
  text: Ito na ang ikatlong pagkakataong nahayag si Jesus sa mga alagad matapos siyang ibangon mula sa mga patay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Ito na ang ikatlong pagkakataong nagpakita si Jesus sa mga alagad matapos siyang ibangon mula sa mga patay.”
    reason: Alternatibong natural na salin ng ἐφανερώθη bilang “nagpakita.”
lexical_decisions:
- source_word: τοῦτο ἤδη τρίτον
  choice: Ito na ang ikatlong pagkakataon
  rationale: Tumutukoy ang demonstratibo sa pangyayaring kasasalaysay lamang, at likas na ipinapahayag sa Filipino ng pariralang ito ang pag-abot ng bilang sa ikatlong pagkakataon.
- source_word: ἐφανερώθη
  choice: nahayag
  rationale: Pinananatili ng “nahayag” ang pasibong anyo at ang diwang Johannine ng pagiging hayag o ipinakilala, samantalang nananatiling natural sa makabagong Filipino.
- source_word: ὁ Ἰησοῦς
  choice: si Jesus
  rationale: Karaniwang anyong Filipino para sa pangalang pantangi na paksa ng pangungusap.
- source_word: τοῖς μαθηταῖς
  choice: sa mga alagad
  rationale: Tapat sa datibo at hindi idinaragdag ang “kaniyang,” na nauunawaan sa konteksto ngunit hindi tahasang nasa Griyego.
- source_word: ἐγερθεὶς
  choice: matapos siyang ibangon
  rationale: Ipinapahayag ang naunang kilos ng aorist participle at pinananatili ang pasibong tinig ng Griyego.
- source_word: ἐκ νεκρῶν
  choice: mula sa mga patay
  rationale: Natural at nakaugaliang pariralang Filipino para sa wikang tumutukoy sa muling pagkabuhay.
theological_decisions:
- issue: Pasibong pananalita sa ἐγερθεὶς ἐκ νεκρῶν
  choice: matapos siyang ibangon mula sa mga patay
  alternative: matapos siyang bumangon mula sa mga patay
  rationale: Pasibo ang participle sa Griyego; pinananatili ng pangunahing salin ang tinig nito nang hindi tinutukoy nang tahasan ang gumagawa ng kilos.
- issue: Kahulugan ng ἐφανερώθη
  choice: nahayag
  alternative: nagpakita
  rationale: Pinananatili ng “nahayag” ang pormal na pasibo at ang posibleng diin sa paghahayag; ang “nagpakita” ay natural na alternatibo ngunit ginagawang aktibo ang anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “alagad” bilang pamilyar na katawagang biblikal, habang iniwasan ang lipas o labis na teknikal na pananalita.
