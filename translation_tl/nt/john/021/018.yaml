  terminology: Ang ‘Tunay na tunay,’ ‘bibihisan,’ at ‘dadalhin’ ay angkop at magkakatugma. Inayos ang literal na paliwanag ng ζώννυμι upang mas malinaw na ang sarili ni Pedro ang binibigkisan. Inayos din ang talababa tungkol sa v. 19 upang si Pedro, hindi ang kanyang kamatayan, ang siyang nagbibigay-luwalhati sa Diyos.
