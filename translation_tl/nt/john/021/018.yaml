id: JHN.21.18
reference: John 21:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω σοι, ὅτε ἦς νεώτερος, ἐζώννυες σεαυτὸν καὶ περιεπάτεις ὅπου ἤθελες· ὅταν δὲ γηράσῃς, ἐκτενεῖς τὰς χεῖράς σου, καὶ ἄλλος ⸂σε ζώσει⸃ καὶ οἴσει ὅπου οὐ θέλεις.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/018.yaml
  text: Truly[a], truly, I say to you, when you were younger, you used to dress yourself and walk where you wanted; but when you grow old, you will stretch out your hands[c][b], and another will dress you and carry you where you do not want to go.
translation:
  language: tl
  text: '“Tunay na tunay na sinasabi ko sa iyo: noong mas bata ka pa, ikaw mismo ang nagbibihis[a] at naglalakad kung saan mo gusto. Ngunit pagtanda mo, iuunat mo ang iyong mga kamay[b], at bibihisan ka ng iba at dadalhin ka[c] kung saan ayaw mong pumunta.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “binibigkisan mo ang iyong sarili.” Ang pandiwang Griyego ay tumutukoy sa pagtatali o paghihigpit ng damit sa katawan; dito, inihahambing ang dating kasarinlan ni Pedro sa pagdepende niya sa iba kalaunan.
    reason: lexical_alternative
  - marker: b
    text: Ang “iuunat mo ang iyong mga kamay” ay madalas unawain bilang pahiwatig ng pagkamatay ni Pedro sa pamamagitan ng pagpapako sa krus. Ipinaliliwanag sa kasunod na talata na sinabi ito ni Jesus upang ipahiwatig kung anong uri ng kamatayan ang magiging paraan upang luwalhatiin ni Pedro ang Diyos.
    reason: cross_reference
  - marker: c
    text: Maaari ring “bubuhatin ka,” “aakayin ka,” o “kukunin ka.” Maaaring tumukoy ang salitang Griyego sa pagdadala sa isang tao patungo sa lugar na ayaw niyang puntahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Tunay na tunay
  rationale: Pinananatili ang pag-uulit at mariing katiyakan ng pormulang ginagamit sa Juan, habang natural at malinaw sa makabagong Tagalog.
- source_word: λέγω σοι
  choice: sinasabi ko sa iyo
  rationale: Malapit sa anyo ng Griyego at pinananatili ang tuwirang pakikipag-usap ni Jesus kay Pedro.
- source_word: ὅτε ἦς νεώτερος
  choice: noong mas bata ka pa
  rationale: Ipinakikita ng “mas bata” ang pahambing na diwa ng νεώτερος, na ikinukumpara sa pagtanda ni Pedro.
- source_word: ἐζώννυες σεαυτόν
  choice: ikaw mismo ang nagbibihis sa sarili mo
  rationale: Natural na ipinahahayag sa Tagalog ang sariling pagkilos at dating kasarinlan ni Pedro; inilalagay sa talababa ang mas literal na diwang pagbibigkis ng damit.
- source_word: περιεπάτεις ὅπου ἤθελες
  choice: naglalakad kung saan mo gusto
  rationale: Pinananatili ang kongkretong larawan ng malayang pagkilos, hindi ang metaporikal na pamumuhay.
- source_word: ὅταν δὲ γηράσῃς
  choice: Ngunit pagtanda mo
  rationale: Likas na pagpapahayag sa Tagalog ng panghinaharap na kondisyon at malinaw na ipinakikita ang pagsalungat sa dating kalayaan.
- source_word: ἐκτενεῖς τὰς χεῖράς σου
  choice: iuunat mo ang iyong mga kamay
  rationale: Tuwirang salin na hindi pa tahasang nagpapakahulugan dito bilang pagpapako sa krus; hinahayaan nitong ipaliwanag iyon ng kasunod na talata.
- source_word: ἄλλος σε ζώσει
  choice: bibihisan ka ng iba
  rationale: Pinananatili ang leksikal na pagkakatugma sa naunang kilos ng pagbibihis at ang pagsalungat ng sariling pagkilos sa pagkilos ng ibang tao.
- source_word: οἴσει
  choice: dadalhin ka
  rationale: Natural sa Tagalog at saklaw ang diwa ng pagdadala o sapilitang pagkuha patungo sa isang lugar.
- source_word: ὅπου οὐ θέλεις
  choice: kung saan ayaw mong pumunta
  rationale: Idinagdag ang “pumunta,” na ipinahihiwatig sa Griyego, upang maging buo at natural ang pangungusap sa Tagalog.
theological_decisions:
- issue: Kung tahasang babanggitin sa pangunahing teksto ang pagpapako sa krus
  choice: Panatilihing literal ang “iuunat mo ang iyong mga kamay” at huwag tahasang sabihing pagpapako sa krus
  alternative: Isalin ang larawan bilang tahasang hula na ipapako sa krus si Pedro
  rationale: Sa kasunod na talata pa ipinaliliwanag ng tagapagsalaysay na tinutukoy ni Jesus ang uri ng kamatayan ni Pedro. Pinananatili ng salin ang pagkakasunod at tensiyong nasa teksto.
- issue: Kung isasalin ang ζώσει bilang “gagapusin” sa ikalawang paglitaw
  choice: Gamitin ang “bibihisan” upang tumbasan ang kaparehong pandiwa sa naunang sugnay
  alternative: Gamitin ang “gagapusin” bilang pahiwatig ng pagkakabihag o pagpapako sa krus
  rationale: Bagaman maaaring magpahiwatig ng paggapos ang konteksto, inuuna ng pangunahing teksto ang malinaw na leksikal na paralelismo at hindi pinipili nang tahasan ang isang interpretasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Tunay na tunay” upang mapanatili ang dobleng mariing pormula nang hindi nagiging labis na arkaiko. Ang “nagbibihis sa sarili mo” at “bibihisan ka ng iba” ay karaniwang pananalita ngunit pinananatili ang mahalagang paralelismo ng dalawang anyo ng iisang pandiwang Griyego.
