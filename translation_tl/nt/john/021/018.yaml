  source_fidelity: 'Tumpak ang pangunahing salin sa mahahalagang elemento: pinananatili nito ang dobleng mariing ἀμὴν ἀμὴν, ang pahambing na ‘mas bata,’ ang habitual na dating kasarinlan, ang literal na pag-uunat ng mga kamay, at ang paralelismo ng dalawang anyo ng ζώννυμι. Hindi nito maagang ipinapasok sa teksto ang interpretasyong pagpapako sa krus.'
