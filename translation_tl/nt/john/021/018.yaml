    rationale: Nasa pandiwang ‘nagbibihis’ na ang likas na reflexive na diwa sa Filipino; ang ‘ikaw mismo’ ay sapat upang panatilihin ang diin ng σεαυτόν nang mas natural ang pangungusap.
