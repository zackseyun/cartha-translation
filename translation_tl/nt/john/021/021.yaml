  yaml_path: translation/nt/john/021/021.yaml
  text: So when Peter saw him, he says to Jesus, “Lord, what about this man?”
translation:
  language: tl
  text: Kaya nang makita siya ni Pedro, sinabi niya kay Jesus, “Panginoon, paano naman ang taong ito?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτον ... ἰδών
  choice: nang makita siya
  rationale: Likas na Filipino para sa participial construction; ang “siya” ay nagpapanatili sa reperensiya sa naunang binanggit na alagad.
- source_word: λέγει
  choice: sinabi niya
  rationale: Bagaman historical present ang Griyego, mas natural sa salaysay na Filipino ang pangnagdaan.
- source_word: Κύριε
  choice: Panginoon
  rationale: Karaniwan at marangal na katumbas ng direktang pagtawag kay Jesus bilang κύριε.
- source_word: οὗτος δὲ τί;
  choice: paano naman ang taong ito?
  rationale: Ipinahahayag ang eliptikong tanong bilang natural na Filipino habang pinananatili ang di-tiyak na saklaw nito—kung ano ang mangyayari o hinihingi tungkol sa taong iyon.
theological_decisions:
- issue: Elipsis sa οὗτος δὲ τί;
  choice: paano naman ang taong ito?
  alternative: ano naman ang mangyayari sa taong ito?
  rationale: Hindi tahasang sinasabi ng Griyego ang “mangyayari,” kaya hindi ito idinagdag; pinananatili ng salin ang tunay na elipsis at ambiguwidad.
translation_notes:
  register: Modernong Filipino Tagalog, malinaw at marangal. Iniwasan ang salitang “lalaki” sapagkat ang taong tinutukoy ay nakikilala na sa konteksto, at mas natural dito ang “ang taong ito.”
