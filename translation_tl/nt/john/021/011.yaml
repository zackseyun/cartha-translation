source:
  edition: SBLGNT
  text: ἀνέβη ⸀οὖν Σίμων Πέτρος καὶ εἵλκυσεν τὸ δίκτυον ⸂εἰς τὴν γῆν⸃ μεστὸν ἰχθύων μεγάλων ἑκατὸν πεντήκοντα τριῶν· καὶ τοσούτων ὄντων οὐκ ἐσχίσθη τὸ δίκτυον.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/011.yaml
  text: So Simon Peter went aboard and pulled the net onto the shore[a], full of large fish, one hundred fifty-three; and though there were so many[b], the net was not torn.
translation:
  language: tl
  text: Kaya sumampa[a] si Simon Pedro at hinila ang lambat paahon sa pampang, na punô ng 153 malalaking isda. At kahit napakarami ng mga ito, hindi napunit ang lambat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “umakyat.” Literal na “umakyat” ang pandiwang Griyego; sa kontekstong ito, malamang na tumutukoy ito sa pagsampa ni Simon Pedro sa bangka upang hilahin ang lambat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβη
  choice: sumampa
  rationale: Tuwirang ipinahihiwatig ng pandiwa ang pag-akyat; sa konteksto, malamang na sumampa si Pedro sa bangka. Pinananatili ng “sumampa” ang kilos nang hindi tahasang idinaragdag sa pangunahing teksto ang salitang “bangka.”
- source_word: οὖν
  choice: Kaya
  rationale: Nag-uugnay sa kilos ni Pedro sa naunang utos ni Jesus at natural na panandang pasalaysay sa Filipino.
- source_word: εἵλκυσεν
  choice: hinila
  rationale: Karaniwan at malinaw na salita para sa paghila ng lambat; hindi nito labis na idinidiin ang pagkaskas na maaaring ipahiwatig ng “kinaladkad.”
- source_word: τὸ δίκτυον
  choice: ang lambat
  rationale: Karaniwang katawagan sa kagamitang pangisda at angkop sa konteksto.
- source_word: εἰς τὴν γῆν
  choice: papunta sa pampang
  rationale: Literal na tumutukoy sa lupa, ngunit sa tagpong pangingisda ang pampang ang natural na tinutukoy na hantungan.
- source_word: μεστὸν ἰχθύων μεγάλων
  choice: na punô ng 153 malalaking isda
  rationale: Natural na ayos sa Filipino na malinaw na inilalarawan ang laman ng lambat at pinananatili ang tahasang bilang at laki ng mga isda.
- source_word: ἑκατὸν πεντήκοντα τριῶν
  choice: '153'
  rationale: Eksaktong pinananatili ang bilang; ang numerong anyo ay malinaw at madaling basahin sa modernong Filipino.
- source_word: τοσούτων ὄντων
  choice: kahit napakarami ng mga ito
  rationale: 'Ipinapahayag ang konsesibong diwa ng genitive absolute: sa kabila ng napakaraming isda, nanatiling buo ang lambat.'
- source_word: οὐκ ἐσχίσθη τὸ δίκτυον
  choice: hindi napunit ang lambat
  rationale: Likas na Filipino na pinananatili ang diwa ng pasibong pandiwa at ang hindi pagkasira ng lambat.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang “punô” upang maiba sa “puno” bilang tree o leader. Isang talababa lamang ang kailangan upang mapanatili ang posibleng literal na kahulugan ng ἀνέβη nang hindi ginagawang tahasan sa pangunahing teksto ang hindi binanggit na “bangka.”
