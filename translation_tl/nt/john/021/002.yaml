reference: John 21:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἦσαν ὁμοῦ Σίμων Πέτρος καὶ Θωμᾶς ὁ λεγόμενος Δίδυμος καὶ Ναθαναὴλ ὁ ἀπὸ Κανὰ τῆς Γαλιλαίας καὶ οἱ τοῦ Ζεβεδαίου καὶ ἄλλοι ἐκ τῶν μαθητῶν αὐτοῦ δύο.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/002.yaml
  text: Simon Peter[a], Thomas called Didymus, Nathanael from Cana of Galilee, the sons of Zebedee, and two others of his disciples were together.
translation:
  language: tl
  text: Magkakasama si Simon Pedro, si Tomas na tinatawag na Kambal[a], si Natanael na taga-Cana ng Galilea, ang mga anak ni Zebedeo, at dalawa pang iba sa kanyang mga alagad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griyego: Didymos, na nangangahulugang “Kambal.”'
    reason: Ibinibigay ang anyong Griyego ng katawagan upang maipakita kung bakit isinalin ito sa halip na basta itranslitera.
lexical_decisions:
- source_word: ἦσαν ὁμοῦ
  choice: Magkakasama
  rationale: Pinagsasama nito sa natural na Tagalog ang payak na kalagayang ipinahahayag ng ἦσαν at ang diwa ng ὁμοῦ na sila ay magkakasama o nasa iisang lugar.
- source_word: Σίμων Πέτρος
  choice: Simon Pedro
  rationale: Ginamit ang nakagawiang anyo ng pangalan sa modernong saling Tagalog.
- source_word: Θωμᾶς ὁ λεγόμενος Δίδυμος
  choice: Tomas na tinatawag na Kambal[a]
  rationale: Ang λεγόμενος ay 'tinatawag na,' at ang Δίδυμος ay karaniwang salitang Griyego para sa 'kambal'; pinananatili ng salin ang kahulugan ng katawagan sa halip na transliterasyon lamang.
- source_word: Ναθαναὴλ ὁ ἀπὸ Κανὰ τῆς Γαλιλαίας
  choice: Natanael na taga-Cana ng Galilea
  rationale: Likas na ipinahahayag ng 'taga-' ang pinagmulan na tinutukoy ng ἀπό, habang pinananatili ang heograpikong katawagang Cana ng Galilea.
- source_word: οἱ τοῦ Ζεβεδαίου
  choice: ang mga anak ni Zebedeo
  rationale: Ang eliptikong pariralang Griyego ay tumutukoy sa mga anak ni Zebedeo; kailangang ilantad ang 'mga anak' sa Tagalog para sa kalinawan.
- source_word: ἄλλοι ἐκ τῶν μαθητῶν αὐτοῦ δύο
  choice: dalawa pang iba sa mga alagad niya
  rationale: Pinananatili ng 'sa mga alagad niya' ang partitive na diwa ng ἐκ, at ng 'dalawa pang iba' ang bilang at pagiging iba pa ng dalawang hindi pinangalanan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang pantukoy na 'sina' para sa unang magkakasunod na mga pangalan, ngunit pinanatili ang malinaw na pagkakahanay ng buong talaan. Inilagay ang talababa sa 'Kambal,' na siyang salitang tinutukoy nito.
