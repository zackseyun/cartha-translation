  text: ⸀ἔρχεται ⸀ὁ Ἰησοῦς καὶ λαμβάνει τὸν ἄρτον καὶ δίδωσιν αὐτοῖς, καὶ τὸ ὀψάριον ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/013.yaml
  text: Jesus comes and takes the bread and gives it to them[b][a], and the fish likewise.
translation:
  language: tl
  text: Lumapit si Jesus, kinuha niya ang tinapay at ibinigay iyon sa kanila[a], at ibinigay din niya sa kanila ang isda.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Griyego, nasa anyong pangkasalukuyan ang mga pandiwa: “lumalapit … kinukuha … ibinibigay.”'
    reason: lexical_alternative
  - marker: b
    text: O kaya, “at gayundin ang isda.” Ipinahihiwatig ng Griyego na ibinigay rin niya ang isda sa kanila.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: Lumapit
  rationale: Sa konteksto, lumapit si Jesus sa mga alagad upang ipamahagi ang pagkain. Ang “lumapit” ay likas sa Filipino at hindi nagpapahiwatig na noon lamang siya dumating sa lugar.
- source_word: λαμβάνει
  choice: kinuha niya
  rationale: Tuwirang inilalarawan nito ang pagkuha ni Jesus sa tinapay bago niya iyon ibinigay; ang panghalip na “niya” ay nilinaw ayon sa likas na balarila ng Filipino.
- source_word: τὸν ἄρτον
  choice: ang tinapay
  rationale: Tinutukoy ng artikulo ang partikular na tinapay na naroon sa pagkain.
- source_word: δίδωσιν αὐτοῖς
  choice: ibinigay iyon sa kanila
  rationale: Ang “iyon” ay likas na tumutukoy sa katatapos lamang banggiting tinapay. Iniwasan ang mas mapagpakahulugang “inihain.”
- source_word: τὸ ὀψάριον
  choice: ang isda
  rationale: Dito, ang salita ay tumutukoy sa isdang pagkain. Hindi idinagdag ang “niluto” sapagkat hindi iyon tahasang sinasabi ng salita.
- source_word: ὁμοίως
  choice: gayundin
  rationale: Maikli at likas nitong ipinahihiwatig na ginawa rin ni Jesus sa isda ang ginawa niya sa tinapay.
theological_decisions:
- issue: Mga pandiwang historical present sa salaysay ng pagpapakita matapos ang muling pagkabuhay
  choice: Gumamit ng karaniwang aspektong naganap sa pangunahing teksto, habang itinatala sa talababa ang anyong pangkasalukuyan ng Griyego.
  alternative: “Lumalapit si Jesus, kinukuha niya ang tinapay at ibinibigay iyon sa kanila”
  rationale: Walang tuwirang katumbas sa Filipino ang gamit na historical present ng Griyego. Ang sunod-sunod na pangkasalukuyang anyo ay maaaring magtunog di-likas o tila kasalukuyang nagaganap ang tagpo; pinananatili ng talababa ang estilistikong impormasyon nang hindi binabago ang kahulugan o nilulutas ang anumang usaping doktrinal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang payak na salaysay at iniwasan ang labis na pormal o panrelihiyong pananalita. Ang “at gayundin ang isda” ay nagpapanatili sa maikli at bahagyang eliptikong hulma ng Griyego.
