base_translation:
  language: en
  yaml_path: translation/nt/john/021/006.yaml
  text: But he said to them[a], “Cast the net on the right side of the boat, and you will find some.” So they cast it, and they were no longer able to haul it in because of the multitude of fish.
translation:
  language: tl
  text: Sinabi naman niya sa kanila, “Ihulog ninyo ang lambat sa gawing kanan ng bangka, at makasusumpong kayo.[a]” Kaya inihulog nila ang lambat, at hindi na nila ito mahila dahil sa dami ng isda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, walang tahasang layon ang “makasusumpong kayo”; ipinahihiwatig lamang ng konteksto ng pangingisda ang isda.
    reason: lexical_alternative
lexical_decisions:
- source_word: Βάλετε
  choice: Ihulog ninyo
  rationale: Sa konteksto ng pangingisda, natural na tumutukoy ito sa paghahagis o paghuhulog ng lambat sa tubig; ang “ihulog” ay malinaw at karaniwan sa modernong Filipino.
- source_word: τὰ δεξιὰ μέρη τοῦ πλοίου
  choice: sa gawing kanan ng bangka
  rationale: Ipinapahayag nito ang direksiyon nang natural, habang ang “gawi” ay angkop sa μέρη na literal na tumutukoy sa mga bahagi o dako.
- source_word: πλοίου
  choice: bangka
  rationale: Ang “bangka” ang likas na katumbas sa tagpong pangingisda sa Lawa ng Galilea, sa halip na mas malaking “barko.”
- source_word: τὸ δίκτυον
  choice: ang lambat
  rationale: Tuwirang katumbas ng pang-isahang pangngalan para sa lambat na ginagamit sa pangingisda.
- source_word: εὑρήσετε
  choice: makakahuli kayo
  rationale: Literal itong “makasusumpong kayo,” na walang tahasang layon. Sa konteksto ng pangingisda, idiomatiko sa Filipino ang “makakahuli kayo,” ngunit ipinapaliwanag sa talababa na hindi tahasang binanggit sa Griyego ang isda.
- source_word: ἑλκύσαι
  choice: mahila
  rationale: Tumpak at natural na inilalarawan ang paghila sa lambat; hindi idinagdag sa pangunahing teksto ang “paitaas” o “papasok,” na hindi tahasang nakasaad.
- source_word: ἴσχυον
  choice: hindi na nila ... mahila
  rationale: Ang pandiwa ay nagsasaad ng lakas o kakayahan. Ang kayariang Filipino ay natural na naghahatid ng kawalan nila ng kakayahang hilahin ang lambat.
- source_word: ἀπὸ τοῦ πλήθους τῶν ἰχθύων
  choice: dahil sa napakaraming isda
  rationale: Pinananatili ang sanhi at ang diwa ng malaking bilang ng mga isda sa malinaw at kasalukuyang Filipino.
