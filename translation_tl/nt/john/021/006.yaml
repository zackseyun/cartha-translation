  to: Sinabi naman niya sa kanila, “Ihulog ninyo ang lambat sa gawing kanan ng bangka, at makasusumpong kayo.[a]” Kaya inihulog nila ang lambat, at hindi na nila ito mahila dahil sa dami ng isda.
