  text: Μετὰ ταῦτα ἐφανέρωσεν ἑαυτὸν πάλιν ⸀ὁ Ἰησοῦς τοῖς μαθηταῖς ἐπὶ τῆς θαλάσσης τῆς Τιβεριάδος· ἐφανέρωσεν δὲ οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/001.yaml
  text: After these things[a], Jesus revealed himself again to the disciples by the Sea of Tiberias, and he revealed himself in this way.
translation:
  language: tl
  text: Pagkatapos ng mga pangyayaring ito, muling nagpakita si Jesus sa mga alagad sa tabi ng Lawa ng Tiberias. Ganito siya nagpakita:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ganito niya inihayag ang kanyang sarili.” Ang pandiwang Griyego ay maaaring tumukoy sa pagpapakitang nakikita o sa pagpapakilala ng sarili.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Pagkatapos ng mga bagay na ito
  rationale: Pinananatili ang maramihang demonstratibo at ang paraang pasalaysay ni Juan, sa halip na paikliin bilang “Pagkatapos nito” o gawing malabo bilang “Kalaunan.”
- source_word: ἐφανέρωσεν ἑαυτὸν
  choice: inihayag ... ang kanyang sarili
  rationale: Ipinapakita ang reflexive na diwa at ang kahulugan ng kusang pagpapakita o pagpapakilala sa sarili; hindi nito nililimitahan ang pangyayari sa basta pagkakita lamang.
- source_word: πάλιν
  choice: muling
  rationale: Likas at malinaw na nagsasaad ng naulit na pagpapahayag pagkatapos ng naunang mga pagpapakita ng muling nabuhay na si Jesus.
- source_word: τοῖς μαθηταῖς
  choice: sa mga alagad
  rationale: Hindi idinagdag ang “kanyang” sapagkat walang tahasang panghalip na paari sa Griyego, bagaman malinaw ito sa konteksto.
- source_word: ἐπὶ τῆς θαλάσσης τῆς Τιβεριάδος
  choice: sa tabi ng Lawa ng Tiberias
  rationale: Ang “sa tabi” ay natural na nagpapahayag ng lokasyon ng ἐπί na may genitive. Ginamit ang “Lawa” bilang karaniwang makabagong katawagan sa anyong-tubig na ito habang pinananatili ang pangalang Tiberias.
- source_word: ἐφανέρωσεν δὲ οὕτως
  choice: Ganito niya inihayag ang kanyang sarili
  rationale: Pinananatili ang pag-uulit ng pandiwa para sa ugnayang pampanitikan at likas na ipinakikilala ang kasunod na salaysay. Isinalin ang δέ sa pamamagitan ng bagong pangungusap sa halip na piliting lagyan ng tahasang pangatnig.
theological_decisions:
- issue: Wika para sa pagpapakita ng muling nabuhay na si Jesus
  choice: inihayag ang kanyang sarili
  alternative: nagpakita / ipinakilala ang kanyang sarili
  rationale: Pinananatili nito ang diin ng φανερόω sa kusang pagpapahayag o pagpapakilala ni Jesus sa sarili, nang hindi itinatanggi na tunay siyang nakita ng mga alagad o binabawasan ang pangyayari sa isang karaniwang biswal na paglitaw.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit ng pangunahing pandiwa bilang mahalagang katangiang pampanitikan, ngunit hinati sa dalawang pangungusap upang maging natural sa Tagalog.
