id: JHN.21.7
reference: John 21:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: λέγει οὖν ὁ μαθητὴς ἐκεῖνος ὃν ἠγάπα ὁ Ἰησοῦς τῷ Πέτρῳ· Ὁ κύριός ἐστιν. Σίμων οὖν Πέτρος, ἀκούσας ὅτι ὁ κύριός ἐστιν, τὸν ἐπενδύτην διεζώσατο, ἦν γὰρ γυμνός, καὶ ἔβαλεν ἑαυτὸν εἰς τὴν θάλασσαν·
base_translation:
  language: en
  yaml_path: translation/nt/john/021/007.yaml
  text: So that disciple whom Jesus loved said to Peter[a], “It is the Lord.” Therefore, when Simon Peter heard that it was the Lord, he tied his outer garment around himself (for he was lightly clothed) and threw himself into the sea.
translation:
  language: tl
  text: Kaya, sinabi ng alagad na iyon na minamahal ni Jesus kay Pedro, “Siya ang Panginoon!” Nang marinig ni Simon Pedro na ang Panginoon iyon, ibinigkis niya sa sarili ang kanyang panlabas na damit—sapagkat bahagya lamang ang suot niya[a]—at inihagis niya ang sarili sa dagat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hubad.” Ang salitang Griyego na γυμνός ay maaaring mangahulugang hubad o kulang/bahagya ang suot, depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει οὖν
  choice: Kaya sinabi
  rationale: Ipinapahayag ng οὖν ang pag-usad o bunga sa salaysay; natural sa makabagong Tagalog ang “Kaya” habang pinananatili ang ugnayan sa naunang pangyayari.
- source_word: ὁ μαθητὴς ἐκεῖνος ὃν ἠγάπα ὁ Ἰησοῦς
  choice: ang alagad na iyon na minamahal ni Jesus
  rationale: Pinananatili ang demonstratibong ἐκεῖνος sa “na iyon” at ang natatanging katawagan ni Juan sa alagad.
- source_word: Ὁ κύριός ἐστιν
  choice: Ang Panginoon iyon!
  rationale: Ang κύριος ay isinaling “Panginoon,” at ang “iyon” ay natural na pahayag ng pagkilala sa isang taong nasa di-kalayuan.
- source_word: ἀκούσας
  choice: Nang marinig
  rationale: Natural na naihahayag ng sugnay na temporal ang nauunang kilos ng aorist participle.
- source_word: τὸν ἐπενδύτην
  choice: kanyang panlabas na damit
  rationale: Tuwirang inilalarawan ang ἐπενδύτης nang hindi nagpapalagay ng mas tiyak na uri ng kasuotan.
- source_word: διεζώσατο
  choice: ibinigkis niya sa sarili
  rationale: Pinananatili ang diwa ng pagtatali o pagbibigkis ng damit sa katawan at ang middle/reflexive force.
- source_word: ἦν γὰρ γυμνός
  choice: sapagkat bahagya lamang ang kanyang suot
  rationale: Maaaring mangahulugan ang γυμνός na hubad o kulang/bahagya ang suot. Ang pangunahing salin ay angkop sa konteksto ng pagtatrabaho sa bangka, habang inilalagay sa talababa ang mas literal na posibilidad.
- source_word: ἔβαλεν ἑαυτὸν εἰς τὴν θάλασσαν
  choice: tumalon siya sa lawa
  rationale: Sa Tagalog, “tumalon” ang natural na paglalarawan sa kusang paghagis ng sarili sa tubig. Bagaman θάλασσα ay literal na dagat, ang tinutukoy rito ay ang Lawa ng Tiberias/Galilea, kaya malinaw at heograpikong angkop ang “lawa.”
theological_decisions:
- issue: Pagtukoy kay Jesus bilang κύριος
  choice: Panginoon
  alternative: Guro / Panginoon ko
  rationale: Pinananatili ng “Panginoon” kapwa ang karaniwang titulo at ang kristolohikal na bigat nito sa tagpo ng pagkilala sa muling nabuhay na Jesus, nang walang dagdag na pagpapaliwanag.
- issue: Kalagayan ni Pedro sa γυμνός
  choice: bahagya lamang ang kanyang suot
  alternative: hubad
  rationale: Hindi sapilitang nangangahulugan ang γυμνός ng lubos na kahubaran sa kontekstong ito. Pinananatili sa talababa ang tunay na leksikal na posibilidad na “hubad” upang hindi alisin ang kalabuan ng Griyego.
translation_notes:
  register: Makabago, natural, at marangal na Filipino; ginagamit ang “alagad,” “Panginoon,” at “panlabas na damit” bilang malinaw ngunit hindi arkaikong mga katawagan. Pinili ang “lawa” ayon sa aktuwal na anyong-tubig sa konteksto, habang nananatiling masigla ang kilos ni Pedro.
