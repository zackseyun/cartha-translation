revisions:
- from: Kaya sinabi kay Pedro ng alagad na iyon na minamahal ni Jesus, “Ang Panginoon iyon!” Nang marinig ni Simon Pedro na iyon ang Panginoon, ibinigkis niya sa sarili ang kanyang panlabas na damit—sapagkat bahagya lamang ang kanyang suot[a]—at tumalon siya sa lawa.
  to: Kaya, sinabi ng alagad na iyon na minamahal ni Jesus kay Pedro, “Siya ang Panginoon!” Nang marinig ni Simon Pedro na ang Panginoon iyon, ibinigkis niya sa sarili ang kanyang panlabas na damit—sapagkat bahagya lamang ang suot niya[a]—at inihagis niya ang sarili sa dagat.
  rationale: Ang rebisyon ay nagwawasto sa “lawa” tungo sa “dagat” ayon sa θάλασσα at pinatitindi ang kilos ni Pedro upang maipakita ang ἔβαλεν ἑαυτόν. Inayos din ang daloy ng pangungusap nang hindi binabago ang kahulugan, mga pangalan, o ang maingat na paghawak sa kalabuan ng γυμνός.
