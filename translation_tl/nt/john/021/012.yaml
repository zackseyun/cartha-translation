revisions:
- from: Sinabi sa kanila ni Jesus, “Halikayo, mag-almusal kayo.” Ngunit walang sinuman sa mga alagad ang nangahas na magtanong sa kanya[a], “Sino kayo?” sapagkat alam nilang siya ang Panginoon.
  to: Sinabi sa kanila ni Jesus, “Halikayo, mag-almusal kayo.” Ngunit walang sinuman sa mga alagad ang nangahas na magtanong sa kanya[a], “Sino po kayo?” sapagkat alam nilang siya ang Panginoon.
  rationale: Ang tanging pagbabago ay ang pagdaragdag ng “po” sa tanong upang malinaw na ang “kayo” ay magalang na pagtukoy sa iisang kausap na si Jesus, hindi sa maraming tao. Pinananatili nito ang likas na modernong Filipino Tagalog at ang singular na diwa ng Griyego.
