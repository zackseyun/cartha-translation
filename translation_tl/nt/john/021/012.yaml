  text: λέγει αὐτοῖς ὁ Ἰησοῦς· Δεῦτε ἀριστήσατε. οὐδεὶς ⸀δὲ ἐτόλμα τῶν μαθητῶν ἐξετάσαι αὐτόν· Σὺ τίς εἶ; εἰδότες ὅτι ὁ κύριός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/012.yaml
  text: Jesus said to them[a], “Come, eat breakfast.” But none of the disciples dared to ask him[b], “Who are you?” knowing that it was the Lord.
translation:
  language: tl
  text: Sinabi sa kanila ni Jesus, “Halikayo, mag-almusal kayo.” Ngunit walang sinuman sa mga alagad ang nangahas na magtanong sa kanya[a], “Sino po kayo?” sapagkat alam nilang siya ang Panginoon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang isinaling “magtanong” ay maaari ring mangahulugang “umusisa” o “siyasating mabuti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Δεῦτε
  choice: Halikayo
  rationale: Isang likas at magalang na paanyaya sa maramihan, na angkop sa pagsamo ni Jesus sa mga alagad.
- source_word: ἀριστήσατε
  choice: mag-almusal kayo
  rationale: Tiyak na tumutukoy ang pandiwa sa pagkain sa umaga; natural itong ipinahahayag sa modernong Tagalog bilang “mag-almusal.”
- source_word: οὐδεὶς δὲ
  choice: Ngunit walang sinuman
  rationale: Ipinahihiwatig ng δέ ang banayad na pagsalungat o paglipat mula sa paanyaya tungo sa pagpipigil ng mga alagad.
- source_word: ἐτόλμα
  choice: nangahas
  rationale: Tumpak at likas na ipinapahayag nito ang kakulangan ng lakas ng loob na gawin ang kasunod na kilos.
- source_word: ἐξετάσαι
  choice: magtanong
  rationale: Sa konteksto ng tuwirang tanong, “magtanong” ang pinakamalinaw; maaaring may mas mariing diwang usisain o siyasatin, na inilagay sa talababa.
- source_word: Σὺ τίς εἶ;
  choice: Sino kayo?
  rationale: Pinananatili ang tuwirang tanong tungkol sa pagkakakilanlan. Ang “kayo” ay likas na magalang na pagtukoy kay Jesus sa modernong Tagalog.
- source_word: εἰδότες ὅτι
  choice: sapagkat alam nilang
  rationale: Ipinapakita ng participle ang kaalamang kaugnay ng hindi nila pagtatanong; natural sa Tagalog ang tahasang ugnayang “sapagkat,” bagaman maaari rin itong isaling “yamang alam nila.”
- source_word: ὁ κύριός
  choice: ang Panginoon
  rationale: Pinananatili ang kinikilalang titulong kristolohikal at ang tiyak na pagkakakilanlan sa salaysay.
theological_decisions:
- issue: Pagpapahayag sa κύριος bilang pagtukoy kay Jesus
  choice: ang Panginoon
  alternative: ang panginoon / ang Guro
  rationale: Ang “Panginoon” ay nagpapanatili sa bigat ng titulong κύριος sa salaysay ng pagpapakita ni Jesus matapos siyang muling mabuhay, nang hindi nagdaragdag ng paliwanag na wala sa teksto.
- issue: Ugnayan ng εἰδότες sa hindi pagtatanong
  choice: sapagkat alam nilang
  alternative: yamang alam nilang / na nalalamang
  rationale: 'Malamang na sanhi ang ugnayan sa konteksto, ngunit hindi nito inaalis ang tensiyon ng salaysay: kinilala nila siya bilang Panginoon kahit tila may dahilan sana upang itanong ang kanyang pagkakakilanlan.'
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “Halikayo” at “kayo” bilang likas na maramihan at magalang na pananalita. Hindi na kailangan ng talababa para sa ἀριστήσατε sapagkat malinaw nang tiyak sa umagang pagkain ang “mag-almusal.”
