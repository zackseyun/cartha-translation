    rationale: Mas karaniwan at matatas sa modernong Tagalog ang “Sinabi ni Jesus sa kanila” kaysa “Sinabi sa kanila ni Jesus.”
  - severity: low
    issue: Mabigat ang “anumang isda” sa negatibong tanong.
    rationale: Hindi kailangan ang “anumang” upang maipahayag ang negatibong tanong; mas idiomatiko ang “wala kayong isda, hindi ba?”
  - severity: medium
    issue: Walang talababa para sa leksikal na saklaw ng προσφάγιον.
    rationale: Ang pangunahing saling “isda” ay sinusuportahan ng kontekstong pangingisda, ngunit ang salita ay maaari ring tumukoy nang mas malawak sa pagkaing isinasabay sa tinapay. Ang talababa ay nagpapanatili ng hindi tiyak na saklaw nang hindi binabago ang pangunahing teksto.
