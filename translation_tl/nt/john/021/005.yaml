  verdict: revise
  source_fidelity: Tumpak na naihahatid ng draft ang daloy ng οὖν, ang magiliw na bokatibong Παιδία, ang negatibong tanong na μή τι, at ang maikling tugon na Οὔ. Ang “isda” ay katanggap-tanggap na kontekstuwal na salin ng προσφάγιον, ngunit ang mas malawak na leksikal na kahulugan nito ay dapat panatilihin sa talababa.
  naturalness: Nauunawaan ang “Kaya sinabi sa kanila ni Jesus,” ngunit mas natural ang karaniwang ayos na “Kaya sinabi ni Jesus sa kanila.” Ang “wala kayong anumang isda, hindi ba?” ay mabigat nang kaunti sa modernong Tagalog; ang “wala kayong isda, hindi ba?” ay mas likas at pinananatili ang negatibong inaasahang sagot.
  terminology: Ang “Mga anak” ay angkop na tuwirang salin ng Παιδία at pinananatili ang pamilyar na tono nang hindi ipinapalit ang mas interpretibong “mga kaibigan.” Ang “Wala” ay angkop na tugon sa tanong tungkol sa pagkakaroon ng isda.
