base_translation:
  language: en
  yaml_path: translation/nt/john/021/005.yaml
  text: So Jesus said to them[a], “Children, you do not have any fish, do you?” They answered him, “No.”
translation:
  language: tl
  text: Kaya sinabi ni Jesus sa kanila, “Mga anak, wala kayong isda[a], hindi ba?” Sumagot sila sa kanya, “Wala.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “anumang makakain.” Ang Griyegong προσφάγιον ay mas partikular na tumutukoy sa pagkaing isinasabay sa tinapay; sa kontekstong ito ng pangingisda, malamang na isda ang tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Likas na pang-ugnay sa daloy ng salaysay; ipinapakita ang pag-usad mula sa naunang pangyayari nang hindi labis na pormal.
- source_word: Παιδία
  choice: Mga anak
  rationale: Pinananatili ang tuwirang kahulugan at ang magiliw, malapit na tono ng pagtawag. Ang “mga kaibigan” ay higit na interpretibo, samantalang ang “mga bata” ay maaaring magpahiwatig ng literal na edad.
- source_word: μή τι
  choice: wala kayong anumang …, hindi ba?
  rationale: Ang μή sa tanong ay umaasang negatibo ang sagot. Ang negatibong tanong na may “hindi ba?” ay natural sa Tagalog at pinananatili ang inaasahang tugon.
- source_word: προσφάγιον
  choice: isda
  rationale: Tumutukoy ang salita sa pagkaing isinasabay sa tinapay; sa kontekstong pangingisda, malamang na isda ang tinutukoy. Ang “isda” ay malinaw at natural, ngunit hindi na idinagdag ang “na makakain” upang maiwasan ang di-kinakailangang pagpapalawak.
- source_word: ἔχετε
  choice: mayroon kayo / wala kayong
  rationale: Ang payak na pag-aari ay likas na ipinahayag sa negatibong tanong bilang “wala kayong.”
- source_word: ἀπεκρίθησαν αὐτῷ
  choice: Sumagot sila sa kanya
  rationale: Karaniwan, malinaw, at marangal na salin ng pormulang pasalaysay.
- source_word: Οὔ
  choice: Wala
  rationale: Sa Tagalog, “Wala” ang natural na maikling sagot sa tanong kung mayroon silang isda; mas angkop ito kaysa sa pangkalahatang “Hindi.”
theological_decisions: []
translation_notes:
  register: Makabagong Filipino Tagalog na natural at marangal. Ginamit ang “Mga anak” upang mapanatili ang magiliw na anyo ng pagtawag, at “Wala” bilang idiomatikong sagot sa tanong tungkol sa pag-aari.
