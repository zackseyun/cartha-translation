  text: λέγει αὐτῷ ὁ Ἰησοῦς· Ἐὰν αὐτὸν θέλω μένειν ἕως ἔρχομαι, τί πρὸς σέ; σύ ⸂μοι ἀκολούθει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/022.yaml
  text: Jesus said to him[a], “If I want him to remain until I come[b], what is that to you? You follow me.”
translation:
  language: tl
  text: Sinabi ni Jesus sa kanya, “Kung nais kong manatili siya hanggang sa dumating ako,[a] ano ang kinalaman niyon sa iyo? Ikaw, sumunod ka sa akin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tinutukoy rito kung anong pagdating ni Jesus ang tinutukoy; maaaring tumukoy ito sa isang pagdating sa kasaysayan o sa kanyang pangwakas na pagdating.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Sinabi sa kanya ni Jesus
  rationale: Ginamit ang karaniwang panahunang nagdaan sa salaysay sa Tagalog para sa historikal na kasalukuyan ng Griyego.
- source_word: Ἐὰν
  choice: Kung
  rationale: Likas na panandang pasubali sa Tagalog at pinananatili ang hipotetikal na diwa.
- source_word: θέλω
  choice: nais ko
  rationale: Naipahahayag ang pagnanais o pagpapasya nang hindi pinatitigas ang kahulugan bilang tiyak na utos o pasiya.
- source_word: μένειν
  choice: manatili
  rationale: Pinananatili ang malawak na kahulugan ng μένω at hindi ito nililimitahan sa ‘manatiling buhay.’
- source_word: ἕως ἔρχομαι
  choice: hanggang sa pagdating ko
  rationale: Natural sa modernong Tagalog at hindi tinutukoy kung anong uri o pagkakataon ng pagdating ang tinutukoy.
- source_word: τί πρὸς σέ;
  choice: ano iyon sa iyo?
  rationale: Tuwirang katumbas ng idyomang pumipigil kay Pedro na makialam sa kapalaran ng ibang alagad.
- source_word: σύ μοι ἀκολούθει
  choice: Ikaw, sumunod ka sa akin
  rationale: Ang ‘Ikaw’ at ang panghalip na ‘ka’ ay nagpapanatili sa diin at paghahambing ng tahasang σύ, habang natural ang pautos na ‘sumunod.’
theological_decisions:
- issue: Ang tinutukoy ng pagdating ni Jesus sa ἕως ἔρχομαι
  choice: Isinaling ‘hanggang sa pagdating ko’ nang hindi tinutukoy ang referent.
  alternative: Maaaring unawain bilang pagdating sa isang pangyayaring pangkasaysayan o bilang pangwakas na pagdating.
  rationale: Hindi nililinaw ng talata ang uri o panahon ng pagdating, kaya pinananatili ng salin ang tunay na teolohikal na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang ‘nais’ sa halip na mas kolokyal na ‘gusto,’ at pinanatili ang madiing ‘Ikaw’ sa huling utos.
