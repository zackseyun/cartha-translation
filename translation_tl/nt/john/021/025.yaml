  text: ἔστιν δὲ καὶ ἄλλα πολλὰ ⸀ἃ ἐποίησεν ὁ Ἰησοῦς, ἅτινα ἐὰν γράφηται καθ’ ἕν, οὐδ’ αὐτὸν οἶμαι τὸν κόσμον ⸀χωρήσειν τὰ γραφόμενα ⸀βιβλία.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/025.yaml
  text: There are also many other things that Jesus did[a], which, if they were written down one by one, I suppose that not even the world itself would have room for the books being written.
translation:
  language: tl
  text: Mayroon ding marami pang ibang bagay na ginawa si Jesus; kung isusulat ang mga iyon nang isa-isa, sa palagay ko, hindi magkakasya kahit sa mundo mismo ang mga aklat na isusulat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “hindi makapaglalaman ang mundo mismo ng mga aklat na isusulat.” Ang pandiwang Griyego ay maaaring mangahulugang “magkaroon ng lugar para sa” o “maglaman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ καὶ
  choice: rin
  rationale: Ipinahihiwatig ang banayad na pagpapatuloy at pagdaragdag nang hindi naglalagay ng temporal na salitang wala sa Griyego.
- source_word: ἄλλα πολλὰ
  choice: marami ... ibang bagay
  rationale: Pinananatili ang dami at ang diwang may iba pang mga ginawa bukod sa mga naitala.
- source_word: ἃ ἐποίησεν ὁ Ἰησοῦς
  choice: na ginawa ni Jesus
  rationale: Ang ποιέω ay tumutukoy rito sa malawak na saklaw ng mga gawa o kilos; natural at sapat ang “ginawa.”
- source_word: ἐὰν γράφηται
  choice: kung isusulat
  rationale: Ipinapahayag ang hipotetikal na kondisyon ng Griyegong ἐάν kasama ng subjunctive; ang di-tiyak na tagaganap ay angkop sa passive na anyo.
- source_word: καθ’ ἕν
  choice: nang isa-isa
  rationale: 'Pinananatili ang distributibong diwa: bawat bagay ay isusulat nang paisa-isa.'
- source_word: οὐδ’ αὐτὸν ... τὸν κόσμον
  choice: kahit ang mundo mismo ay hindi
  rationale: Ang “mismo” ay naghahatid ng mariing gamit ng αὐτόν, at ang “kahit ... hindi” ay likas na katumbas ng οὐδέ.
- source_word: οἶμαι
  choice: sa palagay ko
  rationale: Pinananatili ang personal at mapagnilay na singit ng may-akda.
- source_word: χωρήσειν
  choice: magkakaroon ng lugar para sa
  rationale: Pinananatili ang larawang pansaklaw o pang-espasyo ng χωρέω nang natural sa Filipino; ang alternatibong diwang “maglaman” ay inilagay sa talababa.
- source_word: τὰ γραφόμενα βιβλία
  choice: mga aklat na isusulat
  rationale: Sa kondisyong hipotetikal, likas sa Filipino ang anyong panghinaharap na tumutukoy sa mga aklat na mabubuo kung isusulat ang lahat.
theological_decisions:
- issue: Retorikal na pagmamalabis tungkol sa kakayahan ng mundo na paglagyan ng mga aklat
  choice: Pinanatili ang mariing larawan na kahit ang mundo mismo ay walang lugar para sa lahat ng aklat.
  alternative: Gawing pangkalahatang pahayag lamang, gaya ng “napakaraming aklat ang maisusulat.”
  rationale: Ang mismong pagmamalabis ang nagbibigay-lakas sa pangwakas na patotoo ng Ebanghelyo; hindi ito dapat pahinain o ipaliwanag na parang literal na sukat.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Hinati sa dalawang pangungusap upang maging likas at madaling maunawaan, habang pinananatili ang kondisyon, personal na pagsingit, at pangwakas na pagmamalabis ng Griyego.
