  source_fidelity: Tumpak na naipapahayag ng draft ang maraming iba pang ginawa ni Jesus, ang kondisyong hipotetikal na isulat ang mga ito nang isa-isa, ang pagsingit na “sa palagay ko,” at ang retorikal na pagmamalabis. Gayunman, ang “ang mundo mismo ay hindi magkakaroon ng lugar para sa” ay hindi ang pinakaidiomatikong paraan upang ilarawan na ang mga aklat ay hindi magkakasya sa mundo; mas malinaw na gawing mga aklat ang paksa ng “magkasya.”
