revisions:
- from: Marami ring ibang bagay na ginawa si Jesus. Kung isusulat nang isa-isa ang mga iyon, sa palagay ko, kahit ang mundo mismo ay hindi magkakaroon ng lugar para sa mga aklat na isusulat.[a]
  to: Mayroon ding marami pang ibang bagay na ginawa si Jesus; kung isusulat ang mga iyon nang isa-isa, sa palagay ko, hindi magkakasya kahit sa mundo mismo ang mga aklat na isusulat.[a]
  rationale: Pinalitan ang di-gaanong likas na “hindi magkakaroon ng lugar para sa” ng “hindi magkakasya kahit sa mundo mismo,” upang maging natural sa modernong Filipino habang pinananatili ang matinding larawan na hindi kayang paglagyan ng mundo ang mga aklat. Iningatan ang hipotetikal na aspekto ng “mga aklat na isusulat,” ang personal na “sa palagay ko,” at ang retorikal na pagmamalabis.
