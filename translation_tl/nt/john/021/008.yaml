id: JHN.21.8
reference: John 21:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἱ δὲ ἄλλοι μαθηταὶ τῷ πλοιαρίῳ ἦλθον, οὐ γὰρ ἦσαν μακρὰν ἀπὸ τῆς γῆς ἀλλὰ ὡς ἀπὸ πηχῶν διακοσίων, σύροντες τὸ δίκτυον τῶν ἰχθύων.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/008.yaml
  text: But the other disciples came in the small boat[a], for they were not far from the land, but about two hundred cubits away[c][b], dragging the net of fish.
translation:
  language: tl
  text: Ngunit ang iba pang mga alagad ay dumating sakay ng maliit na bangka, sapagkat hindi sila kalayuan sa pampang—mga dalawang daang siko lamang[a]—habang hinihila ang lambat na may mga isda.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang dalawang daang siko ay humigit-kumulang 90 metro.
    reason: cultural_note
  - marker: b
    text: 'Mas literal: “ang lambat ng mga isda.” Malamang na tumutukoy ito sa lambat na naglalaman ng mga isda.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἄλλοι μαθηταὶ
  choice: Ngunit ang iba pang mga alagad
  rationale: Ipinahihiwatig ng δέ ang paghahambing sa ginawa ni Pedro sa naunang talata; natural itong naipapahayag ng “Ngunit.”
- source_word: τῷ πλοιαρίῳ
  choice: sakay ng maliit na bangka
  rationale: Pinananatili ng “maliit na bangka” ang diminutibong diwa ng πλοιάριον, at ang “sakay ng” ang natural na Filipino para sa gamit ng datibo rito.
- source_word: ἦλθον
  choice: dumating
  rationale: Sa konteksto ng paglapit sa pampang, natural na salaysay ang “dumating” para sa aorist ng ἔρχομαι.
- source_word: οὐ γὰρ ἦσαν μακρὰν ἀπὸ τῆς γῆς
  choice: sapagkat hindi sila kalayuan sa pampang
  rationale: Ang γάρ ay nagbibigay ng dahilan. Bagaman literal na “lupa” ang γῆ, tumutukoy ito rito sa pampang bilang kabaligtaran ng tubig.
- source_word: ἀλλὰ ὡς ἀπὸ πηχῶν διακοσίων
  choice: mga dalawang daang siko lamang
  rationale: Ang “mga” ay naghahatid ng pagtatayang ipinahihiwatig ng ὡς. Pinananatili ang sinaunang sukat na “siko,” samantalang ang “lamang” ay natural na naghahatid ng kaibahan sa “hindi kalayuan.”
- source_word: σύροντες
  choice: habang hinihila
  rationale: Ipinakikita ng kasalukuyang participle ang kasabay na kilos; ang “hinihila” ay angkop sa pisikal na pagkadagit ng lambat sa tubig.
- source_word: τὸ δίκτυον τῶν ἰχθύων
  choice: ang lambat na may mga isda
  rationale: Pinananatili nito ang ugnayang genitibo nang hindi idinaragdag ang ideyang “punô,” na hindi tahasang sinasabi ng Griyego; natural din ito sa Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pampang” sa halip na literal na “lupa” dahil iyon ang kontekstuwal na kahulugan, at pinanatili ang “siko” sa pangunahing teksto upang huwag palitan ang sinaunang sukat.
