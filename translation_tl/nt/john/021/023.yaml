id: JHN.21.23
reference: John 21:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐξῆλθεν οὖν ⸂οὗτος ὁ λόγος⸃ εἰς τοὺς ἀδελφοὺς ὅτι ὁ μαθητὴς ἐκεῖνος οὐκ ἀποθνῄσκει. ⸂οὐκ εἶπεν δὲ⸃ αὐτῷ ὁ Ἰησοῦς ὅτι οὐκ ἀποθνῄσκει ἀλλ’· Ἐὰν αὐτὸν θέλω μένειν ἕως ἔρχομαι, τί πρὸς σέ;
base_translation:
  language: en
  yaml_path: translation/nt/john/021/023.yaml
  text: So this report spread among the brothers that that disciple would not die. Yet Jesus did not say to him that he would not die, but, “If I want him to remain until I come, what is that to you?”
translation:
  language: tl
  text: 'Kaya kumalat sa mga kapatid[b] ang balitang ito[a]: hindi mamamatay ang alagad na iyon. Ngunit hindi sinabi ni Jesus sa kanya na hindi siya mamamatay. Sa halip, sinabi niya, “Kung nais kong manatili siya hanggang sa dumating ako, ano iyon sa iyo?”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pahayag na ito” o “salitang ito.” Ang Griyegong λόγος ay maaaring mangahulugang “salita,” “pahayag,” o “balita.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mga kapatid” dito ay tumutukoy sa komunidad ng mga alagad; panlalaking maramihan ang ginamit sa Griyego.
    reason: cultural_note
  - marker: c
    text: 'Hindi ipinangako ni Jesus na hindi kailanman mamamatay ang alagad na ito. Nagbigay siya ng isang kondisyong pahayag: “Kung nais kong manatili siya hanggang sa dumating ako…”'
    reason: clarification
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: kumalat
  rationale: Sa pariralang ito, inilalarawan ng pandiwa ang paglaganap ng isang balita sa loob ng isang pangkat; natural itong ipinahahayag sa Tagalog bilang “kumalat.”
- source_word: οὗτος ὁ λόγος
  choice: ang balitang ito / ang balita
  rationale: Ang λόγος dito ay ang mensaheng kumalat dahil sa maling pagkaunawa sa sinabi ni Jesus. Ang “balita” ay natural sa konteksto, habang inilalahad sa talababa ang mas literal na “salita” o “pahayag.”
- source_word: εἰς τοὺς ἀδελφοὺς
  choice: sa mga kapatid
  rationale: Ipinahihiwatig ng εἰς kasabay ng ἐξῆλθεν ang pagkalat sa komunidad. Ang “mga kapatid” ay nagpapanatili sa anyong panlalaking maramihan ng Griyego, na sa konteksto ay tumutukoy sa komunidad ng mga alagad.
- source_word: ὁ μαθητὴς ἐκεῖνος
  choice: ang alagad na iyon
  rationale: Pinananatili ng “na iyon” ang tiyak na pagtukoy ng ἐκεῖνος sa alagad na tinutukoy sa naunang talata.
- source_word: οὐκ ἀποθνῄσκει
  choice: hindi mamamatay
  rationale: Bagaman nasa pangkasalukuyang anyo ang Griyego, ang kahulugan sa di-tuwirang pahayag ay isang inaasahang hindi pagkamatay; natural sa Tagalog ang “hindi mamamatay.”
- source_word: οὐκ εἶπεν δὲ
  choice: Ngunit hindi sinabi
  rationale: Ang δέ ay nagpapakilala ng tahasang pagtutuwid sa kumalat na balita; malinaw itong naihahayag ng “Ngunit.”
- source_word: Ἐὰν αὐτὸν θέλω μένειν
  choice: Kung nais kong manatili siya
  rationale: Ang “nais” ay dignidad ngunit karaniwang katumbas ng θέλω, at ang “manatili” ay nagpapanatili sa diwa at resonansiya ng μένω sa Ebanghelyo ni Juan.
- source_word: ἕως ἔρχομαι
  choice: hanggang sa pagdating ko
  rationale: Natural nitong ipinahahayag ang hinaharap na pagdating na tinutukoy ng pangkasalukuyang ἔρχομαι, nang hindi idinaragdag ang mas interpretibong “muling pagparito.”
- source_word: τί πρὸς σέ
  choice: ano iyon sa iyo?
  rationale: Direkta at natural na katumbas ito ng idyomang Griyego, na nagsasabing hindi iyon ang dapat pag-ukulan ni Pedro ng pansin.
theological_decisions:
- issue: Kalagayan ng kumalat na pahayag tungkol sa alagad
  choice: Ipakita itong balitang kumalat, saka panatilihin ang tahasang pagtutuwid na hindi ipinangako ni Jesus na hindi mamamatay ang alagad.
  alternative: Isalin nang mas literal bilang “lumaganap ang salitang ito,” na maaaring hindi agad magpahiwatig na isa itong kumalat na pagkaunawa o ulat.
  rationale: Ang mismong talata ang nagtatama sa naging pagkaunawa sa sinabi ni Jesus. Hindi dapat ipahiwatig ng salin na talagang nangako siya ng imortalidad sa alagad.
- issue: Likas na kondisyon ng sinabi ni Jesus
  choice: Panatilihin ang “Kung nais kong…” bilang tunay na kondisyon, hindi bilang pahayag na tiyak na mananatili ang alagad hanggang sa pagdating ni Jesus.
  alternative: Ipaliwanag sa pangunahing teksto na hindi ito pangako.
  rationale: Pinananatili ng kondisyon ang ambiguwidad at diin ng orihinal; inilalagay sa talababa ang paliwanag upang hindi palawakin nang interpretibo ang pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “alagad” at “mga kapatid” bilang pamilyar na bokabularyong biblikal, ngunit iniwasan ang lipas o labis na pormal na ayos. Hinati sa maiikling pangungusap ang pagtutuwid upang maging malinaw ang kaibhan ng kumalat na balita at ng aktuwal na sinabi ni Jesus.
