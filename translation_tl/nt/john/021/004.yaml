  text: Πρωΐας δὲ ἤδη ⸀γενομένης ⸀ἔστη Ἰησοῦς εἰς τὸν αἰγιαλόν· οὐ μέντοι ᾔδεισαν οἱ μαθηταὶ ὅτι Ἰησοῦς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/004.yaml
  text: When daybreak had already come[a], Jesus stood on the shore; yet the disciples did not know that it was Jesus.
translation:
  language: tl
  text: Nang magbukang-liwayway na, nakatayo si Jesus sa dalampasigan. Ngunit hindi alam[a] ng mga alagad na si Jesus iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi nakilala ng mga alagad na si Jesus iyon.” Mas literal na sinasabi ng Griyego, “hindi alam ng mga alagad na si Jesus iyon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρωΐας δὲ ἤδη γενομένης
  choice: Nang magbukang-liwayway na
  rationale: Ang genitive absolute ay nagsasaad ng panahong kinalalagyan ng pangyayari. Likas sa modernong Tagalog ang “magbukang-liwayway,” at ipinahihiwatig ng “na” ang ἤδη. Hindi na hiwalay na isinalin ang banayad na pang-ugnay na δέ upang maiwasan ang di-likas na panimulang pananda.
- source_word: ἔστη
  choice: nakatayo
  rationale: Sa konteksto, inilalarawan nito ang presensiya ni Jesus sa pampang. Ang “nakatayo” ay mas natural sa Tagalog kaysa sa payak na “tumayo,” na maaaring magpahiwatig na isinasalaysay ang mismong pagkilos ng pagtayo.
- source_word: εἰς τὸν αἰγιαλόν
  choice: sa dalampasigan
  rationale: Bagaman karaniwang patungo ang εἰς, maaari itong tumukoy sa kinalalagyan kasama ng pandiwa ng pagtayo. Ang αἰγιαλός ay pampang o dalampasigan; dignified at malinaw ang “dalampasigan.”
- source_word: οὐ μέντοι
  choice: Ngunit hindi
  rationale: Ipinahahayag nito ang malinaw ngunit hindi labis na mariing pagsalungat sa presensiya ni Jesus at sa kawalan ng kaalaman ng mga alagad.
- source_word: ᾔδεισαν
  choice: hindi alam
  rationale: Pinananatili nito ang karaniwang kahulugan ng οἶδα na “malaman,” sa halip na agad gawing mas tiyak na “makilala.” Ipinaliliwanag sa talababa ang kontekstuwal na alternatibo.
- source_word: οἱ μαθηταὶ
  choice: ang mga alagad
  rationale: Ang tiyak na pantukoy ay tumutukoy sa kilalang pangkat; hindi kailangang idagdag ang “niya,” na wala sa Griyego.
- source_word: ὅτι Ἰησοῦς ἐστιν
  choice: na iyon ay si Jesus
  rationale: Natural na pangungusap ito ng pagkakakilanlan sa Tagalog at pinananatili ang nilalaman ng Griyego nang hindi nagdaragdag ng paliwanag.
theological_decisions:
- issue: Pagkakilala kay Jesus matapos ang muling pagkabuhay
  choice: Isinalin bilang hindi nila alam na iyon ay si Jesus, nang walang paliwanag kung bakit.
  alternative: “Hindi nila nakilala na iyon ay si Jesus.”
  rationale: Sinasabi lamang ng talata ang kabiguan nilang malaman o makilala siya at hindi nito ipinaliliwanag ang dahilan. Pinananatili ng salin ang ganitong pagpipigil at ang teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “magbukang-liwayway” at “dalampasigan” bilang karaniwan ngunit dignified na pananalita. Inilagay ang panandang [a] sa mismong pahayag na “hindi alam” upang malinaw ang kaugnayan nito sa leksikal na alternatibo.
