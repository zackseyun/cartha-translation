base_translation:
  language: en
  yaml_path: translation/nt/john/021/003.yaml
  text: Simon Peter said to them[a], “I am going to fish.” They said to him, “We are also coming with you.” They went out and got into the boat, and that night they caught nothing.
translation:
  language: tl
  text: Sinabi sa kanila ni Simon Pedro[a], “Pupunta akong mangisda.” Sinabi nila sa kanya, “Sasama rin kami sa iyo.” Umalis sila at sumakay sa bangka, at wala silang nahuli nang gabing iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, pangkasalukuyan ang mga pandiwa (“sinasabi ni Simon Pedro sa kanila … sinasabi nila sa kanya”), isang karaniwang paraan ng masiglang pagsasalaysay na madalas isinasalin sa nakaraang panahunan.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτοῖς Σίμων Πέτρος
  choice: Sinabi sa kanila ni Simon Pedro
  rationale: Ginamit ang nakaraang panahunan para sa likas na pagsasalaysay sa Tagalog, bagaman historical present ang anyong Griyego; pinanatili sa talababa ang impormasyong ito.
- source_word: Ὑπάγω ἁλιεύειν
  choice: Mangingisda ako
  rationale: Likas at maikli itong pagpapahayag sa Tagalog ng agarang balak ni Pedro na mangisda, nang hindi inuulit ang diwa ng pagpunta.
- source_word: Ἐρχόμεθα καὶ ἡμεῖς σὺν σοί
  choice: Sasama rin kami sa iyo
  rationale: Ang “rin kami” ay nagpapanatili sa diin ng καὶ ἡμεῖς, at ang “sasama ... sa iyo” ay likas na naghahatid ng σύν at ng nilalayong pagkilos.
- source_word: ἐξῆλθον
  choice: Umalis sila
  rationale: Sa konteksto, natural na Tagalog ang “umalis” para sa kanilang paglabas at pagtungo sa bangka.
- source_word: ἐνέβησαν εἰς τὸ πλοῖον
  choice: sumakay sa bangka
  rationale: Ito ang karaniwang Tagalog para sa pagsakay sa isang sasakyang-tubig; ang “bangka” ay angkop sa pangingisda sa Lawa ng Galilea.
- source_word: ἐν ἐκείνῃ τῇ νυκτί
  choice: nang gabing iyon
  rationale: Likas na katumbas sa Tagalog ng temporal na pariralang Griyego.
- source_word: ἐπίασαν οὐδέν
  choice: wala silang nahuli
  rationale: Sa konteksto ng pangingisda, ang πιάζω ay nangangahulugang humuli; malinaw na ipinahahayag ng “wala” ang lubos na kawalan ng huli.
