  to: Sinabi sa kanila ni Simon Pedro[a], “Pupunta akong mangisda.” Sinabi nila sa kanya, “Sasama rin kami sa iyo.” Umalis sila at sumakay sa bangka, at wala silang nahuli nang gabing iyon.
