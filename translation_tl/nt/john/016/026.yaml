reference: John 16:26
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐν ἐκείνῃ τῇ ἡμέρᾳ ἐν τῷ ὀνόματί μου αἰτήσεσθε, καὶ οὐ λέγω ὑμῖν ὅτι ἐγὼ ἐρωτήσω τὸν πατέρα περὶ ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/026.yaml
  text: On that day you will ask in my name[a], and I do not say to you that I will ask the Father concerning you[c][b];
translation:
  language: tl
  text: Sa araw na iyon, hihingi kayo sa pangalan ko, at hindi ko sinasabi sa inyo na ako ang makikiusap sa Ama tungkol sa inyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ang Griyego ay gumagamit ng dalawang magkaibang pandiwa: αἰτέω para sa paghingi ng mga alagad at ἐρωτάω para sa pakiusap ni Jesus sa Ama. Ang “tungkol sa inyo” ay maaari ring unawaing “para sa inyo” o “alang-alang sa inyo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: Sa araw na iyon
  rationale: Likas na temporal na parirala sa modernong Tagalog at pinananatili ang diin ng demonstratibong ἐκείνῃ.
- source_word: ἐν τῷ ὀνόματί μου
  choice: sa pangalan ko
  rationale: Pinananatili ang karaniwang idyomang Juanino na tumutukoy sa paghinging kaugnay ng persona at awtoridad ni Jesus nang hindi ito labis na ipinapaliwanag.
- source_word: αἰτήσεσθε
  choice: hihingi kayo
  rationale: Ang αἰτέω ay natural na maisasalin bilang “humingi” sa konteksto ng panalangin o kahilingan.
- source_word: οὐ λέγω ὑμῖν
  choice: hindi ko sinasabi sa inyo
  rationale: Tuwirang pinananatili ang pangkasalukuyang aspekto at natural ang anyo sa Tagalog.
- source_word: ὅτι
  choice: na
  rationale: Ipinakikilala nito ang nilalaman ng hindi sinasabi ni Jesus, hindi isang sugnay na sanhi.
- source_word: ἐρωτήσω
  choice: makikiusap
  rationale: Ibinubukod nang natural sa Tagalog ang ἐρωτάω mula sa αἰτέω na isinaling “hihingi,” habang nananatili ang diwa ng paghingi sa Ama.
- source_word: τὸν πατέρα
  choice: sa Ama
  rationale: Walang idinagdag na tahasang panghalip na paari; pinananatili ang mahalagang katawagang Juanino na “ang Ama.”
- source_word: περὶ ὑμῶν
  choice: tungkol sa inyo
  rationale: Pinananatili ang malawak na saklaw ng περί na maaaring mangahulugang tungkol sa kanila o alang-alang sa kanila, nang hindi tahasang nilulutas ang pahiwatig ng pamamagitan.
theological_decisions:
- issue: Kung itinatanggi ba ni Jesus ang anumang magiging pamamagitan o hindi lamang niya inilalarawan dito ang paglapit ng mga alagad sa Ama bilang nakasalalay sa kanyang pakiusap
  choice: Pinanatili ang tuwirang pahayag na hindi sinasabi ni Jesus na siya ang makikiusap sa Ama tungkol sa kanila.
  alternative: Ipakahulugang hindi kailanman mamamagitan si Jesus para sa kanila, o ipahayag na hindi na kailangan ang anumang pamamagitan.
  rationale: Binibigyang-diin ng konteksto ang paghingi ng mga alagad sa pangalan ni Jesus, ngunit may ibang mga teksto sa Bagong Tipan tungkol sa kanyang pagtataguyod o pamamagitan. Hindi nilulutas ng salin ang tensiyong ito.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “hihingi” at “makikiusap” upang maipakita nang hindi pilit ang pagkakaiba ng dalawang pandiwang Griyego. Inilagay ang talababa pagkatapos ng pariralang saklaw nito.
