base_translation:
  language: en
  yaml_path: translation/nt/john/016/018.yaml
  text: So they were saying[a], “What is this that he says, ‘A little while’? We do not know what he is saying.”
translation:
  language: tl
  text: 'Kaya sinasabi nila, “Ano itong sinasabi niya: ‘kaunting panahon’? Hindi namin alam kung ano ang sinasabi niya.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: sinasabi nila
  rationale: Ipinahihiwatig ng aspektong imperpekto ang nagpapatuloy o paulit-ulit na pagsasalita; natural itong naipahahayag sa Filipino sa anyong “sinasabi nila.”
- source_word: οὖν
  choice: Kaya
  rationale: Pinananatili nito ang lohikal at pasalaysay na kaugnayan sa naunang sinabi nang hindi nagiging labis na pormal.
- source_word: Τί ἐστιν τοῦτο
  choice: Ano ito
  rationale: Tuwirang pinananatili ang anyo ng tanong at ang pagkalito ng mga alagad, sa halip na agad itong ipakahulugang “Ano ang ibig sabihin nito?”
- source_word: ὃ λέγει μικρόν
  choice: itong sinasabi niyang ‘Kaunting panahon’
  rationale: Ginagawang malinaw na ang mismong pariralang binanggit ni Jesus ang kanilang tinatanong, habang pinananatili ang tuwirang sipi.
- source_word: μικρόν
  choice: Kaunting panahon
  rationale: Sa konteksto, tumutukoy ito sa isang maikling haba ng panahon; natural at malinaw ang “kaunting panahon” sa modernong Filipino.
- source_word: οὐκ οἴδαμεν
  choice: Hindi namin alam
  rationale: Tuwiran at natural na salin ng negatibong pahayag ng kaalaman.
- source_word: τί λαλεῖ
  choice: kung ano ang sinasabi niya
  rationale: Malapit ito sa literal na diwa ng λαλεῖ at sadyang pinananatili ang pag-uulit na nasa Griyego, sa halip na ipakahulugang “kung ano ang ibig niyang sabihin.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Pinanatili ang pag-uulit ng “sinasabi” dahil naroon din ang magkaugnay na mga pandiwa ng pagsasalita sa Griyego at ipinakikita nito ang pagkalito ng mga alagad.
