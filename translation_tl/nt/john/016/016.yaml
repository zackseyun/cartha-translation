  text: Μικρὸν καὶ ⸀οὐκέτι θεωρεῖτέ με, καὶ πάλιν μικρὸν καὶ ὄψεσθέ ⸀με.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/016.yaml
  text: A little while[a], and you no longer see me; and again a little while, and you will see me.
translation:
  language: tl
  text: Sandali lamang at hindi na ninyo ako makikita; at muli, sandali lamang at makikita ninyo ako.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μικρὸν
  choice: Kaunting panahon na lang / kaunting panahon pa
  rationale: Ginagamit ang pang-uri nang pang-abay upang tukuyin ang maikling pagitan ng panahon. Ang magkatugmang parirala ay likas sa modernong Tagalog at pinananatili ang temporal na diin.
- source_word: οὐκέτι
  choice: hindi na
  rationale: Karaniwang katumbas sa Tagalog para sa paghinto o pagkawala ng isang kalagayan mula sa puntong iyon.
- source_word: θεωρεῖτέ
  choice: makikita
  rationale: Bagaman maaari itong magpahiwatig ng pagmamasid o pagtanaw, sapat dito ang karaniwang pandiwang “makikita,” na hindi nagpapataw ng di-tiyak na pagkakaibang teolohikal.
- source_word: πάλιν
  choice: pa
  rationale: Sa pariralang “kaunting panahon pa,” likas na ipinahahayag sa Tagalog ang susunod na pagitan at pagbabalik ng pagkakita na tinutukoy ng πάλιν.
- source_word: ὄψεσθέ
  choice: makikita
  rationale: Ang anyong panghinaharap ng ὁράω ay tumutukoy sa pagkakita sa hinaharap. Kaparehong salin ang ginamit upang mapanatili ang malinaw na temporal na paghahambing.
- source_word: με
  choice: ako
  rationale: Tuwirang layon na tumutukoy kay Jesus; sa konstruksiyong “makikita ninyo ako,” natural itong isalin bilang “ako.”
- source_word: καὶ
  choice: at
  rationale: Pinananatili ang balanseng pagkakaugnay at ritmo ng dalawang sugnay sa Griyego.
theological_decisions:
- issue: Kung dapat gumamit ng magkaibang pandiwang Tagalog para sa θεωρέω at ὁράω
  choice: Parehong isalin bilang “makikita” sa pangunahing teksto
  alternative: “hindi na ninyo ako matatanaw … makikita ninyo ako”
  rationale: Malaki ang semantikong pagsasanib ng dalawang pandiwa sa kontekstong Juanino. Ang pagpipilit ng matalim na pagkakaiba ay maaaring magpasok ng teolohikal na kahulugang hindi tiyak sa talata; mas malinaw na sentro rito ang pagkakaiba ng dalawang yugto ng panahon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural sa karaniwang mambabasa. Pinanatili ang maikli at balanseng anyo ng kasabihan, pati ang tunay na kalabuan tungkol sa tiyak na tinutukoy na pagkawala at muling pagkakita.
