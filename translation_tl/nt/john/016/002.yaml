id: JHN.16.2
reference: John 16:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀποσυναγώγους ποιήσουσιν ὑμᾶς· ἀλλ’ ἔρχεται ὥρα ἵνα πᾶς ὁ ἀποκτείνας ὑμᾶς δόξῃ λατρείαν προσφέρειν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/002.yaml
  text: They will make you outcasts from the synagogues[a]; indeed[b], an hour is coming when everyone who kills you will think he is offering service to God.
translation:
  language: tl
  text: Ititiwalag nila kayo sa mga sinagoga[a]. Higit pa rito, darating ang oras na ang sinumang pumatay sa inyo ay mag-aakalang naghahandog siya ng paglilingkod sa Diyos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “palalayasin nila kayo sa sinagoga” o “ibubukod nila kayo sa mga sinagoga.”
    reason: lexical_alternative
  - marker: b
    text: O “nag-aalay siya ng pagsamba sa Diyos” o “nagkakaloob siya ng relihiyosong paglilingkod sa Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποσυναγώγους ποιήσουσιν ὑμᾶς
  choice: Ititiwalag nila kayo sa mga sinagoga
  rationale: Malinaw at likas na ipinahahayag ng “ititiwalag” ang sapilitang pagpapaalis o pagbubukod mula sa pamayanang sinagoga, habang pinananatili ng “mga sinagoga” ang anyong maramihan sa Griyego.
- source_word: ἀλλ’
  choice: Higit pa rito
  rationale: Dito ay nagpapasidhi ang ἀλλά sa naunang babala, hindi lamang nagpapakita ng payak na pagsalungat. Likas sa Filipino ang “Higit pa rito” para sa ganitong pag-igting.
- source_word: ἔρχεται ὥρα
  choice: darating ang oras
  rationale: Pinananatili nito ang mahalagang idyomang Johannine na “oras” nang hindi ito pinapakahulugang mas malawak bilang “panahon.”
- source_word: ἵνα πᾶς ὁ ἀποκτείνας ὑμᾶς
  choice: na ang sinumang pumatay sa inyo
  rationale: Sa konstruksiyong ito, ipinakikilala ng ἵνα ang mangyayari sa oras na iyon. Ang “sinuman” ay natural na nagpapahayag ng pangkalahatang saklaw ng πᾶς ὁ.
- source_word: δόξῃ
  choice: mag-aakalang
  rationale: Ipinahahayag nito ang pansariling paniniwala o palagay ng mamamatay-tao, nang hindi ipinahihiwatig na tama ang kanyang akala.
- source_word: λατρείαν προσφέρειν τῷ θεῷ
  choice: naghahandog siya ng paglilingkod sa Diyos
  rationale: Pinananatili ng “naghahandog” ang presentasyonal at kultikong himig ng προσφέρειν, samantalang ang “paglilingkod sa Diyos” ay malawak na sapat upang saklawin ang relihiyosong paglilingkod ng λατρεία nang hindi ito nililimitahan sa pagsamba lamang.
theological_decisions:
- issue: Ang kultikong paglalarawan sa sariling pagkaunawa ng mga mang-uusig
  choice: naghahandog siya ng paglilingkod sa Diyos
  alternative: nag-aalay siya ng pagsamba sa Diyos
  rationale: Ipinakikita ng Griyego na itinuturing ng mamamatay-tao ang kanyang ginawa bilang lehitimong debosyon sa Diyos. Pinananatili ng salin ang nakagigitlang ironiya, ngunit hindi ipinahihiwatig na sinasang-ayunan ng Diyos ang gawa.
- issue: Ang pangkalahatang saklaw ng πᾶς ὁ ἀποκτείνας
  choice: ang sinumang pumatay sa inyo ... siya
  alternative: ang bawat taong papatay sa inyo
  rationale: Ang “sinuman” ay likas at inklusibong panumbas sa generic na konstruksiyon. Ang “siya” ay panatilihing isahan at hindi nagtatakda ng kasarian sa Filipino.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “sinagoga” bilang karaniwang katawagan sa institusyong Judio; iniwasan ang wikang natatangi sa alinmang denominasyon.
