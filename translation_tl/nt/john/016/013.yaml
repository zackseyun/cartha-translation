  text: ὅταν δὲ ἔλθῃ ἐκεῖνος, τὸ πνεῦμα τῆς ἀληθείας, ὁδηγήσει ὑμᾶς ⸂ἐν τῇ ἀληθείᾳ πάσῃ⸃, οὐ γὰρ λαλήσει ἀφ’ ἑαυτοῦ, ἀλλ’ ὅσα ⸀ἀκούσει λαλήσει, καὶ τὰ ἐρχόμενα ἀναγγελεῖ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/013.yaml
  text: But when he[a], the Spirit of truth, comes, he will guide you into all the truth. For he will not speak from himself, but whatever he hears he will speak[d][c][b], and he will declare to you the things that are coming.
translation:
  language: tl
  text: Ngunit kapag dumating siya—ang Espiritu ng katotohanan—gagabayan niya kayo sa buong katotohanan.[a] Sapagkat hindi siya magsasalita mula sa kanyang sarili,[b] kundi sasabihin niya ang anumang maririnig niya, at ipahahayag niya sa inyo ang mga bagay na darating.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “tungo sa buong katotohanan.” Ang Griyego ay literal na “sa buong katotohanan,” ngunit ang pandiwang “gagabayan” ay maaari ring magpahiwatig ng pag-akay patungo roon.
    reason: alternative_reading
  - marker: b
    text: Maaari ring isalin na “sa sarili niyang pagkukusa.” Literal na “mula sa kanyang sarili.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin na “ang mga bagay na nalalapit” o “ang mangyayari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Ngunit pagdating
  rationale: Ipinapahayag ng ὅταν ang panahong inaasahang darating, at dinadala ng “ngunit” ang banayad na pagsalungat o pagpapatuloy ng δέ mula sa naunang konteksto.
- source_word: ἔλθῃ ἐκεῖνος
  choice: pagdating niya—siya na
  rationale: Likas sa Tagalog ang “pagdating niya” para sa aorist subjunctive pagkatapos ng ὅταν. Pinananatili ng “siya na” ang personal at mariing pagtukoy ng panlalaking ἐκεῖνος, kahit walang kasariang gramatikal ang panghalip na Tagalog.
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: Espiritu ng katotohanan
  rationale: Pinananatili ang pormal na ugnayang genitibo at ang katawagang ginagamit sa Juan. Ang malaking titik sa “Espiritu” ay naaayon sa personal na pagtukoy sa konteksto.
- source_word: ὁδηγήσει ὑμᾶς
  choice: gagabayan niya kayo
  rationale: Ang “gagabayan” ay natural na katumbas ng ὁδηγέω sa metaporikal na diwang pag-akay o paggabay.
- source_word: ἐν τῇ ἀληθείᾳ πάσῃ
  choice: sa buong katotohanan
  rationale: Ang “sa” ay natural na kasama ng “gagabayan” sa Tagalog at maaari nitong dalhin ang diwang nasa loob o patungo sa saklaw ng buong katotohanan. Pinananatili ng “buong katotohanan” ang artikulo at ang kabuuang diwa ng πάσῃ.
- source_word: οὐ γὰρ λαλήσει ἀφ’ ἑαυτοῦ
  choice: Sapagkat hindi siya magsasalita mula sa kanyang sarili
  rationale: Malapit nitong pinananatili ang literal na “mula sa kanyang sarili” at ang ugnayan ng pagtanggap at pagsasalita sa talata, nang hindi idinaragdag ang ideya ng awtoridad o pagkukusa sa pangunahing teksto.
- source_word: ἀλλ’ ὅσα ἀκούσει λαλήσει
  choice: kundi sasabihin niya ang anumang maririnig niya
  rationale: Pinananatili ang pagsalungat at ang hinaharap na aspekto ng ἀκούσει at λαλήσει. Mas natural sa Tagalog ang ayos na pandiwa bago ang layon.
- source_word: τὰ ἐρχόμενα
  choice: ang mga bagay na darating
  rationale: Tuwirang ipinapahayag ang mga nalalapit na bagay o pangyayari nang hindi nililimitahan ang tinutukoy sa hula lamang.
- source_word: ἀναγγελεῖ ὑμῖν
  choice: ipahahayag niya sa inyo
  rationale: Ang “ipahahayag” ay angkop sa solemneng diwa ng pag-uulat o pagpapabatid ng ἀναγγέλλω at nananatiling malinaw sa makabagong Tagalog.
theological_decisions:
- issue: Personal na pagtukoy sa Espiritu
  choice: Gamitin ang personal na panghalip na “siya/niya” at ang mariing pariralang “siya na Espiritu ng katotohanan.”
  alternative: Ulitin lamang ang “Espiritu” o gumamit ng mas di-personal na pagkakabuo.
  rationale: Bagaman walang kasariang gramatikal ang mga panghalip sa Tagalog, malinaw na personal at mariin ang pagtukoy ng ἐκεῖνος sa Griyego. Pinananatili ito nang hindi nagdaragdag ng kasariang wala sa Tagalog.
- issue: Kahulugan ng ἐν τῇ ἀληθείᾳ πάσῃ
  choice: Isalin bilang “sa buong katotohanan.”
  alternative: “tungo sa buong katotohanan” o “sa loob ng buong katotohanan”
  rationale: Ang ἐν ay pormal na “sa/loob,” ngunit kasama ng ὁδηγέω maaari rin itong unawain sa direksiyonal na diwa. Ang “sa buong katotohanan” ay natural sa Tagalog at hindi labis na nagpapasya sa pagitan ng dalawang posibilidad; inilalahad sa talababa ang mas hayag na direksiyonal na salin.
- issue: Pagdepende ng pagsasalita ng Espiritu
  choice: Panatilihin ang “mula sa kanyang sarili.”
  alternative: “ayon sa sarili niyang pagkukusa” o “sa sarili niyang awtoridad”
  rationale: Hindi tahasang binabanggit ng ἀφ’ ἑαυτοῦ ang pagkukusa o awtoridad. Ang mas pormal na salin ay nagpapanatili ng teolohikal na tensiyon at ng ugnayang inilalarawan ng teksto nang hindi ito ipinapaliwanag nang lampas sa Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang mga gitling na em dash upang maipakita nang natural ang apposisyon at diin ng ἐκεῖνος nang hindi lumilikha ng malabong ayos ng pangungusap. Hindi gumagamit ng katawagang natatangi sa isang denominasyon.
