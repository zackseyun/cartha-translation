  terminology: Ang “Espiritu ng katotohanan,” “buong katotohanan,” at “ipahahayag” ay angkop at pare-pareho sa makabagong Tagalog na salin ng tekstong Juan. Ang “mula sa kanyang sarili” ay pormal ngunit katanggap-tanggap at maingat na hindi nagdaragdag ng “awtoridad” o “pagkukusa” sa pangunahing teksto.
