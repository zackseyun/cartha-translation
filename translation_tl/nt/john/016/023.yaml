  text: καὶ ἐν ἐκείνῃ τῇ ἡμέρᾳ ἐμὲ οὐκ ἐρωτήσετε οὐδέν· ἀμὴν ἀμὴν λέγω ὑμῖν, ⸂ἄν τι⸃ αἰτήσητε τὸν πατέρα ⸂δώσει ὑμῖν ἐν τῷ ὀνόματί μου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/023.yaml
  text: And in that day you will ask me nothing[a]. Truly, truly, I say to you, whatever you ask the Father in my name[b], he will give to you.
translation:
  language: tl
  text: 'At sa araw na iyon, hindi kayo magtatanong sa akin ng anuman.[a] Totoo, totoong sinasabi ko sa inyo: Anuman ang hingin ninyo sa Ama sa pangalan ko, ibibigay niya sa inyo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Magkaiba ang dalawang pandiwang Griyego na isinalin dito: ang una, ἐρωτάω, ay “magtanong” o “mag-usisa” kay Jesus; ang ikalawa, αἰτέω, ay “humingi” o “makiusap” sa Ama.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: sa araw na iyon
  rationale: Likas na temporal na parirala sa modernong Tagalog at pinananatili ang natatanging pagtukoy sa araw na iyon.
- source_word: ἐμὲ οὐκ ἐρωτήσετε οὐδέν
  choice: wala na kayong itatanong sa akin
  rationale: Ang “itatanong” ay natural na nagsasaad ng pagtatanong o pag-uusisa kay Jesus at tumutulong na maipakita ang kaibahan nito sa mapakiusap na αἰτέω sa kasunod na sugnay. Ang “na” ay angkop sa konteksto ng paglipat mula sa kasalukuyang pagtatanong ng mga alagad tungo sa araw na iyon.
- source_word: ἀμὴν ἀμὴν
  choice: Katotohanang-katotohanan
  rationale: Pinananatili ang mariing pag-uulit na katangian ng pananalita ni Jesus sa Juan, habang malinaw at marangal sa Tagalog.
- source_word: ἄν τι αἰτήσητε
  choice: Anuman ang hingin ninyo
  rationale: Ang “hingin” ay malinaw na mapakiusap na paghingi, at ang “anuman” ay natural na kumakatawan sa di-tiyak na saklaw ng ἄν τι.
- source_word: τὸν πατέρα
  choice: sa Ama
  rationale: Hindi dinaragdagan ng panghalip na “aking,” sapagkat “ang Ama” lamang ang nasa Griyego; ginagamit ang “sa” bilang likas na pananda ng taong hinihingan.
- source_word: ἐν τῷ ὀνόματί μου
  choice: sa pangalan ko
  rationale: Karaniwan at mahalagang pormulasyong Juaniko na nagpapanatili sa malawak na kinatawan at relasyonal na diwa nang hindi ito ipinapaliwanag nang labis.
- source_word: δώσει ὑμῖν
  choice: ibibigay niya sa inyo
  rationale: Malapit sa Griyego at natural sa Tagalog; hindi na kailangang magdagdag ng tahasang layon dahil nauunawaan ito mula sa anumang hiningi.
theological_decisions:
- issue: Pagkakaiba ng ἐρωτάω tungkol kay Jesus at αἰτέω tungkol sa Ama
  choice: Isinalin ang una bilang “itatanong” at ang ikalawa bilang “hingin.”
  alternative: Gamitin ang “magtatanong” o “hihingi” sa parehong bahagi.
  rationale: 'Kayang ipakita ng Tagalog nang natural ang tunay na leksikal na kaibahan: ang una ay pagtatanong kay Jesus, samantalang ang ikalawa ay paghiling sa Ama. Hindi nito pinipilit ang isang mas makitid na interpretasyon.'
- issue: Saklaw ng pangakong kaugnay ng paghiling sa pangalan ni Jesus
  choice: Tuwirang pinanatili ang pangako nang walang idinagdag na doktrinal na kondisyon.
  alternative: Idagdag na ang kahilingan ay dapat nakaayon sa kalooban ni Jesus o ng Diyos.
  rationale: Bagaman maaaring magbigay-liwanag ang mas malawak na konteksto ng Juan, walang gayong tahasang kondisyon sa talatang ito; dapat manatili ang teolohikal na tensiyon ng mismong pahayag.
- issue: Pagkakaugnay ng “sa pangalan ko”
  choice: 'Ikinabit sa paghiling: “Anuman ang hingin ninyo sa Ama sa pangalan ko.”'
  alternative: 'Iugnay sa pagbibigay: “ibibigay niya sa inyo sa pangalan ko.”'
  rationale: Ang pangunahing bantas at karaniwang pagbasa ay nag-uugnay sa parirala sa paghiling, ngunit may tekstuwal/sintaktikong usapin na nararapat itala sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “ninyo/inyo” para sa maramihang kausap, “Ama” bilang kinikilalang titulo, at “Katotohanang-katotohanan” upang mapanatili ang mariing dobleng ἀμήν. Ang lahat ng marker na [a] at [b] ay nasa pangunahing teksto.
