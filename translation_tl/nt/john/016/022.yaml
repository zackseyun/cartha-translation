  source_fidelity: 'Tumpak na naipapahayag ang pang-ugnay na οὖν, ang kasalukuyang dalamhati, ang magkasalungat na hinaharap na muling pagkikita, at lalo na ang tahasang simuno ng ὄψομαι ὑμᾶς: si Jesus ang ‘makakakita’ sa mga alagad. Gayunman, ang ‘makapag-aalis’ ay nagdaragdag ng modal na diin sa kakayahan (‘walang may kakayahang mag-alis’) na wala sa αἴρει. Mas tapat at malinaw sa pangakong hinaharap ang simpleng ‘mag-aalis.’'
  naturalness: Makabago, malinaw, at angkop ang rehistro. Ang ‘Kaya kayo rin,’ ‘nalulungkot ngayon,’ ‘magagalak ang inyong puso,’ at ‘inyong kagalakan’ ay natural at marangal sa Filipino. Ang maliit na pagbabago sa huling sugnay ay nagpapanatili rin ng likas na daloy.
  terminology: Wastong pinananatili ang ‘puso,’ ‘magagalak,’ at ‘kagalakan,’ na tumutugon sa χαρήσεται/χαρά. Ang pangalang ‘Jesus’ at ‘mga alagad’ sa talababa ay angkop. Wasto ring inilalahad ng talababa ang alternatibong pagbasa nang hindi binabaligtad ang tekstong Griyego sa pangunahing salin.
  issues:
