    issue: May modal na dagdag ang ‘makapag-aalis.’
    rationale: Ang αἴρει ay payak na pandiwa na ‘nag-aalis/kukuha,’ samantalang ang ‘makapag-aalis’ ay nakatuon sa kakayahan. Dahil hinaharap ang konteksto ng pangako, ‘mag-aalis’ ang mas direktang katumbas nang walang dagdag na kahulugan.
  revised_text: Kaya kayo rin ay nalulungkot ngayon; ngunit muli ko kayong makikita[a], at magagalak ang inyong puso, at walang sinumang mag-aalis sa inyo ng inyong kagalakan.
