base_translation:
  language: en
  yaml_path: translation/nt/john/016/022.yaml
  text: So you also now have sorrow; but I will see you again[a], and your heart will rejoice, and no one will take your joy from you.
translation:
  language: tl
  text: Kaya kayo rin ay nalulungkot ngayon; ngunit muli ko kayong makikita[a], at magagalak ang inyong puso, at walang sinumang mag-aalis sa inyo ng inyong kagalakan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “muli ninyo akong makikita.” Mas literal na mababasa sa Griyego, “muli ko kayong makikita,” na maaaring magbigay-diin sa pagkukusa ni Jesus na bumalik sa kanyang mga alagad.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Ipinakikita ang kongklusyon o paglalapat mula sa paghahalintulad tungkol sa panganganak sa naunang talata.
- source_word: καὶ ὑμεῖς
  choice: kayo rin
  rationale: Likas na inililipat sa Tagalog ang diin ng καί na nag-uugnay sa karanasan ng mga alagad sa naunang paghahalintulad.
- source_word: νῦν μὲν λύπην ἔχετε
  choice: ay nalulungkot ngayon
  rationale: Natural na pandiwang Tagalog para sa kasalukuyang kalagayan ng dalamhati; ang kaibahan na ipinahihiwatig ng μέν ay kinukumpleto ng “ngunit.”
- source_word: πάλιν δὲ
  choice: ngunit muli
  rationale: Pinananatili ng “ngunit” ang pagsalungat sa kasalukuyang lungkot, at ng “muli” ang panibagong pagkikita.
- source_word: ὄψομαι ὑμᾶς
  choice: muli ko kayong makikita
  rationale: Tapat sa tahasang unang panauhang simuno at ikalawang panauhang layon ng Griyego, sa halip na baligtaring “muli ninyo akong makikita.”
- source_word: χαρήσεται ὑμῶν ἡ καρδία
  choice: magagalak ang inyong puso
  rationale: Pinananatili ang pandiwang diwa ng χαρήσεται at ang “puso” bilang sentro ng panloob na pagkatao.
- source_word: τὴν χαρὰν ὑμῶν
  choice: ang inyong kagalakan
  rationale: Pinananatili ang leksikal na ugnayan ng “magagalak” at “kagalakan.”
- source_word: οὐδεὶς αἴρει ἀφ’ ὑμῶν
  choice: walang sinumang makapag-aalis sa inyo
  rationale: Ang “makapag-aalis” ay natural na nagpapahayag na walang taong may kakayahang mag-alis nito; ang pangungusap ay nasa kontekstong nakatuon sa hinaharap.
theological_decisions:
- issue: Simuno at diin ng muling pagkikita
  choice: muli ko kayong makikita
  alternative: muli ninyo akong makikita
  rationale: Malinaw sa Griyego na si Jesus ang simuno at ang mga alagad ang layon. Pinananatili ito upang huwag iayon nang sapilitan sa kalapit na pananalita at upang mapanatili ang pagkukusa ni Jesus sa muling pakikipagtagpo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nalulungkot” sa halip na mas mabigat o makalumang anyo, habang pinanatili ang “puso” at “kagalakan” para sa dignidad at leksikal na pagkakaugnay ng talata.
