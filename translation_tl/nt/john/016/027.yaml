  source_fidelity: Tumpak na naisasalin ang γάρ bilang “Sapagkat,” ang mariing αὐτός sa “mismo,” ang sanhi ng unang ὅτι sa “dahil,” at ang nilalaman ng ikalawang ὅτι sa “na.” Ang “nagmula ako sa Diyos” ay maingat na katumbas ng παρὰ τοῦ θεοῦ ἐξῆλθον at hindi nagdaragdag ng paliwanag na doktrinal.
  naturalness: Natural at marangal ang modernong Filipino Tagalog. Ang “Sapagkat ang Ama mismo ay nagmamahal sa inyo” at “minahal ninyo ako at naniwala kayong…” ay malinaw at maayos ang daloy. Katanggap-tanggap na hindi tuwirang minamarkahan sa Tagalog ang buong puwersa ng dalawang perpektong pandiwang Griyego.
  terminology: Ang “Ama,” “Diyos,” “nagmamahal,” at “minahal” ay angkop at magkakatugma sa rehistro ng Juan. Ang talababa ay wastong nagpapanatili ng alternatibong diwa ng paglabas o pagdating mula sa presensiya ng Diyos nang hindi ito ipinipilit sa pangunahing salin.
