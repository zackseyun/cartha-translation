id: JHN.16.27
reference: John 16:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: αὐτὸς γὰρ ὁ πατὴρ φιλεῖ ὑμᾶς, ὅτι ὑμεῖς ἐμὲ πεφιλήκατε καὶ πεπιστεύκατε ὅτι ἐγὼ παρὰ τοῦ ⸀θεοῦ ἐξῆλθον.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/027.yaml
  text: For the Father himself loves you[a], because you have loved me and have believed that I came from God.
translation:
  language: tl
  text: Sapagkat ang Ama mismo ay nagmamahal sa inyo, dahil minahal ninyo ako at naniwala kayong nagmula ako sa Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lumabas ako mula sa Diyos”; maaari ring ipahiwatig ng Griyego ang pagdating mula sa presensiya ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς γὰρ ὁ πατὴρ
  choice: Sapagkat ang Ama mismo
  rationale: Pinananatili ng “mismo” ang pagbibigay-diin ng αὐτός sa personal na pag-ibig ng Ama, habang ang “sapagkat” ay natural na naghahayag ng paliwanag na ipinakikilala ng γάρ.
- source_word: φιλεῖ ὑμᾶς
  choice: nagmamahal sa inyo
  rationale: Ang φιλέω rito ay tumutukoy sa personal na pag-ibig o pagmamahal. Ang “nagmamahal” ay likas at marangal sa modernong Tagalog at hindi nagpapahina sa lalim ng ugnayan.
- source_word: ὅτι ὑμεῖς ἐμὲ πεφιλήκατε
  choice: dahil minahal ninyo ako
  rationale: Malinaw na ipinahahayag ng “dahil” ang sanhi. Ang “minahal ninyo” ay natural sa Tagalog at naipakikita sa konteksto ang nananatiling kabuluhan ng perpektong aspekto, nang hindi gumagamit ng alanganing literal na anyo.
- source_word: καὶ πεπιστεύκατε
  choice: at naniwala kayo
  rationale: Ang “naniwala” ay angkop dahil isang pahayag ang nilalaman ng paniniwala. Hindi kailangang piliting ilantad sa pandiwa ang perpektong aspekto, sapagkat ipinahihiwatig na ng konteksto ang patuloy na bisa nito.
- source_word: ὅτι ἐγὼ παρὰ τοῦ θεοῦ ἐξῆλθον
  choice: na nagmula ako sa Diyos
  rationale: Ang “nagmula ako sa Diyos” ay malinaw na naghahayag ng pinagmulan at misyon ni Jesus nang hindi dinaragdagan ang Griyego ng isang tiyak na paliwanag na doktrinal.
theological_decisions:
- issue: Ang Kristolohikal na diwa ng παρὰ τοῦ θεοῦ ἐξῆλθον
  choice: nagmula ako sa Diyos
  alternative: nanggaling ako mula sa presensiya ng Diyos
  rationale: Pinananatili ng pangunahing salin ang pahayag tungkol sa pinagmulan at pagsusugo kay Jesus, ngunit hindi nito nilulutas nang lampas sa teksto kung ang diin ay pinagmulan, paglabas, o pagdating mula sa presensiya ng Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “Ama” at “Diyos” bilang mga titulong tumutukoy sa Diyos. Inilagay ang talababa sa pariralang tinutukoy nito.
