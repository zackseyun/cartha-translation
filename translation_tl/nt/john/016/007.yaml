id: JHN.16.7
reference: John 16:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀλλ’ ἐγὼ τὴν ἀλήθειαν λέγω ὑμῖν, συμφέρει ὑμῖν ἵνα ἐγὼ ἀπέλθω. ἐὰν ⸀γὰρ μὴ ἀπέλθω, ὁ παράκλητος ⸂οὐ μὴ ἔλθῃ⸃ πρὸς ὑμᾶς· ἐὰν δὲ πορευθῶ, πέμψω αὐτὸν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/007.yaml
  text: 'But I am telling you the truth: it is better for you that I go away. For if I do not go away[a], the Advocate will certainly not come to you; but if I go, I will send him to you.'
translation:
  language: tl
  text: 'Ngunit sinasabi ko sa inyo ang katotohanan: makabubuti sa inyo na umalis ako. Sapagkat kung hindi ako aalis, hinding-hindi darating sa inyo ang Tagapagtanggol[a]. Ngunit kung aalis ako, isusugo ko siya sa inyo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Tagatulong,” “Tagapayo,” o “Mang-aaliw”; sa Griyego, Parakletos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Ngunit
  rationale: Likas at marangal na panandang pasalungat, na inuugnay ang pahayag sa kalungkutan ng mga alagad sa naunang konteksto.
- source_word: τὴν ἀλήθειαν λέγω ὑμῖν
  choice: sinasabi ko sa inyo ang katotohanan
  rationale: Pinananatili ang tuwirang pagdidiin ni Jesus sa katotohanan ng kaniyang sinasabi sa natural na modernong Tagalog.
- source_word: συμφέρει ὑμῖν
  choice: makabubuti sa inyo
  rationale: Malinaw na ipinahahayag ang kapakinabangan o bentaha nang hindi nagiging teknikal o matigas ang pananalita.
- source_word: ἵνα ἐγὼ ἀπέλθω
  choice: na umalis ako
  rationale: Natural na ipinapahayag ang nilalaman ng kung ano ang makabubuti at pinananatili ang pag-alis bilang pokus.
- source_word: ἐὰν γὰρ μὴ ἀπέλθω
  choice: Sapagkat kung hindi ako aalis
  rationale: Pinananatili ang paliwanag na γάρ, ang kondisyong ἐάν μή, at ang pag-uulit ng pandiwa mula sa naunang sugnay.
- source_word: ὁ παράκλητος
  choice: ang Tagapagtanggol[a]
  rationale: Ipinahahayag ang personal at kumakatawang tungkulin ng παράκλητος sa wikang madaling maunawaan; inilalagay sa talababa ang mas malawak na saklaw ng salita.
- source_word: οὐ μὴ ἔλθῃ
  choice: hinding-hindi darating
  rationale: Inihahatid ang mariing pagtanggi ng οὐ μή na may subjunctive sa malinaw at idiomatikong Tagalog.
- source_word: πρὸς ὑμᾶς
  choice: sa inyo
  rationale: Natural na katumbas ng paglapit o pagdating tungo sa mga alagad sa kontekstong ito.
- source_word: ἐὰν δὲ πορευθῶ
  choice: Ngunit kung aalis ako
  rationale: Pinananatili ang pasalungat na kondisyon; ang ‘aalis’ ay natural sa Tagalog at angkop sa konteksto ng pagpanaw ni Jesus.
- source_word: πέμψω αὐτὸν πρὸς ὑμᾶς
  choice: isusugo ko siya sa inyo
  rationale: Ang ‘isusugo’ ay angkop sa personal na pagpapadala, at ang ‘siya’ ay tapat sa personal na reperensiya ng masculine na αὐτόν.
theological_decisions:
- issue: Salin ng παράκλητος sa diskurso ni Juan
  choice: Tagapagtanggol
  alternative: Tagatulong; Tagapayo; Mang-aaliw; Parakletos
  rationale: Walang iisang salitang Tagalog na sumasaklaw sa lahat ng kahulugan ng παράκλητος. Pinakamalinaw na naipapakita ng ‘Tagapagtanggol’ ang personal at kumakatawang papel nito, samantalang iniingatan sa talababa ang ibang tunay na posibilidad.
- issue: Personal na pagtukoy sa παράκλητος
  choice: siya
  alternative: ito
  rationale: Inilalarawan ng teksto ang παράκλητος bilang personal na isinugo at gumagamit ito ng masculine na αὐτόν; kaya iniiwasan ng ‘siya’ ang di-makatwirang pagtrato sa kaniya bilang isang puwersang walang persona.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Pinanatili ang pag-uulit ng ‘alis,’ ang paliwanag na ‘Sapagkat,’ ang mariing pagtangging ‘hinding-hindi,’ at ang personal na pagtukoy sa Tagapagtanggol.
