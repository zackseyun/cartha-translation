id: JHN.16.25
reference: John 16:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ταῦτα ἐν παροιμίαις λελάληκα ὑμῖν· ⸀ἔρχεται ὥρα ὅτε οὐκέτι ἐν παροιμίαις λαλήσω ὑμῖν ἀλλὰ παρρησίᾳ περὶ τοῦ πατρὸς ⸀ἀπαγγελῶ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/025.yaml
  text: I have spoken these things to you in figures of speech[a]. An hour is coming when I will no longer speak to you in figures of speech[c][b], but will tell you plainly about the Father.
translation:
  language: tl
  text: Sinabi ko sa inyo ang mga bagay na ito sa matalinghagang pananalita.[a] Darating ang oras[b] na hindi na ako magsasalita sa inyo sa matalinghagang pananalita, kundi sasabihin ko sa inyo nang malinaw[c] ang tungkol sa Ama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa mga talinghaga” o “sa di-tuwirang pananalita.” Ang salitang Griyego ay tumutukoy rito sa matalinghaga o bahagyang nakakubling paraan ng pagsasalita.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Darating ang panahon.” Madalas gamitin ni Juan ang “oras” na may natatanging teolohikal na kabuluhan.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “nang hayagan” o “nang buong luwag.” Dito, ipinahihiwatig ng salita ang tuwiran at hindi matalinghagang pagsasalita.
    reason: lexical_alternative
lexical_decisions:
- source_word: παροιμίαις
  choice: sa matalinghagang pananalita
  rationale: Sa kontekstong Juanino, tumutukoy ito sa pananalitang matalinghaga o di-tuwiran, hindi lamang sa teknikal na anyo ng parabula. Likas at malinaw sa modernong Tagalog ang pariralang ito.
- source_word: λελάληκα
  choice: Sinabi ko
  rationale: Natural itong katumbas sa Tagalog ng perpektong Griyego para sa pananalitang naganap na at mahalaga pa rin sa kasalukuyang usapan. Hindi kailangang piliting tumbasan ang aspektong Griyego sa paraang magiging mabigat sa Tagalog.
- source_word: ἔρχεται ὥρα
  choice: Darating ang oras
  rationale: Pinananatili ng “oras” ang natatanging bokabularyo at posibleng teolohikal na bigat nito sa Juan. Sa Tagalog, maaari rin itong tumukoy sa takdang sandali, hindi lamang sa animnapung minuto.
- source_word: οὐκέτι
  choice: hindi na
  rationale: Ito ang pinakanatural at eksaktong Tagalog para sa paghinto ng dating paraan ng pagsasalita.
- source_word: λαλήσω
  choice: magsasalita
  rationale: Pinananatili nito ang diin sa paraan ng pagsasalita at ang ugnayan sa naunang pahayag.
- source_word: παρρησίᾳ
  choice: nang malinaw
  rationale: Ang pangunahing pagsalungat dito ay sa matalinghaga o di-tuwirang pananalita. Kaya “nang malinaw” angkop kaysa sa salitang magdidiin sa tapang o pampublikong pagsasalita.
- source_word: ἀπαγγελῶ
  choice: sasabihin ko
  rationale: Natural ito sa Tagalog para sa tuwirang paghahayag ng impormasyon sa mga kausap, nang hindi nagdaragdag ng pormal na diwa ng pagpapahayag sa madla.
- source_word: περὶ τοῦ πατρὸς
  choice: ang tungkol sa Ama
  rationale: Malinaw at natural nitong pinananatili ang paksa ng ihahayag at ang natatanging pagtukoy sa Ama.
theological_decisions:
- issue: Ang kahulugan ng ὥρα sa kontekstong Juanino
  choice: Darating ang oras
  alternative: Darating ang panahon
  rationale: Pinananatili ng “oras” ang bokabularyong may natatanging kabuluhan sa Juan, ngunit hindi tinutukoy nang lampas sa sinasabi ng teksto kung aling partikular na pangyayari ang tinutukoy.
- issue: Ang kahulugan ng παρρησίᾳ bilang kasalungat ng ἐν παροιμίαις
  choice: nang malinaw
  alternative: nang hayagan; nang buong luwag
  rationale: Sa talatang ito, ang diin ay sa malinaw at tuwirang pagsasalita, hindi pangunahing sa katapangan o pagiging pampubliko.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Iniwasan ang sobrang teknikal na “parabula” sa pangunahing teksto at pinanatili ang Juaninong “oras” dahil nauunawaan din ito sa Tagalog bilang takdang sandali.
