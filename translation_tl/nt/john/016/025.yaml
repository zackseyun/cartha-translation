  source_fidelity: Tumpak na naipapahayag ng salin ang perpektong «λελάληκα» ("Sinabi ko"), ang kasalukuyang pagdating ng «ἔρχεται ὥρα» ("Darating ang oras"), ang paghahambing ng di-tuwiran at malinaw na pagsasalita, at ang paksa na «ang tungkol sa Ama.» Hindi nito ipinipilit ang isang partikular na pagpapakahulugan sa "oras."
  naturalness: Likas, malinaw, at marangal ang modernong Filipino Tagalog. Ang pag-uulit ng "sa matalinghagang pananalita" ay katanggap-tanggap at sinasalamin ang sinadyang pag-uulit sa Griyego. Maayos ang daloy ng pangungusap at ang gamit ng "nang malinaw."
  terminology: Ang "matalinghagang pananalita" ay angkop para sa παροιμίαις sa Juan at hindi nito ikinakahon ang salita sa teknikal na kahulugang "parabula." Ang "oras," "Ama," at "nang malinaw" ay angkop na mga katumbas sa kontekstong ito. Ang mga talababa ay wastong nakakabit sa mga salitang nililinaw nila.
