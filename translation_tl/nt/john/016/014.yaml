  source_fidelity: 'Tumpak ang pangunahing diwa: ang Espiritu ang luluwalhati kay Jesus, sapagkat kukuha siya mula sa kung ano ang kay Jesus at ihahayag ito sa mga alagad. Ang panghinaharap at sanhi na ipinahihiwatig ng Griyego ay napanatili. Ang ''kukuha'' ay mas tuwirang katumbas ng λήμψεται sa pariralang ἐκ τοῦ ἐμοῦ kaysa sa medyo di-likas na ''tatanggap ... mula sa.'''
  naturalness: Marangal at malinaw ang rehistro, ngunit hindi gaanong idiomatiko sa modernong Tagalog ang 'tatanggap siya mula sa kung ano ang sa akin.' Mas natural ang 'kukuha siya mula sa kung ano ang akin.' Ang 'ipahahayag niya ito' ay maayos at malinaw na pagtukoy sa di-tahasang layon ng Griyego.
