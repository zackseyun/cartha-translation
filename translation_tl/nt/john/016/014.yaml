  yaml_path: translation/nt/john/016/014.yaml
  text: He will glorify me[a], because he will take from what is mine and declare it to you.
translation:
  language: tl
  text: Luluwalhatiin niya ako, sapagkat kukuha siya mula sa kung ano ang akin at ipahahayag niya ito sa inyo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκεῖνος
  choice: niya
  rationale: Tumutukoy ito sa Espiritu ng katotohanan sa naunang konteksto. Likas sa modernong Tagalog ang panghalip na “niya”; hindi kailangang gawing “ang isang iyon” ang demonstratibong anyo.
- source_word: ἐμὲ
  choice: ako
  rationale: Tuwirang layon ng pandiwang “luluwalhatiin.”
- source_word: δοξάσει
  choice: luluwalhatiin
  rationale: Pinananatili nito ang bigat ng δοξάζω sa Ebanghelyo ni Juan, na higit sa karaniwang pagbibigay-pugay at kaugnay ng paghahayag ng kaluwalhatian ni Jesus.
- source_word: ὅτι
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan kung paano luluwalhatiin ng Espiritu si Jesus.
- source_word: ἐκ τοῦ ἐμοῦ
  choice: mula sa kung ano ang sa akin
  rationale: 'Pinananatili ang malawak at bahagyang di-tiyak na diwa ng neutrong parirala: yaong nauukol kay Jesus, nang hindi nililimitahan sa turo, kapangyarihan, o pahayag lamang.'
- source_word: λήμψεται
  choice: tatanggap
  rationale: Maaaring mangahulugan ang λαμβάνω ng “kumuha” o “tumanggap.” Sa pariralang may ἐκ, natural ang “tatanggap mula sa” at hindi ipinapalagay na sapilitang pagkuha.
- source_word: ἀναγγελεῖ
  choice: ipahahayag niya iyon
  rationale: Ang ἀναγγέλλω ay mag-ulat, magpahayag, o magbigay-alam. Idinagdag ang “iyon” bilang likas na pantukoy sa Tagalog sa bagay na tinanggap.
- source_word: ὑμῖν
  choice: sa inyo
  rationale: Ikalawang panauhang maramihan ang tinutukoy; malinaw itong naipahahayag ng “sa inyo.”
theological_decisions:
- issue: Ang ugnayan ng Espiritu kay Jesus sa pariralang ἐκ τοῦ ἐμοῦ λήμψεται
  choice: tatanggap siya mula sa kung ano ang sa akin
  alternative: kukuha siya mula sa kung ano ang sa akin
  rationale: Hindi ginagawang teknikal na pormulang doktrinal ang parirala. Pinananatili nitong ang ipinahahayag ng Espiritu ay nagmumula sa nauukol kay Jesus, habang iniiwan ang saklaw ng “kung ano ang sa akin” na gaya ng pagiging malawak nito sa Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “luluwalhatiin” upang mapanatili ang mahalagang bokabularyong teolohikal ni Juan, at “sapagkat” para sa malinaw ngunit dignified na ugnayang sanhi.
