id: JHN.16.32
reference: John 16:32
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἰδοὺ ἔρχεται ὥρα ⸀καὶ ἐλήλυθεν ἵνα σκορπισθῆτε ἕκαστος εἰς τὰ ἴδια κἀμὲ μόνον ἀφῆτε· καὶ οὐκ εἰμὶ μόνος, ὅτι ὁ πατὴρ μετ’ ἐμοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/032.yaml
  text: Behold[a], an hour is coming, and has come, when you will be scattered, each to his own, and will leave me alone. Yet I am not alone, because the Father is with me.
translation:
  language: tl
  text: Narito, dumarating ang oras—at dumating na—na magkakawatak-watak kayo, at bawat isa ay magkakanya-kanya[a], at iiwan ninyo akong nag-iisa. Ngunit hindi ako nag-iisa, sapagkat kasama ko ang Ama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bawat isa ay patungo sa kani-kaniyang sarili.” Ang Griyego ay mas malawak kaysa sa isang tiyak na lugar at maaaring tumukoy sa sariling tahanan, lugar, mga pag-aari, o mga bagay na nauukol sa bawat isa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Tingnan ninyo
  rationale: Likas at marangal na panawag-pansin sa modernong Filipino; pinananatili nito ang bigat ng pahayag nang hindi gumagamit ng makalumang anyo.
- source_word: ἔρχεται ὥρα καὶ ἐλήλυθεν
  choice: dumarating ang oras—at dumating na
  rationale: 'Pinananatili ang tensiyon ng pangkasalukuyang pagdating at ng ganap nang pagdating: nalalapit ang mapagpasyang sandali ngunit sa isang diwa ay narito na.'
- source_word: ἵνα
  choice: na
  rationale: Pagkatapos ng pariralang tungkol sa pagdating ng oras, natural na ipinakikilala ng “na” ang nilalaman o pangyayaring kaugnay ng oras na iyon, nang hindi ipinipilit na layunin ang kahulugan.
- source_word: σκορπισθῆτε
  choice: magkakawatak-watak kayo
  rationale: Malinaw na ipinahahayag ang pagkakahiwa-hiwalay ng mga alagad; natural ito sa Filipino at pinananatili ang puwersa ng hinaharap na pangyayari.
- source_word: ἕκαστος εἰς τὰ ἴδια
  choice: bawat isa ay uuwi sa kani-kaniyang sarili
  rationale: Ang “kani-kaniyang sarili” ay sadyang hindi ganap na espesipiko upang mapanatili ang lawak ng τὰ ἴδια, na maaaring tumukoy sa sariling tahanan, lugar, mga pag-aari, o sariling kapakanan. Ginamit ang “uuwi” bilang natural na kilos patungo sa sariling sakop, at nilinaw sa talababa ang saklaw.
- source_word: κἀμὲ μόνον ἀφῆτε
  choice: at iiwan ninyo akong nag-iisa
  rationale: Direktang ipinahahayag ang pag-iwan kay Jesus, nang hindi dinaragdagan ang tindi sa salitang maaaring mangahulugang lubusang pagtatakwil.
- source_word: καὶ οὐκ εἰμὶ μόνος
  choice: Ngunit hindi ako nag-iisa
  rationale: 'Ipinakikita ng “Ngunit” ang banayad na pagsalungat: iiwan siya ng mga alagad, subalit hindi siya tunay na nag-iisa.'
- source_word: ὅτι ὁ πατὴρ μετ’ ἐμοῦ ἐστιν
  choice: sapagkat kasama ko ang Ama
  rationale: Malinaw na ibinibigay ang dahilan at pinananatili ang tiyak at relasyonal na titulong “ang Ama.”
theological_decisions:
- issue: Lawak ng kahulugan ng ἕκαστος εἰς τὰ ἴδια
  choice: bawat isa ay uuwi sa kani-kaniyang sarili[a]
  alternative: bawat isa ay uuwi sa sarili niyang tahanan
  rationale: Hindi tinutukoy ng Griyego nang tahasan ang tahanan lamang; pinananatili ng salin at talababa ang posibilidad na tumukoy ito sa sariling lugar, mga pag-aari, o kapakanan ng bawat isa.
- issue: Pag-iwan ng mga alagad at presensiya ng Ama
  choice: Ngunit hindi ako nag-iisa, sapagkat kasama ko ang Ama
  alternative: At hindi ako nag-iisa, dahil kasama ko ang Ama
  rationale: Pinananatili ang tensiyon na tunay na iiwan si Jesus ng mga alagad ngunit hindi siya nag-iisa dahil kasama niya ang Ama, nang walang idinaragdag na doktrinal na paliwanag na lampas sa talata.
- issue: Tensiyon ng nalalapit at dumating nang oras
  choice: dumarating ang oras—at dumating na
  alternative: darating ang oras, at narito na
  rationale: 'Pinananatili ang parehong aspekto ng orihinal: ang oras ay papalapit at gayunma’y dumating na, sa halip na ipantay o ipaliwanag ang dalawang pahayag.'
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ang “Tingnan ninyo” ay natural na panawag-pansin; ang mga gitling ay nagpapatingkad sa tensiyon ng “dumarating” at “dumating na.”
