id: JHN.16.10
reference: John 16:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: περὶ δικαιοσύνης δέ, ὅτι πρὸς τὸν ⸀πατέρα ὑπάγω καὶ οὐκέτι θεωρεῖτέ με·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/010.yaml
  text: and concerning righteousness[a], because I am going to the Father and you no longer see me.
translation:
  language: tl
  text: at tungkol naman sa katuwiran[a], sapagkat pupunta ako sa Ama at hindi na ninyo ako makikita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “katarungan.” Maaaring tumukoy ang salitang Griyego kapwa sa katuwiran at sa katarungan. Ginamit dito ang “katuwiran” dahil ang konteksto ay maaaring tumukoy sa pagpapatunay na si Jesus ay nasa tama sa pagpunta niya sa Ama.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ
  choice: tungkol sa
  rationale: Pinananatili nito ang pormal na ugnayan ng magkakasunod na sugnay na περὶ sa Juan 16:9–11 at natural ito sa makabagong Tagalog.
- source_word: δικαιοσύνης
  choice: katuwiran
  rationale: Saklaw ng “katuwiran” ang pagiging matuwid at ang pagkilalang nasa tama; ang “katarungan” ay inilalagay sa talababa bilang tunay na alternatibong kahulugan.
- source_word: δέ
  choice: naman
  rationale: Dito, ipinagpapatuloy ng δέ ang susunod na bahagi ng talaan sa halip na magpahayag ng matinding pagsalungat. Natural na minamarkahan ng “naman” ang paglipat na ito.
- source_word: ὅτι
  choice: sapagkat
  rationale: Ipinakikita nito ang paliwanag o dahilan na ipinahihiwatig ng ὅτι, sa isang dignidad ngunit madaling maunawaang anyo.
- source_word: πρὸς τὸν πατέρα
  choice: sa Ama
  rationale: Sa pandiwang nagsasaad ng pagpunta, likas na isinasalin ang πρός bilang “sa.” Pinananatili ang tiyak na titulong “ang Ama” nang hindi idinaragdag ang “aking,” na wala sa Griyego.
- source_word: ὑπάγω
  choice: pupunta ako
  rationale: Ang pangkasalukuyang anyo ay may hinaharap na bisa sa konteksto. Malinaw at natural na ipinahahayag ng “pupunta ako” ang nalalapit na pag-alis ni Jesus.
- source_word: οὐκέτι
  choice: hindi na
  rationale: Ito ang karaniwan at malinaw na katumbas ng paghinto o hindi na pagpapatuloy mula sa puntong iyon.
- source_word: θεωρεῖτέ με
  choice: ninyo ako makikita
  rationale: Bagaman maaaring mangahulugan ang θεωρέω ng masusing pagmamasid, ang tuwirang diwa rito ay hindi na nila makikita si Jesus. Ang hinaharap na anyo sa Tagalog ay angkop dahil sa konteksto ng nalalapit na pag-alis.
theological_decisions:
- issue: Kahulugan ng δικαιοσύνη sa isang teolohikal na mahalagang konteksto
  choice: katuwiran
  alternative: katarungan
  rationale: Ang “katuwiran” ang higit na angkop sa konteksto ng pagkilala o pagpapatunay na si Jesus ay nasa tama kaugnay ng pagpunta niya sa Ama, ngunit hindi nito ganap na inaalis ang saklaw na “katarungan,” kaya pinananatili iyon sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “katuwiran” sa halip na mas teknikal o mas makitid na pananalita, at pinanatili ang bahagyang pormal na “sapagkat” upang bumagay sa diskursong biblikal.
