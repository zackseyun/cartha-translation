  text: Jesus answered them[a], “Do you now believe?”
translation:
  language: tl
  text: Sumagot sa kanila si Jesus, “Naniniwala na ba kayo ngayon?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Ngayon ay naniniwala na kayo.” Maaaring basahin bilang pahayag ang Griyego, bagaman mas pinapaboran ng konteksto ang isang retorikal na tanong.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: Sumagot
  rationale: Likas at karaniwang salin ng pandiwang pasalaysay sa aorist na ἀποκρίνομαι sa isang pag-uusap.
- source_word: αὐτοῖς
  choice: sa kanila
  rationale: Ipinapakita ng panghalip na datibo at maramihan kung kanino sumagot si Jesus; natural sa Tagalog ang “sumagot sa kanila.”
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Ginamit ang pamantayang anyo ng pangalan sa makabagong Tagalog.
- source_word: Ἄρτι
  choice: ngayon
  rationale: Pinananatili ang diin sa kasalukuyang sandali na ipinahihiwatig ng ἄρτι.
- source_word: πιστεύετε
  choice: naniniwala
  rationale: Ang “naniniwala” ang tuwiran at natural na salin ng present active indicative na πιστεύετε sa kontekstong Juanino.
theological_decisions:
- issue: Lakas at bantas ng Ἄρτι πιστεύετε;
  choice: 'Isinalin bilang retorikal na tanong: “Naniniwala na ba kayo ngayon?”'
  alternative: “Ngayon ay naniniwala na kayo.”
  rationale: Maaaring basahin ang Griyego bilang tanong o pahayag dahil walang likas na bantas ang orihinal na mga manuskrito. Mas umaangkop sa kasunod na babala tungkol sa pagkalat ng mga alagad ang tanong, ngunit pinananatili sa talababa ang tunay na posibilidad ng pahayag.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ang “na ba” ay malinaw na naghuhudyat ng tanong at nagpapahiwatig ng puntong temporal, habang pinananatili ng “ngayon” ang tahasang kahulugan ng ἄρτι.
