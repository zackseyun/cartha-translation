revisions:
- from: Ngunit sinabi ko sa inyo ang mga bagay na ito upang, kapag dumating na ang oras ng mga iyon,[a] maalala ninyong sinabi ko ito sa inyo. Hindi ko sinabi sa inyo ang mga bagay na ito mula pa sa simula, sapagkat kasama ninyo ako noon.
  to: Ngunit nasabi ko na sa inyo ang mga bagay na ito upang, kapag dumating ang oras ng mga iyon,[a] maalala ninyong sinabi ko sa inyo ang mga iyon. Hindi ko sinabi sa inyo ang mga bagay na ito mula pa sa simula, sapagkat kasama ninyo ako noon.
  rationale: Pinalitan ang “sinabi ko” ng “nasabi ko na” upang mas maipakita ang perpektong anyo ng λελάληκα. Inalis ang “na” pagkatapos ng “dumating” upang mapanatili ang panghinaharap na contingency ng ὅταν ἔλθῃ. Isinama ang “ang mga iyon” sa sugnay ng pag-alaala upang katawanin sa pangunahing teksto ang ikalawang αὐτῶν, ngunit hindi tinukoy kung sino o ano ang tinutukoy nito. Iniwan ang iba pang pananalita dahil tapat ito sa SBLGNT at likas sa modernong Filipino Tagalog.
