  naturalness: Marangal at modernong Tagalog ang rebisyon. Ang “maalala ninyong sinabi ko sa inyo ang mga iyon” ay higit na natural kaysa “maalala ninyong sinabi ko ito sa inyo” at hindi kinakailangang magdagdag ng isang isahang “ito” na wala sa Griyego.
  terminology: Ang “mga bagay na ito,” “oras ng mga iyon,” “mula pa sa simula,” at “kasama ninyo ako” ay angkop. Pinananatili ng “mga iyon” ang hindi-tiyak na reperente ng αὐτῶν, nang hindi ito binibigyang-kahulugan bilang mga tao lamang o mga pangyayari lamang.
