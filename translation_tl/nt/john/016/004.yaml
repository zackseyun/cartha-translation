id: JHN.16.4
reference: John 16:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀλλὰ ταῦτα λελάληκα ὑμῖν ἵνα ὅταν ἔλθῃ ἡ ὥρα ⸀αὐτῶν μνημονεύητε ⸁αὐτῶν ὅτι ἐγὼ εἶπον ὑμῖν. Ταῦτα δὲ ὑμῖν ἐξ ἀρχῆς οὐκ εἶπον, ὅτι μεθ’ ὑμῶν ἤμην.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/004.yaml
  text: But I have spoken these things to you so that when their hour comes[a], you may remember that I told you. But I did not tell you these things from the beginning, because I was with you.
translation:
  language: tl
  text: Ngunit nasabi ko na sa inyo ang mga bagay na ito upang, kapag dumating ang oras ng mga iyon,[a] maalala ninyong sinabi ko sa inyo ang mga iyon. Hindi ko sinabi sa inyo ang mga bagay na ito mula pa sa simula, sapagkat kasama ninyo ako noon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “kapag dumating ang oras ng mga iyon, maalala ninyo ang mga iyon na sinabi ko sa inyo.” Dalawang beses lumilitaw sa Griyego ang αὐτῶν (“ng mga iyon/ang mga iyon”), ngunit mahirap ilahad nang ganap na natural sa Tagalog ang dalawang paglitaw nito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λελάληκα
  choice: sinabi ko
  rationale: Ang perpektong anyo ay tumutukoy sa naipahayag na ni Jesus na patuloy na mahalaga; likas sa modernong Tagalog ang “sinabi ko” sa kontekstong ito.
- source_word: ταῦτα
  choice: ang mga bagay na ito
  rationale: Tumutukoy ang pangmaramihang demonstratibo sa mga babalang kababanggit lamang at malinaw itong naipapahayag sa Tagalog.
- source_word: ἵνα
  choice: upang
  rationale: Pinananatili ang layuning ipinahahayag ng sugnay habang gumagamit ng marangal at karaniwang Tagalog.
- source_word: ὅταν ἔλθῃ ἡ ὥρα αὐτῶν
  choice: kapag dumating na ang oras ng mga iyon
  rationale: Ipinahahayag ng “kapag” ang panghinaharap na pangyayari; pinananatili ng “oras” ang posibleng diwa ng takdang panahon sa Juan, at hindi nilulutas ng “mga iyon” kung tao o mga pangyayari ang tinutukoy.
- source_word: μνημονεύητε
  choice: maalala ninyo
  rationale: Direkta at likas na salin ng paggunita sa sinabi ni Jesus.
- source_word: ὅτι ἐγὼ εἶπον ὑμῖν
  choice: na sinabi ko ito sa inyo
  rationale: Likas na ipinakikilala ng “na” ang nilalaman ng aalalahanin; ang “ito” ay tumutukoy sa mensaheng sinabi ni Jesus.
- source_word: ἐξ ἀρχῆς
  choice: mula pa sa simula
  rationale: Direktang pinananatili ang panahong saklaw mula sa pasimula.
- source_word: μεθ’ ὑμῶν ἤμην
  choice: kasama ninyo ako noon
  rationale: Ang “kasama ninyo” ay tuwirang katumbas ng relasyonal na parirala; nililinaw ng “noon” ang nakaraang kalagayan nang hindi nagdaragdag ng doktrinal na paliwanag.
theological_decisions:
- issue: Ang tinutukoy ng dalawang paglitaw ng αὐτῶν
  choice: Pinanatili sa pangunahing teksto ang unang αὐτῶν bilang “ng mga iyon,” habang natural na ipinahayag ang naaalalang nilalaman bilang “sinabi ko ito sa inyo.”
  alternative: 'Mas literal: “kapag dumating ang oras ng mga iyon, maalala ninyo ang mga iyon, na sinabi ko sa inyo.”'
  rationale: May dalawang αὐτῶν sa SBLGNT, ngunit magiging mabigat at malabo ang tahasang pag-uulit ng dalawang panghalip sa Tagalog. Pinananatili ng “mga iyon” ang tunay na kalabuan ng unang reperente, samantalang itinatala sa talababa ang ikalawang paglitaw upang hindi ito maitago.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang pag-uulit ng “mga bagay na ito,” gaya ng sa Griyego, at iniwasang tukuyin nang tiyak kung mga tao o mga pangyayari ang “mga iyon.”
