id: JHN.16.20
reference: John 16:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι κλαύσετε καὶ θρηνήσετε ὑμεῖς, ὁ δὲ κόσμος χαρήσεται· ⸀ὑμεῖς λυπηθήσεσθε, ἀλλ’ ἡ λύπη ὑμῶν εἰς χαρὰν γενήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/020.yaml
  text: Truly[a], truly, I say to you, you will weep and mourn, but the world will rejoice; you will be grieved, but your grief will become joy.
translation:
  language: tl
  text: “Tunay na tunay na sinasabi ko sa inyo, iiyak kayo at mananaghoy, ngunit magagalak ang sanlibutan. Malulungkot kayo, ngunit ang kalungkutan ninyo ay magiging kagalakan.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ang kalungkutan ninyo ay mauuwi sa kagalakan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Tunay na tunay
  rationale: Pinananatili ang mariing pag-uulit at taimtim na bisa ng pormula ni Jesus sa natural at malinaw na modernong Tagalog.
- source_word: λέγω ὑμῖν
  choice: sinasabi ko sa inyo
  rationale: Malapit sa anyo ng Griyego at pinananatili ang tuwirang pormula ng pakikipag-usap na paulit-ulit sa Juan.
- source_word: κλαύσετε
  choice: iiyak kayo
  rationale: Likas at malinaw na tumutukoy sa hayag na pag-iyak dahil sa matinding lungkot.
- source_word: θρηνήσετε
  choice: mananaghoy
  rationale: Ibinubukod ang hayag na panaghoy mula sa simpleng pag-iyak at pinananatili ang marangal na tono nang hindi nagiging teknikal.
- source_word: ὁ δὲ κόσμος
  choice: ngunit magagalak ang sanlibutan
  rationale: Ang “sanlibutan” ay malawak at pamilyar na katumbas ng κόσμος sa kontekstong Juan; hindi ito pinalawak bilang “di-sumasampalatayang sanlibutan,” kaya nananatili ang saklaw ng orihinal.
- source_word: χαρήσεται
  choice: magagalak
  rationale: Malinaw na ipinapakita ang matinding pagsalungat sa pagdadalamhati ng mga alagad at iniuugnay sa “kagalakan” sa hulihan ng talata.
- source_word: λυπηθήσεσθε
  choice: malulungkot kayo
  rationale: Natural na Tagalog para sa magiging kalagayan ng pagdadalamhati, habang pinananatili ang ugnayang leksikal sa “kalungkutan.”
- source_word: ἡ λύπη ὑμῶν
  choice: ang kalungkutan ninyo
  rationale: Pinananatili ang kaugnayan sa naunang “malulungkot” at malinaw na tinutukoy ang sariling dalamhati ng mga alagad.
- source_word: εἰς χαρὰν γενήσεται
  choice: ay magiging kagalakan
  rationale: Tuwirang inilalarawan ang pagbabagong ipinahihiwatig ng εἰς kasama ng γενήσεται, sa halip na sabihing basta lamang papalitan ang lungkot.
theological_decisions:
- issue: Gamit ng κόσμος sa Juan
  choice: sanlibutan
  alternative: sanlibutang hindi sumasampalataya; sistema ng sanlibutan
  rationale: Bagaman madalas may negatibong moral na diwa ang κόσμος sa Juan, hindi ito tahasang nililimitahan ng talata. Pinananatili ng “sanlibutan” ang malawak na salita at ang tensiyong teolohikal ng konteksto.
- issue: Pagbabago ng λύπη tungo sa χαρά
  choice: ang kalungkutan ninyo ay magiging kagalakan
  alternative: ang kalungkutan ninyo ay mauuwi sa kagalakan; ang kalungkutan ninyo ay mapapalitan ng kagalakan
  rationale: Pinananatili ng pangunahing salin ang maaaring mas malakas na diwa na ang mismong kalungkutan ay nagiging kagalakan, nang hindi nilulutas kung ito ay pagbabago ng kalagayan, bunga ng pangyayari, o kapalit na karanasan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal. Ginamit ang “mananaghoy” at “sanlibutan” bilang mga salitang pamilyar sa biblikal na pananalita ngunit nauunawaan pa rin ng karaniwang mambabasa; iniwasan ang paliwanag na denominasyonal o sobrang interpretatibong pagpapalawak.
