translation:
  language: tl
  text: Sinabi ko na sa inyo ang mga bagay na ito upang hindi kayo matisod.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “madapa” o “magdamdam.” Ang pandiwang Griyego ay maaaring tumukoy sa pagkatisod na humahantong sa kawalan ng pananampalataya o pagtalikod.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: ang mga bagay na ito
  rationale: Pinananatili ang maramihang demonstratibo na tumutukoy sa mga naunang sinabi ni Jesus.
- source_word: λελάληκα
  choice: Sinabi ko
  rationale: Likas sa makabagong Tagalog at ipinahihiwatig na naipahayag na ni Jesus ang mga salitang ito at nananatili ang bisa ng mga iyon.
- source_word: ὑμῖν
  choice: sa inyo
  rationale: Tumpak na katumbas ng datibong pangmaramihan; karaniwang ipinahahayag sa Tagalog ang bilang sa pamamagitan ng konteksto.
- source_word: ἵνα μὴ
  choice: upang hindi
  rationale: Malinaw na pinananatili ang layunin at ang negasyon ng sugnay.
- source_word: σκανδαλισθῆτε
  choice: matisod
  rationale: 'Pinananatili ang matalinghagang larawan at ang saklaw ng pandiwa: maaaring tumukoy sa pagkabuwal sa pananampalataya o pagtalikod dahil sa darating na pag-uusig, nang hindi iyon nililimitahan sa iisang interpretasyon.'
theological_decisions:
- issue: Kahulugan ng σκανδαλισθῆτε sa konteksto ng pag-uusig sa mga alagad
  choice: matisod
  alternative: mahulog sa kasalanan; mawalan ng pananampalataya; tumalikod
  rationale: 'Ang “matisod” ay malapit sa matalinghagang anyo ng Griyego at pinananatili ang tunay na kalabuan: hindi lamang simpleng pagkainis ang maaaring tukuyin nito, kundi espirituwal na pagkabuwal o pagtalikod. Nililinaw ng talababa ang bigat nito nang hindi isinasara ang saklaw.'
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang karaniwang “Sinabi ko sa inyo” sa halip na mas mabigat na ayos ng pangungusap; pinanatili ang matalinghagang “matisod” at ipinaliwanag ang mas matinding posibleng diwa sa talababa.
