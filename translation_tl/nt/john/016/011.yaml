  text: and concerning judgment[c][b][a], because the ruler of this world has been judged.
translation:
  language: tl
  text: at tungkol sa paghatol, sapagkat nahusgahan na[a] ang pinuno[b] ng mundong ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nananatiling nahusgahan.” Ang pandiwang Griyego ay nasa panahunang perfect, na nagpapahiwatig ng natapos nang paghatol na nagpapatuloy ang epekto.
    reason: lexical_alternative
