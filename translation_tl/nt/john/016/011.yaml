    text: O “tagapamahala.” Malamang na tumutukoy ito kay Satanas; ihambing ang Juan 12:31 at 14:30.
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: περὶ δὲ κρίσεως
  choice: at tungkol sa paghatol
  rationale: Ipinakikilala ng περί na may genitibo ang paksa bilang “tungkol sa,” at ang δέ ay nag-uugnay sa naunang hanay. Ang “paghatol” ang tuwirang katumbas ng κρίσις at umaayon sa pagkakasunod na “kasalanan… pagiging matuwid… paghatol.”
- source_word: ὅτι
  choice: sapagkat
  rationale: Ginagamit ang ὅτι upang ibigay ang dahilan ng paghatol; malinaw at marangal na ipinahahayag ng “sapagkat” ang ugnayang sanhi.
- source_word: ὁ ἄρχων
  choice: ang pinuno
  rationale: Ang ἄρχων ay tumutukoy sa isang namumuno o may kapangyarihan. Mas natural sa modernong Filipino ang “pinuno” kaysa “prinsipe,” at hindi ito nagpapahiwatig ng pagiging anak ng hari.
- source_word: τοῦ κόσμου τούτου
  choice: ng mundong ito
  rationale: Ang κόσμος sa Juan ay karaniwang “mundo,” kabilang ang kaayusang sumasalungat sa Diyos. Tuwirang pinananatili ng “mundong ito” ang parirala.
- source_word: κέκριται
  choice: nahatulan na
  rationale: Ang κέκριται ay perfect passive indicative ng κρίνω. Ang “nahatulan na” ay nagpapanatili sa tinig na balintiyak at nagpapahiwatig ng natapos nang paghatol na nananatili ang bisa, nang hindi ito pinakikitid sa tahasang “hinatulang maparusahan.”
theological_decisions:
- issue: Pagkakakilanlan at diwa ng “pinuno ng mundong ito”
  choice: Pinanatili sa pangunahing teksto ang titulo nang hindi tuwirang pinapangalanan si Satanas.
  alternative: “Si Satanas, ang pinuno ng mundong ito”
  rationale: Malawak na nauunawaang tumutukoy kay Satanas ang parirala sa Juan, ngunit titulo at hindi pangalang pantangi ang ginamit sa talata. Pinananatili ng salin ang sinabi mismo ng teksto; inilalagay sa talababa ang malamang na pagkakakilanlan.
- issue: Diwa ng κέκριται
  choice: “nahatulan na”
  alternative: “hinatulan nang maparusahan” o “nananatiling nahatulan”
  rationale: Pinananatili ng “nahatulan” ang saklaw ng κρίνω at ng balintiyak na anyo. Ang “na” ay likas na naghahatid sa Filipino ng natapos nang kilos na may umiiral na resulta, samantalang ang “maparusahan” ay mas makitid at interpretatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sapagkat” para sa pormal ngunit madaling maunawaang ugnayang sanhi. Pinagsama sa dalawang talababa ang magkakaugnay na alternatibong leksikal at paliwanag upang hindi maging mabigat ang maikling talata.
