  text: ⸀Λέγουσιν οἱ μαθηταὶ αὐτοῦ· Ἴδε νῦν ⸀ἐν παρρησίᾳ λαλεῖς, καὶ παροιμίαν οὐδεμίαν λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/029.yaml
  text: His disciples said[a], “Look[b], now you are speaking openly and are not speaking in any figure of speech.”
translation:
  language: tl
  text: Sinabi ng kanyang mga alagad, “Ayan, ngayon ay nagsasalita ka nang tuwiran[a] at hindi ka gumagamit ng anumang matalinghagang pananalita.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nang hayagan” o “nang buong laya.” Ang salitang Griyego ay maaaring tumukoy sa hayag, malinaw, tuwiran, o malayang pagsasalita.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “talinghaga,” “kawikaan,” o “pahayag na hindi tuwiran.” Dito, tumutukoy ito sa matalinghaga o di-tuwirang pananalita.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγουσιν
  choice: Sinabi
  rationale: Ginamit ang karaniwang nagdaang panahunan sa salaysay sa modernong Tagalog sa halip na panatilihin nang mekanikal ang historical present ng Griyego.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ng kanyang mga alagad
  rationale: Likas at malinaw na pagpapahayag ng ugnayang paari sa Tagalog.
- source_word: Ἴδε
  choice: Ayan
  rationale: Nagsisilbi itong likas na pantawag-pansin sa kasalukuyang usapan; iniiwasan ang sobrang literal at di-likas na “Tingnan mo.”
- source_word: νῦν
  choice: ngayon
  rationale: Pinananatili ang tuwirang panandang temporal na nagpapahiwatig ng napansing pagbabago sa paraan ng pagsasalita ni Jesus.
- source_word: ἐν παρρησίᾳ
  choice: nang tuwiran
  rationale: Sa kaibahan nito sa παροιμία, tumutukoy ito sa hayag, malinaw, o tahasang paraan ng pagsasalita, hindi pangunahin sa tapang.
- source_word: λαλεῖς
  choice: nagsasalita ka
  rationale: Natural na Tagalog para sa kasalukuyang kilos na tinutukoy ng mga alagad.
- source_word: παροιμίαν
  choice: matalinghagang pananalita
  rationale: Sa konteksto ng Juan, tumutukoy ito sa matalinghaga, di-tuwiran, o natatakpang pahayag, hindi lamang sa isang kawikaan.
- source_word: οὐδεμίαν
  choice: anumang
  rationale: Kasama ng “hindi,” natural nitong naipapahayag ang ganap na pagtanggi sa Griyego.
- source_word: λέγεις
  choice: gumagamit
  rationale: Sa Tagalog, likas sabihing “gumagamit ng matalinghagang pananalita”; pinananatili nito ang diwa nang hindi nagiging pilit ang literal na “nagsasabi ng.”
theological_decisions:
- issue: Kahulugan ng παρρησία bilang kaibahan ng παροιμία
  choice: Inilalarawan si Jesus na nagsasalita nang tuwiran o malinaw sa halip na gumamit ng matalinghaga o di-tuwirang pananalita.
  alternative: Inilalarawan si Jesus na nagsasalita nang buong tapang o lantaran.
  rationale: Ang agarang paghahambing sa παροιμίαν οὐδεμίαν ay pumapabor sa linaw at pagiging tuwiran ng pananalita. Gayunman, itinatala sa talababa ang saklaw na “hayagan” at “buong laya” upang hindi paliitin nang di-kailangan ang salitang Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “Ayan” bilang buhay at karaniwang pantawag-pansin, “nang tuwiran” para sa malinaw na kaibahan sa matalinghagang pananalita, at iniwasan ang makaluma o sobrang literal na mga parirala.
