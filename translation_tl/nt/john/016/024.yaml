  naturalness: Malinaw, natural, at marangal ang modernong Filipino Tagalog. Ang “Humingi kayo, at tatanggap kayo” ay tuwiran at angkop sa rehistro. Ang “upang malubos ang inyong kagalakan” ay idiomatiko at napananatili ang imahen ng kapuspusan.
