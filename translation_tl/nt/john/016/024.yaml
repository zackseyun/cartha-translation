id: JHN.16.24
reference: John 16:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἕως ἄρτι οὐκ ᾐτήσατε οὐδὲν ἐν τῷ ὀνόματί μου· αἰτεῖτε καὶ λήμψεσθε, ἵνα ἡ χαρὰ ὑμῶν ᾖ πεπληρωμένη.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/024.yaml
  text: Until now you have asked for nothing in my name[a]. Ask, and you will receive[c][b], so that your joy may be full.
translation:
  language: tl
  text: Hanggang ngayon, hindi pa kayo humingi ng anuman sa pangalan ko[a]. Humingi kayo[b], at tatanggap kayo, upang malubos ang inyong kagalakan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “sa pangalan ko” ay maaaring tumukoy sa paghinging may kaugnayan sa persona, awtoridad, at misyon ni Jesus; pinanatili rito ang literal na parirala sa halip na limitahan ito sa iisang paliwanag.
    reason: lexical_alternative
  - marker: b
    text: O “Patuloy kayong humingi.” Maaaring magpahiwatig sa kontekstong ito ang present imperative na Griyego ng nagpapatuloy o paulit-ulit na pagkilos.
    reason: lexical_alternative
  - marker: c
    text: O “upang maging ganap ang inyong kagalakan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως ἄρτι
  choice: Hanggang ngayon
  rationale: Likas na salin ng pariralang tumutukoy sa panahong umaabot hanggang sa kasalukuyang sandali.
- source_word: οὐκ ᾐτήσατε οὐδὲν
  choice: hindi pa kayo humingi ng anuman
  rationale: Sa konteksto ng “Hanggang ngayon,” malinaw at natural na ipinahahayag nito na hanggang sa sandaling iyon ay wala silang hiniling; pinananatili rin ng “humingi” ang diwa ng paghingi ng isang bagay, hindi lamang pagtatanong.
- source_word: ἐν τῷ ὀνόματί μου
  choice: sa pangalan ko
  rationale: Pinananatili ang mahalaga at malawak na sawikaing Juanino nang hindi ito nililimitahan sa iisang paliwanag gaya ng “sa ilalim ng awtoridad ko” o “para sa akin.”
- source_word: αἰτεῖτε
  choice: Humingi kayo
  rationale: Natural na pautos sa makabagong Tagalog; hindi nito labis na tinutukoy kung minsanan o nagpapatuloy ang kilos, bagaman maaaring taglayin ng Griyegong present imperative ang paulit-ulit o patuloy na diwa.
- source_word: λήμψεσθε
  choice: tatanggap kayo
  rationale: Tumpak at marangal na katumbas sa konteksto ng panalangin at ng tugon sa paghingi.
- source_word: ἵνα
  choice: upang
  rationale: Malinaw na naghahayag ng layunin o nilalayong resulta at angkop sa dignidad ng talata.
- source_word: ἡ χαρὰ ὑμῶν
  choice: ang inyong kagalakan
  rationale: Natural na anyong paari sa Tagalog at pinananatili ang marangal na rehistro.
- source_word: ᾖ πεπληρωμένη
  choice: malubos
  rationale: Ipinahahayag ang kalagayang dinala sa kapuspusan o kaganapan, habang nananatiling natural sa Tagalog at umaayon sa larawan ng pagpuno sa pananalita ni Juan.
theological_decisions:
- issue: Kahulugan ng paghingi “sa pangalan ko”
  choice: Panatilihin ang literal na pariralang “sa pangalan ko.”
  alternative: “sa ilalim ng awtoridad ko,” “bilang kinatawan ko,” o “kaisa ko”
  rationale: Mayaman at sadyang malawak ang parirala kaugnay ng persona, awtoridad, at misyon ni Jesus. Ang literal na salin ay hindi nagpapasya para sa mambabasa sa iisang paliwanag.
- issue: Kapuspusan ng kagalakan
  choice: “upang malubos ang inyong kagalakan”
  alternative: “upang maging ganap ang inyong kagalakan”
  rationale: Pinananatili ng “malubos” ang larawan ng pagdadala sa kapuspusan na nasa πεπληρωμένη, sa halip na paliitin ito sa abstraktong pagiging ganap lamang.
translation_notes:
  register: Makabagong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “kayo/inyong” para sa maramihang ikalawang panauhan ng Griyego. Iniwasan ang sobrang teknikal o denominasyonal na pagpapaliwanag sa pangunahing teksto.
