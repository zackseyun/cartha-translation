translation:
  language: tl
  text: tungkol sa kasalanan, sapagkat[a] hindi sila sumasampalataya sa akin;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “tungkol sa kasalanan: na hindi sila sumasampalataya sa akin.” Maaaring isalin sa alinmang paraan ang Griyegong pangatnig, ngunit mas malinaw na ipinapakita ng “sapagkat” ang paliwanag na diwa nito sa konteksto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ
  choice: tungkol sa
  rationale: Likas at malinaw na panandang paksa sa modernong Tagalog, at napapanatili nito ang magkakatulad na balangkas ng mga talata 9–11.
- source_word: ἁμαρτίας
  choice: kasalanan
  rationale: Pinananatili ang pang-isahang abstraktong kategorya sa Griyego nang hindi ito ginagawang mga indibidwal na kasalanan o pangkalahatang pagkamakasalanan.
- source_word: μέν
  choice: —
  rationale: Panandang diskurso ito para sa unang bahagi ng serye sa mga talata 9–11. Hindi kailangan ng hiwalay na katumbas sa Tagalog; naipahihiwatig ang tungkulin nito ng ayos at bantas.
- source_word: ὅτι
  choice: sapagkat
  rationale: 'Malinaw nitong ipinapahayag ang sanhi o paliwanag na puwersa ng sugnay: ang tinutukoy na kasalanan sa kontekstong ito ay kaugnay ng hindi nila pagsampalataya kay Jesus.'
- source_word: οὐ πιστεύουσιν
  choice: hindi sila sumasampalataya
  rationale: Karaniwan at angkop na biblikal ngunit nauunawaang Tagalog para sa nagpapatuloy na katotohanan ng kawalan ng pananampalataya.
- source_word: εἰς ἐμέ
  choice: sa akin
  rationale: Kasama ng 'sumasampalataya,' natural nitong ipinapahayag ang personal na pagtitiwala na nakatuon kay Jesus, nang hindi pilit na ginagaya ang literal na Griyegong pang-ukol.
theological_decisions:
- issue: Ang saklaw ng kasalanang tinutukoy sa talata
  choice: Iniuugnay ng talata ang 'kasalanan' sa hindi nila pagsampalataya kay Jesus bilang tiyak na pagpapahayag nito sa kontekstong ito.
  alternative: Tumutukoy ito sa pangkalahatang pagkamakasalanan ng tao, at halimbawa lamang ang kawalan ng pananampalataya.
  rationale: Tuwirang ipinapaliwanag ng sugnay na may ὅτι ang naunang 'tungkol sa kasalanan.' Hindi pinalalawak ng salin ang pahayag tungo sa isang doktrinang hindi tahasang sinasabi rito.
- issue: Kahulugan ng ὅτι
  choice: Isinalin bilang 'sapagkat,' na nagpapakita ng paliwanag o dahilan.
  alternative: 'Maaaring isalin bilang ''na,'' kaya: ''tungkol sa kasalanan: na hindi sila sumasampalataya sa akin.'''
  rationale: Mas natural sa Tagalog at mas malinaw sa konteksto ang paliwanag na puwersa ng 'sapagkat,' ngunit tunay na posibilidad sa Griyego ang 'na' at kaya ito ay itinala sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Pinanatili ang maikling anyo at parallel na estruktura ng diskurso. Ginamit ang 'sumasampalataya' sa halip na mas kolokyal na 'naniniwala' upang maipahayag ang personal na pagtitiwalang saklaw ng πιστεύω εἰς.
