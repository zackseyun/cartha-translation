id: JHN.16.30
reference: John 16:30
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: νῦν οἴδαμεν ὅτι οἶδας πάντα καὶ οὐ χρείαν ἔχεις ἵνα τίς σε ἐρωτᾷ· ἐν τούτῳ πιστεύομεν ὅτι ἀπὸ θεοῦ ἐξῆλθες.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/030.yaml
  text: Now we know that you know all things and have no need that anyone should question you[a]. By this we believe that you came from God.
translation:
  language: tl
  text: Ngayon ay alam naming alam mo ang lahat ng bagay, at hindi mo kailangang may magtanong sa iyo[a]. Dahil dito, naniniwala kaming nagmula ka sa Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “usisain ka ng sinuman.” Ang pandiwang Griyego ay maaaring mangahulugang “magtanong” o “usisain.” Sa kontekstong ito, kinikilala ng mga alagad na alam ni Jesus ang nais nilang itanong kahit hindi nila ito sabihin.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν
  choice: Ngayon
  rationale: Tumutukoy sa kasalukuyang pagkaunawa ng mga alagad at likas, maikli, at malinaw sa Tagalog.
- source_word: οἴδαμεν
  choice: alam namin
  rationale: Ang anyong οἶδα ay may pangkasalukuyang diwa; tuwirang ipinapahayag ng 'alam namin' ang kahulugan.
- source_word: οἶδας πάντα
  choice: alam mo ang lahat ng bagay
  rationale: Pinananatili ang malawak at komprehensibong saklaw ng πάντα nang hindi dinaragdagan ang pahayag.
- source_word: οὐ χρείαν ἔχεις
  choice: hindi mo kailangang
  rationale: Mas natural sa modernong Tagalog kaysa sa literal na nominal na pariralang 'wala kang pangangailangan,' habang tapat sa diwa.
- source_word: ἵνα τίς σε ἐρωτᾷ
  choice: tanungin ka ng sinuman
  rationale: Maaaring mangahulugan ang ἐρωτάω ng pagtatanong o pag-uusisa. Ang payak na 'tanungin' ay natural at pinananatili ang lawak ng Griyego.
- source_word: ἐν τούτῳ
  choice: Dahil dito
  rationale: Ipinahihiwatig na ang naunang pahayag ang batayan ng paniniwala ng mga alagad.
- source_word: πιστεύομεν
  choice: naniniwala kami
  rationale: Angkop na tuwirang salin sa konteksto ng pagpapahayag ng paniniwala.
- source_word: ἀπὸ θεοῦ
  choice: sa Diyos
  rationale: Sa pariralang 'nagmula ka sa Diyos,' tuwirang pinananatili ang θεοῦ bilang Diyos at hindi ito pinapalitan ng mas tiyak na 'Ama.'
- source_word: ἐξῆλθες
  choice: nagmula ka
  rationale: Likas sa Tagalog at malinaw na nagpapahayag ng pinagmulan o misyong mula sa Diyos; mas angkop dito kaysa sa literal na 'lumabas ka.'
theological_decisions:
- issue: Lakas ng pahayag na οἶδας πάντα tungkol kay Cristo
  choice: alam mo ang lahat ng bagay
  alternative: alam mo ang lahat, kaya ikaw ay omnisiyente
  rationale: Pinananatili ang mismong pahayag ng mga alagad at ang bigat nitong kristolohikal nang hindi nagdaragdag ng tahasang doktrinal na paliwanag na wala sa talata.
- issue: Kahulugan ng ἀπὸ θεοῦ ἐξῆλθες
  choice: nagmula ka sa Diyos
  alternative: nagmula ka sa Ama
  rationale: Diyos ang tahasang nasa Griyego. Hindi ito nililimitahan sa 'Ama,' kahit maaaring kaugnay iyon ng mas malawak na konteksto.
- issue: Ugnayan ng pagkaalam ni Jesus at ng pagtatanong ng iba
  choice: hindi mo kailangang tanungin ka ng sinuman
  alternative: hindi mo kailangang may magtanong sa iyo upang malaman mo ang iniisip nila
  rationale: Pinananatili ang siksik at bahagyang bukas na pagkakabuo ng Griyego; hindi idinaragdag sa pangunahing teksto ang paliwanag tungkol sa di-binibigkas na mga iniisip.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang karaniwang anyong 'kami' dahil kinakausap ng mga alagad si Jesus at hindi siya kabilang sa nagsasalitang pangkat. Pinili ang natural na 'hindi mo kailangang' at 'nagmula ka' sa halip na pilit na literal na mga parirala.
