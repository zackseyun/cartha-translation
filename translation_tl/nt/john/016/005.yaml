id: JHN.16.5
reference: John 16:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: νῦν δὲ ὑπάγω πρὸς τὸν πέμψαντά με καὶ οὐδεὶς ἐξ ὑμῶν ἐρωτᾷ με· Ποῦ ὑπάγεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/005.yaml
  text: But now I am going to the one who sent me, and none of you asks me, ‘Where are you going?’
translation:
  language: tl
  text: Ngunit ngayon, pupunta ako sa nagsugo sa akin, at walang sinuman sa inyo ang nagtatanong sa akin, “Saan ka pupunta?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ
  choice: Ngunit ngayon
  rationale: Pinananatili nito ang pagsalungat na ipinahihiwatig ng δέ at natural na inililipat ang usapan sa kasalukuyang sinasabi ni Jesus.
- source_word: ὑπάγω
  choice: pupunta ako
  rationale: Ang aspektong pangkasalukuyan ng pandiwa ay tumutukoy rito sa nalalapit na pagpunta; natural sa modernong Tagalog ang anyong panghinaharap at hindi nito nililimitahan ang kahulugan sa simpleng pag-alis.
- source_word: πρὸς τὸν πέμψαντά με
  choice: sa nagsugo sa akin
  rationale: Natural na isinasalin ang articular participle bilang isang taong tinutukoy sa pamamagitan ng ginawa niya. Hindi tahasang idinaragdag ang “Ama,” sapagkat wala iyon sa mismong sugnay.
- source_word: πέμψαντά
  choice: nagsugo
  rationale: Ang “nagsugo” ay angkop sa tema ng misyon sa Juan at mas malinaw sa kontekstong ito kaysa sa pangkaraniwang “nagpadala,” nang hindi nagdaragdag ng tiyak na titulong teolohikal.
- source_word: οὐδεὶς ἐξ ὑμῶν
  choice: walang sinuman sa inyo
  rationale: Tuwiran at natural nitong pinananatili ang mariing pagkakaila at ang partitive na diwa ng parirala.
- source_word: ἐρωτᾷ με
  choice: nagtatanong sa akin
  rationale: Ipinahihiwatig dito ng ἐρωτάω ang pagtatanong, hindi ang paghiling; ang aspektong di-ganap ay angkop sa kasalukuyang kalagayang inilalarawan.
- source_word: Ποῦ ὑπάγεις;
  choice: Saan ka pupunta?
  rationale: Ito ang natural na modernong Tagalog para sa tuwirang tanong at pinananatili ang direksiyonal na diwa ng ὑπάγω.
theological_decisions:
- issue: Pagkakakilanlan ng “nagsugo sa akin”
  choice: Panatilihin bilang “sa nagsugo sa akin” nang hindi tahasang idinaragdag ang “Ama.”
  alternative: sa Ama na nagsugo sa akin
  rationale: Bagaman malinaw sa mas malawak na teolohiya ng Juan ang tinutukoy, articular participle lamang ang nasa Griyego at hindi tahasang binabanggit ang Ama sa sugnay na ito.
- issue: Tensiyon sa pahayag na walang nagtatanong kung saan siya pupunta
  choice: Isalin nang tuwiran bilang “walang sinuman sa inyo ang nagtatanong sa akin.”
  alternative: wala na sa inyo ang nagtatanong sa akin
  rationale: Hindi idinagdag ang “na” upang lutasin ang wari’y tensiyon sa mga naunang tanong ng mga alagad; pinananatili ng salin ang mismong pahayag at retorikal na diin ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural, tuwiran, at marangal. Ginamit ang “nagsugo” para sa Johannine mission language at “pupunta” para sa idiomatikong pagpapahayag ng nalalapit na pagkilos.
