  text: ἡ γυνὴ ὅταν τίκτῃ λύπην ἔχει, ὅτι ἦλθεν ἡ ὥρα αὐτῆς· ὅταν δὲ γεννήσῃ τὸ παιδίον, οὐκέτι μνημονεύει τῆς θλίψεως διὰ τὴν χαρὰν ὅτι ἐγεννήθη ἄνθρωπος εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/021.yaml
  text: When a woman is giving birth[a], she has sorrow because her hour has come; but when she has given birth to the child, she no longer remembers the distress because of the joy that a child has been born into the world.
translation:
  language: tl
  text: Kapag nanganganak ang isang babae, nalulungkot siya sapagkat dumating na ang oras niya. Ngunit kapag naipanganak na niya ang bata, hindi na niya naaalaala ang paghihirap dahil sa galak na dulot ng pagsilang ng isang tao[a] sa mundo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “isang lalaki.” Ang salitang Griyegong ἄνθρωπος ay maaaring mangahulugang “lalaki” o, gaya rito, “tao” sa pangkalahatan; hindi nito espesipikong tinutukoy ang kasarian ng bata.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: isang babae
  rationale: Sa pangkalahatang paglalarawan tungkol sa panganganak, 'babae' ang payak at angkop na kahulugan, hindi 'asawa.'
- source_word: ὅταν τίκτῃ
  choice: kapag nanganganak
  rationale: Ipinahahayag ng present subjunctive kasama ng ὅταν ang pangkalahatan at nagpapatuloy na kalagayan; natural itong naipapahayag sa Tagalog bilang 'kapag nanganganak.'
- source_word: λύπην ἔχει
  choice: nalulungkot siya
  rationale: Saklaw ng λύπη ang lungkot o dalamhati, hindi lamang pisikal na sakit, at iniuugnay nito ang larawan sa temang lungkot na nagiging galak.
- source_word: ἡ ὥρα αὐτῆς
  choice: ang oras niya
  rationale: Pinananatili ang 'oras' upang maipahayag ang takdang sandali ng panganganak at ang posibleng tematikong alingawngaw ng ὥρα sa Juan.
- source_word: γεννήσῃ τὸ παιδίον
  choice: naipanganak na niya ang bata
  rationale: Ipinakikita ng aorist subjunctive ang natapos na pangyayari; malinaw ito sa Tagalog sa paggamit ng 'naipanganak na.'
- source_word: οὐκέτι μνημονεύει
  choice: hindi na niya naaalaala
  rationale: Tuwirang inililipat ang diwa ng hindi na pag-alaala nang hindi pinalalabis ang pahayag.
- source_word: τῆς θλίψεως
  choice: ang paghihirap
  rationale: Sa konteksto ng panganganak, tumutukoy ang θλῖψις sa matinding hirap o dalamhati ng karanasan; ang 'paghihirap' ay natural at hindi nag-aangkat ng teknikal na eskatolohikal na diwa.
- source_word: διὰ τὴν χαράν
  choice: dahil sa galak
  rationale: Ipinahahayag ng διά kasama ng accusative ang sanhi; malinaw at likas sa Tagalog ang 'dahil sa galak.'
- source_word: ὅτι ἐγεννήθη
  choice: na ... nang isinilang
  rationale: Ipinakikita nito ang nilalaman at dahilan ng galak, habang ang 'nang' ay nagpapahayag na naganap na ang pagsilang.
- source_word: ἄνθρωπος
  choice: isang tao
  rationale: Ang ἄνθρωπος ay pangkalahatan dito at hindi tumutukoy sa lalaking sanggol lamang. Pinananatili ng 'isang tao' ang kakaibang diin ng Griyego sa pagdating ng isang tao sa mundo.
- source_word: εἰς τὸν κόσμον
  choice: sa mundo
  rationale: Natural na Tagalog ito para sa pagkapanganak ng isang tao 'into the world,' nang walang dagdag na teolohikal na pagpapakahulugan.
theological_decisions:
- issue: Pangkalahatang kahulugan ng ἄνθρωπος
  choice: isang tao
  alternative: isang bata
  rationale: Bagaman ang tinutukoy sa konteksto ay bagong silang na bata, ang mismong salitang ἄνθρωπος ay 'tao' at hindi espesipikong lalaki. Pinananatili ng salin ang pangkalahatang pagtukoy sa buhay ng tao nang hindi ipinahihiwatig na lalaki ang sanggol.
- issue: Tematikong halaga ng ἡ ὥρα αὐτῆς
  choice: ang oras niya
  alternative: ang panahon niya
  rationale: Ang literal at natural na 'oras' ay tumutukoy sa takdang sandali ng panganganak at hindi isinasara ang posibleng tematikong ugnayan sa paggamit ni Juan ng 'oras.'
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang 'nanganganak,' 'nalulungkot,' at 'paghihirap,' habang pinanatili ang 'oras' at 'isang tao' upang maingatan ang leksikal at tematikong anyo ng Griyego.
