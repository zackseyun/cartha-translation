  source_fidelity: 'Tapat ang salin sa Griyego: malinaw ang pasalungat na ἀλλ’, ang sanhing ὅτι (“dahil”), ang maramihang ταῦτα, at ang diwang perpekto ng λελάληκα at πεπλήρωκεν. Ang “napuno ng kalungkutan ang inyong puso” ay natural na Tagalog na naghahatid ng larawang ang kalungkutan ay lubos nang pumuno sa puso.'
  naturalness: Natural, malinaw, at marangal ang “Ngunit dahil sinabi ko sa inyo ang mga bagay na ito, napuno ng kalungkutan ang inyong puso.” Bagaman mas payak ang “mga ito” sa ilang konteksto, ang “mga bagay na ito” ay katanggap-tanggap at angkop sa masinop na rehistrong pampanitikan.
  terminology: Ang “kalungkutan” ay angkop para sa λύπη sa taimtim na konteksto. Wastong pinanatili ang isahang “puso” kasabay ng maramihang “inyong,” at ang talababa ay maingat na nagbibigay ng lehitimong alternatibong “mga puso” nang hindi nagtatakda ng labis na pagpapakahulugan.
