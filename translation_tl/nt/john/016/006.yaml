  text: But because I have spoken these things to you[a], sorrow has filled your heart.
translation:
  language: tl
  text: Ngunit dahil sinabi ko sa inyo ang mga bagay na ito, napuno ng kalungkutan ang inyong puso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang inyong mga puso.” Isahan ang “puso” sa Griyego, ngunit maramihan ang “inyong”; maaaring inilalarawan nito ang magkakasamang kalungkutan sa kalooban ng mga alagad.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Ngunit
  rationale: Likas at marangal na panandang pasalungat na nag-uugnay sa naunang sinabi.
- source_word: ὅτι
  choice: dahil
  rationale: Ipinapakilala rito ang sanhi ng kalungkutan ng mga alagad, hindi lamang ang nilalaman ng sinabi.
- source_word: ταῦτα
  choice: ang mga bagay na ito
  rationale: Pinananatili ang maramihang demonstratibo at ang pagtukoy sa mga paksang kasasabi lamang ni Jesus.
- source_word: λελάληκα
  choice: sinabi ko
  rationale: Sa natural na Tagalog, ang aspektong perpektibo ng “sinabi ko” ay mahusay na naghahayag ng natapos na pagsasalitang may epekto sa kasalukuyan; mas likas ito rito kaysa “ipinagsalita ko.”
- source_word: ὑμῖν
  choice: sa inyo
  rationale: Tumpak na ipinapahayag ang datibong maramihan at malinaw na ang kausap ay higit sa isa.
- source_word: ἡ λύπη
  choice: kalungkutan
  rationale: Karaniwang makabagong salitang Tagalog para sa malalim na dalamhati o lungkot at angkop sa taimtim na tono.
- source_word: πεπλήρωκεν
  choice: napuno
  rationale: Pinananatili ang konkretong larawan ng πληρόω na “punuin,” sa halip na gumamit ng higit na interpretibong “dinaig.”
- source_word: ὑμῶν τὴν καρδίαν
  choice: ang inyong puso
  rationale: Pinananatili ang isahang “puso” kasama ng maramihang “inyong,” na natural sa Tagalog at maaaring maglarawan sa iisang kalagayang panloob na pinagsasaluhan ng pangkat.
theological_decisions:
- issue: Isahang kolektibong “puso” o maramihang “mga puso”
  choice: ang inyong puso
  alternative: ang inyong mga puso
  rationale: Isahan ang καρδίαν ngunit maramihan ang ὑμῶν. Pinananatili ng salin ang tunay na anyo at posibleng kolektibong diwa ng Griyego nang hindi itinatanggi ang distributibong pagkaunawa.
translation_notes:
  register: Makabagong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “Ngunit” para sa taimtim na salungatan at “napuno ng kalungkutan” upang mapanatili ang larawan at ayos ng orihinal nang hindi nagiging asiwa.
