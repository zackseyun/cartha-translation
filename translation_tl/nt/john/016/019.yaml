    issue: Ang “kaya sinabi niya” ay nagdaragdag ng sanhi-bungang ugnayan.
    rationale: Καὶ εἶπεν αὐτοῖς ay “at sinabi niya sa kanila”; hindi ipinahihiwatig ng teksto na dahil gusto nilang magtanong ay saka siya nagsalita.
  - severity: medium
