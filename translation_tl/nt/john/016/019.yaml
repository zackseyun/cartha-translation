id: JHN.16.19
reference: John 16:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀ἔγνω Ἰησοῦς ὅτι ἤθελον αὐτὸν ἐρωτᾶν, καὶ εἶπεν αὐτοῖς· Περὶ τούτου ζητεῖτε μετ’ ἀλλήλων ὅτι εἶπον· Μικρὸν καὶ οὐ θεωρεῖτέ με, καὶ πάλιν μικρὸν καὶ ὄψεσθέ με;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/019.yaml
  text: Jesus knew that they wanted to ask him[a], and he said to them, “Are you discussing this with one another, that I said, ‘A little while, and you no longer see me, and again a little while[c][b], and you will see me’?”
translation:
  language: tl
  text: 'Alam ni Jesus na gusto nila siyang tanungin, at sinabi niya sa kanila, “Pinag-uusapan ba ninyo sa isa’t isa ang sinabi ko: ‘Kaunting panahon na lang at hindi na ninyo ako makikita; at muli, sa kaunting panahon, makikita ninyo ako’?[a][b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dahil sinabi ko.” Maaaring ipakilala ng salitang Griyego ang nilalaman ng pinag-uusapan o ang dahilan nito.
    reason: alternative_reading
  - marker: b
    text: 'Dalawang magkaibang pandiwa para sa pagkakita ang ginamit sa Griyego: una, θεωρέω (“masdan/obserbahan”), at pagkatapos, ὁράω (“makita”). Isinalin dito ang dalawa bilang “makikita” upang mapanatili ang natural na pagtutumbas ng mga sugnay.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνω
  choice: Alam
  rationale: Likas at tuwirang katumbas sa Filipino para sa pagkaalam ni Jesus sa balak ng mga alagad.
- source_word: ἤθελον αὐτὸν ἐρωτᾶν
  choice: gusto nila siyang tanungin
  rationale: Natural na modernong Filipino para sa nagpapatuloy na hangarin nilang magtanong sa kaniya.
- source_word: Περὶ τούτου ζητεῖτε μετ’ ἀλλήλων
  choice: Ito ba ang pinag-uusapan ninyo sa isa’t isa
  rationale: Sa konteksto, ang ζητεῖτε kasama ng μετ’ ἀλλήλων ay tumutukoy sa pagsisikap nilang linawin sa isa’t isa ang sinabi ni Jesus, hindi lamang sa literal na ‘paghahanap.’
- source_word: ὅτι εἶπον
  choice: ang sinabi ko na
  rationale: Ipinakikilala nito nang natural ang nilalaman ng kanilang pinag-uusapan, habang pinananatili sa talababa ang posibleng panandang sanhi.
- source_word: Μικρὸν
  choice: Kaunting panahon na lang
  rationale: Ipinahahayag ang maikling pagitan ng panahon sa malinaw at idiomatikong Filipino.
- source_word: οὐ θεωρεῖτέ με
  choice: hindi na ninyo ako makikita
  rationale: Sa temporal na balangkas ng μικρόν, likas na ipinahahayag sa Filipino ang nalalapit na paghinto ng pagkakita; ang hinaharap na anyo ay hinihingi ng natural na Filipino bagaman pangkasalukuyan ang anyong Griyego.
- source_word: πάλιν μικρὸν
  choice: pagkaraan ng kaunting panahon
  rationale: Ipinakikita nang malinaw ang kasunod na maikling pagitan; ang πάλιν ay naipahihiwatig sa muling mangyayaring pagkakita.
- source_word: ὄψεσθέ με
  choice: makikita ninyo ako
  rationale: Natural na salin ng future form ng ὁράω at mahusay na kaparis ng unang sugnay.
theological_decisions:
- issue: Pagkakaiba ng θεωρέω at ὁράω sa magkatambal na mga sugnay
  choice: Gamitin ang ‘makikita’ para sa dalawang pandiwa sa pangunahing teksto.
  alternative: Pag-ibahin bilang ‘mamamasdan’ at ‘makikita.’
  rationale: Ang diin ng konteksto ay ang pansamantalang pagkawala at muling pagkakita kay Jesus, hindi ang tiyak na teolohikal na pagkakaiba ng dalawang uri ng pagtingin. Itinatala sa talababa ang leksikal na pagkakaiba.
- issue: Gamit ng ὅτι pagkatapos ng tanong
  choice: 'Unawain ito bilang tagapagpakilala ng nilalaman: ‘ang sinabi ko na.’'
  alternative: 'Unawain bilang sanhi: ‘dahil sinabi ko.’'
  rationale: Parehong posible sa Griyego. Mas maayos na inuugnay ng napiling salin ang mismong pahayag ni Jesus sa paksa ng usapan, habang pinananatili sa talababa ang alternatibo.
- issue: Lakas ng tanong ni Jesus
  choice: 'Isalin bilang tunay na tanong: ‘Ito ba ang pinag-uusapan ninyo...?’'
  alternative: 'Isalin bilang pahayag: ‘Pinag-uusapan ninyo...’'
  rationale: Pinananatili nito ang mapanuring anyo ng tanong nang hindi nagdaragdag ng pagsaway o ibang interpretibong diin.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignificado, at angkop sa pampublikong pagbasa. Ginamit ang ‘pinag-uusapan’ sa halip na mas literal ngunit malabong ‘hinahanap,’ at iniwasan ang sinauna o labis na pormal na pananalita.
