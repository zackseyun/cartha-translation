  to: 'Alam ni Jesus na gusto nila siyang tanungin, at sinabi niya sa kanila, “Pinag-uusapan ba ninyo sa isa’t isa ang sinabi ko: ‘Kaunting panahon na lang at hindi na ninyo ako makikita; at muli, sa kaunting panahon, makikita ninyo ako’?[a][b]”'
  rationale: Pinalitan ang “kaya” ng “at” upang hindi magdagdag ng ugnayang sanhi-bunga. Inayos ang tanong upang maging mas malinaw at idiomatiko sa Filipino. Idinagdag ang “muli” upang tahasang maisalin ang πάλιν, habang pinananatili ang temporal na diwa ng μικρόν at ang pagkakatulad ng dalawang sugnay.
