  source_fidelity: 'May maliit ngunit mahalagang dagdag sa draft: ang “kaya” ay nagsasaad ng ugnayang sanhi-bunga na wala sa simpleng καί (“at”) ng Griyego. Hindi rin tahasang naipapahayag ng “pagkaraan ng kaunting panahon” ang πάλιν (“muli”). Iniaayos ang mga ito nang hindi pinipilit ang aspeto ng mga pandiwa sa paraang hindi natural sa Filipino.'
  naturalness: 'Ang binagong pangungusap ay mas tuwiran at natural sa modernong Filipino: ang tanong ay nagsisimula sa “Pinag-uusapan ba ninyo,” at ang tuwirang sipi ay malinaw na ikinakabit sa “ang sinabi ko.”'
  terminology: Nananatili ang “Jesus,” “makikita,” at ang magalang ngunit pangkalahatang register. Ang “muli” ay ibinabalik upang katawanin ang πάλιν. Pinananatili ang talababa tungkol sa dalawang pandiwa ng pagkakita at sa posibleng sanhi/ nilalaman na gamit ng ὅτι.
  issues:
