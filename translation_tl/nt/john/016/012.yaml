id: JHN.16.12
reference: John 16:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἔτι πολλὰ ἔχω ⸂ὑμῖν λέγειν⸃, ἀλλ’ οὐ δύνασθε βαστάζειν ἄρτι·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/012.yaml
  text: I still have many things to say to you[a], but you are not able to bear them now.
translation:
  language: tl
  text: Marami pa akong sasabihin sa inyo, ngunit hindi ninyo kayang pasanin ang mga iyon ngayon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hindi ninyo ito kayang tanggapin ngayon” o “hindi ninyo kayang tiisin ang mga iyon ngayon.” Ang pandiwang Griyego ay maaaring mangahulugang magdala, magpasan, o magtiis.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι πολλὰ
  choice: Marami pa
  rationale: Ang pang-abay na ἔτι at substantibong neuter plural na πολλὰ ay likas na naipapahayag sa Tagalog bilang “marami pa,” na nagpapakitang may karagdagang mga bagay na sasabihin si Jesus.
- source_word: ἔχω ὑμῖν λέγειν
  choice: akong sasabihin sa inyo
  rationale: Sa kontekstong ito, ang ἔχω kasama ng infinitive ay tumutukoy sa mga bagay na nalalabi pang sabihin. Ang “akong sasabihin sa inyo” ay natural sa modernong Tagalog at pinananatili ang tuwirang ugnayan ng nagsasalita at ng mga kausap.
- source_word: ἀλλ’
  choice: ngunit
  rationale: Ang “ngunit” ay malinaw at marangal na panandang pasalungat, angkop sa register ng salin.
- source_word: οὐ δύνασθε
  choice: hindi ninyo kayang
  rationale: Tuwirang ipinahahayag nito ang kawalan ng kasalukuyang kakayahan na nasa δύνασθε, nang hindi ipinapaliwanag kung ang kakulangang iyon ay pangkaisipan, emosyonal, o espirituwal.
- source_word: βαστάζειν
  choice: pasanin
  rationale: Pinananatili ng “pasanin” ang talinghaga ng pagdadala ng mabigat na bagay at maaari ring magpahiwatig ng pagtitiis, sa halip na paliitin ang diwa tungo lamang sa pag-unawa o pagtanggap.
- source_word: ἄρτι
  choice: ngayon
  rationale: Likas at maikli itong pananda ng kasalukuyang panahon, na ipinaiiba sa kakayahang darating kalaunan sa kasunod na konteksto.
theological_decisions:
- issue: Ang kahulugan ng βαστάζειν kaugnay ng kasalukuyang kawalan ng kakayahan ng mga alagad
  choice: Hindi pa kayang pasanin ng mga alagad ang bigat ng karagdagang sasabihin ni Jesus.
  alternative: Hindi pa nila ito lubos na mauunawaan, matatanggap, o matitiis.
  rationale: Maaaring tumukoy ang βαστάζειν sa pagdadala, pagpasan, o pagtitiis. Pinananatili ng “pasanin” ang posibleng sabayang diwang pangkaisipan, emosyonal, at espirituwal nang hindi pumipili ng iisang paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “marami pa akong sasabihin” sa halip na mas literal ngunit asiwa na anyo, habang pinanatili ng “pasanin” ang talinghaga at teolohikal na tensiyon ng orihinal.
