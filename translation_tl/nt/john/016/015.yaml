  text: πάντα ὅσα ἔχει ὁ πατὴρ ἐμά ἐστιν· διὰ τοῦτο εἶπον ὅτι ἐκ τοῦ ἐμοῦ λαμβάνει καὶ ἀναγγελεῖ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/015.yaml
  text: Everything that the Father has is mine[a]. That is why I said that he takes from what is mine and will declare it to you.
translation:
  language: tl
  text: Lahat ng mayroon ang Ama ay akin. Kaya sinabi ko na kumukuha siya[a] mula sa kung ano ang akin at ipahahayag niya ito sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “tumatanggap siya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα ὅσα
  choice: Lahat ng
  rationale: Likas at ganap na panumbas ito ng komprehensibong pahayag na tumutukoy sa lahat ng saklaw ng kasunod na sugnay.
- source_word: ἔχει ὁ πατήρ
  choice: mayroon ang Ama
  rationale: Pinananatili nito ang payak na diwa ng pag-aangkin o pagkakaroon nang hindi gumagamit ng labis na pormal na salita gaya ng “pag-aari.”
- source_word: ἐμά ἐστιν
  choice: ay akin
  rationale: Direkta at natural itong nagpapahayag ng mariing pag-aangkin ng Anak sa lahat ng mayroon ang Ama.
- source_word: διὰ τοῦτο
  choice: Kaya
  rationale: Maikli at likas na pang-ugnay ito sa modernong Tagalog na pinananatili ang lohikal na bunga o paliwanag.
- source_word: εἶπον
  choice: sinabi ko
  rationale: Tuwirang isinasalin ang aorist bilang payak na nagdaang kilos.
- source_word: ἐκ τοῦ ἐμοῦ
  choice: mula sa mga bagay na akin
  rationale: 'Ginagawang malinaw sa natural na Tagalog ang substantibong gamit ng possessive na ἐμοῦ: ang tinutukoy ay yaong pag-aari ng Anak, hindi lamang ang Anak bilang pinagmulan.'
- source_word: λαμβάνει
  choice: kumukuha siya
  rationale: Pinananatili ang aspektong pangkasalukuyan at ang posibleng diwa ng λαμβάνω na “kumuha,” habang inilalagay sa talababa ang lehitimong alternatibong “tumanggap.”
- source_word: ἀναγγελεῖ
  choice: ipahahayag niya
  rationale: Pinananatili ang hinaharap na panahon at ang solemne, mapagpahayag na diwa ng ἀναγγέλλω.
- source_word: ὑμῖν
  choice: sa inyo
  rationale: Tuwirang panumbas ng datibong tumutukoy sa mga alagad na pinagsasabihan.
theological_decisions:
- issue: Ugnayan ng lahat ng mayroon ang Ama sa Anak
  choice: Lahat ng mayroon ang Ama ay akin
  alternative: Lahat ng mayroon ang Ama ay pag-aari ko
  rationale: Pinananatili ng salin ang matibay na pag-aangkin ng Anak nang hindi nagdaragdag ng terminolohiyang doktrinal na wala sa teksto.
- issue: Pagtanggap o pagkuha ng Espiritu mula sa pag-aari ng Anak
  choice: kumukuha siya mula sa mga bagay na akin
  alternative: tumatanggap siya mula sa mga bagay na akin
  rationale: Maaaring mangahulugan ang λαμβάνει ng “kumukuha” o “tumatanggap.” Nasa pangunahing teksto ang una, ngunit pinananatili sa talababa ang ikalawa upang hindi tahimik na lutasin ang tunay na leksikal at teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Iniwasan ang sobrang pormal na pananalita at pinanatili ang pagkakaiba ng pangkasalukuyang λαμβάνει at panghinaharap na ἀναγγελεῖ.
