revisions:
- from: Lahat ng mayroon ang Ama ay akin. Kaya sinabi kong kumukuha siya[a] mula sa mga bagay na akin at ipahahayag niya ang mga iyon sa inyo.
  to: Lahat ng mayroon ang Ama ay akin. Kaya sinabi ko na kumukuha siya[a] mula sa kung ano ang akin at ipahahayag niya ito sa inyo.
  rationale: Pinalitan ang masyadong kongkretong plural na “mga bagay na akin” ng “kung ano ang akin,” na mas malapit sa elipsis ng Griyego at mas likas sa Tagalog. Pinalitan din ang “mga iyon” ng “ito” upang huwag magdagdag ng bilang na hindi tinutukoy ng pinagmulan. Hindi binabago ng mga rebisyong ito ang kahulugan o ang tensiyong leksikal ng λαμβάνει.
