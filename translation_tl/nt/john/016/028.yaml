  text: ἐξῆλθον ⸀ἐκ τοῦ πατρὸς καὶ ἐλήλυθα εἰς τὸν κόσμον· πάλιν ἀφίημι τὸν κόσμον καὶ πορεύομαι πρὸς τὸν πατέρα.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/028.yaml
  text: I came from the Father and have come into the world. Again[a], I am leaving the world and going to the Father.
translation:
  language: tl
  text: Nagmula ako sa Ama[a] at naparito ako sa mundo. Muli, aalis ako sa mundo at pupunta ako sa Ama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Lumabas ako mula sa Ama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον ἐκ τοῦ πατρὸς
  choice: Nagmula ako sa Ama
  rationale: Likas sa makabagong Tagalog at malinaw na ipinahahayag ang pagkilos at pinagmulan kay Ama. Hindi nito dinaragdagan ng paliwanag na doktrinal ang sinabi ng Griyego.
- source_word: ἐλήλυθα εἰς τὸν κόσμον
  choice: naparito sa mundo
  rationale: Ang “naparito” ay nakatuon sa kinaroroonan ng nagsasalita at nagpapahiwatig ng natapos na pagdating na may kasalukuyang bunga; ang “sa mundo” ay likas na katumbas ng pagpasok sa κόσμος sa konteksto.
- source_word: πάλιν
  choice: naman
  rationale: Dito, inihaharap ng πάλιν ang kasunod at kabaligtarang yugto ng pagkilos—mula sa pagparito hanggang sa pag-alis. Ang “naman” ay natural sa Tagalog at hindi nagpapahiwatig nang di-kinakailangan na dati nang iniwan ni Jesus ang mundo.
- source_word: ἀφίημι τὸν κόσμον
  choice: aalis ako sa mundo
  rationale: Ipinahahayag ng aspektong magaganap ang nalalapit na pag-alis na tinutukoy ng kasalukuyang panahunan sa Griyego. Mas natural ito sa Tagalog kaysa sa literal na kasalukuyang anyo.
- source_word: πορεύομαι πρὸς τὸν πατέρα
  choice: pupunta sa Ama
  rationale: Malinaw at natural na ipinapahayag ang pagkilos patungo sa Ama nang hindi idinaragdag ang ideya ng “presensiya” na hindi tahasang nasa teksto.
theological_decisions:
- issue: Ang kaugnayan ni Jesus sa Ama sa pariralang ἐξῆλθον ἐκ τοῦ πατρὸς
  choice: Nagmula ako sa Ama
  alternative: Lumabas ako mula sa Ama
  rationale: Pinananatili ng pangunahing salin ang tuwirang pahayag na ang Ama ang pinagmulan ni Jesus, ngunit hindi ito pinalalawak bilang paliwanag tungkol sa pre-eksistensiya o pagkakatawang-tao. Inilalagay sa talababa ang mas literal na larawang “lumabas mula” upang mapanatili ang posibleng diin ng pandiwa at pang-ukol.
- issue: Kabuluhan ng πάλιν sa paglipat mula pagparito tungo sa pag-alis
  choice: naman
  alternative: muli
  rationale: Maaaring mangahulugan ang πάλιν ng “muli,” ngunit sa ayos ng pangungusap maaari rin nitong iharap ang katapat na ikalawang pagkilos. Pinipili ang “naman” upang hindi ipalagay na inuulit ni Jesus ang dati nang pag-alis sa mundo, habang pinananatili sa talababa ang mas literal na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mundo” sa halip na mas makalumang “sanlibutan,” at pinanatili ang “Ama” bilang karaniwang katawagan sa kontekstong Juaniko.
