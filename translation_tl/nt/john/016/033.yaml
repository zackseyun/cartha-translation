  text: ταῦτα λελάληκα ὑμῖν ἵνα ἐν ἐμοὶ εἰρήνην ἔχητε· ἐν τῷ κόσμῳ θλῖψιν ἔχετε, ἀλλὰ θαρσεῖτε, ἐγὼ νενίκηκα τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/033.yaml
  text: I have spoken these things to you so that in me you may have peace[a]. In the world you have tribulation, but take courage[b]; I have overcome the world.
translation:
  language: tl
  text: Sinabi ko na sa inyo ang mga bagay na ito upang sa akin ay magkaroon kayo ng kapayapaan. Sa sanlibutan, dumaranas kayo ng kapighatian,[a] ngunit lakasan ninyo ang inyong loob;[b] dinaig ko na ang sanlibutan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “paghihirap,” “pagdurusa,” o “matinding kagipitan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “magpakatatag kayo” o “magkaroon kayo ng lakas ng loob.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: ang mga bagay na ito
  rationale: Pinananatili ang pangmaramihang pantukoy na tumutukoy sa naunang pahayag ni Jesus.
- source_word: λελάληκα
  choice: Sinabi ko
  rationale: Likas ito sa makabagong Filipino; ang aspektong ganap na may patuloy na kabuluhan ay malinaw sa konteksto ng katatapos na pahayag.
- source_word: ἵνα
  choice: upang
  rationale: Malinaw na ipinahihiwatig ang layunin ng pagsasalita ni Jesus.
- source_word: ἐν ἐμοὶ
  choice: sa akin
  rationale: Pinananatili ang mahalaga at sadyang maluwag na wikang Juanino nang hindi ito pinalalawak bilang ‘sa pakikipag-isa sa akin’ o ‘sa pamamagitan ko.’
- source_word: εἰρήνην
  choice: kapayapaan
  rationale: Karaniwan at angkop na katumbas na sumasaklaw sa kapanatagan at ganap na kabutihang matatagpuan kay Jesus.
- source_word: ἔχητε
  choice: magkaroon kayo
  rationale: Naipapahayag ang nilalayong patuloy na pagtataglay ng kapayapaan.
- source_word: ἐν τῷ κόσμῳ
  choice: Sa sanlibutan
  rationale: Pinananatili ang bokabularyo at teolohikal na pag-uugnay ni Juan nang hindi dinaragdagan ng ‘makasalanang sistema’ o katulad na pagpapakahulugan.
- source_word: θλῖψιν
  choice: kapighatian
  rationale: Naipahahayag ang mabigat na diwa ng panggigipit, pagdurusa, at matinding hirap, hindi lamang karaniwang problema.
- source_word: ἔχετε
  choice: dumaranas kayo
  rationale: Natural na Filipino para sa kasalukuyan at nagpapatuloy na pagdanas ng θλῖψις; hindi ito ginawang tahasang panghinaharap.
- source_word: θαρσεῖτε
  choice: lakasan ninyo ang inyong loob
  rationale: Likas at malinaw na panawagan sa katatagan at tapang sa gitna ng kapighatian.
- source_word: νενίκηκα
  choice: dinaig ko na
  rationale: Ang ‘na’ ay tumutulong ipakita ang ganap nang tagumpay na may nananatiling bisa, gaya ng Griyegong perfect.
- source_word: τὸν κόσμον
  choice: ang sanlibutan
  rationale: Kaparehong salin ang ginamit sa dalawang paglitaw ng κόσμος upang mapanatili ang ugnayan at malawak na diwa ng salita sa Ebanghelyo ni Juan.
theological_decisions:
- issue: Kahulugan ng κόσμος sa kontekstong Juanino
  choice: sanlibutan
  alternative: sistema ng sanlibutan; makasalanang sanlibutan
  rationale: Hindi nililimitahan ng salin ang maraming kaugnay na diwa ng κόσμος. Hinahayaan nitong ihayag ng konteksto ang sanlibutang salungat kay Jesus.
- issue: Diwa ng ἐν ἐμοὶ
  choice: sa akin
  alternative: sa pakikipag-isa sa akin; sa pamamagitan ko
  rationale: Pinananatili ang tunay na lawak at teolohikal na tensiyon ng parirala sa halip na itakda kung ito ay tumutukoy lamang sa pakikipag-isa, pinagmumulan, o paraan.
- issue: Ganap na aspekto ng νενίκηκα bago maganap ang krus sa salaysay
  choice: dinaig ko na
  alternative: dadaigin ko; dinaig ko
  rationale: Pinananatili ang pahayag ni Jesus na ganap na ang tagumpay at nananatili ang bisa nito, nang hindi ginagawang panghinaharap ang pandiwa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “sanlibutan” upang mapanatili ang pamilyar na wikang biblikal at ang natatanging gamit ni Juan sa κόσμος. Ang ayos na “upang sa akin ay magkaroon kayo” ay bahagyang mataas ang rehistro ngunit pinananatili ang diin at sadyang kaluwagan ng ἐν ἐμοὶ.
