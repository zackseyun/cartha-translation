  text: And they will do these things because they have not known the Father or me[a].
translation:
  language: tl
  text: At gagawin nila ang mga bagay na ito dahil hindi nila nakilala ang Ama o ako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “hindi nila kilala ang Ama o ako” o “hindi pa nila nakikilala ang Ama o ako.” Ang pandiwang Griyego ay maaaring likas na ipahayag sa Filipino sa mahigit isang paraan dito.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Payak na pang-ugnay ito sa naunang pahayag at natural na pinananatili ang daloy ng konteksto.
- source_word: ταῦτα
  choice: ang mga bagay na ito
  rationale: Pinananatili ang maramihang anyo at ang pagtukoy pabalik sa mga pag-uusig na nabanggit.
- source_word: ποιήσουσιν
  choice: gagawin nila
  rationale: Ang panghinaharap na anyo ng ποιέω ay tuwirang at natural na naipapahayag sa Filipino bilang “gagawin nila.”
- source_word: ὅτι
  choice: dahil
  rationale: Nagpapakilala ito ng sanhi o dahilan ng kanilang gagawin.
- source_word: οὐκ ἔγνωσαν
  choice: hindi nila nakilala
  rationale: Ang “nakilala” ay maaaring magpahiwatig ng tunay at relasyonal na pagkakilala, hindi lamang kaalaman tungkol sa isang tao; pinananatili rin nito ang aspektong aorist nang hindi labis na nililinaw ang panahon.
- source_word: τὸν πατέρα
  choice: ang Ama
  rationale: Ang “Ama” ay personal na titulong tumutukoy sa Diyos sa kontekstong Juanino.
- source_word: οὐδὲ ἐμέ
  choice: ni ako
  rationale: 'Kasunod ng negatibong pandiwa, natural na ipinapahayag ng “ni” ang ikalawang kasamang layon: hindi ang Ama at hindi rin si Jesus.'
theological_decisions:
- issue: Ang kahulugan ng pagkakilala sa Ama at kay Jesus sa wikang Juanino
  choice: hindi nila nakilala ang Ama ni ako
  alternative: hindi nila kilala ang Ama ni ako; hindi nila nakilalang tunay ang Ama ni ako
  rationale: Pinananatili ng “nakilala” ang posibleng diwa ng relasyonal at tunay na pagkakilala nang hindi ito pinalalawak bilang paliwanag sa doktrina. Hindi rin nito tahasang nilulutas kung ang diin ay sa nakaraang kabiguang kumilala o sa patuloy na kawalan ng pagkakilala.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ni ako” bilang natural na koordinasyon pagkatapos ng negatibong pandiwa, at iniwasang dagdagan ng “rin” upang manatiling malapit sa maigsi at mariing anyo ng Griyego.
