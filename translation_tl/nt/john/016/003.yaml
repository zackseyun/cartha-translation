    issue: 'Di-natural na koordinasyon ng mga layon: “ang Ama ni ako.”'
    rationale: Ang “ni” ay hindi ang karaniwang pang-ugnay para sa dalawang layon sa ganitong pangungusap sa modernong Filipino. Ang “o” sa loob ng negasyon ay likas na naghahatid ng kahulugang “ni ang Ama ni ako” at tumutugma sa οὐδὲ.
