  source_fidelity: Tumpak ang pagsasalin ng hinaharap na ποιήσουσιν bilang “gagawin nila,” ng sanhi sa ὅτι bilang “dahil,” at ng τὸν πατέρα bilang “ang Ama.” Ang “nakilala” ay isang ligtas na pagsasalin ng aorist na ἔγνωσαν at pinananatili ang relasyonal na diwa nang hindi ito pinalalawak.
  naturalness: 'Hindi natural at hindi gramatikal sa makabagong Filipino ang “ang Ama ni ako” bilang magkasamang layon. Mas malinaw at karaniwan ang “ang Ama o ako” sa saklaw ng negasyon: “hindi nila nakilala ang Ama o ako.”'
  terminology: Ang “Ama” ay angkop na kapitalisadong titulo sa kontekstong Juanino. Hindi kailangan ang dagdag na teolohikal na paglilinaw sa “nakilala.”
