  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἶπαν οὖν ἐκ τῶν μαθητῶν αὐτοῦ πρὸς ἀλλήλους· Τί ἐστιν τοῦτο ὃ λέγει ἡμῖν· Μικρὸν καὶ οὐ θεωρεῖτέ με, καὶ πάλιν μικρὸν καὶ ὄψεσθέ με; καί· ⸀Ὅτι ὑπάγω πρὸς τὸν πατέρα;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/017.yaml
  text: 'So some of his disciples said to one another[a], “What is this that he is saying to us: ‘A little while, and you will not see me, and again a little while, and you will see me’? And, ‘Because I am going to the Father’?”'
translation:
  language: tl
  text: 'Kaya sinabi ng ilan sa kanyang mga alagad sa isa’t isa, “Ano itong sinasabi niya sa atin: ‘Kaunting panahon, at hindi ninyo ako makikita; at muli, kaunting panahon, at makikita ninyo ako’? At, ‘Dahil pupunta ako sa Ama’[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “At, ‘Na pupunta ako sa Ama’?” Ang salitang Griyego ay maaaring magpakilala ng siniping nilalaman (“na”) o magpahayag ng sanhi (“dahil”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Ipinahihiwatig ang lohikal at pasalaysay na pagpapatuloy mula sa naunang sinabi ni Jesus, sa natural na modernong Tagalog.
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ
  choice: ilan sa kanyang mga alagad
  rationale: 'Pinananatili ang partitive na diwa ng ἐκ: isang bahagi lamang ng mga alagad, hindi silang lahat.'
- source_word: πρὸς ἀλλήλους
  choice: sa isa’t isa
  rationale: Tuwirang ipinahahayag ang usapang tugunan sa pagitan nila.
- source_word: Τί ἐστιν τοῦτο ὃ λέγει ἡμῖν
  choice: Ano ang ibig niyang sabihin sa atin nang sabihin niya
  rationale: Natural na Tagalog para sa tanong ng mga alagad tungkol sa kahulugan ng kasalukuyang sinasabi ni Jesus, habang hindi dinaragdagan ang paliwanag.
- source_word: Μικρὸν
  choice: Kaunting panahon na lamang / kaunting panahon pa
  rationale: Temporal ang diwa rito. Ang bahagyang pag-iiba ng ekspresyon ay likas sa Tagalog at malinaw na nagpapakita ng dalawang maikling pagitan ng panahon.
- source_word: θεωρεῖτέ με
  choice: hindi na ninyo ako makikita
  rationale: Ang θεωρέω ay may diwang makita o mapagmasdan; ang simpleng “makikita” ay malinaw at natural sa konteksto.
- source_word: ὄψεσθέ με
  choice: makikita ninyo ako
  rationale: Pinananatili ang retorikal na pag-uulit ng “makikita” bagaman magkaiba ang dalawang pandiwang Griyego.
- source_word: πάλιν
  choice: pa
  rationale: Sa pariralang “kaunting panahon pa,” natural na naihahatid ang diwa ng panibagong maikling pagitan bago nila siyang muling makita.
- source_word: Ὅτι ὑπάγω πρὸς τὸν πατέρα
  choice: Dahil pupunta ako sa Ama
  rationale: Pinananatili sa pangunahing teksto ang posibleng sanhi na diwa ng ὅτι at ang eksaktong “Ama,” hindi “aking Ama.” Ang alternatibong pag-unawa na nagpapakilala lamang ito ng siniping nilalaman ay inilagay sa talababa.
- source_word: πατέρα
  choice: Ama
  rationale: Tumutugma sa τὸν πατέρα at hindi dinaragdagan ng panghalip na “aking.”
theological_decisions:
- issue: Tinutukoy ng pag-alis at muling pagkakita kay Jesus
  choice: Hindi tinukoy sa salin kung ito ay kamatayan at muling pagkabuhay, pag-akyat, mga pagpapakita matapos mabuhay na muli, o espirituwal na presensiya.
  alternative: Tahasang iugnay ang pahayag sa isa sa mga pagbabasang iyon.
  rationale: Ang talata mismo ay naglalahad ng pagkalito ng mga alagad at hindi pa nilulutas ang tinutukoy ng sinabi ni Jesus; dapat panatilihin ang tensiyong ito.
- issue: Gamit ng ὅτι bago ang “pupunta ako sa Ama”
  choice: 'Isinalin bilang sanhi: “Dahil pupunta ako sa Ama.”'
  alternative: 'Isalin bilang panandang nagpapakilala ng nilalaman: “Na pupunta ako sa Ama.”'
  rationale: Kapuwa posible ayon sa Griyego at sa daloy ng pangungusap, kaya pinili ang sanhi sa teksto at pinanatili ang kabila sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “kanyang” at “ninyo” para sa malinaw na reperensiya at magalang na pangmaramihang pakikipag-usap. Inilagay ang talababa pagkatapos ng buong tanong upang hindi maputol ang sipi.
