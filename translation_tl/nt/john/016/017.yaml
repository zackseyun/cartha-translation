revisions:
- from: Kaya sinabi ng ilan sa kanyang mga alagad sa isa’t isa, “Ano ang ibig niyang sabihin sa atin nang sabihin niya, ‘Kaunting panahon na lamang at hindi na ninyo ako makikita, at kaunting panahon pa at makikita ninyo ako’? At, ‘Dahil pupunta ako sa Ama’?”[a]
  to: 'Kaya sinabi ng ilan sa kanyang mga alagad sa isa’t isa, “Ano itong sinasabi niya sa atin: ‘Kaunting panahon, at hindi ninyo ako makikita; at muli, kaunting panahon, at makikita ninyo ako’? At, ‘Dahil pupunta ako sa Ama’[a]?”'
  rationale: Binago ang tanong upang tuwirang maipakita ang kasalukuyang “sinasabi niya sa atin,” inalis ang idinagdag na aspektong “na” sa negatibong sugnay, at ginawang hayag ang “muli” para sa πάλιν. Inilapit din ang panandang-talababa sa mismong sugnay na may ὅτι. Walang interpretasyong idinagdag hinggil sa tinutukoy na pag-alis at muling pagkakita.
