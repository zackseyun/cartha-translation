  yaml_path: translation/nt/john/016/008.yaml
  text: And when that one comes[c][b][a], he will convict the world concerning sin and concerning righteousness and concerning judgment.
translation:
  language: tl
  text: At pagdating niya, siya nga ang magpapatunay na mali ang sanlibutan tungkol sa kasalanan, sa katuwiran[b], at sa paghatol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Maaari ring “katarungan.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλθὼν
  choice: pagdating niya
  rationale: Likas na ipinapahayag sa Tagalog ang temporal na diwa ng aorist participle; hindi kailangang gawing kahoy na literal na “pagkaparito.”
- source_word: ἐκεῖνος
  choice: ang isang iyon
  rationale: Pinananatili ang mariing demonstratibo ng Griyego at ang pagtukoy nito sa Parakletong binanggit sa konteksto, habang ginagamit ang mga gitling upang maging mas natural ang daloy.
- source_word: ἐλέγξει
  choice: patutunayan niyang mali
  rationale: Saklaw nito ang diwa ng paglalantad at pagpapakitang nasa mali ang sanlibutan. Mas malinaw ito sa karaniwang mambabasa kaysa sa teknikal o posibleng malabong “hahatulan.”
- source_word: κόσμον
  choice: ang sanlibutan
  rationale: Pinananatili ang malawak at teolohikal na saklaw ng κόσμος sa Juan nang hindi ito nililimitahan sa “mga tao” o sa isang sistema lamang.
- source_word: περὶ
  choice: tungkol sa
  rationale: Inuulit sa tatlong bahagi upang mapanatili ang paralelismo at ugnayan ng pandiwa sa kasalanan, katuwiran, at paghatol.
- source_word: ἁμαρτίας
  choice: kasalanan
  rationale: Karaniwang katumbas na nagpapanatili sa isahan ng Griyego at hinahayaang linawin ng kasunod na talata ang tiyak na diwa.
- source_word: δικαιοσύνης
  choice: katuwiran
  rationale: Pinakamalapit sa malawak na diwa ng δικαιοσύνη sa kontekstong ito at tumutugma sa paliwanag sa Juan 16:10; ang “katarungan” ay inilalagay bilang alternatibo sa talababa.
- source_word: κρίσεως
  choice: paghatol
  rationale: Pinananatili ang legal at eskatolohikal na lawak ng κρίσις nang hindi agad nililimitahan sa kaparusahan o kondemnasyon.
theological_decisions:
- issue: Tinutukoy at diin ng ἐκεῖνος
  choice: Tahasan at mariing “ang isang iyon,” na tumutukoy sa darating na Parakleto/Espiritu ayon sa agarang konteksto.
  alternative: Payak na “siya,” na mas natural ngunit hindi gaanong nagpapakita ng diin ng demonstratibo.
  rationale: May tunay na diin ang ἐκεῖνος sa Griyego. Pinananatili ito nang hindi nagdaragdag ng doktrinal na paliwanag sa mismong talata.
- issue: Kahulugan ng ἐλέγξει
  choice: patutunayan niyang mali
  alternative: “hahatulan,” “susumbatan,” o “ilalantad ang pagkakasala”
  rationale: Ang pandiwa ay maaaring magpahiwatig ng paglalantad, pagsaway, at pagpapatunay na mali o nagkasala. Ang piniling parirala ay nagpapanatili sa moral-forensic na puwersa ngunit hindi ipinapakahulugang ang huling hatol mismo ang tinutukoy.
- issue: Pagpapakahulugan sa δικαιοσύνη
  choice: katuwiran
  alternative: katarungan
  rationale: Ang “katuwiran” ay mas angkop sa kasunod na paliwanag tungkol sa pagpunta ni Jesus sa Ama, samantalang pinananatili sa talababa ang lehitimong alternatibong “katarungan.”
translation_notes:
  register: Makabago at marangal na Tagalog. Ginamit ang “sanlibutan,” “katuwiran,” at “paghatol” bilang pamilyar na bokabularyong biblikal na nauunawaan pa rin sa kasalukuyan. Ang gitling na singit sa “ang isang iyon” ay nagpapanatili sa diin ng Griyego nang hindi ginagawang labis na alanganin ang pangungusap.
