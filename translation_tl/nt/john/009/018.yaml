  text: Οὐκ ἐπίστευσαν οὖν οἱ Ἰουδαῖοι περὶ αὐτοῦ ὅτι ⸂ἦν τυφλὸς⸃ καὶ ἀνέβλεψεν, ἕως ὅτου ἐφώνησαν τοὺς γονεῖς αὐτοῦ ⸂τοῦ ἀναβλέψαντος⸃
base_translation:
  language: en
  yaml_path: translation/nt/john/009/018.yaml
  text: So the Jews did not believe concerning him that he had been blind and had received sight[a], until they called the parents of the one who had received sight.
translation:
  language: tl
  text: Kaya hindi naniwala ang mga Judio na siya ay dating bulag at nagkaroon na ng paningin[a], hanggang sa ipinatawag nila ang mga magulang ng taong nagkaroon ng paningin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga Judio” ay maaari ring unawain dito bilang “mga pinunong Judio” o “mga taga-Judea,” depende sa gamit ni Juan sa katawagang ito sa konteksto.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπίστευσαν
  choice: naniwala
  rationale: May sugnay na ὅτι na nagsasaad ng nilalaman ng hindi nila tinanggap bilang totoo; kaya mas angkop ang “naniwala” kaysa “nagtiwala.”
- source_word: οἱ Ἰουδαῖοι
  choice: ang mga Judio
  rationale: Pinananatili nito ang tahasang katawagan sa Griyego nang hindi agad nililimitahan sa mga pinuno o sa mga taga-Judea; nililinaw sa talababa ang posibleng saklaw sa konteksto ni Juan.
- source_word: περὶ αὐτοῦ
  choice: tungkol sa kanya
  rationale: Likas at tuwirang katumbas sa modernong Tagalog ng περί na may genitive.
- source_word: ἦν τυφλὸς
  choice: dati siyang bulag
  rationale: Ipinakikita ng “dati” na nauna ang kalagayan ng pagkabulag sa paggaling, gaya ng hinihingi ng pananaw ng salaysay.
- source_word: ἀνέβλεψεν
  choice: nakakita na
  rationale: Sa konteksto ng pagpapagaling, ipinahahayag nitong nagkaroon siya ng paningin nang hindi ipinahihiwatig na nakakakita na siya noon, na maaaring ipahiwatig ng “muling nakakita.”
- source_word: ἕως ὅτου
  choice: hanggang sa
  rationale: Karaniwang Tagalog na panandang temporal para sa hangganan ng naunang kilos o kalagayan.
- source_word: ἐφώνησαν
  choice: ipinatawag nila
  rationale: Sa konteksto ng pagsisiyasat, mas malinaw kaysa simpleng “tinawag” na pinapunta nila ang mga magulang, ngunit hindi kasing-teknikal ng pormal na pagpapatawag sa hukuman.
- source_word: γονεῖς
  choice: mga magulang
  rationale: Tuwiran at karaniwang katumbas ng γονεῖς.
- source_word: τοῦ ἀναβλέψαντος
  choice: ng taong nakakita na
  rationale: Isinasalin nang natural ang substantibong participle at malinaw na tumutukoy sa lalaking pinagaling; ang “tao” ay kontekstuwal na hayag at hindi nagdaragdag ng interpretasyong teolohikal.
theological_decisions:
- issue: Saklaw at tinutukoy ng οἱ Ἰουδαῖοι sa Ebanghelyo ni Juan
  choice: ang mga Judio
  alternative: ang mga pinunong Judio; ang mga taga-Judea
  rationale: Pinananatili sa pangunahing teksto ang malawak at tunay na hindi tiyak na katawagan sa Griyego. Dahil maaaring tumukoy ito sa mga awtoridad na Judio o sa mga taga-Judea ayon sa konteksto, inilalahad ang mga iyon sa talababa sa halip na tahimik na paliitin ang kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “ipinatawag” para sa konteksto ng pagsisiyasat at “nakakita na” upang maiwasan ang implikasyong dati nang nakakakita ang lalaking isinilang na bulag.
