base_translation:
  language: en
  yaml_path: translation/nt/john/009/009.yaml
  text: Some were saying[a], “This is he.” Others were saying, “No, but he is like him.” He kept saying, “I am he.”
translation:
  language: tl
  text: May mga nagsasabi, “Siya iyon.” Sinasabi naman ng iba, “Hindi, kamukha lamang niya.” Siya naman ay patuloy na nagsasabi, “Ako nga iyon.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas literal, “Ako ay.” Dito ay karaniwang pagkilala sa sarili ang diwa: sinasabi ng lalaki na siya ang taong pinagtatalunan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλοι … ἄλλοι
  choice: May mga … ang iba
  rationale: Likas na ipinapakita sa Tagalog ang paghahati ng mga tao sa dalawang pangkat na magkaiba ang sinasabi.
- source_word: ἔλεγον
  choice: mga nagsasabi / sinasabi
  rationale: Ipinahihiwatig ng imperpektibo ang nagpapatuloy na palitan ng mga pahayag; iniiwasan ng salin ang payak na minsanang “sinabi.”
- source_word: Οὗτός ἐστιν
  choice: Siya iyon
  rationale: Tuwiran at likas na pagkilala ito sa taong pinag-uusapan, nang hindi nagdaragdag ng pangngalang wala sa Griyego.
- source_word: Οὐχί, ἀλλὰ
  choice: Hindi, … lamang
  rationale: Malinaw na itinatanggi ang pagkakakilanlan at inihahambing lamang ang anyo; ang “lamang” ay likas na naghahatid ng salungat na puwersa ng ἀλλά sa pangungusap.
- source_word: ὅμοιος αὐτῷ ἐστιν
  choice: kamukha lamang niya
  rationale: Sa konteksto ng pagkilala sa tao, natural na ipinapahayag ng “kamukha” ang pagkakahawig ngunit hindi pagkakapareho ng identidad.
- source_word: ἐκεῖνος ἔλεγεν
  choice: Ngunit patuloy niyang sinasabi
  rationale: Ang imperpektibo ay nagpapahiwatig ng paulit-ulit o nagpapatuloy na paggigiit ng lalaki habang nagtatalo ang mga tao.
- source_word: Ἐγώ εἰμι
  choice: Ako nga iyon
  rationale: 'Karaniwang pagpapakilala sa sarili ang diwa rito: pinatutunayan ng lalaki na siya ang taong pinag-uusapan. Ang “nga” ay natural na nagpapahayag ng mariing pagkumpirma nang hindi naglalagay ng kristolohikal na kahulugang hindi hinihingi ng konteksto.'
theological_decisions:
- issue: Pagpapakahulugan sa Ἐγώ εἰμι sa kontekstong Juanino
  choice: Ako nga iyon
  alternative: Ako ay / Ako nga
  rationale: Bagaman maaaring magkaroon ng mas mataas na pahiwatig ang parirala sa ibang bahagi ng Juan, dito ang dating bulag ang nagsasalita upang kilalanin ang sarili bilang taong pinagtatalunan. Kaya ipinahahayag ang karaniwang pagkilala sa sarili habang hindi inaangkin ang isang kristolohikal na pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang buhay na takbo ng pagtatalo sa pamamagitan ng mga anyong nagpapahiwatig ng nagpapatuloy na pagsasalita, ngunit iniwasan ang mabigat o makalumang pananalita.
