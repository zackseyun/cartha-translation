id: JHN.9.39
reference: John 9:39
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ Ἰησοῦς· Εἰς κρίμα ἐγὼ εἰς τὸν κόσμον τοῦτον ἦλθον, ἵνα οἱ μὴ βλέποντες βλέπωσιν καὶ οἱ βλέποντες τυφλοὶ γένωνται.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/039.yaml
  text: And Jesus said[a], “For judgment I came into this world, so that those who do not see may see, and those who see may become blind.”
translation:
  language: tl
  text: At sinabi ni Jesus, “Naparito ako sa mundong ito para sa paghatol[a], upang makakita ang mga hindi nakakakita at maging bulag ang mga nakakakita.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “para sa isang paghatol.” Maaaring idiin ng Griyegong εἰς κρίμα ang bunga ng pagparito ni Jesus bilang isang makatarungang paglalantad at paghihiwalay, hindi lamang pagkondena.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίμα
  choice: paghatol
  rationale: 'Pinananatili ng “paghatol” ang maikli ngunit malawak na diwa ng salitang Griyego: ang pagparito ni Jesus ay nagbubunga ng makatarungang pagbubunyag at paghihiwalay. Hindi ginamit ang “pagkondena” sapagkat napakakitid nito para sa dalawang magkasalungat na bunga sa talata.'
- source_word: κόσμον
  choice: mundo
  rationale: Ang “mundo” ang natural at karaniwang katumbas sa Filipino at angkop sa gamit ni Juan para sa daigdig ng sangkatauhan.
- source_word: οἱ μὴ βλέποντες / οἱ βλέποντες
  choice: ang mga hindi nakakakita / ang mga nakakakita
  rationale: Pinananatili ng magkatulad na parirala ang paralelismo at ang sadyang pag-iral ng kapwa literal at espirituwal na kahulugan; hindi nito agad pinapakahulugan ang una bilang “mga bulag.”
- source_word: βλέπωσιν
  choice: makakita
  rationale: Likas na ipinapahayag ng “makakita” ang layunin o bunga ng ἵνα at nananatiling bukas sa pisikal at espirituwal na paningin.
- source_word: τυφλοὶ γένωνται
  choice: maging bulag
  rationale: Tumpak na inilalahad ng “maging” ang resultative na diwa ng γένωνται, habang pinananatili ng “bulag” ang matinding pagbaligtad sa sinabi ni Jesus.
- source_word: εἰς τὸν κόσμον τοῦτον ἦλθον
  choice: Naparito ako sa mundong ito
  rationale: Ang “naparito” ay natural at marangal na pahayag ng pagdating sa kinaroroonan, at pinananatili ang wika ni Juan tungkol sa pagparito ni Jesus sa mundo.
theological_decisions:
- issue: Ugnayan ng pahayag na ito sa Juan 3:17, na nagsasabing hindi isinugo ang Anak upang hatulan ang mundo
  choice: Panatilihin ang “paghatol” nang hindi pinapahina o ipinapaliwanag palayo ang tensiyon.
  alternative: Isalin bilang “pagkakahati” o “pagkondena” upang tukuyin nang mas makitid ang bunga.
  rationale: 'Ipinakikita ng talata ang pagparito ni Jesus na nagbubunga ng paglalantad at paghihiwalay: nakakakita ang mga hindi nakakakita, samantalang nagiging bulag ang mga nakakakita. Pinananatili ng salin ang tunay na teolohikal na tensiyon at hindi ito tahimik na inihaharmonisa sa ibang pahayag ni Juan.'
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang “naparito” bilang pamilyar ngunit hindi labis na makalumang anyo; iniwasan ang pagpapaliwanag sa mismong teksto upang manatili ang maikli at matalim na paralelismo ng orihinal.
