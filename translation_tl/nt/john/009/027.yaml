  to: Sumagot siya sa kanila, “Sinabi ko na sa inyo, ngunit hindi kayo nakinig.[a] Bakit gusto ninyong marinig iyon ulit? Hindi rin naman ninyo gustong maging mga alagad niya, hindi ba?”[b]
