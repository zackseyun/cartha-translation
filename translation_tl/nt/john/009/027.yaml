  text: ἀπεκρίθη αὐτοῖς· Εἶπον ὑμῖν ἤδη καὶ οὐκ ἠκούσατε· τί πάλιν θέλετε ἀκούειν; μὴ καὶ ὑμεῖς θέλετε αὐτοῦ μαθηταὶ γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/027.yaml
  text: He answered them[a], “I already told you, and you did not listen. Why do you want to hear it again? You do not also want to become his disciples[b], do you?”
translation:
  language: tl
  text: Sumagot siya sa kanila, “Sinabi ko na sa inyo, ngunit hindi kayo nakinig.[a] Bakit gusto ninyong marinig iyon ulit? Hindi rin naman ninyo gustong maging mga alagad niya, hindi ba?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “hindi ninyo narinig.” Ang pandiwang Griyego ay maaaring mangahulugang “marinig” o “makinig”; sa kontekstong ito, malamang na tumutukoy ito sa hindi pagbibigay-pansin sa sinabi.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “Tiyak namang hindi rin ninyo gustong maging mga alagad niya?” Ang tanong sa Griyego ay gumagamit ng μή, na nagpapahiwatig na negatibo ang inaasahang sagot.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: Sumagot siya
  rationale: Karaniwang salitang pasalaysay na natural sa modernong Filipino at tapat sa diwa ng pandiwang Griyego.
- source_word: ἤδη
  choice: na
  rationale: Sa pariralang “Sinabi ko na,” likas na ipinapahayag ng “na” na nangyari na ito bago pa ang kasalukuyang pagtatanong.
- source_word: οὐκ ἠκούσατε
  choice: hindi kayo nakinig
  rationale: Bagaman maaaring mangahulugang literal na “hindi ninyo narinig,” ipinahihiwatig ng konteksto ang hindi pakikinig o hindi pagbibigay-pansin sa sinabi.
- source_word: τί πάλιν θέλετε ἀκούειν;
  choice: Bakit gusto ninyong marinig iyon ulit?
  rationale: Ang τί ay idiomatikong nauunawaan dito bilang “bakit,” na nagpapakita ng pagkainis; nilinaw ng “iyon” ang ipinahihiwatig na bagay na muli nilang gustong marinig.
- source_word: μὴ καὶ ὑμεῖς
  choice: Hindi naman pati kayo ... hindi ba?
  rationale: Pinananatili ng negatibong tanong at pangwakas na “hindi ba?” ang inaasahang negatibong sagot, habang ang “pati kayo” ay tumutugma sa καὶ ὑμεῖς.
- source_word: αὐτοῦ μαθηταὶ
  choice: mga alagad niya
  rationale: Natural na Filipino para sa possessive construction at para sa Johannine na gamit ng μαθηταί.
- source_word: γενέσθαι
  choice: maging
  rationale: Ipinapahayag ng “maging” ang pagpasok sa isang bagong kalagayan, hindi lamang ang pananatili rito.
theological_decisions:
- issue: Retorikal na puwersa ng huling tanong
  choice: Negatibong tanong na may bahid ng panunuya at umaasang ang sagot ay hindi
  alternative: “Talaga bang gusto rin ninyong maging mga alagad niya?”
  rationale: Ang μή sa tuwirang tanong ay karaniwang nagpapahiwatig na negatibo ang inaasahang sagot. Pinananatili ito ng “Hindi naman ... hindi ba?” nang hindi nagdaragdag ng doktrinal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang “kayo” at “ninyo” upang mapanatili ang maramihang kausap; ang bahagyang mapanuyang tono ay ipinahayag sa anyong tanong, hindi sa pagdaragdag ng tahasang pang-uri.
