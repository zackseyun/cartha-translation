  text: καὶ ἠρώτησαν αὐτὸν οἱ μαθηταὶ αὐτοῦ λέγοντες· Ῥαββί, τίς ἥμαρτεν, οὗτος ἢ οἱ γονεῖς αὐτοῦ, ἵνα τυφλὸς γεννηθῇ;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/002.yaml
  text: And his disciples asked him[a], saying, “Rabbi, who sinned, this man or his parents, that he should be born blind?”
translation:
  language: tl
  text: Tinanong siya ng mga alagad niya, “Rabbi, sino ang nagkasala—ang taong ito o ang kanyang mga magulang—kaya siya ipinanganak na bulag[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “upang siya ay ipanganak na bulag.” Maaaring ipahayag ng pariralang Griyego ang ipinapalagay na layunin o bunga sa tanong ng mga alagad.
    reason: alternative_reading
lexical_decisions:
- source_word: ἠρώτησαν
  choice: Tinanong
  rationale: Likas at tuwirang katumbas sa makabagong Tagalog para sa payak na pagtatanong kay Jesus.
- source_word: μαθηταὶ
  choice: mga alagad
  rationale: Nakagawiang salin sa Ebanghelyo na nagpapanatili sa ugnayan ng guro at tagasunod.
- source_word: λέγοντες
  choice: (ipinahiwatig sa tuwirang sipi)
  rationale: Hindi kailangang isalin nang hiwalay bilang “na sinasabi” sapagkat sapat at mas natural sa Tagalog ang “Tinanong ...” na sinusundan ng tuwirang sipi.
- source_word: Ῥαββί
  choice: Rabbi
  rationale: Pinananatili ang makasaysayang Judiong katawagan at nauunawaan bilang tawag sa isang guro.
- source_word: τίς
  choice: sino
  rationale: Tuwirang tanong kung sino ang itinuturing na nagkasala.
- source_word: ἥμαρτεν
  choice: nagkasala
  rationale: Payak at tumpak na katumbas ng aorist na pandiwa nang hindi nagdaragdag ng uri o bigat ng kasalanan.
- source_word: οὗτος
  choice: ang taong ito
  rationale: Nililinaw na ang tinutukoy ay ang lalaking bulag habang pinananatili ang demonstratibong diwa.
- source_word: γονεῖς
  choice: mga magulang
  rationale: Karaniwan at tumpak na katawagan sa ama at ina.
- source_word: ἵνα
  choice: kaya
  rationale: Sa tanong ng mga alagad, natural na ipinapahayag ng “kaya” ang inaakala nilang ugnayan ng kasalanan at kapanganakang bulag, nang hindi ito ginagawang pagsang-ayon ng tagapagsalaysay.
- source_word: τυφλὸς
  choice: bulag
  rationale: Tuwirang katumbas ng pang-uring naglalarawan sa kalagayan niya mula sa kapanganakan.
- source_word: γεννηθῇ
  choice: ipinanganak
  rationale: Ang anyong pasibo at ang pangyayaring mula sa kapanganakan ay natural na naihahayag sa “ipinanganak na bulag.”
theological_decisions:
- issue: Diwa ng ἵνα sa ipinapalagay na kaugnayan ng kasalanan at pagkabulag mula sa kapanganakan
  choice: “kaya siya ipinanganak na bulag”
  alternative: “upang ipanganak siyang bulag”
  rationale: Ang “kaya” ay natural sa makabagong Tagalog at ipinakikitang bahagi ito ng palagay sa tanong ng mga alagad, hindi isang doktrinang pinagtitibay ng tagapagsalaysay. Iniiwasan din nito ang mas mariing layuning ipinahihiwatig ng “upang,” habang kinikilala sa talababa ang saklaw ng ἵνα.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Inalis ang hiwalay na katumbas ng participial λέγοντες dahil kalabisan ito sa natural na salaysay sa Tagalog. Ginamit ang mga gitling upang malinaw na maihiwalay ang dalawang pagpipilian sa tanong.
