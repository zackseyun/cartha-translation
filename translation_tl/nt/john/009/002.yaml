  source_fidelity: Tumpak na naihahatid ng pangunahing salin ang tanong ng mga alagad tungkol sa ipinapalagay nilang kaugnayan ng kasalanan at pagkabulag mula kapanganakan. Ang “kaya” ay isang katanggap-tanggap na resultang pagbasa ng ἵνα sa kontekstong ito. Gayunman, ang alternatibong salin sa talababa ay kailangang ayusin upang maipahayag nang wasto ang pasibong subjunctive na γεννηθῇ at ang saklaw ng ἵνα.
  naturalness: Natural at malinaw ang pangungusap. Mas karaniwan at mas magaan sa modernong Tagalog ang “mga alagad niya” kaysa “kanyang mga alagad.”
  terminology: Ang “mga alagad,” “Rabbi,” “nagkasala,” at “mga magulang” ay angkop sa rehistro ng Ebanghelyo at sa makabagong Filipino Tagalog. Napananatili rin ng “kaya” na ang palagay ay nasa tanong ng mga alagad at hindi pahayag ng tagapagsalaysay.
  issues:
  - severity: medium
    issue: 'Hindi ganap na wasto at hindi natural ang alternatibong salin sa talababa: “upang ipanganak siyang bulag.”'
