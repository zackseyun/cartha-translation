id: JHN.9.7
reference: John 9:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ· Ὕπαγε νίψαι εἰς τὴν κολυμβήθραν τοῦ Σιλωάμ (ὃ ἑρμηνεύεται Ἀπεσταλμένος). ἀπῆλθεν οὖν καὶ ἐνίψατο, καὶ ἦλθεν βλέπων.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/007.yaml
  text: And he said to him[a], “Go, wash in the pool of Siloam” (which is translated “Sent”). So he went and washed, and came back seeing.
translation:
  language: tl
  text: At sinabi niya sa kanya, “Pumunta ka at maghugas sa tipunan ng tubig ng Siloam” (na ang salin ay “Isinugo”[a]). Kaya pumunta siya at naghugas, at bumalik na nakakakita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na ang ibig sabihin ay ‘Isinugo.’”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὕπαγε
  choice: Pumunta ka
  rationale: Tuwirang pautos ito na nagpapahayag ng pagpunta. Natural sa modernong Tagalog ang “Pumunta ka” at hindi ito nagdaragdag ng diwang wala sa Griyego.
- source_word: νίψαι / ἐνίψατο
  choice: maghugas / naghugas
  rationale: Ang νίπτω ay karaniwang tumutukoy sa paghuhugas, madalas ng bahagi ng katawan at hindi sa buong paliligo. Pinananatili ng “maghugas” ang saklaw ng salita nang hindi tahasang nagdaragdag ng layon.
- source_word: εἰς τὴν κολυμβήθραν
  choice: sa tipunan ng tubig
  rationale: Ang κολυμβήθρα ay isang pool o imbakan ng tubig. Ang “tipunan ng tubig” ay malinaw at hindi nagpapahiwatig na ito ay likas na lawa o makabagong swimming pool; sa konteksto ng paghuhugas, natural na isinalin ang εἰς bilang “sa.”
- source_word: Σιλωάμ
  choice: Siloam
  rationale: Ginamit ang nakagawiang transliterasyon ng pangalang pantangi.
- source_word: ὃ ἑρμηνεύεται Ἀπεσταλμένος
  choice: na ang salin ay “Isinugo”
  rationale: Ang ἑρμηνεύεται ay nagpapakilala ng paliwanag sa pangalan. Pinananatili ng “ang salin ay” ang tahasang katangian nito bilang salin, at ang “Isinugo” ay angkop sa pasibong participle na Ἀπεσταλμένος.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinakikita rito ng οὖν ang likas na bunga o kasunod ng utos. Ang “Kaya” ay malinaw at natural sa daloy ng salaysay.
- source_word: ἀπῆλθεν
  choice: pumunta siya
  rationale: Payak na pandiwang pasalaysay ito tungkol sa pag-alis o pagpunta; sapat at natural ang “pumunta siya.”
- source_word: ἦλθεν βλέπων
  choice: bumalik na nakakakita
  rationale: Ipinakikita ng kasamang participle na βλέπων ang kalagayan niya nang siya ay dumating. Ginagawang malinaw ng “bumalik” ang ipinahihiwatig ng konteksto, habang pinananatili ng “nakakakita” ang matingkad na anyong participial.
theological_decisions:
- issue: Paglalahad sa paliwanag ng pangalang Siloam nang hindi pinalalabis ang simbolismong teolohikal
  choice: Isinama sa pangunahing teksto ang panaklong na “na ang salin ay ‘Isinugo,’” gaya ng nasa Griyego.
  alternative: Gawing mas interpretatibo ang paliwanag upang tahasang iugnay ang pangalan kay Jesus bilang isinugo ng Ama.
  rationale: Mismong teksto ang nagbibigay ng paliwanag, kaya dapat itong panatilihin. Gayunman, hindi dapat gawing tahasan ng salin ang isang simbolikong ugnayang hindi tahasang ipinaliliwanag sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Iniwasan ang “palanguyan,” na maaaring magpahiwatig ng makabagong swimming pool, at ang “lawa,” na maaaring magbigay ng maling larawan sa uri ng lugar. Inilagay ang [a] kaagad pagkatapos ng “Isinugo,” kung saan talaga nauukol ang alternatibong salin.
