base_translation:
  language: en
  yaml_path: translation/nt/john/009/041.yaml
  text: Jesus said to them[a], “If you were blind, you would not have sin. But now you say, ‘We see,’ so your sin remains.”
translation:
  language: tl
  text: 'Sinabi ni Jesus sa kanila, “Kung bulag kayo, wala sana kayong kasalanan.[a] Ngunit ngayon ay sinasabi ninyo: ‘Nakakakita kami.’ Kaya nananatili ang inyong kasalanan.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “wala sana kayong pananagutan.” Ang salitang Griyego ay “kasalanan,” na sa kontekstong ito ay maaari ring magpahiwatig ng pananagutan o pagkakasala.
    reason: lexical_alternative
lexical_decisions:
- source_word: τυφλοὶ
  choice: mga bulag
  rationale: Tuwirang pinananatili ang larawang ‘bulag’; ang konteksto ang nagpapakita ng espirituwal na pahiwatig nito nang hindi ito idinaragdag sa salin.
- source_word: οὐκ ἂν εἴχετε
  choice: hindi sana kayo nagkaroon
  rationale: Ipinahahayag ng imperfect na may ἄν ang di-totoong bunga ng kondisyong ipinapalagay; natural itong naipapahayag sa Filipino sa pamamagitan ng ‘hindi sana.’
- source_word: ἁμαρτίαν
  choice: kasalanan
  rationale: Ito ang tuwirang katumbas ng ἁμαρτία at pinananatili ang gamit ni Juan; maaari rin itong magpahiwatig ng pananagutan ngunit hindi iyon nililimitahan sa pangunahing teksto.
- source_word: νῦν δὲ
  choice: Ngunit ngayon
  rationale: Malinaw nitong ipinakikita ang pagsalungat ng kasalukuyang kalagayan sa ipinapalagay na kondisyon.
- source_word: λέγετε ὅτι Βλέπομεν
  choice: sinasabi ninyong, ‘Nakakakita kami,’
  rationale: Pinananatili ang pagbabago mula sa ikalawang panauhang maramihan tungo sa tuwirang sipi sa unang panauhang maramihan, kasama ang retorikal na kabalintunaan.
- source_word: ἡ ἁμαρτία ὑμῶν μένει
  choice: nananatili ang inyong kasalanan
  rationale: Ang ‘nananatili’ ay natural at tumutugma sa patuloy na kalagayang ipinahahayag ng μένει, isang mahalagang pandiwa sa Juan.
theological_decisions:
- issue: Kung dapat bang tahasang tukuyin na espirituwal na pagkabulag ang tinutukoy at na ang kasalanan ay pananagutan sa harap ng Diyos
  choice: Panatilihin sa pangunahing teksto ang payak na ‘mga bulag’ at ‘kasalanan.’
  alternative: ‘Kung bulag kayo sa espirituwal, hindi sana kayo nagkasala’ o ‘hindi sana kayo nagkaroon ng pananagutan.’
  rationale: Ang buong kabanata ang nagbibigay ng espirituwal na bisa sa larawang pisikal na pagkabulag. Ang pagpapaliwanag nito sa mismong teksto ay magpapakitid sa sinadyang talinghaga at sa saklaw ng ἁμαρτία.
translation_notes:
  register: Makabagong Filipino na dignified at madaling maunawaan. Ginamit ang ‘kayo/ninyo/inyong’ bilang natural na maramihang anyo at pinanatili ang maikli at matalim na paghahambing ng orihinal.
