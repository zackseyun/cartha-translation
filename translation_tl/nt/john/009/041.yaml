  source_fidelity: Tumpak na naipapahayag ng draft ang kondisyonal na pahayag, ang literal ngunit metaporikal na «bulag,» ang tuwirang sipi na «Nakakakita kami,» at ang patuloy na diwa ng μένει. Gayunman, ang «hindi sana kayo nagkaroon ng kasalanan» ay mas madaling marinig bilang pagganap o pagkakamit ng kasalanan kaysa bilang pagkakaroon ng kasalanan, samantalang ang Griyego ay εἴχετε ἁμαρτίαν (‘mayroon kayong kasalanan’).
  naturalness: Mas likas at matalim sa makabagong Filipino ang «Kung bulag kayo, wala sana kayong kasalanan.» Hindi kailangan ang «mga» sa pang-uring panaguri. Mas maayos rin ang «Sinabi ni Jesus sa kanila» at ang paggamit ng tutuldok bago ang tuwirang sipi.
  terminology: Ang «kasalanan» ay wastong pangunahing katumbas ng ἁμαρτία. Pinananatili ang «bulag» nang walang idinagdag na «sa espirituwal,» upang hindi ipaliwanag sa pangunahing teksto ang sadyang larawan at kabalintunaan ng talata. Ang talababa ay nagbibigay lamang ng posibleng diwang culpability/pananagutan, hindi kapalit ng pangunahing salin.
  issues:
