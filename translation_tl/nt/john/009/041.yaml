  to: 'Sinabi ni Jesus sa kanila, “Kung bulag kayo, wala sana kayong kasalanan.[a] Ngunit ngayon ay sinasabi ninyo: ‘Nakakakita kami.’ Kaya nananatili ang inyong kasalanan.”'
