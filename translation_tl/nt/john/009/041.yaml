    issue: «hindi sana kayo nagkaroon ng kasalanan»
    rationale: Bagaman nauunawaan, maaari itong mangahulugang ‘hindi sana kayo nakagawa/nagkamit ng kasalanan.’ Ang «wala sana kayong kasalanan» ang mas idiomatiko at mas tuwirang tumutugma sa εἴχετε ἁμαρτίαν.
  - severity: low
    issue: «mga bulag» bilang panaguri at kuwit bago ang tuwirang sipi
    rationale: Mas natural ang «Kung bulag kayo»; ang «mga» ay hindi kailangan. Ang tutuldok pagkatapos ng «sinasabi ninyo» ay mas malinaw na pagpapakilala sa tuwirang sipi.
