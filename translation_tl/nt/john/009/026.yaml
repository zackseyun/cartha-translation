  text: εἶπον ⸂οὖν αὐτῷ⸃· Τί ἐποίησέν σοι; πῶς ἤνοιξέν σου τοὺς ὀφθαλμούς;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/026.yaml
  text: So they said to him, “What did he do to you? How did he open your eyes?”
translation:
  language: tl
  text: Kaya sinabi nila sa kanya, “Ano ang ginawa niya sa iyo? Paano niya binuksan ang iyong mga mata?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπον
  choice: sinabi nila
  rationale: Ang aorist ng λέγω ay nagpapakilala sa tuwirang pananalita ng pangkat. Pinananatili ng “sinabi nila” ang karaniwang kahulugan ng pandiwa, kahit mga tanong ang kasunod.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinahihiwatig ng οὖν ang lohikal na pagpapatuloy mula sa naunang tugon; natural sa modernong Tagalog ang “Kaya” at hindi nito ginagawang purong temporal ang ugnayan.
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Karaniwang katumbas ito ng datibong di-tuwirang layon na tumutukoy sa lalaking pinagaling.
- source_word: Τί ἐποίησέν σοι
  choice: Ano ang ginawa niya sa iyo?
  rationale: Direktang pinananatili ang tanong at ang maaaring di-tiyak na puwersa ng datibo—ginawa “sa” kanya, hindi tahasang ginawang “para” sa kanya.
- source_word: πῶς
  choice: Paano
  rationale: Natural at eksaktong katumbas ng pang-abay na nagtatanong tungkol sa paraan.
- source_word: ἤνοιξέν σου τοὺς ὀφθαλμούς
  choice: binuksan ang iyong mga mata
  rationale: Pinananatili ang aktibong larawan ng “pagbubukas” ng mga mata at isinasalin ang Griyegong ekspresyon sa malinaw at marangal na Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, natural, at marangal. Ginamit ang “iyong” sa halip na kolokyal na “mong” upang mapanatili ang dignidad ng salaysay nang hindi nagiging makaluma.
