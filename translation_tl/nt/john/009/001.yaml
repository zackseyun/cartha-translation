base_translation:
  language: en
  yaml_path: translation/nt/john/009/001.yaml
  text: And as he was passing by[a], he saw a man blind from birth.
translation:
  language: tl
  text: Habang dumaraan siya[a], nakita niya ang isang lalaking bulag mula pa nang ipanganak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa pagdaan niya”; ipinakikita ng pandiwaring Griyego na dumaraan siya nang makita niya ang lalaki.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: At
  rationale: Pinananatili ang payak na pang-ugnay upang maipagpatuloy ang daloy ng salaysay mula sa naunang konteksto.
- source_word: παράγων
  choice: habang nagdaraan siya
  rationale: Ipinahahayag ng kasalukuyang pandiwaring Griyego ang kilos na nagpapatuloy kasabay ng pagkakita; natural itong naipapahayag sa Tagalog sa pamamagitan ng “habang.”
- source_word: εἶδεν
  choice: nakita niya
  rationale: Tuwirang katumbas ito ng pandiwang ὁράω at hindi nagdaragdag ng diwang tulad ng “napansin.”
- source_word: ἄνθρωπον
  choice: isang lalaki
  rationale: Bagaman maaari ring mangahulugang “tao” ang ἄνθρωπος, isang partikular na lalaking nasa hustong gulang ang tinutukoy sa salaysay.
- source_word: τυφλὸν
  choice: bulag
  rationale: Likas at tuwirang paglalarawan ito sa kalagayan ng lalaki.
- source_word: ἐκ γενετῆς
  choice: mula nang ipanganak
  rationale: Malinaw at likas na Filipino ito para sa pagkabulag na taglay na niya mula pa sa kapanganakan.
theological_decisions:
- issue: Kasariang ipinahihiwatig ng ἄνθρωπον
  choice: isang lalaki
  alternative: isang tao
  rationale: Maaaring pangkalahatan ang salitang Griyego sa ibang konteksto, ngunit lalaki ang partikular na taong tinutukoy rito; pinananatili ng salin ang detalyeng iyon nang hindi nagdaragdag ng interpretasyong teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Hindi tahasang idinagdag ang pangalang Jesus sapagkat panghalip lamang ang nasa talatang Griyego at malinaw ang tinutukoy mula sa konteksto.
