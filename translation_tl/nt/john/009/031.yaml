  text: ⸀οἴδαμεν ὅτι ⸂ἁμαρτωλῶν ὁ θεὸς⸃ οὐκ ἀκούει, ἀλλ’ ἐάν τις θεοσεβὴς ᾖ καὶ τὸ θέλημα αὐτοῦ ποιῇ τούτου ἀκούει.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/031.yaml
  text: We know that God does not listen to sinners; but if anyone is God-fearing and does his will[a], he listens to him.
translation:
  language: tl
  text: Alam natin na hindi pinakikinggan ng Diyos ang mga makasalanan. Ngunit kung ang isang tao ay may takot sa Diyos[a] at gumagawa ng kalooban ng Diyos, siya ang pinakikinggan ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sumasamba sa Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: Alam natin
  rationale: Ang anyong perpekto na οἶδα ay may pangkasalukuyang diwa sa Koine; natural at tuwiran ang “Alam natin.”
- source_word: ἁμαρτωλῶν
  choice: ang mga makasalanan
  rationale: Tumutukoy ang pangmaramihang henitibo sa uri ng mga taong hindi pinakikinggan; pinananatili ng “mga makasalanan” ang moral at panrelihiyong bigat ng salita.
- source_word: ἀκούει
  choice: pinakikinggan
  rationale: Sa konteksto, hindi lamang pisikal na pagkarinig ang kahulugan kundi ang pakikinig nang may pagsang-ayon o pagtugon. Hindi ito pinalawak hanggang sa tiyak na “sinasagot.”
- source_word: θεοσεβὴς
  choice: may takot sa Diyos
  rationale: Ipinahahayag nito ang paggalang at pagpipitagan sa Diyos. Natural ito sa modernong Tagalog at hindi nililimitahan ang diwa sa gawaing pagsamba lamang.
- source_word: τὸ θέλημα αὐτοῦ ποιῇ
  choice: gumagawa ng kanyang kalooban
  rationale: Malapit ito sa idyomang Griyego at malinaw sa Tagalog; ang “kanyang” ay tumutukoy sa Diyos.
- source_word: τούτου ἀκούει
  choice: siya ang pinakikinggan ng Diyos
  rationale: Binibigyang-diin ng τούτου ang taong inilarawan sa naunang sugnay. Ang ayos na ito ay malinaw sa Tagalog at pinananatili ang pag-uulit ng ἀκούει.
- source_word: ἀλλ’ ἐάν τις
  choice: Ngunit kung ang isang tao
  rationale: Malinaw nitong ipinapasok ang kasalungat na kondisyong tumutukoy sa sinumang tao.
theological_decisions:
- issue: Saklaw ng pahayag na hindi pinakikinggan ng Diyos ang mga makasalanan
  choice: Isinalin ang pahayag ayon sa mismong lakas nito, nang hindi nilalambutan o ginagawang pangkalahatang sistematikong doktrina.
  alternative: Hindi dinirinig ng Diyos ang mga panalangin ng mga makasalanan; hindi kinalulugdan ng Diyos ang mga makasalanan.
  rationale: Payak na sinasabi ng Griyego na hindi “nakikinig” ang Diyos sa mga makasalanan, kasalungat ng pakikinig niya sa taong may takot sa Diyos at gumagawa ng kanyang kalooban. Dapat manatili ang tensiyong ito bilang pahayag ng nagsasalita sa konteksto.
- issue: Kahulugan ng θεοσεβής
  choice: may takot sa Diyos
  alternative: sumasamba sa Diyos
  rationale: Mas pinananatili ng pangunahing salin ang malawak na diwa ng pagpipitagan sa Diyos. Inilalagay sa talababa ang leksikal na alternatibo na nakatuon sa pagsamba.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “pinakikinggan” upang ipakita ang paborableng pakikinig nang hindi labis na binibigyang-kahulugang “sinasagot.” Ang lahat ng panghalip na tumutukoy sa Diyos ay nasa karaniwang maliit na titik, habang malinaw ang reperensiya sa pangungusap.
