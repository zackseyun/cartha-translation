  to: Alam natin na hindi pinakikinggan ng Diyos ang mga makasalanan. Ngunit kung ang isang tao ay may takot sa Diyos[a] at gumagawa ng kalooban ng Diyos, siya ang pinakikinggan ng Diyos.
