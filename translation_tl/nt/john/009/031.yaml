    issue: Malabo ang tinutukoy ng “kanyang kalooban.”
    rationale: Sa Tagalog, pinakamalapit na maaaring pag-ugnayin ang “kanyang” sa “isang tao,” samantalang ang αὐτοῦ ay tumutukoy sa Diyos. Ang tahasang “kalooban ng Diyos” ay nag-aalis ng kalabuan nang hindi nagdaragdag ng kahulugan.
