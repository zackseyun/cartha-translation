  text: They brought the man who had formerly been blind to the Pharisees[a].
translation:
  language: tl
  text: Dinala nila sa mga Pariseo ang lalaking dating bulag.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄγουσιν
  choice: Dinala nila
  rationale: Ang pangkasalukuyang anyo sa Griyego ay historical present; ang pangnagdaan na “Dinala” ang natural na gamit sa salaysay sa Tagalog.
- source_word: αὐτὸν
  choice: ang lalaking
  rationale: Bagaman literal na “siya,” likas sa Tagalog na pagsamahin ito sa kasunod na pariralang tumutukoy sa kanya bilang lalaki.
- source_word: πρὸς τοὺς Φαρισαίους
  choice: sa mga Pariseo
  rationale: Ipinapahayag ng πρός na may accusative ang pagdadala patungo sa mga tao; tuwiran at natural ang “sa mga Pariseo.”
- source_word: Φαρισαίους
  choice: mga Pariseo
  rationale: Ito ang karaniwang katawagang Tagalog sa pangkat na ito.
- source_word: τόν ποτε τυφλόν
  choice: ang lalaking dating bulag
  rationale: Substantival ang parirala at inilalarawan ang dating kalagayan ng lalaki; malinaw at maikli ang “lalaking dating bulag.”
- source_word: ποτε
  choice: dating
  rationale: Malinaw nitong ipinakikita ang kaibahan ng dati niyang pagkabulag sa kasalukuyan niyang kalagayan.
- source_word: τυφλόν
  choice: bulag
  rationale: Tuwirang katumbas ng pang-uri para sa dati niyang kalagayan.
