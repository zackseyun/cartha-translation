  yaml_path: translation/nt/john/009/019.yaml
  text: And they asked them, saying, “Is this your son, whom you say was born blind? How then does he now see?”
translation:
  language: tl
  text: Tinanong nila ang mga magulang, “Ito ba ang anak ninyong lalaki na sinasabi ninyong ipinanganak na bulag? Kung gayon, paano siya nakakakita ngayon?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠρώτησαν αὐτοὺς λέγοντες
  choice: Tinanong nila ang mga magulang
  rationale: Ang ἠρώτησαν ay tuwirang ‘tinanong.’ Ang reperent ng αὐτούς ay ang mga magulang mula sa naunang konteksto; ginawang tahasan ito sa Tagalog para maging malinaw. Hindi na hiwalay na isinalin ang λέγοντες sapagkat likas nang ipinakikilala ng ‘tinanong’ ang kasunod na tuwirang tanong.
- source_word: Οὗτός ἐστιν ὁ υἱὸς ὑμῶν
  choice: Ito ba ang anak ninyo
  rationale: Bagaman anyong paturol sa Griyego, malinaw na patanong ang gamit nito sa konteksto. Ang ‘ba’ ang likas na panandang patanong sa modernong Tagalog.
- source_word: ὃν ὑμεῖς λέγετε ὅτι τυφλὸς ἐγεννήθη
  choice: na sinasabi ninyong ipinanganak na bulag
  rationale: Pinananatili ng ‘sinasabi ninyo’ ang neutral na λέγετε at ang diin sa ὑμεῖς nang hindi nagdaragdag ng pag-aalinlangan gaya ng ‘iginigiit.’ Ang ‘ipinanganak na bulag’ ay malinaw at likas para sa congenital blindness.
- source_word: πῶς οὖν
  choice: Kung gayon, paano
  rationale: Ipinahahayag ng ‘kung gayon’ ang inferensiyal na puwersa ng οὖν at maayos na nag-uugnay sa ikalawang tanong sa naunang pahayag.
- source_word: βλέπει ἄρτι
  choice: nakakakita ngayon
  rationale: Ang ‘nakakakita’ ay tumutukoy sa kasalukuyang aktuwal na pagkakita, hindi lamang sa posibilidad o kakayahan; ang ‘ngayon’ ay nagpapanatili sa temporal na paghahambing ng ἄρτι.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang ‘anak’ sa halip na ‘anak na lalaki’ dahil malinaw sa konteksto ang kasarian at mas likas ito sa Tagalog. Walang kailangang talababa.
