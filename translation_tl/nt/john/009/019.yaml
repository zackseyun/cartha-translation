    rationale: Ang “anak” ay maaaring lalaki o babae sa Tagalog, samantalang ang Griyego ay “anak na lalaki.” Ligtas at likas idagdag ang “lalaki.”
  - severity: low
    issue: Ang “na” sa “paano na siya nakakakita ngayon?” ay hindi kailangan.
    rationale: Maaaring magpahiwatig ang “na” ng dagdag na aspektong ‘already’ o pagbabago. Sapat ang “ngayon” para sa ἄρτι.
