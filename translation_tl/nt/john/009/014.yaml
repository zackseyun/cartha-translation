  text: ἦν δὲ σάββατον ⸂ἐν ᾗ ἡμέρᾳ⸃ τὸν πηλὸν ἐποίησεν ὁ Ἰησοῦς καὶ ἀνέῳξεν αὐτοῦ τοὺς ὀφθαλμούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/014.yaml
  text: It was a Sabbath on the day when Jesus made the mud and opened his eyes.
translation:
  language: tl
  text: Araw iyon ng Sabbath nang gumawa si Jesus ng putik[a] at binuksan niya ang mga mata ng lalaki.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “luwad.”
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “binuksan ang kaniyang mga mata,” isang kongkretong paglalarawan sa pagpapagaling.
    reason: lexical_alternative
lexical_decisions:
- source_word: σάββατον
  choice: araw ng Sabbath
  rationale: Likas sa modernong Tagalog ang “araw ng Sabbath” at malinaw na tumutukoy sa araw sa kalendaryo nang hindi nagpapasok ng paliwanag tungkol sa kautusan ng Sabbath.
- source_word: ἐν ᾗ ἡμέρᾳ
  choice: nang
  rationale: 'Ipinahahayag ng “nang” ang ugnayang temporal sa natural at maikling paraan: iyon ang araw nang gawin ni Jesus ang mga kilos na binanggit.'
- source_word: πηλόν
  choice: putik
  rationale: Sa konteksto ng lupang hinaluan ng laway, “putik” ang pinakanatural na karaniwang salita; nananatiling posibleng alternatibo ang “luwad.”
- source_word: ἐποίησεν
  choice: gumawa
  rationale: Tuwirang katumbas ito ng karaniwang kahulugan ng ποιέω at angkop sa paggawa ng putik.
- source_word: ἀνέῳξεν
  choice: buksan
  rationale: Pinananatili nito ang kongkretong larawang “binuksan ang mga mata” sa halip na ipalit ang mas interpretatibong “ibinalik ang paningin.”
- source_word: αὐτοῦ τοὺς ὀφθαλμούς
  choice: ang mga mata ng lalaki
  rationale: Nililinaw nito sa Tagalog na ang tinutukoy ng panghalip ay ang lalaking pinagaling, habang pinananatili ang kongkretong pagtukoy sa kaniyang mga mata.
- source_word: δὲ
  choice: Noon ay
  rationale: Ang banayad na paglipat sa salaysay ay ipinahihiwatig ng natural na panimulang temporal na parirala; hindi ginawang mariing “ngunit” ang δέ.
theological_decisions:
- issue: Ang pagbanggit sa Sabbath kaugnay ng pagpapagaling ni Jesus
  choice: Isinalin bilang payak na pabatid na araw ng Sabbath nang gawin ni Jesus ang putik at buksan ang mga mata ng lalaki.
  alternative: Dagdagan ng paliwanag tungkol sa kautusan o sa nalalapit na pagtatalo hinggil sa Sabbath.
  rationale: Inihahanda ng talata ang susunod na pagtatalo ngunit hindi pa nito ipinapaliwanag o hinahatulan ang usapin; kaya pinananatili ang tensiyong nasa salaysay nang walang idinagdag na doktrinal na interpretasyon.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “Sabbath” bilang pamilyar na terminong biblikal, at iniwasan ang mabigat o makalumang ayos. Ang “mga mata ng lalaki” ay natural na paglilinaw sa reperente ng Griyegong panghalip.
