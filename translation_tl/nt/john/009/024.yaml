  naturalness: Natural at marangal ang “Kaya muli nilang tinawag” at “lalaking dating bulag.” Ang “Ibigay mo ang kaluwalhatian sa Diyos” ay malinaw at angkop sa rehistrong biblikal na modernong Filipino Tagalog. Ang “Ang taong ito ay isang makasalanan” ay mas likas at di-malitó kaysa sa paggamit ng pang-uring “makasalanan” bilang buong panaguri sa kasong ito.
  terminology: Pinananatili ang “Diyos” at “kaluwalhatian” para sa δόξα at θεός. Isinalin ang ἁμαρτωλός bilang “isang makasalanan” upang maipakita ang personal na paratang, hindi lamang isang abstraktong katangiang moral. Pinananatili ng talababa ang posibleng idyomatikong panawagan sa katapatan nang hindi ipinapalit iyon sa literal na pangunahing teksto.
