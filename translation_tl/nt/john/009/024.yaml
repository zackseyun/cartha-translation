base_translation:
  language: en
  yaml_path: translation/nt/john/009/024.yaml
  text: So they called the man who had been blind a second time and said to him[a], “Give glory to God; we know that this man is a sinner.”
translation:
  language: tl
  text: Kaya muli nilang tinawag ang lalaking dating bulag at sinabi sa kanya, “Ibigay mo ang kaluwalhatian sa Diyos[a]. Alam namin na ang taong ito ay isang makasalanan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O maaaring isang idyomatikong panawagan ang pahayag na ito: “Sabihin mo ang totoo sa harap ng Diyos” o “Magtapat ka nang hayagan sa harap ng Diyos.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐφώνησαν
  choice: tinawag
  rationale: Likas na katumbas ito ng φωνέω sa konteksto ng muling pagpapatawag sa lalaki; ang “ipinatawag” ay maaaring magpahiwatig ng mas pormal na kapangyarihang hindi tahasang nasa pandiwa.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinakikita nito ang pagsulong at bunga ng naunang usapan, habang nananatiling natural sa makabagong Tagalog.
- source_word: ἐκ δευτέρου
  choice: muli
  rationale: Natural at maikli itong pagpapahayag ng “sa ikalawang pagkakataon” sa Tagalog; malinaw sa konteksto na muli siyang tinawag.
- source_word: ὃς ἦν τυφλός
  choice: dating bulag
  rationale: Ipinahihiwatig nitong bulag siya noon ngunit hindi na ngayon, alinsunod sa konteksto ng pagpapagaling.
- source_word: Δὸς δόξαν τῷ θεῷ
  choice: Luwalhatiin mo ang Diyos
  rationale: Pinananatili nito ang literal na anyo at teolohikal na bigat ng Griyego, samantalang inilalagay sa talababa ang malamang na idyomatikong diwa nito bilang taimtim na panawagang magsabi ng totoo.
- source_word: ἡμεῖς οἴδαμεν
  choice: Alam namin
  rationale: Tuwirang pinananatili ang iginiit na katiyakan ng mga nagsasalita at ang diin ng tahasang panghalip na ἡμεῖς.
- source_word: οὗτος ὁ ἄνθρωπος
  choice: ang taong ito
  rationale: Natural at tumpak na salin ito na hindi nagdaragdag ng mapanghamak na himig na hindi tahasang hinihingi ng Griyego.
- source_word: ἁμαρτωλός
  choice: makasalanan
  rationale: Karaniwang pangngalang panaguri ito sa Tagalog para sa taong itinuturing na nagkakasala, at pinananatili nito ang tuwirang paratang.
theological_decisions:
- issue: Idyomatikong bisa ng Δὸς δόξαν τῷ θεῷ
  choice: Panatilihin sa pangunahing teksto ang literal na “Luwalhatiin mo ang Diyos”
  alternative: Isalin nang tuwiran ang idyoma bilang “Sabihin mo ang totoo sa harap ng Diyos” o “Magtapat ka sa harap ng Diyos”
  rationale: Malamang na isang taimtim na panunumpang humihiling ng katotohanan o pagtatapat ang parirala, ngunit ang mismong salitang Griyego ay tumutukoy sa pagbibigay-luwalhati sa Diyos. Pinananatili ng pangunahing teksto ang tunay na anyo at tensiyon ng pahayag, at ipinapaliwanag ng talababa ang posibleng idyomatikong diwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “dating bulag” upang likas na ipakita ang dati ngunit nagbago nang kalagayan ng lalaki. Ang literal na utos tungkol sa pagluluwalhati sa Diyos ay pinanatili sa teksto, at ang idyomatikong kahulugan ay inilagay sa talababa.
