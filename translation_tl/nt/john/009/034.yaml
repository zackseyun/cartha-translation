source:
  edition: SBLGNT
  text: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Ἐν ἁμαρτίαις σὺ ἐγεννήθης ὅλος, καὶ σὺ διδάσκεις ἡμᾶς; καὶ ἐξέβαλον αὐτὸν ἔξω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/034.yaml
  text: They answered and said to him[a], “You were born entirely in sins[c][b], and are you teaching us?” And they cast him out.
translation:
  language: tl
  text: Sumagot sila sa kanya, “Ipinanganak kang lubos na nasa mga kasalanan,[a] at ikaw pa ang nagtuturo sa amin?” At itinaboy nila siya palabas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ipinanganak kang lubos na nasa kasalanan.” Pangmaramihan sa Griyego ang “mga kasalanan,” na nagpapanatili sa tindi ng kanilang pang-iinsulto.
    reason: lexical_alternative
  - marker: b
    text: Ang pagpapaalis sa kanya ay maaaring tumukoy sa pagtataboy mula sa kanilang harapan at, ayon sa konteksto, maaari ring magpahiwatig ng pagkakahiwalay niya sa pamayanan ng sinagoga.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: Sumagot sila sa kanya
  rationale: Sa natural na modernong Tagalog, sapat na ang “sumagot” upang maipahayag ang tambalang pormulang Griyego na literal na “sumagot at nagsabi”; ang pag-uulit na “sumagot at sinabi” ay magiging alanganin.
- source_word: Ἐν ἁμαρτίαις
  choice: nasa mga kasalanan
  rationale: Pinananatili ang pangmaramihang ἁμαρτίαις (“mga kasalanan”) at ang mapanumbat na anyo ng paratang, sa halip na gawing pangkalahatang “makasalanan” o isahang “kasalanan.”
- source_word: ἐγεννήθης ὅλος
  choice: Ipinanganak kang lubos na
  rationale: Ipinahahayag ng “lubos” ang diin ng ὅλος sa buong kalagayan ng lalaki mula nang ipanganak, habang nananatiling malinaw at marangal ang Tagalog.
- source_word: καὶ σὺ διδάσκεις ἡμᾶς;
  choice: at ikaw pa ang nagtuturo sa amin?
  rationale: Ang “ikaw pa” ay natural na naghahatid ng mariing σὺ at ng mapanghamak na retorikal na tanong.
- source_word: ἐξέβαλον αὐτὸν ἔξω
  choice: itinaboy nila siya palabas
  rationale: Ang “itinaboy … palabas” ay malinaw na nagpapahayag ng marahas o mapanghamak na pagpapaalis at tumutugma sa pleonastikong ἐξέβαλον … ἔξω.
theological_decisions:
- issue: Kahulugan ng paratang na ipinanganak siyang lubos na nasa mga kasalanan
  choice: Iniwan itong bilang mapanlait na paratang na ang buong kalagayan niya mula kapanganakan ay nauugnay sa “mga kasalanan.”
  alternative: Ipinanganak kang makasalanan; ipinanganak ka sa kasalanan; ipinanganak ka dahil sa kasalanan ng iyong mga magulang.
  rationale: Hindi tinutukoy ng Griyego kung sariling kasalanan, minanang kasalanan, o kasalanan ng mga magulang ang nasa isip ng mga nagsasalita. Pinananatili ng salin ang tensiyong ito at hindi nagdaragdag ng paliwanag na doktrinal.
- issue: Saklaw ng pagpapaalis
  choice: itinaboy nila siya palabas
  alternative: tiwalag siya sa sinagoga
  rationale: Tiyak sa teksto ang pagpapaalis, ngunit hindi nito tahasang sinasabi rito na pormal siyang itiniwalag sa sinagoga. Ang posibleng mas malawak na kahulugan ay inilagay sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “ikaw pa” upang natural na ihatid ang mariing, mapanghamak na tono; iniwasan ang sobrang teknikal o denominasyonal na pananalita.
