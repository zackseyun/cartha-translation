base_translation:
  language: en
  yaml_path: translation/nt/john/009/020.yaml
  text: So his parents answered and said[a], “We know that this is our son and that he was born blind.
translation:
  language: tl
  text: Kaya sumagot ang kanyang mga magulang at sinabi, “Alam naming anak namin siya at ipinanganak siyang bulag.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Ipinakikita ang lohikal at pasalaysay na pagpapatuloy mula sa pagtatanong sa naunang talata; natural ito sa modernong Tagalog.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: ang kanyang mga magulang
  rationale: Tumpak at likas na kolektibong tawag sa ama at ina ng lalaki.
- source_word: ἀπεκρίθησαν ... καὶ εἶπαν
  choice: sumagot ... at sinabi
  rationale: Pinananatili ang dalawang pandiwa at ang katangiang diskurso ng Griyego nang hindi nagiging di-likas sa Tagalog.
- source_word: Οἴδαμεν
  choice: Alam namin
  rationale: Tuwirang nagpapahayag ng kaalaman at katiyakan ng mga magulang.
- source_word: οὗτός ἐστιν ὁ υἱὸς ἡμῶν
  choice: anak namin siya
  rationale: Natural na ayos sa Tagalog para sa malinaw na pagkilala sa taong tinutukoy; ang panghalip na “siya” ay sapat na kumakatawan sa demonstratibong οὗτος sa konteksto.
- source_word: τυφλὸς ἐγεννήθη
  choice: ipinanganak siyang bulag
  rationale: Tuwiran, maikli, at idiomatikong salin ng predikatibong pang-uri at pasibong pandiwa; pinananatili ang diwang bulag na siya nang ipanganak.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang dobleng pormulang “sumagot ... at sinabi” dahil kapansin-pansin ito sa tekstong Griyego. Hindi isinama ang footnote ng English consultation layer sapagkat ang ibinigay nitong alternatibo ay kapareho lamang ng kahulugan at hindi nangangailangan ng paliwanag sa natural na saling Tagalog.
