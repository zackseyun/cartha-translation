  to: Narinig ng ilan sa mga Pariseong kasama niya ang mga bagay na ito, at sinabi nila sa kanya, “Hindi rin naman kami bulag, hindi ba?”[a]
  rationale: Inayos ang posisyon ng “rin” upang maging likas ang Tagalog habang malinaw na naipapahayag ang “kami rin” ng καὶ ἡμεῖς. Pinalitan din ang “ito” ng “ang mga bagay na ito” upang mapanatili ang pangmaramihang ταῦτα. Walang binagong kahulugang teolohikal o idinagdag na interpretasyong wala sa teksto.
