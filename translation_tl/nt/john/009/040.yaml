  source_fidelity: Tumpak na naipapahayag ng draft ang partitive na “ilan sa mga Pariseo,” ang mga Pariseong kasama ni Jesus, at ang negatibong inaasahan ng tanong na may μή. Gayunman, ang ayos na “bulag din” sa pangunahing tanong ay hindi ang pinakanatural na paglalagay ng pang-abay na “rin/din” sa modernong Filipino. Ang “rin naman” ay mas malinaw na naghahatid ng καί (“rin/too”) at ng mapagtutol na negatibong tanong.
  naturalness: Ang “Narinig ... ito” ay nauunawaan, ngunit ang “ang mga bagay na ito” ay mas malinaw na kumakatawan sa pangmaramihang ταῦτα nang hindi nagiging di-likas. Ang “Hindi rin naman kami bulag, hindi ba?” ay mas natural at marangal na Filipino kaysa “Hindi naman kami bulag din, hindi ba?”
  terminology: Ang “Pariseo” at “bulag” ay angkop. Hindi idinagdag ang “espirituwal,” kaya napananatili ang di-tahasang metapora at ang ironiya ng konteksto.
  issues:
