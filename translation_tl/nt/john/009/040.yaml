  - severity: low
    issue: Pang-isahang “ito” para sa ταῦτα
    rationale: Posible ang kolektibong “ito” sa Filipino, ngunit ang “ang mga bagay na ito” ay ligtas na pinananatili ang pangmaramihang saklaw ng demonstratibo at ang pagtukoy nito sa mga naunang sinabi ni Jesus.
