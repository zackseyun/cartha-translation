  text: ⸀ἤκουσαν ἐκ τῶν Φαρισαίων ταῦτα οἱ ⸂μετ’ αὐτοῦ ὄντες⸃, καὶ εἶπον αὐτῷ· Μὴ καὶ ἡμεῖς τυφλοί ἐσμεν;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/040.yaml
  text: Some of the Pharisees who were with him heard these things and said to him[a], “Surely we are not blind too, are we?”
translation:
  language: tl
  text: Narinig ng ilan sa mga Pariseong kasama niya ang mga bagay na ito, at sinabi nila sa kanya, “Hindi rin naman kami bulag, hindi ba?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Hindi naman din kami bulag, hindi ba?” Ang tanong sa Griyego ay gumagamit ng μή, na nagpapahiwatig na “hindi” ang inaasahang sagot.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσαν
  choice: Narinig
  rationale: Ang aorist na ἤκουσαν ay tumutukoy sa pagkarinig sa sinabi ni Jesus; natural sa salaysay ang “Narinig.”
- source_word: ἐκ τῶν Φαρισαίων
  choice: ilan sa mga Pariseo
  rationale: Ipinahihiwatig ng partitive na ἐκ na isang bahagi lamang ng mga Pariseo ang tinutukoy, hindi silang lahat.
- source_word: ταῦτα
  choice: ito
  rationale: Bagaman pangmaramihan ang anyong Griyego, likas sa Tagalog ang pang-isahang “ito” kapag tumutukoy sa kabuuan ng mga kasasabi pa lamang.
- source_word: οἱ μετ’ αὐτοῦ ὄντες
  choice: mga Pariseong kasama niya
  rationale: Maikli at natural itong salin ng pariralang tumutukoy sa mga Pariseong naroon kasama ni Jesus.
- source_word: εἶπον αὐτῷ
  choice: sinabi nila sa kanya
  rationale: Pinananatili nito ang karaniwang kahulugan ng λέγω; malinaw na tanong ang kasunod na tuwirang pananalita.
- source_word: Μὴ καὶ ἡμεῖς τυφλοί ἐσμεν;
  choice: Hindi naman kami bulag din, hindi ba?
  rationale: Ang negatibong tanong na may μή ay umaasa sa sagot na hindi. Ipinahahayag ito ng “hindi naman” at ng hulaping tanong na “hindi ba?” nang hindi inaalis ang pagkagulat o pagtutol.
- source_word: καὶ
  choice: din
  rationale: Iniuugnay nito ang mga nagsasalita sa mga bulag na tinutukoy sa naunang pahayag.
- source_word: τυφλοί
  choice: bulag
  rationale: Pinananatili ang payak na salita ng Griyego upang manatili ang metapora at ironiya sa konteksto, sa halip na idagdag ang “espirituwal.”
theological_decisions:
- issue: Kung gagawing tahasan ang metaporikal na kahulugan ng τυφλοί
  choice: Panatilihin ang “bulag” nang walang dagdag na “espirituwal” sa pangunahing teksto
  alternative: “bulag sa espirituwal”
  rationale: Malinaw sa konteksto ang metaporikal na gamit, ngunit walang katumbas na salitang “espirituwal” sa Griyego. Ang payak na “bulag” ay nagpapanatili sa ironiya at tensiyong teolohikal ng salaysay.
- issue: Ang inaasahang sagot sa tanong na may μή
  choice: Ihayag ang inaasahang negatibong sagot sa anyong “Hindi naman ... hindi ba?”
  alternative: “Bulag din ba kami?”
  rationale: Ang payak na positibong tanong ay hindi lubos na naghahatid ng negatibong inaasahan at mapagtutol na himig ng μή.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Pariseo” at karaniwang ayos ng pangungusap; iniwasan ang tahasang interpretasyong “bulag sa espirituwal.”
