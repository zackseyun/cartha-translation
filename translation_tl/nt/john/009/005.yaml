  text: While I am in the world, I am the light of the world.
translation:
  language: tl
  text: Habang nasa sanlibutan ako, ako ang ilaw ng sanlibutan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν
  choice: Habang
  rationale: Sa kontekstong ito, ipinapahayag nito ang panahong nananatili si Jesus sa sanlibutan; natural sa Filipino ang “Habang” at tumutugma sa temporal na diwa ng sugnay.
- source_word: κόσμος
  choice: sanlibutan
  rationale: Ang “sanlibutan” ay dignidad at karaniwang terminong biblikal para sa κόσμος, at napapanatili ang pag-uulit nito sa talata.
- source_word: φῶς
  choice: ilaw
  rationale: Direkta at natural na katumbas ng φῶς, habang pinananatili ang metaporang ginamit ni Jesus.
theological_decisions:
- issue: Saklaw ng temporal na ὅταν
  choice: Habang nasa sanlibutan ako
  alternative: Kapag nasa sanlibutan ako
  rationale: Bagaman maaaring literal na mangahulugang “kapag/kailanman,” ipinahihiwatig ng konteksto ang kasalukuyang panahon ng pananatili at gawain ni Jesus sa sanlibutan. Hindi dinaragdagan ng salin ang paliwanag tungkol sa patuloy niyang pagkakaugnay sa sanlibutan matapos ang kanyang pag-alis.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang maikli at mariing ayos na “ako ang ilaw ng sanlibutan,” pati ang pag-uulit ng “sanlibutan.”
