id: JHN.9.36
reference: John 9:36
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀπεκρίθη ἐκεῖνος καὶ εἶπεν· Καὶ τίς ἐστιν, κύριε, ἵνα πιστεύσω εἰς αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/036.yaml
  text: He answered and said[a], “And who is he, Lord, that I may believe in him?”
translation:
  language: tl
  text: Sumagot siya, “At sino po siya, Panginoon[a], upang sumampalataya ako sa kanya?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ginoo.” Ang salitang Griyego na κύριε ay maaari ring maging magalang na pantawag.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη ἐκεῖνος καὶ εἶπεν
  choice: Sumagot siya
  rationale: Ang literal na tambalang “sumagot at nagsabi” ay karaniwang pormula sa salaysay na Griyego ngunit mabigat sa natural na Tagalog. Sapat na ipinahahayag ng “Sumagot siya” ang buong tungkulin nito.
- source_word: Καὶ τίς ἐστιν
  choice: At sino po siya
  rationale: Pinananatili ang panimulang καὶ bilang “At,” habang ang “po” ay likas na nagpapahayag ng magalang na pakikipag-usap sa Tagalog.
- source_word: κύριε
  choice: Panginoon
  rationale: Ito ang karaniwang katumbas ng κύριε at pinananatili ang posibleng teolohikal na bigat nito. Gayunman, maaari rin itong maging magalang na tawag na katumbas ng “ginoo,” kaya itinatala ang kahulugang iyon sa talababa.
- source_word: ἵνα πιστεύσω εἰς αὐτόν
  choice: upang sumampalataya ako sa kanya
  rationale: Ang “upang” ay nagpapanatili sa layuning ipinahahayag ng ἵνα at ang “sumampalataya ... sa” ay malinaw at nakaugaliang salin ng πιστεύω εἰς.
theological_decisions:
- issue: Kahulugan ng κύριε bago ang hayagang pagkilala ng lalaking pinagaling
  choice: Panginoon
  alternative: ginoo
  rationale: Maaaring tumukoy ang κύριε sa “Panginoon” o magsilbing magalang na pantawag. Hindi tiyak sa puntong ito ng salaysay kung gaano na kalalim ang pagkilala ng lalaki kay Jesus, kaya pinanatili sa pangunahing teksto ang tradisyonal na “Panginoon” at inilagay sa talababa ang ibang posibilidad.
translation_notes:
  register: Modernong Filipino na magalang at marangal. Ginamit ang “po” para maging likas sa Tagalog ang magalang na pakikipag-usap; hindi nito inaalis ang kalabuan ng κύριε, na pinananatili sa talababa. Ang marker na [a] ay nasa pangunahing teksto.
