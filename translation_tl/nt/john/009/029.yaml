id: JHN.9.29
reference: John 9:29
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἡμεῖς οἴδαμεν ὅτι Μωϋσεῖ λελάληκεν ὁ θεός, τοῦτον δὲ οὐκ οἴδαμεν πόθεν ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/029.yaml
  text: We know that God has spoken to Moses[a], but as for this man, we do not know where he is from.
translation:
  language: tl
  text: Alam naming nagsalita ang Diyos kay Moises; ngunit tungkol sa taong ito, hindi namin alam kung saan siya nagmula.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kung saan siya nanggaling.” Sa Ebanghelyo ni Juan, ang mga tanong tungkol sa pinagmulan ni Jesus ay maaaring tumukoy kapwa sa karaniwang pinanggalingan at sa mas malalim na kahulugang teolohikal.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  choice: naming
  rationale: Ang tahasang panghalip ay may diin at paghahambing; naipahihiwatig ito sa natural na Filipino sa pamamagitan ng “Alam naming,” kasabay ng kasunod na pagsalungat.
- source_word: οἴδαμεν
  choice: alam namin
  rationale: Tuwirang nagpapahayag ito ng kaalaman o katiyakan at inuulit nang pareho sa dalawang sugnay.
- source_word: Μωϋσεῖ
  choice: kay Moises
  rationale: Karaniwang anyo ng pangalang Moses sa Filipino; ipinahihiwatig ng “kay” ang di-tuwirang layon ng pagsasalita.
- source_word: λελάληκεν
  choice: nagsalita
  rationale: Natural at dignified sa Filipino. Bagaman perpekto ang aspektong Griyego at tumutukoy sa isang kinikilalang pangyayaring may nananatiling bisa, hindi natural na markahan iyon nang tahasan dito sa Filipino.
- source_word: ὁ θεός
  choice: ang Diyos
  rationale: Karaniwang tiyak na pagtukoy sa Diyos sa Filipino at tumutugma sa tiyak na simuno sa Griyego.
- source_word: τοῦτον δὲ
  choice: ngunit tungkol sa taong ito
  rationale: Pinananatili ang pagsalungat at paglilipat ng paksa, pati ang bahagyang mapaglayong tono ng demonstratibo.
- source_word: οὐκ οἴδαμεν
  choice: hindi namin alam
  rationale: Pinananatili ang tahasang pag-uulit ng pandiwang ginamit sa unang sugnay.
- source_word: πόθεν ἐστίν
  choice: kung saan siya nagmula
  rationale: Natural na Filipino na nagpapanatili sa malawak na diwa ng pinagmulan nang hindi nililimitahan ito sa heograpiya lamang.
theological_decisions:
- issue: Ang kahulugan ng pinagmulan ni Jesus sa πόθεν ἐστίν
  choice: “kung saan siya nagmula” nang hindi nilulutas kung heograpikal lamang o may mas malalim na kahulugang teolohikal
  alternative: “kung saan siya nanggaling” o “kung ano ang kanyang pinagmulan”
  rationale: Sa Juan, ang mga tanong tungkol sa pinagmulan ni Jesus ay maaaring magkaroon ng karaniwan at mas malalim na kahulugan. Pinananatili ng salin ang ironiya at tensiyong ito nang hindi nagdaragdag ng paliwanag sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang “ngunit” para sa dignified na pagsalungat at “taong ito” upang mapanatili ang mapaglayong tono nang hindi ginagawang labis na mapanlait.
