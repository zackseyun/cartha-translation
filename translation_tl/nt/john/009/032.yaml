  - severity: medium
    issue: Mali ang ugnayang panggramatika sa “nagbukas sa mga mata.”
    rationale: Ang “mga mata” ang layon ng pandiwang “nagbukas”; ang wastong likas na anyo ay “nagbukas ng mga mata ng …”.
  revised_text: Mula pa noong una, hindi pa kailanman narinig na may sinumang nagbukas ng mga mata ng isang taong ipinanganak na bulag.[a]
