  source_fidelity: Ang “nabalita” ay maaaring magpahiwatig ng ulat-balita, samantalang ang οὐκ ἠκούσθη ay ang nakasanayang idyomang “hindi pa kailanman narinig.” Higit na malapit at likas ang “narinig.” Gayundin, ang “nagbukas sa mga mata” ay hindi wastong pagmamarka ng layon; ang mga mata ang tuwirang layon ng ἠνέῳξέν.
  naturalness: Mas natural at malinaw sa makabagong Filipino ang “hindi pa kailanman narinig” at “nagbukas ng mga mata ng isang taong ipinanganak na bulag.” Pinananatili nito ang marangal ngunit payak na rehistro.
  terminology: Napananatili ang konkretong pandiwang “nagbukas” at ang paglalarawang “ipinanganak na bulag,” nang hindi ipinapalit ang mapagpaliwanag na “nagpagaling.” Ang “Mula pa noong una” ay isang maikli at likas na katumbas ng makasaysayang idyomang ἐκ τοῦ αἰῶνος.
