base_translation:
  language: en
  yaml_path: translation/nt/john/009/032.yaml
  text: From of old it has never been heard that anyone opened the eyes of one born blind[a].
translation:
  language: tl
  text: Mula pa noong una, hindi pa kailanman narinig na may sinumang nagbukas ng mga mata ng isang taong ipinanganak na bulag.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Mula nang pasimula ng daigdig, hindi pa kailanman narinig …”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ αἰῶνος
  choice: Mula pa noong unang panahon
  rationale: Ipinapahayag ng idyoma ang buong saklaw ng naaalalang kasaysayan. Likas ito sa makabagong Tagalog at hindi nito ipinapasok ang mas matinding metapisikal na diwang “mula sa walang hanggan.”
- source_word: οὐκ ἠκούσθη
  choice: hindi pa kailanman nabalita
  rationale: Ang pasibong anyo ay tumutukoy sa isang pangyayaring hindi pa narinig o naibalita bilang naunang halimbawa. Pinananatili ng “nabalita” ang diwang pasibo at natural ito sa ganitong pahayag sa Tagalog.
- source_word: ὅτι
  choice: na
  rationale: Likas na panandang nagpapakilala sa nilalaman ng bagay na hindi pa nabalita.
- source_word: ἠνέῳξέν
  choice: nagbukas
  rationale: Tuwirang pinananatili ang karaniwang larawang “buksan ang mga mata,” sa halip na ipakahulugang “nagpagaling” o “nagpanumbalik.”
- source_word: τις
  choice: may sinumang
  rationale: Ang “sinuman” ay angkop sa di-tiyak na simuno sa loob ng pangkalahatang negatibong pahayag.
- source_word: ὀφθαλμοὺς
  choice: sa mga mata
  rationale: Ang “buksan ang mga mata” ay likas na idyoma sa Tagalog; ginagamit ang “sa” upang malinaw na iugnay ang mga mata sa taong ipinanganak na bulag.
- source_word: τυφλοῦ γεγεννημένου
  choice: ng isang taong ipinanganak na bulag
  rationale: Malinaw na inilalarawan nito na bulag na ang tao mula sa kapanganakan. Hindi kailangan ang salitang “lalaki,” sapagkat hindi tahasang ipinahahayag iyon ng pariralang Griyego rito.
theological_decisions:
- issue: Saklaw ng ἐκ τοῦ αἰῶνος
  choice: 'makasaysayang idyoma: “mula pa noong unang panahon”'
  alternative: “mula sa walang hanggan” o “mula nang likhain ang mundo”
  rationale: Ang nagsasalita ay tumutukoy sa kawalan ng anumang kilalang naunang pangyayari sa karanasan ng tao, hindi gumagawa ng metapisikal na pahayag tungkol sa eternidad. Iniiwan sa talababa ang tradisyonal ngunit bahagyang mas mapagpaliwanag na pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang retorikal na diin ng ganap na kawalan ng naunang halimbawa, gayundin ang konkretong larawang “nagbukas sa mga mata.”
