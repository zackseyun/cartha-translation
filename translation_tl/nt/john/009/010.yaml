translation:
  language: tl
  text: Kaya sinabi nila sa kanya, “Paano nabuksan ang mga mata mo?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: tinanong nila
  rationale: Bagaman imperpektibo ang anyo at literal na tumutukoy sa pagsasalita, tanong ang mismong sinabi; natural sa makabagong Tagalog ang “tinanong nila.” Hindi kailangang gawing tahasang paulit-ulit ang kilos dahil hindi tiyak na iyon ang diin ng imperpektibo rito.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinapakita ng “Kaya” ang bunga o lohikal na pagpapatuloy mula sa naunang pangyayari, sa natural na Tagalog.
- source_word: αὐτῷ
  choice: siya
  rationale: Ang panghalip na datibo ang taong pinatutungkulan ng tanong; likas itong ipinapahayag bilang tuwirang layon sa “tinanong nila siya.”
- source_word: Πῶς
  choice: Paano
  rationale: Tuwirang ipinahahayag ang tanong tungkol sa paraan o pangyayari.
- source_word: ἠνεῴχθησάν
  choice: nabuksan
  rationale: Ang “nabuksan” ay natural na Tagalog na nagpapanatili sa di-aktibong paglalahad ng Griyego nang hindi tinutukoy kung sino ang nagbukas.
- source_word: σου οἱ ὀφθαλμοί
  choice: ang mga mata mo
  rationale: Ito ang natural na ayos ng pariralang paari sa Tagalog; pinananatili ng “mga” ang maramihang bilang ng ὀφθαλμοί.
theological_decisions:
- issue: Hindi binanggit ang gumagawa sa pasibong pandiwa
  choice: “nabuksan ang mga mata mo”
  alternative: “sino ang nagbukas ng mga mata mo”
  rationale: Ang tanong sa Griyego ay tungkol sa kung paano nabuksan ang mga mata, hindi kung sino ang gumawa. Pinananatili ng salin ang saklaw ng tanong at hindi ipinapasok ang isang tahasang tagagawa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “tinanong” sa halip na mas literal na “sinabi” dahil interrogatibo ang kasunod na pahayag; pinanatili naman ang pasibong diwa sa “nabuksan.”
