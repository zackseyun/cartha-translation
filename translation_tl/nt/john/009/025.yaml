base_translation:
  language: en
  yaml_path: translation/nt/john/009/025.yaml
  text: 'So that man answered[a], “Whether he is a sinner, I do not know. One thing I do know: though I was blind, now I see.”'
translation:
  language: tl
  text: 'Kaya sumagot ang lalaking iyon, “Kung makasalanan siya o hindi, hindi ko alam. Isang bagay ang alam ko: dati akong bulag, ngunit nakakakita na ako ngayon.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη οὖν ἐκεῖνος
  choice: Kaya sumagot ang lalaking iyon
  rationale: Pinananatili ng “Kaya” ang ugnayang pandiskurso ng οὖν, ng “sumagot” ang karaniwang diwa ng ἀπεκρίθη, at ng “ang lalaking iyon” ang tahasang demonstratibong ἐκεῖνος na tumutukoy sa dating bulag.
- source_word: Εἰ ἁμαρτωλός ἐστιν
  choice: Kung siya ay makasalanan
  rationale: Sa Filipino, natural ang “kung” bilang panimula ng di-tuwirang tanong na kaugnay ng “hindi ko alam.” Hindi nito pinagtitibay o itinatanggi ang paratang kundi iniiwan ang usapin sa limitadong kaalaman ng nagsasalita.
- source_word: οὐκ οἶδα
  choice: hindi ko alam
  rationale: Direkta at likas na salin ng pandiwang may kasalukuyang diwa.
- source_word: ἓν οἶδα
  choice: Isang bagay ang alam ko
  rationale: Pinananatili ang mariing pagtutumbas sa naunang “hindi ko alam” nang hindi nagdaragdag ng salitang hindi kailangan sa natural na Filipino.
- source_word: τυφλὸς ὢν
  choice: dati akong bulag
  rationale: Ipinahahayag nang malinaw ang dating kalagayan na ikinukumpara sa kasalukuyan; ang temporal na “dati” ay natural na naghahatid ng kontekstuwal na diwa ng participial phrase.
- source_word: ἄρτι βλέπω
  choice: nakakakita na ako ngayon
  rationale: Ang “ngayon” ay tumutumbas sa ἄρτι sa paghahambing sa dating pagkabulag, at ang “nakakakita na” ay natural na Filipino para sa bagong kasalukuyang kakayahang makakita.
theological_decisions:
- issue: Paglalahad sa limitadong kaalaman ng lalaking pinagaling nang hindi nagpapasya sa talatang ito tungkol sa pagiging makasalanan ni Jesus
  choice: Kung siya ay makasalanan, hindi ko alam.
  alternative: Makasalanan man siya o hindi, hindi ko alam.
  rationale: Ang napiling anyo ay malapit sa εἰ at natural sa Filipino bilang di-tuwirang tanong. Pinananatili nito ang pag-aatubili ng nagsasalita at hindi ginagawang pahayag ng tagapagsalaysay ang kaniyang limitadong tugon.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “lalaking iyon” upang mapanatili ang demonstratibong diin, at ang “dati…ngayon” upang maging malinaw ang matinding paghahambing ng dating pagkabulag at kasalukuyang paningin.
