id: JHN.9.38
reference: John 9:38
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ ἔφη· Πιστεύω, κύριε· καὶ προσεκύνησεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/038.yaml
  text: And he said[a], “I believe[b], Lord,” and he worshiped him.
translation:
  language: tl
  text: At sinabi niya, “Naniniwala ako, Panginoon[a],” at sumamba siya sa kanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ginoo.” Ang salitang Griego na κύριε ay maaari ring gamitin bilang magalang na pantawag; dito, “Panginoon” ang pinili dahil humahantong ang konteksto sa pagpapahayag ng paniniwala at pagsamba.
    reason: alternative_reading
  - marker: b
    text: O “yumukod siya sa harap niya” o “nagbigay-galang siya sa kanya.” Ang pandiwang Griego ay maaaring tumukoy sa pagyukod o pagbibigay-galang; dito, isinalin itong “sumamba” dahil sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: At … niya
  rationale: Ang artikulo ay ginagamit bilang panghalip na tumutukoy sa lalaking pinagaling, at ang δέ ay isang payak na pang-ugnay sa daloy ng salaysay; hindi kailangang gawing mariing pagsalungat.
- source_word: ἔφη
  choice: sinabi
  rationale: Karaniwang panandang pasalaysay ito na nagpapakilala ng tuwirang pananalita; natural at marangal sa modernong Tagalog ang “sinabi.”
- source_word: Πιστεύω
  choice: Naniniwala ako
  rationale: Tuwirang tugon ito sa pagpapakilala ni Jesus sa sarili. Pinananatili ng “naniniwala” ang mahalagang bokabularyo ng pananampalataya sa Juan sa paraang malinaw sa karaniwang mambabasa.
- source_word: κύριε
  choice: Panginoon
  rationale: Maaaring magpahiwatig ang salita ng magalang na pagtawag lamang, ngunit sa kontekstong humahantong sa pagpapahayag ng paniniwala at pagsamba, ang “Panginoon” ang mas angkop na pangunahing salin.
- source_word: προσεκύνησεν
  choice: sumamba
  rationale: Maaaring tumukoy ang pandiwa sa pagyukod o pagbibigay-galang, ngunit matapos ang pagpapahayag ng paniniwala at dahil si Jesus ang pinag-ukulan nito, malinaw at angkop sa konteksto ang “sumamba.”
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Likas na ipinapahayag sa Tagalog ang datibong layon ng προσκυνέω sa pamamagitan ng “sa kanya,” nang walang di-kinakailangang pagpapalawak.
theological_decisions:
- issue: Kung ang κύριε ay dapat isaling bilang magalang na pantawag lamang o bilang “Panginoon”
  choice: Panginoon
  alternative: Ginoo; Sir
  rationale: 'Pinapaboran ng agarang konteksto ang mas mataas na pagkilala: katatapos lamang magpakilala ni Jesus, at tumugon ang lalaki sa pamamagitan ng paniniwala at pagsamba. Gayunman, pinananatili sa talababa ang leksikal na posibilidad ng magalang na pantawag.'
- issue: Kung ang προσεκύνησεν ay dapat isaling “sumamba” o sa mas di-tiyak na “yumukod”/“nagbigay-galang”
  choice: sumamba
  alternative: yumukod sa harap niya; nagbigay-galang sa kanya
  rationale: Sa kontekstong si Jesus ang layon at kasunod ito ng hayagang pagpapahayag ng paniniwala, pinakamainam na ipinahahayag ng “sumamba” ang malamang na diwa. Hindi inaalis ang mas malawak na saklaw ng salita, kaya inilalahad ang mga alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Iniwasan ang labis na pormal na “Ginoo” sa pangunahing teksto at ang honoripikong “po,” na wala sa tekstong Griego. Inilagay ang mga pananda ng talababa sa mismong mga salitang tinatalakay.
