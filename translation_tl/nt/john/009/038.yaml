  source_fidelity: Tumpak na naipapahayag ng salin ang ὁ δὲ ἔφη, Πιστεύω, κύριε, καὶ προσεκύνησεν αὐτῷ. Ang “At sinabi niya,” “Naniniwala ako,” “Panginoon,” at “sumamba siya sa kanya” ay kumakatawan sa mga pangunahing bahagi ng Griyego nang walang dagdag o bawas na kahulugan.
