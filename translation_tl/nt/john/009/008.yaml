  yaml_path: translation/nt/john/009/008.yaml
  text: So the neighbors[a], and those who had seen him before as a beggar, were saying, “Is this not the man who used to sit and beg?”
translation:
  language: tl
  text: Kaya ang mga kapitbahay at ang mga dating nakakakita sa kanya bilang pulubi ay nagsasabi, “Hindi ba siya ang lalaking dating nakaupo at namamalimos?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Nag-uugnay ito sa naunang pangyayari at nagpapakita ng bunga o pagpapatuloy ng salaysay sa natural na Tagalog.
- source_word: γείτονες
  choice: mga kapitbahay
  rationale: Tuwirang tumutukoy sa mga taong nakatira malapit sa kanya.
- source_word: θεωροῦντες αὐτὸν τὸ πρότερον
  choice: mga dati nang nakakakita sa kanya
  rationale: Ipinahihiwatig ng participle at τὸ πρότερον na nakita o palagi nila siyang nakikita noong una; natural itong ipinapahayag sa Tagalog nang hindi dinaragdagan ang katiyakan ng dalas.
- source_word: ὅτι προσαίτης ἦν
  choice: bilang pulubi
  rationale: Pinananatili nitong bukas ang ugnayan ng ὅτι sa paglalarawan at pagkakilala sa kanya, sa halip na gawing tahasang sanhi.
- source_word: ἔλεγον
  choice: sinabi
  rationale: Natural sa salaysay sa Tagalog; maaaring saklawin ng anyong ito ang pananalita ng pangkat nang hindi pilit na inuulit ang pandiwa.
- source_word: Οὐχ οὗτός ἐστιν
  choice: Hindi ba siya
  rationale: Natural na tanong sa Tagalog na umaasang sasang-ayon ang kausap.
- source_word: ὁ καθήμενος καὶ προσαιτῶν
  choice: ang lalaking dating nakaupo at namamalimos
  rationale: Ang mga substantival participle ay nagpapakilala sa lalaki ayon sa dati niyang kinagawiang gawain; ipinahahayag ng “dating” ang dating kalagayan.
