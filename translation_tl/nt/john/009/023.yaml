base_translation:
  language: en
  yaml_path: translation/nt/john/009/023.yaml
  text: For this reason his parents said[a], “He is of age; ask him.”
translation:
  language: tl
  text: Dahil dito, sinabi ng kanyang mga magulang, “Nasa hustong gulang na siya; siya ang tanungin ninyo.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sapat na ang edad niya; siya ang usisain ninyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Dahil dito
  rationale: Malinaw nitong ipinapakita ang sanhi na binanggit sa naunang talata at natural ito sa makabagong Tagalog.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: kanyang mga magulang
  rationale: Tumpak at likas na kolektibong tawag sa ama at ina ng lalaki.
- source_word: εἶπαν
  choice: sinabi
  rationale: Karaniwang pandiwa ng pagsasalita ang λέγω rito; hindi kailangang dagdagan ng diwang wala sa Griyego.
- source_word: Ἡλικίαν ἔχει
  choice: Nasa hustong gulang na siya
  rationale: Ipinahahayag ng idyoma na sapat na ang kanyang edad upang sumagot para sa sarili, habang pinananatili ang panlipunan o legal na diwa ng pagiging nasa wastong edad.
- source_word: αὐτὸν
  choice: siya ang
  rationale: Ipinakikita ng ayos na ito ang diin sa lalaki bilang siyang dapat tanungin.
- source_word: ἐπερωτήσατε
  choice: tanungin ninyo
  rationale: Natural na utos sa Tagalog at tumpak na nagpapahayag na sa kanya dapat ituon ang pagtatanong.
