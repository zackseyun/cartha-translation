translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nasa hustong gulang” upang maipakita ang idyomatikong diwa ng Ἡλικίαν ἔχει, at ang “siya ang” upang mapanatili ang diin ng αὐτόν. Inilagay ang talababa pagkatapos ng buong sipi.
