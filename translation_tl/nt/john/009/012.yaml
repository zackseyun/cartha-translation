  yaml_path: translation/nt/john/009/012.yaml
  text: And they said to him[a], “Where is that man?” He says, “I do not know.”
translation:
  language: tl
  text: At sinabi nila sa kanya, “Nasaan ang taong iyon?” Sinabi niya, “Hindi ko alam.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang payak na pag-uugnay nito sa naunang salaysay nang hindi nagdaragdag ng interpretasyong tulad ng sanhi o bunga.
- source_word: εἶπαν αὐτῷ
  choice: sinabi nila sa kanya
  rationale: Tuwirang katumbas ng pandiwa at datibong layon; bagaman tanong ang kasunod na pananalita, hindi kailangang gawing “tinanong” ang λέγω.
- source_word: Ποῦ ἐστιν ἐκεῖνος
  choice: Nasaan ang taong iyon?
  rationale: Likas na modernong Tagalog na pinananatili ang puwersang panturo ng ἐκεῖνος; malinaw sa konteksto na isang lalaki ang tinutukoy.
- source_word: λέγει
  choice: Sinabi niya
  rationale: Isinalin ang makasaysayang pangkasalukuyan ayon sa likas na nakaraang-panahong daloy ng salaysay sa Tagalog, sa halip na piliting “sinasabi niya.”
- source_word: Οὐκ οἶδα
  choice: Hindi ko alam
  rationale: Payak, tuwiran, at natural na katumbas sa modernong Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na simple, malinaw, at marangal. Ginamit ang “taong iyon” upang maipahayag nang natural ang demonstratibong ἐκεῖνος; hindi kailangan ang talababa dahil hindi malaki ang nawalang kahulugan o tunay na kalabuan.
