  naturalness: Natural at malinaw ang modernong Filipino Tagalog. Ang ayos ng tanong na “Paano makagagawa ng ganitong mga tanda ang isang taong makasalanan?” ay katanggap-tanggap at marangal sa rehistrong pampanitikan-biblikal. Ang “ipinangingilin” at “pagkakahati” ay angkop sa konteksto.
