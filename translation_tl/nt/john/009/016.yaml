id: JHN.9.16
reference: John 9:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἔλεγον οὖν ἐκ τῶν Φαρισαίων τινές· ⸂Οὐκ ἔστιν οὗτος παρὰ θεοῦ ὁ ἄνθρωπος⸃, ὅτι τὸ σάββατον οὐ τηρεῖ. ⸀ἄλλοι ἔλεγον· Πῶς δύναται ἄνθρωπος ἁμαρτωλὸς τοιαῦτα σημεῖα ποιεῖν; καὶ σχίσμα ἦν ἐν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/016.yaml
  text: So some of the Pharisees were saying[a], “This man is not from God, because he does not keep the Sabbath.” But others were saying[b], “How can a sinful man do such signs?” And there was a division among them.
translation:
  language: tl
  text: Kaya ang ilan sa mga Pariseo ay nagsasabi, “Ang taong ito ay hindi mula sa Diyos, sapagkat hindi niya ipinangingilin ang Sabbath.” Ngunit sinasabi naman ng iba, “Paano makagagawa ng ganitong mga tanda[b] ang isang taong makasalanan[a]?” At nagkaroon ng pagkakahati sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang makasalanan.” Sa Griyego, “isang taong makasalanan” ang literal na anyo, na gumagamit ng pang-uri upang ilarawan ang “tao.”
    reason: lexical_alternative
  - marker: b
    text: Madalas gamitin ni Juan ang “mga tanda” para sa mga gawa ni Jesus upang idiin ang kahulugang ipinahahayag ng mga ito; maaari ring isaling “mahimalang mga tanda” upang gawing mas hayag ang pahiwatig na iyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον ... τινές
  choice: ang ilan ... ay nagsasabi
  rationale: Ipinahihiwatig ng imperpektong ἔλεγον ang nagpapatuloy o paulit-ulit na pagsasalita sa tagpo. Likas sa modernong salaysay sa Filipino ang “ay nagsasabi” upang mapanatili ang aspektong ito.
- source_word: οὖν
  choice: Kaya
  rationale: Pinananatili ng “Kaya” ang ugnayang lohikal at pagpapatuloy mula sa naunang pangyayari nang hindi nagiging labis na pormal.
- source_word: ἐκ τῶν Φαρισαίων
  choice: ilan sa mga Pariseo
  rationale: Malinaw at natural itong tumutukoy sa isang pangkat mula sa kabuuan ng mga Pariseo.
- source_word: οὗτος ... ὁ ἄνθρωπος
  choice: Ang taong ito
  rationale: Tuwirang ipinapahayag nito ang demonstratibong pagtukoy sa isang lalaki nang hindi nagdaragdag ng mapanlibak na katawagan.
- source_word: παρὰ θεοῦ
  choice: mula sa Diyos
  rationale: Ipinahahayag ng παρά na may genitive ang pinagmulan. Hindi idinagdag ang “isinugo” dahil wala itong tahasang katumbas sa parirala.
- source_word: τηρεῖ
  choice: ipinangingilin
  rationale: Sa konteksto ng Sabbath, natural na tumutukoy ang “ipinangingilin” sa pagsunod at pagtalima sa itinakdang banal na araw.
- source_word: τὸ σάββατον
  choice: ang Sabbath
  rationale: Karaniwan, malinaw, at sapat na tiyak na katawagan ito para sa araw ng pamamahinga ng mga Judio.
- source_word: ἄλλοι
  choice: iba
  rationale: Natural nitong ipinakikita ang salungat na pangkat sa loob ng mga Pariseo.
- source_word: Πῶς δύναται ... ποιεῖν
  choice: Paano makagagawa
  rationale: Pinananatili nito ang tanong tungkol sa kakayahan o posibilidad sa isang natural na anyong Filipino.
- source_word: ἄνθρωπος ἁμαρτωλὸς
  choice: isang taong makasalanan
  rationale: Pinananatili nito ang anyong pang-uri ng ἁμαρτωλός na naglalarawan sa ἄνθρωπος, sa halip na baguhin agad ito bilang pangngalang “isang makasalanan.”
- source_word: τοιαῦτα σημεῖα
  choice: ganitong mga tanda
  rationale: Pinananatili ng “mga tanda” ang natatanging gamit ni Juan sa σημεῖα bilang mga gawang may ipinahahayag na kahulugan, samantalang ang “ganito” ay kumakatawan sa τοιαῦτα.
- source_word: σχίσμα
  choice: pagkakahati
  rationale: Malinaw nitong ipinahahayag ang pagkabiyak ng kanilang mga pananaw nang hindi nagiging kolokyal.
theological_decisions:
- issue: Paglalarawan sa mga gawa ni Jesus bilang σημεῖα
  choice: mga tanda
  alternative: mga himala / mahimalang mga tanda
  rationale: Madalas gamitin ni Juan ang σημεῖα para sa mga gawang tumuturo sa mas malalim na pahayag tungkol kay Jesus. Pinananatili ng “mga tanda” ang bigat na ito nang walang idinadagdag sa teksto.
- issue: Pahayag na si Jesus ay παρὰ θεοῦ
  choice: mula sa Diyos
  alternative: isinugo ng Diyos
  rationale: Pinananatili ng “mula sa Diyos” ang posibleng saklaw ng pinagmulan o banal na awtorisasyon. Ang “isinugo ng Diyos” ay mas tiyak kaysa sa mismong parirala at maaaring maagang magpasya sa teolohikal na tensiyon.
- issue: Paglalarawan sa ἄνθρωπος ἁμαρτωλός
  choice: isang taong makasalanan
  alternative: isang makasalanan
  rationale: Tuwirang pinananatili ng pangunahing teksto ang pang-uring “makasalanan” na naglalarawan sa “tao,” habang kinikilala sa talababa ang mas maikling natural na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ipinangingilin” bilang pamilyar ngunit dignidad na katawagan sa pagsunod sa Sabbath. Inilagay ang mga pananda ng talababa sa mismong mga salitang tinatalakay—[a] pagkatapos ng “makasalanan” at [b] pagkatapos ng “mga tanda”—upang maging malinaw ang ugnayan ng bawat tala.
