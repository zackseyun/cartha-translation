review_pass:
  verdict: revise
  source_fidelity: Tumpak ang pangunahing pagbasa na “Anak ng Tao,” at wastong naitala ang mahalagang variant na “Anak ng Diyos.” Gayunman, ang “itinaboy nila sa labas ang lalaki” ay hindi likas na ayos sa Filipino at ang pagdaragdag ng “ang lalaki” ay hindi kailangan ng Griyego, na panghalip lamang ang gamit. Ang “pinalayas nila siya” ay mas idiomatiko at naipahahayag ang mariing pagpapaalis ng ἐξέβαλον ... ἔξω.
  naturalness: Ang natitirang pangungusap ay malinaw at angkop ang marangal na rehistro. Inayos ang unang sugnay upang maging natural na modernong Filipino; pinanatili ang “Sumasampalataya ka ba” bilang angkop na pangrelihiyong gamit para sa πιστεύεις εἰς.
  terminology: Ang “Anak ng Tao” ay dapat panatilihin bilang itinakdang titulo at bilang salin ng tekstong SBLGNT. Ang “Anak ng Diyos” ay nararapat manatili sa talababa bilang tekstuwal na variant.
