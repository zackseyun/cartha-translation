source:
  edition: SBLGNT
  text: ⸀Ἤκουσεν Ἰησοῦς ὅτι ἐξέβαλον αὐτὸν ἔξω, καὶ εὑρὼν αὐτὸν ⸀εἶπεν· Σὺ πιστεύεις εἰς τὸν υἱὸν τοῦ ⸀ἀνθρώπου;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/035.yaml
  text: Jesus heard that they had thrown him out[a], and when he found him, he said, “Do you believe in the Son of Man?”
translation:
  language: tl
  text: Nabalitaan ni Jesus na pinalayas nila siya. Nang matagpuan niya siya, sinabi niya, “Sumasampalataya ka ba sa Anak ng Tao?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: May ilang manuskrito na ang mababasa ay “Anak ng Diyos” sa halip na “Anak ng Tao.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐξέβαλον αὐτὸν ἔξω
  choice: itinaboy nila sa labas ang lalaki
  rationale: Ang tambalang ἐκβάλλω at ἔξω ay mariing nagpapahayag ng pagpapaalis. Likas sa modernong Tagalog ang “itinaboy ... sa labas” at pinananatili nito ang diwa ng marahas o mapanghamak na pagtatakwil sa konteksto.
- source_word: εὑρὼν αὐτόν
  choice: Nang matagpuan niya ito
  rationale: Ang aorist participle ay may temporal na diwa rito. Malinaw at natural na ipinakikita ng “Nang matagpuan niya ito” ang pagkakasunod ng mga pangyayari.
- source_word: Σὺ πιστεύεις
  choice: Sumasampalataya ka ba
  rationale: Sa tanong tungkol sa pagtitiwala sa isang persona, ang “sumasampalataya” ay angkop na katumbas ng πιστεύω at higit na tiyak kaysa sa payak na “naniniwala.” Naipahahayag ng “ka” ang tahasang pagtuon sa kausap nang hindi nagiging pilit.
- source_word: εἰς
  choice: sa
  rationale: Kasama ng πιστεύω, ipinahihiwatig ng εἰς ang pananampalataya o pagtitiwalang nakatuon sa isang persona. Ang “sumasampalataya ... sa” ang likas na hulma sa Tagalog.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Anak ng Tao
  rationale: Pinananatili ng kinikilalang titulong “Anak ng Tao” ang ugnay nito sa Daniel 7 at ang natatanging gamit nito sa Juan, nang hindi ito binibigyang-kahulugang lampas sa teksto.
theological_decisions:
- issue: Pagbasa sa kristolohikal na titulo sa tanong
  choice: Anak ng Tao
  alternative: Anak ng Diyos
  rationale: “Anak ng Tao” (υἱὸν τοῦ ἀνθρώπου) ang mababasa sa SBLGNT at kaya ito ang inilagay sa pangunahing teksto. Ang mahalaga at matagal nang kilalang variant na “Anak ng Diyos” ay iniingatan sa talababa sa halip na tahimik na piliin o alisin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ang lalaki” upang malinaw ang tinutukoy ng unang αὐτόν, at “ito” sa kasunod na pangungusap upang maiwasan ang malabong sunod-sunod na panghalip. Inilagay ang marker [a] kaagad pagkatapos ng pinagtatalunang titulo.
