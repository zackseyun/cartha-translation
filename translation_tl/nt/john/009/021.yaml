  text: πῶς δὲ νῦν βλέπει οὐκ οἴδαμεν, ἢ τίς ἤνοιξεν αὐτοῦ τοὺς ὀφθαλμοὺς ἡμεῖς οὐκ οἴδαμεν· ⸂αὐτὸν ἐρωτήσατε, ἡλικίαν ἔχει⸃, αὐτὸς περὶ ἑαυτοῦ λαλήσει.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/021.yaml
  text: But how he now sees[a], we do not know; or who opened his eyes, we do not know. Ask him; he is of age. He will speak for himself.
translation:
  language: tl
  text: Ngunit kung paano siya nakakakita ngayon ay hindi namin alam, o kung sino ang nagmulat ng mga mata niya ay hindi rin namin alam. Tanungin ninyo siya; nasa hustong gulang na siya. Siya mismo ang magsasalita tungkol sa sarili niya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Kaya niyang magsalita para sa sarili niya.” Maaaring gamitin ang panghinaharap na pandiwa sa Griyego bilang praktikal na pahayag na kaya niyang sumagot o pananagutan niyang sumagot.
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς δὲ νῦν βλέπει
  choice: Ngunit hindi namin alam kung paano siya nakakakita ngayon
  rationale: Ang πῶς ay “kung paano,” ang δέ ay banayad na panalungat o pagpapatuloy na “ngunit,” ang νῦν ay “ngayon,” at ang βλέπει ay pangkasalukuyang “nakakakita.” Pinananatili ng salin ang tanong tungkol sa paraan ng kanyang pagkakita nang hindi ipinapasok ang paliwanag na “kaya na niyang makakita.”
- source_word: οὐκ οἴδαμεν
  choice: hindi namin alam
  rationale: Tuwirang katumbas ito ng pandiwang οἶδα sa kahulugang “alam.” Inulit ang pahayag sa ikalawang sugnay upang mapanatili ang diin ng Griyego.
- source_word: ἢ τίς ἤνοιξεν αὐτοῦ τοὺς ὀφθαλμούς
  choice: hindi rin namin alam kung sino ang nagmulat sa kanyang mga mata
  rationale: Ang τίς ay “sino” at ang ἤνοιξεν ay “nagbukas/nagmulat.” Ang “nagmulat sa kanyang mga mata” ay natural sa Filipino at pinananatili ang idyomang kaugnay ng himalang isinasalaysay. Ang ugnayang ipinahihiwatig ng ἢ ay likas na naipahayag sa “hindi rin.”
- source_word: αὐτὸν ἐρωτήσατε
  choice: Tanungin ninyo siya
  rationale: Ang anyo ay pautos na maramihan. Tahasang ipinahahayag ng “ninyo” na higit sa isa ang kinakausap, gaya ng anyong Griyego.
- source_word: ἡλικίαν ἔχει
  choice: nasa hustong gulang na siya
  rationale: Sa kontekstong ito, tumutukoy ang ἡλικία sa sapat na edad upang makasagot at makapagpatotoo nang sarili, hindi sa tangkad. Ang “nasa hustong gulang” ay malinaw at karaniwang modernong Filipino.
- source_word: αὐτὸς περὶ ἑαυτοῦ λαλήσει
  choice: Siya mismo ang magsasalita para sa kanyang sarili
  rationale: Pinananatili ng “siya mismo” ang diin ng αὐτός, ng “para sa kanyang sarili” ang reflexive at pansariling pagpapatotoo, at ng “magsasalita” ang panghinaharap na λαλήσει.
theological_decisions:
- issue: Kahulugan ng ἡλικίαν ἔχει sa konteksto
  choice: Sapat na ang kanyang edad upang makasagot nang sarili
  alternative: Pangkalahatang pagkahinog, o pisikal na tangkad
  rationale: Ang konteksto ay pagtatanong ng mga pinuno at pag-iwas ng mga magulang na sumagot para sa kanilang anak. Kaya edad at pananagutang panlipunan ang tinutukoy, hindi tangkad.
- issue: Lakas ng αὐτὸς περὶ ἑαυτοῦ λαλήσει
  choice: Siya mismo ang magsasalita para sa kanyang sarili
  alternative: Kaya niyang magsalita para sa kanyang sarili
  rationale: Pinananatili sa pangunahing teksto ang gramatikal na panghinaharap, habang inilalahad sa talababa ang posibleng praktikal na diwang nagsasaad ng kakayahan o pananagutang sumagot.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at likas basahin. Ginamit ang “nagmulat sa kanyang mga mata” upang mapanatili ang idyoma ng salaysay, at “nasa hustong gulang” para sa legal at panlipunang diwa ng konteksto.
