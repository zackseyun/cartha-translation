  to: Ngunit kung paano siya nakakakita ngayon ay hindi namin alam, o kung sino ang nagmulat ng mga mata niya ay hindi rin namin alam. Tanungin ninyo siya; nasa hustong gulang na siya. Siya mismo ang magsasalita tungkol sa sarili niya.[a]
  rationale: Inayos ang salin upang malinaw na maipakita ang ἢ (“o”), na naisantabi sa draft. Pinalitan ang “sa kanyang mga mata” ng “ng mga mata niya” upang mas tuwirang maipahayag ang pagbubukas/pagmulat ng kanyang mga mata. Ginawang “magsasalita tungkol sa sarili niya” ang huling sugnay upang masaklaw nang mas eksakto ang περὶ ἑαυτοῦ, samantalang ang praktikal na diwa ng pagsasalita para sa sarili ay nananatili sa talababa.
