  text: ἀπεκρίθη ὁ ἄνθρωπος καὶ εἶπεν αὐτοῖς· Ἐν ⸂τούτῳ γὰρ τὸ⸃ θαυμαστόν ἐστιν ὅτι ὑμεῖς οὐκ οἴδατε πόθεν ἐστίν, καὶ ἤνοιξέν μου τοὺς ὀφθαλμούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/030.yaml
  text: 'The man answered and said to them[a], “This is the remarkable thing: you do not know where he is from[b], and yet he opened my eyes.”'
translation:
  language: tl
  text: 'Sumagot ang lalaki at sinabi sa kanila, “Ito nga ang nakapagtataka: hindi ninyo alam kung saan siya nagmula[a], gayong iminulat niya ang aking mga mata.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kung saan siya nanggaling.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ὁ ἄνθρωπος καὶ εἶπεν αὐτοῖς
  choice: Sumagot ang lalaki at sinabi sa kanila
  rationale: Pinananatili ang pormal na hulma ng tugon sa salaysay at malinaw na tinutukoy ang lalaking ipinanganak na bulag.
- source_word: Ἐν τούτῳ γὰρ τὸ θαυμαστόν ἐστιν
  choice: Ito nga ang nakapagtataka
  rationale: Natural na Filipino para sa idyomang tumutukoy sa bagay na kahanga-hanga o nakapagtataka; ipinahihiwatig ng “nga” ang paliwanag at mariing ironiya ng γάρ.
- source_word: ὑμεῖς οὐκ οἴδατε
  choice: hindi ninyo alam
  rationale: Ang tahasang ὑμεῖς ay naipapakita sa “ninyo,” at ang οἴδατε ay tumutukoy sa kaalaman, hindi lamang sa pagkaunawa.
- source_word: πόθεν ἐστίν
  choice: kung saan siya nagmula
  rationale: Malinaw at likas na pagpapahayag ng pinagmulan; maaari ring unawain bilang “kung saan siya nanggaling.”
- source_word: καὶ ἤνοιξέν μου τοὺς ὀφθαλμούς
  choice: gayong iminulat niya ang aking mga mata
  rationale: Ipinakikita ng “gayong” ang kontras at ironiya ng καί sa konteksto. Ang “iminulat ... ang aking mga mata” ay tumutukoy muna sa pisikal na pagpapagaling habang pinananatili ang mas malawak na pahiwatig ng salaysay.
theological_decisions:
- issue: Pisikal at metaporikal na diwa ng “iminulat ang aking mga mata”
  choice: Panatilihin ang literal na pahayag tungkol sa pagpapagaling nang hindi tahasang dinaragdagan ng espirituwal na paliwanag
  alternative: Isaling tuwiran bilang espirituwal na pagbibigay-liwanag
  rationale: Ang agarang tinutukoy ay ang pisikal na pagpapagaling sa lalaki. Hinahayaan ng salin na lumitaw mula sa konteksto ang temang Juanino tungkol sa paningin at pagkabulag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nakapagtataka” upang mapanatili ang matinding paghanga at ironiya nang hindi nagiging lipas o labis na pormal.
