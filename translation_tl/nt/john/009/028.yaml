  text: ⸀ἐλοιδόρησαν αὐτὸν καὶ εἶπον· Σὺ ⸂μαθητὴς εἶ⸃ ἐκείνου, ἡμεῖς δὲ τοῦ Μωϋσέως ἐσμὲν μαθηταί·
base_translation:
  language: en
  yaml_path: translation/nt/john/009/028.yaml
  text: They reviled him and said[a], “You are that man's disciple, but we are disciples of Moses.”
translation:
  language: tl
  text: Nilait nila siya at sinabi, “Ikaw ay alagad ng taong iyon, ngunit kami ay mga alagad ni Moises.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλοιδόρησαν
  choice: nilait
  rationale: Ipinahahayag ng pandiwa ang mapang-abusong pananalita at paghamak. Natural sa modernong Tagalog ang “nilait” at pinananatili nito ang tindi ng paglapastangan.
- source_word: αὐτὸν
  choice: siya
  rationale: Tumutukoy ang tuwirang layon sa lalaking pinagaling; malinaw at natural ang panghalip na “siya” matapos ang pandiwang nilait.
- source_word: καὶ εἶπον
  choice: at sinabi
  rationale: Tapat na inililipat ang koordinasyong pasalaysay; hindi na kailangang ulitin ang simuno dahil malinaw ito sa naunang sugnay.
- source_word: Σὺ
  choice: Ikaw
  rationale: Nasa unahan at mariin ang panghalip sa Griyego. Pinananatili ng “Ikaw” sa simula ang diin at ang tahasang pagsalungat sa “kami.”
- source_word: μαθητὴς / μαθηταί
  choice: alagad / mga alagad
  rationale: Ang μαθητής sa Juan ay tumutukoy sa taong nakaugnay sa isang guro bilang tagasunod, hindi lamang mag-aaral. Ang “alagad” ay natural sa biblikal ngunit nauunawaang modernong Tagalog at pinananatili ang magkatulad na salita sa magkabilang panig ng paghahambing.
- source_word: ἐκείνου
  choice: ng taong iyon
  rationale: Ang demonstratibo ay lumilikha ng distansiya at, sa kontekstong mapanlait, maaaring magpahiwatig ng paghamak. Naipapakita ng “taong iyon” ang distansiyang ito nang hindi nagdaragdag ng labis na panunuya.
- source_word: ἡμεῖς δὲ
  choice: ngunit kami
  rationale: Ipinapakita ng δέ ang malinaw na pagsalungat, at ang hayag na “kami” ay nagpapanatili sa diin ng panghalip sa Griyego.
- source_word: τοῦ Μωϋσέως
  choice: ni Moises
  rationale: Ipinahahayag ng henitibo ang kaugnayan o pagsunod kay Moises; idiomatiko at malinaw sa Tagalog ang “mga alagad ni Moises.”
- source_word: ἐσμὲν μαθηταί
  choice: ay mga alagad
  rationale: Pinananatili ang kopular na estruktura at ang retorikal na pagtutumbas sa unang paggamit ng μαθητής.
theological_decisions:
- issue: Tono ng ἐκείνου bilang pagtukoy kay Jesus
  choice: Isinalin bilang “ng taong iyon” upang mapanatili ang mapaglayo at posibleng mapanghamak na tono ng mga nagsasalita.
  alternative: “niya” o “niyon” na mas neutral at mas maikli
  rationale: Maaaring maging neutral ang demonstratibo sa ibang konteksto, ngunit dito ay kasunod ito ng panlalait at bahagi ng polemikong paghahambing kay Jesus at kay Moises. Ang “taong iyon” ay nagpapahiwatig ng paghamak nang hindi ito ginagawang mas tiyak kaysa sa Griyego.
- issue: Magkaparehong salin ng μαθητής
  choice: Ginamit ang “alagad” sa dalawang paglitaw.
  alternative: “tagasunod” o “mag-aaral”
  rationale: Pinananatili ng iisang termino ang matinding paghahambing ng kanilang sinasabing katapatan kay Moises at ng ipinaparatang nilang katapatan ng lalaki kay Jesus. Hindi rin nito nililimitahan ang kahulugan sa pormal na pag-aaral lamang.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit direkta. Ang “nilait” ay karaniwang nauunawaan at sapat ang tindi; ang “alagad” ay nagpapanatili ng mahalagang terminong biblikal nang hindi nagiging lipas. Walang talababa dahil ang mapaglayong kulay ng ἐκείνου ay naipahayag na sa pangunahing teksto bilang “taong iyon,” at hindi kailangan ang isang alternatibong salin upang maunawaan ang talata.
