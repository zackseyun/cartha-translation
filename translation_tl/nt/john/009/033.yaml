  yaml_path: translation/nt/john/009/033.yaml
  text: If this man were not from God[a], he could do nothing.
translation:
  language: tl
  text: Kung hindi mula sa Diyos ang taong ito,[a] hindi siya makagagawa ng anuman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Malibang mula sa Diyos ang taong ito, hindi siya makagagawa ng anuman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ μὴ ... ἦν
  choice: Kung ... ay hindi
  rationale: Pinananatili ang malinaw na anyong kondisyonal ng Griyego. Sa Filipino, ipinahihiwatig ng buong pangungusap ang salungat-sa-katotohanang palagay kahit walang natatanging anyong pandiwa para rito.
- source_word: οὗτος
  choice: ang taong ito
  rationale: Likas at malinaw na tumutukoy sa lalaking pinag-uusapan, si Jesus, nang hindi dinaragdagan ang kahulugan.
- source_word: παρὰ θεοῦ
  choice: mula sa Diyos
  rationale: Ipinapahayag ng παρά na may genitibo ang pinagmulan. Hindi ito pinalawak bilang “isinugo ng Diyos” o “binigyan ng awtoridad ng Diyos,” na kapuwa mas tiyak kaysa sa mismong parirala.
- source_word: οὐκ ἠδύνατο
  choice: wala siyang magagawa
  rationale: Natural na Filipino para sa kawalan ng kakayahan sa loob ng kondisyong argumento; pinananatili rin ang ugnayan nito sa οὐδέν.
- source_word: ποιεῖν οὐδέν
  choice: magagawang anuman
  rationale: Ang “anuman” kasunod ng negatibong “wala” ay idiomatiko sa Filipino at malinaw na nagpapahayag ng lubos na kawalan ng kakayahang gumawa.
theological_decisions:
- issue: Kahulugan ng “mula sa Diyos” kaugnay ni Jesus
  choice: Panatilihin ang “mula sa Diyos” nang walang pagpapalawak.
  alternative: “isinugo ng Diyos” o “binigyan ng awtoridad ng Diyos”
  rationale: Maaaring magpahiwatig ang konteksto ng banal na pagsusugo o awtoridad, ngunit mas malawak ang pariralang Griyego. Pinananatili ng salin ang pahayag at tensiyong teolohikal nang hindi nagdaragdag ng doktrinal na katiyakan.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “ang taong ito” at “wala siyang magagawang anuman” para sa malinaw na pang-araw-araw na daloy habang nananatiling malapit sa anyo at diin ng Griyego.
