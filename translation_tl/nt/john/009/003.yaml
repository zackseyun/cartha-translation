  to: Sumagot si Jesus, “Hindi nagkasala ang lalaking ito, ni ang kanyang mga magulang; kundi upang mahayag sa kanya[a] ang mga gawa ng Diyos.”
  rationale: Inalis ang hindi likas at di-tahasang “Sa halip, ito ay” upang masunod nang mas malapit ang ἀλλ’ ἵνα. Pinanatili ang layuning “upang mahayag,” ang pasibong diwa ng φανερωθῇ, at ang maingat na kalabuan ng ἐν αὐτῷ sa pamamagitan ng “sa kanya” at ng talababa.
