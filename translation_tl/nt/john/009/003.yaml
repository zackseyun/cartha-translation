    issue: Hindi likas ang “Sa halip, ito ay upang.”
    rationale: Ang konstruksyong ito ay hindi natural sa Tagalog at ang “ito ay” ay hindi nakasaad sa Griyego. Maaaring panatilihin ang ἀλλ’ ἵνα sa pamamagitan ng “kundi upang” nang walang dagdag na pangyayari o paliwanag sa pangunahing teksto.
  - severity: low
    issue: Hindi kailangan ang talababa tungkol sa idinagdag na “ito ay.”
    rationale: Kapag inalis ang di-tahasang dagdag, wala nang kailangang ipaliwanag na supplied wording.
