  text: ἀπεκρίθη Ἰησοῦς· Οὔτε οὗτος ἥμαρτεν οὔτε οἱ γονεῖς αὐτοῦ, ἀλλ’ ἵνα φανερωθῇ τὰ ἔργα τοῦ θεοῦ ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/003.yaml
  text: Jesus answered[a], “Neither this man sinned, nor his parents[c][b], but so that the works of God might be revealed in him.”
translation:
  language: tl
  text: Sumagot si Jesus, “Hindi nagkasala ang lalaking ito, ni ang kanyang mga magulang; kundi upang mahayag sa kanya[a] ang mga gawa ng Diyos.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa pamamagitan niya.” Ang Griyego ay literal na “sa kanya,” na maaaring tumukoy sa taong kinaroroonan o sa taong ginamit upang mahayag ang mga gawa ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: Sumagot
  rationale: Karaniwang salaysay na katumbas sa usapan; tuwiran at natural sa modernong Tagalog.
- source_word: Οὔτε ... οὔτε
  choice: Hindi ... ni
  rationale: Likas na pares sa Tagalog na kapwa mariing tumatanggi sa dalawang mungkahing sagot.
- source_word: οὗτος
  choice: ang lalaking ito
  rationale: Ginagawang malinaw ang tinutukoy sa konteksto nang hindi nagdaragdag ng bagong impormasyon.
- source_word: ἥμαρτεν
  choice: nagkasala
  rationale: Tuwiran at karaniwang katumbas ng aorist na anyo ng ἁμαρτάνω.
- source_word: γονεῖς
  choice: mga magulang
  rationale: Eksakto at likas na salin ng pangmaramihang pangngalan.
- source_word: ἀλλ’ ἵνα
  choice: Sa halip, ito ay upang
  rationale: Pinananatili ang pagsalungat at ang layuning ipinahihiwatig ng ἵνα; idinagdag ang “ito ay” upang maging buo at natural sa Tagalog, at ipinaliwanag ang pagdaragdag sa talababa.
- source_word: φανερωθῇ
  choice: mahayag
  rationale: Pinananatili ang diwang pasibo ng pagpapakita o pagbubunyag at akma sa marangal na rehistro.
- source_word: τὰ ἔργα τοῦ θεοῦ
  choice: ang mga gawa ng Diyos
  rationale: Tuwirang pinananatili ang pangmaramihang “mga gawa” at ang genitibong kaugnayan sa Diyos.
- source_word: ἐν αὐτῷ
  choice: sa kanya
  rationale: Pinakamalapit na likas na salin ng ἐν αὐτῷ sa Tagalog habang hindi nilulutas kung ang diwa ay lokatibo o instrumental.
theological_decisions:
- issue: Kung itinatanggi ni Jesus ang lahat ng kaugnayan ng kasalanan at pagdurusa o ang partikular na paliwanag lamang sa pagkabulag ng lalaking ito
  choice: Itinanggi lamang sa teksto na ang lalaki o ang kanyang mga magulang ang nagkasala bilang paliwanag sa partikular na kalagayang tinatalakay.
  alternative: Palawakin ang pahayag bilang pangkalahatang aral na ang anumang pagdurusa ay hindi kailanman kaugnay ng kasalanan.
  rationale: Tiyak na sinasagot ng talata ang tanong tungkol sa lalaking ito; hindi dapat magdagdag ang salin ng pangkalahatang doktrinang hindi tahasang sinasabi rito.
- issue: Kung ang ἵνα ay nagpapahayag ng layunin o kinalabasan lamang
  choice: 'Gumamit ng pananalitang nakatuon sa layunin: “upang mahayag.”'
  alternative: Isalin bilang kinalabasan lamang, gaya ng “kaya nahayag,” o baguhin ang bantas upang iugnay ang sugnay sa kasunod na talata.
  rationale: Ang pinakatuwirang pagbasa sa ἵνα na may subjunctive ay layunin. Pinananatili nito ang teolohikal na tensiyon nang hindi nagpapaliwanag nang higit sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang Johannine na pananalitang “mga gawa ng Diyos” at ang layuning ipinahihiwatig ng ἵνα, habang inilagay sa talababa ang tunay na kalabuan ng ἐν αὐτῷ at ang mga salitang idinagdag para sa likas na balarila.
