  source_fidelity: 'Tapat ang pangunahing salin sa Griyego: ang lalaki ay tumutukoy kay Jesus bilang “ang lalaking tinatawag na Jesus,” inilarawan ang paggawa ng putik at pagpapahid nito sa kanyang mga mata, ang utos na pumunta sa Siloam at maghugas, at ang sumunod na pagkakaroon niya ng paningin. Ang “nakakita na ako” ay angkop sa konteksto at hindi nagpapahiwatig na dati nang nakakakita siya.'
  naturalness: Natural at malinaw ang modernong Filipino Tagalog. Ang “gumawa ng putik,” “ipinahid iyon sa mga mata ko,” at “Kaya pumunta ako at naghugas” ay maayos na pagsasalaysay. Ang “nakakita na ako” ay idiomatiko sa kontekstong ito.
  terminology: Wasto ang “Jesus,” “Siloam,” “putik,” at “mga mata.” Pinananatili ng “lalaking tinatawag na Jesus” ang di-pa-ganap na pagkakakilala ng nagsasalita at hindi nagdaragdag ng titulong teolohikal. Kailangan lamang itama ang talababa b, sapagkat inuulit nito ang aktuwal na salin bilang diumano’y alternatibo at hindi nito wastong inilalahad ang leksikal na alternatibo.
