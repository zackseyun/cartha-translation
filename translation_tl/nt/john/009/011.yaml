id: JHN.9.11
reference: John 9:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀ἐκεῖνος· ⸂Ὁ ἄνθρωπος ὁ⸃ λεγόμενος Ἰησοῦς πηλὸν ἐποίησεν καὶ ἐπέχρισέν μου τοὺς ὀφθαλμοὺς καὶ εἶπέν μοι ⸀ὅτι Ὕπαγε εἰς ⸀τὸν Σιλωὰμ καὶ νίψαι· ἀπελθὼν ⸀οὖν καὶ νιψάμενος ἀνέβλεψα.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/011.yaml
  text: He answered[a], “The man called Jesus made mud and spread it on my eyes, and he told me, ‘Go to Siloam and wash.’ So I went away and washed[c][b], and I received my sight.”
translation:
  language: tl
  text: Sumagot siya, “Ang lalaking tinatawag na Jesus ay gumawa ng putik[a] at ipinahid[b] iyon sa mga mata ko. Sinabi niya sa akin, ‘Pumunta ka sa Siloam at maghugas.’ Kaya pumunta ako at naghugas, at nakakita na ako.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “luwad.” Ang salitang Griego na πηλός ay maaaring tumukoy sa luwad o putik.
    reason: lexical_alternative
  - marker: b
    text: O “pinahiran ang mga mata ko.” Ang pandiwa ay maaari ring mangahulugang “ipahid” o “pahidán”; ang mas pormal na “pahiran ng langis” ay maaaring magpahiwatig ng ritwal na hindi tahasang nasa konteksto.
    reason: lexical_alternative
  - marker: c
    text: O “nagkaroon ako ng paningin.” Sa kontekstong ito, ang pandiwa ay tumutukoy sa pagkakaroon ng kakayahang makakita matapos maging bulag.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ἐκεῖνος
  choice: Sumagot siya
  rationale: Likas na salaysay sa Tagalog; ipinahihiwatig ng “siya” ang tahasang panghalip na ἐκεῖνος nang hindi gumagamit ng matigas na “sumagot ang taong iyon.”
- source_word: Ὁ ἄνθρωπος ὁ λεγόμενος Ἰησοῦς
  choice: Ang lalaking tinatawag na Jesus
  rationale: Pinananatili nito ang simpleng pagkakakilanlan ng nagsasalita kay Jesus bilang isang lalaki, nang hindi nagdaragdag ng mas mataas na titulong teolohikal.
- source_word: πηλὸν ἐποίησεν
  choice: gumawa ng putik
  rationale: Ang πηλός ay maaaring putik o luwad; “putik” ang mas natural sa konteksto ng pinaghalong lupa at laway.
- source_word: ἐπέχρισέν μου τοὺς ὀφθαλμούς
  choice: ipinahid iyon sa mga mata ko
  rationale: Malinaw nitong inilalarawan ang pisikal na pagkilos ng pagpapahid at iniiwasan ang posibleng ritwal na pahiwatig ng “pinahiran.”
- source_word: εἶπέν μοι ὅτι
  choice: Sinabi niya sa akin
  rationale: Natural na panimula sa tuwirang utos at tapat sa karaniwang diwa ng pandiwa.
- source_word: Ὕπαγε εἰς τὸν Σιλωάμ
  choice: Pumunta ka sa Siloam
  rationale: Direkta at natural na salin ng utos; hindi idinagdag ang “lawa” sapagkat pangalan lamang na Siloam ang nasa talata.
- source_word: νίψαι
  choice: maghugas
  rationale: Ang payak na “maghugas” ay natural sa Tagalog at hindi nagpapasok ng bagay na hindi tahasang binanggit sa utos.
- source_word: ἀπελθὼν οὖν καὶ νιψάμενος
  choice: Kaya pumunta ako at naghugas
  rationale: Ipinakikita ng “kaya” ang bunga o kasunod na kilos na hudyat ng οὖν, habang natural na isinasalaysay ang dalawang kilos.
- source_word: ἀνέβλεψα
  choice: nakakita na ako
  rationale: Sa konteksto ng pagpapagaling sa isang ipinanganak na bulag, tumutukoy ito sa pagkakaroon ng kakayahang makakita; ipinahihiwatig ng “na” ang pagbabago ng kalagayan.
theological_decisions:
- issue: Paglalarawan ng pinagaling na lalaki kay Jesus
  choice: Ang lalaking tinatawag na Jesus
  alternative: Si Jesus
  rationale: 'Pinananatili nito ang kasalukuyang antas ng pagkakilala ng nagsasalita sa takbo ng salaysay: kinikilala muna niya si Jesus bilang “ang lalaki,” nang hindi ipinapasok nang maaga ang mas ganap na pagkilalang teolohikal.'
- issue: Diwa ng ἀνέβλεψα para sa isang ipinanganak na bulag
  choice: nakakita na ako
  alternative: nanumbalik ang paningin ko
  rationale: Iniiwasan ng napiling salin ang pahiwatig na dati nang nakakakita ang lalaki, yamang sinasabi ng konteksto na bulag siya mula nang ipanganak, ngunit pinananatili ang diwa ng pagpapagaling tungo sa paningin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang “mata” at “maghugas” sa halip na mas pormal o teknikal na pananalita. Ang tuwirang pananalita ay pinanatiling payak at madaling maunawaan.
