    issue: Hindi ganap na naihahayag ng “siya'y tinanong” ang aspektong imperpekto at ang plural na mga nagtatanong.
    rationale: Ang ἠρώτων ay imperfect at ang paksa ay “ang mga Pariseo.” Hindi kailangang piliting ipakita ang bawat aspektuwal na halaga, ngunit ang aktibong “muling nagtanong ... ang mga Pariseo” ay parehong mas natural at mas malapit sa kilos ng Griyego.
  - severity: low
    issue: Medyo mabigat ang ayos na “muli rin siyang tinanong ng mga Pariseo.”
