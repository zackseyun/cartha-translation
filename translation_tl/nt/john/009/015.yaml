revisions:
- from: Kaya muli rin siyang tinanong ng mga Pariseo kung paano siya nakakita.[a] Sinabi niya sa kanila, “Nilagyan niya ng putik[b] ang mga mata ko, naghugas ako, at nakakakita ako.”
  to: Kaya, muling nagtanong din sa kanya ang mga Pariseo kung paano siya nagkaroon ng paningin.[a] Sinabi niya sa kanila, “Naglagay siya ng putik[b] sa mga mata ko, naghugas ako, at nakakakita ako.”
  rationale: Inayos ang unang pangungusap upang mas likas na maipahayag na ang mga Pariseo ay muling nagtatanong sa lalaki, habang pinananatili ang kahulugan ng ἀναβλέπω bilang pagkakaroon ng paningin sa konteksto. Pinalitan ang “nilagyan ... ang mga mata ko” ng “naglagay ... sa mga mata ko” para sa mas tuwirang pagtutugma sa paglalagay ng putik sa ibabaw ng mga mata. Iningatan ang kasalukuyang “nakakakita ako” at ang mga angkop na talababa.
