base_translation:
  language: en
  yaml_path: translation/nt/john/009/015.yaml
  text: So the Pharisees also asked him again how he had received his sight[a]. He said to them, “He put mud on my eyes, and I washed[b], and I see.”
translation:
  language: tl
  text: Kaya, muling nagtanong din sa kanya ang mga Pariseo kung paano siya nagkaroon ng paningin.[a] Sinabi niya sa kanila, “Naglagay siya ng putik[b] sa mga mata ko, naghugas ako, at nakakakita ako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “kung paano siya nakakita.” Maaari ring unawain bilang “kung paano siya muling nakakita” o “kung paano nanumbalik ang kaniyang paningin.”
    reason: lexical_alternative
  - marker: b
    text: O, “luwad.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: muli
  rationale: Malinaw na ipinahihiwatig ang pag-uulit ng pagtatanong.
- source_word: οὖν
  choice: kaya
  rationale: Ipinapakita ang pagpapatuloy at bunga ng naunang salaysay nang hindi pinabibigat ang lohikal na ugnayan.
- source_word: ἠρώτων
  choice: tinanong
  rationale: Bagaman imperpekto ang pandiwa at maaaring magpahiwatig ng nagpapatuloy na pagtatanong, naipahahayag na ng “muli” ang pag-uulit sa natural na Tagalog.
- source_word: καὶ οἱ Φαρισαῖοι
  choice: rin ... ng mga Pariseo
  rationale: Pinananatili ng “rin” ang diwa na kasama rin ang mga Pariseo sa mga nagtanong, habang gumagamit ng natural na ayos ng pangungusap sa Tagalog.
- source_word: πῶς ἀνέβλεψεν
  choice: kung paano siya nakakita
  rationale: Tumpak at natural sa konteksto ng lalaking dating bulag; hindi ipinapalagay ng salin na dati na siyang nakakakita, samantalang inilalahad sa talababa ang posibleng mas tahasang pagpapahayag.
- source_word: Πηλὸν
  choice: putik
  rationale: Ang πηλός ay maaaring tumukoy sa putik o luwad; “putik” ang mas karaniwan at madaling maunawaan sa kontekstong ito.
- source_word: ἐπέθηκέν μου ἐπὶ τοὺς ὀφθαλμούς
  choice: Nilagyan niya ng putik ang mga mata ko
  rationale: Natural na Tagalog para sa paglalagay ng isang bagay sa ibabaw ng mga mata at pinananatili ang tahasang kilos.
- source_word: ἐνιψάμην
  choice: naghugas ako
  rationale: Pinananatili ang payak na pahayag ng aorist middle; hindi na kailangang dagdagan ng “ng sarili ko,” na magiging di-natural dito.
- source_word: βλέπω
  choice: nakakakita ako
  rationale: Pinananatili ang kasalukuyang kalagayan at agarang bisa ng pangkasalukuyang pandiwa nang hindi dinaragdagan ng tahasang modal na “kaya ko nang.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang “Pariseo,” “putik,” at “nakakakita” upang maging madaling maunawaan, habang pinananatili sa mga talababa ang tunay na saklaw ng ἀναβλέπω at πηλός. Itinama ang pagkakaugnay ng mga marker ayon sa mismong mga salitang tinatalaban ng bawat paliwanag.
