  text: After saying these things[a], he spit on the ground and made mud from the saliva, and he spread the mud on his eyes,
translation:
  language: tl
  text: Matapos niyang sabihin ang mga ito, dumura siya sa lupa at gumawa ng putik mula sa laway, at ipinahid niya ang putik sa mga mata ng lalaki.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “pinahiran niya ng putik ang mga mata ng lalaki.” Ang pandiwang Griyego ay maaaring mangahulugang “pahiran” o “ipahid.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα εἰπὼν
  choice: Pagkasabi nito
  rationale: Ipinahahayag ng aorist participle ang kilos na nauna sa mga sumunod na pandiwa. Likas at maikli sa makabagong Tagalog ang “Pagkasabi nito,” at malinaw ang pagkakasunod-sunod ng mga kilos.
- source_word: ἔπτυσεν χαμαί
  choice: dumura siya sa lupa
  rationale: Tuwirang inilalarawan ng χαμαί ang pagdura sa lupa; karaniwan at malinaw ang pariralang ito sa Tagalog.
- source_word: ἐποίησεν πηλὸν ἐκ τοῦ πτύσματος
  choice: gumawa ng putik mula sa laway
  rationale: Maaaring mangahulugan ang πηλός ng luwad o putik, ngunit “putik” ang pinakanatural para sa lupang hinaluan ng laway. Pinananatili ng “mula sa laway” ang diwa ng ἐκ τοῦ πτύσματος.
- source_word: ἐπέχρισεν
  choice: ipinahid
  rationale: Ang ἐπιχρίω ay maaaring tumukoy sa pagpapahid o paglalagay sa ibabaw. Ang “ipinahid” ay malinaw na naglalarawan sa pisikal na kilos nang hindi nagpapasok ng seremonyal na pahiwatig.
- source_word: αὐτοῦ τὸν πηλὸν ἐπὶ τοὺς ὀφθαλμούς
  choice: ipinahid niya ang putik sa mga mata ng lalaki
  rationale: Ang αὐτοῦ ay tumutukoy sa lalaking bulag sa konteksto. Ginamit ang “ng lalaki” upang maiwasan ang malabong pagtukoy ng “niya” sa Tagalog, habang pinananatili ang kahulugan ng teksto.
theological_decisions:
- issue: Posibleng seremonyal na pahiwatig ng ἐπέχρισεν
  choice: ipinahid niya ang putik
  alternative: pinahiran niya ng putik ang mga mata ng lalaki
  rationale: Inilalarawan muna ng talata ang isang kongkretong pisikal na kilos, hindi tahasang seremonyal na pagpapahid. Kaya ginamit sa pangunahing teksto ang neutral na “ipinahid,” habang inilalahad sa talababa ang maaari ring saling “pinahiran” upang mapanatili ang lawak ng pandiwang Griyego.
translation_notes:
  register: Makabago, natural, at marangal na Tagalog. Hinati sa dalawang pangungusap upang maging malinaw ang sunod-sunod na kilos at maiwasan ang mabigat na pagkakabit-kabit ng mga sugnay. Ginamit ang “lalaki” bilang kontekstuwal na pagtukoy upang hindi mapagkamalang kay Jesus ang mga mata.
