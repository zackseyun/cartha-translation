source:
  edition: SBLGNT
  text: ⸀ἡμᾶς δεῖ ἐργάζεσθαι τὰ ἔργα τοῦ πέμψαντός με ἕως ἡμέρα ἐστίν· ἔρχεται νὺξ ὅτε οὐδεὶς δύναται ἐργάζεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/004.yaml
  text: We must do the works of the one who sent me while it is day; night is coming[a], when no one can work.
translation:
  language: tl
  text: Kailangan nating gawin ang mga gawain ng nagsugo sa akin habang araw pa; dumarating ang gabi[a], kung kailan walang sinumang makagagawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ganito ang mababasa sa ilang manuskrito: “Kailangan kong gawin ang mga gawain ng nagsugo sa akin.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἡμᾶς
  choice: nating
  rationale: Ang unang panauhang maramihang akusatibo kasama ng δεῖ ay nangangahulugang “kailangan natin”; natural itong ipinahahayag sa Tagalog sa pamamagitan ng “Kailangan nating.”
- source_word: δεῖ
  choice: Kailangan
  rationale: Malinaw at likas na ipinahahayag nito ang diwa ng pangangailangan o pananagutan.
- source_word: ἐργάζεσθαι τὰ ἔργα
  choice: gawin ang mga gawain
  rationale: Iniiwasan nito ang alanganing pag-uulit na “gawain ang mga gawain,” ngunit pinananatili ang ugnayan ng pandiwa at ng mga gawaing ipinagkaloob ng nagsugo.
- source_word: τοῦ πέμψαντός με
  choice: ng nagsugo sa akin
  rationale: Natural at tuwirang salin ng substantibong participle; hindi nito tahasang pinapangalanan ang nagsugo kung hindi ito ginagawa ng Griyego.
- source_word: ἕως ἡμέρα ἐστίν
  choice: habang araw pa
  rationale: Likas na idyomatikong Tagalog para sa panahong may pagkakataon pang kumilos, at malinaw ang kaibahan nito sa dumarating na gabi.
- source_word: ἔρχεται νὺξ
  choice: dumarating ang gabi
  rationale: Pinananatili ang aspektong pangkasalukuyan at ang diwa ng nalalapit na pagdating.
- source_word: ὅτε οὐδεὶς δύναται ἐργάζεσθαι
  choice: kung kailan wala nang makagagawa
  rationale: Likas na Tagalog na nagpapahayag na sa panahong iyon ay wala nang sinumang may kakayahang gumawa.
theological_decisions:
- issue: 'Tekstuwal na baryante sa simula ng talata: ἡμᾶς (“tayo/natin”) laban sa singular na “ako/akin”'
  choice: Kailangan nating gawin ang mga gawain ng nagsugo sa akin
  alternative: Kailangan kong gawin ang mga gawain ng nagsugo sa akin
  rationale: Sinusunod ng pangunahing teksto ang ibinigay na SBLGNT na may ἡμᾶς, kaya kasama ang mga alagad sa pangangailangang gumawa. Inilalagay sa talababa ang laganap na singular na pagbasa upang maging malinaw ang ebidensiyang tekstuwal nang hindi pinagpapasyahan ang posibleng teolohikal na implikasyon nito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “habang araw pa” at “wala nang makagagawa” bilang natural na mga pahayag, habang pinanatili ang talinghaga ng araw, gabi, at paggawa.
