id: JHN.9.22
reference: John 9:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ταῦτα εἶπαν οἱ γονεῖς αὐτοῦ ὅτι ἐφοβοῦντο τοὺς Ἰουδαίους, ἤδη γὰρ συνετέθειντο οἱ Ἰουδαῖοι ἵνα ἐάν τις αὐτὸν ὁμολογήσῃ χριστόν, ἀποσυνάγωγος γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/022.yaml
  text: His parents said these things because they were afraid of the Jews[a], for the Jews had already agreed that if anyone confessed him as the Messiah[b], he would be put out of the synagogue.
translation:
  language: tl
  text: Sinabi ng kanyang mga magulang ang mga bagay na ito dahil natatakot sila sa mga Judio[a]. Sapagkat napagkasunduan na ng mga Judio na kung may sinumang kumilala sa kanya bilang Mesiyas[b], ititiwalag siya sa sinagoga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Griyego: “mga Judio.” Sa kontekstong ito, malamang na tumutukoy ito sa mga pinunong Judio, hindi sa lahat ng Judio nang walang pagtatangi.'
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin na “kumilala sa kanya bilang Cristo” o “kumilala sa kanya bilang ang Cristo.”
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: ang mga bagay na ito
  rationale: Pinananatili ang tahasang pangmaramihang demonstratibo at ang pagtukoy nito sa mga naunang sinabi ng mga magulang.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: kanyang mga magulang
  rationale: Likas at tumpak na katumbas sa modernong Tagalog ng pangmaramihang γονεῖς kasama ang panghalip na paari.
- source_word: ὅτι ἐφοβοῦντο
  choice: dahil natatakot sila
  rationale: Ang ὅτι ay nagbibigay ng dahilan, at ang imperpektong ἐφοβοῦντο ay nagpapahiwatig ng nagpapatuloy na takot.
- source_word: τοὺς Ἰουδαίους / οἱ Ἰουδαῖοι
  choice: mga Judio
  rationale: Pinananatili sa pangunahing teksto ang malawak na katawagang nasa Griyego; nililinaw sa talababa na sa kontekstong ito ay malamang na tumutukoy ito sa mga pinunong may kapangyarihang magtiwalag mula sa sinagoga.
- source_word: ἤδη ... συνετέθειντο
  choice: napagkasunduan na
  rationale: Ipinahihiwatig ng anyong pluperpekto ang isang kasunduang nabuo na bago ang pangyayaring isinasalaysay.
- source_word: αὐτὸν ὁμολογήσῃ χριστόν
  choice: kumilala sa kanya bilang Mesiyas
  rationale: Ang ὁμολογέω ay tumutukoy rito sa pagkilala o pagpapahayag ng pagkilala, at ang χριστός ay ginagamit bilang titulong Mesiyas.
- source_word: ἀποσυνάγωγος γένηται
  choice: ititiwalag siya sa sinagoga
  rationale: Ipinahahayag ang pormal na pagkakait ng pagiging kabilang sa pamayanang nakaugnay sa sinagoga, hindi lamang ang pansamantalang pagpapaalis sa gusali.
theological_decisions:
- issue: Pagpapakahulugan sa χριστός bilang titulo
  choice: Mesiyas
  alternative: Cristo; ang Cristo
  rationale: Sa kontekstong ito, ang χριστός ay malinaw na titulong ipinapahayag tungkol kay Jesus. Ang “Mesiyas” ay nagpapanatili sa kontekstong Judio at sa kahulugan nitong pinahiran.
- issue: Tinutukoy ng οἱ Ἰουδαῖοι sa Ebanghelyo ni Juan
  choice: mga Judio, na may paglilinaw sa talababa
  alternative: mga pinunong Judio; mga taga-Judea
  rationale: Hindi tahasang nililimitahan ng salitang Griyego ang tinutukoy, ngunit ipinakikita ng agarang konteksto na ang grupong may kapangyarihang magtiwalag mula sa sinagoga ang malamang na tinutukoy. Pinananatili ng pangunahing teksto ang tunay na lawak ng katawagan habang iniiwasan ng talababa ang mapaminsalang paglalahat.
- issue: Saklaw ng ἀποσυνάγωγος
  choice: ititiwalag sa sinagoga
  alternative: palalayasin sa sinagoga; hindi na tatanggapin sa sinagoga
  rationale: Ang “ititiwalag” ay nagpapahiwatig ng pagkawala ng katayuan at pakikibahagi sa pamayanan, na higit na angkop kaysa sa paglalarawan lamang ng pisikal na pagpapaalis.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “napagkasunduan na” upang natural na ihayag ang naunang kasunduan, at “ititiwalag” upang ipakita ang panlipunan at panrelihiyong pagbubukod nang hindi nagdaragdag ng denominasyonal na kahulugan.
