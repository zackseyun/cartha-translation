base_translation:
  language: en
  yaml_path: translation/nt/john/009/037.yaml
  text: Jesus said to him[a], “You have seen him, and the one speaking with you is he.”
translation:
  language: tl
  text: Sinabi ni Jesus sa kanya, “Nakita mo na siya, at ang nakikipag-usap sa iyo ay siya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: Sinabi sa kanya ni Jesus
  rationale: Likas na ayos sa makabagong Tagalog para sa payak na pagsasalaysay; pinananatili ng “sa kanya” ang tatanggap ng sinabi nang hindi dinaragdagan ang puwersa ng pandiwa.
- source_word: Καὶ ἑώρακας αὐτὸν
  choice: Nakita mo na siya
  rationale: Ipinahihiwatig ng “na” ang naganap nang pagkakita na may bisa sa kasalukuyang sandali, kaya angkop ito sa perpektong anyong ἑώρακας. Hindi kailangang isalin nang hiwalay ang panimulang καί sa Tagalog, sapagkat natural na naipagpapatuloy ng kasunod na “at” ang dalawang magkaugnay na pahayag.
- source_word: ὁ λαλῶν μετὰ σοῦ
  choice: ang nakikipag-usap sa iyo
  rationale: Ang “nakikipag-usap” ay natural na katumbas ng kasalukuyang substantival participle at naipapakita ang diwang may pakikipag-ugnayan ng μετά + genitive. Ang “sa iyo” ang karaniwang idyoma sa Tagalog para sa kausap.
- source_word: ἐκεῖνός ἐστιν
  choice: siya ang
  rationale: Ang hulma na “siya ang nakikipag-usap sa iyo” ay malinaw at tuwirang pagkakakilanlan sa natural na Tagalog, nang hindi inuulit o idinaragdag ang titulong nasa naunang talata.
theological_decisions:
- issue: Ang pagkakakilanlan ni Jesus bilang tinutukoy ng lalaki sa naunang konteksto
  choice: “siya ang nakikipag-usap sa iyo”
  alternative: “ang nakikipag-usap sa iyo ay siya” / “ako ang nakikipag-usap sa iyo”
  rationale: Pinananatili ng napiling salin ang tuwirang pagkakakilanlan ng Griyego ngunit hindi ito pinalalawak tungo sa tahasang “ako,” ni inuulit ang titulong hindi nakasulat sa talatang ito.
translation_notes:
  register: Makabagong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang “nakikipag-usap” sa halip na mas kolokyal na “nakikipagkuwentuhan” o mas matigas na literal na ayos. Walang talababa dahil walang leksikal na alternatibong kailangang ilahad para maunawaan ang talata.
