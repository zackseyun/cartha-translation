id: JHN.9.17
reference: John 9:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: λέγουσιν ⸀οὖν τῷ τυφλῷ πάλιν· ⸂Τί σὺ⸃ λέγεις περὶ αὐτοῦ, ὅτι ἠνέῳξέν σου τοὺς ὀφθαλμούς; ὁ δὲ εἶπεν ὅτι Προφήτης ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/017.yaml
  text: So they said again to the blind man[a], “What do you say about him, since he opened your eyes?” And he said[c][b], “He is a prophet.”
translation:
  language: tl
  text: Kaya muli nilang sinabi sa lalaking bulag, “Ikaw, ano ang masasabi mo tungkol sa kanya, yamang binuksan niya ang iyong mga mata?” Sumagot siya, “Isa siyang propeta.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Siya ang Propeta.” Maaaring unawain ang Griyego na may higit na puwersa bilang isang titulo, bagaman sinusuportahan din ng konteksto ang “isang propeta.”'
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Ipinapakita ang lohikal at pasalaysay na pagpapatuloy mula sa naunang pagtatalo, nang hindi nagiging labis na pormal.
- source_word: τῷ τυφλῷ
  choice: sa lalaking bulag
  rationale: Ang pang-uri ay ginagamit bilang pangngalan. Likas at tuwiran ito sa Tagalog at hindi ipinapasok ang pananaw na “dating bulag,” na hindi tahasang nasa parirala.
- source_word: πάλιν
  choice: muli
  rationale: Pinananatili ang diwa ng muling pagtatanong sa nagpapatuloy na pagsisiyasat.
- source_word: Τί σὺ λέγεις
  choice: Ikaw, ano ang masasabi mo
  rationale: Ang tahasang σὺ ay may diin; ang pag-una sa “Ikaw” ay natural na paraan sa Tagalog upang mapanatili iyon.
- source_word: περὶ αὐτοῦ
  choice: tungkol sa kanya
  rationale: Karaniwan at malinaw na katumbas ng περί na may genitive sa kontekstong ito.
- source_word: ὅτι
  choice: yamang
  rationale: 'Ipinahahayag ang posibleng dahilang batayan ng tanong: ano ang masasabi niya tungkol kay Jesus dahil sa ginawa nito. Pinananatili rin ang ugnayang maaaring isalin na “dahil.”'
- source_word: ἠνέῳξέν σου τοὺς ὀφθαλμούς
  choice: binuksan niya ang iyong mga mata
  rationale: Tuwirang salin ng aorist na pandiwa at ng kongkretong idyoma ng Griyego; malinaw sa konteksto ng pagpapagaling.
- source_word: Προφήτης ἐστίν
  choice: Isa siyang propeta
  rationale: Natural na predikasyong di-tiyak sa Tagalog. Ipinakikilala si Jesus bilang kabilang sa uri ng mga propeta nang hindi ipinapalagay ang tiyak na titulong “ang Propeta.”
theological_decisions:
- issue: Kung ang Προφήτης ay karaniwang pangngalan o isang natatanging titulo
  choice: Isa siyang propeta
  alternative: Siya ang Propeta
  rationale: Walang artikulo ang predikatibong Προφήτης, at sa takbo ng salaysay ay umuunlad pa ang pagkilala ng lalaki kay Jesus. Ang karaniwang pangngalan ang mas maingat na pangunahing salin, habang itinatala sa talababa ang posibleng mas titulong pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang diin sa tahasang “ikaw” at iniwasan ang sobrang pormal na bokabularyo. Isang talababa lamang ang ginamit para sa tunay na teolohikal at gramatikal na posibilidad sa Προφήτης.
