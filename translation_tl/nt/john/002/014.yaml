source:
  edition: SBLGNT
  text: καὶ εὗρεν ἐν τῷ ἱερῷ τοὺς πωλοῦντας βόας καὶ πρόβατα καὶ περιστερὰς καὶ τοὺς κερματιστὰς καθημένους,
base_translation:
  language: en
  yaml_path: translation/nt/john/002/014.yaml
  text: And he found in the temple those selling oxen and sheep and doves[a], and the money changers sitting there.
translation:
  language: tl
  text: At natagpuan niya sa templo[a] ang mga nagtitinda ng mga baka, tupa, at kalapati, at ang mga tagapagpalit ng salapi na nakaupo roon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griego para sa “templo” ay ἱερόν, na tumutukoy sa buong kompleks o bakuran ng templo, hindi lamang sa panloob na santuwaryo.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὗρεν
  choice: nakita niya
  rationale: Bagaman ang pangunahing diwa ng εὑρίσκω ay ‘makatagpo’ o ‘masumpungan,’ sa tagpong ito ang ‘nakita niya’ ang pinakanatural na paglalarawan sa nadatnan ni Jesus nang pumasok siya sa templo.
- source_word: ἱερῷ
  choice: templo
  rationale: Ang ἱερόν ay tumutukoy sa buong bakuran o kompleks ng templo, hindi lamang sa panloob na santuwaryo; natural sa pangunahing teksto ang ‘templo,’ habang nililinaw ng talababa ang saklaw nito.
- source_word: πωλοῦντας
  choice: mga nagtitinda
  rationale: Pinananatili nito ang nagpapatuloy na kilos ng kasalukuyang participle at natural itong pakinggan sa makabagong Tagalog.
- source_word: βόας
  choice: mga baka
  rationale: Ang βοῦς ay tumutukoy sa mga hayop na kabilang sa cattle; mas pangkaraniwan at hindi labis na tiyak ang ‘mga baka’ kaysa ‘mga toro’ o ‘mga kapong baka.’
- source_word: πρόβατα
  choice: mga tupa
  rationale: Ito ang malinaw at karaniwang katumbas ng πρόβατα sa kontekstong ito.
- source_word: περιστερὰς
  choice: mga kalapati
  rationale: Saklaw ng περιστερά ang dove o pigeon; ang ‘kalapati’ ang natural at tradisyonal na katawagang Filipino sa konteksto ng mga handog.
- source_word: κερματιστὰς
  choice: mga nagpapalit ng salapi
  rationale: Tumpak nitong inilalarawan ang mga taong nagpapalit ng mga barya o salapi at mas malinaw ito sa pangkalahatang mambabasa kaysa sa mas teknikal na katawagan.
- source_word: καθημένους
  choice: nakaupo roon
  rationale: Pinananatili nito ang kanilang postura at nakapirming presensya sa lugar, gaya ng ipinahihiwatig ng participle.
theological_decisions:
- issue: Saklaw ng ἱερόν kaugnay ng templo sa Jerusalem
  choice: ‘Templo’ sa pangunahing teksto, na may talababa na tumutukoy ito sa buong bakuran o kompleks ng templo.
  alternative: ‘mga looban ng templo,’ ‘bakuran ng templo,’ o ‘santuwaryo’
  rationale: Ipinahihiwatig ng tagpo ng mga nagtitinda ng hayop at nagpapalit ng salapi na ang tinutukoy ay ang mas malawak na kompleks ng templo, hindi ang panloob na santuwaryo. Pinananatili ng ‘templo’ ang natural na daloy, at ng talababa ang mahalagang pagkakaibang pangkasaysayan at panlugar.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang ‘mga nagtitinda’ at ‘mga nagpapalit ng salapi’ bilang natural na mga pariralang madaling maunawaan, habang pinanatili sa talababa ang tiyak na saklaw ng ἱερόν.
