id: JHN.2.1
reference: John 2:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ τῇ ⸂ἡμέρᾳ τῇ τρίτῃ⸃ γάμος ἐγένετο ἐν Κανὰ τῆς Γαλιλαίας, καὶ ἦν ἡ μήτηρ τοῦ Ἰησοῦ ἐκεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/john/002/001.yaml
  text: And on the third day there was a wedding in Cana of Galilee[b][a], and the mother of Jesus was there.
translation:
  language: tl
  text: At sa ikatlong araw, may kasalang[a] ginanap sa Cana sa Galilea, at naroon ang ina ni Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “pagdiriwang ng kasal.”
    reason: Maaaring tumukoy ang γάμος sa kasal mismo o sa pagdiriwang at handaan kaugnay nito.
lexical_decisions:
- source_word: Καὶ
  choice: At
  rationale: Pinananatili ang payak na pang-ugnay at ang tuloy-tuloy na daloy ng salaysay ni Juan.
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: sa ikatlong araw
  rationale: Likas na pahayag sa Tagalog para sa tiyak na panandang temporal; hindi dinaragdagan ng “pagkatapos” na wala sa mismong parirala.
- source_word: γάμος
  choice: kasalan
  rationale: Ang “kasalan” ay natural sa modernong Tagalog at maaaring tumukoy sa okasyon at pagdiriwang ng kasal, gaya ng saklaw ng salitang Griyego.
- source_word: ἐγένετο
  choice: may ... ginanap
  rationale: Ipinakikilala ng pandiwa ang pangyayaring naganap; ang pariralang ito ay malinaw at natural sa Tagalog.
- source_word: ἐν Κανὰ τῆς Γαλιλαίας
  choice: sa Cana sa Galilea
  rationale: Malinaw na ipinapahayag ang lokasyon ng Cana sa Galilea nang hindi gumagamit ng di-likas na genitibong anyo sa Tagalog.
- source_word: ἦν ... ἐκεῖ
  choice: naroon
  rationale: Maikli at tuwirang pinagsasama ang diwa ng pandiwang “was” at ng pang-abay na “there,” habang pinananatili ang impormasyong panlikuran sa salaysay.
- source_word: ἡ μήτηρ τοῦ Ἰησοῦ
  choice: ang ina ni Jesus
  rationale: Natural at marangal na anyo sa Tagalog na malapit sa genitibong pagkakabuo ng Griyego.
theological_decisions:
- issue: Ang panandang panahong “ikatlong araw”
  choice: Pinanatili bilang payak na impormasyong kronolohikal.
  alternative: Ipahiwatig sa salin na sagisag ito ng muling pagkabuhay.
  rationale: Maaaring makakita ang mga mambabasa ng mas malalim na temang teolohikal, ngunit sa pangungusap mismo ay nagsisilbi itong pananda ng panahon. Pinananatili ng salin ang posibleng pahiwatig nang hindi ito ipinapasok bilang tahasang interpretasyon.
translation_notes:
  register: Gumamit ng moderno, malinaw, at marangal na Tagalog. Ang “kasalang ginanap” at “naroon” ay pangkaraniwang mauunawaan ngunit angkop sa salaysay ng Kasulatan.
