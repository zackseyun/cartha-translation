  source_fidelity: 'Tumpak na naisalin ang mga pangunahing sangkap ng Griyego: ang payak na pang-ugnay, ang tiyak na panandang “sa ikatlong araw,” ang pangyayaring γάμος, ang lokasyong Cana sa Galilea, at ang panlikurang pahayag na naroon ang ina ni Jesus. Hindi ipinapasok ang anumang simbolikong pagbasa sa “ikatlong araw.”'
