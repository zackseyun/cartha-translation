id: JHN.2.2
reference: John 2:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐκλήθη δὲ καὶ ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ εἰς τὸν γάμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/002.yaml
  text: Jesus also was invited to the wedding[a], along with his disciples.
translation:
  language: tl
  text: Inanyayahan din sa kasalan si Jesus at ang kanyang mga alagad.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκλήθη
  choice: inanyayahan
  rationale: Sa konteksto ng pagdalo sa isang kasalan, ang pasibong anyo ng καλέω ay likas na nangangahulugang “inanyayahan,” hindi lamang “tinawag.”
- source_word: δὲ καὶ
  choice: din
  rationale: Ipinahihiwatig ng magkasamang banayad na pang-ugnay at pandagdag na καί na kasama rin si Jesus sa mga inanyayahan; natural itong ipinapahayag sa Tagalog sa pamamagitan ng “din.”
- source_word: ὁ Ἰησοῦς
  choice: si Jesus
  rationale: Ginamit ang karaniwang makabagong anyo ng pangalan sa Filipino, kasama ang pantukoy na “si” para sa pangalang pantangi.
- source_word: καὶ οἱ μαθηταὶ αὐτοῦ
  choice: at ang kanyang mga alagad
  rationale: Pinananatili ng “at” ang tahasang koordinasyon sa Griyego. Ang “mga alagad” ang kinagawiang salin ng μαθηταί at saklaw nito ang kaugnayan nila kay Jesus bilang mga natututo at sumusunod sa kanya.
- source_word: εἰς τὸν γάμον
  choice: sa kasalan
  rationale: Sa kontekstong ito, ang γάμος ay tumutukoy sa kasal bilang pagdiriwang o pagtitipon. Ang “sa kasalan” ay natural at malinaw na Filipino nang hindi nagdaragdag ng salitang “piging,” na hindi tahasang nasa talata.
theological_decisions: []
translation_notes:
  register: Natural, maikli, at marangal na modernong Filipino. Pinanatili ang ayos na si Jesus at ang kanyang mga alagad ay kapwa inanyayahan, nang hindi nagpapahiwatig ng anumang dagdag na teolohikal na kahulugan.
