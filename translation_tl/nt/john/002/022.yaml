    rationale: Ang “ibangon” ay hindi nagmamarka ng naganap na kilos sa karaniwang Tagalog. Dahil tumutukoy ang talata sa pangyayaring naganap na pagkabuhay, kailangan ang “ibinangon.”
  - severity: low
    issue: Medyo paulit-ulit ang “salitang sinabi”
    rationale: Hindi ito mali, ngunit mas natural ang “salitang binigkas,” na malinaw pa ring nagsasaad na ito ang salitang sinambit ni Jesus.
