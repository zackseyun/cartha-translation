  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτε οὖν ἠγέρθη ἐκ νεκρῶν, ἐμνήσθησαν οἱ μαθηταὶ αὐτοῦ ὅτι τοῦτο ἔλεγεν, καὶ ἐπίστευσαν τῇ γραφῇ καὶ τῷ λόγῳ ⸀ὃν εἶπεν ὁ Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/022.yaml
  text: So when he was raised from the dead, his disciples remembered that he had been saying this, and they believed the Scripture and the word that Jesus had spoken.
translation:
  language: tl
  text: Kaya, nang siya ay ibinangon mula sa mga patay[a], naalala ng kanyang mga alagad na sinabi niya ito[b], at naniwala sila sa Kasulatan at sa salitang binigkas ni Jesus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bumangon siya mula sa mga patay.” Balintiyak ang pandiwang Griyego, “ibinangon,” at ito ang pinananatili sa pangunahing teksto.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “na sinasabi niya ito” o “na paulit-ulit niyang sinasabi ito.” Maaaring ipahiwatig ng anyo ng pandiwang Griyego ang nagpapatuloy o paulit-ulit na pagsasalita noon.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “pahayag.” Ang salitang Griyego ay maaaring tumukoy sa salita, pahayag, o mensahe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε οὖν
  choice: Kaya nang
  rationale: Pinagsasama nito ang panandang bunga o pagpapatuloy na οὖν at ang panahong ipinakikilala ng ὅτε sa natural na Tagalog.
- source_word: ἠγέρθη
  choice: siya ay ibangon
  rationale: Pinananatili ang balintiyak na anyo ng Griyego at ang karaniwang diwa ng ἐγείρω sa konteksto ng muling pagkabuhay.
- source_word: ἐκ νεκρῶν
  choice: mula sa mga patay
  rationale: Tapat ito sa pangmaramihang νεκρῶν at likas na pahayag sa Tagalog para sa pagbangon mula sa kamatayan.
- source_word: ἐμνήσθησαν
  choice: naalala
  rationale: Natural na ipinapahayag ang pagdating sa alaala na tinutukoy ng pandiwa.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ang kanyang mga alagad
  rationale: Likas at malinaw na salin ng pariralang paari.
- source_word: ὅτι τοῦτο ἔλεγεν
  choice: na sinabi niya ito
  rationale: Sa konteksto, tumutukoy ang imperfect sa naunang sinabi ni Jesus; ang payak na Tagalog ay natural at hindi nagdaragdag ng tiyak na ideya ng paulit-ulit na pagsasalita.
- source_word: ἐπίστευσαν
  choice: naniwala sila
  rationale: Pinakasimple at hindi labis na interpretatibong salin ng πιστεύω kasama ng mga layong nasa datibo.
- source_word: τῇ γραφῇ
  choice: sa Kasulatan
  rationale: Pinananatili ang isahan at ang diwa ng banal at may awtoridad na kasulatan.
- source_word: τῷ λόγῳ
  choice: sa salitang
  rationale: Pinananatili ang leksikal na diwa ng λόγος habang malinaw na tumutukoy sa sinabi ni Jesus.
- source_word: ὃν εἶπεν ὁ Ἰησοῦς
  choice: na sinabi ni Jesus
  rationale: Natural na sugnay na naglalarawan sa ‘salita’ at nagpapanatili sa tahasang pagkakabanggit kay Jesus.
theological_decisions:
- issue: Balintiyak na anyo ng pandiwa para sa muling pagkabuhay
  choice: siya ay ibangon mula sa mga patay
  alternative: bumangon siya mula sa mga patay
  rationale: Pinananatili ng pangunahing salin ang balintiyak na gramatika ng ἠγέρθη nang hindi tinutukoy sa salin kung sino ang gumagawa.
- issue: Diwa ng πιστεύω na may mga layong nasa datibo
  choice: naniwala sila sa Kasulatan at sa salita
  alternative: nagtiwala sila sa Kasulatan at sa salita
  rationale: Ang ‘naniwala’ ang hindi gaanong interpretatibong salin at likas na tumutukoy sa pagtanggap na totoo ng Kasulatan at ng sinabi ni Jesus.
- issue: Aspekto ng imperfect na ἔλεγεν
  choice: sinabi niya ito
  alternative: sinasabi niya ito
  rationale: Hindi sapilitang nilulutas ng imperfect kung paulit-ulit, nagpapatuloy, o pangkalahatang nakaraang pagsasalita ang diin; natural ang pangunahing salin at inilalahad sa talababa ang alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignified, at madaling maunawaan. Ginamit ang “Kasulatan” bilang isahan, pinanatili ang balintiyak na resurrection verb, at iniwasan ang di-likas na progresibong anyo sa pangunahing teksto habang pinananatili ang posibleng aspektuwal na diwa sa talababa.
