revisions:
- from: Kaya nang siya ay ibangon mula sa mga patay[a], naalala ng kanyang mga alagad na sinabi niya ito[b]. At naniwala sila sa Kasulatan at sa salitang sinabi ni Jesus[c].
  to: Kaya, nang siya ay ibinangon mula sa mga patay[a], naalala ng kanyang mga alagad na sinabi niya ito[b], at naniwala sila sa Kasulatan at sa salitang binigkas ni Jesus[c].
  rationale: Pinalitan ang “ibangon” ng “ibinangon” upang maging wastong nakaraang-balintiyak na salin ng ἠγέρθη. Inayos din ang huling parirala sa “salitang binigkas ni Jesus” para sa mas likas na Tagalog nang walang pagbabago sa kahulugan. Iningatan ang di-tiyak na aspektuwal na nuansa ng ἔλεγεν sa talababa at ang mga umiiral na angkla ng talababa.
