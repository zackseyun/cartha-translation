  source_fidelity: 'Kailangang itama ang aspektong pandiwa sa pangunahing teksto: ang “siya ay ibangon” ay anyong di-naganap/nakatuon sa hinaharap o utos sa karaniwang modernong Tagalog, samantalang ang Griyegong ἠγέρθη ay nakaraang pangyayari. Ang “siya ay ibinangon” ay tapat na nagpapanatili ng balintiyak na tinig at ng naganap na aspekto.'
  naturalness: Natural at malinaw ang kabuuang daloy matapos ang maliit na pagwawasto. Ang “Kaya, nang” ay katanggap-tanggap na modernong pang-ugnay; ang “naalala ... na sinabi niya ito” ay likas. Ang “salitang binigkas ni Jesus” ay mas matatas kaysa “salitang sinabi ni Jesus,” habang tapat pa rin sa λόγος na sinambit ni Jesus.
  terminology: Ang “Kasulatan” ay wastong isahan para sa τῇ γραφῇ. Ang “ibinangon” ay nagpapanatili ng balintiyak na anyo nang hindi tinutukoy ang tagaganap. Ang “naniwala sila sa” ay katanggap-tanggap na di-mapagpasyang salin ng ἐπίστευσαν sa kontekstong ito.
