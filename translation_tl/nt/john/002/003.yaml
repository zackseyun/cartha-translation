  text: And when the wine ran out[a], the mother of Jesus says to him[b], “They have no wine.”
translation:
  language: tl
  text: At nang maubos ang alak,[a] sinabi sa kanya ng ina ni Jesus,[b] “Wala na silang alak.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O mas literal, “nang magkulang ang alak.”
    reason: lexical_alternative
  - marker: b
    text: 'Pangkasalukuyan ang pandiwa sa Griyego: “sinasabi.” Ginagamit ito bilang makasaysayang pangkasalukuyan sa salaysay.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑστερήσαντος οἴνου
  choice: nang maubusan sila ng alak
  rationale: Ang genitive absolute na may aorist participle ay nagsasaad ng pangyayaring nakapaligid at nauuna sa pangunahing pandiwa. Likas sa modernong Tagalog ang “maubusan ng alak,” samantalang pinananatili ng “sila” ang di-tiyak na sangguniang ipinahihiwatig ng konteksto.
- source_word: λέγει
  choice: sinabi
  rationale: Bagaman historical present ang Griyegong λέγει, karaniwang inilalahad sa nakaraang panahunan ang salaysay sa natural na Tagalog. Itinatala sa talababa ang literal na anyong pangkasalukuyan.
- source_word: ἡ μήτηρ τοῦ Ἰησοῦ
  choice: ang ina ni Jesus
  rationale: Malapit ito sa ayos at paraan ng pagtukoy ng Griyego at likas ding pakinggan sa Tagalog.
- source_word: πρὸς αὐτόν
  choice: sa kanya
  rationale: Kasama ng “sinabi,” natural na ipinahahayag ng “sa kanya” ang taong kinausap nang hindi inuulit ang kilos ng pagsasalita.
- source_word: Οἶνον οὐκ ἔχουσιν
  choice: Wala na silang alak
  rationale: Direkta at likas itong Tagalog. Hindi tinutukoy kung sino ang implicit na maramihang paksa, kaya nananatili ang “sila”; ipinahihiwatig ng “na” na nawala na ang dating suplay ayon sa konteksto.
- source_word: οἶνος
  choice: alak
  rationale: Ang karaniwang kahulugan ay alak; walang batayan sa konteksto upang pahinain o palitan ang termino.
theological_decisions:
- issue: Historical present sa salaysay ni Juan
  choice: Isinalin bilang nakaraang panahunan na “sinabi” para sa natural na salaysay sa Tagalog, na may talababa tungkol sa literal na pangkasalukuyan.
  alternative: Panatilihin ang pangkasalukuyang “sinasabi.”
  rationale: Karaniwan at mas malinaw sa modernong Tagalog ang nakaraang panahunan sa ganitong salaysay. Hindi nito binabago ang nilalaman, at pinananatili ng talababa ang impormasyong pangdiskurso ng Griyego.
- issue: Sanggunian ng di-hayag na maramihang paksa sa Οἶνον οὐκ ἔχουσιν
  choice: Panatilihin bilang “sila” nang hindi tinutukoy kung mga punong-abala o buong pangkat sa kasalan.
  alternative: Tukuyin bilang “mga punong-abala” o “mga nasa kasalan.”
  rationale: Hindi hayagang tinutukoy ng Griyego ang sanggunian. Ang “sila” ay nagpapanatili sa tunay na kalabuan at umiiwas sa pagdaragdag ng detalyeng wala sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Pinili ang “maubusan” at “wala na” bilang karaniwang pananalita nang hindi nilulutas kung sino ang tinutukoy ng “sila.” Ang mga pananda ng talababa [a] at [b] ay kapwa nasa pangunahing teksto.
