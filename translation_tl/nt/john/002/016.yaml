id: JHN.2.16
reference: John 2:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ τοῖς τὰς περιστερὰς πωλοῦσιν εἶπεν· Ἄρατε ταῦτα ἐντεῦθεν, μὴ ποιεῖτε τὸν οἶκον τοῦ πατρός μου οἶκον ἐμπορίου.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/016.yaml
  text: And he said to those selling the doves[a], “Take these things away from here; do not make my Father’s house a house of trade.”
translation:
  language: tl
  text: At sinabi niya sa mga nagtitinda ng mga kalapati, “Alisin ninyo rito ang mga ito; huwag ninyong gawing bahay ng kalakalan[a] ang bahay ng aking Ama.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pamilihan.” Mas literal sa Griyego ang “bahay ng kalakalan,” na nagpapanatili sa pag-uulit ng salitang “bahay” sa pangungusap.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιστερὰς
  choice: mga kalapati
  rationale: Karaniwang tawag ito sa mga ibong ipinagbibili bilang handog sa templo at likas itong pakinggan sa makabagong Filipino.
- source_word: πωλοῦσιν
  choice: mga nagtitinda
  rationale: Pinananatili nito ang kasalukuyang gawaing ipinahihiwatig ng participle at natural na tinutukoy ang pangkat ng mga nagbebenta.
- source_word: Ἄρατε
  choice: Alisin ninyo
  rationale: Malinaw at mariing utos ito na isagawa ang pag-aalis; ipinahihiwatig rin nito ang pagdadala palayo nang hindi labis na tinutukoy kung ano ang mga bagay.
- source_word: ταῦτα
  choice: ang mga ito
  rationale: Pinananatili ang pangkalahatan at maramihang pagtukoy ng neuter demonstrative nang hindi ipinapalagay kung mga hawla, paninda, o iba pang kaugnay na bagay ang eksaktong tinutukoy.
- source_word: ἐντεῦθεν
  choice: rito
  rationale: Kasama ng pandiwang “alisin,” natural nitong ipinahahayag ang pag-aalis mula sa kinaroroonang lugar.
- source_word: μὴ ποιεῖτε
  choice: huwag ninyong gawing
  rationale: Direktang pinananatili ang pagbabawal at ang diwa ng ποιέω na “gawin,” sa halip na ipakahulugang “itigil” o “gawing parang.”
- source_word: οἶκον τοῦ πατρός μου
  choice: ang bahay ng aking Ama
  rationale: Pinananatili nito ang tahasang isahang ugnayan ni Jesus sa Ama at ang pagtukoy sa templo bilang bahay ng kanyang Ama.
- source_word: οἶκον ἐμπορίου
  choice: bahay ng kalakalan
  rationale: Pinananatili nito ang pag-uulit ng “bahay” sa Griyego at ang retorikal na paghahambing, habang malinaw na tumutukoy sa gawaing pangkomersiyo.
theological_decisions:
- issue: Ang pagtukoy ni Jesus sa templo bilang bahay ng kanyang Ama
  choice: bahay ng aking Ama
  alternative: bahay ng ating Ama; bahay ng Diyos
  rationale: Tahasan sa Griyego ang isahang panghalip na μου (“aking”), kaya pinananatili ang natatanging pag-angkin ni Jesus sa kanyang ugnayan sa Ama nang hindi ito pinapalawak o pinapahina.
- issue: Ang pagbabago sa gamit ng templo
  choice: huwag ninyong gawing bahay ng kalakalan
  alternative: huwag ninyong gawing pamilihan
  rationale: Pinananatili ng napiling anyo ang pag-uulit ng οἶκος (“bahay”) at ang tensiyon sa pagitan ng layunin ng bahay ng Ama at ng komersiyal na gamit dito, nang hindi nagdaragdag ng paliwanag na wala sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ninyo” bilang likas na pangmaramihang utos. Ang “bahay ng kalakalan” ay bahagyang mas pormal kaysa “pamilihan,” ngunit pinili upang mapanatili ang mahalagang pag-uulit ng “bahay” sa orihinal.
