  text: ⸀ἐμνήσθησαν οἱ μαθηταὶ αὐτοῦ ὅτι γεγραμμένον ἐστίν· Ὁ ζῆλος τοῦ οἴκου σου καταφάγεταί με.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/017.yaml
  text: His disciples remembered that it is written[a], “Zeal for your house will consume me.”
translation:
  language: tl
  text: 'Naalala ng kanyang mga alagad ang nasusulat[a]: “Ang sigasig para sa iyong bahay ang uubos sa akin.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “inubos na ako,” ayon sa pananalita ng Awit 69:9 sa ilang tradisyong tekstuwal; ngunit ang Griyego ni Juan dito ay “uubos sa akin.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμνήσθησαν
  choice: Naalala
  rationale: Likas at tuwirang salin ng aorist na anyong deponent; ipinahihiwatig na sumagi sa isip ng mga alagad ang nasusulat.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: kanyang mga alagad
  rationale: Karaniwang salin sa Bagong Tipan at malinaw na tumutukoy sa mga tagasunod ni Jesus.
- source_word: γεγραμμένον ἐστίν
  choice: nasusulat
  rationale: Natural at marangal na pormulang Filipino sa pagpapakilala ng sipi mula sa Kasulatan; pinananatili nito ang diwang may nananatiling bisa ang isinulat.
- source_word: ζῆλος
  choice: malasakit
  rationale: Sa konteksto, tumutukoy ito sa matindi at masigasig na pagmamalasakit sa bahay ng Diyos. Mas madaling maunawaan sa modernong Filipino kaysa “sigasig” lamang, nang hindi ipinapasok ang diwang inggit.
- source_word: τοῦ οἴκου σου
  choice: sa iyong bahay
  rationale: Pinananatili ang literal na “bahay” ng sipi sa halip na gawing “templo,” bagaman templo ng Diyos ang tinutukoy sa konteksto.
- source_word: καταφάγεταί με
  choice: Uubusin ako
  rationale: Pinananatili ang hinaharap na anyo ng pandiwa at ang matinding larawang ang sigasig o malasakit ay lubusang lalamon o uubos sa nagsasalita.
theological_decisions:
- issue: Panahunan ng pandiwa sa sipi mula sa Awit 69:9
  choice: Uubusin ako
  alternative: Inubos ako / nilamon ako
  rationale: Ang Griyego ni Juan, καταφάγεταί, ay nasa hinaharap. Hindi ito iniharmonisa sa mga tradisyong tekstuwal ng Awit na gumagamit ng nakalipas na diwa.
- issue: Kahulugan ng “bahay” sa konteksto
  choice: bahay
  alternative: templo
  rationale: Bagaman templo ang tinutukoy, pinananatili ng “bahay” ang salita at alusyon ng sipi sa Kasulatan, habang hinahayaan ang konteksto na maglinaw ng kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Maikli at tuwiran ang pangungusap; ang “nasusulat” ay nagpapanatili ng pamilyar na rehistrong pangkasulatan. Walang talababa sapagkat ang alternatibong “has consumed me” ay hindi pagbasa ng ibinigay na Griyegong teksto ni Juan kundi nagmumula sa ibang tradisyon ng Awit.
