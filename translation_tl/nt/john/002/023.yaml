id: JHN.2.23
reference: John 2:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ὡς δὲ ἦν ἐν τοῖς Ἱεροσολύμοις ἐν τῷ πάσχα ἐν τῇ ἑορτῇ, πολλοὶ ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ, θεωροῦντες αὐτοῦ τὰ σημεῖα ἃ ἐποίει·
base_translation:
  language: en
  yaml_path: translation/nt/john/002/023.yaml
  text: When he was in Jerusalem at the Passover[a], during the feast[b], many believed in his name as they were seeing the signs that he was doing.
translation:
  language: tl
  text: Nang nasa Jerusalem siya noong Paskuwa, sa panahon ng kapistahan, marami ang sumampalataya sa kanyang pangalan[a] habang nakikita nila ang mga tanda[b] na ginagawa niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sumampalataya sa kanya.” Sa literal, “sumampalataya sa kanyang pangalan,” isang pananalita ni Juan na nagbibigay-diin sa pagtitiwalang nakatuon sa ipinahayag na pagkakakilanlan ni Jesus.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga tanda” ay katangiang termino ni Juan para sa mga gawang tumuturo sa kung sino si Jesus; maaari rin itong isaling “mga mahimalang tanda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ ἦν ἐν τοῖς Ἱεροσολύμοις
  choice: Nang siya ay nasa Jerusalem
  rationale: Likas na panimulang temporal sa Tagalog; ipinahihiwatig ang banayad na pagpapatuloy ng δέ nang hindi nagdaragdag ng tahasang “ngayon.”
- source_word: ἐν τῷ πάσχα ἐν τῇ ἑορτῇ
  choice: para sa Paskuwa, sa panahon ng kapistahan
  rationale: Ipinakikita ang pagparoon niya sa Jerusalem kaugnay ng Paskuwa at pinananatili ang pagpapalawak na tumutukoy rito bilang kapistahan.
- source_word: ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ
  choice: sumampalataya sa kanyang pangalan
  rationale: Pinananatili ang natatanging pahayag ni Juan tungkol sa pananampalatayang nakatuon sa pangalan, sa halip na pay平in ito bilang “sumampalataya sa kanya.”
- source_word: θεωροῦντες
  choice: dahil nakikita nila
  rationale: Ang kasalukuyang participle ay nagsasaad ng kasabay at nagpapatuloy na pagkakita; ipinahahayag din ng konteksto ang batayan ng kanilang pananampalataya.
- source_word: τὰ σημεῖα
  choice: mga tanda
  rationale: Pinananatili ang susing bokabularyo ni Juan para sa mga gawang tumuturo sa pagkakakilanlan ni Jesus, nang hindi idinaragdag sa pangunahing teksto ang salitang “himala.”
- source_word: ἃ ἐποίει
  choice: na ginagawa niya
  rationale: Ang di-ganap na aspekto ng ἐποίει ay likas na naihahayag sa Tagalog sa “ginagawa niya,” na tumutukoy sa nagpapatuloy na pagkilos noon.
theological_decisions:
- issue: Likas o antas ng pananampalatayang inilalarawan ng ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ
  choice: Tahasang isinalin na “marami ang sumampalataya sa kanyang pangalan,” nang hindi hinahatulang mababaw o hindi tunay ang pananampalataya sa talatang ito.
  alternative: “Marami ang nagkaroon lamang ng panimulang o mababaw na pananampalataya sa kanya.”
  rationale: Tuwirang sinasabi ng Griyego na sumampalataya sila sa kanyang pangalan. Ang kasunod na talata ang nagbibigay ng karagdagang tensiyon, kaya hindi iyon dapat paunang lutasin sa salin ng talatang ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Paskuwa” at “kapistahan” bilang karaniwang bokabularyong biblikal. Pinanatili ang pormulang “sa kanyang pangalan” at ang terminong “mga tanda” upang mapangalagaan ang bokabularyo at teolohikal na tensiyon ni Juan.
