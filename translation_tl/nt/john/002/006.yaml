base_translation:
  language: en
  yaml_path: translation/nt/john/002/006.yaml
  text: There were six stone water jars standing there[a], in accordance with the Jewish rites of purification[b], each holding two or three measures.
translation:
  language: tl
  text: May anim na sisidlang tubig na yari sa bato na nakalagay doon, para sa ritwal na paglilinis ayon sa kaugalian ng mga Judio[a]. Ang bawat isa ay may kapasidad na dalawa o tatlong takal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tumutukoy ito sa ritwal na paglilinis na kaugalian ng mga Judio.
    reason: lexical_alternative
  - marker: b
    text: 'Ang “takal” (Griyego: metretēs) ay sinaunang panukat ng likido, humigit-kumulang 35–40 litro.'
    reason: cultural_note
lexical_decisions:
- source_word: ἦσαν δὲ ἐκεῖ
  choice: May ... na nakalagay doon
  rationale: Likas na ipinahahayag ng “may” ang pag-iral ng mga sisidlan, habang pinananatili ng “doon” ang ἐκεῖ. Hindi ginamitan ng hiwalay na panandang temporal ang magaan na pang-ugnay na δέ.
- source_word: λίθιναι ὑδρίαι ἓξ
  choice: anim na tapayang bato
  rationale: Ang “tapayan” ay karaniwang makabagong salitang Filipino para sa malaking sisidlan ng tubig, at malinaw na ipinahahayag ng “bato” ang materyal ng mga ito.
- source_word: κατὰ τὸν καθαρισμὸν τῶν Ἰουδαίων
  choice: para sa kaugalian ng mga Judio sa paglilinis
  rationale: Ipinahahayag ng “para sa” ang gamit o layunin sa konteksto; pinananatili ng “kaugalian ... sa paglilinis” ang ritwal na diwa nang hindi nagdaragdag ng denominasyonal na paliwanag.
- source_word: κείμεναι
  choice: nakalagay
  rationale: Ang κεῖμαι ay tumutukoy sa pagiging nakapuwesto o nakalagay. Mas natural ito sa Filipino kaysa sa literal na “nakahiga,” at hindi ipinapalagay na tiyak na patayo ang mga tapayan.
- source_word: χωροῦσαι ἀνὰ μετρητὰς δύο ἢ τρεῖς
  choice: Ang bawat isa ay nagkakasya ng dalawa o tatlong takal
  rationale: Ang χωρέω ay tumutukoy sa kapasidad, at ipinahahayag ng “bawat isa” ang distributibong ἀνά. Pinananatili ng “takal” sa teksto ang sinaunang yunit nang hindi nagbibigay ng huwad na eksaktong modernong katumbas.
theological_decisions:
- issue: Kahulugan ng τῶν Ἰουδαίων sa salaysay ni Juan
  choice: ng mga Judio
  alternative: ng mga taga-Judea
  rationale: Sa kontekstong ito, tumutukoy ang parirala sa kinikilalang kaugaliang panrelihiyon sa paglilinis, hindi lamang sa rehiyonal na pinagmulan; kaya mas angkop ang “mga Judio.”
- issue: Ugnayan ng κατά sa mga tapayan at sa paglilinis
  choice: para sa kaugalian ... sa paglilinis
  alternative: ayon sa kaugalian ... sa paglilinis
  rationale: Maaaring magpahiwatig ang κατά ng pagkakaayon o kaugnay na gamit. Pinili ang “para sa” dahil malinaw sa konteksto ang gamit ng mga tapayan, habang ipinaliliwanag sa talababa ang ritwal na kahulugan nang hindi labis na nilulutas ang saklaw ng parirala.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tapayang bato” bilang likas na katawagan sa sisidlan at ang “takal” upang mapanatili ang sinaunang yunit, kalakip ang tantiyang modernong katumbas sa talababa.
