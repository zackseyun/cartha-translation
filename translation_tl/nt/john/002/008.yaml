base_translation:
  language: en
  yaml_path: translation/nt/john/002/008.yaml
  text: And he said to them[b][a], “Draw some out now and take it to the master of the feast.” So they took it.
translation:
  language: tl
  text: At sinabi niya sa kanila, “Sumalok kayo ngayon at dalhin ninyo sa tagapangasiwa ng handaan.[a]” At dinala nila iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “punong tagapagsilbi” o “namamahala sa piging.” Ang salitang Griyego ay tumutukoy sa taong nangangasiwa sa handaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: sinabi niya
  rationale: Ang pangkasalukuyang anyo sa Griyego ay makasaysayang pangkasalukuyan sa salaysay; mas natural sa makabagong Tagalog ang pangnagdaan.
- source_word: Ἀντλήσατε
  choice: sumalok kayo
  rationale: Tumutukoy ang pandiwa sa pagkuha ng likido sa pamamagitan ng pagsalok; malinaw at likas ito sa konteksto ng mga tapayan.
- source_word: νῦν
  choice: ngayon
  rationale: Pinananatili ang tahasang temporal na diwa at agarang pagsunod na hinihingi ng utos.
- source_word: φέρετε
  choice: dalhin ninyo
  rationale: Likas na Tagalog para sa pagdadala ng sinalok na likido patungo sa taong namamahala sa handaan.
- source_word: ἀρχιτρικλίνῳ
  choice: tagapangasiwa ng handaan
  rationale: Ipinahahayag nito ang tungkulin ng taong namamahala sa piging nang hindi nagpapasok ng mas tiyak ngunit hindi tiyak na katawagang gaya ng punong tagapagsilbi.
- source_word: οἱ δὲ ἤνεγκαν
  choice: Kaya dinala nila iyon
  rationale: Banayad na nag-uugnay ang δέ, at ipinakikita ng 'kaya' ang pagsunod sa utos. Idinagdag ang 'iyon' bilang likas na layon sa Tagalog, na malinaw ang tinutukoy mula sa konteksto.
