id: JHN.2.12
reference: John 2:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Μετὰ τοῦτο κατέβη εἰς Καφαρναοὺμ αὐτὸς καὶ ἡ μήτηρ αὐτοῦ καὶ οἱ ⸀ἀδελφοὶ καὶ οἱ μαθηταὶ αὐτοῦ, καὶ ἐκεῖ ἔμειναν οὐ πολλὰς ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/012.yaml
  text: After this he went down to Capernaum[a], he and his mother and his brothers and his disciples, and they stayed there not many days.
translation:
  language: tl
  text: Pagkatapos nito, bumaba siya sa Capernaum, kasama ang kanyang ina, kanyang mga kapatid na lalaki[a], at kanyang mga alagad. Hindi sila nanatili roon nang maraming araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kamag-anak” o “mga kaanak”; ang salitang Griyego ay maaaring tumukoy sa mga kapatid na lalaki sa mas tiyak na diwa o, sa ilang konteksto, sa mas malawak na ugnayang pampamilya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ τοῦτο
  choice: Pagkatapos nito
  rationale: Likas na panandang temporal sa modernong Tagalog at pinananatili ang isahang demonstratibo.
- source_word: κατέβη
  choice: bumaba
  rationale: Pinananatili ang topograpikal na diwa ng paglalakbay mula Cana patungong Capernaum.
- source_word: εἰς Καφαρναοὺμ
  choice: sa Capernaum
  rationale: Ang “sa” ang likas na gamit sa Tagalog para sa destinasyong lungsod; tinumbasan sa baybay ang pangalang pantangi.
- source_word: ἡ μήτηρ αὐτοῦ
  choice: ang kanyang ina
  rationale: Hindi idinagdag ang pangalang Maria sapagkat wala ito sa talata.
- source_word: οἱ ἀδελφοὶ
  choice: mga kapatid na lalaki
  rationale: Malinaw na ipinahahayag ang panlalaking pangmaramihang anyo ng Griyego habang inilalagay sa talababa ang posibleng mas malawak na ugnayang pampamilya.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: mga alagad
  rationale: Karaniwan at dignipikadong salin ng mahalagang terminong pang-Ebanghelyo na tumutukoy sa mga nag-aaral at sumusunod.
- source_word: ἐκεῖ ἔμειναν
  choice: Nanatili sila roon
  rationale: Likas na Tagalog at pinananatili ang pangmaramihang pandiwa na sumasaklaw sa buong pangkat.
- source_word: οὐ πολλὰς ἡμέρας
  choice: nang hindi maraming araw
  rationale: Malapit na pinananatili ang negatibong anyo ng Griyego sa halip na gawing mas interpretatibong “ilang araw lamang.”
theological_decisions:
- issue: Ang tinutukoy ng ἀδελφοί kaugnay ng pamilya ni Jesus
  choice: mga kapatid na lalaki
  alternative: mga kamag-anak o kaanak
  rationale: Ang panlalaking pangmaramihang salita ay pinakadirektang nangangahulugang mga kapatid na lalaki, ngunit maaari itong magkaroon ng mas malawak na gamit na pampamilya sa ilang konteksto. Hindi nilulutas ng salin ang kalaunang usaping doktrinal; inilalahad sa talababa ang tunay na leksikal na posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “kasama” upang natural na katawanin ang magkakasunod na pariralang Griyego nang hindi binabago ang mga kasapi ng pangkat. Pinanatili ang bahagyang di-karaniwang “hindi maraming araw” upang maipakita ang anyo ng orihinal.
