  text: αὐτὸς ⸀δὲ Ἰησοῦς οὐκ ἐπίστευεν ⸀αὑτὸν αὐτοῖς διὰ τὸ αὐτὸν γινώσκειν πάντας
base_translation:
  language: en
  yaml_path: translation/nt/john/002/024.yaml
  text: But Jesus himself was not entrusting himself to them[a], because he knew all people,
translation:
  language: tl
  text: Ngunit hindi ipinagkakatiwala ni Jesus mismo ang kanyang sarili sa kanila[a], sapagkat kilala niya ang lahat ng tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Iisang pandiwang Griyego ang ginamit dito at sa naunang talata: maraming “sumampalataya” kay Jesus, ngunit hindi “ipinagkatiwala” ni Jesus ang kanyang sarili sa kanila.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς δὲ Ἰησοῦς
  choice: Ngunit … ni Jesus mismo
  rationale: Ipinahihiwatig ng “Ngunit” ang pagsalungat sa tugon ng marami sa naunang talata, at pinananatili ng “mismo” ang diin ng αὐτός kay Jesus.
- source_word: οὐκ ἐπίστευεν
  choice: hindi ipinagkakatiwala
  rationale: Kapag may tuwirang layon na “ang kanyang sarili” at di-tuwirang layon na “sa kanila,” ang πιστεύω ay nangangahulugang magtiwala o magpagkatiwala. Ang aspektong di-ganap ng imperfect ay likas na naihahayag ng “hindi ipinagkakatiwala,” na maaaring tumukoy sa patuloy o kinagawiang hindi paggawa nito.
- source_word: αὑτὸν αὐτοῖς
  choice: ang kanyang sarili sa kanila
  rationale: Pinananatili nito ang reflexive na diwa at ang personal na pagpapagkatiwala ng sarili, sa halip na gawing pangkalahatang kawalan lamang ng tiwala.
- source_word: διὰ τὸ
  choice: sapagkat
  rationale: Ang διά na sinusundan ng articular infinitive ay nagsasaad dito ng dahilan. Ang “sapagkat” ay malinaw, natural, at marangal sa modernong Filipino.
- source_word: αὐτὸν γινώσκειν πάντας
  choice: kilala niya ang lahat ng tao
  rationale: Isinasalin ang infinitive bilang likas na sugnay sa Filipino. Nililinaw ng “lahat ng tao” na ang πάντας ay tumutukoy sa mga tao sa pangkalahatan.
theological_decisions:
- issue: Pagpapanatili ng ugnayan ng πιστεύω sa Juan 2:23–24
  choice: Isalin sa talata 24 bilang “ipinagkakatiwala … ang kanyang sarili” at ipaliwanag sa talababa ang pag-uulit ng pandiwang Griyego.
  alternative: Gamitin ang “nagtitiwala” o piliting gamitin ang “sumasampalataya” sa parehong talata.
  rationale: 'May sinadyang paglalaro sa iisang pandiwang Griyego: ang marami ay “sumampalataya” kay Jesus, ngunit hindi “ipinagkakatiwala” ni Jesus ang kanyang sarili sa kanila. Hindi kayang panatilihin ng isang salitang Filipino ang parehong idyoma nang hindi nagiging malabo o di-likas.'
- issue: Saklaw ng πάντας
  choice: “lahat ng tao” nang hindi nililimitahan sa isang partikular na pangkat
  alternative: “lahat” o “bawat isa”
  rationale: Pangkalahatan ang saklaw ng pahayag sa konteksto at umaakay sa susunod na talata tungkol sa nalalaman ni Jesus sa kalooban ng tao, nang hindi nagdaragdag ng higit sa mismong sinasabi ng teksto.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinili ang “ipinagkakatiwala” upang maipahayag ang nagpapatuloy o kinagawiang diwa ng imperfect at mapanatili ang reflexive na kayarian. Ang marker na [a] ay inilagay kaagad pagkatapos ng “sa kanila,” kung saan nauugnay ang paliwanag.
