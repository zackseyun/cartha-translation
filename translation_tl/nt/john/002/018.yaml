  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν οὖν οἱ Ἰουδαῖοι καὶ εἶπαν αὐτῷ· Τί σημεῖον δεικνύεις ἡμῖν, ὅτι ταῦτα ποιεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/john/002/018.yaml
  text: So the Jews answered and said to him[a], “What sign do you show us, that you do these things?”
translation:
  language: tl
  text: Kaya sumagot ang mga Judio at sinabi sa kanya[a], “Anong tanda ang maipapakita mo sa amin bilang katibayan sa ginagawa mong mga ito?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga pinunong Judio” o “mga taga-Judea.” Sa Ebanghelyo ni Juan, ang “mga Judio” ay maaari, ayon sa konteksto, na tumukoy nang mas makitid sa isang kinakatawang pangkat, lalo na sa mga awtoridad sa Judea, at hindi sa lahat ng Judio.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθησαν οὖν
  choice: Kaya sumagot
  rationale: Ipinahahayag ng “kaya” ang pagpapatuloy at bunga ng ginawa ni Jesus sa templo, habang natural na katumbas ng ἀπεκρίθησαν ang “sumagot.”
- source_word: οἱ Ἰουδαῖοι
  choice: ang mga Judio
  rationale: Pinananatili ang tuwirang katawagan ng Griyego nang hindi ipinapasok sa pangunahing teksto ang mas makitid na interpretasyong “mga pinunong Judio” o “mga taga-Judea.”
- source_word: καὶ εἶπαν αὐτῷ
  choice: at sinabi sa kanya
  rationale: Malapit sa anyo ng pinagmulan at likas pa rin sa marangal na salaysay sa Filipino.
- source_word: Τί σημεῖον
  choice: Anong tanda
  rationale: 'Ang “tanda” ay nagpapanatili sa mahalagang terminolohiyang Johannine: isang gawa na nagpapatunay at tumuturo sa higit pa sa mismong himala.'
- source_word: δεικνύεις ἡμῖν
  choice: ang maipapakita mo sa amin
  rationale: Natural na hamon sa Filipino para sa hinihinging nakikitang pagpapatunay; ang “maipapakita” ay idiomatiko at hindi nangangahulugang pag-aalinlangan sa kakayahan ni Jesus.
- source_word: ὅτι ταῦτα ποιεῖς
  choice: bilang patunay na may karapatan kang gawin ang mga bagay na ito
  rationale: Sa konteksto, hinihingi nila ang tandang magpapatunay sa awtoridad ni Jesus na gawin ang paglilinis sa templo. Nililinaw ng salin ang ugnayan ng tanda at ng kanyang ginagawa nang hindi ginagawang temporal ang ὅτι.
theological_decisions:
- issue: Tinutukoy ng “οἱ Ἰουδαῖοι” sa Ebanghelyo ni Juan
  choice: Panatilihin sa pangunahing teksto ang “mga Judio” at lagyan ng paliwanag
  alternative: mga pinunong Judio; mga taga-Judea
  rationale: Hindi tahasang nililimitahan ng talata ang tinutukoy, bagaman maaaring tumukoy ang parirala sa isang kinatawang pangkat o sa mga awtoridad ng Judea ayon sa konteksto. Pinananatili nito ang tunay na lawak ng pahayag at iniiwasang ipakahulugang lahat ng Judio nang walang pagtatangi.
- issue: Likas ng hinihinging tanda
  choice: Ihayag na ang tanda ay hinihinging patunay ng karapatan o awtoridad ni Jesus
  alternative: Literal na “Anong tanda ang ipinapakita mo sa amin, na ginagawa mo ang mga bagay na ito?”
  rationale: Ang tanong ay hindi lamang humihingi ng himala kundi humahamon sa batayan ng pagkilos ni Jesus sa templo. Ang “may karapatan” ay kontekstuwal na paglilinaw, hindi pagdaragdag ng isang denominasyonal na doktrina.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga Judio” bilang karaniwang katawagan at ang “tanda” upang mapanatili ang mahalagang bokabularyo ni Juan. Ang buong tanong ay inayos sa likas na Filipino habang pinananatili ang hamon tungkol sa awtoridad ni Jesus.
