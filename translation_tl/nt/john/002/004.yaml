id: JHN.2.4
reference: John 2:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀καὶ λέγει αὐτῇ ὁ Ἰησοῦς· Τί ἐμοὶ καὶ σοί, γύναι; οὔπω ἥκει ἡ ὥρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/004.yaml
  text: And Jesus said to her[a], “What does that have to do with me and with you[b], woman? My hour has not yet come.”
translation:
  language: tl
  text: Sinabi sa kanya ni Jesus, “Ano ang kinalaman niyan sa akin at sa iyo[a], Ginang[b]? Hindi pa sumasapit ang oras ko.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “Ano iyon sa akin at sa iyo?” Isa itong idyomang nagpapahiwatig ng paglalagay ng distansiya sa usapin o pagkakaiba ng pananagutan, ngunit hindi kinakailangang nagpapahayag ng pagkapoot.
    reason: lexical_alternative
  - marker: b
    text: Literal na “Babae.” Sa kontekstong iyon, maaari itong maging normal at magalang na pantawag, kahit maaaring tunog-masakit o bastos ang literal na katumbas sa makabagong Filipino.
    reason: cultural_note
lexical_decisions:
- source_word: λέγει
  choice: Sinabi
  rationale: Bagaman pangkasalukuyan ang anyong Griyego, likas sa makabagong salaysay sa Filipino ang pangnagdaan. Napananatili nito ang tungkulin ng makasaysayang pangkasalukuyan nang hindi nagiging asiwa ang salaysay.
- source_word: Τί ἐμοὶ καὶ σοί
  choice: Ano ang kinalaman niyan sa akin at sa iyo
  rationale: Idyoma itong nagpapahiwatig ng paglalagay ng hangganan o pagkakaiba ng pananagutan at malasakit. Pinananatili ng salin ang pagbanggit sa dalawang panig at ang bahagyang matigas na himig nang hindi ito ginagawang tahasang mapanlait.
- source_word: γύναι
  choice: Ginang
  rationale: Literal itong ‘babae,’ ngunit ang direktang pagtawag na ‘Babae’ sa makabagong Filipino ay karaniwang tunog-mapanlait. Ang ‘Ginang’ ay isang magalang at hindi malambing na pantawag, kaya naihahatid nito ang paggalang at distansiyang maaaring taglay ng Griyego.
- source_word: οὔπω
  choice: Hindi pa
  rationale: Tuwirang ipinahihiwatig na hanggang sa sandaling iyon ay hindi pa sumasapit ang tinutukoy na panahon.
- source_word: ἥκει
  choice: dumarating
  rationale: Ang pandiwa ay tumutukoy sa pagsapit o pagdating. Likas sa Filipino ang ‘dumarating ang oras’ at malinaw na ipinapakita ang hindi pa pagsapit nito.
- source_word: ἡ ὥρα μου
  choice: ang oras ko
  rationale: Pinananatili ang literal na ‘oras’ upang manatiling mababakas ang mahalagang temang ito sa Juan tungkol sa itinakdang yugto ng misyon at pagluluwalhati kay Jesus; hindi ito nililimitahan sa pangkalahatang ‘panahon.’
theological_decisions:
- issue: Himig at puwersa ng tugon ni Jesus sa kanyang ina
  choice: Magalang ngunit naglalagay ng distansiya, hindi isang insulto
  alternative: Isang mabagsik na pagsaway, o isang lantad na malambing na pagtawag
  rationale: Ang idyomang Τί ἐμοὶ καὶ σοί ay lumilikha ng distansiya sa usapin, samantalang ang γύναι ay maaaring maging magalang na pantawag sa kontekstong iyon. Pinananatili ng salin ang tensiyon nang hindi ginagawang bastos o sentimental ang pananalita ni Jesus.
- issue: Kahulugan ng ‘ang oras ko’ sa teolohiya ng Juan
  choice: Tumutukoy sa itinakdang oras ni Jesus at pinananatiling bukas ang mas malawak na tematikong kahulugan nito
  alternative: Tanging oras ng paggawa ng tandang ito, o karaniwang pahayag lamang tungkol sa tiyempo
  rationale: Sa Juan, ang ‘oras’ ay may paulit-ulit na kaugnayan sa misyon, kamatayan, muling pagkabuhay, at pagluluwalhati kay Jesus. Ang literal na parirala ay nagpapanatili ng ugnayang ito nang hindi ipinapasok sa talata ang isang mas makitid na pagpapaliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Ginang” bilang pinakamalapit na pantawag na magalang ngunit hindi nagdaragdag ng lambing; ipinaliwanag sa talababa ang literal na anyo. Pinanatili ang bahagyang tensiyon ng idyoma at ang tematikong “oras” sa Juan.
