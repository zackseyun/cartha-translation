  text: ταύτην ⸀ἐποίησεν ἀρχὴν τῶν σημείων ὁ Ἰησοῦς ἐν Κανὰ τῆς Γαλιλαίας καὶ ἐφανέρωσεν τὴν δόξαν αὐτοῦ, καὶ ἐπίστευσαν εἰς αὐτὸν οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/011.yaml
  text: Jesus did this[a], the beginning of his signs, in Cana of Galilee, and revealed his glory, and his disciples believed in him.
translation:
  language: tl
  text: Ito ang ginawa ni Jesus bilang pasimula ng kanyang mga tanda[a] sa Cana ng Galilea. Inihayag niya ang kanyang kaluwalhatian, at sumampalataya sa kanya ang kanyang mga alagad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang una sa kanyang mga tanda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ταύτην ἐποίησεν
  choice: Ito ang ginawa
  rationale: Pinananatili ang payak na demonstratibo at malawak na diwa ng ποιέω nang hindi idinaragdag ang “himala” o “tanda” sa unang parirala.
- source_word: ἀρχὴν τῶν σημείων
  choice: bilang pasimula ng mga tanda
  rationale: Ang “pasimula” ay malapit sa ἀρχή at ipinahihiwatig na pinasimulan ng pangyayaring ito ang magkakasunod na mga tanda ni Jesus.
- source_word: σημείων
  choice: mga tanda
  rationale: 'Pinananatili ang mahalagang terminolohiyang Juanino: ang mga gawang ito ay nagtuturo sa pagkakakilanlan at kaluwalhatian ni Jesus, hindi lamang nagpapakita ng kapangyarihan.'
- source_word: ἐν Κανὰ τῆς Γαλιλαίας
  choice: sa Cana ng Galilea
  rationale: Likas at tumpak na heograpikong parirala sa Tagalog na sumasalamin sa konstruksiyong genitibo.
- source_word: ἐφανέρωσεν
  choice: Inihayag
  rationale: Malinaw na ipinapahayag ang paggawa niyang hayag o nakikita sa dati nang hindi lantad.
- source_word: τὴν δόξαν αὐτοῦ
  choice: ang kanyang kaluwalhatian
  rationale: Ang “kaluwalhatian” ang karaniwang salin ng δόξα at pinananatili ang teolohikong bigat nito sa Juan.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: sumampalataya sa kanya
  rationale: Likas na Tagalog para sa personal na pagtitiwalang nakatuon kay Jesus.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ang kanyang mga alagad
  rationale: Direkta at natural na salin ng pariralang nominal.
theological_decisions:
- issue: Terminong Juanino na σημεῖον
  choice: mga tanda
  alternative: mga himala
  rationale: Sa Juan, ang mga gawa ay may pahiwatig na naghahayag kung sino si Jesus; hindi lamang mga pambihirang gawa ng kapangyarihan ang tinutukoy.
- issue: Diwa ng ἀρχὴν τῶν σημείων
  choice: bilang pasimula ng mga tanda
  alternative: ang una sa kanyang mga tanda
  rationale: Pinananatili ng “pasimula” ang mismong larawan ng ἀρχή, samantalang inilalahad sa talababa ang natural at wastong alternatibong nagpapakita ng ordinal na diwa.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Hinati sa dalawang pangungusap upang maging natural ang daloy habang pinananatili ang pagkakasunod ng mga sugnay at ang ugnayang sanhi-kinalabasan ng salaysay.
