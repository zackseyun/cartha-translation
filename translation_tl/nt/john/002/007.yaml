  text: Jesus said to them[a], “Fill the water jars with water.” And they filled them to the brim.
translation:
  language: tl
  text: Sinabi ni Jesus sa kanila, “Punuin ninyo ng tubig ang mga tapayan.” At pinuno nila ang mga iyon hanggang sa labi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: Sinabi
  rationale: Bagaman pangkasalukuyan ang anyong Griyego bilang historical present, higit na natural sa salaysay na Tagalog ang pangnagdaan.
- source_word: αὐτοῖς
  choice: sa kanila
  rationale: Tuwirang inilalarawan ang pangmaramihang di-tuwirang layon ng pagsasalita ni Jesus.
- source_word: Γεμίσατε
  choice: Punuin ninyo
  rationale: Ang aorist active imperative plural ay isang tuwirang utos sa higit sa isang tao; malinaw at natural ang “punuin ninyo.”
- source_word: τὰς ὑδρίας
  choice: ang mga tapayan
  rationale: Ang ὑδρία ay sisidlan o tapayan ng tubig. Sapat ang “mga tapayan” dahil malinaw sa utos na tubig ang ilalagay at naibigay na sa naunang talata ang karagdagang paglalarawan.
- source_word: ὕδατος
  choice: ng tubig
  rationale: Ang genitive kasunod ng γεμίζω ay tumutukoy sa laman na ipupuno; idiomatiko sa Tagalog ang “punuin ng tubig.”
- source_word: ἐγέμισαν αὐτὰς
  choice: pinuno nila ang mga iyon
  rationale: Ipinapahayag ng aorist ang natapos na pagsunod; ang “mga iyon” ay malinaw na tumutukoy sa mga tapayan.
- source_word: ἕως ἄνω
  choice: hanggang sa labi
  rationale: Ipinahihiwatig ng parirala ang pagpuno hanggang sa pinakamataas na bahagi. Natural sa Tagalog ang “hanggang sa labi” para sa isang sisidlan at malinaw nitong ipinapakita ang lubos na pagkapuno.
