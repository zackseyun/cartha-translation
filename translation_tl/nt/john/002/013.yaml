  text: Καὶ ἐγγὺς ἦν τὸ πάσχα τῶν Ἰουδαίων, καὶ ἀνέβη εἰς Ἱεροσόλυμα ὁ Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/013.yaml
  text: The Passover of the Jews was near[a], and Jesus went up to Jerusalem.
translation:
  language: tl
  text: Malapit na ang Paskuwa ng mga Hudyo[a], at umakyat si Jesus sa Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ng mga taga-Judea.” Sa Ebanghelyo ni Juan, ang Ἰουδαῖοι ay maaaring mangahulugang “mga taga-Judea” sa ilang konteksto sa halip na “mga Hudyo,” ngunit dito ay pinakanatural itong tumutukoy sa kapistahang Hudyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγὺς
  choice: malapit na
  rationale: Ipinahahayag dito ang pagiging malapit ng panahon ng kapistahan. Natural sa makabagong Tagalog ang “malapit na” at hindi nito dinaragdagan ang payak na diwa ng Griyego.
- source_word: πάσχα
  choice: Paskuwa
  rationale: Karaniwang katawagan sa Tagalog para sa kapistahang Passover at malinaw na tumutukoy sa kapistahang Judio sa kontekstong ito.
- source_word: τῶν Ἰουδαίων
  choice: ng mga Judio
  rationale: Dito ay inilalarawan ang Paskuwa bilang kapistahan ng mga Judio. Maaaring mangahulugan ang Ἰουδαῖοι ng “mga taga-Judea” sa ibang konteksto sa Juan, kaya pinanatili ang alternatibo sa talababa.
- source_word: ἀνέβη
  choice: umakyat
  rationale: Pinananatili nito ang diwa ng pag-akyat patungong Jerusalem, kapwa bilang paglalakbay sa mas mataas na lugar at bilang nakaugaliang pananalita tungkol sa pagpunta roon.
- source_word: Ἱεροσόλυμα
  choice: Jerusalem
  rationale: Ito ang pamantayan at madaling makilalang anyo ng pangalan ng lungsod sa makabagong Tagalog.
- source_word: Καὶ
  choice: at
  rationale: Ang ikalawang καί ay likas na nag-uugnay sa dalawang sugnay bilang “at.” Hindi na ginamitan ng hiwalay na panimulang panandang pandiskurso ang unang καί upang maging natural sa Tagalog at maiwasan ang pagdaragdag ng tahasang salitang panahunan.
theological_decisions:
- issue: Kahulugan ng Ἰουδαῖοι sa Ebanghelyo ni Juan
  choice: ng mga Judio
  alternative: ng mga taga-Judea
  rationale: Sa talatang ito, ang salita ay pinakanatural na tumutukoy sa pagkakakilanlang Judio ng kapistahan, hindi sa isang mas makitid na pangkat na panrehiyon o polemikal. Gayunman, inilagay sa talababa ang posibleng kahulugang panrehiyon upang mapanatili ang leksikal na lawak ng salita sa Juan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Paskuwa” bilang pamilyar na katawagang biblikal at “umakyat” upang mapanatili ang larawan ng paglalakbay patungong Jerusalem nang hindi nagiging lipas o sobrang teknikal.
