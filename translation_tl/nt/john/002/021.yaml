  text: ἐκεῖνος δὲ ἔλεγεν περὶ τοῦ ναοῦ τοῦ σώματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/021.yaml
  text: But he was speaking about the temple of his body[a].
translation:
  language: tl
  text: Ngunit ang tinutukoy niya ay ang templo ng kanyang katawan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “santuwaryo ng kanyang katawan.” Ang salitang Griyego na naos ay karaniwang tumutukoy nang mas tiyak sa santuwaryo, o panloob na bahagi, ng templo kaysa sa buong kompleks nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνος
  choice: niya
  rationale: Sa konteksto, tumutukoy ito kay Jesus. Likas sa Tagalog ang panghalip, at hindi kailangang gawing mariin na “ang isang iyon.”
- source_word: δὲ
  choice: Ngunit
  rationale: Nagpapahiwatig ang δέ ng banayad na pagsalungat sa maling pagkaunawa sa naunang talata.
- source_word: ἔλεγεν περὶ
  choice: ang tinutukoy niya ay
  rationale: Likas na ipinahahayag sa modernong Tagalog ang diwang “nagsasalita tungkol sa” sa ganitong paliwanag bilang “ang tinutukoy niya ay,” nang hindi dinaragdagan ang kahulugan.
- source_word: ναοῦ
  choice: templo
  rationale: Karaniwan at malinaw ang “templo,” habang inilalahad sa talababa ang mas tiyak na diwa ng ναός bilang santuwaryo o pinakaloob na bahagi ng templo.
- source_word: σώματος αὐτοῦ
  choice: kanyang katawan
  rationale: Tuwirang pinananatili ang pagmamay-ari at ang mahalagang metaporang nag-uugnay sa templo at sa sariling katawan ni Jesus.
theological_decisions:
- issue: Metaporikal na pagkakakilanlan ng katawan ni Jesus at ng templo
  choice: Panatilihin ang “templo ng kanyang katawan.”
  alternative: “ang kanyang katawan bilang templo” o “santuwaryo ng kanyang katawan”
  rationale: Pinananatili nito ang anyo at teolohikal na bigat ng metapora sa Griyego nang walang dagdag na paliwanag o doktrinal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, likas, at marangal. Ginamit ang “ang tinutukoy niya ay” bilang natural na paliwanag sa Tagalog, habang pinanatili ang tuwirang metaporang “templo ng kanyang katawan.”
