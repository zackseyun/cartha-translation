  text: λέγει ἡ μήτηρ αὐτοῦ τοῖς διακόνοις· ⸂Ὅ τι⸃ ἂν λέγῃ ὑμῖν ποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/005.yaml
  text: His mother said to the servants[a], “Whatever he tells you, do it.”
translation:
  language: tl
  text: Sinabi ng kanyang ina sa mga tagapaglingkod, “Anuman ang sabihin niya sa inyo, gawin ninyo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μήτηρ αὐτοῦ
  choice: kanyang ina
  rationale: Likas at malinaw na Filipino para sa konstruksiyong henitibo, habang pinananatili ang pagkakakilanlang pampamilya sa salaysay.
- source_word: διακόνοις
  choice: mga tagapaglingkod
  rationale: Sa konteksto ng handaan sa kasal, tumutukoy ito sa mga naglilingkod sa piging, hindi sa tungkulin sa iglesya na “diyakono.” Mas angkop at marangal dito ang “mga tagapaglingkod.”
- source_word: Ὅ τι ἂν
  choice: Anuman
  rationale: Tumpak at likas na ipinahahayag ang bukás at di-tiyak na saklaw ng indefinite relative construction na may ἄν.
- source_word: λέγῃ ὑμῖν
  choice: sabihin niya sa inyo
  rationale: Pinananatili ang di-tiyak na hinaharap na diwa ng present subjunctive sa isang natural na konstruksiyong Filipino.
- source_word: ποιήσατε
  choice: gawin ninyo
  rationale: Inihahatid ang mariing pautos na maramihan; malinaw mula sa “anuman” ang ipinahiwatig na layon kaya hindi kailangang idagdag ang “iyon.”
theological_decisions:
- issue: Ang tinutukoy ng di-hayag na simuno sa λέγῃ
  choice: “niya,” na tumutukoy kay Jesus nang hindi tahasang inuulit ang pangalan
  alternative: “Anuman ang sabihin sa inyo ni Jesus, gawin ninyo.”
  rationale: Walang tahasang simuno sa Griyego, ngunit malinaw sa konteksto na si Jesus ang tinutukoy. Pinananatili ng “niya” ang kaiklian at di-pagpapalawak ng orihinal.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “tagapaglingkod” sa halip na “diyakono” upang maiwasan ang maling pagbasa bilang opisyal na tungkulin sa iglesya. Walang footnote dahil ang tekstong Filipino ay tuwirang nakapaghahatid ng diwa at walang kinakailangang mahalagang alternatibo.
