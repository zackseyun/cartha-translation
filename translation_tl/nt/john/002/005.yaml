  source_fidelity: Tapat ang salin sa Griyego. Ang “Sinabi ng kanyang ina” ay wastong pagsasalin ng λέγει ἡ μήτηρ αὐτοῦ sa daloy ng salaysay; ang gamit na nakaraang panahon ay natural sa Filipino kahit historical present ang Griyego. Wastong naihatid ng “Anuman ang sabihin niya sa inyo” ang bukás na saklaw at di-tiyak/maaaring hinaharap na diwa ng Ὅ τι ἂν λέγῃ ὑμῖν. Ang “gawin ninyo” ay angkop para sa pangmaramihang pautos na ποιήσατε.
  naturalness: Natural, malinaw, at marangal ang modernong Filipino Tagalog. Ang ayos ng pangungusap at tuwirang pananalita ay idiomatiko, at malinaw sa konteksto na si Jesus ang tinutukoy ng “niya.”
  terminology: Ang “mga tagapaglingkod” ay angkop sa mga διάκονοι sa handaan at hindi nagpapahiwatig ng huling teknikal na katungkulang pang-iglesya. Ang “ina” at “Anuman” ay kapwa wasto at nasa angkop na rehistro.
