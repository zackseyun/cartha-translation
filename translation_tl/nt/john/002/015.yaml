id: JHN.2.15
reference: John 2:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ποιήσας φραγέλλιον ἐκ σχοινίων πάντας ἐξέβαλεν ἐκ τοῦ ἱεροῦ τά τε πρόβατα καὶ τοὺς βόας, καὶ τῶν κολλυβιστῶν ἐξέχεεν ⸂τὰ κέρματα⸃ καὶ τὰς τραπέζας ⸀ἀνέστρεψεν,
base_translation:
  language: en
  yaml_path: translation/nt/john/002/015.yaml
  text: And after making a whip out of cords[a], he drove them all out of the temple courts, including both the sheep and the cattle[c][b]; and he poured out the coins of the money changers and overturned the tables.
translation:
  language: tl
  text: Pagkagawa niya ng latigo mula sa mga pisi, itinaboy niya silang lahat[c] palabas ng bakuran ng templo[a]—pati ang mga tupa at mga baka[b]. Ibinuhos niya ang mga barya ng mga nagpapalit ng salapi at itinaob ang mga mesa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego na ἱερόν ay tumutukoy sa buong kompleks o mga looban ng templo, hindi lamang sa panloob na santuwaryo.
    reason: cultural_note
  - marker: b
    text: O “pati ang mga tupa at mga baka pang-araro.”
    reason: lexical_alternative
  - marker: c
    text: Sinasabi muna sa Griyego na “silang lahat,” saka binabanggit ang “mga tupa at mga baka.” Hindi nito tahasang sinasabi na ginamit ang latigo sa mga tao.
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσας
  choice: Gumawa siya ... at
  rationale: Ang aorist participle ay nagpapahiwatig ng kilos na nauna sa pangunahing pandiwa. Likas sa modernong Tagalog ang pagkakasunod na “Gumawa siya ... at itinaboy” nang hindi ginagawang mabigat ang pangungusap.
- source_word: φραγέλλιον
  choice: latigo
  rationale: Malinaw at karaniwang salitang Filipino para sa kasangkapang panghagupit; mas natural ito kaysa sa mas mahaba o makalumang mga katumbas.
- source_word: ἐκ σχοινίων
  choice: mula sa mga pisi
  rationale: Ipinakikita ang materyales ng latigo. Ang “pisi” ay natural na katumbas ng cord at hindi nagpapahiwatig ng napakakapal na lubid.
- source_word: πάντας
  choice: silang lahat
  rationale: Pinananatili ang panlalaking pangmaramihang anyo at ang malawak ngunit hindi ganap na tiyak na saklaw ng Griyego, nang hindi tahasang nililimitahan ito sa mga tao o sa mga hayop lamang.
- source_word: ἐξέβαλεν
  choice: itinaboy ... palabas
  rationale: Ipinahahayag ang mariin at aktibong pagpapaalis na angkop sa tagpo.
- source_word: τοῦ ἱεροῦ
  choice: bakuran ng templo
  rationale: Ang ἱερόν ay tumutukoy sa mas malawak na kompleks o mga looban ng templo, hindi lamang sa panloob na santuwaryo. Ang “bakuran ng templo” ay malinaw at madaling maunawaan.
- source_word: τά τε πρόβατα καὶ τοὺς βόας
  choice: pati ang mga tupa at mga baka
  rationale: Natural na ipinakikitang kabilang ang mga hayop sa mga itinaboy. Ang “baka” ay kasalukuyan at malawak na katumbas ng βοῦς; pinananatili sa talababa ang alternatibong “mga barakong baka.”
- source_word: κολλυβιστῶν
  choice: mga nagpapalit ng salapi
  rationale: Tumpak at malinaw na tawag sa mga taong nagpapalit ng salapi sa konteksto ng templo.
- source_word: ἐξέχεεν τὰ κέρματα
  choice: Ibinuhos niya ang mga barya
  rationale: Pinananatili ng “ibinuhos” ang konkretong larawan ng ἐκχέω, at ang “mga barya” ay malinaw na katumbas ng κέρματα.
- source_word: ἀνέστρεψεν
  choice: itinaob
  rationale: Maikli, natural, at eksaktong naglalarawan sa pagbaligtad ng mga mesa.
theological_decisions:
- issue: Saklaw at paraan ng pagpapaalis ni Jesus sa templo
  choice: Sinasabi ng salin na itinaboy niya “silang lahat,” at saka tinutukoy na kasama ang mga tupa at mga baka, ngunit hindi sinasabing ginamit niya ang latigo sa mga tao.
  alternative: Maaaring unawain na itinaboy niya ang lahat ng tao at hayop, o na ang tinutukoy ng “lahat” ay pangunahing mga hayop.
  rationale: Ang πάντας ay sinusundan ng pariralang bumabanggit sa mga tupa at mga baka. Hindi tahasang sinasabi ng Griyego kung sino ang hinagupit, kaya pinananatili ng salin at talababa ang tunay na kalabuan sa halip na lutasin ito.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “latigo,” “pisi,” “bakuran ng templo,” at “mga nagpapalit ng salapi” bilang natural at malinaw na mga salita. Iniwasan ang makalumang ayos at ang pagdaragdag ng paliwanag sa mismong talata; ang leksikal at sintaktikong kalabuan ay inilagay sa mga talababa.
