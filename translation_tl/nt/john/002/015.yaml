  source_fidelity: 'Tumpak ang pangunahing kahulugan: gumawa siya ng latigo mula sa mga pisi, itinaboy niya ang lahat palabas ng ἱερόν, ibinuhos ang mga barya, at itinaob ang mga mesa. Gayunman, ang «Gumawa siya ... at itinaboy» ay mas mahina kaysa sa naunang-kilos na halaga ng ποιήσας; mas malinaw ang «Pagkagawa niya».'
  naturalness: Natural at angkop ang modernong Filipino ng karamihan ng talata. Ang «Pagkagawa niya ng latigo mula sa mga pisi» ay mas maayos na naghuhudyat ng pagkakasunod ng kilos. Inilipat ang ankla ng talababa c upang malinaw na tumukoy ito sa «silang lahat».
  terminology: Ang «latigo», «mga pisi», «bakuran ng templo», «mga nagpapalit ng salapi», at «mga barya» ay angkop. Hindi natural o tumpak na alternatibo para sa βοῦς ang «mga barakong baka»; ang βοῦς ay maaaring tumukoy sa mga baka o, sa mas tiyak na pagbasa, mga baka pang-araro.
