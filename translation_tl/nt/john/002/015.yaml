    rationale: Ang magkakabit na «Gumawa siya ... at itinaboy» ay maaaring maging simpleng magkasunod na pangunahing pandiwa. Ang «Pagkagawa niya ... itinaboy niya» ay mas tapat sa aorist participle na nauuna sa pangunahing pandiwa.
