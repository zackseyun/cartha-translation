  text: καὶ ὅτι οὐ χρείαν εἶχεν ἵνα τις μαρτυρήσῃ περὶ τοῦ ἀνθρώπου, αὐτὸς γὰρ ἐγίνωσκεν τί ἦν ἐν τῷ ἀνθρώπῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/025.yaml
  text: and because he had no need that anyone should testify about man[a], for he himself knew what was in man.
translation:
  language: tl
  text: At dahil hindi niya kailangan na may sinumang magpatotoo tungkol sa tao[a], sapagkat siya mismo ang nakaaalam kung ano ang nasa tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tungkol sa isang tao” / “kung ano ang nasa isang tao.” Ginagamit ng Griyego ang pang-isahang “tao” sa panlahatang diwa, na maaaring tumukoy sa isang tao o sa sangkatauhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρείαν εἶχεν
  choice: kailangang
  rationale: Ang pariralang χρείαν ἔχειν ay nangangahulugang “may kailangan.” Ang “hindi niya kailangang” ay likas na modernong Tagalog at tumpak na naghahatid ng pagkakaila.
- source_word: ἵνα τις μαρτυρήσῃ
  choice: may sinumang magpatotoo
  rationale: Pinananatili ng “magpatotoo” ang diwang pansaksi o panghukuman ng μαρτυρέω, at ng “sinuman” ang di-tiyak na τις sa pahayag na negatibo.
- source_word: περὶ τοῦ ἀνθρώπου
  choice: tungkol sa tao
  rationale: Ang “tao” ay maaaring gamitin sa Tagalog bilang panlahatang pang-isahan, kaya napapanatili nito ang anyo at lawak ng Griyegong ἄνθρωπος nang hindi nililimitahan sa isang partikular na lalaki.
- source_word: αὐτὸς γὰρ
  choice: sapagkat alam niya mismo
  rationale: Ipinahahayag ng “sapagkat” ang paliwanag na hatid ng γάρ, samantalang pinananatili ng “niya mismo” ang diin ng αὐτός.
- source_word: ἐγίνωσκεν
  choice: alam
  rationale: Bagaman imperpekto ang pandiwa at maaaring magpahiwatig ng patuloy o likas na kaalaman, ang statibong “alam” ang pinakanatural sa Tagalog at naipahihiwatig na ang matatag na kaalaman sa konteksto.
- source_word: τί ἦν ἐν τῷ ἀνθρώπῳ
  choice: kung ano ang nasa tao
  rationale: Pinananatili ng salin ang malawak at panloob na pahayag ng Griyego at inuulit ang “tao” upang mapanatili ang ugnayang pampanitikan sa naunang sugnay.
theological_decisions:
- issue: Lawak ng kaalaman ni Jesus tungkol sa tao
  choice: Tuwirang sabihing alam niya mismo kung ano ang nasa tao, nang hindi nililimitahan kung ito ay tumutukoy sa bawat indibidwal o sa sangkatauhan sa pangkalahatan.
  alternative: “kung ano ang nasa bawat tao” o “kung ano ang likas sa sangkatauhan”
  rationale: Maaaring magkaroon ng panlahat na puwersa ang pang-isahang ἀνθρώπου/ἀνθρώπῳ at saklawin kapuwa ang indibidwal at pangkalahatang diwa. Pinananatili ng salin ang sadyang lawak at teolohikal na tensiyon ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “magpatotoo” upang mapanatili ang pormal na diwa ng pagsaksi, at ang panlahatang “tao” upang ingatan ang pang-isahang anyo at ambiguwidad ng orihinal.
