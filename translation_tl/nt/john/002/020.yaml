  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἶπαν οὖν οἱ Ἰουδαῖοι· Τεσσεράκοντα καὶ ἓξ ἔτεσιν οἰκοδομήθη ὁ ναὸς οὗτος, καὶ σὺ ἐν τρισὶν ἡμέραις ἐγερεῖς αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/john/002/020.yaml
  text: So the Jews said[a], “This temple was built in forty-six years[b], and will you raise it up in three days?”
translation:
  language: tl
  text: Kaya sinabi ng mga Judio[a], “Sa loob ng apatnapu’t anim na taon itinayo ang templong ito, at ikaw, ibabangon mo ba ito sa loob ng tatlong araw[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga taga-Judea.” Sa Griyego, “mga Judio” ang nakasulat. Iba-iba ang tinutukoy ni Juan sa katawagang ito ayon sa konteksto.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “muli mong itatayo.” Maaaring unawain ng mga nagsasalita ang pandiwang Griyego bilang pagtayo ng isang gusali, ngunit pinananatili ng “ibabangon” ang pananalitang iuugnay ni Juan sa muling pagkabuhay ni Jesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Ipinahihiwatig ang bunga o lohikal na tugon sa naunang sinabi ni Jesus, sa natural na makabagong Tagalog.
- source_word: οἱ Ἰουδαῖοι
  choice: mga Judio
  rationale: Pinananatili ang tahasang katawagan sa Griyego nang hindi ito pinakikitid sa “mga pinunong Judio,” na hindi espesipikong nakasaad sa talata.
- source_word: Τεσσεράκοντα καὶ ἓξ ἔτεσιν
  choice: Sa loob ng apatnapu’t anim na taon
  rationale: Ipinapahayag ang haba ng panahong inilaan sa pagtatayo, ayon sa temporal na gamit ng datibo.
- source_word: οἰκοδομήθη
  choice: itinayo
  rationale: Tuwirang katumbas ng aorist passive at hindi dinaragdagan ang teksto ng ideyang patuloy pa noon ang konstruksiyon.
- source_word: ὁ ναὸς οὗτος
  choice: ang templong ito
  rationale: Malinaw at karaniwang tawag sa gusaling banal; bagaman maaaring mas tiyak ang “santuwaryo,” mas natural dito ang “templo.”
- source_word: καὶ σὺ
  choice: at ikaw
  rationale: Pinananatili ang pagdidiin sa panghalip na σὺ at ang di-makapaniwalang himig ng tanong.
- source_word: ἐν τρισὶν ἡμέραις
  choice: sa loob ng tatlong araw
  rationale: Natural na temporal na parirala na nagpapahiwatig ng pagkumpleto sa takdang panahong iyon.
- source_word: ἐγερεῖς
  choice: ibabangon mo
  rationale: Pinananatili ang saklaw ng ἐγείρω at ang ugnay nito sa muling pagkabuhay na ipaliliwanag sa kasunod na talata, sa halip na agad itong limitahan sa “muling itatayo.”
- source_word: αὐτόν
  choice: ito
  rationale: Likas na panghalip sa Tagalog na tumutukoy pabalik sa templo.
theological_decisions:
- issue: Posibleng mapagkamalang tumutukoy sa lahat ng Judio ang οἱ Ἰουδαῖοι
  choice: Panatilihin sa pangunahing teksto ang “mga Judio” at linawin ang saklaw sa talababa.
  alternative: mga taga-Judea; mga pinunong Judio
  rationale: Hindi tahasang nililimitahan ng mismong talata ang katawagan sa mga pinuno, ngunit iba-iba ang gamit ni Juan sa terminong ito at hindi ito dapat awtomatikong ipakahulugan bilang lahat ng Judio.
- issue: Ugnayan ng ἐγερεῖς sa larawan ng muling pagkabuhay
  choice: ibabangon mo
  alternative: muli mong itatayo
  rationale: 'Pinananatili nito ang sinadyang tensiyon: gusaling templo ang nauunawaan ng mga nagsasalita, ngunit iuugnay ni Juan ang salita sa katawan at muling pagkabuhay ni Jesus.'
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Judio” bilang karaniwang katawagang biblikal at ang “ibabangon” upang mapanatili ang leksikal at teolohikal na pag-alingawngaw nang hindi inuunahan ang paliwanag sa kasunod na talata.
