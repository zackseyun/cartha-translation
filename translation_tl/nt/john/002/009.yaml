  terminology: Ang “tagapangasiwa ng handaan,” “mga lingkod,” at “lalaking ikakasal” ay angkop sa tagpong pangkasal. Ang “naging alak” ay wastong naghahayag ng aktuwal na pagbabagong isinasaad ng γεγενημένον.
