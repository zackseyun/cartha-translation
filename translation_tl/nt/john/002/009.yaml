base_translation:
  language: en
  yaml_path: translation/nt/john/002/009.yaml
  text: When the master of the feast tasted the water that had become wine[a], and did not know where it came from (though the servants who had drawn the water knew)[c][b], the master of the feast calls the bridegroom
translation:
  language: tl
  text: Nang matikman ng tagapangasiwa ng handaan[a] ang tubig na naging alak at hindi niya alam kung saan ito nagmula (ngunit alam ito ng mga lingkod na sumalok ng tubig), tinawag niya[b] ang lalaking ikakasal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “namamahala sa handaan”; ang salitang Griyego ay tumutukoy sa taong nangangasiwa sa piging.
    reason: lexical_alternative
  - marker: b
    text: 'Sa Griyego, nasa pangkasalukuyang anyo ang pandiwa: “tinatawag.” Ginagamit ito rito bilang makasaysayang pangkasalukuyan upang gawing mas buhay ang salaysay.'
    reason: source_form
lexical_decisions:
- source_word: ἀρχιτρίκλινος
  choice: tagapangasiwa ng handaan
  rationale: Tumutukoy ito sa taong nangangasiwa sa piging. Malinaw ang tungkulin sa saling ito nang hindi ipinapalagay na punong tagapagsilbi lamang siya o makabagong master of ceremonies.
- source_word: ἐγεύσατο
  choice: matikman
  rationale: Tuwirang ipinapahayag ang pagtikim sa loob ng sugnay na χρονological na pinangungunahan ng ὡς.
- source_word: τὸ ὕδωρ οἶνον γεγενημένον
  choice: ang tubig na naging alak
  rationale: Pinananatili ng 'naging alak' ang ganap na pagbabago ng kalagayan na ipinahihiwatig ng perfect participle, nang hindi ito pinahihina bilang anyo o panlasa lamang.
- source_word: οὐκ ᾔδει πόθεν ἐστίν
  choice: hindi niya alam kung saan iyon nanggaling
  rationale: Natural na Filipino ito para sa tanong tungkol sa pinagmulan na ipinahahayag ng πόθεν.
- source_word: διάκονοι
  choice: mga lingkod
  rationale: Sa tagpong ito, mga tagapagsilbi sa handaan ang tinutukoy, hindi ang katungkulan sa iglesya.
- source_word: ἠντληκότες
  choice: sumalok
  rationale: Ang pandiwa ay tumutukoy sa pagkuha o pagsalok ng tubig; maikli at natural ang 'sumalok' sa konteksto.
- source_word: φωνεῖ
  choice: tinawag
  rationale: Ginamit ang karaniwang aspektong Filipino para sa natapos na kilos sa salaysay. Ipinaliliwanag sa talababa ang historical present ng Griyego.
- source_word: νυμφίον
  choice: lalaking ikinasal
  rationale: Malinaw at makabagong tawag ito sa bridegroom sa mismong konteksto ng kasalan, nang hindi gumagamit ng 'nobyo,' na maaari ring mangahulugang boyfriend.
- source_word: ὡς δὲ
  choice: Nang
  rationale: Natural na ipinakikilala ng 'Nang' ang kasunod na pangyayari. Hindi nagdagdag ng hiwalay na panandang 'ngayon' sapagkat walang tahasang katumbas nito sa Griyego.
theological_decisions:
- issue: Paglalarawan sa himala
  choice: ang tubig na naging alak
  alternative: ang tubig na ginawang alak / ang tubig na naging parang alak
  rationale: Tahasang sinasabi ng Griyego na ang tubig ay naging alak. Pinananatili ang aktuwal na pagbabago nang walang idinagdag na paliwanag tungkol sa paraan nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pangunahing pangungusap at ang pasingit na kaibahan tungkol sa kaalaman ng mga lingkod. Ginamit ang mga gitling upang madaling masundan ang mahabang ayos ng pangungusap.
