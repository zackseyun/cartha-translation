id: JHN.2.10
reference: John 2:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Πᾶς ἄνθρωπος πρῶτον τὸν καλὸν οἶνον τίθησιν, καὶ ὅταν ⸀μεθυσθῶσιν τὸν ἐλάσσω· σὺ τετήρηκας τὸν καλὸν οἶνον ἕως ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/010.yaml
  text: And he said to him[a], “Everyone sets out the good wine first, and when they have become drunk, then the inferior[b]. But you have kept the good wine until now.”
translation:
  language: tl
  text: Sinabi niya sa kanya, “Bawat tao[a] ay naghahain muna ng mabuting alak, at kapag nalasing na sila[b], saka inihahain ang mas mababang uri ng alak. Ngunit itinabi mo ang mabuting alak hanggang ngayon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Griyego ay gumagamit ng panlahatang anyong isahan na tumutukoy sa mga tao sa pangkalahatan, hindi lamang sa mga lalaki.
    reason: cultural_note
  - marker: b
    text: Maaari ring “kapag lasing na sila.” Karaniwang nangangahulugan ang pandiwang Griyego na “malasing”; pinahihina ito ng ilang salin bilang “kapag marami na silang nainom.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: Sinabi niya sa kanya
  rationale: Ang λέγει ay historical present sa salaysay; natural itong isalin sa nagdaang panahunan sa Tagalog.
- source_word: Πᾶς ἄνθρωπος
  choice: Ang bawat tao
  rationale: Panlahatang isahan ito na tumutukoy sa mga tao sa pangkalahatan, hindi lamang sa mga lalaki.
- source_word: πρῶτον
  choice: muna
  rationale: Natural na ipinahahayag ng “muna” ang pagkakasunod-sunod na tinutukoy ng adverbial na πρῶτον.
- source_word: τὸν καλὸν οἶνον
  choice: mabuting alak
  rationale: Tumutukoy ang καλός sa magandang kalidad at tuwirang ikinokontra sa alak na mas mababa ang uri.
- source_word: τίθησιν
  choice: naghahain
  rationale: Bagaman literal na “naglalagay,” ang “naghahain” ang natural na katumbas sa konteksto ng isang handaan.
- source_word: ὅταν μεθυσθῶσιν
  choice: kapag nalasing na sila
  rationale: Pinananatili nito ang karaniwang tahasang kahulugan ng μεθύω at hindi pinahihina bilang simpleng pagkabusog sa pag-inom.
- source_word: τὸν ἐλάσσω
  choice: ang alak na mas mababa ang uri
  rationale: Comparative ang ἐλάσσω at tumutukoy sa mas mababang kalidad; inuulit ang “alak” na ipinahihiwatig lamang sa Griyego upang maging malinaw sa Tagalog.
- source_word: τετήρηκας
  choice: itinabi mo
  rationale: Ipinahihiwatig ng perfect tense na pinanatili o inilaan ang alak hanggang sa kasalukuyang sandali.
- source_word: ἕως ἄρτι
  choice: hanggang ngayon
  rationale: Natural at tumpak na tumutukoy sa kasalukuyang punto ng salaysay.
theological_decisions:
- issue: Kahulugan ng μεθυσθῶσιν sa konteksto ng himalang may alak
  choice: kapag nalasing na sila
  alternative: kapag marami na silang nainom
  rationale: Karaniwang nangangahulugan ang pandiwa na malasing. Iniuulat ng nagsasalita ang isang kaugaliang napapansin niya; hindi nito kinakailangang sinasang-ayunan ang paglalasing. Pinananatili ng salin ang tensiyon ng teksto nang hindi ito pinahihina dahil sa doktrinal o etikal na konsiderasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “naghahain” para sa natural na pananalita sa konteksto ng handaan, habang pinanatili ang tahasang pahayag tungkol sa pagkalasing.
