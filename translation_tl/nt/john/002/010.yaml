    issue: Hindi gaanong idiomatiko ang “Ang bawat tao ay.”
    rationale: Sa modernong Filipino, mas natural ang panlahatang pahayag na “Bawat tao ay …,” nang walang “Ang.”
  - severity: low
    issue: Medyo hindi likas ang “alak na mas mababa ang uri.”
    rationale: Ang “mas mababang uri ng alak” ay mas karaniwang ayos sa Filipino at malinaw na pinananatili ang paghahambing ng kalidad sa τὸν ἐλάσσω.
