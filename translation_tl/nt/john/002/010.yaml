  to: Sinabi niya sa kanya, “Bawat tao[a] ay naghahain muna ng mabuting alak, at kapag nalasing na sila[b], saka inihahain ang mas mababang uri ng alak. Ngunit itinabi mo ang mabuting alak hanggang ngayon.”
