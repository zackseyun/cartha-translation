  source_fidelity: Tumpak na naisasalin ang historical present bilang past narrative na “Sinabi,” ang panlahatang Πᾶς ἄνθρωπος, ang pagkakasunod ng “muna,” ang tahasang pagkalasing sa μεθυσθῶσιν, at ang perfect force ng τετήρηκας. Ang “saka inihahain” ay isang katanggap-tanggap na paglilinaw ng eliptikong “ang nakabababa,” ngunit mas natural na tukuyin ang huling alak bilang “mas mababang uri ng alak.”
  naturalness: 'May maliit ngunit kapaki-pakinabang na pagwawasto: mas idiomatiko ang “Bawat tao ay” kaysa “Ang bawat tao ay.” Mas likas din ang “mas mababang uri ng alak” kaysa “alak na mas mababa ang uri.”'
  terminology: Ang “mabuting alak,” “naghahain,” “nalasing,” at “itinabi” ay angkop sa makabagong Filipino at sa marangal na rehistro. Hindi pinahihina ng “nalasing” ang malinaw na kahulugan ng Griyego.
  issues:
