id: JHN.2.19
reference: John 2:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Λύσατε τὸν ναὸν τοῦτον καὶ ἐν τρισὶν ἡμέραις ἐγερῶ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/019.yaml
  text: Jesus answered and said to them[a], “Destroy this temple, and in three days I will raise it up.”
translation:
  language: tl
  text: Sumagot si Jesus at sinabi sa kanila[a], “Gibain ninyo ang templong ito, at sa loob ng tatlong araw ay ibabangon ko ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Ibagsak ninyo ang templong ito … muli ko itong itatayo.” Ang pandiwang Griyego na isinaling “ibabangon” ay maaari ring magpahiwatig ng muling pagkabuhay; ipinaliwanag ni Juan sa 2:21 na ang tinutukoy ni Jesus ay ang templo ng kanyang katawan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: Sumagot … at sinabi
  rationale: Pinananatili ang dalawang pandiwa ng karaniwang ekspresyong Griyego habang nananatiling natural at marangal sa makabagong Tagalog.
- source_word: Λύσατε
  choice: Gibain ninyo
  rationale: Sa konteksto, ang λύω ay tumutukoy sa paggiba o pagwasak sa templo; ang maramihang pautos ay malinaw na naipahahayag ng “ninyo.”
- source_word: τὸν ναὸν τοῦτον
  choice: ang templong ito
  rationale: Likas na salin ito sa Tagalog at hindi paunang ipinapaliwanag na ang tinutukoy ay ang katawan ni Jesus, yamang sa talata 21 pa iyon nililinaw.
- source_word: ἐν τρισὶν ἡμέραις
  choice: sa loob ng tatlong araw
  rationale: Tumpak at karaniwang paraan ng pagpapahayag sa Tagalog ng panahong saklaw ng pariralang Griyego.
- source_word: ἐγερῶ αὐτόν
  choice: ibabangon ko ito
  rationale: Ang “ibabangon” ay nauunawaan kaugnay ng muling pagtatayo o pagtindig, ngunit pinananatili rin nito ang pahiwatig ng muling pagkabuhay na taglay ng ἐγείρω sa konteksto.
theological_decisions:
- issue: Kung tahasang ipakikilala sa salin na ang templo ay katawan ni Jesus
  choice: Panatilihin ang “templong ito” nang walang paliwanag sa mismong teksto.
  alternative: “Gibain ninyo ang templong ito—ang aking katawan.”
  rationale: Sadyang palaisipan ang pananalita sa talatang ito, at sa Juan 2:21 pa ibinibigay ang paliwanag. Hindi dapat maagang lutasin ng salin ang tensiyong pampanitikan at teolohikal.
- issue: Kung ang ἐγερῶ ay isasalin bilang muling pagtatayo o bilang pagbabangon
  choice: “ibabangon ko ito”
  alternative: “muli ko itong itatayo”
  rationale: Pinananatili ng “ibabangon” ang posibleng diwang pang-arkitektura sa talinghaga at ang mahalagang pahiwatig ng muling pagkabuhay, nang hindi nililimitahan ang kahulugan sa pagtatayo lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang anyong “Sumagot … at sinabi” upang katawanin ang estruktura ng pinagmulan, at ginamit ang “ibabangon” upang mapanatili ang sinadyang dobleng pahiwatig ng pahayag.
