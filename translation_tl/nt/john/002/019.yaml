  source_fidelity: Tumpak na naipapahayag ang ἀπεκρίθη … καὶ εἶπεν, ang maramihang pautos na Λύσατε, ang demonstratibong “templong ito,” at ang ἐγερῶ αὐτόν. Ang “ibabangon ko ito” ay angkop na pinananatili ang sinadyang ugnayan ng pandiwa sa pagbabangon/muling pagkabuhay nang hindi inuunahan ang paliwanag sa Juan 2:21.
  naturalness: Natural, malinaw, at marangal ang modernong Filipino Tagalog. Ang “Sumagot si Jesus at sinabi sa kanila” ay bahagyang pormal ngunit katanggap-tanggap sa rehistrong pampanitikan at sa naratibong pormula ng Griyego.
