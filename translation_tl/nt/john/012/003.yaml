  to: Kaya kumuha si Maria ng isang litra[a] ng mamahaling pabango na purong nardo[b], pinahiran ang mga paa ni Jesus, at pinunasan ng sarili niyang buhok ang mga paa niya. At napuno ng halimuyak ng pabango ang buong bahay.
