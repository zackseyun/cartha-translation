id: JHN.12.3
reference: John 12:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἡ οὖν ⸀Μαριὰμ λαβοῦσα λίτραν μύρου νάρδου πιστικῆς πολυτίμου ἤλειψεν τοὺς πόδας τοῦ Ἰησοῦ καὶ ἐξέμαξεν ταῖς θριξὶν αὐτῆς τοὺς πόδας αὐτοῦ· ἡ δὲ οἰκία ἐπληρώθη ἐκ τῆς ὀσμῆς τοῦ μύρου.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/003.yaml
  text: Then Mary took a litra of costly pure nard perfume[a], anointed Jesus's feet, and wiped his feet with her hair[c][b]. And the house was filled with the fragrance of the perfume.
translation:
  language: tl
  text: Kaya kumuha si Maria ng isang litra[a] ng mamahaling pabango na purong nardo[b], pinahiran ang mga paa ni Jesus, at pinunasan ng sarili niyang buhok ang mga paa niya. At napuno ng halimuyak ng pabango ang buong bahay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang litra ay isang yunit ng timbang ng mga Romano, mga 12 onsa o humigit-kumulang sangkatlo ng isang kilo.
    reason: cultural_note
  - marker: b
    text: Maaari ring “tunay na nardo.” Pinagtatalunan ang eksaktong kahulugan ng salitang Griego na isinaling “puro” (πιστικῆς).
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Ipinapakita ang ugnayan at pagpapatuloy mula sa naunang tagpo; likas sa Filipino at pinananatili ang bahagyang inferensiyal na puwersa ng pang-ugnay.
- source_word: λαβοῦσα
  choice: kumuha
  rationale: Ang aorist participle ay natural na isinalin bilang pandiwang nasa sunod-sunod na salaysay sa Filipino.
- source_word: λίτραν
  choice: isang litra
  rationale: Pinananatili ang tiyak na sinaunang yunit sa pamamagitan ng transliterasyon at ipinaliliwanag ang halaga nito sa talababa.
- source_word: μύρου νάρδου
  choice: pabangong ... nardo
  rationale: Ang μύρον ay mabangong langis o pamahid, at ang νάρδος ang partikular na halamang pinagmulan; malinaw at natural ang 'pabangong nardo' sa modernong Filipino.
- source_word: πιστικῆς
  choice: purong
  rationale: Malawak na posibleng kahulugan ang 'puro' o 'tunay,' ngunit pinagtatalunan ang eksaktong diwa; pinananatili sa talababa ang leksikal na alternatibo.
- source_word: πολυτίμου
  choice: mamahaling
  rationale: Tuwirang ipinahahayag ang napakataas na halaga sa natural na Filipino.
- source_word: ἤλειψεν
  choice: pinahiran
  rationale: Eksaktong inilalarawan ang paglalagay ng pabangong langis nang hindi ipinipilit ang isang seremonyal o doktrinal na pagpapakahulugan; maaari pa ring manatili ang simbolikong pahiwatig ng konteksto.
- source_word: τοὺς πόδας τοῦ Ἰησοῦ
  choice: ang mga paa ni Jesus
  rationale: Natural na anyong paari sa Filipino at tapat sa tahasang layon ng kilos.
- source_word: ἐξέμαξεν ταῖς θριξὶν αὐτῆς
  choice: pinunasan ng sarili niyang buhok
  rationale: Pinananatili ang kilos at ang buhok bilang kasangkapan; nililinaw ng 'sarili niyang' na buhok ni Maria ang tinutukoy.
- source_word: ἡ οἰκία ἐπληρώθη ἐκ τῆς ὀσμῆς τοῦ μύρου
  choice: napuno ng halimuyak ng pabango ang buong bahay
  rationale: Natural na Filipino para sa paglaganap ng amoy sa bahay; ang 'buong' ay nagpapahayag ng saklaw na likas na ipinahihiwatig ng 'napuno.'
theological_decisions:
- issue: Posibleng labis na teolohikong pagbasa sa ἤλειψεν
  choice: pinahiran
  alternative: inanoint / binuhusan ng langis bilang pagtatalaga
  rationale: Inilalarawan ng teksto ang pisikal na pagpapahid ng pabango. Ang 'pinahiran' ay hindi nag-aalis ng posibleng simbolikong kabuluhan ngunit hindi rin nag-aangkat ng tiyak na ritwal, koronasyon, o sakramental na doktrina.
- issue: Di-tiyak na kahulugan ng πιστικῆς
  choice: purong, na may alternatibong 'tunay' sa talababa
  alternative: tunay; likido; hindi isinaling transliterasyong 'pistikos'
  rationale: Hindi matiyak ang eksaktong leksikal na kahulugan. Pinili ang malamang na diwa sa pangunahing teksto ngunit hayagang pinanatili ang tunay na kalabuan sa talababa.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Pinanatili ang sinaunang yunit na 'litra' sa halip na palitan ng di-eksaktong modernong sukat. Ginamit ang 'nardo' bilang karaniwang transliterasyon ng espesipikong mabangong sangkap. Ang mga panandang talababa [a] at [b] ay kapuwa nasa pangunahing teksto.
