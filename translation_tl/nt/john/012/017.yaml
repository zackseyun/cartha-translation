  terminology: Ang “nagpapatotoo” ay angkop para sa μαρτυρέω at pinananatili ang mahalagang bokabularyo ng Juan. Ang “libingan,” “buhayin,” at “mula sa mga patay” ay tapat at marangal na mga katumbas sa kontekstong ito. Walang kailangang doktrinal na pagpapaliwanag.
