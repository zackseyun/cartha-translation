  text: ἐμαρτύρει οὖν ὁ ὄχλος ὁ ὢν μετ’ αὐτοῦ ὅτε τὸν Λάζαρον ἐφώνησεν ἐκ τοῦ μνημείου καὶ ἤγειρεν αὐτὸν ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/017.yaml
  text: So the crowd that had been with him when he called Lazarus out of the tomb and raised him from the dead was bearing witness[a].
translation:
  language: tl
  text: Kaya patuloy na nagpapatotoo[a] ang karamihang kasama niya nang tawagin niya si Lazaro palabas ng libingan at buhayin niya ito mula sa mga patay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “patuloy na nagbibigay ng patotoo.” Ang pandiwang Griyego ay maaaring tumukoy sa pagbibigay ng patotoo o pagsaksi, isang paulit-ulit na tema sa Juan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρει
  choice: patuloy na nagpapatotoo
  rationale: Ang imperpektong aspekto ay nagpapahiwatig ng nagpapatuloy o paulit-ulit na pagpapatotoo sa takbo ng salaysay; pinananatili rin ng “nagpapatotoo” ang mahalagang temang Johannine ng μαρτυρέω.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinapakita ang ugnayang lohikal at pasalaysay sa naunang konteksto sa natural na makabagong Tagalog.
- source_word: ὁ ὄχλος
  choice: ang mga tao
  rationale: Sa pariralang tumutukoy sa mga nakasaksi, mas natural sa Tagalog ang “mga tao” kaysa sa mas kolektibong “karamihan,” habang nananatili ang diwa ng ὄχλος.
- source_word: ὁ ὢν μετ’ αὐτοῦ
  choice: kasama niya
  rationale: Tinutukoy nito ang partikular na pangkat na naroon kasama ni Jesus sa pangyayaring inaalala; sapat at natural ang temporal na ugnayan sa sugnay na may “nang.”
- source_word: ὅτε
  choice: nang
  rationale: Natural na pangatnig na temporal para sa isang natapos na pangyayari.
- source_word: ἐφώνησεν
  choice: tawagin niya
  rationale: Direkta at natural na salin ng pagtawag ni Jesus kay Lazaro; hindi dinaragdagan ng diin na wala naman sa pandiwa mismo.
- source_word: ἐκ τοῦ μνημείου
  choice: mula sa libingan
  rationale: Ang μνημεῖον dito ay dakong pinaglibingan; malinaw at karaniwang salin ang “libingan,” at ipinahihiwatig ng “mula sa” ang paglabas.
- source_word: ἤγειρεν
  choice: buhayin
  rationale: Sa konteksto ni Lazaro, likas sa Tagalog ang “buhayin” para sa pagbabangon mula sa kamatayan at malinaw nitong ipinahahayag ang himalang tinutukoy.
- source_word: ἐκ νεκρῶν
  choice: mula sa mga patay
  rationale: Pinananatili ang anyong maramihan at ang karaniwang biblikal na pahayag na tumutukoy sa pagbangon mula sa kalagayan o hanay ng mga patay.
theological_decisions:
- issue: Paglalarawan sa ginawa ni Jesus kay Lazaro
  choice: buhayin mula sa mga patay
  alternative: ibangon mula sa mga patay
  rationale: Malinaw na pinatutunayan ng Griyego na ibinangon ni Jesus si Lazaro mula sa kamatayan. Ang “buhayin” ay natural sa Tagalog at hindi nagpapahina sa pahayag ng himala; ang “ibangon” ay mas pormal at mas malapit sa anyo ng pandiwang Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “patuloy na” upang maipakita ang imperpektong aspekto, at “nagpapatotoo” upang mapanatili ang temang pampanitikan ng Ebanghelyo ni Juan.
