  source_fidelity: Ang “Kinabukasan” ay tapat sa Τῇ ἐπαύριον, at napapanatili ng hulíng kuwit ang pagpapatuloy ng pangungusap. Gayunman, ang “nabalitaan ng napakaraming taong dumalo” ay hindi gaanong malinaw na katumbas ng malaking pulutong na siyang nakarinig; maaari rin itong magtunog na ang balita ay basta nakarating sa kanila kaysa aktibo nilang narinig. Ang “paparating” ay maayos para sa ἔρχεται at ang direksiyong “sa Jerusalem” ay likas kasama nito.
