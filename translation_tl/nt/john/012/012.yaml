lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: Kinabukasan
  rationale: Likas at maikli itong panandang temporal sa modernong Tagalog at malinaw na nagpapatuloy sa salaysay ng naunang araw.
- source_word: ὁ ὄχλος πολὺς
  choice: napakaraming tao
  rationale: Ipinahahayag nito ang laki ng ὄχλος sa mas natural na Tagalog kaysa sa literal na 'malaking pulutong.'
- source_word: ὁ ἐλθὼν εἰς τὴν ἑορτήν
  choice: mga taong dumalo sa pista
  rationale: Ginagawang natural na pariralang Tagalog ang attributive participle; ang 'dumalo' ay nagpapahiwatig na pumunta sila roon para sa pista bago ang kasalukuyang tagpo.
- source_word: ἀκούσαντες
  choice: nabalitaan
  rationale: Natural nitong inilalarawan na nakarating sa mga tao ang balitang kasunod ng ὅτι, habang pinananatili ang kolektibong diwa ng karamihan.
- source_word: ὅτι ἔρχεται ὁ Ἰησοῦς
  choice: na papunta si Jesus
  rationale: Ang 'papunta' ay malinaw at likas na katumbas ng paglapit ni Jesus sa loob ng nakaraang salaysay; itinatala sa talababa ang historikal na pangkasalukuyan ng Griyego.
- source_word: εἰς Ἱεροσόλυμα
  choice: sa Jerusalem
  rationale: Kasama ng 'papunta,' ang 'sa Jerusalem' ang karaniwang Tagalog para sa direksiyon ng paglalakbay.
