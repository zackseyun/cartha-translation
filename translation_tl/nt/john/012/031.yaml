  text: νῦν κρίσις ἐστὶν τοῦ κόσμου τούτου, νῦν ὁ ἄρχων τοῦ κόσμου τούτου ἐκβληθήσεται ἔξω·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/031.yaml
  text: Now is the judgment of this world[b][a]; now the ruler of this world will be cast out.
translation:
  language: tl
  text: Ngayon na ang paghatol sa sanlibutang ito; ngayon ay itataboy palabas ang tagapamahala[a][b] ng sanlibutang ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “prinsipe.”
    reason: lexical_alternative
  - marker: b
    text: Karaniwang nauunawaan na si Satanas ang tinutukoy ng pariralang “tagapamahala ng sanlibutang ito.”
    reason: alternative_reading
lexical_decisions:
- source_word: νῦν
  choice: ngayon
  rationale: Inulit ang “ngayon” upang mapanatili ang mariing temporal na puwersa at ang magkatulad na balangkas ng dalawang sugnay.
- source_word: κρίσις
  choice: paghatol
  rationale: Tumutukoy ito sa mapagpasiyang paghatol sa sanlibutang ito, hindi lamang sa pagsusuri o sa resulta nitong kaparusahan.
- source_word: κόσμου τούτου
  choice: sanlibutang ito
  rationale: Pinananatili nito ang demonstratibong τούτου at ang natatanging gamit ni Juan sa “sanlibutan” bilang kaayusang salungat sa Diyos.
- source_word: ἄρχων
  choice: tagapamahala
  rationale: Likas at malinaw itong tawag sa isang may kapangyarihan, habang hindi tahasang pinapangalanan kung sino ang tinutukoy.
- source_word: ἐκβληθήσεται ἔξω
  choice: itataboy palabas
  rationale: Ipinapahayag nito ang hinaharap na pasibong pagpapaalis at pinananatili ang dagdag na diin ng ἔξω sa ganap na pagkakataboy.
theological_decisions:
- issue: Pagkakakilanlan ng “tagapamahala ng sanlibutang ito”
  choice: Hindi tahasang pinangalanan sa pangunahing teksto; pinanatili ang titulong ginamit sa Griyego.
  alternative: Si Satanas o ang diyablo; o ang kasalukuyang sistema ng sanlibutan na inilalarawan na parang isang persona.
  rationale: Sa Ebanghelyo ni Juan, karaniwang nauunawaan ang katawagang ito bilang pagtukoy kay Satanas, ngunit titulo at hindi pangalan ang nasa Griyegong teksto. Pinananatili ng salin ang pahiwatig at hindi nilulutas sa pangunahing teksto ang pagkakakilanlan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “sanlibutan” upang mapanatili ang teolohikal na kulay ng Johannine κόσμος, at ang “itataboy palabas” upang maipahayag nang malinaw ang mariing pagpapaalis.
