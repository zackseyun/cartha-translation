id: JHN.12.15
reference: John 12:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Μὴ φοβοῦ, θυγάτηρ Σιών· ἰδοὺ ὁ βασιλεύς σου ἔρχεται, καθήμενος ἐπὶ πῶλον ὄνου.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/015.yaml
  text: Do not be afraid[a], daughter of Zion. Look, your King is coming[e][d][c][b], seated on a donkey’s colt.
translation:
  language: tl
  text: “Huwag kang matakot, anak na babae ng Sion.[a] Tingnan mo, dumarating ang iyong Hari, na nakaupo sa isang batang asno.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “anak na babae ng Sion” ay propetikong personipikasyon ng Sion o Jerusalem. Umaalingawngaw rito ang Zacarias 9:9, na naglalarawan sa pagdating ng ipinangakong Hari ng Sion.
    reason: cultural_note_and_cross_reference
  - marker: b
    text: Sa literal, “sa isang bisiro ng asno,” ibig sabihin, isang batang asno.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ φοβοῦ
  choice: Huwag kang matakot
  rationale: Likas at malinaw na makabagong Tagalog para sa pagbabawal na matakot; pinananatili ang tuwirang pananalita sa isahang kausap.
- source_word: θυγάτηρ Σιών
  choice: anak na babae ng Sion
  rationale: Pinananatili ang propetikong personipikasyon ng Sion/Jerusalem at ang anyong bokatibo nang hindi ito ipinapaliwanag sa mismong talata.
- source_word: ἰδοὺ
  choice: Tingnan mo
  rationale: Tuwirang pantawag-pansin sa makabagong Tagalog; mas natural kaysa sa lipas na “Narito” sa kontekstong ito.
- source_word: ὁ βασιλεύς σου
  choice: ang iyong Hari
  rationale: Tumpak na inilalarawan ang tiyak na hari ng Sion. Ang malaking titik ay editoryal na paraan upang ipakita ang gamit na parang titulo para kay Jesus.
- source_word: ἔρχεται
  choice: dumarating
  rationale: Pinananatili ang masigla at kasalukuyang kilos ng pandiwang Griyego.
- source_word: καθήμενος
  choice: nakaupo
  rationale: Tuwirang ipinapahayag ang paraan ng pagdating nang hindi idinaragdag ang mas interpretibong diwa ng “nakasakay.”
- source_word: ἐπὶ πῶλον ὄνου
  choice: sa isang batang asno
  rationale: Natural na Tagalog na nagpapahayag na ang πῶλος ay batang hayop at na ito ay asno; iniiwasan ang alanganing literal na “bisiro ng isang asno.”
theological_decisions:
- issue: Alusyon sa Zacarias 9:9 at ang mesiyanikong paghahari
  choice: Panatilihin sa pangunahing teksto ang propetikong tawag na “anak na babae ng Sion” at ang titulong “iyong Hari,” at ilagay ang paliwanag sa talababa.
  alternative: Tukuyin sa teksto ang Sion bilang Jerusalem o tahasang sabihing ito ay katuparan ng propesiya tungkol sa Mesiyas.
  rationale: Pinananatili nito ang anyo at tensiyon ng sipi habang naipaaalam sa talababa ang propetikong konteksto nang hindi nagdaragdag sa teksto.
- issue: Malaking titik sa “Hari”
  choice: Gamitin ang “Hari.”
  alternative: Gamitin ang maliit na titik na “hari.”
  rationale: Walang ganitong pagkakaiba ng malaking titik sa ebidensiyang manuskrito; dito, ang malaking titik ay makabagong editoryal na kumbensiyon para sa tila-titulong pagtukoy kay Jesus, hindi pagbabago sa leksikal na kahulugan.
- issue: Kahulugan ng καθήμενος
  choice: Isalin bilang “nakaupo.”
  alternative: Isalin bilang “nakasakay.”
  rationale: Ang “nakaupo” ang mas pormal na katumbas at hindi tahimik na nagdaragdag ng interpretasyong nakasakay, bagaman iyon ang malinaw na praktikal na larawan sa konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang propetikong pananalita ngunit nilinaw sa talababa ang personipikasyon at alusyon. Ang “Tingnan mo” ay likas na pantawag-pansin; ang “nakaupo” ay sadyang mas malapit sa Griyego kaysa “nakasakay.”
