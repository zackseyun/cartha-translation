  verdict: revise
  source_fidelity: 'Ang draft ay tapat sa pangunahing diwa ng Griyego: ang paghahanda ng hapunan para kay Jesus, ang nagpapatuloy na paglilingkod ni Marta, at ang pagkabilang ni Lazaro sa mga nakahilig sa hapag kasama niya. Gayunman, ang “nakahilig na kasalo niya” ay maaaring umugnay ang “nakahilig” kay Lazaro lamang at hindi sapat na malinaw na ito ang postura ng pangkat na nasa hapag.'
  naturalness: Natural at makabago ang karamihan ng pangungusap. Mas malinaw at mas idiomatiko sa Filipino ang “mga nakahilig sa hapag na kasama niya,” na tahasang inilalarawan ang pangkat at ang konteksto ng pagkain.
