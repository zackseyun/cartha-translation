base_translation:
  language: en
  yaml_path: translation/nt/john/012/002.yaml
  text: So they made a dinner for him there[a], and Martha was serving, but Lazarus was one of those reclining at the table with him.
translation:
  language: tl
  text: Kaya naghanda sila roon ng hapunan para sa kanya. Si Marta ay naglilingkod, samantalang si Lazaro ay isa sa mga nakahilig sa hapag na kasama niya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na pagkakasabi, “isa sa mga nakahilig na kasama niya.” Kaugalian noon ang humilig habang kumakain sa isang pormal na salu-salo.
    reason: cultural_note
lexical_decisions:
- source_word: ἐποίησαν οὖν
  choice: Kaya naghanda sila
  rationale: Ang ποιέω kasama ng δεῖπνον ay likas na nangangahulugang maghanda ng pagkain, at ipinananatili ng “kaya” ang puwersa ng οὖν bilang pagpapatuloy o bunga ng naunang salaysay.
- source_word: αὐτῷ δεῖπνον
  choice: ng hapunan para sa kanya
  rationale: Ang δεῖπνον ay pangunahing pagkain, karaniwang sa gabi; malinaw at natural ang “hapunan.” Ipinahahayag ng “para sa kanya” ang datibong αὐτῷ nang hindi tinutukoy kung sino mismo ang mga punong-abala.
- source_word: ἐκεῖ
  choice: roon
  rationale: Tuwirang panandang pook na tumutukoy sa Betania ayon sa konteksto.
- source_word: ἡ Μάρθα διηκόνει
  choice: Si Marta ay naglilingkod
  rationale: Ipinakikita ng aspektong imperpektibo na nagpapatuloy noon ang paglilingkod ni Marta. Ang “naglilingkod” ay natural sa konteksto ng paghahain nang hindi nililimitahan nang higit sa sinasabi ng Griyego.
- source_word: ὁ δὲ Λάζαρος
  choice: samantalang si Lazaro
  rationale: Ipinahahayag ng “samantalang” ang banayad na paghahambing o pagkakaiba ng δέ sa gawain ni Marta at kalagayan ni Lazaro.
- source_word: εἷς ἦν ἐκ τῶν ἀνακειμένων σὺν αὐτῷ
  choice: ay isa sa mga nakahilig na kasalo niya
  rationale: Pinananatili ng “isa sa” ang pagkabilang sa pangkat, samantalang inilalarawan ng “nakahilig” ang kaugaliang postura sa pormal na pagkain. Nililinaw ng “kasalo niya” ang konteksto ng pagkain at ang σὺν αὐτῷ.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “hapunan” sa halip na mas lumang “piging” o “pananghalian,” at pinanatili ang makasaysayang detalye ng paghilig sa pagkain sa tulong ng talababa.
