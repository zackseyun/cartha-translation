id: JHN.12.9
reference: John 12:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἔγνω ⸀οὖν ὄχλος πολὺς ἐκ τῶν Ἰουδαίων ὅτι ἐκεῖ ἐστιν, καὶ ἦλθον οὐ διὰ τὸν Ἰησοῦν μόνον, ἀλλ’ ἵνα καὶ τὸν Λάζαρον ἴδωσιν ὃν ἤγειρεν ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/009.yaml
  text: So a large crowd of the Jews learned that he was there[a], and they came not only because of Jesus, but also so that they might see Lazarus, whom he had raised from the dead.
translation:
  language: tl
  text: Kaya nalaman ng isang malaking pulutong ng mga Judio[a] na naroon si Jesus. Pumunta sila roon hindi lamang dahil kay Jesus, kundi upang makita rin si Lazaro, na ibinangon niya mula sa mga patay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa mga taga-Judea.” Ang salitang Griyego ay maaaring tumukoy sa mga Judio sa pangkalahatan o, sa ilang konteksto sa Juan, mas tiyak sa mga taga-Judea.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἔγνω
  choice: nalaman
  rationale: Ang aorist ng γινώσκω ay tumutukoy rito sa pagkakatuklas o pagkabalita ng impormasyon, hindi lamang sa dati nang kaalaman.
- source_word: οὖν
  choice: Kaya
  rationale: Pinananatili nito ang ugnayang bunga o pagpapatuloy mula sa naunang salaysay sa natural na modernong Tagalog.
- source_word: ὄχλος πολὺς
  choice: napakaraming Judio
  rationale: Sa Tagalog, mas natural dito ang dami ng mga tao kaysa sa literal na kolektibong pariralang “isang malaking pulutong”; pinananatili ng “napakarami” ang diin ng πολὺς.
- source_word: ἐκ τῶν Ἰουδαίων
  choice: Judio
  rationale: Ipinakikitang ang maraming taong ito ay mula sa mga Ἰουδαῖοι. Maaaring tumukoy ang salita sa mga Judio sa pangkalahatan o, sa ilang konteksto ni Juan, sa mga taga-Judea; inilalahad sa talababa ang tunay na ambiguwidad.
- source_word: ὅτι ἐκεῖ ἐστιν
  choice: na naroon si Jesus
  rationale: Bagaman walang tahasang pangalang Jesus sa sugnay na Griyego, siya ang malinaw na tinutukoy ng panghalip ayon sa konteksto; natural sa Tagalog na tukuyin ang pangalan upang maiwasan ang kalabuan.
- source_word: ἦλθον
  choice: Pumunta sila roon
  rationale: Natural na salaysay ng paggalaw sa Tagalog; nililinaw ng “roon” ang patutunguhan na ipinahiwatig ng konteksto.
- source_word: οὐ διὰ τὸν Ἰησοῦν μόνον
  choice: hindi lamang dahil kay Jesus
  rationale: Ang διά na may akusatibo ay nagsasaad ng dahilan o motibo; tuwiran at natural ang “dahil kay Jesus.”
- source_word: ἀλλ’ ἵνα καὶ ... ἴδωσιν
  choice: kundi upang makita rin
  rationale: Pinananatili ng “kundi” ang pagsalungat at ng “upang” ang layuning ipinahahayag ng ἵνα kasama ng subjunctive.
- source_word: Λάζαρον
  choice: Lazaro
  rationale: Ginagamit ang nakaugaliang anyong Tagalog ng pangalang biblikal.
- source_word: ὃν ἤγειρεν ἐκ νεκρῶν
  choice: na ibinangon niya mula sa mga patay
  rationale: Tapat nitong inilalarawan ang pagbabalik ni Lazaro sa buhay at pinananatili ang karaniwang biblikal na larawan ng ἐγείρω at ἐκ νεκρῶν.
theological_decisions:
- issue: Kahulugan ng Ἰουδαίων sa konteksto ng Ebanghelyo ni Juan
  choice: mga Judio
  alternative: mga taga-Judea
  rationale: Sa tagpong pampista at pampubliko, maaaring tumukoy ang termino sa mga Judio bilang pangkat ng mga tao, ngunit maaari rin itong magkaroon ng heograpikong diwa na “mga taga-Judea.” Hindi ipinipilit ng pangunahing teksto ang isang polemikong kahulugan, at pinananatili ng talababa ang alternatibong heograpiko.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang “napakaraming Judio” sa halip na mas literal ngunit mabigat na “isang malaking pulutong mula sa mga Judio.”
