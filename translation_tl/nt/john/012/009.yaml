  to: Kaya nalaman ng isang malaking pulutong ng mga Judio[a] na naroon si Jesus. Pumunta sila roon hindi lamang dahil kay Jesus, kundi upang makita rin si Lazaro, na ibinangon niya mula sa mga patay.
  rationale: Pinalitan ang “napakaraming Judio” ng “isang malaking pulutong ng mga Judio” upang maipahayag ang ὄχλος πολὺς bilang isang kolektibong pulutong at mapanatili ang diwang “mula/kabilang sa mga Judio” ng ἐκ τῶν Ἰουδαίων. Inayos din ang talababa upang tumpak ang saklaw ng alternatibong pagbasa. Walang binagong kahulugan sa salaysay o idinagdag na interpretasyong doktrinal.
