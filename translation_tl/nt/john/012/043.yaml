  text: ἠγάπησαν γὰρ τὴν δόξαν τῶν ἀνθρώπων μᾶλλον ἤπερ τὴν δόξαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/043.yaml
  text: For they loved the glory of men rather than the glory of God[a].
translation:
  language: tl
  text: Sapagkat mas inibig nila ang kaluwalhatian mula sa mga tao kaysa ang kaluwalhatian mula sa Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang kaluwalhatian ng mga tao kaysa ang kaluwalhatian ng Diyos”; maaari ring ipakahulugan ang “kaluwalhatian” bilang “papuri,” “karangalan,” o “pagsang-ayon.”
    reason: Pinananatili ang posibleng ugnayang genitive at ang mas malawak na saklaw ng δόξα nang hindi isinisiksik ang isang makitid na pagpapakahulugan sa pangunahing teksto.
lexical_decisions:
- source_word: ἠγάπησαν
  choice: inibig
  rationale: Pinananatili ng “inibig” ang lakas at kusang pagkiling ng ἀγαπάω, habang ang paghahambing sa talata ang nagpapahayag kung alin ang higit nilang pinili.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Nagbibigay ang γάρ ng dahilan para sa naunang pahayag; malinaw at likas na pang-ugnay na sanhi ang “Sapagkat.”
- source_word: δόξαν
  choice: kaluwalhatian
  rationale: Pinananatili nito ang pag-uulit ng iisang salitang Griyego at ang mas malawak na temang Johannine; hindi ito nililimitahan agad sa “papuri” o “pagsang-ayon.”
- source_word: τῶν ἀνθρώπων
  choice: mula sa mga tao
  rationale: Pangkalahatang tumutukoy ang ἀνθρώπων sa mga tao, hindi lamang sa kalalakihan. Ang “mula sa” ay likas sa Filipino at malinaw na nagpapahiwatig ng pinagmumulan ng kaluwalhatian, bagaman maaari ring unawain ang genitive bilang “ng mga tao.”
- source_word: μᾶλλον ἤπερ
  choice: mas ... kaysa
  rationale: Likas na Filipino itong paghahambing at tapat na ipinahahayag ang higit na pag-ibig sa isang bagay kaysa sa isa pa.
- source_word: τοῦ θεοῦ
  choice: mula sa Diyos
  rationale: Kaagapay ito ng “mula sa mga tao” at malinaw na ipinahahayag ang posibleng diwa ng pinagmumulan, habang kinikilala sa talababa ang mas pormal na anyong genitive.
theological_decisions:
- issue: Kahulugan ng δόξα sa paghahambing ng tao at Diyos
  choice: kaluwalhatian
  alternative: papuri; karangalan; pagsang-ayon
  rationale: Pinananatili ng “kaluwalhatian” ang sadyang lawak ng δόξα at ang kaugnayan nito sa mas malawak na tema ng kaluwalhatian sa Juan. Ang ibang salin ay posibleng paliwanag ngunit mas makitid.
- issue: Ugnayan ng mga genitive na τῶν ἀνθρώπων at τοῦ θεοῦ sa δόξαν
  choice: mula sa mga tao / mula sa Diyos
  alternative: ng mga tao / ng Diyos
  rationale: Sa konteksto, malamang na tumutukoy ang mga parirala sa kaluwalhatian o papuring nagmumula sa tao at sa Diyos. Gayunman, hindi lubos na tinatanggal ang mas malawak na ugnayang genitive, kaya ibinibigay ang pormal na alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “mga tao” bilang tumpak na pangkalahatang katumbas ng ἀνθρώπων. Ang “inibig” ay bahagyang mataas ngunit karaniwan sa estilong biblikal at pinananatili ang lakas ng pandiwa.
