  source_fidelity: Malapit sa Griyego ang salin at napananatili ang pag-uulit ng κρίνω sa “hinahatulan/hatulan,” gayundin ang malawak na saklaw ng κόσμος sa “sanlibutan.” Gayunman, ang καὶ ay payak na “at,” hindi ang bahagyang mapagkating “ngunit.” Mas malinaw ding maipapahayag ng “may sinuman” ang pangkalahatang, di-tiyak na τις.
  naturalness: Marangal at likas ang pangungusap sa modernong Filipino. Ang “Kung may sinumang makarinig” ay mas natural at mas malinaw kaysa “kung may makarinig” para sa pangkalahatang kondisyong tinutukoy ng talata.
  terminology: Ang “mga salita,” “hinahatulan/hatulan,” “sanlibutan,” at “iligtas” ay angkop. Ang “tumupad” ay katanggap-tanggap sa konteksto, ngunit ang talababa ay dapat magbigay ng mas tuwirang alternatibong sumasalamin sa saklaw ng φυλάξῃ. Ang “hinahatulan ng kaparusahan” ay hindi ang pinakatumpak na alternatibo para sa κρίνω; mas malinaw ang “kinokondena.”
  issues:
