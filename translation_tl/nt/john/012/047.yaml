  text: καὶ ἐάν τίς μου ἀκούσῃ τῶν ῥημάτων καὶ μὴ ⸀φυλάξῃ, ἐγὼ οὐ κρίνω αὐτόν, οὐ γὰρ ἦλθον ἵνα κρίνω τὸν κόσμον ἀλλ’ ἵνα σώσω τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/047.yaml
  text: And if anyone hears my words and does not keep them[a], I do not judge him; for I did not come to judge the world[b], but to save the world.
translation:
  language: tl
  text: At kung may sinumang makarinig ng aking mga salita at hindi tumupad sa mga ito[a], hindi ko siya hinahatulan[b]. Sapagkat hindi ako naparito upang hatulan ang sanlibutan, kundi upang iligtas ang sanlibutan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi iningatan ang mga ito.” Ang pandiwang Griyego ay maaaring mangahulugang ingatan, panatilihin, o sundin.
    reason: lexical_alternative
  - marker: b
    text: O “hindi ko siya kinokondena.” Ang pandiwang Griyego ay maaaring mangahulugang humatol at, ayon sa konteksto, magpahayag ng hatol laban sa isang tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τίς
  choice: kung may
  rationale: Likas na Filipino para sa di-tiyak at pangkalahatang kondisyon; saklaw nito ang sinumang tao.
- source_word: ἀκούσῃ τῶν ῥημάτων μου
  choice: makarinig ng aking mga salita
  rationale: Pinananatili ang payak na diwa ng pagkarinig at hindi idinaragdag ang mas malakas na ideya ng masunuring pakikinig.
- source_word: μὴ φυλάξῃ
  choice: hindi tumupad sa mga ito
  rationale: Sa konteksto, ang φυλάσσω ay tumutukoy sa pag-iingat o pagtupad sa mga salita ni Jesus. Ang “tumupad” ay natural at nagpapahiwatig ng tapat na pagsunod, habang iniiwan sa talababa ang mas literal na saklaw.
- source_word: οὐ κρίνω αὐτόν
  choice: hindi ko siya hinahatulan
  rationale: Ang “hinahatulan” ay nagpapanatili sa pag-uulit ng κρίνω at maaari ring magtaglay ng diwa ng masamang hatol ayon sa konteksto. Ang “siya” ay likas na panghalip na isahan at pangkalahatan sa Filipino.
- source_word: οὐ γὰρ ἦλθον
  choice: Sapagkat hindi ako naparito
  rationale: Ang “naparito” ay natural at marangal na buod ng pagdating at misyon ni Jesus.
- source_word: ἵνα κρίνω τὸν κόσμον
  choice: upang hatulan ang sanlibutan
  rationale: Malinaw na ipinapahayag ng “upang” ang layunin. Pinananatili ng “hatulan” ang leksikal na ugnayan sa naunang κρίνω.
- source_word: ἀλλ’ ἵνα σώσω τὸν κόσμον
  choice: kundi upang iligtas ang sanlibutan
  rationale: Ang “iligtas” ang karaniwang salitang biblikal para sa σώζω at pinananatili ang paghahambing ng paghatol at pagliligtas.
theological_decisions:
- issue: Ang pahayag ni Jesus na hindi niya hinahatulan ang taong hindi tumutupad sa kanyang mga salita, kaugnay ng ibang pahayag tungkol sa paghatol sa Juan
  choice: Panatilihin ang “hinahatulan/hatulan” at hayaang ipakita ng konteksto na ang layunin ng kanyang pagparito ay pagliligtas.
  alternative: Isalin bilang “hindi ko siya hinahatulan ng kaparusahan” o idagdag ang “ngayon.”
  rationale: Hindi tahasang nililimitahan ng Griyego ang pahayag sa kasalukuyang panahon, at ang pagdaragdag nito ay lulutas sa tensiyong sadyang pinananatili ng teksto. Ang pare-parehong salin ng κρίνω ay hindi rin agad nagpapasya kung simpleng paghatol o paghatol na nagpaparusa ang nangingibabaw na diwa.
- issue: Ang saklaw ng “sanlibutan” sa misyon ni Jesus
  choice: Panatilihin ang malawak na “sanlibutan.”
  alternative: Gawing “sangkatauhan” o “mga tao sa sanlibutan.”
  rationale: Ang κόσμος ay mahalagang termino sa Juan at may sadyang malawak na saklaw; hindi dapat paliitin o ipaliwanag nang higit sa sinasabi ng talata.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “sanlibutan” upang mapanatili ang kinikilalang terminong teolohikal ng Juan, at ang “siya” ay likas na walang tinutukoy na kasarian sa Filipino.
