base_translation:
  language: en
  yaml_path: translation/nt/john/012/037.yaml
  text: Although he had done so many signs before them[a], they did not believe in him[b],
translation:
  language: tl
  text: Bagaman napakaraming tanda ang ginawa niya sa harap nila, hindi pa rin sila sumasampalataya sa kanya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “hindi sila sumampalataya sa kanya.” Ang pandiwang Griyego ay nasa imperfect at maaaring magpahiwatig ng nagpapatuloy o paulit-ulit na kawalan ng pananampalataya.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοσαῦτα
  choice: napakaraming
  rationale: Ipinahahayag ang diin sa malaking bilang ng mga tanda sa natural na makabagong Tagalog.
- source_word: δὲ
  choice: Bagaman
  rationale: Ang pagsalungat na ipinahihiwatig ng δέ ay likas na naisasama sa sugnay na may concessive na “Bagaman,” nang hindi inuulit ang “ngunit.”
- source_word: σημεῖα
  choice: tanda
  rationale: Pinananatili ang natatanging gamit ni Juan sa mga gawa ni Jesus na nagtuturo sa kahulugan at pagkakakilanlan niya, sa halip na payak na “himala.”
- source_word: πεποιηκότος
  choice: ang ginawa niya
  rationale: Ang perpektong participle sa genitive absolute ay tumutukoy sa mga gawaing naisagawa na at may kaugnayan pa rin sa kasalukuyang diwa ng salaysay; likas itong naihahayag sa Tagalog sa anyong ito.
- source_word: ἔμπροσθεν αὐτῶν
  choice: sa harap nila
  rationale: Tuwirang pinananatili ang diwang ginawa ang mga tanda sa kanilang mismong presensya at paningin.
- source_word: οὐκ ἐπίστευον
  choice: hindi pa rin sila sumasampalataya
  rationale: Ang “pa rin” at aspektong di-ganap ng “sumasampalataya” ay nagpapahiwatig ng nagpapatuloy na kawalan ng pananampalataya, nang hindi nagdaragdag ng tahasang ideya ng sadyang pagtanggi.
- source_word: εἰς αὐτόν
  choice: sa kanya
  rationale: Ang “sumampalataya sa kanya” ang natural na Tagalog para sa Johannine na πιστεύω εἰς at pinananatili ang relational na pagtitiwala kay Jesus.
theological_decisions:
- issue: Ang nagpapatuloy na kawalan ng pananampalataya na ipinahihiwatig ng imperfect na ἐπίστευον
  choice: hindi pa rin sila sumasampalataya sa kanya
  alternative: hindi sila sumampalataya sa kanya
  rationale: Pinananatili ng piniling salin ang aspektong nagpapatuloy o paulit-ulit ng imperfect at ang matinding pagsalungat sa napakaraming tandang nakita nila, ngunit hindi nito ipinapalagay na tahasan at sadyang pagtanggi ang bawat isa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tanda” upang mapanatili ang mahalagang bokabularyo ni Juan, at ang “hindi pa rin sila sumasampalataya” upang natural na maipakita ang nagpapatuloy na aspekto ng pandiwang Griyego.
