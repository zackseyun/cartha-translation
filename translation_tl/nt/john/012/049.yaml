  text: ὅτι ἐγὼ ἐξ ἐμαυτοῦ οὐκ ἐλάλησα, ἀλλ’ ὁ πέμψας με πατὴρ αὐτός μοι ἐντολὴν ⸀δέδωκεν τί εἴπω καὶ τί λαλήσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/049.yaml
  text: For I have not spoken from myself[b][a], but the Father who sent me has himself given me a command as to what I should say and what I should speak.
translation:
  language: tl
  text: Sapagkat hindi ako nagsalita mula sa sarili ko[a], kundi ang Ama na nagsugo sa akin ang mismong nagbigay sa akin ng utos kung ano ang sasabihin ko at kung ano ang sasalitain ko.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa sarili kong pagkukusa” o “sa sarili kong awtoridad.”
    reason: lexical_alternative
  - marker: b
    text: Dalawang magkaibang pandiwa ang ginamit sa Griyego, na isinalin dito bilang “sabihin” at “salitain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ἐμαυτοῦ
  choice: mula sa sarili ko
  rationale: Pinananatili nito ang larawang ‘mula sa aking sarili’ at ang diwang hindi nagsasalita si Jesus nang hiwalay o sa sarili niyang pagkukusa, nang hindi agad nililimitahan ang parirala sa usapin lamang ng awtoridad.
- source_word: οὐκ ἐλάλησα
  choice: hindi ako nagsalita
  rationale: Likas ito sa makabagong Tagalog at naipahahayag ang pagtukoy ni Jesus sa kanyang pagsasalita hanggang sa sandaling iyon.
- source_word: ὁ πέμψας με πατὴρ
  choice: ang Ama na nagsugo sa akin
  rationale: Malinaw at natural nitong isinasalin ang substantival participle at pinananatili ang ‘Ama’ bilang titulong tumutukoy sa Diyos sa konteksto.
- source_word: αὐτός
  choice: ang siya mismong
  rationale: 'Hayag na pinananatili ang diin ng Griyegong panghalip: ang Ama mismo ang nagbigay ng utos.'
- source_word: ἐντολήν
  choice: utos
  rationale: Karaniwan at malinaw na salitang Tagalog ito na nagpapanatili sa awtoritatibong lakas ng ἐντολή nang hindi nagmumungkahi ng isang pormal na kodigo ng kautusan.
- source_word: δέδωκεν
  choice: nagbigay
  rationale: Natural sa Tagalog ang payak na aspektong naganap dito; ang patuloy na bisa ng ibinigay na utos ay malinaw mula sa konteksto.
- source_word: τί εἴπω καὶ τί λαλήσω
  choice: kung ano ang sasabihin ko at kung ano ang ipahahayag ko
  rationale: Pinananatili ang dalawang magkaibang pandiwa ng Griyego sa pamamagitan ng ‘sasabihin’ at ‘ipahahayag,’ habang iniiwasan ang di-likas na pag-uulit sa Tagalog.
theological_decisions:
- issue: Kaugnayan ng pananalita ng Anak sa utos ng Ama
  choice: Hindi nagsasalita si Jesus nang hiwalay sa Ama; ang kanyang sinasabi ay ayon sa misyong at utos na ibinigay ng Ama.
  alternative: Maaaring palawakin ang ‘mula sa sarili ko’ bilang ‘sa sarili kong awtoridad,’ ngunit mas tiyak iyon kaysa sa mismong Griyego.
  rationale: Pinananatili ng salin ang pag-asa at pagkakaisa sa gawain at pananalita na malinaw sa talata, nang hindi gumagawa ng pahayag tungkol sa pagka-inferyor ng kalikasan ng Anak.
- issue: Pagpapakahulugan sa πατήρ
  choice: Ama
  alternative: ama
  rationale: Sa konteksto ng Juan, tumutukoy ito sa Diyos bilang Ama at gumaganap bilang banal na titulo; kaya ginamit ang malaking titik.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang bahagyang pag-uulit sa hulihan dahil naroon din ito sa Griyego, ngunit gumamit ng dalawang likas na pandiwang Tagalog upang hindi maging pilit ang pangungusap.
