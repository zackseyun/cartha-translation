  to: Sapagkat hindi ako nagsalita mula sa sarili ko[a], kundi ang Ama na nagsugo sa akin ang mismong nagbigay sa akin ng utos kung ano ang sasabihin ko at kung ano ang sasalitain ko.[b]
  rationale: Inayos ang hindi likas na paglalagay ng diin sa paksa at ginawang “kundi” ang pangatnig upang masundan ang ἀλλά. Pinalitan ang “ipahayag” ng “salitain” upang huwag magdagdag ng diwang wala sa λαλέω at upang mapanatili ang pagkakaiba ng εἴπω at λαλήσω. Hindi binago ang kahulugan o ang mga talababa sa unang anchor.
