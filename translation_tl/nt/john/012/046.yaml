  text: ἐγὼ φῶς εἰς τὸν κόσμον ἐλήλυθα, ἵνα πᾶς ὁ πιστεύων εἰς ἐμὲ ἐν τῇ σκοτίᾳ μὴ μείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/046.yaml
  text: I have come into the world as light[b][a], so that everyone who believes in me may not remain in the darkness.
translation:
  language: tl
  text: Naparito ako sa mundo bilang liwanag[a], upang ang bawat sumasampalataya sa akin[b] ay huwag manatili sa kadiliman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bilang isang liwanag.” Walang pantukoy ang salitang Griyego at maaari itong unawain nang kwalitatibo (“bilang liwanag”) o nang mas tahasan bilang “isang liwanag.”
    reason: lexical_alternative
  - marker: b
    text: O “sinumang sumasampalataya sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φῶς
  choice: liwanag
  rationale: Walang pantukoy ang salitang Griyego at maaaring unawain nang kwalitatibo. Ang “bilang liwanag” ay likas sa Filipino at pinananatili ang mahalagang metapora sa Juan nang hindi ito ginagawang paliwanag.
- source_word: εἰς τὸν κόσμον
  choice: sa mundo
  rationale: Sa pariralang “naparito sa mundo,” likas na ipinahihiwatig ng Filipino ang pagpasok o pagdating sa saklaw ng mundo, gaya ng εἰς sa Griyego.
- source_word: ἐλήλυθα
  choice: naparito ako
  rationale: Ang perpektong anyo ay tumutukoy sa pagparito ni Jesus na may nananatiling bunga sa kasalukuyan. Ang “naparito ako” ay marangal at maikli, at mas angkop dito kaysa sa payak na “dumating ako.”
- source_word: ἵνα
  choice: upang
  rationale: Malinaw na ipinapahayag ng “upang” ang layunin ng pagparito at angkop sa dignidad ng pahayag.
- source_word: πᾶς ὁ πιστεύων
  choice: ang bawat sumasampalataya
  rationale: Ipinahahayag nito ang pangkalahatang uri ng lahat ng taong sumasampalataya, habang pinananatili ang sustenidong diwa ng kasalukuyang pandiwaring Griyego.
- source_word: πιστεύων εἰς ἐμέ
  choice: sumasampalataya sa akin
  rationale: Ito ang karaniwang salin sa kontekstong Juanino para sa pananampalatayang nakatuon mismo kay Jesus; hindi na kailangang dagdagan ng paliwanag na doktrinal.
- source_word: ἐν τῇ σκοτίᾳ
  choice: sa kadiliman
  rationale: Pinananatili ng “kadiliman” ang tematikong moral at espirituwal na larangan na kasalungat ng liwanag sa Ebanghelyo ni Juan.
- source_word: μὴ μείνῃ
  choice: ay huwag manatili
  rationale: Tumpak na ipinapahayag nito ang nilalayong hindi pagpapatuloy sa isang kalagayan, ayon sa μή na kasama ng subjunctive pagkatapos ng ἵνα.
theological_decisions:
- issue: Pagpapakilala ni Cristo sa sarili sa pamamagitan ng larawang “liwanag”
  choice: Pinanatili ang “bilang liwanag,” na naglalarawan kay Jesus mismo bilang mapaghayag at nagliligtas na liwanag.
  alternative: “Naparito ako upang magdala ng liwanag sa mundo” o “naparito ako bilang isang liwanag.”
  rationale: Hindi dapat gawing simpleng bagay na dala ni Jesus ang liwanag, sapagkat iniuugnay ng pangungusap ang liwanag sa kaniyang pagkakakilanlan at gawain. Gayunman, hindi rin dinagdagan ang teksto ng paliwanag na doktrinal.
- issue: Saklaw ng πᾶς ὁ πιστεύων
  choice: “ang bawat sumasampalataya”
  alternative: “sinumang sumasampalataya”
  rationale: Parehong ipinahahayag ng dalawang anyo ang malawak na saklaw ng pangkat ng mga sumasampalataya. Hindi ipinapasya ng talata ang mas malawak na pagtatalo tungkol sa paraan kung paano sumasampalataya ang tao.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “naparito” upang tumugma sa solemneng pahayag ni Jesus, samantalang nananatiling malinaw sa karaniwang mambabasa. Pinanatili ang magkapares na imahen ng liwanag at kadiliman.
