  source_fidelity: Tumpak ang salin sa SBLGNT. Ang “Naparito ako sa mundo bilang liwanag” ay maayos na naghahatid ng ἐγὼ φῶς εἰς τὸν κόσμον ἐλήλυθα, kabilang ang metaporang φῶς at direksiyong εἰς τὸν κόσμον. Ang “upang ang bawat sumasampalataya sa akin ay huwag manatili sa kadiliman” ay pinananatili ang layuning ἵνα, ang pangkalahatang saklaw ng πᾶς ὁ πιστεύων, at ang negatibong layon ng μὴ μείνῃ. Hindi nito dinaragdagan o nililimitahan ang pahayag sa paraang doktrinal.
  naturalness: Likas at malinaw ang modernong Filipino, na may angkop na marangal na rehistro para sa pahayag ni Jesus. Ang “naparito,” “bilang liwanag,” “sumasampalataya,” at “kadiliman” ay magkakatugma sa rehistro at sa matalinghagang bokabularyo ng Juan.
  terminology: Ang “liwanag” at “kadiliman” ay angkop at pinananatili ang magkapares na imaheng Juanino. Ang “sumasampalataya sa akin” ay wastong salin ng πιστεύων εἰς ἐμέ. Ang mga talababa ay tumpak na nagmamarka ng tunay na mga alternatibong leksikal at maayos ang pagkakaangkla.
