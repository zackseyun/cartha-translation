  text: Ἰησοῦς δὲ ἔκραξεν καὶ εἶπεν· Ὁ πιστεύων εἰς ἐμὲ οὐ πιστεύει εἰς ἐμὲ ἀλλὰ εἰς τὸν πέμψαντά με,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/044.yaml
  text: But Jesus cried out and said[a], “The one who believes in me does not believe in me[b], but in the one who sent me,”
translation:
  language: tl
  text: Ngunit sumigaw si Jesus at sinabi, “Ang sumasampalataya sa akin ay hindi sa akin[a] sumasampalataya, kundi sa nagsugo sa akin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi nito itinatanggi na si Jesus ay pinagtutuunan ng pananampalataya; ipinahahayag nito na ang pagsampalataya sa kanya ay hindi maihihiwalay sa pagsampalataya sa Ama na nagsugo sa kanya.
    reason: cross_reference
lexical_decisions:
- source_word: ἔκραξεν
  choice: sumigaw
  rationale: Ipinahahayag ng κράζω ang malakas at hayagang pagsasalita. Likas at tuwiran sa modernong Tagalog ang “sumigaw” at napapanatili nito ang diin ng Griyego.
- source_word: Ὁ πιστεύων
  choice: Ang sumasampalataya
  rationale: Ang pantukoy na may pangkasalukuyang participle ay tumutukoy sa sinumang taong nananampalataya sa pangkalahatan. Malapit sa anyong Griyego at marangal pakinggan ang “Ang sumasampalataya.”
- source_word: πιστεύων / πιστεύει
  choice: sumasampalataya
  rationale: Sa kontekstong Juaniko at kasama ng εἰς, ang “sumasampalataya sa” ay ang nakaugaliang salin para sa pananampalatayang nakatuon sa isang persona. Pinananatili rin nito ang pag-uulit ng pandiwa.
- source_word: εἰς ἐμέ
  choice: sa akin
  rationale: Kapag kasama ng πιστεύω, idiomatikong ipinahahayag sa Tagalog ang εἰς bilang “sa,” kaya ang “sumasampalataya sa akin” ang natural na katumbas.
- source_word: ἀλλὰ εἰς τὸν πέμψαντά με
  choice: kundi sa nagsugo sa akin
  rationale: Pinananatili ng “kundi” ang matinding pagsalungat ng ἀλλά, at ng “sa nagsugo sa akin” ang bahagyang di-tuwirang pagtukoy ng participle nang hindi agad idinaragdag sa teksto ang “Ama.”
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita rito ng δέ ang paglipat na may bahagyang pagsalungat sa naunang konteksto; ang “Ngunit” ay natural at angkop sa marangal na salaysay.
theological_decisions:
- issue: Maaaring mapagkamalang itinatanggi ng “hindi sa akin sumasampalataya” na si Jesus ay tunay na pinagtutuunan ng pananampalataya.
  choice: 'Pinanatili ang tahasang tensiyon: “hindi sa akin sumasampalataya, kundi sa nagsugo sa akin.”'
  alternative: “Hindi lamang sa akin sumasampalataya” o tahasang “kundi sa Ama na nagsugo sa akin.”
  rationale: Walang katumbas na salita para sa “lamang” sa Griyego, at hindi tahasang binabanggit dito ang “Ama.” Ipinahahayag ng pangungusap na ang pananampalataya kay Jesus ay hindi maihihiwalay sa pananampalataya sa nagsugo sa kanya; hindi dapat lutasin ng salin ang sinadyang teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang tradisyonal at malinaw na “sumasampalataya” para sa Johannine πιστεύω, habang iniwasan ang pagpapaliwanag sa mismong talata sa pamamagitan ng pagdaragdag ng “lamang” o “Ama.”
