id: JHN.12.21
reference: John 12:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὗτοι οὖν προσῆλθον Φιλίππῳ τῷ ἀπὸ Βηθσαϊδὰ τῆς Γαλιλαίας, καὶ ἠρώτων αὐτὸν λέγοντες· Κύριε, θέλομεν τὸν Ἰησοῦν ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/021.yaml
  text: So these came to Philip[a], who was from Bethsaida in Galilee, and were asking him, saying, “Lord, we want to see Jesus.”
translation:
  language: tl
  text: Kaya lumapit ang mga ito kay Felipe[a], na taga-Betsaida sa Galilea, at nakiusap sa kanya, “Ginoo, nais naming makita si Jesus.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Ginoo” ay magalang na pantawag kay Felipe. Ang salitang Griego ay maaari ring isaling “Panginoon” o “Sir.”
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτοι οὖν
  choice: Kaya ... ang mga ito
  rationale: Pinananatili ng “ang mga ito” ang tahasang pagtukoy sa mga Griegong binanggit sa naunang talata, at ng “kaya” ang ugnayang pasalaysay ng οὖν.
- source_word: προσῆλθον
  choice: lumapit
  rationale: Likas at tuwirang salin ng paglapit nila kay Felipe.
- source_word: Φιλίππῳ
  choice: Felipe
  rationale: Karaniwang anyo sa Tagalog ng pangalang Φίλιππος.
- source_word: τῷ ἀπὸ Βηθσαϊδὰ τῆς Γαλιλαίας
  choice: na taga-Betsaida sa Galilea
  rationale: Natural na Tagalog na nagpapahayag ng pinagmulan ni Felipe at ng lokasyon ng Betsaida.
- source_word: ἠρώτων αὐτὸν λέγοντες
  choice: at nakiusap sa kanya
  rationale: Ang imperfect na ἠρώτων ay nagpapahiwatig ng patuloy o magalang na paghiling. Sa Tagalog, sapat nang ipinapasok ng “nakiusap” ang tuwirang sinabi, kaya hindi na kailangan ang literal ngunit mabigat na “na sinasabi.”
- source_word: Κύριε
  choice: Ginoo
  rationale: Sa pakikipag-usap kay Felipe, ang vocative ay natural na magalang na tawag. Pinananatili ng “Ginoo” ang dignidad at ang leksikal na kaugnayan nito sa “Panginoon,” habang nililinaw sa talababa ang isa pang natural na salin.
- source_word: θέλομεν
  choice: nais naming
  rationale: Natural, magalang, at marangal na pagpapahayag ng pagnanais sa modernong Tagalog.
- source_word: τὸν Ἰησοῦν ἰδεῖν
  choice: makita si Jesus
  rationale: Pinananatili ang literal na diwa ng ἰδεῖν nang hindi ipinapalagay na ang ibig sabihin ay makipagkita o makipag-usap.
theological_decisions:
- issue: Kahulugan ng κύριε bilang tuwirang tawag kay Felipe
  choice: Ginoo
  alternative: Panginoon; maaari ring unawain bilang magalang na “Sir”
  rationale: Dahil si Felipe ang kinakausap, malamang na magalang na pantawag ito at hindi pagkilalang teolohikal sa kanya bilang Panginoon. Iniiwasan ng pangunahing salin ang nakalilitong “Panginoon,” ngunit pinananatili ng talababa ang saklaw at tunay na kalabuan ng salitang Griego.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “nakiusap” sa halip na literal na “patuloy na nagtatanong, na sinasabi” upang maging malinaw ang uri ng pakiusap, habang hindi dinaragdagan ang layunin nilang higit sa “makita” si Jesus.
