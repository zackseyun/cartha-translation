  text: διὰ τοῦτο ⸀καὶ ὑπήντησεν αὐτῷ ὁ ὄχλος ὅτι ⸀ἤκουσαν τοῦτο αὐτὸν πεποιηκέναι τὸ σημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/018.yaml
  text: For this reason also the crowd went to meet him[b][a], because they heard that he had done this sign.
translation:
  language: tl
  text: Dahil dito, sinalubong din[a] siya ng mga tao, sapagkat nabalitaan nilang ginawa niya ang tandang ito[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nakipagtagpo sa kanya.” Kasama sa pandiwang Griyego ang diwa ng pagpunta upang salubungin ang isang tao.
    reason: lexical_alternative
  - marker: b
    text: Ang “tanda” ang karaniwang tawag ni Juan sa isang makapangyarihang gawa na tumuturo sa pagkakakilanlan at misyon ni Jesus; maaari ring isalin na “himala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Dahil dito
  rationale: Malinaw na ipinapahayag ang ugnayang sanhi sa naunang konteksto at natural ito sa makabagong Tagalog.
- source_word: καὶ
  choice: din
  rationale: Pinananatili ang pandagdag na diwa ng pangatnig nang hindi ito labis na binibigyang-diin.
- source_word: ὑπήντησεν αὐτῷ
  choice: sinalubong ... siya
  rationale: Likas na ipinahihiwatig ng “sinalubong” ang pagpunta upang makipagtagpo, kaya napapanatili ang direksiyonal na diwa ng pandiwa.
- source_word: ὁ ὄχλος
  choice: maraming tao
  rationale: Natural na katumbas sa Tagalog ng isang pulutong o crowd; iniiwasan ang mas pormal o makalumang “karamihan.”
- source_word: ὅτι
  choice: sapagkat
  rationale: Ipinakikita na ang kasunod na sugnay ang dahilan ng pagsalubong ng mga tao.
- source_word: ἤκουσαν
  choice: nabalitaan nila
  rationale: Sa kontekstong ito, ang pandinig ay tumutukoy sa pagkatanggap ng balita tungkol sa ginawa ni Jesus; mas natural ito kaysa literal na “narinig nila.”
- source_word: τοῦτο αὐτὸν πεποιηκέναι τὸ σημεῖον
  choice: ginawa niya ang tandang ito
  rationale: Pinananatili ang tiyak na demonstratibo at ang natapos na gawa; sapat na ipinahihiwatig ng pagkakasunod ng mga pangyayari ang naunang pagkaganap nito.
- source_word: τὸ σημεῖον
  choice: tandang ito
  rationale: Pinananatili ng “tanda” ang natatanging Johannine na diwa ng isang makapangyarihang gawa na tumuturo sa pagkakakilanlan at misyon ni Jesus, sa halip na limitahan ito sa “himala.”
theological_decisions:
- issue: Paglalarawan sa Johannine σημεῖον
  choice: tanda
  alternative: himala
  rationale: Ang “tanda” ay nagpapanatili sa mapagpahayag na tungkulin ng gawa ni Jesus at hindi lamang sa pagiging kamangha-mangha nito.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “sinalubong” para sa malinaw at maikling pagpapahayag ng kilos, at “tanda” upang mapanatili ang mahalagang bokabularyo ni Juan.
