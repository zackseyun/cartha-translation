- from: Kaya sumagot sa kanya ang mga tao, “Narinig namin mula sa Kautusan na ang Mesiyas ay mananatili magpakailanman. Kaya paano mo nasasabing kailangang itaas ang Anak ng Tao?[a] Sino ba ang Anak ng Taong ito?”
  to: Kaya sumagot sa kanya ang karamihan, “Narinig namin mula sa Kautusan na ang Mesiyas ay mananatili magpakailanman. At paano mo nasasabing kailangang itaas ang Anak ng Tao?[a] Sino ang Anak ng Taong ito?”
  rationale: Pinalitan ang ikalawang “Kaya” ng “At” upang katawanin ang καί at pinasimple ang pangwakas na tanong sa pamamagitan ng pag-aalis ng “ba.” Pinalitan din ang “mga tao” ng “karamihan,” na natural pa rin sa modernong Tagalog at mas tiyak para sa ὁ ὄχλος. Walang pagbabago sa kahulugan o sa sinadyang ambigwidad ng “itaas.”
