  source_fidelity: 'Tumpak ang pagsasalin ng mga pangunahing elemento: ang ὄχλος ay ang nagkakatipong grupo, ang ὁ χριστός ay titulong “Mesiyas,” ang μένει εἰς τὸν αἰῶνα ay walang-hanggang pananatili, at ang ὑψωθῆναι ay nananatiling bukás sa pisikal na pagtataas at pagdakila. Gayunman, ang ikalawang “Kaya” ay hindi tumutugma sa simpleng καί bago ang πῶς at nakapagpapabigat ng ugnayan ng tanong.'
  naturalness: Natural at marangal ang karamihan ng salin. Mas maayos sa modernong Tagalog ang “At paano mo nasasabing …” kaysa “Kaya paano mo nasasabing …”; iniiwasan nito ang magkasunod na gamit ng “Kaya” at mas wastong ipinapakita ang hamon ng tanong. Ang “Sino ang Anak ng Taong ito?” ay sapat nang nagpapahayag ng demonstratibong οὗτος nang walang idinagdag na “ba.”
  terminology: Ang “Kautusan,” “Mesiyas,” at “Anak ng Tao” ay angkop at magkakatugma sa terminolohiyang biblikal. Ang talababa ay wastong nakaangkla sa “itaas” at maayos na pinananatili ang Johannine na dobleng diwa.
