base_translation:
  language: en
  yaml_path: translation/nt/john/012/034.yaml
  text: So the crowd answered him[a], "We have heard from the Law that the Messiah remains forever[b], and how can you say that the Son of Man must be lifted up? Who is this Son of Man?"
translation:
  language: tl
  text: Kaya sumagot sa kanya ang karamihan, “Narinig namin mula sa Kautusan na ang Mesiyas ay mananatili magpakailanman. At paano mo nasasabing kailangang itaas ang Anak ng Tao?[a] Sino ang Anak ng Taong ito?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dakilain.” Sa Juan, ang “itaas” ay maaaring tumukoy kapuwa sa pisikal na pagtataas at sa pagdakila.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη οὖν αὐτῷ ὁ ὄχλος
  choice: Kaya sumagot sa kanya ang mga tao
  rationale: Ang “kaya” ay likas na naghahayag ng pagpapatuloy o bunga sa usapan; ang “mga tao” ay natural na tumutukoy sa nagkakatipong karamihan nang hindi gumagamit ng lipas na “karamihan.”
- source_word: Ἡμεῖς ἠκούσαμεν ἐκ τοῦ νόμου
  choice: Narinig namin mula sa Kautusan
  rationale: Pinananatili nito ang pahayag tungkol sa tradisyong kanilang natanggap at ang tiyak na pagtukoy sa Kautusan, na rito ay maaaring sumaklaw sa mas malawak na patotoo ng Kasulatan.
- source_word: ὁ χριστός
  choice: ang Mesiyas
  rationale: Gumaganap ang χριστός bilang titulo sa kontekstong Judio, kaya mas tuwirang naipapahayag ng “Mesiyas” ang kahulugan nito kaysa sa pangalang “Cristo.”
- source_word: μένει εἰς τὸν αἰῶνα
  choice: mananatili magpakailanman
  rationale: Malinaw at natural nitong ipinahahayag ang patuloy at walang-hanggang pananatili.
- source_word: πῶς λέγεις σὺ
  choice: paano mo nasasabing
  rationale: Naihahayag ng anyong ito ang pagtutol at pagtataka ng mga tao, hindi lamang isang neutral na tanong.
- source_word: δεῖ ὑψωθῆναι
  choice: kailangang itaas
  rationale: Pinananatili ng “kailangang” ang diwa ng pangangailangan, samantalang ang “itaas” ay maaaring tumukoy kapuwa sa pisikal na pagtataas at sa pagdakila.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Ito ang kinikilalang Tagalog na anyo ng titulong ginagamit ni Jesus at pinananatili ang kaugnayan nito sa Daniel.
- source_word: τίς ἐστιν οὗτος ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Sino ba ang Anak ng Taong ito?
  rationale: Ang “ba” ay natural na nagpapahiwatig ng pagtataka, at ang “ito” ay pinananatili upang katawanin ang demonstratibong οὗτος.
theological_decisions:
- issue: Paglilipat ng ὁ χριστός
  choice: ang Mesiyas
  alternative: ang Cristo
  rationale: Titulo ang gamit dito, at inilalagay ng “Mesiyas” ang pahayag sa kontekstong Judio nang hindi nagdaragdag ng denominasyonal na pakahulugan.
- issue: Masaklaw na kahulugan ng ὑψωθῆναι sa Juan
  choice: itaas
  alternative: dakilain
  rationale: Maaaring tumukoy ang pandiwa sa pisikal na pagtataas kay Jesus sa krus at sa kanyang pagdakila. Hindi nilulutas ng salin ang sinadyang dobleng diwa.
- issue: Saklaw ng τοῦ νόμου
  choice: mula sa Kautusan
  alternative: mula sa Kasulatan
  rationale: Pinananatili ang mismong katawagan ng Griyego habang hinahayaang manatili ang posibilidad na ginagamit dito ang “Kautusan” sa mas malawak na diwa para sa sagradong Kasulatan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “Mesiyas,” “Kautusan,” at “Anak ng Tao” bilang pamilyar na mga terminong biblikal; iniwasan ang mas lipas o mabigat na pananalita. Inilagay ang talababa sa “itaas” upang tumugma ang marker sa tunay na leksikal na paliwanag.
