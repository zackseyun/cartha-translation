  text: πάτερ, δόξασόν σου τὸ ὄνομα. ἦλθεν οὖν φωνὴ ἐκ τοῦ οὐρανοῦ· Καὶ ἐδόξασα καὶ πάλιν δοξάσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/028.yaml
  text: 'Father[a], glorify your name. Then a voice came from heaven: “I have glorified it, and I will glorify it again.”'
translation:
  language: tl
  text: '“Ama, luwalhatiin mo ang iyong pangalan.” Kaya’t may tinig na dumating mula sa langit: “Niluwalhati ko na[a] ito, at muli ko itong luluwalhatiin.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas pormal, “Niluwalhati ko ito.”
    reason: Ipinapakita ng alternatibo ang payak na naganap na anyo ng aorist na ἐδόξασα nang hindi gumagamit ng “na.”
lexical_decisions:
- source_word: πάτερ
  choice: Ama
  rationale: Tuwirang panawag ito sa Diyos. Likas at marangal ang “Ama,” at hindi idinaragdag ang “ko” sapagkat walang panghalip na paari sa Griyego.
- source_word: δόξασόν
  choice: luwalhatiin mo
  rationale: Ang pautos na anyo ng δοξάζω ay tumutukoy sa pagpapahayag o paghahayag ng kaluwalhatian. Pinananatili ng “luwalhatiin” ang mahalagang bokabularyo ng kaluwalhatian sa Juan.
- source_word: σου τὸ ὄνομα
  choice: ang iyong pangalan
  rationale: Likas itong katumbas sa Tagalog at pinananatili ang biblikal na diwa ng pangalan bilang kaugnay ng nahayag na pagkakakilanlan at karangalan ng Diyos.
- source_word: ἦλθεν οὖν
  choice: Kaya ... dumating
  rationale: Ang οὖν ay nag-uugnay sa tugon sa naunang panalangin, at ang “kaya” ay natural na nagpapakita ng kaugnayang iyon habang ang “dumating” ay tumutumbas sa ἦλθεν.
- source_word: φωνὴ ἐκ τοῦ οὐρανοῦ
  choice: may tinig na dumating mula sa langit
  rationale: Ang kasunod na tuwirang pananalita ay nagpapakitang “tinig,” hindi lamang tunog, ang ibig sabihin ng φωνή. Ang “mula sa langit” ay nagpapanatili sa banal na pinagmulan nito.
- source_word: Καὶ ἐδόξασα καὶ πάλιν δοξάσω
  choice: Niluwalhati ko na ito, at muli ko itong luluwalhatiin
  rationale: Ipinahahayag ng aspektong naganap ng “niluwalhati ko na” ang natapos nang pagkilos na mahalaga pa sa kasalukuyang tugon; malinaw namang ipinahahayag ng “muli ... luluwalhatiin” ang hinaharap na pag-uulit. Ang “ito” ay likas na tumutukoy sa naunang “pangalan.”
theological_decisions:
- issue: Ang di-binanggit na layon sa sagot ng tinig
  choice: Idinagdag ang “ito” bilang pagtukoy sa “iyong pangalan.”
  alternative: 'Iwan itong walang tahasang layon: “Niluwalhati ko na, at muli akong luluwalhati.”'
  rationale: Maaaring hindi banggitin sa Griyego ang layon dahil malinaw ito sa konteksto, ngunit kailangan ito para sa likas at malinaw na Tagalog. Hindi nito binabago ang tinutukoy; ginagawa lamang nitong tahasan ang ugnayan sa “pangalan.”
- issue: Teolohikal na bigat ng δοξάζω sa Juan
  choice: luwalhatiin / niluwalhati / luluwalhatiin
  alternative: parangalan / pinarangalan / pararangalan
  rationale: Pinananatili ng “luwalhatiin” ang magkakaugnay na wika ng kaluwalhatian tungkol sa Ama at Anak sa Ebanghelyo ni Juan; mas mahina at mas makitid ang “parangalan.”
- issue: Aspekto ng ἐδόξασα
  choice: “Niluwalhati ko na” sa pangunahing teksto
  alternative: Mas pormal na “Niluwalhati ko”
  rationale: Aorist ang anyong Griyego at hindi nito tahasang itinatakda ang katumbas na panahunan sa Tagalog. Likas na ipinahahayag ng “na” ang naganap nang pagkilos na may kaugnayan sa kasalukuyang tugon, samantalang inilalahad sa talababa ang mas pormal na anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang tradisyonal ngunit nauunawaang “luwalhatiin” upang mapanatili ang mahalagang bokabularyong teolohikal ng Juan. Inilagay ang talababa sa mismong pandiwang tinutukoy nito, hindi sa panawag na “Ama.”
