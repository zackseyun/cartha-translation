base_translation:
  language: en
  yaml_path: translation/nt/john/012/024.yaml
  text: Truly[a], truly, I say to you, unless the grain of wheat falls into the ground and dies, it remains by itself; but if it dies[b], it bears much fruit.
translation:
  language: tl
  text: 'Tunay na tunay na sinasabi ko sa inyo: malibang mahulog sa lupa ang isang butil ng trigo at mamatay, mananatili itong nag-iisa.[a] Ngunit kung mamatay ito,[b] magbubunga ito ng maraming bunga.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mananatili itong mag-isa.”
    reason: lexical_alternative
  - marker: b
    text: Ang larawan ay tungkol sa butil na kailangang mamatay sa lupa upang mamunga. Sa konteksto, ikinakapit ni Jesus ang huwarang ito sa sarili niyang kamatayan at sa mga sumusunod sa kanya.
    reason: cross_reference
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Tunay na tunay
  rationale: Pinananatili ang pag-uulit at mariing panimulang pahayag na katangian ng pananalita ni Jesus sa Juan, sa paraang likas at malinaw sa modernong Filipino.
- source_word: λέγω ὑμῖν
  choice: sinasabi ko sa inyo
  rationale: Tuwirang pinananatili ang pandiwa at ang pakikipag-usap sa maramihang tagapakinig.
- source_word: ἐὰν μὴ
  choice: malibang
  rationale: Likas na katumbas sa Filipino ng kondisyong nangangahulugang ‘kung hindi.’
- source_word: ὁ κόκκος τοῦ σίτου
  choice: ang isang butil ng trigo
  rationale: Ang κόκκος ay butil o binhi; ‘butil ng trigo’ ang pinakanatural sa larawang pang-agrikultura. Ginamit ang ‘isang’ upang malinaw ang iisang butil bilang halimbawa.
- source_word: πεσὼν εἰς τὴν γῆν
  choice: mahulog sa lupa
  rationale: Pinananatili ang kilos at ang pang-agrikulturang kahulugan ng γῆ bilang lupa, hindi ang daigdig sa kabuuan.
- source_word: ἀποθάνῃ
  choice: mamatay
  rationale: Ang payak na anyong ito ay natural sa kondisyong Filipino at pinananatili ang tahasang metapora ng kamatayan.
- source_word: αὐτὸς μόνος μένει
  choice: mananatili itong nag-iisa
  rationale: Ipinahahayag ang pagiging nag-iisa ng butil at ang kawalan nito ng ibubungang marami, nang hindi nagdaragdag ng emosyonal na kahulugan.
- source_word: ἐὰν δὲ ἀποθάνῃ
  choice: Ngunit kung mamatay ito
  rationale: Malinaw na ipinakikita ng ‘ngunit’ ang pagsalungat sa unang kalagayan.
- source_word: πολὺν καρπὸν φέρει
  choice: mamumunga ito nang sagana
  rationale: Pinananatili ang metapora ng pamumunga habang likas na ipinahahayag sa Filipino ang dami ng bunga; hindi ito pinalawak tungo sa ‘ani,’ na magiging higit sa tahasang sinasabi ng καρπός.
theological_decisions:
- issue: Ang larawang pang-agrikultura ay may di-tahasang kahulugang kristolohikal at kaugnayan sa pagsunod kay Jesus.
  choice: Pinanatili sa pangunahing teksto ang literal na larawan ng butil na namamatay at namumunga, nang hindi tahasang idinaragdag na tumutukoy ito sa kamatayan ni Jesus.
  alternative: Palawakin ang talata upang tahasang sabihing inilalarawan ni Jesus ang sarili niyang kamatayan at ang ibubunga nito para sa marami.
  rationale: Ipinahihiwatig ng konteksto ang pagkakapit kay Jesus at sa mga sumusunod sa kanya, ngunit ang mismong talata ay naglalahad muna ng larawan. Ang pagpapanatili rito ay umiiwas sa pagsasara ng teolohikal na pahiwatig sa loob ng salin.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Pinanatili ang mariing pag-uulit sa pambungad at ang metaporang pang-agrikultura, ngunit iniwasan ang sobrang makalumang pananalita at ang interpretibong pagpapalawak.
