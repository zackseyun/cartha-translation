  source_fidelity: 'Tumpak ang pangunahing daloy at mga kondisyon ng Griyego: ang butil ay kailangang mahulog sa lupa at mamatay; kung hindi, nananatili itong mag-isa, ngunit kung mamatay, nagbubunga ito. Gayunman, ang “nang sagana” ay higit na naglalarawan ng paraan ng pamumunga kaysa sa tuwirang dami ng καρπὸν πολύν (“maraming bunga”).'
  naturalness: Malinaw at likas ang register sa modernong Filipino. Ang “Tunay na tunay na sinasabi ko sa inyo” at “malibang” ay angkop sa marangal ngunit naiintindihang pananalita. Ang pagbabago sa huling parirala ay magiging mas tuwiran at idiomatiko.
