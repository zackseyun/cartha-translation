  source_fidelity: 'Tumpak ang diwa at pagkakasunod ng SBLGNT: si Felipe ay lumapit at nagsalita kay Andres, at pagkatapos ay lumapit sina Andres at Felipe at nagsalita kay Jesus. Ang "lumapit" ay isang angkop na pagsasalin ng ἔρχεται sa kontekstong ito, nang walang idinagdag na direksiyon o motibo.'
  naturalness: Likas at malinaw ang makabagong Tagalog. Ang paggamit ng nakaraang panahon sa salaysay ay idiomatiko, at ang "sina Andres at Felipe" / "sinabi nila" ay malinaw na naghahayag ng maramihang simuno.
