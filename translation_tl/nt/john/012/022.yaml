id: JHN.12.22
reference: John 12:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἔρχεται ⸀ὁ Φίλιππος καὶ λέγει τῷ Ἀνδρέᾳ· ⸀ἔρχεται Ἀνδρέας καὶ Φίλιππος ⸀καὶ λέγουσιν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/022.yaml
  text: Philip comes and tells Andrew[a]; Andrew and Philip come and tell Jesus.
translation:
  language: tl
  text: Lumapit si Felipe at sinabi kay Andres[a]; lumapit sina Andres at Felipe at sinabi nila kay Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gumagamit dito ang Griyego ng panahunang pangkasalukuyan sa buong salaysay—“lumalapit … nagsasabi … lumalapit … nagsasabi”—isang karaniwang paraang pampanitikan upang maging mas buhay at kagyat ang pangyayari. Isinalin ito rito sa panahunang pangnagdaan upang maging natural sa Tagalog.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: lumapit
  rationale: Ang pandiwa ay tumutukoy sa paglapit ni Felipe kay Andres. Pinananatili ang masiglang daloy ng salaysay nang hindi gumagamit ng di-likas na panahunang pangkasalukuyan sa Tagalog.
- source_word: λέγει
  choice: sinabi
  rationale: Likas na paglalarawan ito ng pakikipag-usap ni Felipe kay Andres; hindi nakasaad sa talata ang mismong sinabi.
- source_word: τῷ Ἀνδρέᾳ
  choice: kay Andres
  rationale: Ipinahahayag ng 'kay' ang datibong tumatanggap ng pagsasalita; ginamit ang karaniwang anyong Tagalog ng pangalan.
- source_word: ἔρχεται
  choice: lumapit
  rationale: Sa ikalawang sugnay, tumutukoy ito sa paglapit nina Andres at Felipe kay Jesus. Ang pangmaramihang simuno ay ipinahahayag ng 'sina' at 'nila.'
- source_word: λέγουσιν
  choice: sinabi nila
  rationale: Ipinakikita ang pangmaramihang anyo ng pandiwa at pinananatili ang pagtutulad sa unang sugnay.
- source_word: τῷ Ἰησοῦ
  choice: kay Jesus
  rationale: Ipinahahayag ng 'kay' ang taong pinagsabihan; ginamit ang karaniwang anyong Tagalog ng pangalan.
- source_word: καί
  choice: at
  rationale: Pinananatili ang payak at magkakaugnay na daloy ng Griyego nang hindi nagdaragdag ng tahasang temporal o lohikal na kahulugan.
- source_word: ὁ Φίλιππος
  choice: si Felipe
  rationale: Hindi isinasalin nang hiwalay ang artikulong Griyego sa pangalang pantangi; ginagamit ang angkop na pantukoy na Tagalog na 'si.'
theological_decisions: []
