  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang 'lumapit' sa halip na literal na pangkasalukuyang 'lumalapit' upang maging natural ang pagsasalaysay, habang ipinaliliwanag sa talababa ang makasaysayang pangkasalukuyan ng Griyego.
