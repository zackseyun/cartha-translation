base_translation:
  language: en
  yaml_path: translation/nt/john/012/036.yaml
  text: While you have the light[a], believe in the light, so that you may become sons of light. Jesus spoke these things[b], and he departed and hid from them.
translation:
  language: tl
  text: Habang nasa inyo ang liwanag, sumampalataya kayo sa liwanag, upang kayo’y maging mga anak ng liwanag.[a] Matapos sabihin ni Jesus ang mga bagay na ito, umalis siya at nagtago mula sa kanila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “mga anak na lalaki ng liwanag”; isang idyoma para sa mga taong nailalarawan ng liwanag.'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “at pag-alis niya, nagtago siya mula sa kanila.”'
    reason: syntactic_alternative
lexical_decisions:
- source_word: ὡς τὸ φῶς ἔχετε
  choice: Habang nasa inyo ang liwanag
  rationale: Ipinahahayag ng ὡς kasama ng pangkasalukuyang ἔχετε ang panahong may liwanag pa sila. Natural sa Tagalog ang “habang nasa inyo” at pinananatili nito ang pagkaapurahan.
- source_word: πιστεύετε εἰς τὸ φῶς
  choice: sumampalataya kayo sa liwanag
  rationale: Ang “sumampalataya sa” ay natural at teolohikal na angkop na salin ng Johannine na πιστεύω εἰς, nang hindi dinaragdagan ang diwa.
- source_word: ἵνα υἱοὶ φωτὸς γένησθε
  choice: upang maging mga anak kayo ng liwanag
  rationale: Pinananatili ng “upang” ang layunin o bunga ng ἵνα, at ng “maging” ang diwang pagbabago ng γένησθε. Ang “mga anak ng liwanag” ang natural na idyomatikong salin sa modernong Tagalog.
- source_word: Ταῦτα ἐλάλησεν Ἰησοῦς
  choice: Sinabi ni Jesus ang mga bagay na ito
  rationale: Mas natural sa kasalukuyang Tagalog ang “sinabi” kaysa literal na “sinalita,” habang tapat pa rin sa kahulugan ng ἐλάλησεν.
- source_word: ἀπελθὼν ἐκρύβη ἀπ’ αὐτῶν
  choice: pagkatapos ay umalis siya at nagtago mula sa kanila
  rationale: Ipinakikita ng “pagkatapos” ang pagkakasunod ng aorist participle at pangunahing pandiwa; ang “nagtago” ay angkop sa middle-like na diwa ng anyong passive na ἐκρύβη.
theological_decisions:
- issue: Idyomang υἱοὶ φωτός
  choice: mga anak ng liwanag
  alternative: mga anak na lalaki ng liwanag
  rationale: Bagaman literal na panlalaki ang υἱοί, ang parirala ay Semitiko/Johannine na idyoma para sa mga taong nailalarawan ng liwanag. Sa Tagalog, ang “mga anak ng liwanag” ay natural, inklusibo ayon sa gamit ng idyoma, at hindi nagdaragdag ng di-likas na pagtukoy sa kasarian; itinatala sa talababa ang literal na anyo.
- issue: Johannine na πιστεύω εἰς
  choice: sumampalataya kayo sa liwanag
  alternative: magtiwala kayo sa liwanag
  rationale: Tuwirang pinananatili ng “sumampalataya sa” ang panawagang teolohikal ng teksto at ang karaniwang Johannine na pormula nang hindi ito pinalalawak sa isang tiyak na doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “sumampalataya” upang mapanatili ang bokabularyong biblikal ngunit madaling maunawaan; iniwasan ang labis na literal at di-natural na “mga anak na lalaki” sa pangunahing teksto.
