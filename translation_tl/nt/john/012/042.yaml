  source_fidelity: Ang “marami rin sa mga pinuno” ay naipapahayag ang καί bilang karagdagang pahayag, ngunit hindi gaanong malinaw ang emphatic/concessive na “even among the rulers”; mas tumpak ang “maging sa mga pinuno.” Ang “hayagang” ay hindi tahasang nasa Griyego at hindi kailangan upang maging natural ang salin. Ang “matiwalag” ay maaaring magmungkahi ng mas tiyak na pormal na parusang panrelihiyon kaysa sa ipinahihiwatig ng ἀποσυνάγωγος.
  naturalness: Natural at marangal ang pangungusap sa modernong Filipino Tagalog. Ang “maalis sa sinagoga” ay mas payak at mas malawak ang saklaw kaysa “matiwalag,” habang nananatiling malinaw sa konteksto.
  terminology: Ang “sumampalataya sa kanya,” “mga Pariseo,” at “sinagoga” ay angkop. Pinananatili ng “ito” ang hindi tahasang layon ng ὡμολόγουν nang walang doktrinal na pagpapasya.
  issues:
