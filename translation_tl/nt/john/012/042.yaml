    rationale: Ang καί sa kontekstong ito ay nagbibigay-diin na maging mula sa pangkat ng mga pinuno ay marami ang sumampalataya. Ang “maging sa mga pinuno” ay mas malinaw na katumbas nito.
  - severity: low
    issue: Idinagdag ng “hayagang” ang isang paraan ng pagpapahayag na hindi tahasang isinasaad sa teksto.
    rationale: Bagaman ang pampublikong aspekto ay sinusuportahan ng konteksto, ang οὐχ ὡμολόγουν ay maaaring isalin nang hindi idinaragdag ang pang-abay na ito.
  - severity: medium
    issue: Ang “matiwalag” ay maaaring masyadong tumukoy sa pormal na ekskomunikasyon.
    rationale: Ang ἀποσυνάγωγος ay tumutukoy sa pagiging ibinukod o pinaalis mula sa pamayanan ng sinagoga; ang “maalis sa sinagoga” ay hindi nagpapalagay ng partikular na prosesong juridical.
