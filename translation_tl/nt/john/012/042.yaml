revisions:
- from: Gayunman, marami rin sa mga pinuno ang sumampalataya sa kanya. Ngunit dahil sa mga Pariseo, hindi nila ito hayagang ipinahahayag, upang hindi sila matiwalag sa sinagoga.[a]
  to: Gayunman, maging sa mga pinuno ay marami ang sumampalataya sa kanya; ngunit dahil sa mga Pariseo, hindi nila ito ipinahahayag, upang hindi sila maalis sa sinagoga.[a]
  rationale: Inayos ang panimulang parirala upang malinaw na maipahayag ang diin na maging sa hanay ng mga pinuno ay marami ang sumampalataya. Inalis ang “hayagang,” na isang di-tahasang pagpapalawak, at pinalitan ang “matiwalag” sa pangunahing teksto ng mas malawak at textually restrained na “maalis sa sinagoga.” Iningatan ang “ito” upang huwag tukuyin nang lampas sa Griyego ang hindi ipinahayag na layon ng “ipinahahayag.”
