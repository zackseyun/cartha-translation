id: JHN.12.42
reference: John 12:42
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅμως μέντοι καὶ ἐκ τῶν ἀρχόντων πολλοὶ ἐπίστευσαν εἰς αὐτόν, ἀλλὰ διὰ τοὺς Φαρισαίους οὐχ ὡμολόγουν ἵνα μὴ ἀποσυνάγωγοι γένωνται,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/042.yaml
  text: Nevertheless, even among the rulers many believed in him, but because of the Pharisees they were not confessing it, so that they might not become excluded from the synagogue.
translation:
  language: tl
  text: Gayunman, maging sa mga pinuno ay marami ang sumampalataya sa kanya; ngunit dahil sa mga Pariseo, hindi nila ito ipinahahayag, upang hindi sila maalis sa sinagoga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “matiwalag sa sinagoga.” Ang salitang Griyego ay tumutukoy sa pagiging ibinukod mula sa pamayanan ng sinagoga.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμως μέντοι
  choice: Gayunman
  rationale: Likas at marangal na panandang pasalungat sa modernong Tagalog; naipapahayag nito ang pinatinding concessive force ng magkaparis na kataga.
- source_word: καὶ ἐκ τῶν ἀρχόντων πολλοὶ
  choice: marami rin sa mga pinuno
  rationale: Ang “sa mga pinuno” ay nagpapakita ng pagiging kabilang sa pangkat, at ang “rin” ay kumakatawan sa καί nang hindi nagiging pilit ang ayos.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: sumampalataya sa kanya
  rationale: Karaniwan at angkop na salin ng Johannine πιστεύω εἰς, na nagpapahayag ng pananampalatayang nakatuon kay Jesus nang hindi hinahatulan ang tunay na kalagayang teolohikal ng mga pinuno.
- source_word: διὰ τοὺς Φαρισαίους
  choice: dahil sa mga Pariseo
  rationale: Pinananatili ang tahasang sanhi sa διά na may accusative; hindi idinaragdag ang “takot” bagaman ipinahihiwatig iyon ng konteksto.
- source_word: οὐχ ὡμολόγουν
  choice: hindi nila ito hayagang ipinahahayag
  rationale: Ipinahihiwatig ng imperfect ang nagpapatuloy o nakaugaliang hindi pagpapahayag. Ang “ito” ay tumutukoy sa kanilang pananampalataya nang hindi naglalagay ng tahasang layon na wala sa Griyego; nililinaw ng “hayagan” ang pampublikong pagkilala na hinihingi ng konteksto.
- source_word: ἵνα μὴ
  choice: upang hindi
  rationale: Malinaw na pinananatili ang layuning maiwasan ang kasunod na bunga.
- source_word: ἀποσυνάγωγοι γένωνται
  choice: matiwalag sa sinagoga
  rationale: Natural na Tagalog para sa pagiging hindi na kabilang o pinahihintulutang makibahagi sa pamayanan ng sinagoga; inilalahad sa talababa ang mas malawak na saklaw ng termino.
theological_decisions:
- issue: Kalikasang teolohikal ng pananampalataya ng mga pinuno
  choice: Isinalin nang tuwiran bilang “sumampalataya sa kanya.”
  alternative: Pahinain bilang panlabas lamang na pag-aangkin, o palakasin bilang tiyak na tunay at nagliligtas na pananampalataya.
  rationale: Tahasan silang inilalarawang sumampalataya, ngunit hindi hayagang nagpahayag. Pinananatili ng salin ang tensiyong ito at hindi nagpapasya nang lampas sa sinasabi ng talata.
- issue: Hindi tahasang layon ng ὡμολόγουν
  choice: “ito,” na tumutukoy sa kanilang pananampalataya o pagkilala kay Jesus
  alternative: “siya,” na tahasang ginagawang si Jesus ang gramatikal na layon
  rationale: Walang nakasaad na layon sa Griyego. Iniiwasang magdagdag ng tiyak na gramatikal na layon habang nagbibigay ng natural na pangungusap sa Tagalog.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “sinagoga” bilang pamilyar na katawagang biblikal at “matiwalag” bilang maikli at natural na paglalarawan ng panlipunan at panrelihiyong pagkakabukod.
