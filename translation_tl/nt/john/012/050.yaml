  text: καὶ οἶδα ὅτι ἡ ἐντολὴ αὐτοῦ ζωὴ αἰώνιός ἐστιν. ἃ οὖν ⸂ἐγὼ λαλῶ⸃, καθὼς εἴρηκέν μοι ὁ πατήρ, οὕτως λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/050.yaml
  text: And I know that his commandment is eternal life. So what I speak[a], I speak just as the Father has told me.
translation:
  language: tl
  text: At alam kong ang kanyang utos ay buhay na walang hanggan.[a] Kaya ang sinasabi ko ay sinasabi ko ayon sa sinabi sa akin ng Ama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring unawain: “ang kanyang utos ay humahantong sa buhay na walang hanggan” o “ang kanyang utos ay tungkol sa buhay na walang hanggan.” Mas literal sa Griyego: “ang kanyang utos ay buhay na walang hanggan.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐντολή
  choice: utos
  rationale: Ang “utos” ang natural at tuwirang katumbas sa makabagong Tagalog para sa isang may-awtoridad na tagubilin.
- source_word: ζωὴ αἰώνιος
  choice: buhay na walang hanggan
  rationale: Ito ang kinikilalang katumbas ng karaniwang ekspresyong Juaniko at pinananatili ang eskatolohikal at pangmatagalang diwa.
- source_word: ἃ
  choice: ang sinasabi ko
  rationale: Likas sa Tagalog ang nominalisasyong ito para sa neuter plural relative pronoun at malinaw nitong ipinapahayag ang layon ng pagsasalita.
- source_word: λαλῶ
  choice: sinasabi ko
  rationale: Ang pag-uulit ng parehong parirala ay nagpapanatili sa pag-uulit ng λαλῶ, habang mas natural dito ang “sinasabi” kaysa “sinasalita.”
- source_word: καθὼς
  choice: ayon mismo sa
  rationale: Ipinapahayag nito ang mahigpit na pagtutugma ng sinasabi ni Jesus sa sinabi sa kanya ng Ama nang hindi nagiging mabigat ang pangungusap.
- source_word: εἴρηκέν μοι
  choice: sinabi sa akin
  rationale: Natural itong Tagalog para sa pananalitang natanggap ni Jesus; nauunawaan sa konteksto na nananatiling may bisa ang sinabi ng Ama.
- source_word: ὁ πατήρ
  choice: ang Ama
  rationale: Pinananatili ang articular relational title nang hindi idinaragdag ang “aking,” na wala sa Griyego.
- source_word: οὖν
  choice: Kaya
  rationale: Natural na ipinakikita ang lohikal na bunga o paghinuha mula sa naunang pahayag.
- source_word: οἶδα
  choice: alam ko
  rationale: Ito ang tuwiran at karaniwang katumbas na angkop sa tiyak at maringal na pahayag.
theological_decisions:
- issue: Kahulugan ng “ang kanyang utos ay buhay na walang hanggan”
  choice: Pinanatili ang tuwirang equative na pahayag na “ay buhay na walang hanggan.”
  alternative: Ang kanyang utos ay humahantong sa buhay na walang hanggan; o ang kanyang utos ay tungkol sa buhay na walang hanggan.
  rationale: Tuwirang gumagamit ang Griyego ng copula (“ay”). Ang pagpapanatili nito ay hindi tahimik na nagpapasya kung ang utos ay nagdudulot, naghahayag, o tumutukoy sa buhay na walang hanggan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “utos” sa halip na mas tradisyonal na “kautusan,” at pinanatili ang pag-uulit sa hulí ng talata. Inilagay ang talababa sa pangungusap na may tunay na ambiguity.
