  text: Why was this perfume not sold for three hundred denarii and given to the poor?[a]
translation:
  language: tl
  text: “Bakit hindi ipinagbili ang pabangong ito sa halagang tatlong daang denario at ibinigay sa mga mahihirap ang pinagbilhan nito?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang isang denario ay karaniwang sahod ng isang manggagawa para sa isang araw; ang tatlong daang denario ay humigit-kumulang katumbas ng kinikita sa isang taon, kung isasaalang-alang ang mga araw na hindi nagtatrabaho.
    reason: cultural_note
lexical_decisions:
- source_word: Διὰ τί
  choice: Bakit
  rationale: Likas at tuwirang tanong sa modernong Tagalog na katumbas ng ‘bakit?’ o ‘sa anong dahilan?’
- source_word: μύρον
  choice: pabango
  rationale: Tumutukoy sa mahalagang mabangong langis o unguento; ang ‘pabango’ ay malinaw at natural sa kasalukuyang Tagalog, habang ipinahihiwatig ng konteksto ang anyong likido na ginagamit sa pagpapahid.
- source_word: ἐπράθη
  choice: ipinagbili
  rationale: Pinananatili ang balintiyak na anyo ng aorist passive at ang himig ng retorikal na pagtutol.
- source_word: τριακοσίων δηναρίων
  choice: sa halagang tatlong daang denario
  rationale: Ang genitive ay nagpapahayag ng presyo. Pinananatili ang makasaysayang yunit ng salapi at inilalagay sa talababa ang halaga nito kaugnay ng arawang sahod.
- source_word: ἐδόθη
  choice: ibinigay
  rationale: Tuwirang salin ng aorist passive ng δίδωμι at sapat ang lawak para sa konteksto ng pagkakawanggawa.
- source_word: πτωχοῖς
  choice: sa mga dukha
  rationale: Natural at marangal na pagtukoy sa mga taong mahirap, na pinananatili ang panlipunang kategoryang nasa teksto.
