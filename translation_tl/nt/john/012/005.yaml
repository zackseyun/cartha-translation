translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal. Ginamit ang ‘ipinagbili’ at ‘mga dukha’ upang mapanatili ang bahagyang pormal na himig ng salaysay nang hindi nagiging lipas o mahirap unawain.
