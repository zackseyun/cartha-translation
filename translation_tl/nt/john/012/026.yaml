  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐὰν ἐμοί ⸂τις διακονῇ⸃ ἐμοὶ ἀκολουθείτω, καὶ ὅπου εἰμὶ ἐγὼ ἐκεῖ καὶ ὁ διάκονος ὁ ἐμὸς ἔσται· ⸀ἐάν τις ἐμοὶ διακονῇ τιμήσει αὐτὸν ὁ πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/026.yaml
  text: If anyone serves me[a], let him follow me; and where I am, there my servant will be also. If anyone serves me, the Father will honor him.
translation:
  language: tl
  text: Kung may naglilingkod sa akin, sumunod siya sa akin; at kung nasaan ako, naroon din ang lingkod ko. Kung may naglilingkod sa akin, pararangalan siya ng Ama.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διακονῇ (διακονέω)
  choice: naglilingkod
  rationale: Tumutukoy ito sa paglilingkod kay Jesus sa pangkalahatan. Likas sa modernong Tagalog ang “naglilingkod” at hindi nito nililimitahan ang kahulugan sa isang tungkulin sa iglesya.
- source_word: ἀκολουθείτω
  choice: sumunod siya
  rationale: Pinananatili nito ang puwersa ng pautos habang natural sa Tagalog. Maaaring magpahiwatig ang kasalukuyang pautos sa Griyego ng patuloy na pagsunod, ngunit hindi iyon labis na nilinaw sa teksto.
- source_word: διάκονος
  choice: lingkod
  rationale: Pangkalahatang tawag ito sa taong naglilingkod kay Jesus, hindi sa tiyak na katungkulan ng diakono. Napananatili rin ang ugnayang leksikal sa “naglilingkod.”
- source_word: ὅπου εἰμὶ ἐγὼ
  choice: kung nasaan ako
  rationale: Natural itong katumbas sa Tagalog. Hindi na kailangang gawing tahasan ang diin ng ἐγώ sapagkat sapat itong naipahihiwatig ng pangungusap at konteksto.
- source_word: ἐκεῖ καὶ
  choice: naroon din
  rationale: Ang “naroon” ay tumutugma sa pook na tinutukoy, at pinananatili ng “din” ang pandagdag na diwa ng καί.
- source_word: τιμήσει
  choice: pararangalan
  rationale: Malinaw nitong ipinahahayag ang pangakong pagbibigay ng karangalan nang hindi tinutukoy kung anong anyo ng karangalan iyon.
- source_word: ὁ πατήρ
  choice: ang Ama
  rationale: Walang tahasang pang-angking “ko” sa Griyego, kaya hindi ito idinagdag.
- source_word: τις
  choice: may / sinumang ipinahihiwatig
  rationale: Ang konstruksiyong “kung may naglilingkod” ay likas na paraan sa Tagalog upang ipahayag ang di-tiyak at pangkalahatang “kung ang sinuman.”
- source_word: αὐτόν
  choice: siya
  rationale: Ang “siya” ay likas na panghalip na isahan sa Tagalog at walang kasariang gramatikal; tumpak nitong tinutukoy ang sinumang naglilingkod.
theological_decisions:
- issue: Pangkalahatang pagtukoy sa taong naglilingkod
  choice: Gamitin ang “kung may” at ang panghalip na “siya.”
  alternative: Gamitin ang mas tahasang “kung ang sinuman” sa dalawang kondisyon.
  rationale: Walang panlalaki o pambabaeng anyo ang “siya” sa Tagalog. Kaya naipapahayag ang isahang pangkalahatang reperensiya ng Griyego nang hindi nagdaragdag o nag-aalis ng kasariang semantiko.
- issue: Kalikasan ng karangalang ibibigay ng Ama
  choice: Isalin lamang bilang “pararangalan siya ng Ama.”
  alternative: Tukuyin ito bilang gantimpala sa langit o kaluwalhatian sa hinaharap.
  rationale: Hindi tinutukoy ng talata ang tiyak na anyo o panahon ng karangalang ito, kaya pinananatiling bukas ang teolohikal na saklaw ng pahayag.
- issue: Ugnayan ng paglilingkod at pagsunod kay Jesus
  choice: Panatilihin ang pautos na “sumunod siya sa akin.”
  alternative: Palakasin bilang “dapat siyang sumunod” o gawing tahasang patuluyan bilang “patuloy siyang sumunod.”
  rationale: Ang payak na pautos ay tapat sa gramatika at hindi labis na nagpapalakas o nagpapaliwanag sa aspektong patuluyan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “lingkod” sa halip na “ministro” o “diakono” upang maiwasan ang di-sinasadyang pahiwatig ng opisyal na katungkulan. Pinanatili ang pag-uulit ng “naglilingkod sa akin” gaya ng nasa Griyego.
