  text: ὅτι πολλοὶ δι’ αὐτὸν ὑπῆγον τῶν Ἰουδαίων καὶ ἐπίστευον εἰς τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/011.yaml
  text: because many of the Jews were going away because of him and were believing in Jesus[a][b][c][d].
translation:
  language: tl
  text: sapagkat marami sa mga Judio[a] ang lumalayo dahil sa kanya[b] at sumasampalataya kay Jesus.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga taga-Judea.” Sa Ebanghelyo ni Juan, ang “mga Judio” ay maaaring tumukoy sa mga Judio sa pangkalahatan, sa mga taga-Judea, o kung minsan sa mga pinunong Judio, ayon sa konteksto.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “umaalis.” Ipinahihiwatig ng pandiwang Griyego ang nagpapatuloy o paulit-ulit na paglayo, malamang mula sa panig o impluwensiya ng mga sumasalungat kay Jesus.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “nananalig kay Jesus” o “nagtitiwala kay Jesus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng balak ng mga punong pari sa naunang talata. Likas at malinaw sa Filipino ang “sapagkat” sa ganitong sugnay.
- source_word: δι’ αὐτὸν
  choice: dahil sa kanya
  rationale: 'Ang διά na may accusative ay nagsasaad dito ng sanhi: si Lazaro ang naging dahilan ng pagtugon ng marami. Iniiwasan din nito ang hindi natural na pag-uulit ng “sapagkat.”'
- source_word: πολλοὶ τῶν Ἰουδαίων
  choice: marami sa mga Judio
  rationale: 'Pinananatili nito ang partitive na diwa: isang malaking bahagi mula sa mas malawak na pangkat, hindi lahat ng Judio.'
- source_word: ὑπῆγον
  choice: lumalayo
  rationale: Ang imperfect ay nagpapahiwatig ng nagpapatuloy o paulit-ulit na pagkilos. Pinananatili ng “lumalayo” ang larawan ng paglayo nang hindi tiyak na ipinapakahulugang pormal na pagtalikod.
- source_word: ἐπίστευον εἰς τὸν Ἰησοῦν
  choice: sumasampalataya kay Jesus
  rationale: Ipinahahayag nito ang nagpapatuloy na pananampalatayang nakatuon kay Jesus, nang hindi dinaragdagan ng konklusyong hindi tahasang sinabi ng talata.
theological_decisions:
- issue: Saklaw ng Ἰουδαίων sa konteksto ng Juan
  choice: mga Judio
  alternative: mga taga-Judea; mga pinunong Judio
  rationale: Nag-iiba ang tinutukoy ng Ἰουδαῖοι sa Ebanghelyo ni Juan. Dito, ang “marami sa” ay malinaw na tumutukoy lamang sa isang bahagi ng pangkat at hindi sa lahat ng Judio. Pinananatili sa pangunahing teksto ang mas malawak na katawagan, habang inilalahad sa talababa ang posibleng heograpikong diwa.
- issue: Diwa ng πιστεύω εἰς
  choice: sumasampalataya kay Jesus
  alternative: nananalig kay Jesus; nagtitiwala kay Jesus
  rationale: Sinasabi ng talata na ang kanilang pananampalataya ay nakatuon kay Jesus, ngunit hindi nito tahasang inilalahad ang lahat ng implikasyong teolohikal nito. Kaya hindi ito pinalawak bilang “nagiging mga alagad” o “naliligtas.”
- issue: Tinutukoy ng αὐτόν
  choice: kanya
  alternative: kay Lazaro
  rationale: Sa agarang konteksto, si Lazaro ang tinutukoy, ngunit pinananatili ng panghalip ang anyo at daloy ng Griyego nang hindi inuulit ang pangalan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Judio,” “sumasampalataya,” at “sapagkat” bilang pamilyar na wikang biblikal na nananatiling natural sa kasalukuyang gamit. Ang ayos na “sapagkat dahil sa kanya” ay malinaw na naghihiwalay sa sanhi ng naunang balak at sa sanhi ng paglayo ng marami.
