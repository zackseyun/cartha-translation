  naturalness: Mas natural at malinaw sa makabagong Filipino ang “aming ulat” sa retorikal na tanong. Ang “nang sabihin niya” ay maayos na naghahabi sa sipi nang hindi nagiging mabigat ang “na kanyang sinabi.”
  terminology: Pinananatili ang “Panginoon” para sa Κύριε/κυρίου at ang tradisyonal ngunit malinaw na “bisig” para sa βραχίων. Ang “salita ni propeta Isaias” ay angkop para sa λόγος Ἠσαΐου τοῦ προφήτου.
