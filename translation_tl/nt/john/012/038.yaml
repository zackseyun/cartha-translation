id: JHN.12.38
reference: John 12:38
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἵνα ὁ λόγος Ἠσαΐου τοῦ προφήτου πληρωθῇ ὃν εἶπεν· Κύριε, τίς ἐπίστευσεν τῇ ἀκοῇ ἡμῶν; καὶ ὁ βραχίων κυρίου τίνι ἀπεκαλύφθη;
base_translation:
  language: en
  yaml_path: translation/nt/john/012/038.yaml
  text: 'so that the word of Isaiah the prophet might be fulfilled[a], which he said: “Lord, who has believed our report? And to whom has the arm of the Lord been revealed?”'
translation:
  language: tl
  text: 'upang matupad ang salita ni propeta Isaias nang sabihin niya: “Panginoon, sino ang naniwala sa aming ulat?[a] At kanino inihayag ang bisig ng Panginoon?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “aming mensahe” o “aming narinig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: upang
  rationale: Likas na panandang Filipino para sa sugnay na katuparan; pinananatili nitong bukas kung layunin, bunga, o kapwa ang diin.
- source_word: ὁ λόγος Ἠσαΐου τοῦ προφήτου
  choice: ang sinabi ni propeta Isaias
  rationale: Sa pormulang ito, ang λόγος ay tumutukoy sa pahayag na sinipi. Mas natural sa Filipino ang “sinabi ni propeta Isaias” kaysa literal na “salita ni Isaias na propeta.”
- source_word: πληρωθῇ
  choice: matupad
  rationale: Karaniwan at malinaw na salin ng pasibong katuparan sa ganitong pormula ng pagsipi; hindi kailangang gawing tahasang pasibo sa Filipino.
- source_word: Κύριε
  choice: Panginoon
  rationale: Tuwirang salin ng bokatibong κύριε at angkop sa banal na pagtawag sa sipi mula sa Isaias.
- source_word: ἐπίστευσεν
  choice: naniwala
  rationale: Natural ang aspektong perpektibo sa retorikal na tanong sa Filipino at hindi nangangailangan ng artipisyal na pagtutumbas sa English present perfect.
- source_word: τῇ ἀκοῇ ἡμῶν
  choice: sa aming ipinahayag
  rationale: Ipinapahayag ang obhetibong diwa ng ἀκοή bilang ulat o mensaheng ipinarinig. Iniiwasan nito ang bahagyang lipas na “aming ulat,” habang inilalagay sa talababa ang tunay na mga alternatibo.
- source_word: ὁ βραχίων κυρίου
  choice: ang bisig ng Panginoon
  rationale: Pinananatili ang biblikal na metapora para sa kapangyarihan at pagkilos ng Diyos sa halip na ipaliwanag ito sa mismong teksto.
- source_word: ἀπεκαλύφθη
  choice: inihayag
  rationale: Pinananatili ang pasibong kahulugan sa natural na anyong Filipino at tumutugma sa retorikal na tanong.
theological_decisions:
- issue: Ang ugnayan ng katuparan sa layunin at bunga
  choice: “upang matupad” nang walang dagdag na paliwanag
  alternative: “kaya natupad” o “na ang bunga ay natupad”
  rationale: Maaaring magtaglay ang ἵνα ng diwa ng layunin, bunga, o kapwa sa estilo ni Juan. Pinananatili ng salin ang tensiyong ito at hindi nagpapasok ng mas tiyak na deterministikong paliwanag.
- issue: Kahulugan ng ἀκοή sa sipi mula sa Isaias
  choice: “aming ipinahayag” sa pangunahing teksto
  alternative: “aming ulat,” “aming mensahe,” o “aming narinig”
  rationale: Maaaring tumukoy ang salita sa narinig o sa nilalaman ng ipinahayag. Ang pangunahing salin ay natural at malinaw, habang itinatala sa talababa ang tunay na saklaw ng kahulugan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang tradisyonal ngunit malinaw na “bisig ng Panginoon,” samantalang ginawang mas natural ang pormulang “ang sinabi ni propeta Isaias.”
