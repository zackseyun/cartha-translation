    rationale: Ang “ang sinabi ni propeta Isaias” ay maaaring sumaklaw sa λόγος, ngunit hindi nito malinaw na naipapakita ang kasunod na pandiwang “sinabi niya” bago ang tuwirang sipi. Dapat itong isama para sa ganap na pagtutugma sa pinagmulan.
  - severity: medium
    issue: Ang “sa aming ipinahayag” ay hindi tumpak na katumbas ng τῇ ἀκοῇ ἡμῶν.
    rationale: Ang ἀκοή rito ay ulat, mensahe, o bagay na narinig; ang kasalukuyang parirala ay isang nominalized na kilos at hindi kasinglinaw o kasingnatural pagkatapos ng “naniwala sa.”
