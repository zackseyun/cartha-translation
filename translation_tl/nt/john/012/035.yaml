id: JHN.12.35
reference: John 12:35
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς· Ἔτι μικρὸν χρόνον τὸ φῶς ⸂ἐν ὑμῖν⸃ ἐστιν. περιπατεῖτε ⸀ὡς τὸ φῶς ἔχετε, ἵνα μὴ σκοτία ὑμᾶς καταλάβῃ, καὶ ὁ περιπατῶν ἐν τῇ σκοτίᾳ οὐκ οἶδεν ποῦ ὑπάγει.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/035.yaml
  text: So Jesus said to them[a], “The light is still among you for a little while. Walk while you have the light, so that darkness may not overtake you. The one who walks in the darkness does not know where he is going.”
translation:
  language: tl
  text: Kaya sinabi sa kanila ni Jesus, “Nasa gitna pa ninyo ang ilaw[a] sa maikling panahon. Lumakad kayo habang taglay ninyo ang ilaw, upang hindi kayo abutan ng kadiliman. Ang lumalakad sa kadiliman ay hindi nakaaalam kung saan siya pupunta.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kasama ninyo” o “sa inyo.” Maaaring unawain sa higit sa isang paraan ang pariralang Griyego; ngunit sa agarang konteksto, ang “nasa gitna ninyo” ay pinakaangkop sa kasalukuyang pampublikong presensiya ni Jesus.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Likas na pang-ugnay sa Filipino na nagdurugtong sa tugon ni Jesus sa naunang usapan nang hindi labis na pinatitindi ang lohikal na ugnayan.
- source_word: Ἔτι μικρὸν χρόνον
  choice: pa ... nang kaunting panahon
  rationale: Naipapahayag ang parehong diwa ng ἔτι at ang maikling nalalabing panahon sa natural na Filipino.
- source_word: τὸ φῶς
  choice: ang ilaw
  rationale: Pinananatili ang tuwirang larawan at ang bigat nito sa Ebanghelyo ni Juan, sa halip na ipaliwanag ito bilang tahasang pagtukoy kay Jesus.
- source_word: ἐν ὑμῖν
  choice: makakasama ... ninyo / nasa inyo
  rationale: Sa unang pangungusap, ang relasyonal na 'makakasama ninyo' ay malinaw at natural sa konteksto ng pansamantalang presensiya ng ilaw sa madla. Sa kasunod na sugnay, 'nasa inyo' ang nagpapanatili sa mas maluwag na larawan ng pagkakaroon nila ng ilaw.
- source_word: περιπατεῖτε
  choice: Lumakad kayo
  rationale: Pinananatili ang metapora ng paglakad, na nauunawaan din bilang paraan ng pamumuhay o pagkilos.
- source_word: ὡς
  choice: habang
  rationale: Binabasa bilang temporal sa pariralang 'habang nasa inyo ang ilaw,' na angkop sa apurahang tono.
- source_word: ἵνα μὴ
  choice: upang hindi
  rationale: Malinaw at likas na pagpapahayag ng layunin o pag-iwas sa Filipino.
- source_word: σκοτία
  choice: kadiliman
  rationale: Karaniwang marangal na katumbas na nagpapanatili sa mahalagang pagtatambis ng ilaw at kadiliman.
- source_word: καταλάβῃ
  choice: abutan
  rationale: Pinananatili ang larawan ng kadilimang humahabol at sumasapit sa isang taong naglalakad; mas natural ito sa Filipino kaysa sa literal na 'sakupin' sa kontekstong ito.
- source_word: ὁ περιπατῶν
  choice: Ang lumalakad
  rationale: Pinananatili ang pangkalahatang isahang anyo ng substantival participle sa maikli at natural na Filipino.
- source_word: οὐκ οἶδεν ποῦ ὑπάγει
  choice: hindi nakaaalam kung saan siya pupunta
  rationale: Natural na Filipino na nagpapanatili sa kawalan ng kaalaman tungkol sa patutunguhan.
theological_decisions:
- issue: Kahulugan ng ἐν ὑμῖν kaugnay ng 'ilaw'
  choice: makakasama pa ninyo
  alternative: nasa loob ninyo; nasa piling ninyo
  rationale: Ang konteksto ay tumutukoy sa nalalabing pampublikong presensiya ni Jesus bilang ilaw, kaya ang 'makakasama pa ninyo' ang pinakamalinaw na pangunahing salin. Gayunman, maaaring mangahulugan ang Griyego ng mas panloob o mas malawak na relasyonal na presensiya, kaya pinananatili sa talababa ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Pinanatili ang mga larawang 'ilaw,' 'lumakad,' at 'kadiliman.' Iniwasan ang sobrang literal na ayos na magiging alanganin sa Filipino, ngunit minarkahan ang tunay na kalabuan ng ἐν ὑμῖν.
