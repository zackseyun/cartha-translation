  text: διὰ τοῦτο οὐκ ἠδύναντο πιστεύειν ὅτι πάλιν εἶπεν Ἠσαΐας·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/039.yaml
  text: 'For this reason they were not able to believe, because Isaiah said again:'
translation:
  language: tl
  text: 'Dahil dito, hindi sila makapaniwala, sapagkat muling sinabi ni Isaias:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Dahil dito
  rationale: Tuwirang ipinapahayag ang sanhi at malinaw na iniuugnay ang pangungusap sa naunang konteksto.
- source_word: οὐκ ἠδύναντο πιστεύειν
  choice: hindi sila makapaniwala
  rationale: Natural na Tagalog para sa ipinahahayag na kawalan ng kakayahang maniwala; hindi ito pinahihinang maging ayaw lamang nilang maniwala.
- source_word: ὅτι
  choice: sapagkat
  rationale: Pinananatili ang sanhi o batayang ipinakikilala ng ὅτι, habang ang marangal na pang-ugnay ay angkop sa kasunod na sipi.
- source_word: πάλιν
  choice: rin
  rationale: Sa konteksto, nagpapakilala ito ng isa pang sinabi o sipi mula kay Isaias; mas natural dito ang “rin” kaysa sa literal na “muli.”
- source_word: εἶπεν
  choice: sinabi
  rationale: Karaniwan at tumpak na panimula sa isang tuwirang sipi.
- source_word: Ἠσαΐας
  choice: Isaias
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa modernong saling Bibliya sa Filipino.
theological_decisions:
- issue: Ang kalikasan ng kawalan nila ng kakayahang maniwala
  choice: hindi sila makapaniwala
  alternative: ayaw nilang maniwala
  rationale: Ang Griyego ay tahasang nagsasaad ng kawalan ng kakayahan, hindi lamang ng pagtanggi o kawalan ng kagustuhan. Hindi ipinapaliwanag ng salin kung paano nauugnay rito ang pagpapatigas ng Diyos at pananagutan ng tao, kaya nananatili ang teolohikal na tensiyon ng teksto.
- issue: Ugnayan ng ὅτι sa kawalan ng kakayahan at sa kasunod na sipi
  choice: sapagkat
  alternative: na
  rationale: Mas malamang na sanhi o batayan ang ipinakikilala rito kaysa simpleng nilalaman ng sinabi ni Isaias. Pinananatili ng “sapagkat” ang lohikal na ugnayan nang hindi nagdaragdag ng paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “makapaniwala” bilang likas na pagpapahayag ng kakayahan at ang “sapagkat” upang malinaw ang pangangatwirang humahantong sa kasunod na sipi.
