id: JHN.12.1
reference: John 12:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ὁ οὖν Ἰησοῦς πρὸ ἓξ ἡμερῶν τοῦ πάσχα ἦλθεν εἰς Βηθανίαν, ὅπου ἦν ⸀Λάζαρος, ὃν ἤγειρεν ἐκ νεκρῶν ⸀Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/001.yaml
  text: So Jesus came to Bethany six days before the Passover[a], where Lazarus was, whom Jesus had raised from the dead.
translation:
  language: tl
  text: Kaya, anim na araw bago ang Paskuwa, pumunta si Jesus sa Betania, kung saan naroon si Lazaro, na ibinangon ni Jesus mula sa mga patay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mula sa gitna ng mga patay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Pinananatili ang ugnayang pasalaysay at lohikal sa naunang konteksto nang natural sa makabagong Tagalog.
- source_word: πρὸ ἓξ ἡμερῶν τοῦ πάσχα
  choice: anim na araw bago ang Paskuwa
  rationale: Natural na paglalahad ng panahong tinutukoy ng idyomang Griyego; ang “Paskuwa” ay karaniwang tawag sa kapistahang Judio.
- source_word: ἦλθεν εἰς Βηθανίαν
  choice: pumunta si Jesus sa Betania
  rationale: Ang “pumunta” ay natural sa Tagalog para sa kilos patungo sa lugar, nang hindi idinaragdag ang di-tiyak na diwang “dumating.”
- source_word: ὅπου ἦν Λάζαρος
  choice: kung saan naroon si Lazaro
  rationale: Pinananatili ang payak na lokatibong pahayag nang hindi ipinapalagay kung doon siya nakatira o pansamantalang nanunuluyan.
- source_word: ἤγειρεν
  choice: ibinangon
  rationale: Ang pandiwang ito ay angkop sa konteksto ng muling pagbuhay at malinaw na tumutukoy sa naunang ginawa ni Jesus kay Lazaro.
- source_word: ἐκ νεκρῶν
  choice: mula sa mga patay
  rationale: Pinananatili ang maramihang anyo at ang diwang pagbangon mula sa kalipunan ng mga patay, habang nananatiling natural sa Tagalog.
theological_decisions:
- issue: Wika ng muling pagbuhay kay Lazaro
  choice: na ibinangon ni Jesus mula sa mga patay
  alternative: na ibinangon niya mula sa mga patay
  rationale: Inuulit ng tekstong Griyego ang pangalang Ἰησοῦς; kaya inuulit din ang “Jesus” upang malinaw at tapat na tukuyin kung sino ang bumangon kay Lazaro.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino Tagalog. Ginamit ang “Paskuwa” at ang karaniwang baybay na “Betania” at “Lazaro.”
