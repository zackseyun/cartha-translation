id: JHN.12.30
reference: John 12:30
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸂Ἰησοῦς καὶ εἶπεν⸃· Οὐ δι’ ἐμὲ ⸂ἡ φωνὴ αὕτη⸃ γέγονεν ἀλλὰ δι’ ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/030.yaml
  text: Jesus answered and said[a], “This voice has not come for my sake, but for yours.”
translation:
  language: tl
  text: Sumagot si Jesus at sinabi, “Ang tinig na ito ay hindi dumating para sa akin kundi para sa inyo.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ang tinig na ito ay nangyari hindi dahil sa akin kundi dahil sa inyo.” Maaari ring ipakahulugan bilang sanhi ang pang-ukol sa Griyego, bagaman mas pinapaboran ng konteksto ang diwang “para sa kapakanan ng.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: Sumagot
  rationale: Karaniwang salaysay na katumbas ng ἀποκρίνομαι sa isang pag-uusap at natural sa modernong Tagalog.
- source_word: εἶπεν
  choice: at sinabi
  rationale: Pinananatili ang dalawang pandiwa sa pormulang ἀπεκρίθη ... καὶ εἶπεν nang hindi binabago ang tungkulin nito sa salaysay.
- source_word: φωνή
  choice: tinig
  rationale: Tumutukoy ito sa makalangit na pahayag na narinig sa konteksto; mas tiyak ang “tinig” kaysa “tunog.”
- source_word: γέγονεν
  choice: dumating
  rationale: Ipinahihiwatig ng ganap na anyo ng γίνομαι ang pagdating o pangyayari ng tinig at ang nananatiling kabuluhan nito; natural na kaagapay ng “tinig” ang “dumating” sa Tagalog.
- source_word: δι’ ἐμέ
  choice: para sa akin
  rationale: 'Binabasa ang διά na may akusatibo bilang layon o kapakinabangan: hindi para sa kapakanan ni Jesus ang tinig.'
- source_word: δι’ ὑμᾶς
  choice: para sa inyo
  rationale: Pinananatili ang tuwirang paralelismo at pagsalungat sa “para sa akin,” na tumutukoy sa kapakinabangan ng mga nakikinig.
- source_word: Οὐ ... ἀλλὰ
  choice: hindi ... kundi
  rationale: Likas at tuwirang ipinapahayag sa Tagalog ang mariing pagsalungat ng Griyego.
theological_decisions:
- issue: Layunin ng makalangit na tinig
  choice: Ang tinig ay dumating hindi para sa kapakanan ni Jesus kundi para sa kapakanan ng mga nakapaligid na nakikinig.
  alternative: Nangyari ang tinig dahil kay Jesus, ngunit nakalaan ito sa mga tao.
  rationale: Sa kontekstong ito, pinakamalamang na ang διά na may akusatibo sa magkaparis na parirala ay nagpapahayag ng layon o kapakinabangan. Hindi na dinaragdagan ng salin ang sinabi tungkol sa pangangailangan ni Jesus ng pagpapatibay, at kinikilala sa talababa ang posibleng pagbasa bilang sanhi.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Pinanatili ang pormulang “Sumagot ... at sinabi” upang katawanin ang dalawang pandiwa sa Griyego, at ginamit ang malinaw na paralelismong “para sa akin ... para sa inyo.”
