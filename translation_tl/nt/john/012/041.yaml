id: JHN.12.41
reference: John 12:41
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ταῦτα εἶπεν Ἠσαΐας ⸀ὅτι εἶδεν τὴν δόξαν αὐτοῦ, καὶ ἐλάλησεν περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/041.yaml
  text: Isaiah said these things because he saw his glory and spoke about him[a].
translation:
  language: tl
  text: Sinabi ni Isaias ang mga bagay na ito dahil nakita niya ang kanyang kaluwalhatian at nagsalita tungkol sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sinabi ni Isaias ang mga bagay na ito dahil nakita niya ang kaluwalhatian ng Diyos at nagsalita tungkol sa kanya.” Sa konteksto ni Juan, malamang na tumutukoy kay Jesus ang mga panghalip, ngunit sa mas malawak na konteksto ng Isaias ay pangitain ito tungkol sa kaluwalhatian ng Panginoon (Isa. 6:1).
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: ang mga bagay na ito
  rationale: Tumutukoy ang panghalip na maramihan sa naunang mga pahayag na sinipi mula kay Isaias.
- source_word: εἶπεν
  choice: sinabi
  rationale: Likas na salin ng aorist na λέγω at naipag-iiba ito sa ἐλάλησεν sa hulihan ng talata.
- source_word: Ἠσαΐας
  choice: Isaias
  rationale: Karaniwang anyo sa Filipino ng pangalan ng propeta.
- source_word: ὅτι
  choice: dahil
  rationale: Pinakanatural dito bilang panandang nagbibigay ng dahilan kung bakit sinabi ni Isaias ang mga bagay na ito; posible rin sa balarila ang 'na,' ngunit hindi iyon ang pinakamalinaw sa konteksto.
- source_word: εἶδεν
  choice: nakita
  rationale: Tuwirang salin ng aorist ng ὁράω.
- source_word: τὴν δόξαν αὐτοῦ
  choice: ang kanyang kaluwalhatian
  rationale: Pinananatili ng 'kaluwalhatian' ang bigat ng δόξα sa Juan, at ng 'kanyang' ang tunay na kalabuan ng panghalip sa mismong pangungusap.
- source_word: ἐλάλησεν
  choice: nagsalita
  rationale: Likas na salin ng λαλέω at bahagyang pinananatili ang pagkakaiba nito sa naunang εἶπεν.
- source_word: περὶ αὐτοῦ
  choice: tungkol sa kanya
  rationale: Natural na modernong Filipino para sa περί na may genitive, habang hindi tahasang pinapangalanan ang tinutukoy ng panghalip.
theological_decisions:
- issue: Tinutukoy ng dalawang αὐτοῦ ('kanyang/kanya')
  choice: Pinanatili sa pangunahing teksto ang mga panghalip; sa konteksto ni Juan, malamang na si Jesus ang tinutukoy.
  alternative: Maaaring unawain ang mga panghalip bilang tumutukoy sa Diyos/sa Panginoon, ayon sa mas malawak na tagpo ng Isaias 6.
  rationale: Iniuugnay ng agarang konteksto ng Juan 12:37–41 ang sipi sa pagtugon ng mga tao kay Jesus, ngunit ang pinagmulang pangitain sa Isaias 6 ay tungkol sa kaluwalhatian ng Panginoon. Pinananatili ng salin at talababa ang tensiyong ito sa halip na tahasang lutasin ito sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang 'Isaias' bilang pamilyar na anyong Filipino; iniwasan ang tahasang paglalagay ng 'Jesus' o 'Diyos' sa pangunahing teksto upang mapanatili ang anyong panghalip at ang interpretatibong tensiyon ng pinagmulan.
