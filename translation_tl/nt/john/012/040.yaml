  text: Τετύφλωκεν αὐτῶν τοὺς ὀφθαλμοὺς καὶ ⸀ἐπώρωσεν αὐτῶν τὴν καρδίαν, ἵνα μὴ ἴδωσιν τοῖς ὀφθαλμοῖς καὶ νοήσωσιν τῇ καρδίᾳ καὶ ⸀στραφῶσιν, καὶ ⸀ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/040.yaml
  text: He has blinded their eyes and hardened their heart[a], so that they may not see with their eyes and understand with their heart and turn[c][b], and I would heal them.
translation:
  language: tl
  text: Binulag niya ang kanilang mga mata at pinatigas ang kanilang puso, upang hindi sila makakita sa kanilang mga mata, makaunawa sa kanilang puso, at manumbalik[a][b], at pagagalingin ko sila.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magbalik-loob.”
    reason: lexical_alternative
  - marker: b
    text: Ang linyang ito ay umaalingawngaw sa Isaias 6:10.
    reason: cross_reference
  - marker: c
    text: 'Ang Griyego ay nasa anyong panghinaharap: “pagagalingin ko sila.” Dahil sa pagkakaugnay nito sa naunang sugnay, maaari rin itong unawain bilang “at pagalingin ko sana sila.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τετύφλωκεν
  choice: Binulag niya
  rationale: Ipinahahayag ng perpektong panahunan ang isang naganap na pagkilos na may nananatiling bunga. Natural sa Tagalog ang “binulag niya,” at malinaw pa rin sa konteksto ang kalagayang ibinunga nito.
- source_word: ἐπώρωσεν
  choice: pinatigas
  rationale: Pinananatili ng “pinatigas” ang larawan ng pagiging manhid o hindi tumutugon, pati ang mabigat na pahiwatig ng paghatol sa sipi mula sa Isaias.
- source_word: καρδίαν / καρδίᾳ
  choice: puso
  rationale: Saklaw ng “puso” sa biblikal na gamit ang pag-iisip at panloob na pagkatao; nililinaw ng pandiwang “makaunawa” ang aspektong pangkaisipan.
- source_word: ἵνα μὴ
  choice: upang hindi
  rationale: Natural itong pahayag ng layunin o kinalabasan sa Tagalog at hindi nito nilulutas ang likas na tensiyon sa sipi.
- source_word: ἴδωσιν τοῖς ὀφθαλμοῖς
  choice: makakita sa pamamagitan ng kanilang mga mata
  rationale: Pinananatili ang kongkretong larawan at ang pagkakapantay ng estruktura sa kasunod na pahayag tungkol sa puso.
- source_word: νοήσωσιν
  choice: makaunawa
  rationale: Tumpak at karaniwang salita ito para sa mental na pagkaunawa o pag-unawa.
- source_word: στραφῶσιν
  choice: manumbalik
  rationale: Ipinahahayag nito ang pagtalikod mula sa dating landas at pagbabalik nang hindi ipinapasok sa pangunahing teksto ang mas tiyak at eklesyastikong salitang “makumberte.”
- source_word: ἰάσομαι
  choice: pagagalingin ko
  rationale: Tahasang pinananatili ang anyong panghinaharap ng Griyego. Ang posibleng kondisyunal na ugnayan nito sa naunang sugnay ay ipinaliliwanag sa talababa.
- source_word: αὐτῶν τὴν καρδίαν
  choice: ang kanilang puso
  rationale: Pinananatili ang isahang bilang ng Griyego, na may kolektibong diwa para sa pangkat.
theological_decisions:
- issue: Ang Diyos bilang gumagawa ng pagbubulag at pagpapatigas
  choice: 'Pinanatili ang tahasang isahang simuno: “Binulag niya… at pinatigas…”'
  alternative: Gumamit ng balintiyak o di-tiyak na pananalita upang palambutin ang banal na pagkilos
  rationale: Tahasang iniuugnay ng Griyego sa isang simuno ang dalawang pagkilos. Dapat manatili ang teolohikal na tensiyon ng paghatol sa halip na pahinain ito.
- issue: Kahulugan ng στραφῶσιν bilang pagbabalik o conversion
  choice: “manumbalik” sa pangunahing teksto
  alternative: “magbalik-loob” o “makumberte”
  rationale: Mas malawak ang pandiwang Griyego kaysa sa isang teknikal na doktrinal na pormulasyon. Pinananatili ng “manumbalik” ang larawan ng pagbalik, habang inilalagay sa talababa ang mas interpretatibong alternatibo.
- issue: Anyo at ugnayan ng ἰάσομαι
  choice: “pagagalingin ko sila”
  alternative: “mapagaling ko sila”
  rationale: Ang pangunahing teksto ay sumusunod sa panghinaharap na anyo ng Griyego. Gayunman, maaaring unawain ang huling parirala bilang nakasalalay sa naunang layunin o kinalabasan, kaya itinala ang alternatibo.
translation_notes:
  register: Makabago at marangal na Filipino, na may payak na sintaks at pamilyar na bokabularyo. Pinanatili ang isahang “puso” bilang kolektibo, ang tahasang banal na pagkilos, at ang tensiyon sa huling sugnay. Ginamit ang “sa pamamagitan ng” upang maipakita ang magkatulad na pariralang instrumental ng Griyego, bagaman bahagya itong mas pormal kaysa sa pang-araw-araw na pananalita.
