  naturalness: Marangal at malinaw ang salin. Mas natural at mas tuwiran ang “sa kanilang mga mata/puso” kaysa sa paulit-ulit na “sa pamamagitan ng,” habang nananatili ang instrumental na paralelismo ng Griyego.
