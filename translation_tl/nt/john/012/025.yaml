base_translation:
  language: en
  yaml_path: translation/nt/john/012/025.yaml
  text: The one who loves his life loses it[b][a], and the one who hates his life in this world will keep it for eternal life.
translation:
  language: tl
  text: Ang umiibig sa kanyang buhay ay mawawalan nito, at ang napopoot sa kanyang buhay sa mundong ito ay iingatan ito para sa buhay na walang hanggan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “napopoot sa kanyang buhay” ay sinadyang kabalintunaan tungkol sa hindi pagkapit sa sariling buhay sa mundong ito; hindi nito itinuturo ang pagkamuhi sa sarili. Ang salitang Griyego para sa “buhay” ay maaari ring mangahulugang “sarili” o “kaluluwa,” ayon sa konteksto.
    reason: lexical_alternative_and_paradox_clarification
lexical_decisions:
- source_word: ὁ φιλῶν
  choice: ang umiibig
  rationale: Ang artikulong may pangkasalukuyang pandiwaring ginamit bilang pangngalan ay nagpapahayag ng pangkalahatang tao; natural at marangal sa Tagalog ang “ang umiibig.”
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: sa sarili niyang buhay
  rationale: Sa kontekstong ito, ang ψυχή ay tumutukoy sa sariling buhay o sarili na maaaring mawala o maingatan; ang “buhay” ay mas angkop kaysa “kaluluwa,” habang nililinaw ng “sarili niyang” ang pagmamay-ari.
- source_word: ἀπολλύει αὐτήν
  choice: ay mawawalan nito
  rationale: Bagaman pangkasalukuyan ang anyong Griyego, natural na ipinahahayag sa Tagalog ng “mawawalan” ang tiyak na bunga ng pagkapit sa sariling buhay at pinananatili nito ang pagtutol sa “mag-iingat.”
- source_word: ὁ μισῶν
  choice: ang napopoot
  rationale: Pinananatili ang matinding μισέω at ang sinadyang kabalintunaan sa halip na palambutin bilang “hindi gaanong umiibig.”
- source_word: ἐν τῷ κόσμῳ τούτῳ
  choice: sa mundong ito
  rationale: Direkta at natural itong salin ng pariralang naglilimita sa tinutukoy na pagkapoot sa buhay sa kasalukuyang kaayusan ng mundo.
- source_word: φυλάξει αὐτήν
  choice: ay mag-iingat nito
  rationale: Ang “mag-iingat” ay nagpapanatili sa ideya ng pagbabantay o pag-iingat sa φυλάσσω at sa hinaharap na anyo nito, nang hindi ginagawang teknikal ang wika.
- source_word: εἰς ζωὴν αἰώνιον
  choice: para sa buhay na walang hanggan
  rationale: Ipinahahayag ng “para sa” ang layon o hantungan ng εἰς, at karaniwan at malinaw sa modernong Tagalog ang “buhay na walang hanggan.”
theological_decisions:
- issue: Kahulugan ng “napopoot sa sarili niyang buhay”
  choice: Pinanatili ang matinding pananalitang “napopoot” bilang pagtanggi sa pagkapit sa sariling buhay sa mundong ito.
  alternative: “Hindi gaanong umiibig sa sariling buhay” o “hindi inuuna ang sariling buhay.”
  rationale: Tahasang μισέω ang ginamit ng Griyego. Dapat manatili sa pangunahing teksto ang retorikal at teolohikal na tensiyon; ang pariralang “sa mundong ito” ang nagpapakitang hindi ito pag-uutos ng pagkamuhi sa sarili.
- issue: Kahulugan ng ψυχή
  choice: “buhay” sa dalawang sugnay
  alternative: “kaluluwa” o “sarili”
  rationale: Ang pagkawala at pag-iingat ay tumutukoy rito sa buhay o sarili ng tao, hindi kinakailangang sa isang hiwalay na di-materyal na kaluluwa. Iniiwasan ng “buhay” ang pagpasok ng antropolohiyang hindi tahasang hinihingi ng talata.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang magkatapat na “umiibig” at “napopoot,” pati ang kabalintunaan ng talata, habang iniwasan ang mas teknikal o tradisyonal na “kaluluwa” sa pangunahing teksto.
