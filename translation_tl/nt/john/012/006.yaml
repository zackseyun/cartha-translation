base_translation:
  language: en
  yaml_path: translation/nt/john/012/006.yaml
  text: He said this not because he cared about the poor[a], but because he was a thief, and having the money box[b], he used to take what was put into it.
translation:
  language: tl
  text: Sinabi niya ito, hindi dahil nagmamalasakit siya sa mga dukha, kundi dahil magnanakaw siya at may hawak siyang kahon ng salapi[a], at kinukuha niya ang mga inilalagay rito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “supot ng salapi” o “lagayan ng salapi.” Ang salitang Griyego ay tumutukoy sa isang sisidlang pinaglalagyan ng salapi.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “dinadala niya” o, ayon sa konteksto, “ninanakaw niya ang mga inilalagay rito.” Karaniwang nangangahulugang “magdala” o “magpasan” ang pandiwang Griyego, ngunit ipinahihiwatig dito ng paglalarawan sa kaniya bilang magnanakaw ang maling pagkuha.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν δὲ τοῦτο
  choice: Sinabi niya ito
  rationale: Tuwirang isinasalin ang pandiwa at panghalip; banayad lamang ang dugtong na δέ at hindi kailangang gawing tahasang panandang temporal o matinding pagsalungat sa Filipino.
- source_word: οὐχ ὅτι περὶ τῶν πτωχῶν ἔμελεν αὐτῷ
  choice: hindi dahil nagmamalasakit siya sa mga dukha
  rationale: Likas na Filipino ang “hindi dahil” para sa itinatangging dahilan, at malinaw na ipinahahayag ng “nagmamalasakit” ang personal na pagkabahalang tinutukoy ng μέλει.
- source_word: ἀλλ’ ὅτι κλέπτης ἦν
  choice: kundi dahil magnanakaw siya
  rationale: Pinananatili ng “kundi dahil” ang pagtutuwid sa tunay na dahilan; ang κλέπτης ay taong palihim na nagnanakaw, kaya “magnanakaw” ang angkop.
- source_word: τὸ γλωσσόκομον ἔχων
  choice: Siya ang may hawak ng kahon ng salapi
  rationale: Ang γλωσσόκομον ay sisidlang ginagamit sa salapi, at ipinahihiwatig ng ἔχων na nasa kaniyang pag-iingat o pamamahala ito. Ang buong sugnay ang mas natural kaysa literal na pariralang participial sa Filipino.
- source_word: τὰ βαλλόμενα
  choice: ang mga inilalagay rito
  rationale: Ipinananatili ang pasibong diwa ng participle; idinagdag ang “rito” upang maging malinaw sa Filipino na sa sisidlan inilalagay ang mga bagay o salapi.
- source_word: ἐβάσταζεν
  choice: kinukuha niya
  rationale: Maaaring mangahulugan ang βαστάζω ng pagdadala, ngunit sa tahasang kontekstong “magnanakaw siya,” ipinahihiwatig nito ang paulit-ulit na pagkuha o paglustay. Ang aspektong di-ganap ng imperfect ay likas na naipahahayag ng “kinukuha niya.”
theological_decisions:
- issue: Kung ang ἐβάσταζεν ay simpleng pagdadala o maling pagkuha sa laman ng sisidlan
  choice: kinukuha niya ang mga inilalagay rito
  alternative: dinadala niya ang mga inilalagay rito; ninanakaw niya ang mga inilalagay rito
  rationale: Malakas na itinuturo ng agarang pahayag na “magnanakaw siya” ang maling pagkuha, hindi lamang ang tungkuling magdala. Gayunman, hindi ginawang “ninanakaw” ang mismong pandiwa sa pangunahing teksto upang mapanatili ang saklaw at tensiyong leksikal ng βαστάζω.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “mga dukha” bilang dignified ngunit karaniwang katawagan, at hinati sa dalawang pangungusap upang maging natural ang mahaba at participial na kayarian ng Griyego nang hindi binabago ang lohika nito.
