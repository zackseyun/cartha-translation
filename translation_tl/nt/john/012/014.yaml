  terminology: Ang “batang asno” ay katanggap-tanggap na modernong Filipino para sa ὀνάριον, habang ang talababa ay maayos na nagpapanatili ng posibilidad na simpleng diminutibo ito at hindi ganap na pagtukoy sa edad.
