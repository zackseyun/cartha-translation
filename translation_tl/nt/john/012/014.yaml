base_translation:
  language: en
  yaml_path: translation/nt/john/012/014.yaml
  text: 'Then Jesus[a], having found a young donkey, sat on it, just as it is written:'
translation:
  language: tl
  text: 'Matapos makatagpo si Jesus ng isang batang asno[a], umupo siya sa ibabaw nito, gaya ng nasusulat:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang munting asno.” Ang salitang Griyego na ὀνάριον ay tumutukoy sa isang asno, na madalas ay bata pa.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρὼν
  choice: Pagkatapos makakita
  rationale: Ipinahahayag ang aksiyong nauna sa pangunahing pandiwang ἐκάθισεν, habang pinananatiling natural ang pagkakasunod ng pangyayari sa Filipino.
- source_word: δὲ
  choice: Pagkatapos
  rationale: Mahinang pang-ugnay ito na nagpapatuloy sa salaysay, hindi nagpapahiwatig ng mariing pagsalungat. Naisasama ang tungkuling pasalaysay nito sa pariralang “Pagkatapos makakita.”
- source_word: ὀνάριον
  choice: isang batang asno
  rationale: Ang diminutibong ουδέτερο na ὀνάριον ay tumutukoy sa asno, at madalas sa isang batang asno. Malinaw at likas ito sa modernong Filipino nang hindi nagdaragdag ng higit na katiyakan kaysa sa Griyego.
- source_word: ἐκάθισεν ἐπ’ αὐτό
  choice: umupo siya rito
  rationale: Tuwirang pinananatili ang diwa ng pag-upo sa hayop; iniiwasan ang mas interpretatibong “sinakyan.” Ang “rito” ay natural na tumutukoy sa malapit na binanggit na asno.
- source_word: καθώς ἐστιν γεγραμμένον
  choice: gaya ng nasusulat
  rationale: Karaniwang pormula ito sa pagpapakilala ng sipi mula sa Kasulatan. Pinananatili ng “gaya” ang paghahambing ng καθώς, at ng “nasusulat” ang nananatiling bisa ng nakasulat.
- source_word: ὁ Ἰησοῦς
  choice: si Jesus
  rationale: Ang pantukoy na si ang likas na pananda sa personal na pangalan sa Filipino; hindi kailangang tularan nang mekanikal ang artikulong Griyego.
theological_decisions:
- issue: Ugnayan ng ginawa ni Jesus sa sipi mula sa Kasulatan
  choice: Inilalahad ang ginawa ni Jesus bilang kaayon ng nasusulat, nang hindi tahasang sinasabing sinadya niyang isadula ang propesiya.
  alternative: Isalin nang mas malaya upang ipahiwatig ang sinadyang pagtupad o pagsasadula ng propesiya.
  rationale: Binabanggit ng talata ang ginawa ni Jesus at saka ipinakikilala ang sipi sa pormulang “gaya ng nasusulat.” Ipinakikita nito ang pagkakatugma sa propesiya ngunit hindi nito tahasang ipinapahayag ang motibo ni Jesus.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “asno” bilang karaniwang terminong biblikal ngunit nauunawaan pa rin sa kasalukuyan; pinanatiling maikli ang pormula ng pagsipi na “gaya ng nasusulat.”
