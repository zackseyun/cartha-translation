id: JHN.12.27
reference: John 12:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Νῦν ἡ ψυχή μου τετάρακται, καὶ τί εἴπω; πάτερ, σῶσόν με ἐκ τῆς ὥρας ταύτης. ἀλλὰ διὰ τοῦτο ἦλθον εἰς τὴν ὥραν ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/027.yaml
  text: Now my soul is troubled[a], and what should I say? Father, save me from this hour. But for this reason I came to this hour.
translation:
  language: tl
  text: Ngayon ay nababagabag ang kaluluwa ko, at ano ang sasabihin ko? Ama, iligtas mo ako mula sa oras na ito.[a] Ngunit dahil dito ay dumating ako sa oras na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Ano ang sasabihin ko? ‘Ama, iligtas mo ako mula sa oras na ito’?” Maaari ring basahin ang Griyego bilang isang retorikal na tanong sa halip na isang tuwirang kahilingan.
    reason: alternative_reading
lexical_decisions:
- source_word: Νῦν
  choice: Ngayon
  rationale: Tuwirang ipinahahayag ang kasalukuyan at agarang pagkabagabag ni Jesus.
- source_word: ψυχή
  choice: kaluluwa
  rationale: Pinananatili ang karaniwang katumbas na may bigat at tumutukoy rito sa panloob na pagkatao o buhay ni Jesus, nang hindi ito nililimitahan sa damdamin lamang.
- source_word: τετάρακται
  choice: nababagabag
  rationale: Likas sa modernong Tagalog at ipinahahayag ang nagpapatuloy na kalagayan ng matinding panloob na ligalig na bunga ng pagkayanig.
- source_word: τί εἴπω
  choice: ano ang sasabihin ko?
  rationale: Ipinahahayag ang deliberatibong tanong sa malinaw at likas na Tagalog nang hindi dinaragdagan ang kahulugan.
- source_word: πάτερ
  choice: Ama
  rationale: Likas at marangal na tuwirang pagtawag sa Diyos.
- source_word: σῶσόν με ἐκ τῆς ὥρας ταύτης
  choice: iligtas mo ako mula sa oras na ito
  rationale: Pinananatili ang pakiusap na mailigtas mula sa nalalapit na pagsubok at ang mahalagang larawang Johannine ng “oras.”
- source_word: ὥρα
  choice: oras
  rationale: Pinananatili ang mahalagang katawagan sa Juan para sa itinakdang panahon ng pagdurusa, kamatayan, at pagluluwalhati ni Jesus.
- source_word: ἀλλὰ διὰ τοῦτο
  choice: Ngunit dahil dito
  rationale: Pinananatili ang pagsalungat at ang sadyang bahagyang maluwag na ugnayang sanhi o layunin ng parirala.
- source_word: ἦλθον εἰς τὴν ὥραν ταύτην
  choice: dumating ako sa oras na ito
  rationale: Malapit sa anyong Griyego at hindi ginagawang tahasang “para sa oras na ito” ang εἰς, bagaman ipinahihiwatig ng konteksto ang layunin.
theological_decisions:
- issue: Kung ang “Ama, iligtas mo ako mula sa oras na ito” ay tuwirang kahilingan o bahagi ng retorikal na tanong
  choice: 'Isinalin bilang tuwirang panalangin: “Ama, iligtas mo ako mula sa oras na ito.”'
  alternative: 'Basahin bilang retorikal: “Ano ang sasabihin ko? ‘Ama, iligtas mo ako mula sa oras na ito’?”'
  rationale: Walang orihinal na bantas ang pinakamaagang mga manuskrito, kaya kapuwa posible ang dalawang pagbasa. Sinusunod ng pangunahing teksto ang bantas ng SBLGNT bilang tuwirang pakiusap, habang pinananatili sa talababa ang retorikal na pagbasa at ang tunay na tensiyon sa pagitan ng pagkabagabag ni Jesus at ng pagtanggap niya sa kaniyang itinakdang oras.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang “kaluluwa” at “oras” dahil mahalaga ang bigat at ugnayang pampanitikan ng mga ito sa Ebanghelyo ni Juan; ang bantas at talababa ay nagpapanatili sa tunay na kalabuan ng Griyego.
