  source_fidelity: 'Tumpak na naihahatid ng salin ang mga pangunahing elemento ng Griyego: ang kasalukuyang pagkabagabag (Νῦν ... τετάρακται), ang deliberatibong tanong, ang tuwirang pagtawag na “Ama,” ang pakiusap na maligtas mula sa “oras,” at ang kasunod na pahayag kung bakit siya dumating sa oras na iyon. Ang “oras” ay wastong pinanatili sa magkabilang paglitaw upang mapanatili ang motibong Johannine.'
  naturalness: Likas, malinaw, at marangal ang modernong Filipino Tagalog. Ang “Ngayon ay nababagabag ang kaluluwa ko” at “Ama, iligtas mo ako mula sa oras na ito” ay madaling maunawaan habang nananatiling angkop sa rehistro ng talata.
  terminology: Ang “kaluluwa,” “Ama,” “iligtas,” at “oras” ay magkakatugma sa kahulugan at rehistro ng pinagmulan. Hindi pinalalabis ng “Ngunit dahil dito ay dumating ako sa oras na ito” ang εἰς upang gawing tahasang “para sa,” bagaman nananatili ang ipinahihiwatig na layunin.
