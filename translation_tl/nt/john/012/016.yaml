reference: John 12:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀ταῦτα οὐκ ἔγνωσαν ⸂αὐτοῦ οἱ μαθηταὶ⸃ τὸ πρῶτον, ἀλλ’ ὅτε ἐδοξάσθη Ἰησοῦς τότε ἐμνήσθησαν ὅτι ταῦτα ἦν ἐπ’ αὐτῷ γεγραμμένα καὶ ταῦτα ἐποίησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/016.yaml
  text: His disciples did not understand these things at first[a], but when Jesus was glorified[c][b], then they remembered that these things had been written about him and that they had done these things to him.
translation:
  language: tl
  text: Noong una, hindi naunawaan ng kaniyang mga alagad ang mga bagay na ito.[a] Ngunit nang niluwalhati si Jesus,[b] saka nila naalaala na nakasulat ang mga bagay na ito tungkol sa kaniya[c] at ginawa nila sa kaniya ang mga bagay na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi nalaman ang mga bagay na ito noong una.”
    reason: lexical_alternative
  - marker: b
    text: Sa Ebanghelyo ni Juan, ang “niluwalhati” ay karaniwang tumutukoy sa pagluwalhati kay Jesus na kaugnay ng kaniyang kamatayan, muling pagkabuhay, at pagtataas.
    reason: cross_reference
  - marker: c
    text: O “naisulat na ang mga ito tungkol sa kaniya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνωσαν
  choice: hindi naunawaan
  rationale: Sa konteksto, hindi lamang sila walang alam; hindi pa nila nauunawaan ang kahulugan ng mga pangyayari. Likas sa modernong Tagalog ang “hindi naunawaan” at nananatili itong tapat sa saklaw ng γινώσκω.
- source_word: αὐτοῦ οἱ μαθηταί
  choice: kanyang mga alagad
  rationale: Likas na ipinahahayag ng panghalip na nasa genitive ang kaugnayan o pag-aari; ito ang malinaw at karaniwang ayos sa Tagalog.
- source_word: τὸ πρῶτον
  choice: sa simula
  rationale: Ipinahahayag nito ang temporal na diwang “noong una” o “sa simula,” hindi ang bilang o unang pagkakataon.
- source_word: ἐδοξάσθη
  choice: niluwalhati
  rationale: Pinananatili ng “niluwalhati” ang mabigat at maraming-saping diwa ng δοξάζω sa Juan, sa halip na paliitin ito sa “pinarangalan” lamang.
- source_word: ἐμνήσθησαν
  choice: naalaala nila
  rationale: Natural na aktibong anyo ito sa Tagalog para sa deponent/passive-form na pandiwa at malinaw na sumusunod sa pagkakasunod ng salaysay.
- source_word: ἐπ’ αὐτῷ γεγραμμένα
  choice: naisulat tungkol sa kanya
  rationale: Ang ἐπί na may dative rito ay tumutukoy sa paksa—“tungkol sa kanya”—at hindi sa lokasyong “sa ibabaw niya.” Ipinahihiwatig ng “naisulat” na nauna na ang pagkakasulat sa kanilang pagkaalaala.
- source_word: ταῦτα ἐποίησαν αὐτῷ
  choice: ginawa nila sa kanya ang mga bagay na ito
  rationale: Pinananatili ang di-tiyak na paksa ng pandiwang pangmaramihan at ang αὐτῷ bilang “sa kanya,” nang hindi ipinapasok kung sino mismo ang tinutukoy ng “nila.”
- source_word: ταῦτα
  choice: ang mga bagay na ito
  rationale: Pinananatili ang paulit-ulit na pangmaramihang demonstratibo na tumutukoy sa kabuuan ng mga kilos at detalyeng isinalaysay.
theological_decisions:
- issue: Ang kahulugan ng pagluwalhati kay Jesus sa konteksto ng Juan
  choice: Panatilihin ang “niluwalhati” nang hindi tinutukoy nang makitid ang saklaw nito.
  alternative: “itinaas” o “pinarangalan”
  rationale: Sa Juan, ang pagluwalhati kay Jesus ay may masalimuot na kaugnayan sa kanyang kamatayan, muling pagkabuhay, at pagtataas. Hindi nilulutas ng salin ang sadyang malawak na teolohikal na diwa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at likas basahin. Pinanatili ang pag-uulit ng “ang mga bagay na ito,” ang teolohikal na bigat ng “niluwalhati,” at ang hindi tinukoy na gumagawa sa huling sugnay.
