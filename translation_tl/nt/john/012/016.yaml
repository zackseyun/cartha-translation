revisions:
- from: Sa simula ay hindi naunawaan ng kanyang mga alagad ang mga bagay na ito,[a] ngunit nang niluwalhati si Jesus,[b] saka nila naalaala na ang mga bagay na ito ay naisulat tungkol sa kanya at ginawa nila sa kanya ang mga bagay na ito.
  to: Noong una, hindi naunawaan ng kaniyang mga alagad ang mga bagay na ito.[a] Ngunit nang niluwalhati si Jesus,[b] saka nila naalaala na nakasulat ang mga bagay na ito tungkol sa kaniya[c] at ginawa nila sa kaniya ang mga bagay na ito.
  rationale: Binago ang temporal na parirala para sa mas likas na Tagalog, ginawang “nakasulat” ang pagsasalin ng γεγραμμένα upang maipakita ang kalagayang bunga ng naunang pagkakasulat, at idinagdag ang nawawalang lexical-alternative footnote. Hindi nilinaw o binago ang saklaw ng “niluwalhati,” at pinanatili ang pangmaramihang “mga bagay na ito” sa lahat ng pag-uulit.
