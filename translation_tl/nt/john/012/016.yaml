  terminology: Ang “niluwalhati” ay angkop para sa ἐδοξάσθη at hindi dapat palitan ng mas makitid na “itinaas” o “pinarangalan.” Ginamit ang “kaniya/kaniyang” bilang pamantayang modernong Filipino sa marangal na rehistro.
