base_translation:
  language: en
  yaml_path: translation/nt/john/012/007.yaml
  text: So Jesus said[a], “Leave her alone[b], so that she may keep it for the day of my burial.”
translation:
  language: tl
  text: Kaya sinabi ni Jesus, “Hayaan mo siya, upang maitabi niya iyon[a] para sa araw ng aking libing.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “Hayaan mo siya; itinabi niya iyon para sa araw ng aking libing.” Nauunawaan ng ilan ang sugnay bilang paglalarawan sa nagawa na niya, hindi sa maaari pa niyang gawin.
    reason: alternative_reading
  - marker: b
    text: O kaya, “Hayaan mo siya, upang maitabi niya iyon hanggang sa araw ng aking libing.” Maaari ring unawain ang pagkakabuo ng Griyego na may mas tahasang diwang temporal.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Ipinakikita ang pagpapatuloy at lohikal na kaugnayan sa naunang sinabi ni Judas, sa natural na modernong Tagalog.
- source_word: Ἄφες αὐτήν
  choice: Hayaan mo siya
  rationale: Pinananatili ang pang-isahang pautos ng ἄφες at malinaw na ipinahihiwatig na huwag siyang pakialaman o pigilan.
- source_word: ἵνα
  choice: upang
  rationale: Ipinahahayag ang layunin o nilalayong resulta nang hindi inaalis ang maaaring ibang pagkaunawa sa mahirap na sugnay.
- source_word: εἰς τὴν ἡμέραν
  choice: para sa araw
  rationale: Itinuturo ang okasyong hinaharap nang hindi ipinipilit sa pangunahing teksto ang mas tiyak na kahulugang temporal na “hanggang sa araw.”
- source_word: ἐνταφιασμοῦ
  choice: paglilibing
  rationale: Karaniwan, malinaw, at marangal na katumbas ng paglilibing o paglalagay sa libingan.
- source_word: τηρήσῃ
  choice: maitabi niya
  rationale: Ang “maitabi” ay likas na Tagalog para sa pag-iingat o pagrereserba ng isang bagay para sa isang partikular na okasyon; pinananatili ng footnote ang alternatibong pag-unawa na tumutukoy sa nagawa na niya.
- source_word: αὐτό
  choice: iyon
  rationale: Pinananatili ang panghalip na tumutukoy sa pabango nang hindi nagdaragdag ng pangngalang hindi tahasang nasa talata.
theological_decisions:
- issue: Kaugnayan ng ginawa ng babae sa nalalapit na paglilibing kay Jesus
  choice: 'Iniharap ang sugnay bilang layunin: maitabi niya iyon para sa araw ng paglilibing kay Jesus.'
  alternative: 'Maaaring unawain bilang paglalarawan sa nagawa na niya: “itinabi niya iyon para sa araw ng aking paglilibing”; maaari rin itong unawaing “hanggang sa araw ng aking paglilibing.”'
  rationale: Mahirap at tunay na hindi tiyak ang sintaks ng Griyego. Pinananatili ng pangunahing salin ang tuwirang puwersa ng ἄφες … ἵνα … τηρήσῃ, habang inilalahad sa mga talababa ang mahahalagang alternatibo sa halip na lutasin nang palihim ang tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang pang-isahang “mo” ayon sa anyo ng pautos sa Griyego. Iniwasan ang teknikal o denominasyonal na pananalita, at pinanatili sa mga talababa ang tunay na kalabuan ng sugnay.
