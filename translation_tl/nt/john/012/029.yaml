base_translation:
  language: en
  yaml_path: translation/nt/john/012/029.yaml
  text: So the crowd that was standing there and had heard it was saying that thunder had happened; others were saying[a], “An angel has spoken to him.”
translation:
  language: tl
  text: Kaya ang mga taong nakatayo roon at nakarinig nito ay nagsasabing kumulog; sinasabi naman ng iba, “Isang anghel ang nagsalita sa kanya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Ipinapakita ang pagpapatuloy at bunga ng tinig na narinig sa naunang talata nang hindi labis na pormal.
- source_word: ὁ ὄχλος ὁ ἑστὼς
  choice: ang mga taong nakatayo roon
  rationale: Likas sa Filipino ang maramihang pagtukoy sa ὄχλος, at pinananatili ng “nakatayo roon” ang kalagayan at lokasyong ipinahihiwatig ng perfect participle.
- source_word: ἀκούσας
  choice: at nakarinig nito
  rationale: Ipinahahayag na narinig muna nila ang tinig o tunog bago sila nagbigay ng paliwanag; ang “nito” ay tumutukoy sa narinig sa konteksto.
- source_word: ἔλεγεν
  choice: ay nagsasabing
  rationale: Ang anyong imperfect ay inilalarawan bilang nagpapatuloy na pagsasabi o palagay ng karamihan.
- source_word: βροντὴν γεγονέναι
  choice: kumulog
  rationale: Ito ang natural at tumpak na ekspresyon sa modernong Filipino para sa pangyayaring nagkaroon ng kulog; nasa talababa ang mas anyong-pangngalang alternatibo.
- source_word: ἄλλοι ἔλεγον
  choice: Sinabi naman ng iba
  rationale: Malinaw na ipinakikilala ang naiibang paliwanag ng isa pang pangkat; natural sa Filipino ang simpleng nakaraang anyo rito.
- source_word: Ἄγγελος
  choice: Isang anghel
  rationale: Sa konteksto, ang iniisip ng mga tao ay isang makalangit na nilalang, hindi karaniwang taong mensahero.
- source_word: αὐτῷ λελάληκεν
  choice: ang nagsalita sa kanya
  rationale: Ang “sa kanya” ang natural na katumbas ng dative indirect object at tumutukoy kay Jesus; ang naganap na kilos ay malinaw sa anyong Filipino.
theological_decisions:
- issue: Kalagayan ng nagsalita ayon sa palagay ng mga tao
  choice: Isang anghel ang nagsalita sa kanya
  alternative: Isang mensahero ang nagsalita sa kanya
  rationale: Malamang na makalangit na nilalang ang tinutukoy ng ἄγγελος dahil paliwanag ito ng mga tao sa tinig na mula sa langit, ngunit iniuulat lamang ng talata ang kanilang palagay.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang pagkakaiba ng dalawang paliwanag ng mga tao—kulog o tinig ng isang anghel—nang hindi dinaragdagan o nilulutas ang tensiyon sa salaysay.
