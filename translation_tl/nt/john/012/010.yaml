id: JHN.12.10
reference: John 12:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐβουλεύσαντο δὲ οἱ ἀρχιερεῖς ἵνα καὶ τὸν Λάζαρον ἀποκτείνωσιν,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/010.yaml
  text: So the chief priests decided to kill Lazarus also,[a]
translation:
  language: tl
  text: Kaya nagpasiya ang mga punong pari na patayin din si Lazaro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nagbalak na patayin din si Lazaro.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβουλεύσαντο
  choice: nagpasiya
  rationale: Ipinahihiwatig ng pandiwa ang masusing pagsasaalang-alang na humantong sa isang tiyak na pasiya. Likas at malinaw sa makabagong Filipino ang “nagpasiya,” habang nananatiling posible ang “nagbalak.”
- source_word: δὲ
  choice: Kaya
  rationale: Sa daloy ng salaysay, iniuugnay ng δέ ang pasiyang ito sa naunang pangyayari. Ang “Kaya” ay natural na nagpapakita ng pagpapatuloy at bunga nang hindi nagpapasok ng labis na pagsalungat.
- source_word: οἱ ἀρχιερεῖς
  choice: ang mga punong pari
  rationale: Tumutukoy ang pangmaramihang anyo sa mga pinuno ng mga pari, hindi sa iisang pinakapunong pari. Ang “mga punong pari” ang malinaw at nakagawiang katumbas.
- source_word: ἵνα
  choice: na
  rationale: Kasunod ng pandiwa ng pagpapasiya, ipinakikilala ng ἵνα at ng pasakaling pandiwa ang nilayon nilang gawin. Likas itong ipinapahayag sa Filipino sa hulma na “nagpasiya ... na patayin.”
- source_word: καὶ
  choice: din
  rationale: Idinaragdag si Lazaro sa iba pang pinagtutuunan ng balak na pagpatay, na ipinahihiwatig ng konteksto. Tumpak na ipinapahayag ng “din” ang ganitong pandagdag na diwa.
- source_word: τὸν Λάζαρον
  choice: si Lazaro
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalang pantangi, kasama ang panandang “si” na hinihingi ng balarila.
- source_word: ἀποκτείνωσιν
  choice: patayin
  rationale: Direkta at natural na katumbas ng pandiwang nangangahulugang pumatay. Hindi ginamit ang “paslangin” o “ipapatay” upang maiwasan ang dagdag na moral o pamamaraang pahiwatig na wala sa sugnay.
theological_decisions:
- issue: Paglalarawan sa hangarin ng mga punong pari laban kay Lazaro
  choice: Tuwirang isinalin bilang pasiyang patayin si Lazaro, nang walang idinagdag na paliwanag tungkol sa kanilang motibo.
  alternative: Gumamit ng mas madiing pananalita gaya ng “nakipagsabwatan” o “nagpakana.”
  rationale: Malinaw sa Griyego ang sinadyang pasiya, ngunit walang natatanging salitang tahasang nangangahulugang sabwatan. Pinananatili ng salin ang bigat ng kanilang hangarin nang hindi nagdaragdag ng interpretasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikling anyo at tuwirang bigat ng salaysay; ginamit ang “nagpasiya” sa pangunahing teksto at inilagay sa talababa ang posibleng mas prosesong diwa ng “nagbalak.”
