  text: ὁ ἀθετῶν ἐμὲ καὶ μὴ λαμβάνων τὰ ῥήματά μου ἔχει τὸν κρίνοντα αὐτόν· ὁ λόγος ὃν ἐλάλησα ἐκεῖνος κρινεῖ αὐτὸν ἐν τῇ ἐσχάτῃ ἡμέρᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/048.yaml
  text: 'The one who rejects me and does not receive my words has one who judges him: the word that I spoke will judge him on the last day[a][b].'
translation:
  language: tl
  text: 'Ang nagtatakwil sa akin at hindi tumatanggap sa mga salita ko[a] ay may hahatol sa kanya: ang salitang sinabi ko[b] ang hahatol sa kanya sa huling araw.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi tinatanggap ang mga salita ko.” Ang pandiwang Griyego ay maaaring mangahulugang tumanggap, malugod na tanggapin, o tanggapin.
    reason: lexical_alternative
  - marker: b
    text: O “ang mensaheng sinabi ko.” Ang salitang Griyego na logos ay maaaring mangahulugang “salita” o “mensahe,” ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθετῶν
  choice: nagtatakwil
  rationale: Ipinapahayag nito ang tahasang pagtanggi kay Jesus, hindi lamang ang hindi pagpansin sa kanya.
- source_word: μὴ λαμβάνων τὰ ῥήματά μου
  choice: hindi tumatanggap sa mga sinabi ko
  rationale: Ang “tumatanggap” ay nagpapanatili sa diwang pagtanggap o malugod na pagkilala, samantalang ang “mga sinabi ko” ay natural na Tagalog para sa maramihang ῥήματα bilang mga binigkas na salita.
- source_word: ἔχει τὸν κρίνοντα αὐτόν
  choice: ay mayroon nang hahatol sa kanya
  rationale: Pinananatili nito ang bahagyang eliptikong pahayag na ang tumatanggi ay may hahatol na sa kanya; ang “nang” ay likas sa Tagalog at nagpapahiwatig ng kasalukuyang pagkakaroon nang hindi binabago ang panghinaharap na paghatol.
- source_word: ὁ λόγος
  choice: ang salita
  rationale: Pinananatili ng “salita” ang isahan at mabigat na bisa ng λόγος, pati ang halos isinapersonal nitong papel bilang hahatol; posible rin ang “mensahe.”
- source_word: ὃν ἐλάλησα
  choice: na sinabi ko
  rationale: Direkta at natural itong salin ng aorist na ἐλάλησα at malinaw na tumutukoy sa salitang binigkas ni Jesus.
- source_word: ἐκεῖνος κρινεῖ αὐτόν
  choice: ang hahatol sa kanya
  rationale: Sa pag-uulit ng “ang salita” bilang simuno, naipahahayag sa natural na Tagalog ang mariing pagtukoy ng ἐκεῖνος sa mismong salitang binanggit.
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: sa huling araw
  rationale: Karaniwan at malinaw itong pahayag sa modernong Tagalog para sa eskatolohikal na parirala, nang hindi nagdaragdag ng tiyak na sistemang doktrinal.
theological_decisions:
- issue: Ang gumaganap o batayan ng paghatol sa talata
  choice: Inilalarawan ang salitang sinabi ni Jesus bilang siyang hahatol sa huling araw.
  alternative: Maaaring unawain ang salita bilang isinapersonal na tuwirang hukom, o bilang pamantayan ng sariling paghatol ni Jesus.
  rationale: Unang sinasabi ng sintaks na ang nagtatakwil ay may hahatol sa kanya, saka tinutukoy ang salitang sinabi ni Jesus bilang hahatol. Pinananatili ng salin ang tensiyong ito at hindi ito ipinagkakasundo nang palihim sa ibang pahayag tungkol sa papel ni Jesus sa paghatol.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “nagtatakwil” para sa matibay at personal na pagtanggi, at “mga sinabi ko” upang maiwasan ang di-likas na “mga salita ko” habang napapanatili ang diwa ng binigkas na mga pahayag. Ang “salita” sa ikalawang sugnay ay sadyang pinanatili sa isahan dahil isahan ang λόγος at may mariing, halos isinapersonal na bisa.
