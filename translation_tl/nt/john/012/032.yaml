  text: κἀγὼ ⸀ἐὰν ὑψωθῶ ἐκ τῆς γῆς, πάντας ἑλκύσω πρὸς ἐμαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/032.yaml
  text: And I[a], when I am lifted up from the earth[c][b], will draw all people to myself.
translation:
  language: tl
  text: At ako, kapag itinaas ako mula sa lupa[a][b], hihilahin ko sa aking sarili ang lahat ng tao.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “kung itataas ako.” Kondisyunal ang anyong Griyego, ngunit sa konteksto ay tumutukoy ito sa nalalapit na kamatayan ni Jesus.
    reason: alternative_reading
  - marker: b
    text: Ang “itinaas” ay maaari ring magpahiwatig ng pagluwalhati. Pinananatili nito ang dobleng diwa sa Juan—ang pagpapako sa krus at ang pagluluwalhati.
    reason: lexical_alternative
  - marker: c
    text: Sa Griyego, “lahat.” Likas itong tumutukoy rito sa lahat ng tao, ngunit hindi tinutukoy ng talata kung paano ito iuugnay sa mga sumunod na pagtatalong teolohikal tungkol sa lawak ng kaligtasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: At ako
  rationale: Pinagsasama ng κἀγώ ang καί at ἐγώ. Pinananatili ng “At ako” ang kaugnayan sa naunang pahayag at ang banayad na pagdidiin kay Jesus.
- source_word: ἐὰν
  choice: kapag
  rationale: Bagaman kondisyunal ang anyong Griyego, tumutukoy ito sa kamatayan ni Jesus na nalalapit at tiyak sa daloy ng salaysay. Ang “kapag” ay likas sa modernong Tagalog at maaari pa ring magpahayag ng kondisyunal-temporal na diwa.
- source_word: ὑψωθῶ
  choice: itinaas ako
  rationale: 'Pinananatili ng “itinaas” ang sadyang dobleng diwa sa Juan: ang pisikal na pagtataas kay Jesus sa krus at ang kaniyang kadakilaan o pagluluwalhati.'
- source_word: ἐκ τῆς γῆς
  choice: mula sa lupa
  rationale: Ang γῆ ay likas na tumutukoy rito sa lupa o ibabaw ng lupa, gaya ng paglilinaw ng kasunod na talata tungkol sa paraan ng kamatayan ni Jesus.
- source_word: πάντας
  choice: lahat ng tao
  rationale: Ang panlalaking pangmaramihang anyo ay likas na tumutukoy sa mga tao. Nililinaw ito sa Tagalog nang hindi nagpapasiya kung ang saklaw ay bawat indibidwal o lahat ng uri ng tao.
- source_word: ἑλκύσω
  choice: ilalapit ko
  rationale: Ipinahahayag nito sa natural na Tagalog ang pag-akay o paghila patungo kay Jesus, nang hindi labis na ipinipilit ang pisikal na larawan o isang tiyak na paliwanag sa paraan ng paglapit.
- source_word: πρὸς ἐμαυτόν
  choice: sa aking sarili
  rationale: Pinananatili nito ang mapagdiing panumbalik na panghalip na ἐμαυτόν, hindi lamang ang payak na “sa akin.”
theological_decisions:
- issue: Saklaw ng πάντας kaugnay ng kaligtasan
  choice: lahat ng tao
  alternative: lahat; bawat isa; lahat ng uri ng tao
  rationale: Tumutukoy sa mga tao ang anyong Griyego, ngunit hindi nilulutas ng talata mismo ang mga sumunod na pagtatalong teolohikal kung bawat indibidwal ba o lahat ng uri ng tao ang tinutukoy. Pinananatili ng salin ang malawak na saklaw ng pahayag.
- issue: Dobleng diwa ng ὑψωθῶ sa Ebanghelyo ni Juan
  choice: itinaas
  alternative: itinaas sa karangalan; niluwalhati
  rationale: Pinagbubuklod ng salita ang pagpapako sa krus at ang kadakilaan o pagluluwalhati ni Jesus. Hindi nililimitahan ng “itinaas” ang pahayag sa isa lamang sa dalawang diwa.
- issue: Lakas at paraan ng pagkilos sa ἑλκύσω
  choice: ilalapit ko
  alternative: hihilahin ko; aakitin ko
  rationale: Ang pandiwang Griyego ay maaaring magpahiwatig ng malakas na paghila, ngunit hindi ipinapaliwanag ng talata ang eksaktong paraan. Ang “ilalapit” ay nagpapanatili sa direksiyon ng pagkilos nang hindi nag-aangkat ng isang tiyak na doktrina tungkol sa mekanismo nito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang payak na ayos ng pangungusap at iniwasan ang labis na arkaiko o denominasyonal na pananalita. Ang “sa aking sarili” ay bahagyang pormal ngunit angkop upang mapanatili ang diin ng panumbalik na panghalip sa Griyego.
