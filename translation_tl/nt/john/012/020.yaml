base_translation:
  language: en
  yaml_path: translation/nt/john/012/020.yaml
  text: There were some Greeks among those going up to worship at the feast[a].
translation:
  language: tl
  text: May ilang Griego na kabilang sa mga umaahon upang sumamba sa kapistahan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring tumukoy ang “mga Griego” sa mga hindi Judio na umahon upang sumamba sa kapistahan.
    reason: Pinananatili ng pangunahing teksto ang literal na katawagang “mga Griego,” samantalang maingat na itinatala ng talababa ang isang posibleng pagkakakilanlan nang hindi ito ipinagpapalagay.
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: May
  rationale: Ipinahahayag ng ἦσαν ang pag-iral ng isang pangkat; ang banayad na pang-ugnay na δέ ay hindi kailangang isalin nang tahasan sa natural na Tagalog.
- source_word: Ἕλληνές τινες
  choice: ilang Griego
  rationale: Ang Ἕλληνες ay tuwirang tumutukoy sa mga Griego, samantalang ang τινες ay nagpapahiwatig ng di-tiyak na bilang. Hindi ito ginawang pangkalahatang “mga Hentil” upang mapanatili ang katawagang nasa teksto.
- source_word: ἐκ τῶν ἀναβαινόντων
  choice: sa mga umaahon
  rationale: Ipinakikitang kabilang sila sa mga umaahon patungong Jerusalem. Pinananatili ng “umaahon” ang wika ng paglalakbay bilang peregrino nang hindi nagdaragdag ng lugar na hindi tahasang binanggit sa talata.
- source_word: ἵνα προσκυνήσωσιν
  choice: upang sumamba
  rationale: Ang ἵνα kasama ng pasakali ay nagsasaad ng layunin, at ang προσκυνέω rito ay tumutukoy sa pagsambang panrelihiyon.
- source_word: ἐν τῇ ἑορτῇ
  choice: sa panahon ng kapistahan
  rationale: Likas sa Tagalog ang pariralang ito para sa pakikibahagi sa pagsamba sa okasyon ng kapistahan; hindi nito tinutukoy nang higit sa sinasabi ng teksto kung anong kapistahan iyon.
theological_decisions:
- issue: Pagkakakilanlan ng Ἕλληνες
  choice: Griego
  alternative: mga Hentil
  rationale: Ang payak na kahulugan ng Ἕλληνες ay “mga Griego.” Hindi nililinaw ng talata kung sila ay mga Judiong nagsasalita ng Griego, mga proselita, o ibang di-Judiong sumasamba; kaya pinananatili ng salin ang katawagan at ang tunay na kalabuan ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “umaahon” upang mapanatili ang tradisyonal na paglalarawan sa paglalakbay patungong Jerusalem, at “kapistahan” bilang likas na katumbas ng ἑορτή sa kontekstong panrelihiyon.
