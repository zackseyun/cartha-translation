base_translation:
  language: en
  yaml_path: translation/nt/john/012/004.yaml
  text: But Judas Iscariot[a], one of his disciples—the one who was about to betray him—said,
translation:
  language: tl
  text: Ngunit sinabi ni Judas Iscariote, isa sa mga alagad niya—na malapit nang magkakanulo sa kanya[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “na malapit nang magpasa sa kanya sa iba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: sinabi
  rationale: Ginamit sa Griyego ang pangkasaysayang pangkasalukuyan, ngunit mas natural sa makabagong salaysay sa Tagalog ang pangnagdaan na “sinabi.”
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig ng δέ ang banayad na pagsalungat sa naunang ginawa ni Maria; malinaw at natural itong ipinapakita ng “Ngunit.”
- source_word: Ἰούδας ὁ Ἰσκαριώτης
  choice: Judas Iscariote
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa Tagalog na salin ng Bibliya.
- source_word: εἷς τῶν μαθητῶν αὐτοῦ
  choice: isa sa mga alagad niya
  rationale: Pinananatili ng “alagad” ang ugnayan ng guro at mag-aaral na ipinahihiwatig ng μαθητής at natural ito sa konteksto ng mga Ebanghelyo.
- source_word: ὁ μέλλων
  choice: ang ... mag-
  rationale: Sa sugnay na “ang magkakanulo sa kanya,” ang aspektong kontemplatibo ay likas na nagpapahayag ng kilos na mangyayari pa; hindi kailangan ang mas mabigat na “malapit nang,” na maaaring magpalabis sa diin ng μέλλω rito.
- source_word: παραδιδόναι
  choice: magkakanulo
  rationale: Bagaman ang pangunahing kahulugan ay “ibigay” o “ipasa sa kamay ng iba,” sa konteksto ng ginawa ni Judas ang “magkanulo” ang malinaw at natural na kontekstuwal na kahulugan. Inilagay sa talababa ang mas literal na alternatibo.
theological_decisions:
- issue: Pagpapakahulugan sa παραδιδόναι kaugnay ng gagawin ni Judas kay Jesus
  choice: magkakanulo
  alternative: magbibigay sa kanya sa kamay ng iba
  rationale: Ipinakikita ng “magkakanulo” ang pagtataksil na likas sa konteksto, samantalang pinananatili ng alternatibo ang mas malawak at literal na larawan ng pagpapasa o pagbibigay sa kapangyarihan ng iba. Ang alternatibo ay inilakip sa talababa upang hindi mawala ang saklaw ng salitang Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kanya” ayon sa karaniwang modernong baybay at ang nakaugaliang biblikal na katawagang “alagad.” Nagtatapos sa kuwit dahil nagpapatuloy sa kasunod na talata ang tuwirang sinabi ni Judas.
