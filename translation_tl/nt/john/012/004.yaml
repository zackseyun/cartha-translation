    rationale: Ang literal na larawan ng παραδιδόναι ay pagpapasa o paghahand-over sa isang tao; ang pariralang “magbigay ... sa kamay” ay hindi likas na Tagalog. Ang “magpasa sa kanya sa iba” ay mas maayos na lexical alternative.
