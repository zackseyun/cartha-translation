  naturalness: Natural at angkop sa modernong Filipino Tagalog ang “Ngunit sinabi ni Judas Iscariote” at “isa sa mga alagad niya.” Mas malinaw at mas maayos ang appositive na “na malapit nang magkakanulo sa kanya” kaysa sa dating nominal na “ang magkakanulo sa kanya.”
  terminology: Ang “Judas Iscariote,” “alagad,” at “magkakanulo” ay angkop at matatag na mga katawagan. Pinananatili ang “magkakanulo” bilang kontekstuwal na salin ng παραδιδόναι, habang ang mas literal na “magpasa sa kanya sa iba” ay inilalagay sa talababa.
