  text: ἔλαβον τὰ βαΐα τῶν φοινίκων καὶ ἐξῆλθον εἰς ὑπάντησιν αὐτῷ, καὶ ⸀ἐκραύγαζον· Ὡσαννά, εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου, ⸂καὶ ὁ⸃ βασιλεὺς τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/013.yaml
  text: They took the palm branches and went out to meet him[a], and they were crying out, “Hosanna! Blessed is the one who comes in the name of the Lord[c][b], even the King of Israel!”
translation:
  language: tl
  text: Kumuha sila ng mga sanga ng palma at lumabas upang salubungin siya. Patuloy silang sumisigaw, “Hosanna![a] Pinagpala ang dumarating sa pangalan ng Panginoon![b] At ang Hari ng Israel!”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Hosanna” ay sigaw na nagmula sa Hebreo at nangangahulugang “magligtas ngayon” o “mangyaring magligtas.” Pagsapit ng panahong ito, ginagamit din ito bilang sigaw ng papuri.
    reason: lexical_alternative
  - marker: b
    text: Inuulit o ipinahihiwatig ng linyang ito ang Awit 118:26.
    reason: cross_reference
  - marker: c
    text: 'Maaari ring isalin: “maging ang Hari ng Israel.”'
    reason: alternative_reading
lexical_decisions:
- source_word: βαΐα τῶν φοινίκων
  choice: mga sanga ng palma
  rationale: Tahasang ipinahahayag ang mga sanga at ang uri ng punong pinagmulan ng mga ito, sa natural na modernong Tagalog.
- source_word: ἐξῆλθον εἰς ὑπάντησιν αὐτῷ
  choice: lumabas upang salubungin siya
  rationale: Ang salubungin ay likas na katumbas ng paglabas upang makipagtagpo sa isang dumarating, nang hindi na nagdaragdag ng higit na tiyak na layuning gaya ng pagtanggap o pagpupugay.
- source_word: ἐκραύγαζον
  choice: patuloy silang sumisigaw
  rationale: Inihahayag ng patuloy ang di-ganap na aspekto ng imperfect, na nagpapahiwatig ng nagpapatuloy o paulit-ulit na pagsigaw.
- source_word: Ὡσαννά
  choice: Hosanna
  rationale: Pinananatili ang kinikilalang liturhikal na sigaw; ipinaliliwanag sa talababa ang Hebreong pinagmulan at saklaw ng kahulugan nito.
- source_word: εὐλογημένος ὁ ἐρχόμενος
  choice: Pinagpala ang dumarating
  rationale: Natural at marangal sa Tagalog at pinananatili ang substantibong participle nang hindi pinipilit ang panghalip na panlalaki.
- source_word: ἐν ὀνόματι κυρίου
  choice: sa pangalan ng Panginoon
  rationale: Pinananatili ang karaniwang biblikal na pahayag at ang anyong κύριος ng tekstong Griyego.
- source_word: καὶ ὁ βασιλεὺς τοῦ Ἰσραήλ
  choice: At ang Hari ng Israel
  rationale: Pinananatili ang tahasang καί bilang 'at' at ang maharlikang titulo, sa halip na tahimik na gawing panuring ang parirala.
theological_decisions:
- issue: Paglilipat sa κύριος sa sipi o alusyon sa Awit 118:26
  choice: Panginoon
  alternative: YHWH / PANGINOON
  rationale: Ang agarang tekstong Griyego ay κυρίου. Ang 'Panginoon' ang tuwirang paglilipat nito, habang kinikilala ng talababa ang alusyon sa Awit nang hindi pinapalitan ang anyo ng Griyego ng rekonstruidong Hebreo.
- issue: Ugnayan ng καὶ ὁ βασιλεὺς τοῦ Ἰσραήλ sa naunang pagbubunyi
  choice: At ang Hari ng Israel
  alternative: maging ang Hari ng Israel / samakatuwid ay ang Hari ng Israel
  rationale: Maaaring appositional o emphatic ang καί, ngunit maaari rin itong panatilihing payak na 'at.' Ang literal na ugnayan ay iniingatan sa teksto at ang posibleng idiomatikong pagbasa ay inilalagay sa talababa.
- issue: Maharlika at mesiyanikong lakas ng pagbubunyi
  choice: Hari ng Israel
  alternative: hari ng Israel / Hari ng bayang Israel
  rationale: Tahasang pinananatili ang titulong βασιλεὺς τοῦ Ἰσραήλ nang hindi ito pinalalambot o dinaragdagan ng paliwanag na doktrinal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “salubungin” para sa likas na kilos ng paglabas upang katagpuin ang dumarating, at “patuloy” upang maipakita ang aspekto ng imperfect. Pinanatili ang “Hosanna” bilang makasaysayan at liturhikal na sigaw, na may malinaw na paliwanag sa talababa.
