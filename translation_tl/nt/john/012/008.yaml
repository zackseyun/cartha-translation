  yaml_path: translation/nt/john/012/008.yaml
  text: For you always have the poor with you[a], but you do not always have me.
translation:
  language: tl
  text: Sapagkat laging kasama ninyo ang mga dukha[a], ngunit hindi ninyo ako laging makakasama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin na “mga taong dukha.” Ang pang-uri sa Griyego ay ginamit bilang pangngalan: “ang mga dukha.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πτωχούς
  choice: ang mga dukha
  rationale: Ang pang-uri ay ginamit bilang pangngalan at tumutukoy sa mga taong dukha. Likas at marangal sa modernong Tagalog ang “ang mga dukha,” at pinananatili nito ang pangkalahatang pagtukoy sa pangkat.
- source_word: γάρ
  choice: Sapagkat
  rationale: Nagbibigay ang γάρ ng paliwanag o batayan para sa naunang pahayag; malinaw na naipapahayag ito ng “Sapagkat.”
- source_word: πάντοτε
  choice: lagi / laging
  rationale: Tumutukoy ito sa patuloy na presensya o pagiging abot-kamay. Ginamit ang anyong “lagi” at “laging” ayon sa natural na ayos ng Tagalog, nang walang pagkakaiba sa kahulugan.
- source_word: ἔχετε
  choice: ninyong kasama / ninyo ... kasama
  rationale: Sa konteksto, ang ἔχετε ay hindi pagmamay-ari kundi pagkakaroon ng isang tao sa kanilang piling. Mas natural sa Tagalog ang konstruksyong “kasama” kaysa sa literal na “mayroon.”
- source_word: μεθ’ ἑαυτῶν
  choice: ninyong kasama
  rationale: Ang parirala ay nangangahulugang nasa kanilang piling o presensya. Ang “ninyong kasama” ay likas na modernong Tagalog at malinaw na tumutukoy sa mga alagad bilang maramihan.
- source_word: ἐμέ
  choice: ako
  rationale: Bagaman tuwirang layon sa Griyego, hinihingi ng natural na konstruksyong Tagalog na “kasama” ang panghalip na “ako.”
- source_word: δέ
  choice: ngunit
  rationale: Malinaw na minamarkahan nito ang kaibahan sa patuloy na presensya ng mga dukha at sa pansamantalang presensya ni Jesus.
- source_word: οὐ πάντοτε
  choice: hindi ... laging
  rationale: Tumpak nitong pinananatili ang pagtanggi sa pagiging palagian, hindi ang lubos na pagtanggi sa presensya.
theological_decisions:
- issue: Maaaring maling gamitin ang pahayag ni Jesus upang maliitin ang pangangalaga sa mga dukha
  choice: Tuwirang ihayag ang kaibahan sa tagal ng presensya, nang hindi ipinahihiwatig na hindi mahalaga ang mga dukha.
  alternative: Palawakin ang salin upang sabihing mas hindi mahalaga ang mga dukha, o palambutin ang salin upang mawala ang kaibahan.
  rationale: 'Ang Griyego ay nagsasaad ng kaibahan: patuloy na makakasama ng mga alagad ang mga dukha, samantalang hindi nila laging makakasama si Jesus. Hindi nilulutas ng salin ang teolohikal na tensiyon o nagdaragdag ng pagpapahalagang hindi tahasang sinabi ng teksto.'
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “mga dukha” sa halip na mas kolokyal na “mga mahirap” upang maiwasan ang kalabuan ng “mahirap” bilang ‘difficult,’ habang nananatiling madaling maunawaan. Ang hulma na “kasama” ay mas idiomatiko kaysa sa literal na pag-uulit ng “mayroon.”
