id: JHN.12.23
reference: John 12:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀ἀποκρίνεται αὐτοῖς λέγων· Ἐλήλυθεν ἡ ὥρα ἵνα δοξασθῇ ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/023.yaml
  text: But Jesus answered them[a], saying[b], “The hour has come for the Son of Man to be glorified.”
translation:
  language: tl
  text: Ngunit sumagot si Jesus sa kanila, “Dumating na ang oras[a] upang ang Anak ng Tao[b] ay luwalhatiin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “panahon.” Sa Griyego ay “oras,” isang salitang paulit-ulit na ginagamit sa Juan para sa itinakdang sandali ng pagdurusa at pagluluwalhati kay Jesus.
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “ang Anak ng Tao,” isang titulong umaalingawngaw sa Daniel 7; pinanatili rito dahil sa teolohikal at intertekstuwal na bigat nito.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκρίνεται αὐτοῖς λέγων
  choice: sumagot si Jesus sa kanila
  rationale: Likas sa makabagong Tagalog ang payak na “sumagot ... sa kanila.” Hindi na hiwalay na isinalin ang λέγων sapagkat kalabisan at di-likas ang “sumagot ... na nagsasabi” bago ang tuwirang sipi.
- source_word: Ἐλήλυθεν
  choice: Dumating na
  rationale: 'Ipinahihiwatig ng “na” ang kasalukuyang bungang resulta ng Griyegong perfect: ang itinakdang sandali ay dumating at narito na.'
- source_word: ἡ ὥρα
  choice: ang oras
  rationale: Pinananatili ng “oras” ang paulit-ulit at makahulugang terminong Johannine, sa halip na gawing mas pangkalahatang “panahon” o “sandali.”
- source_word: ἵνα δοξασθῇ
  choice: upang luwalhatiin
  rationale: Ang “upang” ay likas na naghahatid ng layunin o nilalaman ng dumating na oras, at ang “luwalhatiin” ay nagpapanatili sa passive at sa mayamang teolohikal na diwa ng δοξάζω.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Ito ang nakaugaliang titulong Tagalog na nagpapanatili sa ugnayan nito sa Daniel 7 at sa natatanging gamit ni Jesus sa Ebanghelyo ni Juan.
theological_decisions:
- issue: Pagpapakahulugan sa “oras” ni Jesus
  choice: Dumating na ang oras
  alternative: Dumating na ang panahon
  rationale: Hindi nililinaw nang lampas sa teksto kung ang “oras” ay kamatayan, muling pagkabuhay, o pagtataas lamang; pinananatili nito ang Johannine na tensiyon kung saan magkakaugnay ang pagdurusa at kaluwalhatian.
- issue: Pagsasalin sa titulong ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  alternative: ang Taong Anak / ang Makataong Isa
  rationale: Pinananatili ang pamilyar na titulo at ang alusyon nito sa Daniel 7 nang hindi ito pinapaliit sa pangkalahatang katauhan lamang.
- issue: Passive na δοξασθῇ
  choice: luwalhatiin
  alternative: tumanggap ng kaluwalhatian
  rationale: Pinananatili ng passive ang hindi tahasang pinangalanang tagaganap at hindi ipinapasok sa mismong talata ang isang paliwanag na wala rito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Inalis ang literal na “na nagsasabi” dahil di-likas na pag-uulit ito sa Tagalog, ngunit walang nawalang nilalaman. Ginamit ang “luwalhatiin” bilang pamilyar na salitang biblikal na angkop sa siksik na teolohikal na diwa ng talata.
