  text: τοῦτο δὲ ἔλεγεν σημαίνων ποίῳ θανάτῳ ἤμελλεν ἀποθνῄσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/033.yaml
  text: He was saying this to signify what kind of death he was about to die[a].
translation:
  language: tl
  text: Sinabi niya ito upang ipahiwatig kung anong uri ng kamatayan ang malapit na niyang sapitin[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “kung sa anong paraan siya mamamatay.” Maaaring bigyang-diin ng pananalitang Griyego ang paraan ng kamatayan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: ito
  rationale: Ang panghalip na pamatlig na isahang walang kasarian ay tumutukoy sa naunang sinabi ni Jesus; natural at tuwiran itong isalin na “ito.”
- source_word: δὲ
  choice: hindi tahasang isinalin
  rationale: Mahina at panlipat lamang ang gamit ng δέ rito. Hindi kailangan ang hiwalay na “ngunit” o “naman” sa Filipino, na maaaring magpahiwatig ng mas matinding pagsalungat kaysa nasa Griyego.
- source_word: ἔλεγεν
  choice: sinabi niya
  rationale: Bagaman imperfect ang pandiwa, ang payak na “sinabi niya” ang likas na salaysay sa Filipino. Ang “sinasabi niya” ay maaaring magmukhang kasalukuyang kilos at maging di-natural sa kontekstong ito.
- source_word: σημαίνων
  choice: upang ipahiwatig
  rationale: Ipinapahayag nito na ang sinabi ni Jesus ay nagpapakilala o nagbibigay-pahiwatig sa paraan ng kaniyang kamatayan. Pinananatili ng “ipahiwatig” ang di-tuwirang katangian ng pahayag.
- source_word: ποίῳ θανάτῳ
  choice: kung anong uri ng kamatayan
  rationale: Binibigyang-diin ng parirala ang uri o paraan ng kamatayan, hindi lamang ang katotohanang mamamatay siya.
- source_word: ἤμελλεν
  choice: malapit na niyang
  rationale: Ipinahahayag ng μέλλω rito ang nalalapit na mangyayari. Iniiwasan ng “malapit na” ang mas malakas na ideya ng tadhanang maaaring ipasok ng “nakatakda.”
- source_word: ἀποθνῄσκειν
  choice: sapitin
  rationale: Sa Filipino, ang “sapitin” kasama ng “kamatayan” ay natural at marangal na paraan ng pagpapahayag ng “mamatay,” nang hindi inuulit ang magkaugnay na mga salitang “kamatayan” at “mamamatay.”
theological_decisions:
- issue: Kung tahasang babanggitin ang pagpapako sa krus
  choice: Pinanatili ang di-tuwirang pananalitang “kung anong uri ng kamatayan.”
  alternative: “na mamamatay siya sa krus” o “kung paano siya papatayin”
  rationale: Ipinahihiwatig ng konteksto ang pagpapako sa krus, ngunit hindi ito tahasang pinangalanan sa talatang ito. Ang pagdaragdag nito sa pangunahing teksto ay lalampas sa mismong pananalita ng ebanghelista.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ang “sapitin” ay karaniwang nauunawaan sa ganitong konteksto at umiiwas sa di-likas na pag-uulit na “uri ng kamatayan ... mamamatay.”
