  text: οἱ οὖν Φαρισαῖοι εἶπαν πρὸς ἑαυτούς· Θεωρεῖτε ὅτι οὐκ ὠφελεῖτε οὐδέν· ἴδε ὁ ⸀κόσμος ὀπίσω αὐτοῦ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/019.yaml
  text: So the Pharisees said to one another[a], “You see that you are accomplishing nothing. Look—the world has gone after him.”
translation:
  language: tl
  text: Kaya sinabi ng mga Fariseo sa isa’t isa, “Nakikita ninyong wala kayong nagagawa. Tingnan ninyo—sumunod na sa kanya ang mundo.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sumunod na sa kanya ang lahat.” Ang Griyego ay “ang mundo,” malamang bilang retorikal na pagmamalabis.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Nagpapakita ito ng bunga o kongklusyon mula sa naunang tagpo at natural sa makabagong Filipino.
- source_word: πρὸς ἑαυτούς
  choice: sa isa’t isa
  rationale: 'Ang parirala ay may katumbasang diwa rito: nag-uusap ang mga Pariseo bilang isang pangkat.'
- source_word: Θεωρεῖτε
  choice: Nakikita ninyo
  rationale: Pinananatili nito ang anyong pangkasalukuyang pahayag at ang mapanumbat na tono, sa halip na gawing tahasang utos.
- source_word: οὐκ ὠφελεῖτε οὐδέν
  choice: wala kayong nagagawa
  rationale: Natural nitong ipinahahayag ang pagiging walang saysay ng kanilang mga pagsisikap laban kay Jesus.
- source_word: ἴδε
  choice: Tingnan ninyo
  rationale: Nagsisilbi itong biglang panawag-pansin at pinananatili ang retorikal na diin.
- source_word: κόσμος
  choice: ang mundo
  rationale: Pinananatili ang leksikal na larawan ng Griyego at ang malamang na retorikal na pagmamalabis, sa halip na paliitin agad ang saklaw sa pangunahing teksto.
- source_word: ὀπίσω αὐτοῦ ἀπῆλθεν
  choice: sumunod na sa kanya
  rationale: Ang pagpunta sa likuran ng isang tao ay idyoma para sa pagsunod sa kanya; ipinahihiwatig ng “na” ang bungang nakikita na ngayon ng mga nagsasalita.
theological_decisions:
- issue: Saklaw ng κόσμος sa sinabi ng mga Pariseo
  choice: Panatilihin ang “ang mundo” bilang retorikal na pagmamalabis.
  alternative: “sumunod na sa kanya ang lahat” o “sumunod na sa kanya ang buong karamihan”
  rationale: Ang mga Pariseo ay nagsasalita dahil sa pagkabigo at nagpapalabis. Pinananatili ng salin ang salitang Griyego at ang temang Johannine nang hindi ito ginagawang literal na pahayag na ang bawat tao ay naging tagasunod ni Jesus.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Pariseo,” “sa isa’t isa,” at “wala kayong nagagawa” bilang mga natural na anyo, habang pinanatili ang matinding retorikal na tono ng pahayag.
