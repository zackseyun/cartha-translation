id: JHN.20.1
reference: John 20:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Τῇ δὲ μιᾷ τῶν σαββάτων Μαρία ἡ Μαγδαληνὴ ἔρχεται πρωῒ σκοτίας ἔτι οὔσης εἰς τὸ μνημεῖον, καὶ βλέπει τὸν λίθον ἠρμένον ἐκ τοῦ μνημείου.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/001.yaml
  text: On the first day of the week[a], Mary Magdalene comes to the tomb early, while it was still dark, and sees the stone having been taken away from the tomb.
translation:
  language: tl
  text: Sa unang araw ng linggo[a], maagang pumunta si Maria Magdalena sa libingan habang madilim pa, at nakita niyang naalis na ang bato mula sa libingan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa isa sa mga Sabat,” isang idyomang nangangahulugang “sa unang araw ng linggo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ μιᾷ τῶν σαββάτων
  choice: Sa unang araw ng linggo
  rationale: Ang parirala ay isang idyomang Koine para sa unang araw ng linggo. Hindi kailangang tumbasan nang hiwalay ang δέ; natural sa Tagalog na ipagpatuloy ang salaysay nang walang dagdag na pang-ugnay.
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: Maria Magdalena
  rationale: Karaniwang anyong Tagalog ng pangalan at katawagang heograpiko.
- source_word: ἔρχεται
  choice: pumunta
  rationale: Bagaman historical present ang Griyego, mas natural at malinaw sa salaysay na Tagalog ang aspektong perpektibo. Hindi nito binabago ang pagkakasunod ng mga pangyayari.
- source_word: πρωῒ
  choice: maaga
  rationale: Ipinahihiwatig ang maagang oras nang hindi dinaragdagan ng 'bukang-liwayway,' yamang sinasabi ng kasunod na parirala na madilim pa.
- source_word: σκοτίας ἔτι οὔσης
  choice: habang madilim pa
  rationale: Natural na temporal na sugnay na nagpapanatili sa nagpapatuloy na kalagayan ng kadiliman.
- source_word: εἰς τὸ μνημεῖον
  choice: sa libingan
  rationale: Sa konteksto, ang μνημεῖον ay isang libingang yungib o puntod; 'libingan' ang malinaw at karaniwang salin.
- source_word: βλέπει
  choice: nakita
  rationale: Ang perpektibong anyo ay natural sa salaysay na Tagalog at malinaw na naghahayag ng pagkatuklas ni Maria.
- source_word: τὸν λίθον ἠρμένον
  choice: nakita niyang naalis na ang bato
  rationale: 'Ipinahahayag ng ''naalis na'' ang ganap nang kilos at nananatiling resulta ng perfect passive participle: wala na sa dating kinalalagyan ang bato nang makita ito ni Maria.'
- source_word: ἐκ τοῦ μνημείου
  choice: mula sa libingan
  rationale: Tuwirang pinananatili ang diwa ng pagkalayo mula sa libingan nang hindi idinaragdag ang salitang 'pasukan,' na hindi tahasang nasa teksto.
theological_decisions:
- issue: Pamanahong pansalaysay sa ulat ng pagkabuhay na muli
  choice: 'Gumamit ng natural na aspektong perpektibo sa Tagalog: ''pumunta'' at ''nakita'''
  alternative: Panatilihin ang historical present bilang 'pumupunta' at 'nakikita'
  rationale: Hindi tuwirang katumbas ng sistema ng panahunan sa Griyego ang sistema ng aspekto sa Tagalog. Ang perpektibong anyo ang likas na paraan ng pagsasalaysay sa Tagalog at hindi nagdaragdag ng teolohikal na pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang karaniwang 'libingan' at iniwasan ang sobrang literal na anyong magiging asiwa sa ordinaryong mambabasa.
