  to: Sinabi ni Jesus sa kanya, “Huwag kang kumapit sa akin[a], sapagkat hindi pa ako umakyat sa Ama. Ngunit pumunta ka sa aking mga kapatid[b] at sabihin mo sa kanila, ‘Aakyat ako sa aking Ama at inyong Ama, sa aking Diyos at inyong Diyos.’”
