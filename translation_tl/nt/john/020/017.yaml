  source_fidelity: Kailangang baguhin ang “hindi pa ako nakakaakyat,” dahil ang nakakaakyat ay karaniwang nagpapahiwatig ng kakayahan o nagaganap na pag-akyat, hindi ng perpektong “hindi pa ako umakyat.” Ang “hindi pa ako umaakyat” ay hindi rin angkop sa diwa. Ang “hindi pa ako nakaaakyat” ay posible sa pormal na gamit ngunit maaaring malabo; “hindi pa ako umakyat” ang pinakamalinaw at natural na Filipino para sa pahayag na ito, bagaman hindi nito tuwirang minamarka ang perpektong aspekto. Mas mainam ding huwag idagdag ang kontrastibong “Sa halip” para sa δέ, na simpleng pang-ugnay dito.
  naturalness: Natural ang karamihan ng salin. Ang “Huwag kang kumapit sa akin” ay malinaw at angkop sa malamang na diwa ng kasalukuyang pautos. Mas likas ang “Pumunta ka sa aking mga kapatid” kaysa “pumunta ka sa mga kapatid ko,” bagaman kapwa nauunawaan. Ang “Sabihin mo sa kanila” ay maayos.
  terminology: Ang “Ama,” “aking Ama at inyong Ama,” at “aking Diyos at inyong Diyos” ay tumpak at pinananatili ang sinadyang paralelismo ng Griyego. Ang “mga kapatid” ay wastong salin ng ἀδελφούς; ang talababa ay angkop upang ipaliwanag ang anyong panlalaki sa Griyego nang hindi binabago ang teksto.
