id: JHN.20.17
reference: John 20:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: λέγει ⸀αὐτῇ Ἰησοῦς· Μή μου ἅπτου, οὔπω γὰρ ἀναβέβηκα πρὸς τὸν ⸀πατέρα· πορεύου δὲ πρὸς τοὺς ἀδελφούς μου καὶ εἰπὲ αὐτοῖς· Ἀναβαίνω πρὸς τὸν πατέρα μου καὶ πατέρα ὑμῶν καὶ θεόν μου καὶ θεὸν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/017.yaml
  text: Jesus said to her[a], “Do not cling to me, for I have not yet ascended to the Father. But go to my brothers and tell them, ‘I am ascending to my Father and your Father[b], and my God and your God.’”
translation:
  language: tl
  text: Sinabi ni Jesus sa kanya, “Huwag kang kumapit sa akin[a], sapagkat hindi pa ako umakyat sa Ama. Ngunit pumunta ka sa aking mga kapatid[b] at sabihin mo sa kanila, ‘Aakyat ako sa aking Ama at inyong Ama, sa aking Diyos at inyong Diyos.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Huwag mo akong hipuin” o “Huwag mo akong hawakan.” Malamang na tumutukoy ang Griyego sa pagkapit o patuloy na paghawak sa kanya, hindi lamang sa simpleng pagdampi.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Griyego ay pangmaramihang anyong panlalaki para sa “mga kapatid.” Dito, tumutukoy ito sa mga alagad ni Jesus at maaaring kumatawan sa isang mas malawak na pangkat.
    reason: cultural_note
lexical_decisions:
- source_word: Μή μου ἅπτου
  choice: Huwag kang kumapit sa akin
  rationale: Ipinahihiwatig ng pangkasalukuyang pautos na may μή ang pagpigil sa nagpapatuloy na paghawak. Mas tumpak dito ang “kumapit” kaysa sa payak na “humipo,” nang hindi isinasara ang iba pang posibleng diwa.
- source_word: οὔπω γὰρ ἀναβέβηκα
  choice: sapagkat hindi pa ako nakakaakyat
  rationale: Pinananatili nito ang aspektong perpekto ng Griyego at ang kontekstuwal na diwa ng pag-akyat ni Jesus patungo sa Ama.
- source_word: πρὸς τὸν πατέρα
  choice: sa Ama
  rationale: Walang panghalip na μου sa unang sugnay; kaya hindi idinagdag ang “aking,” samantalang malinaw itong lumilitaw sa kasunod na tuwirang sinabi.
- source_word: πορεύου
  choice: pumunta ka
  rationale: Natural at tuwirang pautos ito sa modernong Filipino para sa pagkilos patungo sa mga alagad.
- source_word: ἀδελφούς
  choice: mga kapatid ko
  rationale: Ang “kapatid” sa Filipino ay hindi likas na nakamarka sa kasarian at tumpak na naihahatid ang ugnayang ipinahahayag ng salitang Griyego; nililinaw sa talababa ang panggramatikang anyong panlalaki at konteksto.
- source_word: εἰπὲ αὐτοῖς
  choice: sabihin mo sa kanila
  rationale: Ito ang natural na Filipino para sa pautos na maghatid ng mensahe.
- source_word: Ἀναβαίνω
  choice: Aakyat ako
  rationale: Natural na ipinahahayag ng aspektong pangkasalukuyan sa konteksto ang nalalapit na pag-akyat. Ang “Aakyat ako” ay mas idiomatiko sa Filipino kaysa “Umaakyat ako” para sa nakatakdang nalalapit na pangyayari.
- source_word: πατέρα μου καὶ πατέρα ὑμῶν
  choice: aking Ama at inyong Ama
  rationale: Pinananatili ang sinadyang paralelismo at ang magkatabing paglalarawan ng kaugnayan ni Jesus at ng mga alagad sa Ama.
- source_word: θεόν μου καὶ θεὸν ὑμῶν
  choice: aking Diyos at inyong Diyos
  rationale: Tuwirang pinananatili ang teolohikal na mabigat na pahayag at ang paralelismo nito, nang walang pagpapalambot o pagpapakahulugang pandoktrina.
theological_decisions:
- issue: Diwa ng Μή μου ἅπτου
  choice: Pagbabawal sa patuloy na pagkapit o paghawak
  alternative: Huwag mo akong hipuin
  rationale: Mas malamang na tumutukoy ang anyo at konteksto sa nagpapatuloy na paghawak, ngunit pinananatili sa talababa ang leksikal na alternatibo.
- issue: Paglalarawan sa πατέρα sa unang sugnay
  choice: sa Ama
  alternative: sa aking Ama
  rationale: Walang μου sa unang sugnay ng tekstong Griyego. Pinananatili nito ang eksaktong pagkakaiba bago tahasang sabihin sa kasunod na sipi ang “aking Ama at inyong Ama.”
- issue: Kristolohikal na bigat ng “aking Diyos at inyong Diyos”
  choice: Tuwirang isinalin nang walang pagpapalambot
  alternative: Paraprasang nagpapahina sa “aking Diyos”
  rationale: Dapat manatili ang buong tensiyon at bigat ng mismong pahayag sa konteksto ni Juan, sa halip na baguhin upang paunang lutasin ang tanong na pandoktrina.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sapagkat” upang mapanatili ang pormal na dignidad nang hindi nagiging lipas; ang “Sa halip” ay natural na naghahatid ng salungat na δέ. Ang mga panghalip na “aking/inyong” ay nagpapanatili sa retorikal na paralelismo ng Griyego.
