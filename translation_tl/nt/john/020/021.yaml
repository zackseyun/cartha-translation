  source_fidelity: Tumpak na naipapahayag ang οὖν sa “Kaya,” ang πάλιν sa “muling,” at ang kasunod na pagbati at paghahambing. Ang “isinugo” ay natural na Tagalog para sa perpektong ἀπέσταλκεν, samantalang ang “isinusugo” ay maayos na kumakatawan sa kasalukuyang πέμπω sa tagpong ito. Hindi pinalalawak ng salin ang paghahambing ng dalawang pagsusugo.
  naturalness: Natural, malinaw, at marangal ang daloy sa makabagong Filipino. Ang “Sumainyo ang kapayapaan” ay isang matatag at madaling maunawaang taimtim na pagbati; ang ayos na “Kung paanong …, isinusugo ko rin kayo” ay idiomatiko at malinaw.
