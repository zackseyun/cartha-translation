id: JHN.20.21
reference: John 20:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ⸂ὁ Ἰησοῦς⸃ πάλιν· Εἰρήνη ὑμῖν· καθὼς ἀπέσταλκέν με ὁ πατήρ, κἀγὼ πέμπω ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/021.yaml
  text: So Jesus said to them again[a], “Peace to you. As the Father has sent me, even so I am sending you.”
translation:
  language: tl
  text: Kaya muling sinabi sa kanila ni Jesus, “Sumainyo ang kapayapaan.[a] Kung paanong isinugo ako ng Ama, isinusugo ko rin kayo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Kapayapaan ang sumainyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Ipinapakita ang pagpapatuloy at bahagyang paghinuha mula sa naunang tagpo nang natural sa makabagong Tagalog.
- source_word: πάλιν
  choice: muling
  rationale: Tuwirang ipinahihiwatig na inulit ni Jesus ang pagbati sa naunang talata.
- source_word: Εἰρήνη ὑμῖν
  choice: Sumainyo ang kapayapaan
  rationale: Natural at marangal na pagbating Tagalog na pinananatili ang maikli at walang-pandiwang diwa ng Griyego.
- source_word: καθὼς
  choice: Kung paanong
  rationale: Malinaw na ipinakikilala ang paghahambing sa pagsusugo ng Ama kay Jesus at sa pagsusugo ni Jesus sa mga alagad.
- source_word: ἀπέσταλκέν
  choice: isinugo
  rationale: Ang perpektong anyo ay tumutukoy sa natapos na pagsusugo na nananatiling mahalaga; sa Tagalog, sapat at natural ang aspektong perpektibo nang hindi kailangang dagdagan ng tahasang katumbas ng English present perfect.
- source_word: ὁ πατήρ
  choice: ang Ama
  rationale: Pinananatili ang may-artikulong katawagang Johannine nang hindi idinaragdag ang pag-aaring “aking,” na wala sa Griyego.
- source_word: κἀγὼ
  choice: ko rin
  rationale: Naipapahayag ang “at ako rin” sa natural na ayos ng Tagalog at naiuugnay ang dalawang pagsusugo.
- source_word: πέμπω
  choice: isinusugo
  rationale: Ang aspektong imperpektibo ay angkop sa kasalukuyang pagkilos ng paghirang at pagpapadala sa mismong tagpong ito.
theological_decisions:
- issue: Ugnayan ng pagsusugo ng Ama kay Jesus at ng pagsusugo ni Jesus sa mga alagad
  choice: Kung paanong isinugo ako ng Ama, isinusugo ko rin kayo.
  alternative: Kung paanong isinugo ako ng Ama, gayundin ay isinusugo ko kayo.
  rationale: Pinananatili ang paghahambing at bigat ng atas nang hindi ipinapalagay na lubos na magkapareho ang awtoridad, paraan, katungkulan, o kalikasan ng dalawang pagsusugo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sumainyo” bilang pamilyar na anyo sa isang taimtim na pagbati, habang nananatiling madaling maunawaan. Ang “isinugo/isinusugo” ay nagpapanatili sa aspektuwal na kaibahan ng dalawang pandiwang Griyego.
