  verdict: revise
  source_fidelity: Ang salin ay wastong sumusunod sa pagkakasunod ng εἶτα, pinananatili ang inuulit na utos na Φέρε, ang maramihang “mga kamay,” at ang prosesong diwa ng μὴ γίνου. Gayunman, ang “ilagay mo sa tagiliran ko” ay hindi sapat na naghahayag ng εἰς (“sa loob/papasok sa”); mas tapat ang “ipasok mo ... sa tagiliran ko.” Ang “hindi sumasampalataya, kundi sumasampalataya” ay hindi natural na pagkakabuo sa Filipino para sa pang-uring ἄπιστος / πιστός.
  naturalness: Ang “Dalhin mo rito” at “tingnan mo” ay malinaw at likas sa modernong Filipino. Ang “walang pananampalataya, kundi may pananampalataya” ay mas natural at marangal kaysa sa “hindi sumasampalataya, kundi sumasampalataya,” habang pinananatili ang kontrast ng Griyego.
  terminology: Ang “pananampalataya” ay angkop sa agarang konteksto ng paniniwala ni Tomas sa muling nabuhay na si Jesus. Hindi nito isinasara ang posibleng diwa ng “hindi tapat/tapat,” na dapat manatili sa talababa bilang alternatibong salin.
