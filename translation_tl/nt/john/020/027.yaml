  to: Pagkatapos, sinabi niya kay Tomas, “Dalhin mo rito ang daliri mo at tingnan mo ang mga kamay ko. Dalhin mo ang kamay mo at ipasok mo sa tagiliran ko. Huwag kang maging walang pananampalataya, kundi may pananampalataya.”[a]
