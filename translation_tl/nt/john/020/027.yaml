base_translation:
  language: en
  yaml_path: translation/nt/john/020/027.yaml
  text: Then he said to Thomas[a], “Bring your finger here and see my hands, and bring your hand and put it into my side, and do not become unbelieving, but believing.”
translation:
  language: tl
  text: Pagkatapos, sinabi niya kay Tomas, “Dalhin mo rito ang daliri mo at tingnan mo ang mga kamay ko. Dalhin mo ang kamay mo at ipasok mo sa tagiliran ko. Huwag kang maging walang pananampalataya, kundi may pananampalataya.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Huwag kang maging hindi tapat, kundi tapat.” Maaaring taglayin ng mga pang-uring Griyego ang alinmang diwa, ngunit sa kontekstong ito, nakasentro ang pagtutunggali sa pananampalataya ni Tomas kay Jesus na muling nabuhay.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἶτα
  choice: Pagkatapos
  rationale: Ipinakikita ang kasunod na hakbang sa salaysay at likas itong pakinggan sa modernong Filipino.
- source_word: λέγει
  choice: sinabi niya
  rationale: Bagaman historical present ang Griyego, mas natural sa salaysay na Filipino ang pangnagdaang anyo.
- source_word: Φέρε
  choice: Dalhin mo
  rationale: Pinananatili ang literal na diwa ng pagdadala o paglalapit at ang pag-uulit ng parehong pautos para sa daliri at kamay.
- source_word: δάκτυλόν σου ὧδε
  choice: ang daliri mo rito
  rationale: Direkta at natural na katumbas; pinananatili ng “rito” ang deiktikong puwersa ng ὧδε.
- source_word: ἴδε
  choice: tingnan mo
  rationale: Natural na pautos sa Filipino sa kontekstong inaanyayahan si Tomas na masdan ang mga kamay ni Jesus.
- source_word: τὰς χεῖράς μου
  choice: ang mga kamay ko
  rationale: Direktang salin na pinananatili ang maramihang bilang.
- source_word: βάλε εἰς τὴν πλευράν μου
  choice: ilagay mo sa tagiliran ko
  rationale: Ang “ilagay” ay malinaw na pautos; ang “sa tagiliran ko” ay natural sa Filipino at maaaring saklawin ang paglalagay papasok sa sugat nang hindi nagiging magaspang o labis na interpretatibo.
- source_word: μὴ γίνου
  choice: Huwag kang maging
  rationale: Pinananatili ang prosesong ipinahihiwatig ng γίνομαι, sa halip na gawing payak na estadong “huwag kang.”
- source_word: ἄπιστος
  choice: hindi sumasampalataya
  rationale: Sa agarang konteksto, ang usapin ay ang pagtugon ni Tomas sa patotoo tungkol sa muling pagkabuhay ni Jesus.
- source_word: πιστός
  choice: sumasampalataya
  rationale: Pinananatili ang tuwirang pagtutunggali sa ἄπιστος at ang pokus sa paniniwala kay Jesus na muling nabuhay.
theological_decisions:
- issue: Ang pagtutunggali ng ἄπιστος at πιστός sa payo ni Jesus kay Tomas
  choice: hindi sumasampalataya / sumasampalataya
  alternative: hindi tapat / tapat
  rationale: Nakasentro ang agarang salaysay sa pagtanggi ni Tomas na maniwala sa patotoo tungkol sa muling pagkabuhay hangga’t hindi siya nakakakita at nakakahipo. Gayunman, maaaring taglayin ng mga pang-uring Griyego ang diwa ng kawalan o pagkakaroon ng katapatan, kaya inilalahad iyon sa talababa sa halip na burahin ang tunay na saklaw ng kahulugan.
translation_notes:
  register: Modernong Filipino na natural at marangal. Pinanatili ang pag-uulit ng “Dalhin mo” at ang prosesong diwa ng “Huwag kang maging.” Ginamit ang “sumasampalataya” sa halip na mas kolokyal na “naniniwala” upang mapanatili ang teolohikal na bigat nang hindi nagiging lipas ang pananalita.
