base_translation:
  language: en
  yaml_path: translation/nt/john/020/009.yaml
  text: For they did not yet understand the Scripture[a], that he had to rise from the dead.
translation:
  language: tl
  text: 'Sapagkat hindi pa nila nauunawaan ang Kasulatan: kailangan niyang bumangon[a] mula sa mga patay.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, “kailangan siyang ibangon mula sa mga patay.” Aktibo ang pandiwang Griyego rito: “bumangon.”'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδέπω
  choice: hindi pa
  rationale: Likas na ipinapahayag sa Tagalog na hanggang sa sandaling iyon ay hindi pa nila naunawaan.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na ugnayan nito sa naunang pahayag.
- source_word: ᾔδεισαν
  choice: nauunawaan
  rationale: Sa konteksto ng Kasulatan at ng kasunod na nilalaman, ang diwa ay pag-unawa sa kahulugan, hindi lamang pagkakaalam na umiiral ito.
- source_word: τὴν γραφὴν
  choice: ang Kasulatan
  rationale: Pinananatili ang isahan at ang kahulugan nitong banal at makapangyarihang kasulatan, nang hindi ipinipilit kung isang tiyak na talata o ang pangkalahatang patotoo ng Kasulatan ang tinutukoy.
- source_word: ὅτι
  choice: ':'
  rationale: Ginamit ang tutuldok upang likas na ipakilala sa Tagalog ang nilalaman ng Kasulatang hindi pa nila nauunawaan.
- source_word: δεῖ
  choice: kailangan
  rationale: Ipinapahayag ang kinakailangang mangyari, kasama ang pahiwatig ng banal na layunin, nang hindi ito labis na ipinapaliwanag.
- source_word: αὐτὸν
  choice: niyang
  rationale: 'Likas na anyong Tagalog para sa paksa ng sugnay na pawatas: siya ang kailangang bumangon.'
- source_word: ἐκ νεκρῶν
  choice: mula sa mga patay
  rationale: Tumpak at karaniwang pahayag sa Tagalog para sa pagbangon mula sa kalagayan at kapulungan ng mga patay; kinikilala rin ang pangmaramihang anyo ng νεκρῶν.
- source_word: ἀναστῆναι
  choice: bumangon
  rationale: Pinananatili ang aktibong anyo ng pandiwang Griyego at natural itong tumutukoy sa muling pagkabuhay sa konteksto.
theological_decisions:
- issue: Pagpapahayag at ahensiya sa muling pagkabuhay
  choice: kailangan niyang bumangon mula sa mga patay
  alternative: kailangan siyang ibangon mula sa mga patay
  rationale: Aktibo ang ἀναστῆναι, kaya aktibo rin ang pangunahing salin. Ang pasibong anyo ay matatagpuan sa ibang pahayag sa Bagong Tipan, ngunit hindi ito dapat ipalit sa partikular na anyo ng talatang ito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “Kasulatan” bilang karaniwang katawagan sa banal na kasulatan, at pinanatili ang aktibong “bumangon” upang sundin ang anyo ng Griyego.
