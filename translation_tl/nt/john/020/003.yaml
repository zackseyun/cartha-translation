  yaml_path: translation/nt/john/020/003.yaml
  text: So Peter and the other disciple went out and were going to the tomb[a].
translation:
  language: tl
  text: Kaya, umalis si Pedro at ang isa pang alagad, at papunta sila sa libingan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “at nagtungo sila sa libingan.” Maaaring isalin nang mas payak ang pandiwang Griyego, ngunit mas hayagang ipinakikita ng “papunta sila” na nagpapatuloy noon ang kanilang pagpunta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: umalis
  rationale: Ang aorist ng ἐξέρχομαι ay tumutukoy sa paglabas o paglisan mula sa isang lugar. Likas sa modernong Tagalog ang “umalis” at hindi nito dinaragdagan ang teksto ng tiyak na pinanggalingang hindi binanggit sa talata.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinakikita ng οὖν ang bunga o pagpapatuloy ng salaysay mula sa naunang talata. Malinaw at natural dito ang “Kaya.”
- source_word: ὁ Πέτρος
  choice: si Pedro
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa Tagalog, kasama ang pantukoy na “si.”
- source_word: ὁ ἄλλος μαθητής
  choice: ang isa pang alagad
  rationale: Ang μαθητής ay “alagad” sa konteksto ng Ebanghelyo, at malinaw na ipinakikilala ng ἄλλος ang taong ito bilang isa pang alagad bukod kay Pedro.
- source_word: ἤρχοντο
  choice: patungo sila
  rationale: Ang imperfect na ἤρχοντο ay naglalarawan ng kilos na nagpapatuloy noon. Pinananatili ng “patungo sila” ang aspektong ito nang hindi ipinahihiwatig na nakapasok na sila sa libingan.
- source_word: εἰς τὸ μνημεῖον
  choice: sa libingan
  rationale: Sa kontekstong ito, ang μνημεῖον ay ang pinaglibingan kay Jesus. Ang “sa” ay natural na nagpapahayag ng patutunguhan at hindi nagdaragdag ng diwang pumasok sila roon.
