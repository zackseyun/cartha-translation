base_translation:
  language: en
  yaml_path: translation/nt/john/020/023.yaml
  text: If you forgive the sins of any[a], they have been forgiven them; if you retain them[b], they have been retained.
translation:
  language: tl
  text: Kung patatawarin ninyo ang mga kasalanan ng sinuman, ipinatawad na sa kanila ang mga kasalanang iyon[a]; kung pananatilihin ninyo ang mga kasalanang iyon, pinanatili na ang mga iyon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin nang mas malaya: “Kung patatawarin ninyo ang mga kasalanan ng sinuman, pinatawad na ang mga kasalanang iyon.” Ang Griyego ay gumagamit ng perfect passive, na maaaring magdiin sa isang naganap nang kilos na may nagpapatuloy na bunga.'
    reason: lexical_alternative
  - marker: b
    text: Ang “pananatilihin” ay tumutumbas sa pandiwang Griyego na may diwang paghawak o pagpapanatili. Sa kontekstong ito, kabaligtaran ito ng pagpapatawad; ang “hindi patatawarin” ay mas malayang pagpapahayag.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄν τινων
  choice: Kung ... ng sinuman
  rationale: Ipinakikita ng “kung” ang kondisyong ipinahihiwatig ng ἄν kasama ng pasaklaw, samantalang pinananatili ng “sinuman” ang di-tiyak na tinutukoy.
- source_word: ἀφῆτε
  choice: patatawarin ninyo
  rationale: Sa konteksto ng mga kasalanan, ang ἀφίημι ay likas na nangangahulugang “magpatawad.” Ang anyong Filipino ay malinaw at pangkaraniwan nang hindi dinaragdagan ang sinasabi ng teksto.
- source_word: τὰς ἁμαρτίας
  choice: ang mga kasalanan
  rationale: Tuwirang inililipat ang maramihang pangngalan at ang tiyak na layon sa natural na Filipino.
- source_word: ἀφέωνται αὐτοῖς
  choice: ipinatawad na sa kanila ang mga iyon
  rationale: Pinananatili ang balintiyak na tinig at ang mga taong tinutukoy ng αὐτοῖς. Ipinahihiwatig ng “na” ang naganap nang kilos na may nananatiling bunga, gaya ng Griyegong perfect.
- source_word: κρατῆτε
  choice: pananatilihin ninyo
  rationale: Ang κρατέω ay kasalungat dito ng pagpapatawad at may diwang paghawak o pagpapanatili. Pinananatili ng “pananatilihin” ang talinghagang nasa Griyego sa halip na agad itong ipakahulugang “hindi patatawarin.”
- source_word: κεκράτηνται
  choice: pinanatili na ang mga iyon
  rationale: Tinutularan nito ang balintiyak at resultative na perfect ng Griyego, pati ang pagkakapantay ng dalawang sugnay.
theological_decisions:
- issue: Kung ang kilos ng mga alagad mismo ang nagsasakatuparan ng pagpapatawad o kung tumutugma ito sa nauna o banal na pasiya.
  choice: 'Pinanatili ang balintiyak: “ipinatawad na” at “pinanatili na,” nang hindi tahasang pinapangalanan ang gumagawa.'
  alternative: “Pinatawad na sila ng Diyos” / “hindi sila pinatawad ng Diyos,” o ang payak na “pinatatawad” / “hindi pinatatawad.”
  rationale: Hindi tahasang pinapangalanan ng Griyego ang Diyos bilang gumagawa. Ang balintiyak at ang “na” ay nagpapanatili sa resultative na diwa at sa teolohikal na tensiyon nang hindi nagpapasok ng denominasyonal na paliwanag.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang magkatugmang ayos ng dalawang sugnay, ang balintiyak na tinig, at ang tunay na kalabuan tungkol sa di-pinangalanang gumagawa. Ang “pananatilihin” ay bahagyang pormal ngunit kailangan upang mapanatili ang leksikal na kaibhan sa “patatawarin.”
