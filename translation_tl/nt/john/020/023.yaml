review_pass:
  verdict: revise
  source_fidelity: Ang pangunahing salin ay tapat sa kondisyunal na ayos, sa maramihang 'mga kasalanan,' at sa perfect passive na resulta sa dalawang sugnay. Gayunman, ang alternatibong salin sa talababa a na 'pinatawad na siya' ay nagpapalit sa paksa mula sa mga kasalanan tungo sa tao, samantalang ang Griyego ay nagsasabing ang mga kasalanan ang pinatawad. Nilinaw rin ang tinutukoy ng mga panghalip nang hindi dinaragdagan ang di-pinangalanang gumagawa ng balintiyak.
  naturalness: Natural ang 'patatawarin ninyo' at 'ipinatawad na sa kanila.' Ang 'pananatilihin' ay bahagyang pormal ngunit katanggap-tanggap na katapat ng κρατέω at mas maingat kaysa gawing tahasang 'hindi patatawarin.' Ang pagbanggit muli ng 'mga kasalanang iyon' sa ikalawang sugnay ay nagpapalinaw sa reperente sa Filipino.
  terminology: Ang 'kasalanan,' 'patawarin,' at 'ipinatawad na' ay angkop sa makabagong Filipino at sa rehistrong pangkasulatan. Pinanatili ang 'pananatilihin' upang huwag ipasok bilang pangunahing teksto ang interpretatibong negasyon na 'hindi patatawarin.'
  issues:
