  text: λέγει αὐτῷ ὁ Ἰησοῦς· Ὅτι ἑώρακάς με πεπίστευκας; μακάριοι οἱ μὴ ἰδόντες καὶ πιστεύσαντες.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/029.yaml
  text: Jesus said to him, “Because you have seen me, you have believed? Blessed are those who have not seen and yet have believed.”
translation:
  language: tl
  text: Sinabi ni Jesus sa kanya, “Dahil nakita mo ako, sumampalataya ka ba?[a] Pinagpala ang mga hindi nakakita at sumampalataya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Dahil nakita mo ako, sumampalataya ka.” Maaaring basahin ang Griyego bilang tanong o bilang pahayag.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Sinabi sa kanya ni Jesus
  rationale: Bagaman nasa kasalukuyang panahunan ang λέγει bilang makasaysayang pangkasalukuyan, natural sa salaysay na Tagalog ang “sinabi.” Napanatili rin ang αὐτῷ bilang “sa kanya,” na tumutukoy kay Tomas.
- source_word: Ὅτι
  choice: Dahil
  rationale: Pinakamalamang na nagpapakilala ito rito ng sanhi o batayan ng pagsampalataya ni Tomas.
- source_word: ἑώρακάς με
  choice: nakita mo ako
  rationale: Natural na ipinapahayag sa Tagalog ng aspektong perpektibo ang natapos na pagkakita na may kaugnayan sa kasalukuyang kalagayan.
- source_word: πεπίστευκας
  choice: sumampalataya ka
  rationale: Ang “sumampalataya” ay natural at dignified na salin ng πιστεύω sa kontekstong ito; ipinahihiwatig ng aspektong perpektibo ang naganap na pagtugon ni Tomas.
- source_word: μακάριοι
  choice: Pinagpala
  rationale: Napananatili nito ang anyong pagpapala ng kasabihan at higit itong angkop kaysa sa pansariling damdaming ipinahihiwatig ng “maligaya.”
- source_word: οἱ μὴ ἰδόντες
  choice: ang mga hindi nakakita
  rationale: Tuwirang inilalarawan nito ang pangkat na tinutukoy ng substantival participle nang hindi nililimitahan kung ano mismo ang hindi nila nakita.
- source_word: καὶ πιστεύσαντες
  choice: ngunit sumampalataya
  rationale: Literal na “at sumampalataya,” ngunit natural na inilalabas ng “ngunit” sa Tagalog ang malinaw na pagsalungat sa pagitan ng hindi pagkakita at pagsampalataya nang hindi nagdaragdag ng bagong diwa.
theological_decisions:
- issue: Puwersang retorikal ng unang pahayag ni Jesus
  choice: 'Isinalin bilang tanong: “Dahil nakita mo ako, sumampalataya ka ba?”'
  alternative: 'Maaaring basahin bilang pahayag: “Dahil nakita mo ako, sumampalataya ka.”'
  rationale: Pinahihintulutan ng Griyego ang tanong o pahayag sapagkat ang sinaunang mga manuskrito ay walang makabagong bantas. Ang tanong ay umaayon sa retorikal na paghahambing sa kasunod na pagpapala, ngunit pinanatili sa talababa ang ibang posibleng pagbasa.
- issue: Ugnayan ng hindi pagkakita at pagsampalataya
  choice: “hindi nakakita ngunit sumampalataya”
  alternative: “hindi nakakita at sumampalataya”
  rationale: Ang καί ay karaniwang “at,” ngunit malinaw ang kontekstuwal na pagsalungat. Ang “ngunit” ay natural sa Tagalog at hindi nagsasabing walang anumang batayan o patotoo ang kanilang pananampalataya.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “sumampalataya” upang mapanatili ang relihiyoso at teolohikal na bigat ng πιστεύω, habang iniwasan ang masyadong lumang ayos ng pangungusap.
