  source_fidelity: 'Ang pangunahing ugnayan at paghahambing ay naipapahayag nang wasto: ang σουδάριον ay hindi kasama ng mga ὀθόνια kundi hiwalay. Gayunman, ang “nakatupi” ay mas tiyak kaysa sa ἐντετυλιγμένον, na mas pangunahing tumutukoy sa telang nakabalot/nakapulupot at maaaring mangahulugang nakarolyo. Ang rebisyon ay gumagamit ng mas malawak na “nakabalot” at inilalagay ang ibang posibleng pag-unawa sa talababa.'
  naturalness: Likas at malinaw ang rebisyong “na dating nasa kanyang ulo” at “hindi nakalagay na kasama.” Iniiwasan nito ang bahagyang di-likas na “nakapatong noon sa kanyang ulo,” habang hindi rin tinutukoy kung paano eksaktong nakapatong o nakabalot ang tela sa ulo.
  terminology: Ang “telang pantakip sa mukha” at “mga telang lino” ay angkop sa konteksto at pinananatili ang pagkakaiba ng σουδάριον at ng maramihang ὀθόνια. Walang idinagdag na simboliko o apologetikong kahulugan sa pagkakaayos ng mga tela.
