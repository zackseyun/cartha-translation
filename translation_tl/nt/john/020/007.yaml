  text: καὶ τὸ σουδάριον, ὃ ἦν ἐπὶ τῆς κεφαλῆς αὐτοῦ, οὐ μετὰ τῶν ὀθονίων κείμενον ἀλλὰ χωρὶς ἐντετυλιγμένον εἰς ἕνα τόπον·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/007.yaml
  text: and the face cloth[a], which had been on his head, was not lying with the linen cloths but folded up separately in one place.
translation:
  language: tl
  text: at ang telang pantakip sa mukha, na dating nasa kanyang ulo, ay hindi nakalagay na kasama ng mga telang lino, kundi hiwalay na nakabalot[a] sa isang lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nakarolyo” o “nakatiklop.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σουδάριον
  choice: telang pantakip sa mukha
  rationale: Sa konteksto ng libing at sa paliwanag na ito ay dating nasa ulo ni Jesus, malinaw at likas sa modernong Filipino ang pariralang ito. Iniiwasan nito ang mapanlinlang na literal na “panyo” habang hindi tinutukoy nang labis ang eksaktong paraan ng pagkakatakip.
- source_word: ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: nakapatong noon sa kanyang ulo
  rationale: Pinananatili nito ang payak na lokatibong diwa ng Griyego nang hindi ipinapalagay kung ang tela ay nakapalibot o nakatakip sa buong ulo.
- source_word: ὀθονίων
  choice: mga telang lino
  rationale: Tuwirang ipinahihiwatig ang materyal at pluralidad ng mga tela nang hindi nagdaragdag ng tiyak na rekonstruksiyon sa paraan ng pagbabalot sa bangkay.
- source_word: κείμενον
  choice: nakalagay
  rationale: Natural ito para sa posisyon ng isang tela sa Filipino at ipinapahayag ang kalagayang inilalarawan ng participle nang hindi nagpapahiwatig kung sino ang naglagay nito.
- source_word: χωρὶς
  choice: nang hiwalay
  rationale: Malinaw na ipinapakita ang pagkakabukod ng telang pantakip sa mukha mula sa mga telang lino.
- source_word: ἐντετυλιγμένον
  choice: nakatupi
  rationale: Maikli at natural na paglalarawan ito sa maayos na kalagayan ng tela, ngunit hindi ganap na natitiyak ng salitang Griyego kung ito ay nakatupi, nakabalot, o nakarolyo; kaya inilalahad sa talababa ang mga alternatibo.
- source_word: εἰς ἕνα τόπον
  choice: sa isang lugar
  rationale: Malapit sa anyo at diwa ng Griyego at hindi nagdaragdag ng ideya gaya ng “sarili nitong lugar” o “sa isang tabi.”
- source_word: καὶ
  choice: at
  rationale: Pinananatili ang pang-ugnay na nagpapatuloy sa paglalarawan mula sa naunang talata.
theological_decisions:
- issue: Kung ang pagkakaayos ng mga telang panlibing ay tahasang nagpapahiwatig ng isang teolohikal o apologetikong pahayag
  choice: Isinalin ang talata bilang payak na obserbasyon tungkol sa magkahiwalay na kinalalagyan at kalagayan ng mga tela.
  alternative: Ipahiwatig na ang nakatuping tela ay simbolo ng kaayusan o patunay ng isang tiyak na rekonstruksiyon ng muling pagkabuhay.
  rationale: Inilalarawan lamang ng tekstong Griyego ang nakita sa libingan; hindi nito tahasang ibinibigay ang simbolikong kahulugan o ang eksaktong pangyayaring nagbunga ng ayos na iyon.
translation_notes:
  register: Modernong Filipino na malinaw sa karaniwang mambabasa ngunit nananatiling marangal ang himig. Ginamit ang “telang pantakip sa mukha” sa halip na “panyo,” at iniwasan ang mga salitang magdaragdag ng simbolikong kahulugan na wala sa mismong talata.
