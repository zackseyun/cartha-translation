    rationale: Ang ἐπὶ τῆς κεφαλῆς αὐτοῦ ay payak na nagsasabing ang tela ay nasa kaniyang ulo. Ang “dating nasa kanyang ulo” ay mas likas at hindi nagpapasya kung ito ba ay nakapatong, nakapalibot, o nakatakip.
