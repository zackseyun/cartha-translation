  text: ἔρχεται οὖν ⸀καὶ Σίμων Πέτρος ἀκολουθῶν αὐτῷ, καὶ εἰσῆλθεν εἰς τὸ μνημεῖον· καὶ θεωρεῖ τὰ ὀθόνια κείμενα,
base_translation:
  language: en
  yaml_path: translation/nt/john/020/006.yaml
  text: Then Simon Peter also came[a], following him, and entered into the tomb; and he sees the linen cloths lying there,
translation:
  language: tl
  text: Pagkatapos, dumating din si Simon Pedro, na sumusunod sa kanya, at pumasok siya sa libingan. Nakita niya roon ang mga telang lino na nakalatag.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχεται
  choice: Dumating
  rationale: Ang historikal na pangkasalukuyan sa Griyego ay isinalin sa pangnagdaan upang maging likas ang daloy ng salaysay sa Tagalog.
- source_word: οὖν
  choice: noon
  rationale: Ipinahihiwatig nito ang pagsulong ng salaysay mula sa naunang pangyayari, nang hindi nagpapahiwatig ng mabigat na lohikal na konklusyon.
- source_word: καὶ Σίμων Πέτρος
  choice: din si Simon Pedro
  rationale: 'Inilalabas ng “din” ang pandagdag na diwa ng καί: dumating si Pedro bukod sa naunang alagad.'
- source_word: ἀκολουθῶν αὐτῷ
  choice: na sumusunod sa kanya
  rationale: Pinananatili nito ang kasabay na kilos ng participle at ang reperensiya sa naunang alagad.
- source_word: εἰσῆλθεν εἰς τὸ μνημεῖον
  choice: Pumasok siya sa libingan
  rationale: Likas at tuwirang ipinapahayag sa Tagalog ang pagpasok sa yungib o puntod na pinaglibingan.
- source_word: θεωρεῖ
  choice: nakita niyang
  rationale: Sa konteksto, tumutukoy ito sa mapagmasid na pagkakita. Ginamit ang pangnagdaan para sa natural at pare-parehong salaysay sa Tagalog.
- source_word: τὰ ὀθόνια
  choice: mga telang lino
  rationale: Tuwirang pinananatili ang materyal at maramihang anyo nang hindi ipinapasok sa pangunahing teksto ang interpretasyong “mga telang panlibing.”
- source_word: κείμενα
  choice: nakalatag doon
  rationale: Ipinahihiwatig ang kalagayan at puwesto ng mga tela; natural ito sa Tagalog at hindi nagsasaad kung sino ang naglatag.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na malinaw, marangal, at likas sa pagsasalaysay. Ginamit ang “libingan” sa halip na mas teknikal o rehiyonal na katawagan. Hindi ginaya ang pabago-bagong panahunan ng Griyegong historikal na pangkasalukuyan dahil magiging pilit ito sa karaniwang Tagalog; walang talababa dahil walang mahalagang kahulugang nawawala.
