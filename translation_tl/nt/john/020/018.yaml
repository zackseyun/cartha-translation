  text: ἔρχεται ⸀Μαριὰμ ἡ Μαγδαληνὴ ⸀ἀγγέλλουσα τοῖς μαθηταῖς ὅτι ⸀Ἑώρακα τὸν κύριον καὶ ταῦτα εἶπεν αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/018.yaml
  text: Mary Magdalene came announcing to the disciples[a], “I have seen the Lord,” and that he had said these things to her.
translation:
  language: tl
  text: Dumating si Maria Magdalena at ibinalita sa mga alagad[a], “Nakita ko ang Panginoon, at sinabi niya sa akin ang mga bagay na ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Dumating si Maria Magdalena sa mga alagad at sinabi, ‘Nakita ko ang Panginoon,’ at sinabi ng Panginoon kay Maria ang mga bagay na ito.” Maaaring unawain ang huling sugnay bilang bahagi ng ulat ni Maria o bilang komento ng tagapagsalaysay.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔρχεται
  choice: Dumating
  rationale: Ang pangkasalukuyang anyo sa Griyego ay historical present; natural itong isinasalaysay sa nakaraang panahunan sa Tagalog.
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: Maria Magdalena
  rationale: Ito ang kinagawiang anyo ng pangalan at katawagan sa modernong Tagalog.
- source_word: ἀγγέλλουσα
  choice: ibinalita
  rationale: Ipinahihiwatig ng participle ang paghahatid niya ng mensahe kasabay ng pagdating; natural at malinaw ang “ibinalita.”
- source_word: τοῖς μαθηταῖς
  choice: sa mga alagad
  rationale: Ang “mga alagad” ang pamantayan at tumpak na salin ng μαθηταῖς; hindi idinagdag ang “niya” na wala sa Griyego.
- source_word: Ἑώρακα
  choice: Nakita ko
  rationale: Bagaman perfect ang anyong Griyego at may nananatiling kabuluhan ang pagkakita, ang payak na “Nakita ko” ang natural na paraan sa Tagalog upang ipahayag ito sa konteksto.
- source_word: τὸν κύριον
  choice: ang Panginoon
  rationale: Pinananatili ng “Panginoon” ang bigat ng titulong κύριος para kay Jesus sa salaysay ng muling pagkabuhay.
- source_word: καὶ ταῦτα εἶπεν αὐτῇ
  choice: at sinabi rin niyang sinabi sa kanya ng Panginoon ang mga bagay na ito
  rationale: Itinuturing sa pangunahing teksto na nagpapatuloy ang nilalaman ng ibinalita ni Maria. Nilinaw ang tinutukoy ng implicit na paksa bilang Panginoon upang maiwasan ang malabong sunod-sunod na panghalip sa Tagalog, habang pinananatili ang “mga bagay na ito” para sa ταῦτα.
theological_decisions:
- issue: Paglalarawan sa κύριος sa konteksto ng muling pagkabuhay
  choice: ang Panginoon
  alternative: ang Guro / ang panginoon
  rationale: Ang “Panginoon” ang kinikilalang titulo para kay Jesus at pinananatili nito ang Cristolohikal na bigat nang hindi dinaragdagan ang sinasabi ng teksto.
- issue: Ugnayan ng καὶ ταῦτα εἶπεν αὐτῇ sa ulat ni Maria
  choice: 'Bahagi ng ibinalita ni Maria: sinabi rin niyang sinabi sa kanya ng Panginoon ang mga bagay na ito'
  alternative: 'Hiwalay na komento ng tagapagsalaysay: at sinabi niya sa kanya ang mga bagay na ito'
  rationale: Maaaring ipagpatuloy ng sugnay ang nilalaman ng ἀγγέλλουσα kahit walang ikalawang ὅτι, ngunit tunay na malabo ang estruktura; kaya inilagay ang alternatibo sa talababa sa halip na patahimikin ang tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “ibinalita” sa halip na mas teknikal na “inihayag,” at pinanatili ang tradisyonal at malinaw na “mga alagad” at “Panginoon.”
