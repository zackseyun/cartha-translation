  yaml_path: translation/nt/john/020/030.yaml
  text: Jesus did many other signs in the presence of the disciples[a], which are not written in this book.
translation:
  language: tl
  text: Marami pang ibang tanda[a] ang ginawa ni Jesus sa harap ng mga alagad; hindi nakasulat ang mga tandang ito sa aklat na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga himala”; ang Griyegong σημεῖα ay “mga tanda,” na nagbibigay-diin sa mga gawang tumutukoy sa kung sino si Jesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλὰ μὲν οὖν καὶ ἄλλα
  choice: Marami pang ibang
  rationale: Likas na ipinahahayag sa Filipino ang dami at karagdagang mga gawa. Hindi hiwa-hiwalay na isinalin ang mga partikulong μὲν, οὖν, at καὶ dahil ang tungkulin ng mga ito sa daloy at sa paghahambing sa kasunod na talata ay naipahihiwatig ng pangungusap at konteksto.
- source_word: σημεῖα
  choice: mga tanda
  rationale: 'Pinananatili nito ang mahalagang gamit ni Juan: mga himalang hindi lamang pagpapakita ng kapangyarihan kundi tumutukoy rin sa pagkakakilanlan ni Jesus.'
- source_word: ἐποίησεν
  choice: ginawa
  rationale: Karaniwan at tuwirang katumbas ng ποιέω sa kontekstong ito; hindi kailangan ang mas pormal na “isinagawa.”
- source_word: ἐνώπιον τῶν μαθητῶν
  choice: sa harap ng mga alagad
  rationale: Ipinakikita nitong naroon ang mga alagad bilang mga saksi, nang hindi nagdaragdag ng panghalip na “kanyang,” na wala sa Griyego.
- source_word: ἃ οὐκ ἔστιν γεγραμμένα
  choice: na hindi nakasulat
  rationale: Pinananatili ang pasibong anyo at ang kalagayang hindi nakatala sa aklat, habang natural sa Filipino.
- source_word: ἐν τῷ βιβλίῳ τούτῳ
  choice: sa aklat na ito
  rationale: Ang “aklat” ang malinaw at karaniwang tawag sa nasusulat na Ebanghelyo; hindi kailangang tukuyin ito bilang balumbon.
theological_decisions:
- issue: Gamit ni Juan sa σημεῖα
  choice: mga tanda
  alternative: mga himala
  rationale: Pinananatili ng “mga tanda” ang diin na ang mga gawang ito ay naghahayag kung sino si Jesus, sa halip na ituring lamang ang mga ito bilang pambihirang pagpapakita ng kapangyarihan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga alagad” at “aklat,” na pamilyar sa karaniwang mambabasa, at iniwasan ang sobrang pormal o teknikal na pananalita.
