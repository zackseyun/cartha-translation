id: JHN.20.19
reference: John 20:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Οὔσης οὖν ὀψίας τῇ ἡμέρᾳ ἐκείνῃ τῇ ⸀μιᾷ σαββάτων, καὶ τῶν θυρῶν κεκλεισμένων ὅπου ἦσαν οἱ ⸀μαθηταὶ διὰ τὸν φόβον τῶν Ἰουδαίων, ἦλθεν ὁ Ἰησοῦς καὶ ἔστη εἰς τὸ μέσον, καὶ λέγει αὐτοῖς· Εἰρήνη ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/019.yaml
  text: So when it was evening on that day[a], the first day of the week, and the doors had been locked where the disciples were because of fear of the Jews, Jesus came and stood in the midst of them and said to them[b], “Peace to you.”
translation:
  language: tl
  text: Nang sumapit ang gabi noong araw na iyon, ang unang araw ng linggo, nakakandado ang mga pinto sa lugar kung saan naroon ang mga alagad dahil sa takot nila sa mga Judio[a]. Dumating si Jesus at tumayo sa gitna nila, at sinabi sa kanila, “Kapayapaan sa inyo.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga pinunong Judio” o “mga taga-Judea,” depende sa kahulugan ng Ἰουδαῖοι sa kontekstong ito.
    reason: alternative_reading
  - marker: b
    text: 'Maaari ring “Sumainyo ang kapayapaan.” Literal sa Griyego: “Kapayapaan sa inyo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὔσης οὖν ὀψίας
  choice: Nang gabi na
  rationale: Ginawang likas na sugnay na panahunan sa Tagalog ang genitive absolute; ipinahihiwatig ng daloy ng salaysay ang banayad na kaugnayang dala ng οὖν nang hindi kailangang piliting lagyan ng hiwalay na pang-ugnay.
- source_word: τῇ ἡμέρᾳ ἐκείνῃ τῇ μιᾷ σαββάτων
  choice: ng araw na iyon, na unang araw ng linggo
  rationale: Pinananatili kapwa ang pagtukoy sa mismong araw na iyon at ang karaniwang kahulugan ng idyomang Griyego bilang unang araw ng linggo.
- source_word: τῶν θυρῶν κεκλεισμένων
  choice: nakakandado ang mga pinto
  rationale: Ipinapahayag ng perfect passive participle ang umiiral na kalagayan bunga ng naunang pagsasara; ang “nakakandado” ay natural sa modernong Tagalog at umaangkop sa konteksto ng pag-iingat dahil sa takot.
- source_word: ὅπου ἦσαν οἱ μαθηταὶ
  choice: sa kinaroroonan ng mga alagad
  rationale: Tuwirang ipinapahayag ang lokasyon nang hindi idinaragdag na sila ay nanunuluyan o nagkakatipon.
- source_word: διὰ τὸν φόβον τῶν Ἰουδαίων
  choice: dahil sa takot nila sa mga Judio
  rationale: Malinaw na ipinapahayag ang sanhi. Ang “nila” ay likas na paglilinaw sa Tagalog kung kaninong takot ang tinutukoy, samantalang ang “mga Judio” ay hindi nagpapakitid sa posibleng saklaw ng Ἰουδαίων.
- source_word: ἦλθεν ὁ Ἰησοῦς
  choice: Dumating si Jesus
  rationale: Likas na salaysay sa Tagalog para sa payak na aorist ng pagdating.
- source_word: ἔστη εἰς τὸ μέσον
  choice: tumayo sa gitna nila
  rationale: Pinananatili ang malinaw at kongkretong larawang pangkalawakan ng Griyego.
- source_word: λέγει αὐτοῖς
  choice: sinabi sa kanila
  rationale: Isinalin sa nakaraang panahunan ang historical present upang maging natural ang salaysay sa Tagalog.
- source_word: Εἰρήνη ὑμῖν
  choice: Kapayapaan sa inyo
  rationale: Malapit sa literal na anyo ng Griyego at likas bilang pagbati sa marangal na Tagalog.
theological_decisions:
- issue: Saklaw ng τῶν Ἰουδαίων sa Ebanghelyo ni Juan
  choice: mga Judio sa pangunahing teksto, na may talababa para sa mga posibleng kontekstuwal na kahulugan
  alternative: mga pinunong Judio; mga taga-Judea
  rationale: Hindi tahasang nililimitahan ng Griyego ang tinutukoy sa mga pinuno. Pinananatili ng pangunahing salin ang leksikal na lawak, habang nililinaw ng talababa na maaaring mas tiyak ang tinutukoy sa konteksto at iniiwasang ipakahulugan ito bilang paratang laban sa lahat ng Judio.
- issue: Anyo ng pagbating Εἰρήνη ὑμῖν
  choice: Kapayapaan sa inyo
  alternative: Sumainyo ang kapayapaan
  rationale: Ang piniling anyo ay mas malapit sa maikli at walang pandiwang pormula ng Griyego; ibinibigay sa talababa ang mas idyomatikong alternatibo nang hindi binabago ang pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang karaniwang katawagang biblikal na “mga alagad” at iniwasan ang makaluma o labis na teknikal na pananalita. Inilipat ang marker [a] sa “mga Judio,” sapagkat iyon ang aktuwal na tinatalakay ng talababa.
