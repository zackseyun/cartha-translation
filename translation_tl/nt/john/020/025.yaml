revisions:
- from: Kaya paulit-ulit na sinasabi sa kanya ng ibang mga alagad, “Nakita namin ang Panginoon.” Ngunit sinabi niya sa kanila, “Malibang makita ko sa kanyang mga kamay ang bakas ng mga pako, at maipasok ko ang aking daliri sa bakas ng mga pako, at maipasok ko ang aking kamay sa kanyang tagiliran, hinding-hindi ako maniniwala.”[a]
  to: Kaya patuloy na sinasabi ng ibang mga alagad sa kanya, “Nakita namin ang Panginoon.” Ngunit sinabi niya sa kanila, “Malibang makita ko sa kanyang mga kamay ang bakas ng mga pako, at ipasok ko ang aking daliri sa bakas ng mga pako, at ipasok ko ang aking kamay sa kanyang tagiliran, tiyak na hindi ako maniniwala.”[a]
  rationale: Inayos ang unang sugnay para sa mas natural na modernong Tagalog at mas maingat na paghahatid ng imperpektong ἔλεγον. Ginawang “ipasok ko” ang pandiwa upang tuwirang ipahayag ang βάλω ... εἰς. Inilipat ang mas absolutong tunog na “hinding-hindi” sa talababa at ginawang pangunahing salin ang “tiyak na hindi,” na pinananatili ang diin ng οὐ μή habang iginagalang ang kondisyunal na balangkas ng pangungusap.
