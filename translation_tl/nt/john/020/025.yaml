  text: ἔλεγον οὖν αὐτῷ οἱ ἄλλοι μαθηταί· Ἑωράκαμεν τὸν κύριον. ὁ δὲ εἶπεν αὐτοῖς· Ἐὰν μὴ ἴδω ἐν ταῖς χερσὶν αὐτοῦ τὸν τύπον τῶν ἥλων καὶ βάλω τὸν δάκτυλόν μου εἰς τὸν τύπον τῶν ἥλων καὶ βάλω ⸂μου τὴν χεῖρα⸃ εἰς τὴν πλευρὰν αὐτοῦ, οὐ μὴ πιστεύσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/025.yaml
  text: So the other disciples were telling him[a], “We have seen the Lord.” But he said to them, “Unless I see in his hands the mark of the nails, and put my finger into the mark of the nails, and put my hand into his side, I will certainly not believe.”
translation:
  language: tl
  text: Kaya patuloy na sinasabi ng ibang mga alagad sa kanya, “Nakita namin ang Panginoon.” Ngunit sinabi niya sa kanila, “Malibang makita ko sa kanyang mga kamay ang bakas ng mga pako, at ipasok ko ang aking daliri sa bakas ng mga pako, at ipasok ko ang aking kamay sa kanyang tagiliran, tiyak na hindi ako maniniwala.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “hinding-hindi ako maniniwala.” Napakadiin ng negasyon sa Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: paulit-ulit na sinasabi
  rationale: Ang imperpektong aspekto ay nagpapahiwatig ng patuloy o inulit na pagsasabi; malinaw itong naihahayag sa natural na Tagalog.
- source_word: οὖν
  choice: Kaya
  rationale: Pinananatili ang ugnayang pasalaysay at inferensiyal sa naunang pangyayari.
- source_word: Ἑωράκαμεν
  choice: Nakita namin
  rationale: Ang perpektong Griyego ay tumutukoy sa natapos na pagkakita na mahalaga pa rin sa kasalukuyang usapan; sa natural na Tagalog, naihahatid ito ng konteksto kahit payak na aspektong kontemplatibo ang gamitin.
- source_word: τὸν κύριον
  choice: ang Panginoon
  rationale: Pinananatili ang kristolohikal na titulo sa konteksto ng muling nabuhay na Jesus.
- source_word: Ἐὰν μὴ ἴδω
  choice: Malibang makita ko
  rationale: Natural at tuwirang ipinahahayag ang negatibong kondisyon nang hindi binabago ang lohika nito.
- source_word: τύπον τῶν ἥλων
  choice: bakas ng mga pako
  rationale: Ang τύπος dito ay nakikitang marka o impresyong iniwan ng mga pako; ang “bakas” ay kongkreto at karaniwan sa modernong Tagalog.
- source_word: βάλω τὸν δάκτυλόν μου εἰς
  choice: maipasok ko ang aking daliri sa
  rationale: Pinananatili ng “maipasok” ang direksiyong papaloob na ipinahahayag ng εἰς at ang matingkad na hinihingi ni Tomas.
- source_word: τὴν πλευρὰν αὐτοῦ
  choice: kanyang tagiliran
  rationale: Ang πλευρά ay tumutukoy sa tagiliran o bahagi ng katawan sa gilid; “tagiliran” ang natural at tiyak na katumbas.
- source_word: οὐ μὴ πιστεύσω
  choice: hinding-hindi ako maniniwala
  rationale: Ang dobleng negatibong οὐ μή kasama ng aorist subjunctive ay mariing pagtanggi; ang “hinding-hindi” ay natural na Tagalog na nagpapanatili sa diin.
theological_decisions:
- issue: Lakas at saklaw ng pagtanggi ni Tomas sa οὐ μὴ πιστεύσω
  choice: hinding-hindi ako maniniwala
  alternative: tiyak na hindi ako maniniwala
  rationale: Pinananatili ang napakadiing negasyon ng Griyego. Dahil nakapaloob ito sa kondisyong “malibang,” hindi ito ipinapakahulugang walang hanggang imposibilidad ng pananampalataya, kundi mariing pagtanggi hangga't hindi natutugunan ang kundisyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “paulit-ulit na sinasabi” upang maipakita ang imperpektong aspekto, at “bakas,” “pako,” at “tagiliran” para sa malinaw at kongkretong paglalarawan.
