id: JHN.20.12
reference: John 20:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ θεωρεῖ δύο ἀγγέλους ἐν λευκοῖς καθεζομένους, ἕνα πρὸς τῇ κεφαλῇ καὶ ἕνα πρὸς τοῖς ποσίν, ὅπου ἔκειτο τὸ σῶμα τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/012.yaml
  text: and she sees two angels in white sitting[a], one at the head and one at the feet[b], where the body of Jesus had been lying.
translation:
  language: tl
  text: At nakita niya ang dalawang anghel na nakaputi[a] at nakaupo, isa sa may ulunan at isa sa may paanan, kung saan dating nakahimlay[b] ang katawan ni Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “nakasuot ng puti.” Literal sa Griyego: “nasa puti.”'
    reason: lexical_alternative
  - marker: b
    text: O “nakahimlay.” Ipinahihiwatig ng anyong imperfect sa Griyego ang kalagayan ng katawan noon; nililinaw ng “dating nakahimlay” na nauna ang kalagayang iyon sa kasalukuyang tagpo.
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρεῖ
  choice: nakita niya
  rationale: Bagaman nasa pangkasalukuyang anyo ang Griyego bilang masiglang pangkasaysayang pagsasalaysay, mas natural sa makabagong Tagalog ang aspektong naganap na “nakita” sa kontekstong ito. Ang “niya” ay tumutukoy kay Maria Magdalena mula sa naunang konteksto.
- source_word: ἀγγέλους
  choice: mga anghel
  rationale: Sa tagpo ng libingang walang laman at sa paglalarawang nakaputi sila, malinaw na mga makalangit na nilalang ang tinutukoy, hindi karaniwang mga mensahero.
- source_word: ἐν λευκοῖς
  choice: nakaputi
  rationale: Natural at maikli itong katumbas ng literal na “nasa puti,” at nagpapahiwatig ng puting kasuotan nang hindi nagdaragdag ng di-tiyak na detalye.
- source_word: καθεζομένους
  choice: nakaupo
  rationale: Tuwirang inilalarawan nito ang posisyon ng mga anghel at natural sa Tagalog.
- source_word: ἕνα πρὸς τῇ κεφαλῇ καὶ ἕνα πρὸς τοῖς ποσίν
  choice: isa sa may ulunan at isa sa may paanan
  rationale: Ipinahihiwatig ng πρός na malapit o nasa dako ng ulo at mga paa. Ang “ulunan” at “paanan” ay likas na tawag sa dalawang dulo ng hinimlayan.
- source_word: ὅπου
  choice: kung saan
  rationale: Payak at natural na katumbas ng panuring na pook sa Griyego.
- source_word: ἔκειτο
  choice: dating nakahimlay
  rationale: Ipinapakita ng imperfect ang dating nagpapatuloy na kalagayan ng katawan sa lugar na iyon. Nililinaw ng “dating” na wala na roon ang katawan sa sandali ng pagkakita, samantalang ang “nakahimlay” ay marangal at angkop sa konteksto.
- source_word: σῶμα τοῦ Ἰησοῦ
  choice: ang katawan ni Jesus
  rationale: Ang “katawan” ang karaniwan at magalang na katumbas ng σῶμα; natural sa Tagalog ang pang-ukol na “ni” sa pangalan ni Jesus.
theological_decisions:
- issue: Kalikasan ng ἀγγέλους sa konteksto ng muling pagkabuhay
  choice: mga makalangit na anghel
  alternative: mga mensahero
  rationale: Bagaman maaaring mangahulugang “mensahero” ang ἄγγελος, itinuturo ng libingang walang laman at ng puting kasuotan na mga anghel ang tinutukoy. Pasiyang leksikal at kontekstuwal ito, hindi pagdaragdag ng doktrina.
- issue: Pamanahong diwa ng ἔκειτο
  choice: dating nakahimlay
  alternative: nakahimlay / nakahiga
  rationale: 'Pinananatili ng “dating” ang dating kalagayang ipinahihiwatig ng imperfect at ang lohika ng tagpo: naroon noon ang katawan ngunit wala na sa oras ng pagkakita. Hindi nito ipinapaliwanag nang lampas sa konteksto kung paano nawala ang katawan.'
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “ulunan” at “paanan” bilang natural na pagtukoy sa magkabilang dulo ng hinimlayan, at iniwasan ang labis na pormal o makalumang pananalita.
