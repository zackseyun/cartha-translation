  source_fidelity: Tumpak ang salin sa SBLGNT. Naipapahayag ng “nakita niya” ang masiglang pangkasaysayang pangkasalukuyan sa natural na Tagalog na salaysay; ang “dalawang anghel na nakaputi at nakaupo” ay tumutugon sa ἐν λευκοῖς καθεζομένους. Ang “isa sa may ulunan at isa sa may paanan” ay wastong naghahayag ng dalawang posisyon, at ang “kung saan dating nakahimlay ang katawan ni Jesus” ay maingat na naghahayag ng dating kalagayang tinutukoy ng ἔκειτο sa konteksto.
