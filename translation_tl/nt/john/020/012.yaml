  terminology: Ang “anghel,” “katawan ni Jesus,” “nakaputi,” at “nakahimlay” ay pare-pareho, magalang, at angkop sa konteksto. Hindi ipinapasok ng salin ang anumang denominasyonal na pagpapakahulugan.
