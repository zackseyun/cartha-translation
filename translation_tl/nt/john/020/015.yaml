revisions:
- from: Sinabi sa kanya ni Jesus, “Ginang, bakit ka umiiyak? Sino ang hinahanap mo?” Sa pag-aakalang hardinero siya, sinabi niya kay Jesus, “Ginoo[a], kung ikaw ang nagdala sa kanya mula rito, sabihin mo sa akin kung saan mo siya inilagay, at ako ang kukuha sa kanya.”
  to: Sinabi ni Jesus sa kanya, “Ginang, bakit ka umiiyak? Sino ang hinahanap mo?” Sa pag-aakalang si Jesus ang hardinero, sinabi niya sa kanya, “Ginoo[a], kung ikaw ang nagdala sa kanya, sabihin mo sa akin kung saan mo siya inilagay, at ako ang magdadala sa kanya.”
  rationale: Inalis ang di-binanggit na “mula rito,” at pinalitan ang huling pandiwa upang malinaw na maipahayag ang hinaharap na layunin ni Maria at ang diwang pagdadala/pag-aalis ng ἀρῶ. Nilinaw rin na si Jesus ang inaakala niyang hardinero nang hindi binabago ang maling palagay na nasa Griyego.
