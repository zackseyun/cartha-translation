id: JHN.20.15
reference: John 20:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: λέγει ⸀αὐτῇ Ἰησοῦς· Γύναι, τί κλαίεις; τίνα ζητεῖς; ἐκείνη δοκοῦσα ὅτι ὁ κηπουρός ἐστιν λέγει αὐτῷ· Κύριε, εἰ σὺ ἐβάστασας αὐτόν, εἰπέ μοι ποῦ ἔθηκας αὐτόν, κἀγὼ αὐτὸν ἀρῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/015.yaml
  text: Jesus says to her[a], “Woman, why are you weeping? Whom are you seeking?” She, supposing that he was the gardener, says to him, “Sir, if you carried him away, tell me where you put him, and I will take him away.”
translation:
  language: tl
  text: Sinabi ni Jesus sa kanya, “Ginang, bakit ka umiiyak? Sino ang hinahanap mo?” Sa pag-aakalang si Jesus ang hardinero, sinabi niya sa kanya, “Ginoo[a], kung ikaw ang nagdala sa kanya, sabihin mo sa akin kung saan mo siya inilagay, at ako ang magdadala sa kanya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Panginoon.” Ang salitang Griego na κύριε ay maaaring gamiting magalang na pantawag na “Ginoo” rito, yamang inaakala ni Maria na hardinero ang kausap niya.
    reason: alternative_reading
lexical_decisions:
- source_word: Γύναι
  choice: Ginang
  rationale: Magalang na pantawag ang bokatibong γύναι sa kontekstong ito. Iniiwasan ng “Ginang” ang posibleng mapanlait o matalas na dating ng tuwirang “Babae” sa modernong Filipino.
- source_word: τί κλαίεις
  choice: bakit ka umiiyak
  rationale: Idyomatikong humihingi ng dahilan ang τί, at natural na katumbas ng κλαίω sa Filipino ang “umiiyak.”
- source_word: τίνα ζητεῖς
  choice: Sino ang hinahanap mo
  rationale: Tumutukoy ang τίνα sa isang tao, at malinaw at natural na ipinapahayag ng “hinahanap” ang ζητεῖς.
- source_word: δοκοῦσα ὅτι ὁ κηπουρός ἐστιν
  choice: Sa pag-aakalang hardinero siya
  rationale: Pinananatili nito ang maling palagay ni Maria nang hindi dinaragdagan ang antas ng katiyakan.
- source_word: Κύριε
  choice: Ginoo
  rationale: Bagaman maaari ring mangahulugang “Panginoon” ang κύριε, ang konteksto ay magalang na pakikipag-usap sa isang lalaking inaakala ni Maria na hardinero.
- source_word: ἐβάστασας αὐτόν
  choice: nagdala sa kanya mula rito
  rationale: Ipinahihiwatig ng βαστάζω ang pisikal na pagbuhat o pagdadala; nililinaw ng “mula rito” ang pag-aalis sa katawan ayon sa konteksto nang hindi tinutukoy ang isang di-binanggit na patutunguhan.
- source_word: ποῦ ἔθηκας αὐτόν
  choice: kung saan mo siya inilagay
  rationale: Direkta at natural na katumbas ng τίθημι ang “inilagay” sa konteksto ng kinaroroonan ng katawan.
- source_word: κἀγὼ αὐτὸν ἀρῶ
  choice: at ako ang kukuha sa kanya
  rationale: Naipapahayag nito ang hinaharap na layunin ni Maria na kunin o alisin ang katawan, habang nananatiling natural sa Filipino.
theological_decisions:
- issue: Kahulugan ng κύριε sa pakikipag-usap ni Maria bago niya makilala ang muling nabuhay na si Jesus
  choice: Ginoo
  alternative: Panginoon
  rationale: Inaakala ni Maria na hardinero ang kausap niya, kaya mas malamang na magalang na pantawag ang κύριε kaysa isang pagkilalang kristolohikal. Itinatala sa talababa ang literal at teolohikal na mahalagang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Ginang” sa halip na “Babae” upang maiparating ang magalang na gamit ng Γύναι at maiwasan ang di-sinasadyang matalas na dating. Pinalitan ng “kay Jesus” ang isang posibleng malabong panghalip sa ikalawang sugnay upang maging malinaw ang tinutukoy sa Filipino.
