id: JHN.20.24
reference: John 20:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Θωμᾶς δὲ εἷς ἐκ τῶν δώδεκα, ὁ λεγόμενος Δίδυμος, οὐκ ἦν μετ’ αὐτῶν ὅτε ⸀ἦλθεν Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/024.yaml
  text: Thomas[a], one of the Twelve, the one called Didymus, was not with them when Jesus came.
translation:
  language: tl
  text: 'Si Tomas naman, isa sa Labindalawa, na tinatawag na Didimo[a], ay hindi nila kasama nang dumating si Jesus.


    [a] Ang pangalang Griyegong “Didimo” ay nangangahulugang “Kambal.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pangalang Griyegong “Didimo” ay nangangahulugang “Kambal.”
    reason: Ipinaliliwanag ang kahulugan ng Griyegong Δίδυμος, na pinanatili bilang katawagang pantangi sa teksto.
lexical_decisions:
- source_word: δὲ
  choice: naman
  rationale: Ipinahihiwatig nito ang banayad na paglipat at paghahambing kay Tomas sa mga alagad na nabanggit, nang hindi ito ginagawang matinding pagsalungat.
- source_word: εἷς ἐκ τῶν δώδεκα
  choice: isa sa Labindalawa
  rationale: Pinananatili ang kinikilalang katawagan sa pangkat ng mga apostol; ang malaking titik ay nagpapakitang titulo ito ng pangkat.
- source_word: ὁ λεγόμενος Δίδυμος
  choice: na tinatawag na Didimo[a]
  rationale: Isinasalin sa nakaugaliang anyong Filipino ang Griyegong katawagan at ipinapaliwanag sa talababa ang literal na kahulugan nitong “Kambal.”
- source_word: οὐκ ἦν μετ’ αὐτῶν
  choice: ay hindi nila kasama
  rationale: Natural na Filipino para sa kawalan ni Tomas sa piling ng pangkat noong pagkakataong iyon.
- source_word: ὅτε ἦλθεν Ἰησοῦς
  choice: nang dumating si Jesus
  rationale: Tuwirang ipinapahayag ang pagdating ni Jesus sa partikular na pagkakataong tinutukoy.
theological_decisions:
- issue: Paglalahad sa Δίδυμος
  choice: Didimo, na may talababa tungkol sa kahulugang “Kambal”
  alternative: Kambal
  rationale: Pinananatili nito ang katawagang pantangi sa pangunahing teksto habang malinaw pa ring naihahatid sa mambabasa ang leksikal na kahulugan nito; walang idinadagdag na doktrinal na pagpapakahulugan.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “naman” bilang banayad na panandang diskurso at ang “Labindalawa” bilang kinikilalang titulo ng pangkat.
