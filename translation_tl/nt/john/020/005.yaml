base_translation:
  language: en
  yaml_path: translation/nt/john/020/005.yaml
  text: And stooping to look in[a], he sees the linen cloths lying there, yet he did not enter.
translation:
  language: tl
  text: At pagyuko niya upang sumilip, nakita niya ang mga telang lino na nakalatag doon,[a] ngunit hindi siya pumasok.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nakita niyang nakalatag ang mga telang lino”; maaaring iugnay nang mas malapit ang Griyegong participle sa “mga telang lino” nang hindi tahasang idinaragdag ang “doon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακύψας
  choice: pagyuko niya upang sumilip
  rationale: Ipinahahayag ng aorist participle ang pagyuko sa bukana ng libingan at ang pagsilip sa loob; likas itong pakinggan sa makabagong Filipino.
- source_word: βλέπει
  choice: nakita niya
  rationale: Bagaman historical present ang Griyego, mas likas at malinaw sa salaysay na Filipino ang nagdaang panahong “nakita,” nang hindi binabago ang pangyayari.
- source_word: κείμενα
  choice: nakalatag doon
  rationale: Inilalarawan ng κεῖμαι ang mga telang nasa nakahigang kalagayan o pagkakalagay; ipinahihiwatig ng “doon” ang lokasyon sa libingan na malinaw sa konteksto.
- source_word: τὰ ὀθόνια
  choice: ang mga telang lino
  rationale: Tuwirang tinutukoy ng ὀθόνια ang maliliit o maramihang telang lino; sapat na ang konteksto upang maunawaang kaugnay ang mga ito sa paglilibing.
- source_word: οὐ μέντοι
  choice: ngunit hindi
  rationale: Pinananatili nito ang banayad na pagsalungat sa pagitan ng pagkakita niya at ng hindi niya pagpasok.
- source_word: εἰσῆλθεν
  choice: siya pumasok
  rationale: Ang “pumasok” ang tuwiran, natural, at angkop na katumbas ng aorist na pandiwang εἰσῆλθεν.
