  text: καὶ λέγουσιν αὐτῇ ἐκεῖνοι· Γύναι, τί κλαίεις; λέγει αὐτοῖς ὅτι Ἦραν τὸν κύριόν μου, καὶ οὐκ οἶδα ποῦ ἔθηκαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/013.yaml
  text: And they said to her[a], “Woman, why are you weeping?” She said to them, “They have taken away my Lord[b], and I do not know where they have put him.”
translation:
  language: tl
  text: At sinabi nila sa kanya, “Babae, bakit[a] ka umiiyak?” Sinabi niya sa kanila, “Inalis nila ang Panginoon ko[b], at hindi ko alam kung saan nila siya inilagay.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ano ang iniiyakan mo?” ngunit ang diwa ng tanong sa Tagalog ay “bakit ka umiiyak?”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “amo ko.” Ang Griyegong kyrios ay maaaring mangahulugang “Panginoon” o magsilbing magalang na titulo, depende sa konteksto.
    reason: alternative_reading
lexical_decisions:
- source_word: Γύναι
  choice: Ginang
  rationale: Isang magalang na pantawag ang bokatibong Γύναι sa kontekstong ito. Mas likas at magalang sa modernong Tagalog ang “Ginang” kaysa sa tuwirang “Babae,” na maaaring marinig bilang brusko o mapanlait.
- source_word: τί
  choice: bakit
  rationale: Bagaman “ano” ang literal na kahulugan ng τί, ang pariralang τί κλαίεις ay likas na nagtatanong ng dahilan; “bakit ka umiiyak?” ang natural na katumbas sa Tagalog.
- source_word: κλαίεις
  choice: ka umiiyak
  rationale: Ipinahihiwatig ng pangkasalukuyang anyo ang nagpapatuloy na pag-iyak. Karaniwan, malinaw, at angkop sa marangal na salaysay ang “umiiyak.”
- source_word: Ἦραν
  choice: Kinuha nila
  rationale: Tumutukoy ang aoristo sa isang natapos na pagkilos. Sa konteksto ng libingan, malinaw na ipinahihiwatig ng “kinuha” ang pag-aalis sa kinaroroonan nang hindi nagdaragdag ng hindi tahasang detalye.
- source_word: κύριόν
  choice: Panginoon
  rationale: Pinananatili ng “Panginoon” ang karaniwang salin ng κύριος at ang posibilidad na ito ay kapuwa magalang na titulo at may mas malalim na kristolohikal na diwa.
- source_word: οὐκ οἶδα
  choice: hindi ko alam
  rationale: Ang οἶδα ay may pangkasalukuyang kahulugan ng kalagayan ng pagkaalam; natural itong isalin bilang “hindi ko alam.”
- source_word: ποῦ ἔθηκαν αὐτόν
  choice: kung saan nila siya inilagay
  rationale: Ang τίθημι rito ay nangangahulugang maglagay o maglapat sa isang lugar. Malinaw at natural ang “inilagay” at hindi nito ipinapalagay kung saan o paano iyon ginawa.
- source_word: ἐκεῖνοι
  choice: nila
  rationale: Itinuturo ng demonstratibo ang mga kausap na binanggit sa konteksto. Sapat at natural sa Tagalog ang panghalip na “nila” nang hindi inuulit ang tahasang pagkakakilanlan nila.
theological_decisions:
- issue: Pagkakasalin ng κύριος sa sinabi ni Maria
  choice: Panginoon ko
  alternative: amo ko
  rationale: Maaaring gumana ang κύριος bilang magalang na titulo, ngunit sa Ebanghelyo ni Juan maaari rin itong magkaroon ng kristolohikal na bigat. Pinananatili ng “Panginoon” ang dalawang posibilidad sa halip na paliitin ito sa isang panlipunang tawag lamang.
- issue: Tono ng Γύναι
  choice: Ginang
  alternative: Babae
  rationale: Magalang ang salitang Griyego sa kontekstong ito. Iniiwasan ng “Ginang” ang posibleng brusko o mapanlait na dating ng bokatibong “Babae” sa kasalukuyang Tagalog, nang hindi nagdaragdag ng sentimental na himig.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal, na may bahagyang pormal na himig na angkop sa salaysay ng Kasulatan. Ginamit ang “Ginang” bilang likas na magalang na pantawag at iniwasan ang labis na kolokyal na anyo.
