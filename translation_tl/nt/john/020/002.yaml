  text: τρέχει οὖν καὶ ἔρχεται πρὸς Σίμωνα Πέτρον καὶ πρὸς τὸν ἄλλον μαθητὴν ὃν ἐφίλει ὁ Ἰησοῦς, καὶ λέγει αὐτοῖς· Ἦραν τὸν κύριον ἐκ τοῦ μνημείου, καὶ οὐκ οἴδαμεν ποῦ ἔθηκαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/002.yaml
  text: So she runs and comes to Simon Peter and to the other disciple[a], whom Jesus loved, and says to them, “They have taken the Lord out of the tomb[b], and we do not know where they have laid him.”
translation:
  language: tl
  text: Kaya tumakbo siya at pumunta kay Simon Pedro at sa isa pang alagad[a], na mahal ni Jesus. Sinabi niya sa kanila, “Kinuha nila ang Panginoon mula sa libingan, at hindi namin alam kung saan nila siya inilagay.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Griyego: “ang isa pang alagad, na mahal ni Jesus.” Ang pandiwa ay mula sa φιλέω, na maaaring magpahiwatig ng magiliw na pagmamahal; maaari rin itong isaling “na kinagigiliwan ni Jesus.”'
    reason: lexical_alternative
  - marker: b
    text: Sinabi ni Maria, “hindi namin alam,” ayon sa unang panauhang maramihan sa Griyego. Maaaring unawain ito ng ilan na may iba pang mga babaeng kasama niya, ngunit hindi ipinaliliwanag ng teksto kung sino ang saklaw ng “namin.”
    reason: alternative_reading
lexical_decisions:
- source_word: τρέχει
  choice: tumakbo
  rationale: Ang Griyego ay makasaysayang pangkasalukuyan na nagbibigay-sigla sa salaysay; natural sa makabagong Tagalog na gamitin ang pangnagdaan sa magkakasunod na kilos nang hindi nawawala ang agarang dating ng tagpo.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinahihiwatig nito na ang kilos ay bunga ng natuklasan sa naunang talata; natural at malinaw ang “Kaya” sa Tagalog.
- source_word: ἔρχεται πρὸς
  choice: pumunta kay
  rationale: Ipinapahayag ng πρός ang paglapit o pagpunta sa isang tao. Mas natural dito ang “pumunta kay” kaysa literal na “dumating kay.”
- source_word: τὸν ἄλλον μαθητήν
  choice: sa isa pang alagad
  rationale: Ang μαθητής ay “alagad” sa konteksto ng Ebanghelyo; ipinapanatili ng “isa pang” ang pagkakaiba niya kay Pedro nang hindi ipinapalagay ang kaniyang pangalan.
- source_word: ὃν ἐφίλει ὁ Ἰησοῦς
  choice: na minamahal ni Jesus
  rationale: Ang φιλέω ay tumutukoy sa pag-ibig o magiliw na pagmamahal. Ang “minamahal” ay natural at marangal, habang hindi pinahihina ang diwa bilang basta pagkagiliw.
- source_word: λέγει αὐτοῖς
  choice: Sinabi niya sa kanila
  rationale: Bagaman makasaysayang pangkasalukuyan ang Griyego, ang pangnagdaang anyo ang natural na daloy ng salaysay sa Tagalog.
- source_word: Ἦραν τὸν κύριον ἐκ τοῦ μνημείου
  choice: Kinuha nila ang Panginoon mula sa libingan
  rationale: Ang αἴρω ay “kunin” o “alisin,” at ang μνημεῖον dito ay libingang pinaglagyan ng bangkay. Ang “mula sa libingan” ay malinaw at idiomatiko.
- source_word: οὐκ οἴδαμεν
  choice: hindi namin alam
  rationale: Tahasang unang panauhang maramihan ang Griyego. Ang eksklusibong “namin” ang natural dahil kausap ni Maria ang dalawang alagad at tumutukoy siya sa grupong kinabibilangan niya, hindi sa mga kausap.
- source_word: ποῦ ἔθηκαν αὐτόν
  choice: kung saan nila siya inilagay
  rationale: Ang τίθημι ay “ilagay” o “ihimlay.” Ang “inilagay” ay natural at hindi nagpapalagay na muli siyang inilibing.
theological_decisions:
- issue: Pagtawag kay Jesus na κύριος
  choice: ang Panginoon
  alternative: ang Guro / ang panginoon
  rationale: Sa konteksto, ito ay magalang at kristolohikal na titulo para kay Jesus. Pinananatili ng “Panginoon” ang karaniwang bigat ng κύριος nang hindi ito pinabababa sa “Guro” lamang.
- issue: Maramihang οἴδαμεν sa sinabi ni Maria
  choice: hindi namin alam
  alternative: hindi ko alam
  rationale: Pinananatili ang tahasang maramihan sa Griyego at hindi ipinapaliwanag sa mismong salin kung sino ang iba pang kasama sa “namin.” Sa gayon, hindi nilulutas nang sapilitan ang tensiyon sa salaysay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang natural na pangnagdaang salaysay sa Tagalog sa halip na gayahin nang mekanikal ang mga makasaysayang pangkasalukuyan ng Griyego. Pinanatili ang “alagad,” “Panginoon,” at ang maramihang “namin,” kasama ang mga talababa para sa tunay na leksikal at pansalaysay na kalabuan.
