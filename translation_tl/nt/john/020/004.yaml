  text: ἔτρεχον δὲ οἱ δύο ὁμοῦ· καὶ ὁ ἄλλος μαθητὴς προέδραμεν τάχιον τοῦ Πέτρου καὶ ἦλθεν πρῶτος εἰς τὸ μνημεῖον,
base_translation:
  language: en
  yaml_path: translation/nt/john/020/004.yaml
  text: The two were running together[a], and the other disciple ran ahead faster than Peter and came first to the tomb.
translation:
  language: tl
  text: Magkasamang tumatakbo ang dalawa, at naunahan ng ibang alagad si Pedro sa pagtakbo at siya ang unang nakarating sa libingan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔτρεχον
  choice: tumatakbo
  rationale: Ipinahihiwatig ng imperpektong panahunan ang nagpapatuloy na kilos sa nakaraan; natural itong naipapahayag sa Filipino sa pamamagitan ng aspektong imperpektibo.
- source_word: δὲ
  choice: at
  rationale: Banayad na pang-ugnay ito rito. Ang “at” ay umaayon sa daloy ng salaysay nang hindi nagdaragdag ng matinding pagsalungat.
- source_word: οἱ δύο ὁμοῦ
  choice: magkasama ang dalawa
  rationale: Pinananatili nito kapwa ang tahasang pagtukoy sa dalawa at ang ideya ng magkasamang pagkilos.
- source_word: ὁ ἄλλος μαθητής
  choice: ang isa pang alagad
  rationale: Sa konteksto ng dalawang alagad, likas sa Filipino ang “isa pang alagad” para tukuyin ang alagad na hindi si Pedro.
- source_word: προέδραμεν τάχιον τοῦ Πέτρου
  choice: naunahan ... si Pedro sa pagtakbo
  rationale: Likas at malinaw na ipinapahayag nito ang pinagsamang diwa ng pagtakbo sa unahan at ng paghahambing na mas mabilis kaysa kay Pedro.
- source_word: ἦλθεν πρῶτος
  choice: siya ang unang nakarating
  rationale: Malinaw nitong ipinahahayag na ang isa pang alagad ang unang dumating, habang nananatiling natural sa makabagong Filipino.
- source_word: εἰς τὸ μνημεῖον
  choice: sa libingan
  rationale: Ang μνημεῖον ay ang pinaglibingan kay Jesus. Ang “sa” ay nagpapahiwatig ng pagdating sa pook, hindi ng pagpasok dito, gaya ng nililinaw ng kasunod na talata.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “alagad” at “libingan,” mga karaniwang terminong biblikal na madaling maunawaan. Iningatan ang progresibong kilos at ang pagkakasunod ng pagdating nang hindi nagpapasok ng di-kinakailangang interpretasyon.
