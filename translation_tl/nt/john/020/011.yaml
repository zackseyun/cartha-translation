  yaml_path: translation/nt/john/020/011.yaml
  text: But Mary was standing outside the tomb, weeping. So, as she was weeping, she bent over to look into the tomb,
translation:
  language: tl
  text: Ngunit si Maria ay nakatayo sa labas ng libingan, at umiiyak. Habang umiiyak siya, yumuko siya upang tumingin sa loob ng libingan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “dumungaw siya sa loob ng libingan.” Kasama sa pandiwang Griyego ang diwa ng pagyuko upang tumingin.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig ang banayad na pagsalungat o paglipat ng salaysay mula sa pag-alis ng mga alagad tungo kay Maria.
- source_word: εἱστήκει
  choice: ay nakatayo
  rationale: 'Pinananatili ang patuloy na kalagayan na ipinahihiwatig ng anyong pandiwa: naroon pa ring nakatayo si Maria.'
- source_word: πρὸς τῷ μνημείῳ ἔξω
  choice: sa labas, sa tabi ng libingan
  rationale: Pinananatili ang kapuwa lokasyong nasa labas at ang pagiging malapit o katabi ng libingan, nang hindi ipinapalagay na nasa ibabaw lamang siya ng bungad.
- source_word: μνημεῖον
  choice: libingan
  rationale: Karaniwan, malinaw, at marangal na salitang Filipino para sa himlayang nasa konteksto ng paglilibing kay Jesus.
- source_word: κλαίουσα / ἔκλαιεν
  choice: umiiyak / Habang umiiyak
  rationale: Ipinakikita ang nagpapatuloy na pag-iyak ni Maria at pinananatili ang pag-uulit sa Griyego.
- source_word: ὡς οὖν
  choice: Habang
  rationale: Likas na iniuugnay sa Filipino ang kasunod na kilos sa nagpapatuloy niyang pag-iyak; hindi pinalalabis ang lohikal na diwa ng οὖν.
- source_word: παρέκυψεν
  choice: yumuko siya upang tumingin
  rationale: Ipinahahayag ang pagyuko o pagdungaw na ginawa upang makatingin sa loob, ayon sa saklaw ng pandiwang Griyego.
- source_word: εἰς τὸ μνημεῖον
  choice: sa loob ng libingan
  rationale: Malinaw na ipinakikita ang direksiyon ng tingin tungo sa loob ng libingan.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na natural at marangal. Ginamit ang “libingan” sa halip na mas luma o hindi gaanong karaniwang katawagan. Ang “sa labas, sa tabi ng libingan” ay bahagyang mas tahasang anyo upang mapanatili ang dalawang elementong pansaklaw ng pariralang Griyego.
