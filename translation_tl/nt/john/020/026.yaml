id: JHN.20.26
reference: John 20:26
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ μεθ’ ἡμέρας ὀκτὼ πάλιν ἦσαν ἔσω οἱ μαθηταὶ αὐτοῦ καὶ Θωμᾶς μετ’ αὐτῶν. ἔρχεται ὁ Ἰησοῦς τῶν θυρῶν κεκλεισμένων, καὶ ἔστη εἰς τὸ μέσον καὶ εἶπεν· Εἰρήνη ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/026.yaml
  text: And after eight days, his disciples were inside again, and Thomas was with them. Jesus comes, though the doors had been shut, and stood in the midst and said, “Peace to you.”
translation:
  language: tl
  text: Pagkaraan ng walong araw, muling nasa loob ang kanyang mga alagad, at kasama nila si Tomas. Dumating si Jesus kahit nakasara ang mga pinto, tumayo sa gitna nila, at sinabi, “Kapayapaan sa inyo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεθ’ ἡμέρας ὀκτώ
  choice: Pagkaraan ng walong araw
  rationale: Pinananatili ang literal na bilang at likas na naipahahayag sa modernong Tagalog; hindi tahasang nilulutas kung inklusibo ang sinaunang pagbilang.
- source_word: ἔσω
  choice: nasa loob
  rationale: Direkta at natural na katumbas; hindi nagdaragdag ng tiyak na uri ng gusali o silid.
- source_word: ἔρχεται
  choice: Dumating
  rationale: Isinasalin ang makasaysayang pangkasalukuyan sa natural na Tagalog na pasalaysay, habang pinananatili ang biglaang pagdating ni Jesus sa tagpo.
- source_word: τῶν θυρῶν κεκλεισμένων
  choice: kahit nakasara ang mga pinto
  rationale: Ipinahahayag ang concessive na ugnayang likas sa konteksto nang hindi ipinapaliwanag kung paano pumasok si Jesus.
- source_word: ἔστη εἰς τὸ μέσον
  choice: tumayo sa gitna nila
  rationale: Natural na Tagalog na nililinaw lamang ang ipinahihiwatig na pangkat na kinaroroonan niya, nang walang dagdag na interpretasyon.
- source_word: Εἰρήνη ὑμῖν
  choice: Sumainyo ang kapayapaan
  rationale: Dignified at madaling maunawaang pagbati na pinananatili ang diin sa kapayapaan.
theological_decisions:
- issue: Paraan ng pagpasok ni Jesus habang nakasara ang mga pinto
  choice: Hindi ipinaliwanag; isinalin lamang na dumating siya kahit nakasara ang mga pinto.
  alternative: Sabihing mahimalang dumaan siya sa mga pinto o biglang nagpakita.
  rationale: Hindi tinutukoy ng Griyegong teksto ang mekanismo, kaya pinananatili ang teolohikal at naratibong pagpipigil nito.
- issue: Pagbilang sa “walong araw”
  choice: Pinanatili ang “walong araw.”
  alternative: Isaling “makalipas ang isang linggo.”
  rationale: Ang alternatibo ay maaaring makatulong sa modernong mambabasa ngunit papawiin ang eksaktong anyo at posibleng inklusibong pagbilang ng pinagmulan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Iniwasan ang sobrang pormal na balangkas at ang mga dagdag na paliwanag na wala sa Griyegong teksto.
