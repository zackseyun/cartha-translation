- from: Kaya umalis ang mga alagad at bumalik sa kanilang tinutuluyan.[a]
  to: Kaya bumalik ang mga alagad sa kani-kanilang pinagtutuluyan.[a]
  rationale: Inalis ang hindi kailangang paghahati sa iisang kilos na “umalis at bumalik.” Pinananatili ng “bumalik” ang diwa ng πάλιν at ng pag-alis mula sa libingan, at ang “kani-kanilang pinagtutuluyan” ay naghahatid ng malamang na idyomatikong kahulugan nang hindi ipinagpapalagay na sarili nilang mga bahay ang lugar. Pinananatili ng talababa ang literal na anyo at ang alternatibong “sarili nilang lugar.”
