translation:
  language: tl
  text: Kaya bumalik ang mga alagad sa kani-kanilang pinagtutuluyan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “sa kanilang mga sarili,” o “sa sarili nilang lugar.” Malamang na ang ibig sabihin ng pananalitang Griyego ay bumalik sila sa lugar na kanilang tinutuluyan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθον
  choice: umalis
  rationale: Ang aorist ng ἀπέρχομαι ay nagsasaad ng pag-alis sa pinangyarihan; tuwiran at natural ang “umalis” sa makabagong Tagalog.
- source_word: οὖν
  choice: Kaya
  rationale: Nag-uugnay ang οὖν sa naunang pangyayari bilang resulta o pagpapatuloy ng salaysay. Pinananatili ng “Kaya” ang ugnayang ito nang hindi labis na pormal.
- source_word: πάλιν
  choice: bumalik
  rationale: Sa konteksto ng pagkilos patungo sa dating kinaroroonan, likas na ipinahahayag sa Tagalog ng “bumalik” ang diwa ng πάλιν na “muli” o “pabalik.”
- source_word: πρὸς αὑτούς
  choice: sa kanilang tinutuluyan
  rationale: Literal itong “sa kanilang sarili,” ngunit sa konteksto ay malamang na idyomang tumutukoy sa lugar na kanilang inuuwian o tinutuluyan. Ang “tinuluyan” ay hindi nagpapalagay na sarili nilang mga bahay iyon.
- source_word: οἱ μαθηταί
  choice: ang mga alagad
  rationale: Ang “mga alagad” ang nakaugaliang malinaw at marangal na salin ng μαθηταί bilang mga tagasunod at tinuturuan ni Jesus.
