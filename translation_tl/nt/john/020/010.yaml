  naturalness: Natural ang “mga alagad,” ngunit mas malinaw at mas matatas ang isang pandiwang “bumalik” kaysa “umalis ... at bumalik,” na maaaring unawain bilang pag-alis at saka muling pagbabalik sa pinanggalingang tagpo.
  terminology: Ang “mga alagad” ay angkop para sa οἱ μαθηταί. Ang “kani-kanilang pinagtutuluyan” ay natural na pagpapahayag ng malamang na kahulugan ng πρὸς αὑτούς, habang ipinaliliwanag ng talababa ang literal at mas malawak na mga posibilidad.
