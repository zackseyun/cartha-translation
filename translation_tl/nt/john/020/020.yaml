id: JHN.20.20
reference: John 20:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ τοῦτο εἰπὼν ⸀ἔδειξεν τὰς χεῖρας καὶ τὴν πλευρὰν ⸀αὐτοῖς. ἐχάρησαν οὖν οἱ μαθηταὶ ἰδόντες τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/020.yaml
  text: And after saying this, he showed them his hands and his side. Then the disciples rejoiced when they saw the Lord.
translation:
  language: tl
  text: Pagkasabi nito, ipinakita niya sa kanila ang kanyang mga kamay at tagiliran. Kaya nagalak ang mga alagad nang makita nila ang Panginoon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο εἰπὼν
  choice: Pagkasabi nito
  rationale: Ipinahahayag ng aorist participle ang kilos na nauna sa pangunahing pandiwa. Likas at maikli sa modernong Tagalog ang “Pagkasabi nito.”
- source_word: ἔδειξεν
  choice: ipinakita
  rationale: Tuwirang ipinahihiwatig ng δείκνυμι ang pagpapakita ng isang bagay upang makita.
- source_word: τὰς χεῖρας καὶ τὴν πλευράν
  choice: ang kanyang mga kamay at tagiliran
  rationale: Bagaman pantukoy ang nasa Griyego at hindi tahasang panghalip na paari, natural sa Tagalog na tukuying kanya ang mga bahaging ito ng katawan. Ang “tagiliran” ay tumpak at hindi labis na nagpapaliwanag tungkol sa sugat.
- source_word: αὐτοῖς
  choice: sa kanila
  rationale: Pinananatili ang datibong tumutukoy sa mga pinakitaan ni Jesus.
- source_word: ἐχάρησαν
  choice: nagalak
  rationale: Ang “nagalak” ay natural at marangal na katumbas ng χαίρω, at taglay nito ang mas malakas na diwa kaysa simpleng “natuwa.”
- source_word: οὖν
  choice: Kaya
  rationale: 'Ipinakikita rito ng οὖν ang bunga o lohikal na pag-usad: nagalak sila bunga ng pagkakita sa Panginoon.'
- source_word: οἱ μαθηταί
  choice: ang mga alagad
  rationale: Ang “mga alagad” ang karaniwan at tumpak na katawagan sa μαθηταί sa konteksto ng mga Ebanghelyo.
- source_word: ἰδόντες
  choice: nang makita nila
  rationale: Ginagawang likas na sugnay na temporal sa Tagalog ang aorist participle at malinaw na iniuugnay ang kanilang pagkakita sa kanilang kagalakan.
- source_word: τὸν κύριον
  choice: ang Panginoon
  rationale: Pinananatili ng “Panginoon” ang karaniwang salin at kristolohikal na bigat ng κύριος sa salaysay ng muling pagkabuhay.
theological_decisions:
- issue: Pagpapakahulugan sa κύριος
  choice: ang Panginoon
  alternative: ang Guro / ang panginoon
  rationale: Sa pagpapakitang ito matapos ang muling pagkabuhay, ang κύριος ay higit sa isang magalang na tawag lamang. Pinananatili ng “Panginoon” ang pagkilala kay Jesus at ang teolohikal na bigat ng katawagan nang hindi nagdaragdag ng paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang “nagalak” sa halip na mas kolokyal na “natuwa,” at “tagiliran” bilang tumpak na tawag sa bahagi ng katawan. Walang kailangang talababa sa talatang ito.
