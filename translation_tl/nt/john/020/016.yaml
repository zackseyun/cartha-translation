  source_fidelity: 'Tumpak na naihahatid ng salin ang mga pangunahing bahagi ng Griyego: tinawag ni Jesus si Maria, lumingon siya, at sumagot siya sa kanya sa wikang tinatawag ng teksto na Hebreo. Wasto ring pinananatili ang “Rabuni” at ang kasunod nitong pagpapaliwanag na “Guro.” Gayunman, ang “Pagharap niya” ay hindi gaanong tuwirang katumbas ng στραφεῖσα, na nagsasaad ng paglingon o pag-ikot; mas malinaw ang “Paglingon niya.”'
  naturalness: Nauunawaan ang kasalukuyang teksto, ngunit mas likas ang ayos na “Sinabi ni Jesus sa kanya” kaysa “Sinabi sa kanya ni Jesus.” Ang “Paglingon niya” ay mas karaniwan at mas malinaw sa modernong Filipino kaysa “Pagharap niya” sa ganitong tagpo. Iniaangkop din ang baybay na “Aramaiko” sa karaniwang modernong Filipino.
  terminology: Ang “Maria,” “Hebreo,” “Rabuni,” at “Guro” ay angkop. Ang pangunahing teksto ay wastong sumusunod sa Ἑβραϊστί bilang “sa wikang Hebreo,” samantalang ang talababa ay maingat na nagbibigay ng “Aramaiko” bilang alternatibong pag-unawa nang hindi ito ipinapalit sa pangunahing salin.
  issues:
  - severity: low
    issue: Ang “Pagharap niya” ay maaaring mangahulugang pagharap o pagtuon, hindi malinaw na paglingon.
    rationale: Ang aorist participle στραφεῖσα ay likas na maisasalin bilang “paglingon niya” o “nang lumingon siya,” na mas malinaw na nagtataglay ng pagkilos ng pag-ikot/paglingon nang hindi nagdaragdag ng detalye.
  - severity: low
    issue: Medyo di-likas ang ayos na “Sinabi sa kanya ni Jesus.”
    rationale: Mas karaniwan sa modernong Filipino ang “Sinabi ni Jesus sa kanya,” habang ganap na pinananatili ang kahulugan at diin ng pangungusap.
  - severity: low
    issue: Hindi pamantayan sa modernong Filipino ang baybay na “Aramaico.”
    rationale: Mas karaniwang Filipino na baybay ang “Aramaiko.”
