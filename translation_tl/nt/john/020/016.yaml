  text: λέγει ⸀αὐτῇ Ἰησοῦς· ⸀Μαριάμ. στραφεῖσα ἐκείνη λέγει αὐτῷ ⸀Ἑβραϊστί· Ραββουνι (ὃ λέγεται Διδάσκαλε).
base_translation:
  language: en
  yaml_path: translation/nt/john/020/016.yaml
  text: Jesus says to her[a], “Mary.” Turning, she says to him in Hebrew, “Rabboni!” (which means, “Teacher”).
translation:
  language: tl
  text: Sinabi ni Jesus sa kanya, “Maria.” Paglingon niya, sinabi niya kay Jesus sa wikang Hebreo[a], “Rabuni!” (na ang ibig sabihin ay “Guro”).
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “sa wikang Aramaiko.” Ang “Hebreo” sa gamit ni Juan ay maaaring tumukoy nang mas malawak sa Semitikong wikang sinasalita sa Judea.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: Sinabi
  rationale: Ginamit ang likas na panahunang nagdaan sa Tagalog para sa makasaysayang pagsasalaysay; ang Griyegong historical present ay hindi kailangang gayahin kung magiging di-likas ang daloy.
- source_word: αὐτῇ
  choice: sa kanya
  rationale: Likas na katumbas sa Tagalog ng datibong panghalip sa kontekstong ito.
- source_word: Μαριάμ
  choice: Maria
  rationale: Karaniwan at kinikilalang anyo ng pangalan sa Tagalog.
- source_word: στραφεῖσα
  choice: Pagharap niya
  rationale: Ipinahahayag ang kasunod na pagkilos nang maikli at natural, nang hindi ipinapalagay kung gaano kalaki ang pisikal na pag-ikot.
- source_word: ἐκείνη
  choice: niya
  rationale: Sa konteksto, natural itong tumutukoy kay Maria bilang simuno ng pagkilos.
- source_word: Ἑβραϊστί
  choice: sa wikang Hebreo
  rationale: Sinusunod ng pangunahing teksto ang tahasang anyo ng Griyego; inilalagay sa talababa ang posibleng mas malawak na pagtukoy nito sa Aramaico.
- source_word: Ραββουνι
  choice: Rabuni
  rationale: Pinanatili bilang transliterasyon sapagkat agad itong ipinaliliwanag ng Ebanghelyo; ang baybay ay iniangkop sa karaniwang tunog at ortograpiyang Filipino.
- source_word: ὃ λέγεται Διδάσκαλε
  choice: na ang ibig sabihin ay “Guro”
  rationale: Natural na paraan sa modernong Tagalog upang ipakilala ang paliwanag; ang Διδάσκαλε ay tuwirang panawag na “Guro.”
theological_decisions:
- issue: Kahulugan ng Ἑβραϊστί sa salaysay ni Juan
  choice: sa wikang Hebreo
  alternative: sa wikang Aramaico
  rationale: Pinananatili sa pangunahing teksto ang literal na katawagan ng Griyego, habang kinikilala sa talababa na maaari itong tumukoy nang mas malawak sa Semitikong wikang ginagamit sa Judea, malamang na Aramaico.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Pinili ang natural na ayos ng pangungusap at ang karaniwang pangalang “Maria,” habang pinanatili ang Semitikong panawag na “Rabuni” dahil ipinaliliwanag ito mismo ng teksto.
