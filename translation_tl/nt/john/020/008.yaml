  text: τότε οὖν εἰσῆλθεν καὶ ὁ ἄλλος μαθητὴς ὁ ἐλθὼν πρῶτος εἰς τὸ μνημεῖον, καὶ εἶδεν καὶ ἐπίστευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/008.yaml
  text: Then the other disciple[a], who had arrived at the tomb first, also went in[b], and he saw and believed.
translation:
  language: tl
  text: Kaya't pumasok din ang isa pang alagad, na unang nakarating sa libingan, at nakita niya at naniwala.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tahasang sinasabi sa Griyego kung ano ang pinaniwalaan niya. Maaaring tumukoy ito sa muling pagkabuhay ni Jesus, sa nakita niyang katibayan, o sa naunang ulat.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε οὖν
  choice: Kaya
  rationale: Ipinahihiwatig ng parirala ang pagpapatuloy ng salaysay na may bahagyang lohikal na bunga mula sa naunang pangyayari. Likas sa modernong Tagalog ang “Kaya” sa kontekstong ito.
- source_word: εἰσῆλθεν
  choice: pumasok
  rationale: Tuwirang inilalarawan ang pagpasok sa loob ng libingan at natural itong gamitin sa salaysay.
- source_word: ὁ ἄλλος μαθητής
  choice: ang isa pang alagad
  rationale: Ang “alagad” ang karaniwan at angkop na katawagan sa μαθητής sa kontekstong biblikal; ipinakikita ng “isa pang” ang pagkakaiba niya sa alagad na naunang binanggit.
- source_word: ὁ ἐλθὼν πρῶτος εἰς τὸ μνημεῖον
  choice: na siyang unang nakarating sa libingan
  rationale: Natural na ipinapahayag sa Tagalog ang kilos na nauna sa pangunahing pandiwa, at malinaw na siya ang unang nakarating doon.
- source_word: μνημεῖον
  choice: libingan
  rationale: Tumutukoy ito sa lugar na pinaglibingan kay Jesus; “libingan” ang malinaw at karaniwang salin sa modernong Tagalog.
- source_word: καὶ εἶδεν
  choice: Nakita niya
  rationale: Pinananatili ang payak na kahulugan ng pandiwa at nililinaw ang simuno sa natural na Tagalog.
- source_word: ἐπίστευσεν
  choice: naniwala siya
  rationale: Pinananatiling walang tahasang layon ang pandiwa, gaya sa Griyego, upang hindi tukuyin ng salin kung ano mismo ang pinaniwalaan niya.
theological_decisions:
- issue: Kung ano ang pinaniwalaan ng alagad
  choice: 'Isinalin nang walang tahasang layon: “naniwala siya.”'
  alternative: “naniwala siyang muling nabuhay si Jesus,” “naniwala siya sa sinabi ni Maria,” o “sumampalataya siya.”
  rationale: Hindi tinutukoy ng Griyego ang nilalaman ng paniniwala. Ang pagdaragdag nito ay magpapasya sa isang usaping sadyang nananatiling bukas sa teksto, lalo na dahil sa kasunod na talata.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural sa pagsasalaysay. Pinanatili ang maikli at walang layong “naniwala siya” upang mapangalagaan ang tunay na kalabuan ng orihinal.
