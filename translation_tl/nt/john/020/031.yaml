  to: Ngunit naisulat ang mga ito upang manampalataya kayo[a] na si Jesus ang Mesiyas[b], ang Anak ng Diyos, at upang sa pamamagitan ng pananampalataya ay magkaroon kayo ng buhay sa kanyang pangalan.
