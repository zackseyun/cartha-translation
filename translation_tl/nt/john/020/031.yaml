id: JHN.20.31
reference: John 20:31
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ταῦτα δὲ γέγραπται ἵνα ⸀πιστεύητε ὅτι Ἰησοῦς ἐστιν ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ, καὶ ἵνα πιστεύοντες ζωὴν ἔχητε ἐν τῷ ὀνόματι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/031.yaml
  text: But these have been written so that you may believe that Jesus is the Messiah[a], the Son of God[b], and so that by believing you may have life in his name.
translation:
  language: tl
  text: Ngunit naisulat ang mga ito upang manampalataya kayo[a] na si Jesus ang Mesiyas[b], ang Anak ng Diyos, at upang sa pamamagitan ng pananampalataya ay magkaroon kayo ng buhay sa kanyang pangalan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'May ilang manuskrito na may anyong aorist, na maaaring magpahiwatig ng pagsisimulang manampalataya, samantalang ang iba—gaya ng pangunahing tekstong ginamit dito—ay may anyong present, na maaaring magpahiwatig ng patuloy na pananampalataya. Malawak ang salin sa pangunahing teksto: “manampalataya kayo.”'
    reason: textual_variant
  - marker: b
    text: O “Cristo.” Ang salitang Griyego na Χριστός ay isinaling “Mesiyas” dito upang mapanatili ang kahulugan nito bilang titulo.
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: ang mga ito
  rationale: Tumutukoy sa mga tanda at sa mga bagay na isinulat na binanggit sa konteksto; likas at tiyak ito sa modernong Tagalog.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig ang banayad na pagsalungat o paglipat mula sa naunang pahayag.
- source_word: γέγραπται
  choice: isinulat
  rationale: Natural na salin ng perfect passive sa Tagalog; ipinakikita ng konteksto na ang naisulat ay nananatiling nakatala at may bisa.
- source_word: ἵνα
  choice: upang
  rationale: Malinaw na nagpapahayag ng layunin at angkop sa marangal ngunit karaniwang rehistro.
- source_word: πιστεύητε
  choice: manampalataya kayo
  rationale: Sinasadya nitong huwag tukuyin kung pagsisimula o pagpapatuloy ng pananampalataya ang diin; ang usaping tekstuwal at aspektuwal ay inilalahad sa talababa.
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Karaniwang anyo ng pangalan sa modernong Tagalog.
- source_word: ὁ χριστός
  choice: ang Mesiyas
  rationale: Isinasalin ang Χριστός bilang titulo at pinananatili ang mesiyanikong kahulugan nito sa kontekstong Judio.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: ang Anak ng Diyos
  rationale: Tuwiran at kinikilalang salin ng kristolohikal na titulo nang hindi pinahihina o pinalalawak ang kahulugan.
- source_word: πιστεύοντες
  choice: sa pamamagitan ng pananampalataya
  rationale: Ipinapahayag ang posibleng instrumental na ugnayan ng participle sa pagkakaroon ng buhay, sa paraang natural sa Tagalog.
- source_word: ζωὴν
  choice: buhay
  rationale: Hindi idinagdag ang “walang hanggan” sapagkat walang katumbas na pang-uri sa tekstong Griyego; nananatili ang lalim ng gamit ni Juan.
- source_word: ἐν τῷ ὀνόματι αὐτοῦ
  choice: sa kanyang pangalan
  rationale: Pinananatili ang metaporikal at teolohikal na saklaw ng “pangalan” nang hindi ito ipinapaliwanag sa mismong talata.
theological_decisions:
- issue: Paglilipat ng titulong Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Ginagamit dito ang Χριστός bilang titulong kumikilala kay Jesus bilang ipinangakong Mesiyas, kaya isinalin ang kahulugan sa halip na basta hiramin ang anyo.
- issue: Usaping tekstuwal at aspektuwal sa πιστεύητε
  choice: manampalataya kayo
  alternative: patuloy kayong manampalataya / magsimula kayong manampalataya
  rationale: Ang tekstong SBLGNT ay may present subjunctive, ngunit may kilalang variant na aorist subjunctive. Hindi likas na minamarkahan ng simpleng pandiwang Tagalog ang pagkakaibang ito, kaya pinanatiling malawak ang pangunahing salin at inilagay ang detalye sa talababa.
- issue: Kahulugan ng ζωὴν
  choice: buhay
  alternative: buhay na walang hanggan
  rationale: Bagaman may malalim na teolohikal na kahulugan ang “buhay” kay Juan, hindi tahasang naroon ang “walang hanggan” sa Griyego at hindi ito dapat idagdag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinili ang payak na ayos ng pangungusap at mga kinikilalang katawagang biblikal, habang iniiwasan ang pagdaragdag ng paliwanag o denominasyonal na pagpapakahulugan sa pangunahing teksto.
