  text: καὶ τοῦτο εἰπὼν ἐνεφύσησεν καὶ λέγει αὐτοῖς· Λάβετε πνεῦμα ἅγιον·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/022.yaml
  text: And after saying this[a], he breathed on them and said to them, “Receive the Holy Spirit.”
translation:
  language: tl
  text: Matapos niyang sabihin ito, hiningahan niya sila[a] at sinabi sa kanila, “Tanggapin ninyo ang Espiritu Santo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “huminga siya sa loob nila.” Ipinapaalala rin ng pandiwa ang mga larawan ng paglikha at bagong paglikha sa Genesis 2:7 at Ezekiel 37.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο εἰπὼν
  choice: Pagkasabi nito
  rationale: Likas at maikli itong salin ng naunang kilos ng aorist participle kaugnay ng pangunahing pandiwa, at malinaw na pinananatili ang pagkakasunod-sunod ng mga pangyayari.
- source_word: ἐνεφύσησεν
  choice: hiningahan niya sila
  rationale: Ang pandiwa ay tumutukoy sa paghinga sa o hingahan ang isang tao. Hindi nito labis na tinutukoy sa pangunahing teksto kung ‘sa kanila’ o ‘sa loob nila,’ kaya napapanatili ang lawak ng Griyego at ang posibleng alusyon sa paglikha.
- source_word: λέγει αὐτοῖς
  choice: at sinabi
  rationale: Bagaman historical present ang λέγει, natural sa makabagong salaysay sa Tagalog ang pangnagdaang ‘sinabi.’ Nauunawaan na sa layon ng naunang sugnay na sa kanila ito sinabi.
- source_word: Λάβετε
  choice: Tanggapin ninyo
  rationale: Sa kontekstong ito, mas natural ang ‘tanggapin’ kaysa ‘kunin’ at ipinapahayag nito ang pagtanggap sa Espiritu nang hindi nagpapahiwatig na sila mismo ang kusang umangkin sa kanya.
- source_word: πνεῦμα ἅγιον
  choice: ang Espiritu Santo
  rationale: Sa konteksto ng Juan, tumutukoy ito sa banal na Espiritu. Natural sa Tagalog ang may pantukoy na ‘ang,’ kahit walang artikulo ang Griyego, at ang malaking titik ay nagpapakita ng personal at banal na reperensiya.
theological_decisions:
- issue: Kung ang πνεῦμα ἅγιον ay tumutukoy sa personal at banal na Espiritu o sa isang di-personal na ‘banal na espiritu’
  choice: ang Espiritu Santo
  alternative: banal na espiritu
  rationale: Pinakamalamang sa konteksto ng Ebanghelyo ni Juan na ang tinutukoy ay ang Espiritu Santo. Hindi dinaragdagan ng salin ang nilalaman ng teksto, ngunit iniiwasan nitong magmungkahi ng isang di-tiyak o impersonal na puwersa.
- issue: Kung dapat panatilihin sa Tagalog ang historical present ng λέγει
  choice: sinabi
  alternative: sinabi niya sa kanila / sinasabi niya sa kanila
  rationale: Ang pangnagdaang anyo ay mas natural sa modernong salaysay sa Tagalog at walang nawawalang mahalagang teolohikal na kahulugan.
- issue: Kung dapat tukuyin sa pangunahing teksto na huminga si Jesus ‘sa loob nila’
  choice: hiningahan niya sila
  alternative: huminga siya sa loob nila
  rationale: Hindi tiyak na hinihingi ng anyong Griyego ang ‘sa loob nila.’ Pinananatili ng pangunahing salin ang leksikal na kaluwagan, habang inilalahad sa talababa ang posibleng alternatibo at ang alusyon sa paglikha at bagong paglikha.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinili ang karaniwang ‘Espiritu Santo’ at ang natural na ‘Tanggapin ninyo.’ Ang ‘hiningahan niya sila’ ay madaling maunawaan ngunit hindi labis na nililinaw ang direksiyon ng paghinga na nananatiling bukás sa Griyego.
