  naturalness: Natural at malinaw ang modernong Filipino Tagalog. Ang “sumagot ... at sinabi” ay bahagyang pormal/biblikal ngunit katanggap-tanggap at akma sa optimal-equivalence na layunin; hindi ito nakasasagabal sa pag-unawa.
  terminology: Ang “Panginoon” para sa κύριος at “Diyos” para sa θεός ay angkop, marangal, at tumutugma sa bigat ng tuwirang pahayag. Ang “Tomas” ay ang karaniwang anyong Tagalog ng pangalan.
