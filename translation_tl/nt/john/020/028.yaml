  text: ⸀ἀπεκρίθη Θωμᾶς καὶ εἶπεν αὐτῷ· Ὁ κύριός μου καὶ ὁ θεός μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/028.yaml
  text: Thomas answered and said to him[a], “My Lord and my God!”
translation:
  language: tl
  text: Sumagot si Tomas at sinabi sa kanya[a], “Panginoon ko at Diyos ko!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, bagaman hindi gaanong malamang, “Sumagot si Tomas at sinabi, ‘Panginoon ko at Diyos ko!’” bilang isang bulalas. Gayunman, sinasabi ng Griyego na nagsalita siya “sa kanya,” kaya sinusuportahan nito na tuwirang kinakausap si Jesus.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: Sumagot
  rationale: Karaniwang salaysay na gamit ng ἀποκρίνομαι na nangangahulugang sumagot o tumugon; natural at tuwiran ang “sumagot” sa modernong Tagalog.
- source_word: Θωμᾶς
  choice: Tomas
  rationale: Ginamit ang nakagawiang anyo ng pangalang Thomas sa Tagalog.
- source_word: εἶπεν αὐτῷ
  choice: sinabi sa kanya
  rationale: Pinananatili ang datibong αὐτῷ bilang “sa kanya” at hindi tahasang pinapalitan ng “kay Jesus,” yamang panghalip ang nasa Griyego.
- source_word: Ὁ κύριός μου
  choice: Panginoon ko
  rationale: Pinananatili ang pagpipitagan at bigat na teolohikal ng κύριος; likas sa Tagalog ang hulíng panghalip na “ko.”
- source_word: καὶ
  choice: at
  rationale: Tuwirang pinananatili ang pag-uugnay ng dalawang katawagan sa iisang pahayag.
- source_word: ὁ θεός μου
  choice: Diyos ko
  rationale: Tapat na isinasalin ang θεός at ang personal na possessive na μου, habang ang malaking titik ay angkop sa tuwirang pagtawag sa konteksto.
theological_decisions:
- issue: Kung ang sinabi ni Tomas ay tuwirang pahayag kay Jesus o isang bulalas na hindi nakatuon sa kanya
  choice: 'Tuwirang sinabi kay Jesus: “Panginoon ko at Diyos ko!”'
  alternative: Isang bulalas na patungkol sa Diyos ngunit hindi tuwirang kumikilala kay Jesus bilang tinutukoy
  rationale: Malinaw na naroon ang αὐτῷ, “sa kanya,” at ang mga anyong nominative na may pantukoy ay maaaring gumanap bilang pantawag sa Koine Greek. Kaya pinananatili ang tuwirang pagharap kay Jesus nang hindi pinahihina o higit na ipinapaliwanag ang bigat ng pahayag.
translation_notes:
  register: Modernong Filipino Tagalog na simple, marangal, at madaling maunawaan. Pinanatili ang bahagyang Semitikong anyong “sumagot ... at sinabi” dahil kapansin-pansin ito sa Griyego at hindi naman di-likas sa Tagalog; iniwasan ang pagdaragdag ng pangalang Jesus sa mismong talata.
