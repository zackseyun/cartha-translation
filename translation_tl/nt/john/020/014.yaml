    rationale: Ang «hindi niya nakilalang si Jesus iyon» ay hindi maayos na pagbuo. Dapat «hindi niya nakilala na si Jesus iyon» upang maipahayag ang alternatibong diwa ng pagkilala sa pagkakakilanlan.
