  naturalness: Nauunawaan ang draft, ngunit mas natural at malinaw sa modernong Tagalog ang «Matapos niyang sabihin ang mga bagay na ito» kaysa «Pagkasabi niya ng mga bagay na ito». Mas idiomatiko rin ang ayos na «hindi niya alam na si Jesus iyon».
  terminology: Ang pangalang «Jesus» ay wasto. Pinananatili ng pangunahing teksto ang maingat na «hindi niya alam» para sa οὐκ ᾔδει, nang hindi ipinipilit ang mas interpretibong «hindi niya nakilala».
