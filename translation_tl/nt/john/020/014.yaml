base_translation:
  language: en
  yaml_path: translation/nt/john/020/014.yaml
  text: After saying these things[a], she turned around and saw Jesus standing there, and she did not know that it was Jesus.
translation:
  language: tl
  text: Matapos niyang sabihin ang mga bagay na ito, lumingon siya at nakita niyang nakatayo roon si Jesus, at hindi niya alam na si Jesus iyon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi niya nakilala na si Jesus iyon.” Sa literal, “hindi niya alam na si Jesus iyon,” na nagpapahayag na hindi niya natukoy ang kanyang pagkakakilanlan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: mga bagay na ito
  rationale: Pinananatili ang maramihang anyo ng demonstratibo at ang karaniwang estilong pasalaysay ni Juan.
- source_word: εἰποῦσα
  choice: pagkasabi niya
  rationale: Likas na temporal na salin ng aorist participle, na nagpapakitang nauna ang pagsasalita sa paglingon.
- source_word: ἐστράφη εἰς τὰ ὀπίσω
  choice: lumingon siya
  rationale: Likas sa modernong Tagalog at malinaw na ipinahihiwatig ang pagbaling niya sa nasa likuran.
- source_word: θεωρεῖ
  choice: nakita niyang
  rationale: Isinasalin ang historical present ayon sa likas na nakaraang panahon ng salaysay; ipinahahayag nito ang aktuwal na pagkakita.
- source_word: ἑστῶτα
  choice: nakatayo roon
  rationale: Pinananatili ang kalagayan o postura ni Jesus at ginagawang natural ang tagpo sa Tagalog.
- source_word: οὐκ ᾔδει
  choice: hindi niya alam
  rationale: Malapit sa pangunahing kahulugan ng οἶδα at hindi agad ipinapalit ang mas interpretibong ‘hindi niya nakilala.’
- source_word: ὅτι Ἰησοῦς ἐστιν
  choice: na iyon ay si Jesus
  rationale: Likas na pormula ng pagkakakilanlan sa Tagalog at pinananatili ang nilalaman ng hindi niya pagkaalam.
theological_decisions:
- issue: Pagkakakilanlan sa muling nabuhay na si Jesus
  choice: hindi niya alam na iyon ay si Jesus
  alternative: hindi niya nakilalang si Jesus iyon
  rationale: Sinasabi ng Griyego na hindi alam ni Maria ang pagkakakilanlan ng taong nakita niya ngunit hindi tinutukoy ang sanhi; hindi ito nilulutas nang higit sa sinasabi ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “lumingon” sa halip na mas mahabang “bumaling siya sa likuran,” at pinanatili ang literal na diwa ng ‘hindi alam’ sa pangunahing teksto habang inilalagay sa talababa ang likas ngunit mas interpretibong ‘hindi nakilala.’
