  rationale: Pinalitan ang pang-ugnay na may diwang pagsalungat ng payak na «at», inayos ang pambungad para sa mas likas na Tagalog, at itinama ang balarila ng alternatibong salin sa talababa. Hindi binabago ng mga ito ang kahulugan o nilulutas ang hindi ipinapaliwanag ng teksto tungkol sa hindi pagkilala ni Maria kay Jesus.
