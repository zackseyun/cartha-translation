revisions:
- from: Ngunit alam kong lagi mo akong dinirinig. Subalit sinabi ko ito alang-alang sa mga taong nakatayo sa paligid, upang maniwala silang ikaw ang nagsugo sa akin.
  to: Alam kong lagi mo akong dinirinig. Ngunit sinabi ko ito dahil sa karamihang nakatayo sa paligid, upang maniwala silang ikaw ang nagsugo sa akin.
  rationale: 'Pinalitan ang “alang-alang sa” ng “dahil sa” upang mas tumpak na maipahayag ang sanhi sa διὰ τὸν ὄχλον, at ang “mga taong” ng “karamihan” upang maingatan ang kolektibong diwa ng ὄχλος. Inalis ang unang “Ngunit” upang hindi magdoble ang adversatibong paglipat, habang pinananatili ang “Ngunit” para sa ἀλλά. Walang kailangang talababa: naipapakita na sa “ikaw ang” ang diin ng σύ, at walang ibang kinakailangang alternatibong leksikal sa salin.'
