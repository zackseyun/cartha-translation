  text: ἐγὼ δὲ ᾔδειν ὅτι πάντοτέ μου ἀκούεις· ἀλλὰ διὰ τὸν ὄχλον τὸν περιεστῶτα εἶπον, ἵνα πιστεύσωσιν ὅτι σύ με ἀπέστειλας.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/042.yaml
  text: But I knew that you always hear me[a]. Yet I said this because of the crowd standing around[b], so that they may believe that you sent me.
translation:
  language: tl
  text: Alam kong lagi mo akong dinirinig. Ngunit sinabi ko ito dahil sa karamihang nakatayo sa paligid, upang maniwala silang ikaw ang nagsugo sa akin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾔδειν
  choice: alam ko
  rationale: Ang οἶδα sa anyong ito ay may pangnagdaang diwa, ngunit sa natural na Filipino, ang kasalukuyang anyong “alam ko” ang karaniwang katumbas ng English na “I knew” kapag patuloy na umiiral ang kaalaman; hindi nito ipinahihiwatig na tumigil na ang kaalamang iyon.
- source_word: πάντοτέ μου ἀκούεις
  choice: lagi mo akong dinirinig
  rationale: Pinananatili ng “lagi” ang πάντοτε. Ang “dinirinig” ay likas sa konteksto ng panalangin at maaaring magpahiwatig ng mapagtuong pakikinig nang hindi tahasang dinaragdagan ng ideyang “tinutugon.”
- source_word: διὰ τὸν ὄχλον
  choice: alang-alang sa mga tao
  rationale: Ang διά na may akusatibo ay maaaring magpahayag ng dahilan o kapakanan. Dito, nililinaw ng kasunod na layuning maniwala sila na ang sinabi ni Jesus ay para sa kanilang kapakinabangan; natural itong ipinahahayag ng “alang-alang sa.”
- source_word: τὸν περιεστῶτα
  choice: nakatayo sa paligid
  rationale: Pinananatili nito ang hayag na larawan ng mga taong nakapaligid at naroroon habang nagsasalita si Jesus.
- source_word: εἶπον
  choice: sinabi ko ito
  rationale: Ang “ito” ay likas na tumutukoy sa panalanging kabibigkas ni Jesus at isang minimal na paglilinaw na kailangan sa Filipino.
- source_word: ἵνα πιστεύσωσιν
  choice: upang maniwala sila
  rationale: Ang “upang” ay malinaw at marangal na nagpapahayag ng layunin ng ἵνα kasama ang subjunctive.
- source_word: ὅτι σύ με ἀπέστειλας
  choice: na ikaw ang nagsugo sa akin
  rationale: Ang hulma na “ikaw ang” ay likas na pinananatili sa Filipino ang diin ng hayag na panghalip na σύ. Ang “nagsugo” ay angkop sa tema ng misyong ipinagkatiwala kay Jesus at tumpak na tumutumbas sa ἀποστέλλω.
theological_decisions:
- issue: Ang pahayag na laging dinirinig ng Ama si Jesus
  choice: Tuwirang sinasabi ng salin na lagi siyang dinirinig, nang hindi ipinapaliwanag kung nangangahulugan itong pakikinig lamang o palagiang pagtugon.
  alternative: “Lagi mo akong pinakikinggan” o “lagi mong tinutugon ang panalangin ko.”
  rationale: Sapat na pinananatili ng “dinirinig” ang saklaw at tensiyon ng ἀκούεις sa konteksto ng panalangin, nang hindi ipinapasok ang mas malawak na aral tungkol sa panalangin o nilulutas ang kahulugang higit sa sinabi ng teksto.
- issue: Layunin ng panalanging binigkas sa harap ng madla
  choice: Ang hayag na pananalita ni Jesus ay para maniwala ang mga nakapaligid na ang Ama ang nagsugo sa kanya.
  alternative: Limitahan ang layunin sa pagpapatunay lamang ng partikular na himala, o palawakin ito sa isang ganap na pormulang doktrinal.
  rationale: Ang ἵνα-clause ay tahasang nakatuon sa paniniwalang ang Ama ang nagsugo kay Jesus. Pinananatili ng salin ang pahayag na iyon nang hindi ito pinakikitid o pinalalawak.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “Subalit” upang malinaw na ipakita ang paglipat mula sa tiyak na kaalaman ni Jesus tungo sa dahilan ng kanyang pagsasalita. Ang “mga taong” ay mas natural kaysa sa literal na kolektibong “karamihan” para sa ὄχλος sa pangungusap na ito.
