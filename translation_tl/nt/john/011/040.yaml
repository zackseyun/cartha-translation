  text: λέγει αὐτῇ ὁ Ἰησοῦς· Οὐκ εἶπόν σοι ὅτι ἐὰν πιστεύσῃς ⸀ὄψῃ τὴν δόξαν τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/040.yaml
  text: Jesus said to her, “Did I not tell you that if you believe, you will see the glory of God?”
translation:
  language: tl
  text: Sinabi ni Jesus sa kanya, “Hindi ba sinabi ko sa iyo na kung maniniwala ka, makikita mo ang kaluwalhatian ng Diyos?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: Sinabi
  rationale: Bagaman pangkasalukuyan ang anyong Griyego bilang makasaysayang pangkasalukuyan, mas natural sa makabagong salaysay sa Filipino ang pangnagdaang “Sinabi.”
- source_word: αὐτῇ
  choice: sa kanya
  rationale: Tumutukoy ang panghalip kay Marta sa konteksto; natural itong isalin bilang “sa kanya.”
- source_word: Οὐκ εἶπόν σοι
  choice: Hindi ba sinabi ko sa iyo
  rationale: Pinananatili nito ang retorikal na tanong na umaasang sasang-ayon ang kausap, pati ang tuwirang personal na pagtukoy.
- source_word: ἐὰν πιστεύσῃς
  choice: kung maniniwala ka
  rationale: Ang “maniniwala” ay natural na katumbas ng πιστεύω sa kondisyong nakatuon sa hinaharap at pinananatili ang karaniwang bokabularyo ng Juan tungkol sa paniniwala.
- source_word: ὄψῃ
  choice: makikita mo
  rationale: Natural na ipinapahayag ng “makikita mo” ang hinaharap na kahulugan ng pandiwang ὁράω.
- source_word: τὴν δόξαν τοῦ θεοῦ
  choice: ang kaluwalhatian ng Diyos
  rationale: Pinananatili ng “kaluwalhatian” ang mahalagang bokabularyong teolohikal ni Juan at ang ideya ng pagpapahayag ng Diyos, nang hindi ito nililimitahan sa ningning o kadakilaan lamang.
theological_decisions:
- issue: Ugnayan ng pananampalataya at pagkakita sa kaluwalhatian ng Diyos
  choice: Isinalin bilang tuwirang pangakong may kondisyon na sinabi ni Jesus kay Marta.
  alternative: Ipaliwanag ito bilang pangkalahatang tuntunin tungkol sa pananampalataya at mga himala, o bilang pangakong para lamang sa muling pagbuhay kay Lazaro.
  rationale: Ang mismong talata ay hindi tahasang nagpapasya sa lawak ng pangako. Kaya pinananatili ng salin ang kondisyon at pangako nang walang idinagdag na paliwanag na teolohikal.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “Jesus” at “Diyos” ayon sa karaniwang gamit sa modernong saling Tagalog. Walang talababa sapagkat walang mahalagang tekstuwal o leksikal na kalabuan na kailangang ilahad sa mambabasa.
