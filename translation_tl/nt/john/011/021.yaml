id: JHN.11.21
reference: John 11:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἶπεν οὖν ⸀ἡ Μάρθα πρὸς ⸀τὸν Ἰησοῦν· Κύριε, εἰ ἦς ὧδε ⸂οὐκ ἂν ἀπέθανεν ὁ ἀδελφός μου⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/021.yaml
  text: So Martha said to Jesus[a], “Lord, if you had been here, my brother would not have died.”
translation:
  language: tl
  text: Kaya sinabi ni Marta kay Jesus[a], “Panginoon, kung narito ka noon, hindi sana namatay ang kapatid kong lalaki.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ginoo.” Ang Griegong κύριε ay maaaring gamiting magalang na pantawag, ngunit maaari rin itong magtaglay ng teolohikal na bigat sa Ebanghelyo ni Juan.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Nag-uugnay ito sa naunang salaysay at nagpapahiwatig ng pagpapatuloy o bunga; natural sa modernong Tagalog ang “Kaya” sa kontekstong ito.
- source_word: εἶπεν
  choice: sinabi
  rationale: Karaniwang pandiwa ito para sa tuwirang pagsasalita sa isang tao.
- source_word: πρὸς τὸν Ἰησοῦν
  choice: kay Jesus
  rationale: Ang πρός na may accusative kasunod ng pandiwa ng pagsasalita ay tumutukoy sa kinakausap; natural itong isalin na “kay Jesus.”
- source_word: Κύριε
  choice: Panginoon
  rationale: Pinananatili nito ang magalang na pagtawag at ang posibleng teolohikal na bigat ng κύριε sa Ebanghelyo ni Juan.
- source_word: εἰ ἦς ὧδε
  choice: kung narito ka noon
  rationale: Ipinahahayag ng kondisyon ang isang hindi naganap na kalagayan sa nakaraan. Nililinaw ng “noon” ang nakaraang punto ng panahon nang hindi dinaragdagan ang diwa.
- source_word: οὐκ ἂν ἀπέθανεν
  choice: hindi sana namatay
  rationale: Ang “hindi sana” ay natural na Tagalog para sa hindi naganap na bunga ng isang salungat-sa-katotohanang kondisyon sa nakaraan.
- source_word: ὁ ἀδελφός μου
  choice: ang kapatid kong lalaki
  rationale: Tiyak na lalaking kapatid ni Marta ang tinutukoy. Iniiwasan ng “kapatid kong lalaki” ang likas na kalabuan ng salitang Tagalog na “kapatid.”
theological_decisions:
- issue: Paglalarawan sa κύριε bilang tawag ni Marta kay Jesus
  choice: Panginoon
  alternative: Ginoo
  rationale: Ang “Panginoon” ay nagpapanatili kapuwa sa magalang na pagtawag at sa posibleng kristolohikal na pahiwatig. Ang “Ginoo” ay posible ngunit maaaring alisin ang sadyang teolohikal na tensiyon sa konteksto ni Juan.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “kapatid kong lalaki” para malinaw ang kasarian ng tinutukoy, at “kung narito ka noon … hindi sana” upang likas na maipahayag ang kondisyong salungat sa nangyari sa nakaraan.
