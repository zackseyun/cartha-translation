  text: εἶπεν οὖν Θωμᾶς ὁ λεγόμενος Δίδυμος τοῖς συμμαθηταῖς· Ἄγωμεν καὶ ἡμεῖς ἵνα ἀποθάνωμεν μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/016.yaml
  text: So Thomas[a], called Didymus, said to his fellow disciples, “Let us also go, so that we may die with him.”
translation:
  language: tl
  text: Kaya sinabi ni Tomas na tinatawag na Didimo[a] sa mga kapwa niya alagad, “Pumunta rin tayo upang mamatay kasama niya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Didimo ay nangangahulugang “Kambal” sa Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Ipinahihiwatig ang lohikal at pasalaysay na pagpapatuloy mula sa naunang pag-uusap, sa natural na modernong Tagalog.
- source_word: Θωμᾶς
  choice: Tomas
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa Tagalog.
- source_word: ὁ λεγόμενος Δίδυμος
  choice: na tinatawag na Didimo[a]
  rationale: Pinanatili ang pangalang Griyego bilang appellation, habang ipinaliliwanag sa talababa ang literal na kahulugang “Kambal.”
- source_word: τοῖς συμμαθηταῖς
  choice: sa mga kapwa niya alagad
  rationale: Ang συμμαθηταί ay mga kasamang alagad; malinaw at likas sa Tagalog ang “mga kapwa niya alagad.”
- source_word: Ἄγωμεν
  choice: Pumunta ... tayo
  rationale: Hortatoryong unang panauhang maramihan ito; natural na paanyaya sa Tagalog ang “Pumunta tayo.”
- source_word: καὶ ἡμεῖς
  choice: rin tayo
  rationale: Pinananatili ang diin na kasama rin si Tomas at ang ibang mga alagad sa pagpunta.
- source_word: ἵνα ἀποθάνωμεν
  choice: upang mamatay tayo
  rationale: Malinaw na pinananatili ng “upang” ang ugnayang layunin o inaasahang bunga nang hindi nilulutas ang tono ni Tomas.
- source_word: μετ’ αὐτοῦ
  choice: kasama niya
  rationale: Tuwirang nagpapahayag ng pakikisama; ang tinutukoy na “niya” ay malinaw sa konteksto bilang si Jesus.
theological_decisions:
- issue: Tono at layunin ng sinabi ni Tomas
  choice: Tuwirang isinalin ang panawagan nang walang idinagdag na emosyonal o teolohikal na paglalarawan.
  alternative: Maaaring unawain bilang matapang na katapatan, mapait na pagsuko sa kapalaran, o pesimistikong pananalita.
  rationale: Hindi tahasang nililinaw ng Griyegong teksto ang tono ni Tomas, kaya pinananatili ng salin ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Iniwasan ang mas makalumang “humayo” at pinili ang natural na “pumunta.”
