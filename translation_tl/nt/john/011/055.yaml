  verdict: revise
  source_fidelity: Tumpak na naihahatid ng draft ang panahon, destinasyon, pinagmulan, layunin, at rituwal na diwa ng Griyego. Gayunman, ang «umahon» ay hindi ang pinakanatural o pinakatatag na Tagalog na katumbas ng ἀνέβησαν sa nakasanayang paglalakbay patungong Jerusalem; «umakyat» ang mas malinaw at tuwirang katumbas.
  naturalness: Natural ang kabuuang pangungusap, kabilang ang «Malapit na» at «upang linisin ang kanilang sarili.» Ang pagpapalit ng «umahon» sa «umakyat» ay magpapalinaw sa modernong Tagalog at iiwas sa posibleng pagbasa ng «umahon» bilang pagbangon o pag-ahon mula sa isang kalagayan.
  terminology: Ang «Paskuwa ng mga Judio» ay angkop na pormal na salin ng τὸ πάσχα τῶν Ἰουδαίων at pinananatili ang paulit-ulit na pananalita ni Juan. Ang «linisin ang kanilang sarili,» na nililinaw ng talababa bilang rituwal na paglilinis, ay hindi nagdaragdag ng doktrinal o moral na kahulugan.
