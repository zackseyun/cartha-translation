source:
  edition: SBLGNT
  text: Ἦν δὲ ἐγγὺς τὸ πάσχα τῶν Ἰουδαίων, καὶ ἀνέβησαν πολλοὶ εἰς Ἱεροσόλυμα ἐκ τῆς χώρας πρὸ τοῦ πάσχα ἵνα ἁγνίσωσιν ἑαυτούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/055.yaml
  text: The Passover of the Jews was near[b][a], and many went up to Jerusalem from the countryside before the Passover to purify themselves.
translation:
  language: tl
  text: Malapit na ang Paskuwa ng mga Judio[a], at maraming tao mula sa kanayunan ang umakyat sa Jerusalem bago ang Paskuwa upang linisin ang kanilang sarili[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Paskuwang Judio.” Mas literal sa Griyego ang “Paskuwa ng mga Judio,” isang pananalitang paulit-ulit na ginagamit sa Juan.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, sumailalim sila sa rituwal na paglilinis bilang paghahanda para sa Paskuwa.
    reason: cultural_note
lexical_decisions:
- source_word: Ἦν δὲ
  choice: Malapit na ang...
  rationale: Hindi ginawang hiwalay na salita ang banayad na pang-ugnay na δέ; natural na naipagpapatuloy ng pangungusap ang salaysay nang hindi nagdaragdag ng tahasang ‘ngayon.’
- source_word: ἐγγὺς
  choice: malapit na
  rationale: Malinaw at likas na pagpapahayag ng nalalapit na panahon sa makabagong Tagalog.
- source_word: τὸ πάσχα τῶν Ἰουδαίων
  choice: ang Paskuwa ng mga Judio
  rationale: Pinananatili ang anyong henitibo ng Griyego at ang paulit-ulit na pananalita ni Juan, sa halip na pakinisin bilang ‘Paskuwang Judio.’
- source_word: ἀνέβησαν
  choice: umahon
  rationale: Pinananatili ang heograpiko at nakaugaliang diwa ng pag-akyat patungong Jerusalem bilang paglalakbay para sa kapistahan.
- source_word: πολλοὶ
  choice: maraming tao
  rationale: Ginagawang hayag sa natural na Tagalog ang substantibong gamit ng pang-uri.
- source_word: εἰς Ἱεροσόλυμα
  choice: sa Jerusalem
  rationale: Likas na direksiyonal na parirala sa Tagalog para sa pagpunta sa isang lungsod.
- source_word: ἐκ τῆς χώρας
  choice: mula sa kanayunan
  rationale: Ipinahihiwatig ang mga pook sa labas ng lungsod nang hindi nililimitahan sa isang tiyak na administratibong lalawigan.
- source_word: πρὸ τοῦ πάσχα
  choice: bago ang Paskuwa
  rationale: Tuwiran at malinaw na salin ng pariralang temporal.
- source_word: ἵνα ἁγνίσωσιν ἑαυτούς
  choice: upang linisin ang kanilang sarili
  rationale: Pinananatili ang layunin ng ἵνα at ang diwa ng rituwal na paglilinis, habang ang talababa ang nagbibigay ng kailangang kontekstong pangkultura.
theological_decisions:
- issue: Kalikasan ng paglilinis bago ang Paskuwa
  choice: linisin ang kanilang sarili
  alternative: dalisayin ang kanilang sarili; maglinis ayon sa rituwal
  rationale: Sa konteksto, tumutukoy ito sa rituwal na paghahanda ng mga Judio para sa Paskuwa. Hindi ito tinukoy bilang panloob na paglilinis sa moralidad o bilang isang sakramentong Kristiyano.
- issue: Pagkakaugnay ng Paskuwa at ng mga Judio
  choice: Paskuwa ng mga Judio
  alternative: Paskuwang Judio
  rationale: Pinananatili ang tunay na kayarian at natatanging paulit-ulit na pananalita sa Ebanghelyo ni Juan nang hindi nagdaragdag ng denominasyonal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang ‘Paskuwa’ bilang kinikilalang katawagan sa kapistahan; ang ‘umahon’ ay nagpapanatili sa diwa ng paglalakbay patungong Jerusalem. Inilagay ang bawat talababa sa mismong bahaging tinutukoy nito.
