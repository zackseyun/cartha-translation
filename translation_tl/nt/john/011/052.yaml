id: JHN.11.52
reference: John 11:52
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ οὐχ ὑπὲρ τοῦ ἔθνους μόνον, ἀλλ’ ἵνα καὶ τὰ τέκνα τοῦ θεοῦ τὰ διεσκορπισμένα συναγάγῃ εἰς ἕν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/052.yaml
  text: and not for the nation only[b][a], but also so that he might gather into one the scattered children of God.
translation:
  language: tl
  text: at hindi lamang para sa bansa[a], kundi upang tipunin din niya sa iisa ang mga nakakalat na anak ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa kontekstong ito, ang “bansa” ay tumutukoy sa bansang Judio.
    reason: cultural_note
lexical_decisions:
- source_word: ἔθνους
  choice: bansa
  rationale: Pinananatili ang isahang kolektibong diwa ng salita; sa konteksto, tumutukoy ito sa bansang Judio.
- source_word: ἵνα
  choice: upang
  rationale: Likas at marangal na panandang Filipino para sa layunin, habang pinananatili ang puwersang purposibo ng sugnay.
- source_word: τέκνα τοῦ θεοῦ
  choice: mga anak ng Diyos
  rationale: Ang τέκνα ay sumasaklaw sa lahat ng kasarian at hindi dapat paliitin sa 'mga anak na lalaki.'
- source_word: διεσκορπισμένα
  choice: mga nakakalat
  rationale: Ipinapahayag ang umiiral na kalagayan ng pagkakahiwa-hiwalay na ipinahihiwatig ng perfect passive participle.
- source_word: συναγάγῃ
  choice: tipunin niya
  rationale: Tumpak at natural na katumbas ng aorist subjunctive sa sugnay na pinangungunahan ng ἵνα.
- source_word: εἰς ἕν
  choice: bilang isa
  rationale: Pinananatili ang maikli at sadyang hindi espesipikong pahayag ng Griyego nang hindi nagdaragdag ng 'katawan' o ibang pangngalan.
- source_word: καὶ οὐχ ὑπὲρ τοῦ ἔθνους μόνον, ἀλλ’
  choice: at hindi lamang para sa bansa, kundi
  rationale: Ipinagpapatuloy ang diwa ng naunang talata tungkol sa pagkamatay ni Jesus para sa iba at pinananatili ang balangkas ng pagtutunggali.
theological_decisions:
- issue: Pagkakakilanlan ng 'mga anak ng Diyos'
  choice: Panatilihing malawak at hindi espesipiko ang katawagan sa mga anak ng Diyos na nakakalat at titipunin sa pamamagitan ng kamatayan ni Jesus.
  alternative: Tukuyin sila bilang mga Judiong nasa Diaspora lamang, o tahasang bilang mga hinirang na mananampalataya mula sa mga Judio at mga Hentil.
  rationale: Inihihiwalay ng talata ang 'bansa' sa mas malawak na pangkat ng mga anak ng Diyos, ngunit hindi nito tahasang nililinaw ang eksaktong saklaw. Hindi dapat lutasin ng salin ang tensiyong hindi nilulutas ng Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pagkakaugnay sa naunang talata sa panimulang “at,” at iniwasang dagdagan ang εἰς ἕν ng interpretibong pangngalan gaya ng “katawan.”
