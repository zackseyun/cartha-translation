base_translation:
  language: en
  yaml_path: translation/nt/john/011/003.yaml
  text: So the sisters sent word to him, saying, “Lord, look, the one you love is sick.”
translation:
  language: tl
  text: Kaya nagpadala ng mensahe sa kanya ang magkapatid na babae, na nagsasabi, “Panginoon, narito, may sakit ang minamahal mo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλαν
  choice: nagpasabi
  rationale: Ipinahihiwatig ng pandiwa na nagpadala sila ng mensahe; mas natural sa modernong Tagalog ang “nagpasabi” kaysa sa literal na “nagpadala.”
- source_word: αἱ ἀδελφαί
  choice: ang magkapatid na babae
  rationale: Malinaw nitong pinananatili na sina Marta at Maria ay magkapatid at kapwa babae.
- source_word: Κύριε
  choice: Panginoon
  rationale: Karaniwang salin ng κύριε sa ganitong tuwirang pagtawag kay Jesus, habang hinahayaang manatili ang saklaw nito bilang magalang na titulo at pagkilala sa kanyang awtoridad.
- source_word: ἴδε
  choice: tingnan mo
  rationale: Pinananatili ang tahasang panawag-pansin ng Griyego sa natural ngunit marangal na Tagalog.
- source_word: ὃν φιλεῖς
  choice: ang taong mahal mo
  rationale: Likas na ipinahahayag sa Tagalog ang tinutukoy na tao at ang personal na pagmamahal na dala ng φιλέω.
- source_word: ἀσθενεῖ
  choice: may sakit
  rationale: Direkta at karaniwang katumbas ng pagiging maysakit sa kontekstong ito.
theological_decisions:
- issue: Saklaw ng titulong κύριε
  choice: Panginoon
  alternative: Ginoo
  rationale: Pinili ang tradisyonal at natural na pagtawag kay Jesus nang hindi dinaragdagan ng paliwanag na magpapasya kung ang titulo rito ay purong paggalang o ganap na pahayag tungkol sa kanyang pagka-Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang gitling na em upang natural na maihatid ang ἴδε bilang panawag-pansin bago ang balita.
