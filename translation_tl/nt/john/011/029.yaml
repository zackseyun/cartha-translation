  text: And when she heard it[a], she got up quickly and went to him.
translation:
  language: tl
  text: Nang marinig niya iyon, agad siyang tumayo at pumunta sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “At siya, nang marinig niya iyon, ay agad na tumayo at naglalakad patungo sa kanya.”'
    reason: Ipinapakita ang demonstratibong ἐκείνη at ang nagpapatuloy na aspekto ng imperfect na ἤρχετο, na pinadulas sa pangunahing salin.
lexical_decisions:
- source_word: ἐκείνη
  choice: niya / siyang
  rationale: Tumutukoy ang demonstratibo kay Maria sa naunang konteksto. Mas natural sa makabagong Tagalog ang panghalip kaysa sa literal na “ang babaing iyon.”
- source_word: δὲ
  choice: hindi tahasang isinalin
  rationale: Mahinang pang-ugnay ito na nagpapatuloy sa salaysay. Sapat na sa natural na Tagalog ang pagkakasunod ng mga pangyayari nang hindi nagdaragdag ng “at” sa simula.
- source_word: ὡς ἤκουσεν
  choice: Nang marinig niya iyon
  rationale: Ang ὡς ay temporal dito, kaya ang “nang” ay natural at hindi nagpapalakas sa diwang gaya ng “sa sandaling.” Ang “iyon” ay tumutukoy sa ibinalita sa naunang talata.
- source_word: ἠγέρθη
  choice: tumayo
  rationale: 'Bagaman pormal na pasibo ang anyong Griyego, intransitibo ang kahulugan dito: bumangon o tumayo siya. Ang “tumayo” ay malinaw at natural sa konteksto.'
- source_word: ταχὺ
  choice: agad
  rationale: Ipinahihiwatig ng pang-abay ang mabilis at kaagad na pagtugon. Mas natural dito ang “agad” kaysa sa “mabilis,” na maaaring maglarawan lamang sa bilis ng pisikal na pagtayo.
- source_word: ἤρχετο
  choice: pumunta
  rationale: Ipinapakita ng imperfect ang kilos na nagpapatuloy, ngunit natural na isinasalaysay ito sa Tagalog bilang “pumunta.” Binabanggit sa talababa ang mas tahasang progresibong anyo.
- source_word: πρὸς αὐτόν
  choice: sa kanya
  rationale: Nagsasaad ito ng paggalaw patungo sa isang tao. Malinaw sa konteksto na si Jesus ang tinutukoy, ngunit pinananatili ng panghalip ang anyo at daloy ng Griyego.
