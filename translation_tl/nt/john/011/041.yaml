id: JHN.11.41
reference: John 11:41
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἦραν οὖν τὸν ⸀λίθον. ὁ δὲ Ἰησοῦς ἦρεν τοὺς ὀφθαλμοὺς ἄνω καὶ εἶπεν· Πάτερ, εὐχαριστῶ σοι ὅτι ἤκουσάς μου,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/041.yaml
  text: So they took away the stone[a]. And Jesus lifted his eyes upward and said, “Father[b], I thank you that you have heard me,”
translation:
  language: tl
  text: Kaya inalis nila ang bato. Tumingala si Jesus at sinabi, “Ama, nagpapasalamat ako sa iyo dahil narinig mo ako.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “itinaas niya ang kanyang mga mata paitaas.”
    reason: lexical_alternative
  - marker: b
    text: O “dininig mo ako.” Sa konteksto ng panalangin, maaari itong magpahiwatig ng pakikinig na may pagsang-ayon.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦραν
  choice: inalis
  rationale: Sa konteksto, ang bato ay inilipat mula sa bukana ng libingan. Ang “inalis” ay malinaw at likas sa modernong Tagalog.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinakikita nito na ang ginawa nila ay bunga ng naunang utos ni Jesus; natural nitong pinananatili ang daloy ng salaysay.
- source_word: λίθον
  choice: bato
  rationale: Ito ang karaniwang katawagan sa batong nakatakip sa libingan.
- source_word: ἦρεν τοὺς ὀφθαλμοὺς ἄνω
  choice: Tumingala
  rationale: Likas na idyomang Tagalog ito para sa pagtingin paitaas at maikli nitong naihahatid ang kilos na inilalarawan ng Griyego.
- source_word: δὲ
  choice: Hindi isinalin nang hiwalay
  rationale: Mahinang transisyong pasalaysay lamang ito rito. Sapat na ang paghahati sa dalawang pangungusap sa Tagalog upang maipakita ang paglipat ng pokus kay Jesus.
- source_word: Πάτερ
  choice: Ama
  rationale: Direkta, marangal, at natural na anyo ng pagtawag sa Diyos sa panalangin.
- source_word: εὐχαριστῶ σοι
  choice: nagpapasalamat ako sa iyo
  rationale: Tuwirang ipinapahayag ang kasalukuyang pasasalamat ni Jesus sa natural na modernong Tagalog.
- source_word: ὅτι ἤκουσάς μου
  choice: dahil dininig mo ako
  rationale: Ang aspektong naganap ng “dininig” ay angkop sa Griyegong aorist, at sa konteksto ng panalangin maaari itong magpahiwatig ng pakikinig na may pagtugon, nang hindi dinaragdagan ang sinabi ng talata.
theological_decisions:
- issue: Pagtawag ni Jesus sa Diyos sa panalangin
  choice: Ama
  alternative: O Ama
  rationale: Pinananatili ng payak na “Ama” ang lapit at paggalang ng bokatibong Griyego nang walang makalumang o idinagdag na estilong liturhikal.
- issue: Kahulugan ng pakikinig ng Ama sa panalangin ni Jesus
  choice: dininig mo ako
  alternative: narinig mo ako
  rationale: Ang “dininig” ay natural sa konteksto ng panalangin at maaaring magpahiwatig ng kanais-nais na pakikinig. Inilalagay sa talababa ang mas neutral na “narinig” upang hindi maitago ang saklaw ng kahulugan ng Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na likas basahin ngunit marangal ang himig. Ginamit ang “tumingala” bilang karaniwang idyoma at ang “dininig” bilang pananalitang angkop sa panalangin. Ang mga panandang [a] at [b] ay inilagay mismo sa mga pariralang tinutukoy ng mga talababa.
