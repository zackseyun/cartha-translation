  terminology: Ang “Ama” at “nagpapasalamat ako sa iyo” ay wastong mga katumbas. Ginawang pangunahing salin ang “narinig mo ako” upang huwag magdagdag ng implikasyon ng pagsagot sa panalangin; inilagay ang “dininig” bilang alternatibo.
