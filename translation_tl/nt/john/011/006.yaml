base_translation:
  language: en
  yaml_path: translation/nt/john/011/006.yaml
  text: So when he heard that he was sick[a], he then stayed two days in the place where he was.
translation:
  language: tl
  text: Kaya nang marinig niyang may sakit si Lazaro, nanatili pa siya nang dalawang araw sa lugar na kinaroroonan niya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς οὖν
  choice: Kaya nang
  rationale: Pinagsasama nito ang pagpapatuloy o lohikal na ugnayan ng οὖν at ang panahong ipinahihiwatig ng ὡς sa natural na salaysay sa Filipino.
- source_word: ἤκουσεν
  choice: marinig niya
  rationale: Tuwirang katumbas ng karaniwang kahulugan ng ἀκούω at angkop sa sugnay na nagsisimula sa “nang.”
- source_word: ὅτι ἀσθενεῖ
  choice: may sakit si Lazaro
  rationale: Sa konteksto, ang ἀσθενέω ay tumutukoy sa pisikal na karamdaman. Ginawang tahasan ang pangalang Lazaro upang maiwasan ang malabong sunod-sunod na panghalip sa Filipino; malinaw ang tinutukoy mula sa naunang konteksto. Ang “may sakit” ay likas sa Filipino at hindi nangangailangan ng paglilipat ng panahunan gaya sa Ingles.
- source_word: τότε μὲν
  choice: pa
  rationale: Sa kombinasyong “nanatili pa,” natural na naipahihiwatig ang kapansin-pansing pagpapatuloy ng pananatili matapos niyang marinig ang balita. Hindi ginawang mabigat ang μέν, na banayad lamang at may kaugnayan sa kasunod na pag-usad ng salaysay.
- source_word: ἔμεινεν
  choice: nanatili
  rationale: Tumpak na inilalarawan ang hindi muna pag-alis mula sa isang lugar at angkop sa marangal na salaysay.
- source_word: ἐν ᾧ ἦν τόπῳ
  choice: sa lugar na kinaroroonan niya
  rationale: Pinananatili ang tahasang lokatibong parirala ng Griyego habang gumagamit ng natural na modernong Filipino.
- source_word: δύο ἡμέρας
  choice: nang dalawang araw
  rationale: Natural na pagpapahayag sa Filipino ng akusatibong nagsasaad ng tagal.
theological_decisions:
- issue: Ang implikasyon ng pagkaantala ni Jesus matapos marinig ang karamdaman ni Lazaro
  choice: Tahasang sabihing nanatili pa siya roon nang dalawang araw, nang walang paliwanag sa pangunahing teksto.
  alternative: Ipaliwanag o palambutin ang pagkaantala bilang isang mahabaging estratehiya.
  rationale: Sadyang pinananatili ng talata ang tensiyon sa pagitan ng balita tungkol sa karamdaman at ng patuloy na pananatili ni Jesus; hindi ito dapat lutasin ng salin.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Iniwasan ang literal ngunit mabigat na “sa lugar kung saan siya naroon,” gayundin ang di-likas na paggaya sa reported-speech tense shift ng Ingles.
