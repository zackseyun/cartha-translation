  naturalness: Mas magiging malinaw at likas ang saklaw ng “alang-alang sa inyo” kapag inilagay ito bilang panggitnang parirala. Ang “Pumunta tayo sa kaniya” ay tuwirang katumbas ng kilusang ipinahahayag ng πρὸς αὐτόν at iwas sa bahagyang konotasyong “dalawin” na maaaring dala ng “puntahan.”
  terminology: Ang “maniwala” ay angkop para sa πιστεύσητε at hindi nagdaragdag ng doktrinal na pahiwatig tungkol sa dating kalagayan ng mga alagad. Ang “kaniya” ay pinanatiling makabagong pamantayang anyo.
