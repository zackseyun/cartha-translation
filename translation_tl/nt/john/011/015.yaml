  text: καὶ χαίρω δι’ ὑμᾶς, ἵνα πιστεύσητε, ὅτι οὐκ ἤμην ἐκεῖ· ἀλλὰ ἄγωμεν πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/015.yaml
  text: And I am glad for your sake that I was not there[a], so that you may believe. But let us go to him.
translation:
  language: tl
  text: At natutuwa ako, alang-alang sa inyo, na wala ako roon, upang maniwala kayo.[a] Ngunit pumunta tayo sa kaniya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “upang magsimula kayong maniwala.” Maaaring ipahiwatig ng aorist na anyong Griyego ang pagsisimula ng paniniwala, ngunit hindi nito tiyak na sinasabing hindi pa sila naniniwala.
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρω
  choice: natutuwa ako
  rationale: Likas at makabagong Tagalog para sa kasalukuyang positibong damdamin; mas pangkaraniwan kaysa sa mas pormal na “nagagalak ako.”
- source_word: δι’ ὑμᾶς
  choice: alang-alang sa inyo
  rationale: Ipinahahayag ang kapakinabangan ng mga alagad, hindi lamang na sila ang sanhi ng tuwa ni Jesus.
- source_word: ἵνα πιστεύσητε
  choice: upang maniwala kayo
  rationale: Pinananatili ang layuning ipinahahayag ng ἵνα at ang malawak na kahulugan ng πιστεύω nang hindi ipinapalagay na lubos silang hindi pa naniniwala.
- source_word: ὅτι οὐκ ἤμην ἐκεῖ
  choice: na wala ako roon
  rationale: Direkta at likas na salin ng nilalaman ng ikinatuwa ni Jesus; hindi kailangang idagdag ang diwang “naroroon.”
- source_word: ἀλλὰ ἄγωμεν
  choice: Ngunit puntahan natin
  rationale: Ang ἀλλά ay nagpapahiwatig ng pagsalungat at paglipat sa pagkilos, at ang hortatory subjunctive ay natural na naipapahayag sa “puntahan natin.”
- source_word: πρὸς αὐτόν
  choice: siya
  rationale: Kasama ng pandiwang “puntahan,” malinaw at idiomatiko nitong ipinahahayag ang pagkilos patungo sa kaniya.
theological_decisions:
- issue: Lakas ng πιστεύσητε sa konteksto ng Juan
  choice: maniwala kayo
  alternative: magsimula kayong maniwala
  rationale: Maaaring may ingressive na diin ang aorist subjunctive, ngunit hindi nito kailangang ipahiwatig na wala pang anumang pananampalataya ang mga alagad. Pinananatili ng pangunahing salin ang tensiyong ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “natutuwa” sa halip na mas pormal na “nagagalak,” at “puntahan natin siya” bilang likas na paanyayang kumilos.
