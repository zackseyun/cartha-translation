  source_fidelity: Tumpak na naisalin ang εἷς δέ τις ἐξ αὐτῶν bilang “isa sa kanila,” ang banayad na δέ bilang “Ngunit,” at ang ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου bilang paglalarawang si Caifas ay pinakapunong pari nang taong iyon. Ang “Wala kayong alam!” ay likas at sapat na mariing katumbas ng emphatic na Ὑμεῖς οὐκ οἴδατε οὐδέν, nang hindi inaangkin ang lohikal na double negation.
  naturalness: Natural at malinaw ang ayos ng pangungusap sa makabagong Filipino. Ang “pinakapunong pari” at “Caifas” ay kapwa mauunawaan at angkop sa marangal na rehistrong pampanitikan/Biblikal. Ang padamdam ay angkop sa matinding saway sa direktang pahayag.
  terminology: Wasto at pare-pareho ang paggamit ng “Caifas” para sa Καϊάφας at “pinakapunong pari” para sa ἀρχιερεύς sa kontekstong tumutukoy sa nag-iisang mataas na katungkulan. Hindi nagdaragdag ang salin ng anumang interpretasyong teolohikal sa tala na “nang taong iyon.”
