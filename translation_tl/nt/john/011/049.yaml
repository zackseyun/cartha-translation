id: JHN.11.49
reference: John 11:49
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἷς δέ τις ἐξ αὐτῶν Καϊάφας, ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου, εἶπεν αὐτοῖς· Ὑμεῖς οὐκ οἴδατε οὐδέν,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/049.yaml
  text: But one of them[a], Caiaphas, who was high priest that year, said to them, “You know nothing at all.”
translation:
  language: tl
  text: Ngunit sinabi sa kanila ng isa sa kanila, si Caifas, na siyang pinakapunong pari nang taong iyon, “Wala kayong alam!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas pormal na pananalita, “Wala kayong anumang nalalaman.” Mariing saway ang pananalitang Griyego, na gumagamit ng pinatinding negatibong anyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷς δέ τις ἐξ αὐτῶν
  choice: Ngunit sinabi sa kanila ng isa sa kanila
  rationale: Ang εἷς ... τις ay likas na ipinapahayag sa Filipino bilang “isa sa kanila.” Isinama ang δέ bilang “Ngunit” upang ipakita ang banayad na pagsalungat o paglipat mula sa naunang talakayan; inayos ang pagkakasunod ng pangungusap para maging natural sa Tagalog.
- source_word: Καϊάφας
  choice: Caifas
  rationale: Ginamit ang nakagawiang anyo ng pangalang ito sa makabagong saling Filipino.
- source_word: ἀρχιερεὺς
  choice: pinakapunong pari
  rationale: Tiyak nitong tinutukoy ang nag-iisang pinakamataas na pinunong pari, at hindi ang mas malawak na pangkat ng mga punong pari.
- source_word: ὢν τοῦ ἐνιαυτοῦ ἐκείνου
  choice: na siyang pinakapunong pari nang taong iyon
  rationale: Natural na inilalarawan sa Filipino ang katungkulan ni Caifas sa panahong tinutukoy, nang hindi nagdaragdag ng paliwanag tungkol sa haba o paraan ng kaniyang panunungkulan.
- source_word: εἶπεν αὐτοῖς
  choice: sinabi sa kanila
  rationale: Tuwirang katumbas ito ng pandiwa at di-tuwirang layon, at hindi nito dinaragdagan ang paraan o tono ng pagsasalita.
- source_word: Ὑμεῖς οὐκ οἴδατε οὐδέν
  choice: Wala kayong alam!
  rationale: Likas at mariing saway ito sa Filipino. Naipahahayag nito ang diin ng tahasang panghalip at ng pinatinding negatibong pahayag sa Griyego.
theological_decisions:
- issue: Ang temporal na paglalarawan sa katungkulan ni Caifas
  choice: na siyang pinakapunong pari nang taong iyon
  alternative: na pinakapunong pari noong taong iyon
  rationale: Pinananatili itong payak na paglalarawang pangkasaysayan. Hindi ipinaliliwanag sa mismong salin ang posibleng kabuluhang teolohikal o ironiyang pampanitikan ng tala ni Juan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ang padamdam ay nagpapahiwatig ng matinding saway na taglay ng Griyego, samantalang ang talababa ay nagbibigay ng mas pormal na alternatibo.
