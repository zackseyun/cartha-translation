id: JHN.11.31
reference: John 11:31
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἱ οὖν Ἰουδαῖοι οἱ ὄντες μετ’ αὐτῆς ἐν τῇ οἰκίᾳ καὶ παραμυθούμενοι αὐτήν, ἰδόντες τὴν ⸀Μαριὰμ ὅτι ταχέως ἀνέστη καὶ ἐξῆλθεν, ἠκολούθησαν αὐτῇ ⸀δόξαντες ὅτι ὑπάγει εἰς τὸ μνημεῖον ἵνα κλαύσῃ ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/031.yaml
  text: So the Jews who were with her in the house and comforting her[a], when they saw that Mary got up quickly and went out, followed her, thinking that she was going to the tomb to weep there.
translation:
  language: tl
  text: Kaya ang mga Judio[a] na kasama niya sa bahay at umaaliw sa kanya ay sumunod sa kanya nang makita nilang mabilis na tumayo si Maria at lumabas, dahil inakala nilang pupunta siya sa libingan upang umiyak doon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga taga-Judea.” Sa Juan, ang Ἰουδαῖοι ay maaaring tumukoy nang mas makitid sa mga taga-Judea o sa mga pinunong Judio; dito, tumutukoy ito sa pangkat na nakikiramay kay Maria.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ οὖν Ἰουδαῖοι
  choice: Kaya ang mga Judio[a]
  rationale: Ang οὖν ay likas na isinaling “Kaya” bilang pang-ugnay sa pagpapatuloy ng salaysay. Ang Ἰουδαῖοι ay tuwirang “mga Judio,” ngunit maaaring mangahulugang “mga taga-Judea” depende sa konteksto; dito, tumutukoy ito sa mga nakikiramay kay Maria.
- source_word: οἱ ὄντες μετ’ αὐτῆς ἐν τῇ οἰκίᾳ
  choice: na kasama niya sa bahay
  rationale: Tinutukoy ng pariralang participyal kung aling mga Judio ang tinutukoy, at pinananatili ang payak na lokasyong “sa bahay.”
- source_word: παραμυθούμενοι αὐτήν
  choice: umaaliw sa kanya
  rationale: Ang παραμυθέομαι ay tumutukoy sa pagbibigay ng kaaliwan o pagdamay; natural sa makabagong Filipino ang “umaaliw” sa konteksto ng pagluluksa.
- source_word: ἰδόντες
  choice: nang makita nila
  rationale: Isinalin ang aorist participle bilang sugnay na pamanahon upang malinaw ang pagkakasunod-sunod ng mga pangyayari.
- source_word: ταχέως ἀνέστη καὶ ἐξῆλθεν
  choice: mabilis na tumayo si Maria at lumabas
  rationale: Sa kontekstong ito, ang ἀνέστη ay pagbangon mula sa pagkakaupo, hindi muling pagkabuhay; malinaw at natural ang “tumayo.”
- source_word: ἠκολούθησαν αὐτῇ
  choice: sumunod sa kanya
  rationale: Pisikal na pagsunod ang kahulugan dito; walang kinakailangang pahiwatig ng pagiging alagad.
- source_word: δόξαντες
  choice: dahil inakala nila
  rationale: Ipinahahayag ng participle ang palagay na dahilan ng kanilang pagsunod. Ang “inakala” ay malinaw na nagsasaad na hindi nila tiyak ang layunin ni Maria.
- source_word: ὑπάγει εἰς τὸ μνημεῖον
  choice: pupunta siya sa libingan
  rationale: Ang present tense sa di-tuwirang pahayag ay natural na ipinahahayag sa Filipino bilang inaasahang kilos. Ang μνημεῖον ay “libingan” sa konteksto ng paglilibing kay Lazaro.
- source_word: ἵνα κλαύσῃ ἐκεῖ
  choice: upang umiyak doon
  rationale: Pinananatili ng “upang” ang layuning ipinahahayag ng ἵνα kasama ng subjunctive.
theological_decisions:
- issue: Kahulugan ng Ἰουδαῖοι sa salaysay ni Juan
  choice: mga Judio
  alternative: mga taga-Judea
  rationale: Nag-iiba ayon sa konteksto ang gamit ni Juan sa Ἰουδαῖοι. Dito, ang tinutukoy ay ang pangkat na kasama at umaaliw kay Maria, hindi ang buong sambayanang Judio o kinakailangang mga pinunong Judio. Pinanatili sa teksto ang tuwirang salin at inilagay sa talababa ang posibleng heograpikong kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “umaaliw” at “libingan” bilang mga karaniwang salitang angkop sa tagpo ng pagluluksa. Inayos ang sugnay upang maging natural sa Filipino habang pinananatili ang pagkakasunod at ugnayang sanhi ng tekstong Griyego.
