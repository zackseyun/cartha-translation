  text: ἦν δὲ ⸀Μαριὰμ ἡ ἀλείψασα τὸν κύριον μύρῳ καὶ ἐκμάξασα τοὺς πόδας αὐτοῦ ταῖς θριξὶν αὐτῆς, ἧς ὁ ἀδελφὸς Λάζαρος ἠσθένει.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/002.yaml
  text: It was Mary who had anointed the Lord with perfume and wiped his feet with her hair[a], whose brother Lazarus was sick.
translation:
  language: tl
  text: Si Maria ang nagpahid ng mabangong langis sa Panginoon at nagpunas ng mga paa niya gamit ang sariling buhok[a]. Ang kapatid niyang lalaki, si Lazaro, ay may sakit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pabango” o “mabangong pamahid”; ang salitang Griyego ay tumutukoy sa mabangong langis o pamahid.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ Μαριὰμ
  choice: Si Maria ang
  rationale: Likas na paraang Filipino upang ipakilala at tukuyin si Maria; hindi dinaragdagan ng tahasang temporal na “ngayon” ang banayad na pang-ugnay na δέ.
- source_word: ἡ ἀλείψασα
  choice: nagpahid
  rationale: Inilalarawan ng may artikulong aorist participle si Maria sa pamamagitan ng ginawa niya. Hindi kailangang gawing tahasang pluperfect sa Filipino dahil malinaw sa konteksto ang naunang pangyayari.
- source_word: τὸν κύριον
  choice: sa Panginoon
  rationale: Pinananatili ang karaniwang titulong “Panginoon” para kay Jesus at ang bigat nitong naratibo at teolohikal.
- source_word: μύρῳ
  choice: ng mabangong langis
  rationale: Ang μύρον ay pabango o pamahid na nasa anyong langis; malinaw at natural sa modernong Filipino ang “mabangong langis.”
- source_word: καὶ ἐκμάξασα τοὺς πόδας αὐτοῦ
  choice: at nagpunas ng mga paa niya
  rationale: Tuwirang ipinapahayag ang pagpahid o pagpapatuyo sa mga paa sa likas na ayos ng Filipino.
- source_word: ταῖς θριξὶν αὐτῆς
  choice: gamit ang sariling buhok
  rationale: Ipinahahayag ang instrumental na dative at nililinaw ng “sariling” na buhok ni Maria ang ginamit.
- source_word: ἧς ὁ ἀδελφὸς Λάζαρος
  choice: Kapatid niya ... si Lazaro
  rationale: Hinahati sa ikalawang pangungusap ang masalimuot na kaugnay na sugnay upang maging malinaw at natural, habang pinananatili ang ugnayan ni Maria kay Lazaro.
- source_word: ἠσθένει
  choice: may-sakit
  rationale: Tumutukoy ang imperfect na pandiwa sa nagpapatuloy na pisikal na karamdaman ni Lazaro sa puntong iyon ng salaysay.
theological_decisions:
- issue: Pagsasalin ng κύριος bilang titulo ni Jesus
  choice: Panginoon
  alternative: Guro / amo
  rationale: Pinananatili ng “Panginoon” ang karaniwang titulo at ang teolohikal at naratibong bigat nito, sa halip na paliitin ito sa panlipunang kahulugan lamang.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “niya” sa halip na mas pormal na “kaniya,” at hinati ang mahabang estruktura sa dalawang pangungusap para sa likas na daloy nang hindi binabago ang kahulugan.
