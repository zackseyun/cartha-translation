  source_fidelity: 'Kailangang itama ang ikalawang pangungusap. Ang “Kapatid niya ang may-sakit na si Lazaro” ay hindi tahasang naipapahayag na si Lazaro ang kapatid na lalaki ni Maria, samantalang ang Griyegong ἀδελφός ay “kapatid na lalaki/brother.” Ang natitirang nilalaman ay tapat sa teksto: si Maria ang naglagay ng μύρον sa Panginoon at nagpunas ng kanyang mga paa gamit ang kanyang buhok; si Lazaro ay may sakit.'
