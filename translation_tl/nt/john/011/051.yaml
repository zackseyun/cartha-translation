  text: τοῦτο δὲ ἀφ’ ἑαυτοῦ οὐκ εἶπεν, ἀλλὰ ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου ἐπροφήτευσεν ὅτι ἔμελλεν Ἰησοῦς ἀποθνῄσκειν ὑπὲρ τοῦ ἔθνους,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/051.yaml
  text: He did not say this from himself[a], but being high priest that year, he prophesied that Jesus was going to die for the nation[c][b],
translation:
  language: tl
  text: Hindi niya ito sinabi sa sarili niyang pagkukusa[a], ngunit bilang punong saserdote nang taong iyon, nagpropesiya siya na mamamatay[b] si Jesus para sa bansa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mula sa sarili niya” o “nang kusa lamang.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “malapit nang mamatay” o “nakatakdang mamatay.”
    reason: lexical_alternative
  - marker: c
    text: O, “alang-alang sa bansa” o “para sa kapakanan ng bansa.”
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτο δὲ ... οὐκ εἶπεν
  choice: Hindi niya ito sinabi
  rationale: Likas at tuwirang Filipino ito para sa pagtanggi na siya mismo ang pinagmulan ng pahayag; hindi na dinagdagan ng tahasang panandang temporal na wala sa Griyego.
- source_word: ἀφ’ ἑαυτοῦ
  choice: sa sarili niyang pagkukusa
  rationale: Ipinahahayag nito na ang sinabi ay hindi nagmula lamang sa sariling pagkukusa ni Caifas. Mas natural ito sa kasalukuyang Filipino kaysa sa literal na “mula sa sarili niya,” na inilalagay sa talababa bilang alternatibo.
- source_word: ἀλλὰ ἀρχιερεὺς ὢν
  choice: Sa halip, bilang pinakapunong pari
  rationale: Pinananatili ng “sa halip” ang pagsalungat ng ἀλλά, at ng “bilang” ang pangkaligirang diwa ng participle nang hindi ginagawang tahasang sanhi ang pagiging pinakapunong pari.
- source_word: τοῦ ἐνιαυτοῦ ἐκείνου
  choice: nang taong iyon
  rationale: Natural na Filipino para sa pagtukoy sa kaniyang katungkulan bilang pinakapunong pari sa partikular na taong iyon.
- source_word: ἐπροφήτευσεν
  choice: ipinahayag niya bilang propesiya
  rationale: Malinaw na pinananatili ang tunay na puwersang propetiko ng pandiwa, ngunit hindi ipinapalagay kung lubos na nauunawaan ni Caifas ang kahulugan ng kaniyang sinabi.
- source_word: ἔμελλεν ... ἀποθνῄσκειν
  choice: mamamatay
  rationale: Ang payak na anyong panghinaharap ay natural sa Filipino at pinananatili ang inaasahang mangyayari nang hindi sapilitang nililimitahan sa agarang nalalapit o sa itinakdang kapalaran.
- source_word: ὑπὲρ τοῦ ἔθνους
  choice: para sa bansa
  rationale: Pinananatili ng “para sa” ang malawak na diwang kapakinabangan o pagkilos alang-alang sa iba, nang hindi ipinapasok sa pangunahing teksto ang mas teknikal na pagbasa hinggil sa pagtubos. Ang “bansa” ay tumutukoy rito sa bansang Judio.
theological_decisions:
- issue: Ang pahayag ni Caifas bilang propesiya
  choice: Tahasang sinasabing ipinahayag niya ito bilang propesiya kaugnay ng pagiging pinakapunong pari niya nang taong iyon.
  alternative: Na sinasadya at ganap na nauunawaan ni Caifas ang propesiya; o na purong ironiya lamang ito at hindi tunay na propesiya.
  rationale: Mismong teksto ang nagsasabing ἐπροφήτευσεν, kaya pinananatili ang tunay na katangiang propetiko. Hindi naman dinaragdagan ng salin ang sinasabi tungkol sa kamalayan, katuwiran, o paraan ng inspirasyon ni Caifas.
- issue: Puwersa ng ὑπέρ sa kamatayan ni Jesus
  choice: para sa bansa
  alternative: alang-alang sa bansa; para sa kapakanan ng bansa; bilang kahalili ng bansa
  rationale: Sapat na malawak ang “para sa” upang maipahiwatig ang kapakinabangan at kinatawang pagkilos, ngunit hindi nito ipinipilit ang isang mas makitid na pormula ng pagtubos kaysa sa tahasang sinasabi ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pinakapunong pari” bilang madaling maunawaang katawagan sa ἀρχιερεύς. Iniwasan ang labis na literal ngunit alanganing “mula sa sarili niya” sa pangunahing teksto, habang pinanatili ito sa talababa. Hindi nilinaw nang higit sa Griyego ang kamalayan ni Caifas o ang eksaktong teknikal na diwa ng ὑπέρ.
