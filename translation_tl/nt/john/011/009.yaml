base_translation:
  language: en
  yaml_path: translation/nt/john/011/009.yaml
  text: Jesus answered[a], “Are there not twelve hours in the day? If anyone walks in the day, he does not stumble[c][b], because he sees the light of this world.”
translation:
  language: tl
  text: Sumagot si Jesus, “Hindi ba may labindalawang oras ang maghapon?[a] Kung lumalakad ang isang tao sa maghapon, hindi siya natitisod,[b] sapagkat nakikita niya ang liwanag ng mundong ito.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Hindi ba labindalawang oras ang araw?” Ang tinutukoy ay ang panahong maliwanag sa isang araw.
    reason: lexical_alternative
  - marker: b
    text: 'Sa Griyego, kumakatawang isahan ang pananalita: “isang tao … siya.”'
    reason: lexical_alternative
  - marker: c
    text: Ang “liwanag ng mundong ito” ay maaaring umalingawngaw sa mas malawak na tema ng liwanag sa Ebanghelyo ni Juan, ngunit hindi iyon ginawang tahasan sa salin.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: Sumagot
  rationale: Karaniwang pandiwang pasalaysay para sa tugon; natural sa Filipino at hindi nagdaragdag ng diwang wala sa Griyego.
- source_word: Οὐχὶ
  choice: Hindi ba
  rationale: Nagpapakilala ng retorikal na tanong na umaasang sasang-ayon ang kausap.
- source_word: δώδεκα ὧραί εἰσιν τῆς ἡμέρας
  choice: labindalawang oras ang maghapon
  rationale: Ipinahahayag ang panahong maliwanag sa isang araw, na siyang hinahati noon sa labindalawang oras, at pinananatili ang natural na daloy sa Filipino.
- source_word: ἐάν τις περιπατῇ
  choice: Kung lumalakad ang isang tao
  rationale: Pinananatili ang pangkalahatan at kumakatawang isahan ng τις nang natural sa Filipino.
- source_word: ἐν τῇ ἡμέρᾳ
  choice: sa maghapon
  rationale: Tumutukoy sa panahong maliwanag at pinananatili ang pagkakaugnay sa unang pangungusap.
- source_word: προσκόπτει
  choice: natitisod
  rationale: Pinananatili ang literal na larawan at ang posibleng mas malawak na metaporikal na diwa.
- source_word: τὸ φῶς
  choice: ang liwanag
  rationale: Tuwirang katumbas na hindi ginagawang tahasan ang maaaring teolohikal na pahiwatig.
- source_word: τοῦ κόσμου τούτου
  choice: ng mundong ito
  rationale: Natural at malapit na salin ng pariralang may demonstratibong diin.
- source_word: βλέπει
  choice: nakikita niya
  rationale: Tuwirang ipinapahayag ang kasalukuyang pagkakita nang hindi idinaragdag ang interpretatibong ‘kaya niyang makita.’
theological_decisions:
- issue: Maaaring simbolikong diwa ng ‘liwanag’ sa konteksto ng Juan
  choice: Panatilihin sa pangunahing teksto ang karaniwang larawan ng liwanag nang hindi tahasang ipinapakahulugang si Jesus o patnubay ng Diyos.
  alternative: Isalin o ipaliwanag ang liwanag bilang tuwirang pagtukoy kay Jesus o sa banal na paggabay.
  rationale: Madalas magkaroon ng teolohikal na lalim ang ‘liwanag’ sa Juan, ngunit gumagana rito ang mismong pananalita bilang karaniwang larawan. Hinahayaan ng salin na manatiling bukas ang mas malawak na pahiwatig.
- issue: Kumakatawang isahan sa τις … βλέπει
  choice: Gamitin ang ‘isang tao … siya.’
  alternative: Gumamit ng maramihang anyo o ulitin ang pangngalan.
  rationale: Pinananatili nito ang isahang anyo ng Griyego. Ang ‘siya’ sa Filipino ay hindi nagtatakda ng kasarian, kaya hindi kailangang magdagdag ng panlalaking kahulugang hindi likas na ipinahahayag sa Filipino.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “maghapon” upang tukuyin ang daylight period, hindi ang buong dalawampu’t apat na oras. Pinanatili ang literal na larawan ng paglakad, pagkatisod, at liwanag upang hindi mawala ang posibleng metaporikal at teolohikal na lalim.
