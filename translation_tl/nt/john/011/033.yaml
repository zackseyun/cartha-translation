  text: Ἰησοῦς οὖν ὡς εἶδεν αὐτὴν κλαίουσαν καὶ τοὺς συνελθόντας αὐτῇ Ἰουδαίους κλαίοντας ἐνεβριμήσατο τῷ πνεύματι καὶ ἐτάραξεν ἑαυτόν,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/033.yaml
  text: Therefore[a], when Jesus saw her weeping, and the Jews who had come with her weeping[b], he was deeply moved in his spirit and troubled himself.
translation:
  language: tl
  text: Kaya, nang makita ni Jesus na umiiyak si Maria at ang mga Judio[a] na dumating na kasama niya na umiiyak din, lubha siyang nabagabag sa kanyang espiritu[b] at nabalisa siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Judeano.” Dito ay tumutukoy ito sa mga Judiong nagluluksa na dumating na kasama ni Maria, hindi sa buong bayang Judio.
    reason: lexical_alternative
  - marker: b
    text: Ang “lubha siyang nabagabag” ay maaari ring isaling “lubha siyang napukaw” o “lubha siyang nagdamdam/nagalit.” Ang pandiwang Griyego ay nagpapahayag ng matinding panloob na pagkilos; pinagtatalunan kung ito ay partikular na pagkayamot, galit, o iba pang matinding pagkabagabag.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Ipinapakita ang pagpapatuloy at bunga ng naunang tagpo sa natural na salaysay sa Tagalog.
- source_word: ὡς εἶδεν
  choice: nang makita
  rationale: Temporal ang gamit ng ὡς kasama ng aorist; malinaw at natural ang “nang makita.”
- source_word: κλαίουσαν / κλαίοντας
  choice: umiiyak / umiiyak din
  rationale: Pinananatili ang kapansin-pansing pag-uulit ng pandiwa at ang hayag na pag-iyak nang hindi ipinapalagay na ritwal na panaghoy.
- source_word: συνελθόντας αὐτῇ
  choice: sumama sa kanya
  rationale: Natural na ipinahahayag na ang mga taong ito ay dumating na kasama ni Maria sa kinaroroonan ni Jesus.
- source_word: Ἰουδαίους
  choice: mga Judio
  rationale: Tuwirang katawagan sa mga Judiong nagluluksa na kasama ni Maria sa tagpong ito, hindi sa buong bayang Judio.
- source_word: ἐνεβριμήσατο
  choice: lubha siyang nabagabag
  rationale: Ipinapakita ang matinding panloob na pagkilos nang hindi tiyakang nilulutas kung ito ay galit, pagkayamot, o dalamhati; inilalagay sa talababa ang mas matalas na posibilidad.
- source_word: τῷ πνεύματι
  choice: sa kanyang espiritu
  rationale: Pinananatili ang dative na tumutukoy sa larangan ng matinding panloob na pagkilos.
- source_word: ἐτάραξεν ἑαυτόν
  choice: ginulo niya ang kanyang sarili
  rationale: Pinananatili ang tahasang reflexive na ἑαυτόν at ang aktibong anyo ng pandiwa, kahit bahagyang di-karaniwan ang pahayag sa Tagalog.
theological_decisions:
- issue: Uri ng damdamin ni Jesus sa ἐνεβριμήσατο
  choice: “lubha siyang nabagabag” upang ipakita ang matinding damdamin nang hindi ito tukuying galit o dalamhati lamang
  alternative: “lubha siyang napukaw” o “nagalit siya”
  rationale: Maaaring magpahiwatig ang pandiwa ng matinding pagkabagabag na may pagkayamot o galit, ngunit hindi tahasang tinutukoy ng talata ang sanhi o eksaktong uri ng damdamin. Pinananatili ng salin at talababa ang tensiyong ito.
- issue: Reflexive na kilos sa ἐτάραξεν ἑαυτόν
  choice: “ginulo niya ang kanyang sarili”
  alternative: “nabalisa siya”
  rationale: Ipinapakita ng Griyego na si Jesus mismo ang simuno ng aktibong pandiwa at ang kanyang sarili ang layon; hindi ito pinapantay sa isang karaniwang pasibong kalagayang emosyonal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “mga Judio” ayon sa karaniwang katawagang biblikal; malinaw sa konteksto na ang tinutukoy ay ang mga nagluluksa na kasama ni Maria. Sadyang bahagyang di-karaniwan ang “ginulo niya ang kanyang sarili” upang mapanatili ang reflexive na anyo ng Griyego.
