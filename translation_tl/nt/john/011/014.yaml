id: JHN.11.14
reference: John 11:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τότε οὖν εἶπεν αὐτοῖς ὁ Ἰησοῦς παρρησίᾳ· Λάζαρος ἀπέθανεν,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/014.yaml
  text: So then Jesus told them plainly[a], “Lazarus has died.”
translation:
  language: tl
  text: Kaya sinabi sa kanila ni Jesus nang malinaw[a], “Namatay na si Lazaro.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kaya hayagang sinabi sa kanila ni Jesus, ‘Namatay si Lazaro.’”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε οὖν
  choice: Kaya
  rationale: Pinagsamang panandang pansunod at panghinuha ang τότε οὖν. Sa daloy ng modernong Tagalog, likas na ipinahihiwatig ng “Kaya” ang bunga ng naunang hindi pagkaunawa at ang paglipat sa tuwirang paglilinaw.
- source_word: εἶπεν αὐτοῖς
  choice: sinabi sa kanila
  rationale: Tuwirang katumbas at natural sa Tagalog ang “sinabi sa kanila,” nang hindi nagdaragdag ng nilalaman sa kilos ng pagsasalita.
- source_word: παρρησίᾳ
  choice: nang malinaw
  rationale: Sa konteksto, inilalarawan nito ang hayag at di-malabong pagsasalita ni Jesus, bilang paglilinaw sa naunang talinghaga tungkol sa pagtulog.
- source_word: Λάζαρος
  choice: Lazaro
  rationale: Ginamit ang nakasanayang anyo ng pangalang ito sa tradisyong Tagalog.
- source_word: ἀπέθανεν
  choice: Namatay na
  rationale: Ang aorist ay tumutukoy sa naganap na kamatayan. Likas sa Tagalog ang “namatay na” upang ipahayag ang natapos na pangyayaring mahalaga sa kasalukuyang kalagayan.
theological_decisions:
- issue: Kalagayan ni Lazaro sa pahayag ni Jesus
  choice: Tuwirang pahayag na pisikal nang namatay si Lazaro
  alternative: Panatilihin ang naunang talinghaga ng pagtulog
  rationale: Tahasan nang nililinaw ng ἀπέθανεν ang naunang matalinghagang pahayag. Kaya hindi dapat manatiling malabo ang salin sa talatang ito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Pinili ang payak na ayos ng pangungusap at iniwasan ang makaluma o labis na teknikal na pananalita.
