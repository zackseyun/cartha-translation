  text: λέγει αὐτῷ· Ναί, κύριε· ἐγὼ πεπίστευκα ὅτι σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ ὁ εἰς τὸν κόσμον ἐρχόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/027.yaml
  text: She said to him[a], “Yes, Lord; I have believed that you are the Messiah, the Son of God[b], the one coming into the world.”
translation:
  language: tl
  text: Sinabi niya sa kanya, “Opo, Panginoon. Sumampalataya na ako na ikaw ang Mesiyas[a], ang Anak ng Diyos, ang dumarating sa sanlibutan[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Cristo.” Ang salitang Griyego na Χριστός (Christos) ay isang titulo na nangangahulugang “Pinahiran”; isinalin dito bilang “Mesiyas.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin ang hulíng parirala na “na dumarating sa sanlibutan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: Sinabi niya sa kanya
  rationale: Ginawang pangnagdaan ang historikal na pangkasalukuyang λέγει upang maging natural sa salaysay sa Tagalog. Mula sa konteksto, si Marta ang tinutukoy ng “niya.”
- source_word: Ναί
  choice: Opo
  rationale: Ang magalang na pagsang-ayon ay angkop sa tuwirang pakikipag-usap ni Marta kay Jesus at likas sa modernong Tagalog.
- source_word: κύριε
  choice: Panginoon
  rationale: Pinananatili nito ang mapitagan at posibleng teolohikal na bigat ng tawag sa konteksto ng pagpapahayag ni Marta tungkol sa pagkakakilanlan ni Jesus.
- source_word: ἐγὼ πεπίστευκα
  choice: Sumampalataya ako
  rationale: Ipinahahayag nito ang pananalig na pinanghawakan na ni Marta. Bagaman hindi lubusang matutumbasan ng aspektong Tagalog ang resultative force ng Greek perfect, natural at malinaw ang anyong ito sa konteksto.
- source_word: ὅτι
  choice: na
  rationale: Ipinakikilala nito ang nilalaman ng sinasampalatayanan ni Marta, hindi ang sanhi nito.
- source_word: ὁ χριστός
  choice: ang Mesiyas
  rationale: Isinasalin ang titulo ayon sa kahulugan nito sa halip na basta baybayin bilang “Cristo,” kaya nananatili ang kontekstong Judio at ang diwang tumutukoy sa pinahirang hari.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: ang Anak ng Diyos
  rationale: Tuwiran at kinikilalang salin ito ng tiyak at mabigat na kristolohikal na titulo.
- source_word: ὁ εἰς τὸν κόσμον ἐρχόμενος
  choice: ang siyang dumarating sa sanlibutan
  rationale: 'Ang “ang siyang” ay likas na paraang Tagalog upang maipakita ang substantibong gamit ng may artikulong participle: si Jesus ang inaasahang dumarating sa sanlibutan.'
- source_word: κόσμον
  choice: sanlibutan
  rationale: Ang “sanlibutan” ay malinaw, marangal, at angkop sa karaniwang gamit ni Juan para sa daigdig o kaayusan ng buhay ng tao na pinaparito ng Anak.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστός bilang titulong ipinahahayag
  choice: Mesiyas
  alternative: Cristo
  rationale: Dito ay malinaw na titulo ang Χριστός at kapantay ng iba pang pahayag tungkol sa pagkakakilanlan ni Jesus. Ang “Mesiyas” ang nagpapanatili sa kahulugan at kontekstong Judio ng titulo.
- issue: Bigat ng κύριε sa pakikipag-usap ni Marta
  choice: Panginoon
  alternative: Ginoo
  rationale: Dahil kasunod nito ang taimtim na pagpapahayag na si Jesus ang Mesiyas at Anak ng Diyos, mas angkop ang “Panginoon” sa mapitagan at posibleng teolohikal na puwersa ng salita, nang hindi nilulutas ang lahat ng maaaring saklaw nito.
- issue: Aspekto ng πεπίστευκα
  choice: Sumampalataya ako
  alternative: Naniniwala ako
  rationale: Pinananatili ng napiling anyo na ang pananalig ay nabuo na, samantalang ipinahihiwatig ng mismong pagpapahayag na nananatili itong paninindigan ni Marta. Hindi dinagdagan ang teksto ng tahasang “hanggang ngayon,” na wala sa Griyego.
- issue: Puwersa ng ὁ ἐρχόμενος
  choice: ang siyang dumarating
  alternative: ang darating
  rationale: Pinananatili ang kasalukuyang participial na anyo at ang katangian nito bilang pagkakakilanlan sa inaasahang persona, sa halip na gawin itong payak na pahayag lamang tungkol sa hinaharap.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Opo” bilang likas at magalang na tugon, “Panginoon” para sa κύριε, at “sanlibutan” upang mapanatili ang dignidad at Johannine na lawak ng κόσμος. Ang mga panandang [a] at [b] ay inilagay sa mismong bahaging tinutukoy ng bawat talababa.
