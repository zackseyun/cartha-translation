review_pass:
  verdict: revise
  source_fidelity: Tumpak na naihahatid ng draft ang temporal na participle, ang ipinahihiwatig na bagay na narinig, ang teleolohikal na diwa ng οὐκ ἔστιν πρὸς θάνατον, at ang magkaibang layunin ng kaluwalhatian ng Diyos at pagluwalhati sa Anak. Gayunman, ang “ay maluwalhati ang Anak ng Diyos” ay mas madaling maunawaan bilang kalagayang ‘maluwalhati’ kaysa bilang pasibong kilos na ‘luwalhatiin,’ kaya hindi nito malinaw na naipapahayag ang δοξασθῇ.
  naturalness: Natural ang karamihan ng salin sa modernong Filipino Tagalog. Mas malinaw at mas likas ang object-focus passive na “ang Anak ng Diyos ay luwalhatiin” para sa layuning ipinahahayag ng Griyego.
  terminology: Ang “sakit,” “kamatayan,” “kaluwalhatian ng Diyos,” at “Anak ng Diyos” ay angkop, malinaw, at may wastong rehistro. Pinananatili ng “hahantong sa kamatayan” ang bukas na tensiyon ng salaysay nang hindi ipinipilit na hindi mamamatay si Lazaro.
  issues:
  - severity: medium
    issue: Hindi malinaw ang pasibong aspekto ng “δοξασθῇ” sa pariralang “ay maluwalhati ang Anak ng Diyos.”
    rationale: Ang “maluwalhati” ay karaniwang pang-uri o pangkalagayan sa Filipino at maaaring mangahulugang ‘glorious,’ samantalang ang Griyego ay aorist passive subjunctive, ‘may be glorified.’ Ang “ay luwalhatiin” ay malinaw na object-focus passive at hindi nagdaragdag ng tagaganap.
