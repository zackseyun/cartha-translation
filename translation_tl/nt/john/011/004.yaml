id: JHN.11.4
reference: John 11:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ Ἰησοῦς εἶπεν· Αὕτη ἡ ἀσθένεια οὐκ ἔστιν πρὸς θάνατον ἀλλ’ ὑπὲρ τῆς δόξης τοῦ θεοῦ ἵνα δοξασθῇ ὁ υἱὸς τοῦ θεοῦ δι’ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/004.yaml
  text: But when Jesus heard it[a], he said, “This sickness is not unto death, but for the glory of God, so that the Son of God may be glorified through it.”
translation:
  language: tl
  text: Ngunit nang marinig ito ni Jesus, sinabi niya, “Ang sakit na ito ay hindi hahantong sa kamatayan[a], kundi para sa kaluwalhatian ng Diyos, upang ang Anak ng Diyos ay luwalhatiin sa pamamagitan nito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “hindi patungo sa kamatayan.” Maaaring ipahiwatig ng pananalitang Griyego na ang kamatayan ay hindi ang pangwakas na kinalabasan o layunin ng sakit.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας δὲ ὁ Ἰησοῦς
  choice: Ngunit nang marinig ito ni Jesus
  rationale: Ginagawang natural sa Tagalog ang aorist participle bilang sugnay na panahunan. Ang “ito” ay ipinahiwatig ng konteksto at tumutukoy sa balita tungkol sa pagkakasakit ni Lazaro; ang “ngunit” ay nagpapakita ng banayad na pagsalungat o pag-usad ng salaysay.
- source_word: ἀσθένεια
  choice: sakit
  rationale: Karaniwan, malinaw, at hindi labis na klinikal na katawagan para sa kalagayan ni Lazaro.
- source_word: οὐκ ἔστιν πρὸς θάνατον
  choice: ay hindi hahantong sa kamatayan
  rationale: Ipinapahayag ng πρὸς na may accusative ang hantungan o kinalabasan. Pinananatili ng “hahantong” ang diwang hindi kamatayan ang pangwakas na kinalabasan, nang hindi itinatangging mamamatay muna si Lazaro sa takbo ng salaysay.
- source_word: ὑπὲρ τῆς δόξης τοῦ θεοῦ
  choice: para sa kaluwalhatian ng Diyos
  rationale: Ang ὑπέρ dito ay nagpapahayag ng layunin o kapakinabangan. Likas sa Tagalog at pinananatili ang bigat ng δόξα.
- source_word: ἵνα δοξασθῇ
  choice: upang ... ay maluwalhati
  rationale: Pinananatili ang sugnay ng layunin na ipinakikilala ng ἵνα at ang pasibong diwa ng δοξασθῇ.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: ang Anak ng Diyos
  rationale: Tumpak at karaniwang salin ng titulong kristolohikal.
- source_word: δι’ αὐτῆς
  choice: sa pamamagitan nito
  rationale: Ang διά na may genitive ay nagpapahayag ng paraan o instrumento. Ang panghalip ay tumutukoy sa sakit.
theological_decisions:
- issue: Kahulugan ng “οὐκ ἔστιν πρὸς θάνατον” sa kabila ng aktuwal na pagkamatay ni Lazaro
  choice: Isinaling “hindi hahantong sa kamatayan,” na nagpapahiwatig na ang kamatayan ay hindi ang pangwakas na kinalabasan o layunin ng sakit.
  alternative: “Hindi nakamamatay” o isang tuwirang pahayag na hindi mamamatay si Lazaro.
  rationale: Ipinakikita ng kasunod na salaysay na namatay si Lazaro (Juan 11:14). Pinananatili ng salin ang teleolohikal na puwersa ng πρὸς at ang tensiyon ng teksto nang hindi ito labis na ipinapaliwanag.
- issue: Ugnayan ng “kaluwalhatian ng Diyos” at ng pagluwalhati sa Anak ng Diyos
  choice: 'Pinanatiling magkahiwalay ngunit magkaugnay ang dalawang pahayag: ang sakit ay para sa kaluwalhatian ng Diyos, upang maluwalhati ang Anak sa pamamagitan nito.'
  alternative: Pagsamahin ang dalawa bilang isang pangkalahatang pahayag tungkol sa kaluwalhatian ng Diyos.
  rationale: Magkaiba ngunit may layuning ugnayan ang dalawang sugnay sa Griyego. Ang tahasang pagpapanatili sa dalawa ay nag-iingat sa kristolohikal na diin ng talata nang walang idinaragdag na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “sakit” at “hahantong” bilang mga salitang madaling maunawaan ng karaniwang mambabasa, habang pinananatili ang teolohikal na tensiyon at ang pasibong “maluwalhati.”
