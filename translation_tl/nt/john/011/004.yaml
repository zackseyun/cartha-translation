  to: Ngunit nang marinig ito ni Jesus, sinabi niya, “Ang sakit na ito ay hindi hahantong sa kamatayan[a], kundi para sa kaluwalhatian ng Diyos, upang ang Anak ng Diyos ay luwalhatiin sa pamamagitan nito.”
  rationale: Pinalitan lamang ang “ay maluwalhati” ng “ay luwalhatiin” upang malinaw na maipakita ang pasibong pandiwa ng Griyego at ang sugnay ng layunin, habang pinananatili ang hindi tinutukoy na tagaganap at ang ugnayang “sa pamamagitan nito.” Bahagyang inayos ang panimulang salita ng talababa sa mas likas na modernong Filipino.
