  text: Πολλοὶ οὖν ἐκ τῶν Ἰουδαίων, οἱ ἐλθόντες πρὸς τὴν ⸀Μαριὰμ καὶ θεασάμενοι ⸀ἃ ⸀ἐποίησεν, ἐπίστευσαν εἰς αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/045.yaml
  text: Therefore many of the Jews who had come to Mary and had seen what he had done believed in him[a].
translation:
  language: tl
  text: Kaya marami sa mga Judio na pumunta kay Maria at nakakita sa ginawa ni Jesus ay sumampalataya sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula sa hanay ng mga Judio.” Sa ilang konteksto sa Juan, maaari ring isalin ang Ἰουδαῖοι bilang “mga taga-Judea.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλοὶ
  choice: marami
  rationale: Likas at tuwirang katumbas na nagpapanatili sa di-tiyak ngunit malaking bilang.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinakikita ang bunga o lohikal na kaugnayan nito sa naunang salaysay tungkol sa pagbuhay kay Lazaro; mas natural ito sa modernong Tagalog kaysa sa mas pormal na “Samakatuwid.”
- source_word: ἐκ τῶν Ἰουδαίων
  choice: sa mga Judio
  rationale: Ipinahahayag ng “sa” ang partitive na diwa—marami mula sa pangkat ng mga Judio—sa maikli at natural na Tagalog.
- source_word: οἱ ἐλθόντες πρὸς τὴν Μαριὰμ
  choice: na pumunta kay Maria
  rationale: Tinutukoy ng pariralang participial kung alin sa mga Judio ang tinutukoy. Sapat ang simpleng aspektong “pumunta” upang maipakita ang kilos na nauna sa pangunahing pandiwa.
- source_word: θεασάμενοι
  choice: nakakita
  rationale: Natural na katumbas sa konteksto ng mga taong mismong nakasaksi sa ginawa ni Jesus, nang hindi labis na dinaragdagan ang teksto.
- source_word: ἃ ἐποίησεν
  choice: sa ginawa niya
  rationale: Maikli at idiomatikong salin ng neuter plural relative construction; malinaw sa konteksto na si Jesus ang tinutukoy ng “niya.”
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: sumampalataya sa kanya
  rationale: Karaniwan at dignified na Tagalog para sa personal na pananalig na nakatuon kay Jesus; pinananatili nito ang diwa ng Johannine construction nang hindi dinaragdagan ng doktrinal na paliwanag.
theological_decisions:
- issue: Pagpapahayag ng πιστεύω εἰς sa konteksto ng pananampalataya kay Jesus
  choice: sumampalataya sa kanya
  alternative: nagtiwala sa kanya
  rationale: Ang “sumampalataya sa kanya” ang pinakatuwirang tradisyonal ngunit malinaw pa ring modernong salin. Ang “nagtiwala” ay posible ngunit maaaring paliitin ang saklaw sa pangkaraniwang pagtitiwala lamang.
- issue: Pagkilala sa Ἰουδαῖοι
  choice: mga Judio
  alternative: mga taga-Judea
  rationale: Ang “mga Judio” ang pinakanatural na katawagan dito at hindi hinihingi ng agarang konteksto ang heograpikong pagbasa na “mga taga-Judea.” Gayunman, kinikilala sa talababa ang tunay na leksikal na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, maikli, at marangal. Ginamit ang “Kaya” bilang natural na pang-ugnay at “sumampalataya” upang mapanatili ang personal at teolohikal na bigat ng πιστεύω εἰς. Ang marker na [a] ay nasa pangunahing teksto.
