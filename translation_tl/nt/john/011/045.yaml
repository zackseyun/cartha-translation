    rationale: Bagaman si Jesus ang malinaw na tinutukoy sa Griyego at sa mas malawak na salaysay, maaaring iugnay ng mambabasang Tagalog ang “niya” kay Maria, ang pinakamalapit na pangngalang pantangi. Ang tahasang “ni Jesus” ay naglilinaw nang hindi nagdaragdag ng kahulugan.
  revised_text: Kaya marami sa mga Judio na pumunta kay Maria at nakakita sa ginawa ni Jesus ay sumampalataya sa kanya.[a]
