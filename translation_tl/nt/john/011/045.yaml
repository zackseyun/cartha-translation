  source_fidelity: Tumpak na naihahatid ng draft ang lohikal na ugnayan ng οὖν, ang partitive na ἐκ τῶν Ἰουδαίων, ang mga dumalaw kay Maria, ang kanilang pagkakita sa ginawa ni Jesus, at ang pagsampalataya sa kanya. Gayunman, ang panghalip na “niya” sa “ginawa niya” ay maaaring pansamantalang maiugnay kay Maria sa Tagalog dahil siya ang pinakamalapit na pinangalanang antecedent; dapat gawing tahasan si Jesus.
  naturalness: Natural at marangal ang “Kaya marami sa mga Judio ... ay sumampalataya sa kanya.” Mas malinaw at kasing-natural ang “nakita ang ginawa ni Jesus,” na umiiwas sa hindi kailangang kalabuan.
  terminology: Ang “mga Judio” ay angkop sa kontekstong ito para sa Ἰουδαῖοι, habang pinananatili ng talababa ang posibleng “mga taga-Judea.” Ang “sumampalataya sa kanya” ay wastong salin ng ἐπίστευσαν εἰς αὐτόν.
