base_translation:
  language: en
  yaml_path: translation/nt/john/011/010.yaml
  text: But if anyone walks in the night[a], he stumbles, because the light is not in him.
translation:
  language: tl
  text: Ngunit kung ang isang tao ay lumalakad sa gabi, natitisod siya, sapagkat ang liwanag ay wala sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang liwanag ay hindi nasa loob niya.” Mas literal na “nasa loob niya” ang Griyego. Maaaring tumukoy ito sa kawalan ng liwanag na kasama niya, ngunit maaari rin itong magpahiwatig ng higit pa sa kawalan lamang ng panlabas na liwanag.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν δέ
  choice: Ngunit kung
  rationale: Pinananatili ang pagsalungat sa naunang talata at ang payak na kondisyong ipinahihiwatig ng ἐὰν kasama ng δέ.
- source_word: τις
  choice: ang isang tao
  rationale: Likas sa makabagong Tagalog at pinananatili ang pangkalahatan at di-tiyak na diwa ng panghalip.
- source_word: περιπατῇ
  choice: lumalakad
  rationale: Pinananatili ang literal na larawan ng paglakad pati ang posibleng metaporikal na pahiwatig nito.
- source_word: ἐν τῇ νυκτί
  choice: sa gabi
  rationale: Natural na katumbas sa Tagalog na pinananatili ang larawan ng gabi nang hindi agad binibigyang-kahulugang abstraktong kadiliman.
- source_word: προσκόπτει
  choice: natitisod
  rationale: Malinaw na ipinapahayag ang pagkatisod at pinananatili kapuwa ang literal at metaporikal na posibilidad.
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw at marangal na panandang sanhi sa kasalukuyang Tagalog.
- source_word: τὸ φῶς
  choice: ang liwanag
  rationale: Pinananatili ang tiyak na anyo ng parirala at ang mahalagang larawan ng liwanag sa konteksto.
- source_word: οὐκ ἔστιν ἐν αὐτῷ
  choice: ang liwanag ay wala sa kanya
  rationale: Ang “sa kanya” ay likas na Tagalog para sa ἐν αὐτῷ at sadyang pinananatili ang posibilidad ng panloob na kahulugan, bagaman maaari rin itong maunawaan bilang kawalan ng liwanag na kasama niya.
theological_decisions:
- issue: Sanggunian at bisa ng “ang liwanag ay wala sa kanya”
  choice: Panatilihin ang malapit ngunit likas na pananalitang “wala sa kanya,” na maaaring magpahiwatig ng panloob na kawalan ng liwanag.
  alternative: “wala siyang liwanag” o “walang liwanag na kasama niya,” bilang higit na pansitwasyong pahayag tungkol sa panlabas na liwanag
  rationale: Tahasan ang Griyegong ἐν, karaniwang “sa/loob,” at ang wika tungkol sa liwanag sa Juan ay maaaring magkaroon ng teolohikal na lalim. Hindi dapat bawasan ang pahayag tungo lamang sa panlabas na kondisyon ni lubusang gawing espirituwal.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “sapagkat” upang mapanatili ang dignidad ng register; iniwasan ang labis na interpretasyon sa larawang paglakad, gabi, pagkatisod, at liwanag.
