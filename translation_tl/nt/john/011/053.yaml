  yaml_path: translation/nt/john/011/053.yaml
  text: So from that day on they planned to kill him.
translation:
  language: tl
  text: Kaya mula nang araw na iyon, nagbalak silang patayin siya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπ’ ἐκείνης ... τῆς ἡμέρας
  choice: mula nang araw na iyon
  rationale: Ipinapahayag ng ἀπό kasama ng pariralang nasa genitive ang panimulang panahon ng nagpapatuloy na pagkilos. Likas sa modernong Tagalog ang “mula nang araw na iyon” at malinaw nitong ipinahihiwatig ang “mula noon at patuloy.”
- source_word: οὖν
  choice: Kaya
  rationale: Ipinakikita ng οὖν na ang pangyayaring ito ay bunga ng naunang pagpupulong at pagpapasya ng konseho. Ang “Kaya” ay maikli, natural, at nagpapanatili sa ugnayang lohikal ng salaysay.
- source_word: ἐβουλεύσαντο
  choice: nagbalak sila
  rationale: Ang βουλεύομαι dito ay tumutukoy sa sama-samang pagsasaalang-alang na humantong sa isang planong isasagawa. Pinananatili ng “nagbalak sila” ang diwa ng sadyang pakana nang hindi gumagamit ng lipas o labis na teknikal na pananalita.
- source_word: ἵνα ἀποκτείνωσιν
  choice: patayin
  rationale: Ang ἵνα na kasunod ng pandiwang deliberatibo ay nagpapahayag ng nilayon o nilalaman ng balak. Natural sa Tagalog ang konstruksiyong “nagbalak ... patayin,” at tuwirang katumbas ng ἀποκτείνω ang “patayin.”
- source_word: αὐτόν
  choice: siya
  rationale: Ang panghalip ay tumutukoy kay Jesus ayon sa agarang konteksto. Pinananatili ang panghalip sa halip na tahasang idagdag ang pangalan na wala sa Griyego.
theological_decisions:
- issue: Ang tindi at katiyakan ng hangarin ng mga pinuno laban kay Jesus
  choice: Isinalin bilang isang tiyak na balak na patayin siya.
  alternative: Nag-usap sila tungkol sa pagpatay sa kanya; pinag-isipan nilang ipapatay siya.
  rationale: Inilalarawan ng Griyego ang isang mapagpasiyang hakbang tungo sa pagpatay, hindi lamang isang malabong talakayan o posibilidad. Hindi rin dinaragdagan ng salin ang teksto ng pagpapakahulugang legal o doktrinal.
translation_notes:
  register: Modernong Filipino Tagalog na natural, tuwiran, at marangal. Ginamit ang “nagbalak” upang maipahayag ang sinadya at sama-samang pakana, at pinanatili ang payak na “patayin” sa halip na mas pormal at maaaring legal ang dating na “ipapatay” o “hatulan ng kamatayan.”
