  yaml_path: translation/nt/john/011/023.yaml
  text: Jesus says to her[a], “Your brother will rise again.”
translation:
  language: tl
  text: Sinabi ni Jesus sa kanya, “Muling mabubuhay ang kapatid mong lalaki.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: Sinabi
  rationale: Bagaman pangkasalukuyan ang anyong Griyego bilang historical present, mas natural sa makabagong Tagalog na isalaysay ito sa nagdaang panahunan; nananatili ang buhay at tuwirang daloy ng salaysay.
- source_word: αὐτῇ
  choice: sa kanya
  rationale: Likas na katumbas sa Tagalog ng di-tuwirang layon ng pandiwang pagsasalita.
- source_word: Ἀναστήσεται
  choice: muling mabubuhay
  rationale: Sa konteksto ng pagkamatay ni Lazaro, malinaw nitong ipinapahayag ang pagbangon mula sa kamatayan. Hindi nito ipinapasok ang tahasang pasibong diwa na 'bubuhayin,' na maaaring higit na idiin ang panlabas na tagaganap kaysa sa anyong Griyego.
- source_word: ὁ ἀδελφός σου
  choice: ang kapatid mong lalaki
  rationale: Nililinaw ang kasariang panlalaki na taglay ng ἀδελφός, sapagkat ang Tagalog na 'kapatid' lamang ay walang tiyak na kasarian.
- source_word: ὁ Ἰησοῦς
  choice: Jesus
  rationale: Karaniwang anyo ng personal na pangalan sa modernong Filipino; hindi hiwalay na isinasalin ang artikulong Griyego.
theological_decisions:
- issue: Pananalita tungkol sa muling pagkabuhay
  choice: muling mabubuhay
  alternative: babangon; bubuhayin
  rationale: Ipinahahayag ng talata ang katiyakan ng pagbangon ng kapatid mula sa kamatayan ngunit hindi nito nilulutas kung ang tinutukoy ay ang nalalapit na pagpapanumbalik kay Lazaro o ang pangwakas na muling pagkabuhay. Iniiwasan din ng salin ang higit na tahasang pagbanggit sa banal na tagaganap na maaaring ipahiwatig ng 'bubuhayin.'
translation_notes:
  register: Natural, malinaw, at marangal na modernong Tagalog. Ginamit ang 'kapatid mong lalaki' upang mapanatili ang tiyak na kasarian ng salitang Griyego, at 'muling mabubuhay' bilang karaniwang ekspresyon para sa pagbangon mula sa kamatayan.
