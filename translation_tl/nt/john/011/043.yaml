  text: καὶ ταῦτα εἰπὼν φωνῇ μεγάλῃ ἐκραύγασεν· Λάζαρε, δεῦρο ἔξω.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/043.yaml
  text: And after saying these things[a], he cried out with a loud voice, “Lazarus, come out!”
translation:
  language: tl
  text: At pagkatapos niyang sabihin ang mga ito, sumigaw siya nang malakas, “Lazaro, lumabas ka!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: nito
  rationale: Bagaman maramihan ang anyong Griyego, likas sa modernong Tagalog ang “nito” bilang pagtukoy sa kabuuan ng mga sinabi bago nito; ang “ng mga bagay na ito” ay magiging mekanikal at hindi natural.
- source_word: εἰπὼν
  choice: pagkasabi
  rationale: Ang aorist participle ay nagpapahiwatig na nauna ang pagsasalita sa pagsigaw. Malinaw at likas na ipinahahayag ito ng “pagkasabi.”
- source_word: φωνῇ μεγάλῃ
  choice: nang malakas
  rationale: Ipinahahayag nito ang paraan at lakas ng tinig. Sa Tagalog, mas natural ang “sumigaw nang malakas” kaysa sa literal na “sa pamamagitan ng malakas na tinig.”
- source_word: ἐκραύγασεν
  choice: sumigaw siya
  rationale: Ang pandiwa ay tumutukoy sa malakas na pagsigaw o pagtawag. Pinananatili ng “sumigaw” ang puwersa ng salita.
- source_word: Λάζαρε
  choice: Lazaro
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa Tagalog.
- source_word: δεῦρο ἔξω
  choice: lumabas ka
  rationale: Ang dalawang pang-abay ay magkatuwang na bumubuo ng mariing utos na pumarito sa labas. Ang “lumabas ka” ang malinaw, tuwiran, at natural na katumbas sa modernong Tagalog.
theological_decisions:
- issue: Paglalahad sa utos ng himala nang hindi gumagamit ng makalumang pananalita
  choice: lumabas ka
  alternative: pumarito ka sa labas
  rationale: Walang terminong pinagtatalunan sa doktrina sa talata. Ang “lumabas ka” ay tapat sa diwa ng δεῦρο ἔξω at mas likas sa kasalukuyang Tagalog, samantalang ang “pumarito ka sa labas” ay mas literal ngunit asiwa.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Hindi kailangan ng talababa dahil walang mahalagang ambiguwidad o alternatibong salin na kailangang itala sa tekstong ito.
