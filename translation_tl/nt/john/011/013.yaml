  text: εἰρήκει δὲ ὁ Ἰησοῦς περὶ τοῦ θανάτου αὐτοῦ. ἐκεῖνοι δὲ ἔδοξαν ὅτι περὶ τῆς κοιμήσεως τοῦ ὕπνου λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/013.yaml
  text: Jesus had spoken about his death[a], but they thought that he was speaking about the sleep of rest.
translation:
  language: tl
  text: Nagsalita na si Jesus tungkol sa pagkamatay ni Lazaro, ngunit inakala nilang tungkol sa literal na pagtulog ang sinasabi niya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰρήκει
  choice: ang tinutukoy ... ay
  rationale: Ipinahihiwatig ng pluperfect na nauna nang nagsalita si Jesus bago ang maling pagkaunawa ng mga alagad. Sa Filipino, malinaw at natural na naipapakita ito ng kontekstuwal na pahayag na “ang tinutukoy ... ay,” nang hindi pilit na ginagaya ang anyong pandiwa ng Griyego.
- source_word: δὲ ... δὲ
  choice: '[hindi tahasang isinalin] ... ngunit'
  rationale: Ang unang δέ ay banayad na panandang diskurso at hindi kailangang tumbasan sa Filipino; ang ikalawa ay malinaw na nagsasaad ng pagsalungat kaya isinalin bilang “ngunit.”
- source_word: περὶ τοῦ θανάτου αὐτοῦ
  choice: ang pagkamatay ni Lazaro
  rationale: Ang περί na may genitive ay nangangahulugang “tungkol sa.” Tinukoy nang tahasan si Lazaro upang maiwasan ang likas na kalabuan ng Filipino na maaaring magpahiwatig na sariling kamatayan ni Jesus ang tinutukoy; malinaw sa konteksto ang referent ng αὐτοῦ.
- source_word: ἐκεῖνοι
  choice: nila
  rationale: Tumutukoy ito sa mga alagad na nasa konteksto. Natural sa Filipino ang panghalip na “nila” sa halip na literal na “ang mga iyon.”
- source_word: ἔδοξαν
  choice: inakala
  rationale: Ipinapahayag ng δοκέω rito ang maling pagkaunawa o palagay ng mga alagad; malinaw itong naihahatid ng “inakala.”
- source_word: περὶ τῆς κοιμήσεως τοῦ ὕπνου
  choice: ang karaniwang pagtulog
  rationale: Ang κοιμήσεως τοῦ ὕπνου ay tumutukoy sa literal na pagtulog, taliwas sa matalinghagang paggamit ng pagtulog para sa kamatayan. Ang “karaniwang pagtulog” ay natural na Filipino at pinananatili ang kaibahan.
- source_word: λέγει
  choice: ang sinasabi niya
  rationale: Bagaman present tense ang anyo, ginagamit ito bilang historical present. Ang “ang sinasabi niya” ay natural pagkatapos ng “inakala nilang.”
theological_decisions:
- issue: Kung ang pagtukoy sa kamatayan bilang pagtulog ay dapat unawaing doktrina tungkol sa kalagayan ng mga patay
  choice: Ihayag nang tuwiran na kamatayan ni Lazaro ang ibig sabihin ni Jesus, at literal na pagtulog naman ang maling pagkaunawa ng mga alagad.
  alternative: Gumamit ng pananalitang maaaring magpahiwatig ng isang tiyak na doktrina tungkol sa kalagayan ng kaluluwa pagkamatay.
  rationale: Ang layunin ng talata ay ipaliwanag ang pagkakaiba ng matalinghagang sinabi ni Jesus at literal na pagkaunawa ng mga alagad, hindi magtakda ng doktrina tungkol sa intermediate state.
translation_notes:
  register: Modernong Filipino na malinaw, natural, at marangal. Iniwasan ang salitang “pagkakahimbing” dahil maaaring pahinain nito ang tuwirang kaibahan sa kamatayan; ginamit ang “karaniwang pagtulog” para sa literal na pagkaunawa ng mga alagad.
