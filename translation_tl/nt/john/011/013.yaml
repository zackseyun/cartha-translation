revisions:
- from: Ang tinutukoy ni Jesus ay ang pagkamatay ni Lazaro,[a] ngunit inakala nilang ang sinasabi niya ay ang karaniwang pagtulog.
  to: Nagsalita na si Jesus tungkol sa pagkamatay ni Lazaro, ngunit inakala nilang tungkol sa literal na pagtulog ang sinasabi niya.
  rationale: Pinalitan ang pambungad upang maipakita ang aspektong pluperfect ng Griyego sa natural na Filipino (“Nagsalita na”). Pinanatili ang tahasang referent na si Lazaro upang maiwasan ang kalabuan, at ginamit ang “literal na pagtulog” upang ipakita ang maling pagkaunawa ng mga alagad na taliwas sa tinutukoy ni Jesus. Inalis ang hindi na kailangang talababang panglinaw ng panghalip.
