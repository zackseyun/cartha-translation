  to: Lumabas ang taong namatay na; nakagapos ng mga telang panlibing ang mga paa at kamay niya, at nakabalot sa isang tela ang kanyang mukha. Sinabi ni Jesus sa kanila, “Kalagan ninyo siya at hayaan siyang umalis.”
