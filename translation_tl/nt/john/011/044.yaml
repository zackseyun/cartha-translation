review_pass:
  verdict: revise
  source_fidelity: Tumpak ang pangunahing diwa ng draft. Gayunman, ang ayos na “na nakatali ng mga telang panlibing ang mga paa at kamay” ay maaaring pansamantalang magpalabo sa saklaw ng pagkakatali. Ang binagong ayos ay mas tuwirang inilalahad na ang mga paa at kamay ang nakagapos ng mga telang panlibing. Ang pangnagdaang “Sinabi” ay katanggap-tanggap na Tagalog na pag-render sa historical present na λέγει sa isang salaysay, bagaman ang English audit trail ay gumagamit ng “says.”
  naturalness: 'Kailangan ng bahagyang rebisyon para sa mas likas na ayos ng pangungusap: “Sinabi ni Jesus sa kanila” ay mas karaniwan kaysa “Sinabi sa kanila ni Jesus.” Ginawang mas malinaw din ang sugnay tungkol sa mga telang panlibing at ang hiwalay na telang nakabalot sa mukha.'
  terminology: Ang “mga telang panlibing” ay angkop para sa κειρίαις, at ang “isang tela” ay pinananatiling hiwalay at isahan para sa σουδαρίῳ. Ang “kalagan” ay angkop para sa Λύσατε; ang “hayaan siyang umalis” ay tapat at likas para sa ἄφετε αὐτὸν ὑπάγειν.
  issues:
  - severity: low
    issue: Medyo hindi likas at maaaring malabo ang ayos ng sugnay tungkol sa pagkakatali ng paa at kamay.
    rationale: Mas malinaw sa modernong Tagalog ang “nakagapos ng mga telang panlibing ang mga paa at kamay niya.”
  - severity: low
    issue: Hindi pinakanatural ang ayos na “Sinabi sa kanila ni Jesus.”
    rationale: Mas idiomatiko ang “Sinabi ni Jesus sa kanila,” nang walang pagbabago sa kahulugan.
  revised_text: Lumabas ang taong namatay na; nakagapos ng mga telang panlibing ang mga paa at kamay niya, at nakabalot sa isang tela ang kanyang mukha. Sinabi ni Jesus sa kanila, “Kalagan ninyo siya at hayaan siyang umalis.”
