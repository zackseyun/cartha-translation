id: JHN.11.44
reference: John 11:44
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀ἐξῆλθεν ὁ τεθνηκὼς δεδεμένος τοὺς πόδας καὶ τὰς χεῖρας κειρίαις, καὶ ἡ ὄψις αὐτοῦ σουδαρίῳ περιεδέδετο. λέγει ⸂αὐτοῖς ὁ Ἰησοῦς⸃· Λύσατε αὐτὸν καὶ ἄφετε ⸀αὐτὸν ὑπάγειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/044.yaml
  text: The man who had died came out, his feet and hands bound with burial cloths, and his face wrapped with a cloth. Jesus says to them, “Unbind him and let him go.”
translation:
  language: tl
  text: Lumabas ang taong namatay na; nakagapos ng mga telang panlibing ang mga paa at kamay niya, at nakabalot sa isang tela ang kanyang mukha. Sinabi ni Jesus sa kanila, “Kalagan ninyo siya at hayaan siyang umalis.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ τεθνηκώς
  choice: ang namatay
  rationale: Tuwirang inilalarawan ang taong namatay na, habang nananatiling natural at malinaw sa Tagalog.
- source_word: κειρίαις
  choice: mga telang panlibing
  rationale: Tumutukoy sa mga piraso o balot na telang ginagamit sa paglilibing; mas malinaw ito kaysa sa literal ngunit di-likas na ‘mga benda.’
- source_word: σουδαρίῳ
  choice: tela
  rationale: Isang hiwalay na telang nakabalot sa mukha ang tinutukoy; hindi ipinapalagay ang tiyak na anyo o gamit na lampas sa konteksto.
- source_word: περιεδέδετο
  choice: nababalutan
  rationale: Ipinahahayag ang pagkakapulupot o pagkakatali ng tela sa mukha sa natural na Tagalog.
- source_word: Λύσατε
  choice: Kalagan ninyo
  rationale: Inuutusan silang alisin ang mga nakatali sa kanya; ‘kalagan’ ang maikli at tumpak na katumbas.
- source_word: ἄφετε αὐτὸν ὑπάγειν
  choice: hayaan siyang makaalis
  rationale: Pinananatili ang diwa ng pagpapahintulot sa kanya na umalis o magpatuloy, nang hindi nililimitahan sa simpleng paglalakad.
theological_decisions:
- issue: Makasaysayang pangkasalukuyan sa λέγει
  choice: Sinabi
  alternative: Sinabi ngayon / Sinasabi
  rationale: Bagaman pangkasalukuyan ang anyong Griyego, karaniwan itong historical present sa salaysay. Ang pangnagdaan ay natural sa Tagalog at hindi nagbabago sa kahulugan.
- issue: Kahulugan ng ‘hayaan siyang umalis’
  choice: hayaan siyang makaalis
  alternative: pabayaan ninyo siyang lumakad
  rationale: Hindi tinutukoy ng ὑπάγειν kung simpleng paglakad lamang o pag-alis; pinananatili ng salin ang mas malawak na kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Iniwasan ang labis na teknikal o makalumang pananalita.
