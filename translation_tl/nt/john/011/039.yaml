  text: λέγει ὁ Ἰησοῦς· Ἄρατε τὸν λίθον. λέγει αὐτῷ ἡ ἀδελφὴ τοῦ ⸀τετελευτηκότος Μάρθα· Κύριε, ἤδη ὄζει, τεταρταῖος γάρ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/039.yaml
  text: Jesus said[a], “Take away the stone.” Martha, the sister of the dead man, said to him, “Lord, by now he smells[c][b], for he has been dead four days.”
translation:
  language: tl
  text: Sinabi ni Jesus, “Alisin ninyo ang bato.” Sinabi sa kanya ni Marta, na kapatid ng lalaking namatay[a], “Panginoon, nangangamoy na siya[b], sapagkat apat na araw na siyang patay[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ng yumao.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mabaho na siya.” Ang pandiwang Griyego ay nangangahulugang “maglabas ng amoy.”
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “sapagkat ikaapat-na-araw na siya,” ibig sabihin, apat na araw na siyang patay.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρατε
  choice: Alisin ninyo
  rationale: Ang aorist imperative na maramihan ay utos sa mga naroon na ilipat ang batong nakatakip sa libingan. Mas natural sa Tagalog ang “alisin” kaysa sa literal na “buhatin.”
- source_word: τὸν λίθον
  choice: ang bato
  rationale: Sa konteksto ng libingan, tumutukoy ito sa batong nakatakip sa pasukan.
- source_word: τοῦ τετελευτηκότος
  choice: ng lalaking namatay
  rationale: Ang perfect participle ay tumutukoy sa taong namatay at nananatiling patay. Malinaw at natural ang pariralang ito sa Tagalog.
- source_word: Κύριε
  choice: Panginoon
  rationale: Pinananatili nito ang bigat ng κύριος sa Ebanghelyo ni Juan at ang magalang na pagkilala ni Marta kay Jesus, nang hindi nililimitahan ito sa karaniwang “Ginoo.”
- source_word: ἤδη ὄζει
  choice: nangangamoy na siya
  rationale: Ipinahihiwatig ng ἤδη na umiiral na ang kalagayan sa puntong iyon, at ang ὄζει ay nagsasaad ng paglalabas ng amoy—malinaw na masamang amoy sa konteksto. Natural sa Tagalog ang “nangangamoy na” at hindi nito dinaragdagan ang tindi ng orihinal.
- source_word: τεταρταῖος γάρ ἐστιν
  choice: sapagkat apat na araw na siyang patay
  rationale: Ang literal na idyomang Griyego ay “ikaapat-na-araw siya.” Kailangang palawakin sa Tagalog upang malinaw na ang tinutukoy ay ang tagal mula nang mamatay siya.
theological_decisions:
- issue: Pagtutumbas sa κύριος sa pagtawag ni Marta kay Jesus
  choice: Panginoon
  alternative: Ginoo
  rationale: Maaaring maging magalang na pantawag ang κύριος, ngunit sa konteksto ng salaysay ni Juan ay may bigat itong higit sa karaniwang paggalang. Pinananatili ng “Panginoon” ang posibleng teolohikal na diwa nang hindi tahasang nilulutas ang lahat ng saklaw ng salita.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ninyo” upang maipakita ang maramihang utos, at pinanatili ang tuwirang paksa sa “nangangamoy na siya.”
