  source_fidelity: Tumpak na naipapahayag ng salin ang pluperfect na pagbibigay ng mga utos, ang kondisyong may sinumang nakaaalam ng kinaroroonan niya, ang pag-uulat, at ang layuning madakip siya. Ang hindi tahasang pagsasalin sa δέ ay katanggap-tanggap sa natural na daloy ng Tagalog.
  naturalness: Likas at malinaw ang pangungusap sa makabagong Filipino. Ang ayos na “Nagbigay na ng mga utos ang mga punong pari at ang mga Pariseo” at ang kasunod na sugnay na may “kung” ay madaling unawain. Ang “dapat niya itong ipagbigay-alam” ay angkop na paghahayag ng hinihingi ng utos.
  terminology: Ang “mga punong pari,” “mga Pariseo,” “mga utos,” at “madakip” ay angkop sa kontekstong historikal at administratibo. Hindi ipinapataw ng “madakip” ang isang partikular na makabagong legal o doktrinal na pagbasa.
