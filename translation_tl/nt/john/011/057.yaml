  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: δεδώκεισαν ⸀δὲ οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι ⸀ἐντολὰς ἵνα ἐάν τις γνῷ ποῦ ἐστιν μηνύσῃ, ὅπως πιάσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/057.yaml
  text: The chief priests and the Pharisees had given orders that if anyone knew where he was[a], he should report it[b], so that they might seize him.
translation:
  language: tl
  text: Nagbigay na ng mga utos ang mga punong pari at ang mga Pariseo na kung may nakaaalam kung nasaan siya, dapat niya itong ipagbigay-alam upang madakip nila siya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεδώκεισαν
  choice: Nagbigay na
  rationale: Ang pluperfect ay tumutukoy sa nauna nang natapos na kilos; likas na ipinahihiwatig ito sa Tagalog ng aspektong kontemplatibo kasama ang “na.”
- source_word: δὲ
  choice: hindi tahasang isinalin
  rationale: Mahinang panandang diskurso ito rito. Hindi kailangan ang hiwalay na “ngayon” o “ngunit” sa natural na Tagalog, at ang daloy ng salaysay ay sapat nang nagpapakita ng pagpapatuloy.
- source_word: οἱ ἀρχιερεῖς
  choice: mga punong pari
  rationale: Tumutukoy sa mga nangungunang awtoridad ng mga pari, hindi sa maraming kasalukuyang mataas na pari.
- source_word: οἱ Φαρισαῖοι
  choice: mga Pariseo
  rationale: Karaniwang anyong Tagalog para sa pangalan ng pangkat na ito.
- source_word: ἐντολὰς
  choice: mga utos
  rationale: Ang konteksto ay mga opisyal at may-awtoridad na tagubilin; mas akma ang “utos” kaysa sa mas mahinang “tagubilin.”
- source_word: ἵνα ἐάν τις γνῷ
  choice: na kung may nakaaalam
  rationale: Inihahayag nito ang nilalaman ng mga utos na may kondisyong pangkalahatan. Pinananatili ng “kung” ang kondisyon nang natural sa Tagalog.
- source_word: ποῦ ἐστιν
  choice: kung nasaan siya
  rationale: Natural na di-tuwirang tanong sa Tagalog; hindi kailangang markahan ang pagkakaiba ng present at past tense dahil walang morpolohikal na tense ang “nasaan.”
- source_word: μηνύσῃ
  choice: dapat niya itong ipagbigay-alam
  rationale: Ipinahahayag ang pag-uulat o pagpapabatid sa mga awtoridad. Ang “dapat” ay angkop sa nilalaman ng iniutos, at ang “ito” ay tumutukoy sa kinaroroonan ni Jesus.
- source_word: ὅπως πιάσωσιν αὐτόν
  choice: upang madakip nila siya
  rationale: Malinaw na ipinakikita ng “upang” ang layunin. Sa kontekstong may utos mula sa mga pinuno, natural ang “dakpin” para sa pagdakip o pag-aresto, nang hindi labis na nililimitahan sa modernong legal na proseso.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nakaaalam” bilang pormal ngunit karaniwang anyo; iniwasan ang di-kailangang panimulang pang-ugnay. Walang talababa dahil likas na napapanatili ng Tagalog na “nasaan” ang aspektuwal na kaluwagan ng Griyegong ἐστιν, at sapat na inilalahad ng “madakip” ang kahulugan sa konteksto.
