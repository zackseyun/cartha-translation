id: JHN.11.38
reference: John 11:38
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἰησοῦς οὖν πάλιν ἐμβριμώμενος ἐν ἑαυτῷ ἔρχεται εἰς τὸ μνημεῖον· ἦν δὲ σπήλαιον, καὶ λίθος ἐπέκειτο ἐπ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/038.yaml
  text: Jesus[a], then, again deeply moved within himself, came to the tomb. Now it was a cave, and a stone was lying against it.
translation:
  language: tl
  text: Kaya si Jesus, na muling nabagabag nang matindi sa kanyang kalooban,[a] ay pumunta sa libingan. Ang libingan ay isang yungib, at may batong nakatakip sa bungad nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nagngitngit sa kanyang kalooban” o “lubhang naligalig sa kanyang kalooban.” Di-pangkaraniwang matindi ang pandiwang Griyego at maaaring magpahiwatig ng higit pa sa kalungkutan lamang.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Ipinahihiwatig ang pagpapatuloy at kaugnayan ng pangyayari sa naunang tagpo nang hindi nagiging labis na pormal.
- source_word: πάλιν
  choice: muling
  rationale: Malinaw na iniuugnay ang matinding damdamin ni Jesus sa nauna niyang pagtugon sa salaysay.
- source_word: ἐμβριμώμενος ἐν ἑαυτῷ
  choice: nabagabag nang matindi sa kanyang kalooban
  rationale: Pinananatili ang lakas at panloob na katangian ng damdamin, ngunit hindi nililimitahan ang kahulugan sa lungkot o galit lamang.
- source_word: ἔρχεται
  choice: pumunta
  rationale: Isinalin ang historikal na pangkasalukuyan bilang naganap na kilos, na mas natural sa makabagong salaysay sa Tagalog.
- source_word: μνημεῖον
  choice: libingan
  rationale: Karaniwang salitang Tagalog para sa lugar ng paglilibing at angkop sa kasunod na paglalarawan dito bilang isang yungib.
- source_word: σπήλαιον
  choice: yungib
  rationale: Tuwirang tumutukoy sa isang likas o inukit na kuweba na ginamit na libingan.
- source_word: λίθος
  choice: bato
  rationale: Payak at wastong katumbas para sa batong nagsasara sa libingan.
- source_word: ἐπέκειτο ἐπ’ αὐτῷ
  choice: may batong nakatakip sa bungad nito
  rationale: Ipinapahayag ang praktikal na ayos ng batong nakaharang sa pasukan ng libingang yungib; ang 'bungad' ay nilinaw mula sa konteksto nang hindi ipinapalagay na nakapatong ito sa pahalang na ibabaw.
theological_decisions:
- issue: Ang tiyak na uri ng matinding damdamin ni Jesus sa ἐμβριμώμενος
  choice: Matinding pagkabagabag sa kanyang kalooban
  alternative: Pagngingitngit o matinding pagkaligalig sa kanyang kalooban
  rationale: Napakalakas ng pandiwang Griyego at maaari itong magpahiwatig ng galit o pagkagalit, hindi lamang dalamhati. Hindi tinutukoy nang tiyak ng pangunahing teksto ang iisang damdamin, kaya pinananatili sa talababa ang mas matitinding posibleng kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kalooban” upang maipahayag ang panloob na damdamin at ang “bungad” upang maging natural ang paglalarawan sa batong nakatakip sa libingang yungib.
