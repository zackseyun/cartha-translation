  source_fidelity: Kailangang itama ang panandang pagmamay-ari sa "ang kapatid niyang babae." Sa kasalukuyang ayos, ang "niyang" ay likas na maaaring tumukoy kay Jesus, kaya nagiging kapatid ni Jesus si Marta, salungat sa Griyegong αὐτῆς na tumutukoy kay Marta. Ang binagong teksto ay malinaw na nagsasaad na ang kapatid na babae ay kay Marta, nang hindi pinapangalanang Maria.
