base_translation:
  language: en
  yaml_path: translation/nt/john/011/005.yaml
  text: Jesus loved Martha and her sister and Lazarus.
translation:
  language: tl
  text: Mahal ni Jesus si Marta at ang kapatid nitong babae, at si Lazaro.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠγάπα
  choice: Mahal
  rationale: Ang imperfect ng ἀγαπάω ay naglalarawan dito ng nagpapatuloy na pag-ibig o saloobin ni Jesus. Likas sa makabagong Tagalog ang stative na “Mahal ni Jesus” at hindi kailangang gawing progresibong “minamahal noon.”
- source_word: δὲ
  choice: hindi tahasang isinalin
  rationale: Mahinang pang-ugnay ang δέ. Sa pangungusap na ito, mas natural sa Tagalog na hayaang ang pagkakasunod ng salaysay ang magpahiwatig ng transisyon kaysa magdagdag ng “ngayon” o ng masidhing panalungat na “ngunit.”
- source_word: τὴν Μάρθαν
  choice: si Marta
  rationale: Ginamit ang karaniwang anyong Tagalog ng pangalang Martha at ang pantukoy na “si” para sa tiyak na taong layon.
- source_word: τὴν ἀδελφὴν αὐτῆς
  choice: ang kapatid niyang babae
  rationale: Pinananatili ang pagtukoy ng Griyego sa kapatid ni Marta nang hindi ipinapasok ang pangalang Maria, na hindi binanggit sa talatang ito. Nilinaw ang kasarian dahil ἀδελφή ay tahasang “kapatid na babae.”
- source_word: τὸν Λάζαρον
  choice: si Lazaro
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng pangalang Lazarus at ang pantukoy na “si.”
- source_word: καὶ ... καὶ
  choice: '..., ... at ...'
  rationale: Likas sa Tagalog ang paghahanay na may kuwit at pangwakas na “at.” Nananatiling malinaw na tatlong magkakahiwalay na tao ang minamahal ni Jesus kahit hindi inuulit ang bawat καί nang mekanikal.
theological_decisions:
- issue: Diwa ng imperfect na ἠγάπα tungkol sa pag-ibig ni Jesus
  choice: Isang payak na pahayag ng nagpapatuloy na pagmamahal ni Jesus kina Marta, sa kapatid niyang babae, at kay Lazaro
  alternative: “Patuloy na minamahal noon” o “nagsimulang mahalin”
  rationale: Pinakamalamang na inilalarawan ng imperfect ang isang nagpapatuloy na kalagayan sa nakalipas na salaysay. Hindi kailangan ng Tagalog na markahan ito nang progresibo, at hindi sinusuportahan ng konteksto ang ingressive na “nagsimulang mahalin.”
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “Mahal ni Jesus” bilang payak at idiomatikong pahayag ng matatag na pagmamahal; iniwasan ang artipisyal na “iniibig” at ang hindi kailangang panandang temporal. Walang talababa dahil walang mahalagang tekstuwal o leksikal na kalabuan na kailangang ilahad sa mambabasa.
