  naturalness: Ang «sa paanan nito» ay hindi likas at maaaring magmukhang di-magalang kapag ang tinutukoy ay isang tao. Mas natural at malinaw ang «sa paanan niya». Ang «pagkakita sa kanya» ay maayos na Tagalog para sa circumstantial participle na ἰδοῦσα αὐτόν.
  terminology: Ang «Panginoon» ay katanggap-tanggap na salin ng Κύριε alinsunod sa itinakdang gamit, habang pinananatili ng talababa ang posibleng magalang na alternatibong pagtawag.
  issues:
  - severity: medium
    issue: Hindi maayos ang anyong «at makita siya».
    rationale: Pagkatapos ng «nang dumating», ang payak na infinitive na «makita» ay hindi natural na koordinasyon para sa ἰδοῦσα αὐτόν. Ang «pagkakita sa kanya» ay malinaw at idiomatiko.
  - severity: medium
    issue: «Sa paanan nito» ang gamit para kay Jesus.
    rationale: Ang «nito» ay karaniwang para sa bagay o hayop at hindi angkop na pantukoy sa isang taong iginagalang. «Sa paanan niya» ang natural na anyo.
  - severity: low
    issue: Hindi nailalabas ng «kapatid ko» ang kasariang panlalaki ng ἀδελφός.
    rationale: Maaaring neutral sa kasarian ang «kapatid» sa Tagalog. Ang «kapatid kong lalaki» ay nagpapanatili sa kahulugang “my brother” nang hindi nagdaragdag ng iba pang impormasyon.
