revisions:
- from: Kaya nang dumating si Maria sa kinaroroonan ni Jesus at makita siya, nagpatirapa siya sa paanan nito at sinabi, “Panginoon,[a] kung narito sana kayo, hindi sana namatay ang kapatid ko.”
  to: Kaya nang dumating si Maria sa kinaroroonan ni Jesus, pagkakita sa kanya ay nagpatirapa siya sa paanan niya at sinabi, “Panginoon,[a] kung narito sana kayo, hindi sana namatay ang kapatid kong lalaki.”
  rationale: Inayos ang circumstantial na «nakita siya» bilang idiomatikong «pagkakita sa kanya», pinalitan ang hindi angkop na «nito» ng «niya», at nilinaw na lalaki ang kapatid upang maipakita ang ἀδελφός. Hindi binago ang kahulugan, antas ng paggalang, o ang sinadyang pagpapanatili sa «Panginoon» na may talababa para sa alternatibong «Ginoo».
