id: JHN.11.32
reference: John 11:32
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἡ οὖν ⸀Μαριὰμ ὡς ἦλθεν ὅπου ⸀ἦν Ἰησοῦς ἰδοῦσα αὐτὸν ἔπεσεν αὐτοῦ ⸀πρὸς τοὺς πόδας, λέγουσα αὐτῷ· Κύριε, εἰ ἦς ὧδε οὐκ ἄν ⸂μου ἀπέθανεν⸃ ὁ ἀδελφός.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/032.yaml
  text: So when Mary came where Jesus was and saw him[a], she fell at his feet, saying to him, “Lord, if you had been here, my brother would not have died.”
translation:
  language: tl
  text: Kaya nang dumating si Maria sa kinaroroonan ni Jesus, pagkakita sa kanya ay nagpatirapa siya sa paanan niya at sinabi, “Panginoon,[a] kung narito sana kayo, hindi sana namatay ang kapatid kong lalaki.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ginoo.” Ang Griegong κύριε ay maaaring maging magalang na pantawag, ngunit isinalin dito na “Panginoon” ayon sa karaniwang salin ng κύριος at sa paglalarawan kay Jesus sa Ebanghelyo ni Juan.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Ipinapakita ang pagpapatuloy at kaugnayan ng salaysay sa naunang pangyayari nang hindi labis na pormal.
- source_word: ὡς ἦλθεν ὅπου ἦν Ἰησοῦς
  choice: nang dumating si Maria sa kinaroroonan ni Jesus
  rationale: Natural na temporal at lokatibong pagpapahayag sa modernong Tagalog; malinaw na tumutukoy sa pagdating niya sa lugar na naroon si Jesus.
- source_word: ἰδοῦσα αὐτόν
  choice: at makita siya
  rationale: Pinananatili ang pangyayaring kasabay o kasunod kaagad ng pagdating, sa natural na anyong Tagalog.
- source_word: ἔπεσεν αὐτοῦ πρὸς τοὺς πόδας
  choice: nagpatirapa siya sa paanan nito
  rationale: Ipinahahayag ang pagbagsak o pagyukod sa harap ni Jesus; ang “nagpatirapa” ay marangal at madaling maunawaan sa konteksto.
- source_word: λέγουσα αὐτῷ
  choice: at sinabi
  rationale: Natural na isinasalin ang participle bilang kasunod na pandiwa sa Tagalog; malinaw na kay Jesus nakatuon ang sinabi mula sa konteksto.
- source_word: Κύριε
  choice: Panginoon
  rationale: Pinananatili ang karaniwang salin ng κύριος at ang posibleng mas malalim na bigat nito sa paglalarawan kay Jesus sa Ebanghelyo ni Juan.
- source_word: εἰ ἦς ὧδε
  choice: kung narito sana kayo
  rationale: Ang “sana” ay likas na paraan sa Tagalog upang ipahayag ang salungat-sa-katotohanang kalagayan sa nakaraan; ang “kayo” ay magalang na tuwirang pakikipag-usap.
- source_word: οὐκ ἄν ... ἀπέθανεν
  choice: hindi sana namatay
  rationale: Tumpak at natural na ipinapahayag ang hindi natupad na bunga ng kondisyon sa nakaraan.
- source_word: μου ὁ ἀδελφός
  choice: ang kapatid ko
  rationale: Natural na Tagalog para sa possessive genitive; hindi tinutukoy ng salitang ἀδελφός lamang kung nakatatanda o nakababatang kapatid.
theological_decisions:
- issue: Pagpapakahulugan sa κύριος bilang tawag ni Maria kay Jesus
  choice: Panginoon
  alternative: Ginoo
  rationale: Maaaring magpahiwatig ang κύριε ng magalang na pagtawag lamang, ngunit pinananatili ng “Panginoon” ang karaniwang biblikal na salin at ang teolohikal na bigat na maaaring taglayin nito sa Ebanghelyo ni Juan, nang hindi ipinipilit na ganap nang malinaw ang antas ng pagkilala ni Maria.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang magalang na “kayo” sa tuwirang pakikipag-usap kay Jesus at ang “nagpatirapa” upang maipakita ang kilos sa paanan niya. Ang “nito” ay ginamit upang maiwasan ang kalituhan sa paulit-ulit na “niya,” habang nananatiling malinaw na kay Jesus tumutukoy.
