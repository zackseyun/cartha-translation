  revision_rationale: Inayos ang pangunahing salin at talababa upang ang pangunahing teksto ay hindi magpasiya sa pagitan ng payak na “makipagtagpo” at ng mas kontekstuwal na “lumabas upang salubungin.” Pinalitan din ang “nakapasok” ng “nakararating” para sa mas tuwirang katumbas ng kilos ng pagdating sa nayon, at ginawang “ngunit” ang pang-ugnay para sa mas natural na daloy.
