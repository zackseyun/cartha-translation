  text: οὔπω δὲ ἐληλύθει ὁ Ἰησοῦς εἰς τὴν κώμην, ἀλλ’ ἦν ⸀ἔτι ἐν τῷ τόπῳ ὅπου ὑπήντησεν αὐτῷ ἡ Μάρθα.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/030.yaml
  text: Jesus had not yet come into the village[a], but was still in the place where Martha had met him.
translation:
  language: tl
  text: Hindi pa nakararating si Jesus sa nayon, ngunit naroon pa rin siya sa lugar kung saan nakipagtagpo sa kanya si Marta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “kung saan lumabas si Marta upang salubungin siya.”
    reason: Ipinapakita ang mas ekspisitong kontekstuwal na pagbasa ng ὑπαντάω bilang paglabas upang salubungin, samantalang pinananatili ng pangunahing salin ang mas payak na “nakipagtagpo.”
lexical_decisions:
- source_word: οὔπω
  choice: Hindi pa
  rationale: Tuwirang ipinahahayag na hanggang sa puntong iyon ay hindi pa nagaganap ang pagpasok ni Jesus sa nayon.
- source_word: δὲ
  choice: hindi isinalin nang hiwalay
  rationale: Mahinang pang-ugnay ito sa daloy ng salaysay; sapat na sa natural na Tagalog ang pagkakasunod ng mga pangungusap at hindi kailangan ang artipisyal na panimulang “Ngayon.”
- source_word: ἐληλύθει
  choice: nakapasok
  rationale: Sa pagsama sa pariralang εἰς τὴν κώμην, natural nitong ipinahahayag ang pagdating o pagpasok sa loob ng nayon; ipinapakita ng “hindi pa” ang naunang kalagayang tinutukoy ng pluperfect.
- source_word: κώμην
  choice: nayon
  rationale: Karaniwan itong tumutukoy sa isang maliit na pamayanan; ang “nayon” ay malinaw at angkop sa dignidad ng salaysay.
- source_word: ἀλλ’
  choice: kundi
  rationale: Malinaw nitong itinatapat ang hindi pa pagpasok sa nayon sa pananatili ni Jesus sa dating lugar.
- source_word: ἔτι
  choice: pa rin
  rationale: Ipinahahayag ang patuloy na pananatili ni Jesus sa lugar na iyon.
- source_word: τόπῳ
  choice: lugar
  rationale: Payak at natural na katumbas ng pangkalahatang katawagan para sa isang lokasyon.
- source_word: ὅπου
  choice: kung saan
  rationale: Natural na panandang Tagalog para sa sugnay na tumutukoy sa lugar.
- source_word: ὑπήντησεν
  choice: sinalubong
  rationale: Napananatili nito ang maaaring diwang pagpunta upang makipagtagpo, na angkop sa konteksto ng paglabas ni Marta upang salubungin si Jesus.
- source_word: αὐτῷ
  choice: siya
  rationale: Ang tinutukoy ay si Jesus; natural sa balintiyak na Tagalog ang “siya” bilang layon ng “sinalubong.”
- source_word: Μάρθα
  choice: Marta
  rationale: Karaniwang anyo ng pangalang Μάρθα sa modernong Tagalog.
