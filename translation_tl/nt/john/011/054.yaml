id: JHN.11.54
reference: John 11:54
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸂Ὁ οὖν Ἰησοῦς⸃ οὐκέτι παρρησίᾳ περιεπάτει ἐν τοῖς Ἰουδαίοις, ἀλλὰ ἀπῆλθεν ἐκεῖθεν εἰς τὴν χώραν ἐγγὺς τῆς ἐρήμου, εἰς Ἐφραὶμ λεγομένην πόλιν, κἀκεῖ ⸀ἔμεινεν μετὰ τῶν ⸀μαθητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/054.yaml
  text: So Jesus no longer walked openly among the Jews[a], but departed from there to the region near the wilderness, to a city called Ephraim, and stayed there with the disciples.
translation:
  language: tl
  text: Kaya hindi na hayagang naglalakad si Jesus sa gitna ng mga Judio[a]. Sa halip, umalis siya roon at nagtungo sa lupaing malapit sa ilang, sa isang lungsod na tinatawag na Efraim. Nanatili siya roon kasama ng mga alagad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa gitna ng mga taga-Judea.” Sa Ebanghelyo ni Juan, ang “mga Judio” ay maaaring tumukoy nang mas tiyak sa mga taga-Judea o sa mga pinunong Judio, depende sa konteksto.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Ipinahahayag ang bunga ng naunang balak laban kay Jesus; natural sa makabagong Tagalog at pinananatili ang lohikang pasunod.
- source_word: οὐκέτι παρρησίᾳ περιεπάτει
  choice: hindi na hayagang naglalakad
  rationale: Pinananatili ng “hindi na” ang temporal na pagtigil, ng “hayagan” ang diwang pampubliko ng παρρησίᾳ, at ng “naglalakad” ang larawang pandiwa ng περιπατέω, na rito ay tumutukoy sa malayang pagkilos sa publiko.
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: sa gitna ng mga Judio
  rationale: Natural na katumbas ng panlipunan at heograpikong parirala, habang hindi nililimitahan ang salita sa mga pinuno lamang; inilalahad sa talababa ang posibleng rehiyonal na diwa.
- source_word: ἀλλὰ ἀπῆλθεν ἐκεῖθεν
  choice: Sa halip, umalis siya roon
  rationale: Malinaw na ipinapakita ang pagsalungat at ang pag-alis mula sa dating lugar nang hindi nagiging matigas ang pangungusap.
- source_word: εἰς τὴν χώραν ἐγγὺς τῆς ἐρήμου
  choice: nagtungo sa lupaing malapit sa ilang
  rationale: Ang χώρα ay isang pook o lupain, hindi modernong bansa; ang “ilang” ay angkop sa ἔρημος bilang liblib at kakaunting naninirahang lugar.
- source_word: εἰς Ἐφραὶμ λεγομένην πόλιν
  choice: sa isang lungsod na tinatawag na Efraim
  rationale: Tuwirang isinasalin ang πόλις at λεγομένην; ginagamit ang karaniwang anyong Filipino ng pangalang Efraim.
- source_word: κἀκεῖ ἔμεινεν μετὰ τῶν μαθητῶν
  choice: Nanatili siya roon kasama ng mga alagad
  rationale: Ang “nanatili” ay tumpak sa μένω at natural sa salaysay; hindi idinagdag ang “niya” sapagkat wala itong tahasang katumbas sa Griyego.
theological_decisions:
- issue: Tinutukoy ng Ἰουδαῖοι sa Ebanghelyo ni Juan
  choice: mga Judio
  alternative: mga taga-Judea
  rationale: Maaaring etniko, panrehiyon, o tumukoy sa mga pinuno ang salita ayon sa konteksto. Dito, ang pahayag ay tungkol sa hayagang pagkilos ni Jesus sa gitna ng mga tao sa lugar, hindi isang teolohikal na paglalahat tungkol sa lahat ng Judio. Pinananatili sa teksto ang pamilyar na salin at inilalagay sa talababa ang posibleng panrehiyong diwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Hinati sa tatlong pangungusap upang maging natural ang daloy nang hindi binabago ang mga ugnayang lohikal at heograpiko ng Griyego.
