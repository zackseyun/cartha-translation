source:
  edition: SBLGNT
  text: Καὶ ⸀τοῦτο εἰποῦσα ἀπῆλθεν καὶ ἐφώνησεν ⸀Μαριὰμ τὴν ἀδελφὴν αὐτῆς λάθρᾳ εἰποῦσα· Ὁ διδάσκαλος πάρεστιν καὶ φωνεῖ σε.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/028.yaml
  text: And after saying this[a], she went away and called Mary her sister privately, saying[c][b], “The Teacher is here and is calling for you.”
translation:
  language: tl
  text: Pagkatapos niyang sabihin ito, umalis siya at tinawag niya nang sarilinan[a] ang kapatid niyang si Maria. Sinabi niya, “Narito ang Guro[b] at tinatawag ka niya.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “palihim.” Ang salitang Griyego ay maaaring tumukoy sa pagsasalitang hindi naririnig ng ibang tao.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “ang Maestro.” Sa Griyego, “ang Guro.”
    reason: lexical_alternative
  - marker: c
    text: O “ipinapatawag ka niya.” Maaaring ang ibig sabihin ay hinihiling niyang pumunta ka sa kaniya.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο εἰποῦσα
  choice: Pagkasabi nito
  rationale: Ginawang temporal ang aorist participle upang natural na maipakita sa Tagalog ang pagkakasunod ng mga pangyayari.
- source_word: ἀπῆλθεν
  choice: umalis siya
  rationale: Karaniwan at malinaw na katumbas ng pag-alis mula sa kinaroroonan.
- source_word: ἐφώνησεν Μαριὰμ τὴν ἀδελφὴν αὐτῆς
  choice: tinawag ang kapatid niyang si Maria
  rationale: Likas na ayos sa Tagalog na kapuwa nagpapakilala kay Maria bilang kapatid niya at naghahayag na siya ay tinawag.
- source_word: λάθρᾳ
  choice: palihim
  rationale: Ipinahihiwatig na ang pagtawag ay ginawa nang hindi naririnig ng publiko; nililinaw sa talababa ang mas neutral na alternatibong “nang sarilinan.”
- source_word: Ὁ διδάσκαλος
  choice: ang Guro
  rationale: Tuwirang pinananatili ang karaniwang kahulugan ng διδάσκαλος bilang isang magalang na titulo kay Jesus.
- source_word: πάρεστιν
  choice: Narito
  rationale: Maikli at natural na Tagalog para sa pagiging naroon o kasalukuyang presensiya.
- source_word: φωνεῖ σε
  choice: tinatawag ka niya
  rationale: Pinananatili ang present-tense na anyo at ang pangunahing kahulugan ng pandiwa; maaaring tumukoy sa pagpapapunta sa kaniya, gaya ng nasa talababa.
theological_decisions:
- issue: Titulo ni Jesus na διδάσκαλος
  choice: ang Guro
  alternative: ang Panginoon / ang Maestro
  rationale: Ang “Guro” ang tuwirang leksikal na katumbas at hindi nagdaragdag ng di-tahasang pahiwatig tungkol sa kapangyarihan o katayuan.
- issue: Diwa ng λάθρᾳ
  choice: palihim
  alternative: nang sarilinan
  rationale: Ipinakikita ng konteksto ang maingat na pakikipag-usap na hindi maririnig ng iba, ngunit hindi tiyak na may panlilinlang o takot; kaya inilakip ang mas neutral na alternatibo sa talababa.
- issue: Diwa ng φωνεῖ σε
  choice: tinatawag ka niya
  alternative: ipinapatawag ka niya
  rationale: Pinananatili ng pangunahing salin ang anyong aktibo at kasalukuyan ng Griyego, habang ipinakikita ng alternatibo ang malamang na pragmatikong diwa na hinihiling ni Jesus na pumunta si Maria.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang payak na daloy ng salaysay at ang magalang na titulong “Guro,” habang inilagay sa mga talababa ang mahahalagang leksikal na alternatibo.
