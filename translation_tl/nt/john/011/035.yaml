  text: ἐδάκρυσεν ὁ Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/035.yaml
  text: Jesus wept[a].
translation:
  language: tl
  text: Lumuha si Jesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Umiyak si Jesus.” Ang pandiwang Griyego ay partikular na tumutukoy sa pagluha at naiiba sa mas malakas na pananaghoy na binanggit sa ibang bahagi ng salaysay.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδάκρυσεν
  choice: Lumuha
  rationale: Ang aorist active indicative na δακρύω ay tumutukoy sa pagpatak o pagluha. Likas at maikli sa modernong Tagalog ang “lumuha,” at hindi nito ipinapasok ang di-tiyak na diwang “nagsimulang” umiyak o ang mas malakas na paghagulhol.
- source_word: ὁ Ἰησοῦς
  choice: si Jesus
  rationale: Si Jesus ang simuno. Ginagamit sa natural na Tagalog ang pantukoy na “si” bago ang pangalan ng tao.
theological_decisions:
- issue: Paglalarawan sa damdamin ni Jesus
  choice: Lumuha si Jesus.
  alternative: Umiyak si Jesus.
  rationale: Tuwirang pinananatili ng “lumuha” ang tunay na pagpapahayag ng damdamin ni Jesus habang mas tiyak nitong ipinahihiwatig ang pagpatak ng luha, nang hindi ito pinalalakas tungo sa paghagulhol o dinaragdagan ng paliwanag na doktrinal.
translation_notes:
  register: Maikli, marangal, at natural sa modernong Filipino Tagalog. Pinili ang “lumuha” upang mapanatili ang tiyak at mahinahong larawan ng pandiwang Griyego; inilagay ang mas karaniwang “umiyak” bilang alternatibo sa talababa.
