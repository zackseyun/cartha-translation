id: JHN.11.25
reference: John 11:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἶπεν αὐτῇ ὁ Ἰησοῦς· Ἐγώ εἰμι ἡ ἀνάστασις καὶ ἡ ζωή· ὁ πιστεύων εἰς ἐμὲ κἂν ἀποθάνῃ ζήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/025.yaml
  text: Jesus said to her[a], “I am the resurrection and the life. The one who believes in me, even if he dies, will live,”
translation:
  language: tl
  text: Sinabi sa kanya ni Jesus, “Ako ang muling pagkabuhay at ang buhay. Ang sumasampalataya sa akin, kahit mamatay siya, ay mabubuhay.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Ang sinumang sumasampalataya sa akin, kahit mamatay, ay mabubuhay.” Isahan at panlalaki ang anyo sa Griyego (“ang sumasampalataya … kahit mamatay siya”), ngunit ginagamit ito bilang kinatawan ng sinuman.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν αὐτῇ ὁ Ἰησοῦς
  choice: Sinabi sa kanya ni Jesus
  rationale: Likas na ayos sa modernong Tagalog para sa tuwirang pambungad sa sinabi, habang malinaw na pinananatili ang pambabaeng tinutukoy ng αὐτῇ mula sa konteksto.
- source_word: Ἐγώ εἰμι
  choice: Ako ang
  rationale: Sa Tagalog, ang predikatibong hulma na “Ako ang…” ang natural at tuwirang katumbas ng mariing pagkakakilanlang Ἐγώ εἰμι.
- source_word: ἡ ἀνάστασις
  choice: ang muling pagkabuhay
  rationale: Karaniwang terminong Tagalog para sa pagkabuhay mula sa mga patay; pinananatili ng “ang” ang tiyak at mariing pagkakakilanlan.
- source_word: ἡ ζωή
  choice: ang buhay
  rationale: Pinananatili ang tiyak na artikulo at ang parallel na anyo sa “ang muling pagkabuhay,” nang hindi ginagawang paliwanag lamang na si Jesus ang nagbibigay ng buhay.
- source_word: ὁ πιστεύων
  choice: Ang sumasampalataya
  rationale: Ang nominalisadong pandiwang Tagalog ay likas, pangkalahatan, at naglalarawan sa taong nananampalataya, gaya ng substantival present participle.
- source_word: εἰς ἐμέ
  choice: sa akin
  rationale: Ang “sumasampalataya sa akin” ang idiomatikong Tagalog para sa relational na pagtitiwalang ipinahihiwatig ng πιστεύω εἰς.
- source_word: κἂν ἀποθάνῃ
  choice: kahit mamatay siya
  rationale: Malinaw na naihahayag ng “kahit” ang concessive condition, at natural na isinasalin ang aorist subjunctive bilang payak na pangyayaring maaaring maganap.
- source_word: ζήσεται
  choice: ay mabubuhay
  rationale: Pinananatili ang malawak na pangako ng buhay sa hinaharap nang idagdag ang “muli,” na hindi tahasang nasa Griyego.
theological_decisions:
- issue: Kinatawang panlalaki sa ὁ πιστεύων at kasunod na mga pandiwang isahan
  choice: Ang sumasampalataya sa akin, kahit mamatay siya, ay mabubuhay
  alternative: Ang sinumang sumasampalataya sa akin, kahit mamatay, ay mabubuhay
  rationale: Pinananatili ng pangunahing teksto ang isahang anyo sa pamamagitan ng “siya,” ngunit ang pangkalahatan at inklusibong saklaw ng Griyego ay nililinaw sa talababa.
- issue: Saklaw ng pagkakakilanlan ni Jesus sa Ἐγώ εἰμι ἡ ἀνάστασις καὶ ἡ ζωή
  choice: Ako ang muling pagkabuhay at ang buhay
  alternative: Ako ang nagbibigay ng muling pagkabuhay at buhay
  rationale: Pinananatili ang tuwirang predikatibong pahayag at ang teolohikal na bigat nito, sa halip na gawing pahayag lamang tungkol sa ginagawa ni Jesus.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang karaniwang biblikal ngunit madaling maunawaang “muling pagkabuhay” at “sumasampalataya.” Pinanatili ang maikli, mariin, at parallel na anyo ng pahayag ni Jesus.
