  text: So when Martha heard that Jesus was coming[a], she went to meet him; but Mary was sitting in the house.
translation:
  language: tl
  text: Kaya nang marinig ni Marta na paparating si Jesus[a], sinalubong niya siya; ngunit nakaupo si Maria sa bahay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dumarating si Jesus.” Nasa kasalukuyang panahunan ang pandiwang Griyego sa iniulat na pahayag; maaari itong isalin nang mas pormal bilang “dumarating.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Nag-uugnay sa naunang salaysay at nagpapakita ng likas na pagpapatuloy o bunga ng pangyayari.
- source_word: ὡς
  choice: nang
  rationale: Likas na panandang temporal sa Tagalog at hindi nagdaragdag ng diwang 'kaagad' na hindi tahasang nasa Griyego.
- source_word: ἤκουσεν
  choice: marinig
  rationale: Tuwirang katumbas ng pandiwang ἀκούω sa kontekstong ito.
- source_word: ἔρχεται
  choice: dumarating
  rationale: Pinananatili ang kasalukuyang panahunan at nagpapatuloy na kilos ng Griyego sa iniulat na pahayag; maaari ring unawain sa likas na salaysay bilang 'paparating.'
- source_word: ὑπήντησεν
  choice: sinalubong
  rationale: Likas at maikli sa Tagalog, at ipinahihiwatig ang pagpunta upang katagpuin ang isang dumarating.
- source_word: δὲ
  choice: ngunit
  rationale: Ipinakikita ang banayad na paghahambing ng ginawa ni Maria sa ginawa ni Marta.
- source_word: ἐν τῷ οἴκῳ
  choice: sa loob ng bahay
  rationale: Pinananatili ang kongkretong lokasyon ng pariralang Griyego at malinaw na nagpapahiwatig na nanatili si Maria sa bahay.
- source_word: ἐκαθέζετο
  choice: ay nakaupo
  rationale: Ipinahahayag ang nagpapatuloy na kalagayan sa nakaraang tagpo nang hindi dinaragdagan ng tahasang diwang 'nanatili.'
- source_word: Μάρθα / Μαρία / Ἰησοῦς
  choice: Marta / Maria / Jesus
  rationale: Ginagamit ang karaniwan at kinikilalang anyo ng mga pangalang biblikal sa modernong Tagalog.
