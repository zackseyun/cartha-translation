id: JHN.11.17
reference: John 11:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἐλθὼν οὖν ὁ Ἰησοῦς εὗρεν αὐτὸν τέσσαρας ⸂ἤδη ἡμέρας⸃ ἔχοντα ἐν τῷ μνημείῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/017.yaml
  text: So when Jesus arrived, he found that Lazarus had already been in the tomb four days.
translation:
  language: tl
  text: Kaya pagdating ni Jesus, nalaman niyang apat na araw nang nasa libingan si Lazaro.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλθὼν
  choice: pagdating ni Jesus
  rationale: Ang aorist participle ay nagsasaad ng pangyayaring kaugnay at nauna sa pangunahing pandiwang εὗρεν. Ang “pagdating ni Jesus” ay likas na salaysay sa modernong Tagalog at tapat sa temporal na ugnayan.
- source_word: οὖν
  choice: Kaya
  rationale: Dito, ang οὖν ay nag-uugnay sa pangyayari sa naunang salaysay. Ang “Kaya” ay natural na pang-ugnay at hindi kailangang magpahiwatig ng mahigpit na lohikal na kongklusyon.
- source_word: εὗρεν
  choice: nalaman niya
  rationale: Bagaman karaniwang nangangahulugang “natagpuan,” sa konstruksyong ito ay tumutukoy ito sa pagkaalam o pagkakatuklas ni Jesus sa kalagayan ni Lazaro. Mas natural sa Tagalog ang “nalaman niyang” kaysa “natagpuan niyang ... nasa libingan.”
- source_word: αὐτὸν
  choice: si Lazaro
  rationale: Ang panghalip ay malinaw na tumutukoy kay Lazaro ayon sa konteksto. Ang tahasang pagbanggit sa pangalan ay nag-aalis ng kalabuan sa Tagalog nang walang idinaragdag na bagong impormasyon.
- source_word: τέσσαρας ἤδη ἡμέρας ἔχοντα
  choice: apat na araw nang
  rationale: Ang literal na konstruksyong “mayroon nang apat na araw” ay idyomatikong nagsasaad ng tagal. Ang “apat na araw nang” ay maikli, natural, at pinananatili ang diwa ng ἤδη.
- source_word: μνημείῳ
  choice: libingan
  rationale: Ang μνημεῖον ay isang lugar ng paglilibing o puntod. Ang “libingan” ang pinakanatural at marangal na katumbas sa modernong Tagalog sa kontekstong ito.
theological_decisions:
- issue: Tahasan bang pangalanan ang tinutukoy ng αὐτόν
  choice: Ginamit ang “si Lazaro.”
  alternative: Panatilihin ang panghalip bilang “siya.”
  rationale: Malinaw sa konteksto na si Lazaro ang tinutukoy. Ang tahasang pangalan ay nakatutulong sa kalinawan at hindi naglulutas ng anumang teolohikal na usaping hindi nilulutas ng Griyego.
- issue: Ang ipinahihiwatig ng apat na araw
  choice: Isinalin lamang ang tagal niya sa libingan.
  alternative: Ipaliwanag sa teksto na apat na araw na siyang patay o nakalibing.
  rationale: Sinasabi ng talata na apat na araw na siyang nasa μνημεῖον; hindi dapat dagdagan sa pangunahing teksto ang paliwanag na “patay” o “nakalibing,” kahit malinaw iyon sa mas malawak na konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural at dignified. Ginamit ang “nalaman” sa halip na ang mas literal ngunit alanganing “natagpuan” upang maipahayag nang malinaw ang resultang pagkaunawa ni Jesus sa kalagayan ni Lazaro. Walang kinakailangang talababa.
