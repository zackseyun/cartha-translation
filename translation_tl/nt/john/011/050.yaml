  text: οὐδὲ ⸀λογίζεσθε ὅτι συμφέρει ⸀ὑμῖν ἵνα εἷς ἄνθρωπος ἀποθάνῃ ὑπὲρ τοῦ λαοῦ καὶ μὴ ὅλον τὸ ἔθνος ἀπόληται.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/050.yaml
  text: Nor do you consider that it is better for you that one man die for the people[a], and not that the whole nation perish.
translation:
  language: tl
  text: Hindi rin ninyo isinasaalang-alang na mas mabuti para sa inyo na mamatay ang isang tao para sa bayan[a] at hindi mapahamak ang buong bansa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “alang-alang sa bayan”; maaari ring taglayin ng parirala ang diwang “kapalit ng bayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: Hindi rin
  rationale: Likas na ipinapahayag sa Tagalog ang karagdagang pasaway na negatibong kaugnay ng naunang pahayag.
- source_word: λογίζεσθε
  choice: ninyo isinasaalang-alang
  rationale: Ipinapakita ang diwa ng maingat na pagkukuwenta o pag-iisip sa gitna ng kanilang deliberasyon.
- source_word: συμφέρει ὑμῖν
  choice: mas mabuti para sa inyo
  rationale: Malinaw na ipinahahayag ang praktikal at pansariling kapakinabangang tinutukoy ni Caifas.
- source_word: ἵνα εἷς ἄνθρωπος ἀποθάνῃ
  choice: na isang tao ang mamatay
  rationale: Pinananatili ang isahan at ang layon/nilalaman ng sinasabing kapakinabangan sa natural na ayos ng Tagalog.
- source_word: ὑπὲρ τοῦ λαοῦ
  choice: para sa bayan
  rationale: Ang “para sa” ay sapat na malawak upang saklawin ang kapakinabangan, pagkatawan, at posibleng paghalili; ang “bayan” ay tumutukoy sa sambayanan at naiiba pa rin sa bansang pampolitika.
- source_word: ὅλον τὸ ἔθνος
  choice: ang buong bansa
  rationale: Ipinapahayag ang buong sambayanan bilang isang pambansa at pampolitikang kabuuan sa harap ng bantang pagkawasak.
- source_word: ἀπόληται
  choice: mapahamak
  rationale: Natural at marangal na salitang Tagalog para sa pagkapuksa o pagkawasak nang hindi nililimitahan ang tiyak na paraan nito.
theological_decisions:
- issue: Saklaw ng ὑπέρ kaugnay ng kamatayan ni Jesus
  choice: “para sa bayan” sa pangunahing teksto
  alternative: “alang-alang sa bayan” o “kapalit ng bayan”
  rationale: Ang malawak na salin ay nagpapanatili kapwa sa agarang diwa ng pampolitikang kapakinabangan sa sinabi ni Caifas at sa mas malalim na propetikong pahiwatig na ipinaliliwanag ng ebanghelista, nang hindi ipinipilit ang iisang teolohikal na pakahulugan.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “bayan” para sa λαός at “bansa” para sa ἔθνος upang mapanatili ang pagkakaiba ng sambayanan at ng pambansang kabuuan.
