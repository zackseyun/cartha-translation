id: JHN.11.34
reference: John 11:34
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ εἶπεν· Ποῦ τεθείκατε αὐτόν; λέγουσιν αὐτῷ· Κύριε, ἔρχου καὶ ἴδε.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/034.yaml
  text: And he said[a], “Where have you laid him?” They said to him, “Lord, come and see.”
translation:
  language: tl
  text: At sinabi niya, “Saan ninyo siya inilagay?” Sinabi nila sa kanya, “Panginoon[a], halika at tingnan mo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ginoo.” Ang Griyegong κύριε ay maaaring gamitin bilang magalang na tawag, ngunit “Panginoon” ang ginamit sa pangunahing teksto.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν
  choice: sinabi niya
  rationale: Karaniwang pandiwa ito ng pagsasalita. Bagaman tanong ang kasunod na pangungusap, pinananatili ng “sinabi” ang anyo ng Griyego sa halip na bigyang-kahulugang “tinanong.”
- source_word: Ποῦ
  choice: saan
  rationale: Tuwirang pang-abay na pananong tungkol sa lugar.
- source_word: τεθείκατε
  choice: inilagay ninyo
  rationale: Ang perpektong anyo ng τίθημι ay tumutukoy sa natapos na paglalagay sa katawan ni Lazaro. Likas sa modernong Tagalog ang “Saan ninyo siya inilagay?” at malinaw dito ang natapos na kilos.
- source_word: αὐτόν
  choice: siya
  rationale: Panghalip na panlalaking isahan na tumutukoy kay Lazaro.
- source_word: λέγουσιν
  choice: sinabi nila
  rationale: Pangkasaysayang pangkasalukuyan ito sa Griyego; ginamit ang pangnagdaan sa Tagalog upang maging likas ang salaysay.
- source_word: Κύριε
  choice: Panginoon
  rationale: Maaaring magpahiwatig ang tawag na ito ng paggalang at ng pagkilala kay Jesus bilang Panginoon. Pinananatili ng “Panginoon” ang dalawang posibleng himig.
- source_word: ἔρχου
  choice: halika
  rationale: Tuwirang pautos o paanyaya na angkop sa isahang kinakausap.
- source_word: ἴδε
  choice: tingnan mo
  rationale: Likas na pautos sa Tagalog para sa pagpunta upang makita ang kinalalagyan; malinaw rin nitong ipinahihiwatig na ituturo nila kay Jesus ang lugar.
theological_decisions:
- issue: Pagtutumbas sa κύριος bilang tawag kay Jesus
  choice: Panginoon
  alternative: Ginoo
  rationale: Sa kontekstong ito, maaaring isa lamang itong magalang na tawag, ngunit maaari ring may mas malalim na pagkilala kay Jesus. Pinananatili ng “Panginoon” ang posibleng teolohikal na bigat, samantalang itinatala sa talababa ang “Ginoo” bilang tunay na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, natural, at marangal. Pinanatili ang payak na kilos ng pagsasalita sa “sinabi” at inilagay ang talababa sa “Panginoon,” ang mismong salitang may alternatibong pagbasa.
