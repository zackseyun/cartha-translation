  yaml_path: translation/nt/john/011/037.yaml
  text: But some of them said[a], “Could not this man, who opened the eyes of the blind man, also have made it so that this man would not die?”
translation:
  language: tl
  text: Ngunit sinabi[a] ng ilan sa kanila, “Hindi ba kayang pigilan ng taong ito, na nagbukas ng mga mata ng bulag, ang pagkamatay ng taong ito?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Hindi ba kayang gawin ng taong ito, na nagbukas ng mga mata ng bulag, upang hindi mamatay ang taong ito?”
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  choice: Ngunit sinabi ng ilan sa kanila
  rationale: Likas na ipinapahayag ng “ilan sa kanila” ang τινὲς ἐξ αὐτῶν, at ipinakikita ng “ngunit” ang pagsalungat na dala ng δέ sa naunang tugon.
- source_word: Οὐκ ἐδύνατο
  choice: Hindi ba kayang
  rationale: Ang negatibong retorikal na tanong ay natural na naipapahayag sa modernong Tagalog sa “Hindi ba kayang,” habang pinananatili ang pahiwatig na inaasahan ng mga nagsasalita na may kakayahan sana siyang kumilos.
- source_word: οὗτος ὁ ἀνοίξας τοὺς ὀφθαλμοὺς τοῦ τυφλοῦ
  choice: ng taong ito, na nagmulat sa mga mata ng bulag
  rationale: Pinananatili ng “taong ito” ang mariing demonstratibo para kay Jesus; ang “nagmulat sa mga mata ng bulag” ay malinaw at malapit sa articular participial phrase.
- source_word: ποιῆσαι ἵνα καὶ οὗτος μὴ ἀποθάνῃ
  choice: pigilan ... ang pagkamatay ng taong ito
  rationale: Sa kontekstong ito, ang causative na ποιῆσαι ἵνα μὴ ἀποθάνῃ ay natural na nangangahulugang mapigilan ang pagkamatay. Ang ayos na ito ay malinaw sa Tagalog at pinananatili ng “taong ito” ang ikalawang demonstratibo, na tumutukoy kay Lazaro.
theological_decisions:
- issue: Himig ng tanong ng mga nagsasalita
  choice: Isinalin bilang mapagdudang retorikal na tanong tungkol sa kakayahan ni Jesus na pigilan ang pagkamatay ni Lazaro.
  alternative: Isalin bilang neutral at literal na tanong kung may kakayahan ba siya.
  rationale: Ang Οὐκ sa retorikal na tanong ay nagpapahiwatig na inaasahan nilang magagawa sana niya ito; hindi na dinagdagan ng tahasang paratang ang pahiwatig ng Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “nagmulat sa mga mata” sa halip na mas mekanikal na “nagbukas ng mga mata,” at “pigilan ang pagkamatay” upang maipahayag nang idiomatiko ang causative-result construction nang hindi nilulutas ang tensiyong teolohikal.
