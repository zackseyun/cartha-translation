  source_fidelity: 'Tapat ang salin sa Griyego: ang “Pagkatapos nito” ay natural na sumasaklaw sa magkakaugnay na ἔπειτα μετὰ τοῦτο; ang “sinabi niya” ay katanggap-tanggap na naturalisasyon ng historical present na λέγει; at malinaw na naipapahayag ng “Pumunta tayong muli sa Judea” ang hortatory na Ἄγωμεν, ang patutunguhang εἰς τὴν Ἰουδαίαν, at ang πάλιν.'
