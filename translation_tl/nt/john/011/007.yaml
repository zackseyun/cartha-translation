  text: ἔπειτα μετὰ τοῦτο λέγει τοῖς μαθηταῖς· Ἄγωμεν εἰς τὴν Ἰουδαίαν πάλιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/007.yaml
  text: Then after this he says to the disciples[a], “Let us go into Judea again.”
translation:
  language: tl
  text: Pagkatapos nito, sinabi niya sa mga alagad, “Pumunta tayong muli sa Judea.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπειτα μετὰ τοῦτο
  choice: Pagkatapos nito
  rationale: Magkasamang naghuhudyat ang dalawang parirala ng kasunod na pangyayari. Ang “Pagkatapos nito” ay likas sa modernong Tagalog at hindi na kailangang ulitin bilang “Pagkatapos, matapos nito.”
- source_word: λέγει
  choice: sinabi niya
  rationale: Historical present ito sa salaysay ni Juan. Karaniwang ginagamit sa natural na salaysay sa Tagalog ang naganap na aspekto, kaya malinaw at dignified ang “sinabi niya” nang hindi binabago ang pagkakasunod-sunod ng mga pangyayari.
- source_word: τοῖς μαθηταῖς
  choice: sa mga alagad
  rationale: Tuwirang isinasalin ang dative na tumutukoy sa mga pinagsabihan. Hindi idinagdag ang “niya” sapagkat wala itong tahasang katumbas sa Griyego.
- source_word: Ἄγωμεν
  choice: Pumunta tayo
  rationale: Ang unang panauhang maramihang hortatory subjunctive ay likas na ipinahahayag sa Tagalog sa anyong “Pumunta tayo,” na nagpapanatili sa paanyayang kasama ang nagsasalita.
- source_word: εἰς τὴν Ἰουδαίαν
  choice: sa Judea
  rationale: Sa Tagalog, ang “sa” ang likas na pananda ng patutunguhan at maaari ring saklawin ang pagpasok sa isang pook; hindi natural dito ang pilit na pagbubukod ng “to” at “into” sa Ingles.
- source_word: πάλιν
  choice: muli
  rationale: Tahasang pinananatili ang diwa ng pagpunta roon nang panibago, sa halip na ipaloob lamang ito sa pandiwang “bumalik.”
theological_decisions:
- issue: Historical present sa salaysay ni Juan
  choice: Isinalin bilang “sinabi niya” gamit ang naganap na aspekto
  alternative: “sinasabi niya” upang pormal na panatilihin ang kasalukuyang panahunan
  rationale: Ang Griyegong historical present ay nagbibigay-buhay sa salaysay, ngunit ang literal na kasalukuyang anyo ay alanganin sa karaniwang Tagalog sa kontekstong ito. Ang naganap na aspekto ay naghahatid ng parehong pangyayari nang natural at walang idinaragdag na teolohikal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, maikli, at marangal. Pinanatili ang “alagad” bilang pamilyar na katawagang biblikal at ang “Judea” bilang karaniwang anyo ng pangalan ng lugar. Walang talababa sapagkat ang pagkakaiba ng Ingles na “to” at “into” para sa εἰς ay hindi likas na leksikal na alternatibo sa Tagalog na “sa.”
