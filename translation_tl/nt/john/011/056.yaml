reference: John 11:56
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐζήτουν οὖν τὸν Ἰησοῦν καὶ ἔλεγον μετ’ ἀλλήλων ἐν τῷ ἱερῷ ἑστηκότες· Τί δοκεῖ ὑμῖν; ὅτι οὐ μὴ ἔλθῃ εἰς τὴν ἑορτήν;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/056.yaml
  text: So they were looking for Jesus and saying to one another as they stood in the temple courts[b][a], “What do you think? That he certainly will not come to the feast?”
translation:
  language: tl
  text: Kaya hinahanap nila si Jesus at, habang nakatayo sila sa mga bakuran ng templo,[a] sinasabi nila sa isa’t isa, “Ano sa palagay ninyo? Hinding-hindi kaya siya pupunta sa pista?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego na ἱερόν ay tumutukoy sa buong kompleks o mga bakuran ng templo, hindi lamang sa panloob na santuwaryo.
    reason: cultural_note
  - marker: b
    text: O “Talagang hindi siya pupunta sa pista?” Mariin ang pagtanggi sa Griyego (οὐ μή).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτουν
  choice: hinahanap nila
  rationale: Ipinahihiwatig ng imperfect ang nagpapatuloy na paghahanap; natural at malinaw sa modernong Tagalog ang “hinahanap nila.”
- source_word: οὖν
  choice: Kaya
  rationale: Nag-uugnay ito sa naunang salaysay bilang resulta o pagpapatuloy; likas sa Tagalog ang “Kaya.”
- source_word: ἔλεγον μετ’ ἀλλήλων
  choice: nag-uusap-usap sila
  rationale: Pinagsasama nito ang patuloy o paulit-ulit na pagsasalita at ang katumbasang diwa ng “sa isa’t isa” sa natural na Tagalog.
- source_word: ἐν τῷ ἱερῷ
  choice: sa mga looban ng templo
  rationale: Ang ἱερόν ay tumutukoy sa buong kompleks o mga bakuran ng templo, hindi lamang sa panloob na santuwaryo.
- source_word: ἑστηκότες
  choice: Habang nakatayo sila
  rationale: Ipinapahayag ang kanilang kalagayang nakatayo habang nag-uusap; pinananatili ang pangyayari nang hindi mabigat ang ayos.
- source_word: Τί δοκεῖ ὑμῖν;
  choice: Ano sa palagay ninyo?
  rationale: Karaniwang modernong Tagalog para sa paghingi ng opinyon.
- source_word: οὐ μὴ ἔλθῃ
  choice: Talagang hindi siya pupunta
  rationale: Ang οὐ μή na may aorist subjunctive ay mariing pagtanggi; naihahatid ng “talagang hindi” ang diin habang nananatiling natural.
- source_word: εἰς τὴν ἑορτήν
  choice: sa pista
  rationale: Sa konteksto, tumutukoy ang ἑορτή sa pistang Judio, partikular sa nalalapit na Paskuwa; maikli at madaling maunawaan ang “pista.”
theological_decisions:
- issue: Kung ang huling tanong ay nagpapahayag ng tiyak na palagay o humihingi ng pagsang-ayon
  choice: “Talagang hindi siya pupunta sa pista?”
  alternative: “Hindi kaya siya pupunta sa pista?”
  rationale: Pinananatili ng salin ang mariing negasyon ng οὐ μή at ang tunay na tensiyon ng tanong, sa halip na gawing mas mahina o hulaan ang inaasahang sagot.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “mga looban ng templo” upang malinaw na maiba ang ἱερόν sa panloob na santuwaryo, at pinanatili ang mariin ngunit bahagyang alanganing anyo ng huling tanong.
