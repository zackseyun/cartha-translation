  to: Kaya hinahanap nila si Jesus at, habang nakatayo sila sa mga bakuran ng templo,[a] sinasabi nila sa isa’t isa, “Ano sa palagay ninyo? Hinding-hindi kaya siya pupunta sa pista?”[b]
  rationale: Inihanay ang sugnay na “habang nakatayo sila” sa kanilang pagsasalita, ginawang “mga bakuran ng templo” ang katumbas ng ἱερόν, at ginamit ang “Hinding-hindi kaya” upang mapanatili kapwa ang mariing negasyon at ang anyong patanong ng Griyego. Walang idinagdag na interpretasyong teolohikal.
