  naturalness: Natural ang karamihan ng wika, ngunit mas malinaw at mas dumadaloy ang paglalagay ng “habang nakatayo sila” bago ang pandiwang pagsasalita. Ang “mga bakuran ng templo” ay mas karaniwang tawag sa temple precincts kaysa “mga looban ng templo.”
  terminology: Ang “mga bakuran ng templo” ay angkop para sa ἱερόν at malinaw na naiiba sa panloob na santuwaryo. Ang “pista” ay katanggap-tanggap para sa ἑορτή. Pinalitan ang “Talagang hindi” ng “Hinding-hindi” upang mas tuwirang maihatid ang emphatic negation nang natural sa tanong.
