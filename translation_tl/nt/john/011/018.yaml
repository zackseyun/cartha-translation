lexical_decisions:
- source_word: δὲ
  choice: Hindi tahasang isinalin
  rationale: Mahinang pang-ugnay ito na nagpapatuloy sa salaysay, hindi matinding pagsalungat. Natural sa Tagalog na ipahiwatig ang pagpapatuloy sa ayos ng pangungusap nang walang dagdag na “ngayon” o “ngunit.”
- source_word: ἡ Βηθανία
  choice: ang Betania
  rationale: Karaniwang makabagong anyong Tagalog ng pangalan ng lugar.
- source_word: ἐγγὺς τῶν Ἱεροσολύμων
  choice: Malapit sa Jerusalem
  rationale: Tuwirang ipinahahayag ang heograpikong kalapitan sa natural na Tagalog.
- source_word: ὡς
  choice: mga
  rationale: Sa pariralang panukat, nagpapahiwatig ito ng pagtatantiya; natural na katumbas sa Tagalog ang “mga.”
- source_word: ἀπὸ σταδίων δεκαπέντε
  choice: labinlimang estadio ang layo
  rationale: Pinananatili ang sinaunang yunit na nasa tekstong Griyego, habang malinaw na ipinahahayag ng “ang layo” ang ideya ng distansiya.
