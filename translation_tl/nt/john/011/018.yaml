translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “estadio” upang mapanatili ang sinaunang panukat ng pinagmulang teksto, at inilagay sa talababa ang halos katumbas nito sa makabagong yunit.
