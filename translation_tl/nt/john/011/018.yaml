  text: Bethany was near Jerusalem[a], about fifteen stadia away.
translation:
  language: tl
  text: Malapit sa Jerusalem ang Betania—mga labinlimang estadio[a] ang layo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mga tatlong kilometro.
