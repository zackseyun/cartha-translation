  text: λέγει αὐτῷ ⸀ἡ Μάρθα· Οἶδα ὅτι ἀναστήσεται ἐν τῇ ἀναστάσει ἐν τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/024.yaml
  text: Martha said to him[a], “I know that he will rise again in the resurrection on the last day.”
translation:
  language: tl
  text: Sinabi sa kanya ni Marta, “Alam kong babangon siyang muli sa pagkabuhay na muli sa huling araw.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: Sinabi
  rationale: Bagaman pangkasalukuyan ang anyong Griyego bilang historical present, likas sa makabagong salaysay sa Filipino ang pangnagdaang “sinabi.”
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Likas na katumbas ng panghalip na datibo na tumutukoy sa kinausap ni Marta.
- source_word: ἡ Μάρθα
  choice: ni Marta
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalan at ang panandang “ni” dahil siya ang simuno ng pandiwang “sinabi.”
- source_word: Οἶδα
  choice: Alam ko
  rationale: Tuwirang ipinahahayag ang tiyak na kaalaman o paniniwala ni Marta nang hindi dinaragdagan ang tindi nito.
- source_word: ἀναστήσεται
  choice: babangon siyang muli
  rationale: Pinananatili ang intransitibong pananaw ng pandiwang Griyego at malinaw na tumutukoy sa muling pagbangon mula sa kamatayan.
- source_word: ἐν τῇ ἀναστάσει
  choice: sa pagkabuhay na muli
  rationale: Ang “sa” ay likas na Filipino para sa ἐν at maaaring magpahiwatig ng panahon o saklaw ng pangkalahatang pagkabuhay na muli.
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: sa huling araw
  rationale: Karaniwan at malinaw na pariralang Filipino para sa tiyak na panahong eskatolohikal na tinutukoy ng Griyego.
theological_decisions:
- issue: Pagtukoy sa eskatolohikal na pagkabuhay na muli
  choice: “sa pagkabuhay na muli sa huling araw”
  alternative: Isang pangkalahatang pag-asa lamang sa buhay pagkamatay
  rationale: Ang magkaugnay na ἀναστήσεται at ἀνάστασις, kasama ng “huling araw,” ay tumutukoy sa inaasahang pagkabuhay na muli sa hinaharap, ngunit hindi nagdaragdag ang salin ng mga detalyeng doktrinal na wala sa talata.
- issue: Ugnayan ng dalawang pariralang may ἐν
  choice: Ang “sa huling araw” ay likas na binabasa bilang paglilinaw kung kailan ang pagkabuhay na muli.
  alternative: “babangon siyang muli sa pagkabuhay na muli, sa huling araw,” na maaaring magbigay ng bahagyang paghihiwalay sa dalawang parirala
  rationale: Pinananatili ng walang kuwit na anyo ang pinakamalapit at natural na ugnayan ng “pagkabuhay na muli” at “huling araw,” habang hindi nilulutas nang lampas sa gramatika ang saklaw ng ikalawang parirala.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit ng “muli” sa pandiwa at pangngalan dahil naroon din sa Griyego ang magkaugnay na pandiwa at pangngalan ng pagkabuhay na muli; mahalaga ito sa diin ng pahayag.
