base_translation:
  language: en
  yaml_path: translation/nt/john/011/012.yaml
  text: So the disciples said to him[a], “Lord, if he has fallen asleep[b], he will recover.”
translation:
  language: tl
  text: Kaya sinabi ng mga alagad sa kanya, “Panginoon, kung nakatulog na siya, gagaling siya.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “maliligtas siya.” Ngunit sa kontekstong ito, ang pandiwang Griyego ay tumutukoy sa paggaling mula sa karamdaman.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Ipinapakita ang hinuha ng mga alagad mula sa naunang sinabi ni Jesus, sa natural na modernong Tagalog.
- source_word: οἱ μαθηταὶ
  choice: ang mga alagad
  rationale: Tiyak ang tinutukoy dahil sa artikulo at malinaw na sa konteksto kung kaninong mga alagad sila.
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Pinananatili ang panghalip ng Griyego; malinaw sa konteksto na si Jesus ang tinutukoy.
- source_word: Κύριε
  choice: Panginoon
  rationale: Pinananatili ang karaniwang kahulugan at ang posibleng lalim ng pagtawag kay Jesus, nang hindi nililimitahan sa simpleng paggalang lamang.
- source_word: εἰ
  choice: kung
  rationale: Tuwirang nagpapahayag ng kondisyon batay sa literal na pagkaunawa ng mga alagad.
- source_word: κεκοίμηται
  choice: nakatulog siya
  rationale: Natural na tumutukoy sa ordinaryong pagtulog, gaya ng maling pagkaunawa ng mga alagad, habang umaangkop sa resultang kalagayang ipinahihiwatig ng perfect form.
- source_word: σωθήσεται
  choice: gagaling siya
  rationale: Sa konteksto ng karamdaman, ang σῴζω ay tumutukoy sa paggaling o pagbuti ng kalagayan, hindi tahasang sa espirituwal na kaligtasan.
theological_decisions:
- issue: Pagtutumbas sa κύριος bilang tuwirang tawag kay Jesus
  choice: Panginoon
  alternative: Ginoo; Maestro
  rationale: Ang “Panginoon” ay nagpapanatili kapuwa ng magalang na pagtawag at ng posibleng kristolohikal na bigat sa Ebanghelyo ni Juan nang hindi labis na nagpapaliwanag.
- issue: Dalawang posibleng diwa ng κεκοίμηται bilang pagtulog o kamatayan
  choice: Karaniwang pananalita para sa literal na pagtulog sa pangunahing teksto
  alternative: Isang mas malabong pananalita gaya ng “namahinga”
  rationale: Ang punto ng salaysay ay maling inakala ng mga alagad na ordinaryong pagtulog ang matalinghagang sinabi ni Jesus tungkol sa kamatayan ni Lazaro.
- issue: Saklaw ng kahulugan ng σωθήσεται
  choice: gagaling siya
  alternative: maliligtas siya; bubuti siya
  rationale: Ang konteksto ng sakit at pagtulog ang nagtatakda rito ng kahulugang paggaling, ngunit itinatala sa talababa ang mas literal at mas malawak na kahulugan ng pandiwa.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “nakatulog” upang malinaw na maipakita ang literal na pagkaunawa ng mga alagad, at “gagaling” upang maihatid ang kahulugan ng pandiwa sa konteksto ng karamdaman.
