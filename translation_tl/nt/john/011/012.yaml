  source_fidelity: 'Tumpak ang pangunahing diwa: ang οὖν ay naipahayag sa “Kaya,” ang αὐτῷ ay “sa kanya,” ang Κύριε ay “Panginoon,” at ang σωθήσεται ay wastong “gagaling” sa konteksto ng sakit. Gayunman, ang κεκοίμηται ay perfect form at mas mahusay na maipapakita bilang “nakatulog na,” na tumutugma sa “has fallen asleep/has gone to sleep” at sa kalagayang ipinahihiwatig nito.'
  naturalness: Natural at marangal ang Tagalog. Mas maayos ang ayos na “Sinabi nga ng mga alagad sa kanya” kaysa “Kaya sinabi sa kanya ng mga alagad,” dahil mas malinaw nitong pinananatili ang panghalip na tumutukoy kay Jesus at mas dumadaloy sa salaysay. Ang “Kung nakatulog na siya, gagaling siya” ay likas na modernong Filipino.
  terminology: 'Ang “mga alagad,” “Panginoon,” at “gagaling” ay angkop at magkakatugma sa terminolohiya. Kailangang iwasto ang talababa: ang “mas literal” ay hindi “maliligtas siya,” sapagkat maaari ring iyon ang leksikal na kahulugan ngunit hindi ito mas literal kaysa sa “gagaling”; mas tumpak na sabihing “maaari ring isalin na.” Dapat ding nakakabit ang talababa sa “gagaling siya,” ang salitang nililinaw nito.'
