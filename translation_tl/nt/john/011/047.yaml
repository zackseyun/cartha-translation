  to: Kaya nagtipon ng isang kapulungan ang mga punong pari at ang mga Pariseo, at kanilang sinasabi, “Ano ang ginagawa natin? Sapagkat gumagawa ng maraming tanda ang taong ito.”
  rationale: Inayos ang aspekto ng ἔλεγον mula sa simpleng nakaraang “sinabi nila” tungo sa imperfect na “kanilang sinasabi.” Ginawang “isang kapulungan” ang συνέδριον upang huwag gawing higit na tiyak ang pangunahing teksto kaysa sa Griyego; pinananatili ng talababa ang malamang na pagkakakilanlan nito bilang Sanhedrin. Walang binagong kahulugan sa tanong, sa sanhi, o sa Johannine na “mga tanda.”
