base_translation:
  language: en
  yaml_path: translation/nt/john/011/047.yaml
  text: So the chief priests and the Pharisees gathered a council and were saying[a], “What are we doing? For this man is doing many signs.”
translation:
  language: tl
  text: Kaya nagtipon ng isang kapulungan ang mga punong pari at ang mga Pariseo, at kanilang sinasabi, “Ano ang ginagawa natin? Sapagkat gumagawa ng maraming tanda ang taong ito.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνήγαγον
  choice: tinipon
  rationale: 'Pinananatili ang transitive na diwa ng aorist active: ang mga pinuno ang nagtipon o nagpulong sa kapulungan.'
- source_word: οὖν
  choice: Kaya
  rationale: Ipinahihiwatig ang bunga o lohikal na tugon sa naunang pangyayari nang natural sa makabagong Tagalog.
- source_word: ἀρχιερεῖς
  choice: mga punong pari
  rationale: Karaniwang tawag sa mga nangungunang awtoridad na pari, hindi pahiwatig na sabay-sabay na maraming may katungkulan bilang kataas-taasang pari.
- source_word: Φαρισαῖοι
  choice: mga Pariseo
  rationale: Itinatag na salin-baybay sa Tagalog para sa pangkat na Judio.
- source_word: συνέδριον
  choice: ang kapulungan
  rationale: Isinasalin ang institusyonal na konseho nang hindi agad ipinapalit ang teknikal na pangalang “Sanhedrin”; nililinaw sa talababa ang malamang na tinutukoy.
- source_word: ἔλεγον
  choice: sinabi nila
  rationale: Natural na salaysay sa Tagalog; ipinapahayag ang kanilang patuloy na pag-uusap bilang kolektibong sinabi nang hindi nagdaragdag ng ideyang paulit-ulit na wala namang tahasang pahayag.
- source_word: Τί ποιοῦμεν
  choice: Ano ang ginagawa natin?
  rationale: Pinananatili ang present indicative at ang tensiyon ng tanong, sa halip na tahasang gawing “Ano ang dapat nating gawin?”
- source_word: ὅτι
  choice: Sapagkat
  rationale: Malinaw na ipinakikilala ang dahilan ng kanilang nababahalang tanong.
- source_word: οὗτος ὁ ἄνθρωπος
  choice: ang taong ito
  rationale: Pinananatili ang tuwirang pagtukoy kay Jesus at ang bahagyang mapaglayong tono ng mga nagsasalita.
- source_word: πολλὰ ποιεῖ σημεῖα
  choice: gumagawa ng maraming tanda
  rationale: Pinananatili ang present-tense na gawain at ang mahalagang bokabularyong Johannine na “mga tanda,” sa halip na paliitin ito sa “mga himala.”
theological_decisions:
- issue: Pagpapakahulugan sa σημεῖα sa Ebanghelyo ni Juan
  choice: mga tanda
  alternative: mga himala; mga mahimalang tanda
  rationale: Sa Juan, ang mga gawa ni Jesus ay hindi lamang makapangyarihang himala kundi mga tandang naghahayag kung sino siya. Pinananatili ng “mga tanda” ang bigat at lawak na ito.
- issue: Pagpapakahulugan sa συνέδριον
  choice: ang kapulungan
  alternative: ang Sanhedrin; isang konseho
  rationale: Pinananatili sa pangunahing teksto ang karaniwang kahulugan ng salitang Griyego habang inilalagay sa talababa ang malamang na teknikal na pagkakakilanlan nito. Ang tiyak na pantukoy ay angkop sa kontekstong tumutukoy sa kinikilalang namumunong kapulungan.
- issue: Deliberatibong puwersa ng Τί ποιοῦμεν
  choice: Ano ang ginagawa natin?
  alternative: Ano ang dapat nating gawin?
  rationale: Pinananatili ang anyong indicative at ang tunay na posibilidad na sinusumbatan nila ang sarili dahil sa kanilang kawalan ng pagkilos, nang hindi isinasara ang deliberatibong diwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kapulungan” bilang madaling maunawaang salitang institusyonal, at sadyang pinanatili ang medyo matalim na “Ano ang ginagawa natin?” upang huwag lutasin ang ambiguwidad ng Griyego.
