  text: Ἦν δέ τις ἀσθενῶν, Λάζαρος ἀπὸ Βηθανίας ἐκ τῆς κώμης Μαρίας καὶ Μάρθας τῆς ἀδελφῆς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/001.yaml
  text: A certain man was sick[a], Lazarus from Bethany, from the village of Mary and her sister Martha.
translation:
  language: tl
  text: May isang lalaking may sakit, si Lazaro, na taga-Betania, mula sa nayon ni Maria at ng kapatid niyang si Marta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἦν δέ τις ἀσθενῶν
  choice: May isang lalaking maysakit
  rationale: Ginagawang natural na panimulang salaysay sa Tagalog ang eksistensiyal na pagkakabuo. Ang τις ay tumutukoy sa isang tiyak ngunit hindi pa naipakikilalang tao, at ang ἀσθενῶν dito ay nangangahulugang may sakit, hindi lamang mahina. Hindi nilagyan ng tahasang temporal na “Ngayon” ang banayad na pang-ugnay na δέ.
- source_word: Λάζαρος
  choice: Lazaro
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa Bibliyang Tagalog.
- source_word: ἀπὸ Βηθανίας
  choice: na taga-Betania
  rationale: Likas na ipinahahayag ng “taga-” sa Tagalog ang pinagmulan o kaugnayan sa isang lugar na tinutukoy ng ἀπό.
- source_word: ἐκ τῆς κώμης
  choice: mula sa nayon
  rationale: Pinananatili ng “mula sa” ang diwa ng pinagmulan sa ἐκ, at ang “nayon” ay angkop sa κώμη bilang maliit na pamayanan, hindi malaking lungsod.
- source_word: Μαρίας καὶ Μάρθας τῆς ἀδελφῆς αὐτῆς
  choice: ni Maria at ng kapatid niyang si Marta
  rationale: Malinaw at likas nitong ipinakikilala si Marta bilang kapatid ni Maria, gaya ng appositional na pariralang Griyego, habang iniuugnay ang dalawa sa nayon.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang iisang pangungusap at ang bahagyang pag-uulit ng pinagmulan sa Betania at sa nayon, yamang kapansin-pansin din ito sa Griyego.
