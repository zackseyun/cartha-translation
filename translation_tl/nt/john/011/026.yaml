  terminology: Ang “sumasampalataya sa akin” ay angkop para sa πιστεύων εἰς ἐμέ at pinananatili. Sa pangwakas na tanong, ang “naniniwala” ay natural na katumbas ng πιστεύεις kapag ang tuwirang paksa ay τοῦτο (“ito”). Ang “magpakailanman” ay angkop para sa εἰς τὸν αἰῶνα.
