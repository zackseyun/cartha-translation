  text: καὶ πᾶς ὁ ζῶν καὶ πιστεύων εἰς ἐμὲ οὐ μὴ ἀποθάνῃ εἰς τὸν αἰῶνα· πιστεύεις τοῦτο;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/026.yaml
  text: And everyone who lives and believes in me will certainly never die forever. Do you believe this?
translation:
  language: tl
  text: At ang bawat isa na nabubuhay at sumasampalataya sa akin ay tiyak na hindi mamamatay magpakailanman. Naniniwala ka ba rito?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὁ ζῶν
  choice: bawat nabubuhay
  rationale: Pinananatili ang pangkalahatang saklaw ng πᾶς at ang kasalukuyang diwa ng participle na ζῶν sa natural na Tagalog.
- source_word: πιστεύων εἰς ἐμέ
  choice: sumasampalataya sa akin
  rationale: Ang 'sumasampalataya sa' ay likas at teolohikong hindi labis na makitid na katumbas ng relasyonal na konstruksiyong πιστεύειν εἰς.
- source_word: οὐ μὴ ἀποθάνῃ
  choice: tiyak na hindi mamamatay
  rationale: Ipinahahayag ng 'tiyak na hindi' ang mariing pagtanggi ng οὐ μή nang hindi nagdaragdag ng paliwanag na wala sa teksto.
- source_word: εἰς τὸν αἰῶνα
  choice: magpakailanman
  rationale: Direktang inilalarawan ang idiomatikong temporal na kahulugang 'forever/ever,' habang iniiwan ang tensiyon sa literal na kamatayan sa konteksto.
- source_word: πιστεύεις τοῦτο;
  choice: Sumasampalataya ka ba rito?
  rationale: Pinananatili ang tuwirang personal na tanong at inuulit ang bokabularyo ng pananampalataya.
theological_decisions:
- issue: Ang pahayag na hindi mamamatay magpakailanman sa konteksto ng pisikal na kamatayan
  choice: tiyak na hindi mamamatay magpakailanman
  alternative: hindi kailanman mamamatay
  rationale: Pinananatili ang mariin ngunit sadyang tensiyonadong pananalita ni Jesus at ang tahasang εἰς τὸν αἰῶνα, sa halip na ipaliwanag ito bilang espirituwal na kamatayan o pansamantalang pisikal na kamatayan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang 'sumasampalataya' sa halip na mas kolokyal na 'naniniwala' upang maipakita ang relasyonal at patuloy na diwa ng πιστεύων, nang hindi nag-aangkat ng denominasyonal na pagpapakahulugan.
