  rationale: Inalis ang idinagdag na “pagkamatay” upang mapanatili ang saklaw ng περὶ τοῦ ἀδελφοῦ, at pinalitan ang “pumunta” ng “nakarating na” upang maipahiwatig ang naunang pagdating na nasa pluperfect. Inayos din ang alternatibong salin sa talababa upang maipakita ang partitibong ἐκ (“mula sa”).
