  text: ⸂πολλοὶ δὲ⸃ ἐκ τῶν Ἰουδαίων ἐληλύθεισαν πρὸς ⸀τὴν Μάρθαν καὶ ⸀Μαριὰμ ἵνα παραμυθήσωνται αὐτὰς περὶ τοῦ ⸀ἀδελφοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/019.yaml
  text: Many of the Jews had come to Martha and Mary to comfort them about their brother[a].
translation:
  language: tl
  text: Marami sa mga Judio ang nakarating na kina Marta at Maria upang aliwin sila dahil sa kanilang kapatid[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Marami mula sa mga taga-Judea ang nakarating kina Marta at Maria.” Ang salitang Griyego ay maaaring tumukoy sa mga Judio sa pangkalahatan o, sa ilang konteksto sa Juan, mas partikular sa mga taga-Judea.
    reason: alternative_reading
lexical_decisions:
- source_word: πολλοὶ δὲ
  choice: Marami
  rationale: Ang πολλοί ay “marami.” Banayad na pang-ugnay ang δέ; hindi na ito tahasang isinalin upang maging likas ang daloy at hindi magpahiwatig ng di-kinakailangang pagsalungat.
- source_word: ἐκ τῶν Ἰουδαίων
  choice: sa mga Judio
  rationale: 'Partitibo ang parirala: marami mula sa pangkat ng mga Ἰουδαῖοι. Sa kontekstong ito, tumutukoy ito sa mga taong Judio na dumalaw upang makiramay, hindi partikular sa mga pinuno.'
- source_word: ἐληλύθεισαν
  choice: ang pumunta
  rationale: Ang pluperfect ay nagsasaad na nakarating na sila bago ang tagpong isinasalaysay. Sa natural na Tagalog, sapat ang “pumunta” sa sugnay na ito; malinaw sa konteksto ang naunang kilos.
- source_word: πρὸς τὴν Μάρθαν καὶ Μαριὰμ
  choice: kina Marta at Maria
  rationale: Ipinapahayag ng πρός na pinuntahan nila ang dalawang babae. “Kina” ang likas na panandang Tagalog para sa pagpunta sa dalawa o higit pang taong pinangalanan.
- source_word: ἵνα παραμυθήσωνται αὐτὰς
  choice: upang aliwin sila
  rationale: Nagpapahayag ng layunin ang ἵνα kasama ng subjunctive. Ang παραμυθέομαι ay pag-aliw o pagdamay sa nagdadalamhati; malinaw at dignified ang “aliwin.”
- source_word: περὶ τοῦ ἀδελφοῦ
  choice: dahil sa pagkamatay ng kanilang kapatid
  rationale: Literal na “tungkol sa kanilang kapatid,” ngunit sa konteksto ng pagluluksa, ang dahilan ng pag-aliw ay ang pagkamatay niya. Nililinaw ito sa natural na Tagalog nang hindi binabago ang diwa.
theological_decisions:
- issue: Kahulugan ng Ἰουδαίων sa Ebanghelyo ni Juan
  choice: mga Judio
  alternative: mga taga-Judea
  rationale: Hindi polemikal ang talata kundi naglalarawan sa mga nakikiramay. Pinakamalamang dito ang malawak na kahulugang etniko-relihiyoso, ngunit tunay na posible sa paggamit ni Juan ang heograpikong “mga taga-Judea,” kaya inilagay ito sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na likas, malinaw, at marangal. Ginamit ang karaniwang mga pangalang “Marta” at “Maria” at iniwasan ang sobrang literal na ayos na magiging alanganin sa Tagalog.
