review_pass:
  verdict: revise
  source_fidelity: Ang “dahil sa pagkamatay ng kanilang kapatid” ay nagdaragdag ng tahasang impormasyong wala sa Griyego. Bagaman malinaw sa mas malawak na konteksto na namatay si Lazaro, ang περὶ τοῦ ἀδελφοῦ ay simpleng “tungkol sa/dahil sa kanilang kapatid,” kaya hindi dapat gawing eksplicit ang kamatayan sa talatang ito. Ang “nakarating na” ay mas angkop ding magpahiwatig ng pluperfect na ἐληλύθεισαν kaysa sa payak na “pumunta.”
  naturalness: Likas at marangal sa modernong Filipino ang “nakarating na kina Marta at Maria” at “upang aliwin sila dahil sa kanilang kapatid.” Hindi nito ipinipilit ang bahagyang alanganing literal na “tungkol sa kanilang kapatid,” ngunit pinananatili nito ang hindi-tahasang pagtukoy ng orihinal.
  terminology: Ang “mga Judio,” “Marta,” at “Maria” ay angkop. Napananatili ng talababa ang lehitimong alternatibong “mga taga-Judea” para sa Ἰουδαίων sa Juan.
  issues:
  - severity: medium
    issue: Idinagdag ang “pagkamatay” sa pangunahing teksto.
    rationale: Ang Griyegong περὶ τοῦ ἀδελφοῦ ay hindi nagsasabing “pagkamatay ng kanilang kapatid.” Ang impormasyon ay kontekstuwal ngunit hindi dapat ipasok bilang tahasang bahagi ng salin.
  - severity: low
    issue: Hindi malinaw na naipapahiwatig ang pluperfect sa “ang pumunta.”
    rationale: Ang ἐληλύθεισαν ay “nakarating na/had come.” Ang “nakarating na” ay natural na Filipino at mas malapit sa aspekto ng Griyego.
  revised_text: Marami sa mga Judio ang nakarating na kina Marta at Maria upang aliwin sila dahil sa kanilang kapatid[a].
  revised_footnotes:
  - marker: a
    text: O “Marami mula sa mga taga-Judea ang nakarating kina Marta at Maria.” Ang salitang Griyego ay maaaring tumukoy sa mga Judio sa pangkalahatan o, sa ilang konteksto sa Juan, mas partikular sa mga taga-Judea.
    reason: alternative_reading
