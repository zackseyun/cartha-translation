  text: τινὲς δὲ ἐξ αὐτῶν ἀπῆλθον πρὸς τοὺς Φαρισαίους καὶ εἶπαν αὐτοῖς ἃ ⸀ἐποίησεν Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/046.yaml
  text: But some of them went to the Pharisees and told them what Jesus had done[a].
translation:
  language: tl
  text: Ngunit ang ilan sa kanila ay pumunta sa mga Pariseo at sinabi sa kanila kung ano ang ginawa ni Jesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin na: “Iniulat nila sa kanila kung ano ang ginawa ni Jesus.” Hindi tahasang sinasabi ng Griyego kung ano ang layunin ng mga pumunta sa mga Pariseo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  choice: Ngunit ang ilan sa kanila
  rationale: Ipinapakita ng τινὲς ἐξ αὐτῶν na isang bahagi lamang ng naunang pangkat ang tinutukoy, at ipinahihiwatig ng δὲ ang kaibahan ng kanilang tugon sa tugon ng iba sa naunang talata.
- source_word: ἀπῆλθον πρὸς τοὺς Φαρισαίους
  choice: ay pumunta sa mga Pariseo
  rationale: Likas sa modernong Tagalog ang “pumunta sa” para sa paglapit nila sa mga Pariseo. Hindi na kailangang gawing “umalis at pumunta,” sapagkat sapat nang naipahihiwatig ng pandiwa at ng konteksto ang pag-alis nila sa pinangyarihan.
- source_word: εἶπαν αὐτοῖς
  choice: sinabi sa kanila
  rationale: Tuwirang katumbas ito na angkop sa salaysay at hindi nagdaragdag ng masamang layunin na hindi tahasang binanggit sa Griyego.
- source_word: ἃ ἐποίησεν Ἰησοῦς
  choice: ang ginawa ni Jesus
  rationale: Natural at maikli itong paglalahad ng maramihang panghalip na ἃ at ng aorist na ἐποίησεν, na tumutukoy sa natapos nang ginawa ni Jesus bago nila ito sinabi.
theological_decisions:
- issue: Layunin ng pagpunta at pagsasabi sa mga Pariseo
  choice: Gumamit ng neutral na “sinabi sa kanila”
  alternative: “isinumbong nila” o “ipinagkanulo nila”
  rationale: Sinasabi lamang ng talata na pumunta ang ilan sa mga Pariseo at sinabi ang ginawa ni Jesus. Maaaring magpahiwatig ang mas malawak na konteksto ng masamang bunga o layunin, ngunit hindi ito tahasang ipinapahayag ng mismong Griyegong pangungusap.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang payak na anyo ng salaysay at iniwasang ipakahulugan bilang pagsumbong o pagtataksil ang kilos ng mga tao.
