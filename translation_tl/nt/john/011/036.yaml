id: JHN.11.36
reference: John 11:36
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἔλεγον οὖν οἱ Ἰουδαῖοι· Ἴδε πῶς ἐφίλει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/036.yaml
  text: So the Jews were saying[a], “See how he loved him!”
translation:
  language: tl
  text: Kaya sinabi ng mga Judio[a], “Tingnan ninyo kung gaano niya kamahal si Lazaro!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga taga-Judea,” kung inuunawa itong mas tiyak na panrehiyong pagtukoy sa mga Judiong naroon at nakamasid.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγον
  choice: sinabi
  rationale: Bagaman imperpekto ang pandiwa at maaaring magpahiwatig ng patuloy o sama-samang pagsasalita, ang payak na “sinabi” ang likas na paraan sa Tagalog upang ipakilala ang tugon ng pangkat sa tagpong ito.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinapakita ang bunga o hinuha mula sa pag-iyak ni Jesus sa naunang talata, sa natural na makabagong Tagalog.
- source_word: οἱ Ἰουδαῖοι
  choice: mga Judio
  rationale: Pinananatili ang karaniwang katawagan sa Griyego; sa kontekstong ito, tumutukoy ito sa mga Judiong naroon at nakikiramay, hindi sa lahat ng Judio.
- source_word: Ἴδε
  choice: Tingnan ninyo
  rationale: Likas na pautos sa Tagalog na tumatawag sa pansin ng maraming kausap.
- source_word: πῶς
  choice: kung gaano
  rationale: Natural na ipinahahayag ang tindi ng pagmamahal sa konteksto, bagaman maaari ring taglayin ng Griyego ang diwa ng paraan.
- source_word: ἐφίλει
  choice: kamahal
  rationale: Ipinahahayag ang personal na pagmamahal o pagkagiliw nang hindi pinahihina ang damdamin sa tagpo.
- source_word: αὐτόν
  choice: si Lazaro
  rationale: Ginamit ang pangalan upang maging malinaw at natural sa Tagalog kung sino ang tinutukoy ng panlalaking panghalip; malinaw ang reperente mula sa konteksto.
theological_decisions:
- issue: Pagsasalin ng οἱ Ἰουδαῖοι sa Juan
  choice: mga Judio
  alternative: mga taga-Judea
  rationale: Ang “mga Judio” ang tuwirang katumbas at karaniwang katawagan, ngunit nililinaw ng talababa na ang tinutukoy rito ay ang mga Judiong naroon sa tagpo. Ang “mga taga-Judea” ay posibleng pagbasa ngunit mas panrehiyon at maaaring maging mas tiyak kaysa sa hinihingi ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Tingnan ninyo” para sa maramihang kausap at ang pangalan ni Lazaro upang maiwasan ang alanganing panghalip sa Tagalog.
