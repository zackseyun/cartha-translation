id: JHN.11.8
reference: John 11:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: λέγουσιν αὐτῷ οἱ μαθηταί· Ῥαββί, νῦν ἐζήτουν σε λιθάσαι οἱ Ἰουδαῖοι, καὶ πάλιν ὑπάγεις ἐκεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/008.yaml
  text: The disciples said to him[a], “Rabbi, just now the Jews were seeking to stone you, and are you going there again?”
translation:
  language: tl
  text: Sinabi ng mga alagad sa kanya, “Rabbi, ngayon-ngayon lang ay sinisikap kang batuhin ng mga Hudyo[a], at pupunta ka na naman doon?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga taga-Judea,” o ayon sa konteksto, “mga pinunong Hudyo.” Madalas gamitin ni Juan ang “mga Hudyo” para sa mga kalaban ni Jesus sa Judea, hindi para sa buong bayang Hudyo.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγουσιν
  choice: Sinabi
  rationale: Ang makasaysayang pangkasalukuyan sa salaysay na Griyego ay likas na isinasalin sa nagdaang panahunan sa modernong Tagalog.
- source_word: Ῥαββί
  choice: Rabbi
  rationale: Pinananatili ang transliteradong Semitikong titulo at paraan ng pagtawag ng mga alagad, sa halip na gawing simpleng “Guro.”
- source_word: νῦν
  choice: kamakailan lang
  rationale: Dito, tumutukoy ito sa pagiging bago o kasalukuyan pa ng banta, hindi lamang sa mismong sandaling iyon.
- source_word: ἐζήτουν
  choice: tinangka
  rationale: Ipinahihiwatig ng imperpektong anyo ang nagpapatuloy o tangkang kilos; likas sa Tagalog ang “tinangka” sa kontekstong ito.
- source_word: λιθάσαι
  choice: batuhin
  rationale: Tuwirang katumbas ito ng pagbato bilang paraan ng pagpatay; hindi idinagdag ang “hanggang mamatay” sapagkat hindi iyon tahasang nasa Griyego.
- source_word: οἱ Ἰουδαῖοι
  choice: mga Judio
  rationale: Ito ang tuwirang leksikal na salin. Maaaring mas makitid ang tinutukoy sa konteksto—mga taga-Judea o mga pinunong Judio—kaya inilagay ang paglilinaw sa talababa.
- source_word: πάλιν
  choice: na naman
  rationale: Natural na Tagalog para sa “again” sa isang tanong na nagpapahayag ng pagtataka o pagtutol.
- source_word: ὑπάγεις
  choice: pupunta ka
  rationale: Tumutukoy ito sa pagpunta sa lugar na kababanggit lamang, kaya malinaw at natural ang “pupunta ka.”
- source_word: ἐκεῖ
  choice: doon
  rationale: Payak na pang-abay na panlunan na tumutukoy pabalik sa Judea, ang lugar ng panganib.
theological_decisions:
- issue: Ang tinutukoy ng οἱ Ἰουδαῖοι sa Juan
  choice: mga Judio
  alternative: mga taga-Judea; o, ayon sa konteksto, mga pinunong Judio
  rationale: Pinananatili sa pangunahing teksto ang karaniwang leksikal na kahulugan nang hindi tahasang nililimitahan ang referent. Gayunman, dahil madalas gamitin ni Juan ang katawagan para sa mga kalaban ni Jesus sa Judea at hindi para sa buong bayang Judio, pinananatili sa talababa ang posibleng mas makitid na kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural sa karaniwang mambabasa. Pinanatili ang “Rabbi” bilang titulo at gumamit ng “tinangka kang batuhin” upang maipahayag nang maikli ang aspektong tangka ng ἐζήτουν nang hindi nagdaragdag ng hindi tahasang detalye.
