  text: ταῦτα εἶπεν, καὶ μετὰ τοῦτο λέγει αὐτοῖς· Λάζαρος ὁ φίλος ἡμῶν κεκοίμηται, ἀλλὰ πορεύομαι ἵνα ἐξυπνίσω αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/011.yaml
  text: After saying these things[a], he said to them, “Lazarus our friend has fallen asleep, but I am going so that I may wake him up.”
translation:
  language: tl
  text: Matapos niyang sabihin ang mga ito, sinabi niya sa kanila, “Nakatulog na[a] ang kaibigan nating si Lazaro, ngunit pupunta ako upang gisingin siya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, higit na tahasan, “namatay na.” Ginamit dito ni Jesus ang pagtulog bilang talinghaga para sa kamatayan; hindi muna ito naunawaan ng mga alagad sa mga sumunod na talata.
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα εἶπεν, καὶ μετὰ τοῦτο
  choice: Pagkasabi niya ng mga ito
  rationale: Ipinahihiwatig nito ang naunang natapos na pagsasalita at ang kasunod na pangyayari, habang pinananatili ang pangmaramihang tinutukoy ng ταῦτα sa natural na Tagalog.
- source_word: λέγει αὐτοῖς
  choice: sinabi niya sa kanila
  rationale: Isinalin ang historikal na pangkasalukuyan bilang pangnagdaan, na mas natural sa salaysay na Tagalog.
- source_word: Λάζαρος ὁ φίλος ἡμῶν
  choice: ang kaibigan nating si Lazaro
  rationale: Natural na ayos sa Tagalog na pinananatili ang magiliw at ugnayang diin ng ὁ φίλος ἡμῶν.
- source_word: κεκοίμηται
  choice: nakatulog na
  rationale: Pinananatili ang talinghaga ng pagtulog at ang aspektong nagpapakita ng kalagayang bunga ng naganap na pagkakatulog, sa halip na agad itong ipaliwanag bilang kamatayan.
- source_word: ἀλλὰ πορεύομαι
  choice: ngunit pupunta ako
  rationale: Pinananatili ang pagsalungat at ang kasalukuyan o nalalapit na sinasadyang pagpunta ni Jesus.
- source_word: ἵνα ἐξυπνίσω αὐτόν
  choice: upang gisingin siya
  rationale: Malinaw na ipinapahayag ang layunin at pinananatili ang larawang kaugnay ng pagtulog.
theological_decisions:
- issue: Kung tahasang isasalin ang κεκοίμηται bilang “namatay na” o pananatilihin ang talinghaga ng pagtulog
  choice: Pinanatili sa pangunahing teksto ang “nakatulog na.”
  alternative: “namatay na”
  rationale: Sinasadya ng pananalita ni Jesus ang talinghaga, at hindi muna ito nauunawaan ng mga alagad sa mga kasunod na talata. Ang pagpapanatili rito ay hindi maagang lumulutas sa tensiyon ng salaysay.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Pinili ang “Pagkasabi niya ng mga ito” upang mapanatili ang pangmaramihang αναφορά nang hindi nagiging mabigat, at inilagay ang talababa pagkatapos ng “Lazaro” sa dulo ng sugnay na naglalaman ng talinghaga.
