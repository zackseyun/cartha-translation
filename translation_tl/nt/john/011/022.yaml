  yaml_path: translation/nt/john/011/022.yaml
  text: But even now I know that whatever you ask from God, God will give you.
translation:
  language: tl
  text: Ngunit kahit ngayon, alam kong anuman ang hingin mo sa Diyos ay ibibigay sa iyo ng Diyos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ νῦν
  choice: Ngunit kahit ngayon
  rationale: Sa konteksto, ang καί ay nag-uugnay ngunit may pahiwatig ng pagsalungat o pagpapatuloy ng pag-asa matapos banggitin ni Marta ang pagkamatay ni Lazaro; pinananatili ng “kahit ngayon” ang temporal at konsesibong lakas ng parirala.
- source_word: οἶδα
  choice: alam kong
  rationale: Ang anyong perpekto ay may pangkasalukuyang diwa rito at likas na isinasalin sa Tagalog bilang “alam ko.” Ginamit ang pang-angkop na “-ng” upang maayos na ipakilala ang kasunod na sugnay.
- source_word: ὅσα ἂν
  choice: anuman ang
  rationale: Ipinahahayag ng panghalip na may ἄν ang di-tiyak at malawak na saklaw; natural itong tumbasan ng “anuman ang.”
- source_word: αἰτήσῃ τὸν θεὸν
  choice: hingin mo sa Diyos
  rationale: Bagaman tuwirang layon sa Griyego ang θεόν, ang “hingin mo sa Diyos” ang likas na idyomang Tagalog para sa paghiling sa Diyos nang hindi nagdaragdag ng bagay na hindi tahasang binanggit.
- source_word: δώσει σοι ὁ θεός
  choice: ibibigay sa iyo ng Diyos
  rationale: Tuwirang pinananatili nito ang pandiwang “magbigay,” ang tatanggap na “sa iyo,” at ang tahasang simuno na “ang Diyos,” ayon sa natural na ayos ng pangungusap sa Tagalog.
theological_decisions:
- issue: Maaaring basahin nang labis ang sinabi ni Marta tungkol sa paghingi ni Jesus sa Diyos bilang pagtanggi sa pagka-Diyos ni Jesus.
  choice: 'Pinanatili ang payak na pananalita ni Marta: “anuman ang hingin mo sa Diyos ay ibibigay sa iyo ng Diyos.”'
  alternative: Palitan ang “Diyos” ng “Ama,” o baguhin ang pangungusap upang alisin ang waring pagpapailalim ni Jesus.
  rationale: Iniulat ng talata ang mismong pananalita ni Marta. Hindi dapat dagdagan ng salin ang “Ama” na wala sa teksto, ni pakinisin ang tensiyong naratibo at teolohikal na sadyang nananatili sa Ebanghelyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit ng “Diyos” sa halip na gumamit ng panghalip, sapagkat dalawang ulit ding tahasang lumilitaw ang θεός sa Griyego.
