  text: ἐὰν ἀφῶμεν αὐτὸν οὕτως, πάντες πιστεύσουσιν εἰς αὐτόν, καὶ ἐλεύσονται οἱ Ῥωμαῖοι καὶ ἀροῦσιν ἡμῶν καὶ τὸν τόπον καὶ τὸ ἔθνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/048.yaml
  text: If we let him go on like this[a], everyone will believe in him[b], and the Romans will come and take away both our place and our nation.
translation:
  language: tl
  text: “Kung hahayaan natin siyang magpatuloy nang ganito, mananampalataya sa kanya ang lahat, at darating ang mga Romano at kukunin nila kapuwa ang ating lugar[a] at ang ating bansa[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ating templo.” Ang salitang Griyego ay “lugar,” na maaaring tumukoy sa templo o, sa mas malawak na diwa, sa ating kinalalagyan o katayuan.
    reason: alternative_reading
  - marker: b
    text: O “ating sambayanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφῶμεν αὐτὸν οὕτως
  choice: pababayaan natin siyang magpatuloy nang ganito
  rationale: Ang ἀφίημι ay may diwang pahintulutan o pabayaan, at ipinahihiwatig ng οὕτως ang pagpapatuloy ng kasalukuyang ginagawa niya. Likas sa modernong Tagalog ang kabuuang parirala nang hindi dinaragdagan ang kahulugan.
- source_word: πάντες
  choice: ang lahat
  rationale: Ipinahahayag nito ang pangkalahatan at malawak na saklaw ng πάντες.
- source_word: πιστεύσουσιν εἰς αὐτόν
  choice: maniniwala sa kanya
  rationale: Karaniwang gamit sa Juan ang πιστεύω εἰς para sa paniniwala o pagtitiwala sa isang tao; ang “maniniwala sa kanya” ang tuwiran at likas na salin.
- source_word: ἐλεύσονται οἱ Ῥωμαῖοι
  choice: darating ang mga Romano
  rationale: Tuwirang inililipat ang pandiwang panghinaharap at ang hayag na simuno.
- source_word: ἀροῦσιν
  choice: kukunin nila
  rationale: Ang αἴρω rito ay nangangahulugang kunin o alisin. Pinananatili ng “kukunin” ang batayang diwa nang hindi tahasang pinatitindi tungo sa “wawasakin.”
- source_word: τόπον
  choice: lugar
  rationale: Ang τόπος ay literal na “lugar.” Maaaring tumukoy ito sa templo o, sa mas malawak na pakahulugan, sa kanilang kinalalagyan o katayuan; pinananatili ng “lugar” ang pangunahing kalabuan.
- source_word: ἔθνος
  choice: bansa
  rationale: Maaaring mangahulugan ang ἔθνος ng bansa o sambayanan. Ang “bansa” ay angkop sa pampolitikang pangambang ipinahahayag, habang inilalagay sa talababa ang alternatibong “sambayanan.”
- source_word: ἡμῶν ... καὶ τὸν τόπον καὶ τὸ ἔθνος
  choice: kapuwa ang ating lugar at ang ating bansa
  rationale: Ipinakikita ng “kapuwa ... at” na parehong saklaw ng ἡμῶν ang dalawang layon at likas itong pakinggan sa Tagalog.
theological_decisions:
- issue: Tinutukoy ng τόπον (“ating lugar”)
  choice: Pinanatiling “lugar” sa pangunahing teksto
  alternative: templo; kinalalagyan o katayuan
  rationale: Posibleng kinatatakutan ng mga nagsasalita ang gagawin ng Roma sa templo, sa kanilang pampolitika o panrelihiyong katayuan, o sa dalawang ito. Hindi nililinaw ng salitang Griyego ang tiyak na tinutukoy, kaya hindi ito nilutas sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang karaniwang “mga Romano,” “maniniwala sa kanya,” at “bansa,” habang pinanatili sa mga talababa ang tunay na kalabuan ng τόπος at ἔθνος.
