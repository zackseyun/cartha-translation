id: JHN.19.9
reference: John 19:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ εἰσῆλθεν εἰς τὸ πραιτώριον πάλιν καὶ λέγει τῷ Ἰησοῦ· Πόθεν εἶ σύ; ὁ δὲ Ἰησοῦς ἀπόκρισιν οὐκ ἔδωκεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/009.yaml
  text: And he entered the governor’s headquarters again and said to Jesus[a], “Where are you from?” But Jesus gave him no answer.
translation:
  language: tl
  text: Muli siyang pumasok sa himpilan ng gobernador[a] at sinabi kay Jesus, “Saan ka nagmula?” Ngunit hindi siya sinagot ni Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pretorio,” ang opisyal na tirahan o punong himpilan ng Romanong gobernador.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: pumasok
  rationale: Tuwirang ipinapahayag ang paggalaw papasok sa isang lugar at natural sa makabagong Tagalog.
- source_word: πραιτώριον
  choice: himpilan ng gobernador
  rationale: Ipinakikilala ang lugar ayon sa tungkulin nito bilang opisyal na tirahan o punong himpilan ng Romanong gobernador, nang hindi umasa sa di-pamilyar na salitang hiram na “pretorio.”
- source_word: πάλιν
  choice: muli
  rationale: Malinaw na ipinahihiwatig ang pag-uulit ng pagkilos.
- source_word: λέγει
  choice: sinabi
  rationale: Bagaman pangkasalukuyan ang anyong Griyego bilang historical present, ang pangnagdaan ay mas natural sa salaysay na Tagalog.
- source_word: Πόθεν εἶ σύ
  choice: Saan ka nagmula?
  rationale: Pinananatili nito ang tanong tungkol sa pinagmulan, na maaaring tumukoy hindi lamang sa tinitirhang lugar kundi sa mas malawak na pinagmulan ni Jesus.
- source_word: ἀπόκρισιν οὐκ ἔδωκεν αὐτῷ
  choice: hindi siya sinagot ni Jesus
  rationale: Natural na idyomang Tagalog ito para sa literal na “hindi siya binigyan ng sagot,” at hindi binabago ang diwa ng ganap na pananahimik ni Jesus.
theological_decisions:
- issue: Tinutukoy ng di-hayag na simuno ng εἰσῆλθεν at λέγει
  choice: siya, na ayon sa konteksto ay si Pilato
  alternative: Tahasan itong gawing “Si Pilato” sa pangunahing teksto
  rationale: Hindi pinapangalanan ng talata ang simuno, ngunit malinaw sa naunang konteksto na si Pilato iyon. Pinananatili ng “siya” ang anyo ng pinagmulan nang hindi lumilikha ng kalabuan sa konteksto.
- issue: Saklaw ng tanong na Πόθεν εἶ σύ
  choice: Saan ka nagmula?
  alternative: Taga-saan ka?
  rationale: Ang napiling salin ay natural ngunit pinananatiling bukas kung ang tanong ay tungkol lamang sa heograpikong pinanggalingan o sa mas malalim na pinagmulan ni Jesus.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Inilagay ang [a] kasunod ng “himpilan ng gobernador,” ang salitang tinutukoy ng talababa.
