  text: ἐγένετο γὰρ ταῦτα ἵνα ἡ γραφὴ πληρωθῇ· Ὀστοῦν οὐ συντριβήσεται ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/036.yaml
  text: 'For these things happened so that the Scripture might be fulfilled: “Not one of his bones will be broken.”[a]'
translation:
  language: tl
  text: 'Sapagkat nangyari ang mga ito upang matupad ang Kasulatan: “Wala ni isa man sa kanyang mga buto ang babaliin.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Griyego: “Hindi babaliin ang isang buto niya.” Ang isahang “buto” ay ginamit dito sa kolektibong diwa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: nangyari
  rationale: Likas at makabagong salin para sa pangyayaring katatapos lamang isalaysay.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na kaugnayan nito sa naunang pahayag.
- source_word: ταῦτα
  choice: ang mga ito
  rationale: Tumutukoy sa maramihang pangyayaring naunang isinalaysay nang hindi nagdaragdag ng paliwanag.
- source_word: ἵνα
  choice: upang
  rationale: Malinaw na ipinahahayag ang layunin o kinalabasang nakaugnay sa katuparan.
- source_word: ἡ γραφή
  choice: ang Kasulatan
  rationale: Karaniwang katawagan sa banal na Kasulatan at angkop sa isahang Griyego.
- source_word: πληρωθῇ
  choice: matupad
  rationale: Likas na katumbas sa Filipino ng pasibong katuparan ng isang pahayag sa Kasulatan.
- source_word: Ὀστοῦν
  choice: ni isa man sa kanyang mga buto
  rationale: Bagaman isahan ang Griyego, kolektibo ang diwa; ang pariralang ito ay natural sa Filipino at hindi nagdaragdag sa kahulugan.
- source_word: οὐ συντριβήσεται
  choice: ang babaliin
  rationale: Sa konteksto ng buto, ang pasibong 'babaliin' ang malinaw at tumpak na kahulugan.
- source_word: αὐτοῦ
  choice: kanyang
  rationale: Likas na anyong paari sa Filipino para sa Griyegong henitibong panghalip.
theological_decisions:
- issue: Paglalahad sa likas na Filipino ng sipi sa Kasulatan habang pinananatili ang alusyon sa Exodo 12:46, Bilang 9:12, at Awit 34:20
  choice: Wala ni isa man sa kanyang mga buto ang babaliin
  alternative: Hindi babaliin ang isang buto niya
  rationale: Isahan ang 'buto' sa Griyego ngunit kolektibo ang gamit. Ang piniling anyo ay malinaw at natural sa Filipino, pinananatili ang ganap na pagkakait at ang motif ng katuparan, at hindi tinutukoy nang higit sa teksto kung aling partikular na sipi ang pangunahing tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Sapagkat” upang mapanatili ang paliwanag na ugnayan sa naunang talata, at ang sipi ay isinalin sa likas na ayos ng Filipino nang hindi inaalis ang pahiwatig nito sa mga teksto ng Lumang Tipan.
