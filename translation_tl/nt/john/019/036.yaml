  source_fidelity: Tumpak ang salin sa SBLGNT. Ang “Sapagkat nangyari ang mga ito” ay maayos na tumutugon sa ἐγένετο γὰρ ταῦτα, at ang “upang matupad ang Kasulatan” ay pinananatili ang ἵνα at ang pasibong πληρωθῇ. Ang siping “Wala ni isa man sa kanyang mga buto ang babaliin” ay idiomatikong Filipino para sa kolektibong bisa ng isahang Ὀστοῦν, nang hindi binabago ang saklaw ng pagkakait o ang hinaharap na tinig-pasibo ng συντριβήσεται.
  naturalness: Likas, malinaw, at marangal ang modernong Filipino. Ang ayos ng pangunahing pangungusap at ng sipi ay madaling basahin. Ang “ni isa man” ay angkop na pagpapalakas ng ganap na pagkakait at hindi lumalampas sa kahulugan ng Griyego.
  terminology: Ang “Kasulatan” ay wastong katumbas ng ἡ γραφή sa kontekstong ito. Ang “mga buto” sa mismong salin ay natural na kolektibong paglalahad, at malinaw na ipinapaliwanag ng talababa na isahan ang anyo sa Griyego. Wasto ang “babaliin” para sa συντριβήσεται sa konteksto ng mga buto.
