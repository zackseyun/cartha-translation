  text: ἦλθον οὖν οἱ στρατιῶται, καὶ τοῦ μὲν πρώτου κατέαξαν τὰ σκέλη καὶ τοῦ ἄλλου τοῦ συσταυρωθέντος αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/032.yaml
  text: So the soldiers came and broke the legs of the first man[b][a], and of the other who had been crucified with him.
translation:
  language: tl
  text: Kaya dumating ang mga sundalo at binali ang mga binti ng una at ng isa pa na ipinako sa krus na kasama niya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “niya” ay pinakamalamang na tumutukoy kay Jesus.
    reason: referent_clarification
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Ipinakikita ang bunga at pagpapatuloy ng salaysay mula sa kahilingan sa naunang talata; natural ito sa makabagong Tagalog.
- source_word: οἱ στρατιῶται
  choice: ang mga sundalo
  rationale: Karaniwan at malinaw na tawag sa mga tauhang militar na Romano sa konteksto.
- source_word: τοῦ μὲν πρώτου
  choice: ng una
  rationale: Tumutukoy sa una sa dalawang lalaking ipinako sa tabi ni Jesus. Hindi na kailangang idagdag ang “lalaki” dahil malinaw ang tinutukoy sa konteksto at natural sa Tagalog ang substantibong “una.”
- source_word: κατέαξαν τὰ σκέλη
  choice: binali ang mga binti
  rationale: Tuwirang ipinahahayag ang sinadyang pagbasag sa mga binti; ang “binali” ang natural na pandiwang Tagalog sa kontekstong ito.
- source_word: τοῦ ἄλλου
  choice: ng isa pa
  rationale: Tumutukoy sa ikalawa sa dalawang kasamang ipinako; natural at matipid itong katumbas ng Griyegong “the other.”
- source_word: τοῦ συσταυρωθέντος αὐτῷ
  choice: na ipinakong kasama niya
  rationale: Pinananatili ang panuring na tumutukoy sa taong ipinako kasama ng pangunahing tauhan sa tagpo, pati ang panghalip ng Griyego, nang hindi ginagawang tahasang pangngalan ang referent.
theological_decisions:
- issue: Tinutukoy ng αὐτῷ (“niya”)
  choice: Sa konteksto, si Jesus ang pinakamalamang na tinutukoy.
  alternative: Maaaring ipakahulugang ang unang lalaki ang pinakamalapit na pinagbabalikan ng panghalip.
  rationale: Sa salaysay ni Juan, ang dalawang iba pa ay inilalarawan kaugnay ni Jesus bilang sentrong tauhan ng pagpapako. Gayunman, pinanatili sa teksto ang panghalip at nilinaw sa talababa ang referent sa halip na tahasang ipalit ang pangalang “Jesus.”
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang maikling paralelismo ng Griyego at iniwasan ang di-kailangang pag-uulit ng “mga binti.”
