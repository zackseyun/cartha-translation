id: JHN.19.38
reference: John 19:38
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Μετὰ ⸀δὲ ταῦτα ἠρώτησεν τὸν Πιλᾶτον Ἰωσὴφ ⸀ἀπὸ Ἁριμαθαίας, ὢν μαθητὴς τοῦ Ἰησοῦ κεκρυμμένος δὲ διὰ τὸν φόβον τῶν Ἰουδαίων, ἵνα ἄρῃ τὸ σῶμα τοῦ Ἰησοῦ· καὶ ἐπέτρεψεν ὁ Πιλᾶτος. ἦλθεν οὖν καὶ ἦρεν τὸ σῶμα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/038.yaml
  text: After these things[a], Joseph from Arimathea, being a disciple of Jesus but having kept it hidden because of fear of the Jews, asked Pilate that he might take away the body of Jesus. And Pilate gave permission. So he came and took away his body.
translation:
  language: tl
  text: Pagkatapos ng mga pangyayaring ito, si Jose na taga-Arimatea—na isang alagad ni Jesus ngunit inilihim niya ito dahil sa takot sa mga Judio[a]—ay humingi kay Pilato ng pahintulot na kunin ang katawan ni Jesus. Pinahintulutan siya ni Pilato. Kaya pumunta siya at kinuha ang katawan ni Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas tiyak sa kontekstong ito, “mga awtoridad na Judio.” Madalas gamitin ni Juan ang “mga Judio” para sa mga sumasalungat kay Jesus, hindi para sa lahat ng Judio nang walang pagtatangi.
    reason: Nililinaw ang posibleng kontekstuwal na referent ng Ἰουδαῖοι at iniiwasan ang maling pagbasa na tumutukoy ito sa buong pangkat etniko.
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: Pagkatapos ng mga pangyayaring ito
  rationale: Pinananatili ang maramihang ταῦτα at ang pagkakasunod-sunod ng salaysay, habang ginagamit ang likas na pariralang Tagalog.
- source_word: ἠρώτησεν τὸν Πιλᾶτον ... ἵνα ἄρῃ
  choice: humingi kay Pilato ng pahintulot na kunin
  rationale: Sa konteksto, ang ἐρωτάω ay paghiling at ang ἵνα-clause ang nilalaman o layunin ng kahilingan. Malinaw at natural ito sa modernong Tagalog.
- source_word: Ἰωσὴφ ἀπὸ Ἁριμαθαίας
  choice: si Jose na taga-Arimatea
  rationale: Ang “taga-Arimatea” ay likas na paraan sa Tagalog upang ipahayag ang pinagmulan na tinutukoy ng ἀπό.
- source_word: ὢν μαθητὴς τοῦ Ἰησοῦ
  choice: na isang alagad ni Jesus
  rationale: Ang “alagad” ang karaniwan at marangal na salin ng μαθητής; ang sugnay na may “na” ay natural na kumakatawan sa participle.
- source_word: κεκρυμμένος δὲ
  choice: ngunit inilihim niya ito
  rationale: Ang nakatagong bagay ay ang pagiging alagad niya. Ginagawang malinaw ang ipinahihiwatig na layon nang hindi binabago ang diwa ng perfect passive participle.
- source_word: διὰ τὸν φόβον τῶν Ἰουδαίων
  choice: dahil sa takot sa mga Judio
  rationale: Malapit ito sa anyo ng Griyego at hindi tahimik na nililimitahan ang komplikadong katawagang Ἰουδαῖοι sa mga pinuno lamang.
- source_word: τὸ σῶμα τοῦ Ἰησοῦ
  choice: ang katawan ni Jesus
  rationale: Direkta, malinaw, at natural na salin ng genitive construction.
- source_word: ἐπέτρεψεν ὁ Πιλᾶτος
  choice: Pinahintulutan siya ni Pilato
  rationale: Ipinahahayag nang malinaw ang pagbibigay ng pahintulot; ang “siya” ay likas na ipinahihiwatig na layon sa konteksto.
- source_word: ἦλθεν οὖν καὶ ἦρεν
  choice: Kaya pumunta siya at kinuha
  rationale: Ang “kaya” ay kumakatawan sa οὖν, at ang “kinuha” ay nagpapanatili ng leksikal na ugnayan sa naunang ἄρῃ.
- source_word: τὸ σῶμα αὐτοῦ
  choice: ang katawan ni Jesus
  rationale: Nililinaw ang referent ng αὐτοῦ sa Tagalog, kung saan ang “kaniyang katawan” ay maaaring sa unang basa ay ipalagay na katawan ni Jose.
theological_decisions:
- issue: Ang referent ng τῶν Ἰουδαίων sa Ebanghelyo ni Juan
  choice: mga Judio sa pangunahing teksto, na may paliwanag sa talababa
  alternative: mga pinunong Judio; mga taga-Judea
  rationale: Ang Griyego ay may pangkalahatang katawagang Ἰουδαῖοι. Pinananatili ng pangunahing teksto ang tunay na lawak at tensiyon ng salita, samantalang nililinaw ng talababa na sa kontekstong ito ay malamang na tumutukoy ito sa mga awtoridad o mga Judiong sumasalungat kay Jesus, hindi sa buong lahing Judio.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “taga-Arimatea,” “alagad,” at “humingi ng pahintulot” bilang mga likas na pahayag sa kasalukuyang Tagalog. Ang mga gitling na em dash ay naghihiwalay sa paglalarawan kay Jose upang madaling masundan ang pangunahing pangungusap.
