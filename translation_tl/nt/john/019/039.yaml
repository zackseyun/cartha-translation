  source_fidelity: 'Tumpak ang pangunahing nilalaman: idinagdag si Nicodemo sa mga dumating, malinaw ang alusyon sa nauna niyang pagpunta kay Jesus sa gabi, at napanatili ang tinatayang dami at sinaunang yunit. Gayunman, mas eksaktong maipahahayag ang ὡς sa pamamagitan ng “humigit-kumulang isandaang,” hindi “humigit-kumulang sa isandaang.”'
  naturalness: Bahagyang hindi natural ang magkakasunod na “na” sa kasalukuyang pangungusap, at ang “mga aloe” ay mas madaling maunawaang mga buhay na halaman. Mas maayos ang “aloe” bilang pangmaramihang/mass na pangalan ng mabangong sangkap sa kontekstong ito.
  terminology: Ang “Nicodemo,” “mira,” at “litra” ay angkop. Pinanatili ang “aloe,” ngunit nilinaw sa talababa na ito ay mabangong sangkap para sa paghahanda ng bangkay, hindi karaniwang halamang aloe vera.
  issues:
