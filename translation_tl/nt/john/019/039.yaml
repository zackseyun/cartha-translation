revisions:
- from: Dumating din si Nicodemo—ang dating pumunta kay Jesus nang gabi[a]—na may dalang pinaghalong mira at mga aloe, na humigit-kumulang sa isandaang litra.[b]
  to: Dumating din si Nicodemo—ang dating pumunta kay Jesus nang gabi[a]—at may dala siyang pinaghalong mira at aloe, na humigit-kumulang isandaang litra.[b]
  rationale: 'Inayos ang daloy ng pangungusap nang hindi binabago ang attendant circumstance ng φέρων: si Nicodemo ay dumating at may dala siyang halo ng mira at aloe. Pinanatili ng “dating pumunta” ang panandang temporal ng τὸ πρῶτον nang hindi labis na ipinipilit kung ang diin ay “noon/nauna” o “sa unang pagkakataon.” Inayos ang pagtatantiya ng timbang at nilinaw ang terminong “aloe” sa talababa.'
