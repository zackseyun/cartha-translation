    issue: Medyo mabigat ang estrukturang “—ang dating pumunta ...—na may dalang.”
    rationale: Bagaman nauunawaan, mas likas sa modernong Tagalog ang magpatuloy sa isang malayang sugnay matapos ang appositive na pagpapakilala.
  - severity: low
    issue: “Mga aloe” ay maaaring magpahiwatig ng maraming halamang aloe.
    rationale: Ang ἀλόης sa kontekstong ito ay isang mabangong materyal na ginagamit sa paghahanda sa libing; mas natural ang mass noun na “aloe,” na may paglilinaw sa talababa.
  - severity: low
    issue: Ang “humigit-kumulang sa isandaang” ay hindi gaanong idiomatiko.
    rationale: Mas tuwiran at natural ang “humigit-kumulang isandaang litra.”
