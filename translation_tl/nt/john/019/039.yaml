  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἦλθεν δὲ καὶ Νικόδημος, ὁ ἐλθὼν πρὸς ⸀αὐτὸν νυκτὸς τὸ πρῶτον, φέρων ⸀μίγμα σμύρνης καὶ ἀλόης ὡς λίτρας ἑκατόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/039.yaml
  text: Nicodemus also came—the one who had first come to him at night—bringing a mixture of myrrh and aloes[b][a], about a hundred litras.
translation:
  language: tl
  text: Dumating din si Nicodemo—ang dating pumunta kay Jesus nang gabi[a]—at may dala siyang pinaghalong mira at aloe, na humigit-kumulang isandaang litra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang unang pumunta kay Jesus nang gabi,” na nagpapaalala sa Juan 3:1–2.
    reason: cross_reference
  - marker: b
    text: Ang litra ay isang librang Romano, na humigit-kumulang 327 gramo. Ang isandaang litra ay mga 32–33 kilo. Ang “aloe” rito ay mabangong sangkap na ginagamit sa paghahanda ng bangkay, hindi ang karaniwang halamang aloe vera.
    reason: cultural_note
lexical_decisions:
- source_word: ἦλθεν δὲ καὶ
  choice: Dumating din
  rationale: Banayad na pang-ugnay ang δέ, samantalang idinaragdag ng καί si Nicodemo sa mga kasangkot sa paglilibing. Likas sa modernong Tagalog ang “Dumating din.”
- source_word: Νικόδημος
  choice: Nicodemo
  rationale: Ginamit ang karaniwang anyong Tagalog ng pangalang Nicodemus.
- source_word: ὁ ἐλθὼν πρὸς αὐτὸν νυκτὸς τὸ πρῶτον
  choice: ang dating pumunta kay Jesus nang gabi
  rationale: Ang pariralang may artikulo at participle ay nagpapakilala kay Nicodemo sa pamamagitan ng nauna niyang pagdalaw sa Juan 3. Ang τὸ πρῶτον ay likas na naipapahayag bilang “dating,” at ang νυκτός bilang “nang gabi.” Nilinaw bilang “kay Jesus” ang reperente ng αὐτόν upang maging natural at malinaw sa Tagalog.
- source_word: φέρων
  choice: na may dalang
  rationale: Inilalarawan ng present participle ang kasabay na kalagayan ng pagdating ni Nicodemo. Natural sa Tagalog ang “na may dalang.”
- source_word: μίγμα σμύρνης καὶ ἀλόης
  choice: pinaghalong mira at mga aloe
  rationale: Tuwirang ipinapahayag ng “pinaghalong” ang μίγμα. Ang mira ay kinikilalang mabangong sangkap, at ang “mga aloe” rito ay mabangong sangkap na ginagamit sa paghahanda ng bangkay, hindi ang karaniwang halamang aloe vera.
- source_word: ὡς
  choice: humigit-kumulang sa
  rationale: Kapag kasama ng bilang, nagsasaad ang ὡς ng pagtatantiya; malinaw at natural sa Tagalog ang “humigit-kumulang sa.”
- source_word: λίτρας ἑκατόν
  choice: isandaang litra
  rationale: Pinanatili ang sinaunang yunit na litra upang hindi ito mapagkamalang eksaktong katumbas ng modernong libra; ipinaliliwanag sa talababa ang tinatayang timbang.
theological_decisions:
- issue: Reperente ng αὐτόν sa pariralang nagpapakilala kay Nicodemo
  choice: kay Jesus
  alternative: sa kanya
  rationale: Malinaw sa konteksto ng salaysay na tumutukoy ito kay Jesus at ipinapaalala ang Juan 3:1–2. Ang tahasang pangalan ay mas natural sa Tagalog at umiiwas sa malabong panghalip nang walang idinaragdag na doktrina.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Pinanatili ang sinaunang yunit at ipinaliwanag ito sa talababa; iniwasan ang sobrang teknikal o denominasyonal na pananalita.
