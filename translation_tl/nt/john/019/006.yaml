  to: Kaya nang makita siya ng mga punong pari at ng mga tauhan, sumigaw sila, “Ipako siya sa krus! Ipako siya sa krus!” Sinabi sa kanila ni Pilato, “Kunin ninyo siya at kayo mismo ang ipako siya sa krus,[a] sapagkat wala akong makitang batayan para paratangan siya.”[b]
  rationale: Pinalitan lamang ang “magpako sa kanya sa krus” ng mas idiomatikong “ipako siya sa krus.” Napanatili ang pag-uulit ng sigaw, ang diin ng “kayo mismo,” ang legal na puwersa ng αἰτία, at ang wastong pagkakaugnay ng mga panandang talababa sa kanilang tinutukoy.
