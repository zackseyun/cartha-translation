id: JHN.19.6
reference: John 19:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτε οὖν εἶδον αὐτὸν οἱ ἀρχιερεῖς καὶ οἱ ὑπηρέται ἐκραύγασαν λέγοντες· Σταύρωσον ⸀σταύρωσον. λέγει αὐτοῖς ὁ Πιλᾶτος· Λάβετε αὐτὸν ὑμεῖς καὶ σταυρώσατε, ἐγὼ γὰρ οὐχ εὑρίσκω ἐν αὐτῷ αἰτίαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/006.yaml
  text: So when the chief priests and the officers saw him[a], they cried out, saying, “Crucify him! Crucify him!” Pilate said to them, “You take him and crucify him[b], for I find no charge against him.”
translation:
  language: tl
  text: Kaya nang makita siya ng mga punong pari at ng mga tauhan, sumigaw sila, “Ipako siya sa krus! Ipako siya sa krus!” Sinabi sa kanila ni Pilato, “Kunin ninyo siya at kayo mismo ang ipako siya sa krus,[a] sapagkat wala akong makitang batayan para paratangan siya.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring isalin na, “Kunin ninyo siya at kayo ang magpako sa kanya sa krus.” Tahasang binibigyang-diin sa Griyego ang “kayo.”
    reason: lexical_alternative
  - marker: b
    text: O, “wala akong makitang kasalanan sa kanya.” Ang salitang Griyego ay maaaring tumukoy sa paratang o batayan ng paratang; nangingibabaw rito ang diwang legal.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε οὖν
  choice: Kaya nang
  rationale: Likas na pinagsasama nito ang panahong ipinahihiwatig ng ὅτε at ang pagpapatuloy o bunga na ipinahihiwatig ng οὖν.
- source_word: ἀρχιερεῖς
  choice: mga punong pari
  rationale: Karaniwang tawag sa pangkat ng mga nakatataas na pinunong pari sa Jerusalem, hindi sa iisang mataas na pari lamang.
- source_word: ὑπηρέται
  choice: mga tauhan
  rationale: Tumutukoy sa mga nakabababang opisyal o tagapaglingkod ng mga pinunong Judio; hindi nito labis na tinutukoy kung sila ay bantay sa templo o ibang uri ng opisyal.
- source_word: ἐκραύγασαν λέγοντες
  choice: sumigaw sila
  rationale: Natural na ipinahahayag sa Filipino ang malakas na sigaw at ang nilalaman nito nang hindi kailangang isalin nang hiwalay ang participle na λέγοντες.
- source_word: Σταύρωσον σταύρωσον
  choice: Ipako siya sa krus! Ipako siya sa krus!
  rationale: Ipinagkakaloob ang malinaw sa kontekstong layon na 'siya' at pinananatili ang pag-uulit at tindi ng dalawang pautos.
- source_word: Λάβετε αὐτὸν ὑμεῖς
  choice: Kayo mismo ang kumuha sa kanya
  rationale: Pinananatili ng 'kayo mismo' ang tahasang diin at paghahambing na dala ng ὑμεῖς.
- source_word: σταυρώσατε
  choice: magpako sa kanya sa krus
  rationale: Tuwirang inilalarawan ang ipinag-uutos na pagbitay sa krus sa natural na modernong Filipino.
- source_word: αἰτίαν
  choice: batayan para paratangan siya
  rationale: Sa kontekstong paglilitis, ipinahihiwatig nito ang legal na paratang o sapat na batayan para sa isang paratang, hindi lamang isang pangkalahatang pagkukulang.
theological_decisions:
- issue: Ang pahayag ni Pilato tungkol sa kawalan ng sala ni Jesus
  choice: wala akong makitang batayan para paratangan siya
  alternative: wala akong makitang kasalanan sa kanya
  rationale: Pinananatili ng pangunahing salin ang agarang legal na diwa ng αἰτία at hindi ginagawang mas malawak na doktrinal na pahayag ang hatol ni Pilato, bagaman ipinakikita pa rin nitong wala siyang nakitang sapat na kaso laban kay Jesus.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “mga tauhan” upang hindi labis na tukuyin ang tungkulin ng ὑπηρέται, at ang “batayan para paratangan” upang malinaw ang tagpong legal. Ang lahat ng panandang talababa ay nasa mismong teksto.
