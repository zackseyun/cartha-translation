  naturalness: Karaniwang malinaw at marangal ang Filipino. Gayunman, mas likas at mas tuwiran ang pautos na “ipako ninyo siya sa krus” kaysa “magpako sa kanya sa krus,” na maaaring tunog hindi gaanong idiomatiko sa ganitong gamit.
  terminology: Ang “mga punong pari,” “mga tauhan,” at “ipako ... sa krus” ay angkop sa modernong Filipino at hindi labis na nagtatalaga ng partikular na tungkulin sa ὑπηρέται. Ang “batayan para paratangan siya” ay pinananatili upang maipahayag ang legal na saklaw ng αἰτία.
