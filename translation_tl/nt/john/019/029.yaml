base_translation:
  language: en
  yaml_path: translation/nt/john/019/029.yaml
  text: A container full of sour wine was lying there[b][a]; so they put a sponge full of the sour wine on hyssop and brought it to his mouth.
translation:
  language: tl
  text: May nakalagay doong isang sisidlang punô ng maasim na alak[a]. Kaya pinunô nila ng maasim na alak ang isang espongha, inilagay iyon sa isopo[b], at inilapit sa kanyang bibig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “suka.” Ang salitang Griyego ay maaaring tumukoy sa maasim na alak o suka; dito, malamang na ito ang maasim na inuming alak na karaniwang mayroon ang mga sundalo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa isang sanga ng isopo” o “gamit ang isopo.” “Sa/gamit ang isopo” lamang ang tahasang sinasabi sa Griyego, kaya pinagtatalunan ang eksaktong larawan ng ginawa nila.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκεῦος
  choice: sisidlan
  rationale: Pangkalahatang tawag ito sa isang lalagyan; natural sa modernong Filipino at hindi nito ipinapalagay kung banga, mangkok, o ibang uri iyon.
- source_word: ἔκειτο
  choice: may ... doon
  rationale: Ipinahahayag ng pandiwa na naroon o nakalagay ang sisidlan. Ang hulma na “May ... doon” ay natural na panimulang paglalarawan ng tagpo sa Filipino.
- source_word: ὄξους
  choice: maasim na alak
  rationale: Sa kontekstong ito, malamang na tumutukoy ang ὄξος sa murang maasim na inuming alak, hindi lamang sa sukang panluto. Pinananatili sa talababa ang leksikal na alternatibong “suka.”
- source_word: μεστόν / μεστὸν
  choice: punô / pinunô
  rationale: Inilalarawan nito kapwa ang sisidlan at ang espongha bilang punô ng maasim na alak. Gumamit ng pang-uri sa una at natural na pandiwang Filipino sa ikalawa.
- source_word: σπόγγον
  choice: isang espongha
  rationale: Direkta at karaniwang katumbas sa modernong Filipino.
- source_word: οὖν
  choice: kaya
  rationale: Malinaw at natural na naghuhudyat ng kasunod na kilos sa salaysay.
- source_word: ὑσσώπῳ
  choice: sa isopo
  rationale: Pinananatili ang payak na dative ng Griyego nang hindi idinaragdag sa pangunahing teksto ang salitang “sanga,” na hindi tahasang naroon. Ipinapaliwanag sa talababa ang posibleng mga larawan ng kilos.
- source_word: περιθέντες
  choice: inilagay iyon
  rationale: Ipinahahayag ang kilos na nauna sa paglapit ng espongha sa bibig. Ang “iyon” ay malinaw na tumutukoy sa espongha.
- source_word: προσήνεγκαν
  choice: inilapit
  rationale: Sa pisikal na tagpong ito, natural na ipinahahayag ng “inilapit” ang pagdadala o pag-aabot ng espongha patungo sa bibig nang hindi nagpapahiwatig ng dagdag na simbolikong kahulugan.
- source_word: αὐτοῦ τῷ στόματι
  choice: sa kanyang bibig
  rationale: Natural na katumbas ng pariralang tumutukoy sa bibig ni Jesus; hindi kailangang ulitin ang pangalan sa konteksto.
theological_decisions:
- issue: Posibleng historikal at ritwal na pahiwatig ng ὑσσώπῳ
  choice: Panatilihin ang “isopo” sa pangunahing teksto nang hindi ipinapaliwanag ang simbolismo nito.
  alternative: Isaling “sanga ng isopo” o palitan ng mas pangkalahatang “tangkay.”
  rationale: Maaaring magpahiwatig ang salita ng Paskuwa o ritwal na paglilinis, ngunit hindi tahasang sinasabi ng talata ang gayong kahulugan. Pinananatili ng “isopo” ang posibleng teolohikal na resonansiya at ang tunay na kalabuan ng eksaktong paraan ng paggamit nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sisidlan” sa halip na mas tiyak na “banga,” at pinanatili ang “isopo” upang hindi burahin ang historikal at posibleng teolohikal na pahiwatig ng orihinal.
