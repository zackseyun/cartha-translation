id: JHN.19.40
reference: John 19:40
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἔλαβον οὖν τὸ σῶμα τοῦ Ἰησοῦ καὶ ἔδησαν ⸀αὐτὸ ὀθονίοις μετὰ τῶν ἀρωμάτων, καθὼς ἔθος ἐστὶν τοῖς Ἰουδαίοις ἐνταφιάζειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/040.yaml
  text: So they took Jesus’s body and wrapped it in linen cloths with the spices[a], as is the burial custom of the Jews.
translation:
  language: tl
  text: Kaya kinuha nila ang katawan ni Jesus at binalot iyon ng mga telang lino kasama ng mga pabango, ayon sa kaugalian ng mga Judio sa paglilibing.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga taga-Judea” kung heograpiko ang kahulugan; ngunit sa kontekstong ito, mas malamang na tumutukoy ito sa pangkalahatang kaugaliang panlibing ng mga Judio.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλαβον
  choice: kinuha nila
  rationale: Tumutukoy ito sa aktuwal na pagkuha sa katawan upang ihanda sa paglilibing; likas at tuwiran ang “kinuha” sa salaysay.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinapakita nito ang bunga o pagpapatuloy mula sa naunang talata nang hindi nagiging labis na pormal.
- source_word: σῶμα
  choice: katawan
  rationale: Tuwirang katumbas ito ng σῶμα at mas marangal kaysa sa mas tahasang “bangkay.”
- source_word: ἔδησαν
  choice: binalot
  rationale: Bagaman pangunahing nangangahulugang itali o bigkisin ang δέω, sa konteksto ng mga telang lino at paghahanda sa libing, malinaw at natural sa Tagalog ang “binalot,” na hindi naman inaalis ang diwa ng pagpirmi sa katawan gamit ang mga tela.
- source_word: ὀθονίοις
  choice: ng mga telang lino
  rationale: Pinananatili nito ang maramihang anyo at ang materyal ng mga telang ginamit, nang hindi nagdaragdag ng interpretatibong katawagang “telang panlibing.”
- source_word: ἀρώματα
  choice: mga pabango
  rationale: Tumutukoy ito sa mababangong sangkap na ginagamit sa paglilibing. Mas natural sa modernong Tagalog ang “mga pabango” kaysa “mga espesya,” bagaman hindi ito tumutukoy sa modernong likidong perfume lamang.
- source_word: καθὼς
  choice: ayon sa
  rationale: Likas na ipinahahayag sa Tagalog ang pagkakaayon ng ginawa nila sa umiiral na kaugalian.
- source_word: ἔθος ἐστὶν
  choice: kaugalian
  rationale: Malinaw nitong inilalahad ang nakasanayang gawain; naipapahayag ng buong parirala ang predikatibong diwa ng Griyego.
- source_word: τοῖς Ἰουδαίοις
  choice: ng mga Judio
  rationale: Sa kontekstong ito, tumutukoy ito sa pangkalahatang kaugaliang panlibing ng mga Judio, hindi lamang sa mga taga-Judea o sa mga pinunong Judio.
- source_word: ἐνταφιάζειν
  choice: sa paglilibing
  rationale: Saklaw nito ang paghahanda sa patay para sa libing, hindi lamang ang mismong paglalagay sa libingan.
theological_decisions:
- issue: Kahulugan ng τοῖς Ἰουδαίοις
  choice: mga Judio
  alternative: mga taga-Judea
  rationale: Ang tinutukoy rito ay isang pangkalahatang kaugaliang panlibing na kaugnay ng bayang Judio at ng kanilang relihiyosong-kultural na gawain; walang dahilan sa konteksto upang limitahan ito sa heograpikong Judea.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa salaysay. Pinili ang “binalot” bilang natural na paglalarawan ng gawaing panlibing, at “mga pabango” para sa mababangong sangkap na kasama ng mga telang lino. Inilagay ang talababa pagkatapos ng buong pahayag tungkol sa mga Judio upang malinaw na ang alternatibong pagbasa ay kaugnay ng katawagang iyon.
