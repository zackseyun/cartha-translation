id: JHN.19.5
reference: John 19:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐξῆλθεν οὖν ὁ Ἰησοῦς ἔξω, φορῶν τὸν ἀκάνθινον στέφανον καὶ τὸ πορφυροῦν ἱμάτιον. καὶ λέγει αὐτοῖς· ⸀Ἰδοὺ ὁ ἄνθρωπος.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/005.yaml
  text: So Jesus came out[a], wearing the crown of thorns and the purple robe. And he says to them, “Behold, the man.”
translation:
  language: tl
  text: Kaya lumabas si Jesus, na suot ang koronang tinik at ang balabal na kulay-ube. At sinabi ni Pilato sa kanila, “Narito ang tao.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Tingnan ninyo, ang tao.” Ang Griegong Ἰδοὺ ay panawag-pansin na maaaring isaling “Narito,” “Tingnan,” o “Masdan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν οὖν ... ἔξω
  choice: Kaya lumabas
  rationale: 'Pinagsasama nito sa likas na Tagalog ang pang-ugnay na οὖν at ang idyomatikong diin ng ἐξῆλθεν ... ἔξω: lumabas si Jesus bilang kasunod ng naunang pangyayari.'
- source_word: φορῶν
  choice: na suot
  rationale: Malinaw at karaniwang paraan ito ng pagsasabing nakasuot kay Jesus ang dalawang bagay habang lumalabas siya.
- source_word: τὸν ἀκάνθινον στέφανον
  choice: ang koronang tinik
  rationale: Tumutukoy ito sa koronang yari sa mga tinik; maikli, natural, at pamilyar ang parirala sa modernong Tagalog.
- source_word: τὸ πορφυροῦν ἱμάτιον
  choice: ang balabal na kulay-ube
  rationale: Ang ἱμάτιον ay panlabas na kasuotan, kaya ang “balabal” ay angkop nang hindi labis na tumutukoy sa eksaktong anyo; tahasang inilalarawan ng πορφυροῦν ang kulay nito.
- source_word: λέγει αὐτοῖς
  choice: sinabi ni Pilato sa kanila
  rationale: Bagaman historical present ang λέγει, higit na natural sa salaysay na Tagalog ang pangnagdaan. Nililinaw ng tahasang “ni Pilato” ang paksa mula sa konteksto nang hindi binabago ang tinutukoy ng pandiwa.
- source_word: Ἰδοὺ
  choice: Narito
  rationale: Isang marangal at natural na panawag-pansin ito sa Tagalog na angkop sa pampublikong paghaharap kay Jesus.
- source_word: ὁ ἄνθρωπος
  choice: ang tao
  rationale: Direkta nitong pinananatili ang tiyak na pagtukoy kay Jesus at ang posibleng mas malawak na pahiwatig ng salitang ἄνθρωπος nang hindi ito ipinapaliwanag sa mismong teksto.
theological_decisions:
- issue: Pagkakasalin ng ὁ ἄνθρωπος sa pahayag ni Pilato
  choice: ang tao
  alternative: ang lalaking ito
  rationale: Ang “ang tao” ay tumutukoy nang tuwiran kay Jesus at pinananatili ang bantog at sadyang matimbang na anyo ng pahayag. Ang “ang lalaking ito” ay mas tiyak ngunit nagdaragdag ng deiktikong “ito” at maaaring magpahina sa posibleng mas malawak na alingawngaw ng parirala.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa banal na kasulatan. Iniwasan ang lipas na “Masdan” sa pangunahing teksto ngunit inilagay ito bilang posibleng katumbas sa talababa.
