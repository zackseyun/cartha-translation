  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἔγραψεν δὲ καὶ τίτλον ὁ Πιλᾶτος καὶ ἔθηκεν ἐπὶ τοῦ σταυροῦ· ἦν δὲ γεγραμμένον· Ἰησοῦς ὁ Ναζωραῖος ὁ βασιλεὺς τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/019.yaml
  text: 'Pilate also wrote an inscription and put it on the cross. It was written: “Jesus the Nazarene[a], the King of the Jews.”'
translation:
  language: tl
  text: 'Sumulat din si Pilato ng isang inskripsiyon at inilagay ito sa krus. Ganito ang nakasulat: “Si Jesus na Nazareno, ang Hari ng mga Judio.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang Hari ng mga taga-Judea.” Maaaring tumukoy ang salitang Griyego sa mga Judio sa pangkalahatan o sa mga taga-Judea sa partikular, depende sa konteksto.
    reason: alternative_reading
lexical_decisions:
- source_word: τίτλον
  choice: karatula
  rationale: Sa konteksto ng pagpapako sa krus, tumutukoy ito sa nakasulat na pabatid na ikinabit sa krus. Ang “karatula” ay malinaw at likas sa makabagong Filipino; ang “titulo” ay magiging malabo rito.
- source_word: ἔθηκεν ἐπὶ τοῦ σταυροῦ
  choice: inilagay niya ito sa krus
  rationale: Tuwirang pinananatili ang lokasyong ipinahahayag ng Griyego, “sa krus,” nang hindi dinaragdagan ng “sa ibabaw” o “sa itaas.”
- source_word: γεγραμμένον
  choice: Ganito ang nakasulat
  rationale: Likas itong pahayag sa Filipino na nagpapanatili sa resultative o stative na diwa ng ἦν ... γεγραμμένον at maayos na nagpapakilala sa mismong teksto ng karatula.
- source_word: Ναζωραῖος
  choice: Nazareno
  rationale: Pinananatili nito ang anyong pantukoy o bansag ng Griyego sa halip na tahasang gawing “taga-Nazaret.” Karaniwan at nauunawaan ang “Nazareno” sa Filipino.
- source_word: βασιλεὺς τῶν Ἰουδαίων
  choice: ang Hari ng mga Judio
  rationale: Sa salaysay ng pagpapakasakit, ito ang pampublikong maharlikang katawagang nakasaad bilang paratang laban kay Jesus. Ang “mga Judio” ang pinakakaraniwan at angkop na salin, habang inilalahad sa talababa ang posibleng heograpikong kahulugan.
- source_word: δὲ καὶ
  choice: din
  rationale: Natural na ipinahahayag ng “din” ang pandagdag na puwersa ng mga pang-ugnay sa pagpapatuloy ng salaysay.
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Pamantayang anyo ng pangalang Ἰησοῦς sa Filipino.
- source_word: Πιλᾶτος
  choice: Pilato
  rationale: Pamantayang anyo ng pangalang Πιλᾶτος sa Filipino.
- source_word: σταυροῦ
  choice: krus
  rationale: Ang “krus” ang pamantayan at angkop-sa-kontekstong salin sa mga salaysay ng pagpapako kay Jesus.
theological_decisions:
- issue: Pagpapakahulugan sa Ἰουδαίων sa nakasulat na paratang
  choice: mga Judio
  alternative: mga taga-Judea
  rationale: Sa kontekstong ito, ang parirala ay isang pampublikong katawagang maharlika at ang “mga Judio” ang malamang at nakagawiang kahulugan. Gayunman, maaaring tumukoy ang salitang Griyego sa mga taga-Judea ayon sa konteksto, kaya pinananatili ang posibilidad na iyon sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “karatula” sa halip na mas teknikal na “inskripsiyon,” at “Nazareno” upang mapanatili ang anyong bansag sa Griyego. Inilagay ang panandang [a] pagkatapos ng “mga Judio” dahil iyon ang salitang tinutukoy ng talababa.
