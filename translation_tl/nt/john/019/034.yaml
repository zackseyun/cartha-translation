base_translation:
  language: en
  yaml_path: translation/nt/john/019/034.yaml
  text: But one of the soldiers pierced his side with a spear[b][a], and immediately blood and water came out.
translation:
  language: tl
  text: Ngunit tinusok ng isa sa mga kawal ang tagiliran niya sa pamamagitan ng sibat[a], at agad na lumabas ang dugo at tubig.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lance,” isang uri ng sibat.
    reason: lexical_alternative
  - marker: b
    text: Itinuturing ng ilang tagapagpaliwanag na simboliko o sakramental ang “dugo at tubig”; itinuturing naman ito ng iba na pisikal na paglalarawan. Hindi ipinaliliwanag dito ng tekstong Griyego ang kahulugan nito.
    reason: interpretive_ambiguity
lexical_decisions:
- source_word: ἀλλ’
  choice: Ngunit
  rationale: Malinaw na ipinapakita ang pagsalungat sa naunang pahayag na hindi binali ang mga binti ni Jesus, habang nananatiling angkop sa marangal na salaysay.
- source_word: εἷς τῶν στρατιωτῶν
  choice: isa sa mga kawal
  rationale: Pinananatili ang tahasang partitive construction ng Griyego sa halip na gawing simpleng ‘isang kawal.’
- source_word: λόγχῃ
  choice: sa pamamagitan ng sibat
  rationale: Ang λόγχη ay sibat o lance ng kawal; ‘sibat’ ang pinakakaraniwan at malinaw na katumbas sa modernong Filipino.
- source_word: αὐτοῦ τὴν πλευράν
  choice: ang tagiliran niya
  rationale: Ang ‘tagiliran’ ay natural at hindi labis na espesipikong salin ng πλευρά; pinananatili rin ang panghalip na tumutukoy kay Jesus ayon sa konteksto.
- source_word: ἔνυξεν
  choice: tinusok
  rationale: Ipinahihiwatig ng pandiwa ang pagbutas o pagtusok gamit ang matulis na bagay. Natural at tumpak ang ‘tinusok’ sa Filipino nang hindi nagdaragdag ng detalye.
- source_word: καὶ ⸂ἐξῆλθεν εὐθὺς⸃
  choice: at agad na lumabas
  rationale: Pinananatili ang pagkakasunod na ipinahihiwatig ng καί at ang agarang panahon ng εὐθύς sa natural na ayos ng Filipino.
- source_word: αἷμα καὶ ὕδωρ
  choice: ang dugo at tubig
  rationale: Tuwirang pinananatili ang kakaibang parirala ng Griyego nang walang medikal o sakramental na pagpapaliwanag sa pangunahing teksto.
theological_decisions:
- issue: Kung bibigyang-kahulugang sakramental o pisikal ang ‘dugo at tubig’ sa pangunahing teksto
  choice: Panatilihin ang literal na ‘dugo at tubig’ nang walang paliwanag sa pangunahing teksto.
  alternative: Unawain ito bilang sakramental na pahiwatig o bilang pisikal na paglalarawan ng epekto ng sugat.
  rationale: Inilalahad ng talata ang pangyayari ngunit hindi nito ipinaliliwanag ang kahulugan. Pinananatili ng salin ang tunay na interpretatibong tensiyon at hindi ipinapasok ang isang partikular na tradisyong teolohikal.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang ‘kawal’ upang umangkop sa makasaysayang salaysay at ‘tagiliran’ bilang karaniwang katumbas ng bahagi ng katawan. Inilagay ang mga pananda ng talababa sa mismong kaugnay na mga parirala.
