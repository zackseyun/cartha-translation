revisions:
- from: Kaya nang marinig ni Pilato ang mga salitang ito, inilabas niya si Jesus at umupo sa hukuman[a], sa lugar na tinatawag na Batong Latag, at sa Hebreo[b] ay Gabbata.
  to: Kaya nang marinig ni Pilato ang mga salitang ito, inilabas niya si Jesus at umupo sa luklukan ng paghatol sa isang lugar na tinatawag na Platapormang Bato, at sa Hebreo[a] ay Gabbata.
  rationale: Pinalitan ang "hukuman" ng "luklukan ng paghatol" upang maipakita ang βῆμα bilang opisyal na upuang panghukom. Pinalitan ang "Batong Latag" ng "Platapormang Bato" para sa mas malinaw at likas na katawagan ng lugar. Inilipat ang talababa ng alternatibong pagbasa sa pandiwang "umupo," kung saan umiiral ang ambigwidad sa Griyego, at iniangkla ang talababa tungkol sa "Hebreo" sa mismong parirala. Ang dalawang talababa ay parehong pinanatili, kaya ang mga marker sa teksto ay [a] para sa alternatibong pagbasa at [b] para sa wikang Semitiko.
