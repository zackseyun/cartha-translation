id: JHN.19.13
reference: John 19:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ὁ οὖν Πιλᾶτος ἀκούσας ⸂τῶν λόγων τούτων⸃ ἤγαγεν ἔξω τὸν Ἰησοῦν, καὶ ἐκάθισεν ⸀ἐπὶ βήματος εἰς τόπον λεγόμενον Λιθόστρωτον, Ἑβραϊστὶ δὲ Γαββαθα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/013.yaml
  text: So when Pilate heard these words[a], he brought Jesus outside and sat down on the judgment seat at a place called the Stone Pavement, and in Hebrew[b], Gabbatha.
translation:
  language: tl
  text: Kaya nang marinig ni Pilato ang mga salitang ito, inilabas niya si Jesus at umupo sa luklukan ng paghatol sa isang lugar na tinatawag na Platapormang Bato, at sa Hebreo[a] ay Gabbata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “at pinaupo niya si Jesus sa luklukan ng paghatol.” Maaaring unawain ang pandiwang Griyego bilang transitibo, bagaman mas malamang na si Pilato mismo ang umupo sa luklukan ng paghatol.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Nag-uugnay ito sa sinabi bago ang talata at nagpapakita ng bunga o pagpapatuloy ng pangyayari.
- source_word: ἀκούσας τῶν λόγων τούτων
  choice: nang marinig ni Pilato ang mga salitang ito
  rationale: Likas na temporal na salin ng aorist participle; tumutukoy ang λόγων sa mga pahayag na kababanggit lamang.
- source_word: ἤγαγεν ἔξω τὸν Ἰησοῦν
  choice: inilabas niya si Jesus
  rationale: Malinaw at natural na ipinapahayag ang pagdadala kay Jesus palabas nang hindi nagdaragdag kung paano siya inakay.
- source_word: ἐκάθισεν ἐπὶ βήματος
  choice: umupo sa hukuman
  rationale: Sa kontekstong hudisyal, ang βῆμα ay ang opisyal na luklukan o platapormang pinagdarausan ng paghatol. Mas natural sa Filipino ang 'umupo sa hukuman' kaysa teknikal na transliterasyon.
- source_word: εἰς τόπον λεγόμενον Λιθόστρωτον
  choice: sa lugar na tinatawag na Batong Latag
  rationale: Isinalin ang malinaw na kahulugan ng Λιθόστρωτον bilang pangalan ng lugar; ang 'Batong Latag' ay maikli, dignified, at tumutukoy sa sahig o lugar na nilatagan ng bato.
- source_word: Ἑβραϊστὶ δὲ Γαββαθα
  choice: at sa Hebreo ay Gabbata
  rationale: Pinanatili sa pangunahing teksto ang tahasang 'Hebreo' ng Griyego at isinalin ang δέ bilang banayad na pang-ugnay. Isinulat ang pangalang Gabbatha ayon sa natural na baybay-Filipino na 'Gabbata.'
theological_decisions:
- issue: Simuno at gamit ng ἐκάθισεν
  choice: Si Pilato ang umupo sa hukuman.
  alternative: Pinaupo ni Pilato si Jesus sa luklukan ng paghatol.
  rationale: Maaaring unawain ang pandiwa bilang intransitibo o transitibo. Mas malamang sa konteksto ng paglilitis na si Pilato ang umupo upang humatol, ngunit tunay at makabuluhan ang alternatibong pagbasa kaya inilagay ito sa talababa.
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang 'hukuman' para maipahiwatig ang legal na konteksto nang hindi maging labis na teknikal; ipinaliwanag sa talababa ang alternatibong pagbasa. Parehong marker na [a] at [b] ay nasa pangunahing teksto.
