  yaml_path: translation/nt/john/019/001.yaml
  text: Then Pilate took Jesus and flogged him[a].
translation:
  language: tl
  text: Kaya kinuha ni Pilato si Jesus at hinagupit siya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, kung mas tahasang ipinahihiwatig na ipinagawa niya ito sa iba: “Kaya kinuha ni Pilato si Jesus at ipinahagupit niya si Jesus.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Τότε οὖν
  choice: Kaya
  rationale: Pinagsasama nito sa natural na daloy ng Tagalog ang pagsulong ng salaysay at ang bahagyang lohikal na ugnayang ipinahihiwatig ng Τότε at οὖν, nang hindi gumagamit ng mabigat na dobleng pananda gaya ng “Pagkatapos, kaya.”
- source_word: ἔλαβεν
  choice: kinuha
  rationale: Payak at tuwirang katumbas ng λαμβάνω sa kontekstong ito. Hindi nito ipinapalagay na sinunggaban si Jesus o ipinakuha lamang sa iba.
- source_word: ὁ Πιλᾶτος
  choice: ni Pilato
  rationale: Karaniwang anyo ng pangalang Pilate sa modernong Tagalog; minamarkahan ng “ni” bilang tagaganap ng mga pandiwa.
- source_word: τὸν Ἰησοῦν
  choice: si Jesus
  rationale: Karaniwang anyo ng pangalan sa Tagalog at wastong personal na pananda para sa tuwirang layon.
- source_word: ἐμαστίγωσεν
  choice: hinagupit
  rationale: Malinaw at dignified na modernong salitang nagsasaad ng matinding paghampas gamit ang latigo; mas tiyak kaysa “pinalo” at hindi kasinlumang pakinggan ng ilang tradisyonal na katawagan.
theological_decisions:
- issue: Kung si Pilato mismo ang humagupit kay Jesus o ipinagawa niya ito sa mga tauhan
  choice: 'Panatilihing si Pilato ang gramatikal na tagaganap: “kinuha ni Pilato si Jesus at hinagupit.”'
  alternative: “Kinuha ni Pilato si Jesus at ipinahagupit.”
  rationale: Si Pilato ang tahasang simuno ng dalawang pandiwa sa Griyego. Pinananatili ng pangunahing salin ang anyong ito nang hindi tiyak na ipinapasiya kung personal o ipinag-utos na pagkilos ang tinutukoy; nililinaw ng talababa ang posibleng delegated agency.
translation_notes:
  register: Modernong Filipino Tagalog na maikli, natural, at marangal. Ginamit ang “hinagupit” upang ihatid ang tindi ng μαστιγόω, at inilagay sa talababa ang mas tahasang pagbasa na ipinagawa ni Pilato ang paghagupit.
