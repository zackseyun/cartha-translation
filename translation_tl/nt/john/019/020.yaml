revisions:
- from: Kaya maraming Judio ang nakabasa sa nakasulat na ito[a], sapagkat malapit sa lungsod ang lugar kung saan ipinako sa krus si Jesus. Nakasulat ito sa Hebreo, Latin, at Griyego.
  to: Kaya marami sa mga Judio ang bumasa sa karatulang ito, sapagkat malapit sa lungsod ang lugar kung saan ipinako sa krus si Jesus. Nakasulat ito sa Hebreo[a], Latin, at Griyego.
  rationale: Pinalitan ang “nakabasa” ng “bumasa” para sa payak na kilos ng ἀνέγνωσαν at ginawang malinaw ang partitive na parirala. Inilipat ang talababa sa “Hebreo” upang maipreserba ang tahasang salin ng Ἑβραϊστί sa pangunahing teksto habang ipinapaalam ang posibleng pagtukoy nito sa Aramaico. Pinanatili ang “karatulang ito” bilang likas at angkop na salin ng τίτλος sa konteksto.
