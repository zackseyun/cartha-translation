  naturalness: Mas tuwiran at natural sa modernong Filipino ang “Marami sa mga Judio ang bumasa sa karatulang ito.” Ang “karatula” ay malinaw na tumutukoy sa nakapaskil na pabatid sa konteksto ng pagpapako sa krus.
  terminology: Ang “Judio,” “ipinako sa krus,” “Hebreo,” “Latin,” at “Griyego” ay angkop. Ang “karatula” ay isang malinaw na pangkontekstong salin ng τίτλος; hindi kailangan ang alternatibong talababa para rito. Ang talababa ay dapat ilaan sa tunay na leksikal/pangkasaysayang ambigwidad ng “Hebreo.”
