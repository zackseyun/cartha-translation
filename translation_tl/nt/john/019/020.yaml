id: JHN.19.20
reference: John 19:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τοῦτον οὖν τὸν τίτλον πολλοὶ ἀνέγνωσαν τῶν Ἰουδαίων, ὅτι ἐγγὺς ἦν ὁ τόπος τῆς πόλεως ὅπου ἐσταυρώθη ὁ Ἰησοῦς· καὶ ἦν γεγραμμένον Ἑβραϊστί, ⸂Ῥωμαϊστί, Ἑλληνιστί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/020.yaml
  text: Therefore many of the Jews read this inscription[a], because the place where Jesus was crucified was near the city; and it was written in Hebrew, in Latin, and in Greek.
translation:
  language: tl
  text: Kaya marami sa mga Judio ang bumasa sa karatulang ito, sapagkat malapit sa lungsod ang lugar kung saan ipinako sa krus si Jesus. Nakasulat ito sa Hebreo[a], Latin, at Griyego.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O posibleng “Aramaico”; ginagamit ni Juan ang “Hebreo” para sa lokal na wikang Semitiko.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίτλον
  choice: nakasulat na ito
  rationale: Sa konteksto, tumutukoy ito sa nakasulat na pahayag na inilagay sa krus. Natural sa modernong Filipino ang pariralang ito at hindi nito ipinahihiwatig ang makabagong kahulugan ng “titulo.”
- source_word: πολλοὶ ... τῶν Ἰουδαίων
  choice: maraming Judio
  rationale: Malinaw at likas itong Filipino para sa partitive na diwa ng maraming kabilang sa mga Judio, nang hindi ipinahihiwatig na lahat sila ang tinutukoy.
- source_word: ἀνέγνωσαν
  choice: nakabasa
  rationale: Ipinapahayag nito ang payak na kilos ng pagbasa sa nakapaskil na teksto; walang batayan sa Griyego upang idagdag na binasa iyon nang malakas.
- source_word: ἐγγὺς ἦν ὁ τόπος τῆς πόλεως
  choice: malapit sa lungsod ang lugar
  rationale: Tuwirang pinananatili ang ugnayang panlunan at hindi nagdaragdag ng detalye gaya ng pintuang-bayan.
- source_word: ὅπου ἐσταυρώθη ὁ Ἰησοῦς
  choice: kung saan ipinako sa krus si Jesus
  rationale: Natural na pasibong salin ito na hindi nagdaragdag ng tahasang gumagawa ng kilos.
- source_word: ἦν γεγραμμένον
  choice: Nakasulat ito
  rationale: Naipapakita ng anyong ito ang umiiral na kalagayan ng teksto bilang nakasulat, alinsunod sa resultative na diwa ng periphrastic perfect.
- source_word: Ἑβραϊστί
  choice: sa Hebreo
  rationale: Pinananatili nito sa pangunahing teksto ang tahasang katawagan ng Griyego, habang inilalahad sa talababa ang posibleng pagtukoy sa Aramaico.
- source_word: Ῥωμαϊστί
  choice: Latin
  rationale: Bagaman literal na “sa paraang Romano,” ang tinutukoy ay ang wikang Latin; ito ang malinaw at karaniwang katawagan sa Filipino.
- source_word: Ἑλληνιστί
  choice: Griyego
  rationale: Ito ang tuwiran at karaniwang salin ng pang-abay na tumutukoy sa wikang Griyego.
- source_word: οὖν
  choice: Kaya
  rationale: Natural nitong ipinapakita sa Filipino ang lohikal at pasalaysay na kaugnayan sa naunang talata.
theological_decisions:
- issue: Pagpapakahulugan sa Ἑβραϊστί sa gamit ni Juan
  choice: Hebreo sa pangunahing teksto
  alternative: Aramaico
  rationale: “Hebreo” ang tahasang sinasabi ng Griyego, kaya iyon ang pinananatili sa teksto. Gayunman, maaaring gamitin ni Juan ang katawagang ito para sa lokal na wikang Semitiko, marahil Aramaico, kaya inilalagay ang posibilidad na iyon sa talababa sa halip na tahimik na ipalit.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “Judio” bilang natural na katawagan sa pangkat sa kontekstong ito. Pinanatili ang mga pangalang Hebreo, Latin, at Griyego sa payak na anyo. Ang talababa ay inilaan sa tunay na alternatibo para sa τίτλον; ang usapin ng Aramaico ay dapat ding maipaliwanag, kaya kailangang itugma ang marker kung isasama sa publikasyong may higit sa isang talababa.
