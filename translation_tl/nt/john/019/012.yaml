source:
  edition: SBLGNT
  text: ἐκ τούτου ⸂ὁ Πιλᾶτος ἐζήτει⸃ ἀπολῦσαι αὐτόν· οἱ δὲ Ἰουδαῖοι ⸀ἐκραύγασαν λέγοντες· Ἐὰν τοῦτον ἀπολύσῃς, οὐκ εἶ φίλος τοῦ Καίσαρος· πᾶς ὁ βασιλέα ἑαυτὸν ποιῶν ἀντιλέγει τῷ Καίσαρι.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/012.yaml
  text: From then on Pilate was seeking to release him. But the Jews shouted, saying, “If you release this man, you are not Caesar’s friend. Everyone who makes himself a king speaks against Caesar.”
translation:
  language: tl
  text: Mula noon[a] ay patuloy na sinikap ni Pilato na palayain siya. Ngunit sumigaw ang mga Hudyo[b], “Kung palalayain mo ang taong ito, hindi ka kaibigan ni Cesar. Ang sinumang ginagawang hari ang kanyang sarili ay sumasalungat kay Cesar.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Dahil dito ay patuloy na sinikap ni Pilato na palayain siya.” Maaaring unawain ang Griyegong ἐκ τούτου bilang panahunan (“mula noon”) o sanhi (“dahil dito”).
    reason: lexical_alternative
  - marker: b
    text: Sa Ebanghelyo ni Juan, ang “mga Hudyo” ay madalas tumutukoy nang mas tiyak sa mga awtoridad sa Judea o sa ilang Hudyong kalaban sa mismong konteksto, hindi kinakailangang sa buong sambayanang Hudyo.
    reason: cultural_note
  - marker: c
    text: Maaari ring isalin, “nagsasalita laban kay Cesar” o “kumakalaban kay Cesar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τούτου
  choice: Mula noon
  rationale: Likas itong temporal na pagbasa sa daloy ng salaysay at malinaw na nagmamarka sa sumunod na pagkilos ni Pilato; pinananatili sa talababa ang posibleng pagbasa na sanhi.
- source_word: ἐζήτει
  choice: patuloy na sinikap
  rationale: Ipinahihiwatig ng aspektong imperpektibo ang nagpapatuloy o paulit-ulit na pagtatangka, kaya ginamit ang “patuloy” upang mailabas ang puwersang iyon sa natural na Tagalog.
- source_word: ἀπολῦσαι / ἀπολύσῃς
  choice: palayain / palalayain
  rationale: Tumutukoy ito sa opisyal na pagpapalaya sa isang taong nasa kustodiya at angkop sa kontekstong hudisyal.
- source_word: οἱ δὲ Ἰουδαῖοι
  choice: Ngunit ... ang mga Judio
  rationale: Pinananatili ang hayag na katawagan ng Griyego nang hindi isinisiksik sa pangunahing teksto ang mas makitid na interpretasyong “mga pinunong Judio”; nililinaw sa talababa ang kontekstuwal na saklaw.
- source_word: ἐκραύγασαν λέγοντες
  choice: sumigaw
  rationale: Natural na ipinapahayag ng “sumigaw” ang malakas na hayagang pagsigaw; hindi na kailangang isalin nang hiwalay ang pleonastikong “na sinasabi” bago ang tuwirang sipi.
- source_word: τοῦτον
  choice: ang taong ito
  rationale: Likas sa Tagalog at pinananatili ang demonstratibo at bahagyang mapanghamak na himig ng pahayag.
- source_word: φίλος τοῦ Καίσαρος
  choice: kaibigan ni Cesar
  rationale: Tuwirang pinananatili ang larawang “kaibigan” at ang ipinahihiwatig na pag-aangkin sa katapatan kay Cesar, nang hindi ginagawang tahasang teknikal na titulo.
- source_word: πᾶς ὁ βασιλέα ἑαυτὸν ποιῶν
  choice: Ang sinumang ginagawang hari ang kanyang sarili
  rationale: Malapit ito sa anyo ng Griyego at hindi pinahihina tungo sa interpretasyong “nag-aangking hari” lamang.
- source_word: ἀντιλέγει τῷ Καίσαρι
  choice: kumakalaban kay Cesar
  rationale: Sa legal at politikal na bantang ito, natural na ipinahahayag ng “kumakalaban” ang pagsalungat kay Cesar, habang inilalagay sa talababa ang mas literal na berbal na posibilidad.
theological_decisions:
- issue: Saklaw ng katawagang “ang mga Judio” sa Ebanghelyo ni Juan
  choice: Panatilihin sa pangunahing teksto ang “mga Judio.”
  alternative: “mga pinunong Judio” o “mga Judeano”
  rationale: Ang Griyego ay οἱ Ἰουδαῖοι at hindi tahasang nagsasabing “mga pinuno.” Upang hindi paliitin nang tahimik ang tinutukoy, pinanatili ang katawagan ng pinagmulan at nilinaw sa talababa na sa kontekstong Juanino maaari itong tumukoy sa partikular na mga awtoridad o kalaban, hindi sa buong lahing Judio.
- issue: Puwersa ng ἀντιλέγει sa paratang laban kay Cesar
  choice: “kumakalaban kay Cesar”
  alternative: “nagsasalita laban kay Cesar” o “sumasalungat kay Cesar”
  rationale: Saklaw ng pandiwa ang pasalitang pagsalungat at mas malawak na pagkontra. Ang “kumakalaban” ay angkop sa politikal na konteksto, ngunit pinananatili sa talababa ang tunay na leksikal na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “Cesar,” ang karaniwang anyong Filipino ng titulong Caesar, at iniwasan ang sobrang literal ngunit di-likas na mga parirala. Ang mga talababa ay nagpapanatili sa temporal/causal na kalabuan ng ἐκ τούτου, sa kontekstuwal na saklaw ng οἱ Ἰουδαῖοι, at sa leksikal na lawak ng ἀντιλέγει.
