  source_fidelity: 'Tumpak ang pangunahing daloy ng salin: naobserbahan ni Jesus ang kanyang ina at ang alagad na minamahal niya na naroroon, at nagsalita siya sa kanyang ina. Ang “Kaya,” “nang makita,” “nakatayo roon,” at “narito ang anak mo” ay maayos na naghahatid ng οὖν, ἰδών, παρεστῶτα, at ἴδε ὁ υἱός σου. Gayunman, ang “Ginang” ay mas interpretatibo kaysa sa Γύναι at nagdaragdag ng pormal na panlipunang titulóng hindi ipinahihiwatig ng Griyego.'
