  text: Ἰησοῦς οὖν ἰδὼν τὴν μητέρα καὶ τὸν μαθητὴν παρεστῶτα ὃν ἠγάπα λέγει τῇ ⸀μητρί· Γύναι, ⸀ἴδε ὁ υἱός σου·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/026.yaml
  text: So when Jesus saw his mother and the disciple whom he loved standing there[a], he says to his mother, “Woman, behold, your son.”
translation:
  language: tl
  text: Kaya, nang makita ni Jesus ang kanyang ina at ang alagad na minamahal niya, na nakatayo roon, sinabi niya sa kanyang ina, “Babae,[a] narito ang anak mo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Magalang ang tawag na Griyego at hindi ito bastos o mapanlait, bagaman maaaring magaspang pakinggan sa modernong Tagalog ang literal na “Babae.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Ipinahihiwatig ang pag-usad o bunga ng naunang tagpo, habang nananatiling natural sa salaysay na Tagalog.
- source_word: ἰδὼν
  choice: nang makita
  rationale: Isinasalin ang aorist participle bilang sugnay na temporal upang malinaw at natural na maipakita ang pagkakasunod ng pangyayari.
- source_word: τὴν μητέρα
  choice: ang kanyang ina
  rationale: Bagaman artikulo lamang ang nasa Griyego, likas sa Tagalog na tukuying ina ito ni Jesus sa pamamagitan ng panghalip na paari.
- source_word: τὸν μαθητὴν
  choice: ang alagad
  rationale: Pinananatili ang tiyak na pagtukoy sa isang alagad na makikilala mula sa konteksto ng salaysay.
- source_word: παρεστῶτα
  choice: na nakatayo roon
  rationale: Malinaw na inilalarawan ang alagad bilang naroroon at nakatayo sa tagpo nang hindi nagdaragdag ng hindi tahasang layon ng kanyang pagtayo sa tabi.
- source_word: ὃν ἠγάπα
  choice: na minamahal niya
  rationale: Pinananatili ang pagkakakilanlan ng alagad batay sa pag-ibig ni Jesus sa kanya, nang hindi inuulit ang pangalang Jesus na malinaw na sa konteksto.
- source_word: λέγει
  choice: sinabi niya
  rationale: Bagaman historical present ang Griyego, ang aspektong Tagalog na “sinabi” ang likas na anyo sa ganitong salaysay at malinaw na naghahatid ng kilos ng pagsasalita.
- source_word: Γύναι
  choice: Ginang
  rationale: Ang bokatibong Griyego ay magalang at hindi mapanlait. Ang “Ginang” ang natural at marangal na tawag sa modernong Tagalog; ang literal na “Babae” ay madaling mapakinggang magaspang.
- source_word: ἴδε
  choice: narito
  rationale: Sa kontekstong ito, ipinakikilala ng pautos na ἴδε ang taong itinuturo at ang taimtim na pahayag. Ang “narito” ay natural sa Tagalog at hindi nagpapahiwatig na kailangan lamang siyang tumingin.
- source_word: ὁ υἱός σου
  choice: ang anak mo
  rationale: Direktang ipinakikilala ang minamahal na alagad sa kaugnayang tulad ng anak kay Maria, nang hindi nililimitahan ang “anak” sa isang paraang higit sa sinasabi ng konteksto.
theological_decisions:
- issue: Himig ng pagtawag ni Jesus sa kanyang ina sa Γύναι
  choice: Ginang
  alternative: Babae; Mahal na ginang
  rationale: Pinananatili ng “Ginang” ang magalang na himig ng Griyego nang hindi ipinapasok ang karagdagang lambing ng “Mahal na ginang.” Itinatala sa talababa ang mas literal na anyo upang hindi maitago ang mismong salita.
- issue: Kahulugan ng ὁ υἱός σου
  choice: ang anak mo
  alternative: narito ang iyong anak na lalaki
  rationale: Ang “anak mo” ay likas at sapat sa Tagalog. Hindi nito pinalalawak ang pahayag tungo sa isang tiyak na doktrinal na paliwanag tungkol sa uri o saklaw ng relasyong itinatatag.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Ginang” upang maihatid sa karaniwang mambabasa ang magalang na puwersa ng bokatibo, habang pinananatili sa talababa ang literal na anyo at ang tunay na pagkakaiba ng himig.
