  text: ἦν δὲ παρασκευὴ τοῦ πάσχα, ὥρα ⸂ἦν ὡς⸃ ἕκτη. καὶ λέγει τοῖς Ἰουδαίοις· Ἴδε ὁ βασιλεὺς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/014.yaml
  text: It was the day of preparation of the Passover[a]; it was about the sixth hour. And he says to the Jews, “Behold[b], your king!”
translation:
  language: tl
  text: Araw iyon ng Paghahanda para sa Paskuwa; bandang ikaanim na oras.[a] Sinabi niya sa mga Judio[b], “Narito ang inyong hari!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring katumbas ito ng bandang tanghali sa makabagong pagtukoy sa oras, depende sa paraan ng pagbilang sa mga oras.
    reason: cultural_note
  - marker: b
    text: Sa kontekstong ito, ang “mga Judio” ay maaaring tumukoy nang mas tiyak sa mga pinuno o awtoridad na Judio sa Judea.
    reason: alternative_reading
lexical_decisions:
- source_word: παρασκευὴ τοῦ πάσχα
  choice: Araw ng Paghahanda para sa Paskuwa
  rationale: Ipinahihiwatig ng παρασκευή ang araw ng paghahanda kaugnay ng kapistahan o Sabbath. Nililinaw ng “Araw ng Paghahanda” ang kahulugang panahunan, at natural na ipinapahayag ng “para sa Paskuwa” ang ugnayan ng genitibong τοῦ πάσχα.
- source_word: ὥρα ἦν ὡς ἕκτη
  choice: bandang ikaanim na oras na
  rationale: Pinananatili nito ang sinaunang paraan ng pagtukoy sa oras at ang pagtatantiya ng ὡς. Hindi ito tuwirang ginawang “bandang tanghali” upang hindi mapagpasyahan sa pangunahing teksto ang pinagtatalunang paraan ng pagbilang ng oras.
- source_word: λέγει
  choice: Sinabi niya
  rationale: Bagaman pangkasalukuyan ang anyong Griyego bilang historical present, mas natural sa makabagong Tagalog ang pangnagdaan sa salaysay. Nananatiling hindi pinapangalanan ang simuno, gaya ng Griyegong teksto.
- source_word: τοῖς Ἰουδαίοις
  choice: sa mga Judio
  rationale: Direktang katumbas ito ng pariralang Griyego. Hindi tahasang nililimitahan ng talata ang tinutukoy sa mga pinuno o mga taga-Judea lamang.
- source_word: Ἴδε
  choice: Narito
  rationale: Ang “Narito” ay natural ngunit maringal na pantawag-pansin sa Tagalog at angkop sa pampublikong paghaharap ni Pilato kay Jesus.
- source_word: ὁ βασιλεὺς ὑμῶν
  choice: ang inyong hari
  rationale: Natural na Tagalog ito na pinananatili ang diin, kabalintunaan, at pampolitikang talim ng pahayag.
theological_decisions:
- issue: Saklaw ng katawagang “mga Judio” sa Ebanghelyo ni Juan
  choice: Panatilihin ang “mga Judio” sa pangunahing teksto
  alternative: “mga pinunong Judio” o “mga taga-Judea”
  rationale: Τοῖς Ἰουδαίοις ang mismong nasa teksto. Maaaring mas makitid ang tinutukoy ayon sa konteksto, ngunit hindi iyon tahasang sinasabi rito; kaya inilagay ang posibilidad sa talababa sa halip na ipasok sa salin.
- issue: Sinaunang pagtukoy sa “ikaanim na oras”
  choice: Panatilihin ang “bandang ikaanim na oras” sa pangunahing teksto
  alternative: “bandang tanghali”
  rationale: Pinananatili ng salin ang anyo at likas na kalabuan ng sinaunang pagtukoy sa oras, pati ang pagtatantiya ng ὡς, nang hindi inaayos nang tahasan ang usaping kronolohikal.
translation_notes:
  register: 'Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Paskuwa” at ang teknikal na “Araw ng Paghahanda” upang mapanatili ang kontekstong Judio. Inilipat ang mga pananda ng talababa sa mga pariralang talagang ipinapaliwanag ng bawat talababa: [a] kasunod ng oras at [b] kasunod ng “mga Judio.”'
