  yaml_path: translation/nt/john/019/003.yaml
  text: And they came up to him and said[a], “Hail[b], King of the Jews!” And they were slapping him.
translation:
  language: tl
  text: Paulit-ulit silang lumalapit sa kanya at nagsasabi,[a] “Mabuhay ang Hari ng mga Judio!”[b] At pinagsasampal nila siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Patuloy silang lumalapit sa kanya at nagsasabi.” Ang mga pandiwang Griego ay maaaring magpahiwatig ng nagpapatuloy o paulit-ulit na pagkilos.
    reason: lexical_alternative
  - marker: b
    text: O “Binabati ka namin, Hari ng mga Judio!” Ang pagbati ay ginamit nila nang may panunuya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρχοντο πρὸς αὐτὸν καὶ ἔλεγον
  choice: Paulit-ulit silang lumalapit sa kanya at nagsasabi
  rationale: Ang dalawang pandiwang nasa imperfect ay maaaring maglarawan ng paulit-ulit na pagkilos sa eksenang ito. Likas sa Tagalog ang pagsasama ng “paulit-ulit” sa sugnay upang maipakita ang iteratibong puwersa nang hindi inuulit ang pananda sa bawat pandiwa.
- source_word: Χαῖρε
  choice: Mabuhay
  rationale: Sa kontekstong ito, ang Χαῖρε ay isang pormal ngunit mapanuyang pagbati sa isang diumano'y hari. Ang “Mabuhay” ay likas na katumbas sa Tagalog ng isang aklamasyong makahari at napapanatili ang panunuya.
- source_word: ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: ang Hari ng mga Judio
  rationale: Tuwirang pinananatili ang titulong pampolitika at mesianiko sa salaysay ng pagpapakasakit.
- source_word: ἐδίδοσαν αὐτῷ ῥαπίσματα
  choice: pinagsasampal nila siya
  rationale: Ang ῥαπίσματα ay mga sampal o hampas, at ang imperfect na ἐδίδοσαν ay nagpapahiwatig ng nagpapatuloy o paulit-ulit na pananakit. Ang “pinagsasampal” ay natural at malinaw sa modernong Tagalog.
theological_decisions:
- issue: Himig ng pagbati ng mga kawal kay Jesus
  choice: 'Isinalin bilang mapanuyang aklamasyong makahari: “Mabuhay ang Hari ng mga Judio!”'
  alternative: “Binabati ka namin, Hari ng mga Judio!”
  rationale: Ipinakikita ng agarang konteksto na kunwaring pagpaparangal at pangungutya ito. Naipahihiwatig ng “Mabuhay” ang pormal na aklamasyon nang hindi nagdaragdag ng paliwanag sa mismong talata.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “Judio” bilang karaniwang katawagan sa Bibliya at “pinagsasampal” upang natural na maipahayag ang paulit-ulit na pisikal na pang-aabuso.
