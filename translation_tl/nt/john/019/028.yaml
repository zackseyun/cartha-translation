  text: Μετὰ τοῦτο ⸀εἰδὼς ὁ Ἰησοῦς ὅτι ⸂ἤδη πάντα⸃ τετέλεσται ἵνα τελειωθῇ ἡ γραφὴ λέγει· Διψῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/028.yaml
  text: After this[a], Jesus, knowing that all things had already been completed, in order that the Scripture might be fulfilled, said, “I thirst.”
translation:
  language: tl
  text: Pagkatapos nito, si Jesus, na alam niyang natapos na ang lahat, ay nagsabi, upang matupad ang Kasulatan, “Nauuhaw ako.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ τοῦτο
  choice: Pagkatapos nito
  rationale: Likas na panandang temporal ito at pinananatili ang isahang demonstratibong τοῦτο.
- source_word: εἰδὼς
  choice: nang malaman
  rationale: Inihahayag ang kaalamang taglay ni Jesus kaugnay ng sumunod niyang sinabi; natural ito sa makabagong Tagalog.
- source_word: ἤδη πάντα τετέλεσται
  choice: natapos na ang lahat
  rationale: Ang aspektong perpekto ay ipinahihiwatig ng “natapos na,” isang pagkilos na ganap na at nasa kalagayang tapos.
- source_word: ἵνα τελειωθῇ ἡ γραφή
  choice: upang matupad ang Kasulatan
  rationale: Pinananatili ng “upang” ang layunin o kinalabasan ng ἵνα, habang ang “matupad” ang natural na gamit kapag Kasulatan ang paksa.
- source_word: λέγει
  choice: sinabi niya
  rationale: Isinalin ang Griyegong historical present sa nakaraang panahunan na mas natural sa salaysay na Tagalog.
- source_word: Διψῶ
  choice: Nauuhaw ako
  rationale: Tuwiran, natural, at marangal na pagpapahayag sa modernong Tagalog ng pangkasalukuyang pagkauhaw.
theological_decisions:
- issue: Ugnayan ng kaalaman ni Jesus, ng pagkakatapos ng lahat, at ng katuparan ng Kasulatan
  choice: Alam ni Jesus na natapos na ang lahat, at sinabi niya ang sumunod upang matupad ang Kasulatan.
  alternative: Maaaring unawain ang ἵνα bilang nagpapahiwatig ng kinalabasan, hindi lamang ng tahasang layunin.
  rationale: Pinananatili ng salin ang sintaks at tensiyong teolohikal nang hindi nagdaragdag ng isang mas malawak na paliwanag tungkol sa paunang kaalaman o pagtatakda.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “Kasulatan” bilang karaniwang katawagan sa banal na kasulatan. Walang footnote dahil ang ibinigay na English footnote ay hindi tumutugma sa marker sa tekstong Ingles at hindi kinakailangan para sa malinaw na saling Tagalog.
