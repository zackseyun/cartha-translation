  source_fidelity: Kailangang baguhin ang “nang malaman,” sapagkat karaniwan itong nagpapahiwatig na noon lamang nalaman ni Jesus ang bagay na iyon. Ang εἰδὼς ay isang pangkasalukuyang participle na naglalarawan kay Jesus bilang nakaaalam. Ang “na alam niyang” ay mas tapat sa aspektong ito. Ang “natapos na ang lahat,” “upang matupad ang Kasulatan,” at “Nauuhaw ako” ay maayos na tumutugon sa Griyego.
  naturalness: Natural at marangal ang iminungkahing rebisyon sa modernong Filipino Tagalog. Ang paglalagay ng layuning parirala bago ang tuwirang sipi ay nananatiling malinaw, bagaman bahagyang pormal, at pinananatili ang daloy ng orihinal.
  terminology: Ang “Kasulatan” ay angkop na katumbas ng ἡ γραφή sa kontekstong ito. Ang “Nauuhaw ako” ay natural, tuwiran, at angkop sa rehistro para sa Διψῶ.
