id: JHN.19.25
reference: John 19:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Εἱστήκεισαν δὲ παρὰ τῷ σταυρῷ τοῦ Ἰησοῦ ἡ μήτηρ αὐτοῦ καὶ ἡ ἀδελφὴ τῆς μητρὸς αὐτοῦ, Μαρία ἡ τοῦ Κλωπᾶ καὶ Μαρία ἡ Μαγδαληνή.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/025.yaml
  text: Standing by the cross of Jesus were his mother[a], and his mother's sister, Mary the wife of Clopas[b], and Mary Magdalene.
translation:
  language: tl
  text: Nakatayo sa tabi ng krus ni Jesus ang kanyang ina, ang kapatid na babae ng kanyang ina, si Maria na kaugnay ni Clopas[a], at si Maria Magdalena.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring isalin na “Maria ni Clopas.” Karaniwang inuunawa ito bilang “si Maria na asawa ni Clopas,” ngunit hindi tahasang sinasabi ng Griyego kung ano ang ugnayan niya kay Clopas.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring unawain na tatlong babae lamang ang binabanggit kung ang “kapatid na babae ng kanyang ina” ay siya ring “Maria na kaugnay ni Clopas.”
    reason: alternative_reading
lexical_decisions:
- source_word: Εἱστήκεισαν
  choice: Nakatayo
  rationale: Inilalarawan ang nagpapatuloy na kalagayan o tindig ng mga babae; likas sa Tagalog ang “nakatayo” sa ganitong salaysay.
- source_word: δὲ
  choice: hindi tahasang isinalin
  rationale: Mahinang panandang pasalaysay ito rito, hindi matinding pagsalungat. Sapat nang ipinahihiwatig ng pagkakasunod ng salaysay ang paglipat ng tagpo.
- source_word: παρὰ τῷ σταυρῷ τοῦ Ἰησοῦ
  choice: sa tabi ng krus ni Jesus
  rationale: Pinananatili ang diwa ng pagiging malapit sa krus at ang payak na ugnayang genitibo kay Jesus.
- source_word: ἡ μήτηρ αὐτοῦ
  choice: ang kanyang ina
  rationale: Tuwirang salin ng pariralang tumutukoy sa ina ni Jesus.
- source_word: ἡ ἀδελφὴ τῆς μητρὸς αὐτοῦ
  choice: ang kapatid na babae ng kanyang ina
  rationale: Nililinaw na babae ang kapatid, gaya ng pambabaeng anyo ng salitang Griyego, at iniiwasang ipasok ang pangalang hindi binanggit sa talata.
- source_word: Μαρία ἡ τοῦ Κλωπᾶ
  choice: si Maria na kay Clopas[a]
  rationale: Hindi tahasang sinasabi ng Griyego kung asawa, anak, o ibang kaugnayan kay Clopas. Ang “na kay Clopas” ay sadyang maikli at bukas, samantalang inilalahad sa talababa ang karaniwang pagpapakahulugang asawa.
- source_word: Μαρία ἡ Μαγδαληνή
  choice: si Maria Magdalena
  rationale: Karaniwan, malinaw, at kinikilalang anyong Filipino ng katawagang tumutukoy kay Maria mula sa Magdala.
theological_decisions:
- issue: Pagkakakilanlan at bilang ng mga babaeng nasa tabi ng krus
  choice: 'Inilalahad sa pangunahing teksto ang apat na babae: ang ina ni Jesus, ang kapatid nitong babae, si Maria na kay Clopas, at si Maria Magdalena.'
  alternative: Maaaring tatlong babae lamang ang tinutukoy kung ang “kapatid na babae ng kanyang ina” ay siya ring “Maria na kay Clopas.”
  rationale: Maaaring unawain ang masinsing sintaks ng Griyego sa dalawang paraan. Sinusunod ng pangunahing teksto ang payak na pagbasa sa apat na magkakaugnay na katawagan, ngunit hindi nito itinatago ang posibleng pagbasa sa tatlo.
- issue: Ugnayan ni Maria kay Clopas
  choice: Pinanatiling di-tiyak sa pangunahing teksto sa pariralang “si Maria na kay Clopas.”
  alternative: “Si Maria na asawa ni Clopas.”
  rationale: Walang salitang “asawa” sa Griyego. Bagaman karaniwan at kapani-paniwala ang ganitong pagkaunawa, hindi ito dapat gawing tiyak nang walang pahiwatig sa talababa.
translation_notes:
  register: Makabago at marangal na Filipino, na may payak na ayos ng pangungusap. Ginamit ang “kanyang” para sa likas at madaling basahing pagtukoy, at pinanatili ang mga tunay na kalabuan ng Griyego sa pamamagitan ng maingat na pangunahing salin at maiikling talababa.
