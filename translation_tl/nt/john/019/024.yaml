id: JHN.19.24
reference: John 19:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἶπαν οὖν πρὸς ἀλλήλους· Μὴ σχίσωμεν αὐτόν, ἀλλὰ λάχωμεν περὶ αὐτοῦ τίνος ἔσται· ἵνα ἡ γραφὴ πληρωθῇ ⸂ἡ λέγουσα⸃· Διεμερίσαντο τὰ ἱμάτιά μου ἑαυτοῖς καὶ ἐπὶ τὸν ἱματισμόν μου ἔβαλον κλῆρον. Οἱ μὲν οὖν στρατιῶται ταῦτα ἐποίησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/024.yaml
  text: So they said to one another[a], “Let us not tear it, but cast lots for it to decide whose it will be,” so that the Scripture might be fulfilled that says, “They divided my garments among themselves[b], and for my clothing they cast a lot.” So the soldiers did these things.
translation:
  language: tl
  text: Kaya sinabi nila sa isa't isa, “Huwag natin itong punitin. Sa halip, magpalabunutan tayo[a] kung kanino ito mapupunta,” upang matupad ang Kasulatan na nagsasabi, “Pinaghati-hatian nila ang aking mga damit, at nagpalabunutan sila para sa aking kasuotan.”[b] Gayon nga ang ginawa ng mga sundalo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, magbunutan tayo para rito.
    reason: lexical_alternative
  - marker: b
    text: Sipi mula sa Awit 22:18.
    reason: cross_reference
lexical_decisions:
- source_word: σχίσωμεν
  choice: punitin
  rationale: Karaniwang makabagong salitang Tagalog ito para sa pagpunit ng tela at tuwirang naghahatid sa diwa ng pandiwa.
- source_word: αὐτόν
  choice: ito
  rationale: Bagaman panlalaki ang anyong Griyego, tumutukoy ang panghalip sa kasuotang binanggit sa konteksto; likas sa Tagalog ang walang-kasariang “ito.”
- source_word: λάχωμεν
  choice: magpalabunutan tayo
  rationale: Likas at malinaw na pariralang Tagalog ito para sa pagpapasiya kung kanino mapupunta ang isang bagay sa pamamagitan ng palabunutan.
- source_word: περὶ αὐτοῦ τίνος ἔσται
  choice: kung kanino ito mapupunta
  rationale: Natural nitong ipinahahayag ang tanong tungkol sa magiging may-ari nang hindi nagdaragdag ng hindi nasa Griyego.
- source_word: ἵνα ἡ γραφὴ πληρωθῇ
  choice: upang matupad ang Kasulatan
  rationale: Pinananatili nito ang pormula ni Juan tungkol sa katuparan at ang ugnayang ipinahahayag ng ἵνα, nang hindi ipinapaliwanag nang higit ang sanhi o layunin.
- source_word: ἡ λέγουσα
  choice: na nagsasabi
  rationale: Natural itong pambungad sa sipi at tapat sa tungkulin ng participle.
- source_word: Διεμερίσαντο
  choice: Pinaghati-hatian nila
  rationale: Ipinahahayag nito ang paghahati at pamamahagi sa magkakasangkot, kasama ang distributibong diwa ng ἑαυτοῖς.
- source_word: ἱμάτιά
  choice: mga damit
  rationale: Malinaw at pangkaraniwang tawag ito sa maramihang kasuotan.
- source_word: ἑαυτοῖς
  choice: pinaghati-hatian
  rationale: Ang hulaping at reduplikasyong Tagalog sa “pinaghati-hatian” ay likas na naghahatid ng pamamahagi sa kanilang sarili.
- source_word: ἱματισμόν
  choice: kasuotan
  rationale: Pinananatili nito ang bahagyang pagkakaiba sa naunang “mga damit” at nababagay sa marangal na himig ng sipi.
- source_word: ἔβαλον κλῆρον
  choice: nagpalabunutan sila
  rationale: Ito ang likas na katumbas sa Tagalog ng paghahagis o pagkuha ng palabunutan, kahit hindi likas ipilit sa Tagalog ang isahang anyo ng κλῆρον.
- source_word: Οἱ μὲν οὖν στρατιῶται ταῦτα ἐποίησαν
  choice: Gayon nga ang ginawa ng mga sundalo
  rationale: Likas na buod ito sa Tagalog na pinananatili ang pagpapatibay ng μὲν οὖν at ang pagtukoy sa mga kilos na kababanggit lamang.
theological_decisions:
- issue: Ugnayan ng ginawa ng mga sundalo at ng katuparan ng Kasulatan sa ἵνα ἡ γραφὴ πληρωθῇ
  choice: Isinalin bilang “upang matupad ang Kasulatan,” na tuwirang pinananatili ang pahayag ng katuparan.
  alternative: “kaya natupad ang Kasulatan” bilang tahasang bunga lamang
  rationale: Pinananatili ng salin ang teolohikal na tensiyon sa pagitan ng layunin, katuparan ng Kasulatan, at kusang kilos ng mga sundalo, nang hindi nagdaragdag ng mas matinding deterministikong paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “magpalabunutan” bilang pangkaraniwang ekspresyon, habang pinanatili ang bahagyang mas mataas na rehistro ng “Kasulatan” at “kasuotan” sa sipi.
