id: JHN.19.16
reference: John 19:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τότε οὖν παρέδωκεν αὐτὸν αὐτοῖς ἵνα σταυρωθῇ. Παρέλαβον ⸀οὖν τὸν ⸀Ἰησοῦν·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/016.yaml
  text: Then he handed him over to them to be crucified[b][a]. So they took Jesus.
translation:
  language: tl
  text: Kaya ibinigay niya siya sa kanila upang ipako sa krus.[a] At kinuha nila si Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tahasang pinapangalanan sa talatang ito kung sino ang tinutukoy ng “kanila” at “nila”; ipinahihiwatig lamang iyon ng konteksto.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε οὖν
  choice: Kaya
  rationale: Pinagsasama nito sa natural na Tagalog ang pag-usad ng salaysay at ang bunga ng naunang pangyayari, nang hindi gumagamit ng mabigat na dobleng pang-ugnay.
- source_word: παρέδωκεν
  choice: ibinigay ... sa
  rationale: Ipinahihiwatig ng pandiwa ang paglilipat kay Jesus sa kapangyarihan o pangangalaga ng iba. Natural sa Tagalog ang “ibinigay ... sa” at hindi nito dinaragdagan ang teksto ng isang tiyak na legal o teolohikal na pakahulugan.
- source_word: αὐτὸν αὐτοῖς
  choice: siya sa kanila
  rationale: Pinananatili ang mga panghalip ng Griyego at hindi tahasang pinapangalanan ang tinutukoy ng “kanila.”
- source_word: ἵνα σταυρωθῇ
  choice: upang ipako sa krus
  rationale: Pinananatili ng “upang” ang layunin ng sugnay, at ipinapahayag ng “ipako sa krus” ang pasibong diwa nang natural sa Tagalog.
- source_word: Παρέλαβον
  choice: kinuha nila
  rationale: Sa konteksto, tumutukoy ito sa pagtanggap o pagkuha kay Jesus sa kanilang kapangyarihan. Ang “kinuha nila” ang pinakasimple at natural na salaysay.
- source_word: οὖν
  choice: At
  rationale: Sa ikalawang pangungusap, maayos na ipinagpapatuloy ng “At” ang salaysay nang hindi paulit-ulit o mabigat ang pang-ugnay.
- source_word: Ἰησοῦν
  choice: Jesus
  rationale: Karaniwang anyo ng pangalan sa modernong Filipino Tagalog.
theological_decisions:
- issue: Ang tinutukoy ng αὐτοῖς at ng di-hayag na simuno ng Παρέλαβον
  choice: Panatilihin ang pangkalahatang “kanila” at “nila.”
  alternative: Tukuyin sila bilang mga punong pari, kanilang mga tauhan, o mga kawal na Romano.
  rationale: Hindi tahasang pinapangalanan ng Griyegong teksto sa talatang ito ang grupo. Ang pagtukoy sa isang partikular na pangkat ay lulutas sa kalabuan na pinananatili mismo ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino Tagalog. Pinanatili ang maikling takbo ng salaysay, ang layuning ipinahahayag ng ἵνα, at ang hindi tahasang pagkakakilanlan ng mga panghalip.
