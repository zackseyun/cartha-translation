  source_fidelity: Tapat ang salin sa Griyego. Ang “Kaya” ay natural na pinagsamang pagsasalin ng τότε οὖν sa daloy ng Filipino, ang “ibinigay niya siya sa kanila” ay wasto para sa παρέδωκεν αὐτὸν αὐτοῖς, at pinananatili ng “upang ipako sa krus” ang layuning ipinahahayag ng ἵνα σταυρωθῇ. Ang “kinuha nila si Jesus” ay tuwirang tumutugma sa Παρέλαβον οὖν τὸν Ἰησοῦν.
  naturalness: Malinaw, maigsi, at natural ang makabagong Filipino Tagalog. Ang paggamit ng “ipako sa krus” ay karaniwang idiomatikong paraan ng pagsasabi ng pagpapako sa krus at umaangkop sa marangal na rehistro ng salaysay.
  terminology: Ang “ipako sa krus” at “Jesus” ay pamantayan at angkop. Hindi pinapangalanan ng salin ang hindi tahasang tinukoy na mga tatanggap o kumukuha kay Jesus, alinsunod sa kalabuan ng Griyego.
