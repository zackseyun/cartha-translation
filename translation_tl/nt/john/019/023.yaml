revisions:
- from: Kaya, nang maipako na ng mga kawal si Jesus sa krus, kinuha nila ang kaniyang mga panlabas na kasuotan[a] at hinati ang mga iyon sa apat—tig-iisang bahagi ang bawat kawal—pati na ang tunika. Ang tunika naman ay walang tahi[c], hinabi mula sa itaas[b] nang buo.
  to: Kaya, nang maipako na ng mga kawal si Jesus sa krus, kinuha nila ang kaniyang mga panlabas na kasuotan[a] at hinati ang mga iyon sa apat—tig-iisang bahagi ang bawat kawal. Kinuha rin nila ang tunika. Ang tunika naman ay walang tahi[c], hinabi mula sa itaas[b] sa buong haba nito.
