  text: οἱ οὖν στρατιῶται ὅτε ἐσταύρωσαν τὸν Ἰησοῦν ἔλαβον τὰ ἱμάτια αὐτοῦ καὶ ἐποίησαν τέσσαρα μέρη, ἑκάστῳ στρατιώτῃ μέρος, καὶ τὸν χιτῶνα. ἦν δὲ ὁ χιτὼν ἄραφος, ἐκ τῶν ἄνωθεν ὑφαντὸς δι’ ὅλου·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/023.yaml
  text: So when the soldiers had crucified Jesus[a], they took his outer garments and made four parts, a part for each soldier, and also the tunic. Now the tunic was seamless[c][b], woven from the top throughout.
translation:
  language: tl
  text: Kaya, nang maipako na ng mga kawal si Jesus sa krus, kinuha nila ang kaniyang mga panlabas na kasuotan[a] at hinati ang mga iyon sa apat—tig-iisang bahagi ang bawat kawal. Kinuha rin nila ang tunika. Ang tunika naman ay walang tahi[c], hinabi mula sa itaas[b] sa buong haba nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kasuotan.” Maaaring tumukoy ang salitang Griego sa pananamit sa pangkalahatan, ngunit malamang na mga panlabas na kasuotan ang ibig sabihin dito, na ipinagkaiba sa tunikang hiwalay na binanggit.
    reason: lexical_alternative
  - marker: b
    text: O “mula sa pinakataas na bahagi.” Sa kontekstong ito, malamang na tumutukoy ito sa pagsisimula ng paghahabi sa itaas ng tunika.
    reason: lexical_alternative
  - marker: c
    text: O “hinabi nang iisang buo sa kabuuan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ οὖν στρατιῶται
  choice: Kaya ... ang mga kawal
  rationale: Ang οὖν ay nag-uugnay at nagpapausad sa salaysay; natural sa Tagalog ang “Kaya” nang hindi labis na ginagawang lohikal na konklusyon. Ang στρατιῶται ay “mga kawal.”
- source_word: ὅτε ἐσταύρωσαν τὸν Ἰησοῦν
  choice: nang maipako na ng mga kawal si Jesus sa krus
  rationale: Ipinakikita ng ὅτε kasama ng aorist na nauna ang pagpapako sa kasunod na paghahati ng mga kasuotan. Ang “maipako ... sa krus” ay malinaw at likas na salin ng ἐσταύρωσαν.
- source_word: ἔλαβον τὰ ἱμάτια αὐτοῦ
  choice: kinuha nila ang kaniyang mga panlabas na kasuotan
  rationale: Maaaring tumukoy ang ἱμάτια sa mga kasuotan sa pangkalahatan, ngunit malamang na mga panlabas na kasuotan dito dahil hiwalay na binanggit ang χιτών.
- source_word: ἐποίησαν τέσσαρα μέρη, ἑκάστῳ στρατιώτῃ μέρος
  choice: hinati ang mga iyon sa apat—tig-iisang bahagi ang bawat kawal
  rationale: Likas na ipinahahayag sa Tagalog ang literal na “gumawa ng apat na bahagi” bilang paghahati sa apat; pinananatili ng “tig-iisang bahagi” ang pamamahagi sa bawat kawal.
- source_word: καὶ τὸν χιτῶνα
  choice: pati na ang tunika
  rationale: Ang χιτών ay kasuotang isinusuot malapit sa katawan. Pinananatili ng “tunika” ang pagkakaiba nito sa mga panlabas na kasuotan, at ipinahahayag ng “pati na” ang dagdag na pagbanggit.
- source_word: ἦν δὲ ὁ χιτὼν ἄραφος
  choice: Ang tunika naman ay walang tahi
  rationale: Ang δέ ay banayad na transisyon o pagtutok, na likas na naihahatid ng “naman.” Ang ἄραφος ay literal na “walang tahi.”
- source_word: ἐκ τῶν ἄνωθεν
  choice: mula sa itaas
  rationale: Pinananatili nito ang maaaring kahulugang “mula sa itaas” o “mula sa pinakataas na bahagi” nang hindi labis na nililimitahan ang parirala.
- source_word: ὑφαντὸς δι’ ὅλου
  choice: hinabi ... nang buo
  rationale: Ang ὑφαντός ay “hinabi,” at ang δι’ ὅλου ay tumutukoy sa kabuuang lawak o tuloy-tuloy na pagkakahabi ng tunika.
theological_decisions:
- issue: Posibleng simbolikong pagbasa sa tunikang walang tahi
  choice: Isinalin nang naglalarawan lamang sa pagkakayari ng tunika.
  alternative: Ipahiwatig na sagisag ito ng kasuotang makasaserdote o ng pagkakaisa ng iglesya.
  rationale: Ang talata mismo ay naglalarawan sa kasuotan at sa ginawa ng mga kawal; hindi nito tahasang ibinibigay ang mga simbolikong pakahulugang iyon.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “kawal” at “kasuotan” para sa dignidad ng rehistro, at “tunika” upang mapanatili ang pagkakaiba ng χιτών sa ἱμάτια. Inayos ang mga pananda ng talababa ayon sa kaugnay na parirala.
