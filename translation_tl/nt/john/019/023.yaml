  naturalness: Marangal at modernong Filipino ang rehistro. Mas malinaw at mas likas ang paghihiwalay sa kilos na pagkuha sa tunika. Ang “sa buong haba nito” ay mas idiomatiko at mas malinaw kaysa “nang buo” para sa δι’ ὅλου.
