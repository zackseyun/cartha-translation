  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸂ἐκραύγασαν οὖν ἐκεῖνοι⸃· Ἆρον ἆρον, σταύρωσον αὐτόν. λέγει αὐτοῖς ὁ Πιλᾶτος· Τὸν βασιλέα ὑμῶν σταυρώσω; ἀπεκρίθησαν οἱ ἀρχιερεῖς· Οὐκ ἔχομεν βασιλέα εἰ μὴ Καίσαρα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/015.yaml
  text: So they cried out[a], “Away, away! Crucify him!” Pilate said to them, “Shall I crucify your king?” The chief priests answered, “We have no king except Caesar.”
translation:
  language: tl
  text: Kaya sumigaw sila, “Alisin siya! Alisin siya! Ipako siya sa krus!” Sinabi sa kanila ni Pilato, “Ipapako ko ba sa krus ang inyong hari?” Sumagot ang mga punong pari, “Wala kaming hari maliban kay Cesar.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκραύγασαν οὖν ἐκεῖνοι
  choice: Kaya sumigaw sila
  rationale: Ang ἐκραύγασαν ay malakas na pagsigaw, at ang οὖν ay nagpapakita ng bunga o pagpapatuloy ng salaysay. Likas sa modernong Tagalog ang “Kaya sumigaw sila,” habang hindi kailangang gawing tahasan ang diin ng ἐκεῖνοι.
- source_word: Ἆρον ἆρον
  choice: Alisin siya! Alisin siya!
  rationale: Sa kontekstong ito, ang inuulit na pautos na αἴρω ay panawagang alisin si Jesus. Idinagdag ang “siya,” na malinaw sa konteksto, upang maging buo at likas ang sigaw sa Tagalog; pinanatili ang pag-uulit at tindi.
- source_word: σταύρωσον αὐτόν
  choice: Ipako siya sa krus
  rationale: Ito ang malinaw, makasaysayan, at karaniwang salin ng σταυρόω sa konteksto ng Romanong pagbitay.
- source_word: λέγει αὐτοῖς ὁ Πιλᾶτος
  choice: Sinabi sa kanila ni Pilato
  rationale: Ang pangkasaysayang pangkasalukuyan na λέγει ay likas na isinasalin sa nagdaang panahon sa salaysay na Tagalog.
- source_word: Τὸν βασιλέα ὑμῶν σταυρώσω;
  choice: Ipapako ko ba sa krus ang inyong hari?
  rationale: Ipinahahayag ng tanong na may deliberatibong subjunctive ang mapanuyang hamon ni Pilato. Ang “inyong hari” ay bahagyang marangal at angkop sa dignidad ng teksto.
- source_word: οἱ ἀρχιερεῖς
  choice: ang mga punong pari
  rationale: Tumutukoy ang maramihang ἀρχιερεῖς sa mga nangungunang awtoridad na pari; “mga punong pari” ang malinaw at nakaugaliang katumbas.
- source_word: Οὐκ ἔχομεν βασιλέα εἰ μὴ Καίσαρα
  choice: Wala kaming hari maliban kay Cesar
  rationale: Ang εἰ μὴ ay naghahayag ng tanging eksepsiyon. Pinananatili ng “maliban kay Cesar” ang eksklusibo at matinding pahayag nang hindi nagdaragdag ng interpretasyong teolohikal.
theological_decisions:
- issue: Ang deklarasyon ng mga punong pari tungkol sa kanilang katapatan sa pamahalaan
  choice: Wala kaming hari maliban kay Cesar
  alternative: Wala kaming ibang hari kundi si Cesar
  rationale: Pinananatili ng napiling salin ang tahasang pagtatakwil sa sinumang karibal na hari sa agarang konteksto, ngunit hindi nito ipinapaliwanag o nilulutas ang mas malawak na teolohikal na tensiyon ng pahayag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignificado, at angkop sa pampublikong pagbasa. Ginamit ang “inyong” sa tanong ni Pilato para sa bahagyang marangal na tono, at ang mas karaniwang “kaming” sa mariing sagot ng mga punong pari.
