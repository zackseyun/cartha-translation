  source_fidelity: 'Tumpak ang pangunahing kahulugan ng draft: ang mga kawal ay gumawa ng korona mula sa mga tinik, inilagay ito sa ulo ni Jesus, at dinamitan siya ng kulay-ubeng kasuutan. Gayunman, ang nag-iisang pandiwang “nagtirintas” ay hindi sapat na malinaw na naghahayag na ang pagtitirintas (πλέξαντες, aorist participle) ay naunang ginawa bago ang dalawang pangunahing kilos.'
  naturalness: Natural ang karamihan ng bokabularyo, kabilang ang “mga kawal,” “korona,” at “damit na kulay-ube.” Mas malinaw at mas maayos ang daloy sa modernong Tagalog kung gagawing “Matapos magtirintas ang mga kawal ...” at gagamit ng tahasang maramihang tagaganap sa mga kasunod na pandiwa.
  terminology: Ang “koronang gawa sa mga tinik” ay angkop para sa στέφανον ἐξ ἀκανθῶν at pinananatili ang konkretong materyal. Ang “damit na kulay-ube” ay isang maingat na malawak na katumbas ng ἱμάτιον πορφυροῦν; hindi nito labis na itinatakda ang uri ng kasuotan. Hindi dinaragdagan ng salin ang pahiwatig ng panunuya na wala sa mismong talata.
