  text: καὶ οἱ στρατιῶται πλέξαντες στέφανον ἐξ ἀκανθῶν ἐπέθηκαν αὐτοῦ τῇ κεφαλῇ, καὶ ἱμάτιον πορφυροῦν περιέβαλον αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/002.yaml
  text: And the soldiers, after weaving a crown out of thorns, put it on his head and clothed him in a purple robe,
translation:
  language: tl
  text: Matapos magtirintas ang mga kawal ng koronang gawa sa mga tinik, ipinutong nila ito sa kanyang ulo at isinuot nila sa kanya ang isang damit na kulay-ube.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “at ibinalot nila sa kanya ang isang damit na kulay-ube.”'
    reason: Ipinapakita nito ang mas literal na diwa ng περιέβαλον, na maaaring tumukoy sa paglalagay o pagbabalot ng kasuutan sa paligid ng isang tao.
lexical_decisions:
- source_word: στρατιῶται
  choice: mga kawal
  rationale: Karaniwan at marangal na katawagan sa mga sundalong Romano sa salaysay; natural ito sa makabagong Tagalog.
- source_word: πλέξαντες
  choice: nagtirintas
  rationale: Ipinahihiwatig ng pandiwa ang paghahabi o pagtitirintas ng mga tinik upang mabuo ang korona. Pinananatili ng pagkakasunod ng mga sugnay ang naunang kilos ng aorist participle.
- source_word: στέφανον ἐξ ἀκανθῶν
  choice: koronang gawa sa mga tinik
  rationale: Ang “korona” ay angkop sa kunwaring maharlikang pagkilala sa konteksto, at malinaw na ipinapahayag ng “gawa sa mga tinik” ang materyales nang hindi dinaragdagan ang teksto.
- source_word: ἐπέθηκαν αὐτοῦ τῇ κεφαλῇ
  choice: ipinutong iyon sa kanyang ulo
  rationale: Ang “ipinutong” ang natural at tiyak na pandiwa sa Tagalog para sa paglalagay ng korona sa ulo; ang “iyon” ay tumutukoy nang malinaw sa korona.
- source_word: ἱμάτιον πορφυροῦν
  choice: isang damit na kulay-ube
  rationale: Malawak ang kahulugan ng ἱμάτιον bilang kasuutan o panlabas na damit, kaya hindi ito labis na tinutukoy bilang isang partikular na uri ng balabal. Ang “kulay-ube” ay malinaw na katumbas ng πορφυροῦν at pinananatili ang maharlikang pahiwatig.
- source_word: περιέβαλον αὐτόν
  choice: isinuot sa kanya
  rationale: Natural na Tagalog ito para sa paglalagay ng kasuutan sa isang tao, habang hindi ipinipilit kung ibinalot o ibinalabal lamang ang damit.
theological_decisions:
- issue: Larawang kunwaring maharlika sa ginawa ng mga kawal
  choice: Tuwirang isinalaysay ang korona, mga tinik, at damit na kulay-ube nang walang idinagdag na paliwanag na ito ay panunuya.
  alternative: Idagdag na “kinutya nila siya bilang hari” o gumamit ng mas tahasang interpretibong pananalita.
  rationale: Makikita sa konteksto ang panunuya, ngunit hindi ito tahasang sinasabi sa mismong talata. Pinananatili ng salin ang mga kilos at simbolo ng Griyego nang hindi inuunahan ang mambabasa sa interpretasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mga kawal” at “korona” bilang pamilyar na mga salita, samantalang iniwasan ang labis na espesipikong pagtukoy sa ἱμάτιον. Ang pangungusap ay sumusunod sa sunod-sunod na kilos ng Griyego at nananatiling madaling basahin nang malakas.
