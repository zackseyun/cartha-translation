base_translation:
  language: en
  yaml_path: translation/nt/john/019/010.yaml
  text: So Pilate said to him[a], “Will you not speak to me? Do you not know that I have authority to release you and authority to crucify you?”
translation:
  language: tl
  text: Kaya sinabi ni Pilato sa kanya, “Hindi ka ba magsasalita sa akin? Hindi mo ba alam na may awtoridad[a] akong palayain ka at may awtoridad akong ipako ka sa krus?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kapangyarihan” o “karapatan.” Ang salitang Griyego na exousia ay maaaring tumukoy sa awtoridad, karapatan, o kapangyarihan. Dito, ang pag-aangkin ni Pilato ay nasa kontekstong legal at pampamahalaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει οὖν αὐτῷ ὁ Πιλᾶτος
  choice: Kaya sinabi sa kanya ni Pilato
  rationale: Ang οὖν ay nag-uugnay at nagsusulong sa salaysay; natural sa Tagalog ang “Kaya” at naipapakita nito ang tugon ni Pilato sa naunang pananahimik ni Jesus. Pinanatili ang di-tuwirang layon na αὐτῷ bilang “sa kanya.”
- source_word: Ἐμοὶ οὐ λαλεῖς
  choice: Ayaw mo bang magsalita sa akin?
  rationale: Ang nakaharap na Ἐμοὶ ay mariing tumutukoy kay Pilato. Sa kontekstong ito, natural na naihahayag ng “Ayaw mo bang…” ang mapanumbat na retorikal na tanong, nang hindi ginagawa itong utos.
- source_word: οὐκ οἶδας ὅτι
  choice: Hindi mo ba alam na
  rationale: Tuwirang katumbas ito ng retorikal na tanong at ng sugnay na nagpapahayag ng nilalaman ng inaasahang kaalaman.
- source_word: ἐξουσίαν ἔχω
  choice: may kapangyarihan akong
  rationale: Sa Filipino, “kapangyarihan” ay maaaring tumukoy sa awtoridad o karapatang mamahala, at natural itong gamitin sa legal at pampamahalaang konteksto. Nililinaw sa talababa ang lawak ng kahulugan ng ἐξουσία.
- source_word: ἀπολῦσαί σε
  choice: palayain ka
  rationale: Sa hudisyal na konteksto, ang ἀπολύω ay tumutukoy sa pagpapalaya o pagpapakawala. Ang “palayain ka” ay malinaw at hindi kinakailangang mangahulugang pormal na pagpapawalang-sala.
- source_word: καὶ ἐξουσίαν ἔχω σταυρῶσαί σε
  choice: at may kapangyarihan akong ipako ka sa krus
  rationale: Pinanatili ang pag-uulit ng ἐξουσίαν ἔχω upang maipakita ang mariing paghahambing ng dalawang sinasabing magagawa ni Pilato. Ang “ipako ka sa krus” ay natural at tuwirang salin ng σταυρόω sa konteksto.
theological_decisions:
- issue: Ang likas at pinagmulan ng sinasabing ἐξουσία ni Pilato
  choice: Isinalin bilang “kapangyarihan” nang hindi pinatutunayang ganap o nagsasarili ang kapangyarihan ni Pilato.
  alternative: “awtoridad” o “karapatan”
  rationale: Iniulat lamang ng talata ang pag-aangkin ni Pilato. Hindi nito inuunahan o nilulutas ang sagot ni Jesus sa kasunod na talata tungkol sa pinagmulan ng kapangyarihang iyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mapanumbat na tono ni Pilato at ang pag-uulit ng kanyang pag-aangkin, habang hindi nilulutas ang teolohikal na tensiyong sasagutin sa susunod na talata.
