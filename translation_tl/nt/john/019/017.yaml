  text: καὶ βαστάζων ⸂αὑτῷ τὸν σταυρὸν⸃ ἐξῆλθεν εἰς ⸀τὸν λεγόμενον Κρανίου Τόπον, ⸀ὃ λέγεται Ἑβραϊστὶ Γολγοθα,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/017.yaml
  text: And carrying the cross by himself[a], he went out to the place called Skull Place, which in Hebrew is called Golgotha.
translation:
  language: tl
  text: At habang pasan niya mismo ang krus, lumabas siya at nagtungo sa lugar na tinatawag na Lugar ng Bungo, na sa Hebreo[a] ay tinatawag na Golgota.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring “sa Aramaiko.” Ang salitang ginamit ni Juan na “sa Hebreo” ay maaari ring tumukoy sa lokal na wikang Semitiko sa Judea.
    reason: lexical_alternative
lexical_decisions:
- source_word: βαστάζων
  choice: pasan
  rationale: Tumutukoy ang pandiwari sa aktuwal na pagdadala o pagpasan; likas at malinaw sa Filipino ang “pasan” sa kontekstong ito.
- source_word: αὑτῷ τὸν σταυρόν
  choice: pasan niya mismo ang krus
  rationale: Inihahayag nito ang diin ng reflexive dative—siya mismo ang may pasan—nang hindi ginagawang tahasang pagmamay-ari ang krus.
- source_word: σταυρός
  choice: krus
  rationale: Ito ang karaniwan at tiyak na katumbas sa salaysay ng pagpapako; hindi ipinipilit ng salitang Griyego rito ang mas makitid na “pahalang na kahoy ng krus.”
- source_word: ἐξῆλθεν
  choice: lumabas siya
  rationale: Direktang inilalarawan ng aorist na pandiwa ang paglabas; natural ito sa makabagong Filipino.
- source_word: τὸν λεγόμενον Κρανίου Τόπον
  choice: lugar na tinatawag na Lugar ng Bungo
  rationale: Pinananatili ang pormula ng pagpapangalan at ang dalawang sangkap na “lugar” at “bungo,” habang gumagamit ng malinaw na anyo ng pangalang-pook sa Filipino.
- source_word: ὃ λέγεται
  choice: na … ay tinatawag na
  rationale: Karaniwang pormula ito ng pagbibigay ng pangalan at tuwirang naipapahayag sa Filipino.
- source_word: Ἑβραϊστί
  choice: sa Hebreo
  rationale: Sinusunod ng pangunahing teksto ang tahasang anyo ng Griyego, habang inilalagay sa talababa ang posibilidad na tumukoy ito sa Aramaico.
- source_word: Γολγοθα
  choice: Golgota
  rationale: Isinalin sa nakaugaliang transliterasyong Filipino ang pangalang-pook.
theological_decisions:
- issue: Ang wikang tinutukoy ng Ἑβραϊστί
  choice: sa Hebreo
  alternative: sa Aramaico
  rationale: Tahasang “sa Hebreo” ang Griyego, ngunit maaaring gamitin ni Juan ang katawagan para sa lokal na wikang Semitiko ng Judea. Pinananatili sa teksto ang literal na pagtukoy at sa talababa ang lehitimong alternatibo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “pasan niya mismo” upang mapanatili ang diin ng Griyego nang hindi nagdaragdag ng di-tiyak na kahulugang pagmamay-ari.
