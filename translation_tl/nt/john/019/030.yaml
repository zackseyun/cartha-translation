revisions:
- from: Kaya, nang matanggap ni Jesus ang maasim na alak[a], sinabi niya, “Natapos na[b].” At pagkayuko ng kanyang ulo, ibinigay niya ang kanyang espiritu[c].
  to: Kaya nang matanggap ni Jesus ang maasim na alak[a], sinabi niya, “Natapos na[b].” At nang iyuko niya ang kanyang ulo, ibinigay niya ang kanyang espiritu[c].
  rationale: 'Binago ang participial na parirala upang maging malinaw at natural ang kilos ni Jesus sa Filipino, habang pinananatili ang pagkakasunod ng Griyego: pagyuko ng ulo, saka pagbibigay ng espiritu. Inayos ang alternatibo sa talababa para sa Τετέλεσται upang hindi nito bigyang-kahulugan ang walang-tahasang-layon na pandiwa bilang partikular na “katuparan.” Walang pagbabagong doktrinal ang ginawa.'
