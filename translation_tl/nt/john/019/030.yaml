  text: ὅτε οὖν ἔλαβεν τὸ ὄξος ὁ Ἰησοῦς εἶπεν· Τετέλεσται, καὶ κλίνας τὴν κεφαλὴν παρέδωκεν τὸ πνεῦμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/030.yaml
  text: So when Jesus had received the sour wine[a], he said, “It is finished,” and bowing his head[c][b], he gave up his spirit.
translation:
  language: tl
  text: Kaya nang matanggap ni Jesus ang maasim na alak[a], sinabi niya, “Natapos na[b].” At nang iyuko niya ang kanyang ulo, ibinigay niya ang kanyang espiritu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “suka” o “sukang alak.” Ang salitang Griyego na ὄξος ay tumutukoy sa alak na umasim.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Naganap na” o “Naisakatuparan na.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “nalagutan siya ng hininga.” Mas literal sa Griyego ang “ibinigay niya ang kanyang espiritu.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτε οὖν
  choice: Kaya, nang
  rationale: Pinananatili ng “kaya” ang pagpapatuloy o bunga sa salaysay na ipinahihiwatig ng οὖν, habang natural na ipinahahayag ng “nang” ang χρονological na ugnayan ng ὅτε.
- source_word: ἔλαβεν
  choice: matanggap
  rationale: Sa konteksto, tinanggap ni Jesus ang maasim na alak na iniabot sa kanya. Mas natural dito ang “matanggap” kaysa “kunin,” at ipinakikita ng pagkakabuo ng pangungusap na nauna ito sa kanyang pagsasalita.
- source_word: τὸ ὄξος
  choice: ang maasim na alak
  rationale: Ang ὄξος ay alak na umasim o wine vinegar. Malinaw sa karaniwang mambabasa ang “maasim na alak” at hindi ito madaling mapagkamalang modernong purong suka.
- source_word: Τετέλεσται
  choice: Natapos na
  rationale: Ang anyong perfect ng τελέω ay nagpapahayag ng pagkakumpleto na nananatili ang resulta. Naipahihiwatig ito sa natural na Tagalog ng “natapos na,” nang hindi tinutukoy kung ano ang natapos.
- source_word: κλίνας τὴν κεφαλήν
  choice: pagkayuko ng kanyang ulo
  rationale: Pinananatili nito ang kilos ng aorist participle bilang kilos na kasabay o kaagad na nauna sa pangunahing pandiwa, at natural itong basahin sa Tagalog.
- source_word: παρέδωκεν
  choice: ibinigay
  rationale: Ang παραδίδωμι ay literal na “ibigay,” “ipasa,” o “ipaubaya.” Kasama ng πνεῦμα, ang “ibinigay” ay nagpapanatili sa sadyang anyo ng pahayag sa halip na gawing payak lamang na “namatay.”
- source_word: τὸ πνεῦμα
  choice: ang kanyang espiritu
  rationale: Bagaman may tiyak na pantukoy ang Griyego, kailangan sa natural na Tagalog ang panghalip na paari. Pinananatili ng “espiritu” ang saklaw at bigat ng πνεῦμα, na maaari ring tumukoy sa hininga o buhay ayon sa konteksto.
theological_decisions:
- issue: Kung ang παρέδωκεν τὸ πνεῦμα ay dapat gawing karaniwang idyoma lamang para sa pagkamatay o isaling malapit sa mismong pananalita ng Griyego.
  choice: ibinigay niya ang kanyang espiritu
  alternative: nalagot ang kanyang hininga / namatay siya
  rationale: Mas tiyak ang Griyego kaysa sa payak na pahayag na namatay si Jesus. Pinananatili ng salin ang personal at kusang anyo ng kilos sa salaysay ni Juan, ngunit hindi nito nililinaw nang lampas sa teksto kung “espiritu,” “hininga,” o buhay ang pangunahing diin.
- issue: Kung ang Τετέλεσται ay tumutukoy sa pagtatapos, katuparan, o pagkakaganap.
  choice: Natapos na
  alternative: Naganap na / Natupad na
  rationale: Walang tahasang layon ang pandiwa sa Griyego. Ang “Natapos na” ay nagpapanatili sa kawalan ng tinukoy na layon at sa diwa ng ganap na pagkakumpleto, habang inilalahad sa talababa ang lehitimong kahulugang katuparan o pagkakaganap.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Iniwasan ang labis na teknikal o denominasyonal na pananalita. Ang “Kaya, nang” ay nagpapanatili sa daloy ng salaysay; ang “Natapos na” at “ibinigay niya ang kanyang espiritu” ay malapit sa Griyego ngunit nananatiling natural sa karaniwang mambabasa.
