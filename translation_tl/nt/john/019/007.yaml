  source_fidelity: 'Tumpak na naisasalin ang tugon, ang pag-angkin ng mga nagsasalita na may batas sila, ang pagtukoy pabalik sa nasabing batas, ang juridikal na obligasyong mamatay, at ang dahilan ng paratang: ginawa niya ang kanyang sarili na Anak ng Diyos. Ang ‘Anak ng Diyos’ ay angkop na titular na salin ng υἱὸν θεοῦ sa kontekstong ito.'
