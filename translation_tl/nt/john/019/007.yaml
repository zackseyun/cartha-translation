base_translation:
  language: en
  yaml_path: translation/nt/john/019/007.yaml
  text: The Jews answered him[a], “We have a law, and according to that law he ought to die[b], because he made himself the Son of God.”
translation:
  language: tl
  text: Sumagot sa kanya ang mga Hudyo, “Mayroon kaming batas, at ayon sa batas na iyon, dapat siyang mamatay, sapagkat ginawa niya ang kanyang sarili na Anak ng Diyos.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: Sumagot
  rationale: Karaniwang pandiwang pasalaysay para sa tugon; natural at tuwiran sa modernong Tagalog.
- source_word: οἱ Ἰουδαῖοι
  choice: ang mga Judio
  rationale: Tuwirang katumbas ng pangkatang katawagan sa Griyego. Hindi ito pinaliit sa “mga pinunong Judio” sapagkat hindi iyon tahasang tinutukoy ng talata.
- source_word: νόμον ἔχομεν
  choice: Mayroon kaming batas
  rationale: Pinananatili ang di-tiyak na anyo ng unang νόμον at ang pag-apela nila sa isang umiiral na legal na batayan.
- source_word: κατὰ τὸν νόμον
  choice: ayon sa batas na iyon
  rationale: Ipinakikita ng “na iyon” na ang ikalawang pagbanggit sa batas ay tumutukoy pabalik sa batas na kababanggit lamang.
- source_word: ὀφείλει ἀποθανεῖν
  choice: dapat siyang mamatay
  rationale: Likas na Tagalog para sa obligasyong legal na ipinapahayag ng ὀφείλει, nang hindi nagdaragdag ng paliwanag.
- source_word: υἱὸν θεοῦ
  choice: Anak ng Diyos
  rationale: Sa Tagalog, natural at titular ang “Anak ng Diyos” at naipahahayag nito ang natatanging pag-aangking pinag-uusapan nang hindi nangangailangan ng pantukoy.
- source_word: ἑαυτὸν ἐποίησεν
  choice: ginawa niyang ... ang kanyang sarili
  rationale: Pinananatili ang larawan at pormulasyon ng paratang sa Griyego sa isang malinaw na kayariang Tagalog.
theological_decisions:
- issue: Pagpapakahulugan sa υἱὸν θεοῦ sa paratang laban kay Jesus
  choice: Anak ng Diyos
  alternative: isang anak ng Diyos
  rationale: Ipinahihiwatig ng konteksto sa Juan na ang paratang ay tungkol sa natatangi at banal na katayuan bilang Anak, hindi sa pagiging isa lamang sa maraming anak. Iniuulat ng salin ang paratang nang hindi nagdaragdag ng doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal, malinaw, at madaling maunawaan. Pinanatili ang pag-uulit ng “batas” at ang juridikal na tono ng pahayag. Walang talababa dahil walang kailangang markahang alternatibo para maging malinaw ang talata.
