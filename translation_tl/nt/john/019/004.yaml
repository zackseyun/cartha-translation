  verdict: revise
  source_fidelity: Tumpak na naipapahayag ng draft ang paglabas muli ni Pilato, ang panawag-pansin, ang layuning ipaalam sa mga kausap, at ang panghukuman na diwa ng οὐδεμίαν αἰτίαν. Gayunman, ang “inilalabas ko siya sa inyo” ay hindi likas na paraan sa modernong Tagalog upang ipahayag ang pagdadala kay Jesus palabas tungo sa mga kausap ni Pilato. Ang “upang iharap sa inyo” ay malinaw na naipapahayag ang layon ng ἄγω ὑμῖν αὐτὸν ἔξω nang hindi nadaragdagan ang kahulugan.
  naturalness: Marangal at madaling maunawaan ang rehistro. Ang binagong ayos na “sinabi niya sa kanila” at “inilalabas ko siya upang iharap sa inyo” ay mas idiomatiko at malinaw sa makabagong Filipino.
  terminology: Ang “sakdal laban sa kanya” ay angkop sa panghukuman na αἰτία at maayos na iniiwasang gawing mas malawak na paghatol na moral ang pahayag. Sa talababa, ang “sala” ang mas likas na tradisyonal na katumbas ng alternatibong “fault,” samantalang nililinaw ng paliwanag ang legal na diwa sa talata.
