base_translation:
  language: en
  yaml_path: translation/nt/john/019/004.yaml
  text: Then Pilate went outside again and said to them[a], “Look, I am bringing him out to you so that you may know that I find no case against him.”
translation:
  language: tl
  text: Muling lumabas si Pilato at sinabi niya sa kanila, “Tingnan ninyo, inilalabas ko siya upang iharap sa inyo, upang malaman ninyo na wala akong nakikitang anumang sakdal laban sa kanya.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, “wala akong nakikitang anumang sala sa kanya.” Maaari ring isalin nang ganito ang pananalitang Griyego, ngunit malamang na panghukuman ang diwa rito: wala siyang nakikitang balidong sakdal o kaso si Pilato laban kay Jesus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν ... ἔξω
  choice: lumabas
  rationale: Likas na ipinapahayag ng “lumabas” ang pagpunta sa labas; hindi na kailangang ulitin ang diwa ng ἔξω sa Tagalog.
- source_word: πάλιν
  choice: muling
  rationale: Malinaw at maikli nitong ipinahihiwatig ang pag-uulit ng kilos.
- source_word: λέγει
  choice: sinabi
  rationale: Bagaman historical present ang Griyego, mas natural sa salaysay na Tagalog ang pangnagdaan.
- source_word: Ἴδε
  choice: Tingnan ninyo
  rationale: Isang tuwirang panawag-pansin ito na natural sa makabagong Tagalog at tumutugma sa maramihang kausap.
- source_word: ἄγω ... αὐτὸν ἔξω
  choice: inilalabas ko siya
  rationale: Ipinahahayag ng aspektong imperpektibo ang kasalukuyang paghaharap o pagdadala ni Jesus palabas sa mga tao.
- source_word: ἵνα γνῶτε
  choice: upang malaman ninyo
  rationale: Pinananatili nito ang malinaw na layuning ipinahihiwatig ng ἵνα at ang maramihang kausap.
- source_word: οὐδεμίαν αἰτίαν
  choice: walang ... anumang sakdal laban sa kanya
  rationale: Sa kontekstong panghukuman, ang αἰτία ay tumutukoy sa sakdal, paratang, o batayan ng kaso; ang “sakdal” ay maikli at malinaw na legal na termino.
- source_word: εὑρίσκω ἐν αὐτῷ
  choice: wala akong nakikitang ... laban sa kanya
  rationale: Natural na Tagalog itong katumbas ng idyomang panghukuman na tumutukoy sa hindi pagkakita ng balidong sakdal laban sa isang tao.
theological_decisions:
- issue: Panghukumang pananalita sa pahayag ni Pilato tungkol kay Jesus
  choice: wala akong nakikitang anumang sakdal laban sa kanya
  alternative: wala akong nakikitang anumang kasalanan sa kanya
  rationale: Panghukumang hatol ni Pilato ang tuwirang diwa ng αἰτία sa konteksto. Hindi ito pinalalawak tungo sa isang tahasang teolohikal na pahayag, bagaman ipinahihiwatig pa rin nito ang kawalan ng napatunayang sala ni Jesus.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “sakdal” upang mapanatili ang kontekstong panghukuman, habang inilagay sa talababa ang mas tradisyonal at mas malawak na saling “kasalanan.”
