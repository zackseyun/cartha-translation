  text: ἐπὶ δὲ τὸν Ἰησοῦν ἐλθόντες, ὡς εἶδον ⸂ἤδη αὐτὸν⸃ τεθνηκότα, οὐ κατέαξαν αὐτοῦ τὰ σκέλη,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/033.yaml
  text: But when they came to Jesus[a], seeing that he was already dead[b], they did not break his legs.
translation:
  language: tl
  text: Ngunit pagdating nila kay Jesus[a], nang makita nilang patay na siya[b], hindi nila binali ang kanyang mga binti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa bandang huli, iniugnay ni Juan ang hindi pagbali sa mga binti ni Jesus sa Kasulatan: “Wala ni isa man sa kanyang mga buto ang mababali” (Juan 19:36; ihambing sa Exodo 12:46; Bilang 9:12; Awit 34:20).'
    reason: cross_reference
  - marker: b
    text: O “nang makita nilang namatay na siya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ δὲ τὸν Ἰησοῦν ἐλθόντες
  choice: Ngunit pagdating nila kay Jesus
  rationale: Ginawang sugnay na panahunan ang participial construction upang maging natural sa Tagalog. Ipinahihiwatig ng “Ngunit” ang banayad na pagsalungat ng δέ sa ginawa sa mga naunang ipinako, at pinananatili ng “kay Jesus” ang kilos na patungo sa kanya.
- source_word: ὡς εἶδον
  choice: nang makita nilang
  rationale: Ipinapakita ng ὡς kasama ng aorist ang pangyayaring naging batayan ng sumunod nilang ginawa. Ang “nang makita nilang” ay likas sa Tagalog at hindi labis na nililinaw kung temporal lamang o may bahagyang diwang sanhi.
- source_word: ἤδη
  choice: na
  rationale: Sa pariralang “patay na siya,” likas na ipinahahayag ng hulaping “na” na nangyari na ang pagkamatay bago sila dumating; hindi na kailangan ang mas mabigat na “patay na pala” o “noon pa.”
- source_word: τεθνηκότα
  choice: patay
  rationale: Ang perfect participle ay nakatuon sa kalagayang bunga ng pagkamatay. Tumpak at natural na ipinahahayag iyon ng “patay,” habang inilalahad sa talababa ang posibleng anyong nakatuon sa pangyayari ng pagkamatay.
- source_word: οὐ κατέαξαν
  choice: hindi nila binali
  rationale: Sa kontekstong ito, ang κατάγνυμι ay tumutukoy sa pagbali ng mga buto o paa. Ang “binali” ang karaniwan at tiyak na pandiwang Tagalog para rito.
- source_word: τὰ σκέλη
  choice: ang kanyang mga binti
  rationale: Ang σκέλη ay tumutukoy sa mga binti. Natural sa Tagalog ang “binali ang kanyang mga binti” at hindi kailangang dagdagan ng “mga buto,” na mas tahasang magpapasok dito ng wikang lilitaw sa Juan 19:36.
theological_decisions:
- issue: Posibleng pahiwatig ng katuparan ng Kasulatan sa hindi pagbali sa mga binti ni Jesus
  choice: Pinanatiling tuwirang salaysay ang pangunahing teksto at inilagay sa talababa ang kaugnayan sa Kasulatan.
  alternative: Gamitin ang “mga buto sa binti” upang mauna nang idiin ang kaugnayan sa Juan 19:36.
  rationale: Sa Juan 19:36 mismo tahasang ipinapaliwanag ang katuparan. Hindi dapat palawakin ang talatang ito upang mauna ang paliwanag na teolohikal; pinananatili ng “mga binti” ang karaniwang kahulugan ng σκέλη at ang natural na daloy ng salaysay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga binti” sa halip na mas teknikal na “mga buto sa binti,” at pinanatili ang dalawang posibleng diin ng τεθνηκότα—ang kalagayang patay na at ang naganap na pagkamatay—sa pamamagitan ng pangunahing teksto at talababa.
