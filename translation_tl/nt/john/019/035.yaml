id: JHN.19.35
reference: John 19:35
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ὁ ἑωρακὼς μεμαρτύρηκεν, καὶ ἀληθινὴ ⸂αὐτοῦ ἐστιν⸃ ἡ μαρτυρία, καὶ ἐκεῖνος οἶδεν ὅτι ἀληθῆ λέγει, ἵνα ⸀καὶ ὑμεῖς ⸀πιστεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/035.yaml
  text: And the one who has seen has testified[a], and his testimony is true, and that one knows that he is telling the truth, so that you also may believe.
translation:
  language: tl
  text: At ang nakakita ay nagpatotoo, at totoo ang kanyang patotoo. At alam ng taong iyon na katotohanan ang sinasabi niya, upang kayo rin ay manampalataya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “upang patuloy din kayong manampalataya.” Maaaring magpahiwatig ng nagpapatuloy na pananampalataya ang pandiwang Griyego.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἑωρακὼς
  choice: ang nakakita
  rationale: Pinananatili nito ang anyong tumutukoy sa isang tao nang hindi tahasang kinikilala kung sino ang saksi. Ipinahihiwatig ng perpektong participle ang pagkakitang naganap na at nananatiling mahalaga.
- source_word: μεμαρτύρηκεν
  choice: nagpatotoo
  rationale: Likas at malinaw ito sa modernong Filipino at ipinapahayag ang pagbibigay ng patotoong may bisa pa rin sa konteksto.
- source_word: ἀληθινὴ ... ἡ μαρτυρία
  choice: totoo ang kanyang patotoo
  rationale: Direktang inilalarawan ng “totoo” ang pagiging mapagkakatiwalaan ng patotoo, at pinananatili ng “patotoo” ang ugnayan nito sa pandiwang “nagpatotoo.”
- source_word: ἐκεῖνος
  choice: ang taong iyon
  rationale: Pinananatili nito ang mariing demonstratibong puwersa ng Griyego sa halip na gawing payak na “siya,” nang hindi tinutukoy kung sino ang tinutukoy.
- source_word: οἶδεν
  choice: alam
  rationale: Bagaman perpekto ang anyo sa Griyego, pangkasalukuyang kalagayan ang kahulugan nito; kaya likas ang “alam” sa Filipino.
- source_word: ἀληθῆ λέγει
  choice: katotohanan ang sinasabi niya
  rationale: Likas na Filipino itong katumbas ng idyomang Griyego na nangangahulugang nagsasabi siya ng totoo, habang napapanatili ang tuon sa nilalaman ng kanyang sinasabi.
- source_word: ἵνα καὶ ὑμεῖς πιστεύητε
  choice: upang kayo rin ay manampalataya
  rationale: Ipinapahayag ng “upang” ang layunin, at inililipat ng “rin” ang inklusibong diin ng καί sa mga mambabasa. Hindi nililimitahan ng pangunahing teksto ang pananampalataya bilang pasimula o nagpapatuloy.
theological_decisions:
- issue: Ang tinutukoy ng mariing mga panghalip sa talata
  choice: 'Pinanatili ang ikatlong panauhan: “ang nakakita” at “ang taong iyon.”'
  alternative: Maaaring ang tagapagsalaysay ay tumutukoy sa sarili sa ikatlong panauhan, o maaaring ibang saksi ang tinutukoy.
  rationale: Hindi tahasang kinikilala ng Griyego ang saksi. Iniiwasan ng salin na ipasok sa teksto ang isang tiyak na pagkakakilanlan.
- issue: Puwersa ng πιστεύητε
  choice: manampalataya
  alternative: patuloy na manampalataya
  rationale: Maaaring magpahiwatig ang present subjunctive ng nagpapatuloy na pananampalataya, ngunit maaari rin itong gamitin nang walang gayong tiyak na diin. Pinanatiling hindi tiyak ang pangunahing teksto at inilagay sa talababa ang posibleng nagpapatuloy na diwa.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang bahagyang mariing “ang taong iyon” upang tumbasan ang ἐκεῖνος, at iniwasan ang pagtukoy sa saksi bilang isang partikular na alagad o tagapagsalaysay.
