    rationale: Ang ἐντεῦθεν καὶ ἐντεῦθεν ay nagsasaad ng tig-isang tao sa magkatapat na panig. Sa Filipino, ang “isa sa magkabilang panig” ay maaaring mabasa na isang tao lamang na nasa alinman sa dalawang panig, o bilang hindi likas na konstruksyon. Ang “tig-isa sa magkabilang panig” ang malinaw na katumbas.
