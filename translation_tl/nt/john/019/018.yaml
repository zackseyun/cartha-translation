  source_fidelity: 'Tumpak ang pangunahing diwa: ang pagpapako kay Jesus sa krus, ang dalawang iba na kasama niya, at ang pagkakaayos nila sa magkabilang panig habang si Jesus ay nasa gitna. Gayunman, ang “isa sa magkabilang panig” ay hindi wastong naipapahayag ang distributibong diwa ng ἐντεῦθεν καὶ ἐντεῦθεν; kinakailangan ang “tig-isa.”'
  naturalness: Natural at angkop sa modernong Filipino Tagalog ang “ipinako sa krus,” “dalawa pang iba,” at “si Jesus sa gitna.” Mas malinaw at idiomatiko ang “tig-isa sa magkabilang panig” kaysa “isa sa magkabilang panig.”
