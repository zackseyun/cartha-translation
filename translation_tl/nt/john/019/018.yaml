  text: ὅπου αὐτὸν ἐσταύρωσαν, καὶ μετ’ αὐτοῦ ἄλλους δύο ἐντεῦθεν καὶ ἐντεῦθεν, μέσον δὲ τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/018.yaml
  text: where they crucified him[a], and with him two others, one on each side, and Jesus in the middle.
translation:
  language: tl
  text: Doon nila siya ipinako sa krus, kasama ang dalawa pang iba—tig-isa sa magkabilang panig, at si Jesus sa gitna.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπου
  choice: Doon
  rationale: Likas na locative na pananda sa Filipino at malinaw na tumutukoy sa lugar na binanggit sa konteksto.
- source_word: ἐσταύρωσαν
  choice: ipinako sa krus
  rationale: Karaniwan at malinaw na salin ng crucifixion sa modernong Filipino; hindi nito idinaragdag kung aling bahagi ng katawan ang ipinako.
- source_word: μετ’ αὐτοῦ
  choice: kasama
  rationale: Maikli at natural na nagpapahayag ng accompaniment sa ayos ng pagpapako sa krus.
- source_word: ἄλλους δύο
  choice: dalawa pang iba
  rationale: Pinananatili ang di-tiyak na pagtukoy ng Griyego nang hindi tahasang idinaragdag ang pangngalang 'lalaki.'
- source_word: ἐντεῦθεν καὶ ἐντεῦθεν
  choice: isa sa magkabilang panig
  rationale: Natural na Filipino para sa distributibong ayos na may tig-isa sa dalawang panig.
- source_word: μέσον δὲ τὸν Ἰησοῦν
  choice: at si Jesus sa gitna
  rationale: Pinananatili ang tahasang larawang spatial ng Griyego at ang banayad na connective force ng δέ.
theological_decisions:
- issue: Kung tahasang sasabihing nasa pagitan ng dalawa si Jesus
  choice: isa sa magkabilang panig, at si Jesus sa gitna
  alternative: na si Jesus ang nasa pagitan nila
  rationale: 'Tuwirang pinananatili ang magkahiwalay na spatial na paglalarawan ng Griyego: ang dalawa ay nasa magkabilang panig at si Jesus ay nasa gitna, sa halip na paikliin ito sa isang interpretibong parirala.'
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang karaniwang biblikal na pariralang 'ipinako sa krus' at iniwasan ang mas teknikal o mas tahasang paglalarawan sa mekanismo.
