id: JHN.19.42
reference: John 19:42
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐκεῖ οὖν διὰ τὴν παρασκευὴν τῶν Ἰουδαίων, ὅτι ἐγγὺς ἦν τὸ μνημεῖον, ἔθηκαν τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/042.yaml
  text: So there[a], because of the Jews’ day of preparation, since the tomb was nearby, they laid Jesus there.
translation:
  language: tl
  text: Kaya dahil sa araw ng paghahanda ng mga Judio[a], at dahil malapit ang libingan, doon nila inihimlay si Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dahil iyon ang araw ng paghahanda ng mga Judio.” Maaari ring isalin na “dahil iyon ang Paghahanda ng mga Judio.”
    reason: Pinananatili ang mga posibleng paraan ng pag-unawa sa teknikal na katawagang παρασκευή at sa pagkakaugnay nito sa τῶν Ἰουδαίων.
lexical_decisions:
- source_word: ἐκεῖ
  choice: doon
  rationale: Tumutukoy sa lugar na pinaglibingan kay Jesus. Inilapit ito sa pandiwang “inihimlay” upang maging natural sa Tagalog habang pinananatili ang spatial na diwa.
- source_word: οὖν
  choice: Kaya
  rationale: Nag-uugnay sa pangyayari sa naunang salaysay at nagpapahiwatig ng bunga o pagpapatuloy.
- source_word: διὰ τὴν παρασκευὴν
  choice: dahil sa araw ng paghahanda
  rationale: Ang διά na may accusative ay nagsasaad ng dahilan. Nililinaw ng “araw ng paghahanda” ang teknikal na gamit ng παρασκευή para sa karaniwang mambabasa nang hindi ito higit na tinutukoy kaysa sa Griyego.
- source_word: τῶν Ἰουδαίων
  choice: ng mga Judio
  rationale: Pinananatili ang genitive na pagkakaugnay nito sa “araw ng paghahanda” at hindi pinapalawak bilang hatol tungkol sa mga Judio.
- source_word: ὅτι
  choice: at dahil
  rationale: Ipinakikilala nito ang karagdagang dahilan kung bakit ang libingang iyon ang ginamit. Idinagdag ang “at” para sa malinaw at natural na daloy sa Tagalog.
- source_word: ἐγγὺς
  choice: malapit
  rationale: Direkta at natural na paglalarawan sa kinaroroonan ng libingan.
- source_word: μνημεῖον
  choice: libingan
  rationale: Sa konteksto ng paglilibing, malinaw na tumutukoy ito sa isang puntod o tombang pinaglalagyan ng bangkay; “libingan” ang pinakanatural at malawak na nauunawaang salin.
- source_word: ἔθηκαν
  choice: inihimlay
  rationale: Ipinahahayag ang maingat na paglalagay sa konteksto ng paglilibing. Mas angkop at marangal ito kaysa sa pangkalahatang “inilagay,” nang hindi tuwirang nagdaragdag ng hiwalay na kilos.
- source_word: τὸν Ἰησοῦν
  choice: si Jesus
  rationale: Karaniwang anyo ng pangalang pantangi at wastong pananda sa tuwirang layon na tao sa Tagalog.
theological_decisions:
- issue: Pagpapakahulugan sa παρασκευή sa salaysay ng pagpapakasakit
  choice: araw ng paghahanda
  alternative: Paghahanda
  rationale: Maaaring teknikal na katawagan sa kalendaryo ang salita, ngunit nililinaw ng napiling salin ang kahulugan nito sa modernong mambabasa nang hindi nagpapasya kung dapat itong ituring na pormal na pangalang pantangi.
- issue: Pagkakaugnay ng τῶν Ἰουδαίων sa παρασκευή
  choice: araw ng paghahanda ng mga Judio
  alternative: araw ng paghahandang Judio; iyon ang Paghahanda ng mga Judio
  rationale: Pinananatili nito ang anyong genitive at ang tunay na luwag ng parirala, nang hindi pinahihina o pinatitindi ang pahayag ni Juan at nang walang ipinapasok na teolohikal na paghatol sa mga Judio.
translation_notes:
  register: Modernong Filipino na may marangal na himig. Ginamit ang “inihimlay” dahil ang konteksto ay paglilibing, samantalang nananatiling payak at madaling maunawaan ang kabuuang pangungusap.
