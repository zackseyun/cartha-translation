  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀αὐτῷ Ἰησοῦς· Οὐκ εἶχες ἐξουσίαν ⸂κατ’ ἐμοῦ οὐδεμίαν⸃ εἰ μὴ ἦν ⸂δεδομένον σοι⸃ ἄνωθεν· διὰ τοῦτο ὁ ⸀παραδούς μέ σοι μείζονα ἁμαρτίαν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/011.yaml
  text: Jesus answered him[a], “You would have no authority over me at all unless it had been given to you from above[b]. Therefore the one who handed me over to you has the greater sin.”
translation:
  language: tl
  text: Sumagot si Jesus sa kanya, “Wala ka sanang anumang kapamahalaan laban sa akin kung hindi ito ibinigay sa iyo mula sa itaas.[a] Kaya ang nagbigay sa akin sa iyo ay may mas malaking kasalanan.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula sa langit.” Ang literal na sabi sa Griyego ay “mula sa itaas,” na sa Ebanghelyo ni Juan ay madalas tumutukoy sa banal na pinagmulan.
    reason: lexical_alternative
  - marker: b
    text: Hindi tahasang tinukoy rito kung sino ang nagbigay kay Jesus kay Pilato. Maaaring tumukoy ito kay Judas, kay Caifas, o sa pamunuang Hudyo sa mas malawak na diwa.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξουσίαν
  choice: kapamahalaan
  rationale: Ang “kapamahalaan” ay malinaw na tumutukoy sa ipinagkaloob na saklaw ng pamamahala at paghatol ni Pilato, hindi lamang sa kakayahan o lakas.
- source_word: κατ’ ἐμοῦ οὐδεμίαν
  choice: anumang kapamahalaan sa akin
  rationale: Natural ito sa modernong Tagalog at naipapahayag ng “anumang” ang mariing οὐδεμίαν.
- source_word: δεδομένον σοι
  choice: ibinigay sa iyo
  rationale: Pinananatili nito ang di-tahasang tagapagbigay sa balarila ng Griyego habang ipinakikitang natanggap, hindi likas na taglay, ni Pilato ang kapamahalaan.
- source_word: ἄνωθεν
  choice: mula sa itaas
  rationale: Ito ang tuwirang katumbas na nagpapanatili sa paraan ng pagpapahayag ni Juan at sa pahiwatig ng banal na pinagmulan nang hindi ito ginagawang tahasang “mula sa langit” sa pangunahing teksto.
- source_word: διὰ τοῦτο
  choice: Kaya
  rationale: Natural at malinaw nitong ipinahahayag ang lohikal na bunga o dahilan sa kasalukuyang Tagalog.
- source_word: ὁ παραδούς μέ σοι
  choice: ang nagbigay sa akin sa iyo
  rationale: Pinananatili nito ang di-tiyak na pagkakakilanlan ng tinutukoy at ang diwa ng παραδίδωμι na ibigay o ipasa sa kapangyarihan ng iba; hindi ito nililimitahan agad kay Judas bilang “nagkanulo.”
- source_word: μείζονα ἁμαρτίαν
  choice: mas malaking kasalanan
  rationale: Malinaw nitong pinananatili ang paghahambing ng antas ng pananagutan nang hindi ipinahihiwatig na walang kasalanan si Pilato.
theological_decisions:
- issue: Pinagmulan ng kapamahalaan ni Pilato na ipinahihiwatig ng ἄνωθεν
  choice: “mula sa itaas,” na nagpapahiwatig ng banal na pinagmulan ngunit hindi nagpapalawak tungo sa isang pangkalahatang doktrina ng pamahalaan
  alternative: “mula sa langit”
  rationale: Sa Juan, ang ἄνωθεν ay madalas tumutukoy sa banal na pinagmulan, ngunit ang mas literal na “mula sa itaas” ang nagpapanatili sa pahiwatig at paraan ng pagsasalita ng teksto.
- issue: Pagkakakilanlan ng ὁ παραδούς μέ σοι
  choice: 'Hindi pinangalanan sa pangunahing teksto: “ang nagbigay sa akin sa iyo”'
  alternative: Judas, Caifas, o mas malawak na pamunuang Judio
  rationale: Hindi tahasang kinikilala ng Griyego ang tinutukoy, kaya hindi dapat lutasin ng salin ang tunay na kalabuan.
- issue: Paghahambing ng kasalanan
  choice: “mas malaking kasalanan,” na naghahambing ng bigat ng pananagutan
  alternative: “pinakamalaking kasalanan” o pahayag na walang kasalanan si Pilato
  rationale: Ang μείζονα ay pahambing, hindi pasukdol; ipinahihiwatig ng paghahambing na may pananagutan si Pilato ngunit mas mabigat ang sa nagbigay kay Jesus sa kanya.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “kapamahalaan” para sa hudisyal at ipinagkaloob na awtoridad ni Pilato. Pinanatili ang “mula sa itaas” at ang di-tiyak na pagkakakilanlan ng nagbigay kay Jesus upang huwag lutasin ang mga kalabuan ng orihinal.
