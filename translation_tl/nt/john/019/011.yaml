revisions:
- from: Sumagot si Jesus sa kanya, “Wala ka sanang anumang kapamahalaan sa akin kung hindi ito ibinigay sa iyo mula sa itaas.[a] Kaya ang nagbigay sa akin sa iyo ay may mas malaking kasalanan.”[b]
  to: Sumagot si Jesus sa kanya, “Wala ka sanang anumang kapamahalaan laban sa akin kung hindi ito ibinigay sa iyo mula sa itaas.[a] Kaya ang nagbigay sa akin sa iyo ay may mas malaking kasalanan.”[b]
  rationale: Pinalitan ang «sa akin» ng «laban sa akin» upang maging mas idiomatiko at mas malapit sa hudisyal na gamit ng κατά + genitive. Pinanatili ang «wala ka sanang» upang ipahayag ang kontra-katotohanang kondisyon, ang «mula sa itaas» upang huwag lutasin ang pahiwatig ng ἄνωθεν, at ang pangkalahatang «ang nagbigay sa akin sa iyo» upang huwag pangalanan ang pinagtatalunang tinutukoy. Inayos din ang maliit na estilong detalye sa mga talababa.
  reviewer_model: gpt-5.6-terra
