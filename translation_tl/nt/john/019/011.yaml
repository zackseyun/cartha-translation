  naturalness: 'Maunawaan ang draft, ngunit ang «kapamahalaan sa akin» ay hindi gaanong natural sa Filipino sa ganitong usaping paglilitis. Ang «anumang kapamahalaan laban sa akin» ay mas malinaw. Ang «ang nagbigay sa akin sa iyo» ay maaaring panatilihin: bagaman bahagyang literal, ito ay gramatikal, malinaw sa konteksto, at hindi nililimitahan ang hindi pinangalanang tinutukoy.'
  terminology: Ang «kapamahalaan» ay angkop para sa ἐξουσία sa kontekstong ito. Ang «mula sa itaas» ay wastong pinananatili ang Johannine na pahiwatig nang hindi labis na binibigyang-kahulugan bilang «mula sa langit.» Ang «mas malaking kasalanan» ay wastong pahambing, hindi pasukdol. Ginawang «Hudyo» ang pangkat-etnikong katawagan sa talababa bilang mas karaniwang makabagong anyo.
