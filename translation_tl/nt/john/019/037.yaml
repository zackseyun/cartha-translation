  text: καὶ πάλιν ἑτέρα γραφὴ λέγει· Ὄψονται εἰς ὃν ἐξεκέντησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/037.yaml
  text: And again another Scripture says[a], “They will look on the one whom they pierced.”
translation:
  language: tl
  text: 'At muli, sinasabi ng isa pang Kasulatan: “Titingnan nila ang taong tinusok nila.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάλιν
  choice: muli
  rationale: Likas na pang-ugnay ito sa Filipino para ipakilala ang karagdagang sipi mula sa Kasulatan.
- source_word: ἑτέρα γραφή
  choice: isa pang Kasulatan
  rationale: Ipinahihiwatig ng ἑτέρα ang isa pang patotoo ng Kasulatan; malinaw at maikli ang pariralang Filipino.
- source_word: λέγει
  choice: sinasabi
  rationale: Pinananatili ng pangkasalukuyang anyo ang buhay na pormula ng pagsipi sa Kasulatan.
- source_word: Ὄψονται
  choice: Titingnan nila
  rationale: Ipinapahayag nito ang sadyang pagbaling ng tingin, hindi lamang ang pagkakita.
- source_word: εἰς ὃν
  choice: ang kanilang
  rationale: Sa natural na Filipino, ipinakikita ng “ang” ang taong pinagtutuunan ng tingin, at ng “kanilang” sa sugnay na panuring kung sino ang tinusok; hindi nito pinipilit ang pagkakaiba ng ‘on’ at ‘to’ na likas sa Ingles ngunit hindi sa Filipino.
- source_word: ἐξεκέντησαν
  choice: tinusok
  rationale: Tumpak at karaniwang salin para sa pagbutas o pananaksak, at angkop sa agarang konteksto ng pagpapako kay Jesus.
theological_decisions:
- issue: Pagpapanatili sa Kristolohikal na bisa ng alusyon sa Zacarias nang hindi nagdaragdag ng mga salitang wala sa Griyego ni Juan
  choice: Titingnan nila ang kanilang tinusok
  alternative: Titingin sila sa kanya na kanilang tinusok
  rationale: Ang napiling anyo ay natural sa makabagong Filipino at tuwirang pinananatili ang pagkakakilanlan ng taong tinusok, nang hindi inililipat sa talata ang unang-panauhang pananalita mula sa ibang anyo ng Zacarias 12:10.
- issue: Direksiyon ng pagtingin sa εἰς ὃν
  choice: Titingnan nila ang kanilang tinusok
  alternative: Babaling sila sa kanilang tinusok
  rationale: Maaaring ipahiwatig ng εἰς ang pagtingin patungo sa isang tao. Hindi likas sa Filipino ang hiwalay na literal na pagtutumbas sa Ingles na ‘look on’ o ‘look to’; inilalahad sa talababa ang posibleng diin sa pagbaling patungo sa kanya.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Kasulatan” bilang kinikilalang katawagan sa banal na kasulatan, at iniwasan ang artipisyal na pagtutumbas sa pagkakaibang Ingles na ‘on/to.’
