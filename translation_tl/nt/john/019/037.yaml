  source_fidelity: 'Ang pangunahing salin ay malapit sa Griyego: naipapahayag ang karagdagang sipi mula sa Kasulatan, ang pangkasalukuyang pormula ng pagsipi, at ang hinaharap na pagtingin sa taong tinusok. Gayunman, ang “ang kanilang tinusok” ay hindi sapat na malinaw na katumbas ng προσωπικό na εἰς ὃν (“sa/ang taong [na] tinusok nila”); maaari itong magtunog na bagay o pag-aari ang tinutukoy.'
  naturalness: 'Likas ang “At muli, sinasabi ng isa pang Kasulatan,” ngunit mas malinaw at likas sa modernong Filipino ang paglalantad ng taong tinutukoy sa huling sugnay: “ang taong tinusok nila.”'
