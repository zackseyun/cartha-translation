translation:
  language: tl
  text: Sumagot si Pilato[a], “Ang isinulat ko ay isinulat ko.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Kung ano ang isinulat ko, iyon ang isinulat ko.” Dalawang beses ginamit sa Griyego ang perfect tense, na maaaring magdiin sa nananatili at pinal na bisa ng isinulat ni Pilato.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: Sumagot
  rationale: Ang aorist deponent ng ἀποκρίνομαι ay karaniwang nangangahulugang ‘sumagot.’ Natural ito sa makabagong salaysay sa Filipino.
- source_word: ὁ Πιλᾶτος
  choice: si Pilato
  rationale: Isinasalin ang pangalang pantangi bilang ‘Pilato,’ at ginagamit ang personal na pantukoy na ‘si’ ayon sa likas na balarila ng Filipino.
- source_word: Ὃ
  choice: Ang
  rationale: Ang substantival na panghalip na Ὃ ay tumutukoy sa bagay na isinulat. Sa konstruksyong Filipino na ‘Ang isinulat ko,’ likas at malinaw na naihahatid ang diwang ‘what I have written.’
- source_word: γέγραφα
  choice: isinulat ko … isinulat ko na
  rationale: Ang perpektong aspekto ng Griyego ay nagsasaad ng natapos na pagsulat na nananatiling may bisa. Pinananatili ang pag-uulit, habang ang ‘na’ sa ikalawang sugnay ay natural na nagpapahiwatig ng pagiging tapos at pinal.
theological_decisions:
- issue: Diin ng inuulit na perpektong γέγραφα γέγραφα
  choice: “Ang isinulat ko ay isinulat ko na.”
  alternative: “Kung ano ang isinulat ko, iyon ang isinulat ko.”
  rationale: Pinananatili ng salin ang mariing pag-uulit at ang pinal na pagtanggi ni Pilato na baguhin ang nakasulat, nang hindi nagdaragdag ng paliwanag sa mismong teksto. Ang ‘na’ ay naghahatid ng natapos at nananatiling kalagayan, bagaman walang eksaktong katumbas sa Filipino ang Griyegong perfect tense.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Pinanatili ang maikli at matigas na tono ng tugon ni Pilato at ang pag-uulit ng pandiwa.
