  text: ἦν δὲ ἐν τῷ τόπῳ ὅπου ἐσταυρώθη κῆπος, καὶ ἐν τῷ κήπῳ μνημεῖον καινόν, ἐν ᾧ οὐδέπω οὐδεὶς ⸂ἦν τεθειμένος⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/041.yaml
  text: In the place where he was crucified there was a garden, and in the garden a new tomb, in which no one had yet been laid.
translation:
  language: tl
  text: Sa lugar kung saan siya ipinako sa krus ay may isang hardin, at sa hardin ay may isang bagong libingan na wala pang sinumang nailibing doon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: ay
  rationale: Ipinahihiwatig ang banayad na pagpapatuloy ng salaysay sa natural na ayos ng pangungusap sa Filipino, nang hindi nagdaragdag ng tahasang panandang temporal o pagsalungat.
- source_word: ἐν τῷ τόπῳ
  choice: Sa lugar
  rationale: Tuwiran at likas na katumbas ng pariralang tumutukoy sa pook.
- source_word: ὅπου ἐσταυρώθη
  choice: na pinagpakuan sa kanya sa krus
  rationale: Pinananatili ang pasibong diwa ng Griyego at malinaw na ipinapahayag ang pagpapako sa krus nang hindi nagdaragdag ng tahasang gumaganap.
- source_word: κῆπος
  choice: hardin
  rationale: Karaniwan at eksaktong salin; ang “halamanan” ay posible ngunit maaaring magpahiwatig ng mas tiyak na uri ng taniman.
- source_word: μνημεῖον
  choice: libingan
  rationale: Likas na katawagan sa Filipino para sa konkretong pook na pinaglalagyan ng bangkay sa konteksto ng paglilibing.
- source_word: καινόν
  choice: bagong
  rationale: Pinananatili ang payak na kahulugang “bago”; ipinapaliwanag ng kasunod na sugnay na hindi pa ito nagagamit.
- source_word: ἐν ᾧ οὐδέπω οὐδεὶς ἦν τεθειμένος
  choice: na hindi pa napaglilibingan ng sinuman
  rationale: Natural na Filipino na nagpapanatili sa temporal na “hindi pa,” sa kawalan ng sinumang naunang inilibing, at sa kontekstong funeraryo ng τεθειμένος.
theological_decisions:
- issue: Wika para sa μνημεῖον at τεθειμένος sa konteksto ng paglilibing
  choice: libingan ... hindi pa napaglilibingan ng sinuman
  alternative: puntod ... wala pang sinumang nailalagay
  rationale: Ang “libingan” at “napaglilibingan” ay malinaw na tumutukoy sa paglilibing nang hindi nagdaragdag ng teolohikal na pagpapakahulugan; ang “puntod” ay maaaring maunawaan bilang bunton o palatandaan sa ibabaw ng lupa.
- issue: Tinig ng ἐσταυρώθη
  choice: pinagpakuan sa kanya sa krus
  alternative: kung saan siya ipinako nila sa krus
  rationale: Pinananatili ang pasibong paglalahad ng Griyego at iniiwasang magdagdag ng tahasang gumaganap na wala sa sugnay.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “hardin” at “libingan” bilang karaniwang mga salitang hindi teknikal. Walang kailangan na talababa sa talatang ito.
