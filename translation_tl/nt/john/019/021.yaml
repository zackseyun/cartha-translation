base_translation:
  language: en
  yaml_path: translation/nt/john/019/021.yaml
  text: So the chief priests of the Jews were saying to Pilate[a], “Do not write, ‘The King of the Jews,’ but that he said[b], ‘I am King of the Jews.’”
translation:
  language: tl
  text: Kaya sinabi ng mga punong pari ng mga Judio[a] kay Pilato, “Huwag mong isulat, ‘Ang Hari ng mga Judio,’ kundi, ‘Sinabi ng taong iyon, “Ako ang Hari ng mga Judio.”’[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga taga-Judea” / “Hari ng mga taga-Judea.” Maaaring tumukoy ang salitang Griyego sa mga Judio sa pangkalahatan o, ayon sa konteksto, sa mga taga-Judea nang mas tiyak.
    reason: alternative_reading
  - marker: b
    text: 'Maaari ring isalin: “Ako’y Hari ng mga Judio.” Walang tahasang artikulo bago ang salitang “Hari” sa Griyego, ngunit natural sa Tagalog na gamitin ang “ang” sa ganitong panaguring titulo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: sinabi
  rationale: Ang imperpektibong Griyego ay naglalarawan ng nagaganap na pagsasalita. Sa ganitong salaysay at kolektibong pahayag, natural sa modernong Tagalog ang “sinabi”; ang “paulit-ulit na sinasabi” ay maaaring magdagdag ng pag-uulit na hindi tiyak sa konteksto.
- source_word: οὖν
  choice: Kaya
  rationale: Pinananatili ang ugnayang pasalaysay at lohikal sa naunang pangyayari sa natural na Tagalog.
- source_word: οἱ ἀρχιερεῖς
  choice: mga punong pari
  rationale: Tumutukoy sa mga nangungunang awtoridad na pari, hindi sa maraming taong sabay-sabay na may iisang katungkulang mataas na pari.
- source_word: τῶν Ἰουδαίων
  choice: ng mga Judio
  rationale: Ito ang malinaw at kinikilalang katawagan sa konteksto ng pampolitika at panrelihiyong titulong “Hari ng mga Judio”; inilalahad sa talababa ang posibleng heograpikong diwang “mga Judeano.”
- source_word: Μὴ γράφε
  choice: Huwag mong isulat
  rationale: Direkta at natural na pagbabawal sa Tagalog, na pinananatili ang ikalawang panauhang isahan kay Pilato.
- source_word: Ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: Ang Hari ng mga Judio
  rationale: Pinananatili ang mismong pamagat na pinagtatalunan sa nakasulat na paratang.
- source_word: ἀλλ’ ὅτι
  choice: kundi
  rationale: Natural na ipinakikita sa Tagalog ang pagwawasto o kapalit na nais nilang ipasulat.
- source_word: ἐκεῖνος
  choice: ang taong iyon
  rationale: Pinananatili ang demonstratibong distansiya ng Griyego, na mas matindi kaysa sa payak na “siya” ngunit hindi kinakailangang sabihing tahasang mapanlait.
- source_word: εἶπεν
  choice: Sinabi
  rationale: Payak na katumbas ng pandiwang “nagsabi,” nang hindi idinaragdag ang interpretibong diwa ng “inangkin.”
- source_word: Βασιλεὺς τῶν Ἰουδαίων εἰμί
  choice: Ako ang Hari ng mga Judio
  rationale: Ito ang pinakanatural na pagpapahayag sa Tagalog ng panaguring titulo; bagaman walang tahasang artikulo bago ang βασιλεύς sa Griyego, karaniwang kailangan ang “ang” sa ganitong konstruksiyon sa Tagalog.
theological_decisions:
- issue: Saklaw ng Ἰουδαῖος/Ἰουδαίων sa salaysay ng pagpapakasakit ayon kay Juan
  choice: mga Judio
  alternative: mga Judeano
  rationale: Ang agarang konteksto ay ang kilalang titulong “Hari ng mga Judio.” Gayunman, maaaring tumukoy ang salitang Griyego sa mga Judeano sa mas heograpiko o panrehiyong diwa, kaya pinananatili ang alternatibo sa talababa.
- issue: Pagiging tiyak ng titulong βασιλεύς sa “Βασιλεὺς τῶν Ἰουδαίων εἰμί”
  choice: Ako ang Hari ng mga Judio
  alternative: Ako’y Hari ng mga Judio
  rationale: Walang tahasang artikulo bago ang βασιλεύς sa Griyego, ngunit hindi awtomatikong nangangahulugang di-tiyak ang titulo. Ang pangunahing salin ang pinakanatural sa Tagalog, habang ipinakikita sa talababa ang mas walang-artikulong anyo.
translation_notes:
  register: Modernong Filipino Tagalog na pormal ngunit madaling maunawaan. Ginamit ang “punong pari,” “mga Judio,” at “Hari” bilang karaniwan at marangal na mga katawagan. Pinanatili ang mga sipi sa loob ng sipi upang malinaw ang ipinakikiusap nilang kapalit na inskripsiyon.
