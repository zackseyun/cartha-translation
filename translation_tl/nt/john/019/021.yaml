revisions:
- from: Kaya sinabi ng mga punong pari ng mga Judio[a] kay Pilato, “Huwag mong isulat, ‘Ang Hari ng mga Judio,’ kundi, ‘Sinabi ng taong iyon, “Ako ang Hari ng mga Judio.”’[b]”
  to: Kaya sinabi ng mga punong pari ng mga Judio[a] kay Pilato, “Huwag mong isulat, ‘Ang Hari ng mga Judio,’ kundi, ‘Sinabi ng taong iyon, “Ako ang Hari ng mga Judio.”’[b]”
  rationale: Pinalitan lamang ang “mga Judeano” sa talababa ng “mga taga-Judea,” na mas natural at malinaw sa modernong Filipino Tagalog. Pinanatili ang teksto ng talata sapagkat tapat ito sa Griyego at maayos ang rehistro; hindi ipinilit ang isang mekanikal na katumbas ng imperpekto na maaaring magdagdag ng di-tiyak na pag-uulit.
