  terminology: Ang “mga punong pari,” “mga Judio,” at “Hari ng mga Judio” ay angkop sa rehistro at sa nakasanayang pamagat sa kontekstong ito. Ang pangunahing salin na “Ako ang Hari ng mga Judio” ay natural na Tagalog, kahit walang artikulo ang Griyego bago ang βασιλεύς. Iniaayos ang alternatibo sa talababa sa mas likas na Tagalog na katawagan para sa heograpikong pagbasa.
