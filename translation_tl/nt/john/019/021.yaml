  source_fidelity: 'Tumpak na naipapahayag ng salin ang pangunahing sintaks at diwa ng Griyego: ang mga punong pari ang nagsasalita kay Pilato, tinututulan nila ang nakasulat na titulo, at nais nilang ipasulat na si Jesus mismo ang nagsabi nito. Ang “ang taong iyon” ay angkop na naghahatid ng demonstratibong ἐκεῖνος nang walang pagdaragdag na angkop na mapanlait na kahulugan. Ang perpektibong “sinabi” ay hindi tahasang nagpapakita ng imperpektong ἔλεγον, ngunit katanggap-tanggap itong idiomatikong pagsasalin sa isang kolektibong pahayag sa salaysay at hindi kinakailangang dagdagan ng “paulit-ulit.”'
