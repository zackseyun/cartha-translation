  yaml_path: translation/nt/john/019/008.yaml
  text: When Pilate heard this statement, he became even more afraid,
translation:
  language: tl
  text: Nang marinig ni Pilato ang pahayag na ito, lalo siyang natakot.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅτε οὖν
  choice: Nang
  rationale: Ipinahahayag ng “Nang” ang temporal na ugnayan sa natural na Tagalog; hindi na kailangang hiwalay na isalin ang mahinang pang-ugnay na οὖν dahil malinaw na ang daloy ng salaysay.
- source_word: ἤκουσεν
  choice: marinig
  rationale: Ang pandiwa ay tumutukoy sa pagtanggap ni Pilato sa impormasyong kapapahayag lamang.
- source_word: ὁ Πιλᾶτος
  choice: ni Pilato
  rationale: Karaniwang anyong Tagalog para sa gumagawa ng kilos sa sugnay na pinangungunahan ng “Nang.”
- source_word: τοῦτον τὸν λόγον
  choice: ang sinabi nilang ito
  rationale: Sa konteksto, ang λόγος ay ang pahayag ng mga pinunong Judio sa talata 7. Nililinaw ng “sinabi nilang ito” ang sanggunian nang hindi ito itinuturing na iisang salita.
- source_word: μᾶλλον ἐφοβήθη
  choice: lalo siyang natakot
  rationale: Natural na ipinahahayag ng “lalo” ang pag-igting ng takot, samantalang pinananatili ng “natakot” ang pangyayaring inilalarawan ng aorist.
theological_decisions:
- issue: Dahilan o uri ng takot ni Pilato
  choice: Hindi tinukoy kung bakit lalo siyang natakot.
  alternative: Tukuying pampolitika, mapamahiin, o teolohikal ang kanyang takot.
  rationale: Sinasabi lamang ng Griyego na tumindi ang takot ni Pilato matapos niyang marinig ang pahayag. Pinananatili ng salin ang sadyang di-tiyak na dahilan nito.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ang “lalo siyang natakot” ay karaniwang pananalita at tumpak na naghahatid ng pagtaas ng antas ng takot.
