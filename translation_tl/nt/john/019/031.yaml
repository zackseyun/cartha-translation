id: JHN.19.31
reference: John 19:31
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Οἱ οὖν Ἰουδαῖοι, ⸂ἐπεὶ παρασκευὴ ἦν, ἵνα μὴ μείνῃ ἐπὶ τοῦ σταυροῦ τὰ σώματα ἐν τῷ σαββάτῳ⸃, ἦν γὰρ μεγάλη ἡ ἡμέρα ἐκείνου τοῦ σαββάτου, ἠρώτησαν τὸν Πιλᾶτον ἵνα κατεαγῶσιν αὐτῶν τὰ σκέλη καὶ ἀρθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/031.yaml
  text: Therefore the Jews[a], because it was the day of preparation[d][c][b], asked Pilate that the bodies might not remain on the cross on the Sabbath—for that Sabbath day was a great one—and that their legs might be broken and they might be taken away.
translation:
  language: tl
  text: Kaya, dahil araw noon ng paghahanda[b], humiling ang mga Judio[a] kay Pilato na mabali ang kanilang mga binti at maalis ang mga katawan[d] upang hindi manatili ang mga ito sa krus sa Sabbath—sapagkat isang dakilang araw ng Sabbath iyon[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang konteksto sa Ebanghelyo ni Juan, ang “mga Judio” ay maaaring mas tiyak na tumukoy sa mga pinunong Judio o sa mga awtoridad sa Judea.
    reason: alternative_reading
  - marker: b
    text: Ang “araw ng paghahanda” ay ang araw ng paghahanda bago ang Sabbath; maaari ring isalin na “Araw ng Paghahanda.”
    reason: lexical_alternative
  - marker: c
    text: O “napakahalaga ang Sabbath na iyon” o “isang natatanging Sabbath iyon.”
    reason: lexical_alternative
  - marker: d
    text: O “ibaba ang mga katawan” o “dalhin palayo ang mga ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ οὖν Ἰουδαῖοι
  choice: Kaya ang mga Judio
  rationale: Ang οὖν ay nagpapakita ng bunga o pagpapatuloy, kaya natural ang “Kaya.” Pinananatili ng “mga Judio” ang mas malawak at hindi agad nililimitahang tawag na Ἰουδαῖοι, habang inilalahad sa talababa ang posibleng mas tiyak na kontekstuwal na kahulugan.
- source_word: ἐπεὶ παρασκευὴ ἦν
  choice: sapagkat araw noon ng paghahanda
  rationale: Ang παρασκευή ay tumutukoy sa araw ng paghahanda bago ang Sabbath. Malinaw ito sa karaniwang mambabasa nang hindi ginagawang teknikal na pantanging pangalan ang salita.
- source_word: ἵνα μὴ μείνῃ ἐπὶ τοῦ σταυροῦ τὰ σώματα ἐν τῷ σαββάτῳ
  choice: na huwag manatili sa krus ang mga katawan sa Sabbath
  rationale: Pinananatili ang layuning ipinahahayag ng ἵνα at ang tahasang pagtukoy sa mga katawan, krus, at Sabbath.
- source_word: ἦν γὰρ μεγάλη ἡ ἡμέρα ἐκείνου τοῦ σαββάτου
  choice: sapagkat dakila ang araw ng Sabbath na iyon
  rationale: Ang “dakila” ay malapit sa μεγάλη at nagpapahiwatig ng natatanging kahalagahan nang hindi ipinapasok sa pangunahing teksto ang mas interpretibong “napakahalagang Sabbath.”
- source_word: ἠρώτησαν τὸν Πιλᾶτον
  choice: humiling kay Pilato
  rationale: Sa konteksto, ang ἐρωτάω ay may diwang paghiling, hindi lamang pagtatanong. Ang “humiling” ay natural at hindi nagsasaad nang tahasan kung pahintulot o utos ang eksaktong hinihingi.
- source_word: ἵνα κατεαγῶσιν αὐτῶν τὰ σκέλη
  choice: na baliin ang kanilang mga binti
  rationale: Tumpak na ipinahahayag ang pagkabali ng mga binti. Ang Tagalog na pokus sa layon ay hindi nagsasaad kung sino mismo ang gagawa, gaya ng pasibong anyo sa Griyego.
- source_word: καὶ ἀρθῶσιν
  choice: at alisin sila
  rationale: 'Malawak ang saklaw ng αἴρω: alisin, dalhin palayo, o ibaba. Ang “alisin sila” ay natural at hindi mas tiyak kaysa sa pinagmulan.'
theological_decisions:
- issue: Saklaw ng Ἰουδαῖοι sa salaysay ni Juan
  choice: mga Judio
  alternative: mga pinunong Judio; mga taga-Judea
  rationale: Nag-iiba ang saklaw ng salita ayon sa konteksto. Hindi tahasang nililimitahan ng talata ang tinutukoy sa mga pinuno, kaya pinanatili sa pangunahing teksto ang mas tuwirang katawagan at inilagay sa talababa ang kontekstuwal na posibilidad.
- issue: Kahulugan ng μεγάλη kaugnay ng Sabbath
  choice: dakila ang araw ng Sabbath na iyon
  alternative: napakahalaga ang Sabbath na iyon; isang natatanging Sabbath iyon
  rationale: Pinananatili ng “dakila” ang lakas at bahagyang pagiging bukas ng μεγάλη. Hindi nito tinutukoy nang higit sa teksto ang eksaktong dahilan ng natatanging kahalagahan ng Sabbath na iyon.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “Sabbath” bilang pamilyar na terminong biblikal at iniwasan ang mas lumang sintaks o labis na teknikal na pananalita. Ang ayos ng pangungusap ay nananatiling malapit sa lohika ng Griyego habang pinananatiling malinaw ang mahabang pahayag.
