revisions:
- from: Kaya ang mga Judio[a], sapagkat araw noon ng paghahanda[b], ay humiling kay Pilato na huwag manatili sa krus ang mga katawan sa Sabbath—sapagkat dakila ang araw ng Sabbath na iyon[c]—at na baliin ang kanilang mga binti at alisin sila[d].
  to: Kaya, dahil araw noon ng paghahanda[b], humiling ang mga Judio[a] kay Pilato na mabali ang kanilang mga binti at maalis ang mga katawan[d] upang hindi manatili ang mga ito sa krus sa Sabbath—sapagkat isang dakilang araw ng Sabbath iyon[c].
  rationale: Inayos ang sintaks upang malinaw na ang hiniling kay Pilato ay ang pagbali sa mga binti at pag-aalis sa mga katawan, na may layuning hindi manatili ang mga katawan sa krus sa Sabbath. Pinalitan din ang masikip na literal na ayos ng “dakila ang araw ng Sabbath na iyon” ng mas likas na Tagalog na nananatiling malapit sa Griyego. Napanatili ang lahat ng footnote anchor at ang hindi tiyak na saklaw ng Ἰουδαῖοι.
