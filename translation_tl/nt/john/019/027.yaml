  text: Then he said to the disciple, “Look, your mother.” And from that hour the disciple took her into his own home.
translation:
  language: tl
  text: Pagkatapos, sinabi niya sa alagad, “Narito ang iyong ina.” Mula sa oras na iyon, isinama siya ng alagad sa kanyang sariling tahanan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶτα
  choice: Pagkatapos
  rationale: Likas at malinaw na panandang nagsasaad ng kasunod na sinabi ni Jesus.
- source_word: Ἴδε
  choice: Narito
  rationale: Pinananatili ang tuwirang pantawag-pansin at presentasyonal na lakas ng salitang Griyego nang hindi gumagamit ng makalumang pananalita.
- source_word: ἔλαβεν
  choice: kinupkop
  rationale: Sa konteksto, hindi lamang pisikal na 'kinuha' ang ipinahihiwatig kundi ang pagtanggap sa kaniya sa pangangalaga at sambahayan ng alagad.
- source_word: εἰς τὰ ἴδια
  choice: sa sarili nitong tahanan
  rationale: Ipinahahayag ang kontekstuwal na diwa ng idyomang tumutukoy sa sariling tahanan o sambahayan; ang 'nito' ay tumutukoy sa alagad.
theological_decisions:
- issue: Ugnayang itinatatag sa pagitan ng alagad at ng ina ni Jesus
  choice: “Narito ang iyong ina.”
  alternative: “Tingnan mo, ang iyong ina.”
  rationale: Pinananatili ang payak at bukas na pahayag ng teksto nang hindi dinaragdagan ng paliwanag tungkol sa saklaw o doktrinal na kahulugan ng pagiging ina.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “alagad” bilang karaniwang katawagan sa μαθητής at iniwasan ang makalumang “masdan.”
