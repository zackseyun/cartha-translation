  verdict: revise
  source_fidelity: Ang “Narito ang iyong ina” ay tapat sa Ἴδε ἡ μήτηρ σου at pinananatili ang payak na pahayag nang walang doktrinal na pagpapalawig. Gayunman, ang “Mula nang oras na iyon” ay hindi wastong pagmamarka ng χρονικό na parirala; ang ἀπ’ ἐκείνης τῆς ὥρας ay “mula sa oras na iyon.” Ang “kinupkop” ay maaaring magdagdag ng diin sa pagkalinga na hindi tuwirang nasa ἔλαβεν; mas malapit ang “isinama ... sa kanyang sariling tahanan” sa konteksto ng εἰς τὰ ἴδια.
  naturalness: Hindi likas ang “Mula nang oras na iyon,” at ang “sarili nitong tahanan” ay diangkop dahil ang “alagad” ay karaniwang tinutukoy sa personal na panghalip na “niyang,” hindi “nitong.” Ang rebisyon ay natural na modernong Filipino at malinaw ang mga tinutukoy na tauhan.
  terminology: Ang “alagad” ay angkop para sa μαθητής. Ang “ina” ay tapat at walang idinagdag na interpretasyong teolohikal. Walang kinakailangang talababa o footnote anchor sa talatang ito.
  issues:
  - severity: medium
    issue: 'Maling anyo ng panandang panahon: “Mula nang oras na iyon.”'
    rationale: Ang “nang” ay hindi angkop sa pariralang ito. Ang pinagmulan ay nagsasabing “mula sa oras na iyon,” hindi “simula nang [pandiwa/pangyayari].”
  - severity: medium
    issue: Diangkop na panghalip sa “sarili nitong tahanan.”
    rationale: Ang “nito” ay karaniwang di-personal at hindi natural para sa alagad na tao; “sarili niyang tahanan” ang wastong anyo.
  - severity: low
    issue: Ang “kinupkop” ay mas interpretatibo kaysa sa ἔλαβεν.
    rationale: Bagaman maaaring ipahiwatig ng konteksto ang pagtanggap at pangangalaga, ang pandiwa ay mas payak na “tinanggap” o “isinama” sa sariling sambahayan/tahanan.
  revised_text: Pagkatapos, sinabi niya sa alagad, “Narito ang iyong ina.” Mula sa oras na iyon, isinama siya ng alagad sa kanyang sariling tahanan.
