id: JHN.1.25
reference: John 1:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἠρώτησαν αὐτὸν καὶ εἶπαν αὐτῷ· Τί οὖν βαπτίζεις εἰ σὺ οὐκ εἶ ὁ χριστὸς ⸂οὐδὲ Ἠλίας οὐδὲ⸃ ὁ προφήτης;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/025.yaml
  text: And they asked him and said to him[a], “Why then are you baptizing, if you are not the Messiah, nor Elijah[b], nor the Prophet?”
translation:
  language: tl
  text: At tinanong nila siya at sinabi, “Kung gayon, bakit ka nagbabautismo kung hindi ikaw ang Mesiyas[a], ni si Elias, ni ang Propeta[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang Cristo.” Ang Griyegong τίulong Χριστός (Christos) ay isinalin dito bilang “Mesiyas” upang mapanatili ang kontekstong Judio; literal itong nangangahulugang “Pinahiran.”
    reason: alternative_reading
  - marker: b
    text: Maaaring tumukoy ang “Propeta” sa hinihintay na propetang gaya ni Moises (tingnan ang Deuteronomio 18:15).
    reason: cross_reference
lexical_decisions:
- source_word: ἠρώτησαν αὐτὸν καὶ εἶπαν αὐτῷ
  choice: tinanong nila siya
  rationale: Ang dalawang pandiwang Griyego ay bumubuo rito ng karaniwang pormula sa pagpapakilala ng tuwirang tanong. Ang likas na Tagalog na “tinanong nila siya” ay naghahatid ng buong diwa nang hindi inuulit nang alanganin ang “at sinabi sa kanya.”
- source_word: Τί οὖν
  choice: Kung gayon, bakit
  rationale: Bagaman literal na “ano” ang τί, humihingi rito ang parirala ng dahilan o batayan. Ipinahahayag ng “Kung gayon, bakit” ang lohikal na puwersa ng οὖν at ang likas na anyo ng tanong sa Tagalog.
- source_word: βαπτίζεις
  choice: nagbabautismo
  rationale: Ang aspektong imperpektibo ng pandiwang Tagalog ay angkop sa kasalukuyan at nagpapatuloy na gawain ni Juan na siyang pinagtatanungan.
- source_word: ὁ χριστός
  choice: ang Mesiyas
  rationale: Tiyak na titulo ito sa kontekstong Judio, hindi personal na pangalan. Ang “Mesiyas” ay malinaw at karaniwan sa modernong saling Tagalog.
- source_word: Ἠλίας
  choice: Elias
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Tagalog.
- source_word: ὁ προφήτης
  choice: ang Propeta
  rationale: Ang tiyak na pantukoy ay tumutukoy sa isang kinikilalang hinihintay na tauhan; pinanatili ang puwersang pantitulo sa malaking titik.
- source_word: οὐδὲ ... οὐδὲ
  choice: ni ... ni
  rationale: Likas na ipinagpapatuloy ng “ni ... ni” ang serye ng mga itinatangging pagkakakilanlan matapos ang “hindi ikaw.”
theological_decisions:
- issue: Paglilipat sa Χριστός bilang titulo sa tanong tungkol sa pagkakakilanlan
  choice: Mesiyas
  alternative: Cristo
  rationale: Nananatili sa “Mesiyas” ang kontekstong Judio at ang katangian nitong titulo, habang inilalahad sa talababa ang tradisyonal na alternatibo.
- issue: Kung tiyak na hinihintay na tauhan ang ὁ προφήτης
  choice: ang Propeta
  alternative: ang propeta
  rationale: Ang pantukoy at ang pagkakahanay nito sa Mesiyas at kay Elias ay nagpapakitang isang natatanging hinihintay na tauhan ang tinutukoy, ngunit hindi tinutukoy nang higit sa sinasabi ng teksto ang eksaktong relasyon niya sa ibang mga tauhan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Kung gayon, bakit” para sa natural na pangangatwiran ng tanong, at iniwasan ang mekanikal na pag-uulit ng Griyegong pormula ng pagsasalita.
