  naturalness: Likas at malinaw ang “Kung gayon, bakit ka nagbabautismo,” gayundin ang “Mesiyas,” “Elias,” at ang pantitulong “Propeta.” Ang “tinanong nila siya at sinabi” ay natural na Tagalog na paraan upang mapanatili ang dalawang pandiwa nang walang hindi kailangang pag-uulit ng “sa kaniya.”
