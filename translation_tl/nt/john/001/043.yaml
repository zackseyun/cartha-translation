id: JHN.1.43
reference: John 1:43
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Τῇ ἐπαύριον ἠθέλησεν ἐξελθεῖν εἰς τὴν Γαλιλαίαν. καὶ εὑρίσκει Φίλιππον καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/043.yaml
  text: The next day he wanted to go out into Galilee[a], and Jesus finds Philip and says to him[c][b], “Follow me.”
translation:
  language: tl
  text: Kinabukasan, ninais niyang pumunta sa Galilea. Natagpuan ni Jesus si Felipe at sinabi sa kanya, “Sumunod ka sa akin.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Sumunod ka sa akin” ay maaaring tumukoy kapwa sa literal na pagsama kay Jesus at sa mas malawak na tawag na maging alagad niya.
    reason: alternative_reading
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: Kinabukasan
  rationale: Likas at malinaw na panandang temporal sa modernong Tagalog na nagpapanatili sa pagkakasunod-sunod ng salaysay.
- source_word: ἠθέλησεν
  choice: ninais niya
  rationale: Pinananatili ang diwa ng pagnanais o pagkukusa nang hindi ito pinatitindi bilang isang pormal na pagpapasya.
- source_word: ἐξελθεῖν εἰς τὴν Γαλιλαίαν
  choice: pumunta sa Galilea
  rationale: Natural sa Tagalog ang “pumunta sa” para sa pagkilos patungo o papasok sa isang rehiyon; hindi kailangang ilantad nang hiwalay ang literal na “lumabas” dahil magiging mabigat at kulang sa likas na daloy.
- source_word: εὑρίσκει
  choice: Natagpuan
  rationale: Ginawang pangnagdaan ang makasaysayang pangkasalukuyan ng Griyego upang maging natural ang salaysay sa Tagalog.
- source_word: λέγει
  choice: sinabi
  rationale: Ginawang pangnagdaan ang makasaysayang pangkasalukuyan alinsunod sa karaniwang daloy ng salaysay sa Tagalog.
- source_word: Φίλιππον
  choice: Felipe
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa Bibliyang Tagalog.
- source_word: Ἀκολούθει μοι
  choice: Sumunod ka sa akin
  rationale: Natural na utos sa Tagalog na maaaring tumukoy kapwa sa literal na pagsama at sa patuloy na pagiging alagad.
theological_decisions:
- issue: Saklaw ng utos ni Jesus kay Felipe
  choice: “Sumunod ka sa akin,” na bukás kapwa sa literal na pagsama at sa tawag na maging alagad
  alternative: “Sumama ka sa akin,” na pangunahing nagpapahiwatig lamang ng pisikal na paglalakbay
  rationale: Ang ἀκολούθει μοι ay may agarang kahulugang pagsunod kay Jesus ngunit may mas malawak ding bigat ng pagiging alagad sa mga Ebanghelyo. Pinananatili ng salin ang dalawang antas nang hindi ipinapaliwanag nang labis sa mismong teksto.
translation_notes:
  register: Modernong Filipino Tagalog na simple, marangal, at madaling maunawaan. Ginamit ang “ninais” upang mapanatili ang kusang hangarin ng ἠθέλησεν, at ang karaniwang pangnagdaan para sa mga makasaysayang pangkasalukuyan ng Griyego.
