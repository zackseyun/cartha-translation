  text: ἀπεκρίθη αὐτοῖς ὁ Ἰωάννης λέγων· Ἐγὼ βαπτίζω ἐν ὕδατι· ⸀μέσος ὑμῶν ⸀ἕστηκεν ὃν ὑμεῖς οὐκ οἴδατε,
base_translation:
  language: en
  yaml_path: translation/nt/john/001/026.yaml
  text: John answered them[a], saying, “I baptize in water. Among you stands one whom you do not know,”
translation:
  language: tl
  text: Sumagot si Juan sa kanila, “Nagbabautismo ako sa tubig. Sa gitna ninyo ay may isang nakatayo na hindi ninyo kilala.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς ὁ Ἰωάννης λέγων
  choice: Sumagot sa kanila si Juan
  rationale: Natural na salaysay sa modernong Tagalog; hindi na kailangang hiwalay na isalin ang λέγων dahil maayos nang ipinakikilala ng tuwirang sipi ang nilalaman ng sagot.
- source_word: βαπτίζω
  choice: nagbabautismo
  rationale: Itinatag na terminong Kristiyano na hindi nagpapakipot sa kahulugan tungo sa isang partikular na paraan ng bautismo.
- source_word: ἐν ὕδατι
  choice: sa tubig
  rationale: Pinananatili ang ugnayang ipinahihiwatig ng ἐν nang natural sa Tagalog, nang hindi nagpapasya sa mas tiyak na paraang 'gamit ang tubig.'
- source_word: μέσος ὑμῶν
  choice: sa gitna ninyo
  rationale: Malinaw at likas na katumbas na nagsasaad na naroon ang taong tinutukoy sa pangkat nila.
- source_word: ἕστηκεν
  choice: nakatayo
  rationale: Ipinahahayag ang kasalukuyang kalagayang bunga ng pagtayo, na siyang puwersa ng Greek perfect sa kontekstong ito.
- source_word: ὃν ὑμεῖς οὐκ οἴδατε
  choice: na hindi ninyo kilala
  rationale: Pinananatili ang malawak na kahulugan ng οἶδα; hindi ito nililimitahan sa 'nakikilala' o pagkilala lamang sa paningin.
theological_decisions:
- issue: Pagkakakilanlan ng taong nakatayo sa gitna nila
  choice: “may isang” nang hindi pinapangalanan
  alternative: “ang Mesiyas” o “si Jesus”
  rationale: Bagaman nililinaw ng mas malawak na konteksto ang kanyang pagkakakilanlan, hindi siya pinapangalanan sa talatang ito. Pinananatili nito ang sadyang pananabik at tensiyong pampanitikan.
- issue: Ugnayan ng dalawang pahayag
  choice: Idinugtong ang “Ngunit”
  alternative: Walang tahasang pang-ugnay
  rationale: Walang katumbas na conjunction sa Greek, ngunit ipinakikita ng “Ngunit” sa natural na Tagalog ang kontekstuwal na paghahambing sa pagitan ng ministeryo ni Juan at ng di-kilalang naroroon. Hindi nito tinutukoy ang pagkakakilanlan ng taong iyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang karaniwang “nagbabautismo” at iniwasan ang salitang maaaring magtakda ng denominasyonal na paraan ng bautismo. Walang talababa dahil walang mahalagang tekstuwal o leksikal na alternatibong nangangailangan nito sa saling Tagalog.
