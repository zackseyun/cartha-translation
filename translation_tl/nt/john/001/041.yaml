  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εὑρίσκει οὗτος ⸀πρῶτον τὸν ἀδελφὸν τὸν ἴδιον Σίμωνα καὶ λέγει αὐτῷ· Εὑρήκαμεν τὸν Μεσσίαν (ὅ ἐστιν μεθερμηνευόμενον χριστός).
base_translation:
  language: en
  yaml_path: translation/nt/john/001/041.yaml
  text: He first found his own brother Simon and said to him[a], “We have found the Messiah” (which means Messiah).
translation:
  language: tl
  text: Una niyang natagpuan ang sarili niyang kapatid na si Simon at sinabi rito, “Natagpuan na namin ang Mesiyas” (na ang ibig sabihin ay “ang Pinahiran”).
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὑρίσκει
  choice: natagpuan
  rationale: Ginawang pangnagdaan ang makasaysayang pangkasalukuyan ng Griyego upang maging likas ang salaysay sa Tagalog.
- source_word: οὗτος
  choice: niyang
  rationale: Tumutukoy ito kay Andres sa naunang konteksto; sapat at natural ang panghalip sa Tagalog.
- source_word: πρῶτον
  choice: Una
  rationale: Pinananatili ang temporal o sunud-sunod na diin ng salita.
- source_word: ἀδελφὸν τὸν ἴδιον
  choice: ang sarili niyang kapatid
  rationale: Pinananatili ng “sarili niyang” ang pagbibigay-diin ng ἴδιον, at malinaw sa konteksto na lalaki si Simon.
- source_word: Σίμωνα
  choice: Simon
  rationale: Isinalin sa karaniwang anyo ng pangalang ginagamit sa modernong Tagalog.
- source_word: λέγει αὐτῷ
  choice: sinabi rito
  rationale: Ginawang pangnagdaan ang makasaysayang pangkasalukuyan; ang “rito” ay natural na tumutukoy kay Simon.
- source_word: Εὑρήκαμεν
  choice: Natagpuan na namin
  rationale: Ang “na” ay nagpapahayag ng natapos na pagkatuklas na may patuloy na kabuluhan, alinsunod sa Griyegong perfect.
- source_word: Μεσσίαν
  choice: Mesiyas
  rationale: Pinananatili ang Semitikong titulong Μεσσίας sa anyong nakasanayan sa Tagalog.
- source_word: μεθερμηνευόμενον
  choice: na kung isasalin ay
  rationale: Tuwirang ipinahahayag na ang kasunod ay salin o katumbas na katawagan.
- source_word: χριστός
  choice: Ang Pinahiran
  rationale: Ipinakikita ang leksikal na kahulugan ng katumbas na Griyegong titulo at pinananatili ang paliwanag na tungkulin ng parentesis.
theological_decisions:
- issue: Paglalahad ng ugnayan ng Μεσσίας at χριστός
  choice: “Mesiyas” ... “Ang Pinahiran”
  alternative: “Mesiyas” ... “Cristo” o “Mesiyas” ... “Mesiyas”
  rationale: Magkatumbas na titulo sa magkaibang wika ang Μεσσίας at χριστός. Ang “Ang Pinahiran” ay nagpapanatili sa paliwanag ng may-akda, samantalang ang pag-uulit ng “Mesiyas” ay magpapalabo rito; ang “Cristo” naman ay maaaring mabasa bilang pangalan sa modernong Tagalog.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “rito” upang maiwasan ang mabigat na “sa kanya,” at panipi sa “Ang Pinahiran” upang markahan ang isinaling katumbas na titulo.
