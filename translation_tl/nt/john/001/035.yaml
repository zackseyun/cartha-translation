  text: Τῇ ἐπαύριον πάλιν εἱστήκει ⸀ὁ Ἰωάννης καὶ ἐκ τῶν μαθητῶν αὐτοῦ δύο,
base_translation:
  language: en
  yaml_path: translation/nt/john/001/035.yaml
  text: On the next day[a], John was standing there again, and two of his disciples were with him.
translation:
  language: tl
  text: Kinabukasan, nakatayo na naman si Juan, kasama ang dalawa sa kanyang mga alagad.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: Kinabukasan
  rationale: Ang pariralang ito ay isang idyomang temporal na tumutukoy sa sumunod na araw. Likas at malinaw sa makabagong Tagalog ang “Kinabukasan.”
- source_word: πάλιν
  choice: na naman
  rationale: Ipinahihiwatig ng πάλιν ang pag-uulit at ang pagpapatuloy mula sa naunang tagpo. Sa ayos na “nakatayo na naman,” natural nitong ipinapahayag na muling naroon si Juan sa gayong kalagayan.
- source_word: εἱστήκει
  choice: nakatayo
  rationale: Ang anyo ng ἵστημι ay naglalarawan ng nagpapatuloy na kalagayan sa nakaraan. Ang “nakatayo” ay likas na statibong paglalarawan sa Tagalog at hindi nangangailangang dagdagan ng “doon,” na wala naman sa Griyego.
- source_word: ὁ Ἰωάννης
  choice: si Juan
  rationale: Karaniwang anyo sa Tagalog ng pangalang Ἰωάννης. Hindi pinalawak bilang “Juan na Tagapagbautismo” sapagkat “Juan” lamang ang nasa tekstong Griyego.
- source_word: καὶ
  choice: kasama
  rationale: Bagaman payak na pang-ugnay ang καὶ, ang kasunod na pariralang walang tahasang pandiwa ay natural na ipinapahayag sa Tagalog sa pamamagitan ng “kasama,” nang hindi binabago ang tagpo.
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ δύο
  choice: ang dalawa sa kanyang mga alagad
  rationale: 'Pinananatili ng “dalawa sa kanyang mga alagad” ang partitive na diwa ng ἐκ: dalawang kabilang sa mas malaking pangkat ng mga alagad ni Juan.'
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinili ang maikling ayos na “Kinabukasan” at ang likas na statibong “nakatayo.” Hindi isinama ang paliwanag na “doon” sapagkat hindi ito tahasang nasa Griyego; ang “kasama” ang natural na nag-uugnay sa dalawang alagad sa tagpo.
