  text: λέγει αὐτῷ Ναθαναήλ· Πόθεν με γινώσκεις; ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Πρὸ τοῦ σε Φίλιππον φωνῆσαι ὄντα ὑπὸ τὴν συκῆν εἶδόν σε.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/048.yaml
  text: Nathanael said to him[a], “How do you know me?” Jesus answered and said to him, “Before Philip called you, while you were under the fig tree, I saw you.”
translation:
  language: tl
  text: Sinabi ni Natanael sa kanya[a], “Paano mo ako nakikilala?” Sumagot si Jesus at sinabi sa kanya, “Bago ka tawagin ni Felipe, nakita kita habang nasa ilalim ka ng puno ng igos.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, literal na, “Mula saan mo ako nakikilala?”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πόθεν με γινώσκεις
  choice: Paano mo ako nakikilala?
  rationale: Ang Πόθεν ay literal na “mula saan,” ngunit kasama ng γινώσκεις ay likas na nagtatanong kung paano o sa anong batayan siya nakikilala. Ang “Paano mo ako nakikilala?” ay malinaw at natural sa modernong Tagalog.
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ
  choice: Sumagot si Jesus at sinabi sa kanya
  rationale: Pinananatili ang dalawang pandiwa ng Griyego at ang estilong pasalaysay ni Juan nang hindi nagiging labis na mabigat sa Tagalog.
- source_word: Πρὸ τοῦ σε Φίλιππον φωνῆσαι
  choice: Bago ka tawagin ni Felipe
  rationale: Malinaw na ipinahahayag ang naunang panahon na tinutukoy ng Πρὸ τοῦ at ang karaniwang kahulugan ng φωνέω na “tawagin.”
- source_word: ὄντα ὑπὸ τὴν συκῆν
  choice: habang nasa ilalim ka ng puno ng igos
  rationale: Inilalahad ng participle ang kalagayan ni Natanael nang makita siya; natural sa Tagalog ang “habang nasa ilalim ka.”
- source_word: εἶδόν σε
  choice: nakita kita
  rationale: Tuwirang katumbas ng aorist na “I saw you”; sapat nang nililinaw ng “bago” ang pagkakasunod ng mga pangyayari.
- source_word: συκῆν
  choice: puno ng igos
  rationale: Karaniwan at tiyak na katawagan sa Tagalog para sa fig tree.
theological_decisions:
- issue: Kalikasan ng pagkakilala at pagkakita ni Jesus kay Natanael
  choice: Isinalin nang tuwiran nang hindi ipinapaliwanag kung supernatural, propetiko, o karaniwang pagkakita ito.
  alternative: Hayagang ipahiwatig ang supernatural na kaalaman o gawing karaniwang naunang pagmamasid lamang.
  rationale: Hindi ipinaliliwanag ng talata mismo ang paraan ng pagkakaalam ni Jesus; pinananatili ng tuwirang salin ang teolohikal na tensiyon at hinahayaang ang konteksto ang gumabay sa mambabasa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “nakikilala” upang ipahayag ang personal na pagkakilala, at “puno ng igos” para sa madaling pagkaunawa ng karaniwang mambabasa.
