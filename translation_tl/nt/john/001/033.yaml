  naturalness: Kailangang ayusin ang sugnay tungkol sa pagbaba at pananatili ng Espiritu. Ang aktibong ayos na “makikita mong bumababa ang Espiritu sa kanya at nananatili sa kanya” ay malinaw, natural na modernong Tagalog, at mas malapit sa sintaks at saklaw ng dalawang participle sa Griyego.
  terminology: Ang “magbautismo,” “Espiritu,” at “Banal na Espiritu” ay angkop sa modernong Filipino Tagalog at sa rehistro ng teksto. Ang “sa tubig” at “sa Banal na Espiritu” ay wastong nagpapanatili ng paralelismo ng ἐν nang hindi nagpapataw ng interpretasyong instrumental.
