source:
  edition: SBLGNT
  text: κἀγὼ οὐκ ᾔδειν αὐτόν, ἀλλ’ ὁ πέμψας με βαπτίζειν ἐν ὕδατι ἐκεῖνός μοι εἶπεν· Ἐφ’ ὃν ἂν ἴδῃς τὸ πνεῦμα καταβαῖνον καὶ μένον ἐπ’ αὐτόν, οὗτός ἐστιν ὁ βαπτίζων ἐν πνεύματι ἁγίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/033.yaml
  text: And I did not know him[a], but the one who sent me to baptize in water said to me, ‘The one on whom you see the Spirit descending and remaining on him[c][b], this is he who baptizes in the Holy Spirit.’
translation:
  language: tl
  text: At hindi ko rin siya kilala noon[a]. Ngunit sinabi sa akin ng nagsugo sa akin upang magbautismo sa tubig, “Ang taong makikita mong bumababa ang Espiritu sa kanya at nananatili sa kanya[b], siya ang nagbabautismo sa Banal na Espiritu[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hindi ko rin siya nakilala noon.” Maaaring tumukoy ang Griyego sa hindi pagiging kakilala o sa hindi pa pagkilala kung sino talaga siya.
    reason: lexical_alternative
  - marker: b
    text: Ang “nananatili” ay salin ng isang mahalagang pandiwa sa Juan na maaari ring isaling “nananahan.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “magbautismo gamit ang tubig” at “magbautismo sa pamamagitan ng Banal na Espiritu.” Iisang pang-ukol na nangangahulugang “sa” ang ginamit sa Griyego sa dalawang parirala, kaya pinanatili rito ang pagkakapantay ng mga ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ οὐκ ᾔδειν αὐτόν
  choice: At hindi ko rin siya kilala noon
  rationale: Ipinapahayag ng κἀγώ ang pagpapatuloy at diin sa nagsasalita, samantalang ang imperfect na ᾔδειν ay tumutukoy sa dating kawalan ng pagkakilala o pagkilala. Nililinaw ng “noon” ang panahong tinutukoy nang hindi nagpapasya kung personal na kakilala o hindi pa nakikilalang Mesiyas ang diwa.
- source_word: ὁ πέμψας με
  choice: ang nagsugo sa akin
  rationale: Likas at tuwirang salin ito ng substantival aorist participle at hindi nangangailangan ng makalumang hulma.
- source_word: βαπτίζειν ἐν ὕδατι
  choice: upang magbautismo sa tubig
  rationale: Ipinapakita ng “upang” ang layunin ng pagsusugo. Pinananatili ng “sa tubig” ang ἐν at ang pagkakapantay ng parirala sa “sa Banal na Espiritu.”
- source_word: Ἐφ’ ὃν ἂν ἴδῃς
  choice: Ang taong makita mong
  rationale: Natural sa modernong Tagalog ang hulma at napapanatili nito ang tanda ng pagkakakilanlan nang hindi nagdaragdag ng katiyakan na wala sa pangungusap.
- source_word: τὸ πνεῦμα καταβαῖνον καὶ μένον ἐπ’ αὐτόν
  choice: binababaan ng Espiritu at nananatili ang Espiritu sa kanya
  rationale: Ang “binababaan” ay naghahayag ng kilos pababa, at ang “nananatili” ay nagpapanatili sa mahalagang Johannine na diwa ng μένω. Inulit ang “Espiritu” upang maging malinaw at natural ang dalawang pandiwaring Griyego sa Tagalog.
- source_word: οὗτός ἐστιν ὁ βαπτίζων ἐν πνεύματι ἁγίῳ
  choice: siya ang nagbabautismo sa Banal na Espiritu
  rationale: Pinananatili ng “siya ang” ang mariing pagkakakilanlan ng οὗτός ἐστιν, at ng “sa” ang pagkakatulad sa naunang pagbautismo sa tubig.
theological_decisions:
- issue: Pagkilala sa πνεῦμα bilang banal na Espiritu
  choice: Espiritu ... Banal na Espiritu
  alternative: espiritu ... banal na espiritu
  rationale: Tinutukoy ng konteksto ang banal na Espiritu, at tahasang may ἁγίῳ sa huling parirala. Ang malaking titik ay pagkilala sa tinutukoy, hindi pagdaragdag ng doktrina.
- issue: Kahulugan ng οὐκ ᾔδειν
  choice: hindi ko rin siya kilala noon
  alternative: hindi ko rin siya nakilala noon
  rationale: Maaaring mangahulugan ang Griyego ng kawalan ng personal na pagkakilala o ng hindi pa pagkilala sa tunay na pagkakakilanlan niya. Pinili ang mas tuwirang salin at inilagay sa talababa ang isa pang posibilidad.
- issue: Pang-ukol sa dalawang parirala ng pagbautismo
  choice: sa tubig ... sa Banal na Espiritu
  alternative: gamit ang tubig ... sa pamamagitan ng Banal na Espiritu
  rationale: Iisang pang-ukol na ἐν ang ginamit sa Griyego. Ang “sa” sa dalawang parirala ay nagpapanatili sa sadyang pagkakapantay nang hindi ipinapaliwanag nang labis ang paraan o instrumento.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang karaniwang biblikal na “magbautismo” at iniwasan ang makaluma o sobrang teknikal na ayos. Ang pag-uulit ng “Espiritu” ay sadyang paglilinaw na kailangan sa natural na Tagalog.
