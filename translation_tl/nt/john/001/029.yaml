  text: Τῇ ἐπαύριον βλέπει τὸν Ἰησοῦν ἐρχόμενον πρὸς αὐτόν, καὶ λέγει· Ἴδε ὁ ἀμνὸς τοῦ θεοῦ ὁ αἴρων τὴν ἁμαρτίαν τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/029.yaml
  text: The next day he sees Jesus coming toward him and says, “Look, the Lamb of God, who takes away the sin of the world!”
translation:
  language: tl
  text: Kinabukasan, nakita niya si Jesus na lumalapit sa kanya, at sinabi niya, “Tingnan! Ang Kordero ng Diyos, na nag-aalis ng kasalanan ng sanlibutan!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: Kinabukasan
  rationale: Likas at tumpak na katumbas sa modernong Filipino ng ‘nang sumunod na araw.’
- source_word: βλέπει
  choice: nakita niya
  rationale: Ginamit ang natural na Filipino narrative form; bagaman historical present ang Griyego, mas maayos sa salaysay ang aspektong naganap.
- source_word: Ἴδε
  choice: Tingnan ninyo!
  rationale: Nagpapahayag ng matinding pagtawag-pansin sa mga nakikinig; ang maramihang anyo ay angkop sa di-tiyak ngunit malamang na pangkat ng tagapakinig.
- source_word: ὁ ἀμνὸς τοῦ θεοῦ
  choice: Ang Kordero ng Diyos
  rationale: Pinananatili ang mahalagang metaporang teolohikal at ang ugnayang ipinahihiwatig ng genitive.
- source_word: ὁ αἴρων
  choice: na nag-aalis
  rationale: Sinasaklaw ang pangunahing diwa ng αἴρω bilang pag-aalis o pagdadala palayo, nang hindi nagdaragdag ng tiyak na paliwanag sa paraan.
- source_word: τὴν ἁμαρτίαν τοῦ κόσμου
  choice: ng kasalanan ng sanlibutan
  rationale: Pinananatili ang isahan na ‘kasalanan’ at ang malawak na saklaw ng κόσμος.
theological_decisions:
- issue: Kahulugan ng ‘Kordero ng Diyos’
  choice: Pinanatili bilang ‘Kordero ng Diyos’ nang walang paliwanag sa mismong talata.
  alternative: Tukuyin bilang handog na kordero o iugnay nang tahasan sa Paskuwa.
  rationale: Hindi tinutukoy ng teksto rito kung aling partikular na sakripisyal o biblikal na larawan ang nangingibabaw, kaya hindi dapat lutasin sa salin ang tunay na lawak ng metapora.
- issue: Saklaw at paraan ng αἴρων
  choice: ‘nag-aalis’
  alternative: ‘nagpapasan’ o ‘nagdadala’
  rationale: Maaaring magtaglay ang pandiwa ng mga kaugnay na diwa, ngunit sa konstruksyong ito ang pag-aalis ng kasalanan ang pinakanatural; hindi naman nililinaw ng salin ang eksaktong paraan ng pag-aalis.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang ‘sanlibutan’ bilang pamilyar na terminong biblikal ngunit nauunawaan pa rin sa kasalukuyang gamit.
