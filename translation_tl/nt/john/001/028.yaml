  yaml_path: translation/nt/john/001/028.yaml
  text: These things took place in Bethany beyond the Jordan[a], where John was baptizing.
translation:
  language: tl
  text: Ang mga bagay na ito ay nangyari sa Betania, sa kabila ng Ilog Jordan[a], kung saan nagbabautismo si Juan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang manuskrito at sa mga sumunod na tradisyon ng pagsasalin, “Betabara” ang mababasa sa halip na “Betania.”
    reason: textual_variant
lexical_decisions:
- source_word: ταῦτα
  choice: ang mga bagay na ito
  rationale: Pinananatili ang pangmaramihang demonstratibo na tumutukoy sa naunang pag-uusap at mga pangyayari.
- source_word: ἐν Βηθανίᾳ
  choice: sa Betania
  rationale: Likas na panandang panlunan sa modernong Tagalog para sa pangalan ng lugar.
- source_word: ἐγένετο
  choice: Nangyari
  rationale: Tuwirang nagsasaad na naganap ang tinutukoy na mga pangyayari, nang hindi gumagamit ng makalumang pananalita.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: sa kabila ng Jordan
  rationale: Pinananatili ang lokasyong nasa kabilang panig ng ilog ayon sa pananaw ng salaysay.
- source_word: ὅπου
  choice: kung saan
  rationale: Natural na panandang nag-uugnay sa sugnay na tumutukoy sa lugar.
- source_word: ἦν ὁ Ἰωάννης βαπτίζων
  choice: nagbabautismo si Juan
  rationale: Ang progresibong anyo ay nagpapahayag ng nagpapatuloy na gawain, alinsunod sa periphrastic imperfect ng Griyego.
theological_decisions:
- issue: 'Pagbasa sa pangalan ng lugar: Βηθανίᾳ (Betania) laban sa variant na Βηθαβαρᾷ (Betabara)'
  choice: Betania
  alternative: Betabara
  rationale: Sinusunod ng pangunahing teksto ang SBLGNT na Βηθανίᾳ. Inilalagay sa talababa ang kilalang variant upang mapanatili ang mahalagang ebidensiyang tekstuwal nang hindi pinapalitan ang napiling kritikal na pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang nakaugaliang terminong “nagbabautismo” at ang karaniwang anyong “Jordan.”
