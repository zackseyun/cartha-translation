translation:
  language: tl
  text: Siya ay kasama ng Diyos nang pasimula.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ang isang ito ay kasama ng Diyos nang pasimula.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: Siya
  rationale: Tumutukoy ito pabalik sa Salita sa talata 1. Likas sa modernong Tagalog ang “Siya” at napapanatili nito ang personal na pagtukoy; ang mas literal na “Ang isang ito” ay matigas at di-likas dito.
- source_word: ἦν
  choice: ay kasama na
  rationale: Ang imperfect ng εἰμί ay nagsasaad ng kalagayang umiiral na nang pasimula. Naipahahayag ng “na” ang aspektong iyon nang hindi gumagamit ng mas mabigat na “umiiral.”
- source_word: ἐν ἀρχῇ
  choice: nang pasimula
  rationale: Likas at marangal itong katumbas sa Tagalog at pinananatili ang malinaw na alusyon sa Genesis 1:1.
- source_word: πρὸς
  choice: kasama
  rationale: Sa konteksto, ipinahahayag ng πρός na may akusatibo ang malapit at personal na kaugnayan habang pinananatili ang pagkakaiba ng tinutukoy. Ang “kasama” ang pinakamaikli at likas na katumbas.
- source_word: τὸν θεόν
  choice: ng Diyos
  rationale: Ang “Diyos” ang natural na pagtukoy sa Tagalog; hindi kailangang tumbasan nang hiwalay ang artikulong Griyego.
theological_decisions:
- issue: Ang tinutukoy ng οὗτος kaugnay ng Juan 1:1
  choice: Itinuring itong pagtukoy pabalik sa Salita at isinaling “Siya.”
  alternative: “Ang isang ito”
  rationale: Binubuod at pinagtitibay ng talata ang sinabi tungkol sa Salita sa talata 1. Pinananatili ng “Siya” ang personal na pagtukoy nang hindi nagdaragdag ng katawagang doktrinal na wala sa teksto.
- issue: Diwa ng πρὸς τὸν θεόν
  choice: Ang ugnayan at pagkakaiba ay ipinahayag bilang “kasama ng Diyos.”
  alternative: “nakaharap sa Diyos” o “nasa piling ng Diyos”
  rationale: Ipinahahayag ng parirala ang malapit na kaugnayan ng Salita sa Diyos habang kinikilala silang magkaiba sa pangungusap. Hindi nito labis na tinutukoy ang metafisikal na kalikasan ng ugnayang iyon.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “nang pasimula” upang mapanatili ang alusyon sa Genesis, at ang “kasama na” upang malinaw na ipahiwatig na umiiral na ang ugnayang ito sa pasimula.
