base_translation:
  language: en
  yaml_path: translation/nt/john/001/037.yaml
  text: And the two disciples heard him speaking[a], and they followed Jesus.
translation:
  language: tl
  text: Narinig ng dalawang alagad si Juan na nagsasalita, at sumunod sila kay Jesus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤκουσαν
  choice: Narinig
  rationale: Ang aorist na ἤκουσαν ay nagsasaad ng payak na pangyayaring narinig nila ang sinabi; hindi nito kinakailangang ipahiwatig ang matagal o masusing pakikinig.
- source_word: οἱ δύο μαθηταὶ αὐτοῦ
  choice: ang dalawang alagad
  rationale: Tumutukoy ito sa dalawang alagad ni Juan na Tagapagbautismo sa naunang konteksto. Natural sa Tagalog na huwag nang ulitin ang panghalip na 'niya' kapag malinaw na ang tinutukoy, at naiiwasan ding mapagkamalang mga alagad na sila ni Jesus bago pa sila sumunod sa kaniya.
- source_word: λαλοῦντος
  choice: ang sinabi niya
  rationale: Bagaman literal na 'habang nagsasalita siya,' ipinahihiwatig ng konstruksiyon na narinig ng mga alagad ang pahayag ni Juan. Ang 'ang sinabi niya' ay natural sa modernong Tagalog at hindi binabago ang diwa ng sabayang kilos sa konteksto.
- source_word: ἠκολούθησαν
  choice: sumunod
  rationale: Pinananatili ng 'sumunod' kapwa ang agarang kahulugang pisikal na pagsunod kay Jesus at ang mas malawak na pahiwatig ng pagiging tagasunod niya.
- source_word: τῷ Ἰησοῦ
  choice: kay Jesus
  rationale: Ang datibo ang tumutukoy sa taong sinundan; ang natural na anyo sa Tagalog ay 'sumunod kay Jesus.'
- source_word: καὶ ... καὶ
  choice: '..., kaya ...'
  rationale: Ang ikalawang καί ay nag-uugnay ng sumunod na pangyayari bilang tugon sa kanilang narinig. Ang 'kaya' ay malinaw at natural sa Tagalog, bagaman maaari ring isaling payak na 'at.'
theological_decisions:
- issue: Tinutukoy ng αὐτοῦ ('niya') sa pariralang 'ang dalawang alagad niya'
  choice: Unawain itong tumutukoy kay Juan na Tagapagbautismo, ngunit isalin bilang 'ang dalawang alagad.'
  alternative: Isaling 'ang dalawa niyang alagad,' na maaaring pansamantalang maging malabo sa Tagalog kung sino ang tinutukoy ng 'niya.'
  rationale: Sa Juan 1:35–36, si Juan ang kasama ng dalawa sa kaniyang mga alagad at siya ang nagsasalita tungkol kay Jesus. Hindi kailangang idagdag ang pangalan ni Juan sa talata, ngunit dapat iwasang ipahiwatig na mga alagad na sila ni Jesus bago nila siya sinundan.
- issue: Saklaw ng kahulugang 'sumunod'
  choice: Panatilihin ang salitang may literal at posibleng kahulugang pagkaalagad.
  alternative: Linawin lamang bilang 'naglakad kasunod ni Jesus' o bilang 'naging mga alagad ni Jesus.'
  rationale: Sa mismong tagpo, pisikal silang sumunod kay Jesus, ngunit may pahiwatig din itong pagkaalagad sa daloy ng salaysay. Ang 'sumunod' ay hindi nagsasara sa alinmang antas ng kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na payak, natural, at marangal. Iniwasan ang mabigat na literalismong 'narinig siyang nagsasalita' dahil hindi ito kasinglinaw at kasingnatural; pinanatili naman ang maikli at masiglang daloy ng salaysay.
