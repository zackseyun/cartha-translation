  - severity: low
    issue: Hindi tahasang inuulit ang paksa sa “hindi itinanggi.”
    rationale: Nauunawaan naman ito, ngunit ang “hindi niya itinanggi” ay mas malinaw at mas natural sa magkakasunod na pandiwang nasa perpektibo.
