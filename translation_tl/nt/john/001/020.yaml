  source_fidelity: Wasto ang pagsasalin ng ὁ χριστός bilang “ang Mesiyas,” at naipapakita ng pag-uulit ng “ipinahayag” ang inuulit na ὡμολόγησεν. Gayunman, ang “sa halip” ay masyadong nagpapahiwatig ng pagpapalit o pagsalungat kaysa sa mariing pag-uulit ng Griyegong καί. Ang “muli” ay mas natural na naghahatid ng retorikal na pag-uulit nang hindi nagdaragdag ng ganitong pagsalungat.
  naturalness: Makabago at marangal ang rehistro. Mas malinaw ang panghalip na paksa sa “hindi niya itinanggi,” at mas likas ang “muli niyang ipinahayag” kaysa “sa halip, ipinahayag niya.”
  terminology: Ang “Mesiyas” ay angkop para sa χριστός bilang titulo sa kontekstong ito. Ang talaang “ang Cristo” ay wastong alternatibong salin; inayos lamang ang pananalita nito upang maging mas likas sa Filipino.
