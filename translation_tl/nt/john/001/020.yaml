  text: καὶ ὡμολόγησεν καὶ οὐκ ἠρνήσατο, καὶ ὡμολόγησεν ὅτι ⸂Ἐγὼ οὐκ εἰμὶ⸃ ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/020.yaml
  text: And he confessed and did not deny[a], but confessed, “I am not the Messiah.”
translation:
  language: tl
  text: Ipinahayag niya ito at hindi niya itinanggi; muli niyang ipinahayag, “Hindi ako ang Mesiyas.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “ang Cristo.” Ang titulong Griyego ay Χριστός (Christos). Dito ay ginagamit ito bilang titulong mesiyaniko, kaya “ang Mesiyas” ang nasa pangunahing teksto.
    reason: alternative_reading
lexical_decisions:
- source_word: ὡμολόγησεν
  choice: ipinahayag
  rationale: Ang ὁμολογέω dito ay tumutukoy sa hayagan at malinaw na pagkilala o pagpapahayag. Pinananatili ang pag-uulit nito sa Griyego upang maipakita ang diin at pormal na tono.
- source_word: οὐκ ἠρνήσατο
  choice: hindi itinanggi
  rationale: Tuwirang katumbas ito ng pagtanggi at pinananatili ang mariing pagkakasunod ng positibo at negatibong pahayag.
- source_word: καὶ ... καὶ ... καὶ
  choice: at ... at ... sa halip
  rationale: Pinananatili ng unang dalawang pang-ugnay ang inuulit na diin, samantalang ipinahahayag ng “sa halip” ang pangwakas na mariing paglilinaw sa natural na Tagalog.
- source_word: Ἐγὼ οὐκ εἰμὶ
  choice: Hindi ako
  rationale: Ang lantad na Ἐγώ ay mariin sa Griyego. Natural nang naipahahayag sa Tagalog ang gayong diin sa tuwirang “Hindi ako,” lalo na sa konteksto ng malinaw na pagtanggi.
- source_word: ὁ χριστός
  choice: ang Mesiyas
  rationale: Gumaganap dito ang Χριστός bilang titulo ng hinihintay na pinahiran, hindi bilang pangalang pantangi; kaya “Mesiyas” ang malinaw at angkop na salin sa kontekstong Judio.
theological_decisions:
- issue: Pagsasalin sa Χριστός bilang titulo
  choice: ang Mesiyas
  alternative: ang Cristo
  rationale: Itinatanggi ni Juan na siya ang hinihintay na pinahirang tagapagligtas. Pinananatili ng “Mesiyas” ang tungkulin ng salita bilang titulo at hindi ipinapalagay na isa na itong pangalang pantangi.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ipinahayag” sa halip na “inamin” upang maiwasan ang di-kinakailangang pahiwatig ng pag-amin sa kasalanan o pagkakamali. Ang “ito” sa unang sugnay ay likas na panandang tumutukoy sa kasunod na tuwirang pahayag.
