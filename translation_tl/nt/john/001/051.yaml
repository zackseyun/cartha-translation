source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Ἀμὴν ἀμὴν λέγω ⸀ὑμῖν, ὄψεσθε τὸν οὐρανὸν ἀνεῳγότα καὶ τοὺς ἀγγέλους τοῦ θεοῦ ἀναβαίνοντας καὶ καταβαίνοντας ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/051.yaml
  text: And he said to him[a], “Truly, truly, I say to you[b], you will see heaven opened and the angels of God ascending and descending on the Son of Man.”
translation:
  language: tl
  text: At sinabi niya sa kanya, “Tunay, tunay, sinasabi ko sa inyo:[a] makikita ninyo ang langit na nakabukas at ang mga anghel ng Diyos na umaakyat at bumababa sa Anak ng Tao.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “inyo” at “ninyo” ay maramihan sa Griyego. Bagaman si Natanael ang kausap ni Jesus sa salaysay, ang pangungusap ay para sa higit sa isang tagapakinig.
    reason: lexical_alternative
  - marker: b
    text: Umaalingawngaw ang larawang ito sa panaginip ni Jacob sa Genesis 28:12; dito, ang pag-akyat at pagbaba ng mga anghel ay iniuugnay sa Anak ng Tao.
    reason: cross_reference
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: Tunay na tunay
  rationale: Pinananatili ang pag-uulit at mariing bigat ng pormula sa natural at malinaw na makabagong Tagalog, sa halip na iwan itong “Amen, amen.”
- source_word: ὑμῖν / ὄψεσθε
  choice: sa inyo / makikita ninyo
  rationale: Malinaw na ipinakikita ng mga panghalip na Tagalog na maramihan ang kausap sa tuwirang pananalita, kahit isang tao ang tinutukoy ng naunang “sa kanya.”
- source_word: τὸν οὐρανὸν ἀνεῳγότα
  choice: ang langit na nakabukas
  rationale: Ipinahahayag ng “nakabukas” ang kalagayang bunga ng pagkakabukas, na kaayon ng ganap na pandiwaring Griyego.
- source_word: ἀγγέλους
  choice: mga anghel
  rationale: Sa pangitain at sa malinaw na kaugnayan sa Diyos, mga makalangit na anghel ang tinutukoy, hindi karaniwang mga mensahero.
- source_word: ἀναβαίνοντας καὶ καταβαίνοντας
  choice: umaakyat at bumababa
  rationale: Natural itong pares sa Tagalog at pinananatili ang direksiyon at alusyon sa Genesis 28:12.
- source_word: ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου
  choice: sa Anak ng Tao
  rationale: Ang “sa” ay natural na naghahayag ng kaugnayan o hantungan ng pag-akyat at pagbaba nang hindi labis na nililinaw ang larawang sadyang may puwang sa Griyego.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Pinananatili ang nakaugaliang titulo at ang mga ugnay nito sa Kasulatan, sa halip na gawing paliwanag o paraphrase.
theological_decisions:
- issue: Paglipat mula sa isahang αὐτῷ (“sa kanya”) tungo sa maramihang ὑμῖν at ὄψεσθε.
  choice: Ginawang tahasang maramihan ang “sa inyo” at “makikita ninyo” sa pangunahing teksto.
  alternative: Gumamit ng anyong hindi malinaw kung isahan o maramihan, o tukuyin lamang si Natanael.
  rationale: Likas na minamarkahan ng Tagalog ang bilang, kaya dapat panatilihin ang sadyang paglawak ng kausap sa Griyego nang hindi nagdaragdag ng “kayong lahat.”
- issue: Ang larawan ay umaalingawngaw sa panaginip ni Jacob sa Genesis 28:12 at itinutuon sa Anak ng Tao.
  choice: Pinanatili ang larawan sa pangunahing teksto at inilagay ang ugnay sa Genesis sa talababa.
  alternative: Ipaliwanag sa mismong talata na ang Anak ng Tao ang bagong hagdan o dako ng paghahayag.
  rationale: Mahalaga ang alusyon ngunit hindi ito dapat gawing tahasang paliwanag o isang tiyak na doktrinal na pagbasa sa pangunahing teksto.
- issue: Saklaw ng ἐπί sa pariralang ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου.
  choice: Isinalin bilang “sa Anak ng Tao.”
  alternative: “sa ibabaw ng Anak ng Tao” o “sa Anak ng Tao bilang hagdan.”
  rationale: Pinananatili ng “sa” ang tunay na puwang ng kahulugan sa ugnayan at direksiyon; ang ibang salin ay maaaring magtakda ng larawang mas tiyak kaysa sa Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Tunay na tunay” upang mapanatili ang dobleng pagdidiin nang hindi maging labis na makaluma. Tahasang maramihan ang “inyo/ninyo,” at pinanatiling hindi labis na ipinaliwanag ang “sa Anak ng Tao.”
