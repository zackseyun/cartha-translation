  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: κἀγὼ οὐκ ᾔδειν αὐτόν, ἀλλ’ ἵνα φανερωθῇ τῷ Ἰσραὴλ διὰ τοῦτο ἦλθον ἐγὼ ⸀ἐν ὕδατι βαπτίζων.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/031.yaml
  text: 'And I did not know him[a], but for this reason I came baptizing in water: that he might be revealed to Israel.'
translation:
  language: tl
  text: 'At hindi ko siya kilala[a], ngunit naparito akong nagbabautismo sa tubig para rito: upang maihayag siya sa Israel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi ko siya nakilala.” Maaaring tumukoy ang Griyego sa kawalan ng pagkakakilala o sa hindi pagkilala kung sino siya; pinananatili ng pangunahing teksto ang mas malawak na pananalita.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: At hindi ko
  rationale: Ang καί sa crasis na κἀγώ ay nagpapatuloy sa naunang patotoo; likas sa Tagalog na isanib ang diin ng ἐγώ sa pangungusap nang hindi pilit na idagdag ang “ako rin.”
- source_word: οὐκ ᾔδειν αὐτόν
  choice: hindi ko siya kilala
  rationale: Pinananatili nito ang malawak na diwa ng nakaraang kalagayan ng hindi pagkakilala o hindi pagkakaalam, nang hindi agad nililimitahan sa hindi pagkilala sa kaniyang identidad.
- source_word: ἀλλ’
  choice: ngunit
  rationale: Malinaw at marangal na panandang pasalungat sa naunang pahayag.
- source_word: ἵνα φανερωθῇ
  choice: upang maihayag siya
  rationale: Ang “upang” ay naghahayag ng layunin, at ang “maihayag” ay nagpapanatili sa pasibong anyo ng φανερόω.
- source_word: τῷ Ἰσραὴλ
  choice: sa Israel
  rationale: Tuwirang pinananatili ang kolektibong katawagang Israel at ang ugnayang ipinahihiwatig ng datibo.
- source_word: διὰ τοῦτο
  choice: naparito ako … upang
  rationale: Sa natural na Tagalog, ang pariralang layunin na “upang” kasunod ng “naparito ako” ay sapat na naghahatid ng pasulong na paliwanag ng διὰ τοῦτο nang hindi mabigat ang pag-uulit na “dahil dito … upang.”
- source_word: ἦλθον ἐγὼ
  choice: naparito ako
  rationale: Ang aorist ay isinalin bilang payak na nagdaang kilos; ang “naparito” ay natural na tumutukoy sa pagdating para sa misyong binabanggit.
- source_word: ἐν ὕδατι
  choice: sa tubig
  rationale: Pinananatili ang literal at malinaw na preposisyong “sa,” sa halip na gawing tahasang instrumental ang parirala.
- source_word: βαπτίζων
  choice: na nagbabautismo
  rationale: Ipinakikita ng pariralang ito ang kilos na kasabay at katangian ng pagparito ni Juan, nang hindi nagpapasya sa eksaktong paraan ng bautismo.
theological_decisions:
- issue: Kahulugan ng pahayag ni Juan na hindi niya kilala si Jesus
  choice: hindi ko siya kilala
  alternative: hindi ko siya nakilala; hindi ko alam na siya ang Mesiyas
  rationale: Hindi nililinaw ng talata kung kawalan ng personal na pagkakakilala o kawalan ng pagkilala sa kaniyang mesiyanikong identidad ang ibig sabihin. Pinananatili ng pangunahing teksto ang mas malawak na pahayag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “ngunit,” “naparito,” at “maihayag” bilang dignified ngunit karaniwang nauunawaang pananalita; iniwasan ang paliwanag na magpapasya sa uri ng hindi pagkakilala ni Juan.
