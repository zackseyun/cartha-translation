base_translation:
  language: en
  yaml_path: translation/nt/john/001/050.yaml
  text: Jesus answered and said to him[a], “Because I told you that I saw you under the fig tree, do you believe? You will see greater things than these.”
translation:
  language: tl
  text: Sumagot si Jesus sa kanya, “Dahil sinabi ko sa iyo na nakita kita sa ilalim ng puno ng igos, sumasampalataya ka ba?[a] Makakakita ka ng mga bagay na higit na dakila kaysa sa mga ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Dahil ba sinabi ko sa iyo na nakita kita sa ilalim ng puno ng igos kaya ka sumasampalataya?”'
    reason: Ipinakikita ang alternatibong pagsasaayos ng unang ὅτι at ng buong retorikal na tanong.
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ
  choice: Sumagot si Jesus sa kanya
  rationale: Likas sa makabagong Tagalog ang “sumagot” para sa pormulang Griyego na literal na “sumagot at sinabi”; iniiwasan nitong maging mabigat at paulit-ulit ang salin nang hindi nawawala ang diwa ng tugon.
- source_word: Ὅτι εἶπόν σοι ὅτι εἶδόν σε
  choice: Dahil sinabi ko sa iyo na nakita kita
  rationale: Ang unang ὅτι ay sanhi (“dahil”), samantalang ang ikalawa ay nagpapakilala sa nilalaman ng sinabi (“na”).
- source_word: ὑποκάτω τῆς συκῆς
  choice: sa ilalim ng puno ng igos
  rationale: Malinaw at karaniwang Tagalog para sa kongkretong larawan; idinagdag ang “puno” upang maging natural ang pagtukoy sa igos.
- source_word: πιστεύεις
  choice: sumasampalataya ka ba
  rationale: Pinananatili ang aspektong panrelihiyon ng Johannine πιστεύω at ang anyong patanong, nang hindi ito pinatitindi bilang pagsaway.
- source_word: μείζω τούτων ὄψῃ
  choice: Makakakita ka ng mga bagay na higit pa sa mga ito
  rationale: Tuwirang ipinapahayag ang panghinaharap at pinananatili ang pangmaramihang paghahambing ng neuter plural na μείζω at τούτων.
theological_decisions:
- issue: Lakas at ayos ng tanong na πιστεύεις;
  choice: “Dahil ... sumasampalataya ka ba?” bilang retorikal na tanong
  alternative: “Dahil ... sumasampalataya ka” bilang pahayag, o “Dahil lamang ...?” bilang mas matinding pagsaway
  rationale: Sinusuportahan ng konteksto at karaniwang pagbasa ang tanong, ngunit hindi malinaw na hinihingi ng Griyego ang “lamang” o isang mariing pagsaway. Pinananatili ng salin ang tensiyon bago ang pangakong makakakita siya ng higit na dakilang mga bagay.
- issue: Posibleng saklaw ng unang ὅτι
  choice: Causal na “Dahil” na sinusundan ng tanong
  alternative: 'Pinalawak na tanong: “Dahil ba sinabi ko ... kaya ka sumasampalataya?”'
  rationale: Ang maikling anyo ay mas malapit sa estruktura ng Griyego, habang itinatala sa talababa ang mas malinaw ngunit mas pinalawak na alternatibo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “sumasampalataya” upang mapanatili ang temang pananampalataya sa Juan; iniwasan ang arkaiko o labis na literal na “sumagot at sinabi.”
