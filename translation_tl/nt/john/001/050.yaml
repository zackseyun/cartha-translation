    issue: Hindi ganap na malinaw ang paghahambing sa “mga bagay na higit pa sa mga ito.”
    rationale: Ang μείζω τούτων ay “mga bagay na mas dakila kaysa sa mga ito,” hindi pangunahing “mas marami kaysa sa mga ito.” Ang pagdaragdag ng “na dakila” at paggamit ng “kaysa” ay naghahatid ng comparative sense nang hindi dinaragdagan ang kahulugan.
