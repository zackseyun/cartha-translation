  to: Sumagot si Jesus sa kanya, “Dahil sinabi ko sa iyo na nakita kita sa ilalim ng puno ng igos, sumasampalataya ka ba?[a] Makakakita ka ng mga bagay na higit na dakila kaysa sa mga ito.”
