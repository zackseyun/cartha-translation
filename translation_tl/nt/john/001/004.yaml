id: JHN.1.4
reference: John 1:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐν αὐτῷ ζωὴ ἦν, καὶ ἡ ζωὴ ἦν τὸ φῶς τῶν ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/004.yaml
  text: In him was life[a], and the life was the light of men.
translation:
  language: tl
  text: Nasa kanya ang buhay, at ang buhay ang siyang liwanag ng sangkatauhan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν αὐτῷ
  choice: Nasa kanya
  rationale: Tumutukoy ang panghalip sa Salita (λόγος) sa naunang konteksto at may personal na diwa; natural sa modernong Tagalog ang “nasa kanya” para sa ἐν αὐτῷ.
- source_word: ζωὴ
  choice: buhay
  rationale: Payak at tuwirang katumbas ito ng ζωή; hindi dinagdagan ng “walang hanggan” upang hayaang ang konteksto ang magbigay ng mas malalim na diwa.
- source_word: ἦν
  choice: ang konstruksiyong “nasa kanya” / “ang siyang”
  rationale: Ang imperpektong anyo ng εἰμί ay ipinahahayag nang natural sa Tagalog sa pamamagitan ng mga sugnay na walang tahasang katumbas ng “was,” habang pinananatili ang ugnayang ipinapahayag ng Griyego.
- source_word: ἡ ζωὴ
  choice: ang buhay
  rationale: Pinananatili ang tiyak at pabalik na pagtukoy sa buhay na kababanggit lamang.
- source_word: τὸ φῶς
  choice: ang siyang liwanag
  rationale: Ang “liwanag” ang tuwirang katumbas ng φῶς; ang “siyang” ay natural na nagbibigay-diin sa predikatibong pagkakakilanlan ng buhay bilang liwanag.
- source_word: τῶν ἀνθρώπων
  choice: ng sangkatauhan
  rationale: Ang ἀνθρώπων ay tumutukoy sa lahat ng tao, hindi lamang sa mga lalaki. Ang “sangkatauhan” ay natural, marangal, at pinananatili ang anyong henitibo na “ng.”
theological_decisions:
- issue: Ang tinutukoy at personal na diwa ng αὐτῷ
  choice: Isinaling “kanya,” na tumutukoy sa Salita bilang personal.
  alternative: “Dito” o “rito,” kung uunawain ang λόγος nang mas abstrakto.
  rationale: Sa agarang konteksto, inilalarawan ang Salita sa personal na paraan. Pinananatili ng “kanya” ang diwang iyon nang hindi nagdaragdag ng doktrinal na paliwanag sa talata.
- issue: Ang pangkalahatang saklaw ng ἀνθρώπων
  choice: Isinaling “sangkatauhan,” na sumasaklaw sa lahat ng tao.
  alternative: “mga tao”
  rationale: Bagaman panlalaking maramihan ang anyong Griyego, pangkalahatan ang kahulugan nito. Malinaw na naihahatid ng “sangkatauhan” ang kolektibo at inklusibong saklaw.
- issue: Ugnayan ng buhay at liwanag
  choice: “ang buhay ang siyang liwanag”
  alternative: “ang buhay ay liwanag”
  rationale: Pinananatili ng “ang siyang” ang tiyak at mariing predikatibong ugnayan ng dalawang pariralang may pantukoy, nang hindi ipinapaliwanag pa kung paano ang buhay ay liwanag.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “sangkatauhan” upang malinaw na katawanin ang generic na ἀνθρώπων. Walang talababa sapagkat walang mahalagang ambiguwidad na nangangailangan nito sa saling Tagalog.
