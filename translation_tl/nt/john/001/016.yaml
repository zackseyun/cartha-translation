  yaml_path: translation/nt/john/001/016.yaml
  text: For from his fullness we have all received[a], and grace upon grace.
translation:
  language: tl
  text: Sapagkat tayong lahat ay tumanggap mula sa kanyang kapuspusan, at biyaya kapalit ng biyaya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “patong-patong na biyaya” o “sunod-sunod na biyaya.” Maaaring ipahiwatig ng pariralang Griyego ang sunod-sunod na biyaya habang ang isang kaloob ay humahalili sa isa pa, bagaman ang ἀντί ay mas tuwirang nangangahulugang “kapalit ng.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Sapagkat
  rationale: Ipinakikilala nito ang paliwanag o batayan ng naunang pahayag, kaya pinananatili ang sanhi at paliwanag na diwa ng Griyego.
- source_word: ἐκ τοῦ πληρώματος αὐτοῦ
  choice: mula sa kanyang kapuspusan
  rationale: Ang “kapuspusan” ay tuwirang katumbas ng πλήρωμα at ipinakikitang ang tinanggap ng lahat ay nagmumula sa lubos na kasaganaang taglay niya.
- source_word: ἡμεῖς πάντες
  choice: tayong lahat
  rationale: Pinananatili nito ang diin ng hayag na panghalip na ἡμεῖς kasama ng πάντες at ang inklusibong tinig ng nagsasalita.
- source_word: ἐλάβομεν
  choice: tumanggap
  rationale: Ang payak na aspektong naganap ay natural sa Filipino at hindi labis na tinutukoy kung minsanan o nagpapatuloy ang pagtanggap.
- source_word: καὶ
  choice: at
  rationale: Tuwirang inuugnay nito ang ikalawang parirala sa nauna nang hindi paunang binibigyang-kahulugan ang relasyon ng dalawa.
- source_word: χάριν ἀντὶ χάριτος
  choice: biyaya kapalit ng biyaya
  rationale: Pinananatili ng “kapalit ng” ang pangunahing diwa ng ἀντί na paghalili o pagkapalit, habang hinahayaang manatili ang ambiguwidad kung ito ay biyayang humahalili sa nauna o biyayang patuloy na dumaragdag.
theological_decisions:
- issue: Kahulugan ng χάριν ἀντὶ χάριτος
  choice: biyaya kapalit ng biyaya
  alternative: patong-patong na biyaya; sunod-sunod na biyaya
  rationale: Pinananatili ng pangunahing teksto ang mas tuwirang puwersa ng ἀντί (“kapalit ng”) sa halip na lutasin ang pinagtatalunang parirala bilang pawang pagdaragdag lamang. Inilalagay sa talababa ang mga natural ngunit mas interpretibong pagbasa.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang “kapuspusan,” isang maikli at kinikilalang salitang teolohikal, at ang malinaw na “biyaya kapalit ng biyaya” upang mapanatili ang tunay na tensiyon ng Griyego.
