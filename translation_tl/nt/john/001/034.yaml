  text: And I have seen and have testified that this is the Chosen One of God[a].
translation:
  language: tl
  text: 'At ako ay nakakita na at nagpatotoo na: ito ang Hinirang ng Diyos.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa ilang manuskrito: “ang Anak ng Diyos” sa halip na “ang Hinirang ng Diyos.”'
    reason: textual_variant
lexical_decisions:
- source_word: κἀγώ
  choice: At ... ako
  rationale: Pinananatili ng “At” ang ugnayan sa naunang pahayag, samantalang ang hayag na “ako” ay nagpapanatili ng diin sa nagsasalita.
- source_word: ἑώρακα
  choice: nakita ko
  rationale: Likas sa modernong Tagalog ang aspektong perpektibo rito; ipinahahayag nito ang natapos na pagkakita na siyang batayan ng kasalukuyang patotoo.
- source_word: μεμαρτύρηκα
  choice: nagpatotoo ako
  rationale: Malinaw at dignified na katumbas ito ng pagbibigay ng patotoo. Ang aspektong perpektibo ay natural na naghahatid ng natapos na kilos na nananatiling may bisa sa konteksto.
- source_word: ὅτι
  choice: na
  rationale: Ipinakikilala nito ang nilalaman ng patotoo, hindi ang dahilan nito.
- source_word: οὗτός
  choice: ito
  rationale: Pinananatili nito ang tuwirang pagtukoy ng demonstratibo kay Jesus nang hindi pinapalitan ng mas interpretibong panghalip.
- source_word: ἐκλεκτός
  choice: Hinirang
  rationale: Ang pang-uri ay ginagamit bilang pangngalan dahil may pantukoy sa Griyego. Ang “Hinirang” ay maikli, natural, at angkop bilang titulong tumutukoy kay Jesus.
- source_word: τοῦ θεοῦ
  choice: ng Diyos
  rationale: Ito ang pinakanatural na salin ng henitibong parirala at pinananatili ang estruktura ng titulong “Hinirang ng Diyos.”
theological_decisions:
- issue: Kristolohikal na titulo sa Juan 1:34
  choice: ang Hinirang ng Diyos
  alternative: ang Anak ng Diyos
  rationale: Ang ibinigay na SBLGNT ay may ὁ ἐκλεκτὸς τοῦ θεοῦ, kaya iyon ang tuwirang isinasalin sa pangunahing teksto. Ang mahalagang variant na “Anak ng Diyos” ay inilalagay sa talababa upang mapanatili ang ebidensiyang tekstuwal at hindi ipalit ang mas pamilyar na pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “nagpatotoo” sa halip na mas lumang “sumaksi,” at pinanatili ang bahagyang pormal na pag-uulit na “At nakita ko, at nagpatotoo ako” upang maipakita ang dalawang magkaugnay na perpektong pandiwa at ang diin ng Griyego.
