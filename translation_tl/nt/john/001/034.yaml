  source_fidelity: 'Ang pangunahing pagbasa ay wastong nagsasalin ng SBLGNT: ὁ ἐκλεκτὸς τοῦ θεοῦ bilang “ang Hinirang ng Diyos,” at hindi nito ipinapalit ang variant na “Anak ng Diyos.” Gayunman, ang simpleng “nakita ko” at “nagpatotoo ako” ay mas madaling mabasa bilang mga payak na pangyayaring nakaraan kaysa bilang mga perpektong pandiwa na may nagpapatuloy na bigat. Ang “nakakita na” at “nagpatotoo na” ay mas malinaw na naghahatid ng aspektong ito sa Tagalog.'
