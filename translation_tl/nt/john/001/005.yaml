  yaml_path: translation/nt/john/001/005.yaml
  text: And the light shines in the darkness[a], and the darkness has not overcome it.
translation:
  language: tl
  text: At ang liwanag ay nagniningning sa kadiliman, at hindi ito nadaig ng kadiliman.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “hindi ito naunawaan ng kadiliman” o “hindi ito nasaklaw ng kadiliman.” Ang pandiwang Griyego ay maaaring mangahulugang daigin o sakupin, ngunit maaari rin itong mangahulugang unawain o saklawin.'
    reason: alternative_reading
lexical_decisions:
- source_word: φῶς
  choice: ang liwanag
  rationale: Pinananatili ang tiyak na pantukoy at ang tematikong pagtukoy sa liwanag sa agarang konteksto ng paunang salita ni Juan.
- source_word: σκοτίᾳ / σκοτία
  choice: sa kadiliman / ng kadiliman
  rationale: Ginamit ang tiyak na anyo sa dalawang paglitaw upang mapanatili ang personipikado at tematikong pagsalungat sa liwanag.
- source_word: φαίνει
  choice: ay nagniningning
  rationale: Likas na ipinahahayag sa Filipino ang kasalukuyan at nagpapatuloy na kilos ng Greek present indicative.
- source_word: κατέλαβεν
  choice: hindi ... nadaig
  rationale: Sa larawan ng tunggalian ng liwanag at kadiliman, ang kahulugang 'nadaig' ang pinakamalinaw sa pangunahing teksto; pinananatili sa talababa ang tunay na posibilidad na 'naunawaan' o 'nahawakan.'
- source_word: αὐτό
  choice: ito
  rationale: Ang panghalip ay neutral na isahan at tumutugma sa φῶς; ang 'ito' ang tuwirang pagtukoy sa 'liwanag' sa Filipino.
theological_decisions:
- issue: Kahulugan ng κατέλαβεν sa pagsalungat ng liwanag at kadiliman
  choice: hindi ito nadaig
  alternative: hindi ito naunawaan o nahawakan
  rationale: Maaaring mangahulugan ang pandiwa ng pagdaig/pagsakop o ng paghawak/pag-unawa. Pinapaboran ng larawan ng liwanag laban sa kadiliman ang 'nadaig,' ngunit inilalahad sa talababa ang kognitibong kahulugan upang hindi alisin ang sadyang kalabuan at posibleng dobleng diwa.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at natural sa karaniwang mambabasa. Ginamit ang 'nagniningning' para sa tuloy-tuloy na kilos at 'nadaig' bilang payak ngunit matibay na salita para sa pangunahing diwa.
