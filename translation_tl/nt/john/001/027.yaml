  yaml_path: translation/nt/john/001/027.yaml
  text: the one coming after me[a], whose sandal strap I am not worthy to untie.
translation:
  language: tl
  text: ang dumarating na kasunod ko,[a] na hindi ako karapat-dapat magkalag ng tali ng kanyang sandalyas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas literal: “ang dumarating sa likuran ko.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ὀπίσω μου ἐρχόμενος
  choice: ang dumarating kasunod ko
  rationale: Ginagawang substantibo ang kasalukuyang pandiwaring Griyego at pinananatili ang diwa ng pagdating at pagkakasunod, nang hindi nililimitahan ito sa pisikal na lokasyon lamang.
- source_word: οὗ
  choice: kanyang
  rationale: Likas sa modernong Tagalog ang panghalip na paari sa pariralang “tali ng kanyang sandalyas,” bagaman ang literal na kayarian ay “na hindi ako karapat-dapat na...”
- source_word: οὐκ εἰμὶ ἄξιος
  choice: hindi ako karapat-dapat
  rationale: Tumpak na ipinapahayag ang kawalan ng pagiging marapat o karapat-dapat at pinananatili ang pagpapakumbaba ni Juan.
- source_word: ἵνα λύσω
  choice: kahit magkalag
  rationale: Ang “magkalag” ay likas na pandiwa para sa pagluwag o pagtanggal ng pagkakatali; idinagdag ang “kahit” upang natural na maipahayag sa Tagalog ang napakababang gawaing sinasabi niyang hindi pa rin siya karapat-dapat gawin.
- source_word: ἱμάντα
  choice: tali
  rationale: Malinaw at karaniwang salitang Tagalog para sa strap o panaling bahagi ng sandalyas.
- source_word: τοῦ ὑποδήματος
  choice: sandalyas
  rationale: Pinakatumpak sa kontekstong pangkasaysayan at madaling maunawaan ng modernong mambabasa.
theological_decisions:
- issue: Kahulugan ng ὀπίσω μου kaugnay ng dumarating
  choice: kasunod ko
  alternative: nasa likuran ko
  rationale: Pinananatili ng “kasunod ko” ang pangunahing diwa ng pagkakasunod sa panahon o ministeryo, habang hindi tahasang ipinapasok sa mismong sugnay ang pahayag ng higit na kataasan na binubuo ng kalapit na konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “sandalyas” at “tali” bilang karaniwang salitang nauunawaan ng ordinaryong mambabasa; iniwasan ang lipas o labis na teknikal na pananalita.
