  source_fidelity: 'Tumpak ang pangunahing salin sa daloy at kahulugan ng Griyego: ang hindi pinangalanang tagapagdala at si Simon ay nananatiling mga panghalip, ang ἐμβλέψας ay naihahayag bilang nakatuong pagtingin, sinusunod ang SBLGNT na «Juan,» at napapanatili ang hinaharap na passive na «Tatawagin kang Cefas.» Gayunman, ang pangwakas na parenthetical gloss ay dapat na mas tuwirang ipakita na ang Cefas ay isinasalin bilang pangalang Pedro.'
  naturalness: Makabago at malinaw ang Filipino. Ang «Tinitigan siya ni Jesus» ay natural at angkop para sa masusing pagtingin. Mas natural at mas eksakto kaysa «na ang salin ay Pedro» ang «na isinasalin bilang Pedro,» dahil malinaw nitong itinatali ang salin sa pangalang Cefas.
  terminology: Wasto ang «Jesus,» «Simon,» «Juan,» «Cefas,» at «Pedro.» Ang «Cefas» ay ang karaniwang Filipino transliterasyon ng Κηφᾶς. Ang talababa ay angkop na nagpapaliwanag ng kaugnayang leksikal na «bato» nang hindi ito ipinapalit sa mga pangalan sa pangunahing teksto.
