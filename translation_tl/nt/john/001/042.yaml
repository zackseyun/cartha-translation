id: JHN.1.42
reference: John 1:42
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀ἤγαγεν αὐτὸν πρὸς τὸν Ἰησοῦν. ἐμβλέψας αὐτῷ ὁ Ἰησοῦς εἶπεν· Σὺ εἶ Σίμων ὁ υἱὸς ⸀Ἰωάννου, σὺ κληθήσῃ Κηφᾶς (ὃ ἑρμηνεύεται Πέτρος).
base_translation:
  language: en
  yaml_path: translation/nt/john/001/042.yaml
  text: He brought him to Jesus[a]. Looking at him, Jesus said, “You are Simon, the son of John[b]; you will be called Cephas” (which is translated Peter).
translation:
  language: tl
  text: Dinala niya siya kay Jesus. Tinitigan siya ni Jesus at sinabi, “Ikaw ay si Simon na anak ni Juan[a]. Tatawagin kang Cefas[b]” (na isinasalin bilang Pedro).
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang manuskrito, “Jonas” ang mababasa sa halip na “Juan”; “Juan” ang nasa tekstong SBLGNT.
    reason: textual_variant
  - marker: b
    text: Ang Cefas ay Semitikong pangalang katumbas ng Pedro; kapwa may diwang “bato.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγαγεν αὐτὸν πρὸς τὸν Ἰησοῦν
  choice: Dinala niya siya kay Jesus
  rationale: Ang aorist na ἤγαγεν ay tumutukoy sa natapos na pagdadala sa isang tao, at ang πρός na may accusative ay nagpapahiwatig ng paglapit o pagpunta kay Jesus. Pinananatili rin ang mga panghalip ng Griyego sa halip na tahasang tukuyin ang mga tauhan mula sa konteksto.
- source_word: ἐμβλέψας αὐτῷ
  choice: Tinitigan siya
  rationale: Ang ἐμβλέπω ay maaaring magpahiwatig ng nakatuon o masusing pagtingin, kaya mas angkop ang “tinitigan” kaysa sa payak na “tiningnan,” nang hindi dinaragdagan ang kahulugan.
- source_word: Σὺ εἶ Σίμων ὁ υἱὸς Ἰωάννου
  choice: Ikaw ay si Simon na anak ni Juan
  rationale: Pinananatili ng “Ikaw ay” ang tuwirang diin ng hayag na panghalip na σύ. Sinusunod ang pagbasa ng SBLGNT na Ἰωάννου, kaya “Juan” ang nasa pangunahing teksto.
- source_word: σὺ κληθήσῃ Κηφᾶς
  choice: Tatawagin kang Cefas
  rationale: Ang future passive na κληθήσῃ ay likas na naihahayag sa “tatawagin kang.” Ang Κηφᾶς ay pangalan, kaya tinumbasan ito sa karaniwang anyong Tagalog na “Cefas” at hindi isinaling “Bato.”
- source_word: ὃ ἑρμηνεύεται Πέτρος
  choice: na ang salin ay Pedro
  rationale: Ipinakikita ng ἑρμηνεύεται na ipinaliliwanag o isinasalin ang Semitikong pangalan sa katumbas nitong Griyegong pangalan. Pinanatili ang “Pedro” bilang pangalan, samantalang inilagay sa talababa ang kahulugang “bato.”
theological_decisions:
- issue: Paliwanag sa mga pangalang Κηφᾶς at Πέτρος
  choice: Panatilihin sa pangunahing teksto ang dalawang pangalan bilang “Cefas” at “Pedro.”
  alternative: Isalin ang isa o kapwa pangalan bilang “Bato.”
  rationale: Ang talata ay nagsasalaysay ng pagbibigay ng bagong pangalan. Ang pagpapanatili sa mga pangalan ay sumusunod sa anyo ng Griyegong teksto at hindi ipinapasok sa pangunahing linya ang anumang teolohikal na pagpapakahulugan sa kabuluhan ng pangalang “bato.” Ang leksikal na kahulugan ay inilalahad sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Pinili ang “tinitigan” upang maipahayag ang nakatuong pagtingin nang hindi nagiging labis na pormal. Inilagay ang mga pananda ng talababa sa mismong mga salitang “Juan” at “Cefas,” na siyang tinutukoy ng bawat tala.
