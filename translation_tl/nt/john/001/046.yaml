base_translation:
  language: en
  yaml_path: translation/nt/john/001/046.yaml
  text: And Nathanael said to him[a], “Can anything good come from Nazareth?” Philip said to him, “Come and see.”
translation:
  language: tl
  text: Sinabi ni Natanael sa kanya, “May mabuti bang maaaring manggaling sa Nazaret?” Sinabi ni Felipe sa kanya, “Halika at tingnan mo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ εἶπεν αὐτῷ Ναθαναήλ
  choice: Sinabi sa kanya ni Natanael
  rationale: Natural na salaysay sa Filipino; ang καί ay hindi kailangang isalin nang hiwalay dahil sapat na ang pagkakasunod ng mga pangyayari, habang malinaw na pinananatili ang tagapagsalita at di-tuwirang layon.
- source_word: Ἐκ Ναζαρὲτ
  choice: magmula sa Nazaret
  rationale: Ipinahahayag ng ἐκ ang pinagmulan. Natural sa Filipino ang “magmula sa Nazaret” at hindi nito dinaragdagan ang diwa ng Griyego.
- source_word: δύναταί τι ἀγαθὸν εἶναι
  choice: May mabuti bang maaaring magmula
  rationale: Pinananatili ng “maaaring” ang diwa ng posibilidad sa δύναται at ng “may mabuti” ang τι ἀγαθόν. Isinama sa likas na pariralang Filipino ang εἶναι at ἐκ bilang “magmula,” nang hindi ginagawang mas mapanlibak ang tanong.
- source_word: λέγει αὐτῷ ὁ Φίλιππος
  choice: Sinabi sa kanya ni Felipe
  rationale: Ang historikal na pangkasalukuyan na λέγει ay likas na isinasalaysay sa aspektong naganap sa Filipino. Hindi isinasalin ang artikulo bago ang pangalang Felipe.
- source_word: Ἔρχου καὶ ἴδε
  choice: Halika at tingnan mo
  rationale: Tuwirang paanyaya ang Ἔρχου, at natural na katumbas ng ἴδε ang “tingnan mo.” Pinananatili nito ang paanyayang personal na siyasatin ang bagay.
theological_decisions:
- issue: Tono ng tanong ni Natanael tungkol sa Nazaret
  choice: Isinalin bilang tuwirang retorikal na tanong na nagpapahayag ng pag-aalinlangan.
  alternative: “May anumang mabuti bang mula sa Nazaret?”
  rationale: Nagpapahiwatig ng pag-aalinlangan ang Griyego ngunit hindi tahasang nagtatakda ng panunuya o paghamak; kaya walang idinagdag na salitang magpapalakas sa ganoong tono.
- issue: Diwa ng εἶναι kasama ng ἐκ Ναζαρὲτ
  choice: “maaaring magmula sa Nazaret”
  alternative: “maaaring manggaling sa Nazaret” o mas literal na “maaaring maging mula sa Nazaret”
  rationale: Ang “magmula” ay natural na Filipino para sa pinagmulan at pinananatili ang posibilidad na ipinahahayag ng δύναται, samantalang ang labis na literal na anyo ay hindi likas.
translation_notes:
  register: Modernong Filipino na dignified ngunit madaling maunawaan. Ginamit ang karaniwang baybay na Natanael, Nazaret, at Felipe. Walang footnote dahil sapat na naipapahayag sa pangunahing teksto ang posibilidad at pinagmulan nang hindi nawawala ang mahalagang ambiguwidad.
