revisions:
- from: At ang Salita ay naging tao at nanirahan sa piling natin[a]. Nakita namin ang kanyang kaluwalhatian—kaluwalhatiang taglay ng kaisa-isang Anak na mula sa Ama[b]—puspos ng biyaya at katotohanan.
  to: At ang Salita ay naging tao at nanirahan sa piling natin[a], at nakita namin ang kanyang kaluwalhatian, kaluwalhatiang gaya ng sa natatanging nagmula sa Ama[b], na puspos ng biyaya at katotohanan.
  rationale: Inalis ang “Anak” sa pangunahing teksto upang hindi dagdagan ang SBLGNT, ngunit pinanatili ito bilang malinaw na kontekstuwal at tradisyonal na alternatibo sa talababa. Pinasimple rin ang talababa tungkol sa ἐσκήνωσεν upang manatili itong leksikal na tala sa halip na malawak na paliwanag. Hindi binabago ng mga rebisyong ito ang ipinahahayag ng talata tungkol sa Salita, sa kanyang kaluwalhatian, at sa kanyang kapuspusan ng biyaya at katotohanan.
  reviewer_model: gpt-5.6-terra
