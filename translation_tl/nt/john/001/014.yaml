source:
  edition: SBLGNT
  text: Καὶ ὁ λόγος σὰρξ ἐγένετο καὶ ἐσκήνωσεν ἐν ἡμῖν, καὶ ἐθεασάμεθα τὴν δόξαν αὐτοῦ, δόξαν ὡς μονογενοῦς παρὰ πατρός, πλήρης χάριτος καὶ ἀληθείας·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/014.yaml
  text: And the Word became flesh and dwelt among us[a], and we saw his glory, glory as of the one and only Son from the Father[b], full of grace and truth.
translation:
  language: tl
  text: At ang Salita ay naging tao at nanirahan sa piling natin[a], at nakita namin ang kanyang kaluwalhatian, kaluwalhatiang gaya ng sa natatanging nagmula sa Ama[b], na puspos ng biyaya at katotohanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagtayo ng tolda sa piling natin.” Ang pandiwa ay umaalingawngaw sa larawang tolda o tabernakulo.
    reason: lexical_alternative
  - marker: b
    text: O “kaluwalhatiang gaya ng sa kaisa-isang Anak na mula sa Ama”; ayon sa tradisyon, “bugtong na Anak.” Hindi tahasang nakasulat ang “Anak” sa pariralang Griyego.
    reason: alternative_reading
lexical_decisions:
- source_word: λόγος
  choice: ang Salita
  rationale: Pinananatili ang kinikilalang personal at masaganang titulong ginamit ni Juan; hindi sapat na naihahayag ng “Mensahe” o “Katwiran” ang buong diwa nito.
- source_word: σὰρξ ἐγένετο
  choice: naging tao
  rationale: Natural ito sa makabagong Filipino at malinaw na tumutukoy sa tunay at may-katawang pag-iral bilang tao. Ang literal na “naging laman” ay maaaring maging malabo o di-likas sa karaniwang mambabasa.
- source_word: ἐσκήνωσεν ἐν ἡμῖν
  choice: nanirahan sa piling natin
  rationale: Malinaw at likas na Filipino para sa paninirahan sa gitna ng isang pamayanan; inilalahad sa talababa ang pahiwatig ng tolda o tabernakulo.
- source_word: ἐθεασάμεθα
  choice: Nakita namin
  rationale: Tuwiran at natural na nagpapahayag ng aktuwal na pagsaksi, nang walang makalumang himig.
- source_word: δόξαν
  choice: kaluwalhatian
  rationale: Karaniwan at may bigat na salin sa kontekstong biblikal at Juaniko.
- source_word: μονογενοῦς
  choice: kaisa-isang Anak
  rationale: Ipinahahayag ang pangunahing diwa ng pagiging natatangi at nag-iisa sa uri o ugnayan. Ipinahiwatig ng konteksto ang “Anak,” bagaman hindi ito tahasang pangngalan sa pariralang Griyego.
- source_word: παρὰ πατρός
  choice: mula sa Ama
  rationale: Natural na ipinahahayag ang pinagmulan at natatanging ugnayan sa Ama sa kontekstong ito.
- source_word: πλήρης χάριτος καὶ ἀληθείας
  choice: puspos ng biyaya at katotohanan
  rationale: Pinananatili ang pamilyar at tumpak na wikang biblikal, pati ang kaugnayan nito sa paglalarawan sa Salita.
theological_decisions:
- issue: Ang kahulugan ng μονογενοῦς at ang ipinahiwatig na “Anak”
  choice: kaisa-isang Anak
  alternative: bugtong na Anak; natatanging Anak; mas literal na “kaisa-isa mula sa Ama”
  rationale: Mas tuwirang kinakatawan ng “kaisa-isa” ang leksikal na diin sa pagiging natatangi, samantalang kinikilala sa talababa ang tradisyonal na “bugtong” at ang katotohanang ipinahiwatig lamang ng konteksto ang pangngalang “Anak.” Hindi nito ipinapasya nang higit sa teksto ang usapin tungkol sa paraan ng pagiging Anak.
- issue: Ang larawang tabernakulo sa ἐσκήνωσεν
  choice: nanirahan sa piling natin
  alternative: nagtayo ng tolda sa piling natin; tumahan na parang nasa tabernakulo sa piling natin
  rationale: Pinananatiling malinaw at marangal ang pangunahing teksto, habang hindi ikinukubli sa talababa ang mahalagang alusyon sa tolda o tabernakulo ng presensiya ng Diyos.
- issue: Ang pagsasalin ng σὰρξ sa pahayag tungkol sa pagkakatawang-tao
  choice: naging tao
  alternative: naging laman
  rationale: Ipinahahayag ng likas na Filipino ang tunay na pagpasok ng Salita sa may-katawang kalagayan ng tao, hindi ang pagiging abstraktong “kalikasan ng tao.” Hindi nito ipinahihiwatig na tumigil siyang maging kung sino siya bago nito.
translation_notes:
  register: Makabago, natural, at marangal na Filipino para sa karaniwang mambabasa. Ginamit ang “sa piling natin” upang maging idiomatiko ang ἐν ἡμῖν, at ang mga gitling upang malinaw na maiugnay ang paglalarawan ng kaluwalhatian nang hindi pinapawi ang siksik at bahagyang ambiguwong balangkas ng Griyego.
