id: JHN.1.18
reference: John 1:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: θεὸν οὐδεὶς ἑώρακεν πώποτε· ⸂μονογενὴς θεὸς⸃ ὁ ὢν εἰς τὸν κόλπον τοῦ πατρὸς ἐκεῖνος ἐξηγήσατο.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/018.yaml
  text: No one has ever seen God[a]; the one and only God, who is in the bosom of the Father[c][b], has made him known.
translation:
  language: tl
  text: Walang sinumang nakakita kailanman sa Diyos; ang kaisa-isang Diyos[a], na nasa kandungan ng Ama[b], ang siyang ipinakilala ang Diyos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: May ilang manuskrito na kababasahan ng “ang kaisa-isang Anak” (o “ang bugtong na Anak”) sa halip na “ang kaisa-isang Diyos.”
    reason: textual_variant
  - marker: b
    text: Maaari ring “kapiling ng Ama.” Sa literal, “nasa kandungan ng Ama,” isang larawang nagpapahayag ng matalik na pagkalapit.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “ipinaliwanag niya kung sino ang Diyos” o “ipinahayag niya ang Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὸν
  choice: Diyos
  rationale: Tuwirang layon ng ἑώρακεν at karaniwang salin ng θεός kapag tumutukoy sa Diyos.
- source_word: οὐδεὶς
  choice: walang sinuman
  rationale: Likas na makabagong Tagalog na nagpapanatili sa ganap na pagtanggi.
- source_word: ἑώρακεν πώποτε
  choice: nakakita kailanman
  rationale: 'Pinagsasama nito ang diwa ng perpektong pandiwa at ng πώποτε: walang sinumang nakakita sa anumang panahon hanggang ngayon.'
- source_word: μονογενὴς θεὸς
  choice: ang kaisa-isang Diyos
  rationale: Sinusunod ang nakalimbag na SBLGNT na θεός. Ipinahahayag ng μονογενής ang pagiging natatangi o nag-iisa sa uri, hindi kinakailangang ang paraan ng pagkapanganak.
- source_word: ὁ ὢν
  choice: na nasa
  rationale: Likas na sugnay na panuring sa Tagalog para sa substantival participle at ang kasunod nitong pariralang nagsasaad ng kinaroroonan.
- source_word: εἰς τὸν κόλπον τοῦ πατρὸς
  choice: nasa kandungan ng Ama
  rationale: Pinananatili ng “kandungan” ang larawang nagpapahiwatig ng napakalapit at matalik na kaugnayan; mas natural ito sa Tagalog kaysa sa literal na “dibdib.”
- source_word: ἐκεῖνος
  choice: ang siyang
  rationale: Ipinakikita ang diin ng demonstratibo at malinaw na ibinabalik ang paksa sa kaisa-isang Diyos.
- source_word: ἐξηγήσατο
  choice: nagpakilala sa kanya
  rationale: Malinaw at likas na ipinahahayag ang pagbubunyag o pagpapakilala sa Diyos, habang hindi nililimitahan ang pandiwa sa pasalitang pagpapaliwanag lamang.
theological_decisions:
- issue: Pagbasa sa μονογενὴς θεὸς kumpara sa ὁ μονογενὴς υἱός
  choice: 'Sinunod sa pangunahing teksto ang SBLGNT: “ang kaisa-isang Diyos.”'
  alternative: “ang kaisa-isang Anak” o “ang bugtong na Anak”
  rationale: Ang ibinigay na tekstong Griyego ay may θεός. Dahil mahalagang usaping tekstuwal at kristolohikal ito, hindi pinapalitan ang pangunahing pagbasa, ngunit malinaw na itinatala ang alternatibo.
- issue: Kahulugan ng μονογενής
  choice: kaisa-isa
  alternative: bugtong; tanging isinilang
  rationale: Mas tuwirang ipinahahayag ng “kaisa-isa” ang pagiging natatangi. Iniiwasan nitong ipalagay na ang mismong salita ay tahasang naglalarawan ng pag-aanak o pagsilang, habang kinikilala sa talababa ang makasaysayang alternatibo.
- issue: Larawan ng εἰς τὸν κόλπον τοῦ πατρὸς
  choice: nasa kandungan ng Ama
  alternative: kapiling ng Ama; malapit sa dibdib ng Ama
  rationale: Pinananatili ang larawang may matalik na pagkalapit nang hindi ito ginagawang abstraktong pahayag lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang semicolon upang ipakita ang mahigpit na ugnayan ng dalawang pahayag. Ginamit ang “ang siyang” upang madala ang diin ng ἐκεῖνος nang hindi nagiging paulit-ulit o di-likas.
