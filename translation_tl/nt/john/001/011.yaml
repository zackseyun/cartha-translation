  yaml_path: translation/nt/john/001/011.yaml
  text: He came to his own[b][a], and his own people did not receive him.
translation:
  language: tl
  text: Dumating siya sa sarili niyang dako[a], ngunit hindi siya tinanggap[b] ng sarili niyang mga tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kung ano ang sa kanya.” Ang unang parirala sa Griyego ay neuter plural at naiiba sa kasunod na masculine plural na tumutukoy sa sarili niyang mga tao.
    reason: alternative_reading
  - marker: b
    text: O “hindi siya tinanggap” o “hindi siya malugod na sinalubong.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τὰ ἴδια
  choice: sa sarili niyang nasasakupan
  rationale: Ang neuter plural na τὰ ἴδια ay tumutukoy sa kung ano ang sa kanya—maaaring sakop, tahanan, o mga pag-aari—hindi tuwiran sa mga tao. Pinananatili ng “nasasakupan” ang malawak na diwa nang hindi ito nililimitahan sa tahanan lamang.
- source_word: ἦλθεν
  choice: Dumating
  rationale: Likas at tuwirang salin ng aorist ng ἔρχομαι sa kontekstong nagsasaad ng pagdating.
- source_word: οἱ ἴδιοι
  choice: sarili niyang mga kababayan
  rationale: Ang masculine plural ay malinaw na tumutukoy sa mga tao. Sa konteksto, ipinahihiwatig ng “mga kababayan” ang mga taong itinuturing na kanya habang pinananatili ang kaibahan sa naunang neuter plural.
- source_word: παρέλαβον
  choice: hindi siya tinanggap
  rationale: Saklaw ng “tinanggap” ang pagtanggap, pagkilala, at malugod na pagsalubong sa isang tao nang hindi pinipili nang labis ang isa lamang sa mga nuances na ito.
- source_word: αὐτόν
  choice: siya
  rationale: Ang panghalip ay tumutukoy sa Salita/liwanag sa konteksto at natural na isinasalin bilang “siya.”
theological_decisions:
- issue: Tinutukoy at diwa ng magkasunod na paggamit ng ἴδιος
  choice: Ang unang parirala ay tumutukoy sa sariling nasasakupan o kung ano ang sa kanya, samantalang ang ikalawa ay tumutukoy sa sarili niyang mga kababayan.
  alternative: Maaaring unawain na kapwa tumutukoy sa sarili niyang mga tao, o na ang una ay partikular na tumutukoy sa kanyang tahanan o sambahayan.
  rationale: Ang pagbabago mula sa neuter plural na τὰ ἴδια tungo sa masculine plural na οἱ ἴδιοι ay nagpapahiwatig ng sinadyang kaibahan sa pagitan ng nasasakupan o pag-aari at ng mga tao. Hindi nililimitahan ng salin ang una sa isang tiyak na lugar lamang.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “nasasakupan” upang ipahayag ang malawak na saklaw ng neuter plural, at “mga kababayan” upang malinaw na tukuyin ang mga tao sa ikalawang parirala. Inayos ang mga marker ayon sa pagkakasunod ng paglitaw sa pangunahing teksto.
