id: JHN.1.49
reference: John 1:49
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸂αὐτῷ Ναθαναήλ⸃· Ῥαββί, σὺ εἶ ὁ υἱὸς τοῦ θεοῦ, σὺ ⸂βασιλεὺς εἶ⸃ τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/049.yaml
  text: Nathanael answered him, “Rabbi, you are the Son of God; you are the King of Israel.”
translation:
  language: tl
  text: Sumagot sa kanya si Natanael, “Rabi, ikaw ang Anak ng Diyos; ikaw ang Hari ng Israel.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: Sumagot
  rationale: Karaniwang salaysay na katumbas ng ἀποκρίνομαι sa isang pag-uusap; likas at tuwiran sa modernong Tagalog.
- source_word: Ῥαββί
  choice: Rabi
  rationale: Pinananatili ang tiyak na katawagang Judio at ang anyo nitong pantawag, sa halip na gawing pangkalahatang “Guro.”
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: ang Anak ng Diyos
  rationale: Inilalahad bilang tiyak na titulo, gaya ng ipinahihiwatig ng Griyego, nang hindi ito pinalalawak o pinahihina.
- source_word: βασιλεὺς
  choice: Hari
  rationale: Tuwirang katumbas na nagpapanatili sa maharlika at mesianikong bisa ng pahayag.
- source_word: τοῦ Ἰσραήλ
  choice: ng Israel
  rationale: Pinananatili ang payak na anyong henitibo at ang pormal na titulong “Hari ng Israel,” sa halip na dagdagan ng interpretasyong “na naghahari sa Israel.”
- source_word: σὺ εἶ … σὺ … εἶ
  choice: ikaw ang … ikaw ang …
  rationale: Pinananatili ang pag-uulit ng tahasang panghalip upang maipakita ang diin at magkatimbang na ayos ng dalawang pagpapahayag.
- source_word: Ναθαναήλ
  choice: Natanael
  rationale: Karaniwang transliterasyon ng pangalang Griyego sa modernong Tagalog.
theological_decisions:
- issue: Kristolohikal na bigat ng pahayag na “ang Anak ng Diyos”
  choice: Panatilihin ang tiyak na titulong “ang Anak ng Diyos.”
  alternative: “isang anak ng Diyos” o ibang anyong nagpapahina sa pagiging tiyak ng titulo
  rationale: May malinaw na tiyak na anyo ang parirala sa Griyego. Pinananatili ng salin ang kristolohikal na bigat nito nang hindi nagdaragdag ng kalaunang pormulang pangkredo.
- issue: Maharlika at mesianikong diwa ng “Hari ng Israel”
  choice: Isalin bilang “Hari ng Israel.”
  alternative: “hari sa Israel” o “pinuno ng Israel”
  rationale: Pinananatili nito ang tahasang titulong maharlika at ang kaugnayan nito sa inaasahang Mesiyas ng Israel, nang hindi ito ginagawang maluwag na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Pinanatili ang magkatimbang at mariing pag-uulit na “ikaw ang … ikaw ang …,” gayundin ang katawagang Judio na “Rabi.”
