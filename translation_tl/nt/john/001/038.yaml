id: JHN.1.38
reference: John 1:38
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: στραφεὶς δὲ ὁ Ἰησοῦς καὶ θεασάμενος αὐτοὺς ἀκολουθοῦντας λέγει αὐτοῖς· Τί ζητεῖτε; οἱ δὲ εἶπαν αὐτῷ· Ῥαββί (ὃ λέγεται ⸀μεθερμηνευόμενον Διδάσκαλε), ποῦ μένεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/038.yaml
  text: Then Jesus turned and[a], seeing them following, said to them, “What are you seeking?” They said to him, “Rabbi” (which translated means Teacher)[c][b], “where are you staying?”
translation:
  language: tl
  text: Lumingon si Jesus at, nang makita niyang sumusunod sila, sinabi niya sa kanila, “Ano ang hinahanap ninyo?” Sinabi nila sa kanya, “Rabbi”[a] (na ang ibig sabihin ay Guro), “saan po kayo tumutuloy?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Rabbi” ay titulong Hebreo/Aramaiko na nangangahulugang “Guro.”
    reason: cultural_note
  - marker: b
    text: Ang salitang isinaling “tumutuloy” ay maaari ring isaling “nananatili.” Ito rin ang pandiwang madalas gamitin sa Ebanghelyo ni Juan para sa pananatili.
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: Lumingon
  rationale: Likas at maikli itong salin ng kilos ni Jesus; hindi nito labis na tinutukoy ang eksaktong direksiyon ng pagharap.
- source_word: θεασάμενος
  choice: nang makita
  rationale: Ipinapahayag nito ang aktuwal at may-pansing pagkakita sa dalawang sumusunod, habang nananatiling natural ang daloy sa Filipino.
- source_word: ἀκολουθοῦντας
  choice: sumusunod
  rationale: Pinananatili nito kapwa ang literal na pagsunod sa paglalakad at ang maaaring umuusbong na diwa ng pagiging alagad.
- source_word: Τί ζητεῖτε;
  choice: Ano ang hinahanap ninyo?
  rationale: Ang “hinahanap” ay karaniwang modernong Filipino para sa ζητέω at maaari pa ring magtaglay ng mas malalim na diwa ng paghahanap, nang hindi pinipilit ang espirituwal na pakahulugan.
- source_word: Ῥαββί
  choice: Rabbi
  rationale: Pinananatili ang Semitikong titulo dahil ang mismong teksto ay agad nagbibigay ng kahulugan nito.
- source_word: μεθερμηνευόμενον Διδάσκαλε
  choice: na ang ibig sabihin ay Guro
  rationale: Natural at malinaw nitong ginagampanan ang paliwanag ng may-akda para sa mga mambabasang hindi pamilyar sa titulo.
- source_word: ποῦ μένεις;
  choice: saan po kayo tumutuloy?
  rationale: Sa agarang konteksto, ang tanong ay tungkol sa lugar na tinutuluyan ni Jesus. Ang “tumutuloy” ay natural sa Filipino at hindi labis na ipinapasok ang mas malawak na teolohikal na gamit ng μένω sa Juan.
theological_decisions:
- issue: Ang ζητέω ay maaaring karaniwang paghahanap o may mas malalim na diwa sa salaysay ni Juan.
  choice: Ano ang hinahanap ninyo?
  alternative: Ano ang nais ninyo?
  rationale: Pinananatili ng “hinahanap” ang konkretong tanong at ang posibleng mas malalim na pahiwatig, samantalang ang “nais” ay maaaring magpaliit dito sa hangarin lamang.
- issue: Ang μένω ay nagiging mahalagang salitang teolohikal sa Juan, ngunit dito ay may agarang lokatibong diwa.
  choice: saan po kayo tumutuloy?
  alternative: saan po kayo nananatili?
  rationale: Mas natural at angkop sa sitwasyon ang “tumutuloy.” Ang alternatibong “nananatili” ay mas malapit sa anyo ng salita ngunit maaaring maging di-likas at labis na magpahiwatig ng mga susunod na teolohikal na gamit.
- issue: Antas ng paggalang sa pagtawag kay Jesus bilang Rabbi.
  choice: Gamitin ang “po” at “kayo” sa tanong.
  alternative: saan ka tumutuloy?
  rationale: Ang titulong “Rabbi” at ang konteksto ng pakikipag-usap sa isang guro ay likas na ipinapahayag sa modernong Filipino sa pamamagitan ng magalang na pananalita, nang hindi nagdaragdag ng doktrinal na pakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “po/kayo” bilang karaniwang paggalang sa isang guro. Inilagay ang mga talababa sa mga kaugnay na bahagi ng pangunahing teksto, at pinanatili ang posibleng lalim ng ζητέω at μένω nang hindi pinipilit ang kahulugan.
