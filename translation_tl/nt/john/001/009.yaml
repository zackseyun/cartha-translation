  text: ἦν τὸ φῶς τὸ ἀληθινὸν ὃ φωτίζει πάντα ἄνθρωπον ἐρχόμενον εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/009.yaml
  text: The true light[a], which enlightens every person, was coming into the world.
translation:
  language: tl
  text: Ang tunay na liwanag[a], na nagbibigay-liwanag sa bawat tao, ay noon ay paparating na sa sanlibutan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “Ang tunay na liwanag, na nagbibigay-liwanag sa bawat taong dumarating sa sanlibutan.” Sa Griyego, ang “dumarating” ay maaaring iugnay sa “bawat tao” sa halip na sa “tunay na liwanag.”'
    reason: alternative_reading
lexical_decisions:
- source_word: φῶς
  choice: liwanag
  rationale: Karaniwang pangngalan ang ginamit sa Griyego. Pinananatili ng “liwanag” ang literal at metaporikal na diwa nang hindi kailangang gawing pantanging pangalan.
- source_word: ἀληθινόν
  choice: tunay
  rationale: Likas na salin ito sa makabagong Tagalog at naipahahayag ang diwa ng pagiging tunay at ganap, hindi lamang pagiging tama.
- source_word: φωτίζει
  choice: nagbibigay-liwanag
  rationale: Naipapahayag nito kapwa ang larawan ng pisikal na liwanag at ang metaporikal na pagpapalinaw o paghahayag.
- source_word: πάντα ἄνθρωπον
  choice: bawat tao
  rationale: Tumpak at likas na katumbas ng panlahatang isahan sa Griyego; saklaw nito ang bawat tao nang walang di-kinakailangang pagtukoy sa kasarian.
- source_word: ἐρχόμενον εἰς τὸν κόσμον
  choice: dumarating noon sa sanlibutan
  rationale: Sa pangunahing teksto, iniuugnay ang participle sa “tunay na liwanag,” gaya ng ipinahihiwatig ng konteksto ng prologo. Ang “noon” ay tumutulong ipakita ang aspektong nakaraan ng ἦν nang hindi ginagawang simpleng natapos na kilos ang pagdating.
- source_word: κόσμον
  choice: sanlibutan
  rationale: Karaniwan at marangal na salin ng κόσμος sa kontekstong Juaniko, na tumutukoy sa daigdig at sangkatauhang naririto.
- source_word: ἦν
  choice: ay ... noon
  rationale: Ipinakikita ang imperpektong nakaraan kasama ng participle sa likas na ayos ng Tagalog.
theological_decisions:
- issue: Pagkakaugnay ng ἐρχόμενον (“dumarating”)
  choice: 'Iniuugnay sa “tunay na liwanag”: “ay dumarating noon sa sanlibutan.”'
  alternative: 'Iniuugnay sa “bawat tao”: “nagbibigay-liwanag sa bawat taong dumarating sa sanlibutan.”'
  rationale: Sa anyong pambalarila, maaaring tumukoy ang participle sa ἄνθρωπον, ngunit umaayon din ang pagbasa tungkol sa pagdating ng Liwanag sa sentro ng prologo at sa wikang Juaniko. Pinananatili sa talababa ang tunay na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sanlibutan” bilang pamilyar na terminong biblikal, samantalang pinanatiling payak ang iba pang pananalita. Hindi ginamit ang malaking titik sa “liwanag” sapagkat karaniwang pangngalan ang nasa Griyego, bagaman malinaw ang Kristolohikal na gamit nito sa konteksto.
