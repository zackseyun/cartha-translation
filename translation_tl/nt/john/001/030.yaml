base_translation:
  language: en
  yaml_path: translation/nt/john/001/030.yaml
  text: This is he of whom I said[a], ‘After me comes a man who ranks before me[b], because he was before me.’
translation:
  language: tl
  text: Siya ang tinutukoy ko nang sabihin ko, “Kasunod ko ay darating ang isang lalaki na nauna sa akin[a], sapagkat nauna na siya sa akin.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na may higit na katayuan kaysa sa akin.” Maaaring tumukoy ang Griyego sa pangunguna o higit na katayuan, hindi lamang sa pagkakauna sa panahon.
    reason: lexical_alternative
  - marker: b
    text: O “sapagkat bago pa ako ay umiiral na siya.” Malamang na ipinahihiwatig ng pananalita na umiiral na si Jesus bago pa si Juan, bagaman maikli ang pagkakasabi nito sa Griyego.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτός ἐστιν ὑπὲρ οὗ ἐγὼ εἶπον
  choice: Ito ang tinutukoy ko nang sabihin ko
  rationale: Natural na makabagong Tagalog para sa mariing pagkilala at sa pariralang ‘tungkol sa kaniya na sinabi ko,’ nang hindi nagiging mabigat o artipisyal.
- source_word: Ὀπίσω μου ἔρχεται
  choice: Kasunod ko ay darating
  rationale: Ipinapakita ang pagkakasunod sa pagdating o ministeryo, hindi lamang ang pisikal na pagiging nasa likuran.
- source_word: ἀνὴρ
  choice: isang lalaki
  rationale: Pinananatili ang hayagang panlalaking katawagan ng Griyego at ang pagtukoy kay Jesus bilang isang tao.
- source_word: ἔμπροσθέν μου γέγονεν
  choice: na nauna sa akin
  rationale: Maikli at natural, at maaaring magpahiwatig ng pangunguna o higit na katayuan. Iniiwasan nitong piliting temporal lamang ang kahulugan.
- source_word: ὅτι πρῶτός μου ἦν
  choice: sapagkat bago pa ako ay naroon na siya
  rationale: Malinaw na naihahayag sa Tagalog ang temporal na prioridad at malamang na pahiwatig ng dati nang pag-iral, habang hindi nagdaragdag ng teknikal na teolohikal na salita.
theological_decisions:
- issue: Gaano kalinaw na ipahahayag ang dati nang pag-iral ni Jesus sa huling sugnay
  choice: sapagkat bago pa ako ay naroon na siya
  alternative: sapagkat nauna siya sa akin
  rationale: Ang napiling anyo ay nagpapahayag ng temporal na prioridad na likas sa konteksto ng Juan, ngunit hindi gumagamit ng mas tahasang paliwanag na ‘umiiral na siya,’ kaya nananatili ang siksik na pahayag ng Griyego.
- issue: Kahulugan ng ἔμπροσθέν μου γέγονεν
  choice: na nauna sa akin
  alternative: na higit sa akin ang katayuan
  rationale: Pinananatili ng ‘nauna’ ang posibilidad ng prioridad at pangunguna nang hindi nilulutas ang parirala bilang ranggo lamang.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang ‘tinutukoy ko’ upang maging natural ang pambungad, at pinanatili ang pagkakaiba ng pagdating kasunod ni Juan, pangunguna ni Jesus, at ng kaniyang pag-iral bago pa si Juan.
