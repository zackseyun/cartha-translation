id: JHN.1.40
reference: John 1:40
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἦν Ἀνδρέας ὁ ἀδελφὸς Σίμωνος Πέτρου εἷς ἐκ τῶν δύο τῶν ἀκουσάντων παρὰ Ἰωάννου καὶ ἀκολουθησάντων αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/040.yaml
  text: Andrew[a], Simon Peter’s brother, was one of the two who had heard from John and followed him.
translation:
  language: tl
  text: Si Andres, na kapatid ni Simon Pedro, ay isa sa dalawang nakinig kay Juan at sumunod sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kanya” ay tumutukoy kay Jesus ayon sa konteksto.
    reason: Paglilinaw sa tinutukoy ng panghalip.
lexical_decisions:
- source_word: ἦν
  choice: ay isa
  rationale: Ginamit bilang payak na pang-ugnay na nagpapakilala kay Andres bilang isa sa dalawang lalaki; likas sa modernong Tagalog ang konstruksiyong ito.
- source_word: Ἀνδρέας
  choice: Andres
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa mga saling Tagalog.
- source_word: ὁ ἀδελφὸς Σίμωνος Πέτρου
  choice: na kapatid ni Simon Pedro
  rationale: Malinaw at likas na ipinahahayag ang literal na ugnayang magkapatid habang pinananatili ang buong katawagang Simon Pedro.
- source_word: εἷς ἐκ τῶν δύο
  choice: isa sa dalawang
  rationale: Ito ang natural at eksaktong katumbas ng partitive expression sa Griyego.
- source_word: τῶν ἀκουσάντων
  choice: nakinig
  rationale: Sa konteksto, tumutukoy ito sa pakikinig ng dalawang alagad sa sinabi ni Juan; mas natural dito ang 'nakinig' kaysa sa payak na 'nakarinig.'
- source_word: παρὰ Ἰωάννου
  choice: kay Juan
  rationale: Sa pandiwang 'nakinig,' likas na ipinahahayag ng 'kay Juan' na si Juan ang pinagmulan ng kanilang narinig nang hindi idinaragdag ang bansag na Bautista.
- source_word: καὶ ἀκολουθησάντων αὐτῷ
  choice: at sumunod sa kanya
  rationale: Tuwirang pinananatili ang kilos na 'sumunod' at ang panghalip; ipinakikita ng naunang konteksto na si Jesus ang tinutukoy.
theological_decisions:
- issue: Tinutukoy ng αὐτῷ
  choice: Pinanatili sa pangunahing teksto bilang 'sa kanya'; si Jesus ang tinutukoy ayon sa konteksto.
  alternative: Maaaring mapagkamalang si Juan ang tinutukoy kung hiwalay sa konteksto.
  rationale: Sa Juan 1:35–39, narinig ng dalawa ang patotoo ni Juan at pagkatapos ay sinundan nila si Jesus. Hindi kailangang ipalit ang pangalang 'Jesus' sa panghalip, kaya napapanatili ang anyo at bahagyang ambiguwidad ng Griyego habang nililinaw ito sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang karaniwang biblikal na mga anyong Andres, Simon Pedro, at Juan; iniwasan ang labis na pagpapaliwanag sa pangunahing teksto.
