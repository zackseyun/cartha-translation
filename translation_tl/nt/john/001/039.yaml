  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς· Ἔρχεσθε καὶ ⸂ὄψεσθε. ἦλθαν οὖν⸃ καὶ εἶδαν ποῦ μένει, καὶ παρ’ αὐτῷ ἔμειναν τὴν ἡμέραν ἐκείνην· ὥρα ἦν ὡς δεκάτη.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/039.yaml
  text: He said to them[a], “Come, and you will see.” So they went and saw where he was staying, and they stayed with him that day. It was about the tenth hour.
translation:
  language: tl
  text: Sinabi niya sa kanila, “Halikayo, at makikita ninyo.” Kaya pumunta sila at nakita kung saan siya nanunuluyan, at nanatili silang kasama niya noong araw na iyon. Bandang ikasampung oras noon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kung bibilangin mula sa pagsikat ng araw, mga alas-kuwatro ito ng hapon; inuunawa naman ito ng ilan ayon sa pagbilang na Romano bilang mga alas-diyes ng umaga.
    reason: Ipinapaliwanag ang dalawang pangunahing paraan ng pag-unawa sa “ikasampung oras” nang hindi nilulutas sa pangunahing teksto ang hindi tiyak na sistema ng pagbilang.
lexical_decisions:
- source_word: Ἔρχεσθε
  choice: Halikayo
  rationale: Isang tuwiran at likas na paanyaya sa maramihan; pinananatili nito ang aspektong nagpapatuloy ng pangkasalukuyang pautos nang hindi nagdaragdag ng di-hayag na kahulugan.
- source_word: ὄψεσθε
  choice: makikita ninyo
  rationale: Pinananatili ang anyong panghinaharap at ang tugon sa paanyayang “Halikayo.”
- source_word: ἦλθαν οὖν
  choice: Kaya pumunta sila
  rationale: Ipinahahayag ng “Kaya” ang likas na bunga na tinutukoy ng οὖν, at ang “pumunta” ay angkop sa pananaw ng salaysay matapos ang paanyaya ni Jesus.
- source_word: εἶδαν
  choice: nakita
  rationale: Payak na katumbas na pinananatili rin ang pag-uugnay sa naunang “makikita.”
- source_word: ποῦ μένει
  choice: kung saan siya nanunuluyan
  rationale: Sa konteksto, ang μένω ay tumutukoy sa lugar na pansamantalang tinutuluyan ni Jesus; likas at malinaw sa modernong Tagalog ang “nanunuluyan.”
- source_word: παρ’ αὐτῷ
  choice: kasama niya
  rationale: Ipinahahayag ang pagiging kapiling o kasama niya, hindi lamang ang pisikal na lokasyon.
- source_word: ἔμειναν
  choice: nanatili
  rationale: Pinananatili ang leksikal na diwa ng μένω, habang natural na ipinahahayag ang pananatili nila sa piling ni Jesus.
- source_word: τὴν ἡμέραν ἐκείνην
  choice: nang araw na iyon
  rationale: Hindi dinaragdagan ng “nalalabing bahagi” o “buong” araw, na hindi tahasang sinabi sa Griyego.
- source_word: ὥρα ἦν ὡς δεκάτη
  choice: Bandang ikasampung oras noon
  rationale: Pinananatili ang literal at hindi tiyak na pagtukoy sa oras; ang “bandang” ay kumakatawan sa ὡς nang hindi nagpapasya kung anong sistema ng pagbibilang ang ginamit.
- source_word: λέγει αὐτοῖς
  choice: Sinabi niya sa kanila
  rationale: Isinasalin ang makasaysayang pangkasalukuyan bilang pangnagdaan para sa natural na daloy ng salaysay sa Tagalog.
theological_decisions:
- issue: Pagbilang sa “ikasampung oras”
  choice: Panatilihin sa pangunahing teksto ang “ikasampung oras.”
  alternative: Mga alas-kuwatro ng hapon kung bibilang mula sa pagsikat ng araw, o mga alas-diyes ng umaga ayon sa pagbilang na Romano.
  rationale: Hindi tinutukoy ng teksto kung aling sistema ng oras ang ginamit. Pinananatili ng literal na pahayag ang tunay na kalabuan at inilalahad sa talababa ang dalawang pangunahing pagkaunawa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “Halikayo” bilang magalang ngunit karaniwang paanyaya sa maramihan, at iniwasan ang sobrang teknikal o makalumang pananalita.
