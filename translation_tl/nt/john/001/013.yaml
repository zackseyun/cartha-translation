id: JHN.1.13
reference: John 1:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἳ οὐκ ἐξ αἱμάτων οὐδὲ ἐκ θελήματος σαρκὸς οὐδὲ ἐκ θελήματος ἀνδρὸς ἀλλ’ ἐκ θεοῦ ἐγεννήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/013.yaml
  text: who were born, not from bloods, nor from the will of the flesh, nor from the will of a man, but from God.
translation:
  language: tl
  text: na ipinanganak, hindi mula sa mga dugo[a], ni sa kalooban ng laman, ni sa kalooban ng isang lalaki, kundi mula sa Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas idyomatiko: “hindi mula sa likas na angkan.” Maramihan sa Griyego ang “mga dugo,” isang di-karaniwang pahayag na tumutukoy sa likas na lahi o pinagmulang pantao.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἳ
  choice: na
  rationale: Iniuugnay ng panghalip na ito ang talata sa mga taong tinutukoy sa naunang talata; natural sa Tagalog ang pang-ugnay na “na” sa ganitong nagpapatuloy na sugnay.
- source_word: ἐξ αἱμάτων
  choice: mula sa mga dugo
  rationale: Pinananatili ang kapansin-pansing maramihang anyo ng αἱμάτων at ang paulit-ulit na larawan ng pinagmulan. Dahil di-karaniwan ang parirala sa Tagalog, nililinaw sa talababa ang idyomatikong diwa nitong likas na angkan o pinagmulang pantao.
- source_word: θελήματος
  choice: kalooban
  rationale: Ang “kalooban” ay marangal at malawak ang saklaw, at pinananatili nito ang magkatulad na kayarian ng dalawang parirala nang hindi nililimitahan ang salita sa pagnanasa o pasiya lamang.
- source_word: σαρκὸς
  choice: laman
  rationale: Pinananatili ng “laman” ang kongkretong salita at ang posibleng pagtukoy sa likas na pag-aanak ng tao, nang hindi ito ipinapakahulugan bilang “makasalanang kalikasan.”
- source_word: ἀνδρὸς
  choice: isang lalaki
  rationale: Tumutukoy ang ἀνήρ dito sa isang lalaking nasa hustong gulang at malamang sa papel ng lalaki sa pag-aanak; pinananatili ng “isang lalaki” ang tahasang kasarian at isahang anyo ng Griyego.
- source_word: ἐκ θεοῦ
  choice: mula sa Diyos
  rationale: Natural nitong ipinapahayag ang Diyos bilang pinagmulan at pinananatili ang tuwirang pagsalungat sa tatlong naunang parirala.
- source_word: ἐγεννήθησαν
  choice: ipinanganak
  rationale: Karaniwan at malinaw itong katumbas ng aorist passive ng γεννάω sa konteksto, habang naiiwasan ang lipas o masyadong teknikal na pananalita.
theological_decisions:
- issue: Pagsalungat ng likas na pinagmulang pantao at pinagmulang mula sa Diyos
  choice: Inilalarawan ang kapanganakan o pinagmulan na hindi nakabatay sa likas na angkan o kalooban ng tao, kundi sa Diyos.
  alternative: Maaaring unawain nang mas makitid bilang pagtanggi lamang sa pag-asa sa lahi, o bigyan ng mas tiyak na sakramental o metapisikal na pagpapakahulugan.
  rationale: Pinananatili ng salin ang tatlong magkakasunod na pagtanggi at ang pangwakas na pagsalungat sa Diyos, nang hindi nagdaragdag ng natatanging doktrina tungkol sa paraan ng kapanganakang ito.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Sadyang pinanatili ang di-karaniwang “mga dugo” at ang biblikal na “laman” upang maingatan ang anyo at tunay na lawak ng Griyego; nagbibigay ang talababa ng mas idyomatikong paliwanag.
