  source_fidelity: Tumpak ang “At ang mga isinugo ay mula sa mga Pariseo” para sa Καὶ ἀπεσταλμένοι ἦσαν ἐκ τῶν Φαρισαίων. Napapanatili nito ang pang-ugnay na Καὶ, ang kalagayang dulot ng pagkakasugo, at lalo na ang ἐκ bilang pinagmulan o pangkat na pinanggalingan, nang hindi ipinipilit ang mas malakas na diwang ahente na “ng mga Pariseo.”
