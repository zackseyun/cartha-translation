  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀Καὶ ἀπεσταλμένοι ἦσαν ἐκ τῶν Φαρισαίων.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/024.yaml
  text: And they had been sent from the Pharisees[a].
translation:
  language: tl
  text: At ang mga isinugo ay mula sa mga Pariseo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “At sila ay isinugo ng mga Pariseo.” Mas literal na ipinahihiwatig ng Griyego na sila ay mula sa mga Pariseo.
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ
  choice: At
  rationale: Payak na pang-ugnay ito na nagpapatuloy sa salaysay nang hindi nagdaragdag ng bagong interpretasyong temporal.
- source_word: ἀπεσταλμένοι ἦσαν
  choice: ang mga isinugo ay
  rationale: Pinananatili nito ang resultang kalagayan ng periphrastic perfect—sila ay mga taong naipadala na—nang natural sa Tagalog at hindi ginagawang tahasang pangngalang “mga sugo.”
- source_word: ἐκ
  choice: mula sa
  rationale: Tuwirang ipinahahayag ng ἐκ ang pinagmulan o kinabibilangang pinanggalingan; hindi nito tahasang itinatakda ang ahensiyang ipinahihiwatig ng “ng.”
- source_word: τῶν Φαρισαίων
  choice: mga Pariseo
  rationale: Karaniwan at malinaw na tawag sa pangkat na Φαρισαῖοι sa modernong Tagalog.
theological_decisions:
- issue: Ugnayan ng mga isinugo sa mga Pariseo
  choice: Ang mga taong tinutukoy ay mula sa mga Pariseo.
  alternative: Ang mga tao ay isinugo ng mga Pariseo.
  rationale: Mas tuwirang tumutukoy ang ἐκ na may genitive sa pinagmulan o pangkat na pinanggalingan kaysa sa tahasang gumaganap ng pagsusugo. Pinananatili ng salin ang pagkakaibang ito, habang inilalahad sa talababa ang posibleng diwa ng ahensiya.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mula sa” upang mapanatili ang tunay na kalabuan sa pagitan ng pinagmulan ng pangkat at ng ahensiya sa pagsusugo.
