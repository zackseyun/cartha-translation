source:
  edition: SBLGNT
  text: Ἐν τῷ κόσμῳ ἦν, καὶ ὁ κόσμος δι’ αὐτοῦ ἐγένετο, καὶ ὁ κόσμος αὐτὸν οὐκ ἔγνω.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/010.yaml
  text: He was in the world[a], and the world came into being through him[b], and the world did not know him.
translation:
  language: tl
  text: Nasa sanlibutan siya, at sa pamamagitan niya ay nagkaroon ng pag-iral ang sanlibutan[a], ngunit hindi siya nakilala ng sanlibutan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nilikha sa pamamagitan niya.” Ang pandiwang Griyego ay nangangahulugang “nagkaroon ng pag-iral” o “nagsimulang umiral.”
    reason: lexical_alternative
  - marker: b
    text: Ang “hindi siya nakilala” ay maaari ring magpahiwatig na “hindi siya nakilala kung sino siya” o “hindi siya kinilala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμῳ / κόσμος
  choice: sanlibutan
  rationale: 'Inulit ang “sanlibutan” sa tatlong paglitaw ng κόσμος upang mapanatili ang magkakaugnay ngunit malawak na diwa nito: ang nilikhang daigdig, ang mundong tinitirhan ng tao, at ang sangkatauhang hindi kumilala sa kanya.'
- source_word: ἦν
  choice: nasa
  rationale: Likas sa makabagong Tagalog ang “nasa sanlibutan siya” para sa patuloy na presensiyang ipinahahayag ng imperfect na ἦν, nang hindi nagdaragdag ng pilosopikal na paliwanag.
- source_word: δι’ αὐτοῦ
  choice: sa pamamagitan niya
  rationale: Malinaw nitong ipinahahayag ang tagapamagitan o instrumentong diwa ng διά na may genitive at umaayon sa pahayag sa Juan 1:3.
- source_word: ἐγένετο
  choice: umiral
  rationale: Ipinahihiwatig ng “umiral” na ang sanlibutan ay nagkaroon ng pag-iral sa pamamagitan niya, at pinananatili nito ang kaibahan ng ἐγένετο sa ἦν. Inilalagay sa talababa ang mas tahasang alternatibong “nilikha.”
- source_word: ἔγνω
  choice: nakilala
  rationale: Pinananatili ng “nakilala” ang malawak na puwersa ng γινώσκω, na maaaring sumaklaw sa pagkilala kung sino siya at sa pagtanggap o pagkilala sa kanya, nang hindi pumipili agad ng iisang interpretasyon.
- source_word: αὐτόν / αὐτοῦ
  choice: siya / niya
  rationale: Tumutukoy ang mga panghalip sa Logos sa naunang konteksto at pinananatili ang personal na pagtukoy sa kanya.
theological_decisions:
- issue: Ang tinutukoy ng di-binanggit na simuno
  choice: Gamitin ang personal na “siya,” na tumutukoy sa Salita sa kalapit na konteksto.
  alternative: Gumamit ng di-personal na panghalip kung ihihiwalay sa konteksto ang katawagang “Salita.”
  rationale: Bagaman walang tahasang pangngalang simuno sa talata, malinaw sa Juan 1:1–9 na personal ang tinutukoy. Pinananatili ng “siya” ang takbo ng teksto nang hindi nagdaragdag ng katawagang doktrinal.
- issue: Ang kaibahan ng pag-iral ng Salita at ng sanlibutan
  choice: Isalin ang ἐγένετο bilang “umiral” upang ipakitang ang sanlibutan ay nagkaroon ng pag-iral sa pamamagitan niya.
  alternative: “Nilikha sa pamamagitan niya.”
  rationale: Pinananatili nito hangga't maaari sa natural na Tagalog ang sinadyang kaibahan ng ἦν (“nasa”) at ἐγένετο (“umiral”), nang hindi nilulutas o pinalalawak ang teolohikal na pahayag ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang tatlong ulit na “sanlibutan” at ang personal na “siya.” Ginamit ang “ngunit” sa huling sugnay upang natural na maipahayag sa Tagalog ang kontrast na dala ng ikatlong καί sa konteksto.
