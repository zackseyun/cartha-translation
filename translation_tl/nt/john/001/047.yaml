source:
  edition: SBLGNT
  text: εἶδεν ⸀ὁ Ἰησοῦς τὸν Ναθαναὴλ ἐρχόμενον πρὸς αὐτὸν καὶ λέγει περὶ αὐτοῦ· Ἴδε ἀληθῶς Ἰσραηλίτης ἐν ᾧ δόλος οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/047.yaml
  text: Jesus saw Nathanael coming toward him and said about him, “Look, truly an Israelite in whom there is no deceit.”
translation:
  language: tl
  text: Nakita ni Jesus si Natanael na lumalapit patungo sa kanya, at sinabi niya tungkol kay Natanael, “Narito, isang tunay na Israelita na walang pandaraya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἴδε
  choice: Tingnan ninyo
  rationale: Natural na panawag-pansin sa makabagong Tagalog at pinananatili ang puwersa ng pautos na anyo.
- source_word: ἀληθῶς Ἰσραηλίτης
  choice: isang tunay na Israelita
  rationale: Ipinahahayag ang pagiging tunay o tapat na kinatawan ng Israel nang hindi dinaragdagan ang kahulugan.
- source_word: δόλος
  choice: pandaraya
  rationale: Sinasaklaw ang diwa ng panlilinlang, katusuhan, o pandarayang layunin sa kontekstong ito.
theological_decisions:
- issue: Kahulugan ng “tunay na Israelita”
  choice: Pinanatili bilang “isang tunay na Israelita.”
  alternative: “isang Israelitang tunay” o “isang tapat na Israelita”
  rationale: Hindi nililinaw nang higit sa Griyego kung ang diin ay etniko, moral, o tipolohikal; pinananatili ang posibleng teolohikal na alusyon at tensiyon.
- issue: Saklaw ng “walang pandaraya”
  choice: “na walang anumang pandaraya”
  alternative: “na hindi mandaraya”
  rationale: Mas malapit ito sa konstruksiyong ἐν ᾧ ... οὐκ ἔστιν at hindi ginagawang tahasang permanenteng bansag sa pagkatao ni Natanael.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “Tingnan ninyo” bilang likas na panawag-pansin; walang idinagdag na paliwanag o denominasyonal na interpretasyon.
