id: JHN.1.12
reference: John 1:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅσοι δὲ ἔλαβον αὐτόν, ἔδωκεν αὐτοῖς ἐξουσίαν τέκνα θεοῦ γενέσθαι, τοῖς πιστεύουσιν εἰς τὸ ὄνομα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/john/001/012.yaml
  text: But to all who received him[a], he gave them the right to become children of God—to those who believe in his name,
translation:
  language: tl
  text: Ngunit sa lahat ng tumanggap sa kanya, ibinigay niya ang karapatan[a] na maging mga anak ng Diyos—sa mga sumasampalataya sa kanyang pangalan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “awtoridad” o “kapangyarihan” na maging mga anak ng Diyos; ang salitang Griyego ay maaaring tumukoy sa ipinagkaloob na awtoridad, karapatan, o kakayahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι
  choice: sa lahat ng
  rationale: Ipinahahayag nito ang lahat ng kabilang sa pangkat na tinutukoy, habang nananatiling natural sa makabagong Tagalog.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita ang pagsalungat sa pagtanggi sa kanya sa naunang talata.
- source_word: ἔλαβον αὐτόν
  choice: tumanggap sa kanya
  rationale: Ang λαμβάνω rito ay tumutukoy sa pagtanggap sa Logos, hindi sa pisikal na pagkuha sa kanya; hindi rin ito pinakikitid sa mas mapagpaliwanag na “kumilala” o “tinanggap bilang.”
- source_word: ἔδωκεν
  choice: ibinigay niya
  rationale: Tuwirang inililipat ang payak na diwa ng δίδωμι; ang ipinagkaloob na katayuan ay nililinaw ng kasunod na ἐξουσίαν.
- source_word: ἐξουσίαν
  choice: karapatan
  rationale: Sa kontekstong ito, tumutukoy ito sa ipinagkaloob na karapatan o pahintulot na maging mga anak ng Diyos, hindi lamang sa lakas o kapangyarihan.
- source_word: τέκνα θεοῦ
  choice: mga anak ng Diyos
  rationale: Ang τέκνα ay saklaw ang mga anak anuman ang kasarian at hindi ang mas tiyak na panlalaking “mga anak na lalaki.”
- source_word: γενέσθαι
  choice: na maging
  rationale: Pinananatili nito ang diwa ng pagpasok sa isang bagong kalagayan, sa halip na simpleng pag-iral lamang.
- source_word: τοῖς πιστεύουσιν
  choice: sa mga sumasampalataya
  rationale: Natural nitong inilalarawan ang mga taong kinikilala sa patuloy na pananampalataya.
- source_word: εἰς τὸ ὄνομα αὐτοῦ
  choice: sa kanyang pangalan
  rationale: Pinananatili ang “pangalan” bilang pahayag ng kanyang inihayag na pagkakakilanlan at persona; ang pananampalataya ay nakatuon sa kanya.
theological_decisions:
- issue: Ugnayan ng “tumanggap sa kanya” at “sumasampalataya sa kanyang pangalan”
  choice: Panatilihin ang dalawang pahayag, at gamitin ang ikalawa upang higit na tukuyin kung sino ang mga tumanggap.
  alternative: Pagsamahin ang dalawa at isalin bilang iisang ideya lamang.
  rationale: Kapwa hayagang nasa Griyego ang dalawang pahayag. Ang pagpapanatili sa mga ito ay hindi sapilitang nagpapasya kung ganap silang magkasingkahulugan o kung may bahagyang magkaibang diin.
- issue: Kahulugan ng katawagang tumutukoy sa kaugnayan sa Diyos
  choice: mga anak ng Diyos
  alternative: mga anak na lalaki ng Diyos
  rationale: τέκνα ang ginamit, hindi υἱοί; kaya hindi dapat ipasok ang panlalaking limitasyon na wala sa pinagmulan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang tradisyonal at madaling maunawaang “sumasampalataya sa kanyang pangalan.” Inilagay ang talababa pagkatapos ng “karapatan,” ang salitang aktuwal na tinutukoy nito.
