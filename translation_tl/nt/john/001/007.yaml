id: JHN.1.7
reference: John 1:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὗτος ἦλθεν εἰς μαρτυρίαν, ἵνα μαρτυρήσῃ περὶ τοῦ φωτός, ἵνα πάντες πιστεύσωσιν δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/007.yaml
  text: He came as a witness[a], so that he might testify about the Light[b], so that all might believe through him.
translation:
  language: tl
  text: Dumating siya bilang saksi upang magpatotoo tungkol sa Liwanag, upang ang lahat ay sumampalataya sa pamamagitan niya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Malamang na tumutukoy ang “niya” kay Juan—sa pamamagitan ng kanyang patotoo. Maaari rin itong unawain ng ilan na tumutukoy sa Liwanag.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτος
  choice: siya
  rationale: Tumutukoy ito pabalik kay Juan sa naunang talata. Mas natural sa makabagong Tagalog ang “siya” kaysa sa literal na “ang isang ito,” at malinaw pa rin ang tinutukoy.
- source_word: ἦλθεν εἰς μαρτυρίαν
  choice: Dumating siya bilang saksi
  rationale: Ipinahahayag ng parirala ang pagdating ni Juan sa tungkulin ng isang saksi. Pinananatili ng “bilang saksi” ang diwang testimonya at natural itong pakinggan sa Tagalog.
- source_word: ἵνα μαρτυρήσῃ
  choice: upang magpatotoo
  rationale: Pinananatili ng “upang” ang layuning ipinahahayag ng ἵνα, samantalang malinaw na inilalarawan ng “magpatotoo” ang gawain ng isang saksi.
- source_word: περὶ τοῦ φωτός
  choice: tungkol sa Liwanag
  rationale: Likas na katumbas ng περί na may genitive ang “tungkol sa.” Ginamit ang malaking titik sa “Liwanag” dahil sa konteksto ay tumutukoy ito nang tila pantawag sa persona ng tunay na Liwanag, hindi lamang sa pisikal na liwanag.
- source_word: ἵνα πάντες πιστεύσωσιν
  choice: upang ang lahat ay sumampalataya
  rationale: Ang ikalawang “upang” ay nagpapanatili sa ikalawang sugnay ng layunin. Ang “ang lahat” ay hindi nililimitahan ang saklaw ng πάντες, at ang “sumampalataya” ay karaniwang malinaw na katumbas ng πιστεύω sa kontekstong ito.
- source_word: δι’ αὐτοῦ
  choice: sa pamamagitan niya
  rationale: Ipinahahayag nito ang paraan o tagapamagitan at pinananatili ang panghalip na may posibleng kalabuan sa pinatutungkulan.
theological_decisions:
- issue: Ang tinutukoy ng αὐτοῦ sa δι’ αὐτοῦ
  choice: Pangunahing inuunawa ang “niya” bilang si Juan, na sa pamamagitan ng kanyang patotoo ay maaaring sumampalataya ang lahat.
  alternative: Maaaring unawain ng ilan ang “niya” bilang ang Liwanag.
  rationale: Si Juan ang paksa ng pangungusap at siya ang mas natural na tinutukoy ng panghalip; kaayon din ito ng pagkakaiba ni Juan at ng Liwanag sa kasunod na talata. Gayunman, hindi tahasang pinapangalanan ng Griyego ang tinutukoy, kaya pinananatili sa talababa ang ibang posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang magkasunod na mga sugnay ng layunin at ang wikang patotoo/saksi, habang iniwasan ang di-likas na literalismong “ang isang ito.”
