  source_fidelity: 'Ang pangunahing mga sugnay ay wasto ang pagtutumbas sa Griyego: ang λόγος ay “Salita,” ang πρὸς τὸν θεόν ay “kasama ng Diyos,” at ang pangwakas na θεὸς ἦν ὁ λόγος ay “ang Salita ay Diyos.” Gayunman, ang “naroon na” ay nagdaragdag ng locative at ng aspektong “already” na hindi tuwirang nasa ἦν. Mas malapit at natural ang “umiiral.”'
  naturalness: Marangal at malinaw ang Filipino. Ang “Sa pasimula” ay angkop at umaalingawngaw sa Genesis 1:1. Ang “umiiral” ay mas tuwirang pagpapahayag ng pag-iral kaysa “naroon na,” nang hindi nagpapahiwatig ng isang partikular na lugar.
  terminology: 'Ang “Salita” at “Diyos” ay matatag, nauunawaan, at angkop sa rehistro. Dapat gawing mas maingat ang talababa sa huling sugnay: ang kwalitatibong pagbasa ay mahalagang posibilidad, ngunit hindi dapat ipahayag ng tala bilang resolbadong doktrinal na hatol ang pinagtatalunang sintaktikong diin.'
