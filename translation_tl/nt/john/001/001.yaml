  to: Sa pasimula[b] ay umiiral ang Salita, at ang Salita ay kasama ng Diyos, at ang Salita ay Diyos.[a]
  rationale: Pinalitan ang “naroon na” ng “umiiral” upang maipahayag ang ἦν nang walang dagdag na pahiwatig ng lokasyon o ng ‘already.’ Pinanatili ang “Sa pasimula,” “Salita,” “kasama ng Diyos,” at “ang Salita ay Diyos,” sapagkat tapat ang mga ito sa teksto at natural sa marangal na modernong Filipino. Inayos ang talababa upang magbigay ng gramatikal na paliwanag at alternatibong pag-unawa nang hindi ipinapataw ang isang denominasyonal o ganap na resolusyon sa debateng sintaktiko.
