  yaml_path: translation/nt/john/001/001.yaml
  text: In the beginning was the Word[a], and the Word was with God[b], and the Word was God.
translation:
  language: tl
  text: Sa pasimula[b] ay umiiral ang Salita, at ang Salita ay kasama ng Diyos, at ang Salita ay Diyos.[a]
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 'Maaari ring ipaliwanag: “ang Salita ay may likas na pagka-Diyos,” o “kung ano ang Diyos, gayon din ang Salita.” Sa Griyego, walang pantukoy ang “Diyos” sa huling sugnay at nauuna ito sa pandiwa; maaaring idiin nito ang katangian ng Salita habang ibinubukod siya sa Diyos na binanggit sa naunang sugnay.'
    reason: alternative_reading
  - marker: b
    text: Ang pambungad na parirala ay umaalingawngaw sa Genesis 1:1 at iniuugnay ang Salita sa pasimula ng paglikha.
    reason: cross_reference
lexical_decisions:
- source_word: Ἐν ἀρχῇ
  choice: Sa pasimula
  rationale: Pinananatili nito ang tuwirang alingawngaw ng Genesis 1:1 at ang marangal na pananalita, habang malinaw pa rin sa makabagong mambabasa.
- source_word: ἦν
  choice: ay naroon na / ay
  rationale: Sa unang sugnay, ipinahihiwatig ng “naroon na” ang patuloy nang pag-iral ng Salita sa pasimula. Sa kasunod na mga sugnay, likas sa Filipino ang pang-ugnay na “ay,” na nagpapanatili sa payak at paulit-ulit na indayog ng Griyego.
- source_word: ὁ λόγος
  choice: ang Salita
  rationale: Saklaw ng λόγος ang salita, pagpapahayag, at pahayag ng Diyos; bilang personal na katawagan sa kontekstong ito, ang “Salita” ang pinakatumpak, nakaugaliang, at hindi labis na mapagpaliwanag na salin.
- source_word: πρὸς τὸν θεόν
  choice: kasama ng Diyos
  rationale: Ipinahahayag nito sa natural na Filipino ang ugnayan at personal na pagkakaiba ng Salita at ng Diyos. Ang mas literal na “patungo sa Diyos” ay magiging alanganin at maaaring magpahiwatig ng paggalaw na wala sa konteksto.
- source_word: τὸν θεόν
  choice: Diyos
  rationale: Tiyak at personal ang tinutukoy ng may-artikulong anyo sa Griyego; hindi kailangan ng katumbas na pantukoy bago ang “Diyos” sa Filipino.
- source_word: θεὸς ἦν ὁ λόγος
  choice: ang Salita ay Diyos
  rationale: Pinananatili nito ang tuwiran at mariing pahayag tungkol sa likas na pagka-Diyos ng Salita, nang hindi ginagawang iisang persona ang Salita at ang Diyos na binanggit sa naunang sugnay.
theological_decisions:
- issue: Ang di-may-artikulong θεός bilang panaguri sa huling sugnay
  choice: ang Salita ay Diyos
  alternative: ang Salita ay may likas na pagka-Diyos; kung ano ang Diyos, gayon din ang Salita
  rationale: 'May kwalitatibong diin ang θεός sa ayos ng Griyego: ipinahahayag nito kung ano ang Salita ayon sa likas na katangian, habang nananatili ang personal na pagkakaiba niya sa “Diyos” sa naunang sugnay. Ang pangunahing salin ay maikli at matapat; inilalagay sa talababa ang mga paliwanag upang hindi tahimik na lutasin ang sintaktiko at teolohikong tensiyon.'
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “Sa pasimula” upang mapanatili ang ugnayang pampanitikan sa Genesis, “naroon na” upang natural na ipahiwatig ang nauna at nagpapatuloy na pag-iral, at “kasama ng Diyos” upang malinaw na maipahayag ang personal na ugnayan nang hindi mabigat o teknikal ang pananalita.
