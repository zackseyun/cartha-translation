id: JHN.1.21
reference: John 1:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἠρώτησαν αὐτόν· Τί οὖν; ⸂σὺ Ἠλίας εἶ⸃; καὶ λέγει· Οὐκ εἰμί. Ὁ προφήτης εἶ σύ; καὶ ἀπεκρίθη· Οὔ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/021.yaml
  text: And they asked him[a], “What then? Are you Elijah?” And he says, “I am not.” “Are you the Prophet?” And he answered[b], “No.”
translation:
  language: tl
  text: At tinanong nila siya, “Kung gayon, ano? Ikaw ba si Elias?” Sinabi niya[b], “Hindi ako.” “Ikaw ba ang Propeta[a]?” Sumagot siya, “Hindi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang propetang iyon,” na malamang ay tumutukoy sa inaasahang propetang gaya ni Moises (Deuteronomio 18:15, 18).
    reason: alternative_reading
  - marker: b
    text: 'Sa Griyego, ginamit dito ang makasaysayang kasalukuyan: “sinasabi niya,” isang masiglang paraan ng pagsasalaysay.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρώτησαν
  choice: tinanong
  rationale: Karaniwang pandiwang Filipino para sa tuwirang pagtatanong; hindi ito nagdaragdag ng diin na wala sa Griyego.
- source_word: Τί οὖν;
  choice: Kung gayon, ano?
  rationale: Pinananatili ang maikli at biglang kasunod na tanong, pati ang lohikal na ugnayang ipinahihiwatig ng οὖν.
- source_word: σὺ Ἠλίας εἶ
  choice: Ikaw ba si Elias?
  rationale: Likas na anyo ng tanong sa Filipino at napapanatili ng tahasang “ikaw” ang diin ng σὺ. Ginamit ang nakaugaliang anyo ng pangalang Elias sa Tagalog.
- source_word: Οὐκ εἰμί
  choice: Hindi ako
  rationale: Maikli at tuwirang pagtanggi sa pagkakakilanlan, nang hindi nagdaragdag ng pantukoy na wala sa teksto.
- source_word: Ὁ προφήτης
  choice: ang Propeta
  rationale: Ipinakikita ng tiyak na artikulo na isang partikular at inaasahang tauhan ang tinutukoy, hindi basta sinumang propeta.
- source_word: λέγει
  choice: Sinabi niya
  rationale: Likas na salaysay sa modernong Filipino. Ang kasalukuyang panahunan ng Griyego bilang makasaysayang kasalukuyan ay ipinaliwanag sa talababa.
- source_word: ἀπεκρίθη
  choice: Sumagot siya
  rationale: Tuwiran at karaniwang katumbas sa salaysay ng pagbibigay ng sagot.
- source_word: Οὔ
  choice: Hindi
  rationale: Natural na Filipino para sa nagsasariling mariing negatibong sagot.
theological_decisions:
- issue: Pagkakakilanlan ng “ang Propeta”
  choice: Isinalin bilang “ang Propeta” nang walang paliwanag sa pangunahing teksto.
  alternative: “ang propetang gaya ni Moises” o isang pangkalahatang “isang propeta”
  rationale: Ang artikulo sa Griyego ay tumutukoy sa isang kinikilalang inaasahang tauhan, ngunit hindi tahasang nilulutas ng talata ang buong pagkakakilanlan niya.
- issue: Pagtanggi ni Juan na siya si Elias
  choice: Pinanatili ang payak na “Hindi ako.”
  alternative: Palawakin bilang “Hindi ako si Elias sa literal na diwa” o itugma sa ibang mga talata.
  rationale: Dapat manatili ang tuwirang pagtanggi sa talatang ito nang hindi ipinapasok sa salin ang isang teolohikal na pagkakasundo mula sa ibang teksto.
translation_notes:
  register: 'Modernong Filipino na natural ngunit marangal. Pinanatili ang maiikling sagot at ang biglang daloy ng pagtatanong. Inilagay ang mga talababa sa mismong salitang kaugnay ng paliwanag: [a] sa “Propeta” at [b] sa pandiwang nagsasalin sa λέγει.'
