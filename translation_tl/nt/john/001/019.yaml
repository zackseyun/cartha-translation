id: JHN.1.19
reference: John 1:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ αὕτη ἐστὶν ἡ μαρτυρία τοῦ Ἰωάννου ὅτε ⸀ἀπέστειλαν οἱ Ἰουδαῖοι ἐξ Ἱεροσολύμων ἱερεῖς καὶ Λευίτας ἵνα ἐρωτήσωσιν αὐτόν· Σὺ τίς εἶ;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/019.yaml
  text: And this is the testimony of John[a], when the Jews sent priests and Levites from Jerusalem to ask him, “Who are you?”
translation:
  language: tl
  text: At ito ang patotoo ni Juan nang magsugo ang mga Judio ng mga pari at mga Levita mula sa Jerusalem upang tanungin siya, “Sino ka?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μαρτυρία
  choice: patotoo
  rationale: Likas at malinaw na salin ng pangngalan, at napapanatili ang diwa ng pormal na pagpapatunay o pagsaksi na mahalaga sa Ebanghelyo ni Juan.
- source_word: τοῦ Ἰωάννου
  choice: ni Juan
  rationale: 'Itinuturing ang genitibo bilang subjective: si Juan ang nagbibigay ng patotoo, hindi siya ang paksa ng patotoo ng iba.'
- source_word: ὅτε
  choice: nang
  rationale: Natural na pang-ugnay sa Filipino para ipakilala ang panahong naganap ang patotoo.
- source_word: ἀπέστειλαν
  choice: magsugo
  rationale: Ang pandiwang 'magsugo' ay natural sa sugnay na may 'nang' at malinaw na nagpapahiwatig ng pagpapadala ng mga kinatawan.
- source_word: οἱ Ἰουδαῖοι
  choice: ang mga Judio
  rationale: Pinananatili ang tuwirang katawagan ng Griyego, habang nililinaw sa talababa na sa kontekstong ito ay maaaring partikular na tumukoy sa mga pinunong panrelihiyon sa Judea.
- source_word: ἐξ Ἱεροσολύμων
  choice: mula sa Jerusalem
  rationale: Karaniwang Filipino para sa pinagmulan o lugar na pinanggalingan.
- source_word: ἱερεῖς καὶ Λευίτας
  choice: mga pari at mga Levita
  rationale: Pinananatiling magkahiwalay at malinaw ang dalawang pangkat na kaugnay ng paglilingkod sa templo.
- source_word: ἵνα ἐρωτήσωσιν αὐτόν
  choice: upang tanungin siya
  rationale: Tumpak na ipinapahayag ang layunin ng pagsusugo at ang pormal na 'upang' ay angkop sa marangal na rehistro.
- source_word: Σὺ τίς εἶ;
  choice: Sino ka?
  rationale: Ito ang natural at tuwirang anyo ng tanong sa modernong Filipino; hindi kailangang piliting ipakita nang hiwalay ang diin ng tahasang panghalip sa Griyego.
theological_decisions:
- issue: Tinutukoy ng οἱ Ἰουδαῖοι sa Ebanghelyo ni Juan
  choice: ang mga Judio
  alternative: ang mga pinunong Judio; ang mga taga-Judea
  rationale: Pinananatili sa pangunahing teksto ang malawak at literal na katawagan ng Griyego, ngunit iniiwasan ng talababa ang maling pag-unawang tumutukoy ito sa buong bayang Judio. Ipinahihiwatig ng pagsusugo ng mga pari at Levita mula sa Jerusalem na mga awtoridad na panrelihiyon ang lalo nang tinutukoy rito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “patotoo,” “magsugo,” at “upang” upang mapanatili ang bahagyang pormal na himig at ang legal na diwa ng pagsaksi nang hindi nagiging lipas o mabigat basahin.
