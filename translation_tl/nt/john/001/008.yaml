id: JHN.1.8
reference: John 1:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὐκ ἦν ἐκεῖνος τὸ φῶς, ἀλλ’ ἵνα μαρτυρήσῃ περὶ τοῦ φωτός.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/008.yaml
  text: He was not the light[a], but came to bear witness about the light.
translation:
  language: tl
  text: Hindi siya ang ilaw,[a] kundi naparito siya upang magpatotoo tungkol sa ilaw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O mas literal: “Hindi siya ang ilaw, kundi upang magpatotoo tungkol sa ilaw.” Ipinahihiwatig lamang ng konteksto ang pandiwa sa ikalawang sugnay ng Griyego.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἦν
  choice: Hindi siya ang
  rationale: Likas na salin sa Filipino ng negatibong imperfect ng εἰμί sa isang pangungusap na tumutukoy sa pagkakakilanlan; hindi kailangang tahasang ipakita sa Filipino ang aspektong imperfect dito.
- source_word: ἐκεῖνος
  choice: siya
  rationale: Bagaman demonstratibo ang anyo, ginagamit ito rito bilang mariing personal na pagtukoy kay Juan. Ang “siya” ay natural sa modernong Filipino, samantalang magiging matigas ang “ang isang iyon.”
- source_word: τὸ φῶς
  choice: ang ilaw
  rationale: Pinananatili ang tiyak na pantukoy sapagkat tumutukoy ito sa partikular na Ilaw na inilalarawan sa prologo.
- source_word: ἀλλ’ ἵνα
  choice: kundi naparito siya upang
  rationale: May elipsis sa Griyego pagkatapos ng ἀλλά. Ginagawang buo ang diwa sa natural na Filipino sa pamamagitan ng “naparito siya,” na hinango sa konteksto ng layunin ni Juan, habang itinatala sa talababa ang mas literal na anyo.
- source_word: μαρτυρήσῃ
  choice: magpatotoo
  rationale: Karaniwan at dignified na katumbas na nagpapanatili sa diwang testimonial o forensic ng μαρτυρέω at ang mahalagang bokabularyo ng pagpapatotoo sa Juan.
- source_word: περὶ τοῦ φωτός
  choice: tungkol sa ilaw
  rationale: Ang “tungkol sa” ay malinaw at natural na katumbas ng περί na may genitive sa modernong Filipino.
theological_decisions:
- issue: Ang pagkakakilanlan at papel ni Juan kaugnay ng ilaw
  choice: Tahasang itinatanggi na si Juan ang ilaw at inilalahad na ang layunin niya ay magpatotoo tungkol sa ilaw.
  alternative: 'Mas literal: “Hindi siya ang ilaw, kundi upang magpatotoo tungkol sa ilaw.”'
  rationale: Pinananatili ang pagkakaiba ng saksi at ng ilaw nang walang idinaragdag na paliwanag na denominasyonal. Ang “naparito siya” ay pagpuno sa elipsis ayon sa konteksto, hindi bagong pahayag na teolohikal.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang “magpatotoo” upang mapanatili ang susing temang testimonial sa Ebanghelyo ni Juan; iniwasan ang mas kolokyal o masyadong teknikal na pananalita.
