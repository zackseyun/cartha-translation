  text: ἦν δὲ ὁ Φίλιππος ἀπὸ Βηθσαϊδά, ἐκ τῆς πόλεως Ἀνδρέου καὶ Πέτρου.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/044.yaml
  text: Philip was from Bethsaida[a], from the town of Andrew and Peter.
translation:
  language: tl
  text: Si Felipe ay taga-Betsaida, mula sa bayang pinagmulan din nina Andres at Pedro.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν
  choice: ay
  rationale: Ang imperfect ng εἰμί ay nagsasaad dito ng kalagayan o pinagmulan ni Felipe; sa natural na Tagalog, sapat ang pang-ugnay na “ay” kasama ng “taga-Betsaida.”
- source_word: δὲ
  choice: hindi tahasang isinalin
  rationale: Mahinang pang-ugnay ito sa daloy ng salaysay. Natural itong hindi banggitin sa Tagalog sapagkat walang matibay na pagsalungat o tiyak na panahong ipinahihiwatig.
- source_word: Φίλιππος
  choice: Felipe
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa modernong Tagalog.
- source_word: ἀπὸ Βηθσαϊδά
  choice: taga-Betsaida
  rationale: Ang ἀπό ay tumutukoy sa pinagmulan; malinaw at likas sa Tagalog ang “taga-Betsaida.”
- source_word: ἐκ τῆς πόλεως
  choice: mula sa bayang
  rationale: Ang πόλις ay maaaring “lungsod” o “bayan.” Ang “bayan” ay natural dito at hindi nagpapahiwatig ng sukat ng pamayanan nang higit sa sinasabi ng konteksto.
- source_word: Ἀνδρέου καὶ Πέτρου
  choice: pinagmulan din nina Andres at Pedro
  rationale: Ang mga genitive ay nag-uugnay sa bayan kina Andres at Pedro bilang lugar na kanilang pinagmulan. Nilinaw ito nang natural sa Tagalog nang hindi nagdaragdag ng ibang teolohikal na kahulugan.
theological_decisions: []
