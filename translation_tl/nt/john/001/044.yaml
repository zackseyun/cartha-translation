  register: Modernong Filipino Tagalog na natural at marangal. Isinalin ang ikalawang pariralang pinagmulan bilang paglilinaw sa Betsaida, at ginamit ang “din” upang maipakita na iisang bayan ang pinagmulan nina Felipe, Andres, at Pedro.
