revisions:
- from: Nagpapatotoo si Juan tungkol sa kanya at malakas niyang ipinahayag, “Siya ang tinutukoy ko nang sabihin ko, ‘Ang dumarating na kasunod ko ay nasa unahan ko na[a], sapagkat nauna na siya sa akin.’[b]”
  to: Nagpapatotoo si Juan tungkol sa kanya at sumigaw siya, “Siya ang tinukoy ko nang sabihin ko, ‘Ang dumarating na kasunod ko ay nasa unahan ko na[a], sapagkat nauna siya sa akin.’[b]”
  rationale: Pinanatili ng rebisyon ang kasalukuyang “Nagpapatotoo,” ang malawak na larawan ng pagiging “nasa unahan,” at ang hindi labis na pagpapakahulugan sa huling pahayag. Ginawang “sumigaw siya” ang κέκραγεν upang maging tapat sa semantikong lakas nito, at inalis ang dagdag na “na” sa πρῶτός μου ἦν.
