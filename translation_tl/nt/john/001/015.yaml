  text: (Ἰωάννης μαρτυρεῖ περὶ αὐτοῦ καὶ κέκραγεν λέγων· Οὗτος ἦν ⸂ὃν εἶπον⸃· Ὁ ὀπίσω μου ἐρχόμενος ἔμπροσθέν μου γέγονεν, ὅτι πρῶτός μου ἦν·)
base_translation:
  language: en
  yaml_path: translation/nt/john/001/015.yaml
  text: John testifies about him and has cried out[a], saying, “This was he of whom I said, ‘The one coming after me has become before me[b], because he was before me.’”
translation:
  language: tl
  text: Nagpapatotoo si Juan tungkol sa kanya at sumigaw siya, “Siya ang tinukoy ko nang sabihin ko, ‘Ang dumarating na kasunod ko ay nasa unahan ko na[a], sapagkat nauna siya sa akin.’[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nanguna sa akin” o “nakahihigit sa akin.” Ang Griyego ay maaaring tumukoy sa pagkauna o ranggo, hindi lamang sa pagkakasunod.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “umiiral na siya bago pa ako.” Ang “nauna siya sa akin” ay mas malapit sa pagkakasabi sa Griyego, habang pinahihintulutan pa rin ng konteksto ang pahiwatig ng pag-iral niya bago pa si Juan.
    reason: alternative_reading
lexical_decisions:
- source_word: μαρτυρεῖ
  choice: Nagpapatotoo
  rationale: Pinananatili ang pangkasalukuyang aspekto at ang diwa ng pagbibigay ng patotoo sa malinaw at likas na modernong Tagalog.
- source_word: περὶ αὐτοῦ
  choice: tungkol sa kanya
  rationale: Likas na katumbas sa Tagalog ng περί na may genitive sa kontekstong ito.
- source_word: κέκραγεν λέγων
  choice: malakas niyang ipinahayag
  rationale: Ipinahihiwatig ang malakas na pagsigaw o pagpapahayag, habang iniiwasan ang pilit na pagtutumbas ng Greek perfect na walang eksaktong likas na katapat sa Tagalog.
- source_word: Οὗτος ἦν ὃν εἶπον
  choice: Siya ang tinutukoy ko nang sabihin ko
  rationale: Likas na ipinapahayag sa Tagalog ang diwa ng taong tinukoy ni Juan sa nauna niyang sinabi, nang hindi ginagaya ang alanganing literal na relative construction.
- source_word: Ὁ ὀπίσω μου ἐρχόμενος
  choice: Ang dumarating na kasunod ko
  rationale: Pinananatili ang participial na diwa ng pagdating at ang maaaring temporal o ministeryal na kahulugan ng ‘kasunod ko.’
- source_word: ἔμπροσθέν μου γέγονεν
  choice: ay nasa unahan ko na
  rationale: Pinananatili ang larawan ng pagiging nasa unahan at ang resultang kalagayan ng perfect, nang hindi tahasang nililimitahan ang kahulugan sa ranggo, kadakilaan, o pagkakasunod sa panahon.
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw na ipinakikilala ang dahilan ng naunang pahayag sa isang marangal ngunit pangkaraniwang anyo.
- source_word: πρῶτός μου ἦν
  choice: nauna na siya sa akin
  rationale: Malapit sa pahayag ng temporal o komparatibong pagkauna sa Greek at hinahayaang ang konteksto ang magpahiwatig ng pag-iral bago pa si Juan.
theological_decisions:
- issue: Kung gaano katahasang ipahahayag ang preexistence ni Cristo sa huling sugnay
  choice: nauna na siya sa akin
  alternative: umiiral na siya bago pa ako
  rationale: Malakas na ipinahihiwatig ng talata at ng konteksto ng Juan 1 ang pag-iral ng Salita bago pa si Juan, ngunit hindi dapat idagdag sa pangunahing teksto ang pandiwang ‘umiiral’ na hindi tahasang naroon sa Greek. Pinananatili nito ang tunay na tensiyong teolohikal at ang lapit sa orihinal.
- issue: Kung ang ἔμπροσθέν μου γέγονεν ay tahasang tumutukoy sa higit na ranggo
  choice: ay nasa unahan ko na
  alternative: nanguna sa akin / higit sa akin
  rationale: Ang Greek ay maaaring magpahiwatig ng prioridad o ranggo, ngunit ang larawang ‘nasa unahan’ ay nagpapanatili ng mas malawak na posibilidad at hindi agad nilulutas ang pahayag sa iisang interpretasyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Iniwasan ang sobrang literal na sintaks na magiging alanganin sa Tagalog, ngunit pinanatili ang pag-uulit at ang ambiguwidad sa pagitan ng pagkauna sa panahon at pagiging nakahihigit sa ranggo.
