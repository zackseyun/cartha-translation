  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἔφη· Ἐγὼ φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Εὐθύνατε τὴν ὁδὸν κυρίου, καθὼς εἶπεν Ἠσαΐας ὁ προφήτης.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/023.yaml
  text: He said[a], “I am a voice of one crying out in the wilderness, ‘Make straight the way of the Lord,’ just as Isaiah the prophet said.”
translation:
  language: tl
  text: Sinabi niya[a], “Ako’y tinig ng isang sumisigaw sa ilang, ‘Tuwirin ninyo ang daan ng Panginoon,’ gaya ng sinabi ng propetang si Isaias.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Griyego, maaari ring iugnay ang “sa ilang” sa “tinig”: “Ako’y tinig sa ilang ng isang sumisigaw.” Gayunman, mas natural dito na ang “sa ilang” ay tumutukoy sa “sumisigaw.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφη
  choice: Sinabi niya
  rationale: Likas at payak na panimula sa tuwirang pananalita sa konteksto ng pag-uusap.
- source_word: Ἐγὼ
  choice: Ako’y
  rationale: Pinananatili ang hayag na pagtukoy ni Juan sa sarili; ang pinaikling “Ako’y” ay natural sa marangal na makabagong Tagalog.
- source_word: φωνὴ βοῶντος
  choice: tinig ng isang sumisigaw
  rationale: Inilalarawan ni Juan ang sarili bilang tinig ng taong sumisigaw; pinananatili ng “sumisigaw” ang lakas ng pandiwang βοάω.
- source_word: ἐν τῇ ἐρήμῳ
  choice: sa ilang
  rationale: Ang “ilang” ay maikli, natural, at angkop sa pook na malayo at di-tinitirhan, habang pinananatili ang alingawngaw ng sipi mula kay Isaias.
- source_word: Εὐθύνατε
  choice: Tuwirin ninyo
  rationale: Tuwirang pautos ito sa maramihan at malinaw na naghahatid ng larawan ng pagpapatuwid ng daraanan.
- source_word: τὴν ὁδὸν
  choice: ang daan
  rationale: Pinananatili ang literal na larawan at ang mas malawak na metaporikal na diwa ng ὁδός.
- source_word: κυρίου
  choice: ng Panginoon
  rationale: Ang “Panginoon” ang karaniwan at teolohikal na makabuluhang salin ng κύριος, lalo na sa sipi mula kay Isaias.
- source_word: καθὼς εἶπεν
  choice: gaya ng sinabi
  rationale: Malinaw na ipinapakita ang pagtutugma ng pahayag ni Juan at ng sinabi ni Isaias.
- source_word: Ἠσαΐας ὁ προφήτης
  choice: propeta Isaias
  rationale: Ito ang natural at madaling maunawaang ayos sa makabagong Tagalog.
theological_decisions:
- issue: Pagkakasalin ng κύριος sa sipi mula kay Isaias
  choice: Panginoon
  alternative: panginoon o amo
  rationale: Pinananatili ng “Panginoon” ang bigat ng banal na katawagan sa konteksto ng Isaias at hindi pinapahina ang ugnayan ng sipi sa pagliligtas na gawain ng Diyos.
- issue: Pagkakaugnay ng “sa ilang” sa pangungusap
  choice: Iniuugnay sa “sumisigaw”
  alternative: Maaaring iugnay sa “tinig”
  rationale: Pinakanatural sa daloy ng Griyego at Tagalog na ang taong sumisigaw ang nasa ilang, ngunit tunay na posible sa balarila ang ibang pagkakaugnay kaya ito ay inilagay sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “ilang” sa halip na “disyerto” upang maging natural at mapanatili ang tradisyonal na biblikal na larawan; iniwasan ang labis na pormal o lumang pananalita.
