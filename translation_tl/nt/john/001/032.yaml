source:
  edition: SBLGNT
  text: καὶ ἐμαρτύρησεν Ἰωάννης λέγων ὅτι Τεθέαμαι τὸ πνεῦμα καταβαῖνον ⸀ὡς περιστερὰν ἐξ οὐρανοῦ, καὶ ἔμεινεν ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/032.yaml
  text: And John testified[a], saying, “I have seen the Spirit descending like a dove out of heaven[b], and it remained on him.”
translation:
  language: tl
  text: 'At nagpatotoo si Juan: “Nakita ko ang Espiritu na bumababa mula sa langit, gaya ng isang kalapati[a], at nanatili ito sa ibabaw niya.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “na parang isang kalapati.” Inilalarawan ng Griyego ang pagkakatulad, ngunit hindi tahasang sinasabi kung ang tinutukoy ay anyo, galaw, o ibang katangian ng kalapati.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρησεν
  choice: nagpatotoo
  rationale: Likas at malinaw na Filipino para sa pagbibigay ng patotoo bilang saksi; pinananatili nito ang mahalagang temang pagpapatotoo sa Ebanghelyo ni Juan.
- source_word: λέγων ὅτι
  choice: —
  rationale: Sa halip na ang mas mabigat na “na sinasabi,” tuwirang ipinakilala ng tutuldok ang nilalaman ng patotoo ni Juan sa natural na Filipino.
- source_word: Τεθέαμαι
  choice: Nakita ko
  rationale: Ipinahahayag nito ang personal at aktuwal na pagkakita ni Juan. Bagaman perpekto ang anyong Griyego at may nananatiling kabuluhan ang nakita, ang “Nakita ko” ang pinakanatural na patotoong Filipino sa kontekstong ito.
- source_word: τὸ πνεῦμα
  choice: ang Espiritu
  rationale: Tinutukoy ng konteksto ang Espiritu Santo; sapat ang “Espiritu” at hindi na kailangang idagdag ang salitang “Santo,” na wala sa talatang ito.
- source_word: καταβαῖνον
  choice: bumababa
  rationale: Natural na kasalukuyang anyong Filipino na naglalarawan sa kilos na nasaksihan ni Juan.
- source_word: ὡς περιστερὰν
  choice: na gaya ng isang kalapati
  rationale: Pinananatili ang paghahambing na ipinahihiwatig ng ὡς nang hindi sinasabing literal na naging kalapati ang Espiritu.
- source_word: ἐξ οὐρανοῦ
  choice: mula sa langit
  rationale: Ang “mula sa langit” ay natural na Filipino at malinaw na naghahayag ng pinagmulan ng pagbaba; saklaw nito ang puwersa ng ἐξ sa kontekstong ito.
- source_word: ἔμεινεν
  choice: nanatili
  rationale: Pinananatili nito ang tematikong kahulugan ng μένω sa Ebanghelyo ni Juan at mas angkop kaysa sa mas pansamantalang “tumigil” o “namalagi.”
- source_word: ἐπ’ αὐτόν
  choice: sa kanya
  rationale: Natural na Filipino para sa pananatili ng Espiritu kay Jesus; ang “sa ibabaw niya” ay maaaring magpahiwatig ng pisikal na lokasyong higit sa sinasabi ng konteksto.
theological_decisions:
- issue: Pagkakakilanlan ng τὸ πνεῦμα
  choice: “ang Espiritu,” na tumutukoy sa Espiritu Santo
  alternative: “ang espiritu” bilang pangkalahatan o di-tiyak na espiritu
  rationale: Nililinaw ng kasunod na talata at ng tagpo ng bautismo na ang banal na Espiritu ang tinutukoy, ngunit hindi idinaragdag sa pangunahing teksto ang salitang “Santo,” na wala rito.
- issue: Puwersa ng ὡς περιστερὰν
  choice: 'paghahambing: “gaya ng isang kalapati”'
  alternative: “bilang isang kalapati,” na maaaring unawaing literal na anyo o pagkakakilanlan
  rationale: Karaniwang naghahayag ng pagkakatulad ang ὡς. Pinananatili ng salin ang larawan at ang hindi tiyak na saklaw nito nang hindi ipinapasiya kung eksaktong aling katangian ng kalapati ang tinutukoy.
- issue: Panghalip na tumutukoy sa Espiritu
  choice: “ito”
  alternative: “siya”
  rationale: Walang kasariang pambalarila ang panghalip sa Filipino. Ang “ito” ay malinaw na bumabalik sa “Espiritu” at hindi nagdaragdag ng panghalip na panlalaking hindi nakasaad sa Griyego; hindi nito itinatanggi ang personal na pagkakakilanlan ng Espiritu.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang tuwirang sipi pagkatapos ng tutuldok upang maiwasan ang di-likas na “na sinasabi.” Pinanatili ang salitang “nanatili” dahil mahalaga ang μένω bilang paulit-ulit na tema sa Juan. Isang talababa lamang ang inilagay upang ipaliwanag ang tunay na kalabuan ng paghahambing; hindi kailangan ng talababa sa “mula sa langit,” sapagkat ito ang natural at sapat na katumbas ng ἐξ οὐρανοῦ.
