- from: 'At nagpatotoo si Juan: “Nakita ko ang Espiritu na bumababa mula sa langit na gaya ng isang kalapati[a], at nanatili ito sa kanya.”'
  to: 'At nagpatotoo si Juan: “Nakita ko ang Espiritu na bumababa mula sa langit, gaya ng isang kalapati[a], at nanatili ito sa ibabaw niya.”'
  rationale: Binago ang pangwakas na parirala upang maisalin ang malinaw na spatial na puwersa ng ἐπ’ αὐτόν bilang “sa ibabaw niya.” Inayos ang pagkakalagay ng pariralang paghahambing upang malinaw na ito ay tumutukoy sa pagbaba ng Espiritu. Napanatili ang lahat ng iba pang kahulugan at ang umiiral na talababa.
