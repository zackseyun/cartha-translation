review_pass:
  verdict: revise
  source_fidelity: Tumpak sa kabuuan ang patotoo ni Juan, ang perpektong 'Nakita ko,' ang Espiritu na bumababa, ang paghahambing sa kalapati, at ang pinagmulan mula sa langit. Gayunman, ang ἐπ’ αὐτόν ay mas tiyak na nagsasaad na ang Espiritu ay nanatili 'sa ibabaw niya,' hindi lamang 'sa kanya.'
  naturalness: Makabago at marangal ang wika. Ang bahagyang pagbabago sa ayos ng parirala ay nag-aalis din ng posibleng kalabuan kung ang 'na gaya ng isang kalapati' ay kumakabit sa 'langit' o sa kilos ng pagbaba.
  terminology: Ang 'nagpatotoo,' 'Espiritu,' at 'nanatili' ay angkop at nagpapanatili ng saksi at μένω na bokabularyo ni Juan. Ang 'ito' ay katanggap-tanggap na panghalip sa Filipino at hindi nagpapataw ng kasarian.
  issues:
  - severity: medium
    issue: Ang “nanatili ito sa kanya” ay hindi sapat na naipahahayag ang ἐπ’ αὐτόν.
    rationale: Ang ἐπί sa pariralang ito ay nagsasaad ng pananatili sa ibabaw ni Jesus. Ang “sa kanya” ay maaaring mangahulugang kasama niya o nasa kanya at nawawala ang spatial na larawan ng pinagmulan.
  revised_text: 'At nagpatotoo si Juan: “Nakita ko ang Espiritu na bumababa mula sa langit, gaya ng isang kalapati[a], at nanatili ito sa ibabaw niya.”'
