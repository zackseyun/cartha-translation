  source_fidelity: Tumpak ang pagsasalin sa SBLGNT. Ang “Sapagkat” ay angkop sa nagpapaliwanag na ὅτι; ang “ang kautusan ay ibinigay” ay pinananatili ang passive ng ἐδόθη; at ang magkaparis na “sa pamamagitan ni Moises / sa pamamagitan ni Jesus na Mesiyas” ay maayos na nagsasalin ng διά na may genitive. Ang “dumating” para sa ἐγένετο ay natural at hindi ipinipilit ang isang mas matibay na teolohikal na pagbasa kaysa sa ipinahihiwatig ng teksto.
