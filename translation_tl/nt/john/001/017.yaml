id: JHN.1.17
reference: John 1:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτι ὁ νόμος διὰ Μωϋσέως ἐδόθη, ἡ χάρις καὶ ἡ ἀλήθεια διὰ Ἰησοῦ Χριστοῦ ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/017.yaml
  text: For the law was given through Moses[a]; grace and truth came through Jesus the Messiah.
translation:
  language: tl
  text: Sapagkat ang kautusan ay ibinigay sa pamamagitan ni Moises; ang biyaya at ang katotohanan ay dumating sa pamamagitan ni Jesus na Mesiyas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ayon sa tradisyon, “Jesucristo.”
    reason: Ibinibigay ang pamilyar na tradisyonal na anyo bilang alternatibo sa pagsasalin sa Χριστός bilang “Mesiyas.”
lexical_decisions:
- source_word: ὅτι
  choice: Sapagkat
  rationale: Nagbibigay ito ng paliwanag o batayan para sa naunang pahayag sa Juan 1:16, kaya pinananatili ang ugnayang sanhi at paliwanag.
- source_word: ὁ νόμος
  choice: ang kautusan
  rationale: Tumutukoy ito sa kautusang ibinigay kaugnay ni Moises; ang “kautusan” ay likas at malinaw sa modernong Filipino.
- source_word: διὰ Μωϋσέως
  choice: sa pamamagitan ni Moises
  rationale: Pinananatili nito ang diwa ng tagapamagitan o ahensiya ng διά na may genitive at ang pagkakapantay ng dalawang sugnay.
- source_word: ἐδόθη
  choice: ibinigay
  rationale: Tuwirang pinananatili ang aorist passive nang hindi tinutukoy nang tahasan ang hindi binanggit na tagapagbigay.
- source_word: ἡ χάρις
  choice: ang biyaya
  rationale: Ang “biyaya” ang malinaw at nakaugaliang salin para sa banal na χάρις at angkop sa konteksto ni Juan.
- source_word: ἡ ἀλήθεια
  choice: ang katotohanan
  rationale: Pinananatili nito ang karaniwang diwa ng ἀλήθεια sa Juan at ang kaugnayan sa Juan 1:14.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: sa pamamagitan ni Jesus na Mesiyas
  rationale: Ang “sa pamamagitan” ay nagpapanatili ng mediatoryong diwa ng διά, samantalang isinasalin ang Χριστός bilang titulong “Mesiyas” at pinananatili ang Jesus bilang pangalan.
- source_word: ἐγένετο
  choice: dumating
  rationale: Likas itong Filipino para sa pagdating o makasaysayang pagpapakita ng biyaya at katotohanan, at pinananatili ang pagkakaiba nito sa “ibinigay” nang hindi ipinahihiwatig na dati ay walang biyaya o katotohanan.
theological_decisions:
- issue: Pagpapahayag ng Χριστοῦ sa Ἰησοῦ Χριστοῦ
  choice: Jesus na Mesiyas
  alternative: Jesucristo
  rationale: Isinasalin ang Χριστός bilang titulong “Mesiyas” upang maipahayag ang kahulugan nito, sa halip na ituring lamang itong bahagi ng pangalan. Inilalagay sa talababa ang tradisyonal na anyo.
- issue: Ugnayan ng kautusan at ng biyaya at katotohanan
  choice: Pinanatili ang magkatabing sugnay nang walang idinagdag na “ngunit”
  alternative: ngunit ang biyaya at katotohanan
  rationale: Walang ἀλλά o δέ sa Griyego. Ang semicolon ay nagpapakita ng paghahambing nang hindi pinatitindi ito bilang tahasang pagsalungat.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Pinanatili ang balanseng paralelismo ng dalawang sugnay at iniwasan ang pagdaragdag ng tahasang pagsalungat na wala sa Griyego.
