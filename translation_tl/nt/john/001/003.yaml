- from: Ang lahat ng bagay ay nalikha sa pamamagitan niya, at kung hiwalay sa kanya ay wala ni isang bagay na nalikha sa lahat ng nalikha.[a]
  to: Ang lahat ng bagay ay nalikha sa pamamagitan niya, at kung wala siya, walang kahit isang bagay ang nalikha.[a]
  rationale: Pinalitan ang hindi likas na “kung hiwalay sa kanya” ng “kung wala siya,” ang karaniwang malinaw na Tagalog para sa χωρίς αὐτοῦ sa mariing negatibong sugnay. Inalis ang malabong “sa lahat ng nalikha.” Pinananatili ng “walang kahit isang bagay ang nalikha” ang ganap na saklaw ng οὐδὲ ἕν at ang kahulugang pinagtitibay ng ὃ γέγονεν, habang ang talababa ay patuloy na nag-iingat sa tunay na alternatibong pagkakabit sa talata 4.
