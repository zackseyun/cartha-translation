  text: All things came into being through him[a], and apart from him not even one thing came into being that has come into being.
translation:
  language: tl
  text: Ang lahat ng bagay ay nalikha sa pamamagitan niya, at kung wala siya, walang kahit isang bagay ang nalikha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, kung sisimulan dito ang talata 4: “Ang nalikha sa kanya ay buhay.”'
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: Ang lahat ng bagay
  rationale: 'Pinananatili ang malawak at pangkalahatang saklaw ng neuter plural: lahat ng umiiral na nilikha.'
- source_word: δι’ αὐτοῦ
  choice: sa pamamagitan niya
  rationale: Malinaw na ipinapahayag ang agency o instrumentality ng διά na may genitive nang hindi ipinapantay sa simpleng 'niya'.
- source_word: ἐγένετο
  choice: nalikha
  rationale: Sa konteksto ng pangkalahatang pag-iral ng mga bagay, natural sa modernong Tagalog ang 'nalikha'; ipinahihiwatig nito ang pagdating sa pag-iral at hindi lamang ang paggawa o paghubog.
- source_word: χωρὶς αὐτοῦ
  choice: kung hiwalay sa kanya
  rationale: Pinananatili ang diwa ng pagkakahiwalay o kawalan ng kaugnayan sa kanyang pagkilos, at natural itong umaayon sa negatibong sugnay.
- source_word: οὐδὲ ἕν
  choice: wala ni isang bagay
  rationale: Napananatili ang mariing ganap na pagtanggi ng οὐδέ at ng neuter singular ἕν.
- source_word: ὃ γέγονεν
  choice: sa lahat ng nalikha
  rationale: Ikinakabit ang sugnay sa talata 3 ayon sa ibinigay na bantas. Ang 'nalikha' ay natural na kumakatawan sa perpektong resulta ng γέγονεν; ang pag-uulit ay nagpapanatili sa mariing saklaw ng Griyego.
theological_decisions:
- issue: Pagkakabit ng huling sugnay na ὃ γέγονεν
  choice: 'Ikinabit sa talata 3: “wala ni isang bagay na nalikha sa lahat ng nalikha.”'
  alternative: 'Simulan ang talata 4: “Ang nalikha sa kanya ay buhay.”'
  rationale: Walang orihinal na bantas ang sinaunang tradisyong manuskrito, kaya kapwa posible ang pagkakabit sa talata 3 at sa talata 4. Sinusunod ng pangunahing teksto ang bantas ng ibinigay na SBLGNT, habang itinatala sa talababa ang tunay na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nalikha” bilang likas na salin sa konteksto ng pagdating sa pag-iral, at iniwasan ang mas teknikal o arkaikong pananalita. Inilagay ang marker [a] sa dulo ng pangunahing teksto upang tukuyin ang alternatibong paghahati ng sugnay.
