id: JHN.1.45
reference: John 1:45
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εὑρίσκει Φίλιππος τὸν Ναθαναὴλ καὶ λέγει αὐτῷ· Ὃν ἔγραψεν Μωϋσῆς ἐν τῷ νόμῳ καὶ οἱ προφῆται εὑρήκαμεν, ⸀Ἰησοῦν υἱὸν τοῦ Ἰωσὴφ τὸν ἀπὸ Ναζαρέτ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/045.yaml
  text: 'Philip found Nathanael and said to him[a], “We have found him of whom Moses in the Law and also the prophets wrote: Jesus son of Joseph[b], from Nazareth.”'
translation:
  language: tl
  text: 'Natagpuan ni Felipe si Natanael at sinabi sa kanya, “Natagpuan na namin ang isa na tungkol sa kanya ay isinulat ni Moises sa Kautusan at ng mga propeta rin: si Jesus, anak ni Jose, na mula sa Nazaret.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὑρίσκει
  choice: Natagpuan
  rationale: Ang pangkasaysayang pangkasalukuyan sa Griyego ay likas na isinasalaysay sa nakaraang panahunan sa modernong Tagalog.
- source_word: λέγει
  choice: sinabi
  rationale: Isinalin sa nakaraang panahunan upang maging natural ang daloy ng salaysay, kasabay ng εὑρίσκει.
- source_word: Ὃν ἔγραψεν
  choice: ang taong isinulat tungkol sa kanya
  rationale: Pinananatili nitong tao ang tinutukoy ng panghalip at malinaw na ipinahahayag na siya ang paksa ng isinulat, nang hindi dinaragdagan ang nilalaman.
- source_word: ἐν τῷ νόμῳ
  choice: sa Kautusan
  rationale: Ang malaking titik ay nagpapakitang tumutukoy ito sa kinikilalang Kasulatang kaugnay ni Moises, hindi sa kautusan sa pangkalahatan.
- source_word: οἱ προφῆται
  choice: ang mga propeta
  rationale: Tuwirang katumbas na maaaring tumukoy sa mga propeta bilang mga sumulat at, sa konteksto, sa kanilang propetikong patotoo.
- source_word: εὑρήκαμεν
  choice: Natagpuan na namin
  rationale: Ipinahihiwatig ng “na” ang natapos na pagkakatuklas na may kasalukuyang resulta, gaya ng perpektong aspekto ng Griyego.
- source_word: υἱὸν τοῦ Ἰωσὴφ
  choice: anak ni Jose
  rationale: Pinananatili ang karaniwang panlipunang pagkakakilanlang binigkas ni Felipe nang walang idinagdag na paliwanag na kristolohikal.
- source_word: τὸν ἀπὸ Ναζαρέτ
  choice: na mula sa Nazaret
  rationale: Malinaw na inililipat ang pangunahing kahulugan ng ἀπό bilang pinagmulan o kaugnayan sa isang lugar.
- source_word: Φίλιππος / Ναθαναὴλ / Ἰησοῦν / Ἰωσὴφ / Ναζαρέτ
  choice: Felipe / Natanael / Jesus / Jose / Nazaret
  rationale: Ginamit ang nakasanayang anyo ng mga pangalang biblikal sa modernong Tagalog.
theological_decisions:
- issue: Ang katawagang “anak ni Jose” at ang kristolohiya
  choice: Pinanatili ang “si Jesus na anak ni Jose” bilang mismong pagkakakilanlang sinabi ni Felipe.
  alternative: “si Jesus, na ipinalalagay na anak ni Jose” o isang paliwanag na legal lamang ang pagiging anak
  rationale: Hindi sinasabi ng talata ang mga paliwanag na iyon. Dapat manatili ang pananaw ng nagsasalita at ang tensiyon nito sa mas malawak na salaysay nang hindi tahimik na pinagtutugma.
- issue: Saklaw ng patotoo ni Moises at ng mga propeta
  choice: Kapuwa si Moises sa Kautusan at ang mga propeta ang inihayag na sumulat tungkol sa taong natagpuan nila.
  alternative: Limitahan kay Moises ang pandiwang “sumulat” at gawing malabong dagdag lamang ang mga propeta.
  rationale: Sa kayariang Griyego, kapuwa sila ang mga saksi sa Kasulatan; pinananatili ng salin ang dalawang magkatimbang na sanggunian nang hindi tinutukoy kung aling mga sipi ang nasa isip ni Felipe.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “sinabi sa kanya” at “mula sa Nazaret” bilang natural na pananalita, habang pinanatili ang bahagyang pormal na himig ng pahayag tungkol sa Kautusan at mga propeta.
