id: JHN.1.6
reference: John 1:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἐγένετο ἄνθρωπος ἀπεσταλμένος παρὰ θεοῦ, ὄνομα αὐτῷ Ἰωάννης·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/006.yaml
  text: There was a man sent from God[a], whose name was John.
translation:
  language: tl
  text: May isang taong isinugo mula sa Diyos; ang pangalan niya ay Juan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο
  choice: May isang
  rationale: Ipinakikilala ng pandiwa ang isang bagong tauhan sa salaysay. Ang “May isang” ay likas sa Tagalog at hindi nagpapahiwatig na nilalang lamang siya noon o basta nagpakita.
- source_word: ἄνθρωπος
  choice: tao
  rationale: Tumutukoy ito sa isang indibidwal na lalaki, si Juan. Sa pariralang “isang taong,” natural at malinaw ang “tao” sa modernong Tagalog.
- source_word: ἀπεσταλμένος
  choice: isinugo
  rationale: Pinananatili ng “isinugo” ang diwang pasibo at ang layuning atas o misyon, na mas angkop dito kaysa sa payak na “ipinadala.”
- source_word: παρὰ θεοῦ
  choice: mula sa Diyos
  rationale: Ang παρά na may genitive ay pangunahing nagsasaad ng pinagmulan. Pinananatili ng “mula sa Diyos” ang diin sa pinagmulan ng pagsusugo nang hindi inililipat ang diin sa ahensiya lamang.
- source_word: ὄνομα αὐτῷ Ἰωάννης
  choice: ang pangalan niya ay Juan
  rationale: Natural nitong isinasalin ang Semitikong/Griyegong idyomang literal na “pangalan sa kaniya, Juan” at pinananatili ang buong pahayag na nagpapakilala sa pangalan.
- source_word: Ἰωάννης
  choice: Juan
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa tradisyong biblikal at sa modernong Tagalog.
theological_decisions:
- issue: Kalikasan ng misyon ni Juan
  choice: 'Inilalarawan si Juan bilang isinugo na nagmula sa Diyos: “isinugo mula sa Diyos.”'
  alternative: “Ipinadala ng Diyos”
  rationale: Ang ἀπεσταλμένος kasama ng παρὰ θεοῦ ay nagpapahiwatig ng banal na pagsusugo at pinagmulan. Pinananatili ng salin ang kahulugang ito nang hindi nagdaragdag ng tiyak na titulo o katungkulan na hindi tahasang binanggit sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “isinugo” upang ipahayag ang atas o misyon, at ang tuldok-kuwit upang panatilihin ang malapit na ugnayan ng pagpapakilala sa tao at sa kaniyang pangalan.
