  text: καὶ ἐμβλέψας τῷ Ἰησοῦ περιπατοῦντι λέγει· Ἴδε ὁ ἀμνὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/036.yaml
  text: And looking at Jesus as he was walking, he says, “Look, the Lamb of God!”
translation:
  language: tl
  text: Pinagmasdan niya si Jesus na naglalakad, at sinabi niya, “Tingnan ninyo, ang Kordero ng Diyos!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας
  choice: Tiningnan niya
  rationale: Ipinahahayag ang masinsin o nakatuong pagtingin nang natural sa modernong Tagalog.
- source_word: περιπατοῦντι
  choice: habang naglalakad ito
  rationale: Pinananatili ang kasabay na kilos at nililinaw na si Jesus ang naglalakad.
- source_word: λέγει
  choice: sinabi niya
  rationale: Natural na salaysay sa Tagalog; hindi kailangang gayahin ang makasaysayang pangkasalukuyan ng Griyego.
- source_word: Ἴδε
  choice: Tingnan ninyo
  rationale: Tuwirang panawag sa mga nakikinig upang ituon ang pansin kay Jesus.
- source_word: ὁ ἀμνὸς τοῦ θεοῦ
  choice: ang Kordero ng Diyos
  rationale: Pinananatili ang mahalagang metaporang teolohikal at ang genitibong pariralang hindi nilulutas nang higit sa sinasabi ng teksto.
theological_decisions:
- issue: Kahulugan ng genitibong τοῦ θεοῦ sa “Kordero ng Diyos”
  choice: Pinanatili ang “ng Diyos” nang walang dagdag na paliwanag.
  alternative: Korderong mula sa Diyos / Korderong handog ng Diyos
  rationale: May saklaw ng kahulugan ang genitibo; ang literal at likas na parirala ay nagpapanatili ng teolohikal na lalim at hindi nagpapasya sa isang interpretasyon lamang.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “ito” upang maiwasan ang kalituhan sa magkasunod na panghalip, at ang “Kordero” bilang nakaugaliang terminong biblikal.
