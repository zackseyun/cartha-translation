  text: εἶπαν οὖν αὐτῷ· Τίς εἶ; ἵνα ἀπόκρισιν δῶμεν τοῖς πέμψασιν ἡμᾶς· τί λέγεις περὶ σεαυτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/022.yaml
  text: So they said to him, “Who are you, so that we may give an answer to those who sent us? What do you say about yourself?”
translation:
  language: tl
  text: Kaya sinabi nila sa kanya, “Sino ka, upang makapagbigay kami ng sagot sa mga nagsugo sa amin? Ano ang sinasabi mo tungkol sa iyong sarili?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Ipinahihiwatig ang lohikal na pagpapatuloy mula sa naunang sagutan; natural sa makabagong Tagalog ang “Kaya.”
- source_word: εἶπαν ... αὐτῷ
  choice: sinabi nila sa kanya
  rationale: Payak at di-mapagpalagay na paraan ng pagpapakilala sa tuwirang pananalita.
- source_word: Τίς εἶ;
  choice: Sino ka?
  rationale: Tuwirang tanong tungkol sa pagkakakilanlan, na pinananatili ang ikli ng Griyego.
- source_word: ἵνα ἀπόκρισιν δῶμεν
  choice: upang may maisagot kami
  rationale: Pinananatili ang layuning ipinapahayag ng ἵνα at likas sa Tagalog ang idyomang “may maisagot.”
- source_word: τοῖς πέμψασιν ἡμᾶς
  choice: sa mga nagsugo sa amin
  rationale: Tumpak na inilalarawan ang substantibong participle at ang awtorisadong pagpapadala sa kontekstong ito.
- source_word: τί λέγεις περὶ σεαυτοῦ;
  choice: Ano ang masasabi mo tungkol sa iyong sarili?
  rationale: Natural na tanong sa Tagalog tungkol sa sariling patotoo o paglalarawan ng kausap, nang hindi dinaragdagan ang kahulugan.
theological_decisions: []
translation_notes:
  register: Makabagong, malinaw, at marangal na Filipino. Ginamit ang “nagsugo” sa halip na “nagpadala” upang angkop na ipahayag ang pagpapadala ng mga kinatawan, ngunit walang idinagdag na denominasyonal o teolohikal na pagpapakahulugan.
