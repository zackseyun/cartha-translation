translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignified, at angkop sa salaysay. Ginamit ang “iyan” upang maging natural ang utos habang ipinapaliwanag sa talababa na ipinahihiwatig lamang sa Griyego ang layon.
