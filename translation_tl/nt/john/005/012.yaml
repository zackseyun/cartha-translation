  text: ἠρώτησαν ⸀οὖν αὐτόν· Τίς ἐστιν ὁ ἄνθρωπος ὁ εἰπών σοι· ⸀Ἆρον καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/012.yaml
  text: So they asked him[a], “Who is the man who said to you, ‘Pick it up and walk’?”
translation:
  language: tl
  text: Kaya tinanong nila siya, “Sino ang taong nagsabi sa iyo, ‘Buhatin mo iyan at lumakad ka’?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “Buhatin mo at lumakad ka.” Hindi tahasang binanggit ang bagay na bubuhatin; mula sa naunang konteksto, ito ang higaan ng lalaki.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρώτησαν
  choice: tinanong nila
  rationale: Likas at malinaw na salin ng aorist active indicative; hindi nito dinaragdagan ang posibleng tono ng pag-uusisa o pag-uusig.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinapakita ang lohikal at pasalaysay na kaugnayan sa naunang talata sa natural na modernong Tagalog.
- source_word: αὐτόν
  choice: siya
  rationale: Tumutukoy sa lalaking pinagaling na siyang tuwirang layon ng pandiwa.
- source_word: Τίς ἐστιν ὁ ἄνθρωπος
  choice: Sino ang taong
  rationale: Tuwiran at natural na tanong tungkol sa isang tiyak na lalaki.
- source_word: ὁ εἰπών σοι
  choice: nagsabi sa iyo
  rationale: Pinananatili ang attributive participle bilang sugnay na nagpapakilala sa taong tinutukoy.
- source_word: Ἆρον
  choice: Buhatin mo iyan
  rationale: Ang αἴρω ay utos na buhatin o iangat ang bagay. Walang tahasang layon sa talata, kaya ginamit ang panghalip na “iyan” na tumutukoy sa higaan sa naunang konteksto.
- source_word: καὶ περιπάτει
  choice: at lumakad ka
  rationale: Natural na salin ng present imperative nang hindi labis na binibigyang-kahulugan ang aspekto bilang patuloy na paglakad.
