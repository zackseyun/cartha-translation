  text: καὶ διὰ τοῦτο ἐδίωκον ⸂οἱ Ἰουδαῖοι τὸν Ἰησοῦν⸃ ὅτι ταῦτα ἐποίει ἐν σαββάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/016.yaml
  text: And because of this the Jews were persecuting Jesus[a], because he was doing these things on the Sabbath.
translation:
  language: tl
  text: At dahil dito, patuloy na inuusig ng mga Judio si Jesus[a], sapagkat ginagawa niya ang mga bagay na ito sa Sabbath.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga taga-Judea,” o, ayon sa konteksto, “mga pinunong Judio.” Sa Ebanghelyo ni Juan, ang katawagang ito ay madalas tumukoy sa isang partikular na pangkat na sumasalungat kay Jesus, hindi sa lahat ng Judio nang walang pagtatangi.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: dahil dito
  rationale: Tumutukoy ang parirala sa naunang pangyayari bilang dahilan; tuwiran at likas itong nagpapahayag ng sanhi sa Filipino.
- source_word: ἐδίωκον
  choice: patuloy na inuusig
  rationale: Ipinahihiwatig ng imperfect ang nagpapatuloy o paulit-ulit na pag-uusig. Pinananatili nito ang matinding pagsalungat nang hindi pa ipinapasok ang tahasang layuning pumatay na mababasa sa talata 18.
- source_word: οἱ Ἰουδαῖοι
  choice: ang mga Judio
  rationale: Ito ang tuwirang panumbas sa pangmaramihang katawagang etnorelihiyoso sa Griyego. Hindi ito pinaliit sa 'mga pinunong Judio' sa pangunahing teksto, ngunit nililinaw sa talababa ang maaaring mas tiyak na saklaw nito sa konteksto ni Juan.
- source_word: ταῦτα
  choice: ang mga bagay na ito
  rationale: Pinananatili ang pangmaramihang pagtukoy sa mga gawaing kaugnay ng pangyayaring katatapos lamang isalaysay.
- source_word: ἐποίει
  choice: ginagawa niya
  rationale: Likas na ipinapahayag ng anyong ito sa Filipino ang nagpapatuloy o nakagawiang kilos na ipinahihiwatig ng imperfect.
- source_word: ἐν σαββάτῳ
  choice: sa araw ng Sabbath
  rationale: Malinaw at natural sa modernong Filipino bilang pagtukoy sa panahong itinakda para sa Sabbath.
theological_decisions:
- issue: Ang tinutukoy ng οἱ Ἰουδαῖοι sa Ebanghelyo ni Juan
  choice: mga Judio
  alternative: mga taga-Judea; o, ayon sa konteksto, mga pinunong Judio
  rationale: Pinananatili ng pangunahing teksto ang tuwirang leksikal na kahulugan at hindi agad nilulutas ang saklaw ng katawagan. Ipinapaliwanag ng talababa na sa kontekstong ito maaari itong tumukoy sa isang tiyak na pangkat na sumasalungat kay Jesus, hindi sa lahat ng Judio nang walang pagtatangi.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “patuloy na inuusig” upang malinaw na maipakita ang aspektong imperfect, at pinanatili ang “mga Judio” sa teksto kalakip ang kinakailangang paglilinaw sa talababa.
