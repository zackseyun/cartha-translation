id: JHN.5.14
reference: John 5:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: μετὰ ταῦτα εὑρίσκει αὐτὸν ὁ Ἰησοῦς ἐν τῷ ἱερῷ καὶ εἶπεν αὐτῷ· Ἴδε ὑγιὴς γέγονας· μηκέτι ἁμάρτανε, ἵνα μὴ χεῖρόν ⸂σοί τι⸃ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/014.yaml
  text: After these things Jesus found him in the temple and said to him[a], “See, you have become well. Sin no more[c][b], so that something worse may not happen to you.”
translation:
  language: tl
  text: Pagkatapos nito[a], natagpuan siya ni Jesus sa templo at sinabi sa kanya, “Tingnan mo, gumaling ka na.[b] Huwag ka nang magkasala, upang walang mas masamang mangyari sa iyo.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Pagkatapos ng mga bagay na ito.”'
    reason: lexical_alternative
  - marker: b
    text: Ang Griyego ay may diing “naging malusog ka na,” na tumutukoy sa kasalukuyan niyang kalagayan bilang bunga ng naganap na paggaling.
    reason: lexical_alternative
  - marker: c
    text: Hindi tahasang sinasabi ng babala kung ang dati niyang karamdaman ay dulot ng isang partikular na kasalanan, ni kung ang “mas masama” ay paghihirap sa buhay na ito, huling paghatol, o kapwa.
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: Pagkatapos nito
  rationale: Likas itong panandang pasalaysay sa makabagong Tagalog. Nasa talababa ang mas literal na anyong maramihan ng Griyego.
- source_word: εὑρίσκει
  choice: natagpuan
  rationale: Bagaman historical present ang Griyego, mas natural sa salaysay na Tagalog ang aspektong naganap.
- source_word: ἐν τῷ ἱερῷ
  choice: sa templo
  rationale: Ang ἱερόν ay tumutukoy sa kabuuang lugar o bakuran ng templo, hindi lamang sa panloob na santuwaryo; sapat at hindi labis na mapagpakahulugan ang “templo.”
- source_word: Ἴδε
  choice: Tingnan mo
  rationale: Pinananatili nito ang panawag-pansin ng utos nang hindi gumagamit ng makaluma o sobrang maringal na pananalita.
- source_word: ὑγιὴς γέγονας
  choice: gumaling ka na
  rationale: Natural na ipinahahayag sa Tagalog ang pagbabagong naganap at ang nananatiling kalagayan ng lalaki; tinutumbasan ng “na” ang resultang diin ng perfect.
- source_word: μηκέτι ἁμάρτανε
  choice: Huwag ka nang magkasala
  rationale: Malinaw nitong ipinahahayag ang paghinto mula ngayon, nang hindi ipinapalagay na ang aspektong pangkasalukuyan ay tiyak na nangangahulugang tuloy-tuloy o nakaugaliang pagkakasala.
- source_word: ἵνα μὴ χεῖρόν σοί τι γένηται
  choice: upang walang mas masamang mangyari sa iyo
  rationale: Natural nitong pinagsasama ang layunin o inaasahang resulta, ang di-tiyak na “isang bagay,” at ang paghahambing na “mas masama,” habang pinananatiling bukas kung ano mismo ang tinutukoy.
theological_decisions:
- issue: Ugnayan ng kasalanan, dating karamdaman, at “mas masamang” maaaring mangyari
  choice: Tuwirang isinalin ang babala ngunit hindi sinabing ang dating karamdaman ay tiyak na parusa sa isang partikular na kasalanan, at hindi rin tinukoy ang uri ng mas masamang kahihinatnan.
  alternative: Maaaring ipakahulugan ang babala bilang pagtukoy sa panibagong paghihirap sa buhay na ito, sa huling paghatol, o sa kapwa; maaari ring ipalagay na may tuwirang kaugnayan ang dating karamdaman sa isang partikular na kasalanan.
  rationale: Ipinagbabawal ng Griyego ang patuloy na pagkakasala at nagbababala sa isang mas masamang maaaring mangyari, ngunit hindi nito tahasang nililinaw ang sanhi ng dating karamdaman o ang eksaktong kalikasan ng binabantang kahihinatnan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang karaniwang “templo,” ang natural na “gumaling ka na,” at ang tuwirang babalang “Huwag ka nang magkasala,” habang iniingatan sa talababa ang mga mahalagang leksikal at teolohikal na di-tiyak.
