base_translation:
  language: en
  yaml_path: translation/nt/john/005/013.yaml
  text: But the man who had been healed did not know who he was[a], for Jesus had withdrawn, since there was a crowd in the place.
translation:
  language: tl
  text: Ngunit hindi alam ng lalaking pinagaling kung sino siya, sapagkat nakaalis si Jesus nang hindi napapansin[a] habang may maraming tao sa lugar na iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “palihim na nakaalis” o “nakalusot.” Ipinahihiwatig ng pandiwang Griyego na umalis si Jesus nang hindi napapansin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰαθεὶς
  choice: lalaking pinagaling
  rationale: Ang aorist passive participle na may artikulo ay ginagamit bilang pangngalan. Pinananatili ng “pinagaling” ang diwang pasibo, at likas na ipinahihiwatig ng panlalaking anyo ang “lalaki.”
- source_word: οὐκ ᾔδει
  choice: hindi alam
  rationale: Karaniwan at malinaw na katumbas sa modernong Tagalog, na angkop sa kaalamang wala sa taong pinagaling.
- source_word: τίς ἐστιν
  choice: kung sino siya
  rationale: Likas na di-tuwirang tanong sa Tagalog at pinananatili ang personal na pagtukoy kay Jesus.
- source_word: ἐξένευσεν
  choice: palihim na nakaalis
  rationale: Ipinahahayag nito ang pag-alis ni Jesus nang hindi napapansin, habang iniiwasang gawing tiyak kung siya ay umurong, lumusot, o sadyang nagtago.
- source_word: ὄχλου ὄντος
  choice: dahil maraming tao
  rationale: Likas na inilalahad ang genitive absolute bilang dahilan, gaya ng ipinahihiwatig ng konteksto.
- source_word: ἐν τῷ τόπῳ
  choice: sa lugar na iyon
  rationale: Pinananatili ang tahasang lokatibong parirala sa malinaw at natural na Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “palihim na nakaalis” upang maipakita ang di-halatang pag-alis na ipinahihiwatig ng ἐξένευσεν, nang hindi nagpapasok ng dagdag na motibo.
