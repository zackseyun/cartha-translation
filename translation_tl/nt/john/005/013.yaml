  source_fidelity: 'Ang pangunahing diwa ay tapat sa Griyego: ang lalaking pinagaling ay hindi nakakilala kay Jesus, na nakaaalis habang may karamihan sa lugar. Gayunman, ang “palihim” ay maaaring magpahiwatig ng sinadyang pagtatago; mas tuwiran at masaklaw ang “nang hindi napapansin.” Ang genitive absolute na ὄχλου ὄντος ay maaaring magpahiwatig ng kalagayang kasabay at/o dahilan, kaya “habang” ay hindi labis na nagsasara ng ugnayan.'
  naturalness: Likas ang karamihan ng pangungusap, ngunit ang magkasunod na “sapagkat ... dahil” ay mabigat sa modernong Tagalog. Mas maayos ang isang pangunahing pangatnig at isang pariralang nagsasaad ng kasabay na kalagayan.
  terminology: Ang “lalaking pinagaling,” “Jesus,” at “lugar na iyon” ay malinaw at angkop sa marangal na modernong rehistro. Inilipat ang talababa sa pariralang isinasalin nito, hindi sa pangalang “Jesus.”
