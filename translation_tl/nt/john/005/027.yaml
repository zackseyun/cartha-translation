  text: καὶ ἐξουσίαν ἔδωκεν ⸀αὐτῷ κρίσιν ποιεῖν, ὅτι υἱὸς ἀνθρώπου ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/027.yaml
  text: And he gave him authority to execute judgment[a], because he is the Son of Man.
translation:
  language: tl
  text: At binigyan niya siya ng awtoridad na maglapat ng hatol, sapagkat siya ang Anak ng Tao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sapagkat siya ay isang anak ng tao,” ibig sabihin, sapagkat nakikibahagi siya sa kalikasang pantao. Pinananatili ng pangunahing teksto ang malamang na paggamit nito bilang titulo sa Ebanghelyo ni Juan.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξουσίαν
  choice: awtoridad
  rationale: Tumutukoy ito sa ipinagkaloob na karapatan at kapangyarihang mamahala o humatol, hindi lamang sa lakas.
- source_word: ἔδωκεν
  choice: binigyan
  rationale: Tuwirang ipinapahayag ng aorist ng δίδωμι ang pagbibigay; natural sa Tagalog ang konstruksiyong “binigyan niya siya.”
- source_word: αὐτῷ
  choice: siya
  rationale: Ang panghalip na datibo ay tumutukoy sa Anak at likas na ipinapahayag bilang layon sa “binigyan.”
- source_word: κρίσιν ποιεῖν
  choice: na maglapat ng hatol
  rationale: Ang idyoma ay tumutukoy sa pagsasagawa ng hudisyal na paghatol. Pinananatili ng “maglapat ng hatol” ang diwang may awtoridad at aktuwal na pagpapatupad, nang hindi ipinahihiwatig ang parusang kamatayan na maaaring ikabit sa “magpatupad ng hatol.”
- source_word: ὅτι
  choice: sapagkat
  rationale: Ipinakikilala rito ng ὅτι ang dahilan ng pagkakaloob ng awtoridad.
- source_word: υἱὸς ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Bagaman walang artikulo sa Griyego, sa konteksto ng Juan ay malamang na ito ang kilalang titulo ni Jesus, na may kaugnayan sa Daniel 7. Ang malaking titik at tiyak na anyo ay nagpapanatili sa gamit bilang titulo.
- source_word: ἐστίν
  choice: siya ang
  rationale: Ang payak na kopulang “ay” ay natural na isinasama sa hulma ng Tagalog na “siya ang Anak ng Tao.”
theological_decisions:
- issue: Kung ang υἱὸς ἀνθρώπου ay titulong kristolohikal o pangkalahatang pahayag tungkol sa pagiging tao
  choice: Isinalin bilang titulong “ang Anak ng Tao.”
  alternative: “isang anak ng tao,” ibig sabihin, isang taong kabahagi ng kalikasang pantao
  rationale: Sa Ebanghelyo ni Juan, ang parirala ay kinikilalang katawagan kay Jesus at malamang na umaalingawngaw sa Daniel 7, lalo na sa konteksto ng awtoridad sa paghatol. Gayunman, hindi ganap na isinasara ng anyong Griyego ang pangkalahatang diwa ng pagiging tao, kaya inilalahad iyon sa talababa.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang pamilyar na terminong “awtoridad” at ang malinaw na pariralang “maglapat ng hatol.” Ang mga panghalip ay nananatiling gaya ng Griyego at umaasa sa konteksto ng naunang talata para sa kanilang tinutukoy.
