  text: In these lay a multitude of the sick[a], blind, lame, and paralyzed.
translation:
  language: tl
  text: Sa mga ito ay nakahiga ang napakaraming maysakit—mga bulag, pilay, at mga may tuyot na biyas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga tuyot.” Malamang na tumutukoy ito sa mga may tuyot o lantang biyas; maaari rin itong isaling “mga paralisado.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταύταις
  choice: Sa mga ito
  rationale: Pinananatili ang pambabaeng pangmaramihang panturo at ang pagtukoy nito sa mga estrukturang binanggit sa naunang talata, nang hindi nagdaragdag ng pangngalang wala sa tekstong Griyego.
- source_word: κατέκειτο
  choice: ay nakahiga
  rationale: Ipinahahayag ang di-ganap na aspekto ng pandiwa at ang kalagayan ng mga taong nakahimlay roon; natural ito sa salaysay sa Tagalog.
- source_word: πλῆθος
  choice: ang napakaraming
  rationale: Natural na katumbas sa Tagalog ng isang malaking bilang o karamihan, habang iniiwasan ang salitang 'pulutong,' na maaaring magpahiwatig ng organisado o gumagalaw na pangkat.
- source_word: τῶν ἀσθενούντων
  choice: maysakit
  rationale: Sa kontekstong ito, tumutukoy ang pandiwaring Griyego sa mga may karamdaman o kapansanan sa katawan; malinaw at pangkaraniwan ang 'maysakit.'
- source_word: τυφλῶν
  choice: mga bulag
  rationale: Tuwirang katumbas ng kategoryang pisikal na binanggit sa talaan.
- source_word: χωλῶν
  choice: pilay
  rationale: Karaniwang tumutukoy sa hirap o kapansanan sa paglakad; maikli, malinaw, at hindi labis ang pagpapakahulugan.
- source_word: ξηρῶν
  choice: mga tuyot ang mga paa o kamay
  rationale: Pinananatili ang literal na larawan ng ξηρός na 'tuyo' o 'natuyo,' habang nililinaw ang malamang na gamit nito para sa mga biyas na nangayayat o hindi nagagamit. Hindi ito tahasang ginawang 'paralisado,' sapagkat mas tiyak iyon kaysa sa salitang Griyego.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang gitling upang ipakilala ang mga uri ng maysakit. Ang mas literal na larawan ng ξηρῶν ay pinanatili sa teksto at ipinaliwanag sa talababa upang hindi alisin ang tunay na lawak ng kahulugan.
