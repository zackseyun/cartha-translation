id: JHN.5.1
reference: John 5:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ⸀ἦν ἑορτὴ τῶν Ἰουδαίων, καὶ ⸀ἀνέβη Ἰησοῦς εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/001.yaml
  text: After these things[a], there was a feast of the Jews[b], and Jesus went up to Jerusalem.
translation:
  language: tl
  text: Pagkatapos ng mga pangyayaring ito, may kapistahan[a] ang mga Judio[b], at umakyat si Jesus sa Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “pista.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mga Judio” dito ay tumutukoy sa bayang Judio kaugnay ng isa sa kanilang mga kapistahan. Sa ibang konteksto sa Juan, maaari ring mangahulugang “mga taga-Judea” ang salitang Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Pagkatapos ng mga pangyayaring ito
  rationale: Pinananatili nito ang pangmaramihang ταῦτα habang natural na ipinahihiwatig na mga pangyayari sa salaysay ang tinutukoy.
- source_word: ἦν
  choice: may
  rationale: Ang eksistensiyal na “may” ang natural na paraan sa Tagalog upang ipakilala ang kapistahang nagaganap.
- source_word: ἑορτὴ
  choice: kapistahan
  rationale: Tumutukoy ito sa isang panrelihiyong pagdiriwang; marangal at malinaw ang “kapistahan” sa modernong Tagalog.
- source_word: τῶν Ἰουδαίων
  choice: ang mga Judio
  rationale: Sa pariralang “may kapistahan ang mga Judio,” natural na ipinakikita ang kapistahang ipinagdiriwang ng bayang Judio. Hindi pangunahing panrehiyong pagkakakilanlan ang diwa rito.
- source_word: ἀνέβη
  choice: umakyat
  rationale: Pinananatili nito ang ideya ng pag-akyat patungong Jerusalem at ang karaniwang pananalita tungkol sa paglalakbay roon.
- source_word: Ἱεροσόλυμα
  choice: Jerusalem
  rationale: Ito ang pamantayang anyo ng pangalan ng lungsod sa Filipino.
theological_decisions:
- issue: Saklaw ng Ἰουδαίων sa paggamit ni Juan
  choice: mga Judio
  alternative: mga taga-Judea
  rationale: Dito, inilalarawan ng salita kung kaninong kapistahan o pagdiriwang ito, kaya tumutukoy ito sa bayang Judio sa kabuuan at hindi lamang sa mga naninirahan sa Judea.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kapistahan” para sa panrelihiyong pagdiriwang at “umakyat” upang mapanatili ang heograpikal at tradisyonal na diwa ng paglalakbay patungong Jerusalem.
