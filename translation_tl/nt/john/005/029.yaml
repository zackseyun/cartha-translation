  yaml_path: translation/nt/john/005/029.yaml
  text: and will come out—those who have done good to the resurrection of life[a], but those who have done evil to the resurrection of judgment.
translation:
  language: tl
  text: at lalabas sila—ang mga gumawa ng mabuti ay sa pagkabuhay na muli na hahantong sa buhay, ngunit ang mga gumawa ng masama ay sa pagkabuhay na muli na hahantong sa paghatol.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pagkabuhay na muli na hahantong sa kaparusahan.” Ang literal na sinasabi ng Griyego ay “paghatol,” na mas malawak ang kahulugan; ang “kaparusahan” ay isang mas makitid na pagpapakahulugan na makikita sa ilang salin.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπορεύσονται
  choice: lalabas
  rationale: Sa konteksto ng paglabas ng mga patay mula sa mga libingan (tal. 28–29), ang “lalabas” ang pinakanatural at tuwirang salin.
- source_word: τὰ ἀγαθὰ ποιήσαντες
  choice: ang mga gumawa ng mabuti
  rationale: Ang pang-uri na may pantukoy ay ginagamit bilang layon ng participle; natural na ipinapahayag ito sa Tagalog bilang “gumawa ng mabuti.”
- source_word: ἀνάστασιν ζωῆς
  choice: pagkabuhay na muli para sa buhay
  rationale: Ipinapakita ng “para sa buhay” ang kaugnayan ng pagkabuhay na muli sa buhay bilang kalalabasan, habang pinananatili ang paralelismo ng dalawang parirala.
- source_word: τὰ φαῦλα πράξαντες
  choice: ang mga gumawa ng masama
  rationale: Sa konteksto ng paghatol, ang φαῦλα ay moral na masama. Ang “gumawa ng masama” ay malinaw at natural; hindi nito labis na ipinipilit na ang πράσσω ay tumutukoy sa nakaugaliang pagsasagawa.
- source_word: ἀνάστασιν κρίσεως
  choice: pagkabuhay na muli para sa paghatol
  rationale: Ang κρίσις ay pangunahing nangangahulugang “paghatol.” Ang “para sa” ay natural sa Tagalog at malinaw na naghahayag ng kalalabasan nang hindi pinakikitid ang salita tungo sa “kaparusahan” o “hatol na parusa.”
- source_word: δὲ
  choice: ngunit
  rationale: Malinaw na minamarkahan ng “ngunit” ang paghahambing at pagsalungat sa dalawang pangkat at kanilang kahihinatnan.
theological_decisions:
- issue: Kung ang κρίσεως ay isasaling mas makitid bilang “kaparusahan” o pananatilihing mas malawak bilang “paghatol”
  choice: paghatol
  alternative: kaparusahan / hatol na parusa
  rationale: Hindi likas na hinihingi ng κρίσις ang mas makitid na kahulugang “kaparusahan.” Pinananatili ng “paghatol” ang lawak at teolohikal na tensiyon ng Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “pagkabuhay na muli” bilang karaniwang biblikal na katumbas ng ἀνάστασις at iniwasan ang mas makitid na doktrinal na pagpapakahulugan sa κρίσις.
