  naturalness: Natural ang “at lalabas sila” at “ang mga gumawa ng mabuti/masama.” Ngunit hindi likas at medyo mabigat ang magkasunod na “tungo sa ... para sa ...”. Ang “pagkabuhay na muli na hahantong sa buhay/paghatol” ay mas malinaw na modernong Tagalog habang pinananatili ang parallelismo.
  terminology: Ang “pagkabuhay na muli,” “buhay,” at “paghatol” ay angkop. Dapat panatilihin ang “paghatol,” hindi “kaparusahan,” sa pangunahing teksto, sapagkat mas malawak ang κρίσις. Ang talababa ay angkop bilang pagpapaliwanag ng mas makitid na alternatibong salin.
