  yaml_path: translation/nt/john/005/041.yaml
  text: I do not receive glory from men[b][a],
translation:
  language: tl
  text: Hindi ako tumatanggap ng kaluwalhatian mula sa mga tao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “parangal” o “papuri” sa halip na “kaluwalhatian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δόξαν
  choice: kaluwalhatian
  rationale: Pinananatili ng “kaluwalhatian” ang mahalagang ugnayang leksikal sa tema ng δόξα sa Ebanghelyo ni Juan, habang sa kontekstong ito ay maaari rin itong tumukoy sa parangal o papuri mula sa iba.
- source_word: παρὰ ἀνθρώπων
  choice: mula sa mga tao
  rationale: Ang παρά na may genitive ay nagpapahayag ng pinagmulan. Bagaman masculine plural ang ἀνθρώπων sa Griyego, karaniwan itong tumutukoy nang pangkalahatan sa mga tao; natural at tumpak sa modernong Tagalog ang “mula sa mga tao.”
- source_word: οὐ λαμβάνω
  choice: Hindi ako tumatanggap
  rationale: Tuwirang isinasalin nito ang negated present na λαμβάνω at pinananatili ang maaaring kahulugang “tumanggap” o “tanggapin,” nang hindi idinaragdag sa pangunahing teksto ang interpretasyong “hinahanap.”
theological_decisions:
- issue: Saklaw ng pahayag ni Jesus tungkol sa pagkilala ng tao
  choice: Pinanatili ang tuwirang pagtanggi na tumatanggap siya ng kaluwalhatian mula sa mga tao.
  alternative: Ipaliwanag sa teksto na hindi niya hinahanap o ibinabatay ang kanyang misyon at pagkakakilanlan sa papuri ng tao.
  rationale: Hindi tahasang ginamit sa Griyego ang pandiwang “hanapin.” Ang malapit na salin ay nagpapanatili sa tensiyon at hinahayaang linawin ng konteksto na ang usapin ay pagkilalang nagmumula sa tao sa halip na sa Diyos.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang pangkalahatang “mga tao” para sa ἀνθρώπων at pinanatili ang Johannine na terminong “kaluwalhatian.”
