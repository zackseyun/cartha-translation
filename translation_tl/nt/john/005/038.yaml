  text: καὶ τὸν λόγον αὐτοῦ οὐκ ἔχετε ⸂ἐν ὑμῖν μένοντα⸃, ὅτι ὃν ἀπέστειλεν ἐκεῖνος τούτῳ ὑμεῖς οὐ πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/038.yaml
  text: And you do not have his word abiding in you[a], because you do not believe the one whom he sent.
translation:
  language: tl
  text: At hindi ninyo taglay ang kanyang salitang nananatili sa inyo, sapagkat hindi kayo sumasampalataya sa kanyang isinugo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λόγον
  choice: salita
  rationale: Ang “salita” ay likas na tumutukoy rito sa ipinahayag na salita ng Diyos at pinananatili ang mahalagang bokabularyong ginagamit sa Juan.
- source_word: οὐκ ἔχετε ἐν ὑμῖν μένοντα
  choice: ay hindi nananatili sa inyo
  rationale: Natural sa makabagong Tagalog ang ayos na ito at naipahahayag ang patuloy na presensiyang ipinahihiwatig ng participleng μένοντα, nang hindi ginagawang hiwalay ang mga ideya ng pagkakaroon at pananatili.
- source_word: ὅτι
  choice: sapagkat
  rationale: Ipinakikilala rito ng ὅτι ang dahilan; ang “sapagkat” ay malinaw, marangal, at angkop sa ugnayang sanhi.
- source_word: ὃν ἀπέστειλεν ἐκεῖνος
  choice: sa isinugo niya
  rationale: Tumutukoy ito kay Jesus bilang isinugo ng Ama. Sapat na malinaw sa konteksto ang “niya,” habang iniiwasan ang mabigat na literal na “yaong isinugo ng isang iyon.”
- source_word: τούτῳ ὑμεῖς οὐ πιστεύετε
  choice: hindi kayo sumasampalataya sa isinugo niya
  rationale: Ang “sumasampalataya sa” ay natural na katumbas ng πιστεύω na may datibong personal na layon at pinananatili ang diin sa taong isinugo.
theological_decisions:
- issue: Ugnayan ng pananatili ng salita ng Diyos sa mga nakikinig at ng hindi nila pagsampalataya sa isinugo
  choice: Inilalahad ng talata na hindi nananatili sa kanila ang salita ng Ama, sapagkat hindi sila sumasampalataya kay Jesus na kanyang isinugo.
  alternative: Maaaring unawain ito nang mas makitid bilang hindi nila pag-iingat o pagsunod sa Kasulatan sa kanilang kalooban.
  rationale: Pinananatili ng salin ang tahasang lohikang sanhi ng Griyego ngunit hindi ito ginagawang pahayag tungkol sa isang tiyak na doktrina ng muling kapanganakan, pananatili sa pananampalataya, o panloob na pagtahan.
translation_notes:
  register: Makabago at dignidad na Filipino; tuwiran at madaling maunawaan. Ginamit ang “nanatili” na bokabularyong kaayon ng mahalagang temang Johannine ng μένω, at “sumasampalataya” upang maipahayag ang personal na pagtitiwala/paniniwala sa isinugo.
