  text: τοῦτον ἰδὼν ὁ Ἰησοῦς κατακείμενον, καὶ γνοὺς ὅτι πολὺν ἤδη χρόνον ἔχει, λέγει αὐτῷ· Θέλεις ὑγιὴς γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/006.yaml
  text: When Jesus saw this man lying there[a], and knew that he had already been there a long time, he said to him, “Do you want to become well?”
translation:
  language: tl
  text: Nang makita ni Jesus ang lalaking ito na nakahiga at alam niyang matagal na siyang ganoon,[a] sinabi niya rito, “Gusto mo bang gumaling?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “matagal na siyang naroon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτον
  choice: ang lalaking ito
  rationale: Ginagawang malinaw at natural sa Tagalog ang tiyak na lalaking tinutukoy ng demonstratibo sa konteksto.
- source_word: ἰδὼν
  choice: Nang makita
  rationale: Isinasalin ang aorist participle bilang sugnay na temporal upang natural na maipakita ang pagkakasunod ng pangyayari.
- source_word: κατακείμενον
  choice: na nakahiga
  rationale: Tuwirang inilalarawan ang kalagayan at postura ng lalaki nang hindi nagdaragdag ng sanhi o detalye.
- source_word: γνοὺς
  choice: at malaman niyang
  rationale: Ipinahahayag ang pagkaalam ni Jesus ngunit hindi tinutukoy kung paano niya nalaman iyon.
- source_word: πολὺν ἤδη χρόνον ἔχει
  choice: matagal na itong gayon
  rationale: Ang Griyego ay literal na nagsasaad na siya ay mayroon na nito sa mahabang panahon ngunit hindi tahasang pinapangalanan ang tinutukoy. Pinananatili ng “gayon” ang kontekstuwal na pagtukoy sa matagal niyang kalagayan nang hindi labis na nililinaw ito.
- source_word: λέγει αὐτῷ
  choice: sinabi niya rito
  rationale: Ginawang pangnagdaan ang historical present para sa likas na daloy ng salaysay sa Tagalog; ang “rito” ay malinaw na tumutukoy sa lalaking kalapit na nabanggit.
- source_word: Θέλεις
  choice: Gusto mo ba
  rationale: Karaniwan, tuwiran, at malinaw na pagpapahayag ng pagnanais o pagkukusa sa modernong Tagalog.
- source_word: ὑγιὴς γενέσθαι
  choice: gumaling
  rationale: Likas na ipinahahayag ng pandiwang “gumaling” ang pagpasok sa kalagayang malusog, kaya naipapaloob ang ingressive sense ng γενέσθαι at ang kahulugan ng ὑγιής.
theological_decisions:
- issue: Paraan ng pagkaalam ni Jesus sa γνοὺς
  choice: Sabihin lamang na nalaman ni Jesus, nang hindi tinutukoy ang pinagmulan ng kaalamang iyon.
  alternative: Tukuying supernatural ang pagkaalam, o sabihing nalaman niya ito sa pagmamasid o ulat ng iba.
  rationale: Hindi sinasabi ng talata kung paano nalaman ni Jesus ang tagal ng kalagayan ng lalaki; dapat panatilihin ng salin ang pananahimik ng teksto tungkol dito.
- issue: Tinutukoy na tagal sa πολὺν ἤδη χρόνον ἔχει
  choice: Iugnay sa pangkalahatang kalagayan ng lalaki sa pamamagitan ng “matagal na itong gayon.”
  alternative: Tahasang sabihing matagal na siyang naroon sa lugar, o matagal na siyang may karamdaman.
  rationale: Hindi tahasang binabanggit ng pariralang Griyego ang lugar o ang karamdaman bilang layon. Ang pangunahing salin at talababa ay nagpapanatili sa posibleng saklaw ng pahayag.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, natural, at marangal. Ginamit ang “Gusto mo bang gumaling?” bilang pangkaraniwang pananalitang malinaw sa ordinaryong mambabasa, habang iniwasan ang sobrang pormal na “Ibig mo bang maging magaling?”
