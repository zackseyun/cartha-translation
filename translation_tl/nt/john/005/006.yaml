revisions:
- from: Nang makita ni Jesus ang lalaking ito na nakahiga at malaman niyang matagal na itong gayon,[a] sinabi niya rito, “Gusto mo bang gumaling?”
  to: Nang makita ni Jesus ang lalaking ito na nakahiga at alam niyang matagal na siyang ganoon,[a] sinabi niya rito, “Gusto mo bang gumaling?”
  rationale: Pinalitan ang dalawang parirala upang maging mas likas sa modernong Tagalog at upang mas maingat na maipahayag ang neutral na pagkaalam ni Jesus. Hindi binabago ng “matagal na siyang ganoon” ang sinadyang kalabuan ng Griyego hinggil sa eksaktong tinutukoy ng tagal; pinananatili ng talababa ang alternatibong pagbasa na tumutukoy sa kanyang pananatili sa lugar.
