  naturalness: Natural, malinaw, at marangal ang modernong Filipino Tagalog. Hindi kailangan ng dagdag na layon sa “nagsugo kay Juan,” dahil nauunawaan sa konteksto na may isinugong mga tao sa kanya.
  terminology: Ang “nagpatotoo” ay angkop na katumbas ng μαρτυρέω at pinananatili ang rehistrong testimonya/saksi. Ang “katotohanan” ay wastong tumutugon sa ἀλήθεια at hindi nililimitahan ang Johannine resonance nito.
