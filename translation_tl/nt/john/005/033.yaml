id: JHN.5.33
reference: John 5:33
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὑμεῖς ἀπεστάλκατε πρὸς Ἰωάννην, καὶ μεμαρτύρηκε τῇ ἀληθείᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/033.yaml
  text: You have sent to John[a], and he has testified to the truth.
translation:
  language: tl
  text: Kayo ang nagsugo kay Juan, at nagpatotoo siya tungkol sa katotohanan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑμεῖς
  choice: Kayo ang
  rationale: Hayag ang panghalip sa Griyego kahit nakapaloob na sa pandiwa ang panauhan; ang konstruksiyong “Kayo ang” ay natural na nagpapahiwatig ng banayad na diin nang hindi ito pinalalabis.
- source_word: ἀπεστάλκατε
  choice: nagsugo
  rationale: Ang aorist ay tumutukoy sa naganap na pagsusugo sa salaysay. Mas natural sa Tagalog ang payak na aspektong perpektibo kaysa piliting gayahin ang anyong Ingles na “have sent.”
- source_word: πρὸς Ἰωάννην
  choice: kay Juan
  rationale: Ang πρός na may personal na layon ay nagpapahayag ng direksiyon patungo sa isang tao; sa Tagalog, likas itong naipahahayag sa “kay Juan.” Hindi idinagdag ang “Bautista” dahil “Juan” lamang ang nasa Griyego.
- source_word: μεμαρτύρηκε
  choice: nagpatotoo siya
  rationale: Ang perpektong anyo ay nagsasaad ng patotoong naibigay na at nananatiling mahalaga. Ang “nagpatotoo” ay malinaw at kasalukuyang gamit sa Filipino, habang naiiwan sa konteksto ang patuloy na bisa nito.
- source_word: τῇ ἀληθείᾳ
  choice: tungkol sa katotohanan
  rationale: Ang datibo kasunod ng μαρτυρέω ay maaaring mangahulugang pagpapatotoo sa o tungkol sa isang bagay. Ang “tungkol sa katotohanan” ay natural sa Tagalog at pinananatili ang tiyak na anyo at posibleng teolohikal na bigat ng “katotohanan.”
theological_decisions:
- issue: Ang gamit ni Juan sa “katotohanan”
  choice: ang katotohanan
  alternative: katotohanan
  rationale: May pantukoy ang ἀλήθεια sa Griyego. Pinananatili ng “ang katotohanan” ang gramatikal na katiyakan at posibleng mas malalim na kahulugan sa Ebanghelyo ni Juan nang hindi tinutukoy nang lampas sa sinasabi ng talata.
- issue: Ugnayan ng patotoo at katotohanan
  choice: nagpatotoo siya tungkol sa katotohanan
  alternative: pinatunayan niyang totoo ito
  rationale: Pinananatili ang wikang saksi o patotoo ng μαρτυρέω at iniiwasang gawing pahayag lamang ng pagpapatunay, na magpapaliit sa saklaw at teolohikal na alingawngaw ng salita.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “nagsugo” sa halip na “nagpadala” upang malinaw na mga sugo ang ipinadala kay Juan, hindi si Juan mismo ang ipinadala. Walang talababa dahil walang kailangang alternatibong pagbasa para maunawaan ang talata.
