id: JHN.5.24
reference: John 5:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι ὁ τὸν λόγον μου ἀκούων καὶ πιστεύων τῷ πέμψαντί με ἔχει ζωὴν αἰώνιον, καὶ εἰς κρίσιν οὐκ ἔρχεται ἀλλὰ μεταβέβηκεν ἐκ τοῦ θανάτου εἰς τὴν ζωήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/024.yaml
  text: Truly[a], truly, I say to you, whoever hears my word and believes him who sent me has eternal life, and does not come into judgment[b], but has passed from death into life.
translation:
  language: tl
  text: '“Tunay na tunay, sinasabi ko sa inyo: Ang nakikinig sa aking salita at sumasampalataya sa nagsugo sa akin ay may buhay na walang hanggan. Hindi siya haharap sa paghatol[a], kundi nakatawid na siya mula sa kamatayan tungo sa buhay.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hindi haharap sa kaparusahan.” Ang Griyegong κρίσις ay maaaring mangahulugang paghatol sa pangkalahatan o, ayon sa konteksto, isang hatol na laban sa tao.
    reason: lexical_alternative
  - marker: b
    text: 'Ang Griyegong pandiwa sa anyong perfect ay nagpapahiwatig ng natapos nang paglipat na patuloy ang bunga: “nakatawid na” mula sa kamatayan tungo sa buhay.'
    reason: verbal_aspect
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: Katotohanang-katotohanan
  rationale: Pinananatili ang mariing pag-uulit at taimtim na pormula ni Jesus sa paraang malinaw sa modernong Tagalog.
- source_word: λέγω ὑμῖν
  choice: sinasabi ko sa inyo
  rationale: Tuwirang salin na natural sa Tagalog at nagpapanatili sa kasalukuyang anyo ng pananalita.
- source_word: ὁ ... ἀκούων καὶ πιστεύων
  choice: Ang nakikinig ... at sumasampalataya
  rationale: Ipinahahayag ang pangkalahatan at patuloy na katangian ng mga participle nang hindi nagdaragdag ng kasariang wala namang kailangang idiin sa Griyego.
- source_word: τὸν λόγον μου
  choice: aking salita
  rationale: Pinananatili ang Johannine na gamit ng λόγος habang malinaw na tumutukoy sa mensahe o sinasabi ni Jesus.
- source_word: πιστεύων τῷ πέμψαντί με
  choice: sumasampalataya sa nagsugo sa akin
  rationale: Natural na Tagalog para sa paniniwala at pagtitiwala sa isang persona; hindi lamang pagtanggap na totoo ang isang pahayag.
- source_word: ἔχει ζωὴν αἰώνιον
  choice: ay may buhay na walang hanggan
  rationale: Malinaw na pinananatili ang kasalukuyang pag-aari na ipinahahayag ng ἔχει at ang kinagawiang tumpak na salin ng ζωὴ αἰώνιος.
- source_word: εἰς κρίσιν οὐκ ἔρχεται
  choice: Hindi siya haharap sa paghatol
  rationale: Natural na Tagalog na nagpapanatili sa mas malawak na kahulugan ng κρίσις kaysa tahasang tukuyin itong kaparusahan.
- source_word: μεταβέβηκεν
  choice: nakatawid na siya
  rationale: Ipinahahayag ng 'nakatawid na' ang natapos nang paglipat na may nananatiling bunga, gaya ng Griyegong perfect.
- source_word: ἐκ τοῦ θανάτου εἰς τὴν ζωήν
  choice: mula sa kamatayan tungo sa buhay
  rationale: Pinananatili ang matinding pagsalungat at direksiyon ng paglipat sa orihinal.
theological_decisions:
- issue: Kahulugan ng κρίσις sa konteksto ng kaligtasan
  choice: paghatol
  alternative: kaparusahan o hatol na nagpaparusa
  rationale: Ang 'paghatol' ang mas malawak at hindi labis na tiyak na salin. Maaaring tumukoy ang konteksto sa masamang pasiya o kaparusahan, ngunit hindi iyon tahasang nililimitahan ng pangngalan mismo.
- issue: Lakas ng present at perfect na mga pandiwa kaugnay ng kaligtasan
  choice: kasalukuyang pag-aari ng buhay na walang hanggan at natapos nang pagtawid mula kamatayan tungo sa buhay
  alternative: buhay na matatamo lamang sa hinaharap at pagpapawalang-sala lamang sa huling paghatol
  rationale: Ang ἔχει ay present at ang μεταβέβηκεν ay perfect, kaya ipinakikita ng teksto ang kasalukuyang realidad at natapos nang paglipat na may nagpapatuloy na bunga, nang hindi naglalapat ng sistemang denominasyonal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'Katotohanang-katotohanan' upang mapanatili ang dobleng Ἀμὴν, at 'nakatawid na' upang malinaw na maipakita ang aspekto ng perfect. Ang mga panghalip ay hindi ginawang eksklusibong panlalaki.
