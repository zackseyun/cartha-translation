revisions:
- from: 'Kaya sumagot si Jesus at sinabi sa kanila, “Tunay na tunay na sinasabi ko sa inyo: walang anumang magagawa ang Anak mula sa sarili niya, maliban sa nakikita niyang ginagawa ng Ama.[a] Sapagkat anuman ang ginagawa ng Ama, iyon din ang ginagawa ng Anak sa gayunding paraan.[b]”'
  to: 'Kaya sumagot si Jesus at sinabi sa kanila, “Tunay na tunay na sinasabi ko sa inyo: Hindi kayang gumawa ang Anak ng anuman mula sa sarili niya, malibang makita niyang may ginagawa ang Ama.[a] Sapagkat anuman ang ginagawa ng Ama, iyon din ang ginagawa ng Anak sa gayunding paraan.[b]”'
