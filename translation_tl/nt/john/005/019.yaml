id: JHN.5.19
reference: John 5:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἀπεκρίνατο οὖν ὁ Ἰησοῦς καὶ ⸀ἔλεγεν αὐτοῖς· Ἀμὴν ἀμὴν λέγω ὑμῖν, οὐ δύναται ὁ υἱὸς ποιεῖν ἀφ’ ἑαυτοῦ οὐδὲν ⸀ἐὰν μή τι βλέπῃ τὸν πατέρα ποιοῦντα· ἃ γὰρ ἂν ἐκεῖνος ποιῇ, ταῦτα καὶ ὁ υἱὸς ὁμοίως ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/019.yaml
  text: So Jesus answered and said to them[a], “Truly, truly, I say to you, the Son is not able to do anything from himself unless he sees the Father doing it; for whatever that one does[b], these things the Son also does likewise.”
translation:
  language: tl
  text: 'Kaya sumagot si Jesus at sinabi sa kanila, “Tunay na tunay na sinasabi ko sa inyo: Hindi kayang gumawa ang Anak ng anuman mula sa sarili niya, malibang makita niyang may ginagawa ang Ama.[a] Sapagkat anuman ang ginagawa ng Ama, iyon din ang ginagawa ng Anak sa gayunding paraan.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “hindi kayang gumawa ang Anak ng anuman sa ganang sarili niya, malibang makita niyang ginagawa iyon ng Ama.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ang “anuman” ay nagpapahayag ng pangkalahatang saklaw: anumang ginagawa ng Ama ay ginagawa rin ng Anak sa gayunding paraan.'
    reason: lexical_clarification
lexical_decisions:
- source_word: Ἀπεκρίνατο οὖν ὁ Ἰησοῦς καὶ ἔλεγεν αὐτοῖς
  choice: Kaya sumagot si Jesus at sinabi sa kanila
  rationale: Ang “kaya” ay likas na nag-uugnay sa naunang pangyayari at sumasalamin sa οὖν. Ang “sumagot ... at sinabi” ay nagpapanatili sa dalawang pandiwa ngunit mas natural sa Tagalog kaysa sa pilit na progresibong anyo.
- source_word: Ἀμὴν ἀμὴν λέγω ὑμῖν
  choice: Tunay na tunay na sinasabi ko sa inyo
  rationale: Pinananatili ang mariing pag-uulit ng ἀμὴν ἀμὴν sa malinaw at marangal na modernong Tagalog.
- source_word: οὐ δύναται ὁ υἱὸς ποιεῖν ἀφ’ ἑαυτοῦ οὐδὲν
  choice: walang anumang magagawa ang Anak mula sa sarili niya
  rationale: Ipinahahayag ng “walang anumang magagawa” ang kawalan ng kakayahang tinutukoy ng οὐ δύναται, habang ang “mula sa sarili niya” ay malapit sa ἀφ’ ἑαυτοῦ at hindi ito pinapakahulugang pahintulot lamang o sariling pagkukusa lamang.
- source_word: ἐὰν μή τι βλέπῃ τὸν πατέρα ποιοῦντα
  choice: maliban sa nakikita niyang ginagawa ng Ama
  rationale: 'Natural sa Tagalog ang anyong ito at pinananatili ang diwa ng pagbubukod: ang ginagawa ng Anak ay hindi hiwalay sa nakikita niyang ginagawa ng Ama.'
- source_word: ἃ γὰρ ἂν ἐκεῖνος ποιῇ
  choice: Sapagkat anuman ang ginagawa ng Ama
  rationale: Ang “anuman” ay nagpapahayag ng pangkalahatang di-tiyak na saklaw ng ἃ ... ἂν. Inuulit ang “Ama” sa halip na gumamit ng malamig o malabong katumbas ng ἐκεῖνος upang luminaw ang tinutukoy.
- source_word: ταῦτα καὶ ὁ υἱὸς ὁμοίως ποιεῖ
  choice: iyon din ang ginagawa ng Anak sa gayunding paraan
  rationale: 'Pinananatili ang mariing pagtutugma ng ταῦτα, καί, at ὁμοίως: ang mismong mga ginagawa ng Ama ay ginagawa rin ng Anak sa gayunding paraan.'
theological_decisions:
- issue: Ang kawalan ng kakayahan ng Anak na gumawa mula sa sarili niya
  choice: walang anumang magagawa ang Anak mula sa sarili niya
  alternative: walang magagawa ang Anak nang nag-iisa
  rationale: Pinananatili ng salin ang matinding pahayag ng teksto tungkol sa di-maihihiwalay na pagkilos ng Anak at Ama, nang hindi ito pinahihina bilang simpleng pagpiling huwag kumilos o pinalalawak bilang pahayag tungkol sa likas na pagkatao ng Anak.
- issue: Ang ugnayan ng pagkilos ng Ama at ng Anak
  choice: anuman ang ginagawa ng Ama, iyon din ang ginagawa ng Anak sa gayunding paraan
  alternative: ginagaya ng Anak ang anumang ginagawa ng Ama
  rationale: Iniiwasan ang “ginagaya,” na maaaring magpahiwatig ng panlabas o di-ganap na pagtulad. Mas tuwirang pinananatili ng napiling anyo ang ganap na pagtutugma ng pagkilos na ipinahahayag ng talata.
- issue: Paggamit ng mga titulong Anak at Ama
  choice: Anak / Ama
  alternative: anak / ama
  rationale: Sa konteksto, ang mga ito ay tiyak na mga titulong tumutukoy kay Jesus at sa Ama. Nakakatulong ang malaking titik sa pagkilala sa gamit na ito nang hindi nagdaragdag ng paliwanag sa mismong teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Tunay na tunay” upang mapanatili ang solemneng pag-uulit, at “mula sa sarili niya” upang mapanatili ang relasyonal na diin ng Griyego kahit bahagyang mas pormal ito kaysa sa karaniwang usapan.
