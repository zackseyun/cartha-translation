id: JHN.5.25
reference: John 5:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι ἔρχεται ὥρα καὶ νῦν ἐστιν ὅτε οἱ νεκροὶ ⸀ἀκούσουσιν τῆς φωνῆς τοῦ υἱοῦ τοῦ θεοῦ καὶ οἱ ἀκούσαντες ⸀ζήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/025.yaml
  text: Truly[a], truly, I say to you that an hour is coming, and now is, when the dead will hear the voice of the Son of God[d][c][b], and those who hear will live.
translation:
  language: tl
  text: '“Tunay na tunay[a], sinasabi ko sa inyo: darating ang oras[b], at ngayon ay narito na, na maririnig ng mga patay[c] ang tinig ng Anak ng Diyos, at ang mga nakarinig[d] ay mabubuhay.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas pormal na anyo, “Amen, amen, sinasabi ko sa inyo.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring unawain ang “oras” sa mas malawak na diwang “panahon,” ngunit “oras” ang tiyak na salitang ginamit sa Griyego.
    reason: lexical_alternative
  - marker: c
    text: Maaaring kasama rito ang kasalukuyang espirituwal na diwa ng “mga patay” dahil sa “ngayon ay narito na,” habang ipinahihiwatig din ng kalapit na konteksto ang pagkabuhay na muli ng katawan.
    reason: cross_reference
  - marker: d
    text: 'Maaari ring isalin: “ang mga makarinig ay mabubuhay.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: Tunay na tunay
  rationale: Pinananatili ang mariing pag-uulit at taimtim na himig, ngunit gumagamit ng pananalitang madaling maunawaan sa makabagong Tagalog.
- source_word: λέγω ὑμῖν
  choice: sinasabi ko sa inyo
  rationale: Tuwirang pinananatili ang pagsasalita ni Jesus sa maramihang kausap at ang anyo ng Griyego.
- source_word: ἔρχεται ὥρα
  choice: darating ang oras
  rationale: Pinananatili ang salitang ‘oras’ dahil mahalaga ang temang ito sa Juan at may bigat na eskatolohikal; hindi ito pinalawak agad bilang pangkalahatang ‘panahon.’
- source_word: καὶ νῦν ἐστιν
  choice: at ngayon na nga
  rationale: Likas ngunit siksik na Tagalog na nagpapanatili sa tensiyon ng darating na oras na kasalukuyan na rin, nang hindi labis na ipinapaliwanag.
- source_word: οἱ νεκροὶ
  choice: ang mga patay
  rationale: Tuwiran at hindi nililimitahan kung espirituwal o pisikal na kamatayan ang tinutukoy.
- source_word: ἀκούσουσιν τῆς φωνῆς
  choice: maririnig ... ang tinig
  rationale: Ang ‘tinig’ ay angkop sa personal na pinagmumulan, at ang ‘maririnig’ ay hindi nagdaragdag ng diwang kusang pagsunod na maaaring ipahiwatig ng ‘makikinig.’
- source_word: τοῦ υἱοῦ τοῦ θεοῦ
  choice: ng Anak ng Diyos
  rationale: Tuwirang pinananatili ang buong kristolohikal na titulo sa malinaw at kinikilalang anyo sa Tagalog.
- source_word: οἱ ἀκούσαντες
  choice: ang mga nakarinig
  rationale: Sinasalamin ang aspektong aorist ng participle bilang mga nakarinig, habang ang talababa ay nagbibigay ng mas likas na posibleng pagbasa sa kontekstong nakatuon sa hinaharap.
- source_word: ζήσουσιν
  choice: mabubuhay
  rationale: Tuwirang isinasalin ang ζάω nang hindi ginagawang tahasan ang ‘muling pagkabuhay,’ kaya nananatili ang posibleng espirituwal at pisikal na taginting.
theological_decisions:
- issue: Ang tinutukoy ng ‘mga patay’
  choice: Pinanatili bilang ‘mga patay’ nang walang paliwanag sa pangunahing teksto.
  alternative: ‘mga patay sa espiritu’ o ‘mga patay sa katawan’
  rationale: Ang ‘ngayon na nga’ ay nagpapahiwatig ng kasalukuyang dimensiyon, samantalang ang kalapit na konteksto ay tumutukoy rin sa pagkabuhay na muli ng katawan. Hindi dapat ipasya ng salin ang tensiyong ito.
- issue: Ang titulong ‘Anak ng Diyos’
  choice: Pinanatili bilang ‘Anak ng Diyos.’
  alternative: ‘Anak na mula sa Diyos’ o isang pinalawak na paliwanag sa titulo
  rationale: Ito ang tuwirang katumbas ng Griyego at hindi nagdaragdag ng paliwanag o natatanging aral na wala sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino Tagalog. Pinanatili ang mariing himig ng pananalita ni Jesus, ang terminong ‘oras,’ at ang sinadyang tensiyon sa pagitan ng kasalukuyan at hinaharap. Iniwasan ang mga salitang magtatakda kung espirituwal lamang o pisikal lamang ang buhay at kamatayan.
