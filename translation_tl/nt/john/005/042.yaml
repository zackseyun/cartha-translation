id: JHN.5.42
reference: John 5:42
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀλλὰ ἔγνωκα ὑμᾶς ὅτι τὴν ἀγάπην τοῦ θεοῦ οὐκ ἔχετε ἐν ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/042.yaml
  text: 'But I know you: you do not have the love of God in yourselves.'
translation:
  language: tl
  text: 'Ngunit kilala ko kayo: wala sa inyong kalooban ang pag-ibig ng Diyos.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas tahasan, “wala sa inyong kalooban ang pag-ibig sa Diyos.” Maaari ring unawain ang Griyego bilang “ang pag-ibig na nagmumula sa Diyos” o “ang pag-ibig ng Diyos.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ngunit
  rationale: Nagpapahayag ng malinaw na pagsalungat sa naunang sinabi at angkop sa marangal ngunit likas na daloy ng Filipino.
- source_word: ἔγνωκα
  choice: kilala ko
  rationale: Ang perpektong anyo ay nagpapahiwatig ng matatag na pagkakilala; likas itong ipinahahayag sa Filipino sa pangkasalukuyang “kilala ko.”
- source_word: ὑμᾶς
  choice: kayo
  rationale: Tuwirang layon at malinaw na maramihan.
- source_word: ὅτι
  choice: ':'
  rationale: Ipinakikilala ng tutuldok ang nilalaman ng nalalaman ni Jesus nang natural sa Filipino, nang hindi nangangailangan ng mas mabigat na “na.”
- source_word: τὴν ἀγάπην τοῦ θεοῦ
  choice: ang pag-ibig ng Diyos
  rationale: Pinananatili ang anyong henitibo ng Griyego at hindi tahasang nilulutas kung ito ay pag-ibig sa Diyos, pag-ibig na nagmumula sa Diyos, o pag-ibig ng Diyos; nililinaw ang mga posibilidad sa talababa.
- source_word: οὐκ ἔχετε
  choice: wala
  rationale: Natural na Filipino para sa hindi pagkakaroon ng isang katangiang nasa kalooban; nananatili ang kasalukuyang kalagayang itinatanggi.
- source_word: ἐν ἑαυτοῖς
  choice: sa inyong kalooban
  rationale: Ipinahahayag ang panloob na presensiya o pag-iral ng pag-ibig, hindi lamang ang pag-aari nito; mas likas kaysa literal na “sa inyong sarili.”
theological_decisions:
- issue: Kahulugan ng henitibo sa τὴν ἀγάπην τοῦ θεοῦ
  choice: Pinanatili sa pangunahing teksto bilang “ang pag-ibig ng Diyos.”
  alternative: “pag-ibig sa Diyos”; maaari ring “pag-ibig na nagmumula sa Diyos” o “pag-ibig ng Diyos.”
  rationale: Hindi tiyak sa anyong Griyego kung ang Diyos ang layon o pinagmumulan/tagapagtaglay ng pag-ibig. Bagaman malakas sa konteksto ang diwang kawalan nila ng pag-ibig sa Diyos, hindi ito tahasang nilulutas ng pangunahing teksto.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “sa inyong kalooban” upang likas na maipahayag ang panloob na diwa ng ἐν ἑαυτοῖς. Ang “pag-ibig ng Diyos” ay sadyang pinanatili kasama ng talababa upang hindi ikubli ang tunay na kalabuan ng henitibong Griyego.
