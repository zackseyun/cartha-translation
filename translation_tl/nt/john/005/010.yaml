id: JHN.5.10
reference: John 5:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἔλεγον οὖν οἱ Ἰουδαῖοι τῷ τεθεραπευμένῳ· Σάββατόν ἐστιν, ⸀καὶ οὐκ ἔξεστίν σοι ἆραι τὸν ⸀κράβαττον.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/010.yaml
  text: So the Jews were saying to the man who had been healed[a], “It is the Sabbath[c][b], and it is not lawful for you to carry your mat.”
translation:
  language: tl
  text: Kaya sinasabi noon ng mga Judio[a] sa lalaking pinagaling, “Araw ng Sabbath ngayon, at hindi ipinahihintulot sa iyo na buhatin[b] ang iyong higaan[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga pinunong Judio” o “mga taga-Judea,” depende sa gamit ni Juan sa katawagang ito rito.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “iangat” o “dalhin.”
    reason: lexical_alternative
  - marker: c
    text: Ang salitang isinaling “higaan” ay tumutukoy sa nadadalang banig o payak na kutson na hinihigaan, hindi kinakailangang isang buong kama.
    reason: cultural_note
lexical_decisions:
- source_word: ἔλεγον
  choice: sinabi
  rationale: Ang imperpektong anyo ay maaaring maglarawan ng nagpapatuloy na pagsasalita, ngunit sa likas na salaysay sa Tagalog, sapat at mas natural ang “sinabi”; hindi nito ipinapalagay na minsanan lamang ang pagsasalita.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinapakita ang ugnayang pasalaysay at bunga mula sa naunang pangyayari nang hindi nagiging labis na pormal.
- source_word: οἱ Ἰουδαῖοι
  choice: mga Judio
  rationale: Pinananatili ang lantad na katawagan ng Griyego. Hindi ito awtomatikong nililimitahan sa mga pinuno o sa mga taga-Judea, bagaman binabanggit sa talababa ang mga posibleng kontekstuwal na kahulugan.
- source_word: τῷ τεθεραπευμένῳ
  choice: sa lalaking pinagaling
  rationale: Malinaw at natural na tumutukoy sa lalaking tumanggap ng natapos nang pagpapagaling; ang kasarian ay tiyak mula sa konteksto.
- source_word: Σάββατόν ἐστιν
  choice: Araw ng Sabbath ngayon
  rationale: Natural na pahayag sa modernong Tagalog para sa temporal na diwa ng Griyego.
- source_word: οὐκ ἔξεστίν σοι
  choice: hindi ipinahihintulot sa iyo
  rationale: Pinananatili ang diwa ng pinapayagan o naaayon sa batas nang hindi nagdaragdag kung aling tiyak na batas o interpretasyon ang tinutukoy.
- source_word: ἆραι
  choice: buhatin
  rationale: Maaaring mangahulugang kunin, iangat, o dalhin. Sa konteksto, ang “buhatin” ay natural at naiiwang bukas kung diin ay nasa pag-angat o pagdadala.
- source_word: κράβαττον
  choice: higaan
  rationale: Karaniwang salitang Tagalog para sa bagay na hinihigaan; nililinaw ng talababa na ito ay isang nadadalang banig o payak na higaan, hindi kinakailangang kama na may balangkas.
theological_decisions:
- issue: Tinutukoy ng οἱ Ἰουδαῖοι sa Juan
  choice: mga Judio
  alternative: mga pinunong Judio; mga taga-Judea
  rationale: Hindi tahasang tinutukoy ng talata ang mga nagsasalita bilang mga pinuno, kaya pinananatili ang malawak at literal na katawagan habang kinikilala sa talababa ang tunay na kalabuan ng gamit ni Juan.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “Sabbath” bilang pamilyar na terminong biblikal at iniwasan ang pagpapakitid sa mga nagsasalita bilang mga pinuno kung hindi ito tahasang sinasabi ng teksto.
