  text: οὐδὲ γὰρ ὁ πατὴρ κρίνει οὐδένα, ἀλλὰ τὴν κρίσιν πᾶσαν δέδωκεν τῷ υἱῷ,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/022.yaml
  text: For the Father judges no one, but has given all judgment to the Son,
translation:
  language: tl
  text: Sapagkat hindi humahatol ang Ama sa sinuman, kundi ibinigay niya sa Anak ang lahat ng paghatol.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ γὰρ
  choice: Sapagkat hindi
  rationale: Ipinahahayag ng γάρ ang paliwanag na kaugnay ng naunang pahayag, samantalang likas na naisasama sa negatibong sugnay sa Filipino ang puwersa ng οὐδέ.
- source_word: ὁ πατὴρ
  choice: ang Ama
  rationale: Tiyak na titulo ito para sa Diyos sa ugnayan niya sa Anak; pinananatili ng malaking titik ang gamit nitong pantangi at teolohikal.
- source_word: κρίνει
  choice: humahatol
  rationale: Naglalahad ang pangkasalukuyang pandiwa ng pangkalahatang katotohanan. Ang “humahatol” ay hindi nililimitahan sa pagpaparusa at pinananatili ang ugnayan nito sa κρίσιν.
- source_word: οὐδένα
  choice: sa sinuman
  rationale: Likas at ganap na katumbas ito ng komprehensibong pagtanggi sa Filipino.
- source_word: ἀλλὰ
  choice: kundi
  rationale: Pagkatapos ng negatibong sugnay, natural na ipinakikita ng “kundi” ang mariing pagsalungat at paghalili.
- source_word: τὴν κρίσιν πᾶσαν
  choice: ang buong paghatol
  rationale: Pinananatili nito ang pangngalang “paghatol” at ang saklaw ng πᾶσαν, nang hindi dinaragdagan ng salitang “awtoridad” na hindi tahasang nasa teksto.
- source_word: δέδωκεν
  choice: ibinigay niya
  rationale: Ang perpektong anyo ay tumutukoy sa natapos na pagbibigay na may nananatiling bisa. Bagaman walang tuwirang katumbas ang aspektong ito sa natural na Filipino, malinaw ito sa konteksto at sa ayos ng pangungusap.
- source_word: τῷ υἱῷ
  choice: sa Anak
  rationale: Pinananatili ang artikuladong titulong “ang Anak” nang hindi nagdaragdag ng panghalip na paari.
theological_decisions:
- issue: Ugnayan ng paghatol ng Ama at ng Anak
  choice: Tuwirang sabihing hindi humahatol ang Ama sa sinuman, kundi ibinigay niya sa Anak ang buong paghatol.
  alternative: Dagdagan ng paliwanag na hindi humahatol ang Ama nang hiwalay sa Anak, o limitahan ito sa huling paghatol lamang.
  rationale: Walang ganitong pan限定 o pagpapaluwag sa Griyego. Pinananatili ng salin ang tahasang pahayag at ang teolohikal na tensiyon nito.
- issue: Ang kristolohikal na titulong “ang Anak”
  choice: Panatilihin ang “ang Anak” bilang titulo.
  alternative: Isaling “ang kanyang anak.”
  rationale: Ang tekstong Griyego ay may artikulo ngunit walang tahasang panghalip na paari; mahalaga rin sa konteksto ni Juan ang Ama–Anak na katawagan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “humahatol/paghatol” upang mapanatili ang leksikal na ugnayan ng κρίνει at κρίσιν. Walang talababa sapagkat walang tekstuwal o leksikal na kalabuan na nangangailangan nito sa talatang ito.
