  text: ὥσπερ γὰρ ὁ πατὴρ ἐγείρει τοὺς νεκροὺς καὶ ζῳοποιεῖ, οὕτως καὶ ὁ υἱὸς οὓς θέλει ζῳοποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/021.yaml
  text: For just as the Father raises the dead and gives life[b][a], so also the Son gives life to whom he wishes.
translation:
  language: tl
  text: Sapagkat, kung paanong binabangon ng Ama ang mga patay at binubuhay sila, gayundin, binubuhay ng Anak ang sinumang nais niya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang sinumang nais niyang buhayin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Sapagkat kung paanong
  rationale: Pinananatili ang paliwanag na diwa ng γάρ at binubuksan nang natural sa Tagalog ang paghahambing na ipinahihiwatig ng ὥσπερ.
- source_word: ὁ πατὴρ
  choice: ang Ama
  rationale: Ginamit bilang tiyak na banal na titulo sa konteksto at katapat ng “Anak.”
- source_word: ἐγείρει τοὺς νεκρούς
  choice: ibinabangon ... ang mga patay
  rationale: Ang “ibinabangon” ay karaniwang salin sa konteksto ng muling pagkabuhay; ang “mga patay” ay natural na kolektibong pagtukoy sa Tagalog.
- source_word: ζῳοποιεῖ
  choice: binubuhay
  rationale: Tuwirang ipinahahayag ang pagbibigay o pagsasauli ng buhay at naiuulit sa dalawang sugnay upang mapanatili ang paralelismo.
- source_word: οὕτως καὶ
  choice: gayundin
  rationale: Natural at maikling panumbas na nag-uugnay sa magkatulad na gawain ng Ama at ng Anak.
- source_word: ὁ υἱὸς
  choice: ang Anak
  rationale: Ginamit bilang banal na titulo at malinaw na katapat ng “Ama” sa talata.
- source_word: οὓς θέλει
  choice: ang sinumang nais niya
  rationale: Natural na modernong Tagalog para sa malayang pagpili o pagnanais ng Anak; hindi nito ginagawang simpleng damdamin lamang ang θέλει.
theological_decisions:
- issue: Pagkakapantay sa paralelismo ng Ama at Anak sa pagbibigay-buhay
  choice: Inulit ang “binubuhay” para sa Ama at Anak.
  alternative: Gumamit ng magkaibang pandiwa o luwagan ang ikalawang sugnay.
  rationale: Sadyang magkatapat sa Griyego ang dalawang paggamit ng ζῳοποιεῖ. Pinananatili ng salin ang matibay na kristolohikal na paralelismo nang walang idinaragdag na paliwanag tungkol sa likas na kaugnayan ng Ama at Anak.
- issue: Ang puwersang kusang-loob ng θέλει
  choice: nais niya
  alternative: kalooban niyang buhayin
  rationale: Malinaw at kasalukuyang Tagalog ang “nais niya,” at pinananatili nito ang tunay na pagpapasya ng Anak nang hindi nagpapasok ng dagdag na doktrinal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ang “sila” sa unang sugnay ay likas na tumutukoy sa “mga patay” at kailangan para sa maayos na daloy sa Tagalog, bagaman ipinahihiwatig lamang ang layon sa Griyego. Pinanatili ang paulit-ulit na “binubuhay” upang marinig ang paralelismo ng orihinal.
