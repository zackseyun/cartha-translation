  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: μὴ θαυμάζετε τοῦτο, ὅτι ἔρχεται ὥρα ἐν ᾗ πάντες οἱ ἐν τοῖς μνημείοις ⸀ἀκούσουσιν τῆς φωνῆς αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/john/005/028.yaml
  text: Do not marvel at this[a], because an hour is coming in which all who are in the tombs will hear his voice
translation:
  language: tl
  text: Huwag kayong mamangha rito, sapagkat darating ang oras na maririnig ng lahat ng nasa mga libingan[a] ang tinig niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga puntod.” Ang Griyegong μνημεῖα ay maaaring tumukoy sa mga lugar ng paglilibing sa pangkalahatan; pinili ang “mga libingan” upang mapanatili ang kongkretong larawan.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ θαυμάζετε
  choice: Huwag kayong mamangha
  rationale: Ang μή kasama ng pangkasalukuyang pautos ay naghahayag ng pagbabawal. Likas at marangal sa modernong Tagalog ang “mamangha” at napapanatili nito ang lakas ng θαυμάζω.
- source_word: τοῦτο
  choice: rito
  rationale: Tumutukoy ito sa naunang pahayag. Mas natural sa Tagalog ang “rito” kasunod ng “mamangha” kaysa sa mas pormal na “sa bagay na ito.”
- source_word: ὅτι
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng pagbabawal. Malinaw, marangal, at hindi lipas ang “sapagkat.”
- source_word: ἔρχεται ὥρα
  choice: darating ang oras
  rationale: Pinananatili ang kongkretong “oras” dahil may natatanging bigat ang ὥρα sa Ebanghelyo ni Juan. Bagaman walang artikulo sa Griyego, natural sa Tagalog ang “ang oras” sa ganitong pangungusap at hindi nito kailangang tukuyin ang eksaktong oras.
- source_word: ἐν ᾗ
  choice: na
  rationale: Ang pang-ugnay na “na” ay likas na Tagalog para sa “oras na…” at malinaw na naghahayag kung ano ang mangyayari sa panahong iyon.
- source_word: πάντες οἱ ἐν τοῖς μνημείοις
  choice: lahat ng nasa mga libingan
  rationale: Inililipat ng “lahat ng nasa” ang substantibong gamit ng πάντες οἱ. Ang “mga libingan” ay tumutukoy sa mga lugar ng paglilibing at pinananatili ang kongkretong larawan ng μνημεῖα.
- source_word: ἀκούσουσιν
  choice: maririnig
  rationale: Wastong hinaharap na anyo ito ng “makarinig” at mas natural dito kaysa “makikinig,” na maaaring magpahiwatig ng kusang pagbibigay-pansin.
- source_word: τῆς φωνῆς αὐτοῦ
  choice: ang tinig niya
  rationale: Karaniwang kahulugan ng φωνή sa konteksto ng personal na pagsasalita ang “tinig.” Hindi na kailangang palawakin bilang “tunog ng kaniyang tinig.”
theological_decisions:
- issue: Ang ipinahihiwatig na pagkabuhay na muli ng mga nasa libingan
  choice: Panatilihin ang kongkretong larawan ng “mga libingan” nang walang idinagdag na paliwanag tungkol sa pagkabuhay na muli.
  alternative: Gawing tahasan ang “mga patay” o idagdag na sila ay bubuhaying muli.
  rationale: Ipinahihiwatig ng konteksto ang pagkabuhay na muli, ngunit nararapat panatilihin ng salin ang mismong larawan at teolohikal na pag-unlad ng teksto sa halip na ipasok agad ang paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “mamangha,” “sapagkat,” at “tinig” upang mapanatili ang mataas ngunit likas na himig; iniwasan ang labis na teknikal o denominasyonal na pananalita.
