id: JHN.5.37
reference: John 5:37
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ὁ πέμψας με πατὴρ ⸀ἐκεῖνος μεμαρτύρηκεν περὶ ἐμοῦ. οὔτε φωνὴν αὐτοῦ ⸂πώποτε ἀκηκόατε⸃ οὔτε εἶδος αὐτοῦ ἑωράκατε,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/037.yaml
  text: And the Father who sent me—that one has testified about me[a]. You have neither ever heard his voice nor seen his form[b],
translation:
  language: tl
  text: At ang Ama na nagsugo sa akin—siya ang nagpatotoo tungkol sa akin.[a] Hindi ninyo kailanman narinig ang kanyang tinig, ni nakita man ang kanyang anyo,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang mismong Ama ang nagpatotoo tungkol sa akin.” Nagbibigay-diin ang salitang Griyego na ἐκεῖνος sa “Ama na nagsugo sa akin.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “kanyang kaanyuan.” Ang salitang Griyego na εἶδος ay maaaring tumukoy sa nakikitang anyo o kaanyuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πέμψας με πατὴρ
  choice: ang Ama na nagsugo sa akin
  rationale: Ang articular aorist participle na πέμψας ay likas na isinasalin sa Filipino bilang sugnay na panuring, kaya malinaw na tinutukoy nito ang Ama bilang siyang nagsugo kay Jesus.
- source_word: ἐκεῖνος
  choice: siya
  rationale: Pagkatapos ng pariralang tumutukoy sa Ama, ang hiwalay at idinidiing “siya” kasunod ng gitling ay natural na Filipino na nagpapanatili sa diin ng demonstrative nang hindi nagiging pilit ang pananalita.
- source_word: μεμαρτύρηκεν
  choice: ang nagpatotoo
  rationale: Pinananatili ng “nagpatotoo” ang kahulugang saksi o patotoo ng μαρτυρέω. Sa pandiwang nakatuon sa tagaganap na may “ang,” naipahahayag din ang namamalaging bigat ng patotoong naibigay na.
- source_word: περὶ ἐμοῦ
  choice: tungkol sa akin
  rationale: Karaniwan at eksaktong katumbas ito ng περί na may genitive sa kontekstong ito.
- source_word: οὔτε ... οὔτε
  choice: Hindi ... ni ... man
  rationale: Ang tambalang pagtangging ito ay natural na naghahayag sa Filipino na parehong hindi nangyari ang pakikinig at pagkakita.
- source_word: φωνὴν αὐτοῦ
  choice: ang kanyang tinig
  rationale: Ang “tinig” ang tuwirang katumbas ng φωνή sa konteksto ng pakikinig at may dignidad na angkop sa teksto.
- source_word: πώποτε
  choice: kailanman
  rationale: Sa loob ng negatibong pahayag, malinaw na ipinahahayag ng “kailanman” ang diwang “sa anumang panahon.”
- source_word: ἀκηκόατε
  choice: narinig
  rationale: Natural sa Filipino ang aspektong perpektibo upang tukuyin ang karanasang hindi kailanman naganap; hindi kailangang piliting tularan ang anyong perfect ng Griyego sa pamamagitan ng dagdag na salita.
- source_word: εἶδος αὐτοῦ
  choice: ang kanyang anyo
  rationale: Saklaw ng “anyo” ang nakikitang porma o kaanyuan at hindi nito nilulutas nang labis kung literal na pagpapakita o mas malawak na pagdama ang tinutukoy.
- source_word: ἑωράκατε
  choice: nakita
  rationale: Ang perpektibong “nakita” ang natural na Filipino para sa karanasang biswal na itinatanggi ng pangungusap.
theological_decisions:
- issue: Ang diin ng ἐκεῖνος na tumutukoy sa Ama
  choice: Panatilihin ang tahasang diin sa “—siya ang nagpatotoo tungkol sa akin.”
  alternative: “ang mismong Ama na nagsugo sa akin ang nagpatotoo tungkol sa akin”
  rationale: Ipinakikita ng ayos na ito na ang Ama ang idinidiing saksi ni Jesus, habang nananatiling natural at hindi nagdaragdag ng doktrinal na paliwanag.
- issue: Ang kahulugan ng εἶδος αὐτοῦ
  choice: Isalin bilang “ang kanyang anyo.”
  alternative: “ang kanyang kaanyuan” o “ang kanyang hitsura”
  rationale: Ang “anyo” ay dignified at malawak ang kahulugan; pinananatili nito ang posibleng pagtukoy sa nakikitang porma o pagpapakita nang hindi nilulutas ang tunay na ambiguwidad ng salita.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang gitling at ang hulma na “siya ang” upang likas na maipakita ang diin sa Ama. Ang “tinig” at “anyo” ay madaling maunawaan ngunit nananatiling angkop sa biblikal na konteksto. Pinanatili ang kuwit sa hulihan dahil nagpapatuloy ang pangungusap sa kasunod na talata.
