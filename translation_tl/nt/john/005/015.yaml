id: JHN.5.15
reference: John 5:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀπῆλθεν ὁ ἄνθρωπος καὶ ⸀ἀνήγγειλεν τοῖς Ἰουδαίοις ὅτι Ἰησοῦς ἐστιν ὁ ποιήσας αὐτὸν ὑγιῆ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/015.yaml
  text: The man went away and reported to the Jews that Jesus was the one who had made him well[a].
translation:
  language: tl
  text: Umalis ang lalaki at ibinalita sa mga Judio na si Jesus ang nagpagaling sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa mga pinunong Judio” o “sa mga taga-Judea,” depende sa pagkaunawa sa paggamit ni Juan ng katawagang “mga Judio” sa kontekstong ito.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: Umalis
  rationale: Likas at tuwirang Filipino para sa pag-alis niya sa tagpo; hindi kasing-pormal ng “lumisan.”
- source_word: ὁ ἄνθρωπος
  choice: ang lalaki
  rationale: Tumutukoy sa lalaking pinagaling sa naunang konteksto at pinananatili ang tiyak na reperensiya ng salaysay.
- source_word: ἀνήγγειλεν
  choice: ibinalita
  rationale: Ipinahihiwatig ng ἀναγγέλλω ang pagpapabatid o pag-uulat ng impormasyon. Ang “ibinalita” ay natural sa Filipino at hindi kinakailangang mangahulugan ng pampublikong pagpapahayag.
- source_word: τοῖς Ἰουδαίοις
  choice: sa mga Judio
  rationale: Pinananatili sa pangunahing teksto ang tahasang katawagan ng Griyego nang hindi nililimitahan agad sa mga pinuno; inilalahad sa talababa ang mga posibleng kontekstuwal na pakahulugan.
- source_word: ὅτι
  choice: na
  rationale: Karaniwang pang-ugnay sa Filipino na nagpapakilala sa nilalaman ng ibinalita.
- source_word: Ἰησοῦς
  choice: si Jesus
  rationale: Karaniwang anyo ng pangalan sa modernong Filipino.
- source_word: ἐστιν
  choice: si Jesus ang
  rationale: Ang hulma ng pangungusap na “si Jesus ang…” ay natural na paraan sa Filipino upang tukuyin kung sino ang gumawa; hindi kailangang tahasang isalin ang copula, kaya hindi rin sapilitang nilulutas ang presenteng anyo ng Griyego bilang “ay” o “noon.”
- source_word: ὁ ποιήσας αὐτὸν ὑγιῆ
  choice: ang nagpagaling sa kanya
  rationale: Natural na Filipino para sa idyomang literal na “gumawa sa kanyang malusog.” Ipinahahayag nito ang naging bunga—ang paggaling—nang hindi nagdaragdag ng mas malawak na kahulugan gaya ng ganap na pagiging buo.
theological_decisions:
- issue: Tinutukoy ng “mga Judio” sa Ebanghelyo ni Juan
  choice: Panatilihin ang “mga Judio” sa pangunahing teksto at ilagay sa talababa ang mga posibleng kontekstuwal na pakahulugan.
  alternative: “mga pinunong Judio” o “mga taga-Judea”
  rationale: Ang Ἰουδαίοις mismo ay hindi tahasang nagsasabing “mga pinuno,” bagaman maaaring iyon ang tinutukoy sa konteksto ni Juan. Pinananatili ng salin ang tunay na kalabuan at iniiwasang paliitin ang reperensiya nang walang katiyakan.
translation_notes:
  register: Modernong Filipino na malinaw, natural, at marangal. Ginamit ang “ibinalita” sa halip na mas pormal na “iniulat,” at “nagpagaling” bilang likas na katumbas ng Griyegong konstruksiyong ποιέω + ὑγιῆ. Ang marker na [a] ay nasa pangunahing teksto at tumutugma sa talababa.
