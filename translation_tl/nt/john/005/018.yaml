id: JHN.5.18
reference: John 5:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: διὰ τοῦτο οὖν μᾶλλον ἐζήτουν αὐτὸν οἱ Ἰουδαῖοι ἀποκτεῖναι ὅτι οὐ μόνον ἔλυε τὸ σάββατον, ἀλλὰ καὶ πατέρα ἴδιον ἔλεγε τὸν θεόν, ἴσον ἑαυτὸν ποιῶν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/018.yaml
  text: For this reason[a], therefore, the Jews were seeking all the more to kill him, because he was not only breaking the Sabbath, but was also calling God his own Father[b], making himself equal with God.
translation:
  language: tl
  text: Dahil dito, lalo pa nilang pinagsisikapang patayin siya, sapagkat hindi lamang niya nilalabag ang Sabbath, kundi sinasabi rin niyang sarili niyang Ama ang Diyos at sa gayo’y ginagawa niyang kapantay ng Diyos ang kanyang sarili.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Ebanghelyo ni Juan, ang “mga Judio” ay madalas tumutukoy sa ilang pinunong Judio o sa mga Judiong kumakalaban kay Jesus sa partikular na konteksto, hindi sa lahat ng Judio nang walang pagtatangi.
    reason: cultural_note
  - marker: b
    text: 'Maaari ring isalin: “sa gayo’y ipinapantay niya ang kanyang sarili sa Diyos.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο οὖν
  choice: Kaya naman
  rationale: Natural na ipinahahayag sa modernong Tagalog ang pinagsamang sanhi at paghihinuha ng parirala, nang hindi lumilikha ng mabigat na pag-uulit gaya ng “dahil dito, samakatuwid.”
- source_word: μᾶλλον
  choice: lalo pang
  rationale: 'Pinananatili ang paghahambing at pag-igting: higit pang tumindi ang pagsisikap nilang patayin si Jesus.'
- source_word: ἐζήτουν ... ἀποκτεῖναι
  choice: sinikap ... na patayin
  rationale: Ipinapahayag ang patuloy o paulit-ulit na paghahangad na patayin siya; natural at tuwiran ito sa Tagalog.
- source_word: οἱ Ἰουδαῖοι
  choice: mga Judio
  rationale: Pinananatili ang malawak na leksikal na anyo ng Griyego; nililinaw sa talababa na sa konteksto ay hindi nito kailangang tukuyin ang bawat Judio.
- source_word: ἔλυε τὸ σάββατον
  choice: nilalabag ang Sabbath
  rationale: Ang λύω ay idyomatikong tumutukoy rito sa paglabag o pagsasantabi sa mga tuntunin ng Sabbath, hindi sa literal na “pagkalag.”
- source_word: πατέρα ἴδιον ἔλεγε τὸν θεόν
  choice: sinasabi ... na ang Diyos ay sarili niyang Ama
  rationale: Pinananatili ang diin ng ἴδιον sa natatanging pag-aangkin na ang Diyos ay kanyang sariling Ama.
- source_word: ἴσον ἑαυτὸν ποιῶν τῷ θεῷ
  choice: ginagawa niyang kapantay ng Diyos ang kanyang sarili
  rationale: Tuwirang inililipat ang kahulugan ng participial clause at pinananatili ang malakas na pahayag tungkol sa pagkakapantay sa Diyos.
theological_decisions:
- issue: Lakas ng pahayag tungkol sa pagkakapantay ni Jesus sa Diyos
  choice: ginagawa niyang kapantay ng Diyos ang kanyang sarili
  alternative: inaangkin niyang kapantay siya ng Diyos
  rationale: Hindi pinalalabnaw ang malinaw na ἴσον ... τῷ θεῷ, ngunit hindi rin dinaragdagan ng kalaunang terminolohiyang doktrinal na wala sa talata.
- issue: Saklaw ng “mga Judio”
  choice: mga Judio sa pangunahing teksto, na may paglilinaw sa talababa
  alternative: mga pinunong Judio
  rationale: Ang οἱ Ἰουδαῖοι ay hindi tahasang nagsasabing “mga pinuno.” Pinananatili ng salin ang anyo ng teksto habang ipinapaliwanag ng talababa ang mas makitid na posibleng reperensiya sa konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Sabbath” bilang pamilyar na katawagang biblikal; iniwasan ang sobrang literal ngunit di-likas na pag-uulit sa pambungad. Pinanatili ang ambiguwidad sa saklaw ng “mga Judio” sa pamamagitan ng talababa at ang buong bigat ng pangwakas na pahayag.
