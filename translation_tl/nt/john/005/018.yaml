revisions:
- from: Kaya naman, lalo pang sinikap ng mga Judio[a] na patayin siya, sapagkat hindi lamang niya nilalabag ang Sabbath, kundi sinasabi rin niyang ang Diyos ay sarili niyang Ama, sa gayo’y ginagawa niyang kapantay ng Diyos ang kanyang sarili.[b]
  to: Dahil dito, lalo pa nilang pinagsisikapang patayin siya, sapagkat hindi lamang niya nilalabag ang Sabbath, kundi sinasabi rin niyang sarili niyang Ama ang Diyos at sa gayo’y ginagawa niyang kapantay ng Diyos ang kanyang sarili.[a][b]
  rationale: Inayos ang pandiwang tumutugma sa ἐζήτουν upang higit na maipakita ang nagpapatuloy na paghahangad o pagsisikap. Inayos din ang ayos ng sugnay tungkol sa Diyos bilang sariling Ama upang maging mas natural sa modernong Filipino. Inilipat ang unang talababa sa dulo ng talata upang malinaw na ang angkla nito ay “mga Judio,” nang hindi naaantala ang daloy ng pangungusap.
