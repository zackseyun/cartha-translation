  source_fidelity: 'Tapat ang salin sa Griyego: ang “mula sa tao” ay pinananatili ang pangkalahatan at isahang anyo ng παρὰ ἀνθρώπου; ang “patotoo,” “tumatanggap,” at “upang maligtas kayo” ay wastong naghahatid ng μαρτυρίαν, λαμβάνω, at ng layuning ipinahahayag ng ἵνα ... σωθῆτε. Nananatili rin ang balintiyak at malawak na saklaw ng “maligtas.”'
  naturalness: Natural at marangal ang modernong Filipino Tagalog. Ang “ang mga bagay na ito” ay bahagyang mas pormal kaysa sa “ang mga ito,” ngunit malinaw, idiomatiko, at kapaki-pakinabang sa pagpapanatili ng maramihang demonstrative. Ang “sa halip” ay katanggap-tanggap na paghahatid ng ἀλλά sa kontekstong ito.
  terminology: Ang “patotoo” ay angkop sa kontekstong pang-ebidensiya, at ang “maligtas” ay pinananatili ang mahalagang teolohikal na termino nang hindi idinaragdag ang isang tiyak na doktrinal na pagpapakahulugan.
