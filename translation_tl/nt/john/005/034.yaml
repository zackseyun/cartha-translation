id: JHN.5.34
reference: John 5:34
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐγὼ δὲ οὐ παρὰ ἀνθρώπου τὴν μαρτυρίαν λαμβάνω, ἀλλὰ ταῦτα λέγω ἵνα ὑμεῖς σωθῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/034.yaml
  text: But I do not receive testimony from man; rather, I say these things so that you may be saved.
translation:
  language: tl
  text: Ngunit hindi ako tumatanggap ng patotoo mula sa tao; sa halip, sinasabi ko ang mga bagay na ito upang maligtas kayo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρὰ ἀνθρώπου
  choice: mula sa tao
  rationale: Ang παρά na may genitive ay nagsasaad ng pinagmulan. Pinananatili ng “mula sa tao” ang isahang anyo at ang pangkalahatang diwa ng patotoong nagmumula sa tao, nang hindi ito ginagawang isang tiyak na indibidwal.
- source_word: τὴν μαρτυρίαν
  choice: patotoo
  rationale: Ang “patotoo” ay natural na katumbas ng μαρτυρία at pinananatili ang diwang pang-ebidensiya sa konteksto.
- source_word: λαμβάνω
  choice: tumatanggap
  rationale: Tuwirang ipinapahayag ng pangkasalukuyang “tumatanggap” ang present indicative at natural itong kasama ng “patotoo.”
- source_word: ταῦτα
  choice: ang mga bagay na ito
  rationale: Pinananatili nito ang maramihang anyo ng neuter plural demonstrative sa halip na patagin bilang “ito.”
- source_word: λέγω
  choice: sinasabi ko
  rationale: Natural na modernong Tagalog ito para sa present indicative at malinaw na may tuwirang layon.
- source_word: ἵνα ὑμεῖς σωθῆτε
  choice: upang maligtas kayo
  rationale: Ipinahahayag ng “upang” ang layunin ng ἵνα, at pinananatili ng “maligtas kayo” ang balintiyak na anyo at malawak na diwang pangkaligtasan.
- source_word: δὲ ... ἀλλὰ
  choice: Ngunit ... sa halip
  rationale: 'Malinaw na pinananatili ng pares na ito ang paghahambing: hindi umaasa si Jesus sa patotoong mula sa tao; sa halip, nagsasalita siya para sa ikaliligtas ng kanyang mga kausap.'
theological_decisions:
- issue: Kahulugan ng “maligtas kayo” sa konteksto
  choice: Panatilihin ang malawak na pananalitang pangkaligtasan nang hindi nililimitahan sa pisikal na pagliligtas o sa isang partikular na sistemang doktrinal.
  alternative: “mailigtas kayo” o “makamit ninyo ang kaligtasan”
  rationale: Ang σωθῆτε ay balintiyak at may buong bigat ng konsepto ng kaligtasan. Ang “maligtas kayo” ay hindi nagdaragdag ng paliwanag tungkol sa paraan o tiyak na balangkas ng kaligtasan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “mula sa tao” upang mapanatili ang isahang anyo at pangkalahatang sangkatauhang diwa; iniwasan ang mas arkaikong ayos at labis na interpretatibong pagpapalawak.
