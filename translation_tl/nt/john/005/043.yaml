  text: ἐγὼ ἐλήλυθα ἐν τῷ ὀνόματι τοῦ πατρός μου καὶ οὐ λαμβάνετέ με· ἐὰν ἄλλος ἔλθῃ ἐν τῷ ὀνόματι τῷ ἰδίῳ, ἐκεῖνον λήμψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/043.yaml
  text: I have come in my Father's name[a], and you do not receive me. If another comes in his own name[b], you will receive him.
translation:
  language: tl
  text: Naparito ako sa pangalan ng aking Ama[a], at hindi ninyo ako tinatanggap. Kung may ibang paparito sa sarili niyang pangalan[b], siya ang tatanggapin ninyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “taglay ang awtoridad ng aking Ama.” Ang idyomang Griyego na “sa pangalan” ay maaaring magpahiwatig ng pagkatawan o awtoridad, hindi lamang ng mismong pangalan.
    reason: lexical_alternative
  - marker: b
    text: O “sa sarili niyang awtoridad.” Mariing isinasalungat ang “sa sarili niyang pangalan” sa pagparito ni Jesus “sa pangalan ng aking Ama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλήλυθα
  choice: Naparito ako
  rationale: Ipinahahayag ng perpektong anyo ang pagparito ni Jesus bilang naganap na may patuloy na kabuluhan; natural sa Tagalog ang “naparito ako” at angkop sa marangal na pananalita.
- source_word: ἐν τῷ ὀνόματι τοῦ πατρός μου
  choice: sa pangalan ng aking Ama
  rationale: Pinananatili nito ang idyomang Griyego at ang mga pahiwatig nito ng pagkatawan at awtoridad nang hindi nililimitahan ang kahulugan sa isa lamang sa mga iyon.
- source_word: οὐ λαμβάνετέ με
  choice: hindi ninyo ako tinatanggap
  rationale: Sa konteksto, ang λαμβάνω ay tumutukoy sa pagkilala o pagtanggap kay Jesus, hindi sa pisikal na pagkuha. Natural at malinaw sa modernong Tagalog ang “tinatanggap.”
- source_word: ἄλλος
  choice: may ibang
  rationale: Tuwirang ipinakikita nito ang kaibahan ng ibang taong darating at ni Jesus nang walang idinagdag na pagkakakilanlan.
- source_word: ἐν τῷ ὀνόματι τῷ ἰδίῳ
  choice: sa sarili niyang pangalan
  rationale: Pinananatili ang malinaw na paralelismo at pagsalungat sa “sa pangalan ng aking Ama,” pati ang pahiwatig ng sariling awtoridad.
- source_word: ἐκεῖνον λήμψεσθε
  choice: siya ang tatanggapin ninyo
  rationale: Ang ayos na “siya ang” ay likas na Tagalog na nagpapakita ng diin ng ἐκεῖνον, samantalang ang “tatanggapin” ay inuulit ang pandiwang ginamit sa unang sugnay.
- source_word: πατρός μου
  choice: aking Ama
  rationale: Ang “aking Ama” ay natural at marangal; ang malaking titik ay nagpapakitang ang tinutukoy ni Jesus ay ang Diyos nang walang idinaragdag na paliwanag sa pangunahing teksto.
theological_decisions:
- issue: Kung tahasang tutukuyin na ang “aking Ama” ay ang Diyos
  choice: Gamitin ang “Ama” na may malaking titik ngunit huwag idagdag ang salitang “Diyos.”
  alternative: “aking ama” na maliit ang titik, o “Diyos na aking Ama”
  rationale: Malinaw sa konteksto ng Juan na ang Diyos ang tinutukoy. Ang malaking titik ay tumutulong sa pagkilala sa banal na tinutukoy nang hindi nagdaragdag sa tekstong Griyego.
- issue: Kung ipaliliwanag bilang awtoridad ang “sa pangalan” sa pangunahing teksto
  choice: Panatilihin ang “sa pangalan” sa dalawang sugnay.
  alternative: “taglay ang awtoridad ng aking Ama” at “sa sarili niyang awtoridad”
  rationale: Maaaring tumukoy ang idyoma sa pagkatawan at awtoridad, ngunit ang tahasang pagsasalin nito bilang “awtoridad” ay magpapakitid sa saklaw ng kahulugan. Pinananatili rin ng napiling salin ang sinadyang paralelismo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang magkatugmang pariralang “sa pangalan” at ang pag-uulit ng “tinatanggap/tatanggapin” upang maipakita ang retorikal na pagsalungat ng orihinal.
