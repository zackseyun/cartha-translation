  yaml_path: translation/nt/john/005/047.yaml
  text: But if you do not believe his writings[a], how will you believe my words?
translation:
  language: tl
  text: Ngunit kung hindi ninyo pinaniniwalaan ang mga isinulat niya[a], paano ninyo paniniwalaan ang mga salita ko?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga sulat niya.” Ang salitang Griyego ay maaaring mangahulugang mga sulat o mga isinulat; dito, tumutukoy ito sa isinulat ni Moises.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Ngunit kung
  rationale: Likas na ipinapahayag sa Tagalog ang kondisyon at ang pagsalungat o paglipat mula sa naunang argumento.
- source_word: τοῖς ἐκείνου γράμμασιν
  choice: ang mga isinulat niya
  rationale: Sa konteksto, tumutukoy ito sa mga isinulat ni Moises. Malinaw at natural ang parirala nang hindi labis na tinutukoy ang mga ito bilang buong Kasulatan.
- source_word: οὐ πιστεύετε
  choice: hindi ninyo pinaniniwalaan
  rationale: Ang πιστεύω na may datibo rito ay tumutukoy sa pagtanggap sa mga isinulat bilang totoo o kapani-paniwala; pinananatili rin nito ang paralelismo sa ikalawang sugnay.
- source_word: πῶς
  choice: paano
  rationale: Pinananatili ang retorikal na tanong kung paanong maniniwala sila sa mga salita ni Jesus samantalang hindi nila pinaniniwalaan ang isinulat ni Moises.
- source_word: τοῖς ἐμοῖς ῥήμασιν
  choice: ang mga salita ko
  rationale: Natural na salin ng ῥήματα at malinaw na katapat ng 'mga isinulat niya.'
- source_word: πιστεύσετε
  choice: paniniwalaan
  rationale: Ipinahahayag ng anyong panghinaharap ang future indicative at inuulit ang parehong diwa ng πιστεύω sa unang sugnay.
theological_decisions:
- issue: Tinutukoy ng ἐκείνου
  choice: Ang “niya” ay tumutukoy kay Moises ayon sa agarang konteksto.
  alternative: Ulitin sa teksto ang pangalang “Moises,” o unawain itong may mas pangkalahatang tinutukoy.
  rationale: Tahasang binabanggit si Moises sa Juan 5:45–46. Pinananatili ng panghalip na “niya” ang anyo at pagkakaugnay ng Griyego nang hindi nilulutas sa mismong teksto ang malinaw nang kontekstuwal na reperensiya.
- issue: Diwa ng πιστεύω
  choice: Isalin bilang “pinaniniwalaan/paniniwalaan.”
  alternative: Isalin bilang “pinagkakatiwalaan/pagkakatiwalaan.”
  rationale: Ang konteksto ay nakatuon sa pagtanggap bilang totoo sa patotoo ng mga isinulat ni Moises at sa mga salita ni Jesus. Ang “maniwala” ang mas angkop at pinananatili ang retorikal na paralelismo.
translation_notes:
  register: Modernong Filipino Tagalog na natural, tuwiran, at marangal. Ginamit ang “ninyo” para sa maramihang kausap at ang karaniwang ayos na “mga salita ko” para sa malinaw na pananalita.
