    rationale: Hindi ito wastong Filipino at nabibigo nitong isalin nang malinaw ang ἐτάρασσεν (“ginugulo/pinapakilos”).
  - severity: medium
    issue: Hindi tumutugma ang talababa a sa pangunahing teksto.
    rationale: 'Sinasabi nitong “Sa ilang salin: ‘ay gumagaling,’” ngunit “ay gumagaling” na ang nasa teksto. Dapat itong magbigay ng tunay na alternatibo, gaya ng “ay gumaling,” at ipaliwanag kung bakit pinili ang aspektong paulit-ulit.'
