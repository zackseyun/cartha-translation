  source_fidelity: 'Ang pangunahing diwa ay tapat sa tekstong Robinson–Pierpont: paulit-ulit na pagbaba ng anghel, paggulo sa tubig, at paggaling ng unang pumasok pagkatapos nito. Gayunman, ang “kinuk stir” ay isang malinaw na sirang anyo at hindi maisasaalang-alang na wastong salin ng ἐτάρασσεν.'
  naturalness: Hindi likas at hindi katanggap-tanggap sa makabagong Filipino ang halo at putol na “kinuk stir.” Ang “ginugulo ang tubig” ay malinaw, natural, at sapat na malapit sa kahulugang “stir up.” Ang “palanguyan” ay mas karaniwang katumbas ng κολυμβήθρα kaysa “imbakan ng tubig” sa ganitong salaysay.
  terminology: Pinanatili ang “anghel,” “sakit,” at “palanguyan” sa marangal ngunit makabagong rehistro. Inayos din ang talababa sa aspekto upang ang iniaalok na alternatibo ay totoong alternatibong salin, sa halip na ulitin ang mismong nasa pangunahing teksto.
