  yaml_path: translation/nt/john/005/004.yaml
  text: For an angel would go down into the pool from time to time and stir up the water. Therefore, the first one to step in after the stirring of the water would become well from whatever disease afflicted him.
translation:
  language: tl
  text: Sapagkat paminsan-minsan ay bumababa ang isang anghel sa palanguyan at ginugulo nito ang tubig. Kaya ang unang lumusong matapos magulo ang tubig ay gumagaling[a] mula sa anumang sakit na dumapo sa kanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “ay gumaling.” Ipinahihiwatig ng imperpektong anyong Griego ang isang pangyayaring paulit-ulit noon.'
    reason: aspect_and_previous_rendering
  - marker: b
    text: Ang talatang ito, kasama ang huling bahagi ng talata 3, ay wala sa pinakamaagang mga papirong Griego, gaya ng Papyrus 66 at Papyrus 75 noong ikatlong siglo, at sa mahahalagang manuskrito noong ikaapat na siglo, ang Sinaiticus at Vaticanus. Naroon naman ito sa karamihang tradisyong manuskritong Byzantine, gayundin sa mga sinaunang saling Latin at Syriac. Malawak na itinuturing ng mga iskolar na maagang dagdag ito ng tagakopya upang ipaliwanag kung bakit nagtitipon sa palanguyan ang mga may kapansanan.
    reason: textual_critical
lexical_decisions:
- source_word: κατὰ καιρόν
  choice: paminsan-minsan
  rationale: Ipinahihiwatig ng parirala ang pana-panahon o di-tiyak na pag-ulit, hindi isang mahigpit na takdang panahon.
- source_word: κατέβαινεν
  choice: ay bumababa
  rationale: Ang imperpektong anyo ay nagpapahayag ng nakagawiang paulit-ulit na kilos; likas itong naihahatid sa Tagalog sa konteksto sa pamamagitan ng “paminsan-minsan ay bumababa.”
- source_word: ἐτάρασσεν
  choice: ginagalaw
  rationale: Tumutukoy ito sa paggambala o pagpapakilos sa tubig; natural at malinaw ang “ginagalaw ang tubig.”
- source_word: ἐμβὰς
  choice: lumusong
  rationale: Sa konteksto ng isang imbakan ng tubig, mas tiyak at likas ang “lumusong” kaysa sa pangkalahatang “pumasok.”
- source_word: ὑγιὴς ἐγίνετο
  choice: ay gumagaling
  rationale: Pinananatili ng “gumagaling” ang nakagawiang aspektong imperpekto at malinaw na ipinapahayag ang paggaling mula sa sakit.
- source_word: κατείχετο νοσήματι
  choice: karamdamang dumapo sa kanya
  rationale: Idyomatikong inilalarawan ng pasibong κατείχετο ang taong dinapuan o pinahihirapan ng anumang sakit.
theological_decisions:
- issue: Kalagayang tekstuwal ng talata
  choice: Isinama ang talata ayon sa ibinigay na Byzantine source at nilagyan ng talababa tungkol sa mahalagang pagkakaiba ng mga manuskrito.
  alternative: Alisin sa pangunahing teksto o ilagay lamang sa talababa.
  rationale: Ang itinakdang saligang edisyon ay Robinson–Pierpont Byzantine 2005, na naglalaman ng talata; gayunman, kailangang ipaalam sa mambabasa na wala ito sa pinakamaagang umiiral na mga papirong Griego at ilang pangunahing manuskrito.
- issue: Paglalahad sa pagpapagaling
  choice: Isinalin nang tuwiran ang pahayag ng Byzantine text nang hindi dinaragdagan ng paliwanag kung paano nangyari ang pagpapagaling.
  alternative: Ipakilala ito bilang paniniwala lamang ng mga naghihintay sa imbakan.
  rationale: Walang katagang “pinaniniwalaan” o katumbas nito sa ibinigay na tekstong Griego; ang pagdaragdag nito ay magpapasya sa isang teolohikal at pampanitikang tensiyong hindi nilulutas ng source.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “imbakan ng tubig” para sa κολυμβήθρα at “lumusong” para sa kilos ng pagpasok dito. Iniwasan ang sobrang pormal na “manaog” at teknikal na “periodiko.”
