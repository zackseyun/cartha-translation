id: JHN.5.11
reference: John 5:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸂ὃς δὲ⸃ ἀπεκρίθη αὐτοῖς· Ὁ ποιήσας με ὑγιῆ ἐκεῖνός μοι εἶπεν Ἆρον τὸν κράβαττόν σου καὶ περιπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/011.yaml
  text: But he answered them[a], “The one who made me well—that one said to me[b], ‘Pick up your mat and walk.’”
translation:
  language: tl
  text: Ngunit sumagot siya sa kanila, “Ang nagpagaling sa akin—siya ang nagsabi sa akin, ‘Buhatin mo ang iyong higaan[a] at lumakad ka.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “banig”; tumutukoy ang salitang Griyego sa isang payak na sapin o higaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: sumagot
  rationale: Karaniwang pandiwa sa salaysay para sa pagtugon sa sinabi o paratang; tuwiran at natural sa makabagong Filipino.
- source_word: Ὁ ποιήσας με ὑγιῆ
  choice: Ang nagpagaling sa akin
  rationale: Likas na ipinapahayag sa Filipino ang articular participle bilang “ang nag-...”; sa konteksto, ang ποιέω kasama ng ὑγιής ay tumutukoy sa pagpapagaling.
- source_word: ὑγιῆ
  choice: nagpagaling
  rationale: Malinaw na pisikal na paggaling ang tinutukoy sa konteksto; iniiwasan nito ang mas malawak na pahiwatig na maaaring dalhin ng “ginawang buo.”
- source_word: ἐκεῖνος
  choice: siya ang
  rationale: 'Pinananatili ang diin ng panghalip sa pamamagitan ng hiwalay na sugnay pagkatapos ng gitling: “—siya ang nagsabi,” sa halip na isama lamang ito sa naunang parirala.'
- source_word: Ἆρον
  choice: Buhatin mo
  rationale: Konkretong utos na iangat at dalhin ang bagay; malinaw at karaniwan sa Filipino.
- source_word: κράβαττόν
  choice: higaan
  rationale: Nauunawaan ng karaniwang mambabasa at hindi nililimitahan ang bagay sa isang hinabing banig; nililinaw ng talababa na payak na sapin o banig ang maaaring tinutukoy.
- source_word: περιπάτει
  choice: lumakad ka
  rationale: Natural na utos sa Filipino at sapat na naghahatid sa present imperative sa konteksto ng pagpapagaling.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita ang banayad na pagsalungat ng sagot ng lalaki sa naunang pagtutol ng mga kausap niya.
theological_decisions:
- issue: Saklaw ng kahulugan ng paglalarawan sa paggaling
  choice: nagpagaling sa akin
  alternative: ginawa akong buo
  rationale: Pisikal na paggaling ang tahasang iniulat sa konteksto. Maaaring magpahiwatig ang “ginawa akong buo” ng mas malawak na espirituwal na kahulugang hindi hinihingi ng Griyego rito.
translation_notes:
  register: Makabagong, natural, at marangal na Filipino. Ginamit ang “siya ang” pagkatapos ng gitling upang mapanatili ang diin ng ἐκεῖνος nang hindi nagiging artipisyal ang pangungusap. Inilagay ang tanging talababa sa mismong salitang “higaan,” na siyang tinutukoy ng leksikal na paliwanag.
