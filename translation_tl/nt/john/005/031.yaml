  text: If I testify about myself[a], my testimony is not true.
translation:
  language: tl
  text: Kung ako ang nagpapatotoo tungkol sa aking sarili, hindi totoo ang patotoo ko.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “hindi balido ang patotoo ko,” na nagpapakita ng kontekstong legal ng patotoo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν
  choice: Kung
  rationale: Karaniwang panandang pasubali ito at likas na naghahatid ng kondisyon sa argumento.
- source_word: ἐγὼ
  choice: ako
  rationale: Pinananatili ang tahasang panghalip sa Griyego, na bahagyang nagbibigay-diin kay Jesus bilang simuno.
- source_word: μαρτυρῶ
  choice: nagpapatotoo
  rationale: Natural sa modernong Filipino at pinananatili ang diwang pangsaksi o panghukuman ng pandiwa.
- source_word: περὶ ἐμαυτοῦ
  choice: tungkol sa aking sarili
  rationale: Tuwirang ipinapahayag ang kahulugang 'tungkol sa' nang hindi ipinapasok ang mas makitid na ideyang 'para sa sariling kapakanan.'
- source_word: ἡ μαρτυρία μου
  choice: ang patotoo ko
  rationale: Pinananatili ang ugnayang leksikal sa 'nagpapatotoo' at ang konteksto ng pagbibigay-saksi.
- source_word: οὐκ ἔστιν ἀληθής
  choice: hindi totoo
  rationale: Ito ang tuwirang salin ng ἀληθής at pinananatili ang tensiyon ng pahayag sa halip na paliitin agad ang kahulugan tungo sa legal na bisa lamang.
theological_decisions:
- issue: Ang kahulugan ng sinabi ni Jesus na ang kaniyang patotoo ay 'hindi totoo'
  choice: hindi totoo ang patotoo ko
  alternative: hindi balido ang patotoo ko
  rationale: Pinananatili ng pangunahing teksto ang tuwirang lakas ng ἀληθής at hindi nilulutas nang palihim ang tensiyon sa Juan 8:14. Gayunman, ipinapakita sa talababa ang posibleng kahulugang legal ayon sa konteksto ng patotoo.
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang 'nagpapatotoo' at 'patotoo' upang mapanatili ang pag-uugnay ng magkaugat na mga salita sa Griyego at ang himig na pangsaksi.
