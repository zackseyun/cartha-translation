base_translation:
  language: en
  yaml_path: translation/nt/john/005/030.yaml
  text: I am not able to do anything from myself. Just as I hear[a], I judge, and my judgment is just, because I do not seek my own will, but the will of the one who sent me.
translation:
  language: tl
  text: “Wala akong magagawa mula sa sarili ko.[a] Humahatol ako ayon sa naririnig ko, at makatarungan ang hatol ko, sapagkat hindi ko hinahangad ang sarili kong kalooban kundi ang kalooban ng nagsugo sa akin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Wala akong magagawa sa ganang sarili ko.” Maaaring idiin ng pariralang Griyego ang hindi pagkilos nang hiwalay o nang nagsasarili; pinanatili sa salin ang diwa ng pinagmumulan sa “mula sa sarili ko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ δύναμαι ἐγὼ
  choice: Wala akong magagawa
  rationale: Likas at malinaw na Filipino para sa tahasang pagkakaila ng kakayahan sa οὐ δύναμαι, habang nananatili ang diin sa nagsasalitang “ako.”
- source_word: ποιεῖν ἀπ’ ἐμαυτοῦ οὐδέν
  choice: mula sa sarili ko
  rationale: Pinananatili ng “mula sa” ang diwa ng pinagmumulan sa ἀπό, hindi lamang ang ideya ng paggawa nang nag-iisa o walang kasama.
- source_word: καθὼς ἀκούω κρίνω
  choice: Humahatol ako ayon sa naririnig ko
  rationale: Ipinapahayag ng “ayon sa” ang pagtutugma ng paghatol sa naririnig. Mas natural ito sa modernong Filipino kaysa sa mekanikal na “kung paanong naririnig ko,” nang hindi dinaragdagan ang sinasabi ng teksto.
- source_word: κρίνω / ἡ κρίσις ἡ ἐμὴ
  choice: humahatol / ang hatol ko
  rationale: Pinananatili ang ugnayang leksikal at ang panghukuman o hudisyal na diwa ng dalawang magkaugnay na salitang Griyego.
- source_word: δικαία
  choice: makatarungan
  rationale: Sa konteksto ng paghatol, malinaw na ipinahihiwatig nito na ang hatol ay patas at tama; mas angkop dito kaysa sa “matuwid.”
- source_word: οὐ ζητῶ
  choice: hindi ko hinahangad
  rationale: Ipinahahayag ang patuloy na layunin o pagpupunyagi ng ζητέω nang natural at marangal sa Filipino.
- source_word: τὸ θέλημα τὸ ἐμὸν
  choice: ang sarili kong kalooban
  rationale: Pinananatili ang diin ng emphatic possessive sa Griyego at ang teolohikal na salitang “kalooban,” sa halip na gawing mas maluwag na “ang gusto ko.”
- source_word: τοῦ πέμψαντός με
  choice: ng nagsugo sa akin
  rationale: Natural at maikli itong katumbas ng participial expression, at hindi nito ipinapasok ang “Ama” sa mismong teksto bagaman siya ang tinutukoy sa konteksto.
theological_decisions:
- issue: Ang ugnayan ng pagkilos ng Anak sa nagsugo sa kaniya sa ἀπ’ ἐμαυτοῦ
  choice: mula sa sarili ko
  alternative: nang sarili ko lamang / sa ganang sarili ko
  rationale: Pinananatili nito ang diin sa pinagmumulan at sa hindi malayang pagkilos hiwalay sa nagsugo sa kaniya, nang hindi ipinapaliwanag o nilulutas sa salin ang mas malawak na teolohikal na tensiyon.
- issue: Ang kahulugan ng δικαία kapag inilalarawan ang κρίσις
  choice: makatarungan
  alternative: matuwid
  rationale: Ang konteksto ay paghatol, kaya ang “makatarungan” ang pinakanatural na paglalarawan sa pagiging patas at tama ng hatol, nang hindi ikinakaila ang moral na saklaw na maaari ring taglayin ng salita.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “humahatol/hatol” upang mapanatili ang mahalagang pag-uulit sa Griyego, at iniwasan ang masyadong teknikal o denominasyonal na pagpapaliwanag.
