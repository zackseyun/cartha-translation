  to: 'Huwag ninyong isipin na ako ang magsasakdal sa inyo sa harap ng Ama.[a] May isang nagsasakdal sa inyo: si Moises,[b] na siyang pinaglagakan ninyo ng pag-asa.'
  rationale: Inayos ang pangunahing sugnay upang maging likas at malinaw sa modernong Tagalog, nang hindi pinapalitan ang tuwirang pagtukoy ng Griyego kay Moises bilang pinaglagakan ng pag-asa. Idinagdag ang “isang” upang higit na natural ang panimulang “May isang nagsasakdal,” at pinalitan ang gitling ng tutuldok para sa tuwirang pagpapakilala kay Moises. Inihanay rin ang panauhan ng talababa sa direktang pakikipag-usap ng talata.
