base_translation:
  language: en
  yaml_path: translation/nt/john/005/045.yaml
  text: 'Do not think that I will accuse you before the Father[a]; there is one who accuses you: Moses[b], in whom you have put your hope.'
translation:
  language: tl
  text: 'Huwag ninyong isipin na ako ang magsasakdal sa inyo sa harap ng Ama.[a] May isang nagsasakdal sa inyo: si Moises,[b] na siyang pinaglagakan ninyo ng pag-asa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Huwag ninyong ipalagay na ako ang maghaharap ng sakdal laban sa inyo sa Ama.”'
    reason: lexical_alternative
  - marker: b
    text: Si Moises—na pinagtiwalaan ninyo, lalo na bilang tagapamagitan at saksi ng Kautusan—ang tatayong tagapagsakdal ninyo.
    reason: cross_reference
lexical_decisions:
- source_word: μὴ δοκεῖτε
  choice: Huwag ninyong isipin
  rationale: Likas at tuwirang ipinapahayag nito sa modernong Tagalog ang pagbabawal na nasa μή kasama ng pangkasalukuyang pautos na δοκεῖτε.
- source_word: κατηγορήσω
  choice: magsasakdal
  rationale: Pinananatili ng “magsasakdal” ang legal o panghukumang diwa ng κατηγορέω nang hindi ito pinalalakas tungo sa “hahatol” o “magpaparusa.”
- source_word: πρὸς τὸν πατέρα
  choice: sa harap ng Ama
  rationale: Sa konteksto ng pagsasakdal, natural na inilalarawan ng pariralang ito ang pagharap sa Ama bilang siyang nasa harap kanino inihaharap ang sakdal, habang pinananatili ang titulong “Ama.”
- source_word: ἔστιν ὁ κατηγορῶν ὑμῶν
  choice: May nagsasakdal sa inyo
  rationale: Natural itong panimulang pahayag sa Tagalog at pinananatili ang nagpapatuloy na puwersa ng pangkasalukuyang pandiwaring κατηγορῶν.
- source_word: Μωϋσῆς
  choice: Moises
  rationale: Ito ang karaniwang anyo ng pangalan sa Tagalog.
- source_word: εἰς ὃν ὑμεῖς ἠλπίκατε
  choice: na siya ninyong pinaglagakan ng pag-asa
  rationale: Ipinahahayag nito ang tahasang pagtukoy kay Moises at ang perpektong aspekto ng ἠλπίκατε—isang pag-asang inilagak noon at nananatiling pinanghahawakan—nang hindi pinapalitan si Moises ng kautusan o ng kaniyang mga isinulat.
theological_decisions:
- issue: Legal na puwersa ng pahayag ni Jesus tungkol sa pagsasakdal
  choice: magsasakdal
  alternative: hahatol
  rationale: Ang κατηγορέω ay tumutukoy sa pag-aakusa o paghaharap ng sakdal, hindi sa pagpapasya ng hatol. Kaya hindi pinalalakas ng salin ang pahayag nang higit sa sinasabi ng Griyego.
- issue: Pinag-uukulan ng pag-asa
  choice: kay Moises mismo inilagak ang pag-asa
  alternative: sa kautusan ni Moises o sa mga isinulat ni Moises
  rationale: Tuwirang si Moises ang tinutukoy ng εἰς ὃν. Bagaman iniuugnay siya ng konteksto sa kaniyang mga isinulat, hindi iyon isiningit sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “magsasakdal” upang mapanatili ang legal na larawan ng talata, at ang “pinaglagakan ng pag-asa” upang maipahayag ang nananatiling pagtitiwala na ipinahihiwatig ng perpektong anyo ng pandiwa.
