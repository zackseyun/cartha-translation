base_translation:
  language: en
  yaml_path: translation/nt/john/005/017.yaml
  text: But he answered them[a], “My Father is working until now, and I also am working.”
translation:
  language: tl
  text: Ngunit sumagot siya sa kanila, “Ang aking Ama ay patuloy na gumagawa hanggang ngayon, at ako rin ay gumagawa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Nagpapahiwatig ito ng banayad na pagsalungat sa naunang paratang at likas na nag-uugnay sa tugon ni Jesus.
- source_word: ἀπεκρίνατο αὐτοῖς
  choice: sumagot siya sa kanila
  rationale: Tuwiran, malinaw, at likas na katumbas ng pandiwa at ng datibong tumutukoy sa mga sinagot.
- source_word: Ὁ πατήρ μου
  choice: ang aking Ama
  rationale: Pinananatili ang personal at teolohikal na bigat ng pagtukoy ni Jesus sa Diyos bilang kanyang Ama.
- source_word: ἕως ἄρτι
  choice: hanggang ngayon
  rationale: Tumpak na ipinahahayag ang pagpapatuloy ng gawain hanggang sa kasalukuyang sandali.
- source_word: ἐργάζεται
  choice: ay patuloy na gumagawa
  rationale: Malinaw na inilalahad ang nagpapatuloy na aspekto ng kasalukuyang gawain ng Ama sa kontekstong ito.
- source_word: κἀγὼ
  choice: at ako rin
  rationale: Pinananatili ang tahasang pagdaragdag at paghahanay ng gawain ni Jesus sa gawain ng Ama.
- source_word: ἐργάζομαι
  choice: ay gumagawa
  rationale: Likas sa Tagalog at, sa parallel na pangungusap, nagpapahayag ng kasalukuyang gawain ni Jesus nang hindi nagdaragdag ng paliwanag.
theological_decisions:
- issue: Ugnayan ng gawain ni Jesus sa gawain ng Ama sa araw ng Sabbath
  choice: 'Panatilihin ang tuwirang parallel: “Ang aking Ama ay patuloy na gumagawa hanggang ngayon, at ako rin ay gumagawa.”'
  alternative: “Ang aking Ama ay gumagawa hanggang ngayon, at gumagawa rin ako.”
  rationale: Sinasadyang magkatapat sa Griyego ang nagpapatuloy na gawain ng Ama at ang sariling gawain ni Jesus. Pinananatili ang teolohikal na tensiyon nang hindi ipinapasok ang paliwanag tungkol sa Sabbath, banal na karapatan, o pagkakapantay.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “patuloy na” sa unang sugnay upang luminaw ang duratibong diwa ng ἕως ἄρτι at ng kasalukuyang pandiwa; hindi na ito inulit sa ikalawang sugnay upang maiwasan ang mabigat na tunog, habang nananatiling malinaw ang parallel sa pamamagitan ng “at ako rin.”
