  source_fidelity: Tumpak ang salin sa Griyego. Ang “Ngunit” ay angkop para sa δέ; ang “sumagot siya sa kanila” ay wastong katumbas ng ἀπεκρίνατο αὐτοῖς. Naipapahayag ng “hanggang ngayon” ang ἕως ἄρτι, at malinaw na napapanatili ng “at ako rin ay gumagawa” ang dagdag at parallel na diin ng κἀγώ.
  naturalness: Likas at malinaw ito sa modernong Filipino Tagalog, na may marangal ngunit hindi artipisyal na rehistro. Ang “patuloy na gumagawa hanggang ngayon” ay idiomatiko at sapat na naghahayag ng nagpapatuloy na gawain.
