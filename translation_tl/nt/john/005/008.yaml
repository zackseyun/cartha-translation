  text: λέγει αὐτῷ ὁ Ἰησοῦς· ⸀Ἔγειρε ἆρον τὸν κράβαττόν σου καὶ περιπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/008.yaml
  text: Jesus says to him[a], “Get up, pick up your mat, and walk.”
translation:
  language: tl
  text: Sinabi ni Jesus sa kanya, “Bumangon ka, buhatin mo ang banig mo[a], at lumakad ka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “higaan mo.” Ang salitang Griyego ay tumutukoy sa isang payak na sapin o magaan na higaan na maaaring buhatin, hindi naman isang ganap na kama.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: Sinabi
  rationale: Bagaman nasa pangkasalukuyang panahunan ang Griyego bilang makasaysayang pangkasalukuyan, ang pangnagdaang “Sinabi” ang likas at malinaw na anyo sa makabagong salaysay sa Tagalog; hindi nito binabago ang panahon ng pangyayari.
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Tuwirang katumbas ng datibong di-tuwirang layon at natural sa Tagalog.
- source_word: Ἔγειρε
  choice: Bumangon ka
  rationale: Natural na pautos para sa pagbangon mula sa pagkakahiga; hindi nito idinaragdag ang di-tahasang ideya na “gumaling ka.”
- source_word: ἆρον
  choice: buhatin mo
  rationale: Ipinahahayag ang pisikal na pag-angat at pagdala sa magaan na higaan; mas tiyak dito kaysa sa pangkalahatang “kunin mo.”
- source_word: κράβαττόν
  choice: higaan
  rationale: Saklaw nito ang isang payak at naililipat na sapin o higaan nang hindi ipinapalagay na yari itong banig o isa itong mabigat na kama. Nililinaw ng talababa ang posibleng kahulugan.
- source_word: περιπάτει
  choice: lumakad ka
  rationale: Karaniwan at malinaw na pautos para sa pisikal na paglakad, nang hindi labis na tinutukoy ang aspektong patuloy.
theological_decisions:
- issue: Kalikasan ng utos ni Jesus sa konteksto ng pagpapagaling
  choice: 'Isinalin ang tatlong pautos bilang tuwirang pisikal na mga utos: bumangon, buhatin ang higaan, at lumakad.'
  alternative: “Bumangon ka at gumaling” o iba pang pagpapalawak na tahasang nagsasaad ng himala o paggaling.
  rationale: Ipinahihiwatig ng konteksto ang paggaling, ngunit hindi tahasang sinasabi sa mga salita ng talatang ito; kaya hindi ito idinagdag sa salin.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang karaniwang “Bumangon ka” at “lumakad ka,” habang pinanatiling payak at tuwiran ang tatlong utos.
