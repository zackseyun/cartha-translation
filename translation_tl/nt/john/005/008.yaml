  source_fidelity: 'Tumpak ang tatlong pautos: ang “Bumangon ka,” “buhatin mo,” at “lumakad ka” ay mahusay na naghahatid ng Ἔγειρε, ἆρον, at περιπάτει nang walang idinagdag na pahayag tungkol sa paggaling. Ang “higaan” ay posible para sa κράβαττος, ngunit mas madaling maunawaang karaniwang kama kaysa sa payak at nabubuhat na sapin.'
  naturalness: 'Nauunawaan ang draft, ngunit mas likas ang ayos na “Sinabi ni Jesus sa kanya” kaysa “Sinabi sa kanya ni Jesus.” May problema rin sa gramatika at daloy ang huling sugnay ng talababa: “hindi kinakailangang sa isang buong kama.”'
