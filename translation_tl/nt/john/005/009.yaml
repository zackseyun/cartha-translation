id: JHN.5.9
reference: John 5:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ εὐθέως ἐγένετο ὑγιὴς ὁ ἄνθρωπος καὶ ἦρε τὸν κράβαττον αὐτοῦ καὶ περιεπάτει. Ἦν δὲ σάββατον ἐν ἐκείνῃ τῇ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/009.yaml
  text: And immediately the man became well[a], and he picked up his mat and began to walk[c][b]. Now that day was a Sabbath.
translation:
  language: tl
  text: At kaagad na gumaling ang lalaki. Binuhat niya ang kanyang banig[a] at nagsimulang maglakad.[b] Sabbath ang araw na iyon.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “higaan.” Ang salitang Griyego ay tumutukoy sa payak at nabubuhat na banig, sapin, o higaan, hindi kinakailangang sa isang malaking kama.
    reason: lexical_alternative
  - marker: b
    text: O “naglalakad.” Maaaring bigyang-diin ng pandiwang Griyego ang nagpapatuloy na kilos; sa kontekstong ito, maaari rin itong unawain bilang pagsisimula niyang maglakad matapos gumaling.
    reason: lexical_alternative
  - marker: c
    text: 'Maaari ring isalin: “Araw ng Sabbath noon.” Literal na mababasa sa Griyego: “Sabbath noon sa araw na iyon.”'
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθέως
  choice: kaagad
  rationale: Malinaw at likas na ipinahahayag ang dagliang paggaling.
- source_word: ἐγένετο ὑγιὴς
  choice: gumaling
  rationale: Likas na Tagalog para sa paglipat ng lalaki mula sa karamdaman tungo sa mabuting kalagayan, nang hindi ginagawang tahasang balintiyak ang konstruksiyong Griyego.
- source_word: ὁ ἄνθρωπος
  choice: ang lalaki
  rationale: Tumutukoy sa partikular na lalaking nasa salaysay.
- source_word: ἦρε
  choice: binuhat
  rationale: Ipinahihiwatig sa konteksto ang pag-angat at pagdadala sa banig; natural itong pahayag sa modernong Tagalog.
- source_word: κράβαττον
  choice: banig
  rationale: Tumutukoy sa payak at nabubuhat na sapin o higaan, hindi kinakailangang sa malaking kama.
- source_word: περιεπάτει
  choice: nagsimulang maglakad
  rationale: Naipapakita ang pagpapatuloy o pagsisimula ng kilos na ipinahihiwatig ng imperpektibo, at natural sa konteksto ng bagong paggaling.
- source_word: Ἦν δὲ
  choice: … ang araw na iyon
  rationale: Ginawang hiwalay na pangungusap ang paliwanag na pansalaysay; hindi kailangan sa Tagalog ang tahasang katumbas ng δέ.
- source_word: σάββατον
  choice: Sabbath
  rationale: Pinananatili ang kinikilalang pangalan ng banal na araw ng mga Judio nang hindi nagdaragdag ng interpretasyong teolohikal.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: ang araw na iyon
  rationale: Natural na Tagalog para sa pagtukoy sa mismong araw ng pangyayari.
theological_decisions:
- issue: Pagkakakilanlan sa σάββατον bilang banal na araw ng mga Judio
  choice: Sabbath ang araw na iyon
  alternative: Araw ng Sabbath noon
  rationale: Malapit ito sa literal na ayos na ‘Sabbath noon sa araw na iyon’ at malinaw na nagsisilbing pansalaysay na pahiwatig para sa susunod na pagtatalo, nang hindi nilulutas ang usapin gamit ang di-tahasang teolohikal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “Sabbath” bilang pamilyar na terminong biblikal at ang “banig” upang maiwasang maisip ang isang malaking kasangkapang kama.
