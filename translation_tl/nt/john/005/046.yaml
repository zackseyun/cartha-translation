base_translation:
  language: en
  yaml_path: translation/nt/john/005/046.yaml
  text: For if you believed Moses[a], you would believe me[b], for he wrote about me.
translation:
  language: tl
  text: Sapagkat kung pinaniwalaan ninyo si Moises, pinaniwalaan sana ninyo ako, sapagkat sumulat siya tungkol sa akin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Sapagkat kung
  rationale: Pinananatili ng “sapagkat” ang ugnayang nagbibigay-katwiran sa naunang argumento, habang malinaw na ipinakikilala ng “kung” ang kondisyon.
- source_word: ἐπιστεύετε Μωϋσεῖ
  choice: talagang pinaniwalaan ninyo si Moises
  rationale: 'Ang “pinaniwalaan” ay natural na katumbas ng πιστεύω na may taong nasa datibo: itinuring na totoo at mapagkakatiwalaan ang sinabi ni Moises. Ang “talagang” ay tumutulong ihayag ang di-tunay o salungat-sa-katotohanang kondisyon nang hindi dinaragdagan ang nilalaman.'
- source_word: ἐπιστεύετε ἂν ἐμοί
  choice: paniniwalaan din sana ninyo ako
  rationale: Ang “sana” ay likas na Filipino para sa apodosis na salungat sa katotohanan na ipinahihiwatig ng imperfect na may ἄν. “Ako” ang tuwirang pinaniniwalaan; hindi idinagdag ang konseptong “sumampalataya sa akin,” sapagkat walang εἰς sa Griyego.
- source_word: περὶ γὰρ ἐμοῦ
  choice: dahil ... tungkol sa akin
  rationale: Ang περί na may genitive ay malinaw at natural na isinasalin bilang “tungkol sa.” Ang ikalawang γάρ ay ipinahayag bilang “dahil” upang maging natural ang daloy sa Filipino.
- source_word: ἐκεῖνος
  choice: siya
  rationale: Tumutukoy ito pabalik kay Moises. Natural sa Filipino ang “siya”; sapat na nililinaw ng konteksto ang reperente kahit hindi literal na “ang isang iyon.”
- source_word: ἔγραψεν
  choice: sumulat
  rationale: Ang payak na aspektong pangyayari ng aorist ay natural na naihahayag ng “sumulat” sa kontekstong ito.
theological_decisions:
- issue: Ang uri ng patotoo ni Moises tungkol kay Jesus
  choice: sumulat siya tungkol sa akin
  alternative: sumulat ang isang iyon hinggil sa akin
  rationale: Pinananatili ng salin ang pahayag na ang mga isinulat ni Moises ay tumutukoy kay Jesus, ngunit hindi nito tinutukoy ang isang partikular na talata o pinalalawak ang pahayag tungo sa isang denominasyonal na pagpapakahulugan.
- issue: Kahulugan ng πιστεύω na may datibo
  choice: pinaniwalaan ... paniniwalaan ... ako
  alternative: nagtiwala ... magtitiwala ... sa akin
  rationale: Pinananatili ang iisang pandiwa sa dalawang sugnay at ang tuwirang ugnayan sa taong pinaniniwalaan. Iniiwasan nitong ipasok ang mas teknikal na pariralang “sumampalataya sa akin,” na karaniwang maaaring magpahiwatig ng konstruksiyong may εἰς.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Pinanatili ang retorikal na “sapagkat,” at ginamit ang “sana” upang malinaw at natural na ihayag ang kondisyong salungat sa katotohanan. Walang footnote dahil hindi kailangan ng publikasyong teksto ang mga alternatibo upang mapanatili ang mahalagang kahulugan.
