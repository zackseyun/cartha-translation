  text: ἐκεῖνος ἦν ὁ λύχνος ὁ καιόμενος καὶ φαίνων, ὑμεῖς δὲ ἠθελήσατε ἀγαλλιαθῆναι πρὸς ὥραν ἐν τῷ φωτὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/035.yaml
  text: He was the lamp that was burning and shining[a], and you were willing to rejoice for a time in his light.
translation:
  language: tl
  text: Siya ang ilawang nagniningas at nagliliwanag, ngunit ninais ninyong magalak nang sandaling panahon[a] sa kanyang liwanag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaaring isalin: “sa isang oras.” Ang parirala ay tumutukoy sa limitado o pansamantalang panahon, hindi kinakailangang literal na animnapung minuto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνος
  choice: Siya
  rationale: Tumutukoy ito nang may diin kay Juan Bautista; natural sa konteksto ang “Siya” kaysa sa mas mabigat na “Ang taong iyon.”
- source_word: λύχνος
  choice: ilawan
  rationale: Ang salita ay tumutukoy sa isang lampara o ilawan, hindi sa liwanag bilang abstraktong bagay. Pinananatili ng “ilawan” ang pagkakaiba ni Juan bilang tagapagdala ng liwanag at ni Jesus bilang ang liwanag sa mas malawak na konteksto ng Juan.
- source_word: καιόμενος
  choice: nagniningas
  rationale: Inilalarawan ng kasalukuyang participle ang patuloy na pag-aalab ng ilawan. Ang “nagniningas” ay natural, masigla, at kaakibat nang maayos ng “nagliliwanag.”
- source_word: φαίνων
  choice: nagliliwanag
  rationale: Sa kontekstong ito, nangangahulugan itong naglalabas o nagbibigay ng liwanag, hindi basta nagpapakita lamang.
- source_word: ἠθελήσατε
  choice: ninais ninyo
  rationale: Ipinahahayag nito ang kanilang kusang pagnanais o pagkiling. Hindi nito ipinapalagay na nagtagal ang pagnanais na iyon.
- source_word: ἀγαλλιαθῆναι
  choice: magalak
  rationale: Ipinahahayag ng pandiwa ang matinding kagalakan. Ang “magalak” ay natural, marangal, at madaling maunawaan sa makabagong Filipino.
- source_word: πρὸς ὥραν
  choice: nang sandaling panahon
  rationale: Ang parirala ay tumutukoy sa isang limitado at pansamantalang panahon, hindi kinakailangang literal na animnapung minuto.
- source_word: ἐν τῷ φωτὶ αὐτοῦ
  choice: sa kanyang liwanag
  rationale: Pinananatili nito ang metapora ng pagkagalak sa loob ng saklaw o impluwensiya ng liwanag na ibinibigay ng patotoo ni Juan.
theological_decisions:
- issue: Ang metaporikal na pagkakaiba ni Juan at ni Jesus sa larawan ng liwanag sa Ebanghelyo ni Juan
  choice: Isinalin si Juan bilang “ilawan,” hindi “liwanag.”
  alternative: “Siya ang liwanag”
  rationale: Ginagamit ng Griyego ang λύχνος, hindi φῶς. Kaya si Juan ay inilalarawang tagapagdala ng liwanag at saksi rito, hindi bilang ang mismong sukdulang liwanag. Pinananatili ng salin ang pagkakaibang ito nang hindi nagdaragdag ng paliwanag sa teksto.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “ilawan,” “nagniningas,” at “nagliliwanag” upang mapanatili ang matingkad na metapora at ang pagkakaiba ng sisidlan ng liwanag sa liwanag mismo. Inilagay ang panandang [a] kaagad pagkatapos ng pariralang tinatalakay ng talababa.
