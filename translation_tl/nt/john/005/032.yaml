  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἄλλος ἐστὶν ὁ μαρτυρῶν περὶ ἐμοῦ, καὶ οἶδα ὅτι ἀληθής ἐστιν ἡ μαρτυρία ἣν μαρτυρεῖ περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/032.yaml
  text: There is another who testifies about me[a], and I know that the testimony which he testifies about me is true.
translation:
  language: tl
  text: May isa pang nagpapatotoo tungkol sa akin[a], at alam kong totoo ang patotoong ibinibigay niya tungkol sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sumasaksi tungkol sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλος
  choice: ibang
  rationale: Tuwirang ipinahihiwatig nito na may isa pang tagapagpatotoo, habang hindi tinutukoy kung sino siya.
- source_word: ὁ μαρτυρῶν
  choice: nagpapatotoo
  rationale: Natural sa makabagong Filipino at pinananatili ang patuloy na diwa ng present participle at ang kontekstong may kaugnayan sa patotoo.
- source_word: περὶ ἐμοῦ
  choice: tungkol sa akin
  rationale: Karaniwan at tumpak na katumbas ng pariralang tumutukoy sa paksa ng patotoo.
- source_word: οἶδα
  choice: alam ko
  rationale: Direkta at natural na katumbas ng pandiwa ng pagkaalam.
- source_word: ἀληθής
  choice: totoo
  rationale: Pinananatili ang payak na pahayag tungkol sa katotohanan ng patotoo nang hindi ito pinakikitid sa kahulugang legal na bisa o personal na katapatan.
- source_word: ἡ μαρτυρία
  choice: ang patotoo
  rationale: Angkop sa kontekstong may bahid legal at pinananatili ang ugnayang leksikal sa “nagpapatotoo.”
- source_word: ἣν μαρτυρεῖ
  choice: ibinibigay niya
  rationale: Natural na Filipino para sa pagbibigay ng patotoo; iniiwasan ang alanganing “patotoong pinatototohanan” habang nananatili ang relative-clause sense.
theological_decisions:
- issue: Pagkakakilanlan ng tinutukoy na ἄλλος
  choice: Hindi tinukoy; isinalin lamang na “ibang.”
  alternative: Tukuyin bilang si Juan Bautista, ang Ama, o isa pang saksi.
  rationale: Hindi tahasang pinapangalanan ng talata ang tinutukoy, kaya pinananatili ng salin ang tunay na kalabuan nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit ng “tungkol sa akin” at ang ugnayan ng “nagpapatotoo” at “patotoo,” ngunit ginawang likas sa Filipino ang ikalawang pandiwa.
