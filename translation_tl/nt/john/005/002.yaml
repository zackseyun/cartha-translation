  text: ἔστιν δὲ ἐν τοῖς Ἱεροσολύμοις ἐπὶ τῇ προβατικῇ κολυμβήθρα ἡ ἐπιλεγομένη Ἑβραϊστὶ ⸀Βηθεσδά, πέντε στοὰς ἔχουσα·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/002.yaml
  text: There is in Jerusalem[a], by the Sheep Gate, a pool called Bethesda in Hebrew[c][b], having five porticoes.
translation:
  language: tl
  text: Sa Jerusalem, sa may Pintuan ng mga Tupa[c], ay may isang imbakan ng tubig na sa Hebreo[a] ay tinatawag na Bethesda[b]. May limang portiko ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa Aramaiko.” Ang pananalitang “sa Hebreo” ni Juan ay madalas tumukoy sa lokal na wikang Semitiko ng Judea, hindi lamang sa klasikong Hebreo sa mahigpit na kahulugan.
    reason: lexical_alternative
  - marker: b
    text: “Bethesda” ang mababasa rito sa SBLGNT. “Bethzatha” o “Bethsaida” naman ang mababasa sa ilang manuskrito.
    reason: textual_variant
  - marker: c
    text: Malamang na tumutukoy ang Griyego sa lugar ng Pintuan ng mga Tupa (ihambing sa Nehemias 3:1; 12:39), bagaman hindi tahasang nakasulat dito ang salitang “Pintuan.”
    reason: cross_reference
lexical_decisions:
- source_word: ἔστιν δὲ
  choice: ay may
  rationale: Pinananatili ang panahunang pangkasalukuyan ng ἔστιν at natural na ipinahahayag sa Tagalog ang pag-iral; hindi na tahasang isinalin ang mahinang pang-ugnay na δέ.
- source_word: ἐν τοῖς Ἱεροσολύμοις
  choice: Sa Jerusalem
  rationale: Ginamit ang karaniwang anyo ng pangalan ng lungsod sa Filipino.
- source_word: ἐπὶ τῇ προβατικῇ
  choice: sa may Pintuan ng mga Tupa
  rationale: Eliptikal ang Griyego at malamang na tumutukoy sa lugar ng Sheep Gate; idinagdag ang 'Pintuan' para maging malinaw, habang minarkahan ang interpretasyong ito sa talababa.
- source_word: κολυμβήθρα
  choice: isang tipunang-tubig
  rationale: Tumutukoy sa isang pool o imbakan ng tubig; ang 'tipunang-tubig' ay malinaw at hindi nagpapahiwatig na palanguyan lamang ito.
- source_word: ἡ ἐπιλεγομένη
  choice: na tinatawag
  rationale: Likas at tuwirang katumbas ng pariralang nagpapakilala sa pangalan.
- source_word: Ἑβραϊστὶ
  choice: sa Hebreo
  rationale: Sinusunod ng pangunahing teksto ang tahasang salita ng Griyego; inilalahad sa talababa na maaari itong tumukoy sa lokal na wikang Semitiko, kabilang ang Aramaico.
- source_word: Βηθεσδά
  choice: Bethesda
  rationale: Sinusunod ang anyong nasa SBLGNT; inilalagay sa talababa ang mahahalagang ibang pagbasa ng mga manuskrito.
- source_word: πέντε στοὰς ἔχουσα
  choice: Mayroon itong limang portiko
  rationale: Ang στοά ay may-bubong na hanay o pasilyong may mga haligi. Ang 'portiko' ay maikli at tumpak; ginawang hiwalay na pangungusap para sa likas na daloy sa Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang kasalukuyang panahon, iniwasan ang di-kailangang panandang diskurso sa simula, at ginamit ang 'portiko' bilang tumpak na terminong arkitektural. Ang lahat ng talababa ay minarkahan sa mismong teksto.
