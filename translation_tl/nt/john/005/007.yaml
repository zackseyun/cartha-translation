id: JHN.5.7
reference: John 5:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτῷ ὁ ἀσθενῶν· Κύριε, ἄνθρωπον οὐκ ἔχω ἵνα ὅταν ταραχθῇ τὸ ὕδωρ βάλῃ με εἰς τὴν κολυμβήθραν· ἐν ᾧ δὲ ἔρχομαι ἐγὼ ἄλλος πρὸ ἐμοῦ καταβαίνει.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/007.yaml
  text: The sick man answered him, “Lord, I have no one to put me into the pool when the water is stirred up; but while I am coming, another goes down before me.”
translation:
  language: tl
  text: Sumagot sa kanya ang maysakit, “Ginoo[a], wala akong magpasok sa akin sa palanguyan kapag nagugulo ang tubig; ngunit habang papunta ako roon, may ibang bumababa bago ako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Panginoon.” Ang salitang Griego ay maaaring magalang na pantawag na “Ginoo” o mangahulugang “Panginoon.”
    reason: Pinananatili ang leksikal na kalabuan ng κύριε sa kontekstong hindi pa malinaw kung gaano ang pagkakilala ng maysakit kay Jesus.
lexical_decisions:
- source_word: ὁ ἀσθενῶν
  choice: ang maysakit
  rationale: Tuwirang inilalarawan ang lalaking may karamdaman nang hindi nagdaragdag ng uri o tagal ng kanyang kalagayan.
- source_word: Κύριε
  choice: Panginoon
  rationale: Pinananatili ang karaniwang salin ng κύριε at ang posibleng mas mataas na pahiwatig nito sa salaysay; nililinaw sa talababa na maaari rin itong maging magalang na pantawag.
- source_word: βάλῃ με εἰς τὴν κολυμβήθραν
  choice: maglusong sa akin sa paliguan
  rationale: Mas natural sa Filipino kaysa sa literal na ‘ilagay ako’; ipinahihiwatig ng konteksto ang pagpapababa sa taong maysakit papasok sa tubig.
- source_word: ὅταν ταραχθῇ τὸ ὕδωρ
  choice: kapag nagalaw ang tubig
  rationale: Ang pasibong ταραχθῇ ay inilalarawang nagalaw o nabagabag ang tubig nang hindi tinutukoy kung sino o ano ang gumawa nito.
- source_word: ἐν ᾧ δὲ ἔρχομαι ἐγώ
  choice: Habang papunta ako
  rationale: Natural na ipinapahayag ang sabayang kilos at ang mabagal na sariling pagsisikap ng nagsasalita.
- source_word: ἄλλος πρὸ ἐμοῦ καταβαίνει
  choice: may ibang nauuna sa akin
  rationale: Ipinapahayag nang malinaw ang diwa ng paglusong ng ibang tao bago siya, nang hindi inuulit ang lokasyon na malinaw na sa konteksto.
theological_decisions:
- issue: Saklaw ng κύριε bilang pantawag kay Jesus
  choice: Panginoon
  alternative: Ginoo / ginoo
  rationale: Maaaring mangahulugan ang κύριε ng magalang na ‘ginoo’ o ng ‘Panginoon.’ Pinili sa teksto ang tradisyonal at salaysay-na-angkop na ‘Panginoon,’ ngunit hindi ipinapalagay na ganap nang nauunawaan ng lalaki ang pagkakakilanlan ni Jesus; pinananatili sa talababa ang leksikal na kalabuan.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “maglusong” at “paliguan” upang maging natural ang tagpo, habang iniwasang tukuyin ang sanhi ng paggalaw ng tubig sapagkat hindi ito sinasabi sa talata.
