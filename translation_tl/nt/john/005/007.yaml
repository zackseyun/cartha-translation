  source_fidelity: 'Kailangang itama ang ilang detalye upang masundan ang Griyego: ang βάλῃ με εἰς ay pagpasok/paglalagay sa loob ng imbakan ng tubig, at ang ἄλλος ... καταβαίνει ay tahasang nagsasabing may ibang bumababa bago siya. Ang «Ginoo» ay mas ligtas na pangunahing salin ng κύριε rito, sapagkat nananatili ang magalang na pantawag nang hindi pinipilit ang mas ganap na kahulugang teolohikal; itinatala ng talababa ang alternatibong «Panginoon».'
  naturalness: Mas natural at malinaw ang «walang magpasok sa akin sa palanguyan» kaysa «walang ... maglusong sa akin sa paliguan». Ang «habang papunta ako roon» ay maayos na Filipino at ang kasunod na «may ibang bumababa» ay ibinabalik ang kilos na nasa pinagmulan.
  terminology: Ang «palanguyan» ay isang natural na modernong katawagan para sa κολυμβήθρα sa tagpong ito. Ang «Ginoo» para sa κύριε ay pinananatiling bukás sa saklaw na magalang na pantawag o «Panginoon» sa talababa.
