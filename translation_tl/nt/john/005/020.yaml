base_translation:
  language: en
  yaml_path: translation/nt/john/005/020.yaml
  text: For the Father loves the Son and shows him all that he himself is doing; and he will show him greater works than these[a], so that you may marvel.
translation:
  language: tl
  text: Sapagkat iniibig ng Ama ang Anak at ipinakikita niya sa Anak ang lahat ng ginagawa ng Ama mismo. At ipapakita niya sa Anak ang mga gawang higit pa sa mga ito[a], upang mamangha kayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “kaya mamamangha kayo.” Ang Griyegong ἵνα na sinusundan ng pandiwang nasa pasakaling anyo ay maaaring magpahayag ng layunin at, sa kontekstong ito, maaari ring magpahiwatig ng resultang pagkamangha ng mga nakikinig kay Jesus.'
    reason: alternative_reading
lexical_decisions:
- source_word: φιλεῖ
  choice: iniibig
  rationale: Likas at marangal na katumbas ito ng personal na pag-ibig ng Ama sa Anak. Hindi nito pinahihina ang φιλέω na para bang mas mababa ito sa ἀγαπάω.
- source_word: δείκνυσιν / δείξει
  choice: ipinakikita / ipapakita
  rationale: Pinananatili ang ugnayang leksikal ng kasalukuyan at panghinaharap na anyo ng parehong pandiwa.
- source_word: πάντα
  choice: ang lahat
  rationale: Tuwirang ipinahahayag ang malawak at saklaw-lahat na diwa ng πάντα sa natural na Tagalog.
- source_word: ἃ αὐτὸς ποιεῖ
  choice: ng ginagawa niya mismo
  rationale: Ang kasalukuyang aspekto ng ποιεῖ ay naipahahayag ng “ginagawa,” at ang “mismo” ay nagpapanatili sa diin ng αὐτός sa Ama bilang gumagawa.
- source_word: μείζονα τούτων ... ἔργα
  choice: ang mga gawang higit pa sa mga ito
  rationale: Pinananatili ng “mga gawa” ang mahalagang gamit ng ἔργα sa Juan, habang ang “higit pa” ay likas na naghahatid ng paghahambing nang hindi nililimitahan kung ito ay higit sa laki, bigat, o kabuluhan.
- source_word: ἵνα ὑμεῖς θαυμάζητε
  choice: upang mamangha kayo
  rationale: Ang “upang” ay nagpapanatili sa layunin/resultang puwersa ng ἵνα, at malinaw na pangmaramihan ang “kayo.”
theological_decisions:
- issue: Ang uri ng pag-ibig ng Ama sa Anak na ipinahahayag ng φιλεῖ
  choice: Isinalin bilang “iniibig” nang walang pahiwatig na mas mababa o tao lamang ang pag-ibig na ito.
  alternative: “kinagigiliwan” o “may pagmamahal sa”
  rationale: Maaaring magkalapit ang gamit ng φιλέω at ἀγαπάω sa Juan. Ang “iniibig” ay nagpapanatili sa matalik na ugnayan ng Ama at Anak nang hindi nag-aangkat ng di-kailangang teolohikal na pagkakaiba.
- issue: Puwersa ng ἵνα ὑμεῖς θαυμάζητε
  choice: “upang mamangha kayo”
  alternative: “kaya mamamangha kayo” o “upang maaari kayong mamangha”
  rationale: Pinananatili ng “upang” ang tunay na posibilidad ng layunin at kaugnay na resulta sa ἵνα na may pasakali, nang hindi ito ginagawang tahasang prediksiyon lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ipinakikita/ipapakita” upang mapanatili ang pag-uulit sa Griyego, at “mamangha” para sa dignidad at lakas ng θαυμάζω.
