base_translation:
  language: en
  yaml_path: translation/nt/john/005/026.yaml
  text: For just as the Father has life in himself[b][a], so he also granted the Son to have life in himself.
translation:
  language: tl
  text: Sapagkat kung paanong ang Ama ay may buhay sa kanyang sarili[a], gayundin, ipinagkaloob niya sa Anak[b] na magkaroon ng buhay sa kanyang sarili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “buhay sa kanyang sarili” ay maaaring unawain bilang buhay na likas sa mismong sarili. Pinananatili rito ang anyo ng Griyego sa halip na gumamit ng teknikal na katawagang teolohikal.
    reason: lexical_alternative
  - marker: b
    text: O “ibinigay niya sa Anak na magkaroon ng buhay sa kanyang sarili.” Ang pandiwang Griyego ay ang karaniwang salita para sa “ibinigay”; ginamit sa pangunahing teksto ang “ipinagkaloob” bilang likas na salin sa Filipino.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Sapagkat kung paanong
  rationale: Pinagsasama nito ang paliwanag na diwa ng γάρ at ang paghahambing ng ὥσπερ, habang pinananatili ang kaugnayan sa naunang pahayag.
- source_word: ὁ πατὴρ
  choice: ang Ama
  rationale: Tiyak na titulong tumutukoy sa Diyos bilang Ama sa kontekstong Juaniko.
- source_word: ἔχει ζωὴν
  choice: ay may buhay
  rationale: Tuwirang inilalahad ang kasalukuyang pag-iral o pagtataglay ng buhay nang hindi dinaragdagan ang kahulugan.
- source_word: ζωὴν ἐν ἑαυτῷ
  choice: buhay sa kanyang sarili
  rationale: Pinananatiling hayag ang pariralang ἐν ἑαυτῷ at iniiwasang palitan ito ng mas teknikal at interpretatibong pananalitang teolohikal.
- source_word: οὕτως καὶ
  choice: gayundin
  rationale: Likas na katumbas sa Filipino na nagpapanatili sa ugnayang paghahambing ng ὥσπερ…οὕτως at sa diwa ng καί.
- source_word: τῷ υἱῷ
  choice: sa Anak
  rationale: Isinasalin ang datibong di-tuwirang layon ng ἔδωκεν at pinananatili ang titulo sa konteksto.
- source_word: ἔδωκεν
  choice: ipinagkaloob
  rationale: Ipinahahayag ang natapos na pagbibigay at ang diwa ng kaloob na karapatan, habang ang mas literal na “ibinigay” ay inilalagay bilang alternatibo sa talababa.
- source_word: ζωὴν ἔχειν
  choice: na magkaroon ng buhay
  rationale: Natural na salin sa Filipino ng konstruksiyong pawatas na kasunod ng ἔδωκεν.
- source_word: ἐν ἑαυτῷ
  choice: sa kanyang sarili
  rationale: Eksaktong inuulit ang parirala upang mapanatili ang pagkakapantay ng anyo sa pahayag tungkol sa Ama at sa Anak.
theological_decisions:
- issue: Kung gagawing tahasang teknikal na pahayag tungkol sa sariling pag-iral ang “ζωὴν ἐν ἑαυτῷ”
  choice: Panatilihin ang “buhay sa kanyang sarili.”
  alternative: “buhay na umiiral sa ganang sarili” o teknikal na katawagang tumutukoy sa aseity
  rationale: Mabigat ang teolohikal na pahiwatig ng parirala, ngunit ang mismong Griyego ay ἐν ἑαυτῷ. Pinananatili ng salin ang biblikal na pananalita at hindi ipinapalit ang isang mas huling teknikal na termino.
- issue: Kung paano ihahayag ang pagbibigay ng Ama sa Anak sa ἔδωκεν
  choice: Isalin bilang “ipinagkaloob” nang hindi nagdaragdag ng paliwanag sa pangunahing teksto.
  alternative: “ibinigay”
  rationale: Malinaw na nagsasaad ang teksto ng pagbibigay ng Ama sa Anak. Hindi ito dapat palambutin o dagdagan ng paliwanag na lulutas sa tensiyong teolohikal; sapat na panatilihin ang pahayag ayon sa pagkakasulat.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinananatili ang magkatulad na pariralang “sa kanyang sarili” para sa Ama at sa Anak, at iniiwasan ang teknikal na terminolohiyang hindi tahasang nasa teksto.
