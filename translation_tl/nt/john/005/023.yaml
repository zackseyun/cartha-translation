id: JHN.5.23
reference: John 5:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἵνα πάντες τιμῶσι τὸν υἱὸν καθὼς τιμῶσι τὸν πατέρα. ὁ μὴ τιμῶν τὸν υἱὸν οὐ τιμᾷ τὸν πατέρα τὸν πέμψαντα αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/023.yaml
  text: so that all may honor the Son just as they honor the Father. The one who does not honor the Son does not honor the Father who sent him.
translation:
  language: tl
  text: upang parangalan ng lahat ang Anak, kung paanong pinararangalan nila ang Ama. Ang hindi nagpaparangal sa Anak ay hindi nagpaparangal sa Amang nagsugo sa kanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: upang
  rationale: Likas na ipinahahayag ng “upang” ang layunin o nilalayong bunga ng sugnay, gaya ng puwersa ng ἵνα sa konteksto.
- source_word: πάντες
  choice: lahat
  rationale: Tuwirang katumbas ito ng pangkalahatang saklaw ng πάντες at malinaw sa karaniwang Tagalog.
- source_word: τιμῶσι / τιμῶν / τιμᾷ
  choice: parangalan / nagpaparangal / pinararangalan
  rationale: Iisang salitang-ugat ang pinanatili sa lahat ng paglitaw upang maipakita ang sinadyang pag-uulit ng Griyego. Ang “parangalan” ay nagpapahiwatig ng pagbibigay ng nararapat na dangal, hindi lamang panloob na paggalang.
- source_word: τὸν υἱὸν
  choice: ang Anak
  rationale: Ang “Anak” ay personal at Cristolohikong titulo sa konteksto; ang malaking titik ay karaniwang editoryal na paraan sa Filipino upang ipakita ang gamit bilang titulo.
- source_word: καθὼς
  choice: kung paanong
  rationale: Pinananatili nito ang mariing paghahambing at pagtutumbas ng paraan ng pagpaparangal sa Anak at sa Ama nang hindi nagdaragdag ng paliwanag.
- source_word: τὸν πατέρα
  choice: ang Ama
  rationale: Malinaw na personal na titulo ng Diyos sa konteksto; natural sa modernong saling Filipino ang malaking titik.
- source_word: ὁ μὴ τιμῶν
  choice: Ang hindi nagpaparangal
  rationale: Natural na pangkalahatang pahayag ito sa Tagalog at pinananatili ang gnomic o pangkalahatang puwersa ng articular participle.
- source_word: τὸν πέμψαντα αὐτόν
  choice: sa Amang nagsugo sa kanya
  rationale: Ang sugnay na “nagsugo sa kanya” ay malinaw na naglalarawan sa Ama bilang nagsugo sa Anak, habang nananatiling maikli at natural.
- source_word: πέμψαντα
  choice: nagsugo
  rationale: Ang “nagsugo” ay angkop sa personal na pagpapadala na may layunin at karaniwan sa biblikal ngunit nauunawaang Filipino; hindi nito labis na tinutukoy ang detalye ng atas.
theological_decisions:
- issue: Lakas ng paghahambing sa pagpaparangal sa Anak at sa Ama
  choice: Isinalin ang καθὼς bilang “kung paanong,” na nagpapanatili sa matibay na pagtutugma ng pagpaparangal.
  alternative: “gaya ng” o isang mas mahinang pahayag ng pagkakatulad
  rationale: Ipinapahayag ng Griyego ang malinaw na pagtutugma. Hindi ito dapat pahinain, ngunit hindi rin dapat dagdagan ng wikang mula sa mga sumunod na pormulasyong teolohikal.
- issue: Paggamit ng malaking titik sa “Anak” at “Ama”
  choice: Ginamit ang malaking titik sapagkat mga personal na titulo ang mga ito sa konteksto.
  alternative: 'Maliit na titik: “anak” at “ama”'
  rationale: Hindi tinutukoy ng sinaunang Griyegong pagkakasulat ang ganitong kapitalisasyon, ngunit malinaw sa konteksto na tumutukoy ang mga salita kay Jesus at sa Diyos na Ama. Tinutulungan ng malaking titik ang mambabasa nang hindi nagdaragdag ng bagong doktrina.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang paulit-ulit na salitang-ugat na “parangal” upang maipakita ang retorikal at teolohikal na diin ng orihinal. Ginamit ang “Amang” bilang natural na pagdurugtong sa sugnay na naglalarawan sa nagsugo.
