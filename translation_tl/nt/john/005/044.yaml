  text: πῶς δύνασθε ὑμεῖς πιστεῦσαι, δόξαν παρ’ ἀλλήλων λαμβάνοντες, καὶ τὴν δόξαν τὴν παρὰ τοῦ μόνου θεοῦ οὐ ζητεῖτε;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/044.yaml
  text: How are you able to believe[c][b][a], receiving glory from one another and not seeking the glory that is from the only God?
translation:
  language: tl
  text: Paano kayo makasasampalataya[a], gayong tumatanggap kayo ng kaluwalhatian[b] mula sa isa’t isa ngunit hindi ninyo hinahanap ang kaluwalhatiang mula sa tanging Diyos[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Paano kayo maniniwala?”
    reason: lexical_alternative
  - marker: b
    text: 'O “karangalan” sa dalawang paglitaw ng “kaluwalhatian” (Griyego: δόξα).'
    reason: lexical_alternative
  - marker: c
    text: O “mula sa iisa at tanging Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς δύνασθε ... πιστεῦσαι
  choice: Paano kayo makasasampalataya
  rationale: Likas sa makabagong Tagalog ang retorikal na tanong na ito at malinaw nitong ipinahahayag ang kakayahan o posibilidad na nasa δύνασθε, habang pinananatili ang malawak na diwa ng πιστεύω.
- source_word: ὑμεῖς
  choice: kayo
  rationale: Ang tahasang panghalip sa Griyego ay kinakatawan ng “kayo”; hindi na dinagdagan ng “mismo” upang hindi labis na palakasin ang diin.
- source_word: δόξαν
  choice: kaluwalhatian
  rationale: Ginamit ang iisang salita sa dalawang paglitaw upang mapanatili ang sinadyang pag-uugnay at pagsalungat ng δόξα mula sa mga tao at mula sa Diyos. Ang “karangalan” ay mas karaniwang alternatibo sa kontekstong panlipunan.
- source_word: παρ’ ἀλλήλων
  choice: mula sa isa’t isa
  rationale: Tuwirang ipinapakita ang katugunang pinagmumulan ng kaluwalhatian sa kapwa tao.
- source_word: λαμβάνοντες
  choice: tumatanggap
  rationale: Pinananatili ang nagpapatuloy na kilos ng participle nang hindi idinaragdag ang mas kusang nuance ng “tinatanggap nang maluwag sa loob.”
- source_word: καὶ ... οὐ ζητεῖτε
  choice: ngunit hindi ninyo hinahanap
  rationale: Bagaman καί ay karaniwang “at,” ang “ngunit” ay natural na nagpapahayag sa Tagalog ng malinaw na pagsalungat ng dalawang asal nang hindi binabago ang lohika ng pangungusap.
- source_word: τὴν δόξαν τὴν παρὰ τοῦ μόνου θεοῦ
  choice: ang kaluwalhatiang mula sa tanging Diyos
  rationale: Pinananatili ang pinagmumulan ng δόξα at ang eksklusibong puwersa ng μόνος sa maikli at likas na parirala.
theological_decisions:
- issue: Diwa ng πιστεῦσαι sa kontekstong Juaniko
  choice: makasasampalataya
  alternative: maniniwala / makapagtitiwala
  rationale: Ang “sumampalataya” ay nagpapanatili sa malawak na diwa ng paniniwala at pagtitiwala sa kontekstong panrelihiyon nang hindi nililimitahan ito sa intelektuwal na pagsang-ayon lamang.
- issue: Pare-parehong salin ng δόξα
  choice: kaluwalhatian sa dalawang paglitaw
  alternative: karangalan sa dalawang paglitaw
  rationale: Pinananatili nito ang leksikal na pag-uulit at ang teolohikal na pagsalungat sa kaluwalhatiang mula sa mga tao at yaong mula sa Diyos.
- issue: Eksklusibong diwa ng τοῦ μόνου θεοῦ
  choice: mula sa tanging Diyos
  alternative: mula sa iisa at tanging Diyos
  rationale: Ang “tanging Diyos” ay tuwiran at hindi pinalalawak ang μόνος nang higit sa sinasabi ng teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “gayong” upang likas na iugnay ang retorikal na tanong sa nagpapatuloy na asal na inilalarawan ng participle. Ang “makasasampalataya” ay pormal ngunit buhay pa sa karaniwang wikang biblikal; ang alternatibong “maniniwala” ay inilagay sa talababa.
