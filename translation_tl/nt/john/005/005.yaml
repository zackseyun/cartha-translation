  text: There was a man there who had been in his sickness for thirty-eight years[a].
translation:
  language: tl
  text: May isang lalaki roon na tatlumpu't walong taon nang may karamdaman.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “may kahinaan” o “may sakit.” Malawak ang maaaring kahulugan ng salitang Griego na ἀσθένεια: pisikal na kahinaan, karamdaman, o sakit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δέ
  choice: May
  rationale: Ipinakikilala nito ang isang tauhan at banayad na ipinagpapatuloy ang salaysay; natural sa Tagalog ang konstruksiyong “May ... roon” nang hindi nagdaragdag ng tahasang panandang temporal o matinding pagsalungat.
- source_word: τις ἄνθρωπος
  choice: isang lalaki
  rationale: Ang τις ἄνθρωπος ay tumutukoy sa isang di-tiyak na indibidwal na lalaki; malinaw at natural ang “isang lalaki.”
- source_word: ἐκεῖ
  choice: roon
  rationale: Tinutukoy nito ang lugar na nabanggit sa naunang tagpo.
- source_word: τριάκοντα ὀκτὼ ἔτη
  choice: tatlumpu't walong taon
  rationale: Ito ang karaniwang makabagong anyo ng bilang sa Tagalog.
- source_word: ἔχων
  choice: nang nasa
  rationale: Kasama ng pariralang nagsasaad ng haba ng panahon, ipinahihiwatig ng participle ang patuloy na kalagayan ng lalaki hanggang sa puntong iyon; natural itong naipapahayag sa Tagalog sa hulma na “tatlumpu't walong taon nang nasa...”
- source_word: ἐν τῇ ἀσθενείᾳ αὐτοῦ
  choice: nasa ganitong karamdaman
  rationale: Ang ἀσθένεια ay maaaring tumukoy sa karamdaman o panghihina. Pinananatili ng “karamdaman” ang malawak na pisikal na diwa nang hindi tinutukoy ang eksaktong sakit; ang “ganitong” ay natural na tumutukoy sa kasalukuyan at matagal na kalagayang inilalarawan.
