  text: Ἐραυνᾶτε τὰς γραφάς, ὅτι ὑμεῖς δοκεῖτε ἐν αὐταῖς ζωὴν αἰώνιον ἔχειν· καὶ ἐκεῖναί εἰσιν αἱ μαρτυροῦσαι περὶ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/039.yaml
  text: You search the Scriptures because you think that in them you have eternal life[a]; and these are the ones that testify about me.
translation:
  language: tl
  text: Sinisiyasat ninyo ang mga Kasulatan dahil iniisip ninyong sa mga ito ay mayroon kayong buhay na walang hanggan.[a] At ang mga Kasulatang ito ang nagpapatotoo tungkol sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Siyasatin ninyo ang mga Kasulatan,” kung babasahing pautos sa halip na indikativo ang Ἐραυνᾶτε.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐραυνᾶτε
  choice: Sinisiyasat ninyo
  rationale: Maaaring indikativo o pautos ang anyong Griyego. Pinili sa pangunahing teksto ang indikativo dahil natural na inilalarawan ng kasunod na ὅτι-clause ang ginagawa na nila; pinanatili sa talababa ang pautos bilang tunay na alternatibo.
- source_word: τὰς γραφάς
  choice: ang mga Kasulatan
  rationale: Tumutukoy ito sa mga banal na kasulatan ng Israel, kaya mas tiyak at likas ang “mga Kasulatan” kaysa sa pangkalahatang “mga sulat.”
- source_word: ὅτι
  choice: dahil
  rationale: 'Pinakamalinaw dito ang panandang sanhi: sinisiyasat nila ang mga Kasulatan dahil naniniwala silang taglay nila roon ang buhay na walang hanggan.'
- source_word: δοκεῖτε
  choice: iniisip ninyo
  rationale: Natural na modernong Tagalog ito para sa kanilang paniniwala o palagay at hindi nito pinalalabis ang bahagyang mapanuring tono.
- source_word: ἐν αὐταῖς
  choice: sa mga ito
  rationale: Pinananatili nito ang payak na kahulugang lokatibo ng ἐν at malinaw na ibinabalik ang panghalip sa mga Kasulatan.
- source_word: ζωὴν αἰώνιον
  choice: buhay na walang hanggan
  rationale: Ito ang malinaw at nakagawiang salin ng mahalagang pariralang Johannine.
- source_word: ἐκεῖναί
  choice: Ang mga Kasulatang ito
  rationale: Inuulit ang tinutukoy ng pambabaeng pangmaramihang panghalip upang maging malinaw at natural sa Tagalog, habang pinananatili ng “ito” ang diin.
- source_word: αἱ μαρτυροῦσαι
  choice: ang nagpapatotoo
  rationale: Malinaw at kasalukuyang gamit ito na nagpapanatili sa mahalagang diwa ng patotoo o saksi sa Juan.
- source_word: περὶ ἐμοῦ
  choice: tungkol sa akin
  rationale: Direkta at natural na katumbas ng περί na may genitive sa kontekstong ito.
theological_decisions:
- issue: Panagano ng Ἐραυνᾶτε
  choice: 'Indikativo: “Sinisiyasat ninyo ang mga Kasulatan”'
  alternative: 'Pautos: “Siyasatin ninyo ang mga Kasulatan”'
  rationale: Parehong posible sa anyong Griyego. Mas umaangkop sa malapit na konteksto ang indikativo sapagkat inilalarawan ni Jesus ang kasalukuyang gawain ng kanyang mga kausap at inilalantad na hindi nila kinikilala ang tinutukoy ng mga Kasulatan. Gayunman, pinananatili sa talababa ang pautos upang hindi alisin ang tunay na gramatikal at interpretatibong kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “sinisiyasat” upang ipahiwatig ang masusing pagsasaliksik, at inulit ang “mga Kasulatan” sa ikalawang pangungusap para sa likas na linaw sa Tagalog. Ang marker na [a] ay inilagay sa pangunahing teksto.
