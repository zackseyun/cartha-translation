source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἔχω τὴν μαρτυρίαν ⸀μείζω τοῦ Ἰωάννου, τὰ γὰρ ἔργα ἃ ⸀δέδωκέν μοι ὁ πατὴρ ἵνα τελειώσω αὐτά, αὐτὰ τὰ ἔργα ⸀ἃ ποιῶ, μαρτυρεῖ περὶ ἐμοῦ ὅτι ὁ πατήρ με ἀπέσταλκεν,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/036.yaml
  text: But I have testimony greater than John's[a], for the works that the Father has given me to complete—these very works that I am doing—testify about me that the Father has sent me.
translation:
  language: tl
  text: Ngunit mayroon akong patotoong higit kaysa sa patotoo ni Juan,[a] sapagkat ang mga gawa na ibinigay sa akin ng Ama upang tapusin ko—ang mismong mga gawang ginagawa ko—ang nagpapatotoo tungkol sa akin na isinugo ako ng Ama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “patotoong higit kaysa sa kay Juan.”
    reason: Pinananatili ng alternatibo ang eliptikong paghahambing ng Griyego, na ang “kay Juan” ay tumutukoy sa patotoo ni Juan.
lexical_decisions:
- source_word: μαρτυρίαν
  choice: patotoo
  rationale: Likas sa makabagong Tagalog ang “mayroon akong patotoo” at napapanatili nito ang diwang ebidensiyal ng salita sa konteksto.
- source_word: μείζω
  choice: higit
  rationale: Tuwirang ipinahahayag ang paghahambing at nananatiling bukas kung ang tinutukoy ay higit sa bigat, halaga, o lakas bilang patotoo.
- source_word: τοῦ Ἰωάννου
  choice: kaysa kay Juan
  rationale: Pinananatili ang elipsis ng Griyego; mauunawaan sa konteksto na inihahambing ang patotoo ni Jesus sa patotoo ni Juan.
- source_word: ἔργα
  choice: mga gawa
  rationale: Napapanatili ang malawak at teolohikal na gamit ng ἔργα sa Juan nang hindi ito nililimitahan sa mga himala lamang.
- source_word: δέδωκέν μοι
  choice: ibinigay sa akin
  rationale: Natural sa Tagalog at malinaw na ang Ama ang pinagmulan ng atas; hindi kailangang piliting katawanin ang Griyegong perfect sa paraang hindi likas sa Tagalog.
- source_word: ὁ πατήρ
  choice: ang Ama
  rationale: Tapat sa tiyak na titulong nasa Griyego at hindi nagdaragdag ng panghalip na “aking.”
- source_word: ἵνα τελειώσω αὐτά
  choice: upang tapusin ko
  rationale: Malinaw na ipinahahayag ang layunin at ang diwa ng pagdadala sa mga gawa sa ganap na katuparan.
- source_word: αὐτὰ τὰ ἔργα
  choice: ang mismong mga gawa
  rationale: Ang “mismong” ay natural na naghahatid ng diin ng αὐτά sa inuulit na “mga gawa.”
- source_word: ἃ ποιῶ
  choice: mga gawang ginagawa ko
  rationale: Ipinakikita ng aspektong nagaganap ang patuloy na pagsasagawa ni Jesus sa mga gawa.
- source_word: μαρτυρεῖ περὶ ἐμοῦ
  choice: nagpapatotoo tungkol sa akin
  rationale: Pinananatili ang legal at ebidensiyal na himig at ang tuwirang kaugnayan ng patotoo kay Jesus.
- source_word: ἀπέσταλκεν
  choice: isinugo
  rationale: Ang “isinugo” ay mas angkop kaysa karaniwang “ipinadala” para sa awtorisadong pagpapadala, nang hindi nagdaragdag ng paliwanag sa teksto.
theological_decisions:
- issue: Ang likas ng patotoong nagpapatunay kay Jesus
  choice: Ang mga gawang ibinigay ng Ama ang nagpapatotoo na isinugo niya si Jesus.
  alternative: Ang “mga gawa” ay tumutukoy lamang sa mga himalang nagpapatunay ng awtoridad.
  rationale: Hindi nililimitahan ng talata ang ἔργα sa mga himala; maaaring saklawin nito ang kabuuan ng gawaing iniatas ng Ama kay Jesus.
- issue: Ang paghahambing sa patotoo ni Juan
  choice: “patotoong higit kaysa kay Juan”
  alternative: “patotoong higit kaysa sa patotoo ni Juan”
  rationale: Pinananatili ng pangunahing teksto ang elipsis ng Griyego, habang nililinaw sa talababa ang posibleng buong diwa.
- issue: Pagtukoy sa ὁ πατήρ
  choice: ang Ama
  alternative: Diyos; aking Ama
  rationale: Ang Griyego ay may tiyak na titulong “ang Ama” ngunit walang tahasang “aking,” kaya hindi ito dinaragdagan o pinapalitan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “patotoo,” “mga gawa,” at “isinugo” upang mapanatili ang magkakaugnay na bokabularyo at teolohikal na bigat ng Ebanghelyo ni Juan. Ang mga gitling na pahaba ay naghihiwalay sa mariing paliwanag na “ang mismong mga gawang ginagawa ko.”
