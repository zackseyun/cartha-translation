  yaml_path: translation/nt/john/005/040.yaml
  text: Yet you are not willing to come to me so that you may have life[a][b].
translation:
  language: tl
  text: Ngunit ayaw ninyong lumapit sa akin upang magkaroon kayo ng buhay.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “At ayaw ninyong lumapit sa akin upang magkaroon kayo ng buhay.” Maaari ring isalin ang pang-ugnay na Griyego bilang “at.”
    reason: lexical_alternative
  - marker: b
    text: Sa Ebanghelyo ni Juan, ang “buhay” ay madalas may mas malalim na diwa ng buhay na mula sa Diyos, samakatuwid ay buhay na walang hanggan, bagaman hindi tahasang nakasaad dito ang salitang “walang hanggan.”
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: Ngunit
  rationale: Bagaman karaniwang nangangahulugang “at” ang καί, malinaw na pasalungat ang gamit nito rito sa naunang pahayag ni Jesus. Likas na ipinapahayag ng “ngunit” ang paghahambing nang hindi ito pinalalabis.
- source_word: οὐ θέλετε
  choice: ayaw ninyo
  rationale: Ipinapahayag ng θέλω ang pagnanais o pagkukusa. Ang “ayaw ninyo” ay natural sa makabagong Tagalog, pinananatili ang diin sa kalooban, at hindi kasing-tindi ng “tumatanggi kayo.”
- source_word: ἐλθεῖν πρός με
  choice: lumapit sa akin
  rationale: Ang ἐλθεῖν na may πρός at accusative ay tumutukoy sa pagpunta o paglapit sa isang tao. Mas natural dito sa Tagalog ang “lumapit sa akin,” at pinananatili nito ang konkretong larawang ginamit ni Juan sa halip na ipakahulugang tuwiran bilang “sumampalataya sa akin.”
- source_word: ἵνα
  choice: upang
  rationale: Nagpapahayag dito ang ἵνα ng layunin. Ang “upang” ay malinaw, maikli, at marangal na katumbas sa Tagalog.
- source_word: ζωὴν
  choice: buhay
  rationale: Tuwirang nangangahulugang “buhay” ang ζωή. Bagaman madalas itong may mas malalim na diwa ng buhay mula sa Diyos sa Juan, walang salitang “walang hanggan” sa talata kaya hindi iyon idinagdag sa pangunahing teksto.
- source_word: ἔχητε
  choice: magkaroon kayo
  rationale: Ang present subjunctive kasunod ng ἵνα ay likas na naipapahayag sa Tagalog sa pariralang “upang magkaroon kayo,” na pinananatili ang diwa ng layunin.
theological_decisions:
- issue: Kung isasalin ang ζωὴν bilang “buhay” o “buhay na walang hanggan”
  choice: buhay
  alternative: buhay na walang hanggan
  rationale: Madalas na may malalim at pansagip na kahulugan ang ζωή sa Ebanghelyo ni Juan, ngunit hindi tahasang narito ang αἰώνιος (“walang hanggan”). Kaya pinananatili sa pangunahing teksto ang “buhay,” habang ipinapaliwanag sa talababa ang mas malawak na diwa nito sa aklat.
- issue: Kung ang “lumapit sa akin” ay tahasang ipakahulugang pananampalataya
  choice: lumapit sa akin
  alternative: sumampalataya sa akin
  rationale: Malapit ang kaugnayan ng paglapit kay Jesus at pananampalataya sa Ebanghelyo ni Juan, ngunit konkretong pandiwa ng paglapit ang ginamit ng tekstong Griyego. Pinananatili nito ang larawan at hindi ipinapalit ang interpretasyon sa mismong pananalita.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “ninyo/kayo” upang malinaw na ipakita ang maramihang kausap. Pinili ang “lumapit” kaysa mas literal ngunit hindi gaanong natural na “pumunta” upang maipahayag ang paglapit kay Jesus nang hindi ito pinapakahulugang tuwiran bilang pananampalataya.
