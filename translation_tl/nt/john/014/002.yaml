base_translation:
  language: en
  yaml_path: translation/nt/john/014/002.yaml
  text: In my Father's house there are many dwelling places[a]. If it were not so[b], would I have told you that I am going to prepare a place for you?
translation:
  language: tl
  text: Sa bahay ng aking Ama ay maraming lugar na matitirhan.[a] Kung hindi gayon, sasabihin ko sana ba sa inyo na pupunta ako upang maghanda ng lugar para sa inyo?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “maraming matutuluyan”; maaari ring isaling “maraming silid.” Ang salitang Griyego ay tumutukoy sa mga lugar na tinutuluyan o pinananahanan at kaugnay ng tema ng pananatili sa kabanatang ito.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring unawain: “Kung hindi gayon, sinabi ko sana sa inyo, sapagkat pupunta ako upang maghanda ng lugar para sa inyo.” Maaaring basahin ang sugnay na Griyego bilang pahayag sa halip na retorikal na tanong.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἰκίᾳ
  choice: bahay
  rationale: Pinananatili ng “bahay” ang konkretong larawan at natural itong kaugnay ng pariralang “bahay ng aking Ama,” nang hindi ito binibigyang-kahulugang “sambahayan.”
- source_word: πατρός μου
  choice: aking Ama
  rationale: Likas na salin ito ng genitibong parirala sa Filipino; ang “Ama” ay tumutukoy sa Diyos sa pananalita ni Jesus.
- source_word: μοναὶ πολλαί
  choice: maraming matitirhan
  rationale: Ang μονή ay lugar na tinutuluyan o pinananahanan. Ang “matitirhan” ay natural sa modernong Filipino, hindi kasing-kitid ng “mga silid,” at naipahihiwatig ang temang pananatili sa kabanata.
- source_word: εἰ δὲ μή
  choice: Kung hindi gayon
  rationale: Malinaw at natural nitong ipinapahayag ang ipinahiwatig na kondisyon nang hindi nagdaragdag ng paliwanag.
- source_word: εἶπον ἂν ὑμῖν
  choice: sasabihin ko ba sa inyo
  rationale: Inilalahad ito bilang retorikal na tanong, isang gramatikal at kontekstuwal na posibleng pagbasa ng kondisyunal na pahayag.
- source_word: ὅτι
  choice: na
  rationale: Ginagamit ang “na” upang ipakilala ang nilalaman ng sasabihin, habang kinikilala sa talababa ang alternatibong pagbasa nitong sanhi o paliwanag.
- source_word: πορεύομαι
  choice: pupunta ako
  rationale: Natural na Filipino para sa presenteng may nalalapit na hinaharap na diwa sa konteksto ng pag-alis ni Jesus.
- source_word: ἑτοιμάσαι
  choice: upang maghanda
  rationale: Malinaw na ipinapahayag ng “upang” ang layuning taglay ng infinitive.
- source_word: τόπον
  choice: lugar
  rationale: Pinananatili nito ang malawak na kahulugan ng τόπος at hindi ito pinakikitid sa isang “silid.”
- source_word: ὑμῖν
  choice: para sa inyo
  rationale: Natural na ipinapahayag ang benefactive dative; ang “inyo” ay maramihan na sa Filipino kaya hindi kailangang idagdag ang “lahat.”
theological_decisions:
- issue: Paglalarawan sa μονή at sa eskatolohikal na larawan
  choice: maraming matitirhan
  alternative: maraming silid; maraming mansiyon
  rationale: Hindi hinihingi ng Griyego ang modernong diwa ng mararangyang “mansiyon,” at maaaring maging masyadong tiyak sa arkitektura ang “mga silid.” Pinananatili ng “matitirhan” ang larawan ng lugar ng pananatili nang hindi nagdaragdag ng doktrinal na detalye.
- issue: Bantas at puwersa ng ikalawang sugnay
  choice: 'Retorikal na tanong: “Kung hindi gayon, sasabihin ko ba sa inyo na pupunta ako…?”'
  alternative: 'Pahayag: “Kung hindi gayon, sinabi ko sana sa inyo, sapagkat pupunta ako upang maghanda…”'
  rationale: Walang orihinal na bantas ang tekstong Griyego, at maaaring unawain ang pagkakaugnay ng εἶπον ἂν ὑμῖν at ὅτι sa mahigit isang paraan. Pinili ang retorikal na tanong dahil maayos ang daloy nito, ngunit pinananatili sa talababa ang tunay na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “matitirhan” sa halip na mas teknikal na “mga tahanang dako” o tradisyonal na “mga mansiyon.” Pinanatili ang “bahay ng aking Ama” bilang malinaw at pamilyar na larawan.
