source:
  edition: SBLGNT
  text: ἔτι μικρὸν καὶ ὁ κόσμος με οὐκέτι θεωρεῖ, ὑμεῖς δὲ θεωρεῖτέ με, ὅτι ἐγὼ ζῶ καὶ ὑμεῖς ⸀ζήσετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/019.yaml
  text: A little while longer[a], and the world will no longer see me, but you will see me. Because I live[b], you also will live.
translation:
  language: tl
  text: Kaunti na lamang, at hindi na ako makikita ng sanlibutan[a], ngunit makikita ninyo ako. Dahil ako’y buhay, mabubuhay rin kayo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pandiwang Griyego na isinaling “makikita” sa dalawang pagkakataon ay maaari ring magpahiwatig ng masusing pagmamasid o pagkakita, hindi lamang ng panandaliang pagsulyap.
    reason: lexical_alternative
  - marker: b
    text: Ang “mabubuhay rin kayo” ay maaaring tumukoy sa pakikibahagi ng mga alagad sa buhay ng muling nabuhay na si Jesus, sa espirituwal na buhay na kaisa niya, o sa kapwa mga ito.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτι μικρὸν
  choice: Kaunting panahon na lamang
  rationale: Likas na temporal na pananalita sa Filipino para sa maikling panahong nalalabi; pinananatili nito ang diwa ng nalalapit na pagbabago.
- source_word: ὁ κόσμος
  choice: ang sanlibutan
  rationale: Pinananatili ang malawak at teolohikal na gamit ng κόσμος sa Juan nang hindi ito agad nililimitahan sa ‘mga tao’ o sa isang ‘sistema.’
- source_word: θεωρεῖ / θεωρεῖτέ
  choice: makikita / makikita
  rationale: Ang ‘makikita’ ang pinakanatural na katumbas sa konteksto. Ipinahihiwatig ng temporal na balangkas at ng οὐκέτι ang nalalapit na kalagayan, kaya ang aspektong panghinaharap ay malinaw sa Filipino.
- source_word: οὐκέτι
  choice: hindi na
  rationale: Maikli at natural na pagpapahayag ng pagtigil mula sa nalalapit na sandali.
- source_word: δὲ
  choice: ngunit
  rationale: Malinaw na inilalahad ang pagsalungat sa pagitan ng sanlibutan at ng mga alagad.
- source_word: ὅτι
  choice: Sapagkat
  rationale: 'Pinananatili ang pinakalikás na sanhi o batayan: ang buhay ni Jesus ang saligan ng buhay ng mga alagad.'
- source_word: ἐγὼ ζῶ
  choice: nabubuhay ako
  rationale: Pinananatili ang pangkasalukuyang panahunan at ang diin sa patuloy na buhay ni Jesus.
- source_word: καὶ ὑμεῖς ζήσετε
  choice: mabubuhay rin kayo
  rationale: Ang ‘rin’ ay kumakatawan sa καί at binibigyang-diin ang kaugnayan ng buhay ni Jesus sa magiging buhay ng mga alagad; tahasang pinananatili ang panghinaharap.
theological_decisions:
- issue: Ang kahulugan ng pagkakita ng mga alagad kay Jesus
  choice: Isinalin nang payak bilang ‘makikita’ nang hindi tinutukoy kung ito ay pisikal na pagkakita sa muling nabuhay na Jesus, espirituwal na pagkilala, o kapwa mga ito.
  alternative: Maaaring tumukoy sa mga pagpapakita ni Jesus matapos siyang muling mabuhay, sa espirituwal na pagkilala sa kanya, o sa patung-patong na kahulugang sumasaklaw sa dalawa.
  rationale: Hindi nililinaw ng Griyego ang iisang paraan ng pagkakita, kaya pinananatili ng salin ang tunay na lawak at tensiyong teolohikal.
- issue: Ang saklaw ng ‘mabubuhay rin kayo’
  choice: Pinanatiling malawak ang ‘mabubuhay rin kayo.’
  alternative: Maaaring tumukoy sa buhay na mula sa muling pagkabuhay, espirituwal na buhay na kaisa ni Jesus, buhay na walang hanggan, o sa pinagsamang mga dimensiyong ito.
  rationale: Mayaman sa kahulugan ang panghinaharap na ζήσετε; hindi ito dapat paliitin sa pisikal na buhay lamang o sa isang tiyak na aspektong teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘sanlibutan’ upang mapanatili ang malawak na katawagang maka-Juan, habang ang ayos ng pangungusap ay nananatiling natural sa karaniwang mambabasa.
