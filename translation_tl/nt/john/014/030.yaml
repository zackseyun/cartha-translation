  text: οὐκέτι πολλὰ λαλήσω μεθ’ ὑμῶν, ἔρχεται γὰρ ὁ τοῦ κόσμου ἄρχων· καὶ ἐν ἐμοὶ οὐκ ἔχει οὐδέν,
base_translation:
  language: en
  yaml_path: translation/nt/john/014/030.yaml
  text: I will no longer speak much with you[a], for the ruler of the world is coming[b]. And he has nothing in me.
translation:
  language: tl
  text: Hindi na ako magsasalita nang marami kasama ninyo, sapagkat dumarating na ang pinuno ng sanlibutan. Wala siyang anuman sa akin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring, “Wala siyang anumang karapatan sa akin” o “Wala siyang mahahawakan laban sa akin.” Literal sa Griyego: “Wala siyang anuman sa akin.”'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκέτι πολλὰ λαλήσω μεθ’ ὑμῶν
  choice: Hindi na ako magsasalita nang marami sa inyo
  rationale: Pinananatili ng “hindi na” ang temporal na diwa ng οὐκέτι, at likas sa modernong Tagalog ang “magsasalita nang marami” para sa adberbiyal na πολλὰ. Ang “sa inyo” ay natural na katumbas ng pakikipag-usap na ipinahihiwatig ng μεθ’ ὑμῶν.
- source_word: ἔρχεται
  choice: dumarating na
  rationale: Ipinahahayag ng pangkasalukuyang anyo ang nalalapit na pagdating; ang “na” ay likas na nagpapakita ng pagiging nalalapit nang hindi dinaragdagan ang tinutukoy.
- source_word: ὁ τοῦ κόσμου ἄρχων
  choice: ang pinuno ng sanlibutan
  rationale: Ang “pinuno” ay malinaw at kasalukuyang katumbas ng ἄρχων. Hindi idinagdag ang “ng sanlibutang ito” sapagkat walang katumbas na “ito” sa Griyego.
- source_word: καὶ ἐν ἐμοὶ οὐκ ἔχει οὐδέν
  choice: Wala siyang anuman sa akin
  rationale: Pinananatili nito ang maikli at idyomatikong pahayag ng Griyego nang hindi nililimitahan ang diwa sa isang interpretasyong gaya ng “walang karapatan” o “walang kapangyarihan.”
theological_decisions:
- issue: Pagkakakilanlan ng “pinuno ng sanlibutan”
  choice: Panatilihin ang titulong “pinuno ng sanlibutan” sa pangunahing teksto.
  alternative: Tukuyin siya bilang “Satanas” o bilang personipikasyon ng masasamang kapangyarihan.
  rationale: Sa konteksto ni Juan, tumutukoy ang titulo sa masamang espirituwal na pinunong salungat kay Jesus, karaniwang nauunawaang si Satanas. Gayunman, titulo ang tahasang ginamit ng Griyego, kaya hindi ipininalit ang pangalan.
- issue: Diwa ng “ἐν ἐμοὶ οὐκ ἔχει οὐδέν”
  choice: Panatilihin ang literal at maluwag na “Wala siyang anuman sa akin.”
  alternative: “Wala siyang karapatan sa akin,” “wala siyang mahahawakan laban sa akin,” o “wala siyang kapangyarihan sa akin.”
  rationale: Maikli at sadyang malawak ang idyomang Griyego. Maaaring saklawin nito ang kawalan ng pag-angkin, kapit, batayan, o anumang masamang bagay kay Jesus; hindi dapat tahimik na piliin ang isa lamang.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “sanlibutan” upang mapanatili ang teolohikal na gamit ng κόσμος sa Juan, at iniwasan ang mas lumang “prinsipe.”
