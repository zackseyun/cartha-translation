  verdict: revise
  source_fidelity: 'Malapit ang salin sa Griyego: naipapahayag ang οὐκέτι, ang adberbiyal na πολλὰ, ang nalalapit na ἔρχεται, at ang literal na maluwag na diwa ng ἐν ἐμοὶ οὐκ ἔχει οὐδέν. Gayunman, ang “sa inyo” ay maaaring magtunog na direksiyon ng pagsasalita sa halip na pakikipag-usap/ugnayan ng μεθ’ ὑμῶν; mas tumpak at natural ang “kasama ninyo.”'
  naturalness: Natural ang kabuuang daloy, ngunit mas malinaw sa modernong Tagalog ang “Hindi na ako gaanong makikipag-usap sa inyo” o, nang mas malapit sa anyo ng Griyego, “Hindi na ako magsasalita nang marami kasama ninyo.” Pinili ang huli upang mapanatili ang “speak much” nang hindi ginagawang mas interpretatibo ang pandiwa.
  terminology: Ang “pinuno ng sanlibutan” ay angkop para sa ὁ τοῦ κόσμου ἄρχων at hindi nagdaragdag ng “ito.” Ang “Wala siyang anuman sa akin” ay wastong literal na salin. Sa talababa, ang “kapangyarihan sa akin” ay masyadong malawak at maaaring magpahiwatig ng ganap na kawalan ng kapangyarihan, samantalang ang idyoma ay tumutukoy sa walang claim, foothold, o batayan; mas mainam ang “walang mahahawakan laban sa akin.”
  issues:
  - severity: low
    issue: Ang “sa inyo” para sa μεθ’ ὑμῶν ay kulang sa diwa ng pakikipag-usap na kasama ang mga alagad.
    rationale: Ang μετά na may genitive ay “with,” hindi lamang “to.” Ang “kasama ninyo” ay pinananatili ang ugnayang ito.
  - severity: medium
    issue: Ang talababang “Wala siyang anumang kapangyarihan sa akin” ay isang mas malakas at mas makitid na pagpapakahulugan kaysa sa literal na Griyego.
    rationale: Ang οὐκ ἔχει οὐδέν ἐν ἐμοί ay maaaring magpahiwatig ng walang pag-angkin, batayan, o mahahawakan; hindi nito tahasang sinasabing wala siyang anumang kapangyarihan sa lahat ng aspekto.
  revised_text: Hindi na ako magsasalita nang marami kasama ninyo, sapagkat dumarating na ang pinuno ng sanlibutan. Wala siyang anuman sa akin.[a]
