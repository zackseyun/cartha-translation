id: JHN.14.31
reference: John 14:31
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀλλ’ ἵνα γνῷ ὁ κόσμος ὅτι ἀγαπῶ τὸν πατέρα, καὶ καθὼς ⸀ἐνετείλατο μοι ὁ πατὴρ οὕτως ποιῶ. Ἐγείρεσθε, ἄγωμεν ἐντεῦθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/031.yaml
  text: But so that the world may know that I love the Father[a], I do just as the Father has commanded me. Rise, let us go from here.
translation:
  language: tl
  text: Ngunit upang malaman ng sanlibutan na iniibig ko ang Ama,[a] ginagawa ko ang lahat gaya ng iniutos sa akin ng Ama. Tumayo kayo; umalis na tayo rito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “Ngunit upang malaman ng sanlibutan na iniibig ko ang Ama, at kung paanong iniutos sa akin ng Ama, gayon ko ginagawa.”'
    reason: Pinananatili ng alternatibo ang mas lantad na ayos ng καί at ng pagtutugmang καθώς...οὕτως sa Griyego.
lexical_decisions:
- source_word: ἀλλ’
  choice: Ngunit
  rationale: Pinananatili ang panalungat na ugnayan sa naunang pahayag habang natural ang daloy sa makabagong Tagalog.
- source_word: ἵνα γνῷ
  choice: upang malaman
  rationale: Malinaw na ipinapahayag ang layuning tinutukoy ng ἵνα kasama ng pasakaling pandiwa.
- source_word: ὁ κόσμος
  choice: ang sanlibutan
  rationale: Pinananatili ang malawak at teolohikal na gamit ng κόσμος sa Juan, na tumutukoy sa sangkatauhan bilang kabuuang nasa daigdig.
- source_word: ἀγαπῶ
  choice: iniibig ko
  rationale: Likas at marangal na salin ng pangkasalukuyang ἀγαπάω, at angkop sa pag-ibig ng Anak sa Ama.
- source_word: τὸν πατέρα
  choice: ang Ama
  rationale: Hindi nagdaragdag ng panghalip na paari na wala sa Griyego at pinananatili ang titulong gamit sa Juan.
- source_word: καθὼς ἐνετείλατο μοι ὁ πατὴρ οὕτως ποιῶ
  choice: ginagawa ko ang ayon mismo sa iniutos sa akin ng Ama
  rationale: Inililipat sa likas na ayos ng Tagalog ang pagtutugmang καθώς...οὕτως at pinananatili ang mariing diwa ng utos at eksaktong pagsunod.
- source_word: Ἐγείρεσθε
  choice: Tumayo kayo
  rationale: Ang maramihang pautos ay tumatawag sa mga alagad na tumindig mula sa kanilang kinaroroonan; malinaw ito sa konteksto at hindi nagpapahiwatig ng pagkabuhay na muli.
- source_word: ἄγωμεν
  choice: umalis na tayo
  rationale: Likas na Tagalog para sa hortatory subjunctive at malinaw na paanyayang sabay-sabay na lumisan.
- source_word: ἐντεῦθεν
  choice: rito
  rationale: Tuwirang tumutukoy sa kasalukuyang lugar na lilisanin; kasama ng “umalis,” sapat at natural ang “rito.”
theological_decisions:
- issue: Ang titulong πατήρ sa Kristolohiya ni Juan
  choice: ang Ama
  alternative: ang aking Ama
  rationale: Pinananatili ang anyo ng Griyego nang hindi nagdaragdag ng tahasang paari, habang nananatiling malinaw ang ugnayan ni Jesus sa Ama.
- issue: Lakas ng ἐντέλλομαι sa kaugnayan ng Ama at ng Anak
  choice: iniutos
  alternative: ipinagawa; itinagubilin
  rationale: Ang pandiwa ay may diwa ng pag-uutos o pagbibigay ng atas. Hindi ito pinalalambot dahil lamang sa teolohikal na pagsasaalang-alang.
- issue: Ugnayang sintaktiko ng ἵνα at ng καθώς...οὕτως
  choice: Isinama ang paggawa ayon sa utos bilang pangunahing kilos na nagpapakilala sa sanlibutan ng pag-ibig ni Jesus sa Ama.
  alternative: 'Basahin bilang dalawang magkaugnay na pahayag: upang malaman ng sanlibutan na iniibig niya ang Ama, at kung paanong iniutos ng Ama, gayon siya gumagawa.'
  rationale: Maaaring ayusin sa higit sa isang paraan ang siksik na Griyegong pangungusap. Ang pangunahing salin ay natural sa Tagalog, samantalang itinatala sa talababa ang mas hayag na pagpapanatili ng καί at ng καθώς...οὕτως.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “sanlibutan” upang mapanatili ang natatanging bokabularyo ni Juan, “iniibig” para sa relasyonal na pag-ibig, at “Tumayo kayo; umalis na tayo rito” bilang tuwiran at likas na panawagan. Ang tuldok-kuwit ay nagpapakita ng malapit na ugnayan ng dalawang pautos nang hindi nagiging mabigat ang pangungusap.
