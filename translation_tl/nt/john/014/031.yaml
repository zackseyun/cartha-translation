  source_fidelity: 'Tumpak ang pangunahing diwa: ang layunin ay malaman ng sanlibutan ang pag-ibig ni Jesus sa Ama, na ipinakikita sa paggawa niya ayon sa utos ng Ama; tumpak din ang dalawang pangwakas na pautos. Gayunman, ang “ginagawa ko ang ayon mismo sa iniutos” ay may nawawalang/di-likas na layon sa Tagalog. Ang “ginagawa ko ang lahat gaya ng iniutos sa akin ng Ama” ay malinaw na naghahatid ng καθώς...οὕτως at ng lakas ng ἐνετείλατο nang walang pagbabagong kahulugan.'
  naturalness: Ang “Ngunit,” “sanlibutan,” “iniibig,” “Ama,” at “Tumayo kayo; umalis na tayo rito” ay angkop sa marangal ngunit nauunawaang makabagong Tagalog. Ang binagong sugnay ay mas likas at hindi pilit ang sintaksis.
