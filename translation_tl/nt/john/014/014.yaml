  text: ἐάν τι αἰτήσητέ ⸀με ἐν τῷ ὀνόματί μου ⸀ἐγὼ ποιήσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/014.yaml
  text: If you ask me anything in my name[a], I will do it.
translation:
  language: tl
  text: Kung hihiling kayo sa akin ng anuman sa pangalan ko[a], gagawin ko iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa ilang manuskrito ay ganito ang mababasa: “Kung hihiling kayo ng anuman sa pangalan ko, gagawin ko iyon,” at wala ang “sa akin.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἐάν
  choice: Kung
  rationale: Nagpapakilala ito ng kondisyong sugnay; natural at tumpak ang “kung” sa kontekstong ito.
- source_word: τι
  choice: ng anuman
  rationale: Ipinapahayag nito ang bukas na saklaw ng hinihiling at likas itong kasunod ng pandiwang “hihiling” sa Filipino.
- source_word: αἰτήσητέ
  choice: hihiling kayo
  rationale: Ang aorist subjunctive na pinamamahalaan ng ἐάν ay likas na naipapahayag sa Filipino sa anyong panghinaharap sa kondisyong sugnay. Pinananatili ng “hihiling” ang diwa ng paghiling o pakiusap.
- source_word: με
  choice: sa akin
  rationale: Tahasang isinasalin ang panghalip na layon na nasa SBLGNT. Hinihingi ng pandiwang Filipino na “humiling” ang pariralang “sa akin” para sa taong pinatutungkulan.
- source_word: ἐν τῷ ὀνόματί μου
  choice: sa pangalan ko
  rationale: Ito ang natural at pamilyar na katumbas ng ekspresyong Juaniko, nang hindi ipinapasok sa pangunahing teksto ang mas malawak na interpretasyon tungkol sa awtoridad o pagkatawan.
- source_word: ἐγὼ
  choice: ko
  rationale: Ang tahasang simuno sa Griyego ay naipapahayag sa panghalip na “ko” na nakakabit sa pandiwa. Hindi na dinagdagan ng “ako mismo” upang maiwasan ang labis na pagdidiin.
- source_word: ποιήσω
  choice: gagawin ko iyon
  rationale: Tumpak na ipinapahayag ang future indicative. Ang “iyon” ay malinaw na tumutukoy sa anumang hiniling at nagpapadaloy sa pangungusap.
theological_decisions:
- issue: Pagkakaroon ng με (“sa akin”) at ang pahiwatig na si Jesus ang tuwirang pinatutungkulan ng kahilingan
  choice: Isama ang “sa akin” sa pangunahing teksto
  alternative: Kung hihiling kayo ng anuman sa pangalan ko, gagawin ko iyon.
  rationale: Kasama ang με sa ibinigay na tekstong SBLGNT, kaya tahasan itong isinalin. Dahil may mga manuskritong wala nito at may kabuluhang teolohikal kung sino ang direktang pinatutungkulan, inilalahad ang ibang pagbasa sa talababa sa halip na tahimik na lutasin ang pagkakaiba.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pangmaramihang “kayo,” ayon sa ikalawang panauhang maramihan sa Griyego. Pinanatili ang tradisyonal ngunit natural na pariralang “sa pangalan ko” nang walang dagdag na interpretatibong paliwanag sa pangunahing teksto.
