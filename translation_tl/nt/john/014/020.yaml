  text: ἐν ἐκείνῃ τῇ ἡμέρᾳ ⸂γνώσεσθε ὑμεῖς⸃ ὅτι ἐγὼ ἐν τῷ πατρί μου καὶ ὑμεῖς ἐν ἐμοὶ κἀγὼ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/020.yaml
  text: On that day you will know that I am in my Father[a], and you are in me[b], and I am in you.
translation:
  language: tl
  text: Sa araw na iyon[a], malalaman ninyo na ako ay nasa aking Ama, at kayo ay nasa akin, at ako ay nasa inyo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Sa araw na yaon,” ngunit ang “Sa araw na iyon” ang mas karaniwang anyo sa modernong Tagalog.
    reason: lexical_alternative
  - marker: b
    text: Sadyang pinanatili ang paulit-ulit na paggamit ng “nasa” upang maipakita ang tema ni Juan tungkol sa ugnayan ng isa’t isa. Maaari itong ipakahulugang “kaisa,” ngunit mas interpretatibo iyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: Sa araw na iyon
  rationale: Ginagamit ang pariralang ito sa panahong kahulugan. Likas ito sa modernong Tagalog at pinananatili ang pagtukoy sa isang tiyak na araw.
- source_word: γνώσεσθε
  choice: malalaman ninyo
  rationale: Ipinahihiwatig ng anyong panghinaharap ang kaalamang matatamo o magiging malinaw sa mga alagad. Ang “malalaman ninyo” ay natural at hindi labis na nagdidiin sa proseso.
- source_word: ὑμεῖς
  choice: ninyo
  rationale: Ang tahasang panghalip sa Griyego ay may diin. Sa Tagalog, sapat itong naipahahayag sa tahasang “ninyo” kasunod ng pandiwa nang hindi kinakailangang idagdag ang mas mabigat na “kayo mismo.”
- source_word: ὅτι
  choice: na
  rationale: Ipinakikilala nito ang nilalaman ng malalaman ng mga alagad, hindi ang sanhi nito.
- source_word: ἐγὼ ἐν τῷ πατρί μου
  choice: ako ay nasa aking Ama
  rationale: Pinananatili ng “nasa” ang larawang ipinahahayag ng ἐν at ang ugnayang anak-Ama, sa halip na paliitin ito sa isang tahasang interpretasyong gaya ng “kaisa.”
- source_word: καὶ ὑμεῖς ἐν ἐμοὶ
  choice: at kayo ay nasa akin
  rationale: Ipinapasok ang “ay” na likas sa Tagalog para sa sugnay na walang tahasang pandiwa sa Griyego, habang pinananatili ang inuulit na diwa ng ἐν.
- source_word: κἀγὼ ἐν ὑμῖν
  choice: at ako ay nasa inyo
  rationale: Ang κἀγώ ay “at ako.” Pinananatili ang kapwa-panig na pananatili nang walang interpretatibong pagpapalawak.
theological_decisions:
- issue: Ang inuulit na pananalitang ἐν tungkol sa kapwa-panig na pananatili
  choice: 'Panatilihin ang “nasa” sa tatlong sugnay: “ako ay nasa aking Ama, at kayo ay nasa akin, at ako ay nasa inyo.”'
  alternative: “Kaisa ko ang aking Ama, at kaisa ko kayo, at kaisa ninyo ako.”
  rationale: Mayaman at sadyang hindi lubusang ipinaliliwanag ng teksto ang ugnayan. Ang pare-parehong “nasa” ay nagpapanatili sa metapora at teolohikal na tensiyon sa halip na itakda ito bilang iisang uri lamang ng pagkakaisa.
- issue: Ang ugnayan ni Jesus sa Ama
  choice: “ako ay nasa aking Ama”
  alternative: “iisa kami sa likas na pagkadiyos ng aking Ama” o “kasama ko ang aking Ama”
  rationale: Hindi nito pinahihina ang mataas na pahayag tungkol kay Jesus at hindi rin nito ipinapasok sa talata ang mas huling pormulang doktrinal na hindi tahasang binibigkas dito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang buong anyong “ako ay” at “kayo ay” upang maging maayos at bahagyang pormal ang himig, at pinanatili ang magkakatulad na kayarian ng tatlong sugnay.
