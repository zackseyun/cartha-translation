  text: λέγει αὐτῷ Θωμᾶς· Κύριε, οὐκ οἴδαμεν ποῦ ὑπάγεις· ⸀πῶς ⸂δυνάμεθα τὴν ὁδὸν εἰδέναι⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/005.yaml
  text: Thomas said to him[a], “Lord, we do not know where you are going[b]. How can we know the way?”
translation:
  language: tl
  text: Sinabi ni Tomas sa kanya, “Panginoon, hindi namin alam kung saan ka pupunta. Paano namin malalaman[a] ang daan?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Paano namin magagawang malaman ang daan?”
    reason: lexical_alternative
  - marker: b
    text: 'Iisang pandiwang Griyego para sa “alam” ang ginamit nang dalawang beses sa talatang ito: sa “hindi namin alam” at sa “malalaman ang daan.”'
    reason: cross_reference
lexical_decisions:
- source_word: λέγει αὐτῷ Θωμᾶς
  choice: Sinabi sa kanya ni Tomas
  rationale: Isinalin sa nakaraang panahunan ang makasaysayang pangkasalukuyang λέγει upang maging natural ang salaysay sa Tagalog; pinanatili ang di-tuwirang layon na αὐτῷ.
- source_word: Κύριε
  choice: Panginoon
  rationale: Pinananatili nito ang magalang at makahulugang pagtawag ni Tomas kay Jesus nang hindi nililimitahan sa karaniwang “Ginoo” lamang.
- source_word: οὐκ οἴδαμεν
  choice: hindi namin alam
  rationale: Tuwirang ipinapahayag ng οἶδα ang kaalaman. Ginamit ang eksklusibong “namin” sapagkat tinutukoy ni Tomas ang sarili niya at ang ibang alagad habang kausap si Jesus.
- source_word: ποῦ ὑπάγεις
  choice: kung saan ka pupunta
  rationale: Natural ito sa modernong Tagalog at hindi nito ipinapasok nang tahasan ang mas malalim na kahulugan sa Juan tungkol sa pag-alis o pagbabalik ni Jesus sa Ama.
- source_word: πῶς δυνάμεθα
  choice: Paano namin malalaman
  rationale: Likas na ipinahihiwatig ng anyong “Paano ... malalaman” ang tanong tungkol sa kakayahan; inilagay sa talababa ang mas tahasang alternatibo.
- source_word: τὴν ὁδὸν
  choice: ang daan
  rationale: Ang “daan” ay tumutugma sa literal at metaporikal na saklaw ng ὁδός at pinananatili ang kaugnayan nito sa susunod na talata.
- source_word: εἰδέναι
  choice: malalaman
  rationale: Pinananatili nito ang pag-uulit ng ideya at salitang-ugat na “alam” mula sa naunang “hindi namin alam,” gaya ng pag-uulit ng οἶδα sa Griyego.
theological_decisions:
- issue: Teolohikal na pahiwatig ng ὑπάγεις sa Ebanghelyo ni Juan
  choice: kung saan ka pupunta
  alternative: kung saan ka aalis papunta
  rationale: Mahalaga sa Juan ang patutunguhan ni Jesus, ngunit ipinahahayag lamang dito ni Tomas na hindi nila iyon alam. Ang neutral na salin ay nagpapanatili sa tensiyon ng salaysay nang hindi inuunahan ang paliwanag.
- issue: Kahulugan ng ὁδός bago ang pahayag ni Jesus sa susunod na talata
  choice: ang daan
  alternative: ang landas
  rationale: Hindi nililinaw ng talatang ito kung pisikal o metaporikal ang “daan.” Pinananatili ng karaniwang “daan” ang sadyang puwang na iyon at ang ugnayan sa Juan 14:6.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “ka” alinsunod sa isahang panghalip ng Griyego at sa karaniwang estilo ng saling Bibliya; iniwasan ang labis na pagpapaliwanag sa mismong teksto.
