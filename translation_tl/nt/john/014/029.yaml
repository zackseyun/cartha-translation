review_pass:
  verdict: revise
  source_fidelity: 'Ang diwa ng Griyegong teksto ay naipapahayag nang wasto: nagsalita na si Jesus bago mangyari ang ipinahiwatig na pangyayari, na may layuning maniwala ang mga kausap kapag ito ay nangyari. Gayunman, ang ayos na “sinabi ko na ito sa inyo ngayon” ay maaaring mabasa na ang mismong pagsasalita ay nangyari lamang ‘ngayon,’ sa halip na ang νῦν ay tumukoy sa kasalukuyang pahayag na natapos na at may bisa pa rin. Ang “ngayo’y” na inilalagay bago ang pandiwa ay mas malinaw na tumutugma sa καὶ νῦν εἴρηκα.'
  naturalness: Natural at marangal sa modernong Filipino ang “At ngayo’y sinabi ko na ito sa inyo bago pa ito mangyari.” Ang “kapag nangyari na ito” ay likas na pagpapahayag ng inaasahang pangyayari sa hinaharap at pinananatili ang pag-uulit ng γίνομαι.
  terminology: Ang “maniwala kayo” ay angkop at hindi nagpapataw ng interpretasyong ang tinutukoy ay alinman sa unang pagsampalataya o patuloy na/pinalakas na paniniwala. Ang alternatibong “magtiwala kayo” ay maaaring ilahad sa talababa bilang posibleng semantikong diin.
  issues:
  - severity: medium
    issue: Malabong saklaw ng “ngayon” sa kasalukuyang ayos ng pangungusap
    rationale: Sa “At sinabi ko na ito sa inyo ngayon,” maaaring unawain ang “ngayon” bilang oras ng simpleng nakaraang kilos (“I said it to you today/just now”). Sa Griyegong καὶ νῦν εἴρηκα, ang νῦν ay mas malinaw na kaugnay ng perpektong “I have told,” kaya mas mainam ang “At ngayo’y sinabi ko na…”.
  revised_text: At ngayo’y sinabi ko na ito sa inyo bago pa ito mangyari, upang kapag nangyari na ito ay maniwala kayo.[a]
  revised_footnotes:
