  rationale: Inilipat ang “ngayon” sa “ngayo’y” bago ang pandiwa upang malinaw na maipakita ang puwersa ng καὶ νῦν εἴρηκα (“at ngayo’y sinabi ko na”), nang hindi binabago ang kahulugan, rehistro, o ang pag-uulit ng “mangyari/nangyari.”
