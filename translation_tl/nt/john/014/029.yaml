  text: And now I have told you before it happens[c][b][a], so that when it happens you may believe.
translation:
  language: tl
  text: At ngayo’y sinabi ko na ito sa inyo bago pa ito mangyari, upang kapag nangyari na ito ay maniwala kayo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “magtiwala kayo.” Hindi tahasang nililinaw ng Griyego kung ito ay unang paniniwala o pagpapatibay ng dati nang paniniwala.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν εἴρηκα ὑμῖν
  choice: At sinabi ko na ito sa inyo ngayon
  rationale: Pinananatili ng “At” at “ngayon” ang ugnayan at panahong ipinahihiwatig ng καὶ νῦν. Likas sa Filipino ang “sinabi ko na ... sa inyo” para sa perpektong εἴρηκα, na tumutukoy sa nauna nang pahayag na may bisa sa kasalukuyan; idinagdag ang “ito” bilang likas na pantukoy sa pangyayaring ipinahihiwatig ng konteksto.
- source_word: πρὶν γενέσθαι
  choice: bago pa ito mangyari
  rationale: Ang πρίν kasama ng aorist infinitive ay nangangahulugang bago mangyari ang ipinahihiwatig na pangyayari. Natural at malinaw sa modernong Filipino ang “bago pa ito mangyari.”
- source_word: ἵνα
  choice: upang
  rationale: Malinaw na ipinapahayag ng “upang” ang layuning taglay ng ἵνα at angkop sa marangal ngunit madaling maunawaang rehistro.
- source_word: ὅταν γένηται
  choice: kapag nangyari na ito
  rationale: Ipinakikita ng ὅταν na inaasahang kundisyong nasa hinaharap. Inuulit ng “mangyari/nangyari” ang iisang pandiwang γίνομαι sa dalawang sugnay; ang “na” ay natural na tumutukoy sa katuparan ng pangyayari.
- source_word: πιστεύσητε
  choice: maniwala kayo
  rationale: Karaniwang katumbas ng πιστεύω sa Juan ang “maniwala.” Hindi nito nililimitahan kung ito ay unang pagsampalataya o pagpapatibay ng dati nang paniniwala.
theological_decisions:
- issue: Saklaw ng πιστεύσητε sa konteksto
  choice: maniwala kayo
  alternative: magtiwala kayo; lalo kayong maniwala
  rationale: Maaaring tumukoy ang pahayag sa paglitaw o pagpapatibay ng paniniwala nang maganap ang ipinahayag ni Jesus. Hindi tahasang tinutukoy ng Griyego kung alin dito, kaya hindi dinagdagan ng “lalo” o “patuloy.”
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Pinanatili ang pag-uulit ng γίνομαι sa pamamagitan ng “mangyari/nangyari” at iniwasang ipasok ang isang tiyak na doktrinal na pagbasa sa πιστεύσητε.
