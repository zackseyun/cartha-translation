  text: λέγει αὐτῷ Ἰούδας, οὐχ ὁ Ἰσκαριώτης· Κύριε, ⸀τί γέγονεν ὅτι ἡμῖν μέλλεις ἐμφανίζειν σεαυτὸν καὶ οὐχὶ τῷ κόσμῳ;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/022.yaml
  text: Judas (not Iscariot) said to him[a], “Lord[b], what has happened that you are going to reveal yourself to us and not to the world?”
translation:
  language: tl
  text: Sinabi sa kanya ni Judas (hindi ang Iscariote), “Panginoon, ano ang nangyari kung bakit balak mong ihayag ang iyong sarili sa amin ngunit hindi sa mundo?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: Sinabi
  rationale: Ginamit ang karaniwang nagdaang panahunan sa makabagong salaysay sa Filipino; natural nitong ipinapahayag ang makasaysayang pangkasalukuyan sa Griyego.
- source_word: Ἰούδας, οὐχ ὁ Ἰσκαριώτης
  choice: Judas—hindi si Judas Iscariote—
  rationale: Pinananatili ang pangalang Judas at ang tuwirang paglilinaw na hindi siya ang Iscariote.
- source_word: Κύριε
  choice: Panginoon
  rationale: Ito ang karaniwang marangal na salin ng κύριος bilang tuwirang pantawag kay Jesus at pinananatili nito ang bigat ng titulo.
- source_word: τί γέγονεν
  choice: ano ang nangyari
  rationale: 'Natural sa Filipino at pinananatili ang diwa ng perpektong anyo: may nangyaring nagbunga ng kasalukuyang kalagayan.'
- source_word: ὅτι
  choice: at
  rationale: Sa tanong na ito, likas sa Filipino ang pag-uugnay na “ano ang nangyari at…” upang ipahayag ang kalagayang pinagtatakhan, nang hindi ipinipilit ang sanhi.
- source_word: ἡμῖν
  choice: sa amin
  rationale: Pinananatili ang simpleng pagtukoy sa mga tatanggap nang walang paliwanag na wala sa teksto.
- source_word: μέλλεις
  choice: mo ... ihahayag
  rationale: Ang aspektong prospektibo ng pandiwa sa Filipino ay natural na naghahatid ng balak o nalalapit na pagkilos nang hindi labis na itinatakda ang agarang panahon.
- source_word: ἐμφανίζειν σεαυτόν
  choice: ihahayag ang iyong sarili
  rationale: Malinaw at marangal na Filipino ito para sa pagpapakilala o pagpapakita ng sarili; pinananatili ang reflexive na diwa at ang saklaw na maaaring makita o makilala.
- source_word: κόσμῳ
  choice: sa mundo
  rationale: Pinananatili ang mahalagang bokabularyong Johannine at ang sadyang kalabuan kung tumutukoy ito sa sangkatauhan o sa mundong salungat sa Diyos.
theological_decisions:
- issue: Ang gamit ni Juan sa κόσμος
  choice: mundo
  alternative: sangkatauhan; mundong hindi sumasampalataya
  rationale: Hindi nilulutas ng talata ang buong saklaw ng termino. Ang “mundo” ay nagpapanatili sa teolohikal na tensiyon at nagpapahintulot sa mas malawak na konteksto ni Juan na magbigay-linaw.
- issue: Saklaw ng ἐμφανίζειν σεαυτόν
  choice: ihahayag ang iyong sarili
  alternative: ipakikita ang iyong sarili; ipakikilala ang iyong sarili
  rationale: Maaaring saklawin ng pandiwa ang pagpapakita at pagpapakilala. Ang “ihahayag” ay hindi naglilimita sa kapahayagan sa pisikal na pagpapakita lamang.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang em dash para hindi maging magulo ang paglilinaw sa pagkakakilanlan ni Judas. Walang talababa dahil walang marker na kailangan; ang ibinigay na mga talababa sa English layer ay tila hindi tugma ang pagkakalagay sa mga leksikal na alternatibo.
