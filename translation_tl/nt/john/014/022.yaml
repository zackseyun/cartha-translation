- from: Sinabi sa kanya ni Judas—hindi si Judas Iscariote—“Panginoon, ano ang nangyari at sa amin mo ihahayag ang iyong sarili, ngunit hindi sa mundo?”
  to: Sinabi sa kanya ni Judas (hindi ang Iscariote), “Panginoon, ano ang nangyari kung bakit balak mong ihayag ang iyong sarili sa amin ngunit hindi sa mundo?”
  rationale: Inayos ang parentetikong paglilinaw tungkol kay Judas, ginawang mas natural ang estruktura ng tanong, at idinagdag ang “balak” upang maipakita ang intensiyonal/prospektibong puwersa ng μέλλεις. Pinanatili ang bukas na saklaw ng “mundo” at ang reflexive na diwa ng ἐμφανίζειν σεαυτόν.
