id: JHN.14.27
reference: John 14:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰρήνην ἀφίημι ὑμῖν, εἰρήνην τὴν ἐμὴν δίδωμι ὑμῖν· οὐ καθὼς ὁ κόσμος δίδωσιν ἐγὼ δίδωμι ὑμῖν. μὴ ταρασσέσθω ὑμῶν ἡ καρδία μηδὲ δειλιάτω.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/027.yaml
  text: Peace I leave with you; my peace I give to you. I do not give to you as the world gives. Do not let your heart be troubled[a], nor let it be fearful.
translation:
  language: tl
  text: Kapayapaan ang iniiwan ko sa inyo; ang aking kapayapaan ang ibinibigay ko sa inyo. Hindi gaya ng pagbibigay ng sanlibutan ang pagbibigay ko sa inyo. Huwag mabagabag ang inyong puso ni panghinaan ng loob.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “matakot.” Ang pandiwang Griyego ay may diwa ng pagkatakot o pagkawala ng tapang.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰρήνην
  choice: kapayapaan
  rationale: Ang “kapayapaan” ang karaniwan at malawak na katumbas, at hindi nito nililimitahan ang diwa sa kawalan lamang ng alitan, panloob na kapanatagan, o ganap na kagalingan.
- source_word: ἀφίημι
  choice: iniiwan ko
  rationale: Likas na ipinahahayag nito ang kasalukuyang kilos ng pag-iiwan nang hindi idinaragdag sa pangunahing teksto ang mas interpretatibong diwa ng pagpapamana.
- source_word: εἰρήνην τὴν ἐμὴν
  choice: ang aking kapayapaan
  rationale: Pinananatili nito ang diin sa kapayapaang kay Jesus at ang pagkakaiba nito sa ibinibigay ng sanlibutan.
- source_word: δίδωμι
  choice: ibinibigay ko
  rationale: Natural sa modernong Tagalog at napapanatili ang pag-uulit ng pandiwa sa paghahambing ng pagbibigay ni Jesus at ng sanlibutan.
- source_word: οὐ καθὼς ὁ κόσμος δίδωσιν ἐγὼ δίδωμι ὑμῖν
  choice: Hindi gaya ng pagbibigay ng sanlibutan ang pagbibigay ko sa inyo
  rationale: Malinaw at natural nitong pinananatili ang mariing pagkakaiba sa paraan o uri ng pagbibigay ni Jesus at ng sanlibutan.
- source_word: κόσμος
  choice: sanlibutan
  rationale: Karaniwang salitang biblikal sa Tagalog na nagpapanatili sa malawak na Johannine na diwa ng κόσμος nang hindi ito pinapaliit sa lipunan o sa isang tiyak na kaayusan.
- source_word: μὴ ταρασσέσθω
  choice: Huwag mabagabag
  rationale: Tumpak at natural itong nagsasaad na huwag hayaang mapasailalim sa matinding ligalig ang puso, at angkop sa kaparehong pananalita sa Juan 14:1.
- source_word: ὑμῶν ἡ καρδία
  choice: ang inyong puso
  rationale: Pinananatili ang kolektibong isahan ng Griyego—isang “puso” na inuukol sa maramihang kausap—na natural din sa marangal na Tagalog.
- source_word: μηδὲ δειλιάτω
  choice: ni panghinaan ng loob
  rationale: Ipinahahayag nito ang pagkawala ng tapang na taglay ng δειλιάω at malinaw itong naihihiwalay sa naunang “mabagabag,” nang hindi gumagamit ng mapanuring salitang “duwag.”
theological_decisions:
- issue: Kalikasan ng kapayapaang ibinibigay ni Jesus
  choice: Panatilihin bilang “kapayapaan” at “aking kapayapaan” nang walang pagpapalawak.
  alternative: Tukuyin ito bilang panloob na kapanatagan, pang-eskatolohiyang kabuuan, o pakikipagkasundo sa Diyos.
  rationale: Hindi nililimitahan ng talata ang kahulugan sa iisang teolohikal na aspekto; pinananatili ng malawak na salita ang tunay na yaman at tensiyon ng pahayag.
- issue: Diwa ng δειλιάτω
  choice: “panghinaan ng loob” sa pangunahing teksto
  alternative: “matakot” o “maging duwag”
  rationale: Saklaw ng pandiwa ang pagkatakot at pagkawala ng tapang. Ang napiling anyo ay natural at hindi labis na mapanuri, samantalang inilalahad sa talababa ang leksikal na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “sanlibutan” upang mapanatili ang pamilyar na teolohikal na lawak ng Johannine κόσμος; iniwasan ang labis na interpretatibong pagpapaliwanag sa pangunahing teksto.
