  text: I will not leave you as orphans[b][a]; I am coming to you.
translation:
  language: tl
  text: Hindi ko kayo iiwan na parang mga ulila[a]; pupunta ako sa inyo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Hindi ko kayo iiwan na ulila.” Ang larawan sa Griyego ay mga anak na naiwan nang walang pagkalinga ng magulang.
    reason: lexical_alternative
  - marker: b
    text: Ang “pupunta ako sa inyo” ay maaaring tumukoy sa pagpapakita ni Jesus matapos siyang muling mabuhay, sa pagdating niya sa pamamagitan ng Banal na Espiritu, o sa pagbabalik niya sa hinaharap. Hindi nililimitahan ng pananalitang Griyego ang tinutukoy nito sa isa lamang sa mga ito.
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐκ ἀφήσω
  choice: Hindi ko ... iiwan
  rationale: Ang μέλλουσα/future na ἀφήσω na may οὐκ ay nagsasaad na hindi sila iiwan o pababayaan. Likas sa modernong Tagalog ang ayos na “Hindi ko kayo iiwan.”
- source_word: ὑμᾶς ὀρφανούς
  choice: kayo ... parang mga ulila
  rationale: Pinananatili ng “mga ulila” ang kongkretong larawang pampamilya ng mga anak na nawalan ng magulang o pagkalinga. Nililinaw ng “parang” na predikatibong paglalarawan ito sa mga alagad, hindi pahayag na literal silang ulila.
- source_word: ἔρχομαι
  choice: papunta ako
  rationale: Ang anyong pangkasalukuyan ay may agarang o nalalapit na puwersa. Ang “papunta ako” ay natural sa Tagalog at higit na nagpapanatili sa kasalukuyang anyo kaysa sa payak na “pupunta ako.”
- source_word: πρὸς ὑμᾶς
  choice: sa inyo
  rationale: Sa pandiwa ng paglapit o pagpunta, natural na katumbas sa Tagalog ng πρός na tumutukoy sa mga tao ang “sa inyo.”
theological_decisions:
- issue: Tinutukoy at panahon ng “papunta ako sa inyo”
  choice: Hindi tinukoy kung ang pagdating ay tumutukoy sa pagpapakita ni Jesus matapos ang muling pagkabuhay, sa pagdating niya sa pamamagitan ng Banal na Espiritu, o sa pagbabalik niya sa hinaharap.
  alternative: Tahasang ituring ito bilang isa lamang sa mga iyon.
  rationale: Hindi sapilitang nililimitahan ng salitang Griyego ang tinutukoy nito sa iisang pangyayari. Pinananatili ng salin at talababa ang tunay na lawak at tensiyong teolohikal ng pahayag.
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Ginamit ang “iiwang parang mga ulila” upang mapanatili ang kongkretong larawan, at “papunta ako” upang maipahayag ang agarang puwersa ng kasalukuyang ἔρχομαι nang hindi nilulutas ang malabong panahon o paraan ng pagdating.
