    issue: Panahunan at idiom ng “pupuntahan ko”
    rationale: Ang ὑπάγω ay present form na likas na maisasalin bilang “pinupuntahan ko” sa ganitong Tagalog na estruktura. Ang “pupuntahan ko” ay mas malinaw na future at maaari ring tumukoy sa bagay o lugar na dadalawin, kaya hindi ito ang pinakatumpak at pinakalikas na pagpili.
  revised_text: At alam ninyo ang daan patungo sa pinupuntahan ko.[a]
