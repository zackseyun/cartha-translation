translation:
  language: tl
  text: At alam ninyo ang daan patungo sa pinupuntahan ko.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ganito ang mababasa sa ilang manuskrito: “At alam ninyo kung saan ako pupunta, at alam ninyo ang daan.”'
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Karaniwang pang-ugnay na nagpapanatili sa payak na pagpapatuloy ng sinabi ni Jesus.
- source_word: ὅπου
  choice: sa pupuntahan ko
  rationale: Ipinahahayag ang lokasyong tinutungo sa natural na Tagalog; kaugnay ito ng “daan” nang hindi tinutukoy kung ano mismo ang lugar.
- source_word: ἐγὼ
  choice: ko
  rationale: Ang tahasang panghalip sa Griyego ay likas na isinama bilang paari sa pariralang pandiwa sa Tagalog.
- source_word: ὑπάγω
  choice: pupuntahan
  rationale: Likas sa konteksto ang anyong nagpapahayag ng nalalapit na pagpunta; hindi nito idinaragdag ang mas tiyak na diwa ng “pag-alis.”
- source_word: οἴδατε
  choice: alam ninyo
  rationale: Ang οἶδα ay may kasalukuyang kahulugang “alam”; ang maramihang ikalawang panauhan ay malinaw na ipinahayag sa “ninyo.”
- source_word: τὴν ὁδόν
  choice: ang daan
  rationale: Pinananatili ng “daan” ang literal at posibleng mas malawak na diwa ng ὁδός, na mahalaga sa kasunod na talakayan.
theological_decisions:
- issue: Ayos ng sugnay at kaugnayan ng “kung saan ako pupunta” sa “daan”
  choice: ang daan patungo sa pupuntahan ko
  alternative: kung saan ako pupunta, alam ninyo ang daan
  rationale: Nililinaw ng pangunahing salin ang natural na ugnayan ng daan at patutunguhan sa modernong Tagalog. Hindi nito tinutukoy ang patutunguhan o ipinapaliwanag ang teolohikal na kahulugan ng “daan.”
- issue: Varianteng teksto na may dalawang bagay na nalalaman
  choice: Hindi isinama sa pangunahing teksto
  alternative: Alam ninyo kung saan ako pupunta, at alam ninyo ang daan
  rationale: Ang ibinigay na SBLGNT ay may οἴδατε τὴν ὁδόν at hindi naglalaman ng hiwalay na pahayag na alam nila kung saan siya pupunta; inilagay ang variant sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Pinili ang “daan” sa halip na “landas” upang maging karaniwan at mapanatili ang literal at matalinghagang saklaw. Ginamit ang “patungo sa pupuntahan ko” bilang natural na Tagalog, bagaman bahagyang mas tahasan ang ugnayang patutunguhan kaysa sa anyo ng Griyego.
