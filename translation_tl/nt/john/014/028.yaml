revisions:
- from: Narinig ninyo na sinabi ko sa inyo, “Aalis ako, at darating ako sa inyo.” Kung iniibig ninyo ako, nagalak sana kayo[a] dahil pupunta ako sa Ama, sapagkat ang Ama ay higit na dakila kaysa sa akin.[b]
  to: Narinig ninyo na sinabi ko sa inyo, “Aalis ako at darating ako sa inyo.” Kung mahal ninyo ako, magagalak sana kayo sapagkat pupunta ako sa Ama, sapagkat ang Ama ay higit na dakila kaysa sa akin.[a]
  rationale: 'Inayos ang kondisyonal na pananalita upang maging mas natural at mas malinaw ang kontrapaktuwal na puwersa sa modern Filipino Tagalog. Pinalitan ang mas mataas at medyo makalumang ''iniibig'' at ''nagalak'' ng ''mahal'' at ''magagalak sana.'' Ginawang ''sapagkat'' ang pang-ugnay bago ang ''pupunta ako sa Ama'' upang malinaw na iyon ang proposisyong ikagagalak nila. Inalis ang footnote a ng draft dahil mali ang ankla nito: ang talang leksikal tungkol sa kondisyonal ay hindi nakaangkla sa ''nagalak sana kayo'' kundi sa dulo ng pangungusap sa English audit trail; hindi ito kinakailangan sa Filipino matapos ang rebisyon. Inilipat ang natitirang tala sa wastong nag-iisang marker sa dulo ng pahayag na tinutukoy nito.'
  reviewer_model: gpt-5.6-terra
