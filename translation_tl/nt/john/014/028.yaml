  text: ἠκούσατε ὅτι ἐγὼ εἶπον ὑμῖν· Ὑπάγω καὶ ἔρχομαι πρὸς ὑμᾶς. εἰ ἠγαπᾶτέ με ἐχάρητε ἄν, ⸀ὅτι πορεύομαι πρὸς τὸν πατέρα, ὅτι ὁ ⸀πατὴρ μείζων μού ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/028.yaml
  text: You heard that I said to you[a], ‘I am going away, and I am coming to you.’ If you loved me, you would have rejoiced that I am going to the Father[b], because the Father is greater than I.
translation:
  language: tl
  text: Narinig ninyo na sinabi ko sa inyo, “Aalis ako at darating ako sa inyo.” Kung mahal ninyo ako, magagalak sana kayo sapagkat pupunta ako sa Ama, sapagkat ang Ama ay higit na dakila kaysa sa akin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “ang Ama ay higit na dakila kaysa sa akin” ay isinalin ayon sa nakasulat, nang walang idinagdag na interpretibong panuring gaya ng “sa tungkulin” o “sa kalagayan.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἠκούσατε
  choice: Narinig ninyo
  rationale: Ang aorist ay likas na tumutukoy sa natapos na pakikinig nila sa naunang sinabi ni Jesus; malinaw at natural dito ang payak na nakaraang anyo.
- source_word: ὅτι ἐγὼ εἶπον ὑμῖν
  choice: na sinabi ko sa inyo
  rationale: Pinananatili ng “na” ang ὅτι bilang pananda ng nilalaman ng kanilang narinig.
- source_word: Ὑπάγω
  choice: Aalis ako
  rationale: Ipinahahayag nito ang nalalapit na pag-alis ni Jesus at natural na naihahatid sa Filipino ang kilos na palayo sa mga alagad.
- source_word: ἔρχομαι πρὸς ὑμᾶς
  choice: darating ako sa inyo
  rationale: Pinananatili ang kilos na patungo sa mga alagad at ang hinaharap na diwa ng pangkasalukuyang anyong Griyego, nang hindi idinaragdag ang ideya ng “muling” pagdating na hindi hayag sa pandiwa.
- source_word: εἰ ἠγαπᾶτέ με
  choice: Kung iniibig ninyo ako
  rationale: Ang “iniibig” ay marangal at likas na katumbas ng ἀγαπάω; kasama ng “sana” sa kasunod na sugnay, naihahatid nito ang kondisyong salungat sa aktuwal na tugon na inaasahan.
- source_word: ἐχάρητε ἄν
  choice: nagalak sana kayo
  rationale: Ang aorist indicative na may ἄν ay nagsasaad ng kagalakang sana ay nangyari bilang tugon; malinaw itong naipahahayag ng “nagalak sana.”
- source_word: πορεύομαι πρὸς τὸν πατέρα
  choice: pupunta ako sa Ama
  rationale: Malinaw at natural nitong pinananatili ang kilos ng pagpunta at ang Ama bilang hantungan.
- source_word: πατέρα / πατὴρ
  choice: Ama / ang Ama
  rationale: Pinananatili ang pantukoy at ang Johannine na gamit sa “Ama” bilang titulo, nang hindi nagdaragdag ng tahasang pang-angkin na “aking.”
- source_word: μείζων μού
  choice: higit na dakila kaysa sa akin
  rationale: Tuwirang pinananatili ang paghahambing at iniiwasang idagdag sa teksto ang paliwanag na “sa tungkulin,” “sa ranggo,” o iba pang interpretibong pananda.
theological_decisions:
- issue: Ang kahulugan ng “ang Ama ay higit na dakila kaysa sa akin” kaugnay ng pagkaunawa sa ugnayan ng Ama at Anak
  choice: Panatilihin ang lantad na paghahambing na “higit na dakila kaysa sa akin” nang walang interpretibong dagdag.
  alternative: “Ang Ama ay higit na dakila kaysa sa akin sa tungkulin/kalagayan,” o “habang ako ay nagkatawang-tao.”
  rationale: Walang tahasang panuring ang Griyego na naglilimita sa paghahambing sa tungkulin, ranggo, o kalagayan ng pagkakatawang-tao. Dapat panatilihin ng salin ang tunay na teolohikal na tensiyon sa halip na lutasin ito sa mismong teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “iniibig” at “nagalak” bilang mga salitang pormal ngunit madaling maunawaan; iniwasan ang sobrang makaluma at ang interpretibong pagpapalawak.
