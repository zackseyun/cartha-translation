review_pass:
  verdict: revise
  source_fidelity: 'Tapat ang pangunahing diwa sa Griyego: narinig ng mga alagad ang naunang sinabi ni Jesus, aalis siya at darating sa kanila, ang kondisyon ay salungat sa inaasahang/aktuwal na tugon, at pinananatili ang di-kinuwalipikahang paghahambing na ang Ama ay higit na dakila kaysa sa kanya. Gayunman, ang ''Kung iniibig ninyo ako'' ay hindi kasinglinaw sa makabagong Filipino bilang kondisyong salungat sa katotohanan; mas mabuting gamitin ang ''Kung mahal ninyo ako'' at panatilihin ang ''sana'' sa resulta. Ang ''dahil'' bago ang pagpunta sa Ama ay maaari ring magmukhang dahilan ng kanilang kagalakan; mas malapit sa ὅτι ang ''sapagkat''/''na'' bilang nilalaman ng ikagagalak.'
  naturalness: Ang 'iniibig' at 'nagalak' ay nauunawaan ngunit medyo mataas at mas lumang rehistro kaysa sa target na modern Filipino Tagalog. Ang 'mahal' at 'magagalak sana' ay mas natural, malinaw, at angkop pa rin sa marangal na rehistro. Ang pangkasalukuyang resultang 'magagalak sana kayo' ay ligtas na paraan upang ihatid ang kondisyonal na puwersa nang hindi ipinipilit ang aspektong nakaraan sa Filipino.
  terminology: Ang 'Ama' ay wastong titulo para sa πατήρ at hindi dapat lagyan ng 'aking.' Ang 'higit na dakila kaysa sa akin' ay tapat sa μείζων μού at wastong iniwang walang paliwanag na teolohikal sa pangunahing teksto. Walang kailangang baguhin sa pangalan o susing terminong teolohikal.
  issues:
  - severity: medium
    issue: Hindi ganap na malinaw ang kontrapaktuwal na kondisyon sa 'Kung iniibig ninyo ako.'
    rationale: Ang imperfect na ἠγαπᾶτέ sa εἰ-kondisyon, kasama ng ἐχάρητε ἄν, ay nagpapahiwatig ng kondisyong salungat sa inaasahang katotohanan. Sa Filipino, mas natural na maihatid ito sa 'Kung mahal ninyo ako, magagalak sana kayo' kaysa sa mas pangkalahatang 'Kung iniibig ninyo ako, nagalak sana kayo.'
  - severity: low
    issue: Ang 'dahil pupunta ako sa Ama' ay maaaring basahing dahilan kaysa nilalaman ng ikagagalak.
    rationale: Ang ikalawang ὅτι ay nagpapakilala ng proposisyong magiging dahilan o nilalaman ng kanilang kagalakan. Ang 'sapagkat pupunta ako sa Ama' ay mas malinaw at mas malapit sa sintaksis, habang ang kasunod na 'sapagkat' para sa huling ὅτι ay nananatiling natural.
  revised_text: Narinig ninyo na sinabi ko sa inyo, “Aalis ako at darating ako sa inyo.” Kung mahal ninyo ako, magagalak sana kayo sapagkat pupunta ako sa Ama, sapagkat ang Ama ay higit na dakila kaysa sa akin.[a]
