  text: I have spoken these things to you while staying with you[a].
translation:
  language: tl
  text: Sinabi ko sa inyo ang mga bagay na ito habang nananatili akong kasama ninyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “habang kasama pa ninyo ako.” Ang salitang Griyego ay anyo ng pandiwang “manatili,” na paulit-ulit na ginagamit sa Juan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: ang mga bagay na ito
  rationale: Pinananatili ang maramihang anyo ng demonstratibo at malinaw na tumutukoy sa mga naunang itinuro ni Jesus.
- source_word: λελάληκα
  choice: Sinabi ko
  rationale: Ang perpektong anyo ng λαλέω ay tumutukoy sa mga salitang naipahayag na ni Jesus at may bisa pa sa kasalukuyang usapan. Mas natural sa modernong Tagalog ang “Sinabi ko” kaysa “Sinalita ko.”
- source_word: ὑμῖν
  choice: sa inyo
  rationale: Tumpak na inilalarawan ang datibong panghalip na maramihan na tumutukoy sa mga alagad.
- source_word: παρ’ ὑμῖν
  choice: kasama ninyo
  rationale: Ipinahahayag ng παρά na may datibo ang pagiging kapiling o nasa presensiya ng mga alagad; natural sa Tagalog ang “kasama ninyo.”
- source_word: μένων
  choice: habang nananatili
  rationale: Pinananatili ang diwa ng present participle at ang leksikal na ugnayan sa paulit-ulit na gamit ni Juan sa μένω, nang hindi dinaragdagan ang kahulugan.
theological_decisions:
- issue: Pagpapanatili sa tematikong gamit ni Juan ng μένω
  choice: habang nananatili akong kasama ninyo
  alternative: habang kasama pa ninyo ako
  rationale: Ang “nananatili” ay nagpapanatili sa mahalagang bokabularyo ni Juan tungkol sa pananatili, samantalang nililinaw ng “kasama ninyo” ang kahulugan nito sa konteksto. Hindi nito ipinipilit ang isang natatanging doktrinal na pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “nananatili akong kasama ninyo” upang pagsamahin ang kalinawan sa karaniwang mambabasa at ang tematikong halaga ng μένω sa Ebanghelyo ni Juan.
