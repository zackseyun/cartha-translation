  text: Λέγει αὐτῷ Φίλιππος· Κύριε, δεῖξον ἡμῖν τὸν πατέρα, καὶ ἀρκεῖ ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/008.yaml
  text: Philip said to him[a], “Lord, show us the Father, and that is enough for us.”
translation:
  language: tl
  text: Sinabi ni Felipe sa kanya, “Panginoon, ipakita mo sa amin ang Ama, at sapat na iyon sa amin.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Λέγει
  choice: Sinabi
  rationale: Bagaman historical present ang Griyego, likas sa makabagong salaysay sa Tagalog ang pangnagdaang “Sinabi” sa pagpapakilala ng tuwirang pananalita.
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Ipinapahayag ng datibong panghalip ang taong kinausap; natural itong isalin na “sa kanya.”
- source_word: Φίλιππος
  choice: Felipe
  rationale: Ginamit ang nakaugaliang anyo ng pangalang Philip sa Bibliyang Tagalog.
- source_word: Κύριε
  choice: Panginoon
  rationale: Ang bokatibong κύριε ay maaaring magpahiwatig ng magalang na “Ginoo,” ngunit sa kontekstong ito ng pakikipag-usap ni Felipe kay Jesus, pinananatili ng “Panginoon” ang paggalang at posibleng kristolohikal na bigat nang hindi nagdaragdag ng paliwanag.
- source_word: δεῖξον
  choice: ipakita mo
  rationale: Tuwirang pakiusap ang aorist imperative ng δείκνυμι; malinaw at natural na katumbas ang “ipakita mo.”
- source_word: ἡμῖν
  choice: sa amin
  rationale: Natural na katumbas ng datibong maramihan pagkatapos ng “ipakita.”
- source_word: τὸν πατέρα
  choice: ang Ama
  rationale: Tumutukoy sa Diyos bilang Ama ni Jesus sa konteksto ng Juan; ang malaking titik ay nagpapakita ng tiyak na reperensiya nang hindi dinaragdagan ang teksto.
- source_word: καὶ
  choice: at
  rationale: Pinananatili ang payak na pag-uugnay ng pakiusap at ng pahayag tungkol sa kasapatan nito.
- source_word: ἀρκεῖ ἡμῖν
  choice: sapat na iyon para sa amin
  rationale: Ang ἀρκέω ay nangangahulugang maging sapat. Idinagdag ang “iyon” bilang likas na Tagalog na pantukoy sa ipinakikitang Ama, hindi bilang bagong nilalaman.
theological_decisions:
- issue: Pagbibigay-kahulugan sa κύριος bilang tawag kay Jesus
  choice: Panginoon
  alternative: Ginoo
  rationale: Maaaring simpleng magalang na tawag ang κύριε, ngunit mas angkop sa konteksto at sa karaniwang gamit kay Jesus sa Juan ang “Panginoon.” Ang alternatibong “Ginoo” ay tunay na leksikal na posibilidad, ngunit hindi kailangang ilagay sa talababa rito dahil hindi nito binabago ang pangunahing hinihiling ni Felipe.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang tuwirang anyo ng pakiusap at iniwasan ang mas interpretibong “ihayag” o “masisiyahan na kami.”
