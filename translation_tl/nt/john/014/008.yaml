  source_fidelity: Tumpak na naipapahayag ng salin ang pahayag ni Felipe, ang pakiusap na ipakita ang Ama, at ang kasapatan nito sa kanila. Ang “Panginoon” para sa κύριε ay katanggap-tanggap sa kontekstong Johannine at pinananatili ang posibleng bigat ng tawag nang hindi nagdaragdag ng paliwanag.
  naturalness: Nauunawaan ang kasalukuyang teksto, ngunit mas likas at walang markang ayos sa modernong Tagalog ang “Sinabi ni Felipe sa kanya” kaysa “Sinabi sa kanya ni Felipe.” Ang “sapat na iyon sa amin” ay mas tuwiran at idiomatiko kaysa “sapat na iyon para sa amin,” habang pinananatili ang datibong ἡμῖν.
