base_translation:
  language: en
  yaml_path: translation/nt/john/014/021.yaml
  text: The one who has my commandments and keeps them is the one who loves me[a]. And the one who loves me will be loved by my Father[c][b], and I will love him and reveal myself to him.
translation:
  language: tl
  text: Ang may taglay ng aking mga utos at tumutupad sa mga ito ay siyang umiibig sa akin.[a] At ang umiibig sa akin ay iibigin ng aking Ama, at iibigin ko rin siya at ihahayag ko sa kanya ang aking sarili.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang isahang anyo sa Griyego ay may kinatawang diwa at tumutukoy sa sinumang may taglay ng mga utos ni Jesus at tumutupad sa mga ito.
    reason: lexical_alternative
  - marker: b
    text: O “ipakikita ko sa kanya ang aking sarili.” Ang pandiwang Griyego ay maaaring mangahulugang ihayag, ipakilala, o ipakita ang sarili; malamang na binibigyang-diin dito ang personal na paghahayag ni Jesus ng kanyang sarili.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἔχων
  choice: Ang may
  rationale: Ang artikulo at kasalukuyang pandiwaring may substantibong gamit ay tumutukoy sa isang kinatawang tao. Likas sa Tagalog ang “Ang may” at napapanatili nito ang pangkalahatang diwa nang hindi ginagawang maramihan.
- source_word: τὰς ἐντολάς μου
  choice: mga utos ko
  rationale: Ang ἐντολή ay may awtoritatibong diwang “utos” o “kautusan.” Mas natural sa modernong Tagalog ang “mga utos ko” sa pangungusap na ito.
- source_word: τηρῶν αὐτὰς
  choice: tumutupad sa mga iyon
  rationale: Sa Juan, ang τηρέω ay maaaring mangahulugang ingatan, sundin, o tuparin. Ipinahahayag ng “tumutupad” ang tapat na pagsunod, at malinaw na ibinabalik ng “mga iyon” ang tinutukoy na mga utos.
- source_word: ἐκεῖνός ἐστιν ὁ ἀγαπῶν με
  choice: siya ang umiibig sa akin
  rationale: 'Binibigyang-diin ng ἐκεῖνος ang pagkakakilanlan: ang mismong taong may mga utos at tumutupad sa mga iyon ang umiibig kay Jesus. Natural at mariin ang “siya ang” sa Tagalog.'
- source_word: ἀγαπῶν / ἀγαπηθήσεται / ἀγαπήσω
  choice: umiibig / iibigin / iibigin
  rationale: Pinananatili ang sinadyang pag-uulit ng salitang-ugat na ἀγαπάω sa pamamagitan ng pare-parehong paggamit ng “ibig.”
- source_word: ὁ δὲ ἀγαπῶν με
  choice: At ang umiibig sa akin
  rationale: Mahinang pang-ugnay ang δέ rito at hindi kinakailangang salungatan; ang “At” ay angkop sa pagpapatuloy ng kaisipan.
- source_word: ἀγαπηθήσεται ὑπὸ τοῦ πατρός μου
  choice: ay iibigin ng aking Ama
  rationale: Tuwirang pinananatili ang hinaharap na balintiyak at ang mahalagang ugnayang Ama-Anak.
- source_word: κἀγὼ
  choice: at iibigin ko rin
  rationale: Ang κἀγώ ay καὶ ἐγώ. Ipinakikita ng “rin” na ang pag-ibig ni Jesus ay idinaragdag sa pag-ibig ng Ama, sa likas na ayos ng Tagalog.
- source_word: ἐμφανίσω αὐτῷ ἐμαυτόν
  choice: ihahayag ko sa kanya ang aking sarili
  rationale: Saklaw ng ἐμφανίζω ang pagpapakita, pagpapakilala, at personal na paghahayag. Pinananatili ng “ihahayag” ang malawak na diwa at nililinaw ng “ang aking sarili” na si Jesus mismo ang naghahayag ng sarili.
- source_word: αὐτὸν / αὐτῷ
  choice: siya / sa kanya
  rationale: Ang Griyego ay panlalaking isahan na may kinatawang gamit. Likas sa Tagalog ang “siya” at “kanya,” na hindi kailangang magtakda ng kasarian sa anyo ng panghalip.
theological_decisions:
- issue: Ugnayan ng pag-ibig at pagsunod
  choice: Inilahad ang pagtupad sa mga utos bilang pagkakakilanlan ng umiibig kay Jesus.
  alternative: Ipaliwanag na pinatutunayan ng pagsunod ang pag-ibig o na sa pagsunod nakakamit ang pag-ibig ng Diyos.
  rationale: Pagkakakilanlan ang tahasang isinasaad ng sintaks, hindi isang paliwanag tungkol sa sanhi, patunay, o gantimpala. Hindi nagdagdag ang salin ng meritoryong pahayag.
- issue: Kalikasan ng paghahayag ni Jesus sa sarili
  choice: ihahayag ko sa kanya ang aking sarili
  alternative: ipakikita ko sa kanya ang aking sarili
  rationale: Maaaring tumukoy ang ἐμφανίζω sa pagpapakita o pagpapakilala. Sa konteksto, hindi dapat limitahan ang kahulugan sa pisikal na pagkakita; napapanatili ng “ihahayag” ang personal na pagpapakilala at ang posibleng mas malawak na saklaw.
- issue: Kinatawang isahan
  choice: Pinanatili ang isahang anyo sa “siya” at “kanya,” at nilinaw sa talababa na pangkalahatan ang saklaw.
  alternative: Gawing maramihan ang mga panghalip.
  rationale: Isahan ang anyong Griyego at kinatawan nito ang sinumang tao. Ang mga panghalip sa Tagalog ay likas na walang tinutukoy na kasarian, kaya napapanatili kapwa ang bilang at ang pangkalahatang saklaw.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “utos” sa halip na mas mabigat na “kautusan,” “tumutupad” upang dalhin ang diwa ng tapat na pagsunod, at “ihahayag” upang hindi paliitin ang ἐμφανίζω tungo lamang sa pisikal na pagpapakita. Ang gitling na em dash ay nagbibigay ng natural na diin sa “siya ang” nang hindi binabago ang sintaks.
