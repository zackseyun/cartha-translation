base_translation:
  language: en
  yaml_path: translation/nt/john/014/011.yaml
  text: Believe me that I am in the Father and the Father is in me; but if not[a], believe because of the works themselves.
translation:
  language: tl
  text: 'Maniwala kayo sa akin: ako ay nasa Ama at ang Ama ay nasa akin; ngunit kung hindi, maniwala kayo dahil sa mismong mga gawa.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaaring isalin: “maniwala kayo batay sa mismong mga gawa.” Walang tahasang layon ang huling “maniwala” sa Griyego; ipinakikitang sapat na batayan ng paniniwala ang mismong mga gawa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύετέ μοι
  choice: Maniwala kayo sa akin
  rationale: Likas na ipinapahayag sa modernong Tagalog ang utos na πιστεύετε kasama ang datibong μοι, habang pinananatili ang tuwirang personal na pakiusap ni Jesus.
- source_word: ὅτι
  choice: na
  rationale: Ipinakikilala nito ang nilalaman ng dapat paniwalaan, hindi ang dahilan ng paniniwala.
- source_word: ἐν τῷ πατρὶ ... ἐν ἐμοί
  choice: nasa Ama ... nasa akin
  rationale: Pinananatili ang inuulit na ἐν at ang larawan ng kapwa pananahan nang hindi ito pinapalitan ng mas interpretatibong 'kaisa.'
- source_word: εἰ δὲ μή
  choice: Ngunit kung hindi
  rationale: Pinananatili ang maikli at bahagyang di-tiyak na kondisyong Griyego, na tumutukoy sa hindi pagtanggap sa naunang pahayag.
- source_word: διὰ τὰ ἔργα αὐτά
  choice: dahil sa mismong mga gawa
  rationale: Ang διά na may accusative ay nagsasaad ng batayan o dahilan; ang 'mismong' ay naghahatid ng diin ng αὐτά sa mga gawa bilang patotoo.
- source_word: πιστεύετε
  choice: maniwala kayo
  rationale: Pinananatiling walang tahasang layon ang ikalawang utos, gaya ng Griyego, sa halip na idagdag ang 'sa akin' o 'dito.'
theological_decisions:
- issue: Kapwa pananahan ng Anak at ng Ama
  choice: ako ay nasa Ama at ang Ama ay nasa akin
  alternative: ako at ang Ama ay kaisa
  rationale: Pinananatili ang mismong relasyonal na pananalita ni Juan at ang bigat nito nang hindi pinapalitan ng isang doktrinal na pagpapakahulugan.
- issue: Batayan ng paniniwala mula sa mga gawa
  choice: maniwala kayo dahil sa mismong mga gawa
  alternative: maniwala kayo sa akin dahil sa mga gawa
  rationale: Walang tahasang layon ang huling πιστεύετε sa Griyego. Ang salin ay nagpapanatili sa kawalang-tiyak na ito at inilalahad lamang ang mga gawa bilang batayan ng paniniwala.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang 'kayo' ayon sa maramihang anyo ng mga pandiwa. Pinanatili ang tradisyonal at teolohikal na katawagang 'Ama' at ang Johannine na pananalitang 'nasa ... nasa'.
