  text: λέγει αὐτῷ ὁ Ἰησοῦς· ⸂Τοσούτῳ χρόνῳ⸃ μεθ’ ὑμῶν εἰμι καὶ οὐκ ἔγνωκάς με, Φίλιππε; ὁ ἑωρακὼς ἐμὲ ἑώρακεν τὸν πατέρα· ⸀πῶς σὺ λέγεις· Δεῖξον ἡμῖν τὸν πατέρα;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/009.yaml
  text: Jesus said to him[a], “Have I been with you for so long, and you still have not known me, Philip? The one who has seen me has seen the Father. How can you say, ‘Show us the Father’?”
translation:
  language: tl
  text: Sinabi ni Jesus sa kanya, “Napakatagal ko nang kasama ninyo, ngunit hindi mo pa rin ako nakikilala, Felipe? Ang nakakita sa akin ay nakakita sa Ama. Paano mo nasasabing, ‘Ipakita mo sa amin ang Ama’?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τοσούτῳ χρόνῳ
  choice: Napakatagal ko nang
  rationale: Likas na ipinapahayag sa makabagong Tagalog ang mahabang panahong nagpapatuloy hanggang sa kasalukuyan at pinananatili ang retorikal na diin.
- source_word: μεθ’ ὑμῶν εἰμι
  choice: kasama ninyo
  rationale: Pinananatili ng maramihang “ninyo” ang ὑμῶν, bagaman si Felipe ang tuwirang kinakausap.
- source_word: οὐκ ἔγνωκάς με
  choice: hindi mo pa rin ako nakikilala
  rationale: Ang “pa rin” ay naghahatid ng mapagsaway na puwersa, at ang “nakikilala” ay natural na Tagalog para sa patuloy na pagkilalang personal na tinutukoy ng perfect form.
- source_word: Φίλιππε
  choice: Felipe
  rationale: Karaniwang anyo ng pangalang Philip sa tradisyong Tagalog at malinaw na bokatibo sa ayos ng pangungusap.
- source_word: ὁ ἑωρακὼς ἐμὲ
  choice: Ang nakakita sa akin
  rationale: Tuwirang substantibong salin ng articular perfect participle, nang hindi nililimitahan sa isang partikular na kasarian.
- source_word: ἑώρακεν τὸν πατέρα
  choice: ay nakakita sa Ama
  rationale: Pinananatili ang tuwiran at matinding pahayag ng Griyego, pati ang katawagang “ang Ama,” nang walang paliwanag na idinagdag.
- source_word: πῶς σὺ λέγεις
  choice: Paano mo nasasabing
  rationale: Natural na retorikal na tanong sa Tagalog na nagpapahayag ng pagtataka o pagsaway.
- source_word: Δεῖξον ἡμῖν τὸν πατέρα
  choice: Ipakita mo sa amin ang Ama
  rationale: Tuwirang isinasalin ang aorist imperative na δείκνυμι at inuulit ang kahilingan ni Felipe mula sa naunang talata.
theological_decisions:
- issue: Ugnayan ng pagkakita kay Jesus at pagkakita sa Ama
  choice: “Ang nakakita sa akin ay nakakita sa Ama”
  alternative: “Ang nakakita sa akin ay nakita kung ano ang Ama” o isang pinalawak na pormulang ontolohikal
  rationale: Pinananatili ang malakas na pahayag tungkol kay Cristo nang hindi ito pinahihina bilang pagkakahawig lamang at nang hindi rin nagdaragdag ng mga kategoryang doktrinal na wala sa mismong talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ninyo” upang mapanatili ang maramihang ὑμῶν at ang “mo” sa mga bahaging isahan na tuwirang nakatuon kay Felipe. Walang talababa sapagkat hindi kailangan para sa likas at tapat na saling Tagalog.
