  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐὰν πορευθῶ ⸀καὶ ἑτοιμάσω ⸂τόπον ὑμῖν⸃, πάλιν ἔρχομαι καὶ παραλήμψομαι ὑμᾶς πρὸς ἐμαυτόν, ἵνα ὅπου εἰμὶ ἐγὼ καὶ ὑμεῖς ἦτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/003.yaml
  text: And if I go and prepare a place for you[a], I am coming again and will take you to myself, so that where I am[b], you also may be.
translation:
  language: tl
  text: At kung aalis ako at maghahanda ng lugar para sa inyo, muli akong darating[a][b] at isasama ko kayo sa piling ko, upang kung nasaan ako, naroon din kayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “muli akong babalik.” Gumagamit ang Griyego ng pandiwang nasa anyong pangkasalukuyan (“dumarating ako”) na may diwang panghinaharap.
    reason: lexical_alternative
  - marker: b
    text: Iba-iba ang pagkaunawa kung ang “muli akong darating” ay tiyak na tumutukoy sa pangwakas na pagbabalik ni Jesus, sa kanyang mga pagpapakita matapos siyang muling mabuhay, sa pagdating ng Espiritu, o sa isang pangakong may higit sa isang katuparan.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν πορευθῶ
  choice: kung aalis ako
  rationale: Ipinahahayag ng ἐάν na may kasunod na aorist subjunctive ang isang panghinaharap na kundisyon. Likas sa modernong Tagalog ang “kung aalis ako,” at ang “aalis” ay angkop sa konteksto ng pagpanaw ni Jesus nang hindi dinaragdagan ang paraan ng pag-alis.
- source_word: ἑτοιμάσω τόπον ὑμῖν
  choice: maghahanda ng lugar para sa inyo
  rationale: Tuwirang ipinapahayag ng ἑτοιμάζω ang paghahanda at ng τόπος ang isang lugar. Hindi pinalalawak ng salin kung ano ang likas o anyo ng lugar na iyon.
- source_word: πάλιν ἔρχομαι
  choice: muli akong darating
  rationale: Maaaring gumamit ang pangkasalukuyang anyong ἔρχομαι ng panghinaharap na diwa. Ang “muli akong darating” ay malinaw at natural sa Tagalog; ipinaliliwanag sa talababa ang kapansin-pansing anyong pangkasalukuyan ng Griyego.
- source_word: παραλήμψομαι ὑμᾶς πρὸς ἐμαυτόν
  choice: isasama ko kayo sa piling ko
  rationale: Dito, ang παραλαμβάνω ay tumutukoy sa pagkuha o pagtanggap sa mga alagad upang makasama ni Jesus. Pinananatili ng “sa piling ko” ang personal at relasyonal na diin ng πρὸς ἐμαυτόν.
- source_word: ἵνα
  choice: upang
  rationale: Ipinakikilala ng ἵνα ang layunin. Ang “upang” ay maikli, marangal, at malinaw na naghahayag ng layuning iyon.
- source_word: ὅπου εἰμὶ ἐγὼ
  choice: kung nasaan ako
  rationale: Natural na katumbas ito ng lokatibong sugnay. Hindi na idinagdag ang hiwalay na “ako mismo,” sapagkat magiging pilit iyon sa Tagalog at sapat na ang diin sa kasalukuyang ayos.
- source_word: καὶ ὑμεῖς ἦτε
  choice: naroon din kayo
  rationale: Ipinapakita ng “din” ang καί at pinananatili ang pagkakatulad ng kinaroroonan ni Jesus at ng mga alagad. Sa sugnay na pinangungunahan ng “upang,” likas na naipahihiwatig ang layuning nasa subjunctive na ἦτε.
theological_decisions:
- issue: Ang tinutukoy na muling pagdating ni Jesus sa πάλιν ἔρχομαι
  choice: Isinalin bilang pangako ng muling pagdating nang hindi tinutukoy ang eksaktong paraan o panahon nito.
  alternative: Maaari itong unawain bilang mga pagpapakita matapos ang muling pagkabuhay, pagdating sa pamamagitan ng Espiritu, pangwakas na pagbabalik, o isang pangakong may higit sa isang katuparan.
  rationale: Malinaw na ipinangako ng talata ang muling presensiya ni Jesus at ang pagsama niya sa mga alagad sa kanyang piling, ngunit hindi dapat ipasya ng salin ang mas malawak na usaping interpretatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “sa piling ko” upang maging natural at mapanatili ang personal na diwa, at iniwasan ang mga salitang may makitid na denominasyonal na kahulugan.
