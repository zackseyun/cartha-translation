id: JHN.14.24
reference: John 14:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ μὴ ἀγαπῶν με τοὺς λόγους μου οὐ τηρεῖ· καὶ ὁ λόγος ὃν ἀκούετε οὐκ ἔστιν ἐμὸς ἀλλὰ τοῦ πέμψαντός με πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/024.yaml
  text: The one who does not love me does not keep my words[a]. And the word that you hear is not mine[b], but belongs to the Father who sent me.
translation:
  language: tl
  text: Ang hindi umiibig sa akin ay hindi tumutupad sa aking mga salita. At ang salitang naririnig ninyo ay hindi sa akin, kundi sa Ama na nagsugo sa akin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μὴ ἀγαπῶν με
  choice: Ang hindi umiibig sa akin
  rationale: Ang artikulong may pangkasalukuyang participle ay tumutukoy sa sinumang taong hindi umiibig kay Jesus. Likas sa Tagalog ang pangkalahatang anyong “Ang hindi umiibig sa akin,” at napapanatili nito ang diwa ng patuloy na disposisyon.
- source_word: τοὺς λόγους μου
  choice: aking mga salita
  rationale: Pinananatili ang maramihang λόγους at ang tuwirang kaugnayan nito sa mga itinuro o sinabi ni Jesus.
- source_word: τηρεῖ
  choice: tumutupad
  rationale: Sa kontekstong Juanino, ang τηρέω ay pag-iingat na nahahayag sa pagsunod. Ang “tumutupad” ay natural sa modernong Tagalog at higit na angkop dito kaysa sa literal na “nag-iingat,” nang hindi nililimitahan sa mekanikal na pagsunod lamang.
- source_word: ὁ λόγος
  choice: ang salita
  rationale: Pinananatili ang isahang λόγος at ang mahalagang bokabularyong Juanino. Maaari itong tumukoy sa kabuuang mensahe o turo bilang isang nagkakaisang salita.
- source_word: ὃν ἀκούετε
  choice: na naririnig ninyo
  rationale: Tuwirang isinasalin ang pangkasalukuyang ἀκούετε nang hindi idinaragdag ang hindi tahasang “mula sa akin.”
- source_word: οὐκ ἔστιν ἐμὸς
  choice: ay hindi sa akin
  rationale: Ang “hindi sa akin” ay maikli at natural na katumbas ng predikatibong ἐμός, habang hinahayaan ang kasunod na parirala na linawin ang pag-aari o pinagmulan.
- source_word: ἀλλὰ τοῦ πέμψαντός με πατρός
  choice: kundi sa Ama na nagsugo sa akin
  rationale: Ang eliptikong genitive ay likas na naihahayag sa Tagalog sa pamamagitan ng “sa Ama.” Pinananatili nito ang maaaring diwa ng pag-aari o pinagmulan nang hindi pinipili nang labis ang isa lamang.
- source_word: πέμψαντός
  choice: na nagsugo
  rationale: Ang “nagsugo” ay angkop sa aorist participle at sa karaniwang paglalarawan sa Ama bilang nagsugo kay Jesus.
theological_decisions:
- issue: Ugnayan ng salita ni Jesus at ng salita ng Ama
  choice: “hindi sa akin, kundi sa Ama na nagsugo sa akin”
  alternative: “hindi nagmula sa akin, kundi nagmula sa Ama na nagsugo sa akin”
  rationale: 'Pinananatili ng napiling salin ang tensiyon ng teksto: may pagkakaiba ang Anak at Ama, ngunit ang salitang ipinapahayag ni Jesus ay sa Ama na nagsugo sa kanya. Hindi nito nilulutas nang palihim ang genitive bilang pinagmulan lamang, ni ipinahihiwatig na itinatatwa ni Jesus ang awtoridad ng kanyang turo.'
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “umiibig” upang mapanatili ang dignidad at pare-parehong salin ng ἀγαπάω; “tumutupad” ang natural na ekspresyon para sa masunuring pag-iingat sa mga salita. Walang footnote dahil ang “sa Ama” ay sapat na nagpapanatili sa tunay na lawak ng genitive sa Tagalog.
