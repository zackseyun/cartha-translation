id: JHN.14.7
reference: John 14:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰ ⸀ἐγνώκειτέ με, καὶ τὸν πατέρα μου ⸂ἂν ᾔδειτε⸃· ⸀ἀπ’ ἄρτι γινώσκετε αὐτὸν καὶ ἑωράκατε ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/007.yaml
  text: If you had known me, you would have known my Father also. From now on you do know him and have seen him.
translation:
  language: tl
  text: Kung kilala sana ninyo ako, kilala rin sana ninyo ang aking Ama. Mula ngayon ay kilala na ninyo siya at nakita na ninyo siya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγνώκειτέ / ᾔδειτε
  choice: kilala sana ninyo / kilala rin sana ninyo
  rationale: Ang pagkilala sa isang persona ay likas na ipinapahayag sa modernong Tagalog sa pamamagitan ng statibong “kilala.” Inililipat ng “sana” ang diwang salungat-sa-katotohanang kondisyon na ipinahihiwatig ng mga panahunang Griyego at ng ἄν.
- source_word: ἀπ’ ἄρτι
  choice: Mula ngayon
  rationale: Direkta at natural na katumbas ng panandang temporal na nagsasaad ng simula sa kasalukuyang sandali.
- source_word: γινώσκετε
  choice: kilala na ninyo
  rationale: Pinananatili ang pahayag na indikativo at ang paglipat mula sa naunang kondisyong di-natupad tungo sa bagong kalagayan; ipinahihiwatig ng “na” ang mariing pagbabago nang hindi nagdaragdag ng hiwalay na salitang wala sa Griyego.
- source_word: ἑωράκατε
  choice: nakita na ninyo
  rationale: Ang perpektong anyo ay inilalarawan sa natural na Tagalog bilang naganap nang pagkakita na may bisa sa kasalukuyan.
theological_decisions:
- issue: Ang kahulugan ng pagkakita sa Ama
  choice: Pinanatili ang tuwirang “nakita na ninyo siya” nang hindi ipinapaliwanag kung paano nangyari ang pagkakitang ito.
  alternative: “Nakita na ninyo siya sa pamamagitan ko.”
  rationale: Bagaman maaaring ipinahihiwatig ng konteksto na nahahayag ang Ama kay Jesus, walang pariralang “sa pamamagitan ko” sa talata; hindi dapat ipasok sa teksto ang paliwanag.
- issue: Indikativo o pautos sa γινώσκετε
  choice: 'Indikativo: “kilala na ninyo siya.”'
  alternative: 'Pautos: “kilalanin ninyo siya.”'
  rationale: Bagaman maaaring magkapareho ang anyong Griyego ng indikativo at pautos, ang kasunod na indikativong perpekto na “nakita na ninyo siya” at ang kaibahan sa naunang kondisyon ay higit na sumusuporta sa indikativo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kilala” sa halip na mas mekanikal na “nalalaman” dahil persona ang tinutukoy; pinanatili ang “aking Ama” upang maipahayag ang personal na ugnayang nasa τὸν πατέρα μου.
