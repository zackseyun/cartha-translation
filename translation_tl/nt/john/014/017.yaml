  text: τὸ πνεῦμα τῆς ἀληθείας, ὃ ὁ κόσμος οὐ δύναται λαβεῖν, ὅτι οὐ θεωρεῖ αὐτὸ οὐδὲ ⸀γινώσκει· ⸀ὑμεῖς γινώσκετε αὐτό, ὅτι παρ’ ὑμῖν μένει καὶ ἐν ὑμῖν ⸀ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/017.yaml
  text: the Spirit of truth[a], whom the world is not able to receive, because it neither sees him nor knows him. You know him[b], because he remains with you and will be in you.
translation:
  language: tl
  text: ang Espiritu ng katotohanan[a], na hindi kayang tanggapin ng sanlibutan, sapagkat hindi siya nito nakikita ni nakikilala. Kilala ninyo siya, sapagkat nananatili siyang kasama ninyo at sasa inyo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “na hindi kayang tanggapin ng sanlibutan ... sapagkat hindi nito nakikita o nakikilala ito.” Neuter sa gramatika ang salitang Griyego para sa “Espiritu” (πνεῦμα), ngunit personal ang tinutukoy sa konteksto.'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa gitna ninyo.” Maramihan ang “inyo” sa Griyego kaya posible ang pangkomunidad na pagbasa, bagaman mas tuwirang pinananatili ng “sa inyo” ang kaibhan sa naunang “kasama ninyo.”
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: ang Espiritu ng katotohanan
  rationale: Pinananatili ang anyong genitibo ng Griyego at ang natatanging pananalita ni Juan. Ginamit ang malaking titik sa “Espiritu” dahil ang tinutukoy sa konteksto ay ang Banal na Espiritu.
- source_word: ὃ
  choice: na / siya
  rationale: Bagaman walang kasariang gramatikal ang “siya” sa Filipino, natural nitong tinutukoy ang isang personal na referent at hindi nito ipinahihiwatig na impersonal ang Espiritu.
- source_word: ὁ κόσμος
  choice: ang sanlibutan
  rationale: Pinananatili ang malawak na terminong ginagamit ni Juan nang hindi ito nililimitahan sa buong sangkatauhan o sa isang tiyak na masamang sistema.
- source_word: οὐ δύναται λαβεῖν
  choice: hindi kayang tanggapin
  rationale: Naipapahayag ang kawalan ng kakayahan sa δύναται at ang diwa ng pagtanggap sa λαβεῖν sa natural na modernong Filipino.
- source_word: θεωρεῖ
  choice: nakikita
  rationale: Direkta at natural na salin na hindi labis na nagpapakahulugan sa pandiwa bilang espirituwal na pagkaunawa lamang.
- source_word: γινώσκει / γινώσκετε
  choice: nakikilala / kilala
  rationale: Pinananatili ang pagkakaugnay ng dalawang anyo ng γινώσκω at ang kaibhan sa pagitan ng sanlibutan at ng mga alagad.
- source_word: παρ’ ὑμῖν μένει
  choice: nananatili siyang kasama ninyo
  rationale: Ang “nananatili” ay nagpapanatili sa kasalukuyang aspekto at sa mahalagang bokabularyo ni Juan; ang παρά na may datibo ay likas na naisasalin bilang “kasama ninyo.”
- source_word: ἐν ὑμῖν ἔσται
  choice: mananahan sa inyo
  rationale: Ipinapahayag ang hinaharap na ἔσται at pinananatili ang kaibhan ng ἐν mula sa naunang παρά. Ang “mananahan” ay natural at marangal na paglalarawan ng patuloy na presensiya sa loob.
theological_decisions:
- issue: Personal na pagtukoy sa Espiritu sa kabila ng neuter na gramatika ng Griyego
  choice: Gamitin ang personal na panghalip na “siya”
  alternative: Gumamit ng impersonal na pagtukoy
  rationale: Ang πνεῦμα ay neuter sa gramatika, ngunit ang tinutukoy sa konteksto ay isang personal na tagaganap. Ang Filipino na “siya” ay walang gramatikal na kasarian at natural na nagpapanatili sa personal na pagtukoy nang hindi nagdaragdag ng kasarian.
- issue: Ugnayan ng Espiritu sa mga mananampalataya sa παρά at ἐν
  choice: Panatilihin ang kaibhan bilang “kasama ninyo” at “sa inyo”
  alternative: Gawing pangkalahatang presensiya lamang ang dalawang parirala, gaya ng kapuwa “kasama ninyo”
  rationale: Magkaiba ang dalawang pang-ukol sa Griyego. Pinananatili ng salin ang pag-usad at tensiyon ng teksto sa halip na pag-isahin ang mga ito.
- issue: Indibidwal o pangkomunidad na diwa ng ἐν ὑμῖν
  choice: “sa inyo” sa pangunahing teksto
  alternative: “sa gitna ninyo”
  rationale: Ang ἐν ay pinakanatural na “sa,” at ang kaibhan nito sa “kasama ninyo” ay pinananatili. Gayunman, dahil maramihan ang ὑμῖν, posible rin ang pangkomunidad na pagbasa at itinala ito sa talababa.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “sanlibutan” upang panatilihin ang bokabularyong teolohikal ni Juan, at iniwasan ang labis na arkaikong ayos. Ang “mananahan” ay bahagyang mataas ang rehistro ngunit karaniwan at malinaw sa kontekstong biblikal.
