  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ πιστεύων εἰς ἐμὲ τὰ ἔργα ἃ ἐγὼ ποιῶ κἀκεῖνος ποιήσει, καὶ μείζονα τούτων ποιήσει, ὅτι ἐγὼ πρὸς τὸν ⸀πατέρα πορεύομαι·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/012.yaml
  text: Truly[a], truly, I say to you, the one who believes in me will also do the works that I do; and he will do greater works than these[b], because I am going to the Father.
translation:
  language: tl
  text: 'Totoong-totoo, sinasabi ko sa inyo: ang sumasampalataya sa akin ay gagawa rin ng mga gawaing ginagawa ko. At gagawa siya[b] ng mas dakilang mga gawa kaysa sa mga ito,[a] sapagkat pupunta ako sa Ama.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, literal na “mas dakila kaysa sa mga ito”; ang “mga gawa” ay ipinahihiwatig mula sa naunang sugnay.
    reason: lexical_alternative
  - marker: b
    text: 'Ang “ang sumasampalataya … siya” ay kinatawang isahan: tumutukoy ito sa sinumang sumasampalataya, hindi lamang sa isang partikular na tao.'
    reason: cultural_note
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Totoong-totoo
  rationale: Pinananatili ang pag-uulit at mariing bigat ng pormula sa natural at malinaw na modernong Tagalog.
- source_word: ὁ πιστεύων εἰς ἐμέ
  choice: ang sumasampalataya sa akin
  rationale: Inilalarawan ang substantival present participle bilang isang kinatawang isahan at pinananatili ang karaniwang diwa ng πιστεύω εἰς sa Juan.
- source_word: τὰ ἔργα
  choice: mga gawa
  rationale: Pinananatili ang mahalagang bokabularyo ni Juan at ang kaugnayan nito sa mga tanda at ginawa ni Jesus.
- source_word: ἃ ἐγὼ ποιῶ
  choice: ginagawa ko
  rationale: Natural na kasalukuyang anyo sa Tagalog na tumutugma sa Griyegong present nang hindi labis na idinidiin ang nagpapatuloy na aspekto.
- source_word: κἀκεῖνος
  choice: gagawa rin ... siya
  rationale: Naipapahayag ng “rin” ang dagdag na diin ng compound form, habang malinaw na ibinabalik ng “siya” ang tinutukoy na sumasampalataya.
- source_word: ποιήσει
  choice: gagawa
  rationale: Pinananatili ang payak na diwang panghinaharap at ang ugnayang pandiwa sa “ginagawa ko.”
- source_word: καὶ μείζονα τούτων ποιήσει
  choice: At gagawa siya ng mas dakilang mga gawa kaysa sa mga ito
  rationale: Ang “mga gawa” ay likas na ipinahihiwatig mula sa naunang sugnay; isinasama ito sa pangunahing teksto upang maging malinaw at natural, nang hindi tinutukoy kung sa anong paraan mas dakila ang mga ito.
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw na ipinahahayag ang sanhi o batayang ibinibigay ng sugnay.
- source_word: πρὸς τὸν πατέρα πορεύομαι
  choice: pupunta ako sa Ama
  rationale: Natural na inilalarawan ang present na may malapit na diwang panghinaharap, at pinananatili ang “Ama” sa halip na idagdag ang “aking.”
theological_decisions:
- issue: Kahulugan ng “mas dakilang mga gawa kaysa sa mga ito”
  choice: 'Iniwan ang pahayag na malawak: gagawa ang sumasampalataya ng mga gawa na mas dakila sa ilang diwa, at iniuugnay ito sa pagpunta ni Jesus sa Ama.'
  alternative: Maaaring unawain bilang mas malawak na gawain sa misyon, mas dakila sa kahalagahang pangkasaysayan ng pagtubos, o gawaing pinangyayari ng Espiritu sa pamamagitan ng iglesya.
  rationale: Hindi tinutukoy ng talata kung sa anong eksaktong paraan “mas dakila” ang mga gawa. Kaya hindi nagdaragdag ang salin ng paliwanag na magpapasya sa isang partikular na teolohikal na pagbasa.
- issue: Kinatawang isahan sa ὁ πιστεύων ... κἀκεῖνος
  choice: Ginamit ang isahang “ang sumasampalataya ... siya,” na sa Tagalog ay walang tinutukoy na kasarian.
  alternative: “Ang sinumang sumasampalataya sa akin” o maramihang pagbuo ng pangungusap.
  rationale: Pinananatili nito ang kinatawang isahan ng Griyego nang hindi nag-aangkat ng kasariang wala sa panghalip na Tagalog.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling basahin. Pinanatili ang mariing pag-uulit sa pambungad, ang bokabularyong “mga gawa,” at ang hindi nilulutas na lawak ng “mas dakila.”
