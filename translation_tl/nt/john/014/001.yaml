  yaml_path: translation/nt/john/014/001.yaml
  text: Do not let your heart be troubled[a]. Believe in God[b]; believe also in me.
translation:
  language: tl
  text: Huwag ninyong hayaang mabagabag ang inyong mga puso. Manampalataya kayo sa Diyos; manampalataya rin kayo sa akin.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Nananalig kayo sa Diyos; nananalig din kayo sa akin.” Sa Griyego, ang anyong πιστεύετε ay maaaring paturol (“nananalig kayo”) o pautos (“manampalataya kayo”).
    reason: alternative_reading
  - marker: b
    text: O, “Magtiwala kayo sa Diyos; magtiwala rin kayo sa akin.” Ang pandiwa ay maaaring magpahiwatig ng pagtitiwala gayundin ng pananampalataya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ ταρασσέσθω
  choice: Huwag ninyong hayaang mabagabag
  rationale: Ang present passive imperative na may μή ay isang pagbabawal. Ang “hayaang” ay nagpapahayag sa ikatlong panauhang pautos, at ang “mabagabag” ay likas at marangal na katumbas ng ταράσσω nang hindi nililimitahan ang diwa sa takot o pag-aalala lamang.
- source_word: ὑμῶν ἡ καρδία
  choice: ang inyong puso
  rationale: Isahan ang καρδία ngunit maramihan ang ὑμῶν, kaya pinananatili ang kolektibong isahan na “inyong puso,” na nauukol sa buong pangkat ng mga alagad.
- source_word: πιστεύετε
  choice: Manampalataya kayo
  rationale: Maaaring mangahulugan ang πιστεύω ng maniwala, magtiwala, o sumampalataya. Sa kontekstong may εἰς at personal na pagtutuon sa Diyos at kay Jesus, likas sa Filipino ang “manampalataya,” habang inilalahad sa talababa ang posibleng “magtiwala.”
- source_word: εἰς τὸν θεόν
  choice: sa Diyos
  rationale: Kapag kasama ng πιστεύω, ipinahihiwatig ng εἰς ang pananampalataya o pagtitiwalang nakatuon sa Diyos; ang “sa Diyos” ang natural na anyo sa Filipino.
- source_word: καὶ εἰς ἐμὲ πιστεύετε
  choice: manampalataya rin kayo sa akin
  rationale: Ipinapakita ng “rin” ang pandagdag na puwersa ng καί at pinananatili ng pag-uulit sa “manampalataya” ang paralelismo ng Griyego.
theological_decisions:
- issue: Paturol o pautos ang dalawang πιστεύετε
  choice: 'Kapwa pautos: “Manampalataya kayo sa Diyos; manampalataya rin kayo sa akin.”'
  alternative: “Nananalig kayo sa Diyos; manalig din kayo sa akin.” Maaari ring unawain na paturol ang dalawang anyo.
  rationale: Magkapareho ang anyo ng ikalawang panauhang maramihang present indicative at imperative sa Griyego. Sa konteksto, likas na kasunod ng pambungad na pagbabawal ang dalawang paghimok, ngunit tunay ang gramatikal na kalabuan kaya hindi ito ikinukubli at inilalahad ang mahalagang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “mabagabag” para sa malawak na diwa ng pagkabalisa o pagkagulo ng kalooban, at ang kolektibong isahang “inyong puso” upang mapanatili ang anyo ng Griyego. Inilagay ang parehong panandang [a] at [b] pagkatapos ng kaugnay na pangungusap upang malinaw na saklawin ang dalawang paglitaw ng πιστεύετε.
