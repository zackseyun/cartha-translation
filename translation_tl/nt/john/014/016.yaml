review_pass:
  verdict: revise
  source_fidelity: 'Tumpak ang pagsasalin ng pangunahing mga elemento: si Jesus ang hihiling sa Ama, ang Ama ang magbibigay ng isa pang παράκλητος, at ang pangako ay pangmatagalan. Gayunman, ang “upang makasama ninyo siya” ay karaniwang naglalagay sa “ninyo” bilang gumaganap na kasama ni “siya,” kaya hindi nito tuwirang pinananatili ang direksiyong nasa Griyego: ang Tagapagtanggol ang siyang magiging kasama ng mga alagad. Ang “upang siya ay maging kasama ninyo” ay malinaw na nagpapanatili ng ugnayang ito.'
  naturalness: Natural at marangal ang karamihan ng salin. Mas malinaw at likas sa modernong Filipino ang “upang siya ay maging kasama ninyo magpakailanman” kaysa sa kasalukuyang ayos, sapagkat inaalis nito ang kalabuan ng paksa at ng kasama.
  terminology: Ang “Tagapagtanggol” ay isang ligtas at angkop na pangunahing salin ng παράκλητος sa talatang ito. Ang talababa ay wastong nagbibigay ng mahahalagang alternatibong salin na “Tagatulong,” “Tagapayo,” at tradisyonal na “Mang-aaliw.” Ang “Ama” at “magpakailanman” ay angkop na mga terminong Filipino.
  issues:
  - severity: medium
    issue: Hindi malinaw ang direksiyon ng pagiging kasama sa “upang makasama ninyo siya.”
    rationale: Ang ἵνα ᾖ μεθ’ ὑμῶν ay literal na nagsasabing ang ibibigay na παράκλητος ang “ma(ka)sama” o magiging kasama ng “inyo.” Sa Filipino, ang “makasama ninyo siya” ay mas madaling unawaing kayo ang makakasama niya. Ang paglalantad kay “siya” bilang paksa ay nagpapanatili ng sintaksis at kahulugan ng Griyego.
  revised_text: At hihiling ako sa Ama, at bibigyan niya kayo ng isa pang Tagapagtanggol[a], upang siya ay maging kasama ninyo magpakailanman.
