  text: κἀγὼ ἐρωτήσω τὸν πατέρα καὶ ἄλλον παράκλητον δώσει ὑμῖν ἵνα ⸀ᾖ μεθ’ ὑμῶν εἰς τὸν ⸀αἰῶνα,
base_translation:
  language: en
  yaml_path: translation/nt/john/014/016.yaml
  text: And I will ask the Father[a], and he will give you another Advocate, so that he may be with you forever,
translation:
  language: tl
  text: At hihiling ako sa Ama, at bibigyan niya kayo ng isa pang Tagapagtanggol[a], upang siya ay maging kasama ninyo magpakailanman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Tagatulong,” “Tagapayo,” o ayon sa tradisyon, “Mang-aaliw” para sa Griyegong παράκλητος.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: At ... ako
  rationale: Pinagsasama ng κἀγώ ang pang-ugnay na καί at ang bahagyang idinidiing ἐγώ. Pinananatili ng “At ... ako” ang daloy ng pahayag nang hindi labis na binibigyang-diin ang panghalip.
- source_word: ἐρωτήσω
  choice: hihiling
  rationale: Ang anyong panghinaharap ng ἐρωτάω ay tumutukoy rito sa paghiling sa Ama. Mas natural at angkop sa ugnayang ipinahihiwatig ng konteksto ang “hihiling” kaysa sa “magtatanong” o sa makalumang “mananalangin.”
- source_word: τὸν πατέρα
  choice: sa Ama
  rationale: Walang panghalip na paari sa Griyego. Kaya pinananatili ang “Ama” at hindi idinaragdag ang “aking.” Hinihingi ng pandiwang Filipino na “humiling” ang pang-ukol na “sa.”
- source_word: ἄλλον
  choice: isa pang
  rationale: Ipinahihiwatig ng ἄλλον ang isa pa na naiiba sa nauna nang tinutukoy. Natural itong naihahayag sa Filipino bilang “isa pang” nang hindi nagdaragdag ng paliwanag tungkol sa uri o kalikasan niya.
- source_word: παράκλητον
  choice: Tagapagtanggol
  rationale: 'May malawak na saklaw ang παράκλητος: maaari itong magpahiwatig ng pagtatanggol, pagtulong, pagpapayo, o pag-aliw. Ang “Tagapagtanggol” ay nagpapanatili sa personal at representatibong diwa ng salita sa mga sulat ni Juan; inilalahad sa talababa ang iba pang lehitimong salin.'
- source_word: δώσει ὑμῖν
  choice: bibigyan niya kayo
  rationale: Natural na ayos ito sa modernong Filipino para sa pandiwang “magbigay” na may di-tuwirang layon, at malinaw na ang Ama ang simuno.
- source_word: ἵνα ᾖ
  choice: upang makasama ... siya
  rationale: Pinananatili ng “upang” ang layunin o bungang ipinahihiwatig ng ἵνα na sinusundan ng pasakali, sa halip na gawin lamang itong payak na pahayag sa hinaharap.
- source_word: μεθ’ ὑμῶν
  choice: makasama ninyo
  rationale: Tuwirang ipinahahayag nito ang μετά na may genitive bilang pagiging kasama nila. Ang “ninyo” ay angkop dahil maramihan ang ὑμῶν.
- source_word: εἰς τὸν αἰῶνα
  choice: magpakailanman
  rationale: Idyomatikong tumutukoy ang parirala sa walang-hanggang pananatili. Ang “magpakailanman” ay malinaw, marangal, at natural sa Filipino.
theological_decisions:
- issue: Pagsasalin ng παράκλητος sa pangakong tungkol sa Espiritu
  choice: Tagapagtanggol
  alternative: Tagatulong, Tagapayo, o ayon sa tradisyon, Mang-aaliw
  rationale: Hindi kayang saklawin ng iisang salitang Filipino ang lahat ng diwa ng παράκλητος. Pinananatili ng “Tagapagtanggol” ang personal, legal-relasyonal, at representatibong bigat ng salita, lalo na dahil nangangako si Jesus ng “isa pang” παράκλητος. Hindi nito nililimitahan ang persona sa isang di-personal na tungkulin, samantalang pinananatili sa talababa ang ibang kinikilalang posibilidad.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “hihiling” sa halip na mas makaluma o teolohikal na “mananalangin,” at “magpakailanman” bilang natural na katumbas ng idyomang Griyego. Nasa pangunahing teksto ang panandang [a], na tumutugma sa talababa.
