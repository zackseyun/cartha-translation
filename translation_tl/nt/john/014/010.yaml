    rationale: Ang δέ dito ay simpleng pangatnig na ‘ngunit,’ hindi kinakailangang nagpapahiwatig na pinalitan ng Ama ang pananalita ni Jesus. Ang ‘ngunit’ ay mas malapit sa ugnayan ng mga sugnay at mas natural sa Filipino.
