id: JHN.14.10
reference: John 14:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὐ πιστεύεις ὅτι ἐγὼ ἐν τῷ πατρὶ καὶ ὁ πατὴρ ἐν ἐμοί ἐστιν; τὰ ῥήματα ἃ ἐγὼ ⸀λέγω ὑμῖν ἀπ’ ἐμαυτοῦ οὐ λαλῶ, ὁ δὲ ⸀πατὴρ ἐν ἐμοὶ ⸀μένων ποιεῖ τὰ ἔργα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/010.yaml
  text: Do you not believe that I am in the Father and the Father is in me? The words that I say to you I do not speak from myself[b][a], but the Father who remains in me does his works.
translation:
  language: tl
  text: Hindi ka ba naniniwala na ako ay nasa Ama at ang Ama ay nasa akin? Ang mga salitang sinasabi ko sa inyo ay hindi ko sinasabi mula sa sarili ko[a], ngunit ang Amang nananatili[b] sa akin ang gumagawa ng kanyang mga gawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa sarili kong pagkukusa” o “sa sarili kong awtoridad.”
    reason: lexical_alternative
  - marker: b
    text: O “nananahan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύεις
  choice: naniniwala
  rationale: Pinananatili nito ang karaniwang temang πιστεύω sa Juan at likas itong pakinggan sa makabagong Tagalog.
- source_word: ἐν τῷ πατρὶ ... ἐν ἐμοί
  choice: nasa Ama ... nasa akin
  rationale: Tuwirang pinananatili ang wikang tumutukoy sa kapwa pananatili sa isa't isa, nang hindi ito pinapakahulugang 'kaisa.'
- source_word: τὰ ῥήματα
  choice: ang mga salita
  rationale: Direkta at natural na katumbas na nagpapanatili sa diin sa sinasabi ni Jesus.
- source_word: λέγω ... λαλῶ
  choice: sinasabi ... sinasalita
  rationale: Pinananatili hangga't natural sa Tagalog ang bahagyang pagkakaiba ng dalawang pandiwang Griyego.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: mula sa sarili ko
  rationale: Pinananatili ang malawak na saklaw ng parirala—maaaring tumukoy sa pinagmulan, sariling pagkukusa, o awtoridad—nang hindi pumipili nang tahasan sa isa lamang.
- source_word: μένων
  choice: nananatili
  rationale: Malinaw at makabagong salita na nagpapanatili sa patuloy na diwa ng μένω at sa mahalagang bokabularyo ng Juan.
- source_word: ποιεῖ τὰ ἔργα αὐτοῦ
  choice: gumagawa ng kanyang mga gawa
  rationale: Inilalahad ang possessive na αὐτοῦ at pinananatili ang paulit-ulit na bokabularyong 'gawa' sa Juan, bagaman sadyang may pag-uulit sa Tagalog.
theological_decisions:
- issue: Kapwa pananatili ng Ama at ng Anak sa isa't isa
  choice: ako ay nasa Ama at ang Ama ay nasa akin
  alternative: iisa kami ng Ama
  rationale: Pinananatili ang eksaktong relasyonal na larawan ng talata at hindi ito pinapalitan ng ibang pormulasyon mula sa Juan o ng mas huling terminolohiyang doktrinal.
- issue: Pinagmulan at pagkukusa sa pananalita ni Jesus
  choice: hindi ko sinasalita mula sa sarili ko
  alternative: hindi ako nagsasalita sa sarili kong kapangyarihan
  rationale: Hindi nililimitahan ang ἀπ’ ἐμαυτοῦ sa awtoridad lamang; pinananatili rin ang pagkakaisa at pagkakaiba ng Anak at Ama sa kanilang gawain.
- issue: Ang Ama bilang gumagawa ng mga gawa
  choice: ang Amang nananatili sa akin ang gumagawa ng kanyang mga gawa
  alternative: ang Amang nananahan sa akin ang siyang gumagawa
  rationale: Pinananatili ang tahasang paksa at possessive ng tekstong Griyego nang hindi ipinahihiwatig na hiwalay ang gawain ng Ama sa Anak.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “ka” sa tanong dahil iisang kausap si Jesus sa agarang konteksto, ngunit “inyo” dahil maramihan ang ὑμῖν. Pinanatili ang literal na “nasa” at ang bokabularyong “nananatili” at “mga gawa” dahil mahalaga ang mga ito sa Juan.
