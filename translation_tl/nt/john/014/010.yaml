  to: Hindi ka ba naniniwala na ako ay nasa Ama at ang Ama ay nasa akin? Ang mga salitang sinasabi ko sa inyo ay hindi ko sinasabi mula sa sarili ko[a], ngunit ang Amang nananatili[b] sa akin ang gumagawa ng kanyang mga gawa.
