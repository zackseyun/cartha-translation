  source_fidelity: Tumpak na naipapahayag ng draft ang kapwa pagiging ‘nasa’ ng Anak at Ama, ang maramihang ‘inyo,’ ang patuloy na diwa ng μένων, at ang possessive sa ‘kanyang mga gawa.’ Gayunman, ang ‘Sa halip’ ay mas malakas na pamalit kaysa sa simpleng adversative na δέ; mas tapat ang ‘ngunit.’
  naturalness: Karaniwang malinaw at marangal ang Tagalog. Mas natural at tuwiran ang ‘ngunit’ sa pag-uugnay ng dalawang sugnay. Ang pag-uulit ng ‘sinasabi’ ay katanggap-tanggap at mas natural kaysa sa sapilitang pag-iiba ng pandiwa sa Tagalog.
  terminology: Ang ‘Ama,’ ‘nasa,’ ‘nananatili,’ at ‘mga gawa’ ay angkop at pinananatili ang mahalagang Johannine na bokabularyo. Ang ‘mula sa sarili ko’ ay medyo pormal ngunit nauunawaan at pinananatili ang malawak na saklaw ng ἀπ’ ἐμαυτοῦ; nililinaw ng talababa ang posibleng diwa ng pagkukusa o awtoridad.
  issues:
