  yaml_path: translation/nt/john/014/015.yaml
  text: If you love me[a], you will keep my commandments.
translation:
  language: tl
  text: Kung mahal ninyo ako, tutuparin[a] ninyo ang aking mga utos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “susundin ninyo ang aking mga utos.” Ang pandiwang Griyego ay maaaring mangahulugang tuparin, sundin, ingatan, o panatilihin; pinili ang “tutuparin” upang mapanatili ang mas malawak na diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν
  choice: Kung
  rationale: Likas na panandang Filipino para sa kondisyong ipinahahayag ng ἐάν; hindi nito dinaragdagan ang pangungusap ng paulit-ulit na diwang maaaring ipahiwatig ng “tuwing.”
- source_word: ἀγαπᾶτέ
  choice: iniibig ninyo
  rationale: Tuwirang inililipat ang kasalukuyang aktibong pandiwa at pinananatili ang marangal at karaniwang biblikal na katawagang “iniibig.” Ipinahihiwatig ng “ninyo” na maramihan ang kausap.
- source_word: με
  choice: ako
  rationale: Tuwirang layon na tumutukoy kay Jesus.
- source_word: τὰς ἐντολὰς τὰς ἐμὰς
  choice: ang aking mga utos
  rationale: Pinananatili ang bigat ng ἐντολάς bilang “mga utos” at ang malinaw na pag-aari sa mga ito, nang hindi ginagawang mabigat o artipisyal ang ayos sa Filipino.
- source_word: τηρήσετε
  choice: tutuparin ninyo
  rationale: Hinaharap na anyo ang “tutuparin ninyo,” kaya pinananatili nito ang future indicative ng Griyego sa halip na gawing pautos. Sa kaugnayan ng “mga utos,” natural itong nagpapahayag ng pagsunod at patuloy na pagtupad, bagaman maaari ring ilipat bilang “susundin” o “iingatan.”
theological_decisions:
- issue: Kung ang τηρήσετε ay isasalin bilang tuwirang utos o bilang pahayag tungkol sa hinaharap
  choice: 'Pahayag tungkol sa hinaharap: “tutuparin ninyo”'
  alternative: 'Pautos: “tuparin ninyo ang aking mga utos”'
  rationale: Future indicative ang anyong Griyego, hindi imperative. Pinananatili ng salin ang tensiyong teolohikal na ang pag-ibig kay Jesus ay humahantong sa pagtupad sa kanyang mga utos, sa halip na tahimik itong gawing isang tuwirang pag-uutos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “iniibig” sa halip na mas kolokyal na “minamahal” upang mapanatili ang pormal ngunit madaling maunawaang himig. Inilagay ang talababa sa “tutuparin” sapagkat iyon ang salitang tinatalakay nito.
