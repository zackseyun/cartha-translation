id: JHN.14.23
reference: John 14:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ἐάν τις ἀγαπᾷ με τὸν λόγον μου τηρήσει, καὶ ὁ πατήρ μου ἀγαπήσει αὐτόν, καὶ πρὸς αὐτὸν ἐλευσόμεθα καὶ μονὴν παρ’ αὐτῷ ⸀ποιησόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/023.yaml
  text: Jesus answered and said to him[a], “If anyone loves me, he will keep my word, and my Father will love him[b], and we will come to him and make our dwelling with him.”
translation:
  language: tl
  text: Sumagot si Jesus at sinabi sa kanya, “Kung may umiibig sa akin, iingatan niya ang aking salita[a]. Iibigin siya ng aking Ama, at pupunta kami sa kanya at gagawa kami ng tahanan sa piling niya[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “aking turo” o “ang sinasabi ko.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “gagawa kami ng aming tahanan kasama niya” o “mananahan kami sa piling niya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ
  choice: Sumagot si Jesus sa kanya
  rationale: Likas sa modernong Tagalog ang “sumagot” bilang salin ng pinagsamang pormulang salaysay na “sumagot at sinabi”; hindi kailangang ulitin ang dalawang pandiwa upang mapanatili ang kahulugan.
- source_word: Ἐάν τις
  choice: Kung ... ang sinuman
  rationale: Pinananatili nito ang bukas at pangkalahatang saklaw ng kondisyong Griyego.
- source_word: ἀγαπᾷ με
  choice: iniibig ako
  rationale: Ang “iniibig” ay marangal at malinaw na katumbas ng ἀγαπάω, at ang ayos na ito ay natural sa kondisyong Tagalog.
- source_word: τὸν λόγον μου
  choice: ang aking salita
  rationale: Pinananatili ng “salita” ang malawak na saklaw at teolohikal na alingawngaw ng λόγος sa Juan; maaari rin itong tumukoy sa turo o sinabi ni Jesus.
- source_word: τηρήσει
  choice: tutuparin niya
  rationale: Sa kontekstong ito, ipinahihiwatig ng τηρέω ang maingat na pagsunod at pag-iingat sa salita. Ang “tutuparin” ay mas natural kaysa literal na “iingatan” at hindi ito nililimitahan sa pagsunod lamang sa mga tuntunin.
- source_word: ὁ πατήρ μου ἀγαπήσει αὐτόν
  choice: Iibigin siya ng aking Ama
  rationale: Pinananatili ang hinaharap na aspekto at ang karaniwang katawagang Juaniko na “aking Ama.”
- source_word: πρὸς αὐτὸν ἐλευσόμεθα
  choice: pupunta kami sa kanya
  rationale: Malinaw na ipinapahayag ang paglapit nina Jesus at ng Ama sa taong tinutukoy, habang pinananatili ang tahasang pangmaramihang simuno.
- source_word: μονὴν παρ’ αὐτῷ ποιησόμεθα
  choice: mananahan kasama niya
  rationale: Natural na Tagalog ito para sa idyomang “gagawa ng tahanan/pananahanan sa piling niya” at pinananatili ang diwa ng namamalaging presensiya nang hindi sapilitang tinutukoy kung ito ay lokatibong “sa loob” o relasyonal na “kasama.”
theological_decisions:
- issue: Ang pangmaramihang simuno sa “pupunta kami ... at mananahan”
  choice: Tahasan ang “kami,” na tumutukoy kay Jesus at sa Ama na magkasamang kumikilos.
  alternative: Gawing di-tahasan ang simuno o isahan ang kilos upang hindi idiin ang pagkakaiba ng mga persona.
  rationale: Parehong nasa unang panauhang pangmaramihan ang ἐλευσόμεθα at ποιησόμεθα. Dapat panatilihin ang pinagsamang pagkilos nina Jesus at ng Ama nang walang idinaragdag na paliwanag na doktrinal.
- issue: Kasariang gramatikal ng generic na τις at αὐτόν
  choice: “sinuman” at kasunod na “niya/siya,” na walang tinutukoy na kasarian sa Tagalog
  alternative: Magdagdag ng panlalaking “lalaki” o gumamit ng pormulang tahasang nagsasaad ng kasarian.
  rationale: Likas na walang kasariang gramatikal ang mga panghalip sa Tagalog, kaya tumpak na naihahatid ang pangkalahatang saklaw at isahang reperensiya ng Griyego.
- issue: Kaugnayan ng pag-ibig at pagtupad sa salita
  choice: 'Panatilihin bilang kondisyong pahayag: “Kung iniibig ... tutuparin.”'
  alternative: Ipaliwanag ang pagtupad bilang sanhi, patunay, o bunga ng pag-ibig.
  rationale: Hindi tahasang tinutukoy ng talata ang mas eksaktong lohikal o soteriolohikal na ugnayan; dapat panatilihin ang tensiyon sa halip na ipasya ito sa salin.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “iniibig” upang tumugma sa mataas ngunit karaniwang rehistrong biblikal, at “mananahan kasama niya” upang maging natural nang hindi nawawala ang relasyonal at namamalaging diwa ng μονή παρ’ αὐτῷ.
