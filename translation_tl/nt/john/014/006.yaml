id: JHN.14.6
reference: John 14:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Ἐγώ εἰμι ἡ ὁδὸς καὶ ἡ ἀλήθεια καὶ ἡ ζωή· οὐδεὶς ἔρχεται πρὸς τὸν πατέρα εἰ μὴ δι’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/006.yaml
  text: Jesus said to him[a], “I am the way, and the truth, and the life[b]. No one comes to the Father except through me.”
translation:
  language: tl
  text: Sinabi sa kanya ni Jesus[a], “Ako ang daan, at ang katotohanan, at ang buhay. Walang pumupunta sa Ama kundi sa pamamagitan ko.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “Sinasabi sa kanya ni Jesus.” Gumagamit dito ang Griyego ng historikal na pangkasalukuyan.
    reason: lexical_alternative
  - marker: b
    text: O, “Walang pumupunta sa Ama maliban sa pamamagitan ko.”
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: Sinabi
  rationale: Bagaman historikal na pangkasalukuyan ang anyong Griyego (“sinasabi”), mas natural sa makabagong salaysay sa Filipino ang pangnagdaan na “sinabi,” nang hindi binabago ang kahulugan.
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Tuwirang ipinapahayag ang di-tuwirang layon ng pagsasalita ni Jesus.
- source_word: Ἐγώ εἰμι
  choice: Ako ang
  rationale: Pinananatili ang tahasang binigyang-diin na unang panauhan; sa pangungusap na panaguri sa Filipino, natural ang “Ako ang.”
- source_word: ἡ ὁδός
  choice: ang daan
  rationale: Saklaw ng “daan” ang literal at metaporikal na diwa ng ὁδός at malinaw itong tumutukoy sa paglapit sa Ama.
- source_word: ἡ ἀλήθεια
  choice: ang katotohanan
  rationale: Ito ang tuwiran at likas na katumbas ng ἀλήθεια, habang hindi nililimitahan ang mas malawak na diwa nito sa Ebanghelyo ni Juan.
- source_word: ἡ ζωή
  choice: ang buhay
  rationale: Pinananatili ng payak na “buhay” ang malawak na teolohikal na saklaw ng ζωή nang walang idinagdag na pagpapakahulugan.
- source_word: οὐδεὶς
  choice: Walang
  rationale: Natural na Filipino para sa ganap na negatibong “walang sinuman” sa ganitong ayos ng pangungusap.
- source_word: ἔρχεται
  choice: pumupunta
  rationale: Ipinahahayag ng pangkasalukuyang anyo ang isang pangkalahatan at patuloy na katotohanan, hindi lamang isang minsanang pagpunta.
- source_word: πρὸς τὸν πατέρα
  choice: sa Ama
  rationale: Ipinahahayag ang kilos patungo sa Ama; ginamit ang malaking titik sapagkat personal na pantukoy ito sa Diyos sa konteksto.
- source_word: εἰ μὴ
  choice: kundi
  rationale: Sa negatibong pangungusap, natural na ipinapahayag ng “kundi” ang eksepsiyong tinutukoy ng εἰ μὴ.
- source_word: δι’ ἐμοῦ
  choice: sa pamamagitan ko
  rationale: Malinaw na pinananatili ang diwa ng paraan o pamamagitan na taglay ng διά na may genitive.
theological_decisions:
- issue: Ang pagiging bukod-tangi ni Jesus bilang daan patungo sa Ama
  choice: “Walang pumupunta sa Ama kundi sa pamamagitan ko.”
  alternative: “Walang pumupunta sa Ama maliban sa pamamagitan ko.”
  rationale: Tahasang eksklusibo ang pahayag sa Griyego. Hindi ito pinalambot o pinalawak nang lampas sa sinasabi ng talata.
- issue: Ang tatluhang hanay ng mga panaguri tungkol kay Jesus
  choice: “ang daan, at ang katotohanan, at ang buhay”
  alternative: “ang daan, ang katotohanan, at ang buhay”
  rationale: Inulit ang “at” upang maipamalas ang paulit-ulit na καί at ang natatanging bigat ng bawat panaguri, habang nananatiling malinaw sa Filipino.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pamilyar na “daan,” “katotohanan,” “buhay,” at “Ama,” gayundin ang retorikal na pag-uulit ng “at.”
