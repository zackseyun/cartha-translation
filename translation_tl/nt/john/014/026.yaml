id: JHN.14.26
reference: John 14:26
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ παράκλητος, τὸ πνεῦμα τὸ ἅγιον ὃ πέμψει ὁ πατὴρ ἐν τῷ ὀνόματί μου, ἐκεῖνος ὑμᾶς διδάξει πάντα καὶ ὑπομνήσει ὑμᾶς πάντα ἃ εἶπον ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/026.yaml
  text: But the Advocate[a], the Holy Spirit, whom the Father will send in my name, he will teach you all things and remind you of all that I said to you.
translation:
  language: tl
  text: Ngunit ang Tagapagtanggol[a], ang Banal na Espiritu, na isusugo ng Ama sa pangalan ko, siya ang magtuturo sa inyo ng lahat ng bagay at magpapaalala sa inyo ng lahat ng sinabi ko sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “Katulong,” “Tagapayo,” o “Mang-aaliw” para sa “Tagapagtanggol” (Griyego: paraklētos).'
    reason: lexical_alternative
lexical_decisions:
- source_word: παράκλητος
  choice: Tagapagtanggol
  rationale: Pinananatili nito ang personal at aktibong papel ng παράκλητος bilang kumakatawan at tumutulong para sa iba. Dahil hindi saklaw ng iisang salitang Tagalog ang buong lawak ng kahulugan, inilagay sa talababa ang mahahalagang alternatibo.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: ang Banal na Espiritu
  rationale: Ito ang malinaw, likas, at kinikilalang makabagong katawagan sa Tagalog.
- source_word: ὃ πέμψει ὁ πατήρ
  choice: na isusugo ng Ama
  rationale: Tumpak na ipinapahayag ng anyong balintiyak sa Tagalog ang Ama bilang tagagawa at ang Espiritu bilang personal na isinugo.
- source_word: ἐν τῷ ὀνόματί μου
  choice: sa pangalan ko
  rationale: Pinananatili ng matatag na idyomang ito ang posibleng mga diwa ng pagkatawan, kapamahalaan, at kaugnayan nang hindi nililimitahan sa isa lamang.
- source_word: ἐκεῖνος
  choice: siya ang
  rationale: Ipinahihiwatig ng ayos na ito ang diin ng demonstratibong Griyego at malinaw na tinutukoy ang personal na Tagapagtanggol.
- source_word: διδάξει ὑμᾶς πάντα
  choice: magtuturo sa inyo ng lahat ng bagay
  rationale: Direkta at natural itong salin na nagpapanatili sa lawak ng πάντα.
- source_word: ὑπομνήσει ὑμᾶς
  choice: magpapaalala sa inyo
  rationale: 'Likas na ipinapahayag sa Tagalog ang causative na diwa ng pandiwa: pangyayaring muli nilang maalala.'
- source_word: πάντα ἃ εἶπον ὑμῖν
  choice: lahat ng sinabi ko sa inyo
  rationale: Pinananatili nito ang saklaw at tuwirang anyo ng pahayag ni Jesus.
theological_decisions:
- issue: Personal na pagtukoy sa Banal na Espiritu
  choice: Gamitin ang personal at madiing “siya ang”
  alternative: Gumamit ng di-personal na pagtukoy batay sa pambalarilang neuter na πνεῦμα
  rationale: Pinagsasama ng teksto ang neuter na πνεῦμα, ang personal na titulong παράκλητος, at ang madiing panlalaking demonstratibong ἐκεῖνος. Ang “siya ang” ay kumakatawan sa personal na pagkilos at diin ng teksto nang hindi nagdaragdag ng paliwanag.
- issue: Pagsasalin sa παράκλητος
  choice: Tagapagtanggol
  alternative: Katulong, Tagapayo, o Mang-aaliw
  rationale: Mayaman sa kahulugan ang titulo at maaaring tumukoy sa pagtatanggol, pagkatawan, pagtulong, pagpapayo, at pag-aliw. Pinakamainam na pinananatili ng “Tagapagtanggol” ang aktibo at personal na papel, habang inilalahad sa talababa ang ibang tunay na posibilidad.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “sa pangalan ko” upang mapanatili ang siksik at hindi ganap na nililimitahang idyoma ng Griyego; ang “siya ang” naman ay nagbibigay ng likas na diin sa personal na tagaganap.
