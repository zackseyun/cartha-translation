  text: καὶ ὅ τι ἂν αἰτήσητε ἐν τῷ ὀνόματί μου τοῦτο ποιήσω, ἵνα δοξασθῇ ὁ πατὴρ ἐν τῷ υἱῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/013.yaml
  text: And whatever you ask in my name[a], this I will do, so that the Father may be glorified in the Son.
translation:
  language: tl
  text: At anumang hingin ninyo sa pangalan ko, iyon ang gagawin ko, upang ang Ama ay luwalhatiin sa Anak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pamamagitan ng Anak.” Ang Griyego ay literal na “sa Anak,” na maaaring tumukoy sa saklaw o paraan kung paano niluluwalhati ang Ama.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅ τι ἂν
  choice: anumang
  rationale: Likas na ipinahahayag ng “anumang” ang malawak at di-tiyak na saklaw ng konstruksiyong may ἄν.
- source_word: αἰτήσητε
  choice: hingin ninyo
  rationale: Ang anyong pandiwa ay ikalawang panauhang maramihan; ang “hingin ninyo” ay natural sa konteksto ng paghiling o panalangin.
- source_word: ἐν τῷ ὀνόματί μου
  choice: sa pangalan ko
  rationale: Pinananatili nito ang matalinghagang lawak ng parirala—awtoridad, pagkatawan, at pakikiayon kay Jesus—nang hindi nililimitahan sa iisang paliwanag.
- source_word: τοῦτο
  choice: iyon
  rationale: Tahasang pinananatili ang demonstratibo na tumutukoy sa anumang hiningi; mas natural dito sa Tagalog ang “iyon” kaysa “ito.”
- source_word: ποιήσω
  choice: gagawin ko
  rationale: Tuwiran at natural na katumbas ng malawak na kahulugan ng ποιέω sa panghinaharap.
- source_word: ἵνα
  choice: upang
  rationale: Malinaw at marangal na naghahayag ng layunin.
- source_word: δοξασθῇ
  choice: maluwalhati
  rationale: Pinananatili ang biblikal na wika ng kaluwalhatian at ang pasibong diwa ng pandiwa.
- source_word: ὁ πατὴρ
  choice: ang Ama
  rationale: Sinusunod ang Griyegong “ang Ama,” hindi “ang aking Ama,” at pinananatili ang natatanging katawagan sa Ebanghelyo ni Juan.
- source_word: ἐν τῷ υἱῷ
  choice: sa Anak
  rationale: Pinananatili ang hindi lubusang nilulutas na gamit ng ἐν, na maaaring tumukoy sa larangan o paraan ng pagluwalhati sa Ama.
theological_decisions:
- issue: Kahulugan ng paghiling “sa pangalan ko”
  choice: Pinanatili bilang “sa pangalan ko” nang walang paliwanag sa loob ng teksto.
  alternative: sa ilalim ng aking awtoridad; kaisa ko; ayon sa aking pagkatao at kalooban
  rationale: Maraming magkakaugnay na diwa ang parirala sa konteksto ni Juan; hindi dapat ipako ng salin sa iisang doktrinal na pagpapakahulugan.
- issue: Diwa ng ἐν τῷ υἱῷ
  choice: sa Anak
  alternative: sa pamamagitan ng Anak
  rationale: Maaaring ipahayag ng ἐν ang larangan o paraan. Pinananatili ng pangunahing teksto ang pormal na pagkakaugnay, samantalang inilalagay sa talababa ang posibleng instrumental na diwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ninyo” upang ipakita ang maramihang kausap, at pinanatili ang mga katawagang “Ama” at “Anak” bilang natatanging teolohikal na titulo.
