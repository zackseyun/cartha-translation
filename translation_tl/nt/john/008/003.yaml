  yaml_path: translation/nt/john/008/003.yaml
  text: Then[a] the scribes and the Pharisees brought to him a woman caught in adultery, and having set her in the midst,
translation:
  language: tl
  text: Dinala naman sa kanya ng mga tagapagturo ng Kautusan at ng mga Pariseo ang isang babaeng nahuling nangangalunya. Pinatayo nila siya sa gitna[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pagpapatuloy ito ng salaysay tungkol sa babaeng nahuling nangangalunya (Juan 7:53–8:11). Tingnan ang tala sa Juan 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: Ἄγουσιν
  choice: dinala
  rationale: Isinalin ang makasaysayang pangkasalukuyan ng Griyego bilang pangnagdaan upang maging likas ang daloy ng salaysay sa Tagalog.
- source_word: οἱ γραμματεῖς
  choice: mga tagapagturo ng Kautusan
  rationale: Sa kontekstong Judio, tumutukoy ito sa mga dalubhasa at tagapagturo ng Kautusan; mas malinaw ito sa karaniwang mambabasa kaysa sa literal na “mga eskriba.”
- source_word: ἐν μοιχείᾳ κατειλημμένην
  choice: nahuling nangangalunya
  rationale: Ipinahihiwatig ng perfect passive participle na nadakip o natuklasan siya habang gumagawa ng pangangalunya; likas at tuwiran ang “nahuling nangangalunya.”
- source_word: στήσαντες αὐτὴν ἐν μέσῳ
  choice: Pinatayo nila ito sa gitna
  rationale: Ipinakikita ng parirala ang sinadyang pagpapuwesto sa babae sa gitna ng nagkakatipon; pinananatili rin ng “pinatayo” ang anyo ng ἵστημι.
theological_decisions: []
translation_notes:
  register: Makabagong, malinaw, at marangal na Filipino. Ginamit ang “tagapagturo ng Kautusan” bilang madaling maunawaang katawagan sa γραμματεῖς, at “ito” upang maiwasan ang paulit-ulit na “ang babae” habang nananatiling malinaw ang tinutukoy.
