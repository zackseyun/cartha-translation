  source_fidelity: Tapat ang salin sa Griyegong ἐὰν οὖν ὁ υἱὸς ὑμᾶς ἐλευθερώσῃ, ὄντως ἐλεύθεροι ἔσεσθε. Naipapahayag ng “Kaya, kung” ang kondisyong ἐὰν at ang inferensiyang οὖν; ang “palalayain kayo” ay wastong tumutugon sa ἐλευθερώσῃ; at ang “magiging tunay kayong malaya” ay malinaw na naghahatid ng hinaharap na kalagayan at diin ng ὄντως.
  naturalness: Natural at marangal ang daloy sa modernong Filipino Tagalog. Ang ayos na “magiging tunay kayong malaya” ay idiomatiko at malinaw, habang pinananatili ang diin sa pagiging tunay ng kalayaan.
  terminology: Ang “ang Anak” ay angkop na titulo sa kontekstong Johannine at hindi nagdaragdag ng paliwanag sa mismong talata. Ang “malaya” ay tuwirang katumbas ng ἐλεύθεροι. Ang talababa ay wasto ang angkla at kapaki-pakinabang na naglalahad ng mga alternatibong salin para sa ὄντως.
