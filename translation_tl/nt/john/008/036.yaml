id: JHN.8.36
reference: John 8:36
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐὰν οὖν ὁ υἱὸς ὑμᾶς ἐλευθερώσῃ, ὄντως ἐλεύθεροι ἔσεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/036.yaml
  text: So if the Son sets you free[a], you will be truly free.
translation:
  language: tl
  text: Kaya, kung palalayain kayo ng Anak, magiging tunay kayong malaya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “talagang malaya” o “malaya nga.” Idiniriin ng salitang Griyego na ang kalayaang ito ay tunay at ganap.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Kaya, kung
  rationale: Pinananatili ng “kung” ang kondisyon at ng “kaya” ang paghinuha mula sa naunang sinabi, sa natural na daloy ng modernong Tagalog.
- source_word: ὁ υἱὸς
  choice: ang Anak
  rationale: Sa konteksto ng Juan, ito ay titulong tumutukoy kay Jesus; ipinahihiwatig ng malaking titik ang gamit bilang titulo nang walang idinadagdag na paliwanag sa teksto.
- source_word: ὑμᾶς
  choice: kayo
  rationale: Tahasang pinananatili ng “kayo” ang ikalawang panauhang maramihan ng Griyego.
- source_word: ἐλευθερώσῃ
  choice: palalayain
  rationale: Natural na pandiwang Tagalog para sa pagkilos na magbigay ng kalayaan; ang anyong panghinaharap ay angkop sa kondisyong nakatuon sa magiging bunga.
- source_word: ὄντως
  choice: tunay
  rationale: Ipinakikita nito na ang kalayaan ay totoo at tunay na umiiral; natural din itong kaugnay ng panaguring “malaya.”
- source_word: ἐλεύθεροι
  choice: malaya
  rationale: Pinananatili ang anyong pang-uri na naglalarawan sa magiging kalagayan, hindi lamang sa kilos ng pagpapalaya.
- source_word: ἔσεσθε
  choice: magiging ... kayo
  rationale: Malinaw na ipinahahayag ang panghinaharap na kalagayan sa natural na sintaks ng Tagalog.
theological_decisions:
- issue: Pagkakakilanlan ng “Anak”
  choice: Titulong tumutukoy kay Jesus bilang ang Anak
  alternative: Isang anak sa pangkalahatan
  rationale: Sa konteksto ng Juan at sa paghahambing ng anak at alipin sa sambahayan, ang “ang Anak” ay tiyak na tumutukoy kay Jesus; pinananatili ito bilang titulo.
- issue: Saklaw ng kalayaang tinutukoy
  choice: Tunay na kalayaan, nang hindi nililimitahan sa isang kategorya sa mismong salin
  alternative: Espirituwal lamang, panlipunan lamang, o pampolitika lamang na kalayaan
  rationale: Ang malapit na konteksto ay tungkol sa pagkaalipin sa kasalanan, ngunit malawak ang pahayag ng talata. Hindi nililimitahan ng salin ang saklaw nang higit sa sinasabi ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “Kaya, kung” upang panatilihin kapwa ang paghinuha at kondisyon; iniwasan ang mas mabigat o di-likas na “Samakatuwid, kung.”
