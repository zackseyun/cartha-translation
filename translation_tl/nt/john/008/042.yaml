id: JHN.8.42
reference: John 8:42
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀εἶπεν αὐτοῖς ὁ Ἰησοῦς· Εἰ ὁ θεὸς πατὴρ ὑμῶν ἦν ἠγαπᾶτε ἂν ἐμέ, ἐγὼ γὰρ ἐκ τοῦ θεοῦ ἐξῆλθον καὶ ἥκω· οὐδὲ γὰρ ἀπ’ ἐμαυτοῦ ἐλήλυθα, ἀλλ’ ἐκεῖνός με ἀπέστειλεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/042.yaml
  text: Jesus said to them[a], “If God were your Father, you would love me, because I came from God and am here. For I have not come from myself[b], but he sent me.”
translation:
  language: tl
  text: Sinabi ni Jesus sa kanila, “Kung ang Diyos sana ang inyong Ama, iibigin sana ninyo ako, sapagkat nagmula ako sa Diyos at narito ako.[a] Sapagkat hindi ako naparito sa sarili kong pagkukusa,[b] kundi siya ang nagsugo sa akin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas pormal na paraan, “sapagkat lumabas ako mula sa Diyos at naparito.”
    reason: lexical_alternative
  - marker: b
    text: O, “Hindi ako naparito mula sa sarili ko.” Maaaring idiin ng Griyego ang pinagmulan (“mula sa sarili ko”) o ang sariling pagkukusa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ ... ἦν ... ἠγαπᾶτε ἂν
  choice: Kung ang Diyos ang inyong Ama, iibigin ninyo ako
  rationale: Ang εἰ na may mga imperpektong pandiwa at ἄν ay nagsasaad ng kondisyong salungat sa katotohanan. Sa modernong Tagalog, malinaw itong naipahihiwatig ng “Kung ... iibigin ninyo” ayon sa konteksto.
- source_word: θεὸς πατὴρ ὑμῶν
  choice: ang Diyos ang inyong Ama
  rationale: 'Natural na ipinahahayag ng hulma ang ugnayang sinasabi: ang Diyos bilang kanilang Ama. Ginawang malaking titik ang “Ama” bilang katawagang nauukol sa Diyos.'
- source_word: ἠγαπᾶτε
  choice: iibigin ninyo
  rationale: Tuwirang isinasalin ang ἀγαπάω bilang “ibigin”; ang anyong panghinaharap sa sugnay na may kondisyon ay natural na naghahatid ng diwang “would love.”
- source_word: ἐγὼ γὰρ
  choice: sapagkat
  rationale: Ang γάρ ay nagbibigay ng dahilan kung bakit iibigin nila si Jesus kung ang Diyos nga ang kanilang Ama.
- source_word: ἐκ τοῦ θεοῦ ἐξῆλθον
  choice: nagmula ako sa Diyos
  rationale: Pinananatili ng “nagmula” ang diin sa pinagmulan o bukal ng pagparito ni Jesus nang hindi gumagamit ng teknikal na terminolohiyang teolohikal.
- source_word: καὶ ἥκω
  choice: at narito ako
  rationale: Ipinahahayag ng ἥκω ang pagdating na may kasalukuyang resulta o presensya; natural itong sabihin sa Tagalog bilang “narito ako.”
- source_word: οὐδὲ γὰρ ἀπ’ ἐμαυτοῦ ἐλήλυθα
  choice: Hindi ako naparito mula sa sarili ko
  rationale: Pinananatili ng “mula sa sarili ko” ang wika ng pinagmulan at ang pagkakatulad nito sa “nagmula ako sa Diyos,” habang hinahayaan ding marinig ang pahiwatig na hindi ito sariling pagkukusa.
- source_word: ἀλλ’ ἐκεῖνός με ἀπέστειλεν
  choice: kundi siya ang nagsugo sa akin
  rationale: Ang “siya ang” ay natural na paraan upang maipakita ang diin ng ἐκεῖνος, at pinananatili ng “nagsugo” ang wika ng misyong nakapaloob sa ἀποστέλλω.
theological_decisions:
- issue: Ang pananalita tungkol sa pinagmulan ni Jesus nang hindi labis na tinutukoy ang mga kategoryang nabuo kalaunan
  choice: nagmula ako sa Diyos at narito ako
  alternative: lumabas ako mula sa Diyos at naparito
  rationale: Mariing pinagtitibay ng talata ang banal na pinagmulan at pagkasugo ni Jesus, ngunit gumagamit ang pangunahing salin ng likas at di-teknikal na pananalita, gaya ng mga karaniwang pandiwa sa Griyego. Nasa talababa ang mas pormal na anyo.
- issue: Kahulugan ng ἀπ’ ἐμαυτοῦ
  choice: mula sa sarili ko
  alternative: nang kusa sa sarili ko
  rationale: Maaaring idiin ng parirala ang pinagmulan o ang malayang pagkukusa. Pinananatili sa teksto ang pagkakatulad sa “mula sa Diyos,” at inilalagay sa talababa ang mas idyomatikong kahulugan tungkol sa sariling pagkukusa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “ibigin” at “nagsugo” dahil malinaw at angkop ang mga ito sa dignidad ng konteksto; iniwasan ang labis na teknikal o denominasyonal na pananalita.
