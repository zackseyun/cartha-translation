  to: Sinabi ni Jesus sa kanila, “Kung ang Diyos sana ang inyong Ama, iibigin sana ninyo ako, sapagkat nagmula ako sa Diyos at narito ako.[a] Sapagkat hindi ako naparito sa sarili kong pagkukusa,[b] kundi siya ang nagsugo sa akin.”
