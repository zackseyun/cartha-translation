id: JHN.8.57
reference: John 8:57
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἶπον οὖν οἱ Ἰουδαῖοι πρὸς αὐτόν· Πεντήκοντα ἔτη οὔπω ἔχεις καὶ Ἀβραὰμ ἑώρακας;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/057.yaml
  text: So the Jews said to him, “You are not yet fifty years old, and you have seen Abraham?”
translation:
  language: tl
  text: Kaya sinabi sa kanya ng mga Judio[a], “Wala ka pang limampung taong gulang, at nakita mo na si Abraham?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga taga-Judea” o “mga pinunong Judio,” depende sa lawak ng tinutukoy ni Juan sa οἱ Ἰουδαῖοι sa kontekstong ito.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: mga Judio
  rationale: Direktang salin ng malawak na katawagang ginamit sa salaysay ni Juan. Hindi nililimitahan ng talata ang tinutukoy sa mga pinuno lamang; inilalahad sa talababa ang iba pang posibleng saklaw.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinapakita ang bunga o lohikal na kaugnayan ng tugon sa naunang sinabi ni Jesus, sa natural na modernong Tagalog.
- source_word: πεντήκοντα ἔτη οὔπω ἔχεις
  choice: Wala ka pang limampung taong gulang
  rationale: Natural na katumbas sa Tagalog ng Griyegong idyoma na literal na nagsasabing hindi pa siya ‘may limampung taon.’
- source_word: ἑώρακας
  choice: nakita mo na
  rationale: Ang pangnagdaang ganap na anyo ay ipinahahayag nang natural sa Tagalog sa pamamagitan ng ‘nakita ... na,’ na nagpapanatili sa diwa ng isang naganap na pagkakita na may kaugnayan sa kasalukuyang pahayag.
- source_word: καὶ
  choice: at
  rationale: Pinananatili ang payak na pang-ugnay at ang mapagdudang diin ng tanong.
- source_word: Ἀβραὰμ
  choice: Abraham
  rationale: Karaniwang anyo ng pangalang biblikal sa Tagalog.
theological_decisions:
- issue: Saklaw ng οἱ Ἰουδαῖοι sa Juan
  choice: mga Judio
  alternative: mga taga-Judea; mga pinunong Judio
  rationale: Malawak ang katawagang Griyego at hindi tahasang nililimitahan ng kontekstong ito sa mga pinuno. Pinananatili ng pangunahing teksto ang pangkalahatang katawagan habang inilalahad sa talababa ang mga posibleng kontekstuwal na pakahulugan.
- issue: Diwa ng ἑώρακας
  choice: nakita mo na
  alternative: nakita mo
  rationale: Pinananatili ng ‘na’ ang ganap o resultang diwa ng Griyegong perfect nang hindi ipinapaliwanag kung paano o kailan diumano nakita ni Jesus si Abraham.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang ‘mga Judio’ bilang tuwirang salin at inilagay kaagad ang panandang [a] pagkatapos nito. Ang ayos na ‘at nakita mo na si Abraham?’ ay sadyang nagpapanatili sa retorikal at mapagdudang anyo ng Griyego.
