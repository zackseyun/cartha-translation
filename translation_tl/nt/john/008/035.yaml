id: JHN.8.35
reference: John 8:35
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ δοῦλος οὐ μένει ἐν τῇ οἰκίᾳ εἰς τὸν αἰῶνα· ⸀ὁ υἱὸς μένει εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/035.yaml
  text: The servant does not remain in the household forever[b][a]; the son remains forever.
translation:
  language: tl
  text: Ang alipin ay hindi nananatili sa sambahayan magpakailanman; ang anak[a] ay nananatili magpakailanman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “anak” ay maaaring may pahiwatig din kay Jesus sa konteksto, bagaman ang pangungusap ay may anyo rin ng isang pangkalahatang kasabihan.
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλος
  choice: alipin
  rationale: Pinananatili ng “alipin” ang malinaw na kaibahan ng katayuan nito sa anak sa loob ng sambahayan; hindi sapat ang “lingkod” upang ipahiwatig ang pagkakagapos at kawalan ng permanenteng katayuan.
- source_word: μένει
  choice: nananatili
  rationale: Ginamit sa dalawang sugnay upang mapanatili ang pag-uulit sa Griyego at malinaw na maipahayag ang patuloy na pananatili o katayuan.
- source_word: οἰκίᾳ
  choice: sambahayan
  rationale: Ang konteksto ay tumutukoy hindi lamang sa gusali kundi sa pamilya o sambahayang kinabibilangan at sa katayuan sa loob nito.
- source_word: εἰς τὸν αἰῶνα
  choice: magpakailanman
  rationale: Natural at marangal na katumbas sa Tagalog para sa walang hanggang pananatili; inulit sa parehong sugnay ayon sa anyo ng pinagmulan.
- source_word: υἱός
  choice: anak
  rationale: Ang “anak” ang natural na salin ng υἱός sa kasabihang tungkol sa katayuan sa sambahayan at hindi nito sapilitang nilulutas kung may pahiwatig din kay Jesus.
- source_word: δὲ
  choice: ay
  rationale: Hindi isinalin bilang hiwalay na panandang gaya ng “ngayon”; ang banayad na paghahambing ay likas nang naihahatid ng magkatapat na mga sugnay.
theological_decisions:
- issue: Maaaring tumukoy kay Jesus ang “ang anak” sa konteksto
  choice: Pinanatiling karaniwang “ang anak,” nang walang malaking titik.
  alternative: “ang Anak” bilang tahasang titulong kristolohikal
  rationale: Ang pahayag ay may anyong kasabihan tungkol sa katayuan sa sambahayan ngunit naghahanda rin sa aplikasyon ni Jesus sa kasunod na talata. Pinananatili ng karaniwang anyo ang dalawang posibilidad nang hindi inuunahan ang konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “sambahayan” upang idiin ang pag-aari at katayuan sa pamilya, at pinanatili ang balanseng pag-uulit ng “nananatili” at “magpakailanman.”
