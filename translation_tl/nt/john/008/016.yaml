id: JHN.8.16
reference: John 8:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐὰν κρίνω δὲ ἐγώ, ἡ κρίσις ἡ ἐμὴ ⸀ἀληθινή ἐστιν, ὅτι μόνος οὐκ εἰμί, ἀλλ’ ἐγὼ καὶ ὁ πέμψας με πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/016.yaml
  text: But even if I do judge[a], my judgment is true, because I am not alone, but I and the Father who sent me.
translation:
  language: tl
  text: Ngunit kahit humatol ako[a], totoo ang paghatol ko, sapagkat hindi ako nag-iisa; kasama ko ang Ama na nagsugo sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kung humatol ako” o “kung ako man ay humatol.” Kondisyon ang anyong Griyego, ngunit sa kontekstong ito ay malamang na may diwang “kahit humatol ako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν κρίνω
  choice: kahit humatol ako
  rationale: Ang ἐὰν na may present subjunctive na κρίνω ay nagsasaad ng kondisyong maaaring mangyari. Sa konteksto, likas sa Tagalog ang “kahit humatol ako” upang maipahayag ang malamang na concessive na diwa nang hindi ginagawang tiyak ang kondisyon.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita ng δέ ang pagsalungat o pagliko mula sa naunang pahayag; malinaw at marangal na katumbas ang “Ngunit.”
- source_word: ἡ κρίσις ἡ ἐμὴ
  choice: ang paghatol ko
  rationale: Pinananatili ng “paghatol” ang legal at mapanuring diwa ng κρίσις, samantalang natural na naihahayag ng “ko” ang possessive construction.
- source_word: ἀληθινή
  choice: totoo
  rationale: Saklaw ng “totoo” ang pagiging ayon sa katotohanan at pinananatili nito ang mahalagang temang Johannine; hindi nito nililimitahan ang salita sa legal na “may bisa.”
- source_word: μόνος οὐκ εἰμί
  choice: hindi ako nag-iisa
  rationale: Ito ang natural na modernong Tagalog na nagpapahayag na ang paghatol ni Jesus ay hindi hiwalay o nagmumula sa kanya lamang.
- source_word: ἀλλ’ ἐγὼ καὶ ὁ πέμψας με πατήρ
  choice: kasama ko ang Ama na nagsugo sa akin
  rationale: Ang literal na “ako at ang Ama” ay matigas at maaaring maging pangungusap na walang panaguri sa Tagalog. Ipinahahayag ng “kasama ko” ang implikasyon ng οὐκ εἰμί μόνος ... ἐγὼ καὶ ὁ ... πατήρ, habang pinananatili ng sugnay na “na nagsugo sa akin” ang pagkakakilanlan ng Ama bilang nagsugo.
theological_decisions:
- issue: Ugnayan ng paghatol ni Jesus at ng Ama
  choice: Inilalahad na totoo ang paghatol ni Jesus sapagkat hindi siya nag-iisa; kasama niya ang Ama na nagsugo sa kanya.
  alternative: Maaaring unawain ang pahayag nang mas makitid bilang argumento lamang tungkol sa legal na patotoo.
  rationale: Tuwirang inuugnay ng teksto ang pagiging totoo ng paghatol ni Jesus sa hindi niya pagiging nag-iisa at sa Ama na nagsugo sa kanya. Hindi pinalalawak ng salin ang pahayag tungo sa isang sistematikong doktrina.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “humatol/paghatol” upang mapanatili ang forensic na ugnayan ng pandiwa at pangngalan. Iniwasan ang sobrang literal na ayos na hindi likas sa Tagalog.
