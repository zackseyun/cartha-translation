id: JHN.8.25
reference: John 8:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἔλεγον οὖν αὐτῷ· Σὺ τίς εἶ; ⸀εἶπεν αὐτοῖς ὁ Ἰησοῦς· Τὴν ἀρχὴν ⸂ὅ τι⸃ καὶ λαλῶ ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/025.yaml
  text: So they were saying to him, “Who are you?” Jesus said to them, “Just what I have been telling you from the beginning.”
translation:
  language: tl
  text: Kaya tinanong nila siya, “Sino ka?” Sumagot si Jesus, “Iyon nga ang sinasabi ko sa inyo mula pa sa simula.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Napakahirap unawain ng Griyego sa bahaging ito. Maaari ring isalin: “Bakit pa ba ako nakikipag-usap sa inyo?” Ang bantas ay maaari ring magpahiwatig na tanong ang sagot ni Jesus.'
    reason: May tunay na leksikal at sintaktikong ambiguwidad sa Τὴν ἀρχὴν ὅ τι καὶ λαλῶ ὑμῖν, at editoryal ang sinaunang bantas; mahalagang huwag ikubli ang mga pangunahing posibleng pagbasa.
lexical_decisions:
- source_word: ἔλεγον
  choice: tinanong
  rationale: Bagaman literal na ‘sinasabi,’ ang kasunod na tuwirang tanong ang nilalaman ng kanilang paulit-ulit o patuloy na pagsasalita; natural sa Filipino ang ‘tinanong.’
- source_word: Σὺ τίς εἶ;
  choice: Sino ka?
  rationale: Tuwiran at natural na katumbas ng mariing tanong tungkol sa pagkakakilanlan; hindi kailangang piliting isalin nang hiwalay ang emphatic na Σὺ.
- source_word: Τὴν ἀρχὴν
  choice: mula pa sa simula
  rationale: Kinakatawan ang temporal na pagbasa na pinagtibay ng konteksto at ng consultation layer, habang kinikilala sa talababa ang ibang posibleng gamit ng parirala.
- source_word: ὅ τι καὶ λαλῶ ὑμῖν
  choice: Iyon nga ang sinasabi ko sa inyo
  rationale: Ang ‘iyon nga’ ay natural na Filipino para sa emphatic na diwa ng καί at sa sagot na tumutukoy sa dati nang sinasabi ni Jesus, nang hindi dinaragdagan ang tiyak na nilalaman nito.
theological_decisions:
- issue: Kung tahasang tutukuyin sa sagot kung sino si Jesus
  choice: Hindi dinagdagan ng ‘kung sino ako’ ang sinabi ni Jesus
  alternative: ‘Sinabi ko na sa inyo mula pa sa simula kung sino ako’
  rationale: Hindi tahasang nasa Griyego ang ‘kung sino ako’; ang pagdaragdag nito ay magpapaliwanag sa isang paraang nagpapawala sa sadyang maigsi at mahirap na anyo ng sagot.
- issue: Napakahirap at hindi tiyak na sintaks ng sagot ni Jesus
  choice: 'Ginamit sa pangunahing teksto ang temporal na pagbasa: ‘Iyon nga ang sinasabi ko sa inyo mula pa sa simula’'
  alternative: ‘Bakit pa ba ako nakikipag-usap sa inyo?’ o pagbasa sa linya bilang isang tanong
  rationale: Pinananatili ng pangunahing salin ang malamang na ugnayan sa nauna nang pahayag ni Jesus at umaayon sa audited consultation layer, ngunit hindi itinatago ang tunay na ambiguwidad ng Griyego; kaya inilagay ang mahalagang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang payak na ‘Sino ka?’ at natural na ‘Iyon nga’ sa halip na sobrang literal ngunit alanganing ayos. Ang ‘mula pa sa simula’ ay karaniwang pananalita at angkop sa patuloy na pagsasalita ni Jesus.
