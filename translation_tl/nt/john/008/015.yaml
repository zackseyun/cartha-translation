  yaml_path: translation/nt/john/008/015.yaml
  text: You judge according to the flesh[a]; I judge no one.
translation:
  language: tl
  text: Kayo'y humahatol ayon sa laman[a]; ako'y hindi humahatol kaninuman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ayon sa pamantayan ng tao” o “ayon sa panlabas na anyo.”
    reason: Mga posibleng kahulugan ng idyomang κατὰ τὴν σάρκα.
lexical_decisions:
- source_word: ὑμεῖς
  choice: kayo
  rationale: Ang tahasang panghalip na maramihan ay pinanatili upang maipakita ang paghahambing sa tahasang ἐγώ (“ako”).
- source_word: κατὰ τὴν σάρκα
  choice: ayon sa laman
  rationale: Pinananatili nito ang matalinghagang pananalita at tunay na lawak ng kahulugan ng parirala, sa halip na limitahan ito sa pamantayan ng tao o sa panlabas na anyo lamang.
- source_word: κρίνετε
  choice: humahatol
  rationale: Likas at tuwirang salin ito ng pangkasalukuyang pandiwa sa konteksto ng paghatol.
- source_word: ἐγὼ
  choice: ako
  rationale: Pinananatili ang tahasang panghalip upang idiin ang pagsalungat sa “kayo.”
- source_word: οὐ κρίνω οὐδένα
  choice: hindi humahatol kaninuman
  rationale: Natural na Filipino ito na tapat sa ganap na pagtanggi ng Griyego nang hindi nagdaragdag ng paliwanag.
theological_decisions:
- issue: Kahulugan ng σάρξ sa pariralang κατὰ τὴν σάρκα
  choice: ayon sa laman
  alternative: ayon sa pamantayan ng tao; ayon sa panlabas na anyo
  rationale: Ang “laman” ay nagpapanatili sa wikang Juan at sa teolohikal na tensiyon ng parirala. Maaaring tumukoy ito sa makatao, makamundo, o panlabas na batayan ng paghatol, kaya inilagay sa talababa ang mas mapagpaliwanag na mga salin.
- issue: Ganap na pahayag na “hindi humahatol kaninuman”
  choice: Pinanatili bilang tuwirang pahayag
  alternative: Ipaliwanag o limitahan ang uri o panahon ng paghatol
  rationale: Walang tahasang limitasyon sa mismong talata. Ang anumang paglilinaw mula sa mas malawak na konteksto ay hindi dapat ipasok sa salin ng pangungusap na ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “humahatol” bilang karaniwang pandiwang nauunawaan ng mga mambabasa, at pinanatili ang “laman” upang hindi labis na ipaliwanag ang sadyang malawak na parirala.
