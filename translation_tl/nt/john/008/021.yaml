source:
  edition: SBLGNT
  text: Εἶπεν οὖν πάλιν ⸀αὐτοῖς· Ἐγὼ ὑπάγω καὶ ζητήσετέ με, καὶ ἐν τῇ ἁμαρτίᾳ ὑμῶν ἀποθανεῖσθε· ὅπου ἐγὼ ὑπάγω ὑμεῖς οὐ δύνασθε ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/021.yaml
  text: So he said to them again[a], “I am going away, and you will seek me, and you will die in your sin. Where I am going[c][b], you are not able to come.”
translation:
  language: tl
  text: Kaya muli niyang sinabi sa kanila, “Aalis ako, at hahanapin ninyo ako[a], at mamamatay kayo sa inyong kasalanan[b]. Kung saan ako pupunta, hindi kayo makapupunta[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pandiwa ay maaaring tumukoy sa paghahanap sa isang tao at, sa Juan, maaari ring magtaglay ng mas malalim na diwang espirituwal.
    reason: lexical_alternative
  - marker: b
    text: 'Sa Griyego, isahan: “sa inyong kasalanan.” Isinasalin ng ilan na “sa inyong mga kasalanan,” ngunit maaaring idiin ng isahan ang isang nagpapatuloy na kalagayan sa halip na mga magkakahiwalay na gawa.'
    reason: lexical_alternative
  - marker: c
    text: O “hindi ninyo kayang pumunta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Ipinakikita ang pagpapatuloy o bunga ng naunang pag-uusap nang natural sa makabagong Tagalog.
- source_word: πάλιν
  choice: muli
  rationale: Tuwirang ipinahahayag ang pag-uulit ng pagsasalita ni Jesus.
- source_word: Ἐγὼ ὑπάγω
  choice: Aalis ako
  rationale: Natural at marangal na Tagalog para sa pag-alis; pinananatili ang diin ng tahasang panghalip sa pamamagitan ng pangungusap na nakasentro sa “ako,” nang hindi dinaragdagan ang kahulugan.
- source_word: ζητήσετέ με
  choice: hahanapin ninyo ako
  rationale: Maaaring tumukoy sa literal na paghahanap at magtaglay rin ng mas malalim na diwang espirituwal sa Juan.
- source_word: ἐν τῇ ἁμαρτίᾳ ὑμῶν
  choice: sa inyong kasalanan
  rationale: Pinananatili ang isahan ng Griyegong ἁμαρτίᾳ at ang diwa ng ἐν, na maaaring tumukoy sa nananatiling kalagayan ng kasalanan.
- source_word: ἀποθανεῖσθε
  choice: mamamatay kayo
  rationale: Likas na katumbas sa Tagalog ng payak na pahayag sa hinaharap.
- source_word: ὅπου ἐγὼ ὑπάγω
  choice: sa pupuntahan ko
  rationale: Idyomatikong Tagalog na pinananatili ang patutunguhang hindi tahasang tinutukoy sa teksto.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: Hindi kayo makapupunta
  rationale: Inihahayag ang kawalan ng kakayahang makarating sa lugar na pupuntahan ni Jesus, hindi lamang isang pagbabawal.
theological_decisions:
- issue: Isahan na ἁμαρτίᾳ laban sa mas karaniwang maramihang “mga kasalanan”
  choice: sa inyong kasalanan
  alternative: sa inyong mga kasalanan
  rationale: Isahan ang Griyego at maaaring idiin nito ang nagpapatuloy na kalagayan ng kasalanan o kawalan ng pananampalataya, hindi lamang ang magkakahiwalay na masasamang gawa. Pinananatili ng salin ang tensiyong ito nang hindi ito ipinapaliwanag sa pangunahing teksto.
- issue: Diwa ng pag-alis ni Jesus sa ὑπάγω
  choice: Aalis ako
  alternative: Pupunta ako
  rationale: Maaaring tumukoy ang salita sa agarang pag-alis ni Jesus at, sa mas malawak na konteksto ng Juan, sa kanyang pagpanaw at pagbabalik sa Ama. Hindi tahasang tinutukoy ng salin ang destinasyon upang maiwasan ang labis na pagpapakahulugan.
- issue: Kawalan ng kakayahan sa οὐ δύνασθε ἐλθεῖν
  choice: Hindi kayo makapupunta
  alternative: Hindi kayo maaaring pumunta
  rationale: Mas malinaw na ipinahahayag ng “makapupunta” ang kakayahan o posibilidad, samantalang ang “maaaring” ay puwedeng mapagkamalang simpleng kawalan ng pahintulot.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino Tagalog. Ginamit ang “ninyo/kayo” para sa maramihang kausap. Iniwasan ang sobrang teknikal o denominasyonal na pananalita, at pinanatili ang isahan na “kasalanan” at ang hindi tahasang pinangalanang patutunguhan ni Jesus.
