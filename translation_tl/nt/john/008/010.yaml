base_translation:
  language: en
  yaml_path: translation/nt/john/008/010.yaml
  text: Then Jesus[a] straightened up, and seeing no one except the woman, said to her, "Woman, where are those accusers of yours? Has no one condemned you?"
translation:
  language: tl
  text: Tumuwid si Jesus[a] at, nang wala siyang makitang iba maliban sa babae, sinabi niya rito, “Babae, nasaan ang mga nagsakdal sa iyo? Wala bang humatol laban sa iyo?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang talatang ito ay bahagi ng salaysay tungkol sa babaeng nahuling nangangalunya (Juan 7:53–8:11), na wala sa pinakamaagang mga manuskritong Griego. Tingnan ang tala sa Juan 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: ἀνακύψας
  choice: tumuwid
  rationale: Ipinahihiwatig na itinaas ni Jesus ang kaniyang katawan mula sa pagkakayuko habang sumusulat sa lupa; natural at tuwiran ang “tumuwid” sa konteksto.
- source_word: θεασάμενος
  choice: nang wala siyang makitang
  rationale: Ipinapahayag ng participle ang tuwirang pagkakita o pagmamasid; isinama sa likas na sugnay sa Tagalog.
- source_word: κατήγοροί
  choice: mga nagsakdal
  rationale: Tumutukoy sa mga nagharap ng paratang laban sa babae; pinananatili ng “nagsakdal” ang legal na himig ng tagpo.
- source_word: κατέκρινεν
  choice: humatol
  rationale: Sa legal na konteksto, tumutukoy ito sa paghatol laban sa isang tao. Ang “humatol sa iyo” ay natural at hindi nagdaragdag kung naipatupad na ang sentensiya.
theological_decisions:
- issue: Antas ng legal na kahulugan ng κατακρίνω
  choice: humatol sa iyo
  alternative: hinatulan kang nagkasala / pinarusahan ka
  rationale: Pinananatili ang legal na diin nang hindi tahasang nilulutas kung ang tinutukoy ay deklarasyon ng pagkakasala, pagsentensiya, o pagpapatupad ng parusa.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Ginamit ang “Babae” bilang tuwirang salin ng magalang na προσφώνηση na Ἡ γυνή; bagaman maaaring matigas pakinggan sa ilang modernong konteksto, hindi ito mapanlait sa gamit ng Griyego rito. Inilagay ang marker na [a] kaagad pagkatapos ng “Jesus.”
