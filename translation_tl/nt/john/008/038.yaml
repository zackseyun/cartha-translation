  text: ⸂ἃ ἐγὼ⸃ ἑώρακα παρὰ τῷ ⸀πατρὶ λαλῶ· καὶ ὑμεῖς οὖν ⸂ἃ ἠκούσατε⸃ παρὰ ⸂τοῦ πατρὸς⸃ ποιεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/038.yaml
  text: I speak what I have seen with the Father[a], and you, then, do what you have heard from your father.
translation:
  language: tl
  text: Sinasabi ko ang nakita ko sa piling ng Ama; at kayo naman ay ginagawa ang narinig ninyo mula sa inyong ama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Sinasabi ko ang nakita ko sa piling ng Ama; at kayo naman ay gawin ninyo ang narinig ninyo mula sa ama.” Ang “ginagawa ninyo” ay maaari ring unawain bilang pautos na “gawin ninyo,” sapagkat magkapareho ang anyo ng pandiwa sa Griyego. Sa Griyego, walang tahasang katumbas ng “inyong” sa ikalawang “ama”; nililinaw ng kasunod na usapan kung sino ang tinutukoy (tingnan ang tal. 44).'
    reason: Pinananatili ang ambiguwidad ng mood ng ποιεῖτε at ang hindi tahasang possessive at referent ng ikalawang πατρός, habang nililinaw na kontekstuwal ang “inyong.”
lexical_decisions:
- source_word: ἃ
  choice: ang … ay ang
  rationale: Ang neuter plural relative pronoun ay tumutukoy sa nilalaman ng sinasabi at narinig. Ginawang likas na sugnay sa Tagalog nang hindi nawawala ang diwang ‘ang mga bagay na.’
- source_word: ἑώρακα
  choice: nakita ko
  rationale: Ang perfect ay tumutukoy sa nakita noon na nananatiling mahalaga sa kasalukuyan. Walang tuwirang katumbas na anyong perfect sa Tagalog, kaya ang aspektong naganap na ‘nakita ko’ ang natural na salin.
- source_word: παρὰ τῷ πατρὶ
  choice: sa piling ng Ama
  rationale: Ang παρά na may dative ay nagpapahiwatig ng pagiging kasama o nasa presensiya ng isang tao, hindi lamang ng pinagmulan. Likas at marangal sa Tagalog ang ‘sa piling ng Ama.’
- source_word: λαλῶ
  choice: sinasabi ko
  rationale: Ang present tense ay maayos na naihahayag ng imperpektibong ‘sinasabi ko’; ang pandiwa ay tumutukoy sa pagsasalita ng nilalamang nakita.
- source_word: οὖν
  choice: kaya
  rationale: Ipinahahayag nito ang inferensiyal o nag-uugnay na daloy ng pangungusap. Ang ‘kaya’ ay natural, bagaman maaaring resumptibo rin ang puwersa nito.
- source_word: ἃ ἠκούσατε
  choice: ang narinig ninyo
  rationale: Ang aorist ay likas na isinasalin sa naganap na aspektong ‘narinig,’ habang pinananatili ang parallel sa nakita ni Jesus.
- source_word: παρὰ τοῦ πατρὸς
  choice: mula sa inyong ama
  rationale: Ang παρά na may genitive ay nagsasaad ng pinagmulan. Walang tahasang panghalip na ‘inyong’ sa Griyego, ngunit ipinahihiwatig ito ng paghahambing at kailangan para sa likas na Tagalog; nililinaw sa talababa ang mas pormal na anyo.
- source_word: ποιεῖτε
  choice: ginagawa ninyo
  rationale: Ang present tense ay maaaring indikativo o pautos sa anyo. Ang ‘ginagawa ninyo’ ay nagpapanatili sa posibleng pagbasa bilang paglalarawan ng kasalukuyan o nakagawiang kilos.
- source_word: πατήρ / πατρὸς
  choice: Ama / ama
  rationale: Ang unang ‘Ama’ ay tumutukoy sa Diyos kaugnay ni Jesus; ang ikalawa ay pinanatiling hindi tahasang kinikilala upang mapanatili ang retorikal na pag-unlad hanggang talata 44.
theological_decisions:
- issue: Pagkakakilanlan ng ikalawang ‘ama’
  choice: inyong ama
  alternative: ang ama; ang diyablo
  rationale: Hindi tahasang sinasabi ng talata 38 na ang ikalawang ama ay ang diyablo; ginagawa iyon sa talata 44. Pinananatili ng salin ang tensiyon at pag-unlad ng usapan nang hindi inuunahan ang paglilinaw.
- issue: Mood ng ποιεῖτε
  choice: ginagawa ninyo
  alternative: gawin ninyo
  rationale: Magkapareho ang anyo ng present active indicative at imperative sa ikalawang panauhang maramihan. Sa daloy ng pagtatalo at sa paghahambing sa ginagawa ni Jesus, malakas ang pagbasa bilang indikativo, ngunit tunay ang ambiguwidad at itinatala sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang ‘sa piling ng Ama’ upang maipahayag ang presensiya o malapit na pakikisama na ipinahihiwatig ng παρά na may dative. Iniwasang tukuyin agad ang ikalawang ama bilang diyablo, at itinala ang tunay na gramatikal na ambiguwidad ng ποιεῖτε.
