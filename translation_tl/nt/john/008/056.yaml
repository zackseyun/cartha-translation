  text: Ἀβραὰμ ὁ πατὴρ ὑμῶν ἠγαλλιάσατο ἵνα ἴδῃ τὴν ἡμέραν τὴν ἐμήν, καὶ εἶδεν καὶ ἐχάρη.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/056.yaml
  text: Abraham your father rejoiced to see my day[b][a]; he saw it and was glad.
translation:
  language: tl
  text: Nagalak ang inyong amang si Abraham na makita ang aking araw[b][a]; nakita niya iyon at natuwa siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “nagalak upang makita ang aking araw” o “nagalak dahil makikita niya ang aking araw.” Maaaring unawain sa ilang magkakalapit na paraan ang sugnay na Griyego.'
    reason: lexical_alternative
  - marker: b
    text: Ang “aking araw” ay maaaring tumukoy nang malawakan sa mesiyanikong araw o katuparan ni Jesus; hindi tinutukoy ng talata ang eksaktong pangyayari o panahon.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀβραὰμ ὁ πατὴρ ὑμῶν
  choice: ang inyong amang si Abraham
  rationale: Likas na ayos sa makabagong Filipino para sa ‘Abraham, your father,’ habang pinananatili ang ugnayang ipinahahayag ng πατήρ at ang pangmaramihang ὑμῶν.
- source_word: ἠγαλλιάσατο
  choice: nagalak
  rationale: Ipinahahayag ang matinding kagalakan ng ἀγαλλιάω sa dignificado at karaniwang Filipino.
- source_word: ἵνα ἴδῃ
  choice: na makita
  rationale: Natural na pandagdag sa ‘nagalak’ at hindi labis na nagpapasya kung ang ἵνα-clause ay layunin, nilalaman, o masidhing pag-asam.
- source_word: τὴν ἡμέραν τὴν ἐμήν
  choice: ang aking araw
  rationale: Pinananatili ang literal at teolohikong hitik na pariralang ‘my day’ nang hindi tinutukoy ang eksaktong pangyayari o panahon.
- source_word: καὶ εἶδεν
  choice: nakita niya iyon
  rationale: Ginagawang hayag sa Filipino ang ipinahihiwatig na layon na tumutukoy sa ‘aking araw,’ nang walang idinaragdag na bagong diwa.
- source_word: καὶ ἐχάρη
  choice: at natuwa siya
  rationale: Pinananatili ang pagkakaiba ng χαίρω mula sa naunang ἀγαλλιάω sa pamamagitan ng natural na ‘natuwa’ sa halip na ulitin ang ‘nagalak.’
theological_decisions:
- issue: Kahulugan ng ‘aking araw’
  choice: Panatilihin ang ‘aking araw’ nang hindi tinutukoy ang eksaktong pangyayari o panahon.
  alternative: Ang pagkakatawang-tao o ministeryo ni Jesus; ang katuparang mesiyaniko; ang kamatayan at muling pagkabuhay; o ang araw ng pangwakas na paghahayag.
  rationale: Hindi nililinaw ng mismong talata kung alin sa mga ito ang tinutukoy, kaya pinananatili ng salin ang tunay na teolohikong lawak at tensiyon.
- issue: Lakas ng ἵνα sa ἠγαλλιάσατο ἵνα ἴδῃ
  choice: Isalin bilang ‘nagalak ... na makita.’
  alternative: ‘nagalak upang makita’ o ‘nagalak dahil makikita niya.’
  rationale: Maaaring magpahiwatig ang ἵνα-clause ng layunin o ng nilalaman ng masidhing pag-asam. Ang ‘na makita’ ay natural at pinananatili ang magkakalapit na posibilidad nang hindi nagdaragdag ng tahasang ‘makikita niya.’
translation_notes:
  register: Makabago, malinaw, at dignifikadong Filipino. Ginamit ang ‘inyong’ dahil pangmaramihan ang ὑμῶν, at pinanatili ang ‘aking araw’ upang maiwasan ang sobrang pagpapakahulugan.
