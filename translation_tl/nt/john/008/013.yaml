id: JHN.8.13
reference: John 8:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἶπον οὖν αὐτῷ οἱ Φαρισαῖοι· Σὺ περὶ σεαυτοῦ μαρτυρεῖς· ἡ μαρτυρία σου οὐκ ἔστιν ἀληθής.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/013.yaml
  text: So the Pharisees said to him, “You are testifying about yourself; your testimony is not true.”
translation:
  language: tl
  text: Kaya sinabi sa kanya ng mga Pariseo, “Ikaw ay nagpapatotoo tungkol sa iyong sarili; hindi totoo ang iyong patotoo.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “walang bisa ang iyong patotoo.” Literal na sinasabi ng Griyego na “hindi totoo,” ngunit sa kontekstong ito maaari rin itong tumukoy sa legal na bisa ng patotoo.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Ipinakikita ang lohikal na pagpapatuloy mula sa naunang sinabi ni Jesus, sa natural na modernong Tagalog.
- source_word: εἶπον ... αὐτῷ οἱ Φαρισαῖοι
  choice: sinabi sa kanya ng mga Pariseo
  rationale: Pinananatili ang panghalip na αὐτῷ at natural na isinasalin ang aorist na εἶπον bilang salaysay.
- source_word: Σὺ
  choice: Ikaw
  rationale: Pinananatili ang tahasang panghalip at ang diin nito sa simula ng tuwirang pananalita.
- source_word: περὶ σεαυτοῦ
  choice: tungkol sa iyong sarili
  rationale: Tuwiran at likas na pagpapahayag na ang sarili ni Jesus ang paksa ng patotoo.
- source_word: μαρτυρεῖς
  choice: ay nagpapatotoo
  rationale: Ang aspektong imperpektibo ng kasalukuyang pandiwa ay natural na naipahahayag sa Tagalog sa anyong nagpapatotoo, habang napapanatili ang kontekstong pangpatotoo.
- source_word: ἡ μαρτυρία σου
  choice: ang iyong patotoo
  rationale: Pinananatili ang ugnayang leksikal sa nagpapatotoo at ang himig na may kinalaman sa pagbibigay ng katibayan.
- source_word: οὐκ ἔστιν ἀληθής
  choice: hindi totoo
  rationale: Pinakamalapit na tuwirang katumbas ng ἀληθής at hindi nililimitahan ang kahulugan sa teknikal na legal na bisa lamang.
theological_decisions:
- issue: Kahulugan ng pagtutol ng mga Pariseo sa pagpapatotoo tungkol sa sarili
  choice: hindi totoo ang iyong patotoo
  alternative: walang bisa ang iyong patotoo
  rationale: May legal na himig ang konteksto, ngunit mas malawak ang ἀληθής kaysa sa teknikal na pagiging tanggap o may bisa. Pinananatili ng “hindi totoo” ang tensiyon sa pagitan ng katotohanan at legal na bisa.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “Pariseo,” “nagpapatotoo,” at “patotoo” bilang malinaw at karaniwang bokabularyong biblikal; iniwasan ang mas teknikal na “hindi katanggap-tanggap bilang ebidensiya” upang hindi paliitin ang ambiguwidad ng Griyego.
