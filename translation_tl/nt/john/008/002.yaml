  text: At dawn he came again to the temple, and all the people were coming to him; and he sat down and began to teach them.
translation:
  language: tl
  text: Nang magbukang-liwayway, muli siyang pumunta sa templo. Ang lahat ng tao ay patuloy na lumalapit sa kanya, at umupo siya at nagturo sa kanila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang talatang ito ay pagpapatuloy ng salaysay tungkol sa babaeng nahuling nangangalunya (Juan 7:53–8:11), na wala sa pinakamaagang mga manuskritong Griego. Tingnan ang tala sa Juan 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: Ὄρθρου
  choice: Pagsikat ng araw
  rationale: Tumutukoy ang genitibong panahunan sa madaling-araw, bago o sa pagsikat ng araw; malinaw at likas ito sa modernong Tagalog.
- source_word: πάλιν παρεγένετο
  choice: muli siyang pumunta
  rationale: Ipinahihiwatig ng pandiwa ang pagdating sa isang lugar; dahil tahasang binanggit ang patutunguhan, likas sa Tagalog ang “pumunta,” habang pinananatili ng “muli” ang πάλιν.
- source_word: ἱερόν
  choice: templo
  rationale: Tumutukoy ito sa buong bakuran o kompleks ng templo, hindi lamang sa santuwaryo; “templo” ang karaniwang salin at nauunawaan sa konteksto bilang lugar ng pampublikong pagtuturo.
- source_word: πᾶς ὁ λαὸς ἤρχετο πρὸς αὐτόν
  choice: Lumapit sa kanya ang buong bayan
  rationale: Ang imperpektong ἤρχετο ay maaaring maglarawan sa paglapit ng mga tao; natural sa Tagalog ang payak na anyo, at ang “buong bayan” ay nagpapanatili sa kolektibong diwa ng λαός.
- source_word: καθίσας
  choice: umupo siya
  rationale: Ipinakikita ng aorist participle na nauna ang pag-upo sa pagtuturo; malinaw itong naihahayag bilang magkakasunod na kilos.
- source_word: ἐδίδασκεν
  choice: tinuruan sila
  rationale: Ang imperpekto ay maaaring tuloy-tuloy o pasimula; iniiwasang ipilit ang inceptive na “nagsimulang magturo” at pinananatiling natural ang salaysay sa Tagalog.
theological_decisions:
- issue: Katayuang tekstuwal ng Juan 7:53–8:11
  choice: Isinama ang talata sa pangunahing teksto at nilagyan ng talababa tungkol sa ebidensiyang manuskrito.
  alternative: Alisin sa pangunahing teksto o ilagay sa panaklong.
  rationale: Naroon ang talata sa itinakdang Robinson–Pierpont Byzantine source, ngunit mahalagang ipaalam sa mambabasa na wala ang salaysay sa pinakamaagang mga manuskritong Griego nang hindi hinahatulan sa salin ang usapin.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “buong bayan” para sa kolektibong λαός at “templo” bilang karaniwang tawag sa kompleks ng templo. Inilagay ang marker [a] sa dulo upang hindi mapagkamalang ang talababa ay ukol lamang sa pariralang “Pagsikat ng araw.”
