  text: ἀπεκρίθη Ἰησοῦς· Ἐγὼ δαιμόνιον οὐκ ἔχω, ἀλλὰ τιμῶ τὸν πατέρα μου, καὶ ὑμεῖς ἀτιμάζετέ με.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/049.yaml
  text: Jesus answered[a], “I do not have a demon, but I honor my Father, and you dishonor me.”
translation:
  language: tl
  text: Sumagot si Jesus, “Wala akong demonyo[a], ngunit pinararangalan ko ang aking Ama, at hinahamak ninyo ako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas interpretatibong salin, “Hindi ako sinasapian ng demonyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: Sumagot
  rationale: Likas at karaniwang salaysay na pandiwa para sa tugon sa isang naunang sinabi.
- source_word: δαιμόνιον οὐκ ἔχω
  choice: Wala akong demonyo
  rationale: Pinananatili ang tuwirang idyoma ng Griyego na ‘hindi ako mayroong demonyo’ sa natural na anyong Tagalog, nang hindi agad ipinapakahulugang sinasapian.
- source_word: ἀλλὰ
  choice: Sa halip
  rationale: Malinaw na ipinahahayag ang mariing pagsalungat sa paratang at ang kasunod na pahayag tungkol sa pagpaparangal sa Ama.
- source_word: τιμῶ
  choice: pinararangalan ko
  rationale: Tumpak at marangal na katumbas ng ‘nagbibigay-galang,’ at nagpapanatili ng semantikong pagsalungat sa ἀτιμάζω.
- source_word: τὸν πατέρα μου
  choice: ang aking Ama
  rationale: Ang malaking titik sa ‘Ama’ ay nagpapakita ng malinaw na pagtukoy ni Jesus sa Diyos ayon sa konteksto ng Juan, nang walang idinaragdag sa teksto.
- source_word: ἀτιμάζετέ
  choice: nilalapastangan ninyo
  rationale: Ipinahahayag ang pagkakait ng karangalan at mapanghamak na pagtrato; mas natural at mas matindi sa kasalukuyang Tagalog kaysa ‘hindi ninyo pinararangalan,’ habang nananatili ang kaibhan sa τιμῶ.
- source_word: με
  choice: ako
  rationale: Tuwirang katumbas ng panghalip na layon sa natural na balangkas ng Tagalog.
theological_decisions:
- issue: Ang tinutukoy ng ‘aking Ama’
  choice: Ginamit ang ‘aking Ama,’ na may malaking titik, bilang pagtukoy sa Diyos.
  alternative: ‘aking ama’ bilang karaniwang ugnayang pampamilya
  rationale: Sa agarang konteksto at sa paggamit sa Ebanghelyo ni Juan, malinaw na tinutukoy ni Jesus ang Diyos bilang kanyang Ama; ipinakikita lamang ng malaking titik ang kontekstuwal na pagkakakilanlang ito.
- issue: Kahulugan ng ‘may demonyo’
  choice: Pinanatili sa pangunahing teksto ang idyomang ‘Wala akong demonyo.’
  alternative: ‘Hindi ako sinasapian ng demonyo.’
  rationale: Mas malapit ang pangunahing salin sa anyo ng Griyego at nauunawaan pa rin sa Tagalog. Ang ‘sinasapian’ ay malamang na kahulugan ngunit mas interpretatibo, kaya inilagay sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Pinanatili ang tuwirang idyoma ng orihinal at ang pagsalungat sa pagitan ng pagpaparangal sa Ama at paglapastangan kay Jesus.
