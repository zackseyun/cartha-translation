revisions:
- from: Sumagot sila sa kanya, “Si Abraham ang aming ama.” Sinabi sa kanila ni Jesus, “Kung mga anak kayo ni Abraham, ginagawa sana ninyo ang mga ginawa ni Abraham.”[a]
  to: Sumagot sila sa kanya, “Si Abraham ang aming ama.” Sinabi ni Jesus sa kanila, “Kung kayo ay mga anak ni Abraham, ginagawa ninyo ang mga gawa ni Abraham.”
  rationale: Inalis ang hindi suportadong “sana” at ang maling talababa upang maipakita ang mga present indicative ng Griyego nang hindi ipinapataw ang isang pinagtatalunang counterfactual na pagbasa. Pinili ang “mga gawa ni Abraham” upang panatilihin ang etikal na diin ng ἔργα at ang natural na rehistrong Tagalog.
