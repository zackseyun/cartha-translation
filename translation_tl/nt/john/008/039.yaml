  text: Ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Ὁ πατὴρ ἡμῶν Ἀβραάμ ἐστιν. λέγει αὐτοῖς ὁ Ἰησοῦς· Εἰ τέκνα τοῦ Ἀβραάμ ⸀ἐστε, τὰ ἔργα τοῦ Ἀβραὰμ ⸀ἐποιεῖτε·
base_translation:
  language: en
  yaml_path: translation/nt/john/008/039.yaml
  text: They answered and said to him[a], “Abraham is our father.” Jesus says to them, “If you are Abraham’s children, you would be doing Abraham’s works.”
translation:
  language: tl
  text: Sumagot sila sa kanya, “Si Abraham ang aming ama.” Sinabi ni Jesus sa kanila, “Kung kayo ay mga anak ni Abraham, ginagawa ninyo ang mga gawa ni Abraham.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: Sumagot sila sa kanya
  rationale: Ang tambalang Griyego na literal na ‘sumagot at nagsabi’ ay isang karaniwang pormula ng pagsasalita. Sa modernong Tagalog, sapat at natural ang ‘sumagot’; ang ‘sumagot at nagsabi’ ay mabigat at paulit-ulit.
- source_word: Ὁ πατὴρ ἡμῶν Ἀβραάμ ἐστιν
  choice: Si Abraham ang aming ama
  rationale: Natural sa Tagalog at pinananatili ang madiing pag-angkin kay Abraham bilang ama.
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: Sinabi sa kanila ni Jesus
  rationale: Isinalin ang historikal na pangkasalukuyan ng Griyego sa karaniwang panahong pasalaysay sa Tagalog upang maging natural, nang hindi binabago ang kahulugan.
- source_word: τέκνα τοῦ Ἀβραάμ
  choice: mga anak ... ni Abraham
  rationale: Ang ‘mga anak’ ay inklusibo sa kasarian at pinananatili ang ugnayang pampamilya at lahi na ipinahihiwatig ng τέκνα.
- source_word: τὰ ἔργα τοῦ Ἀβραὰμ
  choice: ang mga ginawa ni Abraham
  rationale: Mas natural at malinaw sa ordinaryong Tagalog kaysa sa literal na ‘mga gawa ni Abraham,’ habang pinananatili ang kongkretong pagtukoy sa asal at kilos ni Abraham.
- source_word: ἐποιεῖτε
  choice: ginagawa sana ninyo
  rationale: Ipinapahayag ng ‘sana’ ang di-natutupad o salungat-sa-katotohanang bisa ng kondisyon, habang ang ‘ginagawa’ ay nagpapanatili ng aspektong di-ganap o nagpapatuloy.
theological_decisions:
- issue: Kalikasan ng pagiging mga anak ni Abraham sa tugon ni Jesus
  choice: Pinanatili ang literal na wikang pampamilya at ang paghahambing nito sa mga gawa, nang hindi tiyakang itinatanggi ang pisikal na lahi o nililimitahan ito sa espirituwal na pagiging anak.
  alternative: Isalin o ipaliwanag na ang tinutukoy ay espirituwal na mga anak lamang, o na itinatanggi ni Jesus ang kanilang pisikal na pagkamula kay Abraham.
  rationale: Ang talata ay naglalagay ng tensiyon sa pagitan ng kanilang pag-angkin kay Abraham bilang ama at ng kanilang mga gawa. Hindi dapat lutasin ng salin ang tensiyong iyon sa pamamagitan ng pagpasok ng isang mas malawak na sistemang teolohikal.
- issue: Bisa ng kondisyong Εἰ ... ἐστε ... ἐποιεῖτε
  choice: “Kung mga anak kayo ni Abraham, ginagawa sana ninyo...”
  alternative: “Kung mga anak kayo ni Abraham, ginagawa ninyo...” o “Kung mga anak sana kayo ni Abraham, gagawin ninyo...”
  rationale: Pinananatili ng pangunahing salin ang kasalukuyang anyo ng unang pandiwa at ipinahihiwatig sa hulihang sugnay ang salungat-sa-katotohanang puwersa. Dahil may tunay na sintaktikong kalabuan, ibinigay sa talababa ang mas tahasang alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Iniwasan ang mabigat na literalismong ‘sumagot at nagsabi’ at ang di-likas na ‘mga gawa ni Abraham,’ ngunit pinanatili ang ugnayang pampamilya, ang etikal na diin, at ang tunay na kalabuan ng kondisyong Griyego.
