id: JHN.8.28
reference: John 8:28
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἶπεν ⸀οὖν ὁ Ἰησοῦς· Ὅταν ὑψώσητε τὸν υἱὸν τοῦ ἀνθρώπου, τότε γνώσεσθε ὅτι ἐγώ εἰμι, καὶ ἀπ’ ἐμαυτοῦ ποιῶ οὐδέν, ἀλλὰ καθὼς ἐδίδαξέν με ὁ ⸀πατὴρ ταῦτα λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/028.yaml
  text: So Jesus said[a], “When you lift up the Son of Man, then you will know that I am he, and that I do nothing from myself, but just as the Father taught me[b], I speak these things.”
translation:
  language: tl
  text: Kaya sinabi ni Jesus, “Kapag itinaas[a] ninyo ang Anak ng Tao, saka ninyo malalaman na Ako nga[b], at na wala akong ginagawa nang sarili kong pagkukusa, ngunit sinasabi ko ang mga bagay na ito gaya ng itinuro sa akin ng Ama.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “itinaas” ay maaaring tumukoy kapwa sa pisikal na pagtataas kay Jesus at, ayon sa gamit ni Juan, sa kanyang pagdakila.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isaling “Ako ay.” Sa Griyego, “Ako ay” lamang (ἐγώ εἰμι) ang nakasulat, at walang tahasang panaguri.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Nag-uugnay ito sa naunang palitan at nagpapakita ng pagpapatuloy o bunga; natural sa makabagong Tagalog ang “Kaya.”
- source_word: Ὅταν
  choice: Kapag
  rationale: Tumutukoy sa isang tiyak na pangyayari sa hinaharap, hindi sa paulit-ulit na kilos.
- source_word: ὑψώσητε
  choice: itinaas
  rationale: Napapanatili ng “itinaas” ang dobleng pahiwatig ng pisikal na pagtataas kay Jesus at ng kanyang kadakilaan o pagdakila.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Karaniwang salin ng titulong ito at pinananatili ang kaugnayan nito sa gamit sa mga Ebanghelyo at sa Daniel.
- source_word: γνώσεσθε
  choice: malalaman
  rationale: Natural na hinaharap na anyo na naghahayag ng pagkilala o pagkaunawa sa darating na panahon.
- source_word: ἐγώ εἰμι
  choice: ako nga
  rationale: Likas sa Tagalog ang mariing ngunit bitin na pahayag na “ako nga,” at hindi nito tahasang pinupunan ang panaguring wala sa Griyego.
- source_word: ἀπ’ ἐμαυτοῦ ποιῶ οὐδέν
  choice: wala akong ginagawa sa sarili kong pagkukusa
  rationale: Ipinahahayag nito ang kawalan ng hiwalay na pinagmumulan o sariling pagkukusa, sa natural at malinaw na Tagalog.
- source_word: καθὼς ἐδίδαξέν με ὁ πατήρ
  choice: ayon sa itinuro sa akin ng Ama
  rationale: Pinananatili ang pagtutugma ng sinasabi ni Jesus sa itinuro sa kanya ng Ama.
- source_word: ταῦτα λαλῶ
  choice: sinasabi ko ang mga bagay na ito
  rationale: Malinaw na pinananatili ang demonstratibong ταῦτα at natural na naihahayag ang kilos ng pagsasalita.
theological_decisions:
- issue: Ang walang tahasang panaguring ἐγώ εἰμι
  choice: ako nga
  alternative: ako ay
  rationale: Hindi tahasang ginagawang pag-angkin sa banal na pangalan ang parirala, ngunit pinananatili ang mariin at posibleng mapagpahiwatig na katangian nito. Ipinaliliwanag sa talababa ang hubad na anyo ng Griyego.
- issue: Ang kahulugan ng ὑψώσητε sa Ebanghelyo ni Juan
  choice: itinaas
  alternative: ipinako sa krus; dinakila
  rationale: Maaaring tumukoy ang pandiwa kapwa sa pisikal na pagtataas kay Jesus sa krus at sa kanyang pagdakila; hindi pinipili ng salin ang isa lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “ako nga” upang manatiling natural habang pinangangalagaan ang gramatikal at teolohikal na di-tiyak na pahayag; inilagay ang mga marka ng talababa sa mismong mga pariralang tinatalakay.
