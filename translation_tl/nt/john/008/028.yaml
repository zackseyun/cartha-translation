revisions:
- from: Kaya sinabi ni Jesus, “Kapag itinaas[a] ninyo ang Anak ng Tao, saka ninyo malalaman na ako nga[b], at na wala akong ginagawa sa sarili kong pagkukusa. Sa halip, sinasabi ko ang mga bagay na ito ayon sa itinuro sa akin ng Ama.”
  to: Kaya sinabi ni Jesus, “Kapag itinaas[a] ninyo ang Anak ng Tao, saka ninyo malalaman na Ako nga[b], at na wala akong ginagawa nang sarili kong pagkukusa, ngunit sinasabi ko ang mga bagay na ito gaya ng itinuro sa akin ng Ama.”
  rationale: Pinalitan ang “Sa halip” ng “ngunit” upang huwag ipahiwatig na pamalit ang pagsasalita sa paggawa. Pinalitan ang “ayon sa” ng “gaya ng” upang mas malinaw na mapanatili ang comparative force ng καθὼς. Ang natitirang salin at mga talababa ay pinanatili dahil tapat ang mga ito sa Griyego at natural sa modernong Filipino Tagalog.
