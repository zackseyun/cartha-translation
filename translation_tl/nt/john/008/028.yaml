  source_fidelity: Ang draft ay wastong naghahatid ng pangunahing kahulugan at napapanatili ang sinadyang dalawang kahulugan ng ὑψώσητε sa pamamagitan ng “itinaas.” Gayunman, ang “Sa halip” ay mas malakas na panghalili kaysa sa simpleng kasalungat na ἀλλά, at ang “ayon sa” ay bahagyang humihina sa tuwirang paghahambing ng καθὼς (“gaya ng/katulad ng”).
  naturalness: Makabago at malinaw ang Tagalog sa kabuuan. Mas dumadaloy at mas tapat sa pangungusap na Griyego ang isang pangungusap na pinag-uugnay ng “ngunit,” sa halip na putulin sa “Sa halip.”
  terminology: Ang “Anak ng Tao” at “Ama” ay angkop at pare-pareho sa karaniwang rehistrong biblikal. Ang “Ako nga” ay isang likas na paraang Tagalog upang katawanin ang elliptical at mariing ἐγώ εἰμι nang hindi nagdaragdag ng panaguri; pinananatili ng talababa ang literal na hubad na anyo.
