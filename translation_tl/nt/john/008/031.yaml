id: JHN.8.31
reference: John 8:31
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἔλεγεν οὖν ὁ Ἰησοῦς πρὸς τοὺς πεπιστευκότας αὐτῷ Ἰουδαίους· Ἐὰν ὑμεῖς μείνητε ἐν τῷ λόγῳ τῷ ἐμῷ, ἀληθῶς μαθηταί μού ἐστε,
base_translation:
  language: en
  yaml_path: translation/nt/john/008/031.yaml
  text: So Jesus was saying to the Jews who had believed him[a], “If you remain in my word, you are truly my disciples,”
translation:
  language: tl
  text: Kaya sinabi ni Jesus sa mga Judiong naniwala sa kanya[a], “Kung mananatili kayo sa aking salita, tunay nga kayong mga alagad ko.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sumampalataya sa kanya.” Literal sa Griyego, “naniwala sa kanya.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἔλεγεν
  choice: sinabi
  rationale: Bagaman imperpektibo ang anyo ng pandiwa at maaaring magpahiwatig ng nagpapatuloy na pagsasalita, ang “sinabi” ang natural na paraan sa Tagalog upang ipakilala ang mismong pahayag sa salaysay; ang “sinasabi” ay maaaring magmukhang pangkasalukuyan nang walang sapat na konteksto.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinahihiwatig nito ang pagpapatuloy o bunga ng naunang usapan nang hindi ginagawang labis na pormal o mahigpit ang lohikal na ugnayan.
- source_word: πρὸς τοὺς πεπιστευκότας αὐτῷ Ἰουδαίους
  choice: sa mga Judiong naniwala sa kanya
  rationale: Ipinapakita ng “naniwala” ang naunang pagkilos ng perpektong participle. Ang karaniwang pariralang Tagalog na “naniwala sa kanya” ay likas at naiiwang bukas kung ang diin ay pagtanggap sa sinabi niya o pananampalataya sa kanya.
- source_word: Ἐὰν
  choice: Kung
  rationale: Malinaw at karaniwang pananda ito ng kondisyong ipinahahayag ng ἐὰν na may subjunctive.
- source_word: ὑμεῖς
  choice: kayo
  rationale: Pinananatili ang tahasang panghalip ng Griyego; sa Tagalog, malinaw itong tumutukoy sa mga kausap ni Jesus.
- source_word: μείνητε
  choice: mananatili
  rationale: Pinananatili nito ang diwa ng pagpapatuloy at pananatili na mahalaga sa paggamit ni Juan, nang hindi gumagamit ng mas malayang paliwanag tulad ng “mamuhay ayon.”
- source_word: ἐν τῷ λόγῳ τῷ ἐμῷ
  choice: sa aking salita
  rationale: Ang “salita” ay nagpapanatili sa bokabularyo at posibleng teolohikal na alingawngaw ng λόγος, habang nauunawaan din bilang mensahe o turo ni Jesus.
- source_word: ἀληθῶς
  choice: tunay nga
  rationale: Ipinahahayag nito ang pagiging tunay o totoo ng pagiging alagad at likas ang diin sa modernong Tagalog.
- source_word: μαθηταί μού ἐστε
  choice: mga alagad ko
  rationale: Ang “alagad” ang malinaw at nakaugaliang katawagan sa mga tagasunod at tinuturuan ni Jesus sa konteksto ng Ebanghelyo.
theological_decisions:
- issue: Kahulugan ng πιστεύω na may datibong αὐτῷ
  choice: naniwala sa kanya
  alternative: sumampalataya sa kanya
  rationale: Walang εἰς sa Griyego, kaya hindi dapat tahimik na ipilit ang mas ganap na pormulang “sumampalataya sa kanya.” Gayunman, hindi likas sa Tagalog ang tuwirang pagkakaibang Ingles na “believed him” laban sa “believed in him.” Ang “naniwala sa kanya” ay natural at napapanatili ang tunay na kalabuan; inilalagay sa talababa ang mas tahasang pagbasa tungkol sa pananampalataya.
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Pinanatili ang Johannine na “salita” at “mananatili” sa halip na gawing mas malayang “turo” at “patuloy na mamuhay ayon,” upang hindi mawala ang leksikal at teolohikal na ugnayan ng teksto.
