source:
  edition: SBLGNT
  text: ⸀εἶπον αὐτῷ οἱ Ἰουδαῖοι· Νῦν ἐγνώκαμεν ὅτι δαιμόνιον ἔχεις. Ἀβραὰμ ἀπέθανεν καὶ οἱ προφῆται, καὶ σὺ λέγεις· Ἐάν τις τὸν λόγον μου τηρήσῃ, οὐ μὴ γεύσηται θανάτου εἰς τὸν αἰῶνα·
base_translation:
  language: en
  yaml_path: translation/nt/john/008/052.yaml
  text: The Jews said to him[a], “Now we know that you have a demon. Abraham died, and the prophets also, yet you say, ‘If anyone keeps my word[c][b], he will certainly never taste death forever.’”
translation:
  language: tl
  text: Sinabi sa kanya ng mga Judio, “Ngayon ay alam na naming may demonyo ka.[a] Namatay si Abraham, gayundin ang mga propeta, ngunit sinasabi mo, ‘Kung tutuparin ng sinuman ang aking salita, hinding-hindi siya makatitikim ng kamatayan kailanman.’[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “sinasapian ka ng demonyo.” Literal sa Griyego: “may demonyo ka.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ang pananalita sa Griyego ay mariing pagtanggi: “hinding-hindi siya makatitikim ng kamatayan, kahit kailan.” Ang “makatikim ng kamatayan” ay isang idyoma at hindi nito nilulutas kung anong uri ng kamatayan ang tinutukoy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: mga Judio
  rationale: Tuwirang tumutukoy sa pangkat na sumasalungat kay Jesus sa konteksto; ang “mga pinunong Judio” ay higit na interpretatibo, at ang “mga taga-Judea” ay maaaring magpahiwatig lamang ng heograpiya.
- source_word: Νῦν ἐγνώκαμεν
  choice: Ngayon ay alam na namin
  rationale: Likas na Filipino na nagpapahayag ng kasalukuyang katiyakang bunga ng kanilang ipinapalagay na pagkaunawa.
- source_word: δαιμόνιον ἔχεις
  choice: may demonyo ka
  rationale: Pinananatili ang literal na anyo ng Griyego sa halip na agad itong gawing “sinasapian ka ng demonyo.”
- source_word: Ἀβραὰμ ἀπέθανεν καὶ οἱ προφῆται
  choice: Namatay si Abraham, gayundin ang mga propeta
  rationale: Natural na salin ng payak na nakaraang pangyayari at malinaw na naihahayag ang pagkakaugnay ni Abraham at ng mga propeta.
- source_word: καὶ σὺ λέγεις
  choice: ngunit sinasabi mo
  rationale: 'Ang καί ay may kontrastibong puwersa rito: namatay sila, ngunit taliwas dito ang pahayag ni Jesus.'
- source_word: Ἐάν τις
  choice: Kung tutuparin ng sinuman
  rationale: Pinananatili ang pangkalahatan at walang-tiyak na saklaw ng kondisyon.
- source_word: τὸν λόγον μου τηρήσῃ
  choice: tutuparin ... ang aking salita
  rationale: Ang “tutuparin” ay natural na katumbas ng τηρέω sa konteksto ng pagsunod at matapat na pag-iingat sa sinabi; pinananatili ng “salita” ang Johannine na λόγος.
- source_word: οὐ μὴ γεύσηται θανάτου εἰς τὸν αἰῶνα
  choice: hinding-hindi siya makararanas ng kamatayan kailanman
  rationale: Ang “hinding-hindi” ay naghahatid ng mariing οὐ μή, ang “makararanas” ay natural na pagpapahayag ng idyomang “tumikim ng kamatayan,” at ang “kailanman” ay nagpapakitang ang pagtanggi ay umaabot sa εἰς τὸν αἰῶνα nang hindi nagpapahiwatig na panghabang-panahon ang mismong pagtikim.
theological_decisions:
- issue: Kahulugan ng pangakong hindi makatitikim ng kamatayan
  choice: Panatilihin sa pangunahing teksto ang hindi tiyak na saklaw sa pamamagitan ng “makararanas ng kamatayan,” nang hindi tinutukoy kung pisikal, espirituwal, o pangwakas na kamatayan ang tinutukoy.
  alternative: Isalin nang tahasan bilang hindi mamamatay sa pisikal, hindi daranas ng espirituwal na kamatayan, o hindi daranas ng walang-hanggang kamatayan.
  rationale: Literal na inuunawa ng mga kausap ni Jesus ang pahayag, ngunit may patong-patong na kahulugan ang wika sa Juan. Hindi dapat lutasin ng salin ang tensiyong sadyang pinananatili ng konteksto.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “mga Judio” bilang tuwirang salin, “may demonyo ka” upang mapanatili ang anyo ng pinagmulan, at “hinding-hindi ... kailanman” upang maipahayag ang mariing pagtanggi nang natural. Lahat ng marker ng talababa ay nasa pangunahing teksto.
