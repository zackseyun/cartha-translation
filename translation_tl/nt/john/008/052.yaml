  terminology: Ang “mga Judio,” “may demonyo ka,” “mga propeta,” at “aking salita” ay angkop at hindi labis na interpretatibo. Ang “tutuparin ... ang aking salita” ay katanggap-tanggap sa konteksto para sa τηρέω, bagaman hindi dapat palitan ng isang salitang magpapasya sa teolohikal na kahulugan ng pangako.
