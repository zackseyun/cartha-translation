source:
  edition: SBLGNT
  text: καὶ ὁ πέμψας με μετ’ ἐμοῦ ἐστιν· οὐκ ἀφῆκέν με ⸀μόνον, ὅτι ἐγὼ τὰ ἀρεστὰ αὐτῷ ποιῶ πάντοτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/029.yaml
  text: And the one who sent me is with me[a]. He has not left me alone[b], because I always do what is pleasing to him.
translation:
  language: tl
  text: At ang nagsugo sa akin ay kasama ko. Hindi niya ako iniwang nag-iisa, sapagkat lagi kong ginagawa ang mga bagay na kalugod-lugod sa kanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πέμψας με
  choice: ang nagsugo sa akin
  rationale: Ang artikulong aorist participle ay ginagamit bilang pangngalan. Likas sa makabagong Tagalog ang “ang nagsugo sa akin” at pinananatili nito ang relasyonal na paglalarawan nang hindi tahasang idinaragdag ang “Ama.”
- source_word: μετ’ ἐμοῦ ἐστιν
  choice: ay kasama ko
  rationale: Ang μετά na may genitive ay nagsasaad ng pagiging kasama o kapiling. Ang “kasama ko” ay malinaw at natural, at ipinahahayag ang patuloy na presensya.
- source_word: οὐκ ἀφῆκέν με μόνον
  choice: Hindi niya ako iniwang nag-iisa
  rationale: Ang ἀφῆκεν ay aorist at ang μόνον ay tumutukoy sa kalagayan ng “ako.” Ang “iniwang nag-iisa” ay natural na Tagalog at malinaw na nagpapahayag na hindi siya pinabayaang mag-isa.
- source_word: ὅτι
  choice: sapagkat
  rationale: Ipinakikilala rito ng ὅτι ang dahilan. Ang “sapagkat” ay angkop sa marangal ngunit madaling maunawaang rehistro.
- source_word: τὰ ἀρεστὰ αὐτῷ
  choice: ang mga kalugod-lugod sa kanya
  rationale: Pinananatili ng pariralang ito ang substantibong pangmaramihang anyo ng Griyego—literal na “ang mga bagay na kalugod-lugod sa kanya”—nang hindi nagiging labis na mabigat sa Tagalog.
- source_word: ποιῶ πάντοτε
  choice: lagi kong ginagawa
  rationale: Ang present tense ay nagpapahiwatig ng palagian o nakaugaliang pagkilos, at ang πάντοτε ay malinaw na naipahahayag ng “lagi.”
theological_decisions:
- issue: Tinutukoy ng “ang nagsugo sa akin”
  choice: Pinanatili ang relasyonal na pahayag na “ang nagsugo sa akin.”
  alternative: Tahasan itong isaling “ang Ama na nagsugo sa akin.”
  rationale: Bagaman malinaw sa konteksto na ang Ama ang tinutukoy, hindi Siya tahasang pinangalanan sa talata. Pinananatili ng salin ang anyo at estilo ng Griyego at iniiwasang magdagdag.
- issue: Panahunan at implikasyon ng ἀφῆκεν
  choice: Isinaling “Hindi niya ako iniwang nag-iisa.”
  alternative: “Hindi niya ako iniiwang nag-iisa” o “Hindi niya ako pinabayaang mag-isa.”
  rationale: Pinananatili ng pangnagdaang “iniwan” ang aorist na anyo, habang ipinakikita na ng naunang “ay kasama ko” ang nagpapatuloy na presensya. Iniiwasan din ng “iniwang nag-iisa” ang mas malakas na konotasyon ng ganap na pagtalikod na maaaring taglayin ng “pinabayaan.”
- issue: Ugnayang ipinahihiwatig ng ὅτι
  choice: 'Pinanatili itong sanhi: “sapagkat.”'
  alternative: 'Maaaring unawain nang mas maluwag bilang paliwanag: “dahil.”'
  rationale: Ang pinakadirektang pagbasa ay nagbibigay ng dahilan kung bakit hindi siya iniwang nag-iisa. Hindi nilulutas ng salin ang mas malawak na teolohikal na tanong tungkol sa ugnayan ng pagsunod ng Anak at presensya ng Ama.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “nagsugo” sa halip na mas kolokyal na “nagpadala” upang mapanatili ang diwa ng awtorisadong misyon; iniwasan naman ang labis na arkaikong ayos at bokabularyo.
