  text: ἔλεγον οὖν οἱ Ἰουδαῖοι· Μήτι ἀποκτενεῖ ἑαυτὸν ὅτι λέγει· Ὅπου ἐγὼ ὑπάγω ὑμεῖς οὐ δύνασθε ἐλθεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/022.yaml
  text: So the Jews were saying[a], “Surely he will not kill himself, since he says, ‘Where I am going, you cannot come’?”
translation:
  language: tl
  text: Kaya't sinabi ng mga Judio[a], “Hindi naman siguro niya papatayin ang sarili niya, dahil sinasabi niya, ‘Sa pupuntahan ko, hindi kayo makararating’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga taga-Judea” o, ayon sa konteksto ni Juan, “mga pinunong Judio,” depende sa lawak ng tinutukoy rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: sinasabi
  rationale: Ipinahihiwatig ng aspektong imperpektibo ang nagpapatuloy o inuulit na pagsasalita; likas itong naipahahayag ng “sinasabi” sa salaysay.
- source_word: οὖν
  choice: Kaya
  rationale: Ikinakabit nito ang sinabi nila bilang tugon o hinuha mula sa naunang pahayag ni Jesus.
- source_word: οἱ Ἰουδαῖοι
  choice: ang mga Judio
  rationale: Ito ang tuwirang katumbas ng pariralang Griego. Maaaring mas makitid ang tinutukoy nito sa konteksto ni Juan, ngunit hindi iyon tahasang nililimitahan ng talatang ito.
- source_word: Μήτι
  choice: Hindi naman siguro
  rationale: Ipinahihiwatig ng μήτι ang tanong na umaasang negatibo ang sagot; likas na naihahatid ng pariralang ito ang kanilang pag-aalinlangan.
- source_word: ἀποκτενεῖ ἑαυτόν
  choice: papatayin ang sarili niya
  rationale: Tuwiran at malinaw na salin ng pandiwa at ng reflexive pronoun sa makabagong Filipino.
- source_word: ὅτι
  choice: dahil
  rationale: Ipinakikilala nito ang batayan ng kanilang hinuha—ang mismong sinabi ni Jesus.
- source_word: λέγει
  choice: sinasabi niya
  rationale: Pinananatili ang kasalukuyang aspekto ng pandiwang Griego sa loob ng pagsasalaysay.
- source_word: Ὅπου ἐγὼ ὑπάγω
  choice: Sa pupuntahan ko
  rationale: Natural na Filipino para sa lugar na patutunguhan, nang hindi labis na tinutukoy kung ano o saan iyon.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: hindi kayo makakapunta
  rationale: Malinaw at likas na ipinahahayag ang kawalan nila ng kakayahang makarating sa pupuntahan niya.
theological_decisions:
- issue: Ang tinutukoy ng οἱ Ἰουδαῖοι sa Ebanghelyo ni Juan
  choice: Panatilihin sa pangunahing teksto ang “mga Judio.”
  alternative: “mga Judeano” o “mga pinunong Judio”
  rationale: Bagaman maaaring tumukoy ang parirala sa mga Judeano o sa partikular na mga pinunong sumasalungat kay Jesus, hindi iyon tahasang nililimitahan ng talatang ito. Pinananatili ng salin at talababa ang tunay na lawak at kalabuan ng salita.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Hindi naman siguro” upang natural na maipakita ang tanong na umaasang hindi ang sagot, at iniwasang paliitin sa pangunahing teksto ang maaaring tinutukoy ng “mga Judio.”
