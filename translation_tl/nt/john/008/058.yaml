base_translation:
  language: en
  yaml_path: translation/nt/john/008/058.yaml
  text: Jesus said to them[a], “Truly, truly, I say to you, before Abraham came to be[b], I am.”
translation:
  language: tl
  text: 'Sinabi sa kanila ni Jesus, “Tunay na tunay, sinasabi ko sa inyo: bago pa umiral si Abraham[a], ako nga[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “bago pa ipinanganak si Abraham.” Mas malawak ang pandiwang Griyego: “umiral” o “nagsimulang umiral.”'
    reason: lexical_alternative
  - marker: b
    text: Ang Griyego ay may pangkasalukuyang anyong katumbas ng “ako ay.” Ang “ako nga” ay mariing Tagalog na paglilipat ng maigsi at absolutong pahayag. Maaari rin itong unawain sa temporal na diwa bilang “ako ay umiiral na,” ngunit pinananatili rito ang maikling anyo at ang posibleng teolohikal na pahiwatig nito.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν αὐτοῖς Ἰησοῦς
  choice: Sinabi sa kanila ni Jesus
  rationale: Direkta at likas na salin ng panimulang salaysay, habang pinananatili ang tumatanggap ng sinabi.
- source_word: Ἀμὴν ἀμὴν
  choice: Tunay na tunay
  rationale: Pinananatili ang pag-uulit at mariing katiyakan ng pormulang Griyego sa malinaw at kasalukuyang Tagalog.
- source_word: λέγω ὑμῖν
  choice: sinasabi ko sa inyo
  rationale: Malapit sa anyong pangkasalukuyan ng Griyego at pinananatili ang maringal na tuwirang pahayag.
- source_word: πρὶν
  choice: bago pa
  rationale: Likas na panandang temporal sa Tagalog; ang “pa” ay nagbibigay-diin na nauna ang tinutukoy na kalagayan.
- source_word: Ἀβραὰμ γενέσθαι
  choice: umiral si Abraham
  rationale: Hindi nililimitahan ang γενέσθαι sa kapanganakan lamang at pinananatili ang kaibahan nito sa kasunod na ἐγὼ εἰμί.
- source_word: ἐγὼ εἰμί
  choice: ako nga
  rationale: Sa Tagalog, hindi maaaring tumayo nang likas ang literal na “ako ay” nang walang panaguri. Ang “ako nga” ay maikli at mariin, at pinananatili ang absolutong anyo at posibleng teolohikal na alingawngaw nang hindi ito ginagawang tahasang paliwanag tungkol sa pag-iral.
- source_word: Ἀβραὰμ
  choice: Abraham
  rationale: Karaniwang anyo ng pangalan sa makabagong saling Tagalog.
theological_decisions:
- issue: Paglilipat ng ἐγὼ εἰμί sa kontekstong may matinding kristolohikal na pahiwatig
  choice: ako nga
  alternative: ako ay umiiral na / ako ay naroon na
  rationale: Pinananatili ng “ako nga” ang maigsi, mariin, at absolutong pahayag. Hindi nito nilulutas ang tensiyon sa pamamagitan ng pagbibigay lamang ng kahulugang naunang pag-iral, at hindi rin nito tahasang ipinapasok sa pangunahing teksto ang isang tiyak na interpretasyon ng banal na pagpapakilala.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Tunay na tunay” upang mapanatili ang dobleng diin, “umiral” upang huwag paliitin ang γενέσθαι sa pisikal na kapanganakan, at “ako nga” upang maipahayag nang likas sa Tagalog ang di-karaniwang absolutong ἐγὼ εἰμί.
