translation:
  language: tl
  text: Ngunit ako, dahil katotohanan ang sinasabi ko, ay hindi ninyo pinaniniwalaan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin nang mas malapit sa ayos ng Griego: “Ngunit ako, sapagkat sinasabi ko ang katotohanan, ay hindi ninyo pinaniniwalaan.” Ang salitang Griego ay maaari ring isalin nang mas pormal bilang “na,” ngunit sa kontekstong ito ay pinakamainam itong unawain bilang sanhi: “dahil.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ
  choice: ako / ko
  rationale: Naipahihiwatig ang tahasang unang panauhan sa anyong “sinasabi ko”; kasabay ng “kayo,” napapanatili nito ang personal na paghaharap sa pangungusap nang hindi nagiging pilit ang Filipino.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinapakita ng δέ ang pagsalungat sa naunang konteksto; natural at marangal na katumbas nito rito ang “Ngunit.”
- source_word: ὅτι
  choice: dahil
  rationale: 'Pinakamalamang na sanhi ang gamit ng ὅτι rito: ang pagsasabi ni Jesus ng katotohanan ang kabalintunaang dahilan ng hindi nila paniniwala sa kanya. Gayunman, binabanggit sa talababa ang mas pormal na alternatibo.'
- source_word: τὴν ἀλήθειαν
  choice: katotohanan
  rationale: Karaniwan at tuwirang katumbas ng ἀλήθεια. Likas sa Filipino ang sugnay na “katotohanan ang sinasabi ko” kahit walang artikulong katumbas ng Greek na τήν.
- source_word: λέγω
  choice: sinasabi ko
  rationale: Pinananatili ang pangkasalukuyang aspekto at natural na naiuugnay ang pandiwa sa “katotohanan.”
- source_word: οὐ πιστεύετέ μοι
  choice: hindi kayo naniniwala sa akin
  rationale: Tuwirang pinananatili ang personal na layon ng πιστεύω na may dative; hindi ito pinalawak bilang “hindi kayo naniniwala sa sinasabi ko,” na maaaring magpaliit sa saklaw ng Greek.
theological_decisions:
- issue: Kahulugan ng ὅτι kaugnay ng pagsasabi ni Jesus ng katotohanan at ng kawalan nila ng paniniwala
  choice: 'Sanhi: “dahil katotohanan ang sinasabi ko”'
  alternative: 'Paturol o mas pormal: “na katotohanan ang sinasabi ko”'
  rationale: 'Mas angkop sa daloy ng diskurso ang sanhi: taliwas sa diyablo sa naunang talata, nagsasabi si Jesus ng katotohanan, at dahil dito ay hindi sila naniniwala sa kanya. Pinananatili nito ang matalim na kabalintunaan nang hindi nagdaragdag ng doktrinal na paliwanag.'
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “kayo” at “sa akin” para sa malinaw na personal na paghaharap, at ang ayos na “katotohanan ang sinasabi ko” para sa idiomatikong diin.
