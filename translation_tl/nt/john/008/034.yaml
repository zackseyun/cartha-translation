id: JHN.8.34
reference: John 8:34
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι πᾶς ὁ ποιῶν τὴν ἁμαρτίαν δοῦλός ἐστιν τῆς ἁμαρτίας·
base_translation:
  language: en
  yaml_path: translation/nt/john/008/034.yaml
  text: Jesus answered them[a], “Truly, truly, I say to you[b], everyone who practices sin is a servant of sin.”
translation:
  language: tl
  text: Sumagot sa kanila si Jesus, “Tunay na tunay na sinasabi ko sa inyo, ang bawat gumagawa ng kasalanan[a] ay alipin ng kasalanan.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagkakasala.” Ang anyong Griyego ay maaaring maglarawan ng nagpapatuloy o kinagawiang paggawa, ngunit hindi nito kinakailangang limitahan ang pahayag sa gayong kahulugan lamang.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “lingkod ng kasalanan.” Ang salitang Griyego na δοῦλος ay maaaring tumukoy sa alipin o lingkod; ginamit dito ang “alipin” dahil sentro sa konteksto ang pagkagapos na kabaligtaran ng kalayaan.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς
  choice: Sumagot sa kanila si Jesus
  rationale: Natural na ayos sa modernong Tagalog na malinaw na pinananatili ang tugon ni Jesus sa mga kausap niya.
- source_word: Ἀμὴν ἀμὴν
  choice: Tunay na tunay
  rationale: Pinananatili ang pag-uulit at taimtim na pagtiyak ng natatanging pormulang Juaniko, ngunit gumagamit ng mga salitang agad mauunawaan sa Tagalog.
- source_word: λέγω ὑμῖν
  choice: sinasabi ko sa inyo
  rationale: Malapit at natural na salin ng kasalukuyang pormula, na pinananatili ang marangal at mariing tono.
- source_word: πᾶς ὁ ποιῶν τὴν ἁμαρτίαν
  choice: ang bawat gumagawa ng kasalanan
  rationale: Ang “gumagawa” ay nagpapanatili sa anyong participyo at hindi lubusang nagpapasya kung ito ay nakagawian, nagpapatuloy, o pangkalahatang paglalarawan. Hindi kailangang tumbasan sa Tagalog ang artikulo bago ang ἁμαρτία.
- source_word: δοῦλος
  choice: alipin
  rationale: Mas malinaw na ipinahahayag ng “alipin” ang pagkagapos at pagpapasakop na sentro ng talinghaga kaysa sa mas banayad na “lingkod.”
- source_word: τῆς ἁμαρτίας
  choice: ng kasalanan
  rationale: Direktang ipinapakita ang pag-aari o paghahari ng kasalanan sa alipin nito at natural ang anyo sa Tagalog.
theological_decisions:
- issue: Kung ang ποιῶν ay tumutukoy sa nakagawiang pagkakasala o sa paggawa ng kasalanan sa pangkalahatan
  choice: gumagawa ng kasalanan
  alternative: patuloy na gumagawa ng kasalanan; namumuhay sa kasalanan
  rationale: Maaaring magpahiwatig ng nagpapatuloy o katangiang gawain ang present participle sa konteksto, ngunit ang pagdaragdag ng “patuloy” o “namumuhay” sa pangunahing teksto ay higit na tiyak kaysa sa mismong Griyego. Pinananatili ng salin ang tunay na lawak ng pahayag.
- issue: Lakas ng talinghaga sa δοῦλος
  choice: alipin ng kasalanan
  alternative: lingkod ng kasalanan
  rationale: Ang konteksto ay tungkol sa kalayaan at pagkagapos; kaya pinananatili ang mas matinding diwa ng pagkaalipin nang hindi ito ginagawang hiwalay na sistematikong doktrina.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pagbasa nang malakas. Pinanatili ang dobleng taimtim na pormula sa “Tunay na tunay,” iniwasan ang labis na pagpapaliwanag sa pangunahing teksto, at inilagay sa mga talababa ang mahahalagang leksikal na alternatibo.
