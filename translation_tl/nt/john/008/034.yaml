  source_fidelity: 'Tapat ang salin sa Griyego: naipapahayag ang tugon ni Jesus, ang inuulit na taimtim na pormulang «Ἀμὴν ἀμὴν», ang pangkalahatang «bawat gumagawa», at ang metapora ng pagkaalipin sa kasalanan. Hindi nito ipinipilit na ang participle ay eksklusibong habitual o tuloy-tuloy, bagaman kinikilala ito ng talababa.'
  naturalness: Natural at malinaw ang modernong Filipino Tagalog. Ang «Tunay na tunay na sinasabi ko sa inyo» ay marangal at angkop sa solemne at tuwirang pahayag ni Jesus. Ang «alipin ng kasalanan» ay idiomatiko at mabisa sa konteksto ng kalayaan at pagkagapos.
  terminology: Ang «kasalanan» ay wastong katumbas ng ἁμαρτία, at ang «alipin» ay angkop na mas malakas na katumbas ng δοῦλος sa kontekstong ito. Ang mga talababa ay wastong nakaaangkla sa «kasalanan» at «alipin ng kasalanan» at nagbibigay ng makatuwirang alternatibo nang hindi binabago ang pangunahing diwa.
