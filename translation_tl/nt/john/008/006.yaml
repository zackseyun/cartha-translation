  text: Τοῦτο δὲ ἔλεγον πειράζοντες αὐτόν, ἵνα ἔχωσιν κατηγορίαν κατ' αὐτοῦ. Ὁ δὲ Ἰησοῦς κάτω κύψας, τῷ δακτύλῳ ἔγραφεν εἰς τὴν γῆν, μὴ προσποιούμενος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/006.yaml
  text: They[a] were saying this to test him, so that they might have an accusation against him. But Jesus, bending down, wrote on the ground with his finger, paying no attention.
translation:
  language: tl
  text: Sinabi nila[a] ito upang subukin siya, upang magkaroon sila ng maipaparatang laban sa kanya. Ngunit yumuko si Jesus at sumulat sa lupa gamit ang kanyang daliri, na waring hindi sila pinapansin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Karugtong ito ng salaysay tungkol sa babaeng nahuling nangangalunya (Juan 7:53–8:11). Tingnan ang tala sa Juan 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: πειράζοντες
  choice: upang subukin
  rationale: Ipinahahayag ang masamang layunin ng pagtatanong nang hindi nililimitahan ang salita sa tukso lamang; layunin nilang makahanap ng maipaparatang kay Jesus.
- source_word: κατηγορίαν
  choice: maipaparatang
  rationale: Natural sa modernong Tagalog at angkop sa kontekstong legal; pinananatili nito ang diwa ng isang paratang o sakdal laban sa kanya.
- source_word: κάτω κύψας
  choice: yumuko
  rationale: Maikli at natural na pagsasalin ng kilos na pagyuko patungo sa lupa bago sumulat.
- source_word: ἔγραφεν
  choice: sumulat
  rationale: Pinananatili ang payak na pahayag ng Griyego nang hindi dinaragdagan kung ano ang isinulat o kung paulit-ulit ang kilos.
- source_word: μὴ προσποιούμενος
  choice: na hindi sila pinapansin
  rationale: Inilalarawan ang sinasadyang hindi pagpansin; ang layon na “sila” ay malinaw mula sa konteksto, habang hindi ipinapalagay na hindi niya sila narinig.
theological_decisions:
- issue: Ang nilalaman at kahulugan ng isinulat ni Jesus sa lupa
  choice: Hindi tinukoy o ipinaliwanag
  alternative: Magmungkahi na nagsulat siya ng mga kasalanan, pangalan, o isang talata sa Kautusan
  rationale: Hindi sinasabi ng Griyegong teksto kung ano ang isinulat niya; ang pagdaragdag nito ay magiging interpretasyong walang tahasang batayan sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “subukin” at “maipaparatang” upang malinaw na maipakita ang balak na makahanap ng batayan laban kay Jesus. Inilagay ang marker na [a] kaagad pagkatapos ng paksa, gaya ng consultation layer.
