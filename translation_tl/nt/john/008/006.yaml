  source_fidelity: 'Tumpak sa kabuuan ang pagsasalin ng πειράζοντες, κατηγορίαν, pagsulat sa lupa gamit ang daliri, at ang sinadyang hindi pagpansin. Gayunman, ang “nang magkaroon” ay karaniwang nagpapahiwatig ng panahong “noong/kapag,” samantalang ang ἵνα ay malinaw na layunin; dapat itong “upang magkaroon.” Ang “waring hindi sila pinapansin” ay mas naipapakita ang προσποιούμενος: isang sinadyang pagkukunwaring hindi nagbibigay-pansin, nang hindi iginigiit na wala siyang narinig.'
  naturalness: Natural at marangal ang rehistro. Ang pagpapalit ng ikalawang “nang” sa “upang” ay nag-aalis ng hindi likas at maling ugnayang panahunan. Natural din ang “waring hindi sila pinapansin” sa modernong Filipino.
  terminology: Ang “subukin” ay angkop para sa πειράζω sa kontekstong paghahanap ng maikakaso; ang “maipaparatang” ay angkop para sa κατηγορία. Pinanatili ang pangalang “Jesus” at ang tekstuwal-kritikal na tala.
