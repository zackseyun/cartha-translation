  text: μὴ σὺ μείζων εἶ τοῦ πατρὸς ἡμῶν Ἀβραάμ, ὅστις ἀπέθανεν; καὶ οἱ προφῆται ἀπέθανον· τίνα ⸀σεαυτὸν ποιεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/053.yaml
  text: Surely you are not greater than our father Abraham[a], who died? The prophets also died[b]. Who do you make yourself out to be?
translation:
  language: tl
  text: Hindi ka naman nakahihigit sa aming amang si Abraham, na namatay, hindi ba?[a] Namatay rin ang mga propeta. Sino ang inaangkin mong ikaw?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Hindi ka ba nakahihigit sa aming amang si Abraham...?” Ang pagkakabuo ng tanong sa Griyego ay umaasang “hindi” ang sagot.'
    reason: lexical_alternative
  - marker: b
    text: 'Mas literal: “Sino ang ginagawa mo sa iyong sarili?” Ang pahayag ay nangangahulugang “Sino ang inaangkin mong ikaw?” o “Sino ang sinasabi mong ikaw?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ σὺ
  choice: Tiyak na hindi ka ... hindi ba?
  rationale: Ang μή sa ganitong tanong ay umaasang negatibo ang sagot. Inihahayag ng anyong ito ang mapanghamong retorikal na diin sa natural na Tagalog.
- source_word: μείζων
  choice: nakahihigit
  rationale: Pinananatili nito ang malawak na diwa ng pagiging mas dakila, mataas, o mahalaga nang hindi nililimitahan ang paghahambing sa isang tiyak na uri ng kadakilaan.
- source_word: τοῦ πατρὸς ἡμῶν Ἀβραάμ
  choice: sa aming amang si Abraham
  rationale: Ang genitibo pagkatapos ng pahambing ay likas na isinasalin sa Tagalog gamit ang “sa.” Ang “aming amang si Abraham” ay nagpapanatili sa pag-angkin sa kanya bilang ninuno at sa marangal na gamit ng πατήρ.
- source_word: ὅστις ἀπέθανεν
  choice: na namatay
  rationale: Tuwirang inilalahad nito ang makasaysayang katotohanan ng pagkamatay ni Abraham.
- source_word: καὶ οἱ προφῆται ἀπέθανον
  choice: Namatay din ang mga propeta
  rationale: Ang “din” ay malinaw na nagdurugtong sa mga propeta bilang kapantay na halimbawa sa argumento.
- source_word: τίνα σεαυτὸν ποιεῖς
  choice: Sino ba ang ipinakikilala mong ikaw?
  rationale: Ipinahahayag nito ang idyomatikong diwa ng pagpapakilala o pag-aangkin sa sariling pagkakakilanlan, habang pinananatili ang matalim at mapanuring tono.
theological_decisions:
- issue: Ang retorikal na hamon sa katayuan ni Jesus kung ihahambing kay Abraham at sa mga propeta
  choice: Isinalin bilang mapanlabang tanong na umaasang itatanggi na nakahihigit si Jesus.
  alternative: Mas neutral na “Mas dakila ka ba kaysa sa aming amang si Abraham?”
  rationale: Ang μή ay nagpapahiwatig na negatibo ang inaasahang sagot. Pinananatili ng salin ang tensiyon tungkol sa pagkakakilanlan at awtoridad ni Jesus nang hindi pa ipinapasok sa talata ang isang doktrinal na sagot.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “nakahihigit” upang mapanatili ang lawak ng μείζων, at ang hulaping “hindi ba?” upang malinaw ang inaasahang negatibong sagot. Ang “aming amang si Abraham” ay natural na anyo para sa marangal na pagtukoy sa ninuno.
