  to: Sumagot si Jesus at sinabi sa kanila, “Kahit ako mismo ang magpatotoo tungkol sa sarili ko[a], totoo ang patotoo ko, sapagkat alam ko kung saan ako nanggaling at kung saan ako pupunta. Ngunit hindi ninyo alam kung saan ako nagmumula o kung saan ako pupunta.[b]”
