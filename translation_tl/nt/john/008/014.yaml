id: JHN.8.14
reference: John 8:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Κἂν ἐγὼ μαρτυρῶ περὶ ἐμαυτοῦ, ἀληθής ἐστιν ἡ μαρτυρία μου, ὅτι οἶδα πόθεν ἦλθον καὶ ποῦ ὑπάγω· ὑμεῖς δὲ οὐκ οἴδατε πόθεν ἔρχομαι ⸀ἢ ποῦ ὑπάγω.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/014.yaml
  text: Jesus answered and said to them[a], “Even if I testify about myself, my testimony is true, because I know where I came from and where I am going[b]; but you do not know where I come from or where I am going.”
translation:
  language: tl
  text: Sumagot si Jesus at sinabi sa kanila, “Kahit ako mismo ang magpatotoo tungkol sa sarili ko[a], totoo ang patotoo ko, sapagkat alam ko kung saan ako nanggaling at kung saan ako pupunta. Ngunit hindi ninyo alam kung saan ako nagmumula o kung saan ako pupunta.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sumasaksi tungkol sa sarili ko.”
    reason: lexical_alternative
  - marker: b
    text: Sa ilang manuskrito, “at kung saan ako pupunta” sa halip na “o kung saan ako pupunta.”
    reason: textual_variant
lexical_decisions:
- source_word: ἀπεκρίθη ... καὶ εἶπεν
  choice: Sumagot ... at sinabi
  rationale: Pinananatili ang dalawang pandiwang karaniwan sa salaysay ni Juan, habang natural pa rin ang daloy sa Tagalog.
- source_word: Κἂν ἐγὼ μαρτυρῶ
  choice: Kahit ako mismo ang nagpapatotoo
  rationale: Ipinahahayag ng “kahit” ang concessive na diwa, at ng “ako mismo” ang diin ng hayag na ἐγώ; pinananatili ng “nagpapatotoo” ang diwang saksi o legal na patotoo.
- source_word: περὶ ἐμαυτοῦ
  choice: tungkol sa sarili ko
  rationale: Tuwirang salin ito ng περί na may genitive at hindi nagdaragdag ng mas makitid na diwang “para sa sarili kong kapakanan.”
- source_word: ἀληθής ... ἡ μαρτυρία μου
  choice: totoo ang patotoo ko
  rationale: Pinananatili ang tuwirang pahayag tungkol sa katotohanan ng patotoo, nang hindi ito nililimitahan sa legal na “balido.”
- source_word: ὅτι οἶδα
  choice: sapagkat alam ko
  rationale: Malinaw na ipinakikita ang sanhi o batayan ng naunang pahayag.
- source_word: πόθεν ἦλθον
  choice: kung saan ako nanggaling
  rationale: Natural na Tagalog para sa pinagmulan na ipinahahayag ng aorist na ἦλθον.
- source_word: ποῦ ὑπάγω
  choice: kung saan ako pupunta
  rationale: Natural na ipinahahayag ang patutunguhan ng kilos na ὑπάγω.
- source_word: ὑμεῖς δὲ οὐκ οἴδατε
  choice: Ngunit hindi ninyo alam
  rationale: Pinananatili ang matinding paghahambing sa kaalaman ni Jesus at ang tahasang maramihang panghalip.
- source_word: πόθεν ἔρχομαι
  choice: kung saan ako nagmumula
  rationale: Ang “nagmumula” ay nagpapanatili sa present-tense na anyo at iniiba ito sa naunang aorist na “nanggaling.”
theological_decisions:
- issue: Batayan ng katotohanan ng sariling patotoo ni Jesus
  choice: Inilahad na totoo ang patotoo ni Jesus dahil alam niya ang kanyang pinagmulan at patutunguhan.
  alternative: Gawing mas makitid na pahayag tungkol sa legal na bisa, o tahasang idagdag na makalangit ang kanyang pinagmulan.
  rationale: Ang mismong talata ay nakatuon sa natatanging kaalaman ni Jesus sa kanyang pinagmulan at patutunguhan. Hinahayaan ng salin na linawin ng mas malawak na konteksto ni Juan ang teolohikal na kahulugan nang hindi ito ipinapasok sa mismong pangungusap.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ko/ninyo” bilang natural na anyo sa tuwirang pagsasalita, at pinanatili ang bokabularyo ng patotoo at pagsaksi na mahalaga sa konteksto ni Juan.
