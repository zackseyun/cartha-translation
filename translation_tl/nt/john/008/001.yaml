    reason: textual_critical
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig ng pang-ugnay ang paglipat at bahagyang pagsalungat sa naunang pangyayari; natural itong naipapahayag dito bilang “Ngunit.”
- source_word: ἐπορεύθη
  choice: pumunta
  rationale: Ang aorist na anyo ng πορεύομαι ay may aktibong diwa rito at nagsasaad ng payak na pagpunta sa isang patutunguhan.
- source_word: τὸ ὄρος τῶν Ἐλαιῶν
  choice: Bundok ng mga Olibo
  rationale: Pinananatili nito ang heograpikong katawagan at ang genitive plural na tumutukoy sa mga punong olibo sa lugar.
