  yaml_path: translation/nt/john/008/027.yaml
  text: They did not understand that he was speaking to them about the Father[a].
translation:
  language: tl
  text: Hindi nila naunawaan na tungkol sa Ama ang sinasabi niya sa kanila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Hindi nila nalaman na tungkol sa Ama ang sinasabi niya sa kanila.”
    reason: Leksikal na alternatibo para sa οὐκ ἔγνωσαν.
lexical_decisions:
- source_word: οὐκ ἔγνωσαν
  choice: Hindi nila naunawaan
  rationale: Bagaman karaniwang nangangahulugang “alam” ang γινώσκω, ipinahihiwatig ng konteksto na hindi nila naintindihan kung sino ang tinutukoy ni Jesus. Likas at malinaw sa modernong Tagalog ang “hindi nila naunawaan.”
- source_word: ὅτι
  choice: na
  rationale: Ipinakikilala nito ang nilalaman ng hindi nila naunawaan.
- source_word: τὸν πατέρα
  choice: ang Ama
  rationale: Sa konteksto ng Juan, tumutukoy ito sa Diyos bilang Ama ni Jesus. Ang malaking titik ay nagpapakita ng tiyak na katawagan nang walang idinaragdag na doktrina.
- source_word: αὐτοῖς
  choice: sa kanila
  rationale: Likas na salin ng datibo kasama ng λέγω at pinananatili ang tahasang tagapakinig.
- source_word: ἔλεγεν
  choice: tinutukoy niya
  rationale: Sa pangungusap na ito, ang diwa ng imperfect na λέγω ay ang patuloy na pagsasalita ni Jesus tungkol sa isang referent. Ang “tinutukoy niya” ay natural sa Tagalog at malinaw na naghahatid na ang Ama ang paksa ng sinabi niya.
theological_decisions:
- issue: Ang tinutukoy ng “Ama”
  choice: Ang Diyos bilang Ama ni Jesus
  alternative: Isang taong ama
  rationale: Paulit-ulit na ginagamit sa malapit na konteksto ng Juan ang “Ama” bilang katawagan ni Jesus sa Diyos. Kontekstuwal na pagkilala ito, hindi pagdaragdag ng mas huling pormulasyong teolohikal.
- issue: Kahulugan ng γινώσκω sa konteksto
  choice: naunawaan
  alternative: nalaman / nakilala
  rationale: Ang punto ay hindi nila nahagip ang kahulugan o referent ng sinabi ni Jesus. Pinananatili ng “naunawaan” ang kognitibong diwa sa natural na Tagalog.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, maikli, at marangal. Ginamit ang “naunawaan” sa halip na mas literal na “nalaman” upang maipahayag ang pagkabigo nilang maunawaan ang tinutukoy ni Jesus; inilagay sa talababa ang mas literal na alternatibo.
