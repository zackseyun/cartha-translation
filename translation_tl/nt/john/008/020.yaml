base_translation:
  language: en
  yaml_path: translation/nt/john/008/020.yaml
  text: He spoke these words in the treasury while teaching in the temple[a], and no one seized him[b], because his hour had not yet come.
translation:
  language: tl
  text: Sinabi niya ang mga salitang ito sa kabang-yaman habang nagtuturo sa templo[a]. At walang dumakip sa kanya, sapagkat hindi pa dumarating ang oras niya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga bakuran ng templo.” Ang salitang Griego ay tumutukoy sa buong kompleks ng templo, hindi lamang sa panloob na santuwaryo. Ang “kabang-yaman” ay maaaring tumukoy sa lugar sa loob ng kompleks kung saan naroon ang mga sisidlan ng handog.
    reason: lexical_alternative
  - marker: b
    text: Sa Juan, ang “oras niya” ay tumutukoy sa itinakdang panahon ng sukdulang pagdurusa at pagluwalhati ni Jesus. Maaari ring isalin na “ang itinakdang oras niya.”
    reason: cross_reference
lexical_decisions:
- source_word: ταῦτα τὰ ῥήματα ἐλάλησεν
  choice: Sinabi niya ang mga salitang ito
  rationale: Likas sa modernong Filipino ang “sinabi ... ang mga salitang ito” at malinaw nitong itinuturo ang naunang pahayag, habang pinananatili ang diwa ng ῥήματα at ἐλάλησεν.
- source_word: ἐν τῷ γαζοφυλακίῳ
  choice: sa kabang-yaman
  rationale: Ang γαζοφυλάκιον ay tumutukoy sa kabang-yaman o lugar ng mga handog sa templo; pinili ang maikli at tradisyonal na “kabang-yaman,” na nililinaw sa talababa.
- source_word: διδάσκων
  choice: habang nagtuturo
  rationale: Ipinahahayag nito ang kasabay na kilos ng present participle kaugnay ng pangunahing pandiwa.
- source_word: ἐν τῷ ἱερῷ
  choice: sa templo
  rationale: Natural at malinaw ang “templo”; ang ἱερόν ay tumutukoy sa mas malawak na kompleks o mga bakuran ng templo, kaya may talababa upang maiwasang ipakahulugang panloob na santuwaryo lamang.
- source_word: οὐδεὶς ἐπίασεν αὐτόν
  choice: walang dumakip sa kanya
  rationale: Ang “dumakip” ay nagpapanatili sa pisikal at mapanlabang diwa ng πιάζω nang hindi kinakailangang gawing pormal na legal na pag-aresto.
- source_word: ὅτι οὔπω ἐληλύθει
  choice: sapagkat hindi pa dumarating
  rationale: Malinaw na ipinakikita ng “sapagkat” ang dahilan, at pinananatili ng “hindi pa dumarating” ang aspektong ipinahahayag ng pluperfect sa salaysay.
- source_word: ἡ ὥρα αὐτοῦ
  choice: ang oras niya
  rationale: Pinananatili ng literal na “oras niya” ang susing temang Johannine at ang teolohikal na tensiyon nito, sa halip na paliitin ito sa pangkaraniwang “panahon” lamang.
theological_decisions:
- issue: Ang Johannine na gamit ng “oras niya”
  choice: Panatilihin sa pangunahing teksto ang literal na “ang oras niya.”
  alternative: ang itinakdang oras niya; ang panahon niya
  rationale: Sa Juan, ang “oras” ay tumutukoy sa itinakdang sukdulang pagdurusa at pagluwalhati ni Jesus. Ang literal na anyo ay nagpapanatili sa umuunlad na tema at hindi agad nilulutas ang buong kahulugan nito sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “kanya” ayon sa kasalukuyang pamantayang baybay. Pinanatili ang “kabang-yaman” at “oras niya” bilang maiikling ekspresyong may biblikal na bigat, na may mga talababa para sa kinakailangang paglilinaw.
