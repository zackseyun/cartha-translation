lexical_decisions:
- source_word: ταῦτα
  choice: ang mga bagay na ito
  rationale: Pinananatili nito ang maramihang panghalip na tumutukoy sa nilalaman ng naunang sinabi ni Jesus.
- source_word: αὐτοῦ λαλοῦντος
  choice: Habang sinasabi niya
  rationale: Ang genitive absolute na may present participle ay nagpapahiwatig ng kasabay at nagpapatuloy na kilos; natural itong ipinahahayag sa Tagalog sa pamamagitan ng “habang.”
- source_word: πολλοὶ
  choice: marami
  rationale: Ginagamit ang pang-uri bilang pangngalan; sapat at natural ang “marami” nang hindi idinaragdag ang “tao.”
- source_word: ἐπίστευσαν
  choice: sumampalataya
  rationale: Inilalahad ng aorist ang pangyayari bilang isang kabuuan. Ang “sumampalataya” ay natural at dignified na katumbas ng πιστεύω sa kontekstong ito.
- source_word: εἰς αὐτόν
  choice: sa kanya
  rationale: Kasama ng “sumampalataya,” ipinahahayag ng “sa kanya” ang tiwala o pananampalatayang nakatuon kay Jesus, hindi lamang ang paniniwala sa sinabi niya.
theological_decisions:
- issue: Paglilipat ng πιστεύω εἰς αὐτόν sa gamit ni Juan
  choice: sumampalataya sa kanya
  alternative: naniwala sa kanya
  rationale: Pinananatili ng “sumampalataya sa kanya” ang personal at nakatuong pagtitiwala na ipinahihiwatig ng πιστεύω + εἰς, samantalang ang “naniwala sa kanya” ay maaari ring maunawaan bilang simpleng pagtanggap lamang sa katotohanan ng kanyang sinabi.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “Habang” upang ipakita ang magkasabay na kilos at ang “sumampalataya sa kanya” upang mapanatili ang relasyonal na puwersa ng parirala sa Griyego.
