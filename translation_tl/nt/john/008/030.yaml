  text: As he was saying these things[b][a], many believed in him.
translation:
  language: tl
  text: Habang sinasabi niya ang mga ito,[a] marami ang sumampalataya sa kanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Habang nagsasalita siya ng mga ito.”
