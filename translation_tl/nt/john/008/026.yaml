id: JHN.8.26
reference: John 8:26
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πολλὰ ἔχω περὶ ὑμῶν λαλεῖν καὶ κρίνειν· ἀλλ’ ὁ πέμψας με ἀληθής ἐστιν, κἀγὼ ἃ ἤκουσα παρ’ αὐτοῦ ταῦτα ⸀λαλῶ εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/026.yaml
  text: I have many things to say and to judge concerning you[a]. But the one who sent me is true, and what I heard from him[b], these things I speak to the world.
translation:
  language: tl
  text: Marami pa akong masasabi at hahatulan tungkol sa inyo.[a] Ngunit ang nagsugo sa akin ay tunay, at ang mga narinig ko mula sa kanya—ang mga ito ang sinasabi ko sa sanlibutan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hinggil sa inyo.”
    reason: lexical_alternative
  - marker: b
    text: Tahasang inuulit sa Griyego ang demonstratibong “ang mga ito” upang bigyang-diin ang mga narinig niya mula sa nagsugo sa kanya.
    reason: source_emphasis
lexical_decisions:
- source_word: πολλὰ
  choice: marami
  rationale: Ang pang-uring neutral na maramihan ay ginagamit bilang pangngalan; sa Filipino, likas na ipinahihiwatig ng “marami” ang “maraming bagay” nang hindi nagiging mabigat ang pahayag.
- source_word: περὶ ὑμῶν
  choice: tungkol sa inyo
  rationale: Tinutukoy ng περί na may genitive ang paksa o tinutukoy; ang “tungkol sa inyo” ay natural at malinaw sa modernong Filipino.
- source_word: λαλεῖν
  choice: masasabi
  rationale: Ang “masasabi” ay likas na katambal ng “maihahatol” at pinananatili ang diwa ng pagkakaroon ng maraming bagay na maaaring sabihin.
- source_word: κρίνειν
  choice: maihahatol
  rationale: Pinananatili nito ang malawak na saklaw ng κρίνω bilang paghatol, nang hindi ito pinakikitid sa tahasang pagkondena.
- source_word: ὁ πέμψας με
  choice: ang nagsugo sa akin
  rationale: Natural na isinasalin ang articular participle bilang pariralang tumutukoy sa isang persona, nang hindi idinaragdag ang “Ama,” na wala sa mismong sugnay.
- source_word: ἀληθής
  choice: tunay
  rationale: Pinananatili ng “tunay” ang posibleng saklaw na totoo, mapagkakatiwalaan, o tunay sa pagkatao, na mahalaga sa gamit ni Juan.
- source_word: ἃ ἤκουσα παρ’ αὐτοῦ
  choice: ang mga narinig ko mula sa kanya
  rationale: Ipinahahayag nito ang maramihang nilalaman na natanggap mula sa nagsugo kay Jesus.
- source_word: ταῦτα
  choice: ang mga ito
  rationale: Hayagang pinananatili ang demonstratibong inuulit sa Griyego upang maingatan ang diin at ang pagbabalik-tukoy sa naunang sugnay.
- source_word: λαλῶ
  choice: sinasabi ko
  rationale: Ang pangkasalukuyang anyo ay likas na naipahahayag sa “sinasabi ko” at angkop sa pagpapahayag sa isang tagapakinig.
- source_word: εἰς τὸν κόσμον
  choice: sa sanlibutan
  rationale: Sa pandiwa ng pagsasalita, ang εἰς ay tumutukoy sa direksiyon o tagapakinig; ang “sa sanlibutan” ay natural at pinananatili ang terminolohiyang Juanino.
theological_decisions:
- issue: Tinutukoy ng “ang nagsugo sa akin”
  choice: Pinanatiling di-tahasang pagtukoy sa Ama sa pamamagitan ng “ang nagsugo sa akin.”
  alternative: “Ngunit ang Ama na nagsugo sa akin ay tunay.”
  rationale: Malinaw sa konteksto ni Juan na ang Ama ang tinutukoy, ngunit hindi siya tahasang pinangalanan sa Griyegong sugnay; iniiwasan ng salin ang pagdaragdag.
- issue: Lakas ng kahulugan ng κρίνειν
  choice: Isinalin bilang “maihahatol,” na may malawak na diwa ng paghatol.
  alternative: “maikokondena” o “mapaparusahan”
  rationale: Hindi hinihingi ng konteksto na limitahan ang κρίνω sa pagkondena; pinananatili ang tunay na lawak at tensiyong teolohikal ng salita.
- issue: Kahulugan ng ἀληθής
  choice: Isinalin bilang “tunay.”
  alternative: “mapagkakatiwalaan” o “nagsasabi ng totoo”
  rationale: Hindi tahasang nilulutas kung ang diin ay nasa pagiging totoo, tunay, o mapagkakatiwalaan ng nagsugo.
translation_notes:
  register: Modernong Filipino na may marangal ngunit madaling maunawaang tono. Ginamit ang “sanlibutan” upang mapanatili ang matatag na terminolohiyang Juanino para sa κόσμος; iniwasan ang arkaikong ayos at ang pagdaragdag ng referent na hindi tahasang nasa teksto.
