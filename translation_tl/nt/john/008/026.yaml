  naturalness: Marangal at nauunawaan ang rehistro. Mas natural at mas tuwiran sa modernong Filipino ang “hahatulan” para sa aktibong pandiwang may si Jesus bilang gumaganap. Ang “sanlibutan” ay katanggap-tanggap at angkop sa terminolohiyang Juanino.
  terminology: Ang “nagsugo sa akin,” “tunay,” at “sanlibutan” ay mabubuting katumbas at hindi nagdaragdag ng ipinahihiwatig na doktrina. Ang “hahatulan” ay pinananatiling mas malawak kaysa “kokondenahin,” kaya hindi nito nililimitahan ang κρίνειν sa pagkondena.
