  source_fidelity: Tumpak na naihahatid ng draft ang pagtawag na “Guro,” ang pagkakahuli sa babae, at ang kasalanang tinutukoy. Gayunman, ang “nahuling aktuwal na nangangalunya” ay hindi ang pinakalinaw o pinakanatural na paraan upang ipahayag ang idiomatikong ἐπαυτοφώρῳ μοιχευομένη, na mariing tumutukoy sa pagkakahuli habang nagaganap mismo ang pangangalunya.
  naturalness: Ang “aktuwal na nangangalunya” ay medyo pilit sa modernong Tagalog at maaaring magmukhang simpleng paglalarawan sa babae kaysa sa paraan ng pagkakahuli. Ang “sa mismong akto ng pangangalunya” ay malinaw, marangal, at malapit sa diin ng Griyego.
  terminology: Ang “Guro” para sa Διδάσκαλε at “pangangalunya” para sa μοιχεύω ay angkop sa rehistro at tumpak. Ang tala tungkol sa tekstuwal na katayuan ng salaysay ay dapat manatili at ang marker ay maayos na nakaangkla sa talata.
