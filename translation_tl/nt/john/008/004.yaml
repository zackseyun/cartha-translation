lexical_decisions:
- source_word: λέγουσιν
  choice: Sinabi
  rationale: Ang pangkasaysayang pangkasalukuyan sa salaysay na Griyego ay isinalin sa likas na pangnagdaan sa Tagalog.
- source_word: κατείληπται
  choice: ay nahuli
  rationale: Ipinahahayag ng perpektong balintiyak ang pagkakahuling naganap na at may bisa pa sa kasalukuyang sitwasyon; natural itong maipahihiwatig sa Tagalog sa “nahuli.”
- source_word: ἐπαυτοφώρῳ
  choice: aktuwal na
  rationale: Inihahatid nito ang idyomatikong diwa na nahuli siya habang mismong ginagawa ang ipinaparatang, nang hindi gumagamit ng mas kolokyal na “huling-huli.”
- source_word: μοιχευομένη
  choice: nangangalunya
  rationale: Ang pangkasalukuyang participle ay tumutukoy sa ginagawa ng babae nang siya ay mahuli; ang “nangangalunya” ay tuwiran at natural na katumbas.
