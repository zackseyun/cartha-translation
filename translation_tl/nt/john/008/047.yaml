base_translation:
  language: en
  yaml_path: translation/nt/john/008/047.yaml
  text: The one who is from God hears the words of God[a]. For this reason you do not hear[b], because you are not from God.
translation:
  language: tl
  text: Ang taong mula sa Diyos ay nakikinig sa mga salita ng Diyos. Ito ang dahilan kung bakit hindi kayo nakikinig, sapagkat[a] hindi kayo mula sa Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring unawain ang huling bahagi: “Ito ang dahilan kung bakit hindi kayo nakikinig na hindi kayo mula sa Diyos.” Ang salitang Griyego na ὅτι ay maaari ring mangahulugang “na,” ngunit mas angkop sa konteksto ang pansanhing “sapagkat.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ὢν
  choice: ang nagmumula
  rationale: Sa ugnayan nito sa ἐκ τοῦ θεοῦ, likas sa Filipino ang “ang nagmumula sa Diyos” at naipapahayag nito ang isang taong kinakatawan ang isang uri o pangkat.
- source_word: ἐκ τοῦ θεοῦ
  choice: mula sa Diyos / nagmumula sa Diyos
  rationale: Ang ἐκ ay nagpapahiwatig ng pinagmulan. Mas malinaw at natural sa modernong Filipino ang “mula sa Diyos” kaysa “sa Diyos,” na maaaring magpahiwatig lamang ng pag-aari.
- source_word: τὰ ῥήματα τοῦ θεοῦ
  choice: mga salita ng Diyos
  rationale: Pinananatili nito ang kongkretong maramihan ng ῥήματα at ang marangal ngunit karaniwang pananalita.
- source_word: ἀκούει / ἀκούετε
  choice: nakikinig / nakikinig
  rationale: Sa konteksto, higit ito sa pisikal na pagkarinig at may diwang tumatanggap o nagbibigay-pansin. Ang “nakikinig” ay natural sa Filipino at pinananatili ang pag-uulit nang hindi tahasang ginagawang “sumusunod.”
- source_word: διὰ τοῦτο
  choice: kaya
  rationale: Maikli at natural na ipinahahayag ng “kaya” ang lohikal na kaugnayan sa kasunod na paliwanag.
- source_word: ὅτι
  choice: sapagkat
  rationale: 'Pinakamalamang na sanhi ang gamit dito: hindi sila nakikinig dahil hindi sila nagmumula sa Diyos. Pinananatili sa talababa ang posibleng pagbasa na deklaratibo.'
theological_decisions:
- issue: Kahulugan ng pagiging ἐκ τοῦ θεοῦ
  choice: nagmula/nagmumula sa Diyos
  alternative: nabibilang sa Diyos; ipinanganak ng Diyos
  rationale: Pinananatili ang wika ng pinagmulan nang hindi ito nililimitahan sa isang mas huling sistematikong kategorya gaya ng pagkahirang, muling kapanganakan, o pagiging kabilang sa tipan.
- issue: Lakas ng ἀκούω
  choice: nakikinig
  alternative: nakaririnig; sumusunod
  rationale: Maaaring saklawin ng konteksto ang pagtanggap at pagtugon, ngunit hindi tahasang “sumunod” ang pandiwa. Ang “nakikinig” ay nagpapanatili ng pahiwatig nang hindi nilulutas ang teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino na malinaw, natural, at marangal. Ginamit ang “nakikinig” upang maipahiwatig ang mapagtanggap na pagdinig nang hindi tahasang isinasalin bilang pagsunod. Ang “nagmula/nagmumula sa Diyos” ay nagpapanatili sa diin ng Griyego sa pinagmulan.
