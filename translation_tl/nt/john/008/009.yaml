  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: robinson-pierpont-2005-byzantine
  text: Οἱ δὲ ἀκούσαντες, καὶ ὑπὸ τῆς συνειδήσεως ἐλεγχόμενοι, ἐξήρχοντο εἷς καθ' εἷς, ἀρξάμενοι ἀπὸ τῶν πρεσβυτέρων ἕως τῶν ἐσχάτων· καὶ κατελείφθη μόνος ὁ Ἰησοῦς, καὶ ἡ γυνὴ ἐν μέσῳ ἑστῶσα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/009.yaml
  text: But those[a] who heard it, being convicted by their conscience, went out one by one, beginning with the older ones down to the last. And Jesus was left alone, with the woman standing in the midst.
translation:
  language: tl
  text: Ngunit nang marinig nila iyon at sinusumbatan sila ng kanilang budhi, isa-isa silang umalis, simula sa mga nakatatanda hanggang sa pinakahuli. Si Jesus na lamang ang naiwan, at ang babae ay nakatayo sa gitna.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang talatang ito ay bahagi ng salaysay tungkol sa babaeng nahuling nangangalunya (Juan 7:53–8:11). Tingnan ang talababa sa Juan 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: συνείδησις
  choice: budhi
  rationale: Ang “budhi” ang likas at karaniwang katumbas sa modernong Tagalog para sa panloob na kamalayang moral na kumikilala sa tama at mali.
- source_word: ἐλέγχω
  choice: sinusumbatan
  rationale: Sa anyong pasibo at sa kontekstong ito, inilalarawan nito ang panloob na pagkilala sa pagkakasala. Ang “sinusumbatan” ay natural sa pariralang “sinusumbatan ng budhi” at hindi nagdaragdag ng panlabas na tagahatol.
- source_word: πρεσβύτερος
  choice: matatanda
  rationale: Dito ay pinakamalamang na tumutukoy sa mga nakatatanda sa edad o ranggo sa pangkat, hindi sa pormal na katungkulan ng mga “matandang pinuno.”
- source_word: ἔσχατος
  choice: pinakahuli
  rationale: Pinananatili nito ang di-tiyak na kahulugan ng dulo ng sunod-sunod na pag-alis, sa halip na tahasang ipakahulugang “mga pinakabata.”
- source_word: ἐν μέσῳ
  choice: sa gitna
  rationale: Tuwirang pinananatili ang lokasyong ipinahihiwatig ng Griyego nang hindi tinutukoy kung kanino o saan siya nasa gitna.
theological_decisions:
- issue: Ang kahulugan ng μόνος habang naroon pa ang babae
  choice: “Si Jesus na lamang ang naiwan, at ang babae ay nakatayo sa gitna”
  alternative: “Naiwang mag-isa si Jesus kasama ang babae”
  rationale: 'Pinananatili ng salin ang bahagyang tensiyon sa pahayag: si Jesus ang tanging naiwan mula sa mga humaharap o umaakusa, bagaman naroon pa ang babae. Hindi nito nilulutas nang higit sa sinasabi ng teksto ang ugnayan ng dalawang sugnay.'
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “sinusumbatan ng kanilang budhi” bilang natural na pagpapahayag ng panloob na pagkilala sa pagkakasala. Inilagay ang panandang [a] sa hulihan ng talata upang matukoy ang buong talata bilang pagpapatuloy ng bahaging may usaping tekstuwal.
