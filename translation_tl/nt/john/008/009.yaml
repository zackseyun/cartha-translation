  - severity: low
    issue: Maaaring maunawaan ang "matatanda" bilang pangkalahatang matatandang tao.
    rationale: Bagaman hindi mali, ang "mga nakatatanda" ay mas malinaw na naghahayag ng paghahambing sa edad o senyoridad sa loob ng pangkat at hindi nagmumungkahi ng pormal na katungkulan.
