revisions:
- from: Ngunit nang marinig nila iyon, at dahil sinusumbatan sila ng kanilang budhi, isa-isa silang lumabas, simula sa matatanda hanggang sa pinakahuli. Si Jesus na lamang ang naiwan, at ang babae ay nakatayo sa gitna.[a]
  to: Ngunit nang marinig nila iyon at sinusumbatan sila ng kanilang budhi, isa-isa silang umalis, simula sa mga nakatatanda hanggang sa pinakahuli. Si Jesus na lamang ang naiwan, at ang babae ay nakatayo sa gitna.[a]
  rationale: Inayos ang pagkakaugnay ng "nang marinig" at ng patuloy na pagsumbat ng budhi upang maging mas natural sa Tagalog, nang hindi binabago ang sanhi o aspekto ng Griyego. Pinalitan ang "matatanda" ng "mga nakatatanda" upang malinaw na edad o senyoridad ang tinutukoy. Pinanatili ang bahagyang tensiyon ng "Si Jesus na lamang ang naiwan" kasunod ng pagbanggit na naroon pa rin ang babae, gaya ng pagkakasunod ng Griyego.
  reviewer_model: gpt-5.6-terra
