  text: εἶπον οὖν ὑμῖν ὅτι ἀποθανεῖσθε ἐν ταῖς ἁμαρτίαις ὑμῶν· ἐὰν γὰρ μὴ πιστεύσητε ὅτι ἐγώ εἰμι, ἀποθανεῖσθε ἐν ταῖς ἁμαρτίαις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/024.yaml
  text: So I told you that you will die in your sins. For unless you believe that I am[a], you will die in your sins.
translation:
  language: tl
  text: Kaya sinabi ko sa inyo na mamamatay kayo sa inyong mga kasalanan. Sapagkat kung hindi kayo maniniwalang ako nga[a], mamamatay kayo sa inyong mga kasalanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “ako ay,” na walang kasunod na tahasang panaguri. Walang tahasang panaguri pagkatapos ng “ἐγώ εἰμι” sa Griyego, at maaaring may mas malalim na alingawngaw ang pananalitang ito sa Ebanghelyo ni Juan.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπον οὖν ὑμῖν
  choice: Kaya sinabi ko sa inyo
  rationale: Ang οὖν ay nag-uugnay sa naunang pangangatwiran at natural na naipapahayag bilang “Kaya”; tuwirang isinasalin ng “sinabi ko sa inyo” ang εἶπον ... ὑμῖν.
- source_word: ἀποθανεῖσθε
  choice: mamamatay kayo
  rationale: Tuwirang ipinahahayag ang panghinaharap na anyo ng ἀποθνῄσκω nang hindi dinaragdagan ng interpretasyong gaya ng “mapapahamak.”
- source_word: ἐν ταῖς ἁμαρτίαις ὑμῶν
  choice: sa inyong mga kasalanan
  rationale: Pinananatili ang maramihang ἁμαρτίαις at ang diwa ng ἐν bilang kalagayan o saklaw kung saan sila mamamatay.
- source_word: ἐὰν γὰρ μὴ
  choice: Sapagkat kung hindi
  rationale: Pinananatili ng “Sapagkat” ang pagbibigay-katwiran ng γάρ, at ng “kung hindi” ang negatibong kondisyon ng ἐὰν μή.
- source_word: πιστεύσητε
  choice: maniniwala
  rationale: Karaniwan at malinaw na katumbas ng πιστεύω sa kontekstong Juanino; maaari itong magtaglay ng diwa ng pagtitiwala nang hindi iyon ipinipilit sa salita.
- source_word: ὅτι ἐγώ εἰμι
  choice: na Ako Nga
  rationale: Walang tahasang panaguri pagkatapos ng ἐγώ εἰμι. Ang “Ako Nga” ay likas na pahayag ng pagkakakilanlan sa Filipino at hindi nagdaragdag ng tiyak na pangngalan o titulo; inilalahad sa talababa ang mas literal na anyo.
theological_decisions:
- issue: Ang pahayag na ἐγώ εἰμι na walang tahasang panaguri
  choice: Ako Nga
  alternative: Ako ay
  rationale: Maaaring marinig ang parirala bilang mariing pagpapakilala sa sarili at maaari ring magkaroon ng mas malalim na alingawngaw sa Ebanghelyo ni Juan. Iniiwasan ng pangunahing salin ang pagdaragdag ng “siya” o ng isang tiyak na titulo, samantalang pinananatili ng talababa ang anyong mas malapit sa estruktura ng Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mamamatay kayo sa inyong mga kasalanan” upang mapanatili ang pag-uulit at bigat ng orihinal. Ang malaking titik sa “Ako Nga” ay nagpapakita na ito ay mismong pahayag ni Jesus, hindi pagdaragdag ng isang doktrinal na titulo.
