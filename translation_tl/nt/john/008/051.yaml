  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ἐάν τις τὸν ⸂ἐμὸν λόγον⸃ τηρήσῃ, θάνατον οὐ μὴ θεωρήσῃ εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/051.yaml
  text: Truly, truly, I say to you, if anyone keeps my word, he will certainly never see death forever.
translation:
  language: tl
  text: Tunay na tunay na sinasabi ko sa inyo, kung tutuparin ng sinuman ang aking salita, hinding-hindi siya makakakita ng kamatayan kailanman.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Tunay na tunay
  rationale: Pinananatili ang mariing pag-uulit ni Jesus sa natural at marangal na Tagalog.
- source_word: τηρήσῃ
  choice: tutuparin
  rationale: Sa kontekstong ito, tumutukoy sa masunuring pag-iingat at pagsunod sa salita, hindi lamang sa pag-alala o pagtatago nito.
- source_word: τὸν ἐμὸν λόγον
  choice: ang aking salita
  rationale: Tuwirang katumbas na nagpapanatili sa isahan at sa lawak ng kahulugan ng λόγος bilang mensahe o turo ni Jesus.
- source_word: οὐ μὴ θεωρήσῃ
  choice: hinding-hindi siya makakakita
  rationale: Ang 'hinding-hindi' ay nagpapahayag ng mariing pagtanggi ng οὐ μή, habang ang 'makakakita' ay nagpapanatili sa metapora ng θεωρέω.
- source_word: εἰς τὸν αἰῶνα
  choice: magpakailanman
  rationale: Pinananatili ang tahasang pariralang pangpanahon sa Griyego sa halip na alisin bilang kalabisan.
theological_decisions:
- issue: Ang kahulugan ng 'makakakita ng kamatayan'
  choice: Pinanatili ang literal na idyomang 'makakakita ng kamatayan.'
  alternative: Hindi mamamatay kailanman.
  rationale: Hindi nilulutas ng salin kung tumutukoy ito sa pisikal na kamatayan, walang-hanggang kamatayan, o sa ultimong kapangyarihan ng kamatayan; pinananatili nito ang tensiyong nasa pahayag ni Jesus at sa kasunod na pagtutol ng mga kausap niya.
- issue: Ang puwersa ng τηρέω
  choice: tutuparin
  alternative: iingatan / susundin
  rationale: Ipinahahayag ng 'tutuparin' ang aktibong pananatili at pagsunod sa salita nang hindi nagdaragdag ng partikular na doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Pinanatili ang retorikal na pag-uulit at ang mariing dobleng pagtanggi ng orihinal.
