id: JHN.8.18
reference: John 8:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐγώ εἰμι ὁ μαρτυρῶν περὶ ἐμαυτοῦ καὶ μαρτυρεῖ περὶ ἐμοῦ ὁ πέμψας με πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/018.yaml
  text: I am the one who testifies about myself[a], and the Father who sent me testifies about me.
translation:
  language: tl
  text: Ako ang nagpapatotoo tungkol sa aking sarili,[a] at ang Ama na nagsugo sa akin ay nagpapatotoo tungkol sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “sumasaksi tungkol sa aking sarili … sumasaksi tungkol sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγώ εἰμι ὁ μαρτυρῶν
  choice: Ako ang nagpapatotoo
  rationale: Ang may artikulong pangkasalukuyang pandiwaring μαρτυρῶν ay gumaganap bilang pangngalan, ‘ang nagpapatotoo.’ Likas sa modernong Tagalog ang ‘Ako ang nagpapatotoo’ at napananatili nito ang diin sa nagsasalita.
- source_word: περὶ ἐμαυτοῦ
  choice: tungkol sa aking sarili
  rationale: Ang περί na may genitive ay likas na nangangahulugang ‘tungkol sa’ o ‘hinggil sa.’ Pinananatili ng ‘aking sarili’ ang reflexive na diwa nang hindi dinaragdagan ng interpretasyong ‘para sa aking sariling kapakanan.’
- source_word: μαρτυρεῖ
  choice: nagpapatotoo
  rationale: Ginamit ang parehong salin para sa inuulit na μαρτυρέω upang mapanatili ang legal at testimonial na ugnayan ng dalawang sugnay.
- source_word: περὶ ἐμοῦ
  choice: tungkol sa akin
  rationale: Ito ang natural at tuwirang katumbas sa modernong Tagalog ng περί na may genitive sa kontekstong ito.
- source_word: ὁ πέμψας με πατήρ
  choice: ang Ama na nagsugo sa akin
  rationale: Ang aorist participle na πέμψας ay naglalarawan sa πατήρ at natural na isinasalin bilang sugnay na ‘na nagsugo sa akin.’ Hindi idinagdag ang ‘aking’ o ‘Diyos’ dahil wala ang mga iyon sa mismong parirala.
theological_decisions:
- issue: Pagkakakilanlan ng ‘Ama’ sa kontekstong Juanino
  choice: ang Ama na nagsugo sa akin
  alternative: ang aking Ama na nagsugo sa akin; ang Diyos Ama na nagsugo sa akin
  rationale: Tahasang sinasabi ng Griyego na ‘ang Ama,’ kaya pinananatili ang relasyonal at teolohikal na pahayag nang walang paliwanag o dagdag na katawagang wala sa talata.
- issue: Legal o testimonial na diwa ng μαρτυρέω
  choice: nagpapatotoo
  alternative: sumasaksi; nagbibigay-patotoo
  rationale: Ang ‘nagpapatotoo’ ay malinaw at marangal na modernong Tagalog, at naipahihiwatig nito ang motibo ng patotoo na mahalaga sa konteksto habang pinananatili ang pag-uulit ng salitang Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang magkatulad na salin ng dalawang anyo ng μαρτυρέω at ang payak na katawagang ‘ang Ama.’
