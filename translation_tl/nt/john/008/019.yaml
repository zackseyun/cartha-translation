base_translation:
  language: en
  yaml_path: translation/nt/john/008/019.yaml
  text: So they were saying to him[a], “Where is your Father?” Jesus answered, “You know neither me nor my Father. If you knew me, you would know my Father also.”
translation:
  language: tl
  text: Kaya tinanong nila siya, “Nasaan ang iyong Ama?” Sumagot si Jesus, “Hindi ninyo ako kilala, ni ang aking Ama. Kung kilala sana ninyo ako, kilala rin sana ninyo ang aking Ama.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin nang mas tahasang nakatuon sa nakaraan: “Kung nakilala sana ninyo ako, nakilala rin sana ninyo ang aking Ama.” Ang kondisyong Griyego ay nagpapahiwatig ng kalagayang salungat sa aktuwal, ngunit hindi nito kinakailangang itakda ang panahon bilang nakaraan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: tinatanong nila
  rationale: Ang imperfect ay nagpapahiwatig ng nagpapatuloy o inuulit na pagsasalita. Dahil tanong ang tuwirang pahayag, natural sa Tagalog ang “tinatanong nila” at hindi nito labis na iginigiit ang pag-uulit gaya ng “paulit-ulit nilang tinatanong.”
- source_word: οὖν
  choice: Kaya
  rationale: Pinananatili nito ang ugnayang pangangatwiran o pagpapatuloy mula sa naunang sinabi ni Jesus, sa natural na makabagong Tagalog.
- source_word: Ποῦ ἐστιν ὁ πατήρ σου;
  choice: Nasaan ang iyong Ama?
  rationale: Tuwiran at natural na salin ng tanong. Ginamit ang malaking titik sa “Ama” dahil ang tinutukoy sa konteksto ay ang Diyos, bagaman hindi iyon nauunawaan ng mga nagtatanong.
- source_word: ἀπεκρίθη
  choice: Sumagot
  rationale: Karaniwan at tuwirang salin ng pandiwang nagsasaad ng tugon.
- source_word: Οὔτε ἐμὲ οἴδατε οὔτε τὸν πατέρα μου
  choice: Hindi ninyo ako kilala, ni ang aking Ama
  rationale: Ang “kilala” ang likas na gamit sa Tagalog kapag tao ang layon at maaari nitong saklawin ang pagkilala at personal na kaalaman. Pinananatili ng “ni” ang magkatugmang pagtanggi ng οὔτε...οὔτε.
- source_word: οἶδατε / ᾔδειτε
  choice: kilala / kilala
  rationale: Pinananatili ang leksikal na pag-uugnay sa kasalukuyang pahayag at sa kondisyunal na pangungusap. Mas angkop sa mga persona ang “kilala” kaysa “alam,” habang hindi ito nililimitahan sa intelektuwal na pagkaunawa lamang.
- source_word: εἰ ἐμὲ ᾔδειτε, καὶ τὸν πατέρα μου ἂν ᾔδειτε
  choice: Kung kilala ninyo ako, kilala rin sana ninyo ang aking Ama
  rationale: Ipinahihiwatig ng “sana” ang kondisyong salungat sa aktuwal na kalagayan, samantalang iniiwasan ng anyong ito ang hindi kinakailangang paglalagay ng pangyayari sa nakaraan. Ang “rin” ay tumutugon sa καί.
theological_decisions:
- issue: Paggamit ng malaking titik sa “Ama” kapag ang Diyos ang tinutukoy
  choice: “Ama” na may malaking titik sa buong talata
  alternative: “ama” na may maliit na titik
  rationale: Sa agarang konteksto ng Juan, ang Ama ni Jesus ay ang Diyos. Tinutulungan ng malaking titik ang makabagong mambabasa na makita ang tinutukoy nang walang idinaragdag na paliwanag sa mismong pangungusap.
- issue: Diwa ng pagkakilala kay Jesus at sa Ama
  choice: “kilala”
  alternative: “alam” o “nauunawaan”
  rationale: Pinananatili ng “kilala” ang ugnayan sa pagitan ng pagkakilala kay Jesus at pagkakilala sa Ama, nang hindi ito ipinapakahulugan bilang kaalamang intelektuwal lamang o bilang simpleng pagkaunawa.
- issue: Puwersang salungat-sa-katotohanan ng kondisyunal
  choice: Kasalukuyang di-aktuwal na kondisyon na ipinahiwatig ng “sana”
  alternative: 'Kondisyong tahasang nakatuon sa nakaraan: “Kung nakilala sana ninyo ako, nakilala rin sana ninyo ang aking Ama”'
  rationale: Ang imperfect na may ἄν ay maaaring magpahayag ng salungat-sa-katotohanang kalagayan. Mas nababagay sa konteksto ang kasalukuyang di-aktuwal na diwa at hindi nito ipinipilit ang nakaraang panahon.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “iyong” at “ninyo” bilang natural ngunit magalang na anyo; iniwasan ang labis na pormal o makalumang pananalita. Ang “tinatanong nila” ay naghahatid ng aspektong imperfect sa paraang likas sa salaysay.
