  text: Ἐν δὲ τῷ νόμῳ ἡμῶν Μωσῆς ἐνετείλατο τὰς τοιαύτας λιθοβολεῖσθαι· σὺ οὖν τί λέγεις;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/005.yaml
  text: '[A] in our law, Moses commanded that such women be stoned. So what do you say?'
translation:
  language: tl
  text: '[a] Sa kautusan natin, iniutos ni Moises na batuhin ang mga babaeng tulad nito. Kaya, ano ang sinasabi mo?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pagpapatuloy ito ng salaysay tungkol sa babaeng nahuling nangangalunya (Juan 7:53–8:11). Tingnan ang tala sa Juan 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: τοιαύτας
  choice: ang mga babaeng tulad nito
  rationale: Ang anyong pambabae at maramihan ay tumutukoy sa mga babaeng kauri ng babaeng nasa konteksto; pinananatili ng salin ang pangkalahatang anyo ng Griyego nang hindi nililimitahan sa isang babae lamang.
- source_word: λιθοβολεῖσθαι
  choice: batuhin
  rationale: Karaniwang salitang Filipino para sa paglalapat ng parusang pagbabato; sa konteksto ng kautusan, malinaw na parusang kamatayan ang tinutukoy nang hindi nagdaragdag ng mga salitang wala sa Griyego.
- source_word: ἐνετείλατο
  choice: iniutos
  rationale: Tumpak at natural na katumbas ng makapangyarihang pag-uutos na iniuugnay kay Moises.
- source_word: ἐν δὲ τῷ νόμῳ ἡμῶν
  choice: Sa kautusan natin
  rationale: Natural na Filipino para sa ‘sa ating kautusan’; hindi ginawang tahasang temporal ang δέ, na dito ay banayad na pang-ugnay.
- source_word: σὺ οὖν τί λέγεις
  choice: Kaya, ano ang masasabi mo?
  rationale: Ipinahahayag ng ‘Kaya’ ang inferensiyal na οὖν, habang ang tanong ay isinalin sa natural na makabagong Filipino; ang ‘mo’ ay nagpapanatili sa tahasang pagbibigay-diin sa σὺ.
theological_decisions:
- issue: Saklaw ng utos sa pagbabato
  choice: Hindi idinagdag ang ‘hanggang mamatay’
  alternative: ‘batuhin hanggang mamatay’
  rationale: Bagaman parusang kamatayan ang pagbabato sa kontekstong ito, sapat ang ‘batuhin’ at hindi nito pinalalawak ang mismong pananalita ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘kautusan’ para sa νόμος at ang karaniwang ‘batuhin’ para sa pagbabato bilang parusa. Ang talababa ay minarkahan sa simula ng pangunahing teksto bilang [a].
