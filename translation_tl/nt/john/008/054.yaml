  source_fidelity: Tumpak na naihahatid ng draft ang kondisyonal na pahayag, ang kawalang-kabuluhan ng sariling kaluwalhatian, ang Ama bilang lumuluwalhati kay Jesus, at ang pangunahing pagbasa ng SBLGNT na “ating Diyos.” Napananatili rin ang makabuluhang variant na “inyong Diyos” sa talababa.
  naturalness: May bahagyang pagkaipit sa “siya na sinasabi ninyong ating Diyos.” Sa modernong Tagalog, mas malinaw at likas ang buong panaguring “na sinasabi ninyong siya ang ating Diyos,” na hayagang isinasalin ang ὅτι-clause.
  terminology: Ang “niluluwalhati / kaluwalhatian / lumuluwalhati” ay angkop at magkakaugnay na pagsasalin ng δοξάζω/δόξα sa Juan. Ang “Ama” at “Diyos” ay marangal, pangkaraniwan, at hindi nagdaragdag ng doktrinal na pagpapakahulugan.
