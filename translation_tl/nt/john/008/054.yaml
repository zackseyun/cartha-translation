  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Ἐὰν ἐγὼ ⸀δοξάσω ἐμαυτόν, ἡ δόξα μου οὐδέν ἐστιν· ἔστιν ὁ πατήρ μου ὁ δοξάζων με, ὃν ὑμεῖς λέγετε ὅτι θεὸς ⸀ἡμῶν ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/john/008/054.yaml
  text: Jesus answered[a], “If I glorify myself, my glory is nothing. My Father is the one who glorifies me, he whom you say is our God,”
translation:
  language: tl
  text: Sumagot si Jesus, “Kung niluluwalhati ko ang aking sarili, walang kabuluhan ang aking kaluwalhatian. Ang aking Ama ang lumuluwalhati sa akin—siya na sinasabi ninyong siya ang ating Diyos.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang manuskrito, “inyong Diyos” sa halip na “ating Diyos.”
    reason: textual_variant
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: Sumagot
  rationale: Karaniwang natural na salaysay sa diyalogo at tumpak na katumbas ng ἀποκρίνομαι.
- source_word: δοξάσω / δοξάζων
  choice: niluluwalhati / lumuluwalhati
  rationale: Pinananatili ang temang teolohikal ng δόξα sa Juan at ang ugnayang leksikal ng pandiwa at pangngalan.
- source_word: ἡ δόξα μου οὐδέν ἐστιν
  choice: walang kabuluhan ang aking kaluwalhatian
  rationale: Natural sa modernong Tagalog at inilalahad ang idiomatikong diwa ng οὐδέν ἐστιν nang hindi ito ginagawang usapin lamang ng halaga sa salapi.
- source_word: ὁ πατήρ μου
  choice: ang aking Ama
  rationale: Tuwirang katumbas ng personal na katawagang ginagamit ni Jesus; ang malaking titik ay angkop sa banal na tinutukoy.
- source_word: ὁ δοξάζων με
  choice: ang lumuluwalhati sa akin
  rationale: Pinananatili ang articular participle bilang naglalarawang parirala at ang kasalukuyan o patuloy na puwersa nito.
- source_word: ὃν ὑμεῖς λέγετε ὅτι θεὸς ἡμῶν ἐστιν
  choice: siya na sinasabi ninyong ating Diyos
  rationale: Pinananatili ang kamag-anak na sugnay, ang tuwirang pakikipag-usap sa maramihang 'kayo,' at ang SBLGNT na ἡμῶν.
- source_word: θεὸς
  choice: Diyos
  rationale: Ang tinutukoy ay ang Diyos ng Israel, kaya ang karaniwang pangalang pantangi na 'Diyos' ang angkop.
- source_word: ἡμῶν
  choice: ating
  rationale: Sinusunod ang SBLGNT na 'atin/ating'; inilalagay sa talababa ang makabuluhang variant na ὑμῶν.
theological_decisions:
- issue: Panghalip sa θεὸς ἡμῶν/ὑμῶν ἐστιν
  choice: ating Diyos
  alternative: inyong Diyos
  rationale: Sinusunod ng pangunahing teksto ang SBLGNT na ἡμῶν. Hindi nilulutas nang palihim ang variant na ὑμῶν; malinaw itong itinatala sa talababa dahil may kabuluhan ito sa konteksto ng pagtatalo.
- issue: Pagpapanatili ng temang 'kaluwalhatian' sa Juan
  choice: niluluwalhati / kaluwalhatian / lumuluwalhati
  alternative: pinararangalan / karangalan
  rationale: Ang ugat na 'luwalhati' ay mas mahusay na nagpapanatili sa magkakaugnay na δοξάζω at δόξα at sa mas malawak na tema ng Ebanghelyo, nang hindi nagdaragdag ng denominasyonal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang 'aking sarili' at 'aking Ama' para sa malinaw at dignified na himig. Inilagay ang tanging talababa sa mismong variant na tinutukoy nito.
