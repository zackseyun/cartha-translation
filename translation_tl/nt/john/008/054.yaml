  to: Sumagot si Jesus, “Kung niluluwalhati ko ang aking sarili, walang kabuluhan ang aking kaluwalhatian. Ang aking Ama ang lumuluwalhati sa akin—siya na sinasabi ninyong siya ang ating Diyos.[a]”
