  naturalness: Natural at marangal ang pangungusap. Ang paglipat sa “At maging sa inyong kautusan ay nasusulat na” ay mas malinaw na nagpapahiwatig ng banayad na diin ng καὶ ... δέ nang hindi nagiging mabigat.
  terminology: Ang “kautusan,” “patotoo,” at “totoo” ay angkop. “Dalawang tao” ang mas tumpak at likas na salin ng ἀνθρώπων; ang “dalawang lalaki” ay maaaring ilagay bilang alternatibong mas tradisyonal na pagbasa, hindi bilang literal na kahulugan ng Griyego.
