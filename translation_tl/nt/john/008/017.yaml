  text: καὶ ἐν τῷ νόμῳ δὲ τῷ ὑμετέρῳ γέγραπται ὅτι δύο ἀνθρώπων ἡ μαρτυρία ἀληθής ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/017.yaml
  text: And even in your law it is written that the testimony of two men is true[a].
translation:
  language: tl
  text: At maging sa inyong kautusan ay nasusulat na ang patotoo ng dalawang tao ay totoo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang patotoo ng dalawang lalaki ay totoo.” Ang salitang Griyego ay maaaring tumukoy sa mga tao sa pangkalahatan; sa kontekstong legal, mga saksi ang tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμῳ
  choice: kautusan
  rationale: Tumutukoy rito sa legal at kasulatang batayang pinanghahawakan ng mga kausap ni Jesus. Ang maliit na titik at karaniwang salitang “kautusan” ay nagpapanatili sa agarang diwang legal nang hindi nililimitahan ang sanggunian sa isang pormal na pamagat lamang.
- source_word: ὑμετέρῳ
  choice: inyong
  rationale: Tuwirang pinananatili ang panghalip na paari at ang retorikal na paglayo ni Jesus sa mga kausap niya, nang hindi dinaragdagan ng mas matinding “inyong sariling.”
- source_word: γέγραπται
  choice: nasusulat
  rationale: Likas at marangal na pormulang Filipino para sa pamantayang pahayag na tumutukoy sa Kasulatan; ipinahihiwatig din nito na nananatiling nakasulat at may bisa ang sinabi.
- source_word: δύο ἀνθρώπων
  choice: dalawang lalaki
  rationale: Pinananatili ang tahasang anyong panlalaki ng Griyego at ang kumbensiyonal na pananalitang legal, habang nililinaw sa talababa na maaari itong tumukoy nang mas malawak sa dalawang tao bilang mga saksi.
- source_word: μαρτυρία
  choice: patotoo
  rationale: Ang “patotoo” ang natural na terminong Filipino para sa juridikal na testimony at maayos na kaugnay ng pariralang “ng dalawang lalaki.”
- source_word: ἀληθής
  choice: totoo
  rationale: Tuwirang inililipat ang pangunahing kahulugan ng ἀληθής. Nananatiling implicit ang kaakibat nitong diwang legal na balido o mapananaligan.
- source_word: καὶ ... δὲ
  choice: At ... din
  rationale: Natural na ipinapahayag sa Filipino ang pag-uugnay at banayad na pagdidiin ng mga partikulang Griyego nang hindi pinatitindi nang labis.
theological_decisions:
- issue: Retorikal na puwersa ng “inyong kautusan”
  choice: Panatilihin ang “inyong kautusan” bilang tuwirang pahayag ni Jesus sa mga kausap niya.
  alternative: “ang kautusan” o “inyong sariling kautusan”
  rationale: Tahasan sa Griyego ang panghalip na nasa ikalawang panauhan. Pinananatili nito ang tensiyong retorikal nang hindi ipinahihiwatig na itinatakwil ni Jesus ang kautusan o pinalalakas ang tono nang lampas sa teksto.
- issue: Paglilipat ng ἀνθρώπων sa kasabihang legal
  choice: Gamitin ang “dalawang lalaki” sa pangunahing teksto.
  alternative: “dalawang tao”
  rationale: Pinananatili ng pangunahing teksto ang anyong panlalaki at tradisyonal na pormulang legal ng pinagmulan. Inilalahad sa talababa ang mas malawak na representatibong kahulugan upang hindi ito awtomatikong maunawaang eksklusibo sa kasarian.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nasusulat” bilang natural na pormulang pansipi sa Kasulatan at “kautusan” upang mapanatili ang legal at kasulatang diwa. Ang marker na [a] ay nakalagay sa pangunahing teksto.
