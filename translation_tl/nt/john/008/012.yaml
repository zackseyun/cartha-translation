id: JHN.8.12
reference: John 8:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Πάλιν οὖν αὐτοῖς ⸂ἐλάλησεν ὁ Ἰησοῦς⸃ λέγων· Ἐγώ εἰμι τὸ φῶς τοῦ κόσμου· ὁ ἀκολουθῶν ⸀ἐμοὶ οὐ μὴ περιπατήσῃ ἐν τῇ σκοτίᾳ, ἀλλ’ ἕξει τὸ φῶς τῆς ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/012.yaml
  text: So Jesus spoke to them again[a], saying, “I am the light of the world. The one who follows me will certainly not walk in the darkness[b], but will have the light of life.”
translation:
  language: tl
  text: Kaya muling nagsalita sa kanila si Jesus. Sinabi niya, “Ako ang ilaw ng sanlibutan. Ang sumusunod sa akin ay hinding-hindi lalakad sa kadiliman[a], kundi magkakaroon ng ilaw ng buhay[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “tiyak na hindi lalakad sa kadiliman.” Gumagamit ang Griyego ng mariing pagtanggi (οὐ μή).'
    reason: lexical_alternative
  - marker: b
    text: Ang “ilaw ng buhay” ay maaari ring unawain bilang “ilaw na nagbibigay-buhay.”
    reason: alternative_reading
lexical_decisions:
- source_word: Πάλιν οὖν
  choice: Kaya muling
  rationale: Ipinapakita ng “muling” ang pag-uulit ng pagsasalita, samantalang pinananatili ng “kaya” ang banayad na ugnayang pandiskurso ng οὖν nang hindi ito ginagawang labis na lohikal.
- source_word: ἐλάλησεν ... λέγων
  choice: nagsalita ... Sinabi niya
  rationale: Natural sa makabagong Tagalog ang paghahati sa dalawang pangungusap; naipapahayag nito kapwa ang kilos ng pagsasalita at ang pagpapakilala sa tuwirang sinabi.
- source_word: Ἐγώ εἰμι
  choice: Ako ang
  rationale: Ito ang natural na Tagalog na anyo ng copular na pahayag na may panaguring “ilaw ng sanlibutan,” nang hindi nagdaragdag ng di-tiyak na teolohikal na diin.
- source_word: τὸ φῶς τοῦ κόσμου
  choice: ang ilaw ng sanlibutan
  rationale: Ang “ilaw” ay tuwirang katumbas ng φῶς, at ang “sanlibutan” ay angkop sa malawak na Johannine na gamit ng κόσμος para sa daigdig ng sangkatauhan.
- source_word: ὁ ἀκολουθῶν ἐμοὶ
  choice: Ang sumusunod sa akin
  rationale: Pinananatili nito ang pangkalahatang isahang diwa ng articular participle at likas itong pakinggan sa Tagalog.
- source_word: οὐ μὴ περιπατήσῃ
  choice: hinding-hindi lalakad
  rationale: Ipinahahayag ng “hinding-hindi” ang mariing pagtanggi ng οὐ μή, habang pinananatili ng “lalakad” ang talinghaga ng περιπατέω.
- source_word: ἐν τῇ σκοτίᾳ
  choice: sa kadiliman
  rationale: Natural at marangal itong salin at pinananatili ang larawan ng kadiliman bilang kalagayan o nasasakupan.
- source_word: ἕξει
  choice: magkakaroon
  rationale: Karaniwang katumbas ito ng panghinaharap na ἕξει at malinaw sa modernong Tagalog.
- source_word: τὸ φῶς τῆς ζωῆς
  choice: ang ilaw ng buhay
  rationale: Pinananatili ng literal na parirala ang siksik at bukás na ugnayan ng genitive—maaaring ilaw na kaugnay ng buhay o ilaw na nagbibigay-buhay.
theological_decisions:
- issue: Diwa ng pagpapakilala ni Jesus sa Ἐγώ εἰμι
  choice: Isinalin bilang “Ako ang” sa loob ng pahayag na “Ako ang ilaw ng sanlibutan.”
  alternative: Lagyan ng dagdag na diin upang ipahiwatig ang posibleng alusyon sa banal na pangalan.
  rationale: May tahasang panaguri rito ang Ἐγώ εἰμι, kaya nararapat sundin ang payak na sintaks at huwag ipilit sa salin ang isang posibleng mas malawak na alusyong teolohikal.
- issue: Kahulugan ng “ilaw ng buhay”
  choice: Pinanatili ang “ilaw ng buhay.”
  alternative: “ilaw na nagbibigay-buhay”
  rationale: Hindi tiyak ang eksaktong relasyon ng τῆς ζωῆς sa φῶς. Pinananatili ng literal na anyo ang tunay na teolohikal na lawak at hindi ito nililimitahan sa iisang paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino Tagalog. Pinanatili ang mga pangunahing talinghagang “ilaw,” “lalakad,” at “kadiliman,” pati ang sadyang bukás na diwa ng “ilaw ng buhay.”
