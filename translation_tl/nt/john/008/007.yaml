  terminology: Ang “walang kasalanan,” “tumindig,” at “bumato sa kaniya” ay angkop at hindi nagpapataw ng interpretasyong doktrinal. Ang talababa ay tumpak na nagsasaad ng tekstuwal na kalagayan ng buong salaysay.
