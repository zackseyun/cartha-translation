  yaml_path: translation/nt/john/008/007.yaml
  text: But when[a] they continued questioning him, he straightened up and said to them, "Let the one among you who is without sin be the first to throw a stone at her."
translation:
  language: tl
  text: Ngunit nang patuloy nila siyang tanungin,[a] tumindig siya at sinabi sa kanila, “Ang sinuman sa inyo na walang kasalanan ang siyang unang bumato sa kaniya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang talatang ito ay bahagi ng salaysay tungkol sa babaeng nahuling nangangalunya (Juan 7:53–8:11), na wala sa pinakamaagang mga manuskritong Griyego. Tingnan ang tala sa Juan 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: ἐπέμενον ἐρωτῶντες
  choice: patuloy nila siyang tinatanong
  rationale: Ipinahahayag ng imperpektong ἐπέμενον kasama ng kasalukuyang participle na ἐρωτῶντες ang nagpapatuloy at mapilit na pagtatanong.
- source_word: ἀνακύψας
  choice: tumindig siya
  rationale: Tumutukoy ito sa pag-angat ni Jesus mula sa pagkakayuko niya upang sumulat sa lupa; natural at malinaw sa Filipino ang “tumindig” sa kontekstong ito.
- source_word: ἀναμάρτητος
  choice: walang kasalanan
  rationale: Pinananatili nito ang malawak na moral at posibleng legal na bigat ng pambihirang pang-uri, nang hindi nililimitahan sa kawalan lamang ng sala sa partikular na kaso.
- source_word: πρῶτος ... τὸν λίθον βαλέτω
  choice: ang siyang unang bumato
  rationale: Natural na Filipino para sa utos na ang taong walang kasalanan ang maunang maghagis ng bato; pinananatili ang diin sa “unang.”
theological_decisions:
- issue: Saklaw ng “walang kasalanan”
  choice: Pinanatili ang pangkalahatang pahayag na “walang kasalanan.”
  alternative: “Hindi nagkasala sa ganitong bagay” o “walang sala sa kasong ito.”
  rationale: Hindi espesipikong nililimitahan ng Griyegong ἀναμάρτητος ang kasalanan sa pangangalunya o sa kasong ito, kaya hindi dapat paliitin ng salin ang tunay na lawak at tensiyon ng pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sa kaniya” sa halip na mas kolokyal na “sa kanya,” at iniwasan ang teknikal o denominasyonal na pananalita.
