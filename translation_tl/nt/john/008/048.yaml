  text: ⸀Ἀπεκρίθησαν οἱ Ἰουδαῖοι καὶ εἶπαν αὐτῷ· Οὐ καλῶς λέγομεν ἡμεῖς ὅτι Σαμαρίτης εἶ σὺ καὶ δαιμόνιον ἔχεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/048.yaml
  text: The Jews answered and said to him[c][b][a], “Are we not right in saying that you are a Samaritan and have a demon?”
translation:
  language: tl
  text: Sumagot ang mga Judio[a] at sinabi sa kanya, “Hindi ba tama ang sinasabi namin[b] na isa kang Samaritano at mayroon kang demonyo[c]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga taga-Judea” o, sa ilang konteksto, “mga pinunong Judio.” Sa Juan, ang “mga Judio” ay madalas tumutukoy sa isang partikular na pangkat na sumasalungat kay Jesus, hindi sa bawat Judiong tao.
    reason: alternative_reading
  - marker: b
    text: O “Hindi ba kami nagsasalita nang tama…?”
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “mayroon kang demonyo”; isinasalin ito ng ilan bilang “sinasapian ka ng demonyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπεκρίθησαν
  choice: Sumagot
  rationale: Ang anyong deponent na aorist ay karaniwang nangangahulugang ‘sumagot’; likas ito sa salaysay at pinananatili ang kilos na hiwalay sa kasunod na ‘sinabi.’
- source_word: οἱ Ἰουδαῖοι
  choice: ang mga Judio
  rationale: Ito ang tuwirang katumbas ng pariralang Griyego. Hindi tahasang nililimitahan ng salita ang tinutukoy sa mga pinuno lamang o sa lahat ng Judio, kaya pinananatili sa talababa ang kontekstuwal na paglilinaw.
- source_word: εἶπαν αὐτῷ
  choice: sinabi sa kanya
  rationale: Pinananatili ang dalawang pandiwang nasa Griyego—‘sumagot’ at ‘sinabi’—kahit bahagyang paulit-ulit, sapagkat likas din itong paraan ng pagsasalaysay sa Bibliya.
- source_word: Οὐ καλῶς λέγομεν ἡμεῖς
  choice: Hindi ba tama ang sinasabi namin
  rationale: Ang tanong na may Οὐ ay umaasang sasang-ayon ang kausap. Ang ‘Hindi ba tama…’ ay natural na makabagong Filipino at pinananatili ang retorikal na diin.
- source_word: Σαμαρίτης
  choice: isang Samaritano
  rationale: Tuwirang katawagang etniko at panrelihiyon na ginagamit dito bilang panlalait; kailangan ang ‘isang’ sa natural na panaguring Filipino.
- source_word: δαιμόνιον ἔχεις
  choice: mayroon kang demonyo
  rationale: Malapit ito sa literal na ‘mayroon kang demonyo’ at hindi agad ipinapakahulugan bilang ‘sinasapian,’ na maaaring magdagdag ng mas tiyak na ideya kaysa sa Griyego.
theological_decisions:
- issue: Ang tinutukoy ng οἱ Ἰουδαῖοι sa Ebanghelyo ni Juan
  choice: ang mga Judio
  alternative: ang mga taga-Judea; ang mga pinunong Judio
  rationale: Sinusunod ng pangunahing teksto ang malawak ngunit di-tiyak na katawagang Griyego at hindi ito pinakikitid nang walang tahasang batayan. Nililinaw ng talababa na sa konteksto ni Juan, madalas itong tumukoy sa isang partikular na pangkat na sumasalungat kay Jesus, hindi sa bawat Judio.
- issue: Kahulugan ng δαιμόνιον ἔχεις
  choice: mayroon kang demonyo
  alternative: sinasapian ka ng demonyo
  rationale: Pinananatili ang konkretong idyoma ng Griyego at ang posibleng lawak ng kahulugan nito sa halip na agad tukuyin ang eksaktong uri ng impluwensiya o pagsapi.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang bahagyang pag-uulit ng ‘sumagot… at sinabi’ upang tapat na maipakita ang estilo ng Griyego. Ginamit ang karaniwang katawagang ‘Judio,’ ‘Samaritano,’ at ‘demonyo.’
