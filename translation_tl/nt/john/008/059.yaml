id: JHN.8.59
reference: John 8:59
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἦραν οὖν λίθους ἵνα βάλωσιν ἐπ’ αὐτόν· Ἰησοῦς δὲ ἐκρύβη καὶ ἐξῆλθεν ἐκ τοῦ ⸀ἱεροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/059.yaml
  text: So they picked up stones to throw at him[a], but Jesus hid himself and went out of the temple.
translation:
  language: tl
  text: Kaya dumampot sila ng mga bato upang ipukol sa kanya. Ngunit nagtago si Jesus at lumabas sa templo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas tiyak, “mula sa bakuran ng templo.” Ang salitang Griyego na ἱερόν ay tumutukoy sa buong kompleks o mga looban ng templo, hindi lamang sa panloob na santuwaryo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦραν
  choice: dumampot
  rationale: Sa kontekstong ito, ang αἴρω ay tumutukoy sa pagkuha ng mga bato upang gamitin laban kay Jesus. Ang “dumampot” ay natural sa makabagong Tagalog at malinaw na nagpapahiwatig na kinuha nila ang mga bato mula sa malapit.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinakikita ng οὖν na ang kilos nila ay bunga ng naunang sinabi ni Jesus. Likas at malinaw na pang-ugnay sa Tagalog ang “Kaya.”
- source_word: λίθους
  choice: mga bato
  rationale: Karaniwang katumbas ito ng λίθους at angkop sa tangkang pagbato kay Jesus.
- source_word: ἵνα βάλωσιν ἐπ’ αὐτόν
  choice: upang ipukol sa kanya
  rationale: Pinananatili ng “upang” ang layuning ipinahahayag ng ἵνα, samantalang malinaw na inilalarawan ng “ipukol sa kanya” ang marahas na paghagis ng mga bato laban kay Jesus.
- source_word: ἐκρύβη
  choice: nagtago
  rationale: Bagaman pasibo ang anyong Griyego, maaari itong magkaroon dito ng diwang middle. Ang “nagtago” ang natural na salin at hindi nagpapahiwatig ng hindi binanggit na taong nagtago kay Jesus.
- source_word: ἐξῆλθεν
  choice: lumabas
  rationale: Tuwirang inilalarawan nito ang paglabas ni Jesus mula sa lugar.
- source_word: ἐκ τοῦ ἱεροῦ
  choice: sa templo
  rationale: Natural sa Tagalog ang “lumabas sa templo.” Ang ἱερόν ay tumutukoy nang mas tiyak sa buong bakuran o kompleks ng templo, kaya inilagay ang paglilinaw sa talababa.
theological_decisions:
- issue: Paraan ng pagkaligtas ni Jesus
  choice: Isinalin lamang na nagtago si Jesus at lumabas sa templo.
  alternative: Mahimalang dumaan si Jesus sa gitna nila o naging di-nakikita.
  rationale: Ang ibinigay na tekstong SBLGNT ay nagsasabi lamang na nagtago si Jesus at lumabas. Hindi idinagdag ang mga detalye mula sa mas huling tradisyon ng mga manuskrito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “dumampot” at “ipukol” upang maging natural at mailarawan nang tumpak ang tangkang pagbato. Ang talababa ay nag-iingat sa mas tiyak na kahulugan ng ἱερόν.
