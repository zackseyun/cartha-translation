  source_fidelity: 'Tapat ang salin sa SBLGNT: ang οὖν ay naipahayag sa “Kaya,” ang ἦραν λίθους sa “dumampot sila ng mga bato,” ang layunin ng ἵνα βάλωσιν ἐπ’ αὐτόν sa “upang ipukol sa kanya,” at ang ἐκρύβη καὶ ἐξῆλθεν sa “nagtago si Jesus at lumabas.” Wala itong idinagdag na mahimalang detalye na wala sa ibinigay na tekstong Griyego.'
  naturalness: Natural, malinaw, at angkop sa makabagong Filipino Tagalog ang daloy ng pangungusap. Ang “Ngunit” ay maayos na naghahayag ng pagkakaiba/kontra sa δέ, at ang “ipukol” ay angkop sa marahas na pagtatangkang ihagis ang mga bato.
  terminology: Wasto ang “templo” sa pangunahing teksto bilang natural na salin ng ἱερόν. Wastong nililinaw ng talababa na ang tinutukoy ay ang kompleks o mga bakuran/looban ng templo, hindi lamang ang panloob na santuwaryo. Ang pangalang “Jesus” at mga terminong ginamit ay pare-pareho sa marangal na rehistrong pambibliya.
