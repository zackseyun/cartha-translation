  source_fidelity: 'Tumpak na naihahatid ang pangunahing mga pahayag ng Griyego: ang pagkakaugnay sa diyablo bilang ama, ang kusang pagganap sa kanyang mga pagnanasa, ang paglalarawang mamamatay-tao siya mula pa sa simula, ang hindi niya paninindigan sa katotohanan, at ang pagiging sinungaling at ama/pinagmulan ng kasinungalingan. Ang “hindi siya naninindigan” ay maingat na hindi nagdaragdag ng ideyang dati siyang nanatili sa katotohanan.'
