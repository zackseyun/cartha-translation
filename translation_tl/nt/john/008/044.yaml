id: JHN.8.44
reference: John 8:44
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὑμεῖς ἐκ τοῦ πατρὸς τοῦ διαβόλου ἐστὲ καὶ τὰς ἐπιθυμίας τοῦ πατρὸς ὑμῶν θέλετε ποιεῖν. ἐκεῖνος ἀνθρωποκτόνος ἦν ἀπ’ ἀρχῆς, καὶ ἐν τῇ ἀληθείᾳ ⸂οὐκ ἔστηκεν⸃, ὅτι οὐκ ἔστιν ἀλήθεια ἐν αὐτῷ. ὅταν λαλῇ τὸ ψεῦδος, ἐκ τῶν ἰδίων λαλεῖ, ὅτι ψεύστης ἐστὶν καὶ ὁ πατὴρ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/044.yaml
  text: You are from your father[a], the devil, and you want to do your father's desires. He was a murderer from the beginning, and he has not stood in the truth, because there is no truth in him. Whenever he speaks the lie, he speaks from his own nature[c][b], because he is a liar and the father of it.
translation:
  language: tl
  text: Kayo ay nagmula sa inyong ama, ang diyablo, at gusto ninyong gawin ang mga pagnanasa ng inyong ama. Mamamatay-tao siya mula pa sa simula, at hindi siya naninindigan sa katotohanan, sapagkat walang katotohanan sa kanya. Kapag nagsasalita siya ng kasinungalingan[a], nagsasalita siya mula sa sarili niyang pagkatao[b], sapagkat sinungaling siya at ama nito.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Kapag sinasalita niya ang kasinungalingan.” Maaari ring isalin: “Kapag nagsisinungaling siya.”'
    reason: lexical_alternative
  - marker: b
    text: 'Mas literal: “nagsasalita siya mula sa sarili niyang mga bagay,” ibig sabihin, mula sa kung ano ang sariling-sarili sa kanya o sa kanyang likas na pagkatao.'
    reason: lexical_alternative
  - marker: c
    text: 'Maaari ring unawain: “ama ng kasinungalingan” o, sa mas malayang pananalita, “ama ng mga kasinungalingan.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τοῦ πατρὸς τοῦ διαβόλου
  choice: nagmula sa inyong ama, ang diyablo
  rationale: Ipinahahayag ng ἐκ kasama ng εἰμί ang pinagmulan o pagkakaugnay. Likas sa modernong Tagalog ang “nagmula sa” at pinananatili ang matinding pahayag tungkol sa kanilang espirituwal na pinagmulan o katapatan.
- source_word: ἐπιθυμίας
  choice: mga pagnanasa
  rationale: Malawak ang kahulugan at hindi ito nililimitahan sa seksuwal na pagnanasa; naaangkop ito sa masasamang hangarin sa konteksto.
- source_word: θέλετε ποιεῖν
  choice: gusto ninyong gawin
  rationale: Malinaw at natural na ipinahahayag ang kusang hangarin o kapasyahang isagawa ang mga nais ng kanilang ama.
- source_word: ἀνθρωποκτόνος
  choice: mamamatay-tao
  rationale: Karaniwan at tuwirang katawagan sa taong pumapatay; pinananatili ang moral na bigat ng salita.
- source_word: ἀπ’ ἀρχῆς
  choice: mula pa sa simula
  rationale: Tuwirang salin na natural sa Tagalog at umaalingawngaw sa pananalita ni Juan tungkol sa “simula.”
- source_word: ἐν τῇ ἀληθείᾳ οὐκ ἔστηκεν
  choice: hindi siya naninindigan sa katotohanan
  rationale: Pinananatili ang larawan ng pagtayo o paninindigan nang hindi tahasang ipinapalagay na dati siyang nasa katotohanan at pagkatapos ay lumayo rito.
- source_word: ἀλήθεια
  choice: katotohanan
  rationale: Pamantayan at angkop na salin sa bokabularyo ni Juan.
- source_word: ὅταν λαλῇ τὸ ψεῦδος
  choice: Kapag nagsasalita siya ng kasinungalingan
  rationale: Natural sa Tagalog at pinananatili ang kilos ng “pagsasalita” at ang pangkalahatang o paulit-ulit na diwa ng ὅταν.
- source_word: ἐκ τῶν ἰδίων λαλεῖ
  choice: nagsasalita siya mula sa sarili niyang pagkatao
  rationale: Ipinapaliwanag nang natural na ang kasinungalingan ay nagmumula sa kung ano ang likas o sariling-sarili sa kanya, habang inilalagay sa talababa ang mas literal na anyo.
- source_word: ψεύστης
  choice: sinungaling
  rationale: Tuwiran, malinaw, at likas na katumbas sa Tagalog.
- source_word: ὁ πατὴρ αὐτοῦ
  choice: ama nito
  rationale: Pinakamalapit na tinutukoy ng αὐτοῦ ang “kasinungalingan”; pinananatili ng “ama nito” ang maikli at metaporikal na pananalita nang hindi ginagawang tahasang maramihan ang kasinungalingan.
theological_decisions:
- issue: Tinutukoy ng ὁ πατὴρ αὐτοῦ
  choice: 'Ang “nito” ay tumutukoy sa kasinungalingan: ang diyablo ang ama o pinagmulan nito.'
  alternative: “Ama ng mga kasinungalingan,” o ang di-malamang na “ama niya.”
  rationale: Ang pinakamalapit at pinakanaaangkop na tinutukoy ay τὸ ψεῦδος. Iniiwasan ng salin ang haka-hakang pahayag na may ama ang diyablo at hindi rin nito pinapalitan ang isahan ng tahasang maramihan.
- issue: Kung ipinahihiwatig bang dating nasa katotohanan ang diyablo
  choice: Hindi siya naninindigan sa katotohanan.
  alternative: Hindi siya nanatili sa katotohanan.
  rationale: Ang “nanatili” ay maaaring magpahiwatig na dati siyang nasa katotohanan. Ang piniling anyo ay nagpapanatili sa larawan ng ἔστηκεν at sa tunay na teolohikal na pag-aalinlangan ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “kayo/ninyo” para sa maramihang ὑμεῖς, “diyablo” bilang karaniwang biblikal na katawagan, at “mamamatay-tao” upang mapanatili ang bigat nang hindi maging lipas ang pananalita. Lahat ng talababa ay minarkahan sa pangunahing teksto.
