    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ
  choice: Ngunit hindi ko
  rationale: Ipinahihiwatig ng tahasang ἐγώ at ng δέ ang mariing pagtutol o pagkakaiba. Likas sa Tagalog na ipakita ang diin sa pamamagitan ng konteksto at ayos ng sugnay kaysa sa hiwalay na panghalip na “ako.”
- source_word: οὐ ζητῶ
  choice: hindi ko hinahanap
  rationale: Pinananatili ng “hinahanap” ang payak na pangkasalukuyang diwa at ang leksikal na ugnayan nito sa ζητῶν sa kasunod na sugnay.
- source_word: τὴν δόξαν μου
  choice: ang sarili kong kaluwalhatian
  rationale: Ang δόξα rito ay karangalan o kaluwalhatiang iniuukol sa isang tao. Nililinaw ng “sarili kong” ang pagtanggi ni Jesus na itaguyod ang sariling kaluwalhatian.
- source_word: ἔστιν ὁ ζητῶν
  choice: may isang naghahanap nito
  rationale: Ipinakikilala ng ἔστιν ang isang di-pinangalanang gumagawa ng kilos, habang ang articular participle ay likas na naisasalin bilang “isang naghahanap.” Idinagdag ang “nito” bilang ipinahihiwatig na layon mula sa naunang “kaluwalhatian.”
- source_word: καὶ κρίνων
  choice: at humahatol
  rationale: Pinananatili ng “humahatol” ang pangkasalukuyang kilos at ang hudisyal na diwa ng κρίνω sa konteksto.
theological_decisions:
- issue: Pagkakakilanlan ng di-pinangalanang naghahanap at humahatol
  choice: Hindi tahasang pinangalanan sa pangunahing teksto; isinalin bilang “may isang.”
  alternative: “May Ama na naghahanap nito at humahatol.”
  rationale: Bagaman karaniwang nauunawaan sa konteksto na ang tinutukoy ay ang Ama, hindi siya tahasang pinangalanan ng Griyego sa talatang ito. Pinananatili ng salin ang pagpipigil at bahagyang kalabuan ng orihinal.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang pag-uulit ng salitang-ugat sa “hinahanap” at “naghahanap,” pati ang di-tahasang pagkakakilanlan ng gumagawa ng kilos. Inilagay ang mga talababa sa dulo ng sugnay na may kaugnayan sa kapuwa ipinahihiwatig na layon at di-pinangalanang paksa.
