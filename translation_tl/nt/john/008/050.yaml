  text: Ngunit hindi ko hinahanap ang sarili kong kaluwalhatian; may isa na naghahanap nito at humahatol.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “mayroong isa na naghahanap at humahatol.” Ang ipinahihiwatig na layon ng “naghahanap” ay ang kaluwalhatian ni Jesus na binanggit sa naunang sugnay.'
    reason: lexical_alternative
  - marker: b
