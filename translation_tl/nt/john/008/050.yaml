  naturalness: Malinaw at marangal ang pangunahing salin sa modernong Filipino Tagalog. Gayunman, hindi likas o wastong Tagalog ang literal na anyong «mayroong ang naghahanap» sa talababa a; kailangan itong itama. Ang «di-pinangalanang ito» sa talababa b ay maaari ring gawing mas malinaw.
