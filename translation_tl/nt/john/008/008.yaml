  yaml_path: translation/nt/john/008/008.yaml
  text: And again[a], he stooped down and wrote on the ground.
translation:
  language: tl
  text: At muli[a], yumuko siya at sumulat sa lupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pagpapatuloy ito ng salaysay tungkol sa babaeng nahuling nangangalunya (Juan 7:53–8:11). Tingnan ang tala sa Juan 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: κάτω κύψας
  choice: yumuko
  rationale: Ang participial phrase ay naglalarawan ng pagyuko ng katawan. Likas at sapat sa modernong Tagalog ang “yumuko”; hindi na kailangang idagdag ang “pababa,” na likas nang ipinahihiwatig ng pandiwa.
- source_word: ἔγραφεν
  choice: sumulat
  rationale: Ang imperfect ay maaaring ipakahulugang nagpapatuloy na kilos (“patuloy na sumusulat”), ngunit sa payak na salaysay ay natural ang “sumulat” at hindi nito ipinipilit kung minsanan o nagpapatuloy ang kilos.
- source_word: εἰς τὴν γῆν
  choice: sa lupa
  rationale: Sa konteksto, tumutukoy ito sa ibabaw ng lupang nasa harap niya. Ang “sa lupa” ang pinakanatural na katumbas sa Tagalog.
theological_decisions:
- issue: Kalagayang tekstuwal ng Juan 7:53–8:11
  choice: Panatilihin ang talata sa pangunahing teksto at lagyan ng talababa ang “muli.”
  alternative: Alisin sa pangunahing teksto o ilagay sa panaklong ang buong salaysay.
  rationale: Kasama ang talata sa ibinigay na Robinson-Pierpont Byzantine source, ngunit mahalagang ipabatid sa mambabasa na bahagi ito ng salaysay na may makabuluhang usaping tekstuwal, nang hindi nilulutas nang palihim ang usapin.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “yumuko” sa halip na mas literal ngunit mabigat na “yumuko pababa,” at “sa lupa” bilang karaniwang paraan ng pagtukoy sa ibabaw ng lupa.
