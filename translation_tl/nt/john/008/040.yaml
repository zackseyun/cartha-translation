  text: νῦν δὲ ζητεῖτέ με ἀποκτεῖναι, ἄνθρωπον ὃς τὴν ἀλήθειαν ὑμῖν λελάληκα ἣν ἤκουσα παρὰ τοῦ θεοῦ· τοῦτο Ἀβραὰμ οὐκ ἐποίησεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/040.yaml
  text: But now you are seeking to kill me, a man who has told you the truth that I heard from God. Abraham did not do this.
translation:
  language: tl
  text: Ngunit ngayon, sinisikap ninyo akong patayin—isang taong nagsabi sa inyo ng katotohanang narinig ko mula sa Diyos. Hindi ito ginawa ni Abraham.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ
  choice: Ngunit ngayon
  rationale: Pinananatili nito ang pagsalungat ng δέ at ang temporal na diin ng νῦν sa natural at marangal na Tagalog.
- source_word: ζητεῖτέ με ἀποκτεῖναι
  choice: sinisikap ninyo akong patayin
  rationale: Sa kasunod na pawatas, ang ζητέω ay maaaring mangahulugang nagsisikap o nagtatangkang gawin ang isang bagay. Ipinahahayag ng 'sinisikap' ang patuloy at sinasadyang pagkilos nang hindi nagdaragdag ng pamamaraang hindi binanggit sa Griyego.
- source_word: ἀποκτεῖναι
  choice: patayin
  rationale: Ito ang tuwiran at karaniwang katumbas. Ang 'paslangin' ay maaaring magdagdag ng mas mariing moral na kulay.
- source_word: ἄνθρωπον
  choice: isang taong
  rationale: Tumutukoy si Jesus sa sarili bilang isang lalaking tao. Sa Tagalog, natural na naipahihiwatig ng 'tao' ang tunay niyang pagkatao, habang malinaw na lalaki ang tinutukoy dahil siya ang antecedent.
- source_word: τὴν ἀλήθειαν
  choice: ang katotohanan
  rationale: Pinananatili ang tiyak na katotohanang ipinahayag ni Jesus, ayon sa gamit ng pantukoy sa Griyego.
- source_word: ὑμῖν λελάληκα
  choice: nagsabi sa inyo
  rationale: Natural itong salin ng pagsasalitang naipahayag na at nananatiling mahalaga sa kasalukuyang usapan. Ang 'nagsabi' ay angkop sa tuwirang layon na 'katotohanan.'
- source_word: ἣν ἤκουσα παρὰ τοῦ θεοῦ
  choice: na narinig ko mula sa Diyos
  rationale: Ipinahahayag ng παρά na may genitive ang Diyos bilang pinagmulan. Hindi nito pinapalitan ang 'Diyos' ng mas tiyak na titulong 'Ama,' na wala rito sa teksto.
- source_word: τοῦτο Ἀβραὰμ οὐκ ἐποίησεν
  choice: Hindi ito ginawa ni Abraham
  rationale: Natural na Tagalog ito na pinananatili ang tahasang pagtukoy ng τοῦτο sa ginagawa nilang pagtatangkang pumatay, nang hindi ito pinalalawak bilang pangkalahatang asal.
theological_decisions:
- issue: Paglalarawan ni Jesus sa sarili bilang ἄνθρωπον
  choice: ako na isang taong
  alternative: ako na isang tao / isang lalaking tao
  rationale: Pinananatili ang malinaw na pagpapahayag ng tunay na pagkatao ni Jesus. Hindi kailangang idagdag ang 'lalaki' sa Tagalog sapagkat malinaw ang tinutukoy at magiging mabigat ang parirala; hindi rin nito itinatanggi o binabawasan ang kanyang pagka-Diyos.
- issue: Pinagmulan ng mensahe ni Jesus sa παρὰ τοῦ θεοῦ
  choice: mula sa Diyos
  alternative: mula sa Ama
  rationale: Ang salitang nasa Griyego ay θεός, 'Diyos,' hindi πατήρ, 'Ama.' Kaya hindi ipinapasok ang mas tiyak na titulong teolohikal mula sa ibang mga talata.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang 'Ngunit' sa halip na mas kolokyal na 'Pero,' at ang em dash upang malinaw na ipakilala ang paglalarawan ni Jesus sa sarili nang hindi nagiging alanganin ang balangkas ng pangungusap.
