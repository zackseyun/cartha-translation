  text: οἶδα ὅτι σπέρμα Ἀβραάμ ἐστε· ἀλλὰ ζητεῖτέ με ἀποκτεῖναι, ὅτι ὁ λόγος ὁ ἐμὸς οὐ χωρεῖ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/037.yaml
  text: I know that you are Abraham’s offspring[a]; but you are seeking to kill me[b], because my word has no place in you.
translation:
  language: tl
  text: Alam kong mga inapo kayo ni Abraham[a]. Ngunit hangad ninyo akong patayin, dahil walang puwang sa inyo ang salita ko.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kayo ay binhi ni Abraham.”
    reason: lexical_alternative
  - marker: b
    text: O “dahil hindi nakakahanap ng puwang sa inyo ang salita ko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σπέρμα Ἀβραάμ
  choice: lahi kayo ni Abraham
  rationale: Ang σπέρμα ay kolektibong tumutukoy rito sa pisikal na angkan. Likas sa makabagong Tagalog ang “lahi kayo ni Abraham” at hindi nito ipinapasok nang maaga ang usapin ng pagiging espirituwal na mga anak.
- source_word: ζητεῖτέ με ἀποκτεῖναι
  choice: sinisikap ninyo akong patayin
  rationale: Ipinahahayag nito ang kasalukuyan at patuloy na paghahangad o pagtatangka na patayin si Jesus, nang hindi tahasang nagpapasiya kung hangarin lamang o aktuwal na pagsisikap ang diin.
- source_word: ὁ λόγος ὁ ἐμὸς
  choice: ang salita ko
  rationale: Tuwirang katumbas ito ng λόγος at pinananatili ang mahalagang bokabularyong Juanino; hindi ito nililimitahan sa “mensahe” lamang.
- source_word: οὐ χωρεῖ ἐν ὑμῖν
  choice: walang puwang sa inyo
  rationale: Pinananatili nito ang larawang may hindi nabibigyan ng lugar o pagtanggap sa kanilang kalooban, habang iniiwasang paliitin ang kahulugan tungo lamang sa kawalan ng pag-unawa o pag-unlad.
- source_word: ἀλλὰ
  choice: ngunit
  rationale: Malinaw at marangal na ipinakikita ang matinding pagsalungat sa pagitan ng kinikilalang angkan nila at ng kanilang balak laban kay Jesus.
- source_word: οἶδα ὅτι
  choice: alam kong
  rationale: Natural at tuwirang salin ng panimulang sugnay sa modernong Tagalog.
theological_decisions:
- issue: Ugnayan ng pisikal na pagiging lahi ni Abraham at ng tunay na pagkakatulad kay Abraham
  choice: 'Isinalin ang σπέρμα Ἀβραάμ bilang pisikal na angkan: “lahi kayo ni Abraham.”'
  alternative: “mga anak kayo ni Abraham” o “mga inapo kayo ni Abraham”
  rationale: Kinikilala ni Jesus dito ang kanilang pisikal na pinagmulan habang hinahamon ang kanilang asal. Hindi pa nilulutas ng salin ang teolohikal na tensiyong higit na nililinaw sa mga kasunod na talata.
- issue: Lawak ng kahulugan ng χωρεῖ
  choice: Pinanatili ang metaporang “walang puwang sa inyo.”
  alternative: “hindi ninyo tinatanggap” o “hindi umuunlad sa inyo”
  rationale: Maaaring magpahiwatig ang pandiwa ng pagbibigay-lugar, pagtanggap, o pag-usad. Pinananatili ng napiling salin ang tunay na lawak at metaporikal na tensiyon nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kayo” at “ninyo” upang tumpak na ipakita ang maramihang ikalawang panauhan. Ang “salita ko” at “walang puwang” ay nagpapanatili sa diksyon at metapora ng Griyego nang hindi nagiging di-likas sa Filipino.
