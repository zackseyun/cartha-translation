  text: ἀπεκρίθησαν ⸂πρὸς αὐτόν⸃· Σπέρμα Ἀβραάμ ἐσμεν καὶ οὐδενὶ δεδουλεύκαμεν πώποτε· πῶς σὺ λέγεις ὅτι Ἐλεύθεροι γενήσεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/033.yaml
  text: They answered him[a], “We are Abraham’s offspring and have never been enslaved to anyone. How can you say[c][b], ‘You will become free’?”
translation:
  language: tl
  text: Sumagot sila sa kanya, “Kami ay lahi[a] ni Abraham at hindi kami kailanman naging alipin ng sinuman.[b] Paano mo nasasabing, ‘Magiging malaya kayo’?[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Binhi kami ni Abraham.” Gumagamit ang Griyego ng isang pang-isahang kolektibong salita para sa pisikal na angkan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “hindi kami kailanman naglingkod sa sinuman.” Maaaring mangahulugan ang pandiwa na maglingkod, ngunit mas nangingibabaw rito ang diwa ng pagkaalipin dahil inihahambing ito sa kalayaan.
    reason: lexical_alternative
  - marker: c
    text: Mas literal na ipinahihiwatig ng Griyego ang “magiging malaya,” na nagsasaad ng pagpasok sa kalagayan ng kalayaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν πρὸς αὐτόν
  choice: Sumagot sila sa kanya
  rationale: Likas na salin sa Filipino ng tuwirang pagtugon kay Jesus; iniiwasan ang matigas na literal na ayos na “sumagot sila patungo sa kanya.”
- source_word: Σπέρμα Ἀβραάμ
  choice: Lahi kami ni Abraham
  rationale: Ang σπέρμα ay kolektibong katawagan sa pisikal na angkan. Ang “lahi” ay malinaw at natural sa makabagong Filipino, samantalang ang literal na “binhi” ay maaaring maging malabo o di-likas dito.
- source_word: οὐδενὶ δεδουλεύκαμεν πώποτε
  choice: hindi kami kailanman naging alipin ng sinuman
  rationale: Ipinahahayag ng δουλεύω ang kalagayan ng pagkaalipin sa konteksto ng paghahambing sa kalayaan. Napananatili ng “kailanman” ang diin ng πώποτε at natural ang “ng sinuman” sa negatibong pangungusap.
- source_word: πῶς σὺ λέγεις
  choice: Paano mo nasasabing
  rationale: Natural nitong naipahahayag ang mapagtutol at di-makapaniwalang tono ng tanong, pati ang diin sa tahasang σὺ.
- source_word: Ἐλεύθεροι γενήσεσθε
  choice: Magiging malaya kayo
  rationale: Napananatili ng “magiging” ang pagbabagong ipinahihiwatig ng γενήσεσθε, sa halip na gawin lamang itong payak na kalagayan.
theological_decisions:
- issue: Pagpapakahulugan sa δουλεύω sa paghahambing ng pagkaalipin at kalayaan
  choice: naging alipin
  alternative: naglingkod
  rationale: Ang agarang konteksto ay tungkol sa pagkaalipin at paglaya, kaya mas malinaw na naipapakita ng “naging alipin” ang bigat ng pagkagapos nang hindi nagdaragdag ng isang denominasyonal na pagbasa.
- issue: Pagpapahayag sa Σπέρμα Ἀβραάμ
  choice: Lahi ni Abraham
  alternative: Binhi ni Abraham
  rationale: Tumutukoy ang parirala sa pag-aangkin ng pisikal na angkan. Nananatiling kolektibo at nauunawaan sa Filipino ang “lahi,” habang inilalagay sa talababa ang mas literal na larawan.
- issue: Pagpapanatili sa aspektong nagiging malaya sa γενήσεσθε
  choice: Magiging malaya kayo
  alternative: Malaya kayo
  rationale: Pinananatili nito ang paglipat tungo sa kalayaan na ipinahihiwatig ng γίνομαι at ang tensiyon sa pagtutol ng mga sumagot.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kanya” at “kayo” bilang karaniwang natural na pananalita; iniwasan ang arkaikong “binhi” sa pangunahing teksto ngunit pinanatili ito bilang literal na alternatibo sa talababa.
