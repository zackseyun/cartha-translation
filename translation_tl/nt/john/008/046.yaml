  yaml_path: translation/nt/john/008/046.yaml
  text: Which one of you convicts me of sin? If I speak the truth[c][b][a], why do you not believe me?
translation:
  language: tl
  text: Sino sa inyo ang makapagpapatunay na may kasalanan ako?[a] Kung nagsasabi ako ng katotohanan, bakit hindi kayo naniniwala sa akin?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sino sa inyo ang magpapakitang may kasalanan ako?”
    reason: lexical_alternative
  - marker: b
    text: O “bakit hindi kayo nagtitiwala sa akin?” Ang salitang Griyego ay maaaring tumukoy kapwa sa paniniwala sa isang nagsasalita at sa pagtitiwala sa kanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς ἐξ ὑμῶν
  choice: Sino sa inyo
  rationale: Likas at tuwirang tanong sa modernong Tagalog na nagpapanatili sa hamon sa mga nakikinig.
- source_word: ἐλέγχει με περὶ ἁμαρτίας
  choice: ang makapagpapatunay na nagkasala ako
  rationale: Ang ἐλέγχω ay maaaring mangahulugang maglantad o magpatunay na may sala. Inihahatid ng pariralang ito ang puwersang tila panghukuman sa malinaw at natural na Tagalog, habang hindi tinutukoy ang isang partikular na kasalanan.
- source_word: εἰ ἀλήθειαν λέγω
  choice: Kung nagsasabi ako ng katotohanan
  rationale: Pinananatili ng “kung” ang anyong kondisyonal ng εἰ at hindi ito ipinapalit sa interpretatibong “yamang.”
- source_word: διὰ τί
  choice: bakit
  rationale: Ito ang pinakanatural na katumbas sa Tagalog ng tanong tungkol sa dahilan.
- source_word: πιστεύετέ μοι
  choice: naniniwala sa akin
  rationale: Pinananatili nito ang tuwirang ugnayan sa nagsasalita at maaari pa ring magpahiwatig kapwa ng paniniwala sa sinasabi niya at pagtitiwala sa kanya.
theological_decisions:
- issue: Retorikal na puwersa ng pahayag ni Jesus tungkol sa kawalan niya ng kasalanan at sa katotohanan ng kanyang sinasabi
  choice: Tuwirang isinalin ang dalawang tanong nang hindi pinalalambot o ginagawang tahasang paliwanag ang ipinahihiwatig.
  alternative: “Mayroon ba sa inyong makapagpapatunay na nakagawa ako ng anumang kasalanan?”
  rationale: Ang Griyego ay naghaharap ng isang matinding hamon at iniuugnay iyon sa katotohanan ng sinasabi ni Jesus. Pinananatili ng salin ang bigat nito nang walang idinagdag na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “makapagpapatunay na nagkasala” sa halip na mas teknikal na “humahatol” o hiram na terminong panghukuman.
