id: JHN.8.43
reference: John 8:43
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: διὰ τί τὴν λαλιὰν τὴν ἐμὴν οὐ γινώσκετε; ὅτι οὐ δύνασθε ἀκούειν τὸν λόγον τὸν ἐμόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/043.yaml
  text: Why do you not understand my way of speaking? Because you are not able to hear my word[a][b].
translation:
  language: tl
  text: Bakit hindi ninyo nauunawaan ang paraan ko ng pagsasalita? Dahil hindi ninyo kayang pakinggan ang aking salita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dinggin ang aking salita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλιὰν
  choice: paraan ko ng pagsasalita
  rationale: Tumutukoy ito sa paraan o anyo ng pagsasalita ni Jesus, kaya pinananatili ang pagkakaiba nito sa λόγος sa kasunod na sugnay.
- source_word: γινώσκετε
  choice: nauunawaan
  rationale: Sa konteksto, ang diwa ay pagkaunawa sa sinasabi ni Jesus, hindi simpleng pagkakilala o pagkaalam.
- source_word: ἀκούειν
  choice: pakinggan
  rationale: Ang pandiwa ay literal na tumutukoy sa pakikinig o pagdinig; dito, ang “pakinggan” ay natural sa Filipino at maaari ring magpahiwatig ng pagtanggap nang hindi ito tahasang ipinapasok sa salin.
- source_word: λόγον
  choice: salita
  rationale: Pinananatili ng “salita” ang pangunahing diwa at ang pagkakaiba nito sa “paraan ng pagsasalita,” habang hindi nililimitahan ang kahulugan sa mensahe o aral lamang.
- source_word: οὐ δύνασθε
  choice: hindi ninyo kayang
  rationale: Malinaw nitong ipinapahayag ang kawalan ng kakayahan, hindi lamang ang ayaw na gawin ang isang bagay.
- source_word: ὅτι
  choice: Dahil
  rationale: Ipinakikilala nito ang dahilan sa naunang tanong sa malinaw at natural na Filipino.
- source_word: τὴν ἐμὴν / τὸν ἐμόν
  choice: ko / aking
  rationale: Ang dalawang anyong paari ay isinalin ayon sa natural na balarila ng Filipino habang pinananatili ang pagkakatulad ng “paraan ko ng pagsasalita” at “aking salita.”
theological_decisions:
- issue: Likas na katangian ng kawalan ng kakayahang pakinggan ang salita ni Jesus
  choice: Tahasang isalin bilang kawalan ng kakayahan nang hindi ipinapaliwanag ang sanhi nito.
  alternative: Ipaliwanag ito bilang moral na pagtanggi, paghatol na nagpapatigas, o espirituwal na kawalan ng kakayahan.
  rationale: Sinasabi ng talata na hindi nila kaya, ngunit hindi nito rito ganap na tinutukoy ang sanhi. Pinananatili ng salin ang teolohikal na tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “paraan ko ng pagsasalita” upang maipakita ang pagkakaiba ng λαλιά at λόγος. Pinili ang “pakinggan” sa pangunahing teksto dahil mas natural ito sa pangungusap, habang inilagay sa talababa ang mas literal at bahagyang mas mataas na rehistrong “dinggin.”
