id: JHN.8.32
reference: John 8:32
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ γνώσεσθε τὴν ἀλήθειαν, καὶ ἡ ἀλήθεια ἐλευθερώσει ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/032.yaml
  text: and you will know the truth[b][a], and the truth will set you free.
translation:
  language: tl
  text: at malalaman ninyo ang katotohanan,[a] at palalayain kayo ng katotohanan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “makikilala ninyo ang katotohanan.”
    reason: lexical_alternative
  - marker: b
    text: Hindi tinutukoy sa mismong talatang ito kung mula saan sila palalayain; iniuugnay ito ng kasunod na konteksto sa kalayaan mula sa kasalanan.
    reason: cross_reference
lexical_decisions:
- source_word: γνώσεσθε
  choice: malalaman ninyo
  rationale: Tuwirang salin ng future form ng γινώσκω. Likas ito sa modernong Filipino at maaari ring magpahiwatig na sasapit sila sa pagkakilala, nang hindi iyon labis na binibigyang-diin.
- source_word: ἀλήθειαν / ἀλήθεια
  choice: ang katotohanan
  rationale: Pinananatili ang tiyak na pantukoy at ang retorikal na pag-uulit ng salitang Griyego sa dalawang sugnay.
- source_word: ἐλευθερώσει
  choice: palalayain
  rationale: 'Likas at malinaw na salin ng causative na diwa ng ἐλευθερόω: gagawing malaya o aalisin sa pagkaalipin.'
- source_word: ὑμᾶς
  choice: kayo
  rationale: Ipinakikita ng panghalip na Filipino ang tahasang pangmaramihang anyo ng ikalawang panauhan sa Griyego.
- source_word: καὶ ... καὶ
  choice: at ... at
  rationale: Pinananatili ang magkatimbang na pagkakaugnay, indayog, at lohikal na pag-usad ng dalawang sugnay.
theological_decisions:
- issue: Uri o saklaw ng kalayaang ibinibigay ng katotohanan
  choice: Hindi tinukoy sa pangunahing teksto kung mula saan sila palalayain.
  alternative: “palalayain kayo ng katotohanan mula sa kasalanan”
  rationale: Hindi tahasang tinutukoy ng mismong talata ang saklaw ng kalayaan. Iniuugnay ito ng kasunod na konteksto sa pagkaalipin sa kasalanan, ngunit hindi iyon idinaragdag sa pangunahing teksto upang mapanatili ang maigsi at malawak na pahayag.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “malalaman” bilang pinakanatural na tuwirang pahayag, habang inilagay sa talababa ang “makikilala” upang katawanin ang posibleng diwa ng pagdating sa pagkakilala. Ang ayos na “palalayain kayo ng katotohanan” ay nagpapanatili sa katotohanan bilang tahasang gumaganap at sa pangako bilang mariing pangwakas.
