  source_fidelity: 'Tumpak ang salin sa Griyego: ang panghinaharap na γνώσεσθε ay naipahayag ng “malalaman ninyo,” ang tiyak at inuulit na ἀλήθεια ay “ang katotohanan,” at ang ἐλευθερώσει ὑμᾶς ay “palalayain kayo.” Napanatili rin ang magkatuwang na “at … at” at ang pangmaramihang kausap.'
