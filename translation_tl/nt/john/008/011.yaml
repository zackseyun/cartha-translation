id: JHN.8.11
reference: John 8:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: robinson-pierpont-2005-byzantine
  text: Ἡ δὲ εἶπεν, Οὐδείς, κύριε. Εἶπεν δὲ ὁ Ἰησοῦς, Οὐδὲ ἐγώ σε κατακρίνω· πορεύου, καὶ μηκέτι ἁμάρτανε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/011.yaml
  text: She[a] said, "No one, Lord." And Jesus said, "Neither do I condemn you; go, and sin no more."
translation:
  language: tl
  text: Sumagot siya, “Wala po, Panginoon.” Sinabi ni Jesus, “Hindi rin kita hinahatulan. Humayo ka, at mula ngayon ay huwag ka nang magkasala.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Huling talata ito ng salaysay tungkol sa babaeng nahuling nangangalunya (Juan 7:53–8:11). Tingnan ang tala sa Juan 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: κύριε
  choice: Panginoon
  rationale: Maaaring mangahulugang magalang na “ginoo” ang pantawag, ngunit pinananatili ng “Panginoon” ang pagkilala sa awtoridad ni Jesus at ang tradisyonal na pagbasa, nang hindi inaalis ang likas na posibilidad ng magalang na pagtawag sa konteksto.
- source_word: κατακρίνω
  choice: hinahatulan
  rationale: Ipinahahayag nito ang hudisyal na diwa ng paghatol laban sa babae, na angkop sa konteksto ng paratang at mungkahing parusa.
- source_word: μηκέτι ἁμάρτανε
  choice: mula ngayon ay huwag ka nang magkasala
  rationale: Malinaw at natural nitong ipinahahayag ang utos na itigil mula sa sandaling iyon ang pagkakasala; hindi nito ipinahihiwatig na walang anumang dating kasalanan.
- source_word: πορεύου
  choice: Humayo ka
  rationale: Dignified at tuwirang katumbas ng utos na umalis o magpatuloy sa paglakad; mas angkop sa biblikal na register kaysa sa payak na “Umalis ka.”
theological_decisions:
- issue: Ang kahulugan ng κύριε bilang pantawag kay Jesus
  choice: Panginoon
  alternative: Ginoo
  rationale: Pinananatili ang tradisyonal at teolohikal na bigat ng pantawag habang kinikilalang maaari rin itong gumana bilang magalang na pakikipag-usap sa salaysay.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “po” sa sagot ng babae upang maipakita ang paggalang na taglay ng bokatibong κύριε; ang “Humayo ka” ay nagpapanatili ng dignified na biblikal na himig. Inilagay ang marker [a] sa dulo ng talata upang malinaw na tumukoy sa buong salaysay.
