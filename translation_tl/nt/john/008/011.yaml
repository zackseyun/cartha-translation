  source_fidelity: 'Tumpak na naihahatid ng salin ang mga pangunahing elemento ng Griyego: ang tugon na “Wala ... Panginoon,” ang “Hindi rin kita hinahatulan” para sa Οὐδὲ ἐγώ σε κατακρίνω, at ang utos na umalis at huwag nang magkasala. Ang “mula ngayon” ay wastong nagpapalinaw sa aspektong nagpapatuloy ng μηκέτι nang hindi nagdaragdag ng doktrinal na kahulugan.'
  naturalness: Natural at marangal ang modernong Filipino Tagalog. Ang “Wala po, Panginoon” ay isang likas na eliptikong tugon sa tanong na ipinapalagay ng konteksto; ang “po” ay angkop na paggalang sa direktang pananalita. Ang “Humayo ka” ay may angkop na biblikal na register.
