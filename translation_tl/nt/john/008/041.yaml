base_translation:
  language: en
  yaml_path: translation/nt/john/008/041.yaml
  text: You are doing the works of your father.” They said to him[a], “We were not born of sexual immorality; we have one Father—God.”
translation:
  language: tl
  text: “Ginagawa ninyo ang mga gawa ng inyong ama.” Sinabi nila sa kanya, “Hindi kami mga anak sa labas.[a] Iisa ang aming Ama—ang Diyos.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “Hindi kami ipinanganak mula sa seksuwal na imoralidad.” Literal na ganito ang Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιεῖτε
  choice: Ginagawa ninyo
  rationale: Likas na ipinahahayag ng aspektong imperpektibo sa Filipino ang nagpapatuloy o kasalukuyang pagkilos ng present indicative.
- source_word: τὰ ἔργα
  choice: ang mga gawa
  rationale: Pinananatili ng “mga gawa” ang karaniwang kahulugan ng ἔργα at ang ugnayang pandiwa nito sa “ginagawa.”
- source_word: τοῦ πατρὸς ὑμῶν
  choice: ng inyong ama
  rationale: Pinananatili ang larawang pampamilya at ang tensiyon tungkol sa pinagmumulan o espirituwal na pagkamag-anak.
- source_word: ἐκ πορνείας
  choice: bunga ng seksuwal na imoralidad
  rationale: Malapit ito sa literal na pahayag tungkol sa kapanganakang nagmula sa πορνεία, ngunit natural sa modernong Filipino; hindi nito tahasang pinapalitan ang pahayag ng interpretasyong “anak sa labas.”
- source_word: οὐ γεγεννήμεθα
  choice: Hindi kami ipinanganak
  rationale: Natural na Filipino para sa perfect passive na pahayag tungkol sa kapanganakan, habang napapanatili ang pagtanggi.
- source_word: ἕνα πατέρα ἔχομεν
  choice: iisa ang aming Ama
  rationale: Ipinahahayag ng “iisa” ang diin sa natatanging Ama; ang malaking titik ay angkop sapagkat agad siyang kinikilalang Diyos.
- source_word: τὸν θεόν
  choice: ang Diyos
  rationale: Ang pariralang ito ay apposisyon na tumutukoy kung sino ang iisang Ama; natural itong inihihiwalay ng gitling sa Filipino.
theological_decisions:
- issue: Kung gagawing tahasan na ang pagtanggi sa kapanganakang “bunga ng seksuwal na imoralidad” ay pag-aangking hindi sila mga anak sa labas
  choice: Panatilihin sa pangunahing teksto ang pahayag tungkol sa paraan o pinagmulan ng kapanganakan
  alternative: Hindi kami mga anak sa labas
  rationale: Maaaring ipinahihiwatig ng idyoma ang lehitimong angkan at posibleng may polemikong pahiwatig, ngunit ang Griyego mismo ay nagsasabing hindi sila ipinanganak ἐκ πορνείας. Iniiwasan nitong gawing tiyak ang isang implikasyong nananatiling di-tahasan.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang “seksuwal na imoralidad” upang mapanatili ang lawak ng πορνεία at ang teolohikal na tensiyon ng sagot. Walang talababa dahil walang marker na kailangan sa pangunahing teksto; ang posibleng kahulugang “mga anak sa labas” ay naitala bilang alternatibong interpretasyon sa mga desisyon.
