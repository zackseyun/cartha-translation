  source_fidelity: Tumpak ang unang pangungusap at ang pagkakaugnay ng “iisa ang aming Ama—ang Diyos” sa Griyegong apposition. Gayunman, ang “bunga ng seksuwal na imoralidad” ay maaaring basahin bilang pangkalahatang resulta ng imoralidad, samantalang ang ἐκ πορνείας sa idyomang ito ay tumutukoy sa pinagmulan o kalagayan ng kapanganakan at malamang ay nagpapahiwatig ng pagiging anak sa labas.
  naturalness: Natural at marangal ang kabuuang daloy. Mas malinaw at mas idiomatiko sa Filipino ang “hindi kami mga anak sa labas,” kung may talababa na nagsasaad ng literal na Griyego, kaysa sa abstraktong “ipinanganak bunga ng seksuwal na imoralidad.”
  terminology: Ang “mga gawa,” “ama,” at “Diyos” ay angkop. Pinananatili ng “Ama” ang appositional na pagkakakilala sa Diyos nang hindi nagpapataw ng dagdag na doktrina.
