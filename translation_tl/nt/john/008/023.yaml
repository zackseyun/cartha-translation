  source_fidelity: 'Tumpak na naipapasa ng draft ang apat na magkakatapat na pahayag: ang mga kausap ay “mula sa ibaba” at “mula sa mundong ito,” samantalang si Jesus ay “mula sa itaas” at hindi mula sa mundong ito. Napananatili rin ang idiomatikong larawan nang hindi ito ginagawang tahasang moral o doktrinal na pagpapaliwanag.'
  naturalness: Hindi ganap na natural sa naratibong Filipino ang “At patuloy niyang sinasabi,” sapagkat ang kasalukuyang anyong “sinasabi” ay maaaring magmungkahi na nagaganap ang pagsasalita sa kasalukuyan. Ang imperfect na ἔλεγεν ay maaaring isalin sa payak na naratibong nakaraan sa Filipino nang hindi nawawala ang di-ganap na aspekto. Mas maayos din ang “hindi ako mula” kaysa “ako ay hindi mula.”
  terminology: Ang “ibaba/itaas,” “mundo,” at “mundong ito” ay angkop, malinaw, at pinananatili ang Johannine na paghahambing. Ang talababa tungkol sa “mundo” ay maingat at hindi nagdidikta ng mas makitid na pagbasa.
