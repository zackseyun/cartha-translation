base_translation:
  language: en
  yaml_path: translation/nt/john/008/023.yaml
  text: And he was saying to them[a], “You are from below; I am from above. You are from this world[b]; I am not from this world.”
translation:
  language: tl
  text: At sinabi niya sa kanila, “Kayo ay mula sa ibaba; ako ay mula sa itaas. Kayo ay mula sa mundong ito[a]; hindi ako mula sa mundong ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Juan, ang “mundo” ay madalas tumukoy hindi lamang sa pisikal na daigdig kundi pati sa kaayusan ng sangkatauhang hiwalay sa Diyos.
    reason: cultural_note
lexical_decisions:
- source_word: ἔλεγεν
  choice: patuloy niyang sinasabi
  rationale: Ipinahahayag ang aspektong di-ganap ng imperfect, na maaaring tumukoy sa nagpapatuloy na pagsasalita sa tagpong ito, habang nananatiling natural sa Filipino.
- source_word: Ὑμεῖς / ἐγὼ
  choice: Kayo / ako
  rationale: Pinanatili ang tahasang mga panghalip upang maipakita ang mariing paghahambing sa pagitan ng mga kausap ni Jesus at ng kanyang sarili.
- source_word: ἐκ τῶν κάτω
  choice: mula sa ibaba
  rationale: Pinananatili nito ang larawan ng pinagmulan o larangan at ang tuwirang salungatan sa “mula sa itaas,” nang hindi nililimitahan ang pahiwatig sa isang moral o pisikal na kahulugan lamang.
- source_word: ἐκ τῶν ἄνω
  choice: mula sa itaas
  rationale: Likas at maikli itong katapat ng “mula sa ibaba” at pinananatili ang patayong larawang mahalaga sa Juan.
- source_word: κόσμος
  choice: mundo
  rationale: Ang “mundo” ang malawak at karaniwang katumbas na nakapagdala kapwa ng kahulugang nilikhang daigdig at, ayon sa konteksto ni Juan, ng kaayusan ng sangkatauhang hiwalay sa Diyos.
- source_word: τούτου τοῦ κόσμου / τοῦ κόσμου τούτου
  choice: mundong ito
  rationale: Pinanatili ang demonstratibo at isinalin ang magkaibang ayos ng mga salitang Griyego sa iisang likas na pariralang Filipino.
- source_word: οὐκ εἰμὶ ἐκ τοῦ κόσμου τούτου
  choice: ako ay hindi mula sa mundong ito
  rationale: Pinananatili ang paulit-ulit na ἐκ bilang pahayag tungkol sa pinagmulan o larangan; hindi ito pinalitan ng “hindi kabilang,” na mas tuwirang nagsasaad ng kaugnayan.
theological_decisions:
- issue: Ang kahulugan ng paghahambing na “mula sa ibaba/mula sa itaas” at “mula sa mundong ito”
  choice: Pinanatili ang wika ng pinagmulan at larangan nang walang dagdag na pagpapaliwanag sa mismong talata.
  alternative: Maaaring tahasang gawing moral o gawing paghahambing ng makalangit at makalupang pinagmulan.
  rationale: Matalim ang pagkakaiba sa pagitan ni Jesus at ng kanyang mga kausap, ngunit hindi tahasang nililinaw ng Griyego rito ang lahat ng saklaw ng larawan. Ang literal ngunit natural na paghahambing ay nagpapanatili sa Kristolohikal na bigat at tunay na tensiyon ng pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “patuloy niyang sinasabi” upang marinig ang imperfect aspect; pinanatili ang simetrikong “mula sa ibaba / mula sa itaas” at “mula sa mundong ito.” Isang talababa lamang ang inilagay sapagkat ang alternatibong “mula sa kung ano ang nasa ibaba/itaas” ay hindi nagbibigay ng makabuluhang pagkakaibang natural sa Filipino.
