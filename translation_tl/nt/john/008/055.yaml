  source_fidelity: 'Tumpak na naipapahayag ng salin ang mga pangunahing ugnayan sa Griyego: hindi pagkakilala ng mga kausap sa Diyos, pagkakilala ni Jesus sa kanya, ang kondisyunal na pahayag tungkol sa pagiging sinungaling, at ang pag-iingat/pagtupad ni Jesus sa salita ng Diyos. Ang “hindi ninyo siya nakilala” ay katanggap-tanggap na salin ng perpektong ἐγνώκατε; maayos ding itinatala ng talababa ang kasalukuyang-diwang alternatibo.'
  naturalness: Natural at marangal ang modernong Filipino Tagalog. Ang “kilala ko siya,” “magiging sinungaling akong tulad ninyo,” at “tinutupad ko ang kanyang salita” ay malinaw at angkop sa matalim na retorika ng talata.
  terminology: Ang “kilala,” “sinungaling,” “salita,” at “tinutupad” ay angkop na mga katumbas. Pinananatili ng “salita” ang Johannine na lawak ng λόγος, at ang “tinutupad” ay isang ligtas na salin ng τηρῶ, na sinusuportahan pa ng talababa.
