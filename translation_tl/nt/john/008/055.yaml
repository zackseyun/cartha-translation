id: JHN.8.55
reference: John 8:55
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ οὐκ ἐγνώκατε αὐτόν, ἐγὼ δὲ οἶδα αὐτόν· κἂν εἴπω ὅτι οὐκ οἶδα αὐτόν, ἔσομαι ὅμοιος ⸀ὑμῖν ψεύστης· ἀλλὰ οἶδα αὐτὸν καὶ τὸν λόγον αὐτοῦ τηρῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/055.yaml
  text: Yet you have not known him[a], but I know him. If I were to say that I do not know him, I would be a liar like you. But I do know him[c][b], and I keep his word.
translation:
  language: tl
  text: Ngunit hindi ninyo siya nakilala[a], samantalang kilala ko siya. Kung sasabihin kong hindi ko siya kilala[b], magiging sinungaling akong tulad ninyo. Ngunit kilala ko siya at tinutupad ko ang kanyang salita.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hindi ninyo siya kilala.” Perpekto ang anyo ng pandiwang Griyego at maaaring magbigay-diin sa patuloy nilang kalagayan ng hindi pagkakilala sa kanya.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Kung sabihin kong.” Ipinapalagay ng pangungusap sa Griyego ang isang kalagayan; ipinakikita ng “kung sasabihin kong” ang diwang ito sa natural na Tagalog.
    reason: lexical_alternative
  - marker: c
    text: Ang “tinutupad” ay maaari ring isaling “sinusunod” o “iniingatan.” Sa Juan, madalas na kasama sa pandiwa ang diwa ng matapat na pagsunod at pag-iingat sa salita ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώκατε
  choice: nakilala
  rationale: Ang aspektong perpekto ay tumutukoy sa hindi nila pagkakilala sa Diyos na humantong sa kasalukuyan nilang kalagayan. Likas sa Tagalog ang “hindi ninyo siya nakilala,” habang inilalahad sa talababa ang posibleng pagbibigay-diin sa patuloy na kawalan ng pagkakilala.
- source_word: οἶδα
  choice: kilala ko
  rationale: Bagaman perpekto ang anyong Griyego, pangkasalukuyang statibo ang kahulugan nito. Mas natural sa Tagalog ang “kilala ko” kaysa “nalalaman ko” kapag personal na pagkakilala ang tinutukoy.
- source_word: κἂν εἴπω
  choice: Kung sasabihin kong
  rationale: Ipinahahayag nito ang isang ipinapalagay na kalagayan. Ang anyong “kung sasabihin kong” ay malinaw at likas sa modernong Tagalog nang hindi ginagawang tahasang salungat sa katotohanan ang kondisyon.
- source_word: ἔσομαι
  choice: magiging
  rationale: Pinananatili nito ang anyong panghinaharap ng Griyego at natural ding nagsasaad sa Tagalog ng magiging bunga ng ipinapalagay na pahayag.
- source_word: ὅμοιος ὑμῖν
  choice: tulad ninyo
  rationale: Tuwiran at natural nitong pinananatili ang matalim na paghahambing ni Jesus sa kanyang mga kausap.
- source_word: ψεύστης
  choice: sinungaling
  rationale: Tumutukoy ang pangngalan sa isang taong nagsisinungaling, hindi lamang sa isang taong nagkakamali.
- source_word: τὸν λόγον αὐτοῦ
  choice: ang kanyang salita
  rationale: Pinananatili ng “salita” ang bokabularyong katangian ng Juan at hinahayaang saklawin kapwa ang sinabi ng Diyos at ang kanyang ipinahayag na mensahe.
- source_word: τηρῶ
  choice: tinutupad ko
  rationale: Natural sa Tagalog ang “tinutupad” para sa matapat na pag-iingat at pagsunod sa salita ng Diyos. Hindi nito nililimitahan ang diwa sa mekanikal na pagsunod lamang; binabanggit sa talababa ang iba pang posibleng salin.
- source_word: καὶ ... δὲ ... ἀλλὰ
  choice: Ngunit ... samantalang ... Ngunit
  rationale: 'Ipinakikita ng mga pang-ugnay ang sunod-sunod na pagsalungat: ang kawalan nila ng pagkakilala, ang pagkakilala ni Jesus, at ang kaibahan ng ipinapalagay na kasinungalingan sa aktuwal niyang katapatan.'
theological_decisions:
- issue: Ang natatanging pag-angkin ni Jesus na kilala niya ang Diyos, taliwas sa kanyang mga kausap
  choice: Tuwirang isinalin bilang personal at tunay na pagkakilala sa Diyos, kasama ng matapat na pagtupad sa kanyang salita.
  alternative: Dagdagan ang salin upang tahasang ipaliwanag ang banal na pagiging Anak, o pahinain ang “kilala” tungo sa payak na pagkakaroon lamang ng kaalaman.
  rationale: Matalim ang paghahambing sa mismong talata. Dapat itong panatilihin nang hindi nagdaragdag ng doktrinal na paliwanag at nang hindi rin pinahihina ang pag-angkin ni Jesus.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “kilala” para sa personal na pagkakilala, “sinungaling” upang panatilihin ang tuwirang pagsaway, at “tinutupad” bilang malinaw na katumbas ng matapat na pag-iingat at pagsunod. Lahat ng panandang talababa ay inilagay sa mismong teksto.
