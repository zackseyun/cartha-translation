  text: Whoever has received his testimony has certified that God is true[a].
translation:
  language: tl
  text: Ang tumanggap ng kanyang patotoo ay nagpatunay na totoo ang Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “ay naglagay ng kanyang tatak bilang patunay na totoo ang Diyos.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαβὼν
  choice: Ang tumatanggap
  rationale: Ang artikulo at participle ay ginagamit bilang pangngalan at tumutukoy sa sinumang tumatanggap. Likas sa modernong Tagalog ang pangkasalukuyang anyo para sa isang pangkalahatang pahayag; hindi nito ipinahihiwatig na minsanan lamang ang pagtanggap.
- source_word: αὐτοῦ
  choice: kanyang
  rationale: Tumutukoy ito sa naunang binanggit sa konteksto—ang nagmula sa langit, ang Anak—na siyang nagbibigay ng patotoo.
- source_word: μαρτυρίαν
  choice: patotoo
  rationale: Pinananatili nito ang diwang legal at temang saksi/patotoo sa Juan, at karaniwan itong nauunawaan sa Tagalog.
- source_word: ἐσφράγισεν
  choice: nagpapatunay
  rationale: Ang literal na diwa ay paglalagay ng tatak o selyo, ngunit metaporikal itong nangangahulugang pagpapatibay o pagpapatunay. Malinaw at natural ang 'nagpapatunay'; inilalagay sa talababa ang mas literal na larawan.
- source_word: ὅτι
  choice: na
  rationale: Ipinakikilala nito ang nilalaman ng pinatutunayan, hindi ang dahilan.
- source_word: ὁ θεὸς
  choice: ang Diyos
  rationale: Tuwirang definite na simuno ito at hindi nangangailangan ng pagpapalawak.
- source_word: ἀληθής
  choice: totoo
  rationale: Pinananatili nito ang malawak na diwa ng katotohanan sa Juan, habang maaari ring ipahiwatig sa konteksto na ang Diyos ay mapagkakatiwalaan at nagsasabi ng totoo.
theological_decisions:
- issue: Metaporikal na diwa ng pagseselyo
  choice: nagpapatunay
  alternative: nilagyan ng kanyang tatak bilang pagpapatunay
  rationale: Ipinahahayag ng talata na ang pagtanggap sa patotoo ng Anak ay pagkilala at pagpapatibay na totoo ang Diyos. Iniiwasan ng pangunahing salin ang malabong literal na idyoma, habang pinananatili ng talababa ang orihinal na larawan.
- issue: Saklaw ng ἀληθής
  choice: totoo
  alternative: mapagkakatiwalaan / nagsasabi ng totoo
  rationale: Hindi dapat paliitin ang salita sa isang katangiang lamang. Ang 'totoo' ay nagpapanatili sa posibleng saklaw na truthful, reliable, at true, ayon sa konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Ginamit ang 'patotoo' para sa Johannine witness motif at 'nagpapatunay' upang malinaw na maipahayag ang metapora ng pagseselyo. Ang marker na [a] ay nasa pangunahing teksto.
