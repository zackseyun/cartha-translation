base_translation:
  language: en
  yaml_path: translation/nt/john/003/036.yaml
  text: The one who believes in the Son has eternal life; but the one who disobeys the Son will not see life, but the wrath of God remains on him.
translation:
  language: tl
  text: Ang sumasampalataya sa Anak ay may buhay na walang hanggan. Ngunit ang hindi sumusunod sa Anak[a] ay hindi makakakita ng buhay; ngunit nananatili sa kanya ang poot ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “ang tumatangging manampalataya sa Anak.” Ang pandiwang Griyego ay maaaring magpahiwatig ng pagtangging manampalataya gayundin ng hindi pagsunod.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πιστεύων
  choice: ang sumasampalataya
  rationale: Ang articular present participle ay isang pangkalahatang pagtukoy sa sinumang patuloy na nananampalataya; natural at tapat sa pandiwang diwa ang “ang sumasampalataya.”
- source_word: εἰς τὸν υἱόν
  choice: sa Anak
  rationale: Sa Filipino, ang “sumasampalataya sa Anak” ay natural na nagpapahayag ng pananampalatayang nakatuon at ipinagkakatiwala sa Anak, nang hindi pilit na ginagaya ang Griyegong pang-ukol.
- source_word: τὸν υἱόν / τῷ υἱῷ
  choice: ang Anak / sa Anak
  rationale: Pinananatili ang titulong “Anak” nang hindi idinaragdag ang tahasang pagmamay-aring wala sa Griyego.
- source_word: ἔχει
  choice: ay may
  rationale: Tuwirang ipinapakita ng present indicative ang kasalukuyang pag-iral o pagtataglay ng buhay, hindi lamang isang pangakong para sa hinaharap.
- source_word: ζωὴν αἰώνιον
  choice: buhay na walang hanggan
  rationale: Ito ang malinaw, nakasanayan, at angkop na salin sa kontekstong Juaniko, na nagpapahiwatig kapwa ng walang katapusang tagal at natatanging uri ng buhay.
- source_word: ὁ δὲ ἀπειθῶν
  choice: ang hindi sumusunod
  rationale: Sinasaklaw nito ang pangunahing diwa ng pagsuway ng ἀπειθέω habang nananatiling natural sa modernong Filipino. Dahil maaari rin itong mangahulugang pagtangging manampalataya, inilalahad ang kahulugang iyon sa talababa.
- source_word: οὐκ ὄψεται ζωήν
  choice: ay hindi makakakita ng buhay
  rationale: Pinananatili ang matalinghagang ekspresyong Juaniko na “makakita ng buhay” sa halip na palitan ito ng “magkaroon” o “maranasan.”
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: ang poot ng Diyos
  rationale: Tuwiran at hindi pinalalambot ng “poot ng Diyos” ang pahayag tungkol sa banal na paghatol.
- source_word: μένει
  choice: nananatili
  rationale: Pinananatili nito ang kasalukuyan at nagpapatuloy na kalagayan, gayundin ang mahalagang Juanikong diwa ng μένω.
- source_word: ἐπ’ αὐτόν
  choice: sa kanya
  rationale: Natural na Filipino ito para sa poot na nananatili sa isang tao; ang “kanya” ay pangkalahatan at hindi limitado sa lalaki.
theological_decisions:
- issue: Kahulugan ng ἀπειθῶν bilang kasalungat ng πιστεύων
  choice: “ang hindi sumusunod” sa pangunahing teksto, na may “tumatangging manampalataya” sa talababa
  alternative: ang tumatangging manampalataya; ang hindi nananampalataya; ang sumusuway
  rationale: Maaaring tumukoy ang pandiwa sa pagsuway at sa pagtangging manampalataya. Hindi ito nilimitahan sa intelektuwal na kawalan ng paniniwala; pinananatili ng teksto at talababa ang ugnayan at tensiyon ng pananampalataya at pagsunod.
- issue: Panahunan ng buhay na walang hanggan at ng poot ng Diyos
  choice: Kasalukuyang taglay ang buhay at kasalukuyang nananatili ang poot, habang ang hindi pagkakita sa buhay ay nasa hinaharap
  alternative: Buhay at poot na kapwa para lamang sa hinaharap
  rationale: Present indicative ang ἔχει at μένει, samantalang future ang ὄψεται. Pinananatili ang pagkakaibang ito nang hindi pinag-iisa sa isang sistemang puro panghinaharap.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang tradisyonal ngunit buhay pa ring pariralang “buhay na walang hanggan” at ang tuwirang “poot ng Diyos.”
