  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Σὺ εἶ ὁ διδάσκαλος τοῦ Ἰσραὴλ καὶ ταῦτα οὐ γινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/010.yaml
  text: Jesus answered and said to him[a], “You are the teacher of Israel, and you do not know these things?”
translation:
  language: tl
  text: Sumagot si Jesus at sinabi sa kanya, “Ikaw ang guro[a] ng Israel, at hindi mo alam ang mga ito?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “isang guro ng Israel.” Sa Griyego, “ang guro” ang pagkakasabi, na malamang ay nagbibigay ng matalim na retorikal na diin sa pagtawag sa kanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν αὐτῷ
  choice: Sumagot si Jesus sa kanya
  rationale: Ang tambalang pormulang Griyego na literal na ‘sumagot at sinabi sa kanya’ ay likas na naipapahayag sa modernong Tagalog sa pamamagitan ng ‘sumagot … sa kanya’; ang pagdaragdag ng ‘at sinabi’ ay magiging mabigat at hindi kailangan.
- source_word: Σὺ
  choice: Ikaw
  rationale: Pinananatili ang tahasang panghalip sa unahan upang maipahayag ang diin ng Griyego.
- source_word: ὁ διδάσκαλος
  choice: ang guro
  rationale: Pinananatili ng ‘ang guro’ ang tiyak na anyo ng parirala at ang matalim na retorikal na diin ng tanong.
- source_word: τοῦ Ἰσραὴλ
  choice: ng Israel
  rationale: Tuwirang ipinapahayag ang genitibo at ang kinatawang katayuan ni Nicodemo sa bayan ng Israel, hindi lamang ang lokasyon niya.
- source_word: ταῦτα
  choice: ang mga bagay na ito
  rationale: Malinaw at malawak na tumutukoy sa itinuro ni Jesus sa naunang usapan.
- source_word: οὐ γινώσκεις
  choice: hindi mo alam
  rationale: Pinananatili ang karaniwang kahulugan ng γινώσκω na ‘alam,’ habang ipinahihiwatig ng konteksto ang hindi pagkaunawa.
- source_word: καί
  choice: pero
  rationale: 'Sa retorikal na tanong, ang καί ay likas na may kontrastibong puwersa: sa kabila ng pagiging guro niya, hindi niya alam ang mga ito. Ang ‘pero’ ang natural na modernong Tagalog na nagpapanatili ng tensiyong iyon.'
theological_decisions:
- issue: Puwersa ng pagtawag kay Nicodemo bilang ὁ διδάσκαλος τοῦ Ἰσραήλ
  choice: ‘ang guro ng Israel,’ na pinananatili ang tiyak na puwersa
  alternative: ‘isang guro ng Israel’
  rationale: May tiyak na artikulo ang Griyego, kaya higit itong matalim kaysa sa simpleng pagsasabing isa lamang siya sa mga guro. Pinananatili nito ang retorikal na pagsaway nang hindi nagdaragdag ng tiyak na opisyal na titulo.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang ‘pero’ upang malinaw at likas na maipahayag ang kontrastibong puwersa ng tanong. Inilagay ang talababa pagkatapos ng buong sipi upang hindi maputol ang daloy.
