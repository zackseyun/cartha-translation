  text: What is born of the flesh is flesh[b][a], and what is born of the Spirit is spirit.
translation:
  language: tl
  text: Ang ipinanganak mula sa laman ay laman[a], at ang ipinanganak mula sa Espiritu ay espiritu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Ang ipinanganak mula sa laman ay likas na pantao.” Sa ilang konteksto, ang salitang Griyego para sa “laman” ay maaaring tumukoy sa makasalanang kalikasan ng tao, ngunit dito ang pangunahing kaibahan ay sa pagitan ng likas na kapanganakan at ng kapanganakang mula sa Espiritu.'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “Ang ipinanganak mula sa Espiritu ay espirituwal.” Sa Griyego, literal itong “ay espiritu,” na nagpapanatili ng kaibahan sa uri o likas na katangian mula sa “laman.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ γεγεννημένον
  choice: ang ipinanganak
  rationale: Likas sa Tagalog ang pariralang ito at naipapahayag nito ang pangkalahatan at pangkategoryang diwa ng neuter na perfect passive participle, nang hindi ito nililimitahan sa isang partikular na tao.
- source_word: ἐκ
  choice: mula sa
  rationale: Malinaw nitong ipinapahayag ang pinagmulan sa konteksto ng kapanganakan at mas natural sa makabagong Tagalog kaysa sa literal ngunit maaaring malabong ibang anyo.
- source_word: σάρξ / σαρκὸς
  choice: laman
  rationale: Pinananatili nito ang salitang ginagamit ni Juan at ang paghahambing ng likas na kapanganakan at kapanganakang mula sa Espiritu, nang hindi agad ipinakahulugang ‘makasalanang kalikasan.’
- source_word: πνεύματος / πνεῦμά
  choice: Espiritu / espiritu
  rationale: Ang unang gamit ay tumutukoy sa Espiritu bilang pinagmulan kaya malaking titik ang ginamit. Ang ikalawa ay panaguring walang pantukoy at may kwalitatibong diwa, kaya maliit na titik ang ginamit upang mapanatili ang kaibahan ng pinagmulan at ng katangiang bunga nito.
- source_word: ἐστιν
  choice: ay
  rationale: Pinananatili ng payak na pang-ugnay ang maikli, mariin, at depinisyunal na kayarian ng pangungusap.
theological_decisions:
- issue: Kahulugan ng σάρξ sa unang sugnay
  choice: ‘laman’ bilang likas o pantao na larangan
  alternative: ‘makasalanang kalikasan’
  rationale: Bagaman maaaring magkaroon ng moral na diwa ang σάρξ sa ibang konteksto, pangunahing inihahambing dito ang kapanganakang pantao at ang kapanganakang mula sa Espiritu. Ang ‘laman’ ay hindi nagpapasok ng mas makitid na teolohikal na pagpapakahulugan.
- issue: Tinutukoy ng πνεῦμα sa panaguri ng ikalawang sugnay
  choice: maliit na titik na ‘espiritu’
  alternative: ‘Espiritu’ o ‘espirituwal’
  rationale: Ang panaguring pangngalan sa Griyego ay walang pantukoy at natural na may kwalitatibong diwa. Pinananatili ng ‘espiritu’ ang anyong pangngalan at ang kaibahan sa Espiritu na siyang pinagmulan, nang hindi lubusang binibigyang-kahulugan bilang pang-uring ‘espirituwal.’
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang balanseng magkatulad na kayarian ng dalawang sugnay upang mapanatili ang maikli at mariing estilo ng orihinal.
