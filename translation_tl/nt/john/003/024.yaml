  text: οὔπω γὰρ ἦν βεβλημένος εἰς τὴν φυλακὴν ⸀ὁ Ἰωάννης.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/024.yaml
  text: For John had not yet been thrown into prison[a].
translation:
  language: tl
  text: Sapagkat hindi pa naibilanggo si Juan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibig sabihin, si Juan Bautista.
    reason: cross_reference
lexical_decisions:
- source_word: οὔπω
  choice: hindi pa
  rationale: Ipinapahayag nito na hanggang sa puntong iyon ng salaysay ay hindi pa nangyayari ang pagkabilanggo.
- source_word: γὰρ
  choice: sapagkat
  rationale: Nagbibigay ito ng paliwanag na kaugnay ng naunang salaysay; malinaw at natural itong naipapahayag ng “sapagkat.”
- source_word: ἦν βεβλημένος
  choice: naibilanggo
  rationale: Ang anyong periphrastic pluperfect passive ay tumutukoy sa isang pagkilos na hindi pa natatapos bago ang puntong tinutukoy. Sa Filipino, likas at maikli itong ipinahahayag ng “hindi pa naibilanggo”; iniiwasan ng literal na “naihagis” ang di-likas na larawan sa konteksto ng bilangguan.
- source_word: εἰς τὴν φυλακήν
  choice: bilanggo
  rationale: Sa kontekstong ito, ang φυλακή ay tumutukoy sa bilangguan o pagkakakulong. Nasa pandiwang “naibilanggo” na ang direksiyon at kalagayang ipinahihiwatig ng parirala.
- source_word: ὁ Ἰωάννης
  choice: si Juan
  rationale: Juan lamang ang tahasang pangalan sa Griyego. Ang pantukoy na “si” ang likas na pananda sa pangalang pantangi sa Filipino.
theological_decisions:
- issue: Pagkakakilanlan ni Ἰωάννης
  choice: Juan
  alternative: Juan Bautista
  rationale: Bagaman malinaw sa konteksto na si Juan Bautista ang tinutukoy, “Juan” lamang ang nasa pangunahing tekstong Griyego. Pinananatili ito sa teksto, at inilalagay ang paglilinaw sa talababa upang hindi magdagdag sa mismong talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ang “naibilanggo” ay mas natural kaysa sa literal na “inihagis sa bilangguan” at tumpak na naghahatid ng diwang pasibo at temporal ng Griyego.
