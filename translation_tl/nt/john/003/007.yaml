id: JHN.3.7
reference: John 3:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: μὴ θαυμάσῃς ὅτι εἶπόν σοι Δεῖ ὑμᾶς γεννηθῆναι ἄνωθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/007.yaml
  text: Do not be amazed that I told you[b][a], ‘You must be born from above.’
translation:
  language: tl
  text: Huwag kang magtaka na sinabi ko sa iyo[b], “Kailangan kayong ipanganak mula sa itaas[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ipanganak na muli.” Ang salitang Griyego na ἄνωθεν ay maaaring mangahulugang “mula sa itaas” o “muli/panibago.”
    reason: alternative_reading
  - marker: b
    text: Ang “sa iyo” ay isahan, ngunit ang “kayong” ay maramihan sa Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ θαυμάσῃς
  choice: Huwag kang magtaka
  rationale: Ang μή na sinusundan ng aorist subjunctive ay nagpapahayag ng pagbabawal. Ang “Huwag kang magtaka” ay natural sa makabagong Tagalog at angkop sa diwa ng θαυμάζω nang hindi gumagamit ng mas matinding salitang maaaring lumabis sa kahulugan.
- source_word: ὅτι
  choice: na
  rationale: Ipinakikilala ng ὅτι rito ang nilalaman ng sinabi ni Jesus, kaya ang pang-ugnay na “na” ang natural na katumbas sa Tagalog.
- source_word: εἶπόν σοι
  choice: sinabi ko sa iyo
  rationale: Tumpak at likas na katumbas ito ng pandiwa at ng isahang panghalip na σοι.
- source_word: Δεῖ
  choice: Kailangan
  rationale: Pinananatili ng “Kailangan” ang diwa ng pangangailangan o pagiging kinakailangan na ipinahahayag ng Δεῖ.
- source_word: ὑμᾶς
  choice: kayong
  rationale: Malinaw na ipinakikita ng “kayong” na maramihan ang ὑμᾶς, kaiba sa isahang “sa iyo” na nauna.
- source_word: γεννηθῆναι
  choice: ipanganak
  rationale: Ang “ipanganak” ang karaniwan at nauunawaang katumbas ng passive infinitive na γεννηθῆναι sa kontekstong ito.
- source_word: ἄνωθεν
  choice: mula sa itaas
  rationale: Maaaring mangahulugan ang ἄνωθεν ng “mula sa itaas” o “muli/panibago.” Ang “mula sa itaas” ay nagpapanatili sa diin ng Ebanghelyo ni Juan sa pinagmumulang nasa itaas, habang inilalagay sa talababa ang tunay na alternatibong kahulugan.
theological_decisions:
- issue: Kahulugan ng ἄνωθεν sa pahayag tungkol sa kapanganakan
  choice: mula sa itaas
  alternative: muli; panibago
  rationale: Sadyang may higit sa isang posibleng diwa ang salita sa Juan 3. Pinili sa pangunahing teksto ang “mula sa itaas” dahil sa gamit ni Juan at sa diin sa kapanganakang nagmumula sa Diyos, ngunit hindi inalis ang mahalagang alternatibong “muli.”
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “kang/sa iyo” at “kayong” upang hayagang mapanatili ang paglipat mula sa isahan tungo sa maramihan, na madaling maipahayag sa Tagalog.
