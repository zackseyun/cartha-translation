id: JHN.3.1
reference: John 3:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἦν δὲ ἄνθρωπος ἐκ τῶν Φαρισαίων, Νικόδημος ὄνομα αὐτῷ, ἄρχων τῶν Ἰουδαίων·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/001.yaml
  text: There was a man from the Pharisees named Nicodemus[a], a ruler of the Jews.
translation:
  language: tl
  text: May isang lalaking kabilang sa mga Pariseo na ang pangalan ay Nicodemo. Isa siyang pinuno ng mga Judio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “pinuno ng mga taga-Judea.” Ang salitang Griyego ay maaaring tumukoy sa mga Judio sa pangkalahatan o, sa ilang konteksto, mas tiyak sa mga taga-Judea o sa mga awtoridad na Judio.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦν δὲ
  choice: May isang
  rationale: Ipinakikilala nito ang isang bagong tauhan at eksena. Likas sa Tagalog ang “May isang” at hindi nito dinaragdagan ng tahasang temporal na “ngayon” ang banayad na pang-ugnay na δέ.
- source_word: ἄνθρωπος
  choice: lalaki
  rationale: Tumutukoy ang pangngalan sa isang tiyak na lalaking indibidwal, si Nicodemo.
- source_word: ἐκ τῶν Φαρισαίων
  choice: kabilang sa mga Pariseo
  rationale: Ipinahihiwatig ng ἐκ na si Nicodemo ay nagmula o kabilang sa pangkat ng mga Pariseo; natural at malinaw sa Tagalog ang “kabilang sa.”
- source_word: Νικόδημος ὄνομα αὐτῷ
  choice: na ang pangalan ay Nicodemo
  rationale: Natural na pagpapahayag sa Tagalog ng Griyegong pormula sa pagbibigay-pangalan. Ginamit ang nakaugaliang anyong Tagalog na “Nicodemo.”
- source_word: ἄρχων
  choice: pinuno
  rationale: Ang ἄρχων ay taong may katungkulan at awtoridad. Malinaw at dignified ang “pinuno” nang hindi labis na tinutukoy ang eksaktong opisina.
- source_word: τῶν Ἰουδαίων
  choice: ng mga Judio
  rationale: Sa kontekstong ito, pinakamalamang na tumutukoy ito sa pamumunong Judio, ngunit maaaring magkaroon ang salitang Griyego ng mas tiyak na kahulugang “mga taga-Judea”; pinanatili ang mas malawak na salin sa teksto at ang alternatibo sa talababa.
theological_decisions:
- issue: Saklaw ng Ἰουδαίων sa konteksto ng Ebanghelyo ni Juan
  choice: ng mga Judio
  alternative: ng mga taga-Judea / pinuno ng mga awtoridad na Judio
  rationale: Dahil ipinakikilalang Pariseo at pinuno si Nicodemo, malamang na ang diin ay nasa awtoridad sa pamayanang Judio. Gayunman, hindi ganap na nilulutas ng salin ang maaaring etniko, panrehiyon, o pampamunuang saklaw ng Ἰουδαίων; binabanggit sa talababa ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Hinati sa dalawang pangungusap upang maiwasan ang mabigat at hindi likas na sunod-sunod na pariralang panuring, habang pinananatili ang lahat ng impormasyon ng Griyego.
