  text: For everyone who practices evil hates the light and does not come to the light[b][a], lest his works be exposed.
translation:
  language: tl
  text: Sapagkat ang sinumang gumagawa ng masama ay napopoot sa liwanag at hindi lumalapit sa liwanag, upang hindi malantad[a] ang kanyang mga gawa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “masaway” o “mapatunayang mali.” Maaaring saklawin ng pandiwang Griyego ang paglalantad ng masamang gawa, pagpapakita ng pagkakamali o pagkakasala, o pagsaway.
    reason: lexical_alternative
  - marker: b
    text: 'Ang “kanyang” ay salin ng isahang panlalaking panghalip sa Griyego, ngunit pangkalahatan ang tinutukoy nito: sinumang gumagawa ng masama.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς γὰρ ὁ
  choice: Sapagkat ang bawat
  rationale: Pinananatili ng “Sapagkat” ang paliwanag na ugnayan ng γάρ sa naunang pahayag. Ang “ang bawat” ay natural na kumakatawan sa pangkalahatang pananalitang tumutukoy sa sinumang inilalarawan ng kasunod na pandiwari.
- source_word: φαῦλα πράσσων
  choice: gumagawa ng masama
  rationale: May malinaw na moral na diwa ang φαῦλα sa konteksto ng liwanag at dilim. Ipinahihiwatig ng kasalukuyang pandiwari ang gawaing karaniwan o patuloy na ginagawa; sa Tagalog, natural itong naipahahayag ng “gumagawa ng masama” nang hindi dinaragdagan nang labis ang teksto.
- source_word: μισεῖ
  choice: napopoot
  rationale: Ipinapanatili ng “napopoot” ang matinding pagtutol na nasa μισεῖ at ang marangal ngunit nauunawaang himig ng talata.
- source_word: τὸ φῶς
  choice: ang liwanag
  rationale: Pinananatili ang literal at metaporikal na larawan ni Juan; hindi ito pinalitan ng paliwanag gaya ng “katotohanan” o “kapahayagan.”
- source_word: οὐκ ἔρχεται πρὸς τὸ φῶς
  choice: hindi lumalapit sa liwanag
  rationale: Ang “lumalapit” ay natural sa Tagalog para sa pagkilos patungo sa liwanag at pinananatili ang larawan ng kusang pag-iwas dito.
- source_word: ἵνα μὴ
  choice: upang hindi
  rationale: Malinaw nitong ipinahahayag ang negatibong layunin o pag-iwas na dala ng ἵνα μή.
- source_word: ἐλεγχθῇ
  choice: malantad
  rationale: Sa larawan ng liwanag na nagbubunyag, ang “malantad” ang pinakamalinaw na pangunahing salin. Hindi nito isinasara ang mas malawak na saklaw ng pandiwa, na maaari ring magpahiwatig ng pagsaway o pagpapatunay ng pagkakamali.
- source_word: τὰ ἔργα αὐτοῦ
  choice: ang kanyang mga gawa
  rationale: Ang “mga gawa” ay malapit sa ἔργα at nagpapanatili ng mahalagang bokabularyo ni Juan. Ang “kanyang” ay likas na walang tiyak na kasarian sa Tagalog at maayos na kumakatawan sa pangkalahatang isahan ng Griyego.
theological_decisions:
- issue: Kahulugan ng ἐλεγχθῇ kaugnay ng liwanag
  choice: malantad
  alternative: masaway; mapatunayang mali o nagkasala
  rationale: Nangingibabaw sa konteksto ang larawan ng liwanag na naghahayag ng mga gawa. Gayunman, inilalagay sa talababa ang iba pang tunay na diwa ng pandiwa upang hindi mawala ang posibilidad ng moral na pagsaway o pagpapatunay ng kasalanan.
- issue: Pangkalahatang pananalita sa anyong panlalaking isahan
  choice: ang kanyang mga gawa
  alternative: ang kanilang mga gawa
  rationale: Isahan ang kayarian ng Griyego at tumutukoy sa sinumang gumagawa ng masama. Napananatili ng “kanyang” ang isahan nang hindi nagpapahiwatig ng likas na kasarian sa Tagalog.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang payak ngunit mabigat na larawan ng “liwanag,” iniwasan ang sobrang teknikal o denominasyonal na pananalita, at ginamit ang “napopoot” bilang dignified na katumbas ng matinding μισεῖ.
