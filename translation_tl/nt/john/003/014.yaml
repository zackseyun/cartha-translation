    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: kung paanong
  rationale: Likas na panandang Filipino para sa paghahambing na tinutumbasan ng “gayundin” sa kasunod na sugnay.
- source_word: ὕψωσεν
  choice: itinaas
  rationale: Tuwirang inilalarawan ang pag-angat ni Moises sa ahas at pinananatili ang pagkakatulad sa kaparehong pandiwa para sa Anak ng Tao.
- source_word: ὄφιν
  choice: ahas
  rationale: Karaniwan, malinaw, at angkop sa makabagong Filipino para sa ὄφις at sa salaysay ng Mga Bilang 21.
- source_word: ἐν τῇ ἐρήμῳ
  choice: sa ilang
  rationale: Maikli at marangal na katumbas ng pook na ilang na dinaanan ng Israel; hindi nito nililimitahan ang kahulugan sa mabuhanging disyerto.
- source_word: οὕτως
  choice: gayundin
  rationale: Malinaw na ipinapakita ang katumbas na bahagi ng paghahambing na “kung paanong … gayundin.”
- source_word: ὑψωθῆναι
  choice: itaas
  rationale: Pinananatili ang pisikal na diwa ng pag-angat at hinahayaang umalingawngaw rin ang diwa ng pagdakila, nang hindi nilulutas ang sinadyang dobleng kahulugan ni Juan.
- source_word: δεῖ
  choice: kailangang
  rationale: Ipinahahayag ang pangangailangan o banal na katiyakan, hindi lamang isang posibilidad o payak na hula.
- source_word: υἱὸν τοῦ ἀνθρώπου
  choice: Anak ng Tao
  rationale: Itinatag na titulong biblikal na nagpapanatili sa mga pahiwatig nito sa Daniel at sa Ebanghelyo ni Juan.
theological_decisions:
- issue: Dobleng kahulugan ng ὑψόω sa Juan
  choice: Gamitin ang “itinaas/itaas” sa dalawang paglitaw.
  alternative: “itindig” para sa ahas at “dakilain” para sa Anak ng Tao
  rationale: Ang magkatulad na salin ay nagpapanatili sa tahasang paghahambing at sa tensiyon sa pagitan ng pisikal na pagtataas sa krus at ng pagdakila sa Anak ng Tao.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang magkatambal na “kung paanong … gayundin” upang maging malinaw ang paghahambing, at ang “itaas” sa parehong kilos upang mapanatili ang pag-uugnay at sinadyang kalabuan ng orihinal.
