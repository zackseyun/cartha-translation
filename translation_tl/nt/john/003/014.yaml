  text: And just as Moses lifted up the serpent in the wilderness[a], so the Son of Man must be lifted up[b],
translation:
  language: tl
  text: At kung paanong itinaas ni Moises ang ahas sa ilang[a], gayon din kailangang itaas ang Anak ng Tao[b],
  philosophy: optimal-equivalence
