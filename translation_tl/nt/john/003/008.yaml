  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τὸ πνεῦμα ὅπου θέλει πνεῖ, καὶ τὴν φωνὴν αὐτοῦ ἀκούεις, ἀλλ’ οὐκ οἶδας πόθεν ἔρχεται καὶ ποῦ ὑπάγει· οὕτως ἐστὶν πᾶς ὁ γεγεννημένος ἐκ τοῦ πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/008.yaml
  text: The wind blows where it wishes[a], and you hear its sound, but you do not know where it comes from and where it goes[b]. So it is with everyone who has been born of the Spirit.
translation:
  language: tl
  text: Umiihip ang hangin kung saan nito ibig humihip[a], at naririnig mo ang tunog nito[b], ngunit hindi mo alam kung saan ito nagmumula at kung saan ito patungo. Gayon ang bawat taong ipinanganak mula sa Espiritu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego na pneuma ay maaaring mangahulugang “hangin” o “espiritu.” Iisang salita ang ginamit sa dalawang bahagi ng talata, kaya may paglalaro sa kahulugan na hindi lubos na matutumbasan sa Filipino.
    reason: lexical_alternative
  - marker: b
    text: O “tinig” sa halip na “tunog”; maaaring mangahulugan ng alinman ang salitang Griyego, ngunit dito ay tumutukoy ito sa naririnig na epekto ng hangin.
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα (unang gamit)
  choice: hangin
  rationale: Ang pagkakaugnay nito sa πνεῖ (“umiihip”) at sa naririnig na φωνή ay malinaw na tumutukoy sa hangin, habang pinananatili sa talababa ang paglalaro sa kahulugan ng salitang Griyego.
- source_word: ὅπου θέλει
  choice: kung saan nito nais
  rationale: Ipinahahayag nito ang diwang pagkukusa o pagnanais at pinananatili ang bahagyang personipikasyon ng hangin nang hindi nagiging makaluma.
- source_word: πνεῖ
  choice: umiihip
  rationale: Ito ang natural na pandiwang Filipino para sa pagkilos ng hangin sa kontekstong ito.
- source_word: φωνήν
  choice: tunog
  rationale: Bagaman maaari rin itong mangahulugang “tinig,” ang “tunog” ang pinakanatural dahil hangin ang tinutukoy sa unang bahagi.
- source_word: οὐκ οἶδας πόθεν ἔρχεται καὶ ποῦ ὑπάγει
  choice: hindi mo alam kung saan ito nanggagaling at kung saan ito patungo
  rationale: Likas nitong naihahayag sa Filipino ang magkatambal na ideya ng pinagmulan at patutunguhan.
- source_word: οὕτως ἐστίν
  choice: Gayon din
  rationale: Maikli at natural itong nagpapakilala sa paghahambing sa pagitan ng hangin at ng taong ipinanganak mula sa Espiritu.
- source_word: πᾶς ὁ γεγεννημένος
  choice: bawat taong ipinanganak
  rationale: Inihahayag nito ang pangkalahatang saklaw ng parirala at ang kalagayang bunga ng naganap nang kapanganakan.
- source_word: ἐκ τοῦ πνεύματος (huling gamit)
  choice: mula sa Espiritu
  rationale: Sa konteksto ng bagong kapanganakan sa Juan 3, tumutukoy ito sa Espiritu bilang pinagmulan; tuwirang naipapahayag ng “mula sa” ang puwersa ng ἐκ.
theological_decisions:
- issue: Ang dobleng kahulugan ng paulit-ulit na πνεῦμα
  choice: Isinalin ang unang gamit bilang “hangin” at ang huli bilang “Espiritu.”
  alternative: Isalin ang dalawang gamit nang pareho bilang “espiritu” o “hangin,” o panatilihing malabo ang unang gamit.
  rationale: Sinamantala ng Griyego ang saklaw ng kahulugan ng πνεῦμα. Ang unang bahagi ay larawan ng hanging umiihip at naririnig, samantalang ang huli ay tumutukoy sa Espiritu sa konteksto ng kapanganakang mula sa itaas. Hindi kayang likas na panatilihin ng Filipino ang buong paglalaro sa salita sa iisang katawagan, kaya nililinaw ito ng pangunahing teksto at pinananatili ang ugnayang leksikal sa talababa.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinili ang karaniwang “umiihip,” “tunog,” at “patungo,” habang iniwasan ang labis na teknikal o makalumang pananalita. Ang “Gayon din” ay nagpapanatili ng maikli at makahambing na himig ng orihinal.
