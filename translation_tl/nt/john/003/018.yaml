  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς αὐτὸν οὐ κρίνεται· ὁ ⸀δὲ μὴ πιστεύων ἤδη κέκριται, ὅτι μὴ πεπίστευκεν εἰς τὸ ὄνομα τοῦ μονογενοῦς υἱοῦ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/018.yaml
  text: The one who believes in him is not judged[a]; but the one who does not believe has already been judged[b], because he has not believed in the name of the one and only Son of God.
translation:
  language: tl
  text: Ang sumasampalataya sa kanya ay hindi hinahatulan[a]; ngunit ang hindi sumasampalataya ay nahatulan na, sapagkat hindi siya sumampalataya sa pangalan ng kaisa-isang Anak[b] ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hindi kinokondena”; gayundin, “kinondena na” sa kasunod na sugnay. Ang pandiwang Griyego na κρίνω ay maaaring mangahulugang “humatol” o, ayon sa konteksto, “kondena.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “natatanging Anak” o “bugtong na Anak.” Binibigyang-diin ng salitang Griyego ang pagiging kaisa-isa o natatangi ng Anak.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πιστεύων εἰς αὐτόν
  choice: ang sumasampalataya sa kanya
  rationale: Ang artikulong may pangkasalukuyang pandiwaring ginamit bilang pangngalan ay natural na naipapahayag sa Tagalog sa ganitong anyo. Pinananatili rin ng “sumasampalataya sa kanya” ang diwa ng pagtitiwalang nakatuon sa isang persona.
- source_word: οὐ κρίνεται
  choice: hindi hinahatulan
  rationale: Ang “hinahatulan” ay nagpapanatili sa saklaw ng κρίνω bilang paghatol, habang maaari rin itong magpahiwatig ng masamang hatol ayon sa konteksto nang hindi agad nililimitahan sa “kinokondena.”
- source_word: ὁ δὲ μὴ πιστεύων
  choice: ngunit ang hindi sumasampalataya
  rationale: Malinaw na ipinapakita ng “ngunit” ang pagsalungat na dala ng δέ, at natural na ginagawang pangngalang parirala ang pandiwari.
- source_word: ἤδη κέκριται
  choice: nahatulan na
  rationale: Ipinapahayag ng “na” ang nauna nang naganap na paghatol, at ng “nahatulan” ang kasalukuyang kalagayang bunga nito, na kaayon ng aspektong perpekto.
- source_word: ὅτι μὴ πεπίστευκεν
  choice: sapagkat hindi siya sumampalataya
  rationale: Ang “sapagkat” ay malinaw na nagbibigay ng dahilan. Sa likas na Tagalog, ipinapahayag ng sugnay ang hindi pagsampalatayang humantong sa nananatiling kalagayan, bagaman hindi mekanikal na ginagaya ang perpektong anyo ng Griyego.
- source_word: εἰς τὸ ὄνομα
  choice: sa pangalan
  rationale: Pinananatili ang konkretong idyomang Juanino na “sa pangalan,” na tumutukoy sa nahayag na pagkakakilanlan at awtoridad ng persona nang hindi ito ipinapaliwanag sa mismong teksto.
- source_word: τοῦ μονογενοῦς υἱοῦ
  choice: ng kaisa-isang Anak
  rationale: Ipinahahayag ng “kaisa-isang Anak” ang pagiging natatangi at walang kapantay ng Anak, nang hindi nagdaragdag ng biyolohikal na pahiwatig na hindi kinakailangan ng μονογενής.
- source_word: τοῦ θεοῦ
  choice: ng Diyos
  rationale: Tuwirang genitibong tumutukoy kung kaninong Anak ang tinutukoy.
theological_decisions:
- issue: Kahulugan ng κρίνω sa dalawang sugnay
  choice: hinahatulan / nahatulan na
  alternative: kinokondena / kinondena na
  rationale: Ang konteksto ng Juan 3:17–19 ay nagpapahintulot sa diwa ng kaparusahan o pagkondena, ngunit mas malawak ang leksikal na saklaw ng κρίνω. Pinananatili ng “hatol” ang tunay na posibilidad ng parehong paghatol at masamang pasiya, samantalang nililinaw ng talababa ang alternatibo.
- issue: Kahulugan ng μονογενής
  choice: kaisa-isang Anak
  alternative: natatanging Anak; bugtong na Anak
  rationale: Itinatampok ng pangunahing salin ang pagiging natatangi ng Anak. Inilalagay sa talababa ang tradisyonal na “bugtong na Anak” upang kilalanin ang kasaysayan ng pagsasalin nang hindi ipinipilit sa salitang Griyego ang mas makitid na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang “sumasampalataya,” “hinahatulan,” at “kaisa-isang Anak,” na madaling maunawaan ngunit angkop sa pagbasa ng Kasulatan. Hindi nilutas sa pangunahing teksto ang buong saklaw ng κρίνω; pinanatili ito at ipinaliwanag sa talababa.
