base_translation:
  language: en
  yaml_path: translation/nt/john/003/021.yaml
  text: But the one who does the truth comes to the light[a], so that his works may be revealed[d][c][b], because they have been done in God.
translation:
  language: tl
  text: Ngunit ang gumagawa ng katotohanan ay lumalapit sa liwanag,[a] upang mahayag ang kanyang mga gawa, na ginawa sa Diyos.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “gumagawa ng katotohanan.” Maaari ring “isinasagawa ang katotohanan” o “ginagawa ang totoo.”'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring: “upang mahayag ang kanyang mga gawa, sapagkat ang mga ito ay ginawa sa Diyos.” Maaaring ipakilala ng salitang Griyego ang nilalaman ng nahahayag o ang dahilan ng pagkahayag.'
    reason: alternative_reading
  - marker: c
    text: Ang “sa Diyos” ay maaari ring maunawaan bilang “ng Diyos” o “sa pamamagitan ng Diyos,” ngunit mas bukas ang pagkakasabi sa Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ποιῶν τὴν ἀλήθειαν
  choice: Ngunit ang gumagawa ng katotohanan
  rationale: Pinananatili ang banayad na pagsalungat ng δέ at ang sadyang kapansin-pansing idyomang Johannine na literal na ‘gumagawa ng katotohanan.’ Ipinahihiwatig ng kasalukuyang participle ang taong palagiang kinikilala sa gayong gawain.
- source_word: ἔρχεται πρὸς τὸ φῶς
  choice: ay lumalapit sa liwanag
  rationale: Ang ‘lumalapit sa’ ay natural na Filipino para sa kilos na patungo sa isang bagay at pinananatili ang larawan ng paglapit sa liwanag.
- source_word: ἵνα φανερωθῇ αὐτοῦ τὰ ἔργα
  choice: upang mahayag ang kanyang mga gawa
  rationale: Ang ‘upang’ ay nagpapahayag ng layunin ng ἵνα; ang ‘mahayag’ ay nagpapanatili sa pasibong diwa ng φανερωθῇ; at ang ‘mga gawa’ ay hindi paunang nagtatakda ng moral na uri ng ἔργα.
- source_word: ὅτι
  choice: na
  rationale: 'Binabasa ito bilang tagapagpakilala ng nilalaman ng nahahayag: nahahayag na ang mga gawa ay ginawa sa Diyos. Posible rin ang panandang sanhi na ‘sapagkat,’ kaya itinatala ang alternatibo.'
- source_word: ἐν θεῷ
  choice: sa Diyos
  rationale: Sa Filipino, ang ‘sa Diyos’ ang pinakamaikli at pinakabukas na katumbas na hindi tahasang naglilimita sa parirala sa ahensiya, paraan, o pakikipag-isa.
- source_word: ἐστιν εἰργασμένα
  choice: ay ginawa
  rationale: Ang ‘ay ginawa’ ay natural na pasibong Filipino. Sa kontekstong ito, sapat na ipinahihiwatig ng resultang nahahayag ang nananatiling bisa ng periphrastic perfect.
theological_decisions:
- issue: Kahulugan ng ποιῶν τὴν ἀλήθειαν
  choice: gumagawa ng katotohanan
  alternative: isinasagawa ang katotohanan; gumagawa ng totoo
  rationale: Pinananatili ng literal ngunit mauunawaang anyo ang teolohikal na diin ni Juan na ang katotohanan ay hindi lamang pinaniniwalaan kundi isinasagawa rin.
- issue: Gamit ng ὅτι
  choice: 'Nilalaman ng nahahayag: ‘na ang mga iyon ay ginawa…’'
  alternative: 'Dahilan ng pagkahayag: ‘sapagkat ginawa ang mga iyon…’'
  rationale: Maaaring ipakilala ng ὅτι ang nilalaman o dahilan. Ang pangunahing teksto ay pumipili ng nilalaman dahil tuwirang nakakabit ito sa ‘mahayag,’ ngunit pinananatili sa talababa ang tunay na alternatibo.
- issue: Diwa ng ἐν θεῷ
  choice: sa Diyos
  alternative: ng Diyos; sa pamamagitan ng Diyos; kaisa ng Diyos
  rationale: Hindi nilulutas ng salin ang bukas na ugnayan ng mga gawa sa Diyos—maaaring saklaw, ahensiya, paraan, o kaugnayan—na hindi rin tahasang nililimitahan ng Griyego.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Sadyang pinanatili ang bahagyang di-pangkaraniwang pariralang ‘gumagawa ng katotohanan’ upang maingatan ang natatanging idyoma at teolohikal na bigat ng teksto. Ang em dash ay tumutulong na gawing malinaw na ang kasunod na sugnay ay nilalaman ng nahahayag.
