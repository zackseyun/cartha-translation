  yaml_path: translation/nt/john/003/025.yaml
  text: Then a dispute arose between John's disciples and a Jew about purification[a].
translation:
  language: tl
  text: Pagkatapos nito, nagkaroon ng pagtatalo sa pagitan ng mga alagad ni Juan at ng isang Judio tungkol sa paglilinis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “pagpapadalisay” o “ritwal na paglilinis.” Ang salitang Griyego ay maaaring tumukoy sa paglilinis sa pangkalahatan, ngunit malamang na may ritwal na kahulugan dito.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο
  choice: nagkaroon
  rationale: Ipinahahayag ng pandiwa ang paglitaw o pagsisimula ng isang pangyayari; natural sa Tagalog ang “nagkaroon ng pagtatalo.”
- source_word: οὖν
  choice: Kaya
  rationale: Nag-uugnay ito sa naunang salaysay at maaaring magpahiwatig ng bunga o pagpapatuloy; pinananatili ng “Kaya” ang banayad na inferensiyal na ugnayan.
- source_word: ζήτησις
  choice: pagtatalo
  rationale: Maaaring tumukoy ang salita sa talakayan o kontrobersiya; ang “pagtatalo” ay malinaw at natural habang ipinahihiwatig ang tensiyon ng palitan.
- source_word: ἐκ τῶν μαθητῶν Ἰωάννου μετὰ Ἰουδαίου
  choice: ang mga alagad ni Juan at isang Judio
  rationale: Bagaman literal na may diwang “mula sa mga alagad ... kasama ng isang Judio,” ipinakikita ng konstruksiyon ang dalawang panig na sangkot sa pagtatalo. Pinananatili rin ang isahang bilang ng Ἰουδαίου.
- source_word: περὶ καθαρισμοῦ
  choice: tungkol sa paglilinis
  rationale: Saklaw ng καθαρισμός ang paglilinis o pagpapadalisay at malamang na may ritwal na pahiwatig sa konteksto; hindi labis na tinutukoy ng “paglilinis” ang eksaktong uri nito.
theological_decisions:
- issue: Kung tahasang tatawaging ritwal ang καθαρισμός
  choice: paglilinis
  alternative: ritwal na paglilinis; pagpapadalisay
  rationale: Ipinahihiwatig ng konteksto sa Juan ang ritwal o panrelihiyong paglilinis, ngunit hindi mismo nililinaw ng talata ang saklaw. Pinananatili ng pangunahing salin ang mas malawak na kahulugan, at inilalahad sa talababa ang malamang na ritwal na pahiwatig.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Judio” bilang karaniwang katawagan sa pagkakakilanlang etniko-relihiyoso, at iniwasang gawing maramihan ang isahang Ἰουδαίου.
