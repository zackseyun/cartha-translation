base_translation:
  language: en
  yaml_path: translation/nt/john/003/023.yaml
  text: John also was baptizing at Aenon near Salim[a], because there were many waters there[b], and people were coming and being baptized.
translation:
  language: tl
  text: Noon ay nagbabautismo rin si Juan sa Enon, malapit sa Salim, sapagkat maraming tubig doon,[a] at dumarating ang mga tao at binabautismuhan sila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sagana ang tubig doon”; literal, “maraming tubig ang naroon.”
    reason: lexical_alternative
  - marker: b
    text: Ang mga pandiwang isinaling “nagbabautismo” at “binabautismuhan” ay maaari ring isaling “naglulubog” at “inilulubog.” Pinanatili rito ang nakaugaliang terminong “bautismo,” na hindi, sa sarili nito, nagpapasya sa paraan ng pagsasagawa nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ καὶ ὁ Ἰωάννης βαπτίζων
  choice: Nagbabautismo rin si Juan
  rationale: Ang ἦν kasama ng kasalukuyang participle na βαπτίζων ay nagpapahayag ng nagpapatuloy na gawain sa nakaraan. Sa natural na salaysay sa Tagalog, sapat ang aspektong di-ganap ng “nagbabautismo”; ipinahahayag ng “rin” ang dagdag na diwa ng καί, samantalang hindi kailangang gawing tahasang panimula ang banayad na δέ.
- source_word: ἐν Αἰνὼν ἐγγὺς τοῦ Σαλείμ
  choice: sa Enon, malapit sa Salim
  rationale: Ang ἐν ay lokatibo rito, at ang ἐγγύς na may genitive ay nagsasaad ng kalapitan. Isinalin sa karaniwang anyong Filipino ang mga pangalang pook.
- source_word: ὅτι ὕδατα πολλὰ ἦν ἐκεῖ
  choice: sapagkat maraming tubig doon
  rationale: Ang ὅτι ay nagbibigay ng dahilan. Pinananatili ng “maraming tubig” ang plural na larawan ng ὕδατα πολλὰ habang natural pa rin sa Filipino at hindi ipinapalagay kung ito ay isang malaking anyong-tubig o maraming bukal/daluyan.
- source_word: παρεγίνοντο
  choice: dumarating ang mga tao
  rationale: Ang imperfect ay nagpapahiwatig ng nagpapatuloy o paulit-ulit na pagdating. Idinagdag ang “mga tao” bilang likas na ipinahihiwatig na simuno sa Filipino, hindi bilang bagong pagkakakilanlan.
- source_word: ἐβαπτίζοντο
  choice: binabautismuhan
  rationale: Pinananatili ng pandiwang nasa tinig na balintiyak at aspektong di-ganap ang nagpapatuloy o paulit-ulit na pagtanggap nila ng bautismo.
theological_decisions:
- issue: Pagpapakahulugan sa βαπτίζω
  choice: nagbabautismo / binabautismuhan
  alternative: naglulubog / inilulubog
  rationale: Ang “bautismo” ang nakaugaliang terminong panrelihiyon sa Filipino at nagpapanatili ng ugnayang leksikal sa gamit ng Bagong Tipan. Hindi nito kusang nilulutas ang usapin tungkol sa paraan ng bautismo; inilalagay sa talababa ang mas tiyak na alternatibo.
- issue: Dahilan sa pagpili sa lugar
  choice: maraming tubig doon
  alternative: sagana ang tubig doon
  rationale: Ang pangunahing salin ay mas malapit sa plural na ὕδατα πολλὰ at pinananatili ang posibleng larawan ng maraming bukal o daluyan, nang hindi nililimitahan ang kahulugan sa dami lamang ng isang anyong-tubig.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sapagkat” para sa dignidad ng salaysay ngunit iniwasan ang lipas o labis na pormal na ayos. Ang mga pangalang Αἰνών at Σαλείμ ay tinumbasan bilang Enon at Salim ayon sa karaniwang baybay-Filipino.
