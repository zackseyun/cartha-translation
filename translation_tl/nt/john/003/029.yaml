id: JHN.3.29
reference: John 3:29
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ ἔχων τὴν νύμφην νυμφίος ἐστίν· ὁ δὲ φίλος τοῦ νυμφίου ὁ ἑστηκὼς καὶ ἀκούων αὐτοῦ, χαρᾷ χαίρει διὰ τὴν φωνὴν τοῦ νυμφίου. αὕτη οὖν ἡ χαρὰ ἡ ἐμὴ πεπλήρωται.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/029.yaml
  text: The one who has the bride is the bridegroom[a]. But the friend of the bridegroom, who stands and hears him, rejoices greatly because of the bridegroom’s voice[c][b]. Therefore this joy of mine has been made complete.
translation:
  language: tl
  text: Ang may babaeng ikakasal ang siyang lalaking ikakasal. Ngunit ang kaibigan ng lalaking ikakasal[a], na nakatayo at nakikinig sa kanya, ay labis na nagagalak[b] dahil sa tinig ng lalaking ikakasal. Kaya ang kagalakan kong ito ay nalubos na.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring ihambing ang papel na ito sa isang “best man,” ngunit literal na sinasabi ng Griyego na “kaibigan ng lalaking ikakasal.”
    reason: cultural_note
  - marker: b
    text: 'Mas literal: “nagagalak nang may kagalakan,” isang idyomang Griyego na nagbibigay-diin sa matinding kagalakan.'
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin na “naging ganap na” o “natupad na.” Ang Griyego ay maaaring tumukoy sa pag-abot sa kapuspusan o kaganapan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων τὴν νύμφην
  choice: Ang lalaking kinaroroonan ng babaeng ikakasal
  rationale: Ipinahahayag nito ang ugnayang nasa Griyegong ‘ang may kasintahang babae’ nang hindi gumagamit ng Tagalog na ‘may-ari,’ na maaaring magpahiwatig ng pag-aari. Pinananatili rin ang natatanging tauhang lalaki sa talinghaga.
- source_word: νύμφην
  choice: babaeng ikakasal
  rationale: Natural at malinaw na katumbas sa modernong Filipino sa konteksto ng kasalan; pinananatili ang larawang pangkasal at hindi pinahihina tungo sa ‘asawa.’
- source_word: νυμφίος
  choice: lalaking ikakasal
  rationale: Karaniwang katawagan sa modernong Filipino at malinaw na kaparis ng ‘babaeng ikakasal.’
- source_word: φίλος τοῦ νυμφίου
  choice: kaibigan ng lalaking ikakasal
  rationale: Tuwirang pinananatili ang φίλος bilang ‘kaibigan’ at hindi ipinapalit ang mas tiyak na papel na ‘best man,’ na hindi tahasang sinasabi ng Griyego.
- source_word: ὁ ἑστηκὼς καὶ ἀκούων αὐτοῦ
  choice: na nakatayo at nakikinig sa kanya
  rationale: Ang perfect participle ay inilalarawan bilang kasalukuyang kalagayang ‘nakatayo,’ samantalang ang ‘nakikinig’ ay natural na Filipino para sa aktibong pagdinig sa kanya.
- source_word: χαρᾷ χαίρει
  choice: labis na nagagalak
  rationale: Ipinapahayag ng ‘labis’ ang diin ng magkaugnay na pangngalan at pandiwa sa Griyego nang hindi lumilikha ng di-likas na ‘nagagalak nang may kagalakan.’
- source_word: διὰ τὴν φωνὴν τοῦ νυμφίου
  choice: dahil sa tinig ng lalaking ikakasal
  rationale: Pinananatili ang sanhi o dahilan na ipinahahayag ng διά na may accusative at ang tahasang pagbanggit sa ‘tinig.’
- source_word: αὕτη οὖν ἡ χαρὰ ἡ ἐμὴ
  choice: Kaya ang kagalakan kong ito
  rationale: Ang ‘Kaya’ ay natural na naghahayag ng bunga o paghihinuha, at ang ‘kong ito’ ay nagpapanatili sa demonstratibo at personal na diin.
- source_word: πεπλήρωται
  choice: ay nalubos na
  rationale: Ang ‘nalubos na’ ay maikli at natural na naghahayag na ang kagalakan ay umabot na sa ganap na kapuspusan, alinsunod sa resultative force ng perfect passive.
theological_decisions:
- issue: Larawang pangkasal at ang paglalagay ni Juan sa sarili niyang papel
  choice: Pinanatili ang lalaking ikakasal, babaeng ikakasal, at kaibigan bilang mga tauhan ng talinghaga nang hindi tahasang kinikilala kung sino ang babaeng ikakasal.
  alternative: Tukuyin ang babaeng ikakasal bilang iglesya o bayan ng Diyos, o tawagin ang kaibigan na ‘best man.’
  rationale: Hindi tahasang binibigyang-kahulugan ng talata ang babaeng ikakasal at hindi nito ginagamit ang isang tiyak na modernong titulo para sa kaibigan. Ang salin ay hindi dapat magpasok ng isang eklesiyolohikal o kultural na pagpapakahulugan sa mismong teksto.
- issue: Kaganapan ng kagalakan
  choice: ‘nalubos na’
  alternative: ‘natupad na’
  rationale: Maaaring saklawin ng πεπλήρωται ang pagkapuno o pagkaganap. Sa konteksto ng kagalakan, ang ‘nalubos na’ ay nagpapanatili sa ideya ng pag-abot sa ganap na kalagayan nang hindi ipinapalagay na isang hula ang natupad.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang ‘lalaking ikakasal’ at ‘babaeng ikakasal’ sa halip na mas lumang ‘kasintahang lalaki/babae’ o hiram na ‘bridegroom.’ Iniwasan ang ‘may-ari ng babaeng ikakasal’ dahil maaari itong maghatid ng di-nilalayong diwa ng pagmamay-ari.
