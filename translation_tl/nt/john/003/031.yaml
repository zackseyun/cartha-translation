base_translation:
  language: en
  yaml_path: translation/nt/john/003/031.yaml
  text: The one who comes from above is above all[a]. The one who is from the earth is from the earth and speaks from the earth[b]. The one who comes from heaven is above all.
translation:
  language: tl
  text: Ang nagmumula sa itaas ay nakahihigit sa lahat.[a] Ang nagmumula sa lupa ay mula sa lupa at nagsasalita mula sa lupa.[b] Ang nagmumula sa langit ay nakahihigit sa lahat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa langit” bilang salin ng “mula sa itaas” sa unang sugnay. Ang salitang Griyego na ἄνωθεν ay tumutukoy sa pinagmulan sa itaas, na nililinaw ng sumunod na pariralang “mula sa langit.”
    reason: lexical_alternative
  - marker: b
    text: O “nagsasalita tungkol sa lupa.” Sa Griyego, literal na inuulit ang “mula sa lupa,” na maaaring tumukoy sa pinagmulan, larangan, o paksa ng kanyang sinasabi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνωθεν
  choice: mula sa itaas
  rationale: Dito, ang ἄνωθεν ay tumutukoy sa pinagmulan, hindi sa pag-uulit. Pinananatili ng “mula sa itaas” ang kaibhan nito sa mas tiyak na “mula sa langit” sa huling sugnay.
- source_word: ἐρχόμενος
  choice: nagmumula
  rationale: Sa kontekstong ito, likas na ipinahahayag ng “nagmumula” ang pagdating batay sa pinagmulan at maayos itong kaagapay ng “mula sa itaas” at “mula sa langit.”
- source_word: ἐπάνω πάντων
  choice: nakahihigit sa lahat
  rationale: Ipinahahayag nito ang kataasan o pangingibabaw habang nananatiling malinaw at marangal sa makabagong Tagalog; ang “sa ibabaw ng lahat” ay masyadong pisikal pakinggan.
- source_word: ὁ ὢν ἐκ τῆς γῆς
  choice: ang nagmula sa lupa
  rationale: Pinananatili nito ang diin sa makalupang pinagmulan at ang tuwirang paghahambing sa nagmumula sa langit.
- source_word: γῆ
  choice: lupa
  rationale: Ang γῆ rito ay kabaligtaran ng langit. Ang “lupa” ang natural na katawagan sa Tagalog sa ganitong kosmikong paghahambing.
- source_word: ἐκ τῆς γῆς ἐστιν
  choice: ay mula sa lupa
  rationale: Sadyang pinananatili ang pag-uulit ng Griyego upang idiin ang makalupang pinagmulan.
- source_word: ἐκ τῆς γῆς λαλεῖ
  choice: nagsasalita mula sa lupa
  rationale: Pinananatili ng literal na pag-uulit ang posibleng mga diwa ng pinagmulan, saklaw, o paksa ng pagsasalita sa halip na pumili agad ng isang interpretasyon.
- source_word: οὐρανός
  choice: langit
  rationale: Tumutukoy ito sa makalangit na dako o pinagmulan, hindi lamang sa pisikal na kalangitan.
theological_decisions:
- issue: Ugnayan ng “mula sa itaas” at “mula sa langit”
  choice: Isinalin ang ἄνωθεν bilang “mula sa itaas” at ang ἐκ τοῦ οὐρανοῦ bilang “mula sa langit.”
  alternative: Isalin ang dalawang parirala bilang “mula sa langit.”
  rationale: Magkaugnay ngunit magkaiba ang dalawang pariralang Griyego. Pinananatili ng salin ang retorikal na pag-unlad kung saan nililinaw ng “mula sa langit” ang “mula sa itaas,” nang hindi pinapantay ang kanilang anyo.
- issue: Lakas ng tatlong ulit na makalupang pananalita
  choice: Pinanatili ang pag-uulit na “sa lupa ... mula sa lupa ... mula sa lupa.”
  alternative: Paikliin bilang “ang makalupa ay makalupa at nagsasalita sa makalupang paraan.”
  rationale: Mahalaga sa retorika ang pag-uulit at mariing itinatambal nito ang makalupang pinagmulan sa makalangit na pinagmulan. Hindi ito pinakinis sa paraang magpapasok ng mas tiyak na interpretasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang tatlong ulit na “mula sa lupa” at ang kaibhan ng “mula sa itaas” at “mula sa langit.” Ginamit ang “nakahihigit sa lahat” upang likas na ipahayag ang kataasan o pangingibabaw nang hindi nililimitahan ang πάντων sa mga tao lamang.
