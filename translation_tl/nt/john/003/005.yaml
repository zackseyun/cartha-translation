id: JHN.3.5
reference: John 3:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀ἀπεκρίθη Ἰησοῦς· Ἀμὴν ἀμὴν λέγω σοι, ἐὰν μή τις γεννηθῇ ἐξ ὕδατος καὶ πνεύματος, οὐ δύναται εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/005.yaml
  text: Jesus answered[a], “Truly, truly, I say to you, unless someone is born of water and the Spirit[b], he is not able to enter the kingdom of God.”
translation:
  language: tl
  text: Sumagot si Jesus, “Tunay na tunay na sinasabi ko sa iyo, malibang ang isang tao ay ipanganak mula sa tubig at sa Espiritu[a][b], hindi siya makapapasok sa kaharian ng Diyos.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isulat na “espiritu.” Walang pagkakaiba ng malaki at maliit na titik sa mga sinaunang manuskritong Griyego, bagaman malamang na ang Banal na Espiritu ang tinutukoy rito.
    reason: alternative_reading
  - marker: b
    text: 'Iba-iba ang pagkaunawa sa “mula sa tubig at sa Espiritu”: bilang larawan ng paglilinis at pagpapanibago, bilang pagtukoy sa pisikal at espirituwal na kapanganakan, o bilang pagtukoy sa bautismo. Pinananatili ng salin ang pananalita ng Griyego nang hindi ipinapasya sa pangunahing teksto ang usaping ito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: Sumagot
  rationale: Karaniwang salaysay na katumbas ng pandiwang ginagamit sa tugunan; natural sa makabagong Tagalog.
- source_word: Ἀμὴν ἀμὴν
  choice: Tunay na tunay
  rationale: Pinananatili ang pag-uulit at mariing katiyakan ng pormula nang malinaw sa karaniwang mambabasa.
- source_word: λέγω σοι
  choice: sinasabi ko sa iyo
  rationale: Pinananatili ang tuwiran at maringal na himig ng pahayag.
- source_word: ἐὰν μή τις
  choice: malibang ang isang tao
  rationale: Ipinahahayag ang pangkalahatan at di-tiyak na tinutukoy nang hindi nililimitahan sa kasariang lalaki.
- source_word: γεννηθῇ
  choice: ipanganak
  rationale: Pinananatili ang balintiyak na diwa ng γεννάω. Hindi idinagdag ang ‘muli’ o ‘mula sa itaas’ sapagkat wala sa talatang ito ang ἄνωθεν.
- source_word: ἐξ ὕδατος καὶ πνεύματος
  choice: mula sa tubig at sa Espiritu
  rationale: Pinananatili ang iisang preposisyong relasyon sa tubig at espiritu habang natural na ipinahahayag sa Tagalog; ang malaking titik ay nagpapakita ng malamang na pagtukoy sa Banal na Espiritu.
- source_word: οὐ δύναται εἰσελθεῖν
  choice: hindi siya makapapasok
  rationale: Natural na Tagalog na pinananatili ang diwa ng kawalan ng kakayahang pumasok.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: kaharian ng Diyos
  rationale: Tumpak at nakaugaliang salin na hindi nililimitahan ang βασιλεία sa lugar lamang o sa paghahari lamang.
theological_decisions:
- issue: Ang tinutukoy ng πνεύματος sa pariralang ἐξ ὕδατος καὶ πνεύματος
  choice: Espiritu, malamang na tumutukoy sa Banal na Espiritu
  alternative: espiritu, bilang espiritu o espirituwal na prinsipyo
  rationale: Ang konteksto ni Juan at ang mas malawak na biblikal na larawan ng paglilinis at pagpapanibago ay pumapabor sa Banal na Espiritu, ngunit walang malaking titik sa mga orihinal na manuskritong Griyego; kaya pinanatili sa talababa ang tunay na posibilidad ng ibang pagbasa.
- issue: Kahulugan ng ‘mula sa tubig at sa Espiritu’
  choice: Pinanatili ang mismong larawan at pagkakaugnay ng tubig at Espiritu nang hindi tahasang nilulutas ang interpretasyon
  alternative: Pisikal na kapanganakan at espirituwal na kapanganakan; o tiyak na pagtukoy sa bautismo
  rationale: Hindi tiyak na ipinapasya ng anyong Griyego sa talata ang lahat ng iminungkahing paliwanag. Ang malapit na salin ay umiiwas sa pagpasok ng isang natatanging paninindigang denominasyonal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “malibang” at “makapapasok” upang mapanatili ang solemnidad nang hindi nagiging lipas o teknikal. Inilagay ang dalawang talababa sa “Espiritu” sapagkat kapwa tumutukoy ang mga ito sa salita at sa buong pariralang “tubig at Espiritu.”
