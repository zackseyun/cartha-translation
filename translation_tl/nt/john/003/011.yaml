id: JHN.3.11
reference: John 3:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω σοι ὅτι ὃ οἴδαμεν λαλοῦμεν καὶ ὃ ἑωράκαμεν μαρτυροῦμεν, καὶ τὴν μαρτυρίαν ἡμῶν οὐ λαμβάνετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/011.yaml
  text: Truly[a], truly, I tell you, we speak what we know and testify to what we have seen[c][b], and you do not receive our testimony.
translation:
  language: tl
  text: “Tunay na tunay[a], sinasabi ko sa iyo, sinasabi namin ang nalalaman namin at nagpapatotoo kami tungkol sa nakita namin, at hindi ninyo[c] tinatanggap ang patotoo namin.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Amen, amen.”
    reason: lexical_alternative
  - marker: b
    text: Hindi malinaw kung sino ang kasama ni Jesus sa paulit-ulit na “namin.”
    reason: alternative_reading
  - marker: c
    text: Isahan ang “iyo” sa unahan ng talata, ngunit pangmaramihan ang “ninyo” rito.
    reason: grammatical_clarification
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Tunay na tunay
  rationale: Pinananatili ang mariing pag-uulit ng pormula at malinaw na ipinahahayag ang puwersa nito sa likas na modernong Tagalog.
- source_word: λέγω σοι
  choice: sinasabi ko sa iyo
  rationale: Likas na salin ng pormula ng tuwirang pagsasalita at pinananatili ang isahang kausap sa σοι.
- source_word: ὃ οἴδαμεν λαλοῦμεν
  choice: sinasabi namin ang nalalaman namin
  rationale: Inililipat sa natural na ayos ng Tagalog ang kaugnayang sugnay na ‘ang nalalaman namin’ nang hindi dinaragdagan ang kahulugan.
- source_word: ὃ ἑωράκαμεν μαρτυροῦμεν
  choice: pinatototohanan namin ang nakita namin
  rationale: Ipinahahayag ng ‘pinatototohanan’ ang gawaing pagbibigay-patotoo, samantalang ang ‘nakita namin’ ay nagpapanatili sa bunga at patuloy na kabuluhan ng Griyegong ganap na panahunan.
- source_word: τὴν μαρτυρίαν ἡμῶν
  choice: ang patotoo namin
  rationale: Pinananatili ang leksikal na kaugnayan sa ‘pinatototohanan’ at ang malinaw na pangmaramihang unang panauhan.
- source_word: οὐ λαμβάνετε
  choice: hindi ninyo tinatanggap
  rationale: Ang ‘tinatanggap’ ay likas sa Tagalog at saklaw ang pagtanggap o pagkilala sa patotoo; pinananatili rin ng ‘ninyo’ ang pangmaramihang anyo ng pandiwa.
- source_word: καὶ ... καὶ
  choice: at ... at
  rationale: Tuwirang pinananatili ang mga pang-ugnay na καί, kabilang ang huling ‘at,’ nang hindi tahasang nagdaragdag ng panalungat na puwersa.
theological_decisions:
- issue: Ang tinutukoy ng pangmaramihang ‘namin’ sa ‘sinasabi namin,’ ‘pinatototohanan namin,’ at ‘patotoo namin’
  choice: Pinanatili ang ‘namin’ nang hindi tinutukoy kung sino ang kasama ni Jesus.
  alternative: Maaaring unawain na kasama ang mga alagad, na retorikal na pangmaramihan ito, o na tumutukoy ito sa mas malawak na makalangit o banal na patotoo.
  rationale: Malinaw na pangmaramihan ang mga anyong Griyego, ngunit pinagtatalunan ang eksaktong tinutukoy. Hindi dapat lutasin ng salin ang sinadyang nananatiling bukas sa teksto.
- issue: Pagbabago mula sa isahang kausap tungo sa pangmaramihang kausap
  choice: Isinalin ang σοι bilang ‘sa iyo’ at ang λαμβάνετε bilang ‘ninyo.’
  alternative: Maaaring gawing pare-parehong isahan sa Filipino para ipalagay na si Nicodemo lamang ang kausap.
  rationale: 'Pinananatili ng salin ang gramatikal na pagbabago sa Griyego: isahan ang tuwirang pormula ng pakikipag-usap, ngunit pangmaramihan ang hindi pagtanggap sa patotoo.'
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang mariing pormula, ang paulit-ulit na pangmaramihang ‘namin,’ ang pagbabago mula isahan tungo sa pangmaramihang kausap, at ang huling payak na pang-ugnay na ‘at.’
