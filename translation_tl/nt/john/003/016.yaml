  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Οὕτως γὰρ ἠγάπησεν ὁ θεὸς τὸν κόσμον ὥστε τὸν ⸀υἱὸν τὸν μονογενῆ ἔδωκεν, ἵνα πᾶς ὁ πιστεύων εἰς αὐτὸν μὴ ἀπόληται ἀλλὰ ἔχῃ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/016.yaml
  text: 'For God loved the world in this way: he gave his only Son[b][a], so that everyone who believes in him should not perish but have eternal life.'
translation:
  language: tl
  text: 'Sapagkat ganito[b] inibig ng Diyos ang sanlibutan: ibinigay niya ang kanyang kaisa-isang Anak[a], upang ang bawat sumasampalataya sa kanya ay hindi mapahamak kundi magkaroon ng buhay na walang hanggan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O ayon sa tradisyon, “ang kanyang bugtong na Anak”; maaari rin, “ang kanyang natatanging Anak.”
    reason: alternative_reading
  - marker: b
    text: 'O ayon sa tradisyon, “Sapagkat gayon na lamang ang pag-ibig ng Diyos sa sanlibutan.” Maaaring unawain ang Griyego bilang pagbibigay-diin sa paraan ng pag-ibig ng Diyos: “ganito inibig ng Diyos ang sanlibutan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὕτως
  choice: ganito
  rationale: Ipinahahayag nito ang paraan ng pag-ibig ng Diyos, na ipinaliliwanag ng kasunod na pagbibigay niya sa Anak, sa halip na pangunahing tumukoy sa tindi o laki ng pag-ibig.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag o batayang kaugnayan ng talata sa naunang konteksto.
- source_word: ἠγάπησεν
  choice: inibig
  rationale: Likas at marangal na payak na anyong naganap para sa aorist; malinaw ding pinananatili ang diwa ng pag-ibig.
- source_word: τὸν κόσμον
  choice: ang sanlibutan
  rationale: Pinananatili ang malawak na saklaw ng κόσμος sa Juan nang hindi ito nililimitahan lamang sa sangkatauhan o sa pisikal na nilikha.
- source_word: ὥστε
  choice: ': ibinigay niya'
  rationale: Ang tutuldok ay likas na nagpapakilala sa kongkretong paraan o bunga ng pag-ibig ng Diyos na binanggit sa 'ganito.'
- source_word: τὸν υἱὸν τὸν μονογενῆ
  choice: ang kanyang kaisa-isang Anak
  rationale: Ipinapahayag ang pagiging natatangi at walang kapantay ng Anak sa makabagong Tagalog, habang ang tradisyonal na pagbasa na 'bugtong na Anak' ay inilalagay sa talababa.
- source_word: ἔδωκεν
  choice: ibinigay niya
  rationale: Pinananatiling malawak ang pandiwa at hindi nililimitahan sa pagkakatawang-tao o pagpapako sa krus lamang.
- source_word: ἵνα
  choice: upang
  rationale: Likas na nagpapahayag ng layunin o nilalayong bunga.
- source_word: πᾶς ὁ πιστεύων
  choice: ang bawat sumasampalataya
  rationale: Pinananatili ang pangkalahatan at inklusibong anyo ng parirala pati ang nagpapatuloy o katangiang diwa ng present participle.
- source_word: εἰς αὐτὸν
  choice: sa kanya
  rationale: Ang 'sumampalataya sa kanya' ang likas na katumbas sa Tagalog ng πιστεύω εἰς.
- source_word: μὴ ἀπόληται
  choice: ay hindi mapahamak
  rationale: Pinananatili ang bigat at nilalayong bunga ng subjunctive nang hindi labis na tinutukoy ang paraan o kalikasan ng kapahamakan.
- source_word: ἔχῃ ζωὴν αἰώνιον
  choice: magkaroon ng buhay na walang hanggan
  rationale: Direkta, malinaw, at nakaugat sa karaniwang bokabularyong biblikal sa Tagalog.
theological_decisions:
- issue: Diwa ng Οὕτως
  choice: paraan—'ganito'
  alternative: tindi o antas—'gayon na lamang' o 'lubhang'
  rationale: Ang kasunod na sugnay tungkol sa pagbibigay ng Anak ang nagpapaliwanag kung paano inibig ng Diyos ang sanlibutan. Hindi naman itinatanggi ng salin ang tindi ng pag-ibig, ngunit hindi iyon ginagawang pangunahing kahulugan ng salita.
- issue: Kahulugan ng μονογενής tungkol sa Anak
  choice: '''kaisa-isang Anak'' sa pangunahing teksto'
  alternative: '''bugtong na Anak'' o ''natatanging Anak'''
  rationale: Binibigyang-diin ng salita ang bukod-tanging kaugnayan ng Anak sa Ama. Ang 'kaisa-isang Anak' ay malinaw sa makabagong Tagalog; pinananatili sa talababa ang makasaysayang 'bugtong na Anak' at ang higit na tahasang 'natatanging Anak.'
- issue: Saklaw ng πᾶς ὁ πιστεύων
  choice: '''ang bawat sumasampalataya'''
  alternative: '''sinumang sumasampalataya'''
  rationale: Pinananatili nito ang pangkalahatan at inklusibong pananalita nang hindi nilulutas sa salin ang mga susunod na debateng teolohikal tungkol sa pagpili, tugon ng tao, o lawak ng pagtubos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'sanlibutan' dahil pamilyar itong terminong biblikal at napapanatili ang lawak ng κόσμος. Ang 'kaisa-isang Anak' ay mas madaling maunawaan ngayon kaysa 'bugtong na Anak,' ngunit pinanatili ang tradisyonal na anyo sa talababa. Inihanay ang mga marker [a][b] sa mismong mga pariralang kanilang ipinapaliwanag.
