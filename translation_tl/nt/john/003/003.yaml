  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ἀμὴν ἀμὴν λέγω σοι, ἐὰν μή τις γεννηθῇ ἄνωθεν, οὐ δύναται ἰδεῖν τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/003.yaml
  text: Jesus answered and said to him, “Truly, truly, I say to you, unless someone is born from above,[a] he is not able to see the kingdom of God.”
translation:
  language: tl
  text: 'Sumagot si Jesus at sinabi niya sa kanya, “Tunay na tunay na sinasabi ko sa iyo: malibang ang isang tao ay ipanganak mula sa itaas,[a] hindi niya makikita ang kaharian ng Diyos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “muli.” Ang salitang Griyego ay maaaring mangahulugang kapuwa “mula sa itaas” at “muli”; nakasalalay sa dobleng kahulugang ito ang pag-uusap sa kasunod na talata.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν αὐτῷ
  choice: Sumagot si Jesus sa kanya
  rationale: Natural sa modernong Tagalog ang “sumagot … sa kanya.” Hindi na inuulit ang literal na “at sinabi” sapagkat magiging mabigat at kalabisan sa Tagalog, habang nananatili ang diwa ng pormulang Griyego.
- source_word: Ἀμὴν ἀμὴν
  choice: Tunay na tunay
  rationale: Pinananatili ang pag-uulit at diin ng solemneng pormula ni Jesus sa malinaw at marangal na Tagalog.
- source_word: ἐὰν μή τις
  choice: malibang ang isang tao
  rationale: Ipinapahayag ang pangkalahatan at walang-tiyak-na-kasariang pagtukoy ng τις nang natural sa Tagalog.
- source_word: γεννηθῇ
  choice: ipanganak
  rationale: Direktang isinasalin ang pasibong anyo ng γεννάω nang hindi isinasama sa pandiwa ang kahulugan ng ἄνωθεν.
- source_word: ἄνωθεν
  choice: mula sa itaas
  rationale: Pinananatili ang pangunahing diwa na “from above,” na mahalaga sa tema ng Ebanghelyo ni Juan; inilalagay sa talababa ang tunay na alternatibong “muli.”
- source_word: οὐ δύναται ἰδεῖν
  choice: hindi niya makikita
  rationale: Natural na ipinahahayag sa Tagalog ang kawalan ng kakayahang makita. Pinananatili ng “makikita” ang posibleng lawak ng ἰδεῖν—pagkakita, pagkaunawa, o pakikibahagi—nang hindi ito nililimitahan.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: ang kaharian ng Diyos
  rationale: Karaniwan, marangal, at tumpak na salin na hindi nililimitahan ang βασιλεία sa lugar lamang o sa paghahari lamang.
theological_decisions:
- issue: Kahulugan ng ἄνωθεν sa pahayag ni Jesus
  choice: mula sa itaas
  alternative: muli; panibago
  rationale: May tunay na dobleng kahulugan ang ἄνωθεν. Mas nangingibabaw sa teolohiya at bokabularyo ni Juan ang “mula sa itaas,” ngunit ang tugon ni Nicodemo sa kasunod na talata ay nakasalalay sa pagkaunawa niyang “muli.” Kaya pinanatili sa pangunahing teksto ang “mula sa itaas” at sa talababa ang alternatibo, sa halip na alisin ang sinadyang tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “Tunay na tunay” upang mapanatili ang solemneng pag-uulit, at iniwasan ang mas teknikal o denominasyonal na pananalita.
