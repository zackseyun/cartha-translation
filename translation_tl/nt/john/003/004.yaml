id: JHN.3.4
reference: John 3:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: λέγει πρὸς αὐτὸν ⸀ὁ Νικόδημος· Πῶς δύναται ἄνθρωπος γεννηθῆναι γέρων ὤν; μὴ δύναται εἰς τὴν κοιλίαν τῆς μητρὸς αὐτοῦ δεύτερον εἰσελθεῖν καὶ γεννηθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/004.yaml
  text: Nicodemus said to him[a], “How can a man be born when he is old? He cannot enter his mother’s womb a second time and be born[b], can he?”
translation:
  language: tl
  text: Sinabi sa kanya ni Nicodemo, “Paanong maipanganak ang isang tao kung matanda na siya? Hindi naman siya maaaring pumasok muli sa sinapupunan ng kanyang ina at maipanganak, hindi ba?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει πρὸς αὐτὸν
  choice: Sinabi sa kanya
  rationale: Ang pangkasaysayang pangkasalukuyan sa salaysay ni Juan ay likas na isinasalin sa nagdaang panahon sa modernong Tagalog.
- source_word: Νικόδημος
  choice: Nicodemo
  rationale: Ginamit ang nakagawiang anyong Tagalog ng pangalang biblikal.
- source_word: Πῶς δύναται
  choice: Paanong ...
  rationale: Likas na tanong ito sa Tagalog tungkol sa posibilidad.
- source_word: ἄνθρωπος
  choice: ang isang tao
  rationale: Bagaman panlalaking isahan ang anyong Griyego, pangkalahatan ang gamit nito; ang “isang tao” ang natural at tumpak na katumbas sa Tagalog.
- source_word: γεννηθῆναι
  choice: maipanganganak / maipanganak
  rationale: Pinananatili ang pasibong diwa ng kapanganakan nang hindi ipinapasok dito ang pinagtatalunang kahulugan ng ἄνωθεν sa naunang talata.
- source_word: γέρων ὤν
  choice: kung matanda na siya
  rationale: Natural na kondisyunal-temporal na pagpapahayag sa Tagalog para sa kalagayan ng pagiging matanda.
- source_word: μὴ δύναται
  choice: Hindi naman siya maaaring ... hindi ba?
  rationale: Ipinahihiwatig ng μή na negatibo ang inaasahang sagot; malinaw itong naipapahayag ng negatibong tanong na may “hindi ba?”
- source_word: κοιλίαν
  choice: sinapupunan
  rationale: Sa pagkakaugnay nito sa ina, tumutukoy ang salita sa sinapupunan, hindi lamang sa tiyan.
- source_word: δεύτερον
  choice: na muli
  rationale: Ipinapahayag nito ang ikalawang pagkakataon at pinananatili ang literal na pagkaunawa ni Nicodemo; mas natural sa Tagalog ang “muli” kaysa “sa ikalawang pagkakataon” sa loob ng pangungusap.
- source_word: εἰσελθεῖν καὶ γεννηθῆναι
  choice: pumasok ... at maipanganak
  rationale: Pinanatiling hayag ang magkaugnay na dalawang pawatas upang mapanatili ang matingkad na lohika ng tanong.
theological_decisions:
- issue: Pagsasalin sa pangkalahatang panlalaking ἄνθρωπος
  choice: ang isang tao
  alternative: ang isang lalaki
  rationale: Pangkalahatan ang gamit ng ἄνθρωπος sa konteksto. Sa Tagalog, ang “tao” ay tumpak na hindi minamarkahan ang kasarian at hindi nagpapahiwatig na lalaki lamang ang tinutukoy.
- issue: Kung ipapasok ang diwa ng “ipanganak na muli” mula sa Juan 3:3
  choice: maipanganganak ... na muli ... at maipanganak
  alternative: ipanganak na muli
  rationale: Ang talata ay may δεύτερον, “sa ikalawang pagkakataon.” Inilalagay ang “muli” sa pagpasok sa sinapupunan upang sundan ang ayos at literal na pangangatwiran ni Nicodemo, nang hindi ipinapasiya rito ang kahulugan ng ἄνωθεν sa naunang talata.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “sinapupunan” bilang karaniwang tumpak na salita at ang “Hindi naman ... hindi ba?” upang maipakita ang pagtatakang may inaasahang negatibong sagot.
