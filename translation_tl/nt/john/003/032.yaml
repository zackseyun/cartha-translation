base_translation:
  language: en
  yaml_path: translation/nt/john/003/032.yaml
  text: What he has seen and heard[a], this he testifies to[b], and no one receives his testimony.
translation:
  language: tl
  text: Ang kanyang nakita at narinig, iyon ang kanyang pinatototohanan, at walang tumatanggap sa kanyang patotoo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “walang tumatanggap sa kanyang patotoo” ay isang matinding paglalahat; binabanggit naman sa kasunod na talata ang taong tumatanggap nito.
    reason: cross_reference
lexical_decisions:
- source_word: ὃ
  choice: Ang
  rationale: Ipinakikilala nito ang nilalaman ng nakita at narinig; sa likas na Tagalog, ang pariralang “Ang nakita niya at narinig” ang malinaw na katumbas ng neuter relative construction.
- source_word: ἑώρακεν
  choice: nakita niya
  rationale: Ang perpektong Griyego ay tumutukoy sa nakita niyang nananatiling mahalaga; hindi likas sa Tagalog na sapilitang markahan ang aspektong ito sa paraang hiwalay sa konteksto.
- source_word: ἤκουσεν
  choice: narinig
  rationale: Pinananatili ang payak na natapos na kilos ng aorist at likas itong itinatambal sa “nakita niya.”
- source_word: τοῦτο
  choice: siya niyang
  rationale: Ang resumptive na demonstrative ay likas na naipapahayag sa Tagalog sa konstruksyong “ay siya niyang,” na tumutukoy pabalik sa mismong nilalamang nakita at narinig.
- source_word: μαρτυρεῖ
  choice: pinatotohanan
  rationale: Malinaw at marangal na modernong Tagalog ito para sa pagbibigay ng patotoo, at pinananatili ang ugnayang leksikal sa “patotoo.”
- source_word: μαρτυρίαν
  choice: patotoo
  rationale: Pinananatili nito ang diwang saksi o testimonya at ang pagkakaugnay nito sa pandiwang “pinatotohanan.”
- source_word: οὐδεὶς
  choice: walang
  rationale: Direkta at likas na salin ng pangkalahatang pagtanggi na “no one.”
- source_word: λαμβάνει
  choice: tumatanggap
  rationale: Pinananatili ang pangunahing diwa ng pagtanggap sa patotoo nang hindi agad binibigyang-kahulugang “sumasang-ayon” o “naniniwala.”
theological_decisions:
- issue: Saklaw ng pangkalahatang pagtangging οὐδεὶς (“walang tumatanggap”)
  choice: Pinanatili ang tahasang “walang tumatanggap.”
  alternative: “Kakaunti ang tumatanggap” o isang ganap at matematikong pagbasa na walang sinuman kailanman ang tumatanggap.
  rationale: Tahasang pangkalahatan ang Griyego. Hindi ito dapat palambutin, ngunit dapat ding panatilihin ang tensiyon sa kasunod na talata, na nagsasalita tungkol sa tumanggap ng kanyang patotoo.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “pinatotohanan/patotoo” upang mapanatili ang salitang-ugat at ang diwang saksi. Inilipat ang footnote marker sa dulo ng pangungusap dahil tumutukoy ito sa huling sugnay.
