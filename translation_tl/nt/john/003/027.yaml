  yaml_path: translation/nt/john/003/027.yaml
  text: John answered and said[a], “A man is not able to receive even one thing unless it has been given to him from heaven.”
translation:
  language: tl
  text: Sumagot si Juan at sinabi niya, “Walang taong makatatanggap ng kahit isang bagay malibang ito ay ibinigay sa kanya mula sa langit.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη Ἰωάννης καὶ εἶπεν
  choice: Sumagot si Juan at sinabi
  rationale: Pinananatili ang karaniwang dobleng pormula ng pagsasalaysay sa Griyego, bagaman mas pormal ito kaysa sa simpleng “sumagot si Juan.”
- source_word: Οὐ δύναται ἄνθρωπος
  choice: Walang taong makatatanggap
  rationale: Likas na Tagalog para sa pangkalahatang kawalan ng kakayahan; ang “tao” ay pangkalahatan at hindi limitado sa lalaki.
- source_word: λαμβάνειν οὐδὲ ἓν
  choice: makatatanggap ng kahit isang bagay
  rationale: Ang “makatatanggap” ay nagpapahayag ng kakayahang tumanggap, at ang “kahit isang bagay” ay nagpapanatili sa diin ng οὐδὲ ἓν.
- source_word: ἐὰν μὴ ᾖ δεδομένον αὐτῷ
  choice: malibang ibinigay iyon sa kanya
  rationale: Ang “malibang” ay natural na katumbas ng exceptive condition; ang “ibinigay” ay naghahayag ng pasibong pagtanggap sa isang kaloob. Hindi kailangang gawing tahasan sa Tagalog ang periphrastic perfect upang maipahayag ang resultang umiiral.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: mula sa langit
  rationale: Pinananatili ang literal at teolohikal na bukas na pananalita ng Juan sa halip na ipaliwanag agad bilang “mula sa Diyos.”
theological_decisions:
- issue: Saklaw ng pahayag tungkol sa kaloob na mula sa langit
  choice: 'Pinananatiling malawak ang pahayag: walang matatanggap ang isang tao malibang iyon ay ibinigay mula sa langit.'
  alternative: Limitahan ito sa tungkulin o awtoridad sa ministeryo, o palawakin bilang tahasang kumpletong determinismo.
  rationale: Ang konteksto ay tungkol sa ministeryo ni Juan at sa pag-angat ni Jesus, ngunit malawak ang mismong pananalita. Hindi nilulutas ng salin ang tensiyon sa pamamagitan ng pagdaragdag ng isang sistemang teolohikal.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “makatatanggap” upang likas na maipahayag ang δύναται λαμβάνειν; iniwasan ang mas mabigat na “hindi kayang tumanggap.” Walang talababa dahil malinaw na pangkalahatan sa Filipino ang salitang “tao,” kaya hindi kailangan ang alternatibong paliwanag na nasa Ingles.
