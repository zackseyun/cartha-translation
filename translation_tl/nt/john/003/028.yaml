  text: αὐτοὶ ὑμεῖς ⸀μοι μαρτυρεῖτε ὅτι ⸀εἶπον· Οὐκ εἰμὶ ἐγὼ ὁ χριστός, ἀλλ’ ὅτι Ἀπεσταλμένος εἰμὶ ἔμπροσθεν ἐκείνου.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/028.yaml
  text: You yourselves bear me witness that I said[a], ‘I am not the Messiah[b], but I have been sent ahead of him.’
translation:
  language: tl
  text: Kayo mismo ang nagpapatunay na sinabi ko, “Hindi ako ang Mesiyas,[a] kundi isinugo ako sa unahan niya.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Cristo.”
    reason: Pinananatili ang tradisyonal na salin o transliterasyon ng titulong Griyego na Χριστός bilang leksikal na alternatibo.
  - marker: b
    text: Maaari ring isalin, “isinugo ako nang una sa kanya,” “isinugo na ako bago siya,” o “isinugo ako sa harap niya.”
    reason: Maaaring ipahayag ng ἔμπροσθεν ang pag-una sa panahon o posisyon; ang Ἀπεσταλμένος εἰμί ay maaari ring katawanin sa Filipino sa magkakaibang anyong aspektuwal.
lexical_decisions:
- source_word: αὐτοὶ ὑμεῖς
  choice: Kayo mismo
  rationale: Pinananatili nito ang mariing pagtukoy sa mga kausap bilang mismong mga saksi.
- source_word: μοι μαρτυρεῖτε
  choice: nagpapatotoo para sa akin
  rationale: Likas itong pahayag sa Filipino at pinananatili ang legal at pansaksing diwa ng μαρτυρεῖτε, habang ang μοι ay ipinahahayag bilang pakinabang o pagsuporta sa nagsasalita.
- source_word: εἶπον
  choice: sinabi ko
  rationale: Ang aorist ay tumutukoy sa nauna nang tahasang sinabi ni Juan, kaya ang payak na aspektong naganap ang angkop.
- source_word: ὁ χριστός
  choice: ang Mesiyas
  rationale: Dito ay titulo ito ng inaasahang pinahiran, hindi pangalang pantangi; karaniwan at malinaw sa makabagong Filipino ang “Mesiyas.”
- source_word: Ἀπεσταλμένος εἰμὶ
  choice: isinugo ako
  rationale: Ang aspektong naganap ng “isinugo” ay nagpapahiwatig ng naunang pagsusugo na siyang batayan ng kasalukuyang tungkulin ni Juan, nang hindi nagpapabigat sa natural na Filipino.
- source_word: ἔμπροσθεν ἐκείνου
  choice: sa unahan niya
  rationale: Ipinahahayag nito ang pagiging nauuna ni Juan sa misyon at paghahanda, habang hindi lubusang inaalis ang maaaring temporal o larawang panspatial na diwa ng parirala.
theological_decisions:
- issue: Pagpapahayag sa Χριστός bilang titulo
  choice: Mesiyas
  alternative: Cristo
  rationale: Itinatanggi ni Juan na siya ang inaasahang pinahiran. Ang “Mesiyas” ay malinaw na nagpapanatili rito sa gamit bilang titulo, samantalang ang “Cristo” ay maaaring mabasa bilang pangalang pantangi.
- issue: Diwa ng pagsusugo kay Juan sa Ἀπεσταλμένος εἰμὶ
  choice: isinugo ako sa unahan niya
  alternative: ako'y sinugo bago siya / ako'y isinugo sa harap niya
  rationale: Pinananatili ng pangunahing salin ang naunang pagsusugo at ang patuloy na kaugnayan nito sa mapaghanda at nakapailalim na papel ni Juan, nang hindi tinutukoy nang higit sa sinasabi ng Griyego kung ang “unahan” ay pangunahing temporal o panspatial.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nagpapatotoo” upang mapanatili ang mahalagang bokabularyong pansaksi sa Juan, at ang “sa unahan niya” upang maging natural nang hindi pinapawi ang tunay na saklaw ng Griyego.
