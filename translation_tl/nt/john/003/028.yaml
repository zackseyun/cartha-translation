  - severity: medium
    issue: Hindi malinaw ang alternatibong talababa na “ako’y sinugo bago siya.”
    rationale: Maaari itong basahin bilang paghahambing ng oras ng pagsusugo sa dalawang tao. Ang ἔμπροσθεν ἐκείνου ay mas malinaw na maipapahayag bilang ‘nang una sa kanya’ o ‘sa harap niya,’ habang ang pandiwang anyo ay maaaring ‘isinugo,’ ‘isinusugo,’ o ‘isinugo na.’
