revisions:
- from: Kayo mismo ang nagpapatotoo para sa akin na sinabi ko, “Hindi ako ang Mesiyas,[a] kundi isinugo ako sa unahan niya.”[b]
  to: Kayo mismo ang nagpapatunay na sinabi ko, “Hindi ako ang Mesiyas,[a] kundi isinugo ako sa unahan niya.”[b]
  rationale: Inalis ang pariralang “para sa akin” upang maiwasan ang di-sinasadyang diwang ‘pabor sa akin,’ at inayos ang talababa upang malinaw na ang pag-una ay may kaugnayan sa tinutukoy na tao, hindi lamang sa oras ng kanilang magkahiwalay na pagsusugo. Napanatili ang mariing “Kayo mismo,” ang titulo na “Mesiyas,” at ang saklaw ng “sa unahan niya.”
