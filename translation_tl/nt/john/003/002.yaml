id: JHN.3.2
reference: John 3:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὗτος ἦλθεν πρὸς αὐτὸν νυκτὸς καὶ εἶπεν αὐτῷ· Ῥαββί, οἴδαμεν ὅτι ἀπὸ θεοῦ ἐλήλυθας διδάσκαλος· οὐδεὶς γὰρ ⸂δύναται ταῦτα τὰ σημεῖα⸃ ποιεῖν ἃ σὺ ποιεῖς, ἐὰν μὴ ᾖ ὁ θεὸς μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/002.yaml
  text: This man came to him by night and said to him[a], “Rabbi, we know that you have come from God as a teacher[c][b], for no one is able to do these signs that you do unless God is with him.”
translation:
  language: tl
  text: Ang taong ito ay pumunta kay Jesus sa gabi[a] at sinabi sa kanya, “Rabi, alam naming naparito ka mula sa Diyos bilang guro, sapagkat walang makagagawa ng mga tandang ito na ginagawa mo malibang kasama niya ang Diyos.”[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nang gabi.” Maaari ring magkaroon ng tematikong pahiwatig ang “gabi” sa Juan, kung saan ang gabi at dilim ay maaaring magtaglay ng simbolikong kahulugan.
    reason: lexical_alternative
  - marker: b
    text: O “mga mahimalang tanda.” Ang salitang Griyego na σημεῖα ay isinaling “mga tanda” upang mapanatili ang diwang ang mga gawang ito ay tumuturo sa isang kahulugang higit sa mismong himala.
    reason: lexical_alternative
  - marker: c
    text: Sa Griyego, “malibang kasama niya ang Diyos.” Pinananatili rito ang ikatlong panauhan sa pahayag ni Nicodemo, kahit tuwiran niyang kinakausap si Jesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: Ang taong ito
  rationale: Tumutukoy ito pabalik kay Nicodemo at pinananatili ang puwersa ng demonstratibo, sa halip na gawing simpleng “siya.”
- source_word: ἦλθεν πρὸς αὐτὸν
  choice: ay pumunta kay Jesus
  rationale: Natural sa Tagalog ang “pumunta kay”; ginawang tahasan ang tinutukoy ng panghalip upang maiwasan ang malabong sunod-sunod na “siya/kanya.”
- source_word: νυκτός
  choice: nang gabi
  rationale: Likas na salin ng genitibong panahunan at hindi inaalis ang posibleng tematikong kabuluhan ng gabi sa Juan.
- source_word: Ῥαββί
  choice: Rabi
  rationale: Pinananatili ang makasaysayang katawagang Judio sa paraang karaniwang baybay sa Filipino.
- source_word: οἴδαμεν
  choice: alam namin
  rationale: Pinananatili ang unang panauhang maramihan; hindi ito ginagawang “alam ko.”
- source_word: ἀπὸ θεοῦ ἐλήλυθας
  choice: naparito ka mula sa Diyos
  rationale: Ipinahahayag ang pinagmulan at ang pagdating na may kasalukuyang bisa, nang hindi idinaragdag ang mas tiyak na ideya ng “isinugo.”
- source_word: διδάσκαλος
  choice: bilang guro
  rationale: Natural na ipinapahayag sa Filipino ang tungkuling kinikilala ni Nicodemo kay Jesus.
- source_word: οὐδεὶς γὰρ δύναται
  choice: sapagkat walang makagagawa
  rationale: Ang anyong may “makagagawa” ay natural at malinaw na naghahatid ng kakayahang ipinahahayag ng δύναται.
- source_word: ταῦτα τὰ σημεῖα
  choice: mga tandang
  rationale: 'Pinananatili ang natatanging bokabularyo ni Juan: ang mga gawang ito ay hindi lamang himala kundi mga tanda na tumuturo lampas sa kanilang sarili.'
- source_word: ποιεῖν ἃ σὺ ποιεῖς
  choice: makagagawa ng mga tandang ginagawa mo
  rationale: Hangga't natural sa Filipino, pinananatili ang pag-uulit ng ποιέω sa “makagagawa” at “ginagawa.”
- source_word: ἐὰν μὴ ᾖ ὁ θεὸς μετ’ αὐτοῦ
  choice: malibang sumakanya ang Diyos
  rationale: Pinananatili ang ikatlong panauhang αὐτοῦ at ang kundisyong ipinahahayag ng teksto, sa halip na gawing tuwirang “sumaiyo.”
theological_decisions:
- issue: Pagbibigay-kahulugan sa σημεῖα sa Ebanghelyo ni Juan
  choice: mga tanda
  alternative: mga himala / mga mahimalang tanda
  rationale: Ang “mga tanda” ay nagpapanatili sa teolohikal na gamit ni Juan para sa mga gawang naghahayag ng pagkakakilanlan at misyon ni Jesus, nang hindi itinatanggi ang mahimalang katangian ng mga ito.
- issue: Paglipat mula sa ikalawang panauhan tungo sa ikatlong panauhan sa sinabi ni Nicodemo
  choice: malibang sumakanya ang Diyos
  alternative: malibang sumaiyo ang Diyos
  rationale: Nagmula ang Griyego sa tuwirang “ikaw” at lumipat sa “kanya.” Pinananatili ng salin ang pagbabago sa panauhan at ang pormal o pangkalahatang anyo ng pahayag.
- issue: Kung ang ἀπὸ θεοῦ ἐλήλυθας ay tahasang nangangahulugang pormal na pagsusugo
  choice: naparito ka mula sa Diyos
  alternative: isinugo ka ng Diyos
  rationale: Tahasan sa talata ang pinagmulan kay Diyos, ngunit hindi ginamit ang pandiwang nangangahulugang “isugo”; kaya hindi dapat idagdag ang mas tiyak na pormulasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Rabi” bilang makasaysayang katawagan, “mga tanda” bilang pare-parehong terminolohiyang Juaniko, at “sumakanya” upang mapanatili ang di-karaniwang ikatlong panauhan ng orihinal.
