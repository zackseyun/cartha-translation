id: JHN.3.22
reference: John 3:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἦλθεν ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ εἰς τὴν Ἰουδαίαν γῆν, καὶ ἐκεῖ διέτριβεν μετ’ αὐτῶν καὶ ἐβάπτιζεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/022.yaml
  text: After these things[a], Jesus and his disciples went into the land of Judea[c][b], and there he was spending time with them and baptizing.
translation:
  language: tl
  text: Pagkatapos nito, pumunta si Jesus at ang kanyang mga alagad sa lupain ng Judea. Nanatili siya roon kasama nila at nagbabautismo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nililinaw sa Juan 4:2 na hindi si Jesus mismo ang nagbabautismo, kundi ang kanyang mga alagad.
    reason: cross_reference
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Pagkatapos nito
  rationale: Likas na temporal na transisyon sa modernong Tagalog; naipahahayag nito ang pagkakasunod-sunod ng salaysay nang hindi nagiging matigas ang literal na “pagkatapos ng mga bagay na ito.”
- source_word: ἦλθεν
  choice: pumunta
  rationale: Bagaman maaaring literal na “dumating,” mas natural ang “pumunta” dahil may tahasang patutunguhan at inilalarawan ang paggalaw mula sa naunang tagpuan.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ang kanyang mga alagad
  rationale: Natural at karaniwang salin ng konstruksiyong paari.
- source_word: εἰς τὴν Ἰουδαίαν γῆν
  choice: sa lupain ng Judea
  rationale: Direktang pinananatili ang γῆ bilang “lupain” at malinaw na tinutukoy ang rehiyon ng Judea; hindi ipinapalagay sa pangunahing teksto na tiyak na kanayunan ang ibig sabihin.
- source_word: διέτριβεν
  choice: Nanatili siya roon
  rationale: Ipinahahayag ang patuloy na pananatili na tinutukoy ng imperfect; mas natural ito sa Tagalog kaysa sa literal na “nagpalipas ng panahon.”
- source_word: μετ’ αὐτῶν
  choice: kasama nila
  rationale: Tuwirang tumutukoy sa mga alagad at natural ang pagkakabuo sa Tagalog.
- source_word: ἐβάπτιζεν
  choice: nagbabautismo
  rationale: Pinananatili ang kinikilalang katawagan sa gawaing panrelihiyon at ang aspektong nagpapatuloy, nang hindi nagpapasya tungkol sa paraan o mode ng bautismo.
theological_decisions:
- issue: Ang gumaganap ng pagb bautismo kaugnay ng Juan 4:2
  choice: Pinanatili si Jesus bilang gramatikal na simuno ng “nagbabautismo” sa talatang ito.
  alternative: Baguhin ang pangunahing teksto upang sabihing ang mga alagad ang nagbabautismo.
  rationale: Ang isahang pandiwa sa Griyego ay likas na bumabalik kay Jesus bilang simuno. Ang Juan 4:2 ang nagbibigay ng paglilinaw na hindi si Jesus mismo kundi ang kanyang mga alagad ang personal na nagbabautismo; hindi dapat tahimik na ipasok ang paglilinaw na iyon sa mismong teksto ng 3:22.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang “lupain ng Judea” upang manatiling malapit sa Griyego, at hinati sa dalawang pangungusap para sa maayos na daloy nang hindi binabago ang ugnayang pangkahulugan.
