  source_fidelity: 'Tapat ang salin sa Griyego: naipapahayag ang pagkakasunod ng pangyayari, pagpunta ni Jesus kasama ang kanyang mga alagad sa lupain ng Judea, ang patuloy niyang pananatili roon kasama nila, at ang patuloy na pagbabautismo. Ang “Pagkatapos nito” ay likas na Tagalog na katumbas ng Μετὰ ταῦτα at hindi nakapipinsala sa plural na anyo sa konteksto.'
