id: JHN.3.19
reference: John 3:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: αὕτη δέ ἐστιν ἡ κρίσις ὅτι τὸ φῶς ἐλήλυθεν εἰς τὸν κόσμον καὶ ἠγάπησαν οἱ ἄνθρωποι μᾶλλον τὸ σκότος ἢ τὸ φῶς, ἦν γὰρ ⸂αὐτῶν πονηρὰ⸃ τὰ ἔργα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/019.yaml
  text: 'And this is the judgment: that the light has come into the world[a], and people loved the darkness rather than the light, because their works were evil.'
translation:
  language: tl
  text: 'At ito ang paghatol: dumating na sa mundo ang liwanag, ngunit mas inibig ng mga tao ang kadiliman kaysa sa liwanag, sapagkat masasama ang kanilang mga gawa.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρίσις
  choice: paghatol
  rationale: Pinananatili nito ang malawak na diwa ng pagpapasiya o pagsusuring moral, nang hindi agad nililimitahan sa kaparusahan o condenasyon.
- source_word: τὸ φῶς
  choice: ang liwanag
  rationale: Pinananatili ang mahalagang metapora ni Juan at hindi tahasang pinapalitan ng pangalan ni Jesus.
- source_word: ἐλήλυθεν
  choice: dumating na
  rationale: Ipinahihiwatig ng “na” ang ganap na pagdating ng liwanag at ang nananatiling bunga nito, ayon sa aspektong perpekto ng Griyego.
- source_word: κόσμον
  choice: mundo
  rationale: Likas at malinaw sa makabagong Filipino, habang napapanatili ang malawak na gamit ni Juan para sa daigdig at sangkatauhang naririto.
- source_word: ἠγάπησαν
  choice: inibig
  rationale: Pinananatili ang lakas at moral na bigat ng ἀγαπάω; hindi lamang ito isang pansamantalang pagpili o pagkagusto.
- source_word: οἱ ἄνθρωποι
  choice: mga tao
  rationale: Saklaw nito ang sangkatauhan sa pangkalahatan, hindi lamang ang mga lalaki, at natural ito sa kasalukuyang Filipino.
- source_word: μᾶλλον ... ἢ
  choice: mas ... kaysa sa
  rationale: Likas na paghahambing sa Filipino na nagpapahayag ng higit na pag-ibig sa kadiliman.
- source_word: τὸ σκότος
  choice: ang kadiliman
  rationale: Pinananatili ang simbolikong pagsalungat sa liwanag sa Ebanghelyo ni Juan.
- source_word: πονηρὰ
  choice: masasama
  rationale: Malinaw nitong ipinapahayag ang moral na kasamaan; mas angkop kaysa sa mahinang “hindi mabuti.”
- source_word: τὰ ἔργα
  choice: mga gawa
  rationale: Tuwirang katumbas na natural sa Filipino at pinananatili ang mahalagang bokabularyo ni Juan tungkol sa mga gawa.
theological_decisions:
- issue: Tinutukoy ng “liwanag”
  choice: Pinanatili ang metaporang “ang liwanag.”
  alternative: Gawing tahasan na “si Jesus” o “ang Anak.”
  rationale: Malinaw sa konteksto ang kaugnayan nito sa Anak, ngunit metapora ang mismong ginamit ng Griyego; ang pagpapanatili rito ay hindi nagdaragdag ng interpretasyon sa pangunahing teksto.
- issue: Saklaw ng οἱ ἄνθρωποι
  choice: “mga tao,” na tumutukoy sa sangkatauhan sa pangkalahatan
  alternative: “mga lalaki” o “sangkatauhan”
  rationale: Generic at pangkalahatan ang kahulugan sa konteksto. Ang “mga tao” ang pinakanatural at hindi nagpapahiwatig na mga lalaki lamang ang tinutukoy.
- issue: Diwa ng κρίσις
  choice: “paghatol” nang walang dagdag na “kaparusahan” o “kondenasyon”
  alternative: “kondenasyon,” “hatol,” o “batayan ng paghatol”
  rationale: Maaaring may bunga itong kondenasyon, ngunit inilalahad dito ng teksto ang katangian o nilalaman ng paghatol. Pinananatili ng “paghatol” ang lawak at tensiyon ng salita.
translation_notes:
  register: Makabagong, malinaw, at marangal na Filipino. Ginamit ang “mundo” sa halip na mas arkaikong “sanlibutan,” at pinanatili ang magkapares na metapora ng liwanag at kadiliman. Walang talababa dahil walang kailangang leksikal na paliwanag na hindi kayang ipahayag nang natural sa pangunahing teksto.
