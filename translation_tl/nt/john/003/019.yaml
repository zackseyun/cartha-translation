  source_fidelity: Tumpak ang salin sa SBLGNT. Ang “paghatol” ay angkop para sa κρίσις; pinananatili ang metapora ng “liwanag” at “kadiliman”; at ang “dumating na” ay natural na nagpapahiwatig ng ganap na pagdating (ἐλήλυθεν). Ang “mga tao” ay wastong pangkalahatang katumbas ng οἱ ἄνθρωποι. Ang “ngunit” ay isang katanggap-tanggap na kontekstuwal na pagpapakita ng pagsalungat ng liwanag at kadiliman, kahit simpleng καί ang Griyego.
