id: JHN.3.12
reference: John 3:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰ τὰ ἐπίγεια εἶπον ὑμῖν καὶ οὐ πιστεύετε, πῶς ἐὰν εἴπω ὑμῖν τὰ ἐπουράνια πιστεύσετε;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/012.yaml
  text: If I told you about earthly things and you do not believe[b][a], how will you believe if I tell you about heavenly things?
translation:
  language: tl
  text: Kung sinabi ko sa inyo ang mga bagay na panlupa at hindi kayo naniniwala, paano kayo maniniwala kung sabihin ko sa inyo ang mga bagay na makalangit?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ ἐπίγεια
  choice: ang mga bagay na panlupa
  rationale: Ang pang-uring nasa neutral na maramihan ay ginagamit bilang pangngalan. Likas sa Filipino ang “mga bagay na panlupa,” at pinananatili nito ang tuwirang pagtut contrast sa “mga bagay na makalangit” nang hindi nililimitahan ang kahulugan sa mga halimbawa o pangyayaring nasa lupa.
- source_word: εἶπον
  choice: sinabi ko
  rationale: Ang aorist ng λέγω ay tumutukoy sa naunang sinabi ni Jesus. Ang “sinabi ko sa inyo” ay natural at tapat sa konstruksiyong may ὑμῖν.
- source_word: οὐ πιστεύετε
  choice: hindi kayo naniniwala
  rationale: Ipinahahayag ng present indicative na may οὐ ang kasalukuyan o pangkalahatang tugon ng mga kausap. Ang “naniniwala” ang karaniwang salin dito at hindi dinaragdagan ang teksto ng mas tiyak na diwa ng pagtitiwala.
- source_word: πῶς ... πιστεύσετε
  choice: paano kayo maniniwala
  rationale: Pinananatili ng “paano kayo maniniwala” ang retorikal na tanong at ang hinaharap na anyo ng πιστεύσετε, sa halip na gawing tanong tungkol sa kakayahan sa pamamagitan ng “paano kayo makapaniwala.”
- source_word: ἐὰν εἴπω
  choice: kung sabihin ko
  rationale: Ang ἐὰν na may aorist subjunctive ay nagsasaad ng posibleng kundisyon sa hinaharap. Natural sa Filipino ang “kung sabihin ko” at hindi na kailangan ang mas mabigat na “kung sakaling sabihin ko.”
- source_word: τὰ ἐπουράνια
  choice: ang mga bagay na makalangit
  rationale: Ang substantival na pang-uri ay tuwirang katapat ng τὰ ἐπίγεια. Ang “mga bagay na makalangit” ay nagpapanatili sa malawak na diwa ng mga realidad na nauukol sa langit nang hindi ito ipinaliliwanag bilang partikular na mga hiwaga.
theological_decisions:
- issue: Kahulugan ng pagtut contrast ng “mga bagay na panlupa” at “mga bagay na makalangit”
  choice: Isinalin nang tuwiran ang dalawang kategorya nang hindi tinutukoy kung ang “panlupa” ay mga paghahalintulad mula sa karanasan o mga pangyayaring nagaganap sa lupa, at nang hindi rin binibigyang-kahulugan nang mas makitid ang “makalangit.”
  alternative: Maaaring unawain ang “mga bagay na panlupa” bilang mga larawang mula sa karaniwang buhay o bilang mga katotohanang nauukol sa mga pangyayari sa lupa, at ang “mga bagay na makalangit” bilang mas malalalim na hiwaga ng Diyos.
  rationale: Malinaw ang pagtut contrast sa Griyego, ngunit hindi nito tahasang nilulutas kung ano ang eksaktong saklaw ng bawat kategorya. Pinananatili ng malawak na salin ang tunay na kalabuan at tensiyong teolohikal ng talata.
translation_notes:
  register: Modernong Filipino na malinaw, natural, at marangal. Ginamit ang magkatambal na “panlupa” at “makalangit” upang mapanatili ang simetriya ng Griyego. Walang talababa sapagkat sapat na naipapahayag ng pangunahing teksto ang leksikal na pagtut contrast at ang mga alternatibong literal na parirala ay hindi kailangan para sa pag-unawa.
