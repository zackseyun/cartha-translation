  text: Kailangang siya'y lumago, ngunit ako'y lumiit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκεῖνον
  choice: siya
  rationale: Ang accusative demonstrative ang lohikal na simuno ng infinitive; sa natural na Tagalog, “siya” ang malinaw at maayos na pagtukoy kay Jesus ayon sa konteksto, nang hindi dinaragdagan ang mismong salita ng Griyego.
- source_word: δεῖ
  choice: dapat
  rationale: Ipinahahayag ng δεῖ ang pangangailangan o nararapat na kaayusan. Pinananatili ng “dapat” ang bigat nito nang hindi tahasang tinutukoy kung ang pangangailangan ay atas ng Diyos, praktikal na pangyayari, o kapwa.
- source_word: αὐξάνειν
  choice: maging higit na dakila
  rationale: Sa konteksto, hindi pisikal o numerikal na paglaki ang pangunahing diwa kundi ang pag-angat ng katayuan, pagkilala, at impluwensiya ni Jesus. Natural itong ipinahahayag sa Tagalog bilang “maging higit na dakila,” habang ang mas literal na larawan ng paglaki ay inilalagay sa talababa.
- source_word: ἐμὲ
  choice: ako
  rationale: Ang accusative pronoun ay lohikal na simuno ng infinitive; “ako” ang kinakailangang anyong palagyo sa natural na Tagalog.
- source_word: δὲ
  choice: at ... nama'y
  rationale: Ang ikalawang δὲ ay nagtatangi at naghahambing sa pag-angat ni Jesus at pagbaba ni Juan. Ang “at ako nama’y” ay natural na Tagalog na nagpapanatili ng malinaw na pagtutulad at pagsalungat nang hindi labis na mariin.
- source_word: ἐλαττοῦσθαι
  choice: maging mas mababa
  rationale: Ang present middle/passive infinitive ay tumutukoy sa patuloy na pagiging mas kaunti, mababa, o di-gaanong prominente. Ang “maging mas mababa” ay natural at kaagapay ng “maging higit na dakila.”
theological_decisions:
- issue: Uri ng pangangailangang ipinahahayag ng δεῖ
  choice: Isinalin bilang “dapat,” na nagpapanatili ng kinakailangan at nararapat na pag-angat ni Jesus at pagbaba ni Juan nang hindi tinutukoy ang mekanismo nito.
  alternative: Maaaring gawing tahasang “itinakda ng Diyos” o unawain bilang praktikal lamang na pangangailangan.
  rationale: Madalas na may bigat ng banal na pangangailangan ang δεῖ, ngunit hindi tahasang sinasabi ng talata kung paano o sa anong tiyak na diwa ito kinakailangan. Hindi dapat lutasin ng salin ang nananatiling di-tiyak sa teksto.
translation_notes:
  register: Maikli, marangal, at madaling maunawaan sa modernong Filipino. Pinanatili ang matalas na paralelismo ng dalawang sugnay, habang iniwasan ang “tumaas/bumaba,” na maaaring magmukhang tumutukoy lamang sa posisyon o direksiyong pisikal.
