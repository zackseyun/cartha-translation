source:
  edition: SBLGNT
  text: καὶ ἦλθον πρὸς τὸν Ἰωάννην καὶ εἶπαν αὐτῷ· Ῥαββί, ὃς ἦν μετὰ σοῦ πέραν τοῦ Ἰορδάνου, ᾧ σὺ μεμαρτύρηκας, ἴδε οὗτος βαπτίζει καὶ πάντες ἔρχονται πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/026.yaml
  text: And they came to John and said to him[a], “Rabbi, the one who was with you beyond the Jordan, to whom you have borne witness—look, he is baptizing[b], and everyone is going to him.”
translation:
  language: tl
  text: At pumunta sila kay Juan at sinabi sa kanya, “Rabi, ang kasama mo noon sa ibayo ng Jordan, na pinatotohanan mo[a]—tingnan mo, ang taong ito ay nagbabautismo, at pumupunta sa kanya ang lahat.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “na pinatotohanan mo tungkol sa kanya.” Maaaring tumukoy ang anyong datibo sa Griyego sa taong pinatutungkulan ng patotoo o sa taong tungkol kanino ang patotoo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον πρὸς τὸν Ἰωάννην
  choice: pumunta sila kay Juan
  rationale: Maaaring mangahulugang ‘pumunta’ o ‘lumapit’ ang ἔρχομαι ayon sa pananaw; natural sa salaysay na Filipino ang ‘pumunta sila kay Juan.’
- source_word: Ῥαββί
  choice: Rabi
  rationale: Pinananatili ang titulong Judio sa natural na baybay-Filipino sa halip na agad itong ipakahulugang ‘Guro.’
- source_word: ὃς ἦν μετὰ σοῦ πέραν τοῦ Ἰορδάνου
  choice: ang kasama mo noon sa ibayo ng Jordan
  rationale: Ang ‘kasama mo noon’ ay malinaw at natural para sa nakaraang kalagayan; pinananatili ng ‘sa ibayo ng Jordan’ ang heograpikong pagpapahayag.
- source_word: ᾧ σὺ μεμαρτύρηκας
  choice: na pinatotohanan mo
  rationale: Pinananatili nito ang mahalagang bokabularyo ng pagpapatotoo sa Juan. Sadyang hindi tinutukoy sa pangunahing teksto kung ang patotoo ay ibinigay ‘tungkol sa’ kanya o ‘sa’ kanya dahil maaaring tanggapin ng datibo ang alinmang ugnayan.
- source_word: ἴδε
  choice: tingnan mo
  rationale: Isang makabagong panawag-pansin na nagpapanatili sa puwersa ng interjection nang hindi gumagamit ng makalumang pananalita.
- source_word: οὗτος βαπτίζει
  choice: nagbabautismo siya
  rationale: Natural sa Filipino ang panghalip matapos malinaw na matukoy ang tinutukoy. Ang aspektong nagaganap ng ‘nagbabautismo’ ay angkop sa patuloy na gawaing iniuulat; hindi kailangang gawing pilit na ‘ang isang ito.’
- source_word: πάντες ἔρχονται πρὸς αὐτόν
  choice: pumupunta sa kanya ang lahat
  rationale: Ipinahihiwatig ang retorikal na paglalahat ng πάντες at ang patuloy na paglapit ng mga tao, nang hindi ipinipilit na matematikal na bawat tao ay pumunta.
theological_decisions:
- issue: Ang bokabularyo ng pagpapatotoo sa Ebanghelyo ni Juan
  choice: pinatotohanan mo
  alternative: nagpatotoo ka tungkol sa kanya
  rationale: Pinananatili ng ‘pinatotohanan’ ang paulit-ulit at teolohikal na mahalagang diwa ng μαρτυρέω, habang inilalagay sa talababa ang tunay na sintaktikong kalabuan ng datibo.
- issue: Ang diin ng demonstratibong οὗτος
  choice: nagbabautismo siya
  alternative: ang taong ito ay nagbabautismo
  rationale: May bahagyang panturo o matalim na diin ang οὗτος, ngunit magiging hindi natural at posibleng labis ang ‘ang taong ito’ sa Filipino. Ang pagkakasunod na ‘tingnan mo’ at ‘siya’ ay sapat na nagpapahiwatig ng pagtutok nang hindi nagdaragdag ng tahasang pagkainis.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Pinanatili ang ‘Rabi,’ ‘Jordan,’ at ‘nagbabautismo’ bilang pamilyar na mga terminong biblikal. Iniwasan ang makalumang ‘narito’ at ang di-natural na literalismong ‘ang isang ito.’
