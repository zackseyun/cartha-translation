  yaml_path: translation/nt/john/003/035.yaml
  text: The Father loves the Son and has given all things into his hand[a].
translation:
  language: tl
  text: Mahal ng Ama ang Anak, at ibinigay na niya ang lahat sa kamay ng Anak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, literal na “sa kanyang kamay,” na tumutukoy sa Anak. Ang pananalitang ito ay isang idyoma para sa pagkakatiwala ng kapamahalaan o pag-aari.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πατὴρ
  choice: ang Ama
  rationale: Ginamit bilang personal na titulong tumutukoy sa Diyos sa kaugnayan niya sa Anak; ang malaking titik ay angkop sa kontekstong Juanin.
- source_word: ἀγαπᾷ
  choice: Iniibig
  rationale: Likas at marangal na salin ng kasalukuyang pandiwa, na nagpapahayag ng nagpapatuloy na katotohanan.
- source_word: τὸν υἱόν
  choice: ang Anak
  rationale: Pinanatili bilang personal at Kristolohikal na titulo na tumutukoy kay Jesus sa kaugnayan niya sa Ama.
- source_word: πάντα
  choice: ang lahat
  rationale: Saklaw nito ang kabuuan nang hindi nililimitahan kung ano ang tinutukoy ng teksto.
- source_word: δέδωκεν
  choice: ibinigay na niya
  rationale: Ipinahahayag ng aspektong perpektibo at ng “na” ang natapos na pagkakaloob na nananatiling may bisa.
- source_word: ἐν τῇ χειρὶ αὐτοῦ
  choice: sa kamay ng Anak
  rationale: Pinananatili ang larawang “sa kamay” bilang idyoma ng pagkakatiwala ng pag-aari o kapamahalaan. Inulit ang “Anak” sa halip na gumamit ng malabong panghalip upang maging malinaw ang tinutukoy ng αὐτοῦ.
theological_decisions:
- issue: Ang kaugnayan ng Ama at ng Anak
  choice: Pinanatili ang mga personal na titulong “Ama” at “Anak.”
  alternative: Mga pangkalahatang katawagang pampamilya na walang malaking titik
  rationale: Ang konteksto ay tumutukoy sa Diyos bilang Ama at kay Jesus bilang Anak; hindi ito pinalawak nang lampas sa sinasabi ng talata.
- issue: Ang saklaw at nananatiling bisa ng ibinigay sa Anak
  choice: “ibinigay na niya ang lahat”
  alternative: “ibinigay niya ang lahat” o “ipinagkatiwala niya ang lahat”
  rationale: Pinananatili nito ang malawak na saklaw ng πάντα at ipinahihiwatig ang natapos ngunit nananatiling may-bisang kilos ng δέδωκεν, habang hindi nilulutas nang labis kung ang diin ay nasa pag-aari, kapamahalaan, o kapwa nito.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang maikling ayos at ang matalinghagang “sa kamay,” habang iniwasan ang malabong panghalip sa pamamagitan ng pag-uulit sa “Anak.”
