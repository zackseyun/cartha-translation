  text: so that everyone who believes in him may have eternal life[a][b].
translation:
  language: tl
  text: upang ang bawat taong sumasampalataya sa kanya[a] ay magkaroon ng buhay na walang hanggan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sinumang sumasampalataya sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: upang
  rationale: Likas at malinaw na ipinahahayag ang layunin o bunga ng naunang pahayag.
- source_word: πᾶς ὁ πιστεύων
  choice: ang bawat sumasampalataya
  rationale: Pinananatili nito ang pangkalahatan at saklaw-lahat na diwa ng parirala, pati ang nagpapatuloy na paglalarawan sa taong nananampalataya.
- source_word: ἐν αὐτῷ
  choice: sa kanya
  rationale: Ito ang natural na salin sa Filipino ng ἐν αὐτῷ sa kontekstong ito at hindi ipinapasok ang ibang Griyegong pang-ukol na εἰς.
- source_word: ἔχῃ
  choice: ay magkaroon
  rationale: Ang anyong ito ay likas kasunod ng “upang” at angkop na kumakatawan sa Griyegong subjunctive nang hindi nagpapahiwatig ng pag-aalinlangan.
- source_word: ζωὴν αἰώνιον
  choice: buhay na walang hanggan
  rationale: Ito ang malinaw, dignificado, at nakaugaliang salin na angkop sa gamit ni Juan.
theological_decisions:
- issue: Ang pang-ukol sa pariralang ἐν αὐτῷ
  choice: sa kanya
  alternative: tungo sa kanya
  rationale: Ang tekstong Griyego ay gumagamit ng ἐν, hindi εἰς. Kaya pinananatili ng salin ang aktuwal na anyo nang hindi ipinapasok ang mas karaniwang ibang konstruksyon ni Juan.
- issue: Saklaw ng πᾶς ὁ πιστεύων
  choice: ang bawat sumasampalataya
  alternative: sinumang sumasampalataya
  rationale: Malinaw na ipinakikita ng “bawat” ang pangkalahatan at walang-itinatanging saklaw ng parirala, habang nananatiling natural sa modernong Filipino.
translation_notes:
  register: Modernong Filipino na malinaw at dignificado. Ginamit ang nakaugaliang biblikal na “sumasampalataya” at “buhay na walang hanggan” dahil natural pa rin ang mga ito sa karaniwang mambabasa at tumpak sa konteksto.
