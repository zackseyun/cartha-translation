  yaml_path: translation/nt/john/003/009.yaml
  text: Nicodemus answered and said to him[a], “How can these things happen?”
translation:
  language: tl
  text: Sumagot si Nicodemo at sinabi sa kanya, “Paano mangyayari ang mga bagay na ito?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: Sumagot
  rationale: Karaniwang gamit ng deponent na ἀποκρίνομαι sa salaysay ng pag-uusap; natural at tuwirang katumbas sa modernong Tagalog.
- source_word: Νικόδημος
  choice: Nicodemo
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa Tagalog sa halip na isalin ang pangalan.
- source_word: εἶπεν αὐτῷ
  choice: sinabi sa kanya
  rationale: Pinananatili ang tahasang pandiwa at panghalip ng Griyego nang hindi ipinapasok ang pangalang Jesus.
- source_word: Πῶς
  choice: Paano
  rationale: Likas na salitang pananong para sa paraan o posibilidad.
- source_word: δύναται
  choice: mangyayari
  rationale: Ang modal na δύναται ay likas na naipapaloob sa tanong na “Paano mangyayari,” na sa Tagalog ay nagtatanong kung paano magiging posible ang pangyayari.
- source_word: ταῦτα
  choice: ang mga bagay na ito
  rationale: Pinananatili ang maramihang anyo at ang pagtukoy pabalik sa mga bagay na sinabi ni Jesus.
- source_word: γενέσθαι
  choice: mangyayari
  rationale: Ipinahahayag ang eventive na diwa ng γίνομαι bilang pagganap o pagkakaroon ng katuparan; mas natural ito kaysa sa literal ngunit alanganing “magkaroon ng pag-iral.”
theological_decisions:
- issue: Ang tanong ni Nicodemo tungkol sa kung paano magkakatotoo ang mga bagay na inilarawan ni Jesus
  choice: Paano mangyayari ang mga bagay na ito?
  alternative: Paano magiging gayon ang mga bagay na ito?
  rationale: Ang “mangyayari” ay natural na nagpapahayag ng posibilidad at pagganap ng γενέσθαι, ngunit hindi nito ipinapaliwanag o nilulutas ang hiwagang teolohikal na nasa konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Pinanatili ang bahagyang pormal na hulma na “Sumagot… at sinabi” dahil kapwa naroon ang ἀπεκρίθη at εἶπεν sa Griyego, bagaman may kaunting redundansiya ito sa Tagalog.
