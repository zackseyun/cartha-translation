  source_fidelity: 'Tapat ang salin sa SBLGNT: napananatili ang paliwanag na γάρ, ang negasyon ng pagsusugo, ang titulong “ang Anak,” ang magkakatulad na pag-ulit ng κόσμος bilang “sanlibutan,” ang magkatapat na mga sugnay na layunin, ang pasibong “maligtas,” at ang paraang “sa pamamagitan niya.” Ang “hatulan” ay wastong malawak na katumbas ng κρίνῃ at hindi nito sapilitang isinasara ang diwa sa pagkondena.'
