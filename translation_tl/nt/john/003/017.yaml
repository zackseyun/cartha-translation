id: JHN.3.17
reference: John 3:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὐ γὰρ ἀπέστειλεν ὁ θεὸς τὸν ⸀υἱὸν εἰς τὸν κόσμον ἵνα κρίνῃ τὸν κόσμον, ἀλλ’ ἵνα σωθῇ ὁ κόσμος δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/017.yaml
  text: For God did not send the Son into the world so that he might judge the world[a], but so that the world might be saved through him.
translation:
  language: tl
  text: Sapagkat hindi isinugo ng Diyos ang Anak sa sanlibutan upang hatulan ang sanlibutan[a], kundi upang maligtas ang sanlibutan sa pamamagitan niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “upang kondenahin ang sanlibutan.” Maaaring magkaroon ng mas makitid na diwa ang pandiwang Griyego sa kontekstong ito, ngunit ang pangunahing kahulugan nito ay “hatulan.”
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Sapagkat hindi
  rationale: Pinananatili ng “sapagkat” ang paliwanag na ugnayan sa naunang pahayag, at tuwirang ipinahahayag ng “hindi” ang pagkakaila.
- source_word: ἀπέστειλεν
  choice: isinugo
  rationale: Likas at marangal na katumbas ito ng pagpapadala na may layunin, at angkop sa tema ni Juan tungkol sa pagsusugo ng Diyos sa Anak.
- source_word: ὁ θεὸς
  choice: ang Diyos
  rationale: Karaniwang salin ng tiyak na θεός sa kontekstong ito.
- source_word: τὸν υἱὸν
  choice: ang Anak
  rationale: Pinananatili ang tahasang anyo ng Griyego, na walang nakasaad na panghalip na paari, at ang titulong gamit ng “Anak.”
- source_word: εἰς τὸν κόσμον
  choice: sa sanlibutan
  rationale: Natural sa modernong Filipino ang “sa sanlibutan” para sa pagpasok o pagsusugo tungo sa saklaw ng κόσμος.
- source_word: ἵνα κρίνῃ τὸν κόσμον
  choice: upang hatulan ang sanlibutan
  rationale: Ang “hatulan” ay nagpapanatili sa pangunahing diwa ng κρίνω na humatol o magsagawa ng paghatol, sa halip na agad itong paliitin sa “parusahan” o “kondenahin.”
- source_word: ἀλλ’ ἵνα
  choice: kundi upang
  rationale: Malinaw na ipinapakita ang matinding pagsalungat ng dalawang layunin at pinananatili ang magkatulad na kayarian.
- source_word: σωθῇ
  choice: maligtas
  rationale: Ipinapakita ng anyong “maligtas” ang pasibong diwa at pinananatili ang malawak na kahulugan ng pagliligtas.
- source_word: ὁ κόσμος
  choice: ang sanlibutan
  rationale: Pare-parehong salin sa tatlong paglitaw ng κόσμος at hindi ito pinakikitid nang tahasan sa “mga tao.”
- source_word: δι’ αὐτοῦ
  choice: sa pamamagitan niya
  rationale: Tumpak na ipinapahayag ang paraan o ahensiya ng διά na may genitive nang hindi nagdaragdag ng interpretasyon.
theological_decisions:
- issue: Kahulugan ng κρίνῃ sa pagtutulad laban sa σωθῇ
  choice: hatulan
  alternative: kondenahin
  rationale: 'Mas malawak ang κρίνω kaysa “kondenahin.” Pinananatili ng “hatulan” ang leksikal at teolohikal na tensiyon: ang layunin ng pagsusugo ay hindi ang paghatol sa sanlibutan kundi ang pagliligtas dito, nang hindi ipinapasiya sa salin na ang tinutukoy ay paghatol na tiyak na humahantong sa kaparusahan. Itinatala sa talababa ang mas makitid na pagbasa.'
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sanlibutan” upang mapanatili ang tradisyonal ngunit nauunawaang katawagan at ang paulit-ulit na teolohikal na gamit ng κόσμος; iniwasan ang mas kolokyal na pananalita at ang pagdaragdag ng tahasang “kanyang” bago ang Anak.
