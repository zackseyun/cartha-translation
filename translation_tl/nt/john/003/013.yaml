base_translation:
  language: en
  yaml_path: translation/nt/john/003/013.yaml
  text: And no one has ascended into heaven except the one who descended from heaven—the Son of Man[a][b].
translation:
  language: tl
  text: At walang sinumang umakyat sa langit maliban sa bumaba mula sa langit—ang Anak ng Tao.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “ang bumaba galing sa langit.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “Anak ng Tao” ang karaniwang katawagan ni Jesus sa kanyang sarili at umaalingawngaw sa Daniel 7:13–14.
    reason: cross_reference
lexical_decisions:
- source_word: οὐδεὶς
  choice: walang sinuman
  rationale: Likas at saklaw-lahat na katumbas ng negatibong panghalip; hindi nito nililimitahan ang tinutukoy sa mga lalaki.
- source_word: ἀναβέβηκεν
  choice: umakyat
  rationale: Ipinapahayag ang pag-akyat tungo sa langit. Bagaman perpekto ang anyong Griyego, ang simpleng aspektong Filipino ang pinakanatural dito at hindi nangangailangang dagdagan ng tahasang panandang temporal.
- source_word: εἰς τὸν οὐρανόν
  choice: sa langit
  rationale: Karaniwang Filipino para sa direksiyon ng pag-akyat tungo sa langit; sapat na naihahatid ng “sa” ang kilos na ipinahihiwatig ng εἰς.
- source_word: εἰ μὴ
  choice: maliban sa
  rationale: Malinaw at natural na nagpapakilala sa tanging eksepsiyon sa naunang negatibong pahayag.
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβάς
  choice: ang bumaba mula sa langit
  rationale: Pinananatili ang substantibong participial na parirala at ang tuwirang kaibahan ng umakyat at bumaba; ang “mula sa” ay malinaw na naghahayag ng pinagmulan.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Kinikilalang katawagan ni Jesus sa mga Ebanghelyo at pinananatili ang ugnay nito sa Daniel 7:13–14 nang hindi ito pinapakahulugang muli.
theological_decisions:
- issue: Kristolohikal na bigat ng “ὁ υἱὸς τοῦ ἀνθρώπου”
  choice: Isinalin bilang kinikilalang titulong “ang Anak ng Tao.”
  alternative: “ang Taong Anak” o isang pangkalahatang katawagang gaya ng “ang Tao”
  rationale: Pinananatili nito kapwa ang anyong Semitiko at ang apokaliptikong alusyon, sa halip na lutasin ang tensiyon bilang isa lamang pangkalahatang paglalarawan sa pagiging tao.
- issue: Aspekto at temporal na pahiwatig ng ἀναβέβηκεν at καταβάς
  choice: Ginamit ang natural na “umakyat” at “bumaba” nang walang interpretibong pagpapalawak.
  alternative: “nakaaakyat” o “umakyat na” at “nagmula”
  rationale: Nananatili ang matibay na pahayag tungkol sa natatanging pag-akyat at makalangit na pinagmulan ng Anak ng Tao, habang iniiwasan ang pagdaragdag ng kahulugang hindi tahasang nasa Griyego.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang maikli at mariing kaayusan ng Griyego, pati ang magkatapat na “umakyat” at “bumaba.”
