  text: ὃν γὰρ ἀπέστειλεν ὁ θεὸς τὰ ῥήματα τοῦ θεοῦ λαλεῖ, οὐ γὰρ ἐκ μέτρου ⸀δίδωσιν τὸ πνεῦμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/034.yaml
  text: For the one whom God sent speaks the words of God[a], for he gives the Spirit without measure.
translation:
  language: tl
  text: Sapagkat ang isinugo ng Diyos ay nagsasalita ng mga salita ng Diyos. Sapagkat ang Espiritu ay ibinibigay nang walang sukat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, walang tahasang paksa ang pandiwang “ibinibigay.” Maaaring unawain na ang Diyos ang nagbibigay ng Espiritu nang walang sukat; maaari rin itong unawain na ang isinugo ng Diyos ang nagbibigay.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃν
  choice: ang isinugo
  rationale: Ginagawang natural sa Tagalog ang substantibong kamag-anak na panghalip; malinaw na tumutukoy sa taong isinugo ng Diyos nang hindi nagdaragdag ng pangalan o titulo.
- source_word: ἀπέστειλεν
  choice: isinugo
  rationale: Pinananatili ang karaniwang wikang Juan tungkol sa pagsusugo at ang payak na aspektong nakaraan ng aorist.
- source_word: τὰ ῥήματα τοῦ θεοῦ
  choice: mga salita ng Diyos
  rationale: Tuwirang pinananatili ang maramihang ῥήματα at ang genitibong τοῦ θεοῦ sa natural at marangal na Tagalog.
- source_word: λαλεῖ
  choice: nagsasalita
  rationale: Ipinahahayag ang patuloy o pangkalahatang pagsasalita; mas angkop kaysa sa mas makitid na “sinasabi.”
- source_word: οὐ ... ἐκ μέτρου
  choice: nang walang sukat
  rationale: Pinananatili ang metapora ng pagbibigay na hindi nililimitahan o tinatakdaan.
- source_word: δίδωσιν
  choice: ibinibigay niya
  rationale: Tuwirang salin ng present indicative; pinananatiling hindi tahasang pinapangalanan ang paksa gaya sa Griyego.
- source_word: τὸ πνεῦμα
  choice: ang Espiritu
  rationale: Sa konteksto ni Juan, natural itong tumutukoy sa Espiritu ng Diyos; ang malaking titik ay karaniwang palatandaan nito sa Filipino.
theological_decisions:
- issue: Paksa ng δίδωσιν (“ibinibigay”)
  choice: Ang panghalip na “niya” sa pangunahing teksto ay inuunawang tumutukoy sa Diyos.
  alternative: Maaaring tumukoy ang “niya” sa isinugo ng Diyos, ang Anak.
  rationale: Mas pinapaboran ng daloy ng pangungusap ang Diyos bilang nagbibigay ng Espiritu, na nagpapaliwanag kung bakit nagsasalita ng mga salita ng Diyos ang isinugo niya. Gayunman, walang hayag na paksa ang δίδωσιν sa Griyego, kaya pinananatili sa talababa ang tunay na posibilidad na ang isinugo ang nagbibigay ng Espiritu.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “isinugo” upang mapanatili ang mahalagang bokabularyo ng pagsusugo sa Ebanghelyo ni Juan. Ang “nang walang sukat” ay sadyang nagpapanatili sa orihinal na metapora at sa teolohikal na tensiyon tungkol sa nagbibigay ng Espiritu.
