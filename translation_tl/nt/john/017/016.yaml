  yaml_path: translation/nt/john/017/016.yaml
  text: They are not from the world[a], just as I am not from the world.
translation:
  language: tl
  text: Hindi sila mula sa sanlibutan[a], kung paanong ako ay hindi mula sa sanlibutan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kabilang sa sanlibutan.” Ang salitang Griyego na ἐκ ay maaaring tumukoy sa pinagmulan, pinag-ugatan, o pagkabilang.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ
  choice: nagmula sa
  rationale: Ipinahahayag ng ἐκ ang pinagmulan o pinag-ugatan. Likas sa makabagong Tagalog ang “nagmula sa” at pinananatili nito ang diwa ng Griyego nang hindi nililimitahan sa pisikal na lokasyon.
- source_word: κόσμου
  choice: sanlibutan
  rationale: Ang “sanlibutan” ay isang marangal at nauunawaang katumbas ng κόσμος sa kontekstong Juaniko. Hindi ito pinalawak bilang “sistema ng sanlibutan,” upang manatili ang lawak at tensiyong taglay ng orihinal.
- source_word: οὐκ εἰσὶν
  choice: Hindi sila nagmula
  rationale: Sa pagsama sa pariralang ἐκ τοῦ κόσμου, natural na ipinahahayag sa Tagalog ang negadong kasalukuyang kalagayan sa pamamagitan ng “Hindi sila nagmula sa,” sa halip na literal ngunit di-likas na “Hindi sila mula sa.”
- source_word: καθὼς
  choice: kung paanong
  rationale: Malinaw na ipinakikita ng “kung paanong” ang paghahambing at pagkakatulad sa pagitan ng mga alagad at ni Jesus.
- source_word: ἐγὼ
  choice: ako
  rationale: Pinananatili ang tahasang panghalip dahil mahalaga ito sa diin at paghahambing ng dalawang sugnay.
- source_word: οὐκ εἰμὶ
  choice: hindi nagmula
  rationale: Kasama ng ἐκ τοῦ κόσμου, ang “hindi nagmula” ay natural na Tagalog na nagpapanatili sa diwa ng pinagmulan; ang “ako ay” ay tumutugma sa tahasang paghahambing.
- source_word: ἐκ τοῦ κόσμου
  choice: nagmula sa sanlibutan
  rationale: Magkaparehong salin ang ginamit sa dalawang sugnay upang mapanatili ang sadyang pag-uulit at paralelismo ng Griyego.
theological_decisions:
- issue: Kahulugan ng “sanlibutan” sa teolohiya ni Juan
  choice: Panatilihin ang payak na “sanlibutan” nang walang paliwanag na idinagdag sa pangunahing teksto.
  alternative: “sistema ng sanlibutan” o “kasalukuyang kaayusang hiwalay sa Diyos”
  rationale: May malalim at kontekstuwal na gamit ang κόσμος kay Juan, ngunit hindi ito nililinaw ng talata bilang isang partikular na “sistema.” Ang payak na salita ay nagpapanatili sa tunay na lawak at teolohikal na tensiyon ng teksto.
- issue: Pinagmulan o pag-aari sa pariralang ἐκ τοῦ κόσμου
  choice: “nagmula sa sanlibutan” sa pangunahing teksto, na may talababa tungkol sa diwa ng pag-aari o pagkabilang
  alternative: “kabilang sa sanlibutan”
  rationale: Mas tuwirang sinasalamin ng “nagmula sa” ang ἐκ, habang kinikilala sa talababa na maaari ring ipahiwatig ng parirala ang pagkabilang o pagkakaugnay.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “sanlibutan” upang mapanatili ang bokabularyong teolohikal ni Juan nang hindi nagpapasok ng interpretibong pagpapalawak. Ang paralelismo ng dalawang sugnay ay sadyang pinanatili.
