id: JHN.17.24
reference: John 17:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀πάτερ, ⸀ὃ δέδωκάς μοι, θέλω ἵνα ὅπου εἰμὶ ἐγὼ κἀκεῖνοι ὦσιν μετ’ ἐμοῦ, ἵνα θεωρῶσιν τὴν δόξαν τὴν ἐμὴν ἣν ⸀δέδωκάς μοι, ὅτι ἠγάπησάς με πρὸ καταβολῆς κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/024.yaml
  text: Father[a], I desire that those whom you have given me also may be with me where I am, so that they may see my glory that you have given me, because you loved me before the foundation of the world.
translation:
  language: tl
  text: Ama, nais kong ang mga ibinigay mo sa akin[a] ay makasama ko rin kung saan ako naroroon, upang makita nila ang aking kaluwalhatiang ibinigay mo sa akin, sapagkat inibig mo ako bago pa itatag ang sanlibutan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, literal na “ang ibinigay mo sa akin” o “yaong ibinigay mo sa akin.” Kolektibo ang pananalita at tumutukoy sa mga taong ibinigay ng Ama sa Anak; kaya isinaling “ang mga ibinigay mo sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάτερ
  choice: Ama
  rationale: Likas at marangal na pantawag sa Diyos sa modernong Tagalog, nang hindi idinaragdag ang panghalip na “ko” na wala sa Griyego.
- source_word: ὃ δέδωκάς μοι
  choice: ang mga ibinigay mo sa akin
  rationale: Bagaman neuter singular ang ὃ (“ang ibinigay” o “yaong ibinigay”), kolektibo ang gamit nito at ang kasunod na plural na κἀκεῖνοι at ὦσιν ay nagpapakitang mga tao ang tinutukoy. Nililinaw ito ng “ang mga” sa likas na Tagalog, habang itinatala sa talababa ang literal na anyo.
- source_word: δέδωκάς
  choice: ibinigay mo
  rationale: Ipinahihiwatig ng konteksto ang natapos na pagbibigay na nananatili ang bunga; hindi kailangang dagdagan ng pantulong na salita sa Tagalog upang maipahayag ito nang natural.
- source_word: θέλω
  choice: nais ko
  rationale: Pinananatili ang tunay na puwersa ng pagnanais o kalooban ni Jesus nang hindi ito ginagawang tahasang utos o pahayag lamang tungkol sa hinaharap.
- source_word: ὅπου εἰμὶ ἐγώ
  choice: kung saan ako naroroon
  rationale: Malinaw at natural na katumbas na nagpapahayag ng lugar na kinaroroonan ni Jesus; sapat na naipahihiwatig ng “ako” ang tahasang ἐγώ.
- source_word: κἀκεῖνοι ὦσιν μετ’ ἐμοῦ
  choice: ay makasama ko rin
  rationale: Ang “rin” ay nagpapanatili sa pandagdag na puwersa ng κἀκεῖνοι, at likas sa Tagalog ang “makasama ko” para sa pagiging kasama niya.
- source_word: θεωρῶσιν
  choice: makita nila
  rationale: Malinaw at pangkaraniwang salin ng “makita/masaksihan,” nang hindi gumagamit ng makalumang pananalita.
- source_word: τὴν δόξαν τὴν ἐμήν
  choice: ang aking kaluwalhatian
  rationale: Pinananatili ang diin sa kaluwalhatiang pag-aari ng Anak sa natural at marangal na Tagalog.
- source_word: ἣν δέδωκάς μοι
  choice: na ibinigay mo sa akin
  rationale: Tuwirang pinananatili ang sugnay na tumutukoy sa kaluwalhatian at sa Ama bilang nagbigay nito.
- source_word: ὅτι
  choice: sapagkat
  rationale: Ipinahahayag ang sanhi o dahilan habang pinananatili ang marangal na himig ng panalangin.
- source_word: πρὸ καταβολῆς κόσμου
  choice: bago pa itatag ang sanlibutan
  rationale: Pinananatili ang temporal na pahayag at ang larawang “pagtatatag/paglalagay ng pundasyon” nang hindi ito pinalalawak sa isang interpretibong paraphrase.
theological_decisions:
- issue: Ang pag-iral ng Anak bago pa ang sanlibutan, na ipinahihiwatig ng pag-ibig ng Ama sa kanya
  choice: 'Pinanatili ang tuwirang temporal na pahayag: “inibig mo ako bago pa itatag ang sanlibutan.”'
  alternative: Mga paraphrase na gagawing metaporikal o palalabnawin ang pagtukoy sa panahon bago ang paglikha.
  rationale: Malinaw na inilalagay ng Griyego ang pag-ibig ng Ama sa Anak bago ang pagkakatatag ng sanlibutan; hindi ito dapat pahinain o dagdagan ng paliwanag sa mismong teksto.
- issue: Puwersa ng θέλω sa panalangin ni Jesus
  choice: “nais ko”
  alternative: “ipinag-uutos ko” o “gusto ko”
  rationale: Ipinakikita ng “nais ko” ang matibay na kalooban o pagnanais ngunit hindi nito ginagawang utos ang panalangin; mas marangal din ito kaysa “gusto ko.”
- issue: Ang kaluwalhatiang ibinigay ng Ama sa Anak
  choice: Pinanatili ang payak na pahayag na ibinigay ng Ama ang kaluwalhatian sa Anak.
  alternative: Mga paliwanag na tutukoy kung kailan o sa anong tiyak na paraan ibinigay ang kaluwalhatian.
  rationale: Hindi nilulutas ng talata ang lahat ng ugnayan sa pagitan ng kaluwalhatian, pag-ibig bago ang paglikha, at pagbibigay ng Ama; dapat manatili ang teolohikal na tensiyong ito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “Ama,” “nais,” “kaluwalhatian,” at “sanlibutan” bilang pamilyar ngunit dignified na bokabularyo sa kontekstong biblikal; iniwasan ang labis na makaluma o teknikal na pananalita.
