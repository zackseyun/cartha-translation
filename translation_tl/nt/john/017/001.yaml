id: JHN.17.1
reference: John 17:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ταῦτα ⸀ἐλάλησεν Ἰησοῦς, καὶ ⸂ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ εἰς τὸν οὐρανὸν εἶπεν⸃· Πάτερ, ἐλήλυθεν ἡ ὥρα· δόξασόν σου τὸν υἱόν, ⸀ἵνα ὁ ⸀υἱὸς δοξάσῃ σέ,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/001.yaml
  text: 'Jesus said these things, and lifting up his eyes to heaven, he said: “Father, the hour has come. Glorify your Son, so that the Son may glorify you,”'
translation:
  language: tl
  text: Sinabi ni Jesus ang mga bagay na ito. Pagkatapos, itiningala niya ang kanyang mga mata sa langit at sinabi, “Ama, dumating na ang oras. Luwalhatiin mo ang iyong Anak upang luwalhatiin ka ng Anak.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταῦτα ἐλάλησεν
  choice: Sinabi ni Jesus ang mga bagay na ito
  rationale: Pinananatili ng “ang mga bagay na ito” ang pangmaramihang demonstratibo na tumutukoy sa naunang pahayag, habang ang “sinabi” ay likas na Tagalog para sa ἐλάλησεν sa ganitong konteksto.
- source_word: ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: itiningala niya ang kanyang mga mata
  rationale: Ang “itiningala” ay natural na paglalarawan ng pisikal na kilos na ipinahihiwatig ng ἐπαίρω; pinananatili rin ang tahasang layon na “mga mata.”
- source_word: εἰς τὸν οὐρανόν
  choice: sa langit
  rationale: Sa konstruksiyong “itiningala ... sa langit,” malinaw at natural na naihahayag ang direksiyon ng εἰς.
- source_word: Πάτερ
  choice: Ama
  rationale: Tuwirang bokatibong tawag ito; hindi dinagdagan ng “ko” sapagkat wala iyon sa Griyego.
- source_word: ἐλήλυθεν ἡ ὥρα
  choice: dumating na ang oras
  rationale: Ipinahahayag ng “dumating na” ang ganap at tiyak na pagdating ng itinakdang oras, at pinananatili ng “oras” ang mahalagang temang Johannine.
- source_word: δόξασόν
  choice: Luwalhatiin mo
  rationale: Ang “luwalhatiin” ang pinakamalapit na kasalukuyang salin na nagpapanatili sa bigat ng δοξάζω bilang paghahayag at pagkakaloob ng kaluwalhatian, hindi lamang karaniwang paggalang.
- source_word: σου τὸν υἱόν
  choice: ang iyong Anak
  rationale: Likas na ipinahahayag ang genitibong pagmamay-ari; ang malaking titik ay nagpapakitang titulo ang “Anak” para kay Jesus.
- source_word: ἵνα ὁ υἱὸς δοξάσῃ σέ
  choice: upang luwalhatiin ka ng Anak
  rationale: Ang “upang” ay malinaw na naghahayag ng layunin, at ang “ang Anak” ay pinanatili bilang hiwalay na titular na paksa sa halip na uliting “iyong Anak.”
theological_decisions:
- issue: Ang magkatugong pagluwalhati ng Ama at ng Anak
  choice: “Luwalhatiin mo ang iyong Anak upang luwalhatiin ka ng Anak”
  alternative: “Parangalan mo ang iyong Anak upang parangalan ka niya”
  rationale: Pinananatili ng “luwalhatiin” ang teolohikal at mapaghayag na bigat at ang simetriya ng δοξάζω, nang walang idinaragdag na paliwanag tungkol sa paraan ng pagluwalhati.
- issue: Pagkilala sa υἱός bilang titulong tumutukoy kay Jesus
  choice: Anak
  alternative: anak
  rationale: Ang malaking titik ay tumutulong sa modernong mambabasang Tagalog na makilala ang titular na pagtukoy kay Jesus nang hindi binabago ang kahulugang leksikal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Pagkatapos” upang natural na iugnay ang sunod na kilos, habang hindi binabago ang pagkakasunod ng salaysay. Walang talababa dahil walang mahalagang tekstuwal o leksikal na kalabuan sa talatang ito na nangangailangan ng paliwanag sa publikasyon.
