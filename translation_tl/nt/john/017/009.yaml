  text: ἐγὼ περὶ αὐτῶν ἐρωτῶ· οὐ περὶ τοῦ κόσμου ἐρωτῶ ἀλλὰ περὶ ὧν δέδωκάς μοι, ὅτι σοί εἰσιν,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/009.yaml
  text: I am asking on their behalf[a]. I am not asking on behalf of the world, but on behalf of those whom you have given me[b], because they are yours.
translation:
  language: tl
  text: Humihiling ako para sa kanila[a]. Hindi ako humihiling para sa sanlibutan, kundi para sa mga ibinigay mo sa akin, sapagkat sa iyo sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Humihiling ako tungkol sa kanila.” Ang Griyegong pang-ukol ay maaaring mangahulugang “tungkol sa” o, sa kontekstong ito, “para sa/alang-alang sa.” Ang pandiwa ay mas literal na “humihiling” o “nakikiusap.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρωτῶ
  choice: idinadalangin ko
  rationale: Pangunahing nangangahulugan ang pandiwa na “humihingi” o “nakikiusap,” ngunit sa kontekstong tuwirang pakikipag-usap ni Jesus sa Ama, likas sa modernong Tagalog ang “idinadalangin.” Ipinaliliwanag sa talababa ang mas literal na alternatibo.
- source_word: περὶ αὐτῶν
  choice: sila
  rationale: Sa pananalangin, ang περί na may genitive ay maaaring tumukoy sa paksa o sa kapakanan ng ipinapanalangin. Ang “idinadalangin ko sila” ay natural at hindi nangangailangang magpasya nang tahasan sa pagitan ng “tungkol sa kanila” at “para sa kanila”; nasa talababa ang saklaw ng Griyego.
- source_word: κόσμου
  choice: ang sanlibutan
  rationale: Pinananatili ang malawak at teolohikal na maigting na katawagang κόσμος nang hindi ito pinakikitid sa “sangkatauhan” o sa isang partikular na masamang sistema.
- source_word: ὧν δέδωκάς μοι
  choice: ang mga ibinigay mo sa akin
  rationale: Ang pangmaramihang pantukoy at sugnay ay natural na tumutukoy sa mga tao. Bagaman perfect ang δέδωκάς, sapat na ipinahihiwatig ng Tagalog na “ibinigay mo” ang naganap na pagbibigay na nananatiling mahalaga sa kasalukuyan.
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw na ipinakikita ang sanhi o batayan ng pakiusap sa isang marangal at natural na pang-ugnay.
- source_word: σοί εἰσιν
  choice: sila ay sa iyo
  rationale: Pinananatili ang tuwiran at relasyonal na diwa ng pag-aari nang hindi ito dinaragdagan ng interpretasyon.
- source_word: ἐγὼ
  choice: ko
  rationale: Nakapaloob sa pandiwang Tagalog ang unang panauhang paksa; ang pag-uulit ng “ko” sa magkatapat na sugnay ay nagpapanatili sa diin at kontrast ng Griyego.
- source_word: ἀλλὰ
  choice: kundi
  rationale: Natural na katapat sa balangkas na “hindi ... kundi,” at malinaw na minamarkahan ang matinding paghahambing.
theological_decisions:
- issue: Kung gagamit ng tahasang wikang panalangin para sa ἐρωτῶ
  choice: “Idinadalangin ko” sa teksto, na may talababa para sa mas literal na “hinihiling ko”
  alternative: “Hinihiling ko alang-alang sa kanila” o “Humihingi ako para sa kanila”
  rationale: Ang konteksto ay panalangin ni Jesus sa Ama, kaya natural sa Tagalog ang “idinadalangin.” Gayunman, hindi ikinukubli ang payak na diwa ng pandiwang “humingi/makiusap,” na inilalahad sa talababa.
- issue: Saklaw ng “sanlibutan” bilang kataliwas ng mga ibinigay ng Ama
  choice: Pinanatili ang “sanlibutan” nang walang paliit na paliwanag sa pangunahing teksto
  alternative: “sangkatauhan” o “masamang sistema ng sanlibutan”
  rationale: May sari-saring magkakaugnay na gamit ang κόσμος sa Juan. Ang hindi pagpapakitid sa kahulugan nito ay nagpapanatili sa tunay na teolohikal na tensiyon ng talata at umiiwas sa sektaryong pagbasa.
- issue: Ugnayan ng περί sa panalangin
  choice: Natural na “idinadalangin ko sila,” na may talababa sa posibleng “tungkol sa” at “para sa/alang-alang sa”
  alternative: “Tungkol sa kanila ako humihiling”
  rationale: Maaaring ipahayag ng περί na may genitive ang paksa o kapakanan sa ganitong konteksto. Ang talababa ang nagpapanatili sa leksikal na kalabuan nang hindi ginagawang mabigat ang pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “sanlibutan” upang mapanatili ang pamilyar na bokabularyong Juaniko at ang malawak na kahulugan ng κόσμος. Iniwasan ang sobrang literal ngunit mabigat na paulit-ulit na “tungkol sa,” habang ang talababa ay nagpapanatili sa leksikal na kalabuan.
