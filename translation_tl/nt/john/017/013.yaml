revisions:
- from: Ngunit ngayon, pupunta ako sa iyo. Sinasabi ko ang mga bagay na ito habang narito ako sa sanlibutan upang mapasakanila ang aking kagalakan at malubos ito sa kanilang kalooban.[a]
  to: Ngunit ngayon ay lumalapit ako sa iyo, at sinasabi ko ang mga bagay na ito sa sanlibutan upang lubos nilang taglayin sa kanilang sarili ang aking kagalakan.[a]
  rationale: Inihanay ang salin sa kasalukuyang anyo ng ἔρχομαι, inalis ang idinagdag na temporal na “narito ako,” at muling inayos ang huling sugnay upang ang “aking kagalakan” ang malinaw na lubos na taglay ng mga alagad. Ang literal na “sa kanilang sarili” ay nasa pangunahing teksto, samantalang ang mas idiomatikong panloob na pagbasa ay nasa talababa.
