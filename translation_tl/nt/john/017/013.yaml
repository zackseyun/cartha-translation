  text: νῦν δὲ πρὸς σὲ ἔρχομαι, καὶ ταῦτα λαλῶ ἐν τῷ κόσμῳ ἵνα ἔχωσιν τὴν χαρὰν τὴν ἐμὴν πεπληρωμένην ἐν ⸀ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/013.yaml
  text: But now I am coming to you[b][a], and I am speaking these things in the world so that they may have my joy fulfilled in themselves.
translation:
  language: tl
  text: Ngunit ngayon ay lumalapit ako sa iyo, at sinasabi ko ang mga bagay na ito sa sanlibutan upang lubos nilang taglayin sa kanilang sarili ang aking kagalakan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kanilang kalooban.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν δὲ
  choice: Ngunit ngayon
  rationale: Ipinahahayag ng νῦν ang kasalukuyang sandali, at ang δέ ay nagbibigay ng banayad na pagsalungat o paglipat mula sa naunang sinabi.
- source_word: πρὸς σὲ ἔρχομαι
  choice: pupunta ako sa iyo
  rationale: Likas sa modernong Tagalog ang hinaharap na anyo sa kontekstong ito ng nalalapit na pag-alis ni Jesus patungo sa Ama; pinananatili ng “sa iyo” ang direksiyong ipinahahayag ng πρὸς.
- source_word: ταῦτα λαλῶ
  choice: Sinasabi ko ang mga bagay na ito
  rationale: Malinaw at natural itong katumbas ng kasalukuyang pagkilos ng pagsasalita sa λαλῶ.
- source_word: ἐν τῷ κόσμῳ
  choice: habang narito ako sa sanlibutan
  rationale: Ginagawang malinaw ng “habang narito ako” ang temporal na implikasyon ng pananalita ni Jesus sa loob ng sanlibutan, habang pinananatili ang mahalagang bokabularyong Juanino na “sanlibutan.”
- source_word: ἵνα ἔχωσιν
  choice: upang mapasakanila
  rationale: Pinananatili ng “upang” ang layuning ipinahahayag ng ἵνα, at natural na ipinahahayag ng “mapasakanila” ang pagkakaroon ng kagalakan.
- source_word: τὴν χαρὰν τὴν ἐμὴν
  choice: ang aking kagalakan
  rationale: Direkta at natural nitong pinananatili na ang kagalakang tinutukoy ay yaong kay Jesus mismo.
- source_word: πεπληρωμένην
  choice: malubos
  rationale: Ipinahahayag ng “malubos” ang pagdadala sa ganap na kapuspusan at ang resultang kalagayang taglay ng perfect passive participle.
- source_word: ἐν ἑαυτοῖς
  choice: sa kanilang kalooban
  rationale: Natural nitong ipinahahayag ang panloob na pagdanas o pagtataglay na malamang na diwa ng reflexive phrase, nang hindi itinatanggi ang mas literal na anyo.
theological_decisions:
- issue: Kalikasan ng “aking kagalakan”
  choice: Ang kagalakang pag-aari ni Jesus ang mapapasakanila at malulubos sa kanilang kalooban.
  alternative: Ang tinutukoy ay kagalakan tungkol kay Jesus, hindi ang sariling kagalakan ni Jesus.
  rationale: 'Pinakamadaling unawain ang ἐμὴν bilang tunay na paari: kagalakang kay Jesus. Hindi pinalalawak ng salin ang pahayag tungo sa isang tiyak na doktrina tungkol sa pakikibahagi o pakikipag-isa.'
- issue: Saklaw ng ἐν ἑαυτοῖς
  choice: sa kanilang kalooban
  alternative: sa kanilang sarili; sa gitna nila
  rationale: Malamang na tumutukoy ito sa panloob na pagdanas ng mga alagad, ngunit may puwang ang Griyego para sa mas literal o bahagyang kolektibong pagbasa; kaya itinatala ang mga alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “sanlibutan” upang mapanatili ang tematikong bokabularyo ng Juan, samantalang ang “sa kanilang kalooban” ay mas natural kaysa sa mahigpit na literal na “sa kanilang sarili.”
