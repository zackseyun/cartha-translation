id: JHN.17.8
reference: John 17:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτι τὰ ῥήματα ἃ ⸀ἔδωκάς μοι δέδωκα αὐτοῖς, καὶ αὐτοὶ ἔλαβον καὶ ἔγνωσαν ἀληθῶς ὅτι παρὰ σοῦ ἐξῆλθον, καὶ ἐπίστευσαν ὅτι σύ με ἀπέστειλας.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/008.yaml
  text: For the words that you gave me I have given to them[a], and they received them and truly came to know that I came from you[b], and they believed that you sent me.
translation:
  language: tl
  text: Sapagkat ang mga salitang ibinigay mo sa akin ay naibigay ko na sa kanila[a]. Tinanggap nila ang mga iyon at tunay nilang nalaman na nagmula ako sa iyo[b], at naniwala silang ikaw ang nagsugo sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga sinabi na ibinigay mo sa akin.”
    reason: lexical_alternative
  - marker: b
    text: O “lumabas ako mula sa iyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥήματα
  choice: mga salita
  rationale: Pinananatili nito ang kongkretong anyong maramihan ng ῥήματα at likas itong tumutukoy sa mga salitang binigkas, nang hindi ito binibigyang-kahulugan bilang iisang “mensahe.”
- source_word: ἔδωκάς ... δέδωκα
  choice: ibinigay mo ... naibigay ko na
  rationale: Ang “ibinigay mo” ay tumutugma sa aorist, samantalang ang “naibigay ko na” ay nagpapahiwatig ng natapos na pagbibigay na may nananatiling bunga, ayon sa perfect na δέδωκα.
- source_word: ἔλαβον
  choice: tinanggap
  rationale: Sa konteksto ng pagtanggap sa ipinahayag na mga salita, mas natural ang “tinanggap” kaysa pisikal na “kinuha,” nang hindi dinaragdagan ang diwa.
- source_word: ἔγνωσαν ἀληθῶς
  choice: tunay nilang nalaman
  rationale: Pinananatili ng “tunay” ang ἀληθῶς, at ipinapakita ng “nalaman” ang natamong pagkakilala o pagkaunawa na ipinahihiwatig ng aorist na ἔγνωσαν.
- source_word: παρὰ σοῦ ἐξῆλθον
  choice: nagmula ako sa iyo
  rationale: Likas itong Tagalog para sa pinagmulan na ipinahahayag ng παρά na may genitive at ng ἐξέρχομαι, habang hindi nilulutas ang higit na teolohikal na bigat ng pahayag.
- source_word: ἐπίστευσαν ὅτι
  choice: naniwala silang
  rationale: Ang ὅτι-clause ay naghahayag ng proposisyong pinaniwalaan; kaya mas tumpak ang “naniwala silang” kaysa “nagtiwala silang.”
- source_word: ἀπέστειλας
  choice: nagsugo
  rationale: Ang “nagsugo” ay natural at marangal na katumbas ng ἀποστέλλω sa konteksto ng pagpapadala ng Ama kay Jesus, nang hindi idinaragdag ang mas tiyak na ideya ng paghirang o pagkomisyon.
- source_word: ὅτι
  choice: Sapagkat
  rationale: Ang unang ὅτι ay nagpapaliwanag o nagbibigay ng dahilan kaugnay ng naunang pahayag; malinaw itong naiuugnay ng “Sapagkat.”
theological_decisions:
- issue: Ugnayan ni Jesus at ng Ama sa παρὰ σοῦ ἐξῆλθον
  choice: nagmula ako sa iyo
  alternative: lumabas ako mula sa iyo
  rationale: Pinananatili ng salin ang pahayag tungkol sa pinagmulan ni Jesus nang hindi nagdaragdag ng kalaunang teknikal na terminolohiyang teolohikal; ang alternatibo ay mas literal ngunit hindi gaanong natural sa modernong Tagalog.
- issue: Pagpapakahulugan sa πιστεύω na sinusundan ng ὅτι-clause
  choice: naniwala silang ikaw ang nagsugo sa akin
  alternative: nagtiwala silang ikaw ang nagsugo sa akin
  rationale: Dahil isang proposisyon ang nilalaman ng sugnay, pinananatili ng “naniwala” ang sintaktikong diin at iniiwasang ilipat ito sa higit na relasyonal na diwa ng “nagtiwala.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mga salita,” “tinanggap,” at “nagsugo” bilang likas na bokabularyong biblikal na hindi makaluma. Pinanatili ang pag-uulit ng “ibinigay” upang maipakita ang ugnayan ng ibinigay ng Ama at ng ibinigay ni Jesus sa mga alagad.
