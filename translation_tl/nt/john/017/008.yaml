  source_fidelity: Tumpak ang salin sa pagkakasunod at ugnayan ng mga sugnay sa Griyego. Naiingatan ang maramihang “mga salita,” ang natapos na pagbibigay sa “naibigay ko na,” ang pagtanggap at tunay na pagkilala ng mga alagad, ang pinagmulan ni Jesus mula sa Ama, at ang paniniwala nilang isinugo siya ng Ama.
  naturalness: Likas at malinaw ang modernong Tagalog. Ang paghahati sa dalawang pangungusap ay hindi nakapagbabago sa lohikal na daloy; ang “Tinanggap nila ang mga iyon” ay malinaw na tumutukoy sa “mga salita.”
