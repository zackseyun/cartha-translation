id: JHN.17.12
reference: John 17:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτε ἤμην μετ’ ⸀αὐτῶν ἐγὼ ἐτήρουν αὐτοὺς ἐν τῷ ὀνόματί σου ⸀ᾧ δέδωκάς μοι, ⸀καὶ ἐφύλαξα, καὶ οὐδεὶς ἐξ αὐτῶν ἀπώλετο εἰ μὴ ὁ υἱὸς τῆς ἀπωλείας, ἵνα ἡ γραφὴ πληρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/012.yaml
  text: While I was with them[a], I kept them in your name, which you have given me, and I guarded them, and not one of them perished except the son of destruction[b], so that the Scripture might be fulfilled.
translation:
  language: tl
  text: Noong kasama pa nila ako, iningatan ko sila sa iyong pangalan, na ibinigay mo sa akin. Binantayan ko sila, at walang isa man sa kanila ang napahamak[a] maliban sa anak ng kapahamakan[b], upang matupad ang Kasulatan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nawala.”
    reason: lexical_alternative
  - marker: b
    text: Ang “anak ng kapahamakan” ay isang Hebraikong paraan ng pagsasalita; maaari ring isaling “ang nakatalaga sa kapahamakan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε ἤμην μετ’ αὐτῶν
  choice: Noong kasama pa nila ako
  rationale: Natural na temporal na parirala sa Tagalog na nagpapahiwatig ng panahong patuloy na kasama ni Jesus ang mga alagad.
- source_word: ἐτήρουν αὐτοὺς
  choice: iningatan ko sila
  rationale: Ipinahahayag ang patuloy na pag-iingat sa konteksto nang hindi nagiging mabigat o di-likas ang aspektong pandiwa sa Tagalog.
- source_word: ἐν τῷ ὀνόματί σου
  choice: sa iyong pangalan
  rationale: Pinananatili ang masaklaw na teolohikal na diwa ng 'pangalan' bilang paghahayag, pagkakakilanlan, at awtoridad nang hindi ito nililimitahan sa isang paliwanag.
- source_word: ᾧ δέδωκάς μοι
  choice: na ibinigay mo sa akin
  rationale: Ang panghalip na neuter singular ay likas na tumutukoy sa 'pangalan,' hindi sa mga alagad; malinaw itong naipapakita ng Tagalog na sugnay.
- source_word: καὶ ἐφύλαξα
  choice: Binantayan ko sila
  rationale: Ibinubukod ang φυλάσσω sa naunang τηρέω at pinananatili ang mas mariing diwa ng pagbabantay o pagprotekta.
- source_word: οὐδεὶς ἐξ αὐτῶν ἀπώλετο
  choice: walang isa man sa kanila ang napahamak
  rationale: Ang 'napahamak' ay angkop sa taimtim na diwa ng ἀπόλλυμι at hindi ito pinapaliit sa karaniwang pagkawala lamang; inilalagay sa talababa ang leksikal na alternatibo.
- source_word: ὁ υἱὸς τῆς ἀπωλείας
  choice: ang anak ng kapahamakan
  rationale: Malapit sa anyong Semitiko ng Griyego at nauunawaan sa modernong Tagalog, habang hindi tahasang nilulutas kung ito ay katangian o hantungan.
- source_word: ἵνα ἡ γραφὴ πληρωθῇ
  choice: upang matupad ang Kasulatan
  rationale: Pinananatili ang layunin/resultang puwersa ng ἵνα at ang tiyak na pagtukoy sa Kasulatan.
theological_decisions:
- issue: Tinutukoy ng ᾧ δέδωκάς μοι
  choice: 'Ang sugnay ay tumutukoy sa ''iyong pangalan'': ''na ibinigay mo sa akin.'''
  alternative: 'Tumutukoy ito sa mga alagad: ''ang mga ibinigay mo sa akin.'''
  rationale: Neuter singular ang ᾧ at pinakanatural na tumutugma sa ὀνόματι, na neuter singular din, hindi sa αὐτούς na masculine plural. Sinusunod ng salin ang gramatika ng ibinigay na tekstong Griyego.
- issue: Kahulugan ng ὁ υἱὸς τῆς ἀπωλείας
  choice: anak ng kapahamakan
  alternative: ang nakatalaga sa kapahamakan
  rationale: Pinananatili ng pormal na parirala ang Hebraikong idyoma at ang teolohikal na tensiyon nito, sa halip na gawing tahasang pahayag tungkol sa predestinasyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'iningatan' at 'binantayan' upang mapanatili ang pagkakaiba ng dalawang pandiwang Griyego. Ang mga panandang [a] at [b] ay kapwa nasa pangunahing teksto.
