  text: κἀγὼ τὴν δόξαν ἣν δέδωκάς μοι δέδωκα αὐτοῖς, ἵνα ὦσιν ἓν καθὼς ἡμεῖς ⸀ἕν,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/022.yaml
  text: And I have given them the glory that you have given me[a], so that they may be one, just as we are one.
translation:
  language: tl
  text: At ako ay nagbigay sa kanila ng kaluwalhatiang ibinigay mo sa akin[a], upang sila ay maging isa, kung paanong tayo ay isa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “At ako rin ay nagbigay sa kanila ng kaluwalhatiang ibinigay mo sa akin.” Maaaring may pandagdag na diin ang Griyegong κἀγώ (“ako rin”).
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: At ibinigay ko
  rationale: Ang κἀγώ ay crasis ng καί at ἐγώ. Pinananatili ng “At” ang ugnayan sa naunang pahayag, samantalang malinaw na naipahihiwatig ng anyong pandiwa ang unang panauhan; posible rin ang dagdag na diin na “ako rin,” kaya inilagay ito sa talababa.
- source_word: δόξαν
  choice: kaluwalhatian
  rationale: Sa Juan, ang δόξα ay karaniwang tumutukoy sa kaluwalhatiang may bigat na teolohikal, hindi lamang sa karangalan o kaningningan.
- source_word: ἣν δέδωκάς μοι
  choice: na ibinigay mo sa akin
  rationale: Likas sa modernong Tagalog ang sugnay na ito. Bagaman perpekto ang δέδωκάς at nagpapahiwatig ng naganap na pagkakaloob na may nananatiling bunga, hindi karaniwang minamarkahan ng Tagalog ang aspektong iyon sa paraang katumbas ng English present perfect; ang konteksto ang nagdadala nito.
- source_word: δέδωκα αὐτοῖς
  choice: ibinigay ko sa kanila
  rationale: Direkta at natural nitong ipinapahayag ang natapos na pagkakaloob at ang tumanggap, nang hindi nagdaragdag ng interpretasyon.
- source_word: ἵνα
  choice: upang
  rationale: Malinaw na ipinapahayag ng “upang” ang layunin o nilalayong bunga ng pagkakaloob.
- source_word: ὦσιν
  choice: sila ay maging
  rationale: Ang “maging” matapos ang “upang” ay natural na kumakatawan sa subjunctive at sa nilalayong kalagayan.
- source_word: ἓν
  choice: isa
  rationale: Pinananatili ng “isa” ang maigsi at bukas na pananalita ng Griyego. Hindi ginawang “nagkakaisa” upang hindi agad tukuyin ang uri ng pagkakaisa.
- source_word: καθὼς
  choice: kung paanong
  rationale: Likas at malinaw itong naghahayag ng tuwirang paghahambing.
- source_word: ἡμεῖς ἕν
  choice: tayo ay isa
  rationale: Ipinapahayag nito ang ipinahihiwatig na pandiwang “ay” at pinananatiling hindi tinutukoy kung ontolohikal, relasyonal, o pangmisyon ang uri ng pagiging isa.
theological_decisions:
- issue: Ang likas na katangian ng pagiging isa ng mga alagad kung ihahambing sa pagiging isa ng Ama at ng Anak
  choice: “upang sila ay maging isa, kung paanong tayo ay isa”
  alternative: “upang sila ay magkaisa, kung paanong nagkakaisa tayo”
  rationale: Ang “isa” ay mas malapit sa neuter singular na ἕν at hindi nilulutas ang uri o saklaw ng pagkakaisang tinutukoy. Pinananatili nito ang tunay na paghahambing nang hindi ito nililimitahan sa relasyonal, institusyonal, pangmisyon, o ontolohikal na pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kaluwalhatian,” “upang,” at “kung paanong” upang mapanatili ang teolohikal na bigat at malinaw na lohika nang hindi nagiging labis na makaluma. Ang marker na [a] ay inilagay kaagad pagkatapos ng sugnay na saklaw ng alternatibo.
