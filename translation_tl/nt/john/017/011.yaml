  to: At wala na ako sa mundo, at nasa mundo sila, at papunta ako sa iyo. Amang Banal, ingatan mo sila sa iyong pangalan[a], na ibinigay mo sa akin[b], upang sila ay maging isa, kung paanong tayo ay isa.
