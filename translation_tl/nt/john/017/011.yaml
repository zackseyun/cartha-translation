id: JHN.17.11
reference: John 17:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ οὐκέτι εἰμὶ ἐν τῷ κόσμῳ, καὶ ⸀αὐτοὶ ἐν τῷ κόσμῳ εἰσίν, κἀγὼ πρὸς σὲ ἔρχομαι. πάτερ ἅγιε, τήρησον αὐτοὺς ἐν τῷ ὀνόματί σου ᾧ δέδωκάς μοι, ἵνα ὦσιν ἓν ⸀καθὼς ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/011.yaml
  text: And I am no longer in the world[a], but they are in the world, and I am coming to you. Holy Father, keep them in your name, which you have given to me, so that they may be one[b], just as we are.
translation:
  language: tl
  text: At wala na ako sa mundo, at nasa mundo sila, at papunta ako sa iyo. Amang Banal, ingatan mo sila sa iyong pangalan[a], na ibinigay mo sa akin[b], upang sila ay maging isa, kung paanong tayo ay isa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ingatan mo sila sa pamamagitan ng iyong pangalan” o “protektahan mo sila sa pamamagitan ng iyong pangalan.” Maaaring magpahiwatig ang pariralang Griyego ng saklaw, paraan, o awtoridad.
    reason: lexical_alternative
  - marker: b
    text: Sa tekstong Griyegong sinusunod dito, ang “na ibinigay mo sa akin” ay tumutukoy sa “pangalan.” May ilang manuskritong nagbabasa ng “ingatan mo sila sa iyong pangalan, ang mga ibinigay mo sa akin”; sa pagbabasang ito, ang tinutukoy ay ang mga taong ibinigay ng Ama sa Anak.
    reason: textual_variant
lexical_decisions:
- source_word: οὐκέτι
  choice: wala na
  rationale: Likas na modernong Tagalog para sa temporal na pagtigil mula sa kasalukuyang pananaw ng nagsasalita.
- source_word: κόσμος
  choice: mundo
  rationale: Pinananatili ang malawak at mahalagang terminong Juanino para sa makalupang kalagayan o kaayusan kung saan nananatili ang mga alagad.
- source_word: κἀγὼ πρὸς σὲ ἔρχομαι
  choice: at papunta na ako sa iyo
  rationale: Ipinahahayag ang kasalukuyang kilos na may nalalapit na katuparan. Mas natural sa Tagalog ang 'papunta' ayon sa pananaw ng nagsasalita kaysa sa literal na 'parating.'
- source_word: πάτερ ἅγιε
  choice: Amang banal
  rationale: Natural na anyong pantawag sa Tagalog na nagpapanatili kapuwa sa 'Ama' at sa katangiang 'banal.'
- source_word: τήρησον
  choice: ingatan mo
  rationale: Saklaw ng 'ingatan' ang pagbabantay, pag-iingat, at pagpapanatili nang hindi nililimitahan sa pisikal na proteksiyon lamang.
- source_word: ἐν τῷ ὀνόματί σου
  choice: sa iyong pangalan
  rationale: Pinananatili ang ἐν bilang 'sa' upang huwag agad magpasya kung ang pangalan ay saklaw, paraan, o kapangyarihang pinagbabatayan ng pag-iingat.
- source_word: ᾧ δέδωκάς μοι
  choice: na ibinigay mo sa akin
  rationale: Ang panghalip na ᾧ ay umaayon sa ὀνόματι, kaya sa pangunahing tekstong SBLGNT ang 'na' ay tumutukoy sa pangalan.
- source_word: ἵνα ὦσιν ἓν
  choice: upang sila ay maging isa
  rationale: Malinaw na ipinakikita ng 'upang' ang layunin, habang pinananatili ng 'maging isa' ang larawan ng pagkakaisa nang hindi ito ginagawang parapraseng 'magkasundo lamang.'
- source_word: καθὼς ἡμεῖς
  choice: kung paanong tayo ay isa
  rationale: Ipinahahayag ang tunay na paghahambing sa pagkakaisa ng Ama at Anak, habang ang idinagdag na 'isa' ay natural na kumukumpleto sa elipsis sa Tagalog.
theological_decisions:
- issue: Kahulugan ng 'ingatan mo sila sa iyong pangalan'
  choice: Pinanatili sa pangunahing teksto ang 'sa iyong pangalan.'
  alternative: Ingatan mo sila sa pamamagitan ng iyong pangalan; protektahan mo sila sa kapangyarihan ng iyong pangalan.
  rationale: Maaaring ipahiwatig ng parirala ang saklaw, paraan, awtoridad, o nahayag na pagkakakilanlan ng Diyos. Hindi dapat pumili ang salin ng iisang paliwanag lamang.
- issue: Lakas ng 'upang sila ay maging isa, kung paanong tayo ay isa'
  choice: Pinanatili ang tuwirang paghahambing ng pagkakaisa ng mga alagad sa pagkakaisa ng Ama at Anak.
  alternative: Ipaliwanag ito bilang simpleng pagtutulungan lamang, o bilang ganap na pagkakapareho ng uri ng kanilang pag-iral.
  rationale: May tunay na bigat ang paghahambing, ngunit hindi tinutukoy ng talata rito ang eksaktong kalikasan o hangganan nito. Iniiwasan ng salin ang kapuwa pagpapahina at labis na pagpapakahulugan.
- issue: Tinutukoy ng 'na ibinigay mo sa akin'
  choice: Ang 'na' ay tumutukoy sa 'pangalan,' ayon sa tekstong SBLGNT.
  alternative: Unawain na ang tinutukoy ay ang mga taong ibinigay ng Ama sa Anak.
  rationale: Ang kasarian ng panghalip sa ibinigay na tekstong Griyego ay umaayon sa 'pangalan,' ngunit may mahalagang baryanteng tekstuwal na pinagbabatayan ng alternatibong pagkaunawa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang pananalitang Juanino na 'mundo,' 'pangalan,' at 'maging isa.' Ang 'Amang banal' ay pormal ngunit natural na pantawag, at ang bahagyang di-karaniwang 'sa iyong pangalan' ay sadyang pinanatili upang huwag alisin ang tunay na kalabuan ng Griyego.
