base_translation:
  language: en
  yaml_path: translation/nt/john/017/014.yaml
  text: I have given them your word[a], and the world has hated them because they are not of the world, just as I am not of the world.
translation:
  language: tl
  text: Ibinigay ko sa kanila ang iyong salita, at kinapootan sila ng sanlibutan dahil hindi sila mula sa sanlibutan[a], kung paanong hindi rin ako mula sa sanlibutan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kabilang sa sanlibutan.” Sa literal, ang Griyego ay gumagamit ng “mula sa,” na maaaring tumukoy sa pinagmulan o sa pagkabilang.
    reason: lexical_alternative
lexical_decisions:
- source_word: δέδωκα
  choice: Ibinigay ko
  rationale: Ipinapahayag ang natapos na pagbibigay na nananatiling mahalaga sa kasalukuyang kalagayan; malinaw at natural ito sa Filipino nang hindi dinaragdagan ang diwa.
- source_word: λόγον
  choice: salita
  rationale: Pinananatili nito ang malawak na diwa at natatanging bokabularyo ni Juan; ang “mensahe” ay mas makitid at higit na nagpapakahulugan.
- source_word: κόσμος
  choice: sanlibutan
  rationale: Karaniwang salin ito sa kontekstong Juaniko at saklaw nito kapwa ang sangkatauhan at ang kaayusang salungat sa Diyos, ayon sa hinihingi ng konteksto.
- source_word: ἐμίσησεν
  choice: kinapootan
  rationale: Tuwirang ipinapahayag ang matinding pagkapoot ng sanlibutan sa mga alagad at pinananatili ang aspektong nakumpleto ng Griyegong aorist.
- source_word: ὅτι
  choice: dahil
  rationale: 'Malinaw na sanhi ang ipinakikilala ng sugnay: kinapootan sila sapagkat hindi sila mula sa sanlibutan.'
- source_word: ἐκ τοῦ κόσμου
  choice: mula sa sanlibutan
  rationale: Pinananatili ng “mula sa” ang larawan ng pinagmulan sa ἐκ habang hinahayaan ding manatili ang kaugnay na diwa ng pag-aari o pagkabilang.
- source_word: καθὼς
  choice: kung paanong
  rationale: Natural at malinaw nitong inihahambing ang kaugnayan ng mga alagad sa sanlibutan sa kaugnayan ni Jesus dito.
theological_decisions:
- issue: Ang paghahambing sa mga alagad at kay Jesus bilang hindi mula sa sanlibutan
  choice: hindi sila mula sa sanlibutan, kung paanong hindi rin ako mula sa sanlibutan
  alternative: hindi sila kabilang sa sanlibutan, kung paanong hindi rin ako kabilang sa sanlibutan
  rationale: Pinananatili ng napiling salin ang tuwirang paghahambing at ang tensiyon ng ἐκ bilang pinagmulan o pagkabilang, nang hindi ito nililimitahan sa isang panlipunan o metapisikal na paliwanag.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “sanlibutan” upang mapanatili ang pamilyar na bokabularyong Juaniko, samantalang nananatiling tuwiran at madaling maunawaan ang ayos ng pangungusap.
