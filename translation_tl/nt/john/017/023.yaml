  text: ἐγὼ ἐν αὐτοῖς καὶ σὺ ἐν ἐμοί, ἵνα ὦσιν τετελειωμένοι εἰς ἕν, ⸀ἵνα γινώσκῃ ὁ κόσμος ὅτι σύ με ἀπέστειλας καὶ ἠγάπησας αὐτοὺς καθὼς ἐμὲ ἠγάπησας.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/023.yaml
  text: I in them and you in me[a], so that they may be perfected into one, so that the world may know that you sent me and loved them just as you loved me.
translation:
  language: tl
  text: Ako ay nasa kanila at ikaw ay nasa akin, upang sila ay ganap na maging isa[a], upang malaman ng mundo na ikaw ang nagsugo sa akin at inibig mo sila kung paanong inibig mo ako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “madala sa ganap na pagkakaisa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ ἐν αὐτοῖς καὶ σὺ ἐν ἐμοί
  choice: Ako ay nasa kanila at ikaw ay nasa akin
  rationale: Pinananatili ng “nasa” ang literal at mahalagang wika ng pananatili o pakikipanahan sa Ebanghelyo ni Juan; ang “kasama nila” ay magpapahina sa diwa ng pagiging nasa loob.
- source_word: τετελειωμένοι
  choice: lubos na mabuo
  rationale: Ipinahahayag nito ang resultang kalagayan ng isang kilos na nagdala sa kanila sa kaganapan, nang hindi ipinapakahulugang ganap na kawalang-kasalanan.
- source_word: εἰς ἕν
  choice: bilang isa
  rationale: Natural itong Filipino na naghahayag ng patutunguhan at resulta tungo sa pagiging isa, sa halip na isang umiiral lamang na kalagayan.
- source_word: γινώσκῃ
  choice: malaman
  rationale: Tuwirang salin ito ng pandiwang nasa sugnay ng layunin at likas sa modernong Filipino.
- source_word: ὁ κόσμος
  choice: ang mundo
  rationale: Pinananatili nito ang malawak at sadyang hindi ganap na nililinaw na gamit ni Juan sa “mundo,” sa halip na paliitin iyon sa isang interpretatibong pagpapahayag.
- source_word: ἀπέστειλας
  choice: nagsugo
  rationale: Ang “nagsugo” ay natural at marangal na salin na pinananatili ang diwa ng pagpapadala na may misyon.
- source_word: ἠγάπησας
  choice: inibig
  rationale: Pinananatili nito ang pag-uulit ng parehong pandiwa at ang marangal na himig ng panalangin.
- source_word: καθὼς
  choice: kung paanong
  rationale: Malinaw nitong pinananatili ang tunay na paghahambing sa pag-ibig ng Ama sa kanila at sa Anak, nang hindi iyon pinahihina o pinalalawig.
theological_decisions:
- issue: Lakas ng paghahambing sa “inibig mo sila kung paanong inibig mo ako”
  choice: Tuwirang pinanatili ang paghahambing sa pamamagitan ng “kung paanong.”
  alternative: “gaya ng” o ang interpretatibong “sa gayunding uri ng pag-ibig”
  rationale: Ang καθὼς ay naghahayag ng tunay na paghahambing. Hindi dapat pahinain o ipaliwanag nang higit sa sinasabi ng teksto ang bigat ng pag-ibig ng Ama sa mga mananampalataya kaugnay ng pag-ibig niya sa Anak.
- issue: Kahulugan ng τετελειωμένοι sa konteksto
  choice: “lubos na mabuo bilang isa,” na tumutukoy sa pagdadala sa kaganapan tungo sa pagkakaisa
  alternative: “maging ganap na walang kapintasan” o “maging perpekto bilang isa”
  rationale: Pinananatili ng salin ang diwa ng pagkumpleto at ang pasibong anyo, ngunit iniiwasang gawing tanging kahulugan ang ganap na moral na kawalang-kasalanan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang maikli at magkahanay na mga sugnay ng Griyego, gayundin ang wikang Juan tungkol sa pagiging “nasa” isa’t isa. Ginamit ang “inibig” upang umangkop sa taimtim na himig nang hindi nagiging lipas o teknikal.
