  source_fidelity: 'Ang pangunahing diwa at mga ugnayan ng mga sugnay ay tapat sa Griyego: pinananatili ang ''nasa,'' ang dalawang layuning sugnay, ang pagsusugo, at ang tuwirang paghahambing ng pag-ibig. Gayunman, ang ''lubos na mabuo bilang isa'' ay hindi likas na naipahahayag ang τετελειωμένοι εἰς ἕν at maaaring magmukhang pagbuo lamang, sa halip na pagdadala sa ganap na pagkakaisa.'
  naturalness: Marangal at malinaw ang kabuuan, ngunit hindi gaanong idiomatiko ang 'lubos na mabuo bilang isa.' Mas natural sa modernong Filipino ang 'ganap na maging isa.'
  terminology: Ang 'nasa kanila/nasa akin,' 'nagsugo,' at 'inibig' ay angkop at magkakatugma sa taimtim na Johannine register. Ang 'mundo' ay katanggap-tanggap na modernong salin ng κόσμος at hindi dapat palawakin sa interpretatibong kahulugan.
  issues:
  - severity: medium
    issue: Hindi natural at kulang ang pagtutumbas ng 'lubos na mabuo bilang isa.'
    rationale: Ang τετελειωμένοι ay perfect passive participle ng τελειόω, na tumutukoy sa kalagayang nadala sa kaganapan; ang εἰς ἕν ay resulta tungo sa pagiging isa. Ang 'mabuo' ay maaaring tumukoy lamang sa pagkakabuo, at ang 'bilang isa' ay hindi kasinglinaw ng 'maging isa' para sa pagkakaisa.
  - severity: low
    issue: Hindi likas ang unang alternatibo sa talababa na 'ganaping maging isa.'
    rationale: Mas natural ang isang pasibong alternatibo gaya ng 'madala sa ganap na pagkakaisa,' na mas malinaw ding inilalantad ang completion/passive nuance nang hindi ipinapataw ang kawalang-kasalanan.
