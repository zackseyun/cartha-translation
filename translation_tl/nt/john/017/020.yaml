  verdict: revise
  source_fidelity: 'Ang pangunahing diwa ay tapat sa Griyego: hindi limitado ang hinihiling ni Jesus sa mga kasalukuyang alagad, kundi saklaw din nito ang mga sumasampalataya sa kanya sa pamamagitan ng kanilang salita. Gayunman, ang "sila ang ipinakikiusap ko" ay hindi wastong natural na pagbuo sa Filipino, sapagkat ang tao ay hindi karaniwang direktang layon ng "ipinapakiusap" sa ganitong kahulugan. Ang "para sa mga ito ako humihiling" ay natural sa konteksto ng panalangin at pinananatili ang saklaw ng pakiusap nang hindi nagdaragdag ng tiyak na panahon.'
  naturalness: Kailangan ang rebisyon para sa idyomatiko at malinaw na Filipino. Ang "mga ito" ay mas malapit sa τούτων kaysa "sila" at hindi labis na pinapangalanan ang tinutukoy. Ang "humihiling" ay marangal, moderno, at hindi kasing debosyonal na espesipiko ng "ipinapananalangin."
  terminology: Ang "sumasampalataya sa akin" ay angkop para sa πιστεύοντες εἰς ἐμέ. Ang "kanilang salita" ay pinananatiling pangunahing katumbas ng λόγος; ang "kanilang mensahe" ay wastong alternatibo sa talababa. Hindi dapat idagdag ang "sasampalataya," sapagkat hindi tahasang panghinaharap ang participle.
