  text: Οὐ περὶ τούτων δὲ ἐρωτῶ μόνον, ἀλλὰ καὶ περὶ τῶν πιστευόντων διὰ τοῦ λόγου αὐτῶν εἰς ἐμέ,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/020.yaml
  text: I do not ask concerning these only[a], but also concerning those who believe in me through their word[b],
translation:
  language: tl
  text: Hindi lamang para sa mga ito ako humihiling, kundi pati para sa mga sumasampalataya sa akin sa pamamagitan ng kanilang salita[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kanilang mensahe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρωτῶ
  choice: ipinakikiusap ko
  rationale: Ipinahahayag nito ang paghiling ni Jesus sa Ama nang hindi idinaragdag ang mas tiyak na kulay ng “ipinapanalangin.” Ang anyong pangkasalukuyan ay pinananatili.
- source_word: περὶ τούτων
  choice: sila
  rationale: Sa Filipino, likas na maipahayag ang paksa ng pakiusap bilang tuwirang layon. Ang “sila” ay tumutukoy sa naunang mga alagad ngunit hindi sila higit na tinutukoy sa salin kaysa sa Griyego.
- source_word: μόνον
  choice: lamang
  rationale: Natural na katumbas na naglilimita sa saklaw ng pakiusap.
- source_word: ἀλλὰ καὶ
  choice: kundi pati
  rationale: Pinananatili nito kapwa ang pagsalungat at ang pagpapalawak ng saklaw.
- source_word: τῶν πιστευόντων
  choice: ang mga sumasampalataya
  rationale: Pinananatili ang pandiwang lakas ng substantival na present participle at hindi ito ginagawang mas statikong katawagan lamang.
- source_word: διὰ τοῦ λόγου αὐτῶν
  choice: sa pamamagitan ng kanilang salita
  rationale: Ang “salita” ay malapit sa λόγος at pinananatili ang posibleng Johannine na alingawngaw, habang ang parirala ay malinaw na tumutukoy sa patotoo o mensahe ng mga alagad.
- source_word: εἰς ἐμέ
  choice: sa akin
  rationale: Kasama ng “sumasampalataya,” ito ang natural na Filipino para sa πιστεύω εἰς at pinananatili si Jesus bilang personal na layon ng pananampalataya.
- source_word: Οὐ ... μόνον
  choice: Hindi lamang
  rationale: Natural na inililipat sa unahan ang limitadong pagtanggi upang luminaw ang kaayusan ng pangungusap sa Filipino.
theological_decisions:
- issue: Saklaw ng pakiusap ni Jesus lampas sa mga kasalukuyang alagad
  choice: Kasama ang mga sumasampalataya kay Jesus sa pamamagitan ng patotoo ng mga alagad, nang hindi tahasang dinaragdagan ng panandang panghinaharap.
  alternative: Tahasang isaling “mga sasampalataya,” o limitahan ito sa mga nagsisimula nang sumampalataya noon.
  rationale: Ang present participle na πιστευόντων ay hindi tahasang nagsasaad ng panahong panghinaharap. Hinahayaan ng salin na saklawin ang mga susunod na mananampalataya nang hindi nilulutas ang temporal na lawak na iniwang hindi tiyak ng Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ipinakikiusap” sa halip na “ipinapanalangin” upang manatiling malapit sa batayang kahulugan ng ἐρωτῶ, at “salita” sa pangunahing teksto upang mapanatili ang lawak ng λόγος.
