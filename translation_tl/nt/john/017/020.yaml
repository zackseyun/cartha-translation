- from: Hindi lamang sila ang ipinakikiusap ko, kundi pati ang mga sumasampalataya sa akin sa pamamagitan ng kanilang salita[a].
  to: Hindi lamang para sa mga ito ako humihiling, kundi pati para sa mga sumasampalataya sa akin sa pamamagitan ng kanilang salita[a].
  rationale: Pinalitan ang di-idiomatikong "sila ang ipinakikiusap ko" ng "para sa mga ito ako humihiling." Napananatili nito ang kasalukuyang aspekto ng ἐρωτῶ, ang limitasyong "hindi lamang," ang pagpapalawak na "kundi pati," at ang hindi-tiyak na saklaw sa panahon ng mga sumasampalataya. Napanatili rin ang alternatibong pagbasa ng λόγος sa talababa.
