  yaml_path: translation/nt/john/017/017.yaml
  text: Sanctify them in the truth[a]; your word is truth.
translation:
  language: tl
  text: Pabanalin mo sila sa katotohanan; ang salita mo ay katotohanan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “ang salita mo ang katotohanan.” Walang artikulo sa Griyego ang pangngalang “katotohanan” bilang panaguri, kaya maaaring idiin nito ang katangian—“ay katotohanan”—sa halip na simpleng pagkakakilanlan.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἁγίασον
  choice: Pabanalin mo
  rationale: Ang pautos na anyong ito ng ἁγιάζω ay humihiling na gawin silang banal o italaga sa Diyos. Ang “pabanalin” ay likas at marangal sa modernong Filipino at pinananatili ang dalawang diwa nang hindi nililimitahan sa simpleng pagbubukod.
- source_word: αὐτοὺς
  choice: sila
  rationale: Tuwirang tumutukoy ang panghalip na maramihan sa mga alagad; natural sa Filipino ang “sila” kasunod ng pandiwang may hulaping -in.
- source_word: ἐν τῇ ἀληθείᾳ
  choice: sa katotohanan
  rationale: Pinananatili ng “sa” ang posibleng saklaw ng ἐν bilang kalagayan o larangan at bilang kasangkapan, sa halip na paliitin ito sa “sa pamamagitan ng katotohanan.” Tiyak ang “katotohanan” dahil may artikulo sa Griyego.
- source_word: ὁ λόγος ὁ σὸς
  choice: ang salita mo
  rationale: Ang λόγος dito ay tumutukoy sa ipinahayag na salita ng Diyos. Natural at tapat sa tekstong Griyego ang “ang salita mo,” kaysa sa mas mapagpaliwanag na “mensahe mo.”
- source_word: ἀλήθειά ἐστιν
  choice: ay katotohanan
  rationale: Pinananatili nito ang pangngalang ἀλήθεια at ang maaaring kwalitatibong diin ng panaguring walang artikulo. Hindi ito pinahihina tungo sa “ay totoo” ni tahimik na ginagawang tiyak na pagkakakilanlan sa pangunahing teksto.
theological_decisions:
- issue: Kung kwalitatibo o tiyak na pagkakakilanlan ang ἀλήθεια sa ikalawang sugnay
  choice: ang salita mo ay katotohanan
  alternative: ang salita mo ang katotohanan
  rationale: Walang artikulo ang panaguring ἀλήθεια sa Griyego, kaya ang “ay katotohanan” ay mahusay na nagpapanatili sa kwalitatibong lakas nito. Gayunman, posible rin sa gramatika at konteksto ang tiyak na pagbasa, kaya inilagay iyon sa talababa sa halip na lubusang alisin.
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang “pabanalin” bilang pamilyar na terminong biblikal na nananatiling malinaw sa karaniwang mambabasa. Iniwasan ang mas makitid na “italaga” at ang lantad na instrumental na “sa pamamagitan ng.”
