base_translation:
  language: en
  yaml_path: translation/nt/john/017/004.yaml
  text: I glorified you on the earth by completing the work that you have given me to do[a].
translation:
  language: tl
  text: Niluwalhati kita sa lupa sa pamamagitan ng pagkumpleto sa gawaing ibinigay mo sa akin upang gawin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Niluwalhati kita sa lupa matapos kong kumpletuhin ang gawaing ibinigay mo sa akin upang gawin.”
    reason: Ipinapakita ang mas pormal at temporal na paraan ng pagsasalin sa aorist participle na τελειώσας, samantalang ang pangunahing teksto ay gumagamit ng instrumental na ugnayan.
lexical_decisions:
- source_word: ἐδόξασα
  choice: Niluwalhati
  rationale: Pinananatili nito ang mabigat na teolohikal at maka-Juan na diwa ng δοξάζω, hindi lamang ang mas payak na ‘pinarangalan.’
- source_word: ἐπὶ τῆς γῆς
  choice: sa lupa
  rationale: Likas at tuwirang salin ito ng pook na tinutukoy ng parirala, at mas karaniwan sa modernong Tagalog kaysa ‘sa ibabaw ng lupa.’
- source_word: τελειώσας
  choice: sa pamamagitan ng pagtapos
  rationale: 'Ipinapahayag nito ang malamang na ugnayang instrumental ng aorist participle sa pangunahing pandiwa: niluwalhati ni Jesus ang Ama sa pagkumpleto ng gawa.'
- source_word: τὸ ἔργον
  choice: sa gawain
  rationale: Ang ‘gawain’ ay natural sa Tagalog para sa misyong o tungkuling ipinagkatiwala, habang nananatiling malapit sa malawak na kahulugan ng ἔργον.
- source_word: δέδωκάς μοι
  choice: ibinigay mo sa akin
  rationale: Sa Tagalog, sapat na ipinahihiwatig ng perpektibong ‘ibinigay’ at ng konteksto ang natapos na pagbibigay na patuloy na mahalaga; magiging di-likas ang pilit na pagtutumbas sa English present perfect.
- source_word: ἵνα ποιήσω
  choice: upang gawin
  rationale: Malinaw nitong pinananatili ang layunin o itinakdang pagsasagawa na ipinahihiwatig ng ἵνα at subjunctive.
- source_word: ἐγώ σε
  choice: '[ako] ... kita'
  rationale: Nasa anyong pandiwa na ‘Niluwalhati’ ang unang panauhan, at natural na tinutukoy ng ‘kita’ ang ugnayang ako-ikaw. Hindi idinagdag ang ‘ako mismo’ upang maiwasan ang labis na pagdidiin.
theological_decisions:
- issue: Ugnayan ng pagluluwalhati sa Ama at ng participle na τελειώσας
  choice: 'Paraan: niluwalhati ni Jesus ang Ama sa pamamagitan ng pagtapos sa gawaing ibinigay sa kanya.'
  alternative: 'Kalagayan o kasabay na kilos: ‘Niluwalhati kita sa lupa, matapos ang gawaing ibinigay mo sa akin upang gawin.’'
  rationale: Pinakamalinaw na iniuugnay ng sintaks ang participle sa pangunahing pandiwa bilang paliwanag kung paano niluwalhati ni Jesus ang Ama, ngunit ang mas literal na anyong participial ay itinatala sa talababa upang mapanatili ang posibleng pagkakaiba ng ugnayan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘Niluwalhati’ dahil nakaugat ito sa karaniwang bokabularyong biblikal at mahalaga sa teolohiya ni Juan; ginamit ang ‘gawain’ sa halip na ‘trabaho’ upang umangkop sa ipinagkatiwalang misyon.
