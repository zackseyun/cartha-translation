  yaml_path: translation/nt/john/017/006.yaml
  text: I have made your name known to the men whom you gave me out of the world. They were yours, and you gave them to me, and they have kept your word.
translation:
  language: tl
  text: Ipinakilala ko ang iyong pangalan[a] sa mga taong ibinigay mo sa akin mula sa sanlibutan. Sila ay iyo, at ibinigay mo sila sa akin, at tinupad nila ang iyong salita.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ang “iyong pangalan” ay tumutukoy sa nahayag na pagkakakilanlan at mga katangian ng Diyos, hindi lamang sa isang katawagang binibigkas. Maaari ring isalin: “Inihayag ko ang iyong pangalan.”'
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: 'Mas literal: “iningatan nila ang iyong salita”; maaari ring unawain na “sinunod nila ang iyong salita.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐφανέρωσά
  choice: Ipinakilala ko
  rationale: Ang φανερόω ay nangangahulugang ihayag o ipakilala. Natural sa modernong Tagalog ang “ipinakilala” kasama ng layong “pangalan,” at ipinahihiwatig nito ang pagpapakilala kung sino ang Ama, hindi lamang ang pagbigkas ng isang katawagan.
- source_word: τὸ ὄνομα
  choice: ang iyong pangalan
  rationale: Pinananatili ang kongkretong salitang “pangalan,” na sa kontekstong Juanino ay sumasaklaw sa nahayag na pagkakakilanlan at pagkatao ng Diyos.
- source_word: τοῖς ἀνθρώποις
  choice: sa mga tao
  rationale: Bagaman ang agarang tinutukoy ay mga alagad ni Jesus, ang ἄνθρωποι ay likas na “mga tao.” Hindi kailangang gawing “mga lalaki” sa Tagalog, lalo na't ang “mga tao” ay tumpak at natural.
- source_word: οὓς ἔδωκάς μοι
  choice: na ibinigay mo sa akin
  rationale: Tuwirang inililipat ang aorist na ἔδωκας sa natural na Tagalog na aspektong naganap.
- source_word: ἐκ τοῦ κόσμου
  choice: mula sa sanlibutan
  rationale: Ang ἐκ ay nagpapahiwatig ng pinagmulan o pagkakabukod mula sa loob ng κόσμος. Ang “mula sa sanlibutan” ay natural at hindi nagpapahiwatig na pisikal na inalis na sila rito.
- source_word: σοὶ ἦσαν
  choice: Sila ay iyo
  rationale: Pinananatili ang maigsi at mariing pahayag ng pag-aari sa Griyego.
- source_word: κἀμοὶ αὐτοὺς ἔδωκας
  choice: at ibinigay mo sila sa akin
  rationale: Natural na ayos sa Tagalog habang pinananatili ang diwang ibinigay sila ng Ama sa Anak.
- source_word: τὸν λόγον σου
  choice: ang iyong salita
  rationale: Ang “salita” ay nagpapanatili sa mahalagang bokabularyong Juanino at sa lawak ng λόγος bilang pahayag, mensahe, o turo.
- source_word: τετήρηκαν
  choice: tinupad nila
  rationale: Ang τηρέω rito ay pag-iingat na ipinakikita sa pagsunod. Ang “tinupad” ay natural sa pariralang “tinupad ang salita” at hindi kasing-literal ngunit alanganin ng “iningatan”; nililinaw sa talababa ang mas literal na alternatibo.
theological_decisions:
- issue: Kahulugan ng “iyong pangalan”
  choice: Panatilihin ang “iyong pangalan” sa pangunahing teksto
  alternative: “kung sino ka” o “ang iyong pagkatao”
  rationale: Hindi lamang katawagan ang tinutukoy kundi ang nahayag na pagkakakilanlan at pagkatao ng Ama. Gayunman, pinananatili ng salin ang metapora ng orihinal at ipinaliliwanag ito sa talababa.
- issue: Kasarian at tinutukoy ng τοῖς ἀνθρώποις
  choice: “sa mga tao”
  alternative: “sa mga lalaki” o “sa mga alagad”
  rationale: Ang agarang tinutukoy ay ang pangkat ng mga alagad, ngunit ang salitang Griyego mismo ay karaniwang “mga tao.” Ang salin ay hindi nagdaragdag ng kasarian o ng salitang “alagad” na wala sa talata.
- issue: Pagbibigay ng Ama sa mga tao sa Anak
  choice: Panatilihin ang payak na pahayag na ibinigay sila ng Ama sa Anak
  alternative: Ipaliwanag ito ayon sa isang tiyak na sistema ng paghirang o malayang pagtugon
  rationale: Malinaw ang banal na pagbibigay sa talata, ngunit hindi nito rito ipinapaliwanag ang buong mekanismo. Hindi nilulutas ng salin ang mas malawak na pagtatalong teolohikal.
- issue: Kahulugan ng τετήρηκαν
  choice: “tinupad nila” na may mas literal na alternatibo sa talababa
  alternative: “iningatan nila” o “sinunod nila”
  rationale: Saklaw ng pandiwa ang pag-iingat at pagsunod, at ang perpektong anyo ay nagpapahiwatig ng nananatiling bunga. Ang “tinupad” ay natural ngunit hindi dapat itago ang mas literal na larawan ng “pag-iingat.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal at malinaw. Ginamit ang “sanlibutan” upang mapanatili ang solemneng bokabularyong Juanino nang hindi nagiging lipas; iniwasan ang sobrang literal na “ipinakita ko” at ang masyadong interpretibong “ipinaalam ko kung sino ka.”
