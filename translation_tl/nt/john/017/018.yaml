  text: καθὼς ἐμὲ ἀπέστειλας εἰς τὸν κόσμον, κἀγὼ ἀπέστειλα αὐτοὺς εἰς τὸν κόσμον·
base_translation:
  language: en
  yaml_path: translation/nt/john/017/018.yaml
  text: Just as you sent me into the world, I also sent them into the world.
translation:
  language: tl
  text: Kung paanong isinugo mo ako sa sanlibutan, isinugo ko rin sila sa sanlibutan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: Kung paanong
  rationale: Malinaw at likas na nagpapahayag ng paghahambing sa pagsusugo ng Ama kay Jesus at ng pagsusugo ni Jesus sa mga alagad.
- source_word: ἐμὲ
  choice: ako
  rationale: Tuwirang layon ng ἀπέστειλας; pinananatili ng karaniwang ayos sa Tagalog ang diin nang hindi nagiging pilit.
- source_word: ἀπέστειλας / ἀπέστειλα
  choice: isinugo mo / isinugo ko
  rationale: Ang “isinugo” ay natural at marangal na katumbas ng ἀποστέλλω sa kontekstong misyonal. Iisang pandiwa ang ginamit sa dalawang sugnay upang mapanatili ang sinadyang paralelismo.
- source_word: εἰς τὸν κόσμον
  choice: sa sanlibutan
  rationale: Sa Tagalog, ang “sa sanlibutan” ay natural na naghahayag ng pagpasok o pagsusugo tungo sa larangan ng sangkatauhan; pinananatili rin nito ang malawak na teolohikal na gamit ng κόσμος sa Juan.
- source_word: κἀγὼ
  choice: isinugo ko rin
  rationale: Ang “rin” ay nagpapahayag ng dagdag at tumutugma sa καί, habang ang tahasang “ko” ay nagpapanatili sa paralelismo ng mga nagsusugo.
- source_word: αὐτοὺς
  choice: sila
  rationale: Tumutukoy sa mga alagad sa konteksto at siyang likas na anyo bilang layon sa pandiwang pokus-sa-layon na “isinugo.”
- source_word: κόσμον
  choice: sanlibutan
  rationale: Pinananatili ang mahalagang terminong Johannine nang hindi nililimitahan ito sa isang partikular na pakahulugang gaya lamang ng sangkatauhan o sistemang laban sa Diyos.
theological_decisions:
- issue: Paralelismo ng pagsusugo ng Ama sa Anak at ng Anak sa mga alagad
  choice: Panatilihin ang magkatulad na pandiwang “isinugo ... isinugo.”
  alternative: “isinugo ... inatasan” o “pinapunta ... isinugo”
  rationale: Binibigyang-diin ng talata ang pagkakatulad ng misyon, hindi ang ganap na pagkakapareho ng katayuan o likas na tungkulin. Ang iisang pandiwa ay tapat sa tekstuwal na paralelismo nang hindi ipinapalagay na kapantay ng natatanging misyon ng Anak ang misyon ng mga alagad.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pagbasa sa Bibliya. Pinili ang “sanlibutan” upang mapanatili ang tradisyonal ngunit nauunawaang terminong teolohikal sa Juan; walang kailangan na talababa.
