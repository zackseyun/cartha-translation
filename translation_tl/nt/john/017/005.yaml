  text: καὶ νῦν δόξασόν με σύ, πάτερ, παρὰ σεαυτῷ τῇ δόξῃ ᾗ εἶχον πρὸ τοῦ τὸν κόσμον εἶναι παρὰ σοί.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/005.yaml
  text: And now[a], Father[b], glorify me in your presence with the glory that I had with you before the world existed.
translation:
  language: tl
  text: At ngayon, Ama, luwalhatiin mo ako sa iyong piling[a], sa kaluwalhatiang taglay ko noon sa piling mo bago pa umiral ang sanlibutan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kasama mo” o, sa mas literal na diwa, “sa tabi mo.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “bago pa umiral ang mundo” o “bago pa nagkaroon ng sanlibutan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δόξασόν
  choice: luwalhatiin
  rationale: Pinananatili ng “luwalhatiin” ang mahalagang bokabularyong Juanino ng δόξα/δοξάζω at ang kaugnayan nito sa kaluwalhatian, sa halip na paliitin ang diwa sa “parangalan.”
- source_word: παρὰ σεαυτῷ
  choice: sa iyong piling
  rationale: Ang παρά na may datibo ay nagpapahiwatig ng pagiging malapit o nasa presensiya ng isang tao. Likas at marangal sa modernong Tagalog ang “sa iyong piling,” at hindi nito inaalis ang relational at spatial na pahiwatig.
- source_word: τῇ δόξῃ
  choice: sa kaluwalhatiang
  rationale: Ang datibo ay iniuugnay sa hinihinging pagluwalhati at sa tiyak na kaluwalhatiang inilalarawan ng kasunod na sugnay. Ang “sa kaluwalhatiang” ay nagpapanatili ng ugnayang ito nang hindi nagdaragdag ng ideyang “ibalik” o “ibigay.”
- source_word: ᾗ εἶχον
  choice: taglay ko
  rationale: Ipinahahayag ng imperpektong εἶχον ang dating pag-aangkin o pagtataglay ni Jesus ng kaluwalhatian. Natural sa Tagalog ang “taglay ko” sa temporal na sugnay na ito.
- source_word: πρὸ τοῦ τὸν κόσμον εἶναι
  choice: bago pa umiral ang sanlibutan
  rationale: Malinaw na ipinapahayag ng articular infinitive ang panahong nauna sa pag-iral ng κόσμος. Ang “umiral” ay tuwirang nagsasaad ng existence nang hindi nagpapasya kung “nilikha” ang kailangang idiin ng parirala.
- source_word: παρὰ σοί
  choice: sa piling mo
  rationale: Tulad ng naunang παρά na may datibo, tumutukoy ito sa pagiging kasama o malapit sa Ama. Ang pag-uulit ng “sa piling” ay sinasadyang magpanatili ng pagkakapantay ng dalawang parirala sa Griyego.
- source_word: σύ, πάτερ
  choice: Ama
  rationale: Tahasan ang panghalip na σύ sa Griyego at may diin, ngunit karaniwang naipahihiwatig na sa pautos na Tagalog ang “ikaw” sa hulaping “mo.” Iniiwasan ng “Ama” ang alanganing “ikaw, Ama” habang malinaw na pinananatili ang tuwirang pagtawag.
- source_word: κόσμον
  choice: sanlibutan
  rationale: Ang “sanlibutan” ay likas at dignified na salin ng κόσμος sa kontekstong Juanino at tumutukoy rito sa umiiral na daigdig o kaayusang nilikha.
theological_decisions:
- issue: Ang pag-iral ng Anak bago pa ang sanlibutan
  choice: Tuwirang inilalarawan ang kaluwalhatiang taglay ni Jesus sa piling ng Ama bago pa umiral ang sanlibutan.
  alternative: Palabnawin ang pahayag bilang kaluwalhatiang itinakda lamang sa plano ng Diyos.
  rationale: Ang gramatika ng ᾗ εἶχον at πρὸ τοῦ τὸν κόσμον εἶναι ay tuwirang naglalahad ng dating pagtataglay ng kaluwalhatian bago ang pag-iral ng sanlibutan. Hindi ito dapat palambutin o palawakin nang lampas sa sinabi ng teksto.
- issue: Ang likas na katangian ng kaluwalhatiang kaugnay ng Ama
  choice: Panatilihin ang salitang “kaluwalhatian” nang walang paliwanag sa mismong talata.
  alternative: Palitan ito ng mas makitid na “karangalan,” “kamahalan,” o isang tahasang pormulang doktrinal.
  rationale: Sinasabi ng teksto na taglay ni Jesus ang kaluwalhatian sa piling ng Ama ngunit hindi nito lubusang ipinapaliwanag dito ang likas ng kaluwalhatiang iyon. Pinananatili ng salin ang teolohikal na bigat at tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “sa iyong piling/sa piling mo” upang likas na maipahayag ang magkatugmang παρά + datibo, at pinanatili ang “luwalhatiin/kaluwalhatian” bilang sadyang pag-uulit ng bokabularyong Juanino.
