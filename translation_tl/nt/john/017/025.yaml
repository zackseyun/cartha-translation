  yaml_path: translation/nt/john/017/025.yaml
  text: Righteous Father[a], though the world has not known you, I have known you[b], and these have known that you sent me.
translation:
  language: tl
  text: Amang Matuwid, bagaman hindi ka nakilala ng sanlibutan[b], nakilala kita, at nakilala ng mga ito na ikaw ang nagsugo sa akin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang tatlong pandiwang isinaling “nakilala” ay mga anyong aorist sa Griyego. Maaari ring isalin ang mga ito sa payak na nakaraan ayon sa konteksto; ang salin dito ay pinananatili ang magkakatugmang pag-uulit ng pandiwang “makilala.”
    reason: lexical_alternative
  - marker: b
    text: 'Sa Juan, ang “sanlibutan” ay madalas tumukoy hindi lamang sa nilalang na daigdig kundi sa sangkatauhang hiwalay sa Diyos. Maaari ring isalin nang mas literal ang simula: “At hindi ka nakilala ng sanlibutan, ngunit nakilala kita.”'
    reason: cross_reference
lexical_decisions:
- source_word: Πάτερ δίκαιε
  choice: Matuwid na Ama
  rationale: Likas at marangal na tuwirang pagtawag sa modernong Filipino. Pinananatili ng “matuwid” ang moral at teolohikal na bigat ng δίκαιος nang hindi ito nililimitahan sa katarungang panghukuman.
- source_word: καὶ
  choice: bagaman
  rationale: 'Sa konteksto, ang unang καὶ ay may diwang pasubali o concessive: kabaligtaran ng pagkabigo ng sanlibutang makilala ang Ama ang pagkakilala ni Jesus sa kanya. Ginagawang malinaw ng “bagaman” ang ugnayang ito sa likas na Filipino.'
- source_word: ὁ κόσμος
  choice: ang sanlibutan
  rationale: Karaniwang salitang biblikal sa Filipino na nagpapanatili sa malawak at masalimuot na gamit ng κόσμος sa Juan, sa halip na paliitin ito sa “mga tao sa mundo” o “sistema ng mundo.”
- source_word: ἔγνω / ἔγνων / ἔγνωσαν
  choice: hindi nakilala / kilala / alam
  rationale: Iisa ang pandiwang Griyego, ngunit nangangailangan ang natural na Filipino ng magkakaibang anyo ayon sa kayarian. Ipinahihiwatig ng “hindi nakilala” ang pagkabigong makilala; ng “kilala kita” ang namamalaging personal na pagkakilala; at ng “alam ... na” ang kaalamang may kasunod na sugnay.
- source_word: ἐγὼ δέ
  choice: kilala kita
  rationale: Naipahihiwatig na ng “bagaman” at ng magkatabing sugnay ang pagsalungat. Hindi na kailangang dagdagan ng tahasang “ngunit ako” na magiging mabigat sa Filipino.
- source_word: οὗτοι
  choice: ang mga ito
  rationale: Malapit ito sa demonstratibong Griyego at hindi nagdaragdag sa pangunahing teksto ng interpretatibong pangngalang gaya ng “mga alagad.”
- source_word: σύ με ἀπέστειλας
  choice: isinugo mo ako
  rationale: Ang “isinugo” ay tuwiran at karaniwang salin ng ἀποστέλλω at pinananatili ang diin sa pagpapadala ng Ama kay Jesus.
theological_decisions:
- issue: Katangian ng Ama sa δίκαιε
  choice: Matuwid na Ama
  alternative: Makatarungang Ama
  rationale: Mas malawak ang “matuwid” kaysa “makatarungan” at saklaw nito ang moral na katuwiran ng Ama, hindi lamang ang patas na paghatol.
- issue: Kahulugan ng κόσμος sa Juan
  choice: sanlibutan
  alternative: mga tao sa mundo; sistema ng mundo
  rationale: 'Pinananatili ng “sanlibutan” ang sadyang lawak at teolohikal na tensiyon ng salita: maaari itong tumukoy sa sangkatauhang hiwalay sa Diyos nang hindi binubura ang iba pang himig ng termino.'
- issue: Aspekto ng mga aorist ng γινώσκω
  choice: Natural na mga anyong Filipino na nagpapakita ng nakaraang pagkilala at kasalukuyang bisa nito
  alternative: nakilala / nakilala / nalaman sa lahat ng sugnay
  rationale: Walang eksaktong katumbas sa Filipino ang pagkakaiba ng Griyegong aorist at English perfect. Ang “kilala kita” at “alam ng mga ito” ay likas na nagpapahayag ng kaalamang nananatiling may bisa, samantalang ang talab ng aorist ay itinatala sa talababa.
- issue: Ugnayan ng unang καὶ sa kasunod na δέ
  choice: bagaman ... [pahiwatig na pagsalungat]
  alternative: at ... ngunit
  rationale: Ang “bagaman” ay nagpapahayag ng malamang na concessive na ugnayan sa konteksto, habang itinatala sa talababa ang mas pormal na koordinasyong “at ... ngunit” upang hindi itago ang posibleng pagbasa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “Matuwid na Ama” bilang likas na bokatibo, iniwasan ang makalumang “O,” at pinanatili ang “sanlibutan” dahil sa mahalagang himig nito sa Ebanghelyo ni Juan.
