  text: ἵνα πάντες ἓν ὦσιν, καθὼς σύ, ⸀πάτερ, ἐν ἐμοὶ κἀγὼ ἐν σοί, ἵνα καὶ αὐτοὶ ἐν ⸀ἡμῖν ὦσιν, ἵνα ὁ κόσμος ⸀πιστεύῃ ὅτι σύ με ἀπέστειλας.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/021.yaml
  text: that they may all be one[a], just as you, Father, are in me and I am in you; that they also may be in us[c][b], so that the world may believe that you sent me.
translation:
  language: tl
  text: upang lahat sila ay maging isa[a], kung paanong ikaw, Ama, ay nasa akin at ako ay nasa iyo; upang sila rin ay nasa atin[b], upang maniwala[c] ang sanlibutan na ikaw ang nagsugo sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magkaisa silang lahat.” Mas literal sa Griyego ang “lahat sila ay maging isa,” na nagpapanatili sa mas malawak na diwa ng pagkakaisa nang hindi ito nililimitahan sa isang aspekto lamang.
    reason: lexical_alternative
  - marker: b
    text: Ang paulit-ulit na “nasa” (“nasa akin,” “nasa iyo,” “nasa atin”) ay sumasalamin sa pananalita ni Juan tungkol sa pananahan sa isa’t isa at pakikibahagi; mas matindi ito kaysa sa simpleng pakikisama.
    reason: cross_reference
  - marker: c
    text: Maaari ring unawain na “magsimulang maniwala.” Maaaring tumukoy ang Griyego sa paniniwala ng sanlibutan nang hindi tahasang tinutukoy kung ang diin ay sa pagsisimula o sa pagpapatuloy ng paniniwala.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: upang
  rationale: Tatlong sunod-sunod na sugnay na ἵνα ang isinalin sa iisang paraan upang mapanatili ang pag-uulit at ang daloy ng layunin o bunga sa Griyego.
- source_word: πάντες
  choice: silang lahat
  rationale: Likas itong Filipino at malinaw na saklaw ang lahat ng tinutukoy ni Jesus.
- source_word: ἓν
  choice: isa
  rationale: Pinananatili ng “isa” ang payak ngunit malalim na pananalita ng Griyego at hindi nililimitahan ang pagkakaisa sa isang tiyak na anyo.
- source_word: καθὼς
  choice: kung paanong
  rationale: Malinaw nitong ipinakikita ang paghahambing ng pagiging isa ng mga alagad at ng ugnayan ng Ama at ng Anak.
- source_word: πάτερ
  choice: Ama
  rationale: Pinananatili ang tahasang pantawag at ang relasyonal at teolohikal na bigat nito.
- source_word: ἐν ἐμοὶ ... ἐν σοί
  choice: nasa akin ... nasa iyo
  rationale: Ang “nasa” ang likas na paraan sa Filipino upang panatilihin ang paulit-ulit na ἐν at ang wika ni Juan tungkol sa pananatili o pakikibahagi sa isa't isa, nang hindi ito pinahihina tungo sa pakikisama lamang.
- source_word: κἀγώ
  choice: at ako
  rationale: 'Likas nitong inuugnay ang katumbas at tugunang pahayag: ang Ama ay nasa Anak, at ang Anak ay nasa Ama.'
- source_word: καὶ αὐτοὶ
  choice: sila rin
  rationale: Pinananatili nito ang dagdag na diwa ng καί at iniuugnay ang mga mananampalataya sa naunang pahayag tungkol sa Ama at sa Anak.
- source_word: ἐν ἡμῖν
  choice: nasa atin
  rationale: Pinananatili nito ang literal at teolohikal na mahalagang “sa atin” sa halip na gawing pakikisama o basta pagiging kabilang.
- source_word: κόσμος
  choice: ang sanlibutan
  rationale: Ang “sanlibutan” ay dignified at karaniwang terminong biblikal sa Filipino na nagpapanatili sa malawak at teolohikal na gamit ni Juan sa κόσμος.
- source_word: πιστεύῃ
  choice: maniwala
  rationale: Hindi nito ipinapasya kung ang diin ay sa pagsisimulang maniwala o sa patuloy na pananampalataya; ang ganitong pagkakaiba ay hindi tahasang tinutukoy ng anyong Griyego.
- source_word: ἀπέστειλας
  choice: nagsugo
  rationale: Ang “nagsugo” ay mas angkop kaysa simpleng “nagpadala” sa kontekstong nagsasangkot ng misyong ipinagkatiwala ng Ama sa Anak, habang nananatiling natural sa Filipino.
theological_decisions:
- issue: Ang uri ng pagiging isa ng mga mananampalataya kaugnay ng Ama at ng Anak
  choice: Isalin ang ἓν bilang “isa” at panatilihin ang “nasa atin.”
  alternative: “magkaisa silang lahat” o “maging isa sila sa layunin”
  rationale: Hindi nililinaw ng talata kung ang pagkakaisang ito ay pang-organisasyon, pangmoral, panlayunin, o metapisikal. Ang “isa” ay nagpapanatili sa lalim at tunay na tensiyong teolohikal nang walang idinadagdag na makitid na pakahulugan.
- issue: Ang wika ni Juan tungkol sa magkatugong pananahan o pakikibahagi
  choice: Gamitin ang “nasa akin,” “nasa iyo,” at “nasa atin.”
  alternative: “kasama ko / kasama mo / kasama natin” o “kaisa natin”
  rationale: Paulit-ulit ang ἐν sa Griyego. Ang “kasama” ay magpapahina rito tungo sa simpleng pakikisama, samantalang ang “kaisa” ay maagang magpapasya sa eksaktong uri ng ugnayang hindi tahasang ipinaliliwanag ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang tatlong “upang” upang marinig ang sinadyang pag-uulit ng ἵνα sa Griyego. Ginamit ang “sanlibutan” bilang pamilyar na terminong biblikal, at iniwasan ang mga pariralang magpapaliwanag nang lampas sa sadyang malalim at hindi lubos na tinutukoy na wika ng talata.
