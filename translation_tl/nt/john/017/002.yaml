id: JHN.17.2
reference: John 17:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καθὼς ἔδωκας αὐτῷ ἐξουσίαν πάσης σαρκός, ἵνα πᾶν ὃ δέδωκας αὐτῷ ⸀δώσῃ αὐτοῖς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/002.yaml
  text: just as you gave him authority over all flesh[a], so that to all whom you have given him[b], he may give eternal life.
translation:
  language: tl
  text: kung paanong binigyan mo siya ng awtoridad sa lahat ng tao[a], upang bigyan niya ng buhay na walang hanggan ang lahat ng ibinigay mo sa kanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “lahat ng laman,” isang idyomang biblikal na tumutukoy sa lahat ng tao o sa buong sangkatauhan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “lahat ng ibinigay mo sa kanya.” Gumagamit ang Griyego ng nyutral na isahang pananalita na sama-samang tumutukoy sa mga taong ibinigay sa Anak.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: kung paanong
  rationale: Malinaw na ipinakikita ang paghahambing o pagkakatugma sa naunang kahilingan sa talata 1.
- source_word: ἔδωκας
  choice: binigyan mo
  rationale: Ang aorist ay likas na isinasalin bilang naganap na pagbibigay ng Ama ng awtoridad sa Anak.
- source_word: ἐξουσίαν
  choice: awtoridad
  rationale: Ipinahihiwatig nito ang ipinagkaloob na karapatan at saklaw ng pamamahala, hindi lamang lakas o kapangyarihan.
- source_word: πάσης σαρκός
  choice: sa lahat ng tao
  rationale: Ang literal na 'lahat ng laman' ay idyomang biblikal para sa buong sangkatauhan; ang natural na kahulugan nito ang ginamit sa pangunahing teksto, at ang literal na anyo ay iniingatan sa talababa.
- source_word: ἵνα
  choice: upang
  rationale: Pinananatili ang layunin o nilalayong bunga ng pagkakaloob ng awtoridad.
- source_word: πᾶν ὃ
  choice: ang lahat ng
  rationale: Bagaman nyutral at isahan sa Griyego, kolektibo itong tumutukoy sa mga taong ibinigay ng Ama sa Anak. Likas sa Tagalog ang 'ang lahat ng' kasama ng kasunod na parirala.
- source_word: δέδωκας
  choice: ibinigay mo
  rationale: Ang aspektong perpekto ay tumutukoy sa natapos na pagkakaloob na nananatiling mahalaga; sapat na ipinahihiwatig ito ng konteksto sa natural na Tagalog.
- source_word: δώσῃ
  choice: bigyan niya
  rationale: Ang anyong sugnay na may 'upang' ay natural na naghahayag ng layunin nang hindi nagdaragdag ng pag-aalinlangan.
- source_word: αὐτοῖς
  choice: ang lahat ... sa kanya
  rationale: Ang tagatanggap ay malinaw na iniugnay sa kolektibong pangkat na ibinigay sa Anak; iniiwasan ng ayos na ito ang kalituhan sa 'lahat ng tao.'
- source_word: ζωὴν αἰώνιον
  choice: buhay na walang hanggan
  rationale: Ito ang malinaw, pangkaraniwan, at tumpak na katumbas ng ekspresyong Juanino.
theological_decisions:
- issue: Saklaw ng awtoridad at pagkakakilanlan ng mga binibigyan ng buhay na walang hanggan
  choice: Pinanatili ang pangkalahatang saklaw ng awtoridad ng Anak sa lahat ng tao at ang natatanging kolektibong pangkat na ibinigay sa kanya ng Ama.
  alternative: Maaaring gawing literal na 'lahat ng laman' at 'lahat ng bagay na ibinigay mo sa kanya,' ngunit maaaring magmukhang tumutukoy sa mga bagay sa halip na mga tao.
  rationale: Ibinubukod mismo ng talata ang lahat ng sakop ng awtoridad sa mga tumatanggap ng buhay na walang hanggan. Hindi nilulutas ng salin ang teolohikal na tensiyong ito ayon sa alinmang sistemang denominasyonal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'awtoridad' dahil karaniwan at mas tiyak ito kaysa 'kapangyarihan' para sa ipinagkaloob na karapatan. Isinalin sa natural na Filipino ang idyomang 'lahat ng laman,' habang pinanatili ang literal na anyo sa talababa.
