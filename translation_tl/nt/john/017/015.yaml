base_translation:
  language: en
  yaml_path: translation/nt/john/017/015.yaml
  text: I am not asking that you take them out of the world[a], but that you keep them from the evil one.
translation:
  language: tl
  text: Hindi ko hinihiling na alisin mo sila sa sanlibutan, kundi na ingatan mo sila mula sa Masama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “mula sa kasamaan.” Ang Griyegong τοῦ πονηροῦ ay maaaring mangahulugang “ang Masama” (panlalaki) o “kasamaan” (neutro).
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρωτῶ
  choice: hinihiling ko
  rationale: Ang kasalukuyang panahunang pandiwa ay tumutukoy sa hinihiling ni Jesus sa mismong panalangin; natural at marangal sa Filipino ang “hinihiling” nang hindi nagdaragdag ng eklesiastikong himig.
- source_word: ἄρῃς
  choice: alisin
  rationale: Sa kayariang ἄρῃς ... ἐκ, ang diwa ay alisin o kunin palabas; “alisin ... sa sanlibutan” ang malinaw at likas na Filipino.
- source_word: κόσμου
  choice: sanlibutan
  rationale: Pinananatili nito ang malawak na saklaw ng κόσμος at ang pamilyar na Johannine na gamit, nang hindi nililimitahan sa lipunan o sa isang tiyak na kaayusan.
- source_word: τηρήσῃς
  choice: ingatan
  rationale: Saklaw ng “ingatan” ang pag-iingat, pagbabantay, at pagpapanatiling ligtas, at natural itong ginagamit sa isang panalangin.
- source_word: ἐκ
  choice: mula sa
  rationale: Kasama ng τηρήσῃς, ipinahihiwatig nito ang pag-iingat mula sa isang panganib; likas sa Filipino ang “ingatan ... mula sa.”
- source_word: τοῦ πονηροῦ
  choice: masama
  rationale: Ang anyong Griyego ay maaaring neutro (“kasamaan/masama”) o panlalaki (“Masama,” ang masamang isa). Ang “masama” sa pangunahing teksto ay maikli at nakapagpapanatili ng ilang likas na kalabuan sa Filipino; nililinaw sa talababa ang personal na posibilidad.
theological_decisions:
- issue: Kung ang τοῦ πονηροῦ ay impersonal (“kasamaan”) o personal (“ang Masama”)
  choice: masama
  alternative: ang Masama / ang masamang isa
  rationale: Tunay na malabo sa Griyego ang kasarian ng anyo. Bagaman malakas sa mga sulat ni Juan ang personal na pagtukoy kay Satanas, hindi ito dapat lubusang ipasya sa salin; kaya pinanatiling bukas ang pangunahing Filipino at tahasang ibinigay sa talababa ang alternatibong personal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “sanlibutan” upang mapanatili ang malawak at teolohikal na gamit ng κόσμος sa Juan; iniwasan ang mas kolokyal na “mundo” at ang sobrang paliwanag na “makasalanang kaayusan ng mundo.”
