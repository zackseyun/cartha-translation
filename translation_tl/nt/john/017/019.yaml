id: JHN.17.19
reference: John 17:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ὑπὲρ αὐτῶν ἐγὼ ἁγιάζω ἐμαυτόν, ἵνα ⸂ὦσιν καὶ αὐτοὶ⸃ ἡγιασμένοι ἐν ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/019.yaml
  text: And for their sake I sanctify myself[b][a], so that they also may be sanctified in truth.
translation:
  language: tl
  text: At alang-alang sa kanila, itinatalaga ko ang aking sarili[a], upang sila rin ay maitalaga sa katotohanan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ibinubukod ko ang aking sarili para sa banal na layunin.” Iisang salitang-ugat sa Griyego ang ginamit dito at sa “maitalaga” sa bandang huli ng talata.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa katotohanan” sa diwang mas tiyak, o “sa pamamagitan ng katotohanan”; ihambing sa 17:17.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπὲρ αὐτῶν
  choice: alang-alang sa kanila
  rationale: Likas sa modernong Tagalog at malinaw na ipinapahayag na ang pagkilos ni Jesus ay para sa kapakanan nila, nang hindi ipinapalagay na ang parirala mismo ay tahasang tumutukoy sa pagpapalit o paghalili.
- source_word: ἁγιάζω … ἡγιασμένοι
  choice: itinatalaga … maitalaga
  rationale: Ang ‘italaga’ ay angkop sa kontekstong ito ng pagbubukod ng sarili para sa isang banal na layunin. Inulit ang iisang salitang-ugat sa dalawang sugnay upang mapanatili ang malinaw na ugnayan ng magkaparehong salitang-ugat sa Griyego.
- source_word: ἐμαυτόν
  choice: ang aking sarili
  rationale: Tuwirang ipinapakita ng pariralang pampronombre ang sariling pagkilos ni Jesus.
- source_word: ἵνα
  choice: upang
  rationale: Natural at marangal na pananda ng layunin sa Tagalog.
- source_word: ὦσιν καὶ αὐτοὶ
  choice: sila rin ay
  rationale: Pinananatili ng ‘rin’ ang diwa ng pagdaragdag at pagdidiin sa καὶ αὐτοὶ nang hindi nagiging alanganin ang pangungusap.
- source_word: ἐν ἀληθείᾳ
  choice: sa katotohanan
  rationale: Pinananatili nito ang maaaring diwa ng saklaw o kalagayan ng pagtatalaga at ang alingawngaw ng Juan 17:17, nang hindi tahasang ginagawang kasangkapan ang katotohanan.
theological_decisions:
- issue: Kahulugan ng pagtatalaga ni Jesus sa kanyang sarili
  choice: Inilalarawan ni Jesus ang kusang pagbubukod o pag-aalay ng kanyang sarili para sa banal na layunin at para sa kapakanan ng mga alagad.
  alternative: Ginagawa ni Jesus na banal ang sarili niya mula sa isang dating kalagayang di-banal.
  rationale: Sa konteksto, ang ἁγιάζω ay higit na angkop unawain bilang pagtatalaga sa banal na misyon kaysa pagbabago mula sa karumihan tungo sa kabanalan. Ang ‘itinatalaga’ ay nagpapanatili sa kahulugang ito nang hindi nagdaragdag ng tahasang layon gaya ng ‘sa Diyos,’ na wala sa mismong Griyego.
- issue: Diwa ng ἐν ἀληθείᾳ
  choice: sa katotohanan, bilang saklaw o realidad ng kanilang pagtatalaga
  alternative: sa pamamagitan ng katotohanan; o sa mismong katotohanan
  rationale: Walang artikulo ang ἀληθείᾳ, at maaaring tumukoy ang ἐν sa saklaw, kalagayan, o paraan. Pinananatili ng pangunahing salin ang likas na kalabuan at ang kaugnayan sa talata 17.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang ‘itinatalaga/maitalaga’ sa halip na mas teknikal na ‘pinababanal/mapabanal’ upang maiwasan ang maling pahiwatig na kailangang luminis si Jesus mula sa kasalanan, habang pinananatili ang pag-uulit ng salitang-ugat sa Griyego.
