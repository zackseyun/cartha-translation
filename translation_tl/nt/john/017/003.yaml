source:
  edition: SBLGNT
  text: αὕτη δέ ἐστιν ἡ αἰώνιος ζωὴ ἵνα γινώσκωσι σὲ τὸν μόνον ἀληθινὸν θεὸν καὶ ὃν ἀπέστειλας Ἰησοῦν Χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/003.yaml
  text: 'And this is eternal life: that they may know you[a], the only true God, and Jesus the Messiah whom you sent.'
translation:
  language: tl
  text: 'At ito ang buhay na walang hanggan: ang makilala ka nila, ikaw na tanging tunay na Diyos, at si Jesus na Mesiyas[a] na iyong isinugo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ayon sa tradisyon, “si Jesu-Cristo.” Ang Griyegong Χριστός ay maaaring gamiting titulo (“Mesiyas”) o, sa ilang konteksto, katawagang halos tulad ng pangalan (“Cristo”).
    reason: alternative_reading
lexical_decisions:
- source_word: αὕτη δέ ἐστιν
  choice: At ito ang
  rationale: Pinananatili ng “At” ang banayad na pag-uugnay ng δέ, habang likas sa modernong Filipino ang buong pambungad.
- source_word: ἡ αἰώνιος ζωὴ
  choice: buhay na walang hanggan
  rationale: Ito ang malinaw at nakaugaliang salin ng ekspresyong Johannine para sa buhay na nauukol sa darating na kapanahunan at hindi nagwawakas.
- source_word: ἵνα γινώσκωσι
  choice: ang makilala ... nila
  rationale: Dito, inilalahad ng ἵνα ang nilalaman o katangian ng buhay na walang hanggan. Ang “makilala” ay likas sa Filipino at maaaring magpahiwatig ng tunay at patuloy na pagkakilala, hindi lamang ng kaalamang intelektuwal.
- source_word: σὲ
  choice: ka
  rationale: Tuwirang layon ito ng “makilala” at tumutukoy sa Ama na kinakausap ni Jesus sa panalangin.
- source_word: τὸν μόνον ἀληθινὸν θεὸν
  choice: ang tanging tunay na Diyos
  rationale: Tumpak at natural nitong pinananatili ang αποκλεισibong puwersa ng μόνον at ang kahulugang “tunay” ng ἀληθινόν.
- source_word: καὶ
  choice: at
  rationale: Payak na pinagdudugtong nito ang Ama at si Jesus bilang siyang isinugo, nang walang idinaragdag na paliwanag sa kanilang ugnayan.
- source_word: ὃν ἀπέστειλας
  choice: na iyong isinugo
  rationale: Ang “isinugo” ay mas angkop kaysa simpleng “ipinadala” para sa misyong ipinagkaloob ng Ama, at natural na nagsasaad ng natapos na pagpapadala.
- source_word: Ἰησοῦν Χριστόν
  choice: si Jesus na Mesiyas
  rationale: Pinananatili ng “Mesiyas” ang titulong kahulugan ng Χριστός. Ginagawang likas ng pang-angkop na “na” ang parirala sa Filipino nang hindi nagpapasok ng ideyang wala sa Griyego.
theological_decisions:
- issue: Ang kaugnayan ng pariralang “ang tanging tunay na Diyos” kay Jesus
  choice: Tuwirang tawagin ang Ama na “ang tanging tunay na Diyos” at ibukod sa balarila si Jesus bilang siyang isinugo ng Ama.
  alternative: Magdagdag ng paliwanag upang tahasang lutasin ang talata ayon sa isang pormulang Trinitaryo o anti-Trinitaryo.
  rationale: Dapat panatilihin ng salin ang mismong pananalita at tensiyong teolohikal ng talata, nang hindi nilulutas sa pamamagitan ng dagdag na mga salita ang mas malawak na Kristolohiya ng Ebanghelyo.
- issue: Pagsasalin ng Χριστόν
  choice: Mesiyas
  alternative: Cristo
  rationale: Naririnig pa rito ang kabuluhan ng Χριστός bilang titulo. Gayunman, maaaring gumana rin itong katawagang halos tulad ng pangalan, kaya inilalagay sa talababa ang tradisyonal na anyo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “iyong” sa halip na “mo” upang mapanatili ang panalanging rehistro nang hindi nagiging lipas o labis na pormal. Ang tandang talababa [a] ay nakalagay agad pagkatapos ng “Mesiyas.”
