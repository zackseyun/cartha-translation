  source_fidelity: Tumpak ang magkatumbas na pag-aari sa unang dalawang sugnay at ang direktang “sa kanila” para sa ἐν αὐτοῖς. Gayunman, ang “niluwalhati ako” ay mas malinaw na naghahayag ng naganap na pagluwalhati kapag nilagyan ng “na,” na tumutulong magpahiwatig ng perpektong anyo ng δεδόξασμαι nang hindi nagiging di-natural sa Filipino.
  naturalness: Natural at marangal ang balanse ng unang dalawang sugnay. Ang “niluwalhati na ako” ay mas idiomatiko sa kontekstong ito at mas malinaw ang aspektong ganap. Sa talababa, ang “kasama nila” ay nangangahulugang “with them,” hindi ang mas malapit na diwa ng English na “among them”; “sa gitna nila” ang mas angkop na alternatibo.
  terminology: Ang “akin,” “sa iyo,” at “niluwalhati” ay angkop na modernong Filipino Tagalog at pinananatili ang teolohikal na pahayag nang walang idinagdag na doktrinal na termino.
  issues:
  - severity: low
    issue: Kulang ang aspektong ganap sa “niluwalhati ako.”
    rationale: Ang δεδόξασμαι ay perpektong balintiyak. Hindi ganap na nakasalalay ang Filipino sa aspektong Griyego, ngunit ang “na” ay ligtas at natural na paraan upang maipakita ang naganap na pagkilos na may kasalukuyang kabuluhan.
  - severity: medium
    issue: Hindi tumpak ang “kasama nila” bilang alternatibo para sa “among them.”
    rationale: Ang “kasama nila” ay karaniwang “with them.” Para sa posibleng diwang “among them,” mas angkop ang “sa gitna nila,” samantalang ang pangunahing tekstong “sa kanila” ay dapat panatilihin upang huwag lutasin ang kalabuan ng ἐν.
