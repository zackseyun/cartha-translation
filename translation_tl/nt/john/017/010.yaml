  text: And all that is mine is yours[a], and what is yours is mine, and I have been glorified in them.
translation:
  language: tl
  text: At ang lahat ng akin ay sa iyo, at ang sa iyo ay akin, at niluwalhati na ako sa kanila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pamamagitan nila” o “sa gitna nila.” Ang Griyego ay literal na “sa kanila,” na maaaring magpahiwatig ng kinaroroonan, paraan, o pagpapakita ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἐμὰ πάντα
  choice: ang lahat ng akin
  rationale: Likas at malawak ang saklaw ng parirala sa Filipino; ipinahihiwatig nito ang lahat ng pag-aari o nauukol kay Jesus nang hindi nililimitahan sa materyal na mga bagay.
- source_word: σά
  choice: sa iyo
  rationale: Karaniwang ekspresyon ito ng pag-aari sa modernong Filipino at angkop sa pangungusap na nagpapahayag ng magkatumbas na pag-aari.
- source_word: τὰ σὰ ἐμά
  choice: ang sa iyo ay akin
  rationale: Pinananatili nito ang maikli at tuwirang pagtutumbasan ng dalawang sugnay sa Griyego.
- source_word: δεδόξασμαι
  choice: niluwalhati ako
  rationale: Ipinapahayag ng perpektong balintiyak na pandiwa ang pagluwalhating naganap na at nananatili ang bunga; natural na naihahatid ito sa Filipino ng aspektong ganap na “niluwalhati.”
- source_word: ἐν αὐτοῖς
  choice: sa kanila
  rationale: 'Ang “sa kanila” ang natural na direktang salin sa Filipino na nakapagpapanatili sa lawak ng ἐν: maaaring tumukoy sa kinaroroonan, paraan, o pagpapakita ng kaluwalhatian ayon sa konteksto.'
theological_decisions:
- issue: Magkatumbas na pag-aari ng Anak at ng Ama
  choice: 'Tuwirang ihayag: “ang lahat ng akin ay sa iyo, at ang sa iyo ay akin.”'
  alternative: Pahinain ito bilang pagtutulungan lamang sa tungkulin, sa halip na tunay na pagpapahayag ng magkatumbas na pag-aari.
  rationale: Malinaw na ipinahahayag ng Griyego ang pagtutumbasan. Hindi ito dapat pahinain, ngunit hindi rin dapat dagdagan ng terminolohiyang teolohikal na wala mismo sa talata.
- issue: Sanggunian at puwersa ng ἐν αὐτοῖς
  choice: Panatilihin sa pangunahing teksto ang malawak na “sa kanila.”
  alternative: Isalin nang tiyak bilang “sa pamamagitan nila” o “kasama nila.”
  rationale: Maaaring taglayin ng ἐν ang lokatibo, instrumental, o pagpapakitang diwa. Hindi hinihingi ng teksto na pasiyahan ang pagiging malabo nito, kaya inilalagay sa talababa ang mga posibleng pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Pinanatili ang maikli at balanseng ayos ng dalawang unang sugnay at ang tunay na kalabuan ng pang-ukol sa huling sugnay.
