source:
  edition: SBLGNT
  text: καὶ ἐγνώρισα αὐτοῖς τὸ ὄνομά σου καὶ γνωρίσω, ἵνα ἡ ἀγάπη ἣν ἠγάπησάς με ἐν αὐτοῖς ᾖ κἀγὼ ἐν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/026.yaml
  text: And I made your name known to them[a], and I will make it known, so that the love with which you loved me may be in them[c][b], and I in them.
translation:
  language: tl
  text: At ipinakilala ko sa kanila ang iyong pangalan[a][b], at ipakikilala ko pa ito, upang ang pag-ibig na iniukol mo sa akin ay maging nasa kanila[c], at ako rin ay maging nasa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “inihayag ko sa kanila ang iyong pangalan, at ihahayag ko pa ito.”
    reason: lexical_alternative
  - marker: b
    text: Ang “iyong pangalan” ay tumutukoy sa nahayag na pagkakakilanlan at katangian ng Diyos, hindi lamang sa katawagang binibigkas.
    reason: cultural_note
  - marker: c
    text: O, “sa gitna nila.” Gayunman, mas tuwirang pinananatili ng “nasa kanila” ang diwa ng pagiging nasa kanila.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώρισα
  choice: ipinakilala ko
  rationale: Ipinahahayag nito ang causative na diwa ng γνωρίζω—ginawang kilala—at natural itong katambal ng anyong panghinaharap sa kasunod na sugnay.
- source_word: τὸ ὄνομά σου
  choice: ang iyong pangalan
  rationale: Pinananatili ang kongkretong idyomang Griyego sa halip na ipalit sa pangunahing teksto ang pagpapakahulugang “kung sino ka” o “ang iyong pagkatao.”
- source_word: γνωρίσω
  choice: ipakikilala ko pa ito
  rationale: Ang “ipakikilala” ay tumutugma sa panghinaharap na anyo; ang “pa” ay likas na nagpapakita ng pagpapatuloy mula sa naunang ginawa, at ang “ito” ay tumutukoy sa pangalan.
- source_word: ἵνα
  choice: upang
  rationale: Malinaw at likas na ipinahahayag ang layunin o nilalayong bunga ng sugnay.
- source_word: ἡ ἀγάπη ἣν ἠγάπησάς με
  choice: ang pag-ibig mo sa akin
  rationale: Natural na Filipino ito para sa pag-ibig na iniibig ng Ama sa Anak, nang hindi nagdaragdag ng ideyang gaya ng “ipinakita” o “iniukol” na wala sa Griyego.
- source_word: ἐν αὐτοῖς
  choice: mapasakanila
  rationale: Pinananatili nito ang diwa ng pagiging “nasa kanila” at ang temang Juanino ng pananatili sa kalooban, bagaman maaari ring unawain ang ἐν bilang “sa gitna nila.”
- source_word: κἀγὼ ἐν αὐτοῖς
  choice: at ako rin ay mapasakanila
  rationale: Inilalantad sa natural na Filipino ang pandiwang ipinahihiwatig ngunit hindi inuulit sa Griyego, habang pinananatiling magkatugma ang banal na pag-ibig at ang presensya ni Jesus.
theological_decisions:
- issue: Kahulugan ng “iyong pangalan”
  choice: Pinanatili sa pangunahing teksto ang “iyong pangalan.”
  alternative: “kung sino ka” o “ang iyong pagkatao”
  rationale: Ang “pangalan” ay tumutukoy sa nahayag na pagkakakilanlan at katangian ng Diyos, ngunit ang pagpapalit nito ng paliwanag sa pangunahing teksto ay magpapasok ng interpretasyon sa salin.
- issue: Ugnayan ng pag-ibig ng Ama at ng presensya ni Jesus sa mga alagad
  choice: 'Iniharap bilang dalawang magkatugmang katotohanan: “mapasakanila ang pag-ibig … at ako rin ay mapasakanila.”'
  alternative: Gawing sanhi ng isa ang isa, gaya ng “sapagkat ako ay nasa kanila.”
  rationale: Magkatuwang na inilalahad ng Griyego ang dalawang bagay at hindi nito tahasang ginagawang sanhi o bunga ang isa sa isa.
- issue: Diwa ng ἐν αὐτοῖς
  choice: “mapasakanila,” na pangunahing nagpapahiwatig ng pagiging nasa kanila
  alternative: “sa gitna nila”
  rationale: Parehong posible ayon sa saklaw ng ἐν, ngunit higit na angkop sa konteksto ng Juan 17 ang panloob na presensya o pananahan; pinananatili sa talababa ang tunay na alternatibo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “ipinakilala” sa halip na mas pormal na “ipinaalam,” at ang “mapasakanila” upang mapanatili ang maikli at taimtim na ritmo ng panalangin.
