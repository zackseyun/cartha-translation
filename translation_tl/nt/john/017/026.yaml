revisions:
- from: At ipinakilala ko sa kanila ang iyong pangalan[a][b], at ipakikilala ko pa ito, upang mapasakanila[c] ang pag-ibig mo sa akin, at ako rin ay mapasakanila.
  to: At ipinakilala ko sa kanila ang iyong pangalan[a][b], at ipakikilala ko pa ito, upang ang pag-ibig na iniukol mo sa akin ay maging nasa kanila[c], at ako rin ay maging nasa kanila.
  rationale: Pinalitan ang “mapasakanila” ng “maging nasa kanila” upang malinaw at tuwirang maisalin ang ἐν αὐτοῖς sa kapwa paglitaw nito. Pinalinaw rin ang pag-ibig na tinutukoy bilang “pag-ibig na iniukol mo sa akin,” na likas na Filipino at tapat sa pag-ibig ng Ama para kay Jesus. Ang inuulit na “maging” sa huling sugnay ay isang katanggap-tanggap na pagpapalinaw ng pandiwang ipinahihiwatig sa Griyego at pinananatili ang magkatugmang ayos ng dalawang realidad.
