  text: Now they have come to know that everything you have given me is from you[a].
translation:
  language: tl
  text: Ngayon ay nalaman na nila na ang lahat ng ibinigay mo sa akin ay mula sa iyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “ang lahat ng ibinigay mo sa akin ay nagmumula sa iyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν
  choice: Ngayon
  rationale: Tumutukoy sa kasalukuyang yugto at kinalabasan ng pagkaunawa ng mga alagad.
- source_word: ἔγνωκαν
  choice: nakilala na nila
  rationale: Ipinahihiwatig ng perpektong panahunan ang pagkilalang natamo na at nananatili sa kasalukuyan; natural itong ipinapahayag sa Filipino sa pamamagitan ng “nakilala na.”
- source_word: ὅτι
  choice: na
  rationale: Karaniwang pang-ugnay na nagpapakilala sa nilalaman ng kanilang nalaman.
- source_word: πάντα ὅσα
  choice: ang lahat ng
  rationale: Pinananatili ang saklaw ng kabuuan at ang kaugnay na diwa ng “lahat ng anumang” sa natural na Filipino.
- source_word: δέδωκάς μοι
  choice: ibinigay mo sa akin
  rationale: Ang aspektong perpekto ay nagpapakita ng natapos na pagbibigay na may nagpapatuloy na kabuluhan; natural sa Filipino ang anyong “ibinigay mo sa akin.”
- source_word: παρὰ σοῦ
  choice: mula sa iyo
  rationale: Ipinapahayag ng παρά na may genitibo ang pinagmulan o bukal.
- source_word: εἰσιν
  choice: ay
  rationale: Ang pangungusap na panaguri sa Filipino ay hindi nangangailangan ng tahasang bilang sa pandiwa; maayos na inuugnay ng “ay” ang kabuuang paksa sa pinagmulan nito.
theological_decisions:
- issue: Kaugnayan ng mga ibinigay ng Ama sa Anak at ng pinagmulan ng mga ito
  choice: “ang lahat ng ibinigay mo sa akin ay mula sa iyo”
  alternative: “ang lahat ng ibinigay mo sa akin ay nagmumula sa iyo”
  rationale: Tuwirang pinananatili ang pahayag na ang Ama ang pinagmulan, nang hindi dinaragdagan o nilulutas ang mas malawak na teolohikal na ugnayan ng Ama at ng Anak.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nakilala na” upang katawanin ang natamong pagkaunawa na nananatili, at ang “mula sa iyo” upang maikli at tapat na ipahayag ang pinagmulan.
