id: JHN.4.29
reference: John 4:29
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Δεῦτε ἴδετε ἄνθρωπον ὃς εἶπέ μοι πάντα ⸀ὅσα ἐποίησα· μήτι οὗτός ἐστιν ὁ χριστός;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/029.yaml
  text: Come[a], see a man who told me everything I have done. Could this be the Messiah?
translation:
  language: tl
  text: “Halikayo at tingnan ninyo ang isang lalaking nagsabi sa akin ng lahat ng ginawa ko. Hindi kaya siya ang Mesiyas?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Hindi kaya siya ang Cristo?”
    reason: Alternatibong salin ng titulong Griyego na χριστός.
lexical_decisions:
- source_word: Δεῦτε ἴδετε
  choice: Halikayo at tingnan ninyo
  rationale: Likas na paanyaya sa makabagong Filipino; pinananatili ang dalawang utos na lumapit at tumingin.
- source_word: ἄνθρωπον
  choice: isang lalaki
  rationale: Tumutukoy ang pangngalang Griyego sa isang partikular na lalaking tao, si Jesus.
- source_word: ὃς εἶπέ μοι
  choice: na nagsabi sa akin
  rationale: Tuwirang ipinapahayag ang ginawa ng lalaki sa babae at natural ang ayos sa Filipino.
- source_word: πάντα ὅσα ἐποίησα
  choice: lahat ng ginawa ko
  rationale: Pinananatili ang malawak na saklaw ng πάντα ὅσα nang hindi mabigat ang pangungusap.
- source_word: μήτι οὗτός ἐστιν
  choice: Hindi kaya siya ang
  rationale: Ang “hindi kaya” ay nagpapahayag ng nag-aalinlangan ngunit nag-aanyayang tanong, at hindi ginagawang tiyak na pahayag ang sinabi ng babae.
- source_word: ὁ χριστός
  choice: ang Mesiyas
  rationale: Dito, ang χριστός ay kinikilalang titulong Judio at hindi pangalang pantangi; malinaw itong naipahahayag ng “Mesiyas.”
theological_decisions:
- issue: Pagpapahayag sa χριστός bilang titulo
  choice: ang Mesiyas
  alternative: ang Cristo
  rationale: Ang salita ay ginagamit dito bilang inaasahang titulong mesiyaniko. Isinasalin ito bilang “Mesiyas” upang luminaw ang tungkulin nito bilang titulo, habang inilalagay sa talababa ang tradisyonal na “Cristo.”
- issue: Pahiwatig ng tanong na may μήτι
  choice: Hindi kaya siya ang Mesiyas?
  alternative: Siya kaya ang Mesiyas?
  rationale: Pinananatili ng “hindi kaya” ang pag-aatubili o inaasahang pagtutol na maaaring ipahiwatig ng μήτι, ngunit hinahayaan pa ring maging tunay na paanyaya ang tanong.
translation_notes:
  register: Makabago, malinaw, at magalang na Filipino. Ginamit ang maramihang “ninyo” dahil maraming taga-bayan ang inaanyayahan. Ang “Halikayo” ay mas natural na panawagan kaysa sa mas literal ngunit matigas na “Pumarito kayo.”
