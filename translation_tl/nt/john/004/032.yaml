  yaml_path: translation/nt/john/004/032.yaml
  text: But he said to them[a], “I have food to eat that you do not know.”
translation:
  language: tl
  text: Ngunit sinabi niya sa kanila, “Mayroon akong pagkain na hindi ninyo alam.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Nagpapahiwatig ng banayad na pagsalungat o pag-usad sa salaysay, kaugnay ng hindi pagkaunawa ng mga alagad.
- source_word: εἶπεν αὐτοῖς
  choice: sinabi niya sa kanila
  rationale: Tuwiran at likas na salin ng karaniwang pormulang αφηγηματικό na λέγω na may di-tuwirang layon.
- source_word: Ἐγὼ
  choice: Mayroon akong
  rationale: Nananatili ang unang panauhan at ang bahagyang diin sa nagsasalita sa likas na ayos ng pangungusap sa Tagalog.
- source_word: βρῶσιν
  choice: pagkain
  rationale: Dito ay tumutukoy sa pagkain, hindi sa kilos ng pagkain; pinananatili rin nito ang sinasadyang talinghaga.
- source_word: ἔχω φαγεῖν
  choice: Mayroon akong pagkaing makakain
  rationale: Likas na Tagalog na nagpapahayag ng pagkakaroon ng pagkaing maaaring kainin, habang malapit sa anyo ng Griyego.
- source_word: ἣν
  choice: na
  rationale: Likas na pang-ugnay sa Tagalog na malinaw na tumutukoy pabalik sa “pagkain.”
- source_word: ὑμεῖς
  choice: ninyo
  rationale: Ipinahihiwatig ng anyong maramihan ang kausap na mga alagad at pinananatili ang paghahambing sa kaalaman ni Jesus.
- source_word: οὐκ οἴδατε
  choice: hindi ninyo alam
  rationale: Tuwirang salin na likas sa Tagalog at hindi nagdaragdag ng paliwanag tungkol sa uri o pinagmulan ng pagkain.
theological_decisions:
- issue: Matalinghagang kahulugan ng “pagkain” ni Jesus
  choice: Panatilihin ang literal na salitang “pagkain” nang hindi ipinapaliwanag ang talinghaga sa mismong talata.
  alternative: Isalin nang hayagan bilang paggawa ng kalooban ng Ama.
  rationale: Sadyang hindi pa nililinaw ng talatang ito ang talinghaga at nananatili rito ang hindi pagkaunawa ng mga alagad; ipinapaliwanag lamang ito ng kasunod na konteksto.
translation_notes:
  register: Makabagong Filipino na simple, marangal, at madaling maunawaan. Hindi nilagyan ng talababa sapagkat natural sa Tagalog ang literal na “pagkaing makakain,” at hindi kailangan ang alternatibong “isang bagay na makakain.”
