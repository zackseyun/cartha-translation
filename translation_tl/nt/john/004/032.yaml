  source_fidelity: 'Tumpak ang pangunahing diwa: si Jesus ay may ‘pagkain’ na hindi nalalaman ng mga alagad. Gayunman, ang ‘pagkaing makakain’ ay maaaring mangahulugang pagkaing nakakain o maaaring kainin, sa halip na ang idiomatikong Griyegong ‘pagkaing mayroon akong kainin.’ Sa Tagalog, likas na maipapahayag ang konstruksyong ito sa ‘Mayroon akong pagkain,’ nang hindi nawawala ang sinadyang talinghaga.'
  naturalness: Ang ‘Ngunit sinabi niya sa kanila’ ay malinaw at angkop sa payak ngunit marangal na rehistro. Ang ‘pagkaing makakain’ ay hindi likas at may hindi kailangang pag-uulit; mas natural ang ‘pagkain na hindi ninyo alam.’
  terminology: Ang ‘pagkain’ ay wastong katumbas ng βρῶσις at dapat panatilihing literal upang huwag pangunahan ang paliwanag ng kasunod na konteksto. Ang ‘hindi ninyo alam’ ay angkop para sa οὐκ οἴδατε at pinananatili ang di-pagkaunawa ng mga alagad.
