id: JHN.4.22
reference: John 4:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὑμεῖς προσκυνεῖτε ὃ οὐκ οἴδατε, ἡμεῖς προσκυνοῦμεν ὃ οἴδαμεν, ὅτι ἡ σωτηρία ἐκ τῶν Ἰουδαίων ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/022.yaml
  text: You worship what you do not know; we worship what we know[a], because salvation is from the Jews.
translation:
  language: tl
  text: Sinasamba ninyo ang hindi ninyo kilala; sinasamba namin ang kilala namin, sapagkat ang kaligtasan ay mula sa mga Judio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bayang Judio.” Sa ibang bahagi ng Juan, maaaring mangahulugan ang “mga Judio” ng “mga taga-Judea,” ngunit dito ay inihahambing sila sa mga Samaritano kaugnay ng pagsamba at kasaysayan ng kaligtasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκυνεῖτε / προσκυνοῦμεν
  choice: sinasamba ninyo / sinasamba namin
  rationale: Sa kontekstong ito, tumutukoy ang pandiwa sa pagsamba sa Diyos, hindi lamang sa pisikal na pagyukod o pagbibigay-galang.
- source_word: ὃ
  choice: ang hindi / ang
  rationale: Pinananatili ng anyong ito ang di-tiyak na neutrong panghalip na tumutukoy sa bagay o layon ng pagsamba, nang hindi ito labis na tinutukoy bilang isang personal na 'siya na.'
- source_word: οἴδατε / οἴδαμεν
  choice: kilala ninyo / kilala namin
  rationale: Mas natural sa Filipino ang 'kilala' kapag ang tinutukoy ay ang layon ng pagsamba; pinananatili rin nito ang tuwirang pagsalungat ng dalawang sugnay.
- source_word: σωτηρία
  choice: kaligtasan
  rationale: Ito ang karaniwan at angkop na salin para sa nagliligtas na gawa ng Diyos, hindi lamang sa pansamantalang pagliligtas mula sa panganib.
- source_word: ἐκ
  choice: mula sa
  rationale: Malinaw nitong ipinapahayag ang pinagmulan o daluyan sa kasaysayan nang hindi dinaragdagan ang pahayag ng Griyego.
- source_word: τῶν Ἰουδαίων
  choice: mga Judio
  rationale: Sa kontekstong kausap ang isang Samaritana tungkol sa pagsamba at kasaysayan ng kaligtasan, tumutukoy ito sa bayang Judio, hindi lamang sa mga taga-Judea.
theological_decisions:
- issue: Kahulugan ng 'ang kaligtasan ay mula sa mga Judio'
  choice: Pahayag ito tungkol sa makasaysayang pinagmulan at pagdating ng pagliligtas ng Diyos sa pamamagitan ng bayang Judio.
  alternative: Maaaring unawain nang mas makitid bilang pagtukoy sa pagiging Judio ng Mesiyas, o nang mas malawak bilang pagtukoy sa pagkauna ng kapahayagan at pagsambang Judio.
  rationale: Pinananatili ng salin ang maikli at malawak na pahayag ng teksto. Hindi nito ginagawang pag-aangkin ng likas na kataasang etniko ang sinabi, ni nililimitahan lamang ito sa isang aspekto ng kasaysayan ng kaligtasan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'kilala' sa halip na 'alam' dahil mas natural ito para sa layon ng pagsamba. Inilagay ang pananda ng talababa pagkatapos ng pangungusap na kinauukulan.
