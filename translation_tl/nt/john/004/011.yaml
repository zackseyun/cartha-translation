id: JHN.4.11
reference: John 4:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸂ἡ γυνή⸃· Κύριε, οὔτε ἄντλημα ἔχεις καὶ τὸ φρέαρ ἐστὶν βαθύ· πόθεν οὖν ἔχεις τὸ ὕδωρ τὸ ζῶν;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/011.yaml
  text: The woman said to him[a], “Lord, you have neither a bucket nor is the well deep[b]. So where do you get the living water?”
translation:
  language: tl
  text: Sinabi ng babae sa kanya, “Ginoo[a], wala po kayong pangsalok, at malalim ang balon. Kaya saan ninyo makukuha ang tubig na buhay[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Panginoon.” Ang Griyegong κύριε ay isang magalang na pantawag at maaaring mangahulugang “Ginoo” o “Panginoon,” ayon sa konteksto.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “tubig na umaagos,” ibig sabihin, sariwang tubig na dumadaloy at hindi tubig na nakatigil. Pinananatili rin ng “tubig na buhay” ang mas malalim na kahulugan ng sinabi ni Jesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ ἡ γυνή
  choice: Sinabi sa kanya ng babae
  rationale: Ginawang payak na naganap na kilos ang historikal na pangkasalukuyan ng Griyego upang maging likas sa salaysay sa Tagalog, habang pinananatili ang babae bilang simuno.
- source_word: Κύριε
  choice: Ginoo
  rationale: Likas itong magalang na pantawag sa kausap at hindi nito ipinapalagay na kinikilala na ng babae si Jesus bilang Panginoon; inilagay sa talababa ang posibleng saling “Panginoon.”
- source_word: ἄντλημα
  choice: pansalok
  rationale: Tumutukoy ito sa kasangkapang ginagamit upang umigib o sumalok ng tubig. Mas tiyak dito ang “pansalok” kaysa sa “timba,” na maaaring magpahiwatig ng isang partikular na uri ng sisidlan.
- source_word: τὸ φρέαρ ἐστὶν βαθύ
  choice: malalim ang balon
  rationale: Tuwirang inilalarawan ng pangungusap ang lalim ng balon; hindi ito ikalawang bahagi ng isang salungat na negasyon.
- source_word: πόθεν οὖν ἔχεις
  choice: Kaya saan ninyo makukuha
  rationale: Ang “kaya” ay naghahayag ng konklusyon mula sa kawalan ng pansalok at lalim ng balon, samantalang ang “saan ... makukuha” ay likas na Tagalog para sa tanong tungkol sa pinagmumulan.
- source_word: τὸ ὕδωρ τὸ ζῶν
  choice: ang tubig na buhay
  rationale: 'Pinananatili ng literal ngunit nauunawaang parirala ang dobleng pahiwatig: maaari itong tumukoy sa sariwa o umaagos na tubig at maaari ring magkaroon ng mas malalim na kahulugan sa usapan.'
theological_decisions:
- issue: Ang kahulugan ng Κύριε sa magalang na pagtawag ng Samaritana kay Jesus
  choice: Ginoo
  alternative: Panginoon
  rationale: Sa yugtong ito ng pag-uusap, maaaring isa lamang itong magalang na pantawag. Ang “Ginoo” ay umiiwas sa maagang pagpapalagay tungkol sa pagkilala ng babae, habang itinatala sa talababa ang teolohikal na posibleng salin.
- issue: Ang dobleng kahulugan ng ὕδωρ τὸ ζῶν
  choice: tubig na buhay
  alternative: tubig na umaagos
  rationale: Pinananatili ng “tubig na buhay” ang matalinghagang lalim ng pahayag ni Jesus nang hindi inaalis ang karaniwang kahulugan nitong sariwa o umaagos na tubig, na siyang malamang na pagkaunawa ng babae.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang magalang na panghalip na “ninyo/kayong” na angkop sa pantawag na “Ginoo.” Iniwasan ang maling pagbasa sa οὔτε ... καί bilang “ni ... ni”; ang Griyego ay nagsasabing wala siyang pansalok at malalim ang balon.
