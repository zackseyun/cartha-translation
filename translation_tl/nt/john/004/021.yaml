  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: λέγει αὐτῇ ὁ Ἰησοῦς· ⸂Πίστευέ μοι, γύναι⸃, ὅτι ἔρχεται ὥρα ὅτε οὔτε ἐν τῷ ὄρει τούτῳ οὔτε ἐν Ἱεροσολύμοις προσκυνήσετε τῷ πατρί.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/021.yaml
  text: Jesus said to her[a], “Believe me, woman[c][b], an hour is coming when neither on this mountain nor in Jerusalem will you worship the Father.”
translation:
  language: tl
  text: Sinabi sa kanya ni Jesus, “Maniwala ka sa akin[a], ginang[b]. Darating ang oras[c] na sasambahin ninyo ang Ama, hindi sa bundok na ito ni sa Jerusalem.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Magtiwala ka sa akin.” Maaaring tumukoy ang pandiwang Griyego sa paniniwala sa sinasabi ng isang tao o sa pagtitiwala sa taong iyon.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “babae.” Magalang na pantawag ito sa kontekstong ito, hindi bastos.
    reason: cultural_note
  - marker: c
    text: Maaari ring unawain bilang “darating ang isang oras.” Walang pantukoy ang pangngalang Griyego rito, ngunit madalas gamitin ni Juan ang “oras” para sa isang mapagpasyang panahon sa layunin ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστευέ μοι
  choice: Maniwala ka sa akin
  rationale: Tuwirang hinihingi ni Jesus na paniwalaan ng babae ang sasabihin niya. Likas ito sa Filipino at pinananatili ang kaugnayan sa madalas na gamit ng πιστεύω sa Juan; maaari rin itong mangahulugang “Magtiwala ka sa akin.”
- source_word: γύναι
  choice: ginang
  rationale: Magalang na pantawag ang bokatibong γύναι sa kontekstong ito. Ang literal na “babae” ay madaling mapagkamalang bastos o malamig sa modernong Filipino, samantalang ang “ginang” ay natural na naghahatid ng magalang na tono nang hindi nagdaragdag ng lambing.
- source_word: ἔρχεται ὥρα
  choice: Darating ang oras
  rationale: Pinananatili ng “oras” ang mahalagang tematikong salita sa Ebanghelyo ni Juan. Hindi tahasang minamarkahan ng Filipino ang pagkakaiba ng “an hour” at “the hour,” kaya likas ang “ang oras” sa pariralang ito nang hindi kinakailangang lutasin ang tematikong katiyakan ng tinutukoy.
- source_word: ἐν τῷ ὄρει τούτῳ
  choice: sa bundok na ito
  rationale: Ang “sa” ang likas na pang-ukol sa Filipino para sa lugar ng pagsamba at sapat nitong ipinapahiwatig ang lokasyon sa bundok.
- source_word: ἐν Ἱεροσολύμοις
  choice: sa Jerusalem
  rationale: Ito ang karaniwang paraan sa Filipino ng pagtukoy sa isang lungsod bilang lokasyon.
- source_word: προσκυνήσετε
  choice: sasambahin ninyo
  rationale: Ang pandiwa ay nasa panghinaharap at pangmaramihang ikalawang panauhan. Ang “sasambahin” ang malinaw at nakaugaliang katumbas sa konteksto ng relihiyosong pagsamba sa Juan 4.
- source_word: τῷ πατρί
  choice: ang Ama
  rationale: Tumutukoy ito sa Diyos bilang Ama sa konteksto ni Juan; pinananatili ng malaking titik ang gamit bilang banal na titulo.
- source_word: οὔτε ... οὔτε
  choice: hindi ... ni
  rationale: Ang “hindi sa bundok na ito ni sa Jerusalem” ay natural na Filipino at pinananatili ang magkatambal na pagtanggi sa dalawang lokasyon.
theological_decisions:
- issue: Tono ng pantawag na γύναι
  choice: Isinalin bilang “ginang” at nilagyan ng paliwanag
  alternative: “babae”
  rationale: Magalang ang pantawag sa konteksto, ngunit ang literal na “babae” ay maaaring maghatid ng maling tonong bastos sa kasalukuyang Filipino. Ipinapaliwanag ng talababa ang literal na anyo at ang kontekstuwal na tono.
- issue: Tematikong gamit ng ὥρα sa Juan
  choice: Pinanatili ang “oras”
  alternative: “panahon”
  rationale: Hindi ginawang pangkalahatang “panahon” upang mapanatili ang paulit-ulit at teolohikal na mahalagang larawan ng “oras” sa Juan, nang hindi ipinapaliwanag sa mismong teksto kung ano ang tiyak na saklaw nito.
- issue: Saklaw ng pangmaramihang προσκυνήσετε
  choice: “sasambahin ninyo”
  alternative: “sasambahin mo”
  rationale: Pangmaramihan ang anyong Griyego, kaya hindi ito nilimitahan sa babaeng kausap ni Jesus lamang; maaaring saklawin nito ang kaniyang mga kababayan o mas malawak na pangkat.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at natural sa karaniwang mambabasa. Ginamit ang “ginang” upang maihatid ang magalang na puwersa ng bokatibo; pinanatili ang “oras,” “Ama,” at ang pangmaramihang “ninyo” dahil mahalaga ang mga ito sa anyo at diwa ng tekstong Griyego.
