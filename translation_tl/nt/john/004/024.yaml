  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πνεῦμα ὁ θεός, καὶ τοὺς προσκυνοῦντας αὐτὸν ἐν πνεύματι καὶ ἀληθείᾳ δεῖ προσκυνεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/024.yaml
  text: God is spirit[b][a], and those who worship him must worship in spirit and truth.
translation:
  language: tl
  text: Ang Diyos ay espiritu[b], at ang mga sumasamba sa kanya ay dapat sumamba sa espiritu at katotohanan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa Espiritu at katotohanan.” Maaaring unawain nang mas tiyak ang Griyego, ngunit pinananatili rito ang mas malawak na diwa ng parirala.
    reason: alternative_reading
  - marker: b
    text: Ang pahayag na “Ang Diyos ay espiritu” ay nagpapahayag ng kalikasan ng Diyos; hindi nito ibig sabihin na ang Diyos ay isa lamang espiritung kabilang sa iba pang mga espiritu.
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα
  choice: espiritu
  rationale: Ang πνεῦμα ay panaguring walang pantukoy na nauuna sa ὁ θεός; inilalarawan nito ang kalikasan ng Diyos, hindi siya itinuturing na isa lamang espiritung kabilang sa isang uri.
- source_word: ὁ θεός
  choice: ang Diyos
  rationale: Ang pantukoy sa Griyego ang nagtatakda sa θεός bilang simuno; ang “ang Diyos” ang likas at karaniwang katumbas sa Tagalog.
- source_word: τοὺς προσκυνοῦντας αὐτόν
  choice: ang mga sumasamba sa kanya
  rationale: Ang may-pantukoy na kasalukuyang pandiwaring Griyego ay tumutukoy sa mga mananamba bilang isang pangkat; natural sa modernong Tagalog ang pariralang ito.
- source_word: ἐν πνεύματι
  choice: sa espiritu
  rationale: Pinananatili ng maliit na titik at payak na anyo ang malawak na kahulugan ng parirala nang hindi agad nililimitahan ito sa tahasang pagtukoy sa Banal na Espiritu o sa pansariling katapatan lamang.
- source_word: ἀληθείᾳ
  choice: katotohanan
  rationale: Ang “katotohanan” ang pinakatuwirang katumbas at angkop sa gamit ni Juan, na maaaring magsangkot kapwa ng pagiging totoo at ng inihayag na realidad.
- source_word: δεῖ
  choice: dapat
  rationale: Ipinapahayag ng δεῖ ang pangangailangan o obligasyon; malinaw at natural sa Tagalog ang “dapat.”
- source_word: προσκυνεῖν
  choice: sumamba
  rationale: Ito ang likas na pandiwang Tagalog para sa pagsamba sa kontekstong ito, nang hindi labis na idinidiin ang pisikal na pagyukod na maaaring taglayin ng kasaysayan ng salita.
theological_decisions:
- issue: Kahulugan ng “Ang Diyos ay espiritu”
  choice: Pahayag ito tungkol sa kalikasan ng Diyos.
  alternative: Ang Diyos ay isang espiritu na kabilang sa iba pang mga espiritu.
  rationale: Ang ayos ng mga salita at kawalan ng pantukoy sa πνεῦμα ay pumapabor sa kwalitatibong panaguri. Kaya hindi ginamit ang “isang espiritu,” na maaaring magpahiwatig na ang Diyos ay isa lamang sa isang uri ng mga espiritung nilalang.
- issue: Kahulugan ng “sa espiritu at katotohanan”
  choice: Ang pagsamba ay dapat mailarawan ng espirituwal na realidad at katotohanan, habang pinananatili ang lawak ng Griyego.
  alternative: “sa Espiritu at katotohanan,” na tahasang tumutukoy sa Banal na Espiritu; o “nang taos-puso at tapat,” na nililimitahan ito sa sinseridad.
  rationale: Walang pantukoy ang πνεύματι at ἀληθείᾳ, at magkatambal ang mga ito. Pinananatili ng salin ang tunay na kalabuan at hindi ipinapasya nang higit sa sinasabi ng teksto kung tahasang Banal na Espiritu ang tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “kanya” ayon sa karaniwang makabagong baybay, at pinanatiling maliit ang titik ng “espiritu” sa pangunahing teksto upang huwag resolbahin ang interpretibong tensiyon.
