  text: Jesus answered and said to her[a], “Everyone who drinks from this water will be thirsty again.”
translation:
  language: tl
  text: Sumagot si Jesus at sinabi sa kanya, “Ang sinumang umiinom ng tubig na ito ay muling mauuhaw.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: Sumagot
  rationale: Karaniwang pandiwang pasalaysay para sa pagtugon; natural sa modernong Tagalog at tapat sa aspektong aorist sa konteksto.
- source_word: εἶπεν
  choice: sinabi
  rationale: Pinanatili ang ikalawang pandiwa sa pormulang ἀπεκρίθη ... καὶ εἶπεν sa halip na pagsamahin ang dalawang pandiwa.
- source_word: αὐτῇ
  choice: sa kanya
  rationale: Malinaw na tumutukoy sa babaeng Samaritana at natural na naghahayag ng di-tuwirang layon sa Tagalog.
- source_word: Πᾶς ὁ πίνων
  choice: Ang bawat umiinom
  rationale: Ipinahahayag ang pangkalahatan at patuloy o kinaugaliang diwa ng articular present participle nang hindi nililimitahan sa kasarian.
- source_word: ἐκ τοῦ ὕδατος τούτου
  choice: sa tubig na ito
  rationale: Sa Tagalog, ang “uminom sa tubig” ay likas na paraan upang tukuyin ang tubig na pinagmumulan ng iniinom; pinananatili ng “na ito” ang demonstratibong diin.
- source_word: διψήσει πάλιν
  choice: muling mauuhaw
  rationale: Ang “mauuhaw” ay natural na katumbas ng pandiwang μέλλουσα διψήσει, at malinaw na ipinahahayag ng “muli” ang pag-uulit na nasa πάλιν.
theological_decisions:
- issue: Pagpapanatili sa dobleng pormula ng pagsasalita na ἀπεκρίθη ... καὶ εἶπεν
  choice: “Sumagot ... at sinabi”
  alternative: Pinaikling “sumagot” lamang o “sinabi” lamang
  rationale: Kapuwa tahasang naroon ang dalawang pandiwa sa Griyego. Ang pagpapanatili sa mga ito ay nag-iingat sa tekstura ng salaysay ni Juan nang hindi binabago ang kahulugan.
- issue: Pangkalahatang panlalaking anyo ng Πᾶς ὁ πίνων
  choice: “Ang bawat umiinom”
  alternative: “Ang bawat lalaking umiinom” o “Ang sinumang umiinom”
  rationale: Panlahat at hindi tiyak sa lalaki ang konstruksyon; tumpak na sinasaklaw ng “bawat” ang lahat ng umiinom.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang bahagyang pormal na dobleng pormula ng pagsagot at pagsasalita dahil tahasan itong nasa Griyego. Walang talababa sapagkat ang “muling mauuhaw” ay kapuwa natural at malapit sa anyong pandiwa ng orihinal; hindi na kailangan ang alternatibong nasa konsultasyong Ingles.
