  text: Ἔρχεται γυνὴ ἐκ τῆς Σαμαρείας ἀντλῆσαι ὕδωρ. λέγει αὐτῇ ὁ Ἰησοῦς· Δός μοι πεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/007.yaml
  text: A woman from Samaria came to draw water. Jesus said to her[a], “Give me a drink.”
translation:
  language: tl
  text: Dumating ang isang babae mula sa Samaria upang umigib ng tubig. Sinabi sa kanya ni Jesus[a], “Bigyan mo ako ng maiinom.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “Dumarating … sinasabi”; gumagamit ang Griyego ng makasaysayang pangkasalukuyan sa salaysay.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔρχεται
  choice: Dumating
  rationale: Makasaysayang pangkasalukuyan ang anyong Griyego sa salaysay; higit na natural sa modernong Tagalog ang pangnagdaan habang pinananatili ang takbo ng pangyayari.
- source_word: γυνὴ
  choice: isang babae
  rationale: Tumutukoy ito sa isang babaeng hindi pa ipinakikilala, hindi partikular sa isang asawa.
- source_word: ἐκ τῆς Σαμαρείας
  choice: mula sa Samaria
  rationale: Tuwirang pinananatili ang pook na pinagmulan nang hindi idinaragdag sa mismong talata ang katawagang etniko o panrelihiyon.
- source_word: ἀντλῆσαι ὕδωρ
  choice: upang umigib ng tubig
  rationale: Ipinapahayag ng pawatas ang layunin; ang “umigib ng tubig” ang natural at tiyak na katumbas sa konteksto ng balon.
- source_word: λέγει αὐτῇ
  choice: Sinabi sa kanya
  rationale: Gaya ng ἔρχεται, makasaysayang pangkasalukuyan ito; natural sa salaysay na Tagalog ang pangnagdaan.
- source_word: Δός μοι πεῖν
  choice: Bigyan mo ako ng maiinom
  rationale: Natural na pakiusap ito sa modernong Tagalog at malinaw na ipinahihiwatig na tubig ang hinihinging maiinom.
theological_decisions:
- issue: Tinutukoy ng “Samaria”
  choice: “isang babae mula sa Samaria”
  alternative: “isang babaeng Samaritana” o “isang babae mula sa lungsod ng Samaria”
  rationale: Ang Griyego sa talatang ito ay nagsasabing mula siya sa Samaria; hindi nito tahasang ginagamit dito ang katawagang “Samaritana” ni nililimitahan ang tinutukoy sa lungsod. Pinananatili ng salin ang mismong pahayag at ang maaaring saklaw nito.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “umigib” bilang karaniwang salita para sa pagkuha ng tubig sa balon at ang “mai­inom” bilang idiomatikong pagpapahayag ng hinihinging tubig.
