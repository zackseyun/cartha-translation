  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τῇ τε γυναικὶ ἔλεγον ὅτι Οὐκέτι διὰ τὴν σὴν λαλιὰν πιστεύομεν· αὐτοὶ γὰρ ἀκηκόαμεν, καὶ οἴδαμεν ὅτι οὗτός ἐστιν ἀληθῶς ὁ σωτὴρ τοῦ ⸀κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/042.yaml
  text: And they were saying to the woman[a], “We no longer believe because of your word, for we ourselves have heard[b], and we know that this one truly is the Savior of the world.”
translation:
  language: tl
  text: At sinabi nila sa babae, “Hindi na dahil sa sinabi mo kaya kami sumasampalataya, sapagkat kami mismo ang nakarinig, at alam naming siya nga ang tunay na Tagapagligtas ng mundo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ τε γυναικὶ ἔλεγον
  choice: At sinabi nila sa babae
  rationale: Ang babae ang di-tuwirang layon ng pagsasalita. Bagaman imperfect ang ἔλεγον, ang payak na “sinabi nila” ang natural na pagsasalaysay sa modernong Tagalog; hindi kailangang ipilit ang tuloy-tuloy na aspekto rito.
- source_word: Οὐκέτι διὰ τὴν σὴν λαλιὰν πιστεύομεν
  choice: Hindi na dahil sa sinabi mo kaya kami sumasampalataya
  rationale: Ipinapahayag ng οὐκέτι ang paghinto ng dating batayan, at ng διά na may accusative ang dahilan. Ang “sinabi mo” ay natural na katumbas ng λαλιά at tumutukoy sa pasalitang patotoo ng babae.
- source_word: αὐτοὶ γὰρ ἀκηκόαμεν
  choice: sapagkat kami mismo ang nakarinig
  rationale: Pinananatili ng “kami mismo” ang diin ng αὐτοί at ang kaibahan ng personal na pagkarinig sa patotoong narinig lamang sa babae. Sa Tagalog, natural na maipahayag ang perpektong kilos ng ἀκηκόαμεν sa aspektong naganap na “nakarinig.”
- source_word: καὶ οἴδαμεν
  choice: at alam namin
  rationale: Ang οἴδαμεν ay pandiwang stative na may kasalukuyang kahulugang “alam namin.”
- source_word: οὗτός ἐστιν ἀληθῶς
  choice: siya nga ang tunay na
  rationale: Ang “siya nga” ay natural na Tagalog na nagpapanatili sa mariing demonstratibong puwersa ng οὗτος, habang ang “tunay na” ay naghahatid sa solemneng pagpapatibay ng ἀληθῶς.
- source_word: ὁ σωτὴρ τοῦ κόσμου
  choice: Tagapagligtas ng mundo
  rationale: Ang “Tagapagligtas” ang malinaw at kinikilalang katumbas ng σωτήρ. Ang “mundo” ay tuwirang salin ng κόσμος nang hindi dinaragdagan ng “buong” o nililimitahan ang saklaw nito.
theological_decisions:
- issue: Saklaw ng pahayag ng mga Samaritano
  choice: Tagapagligtas ng mundo
  alternative: Tagapagligtas ng lahat ng tao
  rationale: Pinananatili ang malawak ngunit hindi pinalawak na pahayag ng κόσμος. Hindi idinaragdag ang paliwanag na “lahat ng tao,” at hindi rin nililimitahan ang saklaw ayon sa isang doktrinal na sistema.
- issue: Diin ng pagkakakilanlan kay Jesus
  choice: siya nga ang tunay na Tagapagligtas
  alternative: ang taong ito talaga ang Tagapagligtas
  rationale: Inihahatid ng “siya nga” ang diin ng οὗτος nang hindi nagdaragdag ng tahasang “tao,” na wala sa Griyego; pinananatili rin ang pagpapatibay ng ἀληθῶς.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “sumasampalataya” upang mapanatili ang kontekstong panrelihiyon ng πιστεύομεν, at iniwasan ang sobrang literal na ayos na magiging asiwa sa karaniwang Tagalog.
