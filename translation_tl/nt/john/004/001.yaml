  text: Ὡς οὖν ἔγνω ὁ ⸀Ἰησοῦς ὅτι ἤκουσαν οἱ Φαρισαῖοι ὅτι Ἰησοῦς πλείονας μαθητὰς ποιεῖ καὶ βαπτίζει ἢ Ἰωάννης—
base_translation:
  language: en
  yaml_path: translation/nt/john/004/001.yaml
  text: Therefore[a], when Jesus knew that the Pharisees had heard that Jesus was making and baptizing more disciples than John—
translation:
  language: tl
  text: Kaya, nang malaman ni Jesus na nabalitaan ng mga Pariseo na si Jesus ay gumagawa at nagbabautismo ng mas maraming alagad kaysa kay Juan[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring unawain: “si Jesus ay gumagawa ng mas maraming alagad at nagbabautismo nang higit kaysa kay Juan.” Sa Griyego, maaaring ang paghahambing ay tumutukoy sa pinagsamang gawain ng paggawa ng mga alagad at pagbautismo, sa halip na sa dami lamang ng mga alagad.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς οὖν
  choice: Kaya nang
  rationale: Pinananatili ng “nang” ang panahong diwa ng ὡς at ng “kaya” ang paghihinuha o pagpapatuloy na ipinahihiwatig ng οὖν.
- source_word: ἔγνω
  choice: malaman
  rationale: Likas na ipinapahayag sa Filipino ang pagkatanto o pagkabatid ni Jesus sa puntong ito ng salaysay.
- source_word: οἱ Φαρισαῖοι
  choice: mga Pariseo
  rationale: Karaniwan at malinaw na katawagan sa Filipino para sa pangkat na ito.
- source_word: ἤκουσαν
  choice: nabalitaan
  rationale: Sa konteksto, tumutukoy ito sa pagkarinig ng isang ulat; malinaw rin nitong ipinapakita na nauna na itong narinig ng mga Pariseo.
- source_word: πλείονας μαθητὰς
  choice: mas maraming alagad
  rationale: Tuwirang ipinapahayag ang paghahambing sa bilang ng mga alagad.
- source_word: ποιεῖ
  choice: ginagawa
  rationale: Pinananatili ang karaniwang idyomang “gumawa ng mga alagad” nang hindi ito pinapalitan ng mas malayang “humihikayat” o “nagkakamit.”
- source_word: βαπτίζει
  choice: binabautismuhan
  rationale: Ang “bautismuhan” ang malinaw at kinikilalang salin ng βαπτίζω sa salaysay ng Bagong Tipan.
- source_word: ἢ Ἰωάννης
  choice: kaysa kay Juan
  rationale: Natural na anyo sa Filipino ng paghahambing sa gawain ni Jesus at ni Juan.
theological_decisions:
- issue: Maaaring ipahiwatig ng talata na si Jesus mismo ang nagbabautismo
  choice: Pinanatili ang tahasang pagkakaugnay ng pagbautismo kay Jesus sa talatang ito.
  alternative: Sabihing ang mga kasama o mga alagad ni Jesus ang nagbabautismo, bilang pag-una sa paglilinaw ng Juan 4:2.
  rationale: Ang kasunod na talata ang nagbibigay ng paglilinaw na hindi si Jesus mismo kundi ang kanyang mga alagad ang nagbabautismo. Hindi dapat ipasok nang maaga ang paglilinaw na iyon sa tekstong ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nabalitaan” sa halip na literal na “narinig” dahil isang ulat ang tinutukoy. Inilagay ang talababa sa dulo ng pariralang pinaghahambing upang maging malinaw kung saan naroon ang posibleng alternatibong pagbasa.
