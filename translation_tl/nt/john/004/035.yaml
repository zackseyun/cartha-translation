source:
  edition: SBLGNT
  text: οὐχ ὑμεῖς λέγετε ὅτι Ἔτι τετράμηνός ἐστιν καὶ ὁ θερισμὸς ἔρχεται; ἰδοὺ λέγω ὑμῖν, ἐπάρατε τοὺς ὀφθαλμοὺς ὑμῶν καὶ θεάσασθε τὰς χώρας ὅτι λευκαί εἰσιν πρὸς θερισμόν· ἤδη
base_translation:
  language: en
  yaml_path: translation/nt/john/004/035.yaml
  text: 'Do you not say[a], ‘There are still four months, and then the harvest comes’? Look, I tell you: lift up your eyes and see the fields, that they are white for harvest already.'
translation:
  language: tl
  text: 'Hindi ba ninyo sinasabi, ‘Apat na buwan pa bago dumating ang anihan’? Tingnan ninyo, sinasabi ko sa inyo: Itaas ninyo ang inyong mga mata at masdan ninyo ang mga bukid, sapagkat mapuputi na ang mga ito para sa anihan.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “handa na para sa anihan.” Literal na “mapuputi na ang mga ito para sa anihan.” Pinananatili ng “mapuputi” ang biswal na larawan ng Griyego, na maaaring magpahiwatig ng kahandaan sa pag-aani.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ὑμεῖς λέγετε
  choice: Hindi ba sinasabi ninyo
  rationale: Natural na anyo ng negatibong tanong sa Tagalog; naipahihiwatig ng “ninyo” ang tahasang ὑμεῖς nang hindi labis ang diin.
- source_word: Ἔτι τετράμηνός ἐστιν καὶ ὁ θερισμὸς ἔρχεται
  choice: Apat na buwan pa bago dumating ang anihan
  rationale: Idyomatikong ipinapahayag ang natitirang pagitan ng panahon hanggang sa pagdating ng anihan.
- source_word: ἰδοὺ λέγω ὑμῖν
  choice: Tingnan ninyo, sinasabi ko sa inyo
  rationale: Pinananatili ang pantawag-pansin ng ἰδοὺ at ang tahasang pahayag ni Jesus sa makabagong, dignified na Tagalog.
- source_word: ἐπάρατε τοὺς ὀφθαλμοὺς ὑμῶν
  choice: Itaas ninyo ang inyong mga mata
  rationale: Pinananatili ang matingkad na idyoma ng Griyego sa halip na patagin lamang bilang “tumingala.”
- source_word: θεάσασθε τὰς χώρας
  choice: masdan ang mga bukid
  rationale: Ang “masdan” ay nagpapahiwatig ng sadyang pagmamasid, at ang “mga bukid” ang likas na kahulugan ng χώρας sa konteksto ng anihan.
- source_word: λευκαί εἰσιν πρὸς θερισμόν· ἤδη
  choice: mapuputi na ang mga ito at maaari nang anihin
  rationale: Pinananatili ng “mapuputi” ang biswal na larawan ng λευκαί, habang natural na ipinahahayag ng “maaari nang anihin” ang kahandaan para sa pag-aani at ang diin ng ἤδη.
theological_decisions:
- issue: Kung gagawing tahasan sa salin ang espirituwal na tinutukoy ng anihan
  choice: Panatilihin ang larawang pang-agrikultura sa pangunahing teksto.
  alternative: Isaling tuwiran bilang handa na ang mga tao upang tipunin o ilapit sa Diyos.
  rationale: Bagaman may metaporikal na diwa sa konteksto, bukid at anihan ang mismong larawan ng Griyego; hindi dapat ipalit sa salin ang interpretasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino Tagalog. Ginamit ang “anihan” at “mga bukid” bilang karaniwang bokabularyong pang-agrikultura; pinanatili ang biswal na idyoma ng pagtataas ng mga mata at ang kulay na “mapuputi.”
