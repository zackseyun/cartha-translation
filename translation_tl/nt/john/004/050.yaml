base_translation:
  language: en
  yaml_path: translation/nt/john/004/050.yaml
  text: Jesus said to him[a], “Go; your son lives.” The man believed the word that Jesus spoke to him and went on his way.
translation:
  language: tl
  text: Sinabi sa kanya ni Jesus, “Humayo ka; buhay ang anak mong lalaki.” Naniwala[a] ang lalaki sa salitang sinabi sa kanya ni Jesus, at nagpatuloy siya sa kanyang paglalakbay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, Nagtiwala ang lalaki sa salitang sinabi sa kanya ni Jesus.
    reason: Ipinahihintulot ng πιστεύω na may datibong layon ang diwang “magtiwala,” bagaman “naniwala” ang tuwirang salin sa pangunahing teksto.
lexical_decisions:
- source_word: Πορεύου
  choice: Humayo ka
  rationale: Tuwirang utos itong umalis at magpatuloy sa pupuntahan. Pinananatili ng “Humayo ka” ang maikli at mariing anyo ng Griyego nang hindi idinaragdag na tahasang umuwi siya.
- source_word: ὁ υἱός σου
  choice: ang anak mong lalaki
  rationale: Partikular na “anak na lalaki” ang υἱός. Ginawang malinaw ang kasarian sapagkat hindi ito likas na ipinahihiwatig ng salitang Tagalog na “anak.”
- source_word: ζῇ
  choice: buhay
  rationale: Pangkasalukuyang pagpapahayag ito na ang anak ay buhay, hindi pangakong mabubuhay lamang siya sa hinaharap. Likas at mariin sa Tagalog ang “buhay.”
- source_word: ἐπίστευσεν
  choice: Pinaniwalaan
  rationale: Dahil sinusundan ito ng datibong τῷ λόγῳ, ang diwa ay naniwala ang lalaki sa sinabi. Pinananatili nito ang kaugnayan sa πιστεύω nang hindi nagpapasya kung anong antas o uri ng pananampalataya ang inilalarawan.
- source_word: ὁ ἄνθρωπος
  choice: ang lalaki
  rationale: “Ang lalaki” ang tahasang tawag sa kanya sa talatang ito. Hindi ipinasok sa teksto ang naunang pagkakakilanlan niya bilang opisyal.
- source_word: τῷ λόγῳ
  choice: ang salitang
  rationale: Tumutukoy ang λόγος sa binigkas na pahayag ni Jesus. Nililinaw ng kasunod na sugnay kung aling salita ang tinutukoy.
- source_word: ὃν εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: sinabi sa kanya ni Jesus
  rationale: Likas na Tagalog itong panuring sa “salita” at malinaw na pinananatili ang nagsalita at ang kinausap.
- source_word: ἐπορεύετο
  choice: umalis siya
  rationale: Ipinakikita nitong tumalima ang lalaki at nagsimula o nagpatuloy sa paglalakbay. Ang payak na “umalis siya” ay natural sa Tagalog at hindi labis na pinaiigting ang aspektong imperpekto.
theological_decisions:
- issue: Ang kahulugan ng πιστεύω bilang tugon sa pangako ni Jesus
  choice: Pinaniwalaan
  alternative: Nagtiwala
  rationale: Inilalarawan ng talata ang pagtanggap ng lalaki sa sinabi ni Jesus ngunit hindi nito tahasang nilulutas kung ito ay ganap na pananampalatayang nagliligtas o pagtitiwala lamang sa partikular na pangako. Kaya pinananatili ng salin ang tensiyong iyon.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “Humayo ka” upang mapanatili ang maigsi at mariing utos; malinaw pa rin ito sa karaniwang mambabasa. Iniwasan ang “Umuwi ka” dahil bagaman iyon ang ipinahihiwatig ng konteksto, hindi tahasang binanggit sa pandiwang Griyego ang destinasyon.
