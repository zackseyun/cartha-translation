  source_fidelity: 'Tumpak ang salin sa Griyegong diwa: ang kondisyonal na “Kung alam mo ... hihingi ka sana ... bibigyan ka sana niya” ay natural na naghahayag ng di-naganap na kondisyong ipinapakita ng εἰ at ἄν. Ang “Painumin mo ako” ay idiomatikong katumbas ng “Give me a drink.” Ang pagpapasimple ng “sumagot at sinabi” tungo sa “Sumagot” ay katanggap-tanggap sa natural na Tagalog at hindi nag-aalis ng mahalagang kahulugan.'
