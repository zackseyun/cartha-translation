id: JHN.4.10
reference: John 4:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῇ· Εἰ ᾔδεις τὴν δωρεὰν τοῦ θεοῦ καὶ τίς ἐστιν ὁ λέγων σοι· Δός μοι πεῖν, σὺ ἂν ᾔτησας αὐτὸν καὶ ἔδωκεν ἄν σοι ὕδωρ ζῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/010.yaml
  text: Jesus answered and said to her[a], “If you knew the gift of God, and who it is who says to you, ‘Give me a drink,’ you would have asked him, and he would have given you living water.”
translation:
  language: tl
  text: Sumagot si Jesus sa kanya, “Kung alam mo ang kaloob ng Diyos at kung sino ang nagsasabi sa iyo, ‘Painumin mo ako,’ hihingi ka sana sa kanya, at bibigyan ka sana niya ng tubig na buhay[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tubig na umaagos” o “sariwang tubig.” Ang parirala ay maaaring tumukoy sa umaagos na tubig, ngunit pinananatili ng “tubig na buhay” ang dobleng kahulugan dito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῇ
  choice: Sumagot si Jesus sa kanya
  rationale: Ang natural na salaysay sa modernong Tagalog ay hindi kailangang ulitin nang literal ang Semitikong dobleng pormulang “sumagot at sinabi”; sapat ang “sumagot” upang maipahayag ang tugon at pagpapakilala sa sinabi.
- source_word: τὴν δωρεὰν τοῦ θεοῦ
  choice: ang kaloob ng Diyos
  rationale: Ang “kaloob” ay dignified at karaniwang salitang Tagalog para sa isang bagay na ibinigay nang walang bayad; pinananatili rin ng “ng Diyos” ang payak na genitive ng Griyego.
- source_word: τίς ἐστιν ὁ λέγων σοι
  choice: kung sino ang nagsasabi sa iyo
  rationale: Natural itong Tagalog at pinananatili ang diin sa pagkakakilanlan ng taong kasalukuyang nakikipag-usap sa babae.
- source_word: Δός μοι πεῖν
  choice: Painumin mo ako
  rationale: Ito ang maikli at idiomatikong katumbas sa Tagalog ng utos na bigyan ang nagsasalita ng maiinom, nang hindi nagdaragdag ng bagay na wala sa Griyego.
- source_word: σὺ ἂν ᾔτησας αὐτόν
  choice: hihingi ka sana sa kanya
  rationale: Ipinahahayag ng “sana” ang di-naganap na bunga ng kondisyon; ang “hihingi” ay likas na anyo sa Tagalog sa ganitong pangungusap.
- source_word: ἔδωκεν ἄν σοι
  choice: bibigyan ka sana niya
  rationale: Pinananatili ng “sana” ang counterfactual na diwa ng ἄν at malinaw na ipinakikita na siya ang magbibigay sa babae.
- source_word: ὕδωρ ζῶν
  choice: tubig na buhay
  rationale: Pinananatili nito ang literal na anyo at ang mas malalim na simbolikong pahiwatig, habang inilalagay sa talababa ang karaniwang kahulugang tubig na umaagos o sariwang tubig.
theological_decisions:
- issue: Sabay na literal at simbolikong puwersa ng ὕδωρ ζῶν
  choice: tubig na buhay
  alternative: tubig na umaagos; sariwang tubig
  rationale: Sinasadya ng konteksto ang tensiyon sa pagitan ng pisikal na tubig at ng mas malalim na espirituwal na kahulugan. Hindi dapat alisin ng salin ang alinman sa dalawang antas.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “kaloob” sa halip na mas kolokyal na “regalo,” at pinasimple ang Griyegong dobleng pormula ng pagsasalita upang maiwasan ang saling kahoy. Ang panandang talababa [a] ay inilagay kaagad pagkatapos ng pariralang tinatalakay.
