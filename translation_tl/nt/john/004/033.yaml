  text: So the disciples were saying to one another[a], “Has anyone brought him something to eat?”
translation:
  language: tl
  text: Kaya nag-uusap-usap ang mga alagad, “Wala naman sigurong nagdala sa kanya ng makakain?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “May nagdala kaya sa kanya ng makakain?” Ang tanong sa Griyego na may μή ay umaasang ang sagot ay hindi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: patuloy na nagtatanungan
  rationale: Ipinahihiwatig ng imperpektong aspekto ang nagpapatuloy na pag-uusap; dahil πρὸς ἀλλήλους ang kasunod, likas sa Tagalog ang ‘nagtatanungan.’
- source_word: οὖν
  choice: Kaya
  rationale: Iniuugnay nito ang reaksiyon ng mga alagad sa naunang sinabi ni Jesus at natural itong panandang pasalaysay sa modernong Tagalog.
- source_word: οἱ μαθηταὶ
  choice: ang mga alagad
  rationale: Ang ‘mga alagad’ ang karaniwan at tiyak na salin ng μαθηταί sa konteksto ng Ebanghelyo.
- source_word: πρὸς ἀλλήλους
  choice: nagtatanungan
  rationale: Isinama sa pandiwa ang gantihang pag-uusap na literal na ‘sa isa’t isa,’ upang maging natural at hindi paulit-ulit sa Tagalog.
- source_word: Μή τις
  choice: May ... kaya
  rationale: Ang μή ay nagpapahiwatig na inaasahan ng nagsasalita ang sagot na hindi; naipahihiwatig ng ‘kaya’ ang kanilang pag-aalinlangan nang hindi ginagawang tiyak ang tanong.
- source_word: ἤνεγκεν αὐτῷ
  choice: nagdala ... sa kanya
  rationale: Tuwirang ipinapahayag ang kilos ng pagdadala at ang di-tuwirang layon na si Jesus.
- source_word: φαγεῖν
  choice: ng makakain
  rationale: Natural na Tagalog ito para sa isang bagay na maaaring kainin, na siyang ipinahihiwatig ng infinitibong φαγεῖν sa konteksto.
