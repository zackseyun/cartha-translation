  text: ἐν γὰρ τούτῳ ὁ λόγος ⸀ἐστὶν ἀληθινὸς ὅτι Ἄλλος ἐστὶν ὁ σπείρων καὶ ἄλλος ὁ θερίζων·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/037.yaml
  text: 'For in this the saying is true: one is the one sowing[c][b][a], and another the one reaping.'
translation:
  language: tl
  text: 'Sapagkat sa bagay na ito, totoo ang kasabihan: “Iba ang naghahasik at iba ang umaani.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Magkaiba ang manghahasik at ang mang-aani.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν γὰρ τούτῳ
  choice: Sapagkat dito
  rationale: Pinananatili ng “sapagkat” ang paliwanag na ugnayan sa naunang pahayag, at ng “dito” ang demonstratibong pagtukoy sa kalagayang inilalarawan ni Jesus.
- source_word: ὁ λόγος
  choice: ang kasabihang ito
  rationale: Sa konteksto, ang λόγος ay isang kinikilalang pahayag o kawikaan, hindi ang teolohikal na titulong “Salita.” Likas sa modernong Tagalog ang “kasabihan” para sa ganitong pahayag.
- source_word: ἀληθινός
  choice: totoo
  rationale: Tumutukoy ito sa pagiging balido o mapatutunayan ng kasabihan; “totoo” ang pinakanatural na katumbas.
- source_word: ὅτι
  choice: ':'
  rationale: Ipinakikilala nito ang nilalaman ng kasabihan; malinaw at natural itong naihahayag sa pamamagitan ng tutuldok at panipi.
- source_word: ἄλλος ... καὶ ἄλλος
  choice: Iba ... at iba
  rationale: Maikli at likas na ipinapakita nito na magkaibang tao o pangkat ang gumagawa ng dalawang gawain, nang hindi sila tinutukoy nang higit sa sinasabi ng Griyego.
- source_word: ὁ σπείρων
  choice: ang naghahasik
  rationale: Ang substantibong kasalukuyang participle ay naihahayag bilang taong gumagawa ng paghahasik; pinananatili ng “naghahasik” ang kilos at ang paralelismo.
- source_word: ὁ θερίζων
  choice: ang umaani
  rationale: Ang substantibong kasalukuyang participle ay natural na naihahayag sa Tagalog bilang “ang umaani,” kasabay at kapantay ng “ang naghahasik.”
theological_decisions:
- issue: Pagkakakilanlan ng naghahasik at umaani
  choice: Iniwan ang kasabihan bilang pangkalahatang pahayag at hindi pinangalanan sa talata ang mga tinutukoy.
  alternative: Tukuyin sa salin ang naghahasik bilang mga propeta, si Juan Bautista, o si Jesus, at ang umaani bilang mga alagad.
  rationale: Hindi mismo kinikilala ng Griyegong talata ang mga tauhan. Ang tiyak na paglalapat ay nagmumula sa konteksto, kaya hindi ito dapat ipasok bilang bahagi ng salin.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang karaniwang bokabularyong pang-agrikultura at pinanatili ang maikli at kawikaang anyo ng pahayag.
