  naturalness: Natural ang karamihan ng salin, ngunit mas idiomatiko at malinaw ang “noong ikapitong oras” kaysa “nang ikapitong oras” sa pagtukoy ng oras sa nakaraang araw. Ang “Sinabi naman nila” ay natural ding naghahatid ng pag-usad ng salaysay na minamarkahan ng οὖν.
  terminology: Ang “ikapitong oras” ay wastong pinananatili at hindi kino-convert sa makabagong oras. Ang talababa ay dapat magbigay ng sapat na pahiwatig na may isa pang posibleng sistema ng pagbilang, nang hindi ipinipilit ang alinman.
