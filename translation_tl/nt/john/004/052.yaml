  yaml_path: translation/nt/john/004/052.yaml
  text: So he asked them the hour in which he got better. Then they said to him[a], “Yesterday at the seventh hour the fever left him.”
translation:
  language: tl
  text: Kaya tinanong niya sila kung anong oras bumuti ang kanyang anak. Sinabi naman nila sa kanya, “Kahapon, noong ikapitong oras[a], nawala ang lagnat niya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring tumukoy sa bandang ala-una ng hapon kung binibilang ang oras mula sa pagsikat ng araw. Iniisip naman ng ilan na ibang sistema ng pagbilang ng oras ang ginagamit ni Juan, kung kaya maaari itong tumukoy sa ibang oras, gaya ng bandang alas-siyete ng gabi.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπύθετο οὖν
  choice: Kaya tinanong niya
  rationale: Ang ἐπύθετο ay nangangahulugang nagtanong o nag-usisa, at ang οὖν ay nag-uugnay sa salaysay sa naunang pangyayari. Natural sa modernong Tagalog ang “Kaya tinanong niya.”
- source_word: τὴν ὥραν παρ’ αὐτῶν
  choice: sila kung anong oras
  rationale: Bagaman literal na may diwang “ang oras mula sa kanila,” ang karaniwang ayos sa Tagalog ay “tinanong niya sila kung anong oras.”
- source_word: ἐν ᾗ κομψότερον ἔσχεν
  choice: nagsimulang bumuti ang kalagayan ng anak niya
  rationale: Ang idyomang κομψότερον ἔσχεν ay tumutukoy sa pagbuti ng kalagayang pangkalusugan. Ipinahihiwatig ng pagtukoy sa eksaktong oras ang pagsisimula ng pagbuti. Nilinaw ang anak bilang tinutukoy ng nakaraang konteksto, sapagkat magiging malabo sa Tagalog ang dalawang sunod na “niya.”
- source_word: εἶπαν οὖν αὐτῷ
  choice: Sinabi nila sa kanya
  rationale: Natural na salaysay sa Tagalog; hindi kailangang ulitin ang οὖν bilang hiwalay na pang-ugnay dahil naipapakita na ng pagkakasunod ng mga pangungusap ang pag-usad ng salaysay.
- source_word: Ἐχθὲς ὥραν ἑβδόμην
  choice: Kahapon, nang ikapitong oras
  rationale: Pinananatili ang sinaunang pagtukoy sa oras at hindi ito ginagawang modernong oras upang hindi lutasin ang hindi tiyak na sistema ng pagbilang.
- source_word: ἀφῆκεν αὐτὸν ὁ πυρετός
  choice: nawala ang lagnat niya
  rationale: Ang literal na “iniwan siya ng lagnat” ay maiintindihan ngunit hindi kasing-natural sa Tagalog. Ang “nawala ang lagnat niya” ay malinaw at tapat sa kahulugang humupa o lumisan ang lagnat.
theological_decisions:
- issue: Sistema ng pagbilang sa “ikapitong oras”
  choice: Panatilihin ang “ikapitong oras” sa pangunahing teksto.
  alternative: Gawing bandang ala-una ng hapon kung bibilang mula sa pagsikat ng araw; may ibang pagkaunawa rin sa sistema ng oras ni Juan.
  rationale: Hindi tinutukoy ng talata kung anong sistema ng pagbilang ng oras ang ginagamit. Ang literal na anyo ay nagpapanatili sa tunay na kalabuan ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “kalagayan” upang malinaw na tumukoy sa pagbuti ng anak, at pinanatili ang “ikapitong oras” kasama ng talababa upang hindi sapilitang pumili ng isang sinaunang sistema ng oras.
