revisions:
- from: Kaya tinanong niya sila kung anong oras nagsimulang bumuti ang kalagayan ng anak niya. Sinabi nila sa kanya, “Kahapon, nang ikapitong oras[a], nawala ang lagnat niya.”
  to: Kaya tinanong niya sila kung anong oras bumuti ang kanyang anak. Sinabi naman nila sa kanya, “Kahapon, noong ikapitong oras[a], nawala ang lagnat niya.”
  rationale: Inalis ang idinagdag na “nagsimulang” upang hindi higitan ang ipinahihiwatig ng Griyego, at pinalitan ang pantukoy sa oras ng mas natural na “noong.” Idinagdag ang “naman” upang bahagyang maipakita ang pag-usad ng οὖν. Pinanatili ang literal na “ikapitong oras” at nilinaw ng talababa ang mga posibleng paraan ng pagbilang nang hindi nagpapasya para sa teksto.
