base_translation:
  language: en
  yaml_path: translation/nt/john/004/049.yaml
  text: The royal official said to him[a], “Lord, come down before my child dies.”
translation:
  language: tl
  text: Sinabi ng opisyal ng hari sa kanya, “Panginoon[a], bumaba po kayo bago mamatay ang anak ko.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ginoo.” Ang salitang Griego na κύριε ay isang magalang na pantawag na maaari ring mangahulugang “Panginoon.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ βασιλικός
  choice: opisyal ng hari
  rationale: Tumutukoy ang substantibong βασιλικός sa isang taong kaugnay ng hari o ng maharlikang sambahayan. Malinaw at likas sa modernong Filipino ang “opisyal ng hari,” at hindi nito ipinapalagay na kabilang siya sa uring maharlika.
- source_word: Κύριε
  choice: Panginoon
  rationale: Maaaring magpahiwatig ang κύριε ng magalang na pagtawag na gaya ng “Ginoo,” ngunit sa Juan ay maaari rin itong magkaroon ng mas malalim na diwa. Pinananatili ng “Panginoon” ang ganitong posibilidad, habang inilalahad sa talababa ang alternatibo.
- source_word: κατάβηθι
  choice: bumaba po kayo
  rationale: Ang pautos na κατάβηθι ay literal na “bumaba ka.” Ang “bumaba po kayo” ay nagpapanatili sa topograpikal na diwa at natural na nagpapahayag ng magalang at apurahang pakiusap sa Filipino.
- source_word: πρὶν ἀποθανεῖν
  choice: bago mamatay
  rationale: Ipinahahayag ng πρίν na may pawatas ang panahong nauuna sa isang pangyayari. Natural itong isalin sa Filipino bilang “bago mamatay,” na ang simuno ay malinaw mula sa kasunod na parirala.
- source_word: τὸ παιδίον μου
  choice: ang anak ko
  rationale: Ang παιδίον ay bata o munting anak. Mas natural sa bibig ng isang magulang ang “anak ko” kaysa “bata ko,” at hindi nito labis na itinatakda ang kasarian sa talatang ito.
- source_word: λέγει πρὸς αὐτόν
  choice: Sinabi sa kanya
  rationale: Bagaman historical present ang λέγει, karaniwang past tense ang natural na salaysay sa Filipino. Tumpak na ipinakikilala ng “Sinabi sa kanya” ang direktang pananalita.
theological_decisions:
- issue: Pag-render sa κύριε bilang pantawag kay Jesus
  choice: Panginoon
  alternative: Ginoo
  rationale: Maaaring simpleng magalang na pantawag ang salita sa agarang konteksto, ngunit maaari rin itong magtaglay ng mas malalim na pahiwatig sa Ebanghelyo ni Juan. Hindi nilulutas ng pangunahing salin ang tensiyong ito sa pamamagitan ng pagpapahina sa “Ginoo”; sa halip, pinananatili ang “Panginoon” at inilalagay ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “po kayo” sa pakiusap upang likas na maipakita ang paggalang na taglay ng κύριε, nang hindi inaalis ang posibleng teolohikal na diwa ng “Panginoon.”
