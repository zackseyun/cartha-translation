source:
  edition: SBLGNT
  text: Καὶ ἐπὶ τούτῳ ἦλθαν οἱ μαθηταὶ αὐτοῦ, καὶ ⸀ἐθαύμαζον ὅτι μετὰ γυναικὸς ἐλάλει· οὐδεὶς μέντοι εἶπεν· Τί ζητεῖς; ἢ τί λαλεῖς μετ’ αὐτῆς;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/027.yaml
  text: And at this point his disciples came[a], and they were amazed that he was speaking with a woman. Yet no one said, “What are you seeking?” or[b], “Why are you speaking with her?”
translation:
  language: tl
  text: At sa sandaling iyon ay dumating ang kanyang mga alagad, at namangha sila na nakikipag-usap siya sa isang babae. Gayunman, walang nagsabi, “Ano ang hinahanap mo?”[a] o, “Bakit ka nakikipag-usap sa kanya?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na, “Ano ang kailangan mo?” o “Ano ang gusto mo?” Hindi tahasang tinutukoy ng Griyego kung kanino sana itinatanong ito.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “Ano ang sinasabi mo habang kausap mo siya?” Ang diwa sa konteksto ay, “Bakit ka nakikipag-usap sa kanya?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τούτῳ
  choice: sa sandaling iyon
  rationale: 'Ginamit bilang panandang temporal: dumating ang mga alagad habang nagaganap ang pag-uusap. Likas ito sa modernong Tagalog at pinananatili ang tiyempo ng salaysay.'
- source_word: ἐθαύμαζον
  choice: namangha sila
  rationale: Ipinapahayag ang kanilang matinding pagtataka; sapat ang Tagalog na anyo upang ihatid ang reaksiyon nang hindi dinaragdagan ang dahilan nito.
- source_word: μετὰ γυναικὸς
  choice: sa isang babae
  rationale: Ang γυναικός ay walang artikulo at sa konteksto ay tumutukoy sa isang babae, hindi sa asawa. Hindi idinagdag sa teksto ang anumang panlipunan o etnikong paliwanag.
- source_word: ἐλάλει
  choice: nakikipag-usap siya
  rationale: Ang aspektong imperfect ay naglalarawan ng nagpapatuloy na pag-uusap nang dumating ang mga alagad. Ang “nakikipag-usap” ay natural at ipinakikitang may kausap siya.
- source_word: μέντοι
  choice: Gayunman
  rationale: 'Malinaw nitong ipinahahayag ang pagsalungat: bagaman namangha sila, walang nagsalita.'
- source_word: Τί ζητεῖς;
  choice: Ano ang hinahanap mo?
  rationale: Pinananatili nito ang karaniwang kahulugan ng ζητέω at ang tunay na kalabuan kung ang tanong ay nakatuon kay Jesus o sa babae. Ang mas idyomatikong posibilidad na “Ano ang kailangan mo?” ay nasa talababa.
- source_word: τί λαλεῖς μετ’ αὐτῆς;
  choice: Bakit ka nakikipag-usap sa kanya?
  rationale: Bagaman literal na “Ano ang ipinakikipag-usap mo sa kanya?”, ang τί ay may likas na pragmatikong diwang “bakit” sa kontekstong ito. Ang literal na anyo ay inilagay sa talababa.
theological_decisions:
- issue: Panlipunang implikasyon ng pakikipag-usap ni Jesus sa isang babae
  choice: Ihayag lamang na namangha ang mga alagad dahil nakikipag-usap siya sa isang babae.
  alternative: Idagdag sa pangunahing teksto ang paliwanag tungkol sa mga kaugaliang Hudyo-Samaritano o lalaki-babae.
  rationale: Hindi tinutukoy ng Griyego ang eksaktong panlipunan, etniko, o moral na dahilan ng kanilang pagtataka; pinananatili ng salin ang pagpipigil at kalabuan ng teksto.
- issue: Posibleng kausap sa Τί ζητεῖς;
  choice: Panatilihin ang panghalip na “mo” nang hindi ipinapaliwanag kung ang tanong ay para kay Jesus o sa babae.
  alternative: Tukuying tahasan na ang tanong ay “Ano ang gusto mo sa kanya?” para kay Jesus o “Ano ang kailangan mo?” para sa babae.
  rationale: Nagbabago ang posibleng kausap sa dalawang hindi binigkas na tanong, at hindi ito tahasang nililinaw ng Griyego. Hindi dapat tahimik na lutasin ng salin ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural. Ginamit ang “nakikipag-usap” upang ipakita ang nagpapatuloy at magkabilang-panig na usapan. Iniwasan ang luma o labis na pormal na pananalita at hindi nagdagdag ng paliwanag na wala sa talata.
