id: JHN.4.45
reference: John 4:45
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτε οὖν ἦλθεν εἰς τὴν Γαλιλαίαν, ἐδέξαντο αὐτὸν οἱ Γαλιλαῖοι, πάντα ἑωρακότες ⸀ὅσα ἐποίησεν ἐν Ἱεροσολύμοις ἐν τῇ ἑορτῇ, καὶ αὐτοὶ γὰρ ἦλθον εἰς τὴν ἑορτήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/045.yaml
  text: So when he came into Galilee[a], the Galileans welcomed him, having seen all that he had done in Jerusalem at the feast[b], for they too had gone to the feast.
translation:
  language: tl
  text: Kaya nang dumating siya sa Galilea, malugod siyang tinanggap[a] ng mga taga-Galilea, sapagkat nakita nila ang lahat ng ginawa niya sa Jerusalem noong kapistahan[b]; pumunta rin kasi sila sa kapistahan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tinanggap.” Ang pandiwang Griego ay maaaring tumukoy sa pagtanggap o malugod na pagsalubong; ipinahihiwatig ng konteksto rito ang positibong pagtanggap.
    reason: lexical_alternative
  - marker: b
    text: Ang “kapistahan” ay tumutukoy sa isang relihiyosong pagdiriwang; ayon sa konteksto, malamang na isa itong kapistahang dinarayo sa Jerusalem.
    reason: cultural_note
lexical_decisions:
- source_word: ὅτε οὖν
  choice: Kaya nang
  rationale: Ipinapakita ng “kaya” ang pagpapatuloy o bunga sa salaysay, habang natural na isinasalin ng “nang” ang temporal na ugnayan.
- source_word: ἦλθεν εἰς τὴν Γαλιλαίαν
  choice: dumating siya sa Galilea
  rationale: Natural sa modernong Tagalog at malinaw na ipinahihiwatig ang pagpasok o pagdating sa rehiyon.
- source_word: ἐδέξαντο αὐτὸν
  choice: malugod siyang tinanggap
  rationale: Ipinapahayag ang positibong pagtanggap na ipinahihiwatig ng konteksto, hindi lamang ang simpleng pagharap o pagtanggap sa pagdating.
- source_word: οἱ Γαλιλαῖοι
  choice: mga taga-Galilea
  rationale: Mas natural at madaling maunawaan kaysa sa transliteradong katawagang etnograpiko.
- source_word: πάντα ἑωρακότες ὅσα ἐποίησεν
  choice: sapagkat nakita nila ang lahat ng ginawa niya
  rationale: Ginagawang malinaw ang malamang na sanhi ng pagtanggap habang pinananatili ang naunang pagkakita sa mga ginawa ni Jesus.
- source_word: ἐν Ἱεροσολύμοις ἐν τῇ ἑορτῇ
  choice: sa Jerusalem noong kapistahan
  rationale: Natural na ipinahahayag ang lugar at panahong pinangyarihan.
- source_word: καὶ αὐτοὶ γὰρ ἦλθον εἰς τὴν ἑορτήν
  choice: pumunta rin kasi sila sa kapistahan
  rationale: Pinananatili ng “kasi” ang paliwanag ng γάρ at ng “rin” ang inklusibong diin ng καὶ αὐτοί.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “mga taga-Galilea” at “kapistahan” bilang karaniwang mauunawaang mga katawagan; hindi nilagyan ng tiyak na pangalan ang kapistahan dahil hindi ito tinutukoy sa talata.
