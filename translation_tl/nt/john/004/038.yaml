  verdict: revise
  source_fidelity: Tumpak ang pangunahing talinghaga at ang mga pandiwang “isinugo” at “umani.” Gayunman, ang “Ang iba ang nagpagod” ay maaaring mangahulugang “ang iba ang nagpangyari ng pagkapagod” at hindi malinaw na katumbas ng intransitibong κεκοπιάκασιν (“nagpagal/nagpakapagod”). Ang “nakibahagi kayo sa kanilang pinaghirapan” ay katanggap-tanggap ngunit bahagyang inililihis ang tahasang “sa kanilang pagpapagal”; maaaring panatilihin ang natural na pakikibahagi habang gamitin ang pangngalang “pagpapagal.”
  naturalness: Natural at marangal ang pangkalahatang Tagalog. Mas malinaw at mas likas sa kontekstong ito ang “Nagpagal ang iba” kaysa “Ang iba ang nagpagod.” Ang “nakibahagi kayo sa kanilang pagpapagal” ay natural at pinananatili ang ugnayan sa naunang “nagpagal.”
  terminology: Ang “isinugo,” “umani,” at “pagpapagal” ay angkop sa modernong Filipino Tagalog at pinananatili ang talinghagang pang-agrikultura. Hindi tinutukoy kung sinu-sino ang “iba,” alinsunod sa kalabuan ng Griyego.
  issues:
  - severity: medium
    issue: Hindi malinaw ang “Ang iba ang nagpagod.”
    rationale: Ang “nagpagod” ay karaniwang maaaring transitive (“nagpagod ng iba”), samantalang ang κεκοπιάκασιν ay nangangahulugang nagpagal o nagpakapagod ang “iba” mismo. Ang “Nagpagal ang iba” ay malinaw at mas tapat.
  - severity: low
    issue: Bahagyang maluwag ang “sa kanilang pinaghirapan.”
    rationale: Ang κόπον ay “pagpapagal/paghihirap” mismo, hindi lamang isang bagay na pinaghirapan. Ang “sa kanilang pagpapagal” ay mas malapit sa pinagmulan at nananatiling natural.
  revised_text: Isinugo ko kayo upang umani ng hindi ninyo pinaghirapan. Nagpagal ang iba, at nakibahagi kayo sa kanilang pagpapagal.[a]
