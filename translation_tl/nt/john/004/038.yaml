  text: ἐγὼ ἀπέστειλα ὑμᾶς θερίζειν ὃ οὐχ ὑμεῖς κεκοπιάκατε· ἄλλοι κεκοπιάκασιν, καὶ ὑμεῖς εἰς τὸν κόπον αὐτῶν εἰσεληλύθατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/038.yaml
  text: I sent you to reap what you have not labored for[a]; others have labored[b], and you have entered into their labor.
translation:
  language: tl
  text: Isinugo ko kayo upang umani ng hindi ninyo pinaghirapan. Nagpagal ang iba, at nakibahagi kayo sa kanilang pagpapagal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “pumasok kayo sa kanilang pagpapagal.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλα
  choice: isinugo
  rationale: Likas na katumbas ito ng aorist na pandiwang tumutukoy sa natapos na pagsusugo at pinananatili ang diwang misyonal nang hindi dinaragdagan ng paliwanag.
- source_word: θερίζειν
  choice: upang umani
  rationale: Pinananatili nito ang talinghagang pang-agrikultura; mas natural sa modernong Tagalog ang pandiwang “umani” kaysa sa nominal na “mag-ani ng ani.”
- source_word: ὃ οὐχ ὑμεῖς κεκοπιάκατε
  choice: ng hindi ninyo pinaghirapan
  rationale: Likas na Tagalog ito para sa bagay na aanihin ngunit hindi sila ang dating nagpagod para rito; naipahihiwatig din ang patuloy na kabuluhan ng naunang paggawa.
- source_word: ἄλλοι κεκοπιάκασιν
  choice: Ang iba ang nagpagod
  rationale: Ang “ang” ay nagbibigay ng likas na diin sa kaibahan ng iba at ng mga alagad, samantalang ipinahahayag ng “nagpagod” ang masikap na paggawa ng κοπιάω.
- source_word: εἰς τὸν κόπον αὐτῶν εἰσεληλύθατε
  choice: nakibahagi kayo sa kanilang pinaghirapan
  rationale: Sa Tagalog, malinaw at natural nitong ipinahahayag ang pagpasok sa gawaing pinaghirapan ng iba. Hindi nito nililimitahan ang kahulugan sa bunga lamang ng kanilang paggawa.
theological_decisions:
- issue: Pagkakakilanlan ng “iba” sa talinghaga ng pag-aani
  choice: Nanatiling pangkalahatan ang “iba.”
  alternative: Tukuyin sila bilang mga propeta, si Juan na Tagapagbautismo, si Jesus, o mga naunang saksi.
  rationale: Hindi tinutukoy ng talata kung sino mismo ang “iba,” kaya hindi nilutas ng salin ang sadyang kalabuan.
- issue: Kahulugan ng pagpasok sa paggawa ng iba
  choice: Isinaling “nakibahagi kayo sa kanilang pinaghirapan.”
  alternative: “Pumasok kayo sa kanilang pagpapagal” o “tinamasa ninyo ang bunga ng kanilang pinaghirapan.”
  rationale: Iniiwasan nitong gawing bunga lamang ang κόπος, habang ipinapahayag sa natural na Tagalog ang pakikilahok sa gawaing sinimulan at pinaghirapan ng iba.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Pinanatili ang talinghaga ng pag-aani at ang kaibahan ng naunang pagpapagal ng iba sa pakikibahagi ng mga alagad. Ginamit ang “nakibahagi” sa halip na ang di-likas na literal na “pumasok sa kanilang pagpapagal,” at inilagay ang mas literal na anyo sa talababa.
