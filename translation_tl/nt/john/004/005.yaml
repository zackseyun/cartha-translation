translation_notes:
  register: Makabago, malinaw, at marangal na Filipino Tagalog. Ginamit ang “bayan” at “lupa” sa pangunahing teksto, habang inilagay sa mga talababa ang tunay na lawak ng kahulugan ng πόλις at χωρίον. Inayos ang mga marker ayon sa salitang tinutukoy ng bawat talababa.
