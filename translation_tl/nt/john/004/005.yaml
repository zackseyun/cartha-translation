  text: ἔρχεται οὖν εἰς πόλιν τῆς Σαμαρείας λεγομένην Συχὰρ πλησίον τοῦ χωρίου ὃ ἔδωκεν Ἰακὼβ ⸀τῷ Ἰωσὴφ τῷ υἱῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/005.yaml
  text: So he came to a town of Samaria called Sychar[b][a], near the piece of land that Jacob had given to Joseph his son.
translation:
  language: tl
  text: Kaya dumating siya sa isang bayan[a] sa Samaria na tinatawag na Sicar, malapit sa lupain[b] na ibinigay ni Jacob sa anak niyang si Jose.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lungsod.” Ang salitang Griyego na πόλις ay maaaring tumukoy sa isang lungsod o bayan, depende sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: O “bukid,” “ari-arian,” o “bahagi ng lupa.” Ang salitang Griyego na χωρίον ay maaaring tumukoy sa bukid, ari-arian, o isang bahagi ng lupa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: dumating siya
  rationale: Isang historical present ito sa salaysay; natural sa makabagong Tagalog ang pangnagdaang “dumating” upang ilahad ang sunod-sunod na pangyayari.
- source_word: οὖν
  choice: Kaya
  rationale: Pinananatili ang ugnayang pasalaysay o paghihinuha mula sa naunang konteksto nang hindi nagiging labis na pormal.
- source_word: πόλιν τῆς Σαμαρείας
  choice: isang bayan sa Samaria
  rationale: Maaaring tumukoy ang πόλις sa lungsod o bayan; ang “bayan” ay hindi nagpapalabis sa laki ng Sicar, at natural na ipinapahayag ng “sa Samaria” ang lokasyon.
- source_word: λεγομένην Συχὰρ
  choice: na tinatawag na Sicar
  rationale: Tuwirang at natural na pagkakakilanlan sa pangalan ng bayan; isina-Tagalog ang baybay ng pangalang Sychar bilang “Sicar.”
- source_word: πλησίον
  choice: malapit sa
  rationale: Payak at natural na katumbas ng panandang panlunan.
- source_word: χωρίου
  choice: lupang
  rationale: Saklaw ng χωρίον ang isang bahagi ng lupa, bukid, o ari-arian; malinaw ang “lupa” at hindi nito ipinapalagay na sinasaka iyon.
- source_word: ὃ ἔδωκεν Ἰακὼβ
  choice: ibinigay ni Jacob
  rationale: Malinaw na ipinapahayag ang natapos nang pagbibigay bilang impormasyong nasa likuran ng pangunahing pangyayari.
- source_word: τῷ Ἰωσὴφ τῷ υἱῷ αὐτοῦ
  choice: sa anak niyang si Jose
  rationale: Pinananatili ang tatanggap at ang pagkakakilanlan niya bilang anak ni Jacob sa natural na ayos ng Tagalog.
