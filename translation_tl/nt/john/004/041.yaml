id: JHN.4.41
reference: John 4:41
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ πολλῷ πλείους ἐπίστευσαν διὰ τὸν λόγον αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/john/004/041.yaml
  text: And many more believed because of his word[b][a],
translation:
  language: tl
  text: At mas marami pang sumampalataya dahil sa sinabi niya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dahil sa kanyang salita” o “dahil sa kanyang mensahe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλῷ πλείους
  choice: mas marami pa
  rationale: Ang πολλῷ ay nagpapatingkad sa pahambing na πλείους. Likas sa modernong Tagalog ang “mas marami pa” at malinaw nitong pinananatili ang pagdami kumpara sa mga sumampalataya sa naunang talata.
- source_word: ἐπίστευσαν
  choice: sumampalataya
  rationale: Tuwirang ipinahahayag ng aorist na anyo ng πιστεύω na sila ay naniwala o sumampalataya. Ang “sumampalataya” ay likas at marangal sa kontekstong Juaniko nang hindi nagdaragdag ng tahasang layon na wala sa talata.
- source_word: διὰ τὸν λόγον
  choice: dahil sa sinabi
  rationale: Kasama ang accusative, ang διά ay nagpapahayag dito ng dahilan. Sa kontekstong pasalita, malinaw at natural na Tagalog ang “dahil sa sinabi,” habang ang talababa ay nagpapanatili sa posibleng mas literal na “salita” o mas malawak na “mensahe.”
- source_word: αὐτοῦ
  choice: niya
  rationale: Ang panghalip ay tumutukoy kay Jesus ayon sa agarang konteksto; sapat at likas ang “niya” sa Tagalog.
theological_decisions:
- issue: Paglilipat sa πιστεύω sa salaysay na may konteksto ng kaligtasan
  choice: sumampalataya
  alternative: naniwala sa kanya
  rationale: Walang tahasang layon ang ἐπίστευσαν sa talatang ito. Kaya hindi idinagdag ang “sa kanya,” at hinayaang ang konteksto ang magturo kung kanino sila sumampalataya.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “mas marami pa” upang maipahayag ang pinatinding paghahambing nang hindi mabigat pakinggan; iniwasang idagdag ang layon ng “sumampalataya” na hindi tahasang nasa Griyego.
