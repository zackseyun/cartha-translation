  rationale: Sa konteksto ng Sicar, mas natural ang “bayan” kaysa “lungsod,” habang pinananatili ang diwa ng isang pamayanan.
- source_word: ἀνθρώποις
  choice: mga tao
  rationale: Direktang salin na hindi naglilimita sa kasarian ng mga kinausap.
- source_word: λέγει
  choice: sinabi
  rationale: Bagaman historical present ang Griyego, ang pangnagdaang anyo ang natural na paraan ng pagsasalaysay sa Tagalog at kasuwato ng mga naunang pandiwa.
