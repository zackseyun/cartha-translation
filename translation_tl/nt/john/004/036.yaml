id: JHN.4.36
reference: John 4:36
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀ὁ θερίζων μισθὸν λαμβάνει καὶ συνάγει καρπὸν εἰς ζωὴν αἰώνιον, ⸀ἵνα ὁ σπείρων ὁμοῦ χαίρῃ καὶ ὁ θερίζων.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/036.yaml
  text: The one who reaps is receiving wages and gathering fruit for eternal life[b][a], so that the one who sows and the one who reaps may rejoice together.
translation:
  language: tl
  text: Ang umaani ay tumatanggap ng sahod[a] at nagtitipon ng bunga para sa buhay na walang hanggan,[b] upang ang naghahasik at ang umaani ay magkasamang magalak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “gantimpala.” Ang salitang Griyego ay maaaring tumukoy sa sahod o sa gantimpalang tinatanggap bilang kabayaran.
    reason: lexical_alternative
  - marker: b
    text: O “tungo sa buhay na walang hanggan.” Maaaring ipahayag ng parirala ang tunguhin o ang kinalabasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θερίζων
  choice: ang umaani
  rationale: Ang articular present participle ay ginamit bilang pangngalan. Pinananatili ng “ang umaani” ang nagpapatuloy na kilos at natural ito sa makabagong Tagalog.
- source_word: μισθὸν
  choice: sahod
  rationale: Maaaring tumukoy ang μισθός sa bayad sa paggawa o sa gantimpala. Pinananatili ng “sahod” ang kongkretong larawan ng mga manggagawa sa pag-aani; inilalahad sa talababa ang alternatibong “gantimpala.”
- source_word: λαμβάνει
  choice: tumatanggap
  rationale: Ipinahahayag ng pangkasalukuyang pandiwa ang kasalukuyan o nagpapatuloy na pagtanggap nang hindi nagdaragdag ng salitang katumbas ng “already,” na wala sa sugnay.
- source_word: συνάγει καρπὸν
  choice: nagtitipon ng bunga
  rationale: Pinananatili nito ang kilos ng pagtitipon at ang malawak na talinghaga ng “bunga,” sa halip na ipantay agad ito sa mismong pag-aani.
- source_word: εἰς ζωὴν αἰώνιον
  choice: para sa buhay na walang hanggan
  rationale: Natural sa Tagalog ang “para sa” at maaari nitong ipahayag ang tunguhin o kinalabasan nang hindi lubusang nagpapasya sa pagitan ng mga iyon.
- source_word: ἵνα
  choice: upang
  rationale: Malinaw at marangal na panandang Tagalog para sa layunin, habang maaari ring magpahiwatig ng kinalabasan ayon sa konteksto.
- source_word: ὁ σπείρων
  choice: ang naghahasik
  rationale: Pinananatili ang substantibong present participle at ang malinaw na pagkakatulad nito sa “ang umaani.”
- source_word: ὁμοῦ χαίρῃ
  choice: magkasamang magalak
  rationale: Likas na ipinahahayag nito ang iisang kagalakang pinagsasaluhan ng naghahasik at umaani.
theological_decisions:
- issue: Kung idaragdag ang diwa ng “already” sa simula upang idiin na nagsimula na ang pag-aani
  choice: Hindi idinagdag ang “ngayon” o “narito na”
  alternative: Ngayon pa lamang, ang umaani ay tumatanggap na ng sahod…
  rationale: Pangkasalukuyan ang mga pandiwa at binibigyang-diin ng konteksto ang kasalukuyang pag-aani, ngunit walang hiwalay na salitang “already” sa tekstong Griyego. Iniingatan ng salin ang diin nang hindi nagdaragdag ng hindi tahasang nasa sugnay.
- issue: Ang ugnayan ng εἰς ζωὴν αἰώνιον sa bunga
  choice: para sa buhay na walang hanggan
  alternative: tungo sa buhay na walang hanggan
  rationale: Pinananatili ng “para sa” ang posibleng diwa ng layunin o kinalabasan. Hindi nito nililinaw nang higit sa Griyego kung ang buhay na walang hanggan ang tunguhin, hantungan, o bunga ng pagtitipon.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang karaniwang “sahod” para sa larawan ng paggawa, “nagtitipon ng bunga” upang mapanatili ang talinghaga, at “magkasamang magalak” para sa natural na pagpapahayag ng pinagsasaluhang kagalakan.
