  source_fidelity: 'Tapat ang salin sa Griyego: naipapahayag ang substantibong pangkasalukuyang mga participle, ang kasalukuyang pagtanggap at pagtitipon, ang καρπός bilang “bunga,” at ang layunin/resultang ugnayan ng εἰς ζωὴν αἰώνιον nang hindi ito labis na nililinaw. Wala itong idinagdag na katumbas ng “already,” na wala sa sugnay ng SBLGNT.'
