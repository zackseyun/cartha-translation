id: JHN.4.6
reference: John 4:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἦν δὲ ἐκεῖ πηγὴ τοῦ Ἰακώβ. ὁ οὖν Ἰησοῦς κεκοπιακὼς ἐκ τῆς ὁδοιπορίας ἐκαθέζετο οὕτως ἐπὶ τῇ πηγῇ· ὥρα ἦν ⸀ὡς ἕκτη.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/006.yaml
  text: Jacob’s well was there[a]. So Jesus, wearied from the journey, was sitting there by the well[c][b]. It was about the sixth hour.
translation:
  language: tl
  text: Naroon ang balon ni Jacob[a]. Kaya si Jesus, na pagod sa paglalakbay, ay nakaupo roon sa tabi ng balon[b]. Bandang ikaanim na oras noon[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bukal”; ang salitang Griyego na πηγή ay maaaring tumukoy sa bukal o balon.
    reason: lexical_alternative
  - marker: b
    text: Mas literal, “nakaupo nang gayon,” na maaari ring magpahiwatig na naupo siya kung ano ang kalagayan niya noon o sa gayong paraan.
    reason: lexical_alternative
  - marker: c
    text: Karaniwan itong nauunawaang bandang tanghali kung bibilangin ang mga oras mula sa pagsikat ng araw. Posible rin ang ibang paraan ng pagbibilang; hindi tinutukoy ng Griyego ang katumbas na makabagong oras.
    reason: alternative_reading
lexical_decisions:
- source_word: πηγή
  choice: balon
  rationale: Bagaman maaari itong mangahulugang bukal, ang lugar na iniigiban sa kasunod na salaysay ay likas na tawaging “balon” sa Filipino. Pinanatili sa talababa ang ibang posibleng kahulugan.
- source_word: κεκοπιακὼς
  choice: pagod
  rationale: Ipinahihiwatig ng perpektong pandiwaring ito ang kalagayang bunga ng hirap ng paglalakbay. Ang “pagod” ay natural, malinaw, at angkop sa makabagong Filipino.
- source_word: ἐκ τῆς ὁδοιπορίας
  choice: sa paglalakbay
  rationale: Sa pariralang “pagod sa paglalakbay,” malinaw na ang paglalakbay ang sanhi ng pagkapagod, gaya ng ipinahihiwatig ng ἐκ.
- source_word: ἐκαθέζετο
  choice: nakaupo
  rationale: Ang aspektong imperpekto ay naglalarawan ng nagpapatuloy na kalagayan sa tagpong iyon; natural itong naipapahayag ng “nakaupo.”
- source_word: οὕτως
  choice: roon
  rationale: Mahirap tiyakin ang eksaktong diwa ng οὕτως sa kontekstong ito. Ang “roon” ay maayos sa salaysay, habang inilalahad sa talababa ang mas literal na mga posibilidad.
- source_word: ἐπὶ τῇ πηγῇ
  choice: sa tabi ng balon
  rationale: Lokatif ang gamit ng ἐπί kasama ng datibo. Ang “sa tabi ng balon” ang pinakanatural na paglalarawan sa Filipino.
- source_word: ὥρα ἦν ὡς ἕκτη
  choice: Bandang ikaanim na oras noon
  rationale: Pinananatili nito ang sinaunang paraan ng pagtukoy sa oras at isinasalin ang ὡς bilang “bandang,” nang hindi agad nagpapasiya kung anong makabagong oras ang katumbas nito.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinakikita nito ang ugnayan ng pagkapagod ni Jesus at ng kaniyang pag-upo, at natural itong nagsisilbing pang-ugnay sa Filipino.
- source_word: δὲ
  choice: hindi tahasang isinalin
  rationale: Ang mahinang pang-ugnay na δὲ ay sapat nang naihahatid ng maayos na pagpapatuloy ng salaysay; ang tahasang “ngayon” o “naman” ay maaaring magdagdag ng diwang wala sa konteksto.
theological_decisions:
- issue: Ang tinutukoy na oras sa “ikaanim na oras”
  choice: Pinanatili sa pangunahing teksto ang literal na sinaunang pagtukoy na “bandang ikaanim na oras.”
  alternative: Bandang tanghali; o bandang alas-sais ng gabi ayon sa ibang posibleng sistema ng pagbibilang.
  rationale: Hindi sinasabi ng Griyego kung aling sistema ng pagbibilang ng oras ang ginagamit. Ang literal na pahayag ay nagpapanatili sa tunay na usaping pangkronolohiya sa Ebanghelyo ni Juan sa halip na lutasin iyon sa salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang payak na “pagod” at likas na ayos ng pangungusap, habang pinanatili ang sinaunang “ikaanim na oras” at inilagay sa mga talababa ang tunay na leksikal at kronolohikal na kalabuan.
