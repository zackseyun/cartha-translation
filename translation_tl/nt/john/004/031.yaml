  yaml_path: translation/nt/john/004/031.yaml
  text: Meanwhile, the disciples were urging him, saying, “Rabbi, eat.”
translation:
  language: tl
  text: 'Samantala[a], hinihimok[c] siya ng mga alagad: “Rabi[b], kumain po kayo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sa panahong namamagitan.”
    reason: lexical_alternative
  - marker: b
    text: Ang “Rabi” ay titulong pantawag ng mga Judio na nangangahulugang “Guro.”
    reason: cultural_note
  - marker: c
    text: Maaari ring isalin ang pandiwa bilang “pinakikiusapan” o “paulit-ulit na pinakikiusapan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τῷ μεταξὺ
  choice: Samantala
  rationale: Likas at maikli itong katumbas ng idyomang tumutukoy sa panahong namamagitan sa pag-alis ng babae at sa sumunod na pag-uusap.
- source_word: ἠρώτων
  choice: hinihimok
  rationale: Ipinahihiwatig ng imperpektong anyo ang nagpapatuloy o paulit-ulit na pakiusap; sa konteksto, hinihikayat ng mga alagad si Jesus na kumain.
- source_word: αὐτὸν
  choice: siya
  rationale: Ang panghalip ay tumutukoy kay Jesus bilang layon ng pandiwa.
- source_word: οἱ μαθηταὶ
  choice: ang mga alagad
  rationale: Tinutukoy ng artikulo ang kilalang pangkat ng mga alagad sa salaysay.
- source_word: λέγοντες
  choice: ipinahayag sa tuwirang sipi
  rationale: Sa natural na Tagalog, hindi kailangang isalin nang hiwalay ang participle na λέγοντες bago ang tuwirang sinabi; malinaw na ipinakikilala ng kuwit ang nilalaman ng kanilang paghimok.
- source_word: Ῥαββί
  choice: Rabi
  rationale: Pinananatili ang Judiong titulong pantawag sa anyong madaling basahin sa Filipino, sa halip na agad itong palitan ng salin nitong “Guro.”
- source_word: φάγε
  choice: kumain po kayo
  rationale: Tuwirang isinasalin ang pang-isahang pautos, habang ang “po kayo” ay natural na paraan sa Tagalog upang ipahayag ang magalang na pakiusap sa isang guro.
theological_decisions: []
translation_notes:
  register: Makabago, natural, at magalang na Filipino. Ginamit ang “po kayo” upang maipakita ang magalang na pakikipag-usap ng mga alagad kay Jesus. Hindi isinama ang hiwalay na “na sinasabi” sapagkat magiging mabigat at di-likas ito sa kasalukuyang Tagalog.
