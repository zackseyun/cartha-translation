  text: εἶπεν οὖν ὁ Ἰησοῦς πρὸς αὐτόν· Ἐὰν μὴ σημεῖα καὶ τέρατα ἴδητε, οὐ μὴ πιστεύσητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/048.yaml
  text: So Jesus said to him[a], “Unless you see signs and wonders, you will certainly not believe.”
translation:
  language: tl
  text: Kaya sinabi ni Jesus sa kanya, “Malibang makakita kayo ng mga tanda at mga kababalaghan, hinding-hindi kayo sasampalataya.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pangmaramihan sa Griyego ang mga pandiwang “makakita” at “sasampalataya.” Kaya malamang na ang sinabi ni Jesus ay hindi lamang para sa opisyal kundi para rin sa mas malawak na pangkat.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Ipinapakita ang lohikal at pasalaysay na pagpapatuloy mula sa naunang usapan, sa natural na modernong Tagalog.
- source_word: πρὸς αὐτόν
  choice: sinabi sa kanya
  rationale: Likas na pananalita sa Tagalog para sa pagpapakilala ng tuwirang sinabi sa isang lalaki.
- source_word: Ἐὰν μὴ
  choice: Malibang
  rationale: Maikli at eksaktong ipinapahayag ang pasubaling may pagtanggi na ‘unless,’ habang nananatiling marangal at malinaw.
- source_word: σημεῖα
  choice: mga tanda
  rationale: Pinananatili ang mahalagang gamit ni Juan sa mga gawa na tumuturo sa kahulugang higit sa mismong himala.
- source_word: τέρατα
  choice: mga kababalaghan
  rationale: Natural na katumbas ng mga pambihirang pangyayaring pumupukaw ng pagkamangha at pinananatili ang tradisyonal na tambalang ‘mga tanda at mga kababalaghan.’
- source_word: ἴδητε
  choice: makakita kayo
  rationale: Ipinapahayag ang aorist subjunctive sa likas na kondisyunal na Tagalog at tahasang pinananatili ng ‘kayo’ ang pangmaramihang anyo.
- source_word: οὐ μὴ πιστεύσητε
  choice: hinding-hindi kayo sasampalataya
  rationale: Ang ‘hinding-hindi’ ay nagpapanatili sa mariing pagtanggi ng οὐ μή, at ang ‘sasampalataya’ ay likas na pandiwang Tagalog para sa πιστεύω sa kontekstong Juaniko.
- source_word: πιστεύσητε
  choice: sasampalataya
  rationale: Ipinahahayag ang paniniwala o pagtitiwala nang hindi nagdaragdag ng tiyak na denominasyonal na pagpapakahulugan.
theological_decisions:
- issue: Bilang at saklaw ng kinakausap
  choice: Isahan ang tinutukoy sa pambungad na ‘sa kanya,’ ngunit pangmaramihan ang ‘kayo’ sa sinabi ni Jesus.
  alternative: Ituring na ang opisyal lamang ang kinakausap at gumamit ng pang-isahang ‘ka’; o palawakin bilang ‘kayong mga tao.’
  rationale: Isang lalaki ang kausap sa salaysay, ngunit pangmaramihan ang ἴδητε at πιστεύσητε. Pinananatili ng ‘kayo’ ang tunay na pagbabago ng bilang at ang posibilidad na mas malawak ang saklaw ng sinabi ni Jesus, nang hindi ipinapasok sa teksto ang isang tiyak na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang ‘malibang’ upang maging siksik ngunit natural ang kondisyon, at ang ‘hinding-hindi’ upang mapanatili ang mariing pagtanggi. Tahasang minarkahan ng ‘kayo’ ang pangmaramihan na hindi nakikita sa Ingles.
