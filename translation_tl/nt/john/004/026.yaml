  text: λέγει αὐτῇ ὁ Ἰησοῦς· Ἐγώ εἰμι, ὁ λαλῶν σοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/026.yaml
  text: Jesus said to her[a], “I am, the one speaking to you.”
translation:
  language: tl
  text: Sinabi ni Jesus sa kanya[a], “Ako nga ang nagsasalita sa iyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Ako iyon na nagsasalita sa iyo.” Sa Griyego, literal na “Ako ay, ang nagsasalita sa iyo”; walang hayagang katumbas ng “iyon.” Mula sa konteksto ng naunang talata, ipinahihiwatig na kinikilala ni Jesus ang sarili bilang Mesiyas.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: Sinabi
  rationale: Ang pangkasalukuyang anyo sa Griyego ay historical present; ang pangnagdaang “Sinabi” ang likas na anyo sa makabagong salaysay sa Tagalog.
- source_word: αὐτῇ
  choice: sa kanya
  rationale: Likas na katumbas sa Tagalog ng datibong di-tuwirang layon.
- source_word: Ἐγώ εἰμι
  choice: Ako nga
  rationale: Sa konteksto, kinikilala ni Jesus ang sarili bilang Mesiyas na binanggit sa naunang talata. Ang “Ako nga” ay likas na pahayag ng pagkakakilanlan sa Tagalog nang hindi tahasang idinaragdag ang pangngalang “Mesiyas.”
- source_word: ὁ λαλῶν σοι
  choice: ang nagsasalita sa iyo
  rationale: Pinananatili nito ang substantibong gamit ng articular present participle at ang tuwirang ugnayan sa kausap.
theological_decisions:
- issue: Kung tahasang idaragdag sa pangunahing teksto na si Jesus ang Mesiyas
  choice: Panatilihin ang maikling pagkakakilanlang “Ako nga,” na sinusundan ng “ang nagsasalita sa iyo.”
  alternative: “Ako ang Mesiyas—ako na nagsasalita sa iyo.”
  rationale: Malinaw sa konteksto ng Juan 4:25 na ang tinutukoy ay ang Mesiyas, ngunit wala sa mismong Griyego ng talata ang pangngalang “Mesiyas.” Iniiwasan ng napiling salin ang tahasang pagdaragdag nito habang pinananatili ang kahulugan ng pagkakakilanlan.
translation_notes:
  register: Makabago, dignificado, at madaling maunawaang Tagalog. Ginamit ang “Ako nga” bilang likas ngunit hindi labis na interpretibong pahayag ng pagkakakilanlan; ipinaliwanag sa talababa ang mas literal at alternatibong pagbasa.
