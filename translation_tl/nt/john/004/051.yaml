  source_fidelity: Tapat ang salin sa genitive absolute na nagpapakitang nagpapatuloy na ang pagbaba nang salubungin siya. Ang “mga alipin” ay tuwirang tumutugma sa δοῦλοι, at ang “buhay ang kanyang anak” ay natural na naghahatid ng ζῇ nang hindi nagdaragdag ng “gumaling.” Bagaman malawak ang παῖς, ang “anak” ay hindi nagsasaad ng kasarian at ang talababa ay sapat na nag-iingat sa saklaw ng salita.
  naturalness: 'Natural at malinaw ang daloy sa makabagong Filipino: “Habang bumababa na siya, sinalubong siya ng kanyang mga alipin at sinabi sa kanya...” Ang “sinalubong” ay angkop sa ὑπήντησαν at ang pag-uugnay sa “at sinabi” ay likas na paraan upang isalin ang participle na λέγοντες.'
  terminology: Ang “alipin” ay angkop para sa δοῦλοι at hindi pinapalambot ang historikal na katayuan. Ang “anak” ay natural para sa παῖς sa kontekstong ito, samantalang ang talababa ay maayos na nagbibigay ng “bata” at ng posibleng kahulugang alipin/lingkod sa ibang konteksto.
