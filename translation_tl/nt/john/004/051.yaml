  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἤδη δὲ αὐτοῦ καταβαίνοντος οἱ δοῦλοι αὐτοῦ ⸀ὑπήντησαν ⸀αὐτῷ λέγοντες ὅτι ὁ παῖς ⸀αὐτοῦ ζῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/051.yaml
  text: And while he was already going down[a], his servants met him, saying that his child was alive.
translation:
  language: tl
  text: Habang bumababa na siya, sinalubong siya ng kanyang mga alipin at sinabi sa kanya na buhay ang kanyang anak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kanyang bata”; ang salitang Griyego na pais ay maaaring mangahulugang “anak,” “bata” o, sa ilang konteksto, “alipin” o “lingkod.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη
  choice: na
  rationale: Ipinahihiwatig na nagsimula na at nagpapatuloy ang pagbaba nang mangyari ang pagsalubong; natural itong ipinapahayag ng hulaping “na” sa Tagalog.
- source_word: δὲ
  choice: Habang
  rationale: Mahinang pang-ugnay ito sa pagpapatuloy ng salaysay. Sa Tagalog, likas na naisasama ang ugnayan nito sa sugnay na “Habang…” nang hindi nagpapahiwatig ng di-kinakailangang pagsalungat.
- source_word: καταβαίνοντος
  choice: bumababa
  rationale: Ang pangkasalukuyang participle sa genitive absolute ay nagsasaad ng kilos na nagpapatuloy kasabay ng pagsalubong. Ang “bumababa” ay natural para sa paglalakbay mula sa mas mataas na lugar.
- source_word: δοῦλοι
  choice: mga alipin
  rationale: Pinananatili nito ang kalagayang panlipunan ng mga taong nasa ilalim ng kapangyarihan ng opisyal, sa halip na palambutin agad bilang “mga lingkod.”
- source_word: ὑπήντησαν
  choice: sinalubong
  rationale: Ipinahihiwatig ng pandiwa ang pagharap o paglabas upang katagpuin ang isang dumarating; “sinalubong” ang pinakanatural na salaysay sa Tagalog.
- source_word: λέγοντες
  choice: at sinabi sa kanya
  rationale: Ginagawang natural na magkakaugnay na kilos sa Tagalog ang participle habang pinananatiling malinaw na ang mga alipin ang naghatid ng balita sa kanya.
- source_word: παῖς
  choice: anak
  rationale: Sa konteksto ng salaysay, natural na tumutukoy ito sa anak ng opisyal. Gayunman, mas malawak ang saklaw ng salitang Griyego, kaya pinananatili sa talababa ang ibang posibleng kahulugan.
- source_word: ζῇ
  choice: buhay
  rationale: Tuwirang inilalahad ang kalagayang ipinahayag ng mga alipin nang hindi dinaragdagan ng interpretasyong “gumaling na.”
theological_decisions:
- issue: Ang tinutukoy ng παῖς sa salaysay ng pagpapagaling
  choice: kanyang anak
  alternative: kanyang bata o kanyang alipin/lingkod
  rationale: Sinusuportahan ng mas malawak na konteksto ang ugnayang magulang-anak, ngunit hindi kasing-tiyak ng υἱός ang παῖς sa talatang ito. Ginamit ang natural na “anak,” habang inilalahad sa talababa ang tunay na lawak ng salitang Griyego.
translation_notes:
  register: Makabagong Filipino na natural at marangal ang himig. Ginamit ang “alipin” upang hindi ikubli ang kalagayang panlipunang ipinahihiwatig ng δοῦλοι, at “sinalubong” upang maging malinaw at buhay ang daloy ng salaysay.
