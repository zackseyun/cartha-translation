  text: ἀπεκρίθη ἡ γυνὴ καὶ εἶπεν ⸀αὐτῷ· Οὐκ ἔχω ἄνδρα. λέγει αὐτῇ ὁ Ἰησοῦς· Καλῶς εἶπας ὅτι Ἄνδρα οὐκ ἔχω·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/017.yaml
  text: 'The woman answered and said to him[a], “I do not have a husband.” Jesus said to her[b], “You have spoken well: ‘I do not have a husband.’”'
translation:
  language: tl
  text: 'Sumagot ang babae kay Jesus, “Wala akong asawa.” Sinabi ni Jesus sa kanya, “Tama ang sinabi mo: ‘Wala akong asawa.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη ἡ γυνὴ καὶ εἶπεν αὐτῷ
  choice: Sumagot ang babae
  rationale: Ang tambalang pormula sa Griyego na literal na ‘sumagot at nagsabi sa kanya’ ay likas na naipapahayag sa modernong Tagalog sa payak na ‘Sumagot ang babae.’ Malinaw na kay Jesus nakatuon ang sagot mula sa konteksto.
- source_word: Οὐκ ἔχω ἄνδρα
  choice: Wala akong asawa
  rationale: Maaaring mangahulugan ang ἀνήρ ng ‘lalaki’ o ‘asawang lalaki,’ ngunit malinaw sa kasunod na talata na kalagayang pangmag-asawa ang tinutukoy. Ang ‘Wala akong asawa’ ang natural at tiyak na katumbas sa Tagalog.
- source_word: λέγει αὐτῇ ὁ Ἰησοῦς
  choice: Sinabi sa kanya ni Jesus
  rationale: Bagaman historical present ang λέγει, natural sa salaysay na Tagalog ang pangnagdaan. Pinananatili rin ang di-tuwirang layon na ‘sa kanya.’
- source_word: Καλῶς εἶπας
  choice: Tama ang sinabi mo
  rationale: Sa kontekstong ito, pinagtitibay ng καλῶς ang katotohanan o kawastuhan ng sinabi ng babae. Mas natural sa Tagalog ang ‘Tama ang sinabi mo’ kaysa sa literal na ‘Mabuti ang pagkakasabi mo.’
- source_word: ὅτι Ἄνδρα οὐκ ἔχω
  choice: ': ‘Wala akong asawa.’'
  rationale: Ipinakikilala ng ὅτι ang nilalaman ng sinabi. Ginagamit ang tutuldok at tuwirang sipi upang malinaw at natural na maipakita na inuulit ni Jesus ang mga salita ng babae.
theological_decisions:
- issue: Kahulugan ng ἀνήρ sa pahayag ng babae
  choice: asawa
  alternative: lalaki
  rationale: Bagaman leksikal na posible ang ‘lalaki,’ ang agarang konteksto—lalo na ang pagbanggit sa mga naging asawa sa talata 18—ay tumutukoy sa asawang lalaki. Hindi ito nagdaragdag ng doktrina kundi nagpapahayag ng kontekstuwal na kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na payak, marangal, at natural. Iniwasan ang lipas o labis na literal na ‘sumagot at nagsabi,’ ngunit pinanatili ang pag-uulit ng ‘Wala akong asawa’ dahil mahalaga itong bahagi ng tugon ni Jesus.
