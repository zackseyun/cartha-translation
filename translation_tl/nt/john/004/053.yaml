  verdict: revise
  source_fidelity: Tumpak na naipapahayag ng draft ang pagkilala ng ama sa pagtutugma ng oras, ang pahayag ni Jesus na buhay ang anak, at ang pagsampalataya ng ama at ng buong sambahayan. Gayunman, mas malinaw na isalin ang huling magkaugnay na paksa bilang dalawang tahasang paksa kaysa sa “pati,” upang maipakita ang elliptical na ikalawang “sumampalataya” sa Griyego.
  naturalness: Natural ang pangkalahatang rehistro. Ang “At sumampalataya siya mismo at ang buong sambahayan niya” ay mas tuwiran at mas malinaw kaysa “At sumampalataya siya mismo, pati ang buo niyang sambahayan.” Ang alternatibong “Nabubuhay ang anak mo” ay hindi kasing natural para sa deklarasyong ito; mas idiomatiko ang “Ang anak mo ay buhay.”
  terminology: Ang “sumampalataya,” “sambahayan,” at pangalang “Jesus” ay angkop sa modernong Filipino Tagalog at sa rehistro ng Juan. Pinananatili ng “sumampalataya” ang hindi tinutukoy na saklaw ng πιστεύω nang walang idinagdag na doktrinal na pagpapakahulugan.
  issues:
