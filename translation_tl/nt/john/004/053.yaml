    issue: Hindi pinakamalinaw ang pagkakaugnay ng “pati ang buo niyang sambahayan.”
    rationale: Ang Griyego ay may “siya” at “ang buong sambahayan niya” bilang magkaugnay na mga paksa ng ipinahiwatig na “sumampalataya.” Ang paggamit ng “at” ay mas malinaw at mas malapit sa ayos na ito.
  - severity: low
    issue: Hindi natural ang alternatibong salin sa talababa a.
    rationale: Ang “Nabubuhay ang anak mo” ay maaaring magmungkahi ng nagpapatuloy na pamumuhay kaysa sa simpleng kalagayang “buhay.” Ang “Ang anak mo ay buhay” ay likas na alternatibong ayos para sa parehong pahayag.
