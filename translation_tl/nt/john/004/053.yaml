base_translation:
  language: en
  yaml_path: translation/nt/john/004/053.yaml
  text: So the father knew that it was at that hour when Jesus said to him[a], “Your son lives,” and he himself believed[b], and his whole household.
translation:
  language: tl
  text: Kaya nalaman ng ama na sa oras na iyon sinabi sa kanya ni Jesus, “Buhay ang anak mo.”[a] At sumampalataya siya mismo,[b] at ang buong sambahayan niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ang anak mo ay buhay.”
    reason: lexical_alternative
  - marker: b
    text: Ang “sumampalataya” ay maaaring tumukoy sa paniniwala niya sa mismong sinabi ni Jesus o sa pagdating niya sa mas ganap na pananampalataya kay Jesus; hindi tahasang tinutukoy ng Griyego ang saklaw nito.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔγνω
  choice: nalaman
  rationale: Ipinahahayag ng aorist na anyo ang pagkilala ng ama na nagtugma ang oras ng paggaling at ang sinabi ni Jesus. Likas sa modernong Tagalog ang “nalaman” at hindi nito dinaragdagan ang proseso ng kanyang pagkaunawa.
- source_word: οὖν
  choice: Kaya
  rationale: Nag-uugnay ito ng naging konklusyon ng ama sa ulat ng mga lingkod sa naunang talata.
- source_word: ὁ πατὴρ
  choice: ang ama
  rationale: Sinusunod nito ang tahasang katawagang pampamilya sa Griyego at ang pokus ng salaysay.
- source_word: ἐκείνῃ τῇ ὥρᾳ
  choice: iyon nga ang oras
  rationale: Tinutukoy ang partikular na oras. Ang “nga” ay natural na nagpapakita ng eksaktong pagtutugma sa Tagalog nang hindi gumagamit ng mabigat na pananalita.
- source_word: ἐν ᾗ
  choice: nang
  rationale: Natural na panandang temporal sa Tagalog para sa literal na diwang “noong oras na.”
- source_word: εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: sabihin sa kanya ni Jesus
  rationale: Malinaw at likas na paglilipat ng ayos ng Griyego sa Tagalog.
- source_word: Ὁ υἱός σου ζῇ
  choice: Buhay ang anak mo
  rationale: Ipinahahayag ng present tense na ζῇ ang kasalukuyang kalagayan ng anak. Ito ang pinakanatural at tuwirang pahayag sa Tagalog; maaari ring sabihing “Nabubuhay ang anak mo.”
- source_word: ἐπίστευσεν
  choice: sumampalataya
  rationale: Karaniwang katumbas ng πιστεύω sa kontekstong teolohikal ni Juan, habang iniiwang hindi tahasang tinutukoy ng pandiwa ang lawak o antas ng pananampalataya.
- source_word: αὐτὸς
  choice: siya mismo
  rationale: Pinananatili ang diin ng tahasang panghalip sa Griyego at ibinubukod ang personal niyang tugon bago banggitin ang sambahayan.
- source_word: ἡ οἰκία αὐτοῦ ὅλη
  choice: ang buo niyang sambahayan
  rationale: Ang οἰκία ay tumutukoy sa mga kabilang sa sambahayan, hindi sa gusali; pinananatili ng “buo” ang saklaw ng ὅλη.
theological_decisions:
- issue: Saklaw ng pagsampalataya ng ama
  choice: Isinasabi lamang sa pangunahing teksto na sumampalataya siya, nang hindi nililinaw kung ito ay partikular na paniniwala sa salita ni Jesus o mas ganap na pananampalataya kay Jesus.
  alternative: Maaaring unawain na naniwala lamang siya sa tiyak na pangako ng pagpapagaling, o na dumating siya sa mas ganap na pananampalataya kay Jesus sa sandaling ito.
  rationale: May teolohikal na lalim ang πιστεύω sa Ebanghelyo ni Juan, ngunit hindi tahasang itinatakda ng talata ang buong saklaw nito. Pinananatili ng salin at talababa ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “sambahayan” upang tukuyin ang buong pangkat sa tahanan, at pinanatili ang diin at teolohikal na kalabuan ng orihinal.
