  rationale: Inayos ang huling sugnay upang malinaw na ang ama at ang buong sambahayan niya ang kapwa sumampalataya, gaya ng ipinahihiwatig ng Griyegong ayos. Pinalitan din ang hindi gaanong natural na alternatibo sa talababa a. Walang binagong kahulugan o nilutas na teolohikal na kalabuan.
