  source_fidelity: Tumpak ang pangunahing salin sa pasalungat na ἀλλά, sa darating-ngunit-kasalukuyang “oras,” sa panghinaharap na pagsamba ng mga tunay na mananamba, at sa hindi paglutas sa kalabuan ng ἐν πνεύματι. Gayunman, ang “nang gayon” ay hindi sapat na likas at malinaw na pagsasalin ng τοιούτους na kaugnay ng mga sumasamba; mas malinaw na ipakita ang uring pagsambang tinutukoy.
  naturalness: Marangal at madaling maunawaan ang kabuuan. Mas natural ang “ngayon ay narito na” kaysa “narito na ngayon,” at ang “sa ganitong paraan” ay mas idiomatiko at malinaw kaysa “nang gayon” sa hulihan. Inaayos din ang talababa upang hindi magmukhang ang espiritu ng tao ang sinasamba.
  terminology: Ang “Ama,” “espiritu,” at “katotohanan” ay angkop. Pinananatili ang maliit na titik sa “espiritu” upang huwag ipasiya ang tinutukoy na πνεύμα, habang maayos na inilalahad ng talababa ang “Espiritu” bilang alternatibong pagbasa.
