  - severity: low
    issue: Ang pariralang “sa pagsamba sa espiritu ng tao” sa talababa ay maaaring mabasang pagsamba na ang espiritu ng tao ang layon.
    rationale: Ang alternatibo ay tumutukoy sa pagsambang nagmumula o isinasagawa sa espiritu ng tao, hindi sa pagsamba sa espiritu ng tao.
