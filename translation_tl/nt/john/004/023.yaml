  text: ἀλλὰ ἔρχεται ὥρα καὶ νῦν ἐστιν, ὅτε οἱ ἀληθινοὶ προσκυνηταὶ προσκυνήσουσιν τῷ πατρὶ ἐν πνεύματι καὶ ἀληθείᾳ, καὶ γὰρ ὁ πατὴρ τοιούτους ζητεῖ τοὺς προσκυνοῦντας αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/023.yaml
  text: But an hour is coming[a], and is now here, when the true worshipers will worship the Father in spirit and truth; for the Father indeed seeks such people to worship him.
translation:
  language: tl
  text: Ngunit dumarating ang oras, at ngayon ay narito na, na ang mga tunay na sumasamba ay sasamba sa Ama sa espiritu[a] at katotohanan; sapagkat ang Ama nga ay naghahanap ng mga sumasamba sa kanya sa ganitong paraan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa Espiritu.” Maaaring tumukoy ang Griyego sa pagsambang binibigyang-kakayahan ng Banal na Espiritu, sa pagsambang nagmumula sa espiritu ng tao, o sa pagsambang may espirituwal na katangian.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ngunit
  rationale: Likas at marangal na panandang pasalungat sa naunang usapan tungkol sa lugar ng pagsamba.
- source_word: ἔρχεται ὥρα
  choice: dumarating ang oras
  rationale: Pinananatili ang Johannine na larawan ng “oras” at ang aspektong papalapit nito; natural sa modernong Tagalog kahit walang pantukoy ang Griyego.
- source_word: καὶ νῦν ἐστιν
  choice: at narito na ngayon
  rationale: Malinaw na ipinahahayag na ang inaasahang oras ay kasalukuyan nang dumating o nagsimula.
- source_word: οἱ ἀληθινοὶ προσκυνηταὶ
  choice: ang mga tunay na sumasamba
  rationale: Ipinapahayag ang diwa ng mga tunay o tunay-na-uri ng mananamba nang hindi lumilikha ng sektaryong kategorya.
- source_word: προσκυνήσουσιν τῷ πατρὶ
  choice: sasamba sa Ama
  rationale: Tuwirang katumbas ng future indicative at ng layon ng pagsamba; natural sa Tagalog.
- source_word: ἐν πνεύματι καὶ ἀληθείᾳ
  choice: sa espiritu at katotohanan
  rationale: Pinananatili ang dalawang pangngalan at ang tunay na kalabuan ng πνεῦμα sa halip na gawing tahasang Espiritu Santo o simpleng taimtim na saloobin.
- source_word: καὶ γὰρ
  choice: sapagkat ... nga
  rationale: Ang “sapagkat” ay nagbibigay ng dahilan at ang “nga” ay naghahatid ng diin ng καί.
- source_word: τοιούτους ζητεῖ τοὺς προσκυνοῦντας αὐτόν
  choice: hinahanap nga ng Ama ang mga sumasamba sa kanya nang gayon
  rationale: Ang “nang gayon” ay tumutukoy sa uri ng pagsambang kasasabi lamang at iniiwasang idagdag ang salitang “tao” na wala sa Griyego.
theological_decisions:
- issue: Kahulugan ng ἐν πνεύματι
  choice: “sa espiritu” sa pangunahing teksto, na may talababa
  alternative: “sa Espiritu” o “sa paraang espirituwal”
  rationale: Walang pantukoy ang πνεύματι at maaaring tumukoy sa Espiritu Santo, sa espiritu ng tao, o sa espirituwal na larangan o katangian ng pagsamba. Hindi nilulutas ng salin ang teolohikal na kalabuan.
- issue: Saklaw ng “mga tunay na sumasamba”
  choice: Ginamit sa kwalitatibong diwa ng tunay o autentikong mga mananamba
  alternative: “mga totoong mananamba” o “mga tunay na mananamba”
  rationale: Pinananatili ang kaibhan sa konteksto sa pagsambang nakatali lamang sa lugar, nang hindi nag-aangkat ng denominasyonal o sektaryong pagkakakilanlan.
- issue: Diwa ng τοιούτους
  choice: “ang mga sumasamba sa kanya nang gayon”
  alternative: “gayong mga tao upang sumamba sa kanya”
  rationale: 'Mas malapit ito sa pagkakaugnay ng demonstratibo at ng substantival participle: hinahanap ng Ama ang mga mananambang may gayong uri ng pagsamba, hindi lamang mga taong maaari pang sumamba.'
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang Johannine na “oras,” ang pares na “espiritu at katotohanan,” at ang kalabuan ng πνεύμα nang hindi nag-aangkat ng denominasyonal na paliwanag.
