  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: λέγει πρὸς αὐτὸν ἡ γυνή· Κύριε, δός μοι τοῦτο τὸ ὕδωρ, ἵνα μὴ διψῶ μηδὲ ⸀διέρχωμαι ἐνθάδε ἀντλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/015.yaml
  text: The woman said to him[a], “Lord, give me this water, so that I may not be thirsty or come here to draw.”
translation:
  language: tl
  text: Sinabi sa kanya ng babae, “Panginoon[a], ibigay po ninyo sa akin ang tubig na ito upang hindi na ako mauhaw at hindi na rin pumarito para sumalok.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ginoo, ibigay po ninyo sa akin ang tubig na ito …”
    reason: Maaaring ang κύριε ay isang magalang na tawag na katumbas ng “Ginoo,” sa halip na tahasang pagkilala kay Jesus bilang “Panginoon.”
lexical_decisions:
- source_word: λέγει
  choice: Sinabi
  rationale: Bagaman pangkasalukuyan ang anyong Griyego, karaniwang ginagamit sa likas na salaysay sa Tagalog ang pangnagdaang “sinabi” upang ihatid ang tungkulin ng historical present.
- source_word: γυνή
  choice: ang babae
  rationale: Ang tinutukoy ay ang babaeng Samaritana; hindi ang kahulugang “asawa.”
- source_word: Κύριε
  choice: Panginoon
  rationale: Pinananatili nito ang posibleng mas malalim na pahiwatig ng κύριος sa Ebanghelyo ni Juan, samantalang inilalagay sa talababa ang “Ginoo” bilang posibleng magalang na tawag lamang.
- source_word: δός μοι
  choice: ibigay po ninyo sa akin
  rationale: Direkta at likas itong pakiusap sa modernong Tagalog. Ipinahihiwatig ng “po ninyo” ang magalang na pakikipag-usap nang hindi binabago ang hinihinging kilos.
- source_word: τοῦτο τὸ ὕδωρ
  choice: ang tubig na ito
  rationale: “Tubig” lamang ang nasa talata; hindi idinagdag ang “buhay” mula sa naunang konteksto.
- source_word: ἵνα μὴ διψῶ
  choice: upang hindi na ako mauhaw
  rationale: Likas na ipinahahayag ng “upang” ang layunin, at ipinakikita ng “hindi na” ang inaasahang pagtigil ng pagkauhaw sa konteksto.
- source_word: μηδὲ διέρχωμαι ἐνθάδε
  choice: at hindi na rin pumarito
  rationale: Ang “at hindi na rin” ay likas na naghuhugpong ng ikalawang negatibong layunin; ang “pumarito” ay naghahatid sa deiktikong diwa ng pagpunta sa lugar na kinaroroonan nila.
- source_word: ἀντλεῖν
  choice: para sumalok
  rationale: Ang “sumalok” ay angkop sa pagkuha ng tubig mula sa balon. Hindi na inuulit ang “ng tubig” sapagkat malinaw na ito sa konteksto at walang tahasang layon sa Griyego.
theological_decisions:
- issue: Kahulugan ng κύριος sa pakikipag-usap ng babaeng Samaritana
  choice: Panginoon
  alternative: Ginoo
  rationale: Maaaring isa lamang itong magalang na tawag, ngunit maaari rin itong magkaroon ng mas malalim na pahiwatig sa salaysay ni Juan. Pinananatili ng pangunahing salin at talababa ang dalawang posibilidad sa halip na tahimik na pagpasyahan ang tensiyon.
translation_notes:
  register: Makabago, magalang, at madaling maunawaang Filipino. Ginamit ang “po ninyo” upang maging likas ang magalang na tuwirang pananalita, at “pumarito” upang malinaw na ipahiwatig ang paulit-ulit na pagpunta sa balon.
