  text: ἔδει δὲ αὐτὸν διέρχεσθαι διὰ τῆς Σαμαρείας.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/004.yaml
  text: He had to pass through Samaria[a].
translation:
  language: tl
  text: Kailangan niyang dumaan sa Samaria.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kinakailangan niyang magdaan sa Samaria.” Nagsasaad ang Griyego ng pangangailangan ngunit hindi tinutukoy ang eksaktong batayan nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδει
  choice: Kailangan
  rationale: Ang imperpektong anyo ng δεῖ ay nagpapahayag ng pangangailangan sa salaysay. Likas sa modernong Tagalog ang “kailangan” at hindi nito tinutukoy kung ano ang batayan ng pangangailangan.
- source_word: δὲ
  choice: hindi isinalin nang tahasan
  rationale: Mahinang panandang diskurso ito na nagpapasulong sa salaysay, hindi malinaw na pagsalungat. Hindi kailangan ang hiwalay na “ngayon” o “ngunit” sa natural na Tagalog.
- source_word: αὐτὸν
  choice: niyang
  rationale: Bagaman akusatibo ang αὐτόν bilang simuno ng pawatas sa Griyego, natural itong ipinahahayag sa Tagalog sa hulmahang “Kailangan niyang…”
- source_word: διέρχεσθαι
  choice: dumaan
  rationale: Sa pagkakagamit kasama ng διά, nangangahulugan itong magdaan o maglakbay sa isang lugar. Maikli at natural ang “dumaan.”
- source_word: διὰ τῆς Σαμαρείας
  choice: sa Samaria
  rationale: Ipinahihiwatig na ng pandiwang “dumaan” kasama ng “sa” ang paglalakbay sa loob o sa pamamagitan ng nasabing rehiyon; hindi kailangang idagdag ang “rehiyon ng.”
theological_decisions:
- issue: Lakas at batayan ng pangangailangan sa ἔδει
  choice: Ipinahayag bilang tunay na pangangailangan sa “Kailangan niyang,” nang hindi tinutukoy ang eksaktong batayan nito.
  alternative: Maaaring unawain bilang pangangailangang heograpikal o bilang banal na pangangailangang kaugnay ng misyon ni Jesus.
  rationale: Mismong talata ay nagsasaad ng pangangailangan ngunit hindi nagpapaliwanag kung bakit. Pinananatili ng salin ang ambiguwidad at teolohikal na tensiyong iyon.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang payak na “kailangan” at “dumaan” upang maging malinaw sa karaniwang mambabasa habang pinananatili ang di-tiyak na batayan ng pangangailangan.
