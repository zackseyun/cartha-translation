  text: λέγει αὐτοῖς ὁ Ἰησοῦς· Ἐμὸν βρῶμά ἐστιν ἵνα ⸀ποιήσω τὸ θέλημα τοῦ πέμψαντός με καὶ τελειώσω αὐτοῦ τὸ ἔργον.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/034.yaml
  text: Jesus said to them[b][a], “My food is to do the will of him who sent me and to complete his work.”
translation:
  language: tl
  text: Sinabi ni Jesus sa kanila, “Ang pagkain ko ay ang gawin ang kalooban ng nagsugo sa akin[b] at tapusin ang kanyang gawain.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ganapin ang kanyang gawain.”
    reason: lexical_alternative
  - marker: b
    text: Sa konteksto, ang “nagsugo sa akin” ay tumutukoy sa Ama, bagaman hindi tahasang binabanggit dito ng Griyego ang titulong iyon.
    reason: cross_reference
lexical_decisions:
- source_word: βρῶμά
  choice: pagkain
  rationale: Pinananatili ang kongkretong talinghaga, yamang literal na pagkain ang pinag-uusapan ng mga alagad sa konteksto.
- source_word: Ἐμὸν βρῶμά ἐστιν
  choice: Ang pagkain ko ay
  rationale: Malinaw at tuwirang pinananatili ang talinghaga ni Jesus nang hindi ito ipinapaliwanag bilang ‘nagpapalakas’ o ‘nagbibigay-buhay.’
- source_word: ἵνα ποιήσω
  choice: ang gawin
  rationale: Natural na ipinapahayag sa Filipino ang nilalaman o layunin ng naunang pahayag habang pinananatili ang aktibong unang-panauhang diwa.
- source_word: τὸ θέλημα
  choice: ang kalooban
  rationale: Ang ‘kalooban’ ang karaniwan at tumpak na salin sa kontekstong tumutukoy sa ninanais at layunin ng Diyos.
- source_word: τοῦ πέμψαντός με
  choice: ng nagsugo sa akin
  rationale: Pinananatili ang articular participle bilang personal na paglalarawan at hindi tahasang idinaragdag ang titulong ‘Ama,’ na wala sa mismong Griyego.
- source_word: τελειώσω
  choice: ganapin
  rationale: Ipinahihiwatig ng τελειόω ang pagdadala ng isang gawain sa nilayon nitong kaganapan; naipapahayag ito ng ‘ganapin’ nang higit sa basta paghinto o pagtatapos.
- source_word: αὐτοῦ τὸ ἔργον
  choice: ang kanyang gawain
  rationale: Natural ang ‘gawain’ para sa misyong ipinagkatiwala kay Jesus, at pinananatili ng ‘kanyang’ ang reperensiya sa nagsugo sa kanya.
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: Sinabi ni Jesus sa kanila
  rationale: Isinalin ang historikal na pangkasalukuyan sa karaniwang aspektong ginagamit sa salaysay sa modernong Filipino.
theological_decisions:
- issue: Ang tinutukoy ng ‘nagsugo sa akin’
  choice: Pinanatili sa teksto bilang ‘nagsugo sa akin,’ na kontekstuwal na tumutukoy sa Ama.
  alternative: ‘Ama na nagsugo sa akin’
  rationale: Malinaw sa mas malawak na konteksto ng Juan na ang Ama ang tinutukoy, ngunit hindi tahasang binabanggit ang titulong iyon sa talatang Griyego; kaya hindi ito idinagdag sa pangunahing teksto.
- issue: Saklaw ng τελειώσω
  choice: ‘ganapin,’ na nagpapahiwatig ng pagdadala sa nilayon nitong kaganapan
  alternative: ‘tapusin,’ na higit na tuwirang tumutukoy sa pagtatapos
  rationale: Pinananatili ng ‘ganapin’ ang posibleng diwa ng katuparan, habang inilalahad sa talababa ang mas payak na alternatibo.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Pinanatili ang talinghaga ng pagkain at ang di-tahasang pagtukoy sa Ama; iniwasan ang labis na pagpapaliwanag sa pangunahing teksto.
