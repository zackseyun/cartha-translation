base_translation:
  language: en
  yaml_path: translation/nt/john/004/046.yaml
  text: So he came again to Cana of Galilee[a], where he had made the water wine[b]. And there was a certain royal official whose son was sick in Capernaum.
translation:
  language: tl
  text: Kaya muli siyang pumunta sa Cana ng Galilea, kung saan ginawa niyang alak ang tubig.[a] May isang opisyal ng hari[b] na ang anak na lalaki ay may sakit sa Capernaum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “kung saan ginawa niya ang tubig na alak.” Maaari ring isalin nang mas interpretibo: “kung saan ginawa niyang alak ang tubig.”'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “tauhan ng hari” o “taong maharlika.” Ang Griyegong βασιλικός ay tumutukoy sa isang taong may kaugnayan sa hari o naglilingkod sa sambahayan ng hari.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Ipinagpapatuloy nito ang salaysay at pinananatili ang bahagyang lohikal na kaugnayan sa naunang konteksto.
- source_word: πάλιν
  choice: muli
  rationale: Likas at tuwirang ipinapahayag ang pagbabalik sa lugar.
- source_word: Κανὰ τῆς Γαλιλαίας
  choice: Cana ng Galilea
  rationale: Malapit sa anyong Griyego at malinaw na iniuugnay ang Cana sa rehiyon ng Galilea.
- source_word: ἐποίησεν τὸ ὕδωρ οἶνον
  choice: ginawa niyang alak ang tubig
  rationale: Pinananatili ang payak na pahayag ng Griyego na 'ginawa ang tubig na alak' nang hindi kinakailangang idagdag ang mas interpretibong 'ginawang alak mula sa tubig.'
- source_word: βασιλικός
  choice: opisyal ng hari
  rationale: Malinaw na ipinapakita ang kaugnayan niya sa hari o sambahayan ng hari nang hindi tiyak na itinatakda ang kaniyang ranggo.
- source_word: τις
  choice: isang
  rationale: Natural sa makabagong Tagalog para sa pagpapakilala ng isang partikular ngunit hindi pinangalanang tao; mas matigas ang literal na 'isang partikular.'
- source_word: υἱός
  choice: anak na lalaki
  rationale: Tumpak na pinananatili ang tiyak na kasarian ng υἱός.
- source_word: ἠσθένει
  choice: may sakit
  rationale: Natural at malinaw na tumutukoy sa pisikal na karamdaman sa kontekstong ito.
- source_word: Καφαρναούμ
  choice: Capernaum
  rationale: Karaniwang anyo ng pangalan ng lugar sa modernong Filipino.
theological_decisions:
- issue: Paglalarawan sa βασιλικός nang hindi nag-aangkin ng tiyak na katungkulan sa korte ni Herodes Antipas
  choice: opisyal ng hari
  alternative: taong maharlika; tauhan ng hari
  rationale: Ipinananatili ang kaugnayan sa isang hari o maharlikang paglilingkod, ngunit hindi ipinapalagay ang eksaktong ranggo, tungkulin, o uring panlipunan ng lalaki.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “siya” alinsunod sa agarang konteksto nang hindi idinaragdag ang pangalang Jesus sa talata. Inilagay ang mga panandang talababa kaagad pagkatapos ng mga pariralang tinutukoy ng mga ito.
