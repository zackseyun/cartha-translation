revisions:
- from: Nang marinig ng lalaking ito na dumating si Jesus sa Galilea mula sa Judea, pinuntahan niya si Jesus at patuloy na hiniling na bumaba ito[a] at pagalingin ang kanyang anak, sapagkat malapit na itong mamatay.
  to: Nang marinig ng lalaking ito na dumating si Jesus mula sa Judea patungong Galilea, pinuntahan niya si Jesus at patuloy siyang humiling kay Jesus na bumaba[a] at pagalingin ang kanyang anak na lalaki, sapagkat malapit nang mamatay ang anak niyang lalaki.
  rationale: Inayos ang pagbanggit sa mga tauhan upang alisin ang kalabuan ng mga panghalip, ginawang mas likas ang pagpapahayag ng imperfect na ἠρώτα, at tahasang isinalin ang υἱόν bilang “anak na lalaki.” Nanatiling maingat ang “patuloy siyang humiling,” na kumikilala sa duratibo o posibleng paulit-ulit na puwersa ng imperfect nang hindi ito ginagawang masidhi kaysa sa pinahihintulutan ng teksto.
