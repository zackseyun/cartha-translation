id: JHN.4.47
reference: John 4:47
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὗτος ἀκούσας ὅτι Ἰησοῦς ἥκει ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν ἀπῆλθεν πρὸς αὐτὸν καὶ ⸀ἠρώτα ἵνα καταβῇ καὶ ἰάσηται αὐτοῦ τὸν υἱόν, ἤμελλεν γὰρ ἀποθνῄσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/047.yaml
  text: When this man heard that Jesus had come from Judea into Galilee[a], he went to him and asked him to come down and heal his son[b], for he was about to die.
translation:
  language: tl
  text: Nang marinig ng lalaking ito na dumating si Jesus mula sa Judea patungong Galilea, pinuntahan niya si Jesus at patuloy siyang humiling kay Jesus na bumaba[a] at pagalingin ang kanyang anak na lalaki, sapagkat malapit nang mamatay ang anak niyang lalaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “bumaba” ay nagpapahiwatig ng pagbaba mula sa mas mataas na lugar patungo sa kinaroroonan ng bata.
    reason: cultural_note
lexical_decisions:
- source_word: οὗτος
  choice: ang lalaking ito
  rationale: Tumutukoy ito sa opisyal na binanggit sa naunang talata at pinananatili ang puwersa ng demonstratibo.
- source_word: ἀκούσας
  choice: Nang marinig
  rationale: Likas na temporal na salin ng aorist participle sa makabagong Tagalog.
- source_word: ἥκει ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν
  choice: dumating si Jesus sa Galilea mula sa Judea
  rationale: Ipinapahayag ang pagdating at parehong pinagmulan at patutunguhan sa natural na ayos sa Tagalog.
- source_word: ἀπῆλθεν πρὸς αὐτόν
  choice: pinuntahan niya si Jesus
  rationale: Malinaw at likas na ipinahihiwatig ang paglapit ng lalaki kay Jesus; iniiwasan din ang malabong sunod-sunod na panghalip.
- source_word: ἠρώτα
  choice: patuloy na hiniling
  rationale: Ipinakikita ang duratibo o paulit-ulit na posibilidad ng imperfect nang hindi dinaragdagan ang leksikal na tindi tungo sa ‘nagmakaawa.’
- source_word: ἵνα καταβῇ
  choice: na bumaba ito
  rationale: Likas na komplemento ng paghiling at pinananatili ang pandiwang tumutukoy sa pagbaba ng kinaroroonan.
- source_word: ἰάσηται
  choice: pagalingin
  rationale: Karaniwan, malinaw, at angkop na salita para sa pisikal na pagpapagaling.
- source_word: αὐτοῦ τὸν υἱόν
  choice: ang kanyang anak
  rationale: Likas na Tagalog para sa genitibong pagmamay-ari; sa konteksto, anak na lalaki ang tinutukoy.
- source_word: ἤμελλεν γὰρ ἀποθνῄσκειν
  choice: sapagkat malapit na itong mamatay
  rationale: Tumpak na ipinahahayag ang nalalapit na kamatayan at ginagawang malinaw na ang anak ang tinutukoy.
theological_decisions:
- issue: Tinutukoy ng ‘malapit nang mamatay’
  choice: Ang anak ng opisyal
  alternative: Si Jesus o ang opisyal
  rationale: Ang anak ang pinakamalapit at malinaw na tinutukoy batay sa balarila at konteksto.
- issue: Aspekto ng ἠρώτα
  choice: patuloy na hiniling
  alternative: hiniling
  rationale: Maaaring magpahiwatig ng nagpapatuloy o paulit-ulit na kilos ang imperfect. Pinananatili ng salin ang aspektong ito nang hindi ginagawang ‘nagmakaawa,’ na maaaring lumabis sa leksikal na saysay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘patuloy na hiniling’ upang maipakita ang posibleng duratibong puwersa ng imperfect. Inulit ang pangalang ‘Jesus’ at ginamit ang ‘ito’ para mabawasan ang kalituhan sa mga panghalip.
