  text: λέγει αὐτῷ ἡ γυνή· Κύριε, θεωρῶ ὅτι προφήτης εἶ σύ.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/019.yaml
  text: The woman said to him[a], “Lord, I see that you are a prophet.”
translation:
  language: tl
  text: Sinabi ng babae sa kanya, “Panginoon[a], nakikita kong isa kang propeta.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ginoo.” Ang salitang Griyego na κύριε ay maaaring magalang na pantawag at maaari ring mangahulugang “Panginoon.”
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: Sinabi
  rationale: Ang historikal na pangkasalukuyan sa salaysay na Griyego ay likas na isinasalin sa nagdaang panahunan sa modernong Tagalog.
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Karaniwang anyo para sa di-tuwirang layon ng pagsasalita.
- source_word: ἡ γυνή
  choice: ang babae
  rationale: Tumutukoy ito sa babaeng Samaritana sa salaysay, hindi sa isang asawa.
- source_word: Κύριε
  choice: Panginoon
  rationale: Pinananatili ang karaniwang salin ng κύριος, habang inilalahad sa talababa ang posibleng magalang na pakahulugang “Ginoo.”
- source_word: θεωρῶ
  choice: nakikita ko
  rationale: Ipinahahayag dito ang pagkilala o pagkaunawa ng babae batay sa ibinunyag ni Jesus; natural at malinaw sa Tagalog ang “nakikita ko.”
- source_word: ὅτι
  choice: -ng
  rationale: Ang pang-ugnay na “-ng” sa “nakikita kong” ay likas na nagpapakilala sa nilalaman ng kanyang pagkilala.
- source_word: προφήτης
  choice: isa kang propeta
  rationale: Ang pangngalan ay walang pantukoy at nagpapakilalang si Jesus ay isang propeta, hindi tahasang “ang Propeta.”
- source_word: σύ
  choice: ka
  rationale: Nakapaloob sa panghalip na “ka” ang tahasang ikalawang panauhan; hindi na kailangan ang artipisyal na pagdidiin sa Tagalog.
theological_decisions:
- issue: Ang κύριος bilang pantawag kay Jesus
  choice: Panginoon
  alternative: Ginoo
  rationale: Maaaring magalang na pantawag lamang ito sa konteksto at hindi pa ganap na pagpapahayag tungkol sa pagkakakilanlan ni Jesus. Pinanatili sa pangunahing teksto ang “Panginoon” at sa talababa ang tunay na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “isa kang propeta” upang malinaw na mapanatili ang di-tiyak na diwa ng anarthrous predicate noun.
