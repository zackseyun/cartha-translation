id: JHN.4.44
reference: John 4:44
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: αὐτὸς ⸀γὰρ Ἰησοῦς ἐμαρτύρησεν ὅτι προφήτης ἐν τῇ ἰδίᾳ πατρίδι τιμὴν οὐκ ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/044.yaml
  text: For Jesus himself testified that a prophet has no honor in his own homeland[a].
translation:
  language: tl
  text: Sapagkat si Jesus mismo ang nagpatotoo na ang isang propeta ay walang karangalan sa sarili niyang bayan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa sarili niyang lupain” o “sa sarili niyang lugar na pinagmulan.” Ang salitang Griyego na πατρίς ay maaaring tumukoy sa sariling bayan, lupain, o rehiyong pinagmulan.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag na ugnayan ng pangungusap sa nakapaligid na salaysay.
- source_word: αὐτὸς ... Ἰησοῦς
  choice: si Jesus mismo
  rationale: Pinananatili ang diin ng αὐτός sa natural na ayos ng modernong Tagalog.
- source_word: ἐμαρτύρησεν
  choice: nagpatotoo
  rationale: Pinananatili ang mahalagang bokabularyo ng pagpapatotoo sa Juan at malinaw pa rin sa karaniwang mambabasa.
- source_word: προφήτης
  choice: ang isang propeta
  rationale: Ang anyong walang pantukoy ay may diwang pangkalahatan at kasabihan; natural itong ipinahahayag sa Tagalog bilang “ang isang propeta.”
- source_word: ἐν τῇ ἰδίᾳ πατρίδι
  choice: sa sarili niyang bayan
  rationale: Ang πατρίς ay tumutukoy sa sariling lupain, bayan, o lugar na pinagmulan; ang “sarili niyang bayan” ay natural at hindi nagtatakda kung Judea, Galilea, o Nazaret ang tinutukoy.
- source_word: τιμὴν οὐκ ἔχει
  choice: ay walang karangalan
  rationale: Malapit sa literal na kayarian at pinananatili ang pangngalang τιμή bilang “karangalan.”
theological_decisions:
- issue: Ang tinutukoy at saklaw ng “sarili niyang bayan” sa konteksto ng Juan
  choice: Panatilihin ang pangkalahatang kasabihan nang hindi tinutukoy ang eksaktong lugar.
  alternative: Tukuyin ito bilang Judea, Galilea, o Nazaret.
  rationale: Hindi tahasang pinapangalanan ng talata ang lugar, kaya hindi dapat lutasin sa salin ang nananatiling interpretatibong tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa salaysay. Ginamit ang “bayan” bilang malawak at likas na katumbas ng πατρίς, habang ipinapakita sa talababa ang iba pang posibleng kahulugan.
