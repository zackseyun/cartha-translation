  yaml_path: translation/nt/john/004/008.yaml
  text: For his disciples had gone away into the city to buy food[a][b].
translation:
  language: tl
  text: Sapagkat nagtungo na sa bayan ang kanyang mga alagad upang bumili ng pagkain.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: Sapagkat
  rationale: Nagbibigay ang γάρ ng paliwanag sa naunang pahayag; malinaw na pinananatili ng “Sapagkat” ang ugnayang ito.
- source_word: μαθηταὶ αὐτοῦ
  choice: ang kanyang mga alagad
  rationale: Likas na ayos sa Tagalog para sa pariralang nagtataglay; ang “mga alagad” ang karaniwang katumbas ng μαθηταί sa salaysay ng Juan.
- source_word: ἀπεληλύθεισαν
  choice: umalis na
  rationale: Ang anyong pluperfect ay tumutukoy sa pag-alis na naganap bago ang kasalukuyang tagpo; ipinahihiwatig ito nang natural ng “umalis na.”
- source_word: εἰς τὴν πόλιν
  choice: papunta sa bayan
  rationale: Ipinapahayag ng εἰς ang patutunguhan. Sa kontekstong Samaritano, mas natural sa modernong Tagalog ang “bayan” kaysa “lungsod,” nang hindi binabago ang diwa ng πόλις.
- source_word: ἵνα
  choice: upang
  rationale: Ipinakikilala ng ἵνα ang layunin, na malinaw at marangal na ipinahahayag ng “upang.”
- source_word: τροφὰς
  choice: pagkain
  rationale: Tumutukoy ang πληural na τροφάς sa pagkain o panustos; ang pangmaramihang diwa nito ay natural na naipapahayag sa Tagalog sa pamamagitan ng mass noun na “pagkain.”
- source_word: ἀγοράσωσιν
  choice: bumili
  rationale: Ang aorist subjunctive kasunod ng ἵνα ay nagsasaad ng nilalayong kilos; “bumili” ang payak at eksaktong katumbas.
