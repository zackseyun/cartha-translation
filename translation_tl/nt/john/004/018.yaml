base_translation:
  language: en
  yaml_path: translation/nt/john/004/018.yaml
  text: For you have had five husbands[a], and the man you now have is not your husband; this you have said truly.
translation:
  language: tl
  text: Sapagkat nagkaroon ka na ng limang asawa[a], at ang lalaking kasama mo ngayon ay hindi mo asawa. Totoo ang sinabi mo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “nagkaroon ka na ng limang lalaki, at ang mayroon ka ngayon ay hindi mo lalaki/asawa.” Ang salitang Griyego na ἀνήρ ay maaaring mangahulugang “lalaki” o “asawa”; sa kontekstong ito, mas angkop ang “asawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πέντε γὰρ ἄνδρας ἔσχες
  choice: Sapagkat nagkaroon ka na ng limang asawa
  rationale: Ang γάρ ay nagpapaliwanag kung bakit totoo ang sinabi ng babae, kaya natural ang “sapagkat.” Bagaman maaaring mangahulugan ang ἀνήρ ng “lalaki” o “asawa,” malinaw na “asawa” ang diwa sa konteksto. Ipinahihiwatig ng “nagkaroon ka na” ang nakaraang karanasan na may kaugnayan sa kasalukuyan.
- source_word: καὶ νῦν ὃν ἔχεις
  choice: at ang lalaking kinakasama mo ngayon
  rationale: Sa kontekstong ito, ang literal na “ang mayroon ka ngayon” ay hindi likas at maaaring magtunog mapang-angkin sa Filipino. Malinaw at natural na ipinahahayag ng “kinakasama” ang kasalukuyang ugnayan nang hindi ipinapalagay na kasal sila.
- source_word: οὐκ ἔστιν σου ἀνήρ
  choice: ay hindi mo asawa
  rationale: Ang σου at ἀνήρ ay tumutukoy sa ugnayang mag-asawa; pinananatili ng salin ang tuwirang pagsalungat sa naunang “limang asawa.”
- source_word: τοῦτο ἀληθὲς εἴρηκας
  choice: Totoo ang sinabi mo
  rationale: Likas itong Filipino at tapat sa diwang “ito ay sinabi mong totoo.” Napananatili rin nito ang bisa ng perfect εἴρηκας bilang nasabing pahayag na kinikilalang totoo ngayon.
theological_decisions:
- issue: Kahulugan ng ἀνήρ sa dalawang paglitaw
  choice: Isinalin ang una bilang “asawa” at ang ikalawa rin bilang “asawa,” habang “lalaki” ang tahasang paksa sa sugnay tungkol sa kasalukuyang kasama.
  alternative: Isalin nang higit na literal bilang “limang lalaki” at “hindi mo lalaki/asawa.”
  rationale: Pinapaboran ng kaagad na konteksto ang kahulugang marital na “asawa.” Gayunman, nililinaw ng “ang lalaking kinakasama mo ngayon” na ang kasalukuyang lalaki ay hindi niya asawa, nang hindi nagdaragdag ng hatol tungkol sa eksaktong katangian ng kanilang pagsasama.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang “kinakasama” upang maipahayag nang idiomatiko ang relational na gamit ng ἔχω, ngunit iniwasang magdagdag ng detalye tungkol sa relasyon na wala sa Griyego.
