  text: although Jesus himself was not baptizing[a], but his disciples were—
translation:
  language: tl
  text: bagaman hindi si Jesus mismo ang nagbabautismo kundi ang kaniyang mga alagad—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καίτοιγε
  choice: bagaman
  rationale: Nagpapakilala ito ng paglilinaw na may diwang pagpap concessive kaugnay ng naunang pahayag. Likas at malinaw sa modernong Tagalog ang “bagaman.”
- source_word: Ἰησοῦς αὐτὸς
  choice: si Jesus mismo
  rationale: 'Pinananatili ng “mismo” ang diin ng αὐτός: hindi personal na si Jesus ang nagsasagawa ng pagbabautismo.'
- source_word: οὐκ ἐβάπτιζεν
  choice: hindi ... ang nagbabautismo
  rationale: Ipinahihiwatig ng anyong imperfect ang nagpapatuloy o nakaugaliang gawain. Ang “nagbabautismo” ay natural sa Tagalog at naihahatid ang aspektong di-ganap.
- source_word: ἀλλ’
  choice: kundi
  rationale: Pagkatapos ng negatibong sugnay, natural na ipinakikita ng “kundi” ang tuwirang pagtutol at pagwawasto kung sino ang aktuwal na nagbabautismo.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ang kaniyang mga alagad
  rationale: Karaniwang salin ng μαθηταί ang “mga alagad.” Nauunawaan mula sa unang sugnay ang hindi inulit na pandiwang “nagbabautismo,” kaya napapanatili ang elipsis ng Griyego.
theological_decisions:
- issue: Paglilinaw kung sino ang nagsagawa ng pagbabautismo sa ministeryo ni Jesus
  choice: Hindi si Jesus mismo ang personal na nagbabautismo; ang kaniyang mga alagad ang gumagawa nito.
  alternative: “Hindi nagbautismo si Jesus, kundi ang kaniyang mga alagad.”
  rationale: Pinananatili ng salin ang diin sa “si Jesus mismo” at ang nagpapatuloy o nakaugaliang aspekto ng imperfect, nang walang idinaragdag na paliwanag na teolohikal.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “nagbabautismo” upang mapanatili ang aspektong imperfect, at “kundi” upang maging natural ang kontrast pagkatapos ng negatibong sugnay. Pinanatili ang gitling sa dulo dahil parentetikong paglilinaw ang talata sa loob ng nagpapatuloy na pangungusap.
