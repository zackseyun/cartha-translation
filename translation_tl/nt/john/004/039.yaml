  text: Ἐκ δὲ τῆς πόλεως ἐκείνης πολλοὶ ἐπίστευσαν εἰς αὐτὸν τῶν Σαμαριτῶν διὰ τὸν λόγον τῆς γυναικὸς μαρτυρούσης ὅτι Εἶπέν μοι πάντα ⸀ἃ ἐποίησα.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/039.yaml
  text: And many of the Samaritans from that town believed in him because of the word of the woman who was testifying, “He told me everything I did.”
translation:
  language: tl
  text: At marami sa mga Samaritano mula sa bayang iyon ang sumampalataya sa kanya dahil sa sinabi[a] ng babaeng nagpapatotoo, “Sinabi niya sa akin ang lahat ng ginawa ko.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dahil sa mensahe” o “dahil sa ulat.” Ang salitang Griego na λόγος ay maaaring mangahulugang “salita,” “sinabi,” “mensahe,” o “ulat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐκ δὲ τῆς πόλεως ἐκείνης
  choice: At ... mula sa bayang iyon
  rationale: Ipinapahayag ng ἐκ ang pinagmulan, at natural sa modernong Tagalog ang “mula sa bayang iyon.” Isinalin ang banayad na pang-ugnay na δέ bilang “At.”
- source_word: πολλοὶ ... τῶν Σαμαριτῶν
  choice: marami sa mga Samaritano
  rationale: 'Pinananatili nito ang partitive na diwa: marami mula sa pangkat ng mga Samaritano.'
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: sumampalataya sa kanya
  rationale: Ang πιστεύω na may εἰς ay tumutukoy sa paniniwala o pagtitiwalang nakatuon sa isang tao. Ang “sumampalataya sa kanya” ay tumpak at likas sa kontekstong ito.
- source_word: διὰ τὸν λόγον
  choice: dahil sa sinabi
  rationale: Ang διά na may accusative ay nagsasaad ng dahilan. Sa kontekstong pasalaysay, likas ang “sinabi,” habang itinatala sa talababa ang posibleng diwang “mensahe” o “patotoo.”
- source_word: τῆς γυναικὸς μαρτυρούσης
  choice: ng babaeng nagpapatotoo
  rationale: Pinananatili ng “nagpapatotoo” ang kasalukuyan at patuloy na diwa ng participle μαρτυρούσης at ang bokabularyo ng pagpapatotoo sa Juan.
- source_word: Εἶπέν μοι
  choice: Sinabi niya sa akin
  rationale: Tuwirang katumbas at natural sa Tagalog ang “sinabi niya sa akin” para sa λέγω na may di-tuwirang layon.
- source_word: πάντα ἃ ἐποίησα
  choice: ang lahat ng ginawa ko
  rationale: Pinananatili ang malawak na saklaw ng πάντα ἃ at likas na isinasalin ang aorist ἐποίησα bilang “ginawa ko,” nang hindi nagdaragdag ng aspektong hindi tahasang kailangan.
theological_decisions:
- issue: Diwa ng πιστεύω εἰς sa gamit ni Juan
  choice: sumampalataya sa kanya
  alternative: naniwala sa kanya; nagtiwala sa kanya
  rationale: Ipinahahayag nito ang pananampalatayang nakatuon kay Jesus nang hindi nililimitahan ang ulat sa simpleng pagtanggap na totoo ang kanyang sinabi o pinalalawak ito tungo sa isang partikular na sistematikong kategorya.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “bayan” sa halip na “lungsod” bilang natural na tawag sa pamayanang Samaritano, at “nagpapatotoo” upang mapanatili ang mahalagang bokabularyo ni Juan.
