source:
  edition: SBLGNT
  text: ὡς οὖν ἦλθον πρὸς αὐτὸν οἱ Σαμαρῖται, ἠρώτων αὐτὸν μεῖναι παρ’ αὐτοῖς· καὶ ἔμεινεν ἐκεῖ δύο ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/040.yaml
  text: So when the Samaritans came to him[a], they asked him to stay with them, and he stayed there two days.
translation:
  language: tl
  text: Kaya nang lumapit sa kanya ang mga Samaritano, patuloy nilang hiniling[a] na manatili siya sa kanila. At nanatili siya roon nang dalawang araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hiniling nila.” Ang pandiwang Griyego ay nasa imperfect at maaaring magpahiwatig ng patuloy o paulit-ulit na paghiling.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς οὖν
  choice: Kaya nang
  rationale: Likas na ipinapahayag ang ugnayang pasunod o bunga ng οὖν at ang panahong ipinahihiwatig ng ὡς.
- source_word: ἦλθον πρὸς αὐτὸν
  choice: lumapit sa kanya
  rationale: Sa konteksto, malinaw nitong ipinahahayag ang pagkilos patungo kay Jesus nang hindi tunog-saling-tuwiran.
- source_word: οἱ Σαμαρῖται
  choice: ang mga Samaritano
  rationale: Tuwirang katawagan sa pangkat-etniko at natural sa modernong Filipino.
- source_word: ἠρώτων
  choice: patuloy nilang hiniling
  rationale: Pinananatili ang duratibo o posibleng paulit-ulit na aspekto ng imperfect, habang ang 'hiniling' ay angkop sa kahilingang manatili siya.
- source_word: μεῖναι παρ’ αὐτοῖς
  choice: na manatili siya sa kanila
  rationale: Ang μένω ay 'manatili,' at ang παρά na may dative ay tumutukoy sa pananatiling kasama o kapiling nila.
- source_word: καὶ ἔμεινεν ἐκεῖ
  choice: At nanatili siya roon
  rationale: Pinananatili ang pagkakatugma sa naunang μένω at tahasang isinasalin ang ἐκεῖ.
- source_word: δύο ἡμέρας
  choice: nang dalawang araw
  rationale: Natural na Filipino para sa accusative of duration na tumutukoy sa haba ng pananatili.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang “patuloy nilang hiniling” upang ilantad sa teksto ang aspektong maaaring taglay ng imperfect, ngunit nilagyan ng talababa ang mas payak na alternatibo.
