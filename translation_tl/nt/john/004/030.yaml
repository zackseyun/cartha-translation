  text: They went out of the city and were coming to him[a].
translation:
  language: tl
  text: Lumabas sila mula sa lungsod at papunta sila sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Lumabas sila mula sa lungsod at papalapit sa kanya.”
    reason: Ipinapakita ng alternatibo ang patuloy na aspekto ng imperfect na ἤρχοντο sa pamamagitan ng “papalapit.”
lexical_decisions:
- source_word: ἐξῆλθον
  choice: Lumabas
  rationale: Ang aorist ng ἐξέρχομαι ay nagsasaad ng paglabas mula sa isang takdang lugar; natural at tuwiran ang “lumabas” sa Filipino.
- source_word: ἐκ τῆς πόλεως
  choice: ng lungsod
  rationale: Sa pariralang “lumabas ng lungsod,” likas sa Filipino ang “ng” upang ipahayag ang pinanggalingang loob ng lugar. Ang πόλις ay isinaling “lungsod,” ang karaniwang katumbas nito.
- source_word: ἤρχοντο
  choice: papunta na
  rationale: Ipinahihiwatig ng imperfect ang nagaganap at hindi pa tapos na paglapit. Natural na naipapahayag ito ng “papunta na” nang hindi ipinapalagay na nakarating na sila.
- source_word: πρὸς αὐτόν
  choice: sa kanya
  rationale: Ang πρός na may accusative ay nagsasaad ng pagkilos patungo sa isang tao; idiomatiko sa Filipino ang “papunta sa kanya.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na simple, marangal, at madaling maunawaan. Pinanatili ang pagkakaiba ng natapos na paglabas at nagpapatuloy na pagpunta. Ang reperent ng “kanya” ay hindi tahasang pinalitan ng “Jesus” sapagkat panghalip ang nasa Griyego.
