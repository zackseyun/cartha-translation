  text: Μετὰ δὲ τὰς δύο ἡμέρας ἐξῆλθεν ⸀ἐκεῖθεν εἰς τὴν Γαλιλαίαν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/043.yaml
  text: After the two days[a], he departed from there for Galilee.
translation:
  language: tl
  text: Pagkaraan ng dalawang araw, umalis siya roon patungong Galilea.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ δὲ τὰς δύο ἡμέρας
  choice: Pagkaraan ng dalawang araw
  rationale: Ang μετά na may accusative ay nagsasaad ng panahong kasunod, kaya natural ang “pagkaraan.” Ang dalawang araw ay tumutukoy sa naunang binanggit na pananatili; hindi na kailangang tumbasan nang hiwalay ang mahinang pang-ugnay na δέ sa Filipino.
- source_word: ἐξῆλθεν
  choice: umalis siya
  rationale: Bagaman literal na “lumabas,” sa salaysay ng paglalakbay ay mas natural at tumpak ang “umalis” para sa paglayo sa dating lugar.
- source_word: ἐκεῖθεν
  choice: roon
  rationale: Tumutukoy ito sa lugar na pinanggalingan ni Jesus sa naunang konteksto; sapat at natural ang “roon” kasunod ng “umalis.”
- source_word: εἰς τὴν Γαλιλαίαν
  choice: patungong Galilea
  rationale: Ang εἰς ay nagpapahayag ng pagkilos tungo sa destinasyon. Malinaw at likas sa Filipino ang “patungong Galilea.”
theological_decisions: []
translation_notes:
  register: Gumamit ng maikli, dignificado, at kasalukuyang Filipino. Hindi isinama ang footnote ng English consultation layer dahil ang alternatibong “to Galilee” ay pagkakaibang pang-estilo lamang sa Ingles at kapuwa likas na naipapahayag ng “patungong Galilea” sa Filipino.
