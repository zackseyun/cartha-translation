  naturalness: Natural at marangal sa modernong Filipino ang “Ito muli ang ikalawang tanda ... matapos siyang dumating sa Galilea mula sa Judea.” Mas malinaw ito kaysa sa pagkakabit ng “muling” sa “ginawa.”
  terminology: Ang “tanda” ay angkop para sa σημεῖον sa Juan at dapat panatilihin. Ang talababa para sa “himala” ay wasto, ngunit bahagyang pinakinis ang paliwanag upang maging higit na idiomatiko.
