  yaml_path: translation/nt/john/004/054.yaml
  text: This again was the second sign Jesus did after coming from Judea into Galilee[a].
translation:
  language: tl
  text: Ito muli ang ikalawang tanda na ginawa ni Jesus matapos siyang dumating sa Galilea mula sa Judea.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “himala.” Madalas gamitin ni Juan ang “tanda” upang idiin hindi lamang ang kapangyarihan nito kundi pati ang kahulugang itinuturo nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: Ito
  rationale: Tumutukoy pabalik sa pagpapagaling na katatapos lamang isalaysay; natural at malinaw ang “Ito” sa Filipino.
- source_word: δὲ πάλιν
  choice: muling
  rationale: Ang δέ ay banayad na pang-ugnay, samantalang malinaw na ipinahihiwatig ng πάλιν ang pag-uulit; sapat at natural na naihahatid ito ng “muling” nang hindi nagdaragdag ng mabigat na “ngunit” o “at.”
- source_word: δεύτερον
  choice: ikalawang
  rationale: Tuwirang pinananatili ang bilang at pagkakasunod ng tandang tinutukoy.
- source_word: σημεῖον
  choice: tanda
  rationale: 'Pinananatili nito ang mahalagang gamit ni Juan: ang makapangyarihang gawa ay hindi lamang himala kundi palatandaang nagtuturo sa mas malalim na kahulugan at pagkakakilanlan ni Jesus.'
- source_word: ἐποίησεν
  choice: ginawa
  rationale: Karaniwang katumbas ng ποιέω at likas na kaagapay ng “tanda” sa Filipino.
- source_word: ἐλθὼν
  choice: nang dumating siya
  rationale: Ipinapahayag ang temporal na ugnayan ng aorist participle sa pangunahing pandiwa nang natural, habang hindi labis na iginigiit ang isang mahigpit na pagbasa na “pagkatapos.”
- source_word: ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν
  choice: sa Galilea mula sa Judea
  rationale: Malinaw na pinananatili ang pinagmulan at patutunguhan ng paglalakbay sa natural na ayos ng Filipino.
theological_decisions:
- issue: Ang terminong σημεῖον sa Ebanghelyo ni Juan
  choice: tanda
  alternative: himala
  rationale: Ang “tanda” ay nagpapanatili sa pampanitikan at teolohikal na diin ni Juan na ang gawa ay tumuturo lampas sa kapangyarihang ipinamalas. Inilalagay sa talababa ang “himala” bilang leksikal na alternatibo nang hindi pinapalitan ang pangunahing terminong ginagamit ni Juan.
- issue: Pagbibilang sa tandang ito bilang “ikalawa”
  choice: ikalawang tanda
  alternative: ikalawang tandang ginawa ni Jesus sa Galilea
  rationale: Hindi dinaragdagan ang teksto ng paliwanag tungkol sa saklaw ng pagbibilang; pinananatili ang maikli at bahagyang masinsing pahayag ng Griyego.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “tanda” upang mapanatili ang natatanging bokabularyo ni Juan, at ang “nang dumating siya” upang maging natural ang temporal na participle sa Filipino.
