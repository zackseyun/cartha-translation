revisions:
- from: Kaya sinabi sa kanya ng babaeng Samaritana, “Ikaw ay isang Judio, at ako ay isang babaeng Samaritana. Bakit ka humihingi sa akin ng maiinom?” (Sapagkat hindi nakikitungo ang mga Judio sa mga Samaritano.)[a]
  to: Kaya sinabi sa kanya ng babaeng Samaritana, “Paanong ikaw, na isang Judio, ay humihingi sa akin ng maiinom, gayong ako’y isang babaeng Samaritana?” (Sapagkat hindi nakikitungo ang mga Judio sa mga Samaritano.)[a]
  rationale: Pinalitan ang “Bakit” ng “Paanong” upang maipakita ang mapagtakang Πῶς nang hindi binabago ang kahulugan. Pinag-ugnay ang pagiging Judio at pagiging Samaritanang babae sa kahilingan, gaya ng ginagawa ng Griyego. Inayos nang bahagya ang pananalita ng talababa para sa mas malinaw na Filipino habang pinananatili ang alternatibong leksikal na saklaw.
