base_translation:
  language: en
  yaml_path: translation/nt/john/004/009.yaml
  text: So the Samaritan woman said to him[a], “How is it that you, being a Jew, ask for a drink from me, a Samaritan woman?” (For Jews do not associate with Samaritans.)
translation:
  language: tl
  text: Kaya sinabi sa kanya ng babaeng Samaritana, “Paanong ikaw, na isang Judio, ay humihingi sa akin ng maiinom, gayong ako’y isang babaeng Samaritana?” (Sapagkat hindi nakikitungo ang mga Judio sa mga Samaritano.)[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “Sapagkat walang pakikitungo ang mga Judio sa mga Samaritano.” Posible ring mas tiyak ang diwa: hindi sila gumagamit nang magkakasama ng mga bagay, gaya ng mga sisidlang inuman.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει οὖν
  choice: Kaya sinabi
  rationale: Pinananatili ng “kaya” ang puwersang nag-uugnay o nagsusulong sa salaysay ng οὖν, habang natural sa makabagong Filipino.
- source_word: ἡ γυνὴ ἡ Σαμαρῖτις
  choice: ang babaeng Samaritana
  rationale: Natural nitong ipinahahayag ang tiyak na pagkakakilanlan, kasarian, at pangkat ng babae.
- source_word: Πῶς
  choice: Bakit
  rationale: Sa konteksto, ipinahahayag ng tanong ang pagkagulat sa hindi karaniwang kahilingan; mas natural sa Filipino ang “Bakit” kaysa literal na “Paano” sa ganitong gamit.
- source_word: Ἰουδαῖος
  choice: Judio
  rationale: Ang kaibahan dito ay sa pagitan ng mga pamayanang Judio at Samaritano, hindi lamang ng mga rehiyon ng Judea at Samaria.
- source_word: παρ’ ἐμοῦ πεῖν αἰτεῖς
  choice: humihingi sa akin ng maiinom
  rationale: Malinaw at likas na Filipino ito para sa kahilingang uminom, nang hindi ipinapalagay kung tubig o sisidlan ang tuwirang hinihingi.
- source_word: γυναικὸς Σαμαρίτιδος οὔσης
  choice: at ako ay isang babaeng Samaritana
  rationale: Ginagawang malinaw sa natural na Filipino ang batayan ng pagkagulat ng babae habang pinananatili ang kaniyang sariling pagtukoy sa kasarian at pangkat.
- source_word: συγχρῶνται
  choice: nakikitungo
  rationale: Sinasaklaw nito ang pangkalahatang pakikipag-ugnayan sa lipunan; pinananatili sa talababa ang posibleng mas tiyak na diwang hindi paggamit o pagbabahagi ng mga bagay.
theological_decisions:
- issue: Kahulugan ng Ἰουδαῖος sa konteksto ni Juan
  choice: Judio
  alternative: taga-Judea
  rationale: Ang talata ay naghahambing ng dalawang panlipunan at panrelihiyong pamayanan, kaya higit na angkop ang “Judio” kaysa sa panrehiyong “taga-Judea.”
- issue: Saklaw ng συγχρῶνται
  choice: pangkalahatang pakikitungo
  alternative: hindi paggamit o pagbabahagi ng mga bagay, gaya ng sisidlang inuman
  rationale: Maaaring tumukoy ang pandiwa sa malawak na pakikipag-ugnayan o sa mas tiyak na paggamit nang magkasama. Ang pangunahing teksto ay gumagamit ng malawak na kahulugan, at inilalahad sa talababa ang mas tiyak na posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Samaritana” at “Samaritano” bilang karaniwang katawagan sa Bibliyang Filipino. Inayos ang tanong sa natural na ayos ng Filipino, ngunit pinanatili ang pagkagulat at ang panlipunang tensiyon sa orihinal.
