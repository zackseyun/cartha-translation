source:
  edition: SBLGNT
  text: μὴ σὺ μείζων εἶ τοῦ πατρὸς ἡμῶν Ἰακώβ, ὃς ἔδωκεν ἡμῖν τὸ φρέαρ καὶ αὐτὸς ἐξ αὐτοῦ ἔπιεν καὶ οἱ υἱοὶ αὐτοῦ καὶ τὰ θρέμματα αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/012.yaml
  text: Are you greater than our father Jacob[a], who gave us the well and drank from it himself, as did his sons and his livestock?
translation:
  language: tl
  text: Hindi ka naman mas dakila kaysa sa aming amang si Jacob[a], hindi ba? Siya ang nagbigay sa amin ng balon, at siya mismo ay uminom mula rito, gayundin ang kanyang mga anak na lalaki at mga alagang hayop.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Mas dakila ka ba kaysa sa aming amang si Jacob?” Ang tanong sa Griyego na may μή ay nagpapahiwatig na inaasahan ang sagot na “hindi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ σὺ
  choice: Mas dakila ka ba
  rationale: Ginawang retorikal na tanong sa natural na Tagalog. Ang μή ay nagpapahiwatig na inaasahan ng nagsasalita ang sagot na hindi; ipinaliliwanag ito sa talababa upang hindi gawing tahasang pagtanggi ang pangunahing teksto. Ang diin sa σὺ ay naihahatid ng tuwirang pagtatanong kay Jesus.
- source_word: μείζων
  choice: mas dakila kaysa
  rationale: Tumutukoy ito sa kadakilaan o katayuan, hindi sa pisikal na laki. Likas at marangal sa Tagalog ang “mas dakila kaysa.”
- source_word: τοῦ πατρὸς ἡμῶν Ἰακώβ
  choice: sa aming amang si Jacob
  rationale: Pinananatili ang katawagang pampamilya at pangkarangalan na “ama,” na nagpapahayag ng pag-angkin ng babae sa kanilang minanang kaugnayan kay Jacob.
- source_word: ἔδωκεν ἡμῖν τὸ φρέαρ
  choice: nagbigay sa amin ng balon
  rationale: Ang payak na naganap na aspekto ay angkop sa aorist, at “balon” ang malinaw na katumbas ng φρέαρ sa kontekstong ito.
- source_word: καὶ αὐτὸς ἐξ αὐτοῦ ἔπιεν
  choice: Siya mismo ay uminom mula rito
  rationale: Pinananatili ng “siya mismo” ang diin ng αὐτός, habang malinaw na tumutukoy ang “rito” sa balon.
- source_word: οἱ υἱοὶ αὐτοῦ
  choice: ang kanyang mga anak na lalaki
  rationale: Tiyak na panlalaki ang υἱοί; kaya hindi ito pinalawak sa pangkalahatang “mga anak.”
- source_word: τὰ θρέμματα αὐτοῦ
  choice: mga alagang hayop
  rationale: Saklaw nito ang mga domestikadong hayop na tinutukoy ng θρέμματα nang hindi ito nililimitahan sa baka lamang.
theological_decisions:
- issue: Lakas ng retorikal na tanong na pinasimulan ng μή
  choice: Retorikal na tanong na inaasahang sasagutin ng “hindi”
  alternative: “Hindi ka naman mas dakila kaysa sa aming amang si Jacob, hindi ba?”
  rationale: Pinananatili ng pangunahing salin ang anyong tanong at ang hamon ng babae, samantalang nililinaw sa talababa ang inaasahang negatibong sagot. Hindi nito ginagawang tahasang pahayag ang isang tanong sa Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “amang si Jacob” upang panatilihin ang wikang pangkanunuan, “mga anak na lalaki” para sa tiyak na kasarian ng υἱοί, at “mga alagang hayop” bilang likas at malawak na katumbas ng θρέμματα. Hinati sa dalawang pangungusap para sa malinaw at natural na daloy nang hindi binabago ang ugnayan ng mga sugnay.
