id: JHN.4.20
reference: John 4:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἱ πατέρες ἡμῶν ἐν τῷ ὄρει τούτῳ προσεκύνησαν· καὶ ὑμεῖς λέγετε ὅτι ἐν Ἱεροσολύμοις ἐστὶν ὁ τόπος ὅπου ⸂προσκυνεῖν δεῖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/020.yaml
  text: Our fathers worshiped on this mountain[b][a], and you say that in Jerusalem is the place where one must worship.
translation:
  language: tl
  text: “Sumamba ang aming mga ninuno[a] sa bundok na ito, at sinasabi naman ninyo na nasa Jerusalem ang lugar kung saan dapat sumamba.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “aming mga ama.”
    reason: lexical_alternative
  - marker: b
    text: O, “kung saan kailangang sumamba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πατέρες ἡμῶν
  choice: ang aming mga ninuno
  rationale: Sa konteksto, tumutukoy ito sa mga naunang salinlahi ng komunidad. Mas natural at malinaw sa makabagong Tagalog ang “mga ninuno” kaysa sa literal na “mga ama,” habang pinananatili ang pag-angkin sa minanang kasaysayan.
- source_word: ἐν τῷ ὄρει τούτῳ
  choice: sa bundok na ito
  rationale: Ang “sa” ang likas na panandang panlunan sa Tagalog para sa pagsambang ginawa sa bundok; hindi kailangang isalin nang mekanikal ang ἐν bilang “loob.”
- source_word: προσεκύνησαν
  choice: sumamba
  rationale: Bagaman maaaring tumukoy ang προσκυνέω sa pagyukod o pagpapatirapa, ang usapan dito ay tungkol sa lugar ng relihiyosong pagsamba, kaya “sumamba” ang malinaw at angkop.
- source_word: καὶ ὑμεῖς λέγετε
  choice: at sinasabi naman ninyo
  rationale: Pinanatili ng “at” ang koordinatibong καὶ, samantalang natural na ipinahihiwatig ng “naman” ang paghahambing o pagsalungat sa pagitan ng “aming mga ninuno” at ng tahasang ὑμεῖς nang hindi ginagawang “ngunit” ang pang-ugnay.
- source_word: ἐν Ἱεροσολύμοις
  choice: nasa Jerusalem
  rationale: Ito ang natural na paraan sa Tagalog upang tukuyin ang lokasyon ng lugar; hindi kailangang katawanin ang anyong maramihan ng Griyegong pangalan ng lungsod.
- source_word: ὁ τόπος
  choice: ang lugar
  rationale: Pinananatili nito ang katiyakan ng pangngalan nang hindi idinaragdag ang mas interpretibong “tamang lugar.”
- source_word: ὅπου προσκυνεῖν δεῖ
  choice: kung saan dapat sumamba
  rationale: Ang walang-tiyak-na-tauhang pagkakabuo sa Tagalog ay likas na naghahatid ng pangkalahatang pangangailangan o obligasyong ipinapahayag ng δεῖ, nang hindi nagdaragdag ng partikular na simuno.
theological_decisions:
- issue: Kung tahasang papangalanan ang mga Samariano at mga Judio sa paghahambing
  choice: Hindi idinagdag ang mga katawagang “Samariano” at “Judio”; pinanatili ang paghahambing sa “aming mga ninuno” at “ninyo.”
  alternative: “Ang aming mga ninunong Samariano … ngunit kayong mga Judio ay nagsasabi …”
  rationale: Makikita sa konteksto ang mga pagkakakilanlan, ngunit hindi sila tahasang pinapangalanan sa talatang Griyego. Ang pagdaragdag sa kanila ay lalampas sa sinasabi ng teksto.
- issue: Ang bisa ng pangangailangan sa προσκυνεῖν δεῖ
  choice: “kung saan dapat sumamba”
  alternative: “kung saan kailangang sumamba”
  rationale: Ipinahahayag ng δεῖ ang pangkalahatang pangangailangan o obligasyon tungkol sa lugar ng pagsamba. Ang “dapat” ay natural at may sapat na normatibong lakas sa Tagalog; inilalahad sa talababa ang mas tahasang “kailangang” bilang leksikal na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “ninuno” para sa likas na pagtukoy sa mga naunang salinlahi, at “naman” upang marinig ang kontras na nasa tahasang mga panghalip ng Griyego nang hindi pinalalakas nang labis ang pang-ugnay.
