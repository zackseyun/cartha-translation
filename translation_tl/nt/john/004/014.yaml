  text: ὃς δ’ ἂν πίῃ ἐκ τοῦ ὕδατος οὗ ἐγὼ δώσω αὐτῷ, οὐ μὴ ⸀διψήσει εἰς τὸν αἰῶνα, ἀλλὰ τὸ ὕδωρ ὃ δώσω αὐτῷ γενήσεται ἐν αὐτῷ πηγὴ ὕδατος ἁλλομένου εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/014.yaml
  text: But whoever drinks from the water that I will give him will never thirst forever; rather, the water that I will give him will become in him a spring of water welling up to eternal life.
translation:
  language: tl
  text: Ngunit ang sinumang uminom ng tubig na ibibigay ko sa kanya ay hindi na mauuhaw magpakailanman. Sa halip, ang tubig na ibibigay ko sa kanya ay magiging bukal ng tubig sa loob niya, na bumabalong tungo sa buhay na walang hanggan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ μὴ διψήσει εἰς τὸν αἰῶνα
  choice: hindi na mauuhaw magpakailanman
  rationale: Pinananatili ang mariing pagtanggi ng οὐ μή at ang pangmatagalang diwa ng εἰς τὸν αἰῶνα sa likas na modernong Tagalog.
- source_word: πηγὴ ὕδατος
  choice: bukal
  rationale: Ang πηγή ay likas na tumutukoy sa bukal o pinagmumulan ng umaagos na tubig; hindi kailangang ulitin ang “ng tubig” sa Tagalog dahil malinaw na ito sa konteksto.
- source_word: ἁλλομένου
  choice: bumabalong
  rationale: Ipinapahayag ang masigla at patuloy na pag-ahon o pagbulwak ng tubig mula sa isang bukal.
- source_word: εἰς ζωὴν αἰώνιον
  choice: tungo sa buhay na walang hanggan
  rationale: Pinananatili ng “tungo sa” ang direksiyon o kinalabasan na ipinahihiwatig ng εἰς nang hindi nilulutas nang higit sa teksto ang ugnayan ng bukal at buhay.
theological_decisions:
- issue: Ang saklaw ng pangakong hindi na mauuhaw
  choice: hindi na mauuhaw magpakailanman
  alternative: hinding-hindi na mauuhaw
  rationale: Isinama nang hayag ang εἰς τὸν αἰῶνα upang mapanatili ang temporal na diin ng Griyego, habang ang “hindi na” ay nagpapahiwatig ng mariing pagtanggi sa konteksto.
- issue: Ang ugnayan ng bumabalong na bukal at buhay na walang hanggan
  choice: bumabalong tungo sa buhay na walang hanggan
  alternative: bumabalong upang magbigay ng buhay na walang hanggan
  rationale: Iniiwasang idagdag ang tahasang ideya ng pagbibigay o sanhi, sapagkat ang teksto ay gumagamit lamang ng εἰς at nagpapanatili ng mas maluwag na ugnayan ng direksiyon o kinalabasan.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “sa loob niya” upang malinaw at idiomatiko ang ἐν αὐτῷ, at hinati sa dalawang pangungusap para sa madaling pagbasa nang hindi binabago ang lohikal na pagsalungat.
