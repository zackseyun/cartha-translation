  text: he left Judea and went back to Galilee[a].
translation:
  language: tl
  text: Iniwan niya ang Judea at bumalik sa Galilea.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “muling pumunta sa Galilea.” Maaaring isalin na “muli” ang salitang Griego na πάλιν, ngunit dito ay malamang na tumutukoy ito sa pagbabalik, kaya “bumalik” ang ginamit sa teksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφῆκεν
  choice: iniwan
  rationale: Sa kontekstong ito, ang aorist ng ἀφίημι ay nangangahulugang umalis sa isang lugar at iwan iyon; natural at tuwiran ang “iniwan” kasunod ng layong “ang Judea.”
- source_word: τὴν Ἰουδαίαν
  choice: ang Judea
  rationale: Karaniwang anyong Filipino ang “Judea” para sa heograpikong rehiyon sa konteksto ng Ebanghelyo.
- source_word: ἀπῆλθεν
  choice: bumalik
  rationale: Bagaman ang ἀπῆλθεν mismo ay tumutukoy sa pag-alis o pagpunta, kasama ng πάλιν ay natural itong isalin bilang “bumalik” upang ipahayag ang pagbabalik sa Galilea.
- source_word: πάλιν
  choice: bumalik
  rationale: Sa konteksto ng paglalakbay, malamang na ipinahihiwatig ng πάλιν ang pagbabalik, kaya isinama ang diwa nito sa pandiwang “bumalik”; pinananatili sa talababa ang literal na alternatibong “muling pumunta.”
- source_word: εἰς τὴν Γαλιλαίαν
  choice: sa Galilea
  rationale: Ang εἰς ay nagsasaad ng patutunguhan; natural sa Filipino ang “sa Galilea” kasunod ng “bumalik.”
