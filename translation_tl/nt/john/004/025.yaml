base_translation:
  language: en
  yaml_path: translation/nt/john/004/025.yaml
  text: The woman said to him[a], “I know that Messiah is coming” (the one called Messiah). “When he comes, he will tell us all things.”
translation:
  language: tl
  text: Sinabi ng babae sa kanya, “Alam kong darating ang Mesiyas[a]—ang tinatawag na Cristo. Kapag dumating siya, ipaaalam niya sa amin ang lahat.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Mesiyas” ay Semitikong titulo; ipinaliliwanag ito rito ng Griyegong titulo na “Cristo.” Kapuwa silang nangangahulugang “Pinahiran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: Sinabi
  rationale: Ginamit ang karaniwang nagdaang panahunan sa makabagong salaysay sa Filipino, bagaman historical present ang Griyego.
- source_word: γυνή
  choice: ang babae
  rationale: Tumutukoy ito sa babaeng Samaritana sa konteksto, hindi sa isang asawa.
- source_word: Οἶδα
  choice: Alam ko
  rationale: Direkta, natural, at malinaw na katumbas sa Filipino.
- source_word: Μεσσίας
  choice: Mesiyas
  rationale: Karaniwang anyong Filipino ng Semitikong titulong tumutukoy sa pinahiran.
- source_word: ἔρχεται
  choice: darating
  rationale: May hinaharap na diwa ang present tense dito; natural itong ipinahahayag sa Filipino sa pamamagitan ng aspektong kontemplatibo.
- source_word: ὁ λεγόμενος χριστός
  choice: ang tinatawag na Cristo
  rationale: Pinananatili ang paliwanag ng teksto mula sa Semitikong “Mesiyas” tungo sa Griyegong titulong “Cristo,” sa halip na pag-isahin ang dalawang termino.
- source_word: ὅταν ἔλθῃ ἐκεῖνος
  choice: Pagdating niya
  rationale: Natural na Filipino para sa tiyak na pangyayaring inaasahan sa hinaharap; naipahihiwatig ng “niya” ang tinutukoy na persona nang hindi pilit ang “ang isang iyon.”
- source_word: ἀναγγελεῖ
  choice: ipahahayag niya
  rationale: Masaklaw nito ang diwang ipaaalam o ilalahad nang malinaw, at angkop sa marangal na rehistro.
- source_word: ἡμῖν
  choice: sa amin
  rationale: Pinananatili ang unang panauhang maramihan na hindi kabilang ang kausap, ayon sa likas na gamit ng Filipino.
- source_word: ἅπαντα
  choice: ang lahat ng bagay
  rationale: Pinananatili ang malawak at komprehensibong saklaw ng salitang Griyego.
theological_decisions:
- issue: Paglalahad sa magkasunod na Μεσσίας at χριστός
  choice: “Mesiyas—ang tinatawag na Cristo” sa pangunahing teksto
  alternative: Isalin ang dalawang titulo bilang “Mesiyas,” o gawing “ang Pinahiran” ang ikalawa
  rationale: 'Magkaibang anyo ang sadyang magkatabi sa Griyego: ang Semitikong Μεσσίας ay ipinaliliwanag sa pamamagitan ng Griyegong χριστός. Pinananatili ng “Mesiyas” at “Cristo” ang bilingguwal na paliwanag ng ebanghelista nang hindi nagdaragdag ng doktrinal na interpretasyon.'
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “Sinabi” sa halip na literal na historical present, at “Pagdating niya” para sa maayos na daloy. Ang gitling bago ang paliwanag ay nagpapanatili sa appositional na ugnayan ng dalawang titulo.
