  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Λέγει ⸀αὐτῇ· Ὕπαγε φώνησον ⸂τὸν ἄνδρα σου⸃ καὶ ἐλθὲ ἐνθάδε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/016.yaml
  text: He said to her[a], “Go, call your husband, and come here.”
translation:
  language: tl
  text: Sinabi niya sa babae[a], “Pumunta ka at tawagin ang asawa mo, saka ka pumarito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Sinabi niya sa kanya” o, ayon sa anyong pangkasalukuyan ng Griyego, “Sinasabi niya sa babae.” Karaniwan sa salaysay na Griyego ang paggamit ng pangkasalukuyang anyo para sa pangyayaring nagdaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγει
  choice: Sinabi niya
  rationale: Ang pangkasalukuyang anyo sa Griyego ay historical present sa salaysay. Ginamit ang pangnagdaan upang maging natural sa modernong Tagalog, habang inilalahad sa talababa ang literal na alternatibo.
- source_word: αὐτῇ
  choice: sa babae
  rationale: Tinutukoy ng panghalip ang babaeng kausap ni Jesus. Mas malinaw at natural dito ang “sa babae” kaysa sa posibleng malabong “sa kanya.”
- source_word: Ὕπαγε
  choice: Pumunta ka
  rationale: Tuwirang utos itong umalis muna upang gawin ang kasunod na ipinagagawa. Ang “Pumunta ka” ay malinaw at kasalukuyang gamit.
- source_word: φώνησον
  choice: tawagin
  rationale: Sa konteksto, nangangahulugan itong tawagin o sunduin ang isang tao. Pinananatili ng “tawagin” ang payak at tuwirang diwa nang hindi dinaragdagan ang kahulugang “sunduin.”
- source_word: τὸν ἄνδρα σου
  choice: ang asawa mo
  rationale: Bagaman maaaring mangahulugang “lalaki” ang ἀνήρ, ang κonteksto at ang pang-angking σου ay tumutukoy rito sa asawa ng babae.
- source_word: καὶ
  choice: saka
  rationale: 'Iniuugnay nito ang dalawang utos na may likas na pagkakasunod-sunod: tumawag muna, pagkatapos ay pumarito. Ang “saka” ay natural sa Tagalog at hindi binabago ang lohikal na ugnayan.'
- source_word: ἐλθὲ ἐνθάδε
  choice: pumarito
  rationale: Pinagsasama ng likas na pandiwang Tagalog na “pumarito” ang “come” at “here.” Hindi ginamit ang “bumalik” upang hindi idagdag ang ideya ng pagbabalik na ipinahihiwatig lamang, ngunit hindi tahasang sinasabi, ng Griyego.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “pumarito” bilang maikli at likas na katumbas ng “come here”; bahagya itong mas pormal kaysa “halika rito” ngunit mas angkop sa sunod-sunod na utos at sa estilo ng salaysay.
