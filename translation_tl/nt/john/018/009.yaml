  text: ἵνα πληρωθῇ ὁ λόγος ὃν εἶπεν ὅτι Οὓς δέδωκάς μοι οὐκ ἀπώλεσα ἐξ αὐτῶν οὐδένα.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/009.yaml
  text: 'so that the word that he had spoken might be fulfilled: “Of those whom you have given me[a], I lost not one.”'
translation:
  language: tl
  text: 'upang matupad ang salitang sinabi niya: “Sa mga ibinigay mo sa akin, wala akong naiwala kahit isa[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “wala akong naiwala sa kanila” o “wala akong naiwala ni isa sa kanila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: upang
  rationale: Likas na ipinapahayag sa Filipino ang layunin o kinalabasan, habang pinananatili ang puwersa ng sugnay na Griyego.
- source_word: πληρωθῇ
  choice: matupad
  rationale: Ang pasibong anyo ay tumutukoy sa pagsasakatuparan ng naunang sinabi ni Jesus; ang “matupad” ang karaniwang marangal at malinaw na salin sa ganitong konteksto.
- source_word: ὁ λόγος ὃν εἶπεν
  choice: ang salitang sinabi niya
  rationale: Tumutukoy ang λόγος sa isang tiyak na pahayag ni Jesus, hindi sa titulong “Salita.” Pinananatili ng salin ang Johannine na paggamit ng “salita” nang hindi ito ginagawang teknikal na titulo.
- source_word: Οὓς δέδωκάς μοι
  choice: Sa mga ibinigay mo sa akin
  rationale: Pinananatili nito ang partitive na ayos ng Griyego at inihahanda ang mariing “ni isa.” Ang aspektong ganap ng “ibinigay” ay likas sa Filipino at nagpapahiwatig ng natapos na pagbibigay na nananatiling mahalaga.
- source_word: ἀπώλεσα
  choice: naiwala
  rationale: Sa konteksto ng pag-iingat ni Jesus sa mga alagad, ang diwa ay pagkawala mula sa kanyang pangangalaga, hindi aktibong pagwasak. Ang “naiwala” ay natural at pinananatili ang kaugnayan sa naunang sinabi ni Jesus.
- source_word: ἐξ αὐτῶν οὐδένα
  choice: wala akong naiwala ni isa
  rationale: Ipinapahayag ng “ni isa” ang mariing diwa ng Griyego na walang kahit isang nawala mula sa kanila.
theological_decisions:
- issue: Ang uri ng katuparan ng sinabi ni Jesus
  choice: Isinalin ang πληρωθῇ bilang “matupad” na tumutukoy sa naunang salita ni Jesus.
  alternative: “magkatotoo”
  rationale: Ginagamit ni Juan ang wika ng katuparan hindi lamang sa Kasulatan kundi pati sa sariling sinabi ni Jesus. Pinananatili ng “matupad” ang bigat ng banal na layunin at pagsasakatuparan sa salaysay nang hindi ito sapilitang tinatawag na pormal na propesiya.
- issue: Ang kahulugan ng ἀπώλεσα tungkol sa mga alagad
  choice: “wala akong naiwala” sa diwa ng pag-iingat sa mga ipinagkatiwala kay Jesus
  alternative: “wala akong hinayaang mapahamak” o “wala akong winasak”
  rationale: Ang agarang konteksto ay ang pagprotekta ni Jesus sa kanyang mga alagad sa oras ng pagdakip, na umaalingawngaw sa Juan 17:12. Pinananatili ng “naiwala” ang talinghaga at teolohikal na tensiyon nang hindi nagdaragdag ng mas makitid na sistemang doktrinal.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa pampublikong pagbasa. Pinanatili ang bahagyang pormal na “matupad ang salitang sinabi niya” upang maipakita ang bokabularyo at diin ng tekstong Griyego.
