  source_fidelity: 'Tapat ang salin sa SBLGNT: kinikilala si Caifas sa nauna niyang pagpapayo sa mga Ἰουδαίοις, at wasto ang pagsasalin ng συμφέρει bilang “mas mabuti,” ng ἕνα ἄνθρωπον bilang “isang tao,” at ng ὑπὲρ τοῦ λαοῦ bilang “para sa bayan.” Ang hindi pagsasalin nang tahasan sa banayad na δέ ay likas sa Tagalog at hindi pagkawala ng mahalagang kahulugan.'
