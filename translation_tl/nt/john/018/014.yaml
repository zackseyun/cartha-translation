id: JHN.18.14
reference: John 18:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἦν δὲ Καϊάφας ὁ συμβουλεύσας τοῖς Ἰουδαίοις ὅτι συμφέρει ἕνα ἄνθρωπον ⸀ἀποθανεῖν ὑπὲρ τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/014.yaml
  text: Caiaphas was the one who had advised the Jews that it was better for one man to die for the people[a][b].
translation:
  language: tl
  text: Si Caifas ang nagpayo sa mga Judio na mas mabuting isang tao ang mamatay para sa bayan[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga pinunong Judio” o “sa mga taga-Judea,” depende sa pagkaunawa sa paggamit ni Juan ng katawagang “mga Judio” sa kontekstong ito.
    reason: alternative_reading
  - marker: b
    text: O “alang-alang sa bayan” o “bilang kinatawan ng bayan”; sa konteksto, maaari ring magkaroon ang parirala ng diwang sakripisyal o panghalili.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: ang
  rationale: Ang δέ ay banayad na pang-ugnay sa salaysay at hindi kailangang tumbasan ng tahasang panandang pandiskurso sa natural na Tagalog; ang ἦν ay likas na naipahahayag sa di-pandiwang sugnay na may “ang.”
- source_word: Καϊάφας
  choice: Caifas
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa Bibliyang Tagalog.
- source_word: ὁ συμβουλεύσας
  choice: ang nagpayo
  rationale: Ipinakikilala ng may-artikulong aorist participle si Caifas sa pamamagitan ng nauna niyang ginawa. Sapat na ipinahihiwatig ng konteksto at aspektong Tagalog ng “nagpayo” na dati na niya itong ginawa.
- source_word: τοῖς Ἰουδαίοις
  choice: sa mga Judio
  rationale: Pinananatili ang hindi nilimitahang katawagan sa Griyego sa halip na tahasang gawing “mga pinunong Judio”; inilalahad sa talababa ang posibleng kontekstuwal na saklaw.
- source_word: ὅτι συμφέρει
  choice: na mas mabuti
  rationale: Natural at malinaw na Tagalog para sa ideya ng kapakinabangan o pagiging higit na makabubuti sa kontekstong pampolitika.
- source_word: ἕνα ἄνθρωπον
  choice: isang tao
  rationale: Pinananatili ang bilang na isa; ang “tao” ay eksaktong katumbas ng ἄνθρωπος at natural sa Tagalog, habang ang konteksto ang tumutukoy kay Jesus.
- source_word: ἀποθανεῖν
  choice: ang mamatay
  rationale: Tuwirang salin ng infinitive bilang sugnay na gumaganap na paksa ng “mas mabuti.”
- source_word: ὑπὲρ τοῦ λαοῦ
  choice: para sa bayan
  rationale: Ang “para sa” ay nagpapanatili sa posibleng kahulugang kapakinabangan, pagkatawan, o paghahain nang hindi tahasang nilulutas ang ugnayan; ang “bayan” ay natural na kolektibong tawag sa λαός sa kontekstong ito.
theological_decisions:
- issue: Posibleng diwa ng pagtubos, paghahalili, o pagkatawan sa ὑπὲρ τοῦ λαοῦ
  choice: para sa bayan
  alternative: alang-alang sa bayan; bilang kinatawan ng bayan; kapalit ng bayan
  rationale: Maaaring magpahiwatig ang ὑπέρ ng kapakinabangan o pagkatawan at magkaroon ng sakripisyal o panghaliling alingawngaw sa salaysay ni Juan. Hindi ginawang tahasan sa pangunahing teksto ang “kapalit” upang hindi ipasok ang mas tiyak na pagbasa kaysa sa mismong parirala.
- issue: Saklaw ng τοῖς Ἰουδαίοις sa paggamit ni Juan
  choice: sa mga Judio
  alternative: sa mga pinunong Judio; sa mga taga-Judea
  rationale: Walang tahasang salitang naglilimita sa katawagan sa orihinal. Pinananatili ng pangunahing teksto ang anyong iyon, samantalang inilalahad sa talababa ang mga posibleng pagbasa batay sa konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasan ang mabigat na “nagbigay ng payo” at ang artipisyal na panandang “Ngayon.” Ang “bayan” ay mas natural na kolektibong katawagan dito kaysa “mga tao,” at nananatiling naiiba sa salitang tumutukoy sa “bansa” sa mas malawak na sipi.
