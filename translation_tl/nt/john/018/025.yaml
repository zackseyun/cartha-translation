  naturalness: Malinaw at likas ang pangunahing salin sa modernong Filipino. Gayunman, ang “naman” sa negatibong tanong ay hindi kailangan upang maisalin ang μή o καὶ at bahagyang nagdaragdag ng pragmatikong diin na wala namang kailangang ipilit sa Griyego. Mas tuwiran at natural ang “Hindi ka rin ... , hindi ba?” Ang pangungusap sa talababa na “umaasang negatibo ang sagot” ay hindi gaanong likas; mas malinaw ang “ay nagpapahiwatig na negatibo ang inaasahang sagot.”
  terminology: Ang “mga alagad” ay angkop para sa μαθηταί, at ang “Simon Pedro” ay pamantayan at natural na anyo. Ang “itinanggi niya iyon” ay maingat na tumutukoy sa naunang paratang/tanong nang hindi dinaragdagan ang elipsis ng Griyego.
