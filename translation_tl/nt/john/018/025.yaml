  to: Nakatayo si Simon Pedro at nagpapainit. Kaya sinabi nila sa kanya[a], “Hindi ka rin isa sa mga alagad niya, hindi ba?” Itinanggi niya iyon at sinabi, “Hindi ako.”
  rationale: Inalis ang di-kailangang “naman” upang mapanatiling tuwiran ang negatibong tanong habang nananatili ang inaasahang negatibong tugon. Inayos din ang pananalita ng talababa para sa mas likas at malinaw na Filipino. Walang binago sa kahulugan o sa saklaw ng pagtanggi ni Pedro.
