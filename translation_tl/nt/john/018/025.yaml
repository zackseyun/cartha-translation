base_translation:
  language: en
  yaml_path: translation/nt/john/018/025.yaml
  text: Simon Peter was standing and warming himself. So they said to him[a], “You are not also one of his disciples, are you?” He denied it and said, “I am not.”
translation:
  language: tl
  text: Nakatayo si Simon Pedro at nagpapainit. Kaya sinabi nila sa kanya[a], “Hindi ka rin isa sa mga alagad niya, hindi ba?” Itinanggi niya iyon at sinabi, “Hindi ako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Tiyak na hindi ka rin isa sa mga alagad niya?” Ang tanong sa Griyego na may μή ay nagpapahiwatig na negatibo ang inaasahang sagot.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν δὲ Σίμων Πέτρος ἑστὼς
  choice: Nakatayo si Simon Pedro
  rationale: Ang δέ ay banayad na pang-ugnay sa pagpapatuloy ng salaysay at hindi kailangang tumbasan ng tahasang temporal na salita. Ang perpektong pandiwaring ἑστὼς ay nagsasaad ng patuloy na kalagayang nakatayo.
- source_word: θερμαινόμενος
  choice: nagpapainit
  rationale: Likas na Filipino ito para sa kilos na pagpapainit sa sarili. Hindi idinagdag ang “sa tabi ng apoy” dahil bagaman malinaw sa konteksto, hindi iyon tahasang nasa talatang ito.
- source_word: εἶπον οὖν αὐτῷ
  choice: Kaya sinabi nila sa kanya
  rationale: Ipinahihiwatig ng οὖν ang kaugnayang bunga o paghinuha sa daloy ng salaysay; natural itong ipinapahayag ng “kaya.” Ang anyong maramihan ng εἶπον ay pinanatili sa “nila.”
- source_word: Μὴ καὶ σὺ ... εἶ;
  choice: Hindi ka rin naman ... hindi ba?
  rationale: Pinananatili ng negatibong tanong at hulaping “hindi ba?” ang inaasahang negatibong sagot na ipinahihiwatig ng μή. Ang καὶ σὺ ay naipahayag sa “ka rin.”
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ
  choice: isa sa mga alagad niya
  rationale: Ang ἐκ na may genitive ay nagsasaad ng pagiging kabilang sa isang pangkat; “isa sa mga alagad niya” ang natural at tumpak na katumbas.
- source_word: ἠρνήσατο ἐκεῖνος
  choice: Itinanggi niya iyon
  rationale: Tinutukoy ng “iyon” ang paratang o ipinahihiwatig ng tanong, nang hindi pinalalawak ang pagtanggi lampas sa sinasabi ng teksto. Ang bahagyang diin ng ἐκεῖνος ay hindi nangangailangan ng mabigat na ekspresyon sa Filipino.
- source_word: Οὐκ εἰμί
  choice: Hindi ako
  rationale: Pinananatili nito ang maikli at tahasang pagtanggi sa Griyego, nang hindi idinaragdag ang ipinahihiwatig na “isa sa kanila.”
theological_decisions:
- issue: Saklaw ng pagtanggi ni Pedro
  choice: Inilahad ito bilang tuwirang pagtanggi na siya ay kabilang sa mga alagad ni Jesus.
  alternative: Palawakin bilang “Hindi ako isa sa kanila” o gawing pangkalahatang pagtanggi kay Jesus.
  rationale: Maikli at eliptikal ang Οὐκ εἰμί at umaalingawngaw sa tanong. Dapat panatilihin ang puwersang pasalaysay at hindi dagdagan ng mas malawak na teolohikal na pahayag.
translation_notes:
  register: Gumamit ng moderno, malinaw, at marangal na Filipino. Pinanatiling maikli ang huling pagtanggi at hindi nagdagdag ng detalyeng mula lamang sa nakapaligid na konteksto.
