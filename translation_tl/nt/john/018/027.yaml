  source_fidelity: 'Ang pangunahing diwa ay tapat sa Griyego: muling nagkaila si Pedro, at kaagad tumilaok ang tandang. Gayunman, ang “iyon” ay isang tahasang layon na wala sa Griyego. Hindi ito kailangan sa Tagalog, sapagkat natural na maaaring gamitin ang “nagkaila” nang walang layon sa kontekstong ito.'
