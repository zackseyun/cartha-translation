  text: Then Peter denied it again[a], and immediately a rooster crowed.
translation:
  language: tl
  text: Kaya muling nagkaila si Pedro, at agad tumilaok ang isang tandang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάλιν
  choice: muling
  rationale: Likas at maikling pang-abay na nagsasaad ng pag-uulit sa sunod-sunod na pagkakaila ni Pedro.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinahahayag ang ugnayang bunga o pagpapatuloy mula sa naunang tanong, nang hindi pinatitindi ang lohikal na puwersa.
- source_word: ἠρνήσατο
  choice: itinanggi iyon
  rationale: Ang pandiwa ay nangangahulugang tumanggi o magkaila. Walang tahasang layon sa Griyego, kaya ang “iyon” ay hinango lamang sa naunang tanong at minarkahan sa talababa.
- source_word: Πέτρος
  choice: Pedro
  rationale: Karaniwang anyo ng pangalang Peter sa makabagong saling Tagalog ng Biblia.
- source_word: καὶ
  choice: at
  rationale: Payak na pangatnig na nag-uugnay sa pagkakaila at sa kasunod na pangyayari.
- source_word: εὐθέως
  choice: agad
  rationale: Malinaw at likas na Tagalog para sa agarang pagsunod ng tilaok sa pagkakaila.
- source_word: ἀλέκτωρ
  choice: isang tandang
  rationale: Ang “tandang” ang pangkaraniwan at tiyak na tawag sa lalaking manok; idinagdag ang “isang” ayon sa natural na balarila ng Tagalog, hindi bilang pagtukoy sa isang partikular nang tandang.
- source_word: ἐφώνησεν
  choice: tumilaok
  rationale: Bagaman pangkalahatang tumutukoy ang pandiwa sa paglikha ng tunog o pagtawag, “tumilaok” ang eksaktong likas na pandiwa kapag tandang ang simuno.
