  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἵνα ὁ λόγος τοῦ Ἰησοῦ πληρωθῇ ὃν εἶπεν σημαίνων ποίῳ θανάτῳ ἤμελλεν ἀποθνῄσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/032.yaml
  text: so that the word of Jesus would be fulfilled[a], which he had spoken[c][b], indicating by what kind of death he was about to die.
translation:
  language: tl
  text: upang matupad ang sinabi ni Jesus[a], na sinabi niya bilang pahiwatig kung anong uri ng kamatayan ang malapit na niyang ikamatay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang salita ni Jesus”; tumutukoy ito rito sa kanyang sinabi o pahayag.
    reason: lexical_alternative
  - marker: b
    text: Ipinahiwatig ni Jesus ang paraan ng kanyang kamatayan—malamang ay ang pagpapako sa krus. Ihambing sa Juan 12:32–33.
    reason: cross_reference
lexical_decisions:
- source_word: ἵνα
  choice: upang
  rationale: Likas na panandang Filipino para sa layunin o resultang ipinahihiwatig ng sugnay.
- source_word: ὁ λόγος τοῦ Ἰησοῦ
  choice: ang sinabi ni Jesus
  rationale: Dito, ang λόγος ay tumutukoy sa isang pahayag ni Jesus, hindi sa titulong “Salita” sa Juan 1:1. Mas natural sa Filipino ang “sinabi” kaysa literal na “salita.”
- source_word: πληρωθῇ
  choice: matupad
  rationale: Pinananatili ang mahalagang wikang katuparan sa salaysay ni Juan, sa halip na pahinain ito bilang “magkatotoo” lamang.
- source_word: ὃν εἶπεν σημαίνων
  choice: ang sinabi niya na nagpapahiwatig
  rationale: Iniuugnay ang participle na σημαίνων sa naunang pagsasalita ni Jesus at pinananatili ang paliwanag na ang pahayag niya ay tumuturo sa paraan ng kanyang kamatayan.
- source_word: ποίῳ θανάτῳ
  choice: kung sa anong uri ng kamatayan
  rationale: Ipinakikita ng ποίῳ ang uri o paraan ng kamatayan, hindi lamang ang katotohanang mamamatay siya.
- source_word: ἤμελλεν ἀποθνῄσκειν
  choice: siya mamamatay
  rationale: Natural na Filipino para sa nalalapit o nakatakdang pangyayari sa konteksto, nang hindi nagdaragdag ng mas mariing determinism na hindi hinihingi ng μέλλω.
theological_decisions:
- issue: Wika ng katuparan kaugnay ng naunang pahayag ni Jesus
  choice: Panatilihin ang tahasang “matupad ang sinabi ni Jesus.”
  alternative: “magkatotoo ang sinabi ni Jesus”
  rationale: Ang πληρωθῇ ay bahagi ng mahalagang motibo ng katuparan sa Juan at nagpapakita ng awtoridad ng naunang pahayag ni Jesus.
- issue: Lakas ng μέλλω kaugnay ng kamatayan ni Jesus
  choice: 'Isalin nang payak bilang hinaharap: “siya mamamatay.”'
  alternative: “itinakda siyang mamatay” o “malapit na siyang mamatay”
  rationale: Hindi kailangang ipasok sa pandiwa ang mas malakas na pahayag tungkol sa predestinasyon; ipinakikita ng konteksto ang uri ng kamatayang haharapin niya.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sinabi” para sa likas na daloy, habang pinanatili ang “matupad” at ang hindi lubusang tinukoy na “uri ng kamatayan.”
