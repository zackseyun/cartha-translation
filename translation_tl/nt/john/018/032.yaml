    issue: Malabo at paulit-ulit ang pagsasalin ng ὃν εἶπεν σημαίνων.
    rationale: Ang “ang sinabi niya na nagpapahiwatig” ay maaaring magpahiwatig na ang “sinabi” mismo, sa halip na si Jesus sa pagsasalita, ang gumaganap ng pagpapahiwatig; inuulit din nito ang “sinabi.”
  - severity: low
    issue: Hindi naihahayag ang malapit na hinaharap ng ἤμελλεν.
