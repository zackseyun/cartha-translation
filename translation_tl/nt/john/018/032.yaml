  source_fidelity: Napananatili ng draft ang layuning ipinahihiwatig ng ἵνα, ang motibo ng katuparan sa πληρωθῇ, at ang diin ng ποίῳ sa uri ng kamatayan. Gayunman, ang “ang sinabi niya na nagpapahiwatig” ay hindi malinaw ang ugnayan ng relatibong sugnay at participle. Hindi rin naipahahayag ng payak na “siya mamamatay” ang aspektong malapit na hinaharap ng ἤμελλεν.
  naturalness: Hindi natural ang pag-uulit na “ang sinabi ni Jesus—ang sinabi niya.” Ang pagbabagong “na sinabi niya bilang pahiwatig” ay mas malinaw at dumadaloy nang maayos sa makabagong Filipino.
  terminology: Ang “matupad” ay angkop para sa πληρωθῇ, at ang “sinabi ni Jesus” ay wastong di-titular na pagsasalin ng λόγος sa kontekstong ito. Ang “ikamamatay” ay natural na paraan upang maipahayag ang uri ng kamatayan.
  issues:
