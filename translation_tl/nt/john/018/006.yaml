base_translation:
  language: en
  yaml_path: translation/nt/john/018/006.yaml
  text: So when he said to them[a], “I am he,” they went backward and fell to the ground.
translation:
  language: tl
  text: Kaya nang sabihin niya sa kanila[a], “Ako nga,” umatras sila at bumagsak sa lupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “Ako.” Ang pananalitang Griyego ay maaari ring umalingawngaw sa mga natatanging pahayag na “Ako nga” sa Ebanghelyo ni Juan.
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς οὖν
  choice: Kaya nang
  rationale: Pinagsasama nito ang ugnayang pasunod o inferensiyal ng οὖν at ang panahong diwa ng ὡς sa natural na Tagalog.
- source_word: εἶπεν αὐτοῖς
  choice: sabihin niya sa kanila
  rationale: Tuwirang katumbas na natural sa salaysay at pinananatili ang tagatanggap ng sinabi.
- source_word: Ἐγώ εἰμι
  choice: Ako nga
  rationale: Sa agarang konteksto, tugon ito bilang pagkilala sa sarili. Ang “Ako nga” ay likas na Filipino para sa ganitong tugon, habang inilalahad sa talababa ang mas literal na anyo at posibleng alingawngaw nito sa Ebanghelyo ni Juan.
- source_word: ἀπῆλθον εἰς τὰ ὀπίσω
  choice: napaurong sila
  rationale: Malinaw at natural na ipinahahayag ang paggalaw nila paatras; ang anyong “napaurong” ay angkop sa biglang reaksiyon sa tagpo nang hindi nagdaragdag ng tahasang sanhi.
- source_word: ἔπεσαν χαμαί
  choice: bumagsak sa lupa
  rationale: Pinananatili ang pisikal na kilos at ang direksiyon tungo sa lupa na ipinahahayag ng χαμαί.
theological_decisions:
- issue: Pagbibigay-kahulugan sa Ἐγώ εἰμι sa kontekstong Juanino na maaaring may mas malalim na alingawngaw
  choice: Ako nga
  alternative: Ako ay
  rationale: Mas pinapaboran ng agarang konteksto ang pagkilala ni Jesus sa sarili, kaya natural na Filipino ang ginamit sa pangunahing teksto. Gayunman, hindi inaalis ang literal at posibleng teolohikal na alingawngaw; pinananatili iyon sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “napaurong” sa halip na mas mekanikal na “pumunta sila paatras,” at pinanatili sa talababa ang tunay na ambiguwidad ng Ἐγώ εἰμι.
