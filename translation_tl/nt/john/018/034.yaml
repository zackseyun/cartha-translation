  text: ⸀ἀπεκρίθη Ἰησοῦς· ⸂Ἀπὸ σεαυτοῦ⸃ σὺ τοῦτο λέγεις ἢ ἄλλοι ⸂εἶπόν σοι⸃ περὶ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/034.yaml
  text: Jesus answered[a], “Are you saying this on your own, or did others tell you about me?”
translation:
  language: tl
  text: Sumagot si Jesus, “Sarili mo bang sinasabi ito, o may iba bang nagsabi sa iyo tungkol sa akin?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: Sumagot
  rationale: Karaniwan at natural na pandiwang pasalaysay para sa pagtugon ni Jesus sa naunang tanong.
- source_word: Ἀπὸ σεαυτοῦ
  choice: Ikaw ba mismo
  rationale: Ipinahihiwatig ang diin ng parirala sa personal na pinagmulan ng sinabi ni Pilato. Sa modernong Tagalog, likas itong nagpapahayag na ang sinabi ay nagmula mismo sa kaniya, nang hindi ipinapalagay ang mas malawak na motibo niya.
- source_word: σὺ
  choice: ikaw
  rationale: Pinananatili ang tahasang diin ng panghalip sa Griyego.
- source_word: τοῦτο λέγεις
  choice: ang nagsasabi nito
  rationale: Ang kasalukuyang anyo at ang pantukoy na τοῦτο ay natural na naihahayag bilang kasalukuyang pagsasabi tungkol sa naunang tanong ni Pilato.
- source_word: ἢ
  choice: o
  rationale: Tuwirang naghaharap ng ikalawang posibilidad.
- source_word: ἄλλοι
  choice: may ibang
  rationale: Natural na Tagalog para sa di-tiyak na ibang mga tao; ang pandiwang isahan sa Tagalog ay hindi nag-aalis sa maramihang diwa ng Griyego.
- source_word: εἶπόν σοι
  choice: nagsabi sa iyo
  rationale: Ang aorist ay likas na isinasalin sa aspektong naganap, at ang λέγω na may tagatanggap ay nangangahulugang magsabi sa isang tao.
- source_word: περὶ ἐμοῦ
  choice: tungkol sa akin
  rationale: Malinaw at karaniwang katumbas ng περί na may genitive.
theological_decisions:
- issue: Diin ng tanong ni Jesus kay Pilato
  choice: 'Ipinapakita ang dalawang posibleng pinagmulan ng sinabi ni Pilato: siya mismo o ang ibang tao.'
  alternative: “Sarili mo bang pagkukusa ang pagtatanong mo nito?”
  rationale: Nakatuon ang Griyego sa pinagmulan ng sinabi ni Pilato. Hindi idinaragdag sa salin ang pagpapakahulugan sa kaniyang motibo o ang isang mas malawak na paliwanag na teolohikal.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang “Ikaw ba mismo” upang maipahayag ang diin ng ἀπὸ σεαυτοῦ at ng tahasang σὺ nang hindi gumagamit ng alanganing literal na “mula sa iyong sarili.”
