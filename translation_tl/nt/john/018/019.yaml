  text: Ὁ οὖν ἀρχιερεὺς ἠρώτησεν τὸν Ἰησοῦν περὶ τῶν μαθητῶν αὐτοῦ καὶ περὶ τῆς διδαχῆς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/019.yaml
  text: So the high priest questioned Jesus about his disciples and about his teaching[a].
translation:
  language: tl
  text: Kaya tinanong ng punong pari si Jesus tungkol sa mga alagad niya at sa kanyang turo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tinanong nang masusi.” Ang pandiwang Griyego ay maaari ring isaling “nagtanong”; ang mas pormal na pananalita ay umaangkop sa konteksto ng pagdinig nang hindi ipinahihiwatig ang isang mas maigting na interogasyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Ipinahihiwatig ang pagpapatuloy at lohikal na kaugnayan sa naunang salaysay sa natural na modernong Tagalog.
- source_word: ἀρχιερεὺς
  choice: ang punong pari
  rationale: Karaniwang katumbas sa Tagalog ng tiyak at isahang titulo ng mataas na katungkulang panrelihiyon; hindi pinalitan ng pangalang Anas upang manatili sa mismong pahayag ng Griyego.
- source_word: ἠρώτησεν
  choice: tinanong
  rationale: Natural na saklaw nito ang pagtatanong sa isang pormal na pagdinig nang hindi ipinapalagay ang mas matinding diwa ng 'inisiyasat' o 'interinoga.'
- source_word: περὶ
  choice: tungkol sa
  rationale: Malinaw at natural na nagpapakilala sa dalawang paksa ng pagtatanong.
- source_word: μαθητῶν
  choice: mga alagad
  rationale: Itinatag na salin na nagpapanatili sa ugnayan ng guro at mga tinuturuan.
- source_word: διδαχῆς
  choice: kanyang itinuturo
  rationale: Natural at madaling maunawaan sa konteksto; iniiwasan ang mas teknikal at posibleng sistematikong pahiwatig ng 'doktrina.'
- source_word: αὐτοῦ
  choice: kanyang
  rationale: Malinaw na tumutukoy kay Jesus sa kapwa kanyang mga alagad at kanyang itinuturo.
theological_decisions:
- issue: Ang titulong ἀρχιερεύς sa kontekstong si Anas ang kaharap ni Jesus, bagaman si Caifas ang kinikilalang nanunungkulang punong pari ng Roma
  choice: Isalin nang tuwiran bilang “ang punong pari”
  alternative: “Si Anas na punong pari” o “ang pangulong pari”
  rationale: Sinusunod nito ang tiyak na titulo sa Griyego at pinananatili ang paglalahad ng ebanghelista nang hindi nagdaragdag ng pangalan o nagpapakilos ng historikal na pagkakasundo sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “punong pari” at “mga alagad” bilang pamilyar na mga katawagang biblikal, habang ang “kanyang itinuturo” ay mas natural kaysa sa teknikal na “doktrina.”
