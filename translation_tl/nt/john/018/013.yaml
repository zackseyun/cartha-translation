  rationale: Iningatan ng rebisyon ang pagkakasunod-sunod na ipinahihiwatig ng πρῶτον at ang konteksto ng pagdadala sa isang bilanggo. Ginawang tiyak ang relasyong πενθερός bilang «ama ng asawa ni Caifas» at nilinaw sa hiwalay na pangungusap na si Caifas, hindi si Anas, ang mataas na pari nang taong iyon. Ang paghahati sa dalawang pangungusap ay isang likas na ayos sa Filipino at hindi nagdaragdag ng interpretasyon.
