id: JHN.18.13
reference: John 18:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ⸀ἤγαγον πρὸς Ἅνναν πρῶτον· ἦν γὰρ πενθερὸς τοῦ Καϊάφα, ὃς ἦν ἀρχιερεὺς τοῦ ἐνιαυτοῦ ἐκείνου·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/013.yaml
  text: And they led him first to Annas, for he was the father-in-law of Caiaphas, who was high priest that year.
translation:
  language: tl
  text: At dinala muna nila si Jesus kay Anas, sapagkat si Anas ang ama ng asawa ni Caifas. Si Caifas ang mataas na pari nang taong iyon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤγαγον
  choice: dinala nila si Jesus
  rationale: Ang ἄγω ay maaaring mangahulugang ‘akayin’ o ‘dalhin.’ Sa konteksto ng pag-aresto at paglilipat sa kaniya habang nasa kustodiya, natural sa modernong Tagalog ang ‘dinala.’ Ipinangalan si Jesus bilang ipinahihiwatig na layon upang maging malinaw at natural ang pangungusap.
- source_word: πρὸς Ἅνναν
  choice: kay Anas
  rationale: Ang πρός na may accusative ay nagpapahiwatig ng paglapit o pagpunta sa isang tao; ang ‘kay Anas’ ang tuwiran at likas na katumbas.
- source_word: πρῶτον
  choice: muna
  rationale: Adberbyal itong nagpapakita ng pagkakasunod-sunod. Ang ‘muna’ ay likas sa Tagalog at malinaw na nagsasabing si Anas ang unang pinagdalhan kay Jesus.
- source_word: πενθερὸς
  choice: biyenan
  rationale: Tiyak na tumutukoy ang πενθερός sa ama ng asawa. Sa Tagalog, walang likas na iisang salitang eksklusibong nangangahulugang ‘father-in-law’; ang ‘biyenan’ ang karaniwang dignified na katawagan, at sapat ang konteksto para sa ugnayan.
- source_word: ἀρχιερεὺς
  choice: pinakapunong pari
  rationale: Tumutukoy ito sa natatanging pinakamataas na katungkulan ng paring Judio. Ang ‘pinakapunong pari’ ay malinaw at naihihiwalay sa mas malawak na katawagang ‘mga punong pari.’
- source_word: τοῦ ἐνιαυτοῦ ἐκείνου
  choice: nang taong iyon
  rationale: Likas na Tagalog itong panandang temporal at pinananatili ang pagtukoy ni Juan sa partikular na taon.
- source_word: Ἅνναν
  choice: Anas
  rationale: Ginamit ang nakagawiang anyong Tagalog ng pangalang Annas.
- source_word: Καϊάφα
  choice: Caifas
  rationale: Ginamit ang nakagawiang anyong Tagalog ng pangalang Caiaphas.
theological_decisions:
- issue: Tinutukoy ng ‘na siyang pinakapunong pari nang taong iyon’
  choice: Malinaw na tumutukoy ang sugnay kay Caifas.
  alternative: Maaaring magmukhang tumutukoy kay Anas kung hindi maingat ang ayos ng pangungusap.
  rationale: Sa Griyego, ang ὃς ay pinakanatural na tumutukoy sa pinakamalapit na antecedent na Καϊάφα. Pinananatili ng ‘na siyang’ kaagad pagkaraan ng ‘Caifas’ ang malinaw na ugnayang ito nang hindi nagdaragdag ng interpretasyong wala sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang ‘sapagkat’ para sa pormal ngunit madaling maunawaang salaysay, at ‘muna’ upang idiomatikong maipahayag ang pagkakasunod-sunod.
