id: JHN.18.36
reference: John 18:36
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Ἡ βασιλεία ἡ ἐμὴ οὐκ ἔστιν ἐκ τοῦ κόσμου τούτου· εἰ ἐκ τοῦ κόσμου τούτου ἦν ἡ βασιλεία ἡ ἐμή, οἱ ὑπηρέται ⸂οἱ ἐμοὶ ἠγωνίζοντο ἄν⸃, ἵνα μὴ παραδοθῶ τοῖς Ἰουδαίοις· νῦν δὲ ἡ βασιλεία ἡ ἐμὴ οὐκ ἔστιν ἐντεῦθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/036.yaml
  text: Jesus answered[a], “My kingdom is not from this world. If my kingdom were from this world, my servants would be fighting so that I might not be handed over to the Jews. But as it is, my kingdom is not from here.”
translation:
  language: tl
  text: Sumagot si Jesus, “Ang kaharian ko ay hindi nagmumula sa sanlibutang ito. Kung ang kaharian ko ay nagmumula sa sanlibutang ito, nakikipaglaban sana ang aking mga lingkod upang hindi ako maibigay sa mga Judio[a]. Ngunit ang totoo, ang kaharian ko ay hindi nagmumula rito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga taga-Judea”; maaaring mas partikular na tumukoy rito sa mga pinunong Judio sa Judea.
    reason: Pinananatili ang posibleng mas makitid na kontekstuwal na kahulugan ng Ἰουδαῖοι nang hindi nililimitahan ang pangunahing teksto.
lexical_decisions:
- source_word: βασιλεία
  choice: kaharian
  rationale: Natural at nakaugaliang katumbas ito na maaaring tumukoy kapwa sa nasasakupan at sa paghahari; ang paulit-ulit na pahayag sa talata ay malinaw at matatas sa salitang “kaharian.”
- source_word: ἐκ τοῦ κόσμου τούτου
  choice: nagmumula sa sanlibutang ito
  rationale: Tahasang ipinahihiwatig ng ἐκ ang pinagmulan. Pinananatili ng “nagmumula sa” na ang punto ay ang pinagmulan at katangian ng kaharian, hindi na wala itong kaugnayan o presensiya sa sanlibutan.
- source_word: κόσμος
  choice: sanlibutan
  rationale: Direktang katumbas na angkop sa bokabularyo ni Juan at nauunawaan sa makabagong Filipino; hinahayaan nitong ihatid ng konteksto ang diwang tumutukoy rin sa kasalukuyang kaayusan ng sangkatauhan.
- source_word: ὑπηρέται
  choice: mga lingkod
  rationale: Tumutukoy ito sa mga naglilingkod sa ilalim ng kapangyarihan. Ang “mga lingkod” ay bagay sa konteksto ng kaharian nang hindi ginagawang tiyak na mga opisyal o pulis ang tinutukoy.
- source_word: ἠγωνίζοντο ἄν
  choice: nakikipaglaban sana
  rationale: Ipinahihiwatig ng imperpekto na may ἄν ang nagpapatuloy na pagkilos sa isang kalagayang salungat sa katotohanan; likas na naihahatid ito ng “nakikipaglaban sana.”
- source_word: ἵνα μὴ παραδοθῶ
  choice: upang hindi ako maibigay
  rationale: Pinananatili ng “upang” ang layunin ng sugnay, at malinaw na inilalarawan ng “maibigay” ang pagsasailalim kay Jesus sa kapangyarihan ng iba nang hindi gumagamit ng makalumang pananalita.
- source_word: τοῖς Ἰουδαίοις
  choice: sa mga Judio
  rationale: Pinananatili sa pangunahing teksto ang malawak na leksikal na kahulugan, habang inilalahad sa talababa ang posibleng mas makitid na pagtukoy sa mga taga-Judea o sa mga pinunong Judio sa kontekstong ito.
- source_word: νῦν δὲ
  choice: Ngunit ang totoo
  rationale: Malinaw nitong ipinakikita ang kaibahan ng aktuwal na kalagayan sa ipinagpalagay na kalagayan sa naunang pangungusap.
- source_word: ἐντεῦθεν
  choice: nagmumula rito
  rationale: Pinananatili nito ang deiktikong “mula rito” at ang bahagyang pagbabago ng pananalita mula sa naunang “mula sa sanlibutang ito,” sa halip na gawing eksaktong pag-uulit.
theological_decisions:
- issue: Ang kaugnayan ng kaharian ni Jesus sa sanlibutan
  choice: “hindi nagmumula sa sanlibutang ito”
  alternative: “hindi bahagi ng sanlibutang ito” o “hindi ukol sa sanlibutang ito”
  rationale: Ang Griyego ay pangunahing nagsasaad ng pinagmulan, hindi ng lubos na kawalan ng presensiya o gawain ng kaharian sa sanlibutan. Pinananatili nito ang tensiyong teolohikal nang hindi ipinapasok ang ideya ng paglayo sa lahat ng makalupang realidad.
- issue: Ang tinutukoy ng Ἰουδαῖοι sa Ebanghelyo ni Juan
  choice: “mga Judio” sa teksto, na may paliwanag sa talababa
  alternative: “mga taga-Judea” o “mga pinunong Judio”
  rationale: Maaaring malawak o mas makitid ang saklaw ng salita ayon sa konteksto. Ang pangunahing salin ay nananatiling malapit sa Griyego, habang pinangangalagaan ng talababa ang kontekstuwal na posibilidad nang hindi ito ipinipilit sa teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “sanlibutan” dahil pamilyar ito sa wikang biblikal ngunit nananatiling malinaw; iniwasan ang labis na teknikal o sektaryong pananalita.
