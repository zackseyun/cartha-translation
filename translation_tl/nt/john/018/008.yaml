  text: ἀπεκρίθη Ἰησοῦς· Εἶπον ὑμῖν ὅτι ἐγώ εἰμι· εἰ οὖν ἐμὲ ζητεῖτε, ἄφετε τούτους ὑπάγειν·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/008.yaml
  text: Jesus answered[a], “I told you that I am he. So if you are seeking me, let these men go.”
translation:
  language: tl
  text: Sumagot si Jesus, “Sinabi ko na sa inyo na ako nga.[a] Kaya kung ako ang hinahanap ninyo, hayaan ninyong umalis ang mga ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Ako iyon.” Walang salitang katumbas ng “iyon” sa Griego. Maaaring idagdag ito sa Filipino upang gawing tahasan ang pagkakakilanlan sa sarili sa kontekstong ito.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: Sumagot
  rationale: Karaniwang salaysay na katumbas ng ἀποκρίνομαι sa isang pag-uusap; natural at marangal sa modernong Filipino.
- source_word: Εἶπον ὑμῖν
  choice: Sinabi ko na sa inyo
  rationale: Ipinahihiwatig ng pangnagdaang anyo at ng di-tuwirang layon na ipinapaalala ni Jesus ang sinabi na niya sa kanila; likas sa Filipino ang paggamit ng “na” sa ganitong konteksto.
- source_word: ἐγώ εἰμι
  choice: ako nga iyon
  rationale: Sa tagpo ng pagdakip, tuwirang kinikilala ni Jesus ang sarili bilang taong hinahanap. Ginagawang malinaw ng “iyon” ang pagkakakilanlan, habang pinananatili sa talababa ang mas literal at posibleng makahulugang “Ako nga.”
- source_word: ζητεῖτε
  choice: hinahanap ninyo
  rationale: Natural na Filipino para sa kasalukuyang paghahanap sa mismong tagpong ito; mas angkop kaysa sa mas pormal na “sinisikap ninyong matagpuan.”
- source_word: ἄφετε
  choice: hayaan ninyong
  rationale: Ipinapahayag ang pahintulot na makaalis nang hindi labis na ipinapalagay na bihag na ang mga tinutukoy, gaya ng maaaring ipahiwatig ng “palayain.”
- source_word: τούτους
  choice: ang mga ito
  rationale: Tumutukoy sa mga kasamahan ni Jesus. Walang kasariang gramatikal sa Filipino, kaya hindi kailangang idagdag ang “mga lalaking ito.”
- source_word: ὑπάγειν
  choice: umalis
  rationale: Malinaw at likas na katumbas ng pinahihintulutang pag-alis sa konteksto.
theological_decisions:
- issue: Pagkakasalin ng ἐγώ εἰμι sa kontekstong Juanino
  choice: ako nga iyon
  alternative: Ako nga
  rationale: Ang pangunahing diwa sa agarang konteksto ay pagkilala ni Jesus sa sarili bilang taong hinahanap. Gayunman, maaaring may mas malawak na teolohikal na alingawngaw ang tahasang ἐγώ εἰμι sa Juan, kaya hindi ito tuluyang nilulutas at inilalahad sa talababa ang mas literal na anyo.
translation_notes:
  register: Modernong Filipino na tuwiran, marangal, at madaling maunawaan. Ginamit ang “ninyo” para sa maramihang kausap at iniwasan ang labis na pormal o makalumang pananalita.
