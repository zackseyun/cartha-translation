  source_fidelity: Tumpak ang pagsasalin ng pasubaling salungat-sa-katotohanan sa pamamagitan ng “Kung …, hindi sana …,” at napananatili ng “gumagawa ng masama” ang pandiwang, pangkalahatan, at hindi-teknikal na paratang ng κακὸν ποιῶν. Gayunman, ang “dinala sa iyo” ay pangunahing tumutukoy sa pisikal na pagdadala at hindi sapat na naihahayag ang παραδίδωμι, na sa kontekstong ito ay ‘ipinasa’ o ‘ibinigay’ sa awtoridad ni Pilato.
  naturalness: Likas at malinaw ang pangungusap sa modernong Filipino. Ang “Sumagot sila” ay angkop na idiomatikong pagsasalin ng tambalang pormulang “sumagot at nagsabi.” Ang “ipinasa sa iyo” ay natural sa kontekstong pagharap at paglilipat ng isang taong nasa kanilang kustodiya sa isang awtoridad.
  terminology: Ang “taong ito” ay pinananatili ang demonstrative na may bahagyang paglayo nang walang dagdag na paghamak. Ang “gumagawa ng masama” ay mas malapit sa participial na parirala kaysa “masamang tao” o “kriminal.” Ang “ipinasa” ay mas mahusay na katumbas ng judicial force ng παραδίδωμι kaysa “dinala.”
