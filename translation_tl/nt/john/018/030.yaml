  yaml_path: translation/nt/john/018/030.yaml
  text: They answered and said to him[a], “If this man were not an evildoer, we would not have handed him over to you.”
translation:
  language: tl
  text: Sumagot sila sa kanya, “Kung ang taong ito ay hindi gumagawa ng masama, hindi sana namin siya ipinasa sa iyo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν
  choice: Sumagot sila
  rationale: Ang tambalang pormulang Griyego ay likas na naipapahayag sa makabagong Tagalog sa iisang pandiwang “sumagot”; ang “sumagot at nagsabi” ay magiging hindi likas at paulit-ulit.
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Tumutukoy ang panghalip kay Pilato bilang kinausap.
- source_word: Εἰ μὴ ἦν
  choice: Kung hindi
  rationale: Pinananatili nito ang anyong pasubali at ang salungat-sa-katotohanang diwa ng pangungusap.
- source_word: οὗτος
  choice: ang taong ito
  rationale: Likas sa Tagalog at pinananatili ang bahagyang mapaglayong pagtukoy ng mga nag-aakusa kay Jesus nang hindi nagdaragdag ng paghamak.
- source_word: κακὸν ποιῶν
  choice: gumagawa ng masama
  rationale: Pinananatili ang pandiwang lakas ng participial phrase at ang malawak, di-tiyak na paratang; hindi ito ginagawang teknikal na katawagang legal.
- source_word: οὐκ ἄν ... παρεδώκαμεν
  choice: hindi sana namin siya dinala
  rationale: Ang “hindi sana” ay likas na naghahatid ng salungat-sa-katotohanang resulta. Sa kontekstong pagdadala kay Jesus sa awtoridad ni Pilato, malinaw at natural ang “dinala,” bagaman maaari ring isalin ang παραδίδωμι bilang “ibinigay.”
- source_word: σοι
  choice: sa iyo
  rationale: Ikalawang panauhang isahan na tuwirang tumutukoy kay Pilato.
- source_word: αὐτόν
  choice: siya
  rationale: Tumutukoy kay Jesus bilang layon ng pandiwa.
theological_decisions:
- issue: Lakas at uri ng paratang laban kay Jesus
  choice: gumagawa ng masama
  alternative: masamang tao; kriminal
  rationale: Ang κακὸν ποιῶν ay pangkalahatang paratang tungkol sa paggawa ng masama, hindi isang tiyak o teknikal na sakdal. Pinananatili ng salin ang pagiging malabo at mapang-iwas ng tugon ng mga nag-aakusa.
- issue: Diwa ng παραδίδωμι sa harap ni Pilato
  choice: dinala sa iyo
  alternative: ibinigay sa iyo; ipinasa sa iyo
  rationale: Inihahatid ng “dinala sa iyo” ang aktuwal na pagharap nila kay Jesus kay Pilato nang natural sa Tagalog, nang hindi nagpapahiwatig ng dagdag na doktrinal na kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniiwasan ang mekanikal na “sumagot at nagsabi” at ang teknikal na katawagang “kriminal,” habang pinananatili ang pasubaling diin sa “hindi sana.”
