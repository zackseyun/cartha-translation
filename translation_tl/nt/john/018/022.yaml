base_translation:
  language: en
  yaml_path: translation/nt/john/018/022.yaml
  text: And when he had said these things[a], one of the officers standing by struck Jesus, saying[b], “Is this how you answer the high priest?”
translation:
  language: tl
  text: Nang masabi niya ang mga bagay na ito, hinampas[b] si Jesus ng isa sa mga bantay[a] na nakatayo roon. Sinabi nito, “Ganyan ka ba sumagot sa mataas na saserdote?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang isinaling “mga bantay” ay maaari ring mangahulugang mga alalay o tagapaglingkod; sa kontekstong ito, malamang na mga opisyal na tauhan sila ng templo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sinampal si Jesus”; ang salitang Griyego ay tumutukoy sa isang palo gamit ang kamay, gaya ng sampal o katulad na hampas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα δὲ αὐτοῦ εἰπόντος
  choice: Pagkasabi niya ng mga bagay na ito
  rationale: Ginawang likas na sugnay na panahunan ang genitive absolute; pinanatili ng “mga bagay na ito” ang maramihang ταῦτα at ang pagtukoy sa naunang sinabi ni Jesus.
- source_word: εἷς παρεστηκὼς τῶν ὑπηρετῶν
  choice: isa sa mga bantay na nakatayo roon
  rationale: Ipinahihiwatig ng ὑπηρέται sa tagpong ito ang mga tauhang may opisyal na tungkulin, malamang na mga bantay ng pamunuan ng templo; iniiwasan ng “bantay” ang maling pahiwatig na katulong sa bahay.
- source_word: ἔδωκεν ῥάπισμα τῷ Ἰησοῦ
  choice: hinampas si Jesus
  rationale: Ang ῥάπισμα ay suntok o palo gamit ang kamay at maaaring tumukoy sa sampal o kahawig na hampas. Ang “hinampas” ay natural at hindi labis na nagtatakda sa eksaktong uri ng palo.
- source_word: εἰπών
  choice: Sinabi nito
  rationale: Ginawang hiwalay na pangungusap ang participle upang maging malinaw at natural sa modernong Filipino na ang bantay ang nagsalita.
- source_word: Οὕτως ἀποκρίνῃ τῷ ἀρχιερεῖ;
  choice: Ganyan ka ba sumagot sa pinakapunong pari?
  rationale: Pinananatili ng “Ganyan” ang pagtukoy sa paraan ng pagsagot at ang mapanuyang lakas ng tanong; ang “pinakapunong pari” ay tuwirang katumbas ng ἀρχιερεύς sa kontekstong ito.
theological_decisions:
- issue: Pagkakakilanlan ng ὑπηρετῶν
  choice: mga bantay na opisyal na tauhan
  alternative: mga tagapaglingkod o alalay
  rationale: Malawak ang saklaw ng salita, ngunit sa salaysay ng paglilitis sa Juan, mas malamang na tumutukoy ito sa mga opisyal na tauhan ng pamunuan ng templo. Nananatili sa talababa ang saklaw ng kahulugan.
- issue: Eksaktong anyo ng ῥάπισμα
  choice: hinampas
  alternative: sinampal
  rationale: Hindi tiyak kung sampal mismo o katulad na palo gamit ang kamay ang tinutukoy; pinananatili ng salin at talababa ang tunay na leksikal na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Pagkasabi” at dalawang maiikling pangungusap upang maging natural ang daloy nang hindi binabago ang pagkakasunod ng mga pangyayari. Ang “Ganyan ka ba” ay karaniwang pananalita ngunit angkop sa pormal at mapanuyang tanong sa tagpo.
