source:
  edition: SBLGNT
  text: ἐξῆλθεν οὖν ὁ Πιλᾶτος ⸀ἔξω πρὸς αὐτοὺς καὶ ⸀φησίν· Τίνα κατηγορίαν φέρετε ⸀κατὰ τοῦ ἀνθρώπου τούτου;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/029.yaml
  text: So Pilate went outside to them and said, “What accusation do you bring against this man?”
translation:
  language: tl
  text: Kaya lumabas si Pilato at nilapitan sila. Sinabi niya, “Anong paratang ang inihaharap ninyo laban sa taong ito?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθεν … ἔξω
  choice: lumabas
  rationale: Magkasamang ipinahihiwatig ng pandiwa at pang-abay ang paglabas mula sa loob. Likas sa Tagalog ang “lumabas” at hindi kailangang ulitin ang diwa ng ἔξω.
- source_word: οὖν
  choice: Kaya
  rationale: 'Ipinapakita nito ang lohikal na bunga at pagpapatuloy ng salaysay: dahil ayaw pumasok ng mga tagapag-akusa, lumabas si Pilato upang harapin sila.'
- source_word: πρὸς αὐτούς
  choice: nilapitan sila
  rationale: Ipinahihiwatig ng πρός na kumilos si Pilato patungo sa kanila upang makipagharap. Ang “nilapitan sila” ay natural at malinaw sa makabagong Tagalog.
- source_word: φησίν
  choice: Sinabi niya
  rationale: Bagaman historical present ang anyong Griyego, karaniwang ginagamit sa natural na salaysay sa Tagalog ang aspektong naganap.
- source_word: Τίνα κατηγορίαν
  choice: Anong paratang
  rationale: Ang κατηγορία ay isang paratang o sakdal sa kontekstong legal. Malinaw sa ordinaryong mambabasa ang “paratang” nang hindi nawawala ang legal na diwa.
- source_word: φέρετε
  choice: inihaharap ninyo
  rationale: Sa kontekstong legal, ang φέρω ay tumutukoy sa paghaharap ng paratang. Higit na natural sa Tagalog ang “inihaharap” kaysa literal na “dinadala.”
- source_word: κατὰ τοῦ ἀνθρώπου τούτου
  choice: laban sa taong ito
  rationale: Ang κατά na may genitive ay nangangahulugang “laban sa” sa usaping panghukuman. Ang ἄνθρωπος ay isinaling “tao” dahil malinaw na isang partikular na lalaki ang tinutukoy ngunit hindi kailangang idiin ang kasarian sa natural na Tagalog.
theological_decisions: []
translation_notes:
  register: Makabago, dignified, at madaling maunawaang Filipino. Pinanatili ang legal na himig sa “paratang” at “inihaharap,” habang iniwasan ang mas teknikal na “sakdal” dahil hindi kailangan ng teksto ang pormal na kategoryang iyon.
