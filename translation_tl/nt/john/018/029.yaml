  source_fidelity: 'Tumpak ang salin sa pangunahing daloy at legal na diwa ng Griyego: ang οὖν ay naipahayag ng “Kaya”; ang ἐξῆλθεν … ἔξω at πρὸς αὐτούς ay likas na naihatid sa “lumabas si Pilato at nilapitan sila”; at ang tanong tungkol sa κατηγορία na φέρετε κατὰ τοῦ ἀνθρώπου τούτου ay malinaw na “Anong paratang ang inihaharap ninyo laban sa taong ito?” Walang mahalagang kahulugan ang nadagdag o nawala.'
  naturalness: Natural at makabagong Filipino ang pangungusap. Ang “paratang” at “inihaharap ninyo” ay madaling unawain ngunit nagpapanatili ng angkop na himig panghukuman. Ang paghahati sa dalawang pangungusap ay maayos sa Tagalog at hindi nakapipinsala sa ugnayan ng salaysay.
