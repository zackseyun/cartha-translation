revisions:
- from: Kaya isinama ni Judas ang pangkat ng mga kawal[a] at ang mga tanod[b] mula sa mga punong pari at mga Pariseo. Dumating sila roon na may dalang mga parol, mga sulo, at mga sandata.
  to: Kaya, isinama ni Judas ang pangkat ng mga kawal at ang mga tanod na mula sa mga punong pari at mga Pariseo. Pumunta siya roon kasama nila, na may dalang mga lampara, mga sulo, at mga sandata.
  rationale: Nilinaw ng rebisyon na ang mga tanod—hindi kinakailangang ang pangkat ng mga kawal—ang mula sa mga punong pari at mga Pariseo. Pinanatili ang pagkakasunod ng participle at pangunahing pandiwa sa natural na Filipino, at pinalitan ang “mga parol” ng “mga lampara” upang tumpak na katawanin ang φανῶν nang walang di-sinasadyang makabagong asosasyon.
