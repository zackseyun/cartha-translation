    reason: lexical_alternative
  - marker: b
    text: O “mga opisyal” o “mga bantay sa templo.” Tumutukoy ang salita sa mga opisyal na tauhang naglilingkod sa mga awtoridad na Judio.
    reason: lexical_alternative
  revision_rationale: Nilinaw ng rebisyon na ang mga tanod—hindi kinakailangang ang pangkat ng mga kawal—ang mula sa mga punong pari at mga Pariseo. Pinanatili ang pagkakasunod ng participle at pangunahing pandiwa sa natural na Filipino, at pinalitan ang “mga parol” ng “mga lampara” upang tumpak na katawanin ang φανῶν nang walang di-sinasadyang makabagong asosasyon.
