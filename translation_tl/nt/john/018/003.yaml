  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ οὖν Ἰούδας λαβὼν τὴν σπεῖραν καὶ ἐκ τῶν ἀρχιερέων καὶ ⸂ἐκ τῶν⸃ Φαρισαίων ὑπηρέτας ἔρχεται ἐκεῖ μετὰ φανῶν καὶ λαμπάδων καὶ ὅπλων.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/003.yaml
  text: So Judas[a], having taken the cohort and officers from the chief priests and from the Pharisees[b], comes there with lanterns and torches and weapons.
translation:
  language: tl
  text: Kaya, isinama ni Judas ang pangkat ng mga kawal at ang mga tanod na mula sa mga punong pari at mga Pariseo. Pumunta siya roon kasama nila, na may dalang mga lampara, mga sulo, at mga sandata.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Nag-uugnay ito sa naunang pangyayari at nagpapakita ng pagpapatuloy o bunga nang hindi labis na pormal.
- source_word: λαβὼν
  choice: isinama
  rationale: Sa kontekstong ito, ang diwa ay dinala o pinangunahan ni Judas ang pangkat; natural itong Filipino habang pinananatili ang kilos na nauuna sa pagdating.
- source_word: σπεῖραν
  choice: pangkat ng mga kawal
  rationale: Ipinahihiwatig ang isang organisadong yunit militar ngunit hindi ipinapalagay na naroon ang buong cohort o tiyak na bilang nito.
- source_word: ὑπηρέτας
  choice: mga tanod
  rationale: Tumutukoy sa mga opisyal na tauhan o bantay na naglilingkod sa mga awtoridad na Judio; mas malinaw ito sa karaniwang mambabasa kaysa sa malabong 'mga opisyal.'
- source_word: ἀρχιερέων
  choice: mga punong pari
  rationale: Karaniwang katawagan sa nangungunang mga awtoridad na pari.
- source_word: Φαρισαίων
  choice: mga Pariseo
  rationale: Likas at kinikilalang anyong Filipino ng pangalan ng pangkat.
- source_word: ἔρχεται ἐκεῖ
  choice: Dumating sila roon
  rationale: Ginawang natural na salaysay sa Filipino ang makasaysayang pangkasalukuyan; ang maramihang paksa ay tumutukoy kay Judas kasama ng pangkat na dinala niya.
- source_word: φανῶν
  choice: mga parol
  rationale: Tumutukoy sa nadadalang ilaw na nakapaloob o protektado at naihihiwalay sa mga sulo.
- source_word: λαμπάδων
  choice: mga sulo
  rationale: Pinananatili ang pagkakaiba nito sa φανῶν bilang bukás na nagliliyab na ilaw.
- source_word: ὅπλων
  choice: mga sandata
  rationale: Malinaw at pangkalahatang tawag sa mga kagamitang pandigma o panakit.
theological_decisions:
- issue: Pagkakakilanlan at kabuuan ng pangkat na dumakip
  choice: Isinalin bilang 'pangkat ng mga kawal' at 'mga tanod,' na nagpapakitang may militar na pangkat at mga tauhan ng mga awtoridad na Judio.
  alternative: Maaaring isalin ang σπεῖρα bilang 'cohort' o 'destakamento,' at ang ὑπηρέται bilang 'mga opisyal' o 'mga bantay sa templo.'
  rationale: Pinananatili ang dalawang sangkap ng pangkat nang hindi iginigiit na naroon ang buong Romanong cohort o na tiyak na mga bantay sa templo ang lahat ng ὑπηρέται.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Hinati sa dalawang pangungusap upang maging natural ang daloy, habang nananatili ang pagkakasunod ng pagkuha o pagsama sa pangkat at ng pagdating nila. Ang 'parol' at 'sulo' ay sadyang pinag-iba upang katawanin ang dalawang katawagang Griyego.
