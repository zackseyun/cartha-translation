source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Πιλᾶτος· Τί ἐστιν ἀλήθεια; Καὶ τοῦτο εἰπὼν πάλιν ἐξῆλθεν πρὸς τοὺς Ἰουδαίους, καὶ λέγει αὐτοῖς· Ἐγὼ οὐδεμίαν ⸂εὑρίσκω ἐν αὐτῷ αἰτίαν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/038.yaml
  text: Pilate said to him[a], “What is truth?” After saying this, he went out again to the Jews and said to them, “I find no case against him.”
translation:
  language: tl
  text: Sinabi ni Pilato sa kanya, “Ano ang katotohanan?” Pagkasabi nito, muli siyang lumabas sa mga Judio[a] at sinabi sa kanila, “Wala akong makitang anumang batayan para sa paratang laban sa kanya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga pinunong Judio.” Sa Ebanghelyo ni Juan, ang “mga Judio” ay kung minsan ay mas tiyak na tumutukoy sa mga pinunong Judio o sa pangkat na kumakalaban kay Jesus sa mismong konteksto.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Πιλᾶτος
  choice: Sinabi ni Pilato sa kanya
  rationale: Ang λέγει ay pangkasaysayang pangkasalukuyan; natural itong isinalin sa pangnagdaan sa salaysay na Tagalog.
- source_word: Τί ἐστιν ἀλήθεια;
  choice: Ano ang katotohanan?
  rationale: Tuwirang ipinapahayag nito ang pangkalahatan at posibleng pilosopikal na tanong; hindi dinaragdagan ng paliwanag ang walang artikulong ἀλήθεια.
- source_word: Καὶ τοῦτο εἰπὼν
  choice: Pagkasabi nito
  rationale: Maikli at natural na temporal na parirala ito na nagpapanatili sa pagkakasunod ng mga pangyayari.
- source_word: πάλιν ἐξῆλθεν
  choice: muli siyang lumabas
  rationale: Ang muli ay katumbas ng πάλιν, at ang lumabas ay tuwirang naghahatid ng ἐξῆλθεν.
- source_word: πρὸς τοὺς Ἰουδαίους
  choice: sa mga Judio
  rationale: Pinananatili sa pangunahing teksto ang leksikal na anyo ng Ἰουδαίους, habang nililinaw sa talababa na maaari itong tumukoy nang mas makitid sa mga pinunong Judio sa konteksto.
- source_word: καὶ λέγει αὐτοῖς
  choice: at sinabi sa kanila
  rationale: Ang ikalawang λέγει ay isinalin ding pangnagdaan para sa natural at pare-parehong daloy ng salaysay.
- source_word: Ἐγὼ οὐδεμίαν εὑρίσκω ἐν αὐτῷ αἰτίαν
  choice: Wala akong makitang anumang batayan upang paratangan siya
  rationale: Sa kontekstong hudisyal, ang αἰτία ay dahilan, sakdal, o batayan ng paratang. Malinaw at likas sa Tagalog ang parirala at hindi nito ginagawang pangkalahatang moral na pagkukulang ang legal na pahayag.
theological_decisions:
- issue: Tinutukoy at pagsasalin ng Ἰουδαίους sa salaysay ng pagpapakasakit sa Juan
  choice: Pinanatili sa pangunahing teksto ang “mga Judio,” na may talababa para sa mas makitid na kontekstuwal na kahulugang “mga pinunong Judio.”
  alternative: mga pinunong Judio; mga taga-Judea
  rationale: Pinananatili nito ang leksikal na anyo at tunay na saklaw ng interpretasyon, ngunit iniiwasan sa pamamagitan ng talababa ang maling pag-unawang lahat ng Judio nang walang pagtatangi ang tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang natural na panahunan ng salaysay at pinanatili ang legal na diwa ng αἰτία nang hindi labis na teknikal.
