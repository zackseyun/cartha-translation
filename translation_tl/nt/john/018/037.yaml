id: JHN.18.37
reference: John 18:37
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτῷ ὁ Πιλᾶτος· Οὐκοῦν βασιλεὺς εἶ σύ; ἀπεκρίθη ⸀ὁ Ἰησοῦς· Σὺ λέγεις ὅτι βασιλεύς ⸀εἰμι. ἐγὼ εἰς τοῦτο γεγέννημαι καὶ εἰς τοῦτο ἐλήλυθα εἰς τὸν κόσμον ἵνα μαρτυρήσω τῇ ἀληθείᾳ· πᾶς ὁ ὢν ἐκ τῆς ἀληθείας ἀκούει μου τῆς φωνῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/037.yaml
  text: 'Then Pilate said to him[a], “So then, are you a king?” Jesus answered, “You say that I am a king. For this I have been born, and for this I have come into the world: that I should bear witness to the truth. Everyone who is of the truth listens to my voice.”'
translation:
  language: tl
  text: Kaya sinabi sa kanya ni Pilato, “Kung gayon, hari ka nga ba?” Sumagot si Jesus, “Ikaw ang nagsasabing hari ako.[a] Para rito ako isinilang, at para rito ako naparito sa sanlibutan—upang magpatotoo sa katotohanan. Ang bawat taong nagmumula sa katotohanan ay nakikinig sa aking tinig.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring, “Ikaw ang nagsabi nito: hari ako,” o “Tama ang sinabi mong hari ako.” Maikli ang pananalita sa Griyego at maaaring marinig bilang isang pagsang-ayong may pasubali.'
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐκοῦν
  choice: Kung gayon
  rationale: Ipinahihiwatig nito na bumubuo si Pilato ng konklusyon mula sa naunang sinabi ni Jesus, habang nananatiling natural sa makabagong Tagalog.
- source_word: βασιλεὺς
  choice: hari
  rationale: Ito ang tuwiran at angkop na katawagan sa konteksto ng pagtatanong ng isang Romanong gobernador tungkol sa paghahari, at pinananatili nito ang pampolitika at mesiyanikong pahiwatig.
- source_word: Σὺ λέγεις ὅτι βασιλεύς εἰμι
  choice: Ikaw ang nagsasabing hari ako
  rationale: Malapit ito sa maikli at hindi lubos na tiyak na pananalita ng Griyego. Hindi nito sapilitang ginagawang tahasang pagsang-ayon o paglayo ang sagot ni Jesus.
- source_word: γεγέννημαι
  choice: ako isinilang
  rationale: Natural na ipinapahayag sa Tagalog ang kapanganakan ni Jesus nang hindi ginagamit ang “ipinanganak/begotten” sa paraang maaaring magpasok ng teolohikal na kahulugang hindi hinihingi ng konteksto.
- source_word: ἐλήλυθα εἰς τὸν κόσμον
  choice: ako naparito sa sanlibutan
  rationale: Pinananatili nito ang natatanging pahayag tungkol sa pagparito ni Jesus at ang Johannine na wika ng kaniyang misyon at pinagmulan.
- source_word: μαρτυρήσω τῇ ἀληθείᾳ
  choice: magpatotoo sa katotohanan
  rationale: Nananatili rito ang legal at testimonial na diwa ng μαρτυρέω at ang layuning ipinahahayag ng ἵνα.
- source_word: πᾶς ὁ ὢν ἐκ τῆς ἀληθείας
  choice: Ang bawat taong nagmumula sa katotohanan
  rationale: Pinananatili ng “nagmumula sa” ang relasyonal o pinagmumulang diwa ng ἐκ, sa halip na agad itong ipakahulugang “kumakampi” o “nabibilang.”
- source_word: ἀκούει μου τῆς φωνῆς
  choice: nakikinig sa aking tinig
  rationale: Ipinahihiwatig ng “nakikinig” ang tumutugong pagtanggap, habang pinananatili ng “aking tinig” ang larawang ginagamit din sa ibang bahagi ng Juan.
theological_decisions:
- issue: Diwa ng sagot ni Jesus kay Pilato (Σὺ λέγεις ὅτι βασιλεύς εἰμι)
  choice: 'Pinanatili bilang isang posibleng may-pasubaling pagsang-ayon: “Ikaw ang nagsasabing hari ako.”'
  alternative: 'Maaaring unawain bilang mas tahasang “Tama ang sinabi mong hari ako,” o bilang “Ikaw ang nagsabi nito: hari ako.”'
  rationale: Hindi tahasang nililinaw ng maikling Griyegong pananalita kung gaano kalakas ang pagsang-ayon. Kaya pinananatili sa pangunahing teksto ang tensiyon at inilalagay sa talababa ang mga lehitimong posibilidad.
- issue: Ugnayan ng “isinilang” at “naparito sa sanlibutan”
  choice: Pinanatiling dalawang magkahiwalay na sugnay.
  alternative: Pagsamahin ang dalawa bilang iisang malayang pahayag tungkol sa misyon ni Jesus.
  rationale: Sadyang magkaiba ang dalawang pahayag sa Griyego at maaaring may kabuluhang inkarnasyonal. Hindi sila pinagsama o pinalawak ng salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino Tagalog. Ginamit ang “sanlibutan,” “magpatotoo,” at “tinig” upang mapanatili ang dignidad at mga temang mahalaga sa Juan, ngunit iniwasan ang lipas o labis na teknikal na pananalita.
