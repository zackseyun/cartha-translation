  naturalness: Natural ang daloy ng pangungusap. Mas malinaw at natural sa modernong Filipino ang “ang pangkat ng mga kawal, ang kumandante, at ang mga opisyal ng mga Judio” kaysa paulit-ulit na “ng” sa listahan ng mga paksa.
  terminology: Ang “pangkat ng mga kawal,” “kumandante,” “dinakip,” at “iginapos” ay angkop. Pinananatili ang “mga Judio” bilang matapat na salin ng τῶν Ἰουδαίων, na may talababa upang hindi ipakahulugang ang buong sambayanang Judio ang tinutukoy. Ang “mga opisyal” ay higit na angkop kaysa “mga bantay” para sa ὑπηρέται.
