  text: Ἡ οὖν σπεῖρα καὶ ὁ χιλίαρχος καὶ οἱ ὑπηρέται τῶν Ἰουδαίων συνέλαβον τὸν Ἰησοῦν καὶ ἔδησαν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/john/018/012.yaml
  text: So the cohort[a], the commander, and the officers of the Jews seized Jesus and bound him.
translation:
  language: tl
  text: Kaya dinakip ng pangkat ng mga kawal, ng kumandante, at ng mga opisyal ng mga Judio[a] si Jesus at iginapos siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ng mga pinunong Judio” o “ng mga taga-Judea,” depende sa konteksto. Sa Juan, ang “mga Judio” ay madalas tumukoy sa isang mas tiyak na pangkat at hindi sa buong bayang Judio.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Ipinapakita ang pagpapatuloy at bunga ng naunang tagpo; natural ito sa makabagong salaysay sa Tagalog.
- source_word: σπεῖρα
  choice: pangkat ng mga kawal
  rationale: Pinananatili ang diwang militar nang hindi ipinapalagay sa pangunahing teksto ang tiyak na laki o tahasang idinaragdag ang 'Romano,' na wala sa mismong pangngalan.
- source_word: χιλίαρχος
  choice: kumandante
  rationale: Malinaw at karaniwang katawagan para sa opisyal na namumuno sa pangkat; mas madaling maunawaan kaysa sa teknikal na titulong 'tribuno.'
- source_word: ὑπηρέται
  choice: mga bantay
  rationale: Sa kontekstong ito, tumutukoy sa mga opisyal na tauhang kasama sa pagdakip, hindi sa mga katulong sa bahay; hindi rin labis na tinutukoy bilang 'pulis ng templo.'
- source_word: τῶν Ἰουδαίων
  choice: ng mga Judio
  rationale: Pormal na pinananatili ang genitibong parirala at ang tunay na saklaw na maaaring maging mas tiyak ayon sa konteksto; nililinaw sa talababa na hindi ito kinakailangang tumukoy sa buong bayang Judio.
- source_word: συνέλαβον
  choice: dinakip
  rationale: Likas na salitang Tagalog para sa paghawak at pagkuha sa kustodiya; ang konteksto ng marahas o sapilitang pagkuha ay nananatili.
- source_word: ἔδησαν
  choice: iginapos
  rationale: Tumpak, natural, at marangal na paglalarawan sa pagbibigkis kay Jesus.
theological_decisions:
- issue: Saklaw at tinutukoy ng τῶν Ἰουδαίων sa Juan
  choice: Isinalin sa pangunahing teksto bilang 'ng mga Judio.'
  alternative: ng mga pinunong Judio; ng mga taga-Judea
  rationale: Hindi tahasang nililimitahan ng talata ang parirala sa mga pinuno, kaya pinananatili ang pormal na anyo. Gayunman, upang maiwasang ipakahulugang sangkot ang buong bayang Judio, inilalahad sa talababa ang mas makitid na posibleng kahulugan ayon sa konteksto ni Juan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'pangkat ng mga kawal' sa halip na teknikal na 'kohorte' upang maging madaling maunawaan, habang iniwasang magdagdag ng detalyeng hindi tahasang nasa Griyego.
