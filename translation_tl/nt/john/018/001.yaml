source:
  edition: SBLGNT
  text: Ταῦτα ⸀εἰπὼν Ἰησοῦς ἐξῆλθεν σὺν τοῖς μαθηταῖς αὐτοῦ πέραν τοῦ χειμάρρου ⸀τοῦ Κεδρὼν ὅπου ἦν κῆπος, εἰς ὃν εἰσῆλθεν αὐτὸς καὶ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/001.yaml
  text: After saying these things[a], Jesus went out with his disciples across the Kidron Valley, where there was a garden, into which he and his disciples entered.
translation:
  language: tl
  text: Matapos sabihin ni Jesus ang mga bagay na ito, lumabas siya kasama ang kanyang mga alagad at tumawid sa batis ng Kidron[a]. May isang hardin doon, at pumasok doon si Jesus kasama ang kanyang mga alagad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bangin ng Kidron” o “libis ng Kidron.” Ang salitang Griyego ay tumutukoy sa isang daluyan ng tubig na karaniwang umaagos lamang sa ilang panahon ng taon.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα εἰπὼν
  choice: Pagkasabi nito
  rationale: Likas na temporal na parirala sa modernong Tagalog; pinananatili nito ang pagkakasunod ng pagsasalita at pag-alis nang hindi nagiging matigas ang anyo.
- source_word: ἐξῆλθεν
  choice: lumabas
  rationale: Tuwirang ipinapahayag ang konkretong pagkilos na nasa pandiwang Griyego at angkop sa payak na salaysay ni Juan.
- source_word: σὺν τοῖς μαθηταῖς αὐτοῦ
  choice: kasama ang kanyang mga alagad
  rationale: Malinaw at natural na katumbas ng accompaniment na ipinahihiwatig ng σύν kasama ang datibo.
- source_word: πέραν τοῦ χειμάρρου τοῦ Κεδρών
  choice: tumawid sa Batis ng Kidron[a]
  rationale: Ipinahahayag ng “tumawid” ang pagpunta sa kabilang panig. Ang χείμαρρος ay pana-panahong daluyan ng tubig na maaari ring tumukoy sa bangin o libis na dinadaluyan nito; pinili ang “Batis” bilang madaling maunawaang pangunahing katawagan at inilagay sa talababa ang saklaw ng kahulugan.
- source_word: ὅπου ἦν κῆπος
  choice: May hardin doon
  rationale: Natural na Tagalog na nagpapanatili sa diwa ng pag-iral at lokasyon ng hardin.
- source_word: εἰς ὃν εἰσῆλθεν
  choice: pumasok siya roon
  rationale: Malinaw na pinananatili ang direksiyonal na pagpasok sa hardin nang hindi gumagamit ng mabigat na hulma ng kamag-anak na sugnay.
- source_word: αὐτὸς καὶ οἱ μαθηταὶ αὐτοῦ
  choice: siya roon kasama ang kanyang mga alagad
  rationale: Pinananatili ang tahasang paksa at ang pagsama ng mga alagad nang hindi labis na binibigyang-diin ang αὐτός bilang “siya mismo.”
