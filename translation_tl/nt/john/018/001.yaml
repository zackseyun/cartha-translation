translation_notes:
  register: Modernong Filipino Tagalog na payak, marangal, at angkop sa pampublikong pagbasa. Hinati sa dalawang pangungusap ang mahabang pangungusap na Griyego upang maging natural at malinaw sa Tagalog, habang pinananatili ang lahat ng kilos at kalahok.
