  to: Kaya sinabi ni Jesus kay Pedro, “Ibalik mo ang tabak sa kaluban.[a] Hindi ko ba iinumin ang kopang[b] na ibinigay sa akin ng Ama?”
  rationale: Inalis ang hindi kailangang “nito,” ginawang mas natural ang utos na ilagay muli ang tabak sa kaluban, at nilinaw ang pagkakaugnay ng “kopa” at ng sugnay na naglalarawan dito. Pinanatili ang retorikal na tanong, ang metapora ng kopa, at ang “Ama” na walang idinagdag na panghalip na “ko.” Inayos din ang unang talababa upang tumugma sa uri at layunin nito.
