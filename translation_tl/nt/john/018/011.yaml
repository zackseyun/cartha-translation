  text: εἶπεν οὖν ὁ Ἰησοῦς τῷ Πέτρῳ· Βάλε τὴν ⸀μάχαιραν εἰς τὴν θήκην· τὸ ποτήριον ὃ δέδωκέν μοι ὁ πατὴρ οὐ μὴ πίω αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/011.yaml
  text: So Jesus said to Peter[a], “Put the sword into its sheath[b]. Shall I not drink the cup that the Father has given me?”
translation:
  language: tl
  text: Kaya sinabi ni Jesus kay Pedro, “Ibalik mo ang tabak sa kaluban.[a] Hindi ko ba iinumin ang kopang[b] na ibinigay sa akin ng Ama?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sisidlan ng tabak” ang “kaluban.”
    reason: lexical_alternative
  - marker: b
    text: Ang “kopa” ay talinghagang biblikal para sa pagdurusa o kapalarang itinakda ng Diyos; ihambing ang mga panalangin sa Getsemani sa Mateo 26:39; Marcos 14:36; at Lucas 22:42.
    reason: cross_reference
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Nag-uugnay ito sa naunang pangyayari at ipinahihiwatig ang tugon ni Jesus; natural sa makabagong Tagalog ang “Kaya.”
- source_word: Βάλε
  choice: Ipasok mo
  rationale: Sa pariralang εἰς τὴν θήκην, ang utos ay ilagay o ipasok ang sandata sa kaluban; malinaw at natural ang “Ipasok mo.”
- source_word: μάχαιραν
  choice: tabak
  rationale: Karaniwang salin ito para sa isang sandatang may talim at hindi nito labis na nililimitahan ang tiyak na anyo o laki ng μάχαιρα.
- source_word: θήκην
  choice: kaluban
  rationale: Tumpak at likas na salitang Tagalog para sa lalagyan ng tabak o iba pang sandatang may talim.
- source_word: ποτήριον
  choice: kopa
  rationale: Pinananatili ang kongkretong talinghaga ng Griyego sa halip na ipaliwanag ito sa mismong teksto bilang pagdurusa, kamatayan, o poot.
- source_word: δέδωκέν
  choice: ibinigay
  rationale: Ipinahahayag ang natapos na pagbibigay na nananatiling mahalaga sa kasalukuyang sandali; sa Tagalog, sapat na naihahatid ito ng aspektong kontemplatibo sa “ibinigay.”
- source_word: ὁ πατήρ
  choice: ang Ama
  rationale: Pinananatili ang tiyak na katawagang nasa Griyego at hindi idinaragdag ang “ko,” na hindi hayag sa teksto.
- source_word: οὐ μὴ πίω αὐτό;
  choice: Hindi ko ba iinumin
  rationale: 'Isang retorikal na tanong ito na umaasang sasang-ayon ang kausap: iinumin nga ni Jesus ang kopa. Pinananatili ng saling ito ang anyong tanong at ang mariing diwa.'
theological_decisions:
- issue: Kahulugan ng “kopa”
  choice: Panatilihin ang “kopa” bilang talinghaga nang hindi ito nililinaw pa sa pangunahing teksto.
  alternative: Isalin bilang “pagdurusang itinakda sa akin,” “kapalarang ibinigay sa akin,” o “kopa ng poot.”
  rationale: Ipinahihiwatig ng konteksto ang pagdurusa at landasing itinakda para kay Jesus, ngunit hindi ito mas makitid na binibigyang-kahulugan ng mismong talata. Ang pagpapanatili sa talinghaga ay nag-iingat sa lawak at tensiyong teolohikal nito.
- issue: Ang ugnayan ni Jesus sa Ama sa pariralang “ibinigay sa akin ng Ama”
  choice: Tuwirang ilarawan ang kusang pagsunod ni Jesus sa ibinigay ng Ama, nang walang dagdag na paliwanag.
  alternative: “Itinakda sa akin ng aking Ama” o “ipinagawa sa akin ng Ama.”
  rationale: Ang payak na salin ang pinakamalapit sa teksto at hindi nagdaragdag ng panghalip, paliwanag, o doktrinal na pagbibigay-kahulugan na wala sa Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang retorikal na tanong at ang talinghagang “kopa.” Inilagay ang mga pananda ng talababa sa mga salitang talagang tinutukoy ng bawat paliwanag.
