  terminology: 'Ang “tabak,” “kaluban,” “kopa,” at “Ama” ay angkop. Ang “kopa” ay pinanatili upang huwag ipalit ang talinghaga sa isang interpretasyon. Ang talababa tungkol sa “kaluban” ay inayos: ang “lalagyan ng tabak” ay paliwanag, hindi tunay na leksikal na kahalili; “sisidlan ng tabak” ang mas angkop na alternatibong paglalarawan.'
