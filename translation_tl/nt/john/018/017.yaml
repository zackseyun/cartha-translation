base_translation:
  language: en
  yaml_path: translation/nt/john/018/017.yaml
  text: So the servant girl who kept the door said to Peter[a], “You are not also one of this man's disciples, are you?” He said, “I am not.”
translation:
  language: tl
  text: Kaya sinabi ng babaeng tagapaglingkod na nagbabantay sa pinto[a] kay Pedro, “Hindi ka rin ba isa sa mga alagad ng taong ito?” Sumagot siya, “Hindi ako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “babaeng alipin na tagapagbantay ng pinto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Ipinapakita ang pagpapatuloy at kaugnayan sa naunang pangyayari nang natural sa makabagong Tagalog.
- source_word: παιδίσκη
  choice: alilang babae
  rationale: Tumutukoy sa isang batang babaeng tagapaglingkod; malinaw ang tungkulin nang hindi tiyak na ipinapasya sa pangunahing teksto ang legal na kalagayan niya bilang alipin.
- source_word: θυρωρός
  choice: na nagbabantay sa pintuan
  rationale: Natural na pariralang Tagalog na nagpapahayag sa tungkulin niyang nangangasiwa sa pasukan.
- source_word: Μὴ καὶ σὺ
  choice: Hindi rin naman ikaw ... hindi ba?
  rationale: Pinananatili ang anyo ng tanong na umaasang negatibo ang sagot, habang natural ang daloy sa Tagalog.
- source_word: ἐκ τῶν μαθητῶν
  choice: isa sa mga alagad
  rationale: Karaniwang Tagalog para sa pagiging kabilang sa isang pangkat at pinananatili ang partitive na diwa ng ἐκ.
- source_word: τοῦ ἀνθρώπου τούτου
  choice: ng taong ito
  rationale: Pinananatili ang karaniwang kahulugan ng ἄνθρωπος at ang bahagyang mapaglayong himig ng τούτου nang hindi ito ginagawang titulo.
- source_word: ἐκεῖνος
  choice: niya
  rationale: Sa konteksto, si Pedro ang tinutukoy; natural sa Tagalog ang panghalip kaysa literal na “ang isang iyon.”
- source_word: Οὐκ εἰμί
  choice: Hindi ako
  rationale: Maikli at tuwirang pagtanggi na tumutugma sa eliptikal at mariing kasimplehan ng Griyego.
theological_decisions:
- issue: Lakas ng negatibong tanong na pinasimulan ng μή
  choice: 'Isinalin bilang tanong na umaasang negatibo ang sagot: “Hindi rin naman ikaw ... hindi ba?”'
  alternative: Isang neutral na tanong, o “Tiyak na hindi rin ikaw ...?”
  rationale: Pinananatili nito ang pragmatikong puwersa ng Griyego nang hindi pinalalabis ang tono.
- issue: Panlipunang kalagayan na maaaring ipahiwatig ng παιδίσκη
  choice: “alilang babae” sa pangunahing teksto
  alternative: “babaeng alipin”
  rationale: Maaaring tumukoy ang salita sa babaeng lingkod o alipin. Sa tagpong ito, higit na lantad ang kaniyang papel at kasarian kaysa sa eksaktong legal na katayuan; inilalagay sa talababa ang mas tahasang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “alagad” bilang pamilyar na katawagang biblikal at ang hulihang “hindi ba?” upang natural na maipakita ang inaasahang negatibong sagot.
