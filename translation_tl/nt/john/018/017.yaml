  to: Kaya sinabi ng babaeng tagapaglingkod na nagbabantay sa pinto[a] kay Pedro, “Hindi ka rin ba isa sa mga alagad ng taong ito?” Sumagot siya, “Hindi ako.”
  rationale: Inayos ang pangunahing katawagan para sa παιδίσκη upang panatilihin ang leksikal na saklaw nito nang hindi agad itinatakda ang katayuang alipin. Inayos din ang ayos ng pangungusap at ang negatibong tanong upang maging higit na natural sa makabagong Filipino, habang pinananatili ang “rin,” ang mapaglayong “taong ito,” at ang maikling pagtanggi ni Pedro.
