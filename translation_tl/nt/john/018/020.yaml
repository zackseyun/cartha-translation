id: JHN.18.20
reference: John 18:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀αὐτῷ Ἰησοῦς· Ἐγὼ παρρησίᾳ ⸀λελάληκα τῷ κόσμῳ· ἐγὼ πάντοτε ἐδίδαξα ἐν συναγωγῇ καὶ ἐν τῷ ἱερῷ, ὅπου ⸀πάντες οἱ Ἰουδαῖοι συνέρχονται, καὶ ἐν κρυπτῷ ἐλάλησα οὐδέν·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/020.yaml
  text: Jesus answered him[a], “I have spoken openly to the world. I always taught in the synagogue and in the temple, where all the Jews gather[b], and I said nothing in secret.”
translation:
  language: tl
  text: Sumagot sa kanya si Jesus, “Hayagan akong nagsalita sa mundo. Lagi akong nagturo sa sinagoga at sa templo[a], kung saan nagtitipon ang lahat ng mga Judio[b]. Wala akong sinabi nang palihim.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa mga bakuran ng templo” o “sa nasasakupan ng templo.” Ang salitang Griyego na ἱερόν ay tumutukoy sa kabuuang lugar ng templo, hindi lamang sa panloob na santuwaryo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ang buong sambayanang Judio” o, sa ilang konteksto sa Juan, “ang lahat ng mga taga-Judea.” Nag-iiba ayon sa konteksto ang kahulugan ng salitang Griyego na Ἰουδαῖοι.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησίᾳ
  choice: hayagan
  rationale: Tuwirang ipinapakita nito ang pagsasalitang lantad at walang pagtatago, bilang kabaligtaran ng ἐν κρυπτῷ (‘nang palihim’), nang hindi labis na binibigyang-diin ang katapangan.
- source_word: λελάληκα
  choice: nagsalita
  rationale: Walang likas na katumbas sa Filipino ang aspektong perpekto ng Griyego; ang natural na anyong ‘nagsalita’ ay tumutukoy sa naunang pampublikong pagsasalita ni Jesus na mahalaga pa rin sa kasalukuyang pagsisiyasat.
- source_word: τῷ κόσμῳ
  choice: sa mundo
  rationale: Pinananatili nito ang malawak at madalas na gamit ni Juan sa κόσμος, habang natural sa modernong Filipino; hindi ito pinapaliit sa ‘sa publiko’ lamang.
- source_word: πάντοτε
  choice: lagi
  rationale: Natural at malinaw na katumbas ng temporal na diwa ng ‘palagi’ o ‘sa lahat ng panahon’ sa kontekstong ito.
- source_word: ἐδίδαξα
  choice: nagturo
  rationale: Ang payak na aspektong naganap ay angkop na kumakatawan sa aorist at natural sa salaysay.
- source_word: ἐν συναγωγῇ
  choice: sa sinagoga
  rationale: Pinananatili ang isahang anyo ng Griyego, na maaaring tumukoy sa sinagoga bilang karaniwang lugar ng pampublikong pagtuturo.
- source_word: ἐν τῷ ἱερῷ
  choice: sa templo
  rationale: Maikli at karaniwang salin ito, habang nililinaw sa talababa na ang ἱερόν ay tumutukoy sa kabuuang lugar ng templo at hindi lamang sa panloob na santuwaryo.
- source_word: πάντες οἱ Ἰουδαῖοι
  choice: lahat ng mga Judio
  rationale: Pinananatili ang malawak na etniko at panrelihiyong pagtukoy na nababagay sa konteksto ng pagtitipon sa sinagoga at templo, nang hindi ito nililimitahan sa mga pinuno.
- source_word: συνέρχονται
  choice: nagtitipon
  rationale: Natural na Filipino para sa sama-samang pagparoon o pagtitipon.
- source_word: ἐν κρυπτῷ
  choice: nang palihim
  rationale: Malinaw na katapat ng ‘hayagan’ at likas na paraan sa Filipino upang ipahayag ang lihim o nakatagong pagsasalita.
- source_word: ἐλάλησα οὐδέν
  choice: Wala akong sinabi
  rationale: Natural na Filipino na nagpapanatili sa mariing pagkakaila nang hindi nagiging asiwa ang parirala.
- source_word: ἀπεκρίθη αὐτῷ
  choice: Sumagot sa kanya
  rationale: Payak, tumpak, at natural na pananalita sa salaysay.
theological_decisions:
- issue: Tinutukoy ng Ἰουδαῖοι sa Ebanghelyo ni Juan
  choice: ‘mga Judio,’ na sa talatang ito ay malawak na tumutukoy sa sambayanang Judio sa konteksto ng pampublikong pagtitipon
  alternative: ‘sambayanang Judio’ o ‘mga taga-Judea’
  rationale: Nag-iiba ayon sa konteksto ang kahulugan ng Ἰουδαῖοι sa Juan. Ang pagbanggit sa sinagoga at templo ay mas umaayon dito sa malawak na panrelihiyon at pangkomunidad na pagtukoy, hindi lamang sa mga awtoridad; inilalahad sa talababa ang tunay na saklaw ng mga posibleng salin.
- issue: Saklaw ng ἱερόν
  choice: ‘templo’ sa pangunahing teksto, na may talababa tungkol sa kabuuang lugar ng templo
  alternative: ‘mga bakuran ng templo’ o ‘nasasakupan ng templo’
  rationale: Ang ἱερόν ay hindi partikular na tumutukoy sa panloob na santuwaryo. Pinananatili ng maikling salin ang natural na daloy habang iniiwasan ng talababa ang maling pag-unawa.
- issue: Pahayag na walang sinabi si Jesus nang palihim
  choice: Pinanatili ang ganap at mariing anyo ng pahayag nang walang paliwanag na nagpapahina rito
  alternative: Ipaliwanag ito bilang pagtukoy lamang sa kawalan ng lihim na doktrina
  rationale: Hindi tahasang ibinibigay ng talata ang gayong pagpapaliwanag. Dapat manatili sa salin ang retorikal at teolohikal na tensiyon ng pahayag sa konteksto ng Ebanghelyo.
translation_notes:
  register: 'Modernong Filipino na malinaw, marangal, at madaling basahin. Ginamit ang ‘mundo’ sa halip na mas tradisyonal na ‘sanlibutan,’ at ang ‘nang palihim’ upang maging natural ang tuwirang pagsalungat sa ‘hayagan.’ Inilipat ang mga pananda ng talababa sa mismong mga salitang tinatalakay: [a] sa ‘templo’ at [b] sa ‘mga Judio.’'
