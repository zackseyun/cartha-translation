  text: Εἰσῆλθεν οὖν ⸂πάλιν εἰς τὸ πραιτώριον⸃ ὁ Πιλᾶτος καὶ ἐφώνησεν τὸν Ἰησοῦν καὶ εἶπεν αὐτῷ· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/033.yaml
  text: So Pilate went back into the governor’s headquarters and called Jesus and said to him[b][a], “Are you the King of the Jews?”
translation:
  language: tl
  text: Kaya muling pumasok si Pilato sa punong tanggapan ng gobernador[a]. Ipinatawag niya si Jesus at sinabi sa kanya, “Ikaw ba ang Hari ng mga Judio[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pretorio,” ang opisyal na tirahan o punong tanggapan ng Romanong gobernador.
    reason: lexical_alternative
  - marker: b
    text: O “mga taga-Judea.” Maaaring tumukoy ang salitang Griyego sa mga Judio sa pangkalahatan o, sa ilang konteksto, sa mga taga-Judea.
    reason: alternative_reading
lexical_decisions:
- source_word: Εἰσῆλθεν ... πάλιν
  choice: muling pumasok
  rationale: Likas na ipinahahayag sa Tagalog ang pagpasok na muli sa lugar; pinananatili nito ang diwa ng pagbalik nang hindi nagiging mabigat ang pangungusap.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinapakita ang lohikal at pasalaysay na kaugnayan sa naunang pangyayari nang natural sa makabagong Tagalog.
- source_word: πραιτώριον
  choice: punong tanggapan ng gobernador
  rationale: Malinaw na ipinahahayag ang opisyal na tirahan o himpilan ng Romanong gobernador, samantalang inilalagay sa talababa ang teknikal na katawagang pretorio.
- source_word: ἐφώνησεν
  choice: Ipinatawag
  rationale: Sa kontekstong opisyal, ang pandiwa ay tumutukoy sa pagtawag kay Jesus upang humarap; mas tiyak dito ang “ipinatawag” kaysa simpleng “tinawag.”
- source_word: εἶπεν αὐτῷ
  choice: sinabi rito
  rationale: Pinananatili ang pangkalahatang pandiwang “sinabi” ng Griyego sa halip na gawing mas tiyak na “tinanong”; ang anyong patanong ng sipi ang naghahayag ng pagtatanong.
- source_word: Σὺ εἶ ὁ βασιλεὺς
  choice: Ikaw ba ang Hari
  rationale: Ang “Ikaw ba” ay natural na tanong sa Tagalog at naipapahiwatig ang diin ng tahasang panghalip na σύ. Ang “Hari” ay ginawang malaking titik bilang titulong nasa paratang, hindi bilang dagdag na pagpapakahulugang teolohikal.
- source_word: τῶν Ἰουδαίων
  choice: ng mga Judio
  rationale: Ang “mga Judio” ang pinakanatural at makasaysayang angkop sa Romanong paratang na pampolitika; pinananatili sa talababa ang posibleng heograpikong diwang “mga taga-Judea.”
theological_decisions:
- issue: Kahulugan ng Ἰουδαίων sa maharlikang titulo
  choice: mga Judio
  alternative: mga taga-Judea
  rationale: Sa paglilitis, ang pariralang ito ang Romanong anyo ng paratang laban kay Jesus at karaniwang tumutukoy sa kinikilalang pangkat na etniko, panrelihiyon, at pampolitika. Gayunman, maaaring tumukoy ang salitang Griyego sa mga taga-Judea sa ilang konteksto, kaya hindi inaalis ang alternatibong iyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “punong tanggapan” upang maging madaling maunawaan ang institusyong Romano, at pinanatili sa mga talababa ang teknikal at leksikal na mga alternatibo.
