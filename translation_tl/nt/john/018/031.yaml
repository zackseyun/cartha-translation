  text: εἶπεν οὖν αὐτοῖς ⸀ὁ Πιλᾶτος· Λάβετε αὐτὸν ὑμεῖς, καὶ κατὰ τὸν νόμον ὑμῶν κρίνατε αὐτόν. ⸀εἶπον αὐτῷ οἱ Ἰουδαῖοι· Ἡμῖν οὐκ ἔξεστιν ἀποκτεῖναι οὐδένα·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/031.yaml
  text: So Pilate said to them[a], “Take him yourselves and judge him according to your law.” The Jews said to him, “It is not lawful for us to put anyone to death.”
translation:
  language: tl
  text: Kaya sinabi sa kanila ni Pilato, “Kunin ninyo siya at hatulan ayon sa inyong kautusan.” Sinabi sa kanya ng mga Judio[a], “Hindi kami pinahihintulutang pumatay ng sinuman.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa kontekstong ito, ang “mga Judio” ay tumutukoy sa mga pinunong Judio o mga tagapagsakdal na nakikipag-usap kay Pilato, hindi sa buong bayang Judio.
    reason: Paglilinaw sa kontekstuwal na tinutukoy ng οἱ Ἰουδαῖοι upang maiwasan ang maling pangkalahatang pagbasa.
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Likas na pang-ugnay sa makabagong Tagalog na nagpapanatili sa lohikal at pasalaysay na daloy.
- source_word: Λάβετε αὐτὸν ὑμεῖς
  choice: Kunin ninyo siya
  rationale: Ang tahasang “ninyo” ay naghahatid ng diin ng ὑμεῖς nang hindi nagdaragdag ng mas matinding pakahulugang wala namang tahasang katumbas sa Griyego.
- source_word: κατὰ τὸν νόμον ὑμῶν
  choice: ayon sa inyong kautusan
  rationale: Ipinahahayag nito ang pamantayan o batayan ng paghatol at pinananatili ang pagdistansiya ni Pilato sa kanilang legal na kaayusan.
- source_word: κρίνατε
  choice: hatulan
  rationale: Saklaw ng “hatulan” ang legal na diwa ng κρίνω nang hindi ito nililimitahan sa isang partikular na anyo ng paglilitis.
- source_word: οἱ Ἰουδαῖοι
  choice: ang mga Judio
  rationale: Pormal na pinananatili ang katawagan sa Griyego; nililinaw ng talababa na ang tinutukoy sa konteksto ay ang pangkat na kaharap ni Pilato, hindi ang buong bayang Judio.
- source_word: ἔξεστιν
  choice: ipinahihintulot
  rationale: Malinaw at likas na katumbas ng legal o awtorisadong pahintulot sa makabagong Tagalog.
- source_word: ἀποκτεῖναι οὐδένα
  choice: patayin ang sinuman
  rationale: Tuwirang pinananatili ang malawak na pandiwang “patayin” at ang pangkalahatang saklaw ng “sinuman”; ipinahihiwatig na ng legal na konteksto ang paglalapat ng parusang kamatayan.
theological_decisions:
- issue: Ang tinutukoy ng οἱ Ἰουδαῖοι sa salaysay ni Juan
  choice: “mga Judio” sa pangunahing teksto, na may talababa tungkol sa kontekstuwal na tinutukoy
  alternative: “mga pinunong Judio” o “mga taga-Judea”
  rationale: Pinananatili nito ang anyo at posibleng lawak ng katawagang Griyego habang iniiwasan, sa pamamagitan ng talababa, ang maling pagbasa na tumutukoy ito sa lahat ng Judio. Sa agarang konteksto, ang nagsasalita ay ang mga tagapamahala o tagapagsakdal na kaharap ni Pilato.
- issue: Legal na diwa ng ἀποκτεῖναι
  choice: “patayin”
  alternative: “hatulan ng kamatayan” o “ipapatay”
  rationale: Ang Griyego ay tuwirang nangangahulugang pumatay; hindi tahasang ginagamit ang salitang “magbitay” o “magsagawa ng opisyal na paglalapat ng hatol.” Pinananatili ng salin ang mas malawak na salita habang ang tagpo ang naghahatid ng legal na diwa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “kautusan” para sa legal at panrelihiyong νόμος, at pinanatiling maikli at tuwiran ang palitan ng mga nagsasalita.
