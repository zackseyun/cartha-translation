id: JHN.18.26
reference: John 18:26
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: λέγει εἷς ἐκ τῶν δούλων τοῦ ἀρχιερέως, συγγενὴς ὢν οὗ ἀπέκοψεν Πέτρος τὸ ὠτίον· Οὐκ ἐγώ σε εἶδον ἐν τῷ κήπῳ μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/026.yaml
  text: One of the high priest’s servants[a], being a relative of the man whose ear Peter had cut off, said, “Didn’t I see you in the garden with him?”
translation:
  language: tl
  text: Sinabi ng isa sa mga alipin ng punong pari, na kamag-anak ng lalaking pinutulan ni Pedro ng tainga, “Hindi ba nakita kita sa hardin na kasama niya?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δούλων
  choice: mga alipin
  rationale: Sa kontekstong ito, tumutukoy ang δοῦλος sa mga taong nakatali sa sambahayan ng punong pari. Mas malinaw na naipapakita ng “alipin” kaysa “lingkod” ang kanilang kalagayang panlipunan.
- source_word: ἀρχιερέως
  choice: punong pari
  rationale: Karaniwan at malinaw na salin para sa pinakamataas na katungkulang makapari sa konteksto ng salaysay tungkol sa paghihirap ni Jesus.
- source_word: συγγενὴς ὢν
  choice: na kamag-anak
  rationale: Natural sa modernong Tagalog at malinaw na ipinakikilalang kamag-anak ng nasugatan ang nagsasalita, habang nananatiling nakapailalim ang parirala sa pangunahing pangungusap.
- source_word: οὗ
  choice: ng lalaking
  rationale: 'Ginawang tahasan ang tinutukoy ng panghalip na paari upang maging malinaw at likas sa Tagalog: ang lalaking nagmamay-ari ng taingang pinutol.'
- source_word: ἀπέκοψεν
  choice: pinutulan
  rationale: Ang “pinutulan ... ng tainga” ay likas na konstruksiyon sa Tagalog at malinaw na nagsasaad na inalis ni Pedro ang tainga ng lalaki.
- source_word: ὠτίον
  choice: tainga
  rationale: Tuwiran at karaniwang katumbas; hindi kailangang ipilit sa Tagalog ang diminutibong anyo ng Griyego.
- source_word: Οὐκ ἐγώ σε εἶδον
  choice: Hindi ba nakita kita
  rationale: Ipinahihiwatig ng οὐκ na positibong sagot ang inaasahan. Likas na naihahatid ng “Hindi ba nakita kita” ang mapanuring retorikal na tanong, bagaman hindi lubos na naihihiwalay ang diin sa ἐγώ.
- source_word: ἐν τῷ κήπῳ
  choice: sa hardin
  rationale: Ang κῆπος ay hardin; ito ang lugar kung saan dinakip si Jesus.
- source_word: μετ’ αὐτοῦ
  choice: na kasama niya
  rationale: Tumutukoy kay Jesus ang αὐτοῦ. Ang “na kasama niya” ay likas na nag-uugnay sa pagkakita sa kausap habang kasama si Jesus.
theological_decisions:
- issue: Pagpapakahulugan sa δοῦλος sa literal na konteksto ng sambahayan
  choice: alipin
  alternative: lingkod
  rationale: Hindi metaporikal ang gamit dito at may ipinahihiwatig na kalagayang nakatali sa sambahayan. Pinananatili ng “alipin” ang panlipunang realidad sa halip na palambutin ito bilang pangkalahatang paglilingkod.
- issue: Diin ng ἐγώ sa retorikal na tanong
  choice: Hindi ba nakita kita
  alternative: Hindi ba ako mismo ang nakakita sa iyo
  rationale: Ang alternatibo ay mas tahasang nagtatampok sa ἐγώ ngunit mas mabigat sa Tagalog. Pinananatili ng napiling anyo ang tanong na umaasa ng pagsang-ayon at ang natural na daloy ng tuwirang pananalita, nang hindi nagdaragdag ng “mismo” na wala sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit pangkaraniwan. Ginamit ang “punong pari,” “alipin,” at “hardin” bilang malinaw at kasalukuyang mga termino. Walang footnote dahil walang kailangang tekstuwal o leksikal na alternatibong ilagay sa publikasyong teksto.
