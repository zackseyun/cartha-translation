id: JHN.18.7
reference: John 18:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πάλιν οὖν ⸂ἐπηρώτησεν αὐτούς⸃· Τίνα ζητεῖτε; οἱ δὲ εἶπαν· Ἰησοῦν τὸν Ναζωραῖον.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/007.yaml
  text: So he asked them again[a], “Whom are you seeking?” And they said, “Jesus the Nazarene.”
translation:
  language: tl
  text: Kaya muli niya silang tinanong, “Sino ang hinahanap ninyo?” At sinabi nila, “Si Jesus na Nazareno.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Jesus na taga-Nazaret”; sa Griyego, “Jesus na Nazareno.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: muli
  rationale: Malinaw at likas na nagsasaad ng pag-uulit sa daloy ng salaysay.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinakikita ang pagpapatuloy at bunga ng naunang pag-uusap nang hindi nagiging labis na pormal.
- source_word: ἐπηρώτησεν αὐτούς
  choice: niya silang tinanong
  rationale: Tuwirang salin ng pandiwa at layon, at natural ang ayos sa modernong Tagalog.
- source_word: Τίνα ζητεῖτε
  choice: Sino ang hinahanap ninyo?
  rationale: Sa Tagalog, “sino” ang natural na pantanong para sa taong layon ng paghahanap; ipinahahayag ng “hinahanap” ang kasalukuyang pakay ng pangkat.
- source_word: οἱ δὲ εἶπαν
  choice: At sinabi nila
  rationale: Pinananatili ang payak na pag-usad ng salaysay at ang literal na diwa ng εἶπαν; hindi kailangang gawing mariing pagsalungat ang δέ.
- source_word: Ἰησοῦν τὸν Ναζωραῖον
  choice: Si Jesus na Nazareno
  rationale: Ginagamit ang karaniwang anyo ng pangalan at pinananatili ang Ναζωραῖος bilang pantukoy o bansag, sa halip na tahimik itong gawing pariralang pinagmulan.
theological_decisions:
- issue: Pagpapakahulugan sa Ναζωραῖος bilang pantukoy kay Jesus
  choice: Nazareno
  alternative: taga-Nazaret
  rationale: Ang “Nazareno” ay nagpapanatili sa anyo ng Griyegong pantukoy nang hindi ito ginagawang isang doktrinal na titulo. Ang “taga-Nazaret” ay malinaw at karaniwang nauunawaan, ngunit mas tahasang ipinapakahulugan ito bilang pinagmulan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, magalang, at angkop sa salaysay. Ginamit ang “ninyo” para sa likas na pangmaramihang pakikipag-usap at ang “Nazareno” upang mapanatili ang anyo ng orihinal na pantukoy.
