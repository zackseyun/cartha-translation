id: JHN.18.5
reference: John 18:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν αὐτῷ· Ἰησοῦν τὸν Ναζωραῖον. λέγει ⸀αὐτοῖς· Ἐγώ εἰμι. εἱστήκει δὲ καὶ Ἰούδας ὁ παραδιδοὺς αὐτὸν μετ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/005.yaml
  text: They answered him, “Jesus the Nazarene.” He said to them, “I am he.” Now Judas, who was betraying him, was also standing with them.
translation:
  language: tl
  text: Sumagot sila sa kanya, “Si Jesus na taga-Nazaret.” Sinabi niya sa kanila, “Ako nga.” Nakatayo ring kasama nila si Judas, na nagkakanulo sa kanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰησοῦν τὸν Ναζωραῖον
  choice: Si Jesus na taga-Nazaret
  rationale: Likas at malinaw na Filipino para sa pagtukoy kay Jesus bilang mula sa Nazaret; iniiwasan ang mas di-likas na literal na “ang Nazareno.”
- source_word: Ἐγώ εἰμι
  choice: Ako nga
  rationale: Sa agarang konteksto, ito ay tuwirang pagkilala sa sarili bilang ang hinahanap nila. Pinananatili ng “Ako nga” ang mariing anyo ng Griyego nang hindi nagdaragdag ng panghalip na wala sa teksto.
- source_word: ὁ παραδιδοὺς αὐτὸν
  choice: na nagkakanulo sa kanya
  rationale: Ipinahahayag ng kasalukuyang pandiwaring Griyego ang ginagampanang pagtataksil ni Judas sa eksenang ito; natural sa Filipino ang “nagkakanulo.”
- source_word: εἱστήκει ... μετ’ αὐτῶν
  choice: Nakatayo ring kasama nila
  rationale: Pinananatili ang detalye ng posisyon ni Judas at ang diin na kabilang siya sa pangkat na humaharap kay Jesus.
theological_decisions:
- issue: Posibleng teolohikal na alingawngaw ng Ἐγώ εἰμι
  choice: Ako nga
  alternative: Ako ay siya / Ako
  rationale: Hindi tahasang nilulutas ang posibleng alingawngaw ng pormula ng banal na pagpapakilala, ngunit inuuna ang malinaw na gamit nito rito bilang sagot sa paghahanap nila kay Jesus. Ang “Ako nga” ay may diin at likas sa modernong Filipino.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling basahin. Ginamit ang “kanya” at karaniwang ayos ng pangungusap; walang idinagdag na paliwanag sa mismong talata.
source_grounding:
  english_pob_role: consult_only
