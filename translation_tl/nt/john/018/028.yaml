  naturalness: Karaniwang natural at marangal ang Filipino. Gayunman, ang magkatambal na layunin sa «upang hindi sila maging marumi ayon sa ritwal, kundi makakain sila» ay mas malinaw at mas maayos kung inuulit ang «upang» sa ikalawang bahagi.
  terminology: Ang «Caifas,» «Jesus,» «Paskuwa,» at «punong-himpilan ng gobernador» ay angkop. Ang «maging marumi ayon sa ritwal» ay malinaw na nagpapahayag ng seremonyal na kahulugan ng μιανθῶσιν nang hindi ipinapakahulugang moral na karumihan.
