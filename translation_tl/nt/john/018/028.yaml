id: JHN.18.28
reference: John 18:28
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἄγουσιν οὖν τὸν Ἰησοῦν ἀπὸ τοῦ Καϊάφα εἰς τὸ πραιτώριον· ἦν δὲ πρωΐ· καὶ αὐτοὶ οὐκ εἰσῆλθον εἰς τὸ πραιτώριον, ἵνα μὴ μιανθῶσιν ⸀ἀλλὰ φάγωσιν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/028.yaml
  text: So they led Jesus from Caiaphas into the governor’s headquarters[a]. Now it was early morning. They themselves did not enter the headquarters, so that they would not be defiled[c][b], but could eat the Passover.
translation:
  language: tl
  text: Kaya dinala nila si Jesus mula kay Caifas patungo sa punong-himpilan ng gobernador[a]. Noon ay madaling-araw pa. Sila mismo ay hindi pumasok sa punong-himpilan upang hindi sila maging marumi ayon sa ritwal[b], kundi upang makakain sila ng Paskuwa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Pretorio,” ang opisyal na tirahan at punong-himpilang panghukuman ng Romanong gobernador.
    reason: lexical_alternative
  - marker: b
    text: Ang pagiging “marumi ayon sa ritwal” ay tumutukoy sa kalagayang hindi malinis ayon sa mga tuntuning panrelihiyon.
    reason: cultural_note
  - marker: c
    text: Ang “makakain ng Paskuwa” ay maaaring tumukoy sa mismong hapunan ng Paskuwa o, nang mas malawak, sa mga pagkaing kaugnay ng kapistahan at mga pagdiriwang nito.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄγουσιν
  choice: dinala nila
  rationale: Ang pangkasaysayang pangkasalukuyan sa salaysay na Griyego ay likas na isinasalin sa aspektong naganap sa modernong Tagalog. Ang “dinala” ay angkop sa pagbabantay at paghahatid kay Jesus.
- source_word: οὖν
  choice: Kaya
  rationale: Pinananatili nito ang ugnayang pasalaysay at lohikal sa naunang pangyayari nang hindi labis na pormal.
- source_word: πραιτώριον
  choice: punong-himpilan ng gobernador
  rationale: Ipinahahayag ang opisyal na tirahan at himpilang panghukuman ng Romanong gobernador sa paraang malinaw sa karaniwang mambabasa.
- source_word: πρωΐ
  choice: madaling-araw pa
  rationale: Tumutukoy sa maagang bahagi ng umaga. Ang “pa” ay natural na nagpapatingkad sa napakaagang oras nang hindi nagtatakda ng eksaktong sandali.
- source_word: αὐτοὶ
  choice: Sila mismo
  rationale: Pinananatili ang diin sa panghalip at ang kaibahan sa pagitan ng pagdadala nila kay Jesus at ng sarili nilang pagtangging pumasok.
- source_word: οὐκ εἰσῆλθον
  choice: hindi pumasok
  rationale: Direkta at natural na katumbas sa Tagalog.
- source_word: μιανθῶσιν
  choice: maging marumi ayon sa ritwal
  rationale: Nililinaw na ritwal o seremonyal, hindi pisikal o moral, ang uri ng karumihang tinutukoy.
- source_word: φάγωσιν τὸ πάσχα
  choice: makakain sila ng Paskuwa
  rationale: Inihahayag ng “makakain” ang layunin at kakayahang nakasalalay sa pananatiling malinis ayon sa ritwal. Hindi tinutukoy sa pangunahing teksto kung ang Paskuwa ay ang mismong hapunan o mas malawak na mga pagkaing pampista.
- source_word: Καϊάφα
  choice: Caifas
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa modernong saling Filipino.
- source_word: Ἰησοῦν
  choice: Jesus
  rationale: Ginamit ang pamantayang anyo ng pangalan sa Filipino.
theological_decisions:
- issue: Kahulugan ng “makakain ng Paskuwa” kaugnay ng kronolohiya sa Juan
  choice: Pinanatili ang malawak na pariralang “makakain sila ng Paskuwa.”
  alternative: “makakain sila ng hapunan ng Paskuwa” o “makakain sila ng mga handog sa kapistahan”
  rationale: Maaaring tumukoy ang parirala sa mismong hapunan ng Paskuwa o, nang mas malawak, sa mga pagkaing kaugnay ng kapistahan. Hindi nilulutas ng salin ang pinagtatalunang kronolohiya.
- issue: Uri ng karumihang tinutukoy ng μιανθῶσιν
  choice: “maging marumi ayon sa ritwal”
  alternative: “madungisan” o “maging marumi” lamang
  rationale: Ang konteksto ay kadalisayang panrelihiyon na may kaugnayan sa pagkain ng Paskuwa, hindi ordinaryong dumi o tahasang moral na kasalanan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “punong-himpilan” sa halip na di-pamilyar na transliterasyon sa pangunahing teksto, habang inilagay ang “Pretorio” sa talababa. Ang “ayon sa ritwal” ay tahasang nagtatakda sa seremonyal na kahulugan ng karumihan.
