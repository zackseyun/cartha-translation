translation:
  language: tl
  text: Sumusunod kay Jesus si Simon Pedro[a], gayundin ang isa pang alagad. Kilala ng punong pari ang alagad na iyon, at pumasok siyang kasama ni Jesus sa patyo ng punong pari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, sa mas pormal na ayos: “Sumusunod kay Jesus si Simon Pedro, at ang isa pang alagad.” Hindi tahasang inuulit sa Griyego ang kilos na ginawa rin ng ikalawang alagad.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠκολούθει
  choice: Sumusunod
  rationale: Ipinahihiwatig ng imperpektong aspekto ang nagpapatuloy na kilos sa salaysay; natural itong naipapahayag sa Tagalog sa anyong “sumusunod.”
- source_word: δὲ
  choice: hindi tahasang isinalin
  rationale: Mahinang pang-ugnay ito sa daloy ng salaysay; hindi kailangan ang artipisyal na “ngayon” o “ngunit” sa natural na Tagalog.
- source_word: καὶ ἄλλος μαθητής
  choice: gayundin ang isa pang alagad
  rationale: Nililinaw nitong nakikibahagi ang ikalawang alagad sa kilos ng pagsunod, na ipinahihiwatig lamang sa Griyego.
- source_word: μαθητής
  choice: alagad
  rationale: Karaniwan, malinaw, at angkop na katawagan sa Tagalog para sa μαθητής sa Ebanghelyo ni Juan.
- source_word: γνωστὸς
  choice: kilala ng
  rationale: Pinananatili nito ang payak na diwa na kilala siya ng punong pari, nang hindi dinaragdagan ang antas ng kanilang pagkakakilala.
- source_word: ἀρχιερεῖ / ἀρχιερέως
  choice: punong pari
  rationale: Pamantayan at natural na salin sa Tagalog para sa pang-isahang ἀρχιερεύς sa kontekstong ito.
- source_word: συνεισῆλθεν
  choice: pumasok siyang kasama
  rationale: Ipinapahayag ang pagpasok ng alagad kasabay ni Jesus at pinananatili ang puwersa ng σύν.
- source_word: αὐλήν
  choice: patyo
  rationale: Tumutukoy sa nakapaloob na bakuran o courtyard ng tirahan ng punong pari; maikli at malinaw ang “patyo” sa modernong Tagalog.
