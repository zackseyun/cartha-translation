base_translation:
  language: en
  yaml_path: translation/nt/john/018/023.yaml
  text: Jesus answered him[a], “If I spoke wrongly, testify about the wrong; but if rightly[b], why do you strike me?”
translation:
  language: tl
  text: Sumagot sa kanya si Jesus, “Kung masama ang sinabi ko, magpatotoo ka tungkol sa mali; ngunit kung tama ang sinabi ko, bakit mo ako hinahampas?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῷ Ἰησοῦς
  choice: Sumagot sa kanya si Jesus
  rationale: Natural na salaysay sa Tagalog na malinaw na nagpapanatili sa tagatanggap ng sagot.
- source_word: Εἰ κακῶς ἐλάλησα
  choice: Kung masama ang sinabi ko
  rationale: Pinananatili ang kondisyong εἰ at ang maaaring moral o wastong-di-wastong diwa ng κακῶς nang hindi nililimitahan sa pagiging faktuwal na mali lamang.
- source_word: μαρτύρησον
  choice: magpatotoo ka
  rationale: Ang pautos na anyo ay nagpapanatili sa hudisyal na diwa ng pagbibigay ng patotoo.
- source_word: περὶ τοῦ κακοῦ
  choice: tungkol sa masama
  rationale: Pinananatili ang nominal at sadyang malawak na anyo ng τοῦ κακοῦ, na maaaring tumukoy sa masamang sinabi o sa mali sa pagsasalita.
- source_word: εἰ δὲ καλῶς
  choice: ngunit kung tama
  rationale: Ipinakikita ang malinaw na pagsalungat sa unang kondisyon; ang “tama” ay natural sa Tagalog at tumutukoy sa wastong pagsasalita.
- source_word: τί με δέρεις
  choice: bakit mo ako sinasaktan?
  rationale: Ang δέρεις ay maaaring tumukoy sa paghampas o pananakit; ang “sinasaktan” ay natural at sapat na malawak, bagaman hindi nito tinutukoy ang eksaktong paraan ng hampas.
theological_decisions:
- issue: Ang tugon ni Jesus sa marahas at di-makatarungang pagtrato
  choice: Isinalin bilang isang hamong humihingi ng patotoo at dahilan, nang walang idinagdag na komentaryong doktrinal.
  alternative: Palawakin bilang tahasang pagtuligsa sa ilegal na paglilitis o pahinain ang hudisyal na himig.
  rationale: Ang Griyego ay naglalatag ng dalawang kondisyong nagpapakita ng kakulangan ng batayan sa pananakit; dapat panatilihin ang lohika at tensiyon nito nang walang dagdag na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “magpatotoo” upang mapanatili ang hudisyal na himig, at ang magkatapat na “masama” at “tama” upang katawanin ang κακῶς/καλῶς nang natural.
