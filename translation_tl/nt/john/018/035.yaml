  text: ἀπεκρίθη ὁ Πιλᾶτος· Μήτι ἐγὼ Ἰουδαῖός εἰμι; τὸ ἔθνος τὸ σὸν καὶ οἱ ἀρχιερεῖς παρέδωκάν σε ἐμοί· τί ἐποίησας;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/035.yaml
  text: Pilate answered[a], “I am not a Jew, am I? Your own nation and the chief priests handed you over to me. What have you done?”
translation:
  language: tl
  text: Sumagot si Pilato, “Hindi naman ako Judio[a], hindi ba? Ang sarili mong bayan at ang mga punong pari ang nagbigay sa iyo sa akin. Ano ang ginawa mo?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “taga-Judea.” Maaaring tumukoy ang salitang Griyego sa pagkakakilanlang etniko/panrelihiyon (“Judio”) o sa panrehiyong pagkakakilanlan (“taga-Judea”), ayon sa konteksto.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: Sumagot
  rationale: Likas at karaniwang pandiwang pasalaysay para sa tugon sa isang pag-uusap.
- source_word: Μήτι ἐγὼ Ἰουδαῖός εἰμι;
  choice: Hindi naman ako Judio, hindi ba?
  rationale: Ipinahihiwatig ng μήτι na negatibong sagot ang inaasahan; pinananatili ng negatibong tanong na may panandang “hindi ba” ang retorikal na diin ni Pilato.
- source_word: Ἰουδαῖός
  choice: Judio
  rationale: Sa kontekstong ito, itinatangi ni Pilato ang sarili niya sa pambansa at panrelihiyong pagkakakilanlan ni Jesus at ng mga nagsakdal sa kanya. Mas angkop dito ang malawak na kahulugang “Judio” kaysa sa panrehiyong “taga-Judea.”
- source_word: τὸ ἔθνος τὸ σὸν
  choice: ang sarili mong bansa
  rationale: Ipinakikita ng “sarili mong” ang mariing pagmamay-ari sa τὸ σὸν at ang mapaglayong tono ni Pilato; ang “bansa” ay angkop sa kolektibong pambansang kahulugan ng ἔθνος.
- source_word: οἱ ἀρχιερεῖς
  choice: ang mga punong pari
  rationale: Karaniwan at malinaw na katawagan sa pangkat ng nakatataas na pamunuan ng mga pari sa Jerusalem.
- source_word: παρέδωκάν σε ἐμοί
  choice: nagdala sa iyo sa akin
  rationale: Natural sa Filipino sa kontekstong pagdadala ng isang nasasakdal sa awtoridad. Hindi nito ipinapasok ang mas moral na diin ng “ipinagkanulo,” bagaman bahagyang hindi nito tahasang sinasabi ang pormal na pagsasalin ng kustodiya.
- source_word: τί ἐποίησας;
  choice: Ano ang ginawa mo?
  rationale: Direkta at natural na katumbas ng tanong tungkol sa nagawang dahilan ng kasalukuyang paglilitis.
theological_decisions:
- issue: Kahulugan ng Ἰουδαῖος sa Juan
  choice: Judio
  alternative: taga-Judea
  rationale: Maaaring magbago ayon sa konteksto ang saklaw ng Ἰουδαῖος. Dito, ang retorikal na tanong ni Pilato at ang kasunod na “sarili mong bansa” ay pumapabor sa pambansa at panrelihiyong pagkakakilanlan, hindi lamang sa rehiyonal na pinagmulan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Hindi naman ako Judio, hindi ba?” upang natural na maipahayag ang tanong na umaasa ng negatibong sagot. Walang talababa dahil sa talatang ito ay sapat na malinaw sa konteksto ang “Judio”; ang alternatibong “taga-Judea” ay naitala sa mga desisyong pangsalin.
