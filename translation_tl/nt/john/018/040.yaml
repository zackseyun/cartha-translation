id: JHN.18.40
reference: John 18:40
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐκραύγασαν οὖν ⸀πάλιν λέγοντες· Μὴ τοῦτον ἀλλὰ τὸν Βαραββᾶν. ἦν δὲ ὁ Βαραββᾶς λῃστής.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/040.yaml
  text: So they shouted again[a], saying, “Not this man, but Barabbas!” Now Barabbas was a robber.
translation:
  language: tl
  text: Kaya muli silang sumigaw, “Huwag ang taong ito, kundi si Barabbas!” Si Barabbas ay isang tulisan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magnanakaw” o “bandido.” Sa ilang konteksto, ang salitang Griyego ay maaari ring tumukoy sa isang marahas na rebelde.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκραύγασαν
  choice: sumigaw sila
  rationale: Ipinahahayag ng pandiwa ang malakas na pagsigaw; natural at tuwiran ang “sumigaw” sa makabagong Filipino.
- source_word: οὖν
  choice: Kaya
  rationale: Iniuugnay nito ang sigaw ng mga tao sa naunang palitan ng usapan at ipinapakita ang pagpapatuloy o bunga nito.
- source_word: πάλιν
  choice: muli
  rationale: Tuwirang ipinapahayag ang pag-uulit ng kanilang pagsigaw.
- source_word: λέγοντες
  choice: '[ipinahayag sa tuwirang sipi]'
  rationale: Sa Filipino, natural nang kasunod ng “sumigaw” ang mismong sinabi nila; ang hiwalay na “na sinasabi” ay magiging mabigat at di-likas nang hindi nagdaragdag ng kahulugan.
- source_word: Μὴ τοῦτον ἀλλὰ τὸν Βαραββᾶν
  choice: Huwag ang taong ito, kundi si Barabbas
  rationale: Pinananatili ng “ang taong ito” ang tiyak na demonstratibong lakas ng τοῦτον at malinaw ang paghahambing.
- source_word: Βαραββᾶν / Βαραββᾶς
  choice: Barabbas
  rationale: Ginamit ang nakasanayang transliterasyon ng pangalang pantangi sa Filipino.
- source_word: ἦν δὲ
  choice: Si Barabbas ay
  rationale: Nagsisimula ito ng maikling paliwanag tungkol kay Barabbas; hindi kailangang tumbasan nang hiwalay ang δέ upang maging natural sa Filipino.
- source_word: λῃστής
  choice: tulisan
  rationale: Mas naipahihiwatig ng “tulisan” kaysa “magnanakaw” ang maaaring marahas at armadong katangian ng λῃστής, nang hindi tiyak na ipinapakahulugang rebelde si Barabbas.
theological_decisions:
- issue: Lawak ng kahulugan ng λῃστής bilang paglalarawan kay Barabbas
  choice: tulisan
  alternative: magnanakaw; bandido; marahas na rebelde
  rationale: Maaaring tumukoy ang λῃστής sa magnanakaw o bandido at, sa ilang konteksto, sa marahas na rebelde. Ang “tulisan” ay nagpapanatili ng posibleng marahas na diwa nang hindi ipinapasya mula sa talatang ito lamang na isang insureksiyonista si Barabbas.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mariing pagtanggi sa “taong ito” at iniwasang gawing tiyak na insureksiyonista si Barabbas, sapagkat hindi iyon sapilitang hinihingi ng λῃστής sa talatang ito.
