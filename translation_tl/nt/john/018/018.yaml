base_translation:
  language: en
  yaml_path: translation/nt/john/018/018.yaml
  text: The servants and the officers were standing there[a], having made a charcoal fire because it was cold, and they were warming themselves[b]. Peter also was standing with them and warming himself.
translation:
  language: tl
  text: Nakatayo roon ang mga alipin[a] at mga kawani[b]. Nagsindi sila ng apoy na uling dahil malamig noon, at nagpapainit sila. Nakatayo rin si Pedro kasama nila at nagpapainit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga lingkod”; karaniwang tumutukoy ang salita sa mga taong nasa kalagayan ng pagkaalipin.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga opisyal na tauhan” o “mga bantay”; tumutukoy ang salita sa mga attendant na may opisyal na tungkulin, malamang na kaugnay ng templo o ng sambahayan ng punong pari.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: mga alipin
  rationale: Tuwirang ipinapakita ng “mga alipin” ang malamang na nakagapos na katayuang panlipunan ng mga tauhan sa sambahayan, sa halip na palabuin ito bilang simpleng mga lingkod.
- source_word: ὑπηρέται
  choice: mga bantay
  rationale: Sa kontekstong Juanino, tumutukoy ito sa mga opisyal na tauhang may tungkuling magpatupad o magbantay; natural at malinaw sa Filipino ang “mga bantay,” bagaman hindi tahasang tinutukoy ng Griyego ang eksaktong tungkulin nila.
- source_word: ἀνθρακιὰν πεποιηκότες
  choice: nagsiga sila ng uling
  rationale: Natural na Filipino ito para sa paggawa ng apoy na uling at pinananatili ang kongkretong detalyeng mahalaga sa salaysay. Ang natapos na pagsisiga na may nananatiling resulta ay malinaw sa kasunod na pagpapainit nila.
- source_word: ὅτι ψῦχος ἦν
  choice: dahil malamig noon
  rationale: 'Pinananatili ang malinaw na ugnayang sanhi: nagsiga sila sapagkat malamig sa panahong iyon.'
- source_word: ἐθερμαίνοντο
  choice: nagpapainit sila
  rationale: Ipinahahayag ng anyong pandiwa ang nagpapatuloy na kilos ng grupo; idiomatiko sa Filipino ang “nagpapainit sila.”
- source_word: ἦν δὲ καὶ ὁ Πέτρος μετ’ αὐτῶν ἑστὼς
  choice: Nakatayo rin si Pedro kasama nila
  rationale: Ang “rin” ay nagpapanatili sa dagdag na diin ng καί, samantalang malinaw na inilalagay si Pedro sa gitna ng grupo at pinananatili ang kaniyang tindig.
- source_word: θερμαινόμενος
  choice: nagpapainit
  rationale: Tuwirang inilalarawan ang nagpapatuloy na kilos ni Pedro at pinananatili ang pagkakapantay nito sa kilos ng grupo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maiikling pangungusap upang maging natural ang daloy nang hindi inaalis ang magkakaugnay na mga detalye ng Griyego. Hindi isinalin ang δέ bilang tahasang “ngayon” o “ngunit” sapagkat mahina lamang ang tungkuling pang-ugnay nito rito.
