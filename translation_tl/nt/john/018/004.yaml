  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἰησοῦς ⸀οὖν εἰδὼς πάντα τὰ ἐρχόμενα ἐπ’ αὐτὸν ⸂ἐξῆλθεν, καὶ λέγει⸃ αὐτοῖς· Τίνα ζητεῖτε;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/004.yaml
  text: Jesus therefore[a], knowing all the things coming upon him, went out and said to them, “Whom are you seeking?”
translation:
  language: tl
  text: Kaya si Jesus, na nakaaalam ng lahat ng mangyayari sa kanya,[a] ay lumabas at nagsabi sa kanila, “Sino ang hinahanap ninyo?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring isalin na “sa lahat ng malapit nang sumapit sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Ipinahihiwatig nito ang lohikal at pasalaysay na pagpapatuloy; natural ito sa modernong Tagalog at higit na nagpapanatili ng inferensiyal na puwersa kaysa sa payak na “Pagkatapos.”
- source_word: εἰδὼς
  choice: na nakaaalam
  rationale: Inilalarawan ng participle ang ganap at naunang pagkaalam ni Jesus habang pinananatiling natural ang pangungusap sa Tagalog.
- source_word: πάντα τὰ ἐρχόμενα ἐπ’ αὐτόν
  choice: sa lahat ng mangyayari sa kanya
  rationale: Pinananatili ang kabuuang saklaw ng πάντα at ang diwa ng mga nalalapit na pangyayaring sasapit sa kanya, nang hindi tinutukoy nang higit sa sinasabi ng Griyego.
- source_word: ἐξῆλθεν
  choice: lumabas
  rationale: Karaniwan at tuwirang katumbas na hindi nagdaragdag ng dramatikong kilos na wala sa teksto.
- source_word: λέγει
  choice: nagsabi
  rationale: Isinasalin ang historikal na pangkasalukuyan bilang pangnagdaan, na likas sa pasalaysay na Tagalog.
- source_word: Τίνα
  choice: Sino
  rationale: Bagaman layon ito ng pandiwa sa Griyego, “Sino” ang natural at wastong anyo sa modernong Tagalog.
- source_word: ζητεῖτε
  choice: ang hinahanap ninyo
  rationale: Natural na ipinahahayag ang kasalukuyang paghahanap at pinananatili ang tuwiran ngunit marangal na tono.
theological_decisions:
- issue: Paunang kaalaman ni Jesus sa salaysay
  choice: Ipinahahayag na alam ni Jesus ang lahat ng mangyayari sa kanya.
  alternative: Maaaring gawing mas tahasan na alam niya nang patiuna ang bawat sasapit sa kanya.
  rationale: Malinaw sa talata ang ganap na kamalayan ni Jesus sa nalalapit na mga pangyayari, ngunit hindi ito pinalalawak tungo sa isang sistematikong pahayag na lampas sa mismong teksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “nakaaalam” upang mapanatili ang dignidad ng rehistro, at “Sino ang hinahanap ninyo?” bilang karaniwang modernong tanong.
