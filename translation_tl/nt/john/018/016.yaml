id: JHN.18.16
reference: John 18:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος εἱστήκει πρὸς τῇ θύρᾳ ἔξω. ἐξῆλθεν οὖν ὁ μαθητὴς ὁ ἄλλος ⸀ὁ γνωστὸς ⸂τοῦ ἀρχιερέως⸃ καὶ εἶπεν τῇ θυρωρῷ καὶ εἰσήγαγεν τὸν Πέτρον.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/016.yaml
  text: But Peter was standing outside at the door[a]. So the other disciple, who was known to the high priest[b], went out and spoke to the doorkeeper and brought Peter in.
translation:
  language: tl
  text: Ngunit nakatayo si Pedro sa labas, sa may pintuan. Kaya lumabas ang isa pang alagad, na kilala ng punong pari[a], at kinausap ang babaeng nagbabantay sa pintuan[b], saka ipinasok si Pedro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “na kakilala ng punong pari.” Hindi nililinaw ng Griyego kung gaano kalapit ang kanilang ugnayan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “babaeng nagbabantay sa pasukan.” Ang salitang Griyego ay tumutukoy sa taong nakatalaga sa entrada.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἱστήκει
  choice: nakatayo
  rationale: Ipinahihiwatig ng anyong Griyego ang nagpapatuloy na kalagayan ni Pedro; natural na naihahayag ito ng “nakatayo” sa Tagalog.
- source_word: πρὸς τῇ θύρᾳ ἔξω
  choice: sa labas, sa may pintuan
  rationale: Pinananatili nito kapwa ang lokasyong nasa labas at ang pagiging malapit sa pintuan.
- source_word: ὁ μαθητὴς ὁ ἄλλος
  choice: ang isa pang alagad
  rationale: Ang “alagad” ay likas at nakaugaliang salin ng μαθητής sa salaysay ng Ebanghelyo at taglay ang relasyonal na diwa nito.
- source_word: ὁ γνωστὸς τοῦ ἀρχιερέως
  choice: na kilala ng punong pari
  rationale: Tuwirang salin ito na hindi tinutukoy kung gaano kalapit ang kanilang pagkakakilala.
- source_word: ἀρχιερεύς
  choice: punong pari
  rationale: Karaniwan at tiyak na tawag sa mataas na katungkulang panrelihiyon sa kontekstong Judio.
- source_word: θυρωρῷ
  choice: babaeng nagbabantay sa pintuan
  rationale: Ang salita ay tumutukoy sa taong nakatalaga sa pasukan, at ipinakikita ng pambabaeng artikulo sa Griyego na babae siya.
- source_word: εἶπεν τῇ θυρωρῷ
  choice: kinausap ang babaeng nagbabantay sa pintuan
  rationale: Walang siniping tuwirang sinabi, kaya mas natural ang “kinausap” kaysa “sinabi sa.”
- source_word: εἰσήγαγεν τὸν Πέτρον
  choice: ipinasok si Pedro
  rationale: Natural nitong ipinahahayag na pinahintulutan o tinulungan ng alagad si Pedro na makapasok nang hindi nagdaragdag ng diwang wala sa teksto.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sa may pintuan” at “kinausap” para sa natural na daloy, habang pinanatili ang hindi tiyak na antas ng pagkakakilala ng alagad at ng punong pari.
