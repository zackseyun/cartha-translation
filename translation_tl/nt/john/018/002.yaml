  to: Alam din ni Judas, na nagtataksil sa kanya[a], ang lugar, sapagkat[b] madalas na nagtitipon doon si Jesus kasama ang kanyang mga alagad.
  rationale: Inalis ang hindi kinakailangang demonstratibong “na iyon,” pinakinis ang paglalarawan sa paulit-ulit na pagtitipon ni Jesus, at inayos ang dalawang talababa para sa natural na Filipino, mas tumpak na saklaw, at mas malapit na leksikal na alternatibo. Hindi binabago ng mga ito ang kahulugan ng talata.
