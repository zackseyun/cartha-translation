  text: ᾔδει δὲ καὶ Ἰούδας ὁ παραδιδοὺς αὐτὸν τὸν τόπον, ὅτι πολλάκις ⸀συνήχθη Ἰησοῦς ἐκεῖ μετὰ τῶν μαθητῶν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/002.yaml
  text: Judas, who was betraying him, also knew the place, because Jesus had often gathered there with his disciples.
translation:
  language: tl
  text: Alam din ni Judas, na nagtataksil sa kanya[a], ang lugar, sapagkat[b] madalas na nagtitipon doon si Jesus kasama ang kanyang mga alagad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “na isinusuko siya.”
    reason: lexical_alternative
  - marker: b
    text: O, “sapagkat madalas makipagkita roon si Jesus kasama ang kanyang mga alagad.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: alam
  rationale: Likas at tuwirang katumbas ito ng kaalaman o pagkakakilala ni Judas sa lugar.
- source_word: δὲ
  choice: hindi isinalin nang hiwalay
  rationale: Banayad lamang ang pag-usad na ipinahihiwatig ng δέ; sapat na itong naihahatid ng daloy ng pangungusap sa Tagalog, nang hindi nagdaragdag ng tahasang panandang pamanahon gaya ng “ngayon.”
- source_word: καὶ
  choice: din
  rationale: 'Pinananatili nito ang pandagdag na diwa: alam din ni Judas ang lugar.'
- source_word: ὁ παραδιδοὺς αὐτὸν
  choice: na nagtataksil sa kanya
  rationale: Ipinahahayag ng kasalukuyang pandiwaring Griyego ang nagpapatuloy na papel ni Judas sa salaysay. Ang “nagtataksil” ay natural sa Tagalog at naghahatid ng moral at pasalaysay na diwa ng παραδίδωμι sa kontekstong ito.
- source_word: τὸν τόπον
  choice: ang lugar na iyon
  rationale: Ang “lugar” ang payak na katumbas ng τόπος; nililinaw ng “na iyon” na tinutukoy ang naunang nabanggit na lugar.
- source_word: ὅτι
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan kung bakit alam ni Judas ang lugar.
- source_word: πολλάκις
  choice: madalas
  rationale: Natural at maikli nitong ipinapahayag ang paulit-ulit na pangyayari.
- source_word: συνήχθη
  choice: makipagtipon
  rationale: Ang anyong pasibo ay maaaring magkaroon dito ng diwang intransitibo na “magtipon” o “magkita.” Ang “makipagtipon” ay natural kasama ng pariralang tumutukoy sa mga alagad at pinananatili ang leksikal na diwa ng pagtitipon.
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: sa kanyang mga alagad
  rationale: Kasunod ng “makipagtipon,” natural na ipinahahayag ng “sa” ang pakikisama ni Jesus sa kanyang mga alagad; pinananatili ng “mga alagad” ang ugnayang guro-alagad.
theological_decisions:
- issue: Pagpapakahulugan sa παραδιδοὺς patungkol kay Judas
  choice: nagtataksil
  alternative: nagsasalin sa kanya sa kamay ng iba
  rationale: Sa salaysay ng paghihirap ni Jesus, hindi neutral na paglilipat ang kilos ni Judas kundi pagtataksil. Gayunman, inilalagay sa talababa ang mas literal na larawan ng pagsasalin sa kamay ng iba.
- issue: Diwa ng συνήχθη
  choice: madalas makipagtipon doon si Jesus sa kanyang mga alagad
  alternative: madalas makipagkita roon si Jesus sa kanyang mga alagad
  rationale: Maaaring unawain ang pasibong anyo sa diwang intransitibo. Pinananatili ng pangunahing salin ang larawan ng pagtitipon, habang kinikilala sa talababa ang natural na alternatibong “makipagkita.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sapagkat” para sa dignidad ng salaysay ngunit iniwasan ang lipas o sobrang pormal na mga anyo. Ang ayos na “Alam din ni Judas…” ay natural sa Tagalog at pinananatili ang diin sa kaalaman ni Judas.
