  yaml_path: translation/nt/john/018/021.yaml
  text: Why do you question me? Question those who have heard what I said to them. Look[a], they know what I said.
translation:
  language: tl
  text: Bakit ako ang tinatanong mo? Tanungin mo ang mga nakarinig ng sinabi ko sa kanila. Tingnan mo[a], alam ng mga ito ang sinabi ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “Masdan.” Ang salitang Griyego ay pantawag-pansin.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί με ἐρωτᾷς
  choice: Bakit ako ang tinatanong mo?
  rationale: Ang τί kasabay ng kasalukuyang panahunang ἐρωτᾷς ay tuwirang kumukuwestiyon sa ginagawa ng kausap. Ang diin sa “ako” ay likas na naipapahayag sa Tagalog sa hulma na “ako ang tinatanong mo,” at ang “tinatanong” ay angkop kapuwa sa karaniwang pagtatanong at sa pormal na pagdinig.
- source_word: ἐρώτησον
  choice: Tanungin mo
  rationale: Tuwirang pautos ang aorist imperative. Pinananatili ng “Tanungin mo” ang leksikal na pag-uulit mula sa naunang ἐρωτᾷς nang hindi labis na nagpapasok ng ideya ng pormal na imbestigasyon.
- source_word: τοὺς ἀκηκοότας
  choice: ang mga nakarinig
  rationale: Ang perfect participle ay tumutukoy sa mga taong nakarinig na at makapagpapatotoo ngayon. Natural sa modernong Tagalog ang “mga nakarinig” at hindi nito idinaragdag ang “sa akin,” na wala sa parirala.
- source_word: τί ἐλάλησα αὐτοῖς
  choice: sa sinabi ko sa kanila
  rationale: Karaniwang kahulugan ng λαλέω rito ang pagsasalita o pagsasabi. Ang “sinabi ko sa kanila” ay malinaw at natural, at pinananatili ang αὐτοῖς.
- source_word: ἴδε
  choice: Tingnan mo
  rationale: Ginagamit ang ἴδε upang tawagin ang pansin ng kausap. Ang “Tingnan mo” ay makabago at tuwiran; masyadong makaluma ang “Narito” o “Masdan” sa ganitong usapan.
- source_word: οὗτοι οἴδασιν
  choice: alam nila
  rationale: Bagaman demonstratibo ang οὗτοι, ang “nila” ay natural na tumutukoy pabalik sa “mga nakarinig.” Ang deiktikong puwersa ay naipahihiwatig ng kasunod ng “Tingnan mo,” samantalang magiging alanganin sa Tagalog ang literal na “alam ng mga ito.”
- source_word: ἃ εἶπον ἐγώ
  choice: ang sinabi ko
  rationale: Natural na katumbas ng ἃ εἶπον ang “ang sinabi ko.” Ang tahasang ἐγώ ay may diin, ngunit sapat itong naihahatid ng “ko” at ng pag-uulit ng unang panauhan nang hindi gumagamit ng mabigat na “ako mismo.”
theological_decisions:
- issue: Pormal o hudisyal na himig ng tugon ni Jesus sa punong pari
  choice: Gamitin ang “tinatanong/Tanungin” at hayaang ang konteksto ang magpahiwatig ng pormal na pagtatanong.
  alternative: Gamitin ang “iniinteroga/Interogahin” o “sinisiyasat/Siyasatin.”
  rationale: Maaaring magkaroon ng mas matinding diwa ang ἐρωτάω sa kontekstong ito, ngunit hindi likas na nangangahulugan itong “interogahin.” Pinananatili ng neutral ngunit matatag na “tanong” ang tunay na saklaw ng Griyego at iniiwasang gawing tahasang teknikal ang diwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang tuwirang hamon at ang pag-uulit ng pandiwang “tanong,” habang iniwasan ang sobrang teknikal na salitang legal.
