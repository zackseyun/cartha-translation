    rationale: Ang ἀκηκοότας ay tumatanggap ng nilalamang τί ἐλάλησα αὐτοῖς. Sa Filipino, mas malinaw at tuwirang ipinapakita ito ng "mga nakarinig ng sinabi ko sa kanila."
