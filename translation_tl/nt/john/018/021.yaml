  source_fidelity: Kailangang ayusin ang ugnayan ng pandiwang "nakarinig" at ng nilalaman nitong narinig. Ang "nakarinig sa sinabi ko sa kanila" ay hindi gaanong malinaw at maaaring mabasa bilang pagkarinig hinggil sa sinabi. Ang "nakarinig ng sinabi ko sa kanila" ay tuwirang naghahatid ng τοὺς ἀκηκοότας τί ἐλάλησα αὐτοῖς. Ang demonstratibong οὗτοι ay mas mabuting ipakita sa "mga ito" kaysa lubusang gawing "nila."
  naturalness: Ang binagong pangungusap ay likas sa modernong Filipino at nananatili ang tuwiran ngunit marangal na himig. Natural ang "Tingnan mo" bilang pantawag-pansin sa usapang ito.
  terminology: Ang pares na "tinatanong" at "Tanungin" ay angkop na salin ng paulit na ἐρωτάω at ἐρώτησον. Hindi kinakailangang gawing teknikal na "interogahin."
