  yaml_path: translation/nt/john/018/024.yaml
  text: So Annas sent him bound to Caiaphas the high priest[a].
translation:
  language: tl
  text: Kaya ipinadala ni Anas kay Caifas na punong pari ang nakagapos na si Jesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, ayon sa konteksto: “Naipadala na noon ni Anas kay Caifas na punong pari ang nakagapos na si Jesus,” kung ituturing itong panaklong na paliwanag sa mga naunang pangyayari.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: ipinadala
  rationale: Ang aorist active indicative ng ἀποστέλλω ay nagsasaad dito ng tuwirang kilos sa salaysay; likas at malinaw sa modernong Tagalog ang “ipinadala.”
- source_word: οὖν
  choice: Kaya
  rationale: Ipinapakita ng οὖν ang pagpapatuloy o bunga sa daloy ng salaysay. Pinananatili ng “Kaya” ang ugnayang ito nang hindi labis na pormal.
- source_word: δεδεμένον
  choice: na nakagapos
  rationale: Ang perfect passive participle ng δέω ay naglalarawan sa kalagayan niya nang ipadala siya. Ipinahahayag ng “nakagapos” ang patuloy na resultang kalagayan nang hindi idinaragdag ang diin ng “nakatali pa rin.”
- source_word: πρὸς
  choice: kay
  rationale: Kasama ng pandiwa ng pagpapadala at pangalan ng tao, ang πρός ay nagpapahiwatig ng patungong direksiyon; ang “kay” ang likas na katumbas sa Tagalog.
- source_word: ὁ Ἅννας
  choice: Anas
  rationale: Karaniwang anyo sa Tagalog ng pangalang Ἅννας.
- source_word: Καϊάφαν
  choice: Caifas
  rationale: Karaniwang anyo sa Tagalog ng pangalang Καϊάφας.
- source_word: τὸν ἀρχιερέα
  choice: na punong pari
  rationale: Tumutukoy ang ἀρχιερεύς sa natatanging katungkulan ng mataas na saserdote. Ang “punong pari” ay malinaw at nakaugaliang katawagan sa modernong saling Tagalog.
theological_decisions:
- issue: Pagkakasunod-sunod ng salaysay kaugnay ng nakapaligid na konteksto
  choice: 'Isinalin ang aorist bilang payak na nagdaang kilos: ipinadala ni Anas ang nakagapos na si Jesus kay Caifas.'
  alternative: 'Unawain ang talata bilang panaklong na pagbabalik-tanaw: naipadala na ni Anas si Jesus kay Caifas.'
  rationale: Pinakalikas na mabasa ang aorist indicative bilang pangyayaring sumusunod sa salaysay. Gayunman, maaaring unawain ang talata bilang paliwanag sa naunang paglilipat. Hindi nilulutas ng pangunahing teksto ang tensiyong ito; inilalahad sa talababa ang alternatibong pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nakagapos” sa halip na mas kolokyal na “nakatali,” at pinanatiling maigsi ang payak na daloy ng salaysay.
