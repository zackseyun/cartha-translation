base_translation:
  language: en
  yaml_path: translation/nt/john/018/039.yaml
  text: But you have a custom that I release one man for you at the Passover[a]. So do you want me to release to you the King of the Jews?
translation:
  language: tl
  text: Ngunit may kaugalian kayo na magpalaya ako para sa inyo ng isang tao sa Paskuwa. Kaya, gusto ba ninyong palayain ko para sa inyo ang Hari ng mga Judio?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang hari ng mga taga-Judea.” Ang salitang Griyego ay maaaring tumukoy sa mga Judio o sa mga taga-Judea, depende sa konteksto; dito, lumilitaw ito sa nakapirming titulo na ginagamit sa salaysay ng pagpapakasakit.
    reason: alternative_reading
lexical_decisions:
- source_word: συνήθεια
  choice: kaugalian
  rationale: Ipinahahayag ng “kaugalian” ang isang nakatatag na gawaing panlipunan, hindi lamang personal na gawi.
- source_word: ἵνα ἕνα ἀπολύσω ὑμῖν
  choice: na magpalaya ako ng isang tao para sa inyo
  rationale: Likas sa Filipino ang paglalantad na tao ang tinutukoy ng ἕνα, at ang “magpalaya” ay angkop sa konteksto ng pagpapalaya sa isang bilanggo.
- source_word: ἀπολύω
  choice: magpalaya / palayain
  rationale: Pinananatili nito ang parehong diwa sa dalawang paglitaw ng pandiwa at malinaw itong tumutukoy sa pagpapalaya sa bilanggo.
- source_word: ἐν τῷ πάσχα
  choice: tuwing Paskuwa
  rationale: Sa konteksto ng isang paulit-ulit na kaugalian, natural na ipinahahayag ng “tuwing Paskuwa” ang panahong kaugnay ng kapistahan.
- source_word: βούλεσθε οὖν
  choice: Kaya gusto ba ninyo
  rationale: Ang “Kaya” ay naghahatid ng inferensiyal na ugnayan ng οὖν, habang ang “gusto ba ninyo” ay kasalukuyan at natural na Filipino para sa βούλεσθε.
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: ang Hari ng mga Judio
  rationale: Ang “mga Judio” ang nakaugaliang salin ng Ἰουδαίων sa pormulang titulong ito sa salaysay ng pagpapakasakit; ginawang malaking titik ang “Hari” bilang bahagi ng pormal at mapanuyang titulong ginagamit sa tagpo.
theological_decisions:
- issue: Pagpapakahulugan sa Ἰουδαίων sa titulong τὸν βασιλέα τῶν Ἰουδαίων
  choice: ang Hari ng mga Judio
  alternative: ang hari ng mga taga-Judea
  rationale: Sa salaysay ng pagpapakasakit ni Juan, gumaganap ito bilang kinikilalang paratang o titulong makahari at mesiyaniko na ikinakabit kay Jesus. Pinananatili ng “mga Judio” ang makasaysayan at pansalaysay na gamit, ngunit inilalahad sa talababa ang posibleng heograpikong pagbasa upang hindi ikubli ang saklaw ng salitang Griyego.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “ninyo” at “para sa inyo” upang malinaw na mapanatili ang maramihang kausap at ang dalawang paglitaw ng ὑμῖν. Inilagay ang talababa pagkatapos mismo ng pinagtatalunang titulong “mga Judio.”
