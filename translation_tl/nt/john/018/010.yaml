reference: John 18:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Σίμων οὖν Πέτρος ἔχων μάχαιραν εἵλκυσεν αὐτὴν καὶ ἔπαισεν τὸν τοῦ ἀρχιερέως δοῦλον καὶ ἀπέκοψεν αὐτοῦ τὸ ⸀ὠτάριον τὸ δεξιόν. ἦν δὲ ὄνομα τῷ δούλῳ Μάλχος.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/010.yaml
  text: Then Simon Peter[a], having a sword, drew it and struck the high priest’s servant and cut off his right ear. Now the servant’s name was Malchus.
translation:
  language: tl
  text: Kaya si Simon Pedro, na may tabak, ay binunot iyon at tinaga ang alipin[a] ng punong pari, at pinutol ang kanang tainga nito. Malco ang pangalan ng alipin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lingkod.” Ang salitang Griyego na doulos ay maaaring mangahulugang “alipin” o “lingkod,” ayon sa konteksto.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Ipinapakita ang ugnayan at pagsulong ng salaysay mula sa naunang tagpo, nang hindi ito ginagawang mas tahasang lohikal kaysa sa Griyego.
- source_word: ἔχων μάχαιραν
  choice: na may tabak
  rationale: Natural na Filipino para sa participial phrase; ang “tabak” ay malawak at karaniwang katumbas ng μάχαιρα, na maaaring tumukoy sa tabak o maikling tabak.
- source_word: εἵλκυσεν αὐτὴν
  choice: binunot iyon
  rationale: Sa konteksto ng sandata, malinaw na ipinahihiwatig ang pagbunot nito mula sa kinalalagyan o kaluban.
- source_word: ἔπαισεν
  choice: tinaga
  rationale: Ang “tinaga” ay natural sa Filipino para sa paghampas gamit ang matalim na sandata at angkop sa kasunod na pagkatagpas ng tainga.
- source_word: τὸν τοῦ ἀρχιερέως δοῦλον
  choice: ang alipin ng punong pari
  rationale: Pinananatili ng “alipin” ang bonded status na ipinahihiwatig ng δοῦλος at ng kaugnayan nito sa punong pari; inilalagay sa talababa ang posibleng “lingkod.”
- source_word: ἀπέκοψεν
  choice: natagpas
  rationale: Tumpak at likas na inilalarawan ang pagkaputol dahil sa pagtaga, nang hindi nagdaragdag ng di-tiyak na detalye.
- source_word: ὠτάριον τὸ δεξιόν
  choice: ang kanang tainga
  rationale: Ang diminutive na ὠτάριον ay karaniwang tumutukoy lamang sa tainga; hindi sapat ang batayan upang gawing mas tiyak na “pingol ng tainga.”
- source_word: ἦν δὲ ὄνομα τῷ δούλῳ Μάλχος
  choice: Malco ang pangalan ng alipin
  rationale: Likas na Filipino na paglalahad ng impormasyong nagpapakilala sa alipin; “Malco” ang anyong angkop sa Filipino ng pangalang Μάλχος.
theological_decisions:
- issue: Pagpapakahulugan sa δοῦλος
  choice: alipin
  alternative: lingkod
  rationale: Mas tuwirang pinananatili ng “alipin” ang kalagayang nasa ilalim ng kapangyarihan ng punong pari. Gayunman, maaaring gamitin ang δοῦλος sa mas malawak na diwang “lingkod,” kaya pinananatili ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tinaga” at “natagpas” upang maging natural ang kilos ng tabak, habang iniwasang tukuyin ang “tainga” bilang pingol lamang dahil hindi iyon hinihingi ng Griyego.
