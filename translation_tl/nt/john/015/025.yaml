id: JHN.15.25
reference: John 15:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀλλ’ ἵνα πληρωθῇ ὁ λόγος ὁ ⸂ἐν τῷ νόμῳ αὐτῶν γεγραμμένος⸃ ὅτι Ἐμίσησάν με δωρεάν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/025.yaml
  text: 'But this happened so that the word written in their Law might be fulfilled: ‘They hated me without cause.’[a][b][c]'
translation:
  language: tl
  text: 'Ngunit nangyari ito upang matupad ang salitang nakasulat sa kanilang Kautusan: “Kinapootan nila ako nang walang dahilan.”[a][b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas pormal na anyo, “Ngunit upang matupad ang salitang nakasulat sa kanilang Kautusan.” Bitin ang pangunahing sugnay sa Griyego; ang “nangyari ito” ay ipinahiwatig ng konteksto.
    reason: lexical_alternative
  - marker: b
    text: Ang “kanilang Kautusan” ay gumagamit ng “Kautusan” sa mas malawak na kahulugang Judio na tumutukoy sa mga Kasulatan; mula sa Mga Awit ang sipi (tingnan ang Awit 35:19; 69:4).
    reason: cross_reference
  - marker: c
    text: O “nang walang anumang dahilan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Ngunit nangyari ito
  rationale: Ang ἀλλά ay nagpapakita ng pagsalungat o paglipat mula sa naunang pahayag. Dahil bitin ang sugnay sa Griyego, idinagdag ang “nangyari ito” mula sa konteksto upang maging likas at malinaw sa Tagalog.
- source_word: ἵνα πληρωθῇ
  choice: upang matupad
  rationale: Pinananatili ng “upang” ang maaaring diwa ng layunin o kinalabasan ng ἵνα at ng pasibong pandiwang πληρωθῇ, nang hindi labis na nililinaw ang ugnayang teolohikal.
- source_word: ὁ λόγος
  choice: ang salita
  rationale: Tumutukoy ito sa isang tiyak na pahayag ng Kasulatan. Ang “salita” ay maikli, likas, at hindi ipinagkakamali sa natatanging gamit ng Logos sa pasimula ng Juan.
- source_word: ἐν τῷ νόμῳ αὐτῶν γεγραμμένος
  choice: nakasulat sa kanilang Kautusan
  rationale: Ipinahihiwatig ng perpektong pasibong participle na ito ay nananatiling nakasulat. Pinananatili ang “kanilang” at ang tahasang salitang νόμος.
- source_word: νόμῳ
  choice: Kautusan
  rationale: Pinananatili ang literal na katawagang νόμος, bagaman sa kontekstong ito ay mas malawak ang saklaw nito at kabilang ang Mga Awit.
- source_word: ὅτι
  choice: ':'
  rationale: Ang tutuldok ay likas na nagpapakilala sa nilalaman ng sipi sa makabagong Tagalog.
- source_word: Ἐμίσησάν με
  choice: Kinapootan nila ako
  rationale: Ang payak na aspektong naganap ay angkop sa sipi. Ang “kinapootan” ay dignified at malinaw na tumutukoy sa matinding pagkamuhi.
- source_word: δωρεάν
  choice: nang walang dahilan
  rationale: Sa kontekstong ito, nangangahulugan itong walang sapat na sanhi o batayan; malinaw at likas ang parirala sa modernong Tagalog.
theological_decisions:
- issue: Ang kahulugan ng “kanilang Kautusan” gayong mula sa Mga Awit ang sipi
  choice: Panatilihin ang “Kautusan” sa pangunahing teksto at ipaliwanag na maaari itong tumukoy nang malawakan sa mga Kasulatang Judio.
  alternative: Isalin bilang “Kasulatan” upang tahasang ipakita ang mas malawak na saklaw.
  rationale: Tahasan sa Griyego ang νόμος. Ang pagpapanatili rito ay gumagalang sa anyo at tensiyon ng pinagmulan, habang nililinaw ng talababa na hindi lamang ang limang aklat ni Moises ang tinutukoy.
- issue: Ang elipsis pagkatapos ng ἀλλ’
  choice: Idagdag ang “nangyari ito” para sa malinaw at likas na Tagalog.
  alternative: 'Iwan itong mas pormal: “Ngunit upang matupad ang salitang...”'
  rationale: Umaasa ang Griyegong pangungusap sa naunang konteksto. Hindi nagdaragdag ng bagong pangyayaring teolohikal ang suplay; ginagawa lamang nitong buo ang pangungusap sa Tagalog.
- issue: Layunin o kinalabasan sa ἵνα πληρωθῇ
  choice: Gamitin ang “upang matupad,” na maaaring magpahiwatig ng layunin o kinalabasan ayon sa konteksto.
  alternative: Gamitin ang “kaya natupad” at unahin ang kinalabasan.
  rationale: Hindi dapat tahasang lutasin ng salin ang saklaw ng ἵνα. Pinananatili ng “upang” ang pormula ng katuparan at ang likas na tensiyon nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino Tagalog. Pinanatili ang biblikal na “Kautusan” ngunit iniwasan ang labis na arkaikong ayos. Ang “Kinapootan” ay mas dignified kaysa kolokyal na “Galit sila sa akin,” at tapat sa lakas ng μισέω.
