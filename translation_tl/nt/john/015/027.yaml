  text: And you also testify[b][a], because you have been with me from the beginning.
translation:
  language: tl
  text: At nagpapatotoo rin kayo[a], sapagkat mula pa sa simula ay kasama ko na kayo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “sumasaksi.”
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “kayo ay kasama ko”; ipinahahayag dito ang kalagayang nagpapatuloy mula sa simula hanggang sa kasalukuyan.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὑμεῖς δὲ
  choice: At … rin kayo
  rationale: Pinananatili ng “At” ang ugnayan sa naunang pahayag, habang ipinapakita ng “rin kayo” ang diin sa mga alagad bilang mga karagdagang saksi kasama ng Espiritung binanggit sa naunang talata.
- source_word: μαρτυρεῖτε
  choice: nagpapatotoo
  rationale: Likas at malinaw na salin ito ng pangkasalukuyang pandiwang tumutukoy sa pagbibigay ng patotoo bilang saksi. Pinananatili rin nito ang maaaring pormal o panghukuman na himig ng salita.
- source_word: ὅτι
  choice: sapagkat
  rationale: 'Sa konteksto, ipinakikilala nito ang dahilan kung bakit nagpapatotoo ang mga alagad: nakasama na sila ni Jesus mula pa sa simula.'
- source_word: ἀπ’ ἀρχῆς
  choice: mula pa sa simula
  rationale: Natural na pariralang Filipino na nagpapanatili sa hindi espesipikong “simula” ng Griyego at nagpapahiwatig ng pagpapatuloy mula noon.
- source_word: μετ’ ἐμοῦ ἐστε
  choice: kasama ko na kayo
  rationale: Bagaman literal na pangkasalukuyan ang ἐστε (“kayo ay”), ipinahahayag ng “kasama ko na kayo” ang kalagayang nagsimula noon at nagpapatuloy hanggang sa kasalukuyan.
theological_decisions:
- issue: Saklaw ng “mula pa sa simula”
  choice: Iniwan itong “mula pa sa simula” nang hindi tinutukoy sa pangunahing teksto kung aling simula.
  alternative: Tahasang tukuyin bilang “mula pa sa simula ng aking ministeryo” o unawain bilang isang ganap at metapisikal na simula.
  rationale: Ipinahihiwatig ng konteksto ang simula ng pakikisama ng mga alagad kay Jesus, malamang mula sa kanyang pampublikong ministeryo, ngunit hindi ito tahasang tinutukoy ng Griyegong teksto. Pinananatili ng salin ang tunay na lawak at tensiyon ng parirala.
- issue: Anyo ng μαρτυρεῖτε
  choice: 'Isinalin bilang pahayag: “nagpapatotoo rin kayo.”'
  alternative: 'Unawain bilang utos: “magpatotoo rin kayo.”'
  rationale: Ang anyong Griyego ay pangkasalukuyang aktibong indikatibo, kaya pangunahing binabasa ito bilang pahayag, hindi bilang pautos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nagpapatotoo” sa halip na mas teknikal o lipas na pananalita, at ang “sapagkat” upang mapanatili ang bahagyang pormal na himig na angkop sa Kasulatan.
