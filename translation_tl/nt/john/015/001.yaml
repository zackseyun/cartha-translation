  yaml_path: translation/nt/john/015/001.yaml
  text: I am the true vine[a], and my Father is the vinegrower.
translation:
  language: tl
  text: “Ako ang tunay na puno ng ubas, at ang aking Ama ang magsasaka.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tagapag-alaga ng ubasan.” Ang salitang Griyego ay tumutukoy sa isang magsasaka o tagapaglilinang ng lupa; sa konteksto ng puno ng ubas, maaari rin itong tumukoy sa tagapag-alaga ng ubasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: Ako ang
  rationale: Likas na paraan ito sa Tagalog upang ipakilala ang sarili sa isang panaguring pangngalan. Sapat ding naipahahayag ng “Ako” ang tahasang diin ng Ἐγώ.
- source_word: ἄμπελος
  choice: puno ng ubas
  rationale: Ito ang malinaw at karaniwang katumbas sa modernong Tagalog at pinananatili ang larawang talinghaga.
- source_word: ἀληθινή
  choice: tunay
  rationale: Pinananatili ng “tunay” ang saklaw na totoo, tunay sa diwa, at ganap na tumutugma sa realidad ng Diyos sa gamit ni Juan, nang hindi labis na ipinapaliwanag ang talinghaga.
- source_word: πατήρ μου
  choice: aking Ama
  rationale: Natural at marangal na pagtukoy ito sa Diyos bilang Ama ni Jesus; ipinahihiwatig ng malaking titik ang banal na tinutukoy nang hindi dinaragdagan ang teksto.
- source_word: γεωργός
  choice: tagapag-alaga nito
  rationale: Ang γεωργός ay taong nagsasaka o naglilinang ng lupa. Sa konteksto ng puno ng ubas, malinaw na tumutukoy ito sa nag-aalaga at nagtatanim nito; nililinaw ng “nito” ang kaugnayan sa puno ng ubas nang hindi gumagamit ng di-karaniwang teknikal na salita.
theological_decisions:
- issue: Ang talinghagang pagkakakilanlan sa pahayag ni Jesus
  choice: Panatilihin nang tuwiran ang talinghaga bilang “Ako ang tunay na puno ng ubas.”
  alternative: Ako ang totoong puno ng ubas.
  rationale: Ang “tunay” ay nagpapanatili sa teolohikal na lalim at posibleng diwa ng katuparan sa bokabularyo ni Juan, nang hindi ipinapaliwanag o nilulutas ang talinghaga sa mismong salin.
- issue: Paglalarawan sa Ama bilang γεωργός
  choice: tagapag-alaga nito
  alternative: magsasaka ng ubas; tagapagtanim ng ubas; tagapangalaga ng ubasan
  rationale: Iniuugnay ng konteksto ang malawak na salitang γεωργός sa pag-aalaga ng puno ng ubas. Ang napiling salin ay madaling maunawaan at hindi nagdaragdag ng isang tiyak na interpretasyong denominasyonal; inilalahad sa talababa ang mas literal na saklaw.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “puno ng ubas” sa halip na teknikal o di-karaniwang katawagan, at pinanatili ang payak na anyo ng talinghaga.
