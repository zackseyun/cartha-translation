  naturalness: Natural at marangal ang unang sugnay. Mas malinaw at mas likas sa modernong Filipino ang “magsasaka” kaysa “tagapag-alaga nito,” na maaaring tumukoy sa sinumang tagapagbantay o tagapag-alaga at may malabong panuring.
  terminology: Panatilihin ang “tunay na puno ng ubas” at ang malaking titik sa “Ama.” Gamitin ang “magsasaka” para sa γεωργός, at ilagay sa talababa ang kontekstuwal na alternatibong “tagapag-alaga ng ubasan.”
