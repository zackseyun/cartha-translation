  text: 'No one has greater love than this: that someone lay down his life for his friends[a][b][c][d].'
translation:
  language: tl
  text: 'Walang sinumang may pag-ibig na higit pa rito: na ang isang tao ay mag-alay ng kanyang buhay para sa kanyang mga kaibigan.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “buhay” ay salin ng Griyegong psychē, na maaari ring mangahulugang “kaluluwa” o “sarili”; dito ay tumutukoy ito sa buhay na ibinibigay hanggang kamatayan.
    reason: lexical_alternative
  - marker: b
    text: Ang “para sa” ay maaari ring isaling “alang-alang sa” o “para sa kapakanan ng.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μείζονα ταύτης ἀγάπην
  choice: pag-ibig na higit pa rito
  rationale: Pinananatili ang paghahambing at ang pasulong na pagtukoy ng ταύτης sa kasunod na sugnay, sa natural na ayos ng modernong Tagalog.
- source_word: οὐδεὶς ἔχει
  choice: Walang sinuman ang may
  rationale: Tuwirang ipinapahayag ang pangkalahatang pagtanggi at likas itong pakinggan sa Tagalog.
- source_word: ἵνα τις
  choice: ang ... ng isang tao
  rationale: Ginagamit dito ang ἵνα upang ipakilala ang nilalaman o pagpapaliwanag ng “ito,” samantalang pinananatili ng “isang tao” ang di-tiyak at pangkalahatang paksa ng τις.
- source_word: τὴν ψυχὴν αὐτοῦ θῇ
  choice: ialay ... ang kanyang buhay
  rationale: Sa kontekstong ito, ang ψυχή ay buhay na kusang ibinibigay hanggang kamatayan. Mas natural sa Tagalog ang “ialay ang buhay” kaysa sa literal na “ilapag ang buhay,” habang pinananatili ang diwa ng τίθημι.
- source_word: ὑπὲρ τῶν φίλων αὐτοῦ
  choice: para sa kanyang mga kaibigan
  rationale: Ang “para sa” ay natural at hindi labis na nagtatakda kung ang ὑπέρ ay dapat unawain bilang alang-alang sa, para sa kapakanan ng, o bilang kapalit ng.
theological_decisions:
- issue: Kahulugan ng ψυχή sa pananalita tungkol sa kusang pagsasakripisyo
  choice: buhay
  alternative: kaluluwa; sarili
  rationale: Ang tinutukoy ay ang kongkretong pagbibigay ng sariling buhay hanggang kamatayan, hindi isang diin sa paghihiwalay ng katawan at kaluluwa.
- issue: Lakas ng ὑπέρ kaugnay ng mapagsakripisyong pag-ibig
  choice: para sa
  alternative: alang-alang sa; para sa kapakanan ng; bilang kapalit ng
  rationale: Pinananatili ng payak na salin ang malawak na saklaw ng preposisyon at hindi ipinipilit ang isang mas tiyak na teolohikal na pagbasa kaysa sa hinihingi ng talata.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “ialay ang buhay” bilang likas na idyomatikong katumbas ng Griyegong pariralang “ilagay/ilapag ang buhay,” at “isang tao ... kanyang” upang mapanatili ang di-tiyak na isahan nang hindi nililimitahan sa kasariang lalaki.
