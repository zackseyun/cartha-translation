id: JHN.15.16
reference: John 15:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὐχ ὑμεῖς με ἐξελέξασθε, ἀλλ’ ἐγὼ ἐξελεξάμην ὑμᾶς, καὶ ἔθηκα ὑμᾶς ἵνα ὑμεῖς ὑπάγητε καὶ καρπὸν φέρητε καὶ ὁ καρπὸς ὑμῶν μένῃ, ἵνα ὅ τι ἂν αἰτήσητε τὸν πατέρα ἐν τῷ ὀνόματί μου δῷ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/016.yaml
  text: You did not choose me[a], but I chose you and appointed you so that you should go and bear fruit, and that your fruit should remain, so that whatever you ask the Father in my name[c][b], he may give you.
translation:
  language: tl
  text: Hindi kayo ang pumili sa akin[a], kundi ako ang pumili sa inyo at humirang sa inyo upang humayo kayo at mamunga, at upang manatili[b] ang inyong bunga, upang ibigay sa inyo ng Ama[c] ang anumang hingin ninyo sa pangalan ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “humirang.” Ang pandiwa ay nangangahulugang pumili o hirangin; ginamit ang “pumili” upang mapanatili ang tuwirang paghahambing sa unang bahagi ng pangungusap nang hindi gumagamit ng teknikal na terminong teolohikal.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “magpatuloy” o “magtagal.” Madalas gamitin ni Juan ang pandiwang ito para sa pananatili o patuloy na kaugnayan; dito, ang bunga ang sinasabing mananatili.
    reason: lexical_alternative
  - marker: c
    text: Ang Griyego ay nagsasabing “ang Ama,” hindi “ang aking Ama.”
    reason: textual_precision
lexical_decisions:
- source_word: ἐξελέξασθε / ἐξελεξάμην
  choice: pumili / pumili
  rationale: Likas at malinaw sa modernong Tagalog ang “pumili,” at pinananatili nito ang tuwirang paghahambing ng ginawa ng mga alagad at ng ginawa ni Jesus nang hindi ipinapasok sa pangunahing teksto ang teknikal na terminong teolohikal na “itinalaga.”
- source_word: ἔθηκα
  choice: humirang
  rationale: Bagaman literal na maaaring mangahulugang “naglagay” o “nagtakda,” ipinahihiwatig ng konteksto ang sadyang pag-aatas sa mga alagad para sa paghayong mamunga. Ang “humirang” ay natural at hindi nililimitahan ang pahayag sa ordinasyon sa isang katungkulan.
- source_word: ἵνα
  choice: upang
  rationale: Malinaw na ipinapahayag ng “upang” ang layunin ng dalawang sugnay at pinananatili ang ugnayang sintaktiko ng talata.
- source_word: ὑπάγητε
  choice: humayo
  rationale: Ang “humayo” ay dignificado at karaniwang biblikal na Tagalog para sa pagpunta na may layunin; hindi nito labis na tinutukoy kung saan o sa anong tiyak na gawaing misyonero sila pupunta.
- source_word: καρπὸν φέρητε
  choice: mamunga
  rationale: Natural na pandiwang Tagalog ang “mamunga” at pinananatili nito ang talinghaga ng bunga sa kontekstong Juanino.
- source_word: μένῃ
  choice: manatili
  rationale: Ang “manatili” ay malinaw at makabagong katumbas na maaaring tumukoy sa pagpapatuloy o pananatili sa paglipas ng panahon, habang pinananatili ang mahalagang bokabularyong Juanino.
- source_word: ὅ τι ἂν αἰτήσητε
  choice: ang anumang hingin ninyo
  rationale: Ipinahahayag ng “anuman” ang di-tiyak na lawak ng pariralang Griyego, at natural ang “hingin” sa konteksto ng panalangin.
- source_word: ἐν τῷ ὀνόματί μου
  choice: sa pangalan ko
  rationale: Ito ang natural at nakaugaliang katumbas sa Tagalog, at pinananatili ang teolohikal at relasyonal na puwersa ng parirala nang hindi ito labis na ipinapaliwanag.
- source_word: δῷ
  choice: ibigay
  rationale: Sa pagkakabuo ng “upang ibigay,” nananatili ang dependenteng layunin/bungang puwersa ng aorist subjunctive sa ilalim ng ἵνα, sa halip na gawing payak at hiwalay na pangakong panghinaharap.
- source_word: τὸν πατέρα
  choice: ang Ama
  rationale: Tumpak nitong pinananatili ang Griyegong “ang Ama,” hindi “ang aking Ama.”
theological_decisions:
- issue: Posibleng doktrinal na labis na pagbasa sa ἐξελεξάμην bilang teknikal na pagtatalaga o election
  choice: Isinalin bilang “ako ang pumili sa inyo” sa agarang konteksto ng pagiging alagad at misyon.
  alternative: “Ako ang nagtalaga sa inyo” o paggamit ng teknikal na terminong tumutukoy sa election.
  rationale: Tiyak na binibigyang-diin ng talata ang pagkukusa ni Jesus, ngunit ang karaniwang kahulugan ng pandiwa ay “pumili.” Hindi dapat ipasok ng salin ang isang mas huling sistematikong kategorya na hindi tahasang hinihingi ng salita.
- issue: Kahulugan ng ἔθηκα ὑμᾶς
  choice: Inunawa bilang paghirang o pag-aatas sa layuning humayo at mamunga.
  alternative: Literal na “inilagay ko kayo,” o eksklusibong pag-unawa bilang ordinasyon sa isang opisyal na katungkulan.
  rationale: Ang konteksto ay tungkol sa pagbibigay ni Jesus ng layunin sa mga alagad. Ipinahahayag ito ng “humirang” nang malinaw ngunit hindi ipinapako sa isang partikular na katungkulang pansimbahan.
- issue: Puwersa ng huling sugnay na ἵνα
  choice: 'Pinanatili bilang sugnay ng layunin/bunga: “upang ibigay sa inyo ng Ama...”'
  alternative: 'Gawing tuwirang pangakong panghinaharap: “ibibigay sa inyo ng Ama.”'
  rationale: Ikinakabit ng sintaks na Griyego ang paghingi at pagbibigay sa naunang paghirang at pamumunga. Iniiwasan ng salin na gawing hiwalay at walang pasubaling pormula ang pangungusap.
translation_notes:
  register: Modernong Filipino Tagalog na natural, dignificado, at madaling maunawaan. Pinanatili ang talinghaga ng pamumunga, ang pag-uulit ng “upang,” at ang diin sa pagkukusa ni Jesus. Ginamit ang “humayo” bilang bahagyang mataas ngunit pamilyar na anyo na angkop sa tekstong banal; iniwasan ang arkaikong estruktura at ang denominasyonal na bokabularyo.
