  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰ τὰ ἔργα μὴ ἐποίησα ἐν αὐτοῖς ἃ οὐδεὶς ἄλλος ⸀ἐποίησεν, ἁμαρτίαν οὐκ ⸀εἴχοσαν· νῦν δὲ καὶ ἑωράκασιν καὶ μεμισήκασιν καὶ ἐμὲ καὶ τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/024.yaml
  text: If I had not done among them the works that no one else did[a], they would not have sin[b]; but now they have both seen and hated both me and my Father.
translation:
  language: tl
  text: Kung hindi ko ginawa sa gitna nila ang mga gawang hindi ginawa ng sinumang iba, wala sana silang kasalanan[a]. Ngunit ngayo'y nakita nila ang mga iyon, at kinapootan nila kapuwa ako at ang aking Ama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal na Griyego: “hindi sana sila nagkaroon ng kasalanan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἔργα
  choice: ang mga gawa
  rationale: Pinananatili ng “mga gawa” ang karaniwang gamit ni Juan para sa mga gawa ni Jesus na naghahayag ng kaniyang pagkakakilanlan at misyon.
- source_word: ἐποίησα ἐν αὐτοῖς
  choice: ginawa ko sa gitna nila
  rationale: Ang ἐν αὐτοῖς ay lokatibo at tumutukoy sa mga gawang isinagawa ni Jesus sa kanilang harapan; natural at malinaw sa Tagalog ang “sa gitna nila.”
- source_word: ἃ οὐδεὶς ἄλλος ἐποίησεν
  choice: na hindi ginawa ng sinuman
  rationale: Ipinahahayag nito nang tuwiran ang pagiging natatangi ng mga gawa ni Jesus nang hindi nagdaragdag ng paliwanag.
- source_word: ἁμαρτίαν οὐκ εἴχοσαν
  choice: wala sana silang kasalanan
  rationale: Ang literal na “hindi sana sila nagkaroon ng kasalanan” ay asiwa sa Tagalog. Ang “wala sana silang kasalanan” ang likas na katumbas ng idyomang Griyego na “hindi sana sila may kasalanan,” habang iniiwasang paliitin ito sa damdamin lamang ng pagkakasala.
- source_word: νῦν δὲ
  choice: ngunit ngayo'y
  rationale: Malinaw nitong minamarkahan ang salungatan sa pagitan ng di-nangyaring kondisyon at ng kasalukuyang katotohanan.
- source_word: καὶ ἑωράκασιν καὶ μεμισήκασιν
  choice: nakita nila ang mga iyon, at kinapootan nila
  rationale: Ipinakikita ng mga perpektong pandiwa ang mga naganap na kilos na may nananatiling kabuluhan. Inilalantad sa Tagalog ang ipinahiwatig na layon ng “nakita” upang maiwasang mapagkamalang nakita nila mismo ang Ama; ang pinakamalapit na layon sa konteksto ay ang mga gawa.
- source_word: καὶ ἐμὲ καὶ τὸν πατέρα μου
  choice: kapuwa ako at ang aking Ama
  rationale: Pinananatili ng “kapuwa ... at ...” ang mariing pag-uugnay ng dalawang layon sa Griyego.
theological_decisions:
- issue: Kahulugan ng ἁμαρτίαν οὐκ εἴχοσαν at pananagutan sa kasalanan
  choice: wala sana silang kasalanan
  alternative: hindi sana sila mananagot sa kasalanan
  rationale: Ipinahihiwatig ng talata ang higit na pananagutan dahil sa mga natatanging gawa ni Jesus, ngunit pinananatili ng salin ang mas malawak na pananalitang “may/walang kasalanan” sa halip na limitahan ito sa isang tahasang pormulang legal.
- issue: Layon ng “nakita” sa νῦν δὲ καὶ ἑωράκασιν
  choice: ang mga iyon, na tumutukoy sa mga gawa
  alternative: 'walang tahasang layon: “nakakita sila”'
  rationale: Walang nakasaad na layon sa Griyego, ngunit likas na nangangailangan ng mas malinaw na layon ang Tagalog. Ang “mga iyon” ay tumutukoy sa mga gawang binanggit sa unang sugnay at hindi nagpapahiwatig na literal nilang nakita ang Ama.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “ngayo'y” bilang bahagyang pormal ngunit pangkaraniwang anyo; iniwasan ang teknikal o denominasyonal na pananalita.
