  terminology: Ang “mga gawa,” “kasalanan,” at “Ama” ay angkop at pare-pareho sa karaniwang rehistro ng Juan. Ang paliwanag ng talababa tungkol sa pananagutan ay higit na interpretatibo kaysa sa kinakailangan para sa lexical alternative at dapat alisin.
