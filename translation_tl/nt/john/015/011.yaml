base_translation:
  language: en
  yaml_path: translation/nt/john/015/011.yaml
  text: I have spoken these things to you so that my joy may be in you[b][a], and your joy may be made full.
translation:
  language: tl
  text: Sinabi ko sa inyo ang mga bagay na ito upang ang kagalakan ko ay nasa inyo[a], at malubos ang inyong kagalakan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nasa gitna ninyo.”
    reason: lexical_alternative
  - marker: b
    text: O, “maging ganap ang inyong kagalakan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: ang mga bagay na ito
  rationale: Pinananatili ang tahasang pangmaramihang demonstratibo at malinaw na tumutukoy sa mga naunang sinabi ni Jesus.
- source_word: λελάληκα ὑμῖν
  choice: Sinabi ko sa inyo
  rationale: Likas sa modernong Tagalog at ipinahahayag ang natapos nang pagsasalita na may bisa sa kasalukuyang pahayag; ang “sa inyo” ay angkop sa datibong pangmaramihan.
- source_word: ἵνα
  choice: upang
  rationale: Malinaw at marangal na panandang nagpapahayag ng layunin, habang nananatiling natural sa kasalukuyang Tagalog.
- source_word: ἡ χαρὰ ἡ ἐμὴ
  choice: ang kagalakan ko
  rationale: Tuwirang pinananatili ang pag-aari ni Jesus sa kagalakan nang hindi ipinapaliwanag kung ito ay kagalakang ibinibigay niya o sarili niyang kagalakang ibinabahagi.
- source_word: ἐν ὑμῖν ᾖ
  choice: mapasainyo
  rationale: Likas na anyong nagsasaad na ang kagalakan ay mapunta at mapasa mga alagad; maaari rin nitong dalhin ang saklaw na “nasa loob ninyo” o “kasama/nasa gitna ninyo,” kaya nilalagyan ng talababa ang tunay na leksikal na posibilidad.
- source_word: καὶ
  choice: at
  rationale: Pinananatili ang payak na pag-uugnay ng dalawang layuning ipinahayag sa pangungusap.
- source_word: ἡ χαρὰ ὑμῶν
  choice: ang inyong kagalakan
  rationale: Natural na pormal na Tagalog na malinaw na itinatambal sa “kagalakan ko.”
- source_word: πληρωθῇ
  choice: malubos
  rationale: Ipinahahayag ang pasibong diwa ng pagdating sa ganap na kapuspusan o kaganapan at karaniwang iniuugnay nang natural sa “kagalakan” sa Tagalog.
theological_decisions:
- issue: Kalikasan ng “kagalakan ko” sa konteksto ni Juan
  choice: ang kagalakan ko
  alternative: ang kagalakang ibinibigay ko
  rationale: Hindi tinutukoy ng Griyego kung ito ay sariling kagalakan ni Jesus na ibinabahagi o kagalakang nagmumula sa kanya. Iniiwasan ng salin ang paglilimita sa mayamang teolohikal na saklaw ng parirala.
- issue: Saklaw ng ἐν ὑμῖν
  choice: mapasainyo
  alternative: mapasa gitna ninyo
  rationale: Maaaring tumukoy ang ἐν sa pagiging nasa loob ng mga alagad o nasa gitna nila bilang isang pangkat. Pinapanatili sa pangunahing teksto ang mas malawak at natural na pahayag at inilalahad sa talababa ang alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na may dignidad at madaling maunawaan. Ginamit ang “inyong” upang luminaw ang pangmaramihang kausap at upang bumagay sa himig ng tuwirang pagtuturo ni Jesus; iniwasan ang labis na literal o denominasyonal na pagpapaliwanag.
