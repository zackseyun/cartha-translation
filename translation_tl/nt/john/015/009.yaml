  text: καθὼς ἠγάπησέν με ὁ πατήρ, κἀγὼ ⸂ὑμᾶς ἠγάπησα⸃, μείνατε ἐν τῇ ἀγάπῃ τῇ ἐμῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/009.yaml
  text: Just as the Father has loved me[a], I also have loved you; remain in my love.
translation:
  language: tl
  text: Kung paanong minahal ako ng Ama, minahal ko rin kayo.[a] Manatili kayo sa aking pag-ibig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang mga pandiwang Griyego ay nasa aorist at maaari ring isaling, “Kung paanong inibig ako ng Ama, inibig ko rin kayo.” Ang “minahal” ay naglalahad ng mga kilos bilang naganap, ngunit hindi nito ipinahihiwatig na natapos na o wala nang bisa ang pag-ibig na ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: Kung paanong
  rationale: 'Likas na naghahayag ng paghahambing at pagkakatugma sa Filipino: ang pag-ibig ng Ama kay Jesus ang huwaran ng pag-ibig ni Jesus sa mga alagad.'
- source_word: ἠγάπησέν με ὁ πατήρ
  choice: minahal ako ng Ama
  rationale: Ang “minahal” ay malinaw at likas na modernong salin ng ἀγαπάω; pinananatili ng ayos ang Ama bilang gumagawa ng kilos at si Jesus bilang tumatanggap nito.
- source_word: κἀγὼ ὑμᾶς ἠγάπησα
  choice: minahal ko rin kayo
  rationale: Ipinapahayag ng “rin” ang nag-uugnay at nagtutugmang diwa ng κἀγώ, habang malinaw na maramihan ang “kayo.”
- source_word: μείνατε
  choice: Manatili kayo
  rationale: Ang “manatili” ay kasalukuyan, malinaw, at marangal na katumbas ng utos na magpatuloy o manatili; hindi nito ginagamit ang mas mabigat o makalumang pananalita.
- source_word: ἐν τῇ ἀγάπῃ τῇ ἐμῇ
  choice: sa aking pag-ibig
  rationale: Pinananatili nito ang karaniwang kahulugan ng ἀγάπη at ang likas na kalabuan ng pariralang naglalarawan sa pag-ibig bilang kay Jesus, nang hindi tinutukoy nang higit sa sinabi ng Griyego kung ito ay pag-ibig na ibinibigay niya o ang kalagayang pinananahanan ng mga alagad.
theological_decisions:
- issue: Kahulugan ng ἀγάπη
  choice: pag-ibig
  alternative: pagmamahal
  rationale: Ang “pag-ibig” ay marangal, malinaw, at nakaugat na katumbas sa kontekstong ito; hindi ito nagdaragdag ng natatanging denominasyonal na kahulugan.
- issue: Aspekto ng ἠγάπησέν at ἠγάπησα
  choice: minahal / minahal
  alternative: patuloy na minamahal / patuloy na minamahal
  rationale: Ang mga pandiwa ay nasa aorist. Ang aspektong naganap ng Filipino na “minahal” ay tuwirang naglalahad ng mga kilos bilang buo, samantalang ipinakikita ng konteksto ang nagpapatuloy na kabuluhan ng pag-ibig. Hindi idinaragdag sa pangunahing teksto ang “patuloy,” na hindi tahasang nasa anyo ng mga pandiwang Griyego.
- issue: Saklaw ng “aking pag-ibig”
  choice: panatilihin ang “sa aking pag-ibig” nang walang paliwanag sa pangunahing teksto
  alternative: sa pag-ibig ko sa inyo
  rationale: Maaaring tumukoy ang Griyegong possessive sa pag-ibig na kay Jesus o nagmumula sa kanya. Ang mas tiyak na alternatibo ay tahimik na lulutas sa kalabuwang hindi nilulutas ng teksto.
translation_notes:
  register: Modernong Filipino na likas, malinaw, at marangal. Ginamit ang “minahal” para sa karaniwang pagkaunawa at “pag-ibig” para sa mahalagang pangngalan sa huling utos. Pinanatili ang maikli at mariing estruktura ng talata.
