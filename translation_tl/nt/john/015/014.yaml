  text: ὑμεῖς φίλοι μού ἐστε ἐὰν ποιῆτε ⸀ἃ ἐγὼ ἐντέλλομαι ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/014.yaml
  text: You are my friends if you do what I command you[a].
translation:
  language: tl
  text: Kayo ay mga kaibigan ko kung ginagawa ninyo ang iniuutos ko sa inyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas pormal, “Kayo ay mga kaibigan ko kung ginagawa ninyo ang mga bagay na iniuutos ko sa inyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: Kayo
  rationale: Panghalip na maramihan at nasa unahan para sa diin. Likas sa Filipino ang “Kayo” at naipapakita rin ng ayos ng pangungusap ang diin.
- source_word: φίλοι μού
  choice: mga kaibigan ko
  rationale: Tumutukoy sa malapit na ugnayan kay Jesus. Ang “mga kaibigan ko” ang natural at tuwirang katumbas sa modernong Filipino.
- source_word: ἐστε
  choice: ay
  rationale: Ginagamit ang panandang panaguri na “ay” upang malinaw at marangal na maipahayag ang ugnayang katumbas ng pandiwang “maging” sa Griyego.
- source_word: ἐὰν
  choice: kung
  rationale: Nagpapakilala ito ng tunay na kondisyon, hindi lamang ng panahong nagaganap ang kilos.
- source_word: ποιῆτε
  choice: ginagawa ninyo
  rationale: Ipinapahayag ang pagsasagawa ng iniutos. Ang anyong pangkasalukuyan ay natural sa Filipino at hindi dinaragdagan ng tahasang “patuloy” na maaaring magpalabis sa aspektong duratibo.
- source_word: ἃ
  choice: ang
  rationale: Sa pariralang “ang iniuutos ko,” likas na naipapaloob sa Filipino ang diwa ng “kung ano” o “ang mga bagay na,” nang hindi nagiging mabigat ang pangungusap.
- source_word: ἐγὼ
  choice: ko
  rationale: Ang tahasang Griyegong panghalip ay nakapaloob sa hulaping paari/tagaganap na “ko.” Hindi natural na idagdag ang “ako mismo” rito.
- source_word: ἐντέλλομαι
  choice: iniuutos
  rationale: Pinananatili ng “iniuutos” ang awtoritatibong diwa ng pagbibigay ng utos at hindi ito pinalalambot bilang payo o simpleng tagubilin.
- source_word: ὑμῖν
  choice: sa inyo
  rationale: Tuwirang ipinapahayag ang datibong tumutukoy sa mga pinagbibigyan ng utos.
theological_decisions:
- issue: Ang ugnayan ng pakikipagkaibigan kay Jesus at pagsunod sa kanyang utos
  choice: 'Isinalin bilang tuwirang kondisyon: “Kayo ay mga kaibigan ko kung ginagawa ninyo ang iniuutos ko sa inyo.”'
  alternative: “Kayo ay mga kaibigan ko kapag ginagawa ninyo ang iniuutos ko sa inyo.”
  rationale: Ang ἐὰν na may pasakaling anyo ng pandiwa ay higit na likas na nagpapahayag ng kondisyon kaysa simpleng panahon. Pinananatili ng salin ang tensiyon sa teksto nang hindi ipinapaliwanag ito ayon sa anumang sistema tungkol sa merito o pananatili sa pananampalataya.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Pinanatili ang tahasang kondisyong “kung” at ang awtoritatibong “iniuutos,” habang iniwasan ang labis na literal na pariralang “ang mga bagay na” sa pangunahing teksto.
