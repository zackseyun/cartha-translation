review_pass:
  verdict: approve
  source_fidelity: 'Tapat ang salin sa Griyego: ang maramihang at bahagyang diin ng ὑμεῖς ay naipapahayag ng “Kayo”; ang φίλοι μού ay “mga kaibigan ko”; at ang ἐὰν na may pasakaling pandiwa ay wastong isinalin bilang kondisyong “kung.” Ang “ginagawa ninyo ang iniuutos ko sa inyo” ay sapat na sumasaklaw sa ποιῆτε ἃ ἐντέλλομαι ὑμῖν nang walang idinagdag na doktrinal na pahiwatig.'
  naturalness: Natural at malinaw ang modernong Filipino, bagaman may marangal na rehistro na angkop sa teksto. Ang “Kayo ay mga kaibigan ko” ay katanggap-tanggap na ayos at pinananatili ang diin sa “Kayo.”
  terminology: Wasto at pare-pareho ang “mga kaibigan,” “kung,” at “iniuutos.” Pinananatili ng “iniuutos” ang awtoridad ng ἐντέλλομαι, samantalang ang “kung” ay hindi pinapalitan ng temporal na “kapag.” Ang talababa ay wastong nagbibigay ng mas pormal na alternatibo para sa ἃ.
