translation:
  language: tl
  text: Iniuutos ko[b] sa inyo ang mga bagay na ito upang[a] ibigin ninyo ang isa’t isa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Ito ang iniuutos ko sa inyo: ibigin ninyo ang isa’t isa.” Ang sugnay na Griyego na pinangungunahan ng ἵνα ay maaaring magpahayag ng layunin o halos nagsasaad ng nilalaman ng utos.'
    reason: alternative_reading
  - marker: b
    text: 'Maaari ring: “Nag-uutos ako.”'
    reason: aspectual_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: ang mga bagay na ito
  rationale: Pinananatili ang maramihang anyo ng neuter plural demonstrative at ang malamang na pagtukoy nito sa mga naunang tagubilin.
- source_word: ἐντέλλομαι
  choice: Iniuutos ko
  rationale: Tuwiran at likas na salin ng pandiwang nasa kasalukuyang aspekto; ipinahihiwatig nito ang pag-uutos ni Jesus sa mismong daloy ng pahayag.
- source_word: ὑμῖν
  choice: sa inyo
  rationale: Malinaw na ipinapakita ang dative na maramihan at likas ito kasunod ng pandiwang “iniuutos.”
- source_word: ἵνα
  choice: upang
  rationale: Pinananatili ang karaniwang diwang layunin ng sugnay, nang hindi ikinakaila na maaari rin itong lumapit sa pagpapahayag ng nilalaman ng utos.
- source_word: ἀγαπᾶτε
  choice: ibigin ninyo
  rationale: Ang pandiwang anyong ito ay angkop sa sugnay na pinangungunahan ng “upang.” Hindi idinagdag ang diwang “patuloy” sapagkat hindi iyon kailangang tahasang ipakahulugan mula sa present stem.
- source_word: ἀλλήλους
  choice: ang isa’t isa
  rationale: Karaniwan at malinaw na pagpapahayag ng gantihang kilos sa loob ng pangkat.
theological_decisions:
- issue: Ugnayan ng utos at ng sugnay na ἵνα
  choice: Isinalin ang ἵνα bilang “upang,” kaya ang pag-ibig sa isa’t isa ay inilalahad bilang layunin ng mga utos.
  alternative: '“Ito ang iniuutos ko sa inyo: ibigin ninyo ang isa’t isa.”'
  rationale: Karaniwang nagpapahayag ng layunin o kinalabasan ang ἵνα, ngunit sa estilo ni Juan maaari rin itong halos maglahad ng nilalaman. Pinananatili sa pangunahing teksto ang pormal na ugnayang may layunin at inilalagay sa talababa ang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maramihang “mga bagay na ito” at ang sintaktikong tensiyon ng ἵνα, habang iniwasan ang di-likas na ayos ng salita.
