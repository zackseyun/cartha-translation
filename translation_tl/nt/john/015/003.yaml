base_translation:
  language: en
  yaml_path: translation/nt/john/015/003.yaml
  text: Already you are clean because of the word that I have spoken to you[a].
translation:
  language: tl
  text: Malinis na kayo dahil sa salitang sinabi ko sa inyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pamamagitan ng salitang sinabi ko sa inyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη
  choice: na
  rationale: Ang enclitic na “na” sa “Malinis na kayo” ay natural na nagpapahayag na umiiral na ang kalagayang ito ngayon, katumbas ng diin ng ἤδη.
- source_word: ὑμεῖς
  choice: kayo
  rationale: Tahasang pinananatili ang pangmaramihang panghalip; ang ayos na “Malinis na kayo” ay sapat na natural habang naihahatid ang diin sa mga alagad.
- source_word: καθαροί
  choice: malinis
  rationale: Pinananatili ng “malinis” ang konkretong talinghaga at ang ugnayan sa paglilinis/pagpuputol sa konteksto ng puno ng ubas, nang hindi ito nililimitahan sa abstraktong moral na kadalisayan.
- source_word: διὰ τὸν λόγον
  choice: dahil sa salita
  rationale: Ang διά na may accusative ay natural na sanhi o batayan dito. Ang “dahil sa” ay malinaw na causal sa modernong Tagalog; inilalagay sa talababa ang posibleng instrumental na pagbasa.
- source_word: λόγον
  choice: salita
  rationale: Direktang katumbas ito at pinananatili ang bokabularyong Johannine; ang “mensahe” o “turo” ay mas mapagpaliwanag.
- source_word: ὃν λελάληκα ὑμῖν
  choice: na sinabi ko sa inyo
  rationale: Natural sa Tagalog ang “sinabi ko sa inyo.” Bagaman perfect ang λελάληκα, naihahatid ng naunang “na” at ng kasalukuyang kalagayang “malinis” ang nananatiling bunga ng nakaraang pagsasalita nang hindi lumilikha ng alanganing anyo.
theological_decisions:
- issue: Kalikasan ng pagiging malinis ng mga alagad
  choice: Panatilihin ang pahayag bilang kasalukuyang kalagayan ng pagiging malinis na nakabatay sa salita ni Jesus.
  alternative: Tukuyin ito bilang sakramental na paglilinis o teknikal na deklarasyon ng pag-aaring matuwid.
  rationale: Hindi tinutukoy ng talata ang isang mas makitid na sistematikong kategorya. Ang salin ay nagpapanatili sa talinghaga at sa teolohikal na pagiging bukas ng pahayag.
- issue: Puwersang semantiko ng διά
  choice: dahil sa
  alternative: sa pamamagitan ng
  rationale: Mas karaniwan dito ang causal na pagbasa sa διά na may accusative, ngunit tunay na posible ang instrumental na pagkaunawa kaya inilalahad ito sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang karaniwang “sinabi” sa halip na mas literal ngunit di-likas na “sinalita,” at pinanatili ang “salita” upang hindi labis na bigyang-kahulugan bilang mensahe o turo.
