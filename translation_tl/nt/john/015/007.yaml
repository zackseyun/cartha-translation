  text: ἐὰν μείνητε ἐν ἐμοὶ καὶ τὰ ῥήματά μου ἐν ὑμῖν μείνῃ, ὃ ἐὰν θέλητε ⸀αἰτήσασθε καὶ γενήσεται ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/007.yaml
  text: If you remain in me and my words remain in you[a], ask whatever you want[b], and it will be done for you.
translation:
  language: tl
  text: Kung mananatili kayo sa akin at mananatili sa inyo ang mga salita ko[a], hingin ninyo ang anumang nais ninyo[b], at magkakatotoo iyon para sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mamamalagi kayo sa akin … mamamalagi sa inyo ang mga salita ko.”
    reason: lexical_alternative
  - marker: b
    text: O “anumang ibigin ninyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μείνητε / μείνῃ (μένω)
  choice: mananatili / mananatili
  rationale: Ipinapanatili ng “mananatili” ang diwa ng patuloy na pananatili at ugnayan, pati ang pag-uulit ng iisang pandiwa sa Griyego. Mas likas ito sa modernong Filipino kaysa “mananahan” sa kontekstong ito.
- source_word: ἐν ἐμοὶ
  choice: sa akin
  rationale: Ang “sa akin” ang likas na katumbas sa Filipino ng relasyonal na pananalitang “in me,” nang hindi ito pinapahina tungo sa simpleng “kasama ko.”
- source_word: τὰ ῥήματά μου
  choice: ang mga salita ko
  rationale: Tuwirang ipinapahayag nito ang mga salita o pahayag ni Jesus at iniiwasan ang mas malayang pagpapakahulugang “ang mga itinuro ko.”
- source_word: ὃ ἐὰν θέλητε
  choice: ang anumang nais ninyo
  rationale: Likas at dignified na Filipino ito para sa bukás at di-tiyak na layon ng pagnanais; hindi nito dinaragdagan ang talata ng mga kondisyong hindi tahasang binanggit.
- source_word: αἰτήσασθε
  choice: hingin ninyo
  rationale: Ang anyong pautos ay malinaw na naipapahayag ng “hingin ninyo,” na angkop sa konteksto ng paghiling o panalangin.
- source_word: γενήσεται ὑμῖν
  choice: mangyayari iyon para sa inyo
  rationale: Malapit nitong pinananatili ang diwa ng γίνομαι bilang ‘mangyari’ o ‘magkaroon ng katuparan’ nang hindi tahasang nagdaragdag ng isang tagaganap na hindi pinangalanan sa sugnay.
theological_decisions:
- issue: Ang kondisyon at pangako sa pahayag ni Jesus tungkol sa paghiling
  choice: 'Pinanatiling nakapailalim ang pangako sa malinaw na kondisyon: ang pananatili ng mga alagad kay Jesus at ang pananatili ng kanyang mga salita sa kanila.'
  alternative: Isang malayang salin na magpapalabas na walang kondisyon ang pangako tungkol sa anumang hihingin.
  rationale: Ang sugnay na may ἐὰν ay tahasang nagtatakda ng kondisyon. Hindi dapat ihiwalay o palawakin ng salin ang pangako lampas sa kondisyong nasa teksto.
- issue: Ang ipinahihiwatig na tagaganap sa γενήσεται ὑμῖν
  choice: “mangyayari iyon para sa inyo,” na hindi tahasang pinapangalanan ang Diyos bilang tagaganap
  alternative: “ipagkakaloob iyon sa inyo” o “gagawin iyon ng Diyos para sa inyo”
  rationale: Maaaring unawain sa konteksto na ang Diyos ang tumutugon, ngunit hindi siya tahasang pinangalanan sa sugnay. Pinananatili ng salin ang anyo at bahagyang pagiging di-tiyak ng Griyego.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Pinanatili ang pag-uulit ng “mananatili,” ang relasyonal na “sa akin,” at ang kondisyon-pangako na ayos ng orihinal. Ang “mangyayari iyon para sa inyo” ay bahagyang mas pormal ngunit sadyang malapit sa diwa at hindi tahasang tagaganap na anyo ng Griyego.
