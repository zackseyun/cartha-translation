  text: ἐν τούτῳ ἐδοξάσθη ὁ πατήρ μου ἵνα καρπὸν πολὺν φέρητε καὶ ⸀γένησθε ἐμοὶ μαθηταί.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/008.yaml
  text: 'In this my Father is glorified: that you bear much fruit and become my disciples.'
translation:
  language: tl
  text: 'Sa ganitong paraan naluluwalhati ang aking Ama: na mamunga kayo nang sagana at maging mga alagad ko.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Sa ganitong paraan
  rationale: Likas sa modernong Tagalog at pinananatili ang pagtukoy sa paraang inilalarawan ng kasunod na sugnay.
- source_word: ἐδοξάσθη
  choice: naluluwalhati
  rationale: Ipinahahayag ang pagkaluwalhati sa Ama nang hindi ipinipilit kung ang aorist ay tumutukoy sa natapos na pangyayari o sa pagkilalang bunga ng pamumunga.
- source_word: καρπὸν πολὺν φέρητε
  choice: mamunga kayo nang sagana
  rationale: Natural na idyomang Tagalog para sa pagdadala ng maraming bunga at angkop sa talinghaga ng puno ng ubas.
- source_word: γένησθε ἐμοὶ μαθηταί
  choice: maging mga alagad ko
  rationale: Tapat sa tekstong SBLGNT, na gumagamit ng γένησθε, at malinaw na ipinapahayag ang kaugnayan kay Jesus.
theological_decisions:
- issue: Ugnayan ng ἵνα sa pagkaluwalhati sa Ama
  choice: Ginamit ang tutuldok at “na” upang ipakitang ang masaganang pamumunga at pagiging mga alagad ang nilalaman o paraan ng pagkaluwalhati sa Ama.
  alternative: “upang mamunga kayo...” bilang tahasang layunin o resulta
  rationale: Maaaring layunin, resulta, o pagpapaliwanag ang ἵνα rito. Ang “na” pagkatapos ng tutuldok ay nagpapanatili ng kaugnayan nang hindi labis na nilulutas ang sintaktikong tensiyon.
- issue: Pagiging mga alagad bilang proseso o patunay
  choice: “maging mga alagad ko”
  alternative: “mapatunayang mga alagad ko kayo”
  rationale: Hindi idinaragdag ng γένησθε ang ideya ng pagpapatunay; pinananatili ng salin ang payak ngunit may teolohikal na tensiyong pahayag ng Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinili ang “naluluwalhati” bilang pamilyar na wikang biblikal, at “mamunga nang sagana” bilang natural na paglalahad ng larawan ng puno ng ubas.
