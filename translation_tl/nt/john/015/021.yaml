id: JHN.15.21
reference: John 15:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀλλὰ ταῦτα πάντα ποιήσουσιν ⸂εἰς ὑμᾶς⸃ διὰ τὸ ὄνομά μου, ὅτι οὐκ οἴδασιν τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/021.yaml
  text: But they will do all these things to you because of my name[a], because they do not know the one who sent me.
translation:
  language: tl
  text: Ngunit gagawin nila sa inyo[a] ang lahat ng ito dahil sa pangalan ko, sapagkat hindi nila kilala ang nagsugo sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “laban sa inyo.” Maaaring tumukoy ang pariralang Griyego sa mga kilos na nakatuon sa mga alagad sa isang mapanlabang paraan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ngunit
  rationale: Malinaw na naghuhudyat ng matinding pagsalungat sa naunang pahayag at angkop sa marangal ngunit makabagong Tagalog.
- source_word: ταῦτα πάντα
  choice: ang lahat ng ito
  rationale: Pinananatili kapuwa ang demonstratibong diwa ng ταῦτα at ang kabuuang saklaw ng πάντα.
- source_word: ποιήσουσιν
  choice: gagawin nila
  rationale: Tuwirang inililipat ang future active indicative nang hindi nililimitahan ang malawak na kahulugan ng pandiwa.
- source_word: εἰς ὑμᾶς
  choice: sa inyo
  rationale: Ipinahahayag ang mga kilos na nakatuon sa mga alagad habang pinananatili ang lawak ng pariralang Griyego; ipinapaliwanag sa talababa ang posibleng tahasang masamang diwa.
- source_word: διὰ τὸ ὄνομά μου
  choice: dahil sa pangalan ko
  rationale: Malinaw na ipinapahayag ang sanhi at pinananatili ang biblikal na bigat ng ‘pangalan’ bilang kumakatawan sa persona, pagkakakilanlan, at awtoridad ni Jesus.
- source_word: οὐκ οἴδασιν
  choice: hindi nila kilala
  rationale: Ang ‘kilala’ ay likas sa Tagalog at kayang magpahiwatig ng personal o relasyonal na pagkakilala, hindi lamang kaalamang pang-isip.
- source_word: τὸν πέμψαντά με
  choice: ang nagsugo sa akin
  rationale: Natural na isinasalin ang articular participle bilang isang pantukoy na parirala nang hindi idinaragdag ang titulong ‘Ama,’ na wala rito sa Griyego.
theological_decisions:
- issue: Tinutukoy ng ‘ang nagsugo sa akin’
  choice: Pinanatili ang di-tahasang pagtukoy bilang ‘ang nagsugo sa akin.’
  alternative: ‘ang Ama na nagsugo sa akin’
  rationale: Malinaw sa mas malawak na konteksto ni Juan na ang Ama ang tinutukoy, ngunit hindi ginagamit sa talata ang pangngalang ‘Ama.’ Iniiwasan ng salin ang pagdaragdag at pinananatili ang paraan ng pagkakahayag ng orihinal.
- issue: Saklaw ng ‘pangalan ko’
  choice: Pinanatili ang literal at teolohikal na makabuluhang ‘pangalan ko.’
  alternative: ‘dahil sa akin’ o ‘dahil sa reputasyon ko’
  rationale: Ang ὄνομα ay higit sa reputasyon lamang at kumakatawan sa persona, pagkakakilanlan, at awtoridad ni Jesus; hindi ito dapat paliitin o ganap na ipaliwanag sa mismong teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang ‘Ngunit’ at ‘sapagkat’ upang mapanatili ang lohikal na ugnayan ng mga sugnay nang hindi nagiging lipas o labis na pormal. Inilagay ang panandang [a] kaagad pagkatapos ng ‘sa inyo,’ ang pariralang mismong may leksikal na alternatibo.
