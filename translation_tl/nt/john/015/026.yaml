  text: ⸀Ὅταν ἔλθῃ ὁ παράκλητος ὃν ἐγὼ πέμψω ὑμῖν παρὰ τοῦ πατρός, τὸ πνεῦμα τῆς ἀληθείας ὃ παρὰ τοῦ πατρὸς ἐκπορεύεται, ἐκεῖνος μαρτυρήσει περὶ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/026.yaml
  text: When the Advocate comes[a], whom I will send to you from the Father—the Spirit of truth[c][b], who proceeds from the Father—he will testify about me.
translation:
  language: tl
  text: “Kapag dumating ang Tagapagtanggol[a] na isusugo ko sa inyo mula sa Ama—ang Espiritu ng katotohanan, na nagmumula sa Ama[c]—siya ang magpapatotoo tungkol sa akin.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Tagatulong,” “Tagapayo,” “Mang-aaliw,” o “Parakleto” para sa Griegong παράκλητος.
    reason: lexical_alternative
  - marker: b
    text: O “magbibigay ng patotoo tungkol sa akin.”
    reason: lexical_alternative
  - marker: c
    text: Sa Griyego, “nagmula/nagmumula sa Ama” (ἐκπορεύεται); naging mahalaga ang pananalitang ito sa mga sumunod na usaping teolohikal tungkol sa Trinidad.
    reason: cross_reference
lexical_decisions:
- source_word: Ὅταν ἔλθῃ
  choice: Kapag dumating
  rationale: Ang ὅταν na may subjunctive ay tumutukoy rito sa isang inaasahang pangyayari sa hinaharap; natural itong ipinahahayag sa Tagalog bilang “Kapag dumating.”
- source_word: ὁ παράκλητος
  choice: ang Tagapagtanggol[a]
  rationale: Ang παράκλητος ay tumutukoy sa isang tinawag upang tumulong, kumatawan, o magsanggalang. Pinananatili ng “Tagapagtanggol” ang personal at mapagrepresentang diwa at umaangkop sa konteksto ng pagpapatotoo.
- source_word: ὃν ἐγὼ πέμψω ὑμῖν
  choice: na isusugo ko sa inyo
  rationale: Tuwirang ipinahahayag ng future πέμψω ang gagawin ni Jesus; ang “isusugo” ay marangal at likas sa biblikal na konteksto, at malinaw na tinutumbasan ng “sa inyo” ang ὑμῖν.
- source_word: παρὰ τοῦ πατρός
  choice: mula sa Ama
  rationale: Ang παρά na may genitive ay nangangahulugang “mula sa” o “mula sa piling ng”; ang “mula sa Ama” ay maikli, natural, at tapat.
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: ang Espiritu ng katotohanan
  rationale: Pinananatili nito ang genitive construction at ang natatanging pananalita ni Juan nang hindi pinapakahulugang higit sa sinasabi ng teksto.
- source_word: ὃ παρὰ τοῦ πατρὸς ἐκπορεύεται
  choice: na nagmumula sa Ama
  rationale: Ang “nagmumula” ay natural na Tagalog para sa ἐκπορεύεται at pinananatili ang ideya ng pinagmulan. Hindi nito idinaragdag ang mga susunod na pormulasyong teolohikal sa mismong talata.
- source_word: ἐκεῖνος
  choice: siya ang
  rationale: Ang mariing demonstrative ay personal at may diin. Ang “siya ang” ay natural na nagpapakita ng diin sa Tagalog.
- source_word: μαρτυρήσει
  choice: magpapatotoo
  rationale: Tumpak at madaling maunawaan ang “magpapatotoo,” at pinananatili nito ang diwa ng pagbibigay-saksi o patotoo.
- source_word: περὶ ἐμοῦ
  choice: tungkol sa akin
  rationale: Likas at tuwirang katumbas ito ng περί na may genitive sa kontekstong ito.
theological_decisions:
- issue: Pagsasalin sa παράκλητος sa kontekstong tumutukoy sa Espiritu
  choice: Tagapagtanggol
  alternative: Tagatulong; Tagapayo; Mang-aaliw; Parakleto
  rationale: Maraming saklaw ang salita at walang iisang salitang Tagalog na ganap na sumasaklaw rito. Ang “Tagapagtanggol” ay nagpapanatili sa personal at mapagrepresentang papel na kaugnay ng agarang konteksto ng pagpapatotoo; inilalahad sa talababa ang ibang lehitimong salin.
- issue: Personal na pagtukoy sa Espiritu
  choice: siya ang magpapatotoo
  alternative: ito ang magpapatotoo
  rationale: Bagaman neuter sa gramatika ang πνεῦμα, personal ang paglalarawan sa Espiritu at ginagamit ang masculine demonstrative na ἐκεῖνος. Ang “siya” ay nagpapanatili sa personal na paglalahad ng teksto.
- issue: Pagsasalin sa ἐκπορεύεται
  choice: nagmumula sa Ama
  alternative: lumalabas mula sa Ama; nagmumula sa piling ng Ama
  rationale: Ang “nagmumula” ay malinaw at natural habang pinananatili ang pahayag na ang Ama ang pinagmulan. Hindi nito tahimik na nilulutas o pinalalawak ang pahayag ayon sa mga sumunod na pagtatalong teolohikal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “isusugo” at “magpapatotoo” bilang pamilyar at angkop na mga salitang biblikal. Pinanatili ang personal na pagtukoy sa Espiritu at ang pagkakaiba ng pagsusugo ng Anak at pagmumula sa Ama, nang hindi nagdaragdag ng paliwanag na denominasyonal.
