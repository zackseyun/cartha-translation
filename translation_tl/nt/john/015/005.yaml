base_translation:
  language: en
  yaml_path: translation/nt/john/015/005.yaml
  text: I am the vine[a]; you are the branches. The one who remains in me, and I in him, bears much fruit[b], because apart from me you are not able to do anything.
translation:
  language: tl
  text: Ako ang puno ng ubas; kayo ang mga sanga. Ang nananatili sa akin[a], at ako sa kanya[b], ang siyang namumunga nang sagana, sapagkat hiwalay sa akin, wala kayong magagawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “patuloy na nananatili sa akin.” Ang pandiwang Griyego ay nagbibigay-diin sa nagpapatuloy na relasyonal na pananatili, lalo na sa Ebanghelyo ni Juan.
    reason: lexical_alternative
  - marker: b
    text: Ang “sa kanya” sa Griyego ay panlalaking isahan ang anyo ngunit kumakatawan sa sinumang alagad na nananatili kay Jesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄμπελος
  choice: puno ng ubas
  rationale: Ito ang karaniwan at malinaw na tawag sa grapevine sa Filipino at angkop sa talinghaga; hindi ginamit ang “ubasan,” na tumutukoy sa vineyard.
- source_word: κλήματα
  choice: mga sanga
  rationale: Sa konteksto ng pagtatanim ng ubas, tumutukoy ito sa mga sanga o supang ng puno ng ubas. Mas natural at madaling maunawaan ang “mga sanga.”
- source_word: ὁ μένων
  choice: ang nananatili
  rationale: Ipinahihiwatig ng kasalukuyang participle ang patuloy na pananatili. Pinananatili ng “nananatili” ang aspektong ito at natural ito sa makabagong Filipino.
- source_word: ἐν ἐμοὶ ... ἐν αὐτῷ
  choice: sa akin ... sa kanya
  rationale: Sa Filipino, “sa akin/sa kanya” ang natural na anyo para sa relational na pananatili habang pinananatili ang diwa ng malapit at kapwa pananatili; ang mas literal na “nasa loob ko” ay magmumungkahi ng pisikal na lokasyon.
- source_word: κἀγώ
  choice: at ako
  rationale: 'Tuwirang pinananatili nito ang katumbasang estruktura: nananatili ang alagad kay Jesus, at si Jesus naman sa taong iyon.'
- source_word: φέρει καρπὸν πολύν
  choice: namumunga nang marami
  rationale: Pinananatili ng “namumunga” ang larawan ng puno ng ubas, at ipinapahayag ng “nang marami” ang dami ng bunga nang hindi nagiging mabigat ang parirala.
- source_word: χωρὶς ἐμοῦ
  choice: kung hiwalay kayo sa akin
  rationale: Malinaw nitong ipinapahayag ang pagkahiwalay kay Jesus, hindi lamang ang kawalan ng tulong niya. Ang “kayo” ay likas na ipinahihiwatig ng pandiwang pangmaramihan sa Griyego.
- source_word: οὐ δύνασθε ποιεῖν οὐδέν
  choice: wala kayong magagawa
  rationale: Ito ang natural na Filipino para sa tahasang kawalan ng kakayahang gumawa ng anuman.
theological_decisions:
- issue: Kapwa pananatili ni Jesus at ng alagad
  choice: “nananatili sa akin, at ako sa kanya”
  alternative: “nananatiling kasama ko, at kasama niya ako”
  rationale: Pinananatili ng salin ang matinding relasyonal at teolohikal na wika ng kapwa pananatili sa halip na pahinain ito bilang simpleng pagsasama lamang.
- issue: Masculine singular na αὐτῷ na may pangkalahatang saklaw
  choice: “sa kanya” na may paliwanag sa talababa
  alternative: “sa taong iyon” o pangmaramihang anyo
  rationale: Likas na hindi tinutukoy ng panghalip na Filipino na “kanya” ang kasarian. Iniiwasan nitong magdagdag ng kasariang hindi kailangang ipahayag sa target na wika, habang ipinapaliwanag sa talababa ang anyo at saklaw ng Griyego.
- issue: Saklaw ng “wala kayong magagawa”
  choice: Panatilihin ang ganap na pahayag nang walang idinagdag na kwalipikasyon
  alternative: “wala kayong magagawang mabuti” o “wala kayong magagawa para sa Diyos”
  rationale: Walang ganitong tahasang kwalipikasyon sa Griyego. Ang pagdaragdag nito ay magpapasya sa isang teolohikal na tanong na iniiwang matindi at malawak ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang talinghaga ng puno ng ubas at mga sanga, gayundin ang kapwa pananatili ni Jesus at ng alagad. Inilagay ang mga pananda ng talababa sa mismong mga pariralang ipinaliliwanag nila.
