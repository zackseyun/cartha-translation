  text: εἰ μὴ ἦλθον καὶ ἐλάλησα αὐτοῖς, ἁμαρτίαν οὐκ ⸀εἴχοσαν· νῦν δὲ πρόφασιν οὐκ ἔχουσιν περὶ τῆς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/022.yaml
  text: If I had not come and spoken to them[a], they would not have sin[c][b]; but now they have no excuse for their sin.
translation:
  language: tl
  text: Kung hindi ako naparito at nagsalita sa kanila, wala sana silang kasalanan.[a] Ngunit ngayon, wala silang maidadahilan para sa kanilang kasalanan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “hindi sana sila nagkasala” o “hindi sana sila mananagot sa kasalanan.” Mas literal sa Griyego ang “wala sana silang kasalanan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “wala silang maipapalusot tungkol sa kanilang kasalanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ μὴ ἦλθον καὶ ἐλάλησα αὐτοῖς
  choice: Kung hindi ako naparito at nagsalita sa kanila
  rationale: Ipinahahayag ng εἰ μή kasama ng mga pandiwang nasa nakaraan ang isang kondisyong salungat sa nangyari. Likas sa Tagalog ang hulma na “Kung hindi ... wala sana ...” upang maipakita ito.
- source_word: ἁμαρτίαν οὐκ εἴχοσαν
  choice: wala sana silang kasalanan
  rationale: Pinananatili ang literal na diwa ng “hindi sana sila magkakaroon/magkakaroon ng kasalanan” sa mas likas na Tagalog, nang hindi tahasang nililimitahan ito sa “pananagutan” o “pagkakasala” lamang.
- source_word: νῦν δὲ
  choice: Ngunit ngayon
  rationale: Malinaw na ipinakikita ang matinding pagsalungat sa hindi nangyaring kalagayan at sa kasalukuyang katotohanan.
- source_word: πρόφασιν οὐκ ἔχουσιν
  choice: wala silang maidadahilan
  rationale: Ang πρόφασις ay maaaring tumukoy sa dahilan, palusot, o pagkukunwari. Ang “maidadahilan” ay malinaw, natural, at hindi masyadong kolokyal.
- source_word: περὶ τῆς ἁμαρτίας αὐτῶν
  choice: para sa kanilang kasalanan
  rationale: Bagaman ang περί na may genitive ay literal na “tungkol sa,” mas likas sa Tagalog ang “maidadahilan para sa” at pinananatili nito ang kaugnayan ng dahilan sa kanilang kasalanan.
theological_decisions:
- issue: Kung ang ἁμαρτίαν οὐκ εἴχοσαν ay nangangahulugang ganap na kawalan ng kasalanan o kawalan ng pananagutan sa kasalanang kaugnay ng pagtanggi kay Jesus
  choice: wala sana silang kasalanan
  alternative: hindi sana sila mananagot sa kasalanan
  rationale: Ang konteksto ay tungkol sa pananagutan matapos pumarito at magsalita si Jesus, ngunit literal na sinasabi ng Griyego na “magkaroon ng kasalanan.” Pinananatili ng salin ang malawak at mariing pahayag ni Juan sa halip na lutasin sa pangunahing teksto ang teolohikal na tensiyon.
- issue: Saklaw ng πρόφασις sa pangungusap
  choice: maidadahilan
  alternative: maipapalusot
  rationale: Maaaring mangahulugan ang salita ng dahilan o pagkukunwari. Ang “maidadahilan” ay nagpapanatili sa diwa ng excuse nang hindi ipinapalagay na pawang mapanlinlang na palusot lamang ang tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “naparito” upang bumagay sa pananalita ni Jesus at ang “maidadahilan” sa halip na mas kolokyal na “maipapalusot.”
