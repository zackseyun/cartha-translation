  terminology: Ang «sanlibutan» ay angkop para sa κόσμος sa Juan at hindi dapat palawakin sa pangunahing teksto. Ang «pinili ko kayo mula sa sanlibutan» ay pinanatili nang walang pagdaragdag ng doktrinal na pagbasa.
