revisions:
- from: Kung mula kayo sa sanlibutan[a], mamahalin sana ng sanlibutan ang sa kanya. Ngunit dahil hindi kayo mula sa sanlibutan, kundi pinili ko kayo mula sa sanlibutan, kaya kinapopootan kayo ng sanlibutan.
  to: Kung kayo ay mula sa sanlibutan[a], mamahalin sana ng sanlibutan ang mga kabilang dito. Ngunit dahil hindi kayo mula sa sanlibutan, kundi pinili ko kayo mula sa sanlibutan, dahil dito ay napopoot sa inyo ang sanlibutan.
  rationale: Pinalitan ang hindi likas na «ang sa kanya» ng «ang mga kabilang dito», na malinaw na tumutukoy sa mga itinuturing ng sanlibutan na sarili nito ayon sa konteksto, nang hindi ipinapasok ang mas makitid na paliwanag gaya ng «sistemang makasanlibutan.» Pinalitan din ang «kaya» ng «dahil dito» upang higit na ilapit ang sanhiang parirala sa διὰ τοῦτο. Napanatili ang «mula sa sanlibutan» sa tatlong paglitaw upang makita ang paulit-ulit na ἐκ.
