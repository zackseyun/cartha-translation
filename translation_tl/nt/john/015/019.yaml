source:
  edition: SBLGNT
  text: εἰ ἐκ τοῦ κόσμου ἦτε, ὁ κόσμος ἂν τὸ ἴδιον ἐφίλει· ὅτι δὲ ἐκ τοῦ κόσμου οὐκ ἐστέ, ἀλλ’ ἐγὼ ἐξελεξάμην ὑμᾶς ἐκ τοῦ κόσμου, διὰ τοῦτο μισεῖ ὑμᾶς ὁ κόσμος.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/019.yaml
  text: If you were from the world[a], the world would love its own. But because you are not from the world, but I chose you out of the world, for this reason the world hates you.
translation:
  language: tl
  text: Kung kayo ay mula sa sanlibutan[a], mamahalin sana ng sanlibutan ang mga kabilang dito. Ngunit dahil hindi kayo mula sa sanlibutan, kundi pinili ko kayo mula sa sanlibutan, dahil dito ay napopoot sa inyo ang sanlibutan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kabilang sa sanlibutan.” Ang ἐκ τοῦ κόσμου ay maaaring magpahiwatig kapuwa ng pinagmulan at ng pagiging kabilang.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ κόσμου
  choice: mula sa sanlibutan
  rationale: Pinananatili ng “mula sa” ang pangunahing diwa ng ἐκ bilang pinagmulan o paglabas, habang hinahayaan ding manatili ang pahiwatig ng pagiging kabilang. Inulit ito upang makita ang pagkakaugnay ng tatlong gamit sa Griyego.
- source_word: κόσμος
  choice: sanlibutan
  rationale: Ang “sanlibutan” ay likas at marangal na katawagan sa kontekstong biblikal at napapanatili ang malawak na teolohikal na diwa ni Juan nang hindi ito pinakikitid sa “sistemang makasanlibutan.”
- source_word: ἂν ... ἐφίλει
  choice: mamahalin sana
  rationale: 'Ipinahahayag ng “sana” ang resultang salungat sa aktuwal na kalagayan: hindi sila mula sa sanlibutan, kaya hindi sila minamahal nito bilang sarili nito.'
- source_word: τὸ ἴδιον
  choice: ang sa kanya
  rationale: Maikli at likas itong paraan ng pagsasaad sa anumang nauukol o kabilang sa sanlibutan, nang hindi tahasang idinaragdag ang “mga tao,” na wala sa anyong Griyego.
- source_word: φιλέω
  choice: mamahalin
  rationale: Malinaw na naihahatid ng “mamahalin” ang pagkiling o pagmamahal at napapanatili ang matinding kaibahan nito sa μισέω.
- source_word: ἐξελεξάμην
  choice: pinili ko
  rationale: Direkta at karaniwang katumbas ito ng pandiwang Griyego; hindi nito dinaragdagan ang talata ng isang tiyak na sistemang doktrinal tungkol sa pagpili.
- source_word: διὰ τοῦτο
  choice: kaya
  rationale: 'Likas na ipinahahayag ng “kaya” ang tahasang bunga o dahilan sa Filipino: ang pagpili sa kanila mula sa sanlibutan ang dahilan ng pagkapoot nito.'
- source_word: μισεῖ
  choice: kinapopootan
  rationale: Pinananatili nito ang matindi at nagpapatuloy na pagsalungat na ipinahahayag ng kasalukuyang panahunan ng μισέω.
theological_decisions:
- issue: Kahulugan ng “sanlibutan” sa konteksto ni Juan
  choice: Panatilihin ang “sanlibutan” nang walang paliwanag na idinagdag sa pangunahing teksto.
  alternative: “sistemang makasanlibutan” o “sangkatauhang laban sa Diyos”
  rationale: Inilalarawan dito ng “sanlibutan” ang larangang hindi kumikilala kay Jesus, ngunit mas malawak ang salita kaysa sa alinmang isang paliwanag dito.
- issue: Pahiwatig ng pagpili sa ἐξελεξάμην
  choice: Isalin nang tuwiran bilang “pinili ko kayo mula sa sanlibutan.”
  alternative: Gumamit ng salitang may higit na bigat mula sa isang partikular na doktrina ng predestinasyon o paghirang.
  rationale: Malinaw na sinasabi ng talata na si Jesus ang pumili sa mga alagad, ngunit hindi nito nilulutas ang mga sumunod na pagtatalong teolohikal tungkol sa pagpili.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “sanlibutan” upang tumugma sa teolohikal na gamit ni Juan; ang “mamahalin sana” ay malinaw na nagpapakita ng kondisyong salungat sa katotohanan. Ang “ang sa kanya” ay sadyang maikli upang mapanatili ang hindi ganap na tinukoy na τὸ ἴδιον.
