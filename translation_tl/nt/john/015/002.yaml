  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πᾶν κλῆμα ἐν ἐμοὶ μὴ φέρον καρπὸν αἴρει αὐτό, καὶ πᾶν τὸ καρπὸν φέρον καθαίρει αὐτὸ ἵνα ⸂καρπὸν πλείονα⸃ φέρῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/002.yaml
  text: Every branch in me that does not bear fruit[a], he removes; and every branch that bears fruit[b], he prunes so that it may bear more fruit.
translation:
  language: tl
  text: Ang bawat sangang nasa akin na hindi namumunga ay inaalis niya[a], at ang bawat sangang namumunga ay pinupungusan niya[b] upang lalo pa itong mamunga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “kinukuha”; inuunawa naman ito ng ilan bilang “itinataas.”
    reason: alternative_reading
  - marker: b
    text: Ang pandiwang isinaling “pinupungusan” ay maaari ring mangahulugang “nililinis.” Ang pagpupungos ay angkop sa larawan ng ubasan, at ang diwa ng paglilinis ay naghahanda sa salitang “malinis” sa susunod na talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν κλῆμα
  choice: ang bawat sanga
  rationale: Ang πᾶν na kasama ng pangngalang isahan ay pamahagi ang diwa; likas sa Tagalog ang “bawat sanga” at pinananatili nito ang pagtukoy sa isa't isang sanga.
- source_word: ἐν ἐμοὶ
  choice: nasa akin
  rationale: Pinananatili ng tuwirang salin ang sadyang malawak na diwang Juanino ng ugnayan kay Jesus, nang hindi ito nililimitahan sa “nakakabit” o “nananatili.”
- source_word: μὴ φέρον καρπὸν
  choice: hindi namumunga
  rationale: Likas at malinaw na Tagalog ito para sa patuloy na hindi pagbubunga sa talinghaga ng ubasan.
- source_word: αἴρει
  choice: inaalis
  rationale: Maaaring mangahulugan ang αἴρω ng pag-aalis o pagkuha, at sa ilang konteksto ay pag-angat. Sa paghahambing ng sangang hindi namumunga at sangang pinuputulan, “inaalis” ang pinakamalinaw na pangunahing salin; inilagay sa talababa ang ibang posibleng diwa.
- source_word: καρπός
  choice: bunga
  rationale: Ito ang karaniwan at natural na katumbas sa talinghaga tungkol sa puno ng ubas.
- source_word: καθαίρει
  choice: pinuputulan
  rationale: Sa kontekstong paghahalaman, tumutukoy ito sa pagputol o pagpungos upang higit na mamunga. Ang kaugnay nitong diwang “nililinis” at ang ugnayang salita sa susunod na talata ay pinanatili sa talababa.
- source_word: ἵνα καρπὸν πλείονα φέρῃ
  choice: upang lalo pa itong mamunga
  rationale: Malinaw na ipinahahayag ng “upang” ang layunin ng ἵνα, at natural na isinasalin ng “lalo pa itong mamunga” ang paghahambing na πλείονα.
- source_word: αὐτό / αὐτὸ
  choice: ito / ipinahihiwatig sa pandiwa
  rationale: Tumutukoy ang mga panghalip sa κλῆμα, “sanga.” Hindi na kailangan ng hiwalay na panghalip pagkatapos ng “pinuputulan niya,” ngunit ang “ito” sa hulíng sugnay ay kailangan para sa kalinawan.
- source_word: καὶ πᾶν τὸ καρπὸν φέρον
  choice: at ang bawat sangang namumunga
  rationale: Ipinahihiwatig sa Griyego ang κλῆμα mula sa unang sugnay; hayagang inuulit ang “sanga” sa Tagalog upang maging malinaw at mapanatili ang magkatimbang na ayos.
theological_decisions:
- issue: Kahulugan ng αἴρει sa unang sugnay
  choice: inaalis niya
  alternative: kinukuha niya / itinataas niya
  rationale: Pinakamalinaw na ipinakikita ng “inaalis” ang pagkakaiba ng pagtrato ng tagapag-alaga sa hindi namumunga at sa namumungang sanga, nang hindi ipinapasiya ang mga usaping doktrinal tungkol sa pagtalikod o pananatili. Sapagkat posible sa salita ang “itinataas,” binanggit ito sa talababa.
- issue: Kahulugan ng καθαίρει
  choice: pinuputulan niya
  alternative: nililinis niya
  rationale: Ang pagputol o pagpungos ang angkop na gawaing pang-ubasan sa talinghaga, ngunit may tunay ding diwang “paglilinis” ang pandiwa at may larong salita ito sa “malinis” sa kasunod na talata; kaya pinanatili ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “pinuputulan” sa halip na mas teknikal na “pinupungusan” upang madaling maunawaan, habang pinananatili sa talababa ang mahalagang dobleng diwa ng καθαίρει. Lahat ng marker na [a] at [b] ay nasa pangunahing teksto.
