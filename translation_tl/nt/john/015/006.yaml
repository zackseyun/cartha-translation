  naturalness: Medyo hindi likas ang “itinatapon siya sa labas na gaya ng sanga.” Mas malinaw at mas natural ang “itatapon siya palabas, tulad ng sanga, at matutuyo.” Mas tuwiran din ang aktibong di-tiyak na “tinitipon nila” at “itinatapon nila,” na tumutugma sa Griyegong ikatlong panauhang maramihan.
