revisions:
- from: Kung ang sinuman ay hindi nananatili sa akin[a], itinatapon siya sa labas na gaya ng sanga at natutuyo. Tinitipon ang gayong mga sanga, itinatapon sa apoy[b], at nasusunog ang mga iyon.
  to: Kung ang sinuman ay hindi nananatili sa akin[a], itatapon siya palabas, tulad ng sanga, at matutuyo. Tinitipon nila ang mga iyon at itinatapon sa apoy[b], at nasusunog ang mga iyon.
  rationale: 'Inayos ang ayos ng unang pangungusap upang maging likas sa Filipino at maipakita ang resulta at pagkakasunod ng larawan sa Griyego: itinatapon palabas ang hindi nananatili at pagkatapos ay natutuyo. Ibinalik ang di-tiyak na aktibong maramihan sa “tinitipon nila” at “itinatapon,” alinsunod sa συνάγουσιν at βάλλουσιν, nang hindi nagpapangalan ng mga gumagawa. Pinanatili ang “nasusunog ang mga iyon”: natural itong tumutukoy sa maramihang mga sanga, samantalang hindi pinipilit ng Filipino na tularan ang pang-isahang συμφωνία ng καίεται matapos ang neuter plural na αὐτά. Nilinaw rin ang talababa a nang walang pagbabagong doktrinal.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T01:19:29Z'
