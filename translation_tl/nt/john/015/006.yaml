source:
  edition: SBLGNT
  text: ἐὰν μή τις ⸀μένῃ ἐν ἐμοί, ἐβλήθη ἔξω ὡς τὸ κλῆμα καὶ ἐξηράνθη, καὶ συνάγουσιν αὐτὰ καὶ εἰς τὸ πῦρ βάλλουσιν καὶ καίεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/006.yaml
  text: If anyone does not remain in me[a], he is thrown out like the branch and dries up; and they gather them and throw them into the fire[b], and they are burned.
translation:
  language: tl
  text: Kung ang sinuman ay hindi nananatili sa akin[a], itatapon siya palabas, tulad ng sanga, at matutuyo. Tinitipon nila ang mga iyon at itinatapon sa apoy[b], at nasusunog ang mga iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “namamalagi sa akin.” Ang pandiwang Griyego ay tumutukoy sa patuloy na pananatili o pagpapatuloy ng ugnayan; isa itong mahalagang katawagan sa mga sulatin ni Juan.
    reason: lexical_alternative
  - marker: b
    text: Nagbababala ang larawan tungkol sa pagtatakwil at pagsunog, ngunit hindi mismo tinutukoy ng talata kung inilalarawan nito ang pagkawala ng tunay na pagiging alagad o ang paglalantad sa isang ugnayang hindi tunay.
    reason: alternative_reading
lexical_decisions:
- source_word: μένῃ
  choice: nananatili
  rationale: Ipinahahayag ng μένω ang patuloy na pananatili at ugnayan, isang mahalagang diwa sa Juan. Likas at malinaw sa modernong Filipino ang “nananatili.”
- source_word: ἐν ἐμοί
  choice: sa akin
  rationale: Ito ang likas na katumbas sa Filipino ng relational na “in me” at hindi nito ginagawang paliwanag lamang ang matalinghagang ugnayan kay Jesus.
- source_word: ἐβλήθη ἔξω
  choice: itinatapon siya sa labas
  rationale: Pinananatili ang diwang pasibo at ang kongkretong larawan ng pagtatapon palabas; ang pangkasalukuyang anyo ay likas sa pangkalahatang kundisyon sa Filipino.
- source_word: ὡς τὸ κλῆμα
  choice: na gaya ng sanga
  rationale: Ang κλῆμα ay sanga o usbong ng puno ng ubas sa konteksto. Sapat ang “sanga” dahil malinaw na ang talinghaga ng puno ng ubas mula sa naunang diskurso.
- source_word: ἐξηράνθη
  choice: natutuyo
  rationale: Tuwirang ipinahahayag ang pagiging tuyo ng sanga at natural itong kaakibat ng pangkalahatang paglalarawan.
- source_word: συνάγουσιν
  choice: tinitipon
  rationale: Ang Griyego ay may di-tiyak na ikatlong panauhang maramihan. Ang di-tahasang pasibo sa Filipino ay natural at hindi nagpapangalan ng mga gumagawa.
- source_word: αὐτὰ
  choice: ang gayong mga sanga
  rationale: Nililinaw ng parirala ang maramihang panghalip na tumutukoy sa mga sangang katulad ng naunang isahang halimbawa.
- source_word: εἰς τὸ πῦρ βάλλουσιν
  choice: itinatapon sa apoy
  rationale: Natural at tuwirang salin ito na nagpapanatili sa marahas at kongkretong larawan.
- source_word: καίεται
  choice: nasusunog ang mga iyon
  rationale: Ang “nasusunog” ay natural na katumbas ng pangkasalukuyang pasibo/intransitibong diwa. Ang maramihang “mga iyon” ay sumusunod sa aktuwal na tinipong mga sanga, bagaman isahan ang anyo ng pandiwa sa Griyego.
- source_word: τις
  choice: ang sinuman
  rationale: Likas na pangkalahatang katumbas ito ng di-tiyak na isahang τις.
theological_decisions:
- issue: Kung lulutasin sa salin ang usapin ng pagtalikod, pananatili, o wari lamang na pagiging alagad
  choice: Tuwirang babala sa pamamagitan ng talinghaga, nang walang dagdag na pagpapakahulugang doktrinal
  alternative: Tukuyin ito bilang pagkawala ng tunay na pagiging alagad, o bilang paglalantad sa isang taong hindi kailanman tunay na nakaugnay kay Jesus
  rationale: Malakas ang larawan ng pagtatakwil at pagsunog, ngunit hindi tahasang nilulutas ng talata ang mga sumunod na debateng doktrinal tungkol sa dating kalagayan ng taong inilalarawan.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “nananatili” sa halip na mas pormal na “namamalagi,” at pinanatili ang matalinghagang “sa akin” nang hindi ito pinapaliwanag bilang “nakaugnay sa akin” sa pangunahing teksto.
