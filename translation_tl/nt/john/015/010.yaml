id: JHN.15.10
reference: John 15:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐὰν τὰς ἐντολάς μου τηρήσητε, μενεῖτε ἐν τῇ ἀγάπῃ μου, καθὼς ἐγὼ ⸂τὰς ἐντολὰς τοῦ πατρός μου⸃ τετήρηκα καὶ μένω αὐτοῦ ἐν τῇ ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/010.yaml
  text: If you keep my commandments, you will remain in my love, just as I have kept my Father's commandments and remain in his love.
translation:
  language: tl
  text: Kung tutuparin ninyo ang aking mga utos, mananatili kayo sa aking pag-ibig, kung paanong tinupad ko ang mga utos ng aking Ama at nananatili ako sa kanyang pag-ibig.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν
  choice: Kung
  rationale: Likas na panandang kondisyon sa Filipino at pinananatili ang tunay na kondisyon ng sugnay nang hindi dinaragdagan ng kahulugang paulit-ulit.
- source_word: τὰς ἐντολάς μου
  choice: ang aking mga utos
  rationale: Ang “mga utos” ay malinaw at makabagong katumbas ng ἐντολαί, at pinananatili ang diwa ng may-awtoridad na mga tagubilin.
- source_word: τηρήσητε
  choice: tutuparin ninyo
  rationale: Sa kaugnayan ng mga utos, natural na ipinahahayag ng “tuparin” ang πισong pagsunod o pag-iingat sa mga ito; ang anyong panghinaharap ay angkop sa kondisyong Filipino.
- source_word: μενεῖτε
  choice: mananatili kayo
  rationale: Pinananatili ng “mananatili” ang mahalagang temang Johannine ng patuloy na pananatili sa isang ugnayan at mas malinaw ito sa karaniwang mambabasa kaysa sa mas matalinghagang mga alternatibo.
- source_word: ἐν τῇ ἀγάπῃ μου
  choice: sa aking pag-ibig
  rationale: Pinananatili ang larawan ng pag-ibig bilang kalagayan o saklaw na kinaroroonan, nang hindi ito ipinapaliwanag nang higit sa sinasabi ng Griyego.
- source_word: καθὼς
  choice: kung paanong
  rationale: Malinaw na ipinakikita ang paghahambing sa pagitan ng mga alagad at ng ginawa ni Jesus.
- source_word: τετήρηκα
  choice: tinupad ko
  rationale: Pinananatili ang leksikal na ugnayan sa naunang τηρήσητε sa pamamagitan ng iisang pandiwang-ugat. Bagaman hindi tahasang minamarkahan ng Filipino ang aspektong perpekto gaya ng Griyego, ipinakikita ng konteksto ang nagawa ni Jesus na may patuloy na kabuluhan.
- source_word: τὰς ἐντολὰς τοῦ πατρός μου
  choice: ang mga utos ng aking Ama
  rationale: Natural at malinaw na genitibong parirala sa Filipino; ang “Ama” ay ginagamit bilang tawag sa Diyos sa konteksto.
- source_word: μένω
  choice: nananatili ako
  rationale: Ang aspektong pangkasalukuyan ay nagpapahayag ng patuloy na pananatili at pinananatili ang pag-uulit ng μένω sa talata.
- source_word: αὐτοῦ ἐν τῇ ἀγάπῃ
  choice: sa kanyang pag-ibig
  rationale: Ang “kanyang” ay malinaw na tumutukoy sa Ama at pinananatili ang parallel sa “sa aking pag-ibig.”
theological_decisions:
- issue: Ugnayan ng pagsunod at pananatili sa pag-ibig ni Jesus
  choice: Isinalin bilang isang tuwirang kondisyong ugnayan.
  alternative: Ipaliwanag ang pagsunod bilang pagkakamit ng pag-ibig o bilang tanda lamang na walang tunay na kondisyong bisa.
  rationale: Naghahayag ang Griyego ng tunay na kondisyon at inihahambing ito sa pagsunod ni Jesus sa Ama, ngunit hindi nito nilulutas ang mas malawak na mga usapin tungkol sa merito, katiyakan, o pagkawala ng kaligtasan.
- issue: Kahulugan ng ἀγάπη
  choice: pag-ibig
  alternative: pagmamahal
  rationale: Ang “pag-ibig” ay dignidad, malawak, at karaniwang terminong biblikal na pinananatili ang leksikal na ugnayan sa dalawang paglitaw sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ninyo/kayo” para sa maramihang kausap at ang magkatugmang “tutuparin/tinupad” at “mananatili/nananatili” upang mapanatili ang mahahalagang parallel ng Griyego.
