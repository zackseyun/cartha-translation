  source_fidelity: 'Tapat ang salin sa Griyego: malinaw na naipapahayag ang kondisyon (ἐὰν), ang pag-iingat/pagtupad sa mga utos (τηρέω), ang resulta ng pananatili sa pag-ibig, at ang paghahambing sa patuloy na pananatili ni Jesus sa pag-ibig ng Ama. Napananatili rin ang pagkakaiba ng aspektong hinaharap sa unang bahagi at kasalukuyang patuloy sa huling bahagi.'
