  yaml_path: translation/nt/john/015/012.yaml
  text: 'This is my command: that you love one another just as I have loved you[a].'
translation:
  language: tl
  text: 'Ito ang utos ko: magmahalan kayo kung paanong minahal ko kayo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Ito ang kautusan ko: mahalin ninyo ang isa’t isa gaya ng minahal ko kayo.”'
    reason: Nagbibigay ng leksikal at sintaktikong alternatibo para sa ἐντολή at ἀγαπᾶτε ἀλλήλους, habang pinananatili ang pandiwang nakaraang pagkilos ng ἠγάπησα.
lexical_decisions:
- source_word: Αὕτη ἐστὶν
  choice: Ito ang
  rationale: Likas na paraang Filipino upang tukuyin at ipakilala ang mismong utos na sumusunod.
- source_word: ἐντολὴ ἡ ἐμὴ
  choice: utos ko
  rationale: Malinaw at makabagong katumbas na nagpapanatili sa awtoridad ng utos at sa diin na ito ay kay Jesus.
- source_word: ἵνα
  choice: ':'
  rationale: Ipinakikilala rito ng ἵνα ang nilalaman ng utos. Sa Filipino, malinaw at natural itong ipinahahayag sa pamamagitan ng tutuldok sa halip na piliting lagyan ng pangatnig.
- source_word: ἀγαπᾶτε ἀλλήλους
  choice: magmahalan kayo
  rationale: Ang pandiwang may hulaping -an ay natural na nagpapahayag ng gantihang pagkilos na nasa ἀλλήλους; ang kasalukuyang anyong Griyego ay tumutukoy sa ipinag-uutos na patuloy na asal nang hindi kailangang sobrang ipaliwanag.
- source_word: καθὼς
  choice: kung paanong
  rationale: 'Nagpapahayag ng paghahambing at huwaran: ang pag-ibig ni Jesus ang paraan at sukatan ng pagmamahalan ng mga alagad.'
- source_word: ἠγάπησα ὑμᾶς
  choice: minahal ko kayo
  rationale: Tuwirang inilalarawan ang nauna at tiyak na pag-ibig ni Jesus sa mga alagad. Hindi likas sa Filipino ang sapilitang pagtutumbas sa English present perfect, kaya ang aspektong perpektibo ang pinakamalinaw.
theological_decisions:
- issue: Pagkakasalin sa ἀγαπάω
  choice: magmahalan / minahal
  alternative: mag-ibigan / inibig
  rationale: Ang salitang “mahal” ang pinakakaraniwan at malinaw na modernong katumbas, habang pinananatili ang leksikal na ugnayan ng dalawang anyo ng iisang pandiwang Griyego.
- issue: Lakas ng utos ni Jesus
  choice: Ito ang utos ko
  alternative: Ito ang aking kautusan
  rationale: Pinananatili ng “utos” ang awtoritatibong lakas ng ἐντολή nang hindi nagdaragdag ng denominasyonal o legal na pakahulugan.
- issue: Paghahambing ng pagmamahalan ng mga alagad sa pag-ibig ni Jesus
  choice: kung paanong minahal ko kayo
  alternative: gaya ng pagmamahal ko sa inyo
  rationale: Pinananatili ang pandiwang paghahambing ng orihinal at ang tensiyong ang sariling pag-ibig ni Jesus ang huwaran ng utos.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “magmahalan kayo” bilang likas na pagpapahayag ng reciprocal na ἀλλήλους, at iniwasan ang mas pormal o mas lumang “kautusan” sa pangunahing teksto.
