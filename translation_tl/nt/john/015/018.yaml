base_translation:
  language: en
  yaml_path: translation/nt/john/015/018.yaml
  text: If the world hates you[a], know that it has hated me before you.
translation:
  language: tl
  text: Kung napopoot sa inyo ang sanlibutan, alamin ninyo na nauna na nitong kapootan ako kaysa sa inyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “alamin ninyo na ako muna ang kinapootan nito bago kayo.” Ginagamit sa Griyego ang “una” kasama ng “inyo” upang ipahayag na nauna sa panahon ang pagkapoot sa akin.
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμος
  choice: sanlibutan
  rationale: Karaniwan at marangal na katumbas ito ng κόσμος sa kontekstong Juaniko. Napananatili nito ang malawak na pagtukoy sa daigdig ng mga tao na sumasalungat kay Jesus nang hindi dinaragdagan ng mas tiyak na interpretasyong gaya ng “sistema ng sanlibutan.”
- source_word: μισεῖ
  choice: napopoot
  rationale: Ang payak na pangkasalukuyang anyo ay likas na naghahayag ng pangkalahatan o nagpapatuloy na saloobin; mas angkop dito ang “napopoot” kaysa sa progresibong “kinapopootan.”
- source_word: γινώσκετε
  choice: alamin ninyo
  rationale: Bagaman maaaring basahing pasalaysay o pautos ang anyong Griyego, mas natural sa daloy ng pahayag ang panawagang “alamin ninyo.”
- source_word: πρῶτον ... ὑμῶν
  choice: bago sa inyo
  rationale: Ipinahahayag ng πρῶτον na may kasamang genitive ang temporal na pagkauna. Ang “bago sa inyo” ay natural sa Filipino at hindi ipinapakahulugang si Jesus ang unang kabilang sa kanila.
- source_word: μεμίσηκεν
  choice: napoot na
  rationale: Ang perpektong aspekto ay tumutukoy sa naunang pagkapoot na nananatiling mahalaga sa kasalukuyan. Ipinahihiwatig ito ng “napoot na,” bagaman walang ganap na tuwirang katumbas ang Greek perfect sa Filipino.
- source_word: ἐμὲ
  choice: sa akin
  rationale: Nananatiling malinaw ang diin sa mismong si Jesus bilang naunang pinoot ng sanlibutan.
theological_decisions:
- issue: Saklaw ng κόσμος sa teolohiyang Juaniko
  choice: Panatilihin ang “sanlibutan” nang walang paliwanag sa pangunahing teksto.
  alternative: “sistema ng sanlibutan” o “sangkatauhang naghihimagsik laban sa Diyos”
  rationale: May negatibong kulay ang κόσμος sa kontekstong ito, ngunit hindi dapat isara ng salin ang malawak at sadyang matensiyong gamit ni Juan sa pamamagitan ng isang doktrinal na pagpapakahulugan.
- issue: Pagbasa sa γινώσκετε
  choice: 'Basahin bilang pautos: “alamin ninyo.”'
  alternative: 'Basahin bilang pasalaysay: “alam ninyo.”'
  rationale: Pareho ang anyong morpolohikal, ngunit mas maayos sa kondisyunal na pangungusap ang exhortation. Hindi nito binabago ang sentrong teolohikal na punto na nauna ang pagkapoot kay Jesus.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Pinili ang “napopoot” at “sanlibutan” bilang pamilyar ngunit hindi kolokyal na wikang angkop sa tekstong biblikal. Ang marker na [a] ay inilagay sa dulo ng sugnay na tinutukoy nito.
