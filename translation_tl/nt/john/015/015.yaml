  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “sapagkat” para sa dignidad ng rehistro ngunit nananatiling madaling maunawaan; iniwasan ang sobrang teknikal o denominasyonal na pananalita.
