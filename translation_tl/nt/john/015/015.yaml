  text: οὐκέτι ⸂λέγω ὑμᾶς⸃ δούλους, ὅτι ὁ δοῦλος οὐκ οἶδεν τί ποιεῖ αὐτοῦ ὁ κύριος· ὑμᾶς δὲ εἴρηκα φίλους, ὅτι πάντα ἃ ἤκουσα παρὰ τοῦ πατρός μου ἐγνώρισα ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/015.yaml
  text: I no longer call you servants[a], because the servant does not know what his master is doing. But I have called you friends[b], because I have made known to you everything that I heard from my Father.
translation:
  language: tl
  text: Hindi ko na kayo tinatawag na mga alipin[a], sapagkat hindi alam ng alipin kung ano ang ginagawa ng kanyang amo[b]. Ngunit tinawag ko na kayong mga kaibigan, sapagkat ipinaalam ko sa inyo ang lahat ng narinig ko mula sa aking Ama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego na doulos ay maaaring tumukoy sa “alipin” o “lingkod.” Ginamit dito ang “alipin” dahil itinatampok ng paghahambing ang katayuang nasa ilalim ng isang amo, kabaligtaran ng pagiging kaibigan.
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “panginoon”; isinalin ditong “amo” dahil ang konteksto ay ang ugnayan ng isang alipin at ng nakatataas sa kanya, hindi isang banal o mesiyanikong titulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι
  choice: hindi na
  rationale: Likas na paraan sa modernong Tagalog upang ipahayag ang pagtigil o pagbabago mula sa dating kalagayan.
- source_word: λέγω ὑμᾶς
  choice: tinatawag ko kayo
  rationale: Sa konstruksiyong ito, ang λέγω ay nangangahulugang tawagin o kilalanin sa isang katawagan; pinananatili ng aspektong di-ganap ng “tinatawag” ang kasalukuyang anyo ng Griyego.
- source_word: δούλους / δοῦλος
  choice: mga alipin / alipin
  rationale: Mas malinaw na naipapakita ng “alipin” ang mababang katayuan at pagsunod na siyang ipinantatapat sa pagiging kaibigan; mas mahina rito ang “lingkod.”
- source_word: οἶδεν τί ποιεῖ
  choice: hindi alam ... kung ano ang ginagawa
  rationale: Tuwirang pinananatili ang diwa ng kaalaman at ang nagpapatuloy na kilos ng present tense.
- source_word: αὐτοῦ ὁ κύριος
  choice: kanyang amo
  rationale: Sa paghahambing tungkol sa alipin, ang κύριος ay tumutukoy sa nakatataas na amo, hindi ginagamit bilang titulong “Panginoon.”
- source_word: εἴρηκα φίλους
  choice: tinawag ko na kayong mga kaibigan
  rationale: Ang “na” ay nagpapahiwatig ng isang naitakdang katawagang nananatiling may bisa, na angkop sa resultative force ng perfect tense.
- source_word: πάντα ἃ
  choice: ang lahat ng
  rationale: Natural at komprehensibong katumbas ng neuter plural relative construction.
- source_word: ἤκουσα παρὰ τοῦ πατρός μου
  choice: narinig ko mula sa aking Ama
  rationale: Pinananatili ang karaniwang kahulugan ng ἀκούω at ang diwa ng παρά na nagpapakita ng pinagmulan.
- source_word: ἐγνώρισα ὑμῖν
  choice: ipinaalam ko sa inyo
  rationale: Natural na Tagalog para sa pagpapakilala o pagsisiwalat ng kaalaman; ang aspektong ganap ay angkop sa Greek aorist.
theological_decisions:
- issue: Paglalarawan sa δοῦλος sa paghahambing ng katayuan ng mga alagad
  choice: alipin
  alternative: lingkod; aliping nakatali sa paglilingkod
  rationale: Ang kaibahan sa “mga kaibigan” ay nakatuon sa katayuang nasa ilalim ng kapangyarihan at hindi bahagi ng kumpidensiyal na kaalaman. Hindi nito inaalis ang ibang posibleng gamit ng δοῦλος sa ibang konteksto.
- issue: Paglalarawan sa κύριος sa paghahambing na panlipunan
  choice: amo
  alternative: panginoon
  rationale: Dito ang κύριος ay katapat ng alipin sa isang ugnayang panlipunan, kaya iniiwasan ng “amo” ang di-kinakailangang pagbasa rito bilang banal o mesiyanikong titulo.
- issue: Resultative force ng εἴρηκα
  choice: tinawag ko na kayong mga kaibigan
  alternative: tinatawag ko kayong mga kaibigan; tinawag ko kayong mga kaibigan
  rationale: Pinagsasama ng “tinawag ko na” ang naganap na pagtatalaga at ang nananatili nitong bunga nang hindi ginagawang simpleng kasalukuyan lamang.
