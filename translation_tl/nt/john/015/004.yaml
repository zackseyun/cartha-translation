  source_fidelity: Tumpak na naihahatid ng draft ang utos na μένω, ang eliptikong katumbas na parirala na “at ako sa inyo,” ang kondisyon ng sanga na mamunga lamang habang nasa ubas, at ang inuulit na kawalan ng kakayahang mamunga ng mga alagad kung hindi sila mananatili kay Jesus. Ang “puno ng ubas” ay katanggap-tanggap na karaniwang Filipino para sa ἄμπελος sa talinghaga.
  naturalness: Malinaw at angkop ang kabuuang rehistro. Gayunman, ang “sa ganang sarili nito” ay hindi pangkaraniwan sa modernong Filipino at medyo pormal/arkayko ang himig. Ang “sa sarili nito” ay mas natural habang pinananatili ang kahulugang ἀφ’ ἑαυτοῦ.
  terminology: Konsistent ang “manatili” para sa μένω at mas angkop ito sa modernong Filipino kaysa “manahan” bilang pangunahing salin. Ang “sanga,” “mamunga,” at “puno ng ubas” ay angkop at pinananatili ang metapora.
