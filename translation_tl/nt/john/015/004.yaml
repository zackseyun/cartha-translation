id: JHN.15.4
reference: John 15:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: μείνατε ἐν ἐμοί, κἀγὼ ἐν ὑμῖν. καθὼς τὸ κλῆμα οὐ δύναται καρπὸν φέρειν ἀφ’ ἑαυτοῦ ἐὰν μὴ ⸀μένῃ ἐν τῇ ἀμπέλῳ, οὕτως οὐδὲ ὑμεῖς ἐὰν μὴ ἐν ἐμοὶ ⸀μένητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/004.yaml
  text: Remain in me[a], and I in you. Just as the branch is not able to bear fruit by itself unless it remains in the vine, so neither can you unless you remain in me.
translation:
  language: tl
  text: Manatili kayo sa akin[a], at ako sa inyo. Kung paanong hindi makapamumunga ang sanga sa sarili nito malibang manatili ito sa puno ng ubas, gayundin naman, hindi rin kayo makapamumunga malibang manatili kayo sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Manahan kayo sa akin.” Ang pandiwang Griyego na μένω ay maaari ring magpahiwatig ng pananahan, ngunit pangunahing tumutukoy ito sa pananatili o pagpapatuloy.
    reason: lexical_alternative
lexical_decisions:
- source_word: μείνατε / μένῃ / μένητε
  choice: manatili / manatili
  rationale: Pinananatili ang pag-uulit ng μένω at ang diwa ng patuloy na pananatili sa ugnayan; natural at malinaw ito sa makabagong Filipino.
- source_word: ἐν ἐμοί
  choice: sa akin
  rationale: Ang idiomatikong Filipino na “manatili sa akin” ay nagpapanatili sa larawan ng pakikipag-isa, hindi lamang pisikal na pagkalapit.
- source_word: κἀγὼ ἐν ὑμῖν
  choice: at ako sa inyo
  rationale: Pinananatili ang elipsis ng Griyego, na walang tahasang pandiwa, upang hindi gawing mas tiyak kaysa sa teksto ang kapwa pananatili.
- source_word: τὸ κλῆμα
  choice: ang sanga
  rationale: Karaniwang tawag sa bahaging nakakabit sa puno ng ubas at malinaw sa ordinaryong mambabasa.
- source_word: οὐ δύναται καρπὸν φέρειν
  choice: hindi makapamumunga
  rationale: Natural na Filipino na naghahayag ng kawalan ng kakayahang mamunga at nagpapanatili sa larawang pang-agrikultura.
- source_word: ἀφ’ ἑαυτοῦ
  choice: sa ganang sarili nito
  rationale: Ipinahahayag ang paggawa mula sa sariling kakayahan o pinagmumulan nang hindi idinaragdag ang ideya ng pagkakahiwalay na hindi tahasang sinabi rito.
- source_word: ἐν τῇ ἀμπέλῳ
  choice: sa puno ng ubas
  rationale: Sa Filipino, nililinaw ng “puno ng ubas” ang ἄμπελος bilang halamang pinagmumulan ng sanga, habang pinananatili ang talinghaga.
- source_word: οὕτως οὐδὲ ὑμεῖς
  choice: gayundin naman, hindi rin kayo makapamumunga
  rationale: Inuulit ang ipinahihiwatig na diwa ng naunang “hindi makapamumunga” upang maging buo at natural ang pangungusap sa Filipino.
theological_decisions:
- issue: Ang μένω sa konteksto ng pakikipag-isa at pagiging alagad
  choice: manatili
  alternative: manahan
  rationale: Ang “manatili” ay malinaw at pangkasalukuyang Filipino at saklaw ang pagpapatuloy at pagtitiyaga sa ugnayan. Ang “manahan” ay posibleng tradisyonal na salin ngunit mas mariing nagmumungkahi ng pagtira.
- issue: Ang eliptikong κἀγὼ ἐν ὑμῖν
  choice: at ako sa inyo
  alternative: at mananatili ako sa inyo
  rationale: Walang nakasaad na pandiwa sa ikalawang parirala. Ang pagpapanatili sa elipsis ay umiiwas sa pagdaragdag ng tahasang pangako o aspektong panghinaharap.
- issue: Ang ipinahihiwatig na pandiwa sa οὕτως οὐδὲ ὑμεῖς
  choice: hindi rin kayo makapamumunga
  alternative: gayon din kayo
  rationale: Ang kakayahang mamunga mula sa naunang sugnay ang natural na ipinagpapatuloy. Ginagawang malinaw ito sa Filipino nang hindi binabago ang lohika ng paghahambing.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang maramihang “kayo” ayon sa ὑμεῖς at pinanatili ang talinghaga ng sanga at puno ng ubas, pati ang sadyang elipsis sa “at ako sa inyo.”
