  source_fidelity: Ang “Alalahanin ninyo ang sinabi ko sa inyo” ay bahagyang kulang sa τοῦ λόγου, sapagkat hindi nito hayagang tinutukoy ang “salita/pahayag” na sinabi ni Jesus. Ang “tinupad ... ang salita” ay maaaring maunawaan bilang pagtupad o pagsasakatuparan ng isang pahayag, sa halip na pag-iingat/pagsunod dito, na siyang saklaw ng τηρέω sa talatang ito.
  naturalness: Natural at marangal ang karamihan ng draft, kabilang ang “alipin ... amo” at “inusig ... uusigin.” Mas malinaw at natural sa modernong Tagalog ang “salitang sinabi ko” at “sinunod ... ang salita” sa kontekstong ito.
  terminology: Ang “alipin” para sa δοῦλος at “amo” para sa κυρίου ay angkop sa panlipunang paghahambing. Ang “salita” ay dapat panatilihin sa pambungad upang maipakita ang λόγος at ang kaugnayan nito sa kasunod na dalawang pagbanggit. Para sa τηρέω, “sinunod” ang pinakamalinaw na pangunahing salin dito; itinatala ng talababa ang “iningatan” bilang alternatibong salin na nagpapanatili ng mas malawak na saklaw.
  issues:
