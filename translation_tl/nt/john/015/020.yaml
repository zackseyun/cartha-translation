source:
  edition: SBLGNT
  text: μνημονεύετε τοῦ λόγου οὗ ἐγὼ εἶπον ὑμῖν· Οὐκ ἔστιν δοῦλος μείζων τοῦ κυρίου αὐτοῦ· εἰ ἐμὲ ἐδίωξαν, καὶ ὑμᾶς διώξουσιν· εἰ τὸν λόγον μου ἐτήρησαν, καὶ τὸν ὑμέτερον τηρήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/020.yaml
  text: 'Remember the word that I said to you: ‘A servant is not greater than his master.’ If they persecuted me[a], they will also persecute you; if they kept my word[b], they will also keep yours.'
translation:
  language: tl
  text: 'Alalahanin ninyo ang salitang sinabi ko sa inyo: “Ang alipin[a] ay hindi nakahihigit sa kanyang amo.” Kung inusig nila ako, uusigin din nila kayo; kung sinunod nila ang salita ko,[b] susundin din nila ang salita ninyo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lingkod.” Ang Griyegong δοῦλος ay maaaring tumukoy sa alipin o lingkod; dito, binibigyang-diin ng paghahambing sa amo ang mababang katayuan ng alipin.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “iningatan.” Sa Juan, ang pag-iingat sa salita ni Jesus ay maaaring sumaklaw sa pagtanggap dito at pamumuhay ayon dito.
    reason: lexical_alternative
lexical_decisions:
- source_word: μνημονεύετε
  choice: Alalahanin ninyo
  rationale: Pinananatili nito ang pautos na lakas ng pangkasalukuyang pandiwa at ang panawagang patuloy na isaisip ang sinabi ni Jesus.
- source_word: τοῦ λόγου οὗ ἐγὼ εἶπον ὑμῖν
  choice: ang sinabi ko sa inyo
  rationale: Sa kontekstong ito, ang λόγος ay tumutukoy sa tiyak na kasabihang nauna nang sinabi ni Jesus. Natural sa modernong Tagalog ang “ang sinabi ko” at hindi nawawala ang tinutukoy na pahayag.
- source_word: δοῦλος
  choice: alipin
  rationale: Ipinahahayag ng “alipin” ang mababang katayuan sa harap ng κύριος at pinananatili ang lakas ng paghahambing.
- source_word: μείζων
  choice: nakahihigit
  rationale: Saklaw nito ang paghahambing sa katayuan o awtoridad nang hindi nililimitahan ang kahulugan sa halaga o kahalagahan lamang.
- source_word: κυρίου
  choice: amo
  rationale: Sa tuwirang ugnayan ng δοῦλος at κύριος, ang “amo” ay malinaw na tumutukoy sa nakatataas sa alipin at umiiwas sa di-kinakailangang pagbasa rito bilang titulong “Panginoon.”
- source_word: ἐδίωξαν / διώξουσιν
  choice: inusig / uusigin
  rationale: Ang konteksto ay pagkapoot at pag-uusig kay Jesus at sa kanyang mga alagad, hindi simpleng paghabol.
- source_word: ἐτήρησαν / τηρήσουσιν
  choice: tinupad / tutuparin
  rationale: Naipahahayag ng “tuparin” ang pagtanggap at pagsunod sa salita, habang pinananatili ang magkaparis na pandiwa sa dalawang sugnay.
- source_word: τὸν λόγον μου ... τὸν ὑμέτερον
  choice: ang salita ko ... ang salita ninyo
  rationale: Pinananatili nito ang hayag na pagkakatulad ng salita ni Jesus at ng salitang ipahahayag ng kanyang mga alagad.
theological_decisions:
- issue: Paglalarawan sa ugnayan ng δοῦλος at κύριος
  choice: alipin ... amo
  alternative: lingkod ... panginoon
  rationale: Ang kasabihan ay nakasalalay sa malinaw na agwat ng katayuan at awtoridad. Mas tuwirang naipapakita ng “alipin ... amo” ang ugnayang iyon, ngunit hindi nito ginagawang titulong teolohikal ang κύριος sa pangungusap na ito.
- issue: Saklaw ng τηρέω kaugnay ng salita ni Jesus
  choice: tinupad
  alternative: iningatan; sinunod
  rationale: Maaaring saklawin ng τηρέω ang pag-iingat, pagtanggap, at pagsunod sa salita. Ang “tinupad” ay natural sa Tagalog at pinananatili ang praktikal na tugon nang hindi tahasang nililimitahan ito sa pagsunod lamang.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “amo” sa halip na “panginoon” dahil panlipunang ugnayan ng alipin at nakatataas ang agarang konteksto. Ang parallelism ng pag-uusig at pagtupad sa salita ay pinanatili.
