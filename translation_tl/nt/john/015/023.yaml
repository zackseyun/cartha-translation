id: JHN.15.23
reference: John 15:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ ἐμὲ μισῶν καὶ τὸν πατέρα μου μισεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/023.yaml
  text: The one who hates me also hates my Father.
translation:
  language: tl
  text: Ang napopoot sa akin ay napopoot din sa aking Ama.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ... μισῶν
  choice: Ang napopoot
  rationale: Ang artikulo at pangkasalukuyang participle ay ginagamit bilang pangngalan at tumutukoy sa sinumang taong kinikilala sa ganitong kilos. Likas at marangal sa Filipino ang “Ang napopoot.”
- source_word: ἐμὲ
  choice: sa akin
  rationale: Tuwirang layon ito ng μισῶν; hinihingi ng pandiwang Filipino na “mapoot” ang panandang “sa.”
- source_word: μισῶν / μισεῖ
  choice: napopoot / napopoot
  rationale: Ang “mapoot” ay tuwirang nagpapahayag ng matinding pagkamuhi. Pinanatili ang pag-uulit ng parehong salitang-ugat at ang pangkalahatang diwa ng pangkasalukuyang anyo.
- source_word: καὶ
  choice: din
  rationale: Sa kontekstong ito, ipinahihiwatig ng καί na ang pagkapoot sa Ama ay kasama rin sa pagkapoot kay Jesus; natural itong ipinapahayag ng “din” sa Filipino.
- source_word: τὸν πατέρα μου
  choice: sa aking Ama
  rationale: Natural na katumbas ito ng “my Father.” Ginamit ang malaking titik sa “Ama” sapagkat tumutukoy ito sa Diyos bilang Ama ni Jesus.
theological_decisions:
- issue: Malaking titik sa “Ama” bilang pagtukoy sa Diyos
  choice: aking Ama
  alternative: aking ama
  rationale: Sa Ebanghelyo ni Juan, ang “Ama” ay pamagat na tumutukoy sa Diyos at sa kaugnayan niya kay Jesus. Nililinaw ng malaking titik ang tinutukoy nang hindi nagdaragdag sa kahulugan.
translation_notes:
  register: Maikli, natural, at marangal na modernong Filipino. Pinanatili ang paralelismo at leksikal na pag-uulit ng Griyego, pati ang pangkalahatang pahayag sa isahang anyo.
