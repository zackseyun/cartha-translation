translation:
  language: tl
  text: Sapagkat maging ang kanyang mga kapatid na lalaki ay hindi naniwala sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Sapagkat maging ang kanyang mga kapatid na lalaki ay hindi naniniwala noon sa kanya.” Maaaring ipahayag ng pandiwang Griyego ang nagpapatuloy o kinagawiang kalagayan sa nakaraan (“hindi naniniwala noon”) o ang payak na pangyayari sa nakaraan (“hindi naniwala”).
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: maging … ay hindi
  rationale: Ipinahahayag nito ang mariing diwa ng “not even,” hindi lamang isang payak na pag-uugnay.
- source_word: γὰρ
  choice: sapagkat
  rationale: Ipinakikita nito na ang pangungusap ay nagbibigay ng paliwanag o dahilan para sa naunang konteksto.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: ang mga kapatid niyang lalaki
  rationale: Ang pangngalan ay panlalaking maramihan at sa salaysay ay tumutukoy sa mga lalaking kapatid o kamag-anak ni Jesus; nililinaw ng “lalaki” ang kasarian nang hindi tinutukoy kung sila ay buo, kalahati, o ibang uri ng kamag-anak.
- source_word: ἐπίστευον
  choice: naniniwala
  rationale: Ang aspektong imperpektibo ay likas na naipahahayag ng “naniniwala,” na naglalarawan ng nagpapatuloy o umiiral na kalagayan sa panahong tinutukoy.
- source_word: εἰς αὐτόν
  choice: sa kanya
  rationale: Kasama ng πιστεύω, ipinahahayag ng εἰς ang paniniwala o pagtitiwalang nakatuon sa isang tao; “naniniwala sa kanya” ang natural na katumbas sa Tagalog.
theological_decisions:
- issue: Diwa ng πιστεύω εἰς αὐτόν sa Juan
  choice: personal na paniniwala o pagtitiwalang nakatuon kay Jesus
  alternative: hindi nagtitiwala sa kanya
  rationale: Madalas gamitin ni Juan ang πιστεύω εἰς para sa paniniwala o pagtitiwala kay Jesus. Pinananatili ng salin ang pahayag na hindi sila naniniwala sa kanya nang hindi dinaragdagan ang teksto ng isang tiyak na paliwanag sa kanilang motibo o kalagayang teolohikal.
- issue: Pagkakakilanlan ng ἀδελφοί ni Jesus
  choice: mga kapatid niyang lalaki
  alternative: mga lalaking kamag-anak niya
  rationale: Ang “mga kapatid niyang lalaki” ang tuwirang kahulugan sa salaysay, ngunit hindi nito nilulutas ang pinagtatalunang eksaktong ugnayang pampamilya nang higit sa sinasabi ng Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sapagkat” upang mapanatili ang ugnayang nagpapaliwanag, at ang “naniniwala” upang natural na maipakita ang aspektong imperpektibo. Iniwasan ang mas teknikal o denominasyonal na pananalita.
