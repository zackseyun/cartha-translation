base_translation:
  language: en
  yaml_path: translation/nt/john/007/008.yaml
  text: You go up to the feast[a]. I am not going up to this feast[b], because my time has not yet come to fulfillment.
translation:
  language: tl
  text: Umakyat kayo sa kapistahan[a]. Hindi ako aakyat sa kapistahang ito, sapagkat ang panahon ko ay hindi pa ganap na natutupad.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa ilang manuskrito: “Hindi pa ako aakyat sa kapistahang ito.”'
    reason: textual_variant
  - marker: b
    text: O “ang takdang panahon ko ay hindi pa natutupad.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάβητε
  choice: Umakyat kayo
  rationale: Pinananatili ang direksiyonal na diwa ng pag-akyat patungong Jerusalem at natural ito sa konteksto ng pagpunta sa kapistahan.
- source_word: ἑορτή
  choice: kapistahan
  rationale: Karaniwan, malinaw, at marangal na katawagan para sa relihiyosong pagdiriwang sa kontekstong ito.
- source_word: οὐκ ἀναβαίνω
  choice: Hindi ako aakyat
  rationale: Ang panghinaharap na anyo sa Filipino ay natural para sa nalalapit na kilos na tinutukoy ng Griyegong pangkasalukuyan; hindi idinagdag ang 'pa' sapagkat οὐκ ang batayang pagbasa.
- source_word: ταύτην
  choice: ito
  rationale: Tuwirang tumutukoy sa partikular na kapistahang pinag-uusapan.
- source_word: καιρός
  choice: panahon
  rationale: Pinananatili ang likas na lawak ng kahulugan, kabilang ang posibleng diwa ng takdang panahon, nang hindi ito ipinapasok bilang tahasang interpretasyon.
- source_word: πεπλήρωται
  choice: lubusang dumarating
  rationale: Natural sa Filipino at pinananatili ang diwa ng pag-abot sa kaganapan o ganap na katuparan, hindi lamang simpleng pagdating.
theological_decisions:
- issue: Pagkakaiba ng mga manuskrito sa pahayag ni Jesus tungkol sa pagpunta sa kapistahan
  choice: 'Sinunod sa pangunahing teksto ang SBLGNT na οὐκ: ''Hindi ako aakyat.'''
  alternative: 'οὔπω: ''Hindi pa ako aakyat.'''
  rationale: Ang ibinigay na batayang teksto ay may οὐκ. Inilagay sa talababa ang mahalagang alternatibo upang hindi palihim na lutasin ang tensiyon sa salaysay.
- issue: Kahulugan ng καιρός
  choice: panahon
  alternative: takdang panahon
  rationale: Ang 'panahon' ay natural at hindi labis na nagpapakahulugan; ipinapakita sa talababa ang mas tiyak na posibleng diwa.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang 'umakyat' upang mapanatili ang heograpiko at panrelihiyong diwa ng pagpunta sa Jerusalem. Inilagay ang [a] pagkatapos ng unang pangungusap bilang marker sa variant na may kinalaman sa kasunod na pahayag, alinsunod sa ibinigay na marker placement; ang [b] ay inilagay sa sugnay tungkol sa panahon, na siyang tinutukoy ng lexical alternative.
