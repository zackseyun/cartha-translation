  text: μὴ κρίνετε κατ’ ὄψιν, ἀλλὰ τὴν δικαίαν κρίσιν ⸀κρίνετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/024.yaml
  text: Do not judge according to appearance[a], but judge with righteous judgment.
translation:
  language: tl
  text: Huwag kayong humatol batay sa panlabas na anyo[a], kundi magbigay kayo ng matuwid na hatol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “ayon sa nakikita.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ κρίνετε
  choice: Huwag kayong humatol
  rationale: Likas na ipinahahayag ng “huwag” at pandiwang pautos ang pagbabawal, nang hindi ipinapalagay na ang kilos ay nagsimula na at dapat lamang itigil.
- source_word: κατ’ ὄψιν
  choice: ayon sa nakikita
  rationale: Ipinahahayag nito ang paghatol batay sa nakikitang anyo o panlabas na impresyon. Natural ito sa makabagong Tagalog at hindi nililimitahan ang parirala sa literal na mukha.
- source_word: ἀλλὰ
  choice: kundi
  rationale: Malinaw na itinatapat nito ang ipinagbabawal na batayan ng paghatol sa iniutos na uri ng paghatol.
- source_word: τὴν δικαίαν κρίσιν
  choice: matuwid na hatol
  rationale: Pinananatili ng “matuwid” ang moral at etikal na bigat ng δικαίαν, samantalang natural na katumbas ng κρίσιν ang “hatol” sa kontekstong ito.
- source_word: κρίνετε
  choice: magbigay kayo ng … hatol
  rationale: Natural na Tagalog ito para sa paglalapat ng hatol at pinananatili, sa pamamagitan ng salitang-ugat na “hatol,” ang pag-uulit at paghahambing sa unang sugnay.
theological_decisions:
- issue: Saklaw ng δικαίαν sa etikal at hudisyal na konteksto
  choice: matuwid
  alternative: makatarungan
  rationale: Ang “matuwid” ay nagpapanatili sa moral na katangian ng δικαίαν at hindi ito pinaliliit sa pagiging patas lamang sa paraang hudisyal. Gayunman, hindi nito idinaragdag ang anumang natatanging doktrinal na pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maramihang “kayo” ayon sa anyo ng mga pandiwang Griyego. Iniwasan ang sobrang literal na “hatulan ang matuwid na hatol,” ngunit pinanatili ang pag-uulit ng salitang-ugat na “hatol.”
