  source_fidelity: Tumpak ang pagtukoy sa mga ὑπηρέται bilang “mga bantay,” sa mga ἀρχιερεῖς bilang “mga punong pari,” at sa Φαρισαίους bilang “mga Pariseo.” Wasto ring ipinapakita ng “tinanong sila ng mga ito” na ang mga punong pari at mga Pariseo ang nagtatanong sa mga bantay, at pinananatili nito ang demonstratibong ἐκεῖνοι. Ang “pumunta” ay nauunawaan, ngunit ang ἦλθον πρὸς ay mas tuwirang “dumating ... sa” sa pagsasalaysay na ito.
