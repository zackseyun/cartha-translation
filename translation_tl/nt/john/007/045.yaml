  text: Ἦλθον οὖν οἱ ὑπηρέται πρὸς τοὺς ἀρχιερεῖς καὶ Φαρισαίους, καὶ εἶπον αὐτοῖς ἐκεῖνοι· Διὰ τί οὐκ ἠγάγετε αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/045.yaml
  text: So the officers came to the chief priests and Pharisees[a], and they said to them[b], “Why did you not bring him?”
translation:
  language: tl
  text: Kaya dumating ang mga bantay sa mga punong pari at mga Pariseo, at tinanong sila ng mga ito, “Bakit hindi ninyo siya dinala?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Ipinapakita ang bunga o pagpapatuloy ng naunang pangyayari sa natural na modernong Tagalog.
- source_word: ὑπηρέται
  choice: mga bantay
  rationale: Sa konteksto, sila ang mga tauhang isinugo ng mga pinuno upang dakpin si Jesus; mas tiyak ito kaysa sa pangkalahatang “mga lingkod” at hindi kasing-interpretatibo ng “mga bantay sa templo.”
- source_word: ἀρχιερεῖς
  choice: mga punong pari
  rationale: Karaniwang katawagan sa pangkat ng mga nangungunang awtoridad na pari.
- source_word: Φαρισαίους
  choice: mga Pariseo
  rationale: Likas at kinikilalang anyong Tagalog ng pangalan ng pangkat.
- source_word: ἐκεῖνοι
  choice: mga ito
  rationale: Pinananatili ang tahasang demonstratibo na tumutukoy sa mga punong pari at mga Pariseo, sa paraang natural sa Tagalog.
- source_word: Διὰ τί
  choice: Bakit
  rationale: Direkta at natural na katumbas ng tanong tungkol sa dahilan.
- source_word: ἠγάγετε
  choice: hindi ninyo siya dinala
  rationale: Ang “dinala” ay akma sa kontekstong isinugo ang mga bantay upang hulihin at iharap si Jesus, habang nananatili ang payak na aspektong naganap ng tanong.
- source_word: αὐτόν
  choice: siya
  rationale: Tumutukoy kay Jesus bilang layon ng pandiwa.
