  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ ἀφ’ ἑαυτοῦ λαλῶν τὴν δόξαν τὴν ἰδίαν ζητεῖ· ὁ δὲ ζητῶν τὴν δόξαν τοῦ πέμψαντος αὐτὸν οὗτος ἀληθής ἐστιν καὶ ἀδικία ἐν αὐτῷ οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/018.yaml
  text: The one who speaks from himself seeks his own glory[a]; but the one who seeks the glory of the one who sent him, this one is true[c][b], and there is no unrighteousness in him.
translation:
  language: tl
  text: Ang nagsasalita mula sa sarili niya[a] ay naghahangad ng sarili niyang kaluwalhatian; ngunit ang naghahangad ng kaluwalhatian ng nagsugo sa kanya, siya ay tapat[b], at walang kalikuan[c] sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nang kusa” o “sa sarili niyang awtoridad.”
    reason: lexical_alternative
  - marker: b
    text: O “totoo” o “mapagkakatiwalaan.”
    reason: lexical_alternative
  - marker: c
    text: O “kawalang-katarungan” o “masamang gawain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφ’ ἑαυτοῦ
  choice: mula sa sarili niya
  rationale: Pinananatili nito ang literal na larawan at ang paghahambing sa pagitan ng nagsasalita mula sa sarili at ng isinugo ng iba, nang hindi ipinapasok sa pangunahing teksto ang mas tiyak na pakahulugang “sa sarili niyang awtoridad.”
- source_word: λαλῶν
  choice: nagsasalita
  rationale: Likas na salin ito ng kasalukuyang pandiwaring ginagamit bilang pangngalan at nagpapahayag ng pangkalahatang katangian.
- source_word: δόξαν
  choice: kaluwalhatian
  rationale: Pinananatili nito ang malawak at teolohikal na dating ng δόξα sa Juan, habang maaari rin itong tumukoy sa karangalang hinahangad para sa sarili o sa nagsugo.
- source_word: τὴν ἰδίαν
  choice: sarili niyang
  rationale: Malinaw nitong ipinakikita na ang kaluwalhatiang hinahangad ay para sa mismong nagsasalita.
- source_word: ζητεῖ
  choice: naghahangad
  rationale: Natural ito sa Filipino para sa masidhing paghahanap o layunin, at inuulit sa dalawang sugnay upang mapanatili ang paralelismo ng Griyego.
- source_word: τοῦ πέμψαντος αὐτὸν
  choice: ng nagsugo sa kanya
  rationale: Maikli at natural na naihahayag ang personal na ahensiya ng nagsugo at ang ugnayan nito sa isinugo.
- source_word: οὗτος
  choice: siya ang
  rationale: Naipakikita ng ayos na ito ang diin ng demonstratibong οὗτος nang hindi gumagamit ng di-likas na “ang isang ito” sa Filipino.
- source_word: ἀληθής
  choice: totoo
  rationale: Pinananatili nito ang malawak na Johannine na diwa ng pagiging tunay at maaasahan; ang mas tiyak na “tapat” ay ibinibigay bilang alternatibo sa talababa.
- source_word: ἀδικία
  choice: kalikuan
  rationale: Saklaw nito ang moral na kasamaan o kawalang-katuwiran, at hindi nito nililimitahan ang salita sa panlipunang kawalang-katarungan lamang.
- source_word: ἐν αὐτῷ οὐκ ἔστιν
  choice: walang kalikuan sa kanya
  rationale: Natural at tuwirang isinasalin nito ang eksistensiyal na pahayag at ang panloob na paglalarawan sa moral na katangian.
theological_decisions:
- issue: Ang kaibahan ng pagsasalita “mula sa sarili” at paghahangad sa kaluwalhatian ng nagsugo
  choice: 'Pinanatili ang kaibahan sa pinagmumulan at layunin ng pagsasalita: sariling kaluwalhatian laban sa kaluwalhatian ng nagsugo.'
  alternative: Unawain ang “mula sa sarili” bilang tiyak na “sa sarili niyang awtoridad,” o ilapat ang kaibahan nang eksklusibo kay Jesus laban sa lahat ng bulaang guro.
  rationale: Ang konteksto ay tumatalakay sa pinagmulan at layunin ng turo. Hindi nilalagyan ng salin ang pahayag ng teknikal na doktrinang higit sa malinaw na sinasabi ng teksto.
- issue: Saklaw ng ἀληθής
  choice: totoo
  alternative: tapat o mapagkakatiwalaan
  rationale: Ang “totoo” ay nagpapanatili sa sadyang malawak na kahulugan ng salita, na maaaring tumukoy kapwa sa pagiging tunay at sa pagiging mapagkakatiwalaan.
- issue: Saklaw ng ἀδικία
  choice: kalikuan
  alternative: kawalang-katarungan o masamang gawa
  rationale: Ang “kalikuan” ay nagpapanatili sa malawak na moral at teolohikal na saklaw ng salita nang hindi ito ginagawang panlipunan o legal na kawalang-katarungan lamang.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang pag-uulit ng “naghahangad” at “kaluwalhatian” upang maipakita ang paralelismo ng Griyego. Ginamit ang “siya ang totoo” upang natural na maihatid ang diin ng οὗτος.
