revisions:
- from: Ang nagsasalita mula sa sarili niya[a] ay naghahangad ng sarili niyang kaluwalhatian; ngunit ang naghahangad ng kaluwalhatian ng nagsugo sa kanya, siya ang totoo[b], at walang kalikuan[c] sa kanya.
  to: Ang nagsasalita mula sa sarili niya[a] ay naghahangad ng sarili niyang kaluwalhatian; ngunit ang naghahangad ng kaluwalhatian ng nagsugo sa kanya, siya ay tapat[b], at walang kalikuan[c] sa kanya.
  rationale: 'Pinalitan ang “siya ang totoo” ng “siya ay tapat” upang maging likas at malinaw ang Filipino habang tinutumbasan ang kontekstuwal na diwa ng ἀληθής: ang nagsasalitang naghahanap ng kaluwalhatian ng nagsugo sa kanya ay may integridad at maaasahan. Inilipat ang “totoo” sa talababa bilang wastong alternatibo. Ginawang “masamang gawain” ang huling alternatibo sa talababa upang maging mas natural na Filipino. Napanatili ang lahat ng marker at ang kahulugan ng talata.'
