  source_fidelity: Ang “ilan sa mga tao” ay maaaring unawain bilang ilang tao sa pangkalahatan, samantalang ang ἐκ τοῦ ὄχλου ay malinaw na isang bahagi mula sa tiyak na karamihan. Ang “ilan sa karamihan” ay mas tapat. Ang “sinabi nila” ay katanggap-tanggap sa salaysay, ngunit hindi naipahihiwatig ang imperpektong ἔλεγον; “ay nagsasabi” ay ligtas at natural sa kontekstong ito. Ang “ito” sa tuwirang pahayag ay maaaring tumukoy sa mga salitang narinig sa Tagalog; “Ang taong ito” ay malinaw na tumutukoy kay Jesus at napapanatili ang demonstrative na Οὗτός.
  naturalness: Natural at marangal sa modernong Filipino Tagalog ang “Kaya, ang ilan sa karamihan, nang marinig nila ang mga salitang ito, ay nagsasabi.” Mas malinaw din ang “Ang taong ito talaga ang Propeta” kaysa “Tunay ngang ito ang Propeta,” na may posibleng malabong reperensiya ng “ito.”
  terminology: Ang “Propeta” na may malaking titik ay angkop upang ipakita ang tila pamagat na gamit ng ὁ προφήτης nang hindi ito tuwirang ipinapakahulugang Mesiyas. Ang talababa ay maingat na pinananatili ang di-tiyak na interpretasyon at ang ugnay sa Deuteronomio 18:15.
