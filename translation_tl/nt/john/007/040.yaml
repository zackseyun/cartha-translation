base_translation:
  language: en
  yaml_path: translation/nt/john/007/040.yaml
  text: Therefore[a], some from the crowd, when they heard these words, were saying, “This truly is the Prophet.”
translation:
  language: tl
  text: Kaya, ang ilan sa karamihan, nang marinig nila ang mga salitang ito, ay nagsasabi, “Ang taong ito talaga ang Propeta.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Malamang na ang “Propeta” ay tumutukoy sa inaasahang propetang tulad ni Moises (tingnan ang Deuteronomio 18:15), bagaman inuunawa ito ng ilan sa mas pangkalahatang diwa bilang “ang propeta.”
    reason: cross_reference
lexical_decisions:
- source_word: Ἐκ τοῦ ὄχλου
  choice: ilan sa mga tao
  rationale: Ipinahahayag ng parirala na isang bahagi lamang ng karamihan ang nagsalita. Likas sa modernong Tagalog ang “ilan sa mga tao” at hindi nito ipinahihiwatig na buong karamihan ang nagkaisa.
- source_word: οὖν
  choice: Kaya
  rationale: Iniuugnay nito ang tugon ng mga tao sa naunang sinabi ni Jesus at pinananatili ang lohikal na pag-usad ng salaysay.
- source_word: ἀκούσαντες
  choice: nang marinig
  rationale: Ipinakikita ng aorist participle na ang pagkarinig ay kaugnay at nauna sa kanilang pagsasalita; malinaw at natural ito sa Tagalog.
- source_word: τῶν λόγων τούτων
  choice: ang mga salitang ito
  rationale: Tumutukoy ito sa mga sinabi ni Jesus kaagad bago ang talatang ito. Tuwiran at karaniwan ang katumbas na “mga salitang ito.”
- source_word: ἔλεγον
  choice: sinabi nila
  rationale: Bagaman imperfect ang pandiwa at maaaring magpahiwatig ng nagpapatuloy na pagsasalita, ang payak na “sinabi nila” ang pinakanatural sa salaysay na Tagalog; hindi rin kinakailangang ipakahulugang paulit-ulit ang sinabi.
- source_word: Οὗτός ἐστιν
  choice: ito ang
  rationale: Pinananatili ng “ito” ang mariing pagtukoy ng demonstrative kay Jesus at natural itong gamitin sa pahayag na nagpapakilala.
- source_word: ἀληθῶς
  choice: Tunay ngang
  rationale: Ang “tunay” ay nagpapanatili ng taimtim na diin, at ang “nga” ay natural na nagpapalakas sa katiyakan ng pahayag sa Tagalog.
- source_word: ὁ προφήτης
  choice: ang Propeta
  rationale: Ang tiyak na pantukoy at konteksto sa Juan ay nagpapahiwatig ng isang inaasahang natatanging propeta. Ang malaking titik ay naghuhudyat ng titulong gamit nang hindi tahasang ipinapantay ito sa Mesiyas.
theological_decisions:
- issue: Pagkakakilanlang ipinahihiwatig ng “ὁ προφήτης”
  choice: Isinalin bilang titulong “ang Propeta,” nang hindi tahasang kinikilala bilang Mesiyas.
  alternative: Maaaring unawain bilang pangkalahatang “ang propeta” o bilang katawagang halos katumbas ng Mesiyas.
  rationale: Malamang na tumutukoy ito sa inaasahang propetang tulad ni Moises sa Deuteronomio 18:15, ngunit hindi ito tahasang ipinaliliwanag ng talata. Pinananatili ng salin ang teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “mga tao” bilang natural na pagtukoy sa mga kabilang sa karamihan, at iniwasan ang mas mabigat na “karamihan” sa mismong pangungusap. Inilagay ang talababa pagkatapos ng “Propeta,” ang salitang aktuwal nitong nililinaw.
