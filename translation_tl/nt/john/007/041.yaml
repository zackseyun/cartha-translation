  text: ἄλλοι ἔλεγον· Οὗτός ἐστιν ὁ χριστός· ⸂οἱ δὲ⸃ ἔλεγον· Μὴ γὰρ ἐκ τῆς Γαλιλαίας ὁ χριστὸς ἔρχεται;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/041.yaml
  text: Others were saying[a], “This is the Messiah.” But some were saying, “Surely the Messiah does not come from Galilee[b], does he?”
translation:
  language: tl
  text: May iba namang nagsasabi, “Ito ang Mesiyas[a].” Ngunit ang iba ay nagsasabi, “Hindi naman mula sa Galilea nagmumula ang Mesiyas, hindi ba?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Cristo.”
    reason: alternatibong salin ng titulong Griyego na Χριστός
lexical_decisions:
- source_word: ἄλλοι
  choice: May iba naman
  rationale: Tumutukoy ito sa ibang pangkat sa loob ng karamihan; natural sa Tagalog ang “may iba naman” at malinaw ang paghahambing.
- source_word: ἔλεγον
  choice: nagsasabi
  rationale: Ang aspektong imperpektibo ay nagpapahiwatig ng nagpapatuloy o paulit-ulit na pagsasalita; naipapahayag ito ng “nagsasabi.”
- source_word: Οὗτός ἐστιν
  choice: Ito ang
  rationale: Likas na paraan ito sa Tagalog upang tukuyin at kilalanin ang isang tao.
- source_word: ὁ χριστός
  choice: ang Mesiyas
  rationale: Ginagamit dito ang Χριστός bilang titulo ng hinihintay na pinahiran; pinananatili ng “Mesiyas” ang kontekstong Judio at ang pagkakakilanlang pinagtatalunan ng mga tao.
- source_word: οἱ δὲ
  choice: Ngunit ang iba
  rationale: Nagpapakilala ito ng isa pang pangkat na sumasalungat sa naunang pahayag; malinaw at natural ang “Ngunit ang iba.”
- source_word: Μὴ γὰρ
  choice: Hindi naman …, hindi ba?
  rationale: Ang tanong na may μή ay umaasang sasang-ayon ang kausap sa negatibong sagot. Ipinahihiwatig ng “naman” at “hindi ba?” ang mapagdudang retorikal na tono nang hindi ito ginagawang tahasang pahayag.
- source_word: ἐκ τῆς Γαλιλαίας
  choice: sa Galilea
  rationale: Kasama ng “manggagaling,” malinaw na ipinapahayag ng “sa Galilea” ang lugar na pinagmulan.
- source_word: ἔρχεται
  choice: manggagaling
  rationale: Sa konteksto ng inaasahang pinagmulan ng Mesiyas, natural sa Tagalog ang “manggagaling,” habang nananatili ang diwa ng pagdating mula sa isang lugar.
theological_decisions:
- issue: Pagsasalin sa Χριστός bilang titulo
  choice: Mesiyas
  alternative: Cristo
  rationale: Ang usapan ay tungkol sa pagkakakilanlan ng hinihintay na pinahiran, kaya mas malinaw ang titulong “Mesiyas.” Inilalagay sa talababa ang tradisyonal na katumbas na “Cristo” nang hindi ipinapalagay na pangalan lamang ang salita.
- issue: Retorikal na tanong tungkol sa Galilea
  choice: Hindi naman sa Galilea manggagaling ang Mesiyas, hindi ba?
  alternative: Manggagaling ba talaga sa Galilea ang Mesiyas?
  rationale: Pinananatili ng napiling anyo ang inaasahang negatibong sagot ng μή at ang pag-aalinlangan ng nagsasalita, nang hindi pinatutunayang tama ang kanilang palagay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nagsasabi” upang mapanatili ang nagpapatuloy na kilos, at ang retorikal na “hindi ba?” upang likas na maipahayag ang tanong na umaasa ng negatibong sagot.
