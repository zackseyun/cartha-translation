  text: Ὡς δὲ ἀνέβησαν οἱ ἀδελφοὶ αὐτοῦ ⸂εἰς τὴν ἑορτήν, τότε καὶ αὐτὸς ἀνέβη⸃, οὐ φανερῶς ἀλλὰ ὡς ἐν κρυπτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/010.yaml
  text: But when his brothers had gone up to the feast[a], then he also went up, not openly but as if in secret.
translation:
  language: tl
  text: Ngunit nang makaakyat na sa kapistahan ang kanyang mga kapatid na lalaki, saka rin siya umakyat—hindi hayagan kundi waring palihim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kundi palihim.” Sa Griyego, literal itong “kundi waring palihim,” na maaaring bahagyang nagpapalambot sa pahayag.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Ngunit nang
  rationale: Ipinahahayag ng ὡς ang panahon ng kasunod na pangyayari, samantalang ang δέ ay banayad na paglipat o pagsalungat sa naunang salaysay.
- source_word: ἀνέβησαν ... ἀνέβη
  choice: makaakyat na ... umakyat
  rationale: Pinananatili ng “umakyat” ang heograpikal at panrelihiyong diwa ng pag-akyat patungong Jerusalem. Nililinaw ng “makaakyat na” na nauna ang pag-alis ng mga kapatid bago sumunod si Jesus.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: ang kanyang mga kapatid
  rationale: Sa konteksto, ang ἀδελφοί ay tumutukoy sa mga lalaking kapatid ni Jesus. Sa karaniwang modernong Tagalog, likas gamitin ang “mga kapatid,” at malinaw na ang tinutukoy ay ang pangkat na binanggit sa mga naunang talata.
- source_word: εἰς τὴν ἑορτήν
  choice: sa kapistahan
  rationale: Ang ἑορτή ay isang relihiyosong kapistahan, dito ay ang Kapistahan ng mga Tolda ayon sa konteksto. Ang “kapistahan” ay natural at marangal na katumbas.
- source_word: τότε καὶ αὐτὸς
  choice: saka rin siya
  rationale: Ang “saka” ay nagpapakita ng pagkakasunod na ipinahahayag ng τότε, at ang “rin” ay nagpapanatili sa dagdag na diin ng καί.
- source_word: οὐ φανερῶς
  choice: hindi hayagan
  rationale: Tuwirang ipinahahayag nito na hindi siya pumunta sa paraang lantad o pampubliko.
- source_word: ἀλλὰ ὡς ἐν κρυπτῷ
  choice: kundi waring palihim
  rationale: Pinananatili ng “waring” ang bahagyang pagkakwalipika ng ὡς sa halip na tahasang sabihing “palihim” lamang.
theological_decisions:
- issue: Kaugnayan ng pag-akyat ni Jesus dito sa nauna niyang pahayag tungkol sa pag-akyat sa kapistahan
  choice: Isinalaysay nang tuwiran na umakyat siya kalaunan at hindi hayagan.
  alternative: Ipahiwatig na nagbago ang kanyang pasya, o ipaliwanag sa salin kung paano ito naaayon sa Juan 7:8.
  rationale: Hindi ipinaliliwanag ng Griyegong teksto ang ugnayan ng dalawang pahayag. Kaya pinananatili ng salin ang tensiyon sa salaysay at hindi nagdaragdag ng pagpapakahulugang wala sa talata.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “umakyat” upang mapanatili ang larawan ng pag-akyat patungong Jerusalem, at ang em dash upang malinaw na maipakita ang pagsalungat sa paraan ng kanyang pagpunta.
