  to: Sinabi niya ito tungkol sa Espiritu, na tatanggapin ng mga sumampalataya sa kanya; sapagkat wala pa ang Espiritu[a], dahil hindi pa niluwalhati si Jesus.
  rationale: Pinalitan ang interpretibong “hindi pa dumarating” ng idiomatikong “wala pa,” na mas malapit sa copular/existential na pahayag ng Griyego at nagpapanatili ng tensiyong hindi nito ipinapaliwanag. Inayos ang aspekto ng mga sumampalataya at ang passive na pagluluwalhati. Ang talababa ay malinaw na naghihiwalay sa pangunahing pagsasalin, sa pagiging maigsi ng Griyego, at sa karaniwang interpretibong pagbasa na “naipagkakaloob.”
