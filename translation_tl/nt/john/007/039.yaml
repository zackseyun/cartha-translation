    issue: Ang “hindi pa dumarating ang Espiritu” ay nagdaragdag ng konseptong pagdating.
    rationale: Walang katumbas na “dumarating” sa οὔπω γὰρ ἦν πνεῦμα. Ang dagdag na ito ay naglilinaw sa paraang hindi ginawa ng pinagmulan at binabago ang aspekto ng sugnay.
  - severity: low
    issue: Ang “mga sumasampalataya” ay pangkasalukuyan samantalang aorist ang πιστεύσαντες.
    rationale: Bagaman maaaring gamitin nang pang-uri ang participle, mas tuwiran at natural dito ang “mga sumampalataya,” lalo na kaugnay ng inaasahang pagtanggap.
  - severity: low
    issue: Ang “hindi pa niluluwalhati” ay hindi pinakamalinaw na anyo para sa hindi pa nagaganap na passive event.
    rationale: Ang “hindi pa niluwalhati” ay mas natural na nagpapahiwatig na ang pagluluwalhati ay hindi pa nagaganap.
