id: JHN.7.39
reference: John 7:39
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τοῦτο δὲ εἶπεν περὶ τοῦ πνεύματος ⸀οὗ ἔμελλον λαμβάνειν οἱ ⸀πιστεύσαντες εἰς αὐτόν· οὔπω γὰρ ἦν ⸀πνεῦμα, ὅτι Ἰησοῦς ⸀οὐδέπω ἐδοξάσθη.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/039.yaml
  text: He said this about the Spirit[a], whom those who believed in him were about to receive; for the Spirit was not yet[b], because Jesus had not yet been glorified.
translation:
  language: tl
  text: Sinabi niya ito tungkol sa Espiritu, na tatanggapin ng mga sumampalataya sa kanya; sapagkat wala pa ang Espiritu[a], dahil hindi pa niluwalhati si Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal, maigsi ang Griyego: “sapagkat hindi pa [naroon] ang Espiritu.” Hindi nito tahasang tinutukoy kung ano ang ipinahihiwatig ng “wala pa”; maaari rin itong unawain na “hindi pa naipagkakaloob ang Espiritu.” Inuugnay ng pangungusap ang kalagayang ito sa hindi pa pagluluwalhati kay Jesus.'
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦ πνεύματος / πνεῦμα
  choice: Espiritu
  rationale: Sa konteksto, tumutukoy ito sa banal na Espiritung tatanggapin ng mga mananampalataya. Hindi idinagdag ang “Banal” sapagkat walang ἅγιον sa Griyego.
- source_word: οὗ
  choice: na
  rationale: Ang panghalip na panao ay tumutukoy sa Espiritu; natural sa Tagalog ang pang-ugnay na “na” sa sugnay na “na tatanggapin.”
- source_word: ἔμελλον λαμβάνειν
  choice: tatanggapin
  rationale: Ipinahahayag ng μέλλω kasama ng pawatas ang inaasahang pagtanggap sa hinaharap. Mas natural sa Tagalog ang payak na aspektong kontemplatibo kaysa literal na “malapit nang tanggapin,” na maaaring magbigay ng sobrang diin sa agarang panahon.
- source_word: πιστεύσαντες εἰς αὐτόν
  choice: mga sumasampalataya sa kanya
  rationale: Ang “sumasampalataya sa kanya” ay natural at malinaw na katumbas ng karaniwang Juaninong pariralang πιστεύω εἰς. Hindi pinilit ang nakaraang aspektong “mga sumampalataya” sapagkat maaaring ipahiwatig ng participle ang uri ng mga taong tatanggap.
- source_word: οὔπω γὰρ ἦν πνεῦμα
  choice: sapagkat hindi pa dumarating ang Espiritu
  rationale: Ang hubad na “hindi pa ang Espiritu” ay hindi mabubuong pangungusap sa Tagalog. Ang “hindi pa dumarating” ay nagpapahiwatig ng hindi pa nagaganap na natatanging pagdating/pagkakaloob ng Espiritu nang hindi sinasabing hindi pa siya umiiral; inilalagay sa talababa ang literal na tensiyon at ang alternatibong “naipagkakaloob.”
- source_word: ἐδοξάσθη
  choice: niluluwalhati
  rationale: Pinananatili nito ang mahalagang terminong Juanino na “luwalhatiin” at ang balintiyak na anyo.
theological_decisions:
- issue: Paano isasalin ang οὔπω γὰρ ἦν πνεῦμα nang hindi ipinahihiwatig na hindi pa umiiral ang Espiritu bago luwalhatiin si Jesus.
  choice: “hindi pa dumarating ang Espiritu” sa pangunahing teksto, na may talababa sa mas literal at sa interpretibong alternatibo
  alternative: “hindi pa naipagkakaloob ang Espiritu” o ang napakalapit ngunit hindi likas na “hindi pa ang Espiritu”
  rationale: Hindi maaaring tumbasan nang maayos sa natural na Tagalog ang literal na sugnay na “the Spirit was not yet.” Ang “dumarating” ay nag-iingat sa kaugnayan nito sa hindi pa nagaganap na pagluluwalhati kay Jesus at umiiwas sa ontolohikal na pahiwatig, habang tahasang inilalahad ng talababa na walang pandiwang “dumating” o “ipagkaloob” sa Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at madaling maunawaan. Ginamit ang “Espiritu” sa halip na “Banal na Espiritu” upang hindi magdagdag ng salitang wala sa Griyego. Isang talababa lamang ang ginamit, at ang marker na [a] ay nasa pangunahing teksto.
