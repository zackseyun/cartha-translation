translation:
  language: tl
  text: At[a] umuwi ang bawat isa sa kani-kaniyang tahanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang talatang ito ang pasimula ng salaysay tungkol sa babaeng nahuling nangangalunya (Juan 7:53–8:11). Wala ang buong bahaging ito sa mga pinakamaagang manuskritong Griyego, kabilang ang mga papiro mula noong ikatlong siglo at ang Codex Sinaiticus at Codex Vaticanus mula noong ikaapat na siglo, gayundin sa mga sinaunang saling Coptic at Syriac. Matatagpuan naman ito sa Codex Bezae mula noong ikalimang siglo, sa tradisyong Latin, at sa mas huling tradisyong Byzantine na sinusunod ng nakararaming manuskrito. Sa ilang manuskrito, nasa ibang bahagi ang salaysay—halimbawa, pagkatapos ng Juan 21:25 o Lucas 21:38—na nagpapahiwatig na dati itong isang hiwalay na tradisyong pasalita na kalauna’y naisama sa daloy ng teksto. Pinanatili ito rito dahil sa malalim na pagpapahalaga rito sa teolohiya at pangangalagang pastoral sa loob ng humigit-kumulang 1,500 taon ng pagbasa ng mga Kristiyano.
    reason: textual_critical
lexical_decisions:
- source_word: Καί
  choice: At
  rationale: Pinananatili ang payak na pang-ugnay na nagdurugtong sa talata sa naunang salaysay.
- source_word: ἐπορεύθη
  choice: umuwi
  rationale: Bagaman pangkalahatang pandiwa ito ng pagpunta, nililinaw ng pariralang εἰς τὸν οἶκον αὐτοῦ na ang kilos ay pag-uwi.
- source_word: ἕκαστος
  choice: ang bawat isa
  rationale: 'Pinananatili ang distributibong diin: isa-isa silang umalis patungo sa sariling tahanan.'
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: sa kani-kaniyang tahanan
  rationale: Likas na salin sa modernong Filipino ng idyomang nangangahulugang pagpunta ng bawat isa sa sarili niyang tahanan.
theological_decisions:
- issue: Katayuang tekstuwal ng Juan 7:53–8:11
  choice: Panatilihin ang talata sa pangunahing teksto at ipaliwanag ang ebidensiyang manuskrito sa talababa.
  alternative: Alisin o ilagay lamang sa talababa o panaklong ang buong salaysay.
  rationale: Kasama ang talata sa itinakdang Byzantine source edition, ngunit mahalagang ipabatid nang malinaw na wala ang buong yunit sa mga pinakamaagang manuskritong Griyego at na iba-iba ang kinalalagyan nito sa ilang saksi.
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang “umuwi” at “kani-kaniyang tahanan” upang maging natural ang idyomang Griyego habang pinananatili ang diing distributibo ng ἕκαστος.
