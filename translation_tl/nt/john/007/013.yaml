  text: οὐδεὶς μέντοι παρρησίᾳ ἐλάλει περὶ αὐτοῦ διὰ τὸν φόβον τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/013.yaml
  text: Yet no one was speaking openly about him for fear of the Jews[a].
translation:
  language: tl
  text: Gayunman, walang nagsasalita nang hayagan tungkol sa kanya dahil sa takot sa mga Judio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa kontekstong ito, maaaring mas tiyak na tumukoy ang “mga Judio” sa mga pinunong Judio o sa mga awtoridad sa Judea. Sa Ebanghelyo ni Juan, maaaring tumukoy ang katawagang ito sa mga Judio sa pangkalahatan o, sa ilang talata, sa mga awtoridad na nakabase sa Jerusalem at sumasalungat kay Jesus.
    reason: Pinananatili ang saklaw ng orihinal na katawagan habang ipinapaliwanag ang malamang na kontekstuwal na kahulugan at iniiwasan ang mapanlinlang na paglalahat.
lexical_decisions:
- source_word: οὐδεὶς
  choice: walang
  rationale: Likas at komprehensibong negatibong pananalita sa Filipino para sa ‘no one’; kasama ng pandiwang ‘nagsasalita’ ay malinaw na walang sinuman ang gumagawa nito.
- source_word: μέντοι
  choice: Gayunman
  rationale: Ipinahahayag ang banayad na pagsalungat sa naunang magkakaibang usapan tungkol kay Jesus, sa marangal ngunit kasalukuyang Filipino.
- source_word: παρρησίᾳ
  choice: nang hayagan
  rationale: Tumutukoy rito sa pagsasalitang lantad at hindi palihim; hindi kailangang idagdag ang diwa ng katapangan kung hindi tiyak na iyon ang pangunahing diin.
- source_word: ἐλάλει
  choice: nagsasalita
  rationale: Pinananatili ng aspektong imperpektibo ng pandiwang Filipino ang nagpapatuloy o karaniwang pagkilos sa tagpong isinasalaysay.
- source_word: περὶ αὐτοῦ
  choice: tungkol sa kanya
  rationale: Natural at tuwirang katumbas ng περί na may genitive sa modernong Filipino.
- source_word: διὰ τὸν φόβον
  choice: dahil sa takot
  rationale: Pinananatili ang nominal na pahayag ng sanhi sa Griyego at malinaw na inuugnay ang pananahimik sa takot.
- source_word: τῶν Ἰουδαίων
  choice: sa mga Judio
  rationale: Tuwirang pinananatili ang malawak at maaaring magbago-bagong katawagan ni Juan, habang nililinaw sa talababa ang malamang na mas tiyak na tinutukoy sa kontekstong ito.
theological_decisions:
- issue: Ang tinutukoy ng τῶν Ἰουδαίων sa salaysay ni Juan
  choice: mga Judio sa pangunahing teksto, na may talababa tungkol sa posibleng mas tiyak na pagtukoy sa mga pinunong Judio o mga awtoridad sa Judea
  alternative: mga pinunong Judio; mga awtoridad sa Judea
  rationale: Pinananatili nito ang tunay na lawak at kontekstuwal na pag-iiba ng katawagan sa Griyego nang hindi agad nililimitahan ang kahulugan. Tumutulong ang talababa na maiwasan ang anakronistiko o laban-sa-mga-Judiong pagbasa, lalo na sapagkat si Jesus at ang karamihan sa mga tauhan sa salaysay ay mga Judio rin.
translation_notes:
  register: Modernong Filipino na malinaw, natural, at marangal. Ginamit ang “Gayunman” para sa mahinahong kontrast at “nang hayagan” para sa lantad na pagsasalita. Hindi pinalitan sa pangunahing teksto ang “mga Judio” ng isang mas makitid na interpretasyon; inilagay ang paglilinaw sa talababa.
