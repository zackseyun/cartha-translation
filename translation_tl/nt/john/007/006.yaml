id: JHN.7.6
reference: John 7:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: λέγει οὖν αὐτοῖς ὁ Ἰησοῦς· Ὁ καιρὸς ὁ ἐμὸς οὔπω πάρεστιν, ὁ δὲ καιρὸς ὁ ὑμέτερος πάντοτέ ἐστιν ἕτοιμος.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/006.yaml
  text: So Jesus said to them[a], “My time has not yet come, but your time is always ready.”
translation:
  language: tl
  text: Kaya sinabi sa kanila ni Jesus, “Hindi pa dumarating ang panahon ko[a], ngunit ang panahon ninyo ay laging handa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Hindi pa dumarating ang itinakdang panahon para sa akin.” Ang salitang Griyego ay maaaring tumukoy sa angkop o itinakdang panahon, hindi lamang sa panahon sa pangkalahatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Ipinapakita ang lohikal at pasalaysay na kaugnayan sa naunang sinabi nang natural sa makabagong Filipino.
- source_word: λέγει ... ὁ Ἰησοῦς
  choice: sinabi ... ni Jesus
  rationale: Bagaman nasa pangkasalukuyang anyo ang pandiwang Griyego bilang historical present, natural sa salaysay na Filipino ang pangnagdaan.
- source_word: αὐτοῖς
  choice: sa kanila
  rationale: Tuwirang ipinapahayag ang di-tuwirang layon nang hindi nagdaragdag ng pagkakakilanlang wala sa mismong talata.
- source_word: καιρός
  choice: panahon
  rationale: Maaaring tumukoy sa angkop o itinakdang pagkakataon, hindi lamang sa oras sa pangkalahatan. Pinananatili ng “panahon” ang lawak ng kahulugan at ang pagtutulad ng dalawang sugnay.
- source_word: ὁ καιρὸς ὁ ἐμός
  choice: ang panahon ko
  rationale: Natural na Filipino na nagpapanatili sa mariing pagmamay-ari at hindi pinapalitan ang καιρός ng “oras,” na maaaring magmukhang katumbas ng ὥρα.
- source_word: οὔπω πάρεστιν
  choice: Hindi pa dumarating
  rationale: Likas na temporal na pahayag sa Filipino para sa literal na diwang “hindi pa naririto/naroroon.”
- source_word: δὲ
  choice: ngunit
  rationale: Malinaw na pinananatili ang pagsalungat sa panahon ni Jesus at sa panahon ng kanyang mga kausap.
- source_word: ὁ καιρὸς ὁ ὑμέτερος
  choice: ang panahon ninyo
  rationale: Pinananatili ang simetrikong kaibahan sa “ang panahon ko” at ang maramihang panghalip.
- source_word: πάντοτέ
  choice: lagi
  rationale: Tuwirang katumbas ng kahulugang “sa lahat ng panahon.”
- source_word: ἕτοιμος
  choice: handa
  rationale: Pinananatili ang karaniwang kahulugan na “handa” at ang kapansin-pansing paglalarawan sa panahon, sa halip na tahimik itong ipakahulugang “angkop” o “malaya.”
theological_decisions:
- issue: Kahulugan ng “panahon” ni Jesus sa konteksto ng Juan
  choice: “ang panahon ko,” nang walang pagpapalawak sa pangunahing teksto
  alternative: “ang itinakdang panahon para sa akin” o “ang oras ko”
  rationale: Ginagamit dito ang καιρός, hindi ὥρα. Maaaring may teolohikal na bigat ang takdang panahon ng misyon ni Jesus, ngunit hindi ito tahasang nililinaw ng talata; kaya pinananatili ang tensiyon at inilalagay sa talababa ang mas hayag na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang magkatulad na hulma ng “panahon ko” at “panahon ninyo,” pati ang bahagyang di-karaniwang larawang ang panahon ay “handa,” upang hindi labis na ipaliwanag ang pahayag.
