source:
  edition: SBLGNT
  text: ⸀οὐχ ἡ γραφὴ εἶπεν ὅτι ἐκ τοῦ σπέρματος Δαυίδ, καὶ ἀπὸ Βηθλέεμ τῆς κώμης ὅπου ἦν Δαυίδ, ⸂ἔρχεται ὁ χριστός⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/042.yaml
  text: Has not the Scripture said that the Messiah comes from the offspring of David and from Bethlehem[a], the village where David was?
translation:
  language: tl
  text: Hindi ba sinabi ng Kasulatan na ang Mesiyas[a] ay nagmumula sa lahi ni David at sa Betlehem, ang nayon kung saan naroon si David?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang Cristo.” Ang titulong Griyego ay ὁ χριστός.
    reason: alternative_reading
lexical_decisions:
- source_word: ἡ γραφή
  choice: ang Kasulatan
  rationale: Tumutukoy ito sa kinikilalang banal at may-awtoridad na kasulatan; natural at marangal sa modernong Tagalog ang “ang Kasulatan.”
- source_word: εἶπεν
  choice: sinasabi
  rationale: Bagaman aorist ang Griyego, ang kasalukuyang panahunan ay natural sa retorikal na tanong at nagpapahayag ng nananatiling patotoo ng Kasulatan.
- source_word: ἐκ τοῦ σπέρματος Δαυίδ
  choice: sa lahi ni David
  rationale: Ang σπέρμα rito ay tumutukoy sa angkan o salinlahi, hindi sa literal na binhi. Malinaw at likas sa Tagalog ang “lahi ni David.”
- source_word: ἀπὸ Βηθλέεμ
  choice: sa Betlehem
  rationale: Ipinapahayag ng ἀπό ang lugar na pinagmulan; sa konstruksyong “nagmumula sa,” natural ang “sa Betlehem.”
- source_word: τῆς κώμης
  choice: ang nayon
  rationale: Ang κώμη ay maliit na pamayanan o nayon; mas tiyak ito kaysa “bayan.”
- source_word: ὅπου ἦν Δαυίδ
  choice: pinagmulan ni David
  rationale: Literal itong “kung saan naroon si David,” ngunit sa konteksto ng pinagmulan ng Mesiyas at Betlehem, ipinahahayag sa natural na Tagalog ang kaugnayan ni David sa nayon nang hindi nililimitahan ito sa paninirahan lamang.
- source_word: ἔρχεται
  choice: nagmumula
  rationale: Sa konteksto, tumutukoy ang pandiwa sa inaasahang pinagmulan ng Mesiyas; mas malinaw at natural ang “nagmumula” kaysa literal na “dumarating.”
- source_word: ὁ χριστός
  choice: ang Mesiyas
  rationale: Gumaganap ang Χριστός bilang titulong Judio para sa inaasahang pinahirang hari at tagapagligtas, kaya isinalin bilang “Mesiyas” sa halip na gamiting parang pangalang pantangi.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστός bilang titulo
  choice: ang Mesiyas
  alternative: ang Cristo
  rationale: Sa talakayang ito tungkol sa pinagmulan ng inaasahang pinahiran, malinaw na titulo ang ὁ χριστός. Pinananatili ng “Mesiyas” ang kontekstong Judio at hindi ito ginagawang tila personal na pangalan.
- issue: Kahulugan ng ὅπου ἦν Δαυίδ
  choice: pinagmulan ni David
  alternative: kung saan naroon si David
  rationale: Hindi tahasang sinasabi ng Griyego kung ipinanganak, nanirahan, o nagmula roon si David. Ang “pinagmulan” ay akma sa konteksto at hindi pinipili ang mas makitid na “ipinanganak” o “nanirahan.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “Hindi ba sinasabi” upang mapanatili ang retorikal na tanong na umaasang sasang-ayon ang kausap.
