  verdict: revise
  source_fidelity: Ang “lahi ni David,” “nagmumula,” “Betlehem,” at “Mesiyas” ay wastong naghahatid ng pangunahing kahulugan ng Griyego. Gayunman, ang “pinagmulan ni David” para sa ὅπου ἦν Δαυίδ ay nagpapasok ng mas tiyak na ideya ng pinanggalingan na wala sa teksto; ang Griyego ay payak na nagsasabing “kung saan naroon si David.”
  naturalness: Malinaw at angkop sa modernong Filipino Tagalog ang pangungusap. Ang “ang nayon kung saan naroon si David” ay likas pa rin at mas tapat sa pinagmulan kaysa “ang nayong pinagmulan ni David.”
  terminology: Ang “Kasulatan” ay angkop para sa ἡ γραφή, at “Mesiyas” ay angkop para sa ὁ χριστός bilang titulo sa kontekstong ito. Ang talababa na nag-aalok ng “ang Cristo” ay wastong alternatibong salin.
  issues:
