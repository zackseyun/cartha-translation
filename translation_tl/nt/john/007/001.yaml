id: JHN.7.1
reference: John 7:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ⸂μετὰ ταῦτα περιεπάτει ὁ Ἰησοῦς⸃ ἐν τῇ Γαλιλαίᾳ, οὐ γὰρ ἤθελεν ἐν τῇ Ἰουδαίᾳ περιπατεῖν, ὅτι ἐζήτουν αὐτὸν οἱ Ἰουδαῖοι ἀποκτεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/001.yaml
  text: And after these things Jesus was walking in Galilee[a], for he did not want to walk in Judea, because the Jews were seeking to kill him.
translation:
  language: tl
  text: Pagkatapos ng mga bagay na ito, naglilibot si Jesus sa Galilea, sapagkat ayaw niyang maglibot sa Judea dahil hinahanap siya ng mga Judio[a] upang patayin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga taga-Judea” o “mga pinunong Judio.” Sa Juan, ang “mga Judio” ay madalas tumukoy nang mas tiyak sa mga Judiong awtoridad sa Judea o sa mga kumakalaban kay Jesus sa konteksto ng salaysay, hindi sa buong bayang Judio.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: pagkatapos ng mga bagay na ito
  rationale: Pinananatili ang pangmaramihang demonstratibo at ang malinaw na ugnayang kronolohikal sa naunang salaysay.
- source_word: περιεπάτει / περιπατεῖν
  choice: naglibot / maglibot
  rationale: Ipinapahayag ang patuloy na pagkilos sa loob ng isang rehiyon at pinananatili ang pag-uulit ng iisang pandiwang Griyego sa natural na Tagalog.
- source_word: ἐν τῇ Γαλιλαίᾳ / ἐν τῇ Ἰουδαίᾳ
  choice: sa Galilea / sa Judea
  rationale: Payak at karaniwang lokatibong salin na hindi nagpapalawak sa saklaw ng kilos.
- source_word: οὐ γὰρ ἤθελεν
  choice: Ayaw niyang
  rationale: Natural na modernong Tagalog na nagpapahayag ng kawalan ng pagnanais, hindi ng kawalan ng kakayahan; ang paliwanag na dala ng γάρ ay malinaw sa pagkakasunod ng mga pangungusap.
- source_word: ὅτι
  choice: dahil
  rationale: Malinaw na nagpapakilala sa dahilan ng pag-iwas ni Jesus sa Judea.
- source_word: ἐζήτουν
  choice: naghahanap ng pagkakataon
  rationale: Sa konstruksyong may infinitibong ἀποκτεῖναι, ipinahihiwatig nito ang patuloy na hangaring maisagawa ang pagpatay; mas natural ito sa Tagalog kaysa sa literal na ‘hinahanap siya upang patayin.’
- source_word: οἱ Ἰουδαῖοι
  choice: ang mga Judio
  rationale: Pinananatili ang pormal na katawagan ng tekstong Griyego, habang nililinaw sa talababa ang mas tiyak na kontekstuwal na saklaw nito sa salaysay ni Juan.
- source_word: ἀποκτεῖναι
  choice: na patayin siya
  rationale: Tuwiran at natural na salin ng infinitibo at ng layon nito.
theological_decisions:
- issue: Tinutukoy ng οἱ Ἰουδαῖοι sa salaysay ni Juan
  choice: Panatilihin sa pangunahing teksto ang ‘mga Judio,’ na may talababa tungkol sa kontekstuwal na kahulugan.
  alternative: ‘mga taga-Judea’ o ‘mga pinunong Judio’
  rationale: Iniiwasang ipakahulugan na hinahatulan ang buong bayang Judio, ngunit hindi rin tahimik na nililimitahan ang isang katawagang may tunay na saklaw na maaaring nakasalalay sa konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘naglibot’ upang maging natural ang rehiyonal at patuloy na kilos ng περιπατέω, habang pinananatili ang pag-uulit nito sa dalawang sugnay. Ang marker na [a] ay nasa mismong pangunahing teksto.
