  naturalness: Natural at malinaw sa makabagong Filipino ang “naglilibot ... sapagkat ayaw niyang maglibot ... dahil hinahanap siya ... upang patayin.” Napananatili rin nito ang pag-uulit ng περιπατέω nang hindi nagiging pilit.
