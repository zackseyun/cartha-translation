base_translation:
  language: en
  yaml_path: translation/nt/john/007/002.yaml
  text: The Jewish feast[a], the Feast of Tabernacles, was near.
translation:
  language: tl
  text: Malapit na ang kapistahan ng mga Judio, ang Kapistahan ng mga Kubol.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tinatawag ding “Kapistahan ng mga Tabernakulo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: noon
  rationale: Ginamit bilang banayad na panandang nag-uugnay sa salaysay. Sa Filipino, ang “noon” sa loob ng pangungusap ay likas na naghahatid ng paglipat sa kalagayan ng salaysay nang hindi nagpapahiwatig ng mariing pagsalungat.
- source_word: ἐγγὺς
  choice: Malapit na
  rationale: Malinaw at likas na nagpapahayag ng pagiging nalalapit sa panahon.
- source_word: ἑορτὴ
  choice: kapistahan
  rationale: Karaniwang salitang Filipino para sa isang itinakdang pagdiriwang na panrelihiyon at angkop sa kontekstong Judio.
- source_word: τῶν Ἰουδαίων
  choice: ng mga Judio
  rationale: Tuwirang pinananatili ang anyong genitibo at kinikilala ang kapistahan bilang pagdiriwang ng mga Judio, nang walang pahiwatig na polemikal.
- source_word: σκηνοπηγία
  choice: Kapistahan ng mga Kubol
  rationale: Ipinapahayag ang literal at makasaysayang diwa ng pansamantalang mga silungan, at mas madaling maunawaan sa modernong Filipino kaysa sa hiram na “Tabernakulo.”
theological_decisions:
- issue: Paglalarawan sa ἑορτὴ bilang τῶν Ἰουδαίων
  choice: kapistahan ng mga Judio
  alternative: kapistahang Judio
  rationale: Ang parirala ay tumutukoy sa pagkakakilanlan ng kapistahan, hindi isang polemikang pahayag tungkol sa mga Judio. Pinananatili ng napiling anyo ang ugnayang genitibo ng Griyego.
- issue: Pangalan ng σκηνοπηγία
  choice: Kapistahan ng mga Kubol
  alternative: Kapistahan ng mga Tabernakulo
  rationale: Ang “mga Kubol” ay malinaw na naglalarawan sa pansamantalang mga silungang kaugnay ng kapistahan at mas tuwirang kumakatawan sa leksikal na diwa ng Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “Judio” at “Kapistahan ng mga Kubol” bilang mga salitang madaling maunawaan habang nananatiling malapit sa tekstong Griyego.
