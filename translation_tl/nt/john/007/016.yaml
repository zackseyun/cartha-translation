  text: So Jesus answered them[a], “My teaching is not mine, but his who sent me.”
translation:
  language: tl
  text: Kaya sumagot sa kanila si Jesus, “Ang turo ko ay hindi nagmumula sa akin kundi sa nagsugo sa akin.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Ang turo ko ay hindi akin, kundi sa nagsugo sa akin.” Maaaring ipahiwatig ng pananalitang Griyego ang pinagmulan o ang pag-aari ng turo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη οὖν αὐτοῖς ὁ Ἰησοῦς καὶ εἶπεν
  choice: Kaya sumagot sa kanila si Jesus
  rationale: Pinananatili ng “Kaya” ang ugnayang ipinahihiwatig ng οὖν sa naunang usapan. Likas sa makabagong Tagalog na katawanin sa “sumagot” ang pinagsamang ἀπεκρίθη at καὶ εἶπεν nang hindi nawawala ang pagpapakilala sa tuwirang sinabi.
- source_word: Ἡ ἐμὴ διδαχή
  choice: Ang turo ko
  rationale: Ang “turo” ay malinaw, karaniwan, at hindi kasing-teknikal ng “doktrina.” Pinananatili ng “ko” ang diin ng ἐμή sa kaibahan ng susunod na sugnay.
- source_word: οὐκ ἔστιν ἐμὴ
  choice: ay hindi sa akin
  rationale: Malapit at maikli itong katumbas na nagpapanatili sa maaaring diwa ng pag-aari o pinagmulan, sa halip na pumili agad ng isa lamang.
- source_word: ἀλλὰ τοῦ πέμψαντός με
  choice: kundi sa nagsugo sa akin
  rationale: Ang “nagsugo” ay natural na salin ng πέμψαντός at ang pariralang “sa nagsugo sa akin” ay nagpapanatili sa maikling paghahambing at sa lawak ng kahulugan ng genitibo.
theological_decisions:
- issue: Kaugnayan ng turo ni Jesus sa nagsugo sa kanya
  choice: Pinanatili ang pahayag na ang turo ay hindi “sa akin” kundi “sa nagsugo sa akin,” nang hindi dinaragdagan ng paliwanag tungkol sa kalikasan o awtoridad ni Jesus.
  alternative: Gawing tahasan na “hindi nagmula sa akin” lamang o “hindi ko pag-aari” lamang.
  rationale: Maaaring magpahiwatig ang genitibong Griyego ng pinagmulan at pag-aari. Ang salin ay nagpapanatili sa pagkakaiba ni Jesus at ng nagsugo sa kanya at sa pagkakaisa ng kanilang misyon, nang hindi nilulutas sa teksto ang teolohikal na tensiyong hindi nito tahasang ipinaliliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “turo” sa halip na mas teknikal na “doktrina,” at pinanatili ang bahagyang maigting na anyong “hindi sa akin, kundi sa…” upang maingatan ang tunay na ambiguwidad ng Griyego.
