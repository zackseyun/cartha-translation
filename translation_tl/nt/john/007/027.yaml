id: JHN.7.27
reference: John 7:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀλλὰ τοῦτον οἴδαμεν πόθεν ἐστίν· ὁ δὲ χριστὸς ὅταν ἔρχηται οὐδεὶς γινώσκει πόθεν ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/027.yaml
  text: But we know where this man is from; but when the Messiah comes[a], no one knows where he is from.
translation:
  language: tl
  text: Ngunit alam natin kung taga-saan ang taong ito. Pero kapag dumating ang Mesiyas, walang sinumang nakaaalam kung taga-saan siya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ngunit
  rationale: Likas at marangal na panandang pagsalungat sa naunang usapan.
- source_word: τοῦτον
  choice: ang taong ito
  rationale: Tuwirang tumutukoy kay Jesus at pinananatili ang bahagyang matulis na diin ng demonstratibo.
- source_word: οἴδαμεν
  choice: alam natin
  rationale: Karaniwang makabagong Tagalog para sa kaalamang taglay ng mga nagsasalita.
- source_word: πόθεν ἐστίν
  choice: kung taga-saan ... / kung taga-saan siya
  rationale: Ipinahahayag ang pinagmulan sa natural na Tagalog at pinananatili ang pag-uulit sa dalawang sugnay.
- source_word: ὁ δὲ χριστός
  choice: Pero ... ang Mesiyas
  rationale: Ang δέ ay nagpapatuloy ng pagsalungat, at ang χριστός ay titulo ng inaasahang Mesiyas sa kontekstong Judio.
- source_word: ὅταν ἔρχηται
  choice: kapag dumating
  rationale: Ang ὅταν na may subjunctive ay tumutukoy sa di-tiyak ngunit inaasahang pangyayari sa hinaharap; natural dito ang “kapag.”
- source_word: οὐδεὶς γινώσκει
  choice: walang sinumang nakaaalam
  rationale: Malinaw at dignified na salin ng pangkalahatang pagkakaila; ang “nakaaalam” ay angkop sa pormal ngunit kasalukuyang rehistro.
theological_decisions:
- issue: Pagkasalin sa Χριστός bilang titulo
  choice: Mesiyas
  alternative: Cristo
  rationale: Dito, ang χριστός ay ang titulong tumutukoy sa inaasahang mesiyanikong persona, hindi pangalang pantangi.
- issue: Pahayag ng mga tao tungkol sa pinagmulan ng Mesiyas
  choice: Isinalin nang tuwiran bilang pahayag nila, nang walang paliwanag na idinagdag
  alternative: Palawakin upang ipaliwanag kung ano ang paniniwala nila tungkol sa pinagmulan ng Mesiyas
  rationale: Iniulat ng talata ang kanilang pagkaunawa o palagay; hindi ito dapat tahimik na sang-ayunan, ituwid, o lutasin sa mismong salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino Tagalog. Ginamit ang “taga-saan” upang natural na ipahayag ang pinagmulan at mapanatili ang magkatulad na anyo ng dalawang πόθεν ἐστίν. Walang talababa sapagkat hindi kailangan upang katawanin ang tunay na ambiguwidad ng Griyego.
