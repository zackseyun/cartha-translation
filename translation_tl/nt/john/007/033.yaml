source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς· Ἔτι ⸂χρόνον μικρὸν⸃ μεθ’ ὑμῶν εἰμι καὶ ὑπάγω πρὸς τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/033.yaml
  text: So Jesus said[a], “I am with you a little while longer[b], and I am going to the one who sent me.”
translation:
  language: tl
  text: Kaya sinabi ni Jesus, “Kasama pa ninyo ako sa maikling panahon[a], at pupunta ako sa nagsugo sa akin.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sandali pa.”
    reason: lexical_alternative
  - marker: b
    text: Sa mas malawak na konteksto ng Juan, ang “nagsugo sa akin” ay tumutukoy sa Ama.
    reason: cross_reference
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Ipinahihiwatig nito ang lohikal at pasalaysay na pagpapatuloy mula sa naunang usapan; natural sa makabagong Tagalog ang “Kaya.”
- source_word: Ἔτι χρόνον μικρόν
  choice: nang kaunting panahon
  rationale: Kasama ng “pa” sa pandiwang parirala, naipapahayag nito kapwa ang maikling tagal at ang panahong nalalabi.
- source_word: μεθ’ ὑμῶν εἰμι
  choice: Makakasama pa ninyo ako
  rationale: Natural na Tagalog ito para sa patuloy ngunit panandaliang presensiya ni Jesus sa kaniyang mga kausap. Ginagamit ang anyong panghinaharap dahil idiomatiko ito sa Tagalog para sa nalalabing panahon, bagaman pangkasalukuyan ang anyo sa Griyego.
- source_word: καὶ ὑπάγω
  choice: at pupunta ako
  rationale: Pinananatili ang payak na diwa ng pagpunta o pag-alis, nang hindi nagdaragdag ng “pagkatapos,” na hindi tahasang nasa Griyego.
- source_word: πρὸς τὸν πέμψαντά με
  choice: sa nagsugo sa akin
  rationale: Likas at maikli nitong isinasalin ang substantibong participle na “ang nagsugo sa akin” nang hindi tahasang pinapangalanan ang tinutukoy.
theological_decisions:
- issue: Pagkakakilanlan ng “nagsugo sa akin”
  choice: Panatilihin sa pangunahing teksto ang di-tahasang pananalitang “sa nagsugo sa akin.”
  alternative: “sa Ama na nagsugo sa akin”
  rationale: Sa mas malawak na konteksto ng Juan, ang tinutukoy ay ang Ama, ngunit hindi siya tahasang pinangalanan sa talatang Griyego. Pinananatili ng salin ang paraan ng pagpapahayag ng orihinal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ninyo” para sa maramihang ὑμῶν at iniwasan ang labis na pormal o denominasyonal na pananalita.
