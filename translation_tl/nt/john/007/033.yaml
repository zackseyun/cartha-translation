  terminology: Ang “nagsugo sa akin” ay wastong katumbas ng articular participle na τὸν πέμψαντά με at nararapat panatilihing hindi tahasang pinapangalanan sa pangunahing teksto. Ang paliwanag tungkol sa Ama ay angkop sa talababa, hindi sa teksto.
