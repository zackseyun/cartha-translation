  source_fidelity: Ang “Makakasama pa ninyo ako” ay maaaring unawain bilang panghinaharap na kakayahan o pagkakataon ng mga kausap na makasama si Jesus. Samantalang pangkasalukuyan ang μεθ’ ὑμῶν εἰμι at tuwirang nagsasaad ng kasalukuyan ngunit nalalabing presensiya niya. Ang “Kasama pa ninyo ako” ay mas tapat sa aspekto at diwa ng Griyego. Ang “Kaya,” “at,” at “pupunta ako sa nagsugo sa akin” ay wastong naghahatid ng οὖν, καί, at ὑπάγω πρὸς τὸν πέμψαντά με nang walang dagdag na pagpapakahulugan.
