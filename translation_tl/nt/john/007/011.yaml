id: JHN.7.11
reference: John 7:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἱ οὖν Ἰουδαῖοι ἐζήτουν αὐτὸν ἐν τῇ ἑορτῇ καὶ ἔλεγον· Ποῦ ἐστιν ἐκεῖνος;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/011.yaml
  text: So the Jews were looking for him at the feast and were saying[a], “Where is that one?”
translation:
  language: tl
  text: Kaya hinahanap siya ng mga Judio[a] sa kapistahan at sinasabi nila, “Nasaan ang taong iyon?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga taga-Judea”; sa konteksto ng salaysay ni Juan, maaaring mas tiyak itong tumukoy sa mga pinunong Judio sa Judea.
    reason: Pinananatili ang posibleng saklaw ng Ἰουδαῖοι nang hindi nilulutas sa pangunahing teksto ang tunay na kalabuan nito.
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Ipinahihiwatig ang pagpapatuloy at bunga ng naunang salaysay sa natural na paraan sa Filipino.
- source_word: Ἰουδαῖοι
  choice: mga Judio
  rationale: Pinananatili ang malawak at tuwirang kahulugan ng salita nang hindi agad nililimitahan sa mga pinuno o mga taga-Judea; inilalahad sa talababa ang posibleng mas tiyak na kahulugan ayon sa konteksto.
- source_word: ἐζήτουν
  choice: hinahanap siya
  rationale: Ang aspektong imperpektibo ay nagpapahiwatig ng nagpapatuloy na paghahanap; natural itong naipahahayag sa Filipino sa anyong “hinahanap.”
- source_word: ἐν τῇ ἑορτῇ
  choice: sa kapistahan
  rationale: Tumutukoy sa kapistahang nabanggit na sa konteksto at maaaring saklawin ang pagdalo at panahon ng pagdiriwang.
- source_word: ἔλεγον
  choice: sinasabi nila
  rationale: Pinananatili ang nagpapatuloy o paulit-ulit na diwa ng imperpektibong pandiwa.
- source_word: ἐκεῖνος
  choice: ang taong iyon
  rationale: Natural sa Filipino at pinananatili ang distansiyang ipinahihiwatig ng demonstratibong ἐκεῖνος, sa halip na gawing payak na “siya.”
theological_decisions:
- issue: Ang tinutukoy ng Ἰουδαῖοι sa salaysay ni Juan
  choice: mga Judio
  alternative: mga taga-Judea; mga pinunong Judio
  rationale: Hindi tahasang nililimitahan ng talata ang tinutukoy sa isang mas makitid na pangkat. Kaya pinanatili sa pangunahing teksto ang tuwirang salin, habang inilalagay sa talababa ang mga posibilidad na nakabatay sa konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kapistahan” bilang pamilyar na terminong biblikal at ang “taong iyon” upang natural na maipakita ang distansiyang taglay ng demonstratibo.
