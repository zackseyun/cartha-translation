  source_fidelity: 'Tapat ang salin sa lahat ng pangunahing bahagi ng Griyego: ang mga ὑπηρέται ay sumagot, at ang mariing χρονikong pagtanggi ng Οὐδέποτε ay naipahayag nang likas sa “Wala pang.” Napananatili rin ang paraan ng οὕτως sa “nang ganito” at ang pang-isahang kumakatawang ἄνθρωπος sa “taong.”'
