  text: ἀπεκρίθησαν οἱ ὑπηρέται· Οὐδέποτε ⸂ἐλάλησεν οὕτως⸃ ⸀ἄνθρωπος.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/046.yaml
  text: The officers answered[a], “Never has a man spoken like this.”
translation:
  language: tl
  text: Sumagot ang mga bantay, “Wala pang taong[a] nagsalita nang ganito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Wala pang sinumang nagsalita nang ganito.” Pang-isahan ang salitang Griyego para sa “tao” ngunit ginagamit dito bilang kinatawan ng sinumang tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: Sumagot
  rationale: Karaniwang salaysay na katumbas ng aorist deponent na nangangahulugang ‘sumagot’ o ‘tumugon’; likas ang ‘Sumagot’ sa konteksto ng pag-uulat nila.
- source_word: οἱ ὑπηρέται
  choice: ang mga bantay
  rationale: Sa konteksto ng Juan 7:32, 45, sila ang mga tauhang isinugo upang dakpin si Jesus. Ipinahihiwatig ng ‘mga bantay’ ang kanilang tungkulin nang hindi ipinapalagay ang mas tiyak na katawagang ‘pulis ng templo.’
- source_word: Οὐδέποτε
  choice: Wala pang
  rationale: Sa Filipino, likas na ipinahahayag ng ‘wala pang’ ang diwa na hindi pa ito nangyari kailanman hanggang sa sandaling iyon.
- source_word: ἐλάλησεν
  choice: nagsalita
  rationale: Direkta at natural na katumbas ng aorist na pandiwa sa pangungusap na ito.
- source_word: οὕτως
  choice: nang ganito
  rationale: Ipinapahayag nito ang paraan ng pagsasalita, gaya ng diwa ng οὕτως.
- source_word: ἄνθρωπος
  choice: taong
  rationale: Pinananatili ang pang-isahang anyo ng Griyego. Ang ‘tao’ sa Filipino ay likas na maaaring tumukoy sa isang tao nang hindi nagdaragdag ng kasariang hindi kailangang tahasang tukuyin sa target na wika.
theological_decisions:
- issue: Ang pang-isahang kumakatawang gamit ng ἄνθρωπος
  choice: taong
  alternative: sinumang tao
  rationale: Pinananatili ng ‘taong’ ang pang-isahang anyo at pangkalahatang bisa ng Griyego. Ang ‘sinuman’ ay natural ding posibilidad ngunit bahagyang ginagawang mas tahasan ang diwang distributibo kaysa sa mismong anyo ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘mga bantay’ bilang madaling maunawaang katawagan sa mga opisyal na isinugo upang dakpin si Jesus; iniwasan ang mas interpretibong ‘mga pulis ng templo.’
