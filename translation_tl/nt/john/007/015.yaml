  text: ⸂ἐθαύμαζον οὖν⸃ οἱ Ἰουδαῖοι λέγοντες· Πῶς οὗτος γράμματα οἶδεν μὴ μεμαθηκώς;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/015.yaml
  text: So the Jews were marveling[a], saying[b], “How does this man know letters without having studied?”
translation:
  language: tl
  text: Kaya naman, namangha ang mga Judio[a] at sinabi nila, “Paano naging marunong ang taong ito gayong hindi naman siya nag-aral?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa kontekstong ito sa Ebanghelyo ni Juan, ang “mga Judio” ay tumutukoy sa mga Judiong kausap o sumasalungat kay Jesus sa Jerusalem, malamang kabilang ang mga awtoridad sa Judea—hindi sa buong bayang Judio.
    reason: cultural_note
lexical_decisions:
- source_word: ἐθαύμαζον
  choice: namangha
  rationale: Ipinahahayag ang matinding pagtataka ng mga nagsasalita. Bagaman imperfect ang anyo sa Griyego, likas na naipahihiwatig sa salaysay na nagpapatuloy ang kanilang reaksiyon nang sabihin nila ang kasunod na tanong.
- source_word: οὖν
  choice: Kaya
  rationale: Pinananatili ang ugnayang pasalaysay at lohikal sa naunang talata sa natural na modernong Tagalog.
- source_word: οἱ Ἰουδαῖοι
  choice: ang mga Judio
  rationale: Direktang pinananatili ang karaniwang katawagan sa Griyego, habang nililinaw sa talababa ang saklaw nito sa konteksto upang hindi ito mapagkamalang tumutukoy sa buong bayang Judio.
- source_word: λέγοντες
  choice: at sinabi nila
  rationale: Natural na Tagalog na pagpapakilala sa tuwirang sinabi ng maramihang simuno; naipapahayag nito ang tungkulin ng participle nang hindi pilit ang balangkas.
- source_word: Πῶς
  choice: Paano
  rationale: Tuwirang katumbas ng patanong tungkol sa paraan o pinagmulan ng kaalaman.
- source_word: οὗτος
  choice: ang taong ito
  rationale: Natural na pagtukoy sa isang lalaki at pinananatili ang bahagyang mapaglayong tono ng demonstrative nang hindi nagiging mapanlait.
- source_word: γράμματα οἶδεν
  choice: nagkaroon ng ganitong kaalaman
  rationale: Ang idyomang Griyego ay literal na ‘nakaaalam ng mga titik’ ngunit tumutukoy rito sa pagkatuto o kinikilalang kaalamang pampaaralan. Ang salin ay malinaw sa ordinaryong mambabasa at ang literal na anyo ay inilalagay sa talababa.
- source_word: μὴ μεμαθηκώς
  choice: gayong hindi naman siya nag-aral
  rationale: Ipinahahayag ang kawalan ng inaasahang pormal na pag-aaral o pagtuturo, nang hindi tinutukoy nang higit sa sinasabi ng teksto ang uri o institusyon ng pagsasanay.
theological_decisions:
- issue: Saklaw ng οἱ Ἰουδαῖοι sa Ebanghelyo ni Juan
  choice: ang mga Judio
  alternative: ang mga pinunong Judio; ang mga taga-Judea
  rationale: Pinananatili sa pangunahing teksto ang malawak na leksikal na katawagan sa Griyego at hindi ito tahimik na nililimitahan sa ‘mga pinuno.’ Gayunman, nililinaw ng talababa na sa kontekstong ito ang tinutukoy ay ang mga Judiong kausap o sumasalungat kay Jesus sa Jerusalem, malamang kabilang ang mga awtoridad, at hindi ang lahat ng Judio.
- issue: Kahulugan ng γράμματα οἶδεν
  choice: nagkaroon ng ganitong kaalaman
  alternative: nakaaalam ng mga titik; marunong sa mga kasulatan
  rationale: Ang parirala ay maaaring tumukoy sa pagkatuto, kaalamang pampanitikan, o kaalaman sa mga banal na kasulatan. Iniwasan ang tahasang ‘mga Kasulatan’ sa pangunahing teksto dahil mas makitid iyon kaysa sa mismong pariralang Griyego; pinanatili sa talababa ang literal na idyoma at ang saklaw nito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang natural na tanong na “Paano nagkaroon ng ganitong kaalaman” sa halip na ang di-likas na literal na “Paano nakaaalam ng mga titik,” ngunit pinanatili ang literal na larawan sa talababa. Ang “gayong hindi naman siya nag-aral” ay karaniwang pananalita at hindi labis na nagtatakda kung anong uri ng pormal na pagsasanay ang wala sa kaniya.
