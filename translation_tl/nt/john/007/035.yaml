  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἶπον οὖν οἱ Ἰουδαῖοι πρὸς ἑαυτούς· Ποῦ οὗτος μέλλει πορεύεσθαι ὅτι ἡμεῖς οὐχ εὑρήσομεν αὐτόν; μὴ εἰς τὴν διασπορὰν τῶν Ἑλλήνων μέλλει πορεύεσθαι καὶ διδάσκειν τοὺς Ἕλληνας;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/035.yaml
  text: So the Jews said to one another, “Where is this man about to go, that we will not find him? He is not about to go to the dispersion among the Greeks and teach the Greeks, is he?”
translation:
  language: tl
  text: Kaya sinabi ng mga Judio[a] sa isa’t isa, “Saan ba pupunta ang taong ito at hindi natin siya matatagpuan? Hindi naman siguro siya pupunta sa mga Judiong nakakalat sa piling ng mga Griego[b] at magtuturo sa mga Griego?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga taga-Judea.” Ang salitang Griyego ay maaaring tumukoy sa mga Judio sa pangkalahatan o, sa ilang konteksto, sa mga taong mula sa Judea.
    reason: lexical_alternative
  - marker: b
    text: Ang tinutukoy ay ang mga Judiong nakakalat at naninirahan sa piling ng mga Griego, hindi ang mga Griegong nangalat.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: mga Judio
  rationale: Tuwirang katumbas na hindi ipinapalagay na mga pinuno lamang ang tinutukoy. Posible rin ang panrehiyong diwang ‘mga taga-Judea,’ kaya inilagay iyon sa talababa.
- source_word: πρὸς ἑαυτούς
  choice: sa isa’t isa
  rationale: Malinaw sa konteksto ang tumbasang pag-uusap sa loob ng pangkat; natural ito sa modernong Tagalog.
- source_word: Ποῦ οὗτος
  choice: Saan ba pupunta ang taong ito
  rationale: Pinananatili ng ‘ang taong ito’ ang bahagyang mapaglayo o mapagwalang tonong maaaring taglayin ng οὗτος, habang ang ‘ba’ ay nagpapadaloy sa tanong.
- source_word: μέλλει πορεύεσθαι
  choice: pupunta
  rationale: Sa haka-hakang tanong na ito, likas na ipinahahayag ng aspektong panghinaharap sa Tagalog ang inaasahan o binabalak na pagpunta nang hindi labis na tinutukoy kung ito ay kagyat o sinasadya.
- source_word: ὅτι ἡμεῖς οὐχ εὑρήσομεν αὐτόν
  choice: at hindi natin siya matatagpuan
  rationale: Pinananatili ang resultang ipinahihiwatig ng sugnay at ang tahasang pandiwang ‘matatagpuan,’ nang hindi nagdaragdag ng ideya ng kakayahan.
- source_word: μὴ
  choice: Pupunta kaya siya
  rationale: Ang ‘kaya’ sa tanong ay natural na naghahayag ng nag-aalinlangan at malamang-negatibong inaasahan, nang hindi ginagawang tahasang pagtanggi.
- source_word: διασπορὰν τῶν Ἑλλήνων
  choice: mga Judiong nakakalat sa piling ng mga Griego
  rationale: Nililinaw sa pangunahing teksto na ang διασπορά ay mga Judiong nakakalat sa mga populasyong Griego, hindi mga Griegong nangalat. Mas madaling maunawaan ito kaysa sa teknikal na hiram na ‘Diaspora.’
- source_word: τοὺς Ἕλληνας
  choice: mga Griego
  rationale: Pinananatili ang karaniwang etniko-kultural na kahulugan ng Ἕλληνες at hindi ito pinalalawak tungo sa ‘mga Hentil.’
theological_decisions:
- issue: Saklaw ng Ἰουδαῖοι sa salaysay ni Juan
  choice: mga Judio
  alternative: mga taga-Judea
  rationale: Hindi hinihingi ng talata ang eksklusibong panrehiyong kahulugan, at hindi rin sinasabi ng Griyego na mga pinunong Judio lamang ang tinutukoy. Pinananatili sa talababa ang tunay na alternatibong leksikal.
- issue: Pagkakakilanlan ng διασπορά
  choice: mga Judiong nakakalat sa piling ng mga Griego
  alternative: Diaspora sa mga Griego
  rationale: Ang parirala ay tumutukoy sa mga Judiong naninirahan nang kalat sa mga bayang Griego o nagsasalita ng Griego. Ang malinaw na paglalahad ay umiiwas sa maling pagbasa na mga Griego ang bumubuo sa diaspora.
- issue: Retorikal na puwersa ng μὴ
  choice: Pupunta kaya siya
  alternative: Hindi naman siguro siya pupunta
  rationale: Ipinahihiwatig ng μὴ na negatibo ang inaasahang sagot, ngunit pinananatili ng ‘kaya’ ang haka at kabalintunaan nang hindi ginagawang mas tahasan kaysa sa orihinal.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang ‘Judio’ at ‘Griego’ bilang pamilyar na anyong biblikal sa Filipino; iniwasan ang teknikal na ‘Diaspora’ sa pangunahing teksto upang maging malinaw sa karaniwang mambabasa. Lahat ng panandang talababa ay nasa teksto.
