base_translation:
  language: en
  yaml_path: translation/nt/john/007/032.yaml
  text: The Pharisees heard the crowd muttering these things about him[c][b][a], and the chief priests and the Pharisees sent officers to seize him.
translation:
  language: tl
  text: Narinig ng mga Pariseo ang mga taong nagbubulungan ng ganitong mga bagay tungkol sa kanya[a]. At nagsugo ang mga punong pari at ang mga Pariseo ng mga bantay[b] upang dakpin siya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang isinaling “nagbubulungan” ay maaari ring mangahulugang “bumubulong-bulong” o “nagrereklamo nang mahina.”
    reason: lexical_alternative
  - marker: b
    text: O “mga opisyal na tauhan” o “mga bantay sa templo.” Tumutukoy ang salitang Griyego sa mga opisyal na tauhang isinugo ng mga punong pari at mga Pariseo.
    reason: lexical_alternative
  - marker: c
    text: O “upang arestuhin siya.” Mas literal na “upang sunggaban siya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουσαν
  choice: Narinig
  rationale: Ang aorist ng ἀκούω ay tumutukoy rito sa pagkarinig o pagkabatid sa sinasabi ng mga tao; natural at tuwiran ang “Narinig.”
- source_word: τοῦ ὄχλου
  choice: ang mga tao
  rationale: Tumutukoy ang ὄχλος sa nagkakatipong karamihan. Mas natural sa makabagong Tagalog ang “mga tao” kaysa “pulutong” o “karamihan” sa pangungusap na ito.
- source_word: γογγύζοντος
  choice: nagbubulungan
  rationale: Ipinahihiwatig ng γογγύζω ang mahina at di-lantad na usapan, na maaari ring may himig ng pagrereklamo. Pinananatili ng “nagbubulungan” ang mahinang paraan ng pagsasalita nang hindi ipinipilit na reklamo ang nilalaman.
- source_word: περὶ αὐτοῦ ταῦτα
  choice: tungkol sa kanya ng mga bagay na ito
  rationale: Pinananatili nito kapwa ang kahulugan ng περί na “tungkol sa” at ang maramihang demonstratibo na ταῦτα, bagaman inayos ang mga salita ayon sa natural na Tagalog.
- source_word: ἀπέστειλαν
  choice: nagsugo
  rationale: Ang “nagsugo” ay natural na katumbas ng opisyal at may-layuning pagpapadala sa kontekstong ito.
- source_word: οἱ ἀρχιερεῖς
  choice: ang mga punong pari
  rationale: Sa konteksto ng Ikalawang Templo, ang maramihang ἀρχιερεῖς ay tumutukoy sa pangunahing pamunuang makapari, hindi sa maraming kasalukuyang mataas na pari.
- source_word: ὑπηρέτας
  choice: mga bantay
  rationale: Tumutukoy ito sa mga opisyal na tauhang tagapagpatupad na nasa ilalim ng mga pinunong Judio. Malinaw at madaling maunawaan ang “mga bantay,” habang inilalahad sa talababa ang mas malawak na diwa.
- source_word: ἵνα πιάσωσιν αὐτόν
  choice: upang dakpin siya
  rationale: Ipinapahayag ng ἵνα at aorist subjunctive ang layunin, at ang “dakpin” ay nagpapanatili sa diwa ng pisikal na paghuli nang hindi labis na tinutukoy ang pormal na prosesong legal.
theological_decisions:
- issue: Pagkakakilanlan ng ὑπηρέτας bilang institusyonal na mga tauhan
  choice: mga bantay na isinugo ng mga punong pari at mga Pariseo
  alternative: mga opisyal na tauhan; mga bantay sa templo; mga lingkod
  rationale: Malinaw sa konteksto na opisyal silang isinugo upang hulihin si Jesus. Ang “mga bantay” ay naghahatid ng tungkuling iyon ngunit hindi tiyak na nagsasabing sila ay militar o isang modernong puwersa ng pulisya.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nagbubulungan” upang mapanatili ang mahinang paraan ng pagsasalita at ang posibleng negatibong himig nang hindi ito labis na nililinaw. Ang “dakpin” ay karaniwang salitang Tagalog para sa paghuli sa kontekstong ito.
