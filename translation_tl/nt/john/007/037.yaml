  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἐν δὲ τῇ ἐσχάτῃ ἡμέρᾳ τῇ μεγάλῃ τῆς ἑορτῆς εἱστήκει ὁ Ἰησοῦς, καὶ ἔκραξεν λέγων· Ἐάν τις διψᾷ ἐρχέσθω πρός με καὶ πινέτω.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/037.yaml
  text: On the last day[a], the great day of the feast, Jesus stood and cried out, saying, “If anyone is thirsty, let him come to me and drink.”
translation:
  language: tl
  text: Sa huling araw, ang dakilang araw ng kapistahan, tumayo si Jesus at sumigaw, “Kung nauuhaw ang sinuman, lumapit siya sa akin at uminom.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν δὲ τῇ ἐσχάτῃ ἡμέρᾳ
  choice: Sa huling araw
  rationale: Ginagawang natural na panandang temporal sa Filipino ang ἐν at pinananatili ang payak na diwa ng ἐσχάτῃ. Hindi na tahasang isinalin ang mahinang pang-ugnay na δέ dahil hindi ito kailangan sa likas na daloy ng salaysay sa Filipino.
- source_word: τῇ μεγάλῃ τῆς ἑορτῆς
  choice: ng kapistahan, ang dakilang araw nito
  rationale: Pinananatili ang mariing paglalarawan na μέγας bilang “dakila” at ang kaugnayan nito sa huling araw. Ang “kapistahan” ay dignified at karaniwang salin ng ἑορτή sa kontekstong panrelihiyon.
- source_word: εἱστήκει
  choice: nakatayo
  rationale: Ang anyo ay naglalarawan sa kalagayan o tindig ni Jesus; ang “nakatayo” ay mas tuwirang nagpapahayag ng postura kaysa “tumayo,” na maaaring magbigay-diin sa kilos ng pagtayo.
- source_word: ἔκραξεν λέγων
  choice: sumigaw
  rationale: Ipinahihiwatig ng κράζω ang malakas at hayagang pagsasalita. Sa natural na Filipino, sapat nang ipakilala ng “sumigaw” at ng tuwirang sipi ang nilalaman ng participleng λέγων.
- source_word: Ἐάν τις διψᾷ
  choice: Kung nauuhaw ang sinuman
  rationale: Pinananatili ng “sinuman” ang pangkalahatan at di-tiyak na τις, habang natural na inilalarawan ng “nauuhaw” ang kasalukuyang kalagayang ipinahihiwatig ng διψᾷ.
- source_word: ἐρχέσθω πρός με καὶ πινέτω
  choice: lumapit siya sa akin at uminom
  rationale: Ang “lumapit” ay natural na katumbas ng pagpunta patungo kay Jesus, at ang “siya” ay isahan ngunit likas na hindi tumutukoy sa kasarian sa Filipino. Pinananatili ng dalawang pautos ang lakas ng paanyaya nang hindi nagdaragdag ng paliwanag.
theological_decisions:
- issue: Matalinghagang diwa ng pagkauhaw at pag-inom
  choice: Panatilihin nang literal ang “nauuhaw” at “uminom.”
  alternative: Ipaliwanag bilang pananampalataya, pagtanggap ng buhay, o pagtanggap sa Espiritu.
  rationale: Ang talata mismo ay gumagamit ng bukás at masidhing larawan na patuloy na binubuo sa kasunod na konteksto. Ang pagpapaliwanag nito sa pangunahing teksto ay maagang magpapasya sa kahulugan.
- issue: Pangkalahatang isahan ng τις at mga pautos
  choice: Gamitin ang “sinuman” at ang isahang “siya.”
  alternative: Gumamit ng maramihang anyo o ulitin ang “ang taong iyon.”
  rationale: Naipapahayag ng Filipino ang pangkalahatang isahan nang hindi naglalagay ng kasarian; kaya napapanatili ang gramatikal na bilang at ang pagiging bukás ng paanyaya.
- issue: Paglalarawan sa huling araw bilang dakila
  choice: 'Panatilihin ang appositional na diin: “ang dakilang araw nito.”'
  alternative: Gawing “pinakadakilang araw” o “mahalagang araw.”
  rationale: Hindi tahasang superlatibo ang μέγας, at ang “mahalaga” ay nagpapahina sa matinding paglalarawan ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kapistahan” para sa relihiyosong pagdiriwang at iniwasan ang mekanikal na “na sinasabi” matapos ang “sumigaw.” Hindi kailangan ang footnote tungkol sa generic masculine sapagkat ang “siya” sa Filipino ay isahan at walang kasariang gramatikal.
