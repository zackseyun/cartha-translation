  text: ταῦτα ⸀δὲ εἰπὼν ⸀αὐτὸς ἔμεινεν ἐν τῇ Γαλιλαίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/009.yaml
  text: After saying these things, he himself remained in Galilee.
translation:
  language: tl
  text: Matapos niyang sabihin ang mga ito, siya mismo ay nanatili sa Galilea.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: nito
  rationale: Tumutukoy ito sa mga sinabi ni Jesus sa naunang talata. Bagaman maramihan ang anyong Griyego, likas sa modernong Tagalog ang pang-isahang buod na “nito” sa pariralang “pagkasabi nito.”
- source_word: δὲ εἰπὼν
  choice: Pagkasabi
  rationale: Ang aorist participle ay nagsasaad ng kilos na nauna sa pangunahing pandiwa; natural at malinaw itong ipinapahayag ng “Pagkasabi.” Hindi kailangang isalin nang hiwalay ang δέ sapagkat naihahatid ng konstruksiyon ang pagpapatuloy ng salaysay.
- source_word: αὐτὸς
  choice: siya
  rationale: Ang tahasang panghalip ay sapat na naipapahayag ng “siya.” Sa kontekstong ito, ang “siya mismo” ay maaaring magbigay ng mas matinding diin kaysa sa kinakailangan, bagaman may bahagyang paghahambing sa pag-alis ng kanyang mga kapatid.
- source_word: ἔμεινεν
  choice: nanatili
  rationale: Tumpak na ipinapahayag ng “nanatili” ang kahulugang remain/stay at pinananatili ang karaniwang bokabularyong kaugnay ng μένω sa Juan.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: sa Galilea
  rationale: Likas at tuwirang lokatibong salin ito ng pariralang Griyego.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na maikli, natural, at marangal. Pinili ang “Pagkasabi nito” kaysa sa mas mabigat na “Matapos niyang sabihin ang mga bagay na ito,” at iniwasan ang labis na pagdiin sa αὐτός.
