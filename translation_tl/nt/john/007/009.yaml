- from: Pagkasabi nito, nanatili siya sa Galilea.
  to: Matapos niyang sabihin ang mga ito, siya mismo ay nanatili sa Galilea.
  rationale: Idinagdag ang “siya mismo” upang mapanatili ang diin ng αὐτός, at ginawang “ang mga ito” ang demonstrative upang maipakita ang pangmaramihang ταῦτα. Pinanatili ang temporal na ugnayan ng aorist participle at ang karaniwang salin na “nanatili.”
