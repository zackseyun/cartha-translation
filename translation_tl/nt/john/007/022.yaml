id: JHN.7.22
reference: John 7:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: διὰ τοῦτο Μωϋσῆς δέδωκεν ὑμῖν τὴν περιτομήν— οὐχ ὅτι ἐκ τοῦ Μωϋσέως ἐστὶν ἀλλ’ ἐκ τῶν πατέρων— καὶ ἐν σαββάτῳ περιτέμνετε ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/022.yaml
  text: For this reason Moses has given you circumcision—not that it is from Moses[a], but from the fathers—and on the Sabbath you circumcise a man.
translation:
  language: tl
  text: Dahil dito, ibinigay sa inyo ni Moises ang pagtutuli—hindi dahil kay Moises ito nagmula, kundi sa mga ninuno—at sa araw ng Sabbath ay nagtutuli kayo ng isang lalaki.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Dahil dito
  rationale: Likas na panandang sanhi sa modernong Tagalog at pinananatili ang paliwanag na ugnayan sa konteksto.
- source_word: Μωϋσῆς
  choice: Moises
  rationale: Karaniwang anyo ng pangalang biblikal sa Tagalog.
- source_word: δέδωκεν
  choice: ibinigay
  rationale: Ang perpektong Griyego ay tumutukoy sa naitatag na kaloob o tuntuning nananatiling mahalaga; natural na ipinahahayag ito ng aspektong naganap sa Tagalog.
- source_word: τὴν περιτομήν
  choice: ang pagtutuli
  rationale: Tuwirang tumutukoy sa institusyon at gawaing tipan.
- source_word: οὐχ ὅτι ἐκ τοῦ Μωϋσέως ἐστὶν ἀλλ’ ἐκ τῶν πατέρων
  choice: hindi sa nagmula ito kay Moises, kundi sa mga ninuno
  rationale: Pinananatili ang panaklong na paglilinaw tungkol sa pinagmulan. Mas natural sa Tagalog ang 'mga ninuno' kaysa literal na 'mga ama,' habang malinaw pa rin ang pagtukoy sa mga patriyarka.
- source_word: ἐν σαββάτῳ
  choice: kahit sa Sabbath
  rationale: Ang 'sa Sabbath' ang natural na temporal na pahayag; ipinahihiwatig ng 'kahit' ang kontekstuwal na tensiyon na ginagawa ang pagtutuli sa araw na iyon, nang hindi binabago ang proposisyon.
- source_word: περιτέμνετε
  choice: nagtutuli kayo
  rationale: Pinananatili ang pangkasalukuyang anyo na nagpapahayag ng kinagawiang gawain at ang ikalawang panauhang maramihan.
- source_word: ἄνθρωπον
  choice: isang lalaki
  rationale: Ang tinutukoy ay partikular na lalaking tinutuli; hindi angkop ang mas malawak na 'tao' rito.
theological_decisions:
- issue: Saklaw ng pariralang ἐκ τῶν πατέρων
  choice: Isinalin bilang 'sa mga ninuno,' na sa konteksto ay tumutukoy sa mga patriyarkang nauna kay Moises.
  alternative: Maaaring unawain nang mas malawak bilang mga ninuno ng Israel sa pangkalahatan.
  rationale: Ipinapakita ng paghahambing kay Moises na mas nauna ang pinagmulan ng pagtutuli, ngunit hindi pinalalawak sa pangunahing teksto ang paliwanag nang higit sa sinasabi ng Griyego.
- issue: Ugnayan ng διὰ τοῦτο sa nakapaligid na pangungusap
  choice: Pinanatili bilang 'Dahil dito' nang hindi tahasang tinutukoy kung sa nauna o sa sumusunod na paliwanag ito nakakabit.
  alternative: Maaaring bantasang tila bumubuo ito ng konklusyon sa naunang talata o introduksiyon sa kasunod na pahayag.
  rationale: May sintaktikong pag-aalinlangan sa ugnayan ng parirala; iniiwasan ng salin na tahasang lutasin ito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang nakasanayang terminong biblikal na 'Sabbath' at ang malinaw na 'mga ninuno' sa halip na literal ngunit di-likas na 'mga ama.'
