  to: Dahil dito, ibinigay sa inyo ni Moises ang pagtutuli—hindi dahil kay Moises ito nagmula, kundi sa mga ninuno—at sa araw ng Sabbath ay nagtutuli kayo ng isang lalaki.
  rationale: Inayos ang di-gramatikal na parenthetical clause at inalis ang “kahit,” na nagdaragdag ng diin na wala sa tekstong Griyego. Pinanatili ang sanhi sa “Dahil dito,” ang parenthetical na paglilinaw ng pinagmulan, at ang partikular na lalaking tinutuli.
