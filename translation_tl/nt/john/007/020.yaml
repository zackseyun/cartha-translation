  text: The crowd answered[a], “You have a demon. Who is seeking to kill you?”
translation:
  language: tl
  text: Sumagot ang mga tao, “May demonyo ka![a] Sino ang naghahangad na pumatay sa iyo?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Sinasapian ka ng demonyo.” Sa literal, “May demonyo ka.”
