lexical_decisions:
- source_word: ἀπεκρίθη
  choice: Sumagot
  rationale: Likas at karaniwang pandiwang pasalaysay sa Filipino para sa tugon sa isang usapan.
- source_word: ὁ ὄχλος
  choice: ang mga tao
  rationale: Sa kontekstong ito, tumutukoy ito sa pangkat ng mga taong naroon. Mas natural sa modernong Filipino ang “ang mga tao” kaysa “ang karamihan,” bagaman maaaring mangahulugan ang salita ng “karamihan” o “madla.”
- source_word: Δαιμόνιον ἔχεις
  choice: May demonyo ka
  rationale: Malapit ito sa literal na ayos na “mayroon kang demonyo” at natural na naihahayag sa Filipino nang hindi dinaragdagan ng mas interpretatibong ideya ng pagsanib.
- source_word: τίς
  choice: Sino
  rationale: Pinananatili ang tahasang panghalip na patanong at ang retorikal na anyo ng tugon.
- source_word: ζητεῖ
  choice: naghahangad
  rationale: Ipinahahayag ang patuloy na layunin o pagsisikap na tinutukoy ng kasalukuyang panahunan; ang “naghahangad na” ay dignified at likas sa konteksto.
- source_word: ἀποκτεῖναι
  choice: pumatay
  rationale: Direkta at natural na salin na hindi nagdaragdag ng legal o moral na kahulugang maaaring ipahiwatig ng “paslangin.”
theological_decisions:
- issue: Paglalarawan sa paratang na Δαιμόνιον ἔχεις laban kay Jesus
  choice: May demonyo ka
  alternative: Sinasapian ka ng demonyo
  rationale: Iniuulat lamang ng teksto ang mapanlabang paratang ng mga tao at hindi ito pinagtitibay. Pinananatili ng salin ang literal na idyoma at iniiwasang gawing tiyak ang mas interpretatibong konsepto ng pagsanib.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang “mga tao” para sa ὄχλος at ang payak na idyomang “May demonyo ka” upang mapanatili ang diin at tensiyon ng orihinal.
