translation:
  language: tl
  text: Kaya nagkaroon ng pagkakabaha-bahagi sa gitna ng karamihan dahil sa kanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σχίσμα
  choice: pagkakahati-hati
  rationale: Tumutukoy ito sa pagkabiyak o pagkakahati ng mga tao sa magkakaibang panig; likas at malinaw sa modernong Tagalog ang “pagkakahati-hati.”
- source_word: οὖν
  choice: Kaya
  rationale: Ipinakikita ng pang-ugnay ang kinalabasan ng naunang pagtatalo; natural na naghahayag nito ang “Kaya” nang hindi nagpapahiwatig ng labis na pormal na lohika.
- source_word: ἐγένετο
  choice: nagkaroon
  rationale: Sa pariralang ito, ipinahahayag ng γίνομαι na lumitaw o umiral ang isang kalagayan; idiomatiko sa Tagalog ang “nagkaroon ng.”
- source_word: ἐν τῷ ὄχλῳ
  choice: sa karamihan
  rationale: Ang ὄχλος ay ang nagkakatipong maraming tao; ang “sa karamihan” ay maikli, natural, at angkop sa konteksto.
- source_word: δι’ αὐτόν
  choice: dahil sa kanya
  rationale: Ang διά na may accusative ay nagpapahayag ng sanhi. Pinananatili ng “dahil sa kanya” ang tuwirang sanhi at ang panghalip ng Griyego.
theological_decisions:
- issue: Tinutukoy ng αὐτόν
  choice: “kanya,” na tumutukoy kay Jesus ayon sa konteksto
  alternative: “dahil kay Jesus”
  rationale: Natural at malinaw sa daloy ng salaysay ang panghalip, kaya hindi kailangang gawing tahasan ang pangalang Jesus. Pinananatili rin nito ang anyo ng pinagmulang teksto.
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Ginamit ang “karamihan” para sa natipong mga tao at “pagkakahati-hati” para sa panlipunang pagkabiyak sa magkakaibang panig.
