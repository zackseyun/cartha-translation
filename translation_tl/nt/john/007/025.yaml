  text: Ἔλεγον οὖν τινες ἐκ τῶν Ἱεροσολυμιτῶν· Οὐχ οὗτός ἐστιν ὃν ζητοῦσιν ἀποκτεῖναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/025.yaml
  text: So some of the people of Jerusalem were saying[a], “Is this not the man they are seeking to kill?”
translation:
  language: tl
  text: Kaya sinasabi ng ilan sa mga taga-Jerusalem, “Hindi ba ito ang taong hinahanap nilang patayin?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔλεγον
  choice: sinabi
  rationale: Bagaman imperpekto ang anyo at maaaring magpahiwatig ng nagpapatuloy o paulit-ulit na pagsasalita, natural sa salaysay na Tagalog ang “sinabi”; hindi kailangang gawing mabigat na “patuloy na sinasabi” sa kontekstong ito.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinakikita ang pagpapatuloy o bunga ng naunang pangyayari; natural at malinaw ang “Kaya” sa modernong Tagalog.
- source_word: τινες ἐκ τῶν Ἱεροσολυμιτῶν
  choice: ilan sa mga taga-Jerusalem
  rationale: Tumpak na ipinahahayag ng “taga-Jerusalem” ang mga naninirahan sa Jerusalem, habang pinananatili ng “ilan sa” ang di-tiyak na bahagi ng pangkat.
- source_word: Οὐχ οὗτός ἐστιν
  choice: Hindi ba ito ang taong
  rationale: Ang tanong na may Οὐχ ay umaasang sasang-ayon ang kausap. Ang “Hindi ba ito” ay natural na katumbas sa Tagalog, at ang “taong” ay ipinahiwatig ng konteksto.
- source_word: ζητοῦσιν
  choice: hinahanap nilang
  rationale: Pinananatili ang kasalukuyang pagsisikap o layunin ng di-tiyak na pangkat na tinutukoy ng pangmaramihang pandiwa.
- source_word: ἀποκτεῖναι
  choice: patayin
  rationale: Ito ang tuwiran at karaniwang kahulugan ng pandiwa, nang hindi nagdaragdag ng pahiwatig ng pormal o hudisyal na paglalapat ng kamatayan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “taga-Jerusalem” sa halip na isang di-karaniwang katawagan para sa mga naninirahan doon. Walang talababa dahil tuwirang naisasalin sa pangunahing teksto ang kahulugan ng ἐκ τῶν Ἱεροσολυμιτῶν.
