id: JHN.7.4
reference: John 7:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὐδεὶς γάρ ⸂τι ἐν κρυπτῷ⸃ ποιεῖ καὶ ζητεῖ αὐτὸς ἐν παρρησίᾳ εἶναι· εἰ ταῦτα ποιεῖς, φανέρωσον σεαυτὸν τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/004.yaml
  text: For no one does anything in secret while seeking to be in public view. If you do these things, show yourself to the world.
translation:
  language: tl
  text: Sapagkat walang gumagawa ng anuman nang palihim habang hangad niyang maging lantad sa madla.[a] Kung ginagawa mo ang mga bagay na ito, ipakita mo ang iyong sarili sa mundo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “makilala nang hayagan” o “maging hayag.” Binibigyang-diin ng pariralang Griyego ang pagiging lantad o nakikita ng publiko.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς γάρ
  choice: Sapagkat walang
  rationale: Pinananatili ng “Sapagkat” ang paliwanag na ugnayan sa naunang talata, at likas na katumbas ng οὐδεὶς ang “walang” sa pangkalahatang pahayag.
- source_word: τι ἐν κρυπτῷ ποιεῖ
  choice: gumagawa ng anuman nang palihim
  rationale: Isinasalin ang τι bilang “anuman” at ang idyomang ἐν κρυπτῷ bilang “nang palihim,” nang hindi inaalis ang layon ng pandiwa.
- source_word: ζητεῖ αὐτὸς ἐν παρρησίᾳ εἶναι
  choice: hangad niyang maging lantad sa madla
  rationale: Ipinahahayag ang sinasadyang paghahangad ng ζητεῖ at ang diin sa mismong gumagawa mula sa αὐτός. Sa kontekstong ito, ang παρρησία ay tumutukoy sa hayagang pagkalantad o pagiging nakikita ng publiko, hindi pangunahing sa matapang na pananalita.
- source_word: εἰ ταῦτα ποιεῖς
  choice: Kung ginagawa mo ang mga bagay na ito
  rationale: Ang kasalukuyang anyo ng ποιεῖς ay natural na naipapahayag sa Filipino bilang nagpapatuloy na “ginagawa mo.”
- source_word: φανέρωσον σεαυτὸν
  choice: ipakita mo ang iyong sarili
  rationale: Direkta at natural na ipinapahayag ang pautos na tumawag sa hayagang pagpapakita ng sarili, habang naaangkop sa mapanghamong tono ng mga nagsasalita.
- source_word: τῷ κόσμῳ
  choice: sa mundo
  rationale: Pinananatili ang mahalagang bokabularyong κόσμος sa Juan at ang posibleng mas malawak na pampanitikang alingawngaw nito, sa halip na paliitin ito sa “madla” lamang.
theological_decisions:
- issue: Kahulugan ng κόσμος sa konteksto ng Juan
  choice: mundo
  alternative: madla; publiko
  rationale: Bagaman pampublikong pagkakakilanlan ang agarang konteksto, mahalagang paulit-ulit na termino sa Juan ang κόσμος. Pinananatili ng “mundo” ang saklaw at posibleng tematikong bigat nito nang hindi nagdaragdag ng tiyak na doktrinal na paliwanag.
- issue: Saklaw ng ἐν παρρησίᾳ εἶναι
  choice: maging lantad sa madla
  alternative: makilala nang hayagan; maging hayag
  rationale: Sa talatang ito, ang pananalita ay tungkol sa pampublikong pagkakita o pagkakilala. Pinananatili sa talababa ang leksikal na posibilidad ng hayagang pagkakilala upang hindi ipagpalagay na iisa lamang ang diin ng parirala.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “madla” para sa pampublikong dimensiyon ng παρρησία ngunit pinanatili ang “mundo” para sa κόσμος, upang hindi mawala ang natatanging bokabularyo ni Juan.
