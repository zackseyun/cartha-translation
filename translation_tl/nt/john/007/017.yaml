  text: ἐάν τις θέλῃ τὸ θέλημα αὐτοῦ ποιεῖν, γνώσεται περὶ τῆς διδαχῆς πότερον ἐκ τοῦ θεοῦ ἐστιν ἢ ἐγὼ ἀπ’ ἐμαυτοῦ λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/017.yaml
  text: If anyone wants to do his will[a], he will know about the teaching, whether it is from God or whether I am speaking from myself.
translation:
  language: tl
  text: Kung nais ng sinuman na gawin ang kalooban ng Diyos, malalaman niya kung ang turo ay mula sa Diyos o kung nagsasalita ako mula sa sarili ko.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “sa sarili kong kusa” o “sa sarili kong awtoridad.” Sa literal na Griyego: “mula sa sarili ko.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τις θέλῃ
  choice: Kung nais ng sinuman
  rationale: Ang ἐάν na may pasakaling pandiwa ay naghahayag ng pangkalahatang kondisyon. Likas sa makabagong Filipino ang “nais” at napananatili nito ang diwa ng pagnanais o kusang-loob.
- source_word: τὸ θέλημα αὐτοῦ ποιεῖν
  choice: na gawin ang kalooban niya
  rationale: Ang ποιεῖν kasama ng θέλημα ay tuwirang “gawin ang kalooban.” Pinananatili ng “niya” ang panghalip sa Griyego sa halip na tahasang palitan ito ng “ng Diyos.”
- source_word: γνώσεται
  choice: malalaman niya
  rationale: Ipinahihiwatig ng anyong panghinaharap ang kaalamang o pagkilalang magiging bunga ng kondisyong binanggit. Maikli at natural ang “malalaman niya.”
- source_word: περὶ τῆς διδαχῆς
  choice: kung ang turo
  rationale: Ang διδαχή ay “turo” o “katuruan.” Sa Filipino, natural na naipapaloob ang paksa ng pag-alam sa sugnay na “malalaman niya kung,” nang hindi na pilit na isinasalin nang hiwalay ang περί bilang “tungkol sa.”
- source_word: πότερον ... ἢ
  choice: kung ... o kung
  rationale: Malinaw na inilalahad ng inuulit na “kung” ang dalawang pinagpipiliang pinagmulan ng turo.
- source_word: ἐκ τοῦ θεοῦ
  choice: mula sa Diyos
  rationale: Ang ἐκ ay nagsasaad ng pinagmulan; tuwiran at natural itong naihahayag ng “mula sa Diyos.”
- source_word: ἀπ’ ἐμαυτοῦ
  choice: mula sa sarili ko
  rationale: Pinananatili nito ang literal na larawan ng pinagmulan sa Griyego at hindi agad nililimitahan ang kahulugan sa sariling kusa o sariling awtoridad.
- source_word: λαλῶ
  choice: nagsasalita ako
  rationale: Natural na katumbas ito ng pangkasalukuyang λαλῶ sa konteksto ng patuloy na pagsasalita ni Jesus.
theological_decisions:
- issue: Tinutukoy ng αὐτοῦ sa “kalooban niya”
  choice: Pinanatili ang panghalip na “niya,” bagaman ang Diyos ang pinakamalamang na tinutukoy sa konteksto.
  alternative: “kalooban ng Diyos”
  rationale: Nililinaw ng konteksto na ang Diyos ang tinutukoy, ngunit panghalip ang ginamit ng tekstong Griyego. Pinananatili nito ang anyo at anumang bahagyang kalabuan ng orihinal.
- issue: Diwa ng ἀπ’ ἐμαυτοῦ
  choice: “mula sa sarili ko”
  alternative: “sa sarili kong kusa” o “sa sarili kong awtoridad”
  rationale: Tuwirang nagsasaad ng pinagmulan ang Griyego. Maaaring kasama sa pahiwatig ang pagkilos nang nagsasarili o ayon sa sariling awtoridad, ngunit hindi iyon dapat gawing tanging kahulugan sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang payak na “turo” at “nais” para sa karaniwang mambabasa, habang pinanatili ang panghalip at ang larawan ng pinagmulan sa orihinal.
