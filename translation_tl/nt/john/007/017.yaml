  source_fidelity: Tumpak na naihahayag ng draft ang pangkalahatang kondisyon, ang paggawa ng kalooban, ang magiging pagkilala sa pinagmulan ng turo, at ang dalawang alternatiba. Gayunman, ang “kalooban niya” ay madaling mabasa sa Filipino bilang kalooban ng “sinuman,” samantalang ang αὐτοῦ ay tumutukoy sa Diyos sa konteksto. Dahil dito, kailangan ang paglilinaw sa salin.
  naturalness: Malinaw at makabago ang pangungusap. Mas natural at mas tiyak sa Filipino ang “kalooban ng Diyos” sa halip na “kalooban niya” sa posisyong ito. Maayos ang natitirang sintaks.
  terminology: Ang “turo,” “Diyos,” at “mula sa sarili ko” ay angkop at matapat sa διδαχή, θεός, at ἀπ’ ἐμαυτοῦ. Ang talababa ay dapat bahagyang ayusin para maging likas ang pahayag na “Sa literal na Griyego.”
  issues:
