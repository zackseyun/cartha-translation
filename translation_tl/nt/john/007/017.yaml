    issue: Hindi malinaw ang tinutukoy ng “niya” sa “kalooban niya.”
    rationale: Sa karaniwang Filipino, ang pinakamalapit na posibleng tinutukoy ng “niya” ay “sinuman,” kaya maaari itong mangahulugang gawin ng bawat isa ang sarili niyang kalooban. Sa Griyegong konteksto, ang αὐτοῦ ay tumutukoy sa Diyos. Ang paggamit ng “kalooban ng Diyos” ay kinakailangang paglilinaw upang maiwasan ang maling pag-uugnay ng panghalip.
