  text: μή τις ἐκ τῶν ἀρχόντων ἐπίστευσεν εἰς αὐτὸν ἢ ἐκ τῶν Φαρισαίων;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/048.yaml
  text: Has any one of the rulers or of the Pharisees believed in him?[a]
translation:
  language: tl
  text: Mayroon bang kahit isa sa mga pinuno o sa mga Pariseo na sumampalataya sa kanya?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, ang pagkakabuo ng tanong ay nagpapahiwatig na “wala” ang inaasahang sagot.
    reason: lexical_alternative
lexical_decisions:
- source_word: μή τις
  choice: Mayroon bang kahit isa
  rationale: Pinananatili nito ang anyong patanong at ipinahihiwatig, nang hindi tahasang sinasabi, na inaasahan ng nagsasalita ang sagot na “wala.”
- source_word: ἐκ τῶν ἀρχόντων
  choice: sa mga pinuno
  rationale: Tumutukoy ito sa mga kinikilalang pinunong may kapangyarihan sa mga Judio; natural at sapat na tiyak sa modernong Tagalog ang “mga pinuno.”
- source_word: ἐπίστευσεν εἰς αὐτόν
  choice: sumampalataya sa kanya
  rationale: Ang “sumampalataya sa” ay likas at marangal na salin ng karaniwang pariralang Juaniko na πιστεύω εἰς, at ang aspektong naganap ay angkop sa tanong tungkol sa kung may gumawa na nito.
- source_word: ἢ
  choice: o
  rationale: Pinananatili ng payak na “o” ang koordinasyon ng dalawang pangkat nang hindi nagdaragdag ng diin na wala sa salita mismo.
- source_word: ἐκ τῶν Φαρισαίων
  choice: sa mga Pariseo
  rationale: Ipinahihiwatig ng “sa mga Pariseo” ang pagiging kabilang sa pangkat at pinananatili ang pagkakapantay ng dalawang parirala.
theological_decisions:
- issue: Retorikal na puwersa ng negatibong tanong
  choice: Panatilihin bilang tanong na umaasang “wala” ang sagot.
  alternative: “Wala ni isa sa mga pinuno o mga Pariseo ang sumampalataya sa kanya.”
  rationale: Ang μή τις ay naghuhudyat ng inaasahang negatibong sagot, ngunit tanong pa rin ang anyo ng Griyego. Pinananatili ng salin ang mapanghamak na retorika nang hindi ginagawang tahasang pahayag ang ipinahihiwatig lamang.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “sumampalataya” para sa wikang Juaniko tungkol sa pananampalataya, at “kanya” ayon sa kasalukuyang karaniwang baybay. Lumilitaw sa pangunahing teksto ang marker na [a].
