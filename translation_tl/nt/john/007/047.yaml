  text: ἀπεκρίθησαν οὖν αὐτοῖς οἱ Φαρισαῖοι· Μὴ καὶ ὑμεῖς πεπλάνησθε;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/047.yaml
  text: So the Pharisees answered them[a], “Have you also been led astray?”
translation:
  language: tl
  text: Kaya sumagot sa kanila ang mga Pariseo, “Kayo rin ba ay nailigaw[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nalinlang.” Ang pandiwa ay maaaring mangahulugang naakay sa kamalian o nadaya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: sumagot
  rationale: Likas at karaniwang salin ng pandiwang ginagamit sa pagsagot sa isang pag-uusap.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinakikita ang bunga o kaugnayan ng sagot sa naunang sinabi, sa paraang natural sa makabagong Tagalog.
- source_word: αὐτοῖς
  choice: sa kanila
  rationale: Tuwirang ipinahahayag ang di-tuwirang layon ng pandiwang “sumagot.”
- source_word: οἱ Φαρισαῖοι
  choice: ang mga Pariseo
  rationale: Karaniwang katawagan sa Tagalog para sa pangkat na ito, habang pinananatili ang artikulo at pangmaramihang anyo.
- source_word: Μὴ καὶ ὑμεῖς
  choice: Kayo rin ba
  rationale: Pinananatili ang diin sa ὑμεῖς at ang kahulugan ng καί na “rin”; ang tanong ay likas pakinggan ngunit nadarama pa rin ang inaasahang negatibong sagot.
- source_word: πεπλάνησθε
  choice: ay nailigaw
  rationale: 'Ipinahahayag ang resultang kalagayan ng perpektong pasibo: may nagdala sa kanila sa kamalian. Mas malapit ito sa anyo at diwa ng Griyego kaysa sa simpleng “naligaw.”'
theological_decisions:
- issue: Retorikal na puwersa ng tanong na may μή
  choice: Isinalin bilang “Kayo rin ba ay nailigaw?” nang hindi idinaragdag ang “Hindi naman siguro.”
  alternative: “Hindi rin naman kayo nailigaw, hindi ba?”
  rationale: Ang μή ay nagpapahiwatig na negatibong sagot ang inaasahan ng mga Pariseo. Naipadarama ito ng maikling retorikal na tanong nang hindi labis na ipinapaliwanag o pinatitindi ang sinabi.
- issue: Saklaw ng πεπλάνησθε
  choice: nailigaw
  alternative: nalinlang
  rationale: Maaaring tumukoy ang pandiwa sa pag-akay sa kamalian o panlilinlang. Pinananatili ng “nailigaw” ang larawang dinala sa maling landas nang hindi ipinipilit na sadyang pandaraya lamang ang tinutukoy.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “Pariseo,” na madaling makilala ng karaniwang mambabasa, at pinanatiling maikli at matalim ang mapanghamong tanong.
