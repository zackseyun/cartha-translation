  text: I know him[a], because I am from him[b], and he sent me.
translation:
  language: tl
  text: Kilala ko siya, sapagkat[a] ako ay mula sa kanya[b], at siya ang nagsugo sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O maaaring unawain ang kasunod na sugnay bilang nilalaman: “na ako ay mula sa kanya.” Maaaring gamitin ang pangatnig na Griyego bilang panimula ng nilalaman (“na”) o ng dahilan (“sapagkat”); mas pinapaboran ng konteksto ang kahulugang nagsasaad ng dahilan.'
    reason: lexical_alternative
  - marker: b
    text: O “nanggaling ako sa kanya” o “ako ay mula sa kanyang kinaroroonan.” Maaaring mas tiyak na magpahayag ng pinagmulan o bukal ang pariralang Griyego kaysa sa payak na “mula sa kanya.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ
  choice: ako
  rationale: Pinanatili ang tahasang panghalip upang maipahiwatig ang diin sa pahayag ni Jesus.
- source_word: οἶδα αὐτόν
  choice: Kilala ko siya
  rationale: Ang οἶδα ay nagsasaad ng kasalukuyang kaalaman; ang “kilala ko siya” ang likas na Filipino para sa personal na pagkakilala sa tinutukoy.
- source_word: ὅτι
  choice: sapagkat
  rationale: Pinili ang panandang sanhi dahil ipinapaliwanag ng kasunod na sugnay kung bakit kilala ni Jesus ang Ama; pinanatili sa talababa ang posibleng pagbasa na panandang nilalaman.
- source_word: παρ’ αὐτοῦ
  choice: mula sa kanya
  rationale: Ang παρά na may genitive ay maaaring magpahayag ng pinagmulan o bukal; hindi ito pinalawak upang hindi paliitin ang teolohikal na saklaw.
- source_word: εἰμι
  choice: ako ay
  rationale: Pinanatili ang present copula sa “ako ay mula sa kanya,” sa halip na gawing pandiwang kilos na “nanggaling ako.”
- source_word: κἀκεῖνός
  choice: at siya ang
  rationale: Likas na Filipino ang “at siya ang,” at naipakikita ng ang-construction ang tahasang paksa ng pagsusugo.
- source_word: με ἀπέστειλεν
  choice: nagsugo sa akin
  rationale: Ang “nagsugo” ay angkop sa aorist na ἀπέστειλεν at pinananatili ang tema ng misyong ipinagkatiwala nang hindi ipinipilit ang aspektong perpekto.
theological_decisions:
- issue: Kahulugan ng ugnayan ni Jesus sa Ama sa παρ’ αὐτοῦ εἰμι
  choice: ako ay mula sa kanya
  alternative: nanggaling ako sa kanya; ako ay mula sa kanyang kinaroroonan
  rationale: Ipinahahayag nito ang pinagmulan o bukal habang pinananatili ang lalim at tensiyong teolohikal ng Griyego. Hindi ito nilimitahan sa paglalakbay, lokasyon, o pagsusugo lamang.
- issue: Gamit ng ὅτι
  choice: sapagkat
  alternative: na
  rationale: 'Mas malamang sa konteksto ang panandang sanhi: kilala siya ni Jesus sapagkat si Jesus ay mula sa kanya. Gayunman, tunay na posible sa gramatika ang pagbasa rito bilang panandang nilalaman, kaya itinabi iyon sa talababa.'
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “sapagkat” upang mapanatili ang pormal ngunit natural na himig, at ang “nagsugo” upang ihatid ang tema ng banal na pagsusugo. Lahat ng panandang talababa ay nasa pangunahing teksto.
