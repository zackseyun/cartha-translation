id: JHN.7.21
reference: John 7:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Ἓν ἔργον ἐποίησα καὶ πάντες θαυμάζετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/021.yaml
  text: Jesus answered and said to them[a], “I did one work[b], and you all marvel.”
translation:
  language: tl
  text: Sumagot si Jesus at sinabi sa kanila, “Iisang gawa[a][b] ang ginawa ko, at nagtataka kayong lahat.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ginawa” o “kilos.” Ang salitang Griyego ay tumutukoy sa isang gawa o gawain, ngunit pinananatili ng “gawa” ang paulit-ulit na gamit ni Juan sa salitang ito para sa mga ginawa ni Jesus.
    reason: lexical_alternative
  - marker: b
    text: Malamang na tumutukoy ito sa pagpapagaling ni Jesus sa lalaking may kapansanan noong Sabbath sa Juan 5:1–18.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: sumagot
  rationale: Karaniwang pandiwang pasalaysay para sa pagtugon; tuwirang pinananatili ang kilos ng pagsagot.
- source_word: εἶπεν
  choice: sinabi
  rationale: Pinananatili ang dalawang pandiwa sa pormulang ἀπεκρίθη ... καὶ εἶπεν sa halip na pagsamahin ang mga ito.
- source_word: αὐτοῖς
  choice: sa kanila
  rationale: Likas na salin ng datibong di-tuwirang layon.
- source_word: Ἓν
  choice: iisang
  rationale: Binibigyang-diin ang bilang na isa at mas natural sa Tagalog kaysa sa payak na “isang” sa kontekstong ito.
- source_word: ἔργον
  choice: gawa
  rationale: Ang “gawa” ay natural at nagpapanatili sa paulit-ulit at maaaring teolohikal na gamit ng ἔργον sa Juan.
- source_word: ἐποίησα
  choice: ginawa ko
  rationale: Tuwirang inilalarawan ang payak na nakaraang kilos nang walang dagdag na pormalidad.
- source_word: πάντες
  choice: kayong lahat
  rationale: Ginagawang malinaw na ang buong pangkat na kinakausap ang tinutukoy.
- source_word: θαυμάζετε
  choice: nagtataka
  rationale: Pinananatili ang kasalukuyang reaksiyon ng pagkamangha o pagtataka nang hindi ito ipinapalagay na lubos na positibo.
theological_decisions:
- issue: Kahalagahan ng ἔργον sa Ebanghelyo ni Juan
  choice: gawa
  alternative: ginawa / kilos
  rationale: Pinananatili ng “gawa” ang ugnayan sa paulit-ulit na katawagan ni Juan para sa mga ginawa ni Jesus, nang hindi nagdaragdag ng interpretasyon sa pangunahing teksto.
- issue: Tinukoy na “iisang gawa”
  choice: Hindi tahasang pinangalanan sa pangunahing teksto; ipinaliwanag lamang sa talababa
  alternative: Idagdag sa teksto na ito ang pagpapagaling sa Sabbath
  rationale: Hindi pinangalanan ng Griyegong talata ang gawa. Malamang na tumutukoy ito sa Juan 5:1–18, ngunit nararapat panatilihin ang pahiwatig sa halip na gawing tahasang pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang bahagyang Semitikong pormulang “Sumagot ... at sinabi” dahil kapwa naroon ang dalawang pandiwa sa Griyego. Ginamit ang “nagtataka” upang masaklaw ang pagkamangha at pagkalito nang hindi gawing tiyak na positibo ang reaksiyon.
