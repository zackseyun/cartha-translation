base_translation:
  language: en
  yaml_path: translation/nt/john/007/031.yaml
  text: But many from the crowd believed in him[a], and they were saying, “When the Messiah comes, he will not do more signs than this man has done, will he?”
translation:
  language: tl
  text: Ngunit marami sa pulutong ang sumampalataya sa kanya, at paulit-ulit nilang sinasabi, “Kapag dumating ang Mesiyas,[a] hindi naman siya gagawa ng higit na maraming tanda kaysa sa mga tandang ginawa ng taong ito, hindi ba?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Cristo.” Ang salitang Griego na Χριστός ay ginamit dito bilang titulo sa kontekstong Judio tungkol sa Mesiyas.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τοῦ ὄχλου δὲ πολλοὶ
  choice: Ngunit marami sa mga tao
  rationale: Ipinahihiwatig ng ἐκ τοῦ ὄχλου na ang tinutukoy ay isang malaking bahagi mula sa mas malawak na pulutong. Likas sa makabagong Tagalog ang “marami sa mga tao,” at ipinakikita ng “ngunit” ang banayad na pagsalungat ng δέ sa di-paniniwala at pagtatalo sa konteksto.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: sumampalataya sa kanya
  rationale: Ang πιστεύω na may εἰς ay tumutukoy sa personal na pananalig na nakatuon sa isang tao. Ang “sumampalataya sa kanya” ay malinaw at hindi lamang nagpapahiwatig na naniwala sila sa isang pahayag tungkol sa kanya.
- source_word: ἔλεγον
  choice: sinasabi nila
  rationale: Ang aspektong imperpektibo ay nagpapahiwatig ng nagpapatuloy o paulit-ulit na pagsasalita; pinananatili ito ng “sinasabi nila” nang natural sa Tagalog.
- source_word: Ὁ χριστός
  choice: ang Mesiyas
  rationale: Ginagamit dito ang Χριστός bilang titulong Judio para sa ipinangakong pinahiran, kaya mas malinaw sa konteksto ang “Mesiyas” kaysa sa anyong maaaring mapagkamalang personal na pangalan.
- source_word: ὅταν ἔλθῃ
  choice: Kapag dumating
  rationale: Ang ὅταν na may aorist subjunctive ay tumutukoy sa isang pangyayari sa hinaharap. Natural itong naipapahayag ng “kapag dumating” nang hindi ginagawang kondisyonal na “kung.”
- source_word: μὴ πλείονα σημεῖα ποιήσει
  choice: hindi naman siya gagawa ng mas maraming tanda ... hindi ba?
  rationale: Ang μή sa tanong ay umaasang negatibo ang sagot. Pinananatili ng negatibong pahayag at hulaping “hindi ba?” ang retorikal na puwersang iyon. Ang πλείονα ay dami, kaya “mas maraming,” hindi “mas dakilang.”
- source_word: σημεῖα
  choice: mga tanda
  rationale: Sa Juan, ang σημεῖα ay mga gawang naghahayag at nagtuturo sa pagkakakilanlan ni Jesus, hindi lamang mga himala. Pinananatili ng “mga tanda” ang mahalagang terminolohiyang ito.
- source_word: ὧν οὗτος ἐποίησεν
  choice: kaysa sa mga ginawa ng taong ito
  rationale: Ang “taong ito” ay likas na katumbas ng οὗτος sa pampublikong pananalita ng mga tao, at ang “mga ginawa” ay malinaw na bumabalik sa naunang “mga tanda.”
theological_decisions:
- issue: Pagsasalin sa Χριστός bilang titulo
  choice: Mesiyas
  alternative: Cristo
  rationale: Malinaw na titulo ang gamit sa pariralang “kapag dumating ang Mesiyas,” kaya pinananatili ang kontekstong Judio. Inilalagay sa talababa ang tradisyonal na katumbas na “Cristo.”
- issue: Puwersa ng retorikal na tanong na may μή
  choice: 'Negatibong tanong na umaasang sasang-ayon ang kausap: “hindi naman ... hindi ba?”'
  alternative: 'Mas neutral na tanong: “gagawa kaya siya ...?”'
  rationale: Karaniwang ipinahihiwatig ng μή na inaasahang “hindi” ang sagot. Hindi ito dapat patagin bilang neutral na tanong, ngunit hindi rin dapat ipaliwanag sa mismong teksto ang buong konklusyong teolohikal ng mga tao.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mga tao” sa halip na mas pormal na “pulutong,” at pinanatili ang terminong Juaninong “mga tanda.” Nasa pangunahing teksto ang marker na [a].
