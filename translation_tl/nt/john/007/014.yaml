id: JHN.7.14
reference: John 7:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἤδη δὲ τῆς ἑορτῆς μεσούσης ⸀ἀνέβη Ἰησοῦς εἰς τὸ ἱερὸν καὶ ἐδίδασκεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/014.yaml
  text: When the feast was already half over[c][b][a], Jesus went up into the temple and was teaching.
translation:
  language: tl
  text: Nang nasa kalagitnaan na ang kapistahan[a], umakyat si Jesus sa templo[b], at doon siya nagtuturo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Nang sumapit na sa kalagitnaan ang kapistahan.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Griyego rito ay ἱερόν, na tumutukoy sa kompleks o mga bakuran ng templo, hindi lamang sa panloob na santuwaryo.
    reason: cultural_note
  - marker: c
    text: Ang anyong Griyego ay maaaring magbigay-diin na nagpapatuloy ang pagtuturo ni Jesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤδη δὲ τῆς ἑορτῆς μεσούσης
  choice: Nang nasa kalagitnaan na ang kapistahan
  rationale: Ang genitive absolute ay nagsasaad ng panahong kinalalagyan ng pangyayari. Isinasalin ng “na” ang ἤδη, at natural na ipinahihiwatig ng sugnay na “Nang” ang banayad na paglipat ng salaysay na dala ng δὲ nang hindi ito ginagawang matinding pagsalungat.
- source_word: ἀνέβη
  choice: umakyat
  rationale: Pinananatili nito ang direksiyonal na diwa ng pag-akyat patungo sa Jerusalem o sa lugar ng templo.
- source_word: εἰς τὸ ἱερὸν
  choice: sa templo
  rationale: Natural itong tawag sa lugar sa Filipino, samantalang nililinaw sa talababa na ang ἱερόν ay ang buong bakuran o kompleks ng templo, hindi lamang ang panloob na santuwaryo.
- source_word: ἐδίδασκεν
  choice: at doon siya nagtuturo
  rationale: Ang konstruksiyong ito ay malinaw at natural na nagpapakita ng nagpapatuloy na kilos na ipinahihiwatig ng imperfect, nang hindi idinaragdag ang di-tiyak na diwang “nagsimulang magturo.”
theological_decisions:
- issue: Saklaw ng ἱερόν
  choice: Ang “templo” ay tumutukoy sa kompleks o mga bakuran ng templo.
  alternative: Ang panloob na santuwaryo lamang.
  rationale: Magkaiba sa Griyego ang ἱερόν, na maaaring tumukoy sa kabuuang kompleks, at ang ναός, na karaniwang tumutukoy sa panloob na santuwaryo. Mahalaga ang pagkakaibang ito sa paglarawan sa lugar ng pagtuturo ni Jesus.
- issue: Aspekto ng ἐδίδασκεν
  choice: 'Pinanatili ang nagpapatuloy na kilos: “nagtuturo.”'
  alternative: “nagturo” o “nagsimulang magturo.”
  rationale: Ang imperfect ay maaaring maglarawan ng patuloy na pagtuturo. Hindi tahasang sinasabi ng anyo na sa sandaling iyon lamang nagsimula ang kilos, kaya hindi ipinilit ang inceptive na pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kapistahan” sa halip na mas impormal na “pista,” at ang “doon siya nagtuturo” upang likas na maipahayag ang patuloy na kilos.
