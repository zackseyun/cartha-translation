  edition: SBLGNT
  text: ἐζήτουν οὖν αὐτὸν πιάσαι, καὶ οὐδεὶς ἐπέβαλεν ἐπ’ αὐτὸν τὴν χεῖρα, ὅτι οὔπω ἐληλύθει ἡ ὥρα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/030.yaml
  text: So they were seeking to seize him[a], yet no one laid a hand on him[b], because his hour had not yet come.
translation:
  language: tl
  text: Kaya sinisikap nilang dakpin siya[a], ngunit walang sinumang humawak sa kanya, sapagkat hindi pa sumasapit ang oras niya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hulihin siya.” Ang pandiwang Griego ay maaaring mangahulugang sunggaban o dakpin; sa kontekstong ito, malamang na pag-aresto ang ipinahihiwatig.
    reason: lexical_alternative
  - marker: b
    text: Ang “oras niya” ay isang paulit-ulit na pahayag sa Juan para sa itinakdang panahon sa misyon ni Jesus, lalo na kaugnay ng kanyang pagdurusa, kamatayan, muling pagkabuhay, at pagluluwalhati.
    reason: cross_reference
lexical_decisions:
- source_word: ἐζήτουν
  choice: sinisikap nilang
  rationale: Ipinahihiwatig ng aspektong imperpektibo ang patuloy o paulit-ulit na pagtatangka; likas sa modernong Tagalog ang “sinisikap nilang” sa kontekstong ito.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinapakita ang lohikal at pasalaysay na bunga ng naunang pahayag nang natural sa Tagalog.
- source_word: πιάσαι
  choice: dakpin
  rationale: Ang pandiwa ay nangangahulugang sunggaban o hulihin. Sa konteksto, malinaw na pagdakip ang layunin, ngunit hindi nito kailangang ipahiwatig ang isang pormal na prosesong legal.
- source_word: οὐδεὶς
  choice: walang sinuman
  rationale: Malinaw at dignified na katumbas ng ganap na negatibong panghalip.
- source_word: ἐπέβαλεν ἐπ’ αὐτὸν τὴν χεῖρα
  choice: humawak sa kanya
  rationale: Likas na Tagalog para sa idyomang tumutukoy sa aktuwal na paghawak o pagdakip sa isang tao, nang hindi nagpapahiwatig na simpleng paghipo lamang.
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw na nagpapakilala sa dahilan at angkop sa dignified ngunit madaling maunawaang rehistro.
- source_word: οὔπω
  choice: hindi pa
  rationale: Tuwirang katumbas ng temporal na pagtanggi.
- source_word: ἐληλύθει
  choice: dumarating
  rationale: Sa pariralang “hindi pa dumarating,” natural na naipapahayag sa Tagalog na hindi pa sumasapit ang itinakdang sandali sa puntong iyon ng salaysay.
- source_word: ἡ ὥρα αὐτοῦ
  choice: ang oras niya
  rationale: Pinananatili ang literal at paulit-ulit na terminolohiyang Johannine na “oras,” sa halip na paliitin ito sa kamatayan lamang o gawing pangkalahatang “panahon.”
theological_decisions:
- issue: Kahulugan ng “ang oras niya” sa konteksto ng Juan
  choice: Panatilihin sa pangunahing teksto ang literal na “ang oras niya” nang walang paliwanag na idinaragdag doon.
  alternative: “ang takdang panahon niya” o “ang takdang oras ng kanyang kamatayan”
  rationale: May malalim at umuunlad na kahulugan ang “oras” sa Ebanghelyo ni Juan, kaugnay ng misyon, pagdurusa, kamatayan, muling pagkabuhay, at pagluluwalhati kay Jesus. Hindi ito nililimitahan ng talata sa isa lamang sa mga ito, kaya pinananatili ang teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang “dakpin” sa halip na mas kolokyal na “hulihin” sa pangunahing teksto, at pinanatili ang Johannine na “oras” upang hindi mapawi ang ambiguwidad at teolohikal na lalim.
