  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς ἐμέ, καθὼς εἶπεν ἡ γραφή, ποταμοὶ ἐκ τῆς κοιλίας αὐτοῦ ῥεύσουσιν ὕδατος ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/038.yaml
  text: The one who believes in me[a], just as the Scripture has said[b], rivers of living water will flow from his belly.
translation:
  language: tl
  text: “Ang sumasampalataya sa akin—gaya ng sinabi ng Kasulatan[b]—mula sa kaibuturan niya[a] ay dadaloy ang mga ilog ng tubig na buhay.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa pangunahing pagbasa, ang “niya” ay tumutukoy sa sumasampalataya. Nauunawaan naman ng ilan na tumutukoy ito sa Mesiyas. Ang salitang isinaling “kaibuturan” ay literal na “tiyan” o “sinapupunan,” at maaari ring mangahulugang kaloob-looban ng isang tao.
    reason: alternative_reading_and_lexical_alternative
  - marker: b
    text: Maaari ring iugnay ang “gaya ng sinabi ng Kasulatan” sa naunang pariralang “ang sumasampalataya sa akin,” sa halip na sa kasunod na pahayag tungkol sa mga ilog ng tubig na buhay.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ὁ πιστεύων εἰς ἐμέ
  choice: Ang sumasampalataya sa akin
  rationale: Ang articular present participle ay tumutukoy sa taong kinikilala sa patuloy o pangkalahatang pananampalataya. Likas sa modernong Tagalog ang “ang sumasampalataya,” at tumpak nitong pinananatili ang isahan at ang tuon ng pananampalataya kay Jesus.
- source_word: καθὼς εἶπεν ἡ γραφή
  choice: gaya ng sinabi ng Kasulatan
  rationale: Pinananatili ng “sinabi” ang aorist na εἶπεν, at ng “Kasulatan” ang isahang ἡ γραφή bilang may-awtoridad na pagtukoy sa banal na kasulatan.
- source_word: ποταμοὶ
  choice: mga ilog
  rationale: Mas tuwirang katumbas ito ng ποταμοί kaysa “mga batis” at pinananatili ang larawan ng kasaganaan.
- source_word: ἐκ τῆς κοιλίας αὐτοῦ
  choice: mula sa kaibuturan niya
  rationale: Maaaring literal na mangahulugan ang κοιλία na “tiyan” o “sinapupunan,” ngunit dito ay matalinghagang tumutukoy sa kaloob-loobang bahagi ng tao. Ang “kaibuturan” ay natural at marangal, samantalang ang “niya” ay hindi sapilitang naglilimita sa posibleng tinutukoy ng αὐτοῦ.
- source_word: ῥεύσουσιν
  choice: dadaloy
  rationale: Tuwirang inilalarawan nito ang future active indicative nang hindi nagdaragdag ng tinding wala sa pandiwa.
- source_word: ὕδατος ζῶντος
  choice: tubig na buhay
  rationale: Pinananatili nito ang konkretong talinghaga at ang natatanging teolohikal na alingawngaw ng parirala sa Ebanghelyo ni Juan.
theological_decisions:
- issue: Ang tinutukoy ng αὐτοῦ sa “mula sa kaibuturan niya”
  choice: Sa pangunahing pagbasa, tumutukoy ang “niya” sa sumasampalataya.
  alternative: Maaaring tumukoy ang “niya” sa Mesiyas o kay Jesus, kaya mula sa kanya nagmumula ang tubig na buhay.
  rationale: Ang pinakamalapit na gramatikal na antecedent ay “ang sumasampalataya,” at kaayon ito ng paliwanag sa Juan 7:39 tungkol sa Espiritung tatanggapin ng mga sumasampalataya. Gayunman, hindi isinasara ng salin ang alternatibong pagbasa, at malinaw itong itinatala sa talababa.
- issue: Pagkakaugnay ng “gaya ng sinabi ng Kasulatan”
  choice: Iniuugnay sa kabuuang pahayag na ang mga ilog ng tubig na buhay ay dadaloy mula sa sumasampalataya.
  alternative: Maaaring iugnay ang parirala sa “ang sumasampalataya sa akin,” na para bang ang Kasulatan ang naglalarawan kung paano o kanino sumasampalataya.
  rationale: Walang tuwirang sipi na eksaktong katumbas ng buong pangungusap, at maaaring pagtipon ito ng ilang larawang mula sa Kasulatan. Dahil pinahihintulutan ng bantas at sintaks ang higit sa isang pag-uugnay, hindi dapat itago ang tunay na kalabuan.
- issue: Kahulugan ng κοιλία
  choice: kaibuturan
  alternative: tiyan; sinapupunan; loob
  rationale: Ang literal na “tiyan” ay maaaring magmukhang purong anatomikal sa modernong Tagalog. Naipahahayag ng “kaibuturan” ang matalinghagang panloob na sentro ng tao habang itinatala sa talababa ang literal na saklaw.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kaibuturan” upang maiwasan ang nakalilitong purong anatomikal na dating ng “tiyan,” habang pinanatili sa talababa ang literal na kahulugan. Ang mga gitling ay tumutulong na ipakita ang parentetikong parirala nang hindi ganap na nilulutas ang kalabuan ng pagkakaugnay nito.
