  text: εἰ περιτομὴν ⸀λαμβάνει ἄνθρωπος ἐν σαββάτῳ ἵνα μὴ λυθῇ ὁ νόμος Μωϋσέως, ἐμοὶ χολᾶτε ὅτι ὅλον ἄνθρωπον ὑγιῆ ἐποίησα ἐν σαββάτῳ;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/023.yaml
  text: If a man receives circumcision on the Sabbath so that the law of Moses may not be broken[c][b][a], are you angry with me because I made a whole man well on the Sabbath?
translation:
  language: tl
  text: Kung tinutuli ang isang lalaki sa araw ng Sabbath upang hindi malabag ang Kautusan ni Moises,[a] nagagalit ba kayo sa akin dahil pinagaling ko nang lubos ang isang tao sa araw ng Sabbath?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “upang hindi maisaisantabi” o “upang hindi mawalan ng bisa ang Kautusan ni Moises.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ginawa kong malusog ang isang buong tao.” Idiniriin ng pananalita ang paghahambing sa pagitan ng pagtutuli sa isang bahagi ng katawan at ng ganap na pagpapagaling sa isang tao.
    reason: cross_reference
lexical_decisions:
- source_word: περιτομὴν λαμβάνει ἄνθρωπος
  choice: tinutuli ang isang lalaki
  rationale: Likas sa makabagong Tagalog ang pasibong 'tinutuli' at tumpak itong tumutukoy sa lalaking sumasailalim sa pagtutuli; hindi kailangang gayahin nang literal ang Griyegong idyomang 'tumatanggap ng pagtutuli.'
- source_word: ἐν σαββάτῳ
  choice: sa araw ng Sabbath
  rationale: Malinaw at karaniwang paraan sa Tagalog ng pagpapahayag ng panahong tinutukoy ng dative.
- source_word: ἵνα μὴ λυθῇ ὁ νόμος Μωϋσέως
  choice: upang hindi malabag ang Kautusan ni Moises
  rationale: Sa kontekstong legal, ipinahihiwatig ng λυθῇ na masira o malabag ang bisa o hinihingi ng kautusan. Ang 'malabag' ay malinaw at natural, habang ang iba pang posibilidad ay inilalahad sa talababa.
- source_word: ἐμοὶ χολᾶτε
  choice: nagagalit ba kayo sa akin
  rationale: Tuwiran at likas na katumbas ng pandiwang nagsasaad ng galit o matinding pagkainis, nang hindi pinalalabis ang tindi.
- source_word: ὅλον ἄνθρωπον ὑγιῆ ἐποίησα
  choice: pinagaling ko ang buong katawan ng isang tao
  rationale: Pinananatili nito ang diin sa kabuuan ng taong pinagaling at ang paghahambing sa pagtutuli ng isang bahagi ng katawan. Ginamit ang 'buong katawan ng isang tao' upang maging natural at malinaw sa Tagalog nang hindi magmukhang ang moral o espirituwal na kabuuan ang tahasang tinutukoy.
theological_decisions:
- issue: Paghahambing ng pagtutuli at pagpapagaling sa Sabbath
  choice: Inilalahad ang pangangatwiran mula sa pinahihintulutang pagtutuli sa Sabbath tungo sa higit na katuwiran ng pagpapagaling sa buong katawan ng isang tao sa Sabbath.
  alternative: Maaaring unawain ito bilang mas pangkalahatang paghahambing ng ritwal na kautusan at mahabaging pagkilos.
  rationale: Ang mismong retorika ng talata ay nakasalalay sa pagtutuling ginagawa upang hindi malabag ang Kautusan ni Moises, saka inihahambing dito ang pagpapanumbalik sa kabuuan ng tao. Hindi idinaragdag ng salin ang anumang polemika laban sa Kautusan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang 'Sabbath' bilang pamilyar na katawagang biblikal at 'Kautusan' na may malaking titik bilang tiyak na pagtukoy sa Kautusan ni Moises. Ang ayos ng pangungusap ay nagpapanatili sa retorikal na tanong at sa paghahambing ng bahagi at kabuuan.
