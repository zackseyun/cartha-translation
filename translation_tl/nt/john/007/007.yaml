  text: οὐ δύναται ὁ κόσμος μισεῖν ὑμᾶς, ἐμὲ δὲ μισεῖ, ὅτι ἐγὼ μαρτυρῶ περὶ αὐτοῦ ὅτι τὰ ἔργα αὐτοῦ πονηρά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/007.yaml
  text: The world is not able to hate you[a], but it hates me[d][c][b], because I testify about it that its works are evil.
translation:
  language: tl
  text: Hindi kayang mapoot sa inyo ng sanlibutan[a], ngunit napopoot ito sa akin, sapagkat nagpapatotoo ako tungkol dito na masasama ang mga gawa nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “sanlibutan” sa Ebanghelyo ni Juan ay madalas tumukoy sa kaayusan ng sangkatauhan na sumasalungat sa Diyos, hindi sa nilikhang daigdig mismo.
    reason: cultural_note
lexical_decisions:
- source_word: οὐ δύναται
  choice: hindi kayang
  rationale: Pinananatili ang diwa ng kakayahan o kawalan ng kakayahan sa δύναμαι, habang natural ang anyo sa makabagong Tagalog.
- source_word: ὁ κόσμος
  choice: ang sanlibutan
  rationale: Karaniwang salin ito ng κόσμος sa kontekstong Juaniko at naiiwasang paliitin agad ang kahulugan tungo lamang sa sangkatauhan o sa isang sistemang laban sa Diyos.
- source_word: μισεῖν / μισεῖ
  choice: kapootan / napopoot
  rationale: Pinananatili ang matindi at moral na puwersa ng μισέω at ang pag-uulit ng parehong pandiwa sa Griyego.
- source_word: ἐμὲ δὲ
  choice: ngunit napopoot ito sa akin
  rationale: Malinaw na ipinapakita ng ngunit ang paghahambing sa pagitan ng mga kapatid ni Jesus at ni Jesus mismo.
- source_word: μαρτυρῶ
  choice: nagpapatotoo ako
  rationale: Natural at dignified na katumbas ito na nagpapanatili sa diwa ng pagsaksi o pagbibigay ng patotoo.
- source_word: περὶ αὐτοῦ
  choice: tungkol dito
  rationale: Ang tinutukoy ay ang sanlibutan; ang dito ay natural sa Tagalog at hindi ito maling ginagawang isang lalaking persona.
- source_word: τὰ ἔργα αὐτοῦ
  choice: ang mga gawa nito
  rationale: Malapit ito sa ἔργα at pinananatili ang moral at teolohikal na pag-uugnay ng 'mga gawa' sa Ebanghelyo ni Juan.
- source_word: πονηρά
  choice: masasama
  rationale: Ipinahahayag nito ang moral na kasamaan, hindi lamang pagiging di-kaaya-aya o mababa ang kalidad.
theological_decisions:
- issue: Ang tinutukoy at teolohikal na puwersa ng ὁ κόσμος sa kontekstong Juaniko
  choice: Panatilihin ang “sanlibutan” nang walang paliwanag na idinagdag sa pangunahing teksto
  alternative: “sangkatauhang lumalaban sa Diyos” o “sistemang makasanlibutan”
  rationale: May masaklaw at patong-patong na gamit ang κόσμος kay Juan. Pinananatili ng salin ang tensiyon at hindi nililimitahan ang salita sa isang tiyak na interpretasyong teolohikal.
- issue: Dahilan ng pagkapoot ng sanlibutan kay Jesus
  choice: Tahasan nitong inuugnay ang pagkapoot sa patotoo ni Jesus na masasama ang mga gawa ng sanlibutan
  alternative: Palambutin bilang simpleng hindi pagsang-ayon ng sanlibutan kay Jesus
  rationale: Malakas ang μισεῖ at πονηρά sa Griyego; ang pagpapalambot sa mga ito ay magbabawas sa moral na pagsalungat na ipinahahayag ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “sanlibutan” upang mapanatili ang teolohikal na lawak ng κόσμος, at ang “napopoot” upang hindi mapahina ang tindi ng μισέω. Inilagay ang pananda ng talababa sa hulihan ng pangungusap upang tumukoy sa paggamit ng “sanlibutan” sa buong pahayag.
