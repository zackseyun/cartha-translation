id: JHN.7.26
reference: John 7:26
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἴδε παρρησίᾳ λαλεῖ καὶ οὐδὲν αὐτῷ λέγουσιν· μήποτε ἀληθῶς ἔγνωσαν οἱ ἄρχοντες ὅτι οὗτός ⸀ἐστιν ὁ χριστός;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/026.yaml
  text: And look[a], he is speaking openly, and they say nothing to him. Can it be that the rulers truly know that this is the Messiah?
translation:
  language: tl
  text: At tingnan ninyo, hayagan siyang nagsasalita, at wala silang sinasabi sa kanya. Hindi kaya talagang nalaman na ng mga pinuno na siya ang Mesiyas?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴδε
  choice: tingnan ninyo
  rationale: Ginamit bilang panawag-pansin sa mga nakikinig. Likas ito sa makabagong Filipino at naiiwasan ang makalumang «narito».
- source_word: παρρησίᾳ
  choice: hayagan
  rationale: Ipinahihiwatig nito ang lantad at pampublikong pagsasalita sa konteksto, hindi lamang ang katapangan.
- source_word: λαλεῖ
  choice: nagsasalita
  rationale: 'Ang aspektong nagaganap ay angkop sa kasalukuyang tagpo: namamasdan nila siyang nagsasalita.'
- source_word: οὐδὲν αὐτῷ λέγουσιν
  choice: wala silang sinasabi sa kanya
  rationale: Tuwirang pinananatili ang datibong «sa kanya» nang hindi idinaragdag ang interpretatibong «laban sa kanya».
- source_word: μήποτε
  choice: Hindi kaya
  rationale: Nagpapahayag ito ng nag-aatubili at nagugulat na hinuha sa isang tanong, sa natural na anyong Filipino.
- source_word: ἀληθῶς
  choice: talagang
  rationale: Natural na idinidiin nito na maaaring tunay o aktuwal ang pagkaalam ng mga pinuno.
- source_word: ἔγνωσαν
  choice: nalaman na
  rationale: Pinananatili ang natapos na anyo ng pandiwa at ang ipinahihiwatig na pagdating sa kaalaman, nang hindi ito pinakikitid sa «nakilala» lamang.
- source_word: οἱ ἄρχοντες
  choice: mga pinuno
  rationale: Likas at sapat na malawak na tawag ito sa mga namumunong awtoridad sa konteksto.
- source_word: ὅτι οὗτός ἐστιν ὁ χριστός
  choice: na siya ang Mesiyas
  rationale: Natural na tinutukoy ng «siya» ang lalaking nasa harap nila, at ang χριστός ay gumaganap dito bilang titulong mesiyaniko.
theological_decisions:
- issue: Pagpapahayag sa ὁ χριστός bilang titulo
  choice: ang Mesiyas
  alternative: ang Cristo
  rationale: Sa tanong ng mga tao, ang χριστός ay titulong tumutukoy sa hinihintay na pinahiran, hindi pangalang pantangi. Pinananatili ng «Mesiyas» ang kontekstong Judio nang hindi nagdaragdag ng denominasyonal na pakahulugan.
- issue: Lakas ng tanong na may μήποτε
  choice: Hindi kaya talagang nalaman na…?
  alternative: Tiyak namang hindi nalaman…
  rationale: Pinananatili ang tunay na pag-aalinlangan at nagugulat na paghihinuha ng mga nagsasalita, sa halip na gawing tiyak na negatibo ang tanong.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang «tingnan ninyo» bilang likas na panawag-pansin at ang «hayagan» upang idiin ang lantad na pagsasalita. Walang talababa dahil walang kinakailangang alternatibong pagbasa upang maipakita nang tapat ang diwa ng talata.
