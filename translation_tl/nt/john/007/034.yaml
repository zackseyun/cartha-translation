base_translation:
  language: en
  yaml_path: translation/nt/john/007/034.yaml
  text: You will seek me and will not find me[a], and where I am[b], you are not able to come.
translation:
  language: tl
  text: Hahanapin ninyo ako, ngunit hindi ninyo ako matatagpuan; at kung nasaan ako, hindi kayo makapupunta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζητήσετέ με
  choice: Hahanapin ninyo ako
  rationale: Ang μέλλον na pandiwang ζητήσετέ ay tumutukoy sa gagawing paghahanap. Likas at malinaw sa modernong Tagalog ang “hahanapin,” at hindi nito dinaragdagan ng natatanging espirituwal na diwa ang salita.
- source_word: οὐχ εὑρήσετε
  choice: hindi ninyo ako matatagpuan
  rationale: Tuwirang pinananatili ang negatibong pahayag sa hinaharap. Inulit ang “ako” dahil ito ang likas at malinaw na ayos sa Tagalog.
- source_word: ὅπου εἰμὶ ἐγώ
  choice: sa kinaroroonan ko
  rationale: Natural na katumbas sa Tagalog ng lokatibong “kung saan ako naroroon.” Naipahihiwatig ng “ko” ang pagtutok kay Jesus nang hindi nagdaragdag ng salitang wala sa Griyego.
- source_word: ὑμεῖς οὐ δύνασθε ἐλθεῖν
  choice: hindi kayo makapupunta
  rationale: Ang anyong “makapupunta” ay malinaw na nagsasaad ng kawalan ng kakayahang makarating, hindi ng pagbabawal. Pinananatili rin ng “kayo” ang maramihang ikalawang panauhan.
theological_decisions:
- issue: Uri at dahilan ng kawalan ng kakayahang makarating sa kinaroroonan ni Jesus
  choice: Isinalin bilang “hindi kayo makapupunta,” na nagsasaad ng kawalan ng kakayahan nang hindi tinutukoy ang dahilan nito.
  alternative: “Hindi kayo maaaring pumunta,” na maaaring maunawaan bilang pagbabawal o kawalan ng pahintulot.
  rationale: Ang δύνασθε ay tumutukoy sa kakayahan. Hindi nililinaw ng talata kung ang kawalan ng kakayahan ay moral, espirituwal, hatol ng Diyos, o pansamantala, kaya hindi ito ipinasiya sa salin.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “kinaroroonan ko” upang maging natural ang buong pangungusap at maiwasan ang mabigat na hulma na “kung nasaan ako, hindi kayo makapupunta.”
