  text: εἶπον οὖν πρὸς αὐτὸν οἱ ἀδελφοὶ αὐτοῦ· Μετάβηθι ἐντεῦθεν καὶ ὕπαγε εἰς τὴν Ἰουδαίαν, ἵνα καὶ οἱ μαθηταί σου ⸀θεωρήσουσιν ⸂σοῦ τὰ ἔργα⸃ ἃ ποιεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/003.yaml
  text: So his brothers said to him[a], “Leave here and go to Judea, so that your disciples also may see the works you are doing.”
translation:
  language: tl
  text: Kaya sinabi sa kanya ng kanyang mga kapatid, “Umalis ka rito at pumunta sa Judea, upang makita rin ng mga alagad mo ang mga gawa na ginagawa mo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Likas na pang-ugnay ito sa makabagong Tagalog at pinananatili ang paghihinuha o pagpapatuloy mula sa naunang salaysay.
- source_word: ἀδελφοὶ αὐτοῦ
  choice: kanyang mga kapatid
  rationale: Sa konteksto, tumutukoy ito sa mga lalaking kapatid ni Jesus. Hindi na kailangang tukuyin ang kasarian sa Tagalog sapagkat likas na hindi minamarkahan ng salitang “kapatid” ang kasarian.
- source_word: Μετάβηθι ἐντεῦθεν
  choice: Umalis ka rito
  rationale: Malinaw at tuwirang utos ito na umalis sa kasalukuyang lugar, ayon sa lakas ng aorist imperative.
- source_word: ὕπαγε εἰς τὴν Ἰουδαίαν
  choice: pumunta sa Judea
  rationale: Natural na salin ng utos na magtungo sa rehiyong tinatawag na Judea.
- source_word: ἵνα καὶ
  choice: upang ... din
  rationale: Pinananatili ng “upang” ang layunin ng ἵνα at ng “din” ang diwa ng καὶ.
- source_word: οἱ μαθηταί σου
  choice: mga alagad mo
  rationale: Ang “alagad” ay malinaw at karaniwang salin na nagpapanatili sa ugnayan ng guro at disipulo.
- source_word: θεωρήσουσιν
  choice: makita
  rationale: Sa sugnay na may ἵνα, ang future indicative ay nagpapahayag ng nilalayong resulta o layunin. Natural sa Tagalog ang “upang makita,” habang inilalahad sa talababa ang posibilidad ng mas mariing “mapagmasdan” o ng tahasang panghinaharap na “makikita.”
- source_word: σοῦ τὰ ἔργα ἃ ποιεῖς
  choice: mga gawang ginagawa mo
  rationale: Pinananatili ang tematikong salitang “mga gawa” para sa ἔργα sa Juan at malinaw na iniuugnay ang mga iyon sa kasalukuyang ginagawa ni Jesus.
- source_word: Ἰουδαίαν
  choice: Judea
  rationale: Pamantayang anyo sa Tagalog ng pangalang heograpiko.
theological_decisions:
- issue: Tinutukoy ng “kanyang mga kapatid”
  choice: Mga kapatid o kapamilyang lalaki ni Jesus ang nagsasalita sa salaysay.
  alternative: Mas malawak na mga kamag-anak o kaanak.
  rationale: Sa agarang konteksto ng Juan 7:3–5, sila ay tuwirang tinatawag na mga kapatid ni Jesus. Pinananatili ng salin ang payak na katawagang pampamilya nang hindi nagpapasya sa mga tanong na hindi tahasang nilulutas ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang karaniwang ayos ng pangungusap at “mo” sa loob ng tuwirang pananalita para sa likas na daloy. Pinanatili ang “mga gawa” dahil mahalaga ang terminong ito sa bokabularyo at tema ng Ebanghelyo ni Juan.
