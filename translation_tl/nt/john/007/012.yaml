  text: καὶ γογγυσμὸς ⸂περὶ αὐτοῦ ἦν πολὺς⸃ ἐν τοῖς ὄχλοις· οἱ μὲν ἔλεγον ὅτι Ἀγαθός ἐστιν, ἄλλοι ⸀δὲ ἔλεγον· Οὔ, ἀλλὰ πλανᾷ τὸν ὄχλον.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/012.yaml
  text: And there was much murmuring about him among the crowds[a]. Some were saying, “He is good.” Others were saying, “No, on the contrary[b], he is misleading the crowd.”
translation:
  language: tl
  text: At maraming bulung-bulungan tungkol sa kanya sa gitna ng mga tao.[a] Sinasabi ng ilan, “Mabuti siya.” Ngunit sinasabi naman ng iba, “Hindi, sa halip ay inililigaw niya ang mga tao.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pabulong na usapan” o “pabulong na pagrereklamo” tungkol sa kanya.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Nililinlang niya ang mga tao” o “Inaakay niya sa maling landas ang mga tao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γογγυσμός
  choice: pabulong na usapan
  rationale: Ipinahihiwatig ng salita ang mahina at hindi hayagang pag-uusap o pagbulong-bulungan. Ang “pabulong na usapan” ay natural sa makabagong Tagalog at hindi ipinapalagay na pawang pagrereklamo ang tono.
- source_word: περὶ αὐτοῦ
  choice: tungkol sa kanya
  rationale: Tuwiran at likas na katumbas na pinananatili ang paksa ng usapan.
- source_word: πολύς
  choice: maraming
  rationale: Ipinakikita nito ang lawak o dami ng pabulong na usapan.
- source_word: ἐν τοῖς ὄχλοις
  choice: sa gitna ng mga tao
  rationale: Pinananatili ang maramihang diwa ng ὄχλοις at inilalarawan ang usapang kumakalat sa nagkakatipong mga pangkat.
- source_word: οἱ μὲν ... ἄλλοι δὲ
  choice: ang ilan ... naman ang iba
  rationale: Malinaw at natural na ipinakikita ang magkasalungat na mga pangkat.
- source_word: Ἀγαθός ἐστιν
  choice: Mabuti siya
  rationale: Malapit ito sa payak na pang-uri ng Griyego at hindi idinaragdag ang pangngalang “tao” o “lalaki.”
- source_word: Οὔ, ἀλλὰ
  choice: Hindi!
  rationale: Ipinahahayag ang mariing pagtanggi at pagsalungat sa naunang pahayag; ang kasunod na pangungusap mismo ang naghaharap ng kabaligtarang paratang.
- source_word: πλανᾷ
  choice: Inililigaw
  rationale: Saklaw nito ang pag-akay sa kamalian nang hindi tiyak na ipinapalagay ang sinasadyang panlilinlang.
- source_word: τὸν ὄχλον
  choice: ang mga tao
  rationale: Natural na kolektibong pagtukoy sa karamihan sa Tagalog, bagaman isahan ang anyong Griyego.
theological_decisions:
- issue: Magkasalungat na pagtingin ng mga tao kay Jesus
  choice: Iniulat nang tuwiran at walang pagkiling ang “Mabuti siya” at “Inililigaw niya ang mga tao.”
  alternative: Ipaliwanag o palambutin ang alinman sa dalawang pahayag.
  rationale: Mga hatol ito ng magkakaibang pangkat, hindi tahasang pagsang-ayon ng tagapagsalaysay. Pinananatili ng salin ang tensiyon ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pabulong na usapan” upang mapanatili ang hindi hayagang katangian ng γογγυσμός, at “Mabuti siya” upang manatiling malapit sa anyo at saklaw ng Ἀγαθός ἐστιν.
