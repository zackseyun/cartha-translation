base_translation:
  language: en
  yaml_path: translation/nt/john/007/052.yaml
  text: They answered and said to him[b][a], “Are you also from Galilee? Search and see that no prophet arises from Galilee.”
translation:
  language: tl
  text: 'Sumagot sila at sinabi nila sa kanya, “Taga-Galilea ka rin ba?[a] Magsaliksik ka at tingnan mo: walang propetang lumilitaw mula sa Galilea.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Hindi ka rin naman taga-Galilea, hindi ba?” Ang pagkakabuo ng tanong sa Griyego ay nagpapahiwatig na negatibo ang inaasahang sagot.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “walang propetang ibinabangon mula sa Galilea,” na nagpapanatili sa posibleng diwang ang Diyos ang nagbabangon ng mga propeta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν
  choice: Sumagot sila at sinabi
  rationale: Pinananatili ang magkaparis na pandiwa at ang karaniwang himig ng pagsasalaysay ni Juan, kahit bahagyang inuulit nito ang diwa.
- source_word: Μὴ καὶ σὺ ἐκ τῆς Γαλιλαίας εἶ;
  choice: Taga-Galilea ka rin ba?
  rationale: Natural itong tanong sa modernong Tagalog at naipahihiwatig ng konteksto ang mapanghamak na pag-asang hindi ang sagot; nililinaw sa talababa ang puwersa ng μή.
- source_word: ἐραύνησον καὶ ἴδε
  choice: Magsaliksik ka at tingnan mo
  rationale: Pinananatili ang dalawang pautos at ang tuwirang hamon na magsiyasat at makita ang katotohanan ng sinasabi nila.
- source_word: προφήτης
  choice: propeta
  rationale: Walang pantukoy ang pangngalan sa Griyego, kaya tumutukoy ito sa sinumang propeta at hindi partikular sa isang eskatolohikong ‘Propeta.’
- source_word: οὐκ ἐγείρεται
  choice: walang ... lumilitaw
  rationale: Ang ‘lumilitaw’ ay natural na nagpapahayag ng paglitaw o pagbangon ng isang propeta nang hindi ipinapalagay kung tahasan bang Diyos ang gumagawa nito.
theological_decisions:
- issue: Puwersa ng tanong na may μή
  choice: Taga-Galilea ka rin ba?
  alternative: Hindi ka rin naman taga-Galilea, hindi ba?
  rationale: Ang μή ay nagpapahiwatig na negatibo ang inaasahang sagot, ngunit mas natural ang payak na anyo sa pangunahing teksto. Pinananatili sa talababa ang mas tahasang retorikal na puwersa.
- issue: Posibleng diwang Diyos ang nagbabangon ng propeta
  choice: lumilitaw
  alternative: ibinabangon
  rationale: Maaaring mangahulugan ang ἐγείρεται ng paglitaw ng isang propeta o, bilang balintiyak, ng pagbangon sa kanya ng Diyos. Hindi tahasang nilulutas ng pangunahing teksto ang posibilidad na ito, at inilalahad sa talababa ang alternatibo.
translation_notes:
  register: Makabago, tuwiran, at marangal na Filipino. Ginamit ang karaniwang ‘Taga-Galilea’ at ‘propeta’; iniwasan ang sobrang teknikal o makalumang pananalita. Ang bantas na tutuldok pagkatapos ng dalawang pautos ay tumutulong upang maging malinaw at natural ang kasunod na pahayag.
