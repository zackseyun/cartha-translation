  yaml_path: translation/nt/john/007/049.yaml
  text: But this crowd[a], which does not know the law[b], is accursed.
translation:
  language: tl
  text: Ngunit ang pulutong na ito na hindi nakaaalam ng Kautusan[b] ay mga isinumpa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nasa ilalim ng sumpa.”
    reason: lexical_alternative
  - marker: b
    text: Ang “Kautusan” ay tumutukoy sa Kautusang Judio o Torah.
    reason: cultural_note
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ngunit
  rationale: Likas na panandang pasalungat sa Filipino at malinaw na ipinagpapatuloy ang pagsalungat sa naunang pahayag.
- source_word: ὁ ὄχλος οὗτος
  choice: ang mga taong ito
  rationale: Tumutukoy sa kolektibong πλήθος/crowd nang hindi idinaragdag ang mapanlait na himig ng “mababang uri” o “kuyog.” Mas natural din itong itambal sa maramihang εἰσιν.
- source_word: ὁ μὴ γινώσκων
  choice: na hindi nakaaalam
  rationale: Inilalarawan nito ang patuloy na kalagayan ng tinutukoy na pangkat at natural ang anyong pang-ugnay sa Filipino.
- source_word: τὸν νόμον
  choice: ang Kautusan
  rationale: Ang tiyak na tinutukoy sa konteksto ay ang Kautusang Judio o Torah; ang malaking titik ay tumutulong ipakitang natatanging kalipunan ito, hindi basta anumang batas.
- source_word: ἐπάρατοί
  choice: mga isinumpa
  rationale: Pinananatili ang matindi at mapanghatol na puwersa ng salitang Griyego. Ang talababa ay nagbibigay ng malapit na alternatibong “nasa ilalim ng sumpa.”
- source_word: εἰσιν
  choice: ay mga
  rationale: Pinananatili ang maramihang anyo ng pandiwang Griyego sapagkat “mga taong ito” ang natural na maramihang paksa sa Filipino.
theological_decisions:
- issue: Kung ang mapanuligsang hatol ay dapat ipakitang pahayag lamang ng mga Pariseo at hindi pagsang-ayon ng tagapagsalaysay
  choice: Isinalin nang tuwiran ang hatol sa loob ng kanilang tuwirang pananalita, nang walang pagpapalambot o dagdag na paglayo ng tagapagsalaysay.
  alternative: Dagdagan ng “sabi nila” o “para sa kanila” upang tahasang ilayo ang tagapagsalaysay sa hatol.
  rationale: Tuwirang pananalita ito ng mga kalaban ni Jesus. Dapat panatilihin ang bangis at teolohikal na tensiyon ng sinabi nila, ngunit hindi dapat magdagdag ng pananalitang wala sa Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasan ang “madla,” na maaaring maging abstrakto o masyadong pormal, at ang “kuyog,” na nagdaragdag ng negatibong kahulugang hindi hinihingi ng Griyego. Inilagay ang [b] kasunod ng “Kautusan” at ang [a] kasunod ng “isinumpa,” ayon sa paksa ng bawat talababa.
