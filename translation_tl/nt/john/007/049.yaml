review_pass:
  verdict: revise
  source_fidelity: Ang “mga taong ito” ay nakukuha ang maramihang sanggunian ngunit hindi nito tuwirang naipapahayag ang ὄχλος, isang natatanging pagtukoy sa isang pulutong o karamihan. Ang “pulutong na ito” ay mas malapit sa pinagmulan nang walang dagdag na mapanlait na himig. Napananatili ng natitirang pagsasalin ang pasalungat na ἀλλά, ang attributive na paglalarawan na “hindi nakaaalam,” ang Torah/Mosaic na saklaw ng νόμος, at ang mariing mapanghatol na ἐπάρατοι.
  naturalness: Natural at malinaw sa makabagong Filipino ang “Ngunit ang pulutong na ito na hindi nakaaalam ng Kautusan ay mga isinumpa.” Ang “pulutong” ay karaniwang katawagan para sa isang crowd at mas tiyak kaysa sa pangkalahatang “mga tao.”
  terminology: Ang “Kautusan” ay angkop para sa νόμος sa kontekstong Judio/Torah at tama ang kapitalisasyon. Ang “mga isinumpa” ay pinananatili ang plural at ang matinding hatol ng mga nagsasalita; hindi ito nagpapahiwatig ng pagsang-ayon ng tagapagsalaysay.
  issues:
  - severity: low
    issue: Hindi sapat na tiyak ang “mga taong ito” para sa ὁ ὄχλος οὗτος.
    rationale: Ang Griyego ay tumutukoy sa isang crowd/pulutong, hindi lamang sa mga indibidwal na tao. Ang “pulutong na ito” ay mas tapat at likas pa rin.
  revised_text: Ngunit ang pulutong na ito na hindi nakaaalam ng Kautusan[b] ay mga isinumpa[a].
