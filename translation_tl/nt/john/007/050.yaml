base_translation:
  language: en
  yaml_path: translation/nt/john/007/050.yaml
  text: Nicodemus[a], the one who had come to him earlier, being one of them, said to them,
translation:
  language: tl
  text: Sinabi sa kanila ni Nicodemo[a], na naunang pumunta kay Jesus at isa sa kanila,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na pumunta kay Jesus dati.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: Sinabi
  rationale: Ginamit ang pangnagdaang anyo para sa likas na daloy ng salaysay sa Tagalog, bagaman historical present ang Griyego.
- source_word: Νικόδημος
  choice: Nicodemo
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Tagalog.
- source_word: πρὸς αὐτούς
  choice: sa kanila
  rationale: Pagkatapos ng pandiwa ng pagsasalita, tinutukoy ng parirala ang mga kinausap ni Nicodemo.
- source_word: ὁ ἐλθὼν πρὸς αὐτὸν πρότερον
  choice: siyang pumunta kay Jesus noon
  rationale: Ang pariralang pandiwari ay nagpapakilala kay Nicodemo sa pamamagitan ng dati niyang pagpunta. Nilinaw sa teksto ang likas na tinutukoy ng αὐτόν ayon sa konteksto ng Juan 3:1–2; ang 'noon' ay natural na nagsasaad ng naunang pagkakataon.
- source_word: εἷς ὢν ἐξ αὐτῶν
  choice: na isa sa kanila
  rationale: Pinananatili itong impormasyong naglalarawan sa pagiging kabilang ni Nicodemo sa pangkat, nang hindi binibigyan ng tahasang panahilan na kahulugan.
theological_decisions:
- issue: Ang tinutukoy ng αὐτόν sa pariralang ὁ ἐλθὼν πρὸς αὐτὸν πρότερον
  choice: Jesus
  alternative: Panatilihin ang panghalip na 'kanya' at ipaliwanag lamang sa talababa.
  rationale: Malinaw sa mas malawak na salaysay na si Nicodemo ang pumunta kay Jesus (Juan 3:1–2). Sa Tagalog, magiging malabo o hindi likas ang 'pumunta sa kanya' dahil si Nicodemo ang pinakamalapit na maaaring pagbatayan ng panghalip.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Inuna ang pangunahing sugnay at ginamit ang mga gitling upang maging madaling sundan ang dalawang paglalarawan kay Nicodemo habang pinananatili ang diwa ng appositional na ayos ng Griyego.
