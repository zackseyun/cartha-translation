  text: Οὐ Μωϋσῆς ⸀δέδωκεν ὑμῖν τὸν νόμον; καὶ οὐδεὶς ἐξ ὑμῶν ποιεῖ τὸν νόμον. τί με ζητεῖτε ἀποκτεῖναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/019.yaml
  text: Did not Moses give you the law? Yet none of you keeps the law[b][a]. Why are you seeking to kill me?
translation:
  language: tl
  text: Hindi ba ibinigay ni Moises sa inyo ang Kautusan? Ngunit walang sinuman sa inyo ang tumutupad sa Kautusan.[a] Bakit ninyo ako sinisikap na patayin?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na, “ginagawa ang Kautusan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ ... δέδωκεν
  choice: Hindi ba ibinigay
  rationale: Ang οὐ sa pasimula ng tanong ay nagpapahiwatig na inaasahan ang sagot na oo. Ang perpektong δέδωκεν ay likas na maisasalin sa Tagalog bilang “ibinigay,” at malinaw pa rin ang nananatiling kabuluhan ng pagkakaloob ng Kautusan.
- source_word: Μωϋσῆς
  choice: Moises
  rationale: Ginamit ang karaniwang anyo ng pangalang biblikal sa modernong Filipino.
- source_word: τὸν νόμον
  choice: ang Kautusan
  rationale: Tumutukoy ito sa Kautusang ibinigay sa Israel sa pamamagitan ni Moises. Ang malaking titik ay tumutulong na ipakitang tiyak na Kautusang Mosaiko ang tinutukoy, hindi batas sa pangkalahatan.
- source_word: καὶ
  choice: Ngunit
  rationale: 'Bagaman karaniwang nangangahulugang “at” ang καί, adversatibo ang puwersa rito: ibinigay ang Kautusan, ngunit walang tumutupad dito.'
- source_word: οὐδεὶς ἐξ ὑμῶν
  choice: walang sinuman sa inyo
  rationale: Natural at mariing ipinahahayag nito ang lubos na pagkakaila ng pariralang Griyego.
- source_word: ποιεῖ τὸν νόμον
  choice: tumutupad sa Kautusan
  rationale: Literal itong “gumagawa ng Kautusan,” ngunit sa kontekstong ito ang idiomatikong kahulugan ay pagsunod o pagtupad dito. Pinananatili ng saling ito ang diwa sa natural na Filipino.
- source_word: τί
  choice: Bakit
  rationale: Sa konstruksiyong ito, ang τί ay humihingi ng dahilan at natural na isinasaling “Bakit.”
- source_word: ζητεῖτε ἀποκτεῖναι
  choice: pinagsisikapang patayin
  rationale: Ipinahihiwatig ng kasalukuyang panahunan ang nagpapatuloy na layunin o pagtatangka. Ang “pinagsisikapang” ay nagpapanatili sa diwa ng aktibong paghahangad nang hindi lamang sinasabing nagtagumpay na ang pagtatangka.
- source_word: ἀποκτεῖναι
  choice: patayin
  rationale: Direkta at karaniwang katumbas ito ng infinitibong nangangahulugang pumatay o kitlin ang buhay.
theological_decisions:
- issue: Tinutukoy ng “Kautusan”
  choice: Ang Kautusang Mosaiko na ibinigay sa pamamagitan ni Moises
  alternative: Kautusang moral o batas sa pangkalahatan
  rationale: Dahil tahasang binanggit si Moises bilang nagbigay nito, ang νόμος ay tumutukoy sa Kautusang Mosaiko/Torah. Hindi na nagdagdag ng paliwanag sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Pinili ang “tumutupad sa Kautusan” sa halip na literal ngunit di-likas na “gumagawa ng Kautusan.” Hindi kailangan ng hiwalay na talababa para sa aspektong perpekto ng δέδωκεν sapagkat ang Tagalog na “ibinigay” ay natural at hindi lumilikha ng kaparehong sapilitang pagpili gaya sa Ingles.
