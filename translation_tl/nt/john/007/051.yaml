  text: Μὴ ὁ νόμος ἡμῶν κρίνει τὸν ἄνθρωπον ἐὰν μὴ ἀκούσῃ ⸂πρῶτον παρ’ αὐτοῦ⸃ καὶ γνῷ τί ποιεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/051.yaml
  text: Our law does not judge a man unless it first hears from him and knows what he is doing[b][a], does it?
translation:
  language: tl
  text: “Hindi ba humahatol ang ating kautusan sa isang tao malibang pakinggan muna nito ang panig niya at alamin kung ano ang ginagawa niya?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ
  choice: ba ... nang hindi
  rationale: Ang μή sa pasimula ay nagpapahiwatig ng retorikal na tanong na umaasang ‘hindi’ ang sagot. Likas sa Tagalog ang anyong ‘Hinahatulan ba ... nang hindi...?’ upang ihatid ito.
- source_word: ὁ νόμος ἡμῶν
  choice: ating kautusan
  rationale: Tumutukoy ito sa pamantayang legal ng mga Judio na tinawag ni Nicodemo na ‘atin.’ Ang ‘kautusan’ ay dignified at malinaw nang hindi nililimitahan ang tinutukoy sa Pentateuco lamang.
- source_word: κρίνει
  choice: hinahatulan
  rationale: Sa legal na konteksto, ang ‘hinahatulan’ ay natural na katumbas ng paglalapat ng hatol o paghatol sa isang tao. Hindi nito kinakailangang ipakahulugan na ‘kinokondena,’ bagaman maaari itong marinig bilang paghatol laban sa isang tao.
- source_word: τὸν ἄνθρωπον
  choice: isang tao
  rationale: Ang ἄνθρωπον ay pangkalahatang isahan. Ang ‘isang tao’ ay natural at tumpak sa modernong Tagalog at hindi nagpapahiwatig ng isang partikular na lalaki.
- source_word: ἐὰν μὴ
  choice: nang hindi
  rationale: Sa ayos ng retorikal na tanong sa Tagalog, malinaw na naihahayag ng ‘nang hindi’ ang kinakailangang kondisyong negatibo.
- source_word: ἀκούσῃ πρῶτον παρ’ αὐτοῦ
  choice: hindi muna siya pinakikinggan
  rationale: Pinananatili ng ‘muna’ ang πρῶτον at ng ‘pinakikinggan’ ang ideya ng direktang pagdinig sa taong nasasakdal. Natural ito sa kontekstong legal.
- source_word: καὶ γνῷ τί ποιεῖ
  choice: at inaalam kung ano ang ginagawa niya
  rationale: Ang γνῷ ay aorist subjunctive na tumutukoy sa pagkakaroon ng kaalaman sa mga katotohanan; ang ‘inaalam’ ay idiomatikong nagpapahayag ng pagtiyak o pag-alam. Ang ‘ginagawa niya’ ay nagpapanatili sa presenteng anyo ng ποιεῖ.
