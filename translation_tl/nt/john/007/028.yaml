    issue: Ang pangatlong “ngunit” sa draft ay ginagawang malayang adversative clause ang ὃν ὑμεῖς οὐκ οἴδατε.
    rationale: 'Ang Griyego ay isang relative clause na tuwirang tumutukoy sa “ang nagsugo sa akin”: “na hindi ninyo kilala.” Ang “ngunit hindi ninyo siya kilala” ay nauunawaan pa rin ngunit nagdaragdag ng kontrast na hindi minamarka ng source.'
  - severity: low
    issue: Ang unang “Ngunit” ay inilagay bago sa “hindi ako naparito,” samantalang ang ἀλλά ay nagpapakilala sa kasunod na pahayag tungkol sa nagsugo.
    rationale: Mas maayos na panatilihin ang “At hindi ako naparito...” para sa καί at ilagay ang “Ngunit” sa “ang nagsugo sa akin ay tunay,” alinsunod sa paghahati ng Griyego.
