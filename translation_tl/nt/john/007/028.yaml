id: JHN.7.28
reference: John 7:28
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἔκραξεν οὖν ἐν τῷ ἱερῷ διδάσκων ὁ Ἰησοῦς καὶ λέγων· Κἀμὲ οἴδατε καὶ οἴδατε πόθεν εἰμί· καὶ ἀπ’ ἐμαυτοῦ οὐκ ἐλήλυθα, ἀλλ’ ἔστιν ἀληθινὸς ὁ πέμψας με, ὃν ὑμεῖς οὐκ οἴδατε·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/028.yaml
  text: So Jesus cried out in the temple[a], teaching and saying, “You know me, and you know where I am from. And I have not come from myself, but the one who sent me is true[c][b], whom you do not know.”
translation:
  language: tl
  text: Kaya, habang nagtuturo si Jesus sa templo, sumigaw siya, “Kilala ninyo ako at alam ninyo kung saan ako nagmula.[a] At hindi ako naparito sa sarili kong pagkukusa.[b] Ngunit ang nagsugo sa akin ay tunay,[c] na hindi ninyo kilala.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring marinig sa konteksto ang pahayag na ito bilang hamon o kabalintunaan, ngunit paturol ang anyo nito sa Griyego.
    reason: alternative_reading
  - marker: b
    text: 'Mas literal: “mula sa sarili ko.” Maaari rin itong isaling “nang kusa” o “sa sarili kong kapasyahan.”'
    reason: lexical_alternative
  - marker: c
    text: Ang “tunay” ay maaari ring magtaglay ng diwang “totoo” o “hindi huwad” sa paggamit ni Juan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκραξεν
  choice: sumigaw
  rationale: Ipinahihiwatig nito ang malakas at hayagang pagsasalita sa gitna ng pagtuturo, nang hindi ipinapalagay na dahil iyon sa takot o dalamhati.
- source_word: ἐν τῷ ἱερῷ
  choice: sa templo
  rationale: Ang ἱερόν ay tumutukoy sa buong nasasakupan ng templo, hindi lamang sa panloob na santuwaryo. Likas at sapat ang “sa templo” sa Filipino.
- source_word: διδάσκων ... καὶ λέγων
  choice: habang nagtuturo ... sumigaw siya
  rationale: Ginagawang malinaw na nangyari ang malakas na pagsasalita sa nagpapatuloy na gawain ni Jesus na pagtuturo; hindi na inuulit ang “at sinabi” dahil magiging mabigat at di-likas iyon sa Filipino.
- source_word: Κἀμὲ οἴδατε
  choice: Kilala ninyo ako
  rationale: Pinananatili ang tuwirang pahayag at diin sa pagkakilala kay Jesus sa natural na Filipino.
- source_word: οἴδατε πόθεν εἰμί
  choice: alam ninyo kung saan ako nagmula
  rationale: Pinananatiling bukas ang kahulugan ng pinagmulan—maaaring marinig bilang heograpikal o bilang mas malalim na pinagmulan—nang hindi ito nililinaw nang higit sa Griyego.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: sa sarili kong pagkukusa
  rationale: Likas na ipinapahayag sa Filipino ang diwang hindi naparito si Jesus sa sariling pasiya o awtoridad. Inilalahad sa talababa ang mas literal na anyo.
- source_word: οὐκ ἐλήλυθα
  choice: hindi ako naparito
  rationale: Ang “naparito” ay natural na nagpapahayag ng pagdating na may kaugnayan sa kasalukuyang kinaroroonan at misyon ni Jesus.
- source_word: ἀληθινὸς
  choice: tunay
  rationale: Saklaw ng “tunay” ang pagiging totoo, tunay na umiiral, o tunay sa ganap na diwa, na mahalagang himig sa paggamit ni Juan.
- source_word: ὁ πέμψας με
  choice: ang nagsugo sa akin
  rationale: Pinananatili ang personal na tagapagsugo nang hindi idinaragdag ang titulong “Ama,” na wala sa mismong sugnay.
- source_word: ὃν ὑμεῖς οὐκ οἴδατε
  choice: hindi ninyo siya kilala
  rationale: Natural at tuwirang ipinapahayag ang paratang na hindi nila kilala ang nagsugo kay Jesus.
theological_decisions:
- issue: Kung ang “Kilala ninyo ako at alam ninyo kung saan ako nagmula” ay tahasang pahayag o retorikal na tanong
  choice: Pinanatili bilang tahasang pahayag
  alternative: “Kilala ninyo ako at alam ninyo kung saan ako nagmula?” o isang saling hayagang nagpapahiwatig ng panunuya
  rationale: Paturol ang anyong Griyego, bagaman maaaring may himig ng hamon o kabalintunaan ayon sa konteksto. Hindi nilutas ng salin ang sadyang tensiyong ito.
- issue: Lawak ng kahulugan ng pinagmulan ni Jesus
  choice: Hindi nilimitahan ang “kung saan ako nagmula” sa heograpiya o tahasang pinalitan ng makalangit na pinagmulan
  alternative: Tanging bayang pinagmulan o tahasang “mula sa langit”
  rationale: Madalas na may magkakapatong na antas ng kahulugan ang pinagmulan ni Jesus sa Juan. Pinananatili ng salita ang puwang para sa mga antas na iyon.
- issue: Tinutukoy ng “ang nagsugo sa akin”
  choice: Hindi tahasang pinangalanang “Ama”
  alternative: “Ang Ama na nagsugo sa akin”
  rationale: Bagaman malinaw sa mas malawak na konteksto ng Juan ang tinutukoy, hindi ginagamit ng sugnay na ito ang pangalang “Ama,” kaya hindi ito idinagdag.
- issue: Kahulugan ng ἀληθινός bilang katangian ng nagsugo
  choice: “tunay”
  alternative: “tapat” o “mapagkakatiwalaan”
  rationale: Ang “tunay” ay hindi nagpapaliit sa salita tungo lamang sa katapatan sa pagsasalita; napapanatili nito ang Johannine na diwa ng pagiging tunay o ganap na real.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ninyo” at “siya” para sa likas na pampublikong pananalita. Iniwasan ang sobrang literal na ayos na magiging alanganin sa Filipino, habang pinanatili ang deklaratibong anyo, ang usapin ng pinagmulan, at ang di-tahasang pagkakakilanlan ng nagsugo.
