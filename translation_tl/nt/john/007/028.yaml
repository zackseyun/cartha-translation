revisions:
- from: Kaya, habang nagtuturo si Jesus sa templo, sumigaw siya, “Kilala ninyo ako at alam ninyo kung saan ako nagmula.[a] Ngunit hindi ako naparito sa sarili kong pagkukusa.[b] Ang nagsugo sa akin ay tunay,[c] ngunit hindi ninyo siya kilala.”
  to: Kaya, habang nagtuturo si Jesus sa templo, sumigaw siya, “Kilala ninyo ako at alam ninyo kung saan ako nagmula.[a] At hindi ako naparito sa sarili kong pagkukusa.[b] Ngunit ang nagsugo sa akin ay tunay,[c] na hindi ninyo kilala.”
  rationale: Inayos ang mga pangatnig at ang huling relative clause upang maipakita nang mas tapat ang “καὶ ... οὐκ ... ἀλλ’ ... ὃν,” nang hindi binabago ang natural na modernong Filipino, ang sinadyang kalabuan tungkol sa pinagmulan ni Jesus, o ang di-tahasang pagkakakilanlan ng nagsugo sa kanya.
