  text: τινὲς δὲ ἤθελον ἐξ αὐτῶν πιάσαι αὐτόν, ἀλλ’ οὐδεὶς ⸀ἐπέβαλεν ἐπ’ αὐτὸν τὰς χεῖρας.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/044.yaml
  text: But some of them wanted to seize him[b][a], yet no one laid hands on him.
translation:
  language: tl
  text: Ngunit may ilan sa kanila na gustong dakpin siya, ngunit walang sinumang humawak sa kanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τινὲς δὲ
  choice: Ngunit may ilan
  rationale: Ipinahahayag ng τινὲς ang isang di-tiyak na bahagi ng pangkat, at minamarkahan ng δέ ang pagsalungat sa naunang magkakaibang tugon ng mga tao.
- source_word: ἤθελον
  choice: gustong
  rationale: Natural na modernong Tagalog para sa hangarin nila noon; hindi nito labis na tinutukoy kung sinimulan ba nila ang pagkilos.
- source_word: ἐξ αὐτῶν
  choice: sa kanila
  rationale: Ipinakikitang ang ilan ay kabilang sa mas malaking pangkat. Ang pariralang “may ilan sa kanila” ay malinaw at natural sa Tagalog.
- source_word: πιάσαι
  choice: dakpin
  rationale: Sa kontekstong ito, ang paghawak kay Jesus ay may layuning arestuhin siya. Ang “dakpin” ay natural at pinananatili ang puwersa ng pisikal na pagsunggab nang hindi gumagamit ng teknikal na terminong legal.
- source_word: ἀλλ’ οὐδεὶς
  choice: pero walang sinuman
  rationale: Malinaw na inilalahad ang matinding pagsalungat sa pagitan ng kanilang hangarin at ng aktuwal na kinalabasan.
- source_word: ἐπέβαλεν ἐπ’ αὐτὸν τὰς χεῖρας
  choice: humawak sa kanya
  rationale: Natural na Tagalog para sa idyomang Griyego na tumutukoy sa aktuwal na pagdakip o marahas na paghawak; iniiwasan ang “pinatungan ng kamay,” na maaaring magpahiwatig ng pagpapala o pagtatalaga sa Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, maikli, at marangal. Ginamit ang “dakpin” sa unang sugnay upang ihayag ang kontekstuwal na layuning arestuhin siya, at “humawak sa kanya” sa ikalawa upang mapanatili ang pagkakaiba ng dalawang pandiwang Griyego at maiwasan ang di-natural o maling relihiyosong pahiwatig ng literal na “ipinatong ang mga kamay.”
