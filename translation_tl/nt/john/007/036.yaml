base_translation:
  language: en
  yaml_path: translation/nt/john/007/036.yaml
  text: What is this statement that he said[a], ‘You will seek me and will not find me, and where I am[c][b], you are not able to come’?”
translation:
  language: tl
  text: “Ano itong pahayag na sinabi niya[a], ‘Hahanapin ninyo ako at hindi ninyo ako matatagpuan, at kung nasaan ako[b], hindi kayo makakapunta’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Ano itong salita na sinabi niya?” Ang Griyegong λόγος ay maaaring mangahulugang “salita,” “pahayag,” “mensahe,” o “sinabi,” ayon sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: Isinasalin ito ng ilan na “kung saan ako pupunta,” ngunit ang tekstong Griyego rito ay literal na “kung nasaan ako.” Pinananatili ng salin ang tensiyon sa pananalita ni Jesus.
    reason: alternative_reading
lexical_decisions:
- source_word: λόγος
  choice: sinabi
  rationale: Sa kontekstong ito, tumutukoy ang λόγος sa nilalaman ng sinabi ni Jesus. Likas at malinaw sa modernong Tagalog ang “sinabi,” habang maaari ring isalin na “salita” o “pahayag.”
- source_word: τίς ἐστιν ὁ λόγος οὗτος
  choice: Ano itong sinabi niya
  rationale: Pinananatili nito ang tanong tungkol sa mismong sinabi, hindi agad ipinapakahulugang “Ano ang ibig sabihin nito?” Natural din ito sa kasalukuyang Tagalog.
- source_word: Ζητήσετέ με
  choice: Hahanapin ninyo ako
  rationale: Karaniwang katumbas ng ζητέω sa kontekstong ito ang “hanapin.” Ang anyong panghinaharap ay pinananatili.
- source_word: οὐχ εὑρήσετε
  choice: hindi ninyo ako matatagpuan
  rationale: Tuwirang pinananatili ang panghinaharap na pagtanggi. Inuulit ang “ako” upang maging malinaw at natural sa Tagalog.
- source_word: ὅπου εἰμὶ ἐγὼ
  choice: kung nasaan ako
  rationale: Eksaktong pinananatili ang pangkasalukuyang εἰμί, “ako ay/naroon ako,” sa halip na idagdag ang ideyang “pupunta.”
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: hindi kayo makakapunta
  rationale: Natural na Tagalog ito para sa kawalan ng kakayahang makarating o pumunta sa kinaroroonan ng nagsasalita.
- source_word: εἶπε
  choice: sinabi niya
  rationale: Ang aorist ng λέγω ay payak at likas na isinasaling “sinabi.”
theological_decisions:
- issue: Pangkasalukuyang anyo sa sinabi ni Jesus (“kung nasaan ako”)
  choice: Pinanatili ang “kung nasaan ako.”
  alternative: “kung saan ako pupunta”
  rationale: Pangkasalukuyan ang εἰμί sa tekstong Griyego, hindi pandiwa ng pagpunta. Pinananatili ng salin ang sinadyang tensiyon sa pananalita sa Juan at hindi ito nilulutas sa pamamagitan ng pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “makakapunta” sa halip na mas pormal ngunit mabigat na “hindi ninyo kayang pumaroon.” Pinanatiling isang tuloy-tuloy na sipi ang dalawang sugnay na pinag-uugnay ng καί.
