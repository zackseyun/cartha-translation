  text: ⸀Εἶπεν αὐτοῖς ὁ Ἰησοῦς· Ἐγώ εἰμι ὁ ἄρτος τῆς ζωῆς· ὁ ἐρχόμενος πρὸς ἐμὲ οὐ μὴ πεινάσῃ, καὶ ὁ πιστεύων εἰς ⸀ἐμὲ οὐ μὴ ⸀διψήσει πώποτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/035.yaml
  text: Jesus said to them, “I am the bread of life; the one who comes to me will never hunger, and the one who believes in me will never thirst again.”
translation:
  language: tl
  text: Sinabi ni Jesus sa kanila, “Ako ang tinapay ng buhay. Ang lumalapit sa akin ay hindi kailanman magugutom, at ang sumasampalataya sa akin ay hindi kailanman mauuhaw.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “hinding-hindi mauuhaw kailanman.” Mariin ang pagtanggi sa Griyego at may salitang nangangahulugang “kailanman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν αὐτοῖς ὁ Ἰησοῦς
  choice: Sinabi sa kanila ni Jesus
  rationale: Likas na ayos sa makabagong Tagalog para sa panimulang pangungusap sa salaysay; pinananatili ang di-tuwirang layon na αὐτοῖς.
- source_word: Ἐγώ εἰμι
  choice: Ako ang
  rationale: Sa panaguring pangngalan sa Tagalog, natural na katumbas ito ng tahasang pagkakakilanlang “I am,” habang nananatili ang diin sa “Ako.”
- source_word: ὁ ἄρτος τῆς ζωῆς
  choice: ang tinapay ng buhay
  rationale: Malapit at malinaw na salin na nagpapanatili sa metapora at sa genitibong parirala; hindi nito agad ipinapakahulugang “tinapay na nagbibigay-buhay.”
- source_word: ὁ ἐρχόμενος πρὸς ἐμέ
  choice: ang lumalapit sa akin
  rationale: Ang substantival present participle ay natural na naipahahayag sa “ang lumalapit,” na nagpapanatili sa pangkalahatan at nagpapatuloy na diwa.
- source_word: οὐ μὴ πεινάσῃ
  choice: ay hindi kailanman magugutom
  rationale: Ipinahahayag ng “hindi kailanman” ang mariing pagtangging οὐ μή sa likas na Tagalog.
- source_word: ὁ πιστεύων εἰς ἐμέ
  choice: ang sumasampalataya sa akin
  rationale: Ang “sumasampalataya sa” ay matatag at malinaw na katumbas ng Johannine πιστεύω εἰς, at pinananatili ang ugnayang nakatuon kay Jesus.
- source_word: οὐ μὴ διψήσει πώποτε
  choice: ay hindi kailanman mauuhaw
  rationale: Pinagsasama ng “hindi kailanman” ang mariing οὐ μή at ang temporal na πώποτε nang hindi idinaragdag ang diwang “muli,” na wala sa Griyego.
theological_decisions:
- issue: Kahulugan ng πιστεύων εἰς ἐμέ
  choice: ang sumasampalataya sa akin
  alternative: ang nagtitiwala sa akin
  rationale: Pinananatili ng “sumasampalataya” ang karaniwang katawagang kaugnay ng πιστεύω at ang teolohikal na saklaw nito; lehitimong himig ang “nagtitiwala,” ngunit mas makitid kung gagawing pangunahing salin.
- issue: Diin ng Ἐγώ εἰμι
  choice: Ako ang
  alternative: Ako mismo ang
  rationale: Sapat na ipinahahayag ng tahasang “Ako” ang pagkakakilanlan at diin nang hindi nagdaragdag ng labis na pagpapakahulugang teolohikal.
- issue: Saklaw ng οὐ μὴ διψήσει πώποτε
  choice: hindi kailanman mauuhaw
  alternative: hinding-hindi mauuhaw kailanman
  rationale: Pinananatili ang mariin at walang-takdang pagtanggi. Hindi ginamit ang “mauuhaw muli” sapagkat ang πώποτε ay “kailanman/ever,” hindi “muli/again.”
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “sumasampalataya” bilang pamilyar ngunit hindi sektaryong katawagan. Ang panandang [a] ay inilagay pagkatapos ng sugnay na tinutukoy nito.
