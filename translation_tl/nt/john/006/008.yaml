  yaml_path: translation/nt/john/006/008.yaml
  text: One of his disciples, Andrew, Simon Peter’s brother, said to him,
translation:
  language: tl
  text: Sinabi sa kanya ng isa sa kanyang mga alagad, si Andres, na kapatid ni Simon Pedro,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: Sinabi
  rationale: Ang historikal na pangkasalukuyan sa Griyego ay likas na isinasalin sa nagdaang panahunan sa makabagong salaysay sa Tagalog.
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Tuwirang ipinapahayag ang di-tuwirang layon ng pagsasalita; sa konteksto, tumutukoy ito kay Jesus.
- source_word: εἷς ἐκ τῶν μαθητῶν αὐτοῦ
  choice: ng isa sa kanyang mga alagad
  rationale: Likas at tumpak na Tagalog para sa partitive na kayariang εἷς ἐκ na sinusundan ng genitive plural.
- source_word: μαθητῶν
  choice: mga alagad
  rationale: Karaniwang katawagan sa Tagalog para sa mga μαθηταί ni Jesus at pinananatili ang diwa ng pagsunod at pagkatuto.
- source_word: Ἀνδρέας
  choice: Andres
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa Bibliyang Tagalog.
- source_word: ὁ ἀδελφὸς Σίμωνος Πέτρου
  choice: na kapatid ni Simon Pedro
  rationale: Natural na pariralang Tagalog na nagpapakilala kay Andres sa pamamagitan ng kaugnayan niya kay Simon Pedro.
- source_word: Σίμωνος Πέτρου
  choice: Simon Pedro
  rationale: Pinanatili bilang magkasamang pangalan ang pamilyar na pagtukoy sa iisang tao.
