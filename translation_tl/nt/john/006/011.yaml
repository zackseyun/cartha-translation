  text: ἔλαβεν ⸀οὖν τοὺς ἄρτους ὁ Ἰησοῦς καὶ εὐχαριστήσας ⸀διέδωκεν τοῖς ἀνακειμένοις, ὁμοίως καὶ ἐκ τῶν ὀψαρίων ὅσον ἤθελον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/011.yaml
  text: So Jesus took the loaves[a], and after giving thanks he distributed them to those who were reclining; likewise also from the fish[b], as much as they wanted.
translation:
  language: tl
  text: Kaya kinuha ni Jesus ang mga tinapay at, pagkatapos magpasalamat, ipinamahagi niya ang mga ito sa mga nakahilig habang kumakain[a]. Gayundin, namahagi siya mula sa mga isda[b], ayon sa dami ng gusto nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga nakaupo.” Mas literal na sinasabi ng Griyego na “sa mga nakahilig,” ang karaniwang ayos ng katawan kapag kumakain noong panahong iyon.
    reason: lexical_alternative
  - marker: b
    text: O “mula sa maliliit na isda.” Maaaring tumukoy ang salitang Griyego sa isdang kinakain kasabay ng tinapay, marahil ay maliliit na isda.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Ipinahihiwatig ng οὖν ang pagpapatuloy at bunga ng naunang pangyayari. Likas sa modernong Tagalog ang “Kaya” at pinananatili nito ang ugnayan sa konteksto.
- source_word: τοὺς ἄρτους
  choice: ang mga tinapay
  rationale: Maaaring tumukoy ang ἄρτος sa tinapay sa pangkalahatan o sa mga piraso/bilog na tinapay. Ang “mga tinapay” ay natural at sapat na tiyak nang hindi ipinipilit ang anyo o laki ng mga ito.
- source_word: εὐχαριστήσας
  choice: pagkatapos magpasalamat
  rationale: Ipinapakita ng aorist participle na nauna ang pagpapasalamat sa pamamahagi. Hindi tahasang dinaragdagan ng salin ang Diyos bilang layon sapagkat hindi ito binanggit sa pariralang Griyego.
- source_word: διέδωκεν
  choice: ipinamahagi niya
  rationale: Ang διαδίδωμι ay nagpapahiwatig ng pamamahagi sa maraming tao, hindi lamang ng payak na pagbibigay.
- source_word: τοῖς ἀνακειμένοις
  choice: sa mga nakahilig para kumain
  rationale: Ang ἀνάκειμαι ay karaniwang tumutukoy sa paghilig bilang ayos ng katawan sa pagkain noong panahong iyon. Pinananatili ng salin ang larawang ito habang nililinaw ang konteksto.
- source_word: ὁμοίως καὶ
  choice: Ganoon din ang ginawa niya
  rationale: Likas na ipinapahayag sa Tagalog ang magkatulad na ginawa sa tinapay at sa isda, habang pinananatili ang mariing pagkakapantay ng dalawang kilos.
- source_word: ἐκ τῶν ὀψαρίων
  choice: sa mga isda
  rationale: Ang ὀψάριον ay maaaring tumukoy sa isdang kasabay ng tinapay at posibleng maliliit na isda. “Mga isda” ang pinakanatural na pangunahing salin; inilalagay sa talababa ang posibleng detalye tungkol sa laki.
- source_word: ὅσον ἤθελον
  choice: hangga’t gusto nila
  rationale: Ipinahahayag ng parirala na nakatanggap ang mga tao ayon sa daming nais nila. Ang “hangga’t gusto nila” ay malinaw at natural sa kasalukuyang Tagalog.
theological_decisions:
- issue: Posibleng pahiwatig ng Eukaristiya sa εὐχαριστήσας
  choice: Isinalin bilang “magpasalamat” nang walang dagdag na sakramental na paliwanag
  alternative: Isalin bilang “magbasbas” o tahasang banggitin ang Eukaristiya
  rationale: Ang pandiwa ay tahasang nangangahulugang magpasalamat. Maaaring may mas malawak na teolohikal na pahiwatig sa salaysay, ngunit hindi iyon dapat idagdag sa mismong teksto ng salin.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang detalye ng paghilig sa pagkain at ang di-tiyak na laki ng mga isda; iniwasan ang teknikal o denominasyonal na pagpapalawak.
