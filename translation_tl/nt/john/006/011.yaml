  naturalness: Likas at malinaw ang karamihan ng Tagalog. Mas idiomatiko at mas eksakto ang “habang kumakain” kaysa “para kumain” para sa mga taong nasa ayos ng pagkain, at ang “ayon sa dami ng gusto nila” ay malinaw na panumbas sa ὅσον ἤθελον.
  terminology: Ang “magpasalamat” ay wastong salin ng εὐχαριστήσας at hindi nagdaragdag ng sakramental na pakahulugan. Ang “mga tinapay,” “ipinamahagi,” at “mga isda” ay angkop. Pinananatili ng mga talababa ang alternatibong “nakaupo” at ang posibleng kahulugang maliliit na isda nang hindi ito ipinipilit sa pangunahing teksto.
