base_translation:
  language: en
  yaml_path: translation/nt/john/006/032.yaml
  text: So Jesus said to them[a], “Truly, truly, I say to you, Moses has not given you the bread from heaven[b], but my Father gives you the true bread from heaven.”
translation:
  language: tl
  text: 'Kaya sinabi sa kanila ni Jesus, “Tunay na tunay na sinasabi ko sa inyo: hindi si Moises ang nagbigay sa inyo ng tinapay mula sa langit[a], kundi ang aking Ama ang nagbibigay sa inyo ng tunay na tinapay[b] mula sa langit.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “hindi ibinigay sa inyo ni Moises ang tinapay mula sa langit.” Sa Griyego, nauuna ang pagtanggi bago ang “Moises,” kaya binibigyang-diin ang pagkakaiba kung sino ang nagbigay.
    reason: lexical_alternative
  - marker: b
    text: Ang “tunay” ay maaari ring mangahulugang “totoo” o “ganap.” Maaaring tumukoy ito sa tinapay mula sa langit bilang tunay na realidad, hindi lamang sa naunang manna bilang tanda.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Ipinagpapatuloy nito ang usapan at ipinakikitang tugon ang sinabi ni Jesus sa naunang pahayag; natural ito sa makabagong Tagalog.
- source_word: Ἀμὴν ἀμὴν
  choice: Tunay na tunay
  rationale: Pinananatili ang pag-uulit at taimtim na diin ng natatanging pormula ni Jesus sa Juan, habang nananatiling malinaw sa karaniwang mambabasa.
- source_word: λέγω ὑμῖν
  choice: sinasabi ko sa inyo
  rationale: Malinaw at tuwirang katumbas ng parirala, at ang aspektong nagaganap ng pandiwang Tagalog ay angkop sa pahayag ni Jesus.
- source_word: οὐ Μωϋσῆς δέδωκεν ὑμῖν
  choice: hindi si Moises ang nagbigay sa inyo
  rationale: Ang hulma na “hindi si Moises ang” ay natural sa Tagalog at malinaw na pinagtutuunan ang pagsalungat sa tagapagbigay, gaya ng ayos ng Griyego. Ang “nagbigay” ay angkop na tumutukoy sa naunang pagbibigay ng manna.
- source_word: τὸν ἄρτον ἐκ τοῦ οὐρανοῦ
  choice: tinapay mula sa langit
  rationale: Natural na Tagalog ito at pinananatili ang larawan at pinagmulan na ipinahahayag ng ἐκ τοῦ οὐρανοῦ.
- source_word: ἀλλ’ ὁ πατήρ μου δίδωσιν ὑμῖν
  choice: kundi ang aking Ama ang nagbibigay sa inyo
  rationale: Ang “kundi” ay malinaw na naghaharap ng kasalungat na tagapagbigay. Pinananatili ng “nagbibigay” ang kasalukuyang aspeto ng δίδωσιν, kaiba sa naunang “nagbigay.”
- source_word: ὁ πατήρ μου
  choice: ang aking Ama
  rationale: Natural at marangal na anyong paari na hindi dinaragdagan o binabawasan ang natatanging pag-angkin ni Jesus sa Ama.
- source_word: τὸν ἀληθινόν
  choice: tunay na
  rationale: Pinananatili ng “tunay” ang maaaring kahulugang totoo, tunay na ganap, o ultimong realidad, nang hindi ito nililimitahan sa isang paliwanag lamang.
theological_decisions:
- issue: Pagkakaiba ng naunang pagbibigay na kaugnay ni Moises at ng kasalukuyang pagbibigay ng Ama
  choice: “nagbigay” para sa δέδωκεν at “nagbibigay” para sa δίδωσιν
  alternative: “ibinigay ... ibinibigay” o iba pang anyong hindi gaanong nagtatampok sa pagkakaiba ng aspekto
  rationale: Ipinakikita nito ang kaibahan ng manna sa nakaraan at ng pagbibigay ng Ama na inilalahad ni Jesus bilang kasalukuyang umiiral, nang hindi nagdaragdag ng doktrinal na paliwanag.
- issue: Kahulugan ng “tunay na tinapay”
  choice: Panatilihin ang “tunay na tinapay” sa pangunahing teksto
  alternative: “totoong tinapay,” “ganap na tinapay,” o “ultimong tinapay”
  rationale: Ang ἀληθινός sa Juan ay maaaring tumukoy sa tunay o ganap na realidad na higit sa naunang tanda. Pinananatili ng “tunay” ang lawak at teolohikal na tensiyong ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang taimtim na pag-uulit sa pambungad ni Jesus, ang diin sa pagkakaiba ng mga tagapagbigay, at ang temporal na kaibahan ng “nagbigay” at “nagbibigay.”
