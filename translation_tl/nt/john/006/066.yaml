id: JHN.6.66
reference: John 6:66
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἐκ τούτου πολλοὶ ⸀ἐκ ⸂τῶν μαθητῶν αὐτοῦ ἀπῆλθον⸃ εἰς τὰ ὀπίσω καὶ οὐκέτι μετ’ αὐτοῦ περιεπάτουν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/066.yaml
  text: From this time many of his disciples went back and no longer walked with him[a].
translation:
  language: tl
  text: Mula noon, marami sa kanyang mga alagad ang umurong at hindi na lumakad na kasama niya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Dahil dito, marami sa kanyang mga alagad ang umalis”; maaaring unawain ang pambungad na Griyego bilang nagsasaad ng sanhi, bagaman sa konteksto ay mas malinaw sa “Mula noon” ang diwa ng isang mahalagang pagbabagong nagsimula sa puntong iyon.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐκ τούτου
  choice: Mula noon
  rationale: Sa konteksto, ipinahihiwatig nito ang isang mahalagang pagbabagong nagsimula sa puntong iyon. Pinananatili ng “Mula noon” ang temporal na diwa nang hindi itinatanggi ang posibleng sanhiing pagbasa.
- source_word: πολλοὶ ἐκ τῶν μαθητῶν αὐτοῦ
  choice: marami sa kanyang mga alagad
  rationale: 'Likas sa makabagong Tagalog at pinananatili ang partitive na diwa: ang mga umurong ay marami mula sa mas malaking pangkat ng kanyang mga alagad.'
- source_word: ἀπῆλθον εἰς τὰ ὀπίσω
  choice: umurong
  rationale: Ipinahihiwatig ng pinagsamang parirala ang pag-atras o pagtalikod mula sa dati nilang pagsama kay Jesus, hindi lamang karaniwang pag-alis. Ang “umurong” ay maikli at hindi labis na nagpapakahulugan.
- source_word: οὐκέτι
  choice: hindi na
  rationale: Malinaw na ipinahihiwatig ang pagtigil mula sa puntong iyon.
- source_word: μετ’ αὐτοῦ περιεπάτουν
  choice: lumakad na kasama niya
  rationale: Pinananatili ang larawan ng paglakad at ang diwa ng patuloy na pakikisama, sa halip na tahasang gawing “sumunod,” na maaaring paliitin ang saklaw ng pahayag.
theological_decisions:
- issue: Kung ang μαθηταί ay dapat isaling para ipahiwatig ang Labindalawa o ang mga tunay na mananampalataya lamang
  choice: mga alagad
  alternative: mga tagasunod
  rationale: Tinatawag sila ng salaysay na mga alagad ni Jesus ngunit hindi sila ipinapantay sa Labindalawa at hindi rin nito tahasang nilulutas ang kalagayan ng kanilang pananampalataya. Pinananatili ng “mga alagad” ang teolohikal na tensiyon ng teksto.
- issue: Kung ang pag-urong ay dapat tahasang tawaging lubos na pagtalikod sa pananampalataya
  choice: umurong
  alternative: tumalikod
  rationale: Ang “umurong” ay tapat sa larawan ng pag-atras sa εἰς τὰ ὀπίσω ngunit hindi nagdaragdag ng tiyak na doktrinal na hatol na hindi tahasang sinasabi ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang metapora ng paglakad at iniwasan ang mga salitang magpapasya nang higit sa teksto tungkol sa espirituwal na kalagayan ng mga alagad.
