id: JHN.6.50
reference: John 6:50
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ ἄρτος ὁ ἐκ τοῦ οὐρανοῦ καταβαίνων ἵνα τις ἐξ αὐτοῦ φάγῃ καὶ μὴ ἀποθάνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/050.yaml
  text: This is the bread that comes down from heaven[b][a], so that anyone may eat from it and not die.
translation:
  language: tl
  text: Ito ang tinapay na bumababa mula sa langit, upang ang sinumang kumain mula rito ay hindi mamatay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “hindi mamatay” ay sadyang iniwang malawak. Sa konteksto, maaari itong unawain bilang kalayaan mula sa sukdulang kamatayan, espirituwal na kamatayan, o pagkawasak sa wakas.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτός
  choice: Ito
  rationale: Likas na demonstratibo sa Filipino na tuwirang tumutukoy sa tinapay na ipinakikilala ni Jesus.
- source_word: ἄρτος
  choice: tinapay
  rationale: Karaniwang kahulugan ng salita at pinananatili ang literal at metaporikal na puwersa nito sa Juan 6.
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβαίνων
  choice: na bumababa mula sa langit
  rationale: Pinananatili ng pangkasalukuyang anyong “bumababa” ang nagpapatuloy o matingkad na aspekto ng participle; natural ang sugnay na panuring sa Filipino.
- source_word: οὐρανός
  choice: langit
  rationale: Sa konteksto, tumutukoy ito sa makalangit na dako, hindi lamang sa pisikal na kalawakan.
- source_word: ἵνα
  choice: upang
  rationale: Malinaw at marangal na pagpapahayag ng layunin o kinalabasan.
- source_word: τις
  choice: ang sinuman
  rationale: Ipinahahayag ang pangkalahatan at bukás na puwersa ng di-tiyak na panghalip.
- source_word: ἐξ αὐτοῦ
  choice: mula rito
  rationale: Pinananatili ang ideya ng pagkain mula sa tinapay; ang “rito” ay natural na tumutukoy sa malapit na tinapay na ipinakikilala.
- source_word: φάγῃ
  choice: kumain
  rationale: Ang pandiwa sa sugnay na may “upang” ay natural na naghahatid ng subjunctive o layuning puwersa sa Filipino.
- source_word: μὴ ἀποθάνῃ
  choice: ay hindi mamatay
  rationale: Tuwirang isinasalin ang “die” nang hindi ipinapasok ang mas tiyak na interpretasyong espirituwal o eskatolohikal.
theological_decisions:
- issue: Kalikasan ng kamatayang tinutukoy sa “hindi mamatay”
  choice: Panatilihin ang payak at malawak na “hindi mamatay.”
  alternative: “hindi mamatay sa espiritu” o “hindi mapahamak magpakailanman”
  rationale: Hindi tahasang nililimitahan ng talata ang uri ng kamatayan. Pinananatili ng payak na pananalita ang teolohikal na lalim at tensiyon ng diskurso nang hindi nagtatakda ng sektaryang paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bumababa” sa halip na “bumaba” upang mapanatili ang pangkasalukuyang aspekto ng Griyego. Inilagay ang pananda ng talababa pagkatapos mismo ng pahayag na ipinaliliwanag nito.
