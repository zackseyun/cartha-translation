- from: Ngunit may dumating na mga bangka mula sa Tiberias, malapit sa lugar kung saan kinain nila ang tinapay matapos magpasalamat ang Panginoon.[a]
  to: Ngunit may mga bangkang mula sa Tiberias na dumating malapit sa lugar kung saan nila kinain ang tinapay pagkatapos magpasalamat ang Panginoon.[a]
  rationale: Inayos ang ayos ng pangungusap upang ang “malapit sa lugar” ay malinaw na tumukoy sa pagdating ng mga bangka, hindi sa Tiberias. Pinalitan din ang ayos ng mga panghalip sa sugnay na “kung saan nila kinain” para sa mas likas na modernong Filipino. Napanatili ang pagkakasunod na ang Panginoon ay nagpasalamat bago kinain ang tinapay at ang talababa para sa diminutibong πλοιάρια.
