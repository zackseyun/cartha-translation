base_translation:
  language: en
  yaml_path: translation/nt/john/006/023.yaml
  text: But boats came from Tiberias near the place where they ate the bread after the Lord had given thanks[a].
translation:
  language: tl
  text: Ngunit may mga bangkang mula sa Tiberias na dumating malapit sa lugar kung saan nila kinain ang tinapay pagkatapos magpasalamat ang Panginoon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “may dumating na maliliit na bangka mula sa Tiberias.” Anyong diminutibo ang salitang Griyego na πλοιάρια.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ngunit
  rationale: Ipinahahayag ang pagsalungat sa naunang kalagayan at angkop sa marangal na salaysay.
- source_word: ἦλθεν
  choice: may dumating
  rationale: Likas na Filipino para sa pagdating ng mga bangka; ang isahang pandiwa sa Griyego ay may maramihang neuter na simuno.
- source_word: πλοιάρια
  choice: mga bangka
  rationale: Malinaw at natural; maaaring magpahiwatig ang anyong diminutibo ng maliliit na bangka, kaya inilagay ang detalye sa talababa.
- source_word: ἐκ Τιβεριάδος
  choice: mula sa Tiberias
  rationale: Tuwirang nagpapahayag ng pinagmulan.
- source_word: ἐγγὺς τοῦ τόπου
  choice: malapit sa lugar
  rationale: Natural na katumbas ng pariralang tumutukoy sa kalapitan.
- source_word: ὅπου ἔφαγον τὸν ἄρτον
  choice: kung saan kinain nila ang tinapay
  rationale: Pinananatili ang tiyak na tinapay na nabanggit sa naunang pangyayari at natural ang simpleng aspektong naganap sa Filipino.
- source_word: εὐχαριστήσαντος τοῦ κυρίου
  choice: matapos magpasalamat ang Panginoon
  rationale: Ipinakikita ang naunang kilos ng aorist participle at pinananatili ang τιτulong κύριος bilang Panginoon.
theological_decisions:
- issue: Pagkakasalin ng κύριος
  choice: ang Panginoon
  alternative: ang panginoon / ang guro
  rationale: Tumutukoy ito kay Jesus at pinananatili ng “Panginoon” ang marangal at Kristolohikal na bigat ng titulo nang hindi nagdaragdag ng paliwanag.
- issue: Ugnayan ng pasasalamat at pagkain
  choice: matapos magpasalamat ang Panginoon
  alternative: nang magpasalamat ang Panginoon
  rationale: Ang genitive absolute na may aorist participle ay likas na nagpapahiwatig na nauna ang pasasalamat sa pagkain; hindi tinutukoy nang higit pa kung kanino o para saan ang pasasalamat.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “Ngunit” para sa malinaw na salungatan at “may dumating” upang maging natural ang ayos ng pangungusap. Nasa pangunahing teksto ang marker na [a].
