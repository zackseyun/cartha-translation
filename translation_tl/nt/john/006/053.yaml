id: JHN.6.53
reference: John 6:53
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν, ἐὰν μὴ φάγητε τὴν σάρκα τοῦ υἱοῦ τοῦ ἀνθρώπου καὶ πίητε αὐτοῦ τὸ αἷμα, οὐκ ἔχετε ζωὴν ἐν ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/053.yaml
  text: So Jesus said to them[a], “Truly, truly, I say to you, unless you eat the flesh of the Son of Man and drink his blood[b], you do not have life in yourselves.”
translation:
  language: tl
  text: Kaya sinabi sa kanila ni Jesus, “Katotohanang-katotohanang sinasabi ko sa inyo, malibang kainin ninyo ang laman ng Anak ng Tao at inumin ang kanyang dugo, wala kayong buhay sa inyong mga sarili.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Ipinapakita ang bunga o lohikal na pagpapatuloy mula sa naunang usapan sa natural na modernong Tagalog.
- source_word: Ἀμὴν ἀμὴν
  choice: Katotohanang-katotohanang
  rationale: Pinananatili ang dobleng pormula at taimtim na diin ng pananalita ni Jesus sa Juan.
- source_word: ἐὰν μὴ
  choice: malibang
  rationale: Likas at tuwirang katumbas ng kondisyong ‘unless,’ nang hindi binabago ang lohika ng pangungusap.
- source_word: φάγητε
  choice: kainin ninyo
  rationale: Pinananatili ang payak at kongkretong kahulugan ng pandiwa.
- source_word: σάρκα
  choice: laman
  rationale: Ang ‘laman’ ang tuwirang katumbas ng σάρξ at pinananatili ang mariin at nakagugulat na larawan; hindi ito pinalalambot bilang ‘katawan.’
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: ng Anak ng Tao
  rationale: Pinananatili ang nakagawiang titulong ginagamit ni Jesus tungkol sa kanyang sarili at ang posibleng mesiyanikong alusyon nito.
- source_word: πίητε
  choice: inumin
  rationale: Tuwirang salin na nagpapanatili sa kongkretong parallel sa ‘kainin.’
- source_word: αἷμα
  choice: dugo
  rationale: Pinananatili ang tahasang larawan at bigat ng orihinal.
- source_word: ζωὴν
  choice: buhay
  rationale: Hindi idinagdag ang ‘walang hanggan’ sapagkat walang katumbas na pang-uri sa talata.
- source_word: ἐν ἑαυτοῖς
  choice: sa inyong sarili
  rationale: Malapit sa anyo ng Griyego at ipinahahayag na wala sa kanila ang buhay na tinutukoy.
theological_decisions:
- issue: Kung bibigyang-kahulugan nang tahasan ang pagkain ng laman at pag-inom ng dugo bilang sakramento o talinghaga
  choice: Pinanatili ang literal na pananalitang ‘kainin ... ang laman ... at inumin ... ang dugo.’
  alternative: Gumamit ng interpretibong ‘makibahagi,’ ‘tanggapin,’ o ng tahasang pananalitang Eukaristiko.
  rationale: Sadyang kongkreto at mapanghamon ang Griyego. Pinananatili ng salin ang tensiyong teolohikal at hindi nagpapasya kung sakramental, metaporikal, o kapwa ang pangunahing diwa.
- issue: Kung palalawakin ang ζωή bilang ‘buhay na walang hanggan’
  choice: ‘buhay’ lamang
  alternative: ‘buhay na walang hanggan’
  rationale: Bagaman mahalaga sa konteksto ng Juan ang buhay na walang hanggan, ζωή lamang ang nasa tekstong Griyego rito; ang pagdaragdag ay magiging interpretibong pagpapalawak.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang matindi at kongkretong wika ng talata. Walang talababa sapagkat hindi kailangan ng pangunahing salin ang isang tekstuwal o leksikal na paglilinaw; ang ibinigay na mga marker sa English consultation layer ay tila hindi tugma sa aktuwal na kinalalagyan ng mga tala.
