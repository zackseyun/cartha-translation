  text: τοῦτο ⸀γάρ ἐστιν τὸ θέλημα τοῦ ⸂πατρός μου⸃ ἵνα πᾶς ὁ θεωρῶν τὸν υἱὸν καὶ πιστεύων εἰς αὐτὸν ἔχῃ ζωὴν αἰώνιον, καὶ ἀναστήσω αὐτὸν ⸀ἐγὼ τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/040.yaml
  text: 'For this is the will of my Father: that everyone who sees the Son and believes in him may have eternal life[b][a], and I myself will raise him up on the last day.'
translation:
  language: tl
  text: 'Sapagkat ito ang kalooban ng aking Ama: na ang bawat nakakakita sa Anak[a] at sumasampalataya sa kanya ay magkaroon ng buhay na walang hanggan, at ako mismo ang muling bubuhay sa kanya[b] sa huling araw.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang bawat nagmamasid sa Anak.” Ang pandiwa ay maaaring tumukoy sa mapagtuon o masusing pagtingin, hindi lamang sa pisikal na pagkakita.
    reason: lexical_alternative
  - marker: b
    text: 'O “at muli ko siyang bubuhayin.” Hayagang kasama sa Griyego ang panghalip na “ako,” kaya may diin: “ako mismo ang muling bubuhay sa kanya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο γάρ ἐστιν
  choice: Sapagkat ito ang
  rationale: Pinananatili ng “sapagkat” ang paliwanag na ugnayan ng talata sa naunang pahayag, at likas sa Tagalog ang hulma ng pangungusap.
- source_word: τὸ θέλημα τοῦ πατρός μου
  choice: kalooban ng aking Ama
  rationale: Ang “kalooban” ay malinaw at karaniwang katumbas ng θέλημα bilang nais o layunin; pinananatili ng “aking Ama” ang tuwirang ugnayang ipinahayag ni Jesus.
- source_word: ἵνα
  choice: na ... ay magkaroon
  rationale: Ipinakikilala ng “na” ang nilalaman at layunin ng kalooban ng Ama nang hindi ginagawang payak na pasalaysay lamang ang sugnay.
- source_word: πᾶς ὁ θεωρῶν τὸν υἱὸν
  choice: ang bawat nakakakita sa Anak
  rationale: Ipinapahayag ng “bawat” ang pangkalahatang saklaw ng articular participle. Ang “nakakakita” ay likas sa modernong Tagalog, habang nililinaw sa talababa na maaaring may diwang mapagmasid o masusing pagtingin ang θεωρέω.
- source_word: καὶ πιστεύων εἰς αὐτόν
  choice: at sumasampalataya sa kanya
  rationale: Ang “sumasampalataya sa kanya” ay likas na pananalitang biblikal sa Tagalog para sa paniniwala at pagtitiwalang nakatuon sa isang persona, gaya ng ipinahihiwatig ng πιστεύω εἰς.
- source_word: ἔχῃ ζωὴν αἰώνιον
  choice: ay magkaroon ng buhay na walang hanggan
  rationale: Ang “magkaroon” ay umaayon sa subjunctive na nasa sugnay na pinamumunuan ng ἵνα, at ang “buhay na walang hanggan” ay malinaw na nagpapahayag ng ζωὴ αἰώνιος.
- source_word: καὶ ἀναστήσω αὐτὸν ἐγώ
  choice: at ako mismo ang muling bubuhay sa kanya
  rationale: Ipinapanatili ng “ako mismo” ang diin ng hayag na ἐγώ. Ang “muling bubuhay” ay natural na tumutukoy sa eskatolohikal na pagbangon mula sa kamatayan sa kontekstong ito.
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: sa huling araw
  rationale: Ito ang natural at tuwirang panumbas sa Tagalog ng temporal na pariralang tumutukoy sa pangwakas na araw.
theological_decisions:
- issue: Saklaw at kondisyon sa πᾶς ὁ θεωρῶν ... καὶ πιστεύων
  choice: na ang bawat nakakakita sa Anak at sumasampalataya sa kanya ay magkaroon ng buhay na walang hanggan
  alternative: upang ang sinumang tumitingin sa Anak at nananalig sa kanya ay magkaroon ng buhay na walang hanggan
  rationale: Pinananatili ang pangkalahatang paglalarawan sa mga nakakakita at sumasampalataya nang hindi nagpapasok ng partikular na pananaw tungkol sa pagkahirang o malayang pagpapasya. Ang “magkaroon” ay nagpapanatili sa hulma ng ἵνα at subjunctive.
- issue: Diin ng ἐγώ sa καὶ ἀναστήσω αὐτὸν ἐγώ
  choice: ako mismo ang muling bubuhay sa kanya
  alternative: muli ko siyang bubuhayin
  rationale: Ang “ako mismo” ay nagpapahayag ng tahasang diin sa personal na pagkilos ni Jesus nang walang idinaragdag na doktrinang wala sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sumasampalataya” dahil pamilyar at teolohikal na tumpak ito sa kontekstong Juanino; iniwasan ang lipas o labis na teknikal na pananalita. Inilagay ang mga talababa kaagad sa mga pariralang nililinaw ng mga ito.
