  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τοῦτο δέ ἐστιν τὸ θέλημα τοῦ πέμψαντός ⸀με ἵνα πᾶν ὃ δέδωκέν μοι μὴ ἀπολέσω ἐξ αὐτοῦ ἀλλὰ ἀναστήσω ⸀αὐτὸ τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/039.yaml
  text: 'And this is the will of the one who sent me: that I should lose nothing of all that he has given me[a], but should raise it up on the last day.'
translation:
  language: tl
  text: 'At ito ang kalooban ng nagsugo sa akin: na huwag akong mawalan ng anuman sa lahat ng ibinigay niya sa akin[a], kundi ibangon ko itong muli sa huling araw.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas personal na pagpapahayag, “lahat ng mga taong ibinigay niya sa akin ... ibangon ko silang muli.” Sa Griyego, kolektibong anyong isahan ang gamit, na literal na “lahat ng ibinigay niya sa akin ... ito.”
    reason: alternative_reading
lexical_decisions:
- source_word: θέλημα
  choice: kalooban
  rationale: Karaniwan at marangal na katumbas ito para sa layunin o nais ng Diyos, nang hindi nililimitahan ang diwa sa simpleng pagnanais lamang o sa isang tiyak na doktrinal na pakahulugan.
- source_word: τοῦ πέμψαντός με
  choice: ng nagsugo sa akin
  rationale: Likas sa Tagalog at pinananatili ang pandiwang at relasyonal na diwa ng substantibong participle.
- source_word: ἵνα
  choice: huwag kong ... kundi
  rationale: Ipinahahayag nito ang nilalaman at layunin ng kalooban ng nagsugo; ang hulma sa Tagalog ay natural habang pinananatili ang diwang purposibo.
- source_word: πᾶν ὃ δέδωκέν μοι
  choice: ang anuman sa lahat ng ibinigay niya sa akin
  rationale: Pinananatili ang kolektibong saklaw ng neuter singular na πᾶν ὃ at iniiwasang tahasang gawing indibiduwal na mga tao ang tinutukoy, bagaman maaaring mga tao ang reperente ayon sa konteksto.
- source_word: δέδωκέν
  choice: ibinigay niya
  rationale: Ang aspektong ganap ng Tagalog ay angkop sa natapos na pagbibigay na nananatili ang bunga; hindi kailangang tahasang tumbasan ang bawat detalye ng Griyegong perfect upang maipahayag ito nang natural.
- source_word: μὴ ἀπολέσω ἐξ αὐτοῦ
  choice: huwag kong maiwala ang anuman sa lahat
  rationale: Sa konteksto, ang ἀπόλλυμι ay nangangahulugang mawalan o maiwala, hindi pumuksa. Likas na isinasama ng parirala ang ἐξ αὐτοῦ bilang ‘sa lahat.’
- source_word: ἀναστήσω αὐτό
  choice: ibangon ko itong muli
  rationale: Ipinahahayag ng ‘ibangon ... muli’ ang eskatolohikal na muling pagkabuhay at pinananatili ng ‘ito’ ang kolektibong anyong isahan ng αὐτό.
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: sa huling araw
  rationale: Ito ang natural at pamilyar na ekspresyon sa modernong Tagalog para sa eskatolohikal na huling araw.
theological_decisions:
- issue: Kung isasalin nang personal ang kolektibong layon bilang mga taong indibiduwal o pananatilihin ang kolektibong anyong isahan ng Griyego.
  choice: ang anuman sa lahat ng ibinigay niya sa akin ... ibangon ko itong muli
  alternative: ang sinuman sa lahat ng mga taong ibinigay niya sa akin ... ibangon ko silang muli
  rationale: Ang Griyego ay gumagamit ng mga anyong neuter singular na πᾶν, ὃ, at αὐτό. Pinananatili ng pangunahing salin ang kolektibong anyo at hindi nilulutas nang palihim ang reperente, samantalang inilalahad sa talababa ang mas personal na pagbasa na pinahihintulutan ng konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Pinanatili ang kolektibong ‘ito’ sa halip na gawing tahasang maramihang ‘sila,’ at ginamit ang ‘ibangon ... muli’ bilang malinaw ngunit hindi teknikal na pahayag ng muling pagkabuhay.
