  text: Ἐμάχοντο οὖν πρὸς ἀλλήλους οἱ Ἰουδαῖοι λέγοντες· Πῶς δύναται οὗτος ἡμῖν δοῦναι τὴν σάρκα ⸀αὐτοῦ φαγεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/052.yaml
  text: So the Jews were arguing among themselves[a], saying[b], “How can this man give us his flesh to eat?”
translation:
  language: tl
  text: Kaya nagtatalo ang mga Judio sa isa’t isa. Sinabi nila, “Paano kayang ibigay ng taong ito sa atin ang kaniyang laman[b] upang kainin natin?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: O “katawan.” Ang salitang Griyego ay σάρξ, “laman”; pinanatili rito ang kongkreto nitong pananalita at ang tensiyon ng talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐμάχοντο
  choice: nagtatalo-talo
  rationale: Ipinahihiwatig ng imperpektong anyo ang nagpapatuloy at matinding pagtatalo. Malinaw na pasalitang alitan ang tinutukoy, kaya hindi ito pinalabis bilang pisikal na pag-aaway.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinakikita ang pag-usad at bunga ng naunang sinabi ni Jesus; natural ito sa makabagong Tagalog.
- source_word: πρὸς ἀλλήλους
  choice: sa isa’t isa
  rationale: Tuwirang ipinahahayag ang tugunang pagtatalo sa loob ng pangkat.
- source_word: οἱ Ἰουδαῖοι
  choice: ang mga Judio
  rationale: Pinananatili ang tahasang katawagan ng Griyego nang hindi nililimitahan sa pangunahing teksto ang pinagtatalunang saklaw nito.
- source_word: λέγοντες
  choice: Sinabi nila
  rationale: Ipinakikilala nito ang nilalaman ng kanilang pagtatalo. Hinati sa hiwalay na pangungusap upang maging malinaw at natural sa Tagalog.
- source_word: Πῶς δύναται
  choice: Paano maibibigay
  rationale: Natural na tanong sa Tagalog tungkol sa posibilidad o kakayahang gawin ang bagay na tinutukoy.
- source_word: οὗτος
  choice: ng taong ito
  rationale: Pinananatili ang demonstratibong tono na maaaring magpahiwatig ng paglayo o paghamak.
- source_word: ἡμῖν
  choice: sa atin
  rationale: Inilalarawan ang pangkat na nagsasalita bilang tatanggap ng ibibigay.
- source_word: δοῦναι
  choice: maibibigay
  rationale: Karaniwang kahulugan ng δίδωμι, na iniangkop sa anyo ng tanong tungkol sa kakayahan.
- source_word: τὴν σάρκα αὐτοῦ
  choice: ang kaniyang laman
  rationale: Ang “laman” ang kongkreto at tuwirang katumbas ng σάρξ at pinananatili nito ang matinding larawan at tensiyon ng talata.
- source_word: φαγεῖν
  choice: upang kainin natin
  rationale: Nililinaw sa likas na Tagalog na ang mga nagsasalita ang kakain, gaya ng ipinahihiwatig ng ἡμῖν at ng pandiwang pawatas.
theological_decisions:
- issue: Pagkasalin sa σάρξ sa kontekstong may pinagtatalunang literal at Eukaristikong kahulugan
  choice: laman
  alternative: katawan
  rationale: Ang “laman” ang tuwirang leksikal na anyo at pinananatili ang kongkretong pagkaunawa ng mga nakikinig at ang teolohikal na tensiyon, nang hindi ipinapasok sa salin ang isang partikular na sakramental na pagpapakahulugan.
- issue: Saklaw ng οἱ Ἰουδαῖοι sa Ebanghelyo ni Juan
  choice: mga Judio
  alternative: mga taga-Judea; mga pinunong Judio
  rationale: Sinusunod ng pangunahing teksto ang tahasang katawagan sa Griyego. Inilalagay sa talababa ang posibleng mas makitid na mga reperente upang hindi tahimik na lutasin ang pinagtatalunang pagkakakilanlan ng pangkat.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kaniyang” at “upang” para sa dignidad ng biblikal na rehistro, habang pinanatiling natural ang ayos ng pangungusap. Inilipat ang panandang [b] sa “laman,” na siyang salitang tinutukoy ng talababa.
