base_translation:
  language: en
  yaml_path: translation/nt/john/006/010.yaml
  text: Jesus said, “Have the people sit down.” Now there was plenty of grass in the place. So the men sat down, about five thousand in number.
translation:
  language: tl
  text: Sinabi ni Jesus, “Paupuin ninyo ang mga tao.”[a] Maraming damo sa lugar na iyon. Kaya umupo ang mga lalaki—humigit-kumulang limang libo sila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga tao” ay salin ng pangkalahatang salitang Griyego na ἀνθρώπους; ang “mga lalaki” sa bandang huli ay salin naman ng ἄνδρες, kaya ang bilang na humigit-kumulang limang libo ay partikular na tumutukoy sa mga lalaki.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin ang “umupo” bilang “humilig.” Ang pandiwang Griyego ay maaaring tumukoy sa paghilig habang kumakain.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποιήσατε ... ἀναπεσεῖν
  choice: Paupuin ninyo
  rationale: 'Likas na ipinapahayag sa Tagalog ang pautos na sanhi: ipagawa sa mga tao ang pag-upo. Ang “paupuin” ay malinaw at hindi kasing-artipisyal ng literal na “pahigain” sa tagpong ito.'
- source_word: τοὺς ἀνθρώπους
  choice: ang mga tao
  rationale: Ang ἄνθρωπος dito ay tumutukoy sa karamihan sa pangkalahatan, kaya pinananatili ang masaklaw na kahulugan at inihihiwalay sa kasunod na ἄνδρες.
- source_word: ἀναπεσεῖν / ἀνέπεσαν
  choice: paupuin / umupo
  rationale: Maaaring tumukoy ang ἀναπίπτω sa paghilig o paghiga habang kumakain, ngunit sa makabagong Tagalog, “umupo” ang natural at malinaw sa tagpong nasa damuhan.
- source_word: χόρτος πολὺς
  choice: maraming damo
  rationale: Tuwirang inililipat ang χόρτος bilang “damo” at ang πολὺς bilang “marami,” sa natural at dignified na Tagalog.
- source_word: ἐν τῷ τόπῳ
  choice: sa lugar na iyon
  rationale: Natural na locative expression sa Tagalog na malinaw na tumutukoy sa lugar ng pangyayari.
- source_word: οἱ ἄνδρες
  choice: ang mga lalaki
  rationale: Ang ἀνήρ ay tiyak na tumutukoy sa mga lalaking kabilang sa bilang, taliwas sa naunang pangkalahatang “mga tao.”
- source_word: τὸν ἀριθμὸν ὡς πεντακισχίλιοι
  choice: humigit-kumulang limang libo sila
  rationale: Ipinapakita ng “humigit-kumulang” ang pagtatayang dala ng ὡς, samantalang malinaw na inilalahad ng buong parirala ang bilang.
theological_decisions:
- issue: Ang bilang ay partikular na tumutukoy sa mga lalaki
  choice: Pinag-iba ang “mga tao” (ἀνθρώπους) at “mga lalaki” (ἄνδρες).
  alternative: Isalin ang dalawang termino bilang “mga tao.”
  rationale: 'May tunay na leksikal na pagkakaiba sa Griyego: pangkalahatan ang unang termino, samantalang panlalaki ang ikalawa. Pinananatili ito upang hindi palabuin kung sino ang tinatayang limang libo.'
- issue: Ayos ng katawan na ipinahihiwatig ng ἀναπίπτω
  choice: “Umupo” sa pangunahing teksto, na may talababa tungkol sa “humilig.”
  alternative: Gamitin ang “humilig” o “humiga” sa pangunahing teksto.
  rationale: Maaaring ilarawan ng pandiwa ang paghilig sa pagkain, ngunit hindi tiyak na hinihingi rito ang isang teknikal na posisyon. Pinananatili ng talababa ang saklaw ng kahulugan nang hindi ginagawang hindi natural ang salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “paupuin/umupo” bilang pinakanatural na paglalarawan sa kilos, habang ipinaliliwanag sa talababa ang posibleng kahulugang “humilig.” Pinanatili ang pagkakaiba ng pangkalahatang “mga tao” at tiyak na “mga lalaki.”
