  yaml_path: translation/nt/john/006/069.yaml
  text: And we have believed and have come to know that you are the Holy One of God[a][b].
translation:
  language: tl
  text: At kami ay sumampalataya na at nalaman na namin na ikaw ang Banal ng Diyos[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ganito ang mababasa sa ilang manuskrito: “ang Cristo, ang Anak ng Diyos na buháy.”'
    reason: textual_variant
  - marker: b
    text: O “ang Banal na mula sa Diyos.” Maaaring magpahayag ang genitive sa Griyego ng kaugnayan o pinagmulan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  choice: kami
  rationale: Ang tahasang panghalip ay nagbibigay-diin sa mga nagsasalita bilang tugon kay Jesus. Ang “kami” ay likas na eksklusibo sa Filipino at hindi kabilang ang kausap.
- source_word: πεπιστεύκαμεν
  choice: sumampalataya
  rationale: Ipinahihiwatig ng aspektong perpekto ang pananampalatayang nagsimula na at nananatiling may bisa. Sa konteksto, likas na naipahahayag ito ng “sumampalataya,” kasabay ng kasunod na pandiwa.
- source_word: ἐγνώκαμεν
  choice: nakilala
  rationale: Ipinahahayag nito ang pagkakilalang natamo na at nananatili. Ang “nakilala” ay angkop sa personal na pagkilala kay Jesus at hindi lamang sa pagkatuto ng isang impormasyon.
- source_word: ὅτι
  choice: -ng / na
  rationale: Ang pang-angkop sa “nakilala naming” ang likas na paraang Filipino upang ipakilala ang nilalaman ng pananampalataya at pagkilala.
- source_word: ὁ ἅγιος
  choice: ang Banal
  rationale: Pinananatili nito ang tiyak at natatanging titulong cristológico sa Griyego, sa halip na gawing karaniwang pang-uri lamang.
- source_word: τοῦ θεοῦ
  choice: ng Diyos
  rationale: Pinananatili ng “ng Diyos” ang malawak na ugnayang ipinahahayag ng genitive—maaaring relasyon, pag-aari, o pinagmulan—nang hindi ito nililimitahan sa iisang pakahulugan.
theological_decisions:
- issue: Ang titulong cristológico sa Juan 6:69
  choice: ang Banal ng Diyos
  alternative: ang Banal na mula sa Diyos; ang Cristo, ang Anak ng Diyos na buháy
  rationale: Ang SBLGNT ay may ὁ ἅγιος τοῦ θεοῦ. Isinasalin ito nang tuwiran at hindi iniaayon sa Mateo 16:16 o sa mas mahabang pagbasa ng ilang manuskrito. Hindi rin nilulutas ng “ng Diyos” ang likas na kaluwagan ng genitive.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pambungad na “At” at ang diin ng tahasang “kami.” Ginamit ang “ang Banal” bilang titulo; iniwasan ang mas denominasyonal o mapagpasyang pagpapakahulugan.
