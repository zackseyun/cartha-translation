  source_fidelity: 'Tumpak ang pangunahing pagbasa at ang dalawang talababa: ang SBLGNT ay may «ὁ ἅγιος τοῦ θεοῦ», at wastong iniuulat ng talababa ang mas mahabang variant. Gayunman, ang «nakilala naming ikaw» ay maaaring magpahiwatig ng personal na pagkakilala sa halip na ng nilalaman ng nalaman, at hindi ito ang pinakamalinaw na katumbas ng ἐγνώκαμεν na sinusundan ng ὅτι.'
  naturalness: Mas likas at malinaw sa modernong Filipino ang «nalaman na namin na ikaw...» para sa pahayag na may nilalamang sugnay. Ang «na» ay malinaw na katumbas ng ὅτι, habang ang mga «na» pagkatapos ng pandiwa ay maingat na naghahatid ng resultang kasalukuyang-bisa ng mga perpekto sa Griyego.
