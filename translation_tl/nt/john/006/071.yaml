  text: ἔλεγεν δὲ τὸν Ἰούδαν Σίμωνος ⸀Ἰσκαριώτου· οὗτος γὰρ ἔμελλεν ⸂παραδιδόναι αὐτόν⸃, ⸀εἷς ἐκ τῶν δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/071.yaml
  text: He was speaking about Judas[a], the son of Simon Iscariot, for this one was about to betray him, being one of the Twelve.
translation:
  language: tl
  text: Ang tinutukoy niya ay si Judas na anak ni Simon Iscariote, sapagkat siya ang magkakanulo[a] sa kanya—isa sa Labindalawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “ipapasa siya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν δὲ τὸν Ἰούδαν
  choice: Ang tinutukoy niya ay si Judas
  rationale: Sa paliwanag ng tagapagsalaysay, likas sa modernong Tagalog ang “ang tinutukoy niya” at malinaw nitong ipinapahayag na si Judas ang tinutukoy ni Jesus. Hindi ginawang hiwalay na salita ang banayad na pang-ugnay na δέ, sapagkat sapat na ang daloy ng konteksto.
- source_word: Σίμωνος Ἰσκαριώτου
  choice: na anak ni Simon Iscariote
  rationale: 'Ang magkakasunod na genitive ay natural na nauunawaan bilang pagkakakilanlan kay Judas sa pamamagitan ng kanyang ama: anak ni Simon Iscariote.'
- source_word: οὗτος γὰρ
  choice: sapagkat siya ang
  rationale: Ang “sapagkat” ay naghahayag ng paliwanag na dala ng γάρ, samantalang ang hulma na “siya ang” ay nagbibigay ng bahagyang diin sa demonstratibong οὗτος nang hindi nagiging alanganin sa Tagalog.
- source_word: ἔμελλεν παραδιδόναι αὐτόν
  choice: magkakanulo sa kanya
  rationale: Ipinahihiwatig ng anyong magaganap ang kilos na darating pa mula sa pananaw ng salaysay. Sa konteksto ni Judas, malinaw at natural na ipinapahayag ng “magkakanulo” ang kontekstuwal na diwa ng παραδίδωμι; inilalahad sa talababa ang mas literal na alternatibo.
- source_word: εἷς ἐκ τῶν δώδεκα
  choice: isa sa Labindalawa
  rationale: Pinananatili ng maikli at appositional na parirala ang matinding punto na ang magkakanulo ay kabilang mismo sa kinikilalang pangkat ng Labindalawa.
theological_decisions:
- issue: Pagpapakahulugan sa παραδιδόναι tungkol kay Judas
  choice: magkakanulo sa kanya
  alternative: ibibigay siya sa mga awtoridad / ipapasa siya sa kamay ng iba
  rationale: Maaaring literal na tumukoy ang pandiwa sa pagbibigay o pagpapasa ng isang tao sa kapangyarihan ng iba, ngunit sa salaysay tungkol kay Judas ay taglay nito ang diwa ng pagkakanulo. Pinananatili ng talababa ang kongkretong literal na larawan nang hindi nagdaragdag ng doktrinal na paliwanag.
- issue: Lakas ng ἔμελλεν
  choice: ipinahayag sa anyong magaganap na “magkakanulo”
  alternative: malapit nang magkakanulo / nakatakdang magkakanulo
  rationale: Iniiwasan ang “nakatakda,” na maaaring magpasok ng mas mariing ideya ng kapalaran o banal na pagtatakda, at ang “malapit na,” na maaaring magbigay ng sobrang tiyak na diin sa agarang panahon. Ang payak na anyong magaganap ay natural sa Tagalog at nagpapanatili sa kilos na nasa hinaharap ng salaysay.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “Labindalawa” bilang katawagan sa natatanging pangkat. Ang gatlang bago ang hulíng parirala ay nagpapanatili sa bigat ng appositional na “isa sa Labindalawa” nang hindi nagdaragdag ng tahasang pananalitang concessive gaya ng “bagaman.”
