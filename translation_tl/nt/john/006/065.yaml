id: JHN.6.65
reference: John 6:65
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν· Διὰ τοῦτο εἴρηκα ὑμῖν ὅτι οὐδεὶς δύναται ἐλθεῖν πρός με ἐὰν μὴ ᾖ δεδομένον αὐτῷ ἐκ τοῦ ⸀πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/065.yaml
  text: And he was saying[b][a], “For this reason I have told you that no one is able to come to me unless it has been given to him from the Father.”
translation:
  language: tl
  text: At sinabi pa niya, “Dahil dito, sinabi ko sa inyo na walang sinumang makalalapit sa akin malibang ito ay naibigay na sa kanya mula sa Ama.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “malibang ito ay naipagkaloob na sa kanya mula sa Ama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: patuloy niyang sinasabi
  rationale: Ipinahahayag nito ang aspektong imperpekto—nagpapatuloy ang pagsasalita sa tagpong ito—nang hindi ito pinapakahulugang tiyak na paulit-ulit.
- source_word: Διὰ τοῦτο
  choice: Dahil dito
  rationale: Likas na pariralang Filipino na tumutukoy pabalik sa naunang sinabi at nagpapakilala ng paliwanag.
- source_word: εἴρηκα
  choice: sinabi ko
  rationale: Sa natural na Filipino, sapat ang naganap na anyo upang tukuyin ang naunang pahayag na nananatiling mahalaga sa kasalukuyang usapan.
- source_word: οὐδεὶς δύναται
  choice: walang sinumang makalalapit
  rationale: Ang anyong maka- ay malinaw na nagpapahayag ng kakayahan o posibilidad, hindi lamang pahintulot.
- source_word: ἐλθεῖν πρός με
  choice: makalalapit sa akin
  rationale: Natural itong katumbas ng paglapit kay Jesus at pinananatili ang ugnayang diwa ng parirala nang walang dagdag na pagpapakahulugan.
- source_word: ἐὰν μὴ ᾖ δεδομένον
  choice: malibang ipagkaloob ito
  rationale: Pinananatili ang pasibong kondisyon at ang hindi tahasang tinutukoy na nilalaman ng ipinagkaloob; ang “ipagkaloob” ay natural sa Filipino para sa isang bagay na ibinigay bilang pahintulot o kakayahan.
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Ang panghalip na Filipino ay likas na walang kasarian at maaaring tumukoy sa sinumang tao, gaya ng generic na gamit ng panlalaking isahan sa Griyego.
- source_word: ἐκ τοῦ πατρός
  choice: mula sa Ama
  rationale: Pinananatili ng “mula sa” ang diwa ng pinagmulan sa ἐκ sa halip na gawing tahasang tagaganap ang Ama.
theological_decisions:
- issue: Pagbibigay ng Diyos at kakayahan ng tao na lumapit kay Jesus
  choice: Isinalin bilang kawalan ng kakayahang lumapit malibang may ipagkaloob mula sa Ama.
  alternative: Ipaliwanag ito bilang mabisang pagtawag o bilang pangkalahatang biyayang nagbibigay-kakayahan.
  rationale: Malinaw sa Griyego ang kinakailangang kondisyon, ngunit hindi nito sa talatang ito nilulutas ang mga sumunod na pagtatalong teolohikal tungkol sa paraan at lawak ng pagkakaloob.
- issue: Hindi tahasang layon ng δεδομένον
  choice: Pinanatili ang “ito” nang hindi tinukoy kung ano mismo ang ipinagkaloob.
  alternative: Idagdag ang “kakayahan” o “pahintulot.”
  rationale: Walang tahasang neuter na pangngalang layon sa Griyego; ang pagdaragdag ng “kakayahan” o “pahintulot” sa pangunahing teksto ay maaaring magpasya nang higit sa sinasabi nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “patuloy niyang sinasabi” upang maipakita ang aspektong imperpekto, “makalalapit” para sa kakayahang lumapit, at “mula sa Ama” upang mapanatili ang diwa ng pinagmulan. Ang marker na [a] ay inilagay sa pangunahing teksto.
