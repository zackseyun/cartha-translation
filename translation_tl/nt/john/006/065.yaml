- from: At patuloy niyang sinasabi, “Dahil dito, sinabi ko sa inyo na walang sinumang makalalapit sa akin malibang ipagkaloob ito sa kanya mula sa Ama.”[a]
  to: At sinabi pa niya, “Dahil dito, sinabi ko sa inyo na walang sinumang makalalapit sa akin malibang ito ay naibigay na sa kanya mula sa Ama.”[a]
  rationale: Inayos ang pananalita upang maging likas sa modernong Filipino, habang mas tumpak na ipinahahayag ang pasibo at perpektong aspekto ng δεδομένον. Pinananatili ang kawalan ng tiyak na paliwanag kung ano ang “ito,” ang generic na “sa kanya,” at ang “mula sa Ama” bilang pagsasalin ng ἐκ τοῦ πατρός.
