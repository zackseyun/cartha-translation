  yaml_path: translation/nt/john/006/056.yaml
  text: The one who eats my flesh and drinks my blood remains in me[b][a], and I in him.
translation:
  language: tl
  text: Ang kumakain ng aking laman at umiinom ng aking dugo ay nananatili sa akin[a], at ako’y nananatili sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pandiwang Griyego para sa “kumakain” ay mas matingkad kaysa sa karaniwang salita para sa pagkain at maaari ring mangahulugang “ngumunguya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ τρώγων
  choice: Ang kumakain
  rationale: Ang artikulo at pangkasalukuyang pandiwaring pantukoy ay tumutukoy sa taong kinikilala sa patuloy na gawaing ito. Likas sa Tagalog ang “Ang kumakain” at napapanatili nito ang isahan.
- source_word: τρώγων
  choice: kumakain
  rationale: Mas matingkad ang τρώγω kaysa sa karaniwang salita para sa pagkain at maaari itong magpahiwatig ng pagnguya, ngunit ang “kumakain” ang pinakanatural at hindi labis na nagpapakahulugan sa pangunahing teksto.
- source_word: μου τὴν σάρκα
  choice: ng aking laman
  rationale: Pinananatili ng “laman” ang kongkreto at nakagugulat na larawan ng σάρξ, nang hindi ito ginagawang “katawan” o binibigyang-kahulugang makasalanang kalikasan.
- source_word: καὶ πίνων μου τὸ αἷμα
  choice: at umiinom ng aking dugo
  rationale: Tuwirang inilalahad ang kapantay na pangkasalukuyang kilos at pinananatiling literal ang αἷμα bilang “dugo.”
- source_word: ἐν ἐμοὶ μένει
  choice: ay nananatili sa akin
  rationale: Ang “nananatili” ay natural na modernong Tagalog para sa mahalagang pandiwang Juaninong μένω at ipinahahayag ang nagpapatuloy na ugnayan nang hindi ito ginagawang isang tiyak na sistematikong doktrina.
- source_word: κἀγὼ ἐν αὐτῷ
  choice: at ako sa kanya
  rationale: Pinananatili ang elipsis ng Griyego, na hindi inuulit ang μένει. Nauunawaan sa Tagalog ang kapantay na diwa nang hindi idinaragdag ang pandiwa.
theological_decisions:
- issue: Sakramental/Eukaristikong pagbasa laban sa metaporikal na pagbasa ng pagkain ng laman at pag-inom ng dugo
  choice: 'Panatilihin ang kongkretong pananalita: “kumakain ng aking laman at umiinom ng aking dugo.”'
  alternative: Ipaliwanag ito nang tahasan bilang pakikibahagi sa Eukaristiya o bilang pananampalataya kay Jesus.
  rationale: Hindi nilulutas ng mismong pangungusap ang pinagtatalunang pagpapakahulugan. Ang literal na larawan ay nagpapanatili sa teolohikal na tensiyon at hindi nag-aangkat ng natatanging doktrina ng alinmang denominasyon.
- issue: Magkatuwang na pananatili ni Jesus at ng kumakain at umiinom
  choice: “nananatili sa akin, at ako sa kanya”
  alternative: “nakikiisa sa akin, at ako sa kanya” o pag-uulit ng “nananatili” sa ikalawang sugnay.
  rationale: Pinananatili ng “nananatili” ang bokabularyo ng μένω nang hindi pinapalitan ng isang mas makitid na interpretasyong mistiko o doktrinal; ang ikalawang sugnay ay nananatiling eliptikal gaya ng Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignipikado, at natural. Ginamit ang “laman” at “dugo” upang mapanatili ang kongkretong larawan, at “nananatili” bilang madaling maunawaang katumbas ng mahalagang terminong Juanino. Ang “kanya” ay likas na walang markang kasarian sa Tagalog at angkop sa tinutukoy na isahang tao.
