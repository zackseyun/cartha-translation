  text: But he was saying this to test him[a], for he himself knew what he was about to do.
translation:
  language: tl
  text: Ngunit sinabi niya ito upang subukin si Felipe[a], sapagkat si Jesus mismo ay alam na kung ano ang gagawin niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pandiwa ay maaari ring mangahulugang “tuksuhin,” ngunit dito ang diwa ay subukin o patunayan siya.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ ἔλεγεν
  choice: Ngunit sinabi niya ito
  rationale: Ang δέ ay banayad na pagsalungat o paglilipat sa paliwanag, kaya natural ang “Ngunit.” Bagaman imperpekto ang ἔλεγεν, mas likas sa salaysay na Tagalog ang “sinabi” kaysa “sinasabi,” nang hindi binabago ang pangyayari.
- source_word: πειράζων αὐτόν
  choice: upang subukin siya
  rationale: Sa konteksto, layunin nitong subukin o patunayan si Felipe, hindi akitin sa kasalanan. Ipinapahayag ng “upang” ang layuning puwersa ng participle.
- source_word: αὐτὸς γὰρ ᾔδει
  choice: sapagkat alam na niya mismo
  rationale: Ang “sapagkat” ay malinaw na naghahayag ng paliwanag na ipinakikilala ng γάρ. Pinananatili ng “niya mismo” ang diin ng tahasang αὐτός, at ng “alam na” ang dating kaalaman ni Jesus sa sandaling iyon.
- source_word: τί ἔμελλεν ποιεῖν
  choice: kung ano ang gagawin niya
  rationale: Natural itong Tagalog para sa nalalapit o nakatalagang kilos na ipinahihiwatig ng μέλλω at infinitive. Hindi nito labis na nilulutas kung ang diin ay nasa nalalapit na kilos o sa balak.
theological_decisions:
- issue: Kahulugan ng πειράζων sa ginawa ni Jesus kay Felipe
  choice: subukin
  alternative: tuksuhin
  rationale: Ipinakikita ng konteksto na sinusukat o sinusubok ni Jesus ang pagkaunawa ni Felipe, hindi siya inaakit na gumawa ng masama.
- issue: Diin sa kaalaman ni Jesus
  choice: alam na niya mismo
  alternative: alam niya
  rationale: Pinananatili ng “niya mismo” ang diin ng αὐτός, habang ang “na” ay angkop na nagpapahiwatig na taglay na niya ang kaalamang ito bago siya kumilos, nang hindi nagdaragdag ng doktrinang wala sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “subukin” bilang likas at tumpak na katumbas sa konteksto; iniwasan ang mas denominasyonal o mapagpaliwanag na pagpapalawak.
