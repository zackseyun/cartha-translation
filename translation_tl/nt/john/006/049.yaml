base_translation:
  language: en
  yaml_path: translation/nt/john/006/049.yaml
  text: Your fathers ate the manna in the wilderness[a], and they died.
translation:
  language: tl
  text: Kinain ng inyong mga ninuno[a] ang manna sa ilang, at namatay sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “inyong mga ama.” Literal na “inyong mga ama” ang Griyego; tumutukoy ito sa inyong mga ninuno.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πατέρες ὑμῶν
  choice: inyong mga ninuno
  rationale: Bagaman literal na “inyong mga ama,” ang πατέρες dito ay tumutukoy sa mga ninuno ng mga kausap ni Jesus, lalo na sa salinlahing Israelita sa ilang. Ang “mga ninuno” ang natural at malinaw na katumbas sa makabagong Tagalog nang hindi nawawala ang historikal na sanggunian.
- source_word: ἔφαγον
  choice: kinain
  rationale: Payak na naglalahad ng natapos na kilos. Ang “kinain” ay natural dahil tiyak at kasunod nito ang layong “ang manna.”
- source_word: ἐν τῇ ἐρήμῳ
  choice: sa ilang
  rationale: Ang “ilang” ay dignidad at pamilyar na katawagan sa kontekstong biblikal para sa ilang na dinaanan ng Israel; hindi nito ipinapalagay na purong buhangin lamang ang lugar.
- source_word: τὸ μάννα
  choice: ang manna
  rationale: Pinananatili ang tiyak na artikulo at ang kilalang katawagang biblikal sa pagkaing ibinigay sa Israel.
- source_word: καὶ ἀπέθανον
  choice: ngunit namatay sila
  rationale: Literal na pang-ugnay ang καί na “at,” ngunit sa konteksto ay may malinaw na pagtutol sa inaasahang bisa ng pagkaing iyon. Ang “ngunit” ay likas na naghahayag ng ugnayang ito sa Tagalog, habang ang “namatay sila” ay tahasang nagpapanatili sa aktuwal na kamatayan.
theological_decisions:
- issue: Pagtukoy sa salinlahi ng Israel sa ilang
  choice: inyong mga ninuno
  alternative: inyong mga ama
  rationale: Ang salin ay hindi nagdaragdag ng doktrinal na pakahulugan; nililinaw lamang nito na ang πατέρες ay mga naunang salinlahi ng Israel. Sa kasalukuyang Tagalog, ang “mga ama” ay maaaring mapagkamalang mga agarang ama ng mga kausap, samantalang “mga ninuno” ang tumpak na naghahatid ng kinakatawang kahulugang pampamilya at pangkasaysayan.
- issue: Ugnayan ng pagkain ng manna at pagkamatay
  choice: ngunit namatay sila
  alternative: at namatay sila
  rationale: 'Pinananatili ang teolohikal na tensiyon: kumain sila ng mannang mula sa Diyos, subalit hindi iyon nagkaloob ng buhay na hindi saklaw ng kamatayan. Hindi nililinaw nang higit sa sinasabi ng talata ang uri o dahilan ng kanilang kamatayan.'
translation_notes:
  register: Modernong Filipino Tagalog na natural, maikli, at marangal. Ginamit ang “mga ninuno” para sa agarang pagkaunawa ng karaniwang mambabasa at “sa ilang” upang mapanatili ang biblikal na taginting. Walang talababa sapagkat hindi kailangan upang maipaliwanag ang teksto.
