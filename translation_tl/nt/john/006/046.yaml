  text: οὐχ ὅτι τὸν πατέρα ⸂ἑώρακέν τις⸃ εἰ μὴ ὁ ὢν παρὰ τοῦ θεοῦ, οὗτος ἑώρακεν τὸν πατέρα.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/046.yaml
  text: Not that anyone has seen the Father[a], except the one who is from God; he has seen the Father.
translation:
  language: tl
  text: Hindi ito nangangahulugang may sinumang nakakita sa Ama, maliban sa nagmula sa Diyos[a]; siya ang nakakita sa Ama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula sa piling ng Diyos” o “kasama ng Diyos.” Ang pariralang Griyego ay maaaring magpahiwatig kapwa ng pinagmulan at ng personal na pagkalapit.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ὅτι
  choice: Hindi naman ibig sabihin na
  rationale: Nagpapasok ito ng paglilinaw o pagtatama sa naunang pahayag, hindi ng sanhi. Likas sa makabagong Tagalog ang pariralang ito at napapanatili ang puwersang naglilinaw.
- source_word: τὸν πατέρα
  choice: sa Ama
  rationale: Karaniwang gamit sa Juan para sa Diyos bilang Ama; ang malaking titik ay nagpapakitang banal na titulo ang tinutukoy nang walang idinaragdag na kahulugan.
- source_word: ἑώρακέν τις
  choice: may sinumang nakakita
  rationale: Sa kontekstong may pagtanggi, ang τις ay natural na 'sinuman.' Ang perpektong panahunan ng ὁράω ay ipinahahayag nang maayos ng 'nakakita,' na sa Tagalog ay maaari ring magtaglay ng nananatiling kabuluhan ayon sa konteksto.
- source_word: εἰ μὴ
  choice: maliban sa
  rationale: Nagsasaad dito ng eksepsiyon, hindi ng kondisyon.
- source_word: ὁ ὢν παρὰ τοῦ θεοῦ
  choice: ang nagmula sa Diyos
  rationale: Ang substantibong participle ay tumutukoy sa isang natatanging persona, at ang παρά na may genitive ay pangunahing maaaring magpahiwatig ng pinagmulan. Ang 'nagmula sa Diyos' ay natural at hindi labis na nagtatakda sa personal o metapisikal na detalye.
- source_word: οὗτος
  choice: siya ang
  rationale: Malinaw na tumutukoy pabalik sa naunang natatanging persona; pinananatili ng 'siya ang' ang diin ng demonstrative nang hindi tunog pilit.
- source_word: ἑώρακεν
  choice: nakakita
  rationale: Natural na anyo sa Tagalog para sa natapos na pagkakita na may kabuluhan sa kasalukuyang pahayag.
theological_decisions:
- issue: Ugnayan ng tinutukoy na persona sa Diyos sa παρὰ τοῦ θεοῦ
  choice: nagmula sa Diyos
  alternative: nanggaling sa piling ng Diyos / kasama ng Diyos
  rationale: Pinananatili ng pangunahing teksto ang diwa ng pinagmulan, samantalang inilalagay sa talababa ang posibleng diwa ng personal na pagkalapit. Hindi nito labis na tinutukoy ang metapisikal na kahulugan o ipinapasok ang isang partikular na doktrinal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'Hindi naman ibig sabihin na' bilang natural na paglilinaw, at 'siya ang' upang mapanatili ang diin ng οὗτος. Ang marker na [a] ay nasa pangunahing teksto.
