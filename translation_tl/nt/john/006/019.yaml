id: JHN.6.19
reference: John 6:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐληλακότες οὖν ὡς σταδίους εἴκοσι πέντε ἢ τριάκοντα θεωροῦσιν τὸν Ἰησοῦν περιπατοῦντα ἐπὶ τῆς θαλάσσης καὶ ἐγγὺς τοῦ πλοίου γινόμενον, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/019.yaml
  text: So when they had rowed about twenty-five or thirty stadia[a], they saw Jesus walking on the sea and coming near the boat[b], and they were afraid.
translation:
  language: tl
  text: Kaya, nang makapagsagwan na sila nang mga dalawampu't lima o tatlumpung estadio[a], nakita nila si Jesus na naglalakad sa ibabaw ng dagat[b] at papalapit sa bangka, at natakot sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang estadio ay isang sinaunang yunit ng distansiya. Ang dalawampu't lima o tatlumpung estadio ay humigit-kumulang lima hanggang anim na kilometro.
    reason: cultural_note
  - marker: b
    text: 'Ang “dagat” dito ay tumutukoy sa Lawa ng Galilea. Maaari ring isalin: “naglalakad sa ibabaw ng tubig.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐληλακότες
  choice: nang makapagsagwan na sila
  rationale: Sa kontekstong pandagat, ang ἐλαύνω ay tumutukoy sa pagpapausad ng bangka sa pamamagitan ng pagsagwan. Ipinahihiwatig ng anyong perfect participle na naganap na ang pagsagwan bago nila nakita si Jesus.
- source_word: οὖν
  choice: Kaya
  rationale: Pinananatili ang ugnayang pasalaysay at lohikal sa naunang pangyayari sa isang likas na makabagong Tagalog.
- source_word: ὡς
  choice: mga
  rationale: Sa sukat, ipinahihiwatig ng ὡς ang pagtatantiya; likas sa Tagalog ang “mga” bago ang bilang.
- source_word: σταδίους εἴκοσι πέντε ἢ τριάκοντα
  choice: dalawampu't lima o tatlumpung estadio
  rationale: Pinananatili ang sinaunang yunit na στάδιος upang maging malinaw ang anyo ng salin mula sa pinagmulan; ibinibigay sa talababa ang katumbas na makabagong sukat.
- source_word: θεωροῦσιν
  choice: nakita nila
  rationale: Malinaw at natural itong katumbas ng pandiwang tumutukoy sa aktuwal na pagkakita sa salaysay, nang hindi gumagamit ng makaluma o labis na pormal na pananalita.
- source_word: περιπατοῦντα ἐπὶ τῆς θαλάσσης
  choice: naglalakad sa ibabaw ng lawa
  rationale: Ang θάλασσα ay tumutukoy rito sa Lawa ng Galilea, at ang “sa ibabaw ng lawa” ay nagpapanatili sa diwa na nasa ibabaw mismo ng katubigan si Jesus, hindi sa tabi nito.
- source_word: ἐγγὺς τοῦ πλοίου γινόμενον
  choice: papalapit sa bangka
  rationale: Ipinakikita ng γινόμενον kasama ng ἐγγύς ang paglapit, hindi lamang ang pagiging malapit; maikli at natural ang “papalapit.”
- source_word: πλοίου
  choice: bangka
  rationale: Sa konteksto ng lawa at mga alagad, mas angkop ang “bangka” kaysa “barko.”
- source_word: ἐφοβήθησαν
  choice: natakot sila
  rationale: Direkta at likas na inilalarawan nito ang naging reaksiyon nila.
theological_decisions:
- issue: Paglalarawan sa himala nang hindi pinahihina ang literal na puwersa nito
  choice: naglalakad sa ibabaw ng lawa
  alternative: naglalakad sa tabi ng lawa; naglalakad sa ibabaw ng tubig
  rationale: Sa konteksto, ang ἐπί na kasama ng genitive ay tumutukoy sa paglakad sa ibabaw ng lawa. Hindi akma ang “sa tabi ng lawa” dahil malayo na sa pampang ang mga alagad. Pinananatili ng salin ang θάλασσα bilang “lawa,” habang nililinaw sa talababa ang mas literal na anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “lawa” bilang natural na pagtukoy sa Galilea ngunit pinanatili sa talababa ang literal na “dagat.” Ang sinaunang yunit na “estadio” ay nasa pangunahing teksto, kalakip ang modernong katumbas sa talababa.
