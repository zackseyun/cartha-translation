  yaml_path: translation/nt/john/006/007.yaml
  text: Philip answered him, “Two hundred denarii worth of bread is not enough for them, so that each one may receive a little.”
translation:
  language: tl
  text: Sumagot si Felipe sa kanya, “Hindi sapat ang tinapay na mabibili sa halagang dalawang daang denario para makatanggap ng kaunti ang bawat isa sa kanila.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διακοσίων δηναρίων
  choice: dalawang daang denario
  rationale: Pinananatili ang sinaunang yunit ng salapi at ang eksaktong bilang sa Griyego; ang anyong “denario” ay malinaw at karaniwan sa saling biblikal na Tagalog.
- source_word: ἄρτοι
  choice: tinapay
  rationale: Natural na kolektibong gamit sa Tagalog para sa mga tinapay o pagkaing tinapay sa kontekstong ito.
- source_word: οὐκ ἀρκοῦσιν
  choice: hindi iyon sasapat
  rationale: Ipinahahayag ang kakulangan ng mabibiling tinapay nang natural sa Tagalog, habang pinananatili ang diwa ng ἀρκέω.
- source_word: ἵνα ἕκαστος βραχύ τι λάβῃ
  choice: para makakuha ng kaunti ang bawat isa
  rationale: Pinananatili ang layon o bunga na ipinahihiwatig ng ἵνα at ang di-tiyak na “kaunti” ng βραχύ τι.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “Kahit … ang ipambili” upang maipahayag nang idiomatiko na maging ang tinapay na nagkakahalaga ng dalawang daang denario ay hindi sapat, nang hindi nagdaragdag ng paliwanag tungkol sa modernong halaga nito.
