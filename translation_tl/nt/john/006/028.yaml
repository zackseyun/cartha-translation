  source_fidelity: Tumpak na naipapahayag ng salin ang tanong na deliberatibo (Τί ποιῶμεν), ang layunin sa ἵνα, at ang sinadyang ugnayan ng ἐργαζώμεθα at ἔργα. Ang “mga gawa ng Diyos” ay angkop na pinananatiling bukás ang saklaw ng genitive na τοῦ θεοῦ.
  naturalness: Natural at malinaw ang makabagong Filipino. Ang “Kaya sinabi nila sa kanya” ay maayos na pagsasalin ng οὖν sa daloy ng salaysay, at ang eksklusibong “naming/namin” ay wasto dahil si Jesus ang kausap, hindi kasali sa pangkat.
  terminology: Ang “mga gawa ng Diyos” ay matatag at naaangkop na pananalitang teolohikal nang hindi ipinapataw ang isang pakahulugan. Ang talababa ay kapaki-pakinabang at hindi nililimitahan ang kalabuan ng Griyego.
