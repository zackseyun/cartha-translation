reference: John 6:28
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἶπον οὖν πρὸς αὐτόν· Τί ποιῶμεν ἵνα ἐργαζώμεθα τὰ ἔργα τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/028.yaml
  text: Then they said to him[a], “What must we do so that we may work the works of God?”
translation:
  language: tl
  text: Kaya sinabi nila sa kanya, “Ano ang dapat naming gawin upang magawa namin ang mga gawa ng Diyos?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Ano ang dapat naming gawin upang maisagawa namin ang mga gawang hinihingi ng Diyos?” Ang pariralang Griyego na “mga gawa ng Diyos” ay maaari ring tumukoy sa mga gawang nauukol sa Diyos o ginagawa ng Diyos.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπον
  choice: sinabi nila
  rationale: Ang aorist ng λέγω ay likas na isinasalin bilang payak na pangnagdaang pagsasalaysay. Hindi dinaragdagan ng “sinabi” ang uri o layunin ng pagsasalita.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinahihiwatig ng οὖν ang pagpapatuloy at bahagyang paghinuha mula sa naunang sinabi ni Jesus. Ang “Kaya” ay natural sa makabagong Filipino at hindi labis na nagpapabigat sa lohikal na ugnayan.
- source_word: πρὸς αὐτόν
  choice: sa kanya
  rationale: Kasama ng pandiwa ng pagsasalita, ang πρός na may accusative ay tumutukoy sa taong kinakausap.
- source_word: Τί ποιῶμεν
  choice: Ano ang dapat naming gawin
  rationale: Ang present subjunctive sa tanong na deliberatibo ay nagtatanong kung anong pagkilos ang hinihingi. Ang “dapat naming gawin” ay malinaw at natural, at ang “naming” ay eksklusibo dahil si Jesus ang kanilang kausap.
- source_word: ἵνα
  choice: upang
  rationale: Ipinakikilala ng ἵνα ang layunin; ang “upang” ay maikli, dignificado, at natural sa ganitong tanong.
- source_word: ἐργαζώμεθα τὰ ἔργα
  choice: magawa namin ang mga gawa
  rationale: Pinananatili ng magkaugnay na “magawa” at “mga gawa” ang sinadyang pag-uulit ng ἐργάζομαι at ἔργα, bagaman mas natural ito sa Filipino kaysa sa literal na “gawin ang mga gawa.”
- source_word: τοῦ θεοῦ
  choice: ng Diyos
  rationale: 'Pinananatili ng karaniwang pariralang “mga gawa ng Diyos” ang pagiging bukás ng genitive: maaaring mga gawang hinihingi ng Diyos, nauukol sa Diyos, o ginagawa ng Diyos.'
theological_decisions:
- issue: Kahulugan ng genitive sa τὰ ἔργα τοῦ θεοῦ
  choice: Panatilihin sa pangunahing teksto ang “mga gawa ng Diyos” nang hindi nililinaw kung ang mga ito ay hinihingi, pag-aari, o ginagawa ng Diyos.
  alternative: “mga gawang hinihingi ng Diyos” o “mga gawang ginagawa ng Diyos”
  rationale: Bukas sa higit sa isang ugnayan ang genitive sa Griyego, at mahalaga ang tensiyong ito sa sagot sa kasunod na talata. Hindi dapat unahan ng salin ang paglilinaw na ginagawa ng konteksto.
translation_notes:
  register: Makabago at dignipikadong Filipino na madaling maunawaan. Ginamit ang “namin” sapagkat kausap nila si Jesus at hindi siya kasama sa pangkat na tinutukoy. Pinanatili ang pag-uulit na magawa/mga gawa at ang tunay na kalabuan ng “ng Diyos.”
