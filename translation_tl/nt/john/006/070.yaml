  yaml_path: translation/nt/john/006/070.yaml
  text: Jesus answered them[a], “Did I not choose you, the Twelve? Yet one of you is a devil.”
translation:
  language: tl
  text: Sumagot sa kanila si Jesus, “Hindi ba ako ang pumili sa inyo, kayong Labindalawa? Ngunit isa sa inyo ay isang diyablo.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang maninirang-puri.” Ang salitang Griyego ay maaaring tumukoy sa isang bulaang tagapagparatang o, sa maraming konteksto, sa Diyablo. Dito, naglalarawan ito ng katangian sa halip na tuwirang tukuyin ang taong iyon bilang si Satanas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: Sumagot
  rationale: Likas at karaniwang pandiwang pasalaysay sa makabagong Filipino para sa tugon sa isang naunang pahayag.
- source_word: Οὐκ ἐγὼ ... ἐξελεξάμην;
  choice: Hindi ba’t ako ang pumili
  rationale: Pinananatili ang tanong na umaasang sasang-ayunan at ang diin ng ἐγώ sa pamamagitan ng “ako ang.”
- source_word: ὑμᾶς τοὺς δώδεκα
  choice: sa inyong Labindalawa
  rationale: Ipinakikita ng “Labindalawa” ang kinikilalang katawagan sa pangkat, habang natural sa Filipino ang konstruksiyong “pumili sa inyong.”
- source_word: καὶ
  choice: Ngunit
  rationale: Bagaman karaniwang nangangahulugang “at,” malinaw na naghahayag dito ng pagsalungat sa pagitan ng pagpili sa Labindalawa at ng katangian ng isa sa kanila.
- source_word: ἐξ ὑμῶν
  choice: isa sa inyo
  rationale: Natural na Filipino para sa partitive na diwa na ang tinutukoy ay kabilang sa pangkat.
- source_word: διάβολός
  choice: isang diyablo
  rationale: Pinananatili ang matindi at kwalitatibong paglalarawan ng anarthrous na pangngalan nang hindi ito ginagawang tuwirang pagkakakilanlan bilang “ang Diyablo.”
theological_decisions:
- issue: Kung ang διάβολός ay tuwirang pagkakakilanlan kay Satanas o kwalitatibong paglalarawan
  choice: isang diyablo
  alternative: isang maninirang-puri; ang Diyablo
  rationale: Walang artikulo ang διάβολος at ginagamit bilang panaguring pangngalan, kaya inilalarawan nito ang isa sa Labindalawa nang hindi tahasang sinasabing siya mismo si Satanas. Pinananatili ng “isang diyablo” ang talim at teolohikal na tensiyon ng pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Hindi ba’t” upang natural na maipahayag ang retorikal na tanong, at ang “Labindalawa” bilang katawagan sa kinikilalang pangkat.
