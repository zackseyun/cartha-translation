  text: ἦν δὲ ἐγγὺς τὸ πάσχα, ἡ ἑορτὴ τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/004.yaml
  text: The Passover[a], the feast of the Jews, was near.
translation:
  language: tl
  text: Malapit na ang Paskuwa[a], ang pista ng mga Judio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang pista ng mga taga-Judea.” Ang salitang Griyego ay maaaring tumukoy sa mga Judio sa pangkalahatan o sa mga taga-Judea, ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: noon
  rationale: Mahinang pang-ugnay ito na nagpapatuloy at nagtatakda ng tagpo sa salaysay. Ang “noon” ay natural sa Filipino at hindi nagpapahiwatig ng matinding pagsalungat.
- source_word: ἐγγὺς
  choice: malapit na
  rationale: Kasama ng ἦν, tumutukoy ito sa pagkalapit sa panahon; “malapit na” ang malinaw at likas na katumbas sa Filipino.
- source_word: πάσχα
  choice: Paskuwa
  rationale: Tumutukoy ito sa kapistahang Judio na Passover; “Paskuwa” ang tiyak at kinikilalang katawagang biblikal sa Filipino.
- source_word: ἑορτὴ
  choice: pista
  rationale: Tumutukoy ito sa isang pagdiriwang na panrelihiyon. Ang “pista” ay maikli, natural, at nauunawaan ng karaniwang mambabasa.
- source_word: τῶν Ἰουδαίων
  choice: ng mga Judio
  rationale: Sa kontekstong ito, ang Paskuwa ay pista ng buong bayang Judio, hindi lamang ng mga taga-Judea; gayunman, ang posibleng heograpikong kahulugan ng termino ay inilalahad sa talababa.
theological_decisions:
- issue: Pagpapakahulugan sa Ἰουδαίων sa salaysay ni Juan
  choice: ng mga Judio
  alternative: ng mga taga-Judea
  rationale: Bagaman maaaring tumukoy ang Ἰουδαῖοι sa mga taga-Judea o sa ilang awtoridad sa ibang konteksto, dito ay inilalarawan ang Paskuwa bilang pambansa at panrelihiyong pista ng mga Judio. Pinananatili sa talababa ang tunay na saklaw ng salitang Griyego nang hindi nagpapasok ng laban-sa-Judiong pahiwatig.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Paskuwa” bilang kinikilalang katawagang biblikal at “pista” bilang natural na salita para sa pagdiriwang na panrelihiyon.
