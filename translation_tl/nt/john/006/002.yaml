id: JHN.6.2
reference: John 6:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸂ἠκολούθει δὲ⸃ αὐτῷ ὄχλος πολύς, ὅτι ⸀ἐθεώρουν τὰ σημεῖα ἃ ἐποίει ἐπὶ τῶν ἀσθενούντων.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/002.yaml
  text: And a large crowd was following him[a], because they were seeing the signs that he was doing on those who were sick.
translation:
  language: tl
  text: At sinusundan siya ng napakaraming tao, sapagkat nakikita nila ang mga tanda[a] na ginagawa niya sa mga maysakit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga himala” o “mga mahimalang tanda.” Ang salitang ginagamit ni Juan ay nagbibigay-diin sa inihahayag ng mga gawang ito tungkol kay Jesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκολούθει
  choice: sinusundan
  rationale: Ipinahahayag ng imperpektibo ang nagpapatuloy na kilos sa nakaraan; sa daloy ng salaysay, likas sa Filipino ang “sinusundan” nang hindi kailangang idagdag ang “noon.”
- source_word: δὲ
  choice: At
  rationale: Banayad na pang-ugnay ito na nagpapatuloy sa salaysay, hindi matinding pagsalungat.
- source_word: ὄχλος πολύς
  choice: napakaraming tao
  rationale: Likas at malinaw na Filipino para sa isang malaking pulutong, habang pinananatili ang diin sa dami.
- source_word: ἐθεώρουν
  choice: nakikita nila
  rationale: Ipinahihiwatig ng imperpektibo ang patuloy o paulit-ulit na pagkakita; ang “nakikita nila” ay natural at hindi labis na nagpapakahulugan sa antas ng pagmamasid.
- source_word: σημεῖα
  choice: mga tanda
  rationale: 'Pinananatili nito ang natatanging gamit ni Juan: mga gawang hindi lamang himala kundi nagtuturo sa kung sino si Jesus.'
- source_word: ἐποίει
  choice: ginagawa niya
  rationale: Natural na salin ng nagpapatuloy na kilos at hindi nagdaragdag ng paliwanag na wala sa Griyego.
- source_word: ἐπὶ τῶν ἀσθενούντων
  choice: sa mga maysakit
  rationale: Maikli at natural na ipinahahayag ang mga maysakit bilang mga taong pinagtutuunan ng mga tanda, habang hindi pinipilit ang isang mas makitid na ugnayang sintaktiko.
- source_word: ἀσθενούντων
  choice: mga maysakit
  rationale: Sa konteksto, tumutukoy ito sa mga taong may karamdamang pisikal; karaniwan at malinaw ang “maysakit.”
theological_decisions:
- issue: Terminong σημεῖα sa Ebanghelyo ni Juan
  choice: mga tanda
  alternative: mga himala; mga mahimalang tanda
  rationale: Ang “mga tanda” ay nagpapanatili sa pahiwatig na ang mga gawa ni Jesus ay naghahayag ng kanyang pagkakakilanlan, nang hindi nililimitahan ang salita sa pagiging sobrenatural lamang.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “napakaraming tao” sa halip na mas pormal na “malaking pulutong,” at pinanatili ang susing terminong Juaninong “mga tanda.”
