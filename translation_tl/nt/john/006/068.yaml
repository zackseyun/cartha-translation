  text: ⸀ἀπεκρίθη αὐτῷ Σίμων Πέτρος· Κύριε, πρὸς τίνα ἀπελευσόμεθα; ῥήματα ζωῆς αἰωνίου ἔχεις,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/068.yaml
  text: Simon Peter answered him[a], “Lord, to whom will we go? You have words of eternal life,”
translation:
  language: tl
  text: Sumagot si Simon Pedro sa kanya, “Panginoon,[a] kanino kami pupunta? Mayroon kang mga salita ng buhay na walang hanggan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ginoo.” Ang salitang Griego ay maaari ring gamitin bilang magalang na tawag, ngunit ang “Panginoon” ang karaniwang salin ng κύριος at angkop sa gamit nito rito sa Juan.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῷ
  choice: Sumagot sa kanya
  rationale: Likas na salaysay sa Filipino para sa tugon sa kausap; malinaw na tumutukoy kay Jesus ang panghalip.
- source_word: Σίμων Πέτρος
  choice: Simon Pedro
  rationale: Ginagamit ang nakaugaliang anyo ng pangalan sa modernong salin sa Filipino.
- source_word: Κύριε
  choice: Panginoon
  rationale: Pinananatili ang karaniwang salin ng κύριος at ang sabay na paggalang at posibleng kristolohikal na bigat ng tawag.
- source_word: πρὸς τίνα ἀπελευσόμεθα
  choice: kanino kami pupunta?
  rationale: Natural na tanong sa Filipino na pinananatili ang personal na layon ng πρὸς τίνα at ang hinaharap na diwa ng pandiwa.
- source_word: ῥήματα ζωῆς αἰωνίου ἔχεις
  choice: Nasa iyo ang mga salitang nagbibigay ng buhay na walang hanggan
  rationale: Ang idiomatikong “nasa iyo” ay nagpapahayag ng ἔχεις. Ang genitibong ζωῆς αἰωνίου ay maaaring magpahiwatig na ang mga salita ay naghahatid o nagbibigay ng buhay; nililinaw ito sa natural na Filipino nang hindi inaalis ang ugnayan ng mga salita at buhay na walang hanggan.
theological_decisions:
- issue: Lakas ng Κύριε bilang tawag kay Jesus
  choice: Panginoon
  alternative: Guro
  rationale: Ang “Panginoon” ay nagpapanatili kapwa sa magalang na pagtawag at sa teolohikal na resonansiya ng κύριος sa Juan, nang hindi ipinipilit ang higit sa sinasabi ng teksto.
- issue: Ugnayan ng ῥήματα at ζωῆς αἰωνίου
  choice: mga salitang nagbibigay ng buhay na walang hanggan
  alternative: mga salita ng buhay na walang hanggan
  rationale: Hindi tiyak sa anyong genitibo lamang kung pinagmumulan, nilalaman, o bisa ang diin. Pinili ang natural na pariralang Filipino na umaayon sa konteksto ng Juan 6, habang kinikilalang mas pormal at mas malabo ang alternatibo.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang “kami” sapagkat kausap ni Pedro si Jesus at tinutukoy niya ang sarili kasama ng ibang alagad, hindi kasama ang kausap.
