id: JHN.6.27
reference: John 6:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐργάζεσθε μὴ τὴν βρῶσιν τὴν ἀπολλυμένην ἀλλὰ τὴν βρῶσιν τὴν μένουσαν εἰς ζωὴν αἰώνιον, ἣν ὁ υἱὸς τοῦ ἀνθρώπου ὑμῖν δώσει, τοῦτον γὰρ ὁ πατὴρ ἐσφράγισεν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/027.yaml
  text: Do not work for the food that perishes[a], but for the food that remains to eternal life, which the Son of Man will give to you[b]; for God the Father has set his seal on him.
translation:
  language: tl
  text: Huwag kayong magpagal para sa pagkaing nasisira, kundi para sa pagkaing nananatili para sa buhay na walang hanggan, na ibibigay sa inyo ng Anak ng Tao; sapagkat siya ay tinatakan ng Diyos na Ama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “tinatakan” ay maaaring magpahiwatig na siya ay pinatunayan o binigyang-awtoridad ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐργάζεσθε
  choice: magpagal para
  rationale: Ipinahahayag ang pautos na diwa at ang pagsisikap para sa isang layunin; natural ito sa konteksto ng paghahanap ng pagkain.
- source_word: βρῶσιν
  choice: pagkain
  rationale: Tumutukoy rito sa kinakain o ikinabubuhay, hindi sa mismong gawain ng pagkain.
- source_word: ἀπολλυμένην
  choice: nasisira
  rationale: Ipinahahayag na ang karaniwang pagkain ay nabubulok o nawawala, habang nananatiling sapat ang mas malawak na diwa ng paglipas.
- source_word: μένουσαν
  choice: nananatili
  rationale: Pinananatili ang tuwirang kaibahan sa pagkaing nasisira at ang mahalagang Johannine na diwa ng μένω.
- source_word: εἰς ζωὴν αἰώνιον
  choice: tungo sa buhay na walang hanggan
  rationale: Ipinakikita ang direksiyon o kinahihinatnan ng εἰς nang hindi ito ginagawang mas tiyak kaysa sa Griyego.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak ng Tao
  rationale: Karaniwang salin ng titulo na nagpapanatili sa anyo at mga pahiwatig nito sa Kasulatan.
- source_word: ὑμῖν δώσει
  choice: ibibigay sa inyo
  rationale: Likas na Filipino na malinaw na pinananatili ang panghinaharap at ang tatanggap.
- source_word: ἐσφράγισεν
  choice: tinatakan
  rationale: Pinananatili ang metapora ng σφραγίζω sa halip na palitan agad ng interpretasyong 'pinahintulutan' o 'pinatunayan.'
- source_word: ὁ πατὴρ ... ὁ θεός
  choice: Diyos na Ama
  rationale: Natural na Filipino para sa apposisyong kumikilala sa Ama bilang Diyos, nang walang idinadagdag na pormulasyong wala sa teksto.
theological_decisions:
- issue: Kahulugan ng paggawa para sa pagkaing nananatili
  choice: magpagal para sa pagkaing nananatili
  alternative: pagpaguran ang pagkaing nananatili
  rationale: Hindi nilulutas ng salin kung paano kaugnay ang utos na ito sa kasunod na pahayag na ibibigay ng Anak ng Tao ang pagkain; pinananatili ang tensiyon sa pagitan ng pagsisikap at kaloob.
- issue: Metapora ng pagtatatak sa Anak ng Tao
  choice: siya ay tinatakan ng Diyos na Ama
  alternative: siya ay pinatunayan o binigyang-awtoridad ng Diyos na Ama
  rationale: Pinananatili ang larawan ng selyo at hindi nililimitahan ang posibleng saklaw nito sa awtorisasyon lamang.
- issue: Apposisyon ng Ama at Diyos
  choice: Diyos na Ama
  alternative: ang Ama, ang Diyos
  rationale: Malinaw at natural na kinikilala ang Ama bilang Diyos habang iniiwasang magdagdag ng doktrinal na paliwanag na lampas sa talata.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang maramihang “kayo” ayon sa ὑμῖν at pinanatili ang metapora ng pagtatatak. Iniwasan ang sobrang literal na “gumawa” dahil maaaring magtunog na lumikha ng pagkain; ang “magpagal para” ay mas malinaw sa kasalukuyang Filipino.
