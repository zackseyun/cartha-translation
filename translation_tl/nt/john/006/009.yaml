id: JHN.6.9
reference: John 6:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἔστιν ⸀παιδάριον ὧδε ⸀ὃς ἔχει πέντε ἄρτους κριθίνους καὶ δύο ὀψάρια· ἀλλὰ ταῦτα τί ἐστιν εἰς τοσούτους;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/009.yaml
  text: There is a boy here who has five barley loaves and two fish[a], but what are these for so many?
translation:
  language: tl
  text: “May isang batang lalaki rito na may limang tinapay na sebada at dalawang isda. Ngunit ano ang mga ito para sa ganito karaming tao?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδάριον
  choice: batang lalaki
  rationale: Tumutukoy ito sa isang bata o batang lalaki. Likas at malinaw sa makabagong Filipino ang “batang lalaki,” nang hindi ipinapalagay na napakaliit pa niya.
- source_word: ὧδε
  choice: rito
  rationale: Tuwirang pang-abay na panlunan; natural ang “rito” sa pahayag ng isang nagsasalita tungkol sa malapit na kinaroroonan.
- source_word: ὃς ἔχει
  choice: na may
  rationale: Natural at maikli itong paraan sa Filipino upang tukuyin ang batang lalaki batay sa taglay niya.
- source_word: ἄρτους κριθίνους
  choice: mga tinapay na sebada
  rationale: Ang ἄρτους ay tinapay o mga piraso nito, at tinutukoy ng κριθίνους na gawa ang mga iyon sa sebada. Mas malinaw at karaniwan sa Filipino ang “tinapay na sebada” kaysa sa teknikal na “limang bilog na tinapay.”
- source_word: ὀψάρια
  choice: isda
  rationale: Sa kontekstong ito, tumutukoy ang salita sa isdang kinakain kasama ng tinapay. Hindi idinagdag ang “maliliit” dahil bagaman maaari itong ipahiwatig ng anyo ng salita, hindi kailangang espesipikahin ang laki.
- source_word: ἀλλὰ
  choice: ngunit
  rationale: Malinaw nitong minamarkahan ang pagsalungat sa pagitan ng pagkaing mayroon at ng napakaraming taong pakakainin, habang pinananatili ang marangal na rehistro.
- source_word: ταῦτα τί ἐστιν
  choice: ano ang mga ito
  rationale: Pinananatili nito ang konkretong anyo at retorikal na lakas ng tanong. Bagaman isahan ang pandiwa sa Griyego kasunod ng pangmaramihang neuter na simuno, pangmaramihan ang natural na pagtukoy sa Filipino.
- source_word: εἰς τοσούτους
  choice: para sa ganito karaming tao
  rationale: Ipinahahayag nito ang kakulangan ng pagkaing nabanggit kaugnay ng napakaraming tao. Idinagdag ang “tao” upang maging natural at malinaw ang Filipino nang hindi binabago ang diwa.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang retorikal na tanong at ang ipinahihiwatig na kakulangan ng pagkain, nang hindi ito ginawang tahasang paliwanag. Walang talababa sapagkat natural na naipahahayag sa pangunahing teksto ang evaluative na diwa ng ταῦτα τί ἐστιν εἰς τοσούτους.
