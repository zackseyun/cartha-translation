  yaml_path: translation/nt/john/006/013.yaml
  text: So they gathered them[b][a], and filled twelve baskets with pieces from the five barley loaves left over by those who had eaten.
translation:
  language: tl
  text: Kaya tinipon nila ang mga iyon, at pinuno nila ang labindalawang basket ng mga piraso[a] mula sa limang tinapay na sebada na natira matapos kumain ang mga tao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mga piraso ng pinagputol-putol na tinapay.”
    reason: lexical_alternative
  - marker: b
    text: 'Sa mas literal na ayos: “na lumabis para sa mga kumain.” Ang diwa ay ang mga bahaging sumobra o natira pagkatapos nilang kumain.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήγαγον οὖν
  choice: Kaya tinipon nila ang mga iyon
  rationale: Ipinapakita ng “Kaya” ang bunga ng utos ni Jesus sa naunang talata. Ang “mga iyon” ay likas na tumutukoy sa mga natirang piraso na ipinapapulot.
- source_word: ἐγέμισαν δώδεκα κοφίνους
  choice: napuno nila ang labindalawang basket
  rationale: Tuwirang pinananatili ang kilos, bilang, at karaniwang kahulugan ng κοφίνους nang hindi nagdaragdag ng di-tiyak na uri o laki ng basket.
- source_word: κλασμάτων
  choice: mga piraso
  rationale: Natural at malinaw sa makabagong Tagalog; tumutukoy sa mga pinagputol-putol o nabaling bahagi ng tinapay. Itinatala sa talababa ang alternatibong “mga piraso ng pinagputol-putol na tinapay.”
- source_word: ἐκ τῶν πέντε ἄρτων τῶν κριθίνων
  choice: mula sa limang tinapay na sebada
  rationale: Pinananatili ang pinagmulan at sangkap ng tinapay. Ang “tinapay na sebada” ay mas likas kaysa sa isang mahigpit ngunit alanganing anyo gaya ng “mga limpak na sebada.”
- source_word: ἃ ἐπερίσσευσαν τοῖς βεβρωκόσιν
  choice: na natira matapos kumain ang mga tao
  rationale: Ipinahahayag sa likas na Tagalog ang diwa ng sobrang natira kaugnay ng mga nakakain na. Ang mas literal na ugnayang “lumabis para sa mga kumain” ay inilalagay sa talababa upang hindi ikubli ang anyo at bahagyang pagkalabo ng Griyego.
