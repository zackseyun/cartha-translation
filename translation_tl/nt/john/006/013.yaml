translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang “basket” at “sebada,” at iniwasan ang mga makaluma o labis na teknikal na salita. Inilapit sa natural na salaysay ang huling sugnay habang pinananatili sa talababa ang mas literal na ugnayan ng Griyego.
