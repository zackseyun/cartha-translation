  text: εἶπον οὖν πρὸς αὐτόν· Κύριε, πάντοτε δὸς ἡμῖν τὸν ἄρτον τοῦτον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/034.yaml
  text: So they said to him[a], “Lord, always give us this bread.”
translation:
  language: tl
  text: Kaya sinabi nila sa kanya, “Panginoon,[a] lagi mo kaming bigyan ng tinapay na ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ginoo.” Ang salitang Griyego ay maaaring gamitin bilang magalang na pantawag at maaari ring mangahulugang “Panginoon.”
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπον
  choice: sinabi nila
  rationale: Ang aorist ng λέγω ay karaniwang salaysay na pandiwa para sa pagsasalita; natural itong isalin bilang “sinabi nila” nang hindi dinaragdagan ang uri ng kilos-pananalita.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinapakita ng οὖν ang tugon o bunga ng naunang pag-uusap. Ang “Kaya” ay natural sa makabagong Tagalog at malinaw na nag-uugnay sa konteksto.
- source_word: πρὸς αὐτόν
  choice: sa kanya
  rationale: Kapag kasama ng pandiwa ng pagsasalita, ang πρός na may accusative ay tumutukoy sa kinakausap; ang “sa kanya” ang likas na katumbas sa Tagalog.
- source_word: Κύριε
  choice: Panginoon
  rationale: Pinananatili ng “Panginoon” ang karaniwang salin ng κύριος at ang posibilidad na ito ay kapwa magalang na tawag at may mas malalim na kahulugan sa konteksto ni Juan.
- source_word: πάντοτε
  choice: lagi
  rationale: Ang πάντοτε ay nangangahulugang “palagi” o “lagi.” Mas natural sa tuwirang pakiusap ang “lagi” at ipinahihiwatig nito ang patuloy na pagkakaloob.
- source_word: δὸς
  choice: bigyan
  rationale: Ang aorist imperative ng δίδωμι ay isang tuwirang pakiusap. Sa Tagalog, hinihingi ng hulma ng pangungusap ang “bigyan” kasama ng layong “kami.”
- source_word: ἡμῖν
  choice: kami
  rationale: Ang dative na ἡμῖν ang tumatanggap ng ibinibigay; sa pokus na gamit ng “bigyan,” natural itong anyong “kami.”
- source_word: τὸν ἄρτον τοῦτον
  choice: ang tinapay na ito
  rationale: Ang ἄρτος ay “tinapay,” at pinananatili ng “na ito” ang demonstratibong pagtukoy sa tinapay na katatalakay lamang.
theological_decisions:
- issue: Pagkasalin sa κύριος bilang tuwirang tawag kay Jesus
  choice: Panginoon
  alternative: Ginoo
  rationale: Maaaring gumana ang Κύριε bilang magalang na “Ginoo,” at maaaring hindi pa lubos ang pagkaunawa ng mga nagsasalita. Gayunman, pinananatili ng “Panginoon” ang mas malawak na semantikong posibilidad at ang teolohikal na tensiyon nang hindi ipinapalagay na lubos na nilang kinikilala ang kahulugan nito.
translation_notes:
  register: Makabago, natural, at marangal na Tagalog. Ginamit ang “lagi mo kaming bigyan” bilang karaniwang anyo ng pakiusap para sa patuloy na pagkakaloob; iniwasan ang mas matigas o makalumang “palagi mong ibigay sa amin.”
