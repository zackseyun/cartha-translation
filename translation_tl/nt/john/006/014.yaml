id: JHN.6.14
reference: John 6:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἱ οὖν ἄνθρωποι ἰδόντες ⸂ὃ ἐποίησεν σημεῖον⸃ ⸀ἔλεγον ὅτι Οὗτός ἐστιν ἀληθῶς ὁ προφήτης ὁ ἐρχόμενος εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/014.yaml
  text: So when the people saw the sign that he had done[a], they were saying[b], “This truly is the Prophet who is coming into the world.”
translation:
  language: tl
  text: Kaya nang makita ng mga tao ang tandang ginawa niya,[a] sinabi nila, “Tunay ngang siya ang Propeta na darating sa sanlibutan.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang himalang ginawa niya.” Karaniwang ginagamit ni Juan ang “tanda” (σημεῖον) upang idiin na ang mga gawa ni Jesus ay naghahayag kung sino siya, hindi lamang na ang mga ito ay makahimala.
    reason: lexical_alternative
  - marker: b
    text: Ang “Propeta” ay malamang na tumutukoy sa inaasahang propetang tulad ni Moises (Deuteronomio 18:15–18).
    reason: cross_reference
lexical_decisions:
- source_word: οἱ οὖν ἄνθρωποι
  choice: Kaya ... ng mga tao
  rationale: Ang ἄνθρωποι ay tumutukoy sa mga tao sa karamihan, hindi lamang sa mga lalaki. Ipinahahayag ng “Kaya” ang pagsulong o bunga sa salaysay na dala ng οὖν.
- source_word: ἰδόντες
  choice: nang makita
  rationale: Likas na inililipat sa Filipino ang aorist participle bilang sugnay na panahunan; ipinakikita ng “nang makita” na nauna ang pagkakita sa kanilang sinabi.
- source_word: ὃ ἐποίησεν σημεῖον
  choice: ang tandang ginawa niya
  rationale: Pinananatili ng “tanda” ang mahalagang gamit ni Juan sa σημεῖον bilang gawang naghahayag kung sino si Jesus, sa halip na ituon lamang sa pagiging himala nito.
- source_word: ἔλεγον
  choice: sinabi nila
  rationale: Ang imperpektong Griyego ay maaaring maglarawan ng nagpapatuloy o sama-samang pagsasalita. Sa kontekstong ito, ang natural na Filipino na “sinabi nila” ay hindi nagpapasya kung minsanan o paulit-ulit ang pagkakasabi.
- source_word: ἀληθῶς
  choice: Tunay nga
  rationale: Ang “tunay nga” ay natural at mariing nagpapahayag ng pagkilalang dala ng ἀληθῶς.
- source_word: ὁ προφήτης
  choice: ang Propeta
  rationale: Ang tiyak na artikulo at konteksto ay tumutukoy sa isang inaasahang natatanging propeta. Ang malaking titik ay nagpapakitang ginagamit ito bilang titulo nang hindi isinasama sa teksto ang tahasang pagkakakilanlan.
- source_word: ὁ ἐρχόμενος εἰς τὸν κόσμον
  choice: na darating sa sanlibutan
  rationale: Natural na ipinahahayag nito sa Filipino ang inaasahang pagdating ng tinutukoy na Propeta. Ang “sanlibutan” ay angkop sa Johannine na gamit ng κόσμος at hindi lamang nangangahulugang pisikal na daigdig.
theological_decisions:
- issue: Pagkakakilanlan sa “ang Propeta”
  choice: Panatilihin ang “ang Propeta” nang hindi tahasang kinikilalang propetang tulad ni Moises sa pangunahing teksto.
  alternative: “ang propetang tulad ni Moises” o “isang propeta”
  rationale: Malamang na tumutukoy ito sa inaasahang propetang gaya ni Moises sa Deuteronomio 18:15–18, ngunit “ang Propeta” lamang ang tahasang sinasabi ng Griyego. Pinananatili ng salin ang pahiwatig at tensiyong teolohikal nang hindi dinaragdagan ang teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sanlibutan” para sa κόσμος dahil pamilyar ito sa biblikal na Filipino at pinananatili ang mas malawak na diwa kaysa sa pisikal na “mundo” lamang. Ang mga panandang [a] at [b] ay kapwa nasa pangunahing teksto.
