lexical_decisions:
- source_word: Ὡς δὲ
  choice: Nang
  rationale: Ipinakikilala ng parirala ang paglipat sa sumunod na pangyayari ayon sa panahon; natural itong naipahahayag sa Tagalog sa pamamagitan ng “Nang,” samantalang hindi kailangang gawing lantad ang mahinang pang-ugnay na δέ.
- source_word: ὀψία ἐγένετο
  choice: gumabi na
  rationale: Likas at maikli itong katumbas sa modernong Tagalog ng idyomang tumutukoy sa pagsapit ng gabi.
- source_word: κατέβησαν
  choice: bumaba
  rationale: Pinananatili nito ang tahasang diwa ng pagkilos pababa na taglay ng καταβαίνω.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ang mga alagad niya
  rationale: Natural na ayos sa Tagalog para sa pangngalang may panghalip na paari.
- source_word: ἐπὶ τὴν θάλασσαν
  choice: patungo sa lawa
  rationale: Ang ἐπί na may accusative pagkatapos ng pandiwa ng pagkilos ay nagsasaad ng direksiyon o hantungan. Ang θάλασσα ay literal na “dagat,” ngunit ang tinutukoy na Dagat ng Galilea ay isang lawa; “lawa” ang mas likas at heograpikong malinaw sa karaniwang mambabasang Tagalog, habang itinatala sa talababa ang literal na salita.
