id: JHN.6.60
reference: John 6:60
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Πολλοὶ οὖν ἀκούσαντες ἐκ τῶν μαθητῶν αὐτοῦ εἶπαν· Σκληρός ἐστιν ⸂ὁ λόγος οὗτος⸃· τίς δύναται αὐτοῦ ἀκούειν;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/060.yaml
  text: Therefore many of his disciples[a], when they heard it, said, “This word is hard[b]; who can listen to it?”
translation:
  language: tl
  text: Kaya nang marinig ito ng marami sa kanyang mga alagad, sinabi nila, “Mabigat ang pananalitang ito[a]; sino ang kayang makinig dito[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Mahirap ang pahayag na ito” o “Mabigat ang turong ito.” Ang salitang Griego na λόγος ay maaari ring mangahulugang “pahayag,” “mensahe,” o “turo,” at ang σκληρός ay maaaring magpahiwatig ng pagiging mahirap, matindi, o masakit tanggapin.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sino ang kayang makinig at tumanggap nito?” Ang pandiwang Griego ay maaaring mangahulugang makarinig, makinig, o tumalima/tumanggap ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλοὶ οὖν
  choice: Kaya ... marami
  rationale: Ang “marami” ay tumutukoy sa malaking bilang sa loob ng pangkat ng mga alagad, at ang “kaya” ay likas na nag-uugnay sa pahayag sa naunang diskurso bilang bunga o kasunod na reaksiyon.
- source_word: ἀκούσαντες
  choice: nang marinig ito
  rationale: Ipinapahayag nang natural sa Tagalog ang temporal na gamit ng aorist participle; ang “ito” ay tumutukoy sa naunang sinabi o itinuro ni Jesus.
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ
  choice: ng marami sa kanyang mga alagad
  rationale: Ipinakikitang ang mga nagsalita ay marami mula sa mas malawak na pangkat ng kanyang mga alagad.
- source_word: Σκληρός
  choice: Mabigat
  rationale: Sa kontekstong ito, ipinahihiwatig ng salita na mahirap tiisin o tanggapin ang pahayag. Pinananatili ng “mabigat” ang saklaw na maaaring tumukoy sa hirap, tindi, o pagiging masakit pakinggan nang hindi ito nililimitahan sa intelektuwal na kahirapan.
- source_word: ὁ λόγος οὗτος
  choice: ang pananalitang ito
  rationale: Ang λόγος ay tumutukoy sa pahayag o turo na narinig nila. Ang “pananalita” ay natural at sapat na malawak upang hindi ito paliitin sa iisang pangungusap lamang.
- source_word: τίς δύναται
  choice: sino ang kayang
  rationale: Direkta at karaniwang paraan sa modernong Tagalog upang ihayag ang tanong tungkol sa kakayahan.
- source_word: αὐτοῦ ἀκούειν
  choice: makinig dito
  rationale: Ang ἀκούω ay maaaring mangahulugang makarinig, makinig, o tumalima/tumanggap. Ang “makinig dito” ay nagpapanatili sa pandiwang pandinig at nagpapahiwatig ng pakikinig nang may pagtanggap nang hindi tahasang nilulutas ang kahulugan bilang “tanggapin.”
theological_decisions:
- issue: Ang diwa ng pagtutol ng mga alagad sa diskurso ni Jesus
  choice: Ipinahahayag na mabigat—mahirap tiisin o tanggapin—ang pananalita ni Jesus, nang hindi tinutukoy kung ang hirap ay intelektuwal, moral, o dahil nakasasakit ito.
  alternative: Isalin bilang “mahirap unawain” o “hindi matanggap,” na maglilimita sa reklamo sa isang tiyak na uri ng pagtutol.
  rationale: Malawak ang kahulugan ng σκληρός at maaaring magpahiwatig ng tindi, hirap, o pagiging masakit/offensive. Pinananatili ng “mabigat” ang tunay na tensiyon ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “kanyang” sa halip na mas kolokyal na “niya” upang mapanatili ang dignidad ng salaysay, habang nananatiling madaling maunawaan. Ang ayos ng pangungusap ay likas sa Tagalog at pinananatili ang lohikal na ugnayan sa naunang diskurso.
