  source_fidelity: 'Tapat ang salin sa Griyego: ang “marami sa kanyang mga alagad” ay wastong naghahayag ng ἐκ τῶν μαθητῶν αὐτοῦ, ang “Kaya” ay sapat para sa οὖν, at ang “nang marinig ito” ay likas na temporal na pagsasalin ng ἀκούσαντες. Ang “Mabigat ang pananalitang ito” ay maingat na pinananatili ang lawak ng σκληρός at λόγος, nang hindi itinatakda kung ang pagtutol ay dahil sa hirap, tindi, o pagiging mahirap tanggapin. Ang “sino ang kayang makinig dito?” ay pinananatili rin ang sinadyang lawak ng ἀκούειν.'
