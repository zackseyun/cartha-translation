id: JHN.6.24
reference: John 6:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτε οὖν εἶδεν ὁ ὄχλος ὅτι Ἰησοῦς οὐκ ἔστιν ἐκεῖ οὐδὲ οἱ μαθηταὶ αὐτοῦ, ἐνέβησαν αὐτοὶ εἰς τὰ ⸀πλοιάρια καὶ ἦλθον εἰς Καφαρναοὺμ ζητοῦντες τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/024.yaml
  text: So when the crowd saw that Jesus was not there[a], nor his disciples, they themselves got into the boats and came to Capernaum, looking for Jesus.
translation:
  language: tl
  text: Kaya nang makita ng mga tao na wala roon si Jesus, ni ang kanyang mga alagad, sila mismo ay sumakay sa mga bangka[a] at pumunta sa Capernaum upang hanapin si Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “maliliit na bangka”; diminutibong anyo ng salitang “bangka” ang ginamit sa Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε οὖν
  choice: Kaya nang
  rationale: Pinagsasama nito ang ugnayang pasunod o bunga ng οὖν at ang panahong ipinahihiwatig ng ὅτε sa natural na salaysay sa Tagalog.
- source_word: ὁ ὄχλος
  choice: ang mga tao
  rationale: Sa kontekstong ito, tumutukoy ang ὄχλος sa pangkat ng mga taong naroon. Mas natural sa modernong Tagalog ang “mga tao” kaysa sa mas pormal na “karamihan,” habang malinaw pa rin ang kolektibong diwa.
- source_word: εἶδεν
  choice: makita
  rationale: Pinananatili ang tuwirang kahulugan ng pandiwa bilang pagkakita o pagkabatid mula sa kanilang obserbasyon, nang hindi pinalalakas tungo sa “mapagtanto.”
- source_word: οὐκ ἔστιν ἐκεῖ
  choice: wala roon si Jesus
  rationale: Ang eksistensiyal na “wala roon” ang natural na katumbas sa Tagalog ng kawalan ni Jesus sa lugar, sa loob ng nakaraang balangkas ng salaysay.
- source_word: οὐδὲ οἱ μαθηταὶ αὐτοῦ
  choice: ni ang kanyang mga alagad
  rationale: 'Pinananatili ng “ni” ang negatibong pag-uugnay: hindi lamang si Jesus kundi maging ang kanyang mga alagad ay wala roon.'
- source_word: αὐτοὶ
  choice: sila mismo
  rationale: Inilalantad nito ang pagbibigay-diin ng tahasang panghalip sa Griyego.
- source_word: ἐνέβησαν
  choice: sumakay
  rationale: Karaniwan at kongkretong salitang Tagalog para sa pagpasok o pagsakay sa sasakyang-dagat.
- source_word: τὰ πλοιάρια
  choice: mga bangka
  rationale: Natural at malinaw sa pangunahing teksto; ang posibleng diminutibong diwa na “maliliit na bangka” ay pinananatili sa talababa.
- source_word: ἦλθον εἰς Καφαρναούμ
  choice: pumunta sa Capernaum
  rationale: Bagaman pangunahing ‘dumating/pumaroon’ ang ἔρχομαι, mas natural sa pananaw ng salaysay sa Tagalog ang “pumunta” para sa paglalakbay ng mga tao patungo sa Capernaum.
- source_word: ζητοῦντες τὸν Ἰησοῦν
  choice: upang hanapin si Jesus
  rationale: Malinaw na ipinahahayag ang layunin ng kanilang pagpunta at iniiwasan ang posibleng mas espirituwal na himig ng “saliksikin” o “hanap-hanapin.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang “mga tao” para sa kolektibong ὄχλος at pinanatili ang diin ng αὐτοὶ sa “sila mismo.”
