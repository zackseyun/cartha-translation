  yaml_path: translation/nt/john/006/067.yaml
  text: So Jesus said to the Twelve[a], “You do not want to go away too, do you?”
translation:
  language: tl
  text: Kaya sinabi ni Jesus sa Labindalawa[a], “Hindi rin ninyo gustong umalis, hindi ba?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Gusto rin ba ninyong umalis?” Ang tanong sa Griyego ay gumagamit ng μή, na madalas nagpapahiwatig na “hindi” ang inaasahang sagot.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Ipinakikita ang lohikal at pasalaysay na pagpapatuloy mula sa pagtalikod ng maraming alagad sa naunang konteksto.
- source_word: τοῖς δώδεκα
  choice: sa Labindalawa
  rationale: Pinananatili ang kinikilalang katawagan sa pinakamalapit na pangkat ng mga alagad ni Jesus nang hindi idinaragdag ang salitang wala sa Griyego.
- source_word: Μὴ καὶ ὑμεῖς
  choice: Hindi rin ninyo ... hindi ba?
  rationale: Ipinahihiwatig ng μή na inaasahan ang negatibong sagot, samantalang ipinahahayag ng rin ang καί at ang paghahambing sa ibang umalis.
- source_word: θέλετε
  choice: gustong
  rationale: Likas at makabagong katumbas para sa pagnanais o pagkukusang tinutukoy ng θέλω.
- source_word: ὑπάγειν
  choice: umalis
  rationale: Sa konteksto ng mga alagad na lumayo kay Jesus, malinaw at natural ang 'umalis' habang nananatili ang diwa ng paglayo.
theological_decisions:
- issue: Lakas ng tanong ni Jesus na pinasimulan ng μή
  choice: Negatibong anyo ng tanong na nagpapahiwatig na 'hindi' ang inaasahang sagot
  alternative: 'Mas neutral na tanong: “Gusto rin ba ninyong umalis?”'
  rationale: Karaniwang ipinahihiwatig ng μή sa ganitong tanong na negatibo ang inaasahang tugon, ngunit hindi nito ginagawang tiyak o sapilitan ang sagot.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang 'Labindalawa' bilang pantanging katawagan at ang hulaping 'hindi ba?' upang likas na maipahayag ang inaasahang negatibong sagot.
