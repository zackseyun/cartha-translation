  text: ἔστιν γεγραμμένον ἐν τοῖς προφήταις· Καὶ ἔσονται πάντες διδακτοὶ θεοῦ· ⸀πᾶς ὁ ⸀ἀκούσας παρὰ τοῦ πατρὸς καὶ μαθὼν ἔρχεται πρὸς ⸀ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/045.yaml
  text: It is written in the Prophets[a], ‘And they will all be taught by God.’ Everyone who has heard from the Father and has learned comes to me.
translation:
  language: tl
  text: Nasusulat sa mga Propeta, “At silang lahat ay tuturuan ng Diyos.” Ang bawat isa na nakarinig mula sa Ama at natuto ay lumalapit sa akin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔστιν γεγραμμένον
  choice: Nasusulat
  rationale: Likas at marangal na pormula sa makabagong Tagalog para sa periphrastic perfect; ipinahihiwatig nitong nananatiling nakasulat at may bisa ang sipi.
- source_word: ἐν τοῖς προφήταις
  choice: sa mga Propeta
  rationale: Tumutukoy sa kinikilalang kalipunan ng mga propetikong Kasulatan; ang malaking titik ay tumutulong ipakita na pamagat ito ng isang bahagi ng Kasulatan.
- source_word: ἔσονται πάντες διδακτοὶ θεοῦ
  choice: silang lahat ay tuturuan ng Diyos
  rationale: Pinananatili ang future passive at malinaw na ipinapakitang ang Diyos ang pinagmumulan o tagapagturo, sa natural na makabagong Tagalog.
- source_word: πᾶς ὁ
  choice: Ang bawat
  rationale: Pinananatili ang pangkalahatang bisa ng substantival singular nang hindi ito ginagawang maramihan.
- source_word: ἀκούσας παρὰ τοῦ πατρὸς
  choice: nakinig sa Ama
  rationale: Ang ἀκούω ay maaaring mangahulugang makarinig o makinig; sa kontekstong may kasunod na pagkatuto, ang “nakinig” ay natural ngunit hindi nagdaragdag ng paliwanag sa mekanismo ng pagtugon. Ang παρά na may genitive ay nagpapahayag ng pinagmulan, ngunit sa Tagalog ang “nakinig sa Ama” ay idiomatikong naghahatid ng pakikinig sa itinuturo ng Ama.
- source_word: καὶ μαθὼν
  choice: at natuto
  rationale: Inihahatid ang naunang kilos ng aorist participle bago ang pangunahing pandiwang “lumalapit,” sa maikli at natural na Tagalog.
- source_word: ἔρχεται πρὸς ἐμέ
  choice: ay lumalapit sa akin
  rationale: Pinananatili ang present tense at ang diwa ng personal na paglapit kay Jesus.
theological_decisions:
- issue: Ugnayan ng pagtuturo ng Diyos at paglapit kay Jesus
  choice: 'Pinananatili ang pagkakasunod ng teksto: ang bawat nakinig sa Ama at natuto ay lumalapit kay Jesus.'
  alternative: Maaaring ipaliwanag ito sa mas deterministiko o mas sinerhistang paraan.
  rationale: Hindi ipinaliliwanag ng Griyego ang metapisikal na mekanismo ng banal na pagkilos at pagtugon ng tao; kaya hindi ito nilulutas ng salin.
- issue: Pagkakakilanlan ng Ama at awtoridad ni Jesus
  choice: Pinananatili ang tuwirang ugnayan ng “Ama” at “akin.”
  alternative: Maaaring dagdagan ng paliwanag tungkol sa Kristolohiya o sa paraan ng pagtuturo ng Ama.
  rationale: Sapat na inihahayag ng teksto na ang tunay na pakikinig at pagkatuto mula sa Ama ay humahantong sa paglapit kay Jesus, nang walang idinagdag na doktrinal na pagpapalawak.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Nasusulat” bilang pamilyar na pormula sa pagsipi sa Kasulatan at “lumalapit” upang panatilihin ang aspektong pangkasalukuyan ng ἔρχεται.
