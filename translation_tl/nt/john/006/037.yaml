id: JHN.6.37
reference: John 6:37
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πᾶν ὃ δίδωσίν μοι ὁ πατὴρ πρὸς ἐμὲ ἥξει, καὶ τὸν ἐρχόμενον πρός ⸀με οὐ μὴ ἐκβάλω ἔξω,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/037.yaml
  text: All that the Father gives me will come to me[b][a], and the one who comes to me I will certainly not cast out.
translation:
  language: tl
  text: Ang lahat ng ibinibigay sa akin ng Ama[a] ay lalapit sa akin, at ang lumalapit sa akin ay hinding-hindi ko itataboy.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang bawat taong ibinibigay sa akin ng Ama.” Gumagamit ang Griyego ng neuter singular na pananalitang kolektibo.
    reason: lexical_alternative
  - marker: b
    text: O, “tiyak na hindi ko itataboy.” Mariin ang anyo ng pagtanggi sa Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν ὃ
  choice: ang lahat ng
  rationale: Pinananatili nito ang kolektibong diwa ng neuter singular na parirala nang hindi agad ginagawang tahasang indibidwal ang tinutukoy. Likas din itong pakinggan sa makabagong Tagalog.
- source_word: δίδωσίν μοι
  choice: ibinibigay sa akin
  rationale: Ang pangkasalukuyang anyo ay isinalin nang hindi ipinapalagay na tapos na o minsanan lamang ang pagbibigay.
- source_word: ὁ πατήρ
  choice: ang Ama
  rationale: Walang tahasang panghalip na paari sa Griyego; pinananatili ng “ang Ama” ang katawagan sa teksto nang hindi idinaragdag ang “aking.”
- source_word: πρὸς ἐμὲ ἥξει
  choice: ay lalapit sa akin
  rationale: Ang “lalapit sa akin” ay natural sa Tagalog at angkop sa kontekstong Juanino ng paglapit kay Jesus.
- source_word: τὸν ἐρχόμενον πρός με
  choice: ang lumalapit sa akin
  rationale: Malapit ito sa articular present participle at pinananatili ang pangkalahatang pagtukoy sa sinumang lumalapit.
- source_word: οὐ μὴ ἐκβάλω ἔξω
  choice: hinding-hindi ko itataboy
  rationale: Malinaw na ipinahahayag ng “hinding-hindi” ang mariing pagtanggi, habang likas na sinasaklaw ng “itataboy” ang ideya ng pagpapalayas o pagtataboy palabas.
theological_decisions:
- issue: Ang kolektibong neuter na πᾶν ὃ kaugnay ng pagbibigay ng Ama at paglapit kay Jesus
  choice: ang lahat ng ibinibigay sa akin ng Ama
  alternative: ang bawat taong ibinibigay sa akin ng Ama
  rationale: Pinananatili ng salin ang kolektibong anyo ng Griyego at hindi nito nilulutas nang palihim kung ang diin ay nasa isang pangkat bilang kabuuan o sa bawat indibidwal.
- issue: Ang tindi ng pangako sa οὐ μὴ ἐκβάλω ἔξω
  choice: hinding-hindi ko itataboy
  alternative: tiyak na hindi ko itataboy
  rationale: Ipinapahayag nito ang mariing katiyakan ng pangungusap nang hindi ito pinalalawak tungo sa mga doktrinal na konklusyon tungkol sa pagtitiyaga o pagtalikod na hindi tahasang sinasabi ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Ama” bilang kinikilalang katawagan sa konteksto at ang natural na “hinding-hindi” upang maiparating ang mariing pagtanggi.
