  yaml_path: translation/nt/john/006/047.yaml
  text: Truly[a], truly, I say to you[b], the one who believes has eternal life.
translation:
  language: tl
  text: '“Totoo, totoong sinasabi ko sa inyo: ang sumasampalataya ay may buhay na walang hanggan.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Katotohanang-katotohanan
  rationale: Pinananatili ang pag-uulit at taimtim na diin ng natatanging panimulang pahayag ni Jesus sa Juan, sa natural at marangal na Tagalog.
- source_word: λέγω ὑμῖν
  choice: sinasabi ko sa inyo
  rationale: Tuwirang isinasalin ang pangkasalukuyang pandiwa at maramihang panghalip, habang pinananatili ang himig ng pangungusap.
- source_word: ὁ πιστεύων
  choice: ang sumasampalataya
  rationale: Ang may artikulong pangkasalukuyang participle ay tumutukoy sa taong inilalarawan ng pagsampalataya. Natural sa Tagalog ang anyong ito at hindi nito dinaragdagan ang diwa ng teksto.
- source_word: ἔχει
  choice: ay may
  rationale: Pinananatili ang pangkasalukuyang pahayag na taglay na ngayon ng sumasampalataya ang buhay na walang hanggan.
- source_word: ζωὴν αἰώνιον
  choice: buhay na walang hanggan
  rationale: Ito ang malinaw, natural, at nakaugaliang katumbas sa Tagalog, na angkop sa gamit ng parirala sa Juan.
theological_decisions:
- issue: Kasalukuyang pagtataglay ng buhay na walang hanggan
  choice: ay may buhay na walang hanggan
  alternative: magkakaroon ng buhay na walang hanggan
  rationale: Pangkasalukuyan ang ἔχει (“may”), kaya hindi ito ginawang panghinaharap. Pinananatili nito ang teolohikal na diin at tensiyon ng teksto nang hindi ipinapaliwanag nang higit sa sinabi nito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang masinsing pag-uulit sa ἀμὴν ἀμὴν at ang payak ngunit mariing pahayag ng orihinal.
