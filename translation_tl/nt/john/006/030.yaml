base_translation:
  language: en
  yaml_path: translation/nt/john/006/030.yaml
  text: So they said to him[a], “Then what sign are you doing, so that we may see and believe you? What work are you doing?”
translation:
  language: tl
  text: Kaya sinabi nila sa kanya, “Kung gayon, anong tanda ang ginagawa mo upang makita namin at paniwalaan ka[a]? Anong gawain ang ginagawa mo?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “maniwala sa iyo” o “magtiwala sa iyo.” Mas literal na sinasabi ng Griyego na “paniwalaan ka,” gamit ang datibong panghalip sa halip na ang mas karaniwang pahayag ni Juan para sa “sumampalataya sa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπον οὖν αὐτῷ
  choice: Kaya sinabi nila sa kanya
  rationale: Ipinahahayag ng “kaya” ang inferensiyal na ugnayan ng οὖν sa naunang sinabi habang nananatiling natural sa makabagong Tagalog.
- source_word: Τί οὖν
  choice: Kung gayon, anong
  rationale: Pinananatili ang ikalawang οὖν at ang mapilit na lohika ng tanong sa likas na pariralang Tagalog.
- source_word: ποιεῖς σὺ σημεῖον
  choice: anong tanda ang ipinapakita mo
  rationale: Ang literal na “ginagawa mong tanda” ay malabo at di-likas sa Tagalog. Ang “ipinapakita” ay natural para sa tanda na hinihinging makita, samantalang pinananatili ng kasalukuyang anyo ang nagpapatuloy na hamon.
- source_word: σημεῖον
  choice: tanda
  rationale: Pinananatili ng “tanda” ang mahalagang terminolohiya ni Juan at hindi tahasang idinaragdag ang interpretatibong “milagrong tanda.”
- source_word: ἵνα ἴδωμεν καὶ πιστεύσωμέν σοι
  choice: upang makita namin at paniwalaan ka
  rationale: Malinaw na ipinapahayag ng “upang” ang layunin. Ang “paniwalaan ka” ay pinakamalapit sa πιστεύω na may datibong σοι at hindi agad ipinapalit ang karaniwang pormulang “sumampalataya sa iyo.”
- source_word: τί ἐργάζῃ
  choice: Anong gawain ang isinasagawa mo?
  rationale: Pinananatili ang diwa ng paggawa o pagsasagawa sa ἐργάζῃ at ang retorikal na pag-uulit, ngunit iniiwasan ang alanganing “Anong gawain ang ginagawa mo?”
theological_decisions:
- issue: Lakas ng πιστεύω na may datibong σοι
  choice: paniwalaan ka
  alternative: maniwala sa iyo; magtiwala sa iyo
  rationale: Ang Griyego ay gumagamit ng datibong panghalip, hindi ng karaniwang ekspresyon ni Juan na πιστεύω εἰς. Kaya pinananatili sa pangunahing teksto ang mas tuwirang diwang paniwalaan si Jesus o ang kanyang sinasabi, habang itinatala sa talababa ang mga posibleng mas malawak na pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tanda” bilang matatag na terminong Juanino; iniwasan ang sobrang literal ngunit alanganing ayos ng mga pandiwang ποιεῖς at ἐργάζῃ.
