  yaml_path: translation/nt/john/006/020.yaml
  text: But he said to them[a], “It is I; do not be afraid.”
translation:
  language: tl
  text: Ngunit sinabi niya sa kanila[a], “Ako ito; huwag kayong matakot.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “Ako ay.” Sa Ebanghelyo ni Juan, maaaring simpleng pagkilala sa sarili ang pananalitang ito, ngunit maaari rin itong umalingawngaw sa mas malawak na mga temang teolohikal.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ
  choice: Ngunit ... niya
  rationale: Ang δέ ay banayad na pang-ugnay na nagpapakita ng pag-usad o bahagyang pagsalungat sa salaysay; natural itong ipinahahayag ng “Ngunit.” Ang artikulong ὁ ay ginagamit bilang panghalip at tumutukoy kay Jesus, kaya ang “niya” ang angkop sa pangungusap.
- source_word: λέγει
  choice: sinabi
  rationale: Bagaman historical present ang Griyegong anyo, karaniwang ginagamit sa natural na salaysay sa Filipino ang aspektong naganap na “sinabi.”
- source_word: αὐτοῖς
  choice: sa kanila
  rationale: Tuwirang pinananatili ang panghalip na maramihan at hinahayaang tukuyin ng konteksto na ang tinutukoy ay ang mga alagad.
- source_word: Ἐγώ εἰμι
  choice: Ako ito
  rationale: Sa agarang konteksto, ipinakikilala ni Jesus ang sarili upang panatagin ang mga alagad. Ang “Ako ito” ay natural na pansariling pagkakakilanlan sa modernong Filipino, samantalang inilalahad sa talababa ang mas literal na “Ako ay” dahil maaaring may mas malawak na teolohikal na alingawngaw ang parirala sa Juan.
- source_word: μὴ φοβεῖσθε
  choice: huwag kayong matakot
  rationale: Natural at malinaw itong pagbabawal sa Filipino at angkop sa takot ng mga alagad sa konteksto.
theological_decisions:
- issue: Kung ang Ἐγώ εἰμι ay isasalin bilang payak na pagkilala sa sarili o bilang mas literal na “Ako ay” na maaaring may teolohikal na alingawngaw
  choice: 'Pangunahing teksto: “Ako ito”'
  alternative: “Ako ay” o “Ako nga”
  rationale: 'Ang “Ako ito” ang pinakamalinaw na naghahatid ng agarang tungkulin ng parirala: kinikilala ni Jesus ang sarili at pinapanatag ang mga alagad. Gayunman, hindi dapat burahin ang posibleng mas malalim na alingawngaw ng ἐγώ εἰμι sa Ebanghelyo ni Juan, kaya pinananatili sa talababa ang mas literal na anyo.'
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “Ako ito” bilang karaniwang pansariling pagkakakilanlan, at pinanatili sa talababa ang tunay na leksikal at teolohikal na posibilidad ng mas literal na pagbasa.
