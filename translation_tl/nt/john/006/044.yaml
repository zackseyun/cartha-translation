  to: Walang sinumang makalalapit sa akin malibang hilahin siya[a] ng Ama na nagsugo sa akin; at bubuhayin ko siyang muli sa huling araw.
  rationale: Talababa lamang ang binago. Pinalitan ang “ilapit,” na isang mas maluwag na pagpapakahulugan sa resulta ng kilos, ng “hatakin,” na mas tuwirang leksikal na alternatibo. Pinananatili ng binagong paliwanag ang saklaw at teolohikal na di-pagpapasya ng Griyego.
