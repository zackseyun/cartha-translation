  text: οὐδεὶς δύναται ἐλθεῖν πρός ⸀με ἐὰν μὴ ὁ πατὴρ ὁ πέμψας με ἑλκύσῃ αὐτόν, κἀγὼ ἀναστήσω αὐτὸν ἐν τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/044.yaml
  text: No one is able to come to me unless the Father who sent me draws him[b][a], and I will raise him up on the last day.
translation:
  language: tl
  text: Walang sinumang makalalapit sa akin malibang hilahin siya[a] ng Ama na nagsugo sa akin; at bubuhayin ko siyang muli sa huling araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “hatakin siya.” Ang pandiwang Griyego ay maaaring magpahiwatig ng mas malakas na paghila o paghatak; ginamit ang “hilahin” sa pangunahing teksto upang mapanatili ang diwa nito nang hindi ipinapaliwanag kung paano dinadala ng Ama ang isang tao sa Anak.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς
  choice: Walang sinuman
  rationale: Likas at malinaw na Filipino para sa pangkalahatang pagtanggi na ‘no one’; pinananatili ang saklaw na walang eksepsiyon.
- source_word: δύναται ἐλθεῖν πρός με
  choice: makalalapit sa akin
  rationale: Ang panlaping maka- ay nagpapahayag ng kakayahan, samantalang ang ‘lumapit sa akin’ ay likas na naghahatid ng kilos patungo kay Jesus at ng kaugnay nitong diwang relasyonal sa konteksto.
- source_word: ἐὰν μὴ
  choice: malibang
  rationale: Maikli at natural na katumbas ng kondisyong ‘unless.’
- source_word: ὁ πατὴρ ὁ πέμψας με
  choice: ang Ama na nagsugo sa akin
  rationale: Ginagawang likas na sugnay na panuring ang articular participle at pinananatili ang personal na katawagang ‘Ama.’
- source_word: ἑλκύσῃ
  choice: hilahin
  rationale: Pinananatili ang kilos ng paghila o paghatak sa pandiwang Griyego at hindi ito pinapahina tungo sa ‘akitin.’ Nililinaw sa talababa ang posibleng mas banayad na pagpapahayag nang hindi ipinapasiya ang pinagtatalunang mekanismo.
- source_word: αὐτόν
  choice: siya
  rationale: Ang Filipino na ‘siya’ ay likas na panghalip na pang-isahan at walang kasariang gramatikal; tumpak nitong tinutukoy ang sinumang tao sa pangkalahatang pahayag.
- source_word: κἀγὼ
  choice: at ... ko
  rationale: Pinananatili ng ‘at’ at ng tahasang gumaganap na ‘ko’ ang pag-uugnay at personal na pangako ni Jesus sa likas na ayos ng Filipino.
- source_word: ἀναστήσω αὐτόν
  choice: bubuhayin ko siyang muli
  rationale: Malinaw na ipinapahayag ang muling pagkabuhay sa kontekstong Juanino, sa halip na ang posibleng diwa lamang na patatayuin siya.
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: sa huling araw
  rationale: Likas na Filipino para sa tiyak na eskatolohikal na araw na tinutukoy.
theological_decisions:
- issue: Diwa ng ἑλκύσῃ sa pinagtatalunang konteksto ng kaligtasan
  choice: hilahin
  alternative: ilapit; akitin; kaladkarin
  rationale: Ang ‘hilahin’ ay nagpapanatili sa lakas at kilos ng salitang Griyego nang hindi ito ginagawang kasingtindi ng ‘kaladkarin’ o pinapahina sa ‘akitin.’ Hindi ipinaliliwanag ng salin kung paano kumikilos ang Ama sa kalooban ng tao, kaya nananatili ang teolohikal na tensiyon.
- issue: Panlalaking anyo ng αὐτόν na ginagamit nang pangkalahatan
  choice: siya
  alternative: ang taong iyon
  rationale: Walang kasariang gramatikal ang panghalip na Filipino na ‘siya.’ Kaya naipahahayag nito nang eksakto ang pang-isahang reperensiya at pangkalahatang saklaw nang hindi nagdaragdag o nag-aalis ng kahulugang pangkasarian.
- issue: Kahulugan ng ἀναστήσω bilang muling pagkabuhay
  choice: bubuhayin ko siyang muli
  alternative: ibabangon ko siya
  rationale: Sa konteksto ng ‘huling araw,’ tumutukoy ang pandiwa sa muling pagkabuhay. Iniiwasan ng ‘bubuhayin ... muli’ ang karaniwang kahulugan ng ‘ibabangon’ na simpleng pagpapatayo, habang hindi nagdaragdag ng paliwanag tungkol sa kalikasan ng muling pagkabuhay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘makalalapit’ upang likas na pagsamahin ang ideya ng kakayahan at paglapit kay Jesus. Ang tuldok-kuwit ay naghihiwalay ngunit nag-uugnay sa kondisyon ng paglapit at sa pangako ni Jesus tungkol sa muling pagkabuhay.
