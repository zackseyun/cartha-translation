    rationale: Ang ἑλκύω ay tumutukoy sa paghila, paghatak, o pagkaladkad/drawing. Maaaring ipahiwatig ng “ilapit” ang resultang paglapit, ngunit hindi nito tuwirang isinasalin ang kilos at lakas ng pandiwa. Dapat palitan ito ng alternatibong gaya ng “hatakin,” habang maingat na binabanggit na maaari itong magkaroon ng mas matinding diwa sa ibang konteksto.
