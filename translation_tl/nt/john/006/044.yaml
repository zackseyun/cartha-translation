  source_fidelity: 'Tumpak ang pangunahing salin sa pangkalahatan: naipapahayag ng “Walang sinumang makalalapit” ang kawalan ng kakayahan sa οὐδεὶς δύναται ἐλθεῖν, at ang “bubuhayin ko siyang muli sa huling araw” ay angkop sa kontekstong pagkabuhay na muli ng ἀναστήσω ... ἐν τῇ ἐσχάτῃ ἡμέρᾳ. Ang “hilahin” ay leksikal na mapagtatanggol para sa ἑλκύσῃ at pinananatili ang lakas ng pandiwa nang walang doktrinal na pagpapasya.'
  naturalness: Makabago, malinaw, at marangal ang pangungusap. Likas ang ayos na “malibang hilahin siya ng Ama,” bagaman mas pormal kaysa kolokyal, at ang tuldok-kuwit ay angkop sa dalawang magkaugnay na sugnay.
  terminology: Ang “Ama,” “huling araw,” at “bubuhayin ... muli” ay pare-pareho at angkop sa rehistro ng Juan. Gayunman, ang talababa ay dapat magbigay ng tunay na leksikal na alternatibo sa “hilahin.” Ang “ilapit” ay mas maluwag na interpretatibong pagpapahayag at hindi tuwirang katumbas ng ἑλκύω; maaari nitong pahinain ang imahen ng paghila/paghatak.
