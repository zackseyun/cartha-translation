  text: Μετὰ ταῦτα ἀπῆλθεν ὁ Ἰησοῦς πέραν τῆς θαλάσσης τῆς Γαλιλαίας τῆς Τιβεριάδος.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/001.yaml
  text: After these things[a], Jesus went away to the other side of the Sea of Galilee[b], which is the Sea of Tiberias.
translation:
  language: tl
  text: Pagkatapos ng mga pangyayaring ito[a], umalis si Jesus patungo sa kabilang panig ng Dagat ng Galilea, na siyang Dagat ng Tiberias.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Pagkatapos ng mga bagay na ito.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “Dagat ng Galilea” ay kilala rin bilang “Dagat ng Tiberias.” Iisang anyong-tubig ang tinutukoy ng dalawang pangalan.
    reason: cultural_note
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Pagkatapos ng mga pangyayaring ito
  rationale: Pinananatili ang pangmaramihang ταῦτα (‘mga ito’) habang likas na ipinahahayag sa Tagalog na tumutukoy ito sa mga naunang pangyayari.
- source_word: ἀπῆλθεν
  choice: nagtungo
  rationale: Ang ἀπέρχομαι ay nangangahulugang umalis o pumunta; ang ‘nagtungo’ ay dignificado at natural, at malinaw na nagpapahiwatig ng pagkilos patungo sa isang lugar.
- source_word: πέραν
  choice: sa kabilang ibayo
  rationale: Sa konteksto ng isang anyong-tubig, tumutukoy ito sa kabilang panig. Pinananatili ng ‘kabilang ibayo’ ang larawan ng pagpunta sa ibayo nang hindi labis na ipinapaliwanag ang paraan ng pagtawid.
- source_word: θαλάσσης
  choice: Lawa
  rationale: Bagaman karaniwang nangangahulugang ‘dagat’ ang θάλασσα, ang tinutukoy na anyong-tubig ay isang lawa at natural na kilala sa makabagong Filipino bilang Lawa ng Galilea. Isa itong kontekstuwal na salin, hindi pagbabago sa heograpikong tinutukoy.
- source_word: τῆς Γαλιλαίας τῆς Τιβεριάδος
  choice: ng Galilea, na tinatawag ding Lawa ng Tiberias
  rationale: Ang magkasunod na panuring na genitive ay dalawang katawagan sa iisang anyong-tubig. Nililinaw ng ‘na tinatawag ding’ ang apposition nang hindi ipinahihiwatig na dalawang magkaibang lawa ang tinutukoy.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang ‘nagtungo’ sa halip na mas pormal na ‘yumaon,’ at ‘Lawa’ bilang likas at heograpikong tumpak na katawagan sa Filipino. Pinanatili ang pangmaramihang pahiwatig ng Μετὰ ταῦτα at ang dalawang pangalan ng lawa.
