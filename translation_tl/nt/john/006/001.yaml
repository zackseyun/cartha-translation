- from: Pagkatapos ng mga pangyayaring ito[a], nagtungo si Jesus sa kabilang ibayo ng Lawa ng Galilea, na tinatawag ding Lawa ng Tiberias.[b]
  to: Pagkatapos ng mga pangyayaring ito[a], umalis si Jesus patungo sa kabilang panig ng Dagat ng Galilea, na siyang Dagat ng Tiberias.[b]
  rationale: Inayos ang salin ng θάλασσα bilang “Dagat” para sa mas malapit na katapatan sa Griyego at sa audit trail, at pinalitan ang hindi likas na “kabilang ibayo” ng “kabilang panig.” Pinanatili ang pangmaramihang pahiwatig ng μετὰ ταῦτα, ang kilos ng pag-alis/pagpunta ni Jesus, at ang appositional na ikalawang pangalan ng dagat.
