  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐγώ εἰμι ὁ ἄρτος ὁ ζῶν ὁ ἐκ τοῦ οὐρανοῦ καταβάς· ἐάν τις φάγῃ ἐκ τούτου τοῦ ἄρτου ⸀ζήσει εἰς τὸν αἰῶνα, καὶ ὁ ἄρτος δὲ ὃν ἐγὼ δώσω ἡ σάρξ μού ⸀ἐστιν ὑπὲρ τῆς τοῦ κόσμου ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/051.yaml
  text: I am the living bread that came down from heaven[a]. If anyone eats of this bread, he will live forever[c][b]. And the bread that I will give for the life of the world is my flesh.
translation:
  language: tl
  text: Ako ang buháy na tinapay na bumaba mula sa langit. Kung kumain ang sinuman ng tinapay na ito, mabubuhay siya magpakailanman. At ang tinapay na ibibigay ko ay ang aking laman para sa buhay ng sanlibutan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἄρτος ὁ ζῶν
  choice: ang tinapay na buháy
  rationale: Tuwirang inilalarawan ng participle na ζῶν ang tinapay bilang buháy. Iniiwasan ng saling ito ang “tinapay ng buhay,” na mula sa kalapit na pananalita ngunit hindi eksaktong katumbas ng pariralang ito.
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβάς
  choice: na bumaba mula sa langit
  rationale: Ipinahihiwatig ng aorist participle ang naganap nang pagbaba; natural itong ipinapahayag sa Tagalog sa pamamagitan ng sugnay na “na bumaba.”
- source_word: ἐάν τις φάγῃ ἐκ τούτου τοῦ ἄρτου
  choice: Kung ang sinuman ay kumain ng tinapay na ito
  rationale: Ang ἐάν at aorist subjunctive ay bumubuo ng pangkalahatang kondisyon. Natural sa Tagalog ang “kumain ng tinapay na ito”; hindi kailangang tumbasan nang hiwalay ang ἐκ sapagkat ang diwang pagkain mula rito ay malinaw sa layong Tagalog.
- source_word: ζήσει εἰς τὸν αἰῶνα
  choice: mabubuhay siya magpakailanman
  rationale: Sa gamit ni Juan, ang idyomang εἰς τὸν αἰῶνα ay nangangahulugang walang hanggan o magpakailanman. Pinananatili ng “siya” ang isahang anyo ngunit pangkalahatan ang tinutukoy.
- source_word: ὁ ἄρτος δὲ ὃν ἐγὼ δώσω
  choice: At ang tinapay na ibibigay ko
  rationale: Ang δέ ay nagpapaunlad ng pahayag at hindi nagpapakita ng matinding pagsalungat, kaya ang “At” ay angkop at natural.
- source_word: ἡ σάρξ μού ἐστιν
  choice: ay ang aking laman
  rationale: Ang σάρξ ay kongkreto at sadyang matindi sa kontekstong ito. Ang “laman” ang tuwirang katumbas; ang “katawan” ay magpapalambot at magbibigay agad ng interpretasyon.
- source_word: ὑπὲρ τῆς τοῦ κόσμου ζωῆς
  choice: para magkaroon ng buhay ang sanlibutan
  rationale: Ipinapahayag ng ὑπέρ ang kapakinabangan o layunin. Ang ayos na ito ay natural sa Tagalog at pinananatili ang ugnayan ng pagbibigay ng laman at ng buhay ng sanlibutan.
- source_word: κόσμος
  choice: sanlibutan
  rationale: Pinananatili ng “sanlibutan” ang malawak at teolohikal na taginting ng κόσμος sa Juan nang hindi ito pinakikitid sa isang partikular na pangkat.
theological_decisions:
- issue: Kahulugan ng σάρξ sa paglalarawan ni Jesus sa sarili
  choice: “laman” sa pangunahing teksto
  alternative: “katawan”
  rationale: Kongkreto ang salita at kaugnay ng kusang pagbibigay ni Jesus ng sarili. Ang “katawan” ay maaaring magpataw ng isang interpretasyon at pahinain ang talas ng salitang Griyego.
- issue: Saklaw ng κόσμος
  choice: panatilihin bilang “sanlibutan” nang hindi pinakikitid
  alternative: “sangkatauhan” o isang limitadong pangkat
  rationale: Malawak ang mismong pananalita ng talata. Hindi dapat ipasok ng salin ang isang mas makitid na sistemang teolohikal.
- issue: Diwa ng “bumaba mula sa langit”
  choice: isalin bilang tunay at naganap na pagbaba mula sa langit
  alternative: unawain lamang bilang talinghaga ng banal na pagkasugo
  rationale: Tuwiran ang pananalita sa Griyego at may malinaw na bigat na Kristolohikal sa konteksto ni Juan; pinananatili ito nang hindi dinaragdagan ng paliwanag sa teksto.
translation_notes:
  register: Makabagong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “buháy” na may tuldik upang malinaw na ito ay pang-uri at hindi “búhay” na pangngalan. Pinanatili ang kongkretong “laman” at ang malawak na “sanlibutan.”
