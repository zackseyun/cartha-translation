id: JHN.6.22
reference: John 6:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Τῇ ἐπαύριον ὁ ὄχλος ὁ ἑστηκὼς πέραν τῆς θαλάσσης ⸀εἶδον ὅτι πλοιάριον ἄλλο οὐκ ἦν ἐκεῖ εἰ μὴ ⸀ἕν, καὶ ὅτι οὐ συνεισῆλθεν τοῖς μαθηταῖς αὐτοῦ ὁ Ἰησοῦς εἰς τὸ ⸀πλοῖον ἀλλὰ μόνοι οἱ μαθηταὶ αὐτοῦ ἀπῆλθον·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/022.yaml
  text: On the next day[a], the crowd that had been standing on the other side of the sea saw that no other small boat had been there except one, and that Jesus had not gone with his disciples into the boat[b], but that his disciples had gone away alone.
translation:
  language: tl
  text: Kinabukasan, nakita ng mga taong nanatili sa kabilang panig ng lawa na walang ibang maliit na bangka[a] roon kundi iisa, at na hindi sumakay si Jesus sa bangka[b] kasama ng kanyang mga alagad, kundi ang mga alagad niya lamang ang umalis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bangka.” Diminutibong anyo ang salitang Griyego na πλοιάριον.
    reason: lexical_alternative
  - marker: b
    text: Nagkakaiba ang ilang manuskrito at edisyon sa paggamit ng “maliit na bangka” (πλοιάριον) at “bangka” (πλοῖον) sa talatang ito. Sinusunod ng salin ang pagkakasulat ng inilimbag na tekstong Griyego sa bawat sugnay.
    reason: textual_variant
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: Kinabukasan
  rationale: Likas at maikli itong panandang temporal sa modernong Tagalog para sa pangyayaring naganap sa sumunod na araw.
- source_word: ὁ ὄχλος ὁ ἑστηκὼς
  choice: ang mga taong nanatili
  rationale: Ipinahihiwatig ng perfect participle ang kalagayang nagpapatuloy mula sa naunang pangyayari. Mas natural sa Tagalog ang “mga taong nanatili” kaysa literal na “karamihang nakatayo,” at ang maramihang “mga tao” ay umaayon din sa maramihang pandiwang εἶδον.
- source_word: πέραν τῆς θαλάσσης
  choice: sa kabilang ibayo ng lawa
  rationale: Ipinapahayag ng πέραν na nasa kabilang panig sila. Sa konteksto ng Lawa ng Galilea, malinaw at likas ang “lawa,” habang pinananatili ng “kabilang ibayo” ang heograpikong ugnayan.
- source_word: εἶδον
  choice: nakita
  rationale: Pinananatili nito ang karaniwang kahulugan ng pandiwa. Ang mga sumusunod na sugnay na may ὅτι ang nagsasaad ng kanilang nakita o napansin.
- source_word: πλοιάριον
  choice: maliit na bangka
  rationale: Diminutibong anyo ang πλοιάριον, kaya naipapakita ng “maliit na bangka” ang anyong leksikal nang hindi nagiging di-likas.
- source_word: ἄλλο οὐκ ἦν ἐκεῖ εἰ μὴ ἕν
  choice: wala roong ibang maliit na bangka maliban sa isa
  rationale: 'Malinaw na pinananatili nito ang pagbubukod at diin ng Griyegong konstruksyon: iisa lamang ang bangkang naroon.'
- source_word: οὐ συνεισῆλθεν ... ὁ Ἰησοῦς
  choice: hindi sumakay si Jesus ... kasama ng kanyang mga alagad
  rationale: Sa konteksto ng pagpasok sa isang bangka, natural na katumbas ng “pumasok na kasama” ang “sumakay ... kasama,” at hindi nito ipinapalagay na naglakbay siya kasama nila.
- source_word: εἰς τὸ πλοῖον
  choice: sa bangka
  rationale: Karaniwang salita ang πλοῖον para sa bangka; ang “sumakay sa bangka” ang likas na parirala sa Tagalog.
- source_word: μόνοι
  choice: nang sila lamang
  rationale: Malinaw nitong itinatampok na umalis ang mga alagad nang hindi kasama si Jesus.
- source_word: ἀπῆλθον
  choice: umalis
  rationale: Direkta at natural itong katumbas ng pag-alis o pagyaon mula sa lugar.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling basahin. Ginamit ang “mga taong nanatili” sa halip na literal na “karamihang nakatayo” upang maipahayag ang resultang kalagayan ng perfect participle at maiwasan ang di-likas na parirala. Hinati sa dalawang pangungusap ang mahabang Griyegong pangungusap para sa linaw, habang pinanatili ang magkaugnay na dalawang bagay na kanilang nakita.
