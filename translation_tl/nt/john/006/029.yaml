base_translation:
  language: en
  yaml_path: translation/nt/john/006/029.yaml
  text: 'Jesus answered and said to them[b][a], “This is the work of God: that you believe in the one whom he has sent.”'
translation:
  language: tl
  text: 'Sumagot si Jesus at sinabi sa kanila, “Ito ang gawain ng Diyos[a]: na kayo ay manampalataya sa isinugo niya.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “gawaing hinihingi ng Diyos” o “gawaing ginagawa ng Diyos.” Maaaring unawain sa higit sa isang paraan ang pariralang Griyego na “gawain ng Diyos,” kaya pinananatili rito ang kalabuan.
    reason: alternative_reading
  - marker: b
    text: O “magtiwala kayo sa isinugo niya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ὁ Ἰησοῦς καὶ εἶπεν αὐτοῖς
  choice: Sumagot si Jesus at sinabi sa kanila
  rationale: Pinananatili ang dalawang pandiwang Griyego sa isang likas ngunit marangal na anyong pasalaysay sa Tagalog.
- source_word: Τοῦτό ἐστιν
  choice: Ito ang
  rationale: Tuwirang ipinakikita ang pagbibigay-diin ng demonstratibo at kopula, ayon sa likas na balangkas ng Tagalog.
- source_word: τὸ ἔργον τοῦ θεοῦ
  choice: ang gawain ng Diyos
  rationale: Malapit sa anyong Griyego at hindi nilulutas sa pangunahing teksto kung ito ay gawaing hinihingi ng Diyos o gawaing ginagawa ng Diyos.
- source_word: ἵνα πιστεύητε
  choice: manampalataya kayo
  rationale: Likas na ipinahahayag sa Tagalog ang nilalaman ng tinutukoy na gawain; ang pautos na himig ay nababagay sa sagot sa tanong tungkol sa dapat gawin nang hindi ginagawang tahasang imperatibo ang subjunctive.
- source_word: εἰς ὃν
  choice: sa isinugo
  rationale: Sa konstruksiyong πιστεύω εἰς, likas sa Tagalog ang “manampalataya sa”; ang personal na tinutukoy ay malinaw sa “isinugo.”
- source_word: ἀπέστειλεν ἐκεῖνος
  choice: isinugo niya
  rationale: Tumpak at natural na tumutukoy sa taong sinugo ng Diyos; pinananatili ang pagkilos ng pagsusugo nang hindi nagdaragdag ng di-kailangang diin.
theological_decisions:
- issue: Kahulugan ng genitibong τοῦ θεοῦ sa “τὸ ἔργον τοῦ θεοῦ”
  choice: gawain ng Diyos
  alternative: gawaing hinihingi ng Diyos; gawaing ginagawa ng Diyos
  rationale: Maaaring objective o subjective genitive ang parirala. Pinananatili ng salin ang tunay na kalabuan at hindi ipinapasya kung ang diin ay nasa hinihingi ng Diyos o sa ginagawa niya.
- issue: Kahulugan ng πιστεύητε εἰς
  choice: manampalataya ... sa
  alternative: magtiwala ... sa
  rationale: Ang “manampalataya sa” ang karaniwan at malinaw na katumbas ng Johannine πιστεύω εἰς, samantalang kinikilala sa talababa ang lehitimong diwang pagtitiwala.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang “gawain” sa halip na mas kolokyal na “trabaho” upang tumugma sa kontekstong teolohikal. Inilagay ang mga marker [a] at [b] sa pangunahing teksto at inayos ang mga ito ayon sa puntong tinatalabaan.
