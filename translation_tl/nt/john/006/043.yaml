  yaml_path: translation/nt/john/006/043.yaml
  text: Jesus answered and said to them[b][a], “Do not grumble among yourselves.”
translation:
  language: tl
  text: Sumagot si Jesus at sinabi niya sa kanila, “Huwag kayong magbulung-bulungan sa isa’t isa.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang “magbulung-bulungan” bilang “magreklamo” o “magbulong-bulong.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: Sumagot
  rationale: Karaniwang kahulugan ng deponent na ἀποκρίνομαι ang ‘sumagot’; likas ito sa makabagong Filipino at pinananatili ang tungkuling pandiskurso ng pandiwa.
- source_word: εἶπεν
  choice: sinabi
  rationale: Pinanatili ang ikalawang pandiwa sa pormulang Griyego na ‘sumagot at sinabi,’ kahit may bahagyang pag-uulit, upang masalamin ang salaysay ng pinagmulan.
- source_word: Μὴ γογγύζετε
  choice: Huwag kayong magbulung-bulungan
  rationale: Ang present imperative na may μή ay maaaring pangkalahatang pagbabawal o pagpigil sa nagpapatuloy na kilos. Hindi ito nilimitahan sa ‘Tumigil kayo.’ Ang ‘magbulung-bulungan’ ay nagpapahayag ng pabulong at di-nasisiyahang pagrereklamo at nagpapanatili ng alingawngaw ng pagbubulung-bulungan ng Israel sa ilang.
- source_word: μετ’ ἀλλήλων
  choice: sa isa’t isa
  rationale: Ipinahihiwatig ng parirala ang kilos na nagaganap nang magkakatugon sa loob ng pangkat. Sa Filipino, likas itong maipaloob sa ‘magbulung-bulungan’; inilalahad sa talababa ang mas tahasang katumbas upang hindi mawala ang detalye ng Griyego.
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Pamantayang anyo ng pangalang Ἰησοῦς sa Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang reduplikasyong ‘magbulung-bulungan’ upang natural na maipahiwatig ang kapwa-kapwang kilos ng μετ’ ἀλλήλων nang hindi maging mabigat ang pangunahing pangungusap. Nasa talababa ang mas tahasang anyo.
