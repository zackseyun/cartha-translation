  naturalness: Ang “Huwag kayong magbulung-bulungan sa isa’t isa” ay likas at malinaw sa makabagong Filipino. Ang pagdaragdag ng “niya” sa “sinabi niya sa kanila” ay nagpapalinaw sa daloy nang hindi nagdaragdag ng kahulugan.
  terminology: Ang “magbulung-bulungan” ay angkop na katumbas ng γογγύζω sa kontekstong ito at pinananatili ang biblikal na himig ng di-nasisiyahang reklamo. Ang “Jesus” ay pamantayang anyo sa Filipino.
