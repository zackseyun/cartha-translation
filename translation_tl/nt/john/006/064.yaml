source:
  edition: SBLGNT
  text: ἀλλὰ εἰσὶν ἐξ ὑμῶν τινες οἳ οὐ πιστεύουσιν. ᾔδει γὰρ ἐξ ἀρχῆς ὁ Ἰησοῦς τίνες εἰσὶν οἱ μὴ πιστεύοντες καὶ τίς ἐστιν ὁ παραδώσων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/064.yaml
  text: But there are some among you who do not believe[a]. For Jesus knew from the beginning who those were who did not believe[b], and who it was who would betray him.
translation:
  language: tl
  text: Ngunit may ilan sa inyo na hindi naniniwala. Sapagkat mula pa sa simula ay alam ni Jesus kung sinu-sino ang hindi naniniwala at kung sino ang magkakanulo sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “ang magbibigay sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ngunit
  rationale: Likas at marangal na panandang pasalungat sa naunang pahayag.
- source_word: ἐξ ὑμῶν
  choice: sa inyo
  rationale: Natural na Filipino para sa mga kabilang sa pangkat na kinakausap, nang hindi ipinahihiwatig na sila ay lumabas mula rito.
- source_word: τινες
  choice: may ilan
  rationale: Tumutukoy sa di-tiyak na bahagi ng mga kausap.
- source_word: οἳ οὐ πιστεύουσιν / οἱ μὴ πιστεύοντες
  choice: na hindi naniniwala / ang hindi naniniwala
  rationale: Pinananatili ang kasalukuyan at nagpapatuloy na katangian ng kawalan ng paniniwala sa natural na Filipino.
- source_word: ᾔδει
  choice: alam na
  rationale: Ang anyo ng οἶδα ay nagsasaad ng umiiral nang kaalaman sa nakaraan; malinaw itong naihahayag ng 'alam na'.
- source_word: ἐξ ἀρχῆς
  choice: mula pa sa simula
  rationale: Pinananatili ang temporal na diwa at ang tunay na kalabuan kung aling simula ang tinutukoy.
- source_word: παραδώσων
  choice: magkakanulo
  rationale: Sa konteksto ng salaysay tungkol kay Judas, ipinahahayag nito ang mapagtaksil na pagsasalin kay Jesus sa mga kalaban; inilalagay sa talababa ang mas literal na kahulugan.
- source_word: αὐτόν
  choice: sa kanya
  rationale: Tumutukoy kay Jesus bilang layon ng pagkakanulo.
theological_decisions:
- issue: Kahulugan ng πιστεύω sa tugon ng mga alagad kay Jesus
  choice: naniniwala
  alternative: nagtitiwala
  rationale: Malawak ang 'naniniwala' at hindi nito nililimitahan ang pandiwa sa intelektuwal na pagsang-ayon lamang o sa pagtitiwala lamang.
- issue: Pagpapakahulugan sa παραδίδωμι tungkol kay Judas
  choice: magkakanulo
  alternative: magbibigay sa kanya sa kamay ng iba
  rationale: Ipinahahayag ng pangunahing salin ang mapagtaksil na katangian ng kilos sa konteksto, habang pinananatili sa talababa ang mas literal na larawan ng pagsasalin o pagbibigay sa kamay ng iba.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kung sinu-sino” para sa pangmaramihang τίνες at “kung sino” para sa isahang τίς. Hindi nilinaw nang higit sa Griyego ang tinutukoy na “simula.”
