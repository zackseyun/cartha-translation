  rationale: Inayos ang ayos ng pangungusap para sa mas likas na Filipino at pinalitan ang talababa upang maipakita ang leksikal na alternatibo ng παραδίδωμι nang hindi nagdaragdag ng detalyeng wala sa Griyego. Pinanatili ang “magkakanulo” sa pangunahing teksto bilang kontekstuwal na salin at ang kalabuan ng “mula pa sa simula.”
