    issue: Hindi eksakto at medyo malabo ang talababa para sa παραδώσων αὐτόν.
    rationale: Ang “magbibigay sa kanya sa kamay ng iba” ay nagdaragdag ng elementong “sa kamay ng iba,” at ang panghalip sa “sa kanya” ay sintaktikong malabo. Dapat ipakita ng talababa ang alternatibong “ipagkakanulo/ibibigay siya” nang hindi nagdaragdag ng detalye.
  revised_text: Ngunit may ilan sa inyo na hindi naniniwala. Sapagkat mula pa sa simula ay alam ni Jesus kung sinu-sino ang hindi naniniwala at kung sino ang magkakanulo sa kanya.[a]
