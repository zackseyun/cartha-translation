lexical_decisions:
- source_word: ἥ τε θάλασσα
  choice: At ang lawa
  rationale: Karaniwang nangangahulugang ‘dagat’ ang θάλασσα, ngunit sa konteksto ay tumutukoy ito sa Lawa ng Galilea; mas natural at heograpikong malinaw sa makabagong Tagalog ang ‘lawa’ nang hindi ito ginagawang pantanging ngalan. Ang τε ay ipinahayag sa magaan na pang-ugnay na ‘At.’
- source_word: ἀνέμου μεγάλου
  choice: malakas na hangin
  rationale: Ang ἄνεμος ay ‘hangin,’ at ang μέγας kapag inilalarawan ang hangin ay likas na isinasaling ‘malakas’ sa Tagalog. Hindi ginamit ang ‘marahas’ upang hindi palabis ang tindi.
- source_word: πνέοντος
  choice: umiihip
  rationale: Ang pangkasalukuyang aktibong participle ay nagpapakita ng nagpapatuloy na pag-ihip ng hangin. Ang sugnay na ‘dahil sa ... umiihip’ ay natural na nagpapahayag ng pangyayaring sanhi.
- source_word: διεγείρετο
  choice: ay lalong umaalon
  rationale: Ang imperpektong anyo ay naglalarawan ng nagpapatuloy na pagkilos o pag-alimpuyo ng tubig. Natural sa Tagalog ang ‘lalong umaalon’ para sa dagat o lawa na ginugulo ng malakas na hangin; hindi nito ipinahihiwatig na isang alon lamang ang tumataas.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang ‘lawa’ ayon sa aktuwal na anyong-tubig sa konteksto, at ang ‘lalong umaalon’ bilang likas na paglalarawan sa nagpapatuloy na epekto ng malakas na hangin. Ang panandang [a] ay nasa pangunahing teksto.
