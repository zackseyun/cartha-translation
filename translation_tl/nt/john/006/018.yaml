  text: And the sea was being stirred up because a strong wind was blowing[a].
translation:
  language: tl
  text: At ang dagat ay ginugulo ng malakas na hanging umiihip.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ang dagat ay nababagabag” o “ang dagat ay nagiging maalon.”
