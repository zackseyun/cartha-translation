  text: Ἰησοῦς οὖν γνοὺς ὅτι μέλλουσιν ἔρχεσθαι καὶ ἁρπάζειν αὐτὸν ἵνα ⸀ποιήσωσιν βασιλέα ἀνεχώρησεν ⸀πάλιν εἰς τὸ ὄρος αὐτὸς μόνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/015.yaml
  text: So Jesus[a], knowing that they were about to come and seize him in order to make him king, withdrew again to the mountain by himself.
translation:
  language: tl
  text: Kaya, nang malaman ni Jesus[a] na darating na sila upang dakpin siya at gawing hari, muli siyang umalis patungo sa bundok nang mag-isa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sapilitang kunin siya upang gawing hari.”
    reason: Ipinapakita ang mapuwersang nuwansa ng Griyegong ἁρπάζειν, alinsunod sa lexical alternative sa English audit trail.
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Nag-uugnay ito sa naunang pangyayari at nagpapakita ng bunga o tugon nang hindi nagiging matigas ang daloy.
- source_word: γνοὺς
  choice: nang malaman
  rationale: Likas na ipinapahayag sa Tagalog ang pangyayaring naging batayan ng pagkilos ni Jesus.
- source_word: μέλλουσιν ἔρχεσθαι
  choice: papalapit na sila
  rationale: Ipinahihiwatig ng μέλλω kasama ng pawatas ang nalalapit na pagkilos; sa konteksto, natural nitong pinagsasama ang pagdating at pagiging malapit nang mangyari.
- source_word: ἁρπάζειν
  choice: dakpin
  rationale: Pinananatili ng 'dakpin' ang biglaan at mapuwersang diwa ng pandiwa, hindi lamang simpleng pagkuha.
- source_word: ἵνα ποιήσωσιν βασιλέα
  choice: at gawing hari
  rationale: Sa pagkakaugnay nito sa 'upang,' malinaw na layunin ng pagdakip ang gawin siyang hari.
- source_word: ἀνεχώρησεν
  choice: umalis
  rationale: Natural na salitang Tagalog para sa paglayo ni Jesus sa sitwasyon; iniiwasan ang sobrang militar na himig ng 'umurong.'
- source_word: πάλιν
  choice: muli
  rationale: Tuwirang pinananatili ang diwa ng pag-uulit.
- source_word: εἰς τὸ ὄρος
  choice: patungo sa bundok
  rationale: Malapit sa literal na kahulugan at hindi labis na tinutukoy kung burol o kabundukan ang tinutukoy.
- source_word: αὐτὸς μόνος
  choice: nang nag-iisa
  rationale: Likas at sapat na naipapahayag sa Tagalog ang mariing diwa na si Jesus lamang ang naroon.
theological_decisions:
- issue: Kalikasan ng balak ng mga tao na gawing hari si Jesus
  choice: Ilarawan itong mapuwersang pagtatangkang dakpin siya at gawing hari.
  alternative: Lumapit sila upang gawin siyang hari nang walang pahiwatig ng pamimilit.
  rationale: Ang ἁρπάζειν ay malinaw na nagpapahiwatig ng sapilitan o mapuwersang pagkuha; hindi dapat palambutin ang pampolitikang pagtatangka ng karamihan.
translation_notes:
  register: Makabagong Filipino Tagalog na malinaw, marangal, at natural. Ginamit ang 'dakpin' upang mapanatili ang puwersa ng Griyego, at 'nang nag-iisa' upang maiwasan ang di-likas na pag-uulit.
