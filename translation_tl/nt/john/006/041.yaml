source:
  edition: SBLGNT
  text: Ἐγόγγυζον οὖν οἱ Ἰουδαῖοι περὶ αὐτοῦ ὅτι εἶπεν· Ἐγώ εἰμι ὁ ἄρτος ὁ καταβὰς ἐκ τοῦ οὐρανοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/041.yaml
  text: So the Jews were grumbling about him because he said[a], “I am the bread that came down from heaven.”
translation:
  language: tl
  text: Kaya nagbulung-bulungan ang mga Hudyo[a] tungkol sa kanya dahil sinabi niya, “Ako ang tinapay na bumaba mula sa langit.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga taga-Judea,” o sa ilang konteksto, “mga pinunong Hudyo.” Ang katawagang “mga Hudyo” sa Juan ay maaaring tumukoy sa isang partikular na grupong sumasalungat kay Jesus, hindi sa buong bayang Hudyo.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγόγγυζον
  choice: nagbulung-bulungan
  rationale: Ipinahahayag ng imperpektong pandiwa ang nagpapatuloy o paulit-ulit na pagrereklamo. Likas sa modernong Tagalog ang “nagbulung-bulungan” at taglay nito ang diwang hindi nasisiyahang pag-uusap sa mahinang tinig.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinakikita ang bunga o lohikal na pagpapatuloy mula sa naunang sinabi ni Jesus; natural at hindi labis na pormal ang “Kaya.”
- source_word: οἱ Ἰουδαῖοι
  choice: ang mga Judio
  rationale: Direktang isinasalin ang karaniwang katawagan ni Juan nang hindi awtomatikong nililimitahan sa mga pinuno o sa mga taga-Judea. Nililinaw ng talababa na maaari itong tumukoy sa isang partikular na grupong sumasalungat kay Jesus, hindi sa lahat ng Judio.
- source_word: περὶ αὐτοῦ
  choice: tungkol sa kanya
  rationale: Karaniwang kahulugan ng περί na may genitive ang “tungkol sa”; hindi nito dinaragdagan ang preposisyon ng tahasang diwang “laban sa.”
- source_word: ὅτι
  choice: dahil
  rationale: Ipinakikilala rito ng ὅτι ang dahilan ng kanilang pagbubulung-bulungan.
- source_word: εἶπεν
  choice: sinabi niya
  rationale: Natural na katumbas ng aorist indicative sa salaysay at malinaw na tumutukoy sa naunang pahayag ni Jesus.
- source_word: Ἐγώ εἰμι
  choice: Ako ang
  rationale: Sa hulma ng pangungusap sa Tagalog, likas na ipinapahayag ng “Ako ang tinapay” ang mariing pagkakakilanlan ng Ἐγώ εἰμι nang hindi nagdaragdag ng interpretasyon.
- source_word: ὁ ἄρτος
  choice: ang tinapay
  rationale: Pinananatili ang tiyak na pagkakakilanlan kay Jesus bilang “ang tinapay,” hindi basta tinapay sa pangkalahatan.
- source_word: ὁ καταβὰς
  choice: na bumaba
  rationale: Malinaw at likas na sugnay na panuring sa Tagalog para sa articular aorist participle; ipinahahayag nito ang pagbaba bilang naganap na kilos.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: mula sa langit
  rationale: Natural na salin na nagpapanatili sa diin sa pinagmulan.
theological_decisions:
- issue: Saklaw ng οἱ Ἰουδαῖοι sa Ebanghelyo ni Juan
  choice: Isinalin sa pangunahing teksto bilang “ang mga Judio.”
  alternative: “ang mga taga-Judea” o, sa ilang konteksto, “ang mga pinunong Judio”
  rationale: Hindi tahasang nililimitahan ng talatang ito ang tinutukoy sa mga pinuno, at maaaring magpasok ng di-kinakailangang heograpikong diin ang “mga taga-Judea.” Pinananatili ang katawagan ng Griyego, habang nililinaw sa talababa na sa salaysay ni Juan maaari itong tumukoy sa isang partikular na grupong sumasalungat kay Jesus at hindi sa buong bayang Judio.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “nagbulung-bulungan” upang mapanatili ang nagpapatuloy at mapunang tono ng pandiwa, at iniwasan ang mas arkaikong “nagbulong-bulungan” kung mauunawaan lamang bilang tahimik na pag-uusap.
