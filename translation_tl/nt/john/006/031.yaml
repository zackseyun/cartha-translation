  text: οἱ πατέρες ἡμῶν τὸ μάννα ἔφαγον ἐν τῇ ἐρήμῳ, καθώς ἐστιν γεγραμμένον· Ἄρτον ἐκ τοῦ οὐρανοῦ ἔδωκεν αὐτοῖς φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/031.yaml
  text: 'Our fathers ate the manna in the wilderness[b][a], just as it is written: ‘He gave them bread from heaven to eat.’'
translation:
  language: tl
  text: 'Kinain ng aming mga ninuno[a] ang manna sa ilang,[b] gaya ng nasusulat: “Binigyan niya sila ng tinapay mula sa langit upang kainin nila.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “aming mga ama.”
    reason: lexical_alternative
  - marker: b
    text: Ang “sa ilang” ay maaari ring isaling “sa disyerto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πατέρες ἡμῶν
  choice: aming mga ninuno
  rationale: Bagaman literal na “aming mga ama,” ang parirala ay tumutukoy sa mga ninuno ng Israel. Ang “aming mga ninuno” ang natural at malinaw na katumbas sa modernong Tagalog nang hindi nililimitahan ang tinutukoy sa agarang mga ama.
- source_word: τὸ μάννα
  choice: ang manna
  rationale: Ang “manna” ang nakaugaliang transliterasyon sa Tagalog para sa pagkaing ibinigay sa Israel sa ilang; pinananatili ng pantukoy na “ang” ang tiyak at kilalang reperensiya.
- source_word: ἔφαγον
  choice: Kinain
  rationale: Tuwirang ipinapahayag ng “kinain” ang natapos na kilos ng aorist na ἔφαγον at maayos na inuugnay ang pandiwa sa layong “ang manna.”
- source_word: ἐν τῇ ἐρήμῳ
  choice: sa ilang
  rationale: Ang “ilang” ay likas at biblikal na salin para sa ἔρημος sa konteksto ng paglalakbay ng Israel; maaari rin itong unawain bilang disyerto.
- source_word: καθώς ἐστιν γεγραμμένον
  choice: gaya ng nasusulat
  rationale: Ito ang natural at marangal na pormulang Tagalog sa pagpapakilala ng sipi sa Kasulatan, at pinananatili ang diwa ng nakasulat na patotoong nananatiling may bisa.
- source_word: Ἄρτον
  choice: tinapay
  rationale: Ang “tinapay” ang karaniwang katumbas ng ἄρτος dito at hindi nagpapahiwatig ng isang partikular na bilog o pirasong tinapay.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: mula sa langit
  rationale: Tumpak at natural na ipinapahayag ng “mula sa langit” ang pinagmulan na tinutukoy ng ἐκ τοῦ οὐρανοῦ.
- source_word: ἔδωκεν αὐτοῖς φαγεῖν
  choice: Binigyan niya sila ... upang kainin
  rationale: Pinananatili nito ang pagkakabuo ng δίδωμι kasama ang layong di-tuwiran at pawatas, nang hindi nagdaragdag ng paliwanag na wala sa Griyego.
theological_decisions:
- issue: Paglalahad sa sipi tungkol sa manna nang hindi paunang ipinapasok ang Kristolohikal na pagpapakahulugan ng kasunod na diskurso
  choice: Panatilihin itong pahayag tungkol sa pagbibigay ng tinapay mula sa langit, gamit ang panghalip na “niya” at karaniwang “tinapay.”
  alternative: Tahasang pangalanan ang Diyos o gumamit ng kapitalisasyon o pananalitang tuwirang nagpapahiwatig kay Jesus bilang tunay na tinapay.
  rationale: Sa talatang ito, binabanggit ng mga nagsasalita ang manna sa kasaysayan ng Israel. Dapat hayaang lumitaw sa pagpapatuloy ng salaysay ang mas malalim na Kristolohikal na kahulugan sa halip na ipasok iyon sa kanilang sipi.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pagbasa ng Kasulatan. Ginamit ang “mga ninuno” para sa natural na pagtukoy sa mga ninuno ng Israel, habang inilagay sa talababa ang literal na anyo. Pinanatili ang tradisyonal ngunit madaling maunawaang “manna,” “ilang,” at “gaya ng nasusulat.”
