  naturalness: Mas tuwiran at likas sa modernong Filipino ang “nagbibigay ng buhay” kaysa “nagbibigay-buhay” sa ganitong sugnay. Ang huli ay maaaring mabasa bilang tambalang pang-uri; ang una ay malinaw na pandiwang may tuwirang layon.
