base_translation:
  language: en
  yaml_path: translation/nt/john/006/033.yaml
  text: For the bread of God is the one who comes down from heaven and gives life to the world[a].
translation:
  language: tl
  text: Sapagkat ang tinapay ng Diyos ay ang bumababa mula sa langit at nagbibigay ng buhay sa sanlibutan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “yaong bumababa mula sa langit at nagbibigay ng buhay sa sanlibutan.” Maaaring isalin nang di-personal ang parirala sa Griyego, ngunit ang panlalaking mga pandiwari ay pumapabor sa pagtukoy sa isang persona.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄρτος
  choice: tinapay
  rationale: Pinananatili ang kongkretong larawan ng tinapay na mahalaga sa pahayag at sa kasunod na talinghaga.
- source_word: τοῦ θεοῦ
  choice: ng Diyos
  rationale: Pinananatili ang anyong henitibo at hindi agad nililimitahan kung ito ay tumutukoy sa pag-aari o pinagmulan.
- source_word: ὁ καταβαίνων
  choice: ang bumababa
  rationale: Likas at marangal sa Tagalog; maaari itong tumukoy sa isang persona at pinananatili rin ang nagpapatuloy na kilos ng kasalukuyang pandiwaring Griyego.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: mula sa langit
  rationale: Karaniwang salin na malinaw na nagpapahayag ng pinagmulan.
- source_word: ζωὴν διδοὺς
  choice: nagbibigay-buhay
  rationale: Natural na pariralang Tagalog na pinananatili ang payak ngunit mabigat na diwa ng pagbibigay ng buhay.
- source_word: τῷ κόσμῳ
  choice: sa sanlibutan
  rationale: Pinananatili ang malawak na saklaw ng κόσμος at ang nakagawiang bokabularyong Juaniko nang hindi ito nililimitahan sa isang tiyak na pangkat.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Malinaw na ipinakikita ang paliwanag o batayan ng naunang pahayag.
theological_decisions:
- issue: Personal o impersonal na pagtukoy sa ὁ καταβαίνων ... καὶ ζωὴν διδοὺς
  choice: Gamitin sa pangunahing teksto ang “ang bumababa ... at nagbibigay-buhay,” na likas na mababasang tumutukoy sa isang persona.
  alternative: “yaong bumababa mula sa langit at nagbibigay-buhay sa sanlibutan,” na maaaring unawain nang higit na impersonal.
  rationale: Ang panlalaking isahang mga pandiwari sa Griyego ay pumapabor sa personal na tinutukoy at umaayon sa konteksto, ngunit hindi lubusang inaalis ang mas impersonal na pagbasa; kaya itinatala ang alternatibo sa talababa.
- issue: Saklaw ng κόσμος
  choice: sanlibutan
  alternative: sangkatauhan; lahat ng tao
  rationale: Pinananatili nito ang lawak at tensiyong teolohikal ng salita nang hindi pinakikitid ang kahulugan o pinagpapasiyahan ang mga usapin tungkol sa saklaw at pagtanggap ng buhay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “sanlibutan” upang mapanatili ang malawak at teolohikal na gamit ng κόσμος sa Juan; iniwasan ang mas paliwanag na paraphrase.
