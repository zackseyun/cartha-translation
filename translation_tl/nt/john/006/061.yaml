  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰδὼς δὲ ὁ Ἰησοῦς ἐν ἑαυτῷ ὅτι γογγύζουσιν περὶ τούτου οἱ μαθηταὶ αὐτοῦ εἶπεν αὐτοῖς· Τοῦτο ὑμᾶς σκανδαλίζει;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/061.yaml
  text: But Jesus[a], knowing in himself that his disciples were grumbling about this, said to them, “Does this offend you?"
translation:
  language: tl
  text: Ngunit batid ni Jesus sa kanyang sarili na nagbubulung-bulungan ang kanyang mga alagad tungkol dito, kaya sinabi niya sa kanila, “Nagdudulot ba ito ng pagkatisod sa inyo?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Naiinis ba kayo dahil dito?”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: alam
  rationale: Likas sa makabagong Tagalog ang sugnay na “alam ni Jesus” at malinaw nitong ipinahahayag ang kasabay na kaalaman ng participle.
- source_word: ἐν ἑαυτῷ
  choice: sa kanyang sarili
  rationale: Pinananatili nito ang diin na batid ni Jesus ang bagay na ito sa kanyang kalooban, hindi dahil may nagsabi sa kanya.
- source_word: γογγύζουσιν
  choice: nagbubulungan
  rationale: Ipinahihiwatig ng pandiwa ang pabulong at hindi nasisiyahang pagrereklamo; mas angkop dito ang “nagbubulungan” kaysa sa lantad na “nagrereklamo.”
- source_word: περὶ τούτου
  choice: tungkol dito
  rationale: Tuwirang tumutukoy ito sa naunang sinabi ni Jesus nang hindi nagdaragdag ng paliwanag na wala sa Griyego.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ang kanyang mga alagad
  rationale: Karaniwang salin ito at hindi nililimitahan ang tinutukoy sa Labindalawa lamang.
- source_word: Τοῦτο
  choice: ito
  rationale: Pinananatili ang maikli at di-tahasang demonstrative ng Griyego, na tumutukoy sa naunang pahayag.
- source_word: σκανδαλίζει
  choice: nagiging katitisuran
  rationale: Pinananatili ng “katitisuran” ang metaporang maaaring mangahulugan hindi lamang ng pagkayamot kundi ng pagkadapa sa pananampalataya o pagtalikod.
theological_decisions:
- issue: Kahulugan ng σκανδαλίζει sa harap ng posibilidad na tanggihan ng mga alagad ang turo ni Jesus
  choice: Nagiging katitisuran ba ito sa inyo?
  alternative: Hindi ba ninyo matanggap ito?
  rationale: Ang pangunahing salin ay nagpapanatili sa metapora at sa mas mabigat na posibilidad ng pagkadapa o pagtalikod, samantalang inilalahad sa talababa ang mas pangkaraniwang diwa ng pagkatisod o pagtutol sa sinabi. Hindi nito nilulutas nang sapilitan ang saklaw ng Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nagbubulungan” para sa pabulong na pagrereklamo at “katitisuran” upang mapanatili ang mahalagang metapora ng Griyego; inilagay kaagad pagkatapos ng kaugnay na parirala ang pananda ng talababa.
