revisions:
- from: Ngunit alam ni Jesus sa kanyang sarili na nagbubulungan tungkol dito ang kanyang mga alagad, kaya sinabi niya sa kanila, “Nagiging katitisuran ba ito sa inyo?[a]”
  to: Ngunit batid ni Jesus sa kanyang sarili na nagbubulung-bulungan ang kanyang mga alagad tungkol dito, kaya sinabi niya sa kanila, “Nagdudulot ba ito ng pagkatisod sa inyo?[a]”
  rationale: Inayos ang pangunahing tanong upang maging likas na Filipino habang pinananatili ang sanhi-at-bungang metapora ng σκανδαλίζει. Pinalitan ang talababa ng isang tunay na semantikong kahalili na nagsasaad ng diwang pagkasaktan o pagkayamot, nang hindi ipinapasok ang interpretatibong “hindi matanggap.” Pinanatili ang ἐν ἑαυτῷ sa “sa kanyang sarili” at ang diwa ng γογγύζουσιν sa “nagbubulung-bulungan.”
