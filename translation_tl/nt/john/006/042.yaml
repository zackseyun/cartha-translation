  text: καὶ ἔλεγον· ⸀Οὐχ οὗτός ἐστιν Ἰησοῦς ὁ υἱὸς Ἰωσήφ, οὗ ἡμεῖς οἴδαμεν τὸν πατέρα καὶ τὴν μητέρα; πῶς ⸀νῦν ⸀λέγει ὅτι Ἐκ τοῦ οὐρανοῦ καταβέβηκα;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/042.yaml
  text: And they were saying, “Is this not Jesus, the son of Joseph, whose father and mother we know? How does he now say, ‘I have come down from heaven’?”
translation:
  language: tl
  text: At sinasabi nila, “Hindi ba ito si Jesus, ang anak ni Jose, na kilala natin ang kanyang ama at ina? Paano niya ngayong sinasabi, ‘Bumaba ako mula sa langit’?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: sinasabi nila
  rationale: Pinananatili ng aspektong imperpektibo ang diwang nagpapatuloy o paulit-ulit na pagsasalita; natural ito sa makabagong Tagalog.
- source_word: Οὐχ οὗτός ἐστιν
  choice: Hindi ba ito
  rationale: Natural na negatibong tanong sa Tagalog na naghihintay ng pagsang-ayon at nagpapanatili sa retorikal na diin.
- source_word: ὁ υἱὸς Ἰωσήφ
  choice: na anak ni Jose
  rationale: Tuwirang ipinapahayag ang kinikilalang ugnayang pampamilya na batayan ng pagtutol ng mga nagsasalita.
- source_word: οὗ ἡμεῖς οἴδαμεν τὸν πατέρα καὶ τὴν μητέρα
  choice: Kilala natin ang kanyang ama at ina
  rationale: Likas na Tagalog para sa pahayag nilang personal nilang kilala ang mga magulang ni Jesus; hindi dinaragdagan ang saklaw ng kanilang pag-aangkin.
- source_word: πῶς νῦν λέγει
  choice: Paano niya ngayon nasasabing
  rationale: Pinananatili ang pangunahing kahulugan ng πῶς bilang “paano,” ang pangkasalukuyang pagsasalita, at ang mapanghamong himig nang hindi idinaragdag ang modal na “magagawa.”
- source_word: Ἐκ τοῦ οὐρανοῦ
  choice: mula sa langit
  rationale: Karaniwan at malinaw na pagpapahayag ng pinagmulan sa Tagalog.
- source_word: καταβέβηκα
  choice: Bumaba ako
  rationale: Natural na Tagalog para sa ganap na pagbaba na may kasalukuyang kabuluhan; bagaman walang tahasang katumbas ang Tagalog sa Greek perfect, malinaw sa konteksto ang natapos na kilos at nananatiling pag-aangkin.
theological_decisions:
- issue: Ang pagtutol ng mga tao sa pag-aangkin ni Jesus na nagmula siya sa langit
  choice: Panatilihin ang tuwirang pahayag na “Bumaba ako mula sa langit.”
  alternative: “Nagmula ako sa langit” o “Nanaog ako mula sa langit.”
  rationale: Hindi ginagawang metapora o ipinapaliwanag nang higit sa sinasabi ng teksto ang pag-aangkin. Pinananatili nito ang tensiyon sa pagitan ng pagkakilala nila sa makalupang pamilya ni Jesus at ng kanyang ipinahayag na makalangit na pinagmulan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sinasabi nila” upang ipakita ang nagpapatuloy na usapan, at “bumaba” sa halip na mas makalumang “nanaog” upang madaling maunawaan ng karaniwang mambabasa.
