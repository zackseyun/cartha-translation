  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς καὶ εἶπεν· Ἀμὴν ἀμὴν λέγω ὑμῖν, ζητεῖτέ με οὐχ ὅτι εἴδετε σημεῖα ἀλλ’ ὅτι ἐφάγετε ἐκ τῶν ἄρτων καὶ ἐχορτάσθητε·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/026.yaml
  text: Jesus answered them[a], “Truly, truly, I say to you, you are seeking me not because you saw signs, but because you ate of the loaves and were filled.
translation:
  language: tl
  text: 'Sumagot sa kanila si Jesus, “Tunay na tunay, sinasabi ko sa inyo: hinahanap ninyo ako, hindi dahil nakakita kayo ng mga tanda, kundi dahil kumain kayo ng mga tinapay at nabusog.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς καὶ εἶπεν
  choice: Sumagot sa kanila si Jesus
  rationale: Ang dobleng panimulang Griyego na ‘sumagot at nagsabi’ ay likas na naipahahayag sa modernong Tagalog sa pamamagitan ng ‘sumagot’; malinaw nang ipinakikita ng kasunod na tuwirang sipi ang pagsasalita.
- source_word: Ἀμὴν ἀμὴν λέγω ὑμῖν
  choice: Katotohanang-katotohanang sinasabi ko sa inyo
  rationale: Pinananatili ng pag-uulit ang natatanging mariin at maringal na pormula sa Juan, habang nauunawaan ito ng karaniwang mambabasa.
- source_word: ζητεῖτέ με
  choice: hinahanap ninyo ako
  rationale: Likas sa kasalukuyang Tagalog at ipinahahayag ang nagpapatuloy na paghahanap sa konteksto.
- source_word: οὐχ ὅτι ... ἀλλ’ ὅτι
  choice: hindi dahil ... kundi dahil
  rationale: Malinaw na pinananatili ang paghahambing ng dalawang dahilan o motibo.
- source_word: εἴδετε σημεῖα
  choice: nakakita kayo ng mga tanda
  rationale: Ang ‘nakakita’ ay hindi nagdaragdag ng ideya ng espirituwal na pagkaunawa; ang ‘mga tanda’ ay nagpapanatili sa mahalagang bokabularyo ni Juan sa halip na gawing ‘mga himala.’
- source_word: ἐφάγετε ἐκ τῶν ἄρτων
  choice: kumain kayo ng mga tinapay
  rationale: Pinananatili ang maramihang ‘mga tinapay’ na tumutukoy sa mga tinapay na pinarami; hindi likas sa Tagalog ang literal na ‘kumain mula sa mga tinapay.’
- source_word: ἐχορτάσθητε
  choice: nabusog
  rationale: Direkta at natural na ipinahahayag ang pagkain hanggang sa mapuno o masiyahan ang tiyan.
theological_decisions:
- issue: Kahulugan ng σημεῖα sa konteksto ng Juan
  choice: mga tanda
  alternative: mga himala; mga mahimalang tanda
  rationale: Ang mga gawa ni Jesus sa Juan ay mga tandang tumuturo sa kahulugang higit sa mismong himala. Pinananatili ng ‘mga tanda’ ang aspektong ito nang walang idinagdag na paliwanag.
- issue: Lakas ng pormulang Ἀμὴν ἀμὴν
  choice: Katotohanang-katotohanang sinasabi ko sa inyo
  alternative: Amen, amen, sinasabi ko sa inyo; Talagang sinasabi ko sa inyo
  rationale: Pinananatili ang pag-uulit at taimtim na diin ng pananalita ni Jesus nang malinaw sa modernong Tagalog.
- issue: Diwa ng ἐχορτάσθητε
  choice: nabusog
  alternative: nasiyahan; napuno
  rationale: Tumutukoy ito sa literal na pagkabusog sa pagpapakain sa karamihan. Ang ‘nabusog’ ay hindi nagpapalawak nito tungo sa pangkalahatan o espirituwal na kasiyahan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignified, at angkop sa pampublikong pagbasa. Ginamit ang karaniwang ayos na ‘Sumagot sa kanila si Jesus’ at ang natural na ‘nabusog,’ habang pinanatili ang pormal na diin ng dobleng ‘Katotohanang-katotohanan.’
