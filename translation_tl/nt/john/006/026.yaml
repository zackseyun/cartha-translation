  source_fidelity: 'Tumpak na naihahatid ng salin ang pangunahing diwa ng Griyego: ang mariing pormula, ang magkasalungat na motibo sa pamamagitan ng “hindi dahil ... kundi dahil,” ang Johannine na “mga tanda,” at ang literal na pagkabusog matapos kumain. Ang “kumain kayo ng mga tinapay” ay natural na Tagalog na katumbas ng pagkain ng mga tinapay, bagaman hindi tahasang naipapahayag ang partitive na ἐκ; hindi ito nagbabago sa kahulugan sa kontekstong ito.'
