id: JHN.6.38
reference: John 6:38
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτι καταβέβηκα ⸀ἀπὸ τοῦ οὐρανοῦ οὐχ ἵνα ποιῶ τὸ θέλημα τὸ ἐμὸν ἀλλὰ τὸ θέλημα τοῦ πέμψαντός με·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/038.yaml
  text: For I have come down from heaven, not to do my own will, but the will of the one who sent me.
translation:
  language: tl
  text: Sapagkat bumaba ako mula sa langit, hindi upang gawin ang sarili kong kalooban, kundi ang kalooban ng nagsugo sa akin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: Sapagkat
  rationale: Nagbibigay ito ng paliwanag o dahilan para sa naunang pahayag at pinananatili ang puwersang sanhi ng Griyego.
- source_word: καταβέβηκα
  choice: bumaba ako
  rationale: Likas itong pahayag sa modernong Tagalog para sa pagparito mula sa itaas. Bagaman perpekto ang anyong Griyego at may nananatiling kabuluhan ang natapos na kilos, karaniwang ipinahahayag ng Tagalog ang aspektong ito sa payak na perpektibong pandiwa.
- source_word: ἀπὸ τοῦ οὐρανοῦ
  choice: mula sa langit
  rationale: Tuwiran at natural itong katumbas na nagpapanatili sa larawang pangkalawakan at sa pahayag tungkol sa pinagmulan.
- source_word: οὐχ ἵνα
  choice: hindi upang
  rationale: Malinaw nitong pinananatili ang layuning ipinahahayag ng ἵνα at ang pagtanggi rito.
- source_word: ποιῶ
  choice: gawin
  rationale: Ito ang tuwiran at natural na katumbas at angkop sa pariralang 'gawin ang ... kalooban.'
- source_word: τὸ θέλημα
  choice: ang kalooban
  rationale: Pinananatili nito ang pormal na pagkakatulad ng dalawang sugnay at ang personal at teolohikal na bigat ng θέλημα.
- source_word: τὸ ἐμὸν
  choice: sarili kong
  rationale: Ipinahahayag nito ang diin ng Griyegong panghalip na paari at nililinaw ang pagsalungat sa kalooban ng nagsugo.
- source_word: ἀλλὰ
  choice: kundi
  rationale: Pagkatapos ng negatibong sugnay, likas na ipinahahayag ng 'kundi' ang matinding pagsalungat sa Tagalog.
- source_word: τοῦ πέμψαντός με
  choice: ng nagsugo sa akin
  rationale: Tumpak at maikli nitong isinasalin ang articular participle nang hindi tahasang pinapangalanan ang nagsugo, gaya rin ng Griyego.
theological_decisions:
- issue: Ang pagbaba ni Jesus mula sa langit at ang implikasyong Kristolohikal nito
  choice: Isinalin nang tuwiran bilang 'bumaba ako mula sa langit.'
  alternative: Unawain lamang bilang metapora para sa banal na pagkakasugo.
  rationale: Inilalahad ng talata ang pinagmulan ni Jesus sa mga katagang makalangit; hindi ito dapat pahinain o dagdagan ng paliwanag na wala sa teksto.
- issue: Ang ugnayan ng kalooban ni Jesus at ng kalooban ng nagsugo sa kanya
  choice: Ginamit ang 'kalooban' sa parehong pagkakataon at pinanatili ang malinaw na pagsalungat.
  alternative: Isalin nang mas dinamiko bilang 'ang gusto ko' at 'ang gusto niya.'
  rationale: Pinananatili ng 'kalooban' ang simetriya, bigat, at tunay na tensiyon ng teksto nang hindi ipinapaliwanag ang ugnayan sa pamamagitan ng mga teknikal na kategoryang wala rito.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Pinili ang 'Sapagkat' at 'kalooban' upang mapanatili ang lohikal at teolohikal na bigat ng pangungusap; walang kinakailangang talababa.
