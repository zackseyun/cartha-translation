  yaml_path: translation/nt/john/006/003.yaml
  text: Then Jesus went up on the mountain, and there he sat with his disciples.
translation:
  language: tl
  text: Pagkatapos, umakyat si Jesus sa bundok, at doon siya naupo kasama ng kanyang mga alagad.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνῆλθεν
  choice: umakyat
  rationale: Karaniwang tumutukoy ang aorist ng ἀνέρχομαι sa pag-akyat bilang kilos ng pagpunta; natural at tumpak ang “umakyat” sa salaysay.
- source_word: δὲ
  choice: Pagkatapos
  rationale: Nagsasaad dito ang δέ ng pagpapatuloy ng salaysay, hindi ng matinding pagsalungat.
- source_word: εἰς τὸ ὄρος
  choice: sa bundok
  rationale: Kasama ng ἀνῆλθεν, tumutukoy ito sa pag-akyat sa isang tiyak na mataas na lugar; natural sa Filipino ang “umakyat ... sa bundok.”
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Ginamit ang nakaugaliang anyo ng personal na pangalan sa modernong Filipino.
- source_word: ἐκεῖ
  choice: doon
  rationale: Tuwirang katumbas na panlunan at natural sa Filipino.
- source_word: ἐκάθητο
  choice: naupo
  rationale: Ipinahihiwatig ng imperfect ng κάθημαι ang pag-upo o pagiging nakaupo sa tagpo; malinaw at natural ang “naupo” sa daloy ng salaysay.
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: kasama ng kanyang mga alagad
  rationale: Ang μετά na may genitive ay nangangahulugang “kasama,” at pinananatili ng “mga alagad” ang ugnayang guro-tagasunod na taglay ng μαθητής sa mga Ebanghelyo.
