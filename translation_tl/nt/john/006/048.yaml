  text: Ako ang tinapay ng buhay.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγώ εἰμι
  choice: Ako ang
  rationale: Sa natural na Filipino, ang pangungusap na pantukoy ay karaniwang walang lantad na katumbas ng copula na “am.” Ang “Ako ang” ay malinaw na nagpapanatili sa tahasang paksa at matibay na pagkakakilanlan ng pahayag.
- source_word: ὁ ἄρτος
  choice: ang tinapay
  rationale: Ang “tinapay” ang karaniwan at likas na katumbas ng ἄρτος sa kontekstong ito. Ang panandang “ang” ay nagpapanatili sa tiyak at nagpapakilalang bisa ng artikulong Griyego.
- source_word: τῆς ζωῆς
  choice: ng buhay
  rationale: Pinananatili ng “ng buhay” ang maikli at sadyang malawak na ugnayang henitibo sa Griyego, sa halip na ipaliwanag ito bilang “nagbibigay-buhay” o “para sa buhay.”
theological_decisions:
- issue: Bisa ng pahayag na ἐγώ εἰμι sa Kristolohiya ni Juan
  choice: Isinalin nang tuwiran bilang “Ako ang” nang walang dagdag na teolohikal na pagpapaliwanag.
  alternative: “Ako mismo ang” o isang pinalawak na pariralang tahasang nagpapaliwanag sa kahulugan ng tinapay ng buhay.
  rationale: Dito, ang ἐγώ εἰμι ay may panaguring ὁ ἄρτος τῆς ζωῆς at hindi isang absolutong pahayag. Pinananatili ng salin ang matibay na pagpapakilala ni Jesus sa sarili nang hindi nagdaragdag ng salitang wala sa teksto.
- issue: Kahulugan ng henitibong τῆς ζωῆς
  choice: Pinanatili bilang “ng buhay.”
  alternative: “na nagbibigay-buhay” o “para sa buhay.”
  rationale: Maaaring magpahiwatig ang parirala ng tinapay na nagbibigay o nagtataglay ng buhay, ngunit hindi tinutukoy ng payak na henitibo ang iisang paliwanag lamang. Pinananatili ng salin ang tunay na lawak ng pahayag.
translation_notes:
  register: Maikli, marangal, at likas sa modernong Filipino. Ginamit ang karaniwang biblikal at pang-araw-araw na salitang “tinapay,” at iniwasan ang hindi kailangang pagpapalawak.
