  text: But I told you that you have even seen me[a], and yet you do not believe.
translation:
  language: tl
  text: Ngunit sinabi ko sa inyo na nakita na nga ninyo ako, gayunma’y hindi kayo sumasampalataya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλ’
  choice: Ngunit
  rationale: Nagpapahayag ito ng pagsalungat sa naunang sinabi at angkop sa marangal ngunit likas na Filipino.
- source_word: εἶπον ὑμῖν
  choice: sinabi ko na sa inyo
  rationale: Likas na pagkakasabi sa Filipino para sa naunang pahayag ni Jesus; ipinahihiwatig ng “na” na naipahayag na niya ito.
- source_word: καὶ ἑωράκατέ με
  choice: nakita na nga ninyo ako
  rationale: Pinananatili ng “nakita na” ang natapos na pagkakita na may kabuluhan sa kasalukuyan, samantalang ipinapakita ng “nga” ang mariing puwersa ng unang καί.
- source_word: καὶ οὐ πιστεύετε
  choice: gayunma’y hindi pa rin kayo sumasampalataya
  rationale: Inililitaw ng “gayunma’y” ang kontras sa kanilang pagkakita, at ng “hindi pa rin” ang nagpapatuloy nilang hindi pagsampalataya. Ang “sumasampalataya” ay tuwirang pandiwang katumbas ng πιστεύετε sa kontekstong Juanino.
theological_decisions:
- issue: Puwersa ng unang καί sa καὶ ἑωράκατέ με
  choice: Mariing “nakita na nga ninyo ako”
  alternative: Konsesibong “bagaman nakita na ninyo ako” o mas pormal na “nakita rin ninyo ako”
  rationale: Maaaring unawain ang καί bilang mariing “nga/tunay nga” o katawanin nang mas pormal bilang “rin.” Pinipili ang “nga” upang mapanatili ang diin nang hindi ginagawang tahasang konsesibo ang unang sugnay.
- issue: Kahulugan ng πιστεύετε
  choice: sumasampalataya
  alternative: naniniwala o nagtitiwala
  rationale: Ang pandiwang “sumasampalataya” ay natural at nakaugat na katumbas sa kontekstong ito, habang hindi nito nililimitahan ang salita sa pagsang-ayon lamang ng isip o tahasang dinaragdagan ng layong wala sa sugnay.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang tutuldok upang malinaw na ipakilala ang nilalaman ng naunang sinabi ni Jesus, at pinanatili ang retorikal na tensiyon sa pagitan ng pagkakita at hindi pagsampalataya.
