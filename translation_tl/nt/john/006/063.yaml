id: JHN.6.63
reference: John 6:63
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τὸ πνεῦμά ἐστιν τὸ ζῳοποιοῦν, ἡ σὰρξ οὐκ ὠφελεῖ οὐδέν· τὰ ῥήματα ἃ ἐγὼ ⸀λελάληκα ὑμῖν πνεῦμά ἐστιν καὶ ζωή ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/063.yaml
  text: It is the Spirit who gives life[a]; the flesh benefits nothing[c][b]. The words that I have spoken to you are spirit and are life.
translation:
  language: tl
  text: Ang Espiritu ang nagbibigay-buhay[a]; walang anumang pakinabang ang laman[b]. Ang mga salitang sinabi ko sa inyo ay espiritu[c] at buhay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ang espiritu ang nagbibigay-buhay.” Ang salitang Griyego na πνεῦμα ay maaaring mangahulugang “Espiritu” o “espiritu”; sa kontekstong ito, mas malamang na ang Banal na Espiritu ang tinutukoy.
    reason: alternative_reading
  - marker: b
    text: Ang “laman” ay maaaring tumukoy nang malawakan sa kung ano ang pawang pantao. Ang pagsasalin dito bilang “makasalanang kalikasan” ay magiging higit na mapagpaliwanag kaysa sa hinihingi ng Griyego.
    reason: lexical_alternative
  - marker: c
    text: O “ay Espiritu at buhay,” o “ay espirituwal at nagbibigay-buhay.” Maikli at kwalitatibo ang pagkakahayag sa Griyego.
    reason: alternative_reading
lexical_decisions:
- source_word: πνεῦμα
  choice: Espiritu
  rationale: Sa unang sugnay, ang may artikulong τὸ πνεῦμα at ang konteksto sa Juan ay pinakamalamang na tumutukoy sa Banal na Espiritu. Pinananatili sa talababa ang posibleng pagbasa na “espiritu.”
- source_word: ζῳοποιοῦν
  choice: nagbibigay-buhay
  rationale: Tuwirang ipinahahayag ang patuloy na gawain ng pagbibigay o paglikha ng buhay, at natural itong ikinakabit sa personal na paksa na “Espiritu.”
- source_word: σὰρξ
  choice: laman
  rationale: Pinananatili ang malawak at sadyang hindi ganap na nililinaw na saklaw ng σάρξ. Ang “makasalanang kalikasan,” “katawan,” o “kakayahang pantao” ay magiging higit na mapagpaliwanag kaysa sa Griyego.
- source_word: ὠφελεῖ οὐδέν
  choice: walang anumang pakinabang
  rationale: Malinaw at natural na Filipino ito na nagpapanatili sa ganap na pagtanggi ng οὐδέν.
- source_word: ῥήματα
  choice: mga salita
  rationale: Tuwirang tumutukoy sa mga binigkas na pahayag ni Jesus at natural sa konteksto.
- source_word: λελάληκα
  choice: sinabi ko
  rationale: Ang aspektong perpekto ay walang ganap na natural na katumbas dito sa Filipino; ipinahihiwatig ng konteksto na ang mga salitang nasabi ay nananatiling mahalaga. Mas natural ang “sinabi ko” kaysa “ipinagsalita ko.”
- source_word: πνεῦμά ἐστιν
  choice: ay espiritu
  rationale: Pinananatili ang maikli at kwalitatibong pahayag ng Griyego nang hindi tuwirang ipinapantay ang mga salita sa Banal na Espiritu o pinalalawak bilang “espirituwal.”
- source_word: ζωή
  choice: buhay
  rationale: Ito ang tuwiran at karaniwang katumbas ng mahalagang terminong Juanino na ζωή.
theological_decisions:
- issue: Ang tinutukoy ng πνεῦμα sa unang sugnay
  choice: Ang “Espiritu” ay malamang na tumutukoy sa Banal na Espiritu.
  alternative: Maaaring basahing “espiritu” bilang pangkalahatang espirituwal na prinsipyo o espiritu ng tao.
  rationale: Ang may artikulong anyo at ang konteksto ng Ebanghelyo ni Juan ay pumapabor sa Banal na Espiritu bilang nagbibigay-buhay, ngunit hindi lubos na inaalis ng salitang Griyego ang ibang pagbasa.
- issue: Kahulugan ng σὰρξ sa pagsalungat sa Espiritu
  choice: Pinanatili ang “laman” bilang malawak at hindi sobrang tinukoy na termino.
  alternative: “Makasalanang kalikasan,” “katawan,” o “pawang kakayahang pantao.”
  rationale: Iniiwasang ipasok ang isang tiyak na sistemang teolohikal o antropolohikal na hindi tahasang hinihingi ng talata.
- issue: Lakas ng panaguri sa πνεῦμά ἐστιν sa huling sugnay
  choice: Kwalitatibong “ay espiritu.”
  alternative: “Ay Espiritu” o “ay espirituwal at nagbibigay-buhay.”
  rationale: Ang panaguring walang artikulo ay angkop unawain bilang kwalitatibo. Pinananatili ng salin ang maigsi at matinding pahayag nang hindi ito labis na binibigyang-kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinili ang “nagbibigay-buhay” at “walang anumang pakinabang” bilang natural ngunit malapit sa anyo ng Griyego. Ginamit ang malaking titik sa unang “Espiritu” para sa malamang na pagtukoy sa Banal na Espiritu, at maliit na titik sa “espiritu” sa huling sugnay upang mapanatili ang kwalitatibong diwa at tunay na kalabuan.
