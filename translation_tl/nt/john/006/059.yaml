  text: He said these things while teaching in the synagogue in Capernaum.
translation:
  language: tl
  text: Sinabi niya ang mga bagay na ito habang nagtuturo sa sinagoga sa Capernaum.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: ang mga bagay na ito
  rationale: Pinananatili nito ang maramihang anyo ng panghalip at tumutukoy sa kabuuan ng mga naunang sinabi, sa halip na paliitin iyon sa iisang pahayag.
- source_word: εἶπεν
  choice: Sinabi niya
  rationale: Tuwirang isinasalin ang aorist ng λέγω. Hindi na idinagdag ang pangalang Jesus sapagkat ipinahihiwatig lamang ang simuno sa Griyego at malinaw ito sa konteksto.
- source_word: ἐν συναγωγῇ
  choice: sa sinagoga
  rationale: Natural na lokatibong salin sa Tagalog; bagaman walang artikulo sa Griyego, maaaring tumukoy ang parirala sa kilalang lokal na sinagoga sa konteksto.
- source_word: διδάσκων
  choice: habang nagtuturo
  rationale: Ipinakikita nito na kasabay ng pagsasalita ang nagpapatuloy na gawain ng pagtuturo.
- source_word: ἐν Καφαρναούμ
  choice: sa Capernaum
  rationale: Karaniwang lokatibong anyo sa Tagalog at pinananatili ang kinagawiang transliterasyon ng pangalan ng lugar.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “sinagoga” bilang pamilyar na terminong biblikal at ang “Capernaum” bilang karaniwang baybay ng pangalan ng lugar.
