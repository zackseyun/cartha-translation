  source_fidelity: 'Tumpak ang salin sa lahat ng pangunahing bahagi: ang maramihang ταῦτα ay naipahayag bilang “ang mga bagay na ito”; ang di-tahasang simuno ng εἶπεν ay pinanatiling “niya”; at ang kasabay na kilos ng διδάσκων ay maayos na naipahayag sa “habang nagtuturo.” Ang lokasyon ay wastong inilapat sa sinagoga sa Capernaum.'
  naturalness: Malinaw, gramatikal, at angkop sa modernong Filipino Tagalog ang pangungusap. Ang “ang mga bagay na ito” ay bahagyang mas pormal kaysa “ang mga ito,” ngunit ito ay natural pa rin at kapaki-pakinabang na pinananatili ang maramihang saklaw ng Griyego.
