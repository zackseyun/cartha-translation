base_translation:
  language: en
  yaml_path: translation/nt/john/006/057.yaml
  text: Just as the living Father sent me[a], and I live because of the Father[b], so also the one who feeds on me will live because of me.
translation:
  language: tl
  text: Kung paanong isinugo ako ng Amang buháy at nabubuhay ako dahil sa Ama, gayundin ang kumakain sa akin[a] ay mabubuhay dahil sa akin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pandiwang Griyego ay matingkad at kongkreto, at literal na tumutukoy sa pagkain o pagnguya.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin ang “dahil sa Ama” at “dahil sa akin” bilang “sa pamamagitan ng Ama” at “sa pamamagitan ko.” Ang pang-ukol na Griyego ay maaaring magpahayag ng sanhi o ng paraan; causal ang ginamit sa pangunahing teksto upang mapanatili ang paralelismo ng Ama at Anak, at ng Anak at kumakain sa kanya.
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς
  choice: Kung paanong ... gayundin
  rationale: Malinaw at likas na ipinahahayag sa Tagalog ang paghahambing na sumasaklaw sa buong pangungusap.
- source_word: ὁ ζῶν πατὴρ
  choice: ang Amang buháy
  rationale: Tuwirang pinananatili ang attributive na ζῶν at ang diin ng Juan sa buhay, nang hindi ito pinalalawak bilang “nagbibigay-buhay.”
- source_word: ἀπέστειλέν με
  choice: isinugo ako
  rationale: Ang simpleng nagdaang kilos ay angkop sa aorist; natural din ang “isinugo” sa konteksto ng pagpapadala ng Ama kay Jesus.
- source_word: κἀγὼ ζῶ
  choice: at nabubuhay ako
  rationale: Pinananatili ang pangkasalukuyang pandiwa at ang pagkakatulad nito sa “mabubuhay.”
- source_word: διὰ τὸν πατέρα
  choice: dahil sa Ama
  rationale: Ang διά na may accusative ay likas na nagpapahayag dito ng sanhi o batayan; pinananatili rin nito ang paralelismo sa δι’ ἐμέ.
- source_word: ὁ τρώγων με
  choice: ang kumakain sa akin
  rationale: Pinananatili ang kongkreto at matingkad na kilos ng τρώγω nang hindi ipinapasok ang isang partikular na sakramental o metaporikal na paliwanag.
- source_word: κἀκεῖνος
  choice: gayundin, ang ... ay
  rationale: Naipapakita ng “gayundin” ang emphatic na “siya rin/ang taong iyon din” sa likas na ayos ng Tagalog.
- source_word: ζήσει
  choice: mabubuhay
  rationale: Tuwirang pinananatili ang future indicative at ang verbal na paralelismo sa “nabubuhay ako.”
- source_word: δι’ ἐμέ
  choice: dahil sa akin
  rationale: Ang causal na pagbasa ay likas sa διά na may accusative at itinatampok ang paralelismo sa “dahil sa Ama”; inilalahad sa talababa ang posibleng instrumental na pagbasa.
theological_decisions:
- issue: Ang kaugnayan ng buhay ng Anak sa Ama sa διὰ τὸν πατέρα
  choice: “nabubuhay ako dahil sa Ama”
  alternative: “nabubuhay ako sa pamamagitan ng Ama”
  rationale: Pinananatili ang pinaka-likas na causal na diwa ng διά + accusative at ang paghahambing sa buhay ng mananampalataya, nang hindi humuhugot ng konklusyon tungkol sa ontolohikal na pagiging mababa ng Anak.
- issue: Sakramental o mas malawak na metaporikal na puwersa ng ὁ τρώγων με
  choice: “ang kumakain sa akin”
  alternative: “ang kumakain mula sa akin” o isang paliwanag na gaya ng “nakikibahagi sa akin”
  rationale: Ang kongkretong pandiwa ng Griyego ay pinananatili, habang hindi ipinipilit ng salin ang alinman sa eksklusibong Eukaristikong pagbasa o purong metaporikal na pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Amang buháy” upang maiwasan ang kalituhan ng “buhay” bilang pangngalan; nilagyan ng tuldik ang “buháy” para sa wastong bigkas. Ang “kumakain sa akin” ay sadyang tuwiran upang mapanatili ang matapang na larawan ng orihinal.
