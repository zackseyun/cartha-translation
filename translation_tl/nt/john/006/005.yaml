  to: Kaya, tumingala si Jesus at, nang makita niyang papalapit sa kanya ang isang malaking pulutong[a], sinabi niya kay Felipe, “Saan[b] tayo bibili ng tinapay[c] upang makakain ang mga taong ito?”
