id: JHN.6.5
reference: John 6:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐπάρας οὖν ⸂τοὺς ὀφθαλμοὺς ὁ Ἰησοῦς⸃ καὶ θεασάμενος ὅτι πολὺς ὄχλος ἔρχεται πρὸς αὐτὸν λέγει ⸀πρὸς Φίλιππον· Πόθεν ⸀ἀγοράσωμεν ἄρτους ἵνα φάγωσιν οὗτοι;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/005.yaml
  text: So Jesus[a], lifting up his eyes and seeing that a large crowd was coming toward him, said to Philip[c][b], “Where are we to buy bread so that these may eat?”
translation:
  language: tl
  text: Kaya, tumingala si Jesus at, nang makita niyang papalapit sa kanya ang isang malaking pulutong[a], sinabi niya kay Felipe, “Saan[b] tayo bibili ng tinapay[c] upang makakain ang mga taong ito?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “napakaraming tao.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “Mula saan tayo bibili …?”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “mga tinapay.” Ang salitang Griyego ay maaaring tumukoy sa tinapay sa pangkalahatan o sa mga indibiduwal na bilog ng tinapay.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπάρας ... τοὺς ὀφθαλμούς
  choice: nang tumingala
  rationale: Ang literal na idyomang Griyego ay ‘itinaas ang mga mata.’ Ang ‘tumingala’ ang natural na katumbas sa modernong Tagalog at pinananatili ang kilos nang hindi nagiging matigas ang pangungusap.
- source_word: οὖν
  choice: Kaya
  rationale: Pinananatili nito ang pang-ugnay na nagpapakita ng pagpapatuloy o bunga sa salaysay.
- source_word: θεασάμενος
  choice: makitang
  rationale: Ipinahihiwatig ng pandiwa ang aktuwal at mapagmasid na pagkakita; malinaw at maikli ang ‘makita’ sa konteksto.
- source_word: πολὺς ὄχλος
  choice: isang malaking pulutong
  rationale: Tumpak nitong ipinapahayag ang napakaraming taong nagkakatipon, habang nananatiling marangal at madaling maunawaan.
- source_word: ἔρχεται πρὸς αὐτόν
  choice: ang papalapit sa kanya
  rationale: Ipinakikita ng ‘papalapit’ ang nagpapatuloy at may-direksiyong kilos ng kasalukuyang pandiwa at ng πρός.
- source_word: λέγει πρὸς Φίλιππον
  choice: sinabi niya kay Felipe
  rationale: Isinalin sa nakaraang panahunan ang historical present upang maging natural ang daloy ng salaysay sa Tagalog.
- source_word: Πόθεν
  choice: Saan
  rationale: Bagaman literal na ‘mula saan,’ ang ‘Saan tayo bibili’ ang natural na tanong sa Tagalog tungkol sa mapagbibilhan.
- source_word: ἀγοράσωμεν
  choice: tayo bibili
  rationale: Pinananatili ang unang panauhang maramihan at ang deliberatibong tanong ng aorist subjunctive.
- source_word: ἄρτους
  choice: tinapay
  rationale: Maaaring tumukoy ang ἄρτος sa tinapay bilang pagkain o sa mga piraso/bilog na tinapay; ang di-mabilang na ‘tinapay’ ang pinakanatural dito.
- source_word: ἵνα φάγωσιν οὗτοι
  choice: upang makakain ang mga taong ito
  rationale: Malinaw na ipinahahayag ng ‘upang’ ang layunin ng ἵνα, at ginagawang likas sa Tagalog ang demonstratibong οὗτοι.
theological_decisions:
- issue: Ayos ng mga pandiwari at historical present sa salaysay
  choice: Ginawang natural na sugnay ang mga pandiwari (‘nang tumingala… at makitang…’) at isinalin ang λέγει bilang ‘sinabi.’
  alternative: 'Mas pormal: ‘Kaya, itinaas ni Jesus ang kanyang mga mata at, nang makita niyang… ay nagsabi siya…’'
  rationale: Usaping pang-estilo at hindi pangdoktrina ito. Pinananatili ng napiling anyo ang pagkakasunod-sunod ng mga kilos habang natural na binabasa sa modernong Tagalog.
- issue: Lakas ng layuning ipinahahayag ng ἵνα
  choice: upang makakain
  alternative: para makakain
  rationale: Parehong nagpapahayag ng layunin, ngunit ang ‘upang’ ay bahagyang mas marangal at angkop sa register ng salin nang hindi nagdaragdag ng katiyakan o teolohikal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang ‘Felipe,’ ang karaniwang anyong Tagalog ng pangalan, at iniwasan ang sobrang literal na ‘itinaas ang kanyang mga mata,’ na matigas pakinggan sa kasalukuyang gamit.
