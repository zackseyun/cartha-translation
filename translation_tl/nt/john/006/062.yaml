id: JHN.6.62
reference: John 6:62
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐὰν οὖν θεωρῆτε τὸν υἱὸν τοῦ ἀνθρώπου ἀναβαίνοντα ὅπου ἦν τὸ πρότερον;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/062.yaml
  text: Then what if you were to see the Son of Man ascending to where he was before?[a]
translation:
  language: tl
  text: Kung gayon, paano kung makita ninyong umaakyat ang Anak ng Tao sa kinaroroonan niya noong una?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kung gayon, kung makita ninyong umaakyat ang Anak ng Tao sa kinaroroonan niya noong una…” Ang Griyego ay isang retorikal na kondisyunal na tanong.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Kung gayon, paano kung
  rationale: Likas itong paraan sa modernong Tagalog upang maipahayag ang inferensiyal na puwersa ng οὖν at ang retorikal na kondisyon ng ἐὰν, kaugnay ng naunang pagkatisod sa sinabi ni Jesus.
- source_word: θεωρῆτε
  choice: makita ninyo
  rationale: Ipinahihiwatig ng θεωρέω ang aktuwal at maaaring masusing pagkakita; sa kondisyunal na pangungusap, malinaw at natural ang “makita ninyo” nang hindi dinaragdagan ang kahulugan.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Pinananatili ang kinikilalang pantawag ni Jesus sa sarili at ang mga kaugnay nitong alusyon sa Daniel at mesiyanikong kahulugan.
- source_word: ἀναβαίνοντα
  choice: umaakyat
  rationale: Tuwirang ipinapahayag ang pataas na pagkilos. Mas natural ito sa kasalukuyang Tagalog kaysa “pumapailanlang” o “umaahon,” habang bukas pa rin sa makalangit na diwa ng konteksto.
- source_word: ὅπου ἦν τὸ πρότερον
  choice: sa kinaroroonan niya noong una
  rationale: Pinananatili nito kapwa ang pahiwatig ng dating kinaroroonan at ang temporal na prayoridad ng τὸ πρότερον, nang hindi tahasang idinaragdag ang “langit” o “Ama.”
theological_decisions:
- issue: Kung tahasang ipaliliwanag ang pag-akyat bilang pagbabalik ni Jesus sa langit o sa Ama at bilang pahayag ng pag-iral niya bago naging tao
  choice: sa kinaroroonan niya noong una
  alternative: sa langit, kung saan siya naroon noong una; pabalik sa Ama, kung saan siya naroon noong una
  rationale: Malakas na ipinahihiwatig ng Griyego ang dati niyang pag-iral at kinaroroonan, ngunit hindi tahasang binabanggit sa talata ang langit o ang Ama. Kaya pinananatili ang pahiwatig at bigat na Kristolohikal nang walang idinagdag na interpretasyon.
- issue: Kung gagawing tahasang tanong ang hindi kumpletong kondisyunal na anyo sa Griyego
  choice: paano kung
  alternative: kung gayon, kung makita ninyo…
  rationale: Ang Griyego ay retorikal na kondisyunal na tanong na hindi tahasang nagsasaad ng pangunahing sugnay. Ang “paano kung” ay likas na Tagalog na nagpapanatili sa bukas at retorikal na puwersa nito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “kinaroroonan” upang ipahayag ang dating lokasyon nang hindi nagdaragdag ng hindi tahasang binanggit sa Griyego; pinanatili rin ang tradisyonal at makabuluhang titulong “Anak ng Tao.”
