id: JHN.6.12
reference: John 6:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὡς δὲ ἐνεπλήσθησαν λέγει τοῖς μαθηταῖς αὐτοῦ· Συναγάγετε τὰ περισσεύσαντα κλάσματα, ἵνα μή τι ἀπόληται.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/012.yaml
  text: And when they were filled[a], he says to his disciples, “Gather up the leftover pieces[d][c][b], so that nothing may be lost.”
translation:
  language: tl
  text: Nang mabusog na sila[a], sinabi[b] niya sa kanyang mga alagad, “Tipunin ninyo ang mga pirasong natira[c], upang walang anumang mawala[d].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mapunô sila” o “makakain sila hanggang mabusog.”
    reason: lexical_alternative
  - marker: b
    text: 'Sa Griego, nasa pangkasalukuyang panahunan ang pandiwa: “sinasabi niya.” Isa itong pangkasalukuyang anyo na ginagamit sa pagsasalaysay ng nakaraan.'
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “mga tipak na natira.”
    reason: lexical_alternative
  - marker: d
    text: Maaari ring “upang walang anumang masayang.” Mas literal sa Griego ang “upang walang anumang mawala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Nang … na
  rationale: Likas na ipinahahayag sa Tagalog ang temporal na ugnayan at banayad na pagpapatuloy ng salaysay nang hindi labis na isinasalin ang δέ.
- source_word: ἐνεπλήσθησαν
  choice: mabusog na sila
  rationale: Sa konteksto ng pagkain, malinaw at natural na ipinahahayag ng “mabusog” ang pagiging punô o nasiyahan sa pagkain.
- source_word: λέγει
  choice: sinabi
  rationale: Ginamit ang karaniwang nakaraang panahunan sa salaysay na Tagalog; ipinaliliwanag sa talababa na historical present ang anyong Griego.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: sa kanyang mga alagad
  rationale: Ang “mga alagad” ang tiyak at nakaugaliang katumbas ng μαθηταί sa mga Ebanghelyo.
- source_word: Συναγάγετε
  choice: Tipunin ninyo
  rationale: Tuwiran at marangal na pautos ito para sa sama-samang pagkuha ng mga natirang pagkain.
- source_word: τὰ περισσεύσαντα κλάσματα
  choice: ang mga pirasong natira
  rationale: Pinagsasama nito nang natural ang diwa ng mga piraso o tipak at ng mga natira matapos kumain, nang hindi nagdaragdag ng salitang “tinapay” na hindi tahasang narito.
- source_word: ἵνα μή τι ἀπόληται
  choice: upang walang anumang mawala
  rationale: Malapit ito sa anyo at saklaw ng Griego at pinananatili ang salitang “mawala” sa halip na agad itong pakahulugang “masayang.”
theological_decisions:
- issue: Posibleng teolohikal na alingawngaw ng ἀπόληται sa konteksto ng tanda
  choice: “mawala” sa agarang diwa ng mga natirang piraso
  alternative: “masayang” bilang praktikal na pagpapakahulugan, o “mapahamak” na maaaring magbigay ng mas tahasang teolohikal na himig
  rationale: Ang tuwirang tinutukoy ay ang natirang pagkain. Gayunman, pinananatili ng “mawala” ang mas malawak na leksikal na alingawngaw ng salita sa Juan nang hindi ipinipilit ang soteriolohikal na pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mabusog” at “mga pirasong natira” bilang mga karaniwang pariralang madaling maunawaan, samantalang pinanatili ng “walang anumang mawala” ang bahagyang pormal at masinsing himig ng orihinal.
