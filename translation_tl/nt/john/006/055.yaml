id: JHN.6.55
reference: John 6:55
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἡ γὰρ σάρξ μου ⸀ἀληθής ἐστι βρῶσις, καὶ τὸ αἷμά μου ⸁ἀληθής ἐστι πόσις.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/055.yaml
  text: For my flesh is true food[a], and my blood is true drink.
translation:
  language: tl
  text: Sapagkat ang aking laman ay tunay na pagkain,[a] at ang aking dugo ay tunay na inumin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “totoong pagkain” at “totoong inumin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na kaugnayan ng talata sa naunang pahayag, sa likas at marangal na Tagalog.
- source_word: σάρξ
  choice: laman
  rationale: Tuwirang salin na nagpapanatili sa magkatambal na “laman” at “dugo,” nang hindi ito binibigyang-kahulugang “katawan.”
- source_word: ἀληθής
  choice: tunay
  rationale: Pinananatili ang tuwirang diwa ng ‘true/genuine’ at ang bigat nito sa pananalita ni Juan, nang hindi nilulutas ang usaping teolohikal sa pamamagitan ng mas interpretatibong salita.
- source_word: βρῶσις
  choice: pagkain
  rationale: Sa panaguring kayarian at sa pagkakatulad nito sa πόσις, tumutukoy ito sa kinakain, hindi sa gawa ng pagkain.
- source_word: αἷμα
  choice: dugo
  rationale: Literal at likas na salin na nagpapanatili sa malinaw na pagtutumbas ng laman at dugo.
- source_word: πόσις
  choice: inumin
  rationale: Likas na katambal ng ‘pagkain’ at tumutukoy rito sa iniinom, hindi sa gawa ng pag-inom.
theological_decisions:
- issue: Kung isasalin ang ἀληθής bilang “tunay” o bilang mas interpretatibong “totoo/real” sa kontekstong may kaugnayan sa Eukaristiya
  choice: tunay
  alternative: totoong pagkain at totoong inumin
  rationale: Ang ‘tunay’ ay malapit sa salitang Griyego at nagpapanatili sa teolohikal na tensiyon ng talata nang hindi ipinapasya ang mga pagtatalong sakramental.
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Ginamit ang ‘Sapagkat’ upang ipakita ang paliwanag na ugnayan, at pinanatili ang literal na pares na ‘laman’ at ‘dugo.’
