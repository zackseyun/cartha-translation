id: JHN.6.54
reference: John 6:54
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ τρώγων μου τὴν σάρκα καὶ πίνων μου τὸ αἷμα ἔχει ζωὴν αἰώνιον, κἀγὼ ἀναστήσω αὐτὸν τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/054.yaml
  text: The one who eats my flesh and drinks my blood has eternal life[b][a], and I will raise him up on the last day.
translation:
  language: tl
  text: Ang kumakain[a] ng aking laman at umiinom ng aking dugo ay may buhay na walang hanggan, at ibabangon ko siya[b] sa huling araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang patuloy na kumakain” o, sa mas matingkad na pananalita, “ang ngumunguya.” Mas kongkreto ang pandiwang Griyego na τρώγω kaysa sa pangkalahatang salita para sa pagkain.
    reason: lexical_alternative
  - marker: b
    text: O “muli ko siyang bubuhayin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ τρώγων
  choice: Ang kumakain
  rationale: Ang artikulo at pangkasalukuyang participle ay tumutukoy sa isang taong kinikilala sa patuloy o karaniwang gawaing ito. Likas sa Tagalog ang “ang kumakain” at napapanatili nito ang isahang pagtukoy.
- source_word: τρώγων
  choice: kumakain
  rationale: Mas kongkreto ang τρώγω kaysa sa pangkalahatang pandiwa para sa pagkain at maaari itong magpahiwatig ng pagnguya. Gayunman, “kumakain” ang pinakamalinaw at likas na salin; inilagay sa talababa ang mas matingkad na kahulugan.
- source_word: μου τὴν σάρκα
  choice: ng aking laman
  rationale: Kongkreto rito ang σάρξ. Pinananatili ng “laman” ang literal na pananalita nang hindi ito ipinapakahulugang “katawan” o “makasalanang kalikasan.”
- source_word: καὶ πίνων μου τὸ αἷμα
  choice: at umiinom ng aking dugo
  rationale: Pinananatili ang kaagapay na pangkasalukuyang kilos at ang literal, hindi pinalambot na salitang “dugo.”
- source_word: ἔχει
  choice: ay may
  rationale: Tuwirang ipinahahayag ng pangkasalukuyang anyo na taglay na ngayon ng taong iyon ang buhay na walang hanggan.
- source_word: ζωὴν αἰώνιον
  choice: buhay na walang hanggan
  rationale: Ito ang malinaw, likas, at nakagawiang salin sa kontekstong Juaniko, na nagpapahiwatig kapwa ng di-matapusang tagal at ng uri ng buhay na mula sa Diyos.
- source_word: κἀγὼ
  choice: at ... ko
  rationale: Ang crasis ay καὶ ἐγώ. Sa Tagalog, likas na naipahahayag ang unang panauhang paksa sa panghalip na “ko” sa pandiwang pokus sa layon.
- source_word: ἀναστήσω
  choice: ibabangon
  rationale: Pinananatili ng “ibabangon” ang larawan ng pagbabangon at malinaw sa konteksto ang pahiwatig ng muling pagkabuhay, nang hindi ito labis na ipinapaliwanag sa pangunahing teksto.
- source_word: αὐτὸν
  choice: siya
  rationale: Tumutukoy ang isahang panghalip sa isahang taong inilalarawan ng “ang kumakain.” Likas sa Tagalog ang “siya” at hindi nito kailangang tukuyin ang kasarian.
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: sa huling araw
  rationale: Ito ang likas at nakagawiang Tagalog para sa eskatolohikal na pariralang ginagamit sa Juan.
theological_decisions:
- issue: Kung bibigyan ng tahasang sakramental o metaporikal na paliwanag ang pagkain at pag-inom
  choice: Pinanatili ang literal na pananalitang “kumakain,” “laman,” “umiinom,” at “dugo.”
  alternative: Tahasan itong isalin bilang pakikibahagi sa Eukaristiya o bilang pagsampalataya kay Jesus.
  rationale: Kongkreto ang mga salita ng Griyego ngunit hindi mismo nilulutas ng talata kung paano eksaktong dapat unawain ang mga ito. Pinananatili ng salin ang teolohikal na tensiyon at iniiwasang magpasok ng denominasyonal na paliwanag.
- issue: Kung ipaliliwanag ang ἀναστήσω bilang muling pagkabuhay sa pangunahing teksto
  choice: ibabangon ko siya
  alternative: muli ko siyang bubuhayin
  rationale: Tama sa konteksto ang muling pagkabuhay, ngunit mas malapit sa larawan ng Griyego ang “ibabangon” at hindi nito pinapalawak nang higit sa kailangan ang pananalita.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang kongkretong “laman” at “dugo,” ang isahang pagtukoy, at ang kasalukuyang pag-aangkin ng buhay na walang hanggan. Iniwasan ang teknikal o denominasyonal na pagpapaliwanag sa pangunahing teksto.
