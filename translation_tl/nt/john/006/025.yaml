  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “Rabbi” upang mapanatili ang kontekstong Judio. Pinili ang “lawa” bilang karaniwang katawagan sa anyong-tubig na tinutukoy sa salaysay.
