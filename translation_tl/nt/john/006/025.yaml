base_translation:
  language: en
  yaml_path: translation/nt/john/006/025.yaml
  text: And when they found him on the other side of the sea[a], they said to him, “Rabbi, when did you get here?”
translation:
  language: tl
  text: At nang matagpuan nila siya sa kabilang panig ng lawa, sinabi nila sa kanya, “Rabbi, kailan ka nakarating dito?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, “kailan ka naparito?” Ang perpektong pandiwang Griyego ay maaari ring isalin nang mas pormal sa ganitong paraan, ngunit ang diwa nito sa konteksto ay pagdating: “kailan ka nakarating dito?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ εὑρόντες αὐτόν
  choice: At nang matagpuan nila siya
  rationale: Ang aorist participle ay likas na isinalin bilang sugnay na panahunan; pinananatili ng “nang matagpuan” ang pagkakasunod ng mga pangyayari nang hindi matigas ang Tagalog.
- source_word: πέραν τῆς θαλάσσης
  choice: sa kabilang ibayo ng lawa
  rationale: Ipinahihiwatig ng πέραν na nasa kabilang panig sila. Ang “lawa” ay natural sa konteksto ng Lawa ng Galilea, samantalang pinananatili ng “kabilang ibayo” ang heograpikong paghahambing.
- source_word: εἶπον αὐτῷ
  choice: sinabi nila sa kanya
  rationale: Malapit ito sa payak na kahulugan ng λέγω. Bagaman tanong ang sumunod na pangungusap, hindi kailangang gawing mas interpretatibong “tinanong nila siya.”
- source_word: Ῥαββί
  choice: Rabbi
  rationale: Pinananatili ang transliteradong katawagang Judio at ang tiyak na karangalang taglay nito, sa halip na ipakahulugang “Guro.”
- source_word: πότε ὧδε γέγονας
  choice: kailan ka nakarating dito?
  rationale: Sa konteksto, ang perfect ng γίνομαι ay tumutukoy sa pagdating at kasalukuyang pagkanaroon. Ang “nakarating” ay likas na Filipino at naihahayag ang resultang pagdating nang hindi isinasalin nang literal bilang “naging.”
