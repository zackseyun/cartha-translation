  text: καὶ ἐμβάντες ⸀εἰς πλοῖον ἤρχοντο πέραν τῆς θαλάσσης εἰς Καφαρναούμ. καὶ σκοτία ἤδη ἐγεγόνει καὶ ⸀οὔπω ἐληλύθει πρὸς αὐτοὺς ὁ Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/017.yaml
  text: They got into a boat and were heading across the sea to Capernaum[a]. And it had already become dark[c][b], and Jesus had not yet come to them.
translation:
  language: tl
  text: Sumakay sila sa isang bangka at tumatawid sila sa dagat patungong Capernaum.[a] Madilim na noon,[b] at hindi pa dumarating sa kanila si Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “patungo sa kabilang panig ng dagat.”
    reason: lexical_alternative
  - marker: b
    text: O “Dumilim na noon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβάντες εἰς πλοῖον
  choice: Sumakay sila sa isang bangka
  rationale: Ginawang sugnay na may pandiwang nasa aspektong naganap ang aorist participle upang maging natural sa Tagalog habang pinananatili ang pagkakasunod ng mga pangyayari. Ang πλοῖον ay “bangka,” ang angkop na karaniwang tawag sa sasakyang-tubig sa tagpo.
- source_word: ἤρχοντο
  choice: naglalayag
  rationale: Ipinahihiwatig ng imperpektong anyo ang patuloy na pagkilos. Ang “naglalayag” ay natural na paglalarawan ng kanilang kasalukuyang pagtawid sakay ng bangka.
- source_word: πέραν τῆς θαλάσσης
  choice: patawid ng lawa
  rationale: Ang πέραν na may genitive ay tumutukoy sa pagtawid o pagpunta sa kabilang ibayo. “Lawa” ang natural at heograpikong malinaw na katawagan sa Dagat ng Galilea sa modernong Tagalog, nang hindi binabago ang tinutukoy na anyong-tubig.
- source_word: εἰς Καφαρναούμ
  choice: patungong Capernaum
  rationale: Ipinapahayag ng εἰς ang direksiyon o destinasyon; ginamit ang karaniwang baybay na “Capernaum.”
- source_word: σκοτία ἤδη ἐγεγόνει
  choice: Madilim na noon
  rationale: Natural itong Tagalog para sa kalagayang bunga ng naunang pagdilim. Ang “na” at “noon” ay naghahatid ng naunang pagbabago at panahong tinutukoy ng pluperfect.
- source_word: οὔπω ἐληλύθει πρὸς αὐτοὺς
  choice: hindi pa pumupunta sa kanila
  rationale: Pinananatili nito ang οὔπω at ang tuwirang diwa ng πρὸς αὐτούς. Ang anyong “pumupunta” ay angkop sa puntodebista ng mga alagad at hindi nagpapakahulugang sumama na si Jesus sa kanila.
- source_word: ὁ Ἰησοῦς
  choice: si Jesus
  rationale: Karaniwang anyo ng pangalan sa modernong Filipino, na may pantukoy na “si” para sa personal na pangalan.
theological_decisions:
- issue: Aspekto ng salaysay at pagkakasunod-sunod sa panahon
  choice: Inilahad na sumakay muna sila at kasalukuyan silang naglalayag, samantalang madilim na at hindi pa pumupunta sa kanila si Jesus.
  alternative: 'Maaaring gawing payak na naganap ang buong kilos: “tumawid sila,” o gawing “dumilim na” ang σκοτία ἤδη ἐγεγόνει.'
  rationale: Pinananatili ng salin ang patuloy na kilos ng imperfect at ang kalagayang bunga ng naunang pagdilim, kaya nananatili ang tensiyon ng salaysay bago lumapit si Jesus sa mga sumunod na talata. Walang idinaragdag na doktrinal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “naglalayag” upang mapanatili ang patuloy na kilos, at “lawa” bilang karaniwang heograpikong tawag sa anyong-tubig, habang ang talang [a] ay nagpapanatili sa posibleng diin ng πέραν sa kabilang ibayo.
