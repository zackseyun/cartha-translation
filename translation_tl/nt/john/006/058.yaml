  naturalness: Ang binagong paghahambing ay mas likas at hindi lumilikha ng bahagyang alanganing ugnayan sa “hindi tulad ng kinain.” Ang rehistro ay nananatiling malinaw at marangal para sa modernong Filipino Tagalog.
  terminology: Ang “mga ninuno” ay natural na modernong Tagalog para sa οἱ πατέρες sa makasaysayang kontekstong ito, bagaman mas malawak ito kaysa sa panlalaking anyo ng Griyego. Hindi nito ipinapataw ang anumang doktrinal na pagbasa. Ang “kumakain” ay angkop na neutral na salin ng τρώγων.
