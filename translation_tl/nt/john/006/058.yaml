base_translation:
  language: en
  yaml_path: translation/nt/john/006/058.yaml
  text: This is the bread that came down from heaven[a], not as the fathers ate and died[b]; the one who eats this bread will live forever.
translation:
  language: tl
  text: Ito ang tinapay na bumaba mula sa langit. Hindi ito gaya ng tinapay na kinain ng mga ninuno at namatay sila. Ang kumakain ng tinapay na ito ay mabubuhay magpakailanman.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa literal, “mabubuhay hanggang sa kapanahunan,” isang idyomang nangangahulugang mabubuhay magpakailanman.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός ἐστιν ὁ ἄρτος
  choice: Ito ang tinapay
  rationale: Natural at tuwirang Tagalog para sa demonstrative-copula construction, habang pinananatili ang tiyak na tinapay na tinutukoy sa diskurso.
- source_word: ὁ ἐξ οὐρανοῦ καταβάς
  choice: na bumaba mula sa langit
  rationale: Ginawang likas na sugnay na panuring ang aorist participle; pinananatili ng “mula sa langit” ang ἐξ οὐρανοῦ.
- source_word: οὐ καθὼς ἔφαγον οἱ πατέρες καὶ ἀπέθανον
  choice: hindi tulad ng kinain ng mga ninuno ninyo, na namatay
  rationale: Ipinapahayag nang malinaw sa Tagalog ang paghahambing. Ang “mga ninuno ninyo” ay angkop sa konteksto ng mga ninuno ng mga kausap na kumain ng manna; ang “na namatay” ay nagpapanatili sa kasunod na kinalabasan.
- source_word: ὁ τρώγων τοῦτον τὸν ἄρτον
  choice: Ang kumakain ng tinapay na ito
  rationale: Pinananatili ang generic at nagpapatuloy na diwa ng present participle nang hindi pinalalabis ang mas grapikong posibleng kahulugan ng τρώγω.
- source_word: ζήσει εἰς τὸν αἰῶνα
  choice: ay mabubuhay magpakailanman
  rationale: Likas na Tagalog para sa idyomang Johannine na literal na tumutukoy sa pamumuhay “hanggang sa kapanahunan,” na may diwang walang hanggan.
theological_decisions:
- issue: Pagkakakilanlan ng οἱ πατέρες sa paghahambing tungkol sa tinapay sa ilang
  choice: mga ninuno ninyo
  alternative: mga ama
  rationale: Sa konteksto, tumutukoy ito sa mga ninuno ng Israel na kumain ng manna. Mas likas at malinaw sa modernong Tagalog ang “mga ninuno” kaysa literal na “mga ama,” nang hindi binabago ang makasaysayang tinutukoy.
- issue: Diwa ng τρώγων sa diskurso tungkol sa tinapay ng buhay
  choice: kumakain
  alternative: ngumunguya / nakikibahagi
  rationale: Ang neutral na “kumakain” ay pinakamalapit sa leksikal na diwa at hindi nagpapasya sa pagitan ng sakramental at metaporikal na pagbasa.
- issue: Diwa ng εἰς τὸν αἰῶνα
  choice: magpakailanman
  alternative: hanggang sa kapanahunan
  rationale: Ang “magpakailanman” ang natural na pagpapahayag ng idyoma sa Tagalog, habang inilalahad sa talababa ang mas literal na anyo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Gumamit ng em dash upang linawin ang paghahambing, at iniwasan ang terminolohiyang maaaring magtakda ng isang partikular na doktrinang sakramental.
