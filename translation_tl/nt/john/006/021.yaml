  text: ἤθελον οὖν λαβεῖν αὐτὸν εἰς τὸ πλοῖον, καὶ εὐθέως ⸂ἐγένετο τὸ πλοῖον⸃ ἐπὶ τῆς γῆς εἰς ἣν ὑπῆγον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/021.yaml
  text: So they were willing to take him into the boat[a], and immediately the boat was at the land to which they were going.
translation:
  language: tl
  text: Kaya handa na nilang isakay siya sa bangka, at kaagad na nasa lupain na kanilang tinutungo ang bangka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “kaagad na nakarating ang bangka sa pampang na kanilang tinutungo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤθελον
  choice: handa sila
  rationale: Ipinahahayag ng imperpektong anyo ng θέλω ang kanilang kahandaan o kusang-loob na pagtanggap matapos mawala ang kanilang takot; mas angkop ito rito kaysa sa simpleng “nais nila.”
- source_word: οὖν
  choice: Kaya
  rationale: Ipinakikita ng οὖν ang bunga o lohikal na kaugnayan sa naunang pangyayari, at natural ang “Kaya” sa makabagong Tagalog.
- source_word: λαβεῖν αὐτὸν εἰς τὸ πλοῖον
  choice: tanggapin siya sa bangka
  rationale: Maaaring mangahulugan ang λαμβάνω na “kunin” o “tanggapin.” Sa konteksto ng pagpapasakay kay Jesus, malinaw at natural ang “tanggapin siya sa bangka.”
- source_word: πλοῖον
  choice: bangka
  rationale: Ang “bangka” ang karaniwang tawag sa sasakyang pantubig na angkop sa tagpo sa Lawa ng Galilea; magiging labis na malaki ang ipinahihiwatig ng “barko.”
- source_word: εὐθέως
  choice: kaagad
  rationale: Pinananatili ng “kaagad” ang biglaan at posibleng mahimalang dating ng εὐθέως.
- source_word: ἐγένετο τὸ πλοῖον ἐπὶ τῆς γῆς
  choice: nasa lupang ... ang bangka
  rationale: Ang γίνομαι na may pahayag ng kinaroroonan ay maaaring tumukoy sa pagdating o pagkalagay sa isang lugar. Pinananatili ng “nasa lupa” ang payak at biglaang paglalahad nang hindi ipinahihiwatig na sumadsad ang bangka.
- source_word: γῆς
  choice: lupa
  rationale: Ang γῆ ay maaaring mangahulugang lupa, lupain, o pampang. Ang “lupa” ang mas malapit na katumbas, samantalang inilalahad sa talababa ang kontekstuwal na “pampang.”
- source_word: εἰς ἣν ὑπῆγον
  choice: patutunguhan nila
  rationale: Natural na ipinahahayag ng “patutunguhan nila” ang patuloy nilang paglalakbay tungo sa destinasyong tinutukoy ng relatibong parirala.
theological_decisions:
- issue: Kung ipaliliwanag o palalambutin ang tila mahimalang biglaang pagdating ng bangka
  choice: Panatilihin ang tuwirang pahayag na “kaagad na nasa lupang patutunguhan nila ang bangka.”
  alternative: “Kaagad na nakarating ang bangka sa pampang na patutunguhan nila.”
  rationale: Maikli at mariin ang Griyegong paglalahad. Pinananatili ng salin ang biglaan at ang teolohikal na tensiyon nito sa halip na ipaliwanag o pahinain ang posibleng mahimalang diwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “handa silang tanggapin” upang ihayag ang kusang-loob na pagtanggap, at pinanatili ang payak ngunit kapansin-pansing “kaagad na nasa lupa” upang hindi lutasin ang likas na ambiguwidad ng salaysay.
