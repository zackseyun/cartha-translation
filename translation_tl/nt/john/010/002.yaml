  text: But the one who enters through the door is the shepherd of the sheep[a].
translation:
  language: tl
  text: Ngunit ang pumapasok sa pamamagitan ng pintuan ay ang pastol ng mga tupa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “isang pastol ng mga tupa.” Walang pantukoy sa Griyego ang salitang “pastol,” ngunit mas pinapaboran ng konteksto ang tiyak na diwa: ang lehitimong pastol, na kasalungat ng mga pumapasok nang walang karapatan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἰσερχόμενος
  choice: Ngunit ang pumapasok
  rationale: Ang participle na may pantukoy ay ginagamit bilang pangngalan at tumutukoy sa taong pumapasok. Ipinahahayag ng “Ngunit” ang pagsalungat sa magnanakaw at tulisan sa naunang talata.
- source_word: διὰ τῆς θύρας
  choice: sa pintuan
  rationale: Ang διά na may genitive ay nagsasaad ng pagdaan. Sa natural na Filipino, ang “pumapasok sa pintuan” ay malinaw na nangangahulugang pumapasok sa pamamagitan ng pintuan; ang “dumaraan sa pintuan” ay posible ngunit hindi gaanong tuwirang katumbas ng εἰσερχόμενος.
- source_word: ποιμήν
  choice: ang pastol
  rationale: Bagaman walang pantukoy ang predicate noun sa Griyego, ipinakikilala ng konteksto ang lehitimo at kinikilalang pastol bilang kasalungat ng mga ilegal na pumapasok. Natural sa Filipino ang tiyak na “ang pastol” sa ganitong pangungusap.
- source_word: τῶν προβάτων
  choice: ng mga tupa
  rationale: Pinananatili ang literal na larawan ng mga tupa sa halip na gawing mas interpretatibong “kawan.”
theological_decisions:
- issue: Pagiging tiyak ng predicate na ποιμήν
  choice: ang pastol
  alternative: isang pastol
  rationale: Ipinapakita ng kaibahan sa magnanakaw at tulisan na ang tinutukoy ay ang lehitimong pastol ng mga tupa. Gayunman, dahil walang pantukoy ang ποιμήν sa Griyego, inilalahad sa talababa ang posibleng di-tiyak na pagbasa nang hindi nilulutas nang labis ang tunay na ambiguwidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang “pastol,” “pintuan,” at “mga tupa,” at iniwasan ang labis na teknikal o denominasyonal na pananalita.
