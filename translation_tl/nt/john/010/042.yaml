  text: And many believed in him there.
translation:
  language: tl
  text: At marami ang sumampalataya sa kanya roon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Payak na pang-ugnay ito sa naunang salaysay at hindi nagdaragdag ng tiyak na ugnayang sanhi o panahon.
- source_word: πολλοὶ
  choice: marami
  rationale: Ginagamit ang pang-uri bilang pangngalan para sa maraming tao; likas at sapat sa Tagalog ang “marami” nang hindi na tahasang idinaragdag ang “tao.”
- source_word: ἐπίστευσαν
  choice: sumampalataya
  rationale: Tuwirang ipinapahayag ng pandiwa ang ginawang paniniwala o pagtitiwala. Sa kontekstong nakatuon kay Jesus, likas sa makabagong wikang biblikal ang “sumampalataya.”
- source_word: εἰς αὐτόν
  choice: sa kanya
  rationale: Kasama ng “sumampalataya,” likas na ipinahahayag ng “sa kanya” ang pagtitiwalang nakatuon kay Jesus nang hindi pinipilit ang literal ngunit di-likas na anyo ng εἰς.
- source_word: ἐκεῖ
  choice: roon
  rationale: Pinananatili nito ang diin sa lugar na tinutukoy sa naunang salaysay. Ang “roon” ay angkop kapag ang lugar ay malayo sa nagsasalita o naunang nabanggit.
theological_decisions:
- issue: Kahulugan ng πιστεύω εἰς αὐτόν sa konteksto ng pananampalataya kay Jesus
  choice: sumampalataya sa kanya
  alternative: naniwala sa kanya
  rationale: Ang “sumampalataya sa kanya” ay malinaw na naghahatid ng personal na pagtitiwala na nakatuon kay Jesus. Posible ang “naniwala sa kanya,” ngunit maaari rin itong marinig bilang simpleng pagtanggap lamang sa sinabi niya; hindi naman dinaragdagan ng piniling salin ang anumang denominasyonal na paliwanag.
translation_notes:
  register: Makabago, maikli, at marangal na Tagalog. Inilagay ang “roon” pagkatapos ng “marami” upang maging natural ang daloy habang pinananatili ang lokatibong diin ng Griyego.
