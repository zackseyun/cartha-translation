  text: Because of these words[a], a division arose again among the Jews.
translation:
  language: tl
  text: Dahil sa mga salitang ito, muling nagkaroon ng pagkakahati sa mga Judio[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga taga-Judea,” o, sa ilang konteksto sa Ebanghelyo ni Juan, “mga pinunong Judio.” Ang “mga Judio” ang tuwirang katumbas ng salitang Griyego rito, ngunit sa Ebanghelyo ni Juan, madalas itong tumutukoy ayon sa konteksto sa isang partikular na pangkat, hindi sa buong sambayanang Judio.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σχίσμα
  choice: nagkabaha-bahagi
  rationale: Tumutukoy ang pangngalan sa pagkakahati o pagkakampi-kampi. Ang pandiwang anyong ito ay natural sa modernong Tagalog at malinaw na naghahayag ng nahating tugon ng mga tao.
- source_word: πάλιν
  choice: muli na naman
  rationale: Ipinahihiwatig ng pang-abay na naulit ang pagkakabaha-bahagi; malinaw at likas sa Tagalog ang pariralang ito.
- source_word: ἐγένετο
  choice: nagka-
  rationale: Ipinapakita ng γίνομαι na nagkaroon o lumitaw ang isang kalagayan. Nasa pandiwang “nagkabaha-bahagi” ang diwang ito.
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: ang mga Judio
  rationale: Direktang pinananatili ang katawagang etniko-relihiyoso, habang ipinapaliwanag sa talababa ang saklaw nitong nakabatay sa konteksto sa Ebanghelyo ni Juan.
- source_word: διὰ
  choice: Dahil sa
  rationale: Kasama ng akusatibo, nagpapahayag ang διά ng sanhi; tuwiran at pangkaraniwan sa kasalukuyang Tagalog ang “dahil sa.”
- source_word: τοὺς λόγους τούτους
  choice: mga salitang ito
  rationale: Tumutukoy ito sa naunang sinabi ni Jesus. Ang “mga salitang ito” ay simple, malinaw, at malapit sa Griyego.
theological_decisions:
- issue: Saklaw ng Ἰουδαῖοι sa Ebanghelyo ni Juan
  choice: mga Judio
  alternative: mga taga-Judea; mga pinunong Judio
  rationale: Pinananatili sa pangunahing teksto ang tuwirang katawagan nang hindi ipinapasiya kung heograpiko o pampamunuan lamang ang tinutukoy. Nililinaw ng talababa na madalas nakabatay sa konteksto ang saklaw at hindi kinakailangang tumukoy sa buong sambayanang Judio.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang likas na pandiwang “nagkabaha-bahagi” sa halip na mas mabigat na pangngalang parirala, habang pinananatili ang sanhi, pag-uulit, at kontekstuwal na kalabuan ng Ἰουδαῖοι.
