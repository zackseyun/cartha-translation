  source_fidelity: 'Tapat ang salin sa estruktura at diwa ng Griyego: ang eksklusibong layunin ng magnanakaw, ang tatlong magkakasunod na kilos, at ang magkasalungat na layunin ni Jesus ay malinaw na napanatili. Ang “kumatay” ay angkop na katapat ng θύσῃ sa konteksto ng mga tupa, samantalang ang “pumuksa” ay sapat na katapat ng ἀπολέσῃ nang hindi nagdaragdag ng paliwanag. Ang “buhay” para sa ζωή at “nang sagana” para sa περισσόν ay hindi nagpapasok ng mas tiyak na teolohikal o materyalistang pagbasa.'
  naturalness: Natural at marangal ang modernong Filipino Tagalog. Ang pag-uulit ng “magkaroon” ay tumutugma sa pag-uulit ng ἔχωσιν at ang “nito” ay malinaw na tumutukoy sa “buhay.”
  terminology: 'Wasto at magkakatugma ang mahahalagang termino: “magnanakaw,” “kumatay,” “pumuksa,” “buhay,” at “nang sagana.” Ang mga talababa ay malinaw, may wastong angkla, at nagbibigay lamang ng lehitimong alternatibong salin.'
