id: JHN.10.10
reference: John 10:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ κλέπτης οὐκ ἔρχεται εἰ μὴ ἵνα κλέψῃ καὶ θύσῃ καὶ ἀπολέσῃ· ἐγὼ ἦλθον ἵνα ζωὴν ἔχωσιν καὶ περισσὸν ἔχωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/010.yaml
  text: The thief comes only to steal and slaughter and destroy[a]; I came so that they may have life[b], and have it abundantly.
translation:
  language: tl
  text: Dumarating lamang ang magnanakaw upang magnakaw, kumatay, at pumuksa[a]; dumating ako upang magkaroon sila ng buhay at magkaroon nito nang sagana.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pumatay” sa halip na “kumatay” (θύσῃ). Madalas tumukoy ang pandiwang Griyego sa pagkatay, na angkop sa larawan ng mga tupa sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “magkaroon ng buhay na sagana” o “magkaroon nito nang lubos.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ κλέπτης
  choice: ang magnanakaw
  rationale: Pinananatili ng tiyak na pantukoy ang pangkalahatang-tiyak na larawan ng magnanakaw bilang kinatawang tauhan sa talinghaga tungkol sa pastol at mga tupa.
- source_word: οὐκ ἔρχεται εἰ μὴ
  choice: dumarating lamang ... upang
  rationale: Likas sa modernong Tagalog at malinaw na ipinapahayag ang eksklusibong layunin ng pagdating.
- source_word: ἵνα κλέψῃ
  choice: upang magnakaw
  rationale: Tuwirang pinananatili ang layuning ipinahahayag ng ἵνα.
- source_word: θύσῃ
  choice: kumatay
  rationale: Karaniwang tumutukoy ang θύω sa pagkatay, lalo na ng hayop; ang 'kumatay' ay angkop sa konteksto ng mga tupa at mas tiyak kaysa 'pumatay'.
- source_word: ἀπολέσῃ
  choice: pumuksa
  rationale: Ipinahahayag nito ang ganap na kapahamakan sa seryeng magnakaw–kumatay–pumuksa nang hindi tinutukoy nang higit sa teksto ang paraan o layon.
- source_word: ἐγὼ ἦλθον
  choice: dumating ako
  rationale: Natural na salin ng aorist at malinaw na katapat ng pagdating ng magnanakaw; ang pagkahuli ng 'ako' ay nagbibigay ng likas na diin sa Tagalog.
- source_word: ἵνα ζωὴν ἔχωσιν
  choice: upang magkaroon sila ng buhay
  rationale: Pinananatili ang sugnay ng layunin at ang malawak na kahulugan ng mahalagang salitang Johannine na ζωή nang hindi dinaragdagan ng 'walang hanggan'.
- source_word: περισσὸν ἔχωσιν
  choice: magkaroon nito nang sagana
  rationale: Iniuugnay ng 'nito' ang kasaganaan sa buhay, at ang 'nang sagana' ay natural na adberbiyal na katumbas ng περισσόν.
theological_decisions:
- issue: Saklaw ng ζωή sa paggamit ni Juan
  choice: buhay
  alternative: buhay na walang hanggan; tunay na buhay
  rationale: Walang pang-uring 'walang hanggan' sa talata. Pinananatili ng payak na 'buhay' ang lalim at posibleng mas malawak na pahiwatig ng salita nang hindi ipinapasok sa mismong teksto ang isang mas tiyak na pagbasa.
- issue: Diwa ng περισσόν
  choice: nang sagana
  alternative: nang lubos; buhay na sagana
  rationale: Ipinahahayag nito ang kasaganaan o kapuspusan ng buhay na ibinibigay ni Jesus, ngunit hindi ito pinalalawak tungo sa materyal na kasaganaan o doktrina ng prosperidad.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang 'kumatay' upang mapanatili ang larawan ng mga tupa, at iniwasan ang mas denominasyonal o prosperity-oriented na pagpapalawak ng 'buhay na sagana'.
