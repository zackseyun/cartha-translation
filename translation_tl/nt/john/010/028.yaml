  yaml_path: translation/nt/john/010/028.yaml
  text: And I give them eternal life, and they will certainly never perish forever, and no one will snatch them out of my hand.
translation:
  language: tl
  text: Binibigyan ko sila ng buhay na walang hanggan, at hinding-hindi sila mapapahamak kailanman, at walang sinumang aagaw sa kanila mula sa aking kamay.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δίδωμι
  choice: Binibigyan
  rationale: Pinananatili ang aspektong pangkasalukuyan ng pandiwa at natural itong tumutukoy sa patuloy o aktuwal na pagkakaloob ni Jesus.
- source_word: ζωὴν αἰώνιον
  choice: buhay na walang hanggan
  rationale: Ito ang malinaw at kinikilalang katumbas sa modernong Tagalog, nang hindi nililimitahan ang parirala sa haba lamang ng buhay.
- source_word: οὐ μὴ ἀπόλωνται εἰς τὸν αἰῶνα
  choice: Hinding-hindi sila mapapahamak magpakailanman
  rationale: Ang “hinding-hindi” ay nagpapahayag ng mariing οὐ μή, samantalang ang “magpakailanman” ay tahasang kumakatawan sa εἰς τὸν αἰῶνα. Ang “mapapahamak” ay nagpapanatili sa mas malawak na diwa ng ἀπόλλυμι kaysa gawing pisikal na kamatayan lamang.
- source_word: ἁρπάσει
  choice: aagaw
  rationale: Ipinahihiwatig nito ang sapilitan at biglaang pagkuha na taglay ng pandiwang Griyego.
- source_word: ἐκ τῆς χειρός μου
  choice: mula sa aking kamay
  rationale: Pinananatili ang konkretong larawan ng kamay bilang saklaw ng pag-iingat at kapangyarihan ni Jesus.
theological_decisions:
- issue: Lakas at saklaw ng pagtanggi sa pagkapahamak
  choice: Hinding-hindi sila mapapahamak magpakailanman
  alternative: Hindi sila mapapahamak kailanman
  rationale: Pinananatili ng pinili ang parehong mariing διπlikadong pagtanggi na οὐ μή at ang hiwalay na pariralang εἰς τὸν αἰῶνα, sa halip na pagsamahin at pahinain ang dalawang elemento.
- issue: Kahulugan ng ἀπόλλυμι
  choice: mapapahamak
  alternative: mamamatay / malilipol
  rationale: Hindi awtomatikong ipinapakahulugan ang sinabi bilang kawalan ng pisikal na kamatayan o bilang isang partikular na sistematikong doktrina; nananatili ang teolohikal na lawak ng “perish.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ang bahagyang pag-uulit sa “Hinding-hindi … magpakailanman” ay sinadya upang mapanatili ang dobleng diin ng tekstong Griyego.
