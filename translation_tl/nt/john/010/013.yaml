id: JHN.10.13
reference: John 10:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀ὅτι μισθωτός ἐστιν καὶ οὐ μέλει αὐτῷ περὶ τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/013.yaml
  text: because he is a hired hand and does not care about the sheep.
translation:
  language: tl
  text: sapagkat upahan lamang siya at wala siyang malasakit sa mga tupa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: sapagkat
  rationale: Ipinapahayag nito ang dahilan ng pagtakas ng upahan sa naunang sugnay. Likas at marangal sa makabagong Tagalog ang “sapagkat” bilang panandang sanhi.
- source_word: μισθωτός
  choice: upahan lamang
  rationale: Tumutukoy ito sa taong nagtatrabaho kapalit ng sahod at hindi siyang may-ari ng mga tupa. Ang “upahan” ay maikli at angkop sa konteksto; ipinakikita ng “lamang” ang kaibahan niya sa mabuting pastol nang hindi dinaragdagan ang pagkakakilanlan niya.
- source_word: οὐ μέλει αὐτῷ περὶ
  choice: wala siyang malasakit sa
  rationale: Ang impersonal na konstruksiyon ay nagpapahayag ng kawalan ng pag-aalala o pagkalinga. Pinananatili ng “wala siyang malasakit sa” ang etikal na bigat at natural itong pakinggan sa Tagalog.
- source_word: τῶν προβάτων
  choice: mga tupa
  rationale: Tuwirang pinananatili nito ang larawang pastoral ng Griyego sa halip na palitan ito ng mas malawak na “kawan.”
theological_decisions:
- issue: Paglalarawan sa μισθωτός bilang kabaligtaran ng mabuting pastol
  choice: Isinalin ang pahayag bilang tuwirang paliwanag sa kawalan ng malasakit ng upahan, nang hindi siya iniuugnay sa isang tiyak na uri ng pinuno.
  alternative: Tukuyin ang upahan bilang mga huwad na pinuno, o pahinain ang pahayag bilang simpleng propesyonal na paglayo.
  rationale: Malinaw na ibinibigay ng talata ang dahilan ngunit hindi nito tahasang tinutukoy kung sino ang sinasagisag ng upahan. Kaya pinananatili ang etikal at pastoral na paghahambing nang hindi nagdaragdag ng doktrinal na pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ang pangungusap ay sadyang nagsisimula sa maliit na titik dahil nagpapatuloy ito sa naunang sugnay ng Juan 10:12.
