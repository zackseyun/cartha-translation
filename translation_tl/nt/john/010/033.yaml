revisions:
- from: Sumagot sa kanya ang mga Judio, “Hindi dahil sa isang mabuting gawa kaya ka namin binabato, kundi dahil sa paglapastangan mo sa Diyos—sapagkat ikaw, na isang tao lamang, ay ginagawa mong Diyos ang iyong sarili.”[a]
  to: Sumagot sa kanya ang mga Judio, “Hindi ka namin binabato dahil sa isang mabuting gawa, kundi dahil sa paglapastangan sa Diyos, at dahil ikaw, bagaman tao, ay itinuturing mong Diyos ang iyong sarili.”[a]
  rationale: Pinalitan ang pariralang maaaring magpahiwatig ng literal na pagbabago sa sarili ng mas natural na Filipino na nagpapahayag ng paratang na pag-aangkin ng katayuang banal. Inalis ang “lamang” at ginamit ang “bagaman tao” upang mapanatili ang concessive na puwersa ng ἄνθρωπος ὢν nang hindi labis na binibigyang-kahulugan ang teksto. Hindi binago ang saklaw ng “mga Judio,” ang puwersa ng kasalukuyang “binabato,” o ang nakatalang alternatibo para sa anarthrous θεόν.
