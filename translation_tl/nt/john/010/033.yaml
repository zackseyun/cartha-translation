  text: ἀπεκρίθησαν αὐτῷ οἱ ⸀Ἰουδαῖοι· Περὶ καλοῦ ἔργου οὐ λιθάζομέν σε ἀλλὰ περὶ βλασφημίας, καὶ ὅτι σὺ ἄνθρωπος ὢν ποιεῖς σεαυτὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/033.yaml
  text: The Jews answered him[a], “We are not stoning you for a good work, but for blasphemy, and because you, being a man, make yourself God.”
translation:
  language: tl
  text: Sumagot sa kanya ang mga Judio, “Hindi ka namin binabato dahil sa isang mabuting gawa, kundi dahil sa paglapastangan sa Diyos, at dahil ikaw, bagaman tao, ay itinuturing mong Diyos ang iyong sarili.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “itinuturing mong isang diyos ang iyong sarili.” Walang artikulo ang salitang Griyego na θεόν, ngunit sa konteksto ng paratang na paglapastangan, malamang na “Diyos” ang diwa.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰουδαῖοι
  choice: mga Judio
  rationale: Tuwirang salin ito na nagpapanatili sa katawagan ni Juan. Sa konteksto, tumutukoy ito sa grupong kumakalaban kay Jesus sa templo, ngunit hindi nililimitahan ng mismong salita ang tinutukoy sa mga pinuno lamang.
- source_word: Περὶ καλοῦ ἔργου
  choice: dahil sa isang mabuting gawa
  rationale: Ipinahahayag ng περί na may genitibo ang dahilan o usaping pinagbabatayan. Pinananatili ng “isang mabuting gawa” ang isahan at ang positibong moral na diwa ng καλοῦ.
- source_word: λιθάζομέν
  choice: binabato
  rationale: Ang aspektong pangkasalukuyan ay angkop ilarawan bilang kasalukuyang kilos o agarang tangkang pagbato. Natural sa Filipino ang “ka namin binabato” sa tuwirang sagot ng mga nagsasalita.
- source_word: βλασφημίας
  choice: paglapastangan mo sa Diyos
  rationale: Sa kontekstong ito, ang βλασφημία ay paglapastangan o pagsasalitang lumalait sa Diyos. Nilinaw ng “sa Diyos” ang karaniwang kahulugan nito rito nang hindi gumagamit ng di-gaanong pamilyar na hiram na salita.
- source_word: ἄνθρωπος ὢν
  choice: ikaw, na isang tao lamang
  rationale: 'Ipinahahayag nito ang mapanghamong paghahambing ng mga nagsasalita: sa palagay nila, tao si Jesus ngunit inaangkin niya ang katayuang nauukol sa Diyos. Ang “lamang” ay nagpapakita ng kontekstuwal na diwang concessive, hindi isang pahayag ng tagapagsalin tungkol sa buong pagkakakilanlan ni Jesus.'
- source_word: ποιεῖς σεαυτὸν θεόν
  choice: ginagawa mong Diyos ang iyong sarili
  rationale: Ang ποιέω na may reflexive object at predicate accusative ay nangangahulugang “ginagawa ang sarili bilang X” o “nagpapakilalang X.” Sa paratang na paglapastangan at sa kontekstong monoteistiko, “Diyos” ang pinakamalamang na diwa, habang inilalagay sa talababa ang posibleng “isang diyos.”
theological_decisions:
- issue: Pagkasalin sa θεόν sa paratang na ποιεῖς σεαυτὸν θεόν
  choice: Diyos
  alternative: isang diyos
  rationale: Walang artikulo ang θεόν, kaya posible sa antas ng gramatika ang “isang diyos.” Gayunman, ang agarang paratang na paglapastangan at ang konteksto sa Ebanghelyo ni Juan ay nagpapahiwatig na naunawaan ng mga sumasakdal na inaangkin ni Jesus ang katayuang nauukol sa Diyos. Pinananatili sa talababa ang tunay na alternatibong gramatikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga Judio” bilang tuwirang katawagan sa teksto, hindi “mga pinunong Judio,” upang huwag paliitin nang lampas sa sinasabi ng Griyego ang tinutukoy. Ginamit ang “paglapastangan sa Diyos” bilang natural at madaling maunawaang katumbas ng βλασφημία.
