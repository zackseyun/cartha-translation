id: JHN.10.9
reference: John 10:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐγώ εἰμι ἡ θύρα· δι’ ἐμοῦ ἐάν τις εἰσέλθῃ σωθήσεται καὶ εἰσελεύσεται καὶ ἐξελεύσεται καὶ νομὴν εὑρήσει.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/009.yaml
  text: I am the door. If anyone enters through me[a], he will be saved, and will go in and go out and find pasture.
translation:
  language: tl
  text: Ako ang pintuan.[a] Ang sinumang pumasok sa pamamagitan ko ay maliligtas. Papasok siya at lalabas at makasusumpong ng pastulan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tarangkahan.” Ang salitang Griyego ay maaaring tumukoy sa pintuan o tarangkahan; ginamit sa pangunahing teksto ang “pintuan” bilang mas tuwirang katumbas.
    reason: lexical_alternative
lexical_decisions:
- source_word: θύρα
  choice: pintuan
  rationale: Ang “pintuan” ang tuwirang katumbas at natural na salin sa Filipino. Nananatili rito ang metapora ni Jesus, habang ang “tarangkahan” ay posibleng kahulugan sa konteksto ng kulungan ng mga tupa.
- source_word: δι’ ἐμοῦ
  choice: sa pamamagitan ko
  rationale: Ipinahahayag ng διά na may genitive ang paraan o tagapamagitan. Malinaw na ipinakikita ng parirala na si Jesus ang tanging paraan ng pagpasok.
- source_word: ἐάν τις εἰσέλθῃ
  choice: Ang sinumang pumasok
  rationale: Likas sa modernong Filipino ang ganitong pangkalahatang kondisyunal na pahayag. Pinananatili ng “sinuman” ang bukás at di-tiyak na saklaw ng τις.
- source_word: σωθήσεται
  choice: ay maliligtas
  rationale: Pinananatili ng “maliligtas” ang malawak na diwang teolohikal ng σῴζω sa Juan, nang hindi ito nililimitahan sa pisikal na pagsagip o pinalalawak nang higit sa sinasabi ng talata.
- source_word: εἰσελεύσεται καὶ ἐξελεύσεται
  choice: Papasok siya at lalabas
  rationale: Natural at tuwiran nitong pinananatili ang magkatambal na kilos ng pagpasok at paglabas, nang hindi dinaragdagan ng paliwanag tungkol sa kalayaan o katiwasayan.
- source_word: νομὴν
  choice: pastulan
  rationale: Ang “pastulan” ang malinaw at karaniwang salitang Filipino para sa lugar na pinanginginainan ng mga hayop at angkop sa agarang metapora ng mga tupa.
- source_word: εὑρήσει
  choice: makasusumpong
  rationale: Tuwirang ipinahahayag ng “makasusumpong” ang kahulugan ng εὑρίσκω at pinananatili ang marangal na himig ng pahayag.
theological_decisions:
- issue: Metaporikal na salin ng θύρα sa konteksto ng pagpapastol
  choice: pintuan
  alternative: tarangkahan
  rationale: Ang “pintuan” ang higit na tuwirang leksikal na salin at pinananatili ang anyo ng pahayag na “Ako ang pintuan.” Gayunman, maaaring mangahulugan ang θύρα ng tarangkahan sa konteksto ng kulungan ng mga tupa, kaya inilagay ang alternatibo sa talababa.
- issue: Saklaw ng σωθήσεται
  choice: maliligtas
  alternative: masasagip / maililigtas sa panganib
  rationale: Hindi nito nililimitahan ang pahayag sa pisikal na kaligtasan at hindi rin ito pinipilit sa isang mas makitid na sistematikong pakahulugan. Pinananatili nito ang ugnayan ng espirituwal na kaligtasan at ng larawang pastoral.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “siya” bilang likas na panghalip na walang kasariang itinatakda sa Filipino. Pinanatili ang payak na metapora at ang sunod-sunod na mga kilos sa Griyego nang walang idinagdag na interpretasyon.
