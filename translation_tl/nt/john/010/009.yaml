  source_fidelity: Tumpak na naipapahayag ang ἐγώ εἰμι ἡ θύρα bilang “Ako ang pintuan,” ang kondisyunal na δι’ ἐμοῦ ἐάν τις εἰσέλθῃ bilang “Ang sinumang pumasok sa pamamagitan ko,” at ang mga panghinaharap na σωθήσεται, εἰσελεύσεται, ἐξελεύσεται, at εὑρήσει. Ang “pastulan” ay wastong katumbas ng νομὴν sa metaporang pastoral.
