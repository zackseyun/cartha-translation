  text: τούτῳ ὁ θυρωρὸς ἀνοίγει, καὶ τὰ πρόβατα τῆς φωνῆς αὐτοῦ ἀκούει καὶ τὰ ἴδια πρόβατα ⸀φωνεῖ κατ’ ὄνομα καὶ ἐξάγει αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/003.yaml
  text: To him the gatekeeper opens[a], and the sheep hear his voice, and he calls his own sheep by name and leads them out.
translation:
  language: tl
  text: Binubuksan ng bantay sa pasukan ang pasukan para sa kanya, at naririnig ng mga tupa ang kanyang tinig. Tinatawag niya sa pangalan ang sarili niyang mga tupa at inaakay niya ang mga ito palabas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “inilalabas niya ang mga ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτῳ
  choice: siya
  rationale: Ang datibong panghalip ay tumutukoy sa pastol sa naunang talata. Sa pariralang “Pinagbubuksan siya,” natural sa Tagalog ang personal na pagtukoy nang hindi inuulit ang “pastol.”
- source_word: ὁ θυρωρός
  choice: ang bantay sa pintuan
  rationale: Tumutukoy ito sa tagapagbantay at tagapagbukas ng pasukan ng kulungan ng mga tupa. Mas malinaw at natural ito sa modernong Tagalog kaysa sa mas teknikal o hindi pangkaraniwang katawagan.
- source_word: ἀνοίγει
  choice: pinagbubuksan
  rationale: Ipinahahayag ng anyong ito na binubuksan ng bantay ang pasukan para sa tinutukoy na pastol, kaya naisasama nang natural ang datibong τούτῳ.
- source_word: τὰ πρόβατα
  choice: ang mga tupa
  rationale: Tuwirang katawagan na angkop sa larawang pastoral.
- source_word: τῆς φωνῆς αὐτοῦ ἀκούει
  choice: dinirinig ... ang tinig niya
  rationale: Ang genitibong layon ng ἀκούω ay natural na naipapahayag bilang pagdinig sa tinig. Bagaman isahan ang pandiwang Griyego dahil karaniwan itong gamit sa neuter plural na simuno, maramihan ang kahulugan ng “mga tupa.”
- source_word: τὰ ἴδια πρόβατα
  choice: ang sarili niyang mga tupa
  rationale: Pinananatili ng “sarili niyang” ang diin ng ἴδια sa pag-aari at natatanging kaugnayan.
- source_word: φωνεῖ κατ’ ὄνομα
  choice: Tinatawag niya sa pangalan
  rationale: Natural na katumbas ito ng pagtawag sa bawat tupa ayon sa pangalan nito, nang hindi dinaragdagan ang teksto ng tahasang “isa-isa.”
- source_word: ἐξάγει αὐτά
  choice: inaakay ang mga ito palabas
  rationale: Saklaw ng ἐξάγω ang pagdadala o pag-akay palabas. Ang “inaakay” ay angkop sa kilos ng pastol at hindi lamang nagpapahiwatig ng paglilipat.
theological_decisions:
- issue: Larawan ng pastol at pagkakakilanlan ng kumikilos
  choice: 'Pinanatili ang mga kilos bilang kilos ng hindi tahasang pinangalanang pastol: pinagbubuksan siya, dinirinig ang tinig niya, tinatawag niya ang sarili niyang mga tupa, at inaakay niya ang mga ito palabas.'
  alternative: Tahasang pangalanan si Jesus bilang pastol sa mismong talata.
  rationale: Metaporikal ang talata sa konteksto, ngunit hindi tahasang binabanggit dito ang pangalan ni Jesus. Ang hindi pagdaragdag nito ay nagpapanatili sa anyo at pag-unlad ng diskurso.
- issue: Saklaw ng kahulugan ng ἐξάγει
  choice: inaakay ... palabas
  alternative: inilalabas
  rationale: Parehong posible ang pagdadala at pag-akay palabas. Pinili ang “inaakay” dahil sa konteksto ng pastol, habang itinatala sa talababa ang mas neutral na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “bantay sa pintuan” para sa madaling pagkaunawa sa tagpo, at hinati sa dalawang pangungusap upang maging natural ang daloy nang hindi binabago ang ugnayan ng mga kilos.
