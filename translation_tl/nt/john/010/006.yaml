id: JHN.10.6
reference: John 10:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ταύτην τὴν παροιμίαν εἶπεν αὐτοῖς ὁ Ἰησοῦς· ἐκεῖνοι δὲ οὐκ ἔγνωσαν τίνα ⸀ἦν ἃ ἐλάλει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/006.yaml
  text: Jesus spoke this figure of speech to them[a], but they did not understand what he was saying to them.
translation:
  language: tl
  text: Sinabi ni Jesus sa kanila ang talinghagang ito[a], ngunit hindi nila naunawaan ang sinasabi niya sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “matalinghagang pananalita,” “paglalarawan,” o “salawikain.” Malawak ang kahulugan ng salitang Griyego at maaari itong tumukoy sa isang pahayag na hindi literal; dito, tumutukoy ito sa naunang paglalarawan ni Jesus tungkol sa pastol at sa mga tupa.
    reason: lexical_alternative
lexical_decisions:
- source_word: παροιμίαν
  choice: talinghaga
  rationale: 'Malawak ang saklaw ng παροιμία: maaari itong tumukoy sa isang matalinghagang pahayag, paglalarawan, o salawikain. Ang “talinghaga” ay natural sa Filipino at hindi masyadong nagtatakda kung anong tiyak na uri ng matalinghagang pananalita ang tinutukoy.'
- source_word: εἶπεν
  choice: sinabi
  rationale: Karaniwan at tuwirang katumbas ito ng εἶπεν, at natural itong gamitin kapag ang layon ay “ang talinghagang ito.”
- source_word: ἐκεῖνοι δὲ
  choice: ngunit hindi nila
  rationale: Ipinahahayag ng “ngunit” ang pagsalungat sa pagitan ng pagsasalita ni Jesus at ng hindi pagkaunawa ng mga nakikinig. Hindi na kailangang isalin nang hiwalay ang demonstratibong ἐκεῖνοι dahil malinaw at natural ang panghalip na “nila” sa Filipino.
- source_word: οὐκ ἔγνωσαν
  choice: hindi nila naunawaan
  rationale: Sa konteksto, ang γινώσκω ay tumutukoy sa hindi nila pagkaunawa sa kahulugan o nilalaman ng matalinghagang sinabi ni Jesus, hindi lamang sa kawalan ng kaalaman.
- source_word: τίνα ἦν ἃ ἐλάλει αὐτοῖς
  choice: ang sinasabi niya sa kanila
  rationale: Medyo alanganin ang literal na kayarian ng Griyego, ngunit malinaw na tinutukoy nito ang hindi nila pagkaunawa sa sinasabi ni Jesus. Pinananatili ng saling ito ang diwa nang hindi nagdaragdag ng tahasang “ibig sabihin,” na maaaring lumampas sa mismong anyo ng teksto.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang payak na ayos ng pangungusap at ang karaniwang “naunawaan” upang maging madaling maintindihan nang hindi pinapawi ang lawak ng kahulugan ng παροιμία.
