  text: Εἶπεν οὖν πάλιν ⸀αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν ⸀ὅτι ἐγώ εἰμι ἡ θύρα τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/007.yaml
  text: So Jesus said to them again[a], “Truly, truly, I say to you, I am the door for the sheep.”
translation:
  language: tl
  text: Kaya muling sinabi ni Jesus sa kanila, “Tunay na tunay, sinasabi ko sa inyo, ako ang pintuan ng mga tupa.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ako ang tarangkahan ng mga tupa” o “ako ang pintuan para sa mga tupa.” Ang salitang Griyego ay maaaring mangahulugang pintuan, tarangkahan, o pasukan; hindi rin tahasang tinutukoy ng pariralang Griyego ang eksaktong kaugnayan nito sa mga tupa.
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Ipinakikita ang lohikal at pasalaysay na pagpapatuloy mula sa naunang hindi pagkaunawa ng mga nakikinig.
- source_word: πάλιν
  choice: muling
  rationale: Likas at tuwirang nagpapahayag na nagsalita si Jesus nang panibago.
- source_word: Ἀμὴν ἀμὴν
  choice: Katotohanang-katotohanan
  rationale: Pinananatili ang pag-uulit at mariing bigat ng natatanging pormulang ginagamit ni Jesus sa Juan.
- source_word: λέγω ὑμῖν
  choice: sinasabi ko sa inyo
  rationale: Malapit sa anyong Griyego at angkop sa marangal ngunit malinaw na modernong Tagalog.
- source_word: ὅτι
  choice: —
  rationale: Hindi kailangang katawanin ng hiwalay na “na” sa tuwirang sipi sa Tagalog; ganap pa ring naihahayag ang sugnay na nilalaman.
- source_word: ἐγώ εἰμι
  choice: ako ang
  rationale: Natural na paraan sa Tagalog ng mariing pagpapakilala sa sarili sa isang sugnay na may panaguri.
- source_word: θύρα
  choice: pintuan
  rationale: Tuwirang katumbas na sumasaklaw sa pasukan o tarangkahan; ang “pintuan” ay malinaw at pinananatili ang metapora.
- source_word: τῶν προβάτων
  choice: ng mga tupa
  rationale: Pinananatili ang maluwag na ugnayang genitibo ng Griyego nang hindi ipinapasiya kung ito ay pag-aari, kaugnayan, o gamit para sa mga tupa.
theological_decisions:
- issue: Metaporikal na pagpapakilala ni Jesus sa sarili bilang θύρα
  choice: ako ang pintuan ng mga tupa
  alternative: ako ang tarangkahan para sa mga tupa
  rationale: Pinananatili ang mismong larawan at ang hindi tiyak na saklaw ng genitibo, sa halip na palawakin ito bilang doktrinal na paliwanag. Ang “tarangkahan” ay tunay na alternatibo sa konteksto ng kulungan ng tupa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang dobleng pormulang “Katotohanang-katotohanan” at ang ambiguwidad ng “ng mga tupa,” habang inilagay sa talababa ang mga natural na alternatibo.
