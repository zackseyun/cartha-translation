lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang payak na pang-ugnay ng Griyego nang hindi nagdaragdag ng tiyak na temporal na diwa.
- source_word: περιεπάτει
  choice: naglalakad
  rationale: Ipinahihiwatig ng imperpektong pandiwa ang nagpapatuloy na kilos sa nakaraan; sa konteksto ng salaysay, natural itong naipapahayag sa Filipino bilang “naglalakad.”
- source_word: ἱερῷ
  choice: bakuran ng templo
  rationale: Ang ἱερόν ay tumutukoy sa buong nasasakupan o mga looban ng templo, hindi lamang sa panloob na santuwaryo.
- source_word: στοᾷ
  choice: Portiko
  rationale: Tumutukoy ang στοά sa isang may-bubong na daanang may mga haligi; ang “Portiko” ay angkop bilang bahagi ng kinikilalang pangalan ng lugar.
- source_word: τοῦ Σολομῶνος
  choice: ni Solomon
  rationale: Natural na isinasalin sa Filipino ang henitibong anyo bilang “ni Solomon” sa pangalan ng lugar.
