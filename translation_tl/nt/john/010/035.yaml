  text: εἰ ἐκείνους εἶπεν θεοὺς πρὸς οὓς ὁ λόγος τοῦ θεοῦ ἐγένετο, καὶ οὐ δύναται λυθῆναι ἡ γραφή,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/035.yaml
  text: If he called those to whom the word of God came ‘gods’—and the Scripture cannot be broken—[a][b]
translation:
  language: tl
  text: Kung tinawag niyang ‘mga diyos’ ang mga pinatunguhan ng salita ng Diyos—at hindi mapapawalang-bisa ang Kasulatan—[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring unawain bilang “mga nilalang na may katangiang maka-diyos.” Sa Griyego, “mga diyos” ang nakasulat, na umaalingawngaw sa Awit 82:6; inuunawa naman ito ng ilang tagapagpaliwanag na tumutukoy sa mga hukom na tao.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “hindi masisira” o “hindi maaaring isantabi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: Kung
  rationale: Pinananatili ang kondisyunal na anyo ng pangangatwiran ni Jesus.
- source_word: ἐκείνους
  choice: ang mga taong
  rationale: Natural sa Filipino at malinaw na tumutukoy sa mga persona; ang ‘taong’ ay hindi tumutukoy sa kasarian at hindi nagpapasok ng pagkakakilanlan gaya ng ‘mga hukom.’
- source_word: εἶπεν
  choice: tinawag niyang
  rationale: Sa konstruksiyong ito, ang pandiwa ay may diwang pagtawag o pagtukoy sa kanila bilang ‘mga diyos,’ sa halip na literal ngunit di-likas na ‘sinabi niyang mga diyos.’
- source_word: θεοὺς
  choice: ‘mga diyos’
  rationale: Tuwirang pinananatili ang sipi at mahalagang salita mula sa Awit 82:6 nang hindi ito ipinapakahulugang agad bilang ‘mga hukom’ o ‘mga makadiyos na nilalang.’
- source_word: πρὸς οὓς ὁ λόγος τοῦ θεοῦ ἐγένετο
  choice: ang mga taong dinatnan ng salita ng Diyos
  rationale: Ang ‘dinatnan’ ay natural na Filipino para sa salita o pahayag na dumating at itinuon sa mga taong kinakausap.
- source_word: οὐ δύναται λυθῆναι
  choice: hindi mapapawalang-bisa
  rationale: Ipinahahayag ang diwa ng λυθῆναι bilang hindi maaaring pawalang-saysay, ipawalang-bisa, o isantabi; mas malinaw ito sa modernong Filipino kaysa sa literal na ‘hindi masisira.’
- source_word: ἡ γραφή
  choice: ang Kasulatan
  rationale: Karaniwan, marangal, at tiyak na katawagan sa awtoritatibong banal na kasulatan.
theological_decisions:
- issue: Kahulugan ng ‘mga diyos’ sa sipi ni Jesus
  choice: Panatilihin ang literal na ‘mga diyos’ sa pangunahing teksto.
  alternative: ‘mga banal na nilalang’ o ‘mga hukom’
  rationale: Nakasalalay ang pangangatwiran ni Jesus sa mismong pananalita ng Awit 82:6. Ang pagpili ng ‘mga hukom’ o ‘mga banal na nilalang’ ay magpapasya sa isang pinagtatalunang interpretasyon na hindi tahasang nilulutas ng talata.
- issue: Diwa ng pahayag tungkol sa Kasulatan
  choice: ‘hindi mapapawalang-bisa ang Kasulatan’
  alternative: ‘hindi masisira ang Kasulatan’ o ‘hindi maaaring isantabi ang Kasulatan’
  rationale: Pinananatili nito ang pahayag tungkol sa hindi mapapawalang-saysay na bisa ng Kasulatan, nang hindi dinaragdagan ng denominasyonal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Pinanatili ang pasingit na sugnay sa pamamagitan ng mga gitling at ang bukas na kondisyunal na pangungusap, yamang nagpapatuloy ang pangangatwiran sa kasunod na talata.
