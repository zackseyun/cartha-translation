  naturalness: Marangal at malinaw ang pangkalahatang rehistro. Mas natural at mas eksakto ang “mga pinatunguhan ng salita ng Diyos” kaysa “mga taong dinatnan ng salita ng Diyos,” na medyo di-karaniwan ang ayos at may dagdag na “taong.”
