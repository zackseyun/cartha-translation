base_translation:
  language: en
  yaml_path: translation/nt/john/010/041.yaml
  text: And many came to him and were saying, “John did no sign, but everything that John said about this man was true.”
translation:
  language: tl
  text: At maraming tao ang lumapit sa kanya at sinasabi, “Si Juan ay walang ginawang tanda,[a] ngunit lahat ng sinabi ni Juan tungkol sa taong ito[b] ay totoo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Hindi nagsagawa ng tanda si Juan.”
    reason: lexical_alternative
  - marker: b
    text: 'O “tungkol sa kanya.” Sa Griyego, demonstratibong anyo ang ginamit: “tungkol sa taong ito.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: marami
  rationale: Ginamit ang pang-uri bilang pangngalan, gaya sa Griyego; malinaw sa konteksto na maraming tao ang tinutukoy nang hindi kailangang idagdag ang salitang “tao.”
- source_word: ἦλθον πρὸς αὐτὸν
  choice: lumapit sa kanya
  rationale: Likas sa modernong Filipino ang “lumapit sa kanya” para sa pagkilos patungo sa isang tao at angkop ito sa pananaw ng salaysay.
- source_word: ἔλεγον
  choice: patuloy na nagsabi
  rationale: Ipinahihiwatig ng imperfect ang nagpapatuloy o paulit-ulit na pagsasalita. Inilalantad ito ng “patuloy na” nang hindi ipinapalagay kung ilang ulit sinabi.
- source_word: σημεῖον
  choice: tanda
  rationale: 'Pinananatili ng “tanda” ang natatanging gamit sa Juan: isang makapangyarihang gawa na may itinuturong kahulugan, sa halip na gawing “himala” lamang.'
- source_word: ἐποίησεν οὐδέν
  choice: walang ginawang tanda
  rationale: Malapit ito sa payak na anyo ng Griyego at natural sa Filipino. Posible rin ang “walang isinagawang tanda.”
- source_word: πάντα δὲ ὅσα
  choice: ngunit ... ang lahat ng
  rationale: Pinananatili ng “lahat ng” ang saklaw ng Griyegong pahayag, samantalang malinaw na inihuhudyat ng “ngunit” ang pagsalungat.
- source_word: περὶ τούτου
  choice: tungkol sa taong ito
  rationale: Ang demonstratibong τούτου ay tumutukoy kay Jesus. Pinananatili ng “taong ito” ang demonstratibong diin, bagaman natural ding isalin itong “tungkol sa kanya.”
- source_word: ἀληθῆ ἦν
  choice: totoo
  rationale: Direktang inililipat nito ang predikatibong kahulugan. Sa Filipino, natural na sabihing “totoo ang lahat,” nang hindi kailangang tumbasan nang hiwalay ang isahang pandiwa ng Griyego.
theological_decisions:
- issue: Ang terminong σημεῖον sa Ebanghelyo ni Juan
  choice: tanda
  alternative: himala
  rationale: Ang “tanda” ay nagpapanatili sa tematikong gamit ni Juan, kung saan ang gawa ay tumuturo sa higit na kahulugan. Hindi nito ikinakaila ang makahimalang katangian ng gawa, ngunit hindi rin nito pinapantay ang salita sa “himala” lamang.
- issue: Ang tinutukoy ng περὶ τούτου
  choice: tungkol sa taong ito
  alternative: tungkol sa kanya
  rationale: Tumutukoy ang demonstratibo kay Jesus. Pinananatili ng salin ang demonstratibong anyo nang hindi nagdaragdag ng paliwanag hinggil sa pagkakakilanlan o likas ni Jesus.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang “kanya” ayon sa karaniwang kasalukuyang baybay at ang “tanda” para mapanatili ang mahalagang terminolohiya ni Juan. Ang bahagyang pormal na “taong ito” ay sadyang nagpapanatili sa demonstratibong puwersa ng Griyego; ibinigay sa talababa ang mas idyomatikong alternatibo.
