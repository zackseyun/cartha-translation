  terminology: Ang ‘estranghero,’ ‘tinig,’ at ‘hinding-hindi’ ay angkop sa talinghagang pastol-singaw at sa marangal ngunit modernong rehistro. Hindi kinakailangang bigyang-kahulugang doktrinal ang ‘estranghero.’
