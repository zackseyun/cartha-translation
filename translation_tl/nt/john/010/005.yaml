  text: ἀλλοτρίῳ δὲ οὐ μὴ ⸀ἀκολουθήσουσιν ἀλλὰ φεύξονται ἀπ’ αὐτοῦ, ὅτι οὐκ οἴδασι τῶν ἀλλοτρίων τὴν φωνήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/005.yaml
  text: But they will certainly not follow a stranger[a]; instead, they will flee from him[b], because they do not know the voice of strangers.
translation:
  language: tl
  text: Ngunit hinding-hindi sila susunod sa isang estranghero[a]. Sa halip, tatakas sila palayo sa kanya, sapagkat hindi nila nakikilala ang tinig ng mga estranghero.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kailanma’y hindi sila susunod sa isang estranghero.” Mariin ang pagtanggi sa Griyego (οὐ μή).
    reason: lexical_alternative
  - marker: b
    text: Ang “nakikilala ang tinig” ay maaari ring isaling “kilala ang tinig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλοτρίῳ
  choice: sa isang estranghero
  rationale: Sa talinghaga tungkol sa mga tupa, tumutukoy ito sa isang taong hindi nila kilala at hindi kabilang sa kanilang kinikilalang pastol. Ang “estranghero” ay likas sa modernong Filipino at hindi nagpapahiwatig ng lahi o bansa.
- source_word: οὐ μὴ ἀκολουθήσουσιν
  choice: hinding-hindi sila susunod
  rationale: Ang οὐ μή na may pandiwang nasa panghinaharap ay mariing pagtanggi. Napananatili ng “hinding-hindi” ang diin nang malinaw at natural.
- source_word: ἀκολουθήσουσιν
  choice: susunod
  rationale: Ang “susunod” ang tuwiran at karaniwang salita para sa pagkilos ng mga tupang sumusunod sa isang pastol.
- source_word: φεύξονται ἀπ’ αὐτοῦ
  choice: lalayo sila sa kanya
  rationale: Ipinahihiwatig ng φεύγω na iiwas o tatakas sila mula sa estranghero. Sa konteksto, ang “lalayo” ay natural at malinaw, habang pinananatili ang kabaligtaran ng pagsunod.
- source_word: οἴδασι
  choice: nakikilala
  rationale: Kapag tinig ang layon, maaaring ipakahulugan ang οἶδα bilang pagkilala sa pamilyar na tinig. Ang “nakikilala” ay angkop sa konteksto, bagaman maaari rin itong isaling “alam” o “kilala.”
- source_word: τῶν ἀλλοτρίων
  choice: ng mga estranghero
  rationale: Pinananatili ang maramihang anyo ng Griyego at inilalarawan ang pangkalahatang uri ng mga taong hindi kilala ng mga tupa.
- source_word: φωνήν
  choice: tinig
  rationale: Ang “tinig” ay tuwirang katumbas na nagpapanatili sa literal at ugnayang kahulugan ng makikilalang tawag.
- source_word: δὲ ... ἀλλὰ
  choice: Ngunit ... Sa halip
  rationale: Malinaw nitong ipinapakita ang paghahambing ng hindi pagsunod at ng kabaligtarang pagkilos na paglayo.
theological_decisions:
- issue: Metaporikal na puwersa ng larawan ng mga tupa at pastol
  choice: Panatilihin ang talinghaga nang hindi tahasang tinutukoy kung sino ang “estranghero.”
  alternative: Tukuyin ang estranghero bilang huwad na guro o di-lehitimong pinuno.
  rationale: Hindi tahasang ipinakikilala ng talata ang tinutukoy ng estranghero. Ang pagdaragdag nito sa pangunahing teksto ay magpapasok ng interpretasyong lampas sa mismong Griyego.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “hinding-hindi” upang natural na maipahayag ang mariing pagtanggi, at pinanatili ang talinghaga nang walang paliwanag na denominasyonal.
