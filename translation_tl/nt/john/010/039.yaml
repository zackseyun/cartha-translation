base_translation:
  language: en
  yaml_path: translation/nt/john/010/039.yaml
  text: So they were seeking again to seize him[a], but he escaped from their hand.
translation:
  language: tl
  text: Kaya muli nilang sinikap na dakpin siya, ngunit nakawala siya sa kanilang pagkakahawak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, literal na “lumabas siya mula sa kanilang kamay.” Ang “kamay” ay isahan sa Griyego at isang idyoma para sa kapangyarihan, pagkontrol, o pagkakahawak. Maaari rin itong isaling “nakawala siya sa kanilang mga kamay” o “nakatakas siya mula sa kanilang pagkakahawak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτουν
  choice: sinikap
  rationale: Ipinahahayag ng imperpektong anyo ang nagpapatuloy o tangkang pagkilos sa nakaraan. Likas sa Filipino ang “sinikap” sa ganitong konteksto at ipinakikitang hindi nagtagumpay ang pagtatangka.
- source_word: οὖν
  choice: Kaya
  rationale: Ikinakabit nito ang pangyayari sa naunang sagutan bilang bunga o kasunod na pag-unlad.
- source_word: πάλιν
  choice: muli
  rationale: Tuwirang ipinahahayag ang pag-uulit ng pagtatangkang dakpin si Jesus.
- source_word: πιάσαι
  choice: dakpin
  rationale: Ipinapakita ang sapilitan at mapanlabang paghawak nang hindi kinakailangang ipasok ang mas tiyak na legal na diwa ng pormal na pag-aresto.
- source_word: ἐξῆλθεν
  choice: nakalabas
  rationale: Pinananatili ang payak na kahulugan ng pandiwang “lumabas” sa halip na gawing tahasang “tumakas,” bagaman iyon ang ipinahihiwatig ng konteksto.
- source_word: ἐκ τῆς χειρὸς αὐτῶν
  choice: sa kanilang kamay
  rationale: Pinananatili ang isahang “kamay” ng idyomang Griyego, na tumutukoy sa kapangyarihan, pagkontrol, o pagkakahawak nila.
theological_decisions:
- issue: Kung tahasang isasalin bilang pagtakas ang pagkalabas ni Jesus mula sa kanilang kamay
  choice: Pinanatili ang larawang “nakalabas siya sa kanilang kamay.”
  alternative: “nakawala siya sa kanilang mga kamay” o “nakatakas siya sa kanilang pagkakahawak”
  rationale: Ipinahihiwatig ng salaysay na hindi siya nadakip, ngunit ang Griyego ay gumagamit ng pandiwang “lumabas” at ng idyomang “mula sa kanilang kamay,” hindi ng tahasang pandiwa para sa pagtakas. Pinananatili nito ang paraan ng pagkakasabi at ang bahagyang tensiyon ng teksto.
translation_notes:
  register: Modernong Filipino na may marangal ngunit madaling maunawaang himig. Ginamit ang “dakpin” bilang malinaw at matatag na salita para sa sapilitang paghuli. Sadyang pinanatili ang medyo di-karaniwang isahang “kamay” upang maingatan ang idyoma ng pinagmulang Griyego, at ipinaliwanag ito sa talababa.
