base_translation:
  language: en
  yaml_path: translation/nt/john/010/025.yaml
  text: Jesus answered them[a], “I told you, and you do not believe[b]. The works that I do in the name of my Father—these testify about me.”
translation:
  language: tl
  text: Sumagot sa kanila si Jesus, “Sinabi ko na sa inyo, at hindi kayo naniniwala. Ang mga gawa na ginagawa ko sa pangalan ng aking Ama—ang mga ito ang nagpapatotoo tungkol sa akin.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: Sumagot
  rationale: Likas at karaniwang salin sa salaysay ng isang tugon sa pag-uusap.
- source_word: Εἶπον ὑμῖν
  choice: Sinabi ko na sa inyo
  rationale: Ipinahihiwatig ng aorist ang nauna nang sinabi ni Jesus; nililinaw ng “na” ang aspektong ito sa natural na Tagalog.
- source_word: οὐ πιστεύετε
  choice: hindi kayo naniniwala
  rationale: Pinananatili ang karaniwang bokabularyong teolohikal ni Juan at ang tuwirang diwa ng πιστεύω.
- source_word: τὰ ἔργα
  choice: ang mga gawa
  rationale: Pinananatili ang mahalagang terminong paulit-ulit sa Juan para sa mga kilos at tanda ni Jesus.
- source_word: ἐν τῷ ὀνόματι τοῦ πατρός μου
  choice: sa pangalan ng aking Ama
  rationale: Pinananatili ang idyomang Griyego at ang saklaw nitong maaaring tumukoy sa awtoridad, pagkatawan, at pagkilos ayon sa pangalan ng Ama nang hindi nililimitahan sa isang paliwanag lamang.
- source_word: ταῦτα μαρτυρεῖ περὶ ἐμοῦ
  choice: ang mga ito ang nagpapatotoo tungkol sa akin
  rationale: Inilalantad ang diin ng ταῦτα at pinananatili ang mahalagang wikang patotoo sa Ebanghelyo ni Juan.
theological_decisions:
- issue: Ugnayan ng mga gawa ni Jesus sa pangalan at awtoridad ng Ama
  choice: sa pangalan ng aking Ama
  alternative: sa awtoridad ng aking Ama
  rationale: Hindi pinaliliit ang malawak na diwa ng parirala sa awtoridad lamang at hindi rin dinaragdagan ang hayag na pahayag ng talata.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “mga gawa” at “nagpapatotoo” upang mapanatili ang mahahalagang terminong Johannine. Walang talababa dahil ang ibinigay na mga marker sa English consultation layer ay hindi tugma sa kinauukulang mga parirala at hindi kailangan upang maisalin nang tapat ang tekstong Griyego.
