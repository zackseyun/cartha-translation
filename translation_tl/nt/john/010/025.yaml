  to: Sumagot sa kanila si Jesus, “Sinabi ko na sa inyo, at hindi kayo naniniwala. Ang mga gawa na ginagawa ko sa pangalan ng aking Ama—ang mga ito ang nagpapatotoo tungkol sa akin.”
  rationale: Pinalitan ang “ngunit” ng “at” upang tumpak na maipakita ang καί nang hindi nagdaragdag ng panalungat na ugnayan. Pinakinis din ang pariralang tumutukoy sa mga gawa ni Jesus para sa mas natural na modernong Tagalog. Walang talababa ang kailangan; ang “sa pangalan ng aking Ama” ay sapat na pinananatili ang bukas na saklaw ng ἐν τῷ ὀνόματι.
