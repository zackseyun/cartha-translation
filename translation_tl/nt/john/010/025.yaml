  - severity: low
    issue: “mga gawang ginagawa ko”
    rationale: Nauunawaan ito ngunit medyo mabigat sa modernong Tagalog. Ang “mga gawa na ginagawa ko” ay mas malinaw habang tinutumbasan pa rin ang τὰ ἔργα ἃ ... ποιῶ.
