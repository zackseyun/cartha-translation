translation:
  language: tl
  text: Ngunit hindi kayo sumasampalataya[a], sapagkat hindi kayo kabilang sa aking mga tupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “Ngunit hindi kayo sumasampalataya na hindi kayo kabilang sa aking mga tupa.” Maaari ring unawain ang pangatnig sa Griyego bilang nagpapakilala ng nilalaman sa halip na dahilan.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ngunit
  rationale: Likas at marangal na pangatnig na nagpapakita ng pagsalungat sa naunang paglalarawan sa mga tupang nakikinig kay Jesus.
- source_word: ὑμεῖς
  choice: kayo
  rationale: Pinananatili ang tahasang panghalip sa Griyego; sapat na ang karaniwang anyo sa Filipino upang maipahiwatig ang diin nang hindi ito pinalalabis.
- source_word: οὐ πιστεύετε
  choice: hindi kayo sumasampalataya
  rationale: Ang payak na pangkasalukuyang anyo ay natural na katumbas ng present indicative; ang “sumasampalataya” ay angkop sa gamit ni Juan at sa relihiyosong konteksto.
- source_word: ὅτι
  choice: sapagkat
  rationale: Pinipili ang malamang na panandang sanhi sa daloy ng argumento, habang inilalahad sa talababa ang tunay na posibilidad na nagpapakilala ito ng nilalaman.
- source_word: οὐκ ἐστὲ
  choice: hindi kayo
  rationale: Natural na pagsasalin ng negatibong copula bilang bahagi ng pariralang “hindi kayo kabilang.”
- source_word: ἐκ τῶν προβάτων
  choice: kabilang sa ... mga tupa
  rationale: Ipinahahayag ng ἐκ ang pagiging bahagi o kasapi ng isang pangkat; malinaw at likas sa Filipino ang “kabilang sa.”
- source_word: τῶν ἐμῶν
  choice: aking
  rationale: Likas na anyong paari na tuwirang tumutukoy sa “mga tupa.”
theological_decisions:
- issue: Ang bisa ng ὅτι kaugnay ng hindi pagsampalataya at pagiging kabilang sa mga tupa ni Jesus
  choice: 'Sanhi: “sapagkat hindi kayo kabilang sa aking mga tupa”'
  alternative: 'Nilalaman: “hindi kayo sumasampalatayang hindi kayo kabilang sa aking mga tupa”'
  rationale: 'Mas maayos sa agarang daloy ng talata ang pagbasa rito bilang sanhi: ang hindi nila pagsampalataya ay ipinaliliwanag sa pamamagitan ng hindi nila pagiging kabilang sa mga tupa ni Jesus. Gayunman, maaaring ipakilala ng ὅτι ang nilalaman ng pinaniniwalaan; pinananatili sa talababa ang interpretatibong at teolohikal na tensiyong ito.'
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang “sumasampalataya” upang umangkop sa bokabularyo ni Juan, at ang “kabilang sa” upang likas na maipahayag ang pagiging bahagi ng kawan.
