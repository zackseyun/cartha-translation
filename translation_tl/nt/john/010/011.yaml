  yaml_path: translation/nt/john/010/011.yaml
  text: I am the good shepherd[c][b][a]. The good shepherd lays down his life for the sheep.
translation:
  language: tl
  text: Ako ang mabuting pastol.[a] Ibinibigay ng mabuting pastol ang kanyang buhay para sa mga tupa.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “marangal na pastol” o “ulirang pastol”; ang Griyegong καλός ay maaaring tumukoy sa mabuti, marangal, o huwaran.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “inilalapag niya ang kanyang buhay”; sa idyomang Griyego, nangangahulugan itong “ibinibigay niya ang kanyang buhay.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “alang-alang sa mga tupa.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: Ako ang
  rationale: Natural na Filipino na may malinaw na diin sa pagkakakilanlan ni Jesus, nang hindi pinalalabis ang posibleng teolohikal na alusyon ng parirala.
- source_word: ποιμήν
  choice: pastol
  rationale: Tuwirang katumbas na nagpapanatili sa larawang pastoral at hindi nag-aangkat ng mas huling kahulugang pangkatungkulan ng “pastor.”
- source_word: καλός
  choice: mabuti
  rationale: Natural at kinikilalang salin na sumasaklaw sa kabutihan at kahusayan; pinananatili sa talababa ang posibleng diwang “marangal” o “uliran.”
- source_word: τὴν ψυχὴν αὐτοῦ τίθησιν
  choice: iniaalay ang kanyang buhay
  rationale: Ang literal na “inilalagay ang kanyang kaluluwa” ay hindi likas sa Filipino. Sa idyomang ito, ψυχή ay tumutukoy sa buhay, at ipinahihiwatig ng τίθησιν ang kusang pagbibigay o pag-aalay nito.
- source_word: ὑπὲρ
  choice: para sa
  rationale: Maikli at natural, habang pinananatili ang malawak na diwang kapakinabangan o pagkilos alang-alang sa iba nang hindi itinatakda ang isang partikular na teorya ng pagtubos.
- source_word: τῶν προβάτων
  choice: mga tupa
  rationale: Pinananatili ang tiyak na sanggunian ng Griyego nang hindi idinaragdag ang panghalip na “kanyang,” na wala sa teksto.
theological_decisions:
- issue: Diin at posibleng alusyon ng Ἐγώ εἰμι
  choice: “Ako ang”
  alternative: “Ako mismo ang” o isang saling hayagang nag-uugnay sa banal na pangalan
  rationale: Ang parirala rito ay tuwirang pagpapakilala na may panaguring “mabuting pastol.” Ang natural na Filipino ay nagpapanatili ng diin nang hindi ipinipilit ang isang mas mataas na teolohikal na alusyon.
- issue: Saklaw ng kahulugan ng καλός
  choice: “mabuting pastol”
  alternative: “marangal na pastol” o “ulirang pastol”
  rationale: Ang “mabuti” ay tumpak, natural, at pamilyar, samantalang hindi nito isinasara ang mga pahiwatig ng karangalan at pagiging huwaran.
- issue: Lakas ng ὑπὲρ τῶν προβάτων kaugnay ng kamatayan ni Jesus
  choice: “para sa mga tupa”
  alternative: “alang-alang sa mga tupa” o “bilang kapalit ng mga tupa”
  rationale: Ang “para sa” ay nagpapanatili sa benefaktibo o representatibong saklaw ng ὑπέρ at hindi pinakikitid ang pahayag tungo sa isang partikular na paliwanag ng pagtubos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “iniaalay” bilang natural na katumbas ng idyomang Griyego at upang maipakita ang kusang pagkilos, habang ang mga tunay na alternatibong leksikal ay pinanatili sa mga talababa.
