id: JHN.10.29
reference: John 10:29
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ πατήρ μου ⸀ὃ δέδωκέν ⸀μοι ⸂πάντων μεῖζων⸃ ἐστίν, καὶ οὐδεὶς δύναται ἁρπάζειν ἐκ τῆς χειρὸς τοῦ ⸀πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/029.yaml
  text: My Father[a], who has given them to me, is greater than all, and no one is able to snatch them out of the Father's hand.
translation:
  language: tl
  text: Ang aking Ama[a], na nagbigay sa kanila sa akin, ay higit sa lahat, at walang sinumang makaaagaw sa kanila mula sa kamay ng Ama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O kaya, mas literal: “Ang aking Ama—ang ibinigay niya sa akin—ay higit sa lahat.” Mahirap ang pagkakabuo ng Griyego rito, at itinuturing ng ilan na ang mismong ibinigay, sa halip na ang mga taong ibinigay, ang paksa ng paghahambing.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πατήρ μου
  choice: Ang aking Ama
  rationale: Likas at magalang na pagpapahayag sa Tagalog ng kaugnayan ni Jesus sa Ama, nang walang dagdag na pagpapakahulugan.
- source_word: ὃ δέδωκέν μοι
  choice: na siyang nagbigay sa kanila sa akin
  rationale: Bagaman neuter singular at mahirap ang anyong Griyego, ang konteksto ng mga tupa sa talata 27–28 ay tumutukoy sa mga taong ibinigay ng Ama kay Jesus. Pinananatili ng “nagbigay” ang kilos na may nananatiling bunga, habang inilalahad sa talababa ang tunay na alternatibong pagbasa.
- source_word: πάντων μεῖζων
  choice: higit sa lahat
  rationale: Pinananatili ang malawak na saklaw ng paghahambing nang hindi nililimitahan sa lahat ng tao o sa lahat ng bagay.
- source_word: οὐδεὶς δύναται
  choice: walang sinumang makaaagaw
  rationale: Likas na ipinahahayag ng anyong “makaaagaw” ang kawalan ng kakayahan, kaya hindi na kailangan ang mas mabigat na “walang sinumang may kakayahang.”
- source_word: ἁρπάζειν
  choice: makaaagaw
  rationale: Ipinahahayag ang sapilitan at biglaang pagkuha, at angkop sa larawan ng isang tupa na inaagaw mula sa nag-iingat dito.
- source_word: ἐκ τῆς χειρὸς τοῦ πατρός
  choice: mula sa kamay ng Ama
  rationale: Pinananatili ang metapora ng kamay bilang kapangyarihan, pag-iingat, at pagmamay-ari; natural sa Tagalog ang “mula sa kamay.”
theological_decisions:
- issue: Kahirapang tekstuwal at sintaktiko ng ὃ δέδωκέν μοι
  choice: 'Isinalin ayon sa konteksto ng mga tupa: “na siyang nagbigay sa kanila sa akin.”'
  alternative: “Ang ibinigay sa akin ng aking Ama ay higit sa lahat.”
  rationale: Maaaring unawain ang neuter relative bilang kolektibong “ang ibinigay,” ngunit ang agarang konteksto ay ang mga tupang ibinigay ng Ama sa Anak at hindi maaagaw. Ginawang malinaw ang personal na tinutukoy sa pangunahing teksto, ngunit pinanatili sa talababa ang tunay na alternatibo.
- issue: Saklaw ng paghahambing sa πάντων μεῖζων
  choice: “higit sa lahat”
  alternative: “higit sa lahat ng tao” o “higit sa lahat ng bagay”
  rationale: Hindi tahasang nililimitahan ng Griyego ang paghahambing sa mga tao lamang o mga bagay lamang. Ang malawak na parirala ang pinakamainam na nagpapanatili sa kawalang-tiyak na iyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “makaaagaw” bilang likas ngunit tumpak na pagpapahayag ng kakayahang sapilitang kumuha. Ang “sa kanila” ay inuulit bago ang “mula sa kamay” upang maging malinaw sa Tagalog ang layon ng pag-agaw.
