base_translation:
  language: en
  yaml_path: translation/nt/john/010/017.yaml
  text: For this reason the Father loves me[a], because I lay down my life so that I may take it up again.
translation:
  language: tl
  text: Dahil dito, iniibig ako ng Ama, sapagkat ibinibigay ko ang aking buhay[a] upang muli ko itong kunin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang aking kaluluwa.” Dito, ang ψυχή ay malamang tumutukoy sa “buhay,” sa diwang ito ang buhay na ibinibigay ni Jesus sa kamatayan at muli niyang kinukuha.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Dahil dito
  rationale: Likas na panandang sanhi sa makabagong Tagalog at pinananatili ang kaugnayan sa naunang pahayag.
- source_word: με ὁ πατὴρ ἀγαπᾷ
  choice: iniibig ako ng Ama
  rationale: Pinananatili ang tahasang simuno na “ang Ama” at ang layon na “ako,” nang hindi dinaragdagan ng paari na “aking.”
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw na ipinakikilala nito ang dahilan ng pag-ibig ng Ama at angkop sa marangal na rehistro ng Kasulatan.
- source_word: τίθημι τὴν ψυχήν μου
  choice: iniaalay ko ang aking buhay
  rationale: Sa konteksto, tumutukoy ito sa kusang pagbibigay ng buhay sa kamatayan. Mas likas sa Tagalog ang “iniaalay ang buhay” kaysa sa literal na “inilalagay,” habang naipahahayag ang kusang pagsasakripisyo.
- source_word: ἵνα
  choice: upang
  rationale: Pinananatili ang layuning ipinahahayag ng sugnay nang hindi labis na tinutukoy kung layunin lamang o kalakip na resulta.
- source_word: πάλιν λάβω αὐτήν
  choice: muli ko itong kunin
  rationale: Ang “muli” ay tumutugma sa πάλιν, at pinananatili ng “kunin” ang aktibong diwa ng λαμβάνω nang hindi tahasang dinaragdagan ang ideya ng ‘muling mabuhay.’
theological_decisions:
- issue: Kahulugan ng ψυχή sa pahayag tungkol sa kusang kamatayan ni Jesus
  choice: aking buhay
  alternative: aking kaluluwa
  rationale: Ang konteksto ay ang buhay na ibinibigay sa kamatayan at muling kinukuha. Ang “kaluluwa” ay maaaring magpasok ng paghahating katawan-kaluluwa na hindi siyang diin ng talata.
- issue: Diwa ng ἵνα kasama ng subjunctive na λάβω
  choice: upang muli ko itong kunin
  alternative: para muli ko itong kunin; upang muli ko itong tanggapin
  rationale: Ang “upang” ay nagpapanatili sa layuning diwa ng ἵνα, samantalang hindi nito ginagawang payak na hulang panghinaharap ang sugnay. Ang “kunin” ay nagpapanatili rin sa aktibong diwa na makikita sa konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “iniibig” at “sapagkat” bilang angkop na biblikal na pananalita na nananatiling madaling maunawaan. Ang marker na [a] ay inilagay sa sugnay na may kaugnayan sa parehong pagbanggit sa buhay.
