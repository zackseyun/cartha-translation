  to: Walang sinumang kumukuha nito mula sa akin; sa halip, ako mismo ang kusang nagbibigay nito.[a] May awtoridad[b] akong ibigay ito, at may awtoridad akong kunin itong muli.[c] Ang utos na ito ay tinanggap ko mula sa aking Ama.
  rationale: Nilinaw ang ἀπ’ ἐμοῦ bilang “mula sa akin” at ginawang mas likas ang paghahatid ng boluntaryong personal na pagkilos na ipinahahayag ng ἐγώ at ἀπ’ ἐμαυτοῦ. Walang idinagdag na teolohikal na pagpapakahulugan; nananatili ang tension sa pagitan ng kusang pagkilos ni Jesus at ng utos na tinanggap niya mula sa Ama. Napanatili rin ang mga angkla at saklaw ng mga talababa.
