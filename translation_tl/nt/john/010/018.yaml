  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὐδεὶς ⸀αἴρει αὐτὴν ἀπ’ ἐμοῦ, ἀλλ’ ἐγὼ τίθημι αὐτὴν ἀπ’ ἐμαυτοῦ. ἐξουσίαν ἔχω θεῖναι αὐτήν, καὶ ἐξουσίαν ἔχω πάλιν λαβεῖν αὐτήν· ταύτην τὴν ἐντολὴν ἔλαβον παρὰ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/018.yaml
  text: No one takes it from me[a], but I lay it down of myself. I have authority to lay it down, and I have authority to take it up again[c][b]. This command I received from my Father.
translation:
  language: tl
  text: Walang sinumang kumukuha nito mula sa akin; sa halip, ako mismo ang kusang nagbibigay nito.[a] May awtoridad[b] akong ibigay ito, at may awtoridad akong kunin itong muli.[c] Ang utos na ito ay tinanggap ko mula sa aking Ama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang “ako mismo ang kusang nagbibigay nito” na “ibinibigay ko ito mula sa sarili ko” o “ibinibigay ko ito sa sarili kong pagkukusa.” Binibigyang-diin ng parirala na kusang ibinibigay ni Jesus ang kanyang buhay.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Griyego ay maaari ring isaling “kapangyarihan” o “karapatan”; maaari nitong saklawin kapwa ang kakayahan at ang lehitimong pahintulot na kumilos.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin na “tanggapin itong muli.” Ang “ito” ay tumutukoy sa buhay ni Jesus; ihambing ang Juan 10:17.
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: αἴρει αὐτὴν ἀπ’ ἐμοῦ
  choice: kumukuha nito sa akin
  rationale: Ipinananatili nito ang diwa ng pagkuha o pag-aalis ng buhay ni Jesus mula sa kanya, habang ang panghalip na “nito” ay natural na tumutukoy sa kanyang buhay sa naunang talata.
- source_word: τίθημι αὐτὴν
  choice: ibinibigay ko ito
  rationale: Sa konteksto ng pagbibigay ng sariling buhay, ang literal na “inilalagay ko ito” ay hindi likas sa modernong Tagalog. Ang “ibinibigay” ay malinaw at marangal na naghahatid ng kusang pagsasakripisyo nang hindi nagdaragdag ng denominasyonal na paliwanag.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: kusa ko
  rationale: Likas na ipinahahayag sa Tagalog ang sariling pagkukusa at personal na pagkilos ni Jesus. Hindi nito ipinahihiwatig na hiwalay siya sa kalooban ng Ama, sapagkat binabanggit agad ang utos ng Ama.
- source_word: ἐξουσίαν
  choice: awtoridad
  rationale: Saklaw ng ἐξουσία ang lehitimong karapatan at kapangyarihang kumilos. Ang “awtoridad” ang pinakamainam na nagpapanatili sa ugnayan ng sariling pagkilos ni Jesus at ng utos mula sa Ama.
- source_word: πάλιν λαβεῖν αὐτήν
  choice: kunin itong muli
  rationale: Pinananatili ng “kunin” ang aktibong puwersa ng λαβεῖν at ng “muli” ang πάλιν. Hindi nito tahasang nilulutas ang leksikal na posibilidad na “tanggapin itong muli.”
- source_word: ἐντολήν
  choice: utos
  rationale: Ang “utos” ang tuwiran at karaniwang katumbas ng ἐντολή at pinananatili ang hayag na ugnayan sa pagitan ng Ama at ng Anak.
- source_word: παρὰ τοῦ πατρός μου
  choice: mula sa aking Ama
  rationale: Ang παρά na may genitive ay nagsasaad ng pinagmulan; natural at tumpak itong naihahatid ng “mula sa aking Ama.”
theological_decisions:
- issue: Ang kusang pagbibigay ni Jesus ng kanyang buhay kaugnay ng utos ng Ama
  choice: kusa ko itong ibinibigay … utos na ito ay tinanggap ko mula sa aking Ama
  alternative: sa sarili kong pagkukusa … tagubilin mula sa aking Ama
  rationale: Sabay na pinananatili ang tunay na kusang pagkilos ni Jesus at ang kanyang pagkilos ayon sa utos ng Ama, nang hindi ginagawang pagsasarili sa Ama ang ἀπ’ ἐμαυτοῦ.
- issue: Kahulugan ng ἐξουσία sa kamatayan at muling pagkuha ng buhay ni Jesus
  choice: awtoridad
  alternative: kapangyarihan; karapatan
  rationale: Hindi lamang kakayahan ang ipinahahayag ng talata kundi lehitimong karapatang kumilos. Gayunman, kinikilala sa talababa na maaaring saklawin ng salita ang kapangyarihan at karapatan.
- issue: Tinutukoy ng αὐτήν
  choice: nito / ito
  alternative: ang aking buhay
  rationale: Ang panghalip ay tumutukoy sa “aking buhay” sa agarang konteksto ng Juan 10:17. Ang pagpapanatili ng panghalip ay sumusunod sa anyo ng Griyego at umiiwas sa di-kailangang pag-uulit.
- issue: Puwersa ng πάλιν λαβεῖν αὐτήν
  choice: kunin itong muli
  alternative: tanggapin itong muli; bawiin itong muli
  rationale: Pinananatili ang aktibong pagkilos na maaaring ipahiwatig ng λαμβάνω, ngunit hindi itinatanggi ang posibilidad na “tanggapin”; inilalahad ang leksikal na alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling basahin. Ginamit ang “awtoridad” bilang karaniwang salitang Filipino para sa lehitimong kapangyarihan. Isinalin ang idyomatikong “paglalagak ng buhay” bilang “pagbibigay” upang maging natural sa Tagalog, habang pinanatili sa “kusa” ang diin sa boluntaryong pagkilos.
