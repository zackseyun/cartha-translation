  text: καθὼς γινώσκει με ὁ πατὴρ κἀγὼ γινώσκω τὸν πατέρα, καὶ τὴν ψυχήν μου τίθημι ὑπὲρ τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/015.yaml
  text: just as the Father knows me and I know the Father[b][a], and I lay down my life for the sheep.
translation:
  language: tl
  text: kung paanong kilala ako ng Ama at kilala ko ang Ama, ibinibigay ko ang aking buhay[a] para sa mga tupa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “aking kaluluwa.” Sa kontekstong ito, ang kahulugan ay “aking buhay,” na ibinibigay sa kamatayan.
    reason: lexical_alternative
  - marker: b
    text: O “alang-alang sa mga tupa.” Ang salitang Griyego ay maaaring magpahiwatig ng pagkilos para sa kapakanan ng mga tupa, na may kinatawan o sakripisyal na diwa.
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς
  choice: kung paanong
  rationale: Likas na naghuhudyat sa Filipino ng mahigpit na paghahambing at nag-uugnay sa naunang pahayag tungkol sa pagkakilala ng pastol at ng mga tupa.
- source_word: γινώσκει / γινώσκω
  choice: kilala / kilala
  rationale: Pinananatili ang pag-uulit ng pandiwa at ang relasyonal na diwa ng pagkakilala sa pagitan ng Ama at ng Anak, nang hindi ito labis na ipinapaliwanag.
- source_word: ὁ πατὴρ / τὸν πατέρα
  choice: ang Ama
  rationale: Tumutugma sa tiyak na anyo ng Griyego at pinananatili ang magkatimbang na ayos ng dalawang sugnay.
- source_word: κἀγὼ
  choice: at ... ko
  rationale: Ang κἀγώ ay καί + ἐγώ; ang likas na ayos sa Filipino na “at kilala ko” ay nagpapanatili sa koordinasyon at paralelismo.
- source_word: τὴν ψυχήν μου
  choice: ang aking buhay
  rationale: Sa konteksto ng kusang pagkamatay ng mabuting pastol, ang ψυχή ay tumutukoy sa buhay na ibinibigay, hindi lamang sa di-materyal na “kaluluwa.”
- source_word: τίθημι
  choice: iniaalay ko
  rationale: Sa pariralang τίθημι τὴν ψυχήν, ipinahihiwatig ang kusa at sakripisyal na pagbibigay ng buhay. Mas natural ito sa Filipino kaysa sa literal na “inilalapag,” habang pinananatili ang patuloy o tiyak na pagkilos ng pangkasalukuyang anyo.
- source_word: ὑπὲρ
  choice: para sa
  rationale: 'Likas at malawak ang “para sa”: naipahahayag nito ang kapakinabangan at sakripisyal o kinatawang bisa nang hindi nililimitahan sa isang teknikal na doktrinal na pormula.'
- source_word: τῶν προβάτων
  choice: sa mga tupa
  rationale: Pinananatili ang tahasang larawan ng mga tupa na mahalaga sa talinghaga ng mabuting pastol; hindi ito pinalitan ng mas pangkalahatang “kawan.”
theological_decisions:
- issue: Bisa ng ὑπὲρ sa pag-aalay ni Jesus ng sarili
  choice: Isinalin na “para sa” upang mapanatili ang sakripisyal at kinatawang lawak ng pahayag.
  alternative: “alang-alang sa” o “bilang kapalit ng”
  rationale: Ipinapahayag ng teksto na ang pagbibigay ni Jesus ng buhay ay para sa kapakanan ng mga tupa at may sakripisyal na bisa. Hindi tahasang nililimitahan ng ὑπέρ dito ang kahulugan sa iisang teknikal na paliwanag, kaya pinananatili ang tensiyong teolohikal.
- issue: Kahulugan ng ψυχή sa konteksto
  choice: “buhay”
  alternative: “kaluluwa”
  rationale: Ang konteksto ay ang kusang pagkamatay ng mabuting pastol para sa mga tupa. Ang “buhay” ang malinaw at kontekstuwal na kahulugan, samantalang maaaring magpahiwatig ang “kaluluwa” ng antropolohiyang hindi siyang punto ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kilala” upang maging natural ang relasyonal na pagkakilala, at “iniaalay” upang maipahayag ang idyomatikong diwa ng kusang pagbibigay ng buhay. Ang mga panandang [a] at [b] ay kapuwa nasa pangunahing teksto at tumutugma sa mga talababa.
