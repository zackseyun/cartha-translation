  naturalness: Natural ang “kung paanong kilala ako ng Ama at kilala ko ang Ama.” Mas maayos ang kuwit kaysa tuldok-kuwit, sapagkat magkaugnay ang paghahambing at ang kasunod na pahayag. Ang “ibinibigay ko ang aking buhay” ay malinaw at likas sa makabagong Filipino.
  terminology: Ang “Ama,” “buhay,” at “mga tupa” ay angkop at pinananatili ang mahalagang terminolohiyang Juanino. Ang “para sa” ay wastong malawak na salin ng ὑπέρ. Inayos ang talababa upang ipahayag ang posibleng sakripisyal/kinatawang puwersa nang hindi maging teknikal o di-natural ang pananalita.
  issues:
  - severity: low
    issue: Ang “iniaalay ko” ay mas interpretatibo kaysa kinakailangan para sa τίθημι τὴν ψυχήν.
    rationale: Bagaman ang konteksto ay sakripisyal, ang pandiwang Griyego ay literal na “ilagay/ibigay” sa idyomang “ibigay ang buhay.” Ang “ibinibigay ko” ay mas malapit at hindi nagdaragdag ng liturhikal na kulay.
  - severity: low
    issue: Hindi natural ang tuldok-kuwit sa pagitan ng magkaugnay na mga sugnay.
    rationale: Mas angkop ang kuwit sa Filipino at mas malinaw nitong ipinakikitang ang ikalawang sugnay ang pangunahing pahayag na kaugnay ng “kung paanong.”
  - severity: low
