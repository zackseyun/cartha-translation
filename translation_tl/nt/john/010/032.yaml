  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Πολλὰ ⸂ἔργα καλὰ ἔδειξα ὑμῖν⸃ ἐκ τοῦ ⸀πατρός· διὰ ποῖον αὐτῶν ἔργον ⸂ἐμὲ λιθάζετε⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/032.yaml
  text: Jesus answered them[a], “I showed you many good works from the Father[b]; for which of them are you stoning me?”
translation:
  language: tl
  text: Sumagot sa kanila si Jesus, “Maraming mabubuting gawa mula sa Ama ang ipinakita ko sa inyo. Dahil sa alin sa mga gawang iyon ninyo ako binabato ng bato?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: Sumagot
  rationale: Likas at karaniwang salin sa salaysay para sa pagtugon sa sinabi o ginawa ng kausap.
- source_word: Πολλὰ ἔργα καλὰ
  choice: Maraming mabubuting gawa
  rationale: Pinananatili ng “mga gawa” ang mahalagang bokabularyo ni Juan para sa mga ginawa ni Jesus, samantalang ipinahahayag ng “mabubuti” ang kapaki-pakinabang at kapuri-puring diwa ng καλὰ.
- source_word: ἔδειξα
  choice: ipinakita ko
  rationale: Tuwirang inilalarawan ang pagpapamalas ni Jesus ng mga gawa sa kanila at natural sa makabagong Filipino.
- source_word: ἐκ τοῦ πατρός
  choice: mula sa Ama
  rationale: Pinananatili ang pinagmulan ng mga gawa at hindi idinaragdag ang panghalip na “aking,” na wala sa tekstong Griyego.
- source_word: διὰ ποῖον αὐτῶν ἔργον
  choice: Alin sa mga iyon ang dahilan kung bakit
  rationale: Malinaw at natural na ipinahahayag ang sanhi o batayan na tinutukoy ng διά, habang ang “mga iyon” ay tumutukoy pabalik sa maraming mabubuting gawa.
- source_word: ἐμὲ λιθάζετε
  choice: binabato ninyo ako
  rationale: Pinananatili ang tahasang kasalukuyang kilos ng pandiwa at iniiwasang idagdag ang interpretibong “tinatangkang.” Sa konteksto, nauunawaan itong pagbato ng mga bato upang patayin.
theological_decisions:
- issue: Pagtukoy sa “Ama” sa pananalita ni Jesus
  choice: mula sa Ama
  alternative: mula sa aking Ama
  rationale: Walang μου (“aking”) sa SBLGNT. Hindi dapat palakasin ng salin ang pahayag tungkol sa ugnayan ni Jesus sa Ama nang higit sa aktuwal na anyo ng talata, bagaman malinaw pa rin ito sa konteksto.
- issue: Ugnayan ng mga gawa ni Jesus sa Ama
  choice: Panatilihin ang “mula sa Ama” bilang pinagmulan
  alternative: sa ngalan ng Ama
  rationale: Ang ἐκ ay pangunahing nagsasaad ng pinagmulan. Ang “sa ngalan ng Ama” ay maaaring magpaliit sa diwa tungo lamang sa awtorisasyon o pagkatawan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mabubuting gawa” upang mapanatili ang bokabularyong teolohikal ni Juan nang hindi nagiging lipas o teknikal. Walang talababa dahil walang kinakailangang tekstuwal o leksikal na paliwanag sa mismong salin; ang mga talababa sa English consultation layer ay hindi tumutugma nang maayos sa mga marker nito at hindi ipinilit sa Tagalog draft.
