base_translation:
  language: en
  yaml_path: translation/nt/john/010/004.yaml
  text: When he has brought out all his own[a], he goes before them, and the sheep follow him, because they know his voice.
translation:
  language: tl
  text: Kapag nailabas na niya ang lahat ng sarili niyang mga tupa[a], nauuna siya sa kanila, at sumusunod sa kaniya ang mga tupa dahil kilala nila ang kaniyang tinig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “itinaboy niya palabas” o “inakay niya palabas”; ang pandiwang Griyego ay maaaring magpahiwatig ng pagtataboy o paglalabas mula sa isang kulungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: Kapag
  rationale: Likas na nagpapahayag ng di-tiyak o pangkalahatang panahong kondisyon sa Tagalog at angkop sa subjunctive na sugnay.
- source_word: τὰ ἴδια πάντα
  choice: ang lahat ng sariling kaniya
  rationale: Pinananatili ang idyomang tumutukoy sa lahat ng pag-aari ng pastol nang hindi inuulit nang maaga ang salitang “mga tupa,” na tahasang lumilitaw sa kasunod na sugnay.
- source_word: ἐκβάλῃ
  choice: nailabas na niya
  rationale: Ipinahahayag ang ganap na paglalabas mula sa kulungan. Hindi nito ipinapalagay na marahas ang kilos, ngunit itinatala sa talababa ang maaaring mas mariing diwa ng pandiwa.
- source_word: ἔμπροσθεν αὐτῶν πορεύεται
  choice: nauuna siya sa kanila
  rationale: Natural na Tagalog para sa larawang ang pastol ay pumupunta sa unahan at nangunguna sa mga tupa.
- source_word: τὰ πρόβατα αὐτῷ ἀκολουθεῖ
  choice: sumusunod sa kaniya ang mga tupa
  rationale: Tuwirang inililipat ang kilos at ang layon ng pagsunod sa malinaw at likas na ayos sa Tagalog.
- source_word: ὅτι οἴδασιν τὴν φωνὴν αὐτοῦ
  choice: dahil kilala nila ang kaniyang tinig
  rationale: Ang “kilala” ay likas sa Tagalog kapag ang tinutukoy ay pagkilala sa tinig, habang pinananatili ang diwang may pamilyar na kaalaman dito.
theological_decisions:
- issue: Larawan ng pagpapastol at lakas ng ἐκβάλῃ
  choice: nailabas na niya
  alternative: naipagtabuyan na niya palabas; naakay na niya palabas
  rationale: Sa konteksto, inilalabas ng pastol ang sarili niyang mga tupa mula sa kulungan. Ang pangunahing salin ay hindi nag-aangkat ng pahiwatig na malupit o mapilit ang kilos, samantalang ang talababa ay nagpapanatili sa mas malakas na posibleng lakas ng pandiwang Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tinig” sa halip na “boses” upang panatilihin ang dignidad ng pastoral na larawan, at “kaniyang” bilang pormal ngunit karaniwang anyo.
