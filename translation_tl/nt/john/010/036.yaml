  text: ὃν ὁ πατὴρ ἡγίασεν καὶ ἀπέστειλεν εἰς τὸν κόσμον ὑμεῖς λέγετε ὅτι Βλασφημεῖς, ὅτι εἶπον· Υἱὸς τοῦ θεοῦ εἰμι;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/036.yaml
  text: do you say of the one whom the Father sanctified and sent into the world[a], ‘You are blaspheming,’ because I said, ‘I am the Son of God’?”
translation:
  language: tl
  text: Sinasabi ba ninyo tungkol sa kanya na itinalaga ng Ama bilang banal[a] at isinugo sa sanlibutan, ‘Lumalapastangan ka,’ dahil sinabi ko, ‘Ako ang Anak ng Diyos’?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinabanal,” “inilaan,” o “ibinukod.”
    reason: Ipinakikita ang leksikal na lawak ng ἡγίασεν at pinananatili ang posibilidad ng pagtatalaga o paglalaan para sa banal na layunin.
lexical_decisions:
- source_word: ἡγίασεν
  choice: itinalaga bilang banal
  rationale: Sinasaklaw nito ang diwa ng paglalaan o pagtatalaga bilang banal para sa isang layunin, habang pinananatili ang ugnayan ng ἁγιάζω sa kabanalan. Iniiwasan din nitong ipahiwatig na ginawang mas mabuti sa moral ang Anak.
- source_word: ἀπέστειλεν
  choice: isinugo
  rationale: Likas at marangal na katumbas ito ng 'ipinadala' sa konteksto ng misyong ibinigay ng Ama, at pinananatili ang karaniwang wika ng pagsusugo sa Juan.
- source_word: κόσμον
  choice: sanlibutan
  rationale: Karaniwang salin ito ng κόσμος sa makabagong wikang biblikal at angkop sa teolohikal na gamit nito sa Juan.
- source_word: Βλασφημεῖς
  choice: Lumalapastangan ka
  rationale: Ang pangkasalukuyang anyo ay natural na naipapahayag sa Tagalog bilang isang tuwirang paratang. Ang 'lumalapastangan' ay malinaw na tumutukoy sa paglapastangan sa Diyos sa kontekstong ito.
- source_word: Υἱὸς τοῦ θεοῦ
  choice: ang Anak ng Diyos
  rationale: Pinananatili nito ang bigat ng pariralang kristolohikal at ang tiyak na titularyong gamit sa konteksto.
- source_word: ὃν ὁ πατὴρ
  choice: tungkol sa kanya na ... ng Ama
  rationale: Natural sa Tagalog ang ganitong ayos at malinaw na ang tinutukoy ay ang nagsasalita, nang hindi dinaragdagan ang teksto.
- source_word: ὅτι ... ὅτι
  choice: sinasabi ba ninyo ... dahil sinabi kong
  rationale: Ang unang ὅτι ay ipinahihiwatig ng tuwirang sipi, samantalang ang ikalawa ay malinaw na nagsasaad ng dahilan ng paratang.
theological_decisions:
- issue: Kahulugan ng ἡγίασεν kaugnay ng Anak
  choice: itinalaga bilang banal
  alternative: pinabanal; inilaan; ibinukod
  rationale: Ipinakikita ng konteksto ang paglalaan ng Ama sa Anak para sa pagsusugo, ngunit pinananatili ng salin ang tahasang kaugnayan sa kabanalan. Hindi nito ipinahihiwatig na dati siyang marumi o kulang sa kabanalan.
- issue: Kristolohikal na bigat ng Υἱὸς τοῦ θεοῦ
  choice: ang Anak ng Diyos
  alternative: Anak ako ng Diyos; Anak ng Diyos ako
  rationale: Ang may pantukoy na anyo ay natural sa Tagalog at pinananatili ang bigat ng titulo sa konteksto ng paratang na paglapastangan, nang hindi nagdaragdag ng doktrinang wala sa mismong pangungusap.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “isinugo” at “sanlibutan” bilang pamilyar ngunit kasalukuyan pa ring mga terminong biblikal; iniwasan ang labis na teknikal o denominasyonal na pananalita.
