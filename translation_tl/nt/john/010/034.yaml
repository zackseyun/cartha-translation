base_translation:
  language: en
  yaml_path: translation/nt/john/010/034.yaml
  text: Jesus answered them[a], “Is it not written in your Law, ‘I said, you are gods’?”
translation:
  language: tl
  text: 'Sumagot si Jesus sa kanila, “Hindi ba nasusulat sa inyong Kautusan: ‘Sinabi ko: Kayo ay mga diyos’?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga nilalang na may pagka-diyos.” Sinisipi ni Jesus ang Awit 82:6, kung saan pinagtatalunan ang kahulugan ng katawagang ito; pinananatili sa pangunahing teksto ang tuwirang pananalita ng sipi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς
  choice: Sumagot sa kanila
  rationale: Likas at tuwirang salin ng pandiwang pasalaysay at ng di-tuwirang layon sa makabagong Filipino.
- source_word: Οὐκ ἔστιν γεγραμμένον
  choice: Hindi ba nasusulat
  rationale: Pinananatili ang anyong retorikal na tanong at ang kasalukuyang bisa ng pormulang ginagamit sa pagsipi sa Kasulatan.
- source_word: ἐν τῷ νόμῳ ὑμῶν
  choice: sa inyong Kautusan
  rationale: Ang Kautusan dito ay tumutukoy nang malawak sa kinikilalang Kasulatan ng mga kausap ni Jesus, yamang ang sipi ay mula sa Awit 82:6.
- source_word: Ἐγὼ εἶπα
  choice: Sinabi ko
  rationale: Tuwirang isinasalin ang tahasang panghalip at pandiwa nang hindi nagdaragdag ng diin na wala namang kailangang ipahayag sa Filipino.
- source_word: Θεοί ἐστε
  choice: Kayo ay mga diyos
  rationale: Pinananatili ang tuwirang leksikal na kahulugan at ang tensiyong interpretatibo ng sipi sa halip na palitan ito ng paliwanag.
theological_decisions:
- issue: Pagkasalin sa θεοί sa pagsipi ni Jesus sa Awit 82:6
  choice: mga diyos
  alternative: mga banal na nilalang
  rationale: Ang “mga diyos” ang pinakatuwirang katumbas at nagpapanatili sa retorikal na lakas at tunay na kalabuan ng sipi. Ang alternatibo ay inilalagay sa talababa upang hindi tahimik na lutasin ang pinagtatalunang pakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Kautusan” bilang katawagan sa Kasulatan sa kontekstong ito, at pinanatili ang nakagugulat na “mga diyos” sa pangunahing teksto upang hindi gawing interpretatibong paraphrase ang sipi.
