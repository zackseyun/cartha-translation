source:
  edition: SBLGNT
  text: Καὶ ἀπῆλθεν πάλιν πέραν τοῦ Ἰορδάνου εἰς τὸν τόπον ὅπου ἦν Ἰωάννης τὸ πρῶτον βαπτίζων, καὶ ἔμεινεν ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/040.yaml
  text: And he went away again across the Jordan to the place where John had first been baptizing[a], and he stayed there.
translation:
  language: tl
  text: At muli siyang pumunta sa kabilang panig ng Jordan, sa lugar kung saan unang nagbabautismo si Juan noon, at nanatili siya roon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆλθεν πάλιν
  choice: muling ... pumunta
  rationale: Ipinahahayag ng parirala ang pag-alis at muling pagpunta; natural sa Tagalog ang paghahati nito sa “muling tumawid ... at pumunta” ayon sa kasunod na patutunguhan.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: tumawid ... sa Jordan
  rationale: Ipinahihiwatig ng πέραν na nasa kabilang panig ang patutunguhan. Sa konteksto ng pagkilos, malinaw at likas sa modernong Tagalog ang “tumawid sa Jordan.”
- source_word: εἰς τὸν τόπον
  choice: pumunta sa lugar
  rationale: Ang εἰς ay nagsasaad ng pagkilos patungo sa isang destinasyon; tuwiran at natural ang “pumunta sa lugar.”
- source_word: ὅπου ἦν Ἰωάννης τὸ πρῶτον βαπτίζων
  choice: kung saan unang nagbabautismo si Juan
  rationale: Pinananatili nito ang naunang panahon at ang nagpapatuloy na gawain ni Juan nang hindi gumagamit ng mabigat o di-likas na anyong pandiwa sa Tagalog.
- source_word: ἔμεινεν ἐκεῖ
  choice: Nanatili siya roon
  rationale: Tumpak na ipinahahayag ng “nanatili” ang μένω at ang “roon” ang ἐκεῖ, sa dignified at karaniwang gamit.
theological_decisions:
- issue: Hindi tahasang pinangalanan ang simuno sa Griyego
  choice: si Jesus
  alternative: siya
  rationale: Malinaw sa konteksto na si Jesus ang simuno. Ang pagbanggit sa pangalan ay natural sa Tagalog sa simula ng talata at umiiwas sa malabong reperensiya nang walang idinaragdag na doktrina.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignified, at natural. Ginamit ang “nagbabautismo,” ang karaniwang terminong biblikal, at iniwasan ang mas lumang ayos na “sa ibayo ng Jordan” dahil mas malinaw dito ang aktuwal na pagtawid.
