revisions:
- from: At muling tumawid si Jesus sa Jordan at pumunta sa lugar kung saan unang nagbabautismo si Juan. Nanatili siya roon.
  to: At muli siyang pumunta sa kabilang panig ng Jordan, sa lugar kung saan unang nagbabautismo si Juan noon, at nanatili siya roon.
