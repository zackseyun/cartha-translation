  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ μὴ εἰσερχόμενος διὰ τῆς θύρας εἰς τὴν αὐλὴν τῶν προβάτων ἀλλὰ ἀναβαίνων ἀλλαχόθεν ἐκεῖνος κλέπτης ἐστὶν καὶ λῃστής·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/001.yaml
  text: Truly[a], truly, I say to you, the one who does not enter through the door into the sheepfold[c][b], but climbs up from somewhere else—that man is a thief and a robber.
translation:
  language: tl
  text: '“Tunay na tunay, sinasabi ko sa inyo: Ang hindi pumapasok sa kulungan ng mga tupa sa pamamagitan ng pintuan[a], kundi umaakyat mula sa ibang dako—siya ay magnanakaw at tulisan[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tarangkahan.” Ang Griyegong θύρα ay maaaring tumukoy sa pinto o tarangkahan, ayon sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: Magkaiba ang mga salitang Griyego para sa “magnanakaw” (κλέπτης) at “tulisan” (λῃστής); ang ikalawa ay madalas na nagpapahiwatig ng mas marahas o sapilitang uri ng pagnanakaw.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: Katotohanang-katotohanan
  rationale: Pinananatili ang mariing pag-uulit at taimtim na bigat ng pambungad na pormula, sa likas at madaling maunawaang modernong Tagalog.
- source_word: λέγω ὑμῖν
  choice: sinasabi ko sa inyo
  rationale: Tuwirang inililipat ang pormula ng pagsasalita at ang maramihang ὑμῖν.
- source_word: ὁ μὴ εἰσερχόμενος
  choice: ang hindi pumapasok
  rationale: Pinananatili ang pangkalahatang isahang pagtukoy ng substantival participle nang hindi gumagamit ng makalumang pananalita.
- source_word: διὰ τῆς θύρας
  choice: sa pamamagitan ng pintuan
  rationale: Ang θύρα ay maaaring pinto o tarangkahan; pinili ang “pintuan” bilang tuwirang katumbas habang itinatala sa talababa ang alternatibo.
- source_word: εἰς τὴν αὐλὴν τῶν προβάτων
  choice: sa kulungan ng mga tupa
  rationale: Sa kontekstong pastoral, likas na ipinahahayag ng “kulungan ng mga tupa” ang isang nababakurang αὐλή na kinalalagyan ng mga tupa.
- source_word: ἀλλὰ ἀναβαίνων ἀλλαχόθεν
  choice: kundi umaakyat mula sa ibang dako
  rationale: Pinananatili ng “umaakyat” ang larawan ng pag-akyat o paglampas sa harang, at ng “mula sa ibang dako” ang lokatibong diwa ng ἀλλαχόθεν.
- source_word: ἐκεῖνος
  choice: siya
  rationale: Likas sa Tagalog ang resumptive na “siya” matapos ang paksang nasa unahan; naipahihiwatig pa rin nito ang tiyak na pagkilala sa taong tinutukoy nang hindi nagdaragdag ng salitang “lalaki.”
- source_word: κλέπτης
  choice: magnanakaw
  rationale: Karaniwang katumbas para sa taong palihim na nagnanakaw.
- source_word: λῃστής
  choice: tulisan
  rationale: Ibinubukod ito sa κλέπτης at ipinahihiwatig ang pagnanakaw sa pamamagitan ng dahas o hayagang pananalakay.
theological_decisions:
- issue: Metaporikal na larawan ng αὐλή at θύρα
  choice: Isinalin nang kongkreto bilang “kulungan ng mga tupa” at “pintuan,” nang walang paliwanag na alegorikal.
  alternative: “Bakuran ng mga tupa” at “tarangkahan.”
  rationale: Ipinakikilala pa lamang ng talata ang larawang ipaliliwanag sa kasunod na konteksto; hindi dapat idagdag sa salin ang isang tiyak na interpretasyon hinggil kay Jesus, sa mga pinuno, o sa kaligtasan.
- issue: Kasarian at pangkalahatang puwersa ng ὁ μὴ εἰσερχόμενος at ἐκεῖνος
  choice: Ginamit ang “ang hindi pumapasok … siya,” na isahan ngunit hindi tahasang tinukoy ang kasarian.
  alternative: “Ang taong hindi pumapasok … ang taong iyon.”
  rationale: Bagaman panlalaki ang anyong Griyego, pangkalahatan ang gamit nito. Ang natural na Tagalog ay nakapagpapanatili ng isahan at tiyak na reperensiya nang hindi kailangang magdagdag ng kasariang hindi mahalaga sa pahayag.
- issue: Pagkakaiba ng κλέπτης at λῃστής
  choice: 'Pinanatili ang dalawang magkaibang katawagan: “magnanakaw at tulisan.”'
  alternative: “Magnanakaw at mandarambong.”
  rationale: 'Hindi dapat pag-isahin ang mga termino: ang ikalawa ay maaaring magpahiwatig ng mas hayagan o marahas na pagnanakaw, bagaman hindi kailangan ng salin na lubusang tukuyin ang antas ng dahas.'
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang taimtim at mariing pambungad, ang konkretong larawang pastoral, at ang pagkakaiba ng dalawang uri ng magnanakaw. Iniwasan ang makalumang “katotohanang sinasabi ko” at ang pagdaragdag ng alegorikal na paliwanag sa pangunahing teksto.
