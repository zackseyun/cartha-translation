  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ ⸀μισθωτὸς καὶ οὐκ ὢν ποιμήν, οὗ οὐκ ⸀ἔστιν τὰ πρόβατα ἴδια, θεωρεῖ τὸν λύκον ἐρχόμενον καὶ ἀφίησιν τὰ πρόβατα καὶ φεύγει— καὶ ὁ λύκος ἁρπάζει αὐτὰ καὶ ⸀σκορπίζει—
base_translation:
  language: en
  yaml_path: translation/nt/john/010/012.yaml
  text: The hired hand[a], who is not a shepherd and whose sheep are not his own, sees the wolf coming and leaves the sheep and flees—and the wolf snatches them and scatters them.
translation:
  language: tl
  text: Ang upahang manggagawa, na hindi pastol at hindi kanya ang mga tupa, ay nakikita ang lobong dumarating at iniiwan[a] ang mga tupa at tumatakas—at sinusunggaban sila ng lobo at pinapangangalat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “inaabandona.” Maaaring taglayin ng pandiwang “iniiwan” ang mas mariing diwa ng pag-abandona sa mga tupa sa gitna ng panganib.
    reason: lexical_alternative
lexical_decisions:
- source_word: μισθωτός
  choice: upahang manggagawa
  rationale: Tumutukoy sa taong nagtatrabaho kapalit ng sahod. Likas ito sa makabagong Filipino at pinananatili ang kaibahan niya sa tunay na pastol.
- source_word: οὐκ ὢν ποιμήν
  choice: na hindi pastol
  rationale: Isinalin ang participial construction bilang sugnay na panlarawan upang maging malinaw at natural sa Filipino habang pinananatiling tahasan na hindi siya pastol.
- source_word: οὗ οὐκ ἔστιν τὰ πρόβατα ἴδια
  choice: hindi kanya ang mga tupa
  rationale: Malinaw na ipinapahayag ang kawalan ng pagmamay-ari at personal na kaugnayan nang hindi dinaragdagan ang kahulugan.
- source_word: θεωρεῖ
  choice: nakakakita
  rationale: Sapat at natural itong paglalarawan sa pagkakita niya sa paparating na panganib.
- source_word: τὸν λύκον ἐρχόμενον
  choice: sa lobong dumarating
  rationale: Pinananatili ang malinaw at buhay na larawan ng lobong kasalukuyang papalapit.
- source_word: ἀφίησιν
  choice: iniiwan
  rationale: Direktang katumbas ito na maaari ring magpahiwatig ng pagpapabaya o pag-abandona sa harap ng panganib; inilalahad sa talababa ang mas mariing alternatibo.
- source_word: φεύγει
  choice: tumatakas
  rationale: Maikli at malinaw na ipinapakita ang paglayo dahil sa panganib.
- source_word: ἁρπάζει
  choice: sinusunggaban
  rationale: Ipinahihiwatig nito ang marahas at biglaang pagsakop ng mandaragit nang hindi ipinapalagay na nilalapa o pinapatay ang mga tupa.
- source_word: σκορπίζει
  choice: pinapangangalat
  rationale: Natural na ipinapahayag sa Filipino na dahil sa lobo ay nagkakawatak-watak ang mga tupa.
- source_word: πρόβατα
  choice: mga tupa
  rationale: Pinananatili ang kongkretong maramihang pangngalan at ang tuloy-tuloy na larawang pastoral.
theological_decisions:
- issue: Metaporikal na larawan ng pastol
  choice: Panatilihin ang literal na mga terminong “pastol,” “upahang manggagawa,” “mga tupa,” at “lobo” sa loob ng metapora.
  alternative: Palitan ang mga ito ng mga interpretatibong katawagang gaya ng “pinuno” o “tagapag-alaga.”
  rationale: Nakabatay ang Juan 10 sa isang tuloy-tuloy na larawang pastoral. Ang pagpapalit nito ng mga abstraktong paliwanag ay magpapahina sa metapora at magdaragdag ng interpretasyong hindi tahasang nasa Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Inilagay ang panandang [a] sa “iniiwan,” ang salitang talagang tinutukoy ng talababa. Pinanatili ang kasalukuyang aspekto ng magkakasunod na kilos upang maipakita ang kasiglahan ng salaysay.
