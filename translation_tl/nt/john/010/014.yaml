id: JHN.10.14
reference: John 10:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐγώ εἰμι ὁ ποιμὴν ὁ καλός, καὶ γινώσκω τὰ ἐμὰ καὶ ⸂γινώσκουσί με τὰ ἐμά⸃,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/014.yaml
  text: I am the good shepherd[a], and I know my own, and my own know me,
translation:
  language: tl
  text: Ako ang mabuting pastol, at kilala ko ang mga akin[a], at kilala ako ng mga akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang mga tupa ko.” Sa literal na Griyego, “ang mga akin” ang ginamit sa dalawang sugnay.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιμήν
  choice: pastol
  rationale: Ang “pastol” ang karaniwang tawag sa tagapag-alaga ng mga tupa at pinananatili nito ang konkretong larawan sa talinghaga. Iniiwasan ng saling ito ang mga kaugnayang pansimbahan na maaaring ipahiwatig ng ibang katawagan.
- source_word: καλός
  choice: mabuti
  rationale: Likas at malinaw sa makabagong Tagalog ang “mabuti,” at naipapahayag nito ang moral na kahusayan at pagiging karapat-dapat na taglay ng καλός sa kontekstong ito.
- source_word: γινώσκω / γινώσκουσί
  choice: kilala ko / kilala ako
  rationale: Ang “kilala” ay nagpapahayag ng personal at ugnayang pagkakilala, hindi lamang ng kaalamang pangkaisipan. Pinananatili rin nito ang gantihang ayos ng dalawang sugnay.
- source_word: τὰ ἐμὰ / τὰ ἐμά
  choice: ang mga akin
  rationale: Ang neuter plural na pang-uri ay literal na tumutukoy sa “mga akin” o sa mga kabilang kay Jesus. Bagaman medyo maigsi ang anyong ito sa Tagalog, nauunawaan ito at pinananatili ang sadyang hindi tahasang pagbanggit sa “mga tupa” sa mismong talata.
- source_word: ἐγώ εἰμι
  choice: Ako ang
  rationale: Ito ang natural na Tagalog na anyo ng tahasang pagpapakilala sa sarili na may panaguring “mabuting pastol,” habang nananatili ang diin sa nagsasalita.
- source_word: καί
  choice: at
  rationale: Pinananatili ng “at” ang payak at magkakasunod na pag-uugnay ng mga sugnay nang hindi nagdaragdag ng diing wala sa Griyego.
theological_decisions:
- issue: Paglalarawan sa gantihang pagkakilala ni Jesus at ng mga kabilang sa kanya nang hindi nagdaragdag ng isang mas tiyak na katawagan
  choice: ang mga akin
  alternative: ang mga tupa ko / ang mga kabilang sa akin
  rationale: Pinananatili ng “ang mga akin” ang wika ng pag-aari at ugnayan sa Griyego, pati ang pag-uulit nito sa dalawang sugnay. Hindi nito tahasang ipinapasok ang “mga tupa,” bagaman malinaw iyon sa mas malawak na konteksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang “pastol” bilang buhay na larawan at ang bahagyang maigsi ngunit makahulugang “mga akin” upang masundan ang anyo at sadyang lawak ng Griyego.
