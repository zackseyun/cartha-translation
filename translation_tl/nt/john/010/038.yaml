base_translation:
  language: en
  yaml_path: translation/nt/john/010/038.yaml
  text: But if I do them[a], even if you do not believe me, believe the works, so that you may know and continue to know that the Father is in me[c][b], and I am in the Father.
translation:
  language: tl
  text: Ngunit kung ginagawa ko ang mga iyon, kahit hindi ninyo ako paniwalaan, paniwalaan ninyo ang mga gawa, upang malaman ninyo at patuloy ninyong makilala na ang Ama ay nasa akin, at ako ay nasa Ama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, magkaiba ang anyo ng dalawang pandiwa na isinaling “malaman” at “patuloy na makilala.” Maaaring ipahiwatig nito ang pagdating sa pagkilala at ang patuloy na pagkilala.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιῶ
  choice: ginagawa ko ang mga iyon
  rationale: Pangkasalukuyang pandiwa ito at ang di-tahasang layon ay tumutukoy sa mga gawang binabanggit sa konteksto; idinagdag ang “ang mga iyon” para sa likas na linaw sa Tagalog.
- source_word: κἂν ἐμοὶ μὴ πιστεύητε
  choice: kahit hindi ninyo ako pinaniniwalaan
  rationale: Ang πιστεύω na may datibong ἐμοί ay maaaring tumukoy sa paniniwala sa sinasabi ni Jesus. Pinananatili ng “ako pinaniniwalaan” ang kaibahan nito sa kasunod na panawagang paniwalaan ang patotoo ng mga gawa.
- source_word: τοῖς ἔργοις πιστεύετε
  choice: paniwalaan ninyo ang mga gawa
  rationale: 'Tuwirang pinananatili ang masinsing pananalita ng Griyego: dapat tanggapin ang patotoong ibinibigay ng mga gawa, hindi sambahin o paglagakan ng pananampalataya ang mga ito.'
- source_word: ἔργοις
  choice: mga gawa
  rationale: Ang “mga gawa” ay likas at pinananatili ang mahalagang terminolohiyang Johannine; hindi ito pinalitan ng “mga tanda” sapagkat ἔργα, hindi σημεῖα, ang nasa teksto.
- source_word: ἵνα γνῶτε καὶ γινώσκητε
  choice: upang malaman ninyo at patuloy na makilala
  rationale: Ipinakikita ng “malaman” at “patuloy na makilala” ang posibleng pag-usad mula sa pagkabatid tungo sa nagpapatuloy na pagkilala, habang pinananatili ang dalawang anyo ng pandiwa sa Griyego.
- source_word: ἐν ἐμοὶ ὁ πατὴρ κἀγὼ ἐν τῷ πατρί
  choice: ang Ama ay nasa akin, at ako ay nasa Ama
  rationale: Pinananatili ng literal at likas na “nasa” ang magkatugong ἐν at ang teolohikal na puwersa ng kapuwa pananatili nang hindi ito ipinapaliwanag sa mismong salin.
- source_word: πατήρ
  choice: ang Ama
  rationale: May pantukoy ang Griyego at hindi nito tahasang sinasabing “aking Ama,” kaya “ang Ama” ang pinakamalapit na salin.
theological_decisions:
- issue: Kapuwa pananatili ng Ama at ng Anak
  choice: ang Ama ay nasa akin, at ako ay nasa Ama
  alternative: ang Ama ay kaisa ko, at ako ay kaisa ng Ama
  rationale: Pinananatili ang tahasang relasyonal at mahiwagang pananalita ni Juan nang hindi inilalagay sa teksto ang mas huling teknikal o pangkredong paliwanag.
- issue: Pagkakaiba ng dalawang anyo ng γινώσκω
  choice: malaman ninyo at patuloy na makilala
  alternative: malaman at maunawaan ninyo
  rationale: Hindi ginawang simpleng magkaibang kahulugan ang dalawang anyo; sa halip, maingat na ipinahihiwatig ang posibleng aspektuwal na pag-usad, habang kinikilala sa talababa na maaaring isalin nang mas payak.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “pinaniniwalaan” at “paniwalaan” upang mapanatili ang pag-uulit ng πιστεύω, at ang payak na “nasa” upang hindi labis na ipaliwanag ang teolohikal na pahayag.
