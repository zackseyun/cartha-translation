revisions:
- from: Ngunit kung ginagawa ko ang mga iyon, kahit hindi ninyo ako pinaniniwalaan, paniwalaan ninyo ang mga gawa, upang malaman ninyo at patuloy na makilala na ang Ama ay nasa akin, at ako ay nasa Ama.[a]
  to: Ngunit kung ginagawa ko ang mga iyon, kahit hindi ninyo ako paniwalaan, paniwalaan ninyo ang mga gawa, upang malaman ninyo at patuloy ninyong makilala na ang Ama ay nasa akin, at ako ay nasa Ama.[a]
  rationale: Pinalitan ang di-idiomatikong anyo ng pandiwa para sa mas likas na modernong Filipino, habang pinananatili ang pag-uulit ng “paniwalaan” na mahalaga sa daloy ng Griyego. Inalis ang hindi napatunayang pahayag tungkol sa mga baryanteng manuskrito at pinalitan ito ng maingat na paliwanag sa dalawang anyo ng pandiwang Griyego. Hindi binago ang kahulugan o ang relasyonal na pananalita tungkol sa Ama at kay Jesus.
