review_pass:
  verdict: revise
  source_fidelity: 'Ang pangunahing diwa ng Griyego ay naipahayag: ang mga gawa ni Jesus ang dapat tanggapin bilang patotoo, at pinananatili ang magkatugong pahayag na ang Ama ay nasa kanya at siya ay nasa Ama. Gayunman, ang kasalukuyang talababa ay maling inilalarawan ang usapin bilang isang baryanteng tekstuwal ng mga sinaunang manuskrito. Ang SBLGNT na ibinigay ay may γνῶτε καὶ γινώσκητε; ang pangunahing puntong dapat ipaliwanag ay ang dalawang magkaibang anyo ng pandiwa, hindi isang sinasabing alternatibong pagbasa ng manuskrito.'
  naturalness: Mas likas sa modernong Filipino ang “kahit hindi ninyo ako paniwalaan” kaysa “kahit hindi ninyo ako pinaniniwalaan.” Pinananatili rin nito ang sadyang pag-uulit ng pandiwang “paniwalaan,” na katapat ng pag-uulit ng πιστεύω sa Griyego.
  terminology: Ang “mga gawa” ay angkop para sa ἔργα at hindi dapat gawing “mga tanda.” Ang “ang Ama ay nasa akin, at ako ay nasa Ama” ay tapat, malinaw, at hindi nagpapasok ng paliwanag pangkredo. Ang “malaman ninyo at patuloy ninyong makilala” ay isang maingat na paraan upang katawanin ang aorist at present subjunctive nang hindi ipinipilit na ganap na tiyak ang aspektuwal na pagkakaiba.
  issues:
  - severity: medium
    issue: Hindi suportado ang pahayag ng talababa tungkol sa mga sinaunang manuskrito at alternatibong tekstuwal na pagbasa.
    rationale: Ang ibinigay na SBLGNT ay may parehong γνῶτε at γινώσκητε. Walang ibinigay na aparatong tekstuwal na magpapahintulot sa pahayag na may mga manuskritong may mas payak na anyo. Dapat gawing leksikal/aspektuwal na paliwanag ang talababa.
  - severity: low
    issue: Medyo hindi likas ang “kahit hindi ninyo ako pinaniniwalaan.”
    rationale: Bagaman nauunawaan, ang “kahit hindi ninyo ako paniwalaan” ay mas idiomatiko at mas direktang katumbas ng concessive subjunctive na κἂν ... μὴ πιστεύητε.
  revised_text: Ngunit kung ginagawa ko ang mga iyon, kahit hindi ninyo ako paniwalaan, paniwalaan ninyo ang mga gawa, upang malaman ninyo at patuloy ninyong makilala na ang Ama ay nasa akin, at ako ay nasa Ama.[a]
