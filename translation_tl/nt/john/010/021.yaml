  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀ἄλλοι ἔλεγον· Ταῦτα τὰ ῥήματα οὐκ ἔστιν δαιμονιζομένου· μὴ δαιμόνιον δύναται τυφλῶν ὀφθαλμοὺς ⸀ἀνοῖξαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/021.yaml
  text: Others were saying[a], “These words are not those of a demon-possessed man. A demon cannot open the eyes of the blind, can it?”
translation:
  language: tl
  text: Ngunit sinabi ng iba, “Ang mga salitang ito ay hindi mula sa isang sinasapian ng demonyo. Hindi kayang buksan ng isang demonyo ang mga mata ng mga bulag, hindi ba?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλοι
  choice: ang iba
  rationale: Likas na tumutukoy sa ibang pangkat na naiiba sa mga nagsalita sa naunang talata.
- source_word: ἔλεγον
  choice: sinabi
  rationale: Bagaman imperfect ang pandiwa at maaaring magpahiwatig ng patuloy o paulit-ulit na pagsasalita, ang payak na nakaraang anyo ang pinakanatural sa Filipino para sa salaysay na ito.
- source_word: Ταῦτα τὰ ῥήματα
  choice: ang mga salitang ito
  rationale: Tuwirang tumutukoy sa mga binigkas ni Jesus at pinananatili ang kongkretong diwa ng ῥήματα.
- source_word: οὐκ ἔστιν δαιμονιζομένου
  choice: ay hindi mula sa isang sinasapian ng demonyo
  rationale: Ipinahahayag nang natural sa Filipino ang ipinahihiwatig na pinagmulan ng mga salita, nang hindi dinaragdagan ang antas o paraan ng impluwensiya ng demonyo.
- source_word: μὴ ... δύναται
  choice: Kaya ba ...?
  rationale: Ang tanong sa Filipino, ayon sa konteksto, ay natural na nagpapahiwatig ng inaasahang sagot na hindi.
- source_word: δαιμόνιον
  choice: isang demonyo
  rationale: Tuwirang katumbas ng terminong Griyego at hindi ito pinapalambot bilang isang pangkalahatang masamang espiritu.
- source_word: τυφλῶν ὀφθαλμοὺς
  choice: ang mga mata ng mga bulag
  rationale: Pinananatili ang genitibong larawan at ang malinaw na ugnayan sa pagpapagaling sa lalaking ipinanganak na bulag.
- source_word: ἀνοῖξαι
  choice: buksan
  rationale: Pinananatili ang literal at kongkretong larawan ng pagbubukas ng mga mata sa halip na ipakahulugang ‘ibalik ang paningin.’
theological_decisions:
- issue: Paglalarawan sa δαιμονίζομαι at δαιμόνιον
  choice: sinasapian ng demonyo / isang demonyo
  alternative: inaalihan ng demonyo / isang demonyo
  rationale: Ang ‘sinasapian’ ay malinaw at karaniwang nauunawaan sa modernong Filipino, ngunit hindi tinutukoy nang higit sa teksto ang eksaktong mekanismo o antas ng kapangyarihan ng demonyo.
- issue: Lakas ng retorikal na tanong na may μή
  choice: Kaya ba ng isang demonyo na buksan ang mga mata ng mga bulag?
  alternative: Hindi kayang buksan ng isang demonyo ang mga mata ng mga bulag, hindi ba?
  rationale: Ang payak na tanong ay natural sa Filipino at, dahil sa konteksto, nananatiling malinaw na inaasahan ang sagot na hindi, nang hindi ginagawang tahasang pahayag ang tanong.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang ‘Ngunit’ upang ipakita ang pagsalungat ng pangkat na ito sa naunang mga nagsalita; iniwasan ang mas akademikong ‘demonisado’ at ang mas kolokyal na ayos.
