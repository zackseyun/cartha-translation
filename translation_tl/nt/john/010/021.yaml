  source_fidelity: Tumpak ang pagsasalin ng pangunahing mga termino, kabilang ang δαιμονιζομένου bilang “sinasapian ng demonyo,” δαιμόνιον bilang “demonyo,” at ang kongkretong larawan ng “buksan ang mga mata ng mga bulag.” Gayunman, ang simpleng “Kaya ba...?” ay maaaring basahin bilang bukás na tanong at hindi sapat na naipahihiwatig ang μή, na umaasa ng negatibong sagot.
