lexical_decisions:
- source_word: Ἐγένετο
  choice: ipinagdiwang
  rationale: Sa ugnay nito sa pangalan ng pista, natural na ipinapahayag sa Tagalog ang pagdaos ng pangyayari bilang “ipinagdiwang,” sa halip na ang mas literal ngunit asiwa na “nangyari.”
- source_word: τότε
  choice: Nang panahong iyon
  rationale: Malinaw at natural na panandang temporal sa makabagong Tagalog.
- source_word: τὰ ἐγκαίνια
  choice: ang Pista ng Pagtatalaga
  rationale: Isinasalin ang kahulugan ng katawagang Griyego at nililinaw na isang pista ito, habang inilalagay sa talababa ang karaniwang pangalang Hanukkah.
- source_word: ἐν τοῖς Ἱεροσολύμοις
  choice: sa Jerusalem
  rationale: Karaniwan at natural na anyong lokatibo sa Tagalog.
- source_word: χειμὼν ἦν
  choice: Taglamig noon
  rationale: Tuwiran, maikli, at natural na paglalarawan sa panahon; pinananatili rin ang daloy patungo sa kasunod na talata sa pamamagitan ng kuwit.
theological_decisions:
- issue: Pagkilala sa τὰ ἐγκαίνια
  choice: Pista ng Pagtatalaga sa pangunahing teksto
  alternative: Hanukkah
  rationale: Pinangungunahan ang kahulugan ng orihinal na katawagang Griyego nang hindi ipinapalit sa teksto ang karaniwan ngunit mas huling pangalan; ibinibigay ang Hanukkah sa talababa bilang tulong na pangkultura.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “ipinagdiwang” bilang natural na pagsasama ng eventive na Ἐγένετο at ng pista; hindi nito binabago ang historikal na diwa. Pinanatili ang pangwakas na kuwit dahil nagpapatuloy ang pangungusap sa kasunod na talata.
