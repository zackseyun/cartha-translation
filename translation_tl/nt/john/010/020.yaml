  text: But many of them were saying[a], “He has a demon and is insane. Why do you listen to him?”
translation:
  language: tl
  text: Ngunit marami sa kanila ang nagsasabi, “May demonyo siya at baliw siya. Bakit ninyo siya pinakikinggan?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: ang nagsasabi
  rationale: Ipinahihiwatig ng imperpektong panahunan ang nagpapatuloy o paulit-ulit na pagsasalita sa tagpo; likas itong naipapahayag sa Filipino sa pariralang “ang nagsasabi.”
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita ang pagsalungat sa naunang tugon ng ibang mga tagapakinig.
- source_word: πολλοὶ ἐξ αὐτῶν
  choice: marami sa kanila
  rationale: Likas na salin ng partitive expression at malinaw na tumutukoy sa isang malaking bahagi, hindi sa buong pangkat.
- source_word: Δαιμόνιον ἔχει
  choice: May demonyo siya
  rationale: Tuwiran at malinaw na pinananatili ang anyo ng paratang sa Griyego nang hindi ito pinalalawak tungo sa isang doktrinal na paliwanag.
- source_word: μαίνεται
  choice: nasisisiraan ng bait
  rationale: Sa konteksto, ipinahahayag nito ang paratang na wala siya sa wastong pag-iisip; ang pariralang ito ay malinaw at natural sa modernong Filipino.
- source_word: τί αὐτοῦ ἀκούετε;
  choice: Bakit ninyo siya pinakikinggan?
  rationale: Ang τί ay idiomatikong nangangahulugang “bakit” dito, at ang ἀκούω na may genitive ay angkop na isaling “pakinggan,” na tumutukoy sa pagbibigay-pansin sa sinasabi niya.
theological_decisions:
- issue: Paglalahad sa mapanirang paratang tungkol kay Jesus
  choice: May demonyo siya at nasisiraan ng bait
  alternative: Sinasapian siya ng demonyo at baliw siya
  rationale: Pinananatili ng salin ang dalawang tahasang paratang at ang tensiyon ng salaysay, ngunit hindi ginagawang mas interpretatibo ang “may demonyo” bilang “sinasapian.”
translation_notes:
  register: Modernong Filipino na malinaw, natural, at marangal. Ginamit ang “demonyo” bilang karaniwang terminong nauunawaan ng ordinaryong mambabasa, at “nasisisiraan ng bait” upang ihayag ang mapanirang paratang nang hindi gumagamit ng masyadong klinikal o lipas na pananalita.
