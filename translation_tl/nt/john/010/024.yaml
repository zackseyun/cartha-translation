  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐκύκλωσαν οὖν αὐτὸν οἱ Ἰουδαῖοι καὶ ἔλεγον αὐτῷ· Ἕως πότε τὴν ψυχὴν ἡμῶν αἴρεις; εἰ σὺ εἶ ὁ χριστός, εἰπὲ ἡμῖν παρρησίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/024.yaml
  text: So the Jews surrounded him and were saying to him[a], “How long will you keep us in suspense? If you are the Messiah[b], tell us plainly.”
translation:
  language: tl
  text: Kaya pinalibutan siya ng mga Judio[a], at patuloy silang nagsasabi sa kanya, “Hanggang kailan mo kami pananatilihin sa pag-aalinlangan[b]? Kung ikaw ang Mesiyas, sabihin mo sa amin nang malinaw.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Ebanghelyo ni Juan, ang “mga Judio” ay maaaring tumukoy sa ilang awtoridad o mga salungat kay Jesus sa Judea, hindi sa buong sambayanang Judio.
    reason: cultural_note
  - marker: b
    text: 'Mas literal: “Hanggang kailan mo itataas ang aming kaluluwa?” Isang idyoma ito na nangangahulugang panatilihin ang isang tao sa kawalang-katiyakan o pag-aalinlangan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκύκλωσαν
  choice: pinalibutan
  rationale: Tuwirang ipinapahayag nito ang pisikal at maaaring mapanghamong pagkubkob kay Jesus, gaya ng diwa ng κυκλόω.
- source_word: οὖν
  choice: Kaya
  rationale: Pinananatili nito ang ugnayang pasalaysay at lohikal sa naunang konteksto nang hindi nagiging matigas ang Filipino.
- source_word: οἱ Ἰουδαῖοι
  choice: mga Judio
  rationale: Pinananatili ang tahasang katawagan ng Griyego at hindi agad nililimitahan ang tinutukoy sa mga pinuno; ipinaliliwanag sa talababa ang maaaring mas makitid na gamit nito sa konteksto ng Juan.
- source_word: ἔλεγον
  choice: sinabi
  rationale: Ito ang likas na anyong pasalaysay sa Filipino. Bagaman imperfect ang Griyego at maaaring magpahiwatig ng nagpapatuloy na pagsasalita, hindi kailangang gawing paulit-ulit ang tanong kung hindi iyon malinaw sa konteksto.
- source_word: Ἕως πότε
  choice: Hanggang kailan
  rationale: Ito ang likas at eksaktong katumbas ng pariralang nagtatanong tungkol sa tagal.
- source_word: τὴν ψυχὴν ἡμῶν αἴρεις
  choice: pananatilihin sa pag-aalinlangan
  rationale: Idyomatiko ang pariralang Griyego at tumutukoy sa pagpapanatili sa isang tao sa kawalang-katiyakan. Inihahatid ng salin ang kahulugan, habang pinananatili sa talababa ang literal na larawan.
- source_word: ὁ χριστός
  choice: ang Mesiyas
  rationale: Gumaganap dito ang Χριστός bilang titulong Judio para sa hinihintay na pinahirang hari at tagapagligtas, hindi bilang pangalang pantangi.
- source_word: εἰπὲ ἡμῖν
  choice: sabihin mo sa amin
  rationale: Likas at tuwirang utos ito sa modernong Filipino.
- source_word: παρρησίᾳ
  choice: nang malinaw
  rationale: Sa kontekstong ito, hinihingi nila ang isang hayag at hindi malabong pahayag; ang “nang malinaw” ang pinakanatural na katumbas.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Titulong mesiyaniko ang gamit sa tanong. Ang “Mesiyas” ay nagpapanatili sa kontekstong Judio at hindi ginagawang tila personal na pangalan ang termino.
- issue: Tinutukoy ng οἱ Ἰουδαῖοι sa Juan
  choice: mga Judio
  alternative: mga pinunong Judio / mga taga-Judea
  rationale: Hindi tahasang tinutukoy ng talata ang mga pinuno lamang. Kaya pinananatili sa pangunahing teksto ang mas malawak na katawagan ng Griyego, at inilalagay sa talababa ang kontekstuwal na posibilidad ng mas makitid na tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “pananatilihin sa pag-aalinlangan” upang maging madaling maunawaan nang hindi binubura ang literal na larawan, na iniingatan sa talababa. Inayos ang mga marker ayon sa pagkakasunod ng paglitaw sa saling Tagalog.
