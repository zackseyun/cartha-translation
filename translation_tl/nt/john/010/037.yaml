id: JHN.10.37
reference: John 10:37
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰ οὐ ποιῶ τὰ ἔργα τοῦ πατρός μου, μὴ πιστεύετέ μοι·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/037.yaml
  text: If I am not doing the works of my Father[a], do not believe me;
translation:
  language: tl
  text: Kung hindi ko ginagawa ang mga gawa ng aking Ama, huwag ninyo akong paniwalaan;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “huwag ninyong paniwalaan ang sinasabi ko.”
    reason: Posibleng ipahayag ng πιστεύω na may datibong μοι ang pagtanggap sa sinasabi ng isang tao, hindi lamang ang paniniwala sa tao sa mas malawak na diwa.
lexical_decisions:
- source_word: εἰ οὐ ποιῶ
  choice: Kung hindi ko ginagawa
  rationale: Ang εἰ ay nagpapakilala ng kondisyon, at ang οὐ ay tuwirang nagkakaila sa kasalukuyang kilos na ποιῶ. Ang “ginagawa” ay likas sa modernong Tagalog at naipahihiwatig ang nagpapatuloy na gawain sa konteksto.
- source_word: τὰ ἔργα
  choice: ang mga gawa
  rationale: Pinananatili ng “mga gawa” ang malawak na kahulugan ng ἔργα at ang mahalagang bokabularyo ni Juan para sa mga kilos ni Jesus na nagpapatotoo tungkol sa kaniya.
- source_word: τοῦ πατρός μου
  choice: ng aking Ama
  rationale: Tuwirang ipinapahayag ang ugnayang genitibo. Ginawang malaking titik ang “Ama” sapagkat tumutukoy ito sa Diyos bilang Ama ni Jesus.
- source_word: μὴ πιστεύετέ μοι
  choice: huwag ninyo akong paniwalaan
  rationale: Ang μή kasama ng pautos na πιστεύετέ ay pagbabawal na nakatuon sa maramihang kausap. Ang “paniwalaan” ay natural na katumbas kapag ang πιστεύω ay sinusundan ng datibong tumutukoy sa taong pinaniniwalaan; hindi nito kailangang ipakahulugan agad kung personal na pagtitiwala o pagtanggap sa sinasabi ang nangingibabaw.
theological_decisions:
- issue: Saklaw ng πιστεύω na may datibong μοι
  choice: huwag ninyo akong paniwalaan
  alternative: huwag ninyong paniwalaan ang sinasabi ko
  rationale: Maaaring mangahulugan ang konstruksiyon ng paniniwala sa isang tao, habang ipinapakita ng konteksto na kalakip dito ang pagtanggap sa kaniyang mga pahayag. Pinananatili ng pangunahing salin ang tuwirang personal na anyo ng Griyego, at inilalagay sa talababa ang mas hayag na proposisyunal na pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Pinanatili ang “mga gawa” bilang mahalagang terminong Juanino at ang maramihang kausap sa “ninyo.” Inilagay ang pananda ng talababa pagkatapos ng sugnay na tinutukoy nito.
