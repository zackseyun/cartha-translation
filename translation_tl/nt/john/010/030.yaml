  text: ἐγὼ καὶ ὁ πατὴρ ἕν ἐσμεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/030.yaml
  text: I and the Father are one[a].
translation:
  language: tl
  text: Ako at ang Ama ay iisa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego para sa “iisa” ay walang kasarian (neuter). Binibigyang-diin nito ang pagiging isa nang hindi sinasabing iisang persona si Jesus at ang Ama.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ
  choice: Ako
  rationale: Tahasang panghalip na unang panauhang isahan; pinananatili ang diin ng hayag na paksa sa Griyego.
- source_word: καὶ
  choice: at
  rationale: Payak na pangatnig na nag-uugnay sa dalawang paksa nang walang idinadagdag na kahulugan.
- source_word: ὁ πατὴρ
  choice: ang Ama
  rationale: May pantukoy at ginagamit bilang personal na tawag sa Ama ni Jesus; ang malaking titik ay angkop sa ganitong gamit sa Filipino.
- source_word: ἕν
  choice: iisa
  rationale: Ang anyong walang kasariang isahan ay nagpapahayag ng tunay na pagiging isa nang hindi sinasabing iisang persona si Jesus at ang Ama. Likas at tuwiran sa Filipino ang “iisa” sa panaguring ito.
- source_word: ἐσμεν
  choice: ay
  rationale: Walang tahasang anyong maramihan ang kopulang Filipino, ngunit naipakikita ng dalawang paksang “Ako at ang Ama” ang maramihang sanggunian ng pandiwang Griyego.
theological_decisions:
- issue: Kahulugan ng walang kasariang ἕν kasama ng maramihang ἐσμεν sa pahayag tungkol kay Cristo
  choice: “Ako at ang Ama ay iisa,” na nagpapahayag ng tunay na pagiging isa habang pinananatili ang pagkakaiba ni Jesus at ng Ama.
  alternative: “Ako at ang Ama ay may pagkakaisa” o “Ako at ang Ama ay isang persona.”
  rationale: Hindi dapat pahinain ang pahayag tungo sa pagkakasundo lamang, ni ipakahulugang iisang persona ang dalawang tinutukoy. Pinananatili ng payak na “iisa” ang tensiyon ng balarilang Griyego nang hindi nagdaragdag ng mas huling terminolohiyang teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “iisa” sa halip na mas paliwanag na “may pagkakaisa” upang manatiling malapit sa maigsi at matinding pahayag ng Griyego.
