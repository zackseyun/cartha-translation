  text: τὰ πρόβατα τὰ ἐμὰ τῆς φωνῆς μου ⸀ἀκούουσιν, κἀγὼ γινώσκω αὐτά, καὶ ἀκολουθοῦσίν μοι,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/027.yaml
  text: My sheep hear my voice, and I know them, and they follow me.
translation:
  language: tl
  text: Naririnig ng aking mga tupa ang tinig ko, at kilala ko sila, at sumusunod sila sa akin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρόβατα
  choice: mga tupa
  rationale: Ito ang karaniwan at likas na katumbas sa Filipino, at pinananatili nito ang talinghaga tungkol sa pastol at mga tupa.
- source_word: τὰ ἐμὰ
  choice: aking
  rationale: Malinaw nitong ipinahahayag ang pag-aari nang hindi dinaragdagan ang bahagyang diin ng Griyego bilang “sarili kong.”
- source_word: φωνῆς
  choice: tinig
  rationale: Mas angkop ang “tinig” kaysa “tunog” sa konteksto ng pagkilala ng mga tupa sa pastol.
- source_word: ἀκούουσιν
  choice: naririnig
  rationale: Pinananatili nito ang tuwirang diwa ng pandiwa at iniiwasang idagdag ang tahasang pagpapakahulugan ng “nakikinig” o “tumatalima.” Sa pangungusap, ipinapakita ng kasalukuyang anyo ang palagian o katangiang kilos.
- source_word: κἀγὼ
  choice: at ... ko
  rationale: Pinananatili ang pang-ugnay na καί at ang paksa sa likas na ayos ng pangungusap sa Filipino.
- source_word: γινώσκω
  choice: kilala ko
  rationale: Ang “kilala ko” ang likas na Filipino para sa personal at relasyonal na pagkakilala, nang hindi ito pinalalawak tungo sa isang mas tiyak na doktrinal na paliwanag.
- source_word: αὐτά
  choice: sila
  rationale: Bagaman walang kasariang pambalarila ang tinutukoy sa Filipino, ang “sila” ay likas sapagkat ang mga tupa ay kumakatawan sa mga tao.
- source_word: ἀκολουθοῦσίν μοι
  choice: sumusunod sila sa akin
  rationale: Likas nitong ipinahahayag ang patuloy o karaniwang pagkilos na nasa kasalukuyang panahunan ng Griyego.
theological_decisions:
- issue: Relasyonal na lakas ng γινώσκω sa talinghaga ng pastol at mga tupa
  choice: kilala ko sila
  alternative: alam ko kung sino sila; lubos ko silang kilala
  rationale: Ang “kilala” ay nagpapanatili ng personal at relasyonal na lalim ng salita nang hindi nililimitahan o pinalalawak ang kahulugan sa isang partikular na doktrinal na pagbasa.
- issue: Diwa ng ἀκούουσιν bilang pandinig o pagtugon
  choice: naririnig
  alternative: nakikinig sa; tumatalima sa
  rationale: Pinananatili ng “naririnig” ang tunay na lawak ng pandiwang Griyego. Ang agarang konteksto ng pagsunod ang nagpapahiwatig ng positibong pagtugon, kaya hindi na kailangang isingit iyon sa mismong pandiwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tinig” at “kilala” upang mapanatili ang personal na katangian ng talinghaga. Inulit ang “at” upang masundan ang magkakaugnay na mga sugnay ng Griyego nang hindi nagiging di-likas.
