  yaml_path: translation/nt/john/010/008.yaml
  text: All who came before me are thieves and robbers[a], but the sheep did not listen to them.
translation:
  language: tl
  text: Ang lahat ng dumating bago ako[a][b] ay mga magnanakaw at mga tulisan, ngunit hindi nakinig sa kanila ang mga tupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “bago ako” ay maaaring tumukoy sa panahon (“dumating bago ako”) o sa pag-una habang nag-aangking may awtoridad na hiwalay kay Jesus. Ipinahihiwatig ng konteksto na mga huwad na pastol ang tinutukoy, hindi ang lahat ng naunang lingkod ng Diyos.
    reason: alternative_reading
  - marker: b
    text: Wala ang mga salitang “bago ako” sa ilang sinaunang saksi sa teksto.
    reason: textual_variant
lexical_decisions:
- source_word: πάντες ὅσοι
  choice: Ang lahat ng
  rationale: Likas at malawak ang saklaw ng parirala sa Filipino; tumutukoy ito sa buong pangkat na tinutukoy sa konteksto.
- source_word: ἦλθον
  choice: dumating
  rationale: Pinananatili ang payak na nagdaang kilos ng aorist nang hindi nagdaragdag ng diwang hindi tahasang nasa Griyego.
- source_word: πρὸ ἐμοῦ
  choice: na nauna sa akin
  rationale: Natural itong katumbas sa Filipino at naiiwan nitong bukas ang temporal at pangungunang diwa ng parirala; ipinaliliwanag sa talababa ang tunay na kalabuan.
- source_word: κλέπται
  choice: mga magnanakaw
  rationale: Karaniwan at malinaw na tawag sa mga taong palihim na kumukuha ng hindi kanila, alinsunod sa larawan sa konteksto.
- source_word: λῃσταί
  choice: tulisan
  rationale: Ibinubukod nito ang λῃστής sa κλέπτης at ipinahihiwatig ang mas marahas o mapanirang uri ng pagnanakaw nang hindi labis na nililimitahan ang kahulugan.
- source_word: ἀλλ’
  choice: ngunit
  rationale: Dignified at natural na panandang pasalungat sa modernong Filipino.
- source_word: οὐκ ἤκουσαν αὐτῶν
  choice: hindi nakinig sa kanila
  rationale: Ang ἀκούω na may genitive ay maaaring mangahulugang makinig o tumalima; ang “nakinig” ay angkop sa larawan ng mga tupang kumikilala at sumusunod sa tinig.
- source_word: τὰ πρόβατα
  choice: ang mga tupa
  rationale: Tuwirang katumbas at karaniwang pananalita sa talinghaga ng pastol sa Juan 10.
theological_decisions:
- issue: Saklaw at diwa ng “lahat ng dumating na nauna sa akin”
  choice: Pinanatili sa pangunahing teksto ang malawak na anyo ng Griyego nang hindi tahasang nililimitahan kung sinu-sino ang tinutukoy.
  alternative: Tukuyin sila bilang mga bulaang pastol o mga nag-angking may awtoridad hiwalay kay Jesus.
  rationale: Malawak ang pahayag sa anyo nito, ngunit ipinahihiwatig ng konteksto na mga huwad na pastol ang tinutukoy at hindi lahat ng naunang lingkod na isinugo ng Diyos. Mas nararapat panatilihin ang tensiyon sa teksto at ilagay ang paglilinaw sa talababa.
translation_notes:
  register: Modernong Filipino na malinaw, natural, at marangal. Ginamit ang “tulisan” upang mapanatili ang pagkakaiba ng dalawang uri ng mandarambong, at pinanatili sa talababa ang kalabuan ng πρὸ ἐμοῦ.
