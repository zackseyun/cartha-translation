base_translation:
  language: en
  yaml_path: translation/nt/john/010/031.yaml
  text: So the Jews picked up stones again to stone him[a].
translation:
  language: tl
  text: Kaya muling dumampot ng mga bato ang mga Hudyo upang batuhin siya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring, ayon sa konteksto, “ang mga pinunong Hudyo” o “ang mga taga-Judea.” Sa Ebanghelyo ni Juan, ang pariralang “ang mga Hudyo” ay madalas tumutukoy sa partikular na mga Hudyong kumakalaban kay Jesus, hindi sa buong bayang Hudyo.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐβάστασαν
  choice: dumampot
  rationale: Sa konteksto ng mga batong kukunin para gamitin agad, likas sa modernong Tagalog ang “dumampot”; naipapahayag nito ang pagkuha sa mga bato nang hindi nagdaragdag ng ideyang wala sa pandiwa.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinakikita ng “Kaya” ang ugnayan ng kilos sa naunang sinabi ni Jesus, at natural ito sa salaysay sa Tagalog.
- source_word: πάλιν
  choice: muling
  rationale: Tuwirang ipinahahayag ng “muling” ang pag-uulit ng kilos at ang nauulit na pagtutol sa konteksto.
- source_word: λίθους
  choice: mga bato
  rationale: Payak at tuwirang katumbas ito ng pangmaramihang λίθους; hindi inililipat sa pangngalan ang ideya ng pagbato.
- source_word: οἱ Ἰουδαῖοι
  choice: ang mga Judio
  rationale: Pinananatili nito ang hayag na katawagan sa Griyego. Maaaring mas makitid ang tinutukoy sa konteksto ni Juan, kaya nililinaw iyon sa talababa sa halip na tahimik na paliitin ang pangunahing teksto.
- source_word: ἵνα
  choice: upang
  rationale: Malinaw at marangal na ipinahahayag ng “upang” ang layunin ng pagkuha nila sa mga bato.
- source_word: λιθάσωσιν
  choice: batuhin
  rationale: Tuwirang katumbas ng λιθάζω ang “batuhin.” Hindi idinaragdag ang “patayin,” bagaman maaaring nakamamatay ang layunin, sapagkat hindi iyon tahasang bahagi ng pandiwa rito.
- source_word: αὐτόν
  choice: siya
  rationale: Karaniwang panghalip na layon na tumutukoy kay Jesus; malinaw ang tinutukoy mula sa konteksto.
theological_decisions:
- issue: Saklaw ng οἱ Ἰουδαῖοι sa Ebanghelyo ni Juan
  choice: “ang mga Judio” sa pangunahing teksto, na may paliwanag sa talababa
  alternative: “ang mga pinunong Judio” o “ang mga taga-Judea”
  rationale: Hayag sa Griyego ang “mga Judio,” kaya hindi dapat paliitin ang tinutukoy nang walang pahiwatig sa mismong talata. Gayunman, sa Ebanghelyo ni Juan, kadalasang tumutukoy ang parirala sa partikular na mga Judiong kumakalaban kay Jesus at hindi sa buong bayang Judio; pinananatili ng talababa ang mahalagang kontekstuwal na tensiyong ito.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “dumampot” para sa agarang pagkuha ng mga bato at “upang batuhin” upang mapanatili ang tahasang layunin sa Griyego. Iniwasan ang mas mabigat o lumang anyong “nagsipagdampot.”
