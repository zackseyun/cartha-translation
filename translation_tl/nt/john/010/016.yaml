base_translation:
  language: en
  yaml_path: translation/nt/john/010/016.yaml
  text: And I have other sheep that are not from this sheepfold[a]. I must bring them also, and they will listen to my voice. Then there will be one flock[b], one shepherd.
translation:
  language: tl
  text: Mayroon din akong ibang tupa na hindi mula sa kulungang ito.[a] Kailangan ko rin silang dalhin, at makikinig sila sa tinig ko.[b] At magiging isang kawan sila, at iisa ang pastol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kulungan” ay salin ng αὐλή, isang kulungan o bakod ng mga tupa. Ibang salitang Griyego ang ginamit sa “kawan” sa hulihan ng talata.
    reason: lexical_distinction
  - marker: b
    text: O “makaririnig sila sa tinig ko.” Ang pandiwang Griyego ay maaaring mangahulugang “marinig” o “makinig”; sa kontekstong ito, malamang na kasama ang diwa ng pagtugon sa narinig.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα πρόβατα
  choice: ibang mga tupa
  rationale: Ang πρόβατα ay karaniwang tawag sa mga tupa, hindi partikular sa mga kordero; ipinahihiwatig ng ἄλλα na may iba pang mga tupa bukod sa mga naunang tinutukoy.
- source_word: αὐλή
  choice: kulungan
  rationale: Sa talinghaga ng pagpapastol, tumutukoy ito sa bakod o kulungan ng mga tupa. Natural sa Tagalog ang “kulungan” at malinaw itong naiiba sa “kawan.”
- source_word: κἀκεῖνα
  choice: sila rin
  rationale: Bumabalik ito sa “ibang mga tupa.” Ang “sila rin” ay natural na Tagalog at pinananatili ang diwang pandagdag.
- source_word: δεῖ με ἀγαγεῖν
  choice: Kailangan ko rin silang dalhin
  rationale: Pinananatili ng “kailangan” ang puwersa ng δεῖ bilang pangangailangan, samantalang ang “dalhin” ay natural na katumbas ng ἀγαγεῖν sa kontekstong ito nang hindi inaalis ang larawan ng pastol.
- source_word: τῆς φωνῆς μου ἀκούσουσιν
  choice: makikinig sila sa tinig ko
  rationale: Maaaring mangahulugan ang ἀκούω ng makarinig o makinig. Sa konteksto ng pastol at mga tupa, ang “makikinig” ay nagpapahiwatig ng pagtugon, hindi lamang pandinig.
- source_word: γενήσονται
  choice: sila ay magiging
  rationale: Tuwirang pinananatili nito ang hinaharap at ang ideya ng pagdating sa isang kalagayan, at hindi nito binubura ang hayag na pangmaramihang simuno.
- source_word: μία ποίμνη
  choice: isang kawan
  rationale: Ang ποίμνη ay grupo ng mga tupa, kaya “kawan” ang eksaktong salitang Tagalog at naiiba ito sa kulungan.
- source_word: εἷς ποιμήν
  choice: isang pastol
  rationale: Ang ποιμήν ay literal na pastol; pinananatili ng salin ang pangunahing larawan ng talata.
theological_decisions:
- issue: Pagkilala sa pagkakaiba ng αὐλή at ποίμνη
  choice: kulungang ito ... isang kawan
  alternative: kulungang ito ... isang kulungan
  rationale: 'Magkaiba ang dalawang pangngalang Griyego: ang αὐλή ay kulungan o bakod, samantalang ang ποίμνη ay ang kawan mismo. Pinananatili ng salin ang pagkakaibang ito at hindi ipinapalagay na ang pagkakaisa ay iisang institusyonal na kulungan.'
- issue: Puwersa ng δεῖ
  choice: Kailangan ko rin silang dalhin
  alternative: Dadalhin ko rin sila
  rationale: Ipinahahayag ng δεῖ ang pangangailangan, na maaaring may teolohikal na bigat sa Juan. Pinananatili ito nang hindi ipinapaliwanag kung saan nagmumula ang pangangailangang iyon.
- issue: Ugnayan ng μία ποίμνη at εἷς ποιμήν
  choice: isang kawan, na may isang pastol
  alternative: isang kawan at isang pastol
  rationale: Nililinaw ng “na may” ang natural na ugnayan sa Tagalog nang hindi nagdaragdag ng denominasyonal o institusyonal na interpretasyon.
translation_notes:
  register: 'Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “tinig” sa halip na mas kolokyal na “boses,” at “pastol” at “kawan” upang panatilihin ang malinaw na larawang pastoral. Inilagay ang mga talababa sa mga pariralang aktuwal na ipinapaliwanag: [a] pagkatapos ng “kulungang ito” at [b] pagkatapos ng pangungusap na may “isang kawan” at “isang pastol.”'
