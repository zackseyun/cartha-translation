  text: διὰ τοῦτο ἀναλάβετε τὴν πανοπλίαν τοῦ θεοῦ, ἵνα δυνηθῆτε ἀντιστῆναι ἐν τῇ ἡμέρᾳ τῇ πονηρᾷ καὶ ἅπαντα κατεργασάμενοι στῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/013.yaml
  text: Therefore take up the full armor of God[a], so that you may be able to withstand in the evil day, and having done everything[d][c][b], to stand firm.
translation:
  language: tl
  text: Kaya kunin ninyo ang buong baluti ng Diyos[a], upang makapanindigan kayo sa masamang araw[b] at, matapos gawin ang lahat[c], ay tumayo[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kumpletong kagamitang pandigma ng Diyos.” Ang salitang Griyego ay tumutukoy sa kabuuang kagamitan ng isang sundalo.
    reason: lexical_alternative
  - marker: b
    text: Ang “masamang araw” ay maaaring tumukoy sa panahon ng matinding kasamaan o pagsubok, at hindi lamang sa isang tiyak na pangyayari sa wakas ng panahon.
    reason: alternative_reading
  - marker: c
    text: O “matapos isakatuparan ang lahat” o “matapos gawin ang lahat ng kinakailangan.”
    reason: lexical_alternative
  - marker: d
    text: O “tumayong matatag” o “manatiling nakatayo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Kaya
  rationale: Likas at maikli itong pang-ugnay sa Filipino na naghahayag ng kongklusyon mula sa naunang pahayag.
- source_word: ἀναλάβετε
  choice: kunin ninyo
  rationale: Ang pautos ay tumutukoy sa pagkuha o pagbuhat sa kagamitan; mas tuwirang katumbas ito kaysa “isuot,” bagaman pagdadamit ng baluti ang ipinahihiwatig ng larawan.
- source_word: τὴν πανοπλίαν
  choice: ang buong baluti
  rationale: Ang πανοπλία ay kabuuang kagamitang pandigma ng isang sundalo. Ipinahahayag ng “buong baluti” ang pagiging kumpleto nito sa natural na Filipino.
- source_word: τοῦ θεοῦ
  choice: ng Diyos
  rationale: 'Pinananatiling malawak ang genitibo: maaaring tumukoy sa baluting nauukol sa Diyos o ipinagkakaloob niya, nang hindi nililimitahan ang kahulugan.'
- source_word: ἵνα δυνηθῆτε
  choice: upang makapanindigan kayo
  rationale: Pinagsasama ng “upang” at “maka-” ang layunin at kakayahang ipinahahayag ng sugnay.
- source_word: ἀντιστῆναι
  choice: makapanindigan
  rationale: Sa kontekstong militar, ipinahahayag nito ang paglaban at hindi pag-urong sa harap ng pagsalakay. Pinananatili rin nito ang ugnayan sa huling στῆναι.
- source_word: ἐν τῇ ἡμέρᾳ τῇ πονηρᾷ
  choice: sa masamang araw
  rationale: Malapit ito sa anyo ng Griyego at hindi nagpapasya kung pangkalahatang panahon ng matinding kasamaan o isang tiyak na araw ang tinutukoy.
- source_word: ἅπαντα κατεργασάμενοι
  choice: matapos gawin ang lahat
  rationale: 'Natural na Filipino ito para sa naunang kilos ng participle habang pinananatili ang malawak na saklaw ng κατεργάζομαι: gawin, isakatuparan, o tapusin ang lahat ng kinakailangan.'
- source_word: στῆναι
  choice: manatiling nakatayo
  rationale: Ipinahahayag nito ang resultang hindi napabagsak at patuloy na nakatayo matapos ang pakikipaglaban; naaangkop ito sa larawang militar nang hindi nagdaragdag ng tahasang tagumpay.
theological_decisions:
- issue: Kahulugan ng “masamang araw”
  choice: Iniwan bilang pangkalahatan at bukás na pagtukoy sa panahon ng matinding kasamaan, pagsubok, o espirituwal na tunggalian.
  alternative: Isang tiyak na araw sa wakas ng panahon, o isang partikular na araw ng personal na pagsubok.
  rationale: Hindi sapat ang parirala upang itakda lamang sa isang eskatolohikal na pangyayari; pinananatili ng salin ang saklaw at tensiyon ng teksto.
- issue: Diwa ng genitibong “baluti ng Diyos”
  choice: Pinanatili ang “ng Diyos” nang hindi ipinapaliwanag kung pag-aari ba ito ng Diyos o ipinagkakaloob niya.
  alternative: “baluting pag-aari ng Diyos” o “baluting mula sa Diyos.”
  rationale: Pinahihintulutan ng Griyegong genitibo ang magkaugnay na mga diwang ito, kaya hindi dapat paliitin ng salin ang kahulugan.
- issue: Ugnayan ng ἀντιστῆναι at στῆναι
  choice: “makapanindigan” at “manatiling nakatayo.”
  alternative: “lumaban” at “tumayo nang matatag.”
  rationale: Pinananatili ang pag-uulit ng larawan ng pagtayo at paghawak sa kinatatayuan, habang nililinaw ang bahagyang pagkakaiba ng dalawang pandiwa sa konteksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang larawang militar at ang pag-uulit ng konsepto ng pagtayo, ngunit iniwasan ang masyadong teknikal o denominasyonal na pananalita.
