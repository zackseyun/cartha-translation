reference: Ephesians 6:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἵνα δὲ ⸂εἰδῆτε καὶ ὑμεῖς⸃ τὰ κατ’ ἐμέ, τί πράσσω, πάντα ⸂γνωρίσει ὑμῖν⸃ Τυχικὸς ὁ ἀγαπητὸς ἀδελφὸς καὶ πιστὸς διάκονος ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/021.yaml
  text: So that you also may know the things concerning me[a], what I am doing, Tychicus, the beloved brother and faithful minister in the Lord[b], will make everything known to you.
translation:
  language: tl
  text: Upang malaman din ninyo ang mga bagay tungkol sa akin[a] at kung ano ang ginagawa ko, ipaaalam sa inyo ni Tiquico ang lahat. Siya ang minamahal na kapatid at tapat na lingkod sa Panginoon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang aking kalagayan”; literal na tumutukoy ang Griyego sa “mga bagay tungkol sa akin.”
    reason: lexical_alternative
  - marker: b
    text: O “tapat na ministro”; maaari ring mangahulugan ang Griyegong διάκονος ng “lingkod” o, sa ilang konteksto, “diyakono.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἵνα δὲ
  choice: Ngunit upang
  rationale: Ipinahahayag ng ἵνα ang layunin, samantalang ang δέ ay banayad na pang-ugnay; pinananatili ng “Ngunit upang” ang dalawang puwersang ito nang natural.
- source_word: εἰδῆτε καὶ ὑμεῖς
  choice: malaman din ninyo
  rationale: Ipinakikita ng καί kasama ng tahasang ὑμεῖς na ang mga tumatanggap ay kasama ring dapat makaalam.
- source_word: τὰ κατ’ ἐμέ
  choice: ang mga bagay tungkol sa akin
  rationale: Malapit ito sa anyo ng Griyego at hindi nililimitahan ang kahulugan sa kalagayan lamang ni Pablo.
- source_word: τί πράσσω
  choice: kung ano ang ginagawa ko
  rationale: Tuwirang ipinahahayag ng πράσσω ang ginagawa o pinagkakaabalahan ni Pablo.
- source_word: πάντα γνωρίσει ὑμῖν
  choice: ipaaalam sa inyo ... ang lahat
  rationale: Natural na Tagalog para sa causative na diwa ng γνωρίζω, ‘ipaalam’ o ‘gawing kilala.’
- source_word: Τυχικὸς
  choice: Tiquico
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalang biblikal.
- source_word: ὁ ἀγαπητὸς ἀδελφὸς
  choice: ang minamahal na kapatid
  rationale: Pinananatili ang pagmamahal na ipinahahayag ng ἀγαπητός at ang pampamilyang katawagan ng pamayanang Cristiano.
- source_word: πιστὸς διάκονος
  choice: tapat na lingkod
  rationale: Malawak ang διάκονος at maaaring tumukoy sa isang naglilingkod nang hindi tiyak na nagpapangalan sa pormal na katungkulan ng diyakono; natural at hindi teknikal ang “lingkod.”
- source_word: ἐν κυρίῳ
  choice: sa Panginoon
  rationale: Pinananatili ang karaniwang pananalita ni Pablo tungkol sa larangan o ugnayan kay Cristo.
theological_decisions:
- issue: Kahulugan ng διάκονος para kay Tiquico
  choice: lingkod
  alternative: ministro; diyakono
  rationale: Hindi malinaw sa konteksto na pormal na katungkulan sa iglesya ang tinutukoy. Iniiwasan ng “lingkod” ang pagpasok ng isang tiyak na kaayusang pansimbahan habang pinananatili ang paglilingkod ni Tiquico.
- issue: Kahulugan ng ἀδελφός
  choice: kapatid
  alternative: kapatid na lalaki
  rationale: Lalaki ang indibidwal na tinutukoy, ngunit sa Filipino ay natural at sapat ang “kapatid” para sa katawagang espirituwal na ito.
- issue: Kahulugan ng κύριος
  choice: Panginoon
  alternative: Ginoo; Amo
  rationale: Ang “Panginoon” ang likas at teolohikal na angkop na salin ng karaniwang titulong Paulino rito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang gitling-pahaba upang malinaw na ihiwalay ang paliwanag na “kung ano ang ginagawa ko.” Ang ikalawang pangungusap ay umiiwas sa mabigat na pagkakasalansan ng mga panuring habang pinananatili ang ugnayan ng mga sugnay sa Griyego.
