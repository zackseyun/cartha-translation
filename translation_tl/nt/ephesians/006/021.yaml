  source_fidelity: Tumpak na naihahatid ng draft ang layuning ipinahahayag ng ἵνα, ang diin ng “din ninyo,” ang malawak na τὰ κατ’ ἐμέ, ang ginagawa ni Pablo, at ang pagpapakilala kay Tiquico bilang minamahal na kapatid at tapat na lingkod sa Panginoon. Gayunman, ang “Ngunit” ay karaniwang nagpapahiwatig ng mas malinaw na pagsalungat kaysa sa banayad na pandugtong na δέ sa talatang ito.
  naturalness: Malinaw at makabagong Filipino ang karamihan ng salin. Mas maayos ang daloy kung aalisin ang “Ngunit” at pag-uugnayin ang dalawang bagay na ipakikilala ni Tiquico sa pamamagitan ng “at.”
  terminology: Ang “Tiquico,” “minamahal na kapatid,” “tapat na lingkod,” at “Panginoon” ay angkop. Ang “lingkod” para sa διάκονος ay wastong di-teknikal na salin sa kontekstong ito; pinananatili ng talababa ang makatuwirang alternatibo.
