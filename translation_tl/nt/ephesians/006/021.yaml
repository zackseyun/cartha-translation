- from: Ngunit upang malaman din ninyo ang mga bagay tungkol sa akin[a]—kung ano ang ginagawa ko—ipaaalam sa inyo ni Tiquico ang lahat. Siya ang minamahal na kapatid at tapat na lingkod sa Panginoon.[b]
  to: Upang malaman din ninyo ang mga bagay tungkol sa akin[a] at kung ano ang ginagawa ko, ipaaalam sa inyo ni Tiquico ang lahat. Siya ang minamahal na kapatid at tapat na lingkod sa Panginoon.[b]
  rationale: Inalis ang “Ngunit,” sapagkat mas malakas ang karaniwang kontrastibong puwersa nito kaysa sa δέ rito. Ginamit ang “at” upang likas na pagdugtungin ang dalawang saklaw ng impormasyong ihahayag ni Tiquico, nang hindi nililimitahan ang τὰ κατ’ ἐμέ sa kalagayan lamang ni Pablo. Pinanatili ang kahulugan, mga pangalan, rehistro, at lahat ng talababa.
