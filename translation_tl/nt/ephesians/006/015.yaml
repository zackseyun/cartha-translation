  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagiging handa”; maaari ring “ang kahandaang ipahayag ang mabuting balita ng kapayapaan,” o “ang matatag na tuntungang ibinibigay ng mabuting balita ng kapayapaan.”
    reason: Pinananatili ang mga posibleng kahulugan ng ἑτοιμασία at ang siksik na ugnayan ng mga salita sa pariralang Griyego.
lexical_decisions:
- source_word: ὑποδησάμενοι
  choice: isuot ninyo sa inyong mga paa
  rationale: Ipinapanatili nito ang larawan ng pagsusuot ng panyapak sa baluti, habang gumagamit ng likas at madaling maunawaang Filipino. Ang pandiwaring aorist ay inangkop bilang utos na kaayon ng daloy ng talata.
- source_word: τοὺς πόδας
  choice: inyong mga paa
  rationale: Tuwirang pinananatili ang bahagi ng katawan na nasa Griyego at ang larawan ng baluti.
- source_word: ἐν
  choice: ang
  rationale: Sa balangkas na “isuot ... ang,” likas na naipapahayag sa Filipino ang kagamitan o bagay na isinusuot nang hindi kailangang tumbasan nang hiwalay ang ἐν.
- source_word: ἑτοιμασίᾳ
  choice: kahandaan
  rationale: Pinakamalapit itong karaniwang katumbas ng pangngalang tumutukoy sa pagiging handa. Hindi nito tahasang nililimitahan ang diwa sa pangangaral o sa matatag na tuntungan.
- source_word: εὐαγγελίου
  choice: mabuting balita
  rationale: Malinaw at likas ito sa modernong Filipino, habang tumpak na ipinapahayag ang kahulugan ng εὐαγγέλιον.
- source_word: εἰρήνης
  choice: kapayapaan
  rationale: Karaniwang katumbas ito ng εἰρήνη at pinananatili ang kaugnayan nito sa “mabuting balita.”
theological_decisions:
- issue: Kahulugan ng ἐν ἑτοιμασίᾳ τοῦ εὐαγγελίου τῆς εἰρήνης
  choice: kahandaang mula sa mabuting balita ng kapayapaan
  alternative: kahandaang ipahayag ang mabuting balita ng kapayapaan; o matatag na tuntungang ibinibigay ng mabuting balita ng kapayapaan
  rationale: Siksik at maaaring unawain sa ilang paraan ang pariralang Griyego. Ipinahihiwatig ng pangunahing salin ang kahandaang nagmumula sa mabuting balita, ngunit hindi idinaragdag na ito ay tiyak na kahandaang mangaral o katatagan lamang; inilalahad sa talababa ang iba pang makatuwirang pagbasa.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang larawan ng pagsusuot sa mga paa at iniwasan ang sobrang teknikal o makalumang salitang “sapinan.”
