- from: upang mapabuti ang kalagayan mo at humaba ang buhay mo sa ibabaw ng lupa[a].
  to: upang maging mabuti ang kalagayan mo at mabuhay ka nang matagal sa lupa[a].
  rationale: The revision improves modern Filipino idiom and removes the unnecessarily surface-specific sense of “sa ibabaw ng lupa.” It retains the source text’s broad “earth” wording and keeps the possible Decalogue-related “land” sense in the footnote, without resolving the ambiguity beyond the Greek.
