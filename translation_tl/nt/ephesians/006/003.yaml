  yaml_path: translation/nt/ephesians/006/003.yaml
  text: so that it may go well with you and you may live long on the earth[a].
translation:
  language: tl
  text: upang maging mabuti ang kalagayan mo at mabuhay ka nang matagal sa lupa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “sa lupain,” na umaalingawngaw sa pananalita ng ikalimang utos sa Exodo 20:12 at Deuteronomio 5:16.
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: upang
  rationale: Likas na panandang Filipino para sa layunin o kinalabasan at pinananatili ang kaugnayan nito sa pangakong binanggit sa naunang talata.
- source_word: εὖ σοι γένηται
  choice: mapabuti ang kalagayan mo
  rationale: Ipinahahayag nang natural sa Filipino ang idyomang nangangahulugang maging maayos o mabuti ang mangyayari sa isang tao, nang hindi ito nililimitahan sa materyal na kasaganaan.
- source_word: καὶ
  choice: at
  rationale: Payak na pang-ugnay sa dalawang ipinangakong kinalabasan.
- source_word: ἔσῃ μακροχρόνιος
  choice: humaba ang buhay mo
  rationale: Natural na Filipino para sa literal na diwang 'maging mahaba ang buhay' o 'maging matagal ang buhay.'
- source_word: ἐπὶ τῆς γῆς
  choice: sa ibabaw ng lupa
  rationale: Malapit sa malawak na saklaw ng salitang γῆ sa tekstong Griyego at hindi awtomatikong nagdaragdag ng partikular na lupang tipan; ang posibleng kahulugang 'sa lupain' ay inilalagay sa talababa.
theological_decisions:
- issue: Saklaw ng ἐπὶ τῆς γῆς kaugnay ng pangako sa ikalimang utos
  choice: sa ibabaw ng lupa
  alternative: sa lupain
  rationale: Sinusunod ng pangunahing salin ang mas malawak na mismong pananalita ng Griyego sa Efeso, habang kinikilala sa talababa ang alingawngaw ng Exodo 20:12 at Deuteronomio 5:16 at ang posibleng pakahulugang tumutukoy sa lupain.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'mapabuti ang kalagayan mo' upang maging natural ngunit hindi ipakahulugan ang εὖ bilang tiyak na materyal na pagyaman. Ang 'sa ibabaw ng lupa' ay sadyang nagpapanatili sa mas malawak na pananalita ng Griyego.
