  text: ⸀ἐν πᾶσιν ἀναλαβόντες τὸν θυρεὸν τῆς πίστεως, ἐν ᾧ δυνήσεσθε πάντα τὰ βέλη τοῦ ⸀πονηροῦ πεπυρωμένα σβέσαι·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/016.yaml
  text: In all circumstances[a], taking up the shield of faith[c][b], with which you will be able to extinguish all the flaming arrows of the evil one.
translation:
  language: tl
  text: Sa lahat ng pagkakataon[a], kunin ninyo ang kalasag ng pananampalataya; sa pamamagitan nito ay magagawa ninyong patayin ang lahat ng nagliliyab na palaso[b] ng Masama.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kasama ng lahat ng ito” o “sa lahat ng bagay.”
    reason: alternative_reading
  - marker: b
    text: Ang salitang Griyego ay pangkalahatang tawag sa mga ibinabato o ipinapana; maaari ring “mga sibat na inihahagis.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “ng kasamaan”; maaaring personal o abstrakto ang salitang Griyego, bagaman mas angkop sa konteksto ang personal na kahulugan.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν πᾶσιν
  choice: Sa lahat ng pagkakataon
  rationale: Likas itong basahin bilang pariralang pang-abay—“sa bawat kalagayan”—sa daloy ng listahan ng baluti. Gayunman, maaaring tumukoy ang pangmaramihang anyo sa lahat ng naunang nabanggit, kaya pinanatili sa talababa ang tunay na kalabuan.
- source_word: ἀναλαβόντες
  choice: kunin ninyo
  rationale: Bagaman pandiwaring aorist ang Griyego, nakaugnay ito sa serye ng mga tagubilin. Ang tahasang pautos ay natural sa modernong Tagalog at tapat sa tungkulin nito sa pangungusap.
- source_word: θυρεὸν
  choice: kalasag
  rationale: Tumutukoy ang θυρεός sa isang malaking pananggalang, at malinaw na naihahatid ng karaniwang salitang “kalasag” ang larawang militar nang hindi nagdaragdag ng di-kinakailangang paliwanag sa pangunahing teksto.
- source_word: τῆς πίστεως
  choice: ng pananampalataya
  rationale: 'Pinananatili ng “pananampalataya” ang karaniwang kahulugan ng πίστις dito: ang pagtitiwala at pananalig sa Diyos na inilalarawan bilang pananggalang.'
- source_word: ἐν ᾧ
  choice: sa pamamagitan nito
  rationale: Tumutukoy ito pabalik sa kalasag at ginagamit sa kahulugang instrumental. Malinaw at natural sa Tagalog ang “sa pamamagitan nito.”
- source_word: δυνήσεσθε
  choice: mapapatay ninyo
  rationale: Ipinahihiwatig ng anyong panghinaharap ang kakayahang magkakaroon sila. Sa Tagalog, likas na naisasama sa “mapapatay ninyo” ang kakayahan at inaasahang bisa ng kalasag.
- source_word: βέλη
  choice: mga palaso
  rationale: Pangkalahatang tawag ang βέλη sa mga ibinabatong sandata, ngunit akma at madaling maunawaan ang “mga palaso” sa imaheng militar. Itinala sa talababa ang mas malawak na saklaw nito.
- source_word: πεπυρωμένα
  choice: nagliliyab
  rationale: Ang perpektong pandiwaring balintiyak ay literal na “sinindihan” o “pinagningas.” Mahusay na pinananatili ng “nagliliyab” ang malinaw at buhay na larawan.
- source_word: σβέσαι
  choice: mapapatay
  rationale: Ang σβέννυμι ay pag-apula ng apoy. Karaniwan at angkop sa modernong Tagalog ang “patayin” kapag apoy o nagliliyab na bagay ang tinutukoy.
- source_word: τοῦ πονηροῦ
  choice: ng Masama
  rationale: 'Sa konteksto ng espirituwal na pakikipaglaban, pinakamalamang na personal ang kahulugan: “ang Masama.” Hindi ganap na inaalis ng Griyego ang abstraktong “kasamaan,” kaya inilagay iyon sa talababa.'
theological_decisions:
- issue: Kahulugan ng τοῦ πονηροῦ
  choice: ang Masama
  alternative: ang kasamaan
  rationale: Mas angkop sa larawan ng isang umaatakeng kaaway ang personal na pagbasa, ngunit maaari ring unawain ang anyong Griyego bilang abstraktong kasamaan. Pinananatili ng talababa ang interpretatibong tensiyon.
- issue: Kahulugan ng πίστις
  choice: pananampalataya
  alternative: pagtitiwala; katapatan
  rationale: Sa talinghagang ito, pinakamalamang na tumutukoy ang πίστις sa pananalig o pagtitiwala ng mananampalataya sa Diyos. Hindi pinili ang “katapatan” sapagkat hindi iyon ang pinakamalinaw na diin ng konteksto.
- issue: Ugnayan ng ἐν πᾶσιν sa listahan ng baluti
  choice: sa lahat ng pagkakataon
  alternative: kasama ng lahat ng ito; sa lahat ng bagay
  rationale: Maaaring pang-abay ang parirala at tumukoy sa bawat kalagayan, ngunit maaari rin itong iugnay sa lahat ng naunang bahagi ng baluti. Hindi nilutas nang palihim ang kalabuan; nakatala ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling bigkasin. Ginamit ang “kalasag,” “pananampalataya,” at “palaso” bilang pamilyar ngunit hindi lipas na mga salitang biblikal. Ang semicolon ay nagpapanatili sa mahigpit na ugnayan ng pagkuha sa kalasag at ng kakayahan nitong pumatay sa nagliliyab na mga palaso.
