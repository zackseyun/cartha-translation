base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/018.yaml
  text: with every prayer and petition, praying at all times in the Spirit, and for this very thing staying alert with all perseverance in petition for all the saints,
translation:
  language: tl
  text: Sa pamamagitan ng lahat ng panalangin at pakiusap, manalangin kayo sa bawat pagkakataon sa Espiritu.[a] Para rito, manatili kayong mapagbantay, na may buong pagtitiyaga at pakiusap para sa lahat ng mga banal.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa espiritu.” Maaaring mas pangkalahatan ang pagbasa sa Griyego, ngunit sa konteksto ay malamang na tumutukoy ito sa Espiritu Santo.
    reason: alternative_reading
  - marker: b
    text: Ang “mga banal” dito ay ang lahat ng banal na bayan ng Diyos—samakatuwid, ang lahat ng mananampalataya.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ πάσης προσευχῆς καὶ δεήσεως
  choice: Sa pamamagitan ng bawat uri ng panalangin at pakiusap
  rationale: Ipinapahayag ng διά na may genitive ang paraan o kasangkapan. Ang “bawat uri” ay natural na naghahatid ng lawak ng πάσης, habang pinananatiling magkaiba ang pangkalahatang προσευχή (“panalangin”) at ang tiyak na δέησις (“pakiusap”).
- source_word: προσευχόμενοι ἐν παντὶ καιρῷ
  choice: manalangin kayo sa lahat ng pagkakataon
  rationale: Ginawang natural na Tagalog na panghikayat ang kasalukuyang participle, na nakaugnay pa rin sa naunang konteksto ng utos. Mas malinaw sa karaniwang mambabasa ang “sa lahat ng pagkakataon” kaysa literal na “sa bawat panahon.”
- source_word: ἐν πνεύματι
  choice: sa Espiritu
  rationale: Sa agarang konteksto at sa karaniwang gamit ni Pablo, malamang na ang Espiritu Santo ang tinutukoy. Gayunman, nilalagyan ito ng talababa dahil maaari ring unawain ang anarthrous na parirala bilang “sa espiritu.”
- source_word: εἰς αὐτὸ
  choice: Dahil dito
  rationale: Natural na ipinapakita nito ang pagtukoy sa mismong layunin o gawaing nabanggit, nang hindi pinipilit kung pasulong o pabalik ang eksaktong saklaw ng reperensiya.
- source_word: ἀγρυπνοῦντες ἐν πάσῃ προσκαρτερήσει
  choice: manatili kayong mapagbantay nang buong tiyaga
  rationale: Pinananatili ng “mapagbantay” ang diwa ng gising at masusing pagbabantay, at ng “buong tiyaga” ang patuloy at matatag na pagpupursigi.
- source_word: καὶ δεήσει περὶ πάντων τῶν ἁγίων
  choice: sa pagdalangin para sa lahat ng mga banal
  rationale: Sa daloy ng Tagalog, ang δέησις ay natural na naisama bilang “pagdalangin,” na tumutukoy sa masikap na pakiusap para sa iba. Ang “mga banal” ay tumutukoy sa buong sambayanan ng mga mananampalataya, hindi lamang sa isang natatanging pangkat.
theological_decisions:
- issue: Tinutukoy ng πνεύματι
  choice: Espiritu Santo (“sa Espiritu”)
  alternative: espiritu ng tao o paraan ng pananalangin (“sa espiritu”)
  rationale: Ang “Espiritu” ang mas malamang dahil sa agarang pagbanggit sa Espiritu sa talata 17 at sa mas malawak na gamit ni Pablo. Pinananatili sa talababa ang tunay na ambiguwidad ng Griyego.
- issue: Kahulugan ng οἱ ἅγιοι
  choice: lahat ng mga banal, ibig sabihin, lahat ng kabilang sa banal na bayan ng Diyos
  alternative: mga santong kinilala sa mas huling, natatanging eklesiastikal na diwa
  rationale: Sa mga liham ni Pablo, ang ἅγιοι ay karaniwang tawag sa lahat ng mananampalataya bilang mga taong ibinukod para sa Diyos.
- issue: Ugnayan ng προσκαρτερήσει καὶ δεήσει
  choice: buong tiyaga sa pagdalangin
  alternative: buong tiyaga at pakiusap bilang dalawang magkatabing sangkap
  rationale: Ang pagsasalin ay nagbibigay ng natural na ugnayan sa Tagalog, kung saan ang pagtitiyaga ay isinasagawa sa patuloy na pagdalangin, ngunit hindi nito itinatanggi ang mas pormal na pagbasa sa καί.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pakiusap” sa halip na mas lumang “pagsusumamo,” at “mga banal” bilang tapat ngunit ipinaliwanag na katawagan para sa lahat ng mananampalataya. Hinati sa dalawang pangungusap para sa malinaw at natural na daloy habang pinananatili ang ugnayan sa naunang pangungusap ng talata 17.
