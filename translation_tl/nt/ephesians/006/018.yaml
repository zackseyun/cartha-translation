  terminology: Ang “Espiritu” na may malaking titik, kasama ng talababa, ay angkop na paghahatid ng malamang na tinutukoy habang pinananatili ang ambiguwidad. Ang “mga banal” ay tapat na katumbas ng ἅγιοι; ang paliwanag sa talababa ay angkop at hindi naglilimita rito sa isang huling eklesiastikal na kategorya.
