revisions:
- from: Sa pamamagitan ng bawat uri ng panalangin at pakiusap, manalangin kayo sa lahat ng pagkakataon sa Espiritu.[a] Dahil dito, manatili kayong mapagbantay nang buong tiyaga sa pagdalangin para sa lahat ng mga banal.[b]
  to: Sa pamamagitan ng lahat ng panalangin at pakiusap, manalangin kayo sa bawat pagkakataon sa Espiritu.[a] Para rito, manatili kayong mapagbantay, na may buong pagtitiyaga at pakiusap para sa lahat ng mga banal.[b]
  rationale: Pinalitan ang pang-ugnay upang maihatid ang εἰς αὐτὸ bilang layunin o pokus sa halip na sanhi. Ibinalik ang “pakiusap” upang malinaw na maisalin ang δέησις at mapanatili ang koordinasyon nito sa “pagtitiyaga,” nang hindi ipinipilit na hendiadys ang pinagtatalunang ugnayan ng mga salita. Ang “lahat ng panalangin at pakiusap” ay natural na Filipino para sa komprehensibong saklaw ng πάσης προσευχῆς καὶ δεήσεως.
