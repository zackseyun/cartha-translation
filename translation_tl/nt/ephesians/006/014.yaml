  text: στῆτε οὖν περιζωσάμενοι τὴν ὀσφὺν ὑμῶν ἐν ἀληθείᾳ, καὶ ἐνδυσάμενοι τὸν θώρακα τῆς δικαιοσύνης,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/014.yaml
  text: Stand[a], therefore, having fastened your waist with truth and having put on the breastplate of righteousness[b],
translation:
  language: tl
  text: Kaya tumayo kayo, na binigkisan ninyo ng katotohanan ang inyong baywang at isinuot ninyo ang baluti ng katuwiran[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “baluti ng katarungan.” Maaaring tumukoy ang Griyegong δικαιοσύνη kapwa sa katuwiran at katarungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: στῆτε
  choice: tumayo kayo
  rationale: Tuwirang inililipat ang aorist imperative na panawagan sa maramihang tagapakinig. Hindi idinagdag ang “nang matatag” sapagkat wala itong tahasang katumbas sa salita, bagaman ipinahihiwatig ito ng konteksto.
- source_word: οὖν
  choice: kaya
  rationale: Natural na pang-ugnay sa makabagong Tagalog na nagpapanatili sa paghihinuha mula sa naunang tagubilin.
- source_word: περιζωσάμενοι τὴν ὀσφὺν ὑμῶν
  choice: na binibigkisan ... ang inyong baywang
  rationale: Pinananatili ang tahasang bagay na “inyong baywang” at ang larawan ng pagbibigkis, nang hindi nagdaragdag ng salitang “sinturon” na wala sa Griyego.
- source_word: ἐν ἀληθείᾳ
  choice: ng katotohanan
  rationale: Sa loob ng larawang pandigma, natural itong nagpapahayag ng ipinambibigkis habang nananatiling bukás sa katotohanan bilang nilalaman at sa pagiging tapat bilang asal.
- source_word: ἐνδυσάμενοι
  choice: isinusuot
  rationale: Natural na Tagalog para sa pagsusuot ng kasuotan o baluti; kasama ng naunang pandiwaring sugnay, inilalarawan nito kung paano dapat tumayo ang mga mambabasa.
- source_word: θώρακα
  choice: baluti
  rationale: Karaniwang salitang Tagalog para sa pananggalang na isinusuot sa katawan; malinaw at marangal nang hindi gumagamit ng mas teknikal o lipas na katawagan.
- source_word: δικαιοσύνης
  choice: katuwiran
  rationale: Karaniwang katumbas ng Pauline δικαιοσύνη sa Tagalog at angkop sa metapora; hindi nito lubusang inaalis ang kaugnay na diwa ng katarungan, na pinananatili sa talababa.
theological_decisions:
- issue: Saklaw ng δικαιοσύνη sa metapora ng baluti
  choice: katuwiran
  alternative: katarungan
  rationale: Ang “katuwiran” ang pinakapamilyar at malawak na katumbas sa kontekstong Pauline, ngunit maaaring dalhin ng Griyego ang pampubliko at etikal na diwa ng “katarungan”; kaya hindi ito tahimik na inalis.
- issue: Kahulugan ng ἐν ἀληθείᾳ
  choice: ng katotohanan
  alternative: sa pagiging tapat
  rationale: Pinananatili ng “katotohanan” ang posibilidad ng obhetibong katotohanan at matapat na pamumuhay, sa halip na pumili lamang ng isa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “binibigkisan” upang mapanatili ang sinaunang larawan nang hindi tahasang nagdaragdag ng “sinturon.” Ang mga pandiwaring sugnay ay ginawang natural sa Tagalog habang nananatiling nakaugnay sa pangunahing utos na “tumayo kayo.”
