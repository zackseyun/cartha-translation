base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/019.yaml
  text: and for me[a], that words may be given to me in opening my mouth, to make known with boldness the mystery of the gospel[e][d][c][b],
translation:
  language: tl
  text: at ipanalangin din ninyo ako, na sa pagbuka ko ng aking bibig ay bigyan ako ng sasabihin upang buong tapang kong maipaalam ang hiwaga ng ebanghelyo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ὑπὲρ ἐμοῦ
  choice: at ipanalangin din ninyo ako
  rationale: Nakasalalay ito sa utos na manalangin sa naunang talata. Nilinaw sa Tagalog ang ipinahihiwatig na kahilingan upang maging likas at malinaw ang dugtong.
- source_word: ἵνα μοι δοθῇ λόγος
  choice: na ... ay bigyan ako ng sasabihin
  rationale: Ang singular na λόγος ay tumutukoy rito sa pananalitang o mensaheng ipagkakaloob kay Pablo. Ang “bigyan ako ng sasabihin” ay likas sa modernong Tagalog at hindi ipinapalagay na teknikal na titulo ang λόγος.
- source_word: ἐν ἀνοίξει τοῦ στόματός μου
  choice: kapag ibinuka ko ang aking bibig
  rationale: Pinananatili ang larawan ng pagbubukas ng bibig habang malinaw na ipinahahayag ang pangyayaring pagsisimula niyang magsalita.
- source_word: ἐν παρρησίᾳ
  choice: buong tapang
  rationale: Ipinahahayag ang hayag, malaya, at walang-takot na pagsasalita; mas natural ito sa Tagalog kaysa sa literal na “may katapangan.”
- source_word: γνωρίσαι
  choice: maipakilala
  rationale: Direktang ipinahahayag ang layuning gawing kilala o ipaalam, nang hindi dinaragdagan ang diwa bilang pormal na pangangaral.
- source_word: τὸ μυστήριον
  choice: ang hiwaga
  rationale: Ang “hiwaga” ay tumutukoy sa layunin ng Diyos na dating nakakubli at ngayo'y inihayag, hindi lamang sa palaisipang hindi malutas.
- source_word: τοῦ εὐαγγελίου
  choice: ng ebanghelyo
  rationale: Karaniwan at makabuluhang terminong Kristiyano sa Tagalog, at pinananatili ang teolohikal na bigat ng εὐαγγέλιον.
theological_decisions:
- issue: Diwa ng λόγος sa kahilingan ni Pablo
  choice: bigyan ako ng sasabihin
  alternative: bigyan ako ng mga salita / ipagkaloob sa akin ang mensahe
  rationale: Saklaw nito ang ipinagkaloob na nilalaman ng pagsasalita nang hindi nag-aangkat ng tiyak na doktrina ng inspirasyon o nililimitahan ito sa kakayahang bumigkas.
- issue: Lakas ng παρρησία
  choice: buong tapang
  alternative: nang buong tiwala / nang hayagan
  rationale: Pinananatili nito ang tensiyon ng malaya, hayag, at matapang na pagpapatotoo, hindi lamang pansariling tiwala.
- issue: Ugnayan ng μυστήριον at εὐαγγέλιον
  choice: ang hiwaga ng ebanghelyo
  alternative: ang lihim ng mabuting balita
  rationale: Pinananatili ang genitibong ugnayan at ang malawak na teolohikal na gamit ni Pablo nang hindi pinagpapasiyahan kung ito ay hiwagang nilalaman ng ebanghelyo o hiwagang nauukol dito.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginawang tahasan ang ipinahihiwatig na “ipanalangin” mula sa konteksto ng talata 18. Pinanatili ang larawang “ibinuka ... ang bibig” at ang terminong “hiwaga ng ebanghelyo.”
