  yaml_path: translation/nt/ephesians/006/010.yaml
  text: Finally[a], be strengthened in the Lord and in the strength of his might.
translation:
  language: tl
  text: Sa wakas, magpakatibay kayo sa Panginoon at sa kapangyarihan ng kanyang lakas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magpakatatag kayo sa Panginoon.” Ang pandiwang Griyego ay maaari ring unawaing “palakasin kayo,” na higit na naglalantad ng pasibo o middle na nuwes; mas likas sa Filipino ang “magpakatibay kayo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦ λοιποῦ
  choice: Sa wakas
  rationale: Likas na panandang pangdiskurso sa Filipino para sa pagpasok sa pangwakas na bahagi ng liham; hindi nito ipinipilit ang posibleng temporal na diwang “mula ngayon.”
- source_word: ἐνδυναμοῦσθε
  choice: patuloy kayong palakasin
  rationale: Pinananatili ang pautos at ang pasibong diwa na ang mga mambabasa ay tumatanggap ng lakas, habang ipinahihiwatig ng “patuloy” ang aspektong pangkasalukuyan ng pandiwang Griyego.
- source_word: ἐν κυρίῳ
  choice: sa Panginoon
  rationale: Pinananatili ang relasyonal o saklaw na gamit ng ἐν nang hindi ito nililimitahan sa instrumentong “sa pamamagitan ng Panginoon.”
- source_word: κράτει
  choice: lakas
  rationale: Tumutukoy sa mabisa o nahahayag na lakas at bumubuo ng marangal ngunit nauunawaang pariralang “lakas ng kanyang kapangyarihan.”
- source_word: ἰσχύος
  choice: kapangyarihan
  rationale: Ibinubukod sa κράτος sa pamamagitan ng ibang salitang Filipino habang pinananatili ang pinatinding pagkakahanay ng mga katawagang tumutukoy sa lakas.
- source_word: αὐτοῦ
  choice: kanyang
  rationale: Likas na tumutukoy pabalik sa Panginoon at hindi na kailangang ulitin ang pangngalan.
theological_decisions:
- issue: Tinig at pinagmumulan ng pagpapalakas sa ἐνδυναμοῦσθε
  choice: 'Pasibong panawagan: “patuloy kayong palakasin,” na nagpapakitang tinatanggap ang lakas sa halip na likhain lamang mula sa sariling pagpupunyagi.'
  alternative: “Magpakatatag kayo” o “magpakalakas kayo.”
  rationale: Maaaring unawain ang anyo bilang pasibo o middle, ngunit mas malinaw na napapanatili ng pangunahing salin ang pagdepende sa lakas na kaugnay ng Panginoon nang hindi nagdaragdag ng mas tiyak na doktrina.
- issue: Pagkasalin sa κύριος
  choice: Panginoon
  alternative: Guro o Amo
  rationale: Ang “Panginoon” ang likas at matatag na salin sa kontekstong Paulino at tumutukoy kay Jesus nang hindi nangangailangan ng paliwanag sa mismong talata.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang mabigat na pagkakahanay ng “lakas” at “kapangyarihan” upang masalamin ang dalawang magkaugnay ngunit magkaibang salitang Griyego.
