  text: ἐνδύσασθε τὴν πανοπλίαν τοῦ θεοῦ πρὸς τὸ δύνασθαι ὑμᾶς στῆναι πρὸς τὰς μεθοδείας τοῦ διαβόλου·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/011.yaml
  text: Put on the full armor of God[b][a], so that you may be able to stand against the schemes of the devil.
translation:
  language: tl
  text: Isuot ninyo ang buong baluti ng Diyos[a] upang makatayo kayo laban sa mga pakana[b] ng diyablo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “buong kagamitang pandigma ng Diyos.” Ang salitang Griyego ay tumutukoy sa kumpletong kagamitan ng isang kawal.
    reason: lexical_alternative
  - marker: b
    text: O, “mga tusong pamamaraan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδύσασθε
  choice: Isuot ninyo
  rationale: Tuwirang utos ito sa maramihan. Likas sa modernong Tagalog ang “isuot” para sa paghahanda ng isang kawal at napananatili nito ang lakas ng pautos.
- source_word: πανοπλίαν
  choice: buong kagamitang pandigma
  rationale: Ang salita ay tumutukoy sa kumpletong kagamitan ng isang kawal, hindi lamang sa pananggalang na baluti. Ipinahahayag ng “buong kagamitang pandigma” ang lawak at pagkakumpleto nito.
- source_word: τοῦ θεοῦ
  choice: ng Diyos
  rationale: 'Pinananatiling malawak ng pariralang “ng Diyos” ang genitibo: maaaring idiin ang pag-aari, kaugnayan, o pagkakaloob ng Diyos nang hindi pinipili nang tahasan ang isa lamang.'
- source_word: πρὸς τὸ δύνασθαι ὑμᾶς στῆναι
  choice: upang makatayo kayo
  rationale: Ipinahahayag ng “upang” ang layunin, samantalang pinananatili ng “makatayo” ang diwa ng kakayahang tumindig o manatili sa puwesto laban sa kalaban.
- source_word: στῆναι
  choice: makatayo
  rationale: Malapit ito sa payak na kahulugang “tumindig/manatiling nakatayo.” Hindi idinagdag sa pangunahing teksto ang “nang matatag,” bagaman ipinahihiwatig iyon ng larawang pandigma.
- source_word: μεθοδείας
  choice: mga pakana
  rationale: Ang “pakana” ay natural at kasalukuyang salitang Tagalog para sa tuso, mapanlinlang, at masamang balak o taktika.
- source_word: τοῦ διαβόλου
  choice: ng diyablo
  rationale: Sa konteksto ng espirituwal na pakikibaka, ang διάβολος ay katawagan sa personal na masamang kalaban, kaya ang karaniwang saling “diyablo” ang ginamit.
theological_decisions:
- issue: Kahulugan ng “kagamitang pandigma ng Diyos”
  choice: Pinanatili ang malawak na ugnayang ipinahahayag ng “ng Diyos.”
  alternative: “kagamitang pandigmang mula sa Diyos” o “kagamitang pandigma na pag-aari ng Diyos”
  rationale: Hindi tahasang nilulutas ng genitibong Griyego kung ang pangunahing diin ay pinagmulan, pagkakaloob, o pag-aari; kaya hindi ito nilimitahan ng salin.
- issue: Tinutukoy ng διάβολος
  choice: ang diyablo bilang personal na masamang kalaban
  alternative: ang maninirang-puri
  rationale: Ipinapahiwatig ng agarang konteksto ng espirituwal na pakikibaka sa Efeso 6 na isang personal at di-nakikitang kalaban ang tinutukoy, hindi lamang isang karaniwang taong naninirang-puri.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “kagamitang pandigma” upang mailahad ang buong saklaw ng πανοπλία, habang ang “pakana” ay maikli, natural, at may diwa ng panlilinlang. Parehong lumilitaw sa pangunahing teksto ang mga panandang [a] at [b].
