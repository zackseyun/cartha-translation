source:
  edition: SBLGNT
  text: Καὶ οἱ πατέρες, μὴ παροργίζετε τὰ τέκνα ὑμῶν, ἀλλὰ ἐκτρέφετε αὐτὰ ἐν παιδείᾳ καὶ νουθεσίᾳ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/004.yaml
  text: And fathers[a], do not provoke your children to anger[c][b], but bring them up in the discipline and instruction of the Lord.
translation:
  language: tl
  text: At kayo, mga ama,[a] huwag ninyong galitin[b] ang inyong mga anak; sa halip, palakihin ninyo sila sa disiplina at tagubilin ng Panginoon.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “mga ama,” hindi ang mas malawak na “mga magulang.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “udyukan sa galit” o “punuin ng sama ng loob.” Ang pandiwang Griyego ay tumutukoy sa pagsasanhi ng galit o hinanakit.
    reason: lexical_alternative
  - marker: c
    text: Ang “ng Panginoon” ay maaaring tumukoy sa disiplina at tagubilin na mula sa Panginoon, nauukol sa kanya, o pinapatnubayan niya.
    reason: alternative_reading
lexical_decisions:
- source_word: πατέρες
  choice: mga ama
  rationale: Tiyak na panlalaking pangmaramihan ang salitang Griyego at tuwirang tumutukoy sa mga ama; hindi ito pinalawak sa “mga magulang.”
- source_word: παροργίζετε
  choice: galitin
  rationale: Likas at malinaw sa modernong Tagalog ang “galitin” para sa pagsasanhi ng galit o sama ng loob na ipinahihiwatig ng pandiwa.
- source_word: τέκνα
  choice: mga anak
  rationale: Karaniwang tawag ito sa mga anak sa loob ng pamilya at hindi nagtatakda ng kasarian.
- source_word: ἐκτρέφετε
  choice: palakihin
  rationale: Sa konteksto ng pagpapalaki ng anak, nangangahulugan itong alagaan at hubugin hanggang lumaki, hindi lamang pakainin.
- source_word: παιδείᾳ
  choice: disiplina
  rationale: Saklaw nito ang humuhubog na pagsasanay at pagtutuwid na bahagi ng pagpapalaki.
- source_word: νουθεσίᾳ
  choice: tagubilin
  rationale: Ipinahihiwatig nito ang pasalitang paggabay, paalala, at mapagtuwid na pagtuturo; malinaw at marangal ang “tagubilin” sa kasalukuyang Tagalog.
- source_word: κυρίου
  choice: ng Panginoon
  rationale: Pinananatili ng pariralang ito ang siksik at malawak na ugnayang genitibo sa Griyego nang hindi ipinapasiya kung ito ay mula sa, nauukol sa, o pinapatnubayan ng Panginoon.
theological_decisions:
- issue: Saklaw ng πατέρες sa tagubilin sa sambahayan
  choice: Tiyak na “mga ama” ang tuwirang kinakausap.
  alternative: mga magulang
  rationale: Mga ama ang tahasang tinutukoy ng tekstong Griyego. Maaaring magkaroon ng mas malawak na aplikasyon, ngunit hindi iyon dapat ipasok sa salin.
- issue: Diwa ng κυρίου sa ἐν παιδείᾳ καὶ νουθεσίᾳ κυρίου
  choice: Pinanatili bilang “ng Panginoon.”
  alternative: mula sa Panginoon; tungkol sa Panginoon; ayon sa Panginoon
  rationale: Maaaring ipahiwatig ng genitibo ang pinagmulan, pag-aari, katangian, o oryentasyon. Hindi nilulutas ng salin ang kalabuan na pinananatili ng Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang “kayong mga ama” para sa tuwirang pakikipag-usap, “palakihin” bilang likas na pananalita tungkol sa paghubog sa mga anak, at “tagubilin” upang mapanatili ang diwa ng pasalita at mapagtuwid na paggabay.
