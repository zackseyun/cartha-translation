translation:
  language: tl
  text: Maglingkod nang may mabuting kalooban, na gaya ng paglilingkod sa Panginoon at hindi sa mga tao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετ’ εὐνοίας
  choice: nang may mabuting kalooban
  rationale: Ipinahahayag ng μετά na may genitive ang paraan o saloobing kalakip ng paglilingkod. Ang “mabuting kalooban” ay likas at marangal na Filipino para sa εὔνοια, na tumutukoy sa kusang-loob at mabuting hangarin.
- source_word: δουλεύοντες
  choice: maglingkod
  rationale: Bagaman maaaring tumukoy ang δουλεύω sa paglilingkod bilang alipin, malinaw na sa konteksto na mga alipin ang kinakausap. Kaya pinananatili rito ang pokus sa gawa ng paglilingkod sa natural na Filipino.
- source_word: ὡς
  choice: na para sa
  rationale: Sa sugnay na ito, ipinakikita ng ὡς kung kanino itinuturing na iniuukol ang paglilingkod. Mas natural sa Filipino ang “na para sa” kaysa sa literal ngunit alanganing “gaya sa,” nang hindi dinaragdagan ang diwa ng “kunwari” o “na para bang.”
- source_word: τῷ κυρίῳ
  choice: sa Panginoon
  rationale: Pinananatili ng “Panginoon” ang kristolohikal na titulo at ang kaibahan nito sa mga taong pinaglilingkuran sa lupa.
- source_word: ἀνθρώποις
  choice: sa mga tao
  rationale: Ang ἄνθρωποι ay tumutukoy rito sa mga taong nilalang sa pangkalahatan bilang kaibahan sa Panginoon. Ang “mga tao” ang natural at tumpak na modernong Filipino; hindi kailangang limitahan ito sa kalalakihan.
theological_decisions:
- issue: Paglalarawan kay κύριος bilang kaibahan ng mga panginoong tao
  choice: Panginoon
  alternative: amo
  rationale: Ang “Panginoon” ay nagpapanatili sa banal at kristolohikal na titulo, samantalang maaaring mapagkamalan ang “amo” na tumutukoy lamang sa panginoong tao sa konteksto.
- issue: Lakas ng pahiwatig ng pagkaalipin sa δουλεύοντες
  choice: maglingkod
  alternative: maglingkod bilang mga alipin
  rationale: Nasa nakapaligid na konteksto na ang katayuan ng mga kinakausap bilang mga alipin. Ang payak na “maglingkod” ay natural at hindi ikinukubli ang katotohanang panlipunan na malinaw na sa talata 5.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “mabuting kalooban” upang ipahayag ang panloob na disposisyon, at “mga tao” upang natural na ihatid ang pangkalahatang ἀνθρώποις. Walang footnote dahil walang mahalagang tekstuwal o leksikal na alternatibong kailangang ipakita sa talatang ito.
