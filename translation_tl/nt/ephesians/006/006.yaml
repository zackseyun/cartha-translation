source:
  edition: SBLGNT
  text: μὴ κατ’ ὀφθαλμοδουλίαν ὡς ἀνθρωπάρεσκοι ἀλλ’ ὡς ⸀δοῦλοι Χριστοῦ ποιοῦντες τὸ θέλημα τοῦ θεοῦ, ἐκ ψυχῆς
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/006.yaml
  text: not by eye-service[a], as people-pleasers, but as servants of Messiah[c][b], doing the will of God from the soul.
translation:
  language: tl
  text: hindi sa paglilingkod lamang kapag may nakakakita[a], gaya ng mga nagpapalugod sa tao, kundi bilang mga alipin ng Mesiyas[b], na gumagawa ng kalooban ng Diyos nang buong kaluluwa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “paglilingkod sa mata”; maaari ring isaling “pakitang-paglilingkod.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isaling “Cristo.” Ang Griyegong Christos ay nangangahulugang “Mesiyas” o “Pinahiran.”
    reason: alternative_reading
  - marker: c
    text: Maaari ring isaling “nang buong puso” o “nang buong-loob”; sa literal, “mula sa kaluluwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀφθαλμοδουλίαν
  choice: paglilingkod lamang kapag may nakakakita
  rationale: 'Ipinahahayag nito sa likas na modernong Tagalog ang diwa ng bihirang tambalang Griyego: paglilingkod na ginagawa para lamang makita o habang binabantayan. Inilalagay sa talababa ang literal na talinghaga.'
- source_word: ἀνθρωπάρεσκοι
  choice: mga nagpapalugod sa tao
  rationale: Pinananatili nito ang negatibong diwa ng paghahangad ng pagsang-ayon ng mga tao, nang hindi gumagamit ng pilit na tambalang salita.
- source_word: δοῦλοι
  choice: mga alipin
  rationale: Literal na mga alipin ang kausap sa konteksto, at mahalaga sa paghahambing ang kanilang lubos na pag-aari at paglilingkod sa Mesiyas; mas matindi at mas tumpak dito ang “alipin” kaysa “lingkod.”
- source_word: Χριστοῦ
  choice: ng Mesiyas
  rationale: Isinasalin ang titulong Χριστός ayon sa kahulugan nitong pinahirang hari, sa halip na ituring lamang itong pangalang pantangi.
- source_word: ποιοῦντες
  choice: na gumagawa
  rationale: Tuwirang inilalarawan ng pariralang ito ang patuloy na pagsasagawa ng kalooban ng Diyos at malinaw nitong inuugnay ang sugnay sa “mga alipin ng Mesiyas.”
- source_word: θέλημα
  choice: kalooban
  rationale: Ang “kalooban” ang natural at kinikilalang salin para sa nais ng Diyos na isagawa sa isang etikal na tagubilin.
- source_word: ἐκ ψυχῆς
  choice: nang buong kaluluwa
  rationale: Pinananatili ang salitang ψυχή bilang “kaluluwa” at ipinahahayag ang taos at buong-loob na pagkilos sa paraang maiintindihan sa modernong Tagalog.
theological_decisions:
- issue: Paglalarawan sa δοῦλοι sa konteksto ng sambahayan
  choice: mga alipin ng Mesiyas
  alternative: mga lingkod ng Mesiyas
  rationale: Yamang literal na mga alipin ang tinutukoy sa agarang konteksto at muling inilalarawan ang kanilang pangunahing katapatan at pag-aari, pinananatili ng “mga alipin” ang bigat at tensiyon ng teksto.
- issue: Pagsasalin sa Χριστοῦ bilang titulo o anyong parang pangalan
  choice: ng Mesiyas
  alternative: ni Cristo
  rationale: Ipinakikita ng “Mesiyas” ang kahulugan ng Χριστός bilang titulo ng pinahiran, habang inilalagay sa talababa ang nakaugaliang alternatibo upang hindi itago ang tradisyonal na anyo.
- issue: Antropolohikal na wika ng ἐκ ψυχῆς
  choice: nang buong kaluluwa
  alternative: nang buong puso / nang buong-loob
  rationale: Hindi tahimik na pinapalitan ang ψυχή ng “puso”; pinananatili ang “kaluluwa” habang ipinahihiwatig ng “buong” ang taos na pagkilos.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ang “paglilingkod lamang kapag may nakakakita” ay mas natural kaysa sa literal ngunit di-karaniwang “paglilingkod sa mata.” Pinanatili ang “alipin,” “Mesiyas,” at “kaluluwa” upang mapangalagaan ang bigat ng bokabularyo at teolohikal na tensiyon ng Griyego.
