  text: Οἱ δοῦλοι, ὑπακούετε τοῖς ⸂κατὰ σάρκα κυρίοις⸃ μετὰ φόβου καὶ τρόμου ἐν ἁπλότητι τῆς καρδίας ὑμῶν ὡς τῷ Χριστῷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/005.yaml
  text: Servants[a], obey your masters according to the flesh with fear and trembling, in sincerity of your heart, as to Messiah[b],
translation:
  language: tl
  text: Kayong mga alipin, sundin ninyo ang inyong mga amo sa mundong ito[a] nang may takot at panginginig at may tapat na puso, gaya ng pagsunod ninyo sa Mesiyas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ayon sa laman”; ibig sabihin, mga among tao lamang sa makalupang buhay.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Griyego na Christos ay nangangahulugang “Pinahiran” o “Mesiyas”; madalas din itong isalin na “Kristo.”
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλοι
  choice: mga alipin
  rationale: Tumutukoy ito sa mga taong nasa kalagayan ng pagkaalipin, hindi lamang sa karaniwang mga tagapaglingkod; hindi pinalalabo ng salin ang panlipunang realidad ng teksto.
- source_word: ὑπακούετε
  choice: sundin ninyo
  rationale: Malinaw at likas na pautos sa Filipino para sa patuloy na pagsunod sa awtoridad.
- source_word: κατὰ σάρκα
  choice: sa mundong ito
  rationale: Sa konteksto, ang parirala ay tumutukoy sa pansamantala at makalupang ugnayang pantao, hindi sa makasalanang kalikasan. Ipinaliliwanag sa talababa ang mas literal na anyo.
- source_word: κυρίοις
  choice: mga amo
  rationale: Ang tinutukoy ay mga amo ng mga alipin sa sambahayan. Mas angkop ito kaysa 'mga panginoon,' na maaaring mapagkamalang banal na titulo.
- source_word: μετὰ φόβου καὶ τρόμου
  choice: nang may takot at panginginig
  rationale: Pinananatili ang mariing tambalang pahayag at ang retorikal na lakas ng Griyego.
- source_word: ἐν ἁπλότητι τῆς καρδίας ὑμῶν
  choice: may tapat na puso
  rationale: Ipinahahayag ang katapatan at kawalan ng pagkukunwari na saklaw ng ἁπλότης sa natural na modernong Filipino.
- source_word: ὡς τῷ Χριστῷ
  choice: na para bang sa Mesiyas kayo sumusunod
  rationale: Pinananatili ang paghahambing na ipinahihiwatig ng ὡς nang hindi ipinapantay ang mga among tao sa Mesiyas.
theological_decisions:
- issue: Pagpapakahulugan sa κατὰ σάρκα
  choice: sa mundong ito
  alternative: ayon sa laman
  rationale: Dito, nililimitahan ng parirala ang pagkaamo sa makalupa at pantao lamang. Iniiwasan ng pangunahing salin ang maling pakahulugang moral o seksuwal, habang pinananatili sa talababa ang literal na pahayag.
- issue: Pagsasalin sa Χριστῷ
  choice: Mesiyas
  alternative: Cristo
  rationale: Ang Χριστός ay gumaganap bilang titulo at nangangahulugang 'Pinahiran' o 'Mesiyas'; kaya isinasalin ang kahulugan sa halip na basta hiramin ang tradisyonal na anyo.
- issue: Pagsasalin sa δοῦλοι sa konteksto ng pagkaalipin
  choice: mga alipin
  alternative: mga lingkod
  rationale: Tahasang kinakausap ng talata ang mga taong nasa ilalim ng mga amo sa sistemang pangsambahayan. Ang 'mga lingkod' ay maaaring magkubli sa sapilitang kalagayang tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'amo' para sa ugnayang panlipunan ng pagkaalipin at ang 'Mesiyas' bilang natatanging titulo. Isinaayos nang bahagya ang huling sugnay upang maging likas sa Filipino nang hindi nawawala ang paghahambing ng Griyego.
