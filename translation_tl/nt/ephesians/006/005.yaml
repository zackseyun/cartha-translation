revisions:
- from: Kayong mga alipin, sundin ninyo ang inyong mga amo sa mundong ito[a] nang may takot at panginginig at may tapat na puso, na para bang sa Mesiyas[b] kayo sumusunod.
  to: Kayong mga alipin, sundin ninyo ang inyong mga amo sa mundong ito[a] nang may takot at panginginig at may tapat na puso, gaya ng pagsunod ninyo sa Mesiyas[b].
  rationale: Inayos ang huling sugnay upang maipahayag ang payak na paghahambing ng ὡς nang hindi nagpapasok ng pahiwatig na ‘parang ngunit hindi talaga.’ Ginawang “Kristo” ang modernong Filipino na baybay sa talababa. Walang binago sa kahulugan, panlipunang katumpakan, o mga angkla ng talababa.
