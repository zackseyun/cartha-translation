    issue: Ang “na para bang” ay mas malakas kaysa sa ὡς.
    rationale: Ang ὡς ay nagpapahayag ng paghahambing (“gaya ng/as to”), hindi ng hipotetikal o tila-kunwaring pagsunod. Ang “gaya ng pagsunod ninyo” ay nagpapanatili ng paghahambing nang walang dagdag na pahiwatig.
  - severity: low
    issue: Hindi pamantayan ang baybay na “Cristo” sa talababa para sa modernong Filipino.
    rationale: Mas karaniwang modernong Filipino ang “Kristo.” Hindi nito binabago ang paliwanag na ang Christos ay isinasalin dito bilang “Mesiyas.”
