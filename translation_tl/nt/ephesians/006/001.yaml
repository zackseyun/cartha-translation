  yaml_path: translation/nt/ephesians/006/001.yaml
  text: Children[a], obey your parents in the Lord, for this is right.
translation:
  language: tl
  text: Mga anak, sundin ninyo ang inyong mga magulang sa Panginoon,[a] sapagkat ito ang tama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “bilang mga nakaugnay sa Panginoon.” Maaaring ilarawan ng parirala ang saklaw o paraan ng pagsunod, at maaari rin itong magpahiwatig na ang pagsunod ay nasasaklaw ng katapatan sa Panginoon.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκνα
  choice: Mga anak
  rationale: Tuwirang kinakausap ng pangmaramihang anyong ito ang mga anak sa sambahayan. Natural at eksakto sa modernong Tagalog ang “mga anak.”
- source_word: ὑπακούετε
  choice: sundin ninyo
  rationale: Ang kasalukuyang pautos ay humihiling ng patuloy at tumutugong pagsunod, hindi lamang pakikinig. Karaniwan at malinaw sa Tagalog ang “sundin ninyo” kapag mga magulang ang tinutukoy.
- source_word: γονεῦσιν
  choice: mga magulang
  rationale: Sama-samang tumutukoy ang pangngalang maramihan sa ama at ina; ang “mga magulang” ang natural at tiyak na katumbas.
- source_word: ἐν κυρίῳ
  choice: ayon sa Panginoon
  rationale: Pinananatili nitong kaugnay ng utos ang parirala at likas itong mabasa sa Tagalog, habang hindi lubusang nilulutas kung tumutukoy ito sa kalagayan, paraan, o hangganan ng pagsunod dahil sa katapatan sa Panginoon.
- source_word: δίκαιον
  choice: tama
  rationale: Sa kontekstong ito, inilalarawan ng salita ang nararapat sa moralidad. Malinaw at pangkaraniwan sa modernong Tagalog ang “tama.”
theological_decisions:
- issue: Saklaw at diwa ng pariralang ἐν κυρίῳ
  choice: Iniugnay sa utos bilang “sundin ninyo ang inyong mga magulang ayon sa Panginoon,” na may talababa upang mapanatili ang pagiging bukas ng diwa.
  alternative: “Sa Panginoon” o “bilang mga nakaugnay sa Panginoon”; maaari ring unawain na ang mga anak na nasa Panginoon ang kinakausap.
  rationale: Pinakanatural na kaugnay ng ἐν κυρίῳ ang pandiwang pautos, ngunit hindi tahasang nililinaw ng Griyego kung ito ay tumutukoy sa kalagayan o paraan ng pagsunod, o nagpapahiwatig na ang pagsunod ay may hangganang itinatalaga ng katapatan sa Panginoon. Iniiwasan ng salin at talababa ang pagtiyak sa iisang interpretasyon.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “sundin ninyo” sa halip na mas pormal na “tumALIMA” upang maging madaling maunawaan, at ang “ayon sa Panginoon” upang maging likas ang pangungusap habang pinananatili sa talababa ang tunay na lawak ng kahulugan ng ἐν κυρίῳ.
