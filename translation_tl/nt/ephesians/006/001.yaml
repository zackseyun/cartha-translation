review_pass:
  verdict: revise
  source_fidelity: Ang “Mga anak,” “sundin ninyo,” “inyong mga magulang,” at “sapagkat ito ang tama” ay tapat na sumasalin sa τέκνα, ὑπακούετε, γονεῦσιν, at δίκαιον. Gayunman, ang “ayon sa Panginoon” para sa ἐν κυρίῳ ay nagpapasok ng mas tiyak na diwang ‘alinsunod sa pamantayan ng Panginoon,’ samantalang ang Griyego ay nananatiling bukas tungkol sa saklaw at nuwes ng parirala. Ang “sa Panginoon” ang mas malapit at mas angkop na panatilihin ang ambigwidad.
  naturalness: Natural at malinaw ang pangungusap sa modernong Filipino Tagalog. Ang “sa Panginoon” ay bahagyang mas siksik ngunit katanggap-tanggap sa marangal na rehistrong pangkasulatan at mas tapat sa maigsi at bukas na Pauline na parirala.
  terminology: Ang “Panginoon” ay wastong katumbas ng κύριος at ang “mga magulang” ay wastong katumbas ng γονεῦσιν. Ang “sundin ninyo” ay angkop na pautos para sa ὑπακούετε.
  issues:
  - severity: medium
    issue: Ang “ayon sa Panginoon” ay masyadong naglilimita sa ἐν κυρίῳ.
    rationale: Ang “ayon sa” ay karaniwang nangangahulugang ‘alinsunod sa’ o ‘batay sa,’ kaya itinatakda nito ang parirala bilang pamantayan ng pagsunod. Hindi tahasang itinatakda ng Griyego ang ganitong nuwes; maaari itong tumukoy sa saklaw, paraan, o pagkakaugnay sa Panginoon. Ang literal na “sa Panginoon,” na sinusuportahan ng talababa, ay higit na nag-iingat sa ambigwidad.
  revised_text: Mga anak, sundin ninyo ang inyong mga magulang sa Panginoon,[a] sapagkat ito ang tama.
  revised_footnotes:
