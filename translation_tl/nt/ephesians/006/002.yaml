  yaml_path: translation/nt/ephesians/006/002.yaml
  text: Honor your father and mother—which is the first commandment with a promise—[a]
translation:
  language: tl
  text: “Igalang mo ang iyong ama at ina”—ito ang unang utos na may kasamang pangako—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “ang unang utos sa pangako”; ang diwa ay ito ang unang utos na may kalakip na pangako.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίμα
  choice: Igalang mo
  rationale: Ang pautos na anyo ng τιμάω ay humihiling ng aktibong pagbibigay-galang, hindi lamang panloob na pagtingin o damdamin. Likas at marangal sa modernong Filipino ang “Igalang mo.”
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα
  choice: ang iyong ama at ina
  rationale: Tuwiran at likas na katumbas ito ng mga katawagang pampamilya; sapat nang minsang gamitin ang “iyong” sa Filipino nang hindi nawawala ang saklaw nito sa parehong magulang.
- source_word: ἥτις ἐστὶν
  choice: ito ang
  rationale: Tumutukoy ang panghalip sa utos na kasisipi lamang. Ang “ito ang” ay mas natural sa Filipino kaysa sa isang mahigpit na pormal na “na siyang,” habang malinaw na ipinakikilala ang paliwanag ni Pablo.
- source_word: ἐντολὴ
  choice: utos
  rationale: Karaniwang salin sa Filipino ang “utos” at malinaw dito na tumutukoy ito sa isang utos mula sa Sampung Utos; hindi kailangang gumamit ng mas mabigat o di-likas na “kautusan.”
- source_word: πρώτη
  choice: unang
  rationale: Ordinal ang salita at tuwirang pinananatili ng “unang” ang pahayag ng Griyego nang hindi ito ginagawang “pinakamahalaga.”
- source_word: ἐν ἐπαγγελίᾳ
  choice: na may kasamang pangako
  rationale: Bagaman literal na “sa pangako,” ipinahihiwatig ng parirala na kalakip ng utos ang isang pangako. Nililinaw ito ng “may kasamang pangako” nang hindi inaalis sa talababa ang higit na literal na anyo.
theological_decisions:
- issue: Kaugnayan ng “unang utos” sa pagkakasunod-sunod ng Sampung Utos
  choice: “ang unang utos na may kasamang pangako”
  alternative: “ang unang utos sa pangako”; “ang pangunahing utos na may pangako”; “ang unang utos sa ikalawang bahagi ng Sampung Utos”
  rationale: Pinananatili ang “unang” bilang ordinal at inuunawa ang parirala bilang utos na sinamahan ng hayag na pangako, na ipagpapatuloy sa talata 3. Hindi nag-aangkat ang salin ng isang partikular na denominasyonal na pagbilang o ng pagpapakahulugang “pinakamahalaga.”
translation_notes:
  register: Modernong Filipino na malinaw, dignified, at angkop sa pampublikong pagbasa. Ginamit ang panipi para sa utos na sinisipi at mga gitling upang markahan ang paliwanag ni Pablo. Ang marker na [a] ay nasa pangunahing teksto.
