source:
  edition: SBLGNT
  text: Καὶ οἱ κύριοι, τὰ αὐτὰ ποιεῖτε πρὸς αὐτούς, ἀνιέντες τὴν ἀπειλήν, εἰδότες ὅτι καὶ ⸂αὐτῶν καὶ ὑμῶν⸃ ὁ κύριός ἐστιν ἐν οὐρανοῖς, καὶ προσωπολημψία οὐκ ἔστιν παρ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/009.yaml
  text: And masters[a], do the same things toward them, giving up threatening, knowing that both their Master and yours is in heaven[c][b], and there is no partiality with him.
translation:
  language: tl
  text: At kayong mga panginoon, ganoon din ang gawin ninyo sa kanila,[a] at tigilan ninyo ang pagbabanta.[b] Alam ninyong ang Panginoon nila at Panginoon din ninyo ay nasa langit,[c] at hindi siya nagtatangi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ganoon din ang pakikitungo ninyo sa kanila.” Malapit na inuulit ng Griyego ang naunang tagubilin at idiniriin ang katumbas na pakikitungo sa kanila.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “bitawan ninyo ang ugali ng pagbabanta.” Ang Griyegong ἀνιέντες ay maaaring mangahulugang paghinto o pagtalikod sa gawaing ito.
    reason: lexical_alternative
  - marker: c
    text: Sa Griyego, “nasa mga langit”; ang “nasa langit” ang natural na katumbas ng idyoma sa Filipino.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριοι
  choice: mga panginoon
  rationale: Sa konteksto ng sinaunang sambahayan, tumutukoy ito sa mga taong may kapangyarihan sa mga alipin. Pinananatili ng “mga panginoon” ang makasaysayang ugnayan at ang leksikal na pagkakaugnay nito sa banal na κύριος, habang nililinaw ng maliit at malaking titik ang magkaibang tinutukoy.
- source_word: τὰ αὐτὰ ποιεῖτε πρὸς αὐτούς
  choice: ganoon din ang gawin ninyo sa kanila
  rationale: Natural sa makabagong Filipino at pinananatili ang pagtukoy pabalik sa naunang utos at ang diin sa katumbas na wastong pakikitungo.
- source_word: ἀνιέντες τὴν ἀπειλήν
  choice: tigilan ninyo ang pagbabanta
  rationale: Ipinapahayag nang malinaw ang pagbitaw o paghinto sa nakagawiang pagbabanta, na siyang diwa ng pandiwaring ἀνιέντες at abstraktong pangngalang ἀπειλήν.
- source_word: εἰδότες
  choice: Alam ninyong
  rationale: Natural na Filipino na nagpapanatili sa kaalamang ito bilang batayan ng naunang mga utos, nang hindi labis na ipinapaliwanag ang ugnayang sanhi.
- source_word: καὶ αὐτῶν καὶ ὑμῶν ὁ κύριος
  choice: ang Panginoon nila at Panginoon din ninyo
  rationale: Pinananatili ang diin na iisa ang banal na Panginoon ng dalawang panig at ang retorikal na ugnayan sa mga makalupang panginoon.
- source_word: ἐν οὐρανοῖς
  choice: nasa langit
  rationale: Ito ang natural na katumbas sa Filipino ng Griyegong idyoma, bagaman maramihan ang anyong οὐρανοῖς.
- source_word: προσωπολημψία οὐκ ἔστιν παρ’ αὐτῷ
  choice: hindi siya nagtatangi
  rationale: Malinaw at idiomatikong ipinapahayag na walang pagkiling o paboritismo sa Diyos; iniiwasan nito ang mabigat at di-natural na literal na anyo.
theological_decisions:
- issue: Iisang lemma na κύριος para sa mga taong may kapangyarihan at sa banal na Panginoon
  choice: “mga panginoon” para sa mga tao at “Panginoon” para sa banal na tinutukoy
  alternative: “mga amo” para sa mga tao at “Panginoon” para sa banal na tinutukoy; o “Panginoon” sa parehong gamit
  rationale: 'Ang pagpapanatili sa parehong salitang-ugat ay nagpapakita ng sinadyang paghahambing ng teksto: ang mga makalupang panginoon ay nasa ilalim din ng Panginoong nasa langit. Nililinaw ng kapitalisasyon ang magkaibang tinutukoy.'
- issue: Saklaw ng utos na τὰ αὐτὰ ποιεῖτε
  choice: Panatilihin ang pangkalahatang “ganoon din ang gawin ninyo sa kanila”
  alternative: Ipaliwanag bilang “pakitunguhan din ninyo sila nang maayos”
  rationale: Hindi tahasang inililista ng Griyego kung alin sa mga naunang kilos ang tinutukoy. Pinananatili ng salin ang tunay na lawak at bahagyang kalabuan sa halip na paliitin ito sa isang paliwanag.
- issue: Kawalan ng προσωπολημψία sa Diyos
  choice: “hindi siya nagtatangi”
  alternative: “walang pagtatangi sa kaniya”
  rationale: Ang pandiwang pahayag ay natural sa Filipino at tapat sa teolohikal na diwa na hindi kumikiling ang Diyos batay sa katayuan ng tao.
translation_notes:
  register: Makabago, dignipikado, at madaling maunawaang Filipino. Ginamit ang “mga panginoon” sa halip na anahronistikong “mga employer” upang mapanatili ang sinaunang kontekstong panlipunan at ang sadyang pag-uugnay sa “Panginoon” sa ikalawang bahagi ng talata.
