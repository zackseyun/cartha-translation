id: EPH.6.23
reference: Ephesians 6:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Εἰρήνη τοῖς ἀδελφοῖς καὶ ἀγάπη μετὰ πίστεως ἀπὸ θεοῦ πατρὸς καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/023.yaml
  text: Peace to the brothers[a], and love with faith[c][b], from God the Father and the Lord Jesus the Messiah.
translation:
  language: tl
  text: Kapayapaan sa mga kapatid[a], at pag-ibig na may pananampalataya[b], mula sa Diyos Ama at sa Panginoong Jesus na Mesiyas.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay nasa anyong panlalaking maramihan na literal na “mga kapatid na lalaki,” ngunit maaari itong tumukoy sa lahat ng kabilang sa sambayanan ng mga mananampalataya, mga lalaki at mga babae.
    reason: alternative_reading
  - marker: b
    text: Maaari ring isalin na “pag-ibig na may katapatan” o “pag-ibig na may pagtitiwala.”
    reason: lexical_alternative
  - marker: c
    text: Sa Griyego, “Jesus Christ.” Isinalin dito ang titulong Χριστός bilang “Mesiyas” upang mapanatili ang kahulugan nito.
    reason: alternative_reading
lexical_decisions:
- source_word: Εἰρήνη
  choice: Kapayapaan
  rationale: Pinananatili ang maikli at walang-pandiwang anyo ng pagbabasbas sa Griyego, nang hindi tahasang nagdaragdag ng “nawa’y magkaroon.”
- source_word: τοῖς ἀδελφοῖς
  choice: sa mga kapatid
  rationale: Ang “mga kapatid” ang natural na salin sa Tagalog at maaaring tumukoy sa buong sambayanan ng mga mananampalataya; ipinaliliwanag sa talababa ang anyong panlalaki ng salitang Griyego.
- source_word: ἀγάπη
  choice: pag-ibig
  rationale: Karaniwan at tuwirang katumbas ng ἀγάπη, at pinananatili ang mahalagang ugnayang leksikal nito sa ibang gamit ni Pablo.
- source_word: μετὰ πίστεως
  choice: na may pananampalataya
  rationale: Ipinahahayag ng “na may” ang pagsama o accompaniment ng μετά, habang “pananampalataya” ang pangunahing kahulugan ng πίστις sa kontekstong ito.
- source_word: ἀπὸ
  choice: mula sa
  rationale: Malinaw na ipinakikita ang pinagmumulan ng kapayapaan, pag-ibig, at pananampalataya.
- source_word: θεοῦ πατρὸς
  choice: Diyos Ama
  rationale: Tumpak sa Griyego, na walang salitang “ating,” at natural bilang titulo sa Tagalog.
- source_word: κυρίου
  choice: Panginoon
  rationale: “Panginoon” ang karaniwan at angkop na salin ng κύριος sa kontekstong Kristolohikal.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus na Mesiyas
  rationale: Pinananatiling pangalan ang “Jesus” at isinasalin ang Χριστός bilang titulong “Mesiyas,” sa natural na pariralang Tagalog.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστοῦ sa pangwakas na pagbabasbas
  choice: Mesiyas
  alternative: Cristo
  rationale: Ang Χριστός ay may bisa pa rin bilang titulo. Ang “Mesiyas” ay nagpapanatili sa kahulugan nito sa halip na ituring lamang itong ikalawang bahagi ng pangalan.
- issue: Kasarian at saklaw ng ἀδελφοῖς
  choice: mga kapatid
  alternative: mga kapatid na lalaki at babae
  rationale: Walang gramatikal na kasarian ang karaniwang salitang Tagalog na “kapatid,” at natural itong tumutukoy sa buong komunidad. Hindi nililimitahan ng salin ang tawag sa mga lalaki lamang, ngunit itinatala sa talababa ang anyong panlalaki ng Griyego.
- issue: Kahulugan ng πίστις
  choice: pananampalataya
  alternative: katapatan o pagtitiwala
  rationale: “Pananampalataya” ang pangunahing kahulugan dito, ngunit pinananatili sa talababa ang leksikal na posibilidad ng “katapatan” at “pagtitiwala.”
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Pinanatili ang maikli at pormal na himig ng pagbabasbas, habang ginawang natural sa Tagalog ang mga pariralang “sa mga kapatid,” “na may pananampalataya,” at “Panginoong Jesus na Mesiyas.”
