base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/022.yaml
  text: 'I sent him to you for this very purpose: that you may know how we are[a], and that he may encourage your hearts.'
translation:
  language: tl
  text: 'Isinugo ko siya sa inyo para sa mismong layuning ito: upang malaman ninyo kung ano ang lagay namin[a] at upang palakasin niya ang inyong mga puso.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “malaman ninyo ang kalagayan namin” o “malaman ninyo ang mga bagay na may kinalaman sa amin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: siya
  rationale: Panghalip na tumutukoy kay Tiquico sa naunang talata; natural sa modernong Tagalog ang “siya” bilang layon ng “isinugo.”
- source_word: ἔπεμψα
  choice: Isinugo ko
  rationale: Ang aorist indicative ay tuwirang naipapahayag bilang naganap na kilos; ang “isinugo” ay angkop sa pagpapadala ng isang kinatawan.
- source_word: πρὸς ὑμᾶς
  choice: sa inyo
  rationale: Ipinahihiwatig ng πρός na ipinadala siya patungo sa mga tatanggap; “sa inyo” ang natural na katumbas sa Tagalog.
- source_word: εἰς αὐτὸ τοῦτο
  choice: para mismo sa layuning ito
  rationale: Pinananatili ng “mismo” ang pagbibigay-diin ng αὐτὸ τοῦτο, habang malinaw na ipinapahayag ng “layunin” ang purposibong gamit ng parirala.
- source_word: ἵνα
  choice: upang
  rationale: Malinaw at marangal na panandang Tagalog para sa sugnay na nagsasaad ng layunin.
- source_word: γνῶτε τὰ περὶ ἡμῶν
  choice: malaman ninyo ang kalagayan namin
  rationale: Natural na sinasaklaw ng “kalagayan namin” ang mga bagay na may kinalaman kay Pablo at sa kanyang mga kasama nang hindi nililimitahan sa isang partikular na detalye.
- source_word: καὶ
  choice: at upang
  rationale: Inuulit ang panandang purposibo upang malinaw na ihanay ang ikalawang layunin sa una.
- source_word: παρακαλέσῃ
  choice: palakasin niya
  rationale: Sa konteksto ng “mga puso,” ang παρακαλέω ay tumutukoy sa pagpapatibay o pagpapalakas ng loob; pinananatili ng “palakasin” ang pastoral na diwa nang hindi ito nililimitahan sa aliw lamang.
- source_word: τὰς καρδίας ὑμῶν
  choice: ang inyong mga puso
  rationale: Pinananatili ang biblikal na larawan ng puso bilang panloob na pagkatao at kalooban; malinaw pa rin ito sa modernong Tagalog.
theological_decisions:
- issue: Saklaw ng τὰ περὶ ἡμῶν
  choice: “ang kalagayan namin”
  alternative: “ang mga bagay tungkol sa amin” o “kung ano ang lagay namin”
  rationale: Maaaring tumukoy ang Griyego kapwa sa personal na lagay at sa mga pangyayari tungkol kina Pablo. Ang pangunahing salin ay natural ngunit may talababa upang mapanatili ang mas malawak at literal na posibilidad.
- issue: Diwa ng παρακαλέσῃ
  choice: “palakasin niya”
  alternative: “aliwin niya” o “pasiglahin niya”
  rationale: Malawak ang saklaw ng παρακαλέω. Sa pariralang “ang inyong mga puso,” ang pagpapalakas ng loob ang malamang na diwa, ngunit hindi ito pinakikitid tungo sa payo o pangangaral lamang.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “para mismo sa layuning ito” upang mapanatili ang diin ng Griyego, at ang “mga puso” upang mapanatili ang biblikal na larawan nang hindi ito ginagawang abstrakto.
