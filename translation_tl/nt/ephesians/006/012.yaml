source:
  edition: SBLGNT
  text: ὅτι οὐκ ἔστιν ἡμῖν ἡ πάλη πρὸς αἷμα καὶ σάρκα, ἀλλὰ πρὸς τὰς ἀρχάς, πρὸς τὰς ἐξουσίας, πρὸς τοὺς κοσμοκράτορας τοῦ ⸀σκότους τούτου, πρὸς τὰ πνευματικὰ τῆς πονηρίας ἐν τοῖς ἐπουρανίοις.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/012.yaml
  text: For our struggle is not against flesh and blood[a], but against the rulers, against the authorities, against the world-rulers of this darkness[c][b], against the spiritual forces of evil in the heavenly realms.
translation:
  language: tl
  text: Sapagkat ang pakikibaka natin ay hindi laban sa laman at dugo,[a] kundi laban sa mga pinuno, laban sa mga may kapangyarihan, laban sa mga tagapamahala ng sanlibutan na kabilang sa kadilimang ito,[b] at laban sa mga espirituwal na puwersa ng kasamaan sa makalangit na mga dako.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang pakikipagbuno natin ay hindi laban sa laman at dugo.”
    reason: lexical_alternative
  - marker: b
    text: O “mga tagapamahala ng sanlibutan na kabilang sa kasalukuyang kadilimang ito.”
    reason: lexical_alternative
  - marker: c
    text: O “sa makalangit na mga lugar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλη
  choice: pakikibaka
  rationale: Tumutukoy ang salita sa pakikipagbuno o malapitang labanan. Likas sa makabagong Filipino ang “pakikibaka” at pinananatili nito ang diwa ng matinding personal na tunggalian; inilagay sa talababa ang mas literal na “pakikipagbuno.”
- source_word: πρὸς αἷμα καὶ σάρκα
  choice: laban sa laman at dugo
  rationale: Bagaman “dugo at laman” ang ayos sa Griyego, “laman at dugo” ang likas at nakikilalang ayos sa Filipino. Tumutukoy ang idyoma sa mga taong may katawang mortal.
- source_word: ἀρχάς
  choice: mga pinuno
  rationale: Sa kontekstong ito, tumutukoy ito sa mga namumunong kapangyarihan. Mas malinaw sa karaniwang mambabasa ang “mga pinuno” kaysa sa tradisyonal ngunit di-gaanong malinaw na “mga principado.”
- source_word: ἐξουσίας
  choice: mga may kapangyarihan
  rationale: Pinananatili nito ang diwa ng awtoridad o kapangyarihang taglay, at maayos itong naihihiwalay sa naunang “mga pinuno.”
- source_word: κοσμοκράτορας
  choice: mga tagapamahala ng sanlibutan
  rationale: Pinananatili ng parirala ang tambalang diwa ng salitang Griyego—mga tagapamahala ng mundo o sanlibutan—nang hindi ito pinalalawak agad bilang “mga kosmikong kapangyarihan.”
- source_word: τοῦ σκότους τούτου
  choice: na kabilang sa kadilimang ito
  rationale: Malinaw nitong iniuugnay ang “kadilimang ito” sa mga tagapamahala nang hindi idinaragdag sa pangunahing teksto ang salitang “kasalukuyan,” na hindi tahasang nasa Griyego.
- source_word: τὰ πνευματικὰ τῆς πονηρίας
  choice: mga espirituwal na puwersa ng kasamaan
  rationale: Ang pang-uring ουδέτερο na maramihan ay ginamit bilang pangngalan at sa konteksto ay tumutukoy sa mga espirituwal na kapangyarihan. Nililinaw ng “mga puwersa” ang tinutukoy nang hindi labis na itinatakda bilang hukbo o isang tiyak na uri ng nilalang.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: sa mga dako sa kalangitan
  rationale: Likas at marangal itong katumbas ng pormulang paulit-ulit sa Efeso para sa makalangit na saklaw. Hindi nito nililimitahan ang parirala sa karaniwang pisikal na langit lamang.
theological_decisions:
- issue: Likas ng mga kalabang tinutukoy
  choice: Ipinakikita ng talata na ang mga kalaban ay mga kapangyarihang espirituwal na higit sa tao.
  alternative: Maaaring unawain ang mga katawagan bilang mga pinuno at institusyong pantao, o bilang kapwa mga espirituwal na nilalang at ang kanilang mga manipestasyon sa lupa.
  rationale: Ang pagsasama-sama ng ἀρχάς, ἐξουσίας, κοσμοκράτορας, at lalo na ng τὰ πνευματικὰ τῆς πονηρίας ay tuwirang tumuturo sa mga espirituwal na kalaban. Gayunman, hindi ipinagkakait ng salin ang posibilidad na makita ang kanilang impluwensiya sa mga kaayusang panlupa.
- issue: Kahulugan ng σάρξ sa idyomang “laman at dugo”
  choice: Tumutukoy ito sa mga taong may katawang mortal, hindi sa “makasalanang kalikasan.”
  alternative: Makasalanang kalikasan.
  rationale: Bahagi rito ang σάρξ ng idyomang tumutukoy sa mga tao bilang may pisikal at mortal na pag-iral. Hindi ito ang metaporikal na paggamit ni Pablo para sa makasalanang hilig o paraan ng pamumuhay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang paulit-ulit na “laban sa” upang mapanatili ang retorikal na diin ng Griyego. Iniwasan ang teknikal at denominasyonal na mga katawagang gaya ng “mga principado,” ngunit pinanatili ang pagkakaiba ng mga hanay ng kapangyarihan.
