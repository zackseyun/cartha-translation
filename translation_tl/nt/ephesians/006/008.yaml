base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/008.yaml
  text: knowing that each one[a], whatever good he does, this he will receive back from the Lord[b], whether servant or free.
translation:
  language: tl
  text: Yamang alam ninyo na ang bawat isa, anumang mabuting bagay na gawin niya, ay tatanggapin niyang muli iyon mula sa Panginoon, alipin man siya o malaya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰδότες
  choice: yamang alam ninyo
  rationale: Ang pang-abay na participle ay nag-uugnay at nagbibigay-batayan sa naunang tagubilin. Ipinahihiwatig ng “yamang” ang likas na dahilang diwa nang hindi ginagawang hiwalay na pangungusap.
- source_word: ἕκαστος
  choice: ang bawat isa
  rationale: Pinananatili ang distributibong diin sa bawat indibidwal.
- source_word: ὃ ἂν ποιήσῃ ἀγαθόν
  choice: anumang mabuti ang gawin niya
  rationale: Ipinapahayag ng ἄν kasama ng sugnay na relatibo ang kawalang-tiyak na “anuman,” habang pinananatili ng “mabuti” ang moral na katangian ng gawa.
- source_word: τοῦτο
  choice: ito
  rationale: Tuwirang tumutukoy pabalik sa mabuting ginawa at pinananatili ang diin ng demonstratibo.
- source_word: κομίσεται
  choice: tatanggapin ... muli
  rationale: Maaaring tumukoy ang pandiwa sa pagtanggap pabalik ng katumbas ng ginawa. Pinananatili ng saling ito ang ganting diwa nang hindi ito nililimitahan sa komersiyal na kabayaran.
- source_word: παρὰ κυρίου
  choice: mula sa Panginoon
  rationale: Ang παρά na may genitive ay nagsasaad ng pinagmulan. Pinananatili ng “Panginoon” ang malamang na pagtukoy kay Cristo at hindi ito ipinapantay sa panginoong tao sa sambahayan.
- source_word: δοῦλος
  choice: alipin
  rationale: Sa tahasang paghahambing sa taong malaya, ang salita ay tumutukoy sa kalagayang panlipunan ng pagkaalipin; hindi ito pinalalambot bilang simpleng lingkod.
- source_word: ἐλεύθερος
  choice: malaya
  rationale: Likas at maikli itong katapat ng “alipin” at malinaw na tumutukoy sa malayang katayuan.
theological_decisions:
- issue: Pagpapahayag sa δοῦλος sa konteksto ng alipin at panginoon
  choice: alipin
  alternative: lingkod
  rationale: Sentral sa talata ang pagkakaiba ng taong alipin at taong malaya. Mas tapat ang “alipin” sa makasaysayan at panlipunang realidad ng teksto.
- issue: Tinutukoy ng κυρίου
  choice: Panginoon
  alternative: panginoon
  rationale: Bagaman tungkol sa mga panginoong tao ang kalapit na konteksto, ang pinagmumulan ng pagtanggap dito ay ang banal na Panginoon, malamang si Cristo. Hindi kailangang gawing “amo,” na magpapalabo sa teolohikal na bigat.
- issue: Diwa ng κομίσεται
  choice: tatanggapin niya itong muli mula sa Panginoon
  alternative: gagantimpalaan siya ng Panginoon dahil dito
  rationale: Pinananatili ng napiling anyo ang larawan ng pagtanggap pabalik at ang gramatikal na diin sa “ito,” nang hindi ipinapalagay na gantimpala lamang o mahigpit na kabayaran ang tinutukoy.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang participial na kaugnayan sa naunang talata sa pamamagitan ng “yamang,” ang distributibong diin ng “bawat isa,” at ang matinding paghahambing na “alipin man siya o malaya.”
