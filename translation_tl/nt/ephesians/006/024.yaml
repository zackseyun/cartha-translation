    issue: Medyo di-likas ang “ating Panginoong Jesus na Mesiyas.”
    rationale: Sa modernong Filipino, mas malinaw ang “ating Panginoong si Jesus na Mesiyas,” kung saan ang “na Mesiyas” ay nananatiling titulo ni Jesus at hindi basta restriktibong sugnay.
