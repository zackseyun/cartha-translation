  text: ἡ χάρις μετὰ πάντων τῶν ἀγαπώντων τὸν κύριον ἡμῶν Ἰησοῦν Χριστὸν ἐν ⸀ἀφθαρσίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/024.yaml
  text: Grace be with all who love our Lord Jesus the Messiah with incorruptibility[a].
translation:
  language: tl
  text: Sumainyo nawa ang biyaya, kayong lahat na umiibig sa ating Panginoong si Jesus na Mesiyas sa kawalang-kasiraan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nang may pag-ibig na hindi nasisira”; maaari ring “nang buong katapatan” o “nang may pag-ibig na hindi nagmamaliw.” Maikli at may higit sa isang posibleng kahulugan ang pariralang Griyego na literal na “sa kawalang-kasiraan.”
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: biyaya
  rationale: Karaniwang salin ng χάρις at angkop sa anyo ng basbas sa pagtatapos ng liham ni Pablo.
- source_word: μετὰ πάντων
  choice: sumainyo nawa ... kayong lahat
  rationale: Walang lantad na pandiwa ang Griyego; idinagdag ang panghiling na 'nawa' at ginamit ang likas na Tagalog na 'sumainyo' upang maipahayag ang basbas na 'makasama ng lahat.'
- source_word: τῶν ἀγαπώντων
  choice: na umiibig
  rationale: Isinalin ang kasalukuyang participle bilang sugnay na naglalarawan sa lahat ng tinutukoy at nagpapanatili sa diwa ng patuloy na katangian.
- source_word: τὸν κύριον ἡμῶν
  choice: sa ating Panginoon
  rationale: Pinanatili ang kinikilalang titulong kristolohikal na κύριος bilang 'Panginoon' at ang ἡμῶν bilang 'ating.'
- source_word: Ἰησοῦν Χριστόν
  choice: Jesus na Mesiyas
  rationale: Isinalin ang Χριστός ayon sa kahulugan nitong titulo, 'Mesiyas,' sa halip na gawing pangalang 'Cristo'; ginawang natural sa Tagalog ang pagkakabit ng titulo sa pangalang Jesus.
- source_word: ἐν ἀφθαρσίᾳ
  choice: sa kawalang-kasiraan
  rationale: Pinili ang sadyang maikli at pormal na salin upang mapanatili ang tunay na kalabuan kung inilalarawan nito ang pag-ibig, ang paraan ng pag-ibig, o ang kalagayang kaugnay ng basbas.
theological_decisions:
- issue: Kahulugan at pagkakabit ng ἐν ἀφθαρσίᾳ
  choice: Pinanatili sa pangunahing teksto ang literal at malabong 'sa kawalang-kasiraan.'
  alternative: “nang may pag-ibig na hindi nasisira”; “nang buong katapatan”; “nang may pag-ibig na hindi nagmamaliw”
  rationale: Hindi tahasang nililinaw ng Griyego kung ang ἀφθαρσία ay katangian ng pag-ibig, paraan ng pag-ibig, o saklaw/kalagayang kaugnay ng basbas. Hindi dapat tahimik na pumili ng iisang interpretasyon.
- issue: Pagpapakahulugan sa Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Dito ay nananatiling malinaw ang gamit bilang titulo ng pinahirang hari; kaya isinalin ang kahulugan sa halip na gamitin ang nakasanayang anyong wari'y bahagi ng pangalan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang pormulang 'Sumainyo nawa' para sa likas na basbas, samantalang sadyang pinanatiling mas pormal ang 'sa kawalang-kasiraan' upang hindi mawala ang kalabuan ng orihinal.
