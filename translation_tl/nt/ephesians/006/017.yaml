id: EPH.6.17
reference: Ephesians 6:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ τὴν περικεφαλαίαν τοῦ σωτηρίου ⸀δέξασθε, καὶ τὴν μάχαιραν τοῦ πνεύματος, ὅ ἐστιν ῥῆμα θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/017.yaml
  text: And receive the helmet of salvation[a], and the sword of the Spirit, which is the word of God[b],
translation:
  language: tl
  text: At tanggapin ninyo ang helmet ng kaligtasan[a], at ang tabak ng Espiritu, na siyang salita ng Diyos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “kunin ninyo” ang helmet ng kaligtasan.
    reason: lexical_alternative
  - marker: b
    text: O, “pahayag ng Diyos”; maaaring bigyang-diin ng Griyegong rhēma ang isang binigkas na salita o mensahe.
    reason: lexical_alternative
lexical_decisions:
- source_word: δέξασθε
  choice: tanggapin ninyo
  rationale: Ang aorist middle imperative na nasa ikalawang panauhang maramihan ay malinaw na naipapahayag ng “tanggapin ninyo.” Pinananatili nito ang diwang pagtanggap o pagkuha sa kagamitang ipinagkakaloob, habang nananatiling natural sa Filipino.
- source_word: περικεφαλαίαν
  choice: helmet
  rationale: Ang “helmet” ay karaniwan at madaling maunawaang modernong salitang Filipino para sa kagamitang pandigma na pananggalang sa ulo; mas natural ito kaysa sa mahabang paliwanag sa pangunahing teksto.
- source_word: τοῦ σωτηρίου
  choice: ng kaligtasan
  rationale: Pinananatili ng pariralang ito ang genitibong ugnayan at ang malawak na diwa ng pagliligtas o kaligtasan nang hindi nililimitahan kung paano nauugnay ang kaligtasan sa helmet.
- source_word: μάχαιραν
  choice: tabak
  rationale: Ang “tabak” ay isang malinaw at marangal na katumbas para sa sandatang may talim. Hindi na idinagdag ang “maikling” sapagkat hindi kailangang paliitin ang kahulugan sa pangunahing teksto.
- source_word: τοῦ πνεύματος
  choice: ng Espiritu
  rationale: Sa konteksto, pinakamalamang na tumutukoy ito sa Banal na Espiritu. Ang malaking titik sa “Espiritu” ay nagpapakita ng reperensiyang ito nang hindi dinaragdagan ang sinasabi ng teksto tungkol sa eksaktong genitibong relasyon.
- source_word: ὅ ἐστιν
  choice: na siyang
  rationale: Natural na ipinahahayag ng “na siyang” ang paliwanag at pagkakakilanlan ng tabak bilang sumusunod na “salita ng Diyos.”
- source_word: ῥῆμα θεοῦ
  choice: salita ng Diyos
  rationale: Ang “salita ng Diyos” ang pinakanatural at pinakakilalang salin. Maaaring bigyang-diin ng ῥῆμα ang binigkas na salita o pahayag, kaya inilalahad ang alternatibo sa talababa.
theological_decisions:
- issue: Tinutukoy ng “Espiritu”
  choice: Banal na Espiritu
  alternative: espiritu ng tao o espirituwal na katangian
  rationale: Sa larawan ng baluti ng Diyos at sa pagkakaugnay nito sa salita ng Diyos, pinakamalamang na ang tinutukoy ay ang Banal na Espiritu. Gayunman, hindi nililinaw sa salin kung ang tabak ay pag-aari, kaloob, o kasangkapan ng Espiritu, kaya napapanatili ang saklaw ng genitibong parirala.
translation_notes:
  register: Modernong Filipino na may marangal at madaling maunawaang himig. Ginamit ang karaniwang hiram na salitang “helmet” at ang mas pampanitikan ngunit malinaw na “tabak.” Nasa pangunahing teksto ang lahat ng pananda ng talababa.
