  text: so that Messiah may dwell in your hearts through faith[a], being rooted and grounded in love[c][b],
translation:
  language: tl
  text: upang sa pamamagitan ng pananampalataya ay manahan ang Mesiyas sa inyong mga puso, na kayo’y nakaugat at nakatatag sa pag-ibig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “sa pag-ibig” ay pinakamalamang na kaugnay ng “nakaugat at nakatatag,” bagaman maaari rin itong iugnay ng ilan sa “manahan ... sa inyong mga puso.”
    reason: alternative_reading
lexical_decisions:
- source_word: κατοικῆσαι
  choice: manahan
  rationale: Ipinahihiwatig ng pandiwa ang matatag na paninirahan, hindi lamang pansamantalang paglagi; ang pawatas ay nakaugnay sa naunang panalangin bilang layunin o bunga.
- source_word: τὸν Χριστόν
  choice: ang Mesiyas
  rationale: Dito, ang Χριστός ay may pantukoy at likas na mababasa bilang titulo; isinasalin ng “Mesiyas” ang kahulugan nito sa halip na basta itong baybayin bilang pangalan.
- source_word: διὰ τῆς πίστεως
  choice: sa pamamagitan ng pananampalataya
  rationale: Ang parirala ay nagsasaad ng paraan kung paano mananahan ang Mesiyas sa kanilang mga puso; “pananampalataya” ang pinakaangkop sa kontekstong ito.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: sa inyong mga puso
  rationale: Natural na katumbas ito ng ekspresyong tumutukoy sa panloob na pagkatao, hindi lamang sa damdamin.
- source_word: ἐν ἀγάπῃ
  choice: sa pag-ibig
  rationale: Pinakamalamang na inilalarawan nito ang kalagayan o larangang kinaroroonan ng pagiging nakaugat at nakatatag.
- source_word: ἐρριζωμένοι
  choice: nakaugat
  rationale: Pinananatili nito ang larawang panghalaman at ang kasalukuyang kalagayang bunga ng naunang pagkakaugat.
- source_word: τεθεμελιωμένοι
  choice: nakatatag
  rationale: Ipinahihiwatig nito ang matibay na pagkakatayo sa isang pundasyon at likas itong kaagapay ng “nakaugat” sa Filipino.
theological_decisions:
- issue: Pagkasalin sa Χριστός
  choice: ang Mesiyas
  alternative: ang Cristo
  rationale: Pinananatili ng “Mesiyas” ang kahulugan ng titulo sa tekstong Griyego nang hindi nagdaragdag ng denominasyonal na pakahulugan.
- issue: Kahulugan ng πίστις
  choice: pananampalataya
  alternative: pagtitiwala; katapatan
  rationale: Sa pariralang ito, pinakamalamang na tumutukoy ang salita sa pananampalataya bilang paraan ng pananahan ng Mesiyas, bagaman maaari itong magkaroon ng ibang kahulugan sa ibang konteksto.
- issue: Pagkakaugnay ng ἐν ἀγάπῃ
  choice: iniuugnay sa “nakaugat at nakatatag”
  alternative: iniuugnay sa “manahan ... sa inyong mga puso”
  rationale: Mas likas sa daloy at ayos ng pangungusap na ang “sa pag-ibig” ang larangan ng pagiging nakaugat at nakatatag; gayunman, hindi ganap na imposible ang kabilang ugnayan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “manahan” upang ipakita ang matatag na paninirahan, at ang magkatambal na “nakaugat at nakatatag” upang mapanatili ang mga larawang panghalaman at panggusali.
