  text: εἴ γε ἠκούσατε τὴν οἰκονομίαν τῆς χάριτος τοῦ θεοῦ τῆς δοθείσης μοι εἰς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/002.yaml
  text: assuming indeed that you have heard of the stewardship of God's grace that was given to me for you[b][a],
translation:
  language: tl
  text: Kung talagang narinig ninyo[a] ang tungkol sa tungkuling pangasiwaan[b] ang biyaya ng Diyos na ibinigay sa akin para sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “yamang tunay na narinig ninyo.” Pasubali ang anyo ng Griego, bagaman sa konteksto ay malamang na inaasahan ni Pablo na totoo ito.'
    reason: alternative_reading
  - marker: b
    text: O “pananagutang pangasiwaan” o “pamamahala.” Ang salitang Griego ay maaaring tumukoy sa pamamahala o pananagutang ipinagkatiwala sa isang tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ γε
  choice: yamang tunay na
  rationale: Ipinahihiwatig nito na inaasahan ni Pablo na totoo ang kaniyang sinasabi, habang ipinapakita sa talababa na nananatiling pasubali ang anyong Griego.
- source_word: ἠκούσατε
  choice: narinig ninyo
  rationale: Natural na salin ng aorist na tumutukoy sa pagkarinig nila bilang isang buong pangyayari.
- source_word: οἰκονομίαν
  choice: tungkuling pangasiwaan
  rationale: Ipinapahayag nito ang pananagutang ipinagkatiwala kay Pablo, hindi lamang isang abstraktong plano o panahon.
- source_word: χάριτος
  choice: biyaya
  rationale: Karaniwan at angkop na katawagan sa Tagalog para sa χάρις, at pinananatili nito ang mahalagang bokabularyong teolohikal ni Pablo.
- source_word: τοῦ θεοῦ
  choice: ng Diyos
  rationale: 'Pinananatili ang ugnayang henitibo: ang biyaya ay mula sa Diyos at nauukol sa kaniya.'
- source_word: τῆς δοθείσης
  choice: na ibinigay
  rationale: Pinananatili ang pasibong diwa ng kaloob; sa balangkas ng pangungusap, pinakamalinaw itong nakakabit sa biyaya.
- source_word: μοι
  choice: sa akin
  rationale: Tuwirang katumbas ng datibong tumutukoy kay Pablo bilang tumanggap.
- source_word: εἰς ὑμᾶς
  choice: para sa inyo
  rationale: Natural na ipinapahayag ang layunin at kapakinabangan ng ministeryo ni Pablo para sa mga mambabasa.
theological_decisions:
- issue: Tinutukoy ng οἰκονομία τῆς χάριτος τοῦ θεοῦ
  choice: Ang pananagutang ipinagkatiwala kay Pablo na pangasiwaan ang biyaya ng Diyos para sa mga mambabasa.
  alternative: Ang mas abstraktong plano o dispensasyon ng Diyos para sa kaligtasan.
  rationale: Binibigyang-diin ng kalapit na konteksto ang ministeryo ni Pablo sa mga Hentil. Pinananatili ng “tungkuling pangasiwaan” ang diwa ng ipinagkatiwalang pananagutan nang hindi itinatanggi ang mas malawak na plano ng Diyos.
- issue: Lakas ng εἴ γε
  choice: Isang retorikal na pagpapalagay na inaasahang totoo.
  alternative: 'Isang payak at tunay na kondisyon: “kung talagang narinig ninyo.”'
  rationale: Sa konteksto, waring inaasahan ni Pablo na alam na ng mga mambabasa ang biyayang ibinigay sa kaniya; gayunman, inilalahad sa talababa ang literal na pasubaling anyo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “ang tungkol sa” upang maging natural ang pagkakaugnay ng “narinig” at ng tungkuling ipinagkatiwala kay Pablo, nang hindi binabago ang diwa ng orihinal.
