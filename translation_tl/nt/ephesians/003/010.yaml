- from: upang sa pamamagitan ng iglesya ay maipakilala ngayon sa mga pinuno at mga may kapangyarihan sa kalangitan[a][b] ang sari-saring karunungan ng Diyos[c].
  to: upang maipabatid ngayon, sa pamamagitan ng iglesya, sa mga pinuno at mga may awtoridad sa mga makalangit na dako[a][b], ang sari-saring karunungan ng Diyos[c].
  rationale: Pinalitan ang mas posibleng pisikal na “sa kalangitan” ng “sa mga makalangit na dako” upang mas tumpak na maihatid ang ἐν τοῖς ἐπουρανίοις. Pinalitan din ang “maipakilala” ng “maipabatid” para sa malinaw na kahulugang “gawing nalalaman,” at ang “mga may kapangyarihan” ng “mga may awtoridad” para sa mas malapit na katumbas ng ἐξουσίαις. Iningatan ang instrumental na “sa pamamagitan ng iglesya,” ang saklaw na kawalang-pagpapasya sa identidad ng mga kapangyarihan, at ang mga footnote anchor.
