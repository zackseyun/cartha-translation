  terminology: Ang “iglesya,” “Diyos,” at “sari-saring karunungan” ay angkop sa modernong Filipino Tagalog at sa rehistrong biblikal. Pinanatili ang malawak na “mga pinuno at mga may awtoridad,” nang hindi idinaragdag sa pangunahing teksto ang interpretasyong “mga espiritu” o “mga anghel.”
