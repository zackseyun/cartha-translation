  source_fidelity: 'Ang pangunahing diwa at mga ugnayang panggramatika ay naipapahayag nang wasto: layunin (ἵνα), pasibong pagpapabatid (γνωρισθῇ), panahon (νῦν), instrumental na papel ng iglesya (διὰ τῆς ἐκκλησίας), at ang maraming-aspektong karunungan ng Diyos. Gayunman, ang “sa kalangitan” ay maaaring mas madaling unawaing pisikal na himpapawid kaysa sa Paulinong pariralang ἐν τοῖς ἐπουρανίοις. Ang “sa mga makalangit na dako” ay mas tumpak na katumbas habang hindi labis na ipinapakahulugan ang sanggunian.'
