source:
  edition: SBLGNT
  text: ἵνα γνωρισθῇ νῦν ταῖς ἀρχαῖς καὶ ταῖς ἐξουσίαις ἐν τοῖς ἐπουρανίοις διὰ τῆς ἐκκλησίας ἡ πολυποίκιλος σοφία τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/010.yaml
  text: so that now[a], through the church, the manifold wisdom of God might be made known to the rulers and the authorities in the heavenly realms[c][b],
translation:
  language: tl
  text: upang maipabatid ngayon, sa pamamagitan ng iglesya, sa mga pinuno at mga may awtoridad sa mga makalangit na dako[a][b], ang sari-saring karunungan ng Diyos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa kalangitan.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mga pinuno at mga may awtoridad sa mga makalangit na dako” ay malamang na tumutukoy sa mga kapangyarihang kosmiko o espirituwal, hindi lamang sa mga taong may awtoridad.
    reason: cultural_note
  - marker: c
    text: Ang “sari-saring” ay nagpapahiwatig ng karunungang may maraming aspekto o mayamang pagkakaiba-iba.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: upang
  rationale: Likas na panandang Filipino para sa layunin at pinananatili ang telikong diwa ng sugnay.
- source_word: γνωρισθῇ
  choice: ay maipakilala
  rationale: 'Pinananatili ang pasibong diwa: ang karunungan ng Diyos ang ipinababatid o ginagawang kilala.'
- source_word: νῦν
  choice: ngayon
  rationale: Tuwirang katumbas ng temporal na pang-abay.
- source_word: ταῖς ἀρχαῖς καὶ ταῖς ἐξουσίαις
  choice: sa mga pinuno at mga may kapangyarihan
  rationale: Malinaw sa modernong Filipino at hindi labis na tinutukoy kung anong uri ng mga kosmiko o espirituwal na kapangyarihan ang tinutukoy.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: sa kalangitan
  rationale: Natural at marangal na Filipino para sa makalangit na saklaw; hindi ito nililimitahan sa pisikal na langit.
- source_word: διὰ τῆς ἐκκλησίας
  choice: sa pamamagitan ng iglesya
  rationale: Malinaw na ipinahahayag ang instrumentong diwa ng διά na may genitive.
- source_word: ἡ πολυποίκιλος σοφία
  choice: ang sari-saring karunungan
  rationale: Ipinahahayag ang may maraming anyo, aspekto, o mayamang pagkakaiba-iba ng πολυποίκιλος sa karaniwang modernong Filipino.
- source_word: τοῦ θεοῦ
  choice: ng Diyos
  rationale: Tuwirang genitibong nagpapakilalang ang karunungan ay sa Diyos.
theological_decisions:
- issue: Pagkakakilanlan ng “mga pinuno at mga may kapangyarihan”
  choice: Pinanatili sa pangunahing teksto ang malawak na katawagang tumutukoy, ayon sa konteksto, sa mga kosmiko o espirituwal na kapangyarihan.
  alternative: Mga taong pinuno at awtoridad, o kapuwa makalupa at makalangit na mga kapangyarihan.
  rationale: Malakas na ipinahihiwatig ng pariralang ἐν τοῖς ἐπουρανίοις ang higit-sa-taong mga kapangyarihan, ngunit hindi nagdaragdag ang salin ng salitang “anghel” o “espiritu” na wala sa Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “iglesya” bilang karaniwang terminong biblikal at ang “sa pamamagitan ng” upang malinaw ang instrumental na relasyon. Inayos ang salita ayon sa likas na daloy ng Filipino habang pinananatili ang pokus sa layuning maipakilala ang karunungan ng Diyos.
