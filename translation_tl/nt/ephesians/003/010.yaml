    rationale: Ang ἐξουσίαις ay tumutukoy lalo na sa mga awtoridad o kapangyarihang may hurisdiksiyon. Ang “mga may awtoridad” ay mas malapit, ngunit hindi isinasara ang kahulugang kosmiko.
