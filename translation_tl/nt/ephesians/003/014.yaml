lexical_decisions:
- source_word: Τούτου χάριν
  choice: Dahil dito
  rationale: Likas na idyomang Filipino ito para sa batayan o dahilan ng kasunod na pahayag, at malinaw nitong inuugnay ang panalangin ni Pablo sa naunang konteksto.
- source_word: κάμπτω τὰ γόνατά μου
  choice: iniluluhod ko ang aking mga tuhod
  rationale: Pinananatili nito ang tahasang larawan ng pagbaluktot o pagluhod ng mga tuhod bilang tindig sa pananalangin. Mas natural ito sa Filipino kaysa sa literal na “binabaluktot ko ang aking mga tuhod,” habang hindi lubusang pinaiikli sa “lumluluhod ako.”
- source_word: πρὸς
  choice: sa
  rationale: Sa konteksto ng panalangin, natural na ipinahahayag ng “sa” ang direksiyon o pinatutunguhan ng panalangin nang hindi idinaragdag ang di-kinakailangang diwa ng “sa harap ng.”
- source_word: τὸν πατέρα
  choice: Ama
  rationale: Tinutukoy sa konteksto ang Diyos na pinatutunguhan ng panalangin. Ang malaking titik ay angkop sa Filipino kapag ginagamit ang “Ama” bilang pantukoy sa Diyos.
theological_decisions:
- issue: Kung ang πατέρα ay dapat isaling banal na pantawag
  choice: Ama
  alternative: ama
  rationale: Ang konteksto ay panalanging iniuukol sa Diyos, at pinalalawak ng kasunod na talata ang wikang may kaugnayan sa pagiging ama. Kaya ang “Ama” ay tapat sa tinutukoy nang hindi nagdaragdag ng doktrinal na paliwanag.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang larawan ng mga tuhod sa halip na gawing simpleng “lumluluhod ako,” bagaman ginamit ang natural na pandiwang “iniluluhod” upang maiwasan ang alanganing literalismo.
