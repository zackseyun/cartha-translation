  text: in whom we have boldness and access with confidence through faith in him[a].
translation:
  language: tl
  text: Sa kanya, may lakas ng loob tayo at malayang makalalapit nang may pagtitiwala sa pamamagitan ng pananampalataya sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “sa pamamagitan ng kanyang katapatan.” Maaaring mangahulugan ang pariralang Griyego ng pananampalataya sa kanya o ng sarili niyang katapatan.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Sa kanya
  rationale: Ang panlalaking panghalip ay pinakamalamang na tumutukoy kay Cristo sa naunang konteksto. Likas sa Filipino ang “sa kanya” at pinananatili nito ang personal na ugnayan.
- source_word: παρρησίαν
  choice: kalayaan
  rationale: Ipinahahayag dito ang malaya at walang-takot na paglapit. Sa pariralang “kalayaang lumapit,” naihihiwalay ito sa πεποίθησις, na isinaling “pagtitiwala.”
- source_word: προσαγωγὴν
  choice: lumapit sa Diyos
  rationale: Ang salita ay tumutukoy sa pagpasok o paglapit sa presensiya ng Diyos. Ginawang pandiwa ang abstraktong pangngalan upang maging natural sa modernong Filipino; nilinaw ang Diyos bilang di-tahasang layon mula sa konteksto.
- source_word: ἐν πεποιθήσει
  choice: nang may pagtitiwala
  rationale: Natural itong paglalarawan sa paraan ng paglapit at pinananatili ang diwa ng katiyakan nang hindi inuulit lamang ang παρρησία.
- source_word: διὰ τῆς πίστεως αὐτοῦ
  choice: sa pamamagitan ng pananampalataya sa kanya
  rationale: Ginamit sa pangunahing teksto ang karaniwang pagbasa sa genitibo bilang pananampalatayang nakatuon kay Cristo. Ang posibleng pagbasa na tumutukoy sa katapatan niya ay pinanatili sa talababa.
theological_decisions:
- issue: Kahulugan ng διὰ τῆς πίστεως αὐτοῦ
  choice: sa pamamagitan ng pananampalataya sa kanya
  alternative: sa pamamagitan ng kanyang katapatan
  rationale: Maaaring unawain ang αὐτοῦ bilang layon ng pananampalataya o bilang gumagawa/nagtataglay ng katapatan. Ang pangunahing teksto ay sumusunod sa unang pagbasa dahil nakatuon ang pangungusap sa paglapit ng mga mananampalataya, ngunit hindi inaalis ang tunay na gramatikal at teolohikal na alternatibo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinagsama ang παρρησία at προσαγωγή bilang natural na “kalayaang lumapit,” habang pinanatiling hiwalay ang “pagtitiwala.”
