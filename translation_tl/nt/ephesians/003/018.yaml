  text: ἵνα ἐξισχύσητε καταλαβέσθαι σὺν πᾶσιν τοῖς ἁγίοις τί τὸ πλάτος καὶ μῆκος καὶ ⸂ὕψος καὶ βάθος⸃,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/018.yaml
  text: so that you may be strong enough to comprehend[a], together with all the saints, what is the width and length and height and depth[b],
translation:
  language: tl
  text: upang magkaroon kayo ng sapat na lakas na maunawaan, kasama ng lahat ng mga banal, kung ano ang lawak, haba, taas, at lalim[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi sinasabi nang tahasan sa Griyego kung ano ang inilalarawan ng mga dimensiyong ito. Marami ang umuunawa na nagpapatuloy ang diwa sa susunod na talata, tungkol sa pag-ibig ng Mesiyas.
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: upang
  rationale: Likas na ipinahahayag ang layunin o bunga ng naunang panalangin habang pinananatili ang puwersang teliko ng Griyego.
- source_word: ἐξισχύσητε
  choice: magkaroon kayo ng sapat na lakas
  rationale: Ipinahahayag ng pandiwa ang pagkakaroon ng lakas o kakayahang sapat para sa kasunod na infinitive.
- source_word: καταλαβέσθαι
  choice: maunawaan
  rationale: Sa konteksto, tumutukoy ito sa pag-arok o pag-unawang mental; malinaw at natural ang “maunawaan” sa modernong Filipino.
- source_word: σὺν πᾶσιν τοῖς ἁγίοις
  choice: kasama ng lahat ng mga banal
  rationale: Pinananatili ang sama-samang pakikibahagi at ang karaniwang katawagang Paulino para sa mga mananampalataya.
- source_word: τί
  choice: kung ano ang
  rationale: Direktang ipinakikilala ang nilalaman ng dapat maunawaan nang hindi dinaragdagan ng interpretibong “kung gaano kalaki.”
- source_word: τὸ πλάτος
  choice: lawak
  rationale: Natural na katumbas ng πλάτος sa Filipino at angkop sa serye ng mga dimensiyon.
- source_word: μῆκος
  choice: haba
  rationale: Direkta at karaniwang katumbas ng terminong panukat.
- source_word: ὕψος
  choice: taas
  rationale: Direkta at karaniwang katumbas ng terminong panukat.
- source_word: βάθος
  choice: lalim
  rationale: Direkta at karaniwang katumbas ng terminong panukat.
theological_decisions:
- issue: Tinutukoy ng apat na dimensiyon
  choice: Hindi tahasang tukuyin sa pangunahing teksto kung ano ang may lawak, haba, taas, at lalim.
  alternative: Idagdag na ang mga dimensiyon ay sa pag-ibig ng Mesiyas, o sa plano o kapuspusan ng Diyos.
  rationale: Walang hayagang layon ang apat na dimensiyon sa talatang Griyego. Ang pagdaragdag ng “ng pag-ibig ng Mesiyas” ay kukuha ng ideya mula sa susunod na talata at magpapasya sa isang tunay na bukas na konstruksyon.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “mga banal” upang panatilihin ang katawagang Paulino; pinanatiling bukas ang tinutukoy ng apat na dimensiyon. Ang bantas na kuwit sa hulihan ay nagpapakitang nagpapatuloy ang pangungusap sa talata 19.
