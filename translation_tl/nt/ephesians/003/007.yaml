source:
  edition: SBLGNT
  text: οὗ ⸀ἐγενήθην διάκονος κατὰ τὴν δωρεὰν τῆς χάριτος τοῦ θεοῦ ⸂τῆς δοθείσης⸃ μοι κατὰ τὴν ἐνέργειαν τῆς δυνάμεως αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/007.yaml
  text: of which I became a servant according to the gift of God's grace given to me according to the working of his power—[a]
translation:
  language: tl
  text: na naging lingkod ako nito ayon sa kaloob ng biyaya ng Diyos na ibinigay sa akin, ayon sa pagkilos ng kanyang kapangyarihan—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “na ginawa akong tagapaglingkod nito.”'
    reason: Ipinapakita nito ang posibleng pasibong diwa ng ἐγενήθην at ang alternatibong ministeryal na nuansa ng διάκονος, habang pinananatili ang ugnayan ng οὗ sa naunang binanggit na mabuting balita.
lexical_decisions:
- source_word: οὗ
  choice: na
  rationale: Ang panghalip na ito ay tumutukoy sa εὐαγγέλιον (“mabuting balita”) sa naunang talata. Sa natural na Tagalog, ang ugnayang “of which” ay malinaw na naipahahayag sa sugnay na “na naging lingkod ako,” nang hindi inuulit ang pangngalan.
- source_word: ἐγενήθην
  choice: naging
  rationale: Karaniwang kahulugan ng anyong ito ng γίνομαι ang pagpasok o pagkakaroon ng isang kalagayan o tungkulin. Natural ang “naging” at hindi nito labis na tinutukoy ang ahensiya, bagaman malinaw sa kasunod na pananalita na ang Diyos ang pinagmulan ng kaloob at kapangyarihan.
- source_word: διάκονος
  choice: lingkod
  rationale: Tumutukoy ito rito sa isang naglilingkod kaugnay ng mabuting balita. Ang “lingkod” ay malinaw at hindi nag-aangkat ng mas huling teknikal na kahulugan ng isang opisyal na “diyakono.”
- source_word: κατὰ τὴν δωρεὰν
  choice: ayon sa kaloob
  rationale: Pinananatili ng “ayon sa” ang diwa ng pamantayan, batayan, o sukat na ipinahihiwatig ng κατά, samantalang natural at malinaw ang “kaloob” para sa δωρεά.
- source_word: τῆς χάριτος τοῦ θεοῦ
  choice: ng biyaya ng Diyos
  rationale: 'Pinananatili nito ang henitibong ugnayan: ang kaloob ay kaloob ng biyaya na nagmumula sa Diyos o binubuo ng kanyang biyaya, nang hindi pinipilit pumili sa mga malapit na nuansang iyon.'
- source_word: τῆς δοθείσης μοι
  choice: na ibinigay sa akin
  rationale: Malinaw na iniuugnay ng sugnay ang pagkakaloob sa biyaya at pinananatili ang pasibong diwa ng banal na pagbibigay.
- source_word: κατὰ τὴν ἐνέργειαν
  choice: ayon sa pagkilos
  rationale: Ang ἐνέργεια ay aktibo at mabisang paggawa o pagkilos. Ang “pagkilos” ay natural sa modernong Tagalog at hindi kasing-teknikal ng “operasyon.”
- source_word: τῆς δυνάμεως αὐτοῦ
  choice: ng kanyang kapangyarihan
  rationale: Ang “kapangyarihan” ang karaniwan at angkop na katumbas ng δύναμις sa kontekstong Paulino; malinaw na tumutukoy ang “kanyang” sa Diyos.
theological_decisions:
- issue: Kalikasan ng papel ni Pablo bilang διάκονος
  choice: lingkod
  alternative: ministro; diyakono
  rationale: Ang konteksto ay ang paglilingkod ni Pablo sa mabuting balita, hindi tahasang isang pormal na katungkulan sa iglesya. Iniiwasan ng “lingkod” ang pag-aangkat ng kalaunang estrukturang eklesiastikal.
- issue: Ahensiya sa ἐγενήθην
  choice: naging
  alternative: ginawang
  rationale: Maaaring marinig ang pasibong pahiwatig sa Griyego, ngunit hindi kailangang tahasang tukuyin iyon sa pandiwa. Ang “naging” ay natural at pinananatili ang kalabuan, samantalang ipinakikita ng kaloob, biyaya, at kapangyarihan sa kasunod na parirala ang pagkilos ng Diyos.
- issue: Dalawang gamit ng κατά
  choice: ayon sa ... ayon sa ...
  alternative: sa pamamagitan ng ... sa bisa ng ...
  rationale: Ang pag-uulit ay sumasalamin sa estruktura ng Griyego at pinananatili ang posibleng diwa ng batayan, pamantayan, o sukat sa parehong parirala sa halip na gawing tahasang instrumento lamang.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang tuloy-tuloy na anyo ng pangungusap at ang em dash dahil bahagi ito ng mas malawak na pangungusap sa konteksto. Ginamit ang “biyaya,” “kaloob,” at “kapangyarihan” bilang pamilyar at tumpak na bokabularyong biblikal.
