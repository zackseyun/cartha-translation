  text: ἐμοὶ τῷ ἐλαχιστοτέρῳ πάντων ἁγίων ἐδόθη ἡ χάρις αὕτη— ⸀τοῖς ἔθνεσιν εὐαγγελίσασθαι ⸂τὸ ἀνεξιχνίαστον πλοῦτος⸃ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/008.yaml
  text: To me[a], the very least of all the saints, this grace was given—to proclaim to the Gentiles the unsearchable riches of Messiah[c][b],
translation:
  language: tl
  text: 'Sa akin—na siyang pinakamababa sa lahat ng mga banal[a]—ipinagkaloob ang biyayang ito: upang ipahayag sa mga Hentil[b] ang di-malirip na kayamanan ng Mesiyas.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “mas mababa pa sa pinakamababa sa lahat ng mga banal.” Matinding pagpapahayag ng pagpapakumbaba ang di-karaniwang anyong Griyego.
    reason: lexical_alternative
  - marker: b
    text: O “mga bansa.” Sa kontekstong ito, malamang na tumutukoy ito sa mga Hentil, samakatuwid, sa mga taong hindi Judio.
    reason: lexical_alternative
  - marker: c
    text: O “Cristo.” Ang titulong Griyego na Χριστός ay maaaring isaling “Mesiyas” o “Cristo”; dito ay isinalin ang kahulugan ng titulo.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλαχιστοτέρῳ
  choice: pinakahamak
  rationale: Ang di-karaniwang anyong Griyego ay matinding pagpapahayag ng pagpapakumbaba. Likas sa modernong Tagalog ang “pinakahamak” at naipapakita nito ang diin nang hindi ginagamit ang alanganing literal na “mas mababa pa sa pinakamababa.”
- source_word: ἁγίων
  choice: mga banal
  rationale: Sa gamit ni Pablo, tumutukoy ito sa mga taong itinalaga sa Diyos. Ang “mga banal” ay maikli, pormal na kaayon ng Griyego, at hindi nagdaragdag ng paliwanag sa mismong talata.
- source_word: χάρις
  choice: biyaya
  rationale: Saklaw ng “biyaya” ang mapagpalang pagkakaloob ng Diyos at, sa konteksto, ang atas na ibinigay kay Pablo.
- source_word: ἔθνεσιν
  choice: mga Hentil
  rationale: Sa kontekstong ito, ang tinutukoy ay ang mga taong hindi Judio, hindi mga bansang pampolitika. Pinananatili ng “mga Hentil” ang mahalagang pagkakaibang Judio at di-Judio.
- source_word: εὐαγγελίσασθαι
  choice: ipahayag ... ang mabuting balita
  rationale: Malinaw nitong naihahatid ang diwa ng paghahayag ng mabuting balita. Idinagdag ang “tungkol sa” bago ang nilalaman upang maging natural ang pangungusap sa Tagalog nang hindi binabago ang mensahe.
- source_word: ἀνεξιχνίαστον
  choice: di-malirip
  rationale: Ipinahihiwatig nito ang isang bagay na hindi ganap na masusukat, matutunton, o mauunawaan, habang nananatiling marangal at madaling maintindihan.
- source_word: πλοῦτος
  choice: kayamanan
  rationale: Pinananatili nito ang metapora ni Pablo para sa di-masukat na kasaganaan ng matatagpuan sa Mesiyas.
- source_word: Χριστοῦ
  choice: Mesiyas
  rationale: Isinasalin ang Χριστός bilang titulo, “Mesiyas,” sa halip na ituring lamang itong pangalan; pinananatili nito ang kahulugang ‘ang Pinahiran.’
theological_decisions:
- issue: Pagpapakahulugan sa Χριστοῦ bilang titulo o pangalang nakasanayan
  choice: Mesiyas
  alternative: Cristo
  rationale: Maaaring gamitin sa tradisyong Tagalog ang “Cristo,” ngunit dito ay malinaw na naipahahayag ng “Mesiyas” ang kahulugan ng titulong Χριστός nang hindi nagdaragdag ng denominasyonal na paliwanag.
- issue: Saklaw ng ἔθνεσιν
  choice: mga Hentil
  alternative: mga bansa
  rationale: Ang konteksto ng liham ay ang pagsasama ng mga di-Judio sa bayan ng Diyos; kaya mas tiyak dito ang “mga Hentil,” habang kinikilala sa talababa ang literal na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit tuwiran. Ginamit ang “ipahayag ... ang mabuting balita” upang maging malinaw ang puwersa ng εὐαγγελίσασθαι, at pinanatili ang retorikal na pagpapakumbaba at ang metapora ng kayamanan.
