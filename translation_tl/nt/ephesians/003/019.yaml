  source_fidelity: 'Tapat ang salin sa Griyego: pinananatili nito ang ugnay na “at,” ang paradoksong “malaman ... na nakahihigit sa kaalaman,” ang hindi nilulutas na genitibo sa “pag-ibig ng Mesiyas,” at ang direksiyonal ngunit siksik na εἰς sa “hanggang sa.”'
