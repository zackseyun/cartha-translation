id: EPH.3.19
reference: Ephesians 3:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: γνῶναί τε τὴν ὑπερβάλλουσαν τῆς γνώσεως ἀγάπην τοῦ Χριστοῦ, ἵνα πληρωθῆτε εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/019.yaml
  text: and to know the love of Messiah that surpasses knowledge[b][a], so that you may be filled unto all the fullness of God.
translation:
  language: tl
  text: at malaman ang pag-ibig ng Mesiyas[a] na nakahihigit sa kaalaman, upang mapuspos kayo hanggang sa buong kapuspusan ng Diyos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ayon sa tradisyon, “pag-ibig ni Cristo.”
    reason: alternative_reading
  - marker: b
    text: Maaari ring isalin na “mapuspos kayo ng buong kapuspusan ng Diyos.” Sa Griyego, literal na “mapuspos tungo sa buong kapuspusan ng Diyos,” isang siksik na pahayag na maaaring magdiin sa pagsulong tungo sa ganap na sukat ng kapuspusan ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνῶναί
  choice: malaman
  rationale: Tuwirang isinasalin ang infinitibong γινώσκω at nananatiling bukas sa kapwa pansariling karanasan at pang-unawang intelektuwal.
- source_word: τε
  choice: at
  rationale: Magaan nitong iniuugnay ang kahilingang ito sa mga naunang kahilingan sa panalangin.
- source_word: ὑπερβάλλουσαν τῆς γνώσεως
  choice: na nakahihigit sa kaalaman
  rationale: Pinananatili ang paradokso ng pag-alam sa pag-ibig na lampas sa kaalaman, habang gumagamit ng likas at marangal na Filipino.
- source_word: ἀγάπην τοῦ Χριστοῦ
  choice: pag-ibig ng Mesiyas
  rationale: Ang Χριστός ay isinaling bilang titulong “Mesiyas.” Ang kayariang “ng Mesiyas” ay hindi tahasang nagpapasiya sa lahat ng maaaring puwersa ng genitibo.
- source_word: ἵνα πληρωθῆτε
  choice: upang mapuspos kayo
  rationale: Ipinapakita ng “upang” ang layunin o bunga, at pinananatili ng “mapuspos” ang pasibong anyo ng pandiwa.
- source_word: εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦ
  choice: hanggang sa buong kapuspusan ng Diyos
  rationale: Ang “hanggang sa” ay nagpapanatili sa direksiyon o layuning ipinahihiwatig ng εἰς; hindi nito pinapantay ang parirala sa simpleng “mapuspos ng.”
theological_decisions:
- issue: Pagkasalin sa Χριστοῦ
  choice: Mesiyas
  alternative: Cristo
  rationale: Gumaganap dito ang Χριστός bilang titulo; ipinakikita ng “Mesiyas” ang kahulugan nito sa halip na transliterasyon lamang.
- issue: Kahulugan ng “pag-ibig ng Mesiyas”
  choice: Pinanatili ang pormal na kayariang “pag-ibig ng Mesiyas.”
  alternative: pag-ibig ng Mesiyas sa atin; pag-ibig natin sa Mesiyas
  rationale: Malakas na ipinahihiwatig ng konteksto ang pag-ibig ng Mesiyas sa mga mananampalataya, ngunit hindi tahasang nilulutas ng salin ang puwersa ng genitibo.
- issue: Kahulugan ng εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦ
  choice: mapuspos kayo hanggang sa buong kapuspusan ng Diyos
  alternative: mapuspos kayo ng buong kapuspusan ng Diyos
  rationale: Pinananatili ng pangunahing salin ang siksik at patungong-layuning pahayag ni Pablo nang hindi nagdaragdag ng metapisikal na paliwanag.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang paradokso ng “malaman” at “kaalaman,” pati ang siksik na direksiyonal na diwa ng εἰς. Ang “kapuspusan” ay pinili bilang kinikilalang teolohikal ngunit nauunawaang katumbas ng πλήρωμα.
