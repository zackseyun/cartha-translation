  text: that he may grant you[a], according to the riches of his glory, to be strengthened with power through his Spirit in the inner man,
translation:
  language: tl
  text: upang, ayon sa kayamanan ng kanyang kaluwalhatian, ipagkaloob niya sa inyo na kayo’y palakasin nang may kapangyarihan sa pamamagitan ng kanyang Espiritu sa inyong panloob na pagkatao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa panloob na tao”; tumutukoy ito sa panloob na sarili o pagkatao.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δῷ ὑμῖν
  choice: upang ipagkaloob niya sa inyo
  rationale: Ipinakikita ng “upang” ang layunin o nilalaman ng panalangin, at ang “ipagkaloob” ay likas sa konteksto ng isang kahilingang nakatuon sa Diyos.
- source_word: κατὰ τὸ πλοῦτος τῆς δόξης αὐτοῦ
  choice: ayon sa kayamanan ng kanyang kaluwalhatian
  rationale: Pinananatili ng “ayon sa” ang diwa ng pamantayan o sukat ng κατά, samantalang ang “kayamanan” at “kaluwalhatian” ay tuwirang kumakatawan sa πλοῦτος at δόξα.
- source_word: δυνάμει κραταιωθῆναι
  choice: na palakasin kayo nang may kapangyarihan
  rationale: Pinananatili ng “palakasin” ang pasibong diwa ng infinitive at ng “nang may kapangyarihan” ang instrumental na gamit ng dative δυνάμει.
- source_word: διὰ τοῦ πνεύματος αὐτοῦ
  choice: sa pamamagitan ng kanyang Espiritu
  rationale: Malinaw na ipinahahayag ng parirala ang paraan o ahensiya ng pagkilos. Ang malaking titik sa “Espiritu” ay umaayon sa malamang na pagtukoy sa Espiritu ng Diyos sa kontekstong Paulino.
- source_word: εἰς τὸν ἔσω ἄνθρωπον
  choice: sa inyong panloob na pagkatao
  rationale: Natural itong Tagalog para sa panloob na sarili na tinutukoy ng kinatawang isahang ἄνθρωπος. Ang “sa” ay sapat na bukás upang ipahiwatig ang saklaw o tunguhin ng pagpapalakas nang hindi pilit na isinasalin ang εἰς bilang “papasok sa.”
theological_decisions:
- issue: Ang tinutukoy ng πνεῦμα
  choice: ang Espiritu ng Diyos (“kanyang Espiritu”)
  alternative: ang espiritu bilang di-personal na impluwensiya ng Diyos
  rationale: Ang konteksto ng banal na pagkilos sa mga mananampalataya at ang karaniwang gamit ni Pablo ay malakas na sumusuporta sa pagtukoy sa Espiritu ng Diyos; hindi na dinagdagan ang teksto ng salitang “Banal.”
- issue: Pagpapakahulugan sa ἔσω ἄνθρωπον
  choice: panloob na pagkatao
  alternative: panloob na tao
  rationale: Ang ἄνθρωπος ay isahan at kinatawan, hindi tumutukoy lamang sa lalaki. Inihahatid ng “panloob na pagkatao” ang panloob na sarili sa natural at inklusibong Tagalog, habang itinatala sa talababa ang mas literal na anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong nakapailalim sa naunang panalangin sa konteksto at iniwasan ang teknikal o denominasyonal na pananalita.
