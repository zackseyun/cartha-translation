  text: according to the eternal purpose that he accomplished in Messiah Jesus our Lord[c][b][a],
translation:
  language: tl
  text: ayon sa walang-hanggang layunin[a] na isinakatuparan niya kay Mesiyas Jesus na ating Panginoon,[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal sa Griyego ang “layunin ng mga kapanahunan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa pamamagitan ni Mesiyas Jesus.” Ang pang-ukol sa Griyego ay “sa,” ngunit maaari rin itong maunawaan dito bilang pagpapahayag ng kasangkapan o paraan.
    reason: alternative_reading
  - marker: c
    text: 'Griyego: “Cristo.” Isinalin itong “Mesiyas” dito sapagkat ginagamit ang salita bilang titulo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ
  choice: ayon sa
  rationale: Ipinahahayag ng κατά kasama ng akusatibong πρόθεσιν ang pagsang-ayon o pagkakatugma; likas at malinaw sa Filipino ang “ayon sa.”
- source_word: πρόθεσιν
  choice: layunin
  rationale: Tumutukoy ang πρόθεσις sa sinadyang hangarin o panukala ng Diyos. Pinananatili ng “layunin” ang diin sa intensiyon nang hindi labis na nagpapaliwanag.
- source_word: τῶν αἰώνων
  choice: walang-hanggan
  rationale: Ang parirala ay literal na “ng mga kapanahunan,” ngunit sa konteksto ay nagpapahiwatig ng layuning sumasaklaw sa lahat ng panahon. Mas natural sa modernong Filipino ang “walang-hanggang,” habang inilalagay sa talababa ang literal na anyo.
- source_word: ἣν
  choice: na
  rationale: Ang panghalip na pautos ay tumutukoy pabalik sa “layunin”; natural sa Filipino ang pang-ugnay na “na.”
- source_word: ἐποίησεν
  choice: isinakatuparan
  rationale: Bagaman karaniwang nangangahulugang “ginawa” ang ποιέω, kapag layunin ang layon nito, ipinahihiwatig dito ang pagsasagawa o pagtupad. Tumpak at likas ang “isinakatuparan.”
- source_word: ἐν
  choice: kay
  rationale: Pinananatili nito ang pangunahing diwang lokatibo o relasyonal ng ἐν sa pariralang tumutukoy kay Jesus, sa halip na agad itong gawing instrumental. Nasa talababa ang posibleng “sa pamamagitan ni.”
- source_word: Χριστῷ
  choice: Mesiyas
  rationale: Ginagamit dito ang Χριστός bilang titulo. Ipinahahayag ng “Mesiyas” ang kahulugan at kontekstong Judio ng titulo, sa halip na transliterasyon lamang.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Karaniwang anyong Filipino ng pangalang pantangi.
- source_word: κυρίῳ
  choice: Panginoon
  rationale: Ang “Panginoon” ang malinaw at nakaugaliang katumbas ng κύριος bilang titulo.
- source_word: ἡμῶν
  choice: ating
  rationale: Ipinahahayag ng inklusibong “ating” ang “aming/atin” ng teksto sa paraang likas sa pagtukoy ng manunulat at mga mambabasa sa iisang Panginoon.
theological_decisions:
- issue: Kahulugan ng τῶν αἰώνων sa πρόθεσιν τῶν αἰώνων
  choice: walang-hanggang layunin
  alternative: layunin ng mga kapanahunan
  rationale: Ang literal na idyoma ay “layunin ng mga kapanahunan,” ngunit ang “walang-hanggang layunin” ay mas malinaw at natural na nagpapahayag ng temporal na lawak nito sa Filipino. Pinananatili sa talababa ang literal na anyo upang hindi maitago ang pahayag ng Griyego.
- issue: Diwa ng ἐν τῷ Χριστῷ Ἰησοῦ
  choice: kay Mesiyas Jesus
  alternative: sa pamamagitan ni Mesiyas Jesus
  rationale: Maaaring magkaroon ng instrumental na diwa ang ἐν, ngunit hindi iyon kailangang ipasiya sa pangunahing teksto. Ang “kay” ay nagpapanatili ng relasyonal na pahayag, at ang instrumental na pagbasa ay ibinibigay sa talababa.
- issue: Pagkakasalin sa Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Gumaganap dito ang Χριστός bilang titulo. Mas tuwirang ipinahahayag ng “Mesiyas” ang kahulugan ng titulo at ang pinag-ugatan nitong Judio.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “isinakatuparan” upang natural na iugnay ang pandiwa sa “layunin.” Pinanatili sa mga talababa ang literal na idyomang Griyego at ang posibleng instrumental na diwa ng ἐν.
