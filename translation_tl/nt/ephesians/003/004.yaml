id: EPH.3.4
reference: Ephesians 3:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πρὸς ὃ δύνασθε ἀναγινώσκοντες νοῆσαι τὴν σύνεσίν μου ἐν τῷ μυστηρίῳ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/004.yaml
  text: By reading this[a], you are able to understand my insight into the mystery of Messiah,
translation:
  language: tl
  text: Sa pagbasa ninyo nito, mauunawaan ninyo ang aking kabatiran sa hiwaga ng Mesiyas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Cristo.” Ang titulong Griyego na Χριστός ay maaaring isaling “Mesiyas” o, ayon sa tradisyon, “Cristo.”
    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς ὃ … ἀναγινώσκοντες
  choice: Sa pagbasa ninyo nito
  rationale: Pinagsama ang pariralang tumutukoy sa naunang isinulat at ang participle upang natural na maipahayag sa Tagalog ang paraan kung paano nila mauunawaan ang sinasabi ni Pablo.
- source_word: δύνασθε … νοῆσαι
  choice: mauunawaan ninyo
  rationale: Ipinahahayag nito ang kakayahang makaunawa sa kontekstong ito nang natural at malinaw, nang hindi na kailangang gumamit ng mas mabigat na pariralang “magagawa ninyong maunawaan.”
- source_word: τὴν σύνεσίν μου
  choice: ang aking kabatiran
  rationale: Ang “kabatiran” ay nagpapahiwatig ng malalim na pagkaunawa at iniiwasan ang alanganing pag-uulit ng “mauunawaan” at “pagkaunawa.”
- source_word: ἐν τῷ μυστηρίῳ
  choice: sa hiwaga
  rationale: Pinananatili ng “sa” ang malawak na ugnayang ipinahihiwatig ng ἐν, habang ang “hiwaga” ay angkop sa ipinahayag na banal na lihim sa konteksto ng Efeso.
- source_word: τοῦ Χριστοῦ
  choice: ng Mesiyas
  rationale: Ang Χριστός ay gumaganap dito bilang titulo; ang “Mesiyas” ang tuwirang nagpapahayag ng kahulugan nito sa makabagong Tagalog.
theological_decisions:
- issue: Pagpapakahulugan sa τοῦ Χριστοῦ kaugnay ng “hiwaga”
  choice: hiwaga ng Mesiyas
  alternative: hiwaga tungkol sa Mesiyas
  rationale: Pinananatili ng “ng Mesiyas” ang siksik at posibleng malawak na ugnayan ng genitive sa Griyego, sa halip na limitahan ito sa kahulugang “tungkol sa.”
- issue: Pag-render sa titulong Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Isinasalin bilang titulo ang Χριστός upang malinaw ang kahulugan; inilalagay sa talababa ang tradisyonal na anyong “Cristo.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ninyo” dahil maramihan ang mga pandiwa sa Griyego. Ang “kabatiran” ay bahagyang pormal ngunit madaling maunawaan at angkop sa diskursong teolohikal.
