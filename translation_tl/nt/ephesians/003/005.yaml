id: EPH.3.5
reference: Ephesians 3:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὃ ἑτέραις γενεαῖς οὐκ ἐγνωρίσθη τοῖς υἱοῖς τῶν ἀνθρώπων ὡς νῦν ἀπεκαλύφθη τοῖς ἁγίοις ἀποστόλοις αὐτοῦ καὶ προφήταις ἐν πνεύματι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/005.yaml
  text: which was not made known to the sons of men in other generations as it has now been revealed to his holy apostles and prophets in the Spirit[b][a],
translation:
  language: tl
  text: na sa ibang mga salinlahi ay hindi ipinaalam sa mga anak ng tao[a], gaya ng pagkahayag nito ngayon sa kanyang mga banal na apostol at mga propeta sa Espiritu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga tao” o “sa sangkatauhan”; literal sa Griyego, “sa mga anak ng tao.”
    reason: lexical_alternative
  - marker: b
    text: O “sa pamamagitan ng Espiritu”; maaaring magpahiwatig ang pariralang Griyego ng larangan o paraan ng paghahayag.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃ
  choice: na
  rationale: Ipinagpapatuloy ng panghalip na pamanggit ang naunang binanggit na hiwaga nang hindi inuulit o idinaragdag ang antecedent.
- source_word: ἑτέραις γενεαῖς
  choice: noong ibang mga salinlahi
  rationale: Ginagamit ang parirala bilang panahong tumutukoy sa ibang mga salinlahi; pinananatili ng “ibang” ang diwa ng ἑτέραις.
- source_word: οὐκ ἐγνωρίσθη
  choice: ay hindi ipinaalam
  rationale: 'Pinananatili nito ang balintiyak at ang causative na diwa ng γνωρίζω: hindi lamang ‘hindi nalaman’ kundi ‘hindi ginawang malaman.’'
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: sa mga anak ng tao
  rationale: Malapit ito sa anyo at Semitikong himig ng Griyego, habang nililinaw sa talababa na sangkatauhan ang saklaw.
- source_word: ὡς νῦν
  choice: gaya ng ... ngayon
  rationale: Pinananatili ang paghahambing sa paraan o antas ng pagpapahayag noon at ngayon, kaya hindi ipinahihiwatig na ganap na walang dating kaalaman.
- source_word: ἀπεκαλύφθη
  choice: pagkahayag nito
  rationale: Ang ‘ihayag’ ay natural at matatag na katumbas ng terminong tumutukoy sa pagbubunyag ng dating nakatago.
- source_word: τοῖς ἁγίοις ἀποστόλοις αὐτοῦ καὶ προφήταις
  choice: sa kanyang mga banal na apostol at mga propeta
  rationale: Ang ‘banal’ ay natural na nauunawaang tumutukoy sa pinagsamang pangkat ng mga apostol at propeta; pinananatili rin ang αὐτοῦ bilang ‘kanyang.’
- source_word: ἐν πνεύματι
  choice: sa pamamagitan ng Espiritu
  rationale: Sa konteksto ng banal na paghahayag, malamang na ang Banal na Espiritu ang tinutukoy. Ang instrumental na salin ay likas sa Filipino, habang itinatala sa talababa ang posibleng diwang saklaw o kalagayan.
theological_decisions:
- issue: Tinutukoy ng πνεύματι
  choice: ang Banal na Espiritu
  alternative: espiritu ng tao o espirituwal na kalagayan
  rationale: Ang konteksto ng paghahayag sa mga apostol at propeta ay mariing pumapabor sa Banal na Espiritu, ngunit hindi nilalagyan ng salin ang tekstong Griyego ng mas tiyak na pangalan kaysa kinakailangan.
- issue: Diwa ng ὡς sa paghahambing
  choice: hindi ipinaalam noon gaya ng pagkahayag ngayon
  alternative: lubusang hindi nalaman sa mga naunang salinlahi
  rationale: 'Pinananatili ng ‘gaya ng’ ang tunay na tensiyon ng paghahambing: maaaring paraan o antas ang tinutukoy, sa halip na tahasang sabihing ganap na walang naunang pagkakilala.'
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang Semitikong pariralang “mga anak ng tao” sa teksto dahil malinaw naman sa Filipino at may paliwanag sa talababa. Ginamit ang “sa pamamagitan ng Espiritu” para sa likas na daloy, habang pinanatili sa talababa ang posibilidad ng “sa Espiritu.”
