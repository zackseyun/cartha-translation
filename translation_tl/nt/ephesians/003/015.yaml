  text: na mula sa kaniya ay pinapangalanan ang bawat angkan sa langit at sa lupa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “na mula sa kaniya ay pinapangalanan ang buong angkan sa langit at sa lupa”; o, sa mas mapagpaliwanag na salin, “na mula sa kaniya nagmumula ang lahat ng pagiging ama sa langit at sa lupa.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξ οὗ
  choice: na pinagmumulan
  rationale: Ipinahahayag ng ἐξ οὗ ang pinagmulan o bukal. Natural sa Filipino ang pariralang ito at, kasama ng pandiwang tungkol sa pangalan, naipakikita ang ugnayang pinagmulan nang hindi labis na nagpapaliwanag.
- source_word: πᾶσα
  choice: bawat
  rationale: Sa singular na πατριά, natural na ipinahahayag ng “bawat” ang distributibong diwa. Hindi nito ipinipilit ang posibleng pagbasa na iisang kabuuang sambahayan ang tinutukoy.
- source_word: πατριὰ
  choice: angkan
  rationale: Ang “angkan” ay tumutukoy sa pangkat na pinag-uugnay ng pamilya o lahi at mas malinaw na naihahayag ang saklaw ng πατριά kaysa sa karaniwang “pamilya,” nang hindi ito ginagawang abstraktong “pagkaama.”
- source_word: ἐν οὐρανοῖς
  choice: sa langit
  rationale: Bagaman plural ang Griyego, ang “sa langit” ang natural at dignidad na lokatibong pahayag sa modernong Filipino para sa makalangit na dako.
- source_word: ἐπὶ γῆς
  choice: sa lupa
  rationale: Direkta at natural na katumbas ng lokatibong parirala; pinananatili nito ang pagtutulad sa “sa langit.”
- source_word: ὀνομάζεται
  choice: ng pangalan
  rationale: Isinama sa pariralang “pinagmumulan ng pangalan” upang likas na maipahayag sa Filipino ang present passive na “pinapangalanan” at ang posibleng diwa ng pagtatamo ng pangalan. Inilalagay sa talababa ang mas pormal na alternatibo.
theological_decisions:
- issue: Kahulugan ng πᾶσα πατριὰ kaugnay ng “Ama” sa naunang talata
  choice: bawat angkan
  alternative: ang buong angkan; lahat ng pagkaama
  rationale: Pinananatili ng “bawat angkan” ang karaniwang kahulugan ng πατριά at ang distributibong posibilidad ng πᾶσα. Hindi nito agad nilulutas ang parirala bilang iisang pansansinukob na pamilya o bilang abstraktong pahayag tungkol sa lahat ng pagkaama. Ang posibleng paglalaro ng salita sa πατήρ (“Ama”) at πατριά (“angkan”) ay hindi ganap na matutumbasan sa Filipino kaya ipinapaliwanag sa talababa ang mga alternatibo.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “angkan” upang maipakita ang pangkat na pampamilya o panlahi at bahagyang mapanatili ang ugnayan nito sa “Ama” sa konteksto. Ang anyong “na pinagmumulan” ay angkop dahil bahagi ang talata ng pangungusap na nagsimula sa naunang talata.
