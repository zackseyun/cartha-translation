  text: Τούτου χάριν ἐγὼ Παῦλος ὁ δέσμιος τοῦ Χριστοῦ Ἰησοῦ ὑπὲρ ὑμῶν τῶν ἐθνῶν—
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/001.yaml
  text: For this reason I[a], Paul[c][b], the prisoner of Messiah Jesus on behalf of you Gentiles—
translation:
  language: tl
  text: Dahil dito, ako, si Pablo, na bilanggo ng Mesiyas na si Jesus[a] para sa inyo, na mga Hentil—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “Cristo Jesus.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτου χάριν
  choice: Dahil dito
  rationale: Likas na panandang pangdiskurso sa Filipino na tumutukoy sa naunang paliwanag at pinananatili ang diwang sanhi o batayan.
- source_word: ἐγὼ Παῦλος
  choice: akong si Pablo
  rationale: Pinananatili ang tahasang ἐγώ at ang retorikal na pagdidiin sa pagkakakilanlan ni Pablo sa paraang natural sa Filipino.
- source_word: ὁ δέσμιος
  choice: na bilanggo
  rationale: Tuwirang tumutukoy sa isang taong nakakulong; ang pang-angkop na “na” ay maayos na nag-uugnay nito kay Pablo.
- source_word: τοῦ Χριστοῦ Ἰησοῦ
  choice: ng Mesiyas na si Jesus
  rationale: Isinasalin ang Χριστός bilang titulong “Mesiyas” at ang Ἰησοῦ bilang pangalang Jesus. Pinananatili ng “ng” ang maluwag na ugnayang genitibo nang hindi tiyak na nilulutas kung ito ay pag-aari, paglilingkod, o pagkakabilanggo dahil sa kanya.
- source_word: ὑπὲρ ὑμῶν
  choice: para sa inyo
  rationale: Natural na Filipino para sa diwang kapakinabangan o kapakanan na ipinahihiwatig ng ὑπέρ sa kontekstong ito.
- source_word: τῶν ἐθνῶν
  choice: na mga Hentil
  rationale: Dito ang ἔθνη ay pantukoy sa mga hindi Judio at nasa apposition sa “inyo,” kaya ang “inyo na mga Hentil” ay malinaw at angkop sa konteksto.
theological_decisions:
- issue: Kung isasalin ang Χριστός bilang titulo o gagamitin ang tradisyonal na anyong parang pangalan
  choice: Mesiyas na si Jesus
  alternative: Cristo Jesus
  rationale: Gumaganap dito ang Χριστός bilang titulo. Isinasalin ito bilang “Mesiyas,” habang inilalagay sa talababa ang tradisyonal na anyo upang mapanatili ang pamilyar na alternatibo.
- issue: Ugnayang ipinahihiwatig ng genitibong τοῦ Χριστοῦ Ἰησοῦ
  choice: bilanggo ng Mesiyas na si Jesus
  alternative: bilanggo dahil sa Mesiyas na si Jesus
  rationale: Hindi tahasang tinutukoy ng anyong genitibo kung si Jesus ang may-ari o pinaglilingkuran ni Pablo, o kung nakakulong siya dahil sa kanyang paglilingkod. Ang “ng” ay nagpapanatili ng ganitong lawak; ang alternatibo ay mas tiyak at kaya hindi ginamit sa pangunahing teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang gitling sa hulihan sapagkat hindi pa natatapos ang pangungusap sa talatang ito at ipinagpapatuloy ang kaisipan sa mga susunod na talata.
