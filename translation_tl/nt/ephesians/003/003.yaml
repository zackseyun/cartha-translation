id: EPH.3.3
reference: Ephesians 3:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀κατὰ ἀποκάλυψιν ⸀ἐγνωρίσθη μοι τὸ μυστήριον, καθὼς προέγραψα ἐν ὀλίγῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/003.yaml
  text: that the mystery was made known to me by revelation[a], as I wrote before briefly[c][b],
translation:
  language: tl
  text: na sa pamamagitan ng paghahayag[a] ay ipinaalam sa akin ang hiwaga[b], gaya ng isinulat ko na nang maikli[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ayon sa paghahayag” o “sa paghahayag.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “inihayag sa akin”; sa Griyego, “ipinaalam sa akin.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “sa maikling paraan” o “sa ilang salita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ ἀποκάλυψιν
  choice: sa pamamagitan ng paghahayag
  rationale: Likas sa modernong Filipino at ipinahihiwatig na ang paghahayag ang paraan ng pagpapaalam, habang hindi tahasang pinapangalanan ang gumawa nito.
- source_word: ἐγνωρίσθη μοι
  choice: ipinaalam sa akin
  rationale: Pinananatili nito ang pasibong diwa ng Griyego at hindi tahasang tinutukoy ang ipinahihiwatig na gumawa. Iniiwasan din nito ang pag-uulit ng salitang-ugat na 'pahayag.'
- source_word: τὸ μυστήριον
  choice: ang hiwaga
  rationale: Ang 'hiwaga' ay angkop sa kontekstong Paulino para sa layunin ng Diyos na dating lingid at ngayo'y ipinabatid; hindi nito inuunahan ang paliwanag sa mga kasunod na talata.
- source_word: καθὼς
  choice: gaya ng
  rationale: Payak at natural na naghahambing sa pahayag na ito at sa naunang isinulat ni Pablo.
- source_word: προέγραψα
  choice: isinulat ko na
  rationale: Sa konteksto, tumutukoy ito sa naunang bahagi ng sulat. Ang 'na' ay likas na nagpapahayag ng pagiging nauna nang naisulat.
- source_word: ἐν ὀλίγῳ
  choice: nang maikli
  rationale: Natural na Filipino para sa pagsulat nang maikli o sa ilang salita, nang hindi dinaragdagan ang nilalaman.
theological_decisions:
- issue: Kahulugan ng μυστήριον sa gamit ni Pablo
  choice: Panatilihin ang 'hiwaga' bilang layuning dating lingid ngunit ipinabatid, nang hindi inilalahad dito ang nilalaman nito.
  alternative: lihim; nakatagong plano ng Diyos
  rationale: Pinapangalanan lamang ng talata ang konsepto; sa kasunod na konteksto pa ito higit na ipinaliliwanag. Ang pagpaparaprasang 'nakagong plano ng Diyos' ay magdaragdag ng paliwanag na wala mismo sa talata.
- issue: Ipinahihiwatig na tagagawa ng ἐγνωρίσθη
  choice: Gumamit ng pasibong 'ipinaalam sa akin' nang hindi pinapangalanan ang gumawa.
  alternative: ipinaalam sa akin ng Diyos
  rationale: Bagaman malinaw sa konteksto na banal ang pinagmulan ng paghahayag, walang tahasang tagagawa sa sugnay na Griyego; pinananatili ng salin ang gayong pagpipigil.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Pinanatili ang anyong sugnay at kuwit sa hulihan dahil bahagi ang talata ng mas mahabang pangungusap. Lahat ng marker [a], [b], at [c] ay nasa pangunahing teksto.
