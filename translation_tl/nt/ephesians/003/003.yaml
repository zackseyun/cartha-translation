  source_fidelity: 'Tapat ang salin sa mga pangunahing sangkap ng Griyego: ang κατὰ ἀποκάλυψιν ay naipahayag bilang paraan ng pagpapaalam, ang ἐγνωρίσθη μοι ay nananatiling hindi tahasang pinapangalanan ang tagagawa, at ang τὸ μυστήριον ay wasto at tradisyonal na naisalin bilang “ang hiwaga.” Ang “gaya ng isinulat ko na nang maikli” ay sapat na naghahatid ng καθὼς προέγραψα ἐν ὀλίγῳ.'
