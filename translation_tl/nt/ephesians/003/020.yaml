  text: Τῷ δὲ δυναμένῳ ὑπὲρ πάντα ποιῆσαι ὑπερεκπερισσοῦ ὧν αἰτούμεθα ἢ νοοῦμεν κατὰ τὴν δύναμιν τὴν ἐνεργουμένην ἐν ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/020.yaml
  text: To the one who is able to do far beyond all that we ask or think[a], according to the power at work in us[b],
translation:
  language: tl
  text: At sa kanya na may kakayahang gumawa nang higit na higit kaysa sa lahat ng hinihingi o naiisip natin[a], ayon sa kapangyarihang kumikilos sa atin[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “hinihingi o naguguniguni natin.” Matindi ang diwa ng salitang Griyego para sa “higit na higit”: lampas sa sukat ng anumang hinihingi o naiisip.'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “kumikilos sa gitna natin.” Maaaring idiin ng pariralang Griyego ang pagkilos sa loob natin o sa gitna ng pamayanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῷ ... δυναμένῳ
  choice: sa kanya na may kakayahang
  rationale: Pinananatili nito ang anyong tumutukoy sa tatanggap ng papuri nang hindi idinaragdag ang pangngalang “Diyos,” na hindi tahasang inuulit sa talata.
- source_word: δὲ
  choice: At
  rationale: Dito, ang δέ ay banayad na nag-uugnay at naghahatid sa pangwakas na papuri; ang “At” ay natural sa pagpapatuloy ng pangungusap at hindi nagpapahiwatig ng matinding pagsalungat.
- source_word: ὑπὲρ πάντα ... ὑπερεκπερισσοῦ
  choice: nang higit na higit pa sa lahat
  rationale: Ipinahahayag ng inuulit na “higit” ang matinding diwa ng paglampas sa sukat, habang nananatiling malinaw at natural sa modernong Filipino.
- source_word: ποιῆσαι
  choice: gumawa
  rationale: Malawak at payak ang kahulugan ng ποιέω; ang “gumawa” ay hindi nagdaragdag ng mas tiyak na diwang gaya ng “isakatuparan.”
- source_word: ὧν αἰτούμεθα ἢ νοοῦμεν
  choice: lahat ng hinihingi o naiisip natin
  rationale: Ang “hinihingi” ay angkop sa αἰτούμεθα, at ang “naiisip” ay likas na nagpapahayag ng anumang nabubuo o nauunawaan ng isip sa kontekstong ito.
- source_word: κατὰ τὴν δύναμιν
  choice: ayon sa kapangyarihan
  rationale: Ipinapakita ng “ayon sa” ang pamantayan o sukat ng paggawa, sa halip na ituring lamang ang kapangyarihan bilang kasangkapan.
- source_word: τὴν ἐνεργουμένην
  choice: kumikilos
  rationale: Ipinahahayag nito ang kapangyarihang kasalukuyang aktibo at mabisa, sa natural na wikang Filipino.
- source_word: ἐν ἡμῖν
  choice: sa atin
  rationale: Pinananatili nito ang malawak na diwa ng kapangyarihang gumagawa sa loob ng sama-samang pamayanan ng mga mananampalataya; posible rin ang diin sa pagkilos sa gitna nila.
theological_decisions:
- issue: Ang tinutukoy na tatanggap ng papuri
  choice: “sa kanya na may kakayahang” nang hindi tahasang idinaragdag ang “Diyos”
  alternative: “sa Diyos na may kakayahang”
  rationale: Malinaw sa mas malawak na konteksto na Diyos ang tinutukoy, ngunit walang tahasang pangngalang “Diyos” sa talatang ito. Pinananatili ng salin ang pagkakaugnay nito sa doksolohiyang nagpapatuloy sa susunod na talata.
- issue: Pagkilos ng kapangyarihan sa mga mananampalataya
  choice: “kapangyarihang kumikilos sa atin”
  alternative: “kapangyarihang kumikilos sa gitna natin”
  rationale: Pinananatili nito ang pahayag na ang kapangyarihan ay aktibong gumagawa sa mga mananampalataya nang hindi tinutukoy ang isang partikular na paliwanag tungkol sa paraan ng pagkilos nito.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang anyo ng isang hindi pa tapos na doksolohiya sa pamamagitan ng kuwit sa hulihan, sapagkat nagpapatuloy ang pangungusap sa Efeso 3:21.
