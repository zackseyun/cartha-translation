  text: καὶ φωτίσαι ⸀πάντας τίς ἡ οἰκονομία τοῦ μυστηρίου τοῦ ἀποκεκρυμμένου ἀπὸ τῶν αἰώνων ἐν τῷ θεῷ τῷ τὰ πάντα ⸀κτίσαντι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/009.yaml
  text: and to bring to light for everyone what is the administration of the mystery hidden from the ages in God[a], who created all things[b],
translation:
  language: tl
  text: at upang liwanagan ang lahat tungkol sa kung ano ang pangangasiwa[a] ng hiwagang mula pa sa mga kapanahunan[b] ay nakatago sa Diyos, na lumikha ng lahat ng bagay,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pamamahala,” “pagkakasaayos,” o “plano.”
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring “itinago sa loob ng napakahabang panahon”; mas malayang salin: “itinago mula sa walang hanggan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: φωτίσαι πάντας
  choice: bigyang-liwanag sa lahat
  rationale: Pinananatili nito ang talinghaga ng pagbibigay-liwanag at ang saklaw na tumutukoy sa lahat, habang iniuugnay ang liwanag sa kasunod na tanong tungkol sa hiwaga.
- source_word: τίς ἡ οἰκονομία
  choice: kung ano ang pamamahala
  rationale: Ang “pamamahala” ay nagpapanatili sa diwa ng pagsasaayos o pangangasiwa nang hindi ito awtomatikong ginagawang “plano” o nilalagyan ng isang teknikal na sistemang teolohikal.
- source_word: μυστηρίου
  choice: hiwaga
  rationale: Ang “hiwaga” ay natural na katumbas ng terminong Paulino para sa layunin ng Diyos na dating nakakubli ngunit inihahayag na.
- source_word: τοῦ ἀποκεκρυμμένου
  choice: itinago
  rationale: Ipinahahayag nito ang naganap na pagtatago at ang patuloy na kalagayan ng pagiging nakakubli sa tinutukoy na panahon.
- source_word: ἀπὸ τῶν αἰώνων
  choice: mula pa sa mga kapanahunan
  rationale: Malapit ito sa literal na “mula sa mga kapanahunan” at hindi pinalalabis bilang tahasang “mula sa walang hanggan.”
- source_word: ἐν τῷ θεῷ
  choice: sa Diyos
  rationale: 'Pinananatili nito ang lokatibong diwa ng ἐν: ang hiwaga ay nakatago sa Diyos, hindi lamang nasa piling niya.'
- source_word: τῷ τὰ πάντα κτίσαντι
  choice: ang Diyos na lumikha ng lahat ng bagay
  rationale: Likas na inilalarawan ng sugnay ang Diyos bilang siyang lumikha ng kabuuan ng lahat ng bagay.
theological_decisions:
- issue: Kahulugan ng οἰκονομία kaugnay ng hiwaga
  choice: pamamahala
  alternative: pangangasiwa; pagkakasaayos; plano
  rationale: Pinananatili ng “pamamahala” ang konkretong diwa ng paglalapat o pagsasakatuparan sa hiwaga, nang hindi ipinapasok ang isang kalaunang teknikal na sistemang teolohikal.
- issue: Pamanahong diwa ng ἀπὸ τῶν αἰώνων
  choice: mula pa sa mga kapanahunan
  alternative: sa loob ng napakahabang panahon; mula sa walang hanggan
  rationale: Tahasang tumutukoy ang Griyego sa “mga kapanahunan,” hindi tuwirang sa abstraktong kawalang-hanggan; kaya pinananatili ang kaibhan at posibleng tensiyong ito.
- issue: Ugnayan ng ἐν τῷ θεῷ sa itinagong hiwaga
  choice: itinago sa Diyos
  alternative: iningatan ng Diyos bilang lihim
  rationale: Ang mas tuwirang pagbasa ay nagpapanatili sa pambalarilang lokasyon ng hiwaga “sa Diyos” at hindi tahimik na binabago ito tungo sa malinaw na ahensiya.
translation_notes:
  register: Makabago at marangal na Filipino; pinanatili ang talinghaga ng liwanag, ang terminong Paulino na “hiwaga,” at ang literal na pagtukoy sa “mga kapanahunan.” Ang gitling bago ang paglalarawan sa Diyos ay tumutulong sa linaw ng mahabang pangungusap.
