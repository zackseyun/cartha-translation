id: EPH.3.13
reference: Ephesians 3:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: διὸ αἰτοῦμαι μὴ ⸀ἐγκακεῖν ἐν ταῖς θλίψεσίν μου ὑπὲρ ὑμῶν, ἥτις ἐστὶν δόξα ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/013.yaml
  text: Therefore I ask you not to lose heart because of my afflictions for your sake[b][a], which are your glory.
translation:
  language: tl
  text: Kaya hinihiling ko sa inyo na huwag kayong panghinaan ng loob dahil sa mga paghihirap ko alang-alang sa inyo[a]; ang mga ito ang inyong kaluwalhatian.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa harap ng mga paghihirap ko alang-alang sa inyo.” Maaari ring ipahiwatig ng Griyego ang kalagayan o okasyong pinagmumulan ng panghihina ng loob.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, ang mga paghihirap ni Pablo alang-alang sa kanila ay nauuwi sa kanilang karangalan sa layunin ng Diyos na magligtas.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Kaya
  rationale: Malinaw at likas na ipinapakita ang kongklusyon mula sa naunang paliwanag ni Pablo.
- source_word: αἰτοῦμαι
  choice: hinihiling ko sa inyo
  rationale: Ipinahihiwatig ng kasunod na pawatas at ng konteksto na ang mga mambabasa ang pinakikiusapan; natural sa Tagalog na sabihin nang tahasan ang pinag-uukulan.
- source_word: μὴ ἐγκακεῖν
  choice: huwag kayong panghinaan ng loob
  rationale: Tumpak na ipinapahayag ang pagkawala ng tapang o pagkasira ng loob, at karaniwang nauunawaan sa modernong Tagalog.
- source_word: ἐν ταῖς θλίψεσίν μου
  choice: dahil sa mga paghihirap ko
  rationale: Sa konteksto ng panghihina ng loob, ang ἐν ay maaaring magpahiwatig ng dahilan o okasyon. Pinananatili ng “mga paghihirap” ang bigat ng θλῖψις nang hindi nagiging lipas o teknikal ang wika.
- source_word: ὑπὲρ ὑμῶν
  choice: alang-alang sa inyo
  rationale: Ipinakikita ang kapakinabangan ng mga mambabasa at ang pagdurusa ni Pablo para sa kanilang ikabubuti.
- source_word: ἥτις ἐστὶν δόξα ὑμῶν
  choice: ang mga ito ang inyong kaluwalhatian
  rationale: Iniuugnay ang pangungusap sa mga paghihirap ni Pablo bilang isang kabuuang kaisipan at pinananatili ang matimbang na salitang “kaluwalhatian.”
theological_decisions:
- issue: Tinutukoy ng ἥτις ἐστὶν δόξα ὑμῶν
  choice: Ang mga paghihirap ni Pablo, bilang isang kabuuang karanasan alang-alang sa kanila, ang kanilang kaluwalhatian.
  alternative: Maaaring mas malawak na tumukoy ito sa ministeryo at pagdurusa ni Pablo alang-alang sa kanila.
  rationale: Ang “mga paghihirap ko” ang pinakamalapit na tinutukoy, ngunit hindi nililimitahan ng salin ang kabuluhan nito sa isang makitid na paliwanag.
- issue: Ipinahihiwatig na pinag-uukulan ng αἰτοῦμαι
  choice: Hinihiling ni Pablo sa mga mambabasa na huwag silang panghinaan ng loob.
  alternative: Maaaring unawain na humihiling si Pablo sa Diyos na siya mismo ay huwag panghinaan ng loob.
  rationale: Mas natural sa daloy at sa karaniwang pag-unawa sa sintaks na ang mga mambabasa ang pinakikiusapan, bagaman hindi tahasang nakasaad sa Griyego ang pinag-uukulan at simuno ng pawatas.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “panghinaan ng loob,” “paghihirap,” at “alang-alang” bilang natural at matimbang na mga katumbas; pinanatili ang “kaluwalhatian” upang huwag pahinain ang teolohikal at retorikal na lakas ng δόξα.
