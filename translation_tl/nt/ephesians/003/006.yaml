  text: εἶναι τὰ ἔθνη συγκληρονόμα καὶ σύσσωμα καὶ συμμέτοχα τῆς ἐπαγγελίας ⸂ἐν Χριστῷ Ἰησοῦ⸃ διὰ τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/006.yaml
  text: that the Gentiles are fellow heirs[a], fellow members of the body, and fellow partakers of the promise in Messiah Jesus through the gospel[c][b],
translation:
  language: tl
  text: na ang mga Hentil[a] ay kapwa tagapagmana, kapwa kasapi ng iisang katawan[b], at kapwa kabahagi ng pangako sa pakikipag-isa kay Mesiyas[c] na si Jesus, sa pamamagitan ng mabuting balita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga bansa.” Dito, tumutukoy ang salita sa mga taong hindi Judio na isinama sa pangako ng Diyos kasama ng Israel.
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, isang tambalang salita ang ginamit na nagpapahiwatig na kabilang sila sa iisa ring katawan.
    reason: source_clarification
  - marker: c
    text: 'Nakaugaliang salin: “Cristo.” Ang salitang Griyego na Χριστός ay isinalin dito bilang “Mesiyas” upang mapanatili ang puwersa nito bilang titulo.'
    reason: alternative_rendering
lexical_decisions:
- source_word: τὰ ἔθνη
  choice: ang mga Hentil
  rationale: Sa konteksto, tumutukoy ito sa mga taong hindi Judio na isinama sa pangako ng Diyos, hindi lamang sa mga bansang pampolitika.
- source_word: συγκληρονόμα
  choice: kapwa tagapagmana
  rationale: Pinananatili ng “kapwa” ang diwa ng σύν-, na nagsasaad ng magkasamang pagtanggap ng mana.
- source_word: σύσσωμα
  choice: kapwa kasapi ng iisang katawan
  rationale: Ipinahahayag nito ang bihirang tambalang salitang tumutukoy sa pagkabilang sa iisang katawan, habang pinananatili ang metapora ni Pablo.
- source_word: συμμέτοχα
  choice: kapwa kabahagi
  rationale: Ipinakikita ng parirala ang magkakasamang pakikibahagi at pinananatili ang paralelismo ng tatlong tambalang salitang may σύν-.
- source_word: τῆς ἐπαγγελίας
  choice: sa pangako
  rationale: 'Ang henitibo ay nakaugnay sa συμμέτοχα: kasama ang mga Hentil sa pakikibahagi sa pangako. Pinananatili rin ang isahang anyo ng Griyego.'
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: sa Mesiyas na si Jesus
  rationale: Ginagawang malinaw sa natural na Tagalog ang titular na puwersa ng Χριστός sa konteksto ng katuparan ng pangako ng Diyos.
- source_word: διὰ τοῦ εὐαγγελίου
  choice: sa pamamagitan ng mabuting balita
  rationale: Ang διά na may henitibo ay nagsasaad ng paraan o kasangkapan; malinaw at likas sa Tagalog ang pariralang ito.
- source_word: εἶναι
  choice: na ... ay
  rationale: Dahil nakasalalay ang pawatas sa naunang pahayag tungkol sa hiwaga, ang sugnay na may “na ... ay” ang natural na paraan upang ihayag ang nilalaman nito sa Tagalog.
theological_decisions:
- issue: Kung gagamitin ang Χριστός bilang titulo o anyong tila bahagi ng pangalan
  choice: sa Mesiyas na si Jesus
  alternative: kay Cristo Jesus
  rationale: Sa talatang ito, aktibo ang kahulugan ng titulo sa paliwanag ni Pablo tungkol sa katuparan ng pangako at pagsasama sa mga Hentil. Gayunman, itinatala sa talababa ang nakaugaliang anyo.
- issue: Ang tinutukoy ng ἔθνη
  choice: mga Hentil
  alternative: mga bansa
  rationale: Ang agarang konteksto ay ang pantay na pagsasama ng mga hindi Judio sa bayan at pangako ng Diyos; mas tiyak dito ang “mga Hentil.”
- issue: Lakas ng metapora sa σύσσωμα
  choice: kapwa kasapi ng iisang katawan
  alternative: kabahagi sa katawan
  rationale: Pinananatili ng napiling anyo ang ideya ng aktuwal na pagkabilang sa iisang katawan nang hindi ipinapaliwanag kung ano mismo ang katawan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang ritmikong tatluhan sa pag-uulit ng “kapwa,” gayundin ang metapora ng iisang katawan. Ang talata ay sadyang nagsisimula sa “na” sapagkat ipinagpapatuloy nito ang pangungusap at paliwanag tungkol sa hiwaga mula sa naunang talata.
