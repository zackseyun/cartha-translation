  rationale: Pinanatili ang tripleng paralelismo ng "kapwa" at ang metapora ng katawan. Idinagdag ang "sa pakikipag-isa kay" upang maipahayag nang walang maling pagbasa ang ἐν Χριστῷ Ἰησοῦ bilang kalagayan o saklaw ng pakikibahagi sa pangako, hindi bilang tatanggap ng pangako. Inayos din ang panandang talababa c at ang pananalita ng talababa b.
