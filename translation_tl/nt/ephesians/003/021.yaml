id: EPH.3.21
reference: Ephesians 3:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: αὐτῷ ἡ δόξα ἐν τῇ ἐκκλησίᾳ ⸀καὶ ἐν Χριστῷ Ἰησοῦ εἰς πάσας τὰς γενεὰς τοῦ αἰῶνος τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/021.yaml
  text: To him be glory in the church and in Messiah Jesus through all generations forever and ever[a]. Amen.
translation:
  language: tl
  text: Sa kanya ang kaluwalhatian sa iglesya at sa Mesiyas na si Jesus, sa lahat ng salinlahi, magpakailanman.[a] Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Cristo Jesus.” Isinalin dito ang titulong Griyego na Χριστός bilang “Mesiyas” upang mapanatili ang kahulugan nito.
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτῷ ἡ δόξα
  choice: Sa kanya ang kaluwalhatian
  rationale: Pinananatili ang walang-pandiwang anyo ng doxolohiya sa Griyego. Likas sa Filipino ang ganitong pahayag ng pag-uukol ng kaluwalhatian nang hindi nagdaragdag ng tahasang pandiwa.
- source_word: ἐν τῇ ἐκκλησίᾳ
  choice: sa iglesya
  rationale: Ang ἐκκλησία rito ay tumutukoy sa sambayanan ng mga mananampalataya. Ang “iglesya” ay malinaw at kinikilalang salin, at pinananatili ng “sa” ang malawak na diwa ng ἐν.
- source_word: καὶ ἐν Χριστῷ Ἰησοῦ
  choice: at sa Mesiyas na si Jesus
  rationale: Isinasalin ang Χριστός bilang titulong “Mesiyas,” hindi bilang bahagi lamang ng pangalan. Ang “na si” ay likas na paraang Filipino upang iugnay ang titulo sa pangalang Jesus.
- source_word: εἰς πάσας τὰς γενεὰς
  choice: sa lahat ng salinlahi
  rationale: Ipinahihiwatig ng εἰς sa pariralang temporal ang pag-abot sa bawat salinlahi; tuwiran at natural ito sa Filipino.
- source_word: τοῦ αἰῶνος τῶν αἰώνων
  choice: magpakailanman
  rationale: Idyomatikong pahayag ito ng walang hanggang panahon. Ang “magpakailanman” ay malinaw at marangal sa modernong Filipino nang hindi gumagamit ng malabong literal na “kapanahunan ng mga kapanahunan.”
- source_word: ἀμήν
  choice: Amen
  rationale: Karaniwang transliterasyon ng liturhikal na pagpapatibay at malawak na nauunawaan sa Filipino.
theological_decisions:
- issue: Kung isasalin bilang titulo o gagawing tila bahagi ng pangalan ang Χριστός
  choice: Mesiyas na si Jesus
  alternative: Cristo Jesus
  rationale: May malinaw na kahulugan bilang titulo ang Χριστός. Pinananatili ng “Mesiyas na si Jesus” ang kahulugang iyon habang hindi binabago ang tinutukoy.
- issue: Ugnayan ng kaluwalhatian sa iglesya at sa Mesiyas na si Jesus
  choice: Pinanatili ang magkatapat na “sa iglesya at sa Mesiyas na si Jesus”
  alternative: “sa pamamagitan ng iglesya at ni Cristo Jesus”
  rationale: Parehong gumagamit ng ἐν ang dalawang parirala. Hindi ito ginawang instrumental upang hindi lutasin nang palihim ang saklaw at teolohikal na ugnayang maaaring ipahiwatig ng pang-ukol.
translation_notes:
  register: Modernong Filipino na marangal at angkop sa doxolohiya. Ginamit ang “iglesya” bilang pamilyar na katawagan sa sambayanan ng mga mananampalataya at “magpakailanman” bilang natural na katumbas ng idyomatikong pahayag ng walang hanggang panahon.
