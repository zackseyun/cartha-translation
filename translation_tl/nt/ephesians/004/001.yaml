  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Παρακαλῶ οὖν ὑμᾶς ἐγὼ ὁ δέσμιος ἐν κυρίῳ ἀξίως περιπατῆσαι τῆς κλήσεως ἧς ἐκλήθητε,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/001.yaml
  text: Therefore I[a], the prisoner in the Lord, urge you to walk worthily of the calling with which you were called[b],
translation:
  language: tl
  text: Kaya, ako na bilanggo sa Panginoon[a], ay hinihimok ko kayo na mamuhay nang karapat-dapat sa pagkatawag na tinanggap ninyo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bilanggo ng Panginoon” o “bilanggo alang-alang sa Panginoon.” Ang “sa Panginoon” ay mas malapit sa Griyego at hindi lubusang tinutukoy kung anong uri ng ugnayan ang ipinahihiwatig.
    reason: alternative_reading
  - marker: b
    text: 'Sa literal: “lumakad nang karapat-dapat sa pagkatawag na itinawag sa inyo.” Ang “lumakad” ay larawan ng paraan ng pamumuhay.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: nakikiusap
  rationale: Ipinahahayag nito ang mariin ngunit pastoral na pakiusap; mas natural ito sa makabagong Filipino kaysa sa mas pormal na “pinapayuhan” o “hinihimok,” nang hindi ginagawang utos ang pahayag.
- source_word: οὖν
  choice: Kaya
  rationale: Malinaw at likas na ipinapakita ng “Kaya” ang kongklusyon o praktikal na bunga ng naunang paglalahad.
- source_word: δέσμιος
  choice: bilanggo
  rationale: Tuwirang katumbas ito ng salitang tumutukoy sa isang taong nakabilanggo at natural sa kasalukuyang Filipino.
- source_word: ἐν κυρίῳ
  choice: dahil sa pakikipag-isa ko sa Panginoon
  rationale: Ipinapahayag nito ang kaugnayan ng pagkabilanggo ni Pablo sa Panginoon habang iniiwasang gawing tahasang pagmamay-ari lamang ang parirala; kinikilala sa talababa ang ibang posibleng diwa.
- source_word: ἀξίως
  choice: nang karapat-dapat
  rationale: Natural na inilalarawan nito ang pamumuhay na naaayon o nararapat sa natanggap na pagkatawag.
- source_word: περιπατῆσαι
  choice: mamuhay
  rationale: Bagaman literal na “lumakad,” idiomatikong tumutukoy rito ang pandiwa sa buong paraan ng pamumuhay. Ang “mamuhay” ang malinaw at likas na katumbas sa modernong Filipino.
- source_word: κλήσεως
  choice: pagkatawag
  rationale: Pinananatili nito ang teolohikal na konsepto ng pagtawag ng Diyos at ang ugnayang pandiwa-pangngalan sa “tinawag.”
- source_word: ἧς ἐκλήθητε
  choice: sa pagkatawag sa inyo ng Diyos
  rationale: Natural sa Filipino ang pariralang ito at ginagawang malinaw ang di-tahasang gumaganap sa balintiyak na pandiwa—ang Diyos—ayon sa konteksto ng sulat.
theological_decisions:
- issue: Diwa ng ὁ δέσμιος ἐν κυρίῳ
  choice: na bilanggo dahil sa pakikipag-isa ko sa Panginoon
  alternative: bilanggo ng Panginoon; bilanggo alang-alang sa Panginoon; bilanggo sa Panginoon
  rationale: Ang ἐν κυρίῳ ay sadyang malawak at maaaring magpahiwatig ng saklaw, kaugnayan, o dahilan. Pinili ang isang malinaw na Filipino na inuugnay ang kalagayan ni Pablo sa Panginoon, habang inilalahad sa talababa ang iba pang posibleng pagbasa upang hindi itago ang tunay na kalabuan.
- issue: Di-tahasang gumaganap sa ἐκλήθητε
  choice: ng Diyos
  alternative: 'panatilihing di-tahas ang gumaganap: “sa pagkatawag sa inyo”'
  rationale: Sa kontekstong Paulino, ang Diyos ang tumatawag. Ang paglalantad nito ay nagpapalinaw sa Filipino nang hindi nag-aangkat ng denominasyonal na pagpapakahulugan.
- issue: Metapora ng περιπατῆσαι
  choice: mamuhay
  alternative: lumakad
  rationale: Ang “lumakad” ay maaaring maunawaan nang literal sa Filipino. Ang “mamuhay” ang naghahatid ng idiomatikong diwa ng asal at paraan ng buhay, habang binabanggit sa talababa ang literal na larawan.
translation_notes:
  register: Makabago, magalang, at pastoral ang himig. Ginamit ang “kayo” at “inyo” dahil maramihan ang mga panghalip sa Griyego. Iniwasan ang labis na teknikal o makalumang pananalita, ngunit pinanatili ang teolohikal na bigat ng “pagkatawag.”
