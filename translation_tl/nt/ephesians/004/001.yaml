  naturalness: Ang “hinihimok ko kayo” ay mas angkop sa mariin ngunit pastoral na παρακαλῶ kaysa “nakikiusap.” Ang “mamuhay nang karapat-dapat” ay likas at malinaw sa modernong Filipino. Ang “pagkatawag na tinanggap ninyo” ay natural na paraan upang ihatid ang tinanggap na tawag nang hindi magdagdag ng tahasang gumaganap.
  terminology: Pinananatili ang “Panginoon,” “bilanggo,” at “pagkatawag.” Ginamit ang “bilanggo sa Panginoon” upang mapanatili ang hindi ganap na natutukoy na ugnayan ng ἐν κυρίῳ; ipinapaliwanag ng talababa ang mas idiomatiko ngunit mas mapagpasiyang mga alternatibo.
