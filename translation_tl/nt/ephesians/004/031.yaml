  source_fidelity: Tapat ang salin sa kumpletong listahan ng πᾶσα πικρία, θυμός, ὀργή, κραυγή, βλασφημία, at κακία. Ang “poot” at “galit” ay sapat na nakapag-iiba sa matinding θυμός at sa kasunod na ὀργή. Ang “sigawan” ay angkop sa mapanlabang κραυγή, at ang “paninirang-puri” ay makatuwirang kontekstuwal na salin ng βλασφημία. Ang “Alisin sa inyo” ay isang likas na anyong pautos sa Filipino na naghahatid ng panawagang alisin ang mga ito mula sa pamayanan, bagaman hindi nito minamarkahan nang lantad ang pasibong anyo ng Griyego.
  naturalness: Makabago, malinaw, at marangal ang rehistro. Maayos ang daloy ng talaan at hindi pilit ang mga salitang pinili. Ang “masamang hangarin” ay isang natural na pagpapahayag para sa κακία sa kontekstong ito.
  terminology: Ang mga terminong “kapaitan,” “poot,” “galit,” “sigawan,” at “paninirang-puri” ay pare-parehong angkop sa modernong Filipino Tagalog. Wastong pinananatili ng talababa ang “mapang-abusong pananalita” bilang mas malawak na posibilidad at kinikilala ang tradisyonal na “paglapastangan,” nang hindi ipinipilit ang isang doktrinal na pagbasa.
