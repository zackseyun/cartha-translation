id: EPH.4.31
reference: Ephesians 4:31
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πᾶσα πικρία καὶ θυμὸς καὶ ὀργὴ καὶ κραυγὴ καὶ βλασφημία ἀρθήτω ἀφ’ ὑμῶν σὺν πάσῃ κακίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/031.yaml
  text: Let all bitterness and wrath and anger and clamor and slander be taken away from you[a], along with all malice.
translation:
  language: tl
  text: Alisin sa inyo ang lahat ng kapaitan, poot, galit, sigawan, at paninirang-puri[a], kasama ang lahat ng masamang hangarin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mapang-abusong pananalita”; ayon sa tradisyon, “paglapastangan.” Sa kontekstong ito, malamang na tumutukoy ang salitang Griyego sa mapaminsalang pananalita laban sa kapuwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα πικρία
  choice: lahat ng kapaitan
  rationale: Pinananatili ang malawak na saklaw ng πᾶσα at ang larawan ng πικρία bilang namuong mapait na saloobin.
- source_word: θυμός
  choice: poot
  rationale: Ipinahihiwatig ang matinding silakbo ng damdamin at inilalayo ito sa kasunod na ὀργή, bagaman may bahagyang pagsasanib ang kahulugan ng dalawa.
- source_word: ὀργή
  choice: galit
  rationale: Karaniwan at malinaw na katumbas na naiiba sa mas matinding 'poot' para sa θυμός.
- source_word: κραυγή
  choice: sigawan
  rationale: Sa konteksto, tumutukoy ito sa maingay at mapanlabang pagsasalita; natural sa modernong Tagalog ang 'sigawan.'
- source_word: βλασφημία
  choice: paninirang-puri
  rationale: Sa listahang tumatalakay sa asal sa kapuwa, malamang na tumutukoy ito sa mapaminsalang pananalita laban sa iba, habang kinikilala sa talababa ang mas malawak at tradisyonal na mga posibilidad.
- source_word: ἀρθήτω ἀφ’ ὑμῶν
  choice: Alisin sa inyo
  rationale: Natural na utos sa Tagalog na tapat sa diwa ng ganap na pag-aalis, kahit ginawang aktibo ang anyo upang maiwasan ang alanganing pasibong pahayag.
- source_word: σὺν πάσῃ κακίᾳ
  choice: kasama ang lahat ng masamang hangarin
  rationale: Sa kontekstong etikal at panlipunan, ang κακία ay tumutukoy sa masamang kalooban o layuning manakit, hindi lamang sa kasamaan sa pangkalahatan.
theological_decisions:
- issue: Kahulugan ng βλασφημία sa listahan ng masasamang asal
  choice: paninirang-puri laban sa kapuwa
  alternative: mapang-abusong pananalita; paglapastangan sa Diyos
  rationale: Ang mga nakapaligid na termino ay nakatuon sa mapanirang damdamin at pananalita sa ugnayan ng mga tao. Gayunman, hindi lubusang isinasara ng salin ang mas malawak na saklaw ng salita, kaya inilagay ang mga alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang sunod-sunod na listahan ng mga bisyo at ang pagkakaiba ng θυμός at ὀργή hangga't natural sa Tagalog.
