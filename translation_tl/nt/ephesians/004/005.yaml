  text: one Lord[a], one faith, one baptism;
translation:
  language: tl
  text: iisa ang Panginoon, iisa ang pananampalataya[a], iisa ang bautismo;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “katapatan” o “pagtitiwala” ang kahulugan ng pananampalataya (πίστις), ngunit “pananampalataya” ang pinakanaaangkop sa pagkakaisang binibigyang-diin dito.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷς / μία / ἓν
  choice: iisa
  rationale: Ang tatlong anyong pangkasarian ng bilang na ‘isa’ ay pare-parehong isinaling ‘iisa’ upang idiin ang pagkakaisa at mapanatili ang magkakatugmang kayarian ng talata.
- source_word: κύριος
  choice: Panginoon
  rationale: Karaniwang salin ito ng kristolohikal na titulong κύριος; sa daloy ng Efeso 4:4–6, pinakanatural itong tumukoy kay Jesus.
- source_word: πίστις
  choice: pananampalataya
  rationale: Sa konteksto, tumutukoy ito sa iisang pananampalatayang pinagsasaluhan ng iglesya. Posible rin sa ibang konteksto ang ‘katapatan’ o ‘pagtitiwala,’ kaya pinanatili sa talababa ang tunay na lawak ng salita.
- source_word: βάπτισμα
  choice: bautismo
  rationale: Ito ang tiyak at malawak na nauunawaang tawag sa bautismo, nang hindi tinutukoy ang paraan, bisa, o partikular na teolohiya nito.
theological_decisions:
- issue: Tinutukoy ng ‘Panginoon’
  choice: Pinanatili ang ‘Panginoon’ bilang titulong pinakanatural na tumutukoy kay Jesus.
  alternative: Mas pangkalahatang pagtukoy sa Diyos.
  rationale: Sa pagkakasunod ng ‘isang Espiritu’ (tal. 4), ‘isang Panginoon’ (tal. 5), at ‘isang Diyos at Ama’ (tal. 6), pinakanatural na tumutukoy ito sa Anak, nang hindi nagdaragdag ng paliwanag sa mismong teksto.
- issue: Kahulugan ng ‘iisang bautismo’
  choice: Isinalin nang neutral bilang ‘iisa ang bautismo.’
  alternative: Partikular na sakramental na diin, o pangunahing metaporikal/espirituwal na bautismo.
  rationale: Ipinapahayag ng talata ang pagkakaisa ngunit hindi nito nilulutas ang mga pagtatalong denominasyonal tungkol sa paraan o bisa ng bautismo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ang pag-uulit ng ‘iisa ang’ ay likas sa Tagalog at malinaw na nagpapanatili sa mariing tatluhang paralelismo ng Griyego.
