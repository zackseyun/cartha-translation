  text: ἀποθέσθαι ὑμᾶς κατὰ τὴν προτέραν ἀναστροφὴν τὸν παλαιὸν ἄνθρωπον τὸν φθειρόμενον κατὰ τὰς ἐπιθυμίας τῆς ἀπάτης,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/022.yaml
  text: to put off[a], with respect to your former way of life, the old man, which is being corrupted according to deceitful desires[b],
translation:
  language: tl
  text: na hubarin ninyo, tungkol sa dati ninyong pamumuhay, ang lumang pagkatao[a], na patuloy na nasisira ayon sa mga mapanlinlang na pagnanasa[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang lumang tao.” Tumutukoy ito sa dating pagkatao o paraan ng pagiging tao, hindi lamang sa isang lalaking may edad.
    reason: alternative_reading
  - marker: b
    text: Sa literal, “mga pagnanasa ng panlilinlang”; ibig sabihin, mga pagnanasang hinuhubog o kinakikitaan ng panlilinlang.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποθέσθαι
  choice: hubarin ninyo
  rationale: Pinananatili ng “hubarin” ang larawang kaugnay ng damit at ang pagtutugma nito sa “isuot” sa talata 24. Isinasama ito sa sugnay na nagsasaad ng nilalaman ng itinuro, gaya ng ugnayan ng pawatas sa naunang konteksto.
- source_word: κατὰ τὴν προτέραν ἀναστροφὴν
  choice: tungkol sa dati ninyong pamumuhay
  rationale: Ang unang κατά ay tumutukoy sa saklaw o kaugnayan, at ang ἀναστροφή ay paraan ng pamumuhay o asal. Natural sa makabagong Tagalog ang pariralang ito nang hindi ginagawang pamantayan ang dating buhay.
- source_word: τὸν παλαιὸν ἄνθρωπον
  choice: ang lumang pagkatao
  rationale: Ipinahahayag ng “pagkatao” ang kinatawang antropolohikal na diwa ng ἄνθρωπος nang hindi ipinapalagay na lalaki lamang ang tinutukoy. Pinananatili ng “lumang” ang malinaw na kaibahan sa bagong pagkatao sa talata 24.
- source_word: τὸν φθειρόμενον
  choice: na patuloy na nasisira
  rationale: Ipinakikita ng “patuloy” ang nagpapatuloy na kilos ng pangkasalukuyang pasibong pandiwari, samantalang saklaw ng “nasira” ang moral na pagkabulok at kapahamakan nang hindi labis na nililimitahan ang larawan.
- source_word: κατὰ τὰς ἐπιθυμίας τῆς ἀπάτης
  choice: ayon sa mga mapanlinlang na pagnanasa
  rationale: Pinananatili ng “ayon sa” ang puwersa ng κατά bilang pamantayan o kumokontrol na impluwensiya. Ang “mapanlinlang na pagnanasa” ay natural na salin ng genitibong “mga pagnanasa ng panlilinlang” at hindi nililimitahan ang ἐπιθυμία sa seksuwal na pagnanasa.
theological_decisions:
- issue: Pagpapakahulugan sa τὸν παλαιὸν ἄνθρωπον
  choice: ang lumang pagkatao
  alternative: ang matandang tao; ang dating sarili
  rationale: Ang literal na “matandang tao” ay madaling mapagkamalang tumutukoy sa isang lalaking may edad. Ang “lumang pagkatao” ay nagpapanatili sa antropolohikal at kinatawang diwa ng parirala, gayundin sa kaibahan nito sa “bagong pagkatao,” nang hindi ito nililimitahan sa kasarian.
- issue: Puwersa ng ἀποθέσθαι sa konteksto
  choice: na … hubarin ninyo
  alternative: upang hubarin ninyo; na hinubad na ninyo
  rationale: Ang anyong ito ay nag-uugnay sa pawatas sa nilalaman ng pagtuturo sa talata 21. Hindi nito tahasang nilulutas kung ang diin ay utos, nilalaman ng pagtuturo, o pangyayaring kaugnay ng pagbabalik-loob.
- issue: Ugnayan ng τῆς ἀπάτης sa ἐπιθυμίας
  choice: mga mapanlinlang na pagnanasa
  alternative: mga pagnanasa ng panlilinlang; mga pagnanasang dulot ng panlilinlang
  rationale: 'Ang attributibong salin ay natural at pinananatiling malawak ang genitibong ugnayan: ang mga pagnanasa ay may katangian o impluwensiya ng panlilinlang. Ang “dulot ng” ay mas tiyak na sanhi kaysa sa tahasang sinasabi ng Griyego.'
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang talinghaga ng paghuhubad at ang nagpapatuloy na pasibong pagkasira. Ang ayos ng sugnay ay sadyang nagpapakitang nakasalalay ang talata sa naunang pangungusap.
