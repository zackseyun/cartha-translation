id: EPH.4.19
reference: Ephesians 4:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἵτινες ἀπηλγηκότες ἑαυτοὺς παρέδωκαν τῇ ἀσελγείᾳ εἰς ἐργασίαν ἀκαθαρσίας πάσης ἐν πλεονεξίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/019.yaml
  text: who[a], having become callous[c][b], gave themselves over to sensuality for the practice of every kind of impurity with greediness.
translation:
  language: tl
  text: Naging manhid na sila[a] at ibinigay nila ang kanilang sarili sa walang-kahihiyang pagpapakasasa[b], upang gawin ang bawat uri ng karumihan nang may kasakiman.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nawalan na ng pakiramdam” o “hindi na nakakaramdam.”
    reason: lexical_alternative
  - marker: b
    text: O “kahalayan” o “walang-pigil na kalayawan.”
    reason: lexical_alternative
  - marker: c
    text: O “sa kasakiman” o “nang may sakim na pagnanasa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: sila
  rationale: Ipinagpapatuloy nito ang pagtukoy sa mga taong binanggit sa naunang konteksto. Mas natural sa Filipino ang tahasang panghalip kaysa pilit na panatilihin ang anyong kamag-anak na panghalip.
- source_word: ἀπηλγηκότες
  choice: naging manhid na
  rationale: Ipinahihiwatig ng ganap na pandiwaring Griyego ang pagkakaroon ng kalagayang wala nang pakiramdam o pagkasensitibo, lalo na sa usaping moral. Pinananatili ng “naging … na” ang bunga ng naganap na pagbabago.
- source_word: ἑαυτοὺς παρέδωκαν
  choice: ibinigay nila ang kanilang sarili
  rationale: Pinananatili nito ang kusang pagsuko ng sarili na ipinahihiwatig ng reflexive na layon at ng παρέδωκαν.
- source_word: τῇ ἀσελγείᾳ
  choice: sa walang-kahihiyang pagpapakasasa
  rationale: Saklaw ng ἀσέλγεια ang hayagan at walang-pigil na pagpapakasasa, na madalas ngunit hindi lamang seksuwal. Mas malawak ito kaysa sa “kahalayan” lamang.
- source_word: εἰς ἐργασίαν
  choice: upang gawin
  rationale: Likas na ipinapahayag sa Filipino ang layunin o kinalabasan ng εἰς ἐργασίαν sa ganitong paraan, nang hindi ito maling maunawaan bilang karaniwang hanapbuhay.
- source_word: ἀκαθαρσίας πάσης
  choice: ang bawat uri ng karumihan
  rationale: Ipinakikita nito ang malawak at distributibong diwa ng πάσης at natural itong pakinggan sa modernong Filipino.
- source_word: ἐν πλεονεξίᾳ
  choice: nang may kasakiman
  rationale: Ipinakikita ng parirala ang paraan o disposisyong walang-kasiyahan at mapang-angkin habang ginagawa ang karumihan, habang pinananatili ang karaniwang diwa ng πλεονεξία.
theological_decisions:
- issue: Moral at sikolohikal na diwa ng ἀπηλγηκότες
  choice: naging manhid na
  alternative: nawalan na ng lahat ng pakiramdam
  rationale: Sa konteksto, inilalarawan ang moral na kawalan ng pakiramdam, hindi lamang emosyonal o klinikal na pamamanhid.
- issue: Saklaw ng ἀσέλγεια
  choice: walang-kahihiyang pagpapakasasa
  alternative: kahalayan; kalayawan
  rationale: Hindi nililimitahan ng salin ang salita sa seksuwal na kasalanan lamang; pinananatili nito ang mas malawak na diwa ng hayagan at walang-pigil na pagpapakasasa.
- issue: Ugnayan ng ἐν πλεονεξίᾳ sa sugnay
  choice: nang may kasakiman
  alternative: sa kasakiman; nang may sakim na pagnanasa
  rationale: Itinuturing itong paglalarawan sa paraan o saloobing kasama ng paggawa ng karumihan, ngunit hindi dinaragdagan ng salin ang tiyak na bagay na pinagnanasaan.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “walang-kahihiyang pagpapakasasa” upang maipahayag ang malawak na diwa ng ἀσέλγεια nang hindi ito awtomatikong nililimitahan sa seksuwal na kahalayan. Ang mga pananda ng talababa ay nakalagay kaagad pagkatapos ng kaugnay na salita o parirala.
