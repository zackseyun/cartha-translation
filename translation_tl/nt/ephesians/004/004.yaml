  source_fidelity: Tumpak na naipapahayag ang ἓν σῶμα καὶ ἓν πνεῦμα sa “Iisa ang katawan at iisa ang Espiritu,” at napapanatili ang paulit-ulit na diin sa pagkakaisa. Ang “kung paanong tinawag din kayo sa iisang pag-asa” ay maayos na katumbas ng καθὼς καὶ ἐκλήθητε ἐν μιᾷ ἐλπίδι. Ang “na kaugnay ng pagkatawag sa inyo” ay maingat na naghahatid ng malawak na ugnayan ng τῆς κλήσεως ὑμῶν nang hindi ito labis na binibigyang-kahulugan.
