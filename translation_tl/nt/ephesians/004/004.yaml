id: EPH.4.4
reference: Ephesians 4:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἓν σῶμα καὶ ἓν πνεῦμα, καθὼς καὶ ἐκλήθητε ἐν μιᾷ ἐλπίδι τῆς κλήσεως ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/004.yaml
  text: There is one body and one Spirit[a], just as you also were called in one hope of your calling.
translation:
  language: tl
  text: Iisa ang katawan at iisa ang Espiritu[a], kung paanong tinawag din kayo sa iisang pag-asa na kaugnay ng pagkatawag sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “espiritu.” Ang salitang Griyego ay maaaring mangahulugang “espiritu” o “Espiritu”; sa pormula ng pagkakaisa sa kontekstong ito, malamang na tumutukoy ito sa Banal na Espiritu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἓν / μιᾷ
  choice: iisa / iisang
  rationale: Inuulit ang salitang nagpapahayag ng pagiging isa upang mapanatili ang diin ng talata sa pagkakaisa; ginagamit ang likas na anyong Tagalog ayon sa balarila ng pangungusap.
- source_word: σῶμα
  choice: katawan
  rationale: Tuwirang pinananatili ang metapora; sa konteksto, malamang na tumutukoy ito sa nagkakaisang katawan ng mga mananampalataya nang hindi iyon idinaragdag sa mismong teksto.
- source_word: πνεῦμα
  choice: Espiritu
  rationale: Sa pormula ng pagkakaisa sa Efeso 4:4–6, malamang na ang tinutukoy ay ang Banal na Espiritu. Gayunman, walang malalaking titik sa tekstong Griyego, kaya itinala sa talababa ang leksikal na alternatibo.
- source_word: καθὼς καὶ
  choice: kung paanong ... din
  rationale: Natural na paghahambing sa Tagalog na pinananatili ang diwa ng καθώς at ang karagdagang diin ng καί sa mga tinawag.
- source_word: ἐκλήθητε
  choice: tinawag ... kayo
  rationale: Pinananatili ang pasibong diwa ng pandiwa at hindi tahasang pinapangalanan ang tumawag, gaya ng orihinal.
- source_word: ἐν μιᾷ ἐλπίδι
  choice: sa iisang pag-asa
  rationale: Ang “sa” ang natural na katumbas ng ἐν sa pariralang ito at pinananatili ang motibo ng pagiging isa.
- source_word: τῆς κλήσεως ὑμῶν
  choice: na kaugnay ng pagkatawag sa inyo
  rationale: Ipinapahayag ang maluwag na ugnayang henitibo nang hindi ipinipilit kung ito ay pag-asang ibinigay sa, kasama ng, o bunga ng pagkatawag. Pinananatili rin ang leksikal na ugnayan ng ἐκλήθητε at κλήσεως sa pamamagitan ng “tinawag” at “pagkatawag.”
theological_decisions:
- issue: Tinutukoy ng πνεῦμα
  choice: ang Banal na Espiritu
  alternative: isang espiritu o magkakatulad na espirituwal na disposisyon ng mga mananampalataya
  rationale: Ang pagkakasunod na “iisang katawan ... iisang Espiritu ... iisang Panginoon ... iisang Diyos at Ama” sa Efeso 4:4–6 ay malakas na nagpapahiwatig na ang Banal na Espiritu ang tinutukoy. Ang malaking titik ay interpretatibo, kaya pinananatili sa talababa ang tunay na alternatibo.
- issue: Ugnayan ng pag-asa at pagkatawag
  choice: pag-asang kaugnay ng pagkatawag
  alternative: pag-asang tinawag silang tamuhin
  rationale: Malawak ang maaaring ugnayan ng henitibong τῆς κλήσεως ὑμῶν. Ang “kaugnay ng” ay nagpapanatili ng ambiguity at umiiwas sa tahimik na pagtukoy sa eksaktong semantikong relasyon.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “iisa/iisang” upang malinaw na maiparinig ang paulit-ulit na diin sa pagkakaisa. Iniwasan ang mas teknikal o makalumang ayos na “sa isang pag-asa ng inyong pagkatawag,” at ginamit ang “kaugnay ng” upang maging natural habang pinananatili ang saklaw ng kahulugan ng henitibo.
source_grounding:
  english_pob_role: consult_only
