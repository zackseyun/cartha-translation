  terminology: Ang “katawan,” “Espiritu,” “pag-asa,” at “pagkatawag” ay pare-pareho at angkop sa bokabularyo ng Efeso. Ang malaking titik sa “Espiritu” ay isang makatwirang interpretatibong pagpili na wastong nililinaw ng talababa; hindi itinatanggi ng teksto ang leksikal na posibilidad na “espiritu.”
