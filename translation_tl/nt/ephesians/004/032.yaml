id: EPH.4.32
reference: Ephesians 4:32
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀γίνεσθε εἰς ἀλλήλους χρηστοί, εὔσπλαγχνοι, χαριζόμενοι ἑαυτοῖς καθὼς καὶ ὁ θεὸς ἐν Χριστῷ ἐχαρίσατο ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/032.yaml
  text: And be kind to one another[a], tenderhearted, forgiving one another[b], just as God in Messiah forgave you.
translation:
  language: tl
  text: Maging mabait at mahabagin kayo sa isa’t isa, at magpatawaran kayo, kung paanong pinatawad din kayo ng Diyos sa Mesiyas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “kay Cristo.”
    reason: alternative_rendering
lexical_decisions:
- source_word: γίνεσθε
  choice: Maging … kayo
  rationale: Pinananatili nito ang pautos at patuloy na panawagan sa asal; mas natural ito sa modernong Tagalog kaysa sa mas literal na anyong nagsasaad ng unti-unting pagbabago.
- source_word: εἰς ἀλλήλους
  choice: sa isa’t isa
  rationale: Likas na pagpapahayag ito ng direksiyon at kapwa ugnayan sa Tagalog.
- source_word: χρηστοί
  choice: mabait
  rationale: Malinaw at karaniwang salita ito para sa kabutihang-loob sa pakikitungo sa kapwa.
- source_word: εὔσπλαγχνοι
  choice: mahabagin
  rationale: Ipinahahayag nito ang taos-pusong awa at malasakit nang hindi inuulit lamang ang kahulugan ng “mabait.”
- source_word: χαριζόμενοι ἑαυτοῖς
  choice: magpatawaran kayo
  rationale: Sa konteksto, ang χαρίζομαι ay tumutukoy sa pagpapatawad; ang “magpatawaran” ay natural na Tagalog at malinaw na kapwa ginagawa sa isa’t isa.
- source_word: καθὼς καὶ
  choice: kung paanong … din
  rationale: Pinananatili ng “kung paanong” ang paghahambing at ng “din” ang dagdag na diin ng καί.
- source_word: ἐν Χριστῷ
  choice: sa Mesiyas
  rationale: Isinasalin ang Χριστός bilang titulong “Mesiyas” at pinananatiling maluwag ang ugnayang ipinahahayag ng ἐν, sa halip na ipakahulugan agad bilang instrumentong “sa pamamagitan ng.”
- source_word: ἐχαρίσατο ὑμῖν
  choice: pinatawad kayo
  rationale: Direkta at natural nitong ipinahahayag sa Tagalog ang ginawang pagpapatawad ng Diyos sa mga kausap.
theological_decisions:
- issue: Pagpapakahulugan sa ἐν Χριστῷ
  choice: sa Mesiyas
  alternative: sa pamamagitan ng Mesiyas
  rationale: Ang “sa Mesiyas” ay higit na nagpapanatili sa siksik at maaaring magkaroon ng higit sa isang ugnayang kahulugan na pariralang Griyego; ang alternatibo ay tahasang instrumentál at maaaring labis na magtakda ng pakahulugan.
- issue: Pagsasalin sa Χριστῷ
  choice: Mesiyas
  alternative: Cristo
  rationale: Dito ay malinaw na pamagat ang Χριστός, kaya isinasalin ang kahulugan nito; ibinibigay sa talababa ang tradisyonal na anyong “Cristo.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling basahin. Ginamit ang “magpatawaran” upang maging natural ang kapwa-saklaw ng pangungusap, at iniwasang gawing tahasang instrumentál ang ἐν Χριστῷ.
