id: EPH.4.14
reference: Ephesians 4:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἵνα μηκέτι ὦμεν νήπιοι, κλυδωνιζόμενοι καὶ περιφερόμενοι παντὶ ἀνέμῳ τῆς διδασκαλίας ἐν τῇ κυβείᾳ τῶν ἀνθρώπων ἐν πανουργίᾳ πρὸς τὴν μεθοδείαν τῆς πλάνης,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/014.yaml
  text: so that we may no longer be children[a], tossed by waves and carried about by every wind of teaching, by human trickery, by craftiness in the scheming of error[c][b],
translation:
  language: tl
  text: upang hindi na tayo maging mga bata, na sinasalanta ng mga alon at tinatangay kung saan-saan ng bawat hangin ng turo, sa pandaraya ng mga tao[a] at sa katusuhang ginagamit sa mga pakana ng panlilinlang.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, “sa paglalaro ng dice ng mga tao,” isang larawang tumutukoy sa pandaraya o panlilinlang.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin, “sa mga pakana ng kamalian” o “para sa mga pakana ng panlilinlang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μηκέτι ὦμεν
  choice: upang hindi na tayo maging
  rationale: Pinananatili ng “upang” ang layunin o bunga ng naunang pahayag, at malinaw na ipinahihiwatig ng “hindi na” ang pagtigil sa dating kalagayan.
- source_word: νήπιοι
  choice: mga batang paslit
  rationale: Tumutukoy ito nang patalinghaga sa mga hindi pa ganap sa pag-iisip o pananampalataya. Natural sa Filipino ang “batang paslit” at mas malinaw ang diwa ng kawalang-gulang kaysa sa payak na “mga bata.”
- source_word: κλυδωνιζόμενοι
  choice: ipinapadpad ng mga alon
  rationale: Pinananatili ang larawang pandagat ng pagiging walang-kakayahang magtakda ng direksiyon habang hinahampas at ipinapadpad ng alon.
- source_word: περιφερόμενοι παντὶ ἀνέμῳ τῆς διδασκαλίας
  choice: tinatangay kung saan-saan ng bawat hangin ng turo
  rationale: Ipinapakita ng “tinatangay kung saan-saan” ang pasibong paggalaw sa iba’t ibang direksiyon; pinananatili naman ng “hangin ng turo” ang matingkad na metapora at ang karaniwang kahulugan ng διδασκαλία.
- source_word: ἐν τῇ κυβείᾳ τῶν ἀνθρώπων
  choice: dahil sa pandaraya ng mga tao
  rationale: Ang κυβεία ay literal na kaugnay ng paglalaro ng dice ngunit dito ay tumutukoy sa pandaraya o panlilinlang. Ibinibigay ng salin ang kontekstuwal na diwa habang inilalagay sa talababa ang kulturang larawan.
- source_word: ἐν πανουργίᾳ
  choice: sa katusuhan
  rationale: Ang πανουργία ay tusong pagkilos na may masamang layunin; malinaw at natural itong ipinahahayag ng “katusuhan.”
- source_word: πρὸς τὴν μεθοδείαν τῆς πλάνης
  choice: humahantong sa mga pakana ng panlilinlang
  rationale: Ipinakikita ng “humahantong sa” ang direksiyon o kinalabasan na maaaring taglayin ng πρός, samantalang ang “mga pakana” ay naghahayag ng planado at sistematikong diwa ng μεθοδεία. Ang πλάνη ay maaaring tumukoy sa kamalian o panlilinlang; pinili rito ang “panlilinlang” dahil sa konteksto, habang pinananatili sa talababa ang alternatibo.
theological_decisions:
- issue: Pagpapakahulugan sa διδασκαλία
  choice: turo
  alternative: doktrina
  rationale: Mas karaniwan at mas malawak ang “turo,” ayon sa karaniwang saklaw ng salitang Griyego. Hindi nililimitahan ng talata ang babala sa pormal na sistemang doktrinal lamang.
- issue: Pagpapakahulugan sa πλάνη
  choice: panlilinlang
  alternative: kamalian o pagkaligaw
  rationale: Maaaring saklawin ng πλάνη ang kamalian, pagkaligaw, at panlilinlang. Dahil nakapaligid dito ang mga salitang tumutukoy sa pandaraya, katusuhan, at pakana, natural ang “panlilinlang,” ngunit hindi dapat itago ang mas malawak na posibilidad kaya nakasaad ang alternatibo sa talababa.
- issue: Ugnayan ng πρός sa μεθοδεία
  choice: humahantong sa mga pakana
  alternative: ginagamit para sa mga pakana; ayon sa mga pakana
  rationale: Masalimuot at siksik ang pariralang Griyego. Pinananatili ng “humahantong sa” ang ideya ng direksiyon o layunin nang hindi tiyakang nagpapasya kung instrumental, purposive, o resultative ang ugnayan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang magkakaugnay na larawan ng mga alon at hangin, habang iniwasan ang sobrang teknikal na “doktrina.” Ang anyong “batang paslit” ay madaling maunawaan bilang sagisag ng kawalang-gulang. Ang bantas at ayos ng pangungusap ay nilinaw para sa natural na pagbasa nang hindi inaalis ang siksik at bahagyang malabong ugnayan ng huling pariralang Griyego.
