  naturalness: Makabago at marangal ang Filipino. Ang “kabanalan ng katotohanan” ay siksik at higit na pormal kaysa karaniwang pananalita, ngunit katanggap-tanggap ito sa saling optimal-equivalence at ang mga talababa ay nagbibigay ng mas idiomatikong pagbasa nang hindi ipinapalit iyon sa pangunahing teksto.
