id: EPH.4.24
reference: Ephesians 4:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐνδύσασθαι τὸν καινὸν ἄνθρωπον τὸν κατὰ θεὸν κτισθέντα ἐν δικαιοσύνῃ καὶ ὁσιότητι τῆς ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/024.yaml
  text: and to put on the new man[d][c][b][a], created according to God in righteousness and holiness of the truth.
translation:
  language: tl
  text: at isuot ang bagong tao[a], na nilikha ayon sa Diyos[b], sa katuwiran[c] at kabanalan ng katotohanan.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bagong sarili” o “bagong pagkatao.” Sa Griyego, “bagong tao,” na katugma ng “dating tao” sa nakapaligid na konteksto.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa wangis ng Diyos” o “ayon sa huwaran ng Diyos.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “katarungan.”
    reason: alternative_reading
  - marker: d
    text: Maaari ring “sa tunay na katuwiran at kabanalan” o “sa katuwiran at kabanalang nagmumula sa katotohanan.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνδύσασθαι
  choice: isuot
  rationale: Ipinagpapatuloy nito ang talinghaga ng paghuhubad at pagsusuot sa nakapaligid na konteksto, sa maikli at likas na paraang Filipino.
- source_word: καινὸν ἄνθρωπον
  choice: bagong tao
  rationale: Pinananatili ang tuwirang larawan ng Griyego at ang pagkakatugma nito sa “dating tao” sa konteksto. Sa Filipino, ang “tao” ay likas na maaaring tumukoy sa isang tao o sa sangkatauhan nang hindi binubura ang salitang ἄνθρωπος.
- source_word: κατὰ θεὸν
  choice: ayon sa Diyos
  rationale: 'Pinananatili ang malawak na diwa ng κατά: ang bagong tao ay nilikha na naaayon sa Diyos o sa kaniyang huwaran, nang hindi ginagawang tahasan sa pangunahing teksto ang isang interpretasyon lamang.'
- source_word: κτισθέντα
  choice: na nilikha
  rationale: Malinaw na pinananatili ang pasibong pandiwari at ang wikang tumutukoy sa paglikha.
- source_word: δικαιοσύνῃ
  choice: sa katuwiran
  rationale: Ang “katuwiran” ang karaniwan at malawak na katumbas sa kontekstong Paulino; maaaring kabilang sa saklaw nito ang katarungan.
- source_word: ὁσιότητι
  choice: kabanalan
  rationale: Likas at marangal itong katumbas para sa katangiang maka-Diyos o banal na ipinahihiwatig ng ὁσιότης.
- source_word: τῆς ἀληθείας
  choice: ng katotohanan
  rationale: Pinananatili ang ugnayang genitibo at ang posibilidad na inilalarawan o pinagmumulan ng “katotohanan” ang katuwiran at kabanalan, sa halip na tahimik na pumili ng iisang paliwanag.
theological_decisions:
- issue: Ang kahulugan ng “bagong tao”
  choice: bagong tao
  alternative: bagong sarili; bagong pagkatao
  rationale: Ang literal na “bagong tao” ay nagpapanatili sa ugnayan sa “dating tao” sa konteksto at sa mas malawak na antropolohikal na larawan ni Pablo. Ang ibang salin ay mas idiomatiko ngunit mas interpretibo.
- issue: Ang diwa ng κατὰ θεὸν
  choice: ayon sa Diyos
  alternative: sa wangis ng Diyos; ayon sa huwaran ng Diyos
  rationale: Hindi tiyak sa mismong parirala kung ang diin ay nasa pagkakatulad, huwaran, o pagkakaayon sa Diyos. Pinananatili ng salin ang saklaw na ito.
- issue: Ang ugnayan ng τῆς ἀληθείας sa katuwiran at kabanalan
  choice: katuwiran at kabanalan ng katotohanan
  alternative: tunay na katuwiran at kabanalan; katuwiran at kabanalang nagmumula sa katotohanan
  rationale: Ang pormal na anyo ay nagpapanatili sa tunay na kalabuan ng genitibo at sa posibilidad na kapuwa inuugnay sa katotohanan ang katuwiran at kabanalan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang talinghaga ng pagsusuot at ang mas pormal na “bagong tao.” Ang bahagyang siksik na “kabanalan ng katotohanan” ay sinadya upang mapanatili ang ugnayang genitibo ng Griyego; nililinaw sa talababa ang mga likas ngunit mas interpretibong alternatibo.
