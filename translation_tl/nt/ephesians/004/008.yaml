base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/008.yaml
  text: Therefore it says[a], “Having ascended on high[b], he led captivity captive and gave gifts to men.”
translation:
  language: tl
  text: 'Kaya ito ang sinasabi: “Nang umakyat siya sa kaitaasan, binihag niya ang mga bihag[a] at nagbigay siya ng mga kaloob sa mga tao.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na anyo, “binihag niya ang pagkabihag.” Masidhing magkaugnay ang pandiwa at layon sa Griyego at umaalingawngaw ito sa Awit 68:18. Maaari rin itong isaling “dinala niyang bihag ang mga bihag.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Kaya
  rationale: Pinananatili ang lohikal na ugnayan ng sipi sa naunang pahayag ni Pablo, sa natural at kasalukuyang Tagalog.
- source_word: λέγει
  choice: sinasabi
  rationale: Walang tahasang simuno ang pandiwa sa Griyego. Ang payak na “sinasabi” ay karaniwang pormula sa pagsipi at hindi nagdaragdag ng simunong wala sa teksto.
- source_word: Ἀναβὰς εἰς ὕψος
  choice: Nang umakyat siya sa kaitaasan
  rationale: Ipinahahayag ng “nang” ang pag-akyat na nauuna sa mga pangunahing kilos, habang pinananatili ng “kaitaasan” ang marangal at salmong himig ng parirala.
- source_word: ᾐχμαλώτευσεν αἰχμαλωσίαν
  choice: binihag niya ang mga bihag
  rationale: Ginagawang nauunawaan sa Tagalog ang masidhing magkaugnay na pandiwa at layon sa Griyego, habang pinananatili ang pag-uulit ng ideya ng pagbihag. Inilalahad sa talababa ang mas literal na anyo at ibang posibleng pagbasa.
- source_word: ἔδωκεν δόματα
  choice: nagbigay siya ng mga kaloob
  rationale: Tuwiran at natural na salin ng pandiwa at pangngalan; ang “kaloob” ay angkop sa konteksto ng biyaya at paglilingkod.
- source_word: τοῖς ἀνθρώποις
  choice: sa mga tao
  rationale: Ang ἄνθρωποι ay pangkalahatang tumutukoy rito sa mga tao. Likas na naipahahayag ng “mga tao” ang saklaw nang hindi nililimitahan sa mga lalaki.
theological_decisions:
- issue: Ang larawan ng pagbihag sa inangkop na sipi mula sa Awit 68:18
  choice: binihag niya ang mga bihag
  alternative: dinala niyang bihag ang pagkabihag; nagdala siya ng maraming bihag
  rationale: Hindi tinutukoy ng talata kung sino o ano mismo ang mga bihag. Pinananatili ng salin ang matinding larawang pandigma at ang pag-uulit sa Griyego nang hindi ipinapasok ang isang tiyak na doktrinal na pagkakakilanlan ng mga bihag.
- issue: Ang hindi tahasang simuno ng λέγει
  choice: sinasabi
  alternative: sinasabi niya; sinasabi ng Kasulatan
  rationale: Iniiwasang tukuyin bilang Diyos o Kasulatan ang simunong hindi tahasang binanggit, bagaman malinaw na pormula ito ng pagsipi.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Ang “Kaya sinasabi” ay sadyang walang tahasang simuno, gaya ng Griyego. Ang “kaitaasan” at “mga kaloob” ay nagpapanatili ng himig ng siping banal at ng konteksto ni Pablo nang hindi nagiging lipas o teknikal.
