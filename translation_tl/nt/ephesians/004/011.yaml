id: EPH.4.11
reference: Ephesians 4:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ αὐτὸς ἔδωκεν τοὺς μὲν ἀποστόλους, τοὺς δὲ προφήτας, τοὺς δὲ εὐαγγελιστάς, τοὺς δὲ ποιμένας καὶ διδασκάλους,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/011.yaml
  text: And he himself gave some as apostles[a], some as prophets, some as evangelists, and some as shepherds and teachers[b],
translation:
  language: tl
  text: At siya mismo ang nagbigay ng ilan bilang mga apostol, ng ilan bilang mga propeta, ng ilan bilang mga ebanghelista, at ng ilan bilang mga pastol[a] at mga guro[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga pastor.” Literal na “mga pastol” ang Griyego.
    reason: lexical_alternative
  - marker: b
    text: Iisa lamang ang artikulo sa Griyego bago ang “mga pastol at mga guro.” Maaaring ipinahihiwatig nito ang napakalapit na ugnayan ng mga gawaing ito, ngunit hindi kinakailangang unawain ang parirala bilang iisang katungkulan.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang pang-ugnay upang ipakita ang pagpapatuloy ng diwa mula sa naunang talata.
- source_word: αὐτὸς
  choice: siya mismo
  rationale: 'Ipinahahayag ang diin ng Griyegong panghalip: ang tinutukoy mismo ang personal na nagbigay.'
- source_word: ἔδωκεν
  choice: nagbigay
  rationale: Ito ang tuwirang kahulugan ng δίδωμι at hindi nito nililimitahan ang diwa sa pormal na paghirang lamang.
- source_word: τοὺς μὲν ... τοὺς δὲ
  choice: ng ilan bilang ... ng ilan bilang
  rationale: Natural na inililipat sa Tagalog ang pamamahaging ayos ng paulit-ulit na artikulo kasama ng μέν/δέ, habang ipinakikitang ibinigay ang mga taong ito sa kani-kanilang tungkulin.
- source_word: ἀποστόλους
  choice: mga apostol
  rationale: Karaniwan at tumpak na salin ng ἀπόστολος sa makabagong Tagalog.
- source_word: προφήτας
  choice: mga propeta
  rationale: Tuwiran at kinikilalang katumbas ng προφήτης.
- source_word: εὐαγγελιστάς
  choice: mga ebanghelista
  rationale: Maikli, natural, at kinikilalang tawag sa mga tagapagpahayag ng mabuting balita sa ganitong talaan ng mga tungkulin.
- source_word: ποιμένας
  choice: mga pastol
  rationale: Pinananatili ang literal na larawang 'pastol' ng Griyego sa halip na agad itong gawing terminong pansimbahan na 'pastor.'
- source_word: καὶ διδασκάλους
  choice: at mga guro
  rationale: Tuwirang salin na hindi nagpapasiya kung ang mga pastol at mga guro ay iisang tungkulin o dalawang magkaugnay na gawain.
theological_decisions:
- issue: Kung ang ποιμένας ay isasaling literal na 'mga pastol' o gamit ang tradisyonal na titulong pansimbahan na 'mga pastor'
  choice: mga pastol
  alternative: mga pastor
  rationale: Pinananatili sa pangunahing teksto ang talinghagang nasa Griyego. Ang 'mga pastor' ay maaaring salin ayon sa konteksto ngunit mas tahasang gumagamit ng katawagang pansimbahan, kaya inilagay bilang alternatibo sa talababa.
- issue: Kung ang 'mga pastol at mga guro' ay isang pinagsamang pangkat o dalawang magkahiwalay na pangkat
  choice: Isinalin ang dalawang pangngalan nang magkatambal ngunit hindi pinagsama sa iisang titulo.
  alternative: mga pastol-guro bilang isang pinagsamang tungkulin; o dalawang ganap na magkahiwalay na pangkat
  rationale: Iisang artikulo sa Griyego ang nauuna sa dalawang pangngalan, kaya maaaring nagpapahiwatig ito ng napakalapit na ugnayan; gayunman, hindi sapat ang anyo upang sapilitang ituring silang iisang katungkulan. Pinananatili ng salin ang ambiguwidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang mga kinikilalang katawagang biblikal na “apostol,” “propeta,” at “ebanghelista,” habang pinanatili ang konkretong talinghaga ng “pastol.”
