source:
  edition: SBLGNT
  text: μέχρι καταντήσωμεν οἱ πάντες εἰς τὴν ἑνότητα τῆς πίστεως καὶ τῆς ἐπιγνώσεως τοῦ υἱοῦ τοῦ θεοῦ, εἰς ἄνδρα τέλειον, εἰς μέτρον ἡλικίας τοῦ πληρώματος τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/013.yaml
  text: until we all attain to the unity of the faith and of the knowledge of the Son of God[a], to a mature man, to the measure of the stature of the fullness of Messiah[e][d][c][b],
translation:
  language: tl
  text: hanggang sa makarating tayong lahat sa pagkakaisa ng pananampalataya[a] at ng pagkakilala[b] sa Anak ng Diyos, sa isang lalaking ganap ang gulang[c], sa sukat ng tayog[d] ng kapuspusan ng Mesiyas[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pananalig.” Maaaring idiin ng parirala ang pananampalatayang sama-samang pinanghahawakan ng mga Kristiyano o ang pananampalataya ng mga mananampalataya sa mas pangkalahatang diwa.
    reason: alternative_reading
  - marker: b
    text: O “sa ganap na pagkakilala” o “sa malalim na pagkakilala.”
    reason: lexical_alternative
  - marker: c
    text: O “sa ganap na pagkamaygulang.” Literal na sinasabi ng Griyego na “sa isang lalaking ganap ang gulang,” isang panlalaking isahang larawan para sa sama-samang pagkamaygulang ng buong iglesya.
    reason: lexical_alternative
  - marker: d
    text: O “pagkamaygulang” sa halip na “tayog.”
    reason: lexical_alternative
  - marker: e
    text: Griyego, “Cristo.” Isinalin ditong “Mesiyas” dahil kapansin-pansin ang gamit nito bilang titulo.
    reason: alternative_reading
lexical_decisions:
- source_word: μέχρι καταντήσωμεν οἱ πάντες
  choice: hanggang sa makarating tayong lahat
  rationale: Ipinahahayag ang layunin o hantungan ng prosesong binanggit sa naunang talata. Likas sa Tagalog ang “makarating” para sa pag-abot sa isang espirituwal na layunin, at malinaw na isinasama ng “tayong lahat” ang buong pamayanan.
- source_word: εἰς τὴν ἑνότητα τῆς πίστεως
  choice: sa pagkakaisa sa pananampalataya
  rationale: Pinananatili ang diwa ng pagdating sa isang tiyak na pagkakaisa. Maaaring tumukoy ang πίστις sa pananampalatayang sama-samang pinanghahawakan o sa pananampalataya ng mga mananampalataya; hindi nilulutas ng salin ang tunay na kalabuan.
- source_word: καὶ τῆς ἐπιγνώσεως τοῦ υἱοῦ τοῦ θεοῦ
  choice: at sa pagkakilala sa Anak ng Diyos
  rationale: Ang “pagkakilala” ay higit na personal at relasyonal kaysa sa payak na “kaalaman,” ngunit hindi nito sapilitang idinaragdag ang pinatinding kahulugang “ganap na pagkakilala.” Pinananatili nang tuwiran ang kristolohikal na titulong “Anak ng Diyos.”
- source_word: εἰς ἄνδρα τέλειον
  choice: sa pagiging isang lalaking ganap ang gulang
  rationale: Pinananatili ang panlalaking isahang larawan ng Griyego para sa sama-samang paglago ng iglesya. Sa konteksto, ang τέλειος ay tumutukoy sa hustong paglago o pagkahinog, hindi sa kawalang-kasalanan o absolutong kasakdalan.
- source_word: εἰς μέτρον ἡλικίας
  choice: at sa sukat ng tayog
  rationale: Pinananatili ng “sukat” at “tayog” ang larawang pisikal ng paglaki. Posible ring unawain ang ἡλικία bilang “pagkamaygulang,” kaya inilagay iyon sa talababa.
- source_word: τοῦ πληρώματος τοῦ Χριστοῦ
  choice: ng kapuspusan ng Mesiyas
  rationale: Pinananatili ng “kapuspusan” ang mabigat na teolohikal na diwa ng πλήρωμα nang hindi ito pinapaliit sa isang paliwanag lamang. Isinalin ang Χριστός bilang titulong “Mesiyas” sa kontekstong ito.
theological_decisions:
- issue: Kahulugan ng τῆς πίστεως
  choice: pananampalataya, na maaaring tumukoy sa sama-samang pinanghahawakang pananampalataya
  alternative: pananalig o pagtitiwala ng mga mananampalataya
  rationale: Pinapaboran ng artikulo at ng konteksto ng sama-samang paglago ang komunal o obhetibong diwa, ngunit sapat na malawak ang pangunahing salin upang mapanatili ang alternatibong pagbasa.
- issue: Larawan ng εἰς ἄνδρα τέλειον
  choice: isang lalaking ganap ang gulang
  alternative: ganap na pagkamaygulang
  rationale: Ang ἀνήρ ay tahasang panlalaki at isahan, bagaman kumakatawan ito rito sa buong iglesya. Pinananatili sa pangunahing teksto ang larawan sa halip na gawing abstrakto.
- issue: Kahulugan ng τέλειον
  choice: ganap ang gulang
  alternative: sakdal
  rationale: Ang konteksto ay paglago tungo sa ganap na kapanahunan. Ang “sakdal” ay maaaring maling maunawaan bilang absolutong moral na kawalang-kapintasan.
- issue: Paglalahad sa Χριστοῦ
  choice: Mesiyas
  alternative: Cristo
  rationale: Gumaganap dito ang Χριστός bilang teolohikal na titulo ng Pinahiran ng Diyos; pinananatili ng “Mesiyas” ang titulong diwa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang tatlong magkakasunod na pariralang nagsasaad ng hantungan sa pamamagitan ng “sa,” ngunit idinagdag ang “pagiging” sa ikalawa upang maging natural ang Tagalog. Ginamit ang “lalaki” upang huwag burahin ang panlalaking isahang larawan ng orihinal, habang nililinaw sa talababa ang sama-samang pagtukoy nito sa iglesya.
