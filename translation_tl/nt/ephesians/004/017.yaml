  text: Τοῦτο οὖν λέγω καὶ μαρτύρομαι ἐν κυρίῳ, μηκέτι ὑμᾶς περιπατεῖν καθὼς καὶ ⸀τὰ ἔθνη περιπατεῖ ἐν ματαιότητι τοῦ νοὸς αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/017.yaml
  text: 'Therefore I say this and testify in the Lord: you must no longer walk as the Gentiles walk[a], in the futility of their minds,'
translation:
  language: tl
  text: 'Kaya sinasabi ko ito at taimtim kong pinatototohanan sa Panginoon: hindi na kayo dapat mamuhay gaya ng mga Hentil na namumuhay sa kawalang-saysay ng kanilang pag-iisip.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga bansa”; isinasalin ito ng ilan bilang “mga pagano.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο οὖν
  choice: Kaya ito ang sinasabi ko
  rationale: Ipinapanatili ng “kaya” ang lohikal na kaugnayan sa naunang pangaral, at ang “ito” ang tuwirang layon ng “sinasabi ko.”
- source_word: μαρτύρομαι
  choice: taimtim na pinatototohanan
  rationale: Ipinahahayag nito ang mariin at personal na pagpapatotoo ng pandiwa, nang hindi ito pinapahina bilang simpleng “iginigiit.”
- source_word: ἐν κυρίῳ
  choice: sa Panginoon
  rationale: Pinananatili ang sadyang malawak na diwa ng parirala—maaaring tumukoy sa saklaw, kaugnayan, o awtoridad ng Panginoon—nang hindi pinipili lamang ang “sa ngalan ng” o “sa harap ng.”
- source_word: μηκέτι ὑμᾶς περιπατεῖν
  choice: hindi na kayo dapat mamuhay
  rationale: Ang “hindi na” ay nagpapahiwatig ng pagtigil sa dating gawi; malinaw na ipinahahayag ng “dapat” ang mapanghikayat na lakas ng infinitive. Mas natural sa makabagong Tagalog ang “mamuhay” para sa metaporikal na paglakad bilang asal.
- source_word: καθὼς καὶ τὰ ἔθνη περιπατεῖ
  choice: gaya ng pamumuhay ng mga Hentil
  rationale: Inuulit ang ideya ng περιπατέω sa natural na Tagalog at isinasalin ang ἔθνη bilang kilalang kategoryang Paulino na “mga Hentil,” hindi bilang mas mapanghusgang “mga pagano.”
- source_word: ἐν ματαιότητι
  choice: sa kawalang-saysay
  rationale: Saklaw nito ang diwa ng kawalan ng kabuluhan, bunga, o wastong layunin, at malinaw ito sa ordinaryong makabagong Tagalog.
- source_word: τοῦ νοὸς αὐτῶν
  choice: ng kanilang pag-iisip
  rationale: Ang “pag-iisip” ay natural at tuwirang tumutukoy sa gawa o takbo ng isip, nang hindi inuuna ang terminong “pang-unawa” na mas malapit sa διάνοια sa kasunod na talata.
theological_decisions:
- issue: Ang kahulugan ng ἔθνη sa etikal na paghahambing na nakatuon sa iglesiang karamihan ay mga Hentil
  choice: mga Hentil
  alternative: mga bansa; mga pagano
  rationale: Pinananatili ng “mga Hentil” ang etniko at tipanang kategorya sa paggamit ni Pablo nang hindi idinaragdag ang mas matinding negatibong pahiwatig ng “mga pagano.” Ang pinupuna rito ay ang dating paraan ng pamumuhay, hindi ang likas na kalagayan ng bawat di-Judio sa lahat ng bagay.
- issue: Ang lakas ng infinitive na περιπατεῖν kasunod ng λέγω καὶ μαρτύρομαι
  choice: hindi na kayo dapat mamuhay
  alternative: na hindi na kayo mamuhay
  rationale: Ginagawang malinaw ng “dapat” ang mapanghikayat at moral na bigat ng pahayag, na likas sa sintaks at konteksto, nang hindi nagdaragdag ng hiwalay na doktrinal na kategorya.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mamuhay” sa halip na literal na “lumakad” sapagkat ito ang natural na paglilipat ng etikal na metapora sa Tagalog; inulit ang salitang-ugat sa “pamumuhay” upang mapanatili ang pag-uulit sa Griyego. Pinanatili ang “sa Panginoon” upang huwag paliitin ang tunay na saklaw ng ἐν κυρίῳ.
