  source_fidelity: Tapat ang salin sa Griyegong ὑμεῖς δὲ οὐχ οὕτως ἐμάθετε τὸν Χριστόν. Napananatili ang pagsalungat ng “Ngunit,” ang paraang ipinahihiwatig ng “hindi sa ganitong paraan,” ang aktibong “natutuhan,” at ang sadyang di-karaniwang tuwirang layon na “ang Mesiyas.” Hindi ito nagdaragdag ng “tungkol sa” o ng anumang wala sa pinagmulan.
  naturalness: Ang ayos na “hindi sa ganitong paraan ninyo natutuhan” ay pormal ngunit likas at malinaw sa makabagong Filipino. Ang “natutuhan ang Mesiyas” ay hindi pangkaraniwang kolokasyon, ngunit naaangkop itong panatilihin dahil gayon din ang kapansin-pansing pahayag sa Griyego.
  terminology: Wasto at pare-pareho ang “Mesiyas” para sa Χριστόν bilang titulo. Ang talababa na may “si Cristo” ay isang kapaki-pakinabang na alternatibong nakasanayang anyo at hindi binabago ang kahulugan.
