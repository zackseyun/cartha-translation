  yaml_path: translation/nt/ephesians/004/020.yaml
  text: But you did not learn Messiah in this way,[a]
translation:
  language: tl
  text: Ngunit hindi sa ganitong paraan ninyo natutuhan ang Mesiyas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Ngunit hindi sa ganitong paraan ninyo natutuhan si Cristo.”
    reason: Alternatibong salin ng Χριστόν bilang nakasanayang pangalang “Cristo” sa halip na titulong “Mesiyas.”
lexical_decisions:
- source_word: ὑμεῖς
  choice: ninyo
  rationale: Ang panghalip ay maramihan at tahasang nagbibigay-diin sa mga kausap. Sa Tagalog, likas na naipapakita ang maramihan at tuwirang pagtukoy sa kanila sa anyong “ninyo.”
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita nito ang malinaw na pagsalungat sa pamumuhay ng mga Hentil na inilarawan sa naunang konteksto.
- source_word: οὐχ οὕτως
  choice: hindi sa ganitong paraan
  rationale: Pinananatili ang diwa ng paraan o asal na tinutukoy ng οὕτως, sa halip na gawing pangkalahatang “hindi gayon.”
- source_word: ἐμάθετε
  choice: natutuhan
  rationale: Tuwirang isinasalin ang aktibong pandiwang μανθάνω bilang “matutuhan”; iniiwasang gawing “tinuruan,” na magpapasok ng tahasang pasibong diwa bago ang kasunod na talata.
- source_word: τὸν Χριστόν
  choice: ang Mesiyas
  rationale: Pinananatili ang titulong mesiyaniko ng Χριστός at ang di-karaniwang pahayag na ang isang persona, hindi lamang aral tungkol sa kaniya, ang “natutuhan.”
theological_decisions:
- issue: Kung isasalin ang Χριστόν bilang titulo o bilang nakasanayang pangalang “Cristo”
  choice: ang Mesiyas
  alternative: si Cristo
  rationale: May kasamang artikulo ang τὸν Χριστόν at makabuluhan dito ang titulong mesiyaniko. Gayunman, tunay ding posible ang nakasanayang pangalang “Cristo,” kaya inilagay ito sa talababa nang hindi nilulutas nang labis ang saklaw ng gamit.
translation_notes:
  register: Makabagong Filipino na pormal ngunit madaling maunawaan. Pinanatili ang sadyang di-karaniwang pariralang “natutuhan ang Mesiyas” upang hindi gawing “natutuhan ang tungkol sa Mesiyas,” na wala sa Griyego.
