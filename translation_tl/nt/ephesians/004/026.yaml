  text: Magalit kayo[a] at huwag kayong magkasala. Huwag hayaang lumubog ang araw habang galit pa kayo[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Kung magalit man kayo, huwag kayong magkasala.” Pautos ang anyo ng Griyego (“Magalit kayo”), ngunit maaaring unawain ito sa konteksto bilang isang mapagparayang pagbasa.
    reason: alternative_reading
  - marker: b
    text: Malamang na ipinahihiwatig dito ni Pablo ang Awit 4:4 (4:5 sa Septuagint), na nag-uugnay sa galit at sa utos na huwag magkasala.
    reason: cross_reference
  - marker: c
