    reason: lexical_alternative
lexical_decisions:
- source_word: ὀργίζεσθε
  choice: Magalit kayo
  rationale: Pinananatili ang anyong pautos ng Griyego at ang posibleng alusyon sa Awit 4:4 LXX, sa halip na agad itong gawing pasubaling “Kung magalit kayo.”
- source_word: καὶ μὴ ἁμαρτάνετε
  choice: ngunit huwag kayong magkasala
  rationale: Ang “ngunit” ay likas sa modernong Tagalog at malinaw na naghahayag ng mahigpit na kaibahan sa pagitan ng galit at pagkakasala, habang pinananatili ang tahasang pagbabawal ng Griyego.
- source_word: ὁ ἥλιος μὴ ἐπιδυέτω
  choice: Huwag hayaang lumubog ang araw
  rationale: Natural na Tagalog para sa ikatlong-panauhang pautos at tapat sa larawang ginamit sa Griyego.
- source_word: ἐπὶ παροργισμῷ ὑμῶν
  choice: habang galit pa kayo
  rationale: 'Malinaw at natural na ipinahahayag ang nangingibabaw na diwa: hindi dapat abutan ng paglubog ng araw ang nagpapatuloy na galit. Inilalahad sa talababa ang mas literal at iba pang posibleng kahulugan.'
theological_decisions:
- issue: Kung ang pambungad ay utos na magalit o pasubaling pagpapalagay lamang
  choice: 'Pinanatili bilang pautos: “Magalit kayo.”'
  alternative: “Kung magalit kayo, huwag kayong magkasala.”
  rationale: Pautos ang anyong Griyego. Hindi nito ipinahihintulot ang makasalanang galit, sapagkat agad itong nililimitahan ng utos na huwag magkasala at huwag patagalin ang galit.
- issue: Kung ang παροργισμός ay tumutukoy sa galit, pagkayamot, o dahilan ng pagkapoot
  choice: Isinalin sa pangunahing teksto bilang nagpapatuloy na “galit.”
  alternative: “sa inyong pagkayamot” o “sa bagay na pumupukaw sa inyong galit.”
  rationale: Ang “galit” ang pinakanatural sa konteksto at kaugnay ng ὀργίζεσθε, ngunit hindi ganap na isinasara ang mas malawak na saklaw ng salita; kaya nakatala ang mga alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kayo” upang mapanatili ang maramihang anyo ng mga pandiwa at panghalip. Ang “habang galit pa kayo” ay idiomatikong paglalahad; ang mas literal na anyo at leksikal na kalabuan ay pinanatili sa talababa.
