  naturalness: Natural at marangal ang pangkalahatang Filipino, ngunit mas tuwiran at hindi interpretatibo ang “sinasabi natin ang katotohanan” kaysa “ipinahahayag natin ang katotohanan.” Ang “Ngunit” ay mas likas na katumbas ng δέ sa daloy ng pangungusap.
  terminology: Ang “pag-ibig,” “ulo,” at “Mesiyas” ay angkop. Pinananatili ng “Mesiyas” ang titulo ng Χριστός, at ang talababa tungkol sa “Cristo” ay kapaki-pakinabang. Ang mga talababa ay nananatiling nakaangkla nang tama sa mga kaugnay na parirala.
