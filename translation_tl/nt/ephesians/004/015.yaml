translation:
  language: tl
  text: Ngunit, habang sinasabi natin ang katotohanan nang may pag-ibig[a], lumago tayo sa lahat ng paraan[b] tungo sa kanya na siyang ulo—ang Mesiyas.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “habang nagiging tapat tayo” o “habang isinasagawa natin ang katotohanan.” Maaaring saklawin ng pandiwang Griyego ang kapuwa tapat na pananalita at tapat na pamumuhay.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa lahat ng bagay”; mas literal, “lahat ng bagay.”
    reason: lexical_alternative
  - marker: c
    text: 'Griyego: “Cristo”; isinaling “Mesiyas” dito sapagkat ginagamit ang salita bilang titulo.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀληθεύοντες
  choice: habang ipinahahayag natin ang katotohanan
  rationale: Ipinapahayag nito nang likas sa Filipino ang pandiwang diwa sa konteksto ng huwad at mapanlinlang na turo. Maaari ring saklawin ng Griyegong pandiwa ang pagiging tapat at pagsasagawa ng katotohanan, kaya pinanatili sa talababa ang mas malawak na diwa.
- source_word: δὲ
  choice: Sa halip
  rationale: Ipinakikita ang banayad na pagsalungat sa pagiging pabagu-bago at pagkadaya na inilalarawan sa naunang talata.
- source_word: ἐν ἀγάπῃ
  choice: nang may pag-ibig
  rationale: Natural na Filipino para sa paraan o kalagayan ng pagpapahayag ng katotohanan, habang pinananatili ang ugnayan nito sa pag-ibig.
- source_word: αὐξήσωμεν
  choice: lumago tayo
  rationale: Nahuhuli ang hortatoryong puwersa ng unang panauhang maramihang subjunctive bilang isang sama-samang panawagan.
- source_word: εἰς αὐτόν
  choice: tungo sa kanya
  rationale: Pinananatili ang direksiyonal na larawan ng paglago na nakatuon kay Cristo nang hindi gumagamit ng di-likas na literalismong 'papasok sa kanya.'
- source_word: τὰ πάντα
  choice: sa lahat ng paraan
  rationale: Ipinapahayag ang komprehensibong diwa sa idyoma ng paglago; ang mas literal na 'sa lahat ng bagay' ay nasa talababa.
- source_word: κεφαλή
  choice: ulo
  rationale: Tuwirang pinananatili ang metapora ng katawan nang hindi ipinapasok ang pinagtatalunang paliwanag na 'pinagmulan' o 'may awtoridad.'
- source_word: Χριστός
  choice: ang Mesiyas
  rationale: Dito ay nakatayo bilang titulong tumutukoy sa kung sino ang ulo; ang 'Mesiyas' ang malinaw na salin ng Χριστός bilang titulo.
theological_decisions:
- issue: Lawak ng kahulugan ng ἀληθεύοντες
  choice: ipinapahayag natin ang katotohanan
  alternative: nagiging tapat tayo / isinasagawa natin ang katotohanan
  rationale: Pinapaboran ng malapit na konteksto ng huwad na turo at pandaraya ang komunikasyon ng katotohanan, ngunit hindi isinasara ng talababa ang mas malawak na etikal na saklaw ng pandiwa.
- issue: Puwersa ng metaporang κεφαλή
  choice: ulo
  alternative: pinagmulan / may awtoridad sa lahat
  rationale: Pinananatili ang metapora ng teksto at hindi nilulutas sa salin ang mga pinagtatalunang implikasyong teolohikal nito.
- issue: Pagkakakilanlan at gamit ng Χριστός
  choice: ang Mesiyas
  alternative: Cristo
  rationale: Ang appositional na pagkakalagay pagkatapos ng 'ulo' ay malinaw na tumutukoy sa titulo; hindi nagdaragdag ang salin ng doktrinang wala sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'Sa halip' para sa malinaw na kontrast, 'nang may pag-ibig' bilang natural na paraan ng pagsasabi, at em dash upang malinaw na ipakilala ang appositional na titulong 'ang Mesiyas.'
