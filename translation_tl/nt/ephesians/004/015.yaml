  rationale: Pinalitan ang “Sa halip” ng “Ngunit” upang maipakita ang banayad na kontrast ng δέ. Pinalitan ang “ipinahahayag natin” ng “sinasabi natin” upang huwag magdagdag ng diwang proklamasyon at upang mas malapit na maihatid ang kontekstuwal na diwa ng ἀληθεύοντες. Pinanatili ang talababa upang hindi maikulong ang pandiwa sa pananalita lamang. Inayos din ang literal na anyo sa talababa b sa mas natural na Filipino nang hindi binabago ang kahulugan.
