  text: Ἑνὶ δὲ ἑκάστῳ ἡμῶν ἐδόθη ⸀ἡ χάρις κατὰ τὸ μέτρον τῆς δωρεᾶς τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/007.yaml
  text: But grace was given to each one of us according to the measure of Messiah’s gift[a].
translation:
  language: tl
  text: Ngunit ang biyaya ay ibinigay sa bawat isa sa atin ayon sa sukat ng kaloob ng Mesiyas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “kaloob ni Cristo.” Ang titulong Griyego na Χριστοῦ ay maaaring isaling “Cristo” kapag ginagamit na halos tulad ng isang pangalan, ngunit dito ay pinananatili ng “Mesiyas” ang kahulugan ng titulo.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἑνὶ ... ἑκάστῳ ἡμῶν
  choice: sa bawat isa sa atin
  rationale: 'Pinananatili nito ang distributibo at mariing diwa ng ἑνὶ ... ἑκάστῳ: ang biyaya ay iniukol sa bawat indibidwal sa loob ng buong pamayanan.'
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig ng δέ ang banayad na paglipat mula sa pagkakaisa sa naunang talata tungo sa pagkakaiba-iba ng biyayang ipinagkaloob.
- source_word: ἐδόθη
  choice: ay ibinigay
  rationale: Tuwirang inilalarawan nito ang aorist passive bilang isang natapos na pagkakaloob, habang pinananatiling simuno ang biyaya gaya sa Griyego.
- source_word: ἡ χάρις
  choice: ang biyaya
  rationale: Pinananatili ng “biyaya” ang mahalagang bokabularyong teolohikal ni Pablo nang hindi nililimitahan ang kahulugan sa pagliligtas lamang; sa konteksto, kaugnay ito ng biyayang ipinagkakaloob para sa paglilingkod.
- source_word: κατὰ τὸ μέτρον
  choice: ayon sa sukat ng
  rationale: Ipinapahayag nito ang pamantayan o proporsiyong tinutukoy ng κατά kasama ang akusatibo, nang hindi ipinapakahulugang magkakapantay ang bahagi ng lahat.
- source_word: τῆς δωρεᾶς
  choice: kaloob
  rationale: Ang “kaloob” ay likas at marangal na katumbas ng δωρεά at malinaw na tumutukoy sa bagay na malayang ipinagkaloob.
- source_word: τοῦ Χριστοῦ
  choice: ng Mesiyas
  rationale: Dito ay pinananatili ang kahulugan ng Χριστός bilang titulo. Ang henitibo ay sadyang hindi nililinaw pa kung ito ay pag-aari, pinagmulan, o kaloob na ipinamahagi ng Mesiyas.
theological_decisions:
- issue: Kahulugan ng χάρις sa konteksto
  choice: “Biyaya,” na sa konteksto ay tumutukoy sa biyayang iniukol sa bawat isa para sa paglilingkod, ngunit hindi ito pinalitan ng mas makitid na paliwanag.
  alternative: “kaloob na kakayahan” o biyayang tumutukoy lamang sa kaligtasan
  rationale: Ang kasunod na konteksto ay tungkol sa magkakaibang kaloob at paglilingkod, ngunit ang simpleng “biyaya” ang pinakamahusay na nagpapanatili sa lawak at teolohikal na tensiyon ng salita ni Pablo.
- issue: Kahulugan ng henitibong τοῦ Χριστοῦ
  choice: “kaloob ng Mesiyas”
  alternative: “kaloob mula sa Mesiyas” o “kaloob na siyang Mesiyas”
  rationale: Hindi tahasang tinutukoy ng anyong henitibo ang eksaktong relasyon. Pinananatili ng “ng Mesiyas” ang tunay na kalabuan sa halip na ipasiya na ito ay tanging pinagmulan o nilalaman ng kaloob.
- issue: Pagsasalin ng Χριστοῦ
  choice: Mesiyas
  alternative: Cristo
  rationale: Sa talatang ito, malinaw pa ang tungkulin ng Χριστός bilang titulo; kaya inilalahad sa pangunahing teksto ang kahulugan nitong “Mesiyas,” habang itinatala ang tradisyonal na anyong “Cristo” sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang bahagyang pormal na ayos na “ang biyaya ay ibinigay” upang masundan ang diin ng Griyego sa biyayang ipinagkaloob, at ginamit ang “bawat isa sa atin” upang mapanatili ang indibidwal na diin.
