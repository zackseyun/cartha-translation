translation:
  language: tl
  text: Iisa ang Diyos at Ama ng lahat[a], na higit sa lahat, sa pamamagitan ng lahat, at nasa lahat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Ama ng bawat isa” o “Ama ng lahat ng bagay.” Walang tahasang pangngalan kasunod ng “lahat” sa Griyego.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring “nasa bawat isa.” Ganito ang ilang manuskrito: “nasa inyong lahat.”'
    reason: textual_variant
lexical_decisions:
- source_word: εἷς
  choice: iisa
  rationale: Pinananatili ang mariing bilang na kaugnay ng sunod-sunod na pagbanggit ng pagkakaisa sa konteksto; natural sa Filipino ang “iisa” para sa ganitong pahayag.
- source_word: θεὸς καὶ πατὴρ
  choice: Diyos at Ama
  rationale: Karaniwang salin ng mga banal na katawagan at pinananatili ang personal at relasyonal na paglalarawan.
- source_word: πάντων
  choice: ng lahat
  rationale: Hindi tinutukoy ng Griyego kung mga tao o mga bagay ang saklaw, kaya pinananatili ang malawak at hindi tiyak na “lahat.”
- source_word: ὁ ἐπὶ πάντων
  choice: na nasa ibabaw ng lahat
  rationale: Ipinahahayag ang kataasan o paghahari ng Diyos habang pinananatili ang maikling estruktura ng Griyego.
- source_word: διὰ πάντων
  choice: kumikilos sa pamamagitan ng lahat
  rationale: Ipinapahayag sa likas na Filipino ang diwa ng διά bilang daluyan o kasangkapan; idinagdag ang “kumikilos” bilang ipinahihiwatig na pandiwa upang maiwasan ang alanganing “sa pamamagitan ng lahat” lamang.
- source_word: ἐν πᾶσιν
  choice: nasa lahat
  rationale: Pinananatili ang paralelismo at ang hindi tahasang tinukoy na saklaw ng Griyego.
theological_decisions:
- issue: Saklaw ng paulit-ulit na πάντων / πᾶσιν
  choice: “lahat,” nang hindi nililimitahan sa mga tao, mananampalataya, o lahat ng bagay
  alternative: “lahat ng tao,” “lahat ng mananampalataya,” o “lahat ng bagay”
  rationale: Bagaman tungkol sa pagkakaisa ng iglesya ang agarang konteksto, walang tahasang pangngalan ang mga anyong Griyego. Pinananatili ng salin ang tunay na lawak at tensiyon ng pahayag.
- issue: Pagpapakahulugan sa διὰ πάντων
  choice: “kumikilos sa pamamagitan ng lahat”
  alternative: “dumaraan sa lahat” o literal na “sa pamamagitan ng lahat”
  rationale: Ang διά na may genitive ay maaaring magpahiwatig ng ahensiya o daluyan. Ang “kumikilos” ay isang minimal na pagpapalinaw sa Filipino, hindi pagtatakda ng mas makitid na doktrina.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “iisa” upang idiin ang temang pagkakaisa, at pinanatili ang tatlong magkakatugmang parirala tungkol sa “lahat.”
