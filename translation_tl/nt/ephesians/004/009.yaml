  text: What does “he ascended” mean except that he also descended into the lower parts of the earth?[a]
translation:
  language: tl
  text: Ano ang ibig sabihin ng “Umakyat siya” kundi bumaba rin siya sa mga mas mababang bahagi ng lupa?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga mas mababang dako, samakatuwid ay sa lupa”; maaaring tumukoy ang parirala sa pagbaba lamang sa lupa, o mas tiyak, sa daigdig ng mga patay.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀνέβη
  choice: Umakyat siya
  rationale: Pinananatili nito ang larawan ng paitaas na pagkilos at ang tuwirang pagtutulad sa κατέβη (“bumaba”). Ang aspektong aorist ay likas na naihahayag sa payak na pandiwang Filipino ayon sa konteksto.
- source_word: τί ἐστιν εἰ μὴ ὅτι
  choice: Ano ang ibig sabihin ... kundi
  rationale: Likas itong pahayag sa modernong Filipino para sa tanong na naghahayag ng isang kinakailangang hinuha, nang hindi mekanikal na ginagaya ang ayos ng Griyego.
- source_word: καὶ κατέβη
  choice: bumaba rin siya
  rationale: Ang “rin” ang nagpapanatili sa dagdag na diwa ng καί, habang ang “bumaba” ay malinaw na katapat ng “umakyat.”
- source_word: εἰς
  choice: sa
  rationale: Sa Filipino, ang “sa” ang likas na pananda ng patutunguhan sa ganitong pangungusap; ang diwa ng pagpasok o pagbaba patungo sa isang dako ay malinaw na mula sa pandiwa at sa kasunod na parirala.
- source_word: τὰ κατώτερα μέρη
  choice: mabababang bahagi
  rationale: Pinananatili nito ang maramihang “mga bahagi” at ang patayong larawan ng κατώτερα, nang hindi agad tinutukoy ang mga ito bilang ilalim ng lupa o daigdig ng mga patay.
- source_word: τῆς γῆς
  choice: ng lupa
  rationale: 'Karaniwang katumbas ng γῆ ang “lupa” at naiiwan nitong bukas ang kaugnayan ng genitive: maaaring mga mabababang bahagi ng lupa, o mabababang dako na ang tinutukoy ay ang lupa mismo.'
theological_decisions:
- issue: Kahulugan ng εἰς τὰ κατώτερα μέρη τῆς γῆς
  choice: Isinalin nang tuwiran bilang “sa mabababang bahagi ng lupa,” nang hindi tinutukoy kung ito ay lupa bilang kabaligtaran ng langit o ang daigdig ng mga patay.
  alternative: “sa mabababang dako, samakatuwid, sa lupa,” o isang tahasang pagtukoy sa daigdig ng mga patay
  rationale: Pinahihintulutan ng kayariang Griyego ang higit sa isang pagbasa. Pinananatili ng pangunahing teksto ang tunay na kalabuan at inilalahad sa talababa ang mahahalagang posibilidad, sa halip na magpasya para sa isang partikular na doktrinal na interpretasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasan ang panimulang “Ngayon” sapagkat walang tahasang salitang panahunan na katumbas nito sa Griyego. Ginamit ang magkatambal na “umakyat” at “bumaba” upang mapanatili ang pangunahing larawang patayo at ang lohika ng talata.
