  text: at patuloy na mabago sa espiritu ng inyong pag-iisip,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pamamagitan ng Espiritu ng inyong pag-iisip.” Gayunman, mas malamang na ang parirala ay tumutukoy sa panloob na disposisyon o oryentasyon ng inyong pag-iisip kaysa tuwirang sa Banal na Espiritu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνανεοῦσθαι
  choice: patuloy na mabago
  rationale: Ang present passive infinitive ay nagpapanatili sa diwang tumatanggap ng pagkilos at maaaring magpahiwatig ng nagpapatuloy na proseso. Likas sa modernong Tagalog ang “patuloy na mabago” sa hanay ng mga pahayag sa konteksto.
- source_word: δὲ
  choice: at
  rationale: Mahinang pang-ugnay ito sa magkakasunod na infinitive, kaya hindi kailangang gawing mariing pagsalungat na “ngunit.”
- source_word: τῷ πνεύματι
  choice: sa espiritu
  rationale: 'Pinananatili ang posibleng diwa ng saklaw o aspeto: nagaganap ang pagbabago sa “espiritu” ng pag-iisip. Hindi ginawang tahasang “Espiritu” upang hindi agad itakda na ang Banal na Espiritu ang tuwirang tinutukoy.'
- source_word: τοῦ νοὸς
  choice: ng ... pag-iisip
  rationale: Ang νοῦς ay tumutukoy sa isip, pang-unawa, o paraan ng pag-iisip. Mas natural dito sa Tagalog ang “pag-iisip” habang pinananatili ang ugnayang genitibo sa “espiritu.”
- source_word: ὑμῶν
  choice: inyong
  rationale: Ipinahihiwatig ng “inyong” ang maramihang ikalawang panauhan at ang pagmamay-ari.
theological_decisions:
- issue: Kung ang πνεύματι ay tumutukoy sa Banal na Espiritu o sa panloob na espiritu/disposisyon ng tao
  choice: “sa espiritu ng inyong pag-iisip,” na pangunahing nauunawaan bilang panloob na disposisyon o oryentasyon ng isip
  alternative: “sa pamamagitan ng Espiritu na kumikilos sa inyong pag-iisip” o “sa Espiritu ng inyong pag-iisip”
  rationale: Mas likas na inuugnay ng τοῦ νοὸς ὑμῶν ang “espiritu” sa isip ng mga kausap. Gayunman, hindi ganap na isinasara ng parirala ang posibilidad ng kaugnayan sa Banal na Espiritu, kaya inilalahad ang alternatibo sa talababa sa halip na ipasok sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “patuloy na” upang maipahayag nang natural ang posibleng nagpapatuloy na aspekto ng present infinitive, at pinanatili ang “espiritu ng inyong pag-iisip” upang huwag alisin ang tunay na kalabuan ng Griyego.
