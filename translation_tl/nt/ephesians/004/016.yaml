source:
  edition: SBLGNT
  text: ἐξ οὗ πᾶν τὸ σῶμα συναρμολογούμενον καὶ συμβιβαζόμενον διὰ πάσης ἁφῆς τῆς ἐπιχορηγίας κατ’ ἐνέργειαν ἐν μέτρῳ ἑνὸς ἑκάστου μέρους τὴν αὔξησιν τοῦ σώματος ποιεῖται εἰς οἰκοδομὴν ἑαυτοῦ ἐν ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/016.yaml
  text: from whom the whole body[a], being joined together and held together through every supporting joint, according to the working in measure of each individual part[d][c][b], causes the growth of the body for building itself up in love.
translation:
  language: tl
  text: Mula sa kanya, ang buong katawan ay pinag-uugnay at pinagbubuklod sa pamamagitan ng bawat dugtungang nagbibigay ng panustos.[a] Ayon sa pagkilos ng bawat bahagi sa sukat nito,[b] itinataguyod ng katawan ang paglago nito para sa pagpapatibay ng sarili nito sa pag-ibig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “sa pamamagitan ng bawat dugtungan ng panustos,” “bawat litid na sumusuporta,” o “bawat ugnayang nagbibigay ng panustos.”'
    reason: lexical_alternative
  - marker: b
    text: 'Mas literal: “ayon sa pagkilos sa sukat ng bawat isang bahagi.”'
    reason: source_ambiguity
lexical_decisions:
- source_word: ἐξ οὗ
  choice: Mula sa kanya
  rationale: Si Cristo ang personal na tinutukoy sa naunang talata; pinananatili nito na sa kanya nagmumula ang paglago ng katawan.
- source_word: πᾶν τὸ σῶμα
  choice: ang buong katawan
  rationale: Likas at malinaw na katumbas sa Tagalog ng kolektibong pariralang Griyego.
- source_word: συναρμολογούμενον καὶ συμβιβαζόμενον
  choice: ay pinag-uugnay at pinagbubuklod
  rationale: 'Pinananatili ang dalawang magkaugnay ngunit hindi lubos na magkaparehong larawan: ang wastong pag-uugnay ng mga bahagi at ang kanilang pagkakaisa.'
- source_word: διὰ πάσης ἁφῆς τῆς ἐπιχορηγίας
  choice: sa pamamagitan ng bawat dugtungang nagbibigay-suporta
  rationale: Pinananatili ang konkretong larawan ng katawan at ang diwa ng suportang ipinagkakaloob, nang hindi labis na tinutukoy kung kasukasuan, litid, o punto ng ugnayan ang eksaktong larawan.
- source_word: κατ’ ἐνέργειαν ἐν μέτρῳ ἑνὸς ἑκάστου μέρους
  choice: Habang gumagawa ang bawat bahagi ayon sa sukat nito
  rationale: Natural sa modernong Tagalog at pinananatili ang ideya ng aktibong ambag ng bawat bahagi ayon sa itinakda o angkop na sukat nito, nang hindi nagdaragdag ng salitang 'wasto' na hindi tahasang nasa Griyego.
- source_word: τὴν αὔξησιν τοῦ σώματος ποιεῖται
  choice: pinalalago ng katawan ang sarili nito
  rationale: Ipinahahayag nang natural na ang katawan ang tuwirang gumagawa o nagdudulot ng paglago nito, habang nananatiling malinaw mula sa simula ng talata na si Cristo ang pinagmumulan.
- source_word: εἰς οἰκοδομὴν ἑαυτοῦ
  choice: upang mapatatag
  rationale: Ang οἰκοδομή ay metaporikal na pagpapatibay o pagtatatag. Ang 'mapatatag' ay natural at marangal sa Tagalog, bagaman ang literal na larawan ng pagtatayo ay maaari ring gamitin.
- source_word: ἐν ἀγάπῃ
  choice: sa pag-ibig
  rationale: Direkta at karaniwang salin na angkop sa paulit-ulit na diin ng konteksto.
theological_decisions:
- issue: Ang pinagmumulan at gumaganap sa paglago ng katawan
  choice: Si Cristo ang pinagmumulan ng paglago, samantalang lumalago ang katawan sa sama-samang paggawa ng bawat bahagi.
  alternative: Ipakitang si Cristo lamang ang tuwirang gumaganap ng lahat ng paglago, o gawing impersonal ang tinutukoy ng ἐξ οὗ.
  rationale: Ang ἐξ οὗ ay tumutukoy kay Cristo sa talata 15, ngunit ang pandiwang ποιεῖται ay may 'buong katawan' bilang paksa. Pinananatili ng salin ang dalawang diin.
- issue: Kahulugan ng ἁφῆς τῆς ἐπιχορηγίας
  choice: Panatilihin ang konkretong larawan bilang 'dugtungang nagbibigay-suporta.'
  alternative: bawat kasukasuan na nagbibigay ng panustos; bawat litid na sumusuporta; bawat ugnayang nagbibigay-suporta
  rationale: Maaaring tumukoy ang parirala sa dugtungan, litid, o ugnayang nagsusuplay. Ang napiling salin ay nagpapanatili ng larawang pangkatawan at ng diwa ng suporta nang hindi labis na nililimitahan ang kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Hinati sa dalawang pangungusap ang mahabang estrukturang Griyego upang luminaw ang ugnayan ng mga sugnay, habang pinananatili ang talinghaga ng katawan at ang tensiyon sa pagitan ni Cristo bilang pinagmumulan at ng katawan bilang aktibong lumalago.
