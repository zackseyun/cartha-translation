- from: Mula sa kanya, ang buong katawan ay pinag-uugnay at pinagbubuklod sa pamamagitan ng bawat dugtungang nagbibigay-suporta.[a] Habang gumagawa ang bawat bahagi ayon sa sukat nito,[b] pinalalago ng katawan ang sarili nito upang mapatatag sa pag-ibig.
  to: Mula sa kanya, ang buong katawan ay pinag-uugnay at pinagbubuklod sa pamamagitan ng bawat dugtungang nagbibigay ng panustos.[a] Ayon sa pagkilos ng bawat bahagi sa sukat nito,[b] itinataguyod ng katawan ang paglago nito para sa pagpapatibay ng sarili nito sa pag-ibig.
  rationale: Inalis ang temporal na “Habang” at pinalitan ng “Ayon sa” upang tumpak na maipakita ang κατ’ ἐνέργειαν ἐν μέτρῳ. Pinalitan ang “upang mapatatag” ng “para sa pagpapatibay ng sarili nito” upang maingatan ang layunin, ang reflexive na sanggunian, at ang metapora ng οἰκοδομή. Pinanatili ang maingat na malawak na pananalita para sa kontrobersiyal na larawang anatomikal.
