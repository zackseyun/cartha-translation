  yaml_path: translation/nt/ephesians/004/021.yaml
  text: if indeed you heard him and were taught in him[a], just as truth is in Jesus[b],
translation:
  language: tl
  text: kung talagang narinig ninyo siya[a] at naturuan kayo sa kanya, kung paanong ang katotohanan ay nasa kay Jesus,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “narinig ninyo ang tungkol sa kanya.” Mas literal sa Griyego ang “narinig ninyo siya,” na malamang ay nagpapahiwatig na sa mensaheng ipinangaral ng mga apostol ay tunay nilang narinig si Cristo mismo.
    reason: alternative_reading
  - marker: b
    text: Ang “sa kanya” at “kay Jesus” ay maaaring tumukoy sa saklaw, pakikipag-isa, o malapit na kaugnayan; mas malawak ang maaaring kahulugan ng Griyego kaysa sa simpleng “sa pamamagitan niya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ γε
  choice: kung talagang
  rationale: Pinananatili nito ang pasubaling anyo at banayad na pagdidiin ng γε, habang natural sa modernong Tagalog at hindi ginagawang tahasang sanhi na gaya ng “yamang.”
- source_word: αὐτὸν ἠκούσατε
  choice: narinig ninyo siya
  rationale: Tuwirang layon ang αὐτόν, kaya pinananatili ang kapansin-pansing diwang personal na narinig nila siya, sa halip na agad itong gawing “narinig ninyo ang tungkol sa kanya.”
- source_word: ἐν αὐτῷ
  choice: sa kanya
  rationale: Ang “sa kanya” ay likas na katumbas sa Tagalog na nag-iiwan ng posibilidad ng saklaw, pakikipag-isa, o malapit na kaugnayan; hindi ito nililimitahan sa ahensiyang ipinahihiwatig ng “niya.”
- source_word: ἐδιδάχθητε
  choice: naturuan kayo
  rationale: Natural at tuwirang ipinapahayag nito ang aorist passive na “were taught” sa modernong Tagalog.
- source_word: καθώς
  choice: ayon sa
  rationale: Sa pangungusap na ito, natural na iniuugnay ng “ayon sa” ang pagtuturo sa katotohanang matatagpuan kay Jesus, nang hindi labis na pinabibigat ang paghahambing.
- source_word: ἀλήθεια
  choice: katotohanan
  rationale: Pinananatili ang anarthrous na pangngalan bilang “katotohanan,” hindi ipinapasok ang anumang paliwanag na gaya ng “realidad.”
- source_word: ἐν τῷ Ἰησοῦ
  choice: nasa kay Jesus
  rationale: Pinananatili ang personal na pangalang “Jesus” at ang lokatibo o relasyonal na lawak ng ἐν, sa natural na anyong Tagalog.
theological_decisions:
- issue: Kung ang αὐτὸν ἠκούσατε ay dapat gawing mas idyomatikong “narinig ninyo ang tungkol sa kanya” o tuwirang “narinig ninyo siya.”
  choice: narinig ninyo siya
  alternative: narinig ninyo ang tungkol sa kanya
  rationale: Pinapaboran ng tuwirang layon sa Griyego ang “narinig ninyo siya.” Pinananatili rin nito ang diwang sa mensaheng apostoliko ay si Cristo mismo ang tunay nilang narinig, nang hindi ginagawang tahasan ang implikasyong iyon sa pangunahing teksto.
- issue: Kung paano isasalin ang magkasunod na ἐν αὐτῷ at ἐν τῷ Ἰησοῦ.
  choice: sa kanya / nasa kay Jesus
  alternative: sa pamamagitan niya / kaisa ni Jesus
  rationale: Pinananatili ng mga piniling anyo ang malawak na posibilidad ng saklaw, pakikipag-isa, at malapit na kaugnayan sa halip na lutasin ang mga parirala bilang simpleng ahensiya lamang.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kung talagang” para sa natural na retorikal na kondisyon, at pinanatili sa abot ng natural na Tagalog ang kapansin-pansing personal at relasyonal na mga pahayag ng Griyego.
