base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/003.yaml
  text: making every effort to keep the unity of the Spirit in the bond of peace[a][b].
translation:
  language: tl
  text: na buong sikap[a] ninyong panatilihin ang pagkakaisa ng Espiritu[b] sa buklod ng kapayapaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “na maging masigasig sa pagpapanatili” o “na puspusang pagsikapang panatilihin.”
    reason: lexical_alternative
  - marker: b
    text: Ang “Espiritu” ay malamang na tumutukoy dito sa Banal na Espiritu, bagaman inuunawa ito ng ilan sa mas pangkalahatang paraan bilang espiritu o sama-samang diwa ng mga mananampalataya.
    reason: alternative_reading
lexical_decisions:
- source_word: σπουδάζοντες
  choice: na buong sikap
  rationale: Ipinahahayag nito ang masigasig at aktibong pagsisikap ng kasalukuyang pandiwaring Griyego, habang pinananatili ang ugnayan nito sa daloy ng pangungusap sa mga naunang talata.
- source_word: τηρεῖν
  choice: na pinananatili
  rationale: Ipinakikita ng “pinananatili” na ang pagkakaisa ay umiiral na at kailangang ingatan, hindi pa lamang lilikhain.
- source_word: ἑνότητα
  choice: pagkakaisa
  rationale: Ito ang likas at malinaw na katumbas sa modernong Tagalog para sa pagkakaisang tinutukoy sa konteksto ng mga mananampalataya.
- source_word: τοῦ πνεύματος
  choice: ng Espiritu
  rationale: Pinakamalamang na tumutukoy ito sa Banal na Espiritu ayon sa konteksto ng Efeso; pinananatili rin ng anyong “ng Espiritu” ang di-tiyak na relasyon ng genitive.
- source_word: ἐν
  choice: sa
  rationale: Ang “sa” ay natural na katumbas na maaaring magpahayag ng kalagayan o paraang kinasasangkutan ng buklod ng kapayapaan.
- source_word: συνδέσμῳ
  choice: buklod
  rationale: Pinananatili ng “buklod” ang larawan ng isang bagay na nagbibigkis at karaniwang nauunawaan sa marangal na modernong Tagalog.
- source_word: τῆς εἰρήνης
  choice: ng kapayapaan
  rationale: Tuwirang pinananatili nito ang genitive at ang larawan ng kapayapaan bilang nagbibigkis.
theological_decisions:
- issue: Ang tinutukoy ng πνεύματος
  choice: ang Banal na Espiritu
  alternative: espiritu ng tao o sama-samang diwa ng mga mananampalataya
  rationale: Malakas na itinuturo ng kalapit na konteksto sa Efeso 4:4 at 4:30 ang Banal na Espiritu, ngunit itinatala sa talababa ang mas pangkalahatang posibleng pagbasa.
- issue: Kalagayan ng pagkakaisa
  choice: pagkakaisang umiiral na at dapat panatilihin
  alternative: pagkakaisang kailangang likhain ng mga mananampalataya
  rationale: Ang τηρεῖν ay nangangahulugang panatilihin o ingatan ang isang umiiral na bagay, hindi likhain ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ang pambungad na “na” ay sadyang nagpapanatili sa anyong umaasa sa naunang daloy ng pangungusap sa Efeso 4:1–2, sa halip na gawing hiwalay na tahasang utos ang pandiwari.
