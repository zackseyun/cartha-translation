  text: and do not give place to the devil[a].
translation:
  language: tl
  text: At huwag ninyong bigyan ng pagkakataon ang diyablo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “huwag kayong magbigay ng lugar sa diyablo”; maaari ring “puwang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲ
  choice: At huwag
  rationale: Ipinagpapatuloy nito ang naunang tagubilin at natural na naghahatid ng kasunod na pagbabawal sa Filipino.
- source_word: δίδοτε
  choice: bigyan
  rationale: Tuwirang katumbas ito ng pandiwang ‘magbigay’ at natural na kaagapay ng ‘pagkakataon’ sa Filipino.
- source_word: τόπον
  choice: pagkakataon
  rationale: Literal itong ‘lugar,’ ngunit sa idyomang ito ay tumutukoy sa puwang o pagkakataong makakilos; malinaw ang ‘pagkakataon’ nang hindi ipinapasok ang mas tiyak na larawang ‘tuntungan.’
- source_word: τῷ διαβόλῳ
  choice: ang diyablo
  rationale: Sa kontekstong ito, ang may artikulong διάβολος ay tumutukoy sa personal na masamang kalaban, kaya ang karaniwang katawagang ‘diyablo’ ang angkop.
theological_decisions:
- issue: Kung ang διάβολος ay karaniwang pangngalang ‘maninirang-puri’ o katawagan sa personal na masamang nilalang
  choice: ang diyablo
  alternative: ang maninirang-puri
  rationale: Sa ganitong konteksto ng mga tagubilin ni Pablo, malamang na tumutukoy ito sa personal na kalaban, hindi lamang sa isang taong naninirang-puri.
translation_notes:
  register: Makabagong, malinaw, at marangal na Filipino. Ginamit ang pangmaramihang ‘ninyong’ upang maipakita ang anyong pangmaramihan ng utos; pinanatili sa talababa ang literal na larawan ng τόπον.
