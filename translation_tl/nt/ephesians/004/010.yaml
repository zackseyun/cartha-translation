  text: ὁ καταβὰς αὐτός ἐστιν καὶ ὁ ἀναβὰς ὑπεράνω πάντων τῶν οὐρανῶν, ἵνα πληρώσῃ τὰ πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/010.yaml
  text: The one who descended is himself also the one who ascended far above all the heavens[b][a], so that he might fill all things.
translation:
  language: tl
  text: Ang bumaba ay siya ring umakyat nang higit sa lahat ng kalangitan[a], upang punuin niya ang lahat ng bagay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa ibabaw ng lahat ng kalangitan.” Maaaring idiin ng parirala ang kanyang kadakilaan sa ibabaw ng bawat makalangit na dako.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “upang tuparin niya ang lahat ng bagay.” Sa ilang konteksto, ang pandiwang Griyego ay maaaring mangahulugang “tuparin,” ngunit mas angkop dito ang “punuin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ καταβὰς
  choice: Ang bumaba
  rationale: Ang articular aorist participle ay substantibo; natural sa modernong Tagalog ang payak na sugnay na “Ang bumaba.”
- source_word: αὐτός ἐστιν καὶ
  choice: ay siya ring
  rationale: 'Pinananatili ng “siya ring” ang diin sa pagkakakilanlan: ang bumaba at ang umakyat ay iisang persona.'
- source_word: ὁ ἀναβὰς
  choice: umakyat
  rationale: Kaagapay ito ng “bumaba” at malinaw na tumutukoy sa siya ring persona nang hindi inuulit nang mabigat ang “ang siyang.”
- source_word: ὑπεράνω
  choice: nang higit na mataas kaysa sa
  rationale: Ipinahahayag nito kapuwa ang lokasyong nasa itaas at ang matinding diwa ng pagkaluklok o kadakilaan, sa likas na Tagalog.
- source_word: πάντων τῶν οὐρανῶν
  choice: lahat ng kalangitan
  rationale: Pinananatili ang malawak at maramihang saklaw ng Griyego; sa Tagalog, ang “kalangitan” ay likas na kolektibong katawagan sa mga makalangit na dako.
- source_word: ἵνα
  choice: upang
  rationale: Malinaw at marangal na panandang Tagalog para sa layuning ipinakikilala ng ἵνα.
- source_word: πληρώσῃ
  choice: punuin niya
  rationale: Ang pangunahing diwa rito ay “punuin,” hindi tahasang “tuparin”; ang anyong may “upang” ay likas na naghahayag ng layunin.
- source_word: τὰ πάντα
  choice: ang lahat ng bagay
  rationale: Pinananatili ang malawak na saklaw ng parirala nang hindi ito nililimitahan sa mga tao o ipinapakahulugang tahasan bilang sansinukob.
theological_decisions:
- issue: Pagkakakilanlan ng bumaba at umakyat
  choice: “ay siya ring” upang idiin na iisang persona ang tinutukoy
  alternative: Isang hindi gaanong madiing pagkakasabi na basta nag-uugnay lamang sa pagbaba at pag-akyat
  rationale: Ang αὐτός at ang magkatulad na articular participle ay tahasang nagdiriin na ang bumaba ay siya ring umakyat; pinananatili ito nang walang idinaragdag na paliwanag sa talata.
- issue: Saklaw ng τὰ πάντα
  choice: “ang lahat ng bagay”
  alternative: “lahat ng tao” o “ang buong sansinukob”
  rationale: Malawak ang pariralang Griyego. Iniiwasan ng salin na paliitin o palawakin ito sa paraang lulutas sa sadyang lawak ng pahayag.
- issue: Kahulugan ng πληρόω
  choice: “punuin”
  alternative: “tuparin”
  rationale: Mas angkop sa agarang konteksto ang diwang pagpuno, ngunit kinikilala sa talababa ang tunay na leksikal na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “siya ring” upang likas na maipahayag ang emphatic αὐτός, at “kalangitan” upang maiwasan ang mas kolokyal o mas makitid na “langit” habang pinananatili ang kosmolohikal na lawak.
