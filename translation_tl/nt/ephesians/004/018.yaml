  naturalness: Likas, malinaw, at marangal ang daloy sa makabagong Filipino Tagalog. Ang maramihang “kanilang mga puso” ay natural sa Tagalog, habang wastong ipinaliliwanag ng talababa ang isahang anyo sa Griyego.
  terminology: Ang “pang-unawa,” “buhay ng Diyos,” “kamangmangan,” at “katigasan” ay angkop at magkakatugma sa rehistro. Gayunman, kailangang isama ng alternatibo sa talababa b ang “ng Diyos”; kung wala ito, maaaring magpahiwatig ang “napagkaitan ng buhay” ng literal na pagkamatay sa halip na pagkakahiwalay mula sa buhay ng Diyos.
