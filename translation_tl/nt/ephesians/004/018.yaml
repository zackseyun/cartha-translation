source:
  edition: SBLGNT
  text: ⸀ἐσκοτωμένοι τῇ διανοίᾳ ὄντες, ἀπηλλοτριωμένοι τῆς ζωῆς τοῦ θεοῦ, διὰ τὴν ἄγνοιαν τὴν οὖσαν ἐν αὐτοῖς, διὰ τὴν πώρωσιν τῆς καρδίας αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/018.yaml
  text: being darkened in their understanding[a], alienated from the life of God because of the ignorance that is in them, because of the hardness of their hearts[e][d][c][b],
translation:
  language: tl
  text: Nadiliman ang kanilang pang-unawa[a], at nahiwalay sila sa buhay ng Diyos[b][c] dahil sa kamangmangang nasa kanila, dahil sa katigasan[d] ng kanilang mga puso[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isip” sa halip na “pang-unawa” (διανοίᾳ).
    reason: lexical_alternative
  - marker: b
    text: O “napagkaitan ng buhay ng Diyos” sa halip na “nahiwalay sa buhay ng Diyos.”
    reason: lexical_alternative
  - marker: c
    text: Ang “buhay ng Diyos” ay maaaring mangahulugang buhay na taglay ng Diyos o buhay na nagmumula sa Diyos.
    reason: alternative_reading
  - marker: d
    text: O “pamamanhid” sa halip na “katigasan” (πώρωσις).
    reason: lexical_alternative
  - marker: e
    text: Sa Griyego, isahan ang “puso,” bagaman maramihan ang mga taong tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκοτωμένοι
  choice: Nadiliman
  rationale: Ipinahahayag ng ganap na balintiyak na pandiwaring Griyego ang isang kalagayang bunga ng naunang pangyayari. Likas sa Tagalog ang “nadiliman” at pinananatili nito ang diwang balintiyak nang hindi nagiging mabigat ang pangungusap.
- source_word: τῇ διανοίᾳ
  choice: ang kanilang pang-unawa
  rationale: Maaaring tumukoy ang διάνοια sa isip, pag-iisip, o pang-unawa. Ang “pang-unawa” ay malinaw na naghahatid ng kakayahang umunawa at akma sa diwang “nadiliman.”
- source_word: ἀπηλλοτριωμένοι
  choice: nahiwalay sila
  rationale: Naglalarawan ito ng patuloy na kalagayan ng pagkakalayo o pagkakahiwalay. Ang “nahiwalay” ay likas at hindi nililimitahan ang kahulugan sa pormal o legal na pagkakait.
- source_word: τῆς ζωῆς τοῦ θεοῦ
  choice: sa buhay ng Diyos
  rationale: Pinananatili ng pariralang ito ang genitibong kayarian at ang tunay na kalabuan kung ito ba ay buhay na taglay ng Diyos o buhay na nagmumula sa Diyos.
- source_word: διὰ τὴν ἄγνοιαν τὴν οὖσαν ἐν αὐτοῖς
  choice: dahil sa kamangmangang nasa kanila
  rationale: Ipinahahayag ng διά na may akusatibo ang sanhi, at tuwirang inilalarawan ng kasunod na parirala na nasa loob nila ang kamangmangan.
- source_word: διὰ τὴν πώρωσιν
  choice: dahil sa katigasan
  rationale: Ang πώρωσις ay tumutukoy sa katigasan o kawalan ng pakiramdam. Pinananatili ng “katigasan” ang talinghaga at karaniwan itong nauunawaan kapag iniuugnay sa puso.
- source_word: τῆς καρδίας αὐτῶν
  choice: ng kanilang mga puso
  rationale: Bagaman isahan ang καρδίας sa Griyego, maramihan ang tinutukoy ng αὐτῶν. Ang “kanilang mga puso” ang higit na likas sa modernong Tagalog at malinaw na tumutukoy sa kalooban ng bawat isa.
theological_decisions:
- issue: Kahulugan ng “buhay ng Diyos”
  choice: Panatilihin ang “buhay ng Diyos” nang hindi tinutukoy kung ito ay buhay na taglay ng Diyos o buhay na nagmumula sa Diyos.
  alternative: “buhay na nagmumula sa Diyos” o “sariling buhay ng Diyos”
  rationale: Pinahihintulutan ng genitibong pariralang Griyego ang dalawang magkaugnay na pakahulugan. Hindi dapat lutasin sa salin ang tunay na kalabuang iniwan ng teksto.
- issue: Isahang “puso” na may maramihang tinutukoy
  choice: Gamitin sa pangunahing teksto ang likas na Tagalog na “kanilang mga puso.”
  alternative: “kanilang puso”
  rationale: Isahan ang anyong Griyego ngunit kolektibo o kinatawan ang gamit nito. Hindi nababago ng maramihang Tagalog ang antropolohikal na diwa ng puso bilang panloob na pagkatao, at iniiwasan nito ang di-likas na pagpapahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang ugnayang sanhi sa dalawang “dahil,” ang talinghaga ng pagdidilim at katigasan, at ang kalabuan ng “buhay ng Diyos,” habang ginawang likas ang daloy para sa karaniwang mambabasang Filipino.
