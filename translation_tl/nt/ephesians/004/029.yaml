  to: Huwag lumabas mula sa inyong bibig ang anumang bulok na salita[a], kundi ang mabuting salita lamang na para sa pagpapatibay ayon sa pangangailangan[b], upang magbigay ito ng biyaya sa mga nakikinig[c].
