  naturalness: Mas natural at malinaw sa modernong Filipino Tagalog ang “Huwag lumabas mula sa inyong bibig ang anumang bulok na salita” kaysa “Huwag kayong magsalita ng anumang bulok.” Ang “upang magbigay ito” ay mas tuwirang layon kaysa sa modal na “upang makapagbigay ito.”
