  text: πᾶς λόγος σαπρὸς ἐκ τοῦ στόματος ὑμῶν μὴ ἐκπορευέσθω, ἀλλὰ εἴ τις ἀγαθὸς πρὸς οἰκοδομὴν τῆς χρείας, ἵνα δῷ χάριν τοῖς ἀκούουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/029.yaml
  text: Let no rotten word come out of your mouth[a], but only such as is good for building up according to the need[d][c][b], so that it may give grace to those who hear.
translation:
  language: tl
  text: Huwag lumabas mula sa inyong bibig ang anumang bulok na salita[a], kundi ang mabuting salita lamang na para sa pagpapatibay ayon sa pangangailangan[b], upang magbigay ito ng biyaya sa mga nakikinig[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “anumang bulok na salita.” Maaari ring “anumang masama o nakapipinsalang pananalita.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “para sa pagpapatibay ayon sa hinihingi ng pangangailangan” o “para sa pagpapatibay na angkop sa pagkakataon.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “upang magbigay ito ng kapakinabangan sa mga nakikinig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς λόγος σαπρὸς
  choice: anumang bulok
  rationale: Sa ilalim ng pagbabawal, ang πᾶς na may pang-isahang λόγος ay nangangahulugang walang anumang gayong pananalita. Pinananatili ng “bulok” ang matingkad na metapora ng σαπρός, habang nauunawaan sa pandiwang “magsalita” na pananalita ang tinutukoy.
- source_word: ἐκ τοῦ στόματος ὑμῶν μὴ ἐκπορευέσθω
  choice: Huwag kayong magsalita
  rationale: Natural itong pagbabawal sa modernong Tagalog. Hindi man literal na inuulit ang larawang lumalabas mula sa bibig, malinaw at tuwiran nitong ipinahahayag ang pananalitang nagmumula sa tao.
- source_word: ἀλλὰ εἴ τις ἀγαθὸς
  choice: kundi ng mabuti lamang
  rationale: 'Pinupunan nito nang natural sa Tagalog ang elipsis ng Griyego at pinananatili ang malinaw na pagsalungat: hindi bulok na pananalita, kundi mabuti lamang.'
- source_word: πρὸς οἰκοδομὴν
  choice: na makapagpapatibay
  rationale: Ipinahahayag nito sa karaniwang Tagalog ang metaporikal na diwa ng pagtatayo o pagpapatatag ng kapwa, nang hindi gumagamit ng di-pamilyar na terminong panrelihiyon.
- source_word: τῆς χρείας
  choice: ayon sa pangangailangan
  rationale: 'Pinananatili nito ang siksik at bahagyang malabong ugnayan ng genitibo: ang mabuting pananalita ay nagpapatibay ayon sa umiiral na pangangailangan.'
- source_word: ἵνα δῷ χάριν
  choice: upang makapagbigay ito ng biyaya
  rationale: Pinananatili ng “biyaya” ang malawak na saklaw ng χάρις—kagandahang-loob, pabor, o kapakinabangan—at ang natatanging bokabularyo ni Pablo, nang hindi nililimitahan sa praktikal na pakinabang lamang.
- source_word: τοῖς ἀκούουσιν
  choice: sa mga nakikinig
  rationale: Ang kasalukuyang partisípyo ay tumutukoy sa mga aktuwal na nakikinig; natural at malinaw ito sa modernong Tagalog.
theological_decisions:
- issue: Kahulugan ng χάριν sa konteksto ng etikal na tagubilin
  choice: biyaya
  alternative: kapakinabangan; kabutihan
  rationale: Maaaring tumukoy ang χάρις sa kapakinabangang naibibigay ng pananalita, ngunit pinananatili ng “biyaya” ang teolohikal at relasyonal na taginting ng salita nang hindi ipinipilit ang isang mas tiyak na doktrinal na kahulugan.
- issue: Ugnayan ng οἰκοδομὴν at τῆς χρείας
  choice: makapagpapatibay ayon sa pangangailangan
  alternative: makapagpapatibay kapag kailangan; makapagpapatibay ayon sa hinihingi ng pagkakataon
  rationale: Siksik at hindi ganap na tiyak ang ugnayang gramatikal. Pinananatili ng salin ang “pangangailangan” at hindi ito tahimik na pinapalitan ng “pagkakataon.”
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang pangmaramihang “kayo” upang tumugma sa ὑμῶν. Pinanatili ang matingkad na metaporang “bulok” at ang teolohikal na salitang “biyaya,” habang inilagay sa mga talababa ang mas interpretibong alternatibo.
