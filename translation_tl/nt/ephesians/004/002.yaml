  text: nang may buong kapakumbabaan at kahinahunan, nang may matiyagang pagtitimpi, na nagpaparaya sa isa’t isa sa pag-ibig,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ πάσης
  choice: nang may buong
  rationale: Ang μετά na may genitive ay nagpapahayag ng kasamang katangian, at pinatitindi ng πάσης ang lawak nito. Likas sa modernong Tagalog ang “nang may buong” sa ganitong sunod-sunod na paglalarawan.
- source_word: ταπεινοφροσύνης
  choice: kapakumbabaan
  rationale: Tumutukoy ito sa mapagpakumbabang pag-iisip o asal. Malinaw, marangal, at karaniwan sa kasalukuyang Tagalog ang “kapakumbabaan.”
- source_word: πραΰτητος
  choice: kahinahunan
  rationale: Ipinahihiwatig ng salita ang maamong pagpipigil at hindi kahinaan. Napananatili ng “kahinahunan” ang diwa ng mahinahon at kontroladong pakikitungo.
- source_word: μακροθυμίας
  choice: pagtitiis
  rationale: Tumutukoy ito sa matagal na pagtitimpi at hindi madaling pagkagalit, lalo na sa pakikitungo sa kapwa. Ang “pagtitiis” ay natural at sapat ang lawak sa konteksto.
- source_word: ἀνεχόμενοι
  choice: nagtitiis sa
  rationale: Ang present participle ay naglalarawan ng patuloy na pagpaparaya at pagtitiis sa kapwa. Pinananatili ng “nagtitiis sa” ang aspektong nagpapatuloy at ang kaugnayan nito sa kasunod na “isa’t isa.”
- source_word: ἀλλήλων
  choice: isa’t isa
  rationale: Ito ang karaniwang natural na katumbas ng reciprocal pronoun sa Tagalog.
- source_word: ἐν ἀγάπῃ
  choice: sa pag-ibig
  rationale: Direktang pinananatili nito ang ἐν at ang pag-ibig bilang kalagayan o paraan ng pagtitiis sa isa’t isa, nang hindi nililimitahan sa isang tiyak na ugnayang lohikal gaya ng sanhi.
theological_decisions:
- issue: Pagpapakahulugan sa ἐν ἀγάπῃ
  choice: sa pag-ibig
  alternative: dahil sa pag-ibig / nang may pag-ibig
  rationale: Maaaring ipahiwatig ng ἐν ang kalagayan o paraan. Pinananatili ng “sa pag-ibig” ang sadyang maluwag na ugnayan at hindi ito tahasang ginagawang sanhi.
- issue: Paglalarawan sa πραΰτης
  choice: kahinahunan
  alternative: kaamuan
  rationale: Parehong posible ang dalawang salita, ngunit mas malinaw sa karaniwang mambabasa ang “kahinahunan” bilang maamong pagpipigil, nang hindi ipinahihiwatig na ang birtud ay simpleng pagiging mahina.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang anyong parirala at participle ng Griyego dahil karugtong ang talata sa naunang pangungusap. Ang bahagyang pag-uulit ng “pagtitiis/nagtitiis” ay sumasalamin sa magkaibang ngunit magkaugnay na mga salitang μακροθυμία at ἀνέχομαι.
