review_pass:
  verdict: revise
  source_fidelity: 'Ang pangunahing diwa ay tapat sa Griyego: inferensiya, pagtalikod sa kasinungalingan, utos na magsalita ng totoo, dahilan, at larawan ng magkakaugnay na mga bahagi. Gayunman, ang "sa kanyang kapwa" ay mas madaling basahing ''tungkol sa/para sa kanyang kapwa'' kaysa sa associative na μετά (''kasama ng/sa pakikitungo sa'').'
  naturalness: Makabago at marangal ang daloy, ngunit mas natural at mas malinaw ang "magsalita ng katotohanan ang bawat isa sa kanyang kapwa" para sa utos na may distributibong paksa. Ang "sa kanyang kapwa" ay katanggap-tanggap sa Filipino kapag ang kahulugang pakikitungo ay malinaw sa pandiwa, ngunit ang "sa pakikitungo sa kanyang kapwa" ay ligtas na nililinaw ang relational force nang hindi nagpapalawak ng diwa.
  terminology: Ang "kasinungalingan" at "katotohanan" ay angkop na magkatapat. Ang "mga bahagi tayo ng isa't isa" ay nauunawaan ngunit medyo mahina ang katawan-metaporang μέλη; "mga sangkap tayo ng isa't isa" ay mas malinaw na metaporikal sa Filipino, subalit maaari ring magtunog teknikal. Mananatili ang "mga bahagi" dahil sapat itong tapat at hindi nagdaragdag ng 'katawan.'
  issues:
  - severity: medium
    issue: Ang pariralang "sa kanyang kapwa" ay hindi malinaw na kumakatawan sa μετὰ τοῦ πλησίον αὐτοῦ.
    rationale: Ang μετά na may genitive ay nangangahulugang pakikisama o pakikitungo ('with'). Sa Tagalog, ang hubad na "magsalita ... sa kanyang kapwa" ay maaaring mangahulugang pagsasalita na nakatuon sa kapwa, ngunit hindi gaanong malinaw ang ugnayang 'with.' Ang pagdaragdag ng "sa pakikitungo" ay natural na paglilinaw ng idiomatikong saklaw ng pandiwa.
  - severity: low
    issue: Ang talababa ay hindi tumutugma sa audit-trail alternative.
    rationale: Inililista ng English audit trail ang posibleng "the lie," samantalang ang "ang kabulaanan" ay higit na malapit sa pangunahing "falsehood" at hindi maipinapakita ang articular na alternatibong 'ang kasinungalingang iyon/ang kasinungalingan.' Mas mabuting panatilihin ang isang malinaw na pormal na alternatibo nang hindi inaangking tiyak ang kahulugan.
  revised_text: Kaya, yamang iwinaksi na ninyo ang kasinungalingan,[a] magsalita ng katotohanan ang bawat isa sa pakikitungo sa kanyang kapwa, sapagkat mga bahagi tayo ng isa't isa.
  revised_footnotes:
