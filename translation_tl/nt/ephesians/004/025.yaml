  revision_rationale: Inayos ang katumbas ng μετά upang malinaw na maihatid ang kahulugang pakikitungo o pakikisama sa kapwa. Inayos din ang talababa upang magbigay ng aktuwal na pormal na alternatibo para sa articular singular nang hindi binabago ang malawak na etikong saklaw na mas malamang sa konteksto. Napanatili ang aorist na pagtalikod sa pamamagitan ng "yamang iwinaksi na ninyo," ang distributibong utos, at ang maigsi ngunit matalinghagang μέλη.
