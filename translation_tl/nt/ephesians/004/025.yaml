  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Διὸ ἀποθέμενοι τὸ ψεῦδος λαλεῖτε ἀλήθειαν ἕκαστος μετὰ τοῦ πλησίον αὐτοῦ, ὅτι ἐσμὲν ἀλλήλων μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/025.yaml
  text: Therefore[a], having put away falsehood, let each one speak truth with his neighbor, because we are members of one another.
translation:
  language: tl
  text: Kaya, yamang iwinaksi na ninyo ang kasinungalingan,[a] magsalita ng katotohanan ang bawat isa sa pakikitungo sa kanyang kapwa, sapagkat mga bahagi tayo ng isa't isa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang kasinungalingan.”
    reason: Maaaring panatilihin ng articular singular na τὸ ψεῦδος ang mas tiyak na anyong “ang kasinungalingan,” bagaman ang pangunahing salin ay tumutukoy rito bilang pangkalahatang bisyo.
lexical_decisions:
- source_word: Διὸ
  choice: Kaya
  rationale: Likas at malinaw na pang-ugnay sa makabagong Tagalog na nagpapanatili sa lohikal na bunga ng naunang pangangaral.
- source_word: ἀποθέμενοι
  choice: yamang iwinaksi na ninyo
  rationale: Ipinahihiwatig ang pagtalikod sa isang dating gawain at iniuugnay ito bilang saligan ng pangunahing utos; ang “na” ay nagpapakita ng aspektong ganap ng aorist nang hindi ginagawang hiwalay na utos ang participle.
- source_word: τὸ ψεῦδος
  choice: ang kasinungalingan
  rationale: Tumutukoy sa kabulaanan o pagsisinungaling bilang pangkalahatang masamang gawi sa konteksto, habang pinananatili sa talababa ang mas literal na posibleng basa.
- source_word: λαλεῖτε ... ἕκαστος
  choice: magsalita ang bawat isa
  rationale: Pinagsasama ang pangmaramihang utos at ang distributibong diin ng ἕκαστος sa natural na Tagalog.
- source_word: ἀλήθειαν
  choice: ng katotohanan
  rationale: Tuwirang katumbas na nagpapanatili sa malinaw na pagsalungat sa kasinungalingan.
- source_word: μετὰ τοῦ πλησίον αὐτοῦ
  choice: sa kanyang kapwa
  rationale: Ang “kapwa” ay likas na etikong katawagan sa taong kaugnay ng bawat isa; ipinananatili ng “kanyang” ang distributibong isahan ng Griyego.
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw na nagpapakilala sa dahilan ng utos sa isang marangal ngunit kasalukuyang rehistro.
- source_word: ἐσμὲν ἀλλήλων μέλη
  choice: mga bahagi tayo ng isa’t isa
  rationale: Pinananatili ang talinghaga ng magkakaugnay na mga bahagi ng isang katawan at ang kapwa pag-aari o pagdepende na ipinahihiwatig ng ἀλλήλων.
theological_decisions:
- issue: Saklaw ng ψεῦδος
  choice: ang kasinungalingan
  alternative: ang kabulaanan / ang kasinungalingang iyon
  rationale: Sa agarang konteksto, mas malamang na pangkalahatang bisyo ng mapanlinlang na pananalita ang tinutukoy, ngunit maaaring pormal na unawain ang articular singular bilang “ang kabulaanan” o “ang lie,” kaya inilalahad ang posibilidad sa talababa.
- issue: Distributibong wikang tumutukoy sa kasarian
  choice: ang bawat isa ... sa kanyang kapwa
  alternative: ang bawat tao ... sa kanilang kapwa
  rationale: Ang Griyego ay gumagamit ng distributibong isahan na may panlahatang saklaw. Sa Tagalog, ang “bawat isa” at “kanyang” ay natural at hindi kinakailangang tumukoy lamang sa lalaki, kaya kapwa napapanatili ang anyo at ang inklusibong diwa.
- issue: Larawan ng katawan sa μέλη
  choice: mga bahagi tayo ng isa’t isa
  alternative: magkakaugnay tayong mga sangkap ng isang katawan
  rationale: Hindi idinaragdag sa mismong talata ang tahasang “isang katawan,” bagaman malinaw ito sa mas malawak na konteksto; sa gayon ay napapanatili ang maigsi at bahagyang matalinghagang pahayag ng orihinal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “yamang” at “sapagkat” upang maging maayos ang lohikal na daloy nang hindi nagiging lipas o labis na kolokyal. Nasa pangunahing teksto ang marker na [a] kaagad pagkatapos ng salitang tinatalakay.
