  text: πρὸς τὸν καταρτισμὸν τῶν ἁγίων εἰς ἔργον διακονίας, εἰς οἰκοδομὴν τοῦ σώματος τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/012.yaml
  text: for the equipping of the saints for the work of ministry[a], for the building up of the body of Messiah[c][b],
translation:
  language: tl
  text: para sa paghahanda sa mga banal, para sa gawain ng paglilingkod[a], at para sa pagpapatibay ng katawan ng Mesiyas[b].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “gawain ng ministeryo.” Ang Griyegong διακονία ay maaaring mangahulugang “paglilingkod” o “ministeryo.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Cristo.” Isinalin ditong “Mesiyas” ang titulong Griyego na Χριστός upang mapanatili ang kahulugan nito bilang titulo.
    reason: alternative_reading
  - marker: c
    text: 'Maaari ring unawain ang Griyego bilang isang pagkakasunod-sunod: “upang ihanda ang mga banal para sa gawain ng paglilingkod, para sa pagpapatibay ng katawan ng Mesiyas.”'
    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς τὸν καταρτισμὸν
  choice: para maihanda
  rationale: Ipinahahayag nito ang layunin at ang diwa ng paghahanda o pagsasangkap upang maging handa sa gawain, sa natural na modernong Tagalog.
- source_word: τῶν ἁγίων
  choice: ang mga banal
  rationale: Pinananatili nito ang karaniwang katawagan ni Pablo sa mga taong ibinukod para sa Diyos, nang hindi nagdaragdag ng ideya ng kalaunang opisyal na pagkilala bilang santo.
- source_word: εἰς ἔργον διακονίας
  choice: para sa gawain ng paglilingkod
  rationale: Sinasalamin ng “gawain” ang isahang ἔργον, habang pinananatili ng “paglilingkod” ang malawak na diwa ng διακονία at hindi ito nililimitahan sa gawain ng klero.
- source_word: εἰς οἰκοδομὴν
  choice: para sa pagpapatibay
  rationale: Ang οἰκοδομή ay gumagamit ng larawan ng pagtatayo para sa pagpapalakas at paglago ng pamayanan. Mas natural sa konteksto ang “pagpapatibay” kaysa literal na “pagtatayo,” bagaman bahagyang di-tuwiran ang metapora.
- source_word: τοῦ σώματος
  choice: ng katawan
  rationale: Pinananatili ang metaporang Paulino ng katawan bilang sama-samang bayan ng Diyos.
- source_word: τοῦ Χριστοῦ
  choice: ng Mesiyas
  rationale: Ang Χριστός ay gumaganap dito bilang titulo; ipinananatili ng “Mesiyas” ang kahulugang “Pinahiran,” habang inilalahad sa talababa ang tradisyonal na “Cristo.”
theological_decisions:
- issue: Ugnayang sintaktiko ng tatlong pariralang nagsasaad ng layunin
  choice: Pinanatiling magkakasunod ang mga pariralang “para,” kaya maaaring iugnay ang mga ito bilang magkakatugmang layunin.
  alternative: 'Maaaring unawain bilang sunod-sunod na proseso: inihahanda ang mga banal para sa paglilingkod, at sa gayon ay napapatibay ang katawan ng Mesiyas.'
  rationale: Maaaring basahin ang Griyegong πρός … εἰς … εἰς bilang magkakatugmang mga layunin o bilang isang umuunlad na pagkakasunod-sunod. Hindi dapat tahimik na lutasin ng salin ang tensiyong ito.
- issue: Saklaw ng διακονία
  choice: paglilingkod
  alternative: ministeryo
  rationale: Ang “paglilingkod” ay natural at malawak, at hindi nagpapahiwatig na ang gawain ay para lamang sa mga ordinadong pinuno.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mga banal” sa Paulinong diwa ng buong bayang ibinukod para sa Diyos, hindi bilang teknikal na katawagan lamang sa mga kinanonisang santo. Ang “pagpapatibay” ay madaling maunawaan at angkop sa metaporikal na paglago ng katawan.
