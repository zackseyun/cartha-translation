  text: καὶ μὴ λυπεῖτε τὸ πνεῦμα τὸ ἅγιον τοῦ θεοῦ, ἐν ᾧ ἐσφραγίσθητε εἰς ἡμέραν ἀπολυτρώσεως.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/030.yaml
  text: And do not grieve the Holy Spirit of God[a], in whom you were sealed for the day of redemption.
translation:
  language: tl
  text: At huwag ninyong pighatiin ang Banal na Espiritu ng Diyos, na sa kaniya ay tinatakan kayo para sa araw ng pagtubos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hanggang sa araw ng pagtubos.” Literal na sinasabi ng Griyego na “para sa araw ng pagtubos” (εἰς ἡμέραν ἀπολυτρώσεως), na maaari ring unawain sa diwang nakatuon sa hinaharap.
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπεῖτε
  choice: pighatiin
  rationale: 'Ang προστακτική na may μή ay pagbabawal: “huwag ninyong pighatiin.” Pinananatili ng “pighatiin” ang personal at ugnayang diwa ng pagdudulot ng dalamhati, at likas itong gamitin sa marangal na modernong Filipino.'
- source_word: πνεῦμα τὸ ἅγιον τοῦ θεοῦ
  choice: ang Banal na Espiritu ng Diyos
  rationale: Pinananatili ang buong pariralang Griyego, kabilang ang tahasang “ng Diyos,” at ginagamit ang karaniwang katawagan sa Filipino.
- source_word: ἐν ᾧ
  choice: na sa kaniya
  rationale: Pinananatili ang ἐν bilang “sa” at ang personal na pagtukoy sa Espiritu sa pamamagitan ng “kaniya,” sa halip na gawing impersonal o tahasang ipakahulugang ahensiya sa “sa pamamagitan niya.”
- source_word: ἐσφραγίσθητε
  choice: kayo tinatakan
  rationale: Tumpak na ipinapahayag ang aorist passive at pinananatili ang talinghaga ng tatak bilang tanda ng pagmamay-ari, pagpapatunay, o pag-iingat nang hindi ito labis na ipinapaliwanag.
- source_word: εἰς ἡμέραν ἀπολυτρώσεως
  choice: para sa araw ng pagtubos
  rationale: Ang “para sa” ay nagpapanatili sa tunguhin o hinaharap na oryentasyon ng εἰς, samantalang ang “araw ng pagtubos” ay natural at hindi nagdaragdag ng mas tiyak na sistemang teolohikal.
theological_decisions:
- issue: Personal na pagtukoy sa Banal na Espiritu sa sugnay na pamanggit
  choice: “na sa kaniya”
  alternative: “na rito” o isang impersonal na anyo
  rationale: Bagaman neuter ang anyo ng panghalip sa Griyego dahil sa gramatikal na kasarian ng πνεῦμα, ang tinutukoy ay ang Espiritung maaaring pighatiin. Kaya personal ang panghalip sa Filipino.
- issue: Kaugnayan ng pagtatatak sa araw ng pagtubos
  choice: “para sa araw ng pagtubos”
  alternative: “hanggang sa araw ng pagtubos”
  rationale: Pinananatili ng pangunahing salin ang layon o tunguhin ng εἰς at hindi ipinipilit ang isang purong temporal na pagbasa. Inilalahad sa talababa ang lehitimong alternatibong may diwang panghinaharap.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “pighatiin” upang mapanatili ang personal at emosyonal na lakas ng pandiwa, at ang bahagyang pormal na “sa kaniya kayo tinatakan” upang manatiling malapit sa estruktura at tunay na kalabuan ng Griyego.
