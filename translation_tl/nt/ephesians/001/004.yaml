revisions:
- from: Kung paanong pinili niya tayo sa kanya bago pa itatag ang sanlibutan, upang[c] tayo ay maging banal at walang kapintasan[b] sa harap niya, na may pag-ibig.[a]
  to: Kung paanong pinili niya tayo sa kanya bago pa itinatag ang sanlibutan, upang tayo ay maging banal at walang kapintasan[b] sa harap niya sa pag-ibig.[a]
  rationale: Pinalitan ang “na may pag-ibig” ng “sa pag-ibig” upang masundan ang ἐν ἀγάπῃ nang hindi nilulutas ang pinagtatalunang pagkakaugnay nito; pinanatili ng talababa a ang posibleng pag-uugnay sa v. 5. Inayos ang aspekto ng “itatag” sa “itatag” na naganap na (“itinatag”) para sa mas likas na temporal na Filipino. Inalis ang talababa c dahil hindi ito katapat ng English audit trail at hindi ito kailangan para sa tapat na salin.
