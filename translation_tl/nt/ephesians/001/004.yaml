translation:
  language: tl
  text: Kung paanong pinili niya tayo sa kanya bago pa itinatag ang sanlibutan, upang tayo ay maging banal at walang kapintasan[b] sa harap niya sa pag-ibig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring iugnay ang “sa pag-ibig” sa kasunod na talata: “Sa pag-ibig ay itinalaga niya tayo nang una …”'
    reason: alternative_reading
  - marker: b
    text: O “walang dungis.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: kung paanong
  rationale: Pinananatili ang ugnayang naghahambing at nag-uugnay sa naunang pahayag, sa halip na gawing hiwalay na pangungusap ang talata.
- source_word: ἐξελέξατο
  choice: pinili niya
  rationale: Direkta at likas na katumbas ito ng pandiwa, at hindi nito ipinapasok ang teknikal na kahulugang maaaring ikabit sa salitang “itinalaga” o sa isang terminong pangsistema.
- source_word: ἡμᾶς
  choice: tayo
  rationale: Kasama sa tinutukoy ng nagsasalita ang mga mambabasa; ang inklusibong “tayo” ang likas na anyo sa konteksto.
- source_word: ἐν αὐτῷ
  choice: sa kanya
  rationale: Pinananatili ang maikli at masaklaw na pananalita ni Pablo tungkol sa kaugnayan kay Cristo nang hindi ito nililimitahan sa isang paliwanag gaya ng “kaisa niya.”
- source_word: πρὸ καταβολῆς κόσμου
  choice: bago pa itatag ang sanlibutan
  rationale: Likas na Filipino para sa temporal na pariralang tumutukoy sa panahong bago ang pagkakatatag o paglalang ng mundo.
- source_word: εἶναι ἡμᾶς
  choice: upang tayo ay maging
  rationale: Malinaw at natural na ipinahahayag ang layon ng pagpili habang pinananatiling hayag ang “tayo,” na siyang paksa ng infinitibo sa Griyego.
- source_word: ἁγίους
  choice: banal
  rationale: Pinananatili ang kapuwa moral at nakatalagang diwa ng salita sa karaniwang bokabularyong biblikal ng Filipino.
- source_word: ἀμώμους
  choice: walang kapintasan
  rationale: Natural itong nagpapahayag ng pagiging walang maipipintas at pinananatili rin ang posibleng alusyon sa handog na walang dungis.
- source_word: κατενώπιον αὐτοῦ
  choice: sa harap niya
  rationale: Maikli, natural, at tapat sa diwa ng pagharap o pagiging nasa presensiya ng Diyos.
- source_word: ἐν ἀγάπῃ
  choice: na may pag-ibig
  rationale: Ipinapahayag ang parirala sa likas na Filipino habang nananatili ito sa hulihan ng talata; itinatala sa talababa ang tunay na posibilidad na kaugnay ito ng susunod na talata.
theological_decisions:
- issue: Posibleng doktrinal na labis na pagbasa sa ἐξελέξατο
  choice: pinili niya tayo
  alternative: itinalaga niya tayo / hinirang niya tayo
  rationale: Malinaw sa teksto ang pagpili ng Diyos, ngunit ang “pinili” ang pinakadirekta at hindi kusang nagdadala ng mas huling sistemang teolohikal.
- issue: Pagkakaugnay ng ἐν ἀγάπῃ
  choice: inilagay sa hulihan ng talata bilang “na may pag-ibig,” kalakip ang talababa
  alternative: 'iugnay sa susunod na talata: “Sa pag-ibig ay itinalaga niya tayo nang una...”'
  rationale: Maaaring iugnay ng sintaks na Griyego ang parirala sa naunang paglalarawan o sa kasunod na pahayag. Hindi nilulutas nang dogmatiko ang tunay na kalabuan.
- issue: Layon o bunga ng εἶναι ἡμᾶς
  choice: upang tayo ay maging
  alternative: kaya tayo ay magiging
  rationale: Mas malamang na layon ang ipinahahayag ng infinitibo, ngunit maaari rin itong unawain na bunga; itinatala ang alternatibo nang hindi binabago ang pangunahing pagbasa.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang umaasang pang-ugnay na “Kung paanong” dahil bahagi ang talata ng mahabang pangungusap mula sa naunang talata. Ginamit ang “sanlibutan” bilang pamilyar at dignified na terminong biblikal; iniwasan ang teknikal o denominasyonal na pananalita.
