base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b].
translation:
  language: tl
  text: Sumainyo nawa ang biyaya at kapayapaan mula sa Diyos na ating Ama at sa Panginoong Jesu-Cristo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “Panginoong Jesus na Mesiyas.” Ang Griyegong Χριστός ay nangangahulugang “Mesiyas” at maaaring gamitin bilang titulo o, sa ilang konteksto, bilang anyong halos bahagi na ng pangalan: “Cristo.”'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: biyaya
  rationale: Pinananatili ng “biyaya” ang karaniwang teolohikal na diwa ng χάρις at ang gamit nito bilang pagpapala sa pambungad ng liham.
- source_word: ὑμῖν
  choice: sumainyo nawa
  rationale: Sa pormulang pagbati at pagpapala, likas sa Tagalog ang “sumainyo nawa,” na nagpapahayag ng hinihiling na pagpapalang nakatuon sa mga mambabasa.
- source_word: εἰρήνη
  choice: kapayapaan
  rationale: Karaniwan at malinaw na katumbas ito na nagpapanatili kapwa sa payak na kahulugan at sa posibleng alingawngaw ng shalom.
- source_word: ἀπὸ
  choice: mula sa
  rationale: Malinaw nitong ipinakikita ang pinagmumulan ng biyaya at kapayapaan.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Diyos na ating Ama
  rationale: Itinuturing ang πατρὸς ἡμῶν bilang paglalarawan sa θεοῦ—“Diyos na ating Ama”—nang hindi nagdaragdag ng pangatnig na wala sa Griyego.
- source_word: κυρίου
  choice: Panginoon
  rationale: Pinananatili nito ang lakas ng titulong κύριος sa kontekstong Kristolohikal.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesu-Cristo
  rationale: Ang “Jesu-Cristo” ang natural, dignified, at malawak na nakikilalang anyo sa modernong Tagalog; nililinaw sa talababa na ang Χριστός ay may kahulugang “Mesiyas” at maaari ring gumana bilang titulong tahasan.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστοῦ sa Ἰησοῦ Χριστοῦ
  choice: Jesu-Cristo
  alternative: Jesus na Mesiyas
  rationale: Sa pormulang ito, maaaring gumana ang Χριστός bilang titulong “Mesiyas” o bilang anyong halos bahagi na ng pangalan. Pinili sa teksto ang natural na “Jesu-Cristo,” habang pinananatili sa talababa ang tunay na leksikal at Kristolohikal na saklaw.
- issue: Ugnayan ng Diyos Ama at ng Panginoong Jesus bilang pinagmumulan
  choice: “mula sa Diyos na ating Ama at sa Panginoong Jesu-Cristo”
  alternative: “mula sa ating Diyos at Ama at sa Panginoong Jesu-Cristo”
  rationale: 'Ang genitibong parirala ay pinakanatural na appositional: ang Diyos ay inilalarawan bilang ating Ama. Hindi nagdaragdag ng “at” sa loob ng pariralang θεοῦ πατρὸς ἡμῶν.'
translation_notes:
  register: Modernong Filipino Tagalog na may marangal ngunit madaling maunawaang himig. Ginamit ang pormulang “Sumainyo nawa” upang maging natural ang apostolikong pagbati at pagpapala; iniwasan ang labis na arkaikong pananalita.
