source:
  edition: SBLGNT
  text: ἐν ᾧ καὶ ἐκληρώθημεν προορισθέντες κατὰ πρόθεσιν τοῦ τὰ πάντα ἐνεργοῦντος κατὰ τὴν βουλὴν τοῦ θελήματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/011.yaml
  text: In him we also were made an inheritance[a], having been predestined according to the purpose of the one who works all things according to the counsel of his will,
translation:
  language: tl
  text: Sa kanya, tayo rin ay ginawang mana ng Diyos[a], nauna nang itinalaga ayon sa layunin ng Diyos na gumagawa ng lahat ng bagay ayon sa pasiya ng kanyang kalooban.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “tayo rin ay tumanggap ng mana.” Maaaring mangahulugan ang pandiwang Griyego na tumanggap ng mana o ginawang sariling pag-aari ng Diyos.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Sa kanya
  rationale: Tumutukoy ang panghalip kay Cristo sa naunang konteksto. Likas ito sa makabagong Tagalog at pinananatili ang diwa ng pakikiisa kay Cristo.
- source_word: ἐκληρώθημεν
  choice: tayo rin ay ginawang mana ng Diyos
  rationale: Maaaring ipakahulugan ang pasibong pandiwa bilang ginawang nakatalagang pag-aari o mana ng Diyos. Idinagdag ang “ng Diyos” upang maging malinaw sa Tagalog ang ipinahihiwatig na may-ari, habang inilalahad sa talababa ang tunay na alternatibong pagbasa.
- source_word: προορισθέντες
  choice: yamang itinalaga na tayo nang una
  rationale: Ipinahahayag ng participle ang naunang pagtatalaga. Malinaw at dignified ang pariralang ito nang hindi nag-aangkat ng mas malawak na sistemang teolohikal.
- source_word: κατὰ πρόθεσιν
  choice: ayon sa layunin
  rationale: Ang πρόθεσις ay tumutukoy sa sadyang layunin o balak; direkta at natural sa Tagalog ang “ayon sa layunin.”
- source_word: τοῦ τὰ πάντα ἐνεργοῦντος
  choice: niya na gumagawa ng lahat ng bagay
  rationale: Ipinakikilala ng substantival participle ang Diyos bilang kumikilos. Pinananatili ng “gumagawa” ang lawak ng ἐνεργέω nang hindi labis na tinutukoy ang paraan ng pagkilos.
- source_word: τὰ πάντα
  choice: lahat ng bagay
  rationale: Direktang katumbas ito at pinananatili ang malawak na saklaw ng pahayag.
- source_word: κατὰ τὴν βουλὴν
  choice: ayon sa pasiya
  rationale: Ang βουλή ay may diwa ng pinag-isipan at matibay na pasiya. Mas natural sa kasalukuyang Tagalog ang “pasiya” kaysa literal na “payo” o “kapasyahan.”
- source_word: τοῦ θελήματος αὐτοῦ
  choice: ng kanyang kalooban
  rationale: Karaniwan at tumpak na salin ito ng θέλημα at pinananatili ang ugnayan nito sa βουλή.
theological_decisions:
- issue: Kahulugan ng ἐκληρώθημεν
  choice: Ang mga mananampalataya ay ginawang mana o nakatalagang bayan ng Diyos.
  alternative: Ang mga mananampalataya ay tumanggap ng mana.
  rationale: Pinahihintulutan ng pasibong anyo ng κληρόω ang dalawang pagkaunawa. Sinusuportahan ng konteksto at ng larawan sa Lumang Tipan tungkol sa bayan bilang mana ng Diyos ang pangunahing salin, ngunit tunay at mahalagang alternatibo ang pagtanggap ng mana kaya pinanatili ito sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino Tagalog. Iniwasan ang labis na teknikal o denominasyonal na pananalita, at pinanatili sa talababa ang tunay na kalabuan ng pandiwang Griyego.
