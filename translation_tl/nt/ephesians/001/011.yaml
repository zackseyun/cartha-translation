revisions:
- from: Sa kanya, tayo rin ay ginawang mana ng Diyos[a], yamang itinalaga na tayo nang una ayon sa layunin niya na gumagawa ng lahat ng bagay ayon sa pasiya ng kanyang kalooban.
  to: Sa kanya, tayo rin ay ginawang mana ng Diyos[a], nauna nang itinalaga ayon sa layunin ng Diyos na gumagawa ng lahat ng bagay ayon sa pasiya ng kanyang kalooban.
  rationale: Inalis ang pangatnig na “yamang” upang hindi gawing tahasang sanhi ang participle na προορισθέντες. Pinalitan ang ayos nito ng “nauna nang itinalaga,” na natural na Tagalog at nananatiling tapat sa kahulugang “predestined.” Nilinaw rin ang alternatibong kahulugan sa talababa, habang pinananatili ang pangunahing pagbasa na ang mga mananampalataya ay ginawang mana ng Diyos.
