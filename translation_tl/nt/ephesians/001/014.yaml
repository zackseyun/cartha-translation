  rationale: Inalis ang interpretatibong dagdag na “inilaan ng Diyos” upang maingatan ang ambigwidad ng τῆς περιποιήσεως. Pinanatili ang iba pang mga pagpili ng draft, kabilang ang direksiyonal na “tungo sa” para sa εἰς ἀπολύτρωσιν at ang pormulang “kapurihan ng kanyang kaluwalhatian.”
