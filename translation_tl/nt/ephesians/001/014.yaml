id: EPH.1.14
reference: Ephesians 1:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀ὅ ἐστιν ἀρραβὼν τῆς κληρονομίας ἡμῶν, εἰς ἀπολύτρωσιν τῆς περιποιήσεως, εἰς ἔπαινον τῆς δόξης αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/014.yaml
  text: who is the down payment of our inheritance, toward the redemption of the possession, to the praise of his glory.
translation:
  language: tl
  text: Siya ang paunang katiyakan ng ating mana, tungo sa pagtubos ng pag-aari, para sa kapurihan ng kanyang kaluwalhatian.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅ
  choice: Siya
  rationale: Ang panghalip ay tumutukoy sa Banal na Espiritu sa naunang talata; pinananatili ang personal na pagtukoy.
- source_word: ἀρραβών
  choice: paunang katiyakan
  rationale: Ipinahahayag nito ang paunang ibinigay na nagsisilbing garantiya na lubos pang matatanggap ang ipinangako, nang hindi nalilimitahan sa makabagong kahulugang pinansyal ng 'paunang bayad.'
- source_word: κληρονομία
  choice: mana
  rationale: Karaniwan, malinaw, at angkop na salin para sa minanang pagpapalang ipinangako.
- source_word: εἰς ἀπολύτρωσιν
  choice: tungo sa pagtubos
  rationale: Pinananatili ang direksiyon o layuning ipinahihiwatig ng εἰς at iniiwasang gawing simpleng sanhi lamang.
- source_word: τῆς περιποιήσεως
  choice: sa pag-aaring inilaan ng Diyos
  rationale: Ang περιποίησις ay maaaring tumukoy sa pag-aari o bayang inangkin; ang salin ay nagpapanatili ng diwa ng pag-aari ngunit nililinaw ang ipinahihiwatig na banal na nagmamay-ari.
- source_word: εἰς ἔπαινον τῆς δόξης αὐτοῦ
  choice: para sa kapurihan ng kanyang kaluwalhatian
  rationale: Pinananatili ang paulit-ulit na pormula ng kabanata at ang ugnayan ng kapurihan at kaluwalhatian.
theological_decisions:
- issue: Ang tinutukoy ng ὅ at ang personal na katangian ng Espiritu
  choice: Siya
  alternative: na siyang / ito ang
  rationale: Bagaman neuter ang πνεῦμα sa Griyego, ang ὅ rito ay may personal na reperensiya sa Banal na Espiritu; natural sa Tagalog ang 'Siya' at hindi nito ginagawang impersonal ang Espiritu.
- issue: Sino o ano ang 'pag-aari' sa τῆς περιποιήσεως
  choice: pag-aaring inilaan ng Diyos
  alternative: sariling bayan ng Diyos; pag-aari; pagtatamo
  rationale: Sadyang hindi tinutukoy nang tahasan kung ang pag-aari ay ang bayan, ang mana, o ang kabuuang tinubos na pag-aari. Ang salin ay hindi naglilimita rito sa isang partikular na doktrinal na pagbasa.
- issue: Relasyon ng tatak ng Espiritu sa ganap na pagtubos
  choice: tungo sa pagtubos
  alternative: para sa pagtubos; hanggang sa pagtubos
  rationale: 'Pinananatili ang eskatolohikal na direksiyon ng εἰς: ang paunang katiyakan ay nakatuon sa ganap na pagtubos na darating, nang hindi ipinahihiwatig na ang Espiritu ang kabayaran.'
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang 'paunang katiyakan' bilang madaling maunawaang paglalarawan ng garantiyang may paunang pagkakaloob. Pinanatili ang maikli at liturhikal na hulma ng pangungusap at ang pariralang 'kapurihan ng kanyang kaluwalhatian.'
