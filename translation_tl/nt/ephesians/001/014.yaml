  source_fidelity: 'Ang pangunahing daloy ay tapat sa Griyego: ang referent ng ὅ ay maayos na naipapakita bilang personal, at ang dalawang pariralang εἰς ay napananatiling may direksiyong “tungo sa/para sa.” Gayunman, ang “inilaan ng Diyos” ay nagdaragdag ng impormasyon na wala sa τῆς περιποιήσεως at nilulutas ang isang sadyang hindi tiyak na parirala.'
  naturalness: Natural at marangal ang pangungusap sa makabagong Filipino. Ang “pagtubos ng pag-aari” ay bahagyang mas literal kaysa sa dating parirala ngunit malinaw at mas angkop dahil hindi nito dinaragdagan ang teksto.
