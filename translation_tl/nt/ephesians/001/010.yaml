  source_fidelity: Ang pangunahing diwa ay malapit sa Griyego, ngunit ang “tipunin” ay higit na nakatuon sa pagtitipon/pagbubuklod kaysa sa mas malawak na diwa ng ἀνακεφαλαιώσασθαι na “lagumin” (na may kaugnay na pahiwatig ng pagkaulo). Ang “lagumin” sa pangunahing teksto, na nililinaw ng talababa, ay mas tapat sa piniling optimal-equivalence na pagbasa at sa English audit trail.
  naturalness: Ang pangungusap ay natural sa marangal at makabagong Tagalog. Ang “lagumin” ay medyo pormal ngunit angkop sa rehistrong biblikal at kosmikong saklaw ng talata. Ang “sa kanya” sa wakas ay malinaw na nagpapanatili sa inuulit na ἐν αὐτῷ.
  terminology: Ang “pangangasiwa,” “kaganapan ng mga takdang panahon,” “Mesiyas,” “kalangitan,” at “lupa” ay angkop. Inaayos ang talababa upang malinaw at natural na maipahayag ang alternatibong larawan ng pagbubuklod sa ilalim ng iisang ulo nang hindi ito ipinipilit sa pangunahing teksto.
  issues:
