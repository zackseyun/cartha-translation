    issue: Ang “upang tipunin” ay mas makitid kaysa sa ἀνακεφαλαιώσασθαι.
    rationale: Maaari itong magpahiwatig ng pag-iipon o pagbubuklod, ngunit hindi nito gaanong naihahatid ang diwa ng “paglalagom.” Mas maingat ang “upang lagumin,” habang ang pahiwatig ng pagkaulo ay nananatili sa talababa.
  - severity: medium
    issue: Hindi natural at hindi ganap na malinaw ang kasalukuyang pahayag sa talababa na “sa ilalim ng isang ulo, ang Mesiyas.”
    rationale: Maaaring mabasa ang “ang Mesiyas” bilang maluwag na apposition at hindi malinaw ang ugnayan nito sa pariralang “sa ilalim ng isang ulo.” Ang binagong talababa ay tahasang nagsasabing ang iisang ulo ay ang Mesiyas, bilang alternatibong pagbasa.
