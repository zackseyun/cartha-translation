  text: εἰς οἰκονομίαν τοῦ πληρώματος τῶν καιρῶν, ἀνακεφαλαιώσασθαι τὰ πάντα ἐν τῷ Χριστῷ, τὰ ἐπὶ τοῖς οὐρανοῖς καὶ τὰ ἐπὶ τῆς γῆς· ἐν αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/010.yaml
  text: for the administration of the fullness of the times[a], to sum up all things in the Messiah—the things in the heavens and the things on the earth—in him,
translation:
  language: tl
  text: para sa pangangasiwa sa kaganapan ng mga takdang panahon, upang lagumin sa Mesiyas ang lahat ng bagay[a]—ang mga nasa kalangitan at ang mga nasa lupa—sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pag-isahin ang lahat ng bagay sa ilalim ng iisang ulo—ang Mesiyas”; maaaring mangahulugan ang pandiwang Griyego ng paglalagom o ng pagbubuklod sa ilalim ng isang ulo.
    reason: alternative_reading
lexical_decisions:
- source_word: οἰκονομίαν
  choice: pangangasiwa
  rationale: Pinananatili nito ang diwa ng maayos at nilalayong pamamahala o pagsasakatuparan nang hindi ito pinapaliit sa simpleng “plano.”
- source_word: πληρώματος τῶν καιρῶν
  choice: kaganapan ng mga takdang panahon
  rationale: Ang “kaganapan” ay nagpapahayag ng ganap na sukat o pagdating sa katuparan, at ang “mga takdang panahon” ay naghahatid sa diwa ng καιροί bilang angkop o itinakdang mga panahon.
- source_word: ἀνακεφαλαιώσασθαι
  choice: upang tipunin
  rationale: Likas at malinaw ito sa modernong Tagalog at naihahatid ang pagsasama-sama sa isang kabuuan. Inilalagay sa talababa ang posibleng diwa ng pagbubuklod sa ilalim ng isang ulo.
- source_word: τὰ πάντα
  choice: ang lahat ng bagay
  rationale: Pinananatili ang malawak at kosmikong saklaw ng Griyegong parirala.
- source_word: ἐν τῷ Χριστῷ
  choice: sa Mesiyas
  rationale: Ginagamit dito ang Χριστός bilang titulo; ang “Mesiyas” ay malinaw na naghahatid ng titular at teolohikal na diwa nito.
- source_word: τὰ ἐπὶ τοῖς οὐρανοῖς
  choice: ang mga nasa kalangitan
  rationale: Natural sa Tagalog at pinananatili ang pagtukoy sa makalangit na saklaw.
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: ang mga nasa lupa
  rationale: Tuwirang locative na katapat at malinaw na kasalungat ng “mga nasa kalangitan.”
- source_word: ἐν αὐτῷ
  choice: sa kanya
  rationale: Pinananatili ang pag-uulit at diin ng Griyego, at ang panghalip ay likas na tumutukoy sa Mesiyas.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστῷ
  choice: Mesiyas
  alternative: Cristo
  rationale: Mas gumaganap bilang titulo ang salita sa kontekstong ito, kaya “Mesiyas” ang pinili nang hindi inaalis ang kinikilalang alternatibong tradisyonal.
- issue: Diwa ng ἀνακεφαλαιώσασθαι
  choice: tipunin ang lahat ng bagay
  alternative: pagsama-samahin ang lahat ng bagay sa ilalim ng isang ulo
  rationale: Maaaring tumukoy ang pandiwa sa paglalagom o pagtitipon sa isang kabuuan at maaari ring magpahiwatig ng pagbubuklod sa ilalim ng isang ulo. Ginamit sa teksto ang natural at hindi labis na mapagpasiyang “tipunin,” habang pinananatili sa talababa ang diwa ng pagkaulo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang anyong nakaugnay sa naunang pangungusap ng Efeso 1:9 at ang kosmikong saklaw ng talata. Ang “takdang panahon” ay ginamit upang maipahiwatig ang natatanging diwa ng καιρός, at iniwasan ang mas teknikal at hindi gaanong karaniwang “lagumin” sa pangunahing teksto.
