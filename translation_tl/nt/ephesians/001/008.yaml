  text: which he lavished on us in all wisdom and insight[b][a],
translation:
  language: tl
  text: na sagana niyang ibinuhos sa atin, sa buong karunungan at pagkaunawa[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na pinasagana niya para sa atin.”
    reason: lexical_alternative
  - marker: b
    text: Ang pariralang “sa buong karunungan at pagkaunawa” ay maaaring maglarawan sa paraan ng saganang pagbuhos ng Diyos ng kanyang biyaya, o sa karunungan at pagkaunawang kaugnay ng ipinagkaloob niya sa mga mananampalataya.
    reason: alternative_reading
lexical_decisions:
- source_word: ἧς
  choice: na
  rationale: Iniuugnay ng panghalip na pambalana ang sugnay sa naunang “kayamanan ng kanyang biyaya.” Sa natural na Tagalog, sapat ang “na” upang ipagpatuloy ang kaugnayang ito nang hindi inuulit ang pangngalan.
- source_word: ἐπερίσσευσεν
  choice: sagana niyang ibinuhos
  rationale: Ipinahahayag nito ang aktibo at pasaganang pagkakaloob ng Diyos. Ang “ibinuhos” ay natural na talinghaga sa Tagalog para sa labis-labis na pagbibigay, samantalang pinananatili ng “sagana” ang diwa ng pag-apaw.
- source_word: εἰς ἡμᾶς
  choice: sa atin
  rationale: Malinaw nitong ipinakikita na ang mga mananampalataya ang pinatutunguhan at tumatanggap ng pasaganang biyaya.
- source_word: ἐν πάσῃ σοφίᾳ καὶ φρονήσει
  choice: sa buong karunungan at pagkaunawa
  rationale: Ang “sa” ay malapit sa anyo ng ἐν at hindi tiyak na nagpapasya kung inilalarawan ng parirala ang paraan ng pagkilos ng Diyos o ang kaloob na kaugnay ng biyaya. Ang “pagkaunawa” ay likas na modernong katumbas ng φρόνησις at naiiba pa rin sa “karunungan.”
theological_decisions:
- issue: Kaugnayan ng “sa buong karunungan at pagkaunawa”
  choice: Pinanatiling bukas ang pagkakaugnay ng parirala sa pamamagitan ng “sa,” nang hindi tahasang itinatalaga ang karunungan at pagkaunawa sa Diyos o sa mga tumanggap.
  alternative: Maaaring tumukoy ito sa karunungan at pagkaunawa ng Diyos sa pagbuhos ng biyaya, o sa karunungan at pagkaunawang ipinagkaloob sa mga mananampalataya.
  rationale: Pinahihintulutan ng kayariang Griyego ang dalawang pagbasa; hindi dapat lutasin ng salin ang tunay na sintaktiko at teolohikal na kalabuan.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang pamilyar na talinghagang “ibinuhos” upang ihatid ang kasaganaan, habang pinanatili ng “sa buong karunungan at pagkaunawa” ang tunay na kalabuan ng Griyego.
