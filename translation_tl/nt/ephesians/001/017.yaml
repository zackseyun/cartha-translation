id: EPH.1.17
reference: Ephesians 1:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἵνα ὁ θεὸς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ πατὴρ τῆς δόξης, δώῃ ὑμῖν πνεῦμα σοφίας καὶ ἀποκαλύψεως ἐν ἐπιγνώσει αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/017.yaml
  text: that the God of our Lord Jesus the Messiah[a], the Father of glory, may give you a spirit of wisdom and revelation in the knowledge of him[c][b],
translation:
  language: tl
  text: upang ang Diyos ng ating Panginoong Jesus na Mesiyas[b], ang Ama ng kaluwalhatian[c], ay magbigay sa inyo ng isang espiritu ng karunungan at paghahayag[a] sa pagkakilala sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang Espiritu ng karunungan at paghahayag.” Maaaring tumukoy ang Griyegong πνεῦμα sa espiritu o disposisyong kaloob ng Diyos, o sa Banal na Espiritu.
    reason: alternative_reading
  - marker: b
    text: 'Tradisyonal na salin: “Jesus Cristo.” Ang Griyegong titulong Χριστός ay nangangahulugang “Mesiyas.”'
    reason: lexical_alternative
  - marker: c
    text: O, “ang maluwalhating Ama.” Literal na “ang Ama ng kaluwalhatian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: upang
  rationale: Ipinagpapatuloy nito ang nilalaman at layunin ng panalangin ni Pablo mula sa naunang talata, habang pinananatili ang subordinadong ugnayan.
- source_word: ὁ θεὸς τοῦ κυρίου ἡμῶν
  choice: ang Diyos ng ating Panginoon
  rationale: Malapit sa estruktura ng Griyego at natural bilang pagtukoy sa Diyos na sinasamba at tinatawag na Diyos ng Panginoong Jesus.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus na Mesiyas
  rationale: Isinasalin ang Χριστός bilang titulong “Mesiyas” sa halip na tratuhing bahagi lamang ng pangalan; idinagdag ang “na” para sa likas at malinaw na Tagalog.
- source_word: ὁ πατὴρ τῆς δόξης
  choice: ang Ama ng kaluwalhatian
  rationale: Pinananatili ang genitibong pananalita ng Griyego at hindi agad nililimitahan sa interpretasyong “maluwalhating Ama.”
- source_word: δώῃ ὑμῖν
  choice: magbigay sa inyo
  rationale: Direkta at natural na pagsasalin ng pandiwang nasa konteksto ng panalangin o kahilingan.
- source_word: πνεῦμα σοφίας καὶ ἀποκαλύψεως
  choice: isang espiritu ng karunungan at paghahayag
  rationale: Pinananatili ang anarthrous na πνεῦμα at ang posibilidad na tumukoy ito sa kaloob na disposisyon o kakayahang espirituwal; inilalahad sa talababa ang posibleng pagtukoy sa Banal na Espiritu.
- source_word: ἐν ἐπιγνώσει αὐτοῦ
  choice: sa pagkakilala sa kanya
  rationale: Natural sa Tagalog at pinananatiling bukas kung ang parirala ay tumutukoy sa larangan, paraan, o bunga ng karunungan at paghahayag.
theological_decisions:
- issue: Kung ang πνεῦμα ay tumutukoy sa Banal na Espiritu o sa isang espiritu/disposisyong kaloob ng Diyos
  choice: isang espiritu ng karunungan at paghahayag
  alternative: ang Espiritu ng karunungan at paghahayag
  rationale: Walang artikulo ang πνεῦμα sa Griyego, at kapuwa posible ang personal at disposisyunal na pagbasa. Hindi tiyak na nilulutas ng pangunahing teksto ang usapin; kaya inilalagay ang alternatibo sa talababa.
- issue: Kung paano isasalin ang Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Gumaganap dito ang Χριστός bilang titulo. Ang “Mesiyas” ay nagpapahayag ng kahulugan nito, samantalang ang tradisyonal na “Cristo” ay inilalahad sa talababa.
- issue: Kung paano uunawain ang genitibong τῆς δόξης
  choice: Ama ng kaluwalhatian
  alternative: maluwalhating Ama
  rationale: Pinananatili ng pangunahing teksto ang literal at teolohikal na mabigat na parirala nang hindi pinipili agad ang isang tiyak na uri ng genitibo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang daloy ng isang sugnay na nakaugnay sa naunang talata. Ginamit ang “Mesiyas,” “kaluwalhatian,” at “paghahayag” bilang malinaw at kinikilalang bokabularyong biblikal, habang iniwasang lutasin sa pangunahing teksto ang tunay na kalabuan ng πνεῦμα at ng genitibong parirala.
