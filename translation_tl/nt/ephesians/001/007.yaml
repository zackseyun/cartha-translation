  text: ἐν ᾧ ἔχομεν τὴν ἀπολύτρωσιν διὰ τοῦ αἵματος αὐτοῦ, τὴν ἄφεσιν τῶν παραπτωμάτων, κατὰ ⸂τὸ πλοῦτος⸃ τῆς χάριτος αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/007.yaml
  text: In him we have redemption through his blood[a], the forgiveness of trespasses[b], according to the riches of his grace
translation:
  language: tl
  text: Sa kanya[a] ay mayroon tayong katubusan sa pamamagitan ng kanyang dugo—ang kapatawaran ng mga paglabag[b]—ayon sa kayamanan ng kanyang biyaya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “kung kanino”; tumutukoy ito sa Minamahal sa talata 6.
    reason: lexical_alternative
  - marker: b
    text: O, “mga pagsuway.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Sa kanya
  rationale: Tumutukoy ang panghalip sa Minamahal sa naunang talata. Likas sa makabagong Tagalog ang “sa kanya” at pinananatili nito ang diwa ng pagiging nakaugnay kay Cristo.
- source_word: ἔχομεν
  choice: mayroon tayong
  rationale: Ipinahahayag ng pangkasalukuyang pandiwa na ang katubusan ay kasalukuyang taglay na realidad.
- source_word: ἀπολύτρωσιν
  choice: katubusan
  rationale: Pinananatili ng “katubusan” ang diwa ng paglaya na natamo sa isang malaking halaga, sa halip na gawing pangkalahatang “pagliligtas” lamang.
- source_word: διὰ τοῦ αἵματος αὐτοῦ
  choice: sa pamamagitan ng kanyang dugo
  rationale: Ipinakikita ng διά na ang kanyang dugo ang paraan o kasangkapan ng katubusan; pinananatili rin ang tahasang larawan ng dugo sa teksto.
- source_word: ἄφεσιν
  choice: kapatawaran
  rationale: Sa kontekstong ito, ang salita ay tumutukoy sa pagpapatawad o pagpapawalang-sala sa mga pagkakasala.
- source_word: παραπτωμάτων
  choice: mga pagsuway
  rationale: Ang “mga pagsuway” ay malinaw at likas na tumutukoy sa mga maling gawa o paglabag; ang “mga paglabag” ay isa ring wastong alternatibo.
- source_word: κατὰ τὸ πλοῦτος
  choice: ayon sa kayamanan
  rationale: 'Ang κατά ay nagpapahayag ng pamantayan o sukat: ang kapatawaran ay kaayon ng saganang kayamanan ng biyaya, hindi lamang nagmumula rito.'
- source_word: χάριτος
  choice: biyaya
  rationale: Ang “biyaya” ang malinaw at nakaugaliang salin para sa mapagkaloob at di-karapat-dapat na kagandahang-loob ng Diyos.
theological_decisions:
- issue: Ugnayan ng “katubusan” at “kapatawaran sa mga pagsuway”
  choice: 'Pinanatili bilang magkatabing parirala: “katubusan ... ang kapatawaran sa mga pagsuway”'
  alternative: “katubusan, samakatuwid ay ang kapatawaran sa mga pagsuway”
  rationale: Malamang na ipinapaliwanag ng ikalawang parirala ang una, ngunit hindi idinagdag ang “samakatuwid ay” upang mapanatili ang anyo at bahagyang kaluwagan ng Griyego.
- issue: Wika ng pagtubos sa “sa pamamagitan ng kanyang dugo”
  choice: Pinanatili ang konkretong salitang “dugo”
  alternative: “sa pamamagitan ng kanyang kamatayan” o “sa pamamagitan ng kanyang sakripisyong kamatayan”
  rationale: Dugo ang tahasang binabanggit ng teksto. Ang pagpapalit nito ng “kamatayan” ay magpapaliwanag sa larawan sa halip na isalin ito at magpapahina sa sakripisyal at tipanang pahiwatig.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang gitling na em upang ipakita ang paliwanag na ugnayan ng “kapatawaran” sa “katubusan” nang hindi nagdaragdag ng tahasang interpretibong pananalita.
