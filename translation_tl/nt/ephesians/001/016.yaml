  text: Hindi ako tumitigil sa pagpapasalamat para sa inyo at binabanggit ko kayo[a] sa aking mga panalangin,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “inaalala ko kayo sa aking mga panalangin.” Literal na idyomang Griyego ito na nangangahulugang “binabanggit ko kayo sa aking mga panalangin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ παύομαι
  choice: Hindi ako tumitigil
  rationale: Ipinahahayag ng pangkasalukuyang anyo kasama ng οὐ ang patuloy na hindi pagtigil; natural ito sa modernong Tagalog at pinananatili ang diin ng Griyego.
- source_word: εὐχαριστῶν
  choice: sa pagpapasalamat
  rationale: Ang pangkasalukuyang pandiwaring ito ay kasabay ng κύριος na pandiwa; malinaw na pinananatili ng “pagpapasalamat” ang tahasang diwa ng pasasalamat.
- source_word: ὑπὲρ ὑμῶν
  choice: para sa inyo
  rationale: Sa konteksto ng pasasalamat, tinutukoy ng ὑπέρ na may genitive ang mga taong dahilan o paksa ng pasasalamat.
- source_word: μνείαν ποιούμενος
  choice: sa pagbanggit sa inyo
  rationale: Pinananatili nito ang pormal na Griyegong idyomang “gumagawa ng pagbanggit,” habang likas na isinasaad sa Tagalog ang ipinahihiwatig na layon na “kayo.”
- source_word: ἐπὶ τῶν προσευχῶν μου
  choice: sa aking mga panalangin
  rationale: Ipinahahayag nito ang kalagayan o pagkakataon kung kailan ginagawa ang pagbanggit, sa paraang likas sa Tagalog.
