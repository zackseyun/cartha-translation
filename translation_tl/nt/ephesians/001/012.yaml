  text: εἰς τὸ εἶναι ἡμᾶς εἰς ἔπαινον δόξης αὐτοῦ τοὺς προηλπικότας ἐν τῷ Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/012.yaml
  text: so that we who had already hoped in Messiah might be for the praise of his glory[a][b].
translation:
  language: tl
  text: upang tayong mga dati nang umasa sa Mesiyas[a] ay maging sa ikapupuri ng kanyang kaluwalhatian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tayong mga unang umasa sa Mesiyas.”
    reason: Pinananatili ang posibleng kahulugan na isang natatanging unang pangkat ang tinutukoy ng προηλπικότας.
lexical_decisions:
- source_word: εἰς τὸ εἶναι
  choice: upang ... ay maging
  rationale: Ipinahahayag ng εἰς kasama ang articular infinitive ang layunin o bunga; natural itong naihahatid sa Tagalog sa pamamagitan ng “upang ... ay maging.”
- source_word: ἡμᾶς
  choice: tayo / tayong
  rationale: Bagaman accusative ito sa Griyego bilang simuno ng infinitive, ang “tayong” ang likas na anyo sa muling isinaayos na sugnay sa Tagalog.
- source_word: εἰς ἔπαινον δόξης αὐτοῦ
  choice: maging dahilan upang purihin ang kanyang kaluwalhatian
  rationale: 'Iniiwasan nito ang di-likas na “maging para sa kapurihan” habang pinananatili ang diwang layunin o bunga: ang tinutukoy na pangkat ay humahantong sa pagpuri sa kaluwalhatian ng Diyos.'
- source_word: τοὺς προηλπικότας
  choice: mga dati nang umasa
  rationale: Ipinahihiwatig ng perfect participle at ng unlaping προ- ang naunang pag-asa na may patuloy na kaugnayan. Hindi nito ipinipilit na sila ang pinakaunang pangkat na umasa.
- source_word: ἐν τῷ Χριστῷ
  choice: sa Mesiyas
  rationale: Ang Χριστός ay ginagamit dito bilang titulo ng Pinahiran; ang “Mesiyas” ay nagpapanatili sa kahulugan ng titulo at likas na nagsasaad na sa kanya nakatuon ang kanilang pag-asa.
theological_decisions:
- issue: Kung ang προηλπικότας ay tumutukoy sa mga unang umasa o sa mga dati nang umasa
  choice: mga dati nang umasa
  alternative: mga unang umasa
  rationale: Malinaw ang temporal na pagkauna, ngunit hindi tiyak kung sadyang itinatangi rito ang isang unang pangkat, gaya ng mga Judiong mananampalataya. Pinananatili ng pangunahing salin ang mas maingat na pagbasa, at inilalagay sa talababa ang mas tiyak na kahulugan.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang “Mesiyas” bilang makahulugang titulo sa halip na transliterasyong “Cristo.” Ang “maging dahilan upang purihin” ay piniling natural na anyo para sa paulit-ulit na pormulang εἰς ἔπαινον, nang hindi dinaragdagan ng ideyang wala sa teksto.
