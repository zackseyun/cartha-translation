  source_fidelity: Tumpak na isinasalin ng pangunahing teksto ang ἥτις bilang “na siyang,” τὸ σῶμα αὐτοῦ bilang “katawan niya,” at τὸ πλήρωμα bilang “ang kapuspusan.” Ang “ng pumupuno sa lahat ng bagay sa lahat” ay maingat na pinananatili ang saklaw ng τὰ πάντα at ang sadyang hindi nilulutas na kalabuan ng ἐν πᾶσιν. Wasto rin ang talababa tungkol sa posibleng pasibong pagbasa ng πληρουμένου.
