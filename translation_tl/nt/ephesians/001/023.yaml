translation:
  language: tl
  text: na siyang katawan niya, ang kapuspusan ng pumupuno sa lahat ng bagay sa lahat.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas literal: “ang kapuspusan ng pumupuno sa lahat sa lahat.”'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring unawain ang participle bilang “ang pinupuno,” bagaman mas karaniwang ipinapalagay rito ang kahulugang “ang pumupuno.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἥτις
  choice: na siyang
  rationale: Tumutukoy ito pabalik sa iglesya sa talata 22. Likas sa Tagalog ang “na siyang” at bahagyang naipahihiwatig ang katangiang-diin ng ἥτις.
- source_word: τὸ σῶμα αὐτοῦ
  choice: katawan niya
  rationale: Tuwirang pinananatili ang karaniwang metapora ni Pablo tungkol sa kaugnayan ng iglesya kay Cristo.
- source_word: τὸ πλήρωμα
  choice: ang kapuspusan
  rationale: Pinananatili ng “kapuspusan” ang siksik at bukás na kahulugan ng salitang Griyego, sa halip na agad itong ipaliwanag bilang “yaong pinupuno” o “kaganapan.”
- source_word: τοῦ ... πληρουμένου
  choice: ng pumupuno
  rationale: Bagaman anyong middle/passive ang participle, pinakamalamang sa konteksto ang aktibong diwang “pumupuno.” Inilalagay sa talababa ang posibleng pasibong pagbasa.
- source_word: τὰ πάντα
  choice: sa lahat ng bagay
  rationale: Ipinahahayag ang malawak at kosmikong saklaw ng neuter plural nang malinaw sa karaniwang Tagalog.
- source_word: ἐν πᾶσιν
  choice: sa lahat
  rationale: Mas tuwirang tinutumbasan nito ang sadyang maikli at malabong pariralang Griyego kaysa sa mas interpretibong “sa lahat ng paraan.”
theological_decisions:
- issue: Kahulugan ng πλήρωμα kaugnay ng iglesya at ni Cristo
  choice: Tinawag ang iglesya na katawan ni Cristo at “ang kapuspusan,” nang hindi tinutukoy kung ito ang pinupuno niya o, sa isang diwa, ang bumubuo sa kaganapan ng metapora ng katawan.
  alternative: “yaong pinupuno” o “kaganapan”
  rationale: May tunay na interpretatibong tensiyon ang Griyego; pinananatili ng “kapuspusan” ang pagiging bukás nito.
- issue: Tinig o diwa ng πληρουμένου
  choice: 'Aktibong diwa: “ang pumupuno.”'
  alternative: “ang pinupuno” o “ang patuloy na pinupuno”
  rationale: Pinakamalamang sa konteksto ang aktibo o deponenteng gamit, ngunit posible sa anyong gramatikal ang pasibong pagbasa kaya itinatala ito sa talababa.
- issue: Saklaw ng ἐν πᾶσιν
  choice: “sa lahat,” na pinananatili ang pormal na kalabuan.
  alternative: “sa lahat ng paraan” o “sa bawat isa”
  rationale: Hindi tiyak kung ang parirala ay tumutukoy sa lahat ng bagay, lahat ng tao, o sa bawat paraan; hindi ito dapat paliitin nang walang sapat na batayan.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang “kapuspusan” dahil mahalaga ang leksikal at teolohikal na pagiging bukás nito. Ang “sa lahat” ay sadyang pormal upang huwag lutasin ang kalabuan ng ἐν πᾶσιν.
