  source_fidelity: Ang “pag-asang dulot ng kanyang pagtawag” ay mas makitid kaysa sa τῆς κλήσεως αὐτοῦ, sapagkat tahasan nitong ginagawang sanhi ang pagtawag. Ang “kung gaano kasagana ang kaluwalhatian” ay hindi rin malinaw na naipapahayag ang pangngalang πλοῦτος (“kayamanan”).
  naturalness: Likas at angkop sa makabagong Filipino ang metapora at ang register ng draft. Mas malinaw at mas malapit sa ayos ng Griyego ang “kung ano ang pag-asa ng kanyang pagtawag” at “kung ano ang kayamanan ng kaluwalhatian ng kanyang pamana.”
  terminology: Ang “mga mata ng inyong puso,” “pag-asa,” “kaluwalhatian,” “pamana,” at “mga banal” ay angkop at nagpapanatili ng mahahalagang terminong Pauline. Pinanatili ang kalabuan ng “kanyang pamana.”
