source:
  edition: SBLGNT
  text: πεφωτισμένους τοὺς ὀφθαλμοὺς τῆς καρδίας ὑμῶν εἰς τὸ εἰδέναι ὑμᾶς τίς ἐστιν ἡ ἐλπὶς τῆς κλήσεως αὐτοῦ, ⸀τίς ὁ πλοῦτος τῆς δόξης τῆς κληρονομίας αὐτοῦ ἐν τοῖς ἁγίοις,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/018.yaml
  text: having the eyes of your heart enlightened[a], so that you may know what is the hope of his calling, what is the wealth of the glory of his inheritance among the saints[b],
translation:
  language: tl
  text: na naliwanagan ang mga mata ng inyong puso, upang malaman ninyo kung ano ang pag-asa ng kanyang pagtawag, at kung ano ang kayamanan ng kaluwalhatian ng kanyang pamana sa gitna ng mga banal[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang kanyang pamana na nasa mga banal” o “ang pamanang ibinibigay niya sa mga banal.” Hindi tahasang nililinaw ng Griyego kung ang pamana ay pag-aari ng Diyos o pamanang mula sa kanya.
    reason: alternative_reading
lexical_decisions:
- source_word: πεφωτισμένους
  choice: na naliwanagan
  rationale: Pinananatili ang balintiyak na diwa at ang bunga ng isang naganap nang pagbibigay-liwanag, habang likas na iniuugnay ang parirala sa nagpapatuloy na pangungusap.
- source_word: τοὺς ὀφθαλμοὺς τῆς καρδίας ὑμῶν
  choice: ang mga mata ng inyong puso
  rationale: Pinananatili ang matingkad na metapora ni Pablo sa halip na palitan ito ng paliwanag na gaya ng “isip” o “pang-unawa.”
- source_word: εἰς τὸ εἰδέναι ὑμᾶς
  choice: upang malaman ninyo
  rationale: Likas na ipinahahayag sa Tagalog ang layuning taglay ng konstruksiyong infinitive.
- source_word: ἡ ἐλπὶς
  choice: ang pag-asa
  rationale: Karaniwan at angkop na salin para sa tiyak at may-pagtitiwalang paghihintay sa gamit ni Pablo.
- source_word: τῆς κλήσεως αὐτοῦ
  choice: dulot ng kanyang pagtawag
  rationale: Ipinahahayag ang kaugnayan ng pag-asa sa pagtawag ng Diyos nang hindi pinahahaba ang parirala bilang tahasang paliwanag.
- source_word: ὁ πλοῦτος τῆς δόξης
  choice: kung gaano kasagana ang kaluwalhatian
  rationale: Natural na Tagalog para sa Semitikong/genitibong ekspresyong tumutukoy sa napakalaking kasaganaan ng kaluwalhatian, habang hindi inaalis ang dalawang pangunahing konsepto.
- source_word: τῆς κληρονομίας αὐτοῦ
  choice: ng kanyang pamana
  rationale: Pinananatili ang pormal na kalabuan kung ito ay pamanang pag-aari ng Diyos o pamanang ibinibigay niya.
- source_word: ἐν τοῖς ἁγίοις
  choice: sa gitna ng mga banal
  rationale: Likas na salin ng ἐν sa kolektibong konteksto; pinananatili ang katawagang “mga banal” at hindi nililimitahan ang parirala sa isang tiyak na interpretasyon.
theological_decisions:
- issue: Kung ang “kanyang pamana sa gitna ng mga banal” ay tumutukoy sa bayang itinuturing ng Diyos na kanyang pamana o sa pamanang ibinibigay niya sa mga mananampalataya
  choice: kanyang pamana sa gitna ng mga banal
  alternative: pamanang ibinibigay niya sa mga banal; kanyang pamana na nasa mga banal
  rationale: Maaaring tumukoy ang genitibo at ang pariralang may ἐν sa higit sa isang kaugnay na diwa. Hindi nilulutas ng pangunahing teksto ang teolohikal na tensiyong hindi tahasang nilulutas ng Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang metaporang “mga mata ng inyong puso” at ang katawagang “mga banal.” Ang pambungad na “na naliwanagan” at pangwakas na kuwit ay sumasalamin sa pagiging bahagi nito ng mas mahabang pangungusap sa konteksto.
