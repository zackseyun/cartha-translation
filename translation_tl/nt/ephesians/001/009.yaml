  text: having made known to us the mystery of his will[a], according to his good pleasure, which he purposed in himself
translation:
  language: tl
  text: Ipinaalam niya sa atin ang hiwaga ng kanyang kalooban, ayon sa kanyang mabuting kaluguran, na nilayon niya sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “na nilayon niya kay Cristo”; inuunawa naman ng ilan ang “sa kanya” bilang “sa kanyang sarili.”
    reason: Pinananatili ang dalawang pangunahing pagkaunawa sa tinutukoy ng ἐν αὐτῷ.
lexical_decisions:
- source_word: γνωρίσας
  choice: Ipinaalam niya
  rationale: Ang aorist active participle ay nakaugnay sa Diyos bilang paksa ng mas mahabang pangungusap. Ginawang likas na pandiwang Filipino ang anyo, habang pinananatili ang diwang pagpapabatid ng dati nang nakakubling bagay.
- source_word: ἡμῖν
  choice: sa atin
  rationale: 'Tuwirang ipinapakita ang dative bilang di-tuwirang layon: sa atin ipinaalam ang hiwaga.'
- source_word: μυστήριον
  choice: hiwaga
  rationale: Ang “hiwaga” ay tumutukoy rito sa layunin ng Diyos na dating nakakubli ngunit ngayo'y ipinabatid, hindi sa isang bagay na kailanma'y hindi mauunawaan.
- source_word: τοῦ θελήματος αὐτοῦ
  choice: ng kanyang kalooban
  rationale: Ang “kalooban” ang tuwirang katumbas ng θέλημα at hindi nito ipinaghahalo ang salita sa προέθετο, na tumutukoy sa paglalayon.
- source_word: κατὰ τὴν εὐδοκίαν αὐτοῦ
  choice: ayon sa kanyang ikinalulugod
  rationale: Ipinahahayag nito ang pamantayan o pagkakatugma na dala ng κατά at ang personal na pagkagusto o mabuting kaluguran na nasa εὐδοκία, nang hindi ito ginagawang kapareho lamang ng “layunin.”
- source_word: ἣν προέθετο
  choice: na nilayon niya
  rationale: Ang “nilayon” ay natural na Filipino para sa kusang pagtatakda o pagpapanukala ng Diyos. Ang pambabaeng panghalip na ἣν ay tumutukoy sa εὐδοκίαν; sa Filipino, ang “na” ay likas na nagdurugtong sa parirala.
- source_word: ἐν αὐτῷ
  choice: sa kanya
  rationale: Pinananatili ang payak na panghalip ng Griyego at hindi tahasang nilulutas sa pangunahing teksto kung ang tinutukoy ay si Cristo o kung ito ay inuunawang pabalik sa Diyos bilang “sa kanyang sarili.”
theological_decisions:
- issue: Ang tinutukoy ng ἐν αὐτῷ
  choice: Pinanatili sa pangunahing teksto ang “sa kanya.”
  alternative: “kay Cristo” o “sa kanyang sarili”
  rationale: Maaaring iugnay ang panghalip kay Cristo batay sa malapit na konteksto, ngunit inuunawa rin ito ng ilan bilang reflexive na tumutukoy sa Diyos. Hindi nilulutas ng salin ang tunay na kalabuan ng parirala.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “hiwaga” at “kalooban” bilang pamilyar ngunit dignidad na mga terminong biblikal. Ang participle ay ginawang finite verb upang maging likas sa Filipino, samantalang ang ugnayan nito sa mas mahabang pangungusap ay nananatiling mauunawaan sa konteksto.
