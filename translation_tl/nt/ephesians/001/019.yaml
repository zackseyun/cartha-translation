  yaml_path: translation/nt/ephesians/001/019.yaml
  text: and what is the surpassing greatness of his power toward us who believe[a], according to the working of the might of his strength
translation:
  language: tl
  text: at kung gaano kalaki ang kapangyarihan niyang higit sa karaniwan, na nakatuon sa atin na sumasampalataya[a], ayon sa pagkilos ng puwersa ng kaniyang lakas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa atin na sumasampalataya.” Ang Griyego ay literal na nagpapahiwatig ng direksiyon na “patungo sa atin”; isinasalin naman ito ng ilan nang mas mapagpaliwanag bilang kapangyarihan ng Diyos na “kumikilos sa atin.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπερβάλλον μέγεθος
  choice: kung gaano kadakila ... higit sa lahat
  rationale: Ipinahahayag nito ang sukdulang kadakilaan ng kapangyarihan sa natural na Filipino nang hindi pinalalakas tungo sa mas tiyak na ideyang ‘walang hanggan’ o ‘hindi masusukat.’
- source_word: δύναμις
  choice: kapangyarihan
  rationale: Ito ang karaniwang malinaw na katumbas para sa kakayahan o kapangyarihang may bisa, at naiiba sa kasunod na κράτος at ἰσχύς.
- source_word: εἰς ἡμᾶς
  choice: nakatuon sa atin
  rationale: Pinananatili nito ang direksiyon ng εἰς patungo sa mga sumasampalataya, nang hindi agad ipinapakahulugang panloob lamang ang pagkilos o benepisyo lamang para sa kanila.
- source_word: τοὺς πιστεύοντας
  choice: na sumasampalataya
  rationale: Natural na pandiwang anyo ito sa Filipino at pinananatili ang kilos ng participle sa halip na gawing katawagang ‘mga mananampalataya.’
- source_word: κατά
  choice: ayon sa
  rationale: 'Ipinakikita ang pagtutugma o pamantayan: ang kapangyarihang nakatuon sa atin ay kaayon ng inilalarawang banal na pagkilos.'
- source_word: ἐνέργεια
  choice: pagkilos
  rationale: Malinaw na tumutukoy sa aktibo at mabisang paggawa, nang iniiwasan ang makabagong teknikal na kahulugan ng ‘enerhiya.’
- source_word: κράτος
  choice: puwersa
  rationale: Inihahayag ang nahahayag o naisasagawang lakas at pinananatiling naiiba sa ἰσχύς.
- source_word: ἰσχύς
  choice: lakas
  rationale: Natural na katumbas para sa taglay na lakas; kasama ng ‘puwersa,’ pinananatili nito ang sunod-sunod na magkakalapit na salitang ginamit ni Pablo.
theological_decisions:
- issue: Ang sunod-sunod na δύναμις / ἐνέργεια / κράτος / ἰσχύς
  choice: 'Pinanatili bilang magkakaugnay ngunit magkakaibang mga salita: ‘kapangyarihan ... pagkilos ... puwersa ... lakas.’'
  alternative: Pagsamahin bilang ‘makapangyarihang pagkilos ng kaniyang lakas’ o ‘buong puwersa ng kaniyang kapangyarihan.’
  rationale: Sadyang pinagsama-sama ni Pablo ang magkakalapit na mga salita upang idiin ang laki at bisa ng kapangyarihan ng Diyos. Ang pagpapanatili sa mga ito ay umiiwas sa pagliit ng retorikal na diin o sa paglalagay ng isang teknikal na sistemang teolohikal sa bawat salita.
- issue: Direksiyon ng kapangyarihan sa εἰς ἡμᾶς
  choice: ‘nakatuon sa atin na sumasampalataya’
  alternative: ‘kumikilos sa atin na sumasampalataya’ o ‘para sa atin na sumasampalataya’
  rationale: Ang εἰς ay pangunahing nagpapahiwatig ng direksiyon o paglalapat patungo sa atin. Hindi nito sapilitang nilulutas kung panloob na pagkilos o kapakinabangan para sa atin ang pangunahing diin.
translation_notes:
  register: Makabago, marangal, at malinaw na Filipino. Ang pariralang ‘puwersa ng kaniyang lakas’ ay bahagyang masinsin upang mapanatili ang sinadyang pagpapatong-patong ng magkakalapit na salita sa Griyego.
