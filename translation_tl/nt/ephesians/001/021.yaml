  text: ὑπεράνω πάσης ἀρχῆς καὶ ἐξουσίας καὶ δυνάμεως καὶ κυριότητος καὶ παντὸς ὀνόματος ὀνομαζομένου οὐ μόνον ἐν τῷ αἰῶνι τούτῳ ἀλλὰ καὶ ἐν τῷ μέλλοντι·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/021.yaml
  text: far above every rule and authority and power and dominion[a], and every name that is named[c][b], not only in this age but also in the one to come.
translation:
  language: tl
  text: nakatataas nang higit sa bawat pamamahala, kapamahalaan, kapangyarihan, at paghahari[a], at sa bawat pangalang binabanggit[b]—hindi lamang sa kapanahunang ito kundi maging sa darating na kapanahunan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bawat pamunuan, kapamahalaan, kapangyarihan, at pagiging panginoon.” Ang mga salitang Griyego ay maaaring tumukoy sa mga antas o saklaw ng awtoridad, kabilang ang mga kosmiko o espirituwal na kapangyarihan.
    reason: lexical_alternative
  - marker: b
    text: O “bawat titulong ibinibigay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπεράνω
  choice: higit na mataas kaysa
  rationale: Ipinahahayag ang lubos na kataasan at nakaugnay nang natural sa pagkakaluklok kay Cristo sa naunang talata.
- source_word: πάσης ἀρχῆς
  choice: bawat pamamahala
  rationale: Pinananatili ang diwa ng isang uri o saklaw ng naghaharing kapangyarihan nang hindi tahasang nililimitahan sa tao o espirituwal na nilalang.
- source_word: ἐξουσίας
  choice: kapamahalaan
  rationale: Tumutukoy sa awtoridad o karapatang mamahala at nananatiling naiiba sa δύναμις.
- source_word: δυνάμεως
  choice: kapangyarihan
  rationale: Karaniwan at malinaw na salin para sa lakas o kapangyarihan, habang pinananatili ang pagkakaiba nito sa kapamahalaan.
- source_word: κυριότητος
  choice: paghahari
  rationale: Natural na tumutukoy sa kalagayan o saklaw ng pagiging panginoon at hindi kinakailangang tukuyin ang isang partikular na nilalang.
- source_word: παντὸς ὀνόματος ὀνομαζομένου
  choice: bawat pangalang binabanggit
  rationale: Pinananatili ang pag-uulit at malawak na saklaw ng Griyego, na maaaring tumukoy sa anumang pangalan, katayuan, o titulo.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: hindi lamang ... kundi maging
  rationale: Natural na katumbas sa Tagalog ng ugnayang nagbibigay-diin sa dalawang saklaw.
- source_word: ἐν τῷ αἰῶνι τούτῳ ... ἐν τῷ μέλλοντι
  choice: sa panahong ito ... sa darating na panahon
  rationale: Ipinakikita ang temporal na paghahambing ng kasalukuyan at darating na kapanahunan, sa halip na gawing heograpikal na 'sanlibutan'.
theological_decisions:
- issue: Uri ng mga kapangyarihang inililista (ἀρχή, ἐξουσία, δύναμις, κυριότης)
  choice: Isinalin bilang malalawak na kategorya ng pamamahala at kapangyarihan nang hindi tinutukoy kung tao, anghel, o kosmikong kapangyarihan ang mga ito.
  alternative: Tahasang tawagin ang mga ito na mga espirituwal na kapangyarihan o mga antas ng mga anghel.
  rationale: Bagaman maaaring kabilang ang mga kosmiko o espirituwal na kapangyarihan, hindi tahasang nililinaw ng Griyego ang kanilang uri; pinananatili ng salin ang saklaw at tensiyon ng teksto.
- issue: Kahulugan ng παντὸς ὀνόματος ὀνομαζομένου
  choice: bawat pangalang binabanggit
  alternative: bawat titulong ibinibigay
  rationale: Ang literal at malawak na anyo ay hindi nililimitahan ang 'pangalan' sa pormal na titulo lamang.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang magkakaibang terminong “pamamahala,” “kapamahalaan,” “kapangyarihan,” at “paghahari” upang hangga't maaari ay mapanatili ang apat na magkakaugnay ngunit magkakaibang salita sa Griyego.
