    issue: Medyo hindi natural ang “higit na mataas kaysa sa bawat.”
    rationale: Bagaman nauunawaan at tapat sa kahulugan, mas idiomatiko ang “nakatataas nang higit sa bawat,” na naghahayag din ng masidhing kataasan ng ὑπεράνω.
  - severity: low
    issue: Ang “panahon” ay mas malawak kaysa sa temporal-eschatological na αἰών.
    rationale: Ang “kapanahunan” ay mas malapit sa konteksto ng “ang kapanahunang ito” at “ang darating [na kapanahunan]” nang hindi ginagawang heograpikal na sanlibutan.
  - severity: low
    issue: Hindi gaanong natural ang “pagkapanginoon” sa talababa.
    rationale: Ang “pagiging panginoon” ay mas karaniwan at malinaw na katumbas ng lordship.
