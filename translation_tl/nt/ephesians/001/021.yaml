  verdict: revise
  source_fidelity: 'Ang pangunahing diwa at saklaw ng talata ay naipasa nang tapat: ang nakaluklok na Cristo ay nakatataas sa lahat ng uri ng awtoridad at sa bawat pangalan, sa kasalukuyan at darating na kapanahunan. Gayunman, ang “higit na mataas kaysa sa” ay hindi gaanong tuwirang katumbas ng ὑπεράνω at medyo mabigat ang daloy. Ang “nakatataas nang higit sa” ay mas natural habang naipahahayag ang masidhing kataasan.'
  naturalness: Makabago at malinaw ang bokabularyo. Mas natural sa Filipino ang “nakatataas nang higit sa” kaysa “higit na mataas kaysa sa.” Ang “kapanahunang ito ... sa darating” ay pinananatili ang temporal na αἰών nang mas malinaw kaysa sa mas pangkalahatang “panahon.”
  terminology: Napapanatili ang magkakaibang katawagan para sa ἀρχή, ἐξουσία, δύναμις, at κυριότης nang hindi ipinipilit na ang mga ito ay tao o mga espirituwal na nilalang. Ang “paghahari” para sa κυριότης ay katanggap-tanggap bilang malawak na kategorya ng dominion/lordship. Inayos ang alternatibo sa talababa bilang “pagiging panginoon,” na mas malinaw at natural kaysa “pagkapanginoon.”
  issues:
