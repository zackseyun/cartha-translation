id: EPH.1.22
reference: Ephesians 1:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ πάντα ὑπέταξεν ὑπὸ τοὺς πόδας αὐτοῦ, καὶ αὐτὸν ἔδωκεν κεφαλὴν ὑπὲρ πάντα τῇ ἐκκλησίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/022.yaml
  text: And he subjected all things under his feet[a], and gave him as head over all things to the church[b],
translation:
  language: tl
  text: At ipinasakop niya ang lahat ng bagay sa ilalim ng kanyang mga paa[a], at ibinigay siya sa iglesya bilang ulo na nakapangyayari sa lahat ng bagay[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ipinapaalaala ng pananalitang ito ang Awit 8:6, kung saan inilalarawang inilagay ang lahat ng bagay sa ilalim ng mga paa ng pinuno.
    reason: cross_reference
  - marker: b
    text: Maaari ring isalin na “para sa iglesya”; ang datibong τῇ ἐκκλησίᾳ ay maaaring magpahayag ng nakikinabang, hindi lamang ng tumatanggap.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: lahat ng bagay
  rationale: Ipinahahayag ng pangmaramihang anyong neuter ang kabuuan ng mga bagay; pinananatili ng salin ang malawak at pangsansinukob na saklaw.
- source_word: ὑπέταξεν
  choice: ipinasakop
  rationale: Ipinahahayag ng pandiwa ang pagpapailalim sa kapangyarihan ng iba. Likas at malinaw sa modernong Tagalog ang “ipinasakop.”
- source_word: ὑπὸ τοὺς πόδας αὐτοῦ
  choice: sa ilalim ng kanyang mga paa
  rationale: Pinananatili ang kongkretong larawan ng paghahari at pagpapasakop, gayundin ang alusyon sa Awit 8:6.
- source_word: αὐτὸν ἔδωκεν
  choice: ibinigay siya
  rationale: Pinananatili ang karaniwang kahulugan ng δίδωμι at hindi ito tahimik na ginagawang “itinalaga,” upang manatiling bukas ang diwa ng pagbibigay sa o para sa iglesya.
- source_word: κεφαλὴν
  choice: bilang ulo
  rationale: Pinananatili ang metapora ng ulo at malinaw na ipinakikilalang panaguring kaugnay ng “ibinigay siya.”
- source_word: ὑπὲρ πάντα
  choice: na nakapangyayari sa lahat ng bagay
  rationale: Likas na ipinahahayag sa Tagalog ang pagiging higit at may kapangyarihan sa lahat, nang hindi gumagamit ng alanganing literal na pariralang “sa ibabaw ng lahat ng bagay.”
- source_word: τῇ ἐκκλησίᾳ
  choice: sa iglesya
  rationale: Ang datibo ay maaaring tumukoy sa tumatanggap o sa nakikinabang. Ang “sa iglesya” ang pinakadirektang salin at pinananatili sa talababa ang alternatibong “para sa iglesya.”
theological_decisions:
- issue: Ugnayan ng pagkaulo ni Cristo sa lahat ng bagay at sa iglesya
  choice: Ibinigay siya sa iglesya bilang ulo na nakapangyayari sa lahat ng bagay.
  alternative: Ginawa siyang ulo na nakapangyayari sa lahat ng bagay para sa kapakinabangan ng iglesya.
  rationale: Likas na inuugnay ng sintaks ang “ulo” sa “lahat ng bagay,” samantalang ang datibong “sa iglesya” ay maaaring tumukoy sa tumatanggap o nakikinabang. Pinananatili ng salin at talababa ang pangkalahatang paghahari ni Cristo at ang natatanging kaugnayan nito sa iglesya nang hindi nilulutas nang labis ang ambiguwidad.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang imahen ng “ulo” at “sa ilalim ng mga paa,” habang ginawang likas ang ὑπὲρ πάντα bilang “nakapangyayari sa lahat ng bagay.” Inayos ang pagkakalagay ng mga marker ayon sa aktuwal na paksa ng bawat talababa.
