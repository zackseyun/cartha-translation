base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/015.yaml
  text: For this reason[a], I also, having heard of your faith in the Lord Jesus and your love for all the saints[b],
translation:
  language: tl
  text: Dahil dito, ako rin, nang mabalitaan ko ang inyong pananampalataya sa Panginoong Jesus[a] at ang inyong pag-ibig sa lahat ng mga banal[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang inyong pananalig sa Panginoong Jesus”; sa ilang konteksto, ang salitang Griyego ay maaari ring mangahulugang “katapatan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ang inyong pag-ibig para sa lahat ng mga banal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Dahil dito
  rationale: Likas na Filipino itong tumutukoy pabalik sa naunang pagpapala at pinananatili ang ugnayang sanhi o batayan ng tugon ni Pablo.
- source_word: κἀγώ
  choice: ko rin
  rationale: Ipinapahayag ng enclitic na “rin” ang dagdag na diin ng καί + ἐγώ nang hindi nagiging mabigat o di-likas sa Filipino.
- source_word: ἀκούσας
  choice: nang mabalitaan ko
  rationale: Ipinahihiwatig ng aorist participle na narinig o nalaman ni Pablo ang balita bago ang kilos na magpapatuloy sa kasunod na talata; natural sa Filipino ang sugnay na may “nang.”
- source_word: τὴν καθ’ ὑμᾶς πίστιν
  choice: ang inyong pananampalataya
  rationale: Natural na ipinapakita ng “inyong” ang pananampalatayang matatagpuan sa mga mambabasa.
- source_word: πίστιν
  choice: pananampalataya
  rationale: Sa kontekstong may “sa Panginoong Jesus,” pangunahing tumutukoy ito sa kanilang pananalig kay Jesus, habang hindi tuluyang ikinakaila ang posibleng kaugnay na diwa ng katapatan.
- source_word: ἐν τῷ κυρίῳ Ἰησοῦ
  choice: sa Panginoong Jesus
  rationale: Ang “sa” ang natural na katumbas sa Filipino ng relasyong ipinapahayag ng ἐν sa karaniwang pariralang Paulino.
- source_word: κυρίῳ
  choice: Panginoon
  rationale: Pinananatili nito ang mahalagang titulong kristolohikal na κύριος.
- source_word: ἀγάπην
  choice: pag-ibig
  rationale: Karaniwan, malinaw, at marangal na katumbas ng ἀγάπη sa modernong Filipino.
- source_word: εἰς πάντας τοὺς ἁγίους
  choice: sa lahat ng mga banal
  rationale: Ipinapakita ng “sa” ang direksiyon ng pag-ibig tungo sa mga taong tinutukoy, habang pinananatili ang malawak na saklaw ng πάντας.
- source_word: ἁγίους
  choice: mga banal
  rationale: Malinaw nitong pinananatili ang literal na diwa ng “mga itinalaga bilang banal” at iniiwasan ang posibleng makitid na pagkaunawa sa hiram na terminong “mga santo.”
theological_decisions:
- issue: Diwa ng πίστις sa ugnayan ng mga mambabasa kay Jesus
  choice: pananampalataya
  alternative: pananalig; katapatan
  rationale: Ang layon o saklaw na “sa Panginoong Jesus” ay pinakamalinaw na tumutukoy sa kanilang pananampalataya o pananalig. Gayunman, binabanggit sa talababa ang posibleng diwa ng katapatan upang mapanatili ang leksikal na lawak.
- issue: Paglalarawan sa πιστοί bilang relasyong “sa” Panginoong Jesus
  choice: sa Panginoong Jesus
  alternative: kay Panginoong Jesus; ukol sa Panginoong Jesus
  rationale: Pinananatili ng “sa” ang karaniwang Paulinong pananalita at ang ilang posibleng relational o incorporative na lalim ng ἐν nang hindi ito nilulutas bilang direksiyon lamang.
- issue: Pagpapakahulugan sa οἱ ἅγιοι
  choice: mga banal
  alternative: mga hinirang ng Diyos; mga santo
  rationale: Ang “mga banal” ay malapit sa Griyego at tumutukoy sa buong bayan ng Diyos sa kontekstong Paulino, hindi lamang sa isang natatanging uri ng mga kinanonisa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang nakabitin na pangungusap at kuwit sa dulo sapagkat nagpapatuloy ang pangunahing kilos ni Pablo sa talata 16. Ang “nang mabalitaan ko” ay mas natural kaysa sa mahigpit na literal na participial form, at ang “mga banal” ay pinili upang manatiling malapit sa ἅγιοι.
