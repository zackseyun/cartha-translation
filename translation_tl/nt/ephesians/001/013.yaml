id: EPH.1.13
reference: Ephesians 1:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐν ᾧ καὶ ὑμεῖς ἀκούσαντες τὸν λόγον τῆς ἀληθείας, τὸ εὐαγγέλιον τῆς σωτηρίας ὑμῶν, ἐν ᾧ καὶ πιστεύσαντες ἐσφραγίσθητε τῷ πνεύματι τῆς ἐπαγγελίας τῷ ἁγίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/013.yaml
  text: In him[a], you also, after hearing the word of truth, the good news of your salvation, in him, and after believing, were sealed with the Holy Spirit of promise[d][c][b],
translation:
  language: tl
  text: Sa kanya[a], kayo rin—matapos ninyong marinig ang salita ng katotohanan, ang magandang balita tungkol sa inyong kaligtasan[b], at matapos kayong sumampalataya sa kanya—ay tinatakan ng ipinangakong Banal na Espiritu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tumutukoy kay Cristo; maaari ring unawain na “na kung kanino.”
    reason: lexical_alternative
  - marker: b
    text: O “ang ebanghelyo ng inyong kaligtasan.”
    reason: lexical_alternative
  - marker: c
    text: Sa mas literal na anyo, “ang Banal na Espiritu ng pangako.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Sa kanya
  rationale: Tumutukoy ang panghalip kay Cristo sa naunang konteksto. Likas ito sa modernong Tagalog at pinananatili ang diwa ng pakikiisa kay Cristo.
- source_word: καὶ ὑμεῖς
  choice: kayo rin
  rationale: Pinananatili ang dagdag na diin na kabilang din ang mga kausap sa mga pagpapalang binanggit sa naunang mga talata.
- source_word: ἀκούσαντες
  choice: matapos ninyong marinig
  rationale: Ipinahahayag ang karaniwang naunang kilos ng aorist participle nang hindi gumagawa ng higit na tiyak na doktrinal na pagkakasunod-sunod kaysa sa sinasabi ng Griyego.
- source_word: τὸν λόγον τῆς ἀληθείας
  choice: ang salita ng katotohanan
  rationale: Malapit sa anyo ng Griyego, malinaw sa Tagalog, at pinananatili ang kilalang ekspresyong Paulino.
- source_word: τὸ εὐαγγέλιον τῆς σωτηρίας ὑμῶν
  choice: ang magandang balita tungkol sa inyong kaligtasan
  rationale: Ang “magandang balita” ay madaling maunawaan; nililinaw ng “tungkol sa” ang ugnayan nito sa kaligtasan nang hindi isinasara ang posibilidad na ito rin ang balitang naghahatid ng kaligtasan.
- source_word: πιστεύσαντες
  choice: matapos kayong sumampalataya
  rationale: Kaagapay ng naunang participle at natural na nagsasaad na ang pananampalataya ay nauuna sa pangunahing pandiwang “tinatakan,” nang hindi ipinipilit ang isang detalyadong kaayusan ng kaligtasan.
- source_word: ἐσφραγίσθητε
  choice: tinatakan
  rationale: Pinananatili ang larawang may tatak na nagpapahiwatig ng pagmamay-ari, pagpapatunay, o pag-iingat, gayundin ang balintiyak na tinig.
- source_word: τῷ πνεύματι
  choice: ng … Banal na Espiritu
  rationale: Natural na paraan sa Tagalog upang ipahayag ang Espiritu kaugnay ng pagtatatak; hindi nito lubusang nilulutas kung ang dative ay kasangkapan, tagaganap, o bagay na nagsisilbing tatak.
- source_word: τῆς ἐπαγγελίας τῷ ἁγίῳ
  choice: ipinangakong Banal na Espiritu
  rationale: Natural at malinaw na inilalarawan ang Espiritu bilang siyang ipinangako, habang inilalagay sa talababa ang mas pormal at siksik na anyo ng genitive.
theological_decisions:
- issue: Ugnayan ng pakikinig, pagsampalataya, at pagtatatak
  choice: Isinalin ang mga participle bilang “matapos … marinig” at “matapos … sumampalataya,” na nagpapakita ng pagkakasunod-sunod.
  alternative: 'Maaaring unawain nang mas magkasabay: “nang marinig ninyo … at nang sumampalataya kayo.”'
  rationale: Karaniwang ipinahihiwatig ng mga aorist participle bago ang pangunahing pandiwa ang kilos na nauna rito, ngunit hindi ginagamit ang salin upang magtakda ng denominasyonal na pananaw tungkol sa eksaktong sandali ng pagtanggap sa Espiritu.
- issue: Pagkakaugnay ng ikalawang ἐν ᾧ
  choice: 'Iniugnay sa pagsampalataya: “sumampalataya sa kanya.”'
  alternative: Maaaring panatilihing mas hiwalay bilang “at sa kanya, matapos kayong sumampalataya.”
  rationale: Ang pangunahing salin ang pinakanatural sa Tagalog at mahusay na umaayon sa sintaks, samantalang ang saklaw ng parirala at ang diwa ng pagiging “kay Cristo” ay hindi itinatanggi.
- issue: Kahulugan ng “Espiritu ng pangako”
  choice: “ipinangakong Banal na Espiritu”
  alternative: “Banal na Espiritu ng pangako”
  rationale: Ang Griyego ay siksik at maaaring tumukoy sa Espiritung ipinangako o sa Espiritung kaugnay ng pangako. Natural ang pangunahing salin, at pinananatili sa talababa ang mas pormal na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “sumampalataya” at “Banal na Espiritu” bilang pamilyar na bokabularyong biblikal; ginamit ang mga gitling upang luminaw ang mahabang pangungusap nang hindi binabago ang ugnayan ng mga sugnay.
