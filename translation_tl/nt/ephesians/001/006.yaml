  naturalness: Marangal at nauunawaan ang rebisyon sa modernong Filipino Tagalog. Ang “upang maging kapurihan” ay likas sa doxolohikal na rehistro at hindi nangangailangan ng ipinahiwatig na tagaganap.
  terminology: Pinananatili ang “biyaya,” “kaluwalhatian,” at ang titulong “Minamahal.” Ang “sa Minamahal” ay angkop para sa ἐν at hindi idinaragdag ang “Anak” sa pangunahing teksto. Sa talababa lamang, ang pagkakakilanlan sa Anak/Mesiyas ay angkop.
