  text: εἰς ἔπαινον δόξης τῆς χάριτος αὐτοῦ ⸀ἧς ἐχαρίτωσεν ἡμᾶς ἐν τῷ ἠγαπημένῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/006.yaml
  text: to the praise of the glory of his grace[a], with which he has favored us in the Beloved[b],
translation:
  language: tl
  text: upang maging kapurihan ng kaluwalhatian ng kanyang biyaya[a], na sa pamamagitan nito ay pinagkalooban niya tayo ng biyaya sa Minamahal[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “ang kanyang maluwalhating biyaya.” Magkaugnay ang mga salitang Griyego para sa “biyaya” at “pinagkalooban ng biyaya,” kaya binibigyang-diin ang mapagbiyayang pagkilos ng Diyos sa atin.'
    reason: lexical_alternative
  - marker: b
    text: Ang “Minamahal” ay tumutukoy sa Anak, ang Mesiyas.
    reason: cross_reference
lexical_decisions:
- source_word: εἰς ἔπαινον
  choice: upang purihin
  rationale: Ipinahahayag nito ang layunin o bunga ng parirala sa natural na Tagalog; hindi labis na nilulutas kung layunin o resulta ang diin ng εἰς.
- source_word: δόξης τῆς χάριτος αὐτοῦ
  choice: ang kaluwalhatian ng kanyang biyaya
  rationale: Pinananatili ang ugnayang genitibo ng ‘kaluwalhatian’ at ‘biyaya’ sa halip na gawing tahasang ‘maluwalhating biyaya,’ kaya nananatili ang posibleng lawak ng kahulugan.
- source_word: χάριτος
  choice: biyaya
  rationale: Ang ‘biyaya’ ang karaniwan at malinaw na salin para sa mapagpalang kagandahang-loob ng Diyos sa kontekstong ito.
- source_word: ἧς
  choice: na sa pamamagitan nito
  rationale: Malinaw na ibinabalik nito ang panghalip sa ‘biyaya’ at ipinahihiwatig ang instrumental na kaugnayan nang hindi ginagawang hiwalay na kaloob ang biyaya.
- source_word: ἐχαρίτωσεν
  choice: biniyayaan
  rationale: Natural ito sa modernong Tagalog at pinananatili ang sadyang ugnayang-ugat sa ‘biyaya’ (χάρις—χαριτόω), samantalang ipinapahayag ang mapagbiyayang pagkilos ng Diyos sa atin.
- source_word: ἡμᾶς
  choice: tayo
  rationale: Tuwirang layon ng pandiwa at angkop na inklusibong panghalip sa konteksto.
- source_word: ἐν τῷ ἠγαπημένῳ
  choice: sa Minamahal
  rationale: Pinananatili ang payak na ἐν bilang ‘sa’ at ang substantibong titulo bilang ‘Minamahal,’ nang hindi idinaragdag sa pangunahing teksto ang salitang ‘Anak,’ na hindi tahasang narito.
theological_decisions:
- issue: Ugnayan ng χάρις at χαριτόω
  choice: biyaya … biniyayaan
  alternative: biyaya … ipinagkaloob / pinagpakitaan ng kagandahang-loob
  rationale: Pinananatili ng magkaugnay na ‘biyaya’ at ‘biniyayaan’ ang leksikal at teolohikal na pagtutugma sa Griyego, ngunit nananatiling madaling maunawaan sa Tagalog.
- issue: Kahulugan ng δόξης τῆς χάριτος
  choice: kaluwalhatian ng kanyang biyaya
  alternative: kanyang maluwalhating biyaya
  rationale: Hindi tahasang ginagawang pang-uri ang ‘kaluwalhatian’; sa gayon ay napapanatili ang mas pormal at posibleng mas malawak na ugnayan ng dalawang pangngalan.
- issue: Cristolohikal na katawagan na τῷ ἠγαπημένῳ
  choice: sa Minamahal
  alternative: sa kanyang minamahal na Anak / sa Iniibig
  rationale: Malinaw sa konteksto na tumutukoy ito sa Mesiyas, ngunit titulo ang anyo ng Griyego at hindi tahasang sinasabi rito ang ‘Anak.’
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘biniyayaan’ upang likas na mapanatili ang paglalaro sa magkaugnay na salitang χάρις at χαριτόω. Napanatili rin ang pangngalang-titulong ‘Minamahal’ at ang bahagyang bukas na kahulugan ng ‘sa.’
