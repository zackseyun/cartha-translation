  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ τοῖς ἁγίοις τοῖς οὖσιν ⸂[ἐν Ἐφέσῳ]⸃ καὶ πιστοῖς ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/001.yaml
  text: 'Paul[a], an apostle of Messiah Jesus by the will of God[c][b], to the saints who are [in Ephesus] and faithful in Messiah Jesus:'
translation:
  language: tl
  text: Mula kay Pablo, isang apostol ng Mesiyas na si Jesus ayon sa kalooban ng Diyos, para sa mga banal na [nasa Efeso][a] at tapat sa Mesiyas na si Jesus:[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wala sa ilang mahalagang sinaunang manuskrito ang “nasa Efeso.” Dahil dito, maaaring ang liham ay inilaan para sa mas malawak na sirkulasyon at hindi lamang para sa iglesya sa Efeso.
    reason: textual_variant
  - marker: b
    text: O “mga mananampalataya sa Mesiyas na si Jesus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόστολος
  choice: apostol
  rationale: Kinikilalang katawagan ito sa natatanging sugo at awtoridad ni Pablo sa unang iglesya; mas tiyak ito kaysa sa pangkalahatang “sugo.”
- source_word: Χριστοῦ Ἰησοῦ
  choice: ng Mesiyas na si Jesus
  rationale: Dito, ang Χριστός ay gumaganap bilang titulo. Natural sa Tagalog ang hulma na “Mesiyas na si Jesus” at napapanatili nito ang titular na diwa.
- source_word: διὰ θελήματος θεοῦ
  choice: ayon sa kalooban ng Diyos
  rationale: Sa pormula ng pagkahirang, ipinahihiwatig ng διά na ang pagiging apostol ni Pablo ay nagmula at naaayon sa kalooban ng Diyos; ito ang natural na katumbas sa Tagalog.
- source_word: ἁγίοις
  choice: mga banal
  rationale: Tumutukoy ito sa mga taong ibinukod para sa Diyos bilang isang pamayanan, hindi sa isang natatanging uri lamang ng mga mananampalataya.
- source_word: τοῖς οὖσιν
  choice: na nasa
  rationale: Direkta at natural nitong inuugnay ang mga tinutukoy na banal sa lugar na kasunod.
- source_word: '[ἐν Ἐφέσῳ]'
  choice: '[Efeso]'
  rationale: Pinananatili sa panaklong parisukat ang tekstuwal na pag-aalinlangan sa pangalan ng lugar.
- source_word: πιστοῖς
  choice: mga tapat
  rationale: Pinananatili nito ang posibleng diwa ng katapatan o pagiging mapagkakatiwalaan nang hindi isinasara ang posibilidad na ang salita ay nangangahulugang “mga mananampalataya.”
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: sa Mesiyas na si Jesus
  rationale: Ang “sa” ay natural na Tagalog para sa ugnayan o pakikipag-isa na ipinahihiwatig ng ἐν, habang pinananatiling titulo ang “Mesiyas.”
theological_decisions:
- issue: Pagpapakahulugan sa Χριστός sa pambungad ni Pablo
  choice: Mesiyas
  alternative: Cristo
  rationale: Malinaw pa rito ang katangian nito bilang titulo, kaya “Mesiyas” ang pinili sa halip na ituring itong bahagi lamang ng pangalan.
- issue: Katayuan ng ἐν Ἐφέσῳ
  choice: Isinama bilang [Efeso] at ipinaliwanag sa talababa
  alternative: Alisin ang “Efeso”
  rationale: Wala ang mga salitang ito sa ilang mahalagang sinaunang manuskrito. Ang panaklong parisukat ay hayagang nagpapanatili sa tekstuwal na kawalang-katiyakan.
- issue: Diwa ng πιστοῖς
  choice: mga tapat
  alternative: mga mananampalataya
  rationale: Maaaring tumukoy ang salita sa katapatan o sa mga sumasampalataya. Pinili ang “mga tapat,” ngunit inilagay sa talababa ang tunay na alternatibo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “Mula kay … para sa …” upang maging natural ang pormula ng sinaunang liham. Ang “mga banal” ay pinanatili bilang panlahatang katawagan sa sambayanan ng Diyos, hindi bilang teknikal na titulo para sa piling indibidwal.
