lexical_decisions:
- source_word: ἣν ἐνήργηκεν
  choice: na pinapangyari niyang kumilos
  rationale: Tumutukoy ang panghalip na ἣν sa kapangyarihang binanggit sa naunang talata, at ipinapahayag ng ἐνήργηκεν ang mabisa at aktibong paggawa nito. Natural sa Filipino ang konstruksiyong ito habang pinananatili ang ugnayan sa konteksto.
- source_word: ἐν τῷ Χριστῷ
  choice: sa Mesiyas
  rationale: Titular ang Χριστός dito. Ang “sa Mesiyas” ay natural na pagpapahayag ng larangan o taong pinakikilos ng kapangyarihan, nang hindi ginagawang simpleng pangalan ang titulo.
- source_word: ἐγείρας αὐτὸν ἐκ νεκρῶν
  choice: nang buhayin niya ito mula sa mga patay
  rationale: Ipinahahayag ng aorist participle ang kalakip na pangyayari o paraan. Malinaw at natural ang “nang buhayin,” at pinananatili ng “mula sa mga patay” ang maramihang νεκρῶν at karaniwang wika ng muling pagkabuhay.
- source_word: καθίσας ἐν δεξιᾷ αὐτοῦ
  choice: at paupuin sa kanyang kanan
  rationale: Ang causative na “paupuin” ay angkop sa transitive na καθίσας. Ang “sa kanyang kanan” ay idiomatikong tumutukoy sa marangal na puwesto at awtoridad.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: sa kalangitan
  rationale: Substantival ang pangmaramihang neuter adjective at tumutukoy sa makalangit na saklaw. Ang “sa kalangitan” ay maikli, natural, at malawak ang saklaw sa modernong Filipino.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστῷ
  choice: Mesiyas
  alternative: Cristo
  rationale: Nananatiling malinaw ang katangian nitong titulo at ang kaugnayan nito sa mesiyanikong pag-asa; hindi kailangang tratuhin bilang pangalang pantangi lamang.
- issue: Pagpapakahulugan sa ἐν τοῖς ἐπουρανίοις
  choice: sa kalangitan
  alternative: sa mga makalangit na dako
  rationale: Malinaw na ipinahahayag ng pangunahing salin ang makalangit na saklaw, samantalang pinananatili sa talababa ang mas literal na locative at plural na anyo nang hindi ipinapalagay na magkakahiwalay na pisikal na lugar ang tinutukoy.
- issue: Ugnayan ng mga participle sa pangunahing pandiwa
  choice: nang buhayin ... at paupuin
  alternative: sa pamamagitan ng pagbuhay ... at pagpapaupo
  rationale: Pinananatili ng “nang” ang posibleng temporal o attendant-circumstance na ugnayan nang hindi mahigpit na nilulutas bilang paraan lamang.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “Mesiyas” bilang titulo at ang “ito” bilang panghalip kay Cristo upang maiwasan ang sunod-sunod na malabong “niya,” habang nananatiling malinaw sa konteksto ang tinutukoy.
