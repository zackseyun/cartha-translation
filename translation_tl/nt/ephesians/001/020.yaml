  naturalness: Hindi natural sa modernong Filipino ang “na pinapangyari niyang kumilos”; gayundin, hindi kumpleto at hindi angkop ang aspekto ng “at paupuin.” Mas malinaw at marangal ang “na ipinamalas niya sa Mesiyas nang buhayin niya siya ... at pinaupo niya siya ...”.
  terminology: Ang “Mesiyas” ay angkop para sa titular na Χριστῷ. Ang “mga makalangit na dako” ay mas direktang sumasalamin sa plural at locative na ἐν τοῖς ἐπουρανίοις kaysa sa payak na “kalangitan.”
