  text: which he worked in the Messiah when he raised him from the dead and seated him at his right hand in the heavenly places[b][a],
translation:
  language: tl
  text: na ipinamalas niya sa Mesiyas nang buhayin niya siya mula sa mga patay at pinaupo niya siya sa kanyang kanan sa mga makalangit na dako.[a]
