  text: προορίσας ἡμᾶς εἰς υἱοθεσίαν διὰ Ἰησοῦ Χριστοῦ εἰς αὐτόν, κατὰ τὴν εὐδοκίαν τοῦ θελήματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/005.yaml
  text: having predestined us for adoption through Jesus the Messiah to himself[a], according to the good pleasure of his will[c][b],
translation:
  language: tl
  text: Itinalaga na niya tayo noon pa upang ampunin niya bilang kanyang mga anak sa pamamagitan ni Jesus na Mesiyas para sa kanyang sarili,[a] ayon sa ikinalulugod ng kanyang kalooban.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tungo sa kanyang sarili.” Maaaring ipahiwatig ng pariralang Griyego ang hantungan—tungo sa Diyos—o ang layunin—para sa kanyang sarili.
    reason: lexical_alternative
  - marker: b
    text: O “ayon sa mabuting kalooban ng kanyang kalooban.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προορίσας
  choice: Itinalaga na niya tayo nang una
  rationale: Ipinahahayag ng προορίζω ang naunang pagtatalaga o pagpapasya. Pinananatili ng salin ang diwang “nang una” nang hindi nagdaragdag ng isang tiyak na sistemang teolohikal; ang tahasang pandiwa ay ginamit upang maging likas sa Filipino sa loob ng mahabang pangungusap ng Efeso 1:3–14.
- source_word: εἰς υἱοθεσίαν
  choice: upang ampunin bilang mga anak
  rationale: Ang υἱοθεσία ay tumutukoy sa pagkakalagay sa katayuan ng anak, lalo na sa legal na karapatan ng tagapagmana. Ang “bilang mga anak” ay mas malinaw kaysa “pag-aampon” lamang at likas na nauunawaan bilang saklaw ang lahat ng mananampalataya.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: sa pamamagitan ni Jesus na Mesiyas
  rationale: Ang διά na may genitive ay nagsasaad ng paraan o tagapamagitan. Isinalin ang Χριστός bilang titulong “Mesiyas,” hindi bilang apelyido.
- source_word: εἰς αὐτόν
  choice: para sa kanyang sarili
  rationale: Maaaring tukuyin ng εἰς αὐτόν ang Diyos bilang hantungan (“tungo sa kanya”) o ang layunin (“para sa kanyang sarili”). Pinili ang ikalawa dahil natural ito sa Filipino, habang itinatala sa talababa ang tunay na ambiguwidad.
- source_word: κατὰ τὴν εὐδοκίαν
  choice: ayon sa mabuting kalooban
  rationale: Ang κατά ay “ayon sa” o “alinsunod sa,” at ang εὐδοκία ay mabuting kasiyahan, pagsang-ayon, o layuning kinalulugdan. Ang “mabuting kalooban” ay dignificado at natural sa Filipino.
- source_word: τοῦ θελήματος αὐτοῦ
  choice: ng kanyang nais
  rationale: Pinananatili nito ang θέλημα bilang ang nais o kalooban ng Diyos at iniiwasan ang paulit-ulit at mabigat na “mabuting kalooban ng kanyang kalooban.”
theological_decisions:
- issue: Ang doktrinal na pinagtatalunang προορίσας
  choice: Itinalaga na niya tayo nang una
  alternative: Ipinasiya na niya nang una para sa atin
  rationale: Pinananatili ang tahasang ideya ng naunang pagtatalaga ngunit hindi ipinapaliwanag kung paano ito nauugnay sa kalayaan, pananampalataya, o pagpili; nananatili ang teolohikal na tensiyon ng teksto.
- issue: Ang may kasariang legal na diwa ng υἱοθεσία
  choice: ampunin bilang mga anak
  alternative: ampunin
  rationale: Ipinakikita ng “bilang mga anak” ang katayuang pampamilya at karapatan sa mana na nakapaloob sa terminong Griyego, habang ang pangmaramihang “mga anak” sa Filipino ay likas na maaaring tumukoy sa babae at lalaki.
- issue: Ang titulo na Χριστοῦ
  choice: Mesiyas
  alternative: Cristo
  rationale: Isinasalin ang kahulugan ng titulo sa halip na ituring itong bahagi lamang ng pangalan.
- issue: Ang ambiguwidad ng εἰς αὐτόν
  choice: para sa kanyang sarili
  alternative: tungo sa kanyang sarili
  rationale: Parehong maaaring ipahayag ng εἰς ang layunin at direksiyon. Pinili ang mas natural na pangunahing salin at pinanatili sa talababa ang alternatibo.
translation_notes:
  register: Modernong Filipino na dignificado at madaling maunawaan. Ginamit ang “Jesus na Mesiyas” upang malinaw na titulo ang Mesiyas. Iniwasan ang sobrang teknikal na “predestinasyon,” ngunit pinanatili ang lakas ng προορίσας sa “itinalaga…nang una.” Ang berso ay bahagi ng nagpapatuloy na pangungusap mula sa naunang talata.
