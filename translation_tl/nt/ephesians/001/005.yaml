revisions:
- from: Itinalaga na niya tayo nang una upang ampunin bilang mga anak sa pamamagitan ni Jesus na Mesiyas para sa kanyang sarili,[a] ayon sa mabuting kalooban ng kanyang nais.[b]
  to: Itinalaga na niya tayo noon pa upang ampunin niya bilang kanyang mga anak sa pamamagitan ni Jesus na Mesiyas para sa kanyang sarili,[a] ayon sa ikinalulugod ng kanyang kalooban.[b]
  rationale: Ang rebisyon ay naglilinaw na ang Diyos ang umaampon sa atin, inaayos ang di-likas na “nang una,” at mas tapat na isinasalin ang εὐδοκίαν τοῦ θελήματος αὐτοῦ. Pinananatili nito ang anyong participial/naunang kilos ng Griyego sa pamamagitan ng “Itinalaga na niya tayo noon pa,” ang katayuang pagiging anak sa “bilang kanyang mga anak,” at ang hindi tiyak na direksiyon o layunin ng εἰς αὐτόν sa pangunahing salin at talababa.
