source:
  edition: SBLGNT
  text: Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ εὐλογήσας ἡμᾶς ἐν πάσῃ εὐλογίᾳ πνευματικῇ ἐν τοῖς ἐπουρανίοις ἐν Χριστῷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/003.yaml
  text: Blessed be the God and Father of our Lord Jesus the Messiah[a], who has blessed us with every spiritual blessing in the heavenly realms in Messiah[c][b],
translation:
  language: tl
  text: Purihin ang Diyos at Ama ng ating Panginoong Jesus na Mesiyas[c], na nagkaloob sa atin ng bawat pagpapalang espirituwal[a] sa mga makalangit na dako[b], kay Mesiyas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bawat pagpapalang mula sa Espiritu.” Ang pang-uri sa Griyego ay maaaring mangahulugang espirituwal sa malawak na diwa o yaong nauukol sa Espiritu.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa kalangitan.”
    reason: lexical_alternative
  - marker: c
    text: 'Tradisyonal na salin: “Jesu-Cristo” at “kay Cristo.” Isinalin dito ang Griyegong titulong Χριστός bilang “Mesiyas” upang maipakita ang kahulugan nito.'
    reason: alternative_reading
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: Purihin
  rationale: Ang pang-uri ay ginagamit bilang pormula ng pagpupuri. Natural at marangal sa modernong Tagalog ang “Purihin ang Diyos,” at malinaw nitong ipinahahayag ang pagpupuring iniuukol sa Diyos.
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: ang Diyos at Ama
  rationale: Pinananatili ang dalawang magkaugnay na katawagan sa iisang tinutukoy, gaya ng kayarian ng Griyego.
- source_word: τοῦ κυρίου ἡμῶν
  choice: ng ating Panginoon
  rationale: Ang “Panginoon” ang karaniwang katumbas ng κύριος bilang kristolohikal na titulo; ikinakabit ang pang-angkop sa natural na anyong “Panginoong” bago ang pangalan.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesu-Cristo
  rationale: Ang “Cristo” ay nakaugaliang salin-titulo sa Tagalog para sa Χριστός at natural sa pariralang “Jesu-Cristo”; hindi ito itinuturing na simpleng pangalan sa paliwanag.
- source_word: ὁ εὐλογήσας ἡμᾶς
  choice: na nagkaloob sa atin
  rationale: Sa Tagalog, ang “nagkaloob ... ng pagpapala” ay malinaw at natural na naghahatid ng diwa ng εὐλογέω nang hindi inuulit nang alanganin ang salitang “pagpalain.”
- source_word: ἐν πάσῃ εὐλογίᾳ πνευματικῇ
  choice: ng bawat pagpapalang espirituwal
  rationale: Ang “bawat” ay nagpapanatili sa distributibong lawak ng πάσῃ, at ang “espirituwal” ay hindi labis na nagpapasya kung tahasang tumutukoy ang pang-uri sa Espiritu.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: sa kalangitan
  rationale: Natural na Tagalog ito para sa makalangit na saklaw o dako. Nasa talababa ang mas tahasang lokatibong alternatibo upang mapanatili ang saklaw ng parirala.
- source_word: ἐν Χριστῷ
  choice: kay Cristo
  rationale: Ang personal na “kay” ay natural bago ang titulo ni Jesus. Pinananatili nito ang maikli ngunit teolohikal na malaman na Pauline formula nang hindi ito ipinapaliwanag sa mismong teksto.
theological_decisions:
- issue: Kahulugan ng πνευματικῇ
  choice: espirituwal
  alternative: mula sa Espiritu / ukol sa Espiritu
  rationale: Maaaring malawak na mangahulugang espirituwal ang pang-uri o mas tiyak na tumukoy sa Espiritu. Pinananatili ng pangunahing teksto ang kalabuan, at inilalahad ng talababa ang mas tiyak na posibilidad.
- issue: Paglilipat ng Χριστός
  choice: Cristo
  alternative: Mesiyas
  rationale: Sa modernong Tagalog, “Cristo” ang matatag at dignidad na salin-titulo ng Χριστός sa mga pormulang “Jesu-Cristo” at “kay Cristo.” Ang “Mesiyas” ay wastong pagpapakahulugan sa titulo ngunit magiging mas lantad na interpretatibo rito.
- issue: Diwa ng ἐν Χριστῷ
  choice: kay Cristo
  alternative: sa pakikipag-isa kay Cristo
  rationale: Hindi pinalalawak sa pangunahing teksto ang siksik na pariralang Pauline. Ang literal at natural na “kay Cristo” ay nagpapanatili ng teolohikal na tensiyon at hindi pumipili ng iisang paliwanag tungkol sa pakikipag-isa kay Cristo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang tradisyonal ngunit buhay na pormulang “Purihin ang Diyos,” iniwasan ang salitang masyadong teknikal, at pinanatili ang siksik na pariralang “kay Cristo.” Lahat ng marker ng talababa ay nasa pangunahing teksto.
