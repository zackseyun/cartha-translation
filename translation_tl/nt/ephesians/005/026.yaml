  source_fidelity: Tumpak ang pangunahing pag-unawa sa layuning ipinahahayag ng ἵνα, sa tinutukoy ng αὐτήν, at sa larawang paglilinis sa pamamagitan ng paghuhugas ng tubig. Gayunman, ang “matapos niya itong linisin” ay ginagawang tahasang sunod-sunod sa panahon ang participle na καθαρίσας. Bagaman posible ang antecedent na diwa, mas mabuting panatilihin sa Tagalog ang participial na kaugnayan nang hindi ito labis na ginagawang temporal. Ang “pabanalin” ay mas tuwirang katumbas ng ἁγιάσῃ kaysa “gawin ... banal.”
  naturalness: Natural ang karamihan ng pangungusap, ngunit mas maayos at mas malapit sa estruktura ng Griyego ang “matapos itong linisin” kaysa “matapos niya itong linisin,” dahil hindi kailangang ulitin ang ahente. Ang “kasama ang salita” ay mas karaniwang makabagong Tagalog kaysa “kalakip ang salita,” habang sapat na pinananatili ang hindi tiyak na ugnayan ng ἐν ῥήματι.
  terminology: Ang “pabanalin,” “linisin,” “paghuhugas,” at “salita” ay angkop na mga katawagang Tagalog. Pinananatili ng “salita” ang lawak ng ῥῆμα at hindi ipinapataw ang kahulugang “mensahe ng ebanghelyo” o isang pormulang bautismal. Ang tala tungkol sa sakramental na pahiwatig ay dapat mas malinaw na ipahayag na hindi tinutukoy ng Griyego kung paano tiyak na nauugnay ang parirala sa bautismo o sakramento.
