lexical_decisions:
- source_word: ἵνα
  choice: upang
  rationale: Malinaw na ipinahahayag ang layunin ng sugnay at likas sa makabagong Tagalog.
- source_word: αὐτὴν
  choice: ito
  rationale: Tumutukoy sa iglesya sa naunang konteksto. Ang “ito” ay malinaw at natural na panghalip para sa iglesya at umiiwas sa kalituhan sa magkasunod na “niya” at “siya.”
- source_word: ἁγιάσῃ
  choice: gawin niya itong banal
  rationale: Inilalahad ang diwa ng paglalaan o pagpapabanal sa paraang madaling maunawaan, habang pinananatili ang kaugnayan sa kabanalan.
- source_word: καθαρίσας
  choice: matapos niya itong linisin
  rationale: Pinananatili ang nauunang kilos ng aorist participle kaugnay ng pangunahing pandiwa at ginagawang malinaw ang ipinahiwatig na layon.
- source_word: τῷ λουτρῷ
  choice: sa pamamagitan ng paghuhugas
  rationale: Ipinapakita ang malamang na instrumental na gamit ng datibo. Ang “paghuhugas” ay mas natural dito kaysa “paligo” o “paliguan.”
- source_word: τοῦ ὕδατος
  choice: ng tubig
  rationale: Tuwirang pinananatili ang ugnayang henitibo sa “paghuhugas” nang hindi pinipili ang isang mas makitid na interpretasyon.
- source_word: ἐν ῥήματι
  choice: kalakip ang salita
  rationale: Natural na ipinapahayag ang pagkakaugnay ng salita at paghuhugas, habang hindi lubusang nilulutas kung ang parirala ay nagsasaad ng kasangkapan, kasabay na kalagayan, o kaugnay na pagbigkas.
- source_word: ῥήματι
  choice: salita
  rationale: Malawak at tapat sa saklaw ng ῥῆμα; hindi nito sapilitang nililimitahan ang tinutukoy sa mensahe ng ebanghelyo, isang pormula, o ibang tiyak na pagbigkas.
theological_decisions:
- issue: Ang ugnayan ng paglilinis, paghuhugas ng tubig, at salita sa posibleng kontekstong bautismal
  choice: Panatilihin ang larawan ng paghuhugas ng tubig at ang kaugnayan nito sa salita nang hindi tahasang itinatakda ang isang sakramental na paliwanag.
  alternative: Tahasang tukuyin ito bilang bautismo o, sa kabilang dako, bilang ganap na talinghagang walang sakramental na pahiwatig.
  rationale: Malakas ang pahiwatig ng wika sa bautismo, ngunit hindi nilulutas ng Griyego lamang kung gaano katiyak o kasakramental ang tinutukoy.
- issue: Kung bibigyang-kahulugan ang ῥήματι nang mas tiyak kaysa “salita”
  choice: Gamitin ang “salita” sa pangunahing teksto.
  alternative: “mensahe,” “ipinahayag na salita,” o “salita ng ebanghelyo”
  rationale: Maaaring tumukoy ang konteksto sa isang ipinahayag na mensahe, ngunit mas malawak ang salitang Griyego. Iniiwasan ng “salita” ang hindi kinakailangang pagpapakitid ng kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “ito” para sa iglesya upang maiwasan ang malabong sunod-sunod na panghalip. Ang “kalakip ang salita” ay sadyang nagpapanatili sa posibleng instrumental o kasabay na ugnayan ng ἐν ῥήματι nang hindi nag-aangkat ng tiyak na doktrinang denominasyonal.
