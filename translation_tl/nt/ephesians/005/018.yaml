lexical_decisions:
- source_word: μεθύσκεσθε
  choice: magpakalasing
  rationale: Ang kasalukuyang pautos na may μή ay pagbabawal. Likas sa modernong Tagalog ang “huwag kayong magpakalasing” at naipahihiwatig nito ang pagpasok sa kalagayan ng pagkalasing.
- source_word: οἴνῳ
  choice: sa alak
  rationale: Karaniwang paraan ito sa Tagalog upang tukuyin ang sangkap na sanhi ng pagkalasing.
- source_word: ἐν ᾧ
  choice: sapagkat humahantong ito
  rationale: Ang literal na “na kinaroroonan” ay hindi natural sa Tagalog. Pinananatili ng “ito” ang pagtukoy sa paglalasing sa alak, habang malinaw na ipinapahayag ang kaugnayan nito sa ἀσωτία.
- source_word: ἀσωτία
  choice: kahalayan
  rationale: Tumutukoy ang salita sa walang pagpipigil at masamang pamumuhay. Malinaw at dignificado ang “kahalayan,” bagaman mas makitid nang bahagya kaysa sa saklaw ng salitang Griyego.
- source_word: πληροῦσθε
  choice: magpuno kayo
  rationale: Nagsasaad ang kasalukuyang pasibong pautos ng patuloy o paulit-ulit na pagpapapuspos. Ang “magpuno kayo” ay likas na pasibong pahayag sa Tagalog sa ganitong gamit.
- source_word: ἐν πνεύματι
  choice: sa Espiritu
  rationale: Pinananatili ng “sa” ang posibleng diwa ng saklaw o paraan sa ἐν, sa halip na tiyak na ipakahulugang ang Espiritu ang nilalaman. Ang malaking titik ay kumakatawan sa malamang na pagtukoy sa Banal na Espiritu.
theological_decisions:
- issue: Ang tinutukoy ng πνεύματι
  choice: Espiritu (Banal na Espiritu)
  alternative: espiritu o sariling espiritu
  rationale: Sa konteksto ng mga tagubilin ni Pablo, malamang na Banal na Espiritu ang tinutukoy. Gayunman, walang pantukoy ang pangngalang Griyego, kaya inilalahad sa talababa ang mas pangkalahatang pagkaunawa.
- issue: Gampanin ng ἐν sa ἐν πνεύματι
  choice: sa Espiritu
  alternative: ng Espiritu / puspusin ng Espiritu
  rationale: Maaaring ipahiwatig ng ἐν ang saklaw o paraan, at maaari rin itong unawain kaugnay ng nilalaman. Ang “sa Espiritu” ang mas malapit sa anyong Griyego at hindi agad nagpapasiya sa tunay na ambiguwidad.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, dignificado, at madaling maunawaan. Iniwasan ang labis na teknikal o denominasyonal na pananalita; pinanatili sa talababa ang ambiguwidad ng ἐν πνεύματι.
