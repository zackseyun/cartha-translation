  yaml_path: translation/nt/ephesians/005/018.yaml
  text: And do not get drunk with wine[a], in which there is debauchery, but be filled with the Spirit,
translation:
  language: tl
  text: At huwag kayong magpakalasing sa alak, na may kaugnayan sa walang pagpipigil; sa halip, mapuspos kayo ng Espiritu[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mapuspos sa Espiritu”; nauunawaan ito ng ilan sa mas pangkalahatang diwa na “sa espiritu.”
