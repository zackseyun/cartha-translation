  text: Βλέπετε οὖν ⸂ἀκριβῶς πῶς⸃ περιπατεῖτε, μὴ ὡς ἄσοφοι ἀλλ’ ὡς σοφοί,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/015.yaml
  text: Therefore[b][a], watch carefully how you walk—not as unwise but as wise—
translation:
  language: tl
  text: Kaya nga, mag-ingat kayong mabuti sa paraan ng inyong paglakad[a]—hindi gaya ng mga walang karunungan, kundi gaya ng mga marurunong—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mag-ingat kayong mabuti sa paraan ng inyong pamumuhay.” Literal na “sa paraan ng inyong paglakad”; ang “paglakad” ay metapora para sa paraan ng pamumuhay.
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπετε
  choice: bantayan ninyo
  rationale: Nasa kasalukuyang pautos at maramihan ang pandiwa; ipinahahayag nito ang patuloy at mapagmatyag na pagbibigay-pansin.
- source_word: οὖν
  choice: Kaya nga
  rationale: Malinaw at likas na ipinapakita ang paghihinuha mula sa naunang pangangatwiran.
- source_word: ἀκριβῶς πῶς
  choice: mabuti kung paano
  rationale: Pinananatili ang diin sa maingat at eksaktong pagsusuri sa paraan ng pamumuhay, nang hindi nagiging teknikal o pilit sa Tagalog.
- source_word: περιπατεῖτε
  choice: kayo lumalakad
  rationale: Pinananatili ang karaniwang metapora ni Pablo na tumutukoy sa paraan ng pamumuhay; nililinaw ang diwang ito sa talababa.
- source_word: μὴ ὡς ἄσοφοι
  choice: hindi gaya ng mga walang karunungan
  rationale: Ang ἄσοφοι ay kabaligtaran ng σοφοί at nangangahulugang mga hindi marunong o walang karunungan. Ang 'mga' ay natural na kumakatawan sa buong pamayanan nang hindi nagdaragdag ng salitang 'lalaki,' na wala bilang hiwalay na pangngalan sa Griyego.
- source_word: ἀλλ’ ὡς σοφοί
  choice: kundi gaya ng marurunong
  rationale: Pinananatili ang tahasang paghahambing at balanseng pagsalungat sa ἄσοφοι.
theological_decisions:
- issue: Kasariang ipinahihiwatig ng mga pang-uring maramihan na ἄσοφοι / σοφοί
  choice: mga walang karunungan ... marurunong
  alternative: mga lalaking walang karunungan ... mga lalaking marurunong
  rationale: Bagaman panlalaking maramihan ang anyong gramatikal sa Griyego, ginagamit ito nang kinatawan para sa buong pamayanang kinakausap. Hindi nagdaragdag ang salin ng 'mga lalaki,' sapagkat walang pangngalang ἄνδρες at hindi lamang mga lalaki ang pinapayuhan.
- issue: Metapora ng paglakad bilang asal o pamumuhay
  choice: panatilihin ang 'lumalakad' sa pangunahing teksto
  alternative: namumuhay
  rationale: Ang metapora ay tunay na bahagi ng pananalita ni Pablo at madaling maipaliwanag nang hindi nilulutas o pinapawi sa pangunahing teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang metapora ng 'paglakad' at ang paghahambing na 'gaya ng,' habang iniwasan ang di-makatwirang pagdaragdag ng 'mga lalaki.'
