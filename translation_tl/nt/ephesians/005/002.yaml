source:
  edition: SBLGNT
  text: καὶ περιπατεῖτε ἐν ἀγάπῃ, καθὼς καὶ ὁ Χριστὸς ἠγάπησεν ⸀ἡμᾶς καὶ παρέδωκεν ἑαυτὸν ὑπὲρ ⸀ἡμῶν προσφορὰν καὶ θυσίαν τῷ θεῷ εἰς ὀσμὴν εὐωδίας.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/002.yaml
  text: and walk in love[a], just as the Messiah also loved us and gave himself up for us[c][b], an offering and sacrifice to God for a fragrant aroma.
translation:
  language: tl
  text: At mamuhay kayo sa pag-ibig, kung paanong inibig din tayo ng Mesiyas[a] at ibinigay niya ang kanyang sarili para sa atin[b] bilang handog at hain sa Diyos, upang maging isang mabangong samyo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Cristo.” Ang Griyegong titulong Χριστός ay isinaling “Mesiyas” dito sapagkat ginagamit ito bilang titulo.
    reason: alternative_reading
  - marker: b
    text: O “alang-alang sa atin.” Maaaring ipahiwatig ng pariralang ὑπὲρ ἡμῶν ang pagkilos para sa kapakinabangan o bilang kinatawan ng iba sa kontekstong ito.
    reason: lexical_alternative
  - marker: c
    text: Ang “mabangong samyo” ay umaalingawngaw sa wikang pansakripisyo ng Lumang Tipan para sa handog na kalugud-lugod sa Diyos.
    reason: cross_reference
lexical_decisions:
- source_word: περιπατεῖτε
  choice: mamuhay kayo
  rationale: Ang literal na “lumakad” ay talinghaga para sa paraan ng pamumuhay. Mas likas sa makabagong Tagalog ang “mamuhay” habang pinananatili ang diwang etikal ng pautos.
- source_word: ἐν ἀγάπῃ
  choice: sa pag-ibig
  rationale: Pinananatili nito ang pag-ibig bilang saklaw at paraan ng pamumuhay, at likas itong pakinggan sa Tagalog.
- source_word: ὁ Χριστός
  choice: ang Mesiyas
  rationale: May pantukoy ang Griyego at gumaganap dito ang Χριστός bilang titulo; kaya isinalin ito bilang “Mesiyas” sa halip na tratuhing pangalang pantangi.
- source_word: ἠγάπησεν ἡμᾶς
  choice: inibig din tayo
  rationale: Tuwirang inilalarawan ang naganap na pag-ibig ng Mesiyas at pinananatili ang ugnayang leksikal nito sa “pag-ibig” sa unang sugnay.
- source_word: παρέδωκεν ἑαυτὸν
  choice: ibinigay niya ang kanyang sarili
  rationale: Malinaw at likas na ipinapahayag ang kusang pagsuko ng sarili nang hindi nagdaragdag ng paraang hindi tahasang sinabi sa teksto.
- source_word: ὑπὲρ ἡμῶν
  choice: para sa atin
  rationale: Pinananatili ng karaniwang pariralang ito ang kapakinabangan at pagkilos alang-alang sa iba nang hindi nililimitahan ang ὑπέρ sa isang mas makitid na teolohikal na paliwanag.
- source_word: προσφορὰν καὶ θυσίαν
  choice: bilang handog at hain
  rationale: Kapwa pinananatili ang dalawang terminong pansakripisyo sa halip na pagsamahin ang mga ito sa iisang salita.
- source_word: τῷ θεῷ
  choice: sa Diyos
  rationale: Likas nitong ipinakikita ang Diyos bilang pinag-uukulan ng handog at hain.
- source_word: εἰς ὀσμὴν εὐωδίας
  choice: isang mabangong samyo
  rationale: Pinananatili ang kongkretong larawang pansakripisyo at ang alingawngaw nito sa wikang ginagamit sa Lumang Tipan.
theological_decisions:
- issue: Pagbibigay-kahulugan sa Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Dahil may pantukoy at malinaw na gumaganap bilang titulo ang Χριστός, isinalin ang kahulugan nito. Inilalagay sa talababa ang nakaugaliang anyong “Cristo.”
- issue: Saklaw ng ὑπὲρ ἡμῶν sa kontekstong pansakripisyo
  choice: para sa atin
  alternative: alang-alang sa atin; bilang kahalili natin
  rationale: Malinaw ang kapakinabangan at mapagsakripisyong pagbibigay ng sarili, ngunit hindi pinakikitid ng salin ang ὑπέρ tungo sa tahasang pormulang pamalit na higit sa mismong sinasabi ng parirala.
- issue: Kabuluhan ng εἰς ὀσμὴν εὐωδίας
  choice: isang mabangong samyo
  alternative: isang samyong kalugud-lugod sa Diyos
  rationale: Pinananatili ang imahen at alingawngaw ng wikang pansakripisyo sa halip na gawing tahasang paliwanag ang ipinahihiwatig nitong pagtanggap ng Diyos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mamuhay” bilang likas na katumbas ng talinghagang “lumakad,” habang pinanatili ang mga larawang pansakripisyo sa “handog,” “hain,” at “mabangong samyo.”
