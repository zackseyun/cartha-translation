  verdict: revise
  source_fidelity: Tumpak na naipapahayag ng salin ang tatlong uri ng taong binanggit, ang kasalukuyang pahayag na wala silang mana, at ang pariralang “kaharian ng Mesiyas at ng Diyos.” Ang “alam ninyo ito at nauunawaan ninyo” ay isang katanggap-tanggap na idiomatikong paglalapat ng mariing ἴστε γινώσκοντες, bagaman maaari ring unawain ang unang pandiwa bilang panawagan. Napananatili rin ng pangunahing teksto at talababa ang ambiguwidad ng neuter na ὅ.
  naturalness: Malinaw at marangal ang modernong Filipino. Ang listahang “imoral sa seksuwal na gawain, marumi, o sakim” ay natural sa kontekstong etikal. Maayos ang paggamit ng gitling-pahaba upang ihiwalay ang paliwanag.
  terminology: Ang “mana,” “kaharian,” “Mesiyas,” at “Diyos” ay angkop at pare-pareho sa rehistro. Ang “sumasamba sa diyos-diyosan” ay malinaw na katumbas ng εἰδωλολάτρης. Kailangan lamang ilapit ang marker ng talababa tungkol sa Christos sa “Mesiyas,” ang salitang aktuwal nitong ipinapaliwanag.
