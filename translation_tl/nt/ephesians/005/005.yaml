id: EPH.5.5
reference: Ephesians 5:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τοῦτο γὰρ ⸀ἴστε γινώσκοντες ὅτι πᾶς πόρνος ἢ ἀκάθαρτος ἢ πλεονέκτης, ⸀ὅ ἐστιν εἰδωλολάτρης, οὐκ ἔχει κληρονομίαν ἐν τῇ βασιλείᾳ τοῦ Χριστοῦ καὶ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/005.yaml
  text: For you know this[a], understanding that every sexually immoral or unclean or greedy person, who is an idolater[b], has no inheritance in the kingdom of Messiah and God.
translation:
  language: tl
  text: 'Sapagkat alam ninyo ito at nauunawaan ninyo: walang sinumang imoral sa seksuwal na gawain, marumi, o sakim—na isang sumasamba sa diyos-diyosan[a]—ang may mana sa kaharian ng Mesiyas[b] at ng Diyos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “na siyang pagsamba sa diyos-diyosan,” na malamang ay tumutukoy lalo na sa kasakiman.
    reason: alternative_reading
  - marker: b
    text: Sa Griyego, Christos; isinaling “Mesiyas” sapagkat ginagamit ito rito bilang titulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴστε γινώσκοντες
  choice: alam ninyo ito at nauunawaan ninyo
  rationale: Pinananatili ang dalawang magkaugnay na ideya ng tiyak na pagkaalam at aktibong pagkaunawa nang hindi ginagawang mabigat o di-likas ang Filipino.
- source_word: πόρνος
  choice: imoral sa seksuwal na gawain
  rationale: Tumutukoy ito sa taong kinikilala sa seksuwal na imoralidad; malinaw at kasalukuyang Filipino ito at hindi nililimitahan ang salita sa isang partikular na uri ng kasalanang seksuwal.
- source_word: ἀκάθαρτος
  choice: marumi
  rationale: Pinananatili ng “marumi” ang metaporikal at moral na diwa ng karumihan na taglay ng salitang Griyego.
- source_word: πλεονέκτης
  choice: sakim
  rationale: Natural at maikli itong tawag sa taong mapang-angkin at laging naghahangad ng higit.
- source_word: ὅ ἐστιν εἰδωλολάτρης
  choice: na isang sumasamba sa diyos-diyosan
  rationale: Sa konteksto, pinakamadaling unawain ang sugnay bilang paglalarawan sa taong sakim, bagaman ang anyong neuter ng panghalip sa Griyego ay maaari ring tumukoy sa kasakiman bilang pagsamba sa diyos-diyosan; itinabi sa talababa ang alternatibong ito.
- source_word: κληρονομίαν
  choice: mana
  rationale: Pinananatili nito ang wikang pampamana at ang kaugnay na tipanan at panghinaharap na diwa ng gamit ni Pablo.
- source_word: βασιλείᾳ
  choice: kaharian
  rationale: Karaniwan at tumpak na katumbas na maaaring tumukoy kapwa sa paghahari at sa nasasakupan nito.
- source_word: Χριστοῦ
  choice: Mesiyas
  rationale: Gumaganap dito ang Χριστός bilang titulo; malinaw na ipinahahayag ng “Mesiyas” ang kahulugan ng titulo.
- source_word: τοῦ Χριστοῦ καὶ θεοῦ
  choice: ng Mesiyas at ng Diyos
  rationale: Tuwirang pinananatili ang magkatambal na mga genitive nang hindi ipinapasok sa salin ang isang higit na tiyak ngunit pinagtatalunang sintaktikong konklusyon.
theological_decisions:
- issue: Tinutukoy ng ὅ ἐστιν εἰδωλολάτρης
  choice: 'Iniuugnay sa taong sakim: “na isang sumasamba sa diyos-diyosan.”'
  alternative: “na siyang pagsamba sa diyos-diyosan,” na tumutukoy lalo na sa kasakiman.
  rationale: Neuter ang panghalip na ὅ, kaya nananatiling posible ang abstraktong pagtukoy sa kasakiman. Gayunman, ang konteksto at ang malapit na pagkakatulad sa Colosas 3:5 ay sumusuporta sa paglalarawan sa taong sakim bilang sumasamba sa diyos-diyosan. Inilalahad ng talababa ang tunay na ambiguwidad.
- issue: Kawalan ng mana sa kaharian
  choice: “walang ... may mana” bilang kasalukuyang pahayag tungkol sa kalagayan.
  alternative: “hindi magmamana” bilang tahasang panghinaharap.
  rationale: Kasalukuyang panahunan ang οὐκ ἔχει (“walang taglay”), kaya hindi ito ginawang pandiwang panghinaharap, habang nananatiling buo ang bigat ng babala.
- issue: Ugnayan ng “Mesiyas at ng Diyos”
  choice: 'Tuwirang koordinasyon: “kaharian ng Mesiyas at ng Diyos.”'
  alternative: Isang mas interpretatibong salin na tahasang nagtatakda ng partikular na kristolohikal na pagbasa sa sintaks.
  rationale: Pinananatili ng salin ang mismong ayos at tensiyon ng Griyego nang hindi humihigit sa malinaw na sinasabi ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “seksuwal na gawain” upang maging natural ang paglalarawan sa taong imoral, at ang gitling-pahaba upang malinaw na ihiwalay ang paliwanag tungkol sa pagsamba sa diyos-diyosan. Ang lahat ng marker ng talababa ay nasa pangunahing teksto.
