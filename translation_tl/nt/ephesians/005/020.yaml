  text: εὐχαριστοῦντες πάντοτε ὑπὲρ πάντων ἐν ὀνόματι τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ τῷ θεῷ καὶ πατρί,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/020.yaml
  text: always giving thanks for everything to God the Father in the name of our Lord Jesus the Messiah[b][a],
translation:
  language: tl
  text: na laging nagpapasalamat para sa lahat ng bagay[a] sa Diyos na Ama, sa pangalan ng ating Panginoong Jesus na Mesiyas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ding isalin nang mas literal na “para sa lahat ng bagay.” Posible rin ang “para sa lahat ng tao,” bagaman mas pinapaboran ng konteksto ang malawak na diwa ng lahat ng bagay o kalagayan.
    reason: lexical_alternative
  - marker: b
    text: O, ayon sa mas tradisyonal na tawag, “Jesucristo.”
    reason: alternative_reading
lexical_decisions:
- source_word: εὐχαριστοῦντες
  choice: nagpapasalamat
  rationale: Ang pangkasalukuyang aktibong pandiwaring maramihan ay nagpapatuloy sa naunang daloy ng pangungusap. Likas sa Tagalog ang “nagpapasalamat” at naipahihiwatig nito ang patuloy na pagkilos.
- source_word: πάντοτε
  choice: laging
  rationale: Direkta, maikli, at natural na katumbas ng diwang “sa lahat ng panahon” o “palagi.”
- source_word: ὑπὲρ πάντων
  choice: para sa lahat ng bagay
  rationale: Maaaring panlalaki o walang-kasarian ang anyong πάντων. Sa konteksto, higit na malamang ang malawak na diwang tumutukoy sa lahat ng bagay o kalagayan kaysa sa lahat ng tao; pinananatili sa talababa ang tunay na posibilidad ng ibang pagbasa.
- source_word: ἐν ὀνόματι
  choice: sa pangalan
  rationale: Pinananatili ang pamilyar na biblikal na idyoma at hindi nililimitahan ang posibleng diwa nito sa pamamagitan lamang, pagkatawan, o awtoridad.
- source_word: κυρίου
  choice: Panginoon
  rationale: Karaniwan at marangal na salin ng kristolohikal na titulong κύριος.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus na Mesiyas
  rationale: Isinasalin ang Χριστός bilang titulong “Mesiyas,” samantalang tinatranslitera ang pangalang Ἰησοῦ bilang “Jesus.” Ang “na” ay likas na paraan sa Tagalog upang linawin na titulo ang Mesiyas.
- source_word: τῷ θεῷ καὶ πατρί
  choice: sa Diyos na Ama
  rationale: Ang datibo ang tumutukoy sa tumatanggap ng pasasalamat. Ipinapakita ng “Diyos na Ama” na iisang tinutukoy ang dalawang katawagan, nang hindi idinaragdag ang “ating,” na wala sa pariralang Griyego.
theological_decisions:
- issue: Pagbibigay-kahulugan sa Χριστοῦ sa pariralang τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: Mesiyas
  alternative: Cristo
  rationale: Taglay pa rin ng Χριστός dito ang lakas ng isang titulo. Ginamit sa pangunahing teksto ang malinaw na saling “Mesiyas,” habang inilagay sa talababa ang tradisyonal na “Cristo.”
- issue: Saklaw ng πάντων sa ὑπὲρ πάντων
  choice: lahat ng bagay
  alternative: lahat ng tao
  rationale: Pinapaboran ng malawak na konteksto ng pasasalamat ang komprehensibong pagtukoy sa mga bagay, pangyayari, o kalagayan. Gayunman, hindi ganap na nilulutas ng anyong Griyego kung panlalaki o walang-kasarian ito, kaya kinikilala ang “lahat ng tao” bilang posibleng alternatibo.
- issue: Ugnayan ng θεῷ at πατρί
  choice: Diyos na Ama
  alternative: Diyos at Ama
  rationale: Ang iisang pantukoy sa Griyego ay likas na nauunawaan bilang dalawang katawagan sa iisang tinutukoy. Ang “Diyos na Ama” ay malinaw sa modernong Tagalog, samantalang ang mas pormal na “Diyos at Ama” ay maaaring magtunog na dalawang tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “na” sa simula dahil ang pandiwaring Griyego ay nakaugnay sa naunang pangungusap. Iniwasan ang labis na teknikal o denominasyonal na pananalita; pinanatili sa mga talababa ang leksikal at titularyong mga alternatibo.
