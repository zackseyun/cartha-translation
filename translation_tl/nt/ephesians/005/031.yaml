id: EPH.5.31
reference: Ephesians 5:31
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀντὶ τούτου καταλείψει ἄνθρωπος ⸀τὸν ⸀πατέρα καὶ ⸀τὴν μητέρα καὶ προσκολληθήσεται ⸂τῇ γυναικὶ⸃ αὐτοῦ, καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/031.yaml
  text: For this reason a man will leave his father and mother and be joined to his wife[a], and the two will become one flesh.
translation:
  language: tl
  text: Dahil dito[a], iiwan ng lalaki ang kanyang ama at ina at makikipag-isa siya sa kanyang asawa, at ang dalawa ay magiging isang laman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Sa dahilang ito.” Ang Griyegong ἀντὶ τούτου ay nagsisilbing panandang nagsasaad ng dahilan sa siping ito mula sa Genesis.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντὶ τούτου
  choice: Dahil dito
  rationale: Ginagamit ang parirala bilang panandang nagsasaad ng dahilan o batayan sa sipi mula sa Genesis 2:24, hindi sa mahigpit na diwang pamalit na ‘sa halip na ito.’
- source_word: καταλείψει
  choice: iiwan
  rationale: Likas at tuwirang ipinapahayag nito ang pag-alis ng lalaki sa sambahayan ng kanyang mga magulang upang bumuo ng bagong pagsasama, nang hindi ipinahihiwatig ang malupit na pagtatakwil.
- source_word: ἄνθρωπος
  choice: lalaki
  rationale: Bagaman maaaring tumukoy sa tao sa pangkalahatan ang ἄνθρωπος, malinaw na lalaki ang tinutukoy rito dahil ipinaparis siya sa kanyang asawa.
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: ang kanyang ama at ina
  rationale: Natural sa Tagalog ang iisang panghalip na paari para sa magkaparis na katawagan, habang buo pa rin ang kahulugan ng Griyego.
- source_word: προσκολληθήσεται
  choice: makikipag-isa siya sa
  rationale: Ipinahahayag nito sa natural na Tagalog ang mahigpit na pagkakaugnay at pagsasama ng mag-asawa. Hindi ito nilimitahan sa pisikal na pagkapit o sa simpleng paninirahang magkasama.
- source_word: τῇ γυναικὶ αὐτοῦ
  choice: kanyang asawa
  rationale: Sa konteksto ng pag-aasawa, ‘asawa’ ang hinihinging kahulugan ng γυνή, hindi lamang ‘babae.’
- source_word: ἔσονται οἱ δύο
  choice: ang dalawa ay magiging
  rationale: Bagaman literal na ‘magiging/naroroon bilang’ ang pandiwa, natural na inilalahad ng ‘magiging’ ang bungang kalagayan ng kanilang pag-iisa at pinananatili ang tahasang ‘ang dalawa.’
- source_word: εἰς σάρκα μίαν
  choice: isang laman
  rationale: Pinananatili ng ‘isang laman’ ang kongkreto at relasyonal na larawan mula sa Genesis; hindi ito pinapantay lamang sa ‘isang katawan’ o binibigyan ng diwa ng makasalanang kalikasan.
theological_decisions:
- issue: May kasariang pananalita sa sipi tungkol sa pag-aasawa
  choice: lalaki … kanyang asawa
  alternative: tao … kabiyak
  rationale: Inilalarawan ng tekstong pinagmulan ang lalaki at ang kanyang asawa sa sipi mula sa Genesis 2:24. Pinananatili ang pagkakakilanlang ito nang hindi dinaragdagan ng denominasyonal na pagpapakahulugan.
- issue: Kahulugan ng σάρξ sa εἰς σάρκα μίαν
  choice: isang laman
  alternative: isang katawan
  rationale: Dito, ang σάρξ ay bahagi ng wika ng pag-iisang mag-asawa sa Genesis, hindi katawagan para sa makasalanang pagkatao. Ang ‘isang laman’ ang nagpapanatili sa larawan at teolohikal na tensiyon ng pinagmulan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang tradisyonal ngunit nauunawaang pariralang ‘isang laman,’ samantalang ginamit ang ‘makikipag-isa’ upang natural na maipahayag ang malapit na pagkakabuklod ng mag-asawa.
