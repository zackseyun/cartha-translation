  text: Πορνεία δὲ καὶ ⸂ἀκαθαρσία πᾶσα⸃ ἢ πλεονεξία μηδὲ ὀνομαζέσθω ἐν ὑμῖν, καθὼς πρέπει ἁγίοις,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/003.yaml
  text: But sexual immorality and every impurity or greed must not even be named among you[a], as is proper for saints[c][b],
translation:
  language: tl
  text: Ngunit ang seksuwal na imoralidad, anumang karumihan, o kasakiman[c] ay huwag man lamang mabanggit sa gitna ninyo[a], gaya ng nararapat sa mga banal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “huwag man lamang mapangalanan sa gitna ninyo.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mga banal” dito ay ang mga mananampalataya bilang banal na bayan ng Diyos, hindi lamang isang uring kinanonisa noong kalaunan.
    reason: cultural_note
  - marker: c
    text: Maaari ring isalin ang “kasakiman” bilang “pag-iimbot.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πορνεία
  choice: seksuwal na imoralidad
  rationale: Malawak ang saklaw ng πορνεία at tumutukoy sa ipinagbabawal na seksuwal na gawain, kaya hindi ito nilimitahan sa pakikipagtalik bago ang kasal.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita ng δέ ang banayad na pagsalungat o paglipat mula sa naunang payo.
- source_word: ἀκαθαρσία πᾶσα
  choice: anumang karumihan
  rationale: Pinananatili nito ang malawak at sumasaklaw na diwa ng πᾶσα habang natural sa modernong Tagalog.
- source_word: ἢ
  choice: o
  rationale: Tuwirang pinananatili ang disjunctive na ugnayan sa isa pang ipinagbabawal na bisyo.
- source_word: πλεονεξία
  choice: kasakiman
  rationale: Tumutukoy ito sa mapang-angking paghahangad na magkaroon pa ng higit at hindi dapat paliitin sa seksuwal na pagnanasa lamang.
- source_word: μηδὲ ὀνομαζέσθω
  choice: huwag man lamang mabanggit
  rationale: Ipinahahayag nito ang mariing pagbabawal at ang diin ng μηδέ, sa natural na anyong Tagalog.
- source_word: ἐν ὑμῖν
  choice: sa gitna ninyo
  rationale: 'Ipinakikita nito ang pangkomunidad na diwa: ang gayong mga bagay ay hindi dapat magkaroon ng kinikilalang lugar sa kapulungan.'
- source_word: καθὼς πρέπει
  choice: gaya ng nararapat
  rationale: Pinananatili ang pamantayan ng asal na angkop sa pagkakakilanlan ng mga tinutukoy.
- source_word: ἁγίοις
  choice: mga banal
  rationale: Tumutukoy ito sa mga mananampalatayang ibinukod para sa Diyos, at hindi sa isang uring kinanonisa lamang noong kalaunan.
theological_decisions:
- issue: Kahulugan ng πλεονεξία sa talaan ng mga bisyo na may kaugnayan sa seksuwal na kasalanan
  choice: kasakiman sa malawak na kahulugan
  alternative: seksuwal na kasakiman o pag-iimbot
  rationale: Bagaman seksuwal na etika ang kalapit na konteksto, mas malawak ang karaniwang diwa ng πλεονεξία at walang sapat na batayan sa teksto upang limitahan ito sa seksuwal na pagnanasa.
- issue: Tinutukoy ng ἁγίοις
  choice: mga banal, ibig sabihin, lahat ng bayan ng Diyos na ibinukod para sa kanya
  alternative: mga santo bilang isang natatanging uring kinanonisa
  rationale: Sa paggamit ni Pablo, ang salita ay karaniwang pantukoy sa mga mananampalataya bilang banal na bayan ng Diyos, hindi sa isang uring kinilala sa kalaunang proseso ng kanonisasyon.
- issue: Saklaw ng pagbabawal na μηδὲ ὀνομαζέσθω
  choice: huwag man lamang mabanggit sa gitna ng pamayanan
  alternative: huwag magkaroon o mangyari sa gitna ninyo
  rationale: Pinananatili ng salin ang tahasang pandiwang 'pangalanan/banggitin' at ang retorikal na tindi nito, nang hindi tahimik na pinapalitan iyon ng mas malawak na interpretasyon tungkol sa pag-iral ng mga bisyo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinili ang “seksuwal na imoralidad” dahil malinaw at sapat ang lawak; ang “anumang karumihan” ay natural ngunit nananatiling komprehensibo. Ginamit ang “mga banal” upang mapanatili ang teolohikal na katawagan, kalakip ang paliwanag upang maiwasan ang kalaunang makitid na pakahulugan.
