id: EPH.5.12
reference: Ephesians 5:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τὰ γὰρ κρυφῇ γινόμενα ὑπ’ αὐτῶν αἰσχρόν ἐστιν καὶ λέγειν·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/012.yaml
  text: For it is shameful even to speak of the things done by them in secret[a].
translation:
  language: tl
  text: Sapagkat kahiya-hiya kahit banggitin ang mga bagay na palihim nilang ginagawa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang palihim nilang ginagawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Sapagkat
  rationale: Nagbibigay ito ng paliwanag o batayan para sa naunang tagubilin at pinananatili ang daloy ng pangangatwiran.
- source_word: τὰ ... γινόμενα
  choice: ang mga bagay na ... ginagawa
  rationale: Ang artikulo at pandiwaring ginagamit bilang pangngalan ay tumutukoy sa mga ginagawa o gawain. Likas ito sa modernong Tagalog at pinananatili ang di-tiyak na pagtukoy sa mga kilos.
- source_word: κρυφῇ
  choice: palihim
  rationale: Malinaw at likas na ipinapahayag nito ang pagkilos nang lihim o nakatago.
- source_word: γινόμενα
  choice: ginagawa
  rationale: Naipahahayag ng aspektong imperpektibo ng Tagalog ang nagpapatuloy o karaniwang pagkilos na ipinahihiwatig ng present participle.
- source_word: ὑπ’ αὐτῶν
  choice: nilang
  rationale: Direktang pinananatili ang ahensiya at ang panghalip nang hindi tinutukoy sa mismong talata ang antecedent na ibinibigay ng konteksto.
- source_word: αἰσχρόν
  choice: kahiya-hiya
  rationale: Karaniwan, malinaw, at may sapat na bigat na moral para sa αἰσχρόν nang hindi nagpapalabis.
- source_word: καὶ λέγειν
  choice: kahit banggitin
  rationale: Ang καί ay may pasidhi o ascensive na diwa rito, kaya ang “kahit” ay angkop. Ang “banggitin” ay likas sa Tagalog para sa pagsasalita tungkol sa mga gawa.
theological_decisions:
- issue: Saklaw at tinutukoy ng αὐτῶν
  choice: Panatilihin bilang panghalip na “nilang” nang hindi tahasang pinapangalanan ang tinutukoy.
  alternative: Palawakin bilang “ng mga taong iyon” o tukuyin bilang mga gumagawa ng mga gawa ng kadiliman.
  rationale: Ang tiyak na tinutukoy ay nagmumula sa nakapaligid na konteksto. Ang pagpapangalan nito sa talata ay magdaragdag ng interpretasyong wala sa mismong Griyego.
- issue: Saklaw ng αἰσχρόν ... καὶ λέγειν
  choice: Unawain na kahiya-hiya kahit ang pagbanggit sa palihim nilang ginagawa.
  alternative: Unawain ang “kahiya-hiya” bilang tuwirang paglalarawan lamang sa mga gawa.
  rationale: Sa pagkakabuo ng Griyego, ang infinitive na λέγειν kasama ng pasidhing καί ang nakaugnay sa αἰσχρόν; pinananatili ng salin ang tensiyong ang mismong pagbanggit ay kahiya-hiya.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “banggitin” sa halip na mas literal ngunit hindi gaanong likas na “sabihin,” at pinanatili ang panghalip na hindi nililinaw nang lampas sa tekstong Griyego.
