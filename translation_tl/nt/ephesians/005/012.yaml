  source_fidelity: Tumpak na naipapahayag ng salin ang pangatnig na γάρ (“Sapagkat”), ang substantibong τὰ ... γινόμενα (“ang mga bagay na ... ginagawa”), ang palihim na paraan ng pagkilos (κρυφῇ), ang ahensiyang ipinahihiwatig ng ὑπ’ αὐτῶν (“nilang”), at ang pasidhing saklaw ng καὶ λέγειν (“kahit banggitin”). Hindi nito nililinaw nang lampas sa Griyego ang tinutukoy ng panghalip.
