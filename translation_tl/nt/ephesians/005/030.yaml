  text: because we are members of his body[a].
translation:
  language: tl
  text: sapagkat mga bahagi tayo ng kanyang katawan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Idinaragdag ng ilang manuskrito, “mula sa kanyang laman at mula sa kanyang mga buto.”
    reason: textual_variant
lexical_decisions:
- source_word: ὅτι
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan o batayan ng naunang pahayag; likas at marangal ang “sapagkat” sa kontekstong ito.
- source_word: μέλη
  choice: mga bahagi
  rationale: Tumutukoy ito sa mga bahaging bumubuo sa isang katawan. Pinananatili ng “mga bahagi” ang talinghaga at mas karaniwan sa modernong Filipino kaysa sa “mga sangkap” o “mga kasapi” kapag katawan ang tuwirang larawan.
- source_word: ἐσμὲν
  choice: tayo
  rationale: Ang unang panauhang maramihan ng pandiwang ‘maging’ ay likas na ipinahahayag sa Filipino sa pamamagitan ng panghalip at panaguring pangngalan; hindi na kailangan ng hiwalay na katumbas ng ‘are.’
- source_word: τοῦ σώματος
  choice: ng katawan
  rationale: Tuwirang pinananatili ang larawan ng katawan na ginagamit ni Pablo sa konteksto.
- source_word: αὐτοῦ
  choice: kanyang
  rationale: Ang panghalip ay tumutukoy kay Cristo sa nakapaligid na konteksto; ang “kanyang” ay natural na personal na pagtukoy nang hindi nagdaragdag ng pangalang wala sa talata.
theological_decisions:
- issue: Kung isasama ang mas mahabang tekstong “mula sa kanyang laman at mula sa kanyang mga buto”
  choice: Isinalin lamang ang maikling teksto ng SBLGNT.
  alternative: “sapagkat mga bahagi tayo ng kanyang katawan, ng kanyang laman at ng kanyang mga buto.”
  rationale: Ang ibinigay na tekstong Griyego ay may maikling pagbasa. Inilalagay sa talababa ang mas mahabang pagbasa bilang variant ng manuskrito sa halip na isama ito sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang “mga bahagi” upang mapanatili ang konkretong larawan ng katawan at ang sama-samang kaugnayan kay Cristo.
