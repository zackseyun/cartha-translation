id: EPH.5.23
reference: Ephesians 5:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτι ἀνήρ ἐστιν κεφαλὴ τῆς γυναικὸς ὡς καὶ ὁ Χριστὸς κεφαλὴ τῆς ἐκκλησίας, ⸀αὐτὸς σωτὴρ τοῦ σώματος.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/023.yaml
  text: For the husband is the head of the wife[a], as the Messiah also is the head of the church[d][c][b], himself the Savior of the body.
translation:
  language: tl
  text: Sapagkat ang asawang lalaki ang ulo ng kanyang asawa,[a] kung paanong ang Mesiyas ay ulo rin ng iglesya—siya mismo ang Tagapagligtas ng katawan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “ulo” ay nagpapanatili sa talinghagang Griyego. Iba-iba ang pagkaunawa rito bilang nagpapahiwatig ng awtoridad, pangunguna, katanyagan, o pinagmulan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Sapagkat
  rationale: Ipinakikita ang dahilan o paliwanag para sa naunang tagubilin; natural sa modernong Tagalog at pinananatili ang paliwanag na ugnayan.
- source_word: ἀνήρ
  choice: asawang lalaki
  rationale: Sa konteksto ng mga tagubilin sa sambahayan, tumutukoy ito sa esposo, hindi sa lalaki sa pangkalahatan.
- source_word: κεφαλή
  choice: ulo
  rationale: Pinananatili ang talinghagang Griyego nang hindi ito nililimitahan sa pinagmulan, pamumuno, o awtoridad.
- source_word: γυνή
  choice: asawa
  rationale: Kaparis ng ἀνήρ sa kontekstong pangmag-asawa; malinaw na tumutukoy sa asawang babae.
- source_word: ὡς καὶ
  choice: kung paanong ... rin
  rationale: Natural na ipinahahayag sa Tagalog ang paghahambing at ang kasamang diin ng καί.
- source_word: Χριστός
  choice: Mesiyas
  rationale: Aktibo rito ang diwa ng titulo, kaya pinananatili ang mesiyanikong kahulugan sa halip na ituring lamang na pangalan.
- source_word: ἐκκλησία
  choice: iglesya
  rationale: Karaniwan at malinaw na katawagan sa modernong Filipino para sa komunidad ng mga mananampalataya sa kontekstong Paulino.
- source_word: αὐτός
  choice: siya mismo
  rationale: Pinananatili ang mariing panghalip at tahasang iniuugnay sa Mesiyas ang pagiging Tagapagligtas.
- source_word: σωτήρ
  choice: Tagapagligtas
  rationale: Pamantayan at angkop na salin na sumasaklaw sa pagliligtas sa kontekstong Kristolohikal.
- source_word: σῶμα
  choice: katawan
  rationale: Pinananatili ang talinghaga ni Pablo at hindi idinaragdag ang 'kanyang,' na wala sa Griyego.
theological_decisions:
- issue: Kahulugan ng κεφαλή sa paghahambing ng mag-asawa at ng Mesiyas at iglesya
  choice: Pinanatili ang talinghagang “ulo.”
  alternative: “pinagmulan,” “pinuno,” o “may awtoridad sa”
  rationale: Pinananatili nito ang tunay na interpretatibong pagtatalo at hindi ipinapasok sa pangunahing teksto ang isang makitid na paliwanag.
- issue: Pagkasalin sa Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Ginagamit dito ang salita bilang aktibong titulo at hindi lamang bilang pangalang pantangi.
- issue: Ugnayan ng αὐτὸς σωτὴρ τοῦ σώματος sa naunang sugnay
  choice: 'Isinalin bilang mariing sugnay na appositional: “siya mismo ang Tagapagligtas ng katawan.”'
  alternative: “yamang siya ang Tagapagligtas ng katawan” o “bilang Tagapagligtas ng katawan”
  rationale: Hindi tahasang nililinaw ng Griyego ang lohikal na ugnayan; iniiwasan ng salin ang pagdaragdag ng sanhi o ibang interpretatibong koneksiyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “asawang lalaki” upang maging malinaw ang marital na diwa, “Mesiyas” para sa aktibong titulo, at “iglesya” bilang likas na katawagang Paulino. Ang gitling bago ang huling sugnay ay tumutulong na ipakita ang mariing appositional na pahayag nang hindi nagdaragdag ng lohikal na ugnayang wala sa Griyego.
