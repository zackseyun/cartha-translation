  yaml_path: translation/nt/ephesians/005/001.yaml
  text: Therefore[a], become imitators of God, as beloved children,
translation:
  language: tl
  text: Kaya tularan ninyo ang Diyos, bilang mga minamahal na anak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “Patuloy kayong tumulad sa Diyos.” Maaaring idiin ng Griyegong pautos ang pagsisimula ng pagtulad o ang patuloy na pagtulad.
    reason: lexical_alternative
lexical_decisions:
- source_word: γίνεσθε
  choice: maging
  rationale: Ang pangkasalukuyang pautos ng γίνομαι ay maaaring magpahiwatig ng pagpasok o pagpapatuloy sa isang kalagayan. Likas sa modernong Tagalog ang “maging” at napapanatili nito ang puwersa ng panawagan nang hindi labis na ipinapaliwanag.
- source_word: οὖν
  choice: kaya
  rationale: Nagpapakita ito ng kongklusyon o paghinuha mula sa naunang pahayag. Ang “kaya” ay malinaw at natural sa kasalukuyang Tagalog.
- source_word: μιμηταὶ
  choice: mga tagatulad
  rationale: Tuwirang tumutukoy ang pangngalan sa mga gumagaya o tumutulad. Mas eksakto ang “mga tagatulad” kaysa “mga tagasunod,” na maaaring mawala ang hayagang diwa ng pagtulad.
- source_word: τοῦ θεοῦ
  choice: sa Diyos
  rationale: Sa Tagalog, ang layon ng pagtulad ay likas na ipinapahayag sa “sa”; kaya ang “mga tagatulad sa Diyos” ay natural na katumbas ng Griyegong genitive.
- source_word: ὡς
  choice: bilang
  rationale: Napapanatili ng “bilang” ang maikling ugnayan ng pagkakakilanlan, paraan, o batayan nang hindi ito tahasang ginagawang sanhi.
- source_word: τέκνα
  choice: mga anak
  rationale: Ang τέκνα ay inklusibo sa kasarian at nakatuon sa ugnayang pampamilya. Ang “mga anak” ang natural at tumpak na salin.
- source_word: ἀγαπητά
  choice: minamahal
  rationale: Ang “minamahal” ay dignido at likas na nagpapahayag ng pagiging iniibig o mahal, habang pinananatili ang mapagmahal na bigat ng salita.
theological_decisions:
- issue: Puwersa ng panawagan kaugnay ng pagiging mga anak ng Diyos
  choice: Inuutusan ang mga mananampalataya na tumulad sa Diyos bilang mga minamahal na anak; hindi sinasabi ng salin na nagiging mga anak sila dahil sa pagtulad.
  alternative: 'Maaaring unawain ito bilang payak na paghahambing: tumulad sa Diyos gaya ng ginagawa ng minamahal na mga anak.'
  rationale: Iniuugnay ng ὡς τέκνα ἀγαπητά ang utos sa kanilang kalagayan o paraan bilang minamahal na mga anak. Pinananatili ng “bilang” ang posibilidad na ito nang hindi nagdaragdag ng isang mas detalyadong doktrina tungkol sa pagiging anak.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, maikli, at marangal. Ginamit ang “tagatulad” upang mapanatili ang tuwirang diwa ng imitasyon; inilagay ang talababa sa hulihan upang masaklaw ang alternatibong puwersa ng γίνεσθε.
