  text: This mystery is great[c][b][a], but I am speaking with reference to Messiah and the church.
translation:
  language: tl
  text: Dakila ang hiwagang ito[a], ngunit ang sinasabi ko ay may kinalaman sa Mesiyas at sa iglesya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Malalim ang hiwagang ito.” Ang salitang Griyego ay literal na “dakila” at maaaring tumukoy sa kadakilaan o kahalagahan, hindi lamang sa lalim nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: μυστήριον
  choice: hiwaga
  rationale: Sa gamit ni Pablo, tumutukoy ito sa katotohanang mula sa Diyos na dating lingid ngunit inihayag na; pinananatili ng “hiwaga” ang bigat ng termino nang hindi ito ginagawang isang bagay na palaisipan lamang.
- source_word: μέγα
  choice: dakila
  rationale: Ipinahahayag nito ang laki, bigat, o kahalagahan ng hiwaga. Mas natural at marangal dito ang “dakila” kaysa sa literal ngunit alanganing “malaki.”
- source_word: δὲ
  choice: ngunit
  rationale: Ipinakikita nito ang banayad na paglipat o pagtutuwid mula sa pahayag tungkol sa hiwaga tungo sa paglilinaw ni Pablo.
- source_word: λέγω εἰς
  choice: ang tinutukoy ko ay
  rationale: Likas na Filipino itong pagpapahayag ng idyomang Griyego na nagsasaad kung ano ang tinutukoy ng nagsasalita, nang hindi gumagamit ng literal ngunit hindi natural na katumbas ng εἰς.
- source_word: Χριστόν
  choice: Mesiyas
  rationale: Ang Χριστός ay gumaganap dito bilang titulo; malinaw na naihahatid ng “Mesiyas” ang titulong iyon.
- source_word: ἐκκλησίαν
  choice: iglesya
  rationale: Tumutukoy ito sa sama-samang bayan ng mga mananampalataya, hindi lamang sa isang gusali o karaniwang kapulungan.
theological_decisions:
- issue: Ang tinutukoy ng “hiwagang ito” sa ugnayan ng pag-aasawa, Mesiyas, at iglesya
  choice: Hindi tahasang tinukoy kung ang hiwaga ay ang pag-iisang-laman, ang sipi sa Genesis 2:24, o ang kaugnayan nito sa Mesiyas at sa iglesya.
  alternative: Tahasang ipaliwanag na ang pag-aasawa ay sagisag ng ugnayan ng Mesiyas at ng iglesya.
  rationale: Hindi nilulutas ng Griyegong pangungusap ang lahat ng posibleng saklaw ng “hiwagang ito.” Nililinaw lamang ni Pablo na ang kanyang tinutukoy ay ang Mesiyas at ang iglesya, kaya dapat panatilihin ng salin ang ganitong teolohikal na tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ang tinutukoy ko ay” bilang natural na katumbas ng idyomang Griyego, at pinanatili ang “hiwaga,” “Mesiyas,” at “iglesya” bilang pamilyar na mga terminong biblikal.
