  text: Οἱ ἄνδρες, ἀγαπᾶτε τὰς ⸀γυναῖκας, καθὼς καὶ ὁ Χριστὸς ἠγάπησεν τὴν ἐκκλησίαν καὶ ἑαυτὸν παρέδωκεν ὑπὲρ αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/025.yaml
  text: Husbands[a], love your wives, just as Messiah also loved the church and gave himself up for her[b],
translation:
  language: tl
  text: Mga asawang lalaki, mahalin ninyo ang inyong mga asawa, kung paanong minahal din ng Mesiyas[a] ang iglesya at ibinigay niya ang kanyang sarili alang-alang dito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Cristo.” Ang Griyegong titulong Χριστός ay isinaling “Mesiyas” dito upang mapanatili ang kahulugan nito bilang titulo.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “isinuko niya ang kanyang sarili para rito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ ἄνδρες
  choice: Mga asawang lalaki
  rationale: Sa konteksto ng mga tagubilin tungkol sa pag-aasawa at sa kaugnayan nito sa γυναῖκας, tumutukoy ito sa mga lalaki bilang mga asawa, hindi sa mga lalaki sa pangkalahatan.
- source_word: ἀγαπᾶτε
  choice: mahalin ninyo
  rationale: Ang pautos na anyo ay natural na naipapahayag sa modernong Tagalog sa pamamagitan ng “mahalin ninyo,” at pinananatili nito ang ugnayang leksikal sa ἠγάπησεν.
- source_word: τὰς γυναῖκας
  choice: ang inyong mga asawa
  rationale: Sa konteksto, ang γυναῖκας ay nangangahulugang mga asawang babae. Nililinaw ng “inyong” ang relasyong ipinahihiwatig ng tuwirang pagtawag sa mga asawang lalaki.
- source_word: καθὼς καὶ
  choice: kung paanong ... din
  rationale: Ipinapahayag nito ang paghahambing at inihaharap ang pag-ibig ng Mesiyas bilang huwaran, habang natural ang ayos sa Tagalog.
- source_word: ὁ Χριστός
  choice: ang Mesiyas
  rationale: Pinananatili ng “Mesiyas” ang kahulugan ng Χριστός bilang titulo; inilalagay sa talababa ang karaniwang alternatibong “Cristo.”
- source_word: ἠγάπησεν
  choice: minahal
  rationale: Ang payak na nagdaang aspekto ay angkop dito at pinananatili ang malinaw na pag-uugnay sa pautos na “mahalin.”
- source_word: τὴν ἐκκλησίαν
  choice: ang iglesya
  rationale: Sa kontekstong Paulino, tumutukoy ito sa bayan ng Diyos bilang isang kabuuan. Ang “iglesya” ay malinaw at nakaugaliang katumbas sa modernong Tagalog.
- source_word: ἑαυτὸν παρέδωκεν
  choice: ibinigay niya ang kanyang sarili
  rationale: Ipinahihiwatig nito ang kusang pagbibigay ng sarili nang hindi nagdaragdag ng paliwanag tungkol sa kamatayan o pagbabayad-sala na hindi tahasang nasa sugnay.
- source_word: ὑπὲρ αὐτῆς
  choice: alang-alang dito
  rationale: Ang “alang-alang dito” ay natural na nagsasaad ng pagkilos para sa kapakanan ng iglesya. Ang “dito” ay malinaw na tumutukoy sa iglesya nang hindi ginagaya ang kasariang pambalarila ng panghalip na Griyego.
theological_decisions:
- issue: Paglilipat ng Χριστός sa paghahambing ng pag-aasawa at ng iglesya
  choice: Mesiyas
  alternative: Cristo
  rationale: Ang “Mesiyas” ay nagpapanatili sa kahulugan ng salitang Griyego bilang titulo, samantalang kinikilala sa talababa ang nakaugaliang anyong “Cristo.”
- issue: Lawak ng sakripisyal na diwa ng παρέδωκεν ὑπὲρ αὐτῆς
  choice: ibinigay niya ang kanyang sarili alang-alang dito
  alternative: isinuko niya ang kanyang sarili para rito
  rationale: Pinananatili ng pangunahing salin ang kusang pagbibigay ng sarili para sa iglesya ngunit hindi nagdaragdag ng tiyak na teorya ng pagbabayad-sala; ipinakikita ng alternatibo ang posibleng diwa ng pagsuko o pagpapasakamay.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mga asawang lalaki” at “inyong mga asawa” upang maging malinaw ang relasyong tinutukoy, at ang “iglesya” bilang karaniwan at natural na terminong eklesyal. Pinanatili ang paghahambing at ang teolohikal na bigat ng kusang pagbibigay ng sarili nang walang dagdag na pagpapaliwanag.
