base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/019.yaml
  text: speaking to one another with psalms and hymns and spiritual songs[a], singing and making melody with your heart to the Lord[b],
translation:
  language: tl
  text: sa pagsasalita ninyo sa isa’t isa gamit ang mga salmo, mga himno, at mga awiting espirituwal[a], sa pag-awit at paglikha ninyo ng himig sa Panginoon sa inyong puso[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “sa gitna ninyo” o “sa inyong mga sarili”; ang anyong reflexive sa Griyego ay karaniwang inuunawa rito sa diwang katumbasan: “sa isa’t isa.”'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa pag-awit ninyo ng papuri”; ang Griyegong pandiwa ay maaaring mangahulugang umawit ng papuri o lumikha ng himig, nang hindi kinakailangang tukuyin ang paggamit ng instrumentong pangmusika.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλοῦντες
  choice: magsalita
  rationale: Pinananatili ang malawak na diwa ng pandiwa at ang kaugnayan nito sa iba pang mga participle, nang hindi nililimitahan sa pormal na pagbigkas.
- source_word: ἑαυτοῖς
  choice: sa isa't isa
  rationale: 'Sa kontekstong maramihan at pangkomunidad, likas na may katumbasang diwa ang reflexive: ang mga mananampalataya ay nagsasalita sa isa''t isa.'
- source_word: ψαλμοῖς
  choice: mga salmo
  rationale: Karaniwang tuwirang katumbas ito at hindi ipinapalagay kung tumutukoy lamang sa kanonikal na Mga Awit o pati sa mga awiting tulad ng salmo.
- source_word: ὕμνοις
  choice: mga himno
  rationale: Karaniwang katumbas na nagpapanatili sa tatlong magkakaugnay ngunit magkakaibang katawagan sa awit.
- source_word: ᾠδαῖς πνευματικαῖς
  choice: mga awiting espirituwal
  rationale: Likas na binabago ng πνευματικαῖς ang 'mga awit'; hindi nito pinalalakas ang pahayag tungo sa tahasang inspirasyon ng Espiritu na hindi naman tiyak na sinasabi ng teksto.
- source_word: ᾄδοντες
  choice: umaawit
  rationale: Tuwirang katumbas na nagpapanatili sa kilos ng pag-awit.
- source_word: ψάλλοντες
  choice: nagpupuri
  rationale: Sa kontekstong ito, maipahahayag ng ψάλλω ang musikal na pagpupuri nang hindi kinakailangang tukuyin kung may kasangkapang pangmusika.
- source_word: τῇ καρδίᾳ ὑμῶν
  choice: nang buong puso
  rationale: Natural na ekspresyong Tagalog para sa taos-pusong paraan ng pag-awit at pagpuri; ipinahahayag nito ang puso bilang paraan o kaloob-looban, hindi lamang pisikal na lokasyon.
- source_word: τῷ κυρίῳ
  choice: sa Panginoon
  rationale: Pinananatili ang tahasang κύριος at ang direksiyon o pinag-uukulan ng pag-awit at pagpuri, nang hindi idinaragdag ang pangalan ng referent.
theological_decisions:
- issue: Kahulugan ng ψάλλοντες kaugnay ng gawaing musikal
  choice: Isinaling 'nagpupuri' nang hindi tinutukoy ang paggamit ng instrumentong pangmusika.
  alternative: Gawing 'lumilikha ng himig' o 'tumutugtog.'
  rationale: Maaaring taglayin ng salita ang diwa ng pag-awit ng papuri o paglikha ng himig, ngunit sa kontekstong ito ay hindi nito sapilitang itinatakda o ipinagbabawal ang instrumentong pangmusika.
- issue: Tinutukoy ng 'Panginoon'
  choice: Pinanatiling 'Panginoon' nang walang idinagdag na pagkakakilanlan.
  alternative: Tahasan itong gawing 'Panginoong Jesus' o 'Cristo.'
  rationale: Maaaring ituro ng mas malawak na konteksto si Cristo, ngunit κύριος lamang ang nasa talata; pinananatili ng salin ang mismong antas ng pagtukoy ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang tatluhang 'mga salmo, mga himno, at mga awiting espirituwal.' Ginamit ang 'nang buong puso' bilang natural na Tagalog para sa datibong τῇ καρδίᾳ ὑμῶν, at inilagay sa talababa ang mas literal na alternatibo para sa ψάλλοντες.
