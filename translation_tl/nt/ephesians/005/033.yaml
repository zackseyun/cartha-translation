base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/033.yaml
  text: Nevertheless[a], you also—each one individually—must love his own wife as himself[b], and the wife must fear her husband.
translation:
  language: tl
  text: Gayunman, kayo rin—bawat asawang lalaki sa inyo—ay dapat magmahal sa sarili niyang asawa gaya ng pagmamahal niya sa kanyang sarili; at dapat gumalang[a] ang asawang babae sa kanyang asawang lalaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “matakot.” Dito, ang pandiwa ay maaari ring tumukoy sa mapitagang paggalang, hindi lamang sa pangamba.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Gayunman
  rationale: Naghuhudyat ito ng pangwakas na pagbubuod na may bahagyang paninsing o panalungat na diwa kaugnay ng naunang talakayan.
- source_word: καὶ ὑμεῖς οἱ καθ’ ἕνα ἕκαστος
  choice: ang bawat isa sa inyo
  rationale: 'Natural nitong ipinahahayag sa modernong Tagalog ang mariing distributibong diwa: ang tagubilin ay para sa bawat asawang lalaki nang personal.'
- source_word: τὴν ἑαυτοῦ γυναῖκα
  choice: sa sarili niyang asawa
  rationale: Sa kontekstong pangmag-asawa, ang γυνή ay 'asawa,' at pinananatili ng 'sarili niyang' ang reflexive na diin ng ἑαυτοῦ.
- source_word: οὕτως ἀγαπάτω
  choice: ay dapat magmahal
  rationale: Ipinahahayag ng 'dapat magmahal' ang puwersa ng pangatlong-panauhang pautos; ang οὕτως ay nauunawaan sa paghahambing na kasunod at sa naunang konteksto.
- source_word: ὡς ἑαυτόν
  choice: gaya ng pagmamahal niya sa kanyang sarili
  rationale: Ginawang ganap ang likas na paghahambing sa Tagalog habang pinananatili ang sarili bilang pamantayan ng pag-ibig.
- source_word: ἡ δὲ γυνὴ
  choice: at ang babae
  rationale: Tumutukoy ang γυνή sa asawang babae sa konteksto. Ang 'babae' ay umiiwas sa alanganing pag-uulit ng 'asawa' bago ang 'kanyang asawa,' habang malinaw pa rin ang tinutukoy.
- source_word: ἵνα φοβῆται
  choice: ay dapat magkaroon ng paggalang na may pagpipitagan
  rationale: Pinananatili nito ang masidhing diwa ng φοβέομαι bilang mapitagang paggalang sa relasyong pangmag-asawa, nang hindi ipinakahulugang takot dahil sa panganib o pang-aabuso.
- source_word: τὸν ἄνδρα
  choice: sa kanyang asawa
  rationale: Ang ἀνήρ ay nangangahulugang 'asawang lalaki' dito; likas sa Tagalog na gamitin ang 'kanyang asawa' matapos tukuyin ang babae.
theological_decisions:
- issue: Kahulugan ng φοβῆται sa tagubilin sa asawang babae
  choice: paggalang na may pagpipitagan
  alternative: matakot / gumalang
  rationale: Maaaring mangahulugan ang pandiwa ng takot, pagpipitagan, o paggalang. Ang napiling parirala ay nagpapanatili sa tindi at teolohikal na tensiyon ng salita ngunit hindi ipinapalagay na inuutusan ang asawa na mangilabot o mamuhay sa mapaniil na takot.
- issue: Tiyak na kasarian at relasyong pangmag-asawa
  choice: sarili niyang asawa ... ang babae ... kanyang asawa
  alternative: kani-kanilang kabiyak
  rationale: Pinananatili ang tiyak na husband-wife na balangkas at mga anyong isahan ng Griyego sa halip na gawing neutral ang kasarian.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang natural na ayos ng pangungusap at iniwasan ang arkaikong 'kanya-kanyang' o labis na teknikal na pananalita. Ang tuldok-kuwit ay nagpapanatili sa dalawang magkaugnay na tagubilin sa iisang pangwakas na buod.
