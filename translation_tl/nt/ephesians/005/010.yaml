  text: δοκιμάζοντες τί ἐστιν εὐάρεστον τῷ κυρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/010.yaml
  text: testing what is pleasing to the Lord;[a]
translation:
  language: tl
  text: patuloy ninyong sinusuri kung ano ang kalugod-lugod sa Panginoon;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “patuloy ninyong kinikilatis” o “inaalam” kung ano ang kalugod-lugod sa Panginoon.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκιμάζοντες
  choice: patuloy ninyong sinusuri
  rationale: Ang kasalukuyang aktibong participle ay nagpapatuloy sa daloy ng pangaral sa konteksto. Ipinahahayag ng “sinusuri” ang aktibong pagsubok at maingat na pagtaya upang makilala kung ano ang nararapat; idinagdag ang “patuloy” upang maipakita ang aspektong nagpapatuloy.
- source_word: τί
  choice: kung ano
  rationale: Likas na modernong Tagalog para sa di-tuwirang tanong na “what is pleasing.”
- source_word: ἐστιν
  choice: ang
  rationale: Sa natural na Tagalog, hindi kailangang tumbasan nang hiwalay ang copula; naipahahayag ang ugnayan sa pariralang “kung ano ang kalugod-lugod.”
- source_word: εὐάρεστον
  choice: kalugod-lugod
  rationale: Dignified at malinaw na salitang nagpapahayag ng bagay na nagbibigay-lugod o katanggap-tanggap sa paningin ng isang tao, nang hindi pinapahina ang relasyonal na diwa.
- source_word: τῷ κυρίῳ
  choice: sa Panginoon
  rationale: Likas na katumbas ng dative na kaugnay ng εὐάρεστον. Pinananatili ang titulong “Panginoon” nang hindi tahasang tinutukoy kung si Jesus o ang Diyos ang tinutukoy.
theological_decisions:
- issue: Tinutukoy ng κύριος
  choice: Panginoon
  alternative: Panginoong Jesus; Diyos
  rationale: Titulong κύριος lamang ang nasa Griyego. Bagaman maaaring unawain ito bilang pagtukoy kay Cristo sa konteksto, hindi nilulutas ng salin ang hindi tahasang tinukoy ng talata.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ang “patuloy ninyong” ay umaangkop sa pangmaramihang participle at sa nagpapatuloy na daloy ng pangaral; ang semicolon ay pinananatili dahil bahagi ang talata ng mas malaking pangungusap.
