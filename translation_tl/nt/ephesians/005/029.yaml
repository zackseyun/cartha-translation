  text: οὐδεὶς γάρ ποτε τὴν ἑαυτοῦ σάρκα ἐμίσησεν, ἀλλὰ ἐκτρέφει καὶ θάλπει αὐτήν, καθὼς καὶ ὁ ⸀Χριστὸς τὴν ἐκκλησίαν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/029.yaml
  text: For no one ever hated his own flesh[a], but nourishes and cherishes it, just as the Messiah also does the church[c][b],
translation:
  language: tl
  text: Sapagkat walang sinuman ang kailanman napoot sa sarili niyang laman[a]; sa halip, pinakakain at kinakalinga niya ito, gaya rin ng pagpapakain at pagkalinga ng Mesiyas sa iglesya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sarili niyang katawan.” Literal na “laman” ang salitang Griyego rito at tumutukoy sa pisikal na sarili, hindi sa “makasalanang kalikasan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς γάρ ποτε
  choice: Sapagkat walang sinuman ang kailanma’y
  rationale: Pinananatili ng “Sapagkat” ang paliwanag na ugnayan ng γάρ sa naunang pahayag, at likas na ipinahahayag ng “walang sinuman ang kailanma’y” ang pangkalahatang diwa ng οὐδεὶς ... ποτε.
- source_word: τὴν ἑαυτοῦ σάρκα
  choice: sa sarili niyang laman
  rationale: Literal dito ang σάρξ at tumutukoy sa pisikal na sarili sa paghahambing tungkol sa katawan, hindi sa diwang “makasalanang kalikasan.” Ang “laman” ay tuwiran at nauunawaan sa konteksto.
- source_word: ἐμίσησεν
  choice: namuhi
  rationale: Ang “namuhi” ay likas at matinding katumbas ng μισέω, at ang aspektong naganap ay angkop sa pahayag tungkol sa anumang pagkakataon sa nakaraan.
- source_word: ἀλλὰ
  choice: sa halip
  rationale: 'Malinaw na itinatampok ang salungat na kilos: hindi pagkapoot kundi pag-aalaga.'
- source_word: ἐκτρέφει
  choice: pinakakain
  rationale: Sa konteksto ng sariling katawan, malinaw nitong ipinahahayag ang paglalaan ng pagkain at pagpapalusog na saklaw ng ἐκτρέφω.
- source_word: θάλπει
  choice: kinakalinga
  rationale: Ipinahahayag ng “kinakalinga” ang magiliw at mapagmahal na pag-aalaga ng θάλπω nang hindi nililimitahan ito sa literal na “pinaiinit.”
- source_word: καθὼς καὶ
  choice: gaya rin ng
  rationale: Pinananatili ang paghahambing ng καθώς at ang dagdag na diin ng καί.
- source_word: ὁ Χριστὸς
  choice: ang Mesiyas
  rationale: Ginagamit dito ang Χριστός bilang titulo. Isinasalin ng “Mesiyas” ang kahulugan nito at nananatiling pamilyar sa modernong Tagalog.
- source_word: τὴν ἐκκλησίαν
  choice: sa iglesya
  rationale: Ang “iglesya” ay karaniwan at angkop na katawagan sa sambayanan ng mga mananampalataya bilang isang kabuuan.
theological_decisions:
- issue: Kahulugan ng σάρξ
  choice: laman
  alternative: katawan
  rationale: Literal na pisikal na sarili ang tinutukoy sa analohiya, kaya pinananatili ang “laman.” Inilalagay sa talababa ang mas likas ngunit bahagyang nagpapaliwanag na “katawan.”
- issue: Paglalarawan kay Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: May pantukoy ang titulo at gumaganap itong titulo sa paghahambing. Pinananatili sa talababa ang tradisyonal na anyong “Cristo.”
- issue: Ellipsis sa huling sugnay
  choice: gaya rin ng ginagawa ng Mesiyas sa iglesya
  alternative: gaya rin ng Mesiyas sa iglesya
  rationale: Walang inuulit na pandiwa sa Griyego, ngunit likas sa Tagalog na gamitin ang “ginagawa” upang ituro pabalik ang dalawang kilos na “pinakakain at kinakalinga,” nang hindi pinipili ang isa lamang.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “namuhi,” “pinakakain,” at “kinakalinga” upang mapanatili ang lakas at magiliw na tono ng mga pandiwang Griyego. Ang “ginagawa ... sa iglesya” ay likas na Tagalog na kumukumpleto sa ellipsis ng orihinal nang hindi dinaragdagan ang nilalaman.
