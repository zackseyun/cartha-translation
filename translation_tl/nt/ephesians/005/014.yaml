  text: πᾶν γὰρ τὸ φανερούμενον φῶς ἐστιν. διὸ λέγει· Ἔγειρε, ὁ καθεύδων, καὶ ἀνάστα ἐκ τῶν νεκρῶν, καὶ ἐπιφαύσει σοι ὁ Χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/014.yaml
  text: For everything that is made visible is light[a]. Therefore it says, “Wake up, sleeper, and rise from the dead[c][b], and Messiah will shine on you.”
translation:
  language: tl
  text: 'Sapagkat ang lahat ng inihahayag ay liwanag.[a] Kaya nga sinasabi:


    “Gumising ka, ikaw na natutulog,


    at bumangon ka mula sa mga patay,[b]


    at magbibigay-liwanag sa iyo ang Mesiyas.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “ang lahat ng inilalantad ay liwanag” o “ang lahat ng ginagawang nakikita ay liwanag.” Ang φανερούμενον ay maaaring mangahulugang “inihahayag,” “inilalantad,” o “ginagawang nakikita.”'
    reason: lexical_alternative
  - marker: b
    text: Hindi tiyak ang pinagmulan ng siping ito. Maaaring umaalingawngaw ito sa mga tema sa Kasulatan, lalo na sa Isaias 60:1, o maaaring mula ito sa isang sinaunang himnong Kristiyano.
    reason: cross_reference
  - marker: c
    text: 'Griyego: “ang Cristo.” Ang Χριστός ay nangangahulugang “ang Pinahiran” at ginagamit dito bilang titulo; kaya isinaling “Mesiyas.” Tradisyonal na salin: “Cristo.”'
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶν τὸ φανερούμενον
  choice: ang lahat ng inihahayag
  rationale: Ang neuter singular na may articular participle ay pangkalahatan ang saklaw. Ang “inihahayag” ay nagpapanatili sa pasibong diwa at sa ugnayan nito sa naunang paglalantad ng liwanag.
- source_word: φῶς ἐστιν
  choice: ay nagiging liwanag
  rationale: Bagaman literal na “ay liwanag,” maaaring ipahiwatig ng pangungusap na ang nailalantad ay pumapasok sa larangan ng liwanag. Pinili ang “nagiging” para maging likas sa Tagalog habang inilalagay sa talababa ang mas pormal na alternatibo.
- source_word: διὸ λέγει
  choice: Kaya sinasabi
  rationale: Pinananatiling di-tiyak ang simuno, gaya ng Griyego, upang hindi tukuyin kung Kasulatan, Diyos, o isang himno ang nagsasalita.
- source_word: Ἔγειρε, ὁ καθεύδων
  choice: Gumising ka, ikaw na natutulog
  rationale: Likas at tuwirang pautos sa modernong Tagalog, habang pinananatili ang talinghaga ng pagtulog.
- source_word: ἀνάστα ἐκ τῶν νεκρῶν
  choice: bumangon ka mula sa mga patay
  rationale: Pinananatili ng “bumangon” ang literal at muling-pagkabuhay na alingawngaw ng ἀνάστα; ang “mula sa mga patay” ay karaniwang katumbas ng Griyegong parirala.
- source_word: ἐπιφαύσει σοι
  choice: liliwanagan ka
  rationale: Malinaw at natural na Tagalog para sa pagliwanag sa isang tao, at pinananatili ang imahen ng liwanag.
- source_word: ὁ Χριστός
  choice: ang Mesiyas
  rationale: May pantukoy ang Χριστός at gumaganap dito bilang titulo; isinasalin ang kahulugan nito sa halip na ituring lamang na pangalang pantangi.
theological_decisions:
- issue: Katangian at pinagmulan ng sipi
  choice: Gamitin ang di-tiyak na “sinasabi” at huwag tukuyin ang pinagmulan.
  alternative: “sinasabi ng Kasulatan,” “sinasabi niya,” o “sinasabi sa isang himno”
  rationale: Walang tahasang simuno ang λέγει, at hindi tiyak ang eksaktong pinagmulan ng sipi. Pinananatili ng salin ang pagiging bukás ng teksto.
- issue: Kahulugan ng πᾶν τὸ φανερούμενον φῶς ἐστιν
  choice: “ang lahat ng inihahayag ay nagiging liwanag”
  alternative: “ang lahat ng inihahayag ay liwanag” o “ang lahat ng inilalantad ay nagiging hayag sa liwanag”
  rationale: Masinsin at sintaktikong mahirap ang pahayag. Hindi ito pinalawak upang gawing tahasan ang isang interpretasyong wala sa Griyego; nakatala ang mas literal na anyo sa talababa.
- issue: Pagbibigay ng Χριστός
  choice: “ang Mesiyas”
  alternative: “ang Cristo”
  rationale: Dahil may artikulo at malinaw na titulo ang gamit, ipinapahayag ang kahulugan ng Χριστός bilang “Mesiyas,” nang hindi nagdaragdag ng denominasyonal na paliwanag.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “ikaw na natutulog” sa halip na mas pampanitikang “natutulog,” at inayos bilang patulang sipi ang tatlong magkakaugnay na pautos/pangako. Ang mga panandang talababa [a], [b], at [c] ay nasa pangunahing teksto.
