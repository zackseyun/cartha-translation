  text: For you were once darkness[a], but now you are light in the Lord. Walk as children of light,
translation:
  language: tl
  text: Sapagkat dati kayong kadiliman, ngunit ngayon ay liwanag kayo sa Panginoon. Mamuhay kayo bilang mga anak ng liwanag.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na, “Lumakad kayo bilang mga anak ng liwanag.” Ginagamit ni Pablo ang “lumakad” bilang metapora para sa paraan ng pamumuhay.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦτε γάρ ποτε
  choice: Sapagkat dati kayong
  rationale: Ipinapakita ng “sapagkat” ang paliwanag na kaugnayan sa naunang tagubilin, at natural na ipinahahayag ng “dati” ang nakaraang kalagayan.
- source_word: σκότος
  choice: kadiliman
  rationale: 'Pananatilihin ang pangngalang metaporikal: hindi lamang sila nasa kadiliman, kundi sila mismo ay tinawag na “kadiliman.”'
- source_word: νῦν δὲ
  choice: ngunit ngayon
  rationale: Malinaw na pinananatili ang matinding paghahambing ng dating kalagayan at ng kasalukuyan.
- source_word: φῶς
  choice: liwanag
  rationale: Pananatilihin ang tuwirang metapora ng pagkakakilanlan, sa halip na gawing “nasa liwanag” o “naliwanagan.”
- source_word: ἐν κυρίῳ
  choice: sa Panginoon
  rationale: Ipinahahayag nito ang kanilang bagong kalagayan kaugnay at kaisa ng Panginoon, nang hindi nililimitahan ang ἐν sa instrumental na kahulugan.
- source_word: ὡς τέκνα φωτός
  choice: bilang mga anak ng liwanag
  rationale: Ang “bilang” ay nagpapahiwatig ng pamumuhay na naaayon sa kanilang pagkakakilanlan; ang τέκνα ay inklusibong “mga anak.”
- source_word: περιπατεῖτε
  choice: Lumakad kayo
  rationale: Pinananatili ang karaniwang metaporang etikal ni Pablo tungkol sa paraan ng pamumuhay; ipinaliliwanag sa talababa ang mas interpretibong salin.
theological_decisions:
- issue: Metaporikal na pagkakakilanlan sa “dati kayong kadiliman, ngunit ngayon ay liwanag kayo”
  choice: Panatilihin ang matitinding pangngalang “kadiliman” at “liwanag.”
  alternative: “Dati kayong nasa kadiliman, ngunit ngayon ay nasa liwanag na kayo” o “dati kayong madilim, ngunit ngayon ay naliwanagan.”
  rationale: Mga panaguring pangngalan ang ginamit sa Griyego, walang pang-ukol; binibigyang-diin nito ang pagbabagong naganap sa kanilang pagkakakilanlan at kalagayang moral-espirituwal.
- issue: Kahulugan ng ἐν κυρίῳ
  choice: sa Panginoon
  alternative: “sa pamamagitan ng Panginoon” o “dahil sa Panginoon”
  rationale: Pinananatili ng “sa Panginoon” ang maaaring diwa ng saklaw, kaugnayan, o pakikiisa sa Panginoon nang hindi sapilitang nilulutas ang saklaw ng parirala.
- issue: Pagtutumbas sa κύριος
  choice: Panginoon
  alternative: Guro o Amo
  rationale: Ang “Panginoon” ang natural at teolohikal na angkop na katumbas sa kontekstong Paulino, nang hindi pinakikitid ang kahulugan.
translation_notes:
  register: Makabago at marangal na Filipino, na madaling maunawaan ngunit pinananatili ang matitinding metaporang “kadiliman,” “liwanag,” at “lumakad.”
