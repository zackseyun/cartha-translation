source:
  edition: SBLGNT
  text: ἵνα παραστήσῃ ⸀αὐτὸς ἑαυτῷ ἔνδοξον τὴν ἐκκλησίαν, μὴ ἔχουσαν σπίλον ἢ ῥυτίδα ἤ τι τῶν τοιούτων, ἀλλ’ ἵνα ᾖ ἁγία καὶ ἄμωμος.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/027.yaml
  text: so that he himself might present the church to himself in splendor[a], not having spot or wrinkle or anything like that[c][b], but so that she might be holy and blameless.
translation:
  language: tl
  text: upang siya mismo ang magharap sa kanyang sarili ng iglesyang maringal[a], na walang batik o kulubot o anumang katulad nito[b], kundi upang ito ay maging banal at walang kapintasan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “iglesyang maluwalhati”; maaari ring unawain ang pang-uri bilang kalagayan: “ang iglesya na taglay ang karilagan.”'
    reason: lexical_alternative
  - marker: b
    text: O “o anumang bagay na gaya ng mga iyon.”
    reason: lexical_alternative
  - marker: c
    text: O “walang dungis.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραστήσῃ
  choice: magharap
  rationale: Ipinahahayag ng aorist subjunctive na kasama ng ἵνα ang layunin. Ang “magharap” ay natural sa Filipino para sa pormal na pagdadala o paghaharap ng isang tao sa harap ng iba at hindi nito pinapaliit ang larawang pangkasal.
- source_word: αὐτὸς
  choice: siya mismo
  rationale: Tahasang binibigyang-diin ng panghalip ang gumagawa ng kilos; pinananatili ng “siya mismo” ang diin.
- source_word: ἑαυτῷ
  choice: sa kanyang sarili
  rationale: Pinananatili nito ang reflexive na puwersa ng dative at ang kapansin-pansing larawan na siya mismo ang naghaharap ng iglesya sa kanyang sarili.
- source_word: ἔνδοξον
  choice: maringal
  rationale: Inilalarawan ng pang-uri ang iglesya sa kalagayan ng karangalan at kaningningan. Ang “maringal” ay dignified at natural, habang ang talababa ay nagpapanatili sa posibleng pagbasa bilang kalagayang “taglay ang karilagan.”
- source_word: τὴν ἐκκλησίαν
  choice: ang iglesya
  rationale: Sa kontekstong Paulino, tumutukoy ito sa sambayanan ng Diyos bilang isang kabuuan. Ang “iglesya” ang kinikilalang katumbas sa modernong Filipino.
- source_word: μὴ ἔχουσαν
  choice: na walang
  rationale: Natural na inilalarawan sa Filipino ang kalagayan ng iglesya sa pamamagitan ng “na walang,” habang tapat sa negatibong participial phrase.
- source_word: σπίλον
  choice: batik
  rationale: Ang “batik” ay kongkretong larawan ng mantsa o dungis at mahusay na ipinaparis sa “kulubot.”
- source_word: ῥυτίδα
  choice: kulubot
  rationale: Ito ang tuwirang at karaniwang katumbas sa Filipino at pinananatili ang larawang pangkasal at pisikal.
- source_word: ἤ τι τῶν τοιούτων
  choice: o anumang katulad nito
  rationale: Pinananatili nito ang bukas na kategoryang lampas sa dalawang halimbawang nabanggit at natural itong pakinggan sa modernong Filipino.
- source_word: ἀλλ’ ἵνα ᾖ
  choice: kundi upang ito ay maging
  rationale: Pinananatili ang ikalawang sugnay na may ἵνα bilang positibong layuning katapat ng negatibong paglalarawan. Ang “ito” ay malinaw na tumutukoy sa iglesya nang hindi nagpapataw ng kasariang gramatikal na wala sa Filipino.
- source_word: ἁγία
  choice: banal
  rationale: Ang “banal” ang kinikilalang salin at pinananatili ang bigat ng konsepto nang hindi ito ginagawang paliwanag lamang na “ibinukod.”
- source_word: ἄμωμος
  choice: walang kapintasan
  rationale: Saklaw nito ang pagiging walang maipipintas o maipaparatang. Pinananatili rin ng talababa ang alternatibong mas kongkretong “walang dungis.”
theological_decisions:
- issue: Ang reflexive na larawan ng paghaharap sa paghahambing ni Cristo at ng iglesya sa mag-asawa
  choice: Pinanatili ang “siya mismo” at “sa kanyang sarili.”
  alternative: Pasimplehin bilang “iharap ang iglesya,” o ipaliwanag na ito ay isang eskatolohikal na paghaharap sa Diyos.
  rationale: Tahasang naroon sa Griyego ang emphatic na αὐτός at reflexive na ἑαυτῷ. Hindi nilulutas ng salin ang teolohikal at pampanitikang tensiyon sa pamamagitan ng dagdag na interpretasyon.
- issue: Ang magkasanib na larawang pangkasal at pananalita tungkol sa kadalisayan
  choice: Ginamit ang “batik o kulubot” kasama ng “banal at walang kapintasan.”
  alternative: Gamitin ang “mantsa o kulubot” at “banal at walang dungis.”
  rationale: Pinananatili ng salin ang parehong kongkretong larawan ng kagandahan at ang moral o panrelihiyong wika ng kabanalan, nang hindi nililimitahan ang talata sa iisang doktrinal na pagbasa.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Pinanatili ang terminong “iglesya,” ang diin ng “siya mismo,” at ang reflexive na “sa kanyang sarili.” Iniwasan ang gendered na panghalip para sa iglesya dahil walang katumbas na kasariang gramatikal sa Filipino, ngunit nananatili ang larawang pangkasal sa konteksto.
