  text: Μηδεὶς ὑμᾶς ἀπατάτω κενοῖς λόγοις, διὰ ταῦτα γὰρ ἔρχεται ἡ ὀργὴ τοῦ θεοῦ ἐπὶ τοὺς υἱοὺς τῆς ἀπειθείας.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/006.yaml
  text: Let no one deceive you with empty words[a], for because of these things the wrath of God comes upon the sons of disobedience.
translation:
  language: tl
  text: Huwag kayong dayain ninuman sa pamamagitan ng hungkag na mga salita, sapagkat dahil sa mga bagay na ito ay dumarating ang poot ng Diyos sa mga anak ng pagsuway[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga anak ng pagsuway” ay tumutukoy sa mga taong nailalarawan sa kanilang pagsuway.
    reason: Paglilinaw sa idyomang τοὺς υἱοὺς τῆς ἀπειθείας.
lexical_decisions:
- source_word: Μηδεὶς ὑμᾶς ἀπατάτω
  choice: Huwag kayong padaya kaninuman
  rationale: Likas na pautos na pagbabawal sa Filipino na pinananatili ang diwa ng patuloy na pag-iingat laban sa panlilinlang.
- source_word: κενοῖς λόγοις
  choice: sa mga hungkag na salita
  rationale: Pinananatili ng “hungkag” ang talinghaga ng mga salitang walang tunay na laman o kabuluhan, habang nananatiling malinaw at marangal sa modernong Filipino.
- source_word: διὰ ταῦτα
  choice: dahil sa mga bagay na ito
  rationale: Malinaw na ipinapahayag ang sanhi na taglay ng διά na may accusative at pinananatili ang pagtukoy sa mga kasalanang nabanggit sa konteksto.
- source_word: ἔρχεται
  choice: dumarating
  rationale: Pinananatili ang present tense at hindi ipinipilit kung ito ay pangkasalukuyan, palagian, o nalalapit.
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: ang poot ng Diyos
  rationale: Tuwirang isinasalin ang ὀργή at hindi ito pinapalabnaw bilang pangkalahatang “hatol.”
- source_word: ἐπὶ
  choice: sa
  rationale: Ang “sa” ang natural na Filipino para sa pagdating ng poot sa mga taong tinutukoy; hindi kailangang gawing artipisyal ang parirala sa pamamagitan ng mas literal na anyo.
- source_word: τοὺς υἱοὺς τῆς ἀπειθείας
  choice: mga anak ng pagsuway
  rationale: Pinananatili ang Semitikong idyoma ng Griyego. Ang “anak” sa Filipino ay likas na hindi minamarkahan ang kasarian, kaya hindi idinaragdag ang “lalaki,” na wala namang kailangang idiin sa konteksto.
theological_decisions:
- issue: Wika tungkol sa poot ng Diyos
  choice: ang poot ng Diyos
  alternative: ang hatol ng Diyos
  rationale: Tahasan ang ὀργή sa pinagmulan; dapat panatilihin ang bigat at tensiyong teolohikal nito sa halip na palitan ng mas malawak at mas banayad na salita.
- issue: Idyomang “mga anak ng pagsuway”
  choice: mga anak ng pagsuway
  alternative: mga taong likas na masuwayin
  rationale: Pinananatili sa pangunahing teksto ang larawan at anyo ng idyoma, habang nililinaw sa talababa na tumutukoy ito sa mga taong kinikilala sa kanilang pagsuway.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa pagbasa sa Kasulatan. Ginamit ang “hungkag” upang mapanatili ang talinghaga ng κενός nang hindi nagiging lipas o labis na teknikal.
