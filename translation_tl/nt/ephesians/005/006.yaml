  terminology: Ang “hungkag na mga salita,” “poot ng Diyos,” at “mga anak ng pagsuway” ay angkop at pinananatili ang mahalagang leksikal at idyomatikong mga elemento ng Griyego. Hindi dapat palitan ang “poot” ng “hatol.”
