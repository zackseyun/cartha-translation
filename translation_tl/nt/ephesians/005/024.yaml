revisions:
- from: Ngunit kung paanong nagpapasakop ang iglesya sa Mesiyas[a], gayundin ang mga asawang babae sa kani-kanilang asawa sa lahat ng bagay.
  to: Ngunit kung paanong nagpapasakop ang iglesya sa Mesiyas[a], gayundin nagpapasakop ang mga asawang babae sa kani-kanilang asawang lalaki sa lahat ng bagay.
  rationale: Inulit ang pandiwang ‘nagpapasakop’ upang maging ganap at likas ang ikalawang sugnay sa Filipino, kahit eliptiko ang Griyego. Pinalitan ang di-tiyak na ‘asawa’ ng ‘asawang lalaki’ upang malinaw na maihatid ang ἀνδράσιν sa kontekstong pangmag-asawa. Walang idinagdag na limitasyon sa ‘sa lahat ng bagay.’
