  text: ἀλλὰ ⸀ὡς ἡ ἐκκλησία ὑποτάσσεται τῷ Χριστῷ, οὕτως καὶ αἱ γυναῖκες ⸀τοῖς ἀνδράσιν ἐν παντί.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/024.yaml
  text: But as the church submits to Messiah[a], so also wives to their husbands in everything.
translation:
  language: tl
  text: Ngunit kung paanong nagpapasakop ang iglesya sa Mesiyas[a], gayundin nagpapasakop ang mga asawang babae sa kani-kanilang asawang lalaki sa lahat ng bagay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Cristo.”
    reason: Ibinibigay ang tradisyonal na salin ng titulong Griyego na Χριστός bilang alternatibo.
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ngunit
  rationale: Likas na panandang Filipino para sa pagsalungat at pagpapatuloy ng diwa mula sa naunang pahayag.
- source_word: ὡς ... οὕτως καὶ
  choice: kung paanong ... gayundin
  rationale: Pinananatili ang magkaugnay na paghahambing ng Griyego sa malinaw at natural na Filipino.
- source_word: ἡ ἐκκλησία
  choice: ang iglesya
  rationale: Karaniwan at malinaw na tawag sa pamayanang Kristiyano sa kontekstong Paulino.
- source_word: ὑποτάσσεται
  choice: nagpapasakop
  rationale: Ipinahahayag ang kusang paglalagay ng sarili sa ilalim ng kaayusan nang hindi nagdaragdag ng sapilitang diwa na wala sa pandiwa.
- source_word: τῷ Χριστῷ
  choice: sa Mesiyas
  rationale: Ang Χριστός ay gumaganap bilang titulo rito; isinasalin itong “Mesiyas,” habang inilalagay sa talababa ang tradisyonal na “Cristo.”
- source_word: αἱ γυναῖκες
  choice: ang mga asawang babae
  rationale: Sa konteksto ng sambahayan at sa pagtambal nito sa ἀνδράσιν, ang kahulugan ay mga asawang babae, hindi kababaihan sa pangkalahatan.
- source_word: τοῖς ἀνδράσιν
  choice: sa kani-kanilang asawa
  rationale: Ang ἀνήρ ay nangangahulugang “asawang lalaki” sa kontekstong ito; ipinahahayag ng “kani-kanilang” ang ugnayang pangmag-asawang ipinahihiwatig ng Griyego.
- source_word: ἐν παντί
  choice: sa lahat ng bagay
  rationale: Tuwirang pinananatili ang lawak ng pahayag nang walang idinaragdag na paliwanag o limitasyon.
- source_word: '[ellipsis of ὑποτάσσεται in the second clause]'
  choice: gayundin ang mga asawang babae sa kani-kanilang asawa
  rationale: Pinananatili ang elipsis ng Griyego; malinaw sa Filipino na ang “nagpapasakop” mula sa unang sugnay ang nauunawaan sa ikalawa.
theological_decisions:
- issue: Pagsasalin sa Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Titulo ang gamit ng Χριστός sa paghahambing na ito. Pinananatili sa talababa ang tradisyonal na salin bilang lehitimong alternatibo.
- issue: Saklaw ng sugnay tungkol sa pagpapasakop ng asawa
  choice: Panatilihin ang “sa lahat ng bagay” nang walang idinagdag na pasubali
  alternative: Mga mapagpaliwanag na dagdag gaya ng “sa lahat ng bagay na nararapat”
  rationale: ἐν παντί lamang ang sinasabi ng teksto. Ang pagdaragdag ng pasubali ay lulutas sa tensiyong teolohikal sa halip na tapat itong panatilihin.
- issue: Hindi pag-uulit ng pandiwa sa ikalawang sugnay
  choice: Panatilihin ang elipsis
  alternative: Idagdag ang “ay magpasakop”
  rationale: Walang inuulit na pandiwa ang Griyego sa ikalawang sugnay, at nauunawaan naman sa Filipino ang pandiwang hango sa unang sugnay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nagpapasakop” upang ihatid ang relasyonal na diwa ng pandiwa, at pinanatili ang maikli at balanseng estruktura ng orihinal.
