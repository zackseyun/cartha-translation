  text: submitting to one another in the fear of Messiah[a][b].
translation:
  language: tl
  text: na nagpapasakop sa isa’t isa nang may takot sa Mesiyas[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nang may pagpipitagan sa Mesiyas” o “nang may taimtim na paggalang sa Mesiyas.”
    reason: lexical_alternative
  - marker: b
    text: 'Griyego: “Cristo”; isinalin ditong “Mesiyas” sapagkat ginagamit ang Χριστός bilang titulo.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὑποτασσόμενοι
  choice: na nagpapasakop
  rationale: Pinananatili ang anyong participyo at ang kaugnayan nito sa naunang pangungusap. Natural sa Tagalog ang “na nagpapasakop” at hindi nito labis na binibigyang-diin ang reflexive na di tahasang nakasaad sa anyong Griyego.
- source_word: ἀλλήλοις
  choice: sa isa’t isa
  rationale: Malinaw at karaniwang katumbas ng reciprocal pronoun, kaya napapanatili ang diwa ng pagtutumbasang ugnayan.
- source_word: ἐν φόβῳ
  choice: nang may takot
  rationale: Ipinahahayag ang paraan o saloobing kaakibat ng pagpapasakop. Mas natural ito sa Tagalog kaysa sa literal na “sa takot,” habang pinananatili ang pangunahing diwa ng φόβος.
- source_word: φόβῳ
  choice: takot
  rationale: Pinananatili ang pangunahing leksikal na diwa at ang tensiyong teolohikal ng may-pagpipitagang takot, sa halip na agad itong palambutin bilang paggalang lamang.
- source_word: Χριστοῦ
  choice: Mesiyas
  rationale: Dito ay nananatiling aktibo ang gamit ng Χριστός bilang titulo; kaya isinalin ito bilang “Mesiyas” sa halip na itransliterang “Cristo.”
theological_decisions:
- issue: Kahulugan ng “takot sa Mesiyas”
  choice: takot na nakatuon sa Mesiyas, na may diwa ng pagpipitagan
  alternative: takot na dulot ng Mesiyas; pagpipitagan sa Mesiyas
  rationale: Ang pinakadirektang pagbasa sa genitive ay ang Mesiyas ang pinatutungkulan ng takot. Ang “takot” ay nagpapanatili sa lakas at tensiyon ng teksto nang hindi ito awtomatikong ginagawang sindak o simpleng paggalang.
- issue: Pagpapakahulugan sa Χριστοῦ
  choice: Mesiyas
  alternative: Cristo
  rationale: Sa pariralang ito, ang Χριστός ay makabuluhang titulo pa rin para kay Jesus. Inilalagay sa talababa ang tradisyonal na “Cristo” bilang lehitimong alternatibo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ang “na nagpapasakop” ay sadyang nagpapanatili sa anyong nakaugnay sa naunang konteksto, sa halip na gawing hiwalay na pautos ang talata.
