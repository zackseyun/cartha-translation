  text: In the same way, husbands also ought to love their own wives as their own bodies. He who loves his own wife loves himself,
translation:
  language: tl
  text: Sa gayunding paraan, dapat ding ibigin ng mga asawang lalaki ang kani-kanilang asawa gaya ng sarili nilang katawan. Ang umiibig sa sarili niyang asawa ay umiibig sa kanyang sarili.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: Sa gayunding paraan
  rationale: Likas na Filipino na nag-uugnay sa talata sa naunang paghahambing at tagubilin, habang pinananatili ang inferensiyal na puwersa.
- source_word: ὀφείλουσιν
  choice: dapat
  rationale: Ipinapahayag ang moral na pananagutan nang hindi ginagawang tuwirang pautos ang anyong pasalaysay ng Griyego.
- source_word: καὶ
  choice: din
  rationale: 'Pinananatili ang pandagdag na diwa: ang mga asawang lalaki ay kabilang din sa huwarang kalalahad lamang.'
- source_word: οἱ ἄνδρες
  choice: mga asawang lalaki
  rationale: Sa konteksto ng mga tagubilin sa mag-asawa, tumutukoy ang ἀνήρ sa mga lalaking may asawa, hindi sa mga lalaki sa pangkalahatan.
- source_word: ἀγαπᾶν
  choice: ibigin
  rationale: Pinananatili ang paulit-ulit na pandiwa ng pag-ibig at ang marangal na rehistro ng talata.
- source_word: τὰς ἑαυτῶν γυναῖκας
  choice: ang kani-kanilang asawa
  rationale: Ipinahihiwatig ng 'kani-kanilang' ang distributibo at reflexive na diin ng ἑαυτῶν; malinaw sa konteksto na ang tinutukoy ay mga asawang babae.
- source_word: ὡς τὰ ἑαυτῶν σώματα
  choice: gaya ng sarili nilang katawan
  rationale: Tuwirang pinananatili ang paghahambing at ang literal na larawan ng σώματα; ang kolektibong pang-isahan na 'katawan' ay likas sa Filipino pagkatapos ng 'sarili nilang.'
- source_word: ὁ ἀγαπῶν
  choice: Ang umiibig
  rationale: Likas na substantibong parirala sa Filipino; hindi kailangang ulitin ang panlalaking katawagan sapagkat malinaw ang agarang tinutukoy.
- source_word: τὴν ἑαυτοῦ γυναῖκα
  choice: sa sarili niyang asawa
  rationale: Pinananatili ng 'sarili niyang' ang reflexive na diin, at malinaw sa konteksto ang kahulugang marital ng γυνή.
- source_word: ἑαυτὸν ἀγαπᾷ
  choice: ay umiibig sa kanyang sarili
  rationale: Tuwirang inililipat ang reflexive na panghalip at inuulit ang parehong pandiwa upang mapanatili ang lohika ni Pablo.
theological_decisions:
- issue: Panlalaking wika sa tagubilin sa sambahayan
  choice: Isinalin ang οἱ ἄνδρες bilang 'mga asawang lalaki,' habang ang kasunod na substantibong participle ay 'Ang umiibig.'
  alternative: mga lalaki; Ang asawang lalaking umiibig
  rationale: Partikular sa mga asawang lalaki ang tagubilin. Gayunman, hindi kailangang piliting markahan muli ang kasarian sa ikalawang pangungusap dahil malinaw na ang antecedent at natural sa Filipino ang 'Ang umiibig.'
- issue: Katangian ng paghahambing sa asawa at katawan
  choice: Pinanatiling tahasan ang pagkakatulad nang walang dagdag na paliwanag na doktrinal.
  alternative: Palawakin ito bilang pahayag ng metapisikal na pagkakaisa o identidad.
  rationale: Inihahambing ng teksto ang pag-ibig ng lalaki sa kanyang asawa sa pag-ibig sa sariling katawan at saka sinasabing ang pag-ibig sa asawa ay pag-ibig sa sarili. Dapat mapanatili ang etikal at teolohikal na tensiyong ito nang hindi nilalampasan ang mismong sinabi.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang 'asawang lalaki' para sa tiyak na marital na kahulugan, 'kani-kanilang' para sa plural-distributive reflexive, at 'ibigin/umiibig' upang mapanatili ang leksikal na pag-uulit.
