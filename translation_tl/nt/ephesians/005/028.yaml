  source_fidelity: Tumpak na naipapahayag ang οὕτως bilang “Sa gayunding paraan,” ang moral na obligasyon ng ὀφείλουσιν bilang “dapat,” at ang pandagdag na diwa ng καί bilang “ding.” Ang “mga asawang lalaki” at “kani-kanilang asawa” ay wasto sa kontekstong pangmag-asawa. Napapanatili rin ang paghahambing sa sariling katawan at ang konklusyong ang umiibig sa asawa ay umiibig sa sarili.
  naturalness: Likas at malinaw ang modernong Filipino. Ang “sarili nilang katawan” ay isang katanggap-tanggap na distributibong gamit ng pang-isahang “katawan” pagkatapos ng plural na “sarili nilang”; hindi nito binabago ang kahulugan ng plural na σώματα. Ang “ibigin/umiibig” ay bahagyang mas marangal kaysa kolokyal ngunit angkop sa rehistro ng sulat at nakapagpapanatili ng pag-uulit ng pandiwa.
  terminology: Wastong ginagamit ang “asawang lalaki” para sa οἱ ἄνδρες sa kontekstong ito. Ang “asawa” sa kasunod ay malinaw na tumutukoy sa asawa ng lalaki dahil sa agarang konteksto. Ang reflexive na diin ng ἑαυτῶν at ἑαυτοῦ ay sapat na naipapakita ng “kani-kanilang,” “sarili nilang,” at “sarili niyang.”
