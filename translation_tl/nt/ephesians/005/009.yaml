id: EPH.5.9
reference: Ephesians 5:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ γὰρ καρπὸς τοῦ ⸀φωτὸς ἐν πάσῃ ἀγαθωσύνῃ καὶ δικαιοσύνῃ καὶ ἀληθείᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/009.yaml
  text: for the fruit of the light is in all goodness and righteousness and truth[c][b][a],
translation:
  language: tl
  text: Sapagkat ang bunga ng liwanag[b] ay nahahayag[c] sa lahat ng kabutihan, katuwiran[a], at katotohanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “katarungan.” Maaaring taglayin ng salitang Griyego ang dalawang diwa sa mga sulat ni Pablo.
    reason: lexical_alternative
  - marker: b
    text: Sa ilang manuskrito, “bunga ng Espiritu” sa halip na “bunga ng liwanag.”
    reason: textual_variant
  - marker: c
    text: Sa mas pormal na salin, “ay nasa.”
    reason: previous_rendering
lexical_decisions:
- source_word: γὰρ
  choice: Sapagkat
  rationale: Nagbibigay ito ng paliwanag o batayan para sa naunang panawagan sa talata 8.
- source_word: καρπὸς
  choice: bunga
  rationale: Pinananatili nito ang talinghaga ni Pablo tungkol sa mga katangiang ibinubunga sa pamumuhay.
- source_word: τοῦ φωτός
  choice: ng liwanag
  rationale: Tuwirang isinasalin ang genitive at iniuugnay ang parirala sa pagtukoy sa mga mananampalataya bilang liwanag sa naunang talata.
- source_word: ἐν
  choice: ay nahahayag sa
  rationale: Likas sa makabagong Tagalog at ipinapahayag ang saklaw o paraan kung saan nakikita ang bunga, habang inilalagay sa talababa ang mas pormal na anyo.
- source_word: πάσῃ
  choice: lahat ng
  rationale: Ipinahahayag ang komprehensibong diwa ng πᾶς na kasama ng pangngalang abstrakto.
- source_word: ἀγαθωσύνῃ
  choice: kabutihan
  rationale: Malawak at tuwirang katumbas para sa moral na kabutihan at paggawa ng mabuti.
- source_word: δικαιοσύνῃ
  choice: katuwiran
  rationale: Pinananatili ang karaniwang teolohikal at moral na saklaw ng salita; ang posibleng diwang 'katarungan' ay nasa talababa.
- source_word: ἀληθείᾳ
  choice: katotohanan
  rationale: Pinananatili ang malawak na diwa ng pagiging ayon sa totoo at ng katapatan.
theological_decisions:
- issue: Tekstuwal na variant sa pariralang genitive
  choice: bunga ng liwanag
  alternative: bunga ng Espiritu
  rationale: Ang SBLGNT ay may φωτός ('liwanag'), na angkop sa agarang konteksto ng Efeso 5:8–9. Iniingatan sa talababa ang kilalang variant na 'Espiritu'.
- issue: Saklaw ng δικαιοσύνη
  choice: katuwiran
  alternative: katarungan
  rationale: Maaaring tumukoy ang salita sa matuwid na kalagayan o asal at sa katarungan. Hindi nililimitahan ng pangunahing salin ang salita sa panlipunang katarungan lamang, ngunit pinananatili ang alternatibo sa talababa.
- issue: Diwa ng ἐν sa talaan ng mga katangian
  choice: ay nahahayag sa
  alternative: ay nasa
  rationale: Maaaring ipahiwatig ng ἐν ang larangan o pagpapakita ng bunga. Pinili ang natural na Tagalog nang hindi ipinapalagay na pisikal na lokasyon, at ibinigay ang mas pormal na anyo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang talinghagang “bunga ng liwanag,” habang ginawang natural ang gamit ng ἐν sa pamamagitan ng “nahahayag sa.”
