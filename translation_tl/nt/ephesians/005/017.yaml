base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/017.yaml
  text: For this reason[a], do not become foolish, but understand what the will of the Lord is.
translation:
  language: tl
  text: Dahil dito[a], huwag kayong maging hangal, kundi unawain ninyo kung ano ang kalooban ng Panginoon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Kaya huwag kayong maging hangal.”
    reason: Ipinapakita ang natural na alternatibong paghinuha para sa διὰ τοῦτο habang pinananatili sa pangunahing teksto ang mas tahasang ugnayang “Dahil dito.”
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Dahil dito
  rationale: Malinaw na tumutukoy ito sa naunang pangaral at likas na nagpapahayag sa modernong Tagalog ng ugnayang sanhi at paghinuha.
- source_word: μὴ γίνεσθε
  choice: huwag kayong maging
  rationale: Pinananatili ng “maging” ang diwa ng γίνομαι na pagpasok o pagdating sa isang kalagayan, sa halip na payak na pagiging gayon.
- source_word: ἄφρονες
  choice: mga hangal
  rationale: Ipinahihiwatig ng ἄφρονες ang kawalan ng wastong pag-unawa o praktikal na pagpapasya; natural ang “mga hangal” at malinaw ang pagsalungat nito sa utos na umunawa.
- source_word: ἀλλὰ
  choice: kundi
  rationale: Ang “kundi” ay natural na panalungat matapos ang negatibong utos at mariing inihaharap ang positibong kahalili.
- source_word: συνίετε
  choice: unawain ninyo
  rationale: Tuwirang ipinapahayag nito ang pag-intindi o pagtarok na hinihingi ng συνίημι, habang nananatiling malinaw sa karaniwang mambabasa.
- source_word: τί
  choice: kung ano
  rationale: Likas sa Tagalog ang “kung ano” bilang panimula sa nilalaman ng dapat unawain.
- source_word: τὸ θέλημα
  choice: ang kalooban
  rationale: Ang “kalooban” ang karaniwan at angkop na salin para sa θέλημα bilang nais, layunin, o ipinagagawa.
- source_word: τοῦ κυρίου
  choice: ng Panginoon
  rationale: Pinananatili nito ang mismong antas ng pagtukoy sa Griyego nang hindi idinaragdag sa teksto kung ang tinutukoy ay si Jesus o ang Diyos.
theological_decisions:
- issue: Tinutukoy ng τοῦ κυρίου
  choice: ng Panginoon
  alternative: ng Panginoong Jesus; ng Diyos
  rationale: Bagaman madalas tumukoy kay Jesus ang “Panginoon” sa Efeso, κύριος lamang ang nasa talata. Hindi tinutukoy nang higit sa Griyego ang salin upang mapanatili ang tunay na saklaw ng pahayag.
- issue: Lakas ng pagbabawal na μὴ γίνεσθε
  choice: huwag kayong maging
  alternative: huwag kayong maging hangal sa asal; tigilan ninyong maging mga hangal
  rationale: Pinananatili ng salin ang diwa ng pagdating sa isang kalagayan at hindi ipinapalagay na hayagang sinasabing lubos nang nasa gayong kalagayan ang mga kausap.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pangmaramihang “kayo/ninyo” upang ihayag ang bilang ng mga pandiwang Griyego. Ang “mga hangal” ay tuwiran ngunit hindi kolokyal, at pinananatili ang matinding pagsalungat sa “unawain ninyo.”
