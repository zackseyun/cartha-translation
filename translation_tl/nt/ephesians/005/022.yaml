  text: Mga asawang babae[a], sa kani-kaniyang mga asawang lalaki, gaya ng sa Panginoon,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maraming salin sa Ingles ang nagdaragdag ng “magpasakop kayo” mula sa talata 21: “Mga asawang babae, magpasakop kayo sa kani-kaniyang mga asawang lalaki, gaya ng sa Panginoon.” Walang pandiwang tahasang nakasaad sa mismong Griyego ng talata 22; nakadepende ang diwa nito sa naunang sugnay.'
