lexical_decisions:
- source_word: Αἱ γυναῖκες
  choice: Mga asawang babae
  rationale: Sa konteksto ng mga tagubilin sa sambahayan at sa kaugnayan sa ἰδίοις ἀνδράσιν, tumutukoy ito sa mga babae bilang mga asawa, hindi sa kababaihan sa pangkalahatan.
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: sa sarili ninyong mga asawa
  rationale: Ang ἀνήρ ay nangangahulugang “asawang lalaki” dito, at pinananatili ng “sarili ninyong” ang ἰδίοις at ang tiyak na ugnayang mag-asawa. Sa modernong Tagalog, sapat na ang “mga asawa” sa direktang pagtukoy ng mga asawang babae sa kani-kanilang asawa.
- source_word: ὡς
  choice: gaya ng sa
  rationale: Pinananatili nito ang payak na paghahambing nang hindi nililinaw nang higit sa sinasabi ng Griyego ang eksaktong saklaw nito.
- source_word: τῷ κυρίῳ
  choice: sa Panginoon
  rationale: Sa kontekstong Paulino, ang κύριος ay tumutukoy sa Panginoong Jesus; likas at marangal sa Tagalog ang “Panginoon.”
- source_word: implicit verb from context
  choice: hindi tahasang idinagdag sa pangunahing teksto
  rationale: Walang nakasulat na pandiwa sa Griyego ng talatang ito; nakasalalay ang diwa nito sa ὑποτασσόμενοι ng talata 21. Pinananatili ng salin ang elipsis at ipinaliliwanag ito sa talababa.
theological_decisions:
- issue: Kung idaragdag sa pangunahing teksto ang “pasakop kayo” kahit wala itong tahasang katumbas sa Griyego ng talata 22
  choice: Panatilihin ang elipsis at ilagay sa talababa ang pandiwang nauunawaan mula sa talata 21.
  alternative: “Mga asawang babae, magpasakop kayo sa sarili ninyong mga asawa gaya ng sa Panginoon.”
  rationale: Malinaw na nakukuha sa naunang sugnay ang diwa ng pagpapasakop, ngunit ang tahasang pagdaragdag nito rito ay maaaring magkubli sa sintaktikong pag-asa ng talata 22 sa talata 21. Pinananatili nito ang tunay na anyo at tensiyon ng pinagmulan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Sadyang pinanatili ang putol o eliptikong pagkakabuo ng Griyego, kaya may kuwit sa dulo upang ipakitang nagpapatuloy ang pangungusap at umaasa ito sa naunang talata.
