  text: But all things[a], when exposed by the light, are made visible,
translation:
  language: tl
  text: Ngunit ang lahat ng bagay, kapag inilalantad ng liwanag, ay nagiging hayag,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “Ngunit ang lahat ng inilalantad ng liwanag ay nagiging hayag.” Maaaring unawain sa magkalapit na paraan ang participle at pandiwa sa Griyego: maaaring idiin ang paglalantad o ang bunga nitong pagiging hayag.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ... πάντα
  choice: ang lahat ng bagay
  rationale: Malawak at sumasaklaw ang artikulong may pangmaramihang anyong neuter; pinananatili ng “ang lahat ng bagay” ang saklaw nito.
- source_word: δὲ
  choice: Ngunit
  rationale: Nagpapahiwatig ang δέ ng banayad na pagsalungat o pag-usad mula sa naunang pahayag; natural itong ipinahahayag ng “Ngunit” sa konteksto.
- source_word: ἐλεγχόμενα
  choice: kapag inilalantad
  rationale: Maaaring mangahulugan ang ἐλέγχω ng pagsaway, paghatol, o paglalantad. Dahil liwanag ang gumaganap at kasunod ang φανεροῦται, nangingibabaw rito ang diwa ng paglalantad. Pinananatili ng “inilalantad” ang tinig na balintiyak at ng “kapag” ang pangyayari o lohikal na kaugnayan nito sa pangunahing pandiwa.
- source_word: ὑπὸ τοῦ φωτὸς
  choice: ng liwanag
  rationale: Ang ὑπό na may genitive ay tumutukoy sa gumaganap. Sa balintiyak na pangungusap sa Filipino, likas na ipinahahayag ito ng “ng liwanag,” at pinananatili ang tiyak na liwanag na nabanggit sa konteksto.
- source_word: φανεροῦται
  choice: ay nagiging hayag
  rationale: Ang balintiyak na φανερόω ay tumutukoy sa pagiging nakikita o hayag. Malinaw at natural sa modernong Filipino ang “nagiging hayag” at angkop ito sa larawan ng liwanag.
theological_decisions:
- issue: Ang tinutukoy ng “liwanag” sa konteksto
  choice: Isinalin lamang bilang “liwanag” nang hindi tinutukoy nang mas makitid ang kahulugan nito sa mismong talata.
  alternative: Cristo; ang ebanghelyo; katotohanang moral; o patotoo ng komunidad ng mga mananampalataya
  rationale: Tinatawag sa malapit na konteksto ang mga mananampalataya na liwanag sa Panginoon (5:8), at binabanggit ang paglalantad sa mga gawa ng kadiliman (5:11). Hindi tahasang nililinaw ng talatang ito ang iisang tinutukoy, kaya pinananatili ang lawak at tensiyong teolohikal ng talinghaga.
- issue: Ugnayan ng participle ἐλεγχόμενα at pandiwang φανεροῦται
  choice: “ang lahat ng bagay, kapag inilalantad ng liwanag, ay nagiging hayag”
  alternative: “ang lahat ng inilalantad ng liwanag ay nagiging hayag”
  rationale: 'Magkalapit ang dalawang posibleng pagbasa sa Griyego: maaaring idiin ang kalagayan ng lahat ng bagay kapag nalalantad, o tukuyin ang lahat ng bagay na inilalantad. Pinili sa teksto ang unang pagbasa ngunit inilagay sa talababa ang ikalawa upang hindi ikubli ang tunay na kalabuan.'
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “nagiging hayag” sa halip na mas teknikal o makalumang “nahahayag,” at iniwasang tukuyin kung sino o ano lamang ang “liwanag.”
