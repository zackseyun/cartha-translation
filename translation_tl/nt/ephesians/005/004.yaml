base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/004.yaml
  text: And obscenity and foolish talk or crude joking[a], which are not fitting[b], but rather thanksgiving.
translation:
  language: tl
  text: At huwag magkaroon sa inyo ng mahalay na pananalita, hangal na usapan, o bastos na pagbibiro[a]—mga bagay na hindi nararapat[b]—kundi sa halip ay pagpapasalamat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magaspang na pagbibiro.” Ang salitang Griyego ay maaari ring tumukoy sa pagpapatawa o palabirong pananalita, ngunit negatibo ang gamit nito rito dahil kabilang ito sa mga pananalitang hindi nararapat.
    reason: lexical_alternative
  - marker: b
    text: O “hindi angkop” o “hindi marapat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰσχρότης
  choice: mahalay na pananalita
  rationale: Maaaring tumukoy ang salita sa anumang kahiya-hiya o mahalay, ngunit dahil kasama ito ng mga kasalanang malinaw na may kinalaman sa pagsasalita at ipinantapat sa pagpapasalamat, likas sa Tagalog na tukuyin dito ang mahalay na pananalita.
- source_word: μωρολογία
  choice: hangal na usapan
  rationale: Tuwirang ipinahahayag nito ang diwa ng walang-isip o hangal na pagsasalita sa malinaw at kasalukuyang Tagalog.
- source_word: ἢ
  choice: o
  rationale: Pinananatili nito ang payak na ugnayan ng huling bagay sa talaan, habang malinaw pa rin sa kabuuang pangungusap na lahat ng nabanggit ay tinatanggihan.
- source_word: εὐτραπελία
  choice: malaswang pagbibiro
  rationale: Bagaman maaari itong tumukoy sa pagiging palabiro o matalas ang isip sa ibang konteksto, negatibo ang gamit dito dahil isinama ito sa mga bagay na hindi nararapat.
- source_word: ἃ οὐκ ἀνῆκεν
  choice: mga bagay na hindi nararapat
  rationale: Iniuugnay ng parirala ang hatol sa lahat ng naunang gawain at pinananatili ang diwa ng hindi angkop o hindi marapat.
- source_word: ἀλλὰ μᾶλλον
  choice: kundi sa halip
  rationale: Malinaw nitong ipinapakita ang mariing paghahambing at ang positibong kapalit sa naunang uri ng pananalita.
- source_word: εὐχαριστία
  choice: pagpapasalamat
  rationale: Pinananatili nito ang anyong pangngalan at ang diwa ng pasalitang pagpapahayag ng pasasalamat.
theological_decisions:
- issue: Saklaw ng αἰσχρότης bilang asal o pananalita
  choice: Isinalin bilang “mahalay na pananalita” ayon sa agarang konteksto ng mga kasalanan sa pagsasalita.
  alternative: “kahalayan” o “kahiya-hiyang asal,” na maaaring tumukoy nang mas malawak sa paggawi
  rationale: Ang μωρολογία at εὐτραπελία ay kapwa tumutukoy sa pagsasalita, at ang εὐχαριστία ay pasalitang positibong kapalit. Gayunman, ipinapaliwanag ng tala na mas malawak ang maaaring saklaw ng salitang Griyego.
- issue: Moral na saysay ng εὐτραπελία
  choice: Isinalin nang negatibo bilang “malaswang pagbibiro.”
  alternative: “pagiging palabiro” o “matalas na pagpapatawa” sa neutral o positibong diwa
  rationale: Bagaman may neutral o positibong gamit ang salita sa ibang panitikang Griyego, ang pagkakahanay nito rito sa mga hindi nararapat ay nangangailangan ng negatibong diwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Idinagdag ang “huwag magkaroon sa inyo” upang maging buo at natural ang ipinahihiwatig na pagbabawal mula sa naunang konteksto, yamang ang talatang Griyego ay isang ellipsis na binubuo ng magkakahanay na pangngalan. Ginamit ang mga gitling upang malinaw na iugnay ang “mga bagay na hindi nararapat” sa buong talaan.
