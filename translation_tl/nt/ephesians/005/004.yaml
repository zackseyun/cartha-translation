  naturalness: Natural at malinaw ang pangungusap sa makabagong Filipino. Ang “mga bagay na hindi nararapat” ay maayos na tumutukoy sa buong talaan. Ang “bastos na pagbibiro” ay mas karaniwang kolokasyon at hindi nagpapahiwatig nang di-kailangang ang biro ay laging seksuwal.
  terminology: Ang “mahalay na pananalita,” “hangal na usapan,” at “pagpapasalamat” ay angkop sa kontekstong nakatuon sa pananalita. Inayos ang terminong para sa εὐτραπελία at ang paliwanag sa talababa upang hindi maipakahulugang “matalas ang isip,” na hindi ang tuwirang leksikal na alternatibo rito.
