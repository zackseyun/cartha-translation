  text: καὶ μὴ συγκοινωνεῖτε τοῖς ἔργοις τοῖς ἀκάρποις τοῦ σκότους, μᾶλλον δὲ καὶ ἐλέγχετε,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/011.yaml
  text: And do not participate in the unfruitful works of darkness[a], but instead even expose them[b],
translation:
  language: tl
  text: At huwag kayong makibahagi sa mga gawang walang bunga ng kadiliman[a]; sa halip, ilantad pa nga ninyo ang mga iyon[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “makisangkot” o “makisama sa.”
    reason: lexical_alternative
  - marker: b
    text: O “sawayin” o “pagsabihan.” Maaaring kabilang sa salitang Griyego ang berbal na pagtutuwid, ngunit sa kontekstong ito ay taglay rin nito ang diwa ng pagdadala sa liwanag ng gayong mga gawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: συγκοινωνεῖτε
  choice: makibahagi
  rationale: Likas at malinaw na Filipino ito para sa aktibong pakikibahagi o pakikisangkot kasama ng iba, nang hindi nililimitahan ang diwa sa pormal na pakikipagsamahan.
- source_word: ἔργοις
  choice: mga gawa
  rationale: Pinananatili nito ang karaniwang bokabularyong moral ni Pablo at tuwirang tumutukoy sa mga kilos o gawain.
- source_word: ἀκάρποις
  choice: walang bunga
  rationale: Pinananatili nito ang metaporang agrikultural at ang kaugnayan sa bunga ng liwanag sa naunang talata.
- source_word: σκότους
  choice: ng kadiliman
  rationale: Tuwirang inililipat ang genitibo at pinananatili ang moral at metaporikal na puwersa ng kadiliman nang hindi ipinapakahulugang mga gawa lamang na lihim na ginawa.
- source_word: μᾶλλον δὲ καὶ
  choice: sa halip, ... pa nga
  rationale: 'Ipinahahayag nito kapwa ang matinding pagsalungat at ang dagdag na utos: hindi lamang umiwas sa pakikibahagi kundi kumilos laban sa mga gawa.'
- source_word: ἐλέγχετε
  choice: ilantad
  rationale: Ang konteksto ng liwanag at kadiliman, lalo na sa talata 13, ay sumusuporta sa diwang paglalantad o paghahayag, habang nananatili ang implikasyon ng pagsaway at moral na pagtuligsa.
theological_decisions:
- issue: Diwa ng ἐλέγχετε kaugnay ng masasamang gawa
  choice: ilantad ... ang mga iyon
  alternative: sawayin o pagsabihan ang mga gumagawa nito
  rationale: Ang tuwirang layon sa Griyego ay maaaring tumukoy sa mga gawang nabanggit, at itinatampok ng konteksto ang pagdadala ng mga iyon sa liwanag. Hindi nito itinatanggi na maaaring kasama ang berbal na pagsaway, kaya inilalagay ang alternatibo sa talababa.
- issue: Puwersa ng paghahambing sa dalawang utos
  choice: huwag ... makibahagi; sa halip, ilantad pa nga
  alternative: huwag makibahagi kundi sawayin
  rationale: Pinananatili ang pag-igting sa pagitan ng hindi pakikisangkot at ng aktibong pagharap sa kasamaan, nang hindi nagtatakda ng paraang hindi tahasang sinabi ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “makibahagi” at “ilantad” bilang natural na mga pandiwa; pinanatili ang mga larawang “walang bunga” at “kadiliman” dahil mahalaga ang mga ito sa daloy ng Ephesians 5.
