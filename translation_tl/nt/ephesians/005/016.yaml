translation:
  language: tl
  text: gamitin nang lubos ang pagkakataon[a], sapagkat masama ang mga araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “tinutubos ang panahon”; maaari ring mangahulugan ang Griyegong parirala na “binibili nang lubos ang pagkakataon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαγοραζόμενοι
  choice: sinasamantala nang lubos
  rationale: Ang pandiwari ay literal na may larawan ng pagbili o pagtubos, ngunit sa kontekstong ito ay tumutukoy sa lubos na paggamit sa pagkakataon. Natural ito sa makabagong Filipino at hindi nagpapahiwatig ng pagliligtas mula sa kasalanan.
- source_word: τὸν καιρόν
  choice: ang bawat pagkakataon
  rationale: Ang καιρός ay karaniwang tumutukoy sa angkop o napapanahong pagkakataon, hindi lamang sa oras bilang abstraktong konsepto. Idinagdag ang “bawat” bilang likas na Filipino na paglalahad ng ganitong idyoma, habang pinananatili sa talababa ang mas literal na “panahon.”
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw na ipinakikilala nito ang dahilan ng naunang tagubilin; ang “sapagkat” ay marangal at madaling maunawaan.
- source_word: αἱ ἡμέραι
  choice: ang mga araw
  rationale: Tuwirang pinananatili ang pangmaramihang larawan ng Griyego nang hindi ito pinalalawak bilang “kasalukuyang panahon” o “kapanahunan.”
- source_word: πονηραί
  choice: masama
  rationale: Pinananatili nito ang moral na bigat ng salita at iniiwasang pahinain ito bilang “mahirap” o “magulo” lamang.
theological_decisions:
- issue: Maaaring maunawaan ang ἐξαγοραζόμενοι bilang teknikal na pananalita tungkol sa pagtubos o kaligtasan
  choice: Praktikal na tagubilin na lubos na gamitin ang mga pagkakataon
  alternative: tinutubos ang panahon
  rationale: Sa kontekstong ito ng pamumuhay nang may karunungan, ang pandiwa ay idiomatikong tumutukoy sa masinop at ganap na paggamit ng pagkakataon. Hindi ginagawang tahasang doktrina ng pagtubos ang parirala, ngunit pinananatili sa talababa ang literal na larawan at tunay na alternatibo.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ang “sinasamantala” ay ginagamit sa positibong diwa ng lubos na paggamit sa pagkakataon, at nilinaw ng “nang lubos” ang intensiyon. Nakakabit ang talata sa naunang pangungusap, kaya nagsisimula ito sa pandiwaring parirala at maliit na titik.
