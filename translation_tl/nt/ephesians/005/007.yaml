  text: μὴ οὖν γίνεσθε συμμέτοχοι αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/007.yaml
  text: Therefore[a], do not become partners with them.
translation:
  language: tl
  text: Kaya huwag kayong maging kabahagi nila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “makibahagi sa kanila.” Sa konteksto, maaaring tumukoy ito sa pakikibahagi sa kanilang makasalanang pamumuhay o sa kahihinatnan nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: huwag
  rationale: Karaniwang pananggi sa pautos sa Tagalog; malinaw nitong ipinahahayag ang pagbabawal.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinakikita ang kongklusyon mula sa naunang babala sa talata 3–6 sa natural at makabagong Tagalog.
- source_word: γίνεσθε
  choice: maging
  rationale: Pinananatili ang diwa ng pagpasok o pagkakaroon ng isang kalagayan, hindi lamang ang pananatili rito.
- source_word: συμμέτοχοι
  choice: kabahagi
  rationale: Likas at marangal na salitang Tagalog para sa taong nakikibahagi sa isang bagay kasama ng iba; hindi nito labis na tinutukoy kung asal o kahihinatnan ang pinagsasaluhan.
- source_word: αὐτῶν
  choice: nila
  rationale: Tuwirang pinananatili ang pagtukoy ng Griyego sa mga taong binanggit sa naunang konteksto, sa halip na palitan ito ng tahasang 'kanilang mga gawa.'
theological_decisions:
- issue: Saklaw ng pakikibahaging ipinahihiwatig ng συμμέτοχοι αὐτῶν
  choice: Pangkalahatang pagbabawal na maging kabahagi ng mga taong tinutukoy, habang hindi tahasang nililimitahan ang pakikibahagi sa kanilang mga gawa o sa kahihinatnan ng mga iyon.
  alternative: Huwag kayong makibahagi sa kanilang mga gawa.
  rationale: Mga tao ang tahasang tinutukoy ng αὐτῶν ('nila'), samantalang ipinahihiwatig ng konteksto ang kanilang makasalanang asal at maaaring kahihinatnan. Pinananatili ng salin ang tunay na lawak ng pahayag.
translation_notes:
  register: Makabagong Filipino Tagalog na maikli, natural, at marangal. Ginamit ang “kabahagi” upang mapanatili ang lawak ng Griyegong termino nang hindi nagdaragdag ng bagay na hindi tahasang binanggit.
