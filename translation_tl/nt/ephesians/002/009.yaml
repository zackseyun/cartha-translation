translation:
  language: tl
  text: hindi mula sa mga gawa[a], upang walang sinumang magyabang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “buhat sa mga gawa.” Ipinahihiwatig ng parirala ang pinagmulan; nauunawaan naman ito ng ilan na may diwang “sa pamamagitan ng mga gawa,” ngunit mas literal ang “mula sa mga gawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἐξ
  choice: hindi mula sa
  rationale: Pinananatili nito ang karaniwang diwa ng ἐξ bilang pinagmulan, habang natural na nasasaklaw ng οὐκ ang buong pariralang pang-ukol.
- source_word: ἔργων
  choice: mga gawa
  rationale: Tuwirang katumbas ito ng malawak na salitang ἔργων at hindi nagdaragdag ng paliwanag gaya ng “mga gawa ng kautusan,” “mabubuting gawa,” o “pagsisikap ng tao.”
- source_word: ἵνα μή τις
  choice: upang walang sinuman
  rationale: Malinaw at likas na ipinapahayag nito sa modernong Tagalog ang negatibong layunin ng sugnay.
- source_word: καυχήσηται
  choice: makapagmalaki
  rationale: Naipahahayag ng anyong “makapag-” ang posibilidad sa sugnay na pinangungunahan ng ἵνα, at pinananatili ng “magmalaki” ang matinding diwa ng pagyayabang sa halip na pahinain ito bilang simpleng pagmamalaki sa sarili.
theological_decisions:
- issue: Saklaw ng “mga gawa” sa pahayag ni Pablo
  choice: Panatilihin ang malawak na pariralang “mga gawa.”
  alternative: “mga gawa ng kautusan,” “mabubuting gawa,” o “pagsisikap ng tao”
  rationale: ἔργων lamang ang nasa tekstong Griyego. Ang pagpili ng mas makitid o mas malawak na paliwanag ay magpapasya sa isang usaping interpretatibo na hindi tahasang nilulutas ng talata.
- issue: Ugnayan ng ἐξ sa “mga gawa”
  choice: “mula sa mga gawa” bilang pahayag ng pinagmulan
  alternative: “sa pamamagitan ng mga gawa”
  rationale: Karaniwang nagpapahiwatig ang ἐξ ng pinagmulan. Posible ang instrumental na pagkaunawa sa konteksto, kaya hindi ito dapat itanggi, ngunit mas malapit sa mismong anyong Griyego ang “mula sa.”
translation_notes:
  register: Modernong Filipino Tagalog na maikli, dignified, at madaling maunawaan. Ginamit ang “walang sinuman” bilang inklusibo at likas na katumbas ng μή τις. Ang “upang” ay bahagyang pormal ngunit karaniwan sa saling pampanitikan at malinaw na naghuhudyat ng layunin.
