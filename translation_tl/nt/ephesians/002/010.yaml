revisions:
- from: Sapagkat tayo ay kanyang gawa, nilikha kay Mesiyas Jesus upang gumawa ng mabubuting gawa na inihanda na ng Diyos noong una pa, upang mamuhay tayo sa paggawa ng mga iyon.[a]
  to: Sapagkat tayo ay gawa ng Diyos, na nilikha sa pakikipag-isa kay Mesiyas Jesus para sa mabubuting gawa, na inihanda na ng Diyos noon pa man upang mamuhay tayo ayon sa mga iyon.[a]
  rationale: Inayos ang pang-ukol sa pariralang ἐν Χριστῷ Ἰησοῦ upang malinaw na maipahayag ang pakikipag-isa kay Mesiyas Jesus at maiwasan ang maling pagbasa na si Jesus ang tagalikha. Inayos din ang huling parirala upang mapanatili ang malawak na metapora ng pamumuhay na nasa περιπατήσωμεν. Walang idinagdag na pagpapasyang doktrinal hinggil sa ugnayan ng paghahanda ng Diyos at pagkilos ng tao.
