id: EPH.2.10
reference: Ephesians 2:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: αὐτοῦ γάρ ἐσμεν ποίημα, κτισθέντες ἐν Χριστῷ Ἰησοῦ ἐπὶ ἔργοις ἀγαθοῖς οἷς προητοίμασεν ὁ θεὸς ἵνα ἐν αὐτοῖς περιπατήσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/010.yaml
  text: For we are his workmanship[a], created in Messiah Jesus for good works[b], which God prepared beforehand so that we might walk in them.
translation:
  language: tl
  text: Sapagkat tayo ay gawa ng Diyos, na nilikha sa pakikipag-isa kay Mesiyas Jesus para sa mabubuting gawa, na inihanda na ng Diyos noon pa man upang mamuhay tayo ayon sa mga iyon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na, “upang lumakad tayo sa mga iyon.” Ang “lumakad” ay larawan ng paraan ng pamumuhay o asal ng isang tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποίημα
  choice: kanyang gawa
  rationale: Ipinahahayag na tayo ang ginawa ng Diyos. Likas ito sa modernong Tagalog at hindi nagpapahiwatig ng mekanikal na proseso.
- source_word: κτισθέντες
  choice: nilikha
  rationale: Tuwirang tinutumbasan ang aorist passive participle at inuugnay sa pagkakalikha ng mga mananampalataya kay Mesiyas Jesus.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: kay Mesiyas Jesus
  rationale: Ang “kay” ang likas na Tagalog para sa pakikiugnay sa isang persona, at pinananatili ng “Mesiyas” ang kahulugan ng Χριστός bilang titulo.
- source_word: ἐπὶ ἔργοις ἀγαθοῖς
  choice: upang gumawa ng mabubuting gawa
  rationale: Malinaw na ipinahahayag ang layunin ng pagkakalikha. Isinasama ang pandiwang “gumawa” upang maging natural sa Tagalog nang hindi nagdaragdag ng ibang teolohikal na diwa.
- source_word: προητοίμασεν
  choice: inihanda na ... noong una pa
  rationale: 'Pinananatili ang temporal na diwa ng προ-: nauna nang inihanda ng Diyos ang mabubuting gawa.'
- source_word: ἵνα
  choice: upang
  rationale: Likas at malinaw na panandang Tagalog para sa layunin.
- source_word: ἐν αὐτοῖς περιπατήσωμεν
  choice: mamuhay tayo sa paggawa ng mga iyon
  rationale: Isinasalin ang metaporikal na περιπατέω ayon sa kahulugan nitong pamumuhay o asal, habang ang “mga iyon” ay malinaw na tumutukoy sa mabubuting gawa.
- source_word: γάρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na kaugnayan ng talata sa naunang pahayag.
- source_word: αὐτοῦ
  choice: kanyang
  rationale: Likas na panghalip na paari sa Tagalog at tumutukoy sa Diyos.
theological_decisions:
- issue: Pagsasalin sa Χριστός bilang titulo o anyong parang pangalan
  choice: Mesiyas Jesus
  alternative: Cristo Jesus
  rationale: Pinananatili ng “Mesiyas” ang kahulugan ng Χριστός bilang ang Pinahiran, sa halip na basta transliterahin ang titulo.
- issue: Ugnayan ng naunang paghahanda ng Diyos at pamumuhay ng tao
  choice: inihanda na ng Diyos noong una pa, upang mamuhay tayo sa paggawa ng mga iyon
  alternative: inihanda na ng Diyos para gawin natin
  rationale: Pinananatili ang pagkukusa ng Diyos at ang layuning mamuhay ang mga mananampalataya sa mabubuting gawa, nang hindi nilulutas ang mas malawak na pagtatalo tungkol sa predestinasyon o kalayaan ng tao.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “kanyang gawa” sa halip na mas teknikal na “obra,” at ipinaliwanag sa talababa ang metapora ng paglakad.
