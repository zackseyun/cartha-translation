base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/017.yaml
  text: And he came and proclaimed peace to you who were far away[b][a], and peace to those who were near.
translation:
  language: tl
  text: At dumating siya at ipinahayag[b] ang kapayapaan sa inyo na malayo[a], at ang kapayapaan sa mga malapit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibig sabihin, ipinahayag ang kapayapaan sa mga dating malayo at sa mga malapit—sa konteksto, sa mga Hentil at mga Judio ayon sa pagkakasunod (tingnan ang Efeso 2:11–13).
    reason: cross_reference
  - marker: b
    text: O “ipinangaral ang mabuting balita ng kapayapaan.” Ang pandiwang Griyego ay madalas mangahulugang “maghayag ng mabuting balita,” ngunit dito ang tahasang layon nito ay “kapayapaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: dumating siya
  rationale: Likas na Filipino para sa aorist participle na naghahanda sa pangunahing kilos; pinananatili ang larawan ng pagdating.
- source_word: εὐηγγελίσατο
  choice: ipinahayag
  rationale: Ang pandiwa ay tumutukoy sa paghahayag ng mabuting balita. Dahil εἰρήνην, ‘kapayapaan,’ ang tahasang layon, hindi idinaragdag sa pangunahing teksto ang salitang ‘mabuting balita.’
- source_word: εἰρήνην
  choice: kapayapaan
  rationale: Tuwirang katumbas na maaari ring magdala ng diwa ng pakikipagkasundo at ganap na kagalingan sa konteksto.
- source_word: ὑμῖν
  choice: sa inyo
  rationale: Natural na salin ng dative indirect object at pinananatili ang tuwirang pagtukoy sa mga mambabasa.
- source_word: τοῖς μακρὰν
  choice: na mga nasa malayo
  rationale: Pinananatili ang metaporang ‘malayo’ nang hindi tahasang ipinapasok sa teksto ang pagkakakilanlan ng pangkat.
- source_word: τοῖς ἐγγύς
  choice: mga nasa malapit
  rationale: Pinananatili ang kaagapay na pagsalungat ng ‘malayo’ at ‘malapit.’
- source_word: καὶ ... καὶ
  choice: at ... at
  rationale: Sinasalamin ang magkatugmang pag-uugnay ng dalawang pangkat na kapuwa pinahayagan ng kapayapaan.
theological_decisions:
- issue: Pagkakakilanlan ng mga ‘nasa malayo’ at mga ‘nasa malapit’
  choice: Panatilihin sa pangunahing teksto ang mga metaporang ‘malayo’ at ‘malapit.’
  alternative: Tukuyin sila bilang mga Hentil at mga Judio.
  rationale: Malinaw sa konteksto ng Efeso 2:11–13 na ang mga Hentil at mga Judio ang tinutukoy, ngunit hindi sila tahasang pinangalanan sa talatang ito. Pinananatili ng salin ang retorika at tunay na antas ng pagpapakahulugan ng Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘mga nasa malayo/malapit’ sa halip na mas matandang ‘mga malayo/malapit’ upang maging natural ngunit mapanatili ang metapora. Inilagay ang mga pananda ng talababa sa ayos [b][a] gaya ng kaugnay na bahaging sinusundan ng mga ito.
