  text: ἐποικοδομηθέντες ἐπὶ τῷ θεμελίῳ τῶν ἀποστόλων καὶ προφητῶν, ὄντος ἀκρογωνιαίου αὐτοῦ ⸂Χριστοῦ Ἰησοῦ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/020.yaml
  text: having been built on the foundation of the apostles and prophets[a], Messiah Jesus himself being the cornerstone[b],
translation:
  language: tl
  text: na itinayo sa pundasyon ng mga apostol at mga propeta[a], si Jesus na Mesiyas mismo ang batong panulok[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “pundasyon ng mga apostol at mga propeta” ay maaaring tumukoy sa pundasyong kaugnay ng kanilang patotoo, sa pundasyong inilatag nila, o sa pundasyong binubuo nila; hindi ito higit na nililinaw ng anyong Griego.
    reason: lexical_alternative
  - marker: b
    text: O “Kristo Jesus.” Ang titulong Griego na Χριστός ay isinaling “Mesiyas” rito upang mapanatili ang kahulugan nito.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐποικοδομηθέντες
  choice: na itinayo
  rationale: Pinananatili ang pasibong diwa ng aorist participle at ang kaugnayan nito sa naunang pangungusap; likas ito sa modernong Tagalog bilang paglalarawan sa mga mambabasa na isinama sa gusali ng Diyos.
- source_word: ἐπὶ τῷ θεμελίῳ
  choice: sa pundasyon
  rationale: Malinaw at likas na ipinahahayag ang larawang arkitektural ng pagtatayo sa isang pundasyon nang hindi nagdaragdag ng hindi kailangan.
- source_word: τῶν ἀποστόλων καὶ προφητῶν
  choice: ng mga apostol at mga propeta
  rationale: Pinananatili ang malawak na gamit ng Greek genitive at hindi ipinapalagay kung ang pundasyon ay sila mismo, ang kanilang patotoo, o ang inilatag nila.
- source_word: ὄντος
  choice: at … ang
  rationale: Isinasalin ang genitive absolute bilang likas na sugnay na panaguri sa Tagalog, nang hindi ito binibigyan ng diwang temporal na wala naman sa teksto.
- source_word: ἀκρογωνιαίου
  choice: batong-panulok
  rationale: Karaniwan at tiyak na katumbas sa Tagalog para sa cornerstone sa talinghaga ng isang gusali; hindi idinaragdag ang di-hayag na diin ng 'pangunahing.'
- source_word: αὐτοῦ
  choice: mismong
  rationale: 'Inililipat ang pagbibigay-diin ng panghalip sa natural na Tagalog: ang mismong Mesiyas Jesus.'
- source_word: Χριστοῦ Ἰησοῦ
  choice: Mesiyas Jesus
  rationale: Isinasalin ang Χριστός ayon sa kahulugan nitong titulo rito, habang itinatala sa talababa ang tradisyonal na anyong 'Kristo Jesus.'
theological_decisions:
- issue: Kahulugan ng “pundasyon ng mga apostol at mga propeta”
  choice: Pinanatili ang malawak na pariralang “pundasyon ng mga apostol at mga propeta.”
  alternative: “pundasyong inilatag ng mga apostol at mga propeta” o “pundasyong binubuo ng mga apostol at mga propeta”
  rationale: Hindi tinitiyak ng Greek genitive kung sila mismo ang pundasyon, kung ito ang kanilang patotoo, o kung sila ang naglatag nito. Hindi nilulutas ng salin ang sadyang hindi tiyak sa teksto.
- issue: Pagpapakahulugan sa Χριστός
  choice: Mesiyas Jesus
  alternative: Kristo Jesus
  rationale: Nananatiling malinaw ang gamit bilang titulo sa kontekstong ito, kaya isinasalin ang kahulugan sa halip na panatilihin lamang ang nakasanayang transliterasyon.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal ngunit madaling maunawaang himig. Ginamit ang pamilyar na mga terminong “pundasyon,” “apostol,” “propeta,” at “batong-panulok.” Ang simula ay nananatiling isang sugnay na umaasa sa naunang konteksto, gaya ng participial na anyo sa Griego.
