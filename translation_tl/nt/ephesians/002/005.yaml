  text: καὶ ὄντας ἡμᾶς νεκροὺς τοῖς παραπτώμασιν συνεζωοποίησεν τῷ Χριστῷ— χάριτί ἐστε σεσῳσμένοι—
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/005.yaml
  text: even when we were dead in our trespasses[a], he made us alive together with Messiah—by grace you have been saved—
translation:
  language: tl
  text: Kahit noong patay pa tayo sa mga paglabag natin, binuhay niya tayo kasama ng Mesiyas[a]—sa biyaya ay naligtas na kayo—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “Cristo.” Ang salitang Griyego na Χριστός ay isang titulo na nangangahulugang “Mesiyas” o “Pinahiran.”
    reason: Ipinapakita ang tradisyonal na salin habang pinananatili sa teksto ang kahulugan ng titulo.
lexical_decisions:
- source_word: ὄντας ἡμᾶς νεκρούς
  choice: noong patay pa tayo
  rationale: Likas sa modernong Tagalog ang pariralang ito at pinananatili ang temporal na diwa ng participle nang hindi itinatanggi ang posibleng bahagyang konsesibong diin.
- source_word: τοῖς παραπτώμασιν
  choice: sa mga pagsuway natin
  rationale: Pinananatili ng “sa” ang maluwag na ugnayan ng datibo—kalagayan o saklaw—sa halip na tahasang gawin itong sanhi. Ang “natin” ay malinaw mula sa unang panauhang maramihan at sa konteksto.
- source_word: συνεζωοποίησεν
  choice: binuhay niya tayong kasama
  rationale: Ipinapahayag ng “binuhay” ang pagbibigay-buhay, at ng “kasama” ang pinagsamang diwa ng tambalang pandiwa kaugnay ng sumusunod na τῷ Χριστῷ.
- source_word: τῷ Χριστῷ
  choice: ng Mesiyas
  rationale: Kasunod ito ng “kasama,” kaya likas ang pang-ukol na “ng.” Ang Χριστός ay pinanatili bilang titulong “Mesiyas,” hindi lamang bilang pangalang nakasanayan.
- source_word: χάριτί
  choice: sa biyaya
  rationale: Maikli at kinikilalang salin ito ng instrumental na datibo, at malinaw na ang biyaya ang batayan o paraan ng pagliligtas.
- source_word: ἐστε σεσῳσμένοι
  choice: ay naligtas na kayo
  rationale: Pinananatili ng “naligtas” ang pasibong diwa, samantalang ipinahihiwatig ng “na” ang kasalukuyang kalagayang bunga ng natapos na pagkilos.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστῷ
  choice: Mesiyas
  alternative: Cristo
  rationale: Aktibo pa rito ang diwa ng titulo ng ipinangakong pinahiran. Gayunman, ibinigay sa talababa ang tradisyonal na anyong “Cristo.”
- issue: Diwa ng χάριτί ἐστε σεσῳσμένοι
  choice: Pinanatili bilang biglang pagsingit sa pagitan ng mga gitling
  alternative: Isama nang tuluy-tuloy sa pangungusap
  rationale: Ang pagsingit ay mahalagang retorikal na diin sa biyaya at naghahanda sa mas malawak na paliwanag sa Efeso 2:8–9.
- issue: Ugnayan ng τοῖς παραπτώμασιν sa pagiging patay
  choice: sa mga pagsuway natin
  alternative: dahil sa mga pagsuway natin
  rationale: Hindi tahasang nilulutas ng salin kung ang datibo ay pangunahing tumutukoy sa saklaw o sanhi; mas malapit ang “sa” sa tunay na kaluwagan ng Griyego.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “patay pa tayo” at “binuhay niya tayo” para sa natural na daloy, habang pinanatili ang biglang pagsingit at bukas na gitling ng Griyegong pangungusap.
