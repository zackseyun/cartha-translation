  yaml_path: translation/nt/ephesians/002/007.yaml
  text: so that in the coming ages he might display the surpassing riches of his grace in kindness toward us in Messiah Jesus[a][b][c].
translation:
  language: tl
  text: upang sa darating na mga kapanahunan[a] ay maipakita niya ang di-mapapantayang[b] kayamanan ng kanyang biyaya sa kanyang kabutihang-loob sa atin sa Mesiyas na si Jesus.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “sa mga panahong darating.”'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “di-masukat na kayamanan.”'
    reason: lexical_alternative
  - marker: c
    text: 'Griyego: “kay Cristo Jesus”; isinalin dito ang Χριστός bilang titulong “Mesiyas.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: upang
  rationale: Likas na panandang Filipino para sa layunin o resultang nakaugnay sa naunang pahayag.
- source_word: ἐνδείξηται
  choice: maipakita niya
  rationale: Ipinahahayag ang hayagan at malinaw na pagpapamalas na nasa ἐνδείκνυμι, habang pinananatili ang subjunctive na nakasalalay sa ἵνα.
- source_word: ἐν τοῖς αἰῶσιν τοῖς ἐπερχομένοις
  choice: sa darating na mga kapanahunan
  rationale: Pinananatili ang maramihang αἰῶσιν at ang hinaharap na diwa ng ἐπερχομένοις sa natural na modernong Tagalog.
- source_word: τὸ ὑπερβάλλον πλοῦτος
  choice: ang di-mapapantayang kayamanan
  rationale: Ipinahahayag ang nangingibabaw o humihigit na katangian ng ὑπερβάλλον nang hindi ginagawang literal na materyal na yaman ang πλοῦτος.
- source_word: τῆς χάριτος αὐτοῦ
  choice: ng kanyang biyaya
  rationale: Ang “biyaya” ang malinaw at kinikilalang salin ng χάρις sa kontekstong ito at hindi ito nililimitahan sa karaniwang pabor lamang.
- source_word: ἐν χρηστότητι
  choice: sa pamamagitan ng kabutihang-loob niya
  rationale: Ang χρηστότης ay tumutukoy sa mabait at mapagbigay na pagkilos o disposisyon. Ang “sa pamamagitan ng” ay natural sa Filipino para sa paraang ipinakikita ang biyaya, bagaman maaari ring unawain ang ἐν bilang saklaw o kalagayan.
- source_word: ἐφ’ ἡμᾶς
  choice: sa atin
  rationale: Sa konteksto, ipinahahayag ang mabuting pagkilos na nakatuon sa atin; sapat at natural sa Filipino ang “sa atin.”
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: sa Mesiyas na si Jesus
  rationale: Isinalin ang Χριστός bilang titulong “Mesiyas,” hindi bilang apelyido, at pinanatili ang maikli ngunit malawak na ugnayang ipinahahayag ng ἐν.
theological_decisions:
- issue: Kung isasalin ang Χριστῷ bilang titulo o gagamiting anyong parang pangalan
  choice: sa Mesiyas na si Jesus
  alternative: kay Cristo Jesus
  rationale: Nananatiling makabuluhang titulo ang Χριστός. Ang “Mesiyas na si Jesus” ay malinaw at natural na Filipino at hindi nito ginagawang apelyido ang titulo.
- issue: Kahulugan ng ἐν sa ἐν Χριστῷ Ἰησοῦ
  choice: sa Mesiyas na si Jesus
  alternative: sa pakikipag-isa sa Mesiyas na si Jesus
  rationale: Pinanatili ang maikli at siksik na pahayag ng Griyego upang hindi limitahan ang ugnayan sa isang paliwanag lamang, gaya ng pakikipag-isa, pagkakaugnay, o saklaw ng pagkilos ng Diyos.
- issue: Ugnayan ng ἐν χρηστότητι sa pagpapakita ng biyaya
  choice: sa pamamagitan ng kabutihang-loob niya
  alternative: sa kabutihang-loob niya
  rationale: Pinili ang natural na paraang Filipino na naglalarawan kung paano ipinakikita ang biyaya, ngunit kinikilalang maaari ring ipahiwatig ng ἐν ang saklaw o kalagayan; hindi binago ang sentrong teolohikal na pahayag.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “kapanahunan,” “di-mapapantayan,” “biyaya,” at “kabutihang-loob” upang mapanatili ang bigat ng pahayag nang hindi maging lipas o labis na teknikal. Nananatili sa maliit na titik ang simula dahil ang talata ay pagpapatuloy ng pangungusap mula sa naunang konteksto.
