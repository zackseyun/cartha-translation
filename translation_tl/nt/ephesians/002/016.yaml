  text: καὶ ἀποκαταλλάξῃ τοὺς ἀμφοτέρους ἐν ἑνὶ σώματι τῷ θεῷ διὰ τοῦ σταυροῦ ἀποκτείνας τὴν ἔχθραν ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/016.yaml
  text: and might reconcile both to God in one body through the cross, having put the hostility to death by it.
translation:
  language: tl
  text: at upang maipagkasundo niya silang dalawa sa Diyos sa iisang katawan sa pamamagitan ng krus, matapos niyang patayin ang alitan doon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa loob nito.” Hindi tiyak ang tinutukoy ng “doon” sa Griyego; maaari itong iugnay sa krus o sa iisang katawan.
    reason: Pinananatili ang gramatikal at kontekstuwal na kalabuan ng ἐν αὐτῷ sa halip na itakda itong instrumental na tumutukoy lamang sa krus.
lexical_decisions:
- source_word: ἀποκαταλλάξῃ
  choice: ipagkasundo
  rationale: Ipinahahayag ang ganap na pagpapanumbalik ng relasyon; ang layong “sa Diyos” ay pinananatili.
- source_word: τοὺς ἀμφοτέρους
  choice: silang dalawa
  rationale: Tumutukoy sa dalawang pangkat na binanggit sa konteksto, nang hindi nagdaragdag ng paliwanag sa talata.
- source_word: ἐν ἑνὶ σώματι
  choice: sa iisang katawan
  rationale: Pinananatili ang larawan at ang diin sa pagkakaisa ng dalawang pangkat.
- source_word: διὰ τοῦ σταυροῦ
  choice: sa pamamagitan ng krus
  rationale: Tuwirang inilalahad ang krus bilang paraan ng pakikipagkasundo.
- source_word: τὴν ἔχθραν
  choice: ang alitan
  rationale: Natural na salin para sa aktibong pagkakalaban o poot sa pagitan ng mga pangkat; hindi ito ginagawang damdamin lamang.
- source_word: ἀποκτείνας
  choice: pinatay niya
  rationale: Pinananatili ang matinding metapora ng pagpatay sa pagkakalaban.
- source_word: ἐν αὐτῷ
  choice: sa pamamagitan nito
  rationale: Ang panghalip ay inuunawang tumutukoy sa krus at may instrumental na diwa, alinsunod sa pinakamalapit na antecedent at sa konteksto.
theological_decisions:
- issue: Ang tinutukoy ng “iisang katawan”
  choice: Pinanatiling “sa iisang katawan” nang walang dagdag na paliwanag.
  alternative: “bilang iisang katawan” o tahasang tukuyin itong katawan ni Cristo
  rationale: Maaaring tumukoy ang parirala sa nagkaisang katawan ng dalawang pangkat o sa katawan ni Cristo; hindi dapat isara ng salin ang tunay na saklaw ng larawan.
- issue: Kahulugan ng ἐν αὐτῷ
  choice: “sa pamamagitan nito,” na tumutukoy sa krus
  alternative: “sa loob nito,” na maaaring tumukoy sa iisang katawan
  rationale: Mas malamang ang krus bilang pinakamalapit na antecedent at kasangkapan ng pagpatay sa alitan, ngunit kinikilalang may gramatikal na posibilidad ang ibang pagbasa.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang mahaba at magkakaugnay na kayarian ng sugnay dahil bahagi ito ng pangungusap na nagsimula sa naunang mga talata; iniwasan ang denominasyonal na pagpapaliwanag.
