  text: καὶ συνήγειρεν καὶ συνεκάθισεν ἐν τοῖς ἐπουρανίοις ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/006.yaml
  text: and raised us up with him and seated us with him in the heavenly places in Messiah Jesus[b][a],
translation:
  language: tl
  text: at ibinangon niya tayo kasama ni Mesias Jesus at pinaupo niya tayo kasama ni Mesias Jesus sa mga makalangit na dako, sa pakikipag-isa kay Mesias Jesus,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνήγειρεν
  choice: ibinangon niya tayong kasama ni Mesias Jesus
  rationale: Pinananatili ng “ibinangon” ang larawan ng muling pagkabuhay, at ipinapahayag ng “kasama ni Mesias Jesus” ang sama-samang pakikibahagi na nakapaloob sa unlaping συν-. Ang “tayo” ay hinihingi ng nagpapatuloy na pangungusap mula sa naunang talata.
- source_word: συνεκάθισεν
  choice: pinaupong kasama niya
  rationale: Likas sa modernong Tagalog ang “pinaupo” at hindi nito pinalalabis ang pandiwa bilang tahasang pagluklok sa trono. Ang “kasama niya” ang naghahatid sa puwersa ng συν-.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: sa kalangitan
  rationale: Malinaw at likas itong tumutukoy sa makalangit na saklaw o dako nang hindi pinipilit ang eliptikong pang-uri sa Griyego na maging tiyak na “mga lugar” o “mga kaharian.”
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: sa pakikipag-isa kay Mesias Jesus
  rationale: Ipinakikita ng parirala ang kinalalagyang ugnayan o pakikiisa, hindi lamang ang pisikal na pagiging “nasa loob.” Isinasalin ang Χριστός bilang titulong “Mesias.”
- source_word: καὶ
  choice: at … at
  rationale: Pinananatili ang paulit-ulit na pang-ugnay na nagdurugtong sa dalawang kilos.
theological_decisions:
- issue: Ang pakikibahagi kay Cristo na ipinahihiwatig ng mga pandiwang may συν-
  choice: Tahasan itong isinalin bilang “kasama ni Mesias Jesus” at “kasama niya.”
  alternative: 'Iwan itong di-tahasan: “ibinangon niya tayo at pinaupo.”'
  rationale: Binibigyang-diin ng anyong Griyego ang pakikibahagi ng mga mananampalataya sa pagkabuhay at pagkakaupo ni Jesus; hindi ito dagdag na doktrina kundi bahagi ng kahulugan ng mga pandiwa.
- issue: Ang kahulugan ng ἐν Χριστῷ Ἰησοῦ
  choice: “sa pakikipag-isa kay Mesias Jesus”
  alternative: “kay Cristo Jesus” o “sa Mesias Jesus”
  rationale: Iniiwasan ng napiling anyo ang di-likas na Tagalog at pinananatili ang diwa ng ugnayan o pakikiisa. Hindi nito ipinapakahulugang pisikal na lokasyon ang ἐν.
- issue: Titulo o pangalang nakasanayan para sa Χριστός
  choice: “Mesias Jesus”
  alternative: “Cristo Jesus”
  rationale: Pinananatili ang kahulugan ng Χριστός bilang mesiyanikong titulo sa kontekstong ito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Iniiwasan ang makalumang “mga dakong sangkalangitan” at ang sobrang interpretatibong “iniluklok sa trono.” Ang pag-uulit ng “Mesias Jesus” ay tinanggap upang maging malinaw na si Jesus ang kasama sa pagbangon at upang manatiling hiwalay ang huling pariralang nagsasaad ng pakikipag-isa sa kanya.
