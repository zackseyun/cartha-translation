  text: τὸν νόμον τῶν ἐντολῶν ἐν δόγμασιν καταργήσας, ἵνα τοὺς δύο κτίσῃ ἐν ⸀αὑτῷ εἰς ἕνα καινὸν ἄνθρωπον ποιῶν εἰρήνην,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/015.yaml
  text: having abolished the law of commandments expressed in decrees, so that he might create the two into one new man in himself, making peace,
translation:
  language: tl
  text: na pinawalang-bisa niya ang kautusan ng mga utos na nakasaad sa mga tuntunin[a], upang likhain niya ang dalawa sa kanyang sarili bilang isang bagong tao[b], at sa gayon ay nagtatatag siya ng kapayapaan,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa mga tuntunin,” “na binubuo ng mga tuntunin,” o ayon sa tradisyon, “sa mga ordinansa.”
    reason: lexical_alternative
  - marker: b
    text: Ang “isang bagong tao” ay isang isahang larawang tumutukoy sa isang sama-samang kabuuan; maaari ring “isang bagong sangkatauhan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν νόμον τῶν ἐντολῶν
  choice: ang kautusan ng mga utos
  rationale: Pinananatili ang genitibong ugnayan ng νόμος at ἐντολαί at ang pormal na diwang pangtipan ng “mga utos.”
- source_word: ἐν δόγμασιν
  choice: na nakasaad sa mga tuntunin
  rationale: Ipinahahayag nang malinaw at natural sa Filipino ang kaugnayan ng mga δόγματα sa mga utos. Maaaring mangahulugan ang δόγμα ng tuntunin, atas, o ordinansa.
- source_word: καταργήσας
  choice: na pinawalang-bisa niya
  rationale: Ipinapakita ang mapagpasiyang bisa ng aorist participle nang hindi pinalalawak ang tinutukoy nito lampas sa pariralang “kautusan ng mga utos na nakasaad sa mga tuntunin.”
- source_word: τοὺς δύο
  choice: ang dalawa
  rationale: Pinananatili ang tahasang bilang at ang pagtukoy sa dalawang pangkat sa konteksto, sa halip na gawing mas pangkalahatan.
- source_word: κτίσῃ
  choice: likhain niya
  rationale: Pinananatili ang malakas na diwa ng κτίζω bilang paglikha at ang pahiwatig ng bagong paglikha.
- source_word: ἐν αὑτῷ
  choice: sa kanyang sarili
  rationale: Ipinakikita ang reflexive na anyo ng αὑτῷ at na kay Cristo nagaganap ang pag-iisa.
- source_word: εἰς ἕνα καινὸν ἄνθρωπον
  choice: bilang isang bagong tao
  rationale: Pinananatili ang isahan at kongkretong larawang pangkatawan ng Griyego; ipinapaliwanag sa talababa ang kolektibong gamit nito.
- source_word: ποιῶν εἰρήνην
  choice: at sa gayon ay magtatag ng kapayapaan
  rationale: 'Likas na Filipino para sa resultative na participle: ang paglikha sa dalawa bilang isa ay nagbubunga ng kapayapaan.'
theological_decisions:
- issue: Kolektibong kahulugan ng ἕνα καινὸν ἄνθρωπον
  choice: isang bagong tao
  alternative: isang bagong sangkatauhan
  rationale: Ang “isang bagong tao” ang higit na tuwirang nagpapanatili sa isahang metapora ng Griyego, samantalang ang “isang bagong sangkatauhan” ay malinaw ngunit mas interpretatibo. Inilalagay ang alternatibo sa talababa upang manatiling hayag ang kolektibong diwa.
- issue: Lakas ng καταργήσας kaugnay ng kautusan
  choice: pinawalang-bisa
  alternative: inalis; ginawang walang bisa
  rationale: Pinananatili ang malakas na pandiwa ni Pablo ngunit hindi nagdaragdag ng sistematikong pahayag tungkol sa buong kalooban ng Diyos; ang tuwirang layon ay ang tinukoy na kautusan ng mga utos na nakasaad sa mga tuntunin.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “kautusan,” “mga utos,” at “mga tuntunin” upang mapanatili ang pormal na himig nang hindi maging lipas o labis na teknikal. Ang pambungad na “na” at pangwakas na kuwit ay nagpapanatili sa katangian nitong bahagi ng mas mahabang pangungusap sa Efeso 2:14–16.
