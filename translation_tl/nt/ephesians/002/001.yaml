  text: Καὶ ὑμᾶς ὄντας νεκροὺς τοῖς παραπτώμασιν καὶ ταῖς ἁμαρτίαις ⸀ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/001.yaml
  text: And you were dead in your trespasses and sins,
translation:
  language: tl
  text: At kayo naman ay mga patay dahil sa inyong mga pagsuway at mga kasalanan,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νεκρούς
  choice: mga patay
  rationale: Pinananatili ang tuwirang metapora ng Griyego tungkol sa kalagayang espirituwal ng mga mambabasa.
- source_word: παραπτώμασιν
  choice: mga pagsuway
  rationale: Ipinahahayag ang mga paglabag o maling hakbang laban sa kalooban ng Diyos at naihihiwalay nang sapat sa mas pangkalahatang 'mga kasalanan.'
- source_word: ἁμαρτίαις
  choice: mga kasalanan
  rationale: Karaniwan, malinaw, at teolohikal na angkop na katumbas ng ἁμαρτίαις.
- source_word: τοῖς ... καὶ ταῖς ... ὑμῶν
  choice: dahil sa inyong ... at ...
  rationale: Ang datibo ay likas na mauunawaan bilang sanhi o larangang kaugnay ng kanilang kamatayan; ang 'dahil sa' ay malinaw sa modernong Tagalog habang hindi dinaragdagan ang nilalaman.
theological_decisions:
- issue: Ang pangungusap ay gramatikal na hindi pa kumpleto hanggang sa pangunahing pandiwa sa Efeso 2:5.
  choice: Gumamit ng 'ay mga patay' ngunit panatilihin ang kuwit sa hulihan upang ipakitang nagpapatuloy ang pangungusap.
  alternative: Isalin bilang kumpletong pangungusap na 'At kayo ay patay...'
  rationale: Pinananatili nito ang participial na estruktura at ugnayan sa sumusunod na pangunahing pahayag, nang hindi ginagawang mahirap unawain sa Tagalog.
- issue: Uri ng kamatayang tinutukoy
  choice: Panatilihin lamang ang metaporang 'mga patay.'
  alternative: Idagdag ang 'espirituwal' o 'sa espiritu.'
  rationale: Hindi tahasang nasa tekstong Griyego ang gayong paglilinaw; hinahayaan ng salin na ang konteksto ang magtakda ng kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang 'kayo naman' upang natural na katawanin ang Καὶ ὑμᾶς bilang paglipat ng pansin sa mga mambabasa. Walang footnote marker dahil walang footnote.
