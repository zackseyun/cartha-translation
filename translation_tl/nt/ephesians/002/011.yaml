base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/011.yaml
  text: Therefore remember that formerly you[a], the Gentiles in the flesh[d][c][b], who are called “uncircumcision” by what is called “circumcision,” made by hands in the flesh—
translation:
  language: tl
  text: 'Kaya alalahanin ninyo: dati, kayong mga Hentil ayon sa laman[a]—na tinatawag na “di-tuli” ng tinatawag na “pagtutuli,” na isinasagawa sa laman sa pamamagitan ng mga kamay ng tao[b]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kayong dating mga bansa ayon sa laman.” Ang “mga Hentil” dito ay tumutukoy sa mga hindi Hudyo; may diin sa salitang “kayo.”
    reason: lexical_alternative
  - marker: b
    text: 'Ang “di-tuli” at “pagtutuli” ay mga katawagang etniko at may kaugnayan sa tipan, hindi lamang mga paglalarawan sa katawan. Ang pariralang “na isinasagawa sa laman sa pamamagitan ng mga kamay ng tao” ay tumutukoy sa “pagtutuli” at binibigyang-diin ang panlabas, pisikal, at gawa-ng-taong katangian nito. Maaari ring isalin: “ang tinaguriang ‘pagtutuli’ na ginagawa ng kamay sa katawan.”'
    reason: cultural_note_and_alternative_reading
lexical_decisions:
- source_word: Διὸ
  choice: Kaya
  rationale: Likas at malinaw na panandang naghihinuha mula sa naunang argumento.
- source_word: μνημονεύετε
  choice: alalahanin ninyo
  rationale: Tuwirang utos sa maramihan at natural sa modernong Tagalog.
- source_word: ποτὲ ὑμεῖς
  choice: dati, kayo
  rationale: Pinananatili ang temporal na paghahambing at ang diin sa 'kayo.'
- source_word: τὰ ἔθνη
  choice: mga Hentil
  rationale: Sa kontekstong Hudyo-Hentil, tumutukoy ito sa mga hindi Hudyo, hindi lamang sa mga bansang politikal.
- source_word: ἐν σαρκί
  choice: ayon sa laman
  rationale: Pinananatili ang literal at panlipi-etnikong diwa ng σάρξ, hindi ang moral na diwa ng makasalanang pagkatao.
- source_word: οἱ λεγόμενοι ἀκροβυστία
  choice: na tinatawag na “di-tuli”
  rationale: Pinananatili ang panlipunang pagtawag at ang kolektibong katawagang etniko-relihiyoso.
- source_word: ὑπὸ τῆς λεγομένης περιτομῆς
  choice: ng tinatawag na “pagtutuli”
  rationale: Ginagaya ang pag-uulit ng λεγόμενοι/λεγομένης at pinananatili ang retorikal na distansiya nang hindi pinalalakas bilang tahasang panunuya.
- source_word: ἐν σαρκὶ χειροποιήτου
  choice: na ginawa ng mga kamay sa laman
  rationale: Malapit sa literal na kahulugan at malinaw na inilalarawan ang panlabas at pisikal na pagtutuli.
theological_decisions:
- issue: Kahulugan ng σάρξ sa di-moral na konteksto
  choice: laman
  alternative: katawan; pisikal na kalagayan
  rationale: Ang tinutukoy ay pisikal at etnikong katayuan, hindi makasalanang kalikasan; pinananatili rin nito ang pag-uulit ng 'laman' sa Griyego.
- issue: Lakas ng λεγομένης kaugnay ng περιτομή
  choice: tinatawag na “pagtutuli”
  alternative: ang tinaguriang “pagtutuli”; ang mga tuli
  rationale: Pinananatili ang simetriya ng dalawang katawagan at ang posibleng banayad na pagpuna sa panlabas lamang na palatandaan, nang hindi nag-aangkat ng anti-Hudyong tono.
- issue: Kolektibong gamit ng ἀκροβυστία at περιτομή
  choice: “di-tuli” at “pagtutuli” bilang mga katawagan sa mga pangkat
  alternative: mga hindi tuli at mga tuli
  rationale: Ang mga abstraktong salita ay gumaganap bilang tipanang-etnikong mga bansag; pinananatili ng salin ang kakaibang anyo at tensiyon ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'Hentil,' 'laman,' at 'pagtutuli' bilang nakaugaliang terminong biblikal; pinanatili ang putol na pangungusap sa hulihan dahil nagpapatuloy ang diwa sa kasunod na talata.
