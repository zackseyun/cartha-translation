  terminology: Ang “Hentil,” “laman,” at “pagtutuli” ay angkop na nakaugaliang terminong biblikal. Ang “di-tuli” ay pinananatili bilang sadyang kolektibong bansag; ang mga panipi at ang “tinatawag na” ay pumipigil na ituring itong neutral na paglalarawang anatomikal lamang.
