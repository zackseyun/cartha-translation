  to: 'Kaya alalahanin ninyo: dati, kayong mga Hentil ayon sa laman[a]—na tinatawag na “di-tuli” ng tinatawag na “pagtutuli,” na isinasagawa sa laman sa pamamagitan ng mga kamay ng tao[b]—'
