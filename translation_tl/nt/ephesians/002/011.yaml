  source_fidelity: Tumpak na naihahatid ng draft ang inferensiyang Διὸ, ang utos na μνημονεύετε, ang diin at dating katayuan sa ποτὲ ὑμεῖς, at ang etnikong kahulugan ng τὰ ἔθνη. Napananatili rin ang magkapares na panlipunang bansag na “di-tuli” at “pagtutuli,” pati ang sinadyang putol na sintaks na nagpapatuloy sa talata 12. Gayunman, ang “na ginawa ng mga kamay sa laman” ay hindi likas na Tagalog at maaaring magmukhang ang mga kamay mismo ang nasa laman, sa halip na ang pagtutuli ang pisikal na isinasagawa ng tao.
