base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/018.yaml
  text: For through him we both have access in one Spirit to the Father[a][b][c].
translation:
  language: tl
  text: Sapagkat sa pamamagitan niya, kapwa tayo ay may daan upang lumapit sa Ama sa iisang Espiritu.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Dahil sa pamamagitan niya, kapwa tayo ay may daan upang lumapit …”
    reason: lexical_alternative
  - marker: b
    text: Ang “may daan upang lumapit” ay maaari ring isalin na “may pagkakataong lumapit” o “may paglapit.”
    reason: lexical_alternative
  - marker: c
    text: O “sa pamamagitan ng iisang Espiritu.” Pinananatili ng “sa iisang Espiritu” ang anyo ng Griyego, na maaaring tumukoy sa paraan o sa saklaw ng paglapit.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Sapagkat
  rationale: Nagpapakilala ito ng paliwanag o batayan ng naunang pahayag. Likas sa kasalukuyang Tagalog ang “sapagkat,” at maaari rin itong maunawaan bilang “dahil.”
- source_word: δι’ αὐτοῦ
  choice: sa pamamagitan niya
  rationale: Pinananatili nito ang diwa ng paraan o tagapamagitan na ipinahihiwatig ng διά na may genitive; sa konteksto, si Cristo ang tinutukoy.
- source_word: ἔχομεν τὴν προσαγωγὴν
  choice: makalalapit
  rationale: Natural nitong ipinapahayag sa Tagalog ang pagkakaroon ng access o pagkakataong lumapit. Iniiwasan nito ang di-likas na “may paglapit,” bagaman hindi nito tahasang inilalantad ang courtly o cultic na kulay ng pangngalan.
- source_word: οἱ ἀμφότεροι
  choice: tayong kapwa
  rationale: Pinananatili ang unang panauhan at ang magkasamang paglahok ng dalawang pangkat—mga Judio at mga Hentil—nang hindi idinaragdag ang mga pangalang iyon sa teksto.
- source_word: ἐν ἑνὶ πνεύματι
  choice: sa iisang Espiritu
  rationale: Pinananatili ang ἐν at ang diin sa iisang Espiritu. Ang malaking titik ay nagpapakita ng malamang na pagtukoy sa Banal na Espiritu, habang ang “sa” ay nag-iiwan ng puwang para sa diwang kasangkapan o saklaw.
- source_word: πρὸς τὸν πατέρα
  choice: sa Ama
  rationale: Direkta at natural itong naghahayag ng paglapit tungo sa presensiya ng Ama nang hindi nagdaragdag ng salitang wala sa Griyego.
theological_decisions:
- issue: Tinutukoy ng “iisang Espiritu”
  choice: ang Banal na Espiritu
  alternative: iisang diwa na pinagsasaluhan ng mga tao
  rationale: 'Ang konteksto ay may malinaw na balangkas: sa pamamagitan niya (ang Anak), sa iisang Espiritu, patungo sa Ama. Ipinahihiwatig ng malaking titik ang malamang na kahulugan nang walang idinaragdag na paliwanag sa pangunahing teksto.'
- issue: Diwa ng προσαγωγή
  choice: pagkakaroon ng kakayahan o pahintulot na lumapit sa Ama
  alternative: pormal na pagpapakilala o pagharap sa presensiya ng Ama
  rationale: Ang “makalalapit” ang pinakanatural sa modernong Tagalog at naipapahayag ang pinagsasaluhang access, ngunit hindi nito nilulutas nang labis ang posibleng larawan ng pormal na pagpapakilala o pagharap.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “tayong kapwa” upang manatiling maikli at mapanatili ang pagkakaisa ng dalawang pangkat; ginamit ang “makalalapit” sa halip na mas literal ngunit di-likas na “may paglapit.”
