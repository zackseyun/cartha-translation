id: EPH.2.13
reference: Ephesians 2:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: νυνὶ δὲ ἐν Χριστῷ Ἰησοῦ ὑμεῖς οἵ ποτε ὄντες μακρὰν ⸂ἐγενήθητε ἐγγὺς⸃ ἐν τῷ αἵματι τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/013.yaml
  text: But now in Messiah Jesus[d][c][b][a], you who once were far away have become near by the blood of the Messiah.
translation:
  language: tl
  text: Ngunit ngayon, sa Mesiyas na si Jesus[d], kayong dating nasa malayo[a] ay naging malapit[b] sa pamamagitan ng dugo ng Mesiyas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nasa malayong dako.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “inilapit” o “dinala upang maging malapit.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “dahil sa dugo ng Mesiyas” o, mas literal, “sa dugo ng Mesiyas.”
    reason: lexical_alternative
  - marker: d
    text: 'Griyego: “Cristo.” Isinalin dito bilang “Mesiyas” sapagkat titulo ang Χριστός.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Ngunit ngayon
  rationale: Pinananatili nito ang pagsalungat sa dating kalagayan at ang diin sa kasalukuyang pagbabago.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: sa Mesiyas na si Jesus
  rationale: Ang “sa” ay nagpapanatili sa wika ni Pablo tungkol sa pakikipag-isa o pagiging nakapaloob sa Mesiyas, habang malinaw na titulo ang “Mesiyas” at pangalan ang “Jesus.”
- source_word: ὑμεῖς οἵ ποτε ὄντες
  choice: kayong dating nasa
  rationale: Natural na Filipino ito para sa dating kalagayang inilalarawan ng panghalip, panuring na sugnay, at participle.
- source_word: μακρὰν
  choice: nasa malayo
  rationale: Pinananatili nito ang larawan ng distansiya na maaaring magpahiwatig kapuwa ng ugnayan at pagkakahiwalay sa bayan ng tipan.
- source_word: ἐγενήθητε ἐγγὺς
  choice: ay naging malapit
  rationale: Tuwirang sinasalamin ng “naging” ang diwa ng γίνομαι nang hindi tahasang nagdaragdag ng ahenteng hindi binanggit sa anyo ng pandiwa.
- source_word: ἐν τῷ αἵματι
  choice: sa pamamagitan ng dugo
  rationale: Natural nitong ipinahahayag ang instrumental na gamit ng ἐν—ang dugo ang paraan ng pagiging malapit—nang hindi nagpapasok ng mas detalyadong teorya ng pagtubos.
- source_word: τοῦ Χριστοῦ
  choice: ng Mesiyas
  rationale: Isinasalin ang Χριστός bilang titulong “Mesiyas” sa halip na ituring itong pangalan lamang.
theological_decisions:
- issue: Pagsasalin sa Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Ang Χριστός ay gumaganap bilang makabuluhang titulo rito; ipinahahayag ng “Mesiyas” ang kahulugan nito, samantalang inilalahad sa talababa ang tradisyonal na anyong “Cristo.”
- issue: Diwa ng ἐν τῷ αἵματι τοῦ Χριστοῦ
  choice: 'instrumental: “sa pamamagitan ng dugo ng Mesiyas”'
  alternative: 'locative o sphere: “sa dugo ng Mesiyas”; causal: “dahil sa dugo ng Mesiyas”'
  rationale: Sa daloy ng pangungusap, inilalarawan ng parirala ang paraan ng pagiging malapit. Gayunman, hindi lubos na nilulutas ng salin ang lawak ng gamit ng ἐν, kaya itinatala ang mga posibleng alternatibo.
- issue: Tinig at ahensiya sa ἐγενήθητε ἐγγὺς
  choice: “naging malapit”
  alternative: “inilapit” o “dinala upang maging malapit”
  rationale: Ang anyo ng γίνομαι ay pangunahing nagsasaad ng pagbabago ng kalagayan. Hindi tahasang pinapangalanan ng Griyego ang gumawa, kaya hindi ito idinaragdag sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sa Mesiyas na si Jesus” upang maging natural sa Tagalog habang pinananatili ang teolohikal na bigat ng ἐν Χριστῷ Ἰησοῦ. Iniwasan ang mas lumang “datapwat” at ang di-likas na “naging malapit sa pamamagitan” na walang malinaw na paghahati ng parirala.
