  yaml_path: translation/nt/ephesians/002/022.yaml
  text: in whom you also are being built together into a dwelling place for God in the Spirit[a][b].
translation:
  language: tl
  text: Sa kanya, kayo rin ay sama-samang itinatayo upang maging tahanan ng Diyos sa Espiritu[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa gusaling ito,” kung ang panghalip ay tumutukoy sa buong gusali sa halip na tuwirang tumukoy kay Cristo.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “sa espiritu” o “sa pamamagitan ng Espiritu.” Maaaring tukuyin ng parirala ang saklaw ng pananahan ng Diyos o ang pagkilos ng Banal na Espiritu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Sa kanya
  rationale: Pinakamalamang na tumutukoy kay Cristo sa daloy ng vv. 20–21. Likas sa modernong Tagalog ang “sa kanya” at pinananatili nito ang ugnayang nakapaloob kay Cristo.
- source_word: καὶ ὑμεῖς
  choice: kayo rin
  rationale: Ang “rin” ay naghahatid ng dagdag na diwa ng καί, at ang “kayo” ay nagpapanatili sa tahasang maramihang pagtukoy sa mga kausap.
- source_word: συνοικοδομεῖσθε
  choice: ay sama-samang itinatayo
  rationale: Ipinapakita ng “itinatayo” ang kasalukuyan at pasibong pagkilos, samantalang ipinahahayag ng “sama-sama” ang σύν at ang pagkakaugnay ng mga mananampalataya sa larawan ng gusali.
- source_word: εἰς κατοικητήριον
  choice: upang maging tahanan
  rationale: Ipinahahayag ng “upang maging” ang layunin o bungang tinutukoy ng εἰς. Ang “tahanan” ay malinaw, dignified, at likas na katumbas ng lugar na tinitirhan.
- source_word: τοῦ θεοῦ
  choice: ng Diyos
  rationale: Sa pariralang “tahanan ng Diyos,” likas sa Tagalog na nauunawaang ang Diyos ang nananahan doon, habang nananatiling malapit sa anyong henitibo ng Griyego.
- source_word: ἐν πνεύματι
  choice: sa Espiritu
  rationale: Pinakamalamang na ang tinutukoy ay ang Banal na Espiritu. Pinananatili ng “sa” ang maaaring diwa ng saklaw o kinaroroonan nang hindi tuluyang inaalis ang posibleng diwa ng pagiging kasangkapan.
theological_decisions:
- issue: Tinutukoy ng ἐν ᾧ
  choice: 'Kay Cristo: “Sa kanya”'
  alternative: 'Sa buong gusali: “Dito” o “sa gusaling ito”'
  rationale: Ang paulit-ulit na ἐν ᾧ sa konteksto at ang agarang diin kay Cristo ay pumapabor sa personal na tinutukoy, ngunit may tunay na posibilidad na balikan nito ang larawan ng buong gusali.
- issue: Diwa ng ἐν πνεύματι
  choice: “sa Espiritu,” na tumutukoy sa Banal na Espiritu
  alternative: “sa espiritu” o “sa pamamagitan ng Espiritu”
  rationale: Ang wika tungkol sa templo at pananahan sa Efeso ay pumapabor sa Banal na Espiritu. Gayunman, hindi nilulutas ng salin kung ang parirala ay pangunahing tumutukoy sa saklaw ng pananahan o sa pagkilos ng Espiritu.
translation_notes:
  register: Makabago at dignified na Filipino; malinaw sa karaniwang mambabasa. Pinanatili ang larawan ng pagtatayo at ang patuloy, pasibong pagkilos, pati ang tunay na kalabuan ng dalawang pariralang may ἐν.
