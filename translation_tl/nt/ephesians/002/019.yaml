id: EPH.2.19
reference: Ephesians 2:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἄρα οὖν οὐκέτι ἐστὲ ξένοι καὶ πάροικοι, ἀλλὰ ⸀ἐστὲ συμπολῖται τῶν ἁγίων καὶ οἰκεῖοι τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/019.yaml
  text: So then[a], you are no longer strangers and resident foreigners, but you are fellow citizens with the saints and members of God's household[c][b],
translation:
  language: tl
  text: Kaya nga, hindi na kayo mga dayuhan at mga dayuhang naninirahan[a], kundi mga kapwa mamamayan kasama ng mga banal[b][c] at mga kabilang sa sambahayan ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pariralang Griyego ay tumutukoy sa mga naninirahan sa isang lugar ngunit walang ganap na katayuan o karapatan bilang mamamayan.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga banal” dito ay ang banal na bayan ng Diyos, hindi lamang isang natatanging pangkat na pormal na kinilalang mga santo.
    reason: cultural_note
  - marker: c
    text: Maaari ring isalin na “mga kapwa mamamayan ng mga banal.” Ang diwa ay nakikibahagi sila sa iisang pagkamamamayan kasama ng banal na bayan ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Kaya nga
  rationale: Likas na ipinahahayag nito sa Filipino ang pinatinding kongklusyon mula sa naunang pangangatuwiran.
- source_word: οὐκέτι
  choice: hindi na
  rationale: Malinaw nitong ipinahahayag ang pagbabago ng dating kalagayan.
- source_word: ξένοι
  choice: mga dayuhan
  rationale: Tumutukoy ito sa mga hindi kabilang sa isang bayan o pamayanan at angkop sa kasunod na paghahambing sa pagkamamamayan at sambahayan.
- source_word: πάροικοι
  choice: mga dayuhang naninirahan
  rationale: Ipinahihiwatig nito ang mga naninirahan sa isang lugar ngunit walang ganap na katayuan at karapatan bilang mamamayan; iniiwasan ang salitang maaaring magpahiwatig na panandalian lamang ang paninirahan.
- source_word: συμπολῖται
  choice: mga kapwa mamamayan
  rationale: Pinananatili ang diwa ng pinagsasaluhang pagkamamamayan.
- source_word: τῶν ἁγίων
  choice: kasama ng mga banal
  rationale: Natural sa Filipino ang pagpapahayag ng kaugnayan bilang pakikisama sa iisang pagkamamamayan, habang pinananatili ang tradisyonal at malawak na katawagang 'mga banal.'
- source_word: οἰκεῖοι
  choice: mga kabilang sa sambahayan
  rationale: Ipinahahayag ang pagiging kasapi o kabilang sa isang sambahayan nang hindi nilalabo ang metapora.
- source_word: τοῦ θεοῦ
  choice: ng Diyos
  rationale: Likas na anyo ng genitibong nagpapakita na ang sambahayan ay sa Diyos.
theological_decisions:
- issue: Tinutukoy ng τῶν ἁγίων (“mga banal”)
  choice: Pinanatili ang malawak na katawagang “mga banal,” na tumutukoy sa banal na bayan ng Diyos nang hindi higit na nililimitahan ang saklaw nito.
  alternative: Mga anghel lamang; mga mananampalatayang Judio lamang; o lahat ng mananampalataya nang tahasang tinutukoy.
  rationale: Sa konteksto, inilalarawan ang pagsasama ng mga dating taga-labas sa bayan at sambahayan ng Diyos. Hindi dapat lutasin sa salin ang eksaktong saklaw na hindi tahasang nililinaw ng parirala.
- issue: Ugnayan ng genitibong τῶν ἁγίων sa συμπολῖται
  choice: “mga kapwa mamamayan kasama ng mga banal”
  alternative: “mga kapwa mamamayan ng mga banal”
  rationale: Ang pangunahing salin ay nililinaw ang pinagsasaluhang pagkamamamayan, ngunit itinatala sa talababa ang mas pormal na anyo upang mapanatili ang gramatikal na posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mga larawang sibiko (“mamamayan”) at pampamilya (“sambahayan”) ng tekstong Griyego. Ang bahagyang pag-uulit sa “mga dayuhan at mga dayuhang naninirahan” ay sinadyang panatilihin upang maipakita ang dalawang magkaugnay ngunit magkaibang terminong ξένοι at πάροικοι.
