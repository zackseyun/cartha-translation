  text: For he himself is our peace[a], who made both one and broke down the dividing wall of the barrier—the hostility—in his flesh[d][c][b],
translation:
  language: tl
  text: Sapagkat siya mismo ang ating kapayapaan. Pinag-isa niya ang dalawang panig[a] at iginiba ang pader na nagsisilbing hadlang[b]—ang alitan[d]—sa kanyang laman[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “dalawang panig” ay ang mga Judio at mga Hentil sa agarang konteksto. Maaari ring isalin na “ang dalawa.”
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “ang gitnang pader na naghahati” o “ang pader ng harang.”
    reason: lexical_alternative
  - marker: c
    text: Sa Griyego, “sa kanyang laman.” Tumutukoy ito sa pisikal na laman ni Cristo at, sa konteksto, sa kanyang kamatayan; hindi ito nangangahulugang inalis ang kanyang pagkatao.
    reason: lexical_alternative
  - marker: d
    text: Maaari ring unawain ang pagkakasunod bilang “ang alitan sa kanyang laman,” bagaman maaaring magmukhang nasa laman ni Cristo ang alitan. Nagpapatuloy ang kayarian ng pangungusap sa kasunod na talata.
    reason: previous_rendering
lexical_decisions:
- source_word: αὐτὸς
  choice: siya mismo
  rationale: 'Pinananatili ang diin ng masidhing panghalip: si Cristo mismo ang ating kapayapaan.'
- source_word: γάρ
  choice: Sapagkat
  rationale: Likas na pang-ugnay sa Filipino na nagpapakilala sa batayan ng naunang pahayag.
- source_word: ἡ εἰρήνη ἡμῶν
  choice: ang ating kapayapaan
  rationale: Tuwirang pinananatili ang larawan na si Cristo mismo ang kapayapaan ng kanyang bayan.
- source_word: ὁ ποιήσας τὰ ἀμφότερα ἓν
  choice: Pinag-isa niya ang dalawang panig
  rationale: Likas na Filipino para sa literal na ‘ginawang isa ang dalawa’; ipinahihiwatig ng konteksto ang mga Judio at mga Hentil nang hindi labis na ipinapasok ang mga katawagang iyon sa talata.
- source_word: τὸ μεσότοιχον τοῦ φραγμοῦ
  choice: ang pader na nagsisilbing hadlang
  rationale: Inihahatid ang larawan ng pader na naghihiwalay at ang nagpapaliwanag na genitibong τοῦ φραγμοῦ sa malinaw na modernong Filipino.
- source_word: λύσας
  choice: iginiba
  rationale: Angkop na pandiwa para sa pagwasak o pagbuwag sa isang pader.
- source_word: τὴν ἔχθραν
  choice: ang alitan
  rationale: Karaniwan at malinaw na salitang Filipino para sa poot o pagkakaalit sa pagitan ng mga panig.
- source_word: ἐν τῇ σαρκὶ αὐτοῦ
  choice: sa pamamagitan ng kanyang laman
  rationale: Pinananatili ang konkretong σάρξ bilang ‘laman’ at ipinapahayag ang malamang na instrumental na kaugnayan nito sa paggiba, habang itinatala sa talababa ang mas pormal na anyo.
theological_decisions:
- issue: Tinutukoy ng τὰ ἀμφότερα
  choice: ang dalawang panig
  alternative: ang dalawa; ang dalawang grupo; ang mga Judio at mga Hentil
  rationale: Ang agarang konteksto ay tumutukoy sa mga Judio at mga Hentil. Ang ‘dalawang panig’ ay malinaw ngunit hindi labis na nagpapaliwanag sa mismong teksto.
- issue: Kahulugan ng σάρξ tungkol kay Cristo
  choice: laman
  alternative: katawan
  rationale: Hindi ito tumutukoy sa ‘makasalanang kalikasan’ kundi sa pisikal at mortal na pag-iral ni Cristo, lalo na sa kanyang kamatayan. Pinananatili ng ‘laman’ ang leksikal at teolohikal na kongkreto ng Griyego.
- issue: Ugnayan ng τὴν ἔχθραν sa naunang parirala
  choice: 'apposisyon na nagpapaliwanag sa hadlang: ‘—ang alitan—’'
  alternative: iugnay ang ‘alitan’ sa sumusunod na talata; gawing hiwalay na layon ng pandiwa
  rationale: Ang apposisyon ay isang matibay na sintaktikong pagbasa, ngunit may tunay na kalabuan dahil nagpapatuloy ang pangungusap sa talata 15. Pinananatili ng mga gatlang ang bukas at nagpapatuloy na daloy.
- issue: Ugnayan ng ἐν τῇ σαρκὶ αὐτοῦ
  choice: 'instrumental: ‘sa pamamagitan ng kanyang laman’'
  alternative: 'lokal o mas pormal: ‘sa kanyang laman’'
  rationale: Iniiwasan nitong ipahiwatig na ang alitan ay nasa loob ng laman ni Cristo at likas na inuugnay ang parirala sa kanyang ginawang paggiba; gayunman, kinikilala sa talababa ang mas literal at sintaktikong hindi gaanong tiyak na anyo.
translation_notes:
  register: Modernong, marangal, at madaling maunawaang Filipino. Ginamit ang ‘Sapagkat’ para sa malinaw na ugnayang pangdiskurso, ‘pinag-isa’ para sa natural na pagpapahayag ng resulta, at ‘iginiba’ upang panatilihin ang matingkad na larawan ng pader. Ang pangwakas na gatlang ay sadyang nagpapanatili sa nagpapatuloy na sintaks patungo sa talata 15.
