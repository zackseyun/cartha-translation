base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/021.yaml
  text: in whom the whole building[a], being fitted together, grows into a holy temple in the Lord,
translation:
  language: tl
  text: Sa kanya, ang buong gusali[a], na pinagdudugtong-dugtong nang maayos, ay lumalago tungo sa isang banal na templo sa Panginoon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bawat gusali.” Maaaring unawain ang pariralang Griego bilang tumutukoy sa bawat gusali o sa buong gusali bilang isang kabuuan; sinusunod ng pangunahing teksto ang larawan sa konteksto ng iisang nagkakaisang templo.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Sa kanya
  rationale: Ang panghalip ay pinakamalamang na tumutukoy kay Cristo sa naunang talata. Likas sa Filipino ang “sa kanya” at pinananatili nito ang personal at malawak na diwa ng pakikiisa kay Cristo.
- source_word: πᾶσα οἰκοδομὴ
  choice: ang buong gusali
  rationale: Bagaman maaaring unawain bilang “bawat gusali,” higit na angkop sa konteksto ang nagkakaisang larawan ng iisang gusali o templo. Pinanatili sa talababa ang tunay na alternatibong pagbasa.
- source_word: συναρμολογουμένη
  choice: na maayos na pinagkakabit-kabit
  rationale: Ipinahahayag ng kasalukuyang balintiyak na pandiwari ang nagpapatuloy na pagdurugtong ng magkakaibang bahagi sa isang maayos na kabuuan, habang pinananatili ang larawang pang-arkitektura.
- source_word: αὔξει
  choice: lumalago
  rationale: Pinananatili ng “lumalago” ang kasalukuyan at nagpapatuloy na pagkilos, pati ang pambihirang pagsasanib ng larawang buhay at gusali.
- source_word: εἰς
  choice: upang maging
  rationale: 'Likas na ipinahahayag sa Filipino ang layon o kinalabasan ng εἰς: ang gusali ay lumalago tungo sa pagiging banal na templo.'
- source_word: ναὸν ἅγιον
  choice: isang banal na templo
  rationale: Ang ναός ay tumutukoy sa santuwaryo o templong tahanan ng presensiya ng Diyos. Malinaw at pamilyar ang “banal na templo” nang hindi nagpapasok ng di-kailangang paliwanag.
- source_word: ἐν κυρίῳ
  choice: sa Panginoon
  rationale: Pinananatili nito ang maikli ngunit malawak na pananalita ni Pablo tungkol sa saklaw o pakikiisa, nang hindi ito nililimitahan sa isang paliwanag lamang.
theological_decisions:
- issue: Kung ang tinutukoy ng ᾧ ay si Cristo mismo o ang larawang gusali/batong-panulok
  choice: 'Personal na pagtukoy kay Cristo: “Sa kanya”'
  alternative: 'Di-personal na pagtukoy: “Dito” o “Sa gusaling ito”'
  rationale: Si Cristo Jesus mismo ang agarang sentro ng naunang pahayag bilang batong-panulok, at inuulit sa konteksto ang pananalitang tumutukoy sa pagiging “sa kanya.”
- issue: Kung ang πᾶσα οἰκοδομὴ ay kolektibo o distributibo
  choice: 'Kolektibo: “ang buong gusali”'
  alternative: 'Distributibo: “bawat gusali”'
  rationale: Binibigyang-diin ng konteksto ang pagkakaisa ng mga Judio at mga Hentil bilang isang bagong sangkatauhan at sambahayan. Gayunman, dahil pinahihintulutan ng anyong Griego ang distributibong pagbasa, inilagay iyon sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “pinagkakabit-kabit” upang malinaw na maipakita ang nagpapatuloy na pagbuo ng magkakaugnay na mga bahagi, at “lumalago” upang mapanatili ang sinadyang pagsasanib ng organiko at pang-arkitekturang larawan.
