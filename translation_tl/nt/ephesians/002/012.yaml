id: EPH.2.12
reference: Ephesians 2:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτι ⸀ἦτε τῷ καιρῷ ἐκείνῳ χωρὶς Χριστοῦ, ἀπηλλοτριωμένοι τῆς πολιτείας τοῦ Ἰσραὴλ καὶ ξένοι τῶν διαθηκῶν τῆς ἐπαγγελίας, ἐλπίδα μὴ ἔχοντες καὶ ἄθεοι ἐν τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/012.yaml
  text: that at that time you were without Messiah[a], alienated from the commonwealth of Israel and strangers to the covenants of the promise[c][b], having no hope and without God in the world.
translation:
  language: tl
  text: na noong panahong iyon, kayo ay walang Mesiyas[a], hiwalay sa sambayanan ng Israel at mga dayuhan sa mga tipan ng pangako[b], walang pag-asa at walang Diyos[c] sa sanlibutan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Cristo.” Ang salitang Griyego na Χριστός ay isang titulo na maaaring isalin bilang “Mesiyas” o “Cristo.”
    reason: alternative_reading
  - marker: b
    text: O “mga tipan na may kaugnayan sa pangako.”
    reason: lexical_alternative
  - marker: c
    text: Ang “walang Diyos” ay maaaring mangahulugang walang kaugnayan sa tunay na Diyos, at hindi kinakailangang tumukoy sa ateismo sa makabagong pilosopikal na kahulugan.
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς Χριστοῦ
  choice: walang Mesiyas
  rationale: Ginamit ang “Mesiyas” sapagkat titulo ang Χριστός sa kontekstong Judio at kaugnay ng mga tipan; likas ding ipinahihiwatig ng “walang” ang dating kalagayang hindi kabilang o walang kaugnayan sa Mesiyas.
- source_word: ἀπηλλοτριωμένοι τῆς πολιτείας τοῦ Ἰσραήλ
  choice: hiwalay sa sambayanan ng Israel
  rationale: Ang participle ay nagsasaad ng kalagayang nalayo o hindi kabilang, samantalang ang πολιτεία ay tumutukoy rito sa organisadong sambayanan o kaayusang panlipunan ng Israel, hindi lamang sa indibidwal na pagkamamamayan.
- source_word: ξένοι
  choice: mga dayuhan
  rationale: Ipinapahayag nito na sila ay nasa labas ng saklaw ng mga tipan; malinaw at natural sa modernong Tagalog ang “mga dayuhan.”
- source_word: διαθηκῶν τῆς ἐπαγγελίας
  choice: mga tipan ng pangako
  rationale: Pinananatili ang maramihang “mga tipan” at ang isahang “pangako,” gayundin ang sadyang masinsing ugnayang genitibo ng Griyego.
- source_word: ἐλπίδα μὴ ἔχοντες
  choice: walang pag-asa
  rationale: Maikli at natural itong paglalarawan sa dati nilang kalagayan at tumpak na ipinapahayag ang kawalan ng pag-asa.
- source_word: ἄθεοι
  choice: walang Diyos
  rationale: Iniiwasan nitong ipakahulugan ang salita bilang makabagong pilosopikal na ateismo at pinananatili ang diwa ng pagiging walang kaugnayan sa tunay na Diyos.
- source_word: ἐν τῷ κόσμῳ
  choice: sa sanlibutan
  rationale: Dignified at pamilyar na salin ito para sa κόσμος bilang larangan ng buhay ng tao.
theological_decisions:
- issue: Pagbibigay-kahulugan sa Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Sa talatang ito, ang konteksto ng Israel, mga tipan, at pangako ay nagpapatingkad sa kahulugan ng Χριστός bilang titulong Mesiyas, bagaman lehitimo rin ang tradisyonal na “Cristo.”
- issue: Pagbibigay-kahulugan sa ἄθεοι
  choice: walang Diyos
  alternative: hindi kumikilala sa Diyos / walang pagkadiyos
  rationale: Pinananatili nito ang teolohikal at pang-ugnayang diwa nang hindi ipinapalagay na tinutukoy ni Pablo ang sistematikong ateismo sa makabagong kahulugan.
- issue: Saklaw ng πολιτεία τοῦ Ἰσραήλ
  choice: sambayanan ng Israel
  alternative: pagkamamamayan sa Israel
  rationale: Maaaring tumukoy ang πολιτεία sa pagkamamamayan o sa pampolitika at panlipunang kaayusan; “sambayanan” ang mas natural na Tagalog at nagpapanatili ng kolektibong diin.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “sambayanan” upang likas na maipahayag ang kolektibong diwa ng πολιτεία, at pinanatili ang “mga tipan ng pangako” upang hindi lutasin nang labis ang masinsing ugnayan ng mga pangngalan sa Griyego.
