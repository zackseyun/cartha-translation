  yaml_path: translation/nt/ephesians/002/004.yaml
  text: But God[a], being rich in mercy, because of his great love with which he loved us,
translation:
  language: tl
  text: Ngunit ang Diyos, na sagana sa awa, dahil sa dakila niyang pag-ibig na ipinakita niya sa atin,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Griyego, magkaugnay ang mga salitang isinaling “pag-ibig” at “ipinakita niya”; literal na inuulit ang salitang-ugat: “ang dakila niyang pag-ibig na inibig niya tayo.”'
    reason: Ipinatatalastas ang cognate na pag-uulit ng ἀγάπην at ἠγάπησεν nang hindi gumagamit ng di-likas na Tagalog sa pangunahing teksto.
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Malinaw na ipinapakita ang matinding pagsalungat sa naunang paglalarawan sa kalagayan ng sangkatauhan.
- source_word: πλούσιος ὢν ἐν ἐλέει
  choice: na sagana sa awa
  rationale: Natural sa makabagong Tagalog at pinananatili ang larawan ng kasaganaan at ang natatanging diwa ng awa.
- source_word: διὰ τὴν πολλὴν ἀγάπην αὐτοῦ
  choice: dahil sa dakila niyang pag-ibig
  rationale: Ang διά na may akusatibo ay nagsasaad ng dahilan; ang “dakila” ay likas na katumbas ng πολλήν kapag tumutukoy sa pag-ibig.
- source_word: ἣν ἠγάπησεν ἡμᾶς
  choice: sa atin
  rationale: Isinama sa likas na pariralang “pag-ibig sa atin.” Naihatid nito ang tinutukoy ng sugnay nang hindi gumagamit ng pilit at di-likas na anyong “pag-ibig na ipinang-ibig niya sa atin”; ipinaliliwanag sa talababa ang pag-uulit sa Griyego.
theological_decisions:
- issue: Pag-uulit ng magkaugnay na ἀγάπην at ἠγάπησεν
  choice: dakila niyang pag-ibig sa atin
  alternative: dakila niyang pag-ibig na ipinang-ibig niya sa atin
  rationale: Sadyang inuulit sa Griyego ang pangngalan at pandiwang mula sa iisang salitang-ugat. Gayunman, ang tuwirang paggaya rito ay lubhang di-likas sa kasalukuyang Tagalog. Pinananatili ng pangunahing teksto ang buong kahulugan, at itinatala ng talababa ang anyo at diin ng orihinal.
- issue: Ugnayan ng awa at pag-ibig
  choice: Panatilihing magkahiwalay ang “sagana sa awa” at “dahil sa dakila niyang pag-ibig”
  alternative: Pagsamahin bilang “dahil sa kanyang maawaing pag-ibig”
  rationale: Magkaugnay ngunit hindi pinag-iisa ng Griyego ang awa at pag-ibig; ang magkahiwalay na pagkakasalin ay umiiwas sa teolohikal na pagpapasimple.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang hindi tapos na balangkas ng talata sapagkat nagpapatuloy ang pangunahing pangungusap sa kasunod na talata.
