source:
  edition: SBLGNT
  text: ἐν οἷς καὶ ἡμεῖς πάντες ἀνεστράφημέν ποτε ἐν ταῖς ἐπιθυμίαις τῆς σαρκὸς ἡμῶν, ποιοῦντες τὰ θελήματα τῆς σαρκὸς καὶ τῶν διανοιῶν, καὶ ⸀ἤμεθα τέκνα φύσει ὀργῆς ὡς καὶ οἱ λοιποί·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/003.yaml
  text: among whom we all also once lived in the desires of our flesh[a], fulfilling the desires of the flesh and of the mind, and we were by nature children of wrath[e][d][c][b], just as the rest were.
translation:
  language: tl
  text: Kasama nila[a], tayong lahat ay namuhay rin noon ayon sa mga pagnanasa ng ating laman[b], na isinasagawa ang mga kagustuhan ng laman at ng isipan[c]. At likas tayong mga anak ng poot[d], gaya rin ng iba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sa mga ito.” Maaaring tumukoy ang Griyego sa mga taong inilalarawan ng pagsuway o sa kalagayan at larangan ng pagsuway.
    reason: alternative_reading
  - marker: b
    text: Ang “laman” ay maaari ring ipakahulugang “makasalanang kalikasan,” ngunit pinananatili rito ang mismong termino ni Pablo at ang buong saklaw nito.
    reason: lexical_alternative
  - marker: c
    text: 'Sa mas literal na anyo: “ginagawa ang mga kalooban ng laman at ng mga pag-iisip.”'
    reason: literal_rendering
  - marker: d
    text: O “mga taong saklaw ng poot.” Ang “mga anak ng poot” ay literal na pagpapanatili sa idyomang Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν οἷς
  choice: Kasama nila
  rationale: Likás at malinaw sa Tagalog bilang personal na pagtukoy sa mga taong binanggit sa naunang talata, habang nilalagyan ng talababa ang posibleng pagtukoy sa kalagayan o larangan ng pagsuway.
- source_word: ἀνεστράφημέν
  choice: namuhay
  rationale: Ipinahahayag ang dating paraan o asal ng pamumuhay nang natural sa modernong Tagalog.
- source_word: ποτε
  choice: noon
  rationale: Malinaw na tumutukoy sa dating kalagayan, bago ang pagbabagong inilalarawan sa konteksto.
- source_word: ἐπιθυμίαις
  choice: mga pagnanasa
  rationale: Sapat ang lawak nito para sa masasamang paghahangad at hindi ito nililimitahan sa seksuwal na pagnanasa.
- source_word: σάρξ
  choice: laman
  rationale: Pinananatili ang mismong terminong ginamit ni Pablo at ang saklaw at tensiyong teolohikal nito, sa halip na agad itong ipakahulugang ‘makasalanang kalikasan.’
- source_word: ποιοῦντες
  choice: sinusunod
  rationale: Natural na Tagalog para sa aktuwal at patuloy na pagsasagawa ng mga nais; hindi lamang ito naglalarawan ng pag-iisip kundi ng pagkilos ayon sa mga iyon.
- source_word: θελήματα
  choice: mga nais
  rationale: Pinananatiling naiiba sa naunang ‘mga pagnanasa’ at ipinahahayag ang mga layunin o kagustuhang isinasagawa.
- source_word: διανοιῶν
  choice: mga pag-iisip
  rationale: Pinananatili ang maramihang anyo at ang diwa ng mga takbo o disposisyon ng isip.
- source_word: τέκνα ὀργῆς
  choice: mga anak ng poot
  rationale: Pinananatili ang matalinghagang idyomang Griyego at hindi agad nilulutas kung ang diin ay nasa kalagayan, katangian, o pagiging saklaw ng hatol.
- source_word: φύσει
  choice: likas
  rationale: Pinananatili ang pinagtatalunang diwa ng kalikasang taglay nang hindi ito nililimitahan sa ‘mula sa kapanganakan.’
- source_word: οἱ λοιποί
  choice: ang iba
  rationale: Natural na Tagalog na tumutukoy sa nalalabing sangkatauhan sa paghahambing.
theological_decisions:
- issue: Kahulugan ng σάρξ sa kontekstong moral
  choice: laman
  alternative: makasalanang kalikasan
  rationale: May malinaw na puwersang moral ang salita rito, ngunit mas makitid at mas interpretatibo ang ‘makasalanang kalikasan.’ Pinananatili ng ‘laman’ ang salita at antropolohikal na tensiyon ni Pablo.
- issue: Puwersa ng τέκνα φύσει ὀργῆς
  choice: likas tayong mga anak ng poot
  alternative: likas tayong mga taong nararapat tumanggap ng poot
  rationale: Pinananatili ang idyoma at hindi ginagawang sistematikong pormula ang pahayag tungkol sa likas na kalagayan ng tao at sa poot o hatol.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘namuhay,’ ‘mga pagnanasa,’ at ‘mga nais’ upang maging natural, samantalang pinanatili ang ‘laman’ at ‘mga anak ng poot’ dahil mahalaga ang kanilang sadyang di-tiyak at teolohikal na puwersa.
