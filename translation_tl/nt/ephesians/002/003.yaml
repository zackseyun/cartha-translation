  to: Kasama nila[a], tayong lahat ay namuhay rin noon ayon sa mga pagnanasa ng ating laman[b], na isinasagawa ang mga kagustuhan ng laman at ng isipan[c]. At likas tayong mga anak ng poot[d], gaya rin ng iba.
  rationale: Pinalitan ang hindi likás na "mga nais ng laman at ng mga pag-iisip" ng "mga kagustuhan ng laman at ng isipan." Pinananatili nito ang intensiyonal na puwersa ng θελήματα, ang mas malawak na saklaw ng διανοιῶν, at ang pagkakaiba nito sa naunang ἐπιθυμίαις (“mga pagnanasa”). Nilinaw rin ang talababa sa alternatibong di-personal na pagbasa ng ἐν οἷς. Walang binagong kahulugan o teolohikal na paghatol.
