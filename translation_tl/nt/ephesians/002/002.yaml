    issue: Ang ‘kapangyarihan sa himpapawid’ ay maaaring mangahulugang kapangyarihang umiiral o kumikilos sa himpapawid.
    rationale: 'Ang Griyegong τῆς ἐξουσίας τοῦ ἀέρος ay sunod-sunod na genitibo: ‘ng kapangyarihan ng himpapawid.’ Ang paggamit ng ‘ng’ sa halip na ‘sa’ ay mas tapat sa estruktura at iniiwasan ang pagbago ng relasyon.'
  - severity: low
    issue: Ang panandang talababa c ay nakalagay pagkatapos ng pangungusap sa halip na kasunod ng ‘mga anak ng pagsuway.’
    rationale: Dapat nakadikit ang pananda sa salitang o pariralang ipinapaliwanag upang maging malinaw ang saklaw ng talababa.
