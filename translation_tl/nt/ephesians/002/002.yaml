revisions:
- from: Sa mga iyon kayo dating lumakad[a], ayon sa kapanahunan ng sanlibutang ito, ayon sa pinuno ng kapangyarihan sa himpapawid[b]—ang espiritung kumikilos ngayon sa mga anak ng pagsuway.[c]
  to: Sa mga iyon ay dating lumakad kayo[a], ayon sa kapanahunan ng sanlibutang ito, ayon sa pinuno ng kapangyarihan ng himpapawid[b]—ang espiritung kumikilos ngayon sa mga anak ng pagsuway[c].
  rationale: Inayos ang ‘sa himpapawid’ tungo sa ‘ng himpapawid’ upang maipakita ang genitibong parirala ng pinagmulan. Inayos din ang ayos ng unang sugnay para sa mas likas na daloy sa Filipino at inilapit ang talababa c sa idyomang tinutukoy nito. Walang idinagdag na doktrinal na pagpapakahulugan sa relasyon ng pinuno at ng espiritu.
