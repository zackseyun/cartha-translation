id: EPH.2.2
reference: Ephesians 2:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐν αἷς ποτε περιεπατήσατε κατὰ τὸν αἰῶνα τοῦ κόσμου τούτου, κατὰ τὸν ἄρχοντα τῆς ἐξουσίας τοῦ ἀέρος, τοῦ πνεύματος τοῦ νῦν ἐνεργοῦντος ἐν τοῖς υἱοῖς τῆς ἀπειθείας·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/002.yaml
  text: in which you once walked[a], according to the age of this world, according to the ruler of the authority of the air[c][b], the spirit now at work in the sons of disobedience.
translation:
  language: tl
  text: Sa mga iyon ay dating lumakad kayo[a], ayon sa kapanahunan ng sanlibutang ito, ayon sa pinuno ng kapangyarihan ng himpapawid[b]—ang espiritung kumikilos ngayon sa mga anak ng pagsuway[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “lumakad” ay talinghaga para sa paraan ng pamumuhay.
    reason: idiom_explanation
  - marker: b
    text: Ang “himpapawid” ay sumasalamin sa sinaunang pananalita tungkol sa dako na iniuugnay sa masasamang espirituwal na kapangyarihan.
    reason: cultural_note
  - marker: c
    text: Ang “mga anak ng pagsuway” ay idyomang nangangahulugang mga taong nailalarawan ng pagsuway.
    reason: idiom_explanation
lexical_decisions:
- source_word: ἐν αἷς
  choice: Sa mga iyon
  rationale: Tumutukoy pabalik sa mga pagsalangsang at kasalanan sa talata 1 at pinananatili ang pangmaramihang kaugnayan.
- source_word: ποτε περιεπατήσατε
  choice: kayo dating lumakad
  rationale: Pinananatili ang talinghaga ni Pablo tungkol sa dating paraan ng pamumuhay; nililinaw ito sa talababa.
- source_word: κατὰ τὸν αἰῶνα τοῦ κόσμου τούτου
  choice: ayon sa kapanahunan ng sanlibutang ito
  rationale: Ibinubukod ang temporal at panlipunang diwa ng αἰών (‘kapanahunan’) mula sa κόσμος (‘sanlibutan’), habang ipinapakita ng ‘ayon sa’ ang pakikiayon.
- source_word: τὸν ἄρχοντα τῆς ἐξουσίας τοῦ ἀέρος
  choice: ang pinuno ng kapangyarihan sa himpapawid
  rationale: Ang ‘pinuno’ ay malinaw at kasalukuyang salita para sa ἄρχων; pinananatili ng ‘kapangyarihan’ at ‘himpapawid’ ang genitibong parirala nang hindi labis na ipinapaliwanag ang sinaunang kosmolohiya.
- source_word: τοῦ πνεύματος τοῦ νῦν ἐνεργοῦντος
  choice: ang espiritung kumikilos ngayon
  rationale: Maliit na titik ang ‘espiritu’ dahil masamang espirituwal na kapangyarihan ang tinutukoy, hindi ang Banal na Espiritu; ipinahahayag ng ‘kumikilos ngayon’ ang nagpapatuloy na gawain.
- source_word: ἐν τοῖς υἱοῖς τῆς ἀπειθείας
  choice: sa mga anak ng pagsuway
  rationale: Pinananatili ang Semitikong idyoma at ang abstraktong pangngalang ‘pagsuway,’ sa halip na gawing simpleng ‘mga masuwayin.’
theological_decisions:
- issue: Kaugnayan ng ‘espiritung kumikilos ngayon’ sa ‘pinuno ng kapangyarihan sa himpapawid’
  choice: Ginamit ang gatlang upang ipakitang ang ‘espiritu’ ay karagdagang paglalarawan sa naunang masamang kapangyarihan.
  alternative: Maaaring unawain ang ‘espiritu’ bilang mismong isa pang tawag sa pinuno o bilang isang espirituwal na puwersang nasa ilalim niya.
  rationale: Pinahihintulutan ng magkakaugnay na genitibo at mga pantukoy sa Griyego ang apposition, ngunit hindi tiyak na nilulutas ng teksto ang eksaktong ontolohikal na relasyon.
- issue: Saklaw ng υἱοῖς τῆς ἀπειθείας
  choice: mga anak ng pagsuway
  alternative: mga taong masuwayin
  rationale: Pinananatili nito ang orihinal na idyoma nang hindi ipinahihiwatig na mga literal na anak o mga lalaki lamang ang tinutukoy; ipinapaliwanag ang kahulugan sa talababa.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang mga susing talinghaga at idyoma ng Griyego, na may maiikling talababa upang maiwasan ang malabong pagbasa. Ginamit ang ‘sanlibutan’ upang maipakitang naiiba ito sa ‘kapanahunan,’ at ang ‘himpapawid’ bilang mas dignified at kontekstuwal na katumbas ng ἀήρ.
