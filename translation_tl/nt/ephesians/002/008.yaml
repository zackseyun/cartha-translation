base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/008.yaml
  text: For by grace you have been saved through faith[a], and this is not from yourselves[b]; it is the gift of God.
translation:
  language: tl
  text: Sapagkat sa biyaya ay naligtas na kayo sa pamamagitan ng pananampalataya, at ito ay hindi nagmula sa inyo[a]; ito ay kaloob ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Malamang na ang “ito” ay tumutukoy sa buong katotohanang binanggit—ang pagliligtas sa biyaya sa pamamagitan ng pananampalataya—sa halip na sa “pananampalataya” lamang.
    reason: alternative_reading
lexical_decisions:
- source_word: χάριτί
  choice: biyaya
  rationale: Karaniwang katumbas ng χάρις sa makabagong wikang teolohikal at malinaw na nagpapahayag ng mapagkaloob na kagandahang-loob ng Diyos nang hindi ito pinalalawak sa paliwanag.
- source_word: ἐστε σεσῳσμένοι
  choice: iniligtas kayo
  rationale: Ang periphrastic perfect ay tumutukoy sa naganap nang pagliligtas na may nananatiling bunga. Natural sa Tagalog ang anyong ito sa konteksto; ang kasalukuyang kalagayan ay mahihinuha sa pangungusap.
- source_word: διὰ πίστεως
  choice: sa pamamagitan ng pananampalataya
  rationale: Tumpak na inilalahad ng “sa pamamagitan ng” ang διά na may genitive bilang paraan o kasangkapan. Ang “pananampalataya” ang natural at kinikilalang katumbas ng πίστις dito.
- source_word: τοῦτο
  choice: ito
  rationale: Pinananatili ng “ito” ang kaiklian at tunay na lawak ng reperensiya ng neuter demonstrative, na malamang na tumutukoy sa buong naunang katotohanan ng pagliligtas dahil sa biyaya sa pamamagitan ng pananampalataya.
- source_word: οὐκ ἐξ ὑμῶν
  choice: hindi nagmula sa inyo
  rationale: Malinaw at natural nitong ipinapahayag ang pinagmulan na tinutukoy ng ἐκ, nang hindi ipinahihiwatig na ang pananampalataya lamang ang tiyak na paksa.
- source_word: θεοῦ τὸ δῶρον
  choice: ito ay kaloob ng Diyos
  rationale: Ang idinagdag na “ito ay” ay kailangan para sa natural na Tagalog at ipinakikilalang ang naunang katotohanan ay kaloob na mula sa Diyos.
theological_decisions:
- issue: Ang tinutukoy ng τοῦτο (“ito”) kaugnay ng biyaya, pananampalataya, at pagliligtas
  choice: Ang “ito” ay malamang na tumutukoy sa buong naunang katotohanan ng pagliligtas dahil sa biyaya sa pamamagitan ng pananampalataya.
  alternative: Maaaring unawain ang “ito” bilang tiyak na pagtukoy sa pananampalataya bilang kaloob ng Diyos, o sa biyaya lamang.
  rationale: Neuter ang τοῦτο, samantalang feminine ang χάρις at πίστις, kaya mas natural na ang buong sugnay o kaisipan ang tinutukoy. Gayunman, hindi ginagawang tahasang paliwanag ng pangunahing teksto ang reperensiya upang mapanatili ang kaiklian at tensiyon ng Griyego.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “biyaya,” “pananampalataya,” at “kaloob” bilang pamilyar ngunit hindi labis na teknikal na mga salitang biblikal. Iniwasan ang paglalagay ng denominasyonal na pagpapakahulugan sa reperensiya ng “ito.”
