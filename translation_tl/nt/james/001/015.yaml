  text: εἶτα ἡ ἐπιθυμία συλλαβοῦσα τίκτει ἁμαρτίαν, ἡ δὲ ἁμαρτία ἀποτελεσθεῖσα ἀποκύει θάνατον.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/015.yaml
  text: Then desire[a], after it has conceived, gives birth to sin; and sin, when it is fully grown[b], brings forth death.
translation:
  language: tl
  text: Pagkatapos, ang pagnanasa, kapag naglihi na[a], ay nagsisilang ng kasalanan; at ang kasalanan, kapag ganap nang nahinog[b], ay nagsisilang ng kamatayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “matapos maglihi.” Mahigpit na iniuugnay ng anyong Griyego ang larawan ng paglilihi sa pagnanasa.
    reason: lexical_alternative
  - marker: b
    text: O “kapag ganap na” o “kapag umabot na sa ganap na kalagayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα
  choice: Pagkatapos
  rationale: Malinaw na ipinakikita ang kasunod na yugto sa daloy mula sa tukso tungo sa kamatayan.
- source_word: ἐπιθυμία
  choice: masamang pagnanasa
  rationale: Sa konteksto, tumutukoy ito sa pagnanasang humihila at umaakit sa tao (tal. 14). Nililinaw ng “masama” ang negatibong diwa nang hindi ito nililimitahan sa seksuwal na pagnanasa.
- source_word: συλλαβοῦσα
  choice: kapag naglihi na
  rationale: Pinananatili ang larawan ng paglilihi at ang pagkilos na nauuna sa pagsisilang; likas din ito sa modernong Tagalog.
- source_word: τίκτει
  choice: nagsisilang
  rationale: Tuwirang pinananatili ang metapora ng panganganak.
- source_word: ἁμαρτίαν
  choice: kasalanan
  rationale: Karaniwan at eksaktong katumbas sa kontekstong moral.
- source_word: δὲ
  choice: at
  rationale: Nagpapatuloy ito sa sunod-sunod na paglalarawan sa halip na maglahad ng matinding pagsalungat.
- source_word: ἀποτελεσθεῖσα
  choice: kapag ganap nang nahinog
  rationale: Ipinahahayag ang pag-abot sa ganap na kalagayan o kaganapan habang nananatiling angkop sa organikong larawan ng talata.
- source_word: ἀποκύει
  choice: nagsisilang
  rationale: Pinananatili ang muling paggamit ng metapora ng panganganak na nasa Griyego; natural ang pag-uulit sa Tagalog at pinatitibay nito ang ugnayan ng dalawang sugnay.
- source_word: θάνατον
  choice: kamatayan
  rationale: Tuwiran at hindi tinutukoy kung pisikal, espirituwal, o walang hanggang kamatayan, gaya ng pagiging di-tiyak ng Griyego.
theological_decisions:
- issue: Ang metaporang nag-uugnay sa pagnanasa, kasalanan, at kamatayan
  choice: Panatilihin ang personipikadong larawan ng paglilihi at pagsisilang.
  alternative: Sabihing ang pagnanasa ay humahantong sa kasalanan at ang kasalanan ay humahantong sa kamatayan.
  rationale: Ang payak na pagpapahayag ng sanhi at bunga ay magpapahina sa matingkad at sadyang metaporikal na paglalarawan ng orihinal.
- issue: Kahulugan ng θάνατος
  choice: Isalin lamang bilang “kamatayan.”
  alternative: “Espirituwal na kamatayan” o “walang hanggang kamatayan.”
  rationale: Hindi nililinaw ng Griyego ang uri o saklaw ng kamatayan, kaya hindi ito dapat paliitin sa isang tiyak na doktrinal na pakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “masamang pagnanasa” upang malinaw ang negatibong diwa sa konteksto at maiwasan ang sobrang makitid na seksuwal na pakahulugan ng “libog.” Pinanatili ang magkakaugnay na larawan ng paglilihi, pagsisilang, at paghinog.
