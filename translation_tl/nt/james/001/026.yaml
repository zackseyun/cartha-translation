  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Εἴ τις δοκεῖ θρησκὸς ⸀εἶναι μὴ χαλιναγωγῶν γλῶσσαν ⸀αὐτοῦ ἀλλὰ ἀπατῶν καρδίαν ⸀αὐτοῦ, τούτου μάταιος ἡ θρησκεία.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/026.yaml
  text: If anyone thinks he is religious while not bridling his tongue but deceiving his heart[c][b][a], this person's religion is worthless.
translation:
  language: tl
  text: Kung inaakala ng sinuman na siya ay relihiyoso[a] ngunit hindi niya pinipigil ang kanyang dila[b], sa halip ay dinadaya niya ang kanyang puso, walang kabuluhan[c] ang relihiyon ng taong iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “waring relihiyoso.”
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “nilalagyan ng renda ang kanyang dila,” na pinananatili ang larawan ng rendang ginagamit upang supilin at patnubayan ang isang hayop.
    reason: lexical_alternative
  - marker: c
    text: O “walang saysay,” “walang pakinabang,” o “hungkag.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκεῖ
  choice: inaakala
  rationale: Ipinapahayag nito ang sariling pagtataya ng tao sa kanyang pagiging relihiyoso; pinananatili rin sa talababa ang maaaring diwang ‘waring.’
- source_word: θρησκὸς
  choice: relihiyoso
  rationale: Likas at tuwirang pang-uring katumbas na tumutukoy sa inaangking pagkakakilanlan o pagsasagawa ng relihiyon.
- source_word: χαλιναγωγῶν
  choice: nilalagyan ng renda
  rationale: Pinananatili ang kongkretong larawan ng pagkontrol sa hayop sa pamamagitan ng renda, na muling ginagamit sa Santiago 3:2–3.
- source_word: γλῶσσαν αὐτοῦ
  choice: ang kanyang dila
  rationale: Pinananatili ang literal na ‘dila’ at ang metapora nito para sa pananalita.
- source_word: ἀπατῶν καρδίαν αὐτοῦ
  choice: dinadaya lamang ang kanyang puso
  rationale: Pinananatili ang ‘puso’ bilang panloob na pagkatao at ang diwa ng panlilinlang sa sarili; ang ‘lamang’ ay likas na nag-uugnay sa kaibahan ng ἀλλά.
- source_word: μάταιος
  choice: walang kabuluhan
  rationale: Malinaw na ipinahahayag ang pagiging hungkag, walang saysay, o walang pakinabang ng gayong relihiyon.
- source_word: ἡ θρησκεία
  choice: ang kanyang relihiyon
  rationale: Tuwirang katumbas ito at pinananatili ang leksikal na ugnayan sa ‘relihiyoso’; ipinahihiwatig ng konteksto ang isinasagawang relihiyon ng taong tinutukoy.
theological_decisions:
- issue: Pangkalahatang pagtukoy na may panlalaking isahan sa Griyego
  choice: Kung inaakala ng sinuman na siya ... ang kanyang
  alternative: Kung inaakala ng sinuman na relihiyoso sila ... ang kanilang
  rationale: Ang ‘sinuman’ ay malinaw na pangkalahatan, samantalang ang ‘siya/kanyang’ ay natural sa Tagalog at nagpapanatili sa isahang konstruksiyon nang hindi nililimitahan ang saklaw sa mga lalaki.
- issue: Saklaw ng θρησκεία/θρησκός
  choice: relihiyoso / relihiyon
  alternative: debotong tao / debosyon; masikap sa pagsamba / pagsamba
  rationale: Pinananatili ng mga salitang ito ang ugnayang leksikal at hindi nililimitahan ang teksto sa isang denominasyon, partikular na ritwal, o panloob na debosyon lamang.
- issue: Likas na puwesto ng τούτου
  choice: walang kabuluhan ang kanyang relihiyon
  alternative: ang relihiyon ng taong ito ay walang kabuluhan
  rationale: Ang panghalip na ‘kanyang’ ay malinaw na tumutukoy sa taong inilarawan at mas natural sa modernong Tagalog, bagaman hindi nito gaanong itinatampok ang demonstratibong diin ng τούτου.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal ngunit madaling maunawaang himig. Pinanatili ang metapora ng renda at ang mga kongkretong salitang ‘dila’ at ‘puso.’ Inilagay ang lahat ng pananda ng talababa sa mismong teksto.
