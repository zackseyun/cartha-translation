translation:
  language: tl
  text: Ituring ninyong lubos na kagalakan, mga kapatid ko,[a] sa tuwing nahaharap kayo sa sari-saring pagsubok.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Panlalaki ang anyo ng salitang Griyego, ngunit malamang na kinakausap nito ang buong komunidad ng mga mananampalataya, kapwa lalaki at babae. Likas na maaaring saklawin ng “mga kapatid” sa Tagalog ang dalawa.
    reason: alternative_reading
  - marker: b
    text: Ang salitang Griyego ay maaaring mangahulugang “mga pagsubok,” “mga paglalagay sa pagsubok,” o, sa ilang konteksto, “mga tukso.” Dito, pinakamalamang na tumutukoy ito sa mga paghihirap na sumusubok sa pananampalataya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶσαν χαρὰν
  choice: pawang kagalakan
  rationale: Ipinahahayag ng pariralang ito na dapat ituring na kagalakan ang kabuuan ng karanasan. Pinananatili ng “pawang kagalakan” ang diin ng πᾶσαν nang hindi ito malayang binibigyang-kahulugan bilang masidhing damdamin lamang.
- source_word: ἡγήσασθε
  choice: Ituring ninyo
  rationale: Ang aorist middle imperative plural ay nag-uutos ng sinadyang pagtataya o pagtingin. Likas at malinaw sa modernong Tagalog ang “ituring ninyo” at napapanatili nito ang lakas ng pautos.
- source_word: ἀδελφοί μου
  choice: mga kapatid ko
  rationale: Bagaman panlalaki ang anyong Griyego, ang “mga kapatid” sa Tagalog ay likas na maaaring tumukoy sa mga lalaki at babae at angkop sa pagtawag sa buong komunidad ng mga mananampalataya.
- source_word: ὅταν
  choice: tuwing
  rationale: Kasama ng subjunctive na περιπέσητε, nagpapahayag ito ng di-tiyak o maaaring maulit na panahon. Mas malinaw na naipakikita ng “tuwing” ang kahulugang “whenever” kaysa sa payak na “kapag.”
- source_word: πειρασμοῖς
  choice: mga pagsubok
  rationale: Sa konteksto ng talata, tumutukoy ito sa mga paghihirap na sumusubok sa pananampalataya, hindi pangunahin sa pang-aakit na magkasala. Gayunman, maaaring taglayin ng salitang Griyego ang dalawang kahulugan ayon sa konteksto.
- source_word: περιπέσητε
  choice: mapaharap kayo
  rationale: Ang pandiwa ay literal na maaaring mangahulugang mahulog o mapasangkot sa isang kalagayan. Ang “mapaharap kayo” ay natural sa modernong Tagalog at pinananatili ang di-sinasadyang pagdating sa mga pagsubok.
- source_word: ποικίλοις
  choice: sari-saring
  rationale: Tumutukoy ang pang-uri sa pagkakaiba-iba ng uri. Ang “sari-saring” ay maikli, natural, at tumpak.
theological_decisions:
- issue: Saklaw ng ἀδελφοί bilang pantawag sa komunidad
  choice: Gamitin ang “mga kapatid ko,” na likas na inklusibo sa Tagalog.
  alternative: mga kapatid kong lalaki at babae
  rationale: Panlalaki ang gramatikal na anyo sa Griyego, ngunit malamang na ang buong nananampalatayang komunidad ang tinutukoy. Hindi kailangang dagdagan ng “lalaki at babae” ang pangunahing teksto sapagkat hindi nakatali sa kasarian ang karaniwang salitang Tagalog na “kapatid”; nililinaw sa talababa ang anyong pinagmulan.
- issue: Kahulugan ng πειρασμοῖς sa konteksto
  choice: mga pagsubok
  alternative: mga tukso; mga paglalagay sa pagsubok
  rationale: Ang kasunod na pagbanggit sa pagsubok ng pananampalataya sa Santiago 1:3 ay pumapabor sa panlabas na mga paghihirap na sumusubok sa pananampalataya. Pinananatili sa talababa ang mas malawak na saklaw ng salitang Griyego upang hindi burahin ang leksikal na tensiyon sa kabanata.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “pawang kagalakan” upang mapanatili ang mariing saklaw ng πᾶσαν, at “mapaharap” upang maging natural nang hindi ginagawang kusang hinahanap ng mga mambabasa ang pagsubok.
