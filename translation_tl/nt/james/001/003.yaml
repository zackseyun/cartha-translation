id: JAS.1.3
reference: James 1:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: γινώσκοντες ὅτι τὸ δοκίμιον ὑμῶν τῆς πίστεως κατεργάζεται ὑπομονήν·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/003.yaml
  text: because you know that the testing of your faith produces endurance[a][b].
translation:
  language: tl
  text: sapagkat alam ninyo na ang pagsubok sa inyong pananampalataya ay nagbubunga ng pagtitiis[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang napatunayang pagiging tunay ng inyong pananampalataya.” Maaaring tumukoy ang salitang Griyego sa proseso ng pagsubok o sa katangiang napatunayang tunay sa pamamagitan nito.
    reason: lexical_alternative
  - marker: b
    text: O “katatagan” o “pagtitiyaga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γινώσκοντες
  choice: sapagkat alam ninyo
  rationale: 'Ang pangkasalukuyang aktibong participle na ito ay kaugnay ng konteksto ng utos sa talata 2 at likas na nagpapahayag ng dahilan: magagalak sila sa mga pagsubok sapagkat alam nila ang ibinubunga ng mga ito.'
- source_word: ὅτι
  choice: na
  rationale: Ipinakikilala nito ang nilalaman ng nalalaman ng mga mambabasa; sa Filipino, ang “na” ang natural na pang-ugnay matapos ang “alam ninyo.”
- source_word: τὸ δοκίμιον
  choice: ang pagsubok
  rationale: Maaaring tumukoy ang δοκίμιον sa proseso ng pagsubok o sa napatunayang tunay na katangian. Ang “pagsubok” ang pinakanatural sa agarang konteksto, habang pinananatili sa talababa ang tunay na leksikal na alternatibo.
- source_word: ὑμῶν τῆς πίστεως
  choice: sa inyong pananampalataya
  rationale: Tumutukoy ang parirala sa pananampalataya ng mga mambabasa bilang sinusubok. Natural sa Filipino ang “pagsubok sa inyong pananampalataya.”
- source_word: κατεργάζεται
  choice: nagbubunga
  rationale: Ipinahahayag ng pandiwa na ang pagsubok ay nagdudulot o lumilikha ng isang resulta. Malinaw at natural ang “nagbubunga” sa Filipino.
- source_word: ὑπομονήν
  choice: pagtitiis
  rationale: Ipinahahayag ng ὑπομονή ang matatag na pananatili sa gitna ng hirap. Karaniwan at madaling maunawaan ang “pagtitiis,” habang inilalahad sa talababa ang “katatagan” at “pagtitiyaga.”
theological_decisions:
- issue: Pagbibigay-kahulugan sa πίστις
  choice: pananampalataya
  alternative: pagtitiwala; katapatan
  rationale: Sa kontekstong ito, ang sinusubok ay ang pananampalataya ng mga mambabasa. Ang “pananampalataya” ang malinaw at karaniwang salin, at walang sapat na dahilan sa talata upang piliin ang “katapatan.”
- issue: Ambiguwidad ng δοκίμιον
  choice: proseso ng pagsubok
  alternative: napatunayang pagiging tunay
  rationale: Mas umaangkop sa daloy mula sa mga pagsubok sa talata 2 patungo sa ibinubungang pagtitiis ang kahulugang proseso. Gayunman, tunay sa Griyego ang resultang kahulugan, kaya pinanatili ito sa talababa sa halip na tahimik na alisin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sapagkat” upang malinaw na iugnay ang talata sa dahilan ng utos sa naunang konteksto; pinanatili ang mga leksikal na ambiguwidad sa mga talababa.
