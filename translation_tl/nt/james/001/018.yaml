  text: βουληθεὶς ἀπεκύησεν ἡμᾶς λόγῳ ἀληθείας, εἰς τὸ εἶναι ἡμᾶς ἀπαρχήν τινα τῶν αὐτοῦ κτισμάτων.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/018.yaml
  text: Having willed it[a], he gave birth to us by the word of truth[b], so that we might be a kind of firstfruits of his creatures.
translation:
  language: tl
  text: Sa sarili niyang kalooban[a], isinilang niya tayo sa pamamagitan ng salita ng katotohanan, upang tayo ay maging isang uri ng unang bunga[b] sa mga nilalang niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “Dahil niloob niya ito, isinilang niya tayo sa pamamagitan ng salita ng katotohanan.”'
    reason: alternative_reading
  - marker: b
    text: Ang “unang bunga” ay tumutukoy sa una at nakatalagang bahagi ng ani na inihahandog sa Diyos. Dito, inilalarawan nito ang mga mananampalataya bilang una at itinalagang bahagi sa mga nilikha ng Diyos.
    reason: cultural_note
lexical_decisions:
- source_word: βουληθεὶς
  choice: Dahil niloob niya ito
  rationale: Ipinahahayag nito ang malamang na sanhi o batayan ng pangunahing kilos at pinananatili ang pagkukusa ng Diyos nang hindi nagdaragdag ng isang tiyak na sistemang doktrinal.
- source_word: ἀπεκύησεν
  choice: isinilang niya tayo
  rationale: Pinananatili ang larawan ng panganganak at ang ugnay nito sa Santiago 1:15, ngunit mas natural at hindi labis na nakatali sa kasarian kaysa sa literal na “ipinanganak niya tayo.”
- source_word: λόγῳ ἀληθείας
  choice: sa pamamagitan ng salita ng katotohanan
  rationale: Ipinakikita ng pariralang “sa pamamagitan ng” ang instrumental na gamit ng datibo; pinananatili ng “salita ng katotohanan” ang pamilyar na biblikal na pahayag at ang posibleng pagtukoy sa mensahe ng ebanghelyo.
- source_word: εἰς τὸ εἶναι ἡμᾶς
  choice: upang tayo ay maging
  rationale: Natural na ipinahahayag ang layunin o bunga nang hindi pinipili nang labis ang isa sa dalawang magkaugnay na diwa.
- source_word: ἀπαρχήν
  choice: unang bunga
  rationale: Pinananatili ang larawang pang-ani at panghandog ng unang bahagi na inilalaan sa Diyos.
- source_word: τινα
  choice: isang uri ng
  rationale: 'Isinasalin ang pagpapalambot o pagkakwalipika ng τινα: ang mga mananampalataya ay unang bunga sa isang kinatawang diwa.'
- source_word: τῶν αὐτοῦ κτισμάτων
  choice: sa mga nilalang niya
  rationale: Pinananatili ang maramihan at malawak na saklaw ng κτίσματα, sa halip na paliitin ito sa sangkatauhan lamang.
theological_decisions:
- issue: Pagkukusa ng Diyos sa bagong kapanganakan
  choice: Inilalahad ang kalooban ng Diyos bilang batayan ng pagsilang sa pamamagitan ng salita.
  alternative: “Sa sarili niyang kalooban, isinilang niya tayo” o isang mas tahasang pagpapakahulugan tungkol sa regenerasyon at predestinasyon.
  rationale: Malinaw sa Griyego na nauuna ang pagkukusa ng Diyos, ngunit hindi inilalahad ng talata ang isang buong sistemang teolohikal; kaya pinananatili ang diin nang walang dagdag na doktrinal na pagpapasiya.
- issue: Saklaw ng κτισμάτων
  choice: “mga nilalang niya”
  alternative: “buong sangnilikha niya” o “mga taong nilikha niya”
  rationale: Hinahayaan nitong manatiling malawak ang sanggunian sa mga nilikha ng Diyos at hindi ito nililimitahan sa mga tao lamang.
- issue: Larawan ng pagsilang
  choice: “isinilang niya tayo”
  alternative: “iniluwal niya tayo” o “binigyan niya tayo ng bagong kapanganakan”
  rationale: Pinananatili ang matapang na metapora ng teksto at ang alingawngaw nito sa talata 15, habang iniiwasan ang pagpapaliwanag na wala mismo sa Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mga biblikal na larawang “pagsilang,” “salita ng katotohanan,” at “unang bunga,” na may talababa para sa kailangang paliwanag.
