id: JAS.1.10
reference: James 1:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ πλούσιος ἐν τῇ ταπεινώσει αὐτοῦ, ὅτι ὡς ἄνθος χόρτου παρελεύσεται.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/010.yaml
  text: and the rich man in his humiliation[b][a], because like a flower of grass he will pass away.
translation:
  language: tl
  text: at ang mayaman naman sa kanyang pagkakababa[a], sapagkat lilipas siyang gaya ng bulaklak ng damo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, kung pupunan ang ipinahihiwatig na pandiwa mula sa naunang talata: “ngunit magmapuri ang mayaman sa kanyang pagkakababa.”'
    reason: alternative_reading
  - marker: b
    text: Ang “bulaklak ng damo” ay literal na larawan sa Griyego at nagdiriin kung gaano kabilis lumilipas ang mayaman, gaya ng halamang namumulaklak ngunit madaling nalalanta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ πλούσιος
  choice: at ang mayaman naman
  rationale: Ipinag-uugnay ng δέ ang talatang ito sa naunang pangungusap habang ipinakikita ng “naman” ang pagtutulad at pagkakaiba ng dukha at mayaman. Likas sa Tagalog ang substantibong “ang mayaman” para sa isang taong mayaman; hindi kailangang dagdagan ng salitang “lalaki,” yamang walang kasariang gramatikal ang Tagalog at hindi kasarian ang diin ng konteksto.
- source_word: ἐν τῇ ταπεινώσει αὐτοῦ
  choice: sa kanyang pagkakababa
  rationale: Saklaw ng “pagkakababa” ang pagbaba ng kalagayan at ang karanasang maibaba, nang hindi nililimitahan ang diwa sa kusang pagpapakumbaba o sa damdamin lamang ng pagkapahiya.
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw at marangal na ipinahahayag ng “sapagkat” ang sanhi o dahilan na ipinakikilala ng ὅτι.
- source_word: ὡς ἄνθος χόρτου
  choice: gaya ng bulaklak ng damo
  rationale: Pinananatili nito ang tahasang larawan at ugnayang genitibo ng Griyego. Bagaman di-karaniwan nang kaunti sa Tagalog, hindi nito idinaragdag ang “parang” o “bukid,” na wala sa teksto.
- source_word: παρελεύσεται
  choice: lilipas siya
  rationale: Ang “lilipas” ay natural na Tagalog para sa pagiging panandalian at paglalaho ng buhay o katayuan, at higit na angkop dito kaysa sa literal na kilos na “daraan.”
theological_decisions:
- issue: Pagkakaltas ng pandiwa mula sa naunang talata
  choice: Hindi idinagdag sa pangunahing teksto ang ipinahihiwatig na “magmapuri,” kaya nananatili ang sintaktikong pagkakabit sa talata 9.
  alternative: “ngunit magmapuri ang mayaman sa kanyang pagkakababa”
  rationale: Walang nakasulat na pandiwa sa talata 10; kinukuha ito mula sa talata 9. Pinananatili ng pangunahing salin ang tunay na ellipsis, samantalang ipinapaliwanag sa talababa ang kahulugang maaaring punan.
- issue: Kahulugan ng ταπείνωσις para sa mayaman
  choice: Pagkababa o pagiging ibinaba sa kalagayan
  alternative: Kusang pagpapakumbaba o pangkalahatang mababang katayuan sa lipunan
  rationale: Ang kasunod na dahilan—lilipas siyang gaya ng bulaklak ng damo—ay nagtuturo sa pagiging panandalian ng kanyang buhay at katayuan. Hindi ginagawang tiyak ng salin kung paano nagaganap ang pagkakabang ito.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Pinanatili ang ellipsis ng Griyego at ang medyo di-karaniwang larawang “bulaklak ng damo” upang manatiling nasusuri laban sa pinagmulan; ginagamit ang “naman” upang maging natural ang paralelismo sa naunang talata.
