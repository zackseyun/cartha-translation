  text: ἡ δὲ ὑπομονὴ ἔργον τέλειον ἐχέτω, ἵνα ἦτε τέλειοι καὶ ὁλόκληροι, ἐν μηδενὶ λειπόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/004.yaml
  text: And let endurance have its perfect work[a], so that you may be mature and complete, lacking in nothing.
translation:
  language: tl
  text: At hayaang ganapin nang lubos ng pagtitiis ang gawain nito[a], upang kayo ay maging may-gulang at buo, na hindi nagkukulang sa anuman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “hayaang ganapin ng pagtitiis ang ganap nitong gawain.” Magkaugnay ang mga salitang Griyego para sa “ganapin nang lubos” at “may-gulang”; kapuwa itong tumutukoy sa pag-abot sa nilalayong kaganapan. Ang “buo” naman ay tumutukoy sa pagiging ganap sa bawat bahagi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομονὴ
  choice: pagtitiis
  rationale: Tumutukoy ito sa matatag na pananatili sa gitna ng pagsubok, hindi lamang sa pasibong paghihintay. Karaniwan at likas sa modernong Tagalog ang “pagtitiis” sa kontekstong ito.
- source_word: ἔργον τέλειον ἐχέτω
  choice: hayaan ninyong lubusin ... ang gawain nito
  rationale: Pinananatili ang utos at ang larawan ng pagtitiis na nagsasagawa ng gawain hanggang sa nilalayong kaganapan. Mas natural ito sa Tagalog kaysa sa literal na “magkaroon ng ganap na gawain.”
- source_word: ἵνα ἦτε
  choice: upang kayo ay maging
  rationale: Malinaw na ipinahahayag ang layunin o bunga ng naunang utos.
- source_word: τέλειοι
  choice: may-gulang
  rationale: Sa paglalarawan sa mga tao, maaaring tumukoy ang salita sa pag-abot sa nilalayong espirituwal na kahustuhan o maturity, nang hindi ipinapalagay ang ganap na kawalan ng kasalanan.
- source_word: ὁλόκληροι
  choice: buo
  rationale: Ipinahahayag ang pagiging ganap sa lahat ng bahagi at pinananatiling naiiba sa “may-gulang.”
- source_word: ἐν μηδενὶ λειπόμενοι
  choice: na walang anumang pagkukulang
  rationale: Likas na Tagalog na nagpapanatili sa malawak na diwang hindi nagkukulang sa anumang bagay o bahagi.
- source_word: δὲ
  choice: At
  rationale: Ipinagpapatuloy nito ang pangangatwiran mula sa naunang talata sa halip na magpahayag ng matinding pagsalungat.
theological_decisions:
- issue: Kahulugan ng τέλειοι sa konteksto ng paglago sa pananampalataya
  choice: may-gulang
  alternative: ganap
  rationale: Ang “may-gulang” ay nagpapahayag ng pag-abot sa nilalayong kahustuhan at hindi tahimik na nagpapasya na ang talata ay nagtuturo ng ganap na kawalan ng kasalanan. Ang kaugnayan nito sa kaganapan ay nananatiling makikita sa footnote.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “hayaan ninyong” upang maging natural ang pangatlong-panauhang pautos sa kausap na maramihan, at pinanatili ang pagkakaiba ng “may-gulang” at “buo.”
