  source_fidelity: 'Tumpak na naipapahayag ng draft ang estruktura at kahulugan ng Griyego: si Santiago ay alipin ng Diyos at ng Panginoong Jesus na Mesiyas, at ang liham ay para sa labindalawang lipi sa diaspora. Ang “alipin” ay angkop para sa δοῦλος, at ang “Mesiyas” ay wastong nagsasalin ng Χριστός bilang titulo.'
  naturalness: Kailangan ng ilang maliit ngunit makabuluhang pagpapakinis para sa makabago at likas na Filipino. Ang “Pangangalat” ay hindi gaanong karaniwang teknikal na katawagan sa kasalukuyang Filipino at maaaring magmukhang pangalan ng isang pangyayari kaysa kalagayan o pangkat. Ang “Diaspora” ay malaganap at malinaw sa modernong gamit. Mas idiomatiko rin ang pambungad na “Pagbati” kaysa “Mga pagbati.”
  terminology: Pinananatili ang “Santiago,” “Diyos,” “Panginoon,” “Mesiyas,” “alipin,” at “labindalawang lipi.” Ang “Diaspora” ay ginagamit bilang teknikal na katawagang katumbas ng διασπορά, nang hindi ipinipilit sa mismong teksto ang isang partikular na pagpapakahulugan sa saklaw ng mga tagatanggap.
  issues:
  - severity: medium
    issue: Hindi gaanong likas o malinaw ang “Pangangalat” bilang teknikal na pangalan.
    rationale: Bagaman nauunawaan mula sa ugat na “kalat,” hindi ito ang karaniwang modernong Filipino na katumbas ng diaspora. Ang “Diaspora” ay mas kinikilalang katawagang pangkasaysayan at pang-Biblia at mas malinaw na tumutukoy sa kalagayan ng pagkakakalat.
  - severity: low
    issue: “Mga pagbati” ay hindi ang pinakalikas na katumbas ng epistolaryong χαίρειν.
    rationale: Ang “Pagbati” ay mas karaniwan at maikli bilang pormula sa pambungad ng liham, habang nananatiling tapat sa gamit ng χαίρειν bilang pagbati, hindi utos na magalak.
  - severity: low
    issue: Hindi magkatugma ang anyo ng alternatibong pangalan sa talababa c.
    rationale: Ang “Jesu-Cristo” ay hindi ang pinakanatural na modernong Filipino na anyo; “Jesus Cristo” ang mas malinaw na alternatibong anyo sa tabi ng pangunahing “Jesus na Mesiyas.”
