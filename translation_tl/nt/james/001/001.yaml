reference: James 1:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἰάκωβος θεοῦ καὶ κυρίου Ἰησοῦ Χριστοῦ δοῦλος ταῖς δώδεκα φυλαῖς ταῖς ἐν τῇ διασπορᾷ χαίρειν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/001.yaml
  text: 'James[a], a servant of God and of the Lord Jesus the Messiah[c][b], to the twelve tribes in the Dispersion: greetings.'
translation:
  language: tl
  text: 'Si Santiago[a], na alipin[b] ng Diyos at ng Panginoong Jesus na Mesiyas[c], sa labindalawang liping nasa Diaspora[d]: Pagbati.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Griyegong Ἰάκωβος ay katumbas ng Jacob o Jacobo; “Santiago” ang nakaugaliang pangalang Filipino para sa may-akda ng liham na ito.
    reason: name_equivalence
  - marker: b
    text: O “lingkod.” Ang Griyegong δοῦλος ay tumutukoy sa taong pag-aari ng isang panginoon; pinili rito ang “alipin” upang mapanatili ang mas matinding diwa nito.
    reason: lexical_alternative
  - marker: c
    text: O “Jesus Cristo.” Ang titulong Griyego na Χριστός ay maaaring isaling “Mesiyas” o, sa gamit na higit na parang pangalan, “Cristo.”
    reason: alternative_rendering
  - marker: d
    text: Ang “Diaspora” ay katawagan sa mga Judiong naninirahan sa labas ng lupain ng Israel.
    reason: cultural_note
lexical_decisions:
- source_word: Ἰάκωβος
  choice: Santiago
  rationale: Ginamit ang nakaugaliang pangalang Filipino para sa may-akda ng liham. Ang anyong Griyego ay tumutugma sa pangalang Jacob/Jacobo, kaya nilinaw ito sa talababa.
- source_word: θεοῦ
  choice: Diyos
  rationale: Tuwirang genitibong nagpapahayag kung kanino nabibilang at naglilingkod si Santiago.
- source_word: κυρίου
  choice: Panginoon
  rationale: Pinananatili ang kinikilalang titulo ng kapamahalaan ni Jesus at ang karaniwang gamit nito sa Bagong Tipan.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus na Mesiyas
  rationale: Isinalin ang Χριστός bilang titulong “Mesiyas,” hindi lamang bilang bahaging parang apelyido; likas sa Filipino ang hulma na “Jesus na Mesiyas.”
- source_word: δοῦλος
  choice: alipin
  rationale: Ipinahahayag ng δοῦλος ang pag-aari at ganap na pagpapasakop sa isang panginoon; mas buo itong naipahihiwatig ng “alipin” kaysa “lingkod.”
- source_word: ταῖς δώδεκα φυλαῖς
  choice: sa labindalawang lipi
  rationale: Pinananatili ang wikang tumutukoy sa labindalawang lipi ng Israel nang hindi ito ginagawang pangkalahatang “mga pangkat.”
- source_word: διασπορᾷ
  choice: Pangangalat
  rationale: Ginamit bilang katawagang teknikal para sa mga Judio na nakakalat sa labas ng lupain ng Israel; ang malaking titik ay nagpapakita ng natatanging gamit na ito.
- source_word: χαίρειν
  choice: Mga pagbati
  rationale: Ito ang likas na katumbas ng nakaugaliang pormula sa pambungad ng isang liham; ang literal na “magalak” ay hindi angkop sa idyomang ito.
theological_decisions:
- issue: Kahulugan ng Χριστοῦ sa pagkakakilanlan kay Jesus
  choice: Mesiyas
  alternative: Cristo
  rationale: Buhay pa rito ang diwa ng Χριστός bilang titulo ng pinahirang hari. Pinananatili ng “Mesiyas” ang kahulugan ng titulo, samantalang maaaring mapagkamalang bahagi lamang ng pangalan ang “Cristo.”
- issue: Diwa ng δοῦλος sa pagpapakilala ni Santiago
  choice: alipin
  alternative: lingkod
  rationale: Binibigyang-diin ng salita ang ganap na pagkabilang at pagpapasakop sa Diyos at sa Panginoong Jesus. Inilalagay sa talababa ang mas banayad na alternatibo upang hindi ikubli ang saklaw ng salita.
- issue: Tinutukoy ng “labindalawang lipi”
  choice: Pinanatili ang Israelitang pananalita nang hindi tahasang nililimitahan ang tinutukoy
  alternative: mga Judio lamang sa labas ng Israel
  rationale: Maaaring gumamit ang liham ng literal at/o teolohikal na pananalita tungkol sa Israel. Hindi nilutas sa salin ang posibleng lawak ng tagapakinig na hindi tahasang nilulutas ng talata.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang maikli at pormal na anyo ng pambungad ng liham, ang Israelitang katawagang “labindalawang lipi,” at ang teknikal na “Pangangalat.”
