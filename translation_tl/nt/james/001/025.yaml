  text: ὁ δὲ παρακύψας εἰς νόμον τέλειον τὸν τῆς ἐλευθερίας καὶ παραμείνας, ⸀οὐκ ἀκροατὴς ἐπιλησμονῆς γενόμενος ἀλλὰ ποιητὴς ἔργου, οὗτος μακάριος ἐν τῇ ποιήσει αὐτοῦ ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/025.yaml
  text: But the one who has looked intently into the perfect law[a], the law of freedom[c][b], and has continued in it—not becoming a forgetful hearer but a doer of the work—this one will be blessed in his doing.
translation:
  language: tl
  text: Ngunit ang taong masusing tumingin sa ganap na kautusan, ang kautusan ng kalayaan[a], at nanatili rito—hindi naging tagapakinig na nakakalimot[b], kundi isang gumagawa[c]—ang taong ito ay magiging pinagpala sa kanyang ginagawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “sa ganap na kautusan ng kalayaan.”'
    reason: lexical_alternative
  - marker: b
    text: 'Sa mas literal na anyo: “hindi naging tagapakinig ng pagkalimot.”'
    reason: lexical_alternative
  - marker: c
    text: 'Literal: “gumagawa ng gawa.” Maaari ring ipahayag nang mas idiomatiko bilang “taong kumikilos” o “taong gumagawa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακύψας
  choice: masusing tumingin
  rationale: Ipinahihiwatig ng pandiwa ang pagyuko o maingat na pagsilip, hindi isang pahapyaw na tingin. Natural na naihahatid ng “masusing tumingin” ang masidhing pagmamasid.
- source_word: νόμον τέλειον τὸν τῆς ἐλευθερίας
  choice: sa sakdal na kautusan, ang kautusan ng kalayaan
  rationale: Pinananatili ang appositional na pagkakabuo sa pag-uulit ng “kautusan.” Ang “sakdal” ay marangal at tumpak na katumbas ng τέλειον, habang hindi nilulutas ang kahulugan ng “kautusan ng kalayaan.”
- source_word: παραμείνας
  choice: nanatili rito
  rationale: Ipinapahayag nito ang patuloy na pananatili o pagtitiyaga kaugnay ng kautusang kababanggit lamang.
- source_word: οὐκ ἀκροατὴς ἐπιλησμονῆς γενόμενος
  choice: hindi naging tagapakinig na nakakalimot
  rationale: Ginagawang natural sa Tagalog ang di-karaniwang genitibong parirala habang pinananatili ang tahasang kaibahan ng pakikinig at paggawa.
- source_word: ποιητὴς ἔργου
  choice: tagagawa ng gawa
  rationale: Sinasadyang pinananatili ang ἔργον bilang “gawa,” sa halip na palitan ito ng “salita” mula sa kalapit na konteksto. Bagaman bahagyang di-karaniwan, pinananatili nito ang leksikal na diin sa aktuwal na pagkilos.
- source_word: μακάριος
  choice: pagpapalain
  rationale: Ang “pagpapalain” ay angkop sa hinaharap na ἔσται at pinananatili ang teolohikal na bigat ng μακάριος nang hindi ito binabawasan sa damdaming masaya lamang.
- source_word: ἐν τῇ ποιήσει αὐτοῦ
  choice: sa kanyang paggawa
  rationale: Pinananatili ng “paggawa” ang ugnayang leksikal sa naunang “tagagawa” at ang diin sa isinasagawang pagsunod.
- source_word: ὁ ... οὗτος
  choice: ang taong ... ang taong ito
  rationale: Pinananatili ang isahang kinatawang konstruksyon nang hindi nililimitahan sa lalaki; sa Tagalog, ang “tao” ay likas na pangkalahatan.
theological_decisions:
- issue: Kahulugan ng “kautusan ng kalayaan”
  choice: Panatilihin bilang “ang kautusan ng kalayaan.”
  alternative: “ang kautusang nagbibigay ng kalayaan” o isang tahasang pagtukoy rito bilang ebanghelyo o kautusang moral
  rationale: Hindi ipinapasiya ng Griyego kung ang diin ay nasa ebanghelyo, sa kautusang natupad, o sa mas malawak na tagubilin ng Diyos. Pinananatili ng salin ang teolohikal na lawak at tensiyon.
- issue: Pangkalahatang gamit ng panlalaking isahan
  choice: Gamitin ang “ang taong ... ang taong ito.”
  alternative: “ang lalaki” o maramihang anyo
  rationale: Ang panlalaking isahan sa Griyego ay kinatawan at hindi eksklusibo sa lalaki. Ang “tao” ay gender-accurate habang pinananatili ang isahan.
- issue: Ugnayan ng pakikinig, gawa, at pagpapala
  choice: Panatilihin ang pahayag na ang taong gumagawa ay “pagpapalain sa kanyang paggawa.”
  alternative: Ipaliwanag ito bilang batayan ng kaligtasan o bilang bunga lamang ng naunang kaligtasan
  rationale: Hindi dapat ipasok ng salin ang isang sistematikong paliwanag na hindi tahasang nilulutas ng talata.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang pag-uulit ng “kautusan,” “tagagawa/gawa/paggawa,” at ang isahang kinatawang anyo. Ang bahagyang di-karaniwang “tagagawa ng gawa” ay sadyang leksikal at nilinaw sa talababa.
