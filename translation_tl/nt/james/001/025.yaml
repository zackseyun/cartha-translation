  to: Ngunit ang taong masusing tumingin sa ganap na kautusan, ang kautusan ng kalayaan[a], at nanatili rito—hindi naging tagapakinig na nakakalimot[b], kundi isang gumagawa[c]—ang taong ito ay magiging pinagpala sa kanyang ginagawa.
  rationale: Inayos ang isang di-likas na parirala at ang maling alternatibo sa talababa, nang hindi binabago ang kahulugan ng talata. Ang “isang gumagawa” ay nagbibigay ng natural na katapat sa Tagalog para sa contrast na ἀκροατής/ποιητής at hindi pinapalitan ang “gawa” ng “salita.” Ang “ganap na kautusan” ay mas karaniwang modernong Filipino para sa τέλειος. Napanatili ang appositional na “ang kautusan ng kalayaan,” ang isahang kinatawang “ang taong ito,” at ang hindi-ipinapaliwanag na teolohikal na saklaw ng parirala.
