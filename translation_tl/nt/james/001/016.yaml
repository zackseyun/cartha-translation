  text: μὴ πλανᾶσθε, ἀδελφοί μου ἀγαπητοί.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/016.yaml
  text: Do not be deceived[a], my beloved brothers.
translation:
  language: tl
  text: Huwag kayong malinlang, minamahal kong mga kapatid.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay literal na “mga kapatid na lalaki,” ngunit maaari itong tumukoy nang sama-sama sa mga kapwa mananampalataya, kabilang ang mga babae.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: Huwag
  rationale: Kasama ng pangkasalukuyang pautos, naghahayag ito ng pagbabawal. Ang “Huwag” ang natural at tuwirang katumbas sa Tagalog nang hindi nagdaragdag ng di-tiyak na aspektuwal na kahulugan.
- source_word: πλανᾶσθε
  choice: kayong malinlang
  rationale: Maaaring passive o middle ang anyo at nangangahulugang malinlang o maligaw dahil sa maling paniniwala. Ang “malinlang” ay natural sa konteksto at nagpapanatili sa diwang huwag magpadala sa maling pagkaunawa.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Ang “mga kapatid” ang karaniwang tawag sa Tagalog sa mga kapwa mananampalataya. Hindi ito likas na nakatali sa kasarian, kaya naihahatid nito ang panlahatang pagtukoy ng Griyegong panlalaking maramihan nang hindi kailangang gumamit ng pilit na parirala.
- source_word: μου
  choice: kong
  rationale: Ang pang-angkop na anyong “kong” ay natural na naghahatid ng unang panauhang pag-aari at ng personal na lapit ng nagsasalita.
- source_word: ἀγαπητοί
  choice: minamahal
  rationale: Ang “minamahal” ay isang marangal at mainit na tawag na nagpapanatili sa diwa ng pagmamahal ng ἀγαπητοί; higit itong malapit sa pinagmulan kaysa sa mas payak na “mahal.”
theological_decisions:
- issue: Kasariang saklaw ng tawag sa pamayanang Kristiyano
  choice: Isalin ang ἀδελφοί bilang “mga kapatid” at ipaliwanag sa talababa ang anyo at saklaw ng salitang Griyego.
  alternative: “mga kapatid na lalaki at babae” o “mga kapatid na lalaki”
  rationale: Panlalaking maramihan ang anyong Griyego ngunit maaari nitong tukuyin nang sama-sama ang buong pamayanan, kabilang ang mga babae. Sa modernong Tagalog, natural na sumasaklaw sa kapwa lalaki at babae ang “mga kapatid,” kaya tumpak ito sa aktuwal na tinutukoy nang hindi binubura ang impormasyong pangwika, na nililinaw sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, magalang, at angkop sa pampublikong pagbasa. Pinili ang “Huwag kayong malinlang” bilang natural na pagbabawal at ang “minamahal kong mga kapatid” bilang mainit ngunit marangal na tawag.
