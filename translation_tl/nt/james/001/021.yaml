id: JAS.1.21
reference: James 1:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: διὸ ἀποθέμενοι πᾶσαν ῥυπαρίαν καὶ περισσείαν κακίας ἐν πραΰτητι δέξασθε τὸν ἔμφυτον λόγον τὸν δυνάμενον σῶσαι τὰς ψυχὰς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/021.yaml
  text: Therefore, having put away all filthiness and the overflow of wickedness, receive with meekness the implanted word, which is able to save your souls.
translation:
  language: tl
  text: Kaya, matapos ninyong alisin ang lahat ng karumihan at ang nag-uumapaw na kasamaan[a], tanggapin ninyo nang may kaamuan[b] ang salitang itinanim sa inyo[c], na may kakayahang magligtas sa inyong mga kaluluwa[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang saganang kasamaan” o “ang labis na kasamaan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nang may kahinahunan” o “nang may pagpapakumbaba.”
    reason: lexical_alternative
  - marker: c
    text: 'Maaari ring “ang likas na salita”; tradisyonal: “ang salitang inihugpong.”'
    reason: lexical_alternative
  - marker: d
    text: Maaari ring “sa inyong buhay” o “sa inyo mismo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Kaya
  rationale: Likas na panandang Filipino para sa paghihinuha mula sa naunang pahayag at malinaw na pinananatili ang lohikal na ugnayan.
- source_word: ἀποθέμενοι
  choice: matapos ninyong alisin
  rationale: Ipinapakita ang kilos na nauuna o kaakibat ng pangunahing utos na tanggapin, nang hindi ito ginagawang hiwalay na utos.
- source_word: πᾶσαν ῥυπαρίαν
  choice: ang lahat ng karumihan
  rationale: Pinananatili ang matingkad na larawan ng dumi at ang moral na diwa ng salita.
- source_word: περισσείαν κακίας
  choice: ang nag-uumapaw na kasamaan
  rationale: Ipinahahayag ang kasaganaan o labis na dami sa περισσεία at ang malawak na moral na saklaw ng κακία; iniiwasang paliitin ito sa sama ng loob lamang.
- source_word: ἐν πραΰτητι
  choice: nang may kaamuan
  rationale: Saklaw ng kaamuan ang kahinahunan at mapagpakumbabang kahandaang tumanggap; marangal at nauunawaan pa rin sa modernong Filipino.
- source_word: δέξασθε
  choice: tanggapin ninyo
  rationale: Direkta at natural na utos na nagpapahayag ng aktibong pagtanggap.
- source_word: τὸν ἔμφυτον λόγον
  choice: ang salitang itinanim sa inyo
  rationale: Pinananatili ang larawang agrikultural ng ἔμφυτος at nililinaw sa natural na Filipino na ang salita ay nakatanim sa mga tagapakinig, nang hindi tinutukoy kung paano ito itinanim.
- source_word: τὸν δυνάμενον σῶσαι
  choice: na may kakayahang magligtas
  rationale: Pinananatili ang pahayag ng kakayahan ng salita nang hindi dinaragdagan ang mekanismo ng pagliligtas.
- source_word: τὰς ψυχὰς ὑμῶν
  choice: sa inyong mga kaluluwa
  rationale: Pinananatili ang tradisyonal at teolohikal na bigat ng ψυχή, habang kinikilala sa talababa na maaari rin itong tumukoy sa buhay o sa buong sarili.
theological_decisions:
- issue: Kahulugan ng ψυχὰς ὑμῶν sa konteksto ng pagliligtas
  choice: sa inyong mga kaluluwa
  alternative: sa inyong buhay; sa inyo mismo
  rationale: Pinananatili ng “mga kaluluwa” ang teolohikal na bigat at leksikal na pagkakaugnay sa ψυχή, ngunit hindi itinatanggi ang mas malawak na saklaw nito na maaaring tumukoy sa buhay o buong pagkatao.
- issue: Diwa ng ἔμφυτον λόγον
  choice: ang salitang itinanim sa inyo
  alternative: ang likas na salita; ang salitang inihugpong
  rationale: Pinananatili nito ang posibilidad na ang salita ay inilagay ng Diyos at ngayo'y nakaugat sa mga tagapakinig, nang hindi tinutukoy ang paraan o bumubuo ng isang tiyak na doktrina mula sa talinghaga.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Kaya” at “tanggapin ninyo” para sa natural na daloy; pinanatili ang mga larawang “karumihan,” “nag-uumapaw,” at “itinanim” upang hindi mapatag ang retorika ng Griyego. Ang “kaamuan” at “kaluluwa” ay bahagyang tradisyonal ngunit malinaw sa kontekstong biblikal, at ang tunay na leksikal na kalabuan ay dokumentado sa mga talababa.
