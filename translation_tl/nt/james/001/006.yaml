  text: αἰτείτω δὲ ἐν πίστει, μηδὲν διακρινόμενος, ὁ γὰρ διακρινόμενος ἔοικεν κλύδωνι θαλάσσης ἀνεμιζομένῳ καὶ ῥιπιζομένῳ·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/006.yaml
  text: But let him ask in faith[a], doubting nothing, for the one who doubts is like a wave of the sea, driven by the wind and tossed about.
translation:
  language: tl
  text: Ngunit humingi siya nang may pananampalataya[a], nang walang anumang pag-aalinlangan, sapagkat ang nag-aalinlangan ay tulad ng alon sa dagat na tinatangay at itinataboy ng hangin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nang may pagtitiwala.” Sa kontekstong ito, ang salitang Griyego para sa “pananampalataya” ay maaari ring mangahulugan ng pagtitiwala.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτείτω
  choice: humingi siya
  rationale: Isinasalin ang pangatlong-panauhang pangkasalukuyang pautos bilang isang likas na paghihikayat sa Filipino. Ang “humingi” ay tumutukoy sa paghingi ng karunungan sa Diyos sa naunang talata.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig ang banayad na pagsalungat o kondisyon kaugnay ng pangakong ibibigay ng Diyos sa naunang talata.
- source_word: ἐν πίστει
  choice: nang may pananampalataya
  rationale: Pinananatili ang karaniwang teolohikal na katumbas ng πίστις habang malinaw na inilalarawan ang paraan ng paghingi.
- source_word: μηδὲν διακρινόμενος
  choice: nang walang anumang pag-aalinlangan
  rationale: Dito, ang διακρίνομαι ay tumutukoy sa panloob na pag-uurong-sulong o pagdududa. Naipapakita ng “walang anumang” ang ganap na diwa ng μηδέν.
- source_word: ὁ γὰρ διακρινόμενος
  choice: sapagkat ang nag-aalinlangan
  rationale: Ginawang pangkalahatan ang substantival participle nang hindi nagdaragdag ng kasariang wala namang kailangang idiin sa Griyego.
- source_word: ἔοικεν
  choice: ay tulad ng
  rationale: Likas at malinaw na katumbas ng paghahambing sa Griyego.
- source_word: κλύδωνι θαλάσσης
  choice: alon sa dagat
  rationale: Malinaw na inilalarawan ang κλύδων bilang alon o pagdaluyong ng dagat nang hindi gumagamit ng lipas o labis na matalinghagang salita.
- source_word: ἀνεμιζομένῳ καὶ ῥιπιζομένῳ
  choice: itinutulak ng hangin at ipinapadpad kung saan-saan
  rationale: Pinananatili ang dalawang pasibong kilos at ang larawan ng alon na walang katatagan. Ang “kung saan-saan” ay likas na nagpapahayag ng pabagu-bagong pagpapadpad nang hindi nagtatakda ng isang tiyak na direksiyon.
theological_decisions:
- issue: Kahulugan ng πίστις sa konteksto ng panalangin
  choice: pananampalataya
  alternative: pagtitiwala
  rationale: Ang “pananampalataya” ang pangunahing katumbas at nagpapanatili ng ugnayang teolohikal sa ibang gamit ng πίστις. Gayunman, sa kontekstong ito ay kasama rito ang mapagtiwalang pag-asa sa Diyos, kaya inilagay ang “pagtitiwala” bilang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasan ang masyadong pormal na “mag-atubili” upang mapanatili ang karaniwang kahulugan ng pagdududa o pag-uurong-sulong, at ginamit ang pangkalahatang “ang nag-aalinlangan” upang hindi magdagdag ng kasariang hindi sentro sa teksto.
