id: JAS.1.23
reference: James 1:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτι εἴ τις ἀκροατὴς λόγου ἐστὶν καὶ οὐ ποιητής, οὗτος ἔοικεν ἀνδρὶ κατανοοῦντι τὸ πρόσωπον τῆς γενέσεως αὐτοῦ ἐν ἐσόπτρῳ,
base_translation:
  language: en
  yaml_path: translation/nt/james/001/023.yaml
  text: For if anyone is a hearer of the word and not a doer, this one is like a man carefully looking at the face of his birth[a] in a mirror,
translation:
  language: tl
  text: Sapagkat kung ang sinuman ay tagapakinig ng salita ngunit hindi tagagawa nito, siya ay tulad ng isang lalaking masusing tumitingin sa likas niyang mukha[a] sa salamin,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang mukha ng kanyang kapanganakan,” ibig sabihin, ang likas na mukhang taglay niya mula nang ipanganak.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροατὴς
  choice: tagapakinig
  rationale: Pinananatili ang pangngalang tumutukoy sa taong nakikinig at ang tuwirang pagtutol nito sa “tagagawa” (ποιητής).
- source_word: λόγου
  choice: ng salita
  rationale: Tuwirang salin ng λόγος na umaayon sa konteksto ng Santiago at nagpapanatili ng ugnayan sa mga kalapit na talata.
- source_word: ποιητής
  choice: tagagawa nito
  rationale: Pinananatili ang anyong pangngalan at ang pagtutol na tagapakinig/tagagawa; idinagdag ang “nito” upang maging malinaw at natural sa Filipino na ang salita ang isinasagawa.
- source_word: ἔοικεν
  choice: ay tulad ng
  rationale: Natural na Filipino para sa pandiwang nagsasaad ng kasalukuyang pagkakatulad.
- source_word: ἀνδρὶ
  choice: isang lalaki
  rationale: Pinananatili ang tiyak na panlalaking kahulugan ng ἀνήρ, bagaman pangkalahatan ang aplikasyon ng paghahambing.
- source_word: κατανοοῦντι
  choice: masusing tumitingin
  rationale: Ipinahahayag ang mapagtuon at maingat na pagmamasid na ipinahihiwatig ng κατανοέω, hindi lamang isang saglit na sulyap.
- source_word: τὸ πρόσωπον τῆς γενέσεως αὐτοῦ
  choice: sa likas niyang mukha
  rationale: Natural at malinaw na Filipino para sa literal na “mukha ng kanyang kapanganakan,” na tumutukoy sa mukha o anyong taglay niya mula nang ipanganak.
- source_word: ἐν ἐσόπτρῳ
  choice: sa salamin
  rationale: Karaniwan at malinaw na modernong Filipino para sa salaming pinagmamasdan ang sariling mukha.
theological_decisions:
- issue: Panlalaking kinatawang pananalita sa ἀνδρὶ
  choice: isang lalaki
  alternative: isang tao
  rationale: Ang Griyego ay gumagamit ng tiyak na panlalaking ἀνήρ; pinananatili ito sa salin nang hindi nililimitahan sa mga lalaki ang pangkalahatang punto ng paghahambing.
- issue: Kahulugan ng τὸ πρόσωπον τῆς γενέσεως αὐτοῦ
  choice: likas niyang mukha
  alternative: mukha ng kanyang kapanganakan
  rationale: Ang literal na parirala ay hindi likas sa Filipino at maaaring maging malabo; inilalahad sa teksto ang kontekstuwal na kahulugan habang iniingatan sa talababa ang literal na anyo at tunay na kakaibang pahayag ng Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Pinanatili ang balanseng “tagapakinig/tagagawa,” ang panlalaking larawan ng ἀνήρ, at ang diin ng κατανοοῦντι. Ginawang natural sa pangunahing teksto ang di-karaniwang genitibong parirala at inilagay sa talababa ang literal na anyo nito.
