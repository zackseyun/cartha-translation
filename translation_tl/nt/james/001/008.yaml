translation:
  language: tl
  text: Ang lalaking hati ang loob[a] ay hindi matatag sa lahat ng kanyang mga lakad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “ang taong hati ang loob ay hindi matatag sa lahat ng kanyang mga lakad.” Panlalaking isahan ang anyo sa Griyego, ngunit malamang na kumakatawan ito sa sinuman.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ
  choice: lalaki
  rationale: Pinananatili nito ang panlalaking anyong isahan ng Griyego. Gayunman, sa konteksto ay kumakatawan ito sa sinumang humihingi na may pag-aalinlangan, hindi lamang sa mga lalaki.
- source_word: δίψυχος
  choice: hati ang loob
  rationale: Ang bihirang salitang ito ay literal na nagpapahiwatig ng pagkakaroon ng ‘dalawang kaluluwa.’ Ang likas na pariralang Tagalog na ‘hati ang loob’ ay malinaw na naghahayag ng panloob na pagkakahati at pabagu-bagong katapatan nang hindi nagiging malamya.
- source_word: ἀκατάστατος
  choice: hindi matatag
  rationale: Ipinahahayag nito ang kawalan ng paninindigan at pagiging pabagu-bago. Hindi nito dinaragdagan ang teksto ng diwang panlipunang kaguluhan na maaaring ipahiwatig ng ibang salin.
- source_word: ἐν πάσαις ταῖς ὁδοῖς αὐτοῦ
  choice: sa lahat ng kanyang mga lakad
  rationale: Pinananatili ng ‘mga lakad’ ang matalinghagang larawan ng ὁδοῖς habang tumutukoy sa kabuuang takbo ng pamumuhay at pagkilos ng tao.
theological_decisions:
- issue: Panlalaking wikang may kinatawang diwa
  choice: Panatilihin ang ‘lalaki’ sa pangunahing teksto
  alternative: isang taong hati ang loob at hindi matatag sa lahat ng kanyang mga lakad
  rationale: Panlalaking isahan ang anyo ng Griyego, ngunit malamang na pangkalahatan ang saklaw nito. Pinananatili ng pangunahing teksto ang anyong pinagmulan, habang nililinaw ng talababa na hindi lamang mga lalaki ang tinutukoy.
translation_notes:
  register: Makabago at marangal na Tagalog. Ginamit ang likas na idyomang ‘hati ang loob’ at pinanatili ang matalinghagang ‘mga lakad.’ Ang ‘at’ ay idinagdag upang maging maayos ang daloy sa Tagalog, bagaman walang tahasang pangatnig sa Griyego.
