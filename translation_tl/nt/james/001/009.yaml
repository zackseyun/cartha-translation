  text: Ngunit ipagmalaki ng kapatid na mababa ang kalagayan ang kanyang mataas na katayuan[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang kapatid na nasa mababang katayuan.” Maaari itong tumukoy sa kapwa mananampalatayang lalaki o babae; panlalaking isahan ang salitang Griyego para sa “kapatid,” ngunit maaari itong gamitin bilang kinatawan ng sinumang kapwa mananampalataya.
    reason: lexical_alternative
  - marker: b
    text: O “ang kanyang pagdakila.” Maaaring tumukoy ang parirala sa marangal na katayuan ng abang mananampalataya sa harap ng Diyos, na maaaring isaalang-alang ang pagbabaligtad ng kalagayan sa kasalukuyan at sa hinaharap.
    reason: alternative_reading
lexical_decisions:
- source_word: Καυχάσθω
  choice: ipagmalaki
  rationale: Pinananatili nito ang lakas ng προστακτική na anyo at ng pandiwang καυχάομαι bilang pagmamapuri o pagmamalaki, habang ang bagay na ipinagmamalaki—ang pagkadakilang kaloob ng Diyos—ang nag-aalis ng diwang pansariling pagmamataas.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig ng δέ ang banayad na pagsalungat o paglipat patungo sa magkatambal na kalagayan ng mababa at mayaman sa talata 9–10.
- source_word: ὁ ἀδελφὸς
  choice: ang kapatid
  rationale: Ang “kapatid” ay natural sa Filipino, tumutukoy sa kapwa mananampalataya, at hindi kailangang markahan ang kasariang panlalaki gaya ng anyong gramatikal sa Griyego; nililinaw sa talababa ang maaaring representatibong gamit nito.
- source_word: ὁ ταπεινὸς
  choice: na mababa ang kalagayan
  rationale: Ipinapakita nito ang mababang katayuang panlipunan o pangkabuhayan na mahalaga sa paghahambing sa mayaman, nang hindi nililimitahan ang salita sa kahirapan lamang o sa kababaang-loob lamang.
- source_word: ἐν τῷ ὕψει αὐτοῦ
  choice: ang kanyang pagkadakila
  rationale: Ang “pagkadakila” ay naglilipat sa literal na diwa ng ὕψος bilang kataasan o pagtaas at pinananatiling bukas kung ito ay dangal sa harap ng Diyos sa kasalukuyan, pagbabaligtad ng katayuan, o ganap na pagdakila sa hinaharap.
theological_decisions:
- issue: Kahulugan ng “pagkadakila” ng kapatid na mababa ang kalagayan
  choice: Dangal o mataas na katayuang ipinagkaloob ng Diyos, na maaaring may kasalukuyan at panghinaharap na dimensiyon
  alternative: Kasalukuyang pag-angat sa lipunan lamang; espirituwal na katayuan lamang; o pagdakila sa wakas lamang
  rationale: Ang paghahambing sa mababa at mayaman at ang tema ng pagbabaligtad sa talata 9–10 ay hindi nagbibigay-katwirang ikulong ang parirala sa iisang yugto o uri ng pagdakila.
- issue: Representatibong gamit ng ἀδελφός
  choice: “kapatid” sa pangunahing teksto, na maaaring tumukoy sa kapwa mananampalataya anuman ang kasarian
  alternative: “lalaking kapatid” o “kapatid na lalaki,” na tahasang naglilimita sa kasariang panlalaki
  rationale: Bagaman panlalaking isahan ang anyong Griyego, ang karaniwang “kapatid” sa Filipino ay tapat sa ugnayang ipinahihiwatig at natural na maaaring gamitin para sa lalaki o babae; ipinapaliwanag sa talababa ang anyo ng pinagmulan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mababa ang kalagayan” sa halip na “aba” upang maiwasan ang tunog na mapanghamak o labis na arkaiko, at “pagkadakila” upang mapanatili ang teolohikal na lawak ng ὕψος.
