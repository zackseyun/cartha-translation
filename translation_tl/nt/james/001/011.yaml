id: JAS.1.11
reference: James 1:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀνέτειλεν γὰρ ὁ ἥλιος σὺν τῷ καύσωνι καὶ ἐξήρανεν τὸν χόρτον, καὶ τὸ ἄνθος αὐτοῦ ἐξέπεσεν καὶ ἡ εὐπρέπεια τοῦ προσώπου αὐτοῦ ἀπώλετο· οὕτως καὶ ὁ πλούσιος ἐν ταῖς πορείαις αὐτοῦ μαρανθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/011.yaml
  text: For the sun rose with its scorching heat and dried up the grass[a], and its flower fell off and the beauty of its appearance perished[b]; so also the rich man will wither away in the midst of his pursuits.
translation:
  language: tl
  text: Sapagkat sumikat ang araw kasabay ng nakapapasong init[a] at tinuyo ang damo; nalaglag ang bulaklak nito, at naglaho ang ganda ng anyo nito. Gayundin, malalanta ang taong mayaman sa gitna ng kanyang mga lakad.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kasabay ng nakapapasong hangin.” Ang salitang Griyego na καύσων ay maaaring tumukoy sa matinding init at, sa ilang konteksto, sa mainit na hanging kaugnay nito.
    reason: lexical_alternative
  - marker: b
    text: O “sa kanyang mga paglalakbay.” Ang salitang Griyego ay maaaring tumukoy nang literal sa mga paglalakbay o, nang mas malawak, sa takbo ng mga gawain at pinagkakaabalahan ng isang tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέτειλεν
  choice: sumikat
  rationale: Likas na salin para sa pagsikat ng araw at pinananatili ang payak na aspektong pangyayari ng aorist sa paglalarawan.
- source_word: σὺν τῷ καύσωνι
  choice: kasabay ng nakapapasong init
  rationale: Ipinahahayag ang matinding init na kaugnay ng pagsikat ng araw, habang hindi ginagawang tahasang pag-aari ng araw ang init na wala naman sa Griyego.
- source_word: ἐξήρανεν τὸν χόρτον
  choice: tinuyo ang damo
  rationale: Tuwirang inilalarawan ang epekto ng init sa halaman at natural sa modernong Tagalog.
- source_word: τὸ ἄνθος αὐτοῦ ἐξέπεσεν
  choice: nalaglag ang bulaklak nito
  rationale: Pinananatili ang kongkretong larawan ng bulaklak na nahuhulog mula sa halaman.
- source_word: ἡ εὐπρέπεια τοῦ προσώπου αὐτοῦ
  choice: ang ganda ng anyo nito
  rationale: Ang πρόσωπον ay literal na maaaring 'mukha,' ngunit ang 'anyo' ang likas na gamit para sa nakikitang kaanyuan ng bulaklak; pinananatili ng 'ganda' ang diwa ng εὐπρέπεια.
- source_word: ἀπώλετο
  choice: naglaho
  rationale: Ipinahahayag ang pagkawala ng kagandahan nang hindi nagpapahiwatig ng isang tahasang panlabas na tagapuksa.
- source_word: ὁ πλούσιος
  choice: ang taong mayaman
  rationale: Malinaw na tumutukoy sa isang kinatawang indibidwal. Hindi likas na minamarkahan ng Tagalog ang gramatikal na kasarian, kaya hindi kailangang idagdag ang 'lalaki' na wala bilang leksikal na sangkap sa πλούσιος.
- source_word: ἐν ταῖς πορείαις αὐτοῦ
  choice: sa gitna ng kanyang mga lakad
  rationale: Ang 'mga lakad' ay maaaring tumukoy sa literal na paglalakbay at, sa karaniwang Tagalog, sa mga gawain o pinagkakaabalahan; kaya napapanatili nito ang lawak at bahagyang kalabuan ng πορείαις.
- source_word: μαρανθήσεται
  choice: malalanta
  rationale: Ipinagpapatuloy ang larawang mula sa halaman at malinaw na naghahayag ng mangyayari sa hinaharap.
theological_decisions:
- issue: Kasarian ng kinatawang tinutukoy sa ὁ πλούσιος
  choice: ang taong mayaman
  alternative: ang mayamang lalaki
  rationale: Masculine singular ang anyong Griyego, ngunit hindi likas na may gramatikal na kasarian ang katumbas sa Tagalog. Ang pagdaragdag ng 'lalaki' ay maaaring magpaliit sa saklaw ng babala nang higit sa hinihingi ng konteksto.
- issue: Saklaw ng πορείαις sa babala sa mayaman
  choice: mga lakad
  alternative: mga paglalakbay; mga pinagkakaabalahan
  rationale: Pinananatili ng 'mga lakad' ang maaaring literal na diwa ng paglalakbay at ang mas malawak na diwa ng mga gawain o hangarin sa buhay, sa halip na tahasang lutasin ang leksikal na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang kongkretong bokabularyong “damo,” “bulaklak,” “anyo,” at “malalanta” upang mapanatili ang magkakaugnay na larawang panghalaman. Ang “mga lakad” ay karaniwan at natural habang sinasadyang pinananatili ang literal at pinalawak na mga posibilidad ng Griyego.
