base_translation:
  language: en
  yaml_path: translation/nt/james/001/014.yaml
  text: But each one is tempted by his own desire[b][a], being drawn away and enticed.
translation:
  language: tl
  text: Ngunit ang bawat isa ay natutukso ng sarili niyang pagnanasa[a], habang hinihila siya palayo at inaakit nito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sarili niyang masidhing hangarin” o “sarili niyang pita.” Ang salitang Griyego ay maaaring tumukoy sa matinding pagnanais sa pangkalahatan, hindi lamang sa pagnanasang seksuwal.
    reason: lexical_alternative
  - marker: b
    text: 'Ang magkatambal na mga salitang “hinihila palayo” at “inaakit” ay pumupukaw ng larawan ng pangangaso o pangingisda: ang biktima ay inilalabas o inilalayo at inaakit ng pain.'
    reason: cultural_note
lexical_decisions:
- source_word: ἕκαστος
  choice: ang bawat isa
  rationale: 'Pinananatili ang distributibo at isahang diin ng Griyego: bawat tao ay tinutukoy nang paisa-isa.'
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig ang banayad na pagsalungat sa naunang pahayag na hindi nanunukso ang Diyos.
- source_word: πειράζεται
  choice: ay natutukso
  rationale: Sa konteksto, tumutukoy ito sa pag-akit tungo sa kasalanan, hindi lamang sa pagdanas ng pagsubok.
- source_word: ὑπὸ τῆς ἰδίας ἐπιθυμίας
  choice: ng sarili niyang pagnanasa
  rationale: Ipinakikita ang sariling pagnanasa ng tao bilang pinagmumulan ng tukso at pinananatili ang diin ng ἰδίας sa personal na pananagutan.
- source_word: ἐπιθυμίας
  choice: pagnanasa
  rationale: Malawak ngunit may bigat sa kontekstong moral; hindi ito nililimitahan sa seksuwal na pita lamang.
- source_word: ἐξελκόμενος
  choice: habang hinihila siya nito
  rationale: Pinananatili ang larawan ng pagkaladkad o pagkalabas mula sa ligtas na kinalalagyan, nang hindi labis na pinatitindi ang salita.
- source_word: καὶ δελεαζόμενος
  choice: at inaakit
  rationale: Likas sa modernong Tagalog at naihahatid ang larawan ng pang-akit na parang pain sa isang bitag.
theological_decisions:
- issue: Ang pinagmumulan ng tukso kaugnay ng Diyos
  choice: Iniuugnay ng talata ang tukso sa sariling pagnanasa ng tao, hindi sa Diyos.
  alternative: Unawain ang πειράζεται bilang karaniwang panlabas na pagsubok lamang.
  rationale: Itinatanggi ng talata 13 na nanunukso ang Diyos, at inilalarawan ng talata 14 ang sariling pagnanasa bilang malapit na pinagmumulan ng pag-akit sa kasalanan. Hindi pinalalawak ng salin ang pahayag tungo sa isang masaklaw na doktrina ng sanhi.
- issue: Pangkalahatang gamit ng isahang anyo
  choice: Ginamit ang “bawat isa” at ang isahang “sarili niya/siya.”
  alternative: Gumamit ng maramihang anyo gaya ng “ang lahat” at “kanilang.”
  rationale: Pinananatili nito ang isahan at paisa-isang diin ng Griyego habang likas at pangkalahatan pa rin ang gamit sa Tagalog.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang paisa-isang diin at ang matingkad na larawan ng paghila at pang-aakit, ngunit inilagay sa talababa ang mas tahasang imahen ng pain at bitag upang manatiling natural ang pangunahing teksto.
