base_translation:
  language: en
  yaml_path: translation/nt/james/001/017.yaml
  text: Every good gift and every perfect gift is from above[a], coming down from the Father of lights[b], with whom there is no variation or shadow of turning.
translation:
  language: tl
  text: Ang bawat mabuting kaloob[a] at bawat ganap na kaloob ay mula sa itaas, na bumababa mula sa Ama ng mga liwanag[b]. Sa kanya ay walang pagbabago o anino ng pag-ikot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bawat mabuting pagbibigay.” Maaaring bigyang-diin ng unang pangngalan ang gawa ng pagbibigay, samantalang ang ikalawa ay ang bagay na ibinigay.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga liwanag” ay malamang na tumutukoy sa mga tanglaw sa langit. Maaari ring isalin ang hulíng parirala na “aninong dulot ng pag-ikot” o “aninong pabago-bago”; maaaring tumukoy ito sa nagbabagong mga aninong kaugnay ng paggalaw ng mga tanglaw sa langit.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶσα δόσις ἀγαθὴ
  choice: Ang bawat mabuting kaloob
  rationale: Maaaring tumukoy ang δόσις sa pagbibigay o sa bagay na ibinigay. Likas at marangal sa Filipino ang “kaloob,” habang pinananatili sa talababa ang maaaring diin sa gawa ng pagbibigay.
- source_word: πᾶν δώρημα τέλειον
  choice: bawat ganap na handog
  rationale: Ang δώρημα ay ang bagay na ibinigay. Ginamit ang “handog” upang maipakita ang kaunting pagkakaiba nito sa δόσις, nang hindi gumagamit ng salitang may masyadong kaswal na himig.
- source_word: ἄνωθέν ἐστιν
  choice: ay mula sa itaas
  rationale: Tuwirang pinananatili nito ang pinagmulan sa itaas at ang tahasang copula ng Griyego.
- source_word: καταβαῖνον
  choice: at bumababa
  rationale: Ipinahahayag ng pangkasalukuyang participle ang pagbaba ng kaloob mula sa Diyos; natural sa Filipino ang pandiwang “bumababa.”
- source_word: ἀπὸ τοῦ πατρὸς τῶν φώτων
  choice: mula sa Ama ng mga liwanag
  rationale: Pinananatili ang metapora at ang genitive na parirala. Maaaring tumukoy ang “mga liwanag” sa mga tanglaw sa langit, ngunit hindi ito ginawang tahasang paliwanag sa pangunahing teksto.
- source_word: παρ’ ᾧ οὐκ ἔνι παραλλαγὴ
  choice: Sa kanya ay walang pagbabago
  rationale: Natural na inililipat sa Filipino ang relational na παρ’ ᾧ bilang “sa kanya,” at malinaw na isinasalin ang existential na οὐκ ἔνι.
- source_word: ἢ τροπῆς ἀποσκίασμα
  choice: o aninong dulot ng pag-ikot
  rationale: Pinananatili ang mahirap at matalinghagang ugnayan ng anino at pag-ikot, habang ginagawang malinaw sa modernong Filipino ang posibleng sanhi o kaugnayan.
theological_decisions:
- issue: Ang larawan ng “Ama ng mga liwanag” at ang kawalan ng pagbabago sa Diyos
  choice: Panatilihin ang metapora ng mga liwanag at ang pahayag na walang pagbabago o aninong dulot ng pag-ikot sa kanya.
  alternative: Ipaliwanag sa pangunahing teksto na ang “mga liwanag” ay mga bagay sa kalangitan at ibuod ang hulíng sugnay bilang “hindi nagbabago ang Diyos.”
  rationale: Inihahambing ng talata ang Diyos sa nagbabagong mga liwanag o anino, ngunit hindi nito lubusang ipinapaliwanag ang larawan. Pinananatili ng salin ang teolohikal at makatang tensiyon nang hindi ito ginagawang doktrinal na paraphrase.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang makatang larawan ng pinagmulan sa itaas, ng Ama ng mga liwanag, at ng aninong kaugnay ng pag-ikot; iniwasan ang denominasyonal o sobrang paliwanag na pananalita.
