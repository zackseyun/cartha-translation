id: JAS.1.27
reference: James 1:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: θρησκεία καθαρὰ καὶ ἀμίαντος παρὰ ⸀τῷ θεῷ καὶ πατρὶ αὕτη ἐστίν, ἐπισκέπτεσθαι ὀρφανοὺς καὶ χήρας ἐν τῇ θλίψει αὐτῶν, ἄσπιλον ἑαυτὸν τηρεῖν ἀπὸ τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/027.yaml
  text: 'Religion that is pure and undefiled before God the Father is this: to care for orphans and widows in their affliction[b][a], and to keep oneself unstained from the world.'
translation:
  language: tl
  text: 'Ang relihiyong dalisay at walang dungis sa paningin ng Diyos na Ama ay ito: alagaan ang mga ulila at mga biyuda sa kanilang paghihirap[a], at ingatan ang sarili na huwag mabahiran ng sanlibutan[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dalawin ang mga ulila at mga biyuda sa kanilang paghihirap.” Maaaring saklawin ng pandiwang Griyego ang pagdalaw at ang aktibong pag-aaruga sa kanila.
    reason: lexical_alternative
  - marker: b
    text: Ang “sanlibutan” dito ay tumutukoy sa makasalanang kaayusang sumasalungat sa Diyos, hindi sa sangnilikha mismo.
    reason: cultural_note
lexical_decisions:
- source_word: θρησκεία
  choice: relihiyon
  rationale: Tumutukoy ito sa panlabas at aktuwal na pagsasagawa ng debosyon sa Diyos, hindi lamang sa panloob na pananampalataya. Ang “relihiyon” ang pinakamaikli at tuwirang katumbas sa makabagong Filipino, habang nililinaw ng kasunod na pangungusap ang praktikal na kahulugan nito.
- source_word: καθαρὰ καὶ ἀμίαντος
  choice: dalisay at walang dungis
  rationale: Pinananatili ang magkaugnay na larawan ng kadalisayan at kawalan ng karumihan, pati ang mariing retorika ng dalawang pang-uri.
- source_word: παρὰ τῷ θεῷ καὶ πατρὶ
  choice: sa paningin ng Diyos na Ama
  rationale: Ipinahahayag ng παρά na may datibo ang pagsusuri o pagkilala mula sa pananaw ng Diyos. Ang “Diyos na Ama” ay natural na appositional na pagbasa sa Filipino at hindi nagdaragdag ng “ating,” na wala sa tekstong Griyego.
- source_word: ἐπισκέπτεσθαι
  choice: alagaan
  rationale: Sa konteksto, higit ito sa pagdalaw lamang; kasama rito ang aktibong paglingap at pagtulong sa mga nangangailangan. Inilalagay sa talababa ang mas literal na “dalawin” upang mapanatili ang saklaw ng pandiwa.
- source_word: ὀρφανοὺς καὶ χήρας
  choice: mga ulila at mga biyuda
  rationale: Tuwiran, malinaw, at pangkaraniwang mga katumbas sa Filipino para sa dalawang grupong mahina at nangangailangan ng proteksiyon.
- source_word: ἐν τῇ θλίψει αὐτῶν
  choice: sa kanilang paghihirap
  rationale: Saklaw ng “paghihirap” ang mabigat na kagipitan, dalamhati, o kapighatiang ipinahihiwatig ng θλῖψις at natural itong pakinggan sa modernong Filipino.
- source_word: ἄσπιλον ἑαυτὸν τηρεῖν
  choice: ingatan ang sarili na huwag mabahiran
  rationale: Ipinapakita nito ang aktibong pag-iingat sa sarili laban sa moral na karumihan. Ang “ang sarili” ay angkop sa pangkalahatang bisa ng pangaral at hindi nililimitahan sa lalaki.
- source_word: ἀπὸ τοῦ κόσμου
  choice: ng sanlibutan
  rationale: Pinananatili ang payak at teolohikal na matimbang na katawagang “sanlibutan” nang hindi ipinapalit sa mismong teksto ang isang mas makitid na interpretasyon gaya ng “katiwalian ng lipunan.”
theological_decisions:
- issue: Kahulugan ng κόσμος sa kontekstong etikal
  choice: Panatilihin ang “sanlibutan” sa pangunahing teksto bilang pinagmumulan o saklaw ng moral na pagdungis.
  alternative: katiwalian ng sanlibutan; makasalanang kaayusan ng mundo
  rationale: Etikal ang gamit ni Santiago, ngunit ang pagpapalawak sa pangunahing teksto ay maaaring labis na magtakda ng kahulugan. Nililinaw ng talababa na hindi ang nilikhang daigdig mismo ang tinutukoy, nang hindi itinutulak ang mambabasa tungo sa paglayo sa sangnilikha o sa lipunan bilang gayon.
- issue: Pangkalahatang bisa ng ἑαυτόν
  choice: ang sarili
  alternative: ang kaniyang sarili
  rationale: Bagaman panlalaking isahan ang anyong Griyego, pangkalahatang tuntuning moral ang pahayag. Natural na ipinahahayag ng “ang sarili” ang bisa nito para sa bawat tao.
- issue: Ugnayan ng “Diyos” at “Ama”
  choice: Diyos na Ama
  alternative: Diyos at Ama
  rationale: Ang iisang artikulo sa τῷ θεῷ καὶ πατρὶ at ang konteksto ay sumusuporta sa iisang tinutukoy, kung saan inilalarawan ang Diyos bilang Ama. Hindi idinagdag ang “ating,” sapagkat wala iyon sa Griyego.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “relihiyon” sa diwa ng aktuwal na pagsasagawa ng debosyon, “biyuda” bilang laganap na modernong katawagan, at “sanlibutan” upang mapanatili ang biblikal at etikal na bigat ng κόσμος. Iniwasan ang sobrang literal ngunit di-likas na ayos ng pangungusap at ang mga pagpapalawak na magpapaliit sa tunay na saklaw ng teksto.
