review_pass:
  verdict: revise
  source_fidelity: 'Ang pangunahing diwa ay wastong naipapahayag: ang taong tinutukso ay hindi dapat mag-angking ang Diyos ang tumutukso sa kanya; ang Diyos ay hindi maaaring matukso ng kasamaan at hindi tumutukso kaninuman. Gayunman, mas tuwirang maipapakita ang saklaw ng μηδείς sa “sinumang tinutukso” kaysa sa “isang tao,” at kailangang itama ang talababa upang hindi magmungkahi ng kahulugang hindi sinusuportahan ng Griyego.'
  naturalness: Natural at angkop sa modernong Filipino ang “Huwag sabihin ng sinumang tinutukso” at “hindi maaaring matukso ng kasamaan.” Mas malinaw ito kaysa sa temporal na “Kapag tinutukso ang isang tao,” na maaaring magpahiwatig na ang pagbabawal ay para lamang sa isang tiyak na sandali.
  terminology: Ang magkakatugmang “tinutukso/tumutukso” ay angkop sa agarang konteksto. Ang “kasamaan” ay natural na kolektibong Filipino para sa κακῶν; ipinaliliwanag ng talababa na maramihan ang Griyego. Hindi dapat idagdag ang “hindi madaling matukso,” sapagkat ang “madaling” ay nagpapasok ng antas o pagkahilig na wala sa teksto.
  issues:
  - severity: medium
    issue: Ang talababa ay nagsasabing ang pang-uri ay maaaring mangahulugang “hindi madaling matukso.”
    rationale: Ang “hindi madaling” ay nagmumungkahi na maaaring matukso ang Diyos sa ibang antas, samantalang ang pangunahing kahulugan sa kontekstong ito ay hindi siya maaaring tuksuhin ng kasamaan. Dapat itong alisin upang mapanatili ang lakas at kalabuan ng bihirang pang-uring ἀπείραστος.
  - severity: low
    issue: Ang “Kapag tinutukso ang isang tao” ay bahagyang nagpapalabo sa saklaw ng μηδείς.
    rationale: Ang μηδείς ay “walang sinuman,” hindi pangkalahatang halimbawa lamang na “isang tao.” Ang “sinumang tinutukso” ay mas malapit sa saklaw ng Griyego at likas pa rin sa Filipino.
  - severity: low
    issue: Ang talababang “hindi matutukso ng masasama” ay maaaring basahing “ng masasamang tao.”
    rationale: Sa Filipino, ang substantivized na “masasama” ay karaniwang tumutukoy sa masasamang tao. Mas malinaw ang “ng mga bagay na masama” bilang literal na paglilinaw sa plural na κακῶν.
  revised_text: Huwag sabihin ng sinumang tinutukso, “Tinutukso ako ng Diyos.” Sapagkat ang Diyos ay hindi maaaring matukso ng kasamaan,[a] at siya mismo ay hindi tumutukso kaninuman.
