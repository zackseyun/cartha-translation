base_translation:
  language: en
  yaml_path: translation/nt/james/001/013.yaml
  text: Let no one who is being tempted say[a], “I am being tempted by God,” for God is untemptable by evil, and he himself tempts no one.
translation:
  language: tl
  text: Huwag sabihin ng sinumang tinutukso, “Tinutukso ako ng Diyos.” Sapagkat ang Diyos ay hindi maaaring matukso ng kasamaan,[a] at siya mismo ay hindi tumutukso kaninuman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “ang Diyos ay hindi matutukso ng mga bagay na masama.” Ang salitang Griyego ay isang bihirang pang-uri; ang “kasamaan” sa salin ay kolektibo, samantalang maramihan ang salitang Griyego.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδεὶς … λεγέτω
  choice: huwag niyang sabihin
  rationale: Ang negatibong panghalip na μηδείς kasama ng pangatlong panauhang pautos na λεγέτω ay likas na naipapahayag sa Filipino bilang pagbabawal na “huwag niyang sabihin,” habang ang tinutukoy na tao ay inilalahad sa sugnay na “Kapag tinutukso ang isang tao.”
- source_word: πειραζόμενος
  choice: Kapag tinutukso ang isang tao
  rationale: Ang kasalukuyang pasibong participle ay tumutukoy sa taong dumaranas ng tukso. Likas sa Filipino ang sugnay na may “kapag”; pinananatili ng pasibong “tinutukso” ang ideya na may tukso siyang dinaranas.
- source_word: Ἀπὸ θεοῦ πειράζομαι
  choice: Tinutukso ako ng Diyos
  rationale: Sa konstruksiyong ito, ang ἀπό ay nagpapahiwatig ng pinagmulan o tagaganap. Ang “ng Diyos” ang malinaw at natural na pagtukoy sa inaangking tagatukso.
- source_word: ἀπείραστός ἐστιν κακῶν
  choice: ang Diyos ay hindi matutukso ng masama
  rationale: Ang bihira at mahirap na pang-uring ἀπείραστος ay ipinapahayag sa natural na Filipino bilang kawalan ng posibilidad na matukso. Ang κακῶν ay ginawang kolektibong “masama,” nang hindi nililimitahan sa iisang uri ng kasamaan.
- source_word: πειράζει
  choice: tumutukso
  rationale: Sa konteksto ng masamang pagnanasa at kasalanan sa kasunod na mga talata, ang kahulugan ay pang-uudyok sa masama, kaya “tumutukso” at hindi ang mas malawak na “sumusubok.”
- source_word: αὐτὸς οὐδένα
  choice: siya mismo ay hindi tumutukso kaninuman
  rationale: Pinananatili ng “siya mismo” ang diin ng αὐτός, at malinaw na katumbas ng οὐδένα ang “kaninuman” sa negatibong sugnay.
theological_decisions:
- issue: Kahulugan ng magkakaugnay na anyo ng πειράζω sa talata
  choice: Gamitin ang “tukso/tinutukso/tumutukso” sa lahat ng paglitaw.
  alternative: Gamitin ang “subok/sinusubok” sa isa o higit pang paglitaw.
  rationale: Itinatanggi rito na ang Diyos ang pinagmumulan ng pang-uudyok sa kasamaan; pinagtitibay ito ng kasunod na pagtalakay sa pagnanasa at kasalanan. Hindi nito ipinagkakaila ang ibang biblikal na diwa ng pagsubok.
- issue: Kahulugan ng ἀπείραστός ἐστιν κακῶν
  choice: “ang Diyos ay hindi matutukso ng masama”
  alternative: “ang Diyos ay walang karanasan sa masasama” o “ang Diyos ay hindi dapat tuksuhin sa pamamagitan ng masasama”
  rationale: Mahirap at bihira ang parirala, ngunit sa agarang konteksto, ang kawalan ng pagiging madaling matukso ng masama ang pinakamalinaw na kaugnay ng kasunod na pahayag na hindi siya tumutukso kaninuman. Inilalagay sa talababa ang mas literal na anyo upang hindi maitago ang anyong pang-uri ng Griyego.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang natural na ayos na “Kapag… huwag…” sa halip na piliting tumbasan ang Griyegong participle. Pinanatili ang diin sa “siya mismo” at nilagyan ng talababa ang leksikal na hirap at maramihang anyo ng κακῶν.
