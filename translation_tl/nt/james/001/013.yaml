  to: Huwag sabihin ng sinumang tinutukso, “Tinutukso ako ng Diyos.” Sapagkat ang Diyos ay hindi maaaring matukso ng kasamaan,[a] at siya mismo ay hindi tumutukso kaninuman.
  rationale: Inayos ang unang sugnay upang malinaw na tumbasan ang “walang sinuman na tinutukso,” at pinalitan ang “hindi matutukso” ng “hindi maaaring matukso” upang ipahayag ang lakas ng ἀπείραστος sa natural na Filipino. Inayos din ang talababa upang linawin ang plural na κακῶν nang hindi magpasok ng ideyang maaaring maging “madaling” o “mahirap” tuksuhin ang Diyos.
