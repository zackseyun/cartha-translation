  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Μακάριος ἀνὴρ ὃς ὑπομένει πειρασμόν, ὅτι δόκιμος γενόμενος λήμψεται τὸν στέφανον τῆς ζωῆς, ὃν ⸀ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/012.yaml
  text: Blessed is the man who endures trial[a], because after he has been approved, he will receive the crown of life[b], which he promised to those who love him.
translation:
  language: tl
  text: Mapalad ang taong nagtitiis sa pagsubok[a], sapagkat matapos siyang mapatunayang subok, tatanggapin niya ang korona ng buhay[b] na ipinangako niya sa mga umiibig sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tukso” o “paglalagay sa pagsubok.” Saklaw ng salitang Griyego ang pagsubok at tukso, ngunit dito ay binibigyang-diin ng konteksto ang matatag na pagtitiis sa pagsubok.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Griyego para sa “korona” ay maaari ring tumukoy sa putong na iginagawad sa nagwagi, hindi lamang sa koronang isinusuot ng hari.
    reason: cultural_note
lexical_decisions:
- source_word: Μακάριος
  choice: Mapalad
  rationale: Likas at marangal na katumbas sa Filipino ng pormulang pagpapala; hindi ito limitado sa pansariling damdamin ng pagiging masaya.
- source_word: ἀνὴρ
  choice: ang taong
  rationale: Bagaman panlalaking isahan ang anyong Griyego, ginagamit ito rito bilang kinatawan ng sinumang tao; ang “taong” ay natural sa Filipino at hindi nagpapakitid ng saklaw.
- source_word: ὑπομένει
  choice: nagtitiis
  rationale: Ipinahihiwatig nito ang matatag na pananatili sa ilalim ng hirap o pagsubok.
- source_word: πειρασμόν
  choice: pagsubok
  rationale: Saklaw ng salita ang pagsubok at tukso, ngunit ang pagtitiis at pagpapatunay sa konteksto ay higit na nagtuturo sa pagsubok; pinananatili sa talababa ang ibang posibleng diwa.
- source_word: δόκιμος γενόμενος
  choice: kapag napatunayang karapat-dapat
  rationale: Ipinapahayag ang paglabas mula sa pagsubok bilang subok at tanggap; ang “kapag” ay maayos na naghahatid ng kaugnayang temporal nang hindi labis na nagpapaliwanag.
- source_word: λήμψεται
  choice: tatanggapin niya
  rationale: Tuwirang hinaharap na anyo at angkop sa pagtanggap ng ipinangakong gantimpala.
- source_word: στέφανον
  choice: korona
  rationale: Ito ang nakaugaliang salin, habang nililinaw sa talababa na maaari itong tumukoy sa putong ng nagwagi at hindi kinakailangang koronang maharlika.
- source_word: τῆς ζωῆς
  choice: ng buhay
  rationale: Pinananatili ang payak at sadyang hindi lubusang tinutukoy na ugnayang henitibo ng Griyego.
- source_word: ἐπηγγείλατο
  choice: ipinangako niya
  rationale: Inilalarawan ang naganap na pangako; ang di-binanggit na simuno ay pinananatiling “niya,” gaya ng Griyego, bagaman natural na tumutukoy sa Diyos sa konteksto.
- source_word: τοῖς ἀγαπῶσιν αὐτόν
  choice: sa mga umiibig sa kanya
  rationale: Tumpak na naghahatid ng datibo at ng nagpapatuloy o kinagawiang pag-ibig na ipinahihiwatig ng kasalukuyang pandiwaring Griyego.
theological_decisions:
- issue: Diwa ng πειρασμός sa Santiago 1:12
  choice: pagsubok
  alternative: tukso o paglalagay sa pagsubok
  rationale: Binibigyang-diin ng agarang pangungusap ang pagtitiis, pagpapatunay, at gantimpala. Gayunman, hindi inaalis ang mas malawak na saklaw ng salitang Griyego; itinatala ito sa talababa.
- issue: Simuno ng ἐπηγγείλατο
  choice: pinanatiling di-tahas sa saling “ipinangako niya”
  alternative: “ipinangako ng Diyos”
  rationale: Walang tahasang pangngalang simuno sa sugnay na Griyego. Malinaw sa konteksto na Diyos ang natural na tinutukoy, ngunit hindi ito idinaragdag sa pangunahing teksto.
- issue: Ugnayan ng “korona” at “buhay”
  choice: korona ng buhay
  alternative: koronang siyang buhay o koronang nagbibigay-buhay
  rationale: Pinananatili ang tunay na pagiging bukás sa kahulugan ng henitibong τῆς ζωῆς sa halip na pumili ng isang paliwanag sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mapalad,” “nagtitiis,” at “umiibig” upang mapanatili ang biblikal na bigat nang hindi nagiging lipas o teknikal. Lahat ng talababa ay may katugmang pananda sa pangunahing teksto.
