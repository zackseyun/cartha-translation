id: JAS.1.5
reference: James 1:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Εἰ δέ τις ὑμῶν λείπεται σοφίας, αἰτείτω παρὰ τοῦ διδόντος θεοῦ πᾶσιν ἁπλῶς καὶ ⸀μὴ ὀνειδίζοντος, καὶ δοθήσεται αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/005.yaml
  text: But if any of you lacks wisdom[a], let him ask of God, who gives to all generously and without reproach[b], and it will be given to him.
translation:
  language: tl
  text: Ngunit kung ang sinuman sa inyo ay kulang sa karunungan, humingi siya sa Diyos, na bukás-palad na nagbibigay sa lahat at hindi nanunumbat[a], at ibibigay iyon sa kaniya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi naghahanap ng mali.”
    reason: lexical_alternative
  - marker: b
    text: Ang mga anyong isahan sa Griyego ay ginagamit bilang pagtukoy sa sinumang tao; sa Tagalog, walang ipinahihiwatig na kasarian ang “siya” at “kaniya.”
    reason: cultural_note
lexical_decisions:
- source_word: Εἰ δέ
  choice: Ngunit kung
  rationale: Ipinahihiwatig ng δέ ang banayad na pag-usad o pagsalungat mula sa naunang talata; natural itong naipapahayag ng “Ngunit kung” nang hindi pinalalabis ang pagsalungat.
- source_word: τις ὑμῶν
  choice: ang sinuman sa inyo
  rationale: Pinananatili nito ang di-tiyak at tuwirang pastoral na pagtukoy sa sinumang kabilang sa mga mambabasa.
- source_word: λείπεται σοφίας
  choice: ay kulang sa karunungan
  rationale: Natural at malinaw na ipinapahayag nito ang pagiging nangangailangan ng σοφία, nang hindi nililimitahan ang karunungan sa isang partikular na uri.
- source_word: αἰτείτω παρὰ τοῦ ... θεοῦ
  choice: humingi siya sa Diyos
  rationale: Ang pangatlong-panauhang pautos ay naihahayag sa dignificado at likas na Tagalog; ipinakikita ng “sa Diyos” ang pinagmumulan ng hinihinging karunungan.
- source_word: τοῦ διδόντος θεοῦ πᾶσιν
  choice: sa Diyos, na ... nagbibigay sa lahat
  rationale: Pinananatili ang paglalarawan sa Diyos bilang siyang nagbibigay at ang malawak na saklaw ng πᾶσιν.
- source_word: ἁπλῶς
  choice: bukás-palad na
  rationale: Sa konteksto ng pagbibigay, ipinahahayag nito ang pagiging mapagbigay at hindi nag-aatubili, na malamang na diwa ng salita rito.
- source_word: μὴ ὀνειδίζοντος
  choice: hindi nanunumbat
  rationale: Ang “nanunumbat” ay natural na modernong Tagalog para sa hindi paninisi o pagpapahiya sa humihingi dahil sa kaniyang pangangailangan.
- source_word: δοθήσεται αὐτῷ
  choice: ibibigay iyon sa kaniya
  rationale: Pinananatili ang panghinaharap na balintiyak na pangako; malinaw na tumutukoy ang “iyon” sa karunungan.
theological_decisions:
- issue: Pangkalahatang diwa ng panlalaking isahan
  choice: humingi siya ... sa kaniya
  alternative: humingi sila ... sa kanila; humingi ang taong iyon ... sa taong iyon
  rationale: Ang mga anyong isahan sa Griyego ay tumutukoy sa sinumang tao. Sa Tagalog, ang “siya” at “kaniya” ay likas nang walang kasariang gramatikal, kaya napapanatili kapwa ang isahan at ang pangkalahatang saklaw.
- issue: Diwa ng pagbibigay ng Diyos sa ἁπλῶς
  choice: bukás-palad na nagbibigay
  alternative: nagbibigay nang sagana; nagbibigay nang tapat at walang pag-aalinlangan
  rationale: Ipinahahayag ng “bukás-palad” ang malaya at mapagbigay na pagkakaloob nang hindi nagdaragdag ng ideya ng materyal na kasaganaan.
- issue: Saklaw ng πᾶσιν
  choice: sa lahat
  alternative: sa bawat isa
  rationale: Pinananatili ang malawak at di-tiyak na pananalita ng Griyego, nang hindi nilulutas kung ang saklaw ay lahat ng tao sa pangkalahatan o lahat ng humihingi sa konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignificado, at angkop sa pampublikong pagbasa. Ginamit ang “bukás-palad” bilang likas na katumbas ng mapagbigay na diwa ng ἁπλῶς, at “nanunumbat” bilang karaniwang salitang nauunawaan para sa ὀνειδίζω.
