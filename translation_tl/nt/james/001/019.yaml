base_translation:
  language: en
  yaml_path: translation/nt/james/001/019.yaml
  text: 'Know this[a], my beloved brothers: let every man be quick to hear, slow to speak, slow to anger[c][b],'
translation:
  language: tl
  text: 'Alamin ninyo ito[a], mga minamahal kong kapatid[b]: maging mabilis ang bawat tao sa pakikinig, mabagal sa pagsasalita, at mabagal magalit,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Alam ninyo ito.” Ang pandiwang Griyego ay maaaring unawain bilang pasalaysay sa halip na pautos.'
    reason: alternative_reading
  - marker: b
    text: Ang Griyego ay may anyong panlalaking maramihan na literal na “mga kapatid na lalaki,” ngunit malamang na tinutukoy rito ang buong komunidad ng mga mananampalataya, mga lalaki at mga babae.
    reason: source_form_and_scope
lexical_decisions:
- source_word: Ἴστε
  choice: Alamin ninyo ito
  rationale: Maaaring unawain ang anyo bilang pautos o pasalaysay. Pinili ang pautos dahil ang kasunod ay tuwirang tagubilin; idinagdag ang “ito” upang maging likas sa Filipino ang tungkulin nito sa diskurso. Inilagay sa talababa ang pasalaysay na pagbasa.
- source_word: ἀδελφοί μου ἀγαπητοί
  choice: mga minamahal kong kapatid
  rationale: Ang “kapatid” ay likas at marangal na tawag sa kapwa mananampalataya sa Filipino at hindi minamarkahan ang kasarian, samantalang ang Griyego ay nasa panlalaking maramihan ngunit malamang na tumutukoy sa buong komunidad.
- source_word: ἔστω δὲ πᾶς ἄνθρωπος
  choice: ang bawat tao ay dapat maging
  rationale: Ipinahahayag ng “ay dapat maging” ang lakas ng ikatlong-panauhang pautos. Ang “bawat tao” ay tuwirang nagsasaad ng pangkalahatang saklaw ng isahang πᾶς ἄνθρωπος; hindi na kailangang gawing tahasang panlalaki sa Filipino.
- source_word: ταχὺς εἰς τὸ ἀκοῦσαι
  choice: mabilis makinig
  rationale: Pinananatili nito ang larawan ng pagiging mabilis o maagap sa pakikinig at ang paralelismo sa dalawang kasunod na “mabagal.”
- source_word: βραδὺς εἰς τὸ λαλῆσαι
  choice: mabagal magsalita
  rationale: Tuwiran, natural, at angkop sa marangal na register na salin ng pariralang Griyego.
- source_word: βραδὺς εἰς ὀργήν
  choice: mabagal magalit
  rationale: Likas na Filipino para sa pagiging hindi madaling mapukaw sa galit, nang hindi pinabibigat ang ὀργή bilang pormal o hatol na poot.
theological_decisions:
- issue: Pautos o pasalaysay ang Ἴστε
  choice: 'Pautos: “Alamin ninyo ito”'
  alternative: 'Pasalaysay: “Alam ninyo ito”'
  rationale: Kapuwa posible sa anyong Griyego. Ang pautos ay mas angkop sa daloy ng mga tagubilin, ngunit hindi inalis ang tunay na gramatikal na posibilidad ng pasalaysay.
- issue: Kasarian ng katawagang ἀδελφοί
  choice: “mga ... kapatid” sa pangunahing teksto
  alternative: 'Mas literal sa gramatikal na anyo: “mga ... kapatid na lalaki”'
  rationale: Bagaman panlalaking maramihan ang anyong Griyego, malamang na kinakausap ni Santiago ang buong komunidad ng mga mananampalataya. Ang “kapatid” sa Filipino ay tumpak na terminong pampamilya at hindi kailangang tukuyin ang kasarian; nililinaw sa talababa ang anyo ng Griyego.
translation_notes:
  register: 'Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang maikli at balanseng tatluhang paralelismo: “mabilis makinig, mabagal magsalita, at mabagal magalit.” Ginamit ang “kapatid,” na natural sa Filipino at hindi minamarkahan ang kasarian, at iniwasan ang labis na pormal na “poot” o “pagkapoot” para sa ὀργή.'
