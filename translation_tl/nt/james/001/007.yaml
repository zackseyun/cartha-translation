  text: μὴ γὰρ οἰέσθω ὁ ἄνθρωπος ἐκεῖνος ὅτι λήμψεταί τι παρὰ τοῦ κυρίου
base_translation:
  language: en
  yaml_path: translation/nt/james/001/007.yaml
  text: For that man must not suppose that he will receive anything from the Lord,[a]
translation:
  language: tl
  text: Sapagkat huwag isipin ng taong iyon[a] na tatanggap siya ng anuman mula sa Panginoon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, panlalaking isahan ang anyo, ngunit tumutukoy ito bilang kinatawan sa sinumang taong nag-aalinlangan na inilalarawan sa naunang talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ γὰρ
  choice: Sapagkat huwag
  rationale: Pinananatili ng “Sapagkat” ang paliwanag na ugnayan sa naunang talata, at likas na ipinahahayag ng “huwag” ang pagbabawal.
- source_word: οἰέσθω
  choice: isipin
  rationale: Ang οἴομαι ay nangangahulugang isipin o ipalagay. Ang “isipin” ay natural sa Filipino at nagpapanatili sa mental na kilos nang hindi ito ginagawang “asahan.”
- source_word: ὁ ἄνθρωπος ἐκεῖνος
  choice: ang taong iyon
  rationale: Tuwirang tinutukoy nito ang nag-aalinlangang indibidwal sa naunang talata. Ang “tao” ang karaniwang katumbas ng ἄνθρωπος at hindi nagdaragdag ng biyolohikal na kasariang hindi kailangang idiin sa Filipino.
- source_word: ὅτι
  choice: na
  rationale: Likas na ipinakikilala ng “na” ang nilalaman ng hindi niya dapat isipin.
- source_word: λήμψεταί τι
  choice: tatanggap siya ng anuman
  rationale: Pinananatili ng “tatanggap” ang hinaharap na diwa ng λήμψεται, samantalang ang “anuman” ay angkop sa saklaw ng τι sa negatibong pahayag.
- source_word: παρὰ τοῦ κυρίου
  choice: mula sa Panginoon
  rationale: Ipinahahayag ng “mula sa” ang pinagmulan na tinutukoy ng παρά na may genitive. Pinananatili ng “Panginoon” ang titulong κύριος nang hindi tinutukoy nang mas tahasan ang referent kaysa sa Griyego.
theological_decisions:
- issue: Ang tinutukoy ng τοῦ κυρίου
  choice: Panginoon
  alternative: Diyos; Panginoong Diyos
  rationale: κύριος lamang ang ginamit sa Griyego. Pinananatili ng “Panginoon” ang katawagan at ang posibleng kalabuan ng referent sa halip na dagdagan ang teksto.
- issue: Kasarian at kinatawang gamit ng ὁ ἄνθρωπος ἐκεῖνος
  choice: taong iyon
  alternative: lalaking iyon; taong iyon na nag-aalinlangan
  rationale: Bagaman panlalaking isahan ang anyong Griyego, ginagamit ang ἄνθρωπος para sa indibidwal na kumakatawan sa sinumang nag-aalinlangan. Ang “taong iyon” ay tumpak at natural sa Filipino; nililinaw ng talababa ang anyong Griyego.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Sapagkat” upang panatilihin ang lohikal na ugnayan sa naunang talata at ang “huwag isipin” upang mapanatili ang lakas ng pagbabawal.
