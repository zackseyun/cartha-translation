base_translation:
  language: en
  yaml_path: translation/nt/james/001/024.yaml
  text: For he looked at himself and went away[a], and immediately forgot what kind of person he was.
translation:
  language: tl
  text: Sapagkat tiningnan niyang mabuti ang sarili niya at umalis, at agad niyang nalimutan kung anong uri siyang tao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “kung ano siya.” Ang pariralang Griyego ay tumutukoy sa uri o katangian ng taong siya.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατενόησεν
  choice: pinagmasdan
  rationale: Ipinahihiwatig ng pandiwa ang maingat na pagtingin o pagmamasid. Ang “pinagmasdan” ay natural sa tagpo ng salamin at mas matindi kaysa sa payak na “tiningnan.”
- source_word: γὰρ
  choice: Sapagkat
  rationale: Nagbibigay ang γάρ ng paliwanag sa paghahambing sa naunang talata; malinaw na pinananatili ng “Sapagkat” ang ugnayang ito.
- source_word: ἑαυτὸν
  choice: ang sarili niya
  rationale: Tuwirang sinasalin nito ang panghalip na tumutukoy pabalik sa simuno, nang hindi idinaragdag ang “mukha,” na wala sa mismong talata.
- source_word: ἀπελήλυθεν
  choice: saka umalis
  rationale: Bagaman nasa perpektong anyo ang pandiwang Griyego, inilalahad dito ang kasunod na kilos sa maikling paghahambing. Natural sa Filipino ang “saka umalis” at malinaw nitong ipinakikita ang pagkakasunod-sunod.
- source_word: εὐθέως
  choice: agad
  rationale: Tumpak at natural na ipinapahayag ng “agad” ang dagliang pagkalimot.
- source_word: ἐπελάθετο
  choice: nalimutan
  rationale: Ang “nalimutan” ang tuwiran at karaniwang katumbas ng pandiwang nangangahulugang hindi na naalaala.
- source_word: ὁποῖος ἦν
  choice: kung ano ang anyo niya
  rationale: Ang ὁποῖος ay tumutukoy sa katangian o uri. Sa agarang konteksto ng pagtingin sa salamin, natural na ipinahahayag ng “anyo” kung ano siya sa paningin, habang nililinaw sa talababa ang mas malawak at mas literal na posibilidad.
theological_decisions:
- issue: Pangkalahatang gamit ng panlalaking isahan sa halimbawa tungkol sa salamin
  choice: Gumamit ng walang-kasariang panghalip na “niya” at pariralang “anyo niya.”
  alternative: “kung anong uri ng lalaki siya”
  rationale: Bagaman panlalaking isahan ang anyong gramatikal sa Griyego, kumakatawan ang halimbawa sa sinumang tao. Hindi dapat limitahan sa mga lalaki ang saklaw ng pahayag.
- issue: Saklaw ng ὁποῖος ἦν sa konteksto ng salamin
  choice: “kung ano ang anyo niya” sa pangunahing teksto
  alternative: “kung anong uri siyang tao”
  rationale: Pinapaboran ng larawan ng salamin ang panlabas na anyo, ngunit maaaring mas malawak ang pariralang Griyego. Kaya pinananatili sa talababa ang alternatibong tumutukoy sa uri o kalagayan ng tao nang hindi ginagawang tiyak na aral tungkol sa moral na pagkatao.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pinagmasdan” upang mapanatili ang diwa ng maingat na pagtingin, at ang “saka” upang maging natural ang sunod-sunod na kilos. Walang panghalip na may tiyak na kasarian sa Filipino, kaya nananatiling pangkalahatan ang halimbawa.
