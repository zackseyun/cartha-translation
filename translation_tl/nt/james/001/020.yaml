  text: ὀργὴ γὰρ ἀνδρὸς δικαιοσύνην θεοῦ ⸂οὐκ ἐργάζεται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/020.yaml
  text: For a man's anger does not produce God's righteousness.
translation:
  language: tl
  text: Sapagkat ang galit ng tao ay hindi nagbubunga ng katuwiran ng Diyos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀργὴ
  choice: galit
  rationale: Karaniwan at tuwirang katumbas ng matinding galit; angkop sa konteksto ng naunang talata.
- source_word: ἀνδρὸς
  choice: ng tao
  rationale: Dito ay tumutukoy sa tao sa pangkalahatan, hindi lamang sa isang lalaking nasa hustong gulang.
- source_word: δικαιοσύνην θεοῦ
  choice: katuwiran ng Diyos
  rationale: 'Pinananatili ang genitibong parirala at ang tunay na lawak nito: maaaring tumukoy sa katuwirang nauukol sa Diyos o sa katuwirang hinihingi at sinasang-ayunan niya.'
- source_word: οὐκ ἐργάζεται
  choice: hindi nagbubunga
  rationale: Likas sa modernong Tagalog at ipinahahayag na hindi nalilikha o naisasakatuparan ng galit ang tinutukoy na katuwiran.
theological_decisions:
- issue: Kahulugan ng δικαιοσύνη θεοῦ
  choice: katuwiran ng Diyos
  alternative: katuwirang nais ng Diyos
  rationale: Hindi nililimitahan ang parirala sa isang paliwanag lamang; pinananatili ang teolohikal na lawak at pagiging malapit sa anyo ng Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang payak na ayos ng pangungusap at iniwasan ang teknikal o makadenominasyong pananalita.
