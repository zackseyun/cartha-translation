base_translation:
  language: en
  yaml_path: translation/nt/james/001/022.yaml
  text: But be doers of the word[a], and not hearers only, deceiving yourselves.
translation:
  language: tl
  text: Ngunit isabuhay ninyo ang salita at huwag kayong maging mga tagapakinig lamang; dinadaya ninyo ang inyong sarili.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nililinlang ninyo ang inyong sarili,” o “inaakay ninyo ang inyong sarili sa kamalian sa pamamagitan ng maling pangangatwiran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Γίνεσθε
  choice: isabuhay ninyo
  rationale: Ang pangkasalukuyang pautos ay humihimok sa isang patuloy na paraan ng pamumuhay. Kasama ng ποιηταὶ λόγου, likas sa makabagong Tagalog ang “isabuhay ninyo ang salita,” sa halip na ang mas literal ngunit hindi gaanong natural na “maging mga tagagawa.”
- source_word: δὲ
  choice: Ngunit
  rationale: 'Ipinapakita nito ang banayad na pagsalungat sa naunang babala: hindi sapat ang pagtanggap o pakikinig lamang.'
- source_word: ποιηταὶ λόγου
  choice: isabuhay ninyo ang salita
  rationale: Ipinahahayag ng parirala ang paggawa ayon sa sinasabi ng salita. Pinananatili ng “salita” ang ugnayan sa λόγος sa Santiago 1:21, habang malinaw na ipinapakita ng “isabuhay” ang hinihinging pagkilos.
- source_word: ἀκροαταὶ μόνον
  choice: huwag makinig lamang
  rationale: Natural at tuwiran sa Tagalog, at pinananatili ang kaibahan ng pakikinig lamang at aktuwal na pagsunod sa salita.
- source_word: παραλογιζόμενοι
  choice: dinadaya
  rationale: Malinaw nitong ipinahahayag ang pandarayang nakatuon sa sarili. Ang mas tiyak na diwa ng maling pangangatwiran ay inilagay sa talababa upang hindi mawala ang saklaw ng salitang Griyego.
- source_word: ἑαυτούς
  choice: ang inyong sarili
  rationale: Tuwirang katumbas ng panghalip na pabalik sa sarili at angkop sa maramihang “ninyo” sa karaniwang Tagalog.
theological_decisions:
- issue: Kahulugan ng λόγος sa Santiago 1:22
  choice: “ang salita,” bilang mensaheng tinanggap mula sa Diyos
  alternative: “ang mensahe” o “ang turo”
  rationale: Iniuugnay ito ng konteksto sa “salitang itinanim” sa 1:21. Pinananatili ng “salita” ang ugnayang ito at ang teolohikal na bigat nang hindi nililimitahan sa isang mas makitid na pakahulugan.
- issue: Lakas ng pautos na Γίνεσθε
  choice: Patuloy na isabuhay ang salita
  alternative: “Maging mga tagagawa ng salita” o ingressive na “magsimula kayong maging”
  rationale: Ang pangkasalukuyang pautos ay likas na tumutukoy sa patuloy na gawi. Ipinahahayag ito ng “isabuhay ninyo” sa natural na Tagalog.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pandiwang “isabuhay” upang natural na maipahayag ang semantikong kabuuan ng “maging mga tagagawa ng salita,” habang pinananatili ang “salita” para sa λόγος. Ang [a] ay nasa hulihan dahil tumutukoy ito sa “dinadaya ang inyong sarili.”
