  text: πολλὰ γὰρ πταίομεν ἅπαντες. εἴ τις ἐν λόγῳ οὐ πταίει, οὗτος τέλειος ἀνήρ, δυνατὸς χαλιναγωγῆσαι καὶ ὅλον τὸ σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/002.yaml
  text: For we all stumble in many ways[a]. If anyone does not stumble in word, this one is a mature man[c][b], able also to bridle the whole body.
translation:
  language: tl
  text: Sapagkat tayong lahat ay natitisod sa maraming paraan. Kung ang sinuman ay hindi natitisod sa pananalita[a], siya ay isang lalaking[c] ganap na ang pagkatao[b] at kaya rin niyang rendahan ang buong katawan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “sa salita,” ibig sabihin, sa pagsasalita o sa sinasabi niya.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin ang salitang Griyego bilang “perpekto” o “ganap.” Dito, malamang na tumutukoy ito sa moral na pagkahinog at kabuuan ng pagkatao, hindi sa lubos na kawalan ng kasalanan.
    reason: lexical_alternative
  - marker: c
    text: “Lalaki” ang literal na salitang Griyego, ngunit ginagamit ito rito bilang kinatawan sa isang pangkalahatang pahayag.
    reason: cultural_note
lexical_decisions:
- source_word: πολλὰ
  choice: sa maraming paraan
  rationale: Ginagamit ang anyong maramihan bilang pang-abay at tumutukoy sa maraming uri o aspeto ng pagkakamali, hindi sa maraming bagay bilang layon.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na kaugnayan nito sa naunang babala tungkol sa mga guro.
- source_word: πταίομεν / πταίει
  choice: natitisod
  rationale: Pinananatili ang metapora ng pagkatisod habang ipinahihiwatig ang moral na pagkakamali.
- source_word: ἅπαντες
  choice: tayong lahat
  rationale: Malinaw na pinananatili ang mariing pagsasama ng may-akda sa pangkalahatang pahayag.
- source_word: εἴ τις
  choice: Kung ang sinuman
  rationale: Likas na Filipino para sa di-tiyak at pangkalahatang kondisyong ipinahahayag ng Griyego.
- source_word: ἐν λόγῳ
  choice: sa pananalita
  rationale: Tumutukoy sa pagsasalita o sa sinasabi ng isang tao; mas natural ito kaysa sa literal na “sa salita.”
- source_word: οὗτος
  choice: siya
  rationale: Sa Filipino, natural na naituturo pabalik ng “siya” ang taong kababanggit lamang; ang literal na “ang isang ito” ay magiging pilit.
- source_word: τέλειος
  choice: ganap ang pagkatao
  rationale: Ipinahahayag ang moral na pagkahinog at kabuuan ng pagkatao nang hindi awtomatikong nagpapahiwatig ng ganap na kawalan ng kasalanan.
- source_word: ἀνήρ
  choice: lalaki
  rationale: Pinananatili ang tahasang panlalaking pangngalan sa Griyego, habang ipinakikita ng “ang sinuman” na pangkalahatan ang aplikasyon.
- source_word: δυνατὸς
  choice: kaya
  rationale: Direktang ipinahahayag ang kakayahan sa natural na modernong Filipino.
- source_word: χαλιναγωγῆσαι
  choice: rendahan
  rationale: Pinananatili ang larawan ng pagpigil sa kabayo sa pamamagitan ng renda, na patuloy na ginagamit sa mga kasunod na talata.
- source_word: καὶ
  choice: rin
  rationale: Ipinahahayag ang dagdag na kakayahang pamahalaan ang buong katawan bukod sa pananalita.
theological_decisions:
- issue: Kahulugan ng τέλειος sa kontekstong etikal
  choice: ganap ang pagkatao, sa diwa ng moral na pagkahinog o kabuuan
  alternative: perpekto o ganap na walang kasalanan
  rationale: Sa Santiago, maaaring tumukoy ang τέλειος sa hinog at buo na pagkatao. Hindi dapat alisin ang saklaw na “ganap,” ngunit maiiwasang ipakahulugan itong lubos na kawalan ng kasalanan, lalo na dahil sinasabi ng unang pangungusap na lahat ay natitisod.
- issue: Kinatawang panlalaki sa ἀνήρ
  choice: lalaki, na may pangkalahatang aplikasyon
  alternative: tao
  rationale: Ang Griyego ay tahasang gumagamit ng ἀνήρ, ngunit ang εἴ τις (“kung ang sinuman”) ay nagpapakitang ang pahayag ay isang pangkalahatang halimbawa at hindi nililimitahan sa mga lalaki lamang.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “natitisod” at “rendahan” upang mapanatili ang magkakaugnay na mga metapora ng orihinal. Ang “ganap ang pagkatao” ay piniling iwasan ang tunog na pisikal na edad ng “may-gulang” habang pinananatili ang etikal na diwa ng τέλειος.
