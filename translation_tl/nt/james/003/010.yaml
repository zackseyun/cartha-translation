base_translation:
  language: en
  yaml_path: translation/nt/james/003/010.yaml
  text: From the same mouth come blessing and cursing. My brothers[a], these things ought not to be so.
translation:
  language: tl
  text: Mula sa iisang bibig ay lumalabas ang pagpapala at sumpa. Mga kapatid ko,[a] hindi dapat mangyari ang mga bagay na ito sa ganitong paraan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, panlalaking maramihan ang salita, ngunit sa konteksto ay malamang na tinutukoy ni Santiago ang buong komunidad ng mga mananampalataya, kapwa lalaki at babae.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ αὐτοῦ στόματος
  choice: Mula sa iisang bibig
  rationale: Likas sa modernong Tagalog ang “mula sa” para sa pinagmumulan, at pinananatili ng “iisang bibig” ang larawan ng magkasalungat na pananalitang nagmumula sa parehong bibig.
- source_word: ἐξέρχεται
  choice: lumalabas
  rationale: Tuwirang inilalarawan nito ang pananalitang nagmumula sa bibig. Ang anyong Tagalog ay natural kahit dalawa ang magkatuwang na paksa.
- source_word: εὐλογία
  choice: pagpapala
  rationale: Pinananatili nito ang karaniwang kahulugan at ang malinaw na pagsalungat sa “sumpa,” habang nauunawaan sa konteksto bilang binibigkas na pagpapala.
- source_word: κατάρα
  choice: sumpa
  rationale: Ang “sumpa” ang tuwiran at karaniwang katumbas sa Tagalog at natural na kapares ng “pagpapala.”
- source_word: οὐ χρή
  choice: hindi dapat
  rationale: Ipinahahayag nito ang moral na di-pagiging nararapat na idinidiin ng Griyego, sa malinaw at kasalukuyang Tagalog.
- source_word: ἀδελφοί μου
  choice: Mga kapatid ko
  rationale: Ang “mga kapatid” ay natural na pantawag sa buong sambayanan ng mga mananampalataya sa Tagalog. Hindi minamarkahan ng karaniwang salitang “kapatid” ang kasarian, kaya naipahihiwatig nito ang malamang na saklaw ng panawagan habang itinatala sa talababa ang anyong panlalaki ng Griyego.
- source_word: ταῦτα οὕτως γίνεσθαι
  choice: mangyari nang ganito ang mga bagay na ito
  rationale: Pinananatili nito ang pangmaramihang demonstratibo at ang diwa ng οὕτως na “nang ganito,” nang hindi nilulutas o pinapaliit ang tinutukoy ni Santiago.
theological_decisions:
- issue: Saklaw ng kasariang tinutukoy sa ἀδελφοί μου
  choice: Mga kapatid ko
  alternative: Mga kapatid kong lalaki
  rationale: Panlalaking maramihan ang anyong Griyego, ngunit karaniwan itong ginagamit bilang pantawag sa sama-samang komunidad ng mga mananampalataya. Dahil hindi likas na may markang pangkasarian ang “kapatid” sa Tagalog, ito ang pinakatumpak at natural na pangunahing salin; pinananatili sa talababa ang impormasyong panggramatika.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang larawan ng iisang bibig at ang matinding pagsalungat ng pagpapala at sumpa; iniwasan ang labis na pormal na “nararapat” upang maging natural ang pangungusap.
