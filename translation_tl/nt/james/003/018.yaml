  text: And the fruit of righteousness is sown in peace by those who make peace[a][b].
translation:
  language: tl
  text: At ang bunga ng katuwiran ay inihahasik ng mga gumagawa ng kapayapaan sa kapayapaan[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bunga ng katarungan.” Maaaring taglay ng salitang Griyego ang parehong diwa ng moral na katuwiran at ng katarungan sa pakikipag-ugnayan o batas.
    reason: lexical_alternative
  - marker: b
    text: O “para sa mga gumagawa ng kapayapaan.” Maaaring unawain sa ibang paraan ang anyong datibo sa Griyego, bagaman sa tabi ng pasibong pandiwa ay mas malamang ang pag-unawang ang mga gumagawa ng kapayapaan ang naghahasik.
    reason: alternative_reading
lexical_decisions:
- source_word: καρπὸς
  choice: bunga
  rationale: Pinananatili ng “bunga” ang metapora at ang anyong leksikal ng pangngalang Griyego; posible rin ang diwang “ani,” ngunit hindi iyon ang pangunahing kahulugan ng salita.
- source_word: δὲ
  choice: At
  rationale: Mahinang pang-ugnay ang δέ rito, hindi matinding pagsalungat. Likas na inuugnay ng “At” ang pangungusap sa naunang paglalarawan sa karunungang mula sa itaas.
- source_word: δικαιοσύνης
  choice: katuwiran
  rationale: Ang “katuwiran” ang likas at malawak na katumbas sa Tagalog, na maaaring tumukoy sa matuwid na asal o kalagayan. Maaaring taglay rin ng salita ang diwang panlipunan o legal na “katarungan,” kaya inilagay iyon sa talababa.
- source_word: ἐν εἰρήνῃ
  choice: sa kapayapaan
  rationale: Pinananatili ng parirala ang larawan ng paghahasik at ang posibilidad na tumukoy ito sa paraan o kalagayan kung paano isinasagawa ang paghahasik.
- source_word: σπείρεται
  choice: inihahasik
  rationale: Ang aspektong imperpektibo ng pangkasalukuyang pandiwang pasibo ay natural na naipahahayag ng “inihahasik,” habang nananatili ang pasibong tinig at metapora.
- source_word: τοῖς ποιοῦσιν εἰρήνην
  choice: ng mga gumagawa ng kapayapaan
  rationale: 'Sa tabi ng pasibong pandiwa, pinakamalamang na ang datibo ay tumutukoy sa gumaganap: sila ang naghahasik. Tahasang sinasalamin ng “gumagawa ng kapayapaan” ang ποιέω + εἰρήνην, bagaman posible ring unawain ang datibo bilang “para sa.”'
theological_decisions:
- issue: Kahulugan ng “bunga ng katuwiran”
  choice: Pinanatili ang pariralang “bunga ng katuwiran” upang maipahayag ang bungang may katangiang matuwid nang hindi nilulutas ang eksaktong ugnayan ng genitibo.
  alternative: “Ani na binubuo ng katuwiran” o “bungang nagbubunga ng katuwiran.”
  rationale: 'Maaaring deskriptibo o appositional ang δικαιοσύνης: ang bunga o ani ay katuwiran o matuwid ang katangian. Ang tuwirang parirala sa Tagalog ay nagpapanatili sa tunay na kalabuan at teolohikal na tensiyon.'
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Pinanatili ang agrikultural na metapora at ang pag-uulit ng “kapayapaan,” gaya ng Griyego. Ginamit ang “katuwiran” bilang pangunahing salin at ipinaliwanag sa talababa ang posibleng diwang “katarungan.”
