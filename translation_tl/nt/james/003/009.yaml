base_translation:
  language: en
  yaml_path: translation/nt/james/003/009.yaml
  text: With it we bless the Lord and Father[b][a], and with it we curse people who have been made according to the likeness of God.
translation:
  language: tl
  text: Sa pamamagitan nito ay pinagpapala natin ang Panginoon at Ama[a], at sa pamamagitan din nito ay isinusumpa natin ang mga tao[b] na ginawa ayon sa wangis ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring unawain bilang “ang Panginoon, na siyang Ama.” Maaaring nagpapaliwanag ang “Ama” kung sino ang “Panginoon,” o maaaring magkatambal na katawagan ang dalawa para sa Diyos.
    reason: alternative_reading
  - marker: b
    text: Ang Griyegong salita ay tumutukoy rito sa mga tao o sangkatauhan sa pangkalahatan, hindi lamang sa mga lalaki.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν αὐτῇ
  choice: sa pamamagitan nito
  rationale: Tumutukoy ito sa dila sa naunang konteksto at malinaw na nagpapahayag ng gamit o kasangkapan sa natural na Tagalog.
- source_word: εὐλογοῦμεν
  choice: pinupuri natin
  rationale: Kapag Diyos ang layon, natural na ipinahihiwatig ng εὐλογέω ang pagpupuri o pagdakila. Mas malinaw ito sa modernong Tagalog kaysa sa literal na “pinagpapala natin,” bagaman nananatili ang matinding pagsalungat nito sa pagsumpa.
- source_word: τὸν κύριον καὶ πατέρα
  choice: ang Panginoon at Ama
  rationale: Pinananatili ang tuwirang koordinasyon ng dalawang katawagan at hindi ipinipilit kung ang ikalawa ay paliwanag sa una o kaparis na pagtukoy sa Diyos.
- source_word: καταρώμεθα
  choice: isinusumpa natin
  rationale: Tuwiran at natural itong katumbas na nagpapanatili sa bigat ng moral na pagsalungat sa pagpupuri sa Diyos.
- source_word: τοὺς ἀνθρώπους
  choice: ang mga tao
  rationale: Pangkalahatang tumutukoy ang salita sa sangkatauhan, hindi lamang sa mga lalaki; likas at saklaw ito ng “mga tao” sa Tagalog.
- source_word: καθ’ ὁμοίωσιν θεοῦ
  choice: ayon sa wangis ng Diyos
  rationale: Malapit nitong pinananatili ang pormal na diwa ng καθ’ ὁμοίωσιν at ang alusyon sa pananalita tungkol sa paglikha.
- source_word: γεγονότας
  choice: na ginawa
  rationale: Ipinahahayag nito ang naganap na pagkakagawa at ang nananatiling kalagayan ng mga tao ayon sa wangis ng Diyos, nang hindi ginagawang tahasang paksa ang Diyos sa pandiwa.
theological_decisions:
- issue: Ugnayan ng “Panginoon” at “Ama”
  choice: ang Panginoon at Ama
  alternative: ang Panginoon, na siyang Ama
  rationale: Maaaring appositional ang Griyego, ngunit pinananatili ng salin ang tunay na kalabuan sa halip na tiyaking paliwanag lamang ang “Ama” sa “Panginoon.”
- issue: Pangkalahatang saklaw ng ἀνθρώπους
  choice: mga tao
  alternative: mga nilalang na tao
  rationale: Ang tinutukoy ay lahat ng tao bilang mga ginawang ayon sa wangis ng Diyos, hindi isang kasarian lamang.
- issue: Pagkakagawa ayon sa wangis ng Diyos
  choice: ginawa ayon sa wangis ng Diyos
  alternative: naging kawangis ng Diyos
  rationale: Pinananatili nito ang alusyon sa paglikha at ang diwa ng naganap na paggawa, habang iniiwasang palitan ang parirala ng mas malakas na pormulasyong maaaring magpawalang-bisa sa “ayon sa.”
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “sa pamamagitan nito” upang malinaw na tumukoy sa dila bilang kasangkapan. Pinili ang “pinupuri” bilang natural na pananalita kapag Diyos ang layon ng εὐλογέω, at pinanatili ang “Panginoon at Ama” upang huwag lutasin nang labis ang sintaktikong ugnayan ng dalawang titulo.
