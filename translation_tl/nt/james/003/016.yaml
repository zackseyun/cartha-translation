  text: ὅπου γὰρ ζῆλος καὶ ἐριθεία, ἐκεῖ ἀκαταστασία καὶ πᾶν φαῦλον πρᾶγμα.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/016.yaml
  text: For where jealousy and selfish ambition are[b][a], there is disorder and every vile practice.
translation:
  language: tl
  text: Sapagkat kung saan may inggit[a] at makasariling ambisyon, naroon ang kaguluhan at bawat masamang gawain.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “paninibugho.” Ang salitang Griyego ay maaari ring mangahulugang “sigasig,” ngunit malinaw na negatibo ang diwa nito rito.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “bawat masamang bagay” o “bawat masamang gawa.” Sa literal, “bawat mababang uri ng bagay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου
  choice: kung saan
  rationale: Ipinakikilala nito ang isang pangkalahatang kalagayang panlunan; likas sa Filipino ang “kung saan” at pinananatili ang ugnayang “kung saan… naroon…” kasama ng ἐκεῖ.
- source_word: γὰρ
  choice: sapagkat
  rationale: Pinananatili ang paliwanag na kaugnayan ng talata sa naunang pahayag.
- source_word: ζῆλος
  choice: inggit
  rationale: Sa konteksto ng 3:14–15, malinaw na isang bisyo ang tinutukoy. Karaniwan at tuwiran sa modernong Filipino ang “inggit”; maaari rin itong isalin na “paninibugho,” samantalang hindi angkop dito ang positibong “sigasig.”
- source_word: ἐριθεία
  choice: makasariling ambisyon
  rationale: Ipinahahayag nito ang paghahangad ng sariling kapakanan o pag-angat na nagbubunga ng pagpapangkat at tunggalian. Malinaw sa kasalukuyang Filipino ang pariralang ito.
- source_word: ἐκεῖ
  choice: naroon
  rationale: Tumutugon ito sa ὅπου at pinananatili ang mariing ayos na “kung saan… naroon…”.
- source_word: ἀκαταστασία
  choice: kaguluhan
  rationale: Tumutukoy ito sa pagkakagulo, kawalan ng kaayusan, o ligalig sa pamayanan, hindi lamang sa pagkalito ng isip.
- source_word: πᾶν
  choice: bawat
  rationale: Sa isahang πρᾶγμα, ang “bawat” ang likas na katumbas at pinananatili ang saklaw ng pahayag.
- source_word: φαῦλον
  choice: masamang
  rationale: Ipinahahayag nito ang mababa o masamang uri sa moral na diwa. Ang “masamang” ay malinaw at marangal na gamit sa Filipino nang hindi labis na pinatitindi ang salita.
- source_word: πρᾶγμα
  choice: gawain
  rationale: Bagaman maaari itong mangahulugang “bagay” o “usapin,” sa kontekstong moral ay mas natural at tiyak ang “gawain,” na tumutukoy sa konkretong masamang asal o gawa.
theological_decisions:
- issue: Negatibong diwa ng ζῆλος sa konteksto
  choice: Isinalin bilang “inggit,” isang negatibong ugali.
  alternative: “Paninibugho”; o “sigasig” sa ibang konteksto.
  rationale: Ang agarang konteksto (3:14–15) ay tumutukoy sa mapait na ζῆλος at makasariling ambisyon bilang mga tanda ng makalupa at di-espirituwal na karunungan. Kaya hindi angkop dito ang neutral o positibong “sigasig,” ngunit pinananatili sa talababa ang lehitimong alternatibong “paninibugho.”
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Pinanatili ang maikling, kasabihang balangkas na “kung saan… naroon…” at iniwasan ang bokabularyong nakatali sa isang denominasyon.
