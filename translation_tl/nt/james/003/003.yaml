base_translation:
  language: en
  yaml_path: translation/nt/james/003/003.yaml
  text: If we put bits into the mouths of horses so that they obey us[a], we also guide their whole bodies.
translation:
  language: tl
  text: Kung nilalagyan natin ng preno[a] ang mga bibig ng mga kabayo para sumunod sila sa atin, ginagabayan din natin ang buong katawan ng bawat isa sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “paningkaw” o “renda,” ngunit higit na tiyak na tumutukoy rito sa bahaging inilalagay sa bibig ng kabayo.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Kung
  rationale: Ipinahahayag ang kondisyong nagpapakilala sa halimbawa. Hindi na kailangang gawing tahasang “Ngunit” ang banayad na pang-ugnay na δέ sa natural na Tagalog.
- source_word: χαλινοὺς
  choice: preno
  rationale: Sa kontekstong inilalagay ito sa bibig ng kabayo, ang tinutukoy ay ang bit o bahaging nasa bibig, hindi lamang ang renda o ang buong panali sa ulo.
- source_word: εἰς τὰ στόματα βάλλομεν
  choice: nilalagyan natin … ang bibig
  rationale: Natural na Tagalog para sa paglalagay ng isang bagay sa bibig; pinananatili ang diwa ng kilos na ipinahahayag ng εἰς at βάλλομεν.
- source_word: εἰς τὸ πείθεσθαι αὐτοὺς ἡμῖν
  choice: para sumunod sila sa atin
  rationale: Malinaw at natural na ipinahahayag ang layunin ng articular infinitive at ang kahulugan ng πείθεσθαι kasama ng datibong ἡμῖν.
- source_word: καὶ ὅλον τὸ σῶμα αὐτῶν μετάγομεν
  choice: naigagabay din natin ang buo nilang katawan
  rationale: Ang “naigagabay” ay angkop sa pagkontrol sa direksiyon ng kabayo, at ang “buo nilang katawan” ay natural na distributibong pagtutumbas sa Tagalog.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang salitang “preno” para sa bit ng kabayo at nilinaw sa talababa ang mas teknikal o mas malawak na mga katumbas.
