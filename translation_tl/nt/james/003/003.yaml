  verdict: revise
  source_fidelity: Ang “Kung,” “para sumunod sila sa atin,” at ang larawang paglalagay ng isang kasangkapan sa bibig ng kabayo ay tapat sa kondisyunal at layuning ipinahahayag ng Griyego. Ang “preno” ay maaaring tumukoy sa bit ng kabayo sa kontekstong ito, at naaangkop ang talababa upang ibukod ito sa mas malawak na paningkaw o renda. Gayunman, ang “naigagabay” ay may posibleng diwang abilitatibo (‘nagagawang gabayan’) na wala sa μετάγομεν; mas tuwirang isinasalin ito ng “ginagabayan.”
  naturalness: Natural ang karamihan ng pangungusap sa makabagong Filipino. Mas malinaw at mas matatas ang “mga bibig ng mga kabayo” para sa maramihang anyo ng pinagmulan, at “ang buong katawan ng bawat isa sa kanila” upang malinaw na ang bawat kabayo, hindi isang kolektibong katawan, ang tinutukoy.
  terminology: Pinananatili ang “preno” bilang karaniwang katawagan sa bit sa gamit na pangkabayo, habang ang talababa ay wastong nagbibigay ng “paningkaw” at “renda” bilang mas malawak o kaugnay na mga katawagan. Walang isyung teolohikal o pangngalan.
