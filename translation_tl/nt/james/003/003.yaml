  - severity: low
    issue: Ang “bibig ng mga kabayo” at “buo nilang katawan” ay bahagyang hindi tiyak sa maramihang saklaw.
    rationale: Ang pinagmulan ay may maramihang ‘mga bibig’ at distributibong ‘buong katawan’ ng mga kabayo; maaaring gawing mas malinaw ito nang hindi binabago ang diwa.
