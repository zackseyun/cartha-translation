id: JAS.3.17
reference: James 3:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἡ δὲ ἄνωθεν σοφία πρῶτον μὲν ἁγνή ἐστιν, ἔπειτα εἰρηνική, ἐπιεικής, εὐπειθής, μεστὴ ἐλέους καὶ καρπῶν ἀγαθῶν, ⸀ἀδιάκριτος, ἀνυπόκριτος·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/017.yaml
  text: But the wisdom from above is first pure[a], then peaceable, gentle, open to reason, full of mercy and good fruits, impartial, sincere.
translation:
  language: tl
  text: Ngunit ang karunungang mula sa itaas ay una sa lahat dalisay, pagkatapos ay mapagpayapa, mahinahon, handang makinig, puspos ng awa at mabubuting bunga, walang kinikilingan[a], at hindi mapagkunwari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi hati ang kalooban”; maaari ring maunawaan ang salitang Griyego bilang “walang pag-aalinlangan o pagdududa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνωθεν
  choice: mula sa itaas
  rationale: Pinananatili nito ang larawan ng pinagmumulang nasa itaas at ang kaibahan sa makalupang karunungan sa konteksto, nang hindi ito labis na nililinaw bilang “mula sa langit.”
- source_word: σοφία
  choice: karunungan
  rationale: Ito ang karaniwan at malinaw na katumbas sa Tagalog para sa uri ng karunungang inilalarawan.
- source_word: πρῶτον μὲν
  choice: una sa lahat
  rationale: Malinaw na itinatampok ang unang katangian sa sunod-sunod na paglalarawan.
- source_word: ἁγνή
  choice: dalisay
  rationale: Ipinahahayag ang moral na kalinisan at kawalan ng karumihan o halong masama.
- source_word: ἔπειτα
  choice: pagkatapos
  rationale: Natural na ipinahihiwatig ang mga katangiang kasunod ng una.
- source_word: εἰρηνική
  choice: mapagpayapa
  rationale: Tumutukoy ito sa pagkiling sa kapayapaan at pagtataguyod nito, hindi lamang sa pagiging tahimik.
- source_word: ἐπιεικής
  choice: mahinahon
  rationale: Naghahatid ito ng pagiging banayad, makatuwiran, at hindi mapilit sa paraang natural sa modernong Tagalog.
- source_word: εὐπειθής
  choice: handang makinig
  rationale: Ipinahahayag ang pagiging bukás sa pangangatuwiran at payo, hindi matigas ang ulo, nang hindi nagpapahiwatig ng madaling malinlang.
- source_word: μεστὴ ἐλέους
  choice: puspos ng awa
  rationale: Pinananatili ang diwa ng kasaganaan o kapuspusan ng awa sa isang marangal at pamilyar na parirala.
- source_word: καρπῶν ἀγαθῶν
  choice: mabubuting bunga
  rationale: Pinananatili ang maramihang anyo at ang metapora ng nakikitang mabubuting resulta.
- source_word: ἀδιάκριτος
  choice: walang kinikilingan
  rationale: Angkop ito sa panlipunan at moral na daloy ng talaan at sa pagtalakay ni Santiago tungkol sa pagtatangi, habang inilalahad sa talababa ang tunay na leksikal na kalabuan.
- source_word: ἀνυπόκριτος
  choice: hindi mapagkunwari
  rationale: Tuwirang ipinahahayag ang kawalan ng pagkukunwari at huwad na anyo.
theological_decisions:
- issue: Pag-unawa sa ἀδιάκριτος
  choice: walang kinikilingan
  alternative: hindi hati ang kalooban; walang pag-aalinlangan o pagdududa
  rationale: Maaaring tumukoy ang salita sa kawalan ng pagtatangi, ngunit maaari rin itong maunawaan bilang hindi nahahati o walang pag-aalinlangan. Pinakamainam sa daloy ng etikang talaan ang “walang kinikilingan,” lalo na dahil tinatalakay ni Santiago ang pagtatangi; gayunman, pinananatili sa talababa ang ibang makatwirang pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Pinanatili ang metaporang “mabubuting bunga” at ang “mula sa itaas,” habang gumamit ng mga pariralang karaniwan sa kasalukuyang wika gaya ng “handang makinig.”
