  text: εἰ δὲ ζῆλον πικρὸν ἔχετε καὶ ἐριθείαν ἐν τῇ καρδίᾳ ὑμῶν, μὴ κατακαυχᾶσθε καὶ ψεύδεσθε κατὰ τῆς ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/014.yaml
  text: But if you have bitter jealousy and selfish ambition in your hearts[d][c][b][a], do not boast and lie against the truth.
translation:
  language: tl
  text: Ngunit kung may mapait kayong inggit at makasariling ambisyon sa inyong mga puso, huwag kayong magmalaki at magsinungaling laban sa katotohanan.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mapait na inggit” ay maaari ring isaling “mapait na sigasig” o “mapait na pagkainggit.”
    reason: lexical_alternative
  - marker: b
    text: Ang “makasariling ambisyon” ay maaari ring isaling “pakikipag-agawan” o “pagkakampi-kampi.”
    reason: lexical_alternative
  - marker: c
    text: Ang “magsinungaling laban sa katotohanan” ay maaari ring isaling “magsalita ng kasinungalingang salungat sa katotohanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ζῆλον πικρὸν
  choice: mapait na inggit
  rationale: Maaaring tumukoy ang ζῆλος sa sigasig o inggit. Dahil negatibo ang konteksto at kaugnay ito ng ἐριθείαν, nangingibabaw dito ang diwa ng inggit; tuwirang pinananatili ng “mapait” ang πικρόν.
- source_word: ἐριθείαν
  choice: makasariling ambisyon
  rationale: Ipinahihiwatig ng salita ang pansariling paghahangad na humahantong sa pagpapangkat o tunggalian. Natural at malinaw sa modernong Tagalog ang “makasariling ambisyon.”
- source_word: ἐν τῇ καρδίᾳ ὑμῶν
  choice: sa inyong puso
  rationale: Singular ang καρδίᾳ ngunit plural ang panghalip; isa itong distributibong pahayag tungkol sa puso ng bawat kausap. Natural sa Tagalog ang “sa inyong puso” at napananatili nito ang anyo ng Griyego.
- source_word: μὴ κατακαυχᾶσθε
  choice: huwag kayong magmalaki
  rationale: Ipinahahayag ng pandiwa ang mapagmataas na pagyayabang o pagmamapuri. Ang “magmalaki” ay maikli, natural, at angkop sa konteksto.
- source_word: ψεύδεσθε κατὰ τῆς ἀληθείας
  choice: magsinungaling laban sa katotohanan
  rationale: Pinananatili ng “magsinungaling” ang pandiwang diwa ng ψεύδεσθε at ng “laban sa” ang pagsalungat na ipinahahayag ng κατά na may genitive.
- source_word: εἰ δὲ
  choice: Ngunit kung
  rationale: Malinaw nitong ipinakikita ang pagsalungat sa naunang paglalarawan ng karunungan habang nananatiling natural sa Tagalog.
theological_decisions:
- issue: Saklaw ng “katotohanan”
  choice: Pinanatiling malawak bilang “ang katotohanan.”
  alternative: “katotohanan ng ebanghelyo,” “tunay na daan ng karunungan,” o simpleng “katapatan sa pananalita”
  rationale: Hindi nililinaw ng ἀλήθεια rito kung isang tiyak na pormulang doktrinal, tunay na karunungan, o katapatan lamang ang tinutukoy. Ang malawak na salin ay hindi nagpapataw ng isang interpretasyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “kayo/inyong” para sa plural na kausap. Pinanatili ang matalim na pagsalungat at ang malawak na kahulugan ng “katotohanan,” nang hindi nagdaragdag ng denominasyonal na paliwanag.
