base_translation:
  language: en
  yaml_path: translation/nt/james/003/015.yaml
  text: This wisdom is not coming down from above[a], but is earthly, unspiritual, demonic.
translation:
  language: tl
  text: Ang karunungang ito ay hindi bumababa mula sa itaas, kundi makalupa, hindi espirituwal[a], at makademonyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “likas lamang.” Ang salitang Griyego ay maaaring tumukoy sa nauukol lamang sa likas na buhay, salungat sa espirituwal.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη ἡ σοφία
  choice: Ang karunungang ito
  rationale: Tuwirang tinutukoy ng demonstratibo ang uri ng karunungang inilarawan sa naunang konteksto; natural at eksakto ito sa Tagalog.
- source_word: ἄνωθεν
  choice: mula sa itaas
  rationale: Pinananatili nito ang literal na larawang panglokasyon at ang pahiwatig ng banal na pinagmulan, nang hindi tahasang pinapalitan ng mas interpretibong “mula sa langit.”
- source_word: κατερχομένη
  choice: bumababa
  rationale: Ipinahahayag nito nang natural sa modernong Tagalog ang kilos ng participle at pinananatili ang ugnayan sa “mula sa itaas.”
- source_word: ἐπίγειος
  choice: makalupa
  rationale: Pinananatili ang tahasang salungatan sa “mula sa itaas”; mas malapit ito sa salitang Griyego kaysa sa “makamundo,” na maaaring magdagdag ng ibang moral na kulay.
- source_word: ψυχική
  choice: likas lamang
  rationale: Ipinahahayag ang bagay na nauukol lamang sa likas na buhay, salungat sa espirituwal, habang iniiwasan ang malabong “pangkaluluwa” at ang makitid na modernong kahulugan ng “sensuwal.”
- source_word: δαιμονιώδης
  choice: makademonyo
  rationale: Maikli at malinaw nitong ipinahahayag na ang karunungan ay may katangiang nauukol sa mga demonyo, nang hindi ito ipinapakahulugang tumutukoy lamang sa diyablo.
theological_decisions:
- issue: Diwa ng ψυχική sa salungatan ng likas at espirituwal
  choice: likas lamang
  alternative: hindi espirituwal
  rationale: Pinananatili ng “likas lamang” ang leksikal na saklaw ng ψυχική at ang negatibong diin ng konteksto, ngunit hindi nito ginagawang tahasan ang isang sangguniang hindi tuwirang binanggit sa talata. Nililinaw ng talababa ang salungatan sa espirituwal.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at madaling maunawaan. Ang magkakasunod na pang-uri ay pinanatiling maigsi at matindi. Ginamit ang “makalupa” upang mapanatili ang salungatan sa “mula sa itaas,” at nilagyan ng talababa ang tunay na leksikal na lawak ng ψυχική.
