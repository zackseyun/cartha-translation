  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Μὴ πολλοὶ διδάσκαλοι γίνεσθε, ἀδελφοί μου, εἰδότες ὅτι μεῖζον κρίμα λημψόμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/001.yaml
  text: Not many of you should become teachers[a], my brothers, knowing that we will receive a greater judgment.
translation:
  language: tl
  text: Mga kapatid ko[a], huwag maging guro ang marami sa inyo, yamang alam ninyo na tatanggap tayo ng mas mabigat na paghatol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griego ay nasa anyong panlalaki, ngunit malamang na tinutukoy rito ang buong kapulungan, kasama ang mga babae.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ πολλοὶ
  choice: huwag ... ang marami sa inyo
  rationale: Ang μή kasama ng kasalukuyang pautos na γίνεσθε ay naghahayag ng pagbabawal o matinding payo. Likas sa Tagalog ang ayos na ito at malinaw na tuwirang kinakausap ang maramihang tagapakinig.
- source_word: διδάσκαλοι
  choice: guro
  rationale: Tuwirang katumbas ito ng mga nagtuturo at hindi nito ipinapalagay na isang pormal na katungkulan ang tinutukoy.
- source_word: γίνεσθε
  choice: maging
  rationale: Ipinahihiwatig ng γίνομαι ang pagpasok o paglagay sa kalagayan ng pagiging guro, hindi lamang ang patuloy na pag-iral bilang guro.
- source_word: ἀδελφοί μου
  choice: mga kapatid ko[a]
  rationale: Ang karaniwang salitang Tagalog na “mga kapatid” ay likas na tawag sa kapwa lalaki at babae at mahusay na naghahatid sa malamang na saklaw ng Griego; nililinaw sa talababa ang anyong panlalaki ng pinagmulang salita.
- source_word: εἰδότες
  choice: yamang alam ninyo
  rationale: Pinananatili nito ang pangangatwirang nakapaloob sa participle—ang nalalaman ng mga kausap ang batayan ng babala—nang hindi ito labis na pinaiikli.
- source_word: μεῖζον
  choice: mas mabigat
  rationale: Sa kaugnayan nito sa paghatol, likas na ipinapahayag ng “mas mabigat” ang paghahambing at tindi ng μεῖζον nang hindi pinapalitan ito ng mas tiyak na “mas mahigpit.”
- source_word: κρίμα
  choice: paghatol
  rationale: Masaklaw ang “paghatol” at hindi nito agad itinatakda na ang ibig sabihin ay pangwakas na kaparusahan o kondemnasyon.
- source_word: λημψόμεθα
  choice: tatanggap tayo
  rationale: Pinananatili nito ang hinaharap at unang panauhang maramihan, na nagpapakitang isinasama ng may-akda ang sarili niya sa mga mananagot.
theological_decisions:
- issue: Saklaw ng ἀδελφοί μου sa isang kapulungang may mga lalaki at babae
  choice: Isinalin bilang “mga kapatid ko,” na likas na inklusibo sa Tagalog, at nilagyan ng talababa tungkol sa anyong panlalaki ng Griego.
  alternative: mga kapatid kong lalaki
  rationale: Bagaman panlalaki ang anyong Griego, madalas itong gamitin bilang tawag sa buong pamayanang sumasampalataya. Ang “mga kapatid kong lalaki” ay maaaring magbigay ng maling pahiwatig na mga lalaki lamang ang kinakausap.
- issue: Lakas at saklaw ng κρίμα
  choice: paghatol
  alternative: kondemnasyon; kaparusahan
  rationale: Nagbababala ang talata tungkol sa mas mabigat na pananagutan ng mga guro, ngunit hindi sapilitang tinutukoy ng κρίμα rito ang pangwakas na kondemnasyon. Pinananatili ng “paghatol” ang lawak at tensiyong teolohikal ng salita.
- issue: Paghahambing sa μεῖζον κρίμα
  choice: mas mabigat na paghatol
  alternative: mas mahigpit na paghatol; higit na paghatol
  rationale: Inihahatid ng “mas mabigat” ang paghahambing ng μεῖζον sa natural na Tagalog, habang iniiwasang gawing tiyak na pamantayang mas mahigpit ang hindi tahasang sinasabi ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “yamang” upang maipakita ang lohikal na ugnayan ng participle nang hindi nagiging teknikal; ang “paghatol” ay sadyang pinanatiling masaklaw.
