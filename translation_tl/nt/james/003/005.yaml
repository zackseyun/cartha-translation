  text: οὕτως καὶ ἡ γλῶσσα μικρὸν μέλος ἐστὶν καὶ ⸂μεγάλα αὐχεῖ⸃. Ἰδοὺ ⸀ἡλίκον πῦρ ἡλίκην ὕλην ἀνάπτει·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/005.yaml
  text: So also the tongue is a small member[a], and yet it boasts of great things[b]. See how small a fire sets ablaze so great a forest.
translation:
  language: tl
  text: Gayundin, maliit na bahagi ng katawan ang dila, ngunit malalaki ang ipinagyayabang nito. Tingnan ninyo kung paanong ang napakaliit na apoy[a] ay nakapagpapaliyab ng napakalaking kagubatan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “kung gaano kalaking apoy.” Maaaring unawain bilang padamdam ang pananalitang Griyego, ngunit ang pangunahing salin ay sumusunod sa diwa ng isang maliit na sanhi na nagbubunga ng malaking epekto, gaya ng dila na maliit na bahagi ng katawan.
    reason: alternative_reading
  - marker: b
    text: 'O, “kakahuyan,” “kahoy,” “troso,” o “sukal.” Malawak ang maaaring tukuyin ng salitang Griyego: materyal na nasusunog o isang lugar na maraming puno.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γλῶσσα
  choice: dila
  rationale: Pinananatili ang konkretong larawan ng bahagi ng katawan sa halip na ipakahulugang agad bilang “pananalita.”
- source_word: μικρὸν μέλος
  choice: maliit na bahagi ng katawan
  rationale: Mas malinaw at natural ito sa modernong Tagalog kaysa sa literal ngunit di-karaniwang “maliit na sangkap,” habang pinananatili ang pisikal na paghahambing.
- source_word: μεγάλα αὐχεῖ
  choice: malalaki ang ipinagyayabang nito
  rationale: Natural na naihahayag ang diwa ng mariringal o malalaking pagyayabang at napapanatili ang dila bilang simuno ng larawan.
- source_word: Ἰδοὺ
  choice: Tingnan ninyo
  rationale: Makabagong panawag-pansin na angkop sa maramihang mambabasa at hindi gumagamit ng arkaikong pananalita.
- source_word: ἡλίκον πῦρ
  choice: kung gaano kaliit na apoy
  rationale: 'Sinusunod ang agarang paghahambing: ang maliit na dila, gaya ng maliit na apoy, ay may napakalaking epekto. Itinatala sa talababa ang tunay na posibilidad na unawain ang parirala bilang “gaano kalaking apoy.”'
- source_word: ἡλίκην ὕλην
  choice: napakalaking kagubatan
  rationale: Sa larawang ito, ang “kagubatan” ang pinakamalinaw na modernong katumbas ng ὕλη bilang malawak na kakahuyan o materyal na maaaring masunog.
- source_word: ἀνάπτει
  choice: nakasusunog
  rationale: Naghahatid ng pangkalahatan at matingkad na diwa ng pagpapaliyab o pagsunog sa kagubatan.
