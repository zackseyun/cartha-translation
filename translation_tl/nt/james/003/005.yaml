  - severity: low
    issue: Ang «nakasusunog» ay kulang sa aspektong pagpapaliyab ng ἀνάπτει.
    rationale: Mas malapit ang «nakapagpapaliyab» o «nagpapaliyab,» na tumutukoy sa pagpapaapoy/pagpapasiklab.
  - severity: low
    issue: Masyadong espesipiko ang «mga tuyong halaman» bilang alternatibo para sa ὕλη.
    rationale: Maaaring tumukoy ang ὕλη sa kahoy, troso, gatong, sukal, o kakahuyan; hindi kinakailangang tuyong halaman lamang.
