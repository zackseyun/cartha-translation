  to: Gayundin, maliit na bahagi ng katawan ang dila, ngunit malalaki ang ipinagyayabang nito. Tingnan ninyo kung paanong ang napakaliit na apoy[a] ay nakapagpapaliyab ng napakalaking kagubatan.[b]
  rationale: Inayos ang ikalawang pangungusap upang maging likás sa modernong Tagalog at upang mas malinaw na maipahayag ang pagpapaliyab na nasa ἀνάπτει. Pinanatili ang pinagtatalunang pagbasa ng ἡλίκον sa talababa at ang mga panandang talababa ay nananatiling nakaugnay sa apoy at kagubatan ayon sa kani-kanilang paksa.
