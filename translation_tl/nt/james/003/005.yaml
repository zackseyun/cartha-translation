  source_fidelity: Tumpak ang pangunahing pag-unawa sa μικρὸν μέλος, μεγάλα αὐχεῖ, at sa retorikal na paghahambing ng maliit na apoy at malaking ὕλη. Gayunman, ang «nakasusunog» ay mas tuwirang ‘burns’ at hindi gaanong naihahayag ang ἀνάπτει, ‘magpasiklab/magpaliyab.’
  naturalness: Malinaw ang unang pangungusap. Ang «kung gaano kaliit na apoy ang nakasusunog» ay medyo pilit sa modernong Tagalog; mas likas ang pangungusap na may «napakaliit na apoy» bilang simuno at «nakapagpapaliyab» bilang pandiwa.
  terminology: Ang «dila,» «bahagi ng katawan,» at «kagubatan» ay angkop at pinananatili ang metapora. Ang talababa sa ὕλη ay dapat magbigay ng mga alternatibong mas tuwirang katumbas ng saklaw na ‘wood/timber/brush,’ nang hindi labis na pinaiikli sa «mga tuyong halaman.»
