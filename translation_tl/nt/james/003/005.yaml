translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling basahin. Ginamit ang “ngunit” upang natural na maipahayag ang ipinahihiwatig na pagsalungat sa pagitan ng kaliitan ng dila at laki ng mga ipinagyayabang nito. Inilipat ang mga pananda ng talababa sa mismong mga salitang tinatalakay ng bawat tala.
