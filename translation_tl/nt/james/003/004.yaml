base_translation:
  language: en
  yaml_path: translation/nt/james/003/004.yaml
  text: 'Look also at the ships: though they are so large and are driven by strong winds[a], they are steered by a very small rudder wherever the inclination of the one steering wills.'
translation:
  language: tl
  text: 'Tingnan din ninyo ang mga barko: bagaman napakalalaki ng mga ito at itinutulak ng malalakas na hangin, napipihit ang mga ito ng isang napakaliit na timon saanman gustong patunguhin ng tagatimon ang mga ito.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “saanman naisin ng udyok o hangarin ng taong nagpapatnubay.” Maaari ring isalin: “saanman gustong pumunta ng tagatimon.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ καὶ τὰ πλοῖα
  choice: Tingnan din ninyo ang mga barko
  rationale: Ginawang likas na panawag-pansin sa makabagong Tagalog ang ἰδοὺ, habang ipinakikita ng “din” na ikalawang paghahalimbawa ito kasunod ng naunang talata.
- source_word: τηλικαῦτα ὄντα
  choice: bagaman napakalalaki ng mga ito
  rationale: Ipinahahayag ng τηλικαῦτα ang kapansin-pansing laki; malinaw na naipakikita ng “bagaman” ang paghahambing nito sa napakaliit na timon.
- source_word: ὑπὸ ἀνέμων σκληρῶν ἐλαυνόμενα
  choice: itinutulak ng malalakas na hangin
  rationale: Sa konteksto ng hangin, likas na katumbas ng σκληρῶν ang “malalakas,” at pinananatili ng “itinutulak” ang balintiyak na diwa ng ἐλαυνόμενα.
- source_word: μετάγεται
  choice: naipipihit sila
  rationale: Ipinahahayag ng pandiwa ang paglilipat o pagpihit ng direksiyon. Ang “naipipihit” ay angkop sa barkong pinamamahalaan sa pamamagitan ng timon at pinananatili ang larawan ng maliit na bagay na kumokontrol sa malaki.
- source_word: ὑπὸ ἐλαχίστου πηδαλίου
  choice: ng napakaliit na timon
  rationale: Ang superlatibong ἐλαχίστου ay idiomatikong isinalin na “napakaliit” upang idiin ang matinding pagkakaiba sa laki ng barko nang hindi ipakahulugang iyon ang literal na pinakamaliit na timon sa lahat.
- source_word: ὅπου ἡ ὁρμὴ τοῦ εὐθύνοντος βούλεται
  choice: saanman naisin ng tagatimon
  rationale: Ito ang malinaw at natural na pagpapahayag ng patutunguhang pinipili ng taong namamahala sa timon. Ang mas literal ngunit alanganing kayarian tungkol sa ὁρμή ay inilagay sa talababa upang mapanatili ang leksikal na himig ng Griyego.
theological_decisions:
- issue: Pagpapahayag sa ὁρμὴ τοῦ εὐθύνοντος βούλεται
  choice: saanman naisin ng tagatimon
  alternative: saanman ibigin ng hangarin ng taong nagtutuwid nito
  rationale: Ang literal na pagsasama ng “hangarin/udyok” at “ibigin” ay hindi likas sa Tagalog at maaaring lumabo ang payak na larawan. Pinananatili ng pangunahing salin ang kusang layunin ng namamahala nang hindi binibigyan ng espesyal na teolohikal na kahulugan ang βούλεται; itinatala naman sa talababa ang mas malapit na anyo ng Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang karaniwang “barko,” “timon,” at “tagatimon”; iniwasan ang sobrang teknikal o makalumang bokabularyo. Ang pangungusap ay nananatiling buhay bilang paghahalimbawa at pinananatili ang diin sa malaking barko, malakas na hangin, at napakaliit na timon.
