  text: τὴν δὲ γλῶσσαν οὐδεὶς ⸂δαμάσαι δύναται ἀνθρώπων⸃· ⸀ἀκατάστατον κακόν, μεστὴ ἰοῦ θανατηφόρου.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/008.yaml
  text: But no one among men is able to tame the tongue[a]. It is a restless evil[b], full of deadly poison.
translation:
  language: tl
  text: Ngunit walang sinumang tao ang kayang magpaamo sa dila. Isa itong masamang bagay na hindi mapigil[a], punô ng lasong nakamamatay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “isang masamang bagay na hindi mapalagay” o “isang magulo at masamang bagay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γλῶσσαν
  choice: dila
  rationale: Pinananatili ang literal na bahagi ng katawan dahil ito ang patuloy na talinghaga ni Santiago para sa pananalita sa konteksto.
- source_word: οὐδεὶς … ἀνθρώπων
  choice: walang sinumang tao
  rationale: Likas na Tagalog ito para sa partitive na diwang ‘walang isa sa mga tao,’ at malinaw na tumutukoy sa sinumang tao nang hindi lumilikha ng alanganing pag-uulit.
- source_word: δαμάσαι δύναται
  choice: makapagpaamo
  rationale: Pinananatili nito ang ugnayang pandiwa sa pagpapaamo ng mga hayop sa naunang talata at maayos na ipinahahayag ang kakayahang tinatanggihan ng οὐδεὶς.
- source_word: ἀκατάστατον
  choice: hindi mapigil
  rationale: Ipinahahayag nito ang kontekstuwal na diwa ng isang bagay na hindi mapirmi, magulo, o suwail, sa natural at malinaw na Tagalog; inilalagay sa talababa ang ibang posibleng mga himig.
- source_word: κακόν
  choice: kasamaan
  rationale: Nananatili ang moral na bigat ng κακόν, hindi lamang ang ideya ng pinsala.
- source_word: μεστὴ ἰοῦ θανατηφόρου
  choice: punô ng lasong nakamamatay
  rationale: Direkta at malinaw na inilalarawan ang dila bilang punô ng lason na nagdudulot ng kamatayan; ‘lason’ ang malawak at madaling maunawaang katumbas ng ἰός sa kontekstong ito.
theological_decisions:
- issue: Saklaw ng kawalang-kakayahan sa οὐδεὶς … ἀνθρώπων
  choice: walang sinumang tao ang makapagpaamo
  alternative: walang isa man sa mga tao ang kayang magpaamo
  rationale: Pinananatili ang pangkalahatang pahayag tungkol sa kakayahan ng tao, nang hindi ito ginagawang absolutong pahayag tungkol sa anumang maaaring gawin ng Diyos o tahimik na nilulutas ang tensiyon sa mga naunang talata.
- issue: Nuansa ng ἀκατάστατον κακόν
  choice: kasamaang hindi mapigil
  alternative: kasamaang hindi mapalagay / magulong kasamaan
  rationale: Ang salita ay maaaring magpahiwatig ng kawalang-katatagan, pagkabalisa, o kawalan ng kaayusan. Ang pangunahing salin ay natural sa konteksto, habang kinikilala sa talababa ang saklaw ng kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “makapagpaamo” upang mapanatili ang larawan ng pagpapaamo sa mga hayop, at “walang sinumang tao” bilang likas na salin ng οὐδεὶς … ἀνθρώπων. Ang “punô” ay nilagyan ng tuldik upang luminaw na nangangahulugang ‘full.’
