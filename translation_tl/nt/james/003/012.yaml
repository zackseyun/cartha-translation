  naturalness: Natural at marangal ang kabuuan, lalo na ang “Mga kapatid ko” at ang magkatapat na mga larawan ng halaman. Mas malinaw at mas idiomatiko sa modernong Tagalog ang “makalilikha ... ng” sa huling sugnay kaysa “makapaglalabas ... ang maalat na tubig.”
  terminology: Ang “mga kapatid,” “puno ng igos,” “mga olibo,” “baging ng ubas,” at “tubig-tabang” ay angkop. Dapat ding iwasan ng talababa a ang pag-aangking literal na “mga kapatid na lalaki ko,” sapagkat ang pangunahing literal na katumbas ng ἀδελφοί μου ay “mga kapatid ko”; ang panlalaking anyo ng Griyego at ang posibleng saklaw nitong halo-halong pangkat ang siyang dapat ipaliwanag.
