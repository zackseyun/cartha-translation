translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang retorikal na tanong at magkatapat na larawang agrikultural. Ginamit ang karaniwang “kapatid” sa halip na lumang “kapatid na lalaki” o “mga kapatid na lalake,” at inilagay sa talababa ang kasariang nasa anyong Griyego. Ang elipsis sa huling sugnay ay hindi tahasang nilutas bilang “bukal” sa pangunahing teksto; ipinaliwanag ito sa talababa.
