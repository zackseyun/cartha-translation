base_translation:
  language: en
  yaml_path: translation/nt/james/003/012.yaml
  text: My brothers[a], can a fig tree produce olives[c][b], or a grapevine figs? Neither can salt water produce fresh water.
translation:
  language: tl
  text: Mga kapatid ko[a], maaari bang mamunga ng mga olibo ang puno ng igos, o ng mga igos ang baging ng ubas? Hindi rin makalilikha ng tubig-tabang[b] ang maalat na tubig.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Griyego ay gumagamit ng panlalaking maramihang anyo na literal na “mga kapatid ko.” Maaari rin itong gamitin sa pagtawag sa isang pangkat na kinabibilangan ng mga lalaki at babae.
    reason: lexical_alternative
  - marker: b
    text: Literal na “matamis na tubig”; sa kontekstong ito, “tubig-tabang” ang kahulugan bilang kabaligtaran ng maalat na tubig.
    reason: lexical_alternative
  - marker: c
    text: 'Eliptikal ang huling sugnay sa Griyego. Dahil bukal ang larawan sa naunang talata, maaari rin itong unawain: “Hindi rin makalilikha ng tubig-tabang ang maalat na bukal.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀδελφοί μου
  choice: Mga kapatid ko
  rationale: Ang “kapatid” ang natural at marangal na tawag sa kapwa miyembro ng pamayanan sa modernong Tagalog. Hindi ito nakatali sa kasarian, samantalang panlalaking maramihan ang anyong Griyego at maaari itong tumukoy sa buong pangkat.
- source_word: μὴ δύναται
  choice: maaari bang
  rationale: Ang tanong na may μή ay umaasang “hindi” ang sagot. Napananatili ng “maaari bang” ang retorikal na anyo sa natural na Tagalog.
- source_word: συκῆ
  choice: puno ng igos
  rationale: Tumutukoy ang pangngalan sa puno, hindi lamang sa bunga.
- source_word: ἐλαίας ποιῆσαι
  choice: mamunga ng mga olibo
  rationale: Sa kontekstong agrikultural, ang ποιέω ay tumutukoy sa pagbubunga o pagluwal ng bunga; natural sa Tagalog ang “mamunga.”
- source_word: ἄμπελος
  choice: baging ng ubas
  rationale: Tiyak nitong ipinahihiwatig ang grapevine at pinananatili ang larawan ng halamang namumunga.
- source_word: σῦκα
  choice: mga igos
  rationale: Tuwirang katumbas ng maramihang pangalan ng bunga.
- source_word: οὔτε ἁλυκὸν
  choice: Hindi rin ... ang maalat na tubig
  rationale: Pinaikli at eliptikal ang Griyego. Ginamit ang “maalat na tubig” upang maging malinaw sa Tagalog nang hindi tahasang ipinapasok sa pangunahing teksto ang “bukal,” na nagmumula sa konteksto ng naunang talata.
- source_word: γλυκὺ ποιῆσαι ὕδωρ
  choice: makapaglalabas ng tubig-tabang
  rationale: Literal na “matamis” ang γλυκύς, ngunit sa pagtutunggali sa maalat na tubig, “tubig-tabang” ang malinaw at idiomatikong kahulugan. Ang “makapaglalabas” ay angkop sa larawan ng bukal sa konteksto.
