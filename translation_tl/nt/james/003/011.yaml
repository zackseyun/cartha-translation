translation:
  language: tl
  text: Maaari bang maglabas ang isang bukal mula sa iisang bukana ng tubig na matamis at mapait?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Ang bukal ba ay bumubulwak mula sa iisang bukana ng tubig na matamis at mapait?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μήτι
  choice: Maaari bang
  rationale: Ipinahihiwatig ng μήτι ang tanong na umaasang ang sagot ay hindi. Likas sa modernong Tagalog ang “Maaari bang” bilang retorikal na tanong sa kontekstong ito.
- source_word: πηγή
  choice: bukal
  rationale: Ang πηγή ay likas na pinagmumulan ng tubig; “bukal” ang tuwiran at karaniwang katumbas sa Tagalog.
- source_word: ἐκ τῆς αὐτῆς ὀπῆς
  choice: mula sa iisang bukana
  rationale: Ang ὀπή ay butas o bukana. Pinananatili ng “bukana” ang pisikal na larawan nang hindi αwkward o labis na literal.
- source_word: βρύει
  choice: bumukal
  rationale: Ang βρύω ay tumutukoy sa pagbulwak o pag-agos mula sa isang pinagmulan. Ang “bumukal” ay natural sa larawan ng bukal at ipinahihiwatig ang paglabas ng tubig.
- source_word: τὸ γλυκύ
  choice: tubig na matamis
  rationale: Literal na “matamis” ang γλυκύ. Idinagdag ang “tubig,” na ipinahihiwatig sa Griyego, upang maging malinaw at natural sa Tagalog.
- source_word: τὸ πικρόν
  choice: tubig na mapait
  rationale: Ang πικρόν ay “mapait.” Ang “tubig” ay isinasaad nang minsan para sa magkatambal na pang-uri, kaya malinaw na parehong uri ng tubig ang tinutukoy.
