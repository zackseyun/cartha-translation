revisions:
- from: Sapagkat bawat uri ng mababangis na hayop at mga ibon, mga gumagapang na hayop at mga nilalang sa dagat ay napapaamo at napaamo na ng sangkatauhan.[a]
  to: Sapagkat bawat uri ng mababangis na hayop, ibon, gumagapang na hayop, at nilalang sa dagat ay pinapaamo at napaamo na ng sangkatauhan.[a]
  rationale: Inayos ang talaan upang malinaw na ang “bawat uri” ay sumasaklaw sa lahat ng apat na pangkat. Pinalitan ang “napapaamo” ng “pinapaamo” upang mas tumpak na maipakita ang kasalukuyang pasibo, habang pinanatili ang “napaamo na” para sa perpektong pasibo. Ginawang idiomatiko ang mga alternatibong pagbasa sa talababa at pinanatili ang ambigwidad ng τῇ φύσει τῇ ἀνθρωπίνῃ.
