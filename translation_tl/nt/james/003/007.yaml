source:
  edition: SBLGNT
  text: πᾶσα γὰρ φύσις θηρίων τε καὶ πετεινῶν ἑρπετῶν τε καὶ ἐναλίων δαμάζεται καὶ δεδάμασται τῇ φύσει τῇ ἀνθρωπίνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/007.yaml
  text: For every kind of beast and bird[a], of reptile and sea creature, is being tamed and has been tamed by humankind.
translation:
  language: tl
  text: Sapagkat bawat uri ng mababangis na hayop, ibon, gumagapang na hayop, at nilalang sa dagat ay pinapaamo at napaamo na ng sangkatauhan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “sa pamamagitan ng kalikasan ng tao” o “sa pamamagitan ng kakayahang pantao.” Ang pariralang Griyego na τῇ φύσει τῇ ἀνθρωπίνῃ ay maaaring tumukoy sa sangkatauhan bilang kabuuan o, sa mas abstraktong diwa, sa kalikasan o saklaw ng tao; pinili sa pangunahing teksto ang kolektibong kahulugan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα ... φύσις
  choice: bawat uri
  rationale: Sa talaan ng mga nilalang, ang φύσις ay tumutukoy sa uri o klase, hindi lamang sa abstraktong kalikasan.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikita nito na ang talata ay nagbibigay ng paliwanag sa naunang pahayag.
- source_word: θηρίων
  choice: mababangis na hayop
  rationale: Malinaw at likas na salin ito para sa mga hayop na karaniwang hindi maamo.
- source_word: πετεινῶν
  choice: mga ibon
  rationale: Ito ang tuwiran at karaniwang tawag sa mga lumilipad na nilalang na tinutukoy.
- source_word: ἑρπετῶν
  choice: mga gumagapang na hayop
  rationale: Mas malawak ito kaysa sa teknikal na 'reptilya' at pinananatili ang pangunahing diwa ng salitang Griyego.
- source_word: ἐναλίων
  choice: mga nilalang sa dagat
  rationale: Saklaw nito nang natural ang iba't ibang hayop na nabubuhay sa dagat.
- source_word: δαμάζεται
  choice: napapaamo
  rationale: Ipinahahayag ng aspektong pangkasalukuyan ang patuloy o pangkalahatang proseso ng pagpapaamo.
- source_word: δεδάμασται
  choice: napaamo na
  rationale: 'Pinananatili ng pariralang ito ang aspektong perpekto: naganap na ang pagpapaamo at nananatili ang bunga nito.'
- source_word: τῇ φύσει τῇ ἀνθρωπίνῃ
  choice: ng sangkatauhan
  rationale: Binabasa ito bilang kolektibong pagtukoy sa mga tao bilang tagapagpaamo, habang inilalahad sa talababa ang tunay na posibleng abstraktong pagbasa.
theological_decisions:
- issue: Kung kolektibo o abstrakto ang τῇ φύσει τῇ ἀνθρωπίνῃ
  choice: ng sangkatauhan
  alternative: ng kalikasan ng tao / ng kakayahang pantao
  rationale: Mas angkop sa konteksto ang kolektibong ahensiya ng sangkatauhan, ngunit hindi lubusang inaalis ng Griyego ang abstraktong pagbasa kaya pinanatili ito sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang 'gumagapang na hayop' sa halip na teknikal na 'reptilya,' at pinanatili ang pagkakaiba ng patuloy na 'napapaamo' at ganap na 'napaamo na.'
