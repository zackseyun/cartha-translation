base_translation:
  language: en
  yaml_path: translation/nt/james/003/013.yaml
  text: Who is wise and understanding among you? Let him show his works by his good conduct[b][a], in the meekness of wisdom.
translation:
  language: tl
  text: Sino sa inyo ang marunong at may pang-unawa? Ipakita niya[b] ang kanyang mga gawa sa pamamagitan ng mabuting pamumuhay, nang may kaamuan na kaakibat ng karunungan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “nang may kaamuang nagmumula sa karunungan.” Sa literal, “sa kaamuan ng karunungan.”
    reason: lexical_alternative
  - marker: b
    text: Ang Griyego ay gumagamit ng pautos na panlalaking isahan, ngunit kumakatawan ito sa sinumang gayong tao sa komunidad. Walang ipinahahayag na kasarian ang Tagalog na “niya.”
    reason: cultural_note
lexical_decisions:
- source_word: Τίς σοφὸς καὶ ἐπιστήμων ἐν ὑμῖν
  choice: Sino sa inyo ang marunong at may pang-unawa?
  rationale: Likas na tanong sa modernong Tagalog. Ang “marunong” ay tumutukoy sa praktikal at moral na karunungan, at ang “may pang-unawa” ay naghahatid ng diwa ng ἐπιστήμων nang hindi nililimitahan ito sa kaalamang pang-akademiko.
- source_word: δειξάτω
  choice: Ipakita niya
  rationale: Pinananatili ang pautos na lakas ng ikatlong panauhang isahan. Ang “niya” sa Tagalog ay hindi nakatali sa kasarian at natural na tumutukoy sa sinumang taong tinutukoy ng tanong.
- source_word: ἐκ τῆς καλῆς ἀναστροφῆς
  choice: sa pamamagitan ng mabuting pamumuhay
  rationale: Ang ἐκ ay nagpapahayag dito ng paraan o pinagmumulan, samantalang ang ἀναστροφή ay tumutukoy sa asal o paraan ng pamumuhay. Masaklaw at natural ang “mabuting pamumuhay” para sa nakagawiang pagkilos ng isang tao.
- source_word: τὰ ἔργα αὐτοῦ
  choice: ang kanyang mga gawa
  rationale: Pinananatili ng “mga gawa” ang mahalagang ugnayang leksikal sa mas malawak na paggamit ni Santiago sa ἔργα.
- source_word: ἐν πραΰτητι σοφίας
  choice: nang may kahinahunan na kaakibat ng karunungan
  rationale: Ang “kahinahunan” ay natural na salin ng πραΰτης sa kontekstong moral at hindi nagpapahiwatig ng kahinaan. Ang “kaakibat ng karunungan” ay nagpapanatili sa malapit ngunit hindi ganap na tinutukoy na ugnayan ng kahinahunan at karunungan sa pariralang Griyego.
theological_decisions:
- issue: Kasarian at kinatawang bisa ng pautos na isahan
  choice: Ipakita niya
  alternative: Ipakita ng gayong tao
  rationale: Masculine singular ang anyong Griyego ngunit may kinatawang bisa para sa sinumang kabilang sa komunidad. Natural na napapanatili sa Tagalog ang isahan sa “niya” nang hindi nagdaragdag ng kasariang wala sa sistemang panghalip ng Tagalog.
- issue: Ugnayan ng kahinahunan at karunungan
  choice: kahinahunan na kaakibat ng karunungan
  alternative: kahinahunan na bunga ng karunungan
  rationale: Maaaring unawain ang genitibong σοφίας bilang naglalarawan sa kahinahunan o bilang pinagmumulan nito. Hindi tahasang nilulutas ng pangunahing salin ang tunay na ambiguwidad; inilalahad sa talababa ang mas tiyak na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “mabuting pamumuhay” sa halip na mas makitid na “mabuting asal,” at “kahinahunan” sa halip na mas arkaiko o maaaring mapagkamalang kahinaan na “kaamuhan.”
