    rationale: Ang “pag-iral” ay lumalawak mula sa kahulugan ng γένεσις at maaaring magpahiwatig ng existence sa pangkalahatan. Ang “kapanganakan” ay mas tuwirang katumbas, kahit nananatiling matalinghaga at di-pangkaraniwan ang parirala.
  - severity: low
    issue: “sa gitna ng mga bahagi ng ating katawan” para sa ἐν τοῖς μέλεσιν ἡμῶν
    rationale: Ang “sa gitna” ay nagdaragdag ng ideya ng sentro. Ang “kabilang sa mga bahagi” ay mas malapit sa “among” at mas natural sa Tagalog.
