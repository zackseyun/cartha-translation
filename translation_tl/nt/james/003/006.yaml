  to: At ang dila ay apoy. Ang dila ay kabilang sa mga bahagi ng ating katawan bilang isang daigdig ng kasamaan; dinudungisan nito ang buong katawan, sinusunog ang gulong ng kapanganakan,[a] at ito mismo ay sinusunog ng Gehenna.[b]
  rationale: Pinalitan ang “pag-iral” ng “kapanganakan” upang masundan nang mas malapit ang γένεσις at mapanatili ang konkretong, mahirap na larawan ng “gulong.” Pinalitan din ang “sa gitna” ng “kabilang sa” upang hindi magdagdag ng kahulugang wala sa ἐν. Walang binagong teolohikal na pagpapakahulugan; nananatili ang “Gehenna” at ang alternatibong tradisyonal na salin sa talababa.
