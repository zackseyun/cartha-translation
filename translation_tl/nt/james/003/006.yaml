  source_fidelity: Ang pangunahing suliranin ay ang “gulong ng pag-iral.” Ang γένεσις ay mas tuwirang tumutukoy sa kapanganakan, pinagmulan, o paglikha kaysa sa abstraktong “pag-iral.” Ang “gulong ng kapanganakan” ay mas malapit sa Griyego at pinananatili ang sadyang mahirap na talinghaga.
  naturalness: Malinaw at angkop sa makabagong Filipino ang karamihan ng salin. Mas natural at mas tumpak ang “kabilang sa mga bahagi ng ating katawan” kaysa “sa gitna ng mga bahagi,” dahil ang ἐν ay “sa/kabilang sa” at hindi kailangang magpahiwatig ng sentrong lokasyon.
  terminology: Ang “dila,” “apoy,” “daigdig ng kasamaan,” “dinudungisan,” at “Gehenna” ay angkop. Pinananatili ng “Gehenna” ang tiyak na terminong Griyego nang hindi agad ipinapantay sa “impiyerno.”
