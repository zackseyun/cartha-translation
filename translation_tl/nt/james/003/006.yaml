base_translation:
  language: en
  yaml_path: translation/nt/james/003/006.yaml
  text: And the tongue is a fire. The tongue is set among our members as a world of unrighteousness, staining the whole body and setting on fire the wheel of birth, and being set on fire by Gehenna.
translation:
  language: tl
  text: At ang dila ay apoy. Ang dila ay kabilang sa mga bahagi ng ating katawan bilang isang daigdig ng kasamaan; dinudungisan nito ang buong katawan, sinusunog ang gulong ng kapanganakan,[a] at ito mismo ay sinusunog ng Gehenna.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ang takbo ng buhay” o “ang ikot ng buhay.”
    reason: lexical_alternative
  - marker: b
    text: Ang “Gehenna” ay terminong Griyego; tradisyonal itong isinasaling “impiyerno.”
    reason: alternative_reading
lexical_decisions:
- source_word: γλῶσσα
  choice: dila
  rationale: Pinananatili ang konkretong bahagi-ng-katawan na talinghaga, habang likas na ipinahihiwatig ang pagsasalita.
- source_word: πῦρ
  choice: apoy
  rationale: Direkta at natural na pinananatili ang talinghaga ng mapanirang apoy.
- source_word: κόσμος τῆς ἀδικίας
  choice: isang daigdig ng kasamaan
  rationale: Pinananatili ang matingkad at malawak na idyomang κόσμος, samantalang ang 'kasamaan' ay natural na naghahatid ng moral na lawak ng ἀδικία sa kontekstong ito.
- source_word: καθίσταται ἐν τοῖς μέλεσιν ἡμῶν
  choice: nakalagay sa gitna ng mga bahagi ng ating katawan
  rationale: Ipinapahayag ang posisyon ng dila sa mga sangkap ng katawan nang malinaw at hindi labis na binibigyang-kahulugan ang pandiwa.
- source_word: σπιλοῦσα
  choice: dinudungisan
  rationale: Nahuhuli ang larawan ng pagmantsa at ang moral na karumihan na ipinahihiwatig ng pandiwa.
- source_word: ὅλον τὸ σῶμα
  choice: ang buong katawan
  rationale: Tuwirang pinananatili ang kabuuang saklaw ng ὅλον.
- source_word: φλογίζουσα
  choice: sinusunog
  rationale: Natural sa Tagalog at pinananatili ang tuloy-tuloy na larawan ng apoy.
- source_word: τὸν τροχὸν τῆς γενέσεως
  choice: ang gulong ng pag-iral
  rationale: Pinananatili ang sadyang kakaibang talinghaga ng 'gulong' at ang malawak na diwa ng γένεσις nang hindi ito tahimik na nilulutas bilang simpleng takbo ng buhay.
- source_word: φλογιζομένη
  choice: ito mismo ay sinusunog
  rationale: 'Malinaw na pinananatili ang balintunang pasibo: ang dilang nagsusunog ay sinusunog din mula sa ibang pinagmulan.'
- source_word: ὑπὸ τῆς γεέννης
  choice: ng Gehenna
  rationale: Pinananatili ang tiyak na terminong Griyego sa halip na agad itong ipantay sa mas malawak na teolohikal na salitang 'impiyerno.'
theological_decisions:
- issue: Pagbibigay-kahulugan sa γέεννα
  choice: Gehenna
  alternative: impiyerno
  rationale: Pinananatili ang historikal at konseptuwal na katiyakan ng terminong nasa Griyego; inilalagay sa talababa ang tradisyonal na salin.
- issue: Kahulugan ng τὸν τροχὸν τῆς γενέσεως
  choice: ang gulong ng pag-iral
  alternative: ang takbo ng buhay / ang ikot ng buhay
  rationale: Pinananatili sa pangunahing teksto ang konkretong 'gulong' at ang tunay na hirap ng parirala, habang ibinibigay sa talababa ang mas interpretatibong mga salin.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang konkretong talinghaga ng dila, apoy, daigdig, at gulong; iniwasan ang sobrang teknikal o denominasyonal na pananalita.
