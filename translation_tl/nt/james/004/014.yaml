base_translation:
  language: en
  yaml_path: translation/nt/james/004/014.yaml
  text: You do not know what tomorrow will bring[a]. What is your life? For you are a mist that appears for a little while and then vanishes.
translation:
  language: tl
  text: Hindi ninyo alam kung ano ang mangyayari bukas. Ano ba ang buhay ninyo? Kayo ay isang singaw[a] na lumilitaw sa maikling panahon at pagkatapos ay naglalaho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hamog.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίστασθε
  choice: alam
  rationale: Sa konteksto ng kawalang-katiyakan tungkol sa hinaharap, ang “alam” ang pinakanatural at tuwirang katumbas.
- source_word: τὸ τῆς αὔριον
  choice: kung ano ang mangyayari bukas
  rationale: Elliptical ang pariralang Griyego at tumutukoy sa mga bagay o pangyayaring nauukol sa bukas; malinaw at natural ito sa modernong Tagalog nang hindi labis na nagpapaliwanag.
- source_word: ποία ἡ ζωὴ ὑμῶν
  choice: Ano ba ang buhay ninyo?
  rationale: Pinananatili ng tanong ang retorikal na diin sa uri at likas na kalagayan ng buhay; ang “ba” ay nagbibigay ng natural na diin sa Tagalog.
- source_word: ἀτμὶς
  choice: hamog
  rationale: Ang “hamog” ay isang natural at malinaw na larawang Tagalog para sa manipis at panandaliang singaw o ulap-singaw. Pinananatili sa talababa ang “singaw” bilang posibleng katumbas.
- source_word: πρὸς ὀλίγον
  choice: saglit
  rationale: Maikli at natural na ipinahahayag ang napakaikling tagal.
- source_word: φαινομένη
  choice: nakikita
  rationale: Tuwirang ipinapahayag ang pansamantalang pagiging nakikita ng hamog at umiiwas sa posibleng ibang kahulugan ng “lumilitaw.”
- source_word: ἔπειτα καὶ ἀφανιζομένη
  choice: at pagkatapos ay naglalaho
  rationale: Pinananatili ang pagkakasunod-sunod at ang matingkad na larawan ng pagkawala.
theological_decisions:
- issue: Matalinghagang paglalarawan sa kaiklian at kawalang-katiyakan ng buhay ng tao
  choice: Panatilihin ang larawan ng hamog bilang retorikal na pahayag tungkol sa panandalian at marupok na buhay.
  alternative: Ipaliwanag nang tuwiran bilang “napakaikli ng buhay ninyo.”
  rationale: Mas tapat sa anyong pampanitikan at teolohikal na tensiyon ng talata ang kongkretong larawan kaysa sa pagpapalit nito ng abstraktong paliwanag; hindi rin ito nagdaragdag ng partikular na turo tungkol sa kamatayan o paghuhukom.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang maramihang “ninyo/kayong” ayon sa Griyegong ὑμῶν at sa tuwirang pakikipag-usap sa mga nagpaplano tungkol sa hinaharap.
