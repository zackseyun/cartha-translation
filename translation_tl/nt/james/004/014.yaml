  terminology: Gamitin ang “singaw” bilang pangunahing katumbas ng ἀτμίς; ang “hamog” ay maaaring ilagay bilang alternatibo sa talababa, bagaman mas malawak at mas matalinghaga ito kaysa sa pangunahing kahulugan.
