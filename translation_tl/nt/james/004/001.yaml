  text: Πόθεν πόλεμοι καὶ ⸀πόθεν μάχαι ἐν ὑμῖν; οὐκ ἐντεῦθεν, ἐκ τῶν ἡδονῶν ὑμῶν τῶν στρατευομένων ἐν τοῖς μέλεσιν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/james/004/001.yaml
  text: From where come wars and from where come fights among you? Is it not from here—from your pleasures that wage war in your members?[a][b][c]
translation:
  language: tl
  text: Saan nagmumula ang mga digmaan at saan nagmumula ang mga labanan sa gitna ninyo?[a][b] Hindi ba nagmumula ang mga ito sa inyong mga kalayawang nakikipagdigma sa loob ng mga bahagi ng inyong katawan?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga alitan … mga pag-aaway.” Mga salitang militar ang ginamit sa Griyego, literal na “mga digmaan” at “mga labanan,” para sa mga sigalot sa komunidad.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa loob ninyo.” Maaaring tumukoy ang Griyego sa alitan sa pagitan ng mga mambabasa o sa alitang nasa kalooban nila. Iniuugnay ng buong talata ang panlabas na alitan sa panloob na mga pagnanasa.
    reason: alternative_reading
  - marker: c
    text: Literal na “sa mga bahagi ninyo.” Maaari itong tumukoy sa mga bahagi ng katawan o, sa mas malawak na diwa, sa mga kakayahang kumikilos sa loob ng isang tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πόθεν
  choice: Saan nagmumula
  rationale: Pinananatili ang tanong tungkol sa pinagmulan at ang pag-uulit nito sa dalawang sugnay, sa natural na modernong Tagalog.
- source_word: πόλεμοι
  choice: mga digmaan
  rationale: Tuwirang pinananatili ang matinding larawang militar ng Griyego, bagaman ginagamit ito rito para sa alitan sa komunidad.
- source_word: μάχαι
  choice: mga labanan
  rationale: Ibinubukod sa πόλεμοι habang pinananatili ang magkaugnay na larawang militar.
- source_word: ἐν ὑμῖν
  choice: sa gitna ninyo
  rationale: Likas na nagpapahayag ng alitan sa pagitan ng mga mambabasa, habang kinikilala sa talababa na maaari rin itong unawaing panloob.
- source_word: οὐκ ἐντεῦθεν
  choice: Hindi ba nagmumula ang mga ito sa
  rationale: Ipinahahayag ang retorikal na tanong na umaasang sasang-ayon ang mambabasa at malinaw na itinuturo ang kasunod na pinagmulan.
- source_word: ἡδονῶν
  choice: mga kalayawan
  rationale: Ipinahahayag ang mga pagnanasang nakatuon sa sariling kasiyahan; mas angkop sa negatibong konteksto kaysa sa neutral na “mga kasiyahan.”
- source_word: στρατευομένων
  choice: nakikipagdigma
  rationale: Pinananatili ang aktibo at nagpapatuloy na larawang militar na umaalingawngaw sa “mga digmaan.”
- source_word: ἐν τοῖς μέλεσιν ὑμῶν
  choice: sa mga bahagi ng inyong katawan
  rationale: Pinananatili ang literal na larawang tumutukoy sa mga sangkap o bahagi ng katawan nang hindi lubusang nilulutas kung pisikal o mas malawak na mga kakayahan ng tao ang tinutukoy.
theological_decisions:
- issue: Kung ang pambungad na alitan ay panloob lamang o alitan sa komunidad
  choice: Isinalin ang unang ἐν ὑμῖν bilang “sa gitna ninyo” at ang huling parirala bilang “sa mga bahagi ng inyong katawan.”
  alternative: Isalin ang una bilang “sa loob ninyo” at ang huli bilang “sa kalooban ninyo.”
  rationale: Iniuugnay ng talata ang panlabas na alitan sa komunidad sa panloob na mga kalayawan. Pinananatili ng salin ang dalawang dimensiyon sa halip na pumili lamang ng isa.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Pinanatili ang pag-uulit ng retorikal na tanong at ang matinding larawang militar. Ginamit ang “kalayawan” upang ihatid ang negatibong diwa ng pansariling kasiyahan nang hindi nagdaragdag ng denominasyonal na interpretasyon.
