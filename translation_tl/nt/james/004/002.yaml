  naturalness: Ang rebisadong pananalita ay nananatiling natural sa makabagong Filipino at pinananatili ang maigsi at mariing daloy ng magkakaugnay na sugnay. Ang “wala kayo” ay sadyang pinananatiling walang tinukoy na bagay, gaya ng Griyego.
