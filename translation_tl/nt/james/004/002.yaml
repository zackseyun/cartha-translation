base_translation:
  language: en
  yaml_path: translation/nt/james/004/002.yaml
  text: You desire and do not have[a]; you murder and envy and are not able to obtain; you fight and wage war[d][c][b]. You do not have because you do not ask.
translation:
  language: tl
  text: Nagnanasa kayo ngunit wala kayo.[a] Pumapaslang[b] kayo at naiinggit[c], ngunit hindi ninyo makamit. Nakikipag-away kayo at nakikipagdigmaan. Wala kayo dahil hindi kayo humihingi.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Nag-iimbot kayo.” Ang salitang Griyego ay tumutukoy sa matinding pagnanais, na sa kontekstong ito ay masama.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Pumapatay kayo.” Karaniwang mas tiyak na tumutukoy sa pagpaslang ang pandiwang Griyego. Nauunawaan ito ng ilan bilang retorikal na pananalita, ngunit pinananatili ng salin ang matinding diwa ng salita.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “nagseselos.”
    reason: lexical_alternative
  - marker: d
    text: Ipinahihiwatig ng kalapit na konteksto na Diyos ang hinihingan, bagaman hindi siya tahasang binanggit sa tekstong Griyego rito.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπιθυμεῖτε
  choice: nagnanasa kayo
  rationale: Ipinahahayag ng “magnasa” ang matinding pagnanais nang hindi ito nililimitahan sa seksuwal na pagnanasa o sa pag-iimbot sa ari-arian. Ipinakikita ng negatibong konteksto na mali ang uri ng pagnanasang tinutukoy.
- source_word: οὐκ ἔχετε
  choice: wala sa inyo ang inyong ninanasa
  rationale: Ginawang tahasan ang ipinahihiwatig na bagay na wala sa kanila upang maging likas at malinaw sa Tagalog, habang pinananatili ang kaibahan nito sa kasunod na “hindi ninyo makamit.”
- source_word: φονεύετε
  choice: pumapaslang kayo
  rationale: Mas tiyak at mabigat ang “pumaslang” kaysa sa pangkalahatang “pumatay,” kaya pinananatili nito ang matinding diwa ng pandiwang Griyego nang hindi ipinapaliwanag kung literal o retorikal ang gamit.
- source_word: ζηλοῦτε
  choice: naiinggit
  rationale: Bagaman maaaring tumukoy ang salita sa sigasig o selos, pinapaboran ng konteksto ng masamang pagnanasa at alitan ang negatibong diwang “naiinggit.”
- source_word: οὐ δύνασθε ἐπιτυχεῖν
  choice: hindi ninyo makamit
  rationale: Likas sa Tagalog ang “makamit” para sa kawalang-kakayahang maabot o makuha ang ninanasa at pinananatili nito ang diwa ng ἐπιτυγχάνω.
- source_word: μάχεσθε
  choice: nakikipag-away kayo
  rationale: Maaaring tumukoy ang μάχομαι sa pakikipaglaban o pakikipagtalo. Ang “nakikipag-away” ay natural at sapat na malakas sa konteksto, habang naiiba pa rin sa mas matinding kasunod na pandiwa.
- source_word: πολεμεῖτε
  choice: nakikipagdigmaan
  rationale: Pinananatili ng “nakikipagdigmaan” ang mas malakas na larawang pandigma at ang pag-igting mula sa “nakikipag-away.”
- source_word: διὰ τὸ μὴ αἰτεῖσθαι ὑμᾶς
  choice: dahil hindi kayo humihingi
  rationale: 'Ang διά na may articular infinitive ay sanhi: “dahil.” Hindi tahasang idinagdag ang Diyos bilang hinihingan sapagkat ipinahihiwatig lamang siya ng konteksto at hindi binabanggit sa talata.'
theological_decisions:
- issue: Kung dapat palambutin ang φονεύετε bilang metapora o retorikal na pagmamalabis
  choice: Panatilihin ang matinding salin na “pumapaslang kayo.”
  alternative: “Pumapatay kayo” o ang interpretibong “pumapaslang kayo sa inyong mga puso.”
  rationale: Malakas at tiyak ang pandiwang Griyego. Ang pagpapasya kung literal, retorikal, o metaporikal ito ay usaping pagpapakahulugan at hindi dapat tahimik na ipasok sa pangunahing salin.
- issue: Kung dapat tahasang idagdag ang Diyos bilang layon ng αἰτεῖσθαι
  choice: 'Iwang hindi binanggit ang layon: “hindi kayo humihingi.”'
  alternative: “Hindi kayo humihingi sa Diyos.”
  rationale: Maliwanag sa kalapit na konteksto na Diyos ang ipinahihiwatig na hinihingan, ngunit hindi siya tahasang pinangalanan sa tekstong Griyego ng talatang ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pumapaslang” upang mapanatili ang bigat ng orihinal, at ang magkatambal na “nakikipag-away” at “nakikipagdigmaan” upang hindi mapatag ang pag-igting ng dalawang pandiwang Griyego.
