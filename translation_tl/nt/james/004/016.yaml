id: JAS.4.16
reference: James 4:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: νῦν δὲ καυχᾶσθε ἐν ταῖς ἀλαζονείαις ὑμῶν· πᾶσα καύχησις τοιαύτη πονηρά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/016.yaml
  text: But as it is[a], you boast in your arrogance. All such boasting is evil.
translation:
  language: tl
  text: Ngunit ngayon, ipinagyayabang ninyo ang inyong mga mapagmataas na pagpapanggap.[a] Masama ang lahat ng ganitong pagyayabang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang inyong kayabangan,” “ang inyong mga mapagmataas na pag-aangkin,” o “ang inyong mga hambog na pagpapanggap.” Ang salitang Griyego ay tumutukoy sa mapagmataas na pagkukunwari o kumpiyansa sa sariling walang matibay na batayan; dito, malamang na kaugnay ito ng tiwala sa sariling mga plano na binanggit sa mga naunang talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν δὲ
  choice: Ngunit ngayon
  rationale: Pinananatili nito ang tuwirang panalungat sa mapagpakumbabang saloobin sa naunang talata at natural ito sa makabagong Tagalog.
- source_word: καυχᾶσθε
  choice: ipinagyayabang ninyo
  rationale: Tuwirang ipinahahayag ang pagyayabang at pinananatili ang kaugnayan nito sa pangngalang καύχησις sa hulihan ng talata.
- source_word: ἐν ταῖς ἀλαζονείαις ὑμῶν
  choice: ang inyong mga mapagmataas na pagpapanggap
  rationale: Ang ἀλαζονεία ay maaaring tumukoy sa hambog na pagpapanggap, mapagmataas na pag-aangkin, o tiwala sa sariling walang batayan. Pinananatili ng maramihang 'mga ... pagpapanggap' ang plural ng Griyego nang hindi tahasang dinaragdagan ng 'mga plano.'
- source_word: πᾶσα καύχησις τοιαύτη
  choice: lahat ng ganitong pagyayabang
  rationale: Natural na pangkalahatang pahayag ito sa Tagalog at pinananatili ang diwa ng 'bawat/lahat ng pagyayabang na ganito.'
- source_word: πονηρά
  choice: Masama
  rationale: Ipinahahayag nito ang malinaw na moral na paghatol, hindi lamang na hindi kanais-nais o mahina ang kalidad.
theological_decisions:
- issue: Saklaw ng hinahatulang pagyayabang
  choice: Ang hinahatulan ay mapagmataas at hambog na pagtitiwala sa sariling mga pag-aangkin o balak, lalo na sa konteksto ng Santiago 4:13–15.
  alternative: Maaaring unawain ito bilang pangkalahatang paghatol sa lahat ng uri ng pagtitiwala sa sarili, o bilang pagtukoy lamang sa pagpaplanong pangkalakalan.
  rationale: Ipinahihiwatig ng agarang konteksto ang tiwala sa sariling mga plano nang walang pagpapasakop sa kalooban ng Panginoon, ngunit hindi nililimitahan ng mismong talata ang prinsipyong moral sa kalakalan lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang 'mapagmataas na pagpapanggap' upang mapanatili ang lawak at maramihang anyo ng ἀλαζονείαις, habang inilagay sa talababa ang mahahalagang alternatibo at ang kaugnayan nito sa naunang konteksto.
