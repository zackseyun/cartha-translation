id: JAS.4.10
reference: James 4:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ταπεινώθητε ἐνώπιον ⸀κυρίου, καὶ ὑψώσει ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/010.yaml
  text: Humble yourselves before the Lord[b][a], and he will exalt you.
translation:
  language: tl
  text: Magpakumbaba kayo sa harap ng Panginoon[a], at itataas niya kayo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa presensya ng Panginoon.”
    reason: lexical_alternative
  - marker: b
    text: O “iaangat niya kayo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ταπεινώθητε
  choice: Magpakumbaba kayo
  rationale: Bagaman pasibo ang anyo ng pandiwa, maaari itong magkaroon ng pansarili o middle na diwa sa ganitong konteksto ng mga utos. Likas sa modernong Tagalog ang “magpakumbaba kayo” at malinaw na ipinahahayag ang kusang pagpapakumbaba.
- source_word: ἐνώπιον
  choice: sa harap ng
  rationale: Ang parirala ay natural at maikli sa Tagalog at maaaring magpahiwatig kapwa ng pagiging nasa presensya at ng pananagutan sa harap ng isang nakatataas.
- source_word: κυρίου
  choice: Panginoon
  rationale: Pinananatili ang karaniwang katawagan na “Panginoon” nang hindi nililinaw kung ang tinutukoy ay ang Diyos o ang Panginoong Jesus, sapagkat hindi iyon tahasang tinutukoy ng parirala.
- source_word: ὑψώσει
  choice: itataas
  rationale: Ang “itataas” ay tuwirang katumbas ng larawang nasa Griyego at natural ding nagpapahayag ng pagbibigay ng dangal o mataas na kalagayan, hindi lamang ng pisikal na pag-angat.
- source_word: ὑμᾶς
  choice: kayo
  rationale: Malinaw na pinananatili ng “kayo” ang ikalawang panauhang maramihan ng Griyego.
theological_decisions:
- issue: Ang tinutukoy ng “Panginoon”
  choice: Hindi tinukoy nang mas makitid; pinanatili bilang “Panginoon.”
  alternative: “Diyos” o “Panginoong Jesus”
  rationale: Maaaring gamitin ni Santiago ang κύριος para sa Diyos o kay Jesus. Hindi hinihingi ng agarang konteksto na lutasin ang pagtukoy, kaya pinananatili ang tunay na kalabuan ng teksto.
- issue: Kahulugan ng pagtaas
  choice: Pinanatili ang metaporang “itataas.”
  alternative: “pararangalan” o “iaangat”
  rationale: Ang ὑψόω ay maaaring tumukoy sa pag-angat sa kalagayan o karangalan. Ang “itataas” ay nagpapanatili sa metapora at hindi nililimitahan ang pangako sa emosyonal, panlipunan, o pangwakas na pagtaas lamang.
translation_notes:
  register: Makabago, tuwiran, at marangal na Tagalog. Ginamit ang “kayo” upang maipakita ang maramihang kausap, at iniwasan ang mas teknikal o denominasyonal na pananalita.
