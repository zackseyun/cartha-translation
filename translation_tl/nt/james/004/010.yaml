  source_fidelity: Tumpak na naipapahayag ng “Magpakumbaba kayo” ang paraenetikong, kusang-loob na diwa ng aorist passive imperative na ταπεινώθητε sa kontekstong ito. Ang “sa harap ng Panginoon” ay wastong katumbas ng ἐνώπιον κυρίου at hindi nililinaw nang lampas sa Griyego ang referent ng κύριος. Ang “itataas niya kayo” ay tapat na nagsasalin ng καὶ ὑψώσει ὑμᾶς at pinananatili ang metapora ng pag-angat/pagbibigay-karangalan.
  naturalness: Natural, malinaw, at marangal ang modernong Tagalog. Ang paggamit ng “kayo” ay angkop sa maramihang kausap, at maayos ang daloy ng dalawang magkaugnay na sugnay.
