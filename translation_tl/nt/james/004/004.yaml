  naturalness: Makabago at natural sa kabuuan ang Filipino. Ang “Kayong mga babaeng nangangalunya!” ay matalim ngunit angkop sa bokatibong pagsaway. Mas idiomatiko at malinaw sa kontekstong ito ang “pagiging kaaway ng Diyos” kaysa “pakikipag-alit sa Diyos.”
