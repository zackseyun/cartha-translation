  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀μοιχαλίδες, οὐκ οἴδατε ὅτι ἡ φιλία τοῦ κόσμου ἔχθρα τοῦ θεοῦ ἐστιν; ὃς ⸀ἐὰν οὖν βουληθῇ φίλος εἶναι τοῦ κόσμου, ἐχθρὸς τοῦ θεοῦ καθίσταται.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/004.yaml
  text: Adulteresses[a], do you not know that friendship with the world is hostility toward God? Therefore[d][c][b], whoever wants to be a friend of the world makes himself an enemy of God.
translation:
  language: tl
  text: Kayong mga babaeng nangangalunya[a]! Hindi ba ninyo alam na ang pakikipagkaibigan sa sanlibutan[b] ay pagiging kaaway ng Diyos?[c] Kung gayon, ang sinumang naghahangad na maging kaibigan ng sanlibutan ay nagiging kaaway ng Diyos.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay literal na “mga babaeng nangangalunya.” Malamang na ginagamit ito bilang metapora ng pagtataksil sa Diyos, na umaalingawngaw sa pananalita ng tipan sa mga propeta.
    reason: lexical_alternative
  - marker: b
    text: Ang “sanlibutan” dito ay tumutukoy sa kaayusan at mga pagpapahalaga ng sangkatauhang salungat sa Diyos, hindi sa sangnilikha mismo.
    reason: cultural_note
  - marker: c
    text: 'Maaari ring isalin: “pagkapoot sa Diyos” o “pakikipag-alit sa Diyos.”'
    reason: alternative_reading
  - marker: d
    text: 'Maaari ring isalin: “ginagawa ang sarili niyang kaaway ng Diyos.”'
    reason: alternative_reading
lexical_decisions:
- source_word: μοιχαλίδες
  choice: mga babaeng nangangalunya
  rationale: Pinananatili ang tahasang pambabaeng maramihan at ang matalim na larawan ng pangangalunya. Malamang na metapora ito ng espirituwal na pagtataksil, ngunit hindi iyon ipinapalit bilang paliwanag sa pangunahing teksto.
- source_word: οὐκ οἴδατε
  choice: Hindi ba ninyo alam
  rationale: Likas na Filipino para sa retorikal na negatibong tanong at pinananatili ang tuwirang pagsaway.
- source_word: φιλία
  choice: pakikipagkaibigan
  rationale: Tuwirang katumbas na nagpapanatili sa ugnayang diwa at sa leksikal na kaugnayan nito sa φίλος, “kaibigan,” sa kasunod na pangungusap.
- source_word: κόσμου
  choice: sanlibutan
  rationale: Karaniwan at marangal na salin ng κόσμος sa ganitong konteksto. Hindi pinalalawak sa pangunahing teksto bilang isang tiyak na “sistema” upang hindi lampasan ang sinabi ng Griyego.
- source_word: ἔχθρα τοῦ θεοῦ
  choice: pakikipag-alit sa Diyos
  rationale: Malinaw at natural na nagsasaad na ang pakikipagkaibigan sa sanlibutan ay salungat sa Diyos, habang hindi lubusang isinasara ang posibilidad ng relasyonal na diwang “alitan sa Diyos.”
- source_word: ὃς ἐὰν οὖν
  choice: Kung gayon, ang sinuman
  rationale: Ipinapakita ng “Kung gayon” ang kongklusyong ipinahihiwatig ng οὖν, at ng “ang sinuman” ang pangkalahatang saklaw ng di-tiyak na sugnay.
- source_word: βουληθῇ
  choice: naghahangad
  rationale: Ipinahahayag ang kusang pagnanais o pagpapasya nang hindi ginagawang simpleng di-sinasadyang kalagayan.
- source_word: φίλος εἶναι τοῦ κόσμου
  choice: maging kaibigan ng sanlibutan
  rationale: Pinananatili ang nominal na pahayag at ang malinaw na pagtutugma sa “pakikipagkaibigan” sa unang bahagi.
- source_word: ἐχθρὸς τοῦ θεοῦ
  choice: kaaway ng Diyos
  rationale: Tuwiran at mariing katapat ng “kaibigan ng sanlibutan,” ayon sa substantibong gamit ng pang-uri.
- source_word: καθίσταται
  choice: nagiging
  rationale: Natural na Filipino para sa pagpasok o pagkalagay sa isang katayuan. Ang kusang moral na pagkiling ay naipahahayag na ng “naghahangad,” kaya hindi kailangang ipilit sa pandiwa ang mas interpretibong “ginagawa ang sarili.”
theological_decisions:
- issue: Metaporikal na puwersa ng μοιχαλίδες
  choice: Panatilihin sa pangunahing teksto ang literal at pambabaeng panawag na “mga babaeng nangangalunya.”
  alternative: “Mga taong taksil” o “mga taong nangangalunya.”
  rationale: Malamang na umaalingawngaw ito sa wikang tipan ng mga propeta tungkol sa pagtataksil sa Diyos. Gayunman, pinananatili ng salin ang kongkretong metapora at minarkahang pambabaeng anyo sa halip na palitan iyon ng interpretasyon.
- issue: Kahulugan ng κόσμος
  choice: Isalin bilang “sanlibutan” at ipaliwanag ang kontekstuwal na saklaw sa talababa.
  alternative: “Kaayusang makasanlibutan na salungat sa Diyos.”
  rationale: Sa konteksto, hindi ang nilikhang daigdig mismo ang tinutukoy kundi ang kaayusan at mga pagpapahalagang salungat sa Diyos. Ang mas mahabang paliwanag ay magiging labis na interpretibo sa pangunahing teksto.
- issue: Puwersa ng καθίσταται
  choice: “nagiging kaaway ng Diyos”
  alternative: “ginagawa ang sarili niyang kaaway ng Diyos” o “inilalagay ang sarili bilang kaaway ng Diyos.”
  rationale: Maaaring ipahayag ng pandiwa ang pagpasok o pagkakalagay sa isang katayuan. Pinananatili ng “nagiging” ang lawak na ito; malinaw naman sa naunang kusang paghahangad ang pananagutan ng tao.
- issue: Ugnayan ng genitibo sa ἔχθρα τοῦ θεοῦ
  choice: “pakikipag-alit sa Diyos”
  alternative: “pagkapoot sa Diyos” o “alitan sa Diyos.”
  rationale: Ang konteksto ay malakas na sumusuporta sa pagkapoot o pagsalungat na nakatuon sa Diyos, ngunit ang relasyonal na anyong “pakikipag-alit” ay natural sa Filipino at hindi artipisyal na nilulutas ang lahat ng puwersa ng genitibo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang matalim na pambungad at ang magkatapat na “kaibigan” at “kaaway.” Ginamit ang “sanlibutan” bilang pamilyar na terminong biblikal, kalakip ang maikling paliwanag upang maiwasang ipakahulugan ito sa pisikal na sangnilikha.
