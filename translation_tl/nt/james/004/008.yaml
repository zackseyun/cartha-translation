  text: ἐγγίσατε τῷ θεῷ, καὶ ⸀ἐγγιεῖ ὑμῖν. καθαρίσατε χεῖρας, ἁμαρτωλοί, καὶ ἁγνίσατε καρδίας, δίψυχοι.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/008.yaml
  text: Draw near to God[a], and he will draw near to you. Cleanse your hands, sinners, and purify your hearts, double-minded people.
translation:
  language: tl
  text: Lumapit kayo sa Diyos, at lalapit siya sa inyo. Linisin ninyo ang inyong mga kamay, kayong mga makasalanan, at dalisayin ninyo ang inyong mga puso, kayong mga hati ang loob[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “may dalawang kaluluwa.” Inilalarawan nito ang taong hati ang katapatan o panloob na paninindigan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγίσατε
  choice: Lumapit kayo
  rationale: Nananatili ang pautos na anyong maramihan at ang diwa ng paglapit sa Diyos, habang natural sa makabagong Tagalog.
- source_word: τῷ θεῷ
  choice: sa Diyos
  rationale: Tuwirang katumbas ng dative object ng ἐγγίζω.
- source_word: ἐγγιεῖ
  choice: lalapit siya
  rationale: Pinananatili ang panghinaharap at ang pag-uulit ng pandiwang ‘lumapit’; malinaw sa naunang sugnay na ang Diyos ang tinutukoy ng ‘siya.’
- source_word: καθαρίσατε χεῖρας
  choice: Linisin ninyo ang inyong mga kamay
  rationale: Pinananatili ang matinding pautos at ang larawang pangkatawan na maaaring may rituwal at moral na pahiwatig.
- source_word: ἁμαρτωλοί
  choice: kayong mga makasalanan
  rationale: Inihahayag ang tuwirang panawag sa maramihan at pinananatili ang mariing pagsaway.
- source_word: ἁγνίσατε καρδίας
  choice: dalisayin ninyo ang inyong mga puso
  rationale: Ang ‘dalisayin’ ay naiiba sa ‘linisin,’ gaya ng pagkakaiba ng mga pandiwa sa Griyego, at ang ‘puso’ ay nagpapanatili sa larawan ng panloob na pagkatao.
- source_word: δίψυχοι
  choice: kayong mga hati ang loob
  rationale: Likas at malinaw sa Tagalog ang paglalarawan sa mga taong hati ang panloob na katapatan o pagpapasya, habang pinananatili ang tuwirang panawag.
theological_decisions:
- issue: Matalinghagang paglilinis ng mga kamay at mga puso
  choice: Panatilihin ang mga larawang ‘mga kamay’ at ‘mga puso’ nang walang paliwanag sa pangunahing teksto.
  alternative: Ipaliwanag bilang paglilinis ng panlabas na gawa at panloob na hangarin.
  rationale: Maaaring kapwa moral at rituwal ang alingawngaw ng pananalita. Ang pagpapanatili sa larawan ay hindi nagpapasikip sa tunay na saklaw nito.
- issue: Kahulugan ng δίψυχοι
  choice: Isalin bilang ‘mga hati ang loob’ at ilagay sa talababa ang mas literal na larawan.
  alternative: ‘mga dalawang-isip’ o literal na ‘dalawang-kaluluwa’
  rationale: Ang ‘hati ang loob’ ay nauunawaan ng karaniwang mambabasa at tumutukoy sa hating katapatan o panloob na paninindigan. Pinananatili ng talababa ang kapansin-pansing larawan ng Griyego.
translation_notes:
  register: Makabago, marangal, at tuwirang Tagalog. Ginamit ang ‘ninyo’ at ‘kayo’ upang malinaw na maipakita ang maramihang pautos at panawag. Pinanatili ang parallelism ng ‘lumapit/lalapit’ at ang pagkakaiba ng ‘linisin/dalisayin.’
