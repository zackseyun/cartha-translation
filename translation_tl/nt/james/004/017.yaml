  text: So[a], for the one who knows to do good and does not do it, it is sin for him.
translation:
  language: tl
  text: Kaya, ang taong nakaaalam ng mabuting gawin ngunit hindi ito ginagawa—para sa kanya, kasalanan iyon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Kaya, para sa sinumang nakaaalam kung ano ang mabuting gawin ngunit hindi ito ginagawa, kasalanan iyon.”'
    reason: Ipinakikita ang alternatibong mas tahasang pagpapahayag ng pangkalahatang substantival participle at ng ipinahihiwatig na layon ng “ginagawa,” nang hindi idaragdag ang salitang “dapat.”
lexical_decisions:
- source_word: εἰδότι
  choice: ang nakaaalam
  rationale: Ang datibong pang-isahang participle ay ginagamit bilang pangngalan at tumutukoy sa sinumang taong may ganitong kaalaman. Pinananatili ng “ang nakaaalam” ang pang-isahan at pangkalahatang bisa.
- source_word: οὖν
  choice: Kaya
  rationale: Nagpapahayag ito ng kongklusyong hinango mula sa naunang talakayan; natural at malinaw ang “Kaya” sa makabagong Tagalog.
- source_word: καλὸν ποιεῖν
  choice: na gumawa ng mabuti
  rationale: Malawak ang etikal na kahulugan ng καλόν bilang mabuti o tama. Ang “gumawa ng mabuti” ay tuwiran, natural, at hindi nagpapakitid sa isang partikular na tungkulin.
- source_word: μὴ ποιοῦντι
  choice: ngunit hindi ito ginagawa
  rationale: Ipinakikita ng participle na may μή ang salungatan sa pagitan ng nalalamang mabuti at ng hindi paggawa nito. Ginagawang hayag ng “ito” ang ipinahihiwatig na layon.
- source_word: ἁμαρτία
  choice: kasalanan iyon
  rationale: Ang walang-artikulong panaguring pangngalan ay naglalarawan sa hindi ginawang mabuti bilang kasalanan. Likas sa Tagalog ang “kasalanan iyon” at hindi nito binabawasan ang bigat ng pahayag.
- source_word: αὐτῷ
  choice: para sa kanya
  rationale: Ipinahahayag ng datibo ang pagtukoy sa taong nakaaalam ngunit hindi gumagawa. Pinananatili ng “para sa kanya” ang personal at pang-isahang aplikasyon.
- source_word: ἐστιν
  choice: iyon
  rationale: Sa Tagalog, sapat ang sugnay na “kasalanan iyon” upang ipahayag ang ugnayang kopular nang hindi nangangailangan ng hiwalay na katumbas ng “ay/ito ay.”
theological_decisions:
- issue: Saklaw ng pahayag tungkol sa hindi paggawa ng mabuti
  choice: Ipinahahayag ng talata na kasalanan para sa isang tao ang sadyang hindi paggawa ng mabuting alam niyang gawin, habang nananatiling kaugnay ito sa naunang usapin ng mapagmataas na pagpaplano.
  alternative: Limitahan ang pahayag sa agarang konteksto lamang, o tahasang gawing sistematikong doktrina tungkol sa lahat ng kasalanan ng pagkukulang.
  rationale: May agarang kaugnayan ang οὖν sa naunang talakayan, ngunit pangkalahatan ang pagkakabuo ng pahayag. Pinananatili ng salin ang parehong kontekstuwal na ugnayan at malawak na etikal na bisa nang hindi nag-aangkat ng denominasyonal na balangkas.
translation_notes:
  register: Makabago, dignificado, at madaling maunawaang Filipino. Ginamit ang “nakaaalam” bilang pormal ngunit karaniwang anyo; iniwasan ang labis na teknikal o denominasyonal na pananalita. Ang gitling-pahaba ay nagbibigay-linaw sa pangwakas na personal na diin.
