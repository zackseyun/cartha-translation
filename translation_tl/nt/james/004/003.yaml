  source_fidelity: 'Tapat ang salin sa daloy at kahulugan ng Griyego: ang paulit-ulit na paghingi, hindi pagtanggap, dahilang ipinahahayag ng διότι, maling paraan ng paghingi, at layuning gugulin ang hinihingi para sa sariling ἡδοναί ay lahat naipapahayag. Ang “ito” ay isang likas na paglilinaw sa Filipino para sa ipinahihiwatig na bagay na hinihingi at ginugugol, nang hindi ito tinutukoy nang lampas sa teksto.'
