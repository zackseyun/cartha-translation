  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: αἰτεῖτε καὶ οὐ λαμβάνετε, διότι κακῶς αἰτεῖσθε, ἵνα ἐν ταῖς ἡδοναῖς ὑμῶν δαπανήσητε.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/003.yaml
  text: You ask and do not receive[a], because you ask wrongly[b], so that you may spend it on your pleasures.
translation:
  language: tl
  text: 'Humihingi kayo ngunit hindi kayo tumatanggap, sapagkat mali ang inyong paghingi: hinihingi ninyo ito upang gastusin sa inyong mga layaw.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga layaw” ay maaari ring isaling “mga kasiyahan,” “mapagpalayaw na pagnanasa,” o “mga pita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτεῖτε
  choice: Humihingi kayo
  rationale: Likas at tuwirang katumbas ito para sa paghingi, na sa konteksto ay malamang tumutukoy sa panalangin, nang hindi tahasang idinaragdag ang Diyos bilang layon.
- source_word: οὐ λαμβάνετε
  choice: hindi kayo tumatanggap
  rationale: Pinananatili nito ang malinaw na ugnayan ng paghingi at pagtanggap at ang marangal ngunit karaniwang rehistro.
- source_word: διότι κακῶς αἰτεῖσθε
  choice: sapagkat mali ang inyong paghingi
  rationale: Isinasalin ng “mali” ang malawak na diwa ng κακῶς nang hindi ito nililimitahan sa motibo lamang; ipinaliliwanag ng kasunod na sugnay kung bakit mali ang paghingi.
- source_word: ἵνα
  choice: upang
  rationale: Malinaw at natural na ipinahahayag ang layuning ipinakikita ng ἵνα.
- source_word: ἐν ταῖς ἡδοναῖς ὑμῶν
  choice: sa inyong mga layaw
  rationale: Sa kontekstong negatibo, ang “mga layaw” ay natural na naghahatid ng diwa ng mga kasiyahan o pagnanasang mapagpalayaw sa sarili, nang hindi gumagamit ng mas teknikal na salita.
- source_word: δαπανήσητε
  choice: gastusin
  rationale: Neutral at tuwirang katumbas ito ng paggugol; iniiwasan ng salin ang mas matinding “lustayin,” na maaaring magdagdag ng kahulugang hindi likas sa pandiwa mismo.
theological_decisions:
- issue: Kung tahasang sasabihing ang paghingi ay sa Diyos sa panalangin
  choice: 'Iwanang hindi tahasang binanggit ang layon: “Humihingi kayo”'
  alternative: “Humihingi kayo sa Diyos”
  rationale: Ipinahihiwatig ng konteksto ang panalangin, ngunit hindi tahasang binabanggit ng Griyego ang Diyos sa talatang ito.
- issue: Kung lilimitahan ang κακῶς sa maling motibo
  choice: “mali ang inyong paghingi”
  alternative: “humihingi kayo nang may maling motibo”
  rationale: Mas malawak ang κακῶς kaysa motibo lamang, at ang kasunod na sugnay ang naglilinaw sa maling layunin.
- issue: Kung paano ipahahayag ang layon ng paggugol na ipinahihiwatig ngunit hindi tahasang inuulit sa Griyego
  choice: “hinihingi ninyo ito upang gastusin”
  alternative: “upang gastusin ninyo sa inyong mga layaw”
  rationale: Ang “ito” ay natural na tumutukoy sa hinihingi at ginagawang malinaw ang Filipino nang hindi tinutukoy kung anong partikular na bagay ang hinihingi.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang “mga layaw” upang maipakita ang negatibong konteksto ng ἡδοναῖς, habang pinananatiling neutral ang “gastusin.”
