base_translation:
  language: en
  yaml_path: translation/nt/james/004/009.yaml
  text: Be miserable and mourn and weep[b][a]. Let your laughter be turned into mourning and your joy into gloom.
translation:
  language: tl
  text: Magpakahapis kayo[a], magluksa, at umiyak. Ang inyong pagtawa ay mapalitan ng pagluluksa, at ang inyong kagalakan ay mapalitan ng kalumbayan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Magdusa kayo.” Ang pandiwang Griego ay maaaring tumukoy sa pagiging nasa matinding paghihirap o kaabahan.
    reason: lexical_alternative
  - marker: b
    text: O, “panlulumo.” Ang salitang Griego ay tumutukoy sa isang mabigat at nakayukong kalagayan ng loob.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταλαιπωρήσατε
  choice: Magpakahapis kayo
  rationale: Ipinahahayag nito ang matinding paghihirap o kaabahan na hinihingi ng pautos, nang hindi ito ipinagkakamali sa kasunod na tiyak na utos na magluksa.
- source_word: πενθήσατε
  choice: magluksa
  rationale: Karaniwang katumbas ito ng pagdadalamhati at angkop sa konteksto ng taimtim na pagsisisi.
- source_word: κλαύσατε
  choice: umiyak
  rationale: Tuwirang ipinahahayag ang hayagang pagluha at pinananatili ang kaibhan nito sa pagluluksa.
- source_word: ὁ γέλως ὑμῶν
  choice: ang inyong pagtawa
  rationale: Natural at kongkretong salin ito ng pangngalang tumutukoy sa kanilang pagtawa.
- source_word: εἰς πένθος
  choice: ng pagluluksa
  rationale: Pinananatili ang ugnayang leksikal sa naunang magluksa at ang bigat ng pagdadalamhati.
- source_word: μετατραπήτω
  choice: ay mapalitan
  rationale: Sinasalamin nito ang aorist passive imperative bilang mariing panawagan sa pagbabago ng kalagayan nang hindi tahasang nagdaragdag kung sino ang gumagawa ng pagbabago.
- source_word: ἡ χαρὰ
  choice: ang inyong kagalakan
  rationale: Likas sa paralelismo na dalhin sa ikalawang sugnay ang pagmamay-aring tahasang nasa unang sugnay.
- source_word: εἰς κατήφειαν
  choice: ng kalumbayan
  rationale: Ipinahahayag nito ang mabigat at nakayukong kalagayan ng loob; mas angkop ito kaysa sa pangkalahatang kalungkutan.
theological_decisions:
- issue: Tindi ng panawagan sa pagsisisi
  choice: Pinanatili ang magkakasunod at mariing pautos na magpakahapis, magluksa, at umiyak.
  alternative: Palambutin ito bilang pangkalahatang panawagan lamang na maging seryoso o mapagpakumbaba.
  rationale: Sa konteksto ng Santiago 4:6–10, hinihingi ang mapagpakumbaba at malungkot na pagtalikod sa kasalanan. Hindi dapat pahupain ang tindi ng mga pautos, ngunit hindi rin dapat magdagdag ng paliwanag na doktrinal sa mismong talata.
translation_notes:
  register: Makabago at malinaw na Filipino na may taimtim at marangal na himig. Ginamit ang “hapis” at “kalumbayan” upang mapanatili ang solemnidad at ang pagkakaiba ng tatlong pautos at dalawang magkatapat na kalagayan.
