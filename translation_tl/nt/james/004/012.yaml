id: JAS.4.12
reference: James 4:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἷς ⸀ἐστιν νομοθέτης ⸂καὶ κριτής⸃, ὁ δυνάμενος σῶσαι καὶ ἀπολέσαι· σὺ δὲ τίς εἶ, ⸂ὁ κρίνων⸃ τὸν ⸀πλησίον;
base_translation:
  language: en
  yaml_path: translation/nt/james/004/012.yaml
  text: There is one Lawgiver and Judge, the one who is able to save and to destroy. But who are you, judging your neighbor?
translation:
  language: tl
  text: Iisa lamang ang Tagapagbigay ng Kautusan at Hukom—ang may kakayahang magligtas at pumuksa. Ngunit sino ka, na humahatol sa iyong kapwa?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νομοθέτης
  choice: Tagapagbigay ng Kautusan
  rationale: Tuwirang ipinahahayag ang natatanging awtoridad ng nagbibigay o nagtatakda ng kautusan, sa natural at marangal na modernong Tagalog.
- source_word: κριτής / κρίνων
  choice: Hukom / humahatol
  rationale: Pinananatili ang ugnayang leksikal sa pagitan ng Diyos bilang Hukom at ng taong humahatol, habang gumagamit ng natural na anyong pangngalan at pandiwa sa Tagalog.
- source_word: σῶσαι
  choice: magligtas
  rationale: Karaniwang katumbas na malinaw at angkop sa teolohikal at pangkalahatang diwa ng pandiwa.
- source_word: ἀπολέσαι
  choice: pumuksa
  rationale: Ipinapakita ang malakas na diwa ng pagwasak o paglipol nang hindi nililimitahan ang kahulugan sa pisikal na pagpatay lamang.
- source_word: πλησίον
  choice: kapwa
  rationale: Natural na modernong Tagalog para sa taong kaugnay o kalapit sa isa, at angkop sa etikal na konteksto.
theological_decisions:
- issue: Pagkakaisa ng mga titulong νομοθέτης at κριτής
  choice: Iisa lamang ang Tagapagbigay ng Kautusan at Hukom
  alternative: Iisa lamang ang Tagapagbigay ng Kautusan, ang Hukom
  rationale: Sinusunod ang pangunahing tekstong SBLGNT na may καὶ, kaya kapwa titulo ang inuugnay sa iisang persona nang hindi nagdaragdag ng paliwanag.
- issue: Saklaw ng ἀπολέσαι
  choice: pumuksa
  alternative: magpahamak
  rationale: Pinananatili ang matinding kaibahan sa 'magligtas' at ang posibilidad ng ganap na pagwasak, nang hindi tinutukoy nang higit sa sinasabi ng talata ang eksaktong anyo o panahon nito.
- issue: Diwa ng participle na ὁ κρίνων
  choice: sino ka, na humahatol sa iyong kapwa?
  alternative: sino ka para humatol sa iyong kapwa?
  rationale: Mas malapit sa tekstong Griyego ang paglalarawan sa aktuwal na humahatol kaysa sa tahasang pagbubuo nito bilang tanong tungkol sa karapatan o pahintulot, bagaman ipinahihiwatig iyon ng konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang malaking titik sa mga titulong tumutukoy sa Diyos, at ang gitling na em dash upang malinaw na iugnay ang nag-iisang Tagapagbigay ng Kautusan at Hukom sa kasunod na pariralang naglalarawan sa kanya.
