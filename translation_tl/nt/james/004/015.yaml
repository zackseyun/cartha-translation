source:
  edition: SBLGNT
  text: ἀντὶ τοῦ λέγειν ὑμᾶς· Ἐὰν ὁ κύριος ⸀θελήσῃ, καὶ ⸀ζήσομεν καὶ ⸀ποιήσομεν τοῦτο ἢ ἐκεῖνο.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/015.yaml
  text: Instead, you ought to say, “If the Lord wills, we will live and also do this or that.”
translation:
  language: tl
  text: Sa halip, dapat ninyong sabihin[a], “Kung loloobin ng Panginoon, mabubuhay kami at gagawin namin ito o iyon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “sa halip na sabihin ninyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντὶ τοῦ λέγειν ὑμᾶς
  choice: Sa halip, dapat ninyong sabihin
  rationale: Ang ἀντὶ τοῦ kasama ang pawatas ay literal na ‘sa halip na sabihin ninyo.’ Ginagawang malinaw ng ‘dapat ninyong sabihin’ ang ipinahihiwatig na pagtutuwid at likas itong pakinggan sa makabagong Tagalog; inilalahad sa talababa ang mas literal na anyo.
- source_word: Ἐὰν
  choice: Kung
  rationale: Nagsisimula ito ng kondisyong may pandiwang nasa subjunctive; ‘kung’ ang tuwiran at natural na katumbas.
- source_word: ὁ κύριος
  choice: ang Panginoon
  rationale: Pinananatili ang karaniwang katumbas ng κύριος at hindi tinutukoy nang higit sa sinasabi ng Griyego kung ang tinutukoy ay ang Ama o si Jesus.
- source_word: θελήσῃ
  choice: loloobin
  rationale: Ipinahahayag ng θέλω ang pagpapasya o kalooban. Ang ‘loloobin’ ay marangal at natural sa kontekstong tumutukoy sa kalooban ng Panginoon.
- source_word: καὶ ζήσομεν
  choice: mabubuhay kami
  rationale: Ipinapakita ng panghinaharap na pandiwa na maging ang patuloy na buhay ng mga nagsasalita ay nakasalalay sa kalooban ng Panginoon.
- source_word: καὶ ποιήσομεν
  choice: at gagawin namin
  rationale: Ang ποιέω ay may malawak na diwang ‘gawin.’ Sapat na kinakatawan ng ‘at’ ang pagkakaugnay ng pamumuhay at pagkilos nang hindi nagdaragdag ng di-kailangang diin.
- source_word: τοῦτο ἢ ἐκεῖνο
  choice: ito o iyon
  rationale: Natural na pariralang Tagalog para sa mga gawaing binabalak ngunit hindi tiyak na tinutukoy.
theological_decisions:
- issue: Ang tinutukoy ng ‘Panginoon’ at ang diin ng kondisyong pahayag
  choice: Isinalin bilang ‘Panginoon’ nang hindi nililinaw pa kung sino ang espesipikong tinutukoy.
  alternative: Diyos; ang Panginoong Jesus
  rationale: ὁ κύριος lamang ang sinasabi ng Griyego. Pinananatili ng salin ang diin sa kapangyarihan ng Panginoon sa buhay at mga plano, pati ang tunay na kalabuan kung ang Ama o si Jesus ang espesipikong tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang pangmaramihang ‘ninyo/kami’ ayon sa mga anyong Griyego at iniwasan ang labis na pormal o denominasyonal na pananalita.
