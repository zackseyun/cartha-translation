  text: μείζονα δὲ δίδωσιν χάριν· διὸ λέγει· Ὁ θεὸς ὑπερηφάνοις ἀντιτάσσεται ταπεινοῖς δὲ δίδωσιν χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/006.yaml
  text: But he gives greater grace. Therefore it says[a], “God opposes the proud, but gives grace to the humble.”
translation:
  language: tl
  text: Ngunit nagbibigay siya ng higit na biyaya. Kaya sinasabi[a], “Sinasalungat ng Diyos ang mga mapagmataas, ngunit nagbibigay siya ng biyaya sa mga mapagpakumbaba.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Kaya sinasabi niya,” o “Kaya sinasabi ng Kasulatan.” Hindi tahasang binabanggit sa Griyego ang simuno ng “sinasabi.”
    reason: alternative_reading
lexical_decisions:
- source_word: μείζονα
  choice: mas higit na
  rationale: Pinananatili ang pahambing na diwa ng salita at likas itong kaugnay ng “biyaya” sa modernong Tagalog.
- source_word: δίδωσιν χάριν
  choice: nagbibigay ng biyaya / ibinibigay ... ang biyaya
  rationale: Tuwirang inililipat ang pandiwa at layon; ang bahagyang pagbabago ng ayos sa unang pangungusap ay para sa likas na daloy ng Tagalog, habang pinananatili ang pag-uulit.
- source_word: διὸ
  choice: Kaya
  rationale: Malinaw at natural na naghahayag ng kongklusyon o bunga mula sa naunang pahayag.
- source_word: λέγει
  choice: sinasabi
  rationale: Hindi tinutukoy ang simuno, gaya ng Griyego, kaya hindi ipinapalagay kung Diyos, Kasulatan, o ibang tahasang simuno ang nagsasalita.
- source_word: ὑπερηφάνοις
  choice: ang mga mapagmataas
  rationale: Natural na substantibong paglalarawan sa mga taong palalo o hambog at malinaw na katapat ng “mga mapagpakumbaba.”
- source_word: ἀντιτάσσεται
  choice: sinasalungat
  rationale: Ipinahahayag ang aktibo at matatag na pagkontra ng Diyos nang malinaw sa kasalukuyang Tagalog.
- source_word: ταπεινοῖς
  choice: ang mga mapagpakumbaba
  rationale: Inililipat ang etikal na diwa ng pagiging mapagpakumbaba nang hindi ito nililimitahan sa mababang katayuan sa lipunan.
- source_word: δὲ
  choice: Ngunit
  rationale: Pinananatili ang pagsalungat sa simula ng talata at sa loob ng sipi.
theological_decisions:
- issue: Di-tiyak na simuno ng λέγει sa pormula ng pagsipi
  choice: Kaya sinasabi
  alternative: Kaya sinasabi niya / Kaya sinasabi ng Kasulatan
  rationale: Walang tahasang simuno sa Griyego. Ang paggamit ng “sinasabi” nang walang simuno ay nagpapanatili sa tunay na kalabuan at umiiwas sa pagdaragdag ng tiyak na tagapagsalita.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “biyaya,” “mapagmataas,” at “mapagpakumbaba” bilang pamilyar ngunit dignified na mga terminong biblikal; iniwasan ang labis na pormal o makalumang ayos.
