id: JAS.4.13
reference: James 4:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἄγε νῦν οἱ λέγοντες· Σήμερον ⸀ἢ αὔριον ⸀πορευσόμεθα εἰς τήνδε τὴν πόλιν καὶ ⸀ποιήσομεν ἐκεῖ ⸀ἐνιαυτὸν καὶ ⸀ἐμπορευσόμεθα καὶ ⸀κερδήσομεν·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/013.yaml
  text: Come now[a], you who say, “Today or tomorrow we will go into this city and spend a year there and do business and make a profit.”
translation:
  language: tl
  text: Makinig kayo ngayon, kayong nagsasabi, “Ngayon o bukas ay pupunta kami sa lungsod na ito[a], mananatili roon nang isang taon, magnenegosyo, at kikita.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas idyomatikong pananalita, “sa ganito’t ganyang lungsod.” Literal na “sa lungsod na ito” ang Griyego at gumagamit ito ng demonstratibo para sa isang partikular na lungsod na nasa plano ng mga nagsasalita.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄγε νῦν
  choice: Makinig kayo ngayon
  rationale: Isang idyomatikong panawag-pansin na nagpapasimula ng pagsaway. Likas ito sa modernong Tagalog at pinananatili ang tuwiran at mariing tono.
- source_word: οἱ λέγοντες
  choice: kayong nagsasabi
  rationale: Ang participle na may pantukoy ay ginagamit bilang tuwirang pagtawag sa mga kausap; malinaw itong naihahayag ng ikalawang panauhan.
- source_word: Σήμερον ἢ αὔριον
  choice: Ngayon o bukas
  rationale: Ang ἢ ay naghahayag ng pagpipilian, kaya pinananatili ang “o” at ang diwa ng tiyak na pagpaplano para sa nalalapit na panahon.
- source_word: πορευσόμεθα
  choice: pupunta kami
  rationale: Karaniwang kahulugan ng pandiwa rito ang payak na pagpunta; natural at sapat na tiyak ang salin.
- source_word: εἰς τήνδε τὴν πόλιν
  choice: sa lungsod na ito
  rationale: Pinananatili ang demonstratibong τήνδε, na tumutukoy sa isang partikular na lungsod sa plano ng mga nagsasalita. Ang “sa” ang natural na katumbas ng εἰς sa kontekstong ito.
- source_word: ποιήσομεν ἐκεῖ ἐνιαυτόν
  choice: mananatili roon nang isang taon
  rationale: Ang ποιέω na may panahong akusatibo ay idyomang nangangahulugang magpalipas o manatili sa loob ng takdang panahon. Natural sa Tagalog ang “mananatili roon nang isang taon.”
- source_word: ἐμπορευσόμεθα
  choice: magnenegosyo
  rationale: Tumutukoy ang pandiwa sa pangangalakal o gawaing komersiyal. Malinaw at kasalukuyang gamit ang “magnenegosyo.”
- source_word: κερδήσομεν
  choice: kikita
  rationale: Sa konteksto ng pangangalakal, tumutukoy ito sa pagkamit ng pakinabang na salapi. Ang “kikita” ay natural at malinaw nang hindi nagdaragdag ng hindi hayag sa teksto.
theological_decisions:
- issue: Tono ng tuwirang pagsaway
  choice: 'Tuwirang pagtawag: “kayong nagsasabi”'
  alternative: 'Di-tuwirang paglalarawan: “ang mga nagsasabi”'
  rationale: Tuwirang kinakaharap ni Santiago ang mga mapagpalalong nagpaplano; pinananatili ng ikalawang panauhan ang retorikal na lakas ng Griyego nang hindi nagdaragdag ng doktrinal na interpretasyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at tuwiran. Ginamit ang “Makinig kayo ngayon” bilang likas na panawag-pansin sa pagsaway; iniwasan ang lipas o sobrang pormal na pananalita. Pinanatili sa talababa ang posibleng idyomatikong pagbasa ng demonstratibo.
