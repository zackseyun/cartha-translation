  text: Μὴ καταλαλεῖτε ἀλλήλων, ἀδελφοί· ὁ καταλαλῶν ἀδελφοῦ ⸀ἢ κρίνων τὸν ἀδελφὸν αὐτοῦ καταλαλεῖ νόμου καὶ κρίνει νόμον· εἰ δὲ νόμον κρίνεις, οὐκ εἶ ποιητὴς νόμου ἀλλὰ κριτής.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/011.yaml
  text: Do not speak against one another[a], brothers. The one who speaks against a brother or judges his brother speaks against the law and judges the law. But if you judge the law[b], you are not a doer of the law but a judge.
translation:
  language: tl
  text: Huwag kayong magsalita laban sa isa’t isa[a], mga kapatid[b]. Ang nagsasalita laban sa isang kapatid o humahatol sa kanyang kapatid ay nagsasalita laban sa kautusan at humahatol sa kautusan. Ngunit kung humahatol ka sa kautusan, hindi ka tagatupad ng kautusan kundi hukom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “manirang-puri sa isa’t isa”; ang pandiwang Griyego ay maaaring tumukoy sa pagsasalita laban sa isang tao sa paraang naninira o nanlalait.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Griyego ay nasa anyong panlalaking maramihan, ngunit malamang na tumutukoy ito sa buong sambayanan—mga kapatid na lalaki at babae.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταλαλεῖτε / καταλαλῶν / καταλαλεῖ
  choice: magsalita laban / nagsasalita laban
  rationale: Pinananatili nito ang pag-uulit ng pandiwang Griyego at ang malawak na diwang pagsasalita nang masama o mapanirang laban sa iba, nang hindi nililimitahan sa pormal na paninirang-puri.
- source_word: ἀλλήλων
  choice: isa't isa
  rationale: Likas at karaniwang katumbas sa Filipino para sa reciprocal na diwa.
- source_word: ἀδελφοί / ἀδελφοῦ / τὸν ἀδελφὸν αὐτοῦ
  choice: mga kapatid / isang kapatid / kanyang kapatid
  rationale: Ang “kapatid” ay likas na walang tiyak na kasarian sa Filipino, pinananatili ang metaporang pampamilya, at maaaring tumukoy sa buong sambayanan.
- source_word: ἢ
  choice: o
  rationale: 'Pinananatili ang disjunctive na ugnayan ng dalawang magkaugnay na kilos: pagsasalita laban sa kapatid o paghatol sa kanya.'
- source_word: κρίνων / κρίνει / κρίνεις
  choice: humahatol / hinahatulan
  rationale: Pinananatili ang leksikal na pag-uulit at mas angkop sa moral at hudisyal na diwa kaysa sa pangkalahatang “humuhusga.”
- source_word: νόμου / νόμον
  choice: ang kautusan / sa kautusan
  rationale: Ang “kautusan” ay dignified at pamilyar na salin ng νόμος sa kontekstong biblikal; hindi nito tinutukoy nang higit sa sinabi ng talata kung alin mismong kautusan ang tinutukoy.
- source_word: ποιητὴς
  choice: tagatupad
  rationale: Natural sa Filipino at malinaw na nagpapahayag ng taong gumagawa o sumusunod sa hinihingi ng kautusan.
- source_word: κριτής
  choice: hukom
  rationale: Direktang pangngalan at matalas na katapat ng “tagatupad,” gaya ng balangkas ng Griyego.
theological_decisions:
- issue: Saklaw ng ἀδελφοί
  choice: Isalin bilang “mga kapatid,” na likas na maaaring sumaklaw sa mga lalaki at babae.
  alternative: “mga kapatid na lalaki” o “mga kapatid na lalaki at babae”
  rationale: Mas tumpak at natural ang walang-kasariang “mga kapatid” sa Filipino; hindi kailangan ang pagpapaliwanag sa pangunahing teksto, ngunit nililinaw sa talababa ang saklaw ng Griyegong anyo.
- issue: Tinutukoy ng “kautusan”
  choice: Panatilihin lamang bilang “ang kautusan.”
  alternative: “Kautusan ni Moises,” “maharlikang kautusan,” o “kautusan ng Diyos”
  rationale: Maaaring kaugnay ito ng banal na tuntuning tinalakay na ni Santiago, lalo na ng pag-ibig sa kapwa, ngunit hindi iyon tahasang nililinaw ng talatang ito.
- issue: Ugnayan ng pagsasalita laban sa kapatid at paghatol sa kautusan
  choice: Panatilihin ang tuwirang pahayag na ang gumagawa nito ay nagsasalita laban sa at humahatol sa kautusan.
  alternative: Ipaliwanag na inilalagay ng tao ang sarili sa ibabaw ng kautusan.
  rationale: Ipinahihiwatig ng argumento ang alternatibo, ngunit hindi ito dapat idagdag bilang paliwanag sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kautusan,” “tagatupad,” at “hukom” upang mapanatili ang pormal na bigat at ang magkakaugnay na pag-uulit ng argumento. Lahat ng talababa ay may katugmang marker sa pangunahing teksto.
