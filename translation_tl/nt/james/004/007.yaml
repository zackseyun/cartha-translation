base_translation:
  language: en
  yaml_path: translation/nt/james/004/007.yaml
  text: Submit yourselves[a], therefore, to God. But resist the devil, and he will flee from you.
translation:
  language: tl
  text: Kaya nga, magpasakop kayo[a] sa Diyos. Ngunit labanan ninyo ang diyablo, at tatakas siya palayo sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Magpailalim kayo sa Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποτάγητε
  choice: magpasakop kayo
  rationale: 'Ang aorist passive imperative ay may diwang pansarili sa payo: kusang kilalanin at tanggapin ang pamamahala ng Diyos. Natural at malinaw sa modernong Tagalog ang “magpasakop kayo.”'
- source_word: οὖν
  choice: Kaya nga
  rationale: Ipinapakita nito na ang utos ay kongklusyon o bunga ng naunang pangangatuwiran; malinaw na naiuugnay ng “kaya nga” ang talata sa naunang sinabi.
- source_word: τῷ θεῷ
  choice: sa Diyos
  rationale: Ito ang likas na Tagalog na kaganapan ng pandiwang “magpasakop.”
- source_word: ἀντίστητε
  choice: labanan ninyo
  rationale: Ang aorist active imperative ay panawagang manindigan laban o tumutol. Mas tuwiran at karaniwan sa Tagalog ang “labanan ninyo” kaysa “tumindig kayo laban.”
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahahayag ang bahagyang pagsalungat sa pagitan ng pagpapasakop sa Diyos at paglaban sa diyablo.
- source_word: τῷ διαβόλῳ
  choice: ang diyablo
  rationale: Sa konteksto, ang articular διάβολος ay tumutukoy sa personal na espirituwal na kalaban, hindi lamang sa isang maninirang-puri.
- source_word: καὶ
  choice: at
  rationale: Payak na nag-uugnay sa utos at sa tiyak na magiging bunga nito.
- source_word: φεύξεται
  choice: lalayo siya
  rationale: Ipinahahayag ng future middle indicative ang paglayo o pagtakas ng diyablo bilang bunga ng paglaban. Natural sa Tagalog ang “lalayo siya” at hindi nito pinalalabis ang paraan ng pagtakas.
- source_word: ἀφ’ ὑμῶν
  choice: sa inyo
  rationale: Kasama ng “lalayo,” malinaw nitong ipinahahayag ang pagkilos palayo mula sa mga kinakausap.
theological_decisions:
- issue: Kahulugan ng διάβολος
  choice: ang diyablo bilang personal na espirituwal na kalaban
  alternative: ang maninirang-puri bilang mas pangkalahatang tao o puwersa
  rationale: May pantukoy ang salita sa Griyego at nasa konteksto ng espirituwal na pakikipaglaban. Pinakamalinaw na tumutukoy ito sa diyablo bilang isang personal na kalaban, hindi sa abstraktong kasamaan lamang.
- issue: Ugnayan ng pagpapasakop at paglaban
  choice: Pinanatili ang pagsalungat sa pamamagitan ng “Ngunit”
  alternative: Pagdugtungin lamang sa “at”
  rationale: 'Ang δέ ay nagpapakita ng banayad na pagsalungat: pagpapasakop sa Diyos sa isang panig at aktibong paglaban sa diyablo sa kabila. Hindi ipinapaliwanag nang higit sa sinasabi ng teksto ang kaugnayan ng dalawang utos.'
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang maramihang “kayo/ninyo/inyo” ayon sa ὑμῶν, at iniwasan ang masyadong teknikal o makalumang pananalita.
