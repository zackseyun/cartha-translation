  text: ἢ δοκεῖτε ὅτι κενῶς ἡ γραφὴ λέγει· Πρὸς φθόνον ἐπιποθεῖ τὸ πνεῦμα ὃ ⸀κατῴκισεν ἐν ἡμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/james/004/005.yaml
  text: Or do you think that the Scripture speaks in vain? The Spirit whom he caused to dwell in us yearns jealously[a].
translation:
  language: tl
  text: 'O iniisip ba ninyo na nagsasalita nang walang kabuluhan ang Kasulatan: “Ang Espiritung pinatira niya sa atin ay nananabik nang may paninibugho”[a]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “Ang espiritung pinatira niya sa atin ay nananabik nang may inggit.” Maaaring tumukoy ang Griyego sa Banal na Espiritu o sa espiritu ng tao, at ang pariralang isinaling “nang may paninibugho” ay maaari ring isaling “nang may inggit.”
    reason: Pinananatili ang tunay na kalabuan tungkol sa tinutukoy ng “Espiritu/espiritu” at sa posibleng diwa ng φθόνος.
lexical_decisions:
- source_word: κενῶς
  choice: walang kabuluhan
  rationale: Ipinahihiwatig nito na ang Kasulatan ay hindi nagsasalita nang walang saysay o layunin; natural at marangal ang parirala sa makabagong Tagalog.
- source_word: ἡ γραφὴ
  choice: ang Kasulatan
  rationale: Pinananatili ng isahang anyo at tiyak na pantukoy ang karaniwang pagtukoy sa awtoritatibong banal na kasulatan.
- source_word: Πρὸς φθόνον
  choice: nang may paninibugho
  rationale: Ipinapahayag nito ang matinding mapanibughuing pananabik nang hindi agad ipinapalagay na masamang inggit ang tinutukoy; inilalahad sa talababa ang posibleng saling ‘may inggit.’
- source_word: ἐπιποθεῖ
  choice: nananabik
  rationale: Natural itong katumbas ng matindi at nagpapatuloy na paghahangad o pananabik.
- source_word: τὸ πνεῦμα
  choice: Ang Espiritu
  rationale: Pinipili ng pangunahing teksto ang pagtukoy sa Banal na Espiritu, ngunit tunay na posible sa gramatika ang espiritu ng tao kaya malinaw itong itinatala sa talababa.
- source_word: κατῴκισεν
  choice: pinatira
  rationale: 'Napananatili nito ang causative na diwa: may isang kumilos upang manahan ang Espiritu sa atin, sa halip na simpleng ‘nanahan.’'
- source_word: ἐν ἡμῖν
  choice: sa atin
  rationale: Sa konstruksiyong ‘pinatira ... sa atin,’ likas na ipinahihiwatig ang pananahan sa loob ng mga mananampalataya.
theological_decisions:
- issue: Ang tinutukoy ng τὸ πνεῦμα
  choice: Ang Banal na Espiritung pinatira ng Diyos sa atin
  alternative: Ang espiritu ng tao na pinatira ng Diyos sa atin
  rationale: Kapuwa pinahihintulutan ng gramatika ang dalawang pagbasa. Ang malaking titik sa pangunahing teksto ay umaayon sa pananalita tungkol sa banal na pananahan, ngunit hindi inaalis ang alternatibo, na tahasang pinananatili sa talababa.
- issue: Moral na diwa ng φθόνος
  choice: paninibugho
  alternative: inggit
  rationale: Kung Banal na Espiritu ang tinutukoy, maaaring ipahayag ng ‘paninibugho’ ang matindi at matuwid na paghahangad ng Diyos sa kaniyang bayan. Gayunman, maaari ring unawain ang salitang Griyego bilang ‘inggit,’ kaya inilalahad iyon sa talababa.
- issue: Ugnayan ng tanong at ng sinasabi ng Kasulatan
  choice: Isang tanong na nagpapakilala sa tuwirang sinasabi ng Kasulatan
  alternative: Isang tanong na sinusundan ng hiwalay na pahayag
  rationale: Ang ὅτι pagkatapos ng λέγει at ang bantas ng pinagkunang edisyon ay natural na nagpapakilala sa nilalaman ng sinasabi ng Kasulatan; pinananatili ng tutuldok at panipi ang ugnayang ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang ‘Kasulatan,’ ‘nananabik,’ at ‘paninibugho’ upang mapanatili ang bigat ng retorikal at teolohikal na pananalita nang hindi nagiging lipas o labis na teknikal.
