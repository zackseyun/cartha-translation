  text: My brothers[d][c][b][a], do not hold the faith of our Lord Jesus the Messiah with partiality.
translation:
  language: tl
  text: Mga kapatid ko[a], huwag ninyong panghawakan nang may pagtatangi ang pananampalataya sa ating maluwalhating Panginoong Jesus, ang Mesiyas[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay nasa anyong panlalaking maramihan, ngunit dito ay malamang na tumutukoy sa buong pamayanan ng mga mananampalataya, mga lalaki at mga babae.
    reason: lexical_alternative
  - marker: b
    text: 'Sa mas pormal na pagsunod sa anyong Griyego: “ang pananampalataya ng ating maluwalhating Panginoong Jesus, ang Mesiyas.” Maaaring unawain sa higit sa isang paraan ang kaugnayan ng “pananampalataya” at “Panginoong Jesus.”'
    reason: alternative_reading
  - marker: c
    text: O “ating Panginoong Jesus, ang Mesiyas—ang Panginoon ng kaluwalhatian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί μου
  choice: Mga kapatid ko
  rationale: Ang “mga kapatid” ang natural at marangal na tawag sa Filipino para sa mga kabilang sa sambayanan ng pananampalataya. Bagaman panlalaking maramihan ang anyong Griyego, maaaring tumukoy ang salitang ito sa buong kapulungan.
- source_word: μὴ ... ἔχετε
  choice: huwag kayong ... habang pinanghahawakan ninyo
  rationale: Ang kasalukuyang pautos na may μή ay pagbabawal. Ang “pinanghahawakan” ay angkop sa pananampalatayang kinikilala at isinasabuhay, samantalang ang ayos ng buong pangungusap ay ginawang likas sa Filipino.
- source_word: ἐν προσωπολημψίαις
  choice: magpakita ng pagtatangi
  rationale: Tumutukoy ang προσωπολημψία sa pagkiling o pagbibigay ng pabor batay sa katayuan o panlabas na pagkakakilanlan. Inihahayag ng “magpakita ng pagtatangi” ang maramihang anyo bilang mga kilos ng pagkiling nang hindi nagiging salitang-salita.
- source_word: τὴν πίστιν
  choice: ang pananampalataya
  rationale: Pinananatili ang karaniwang kahulugan ng πίστις at ang tiyak na artikulo, na dito ay tumutukoy sa pananampalatayang pinanghahawakan ng mga mananampalataya.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: sa ating ... Panginoong Jesus, ang Mesiyas
  rationale: Natural sa Filipino ang “pananampalataya sa” para sa pananampalatayang nakatuon kay Jesus. Isinalin ang Χριστός bilang titulong “ang Mesiyas,” hindi bilang pangalang “Cristo,” at inilagay ang “ating” sa likas na posisyon.
- source_word: τῆς δόξης
  choice: maluwalhating
  rationale: Ang pariralang genitibo ay inilapat sa Panginoong Jesus bilang paglalarawan sa kaniyang kaluwalhatian. Pinananatili sa talababa ang mas pormal at matayog na “Panginoon ng kaluwalhatian.”
theological_decisions:
- issue: Kaugnayan ng genitibo sa τὴν πίστιν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: pananampalataya sa ating ... Panginoong Jesus
  alternative: pananampalataya ng ating Panginoong Jesus
  rationale: Maaaring unawain sa higit sa isang paraan ang genitibong kasunod ng πίστις. Pinili sa pangunahing teksto ang natural na Filipino para sa pananampalatayang nakatuon kay Jesus, ngunit pinanatili sa talababa ang pormal na alternatibo upang hindi itago ang kalabuan ng Griyego.
- issue: Pagkakaugnay at kahulugan ng τῆς δόξης
  choice: ating maluwalhating Panginoong Jesus
  alternative: ating Panginoong Jesus ... ang Panginoon ng kaluwalhatian
  rationale: Maaaring ipahayag ang genitibo bilang katangiang “maluwalhati” o bilang mataas na titulong “Panginoon ng kaluwalhatian.” Ang pangunahing teksto ay natural sa Filipino; inilalahad ng talababa ang mas pormal na pagbasa.
- issue: Pagbibigay-kahulugan sa Χριστός
  choice: ang Mesiyas
  alternative: Cristo
  rationale: Aktibo rito ang kahulugan ng Χριστός bilang titulo sa maringal na pagkakakilanlan kay Jesus, kaya “ang Mesiyas” ang ginamit.
- issue: Saklaw ng Ἀδελφοί
  choice: Mga kapatid ko
  alternative: Mga kapatid kong lalaki
  rationale: Panlalaki ang anyong Griyego, ngunit ang pangmaramihang tawag na ito ay karaniwang sumasaklaw sa buong kapulungan. Ang “mga kapatid” ay natural na inclusive sa Filipino nang hindi kinakailangang magdagdag ng “mga babae.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasan ang arkaikong “pagtatangi ng mukha” at ang sobrang teknikal na ayos, ngunit pinanatili sa mga talababa ang mahahalagang kalabuan ng genitibong Griyego.
