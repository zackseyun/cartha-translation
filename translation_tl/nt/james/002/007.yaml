  text: Do not they themselves blaspheme the good name that was called upon you?[a][b]
translation:
  language: tl
  text: Hindi ba sila rin ang lumalapastangan sa marangal na pangalan[a] na itinawag sa inyo?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kapuri-puring pangalan” o “dakilang pangalan.”
    reason: lexical_alternative
  - marker: b
    text: O “ipinangalan sa inyo” o “itinawag sa ibabaw ninyo.” Malamang na tumutukoy ito sa pangalang nagpapakilala sa mga mananampalataya at maaaring umalingawngaw sa pananalita ukol sa tipan o bautismo.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ αὐτοὶ
  choice: Hindi ba sila rin
  rationale: Ipinapanatili ng retorikal na tanong ang inaasahang sagot na oo, habang idinidiin ng “sila rin” na ang mismong mga taong tinutukoy ang gumagawa nito.
- source_word: βλασφημοῦσιν
  choice: lumalait
  rationale: Saklaw ng pandiwa ang mapanirang at lapastangang pananalita. Ang “lumalait” ay likas sa makabagong Tagalog at nagpapanatili ng diwa ng matinding paglapastangan nang hindi ipinapalagay na tahasang pangalan ng Diyos ang layon.
- source_word: τὸ καλὸν ὄνομα
  choice: sa marangal na pangalan
  rationale: Sa konteksto, ang καλός ay may diwang marangal, kapuri-puri, o dakila. Mas malinaw sa Tagalog ang “marangal na pangalan” kaysa literal na “mabuting pangalan,” na maaaring pangunahing maunawaan bilang reputasyon.
- source_word: τὸ ἐπικληθὲν ἐφ’ ὑμᾶς
  choice: itinawag sa inyo
  rationale: Pinananatili nito ang pasibong ideya ng pangalang itinawag sa o ipinangalan sa mga mananampalataya, ngunit hindi nilulutas kung ito ay pormulang tipan, bautismo, o pangkalahatang pagkakakilanlan.
theological_decisions:
- issue: Ang tinutukoy ng “marangal na pangalan”
  choice: Hindi tahasang pinangalanan sa salin; nananatili itong marangal na pangalang taglay o kaugnay ng mga mananampalataya, malamang ang pangalan ni Jesus/Panginoon.
  alternative: Tahasang isalin bilang “pangalan ni Cristo” o “pangalan ng Diyos.”
  rationale: Hindi tahasang binabanggit ng Griyego si Jesus sa talatang ito, bagaman malakas na ipinahihiwatig ng Santiago 2:1 ang kristolohikal na kaugnayan. Pinananatili ng salin ang tunay na lawak at tensiyong teolohikal ng teksto.
- issue: Diwa ng pangalang “itinawag sa inyo”
  choice: Panatilihin ang idyomatikong pananalitang maaaring tumukoy sa pagkakakilanlan ng komunidad.
  alternative: Linawin bilang “ang pangalang ibinigay sa inyo sa bautismo” o “ang pangalang itinawag sa ibabaw ninyo.”
  rationale: Maaaring umalingawngaw rito ang wika ng tipan o bautismo, ngunit hindi sapat ang talata upang iyon lamang ang ipakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lumalait” sa halip na mas teknikal na “lumalapastangan” upang maging natural sa ordinaryong mambabasa habang pinananatili ang matinding diwa ng βλασφημέω. Lahat ng talababa ay may katugmang pananda sa pangunahing teksto.
