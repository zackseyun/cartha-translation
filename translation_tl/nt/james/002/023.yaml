id: JAS.2.23
reference: James 2:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐπληρώθη ἡ γραφὴ ἡ λέγουσα· Ἐπίστευσεν δὲ Ἀβραὰμ τῷ θεῷ, καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην, καὶ φίλος θεοῦ ἐκλήθη.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/023.yaml
  text: And the Scripture was fulfilled that says[a], “Abraham believed God, and it was counted to him as righteousness,” and he was called a friend of God.
translation:
  language: tl
  text: At natupad ang Kasulatan na nagsasabi, “Pinaniwalaan ni Abraham ang Diyos, at iyon ay ibinilang sa kanya bilang katuwiran,” at tinawag siyang kaibigan ng Diyos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπληρώθη
  choice: natupad
  rationale: Likas at malinaw itong salin ng pasibong pandiwa sa pormula ng pagsipi sa Kasulatan; ipinahihiwatig nitong umabot sa katuparan ang siniping pahayag.
- source_word: ἡ γραφή
  choice: ang Kasulatan
  rationale: Tumutukoy ito sa banal na Kasulatan, hindi lamang sa isang karaniwang sulat o kasulatan.
- source_word: ἡ λέγουσα
  choice: na nagsasabi
  rationale: Natural na Tagalog para sa kasalukuyang participle na naglalarawan sa Kasulatan sa konteksto ng pagsipi.
- source_word: Ἐπίστευσεν ... Ἀβραὰμ τῷ θεῷ
  choice: Sumampalataya si Abraham sa Diyos
  rationale: Pinananatili ang diwa ng paniniwala at pagtitiwala ni Abraham sa Diyos. Sa natural na Tagalog, ang “sumampalataya sa Diyos” ay mas malinaw kaysa sa literal ngunit alanganing “naniwala sa Diyos,” bagaman maaari ring mangahulugan ang parirala na pinaniwalaan ni Abraham ang sinabi ng Diyos.
- source_word: ἐλογίσθη αὐτῷ
  choice: iyon ay ibinilang sa kanya
  rationale: Ipinananatili ng “ibinilang” ang metaporang pagsusuma o pagkakredito ng λογίζομαι nang hindi gumagamit ng labis na teknikal na pananalita.
- source_word: εἰς δικαιοσύνην
  choice: bilang katuwiran
  rationale: Ang “katuwiran” ang angkop na terminong teolohikal at kontekstuwal sa sipi mula sa Genesis; hindi ang “katarungan,” na tumutukoy higit sa makatarungang paghatol o pagkilos.
- source_word: φίλος θεοῦ
  choice: kaibigan ng Diyos
  rationale: Direkta at natural na ipinahahayag ang ugnayang tinutukoy ng predicate nominative at genitive.
- source_word: ἐκλήθη
  choice: tinawag siyang
  rationale: 'Pinananatili ang lawak ng καλέω: maaaring tumukoy sa pagkakatalaga o pagkakilala sa kanya sa ganitong tawag.'
theological_decisions:
- issue: Ugnayan ng pananampalataya at mga gawa ni Abraham sa argumento ni Santiago
  choice: Panatilihin ang pahayag na natupad ang Kasulatan, nang hindi ipinapaliwanag sa mismong salin kung paano nagkaugnay ang pananampalataya at gawa.
  alternative: Isalin nang tahasang ginawang batayan ng katuwiran ang mga gawa, o ihiwalay nang lubos ang pananampalataya sa masunuring pagkilos.
  rationale: Pinag-uugnay ng konteksto ang Genesis 15:6 at ang sumunod na pagsunod ni Abraham. Hindi dapat lutasin ng salin ang mas malawak na debateng teolohikal na lampas sa mismong pananalita ng talata.
- issue: Kahulugan ng δικαιοσύνη
  choice: katuwiran
  alternative: katarungan
  rationale: Sa siping ito tungkol kay Abraham, “katuwiran” ang pinakanababagay sa pagkilalang ibinilang sa kanya; ang “katarungan” ay hindi angkop sa kontekstong ito.
- issue: Layon ng pananampalataya sa Ἐπίστευσεν ... τῷ θεῷ
  choice: sumampalataya sa Diyos
  alternative: pinaniwalaan ang Diyos / nagtiwala sa Diyos
  rationale: Natural at marangal ang napiling anyo sa modernong Tagalog, ngunit hindi nito dapat alisin ang diwang pinaniwalaan ni Abraham ang salita ng Diyos. Dahil may bahagyang kalabuan, hindi dinagdagan ang teksto ng paliwanag na wala sa Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “Kasulatan,” “sumampalataya,” at “katuwiran” bilang pamilyar ngunit hindi makalumang bokabularyong biblikal. Walang footnote marker dahil walang footnote na kailangan sa maikling talatang ito.
