  text: οὕτως καὶ ἡ πίστις, ἐὰν μὴ ⸂ἔχῃ ἔργα⸃, νεκρά ἐστιν καθ’ ἑαυτήν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/017.yaml
  text: So also faith[a], if it does not have works, is dead by itself.
translation:
  language: tl
  text: Gayon din naman, ang pananampalataya[a], kung wala itong mga gawa, ay patay sa sarili nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pagtitiwala”; hindi gaanong malamang dito, “katapatan.” Maaaring taglayin ng salitang Griyego na pistis ang mga kahulugang ito, ngunit “pananampalataya” ang pinakamainam na angkop sa argumento ni Santiago sa talatang ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ
  choice: Gayon din naman
  rationale: Ipinapakita nito ang paghahambing at kongklusyon mula sa naunang halimbawa, habang likas at malinaw sa modernong Tagalog.
- source_word: ἡ πίστις
  choice: ang pananampalataya
  rationale: Pinakamainam itong tumutugma sa argumento ni Santiago tungkol sa ipinahahayag na pananampalataya; nananatiling posible sa leksikon ang 'pagtitiwala' at, bagaman hindi gaanong malamang dito, 'katapatan.'
- source_word: ἐὰν μὴ ἔχῃ ἔργα
  choice: kung wala itong mga gawa
  rationale: Likas na Tagalog para sa kondisyong 'kung hindi ito mayroong mga gawa,' at pinananatili ang ugnayan ng pananampalataya at mga gawa nang hindi ipinapaliwanag nang labis ang uri ng mga gawa.
- source_word: ἔργα
  choice: mga gawa
  rationale: Pinananatili nito ang mahalagang terminong ginagamit sa nakapaligid na argumento at hindi ito pinakikitid sa isang tiyak na uri ng kilos.
- source_word: νεκρά ἐστιν
  choice: ay patay
  rationale: Tuwiran at mariing pinananatili ang metapora ng Griyego.
- source_word: καθ’ ἑαυτήν
  choice: sa ganang sarili
  rationale: Ipinahahayag na ang pananampalatayang tinutukoy ay nakahiwalay sa mga gawa, habang pinananatili ang bahagyang pormal at marangal na himig ng orihinal.
theological_decisions:
- issue: Pagpapakahulugan sa πίστις sa usaping pananampalataya at mga gawa
  choice: pananampalataya
  alternative: pagtitiwala; katapatan
  rationale: Pinananatili ng 'pananampalataya' ang leksikal at teolohikal na tensiyon sa argumento ni Santiago nang hindi ipinapasok ang isang denominasyonal na paglutas. Ang talata mismo ay nagsasabing patay ang pananampalatayang walang mga gawa.
- issue: Ugnayan ng pananampalataya at mga gawa
  choice: kung wala itong mga gawa, ay patay sa ganang sarili
  alternative: kung hindi ito pinatutunayan ng mga gawa, ay patay
  rationale: Hindi idinagdag sa salin ang ideyang 'pinatutunayan,' bagaman maaaring ipahiwatig iyon ng konteksto, sapagkat wala itong tuwirang katumbas sa tekstong Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinili ang 'Gayon din naman' upang panatilihin ang ugnayan sa naunang halimbawa. Ang 'sa ganang sarili' ay bahagyang pormal ngunit pamilyar sa wikang biblikal at eksaktong nagpapahayag ng pagkakahiwalay; iniwasan ang dagdag na interpretasyong gaya ng 'hindi tunay' o 'walang kabuluhan.'
