  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀Τί ὄφελος, ἀδελφοί μου, ἐὰν πίστιν λέγῃ τις ἔχειν ἔργα δὲ μὴ ἔχῃ; μὴ δύναται ἡ πίστις σῶσαι αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/014.yaml
  text: What good is it[a], my brothers[c][b], if someone says he has faith but does not have works? Can that faith save him?
translation:
  language: tl
  text: Ano ang pakinabang, mga kapatid ko[a], kung sinasabi ng isang tao na may pananampalataya siya[b] ngunit wala siyang mga gawa? Maililigtas ba siya ng pananampalatayang iyon[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griego ay panlalaking maramihan, “mga kapatid,” ngunit ginagamit dito bilang pagtawag sa buong komunidad ng mga mananampalataya, kabilang ang mga babae.
    reason: lexical_alternative
  - marker: b
    text: Ang πίστις ay maaari ring mangahulugang “pagtitiwala” at, sa ilang konteksto, “katapatan.” Dito, ang “pananampalataya” ang pinakanaaangkop dahil sinasabi ng isang tao na taglay niya ito.
    reason: lexical_alternative
  - marker: c
    text: Sa Griego, literal na “ang pananampalataya.” Tumutukoy ito pabalik sa kababanggit na pananampalataya—pananampalatayang sinasabing taglay ngunit walang mga gawa. Maaari rin itong isalin na “gayong pananampalataya.”
    reason: alternative_reading
lexical_decisions:
- source_word: Τί ὄφελος
  choice: Ano ang pakinabang
  rationale: Natural na retorikal na tanong sa Filipino na pinananatili ang diwa ng praktikal na pakinabang o kabuluhan.
- source_word: ἀδελφοί μου
  choice: mga kapatid ko
  rationale: Ang “kapatid” sa Filipino ay likas na maaaring tumukoy sa lalaki o babae, kaya malinaw nitong tinutukoy ang sambayanan ng mga mananampalataya nang hindi dinaragdagan ang anyo ng Griego.
- source_word: πίστιν
  choice: pananampalataya
  rationale: Pinakamalapit at karaniwang salin sa kontekstong ito, kung saan may isang taong nagsasabing taglay niya ito; hindi gaanong angkop dito ang “katapatan.”
- source_word: λέγῃ τις ἔχειν
  choice: kung sabihin ng isang tao na mayroon siyang
  rationale: Malapit sa tahasang “sinasabi” ng Griego at hindi agad dinaragdagan ng mapanghusgang himig ng “nag-aangking.”
- source_word: ἔργα
  choice: mga gawa
  rationale: Pinananatili ang mahalagang terminong ginagamit sa buong pangangatwiran ni Santiago at ang tensiyon sa pagitan ng pananampalataya at mga gawa.
- source_word: ἔργα δὲ μὴ ἔχῃ
  choice: ngunit wala naman siyang mga gawa
  rationale: Likas sa Filipino at malinaw na ipinapakita ang pagsalungat ng δέ at ang kawalan ng mga gawa.
- source_word: μὴ δύναται
  choice: Maililigtas ba
  rationale: Ang tanong na may μή ay umaasang negatibo ang sagot; sapat itong ipinahihiwatig ng retorikal na tanong sa konteksto nang hindi tahasang idinaragdag ang sagot.
- source_word: ἡ πίστις
  choice: pananampalatayang iyon
  rationale: 'Ipinakikita ang anaporikong puwersa ng pantukoy: tumutukoy ito pabalik sa pananampalatayang sinasabi ng tao ngunit walang kasamang mga gawa.'
- source_word: σῶσαι αὐτόν
  choice: Maililigtas ba siya
  rationale: Ang “iligtas” ang karaniwan at may sapat na bigat na katumbas ng σῴζω; ang “siya” ay sumusunod sa isahang αὐτόν.
theological_decisions:
- issue: Ugnayan ng pananampalataya at mga gawa sa retorikal na tanong
  choice: pananampalatayang iyon
  alternative: pananampalataya; gayong pananampalataya
  rationale: Tumutukoy ang ἡ πίστις sa uri ng pananampalatayang kababanggit lamang—isang sinasabing taglay ngunit walang mga gawa. Pinananatili nito ang tensiyong teolohikal nang hindi ipinapalagay na itinatanggi ni Santiago ang kakayahang magligtas ng pananampalataya sa lahat ng kahulugan nito.
- issue: Inaasahang sagot sa tanong na may μή
  choice: 'Panatilihin bilang tanong: “Maililigtas ba siya…?”'
  alternative: “Hindi siya maililigtas…”
  rationale: Inaasahan sa Griego ang negatibong sagot, ngunit retorikal na tanong pa rin ang anyo. Hindi ginawang tahasang pahayag upang mapanatili ang paraan ng pangangatwiran ng teksto.
- issue: Kasarian sa pagtawag at panghalip
  choice: mga kapatid ko; siya
  alternative: mga kapatid kong lalaki; ang taong iyon
  rationale: Ang Filipino na “mga kapatid” ay natural na sumasaklaw sa buong komunidad bagaman panlalaking maramihan ang anyong Griego. Ang “siya” ay tumpak na sumusunod sa isahang taong ipinakilala sa pangungusap nang hindi ipinipilit ang kasarian sa Filipino.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga kapatid” bilang likas na panawag sa isang komunidad at ang “mga gawa” upang mapanatili ang pangunahing bokabularyo at teolohikal na tensiyon ng talata.
