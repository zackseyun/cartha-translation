source:
  edition: SBLGNT
  text: Ἀλλ’ ἐρεῖ τις· Σὺ πίστιν ἔχεις κἀγὼ ἔργα ἔχω. δεῖξόν μοι τὴν πίστιν σου ⸀χωρὶς τῶν ⸀ἔργων, κἀγώ ⸂σοι δείξω⸃ ἐκ τῶν ἔργων μου τὴν ⸀πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/018.yaml
  text: But someone will say[a], “You have faith, and I have works.” Show me your faith apart from works[c][b], and I will show you my faith by my works.
translation:
  language: tl
  text: Ngunit may magsasabi, “Ikaw ay may pananampalataya,[a] at ako naman ay may mga gawa.” Ipakita mo sa akin ang pananampalataya mo nang walang mga gawa,[b] at ipapakita ko sa iyo ang pananampalataya ko sa pamamagitan ng mga gawa ko.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griego na pistis ay maaari ring mangahulugang “pagtitiwala” o, sa ilang konteksto, “katapatan.”
    reason: alternative_reading
  - marker: b
    text: O “nang hiwalay sa mga gawa.”
    reason: lexical_alternative
  - marker: c
    text: O “mula sa mga gawa ko.” Maaaring ipahiwatig ng pang-ukol na Griego ang pinagmulan o ang paraan; ipinakikita ng pangunahing salin na ginagawang nakikita ng mga gawa ang pananampalataya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀλλ’
  choice: Ngunit
  rationale: Malinaw at marangal na panandang pasalungat na angkop sa pagtutol na ipinapasok sa argumento.
- source_word: ἐρεῖ τις
  choice: may magsasabi
  rationale: Pinananatili ang anyong panghinaharap at ang estilong may kathang kausap sa retorikal na argumento.
- source_word: πίστιν / πίστιν
  choice: pananampalataya
  rationale: Ito ang karaniwan at pinakanaaangkop na salin dito; hindi nito agad nilulutas kung ang diin ay paniniwala, pagtitiwala, o katapatang nakikita sa gawa.
- source_word: ἔργα / ἔργων
  choice: mga gawa
  rationale: Pinananatili ang mahalagang terminong inuulit sa pangangatwiran ni Santiago at ang ugnayan nito sa ‘pananampalataya.’
- source_word: δεῖξόν μοι
  choice: Ipakita mo sa akin
  rationale: Direkta at natural na utos na nagpapahayag ng hamon na gawing nakikita ang inaangking pananampalataya.
- source_word: χωρὶς τῶν ἔργων
  choice: nang walang mga gawa
  rationale: Natural sa makabagong Filipino at tapat sa diwang ‘without/apart from works,’ nang hindi nagdaragdag ng ideyang wala sa teksto.
- source_word: κἀγώ σοι δείξω
  choice: at ipapakita ko sa iyo
  rationale: Pinananatili ang tahasang tugon at ang paralelismo ng dalawang sugnay.
- source_word: ἐκ τῶν ἔργων μου
  choice: sa pamamagitan ng mga gawa ko
  rationale: 'Ipinahahayag ang instrumental o ebidensiyal na gamit ng ἐκ: ang mga gawa ang paraang nagpapakita sa pananampalataya, habang itinatala sa talababa ang literal na alternatibo.'
theological_decisions:
- issue: Kahulugan ng πίστις sa pagtatalakay tungkol sa pananampalataya at mga gawa
  choice: pananampalataya
  alternative: pagtitiwala; sa ilang konteksto, katapatan
  rationale: Ang ‘pananampalataya’ ang pinakamalawak at kinikilalang katumbas dito. Hindi nito ipinapasok ang isang tiyak na doktrinal na paliwanag tungkol sa ugnayan ng pananampalataya at mga gawa.
- issue: Puwersa ng ἐκ sa pariralang ἐκ τῶν ἔργων μου
  choice: sa pamamagitan ng mga gawa ko
  alternative: mula sa mga gawa ko
  rationale: Maaaring tumukoy ang pang-ukol sa pinagmulan o paraan. Ang pangunahing salin ay natural na nagpapakita na ginagawang nakikita ng mga gawa ang pananampalataya, ngunit pinananatili sa talababa ang higit na literal na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘mga gawa’ upang mapanatili ang pangunahing terminolohiya at retorikal na paralelismo ng talata. Ang ‘ako naman’ ay likas na naghahatid ng diin ng κἀγώ nang hindi nagpapabigat sa pangungusap.
