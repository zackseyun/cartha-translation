translation:
  language: tl
  text: Hindi ba kayo ay nagtangi-tangi sa isa't isa[a] at naging mga hukom na may masasamang pag-iisip?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagdiskrimina kayo sa isa't isa.” Ang pandiwa ay maaari ring mangahulugang “nahati” o, sa ibang konteksto, “nag-alinlangan,” ngunit dito ay mas naaangkop ang diwa ng pagtatanging may pagkiling.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mga hukom ng masasamang pag-iisip/pangangatwiran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διεκρίθητε
  choice: gumawa ng pagtatangi-tangi
  rationale: Sa konteksto ng Santiago 2:1–3, tumutukoy ito sa diskriminasyong ipinakita sa mayaman at mahirap. Pinananatili ng parirala ang diwa ng paggawa ng di-makatarungang pagkakaiba, sa halip na ang ibang posibleng diwang “mag-alinlangan.”
- source_word: ἐν ἑαυτοῖς
  choice: sa isa't isa
  rationale: Likas itong tumutukoy sa ugnayan sa loob ng pamayanan sa konteksto ng pagtitipon, bagaman maaaring magpahiwatig din ang Griyego ng pagkakahati sa kanilang kalooban.
- source_word: ἐγένεσθε
  choice: naging
  rationale: Tuwirang ipinahahayag ang kalagayang ibinunga ng kanilang pagtatangi.
- source_word: κριταὶ
  choice: mga hukom
  rationale: Pinananatili nito ang malinaw na moral at hudisyal na bigat ng κριταί.
- source_word: διαλογισμῶν πονηρῶν
  choice: na may masasamang pag-iisip
  rationale: Napananatili ang leksikal na diwa ng mga pag-iisip o pangangatwiran, habang natural sa modernong Tagalog; hindi ito pinaliliit sa “masasamang motibo” lamang.
- source_word: οὐ
  choice: Hindi ba
  rationale: Pinananatili ang retorikal na tanong na umaasang sasang-ayon ang mga mambabasa sa pagsaway.
theological_decisions:
- issue: Diwa ng διακρίνω kaugnay ng pagtatangi
  choice: Sinaway ng talata ang diskriminasyong ginagawa sa loob ng pamayanan ng mga mananampalataya.
  alternative: Tumutukoy ang talata sa panloob na pagkakahati o pag-aalinlangan.
  rationale: Ang agarang konteksto sa 2:1–3 ay ang pagkiling sa mayaman laban sa mahirap. Gayunman, inilalahad sa talababa ang tunay na lawak ng posibleng kahulugan ng pandiwa.
- issue: Ugnayan ng κριταὶ at διαλογισμῶν πονηρῶν
  choice: mga hukom na may masasamang pag-iisip
  alternative: mga hukom ng masasamang pag-iisip/pangangatwiran
  rationale: Ang pangunahing salin ay mas natural sa Tagalog at ipinakikitang ang mga hukom ay kinikilala sa kanilang masasamang pag-iisip, habang pinananatili sa talababa ang literal at hindi tiyak na genitibong kayarian.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “pagtatangi-tangi” upang idiin ang di-makatarungang pagkakaiba sa konteksto, at “mga hukom” upang mapanatili ang matinding himig ng pagsaway.
