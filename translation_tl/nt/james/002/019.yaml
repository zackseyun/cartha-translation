id: JAS.2.19
reference: James 2:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: σὺ πιστεύεις ὅτι ⸂εἷς ἐστιν ὁ θεός⸃; καλῶς ποιεῖς· καὶ τὰ δαιμόνια πιστεύουσιν καὶ φρίσσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/019.yaml
  text: You believe that God is one[a]; you do well[b]. Even the demons believe—and shudder.
translation:
  language: tl
  text: Naniniwala kang iisa ang Diyos[a]. Mabuti ang ginagawa mo. Maging ang mga demonyo ay naniniwala rin—at nanginginig sa takot.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “na may isang Diyos.” Maaaring isalin sa alinmang paraan ang Griyego; mas malapit sa pagkakasabi nito ang “iisa ang Diyos” at maaaring umalingawngaw sa pagpapahayag ng Israel tungkol sa kaisahan ng Diyos.
    reason: alternative_reading
  - marker: b
    text: O, “kinikilabutan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ πιστεύεις
  choice: Naniniwala ka
  rationale: Pinananatili ang tuwirang ikalawang panauhang isahan. Ang hayag na σὺ ay may diin, na likas na naipahihiwatig sa tuwirang pagtukoy na “ka” nang hindi nagdaragdag ng mabigat na “ikaw mismo.”
- source_word: ὅτι εἷς ἐστιν ὁ θεός
  choice: na iisa ang Diyos
  rationale: Malapit ito sa predikatibong anyo ng Griyego at maaaring umalingawngaw sa pagpapahayag ng Israel tungkol sa kaisahan ng Diyos. Hindi nito ipinipilit ang eksistensiyal na pagbasa na “may isang Diyos,” bagaman posible rin iyon.
- source_word: καλῶς ποιεῖς
  choice: Mabuti ang ginagawa mo
  rationale: Pinananatili ang maikli at tuwirang pagkilala ni Santiago bago ang matalim na paghahambing sa mga demonyo. Hindi dinaragdagan ng tahasang panunuya na wala sa mismong mga salita.
- source_word: καὶ τὰ δαιμόνια
  choice: Maging ang mga demonyo
  rationale: 'Ang καί ay may nagpapataas na puwersa rito: maging ang mga demonyo ay may ganitong uri ng paniniwala. Ang “demonyo” ang tuwiran at nakaugaliang katumbas ng δαιμόνιον.'
- source_word: πιστεύουσιν
  choice: naniniwala rin
  rationale: Inuulit ang salitang ginamit para sa πιστεύεις upang mapanatili ang sentrong paghahambing. Ang “rin” ay likas na nagpapakita na kapuwa sila naniniwala sa pahayag na iyon.
- source_word: φρίσσουσιν
  choice: nanginginig sa takot
  rationale: Ipinahahayag nito ang matinding takot na nakikita sa pisikal na panginginig. Mas malinaw ito sa karaniwang modernong Tagalog kaysa sa payak na “nanginginig,” at hindi nito pinapahina ang tindi ng pandiwa.
theological_decisions:
- issue: Paglalahad sa εἷς ἐστιν ὁ θεός
  choice: iisa ang Diyos
  alternative: may isang Diyos
  rationale: Pinananatili ng napiling anyo ang kayarian at posibleng alusyon sa pagpapahayag ng pananampalataya ng Israel, habang kinikilala sa talababa ang lehitimong eksistensiyal na salin.
- issue: Paghahambing ng paniniwala ng tao at ng mga demonyo
  choice: Maging ang mga demonyo ay naniniwala rin—at nanginginig sa takot
  alternative: Naniniwala rin ang mga demonyo at nanginginig sila
  rationale: 'Pinatitingkad ng “Maging” ang puwersa ng καί, at pinananatili ng pag-uulit ng “naniniwala” ang tensiyon ng talata: ang wastong paniniwala bilang pagsang-ayon lamang ay taglay rin ng mga demonyo.'
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Pinanatili ang maikling retorikal na daloy at ang matalim na paghahambing nang hindi ginagawang mas tahasang mapanlibak ang “Mabuti ang ginagawa mo.”
