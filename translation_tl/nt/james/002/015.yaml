  text: ⸀ἐὰν ἀδελφὸς ἢ ἀδελφὴ γυμνοὶ ὑπάρχωσιν καὶ ⸀λειπόμενοι τῆς ἐφημέρου τροφῆς,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/015.yaml
  text: If a brother or sister is poorly clothed and lacking daily food,[a]
translation:
  language: tl
  text: Kung ang isang kapatid na lalaki o babae ay kulang sa damit[a] at walang sapat na pagkain sa araw-araw,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hubad”; ang salitang Griyego ay maaaring mangahulugang literal na walang damit, ngunit dito ay malamang na tumutukoy sa hindi sapat na pananamit.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν
  choice: Kung
  rationale: Likas na pananda ng kondisyong ipinapalagay sa Filipino at pinananatili ang hipotetikal na diwa.
- source_word: ἀδελφὸς ἢ ἀδελφή
  choice: ang isang kapatid na lalaki o babae
  rationale: Tuwirang pinananatili ang tahasang pares na panlalaki at pambabae at ang pampamilyang katawagan para sa kapwa mananampalataya.
- source_word: γυμνοὶ
  choice: kulang sa damit
  rationale: Sa konteksto ng matinding pangangailangan, malamang na tumutukoy ito sa hindi sapat na pananamit, bagaman maaari rin itong literal na mangahulugang hubad; pinananatili sa talababa ang alternatibo.
- source_word: ὑπάρχωσιν
  choice: ay
  rationale: Gumaganap itong pandiwang kopula kasama ng panaguring γυμνοί; ang payak na “ay” ang natural na katumbas.
- source_word: λειπόμενοι
  choice: walang sapat
  rationale: Ipinahahayag ang patuloy na kakulangan nang natural sa Filipino, nang hindi ipinapalagay na ganap na walang anumang pagkain.
- source_word: τῆς ἐφημέρου τροφῆς
  choice: pagkain sa araw-araw
  rationale: Saklaw nito ang pagkaing kailangan sa bawat araw at natural itong nauunawaan bilang pang-araw-araw na ikabubuhay.
theological_decisions:
- issue: Saklaw ng ἀδελφὸς ἢ ἀδελφή sa pamayanang Kristiyano
  choice: Panatilihin ang “kapatid na lalaki o babae,” na malamang na tumutukoy sa kapwa mananampalataya.
  alternative: Isang sinumang kapwa taong nangangailangan.
  rationale: Ginagamit ni Santiago ang wikang pampamilya para sa mga kabilang sa pamayanan ng pananampalataya; pinananatili ng salin ang mismong pananalita nang hindi nililimitahan o pinalalawak nang higit sa teksto.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ang sugnay ay sadyang nagtatapos sa kuwit sapagkat nagpapatuloy ang kondisyong pangungusap sa kasunod na talata.
