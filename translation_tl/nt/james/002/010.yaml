base_translation:
  language: en
  yaml_path: translation/nt/james/002/010.yaml
  text: For whoever keeps the whole law but stumbles in one point has become guilty of all of it[a][b].
translation:
  language: tl
  text: Sapagkat ang sinumang tumutupad sa buong Kautusan ngunit nadapa sa isang bahagi nito[a] ay naging may-sala sa buong Kautusan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nabigo sa isang bagay” o “lumabag sa isang bahagi nito.” Sa Griyego, “nadapa sa isa” ang metaporang tumutukoy sa moral na pagkabigo.
    reason: lexical_alternative
  - marker: b
    text: O “ay mananagot sa buong Kautusan.” Ang paglabag sa isang bahagi ay naglalagay sa tao sa pananagutan kaugnay ng buong Kautusan.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅστις
  choice: ang sinuman
  rationale: Naghahayag ito ng pangkalahatang tuntunin at likas na katumbas sa modernong Tagalog.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag o batayang kaugnayan ng talata sa naunang pahayag.
- source_word: ὅλον τὸν νόμον
  choice: sa buong Kautusan
  rationale: Malinaw na ipinahahayag ang kabuuan ng tinutukoy na Kautusan; ginamit ang malaking titik bilang pantukoy sa Kautusan sa konteksto.
- source_word: τηρήσῃ
  choice: tumutupad
  rationale: Natural na Filipino para sa pagsunod o pag-iingat sa mga hinihingi ng Kautusan.
- source_word: πταίσῃ
  choice: nadapa
  rationale: Pinananatili ang metapora ng moral na pagkabigo sa Griyegong πταίω.
- source_word: ἐν ἑνί
  choice: sa isang bahagi nito
  rationale: Ipinahihiwatig ang isang punto o kahilingan sa loob ng buong Kautusan nang hindi nililimitahan sa isang partikular na utos.
- source_word: γέγονεν
  choice: ay nagiging
  rationale: Ipinahahayag ang kalagayang bunga ng paglabag, bagaman mas natural ito sa Tagalog kaysa sa literal na anyong perpekto.
- source_word: πάντων
  choice: laban sa kabuuan nito
  rationale: Iniuugnay ang pananagutan sa buong Kautusan, hindi sa ideyang isa-isang nagawa ang lahat ng posibleng paglabag.
- source_word: ἔνοχος
  choice: nagkasala
  rationale: Malinaw at natural na naghahatid ng moral-legal na pagkakasala; ipinaliliwanag sa talababa ang alternatibong diin sa pananagutan.
theological_decisions:
- issue: Saklaw ng pagkakasala kaugnay ng Kautusan
  choice: Ang paglabag sa isang bahagi ay naglalagay sa tao sa kalagayang nagkasala laban sa buong Kautusan.
  alternative: Ang paglabag sa isang utos ay katumbas ng aktuwal na paglabag sa bawat utos, o ang pahayag ay limitado lamang sa pagtatangi sa kapwa.
  rationale: Ang πάντων ἔνοχος ay tumutukoy sa pananagutan kaugnay ng kabuuan, ngunit hindi tahasang nagsasabing magkakapantay ang bigat ng lahat ng kasalanan o isa-isang nilabag ang bawat utos.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang metaporang “nadapa” at ang legal-moral na tensiyon ng ἔνοχος, habang nilinaw sa mga talababa ang mga leksikal na alternatibo.
