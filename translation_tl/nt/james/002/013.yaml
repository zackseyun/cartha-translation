  text: ἡ γὰρ κρίσις ἀνέλεος τῷ μὴ ποιήσαντι ἔλεος· κατακαυχᾶται ⸀ἔλεος κρίσεως.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/013.yaml
  text: For judgment is without mercy to the one who has shown no mercy[a]; mercy triumphs over judgment.
translation:
  language: tl
  text: Sapagkat ang hatol ay walang awa sa taong hindi nagpakita ng awa; ang awa ay nagtatagumpay laban sa hatol.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ang awa ay nagmamalaki laban sa hatol.” Ang pandiwang Griego ay maaaring mangahulugang magmalaki o magbunyi laban sa isang bagay; dito ay isinalin itong “nagtatagumpay laban sa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίσις / κρίσεως
  choice: hatol
  rationale: Tumutukoy ito sa makadiyos o panghukumang paghatol, hindi lamang sa isang opinyon. Pinananatili ng “hatol” ang puwersang panghukuman at ang pag-uulit ng salita sa dalawang sugnay.
- source_word: ἀνέλεος
  choice: walang awa
  rationale: Likas at malinaw itong panaguring Filipino at pinananatili ang tuwirang ugnayang leksikal sa paulit-ulit na ἔλεος, “awa.”
- source_word: τῷ μὴ ποιήσαντι ἔλεος
  choice: sa taong hindi nagpakita ng awa
  rationale: Ang ποιέω kasama ng ἔλεος ay idyomang nangangahulugang magpakita o magsagawa ng awa. Natural sa modernong Filipino ang “nagpakita ng awa” at malinaw ang moral na pagtutumbasan.
- source_word: κατακαυχᾶται
  choice: nagtatagumpay laban sa
  rationale: Maaari itong literal na mangahulugang magmalaki o magbunyi laban sa isang bagay. Sa konteksto, ipinahahayag ng “nagtatagumpay laban sa” ang retorikal na diwang nananaig ang awa nang hindi lubusang inaalis ang matapang na larawan ng pandiwa.
- source_word: ἔλεος
  choice: awa
  rationale: Karaniwan, malinaw, at angkop sa konteksto; pinananatili rin nito ang tatlong ulit na ugnayan ng konsepto ng awa sa talata.
theological_decisions:
- issue: Saklaw at tinutukoy ng pangwakas na sugnay na κατακαυχᾶται ἔλεος κρίσεως
  choice: 'Isang maikli at pangkalahatang pahayag: “ang awa ay nagtatagumpay laban sa hatol.”'
  alternative: “Ang awa ay nagmamalaki laban sa hatol,” o partikular na ang awang ipinakita ng maawaing tao ang mananaig sa oras ng paghatol.
  rationale: Sadyang maikli at maaaring tumukoy sa awa ng Diyos, sa awa na umiiral sa paghatol, o sa mapatutunayang bunga ng awang ipinakita ng tao. Hindi tinutukoy ng salin ang isang mekanikal na doktrina ng merito at pinananatili ang tensiyon sa pagitan ng babala at pag-asa.
translation_notes:
  register: Modernong Filipino na natural, marangal, at madaling maunawaan. Ginamit ang “hatol” sa halip na “paghatol” upang maging tuwiran at mapanatili ang maigsi at matalim na anyo ng Griego; ginamit ang “Sapagkat” upang ihayag ang paliwanag na ugnayan ng γάρ sa naunang konteksto.
