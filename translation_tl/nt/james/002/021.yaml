  text: Ἀβραὰμ ὁ πατὴρ ἡμῶν οὐκ ἐξ ἔργων ἐδικαιώθη, ἀνενέγκας Ἰσαὰκ τὸν υἱὸν αὐτοῦ ἐπὶ τὸ θυσιαστήριον;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/021.yaml
  text: Was not Abraham our father justified by works when he offered up Isaac his son on the altar?[a]
translation:
  language: tl
  text: Hindi ba inaring-ganap si Abraham, na ating ama, sa pamamagitan ng mga gawa nang ialay niya sa altar ang anak niyang si Isaac?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “naipakitang siya ay matuwid” o “napatunayang matuwid.” Maaaring magkaroon ang pandiwang Griyego ng deklaratibo o demonstratibong diwa depende sa konteksto.
    reason: alternative_reading
lexical_decisions:
- source_word: πατὴρ ἡμῶν
  choice: ating ama
  rationale: Pinananatili ang pampamilya at pangtipang diwa ng parirala; mas malapit ito sa Griyego kaysa sa mas paliwanag na “ating ninuno.”
- source_word: ἐξ ἔργων
  choice: dahil sa mga gawa
  rationale: Ipinahahayag ng ἐξ na may genitibo ang batayan o pinagmulan. Natural sa modernong Tagalog ang “dahil sa mga gawa” at pinananatili nito ang mahalagang ugnayan ng mga gawa at pagpapawalang-matuwid.
- source_word: ἐδικαιώθη
  choice: pinawalang-matuwid
  rationale: Pinananatili ng terminong ito ang leksikal at teolohikal na ugnayan sa usapin ng δικαιόω nang hindi tahimik na nilulutas kung deklaratibo o demonstratibo ang diin sa kontekstong ito.
- source_word: ἀνενέγκας
  choice: nang ihandog niya
  rationale: Natural na temporal na pagsasalin ng aorist participle at ipinapakita rin ang sakripisyal na diwa ng ἀναφέρω sa konteksto.
- source_word: θυσιαστήριον
  choice: altar
  rationale: Karaniwan, malinaw, at natural na tawag sa modernong Filipino para sa dakong pinaghahandugan.
- source_word: οὐκ ... ἐδικαιώθη;
  choice: Hindi ba’t ... ay pinawalang-matuwid?
  rationale: Pinananatili ang retorikal na tanong ng Griyego na umaasa ng pagsang-ayon, sa natural na ayos ng Tagalog.
theological_decisions:
- issue: Kahulugan ng δικαιόω sa Santiago 2:21 kaugnay ng mga gawa
  choice: pinawalang-matuwid
  alternative: ipinakitang matuwid; pinatunayang matuwid
  rationale: Pinananatili ng pangunahing salin ang teolohikal na tensiyon at ang koneksiyon sa mas malawak na talakayan tungkol sa pagpapawalang-matuwid. Inilalagay sa talababa ang mga posibleng demonstratibong kahulugan sa halip na pumili nang tahasan ng isang interpretasyon.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “Hindi ba’t” upang maipahayag nang malinaw ang retorikal na tanong, at “anak niyang si Isaac” para sa idiomatikong ayos. Pinanatili ang tradisyonal na terminong teolohikal na “pinawalang-matuwid,” na ipinaliliwanag ng talababa.
