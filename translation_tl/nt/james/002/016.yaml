  terminology: Ang “mga kailangan ng katawan” ay tumpak at natural para sa τὰ ἐπιτήδεια τοῦ σώματος. Pinananatili ng talababa ang pinagtatalunang middle/passive na aspekto ng θερμαίνεσθε at χορτάζεσθε nang hindi ito ipinapasiya sa pangunahing salin.
