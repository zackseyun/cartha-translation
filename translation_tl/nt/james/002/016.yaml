  text: εἴπῃ δέ τις αὐτοῖς ἐξ ὑμῶν· Ὑπάγετε ἐν εἰρήνῃ, θερμαίνεσθε καὶ χορτάζεσθε, μὴ δῶτε δὲ αὐτοῖς τὰ ἐπιτήδεια τοῦ σώματος, ⸀τί ὄφελος;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/016.yaml
  text: and one of you says to them[a], “Go in peace; keep warm and be filled,” but you do not give them the necessities of the body, what benefit is that?
translation:
  language: tl
  text: At kung sabihin ng isa sa inyo sa kanila, “Humayo kayo nang payapa; magpainit kayo at magpakabusog,”[a] ngunit hindi naman ninyo sila binibigyan ng mga kailangan ng katawan, ano ang pakinabang niyon?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin nang mas literal na “mapainit kayo at mapabusog.” Maaaring unawain ang mga anyong Griyego sa diwang middle o passive.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴπῃ δέ τις αὐτοῖς ἐξ ὑμῶν
  choice: at sabihin sa kanila ng isa sa inyo
  rationale: Inihaharap ng parirala ang isang ipinapalagay na halimbawa. Likas sa Tagalog ang “isa sa inyo,” at ang δέ ay isinalin bilang “at” upang mapanatili ang daloy nang hindi palalabis ang pagsalungat.
- source_word: Ὑπάγετε ἐν εἰρήνῃ
  choice: Humayo kayong payapa
  rationale: Pinananatili nito ang pormula ng pagpapaalam o pagpapala at ang mapait na kabalintunaan nito sa konteksto. Dignified ngunit madaling maunawaan ang “humayo.”
- source_word: θερμαίνεσθε καὶ χορτάζεσθε
  choice: manatili kayong mainit at mabusog
  rationale: Natural itong pakinggan bilang mabuting hangarin o payo, habang hindi tahasang ipinapasiya kung sila mismo ang magpapainit at magpapabusog sa sarili o tatanggap ng init at pagkain mula sa iba. Nililinaw sa talababa ang posibleng middle at passive na diwa.
- source_word: μὴ δῶτε δὲ αὐτοῖς
  choice: ngunit hindi naman ninyo ibigay sa kanila
  rationale: Malinaw na ipinakikita ng “ngunit ... naman” ang pagsalungat ng mabubuting salita sa pagkakait ng aktuwal na tulong.
- source_word: τὰ ἐπιτήδεια τοῦ σώματος
  choice: ang mga kailangan ng katawan
  rationale: Tuwiran, natural, at kongkretong salin ito ng mga kinakailangang panustos para sa katawan.
- source_word: τί ὄφελος;
  choice: ano ang pakinabang niyon?
  rationale: Ipinahahayag nito ang tanong tungkol sa praktikal na halaga ng gayong mga salita at malinaw na itinuturo ng “niyon” ang kilos na katatapos ilarawan.
theological_decisions:
- issue: Diwa ng tinig ng θερμαίνεσθε at χορτάζεσθε
  choice: “manatili kayong mainit at mabusog,” na hindi tahasang nagsasaad kung sila ang kikilos para sa sarili o tatanggap mula sa iba
  alternative: “magpainit kayo at magpakabusog” o “mapainit kayo at mapabusog”
  rationale: Maaaring unawain ang mga anyong Griyego sa middle o passive na diwa. Ang punto ni Santiago ay ang kawalang-saysay ng mabubuting salita kapag walang materyal na tulong, kaya hindi dapat ipasiya ng salin ang paraang hindi tahasang nililinaw ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “humayo” upang mapanatili ang pormal na himig ng pagbabasbas, habang ang natitirang pangungusap ay nasa karaniwang makabagong pananalita.
