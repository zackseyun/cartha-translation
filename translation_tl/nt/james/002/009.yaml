  text: But if you show partiality[d][c][b][a], you commit sin and are convicted by the law as transgressors.
translation:
  language: tl
  text: Ngunit kung nagtatangi kayo ng tao[a], nagkakasala kayo at pinatutunayang may sala ng kautusan bilang mga lumalabag sa kautusan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagpapakita kayo ng pagtatangi.” Tumutukoy ang pandiwang Griyego sa paghatol o pagtrato sa mga tao batay sa kanilang panlabas na anyo o katayuan.
    reason: lexical_alternative
  - marker: b
    text: O “inilalantad o sinasaway ng kautusan bilang mga lumalabag.” Ipinahihiwatig ng pandiwang Griyego na ang kamalian ay inilalantad at pinatutunayang may sala.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Ngunit kung
  rationale: Pinananatili ng “kung” ang kondisyon at ng “ngunit” ang banayad na pagsalungat o pagpapatuloy mula sa naunang argumento.
- source_word: προσωπολημπτεῖτε
  choice: nagtatangi kayo ng tao
  rationale: Likas sa modernong Tagalog at malinaw na tumutukoy sa pagtrato o paghatol sa mga tao ayon sa panlabas na kalagayan o katayuan.
- source_word: ἁμαρτίαν ἐργάζεσθε
  choice: nagkakasala kayo
  rationale: Ang literal na paggawa ng kasalanan ay likas na ipinahahayag sa Tagalog bilang “nagkakasala,” na pinananatili ang kasalukuyan at patuloy o pangkalahatang kilos.
- source_word: ἐλεγχόμενοι ὑπὸ τοῦ νόμου
  choice: hinahatulan ng kautusan
  rationale: Ipinahahayag ang pasibong pagkakalantad at pagpapatunay ng pagkakasala sa legal na konteksto; mas natural ito kaysa sa literal na participial construction.
- source_word: ὡς παραβάται
  choice: bilang mga lumalabag dito
  rationale: Ipinahahayag ang mga taong lumalampas o sumusuway sa itinakdang hangganan ng kautusan. Ang “dito” ay malinaw na tumutukoy sa kautusan nang hindi inuulit nang mabigat ang salita.
theological_decisions:
- issue: Saklaw ng νόμος sa etikal na argumento ni Santiago
  choice: kautusan
  alternative: Kautusan; kautusan ng Diyos; Kautusan ni Moises
  rationale: Hindi tinutukoy ng Griyego sa talatang ito na ito ay isang pantanging titulo o eksklusibong tumutukoy sa Kautusan ni Moises. Pinananatiling bukas ng “kautusan” ang saklaw ng teksto at iniiwasang magpasok ng isang tiyak na sistemang teolohikal.
- issue: Lakas ng ἐλεγχόμενοι
  choice: hinahatulan
  alternative: inilalantad; sinasaway; pinatutunayang nagkasala
  rationale: Ang konteksto ng kautusan at mga lumalabag ay legal, kaya ang “hinahatulan” ay natural at sapat na nagdadala ng diwang inilalantad at pinatutunayang may sala, bagaman ibinibigay sa talababa ang mas tahasang alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “nagtatangi ng tao” bilang karaniwang biblikal ngunit nauunawaang pahayag, at “kautusan” nang maliit ang titik upang hindi ito gawing mas tiyak kaysa sa Griyego.
