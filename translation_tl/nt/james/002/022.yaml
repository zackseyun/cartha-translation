base_translation:
  language: en
  yaml_path: translation/nt/james/002/022.yaml
  text: You see that faith was working together with his works[b][a], and by the works faith was brought to completion.
translation:
  language: tl
  text: Nakikita mong ang pananampalataya[a] ay nakikipagtulungan sa kanyang mga gawa, at sa pamamagitan ng mga gawa ay naging ganap[b] ang pananampalataya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pagtitiwala” o “katapatan” para sa pananampalataya (πίστις).
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “dinala sa kaganapan” o “nilubos”; maaaring tumukoy ang pandiwang Griyego sa pag-abot sa nilalayong wakas o kahustuhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπεις
  choice: Nakikita mong
  rationale: Pinananatili ang tahasang pakikipag-usap sa iisang kausap at ang retorikal na paraan ng pangangatwiran ni Santiago.
- source_word: πίστις
  choice: pananampalataya
  rationale: Ito ang karaniwan at malinaw na katumbas sa kontekstong teolohikal; hindi nito ipinapasya kung ang diin ay nasa pagtitiwala o katapatan.
- source_word: συνήργει
  choice: gumagawang kaagapay
  rationale: Ipinahahayag ng parirala ang patuloy na pagkilos sa nakaraan at ang ideya ng magkasamang paggawa na nasa pandiwang Griyego.
- source_word: τοῖς ἔργοις αὐτοῦ
  choice: ng kanyang mga gawa
  rationale: Ang “mga gawa” ay natural, nauunawaan, at nagpapanatili ng mahalagang terminolohiya sa pangangatwiran ng kabanata.
- source_word: ἐκ τῶν ἔργων
  choice: sa pamamagitan ng mga gawa
  rationale: Natural nitong ipinahahayag ang mga gawa bilang paraan o pinagmulan ng pag-abot ng pananampalataya sa kaganapan.
- source_word: ἐτελειώθη
  choice: nalubos
  rationale: Ipinahahayag nito ang pagdating sa nilalayong kaganapan nang hindi ipinahihiwatig na dati itong may kapintasang moral.
theological_decisions:
- issue: Ugnayan ng pananampalataya at mga gawa
  choice: Pinananatili na ang pananampalataya ay gumagawang kaagapay ng mga gawa at nalulubos sa pamamagitan ng mga ito.
  alternative: Ang mga gawa ay pagpapakita lamang ng pananampalataya sa harap ng mga tao; o ang mga gawa ang kinakailangang katuwang o bunga ng pananampalataya.
  rationale: Malinaw na binabanggit ng Griyego ang magkasamang pagkilos at pagkalubos, ngunit hindi nito inilalahad dito ang isang buong sistematikong paliwanag tungkol sa pagpapawalang-sala. Kaya hindi nilulutas ng salin ang teolohikal na tensiyon.
- issue: Kahulugan ng πίστις
  choice: pananampalataya
  alternative: pagtitiwala; katapatan
  rationale: Ang “pananampalataya” ang pinakakaraniwang katumbas sa daloy ng Santiago 2, samantalang itinatala sa talababa ang mga posibleng kaugnay na diwa.
translation_notes:
  register: Makabago at marangal na Filipino. Ang “gumagawang kaagapay” ay nagpapanatili sa ideya ng pagtutulungan nang hindi nagdaragdag ng denominasyonal na paliwanag; ang “nalubos” ay maikli at natural ngunit nililinaw sa talababa.
