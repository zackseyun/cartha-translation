  source_fidelity: Tapat ang salin sa SBLGNT. Ang “Ngunit gusto mo bang malaman” ay maayos na naghahatid ng θέλεις δὲ γνῶναι; ang “O taong hungkag” ay pinananatili ang isahang pantawag at ang literal na matalinghagang diin ng ἄνθρωπε κενέ; at ang “ang pananampalatayang hiwalay sa mga gawa ay walang pakinabang” ay tumpak na kumakatawan sa ἡ πίστις χωρὶς τῶν ἔργων ἀργή ἐστιν. Hindi nito ipinapalit ang “patay” para sa ἀργή.
