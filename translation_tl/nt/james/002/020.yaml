id: JAS.2.20
reference: James 2:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: θέλεις δὲ γνῶναι, ὦ ἄνθρωπε κενέ, ὅτι ἡ πίστις χωρὶς τῶν ἔργων ⸀ἀργή ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/020.yaml
  text: But do you want to know[a], O foolish man[b], that faith apart from works is useless?
translation:
  language: tl
  text: Ngunit gusto mo bang malaman, O taong hungkag,[a] na ang pananampalatayang hiwalay sa mga gawa ay walang pakinabang?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “O taong mangmang” o “O taong walang kabuluhan.” Literal na “taong hungkag” ang Griyego.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “walang ginagawa,” “walang bunga,” o “walang bisa.” Ang salitang Griyego ay tumutukoy sa pagiging di-aktibo o di-produktibo.
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλεις δὲ γνῶναι
  choice: Ngunit gusto mo bang malaman
  rationale: Ang θέλω na may infinitive ay nagpapahayag ng pagnanais o pagkukusa, at ang δέ ay angkop na isinalin na “Ngunit” sa pagpapatuloy na may pagsalungat. Tuwirang tinutumbasan ng “malaman” ang γνῶναι.
- source_word: ὦ ἄνθρωπε κενέ
  choice: O taong hungkag
  rationale: Pinananatili ng “O” ang tahasang pantawag at ng “tao” ang isahang ἄνθρωπε. Ang “hungkag” ay malapit sa literal na diwa ng κενός—walang laman o sustansiya—nang hindi agad nilulutas iyon bilang “mangmang.”
- source_word: ὅτι
  choice: na
  rationale: Ipinakikilala rito ng ὅτι ang nilalaman ng dapat malaman, kaya natural sa Tagalog ang pang-ugnay na “na.”
- source_word: ἡ πίστις
  choice: ang pananampalataya
  rationale: Ang “pananampalataya” ang karaniwan at hindi labis na mapagpasyang katumbas ng πίστις sa kontekstong ito.
- source_word: χωρὶς τῶν ἔργων
  choice: hiwalay sa mga gawa
  rationale: Ang χωρίς na may genitive ay nangangahulugang “hiwalay sa” o “walang.” Pinananatili ng “hiwalay sa mga gawa” ang diin sa pagkakahiwalay ng pananampalataya at mga gawa.
- source_word: ἀργή ἐστιν
  choice: ay walang pakinabang
  rationale: Ang ἀργός ay tumutukoy sa pagiging di-gumagana, walang bunga, o hindi mabisa. Malinaw at natural na ipinahahayag ng “walang pakinabang” ang praktikal na bisa nito sa pangungusap, habang inilalahad sa talababa ang mas literal na mga posibilidad.
theological_decisions:
- issue: Ugnayan ng pananampalataya at mga gawa sa pangangatwiran ni Santiago
  choice: Tuwirang ilarawan ang pananampalatayang hiwalay sa mga gawa bilang “walang pakinabang,” nang walang idinadagdag na paliwanag mula sa isang tradisyong teolohikal.
  alternative: Isaling “patay” ayon sa kalapit na mga talata, o “walang ginagawa” upang maging mas mahina ang pahayag.
  rationale: ἀργή ang ginamit sa talatang ito, hindi νεκρά. Kaya hindi ito dapat ipantay nang tahasan sa “patay,” ni pahinain upang lutasin ang tensiyong nasa sariling pananalita ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal. Pinanatili ang “O” upang katawanin ang tahasang pantawag ng Griyego, at ginamit ang “hungkag” upang mapanatili ang matingkad at sadyang mapanuyang larawan ng κενέ. Ang mga talababa ay inilagay kaagad pagkatapos ng salitang o pariralang nililinaw ng mga ito.
