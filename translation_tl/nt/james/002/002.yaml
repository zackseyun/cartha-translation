id: JAS.2.2
reference: James 2:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐὰν γὰρ εἰσέλθῃ ⸀εἰς συναγωγὴν ὑμῶν ἀνὴρ χρυσοδακτύλιος ἐν ἐσθῆτι λαμπρᾷ, εἰσέλθῃ δὲ καὶ πτωχὸς ἐν ῥυπαρᾷ ἐσθῆτι,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/002.yaml
  text: For if a man wearing gold rings and bright clothing enters into your assembly[a], and a poor man in filthy clothing also enters,
translation:
  language: tl
  text: Sapagkat kung pumasok sa inyong pagtitipon[a] ang isang lalaking may mga singsing na ginto at nakasuot ng maningning na damit, at pumasok din ang isang lalaking mahirap na nakasuot ng maruming damit,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sinagoga.” Ang salitang Griyego ay synagōgē, na maaaring mangahulugang “sinagoga” o “pagtitipon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συναγωγήν
  choice: pagtitipon
  rationale: Saklaw ng salitang Griyego ang sinagoga o kapulungan. Sa konteksto, likas sa modernong Tagalog ang “pagtitipon” at hindi nito ipinapalagay na isang pormal na institusyong Judio ang tinutukoy; pinananatili sa talababa ang mas literal na alternatibo.
- source_word: ἀνὴρ
  choice: isang lalaki
  rationale: Tahasang panlalaking isahan ang anyong Griyego at tumutukoy sa isang lalaki sa halimbawang ito.
- source_word: χρυσοδακτύλιος
  choice: may mga singsing na ginto
  rationale: Ang tambalang pang-uri ay literal na naglalarawan ng taong may gintong palamuti sa mga daliri. Ang saling ito ay natural at pinananatili ang larawan ng hayagang kayamanan nang hindi nililimitahan sa iisang singsing.
- source_word: ἐσθῆτι λαμπρᾷ
  choice: nakasuot ng maningning na damit
  rationale: Maaaring mangahulugan ang λαμπρός na maningning, maringal, o mahusay. Pinananatili ng “maningning” ang biswal na lakas at pahiwatig ng kahanga-hangang kasuotan.
- source_word: πτωχὸς
  choice: isang lalaking mahirap
  rationale: Ginamit bilang pangngalan ang panlalaking pang-uri at katapat ito ng ἀνήρ sa unang bahagi, kaya pinananatili ang retorikal na paghahambing ng dalawang lalaki.
- source_word: ῥυπαρᾷ ἐσθῆτι
  choice: nakasuot ng maruming damit
  rationale: Malakas ang kahulugan ng ῥυπαρός—marumi o karumal-dumal. Ang “maruming damit” ay tuwiran at natural; ang “hamak” o “luma” ay magdaragdag ng ideyang hindi tahasang nasa salita.
- source_word: εἰσέλθῃ ... εἰσέλθῃ
  choice: pumasok ... pumasok din
  rationale: Inuulit ang parehong pandiwa upang mapanatili ang parallel na kayarian ng hipotetikal na tagpo.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ikinakabit ng γάρ ang halimbawang ito sa naunang pagbabawal sa pagtatangi bilang paliwanag o paglalarawan.
theological_decisions:
- issue: Pagsasalin ng συναγωγή sa konteksto ng isang Kristiyanong liham
  choice: pagtitipon
  alternative: sinagoga
  rationale: Hindi nilulutas ng talata ang usapin ng kaayusan ng iglesya. Ang “pagtitipon” ay sapat na malawak para sa nagkakatipong pamayanan at hindi nagpapalagay ng institusyong hindi tiyak sa konteksto, samantalang pinananatili sa talababa ang leksikal na alternatibong “sinagoga.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang paulit-ulit na “pumasok” at ang tahasang pagkakakilanlan sa dalawang lalaki upang maipakita ang parallel na estruktura at matinding panlipunang paghahambing ng Griyego.
