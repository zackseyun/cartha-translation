    rationale: Ang εἰ δέ ay nagpapakilala ng kasunod na kondisyunal na aplikasyon na may bahagyang transisyon o kontrast. Ang “Ngunit kung” ay mas malapit dito nang hindi binabago ang daloy ng pangangatwiran.
  revised_text: Sapagkat ang nagsabi, “Huwag kang mangalunya,” ay siya ring nagsabi, “Huwag kang pumatay.” Ngunit kung hindi ka nangangalunya ngunit pumapatay ka, naging tagalabag ka sa Kautusan.
