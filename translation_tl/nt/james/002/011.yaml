  text: ὁ γὰρ εἰπών Μὴ ⸀μοιχεύσῃς εἶπεν καί Μὴ ⸀φονεύσῃς· εἰ δὲ οὐ ⸂μοιχεύεις φονεύεις⸃ δέ, γέγονας παραβάτης νόμου.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/011.yaml
  text: For he who said, “Do not commit adultery,” also said, “Do not murder.” Now if you do not commit adultery but do murder, you have become a transgressor of the law.
translation:
  language: tl
  text: Sapagkat ang nagsabi, “Huwag kang mangalunya,” ay siya ring nagsabi, “Huwag kang pumatay.” Ngunit kung hindi ka nangangalunya ngunit pumapatay ka, naging tagalabag ka sa Kautusan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ... εἰπών
  choice: ang nagsabi
  rationale: Ang participyong may pantukoy ay ginagamit bilang pangngalan. Pinananatili nitong hindi tahasang pinangalanan ang nagsasalita, gaya ng Griyego, bagaman malinaw sa konteksto na Diyos ang tinutukoy.
- source_word: Μὴ μοιχεύσῃς
  choice: Huwag kang mangalunya
  rationale: Likas at malinaw na modernong Tagalog para sa pagbabawal, at umaalingawngaw sa utos laban sa pangangalunya.
- source_word: εἶπεν καί
  choice: ay siya ring nagsabi
  rationale: Ipinahahayag ng “rin” ang καί at malinaw na ipinakikitang iisang tagapagsalita ang nagbigay ng dalawang utos.
- source_word: Μὴ φονεύσῃς
  choice: Huwag kang pumatay
  rationale: Ito ang kinikilalang likas na anyo ng utos sa Tagalog. Sa kontekstong ito, ang φονεύω ay tumutukoy sa labag sa katuwirang pagkitil ng buhay, hindi sa bawat uri ng pagpatay.
- source_word: εἰ δὲ
  choice: Kaya kung
  rationale: Inihahatid nito ang mapangatuwirang aplikasyon ng naunang pahayag. Ang “kaya” ay natural sa Tagalog, samantalang ang kundisyon ay malinaw na pinananatili ng “kung.”
- source_word: οὐ μοιχεύεις φονεύεις δέ
  choice: hindi ka nangangalunya ngunit pumapatay ka
  rationale: Pinananatili ang pangkasalukuyang anyo bilang pangkalahatang halimbawa at ang malinaw na pagsalungat na dala ng δέ.
- source_word: γέγονας
  choice: naging
  rationale: 'Pinananatili ang diwa ng perpektong panahunan: napasok ng tao ang kalagayan ng pagiging lumalabag at nananatili siyang gayon.'
- source_word: παραβάτης νόμου
  choice: lumalabag ka sa Kautusan
  rationale: Natural na Tagalog ito para sa taong sumusuway o lumalampas sa itinakda ng batas, habang pinananatili ang legal at moral na diwa ng parirala.
- source_word: νόμου
  choice: Kautusan
  rationale: Ang malaking titik ay tumutukoy sa kinikilalang banal na Kautusang kinabibilangan ng mga utos na sinipi, nang hindi nagdaragdag ng paliwanag sa teksto.
theological_decisions:
- issue: Pagkakakilanlan ng nagsalita ng mga utos
  choice: “ang nagsabi” nang hindi tahasang idinaragdag ang “Diyos”
  alternative: “ang Diyos na nagsabi”
  rationale: Malinaw sa konteksto na Diyos ang nagsalita, ngunit hindi siya tahasang pinangalanan sa Griyego. Pinananatili ng salin ang anyo at pagpipigil ng orihinal.
- issue: Saklaw ng paglabag sa Kautusan
  choice: “lumalabag ka sa Kautusan”
  alternative: “lumalabag ka sa utos na iyon”
  rationale: Ang νόμου ay tumutukoy sa Kautusan, hindi lamang sa isang partikular na utos. Pinananatili nito ang punto ni Santiago na ang paglabag sa isang utos ay naghahatid sa kalagayan ng pagiging lumalabag sa Kautusan.
- issue: Saklaw ng φονεύω
  choice: “pumatay” ayon sa nakaugaliang anyo ng utos
  alternative: “pumaslang” o “gumawa ng pagpatay”
  rationale: Ang pandiwang Griyego ay tumutukoy sa murder o labag na pagkitil ng buhay. Ang “pumatay” ang pinakanatural at kinikilalang pananalita sa sipi ng utos sa Tagalog; hindi nito nilalayong isama ang bawat posibleng pagkitil ng buhay.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “mangalunya,” “pumatay,” at “Kautusan” bilang pamilyar na bokabularyong biblikal nang hindi nagiging lipas o labis na teknikal.
