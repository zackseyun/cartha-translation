  text: ⸀ὁρᾶτε ὅτι ἐξ ἔργων δικαιοῦται ἄνθρωπος καὶ οὐκ ἐκ πίστεως μόνον.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/024.yaml
  text: You see that a man is justified by works and not by faith alone[a][b][c].
translation:
  language: tl
  text: Nakikita ninyo na ang tao ay inaaring matuwid sa pamamagitan ng mga gawa at hindi sa pamamagitan ng pananampalataya lamang[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ipinakikitang matuwid” o “pinatutunayang nasa tama.” Pinananatili rito ang pananalita ni Santiago nang hindi nilulutas ang pagtatalo tungkol sa kaugnayan nito sa paggamit ni Pablo ng salitang “ariing matuwid.”
    reason: alternative_reading
  - marker: b
    text: Sa Griyego, “tao”; ginagamit ito rito sa pangkalahatang diwa para sa sinumang tao.
    reason: cultural_note
  - marker: c
    text: Maaari ring “pagtitiwala” o “katapatan” para sa “pananampalataya,” bagaman “pananampalataya” ang karaniwang salin dito ng Griyegong pistis.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁρᾶτε
  choice: Nakikita ninyo
  rationale: Ang pangkasalukuyang pandiwang nasa ikalawang panauhang maramihan ay tuwirang tumutukoy sa mga mambabasa at naghahayag ng kongklusyong makikita nila mula sa naunang halimbawa. Pinananatili ng “Nakikita ninyo” ang anyong pasalaysay sa halip na gawing pautos.
- source_word: ἐξ ἔργων
  choice: sa pamamagitan ng mga gawa
  rationale: Ipinahihiwatig ng ἐξ na ang mga gawa ang batayan o paraan sa argumento. Likas sa Filipino ang “sa pamamagitan ng” at pinananatili nito ang malinaw na paghahambing sa kasunod na parirala.
- source_word: δικαιοῦται
  choice: inaaring matuwid
  rationale: Maaaring mangahulugan ang δικαιόω na ariing matuwid, ipakitang matuwid, o patunayang nasa tama. Pinananatili ng “inaaring matuwid” ang bigat at pagkakaugnay ng terminong teolohikal nang hindi tahimik na nilulutas ang interpretatibong pagtatalo.
- source_word: ἄνθρωπος
  choice: ang tao
  rationale: Bagaman panlalaking isahan ang anyong Griyego, ginagamit ito bilang pangkalahatang katawagan sa isang tao. Ang “ang tao” ay likas, marangal, at pangkalahatan sa Filipino.
- source_word: πίστεως
  choice: pananampalataya
  rationale: Ang “pananampalataya” ang karaniwang katumbas ng πίστις sa kontekstong ito at malinaw na ipinapakita ang paghahambing sa mga gawa, habang inilalahad sa talababa ang iba pang posibleng diwa.
- source_word: μόνον
  choice: lamang
  rationale: Ang “lamang” pagkatapos ng “pananampalataya” ay likas na ayos sa Filipino at tumpak na naghahayag ng pagtatangi o pagiging bukod nito.
theological_decisions:
- issue: Diwa ng δικαιοῦται kaugnay ng teolohiya ng pag-aaring matuwid
  choice: Panatilihin sa pangunahing teksto ang “inaaring matuwid.”
  alternative: “ipinakikitang matuwid” o “pinatutunayang nasa tama”
  rationale: Hindi nilulutas ng salin kung ginagamit ni Santiago ang δικαιόω sa diwang deklaratibo, demonstratibo, o vindikatoryo. Hinahayaan nitong manatili ang tunay na tensiyon ng teksto, at inilalagay ang ibang posibleng diwa sa talababa.
- issue: Pangkalahatang gamit ng ἄνθρωπος
  choice: Isalin bilang “ang tao,” na may pangkalahatang saklaw.
  alternative: “ang isang tao” o “ang isang nilalang na tao”
  rationale: Sa Filipino, ang “tao” ay likas na sumasaklaw sa sinumang tao at hindi eksklusibong tumutukoy sa lalaki, kaya tumpak nitong naihahatid ang kinatawan at pangkalahatang gamit ng salitang Griyego.
- issue: Diwa ng πίστις sa paghahambing sa mga gawa
  choice: Gamitin ang “pananampalataya” sa pangunahing teksto.
  alternative: “pagtitiwala” o “katapatan”
  rationale: “Pananampalataya” ang pinakamalinaw at karaniwang katumbas dito, ngunit hindi itinatanggi ang mas malawak na saklaw ng πίστις; kaya binabanggit sa talababa ang mga leksikal na alternatibo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang nakaugaliang pariralang “inaaring matuwid” upang mapanatili ang leksikal at teolohikal na bigat ng δικαιόω, habang iniiwasang lutasin sa pangunahing teksto ang tunay na interpretatibong tensiyon. Magkapantay ang anyo ng “sa pamamagitan ng” sa dalawang panig ng paghahambing para sa linaw.
