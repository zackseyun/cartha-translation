  text: So speak and so act as those who are going to be judged through the law of freedom.
translation:
  language: tl
  text: Magsalita kayo nang ganito at kumilos din nang ganito, bilang mga taong hahatulan sa pamamagitan ng batas ng kalayaan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως λαλεῖτε καὶ οὕτως ποιεῖτε
  choice: Magsalita kayo at kumilos nang ganito
  rationale: Pinananatili ang magkatambal na pautos tungkol sa pananalita at gawa, habang ginagamit ang likas na modernong Tagalog na “kumilos” para sa ποιεῖτε sa kontekstong etikal.
- source_word: ὡς ... μέλλοντες κρίνεσθαι
  choice: bilang mga taong hahatulan
  rationale: Ipinahahayag ang inaasahang paghatol sa paraang malinaw at natural, nang hindi dinaragdagan kung sino ang hahatol o kailan ito magaganap.
- source_word: διὰ νόμου ἐλευθερίας
  choice: sa pamamagitan ng batas ng kalayaan
  rationale: Isinasalin ang διά gamit ang genitive bilang “sa pamamagitan ng,” alinsunod sa pinakahuling rebisyon at hindi ito pinapantay nang tahimik sa simpleng “ayon sa” o “sa ilalim ng.”
- source_word: νόμου ἐλευθερίας
  choice: batas ng kalayaan
  rationale: Pinananatili ang anyong genitive at ang sadyang tensiyon sa pagitan ng batas at kalayaan, sa halip na ipaliwanag ang relasyon ng dalawang konsepto.
theological_decisions:
- issue: Gampanin ng “batas ng kalayaan” sa paghatol
  choice: sa pamamagitan ng batas ng kalayaan
  alternative: ayon sa batas ng kalayaan / ng batas ng kalayaan
  rationale: Pinananatili ang instrumental o mediating na puwersa ng διὰ at ang tunay na lawak ng kahulugan nito, nang hindi nagpapasok ng tiyak na sistematikong paliwanag.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Ginamit ang “kayo” upang maipakita ang pangmaramihang pautos; iniwasan ang arkaikong ayos at sobrang paliwanag.
