  source_fidelity: Ang “tinutupad ninyo,” “maharlikang kautusan,” “ayon sa Kasulatan,” ang sipi, at “mabuti ang ginagawa ninyo” ay tapat sa Griyego. Gayunman, ang “talagang” ay mas tiyak na katumbas ng “really/indeed” at maaaring magdagdag ng pagbibigay-diin na hindi kailangang ipataw ng μέντοι, na dito ay pangunahing panandang pangkontrast o kwalipikasyon.
  naturalness: Malinaw, moderno, at angkop ang rehistro. Mas maayos at mas tapat ang “Ngunit kung tinutupad ninyo” kaysa “Ngunit kung talagang tinutupad ninyo,” habang nananatiling natural ang daloy.
  terminology: Ang “maharlikang kautusan” ay angkop na salin ng νόμον βασιλικόν at pinananatili ang kalabuan hinggil sa pagiging mula sa Hari, ukol sa kaharian, o kataas-taasan. Ang “Kasulatan,” “ibigin,” at “kapwa” ay angkop sa rehistrong biblikal na modernong Filipino.
