source:
  edition: SBLGNT
  text: Εἰ μέντοι νόμον τελεῖτε βασιλικὸν κατὰ τὴν γραφήν Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν, καλῶς ποιεῖτε·
base_translation:
  language: en
  yaml_path: translation/nt/james/002/008.yaml
  text: If[a], however, you are fulfilling the royal law according to the Scripture, “You shall love your neighbor as yourself,” you are doing well.
translation:
  language: tl
  text: Ngunit kung tinutupad ninyo ang maharlikang kautusan[a] ayon sa Kasulatan, “Ibigin mo ang iyong kapwa gaya ng iyong sarili,” mabuti ang ginagawa ninyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kautusang mula sa Hari” o “kautusan ng kaharian.” Ang literal na Griyego ay “maharlikang kautusan,” na maaaring magdiin sa maharlikang pinagmulan nito o sa kataas-taasang katayuan nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ μέντοι
  choice: Ngunit kung talagang
  rationale: Pinananatili nito ang kondisyon ng εἰ at ang banayad na pagsalungat o pagbibigay-diin ng μέντοι sa natural na ayos ng modernong Tagalog.
- source_word: νόμον ... βασιλικὸν
  choice: ang maharlikang kautusan
  rationale: Ang “maharlika” ay tuwirang naglalarawan sa kautusang nauukol sa hari o may kataas-taasang katangian, nang hindi ipinapasiya kung pinagmulan, ranggo, o kaugnayan sa kaharian ang pangunahing diin.
- source_word: τελεῖτε
  choice: tinutupad ninyo
  rationale: Ipinahahayag nito ang pagsasagawa o pagtupad sa hinihingi ng kautusan at pinananatili ang aspektong nagpapatuloy ng pandiwang Griyego.
- source_word: κατὰ τὴν γραφήν
  choice: ayon sa Kasulatan
  rationale: Natural itong katumbas ng pagsunod sa sinasabi ng nag-iisang tinutukoy na γραφή.
- source_word: Ἀγαπήσεις
  choice: Ibigin mo
  rationale: Bagaman anyong panghinaharap sa Griyego, gumaganap ito bilang utos sa sipi mula sa Levitico 19:18; ang pautos na Tagalog ang pinakanatural na nagpapanatili sa puwersa nito.
- source_word: τὸν πλησίον σου
  choice: ang iyong kapwa
  rationale: Ang “kapwa” ay malinaw at nakaugat na katawagang biblikal sa taong dapat pakitunguhan nang may pag-ibig.
- source_word: ὡς σεαυτόν
  choice: gaya ng iyong sarili
  rationale: Pinananatili ang maikli at tuwirang paghahambing ng Griyego nang hindi nagdaragdag ng pandiwa.
- source_word: καλῶς ποιεῖτε
  choice: mabuti ang ginagawa ninyo
  rationale: Natural na pahayag ito ng pagsang-ayon na tama ang kanilang ginagawa, habang pinananatili ang kasalukuyang kilos.
theological_decisions:
- issue: Kahulugan ng “maharlikang kautusan”
  choice: Panatilihin ang paglalarawang “maharlika” nang hindi nililimitahan ang dahilan nito.
  alternative: “kautusan ng Hari,” “pinakamataas na kautusan,” o “kautusan ng kaharian”
  rationale: Maaaring tumukoy ang βασιλικός sa pinagmulan nito sa Hari, sa mataas nitong katayuan, o sa kaugnayan nito sa kaharian. Hindi nilulutas ng salin ang tunay na kalabuan ng parirala.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “kautusan” para sa νόμος dahil tumutukoy rito ang konteksto sa tiyak na utos ng Kasulatan; pinanatili ang pormal na himig ng siping biblikal nang hindi gumagamit ng lipas na pananalita.
