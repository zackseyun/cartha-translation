source:
  edition: SBLGNT
  text: ὑμεῖς δὲ ἠτιμάσατε τὸν πτωχόν. οὐχ οἱ πλούσιοι καταδυναστεύουσιν ὑμῶν, καὶ αὐτοὶ ἕλκουσιν ὑμᾶς εἰς κριτήρια;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/006.yaml
  text: But you have dishonored the poor man[b][a]. Is it not the rich who oppress you and themselves drag you into courts?
translation:
  language: tl
  text: Ngunit hinamak ninyo ang taong dukha.[a] Hindi ba ang mayayaman ang umaapi sa inyo at sila rin ang kumakaladkad sa inyo upang iharap sa mga hukuman?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang dukha,” na maaaring tumukoy nang mas pangkalahatan sa mga dukha. Isahan ang Griyego at malamang na unang tumutukoy sa taong dukhang nasa halimbawa sa mga naunang talata.
    reason: lexical_alternative
  - marker: b
    text: O “mga korte” o “mga tribunal.” Tumutukoy ang Griyego sa mga hukumang panghukuman o sa legal na paglilitis.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠτιμάσατε
  choice: nilapastangan ninyo
  rationale: Ipinahahayag ng ἀτιμάζω ang pagtrato sa isang tao nang walang dangal o may paghamak. Ang “nilapastangan” ay natural at marangal na Filipino na nagpapanatili sa dimensiyon ng dangal at kahihiyan.
- source_word: τὸν πτωχόν
  choice: ang taong dukha
  rationale: Pinananatili nito ang isahan at tiyak na reperensiya sa taong dukhang binanggit sa naunang halimbawa, habang maaari pa rin siyang kumatawan sa mga dukha sa pangkalahatan.
- source_word: οἱ πλούσιοι
  choice: ang mayayaman
  rationale: Ang pang-uring ginamit bilang pangngalan ay tumutukoy sa mayayaman bilang isang uri; tuwiran at likas ito sa Filipino.
- source_word: καταδυναστεύουσιν
  choice: nang-aapi
  rationale: Ipinahahayag ng pandiwa ang malupit na paggamit ng kapangyarihan laban sa iba. Malinaw na nahuhuli ng “nang-aapi” ang puwersang ito nang hindi tinutukoy nang labis ang paraan.
- source_word: ἕλκουσιν
  choice: kumakaladkad
  rationale: Pinananatili ng “kumakaladkad” ang matingkad at mapuwersang larawan ng paghila sa kanila tungo sa legal na paglilitis.
- source_word: κριτήρια
  choice: mga hukuman
  rationale: Sa kontekstong ito, tumutukoy ang κριτήρια sa mga lugar o institusyon ng paghatol na legal. Ang “mga hukuman” ay malinaw at pangkaraniwang gamit sa modernong Filipino.
- source_word: καὶ αὐτοὶ
  choice: at sila mismo
  rationale: Pinananatili ng “sila mismo” ang diin na ang mayayaman ding iyon ang personal na kumakaladkad sa kanila sa hukuman.
- source_word: οὐχ ... ;
  choice: Hindi ba ...?
  rationale: Likas na ipinahahayag ng “Hindi ba” sa Filipino ang retorikal na tanong na umaasa ng pagsang-ayon.
theological_decisions:
- issue: Tinutukoy ng isahang τὸν πτωχόν
  choice: Isang kinatawang taong dukha sa tagpo ng kapulungan, na may mas malawak na aplikasyon sa mga dukha
  alternative: Kolektibong isahan na nangangahulugang “ang mga dukha” sa pangkalahatan
  rationale: Katatapos lamang ilarawan sa 2:2–3 ang isang partikular na taong dukha, kaya pinananatili ng isahan ang daloy ng diskurso nang hindi inaalis ang kinatawang bisa nito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignificado, at madaling maunawaan. Ginamit ang “taong dukha” upang mapanatili ang isahan at ugnayan sa naunang tagpo; ang “kumakaladkad” ay sadyang matingkad upang tularan ang puwersa ng ἕλκουσιν.
