id: JAS.2.3
reference: James 2:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸂ἐπιβλέψητε δὲ⸃ ἐπὶ τὸν φοροῦντα τὴν ἐσθῆτα τὴν λαμπρὰν καὶ ⸀εἴπητε· Σὺ κάθου ὧδε καλῶς, καὶ τῷ πτωχῷ εἴπητε· Σὺ στῆθι ⸂ἢ κάθου ἐκεῖ⸃ ὑπὸ τὸ ὑποπόδιόν μου,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/003.yaml
  text: and if you pay attention to the one wearing the bright clothing and say[a], “You sit here in a good place,” and say to the poor man, “You stand there[b], or sit under my footstool,”
translation:
  language: tl
  text: at bibigyan ninyo ng natatanging pansin ang lalaking nakasuot ng maningning na damit[a] at sasabihin ninyo, “Maupo ka rito sa magandang puwesto,” samantalang sasabihin ninyo sa lalaking dukha, “Tumayo ka riyan, o maupo ka roon[b] sa ilalim ng patungan ng paa ko,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “marangyang damit” o “magarang damit.”
    reason: lexical_alternative
  - marker: b
    text: May pagkakaiba-iba sa mga manuskrito sa mga salitang “o maupo ka roon.” Kasama ang mga ito sa tekstong Griyegong ginamit dito.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπιβλέψητε
  choice: binigyan ninyo ng natatanging pansin
  rationale: Sa kontekstong ito, hindi lamang pagtingin ang tinutukoy kundi ang pagbibigay ng paborableng pansin. Pinananatili ng salin ang diwang iyon nang hindi tahasang isinasalin bilang ‘nagpakita ng pagtatangi,’ sapagkat ang kongkretong kilos ang inilalarawan sa talata.
- source_word: φοροῦντα
  choice: nakasuot
  rationale: Direkta at likas na katumbas ito ng participle na tumutukoy sa pagsusuot ng damit.
- source_word: ἐσθῆτα τὴν λαμπράν
  choice: maningning na damit
  rationale: Ang ἐσθής ay damit o kasuotan, at ang λαμπρός ay maaaring mangahulugang maningning, maringal, o magara. Pinananatili ng ‘maningning’ ang larawan ng kapansin-pansing kasuotan.
- source_word: Σὺ κάθου ὧδε καλῶς
  choice: Maupo ka rito sa magandang puwesto
  rationale: Ipinahahayag nito nang natural sa Filipino ang pautos at ang paborableng lugar na ipinahihiwatig ng καλῶς.
- source_word: τῷ πτωχῷ
  choice: sa lalaking dukha
  rationale: Ang anyong Griyego ay panlalaking isahan at tumutukoy sa isang tiyak na lalaking mahirap sa tagpo.
- source_word: στῆθι
  choice: Tumayo ka
  rationale: Payak na pautos ito na tumutukoy sa pagtayo.
- source_word: ἢ κάθου ἐκεῖ
  choice: o maupo ka roon
  rationale: Pinananatili ang alternatibong utos at ang distansiyang ipinahihiwatig ng ἐκεῖ.
- source_word: ὑπὸ τὸ ὑποπόδιόν μου
  choice: sa ilalim ng patungan ng paa ko
  rationale: Ang ὑπό na may accusative ay natural na ‘sa ilalim.’ Kahit mapanghamak at sadyang di-komportable ang larawan, mahalagang panatilihin ang puwersa nito.
theological_decisions:
- issue: Wika tungkol sa pagtatangi batay sa katayuan
  choice: Ilarawan ang magkaibang pagtrato sa may magandang kasuotan at sa dukha sa pamamagitan ng kanilang konkretong mga kilos at pananalita.
  alternative: Tahasang sabihing ‘nagpakita kayo ng paboritismo.’
  rationale: Kinokondena ng konteksto ang pagtatangi, ngunit inilalahad ng talatang ito ang mismong kilos. Hinahayaan ng salin na lumitaw ang teolohikal na punto mula sa kongkretong tagpo.
- issue: Kasarian ng πτωχῷ
  choice: lalaking dukha
  alternative: taong dukha
  rationale: Panlalaking isahan ang anyong Griyego at dalawang indibidwal na bisita ang inilalarawan, kaya pinananatili ang kasarian ng tinutukoy.
translation_notes:
  register: Makabagong, malinaw, at marangal na Filipino. Ginamit ang magkatulad na panghalip na ‘ka’ sa dalawang utos upang huwag magdagdag ng antas ng paggalang na wala sa Griyego; ang pagkakaiba ng pagtrato ay ipinakikita sa puwestong iniaalok. Ang ‘samantalang’ ay natural na naghahayag ng paghahambing nang hindi nagdaragdag ng doktrinal na interpretasyon.
