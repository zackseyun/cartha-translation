id: JAS.2.5
reference: James 2:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀκούσατε, ἀδελφοί μου ἀγαπητοί. οὐχ ὁ θεὸς ἐξελέξατο τοὺς πτωχοὺς ⸂τῷ κόσμῳ⸃ πλουσίους ἐν πίστει καὶ κληρονόμους τῆς βασιλείας ἧς ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/005.yaml
  text: 'Listen[c][b][a], my beloved brothers: has not God chosen those who are poor in the world to be rich in faith and heirs of the kingdom that he promised to those who love him?'
translation:
  language: tl
  text: Makinig kayo, minamahal kong mga kapatid[a]. Hindi ba pinili ng Diyos ang mga dukha sa paningin ng sanlibutan[b] upang maging mayaman sa pananampalataya[c] at mga tagapagmana ng kahariang ipinangako niya sa mga umiibig sa kanya?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay nasa panlalaking maramihang anyo, “mga kapatid,” ngunit maaari nitong tukuyin nang inklusibo ang buong kapulungan ng mga mananampalataya. Ang “kapatid” sa Tagalog ay maaari ring tumukoy sa lalaki o babae.
    reason: alternative_reading
  - marker: b
    text: Maaari ring isalin na “mga dukha ayon sa pamantayan ng sanlibutan.”
    reason: lexical_alternative
  - marker: c
    text: Ang “pananampalataya” ay maaari ring ipahayag na “pagtitiwala”; posible rin sa ibang konteksto ang “katapatan,” bagaman hindi gaanong malamang dito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσατε
  choice: Makinig kayo
  rationale: Ang aorist imperative plural ay tuwirang panawagan sa buong pangkat na magbigay-pansin; natural at malinaw sa modernong Tagalog ang “Makinig kayo.”
- source_word: ἀδελφοί μου ἀγαπητοί
  choice: mga minamahal kong kapatid
  rationale: Ang “kapatid” sa Tagalog ay hindi nakatali sa kasarian at natural na tumutukoy sa mga kapwa mananampalataya; pinananatili ng “minamahal kong” ang μου ἀγαπητοί.
- source_word: οὐχ ... ἐξελέξατο
  choice: Hindi ba pinili
  rationale: Pinananatili nito ang retorikal na tanong na umaasa ng positibong sagot at isinasalin ang divine choosing nang hindi nagdaragdag ng isang sistematikong doktrina.
- source_word: τοὺς πτωχοὺς τῷ κόσμῳ
  choice: ang mga dukha ayon sa sanlibutan
  rationale: 'Ipinahihiwatig ng datibong τῷ κόσμῳ ang pamantayan o kaugnayan: dukha kung susukatin ayon sa sanlibutan. Pinananatili ng salin ang bahagyang siksik na pahayag ng Griyego.'
- source_word: πλουσίους ἐν πίστει
  choice: maging mayaman sa pananampalataya
  rationale: Ang “pananampalataya” ang pinakanatural na kahulugan ng πίστις dito, sa tahasang paghahambing sa materyal o panlipunang karukhaan.
- source_word: κληρονόμους τῆς βασιλείας
  choice: mga tagapagmana ng kaharian
  rationale: Ang “tagapagmana” ay karaniwan at tumpak na legal-pampamilyang katumbas ng κληρονόμος.
- source_word: ἧς ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν
  choice: kahariang ipinangako niya sa mga umiibig sa kanya
  rationale: Natural na pinananatili ang relative construction, ang Diyos bilang paksa ng pangako, at ang kasalukuyang participle bilang katangiang naglalarawan sa mga tumatanggap.
theological_decisions:
- issue: Saklaw ng pagpili ng Diyos
  choice: Isalin lamang bilang “pinili” sa loob ng argumento ni Santiago.
  alternative: Gumamit ng pananalitang tahasang nag-uugnay rito sa isang kumpletong doktrina ng predestinasyon.
  rationale: Binibigyang-diin ng talata ang pagsalungat ng pagpapahalaga ng Diyos sa pagtatangi batay sa katayuan; hindi dapat dagdagan ng salin ang hindi tahasang sinasabi tungkol sa mas malawak na kaayusan ng kaligtasan.
- issue: Saklaw ng ἀδελφοί
  choice: Gamitin ang likas na inklusibong “mga kapatid.”
  alternative: “mga kapatid na lalaki” o “mga kapatid na lalaki at babae”
  rationale: Bagaman gramatikal na panlalaking maramihan ang Griyego, ang “kapatid” sa Tagalog ay tunay na walang markang kasarian at angkop sa buong kapulungang kinakausap; hindi kailangang dagdagan ng “lalaki at babae.”
- issue: Kahulugan ng πίστις
  choice: pananampalataya
  alternative: pagtitiwala; katapatan
  rationale: Sa pariralang πλουσίους ἐν πίστει, “pananampalataya” ang pinakamalamang at tradisyonal na diwa, ngunit maaaring ipaliwanag sa talababa ang mga leksikal na alternatibo nang hindi nilulutas nang lampas sa ebidensiya.
- issue: Kaugnayan ng karukhaan at kaharian
  choice: Panatilihin ang retorikal na pahayag na pinili ng Diyos ang mga dukha ayon sa sanlibutan upang maging mayaman sa pananampalataya at mga tagapagmana.
  alternative: Ipahiwatig na lahat ng dukha, dahil lamang sa kanilang karukhaan, ay awtomatikong tagapagmana.
  rationale: Hindi dapat gawing mekanikal na batayan ng kaligtasan ang karukhaan; ang mismong pangungusap ay may kaugnay na paglalarawan sa mga umiibig sa Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “dukha” upang mapanatili ang solemne at matinding diwa ng πτωχός, “sanlibutan” para sa moral-panlipunang pananaw ng κόσμος, at “umiibig” bilang natural ngunit dignified na anyo. Ang ayos ng pangungusap ay malapit sa retorikal na daloy ng Griyego nang hindi nagiging pilit sa Tagalog.
