  text: ὥσπερ ⸀γὰρ τὸ σῶμα χωρὶς πνεύματος νεκρόν ἐστιν, οὕτως καὶ ἡ πίστις ⸀χωρὶς ἔργων νεκρά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/026.yaml
  text: For just as the body without the spirit is dead[b][a], so also faith without works is dead.
translation:
  language: tl
  text: Sapagkat kung paanong patay ang katawan na walang espiritu[a], gayon din naman patay ang pananampalatayang walang mga gawa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hininga.” Ang salitang Griyego ay maaaring mangahulugang “espiritu” o “hininga.”
    reason: lexical_alternative
  - marker: b
    text: O “katapatan.” Ang salitang Griyego ay maaari ring tumukoy sa pagtitiwala o katapatan; sinusunod dito ng pangunahing teksto ang karaniwang saling “pananampalataya.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ
  choice: kung paanong
  rationale: Likas na panandang Filipino sa unang bahagi ng paghahambing at malinaw na umaakay sa katumbas na “gayon din naman.”
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na kaugnayan ng talata sa naunang pangangatwiran.
- source_word: τὸ σῶμα
  choice: ang katawan
  rationale: Tuwirang katumbas para sa pisikal na katawan.
- source_word: χωρὶς πνεύματος
  choice: kapag wala itong espiritu
  rationale: Ipinahahayag nang natural sa Filipino ang kawalan ng nagbibigay-buhay na espiritu; nananatili sa talababa ang posibleng kahulugang “hininga.”
- source_word: νεκρόν ἐστιν
  choice: patay
  rationale: Tuwiran at mariing katumbas ng panaguring Griyego; hindi kailangang ulitin ang pandiwang “ay” sa likas na pangungusap na Filipino.
- source_word: οὕτως καὶ
  choice: gayon din naman
  rationale: Malinaw na minamarkahan ang ikalawang bahagi ng paghahambing at pinananatili ang diing idinudulot ng καί.
- source_word: ἡ πίστις
  choice: ang pananampalataya
  rationale: Karaniwang katumbas ng πίστις sa kontekstong ito; ang posibleng kahulugang “katapatan” ay inilalagay sa talababa upang hindi basta lutasin ang usaping leksikal.
- source_word: χωρὶς ἔργων
  choice: kapag wala itong mga gawa
  rationale: Natural na Filipino na nagpapanatili sa “mga gawa,” isang mahalagang terminong inuulit sa pangangatwiran ng Santiago.
- source_word: νεκρά ἐστιν
  choice: patay
  rationale: Inuulit ang parehong salitang ginamit tungkol sa katawan upang mapanatili ang mahigpit na paralelismo ng Griyego.
theological_decisions:
- issue: Kahulugan ng πνεύματος sa paghahambing
  choice: espiritu
  alternative: hininga
  rationale: Pinananatili ng “espiritu” ang malawak na saklaw ng salitang Griyego at ang diwa ng nagbibigay-buhay na sangkap; kinikilala sa talababa ang “hininga” bilang tunay na posibleng kahulugan.
- issue: Kahulugan ng πίστις sa Santiago 2:26
  choice: pananampalataya
  alternative: katapatan
  rationale: Ang “pananampalataya” ang karaniwang pagbasa sa agarang argumento tungkol sa pananampalataya at mga gawa. Gayunman, maaaring tumukoy ang πίστις sa “katapatan,” kaya pinananatili ang alternatibo sa talababa nang hindi ipinapasok sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pares na “kung paanong … gayon din naman” upang maging natural ang paghahambing, at inulit ang “patay” upang mapanatili ang retorikal na paralelismo ng orihinal.
