  rationale: Inayos ang salin upang maging mas malapit sa pangunahing terminolohiya at kilos sa Griyego, habang nananatiling malinaw at natural sa modernong Filipino. Ang talababa sa “inaring-ganap” ay nagpapanatili ng kinikilalang interpretatibong saklaw nang hindi ipinapataw ang anumang denominasyonal na pagbasa.
