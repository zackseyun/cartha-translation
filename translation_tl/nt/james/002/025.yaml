source:
  edition: SBLGNT
  text: ὁμοίως δὲ καὶ Ῥαὰβ ἡ πόρνη οὐκ ἐξ ἔργων ἐδικαιώθη, ὑποδεξαμένη τοὺς ἀγγέλους καὶ ἑτέρᾳ ὁδῷ ἐκβαλοῦσα;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/025.yaml
  text: And likewise[b][a], was not Rahab the prostitute also justified by works when she welcomed the messengers and sent them out by another way?
translation:
  language: tl
  text: At gayundin, hindi ba si Rahab, ang prostituta, ay inaring-ganap[a] sa pamamagitan ng mga gawa nang tanggapin niya ang mga sugo[b] at pinaalis sila sa ibang daan?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ipinahayag na matuwid” o “pinatunayang matuwid.” Ang salitang Griyego ay “inaring-ganap”; pinananatili ng salin ang terminong ito nang hindi nilulutas ang pagtatalo tungkol sa eksaktong diwa nito.
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “mga sugo.” Ang tinutukoy ay ang mga lalaking tinanggap ni Rahab (Josue 2), hindi mga anghel.
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως δὲ καὶ
  choice: At gayundin
  rationale: Ipinakikita nito ang paghahambing sa naunang halimbawa ni Abraham at idinaragdag si Rahab bilang ikalawang halimbawa, sa natural na modernong Tagalog.
- source_word: Ῥαὰβ
  choice: Rahab
  rationale: Ginamit ang nakasanayang anyo ng pangalang pantangi sa Filipino.
- source_word: ἡ πόρνη
  choice: na isang bayarang babae
  rationale: Tuwirang tumutukoy ang πόρνη sa isang babaeng nagbebenta ng serbisyong seksuwal. Mas natural at malinaw sa karaniwang modernong Tagalog ang “bayarang babae” kaysa sa arkaikong “patutot,” habang napapanatili ang panlipunan at moral na bigat ng salita.
- source_word: οὐκ ... ἐδικαιώθη
  choice: hindi ba ... itinuring na matuwid
  rationale: Ang pasibong ἐδικαιώθη ay maaaring tumukoy sa pagpapahayag o pagkilalang matuwid. Ang “itinuring na matuwid” ay malinaw sa ordinaryong mambabasa at hindi ganap na nilulutas kung ito ay deklarasyon o pagpapatunay; inilalahad sa talababa ang iba pang posibleng salin.
- source_word: ἐξ ἔργων
  choice: dahil sa mga gawa
  rationale: Ipinahahayag ng ἐκ na may genitibo ang batayan o pinagmumulan sa pangangatwiran ni Santiago. Natural sa Filipino ang “dahil sa mga gawa” at pinananatili ang ugnayan ng katuwiran at mga gawa sa talata.
- source_word: ὑποδεξαμένη
  choice: nang malugod niyang tanggapin
  rationale: Ang pandiwaring ito ay nagsasaad ng magiliw o mapagpatuloy na pagtanggap. Isinasalin ng “nang” ang kaugnayan nito sa pangunahing pandiwa nang natural.
- source_word: τοὺς ἀγγέλους
  choice: ang mga sugo
  rationale: Maaaring mangahulugan ang ἄγγελος ng anghel o taong sugo. Sa salaysay tungkol kay Rahab, mga taong isinugo ang tinutukoy; hindi ipinapasok sa pangunahing teksto ang mas espesipikong “mga espiya,” na mula sa konteksto at hindi sa mismong leksikal na anyo rito.
- source_word: καὶ ἑτέρᾳ ὁδῷ ἐκβαλοῦσα
  choice: at padaanin sila sa ibang daan
  rationale: Sa kontekstong ito, ang ἐκβάλλω ay nangangahulugang pinaalis o ipinadala, hindi marahas na itinaboy. Likas sa Filipino ang “padaanin sila sa ibang daan” at malinaw na ipinahahayag ang alternatibong ruta.
theological_decisions:
- issue: Kahulugan ng δικαιόω sa Santiago 2:25 kaugnay ng pananampalataya at mga gawa
  choice: Gamitin ang “itinuring na matuwid” at magbigay ng talababa na kinikilala ang mga posibleng diwang “ipinahayag na matuwid” at “pinatunayang matuwid.”
  alternative: “inaring-ganap,” “ipinahayag na matuwid,” o “pinatunayang matuwid”
  rationale: May tunay na interpretatibong tensiyon sa gamit ni Santiago sa δικαιόω. Hindi dapat ipako ng salin ang talata sa isang denominasyonal na paliwanag. Ang pangunahing salin ay nananatiling malapit sa konsepto ng pagkilalang matuwid, at inilalantad ng talababa ang saklaw ng posibleng diwa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Iniwasan ang arkaikong bokabularyo at ang mga terminong maaaring magdikta ng isang denominasyonal na pagbasa. Nasa pangunahing teksto ang lahat ng panandang talababa.
