id: JAS.5.8
reference: James 5:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: μακροθυμήσατε καὶ ὑμεῖς, στηρίξατε τὰς καρδίας ὑμῶν, ὅτι ἡ παρουσία τοῦ κυρίου ἤγγικεν.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/008.yaml
  text: You also be patient; strengthen your hearts[a], because the coming of the Lord has drawn near.
translation:
  language: tl
  text: Magtiyaga rin kayo. Patatagin ninyo ang inyong mga puso, sapagkat malapit na ang pagdating[a] ng Panginoon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “presensiya ng Panginoon.” Ang salitang Griyego ay maaaring mangahulugang “presensiya” o “pagdating”; sa kontekstong ito, tumutukoy ito sa pangwakas na pagdating ng Panginoon.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακροθυμήσατε
  choice: Magtiyaga
  rationale: Utos ito sa maramihan na tumutukoy sa matiyagang pagtitiis sa gitna ng hirap. Likas at malinaw sa modernong Tagalog ang “magtiyaga” at angkop ito sa halimbawa ng magsasaka sa naunang talata.
- source_word: καὶ ὑμεῖς
  choice: rin kayo
  rationale: Pinananatili ng “rin” ang ugnayan sa halimbawang nauna at ng “kayo” ang diin ng hayag na panghalip sa Griyego.
- source_word: στηρίξατε
  choice: Patatagin
  rationale: Ipinahahayag nito ang utos na gawing matatag o matibay ang panloob na kalooban.
- source_word: τὰς καρδίας ὑμῶν
  choice: ang inyong mga puso
  rationale: Pinananatili ang biblikal na talinghaga ng puso bilang sentro ng loob, pagpapasya, at lakas ng loob, sa halip na paliitin ito sa isip lamang.
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw na ipinakikilala nito ang dahilan ng dalawang utos at naaayon sa marangal ngunit madaling maunawaang rehistro.
- source_word: ἡ παρουσία
  choice: ang pagdating
  rationale: Bagaman maaari itong mangahulugang presensiya, sa konteksto ng Santiago 5:7–8 tumutukoy ito sa inaasahang pagdating ng Panginoon.
- source_word: τοῦ κυρίου
  choice: ng Panginoon
  rationale: Ang “Panginoon” ang likas at kinikilalang salin ng titulong κύριος sa kontekstong ito.
- source_word: ἤγγικεν
  choice: malapit na
  rationale: Ipinahahayag sa likas na modernong Tagalog ang kasalukuyang kalagayan ng pagiging malapit na bunga ng perpektong pandiwang Griyego.
theological_decisions:
- issue: Kahulugan ng παρουσία sa pahayag tungkol sa Panginoon
  choice: pagdating ng Panginoon
  alternative: presensiya ng Panginoon
  rationale: Ang konteksto ay nakatuon sa hinihintay na pangwakas na pagdating ng Panginoon, ngunit tunay na saklaw ng salita ang diwang “presensiya,” kaya pinanatili iyon sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at tuwiran. Pinanatili ang talinghaga ng “mga puso,” at inilagay ang pananda ng talababa sa “pagdating,” ang salitang talagang tinutukoy nito.
