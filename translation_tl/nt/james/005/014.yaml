id: JAS.5.14
reference: James 5:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀσθενεῖ τις ἐν ὑμῖν; προσκαλεσάσθω τοὺς πρεσβυτέρους τῆς ἐκκλησίας, καὶ προσευξάσθωσαν ἐπ’ αὐτὸν ἀλείψαντες ⸀αὐτὸν ἐλαίῳ ἐν τῷ ὀνόματι τοῦ κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/james/005/014.yaml
  text: Is anyone among you sick? Let him call for the elders of the church[a], and let them pray over him[b], anointing him with oil in the name of the Lord.
translation:
  language: tl
  text: May maysakit[a] ba sa inyo? Tawagin niya ang mga matatanda ng iglesya, at ipanalangin nila siya[b], habang pinapahiran nila siya ng langis sa pangalan ng Panginoon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mahina.” Maaaring tumukoy ang pandiwang Griyego sa kahinaan sa mas malawak na diwa, ngunit sa konteksto ng panalangin, pagpapahid ng langis, at pagpapagaling sa kasunod na talata, malamang na karamdaman ang tinutukoy.
    reason: lexical_alternative
  - marker: b
    text: Ang pariralang Griyego ay maaaring isalin nang mas literal na “manalangin sila sa ibabaw niya.” Maaari itong tumukoy sa panalanging ginagawa sa ibabaw o malapit sa maysakit, ngunit hindi tinutukoy ng parirala ang isang partikular na tindig o kilos. Hindi rin sinasabi ng teksto kung ang pagpapahid ng langis ay panggamot, simboliko, o kapwa.
    reason: translation_and_cultural_note
lexical_decisions:
- source_word: ἀσθενεῖ
  choice: maysakit
  rationale: Bagaman maaari itong tumukoy sa kahinaan sa mas malawak na diwa, ang panalangin, pagpapahid ng langis, at konteksto ng pagpapagaling sa kasunod na talata ay nagpapakitang pisikal na karamdaman ang pangunahing diwa rito.
- source_word: τις ἐν ὑμῖν
  choice: mayroon bang ... sa inyo
  rationale: Likas na Filipino para sa isang bukas at di-tiyak na pagtukoy sa sinumang kabilang sa pamayanan.
- source_word: προσκαλεσάσθω
  choice: ipatawag niya
  rationale: Pinananatili ang pautos na diwa at ipinahihiwatig na hinihiling ng maysakit na pumunta sa kaniya ang mga tagapanguna.
- source_word: τοὺς πρεσβυτέρους τῆς ἐκκλησίας
  choice: ang mga matatandang tagapanguna ng iglesya
  rationale: Tinutukoy ng parirala ang kinikilalang mga lider ng iglesya, hindi lamang ang matatandang lalaki. Nililinaw ng 'tagapanguna' ang tungkulin habang pinananatili ng 'matatanda' ang tradisyonal na konsepto ng πρεσβύτεροι.
- source_word: προσευξάσθωσαν ἐπ’ αὐτόν
  choice: ipanalangin nila siya
  rationale: Natural na Filipino para sa panalanging inuukol sa maysakit; ang literal na 'manalangin sa ibabaw niya' ay maaaring magbigay ng di-tiyak na pisikal na larawan na hindi kailangang ipahiwatig ng parirala.
- source_word: ἀλείψαντες αὐτὸν ἐλαίῳ
  choice: habang pinapahiran siya ng langis
  rationale: Tumpak na inilalarawan ang paglalagay ng langis nang hindi nagpapasiya kung ito ay panggamot, simboliko, sakramental, o kumbinasyon ng mga ito.
- source_word: ἐν τῷ ὀνόματι τοῦ κυρίου
  choice: sa pangalan ng Panginoon
  rationale: Pinananatili ang biblikal na idyoma at ang kaugnayan ng kilos sa persona at awtoridad ng Panginoon.
theological_decisions:
- issue: Saklaw ng ἀσθενεῖ
  choice: Pisikal na karamdaman ang pangunahing diwa sa pangunahing teksto.
  alternative: Pangkalahatang kahinaan, kabilang ang espirituwal o pisikal na panghihina.
  rationale: Mas pinapaboran ng agarang konteksto ng panalangin, langis, at pagpapagaling ang karamdaman, bagaman mas malawak ang maaaring kahulugan ng pandiwa.
- issue: Gamit o bisa ng pagpapahid ng langis
  choice: Neutral na paglalarawan lamang ng kilos.
  alternative: Tiyak na panggamot, simboliko, o sakramental na gawain.
  rationale: Hindi tinutukoy ng Griyego ang mekanismo o eksaktong teolohikal na bisa nito, kaya hindi dapat magpasok ng isang denominasyonal na paliwanag.
- issue: Pagkakakilanlan ng πρεσβύτεροι
  choice: Mga kinikilalang matatandang tagapanguna ng iglesya.
  alternative: Mga nakatatandang lalaki lamang o isang tiyak na denominasyonal na katungkulan.
  rationale: Ang genitibong 'ng iglesya' ay nagpapakitang tungkulin sa pamayanan ang tinutukoy, ngunit hindi sapat ang talata upang itakda ang anyo ng katungkulan ayon sa isang denominasyon.
- issue: Kahulugan ng 'sa pangalan ng Panginoon'
  choice: Panatilihin ang tradisyonal at teolohikal na bukas na idyoma.
  alternative: Palitan ng mas makitid na 'sa awtoridad ng Panginoon.'
  rationale: Maaaring kasama ang awtoridad, ngunit ang orihinal na parirala ay may mas malawak na ugnayan sa pangalan at persona ng Panginoon.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang 'iglesya' bilang karaniwang katawagan sa pamayanang Kristiyano. Ang 'mga matatandang tagapanguna' ay mas madaling maunawaan kaysa 'mga presbitero' at mas tiyak sa tungkulin kaysa sa payak na 'matatanda.' Ang mga panghalip na isahan ay natural sa Filipino at hindi nagpapataw ng kasarian.
