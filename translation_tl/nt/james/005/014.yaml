  naturalness: Natural ang karamihan ng pangungusap, ngunit mas maigsi, malinaw, at marangal ang “May maysakit ba sa inyo?” at “mga matatanda ng iglesya.” Ang “ipanalangin nila siya” ay idiomatiko at sapat na naghahatid ng panalanging iniuukol sa maysakit nang ipilit ang di-likas na literal na “sa ibabaw niya.”
