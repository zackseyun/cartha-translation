id: JAS.5.7
reference: James 5:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Μακροθυμήσατε οὖν, ἀδελφοί, ἕως τῆς παρουσίας τοῦ κυρίου. ἰδοὺ ὁ γεωργὸς ἐκδέχεται τὸν τίμιον καρπὸν τῆς γῆς, μακροθυμῶν ἐπ’ ⸀αὐτῷ ἕως ⸀λάβῃ πρόϊμον καὶ ὄψιμον.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/007.yaml
  text: Be patient[a], therefore, brothers, until the coming of the Lord. Look, the farmer waits for the precious fruit of the earth[b], being patient over it until it receives the early and late rains.
translation:
  language: tl
  text: 'Kaya magtiyaga kayo, mga kapatid,[a] hanggang sa pagdating ng Panginoon.[b] Tingnan ninyo ang magsasaka: hinihintay niya ang mahalagang ani ng lupa, at matiyaga siyang naghihintay para rito hanggang tumanggap ito ng unang at huling ulan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay nasa anyong “mga kapatid na lalaki,” ngunit madalas itong gamitin para sa buong komunidad ng mga mananampalataya.
    reason: alternative_reading
  - marker: b
    text: O “presensiya ng Panginoon”; sa kontekstong ito, malamang na tumutukoy ito sa kanyang pagdating sa hinaharap.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακροθυμήσατε / μακροθυμῶν
  choice: magtiyaga / matiyaga
  rationale: Pinananatili ang pag-uulit ng salitang Griyego tungkol sa matiisin at matagal na paghihintay, sa natural na modernong Tagalog.
- source_word: οὖν
  choice: Kaya
  rationale: Malinaw at likas na ipinapakita ang pagbubuod o paghihinuha mula sa naunang konteksto.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Ang “mga kapatid” ay natural sa Tagalog at maaaring tumukoy sa buong komunidad ng mga mananampalataya nang hindi kinakailangang tukuyin ang kasarian.
- source_word: παρουσίας τοῦ κυρίου
  choice: pagdating ng Panginoon
  rationale: Sa kontekstong eskatolohikal, ang “pagdating” ang pinakanatural na katumbas, habang binabanggit sa talababa ang literal na posibilidad na “presensiya.”
- source_word: ἰδοὺ
  choice: Tingnan ninyo
  rationale: Pinananatili ang puwersang pantawag-pansin sa kasalukuyan at marangal na Tagalog.
- source_word: γεωργὸς
  choice: magsasaka
  rationale: Karaniwang katawagan sa taong nagbubungkal at nag-aalaga ng pananim.
- source_word: ἐκδέχεται
  choice: hinihintay
  rationale: Ipinahahayag ang patuloy at umaasang paghihintay.
- source_word: τίμιον καρπὸν τῆς γῆς
  choice: mahalagang ani ng lupa
  rationale: Ang “ani” ay mas natural kaysa literal na “bunga” sa larawang pangsakahan, at ang “mahalaga” ay nagpapakita ng halaga at pagiging kanais-nais ng ani.
- source_word: ἐπ’ αὐτῷ
  choice: itong hinihintay
  rationale: Likas na inuugnay ang pagtitiyaga ng magsasaka sa ani, nang hindi pinipilit ang alanganing literal na pariralang “sa ibabaw nito.”
- source_word: πρόϊμον καὶ ὄψιμον
  choice: una at huling ulan
  rationale: Pinananatili ang tradisyonal na paghahati sa mga pana-panahong ulan; idinaragdag ang “ulan” bilang malinaw na ipinahihiwatig ng konteksto.
theological_decisions:
- issue: Saklaw ng ἀδελφοί
  choice: mga kapatid
  alternative: mga kapatid na lalaki; mga kapatid na lalaki at babae
  rationale: Bagaman panlalaking maramihan ang anyong Griyego, karaniwan itong tawag sa buong komunidad; ang Tagalog na “mga kapatid” ay tumpak at likas na hindi espesipiko sa kasarian.
- issue: Kahulugan ng παρουσία τοῦ κυρίου
  choice: pagdating ng Panginoon
  alternative: presensiya ng Panginoon; pagparito ng Panginoon
  rationale: Ang konteksto ay tumutukoy sa inaasahang pagdating sa hinaharap, ngunit pinananatili sa talababa ang leksikal na alternatibong “presensiya.”
- issue: Paksa ng λάβῃ sa magkakaibang tekstuwal na pagbasa
  choice: tumanggap ito ng una at huling ulan
  alternative: hanggang sa matanggap niya ang una at huling ani
  rationale: Sinusunod ang SBLGNT na λάβῃ, kung saan ang ipinahihiwatig na paksa ay malamang na ang ani o lupa na tumatanggap ng mga ulan; kinikilala sa talababa ang mahalagang tekstuwal na pagkakaiba.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “magtiyaga” at “matiyaga” upang mapanatili ang leksikal na pag-uulit sa Griyego. Ang “una at huling ulan” ay pinanatili bilang larawang pang-agrikultura at hindi pinalitan ng mga terminong nakatali sa isang partikular na rehiyon.
