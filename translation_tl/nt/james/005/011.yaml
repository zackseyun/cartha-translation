id: JAS.5.11
reference: James 5:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἰδοὺ μακαρίζομεν τοὺς ⸀ὑπομείναντας· τὴν ὑπομονὴν Ἰὼβ ἠκούσατε, καὶ τὸ τέλος κυρίου ⸀εἴδετε, ὅτι πολύσπλαγχνός ἐστιν ⸂ὁ κύριος⸃ καὶ οἰκτίρμων.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/011.yaml
  text: Behold, we count those who have endured as blessed. You have heard of Job’s endurance, and you have seen the Lord’s outcome, that the Lord is very compassionate and merciful.
translation:
  language: tl
  text: Narito, itinuturing nating mapalad ang mga nagtiis. Narinig ninyo ang pagtitiis ni Job, at nakita ninyo ang kinalabasan ng Panginoon[a], na ang Panginoon ay lubos na mahabagin at maawain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang wakas ng Panginoon.” Ang pariralang Griyego ay maaaring tumukoy sa pangwakas na kinalabasang ginawa o idinulot ng Panginoon sa karanasan ni Job; ang eksaktong ugnayan ng “Panginoon” sa “kinalabasan” ay hindi tahasang nililinaw.
    reason: Pinananatili ng pangunahing teksto ang kalabuan ng τὸ τέλος κυρίου at ibinibigay ng talababa ang likas na kontekstuwal na pagbasa nang hindi ito ipinipilit.
lexical_decisions:
- source_word: ἰδού
  choice: Tingnan ninyo
  rationale: Pinananatili ang panawagan na bigyang-pansin ang susunod na pahayag, sa natural at marangal na modernong Tagalog.
- source_word: μακαρίζομεν
  choice: itinuturing nating mapalad
  rationale: Tumpak na ipinahahayag ang pagkilala o pagtawag sa isang tao bilang mapalad, hindi ang pagkilos na pagpalain siya.
- source_word: ὑπομείναντας / ὑπομονήν
  choice: mga nagtiis / pagtitiis
  rationale: Pinananatili ang leksikal na ugnayan ng pandiwari at pangngalan at ang diwa ng matatag na pananatili sa gitna ng hirap.
- source_word: τὸ τέλος κυρίου
  choice: ang kinalabasan na ibinigay ng Panginoon
  rationale: Ang τέλος ay inilalarawan bilang pangwakas na kinalabasan, samantalang nililinaw ng pariralang 'na ibinigay' ang natural na pagbasa sa genitibong κυρίου nang hindi ito ginagawang 'layunin.'
- source_word: πολύσπλαγχνος
  choice: puspos ng habag
  rationale: Ipinahahayag ang matinding lalim at kasaganaan ng habag na nasa salitang Griyego.
- source_word: οἰκτίρμων
  choice: maawain
  rationale: Karaniwan, dignipikado, at malinaw na katumbas ng pagiging mahabagin o maawain.
theological_decisions:
- issue: Kahulugan ng τὸ τέλος κυρίου
  choice: ang kinalabasan na ibinigay ng Panginoon
  alternative: ang layunin ng Panginoon; ang wakas ng Panginoon
  rationale: Maaaring tumukoy ang τέλος sa wakas o kinalabasan. Sa konteksto ni Job, mas natural ang kinalabasang ipinagkaloob ng Panginoon. Iniiwasan ang 'layunin,' na maaaring magpasok ng intensiyong hindi tahasang sinasabi ng salita, at ang 'wakas ng Panginoon,' na malabong maunawaan sa Tagalog.
- issue: Batayan ng pahayag na mahabagin ang Panginoon
  choice: inuugnay ang katangian ng Panginoon sa kinalabasan ng karanasan ni Job
  alternative: gawing hiwalay na pangkalahatang pahayag lamang tungkol sa Diyos
  rationale: Pinananatili ang ὅτι bilang paliwanag sa nakita nilang kinalabasan, nang hindi nililimitahan ang habag ng Panginoon sa pangyayaring iyon lamang.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw sa karaniwang mambabasa ngunit nananatiling marangal. Ginamit ang 'Tingnan ninyo' bilang natural na pangmaramihang panawagan, at pinanatili ang pag-uulit ng 'Panginoon' para sa diin at katapatan sa teksto.
