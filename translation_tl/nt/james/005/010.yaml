  text: ὑπόδειγμα λάβετε, ⸀ἀδελφοί, τῆς κακοπαθίας καὶ τῆς μακροθυμίας τοὺς προφήτας, οἳ ἐλάλησαν ⸀ἐν τῷ ὀνόματι κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/010.yaml
  text: Brothers[a], take the prophets who spoke in the name of the Lord as an example of suffering and patience.
translation:
  language: tl
  text: Mga kapatid[a], gawin ninyong halimbawa ng pagdurusa at pagtitiyaga ang mga propetang nagsalita sa pangalan ng Panginoon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Panlalaking maramihan ang salitang Griyego na isinaling “mga kapatid,” ngunit sa kontekstong ito ay malamang na tumutukoy ito sa buong komunidad ng mga mananampalataya, kasama ang mga babae.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπόδειγμα λάβετε
  choice: gawin ninyong halimbawa
  rationale: Ang pariralang Griyego ay literal na ‘kumuha bilang halimbawa.’ Ang ‘gawin ninyong halimbawa’ ay likas na Tagalog at malinaw na naghihikayat na tularan ang mga propeta.
- source_word: ἀδελφοί
  choice: Mga kapatid
  rationale: Ang ‘mga kapatid’ ang likas na katawagang pangkongregasyon sa Tagalog. Bagaman panlalaking maramihan ang anyong Griyego, maaari nitong tukuyin ang buong sambayanan ng mga mananampalataya; nililinaw ito sa talababa.
- source_word: κακοπαθίας
  choice: pagtitiis sa hirap
  rationale: Tumutukoy ang κακοπαθία sa pagdanas o pagtitiis ng paghihirap. Iniiwasan ng parirala ang posibleng maling pagkaunawa na ang ‘pagdurusa’ mismo, sa halip na ang pagtitiis dito, ang dapat tularan.
- source_word: μακροθυμίας
  choice: mahabang pagtitimpi
  rationale: Ipinahahayag ng μακροθυμία ang matagal at mapagtiis na pagtitimpi. Mas tiyak ito kaysa sa pangkalahatang ‘tiyaga’ at pinananatili ang pagkakaiba nito sa κακοπαθία.
- source_word: τοὺς προφήτας
  choice: ang mga propeta
  rationale: Tuwirang katumbas at malinaw na tumutukoy sa mga taong inihaharap bilang halimbawa.
- source_word: ἐλάλησαν
  choice: nagsalita
  rationale: Pinananatili ang payak na kahulugan ng λαλέω nang hindi idinaragdag ang mas tiyak na diwang ‘nagpahayag’ o ‘nangaral.’
- source_word: ἐν τῷ ὀνόματι κυρίου
  choice: sa pangalan ng Panginoon
  rationale: Pinananatili ang karaniwang idyomang biblikal na nagpapahiwatig ng pagkatawan at awtoridad nang hindi nililimitahan sa isang paliwanag lamang.
theological_decisions:
- issue: Kasariang saklaw ng ἀδελφοί
  choice: ‘Mga kapatid’ sa pangunahing teksto, na may talababa tungkol sa anyong panlalaki at malamang na inklusibong saklaw
  alternative: ‘Mga kapatid na lalaki’ o ‘mga kapatid na lalaki at babae’
  rationale: Sa modernong Tagalog, ang ‘mga kapatid’ ay likas at hindi minamarkahan ang kasarian, samantalang ang anyong Griyego ay panlalaking maramihan ngunit karaniwang ginagamit sa pagtawag sa buong komunidad. Inilalahad ng talababa ang impormasyong morpolohikal nang hindi ginagawang asiwa ang teksto.
- issue: Kaugnayan ng mga propeta sa ὑπόδειγμα at sa dalawang genitive
  choice: Ang mga propeta ang gawing halimbawa sa pagtitiis sa hirap at mahabang pagtitimpi
  alternative: Ang mga propeta ay halimbawa ng hirap mismo at ng pagtitiis
  rationale: Ang mga propeta ang tuwirang layon ng λάβετε, at inilalarawan ng mga genitive kung saang bagay sila huwaran. Nililinaw ng Tagalog na ang matutularan ay ang kanilang pagtitiis habang dumaranas ng hirap.
- issue: Diwa ng ‘sa pangalan ng Panginoon’
  choice: Panatilihin ang idyomang ‘sa pangalan ng Panginoon’
  alternative: ‘sa kapangyarihan ng Panginoon’ o ‘para sa Panginoon’
  rationale: Maaaring saklawin ng parirala ang pagkatawan, awtoridad, at paglilingkod. Ang pagpapanatili sa idyoma ay hindi tahimik na pumipili ng iisang paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘gawin ninyong halimbawa’ bilang natural na pautos, ‘pagtitiis sa hirap’ upang ihayag ang aktibong pagharap sa pagdurusa, at ‘mahabang pagtitimpi’ upang mapanatili ang natatanging diwa ng μακροθυμία.
