id: JAS.5.12
reference: James 5:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Πρὸ πάντων δέ, ἀδελφοί μου, μὴ ὀμνύετε, μήτε τὸν οὐρανὸν μήτε τὴν γῆν μήτε ἄλλον τινὰ ὅρκον· ἤτω δὲ ὑμῶν τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ, ἵνα μὴ ⸂ὑπὸ κρίσιν⸃ πέσητε.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/012.yaml
  text: But above all[a], my brothers, do not swear, either by heaven or by earth or by any other oath. Instead, let your yes be yes and your no, no[b], so that you may not fall under judgment.
translation:
  language: tl
  text: Ngunit higit sa lahat, mga kapatid ko,[a] huwag kayong manumpa, maging sa langit, sa lupa, o sa anumang iba pang panunumpa. Sa halip, ang inyong “oo” ay maging oo, at ang inyong “hindi” ay maging hindi, upang hindi kayo mapasailalim sa paghatol.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay nasa anyong panlalaking maramihan ngunit malamang na tumutukoy sa buong komunidad ng mga mananampalataya, kapwa lalaki at babae.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “upang hindi kayo mapasailalim sa kahatulan.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Πρὸ πάντων
  choice: higit sa lahat
  rationale: Likas na pariralang Filipino na nagpapahayag ng pangunahing diin o kahalagahan, habang pinananatili ang puwersa ng Griyego.
- source_word: ἀδελφοί μου
  choice: mga kapatid ko
  rationale: Sa Filipino, ang “mga kapatid” ay likas na tumutukoy sa mga lalaki at babae, kaya naipahahayag nito kapwa ang literal na larawang pampamilya at ang malamang na pagtukoy sa buong komunidad ng mga mananampalataya.
- source_word: μὴ ὀμνύετε
  choice: huwag kayong manumpa
  rationale: Malinaw na tumutukoy sa panunumpa o paggawa ng sumpa, hindi sa pagmumura; ang anyong pautos ay nagpapahayag ng pangkalahatang pagbabawal.
- source_word: μήτε τὸν οὐρανὸν μήτε τὴν γῆν
  choice: hindi sa langit, ni sa lupa
  rationale: Pinananatili ang magkapares na pagbabawal at ang diwa ng panunumpa sa pamamagitan ng mga nilalang, sa natural na ayos ng Filipino.
- source_word: μήτε ἄλλον τινὰ ὅρκον
  choice: ni sa anumang iba pang panunumpa
  rationale: Ipinahahayag ang malawak na saklaw ng pagbabawal; inuugnay ng “sa” ang parirala sa pandiwang “manumpa.”
- source_word: ἤτω δὲ ὑμῶν τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ
  choice: Sa halip, ang inyong “oo” ay maging oo, at ang inyong “hindi” ay maging hindi
  rationale: Pinananatili ang maikli at kawikaang anyo ng Griyego at ang diin sa tuwiran at mapagkakatiwalaang pananalita.
- source_word: ἵνα μὴ ὑπὸ κρίσιν πέσητε
  choice: upang hindi kayo mapasailalim sa paghatol
  rationale: Ang “mapasailalim sa paghatol” ay natural na Filipino at malapit sa μεταporang ὑπὸ κρίσιν, nang hindi nililimitahan ang κρίσις sa mas tiyak na kahulugang kaparusahan o hatol na pagkondena.
theological_decisions:
- issue: Kung ang κρίσις ay isasaling “paghatol” o sa mas matinding diwang “kahatulan/pagkondena”
  choice: paghatol
  alternative: kahatulan
  rationale: Maaaring tumukoy ang κρίσις sa paghatol sa malawak na diwa at hindi nito sapilitang ipinahihiwatig ang pangwakas na pagkondena. Pinananatili ng “paghatol” ang lawak at tensiyong nasa teksto.
- issue: Kung ang ἀδελφοί ay tumutukoy lamang sa mga lalaki o sa buong komunidad
  choice: mga kapatid
  alternative: mga kapatid na lalaki
  rationale: Bagaman panlalaking maramihan ang anyong Griyego, karaniwan itong ginagamit bilang tawag sa buong komunidad. Ang “mga kapatid” sa Filipino ay likas na hindi nakatali sa kasarian at hindi kailangang dagdagan ng salitang wala sa teksto.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “manumpa” upang malinaw na ihiwalay ang panunumpa sa pagmumura. Ang bantas at mga panipi ay tumutulong na mapanatili ang maikli at kawikaang diin ng “oo” at “hindi.”
