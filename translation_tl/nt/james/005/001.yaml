    issue: Ang “Halikayo ngayon” ay hindi ang pinakanatural na katumbas ng Ἄγε νῦν sa kontekstong ito.
    rationale: Ang Griyego ay isang discourse marker/panimulang panawagan para sa matalim na pagsaway, hindi pangunahing utos na lumapit o pumunta. Ang “Halika ngayon” ay mas idiomatiko rito, kahit plural ang kasunod na kinakausap.
  - severity: low
    issue: Ang “mga kapahamakan” ay mas makitid at mas disaster-oriented kaysa ταλαιπωρίαις.
    rationale: Ang salita ay tumutukoy sa malulubhang paghihirap o kalunos-lunos na kalagayan. Ang “mga matitinding paghihirap” ay mas tuwiran at hindi nagdaragdag ng partikular na uri ng sakuna.
