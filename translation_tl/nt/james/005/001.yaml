base_translation:
  language: en
  yaml_path: translation/nt/james/005/001.yaml
  text: Come now[a], you rich, weep[b], wailing over the miseries that are coming upon you.
translation:
  language: tl
  text: 'Halika ngayon, kayong mayayaman: umiyak kayo at humagulgol dahil sa mga matitinding paghihirap na darating sa inyo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “humagulgol” ay tumutukoy sa malakas at hayagang panaghoy. Ang “mga matitinding paghihirap” ay maaari ring isaling “mga kalunos-lunos na kalagayan” o “mga kapahamakan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄγε νῦν
  choice: Halikayo ngayon
  rationale: Isang matalim na panawagan na tuwirang nagpapakilala sa pagsaway; natural ito sa makabagong Filipino at pinananatili ang lakas ng pahayag.
- source_word: οἱ πλούσιοι
  choice: kayong mayayaman
  rationale: Ang anyong nominative ay ginagamit bilang tuwirang pagtawag. Malinaw at natural sa Filipino ang “kayong mayayaman.”
- source_word: κλαύσατε
  choice: umiyak kayo
  rationale: Inilalarawan ng aorist imperative ang mariing panawagan sa hayagang pagdadalamhati.
- source_word: ὀλολύζοντες
  choice: humagulgol
  rationale: Ipinahihiwatig ng participle ang malakas at hayagang panaghoy; mas tiyak at natural ang “humagulgol” kaysa sa simpleng “manangis.”
- source_word: ἐπὶ ταῖς ταλαιπωρίαις
  choice: dahil sa mga kapahamakan
  rationale: Ang ἐπί na may dative ay nagpapakita ng dahilan o batayan ng pagdadalamhati. Saklaw ng “kapahamakan” ang matinding paghihirap o kalunos-lunos na kalagayang ipinahihiwatig ng ταλαιπωρία.
- source_word: ὑμῶν ταῖς ἐπερχομέναις
  choice: darating sa inyo
  rationale: Ang participle ay tumutukoy sa mga kapahamakang papalapit at sasapit sa mga kinakausap; hindi nito labis na itinatakda kung gaano kalapit ang pagdating.
theological_decisions:
- issue: Tono at tinutukoy ng tuwirang panawagan sa mayayaman
  choice: Isang makahulang pagsaway sa mayayamang haharap sa paparating na kapahamakan o paghatol, nang hindi tinutukoy kung sila ay mananampalataya o hindi.
  alternative: Partikular na pagsaway sa mapang-aping di-mananampalatayang may-ari ng lupa, o babala sa mayayamang kabilang sa pamayanang Cristiano.
  rationale: Tuwirang kinakausap ng talata ang “mga mayayaman” at ipinahahayag ang sasapit na kapahamakan, ngunit hindi nito mismo nililinaw ang kanilang kalagayang panrelihiyon. Pinananatili ng salin ang lawak at tensiyon ng teksto.
translation_notes:
  register: Makabago, marangal, at tuwiran ang Filipino. Pinananatili ang matalim at makahulang tono ng pangungusap nang hindi gumagamit ng labis na arkaikong bokabularyo.
