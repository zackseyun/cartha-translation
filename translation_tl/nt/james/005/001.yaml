  source_fidelity: Ang “Halikayo ngayon” ay maaaring magpahiwatig ng literal na paglapit at hindi kasing-idiomatiko ng Griyegong panimulang panawagan (Ἄγε νῦν), na nagpapakilala ng mariin at makahulang pagsaway. Ang “mga kapahamakan” ay posible, ngunit mas madaling mabasa bilang mga sakuna kaysa sa malulubha at miserable/wretched na kalagayang tinutukoy ng ταλαιπωρίαις.
  naturalness: Mas natural at matalim sa modernong Filipino ang “Halika ngayon, kayong mayayaman,” bilang nakapirming idiomatikong pambungad sa isang tuwirang pagsaway. Ang “Umiyak kayo at humagulgol” ay malinaw at angkop sa marangal na rehistro.
  terminology: Pinananatili ang “mayayaman,” “umiyak,” at “humagulgol.” Pinalitan ang “kapahamakan” ng “matitinding paghihirap” upang masaklaw ang diin ng ταλαιπωρίαις nang hindi nagmumungkahing sakuna lamang o tahasang nililimitahan ang tinutukoy na hatol.
  issues:
