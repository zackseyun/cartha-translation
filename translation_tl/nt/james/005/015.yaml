  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἡ εὐχὴ τῆς πίστεως σώσει τὸν κάμνοντα, καὶ ἐγερεῖ αὐτὸν ὁ κύριος· κἂν ἁμαρτίας ᾖ πεποιηκώς, ἀφεθήσεται αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/015.yaml
  text: And the prayer of faith will save the one who is sick[a], and the Lord will raise him up. And if he has committed sins[c][b], he will be forgiven.
translation:
  language: tl
  text: At ililigtas ng panalanging may pananampalataya[b] ang maysakit[a], at ibabangon siya ng Panginoon. At kung nakagawa siya ng mga kasalanan[c], patatawarin siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “pagagalingin” o “gagawing magaling”; sa Griyego, “ililigtas.”
    reason: lexical_alternative
  - marker: b
    text: Ang parirala ay maaari ring unawain bilang “panalanging may pagtitiwala” o, bagaman hindi gaanong malamang dito, “panalanging may katapatan.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin na “kahit nakagawa siya ng mga kasalanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχὴ
  choice: panalangin
  rationale: Sa konteksto ng mga matatandang namumuno na nananalangin para sa maysakit (tal. 14), ang εὐχή ay tumutukoy sa panalangin, hindi sa panata.
- source_word: πίστεως
  choice: may pananampalataya
  rationale: Ipinahihiwatig ng genitibong πίστεως na ang panalangin ay kinakikitaan ng pananampalataya o pagtitiwala sa Diyos. Mas natural ito sa modernong Tagalog kaysa sa literal na “ng pananampalataya,” habang pinananatili ang ugnayan ng dalawang salita.
- source_word: σώσει
  choice: ililigtas
  rationale: Ang σῴζω ay karaniwang nangangahulugang magligtas, ngunit maaari ring tumukoy sa pagpapagaling o pagpapanumbalik sa konteksto ng karamdaman. Pinananatili ng “ililigtas” ang lawak ng salitang Griyego.
- source_word: τὸν κάμνοντα
  choice: ang maysakit
  rationale: Bagaman maaaring mangahulugan ang κάμνω ng mapagod o manghina, malinaw na karamdaman ang agarang konteksto ng pagpapahid ng langis, pananalangin, at pagbangon.
- source_word: ἐγερεῖ
  choice: ibabangon
  rationale: Pinananatili ng “ibabangon” ang larawan ng ἐγείρω at umaangkop sa pagpapanumbalik ng isang taong nakaratay, nang hindi inaalis ang mas malawak na pahiwatig ng pagkilos ng Diyos.
- source_word: ὁ κύριος
  choice: ang Panginoon
  rationale: Ang “Panginoon” ang likas at nakaugaliang salin ng κύριος sa ganitong kontekstong tumutukoy sa banal na kumikilos.
- source_word: κἂν ἁμαρτίας ᾖ πεποιηκώς
  choice: kung nakagawa siya ng mga kasalanan
  rationale: Malinaw na inilalahad ng salin ang kondisyong nasa Griyego. Ang posibleng pahintulot na diwa na “kahit” ay inilalagay sa talababa.
- source_word: ἀφεθήσεται αὐτῷ
  choice: patatawarin siya
  rationale: Natural sa Tagalog ang personal na pasibong anyong ito. Ipinahihiwatig nito na ang kaniyang mga kasalanan ay patatawarin, habang pinananatiling di-binabanggit ang gumagawa ng pagpapatawad gaya ng pasibo sa Griyego.
theological_decisions:
- issue: Kung ang σώσει ay dapat limitahan sa pisikal na pagpapagaling
  choice: “Ililigtas” sa pangunahing teksto, na may talababa tungkol sa pagpapagaling
  alternative: “Pagagalingin” o “pagiginhawahin”
  rationale: Karamdaman ang agarang konteksto, ngunit σῴζω ang ginamit sa halip na isang makitid na terminong medikal. Pinananatili ng “ililigtas” ang leksikal at teolohikal na lawak nito.
- issue: Kung nangangako ang talata ng awtomatikong paggaling sa bawat panalangin
  choice: Tuwirang pinanatili ang mga pandiwang panghinaharap nang walang idinagdag na kondisyon o pagpapalabis
  alternative: “Maaaring pagalingin” o “tiyak na pagagalingin sa bawat pagkakataon”
  rationale: Hindi dapat pahinain ang tuwirang pahayag ng Griyego o dagdagan ito ng isang doktrina ng garantisadong paggaling na hindi tahasang sinasabi ng talata.
- issue: Kung ang bawat karamdaman ay bunga ng personal na kasalanan
  choice: 'Pinanatiling kondisyonal ang sugnay: “kung nakagawa siya ng mga kasalanan”'
  alternative: Ipahiwatig na lahat ng karamdaman ay sanhi ng personal na kasalanan
  rationale: Inilalahad ng Griyego ang pagkakasala bilang isang posibilidad, hindi bilang pangkalahatang sanhi ng lahat ng karamdaman.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “maysakit” at “patatawarin siya” para sa malinaw na karaniwang pananalita; pinanatili naman ang “ililigtas” at “ibabangon” upang huwag paliitin ang sadyang malawak na pananalita at larawan ng Griyego.
