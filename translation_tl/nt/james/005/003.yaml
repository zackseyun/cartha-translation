  text: ὁ χρυσὸς ὑμῶν καὶ ὁ ἄργυρος κατίωται, καὶ ὁ ἰὸς αὐτῶν εἰς μαρτύριον ὑμῖν ἔσται καὶ φάγεται τὰς σάρκας ὑμῶν· ὡς πῦρ ἐθησαυρίσατε ἐν ἐσχάταις ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/003.yaml
  text: Your gold and silver have rusted[a], and their corrosion will be evidence against you and will eat your flesh like fire[b]. You have stored up treasure in the last days.
translation:
  language: tl
  text: Ang inyong ginto at pilak ay nangalawang na[a], at ang kalawang ng mga ito ay magiging katibayan laban sa inyo at, gaya ng apoy, kakainin nito ang inyong laman.[b] Nag-imbak kayo ng kayamanan sa mga huling araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ay kinakalawang na.” Ang pandiwang Griyego ay nasa perpektong anyo at maaaring tumukoy nang mas malawak sa pagkasira o pagkalawang ng metal, kahit hindi karaniwang literal na kinakalawang ang ginto at pilak.
    reason: lexical_alternative
  - marker: b
    text: O, “at kakainin nito ang inyong laman. Nag-imbak kayo ng kayamanan na parang apoy sa mga huling araw.” Maaaring iugnay ang “na parang apoy” sa huling sugnay sa halip na sa “kakainin nito ang inyong laman.”
    reason: alternative_reading
lexical_decisions:
- source_word: κατίωται
  choice: ay kinakalawang na
  rationale: Ipinahahayag ng perpektong panahunan ang kasalukuyang kalagayang bunga ng naunang pagkasira. Bagaman hindi literal na kinakalawang ang ginto at pilak sa karaniwang teknikal na diwa, natural at malinaw sa Tagalog ang pariralang ito bilang larawan ng pagkasira ng kayamanan.
- source_word: ἰὸς
  choice: kalawang
  rationale: Sa konteksto ng mga metal, tumutukoy ito sa produkto o epekto ng pagkasira ng metal. Pinananatili ng “kalawang” ang kongkretong larawan at ang kaugnayan nito sa naunang pandiwa.
- source_word: εἰς μαρτύριον ὑμῖν
  choice: magiging katibayan laban sa inyo
  rationale: Likas sa modernong Tagalog ang “katibayan laban sa inyo” at malinaw nitong naihahatid ang pormal o panghukumang diwa ng parirala.
- source_word: φάγεται τὰς σάρκας ὑμῶν
  choice: kakain sa inyong laman
  rationale: Pinananatili nito ang matindi at kongkretong larawan ng Griyego sa halip na palambutin bilang “tutupok.”
- source_word: σάρκας
  choice: laman
  rationale: Literal na larawan ng pagkawasak at paghuhukom ang gamit dito; hindi ito tumutukoy sa isang teolohikal na konsepto ng makasalanang kalikasan.
- source_word: ὡς πῦρ
  choice: na parang apoy
  rationale: Pinakamalikas itong iugnay sa naunang pandiwang “kakain,” kaya ang kalawang ay inilalarawang naninira na parang apoy.
- source_word: ἐθησαυρίσατε
  choice: Nag-imbak kayo ng kayamanan
  rationale: Inihahayag nito kapwa ang pag-iimbak at ang leksikal na diwa ng kayamanan nang hindi idinaragdag ang higit na mapanghusgang kulay ng “nagkamal.”
- source_word: ἐν ἐσχάταις ἡμέραις
  choice: sa mga huling araw
  rationale: Direkta at kinikilalang salin ito ng karaniwang pariralang eskatolohikal, nang hindi idinaragdag ang “mga huling araw na ito.”
theological_decisions:
- issue: Kaugnayan ng ὡς πῦρ sa pangungusap
  choice: 'Iniugnay sa naunang sugnay: ang kalawang ay “kakain sa inyong laman na parang apoy.”'
  alternative: 'Iniugnay sa kasunod na sugnay: “Nag-imbak kayo ng kayamanan na parang apoy sa mga huling araw.”'
  rationale: Mas pinapaboran ng agarang sintaks at malinaw na diwa ang pag-uugnay nito sa φάγεται. Gayunman, tunay na posible sa pagbantas at sintaks ang alternatibong pagbasa, kaya itinala ito sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang matinding imahen ng kalawang, laman, at apoy, pati ang tunay na sintaktikong kalabuan ng ὡς πῦρ sa talababa.
