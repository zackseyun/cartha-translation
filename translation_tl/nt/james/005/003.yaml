  to: Ang inyong ginto at pilak ay nangalawang na[a], at ang kalawang ng mga ito ay magiging katibayan laban sa inyo at, gaya ng apoy, kakainin nito ang inyong laman.[b] Nag-imbak kayo ng kayamanan sa mga huling araw.
