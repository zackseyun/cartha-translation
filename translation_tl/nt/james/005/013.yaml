base_translation:
  language: en
  yaml_path: translation/nt/james/005/013.yaml
  text: Is anyone among you suffering? Let him pray[a]. Is anyone cheerful? Let him sing praise.
translation:
  language: tl
  text: May dumaranas ba ng hirap sa inyo? Manalangin siya. May mabuti ba ang loob? Umawit siya ng papuri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ding “Umawit siya ng mga salmo”; ang pandiwang Griyego ay maaaring tumukoy nang partikular sa pag-awit ng mga salmo o, sa mas malawak na diwa, sa pag-awit ng papuri.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κακοπαθεῖ
  choice: dumaranas ng hirap
  rationale: Saklaw ng κακοπαθέω ang pagdanas ng paghihirap o mabigat na kalagayan. Hindi ito nililimitahan sa sakit, pag-uusig, o isang partikular na uri ng pagdurusa.
- source_word: τις
  choice: may … ba / mayroon bang
  rationale: Ang τις ay di-tiyak at pang-isahan. Likas sa modernong Tagalog ang tanong na gumagamit ng “may” o “mayroon,” at nananatiling pangkalahatan ang tinutukoy.
- source_word: ἐν ὑμῖν
  choice: sa inyo
  rationale: Ipinahihiwatig nito na ang taong tinutukoy ay kabilang sa pamayanang kinakausap. Ang “sa inyo” ang pinakanatural na katumbas sa Tagalog.
- source_word: προσευχέσθω
  choice: Manalangin siya
  rationale: Pinananatili nito ang pang-isahang pautos o panghikayat ng pandiwa nang natural at marangal sa Tagalog.
- source_word: εὐθυμεῖ
  choice: masigla ang loob
  rationale: Ang εὐθυμέω ay tumutukoy sa pagiging nasa mabuting kalagayan ng kalooban o mabuting espiritu. Mas tiyak ang “masigla ang loob” kaysa sa simpleng “masaya.”
- source_word: ψαλλέτω
  choice: Umawit siya ng papuri
  rationale: Sa kontekstong ito, tumutukoy ang ψάλλω sa pag-awit bilang papuri sa Diyos. Malinaw ito sa karaniwang mambabasa, habang inilalagay sa talababa ang posibleng mas makitid na diwang pag-awit ng mga salmo.
theological_decisions:
- issue: Pang-isahang anyo ng pangkalahatang panghikayat
  choice: Panatilihin ang pang-isahan sa “Manalangin siya” at “Umawit siya”
  alternative: Gawing maramihan ang mga panghikayat
  rationale: Ang Griyego ay gumagamit ng di-tiyak na panghalip at mga pandiwang pautos na pang-isahan. Ang “siya” sa Tagalog ay hindi nakatali sa kasarian at likas na nagpapanatili sa pang-isahang kinatawang diwa.
- issue: Kahulugan ng ψαλλέτω
  choice: Umawit siya ng papuri
  alternative: Umawit siya ng mga salmo
  rationale: Maaaring tumukoy ang pandiwa sa pag-awit ng mga salmo o, sa mas malawak na diwa, sa pag-awit ng papuri. Pinili sa pangunahing teksto ang mas malawak na diwang angkop sa konteksto nang hindi ginagawang tiyak na liturhikal na utos ang pahayag; pinanatili sa talababa ang leksikal na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “masigla ang loob” upang maipahayag ang kalagayan ng kalooban, at ang kasariang-neutral na “siya” upang mapanatili ang pang-isahang anyo ng Griyego. Inilipat ang talababa sa “papuri,” na siyang salitang aktuwal na tinutukoy ng leksikal na alternatibo.
