    issue: Di-likas at bahagyang maling aspektong causative ang “pinatubo ng lupa ang bunga nito.”
    rationale: Ang ἐβλάστησεν ay tumutukoy sa pagsibol o pagbubunga ng lupa. Bagaman maaaring ipahayag sa Ingles ang ‘produced,’ ang Tagalog na “pinatubo” ay karaniwang nagpapahiwatig na may ibang bagay na pinalago ng lupa at hindi kasinglinaw na ang lupa mismo ang nagbunga.
  - severity: low
