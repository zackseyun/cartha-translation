  naturalness: Likas ang unang bahagi. Mas natural at malinaw sa modernong Tagalog ang “ang lupa ay nagbunga” kaysa “pinatubo ng lupa ang bunga nito.” Ang “kalangitan” ay mas tuwiran para sa nakikitang sky sa kontekstong pangpanahon.
  terminology: Ang “muli,” “nanalangin,” “ulan,” at “lupa” ay angkop. Ang “bunga nito” ay maaaring manatili sa literal na antas, ngunit ang “nagbunga” ay sapat at likas na kumakatawan sa agricultural καρπός nang walang di-likas na causative construction.
  issues:
