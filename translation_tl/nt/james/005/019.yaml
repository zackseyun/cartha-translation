  text: My brothers[a], if anyone among you wanders from the truth and someone turns him back[c][b],
translation:
  language: tl
  text: Mga kapatid ko[a], kung ang sinuman sa inyo ay maligaw mula sa katotohanan[b] at may magpabalik sa kanya[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay nasa anyong panlalaking maramihan, ngunit maaari itong tumukoy sa buong komunidad—mga kapatid na lalaki at babae.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mailigaw palayo sa katotohanan,” “lumihis mula sa katotohanan,” o “madaya at lumayo sa katotohanan.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “may magpanumbalik sa kanya” o “may magdala sa kanya pabalik.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί μου
  choice: Mga kapatid ko
  rationale: Ang “mga kapatid” ang likas at marangal na tawag sa Filipino para sa πληθυντικός na ἀδελφοί. Hindi nito kailangang ipakita ang kasariang panlalaki sa anyo ng salita, ngunit maaari itong tumukoy sa buong kapulungan; pinananatili ng “ko” ang μου.
- source_word: ἐάν τις ἐν ὑμῖν
  choice: kung ang sinuman sa inyo
  rationale: Pinananatili ng “kung” ang kondisyon at ng “sinuman” ang di-tiyak at isahang diwa ng τις.
- source_word: πλανηθῇ
  choice: ay maligaw
  rationale: Likas sa Filipino ang “maligaw” para sa paglihis o pagkakalayo sa wastong landas. Hindi nito sapilitang nilulutas kung kusang lumihis ang tao o nailigaw siya ng iba, kaya napapanatili ang saklaw ng pasibong anyong Griyego.
- source_word: ἀπὸ τῆς ἀληθείας
  choice: mula sa katotohanan
  rationale: Tuwirang inililipat ang pariralang may ἀπό nang hindi nililimitahan ang “katotohanan” sa isang mas tiyak na doktrinal na kahulugan.
- source_word: καὶ ἐπιστρέψῃ τις αὐτόν
  choice: at may magpabalik sa kanya
  rationale: Ang “magpabalik” ay malinaw na nagpapahayag na may ibang taong kumikilos upang siya ay bumalik. Pinananatili ng “may” ang di-tiyak na τις at ng “sa kanya” ang isahang tinutukoy ng αὐτόν.
theological_decisions:
- issue: Saklaw ng ἀδελφοί bilang tawag sa komunidad
  choice: Mga kapatid ko
  alternative: Mga kapatid kong lalaki
  rationale: Sa modernong Filipino, ang “mga kapatid” ay karaniwang katawagan sa buong komunidad at hindi likas na nililimitahan sa mga lalaki. Ang talababa ay nagpapaliwanag sa panlalaking anyo ng Griyego nang hindi nagdaragdag ng denominasyonal na pakahulugan.
- issue: Diwa ng pasibong πλανηθῇ
  choice: maligaw
  alternative: mailigaw
  rationale: Maaaring tumukoy ang anyo sa pagkaligaw, paglihis, o pagkadaya. Ang “maligaw” ay nagpapanatili ng kapaki-pakinabang na kalabuan sa halip na ipilit na may panlabas na manlilinlang.
- issue: Paraan ng pagpapanumbalik sa naligaw
  choice: may magpabalik sa kanya
  alternative: may magpanumbalik sa kanya
  rationale: Ipinakikita ng salin na may isang taong nagbabalik sa naligaw, ngunit hindi nito tinutukoy ang paraan, awtoridad, o teolohikal na mekanismo ng pagbabalik.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang “mga kapatid” bilang karaniwang katawagan sa komunidad, “maligaw” upang mapanatili ang larawan at kalabuan ng Griyego, at “magpabalik” bilang malinaw ngunit hindi labis na teknikal na katumbas ng ἐπιστρέφω. Pinanatili ang kuwit sa dulo dahil nagpapatuloy ang pangungusap sa talata 20.
