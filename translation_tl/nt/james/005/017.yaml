  text: Ἠλίας ἄνθρωπος ἦν ὁμοιοπαθὴς ἡμῖν, καὶ προσευχῇ προσηύξατο τοῦ μὴ βρέξαι, καὶ οὐκ ἔβρεξεν ἐπὶ τῆς γῆς ἐνιαυτοὺς τρεῖς καὶ μῆνας ἕξ·
base_translation:
  language: en
  yaml_path: translation/nt/james/005/017.yaml
  text: Elijah was a man with a nature like ours[a], and he prayed earnestly that it would not rain, and it did not rain on the land for three years and six months.
translation:
  language: tl
  text: Si Elias ay isang taong tulad din natin[a]. Taimtim siyang nanalangin na huwag umulan, at hindi umulan sa lupain sa loob ng tatlong taon at anim na buwan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “isang taong may kalikasang tulad ng sa atin”; maaari ring tumukoy sa pagkakaroon ng mga damdamin o hilig na tulad ng sa atin.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠλίας
  choice: Elias
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa Tagalog para sa propetang si Elijah.
- source_word: ἄνθρωπος
  choice: isang tao
  rationale: Tinutukoy si Elias bilang isang karaniwang taong mortal; natural at tumpak sa kasarian ang “isang tao” sa Tagalog.
- source_word: ὁμοιοπαθὴς ἡμῖν
  choice: tulad din natin
  rationale: Malawak na naipahahayag nito ang pakikibahagi ni Elias sa kalagayan at mga karanasan ng tao nang hindi nililimitahan ang kahulugan sa damdamin o pagnanasa lamang.
- source_word: προσευχῇ προσηύξατο
  choice: taimtim siyang nanalangin
  rationale: Ang magkaugnay na pangngalan at pandiwa sa Griyego ay nagbibigay-diin sa pananalangin; natural na naihahatid ito ng “taimtim na nanalangin.”
- source_word: τοῦ μὴ βρέξαι
  choice: na huwag umulan
  rationale: Idyomatiko itong nagpapahayag ng nilalaman o hinihiling sa panalangin.
- source_word: οὐκ ἔβρεξεν
  choice: hindi nga umulan
  rationale: Ang “nga” ay natural na nag-uugnay sa kinalabasan sa taimtim na kahilingan nang hindi nagdaragdag ng bagong sanhi.
- source_word: ἐπὶ τῆς γῆς
  choice: sa lupain
  rationale: Ang “lupain” ay angkop sa tagtuyot sa salaysay tungkol kay Elias at iniiwasan ang di-kinakailangang pandaigdigang pakahulugan ng “buong mundo.”
- source_word: ἐνιαυτοὺς τρεῖς καὶ μῆνας ἕξ
  choice: sa loob ng tatlong taon at anim na buwan
  rationale: Malinaw at natural nitong ipinapahayag ang tagal ng hindi pag-ulan.
theological_decisions:
- issue: Kahulugan ng ὁμοιοπαθὴς kaugnay ng pagiging tao ni Elias
  choice: Si Elias ay isang taong tulad din natin.
  alternative: Si Elias ay may mga damdamin o pagnanasang tulad ng sa atin.
  rationale: Binibigyang-diin ng konteksto na si Elias ay kapwa-tao ng mga mambabasa, kaya nakapagpapalakas ng loob ang halimbawa ng kanyang panalangin. Pinananatili ng salin ang malawak na kahulugan at hindi ito ipinipirmi sa emosyon o pagnanasa lamang.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Pinili ang “Elias” bilang nakaugaliang anyo ng biblikal na pangalan sa Tagalog; iniwasan ang arkaikong pananalita at ang sobrang teknikal na “kalikasan” sa pangunahing teksto, ngunit itinabi ito bilang leksikal na alternatibo sa talababa.
