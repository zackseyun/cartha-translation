  text: ἐτρυφήσατε ἐπὶ τῆς γῆς καὶ ἐσπαταλήσατε, ἐθρέψατε τὰς καρδίας ⸀ὑμῶν ἐν ἡμέρᾳ σφαγῆς.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/005.yaml
  text: You have lived in luxury on the earth and indulged yourselves[d][c][b][a]; you have fattened your hearts in a day of slaughter.
translation:
  language: tl
  text: Namuhay kayo nang marangya[a] sa lupa at nagpakasasa[b]. Pinataba ninyo ang inyong mga puso sa araw ng pagkatay[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “namuhay kayo sa layaw.”
    reason: lexical_alternative
  - marker: b
    text: O “namuhay kayo nang maluho at mapagpalayaw sa sarili.”
    reason: lexical_alternative
  - marker: c
    text: Ang larawan ay gaya ng mga hayop na pinatataba bago katayin, at malamang na nagpapahiwatig ng nalalapit na paghuhukom.
    reason: cultural_note
  - marker: d
    text: O “para sa araw ng pagkatay.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐτρυφήσατε
  choice: Namuhay kayo sa karangyaan
  rationale: Ipinahahayag ng aorist ang naging takbo ng pamumuhay ng mga mayaman. Ang “karangyaan” ay likas at makabagong salin na nagdadala ng diwa ng marangya at mapagpalayaw na pamumuhay, hindi ng payak na kasiyahan lamang.
- source_word: ἐπὶ τῆς γῆς
  choice: dito sa lupa
  rationale: Ang γῆ ay maaaring “lupa” o “daigdig.” Sa kontekstong ito, ang “dito sa lupa” ay natural sa Filipino at pinananatili ang kaibahan sa makalangit na pananaw na ipinahihiwatig ng pagsaway.
- source_word: ἐσπαταλήσατε
  choice: nagpakasasa
  rationale: Ang σπαταλάω ay tumutukoy sa labis at mapagpalayaw na pagpapakasunod sa sariling layaw. Malinaw at matindi ang “nagpakasasa” nang hindi gumagamit ng lipas o labis na teknikal na pananalita.
- source_word: ἐθρέψατε
  choice: Pinataba ninyo
  rationale: Bagaman maaaring mangahulugang “pinakain” o “inalagaan,” hinihingi ng larawan ng pagkatay ang ironikong diwa ng pagpapataba ng hayop bago katayin.
- source_word: τὰς καρδίας ὑμῶν
  choice: ang inyong mga puso
  rationale: Pinananatili nito ang tahasang metapora at biblikal na gamit ng “puso” bilang sentro ng pagnanasa at panloob na buhay, sa halip na gawing paliwanag lamang na “ang inyong sarili.”
- source_word: ἐν ἡμέρᾳ σφαγῆς
  choice: sa araw ng pagkatay
  rationale: Malapit ito sa ἐν at nagpapanatili sa matinding larawan. Ang “pagkatay” ay angkop sa larawan ng mga hayop na pinataba, nang hindi tahasang idinaragdag sa pangunahing teksto na ito ay paghuhukom.
theological_decisions:
- issue: Metaporikal na diwa ng “araw ng pagkatay”
  choice: Panatilihin ang larawan ng nalalapit na pagkatay nang hindi tahasang tinutukoy sa pangunahing teksto kung sino ang kumikilos o kung anong tiyak na pangyayari ang tinutukoy.
  alternative: Isalin bilang tahasang “araw ng paghuhukom ng Diyos” o iugnay ito sa pagpatay sa mga inosente.
  rationale: Malakas ang pahiwatig ng paghuhukom, ngunit hindi iyon tahasang pinangalanan ng Griyego. Ang pagpapanatili sa metapora ay nag-iingat sa tunay na tensiyong teolohikal at hindi nagpapasok ng higit na katiyakan kaysa sa teksto.
- issue: Ugnayan ng pagpapataba at araw ng pagkatay
  choice: Gamitin ang “sa araw ng pagkatay,” na sumusunod sa karaniwang kahulugan ng ἐν.
  alternative: “para sa araw ng pagkatay,” na ginagawang mas tahasan ang layunin o kahihinatnan.
  rationale: Maaaring ipahiwatig ng konteksto ang pagpapataba para sa pagkatay, ngunit ang ἐν ay literal na “sa.” Dapat manatili sa talababa ang mas interpretatibong pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nagpakasasa” upang maipakita ang tindi ng pagsaway, at ang “pagkatay” upang mapanatili ang kongkretong larawan ng σφαγή. Inayos ang mga marker ayon sa natural na kaugnayan ng bawat talababa sa parirala.
