id: JAS.5.16
reference: James 5:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐξομολογεῖσθε ⸀οὖν ἀλλήλοις ⸂τὰς ἁμαρτίας⸃ καὶ ⸀εὔχεσθε ὑπὲρ ἀλλήλων, ὅπως ἰαθῆτε. πολὺ ἰσχύει δέησις δικαίου ἐνεργουμένη.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/016.yaml
  text: Therefore[a], confess your sins to one another and pray for one another, so that you may be healed. The prayer of a righteous person is very powerful as it is at work.
translation:
  language: tl
  text: Kaya nga, ipagtapat ninyo sa isa't isa ang inyong mga kasalanan at ipanalangin ang isa't isa, upang kayo ay gumaling. May malaking bisa ang panalangin ng taong matuwid kapag ito'y kumikilos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Malaki ang bisa ng pagsusumamo ng taong matuwid kapag ito'y kumikilos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξομολογεῖσθε
  choice: ipagtapat
  rationale: Ipinahahayag nito ang hayagang pagkilala sa kasalanan sa kapwa, nang hindi ipinapalagay ang isang pormal o sakramental na kaayusan.
- source_word: οὖν
  choice: Kaya nga
  rationale: Likas na ipinakikita sa Filipino ang kongklusyon mula sa naunang usapan tungkol sa panalangin, kasalanan, at pagpapanumbalik.
- source_word: ἀλλήλοις
  choice: sa isa't isa
  rationale: Malinaw na pinananatili ang tumbasang o mutual na diwa ng panghalip.
- source_word: τὰς ἁμαρτίας
  choice: ang inyong mga kasalanan
  rationale: Likas na idinaragdag sa Filipino ang 'inyong' dahil sa utos na tumbasan; tuwirang katumbas ng ἁμαρτίας ang 'mga kasalanan.'
- source_word: εὔχεσθε
  choice: ipanalangin
  rationale: Sa pagkakabuo nitong may ὑπὲρ ἀλλήλων, natural na Filipino ang 'ipanalangin ang isa't isa' at malinaw ang diwa ng pamamagitan.
- source_word: ὑπὲρ ἀλλήλων
  choice: ang isa't isa
  rationale: Kasama ng pandiwang 'ipanalangin,' ipinahahayag nito ang pananalangin para sa kapakanan ng bawat isa.
- source_word: ὅπως
  choice: upang
  rationale: Pinananatili ang layunin o inaasahang bunga ng naunang mga utos.
- source_word: ἰαθῆτε
  choice: kayo ay gumaling
  rationale: Malawak ang 'gumaling' at hindi nililimitahan ang tinutukoy sa pisikal o espirituwal na paggaling lamang.
- source_word: πολὺ ἰσχύει
  choice: Napakalakas
  rationale: Natural at tuwirang ipinahahayag ang malaking bisa o puwersa nang hindi paunang tinutukoy ang partikular na bunga.
- source_word: δέησις
  choice: panalangin
  rationale: Pinakamalinaw na pangkalahatang katawagan sa modernong Filipino; maaaring mangahulugan nang mas tiyak na pagsusumamo.
- source_word: δικαίου
  choice: ng taong matuwid
  rationale: Ang pang-uri ay ginagamit bilang pangngalan at pangkalahatan ang tinutukoy, hindi lalaki lamang.
- source_word: ἐνεργουμένη
  choice: kapag ito ay kumikilos
  rationale: Pinananatili ang mahirap at bahagyang malabong participial na diwa ng panalanging aktibong gumagawa o umiiral ang bisa, nang hindi ito tahasang ginagawang pasibo.
theological_decisions:
- issue: Kung ang talata ay nag-uutos ng sakramental na pangungumpisal sa klero o ng tumbasang pagtatapat ng mga mananampalataya
  choice: tumbasang pagtatapat sa isa't isa
  alternative: pagtatapat na pinamamagitan ng ordinadong klero
  rationale: Tahasang ipinakikita ng ἀλλήλοις ang mutualidad sa loob ng pamayanang kinakausap. Hindi dinaragdagan ng salin ang teksto ng isang partikular na kaayusang eklesiyastikal.
- issue: Saklaw ng paggaling sa ἰαθῆτε
  choice: gumaling, na pinananatiling malawak ang kahulugan
  alternative: pisikal lamang o espirituwal lamang na paggaling
  rationale: Mahalaga sa konteksto ang pisikal na karamdaman, ngunit naroon din ang kasalanan. Hindi nilulutas ng salin ang tensiyong ito sa pamamagitan ng pagpapakitid.
- issue: Kasarian sa δικαίου
  choice: taong matuwid
  alternative: matuwid na lalaki
  rationale: Bagaman panlalaki ang anyong Griyego, pangkalahatan ang gamit nito sa ganitong kasabihan; ang 'tao' ang tumpak na natural na salin.
- issue: Diwa ng ἐνεργουμένη
  choice: kapag ito ay kumikilos
  alternative: kapag mabisa / kapag pinakikilos
  rationale: Maaaring maunawaan ang anyo bilang middle o passive. Pinananatili ng pangunahing salin ang operative na diwa, at inilalagay sa talababa ang mas idiomatikong alternatibo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang 'isa't isa' para sa malinaw na mutualidad, 'ipagtapat' para sa hayagang pagkilala sa kasalanan, at 'gumaling' upang huwag paliitin ang saklaw. Inilagay ang marker [a] pagkatapos ng pangungusap na tinutukoy ng alternatibong salin.
