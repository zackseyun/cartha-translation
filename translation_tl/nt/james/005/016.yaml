  to: Kaya nga, ipagtapat ninyo sa isa't isa ang inyong mga kasalanan at ipanalangin ang isa't isa, upang kayo ay gumaling. May malaking bisa ang panalangin ng taong matuwid kapag ito'y kumikilos.[a]
