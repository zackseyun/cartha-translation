  source_fidelity: Tumpak na naipapahayag ng draft ang hinuha ng οὖν, ang magkapalit na pagtatapat at pananalangin (ἀλλήλοις), at ang malawak na saklaw ng ἰαθῆτε sa “gumaling.” Hindi ito nagdaragdag ng sakramental o ibang makitid na pagpapakahulugan. Gayunman, ang “Napakalakas ... kapag ito ay kumikilos” ay hindi gaanong likas sa Filipino para sa πολὺ ἰσχύει ... ἐνεργουμένη.
  naturalness: Ang “Kaya nga,” “ipagtapat ninyo sa isa't isa,” at “ipanalangin ang isa't isa” ay malinaw at natural sa modernong Filipino. Mas idiomatiko ang “May malaking bisa” kaysa “Napakalakas” para sa panalangin, habang pinananatili ang operative na aspekto ng participle sa “kapag ito'y kumikilos.”
  terminology: Ang “mga kasalanan,” “panalangin,” “taong matuwid,” at “gumaling” ay angkop, malinaw, at hindi makitid sa doktrina. Ang “pagsusumamo” sa talababa ay wastong leksikal na alternatibo para sa δέησις.
