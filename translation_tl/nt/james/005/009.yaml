  text: μὴ στενάζετε, ⸂ἀδελφοί, κατ’ ἀλλήλων⸃, ἵνα μὴ κριθῆτε· ἰδοὺ ὁ κριτὴς πρὸ τῶν θυρῶν ἕστηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/009.yaml
  text: Do not grumble against one another[a], brothers, so that you may not be judged. Look, the Judge is standing at the doors.
translation:
  language: tl
  text: Huwag kayong magreklamo laban sa isa't isa, mga kapatid,[a] upang hindi kayo hatulan. Tingnan ninyo, ang Hukom ay nakatayo na sa mga pintuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga kapatid” ay salin ng Griyegong adelphoi, na maaaring pantawag sa buong pamayanan ng mga mananampalataya, kabilang ang mga babae, ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: στενάζετε
  choice: magreklamo
  rationale: Sa pariralang κατ’ ἀλλήλων, tumutukoy ito sa pagrereklamo o pagdaing na nakatuon laban sa kapwa, hindi lamang sa panloob na pagdaing.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Natural na tawag ito sa modernong Tagalog para sa magkakapatid sa pananampalataya at maaari itong tumukoy sa kapwa lalaki at babae, gaya ng saklaw ng Griyego sa kontekstong ito.
- source_word: κατ’ ἀλλήλων
  choice: laban sa isa't isa
  rationale: Pinananatili nito ang diwa ng pagsalungat o sama ng loob na nakatuon sa kapwa.
- source_word: κριθῆτε
  choice: hatulan
  rationale: Sinasalamin nito ang pasibong anyo ng κρίνω nang hindi ipinapalagay na ang magiging hatol ay pagkondena.
- source_word: κριτὴς
  choice: ang Hukom
  rationale: Pinananatiling hindi tahasang tinutukoy kung ang reperente ay ang Panginoon/Jesus o ang Diyos sa mas pangkalahatang diwa, habang ipinahihiwatig ng malaking titik ang titulong banal.
- source_word: πρὸ τῶν θυρῶν
  choice: sa harap ng mga pintuan
  rationale: Pinananatili ang maramihang θυρῶν at ang larawang spatial na naghahayag ng napipintong pagdating.
- source_word: ἕστηκεν
  choice: ay nakatayo
  rationale: 'Ipinahahayag ang kasalukuyang kalagayang bunga ng perpektong anyo: naroon na siyang nakatayo at handa.'
theological_decisions:
- issue: Ang tinutukoy ng “Hukom”
  choice: Hindi pinangalanan; isinaling “ang Hukom”
  alternative: Tukuyin bilang Panginoon/Jesus o bilang Diyos
  rationale: Ang konteksto ay tumutukoy sa banal na Hukom sa nalalapit na paghuhukom, ngunit hindi tahasang pinapangalanan ng talata ang reperente. Pinananatili ng salin ang tensiyong ito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “magreklamo laban sa” upang maipakita ang interpersonal na puwersa ng utos; pinanatili ang maramihang “mga pintuan” sa halip na gawing nakaugaliang isahang “pintuan.”
