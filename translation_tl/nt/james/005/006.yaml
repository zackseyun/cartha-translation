  text: κατεδικάσατε, ἐφονεύσατε τὸν δίκαιον. οὐκ ἀντιτάσσεται ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/james/005/006.yaml
  text: You condemned[a], you murdered the righteous one[b]. He does not resist you.
translation:
  language: tl
  text: Hinatulan ninyo at pinaslang ang matuwid[a]. Hindi siya lumalaban sa inyo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring tumukoy ito sa isang taong matuwid na inaapi ng mayayaman. Nakikita rin dito ng ilang tagapagpaliwanag ang posibleng alingawngaw kay Jesus bilang “ang Matuwid.”
    reason: alternative_reading
  - marker: b
    text: 'Maaari ring isalin ayon sa anyong patanong ng tekstong Griyego: “Hindi ba siya lumalaban sa inyo?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεδικάσατε
  choice: Hinatulan ninyo
  rationale: Pinananatili nito ang hudisyal na diwa ng καταδικάζω at ang tuwirang paratang ng aorist na pandiwa.
- source_word: ἐφονεύσατε
  choice: pinaslang
  rationale: Mas mabigat ito kaysa sa payak na “pinatay” at angkop sa φονεύω, na tumutukoy sa labag sa matuwid na pagkitil ng buhay.
- source_word: τὸν δίκαιον
  choice: ang matuwid
  rationale: Tuwirang isinasalin ang pang-uring ginamit bilang pangngalan nang hindi agad tinutukoy kung ito ay isang kinatawang taong matuwid o isang bansag kay Jesus.
- source_word: οὐκ ἀντιτάσσεται ὑμῖν
  choice: Hindi siya lumalaban sa inyo
  rationale: Ang “lumalaban” ay natural na katumbas ng ἀντιτάσσομαι sa kontekstong ito. Ginawang pasalaysay ang sugnay upang maipahayag ang karaniwang pagkaunawa na hindi gumaganti o sumasalungat ang matuwid na biktima, habang inilalagay sa talababa ang anyong patanong ng SBLGNT.
theological_decisions:
- issue: Tinutukoy ng “ang matuwid”
  choice: Hindi tahasang kinilala sa pangunahing teksto; maaari itong tumukoy sa kinatawang taong matuwid na inaapi ng mayayaman.
  alternative: Maaaring alingawngaw ito ng bansag kay Jesus bilang “ang Matuwid.”
  rationale: Pinakamalapit sa konteksto ang pangkalahatang pagtuligsa sa mapang-aping mayayaman, ngunit hindi dapat alisin ng salin ang posibleng kristolohikal na alingawngaw.
- issue: Lakas at anyo ng huling sugnay
  choice: 'Pasalaysay: “Hindi siya lumalaban sa inyo.”'
  alternative: 'Patanong: “Hindi ba siya lumalaban sa inyo?”'
  rationale: Bagaman nilagyan ng tandang pananong sa SBLGNT, maaaring unawain ang sugnay ayon sa konteksto bilang paglalarawan sa hindi paglaban ng matuwid na biktima. Pinananatili sa talababa ang tunay na kalabuan ng bantas at pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ang matuwid” upang mapanatili ang maigsi at bahagyang malabong substantibong anyo ng Griyego; iniwasan ang tahasang pagdaragdag ng “lalaki” o “tao” sa pangunahing teksto.
