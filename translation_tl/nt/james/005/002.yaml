  yaml_path: translation/nt/james/005/002.yaml
  text: Your wealth has rotted, and your clothes have become moth-eaten.
translation:
  language: tl
  text: Nabulok na ang inyong kayamanan, at kinain na ng mga gamugamo ang inyong mga damit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλοῦτος
  choice: kayamanan
  rationale: Ang “kayamanan” ay likas at malawak na katumbas sa modernong Tagalog para sa naipong ari-arian o yaman, at angkop sa pagtuligsa ni Santiago sa mayayaman.
- source_word: σέσηπεν
  choice: nabulok na
  rationale: Ipinahahayag ng perpektong panahunan ang kasalukuyang kalagayang bunga ng naganap na pagkabulok. Pinananatili ng “nabulok na” ang matingkad na larawan at ang resultang nananatili.
- source_word: ἱμάτια
  choice: mga damit
  rationale: Karaniwang tumutukoy sa mga kasuotan. Ang “mga damit” ay malinaw, natural, at madaling maunawaan sa kasalukuyang Tagalog.
- source_word: σητόβρωτα
  choice: kinain na ng mga gamugamo
  rationale: Ang tambalang pang-uri ay nangangahulugang kinain o inubos ng mga gamugamo. Mas natural sa Tagalog ang pasibong sugnay kaysa sa literal ngunit di-likas na tambalang pang-uri.
- source_word: γέγονεν
  choice: kinain na
  rationale: Ang perpektong anyo ng γίνομαι ay nagsasaad ng naganap na pagbabago na may nananatiling resulta. Sa natural na Tagalog, ang “na” kasama ng “kinain” ay naghahatid ng natapos na pangyayari at kasalukuyang kalagayan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “inyong” upang mapanatili ang tuwirang pangmaramihang pagtawag at angkop na antas ng pormalidad. Isinalin nang idiomatiko ang ikalawang sugnay habang pinananatili ang kongkretong larawan ng pagkasira ng naipong yaman.
