  - severity: low
    issue: Hindi ganap na tumpak ang paliwanag na ang “Sabaot” ay transliterasyon mismo ng titulong Hebreo.
    rationale: Ang Σαβαώθ sa Griyego ay pangangalaga ng Hebreong titulo. Maaaring ilarawan ang “Sabaot” bilang anyo sa Griyego ng titulong Hebreo upang maiwasan ang sobrang tiyak na pahayag hinggil sa transliterasyon.
  - severity: low
