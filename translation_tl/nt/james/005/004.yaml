id: JAS.5.4
reference: James 5:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἰδοὺ ὁ μισθὸς τῶν ἐργατῶν τῶν ἀμησάντων τὰς χώρας ὑμῶν ὁ ⸀ἀφυστερημένος ἀφ’ ὑμῶν κράζει, καὶ αἱ βοαὶ τῶν θερισάντων εἰς τὰ ὦτα Κυρίου Σαβαὼθ ⸀εἰσεληλύθασιν·
base_translation:
  language: en
  yaml_path: translation/nt/james/005/004.yaml
  text: Look[a], the wages of the workers who harvested your fields, which have been withheld by you, are crying out, and the cries of those who did the harvesting have entered into the ears of the Lord of Hosts.
translation:
  language: tl
  text: Tingnan ninyo, ang sahod ng mga manggagawang umani sa inyong mga bukid—na ipinagkait ninyo—ay sumisigaw, at ang mga daing ng mga umani ay nakarating sa pandinig ng Panginoon ng mga Hukbo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Panginoong Sabaot.” Ang “Sabaot” ay anyo sa Griyego ng titulong Hebreo na nangangahulugang “mga hukbo.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: Tingnan ninyo
  rationale: Isang mariing panawag-pansin; natural ito sa makabagong Tagalog at pinananatili ang diin ng Griyego.
- source_word: μισθὸς
  choice: sahod
  rationale: Tumutukoy sa kabayarang nararapat sa mga manggagawa; karaniwan at malinaw ang “sahod” sa Tagalog.
- source_word: ἐργατῶν
  choice: mga manggagawa
  rationale: Pangkalahatang katawagan sa mga nagtrabaho at angkop sa kontekstong pansakahan.
- source_word: ἀμησάντων
  choice: umani
  rationale: Tumutukoy sa pag-aani ng pananim; tuwiran at likas sa Tagalog.
- source_word: χώρας
  choice: mga bukid
  rationale: Sa konteksto, tumutukoy ito sa lupang sinasaka ng mayayamang may-ari.
- source_word: ἀφυστερημένος ἀφ’ ὑμῶν
  choice: na hindi ninyo ibinayad
  rationale: Malinaw na ipinapahayag na ipinagkait ng mga may-ari ang nararapat na sahod, nang hindi idinaragdag ang mas tiyak na legal na diwa ng pandaraya.
- source_word: κράζει
  choice: ay sumisigaw
  rationale: Pinananatili ang matingkad na personipikasyon ng sahod na humihingi ng katarungan.
- source_word: βοαὶ
  choice: mga daing
  rationale: Ipinahihiwatig ang matinding paghingi ng tulong at katarungan, hindi lamang malalakas na sigaw.
- source_word: θερισάντων
  choice: mga umani
  rationale: Natural at maikli itong katawagan sa mga nagsagawa ng pag-aani.
- source_word: εἰς τὰ ὦτα
  choice: sa pandinig
  rationale: Natural sa Tagalog habang pinananatili ang larawang ang kanilang daing ay narinig ng Diyos.
- source_word: Κυρίου Σαβαὼθ
  choice: Panginoon ng mga Hukbo
  rationale: Isinasalin ang banal na titulong may saligang Hebreo at pinananatili ang kahulugan nito.
- source_word: εἰσεληλύθασιν
  choice: ay nakarating
  rationale: Ang ganap na aspekto ay ipinahahayag bilang pagdating na may nananatiling kabuluhan sa kasalukuyan.
theological_decisions:
- issue: Pagpapahayag sa banal na titulong Κυρίου Σαβαὼθ
  choice: Panginoon ng mga Hukbo
  alternative: Panginoong Sabaot
  rationale: Isinasalin sa pangunahing teksto ang kahulugan ng titulong mula sa Hebreo upang maunawaan ng karaniwang mambabasa, habang inilalagay sa talababa ang tradisyonal na transliterasyon.
- issue: Personipikasyon ng ipinagkait na sahod
  choice: ang sahod ... ay sumisigaw
  alternative: ang mga manggagawa ay sumisigaw dahil sa sahod
  rationale: Pinananatili ang mismong retorika ng Griyego, kung saan ang sahod ang personipikadong sumisigaw para sa katarungan.
translation_notes:
  register: Makabagong Filipino Tagalog na malinaw, marangal, at tuwiran. Ginamit ang “Tingnan ninyo” bilang mariing panawag-pansin at ang gitling na mahaba upang luminaw na ang ipinagkait ay ang sahod. Iniwasan ang labis na legal o denominasyonal na pagpapakahulugan.
