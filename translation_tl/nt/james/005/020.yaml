base_translation:
  language: en
  yaml_path: translation/nt/james/005/020.yaml
  text: let him know that whoever turns a sinner back from the error of his way will save his soul from death and will cover a multitude of sins[a][b].
translation:
  language: tl
  text: Alamin niya na ang sinumang magpapabalik sa isang makasalanan mula sa pagkaligaw ng kanyang landas ay magliligtas sa kanyang kaluluwa mula sa kamatayan[a][b] at magtatakip ng napakaraming kasalanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magliligtas sa kanyang buhay mula sa kamatayan.” Ang salitang Griyego ay maaaring mangahulugang “kaluluwa” o “buhay.”
    reason: lexical_alternative
  - marker: b
    text: Ang “kanyang” ay maaaring tumukoy sa makasalanang ibinalik; nauunawaan naman ito ng ilan na tumutukoy sa taong nagpabalik sa kanya.
    reason: alternative_reading
lexical_decisions:
- source_word: γινωσκέτω
  choice: Alamin niya
  rationale: Pinananatili ang pangatlong panauhang pautos at ang himig ng tuwirang paghimok.
- source_word: ὁ ἐπιστρέψας
  choice: ang sinumang magpanumbalik
  rationale: Ipinapahayag ang pangkalahatang pagtukoy ng articular participle at ang diwa ng pagbabalik sa naligaw, nang hindi ginagamit ang teknikal na salitang maaaring magpahiwatig ng isang partikular na doktrina.
- source_word: ἁμαρτωλὸν
  choice: sa isang makasalanan
  rationale: Likas na salin sa Filipino para sa anarthrous na pangngalang ginagamit bilang pangkalahatang kategorya.
- source_word: ἐκ πλάνης ὁδοῦ αὐτοῦ
  choice: mula sa pagkaligaw ng landas nito
  rationale: Ang “pagkaligaw” ay nagpapanatili sa diwa ng error o wandering, at ang “landas” ay nagpapanatili sa metapora para sa asal o paraan ng pamumuhay.
- source_word: σώσει
  choice: ay magliligtas
  rationale: Tuwirang katumbas ng future indicative ng σῴζω at pinananatili ang bigat ng pahayag.
- source_word: ψυχὴν αὐτοῦ
  choice: sa kaluluwa nito
  rationale: Pinananatili ng “kaluluwa” ang karaniwang leksikal na anyo ng ψυχή, samantalang ang “nito” ay hindi tahasang nilulutas kung kanino tumutukoy ang panghalip.
- source_word: ἐκ θανάτου
  choice: mula sa kamatayan
  rationale: Hindi nililimitahan ang kamatayan sa pisikal o espirituwal na kahulugan.
- source_word: καλύψει
  choice: magtatakip
  rationale: Pinananatili ang biblikal na idyoma ng pagtatakip sa mga kasalanan sa halip na ipaliwanag ito bilang pagpapatawad o pagkukubli.
- source_word: πλῆθος ἁμαρτιῶν
  choice: napakaraming kasalanan
  rationale: Natural sa makabagong Filipino at malinaw na naghahatid ng diwa ng malaking bilang o multitude.
theological_decisions:
- issue: Tinutukoy ng αὐτοῦ sa ψυχὴν αὐτοῦ
  choice: Hindi tinukoy nang tahasan sa pangunahing teksto kung ang kaluluwa ay sa makasalanan o sa nagpapanumbalik.
  alternative: Unawain ito bilang kaluluwa ng makasalanan; o, ayon sa ibang pagkaunawa, kaluluwa ng nagpapanumbalik.
  rationale: Maaaring tumukoy ang panghalip na Griyego sa alinman, bagaman mas malapit at mas karaniwan ang pagtukoy sa makasalanang ibinalik. Pinananatili sa teksto at talababa ang tunay na kalabuan.
- issue: Kahulugan ng ψυχή at θάνατος
  choice: kaluluwa ... mula sa kamatayan
  alternative: buhay ... mula sa kamatayan; o kaluluwa ... mula sa espirituwal na kamatayan
  rationale: Maaaring tumukoy ang ψυχή sa kaluluwa o buhay, at hindi tinutukoy ng talata kung anong uri ng kamatayan ang nasa isip. Hindi ito pinakikitid sa isang doktrinal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “magpanumbalik” upang idiin ang pagbabalik ng isang naligaw, at ang “landas” at “magtatakip” upang mapanatili ang mahahalagang larawan at idyomang biblikal.
