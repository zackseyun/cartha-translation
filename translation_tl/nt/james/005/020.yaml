  naturalness: Mas natural at malinaw ang “magpapabalik sa isang makasalanan” para sa sanhi o pagpapanumbalik ng isang taong naligaw. Ang “kanyang” ay angkop para sa taong tinutukoy at, sa ikalawang paglitaw nito, maaari pa ring panatilihin ang sinadyang kalabuan ng Griyego.
  terminology: Ang “makasalanan,” “kaluluwa,” “kamatayan,” at “magtatakip” ay angkop at pinananatili ang rehistro at mga larawang biblikal. Ang “pagkaligaw ng kanyang landas” ay maayos na naghahatid ng πλάνης ὁδοῦ αὐτοῦ.
