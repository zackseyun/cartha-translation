- from: Alamin niya na ang sinumang magpanumbalik sa isang makasalanan mula sa pagkaligaw ng landas nito ay magliligtas sa kaluluwa nito mula sa kamatayan[a][b] at magtatakip ng napakaraming kasalanan.
  to: Alamin niya na ang sinumang magpapabalik sa isang makasalanan mula sa pagkaligaw ng kanyang landas ay magliligtas sa kanyang kaluluwa mula sa kamatayan[a][b] at magtatakip ng napakaraming kasalanan.
