    reason: cross_reference
lexical_decisions:
- source_word: ἐγένετο ἐτῶν δώδεκα
  choice: labindalawang taong gulang na siya
  rationale: Ang idyomang Griyego na γίνομαι kasama ng edad ay tumutukoy sa pagiging o pagsapit sa nasabing edad. Ito ang natural at malinaw na paraan ng pagpapahayag sa modernong Tagalog.
- source_word: ἀναβαινόντων
  choice: habang umaakyat
  rationale: Pinananatili ng “habang” ang kasabay at nagpapatuloy na kilos ng present participle. Ang “umaakyat” ay malapit sa kahulugan ng ἀναβαίνω at karaniwang paglalarawan sa pagpunta sa Jerusalem; hindi idinagdag ang Jerusalem dahil hindi ito inuulit sa talata.
- source_word: αὐτῶν
  choice: sila
  rationale: Tumutukoy ang panghalip sa naunang binanggit na pangkat ng pamilya, lalo na sa mga magulang ni Jesus, ngunit hindi ito labis na tinutukoy nang tahasan.
- source_word: κατὰ τὸ ἔθος
  choice: ayon sa kaugalian
  rationale: Malinaw nitong ipinapahayag ang pagsunod sa nakagawiang gawain at nananatiling malapit sa anyo ng Griyego.
- source_word: τῆς ἑορτῆς
  choice: ng kapistahan
  rationale: Ang ἑορτή ay isang relihiyosong kapistahan. Ang “kapistahan” ay natural, marangal, at angkop sa konteksto ng Paskuwa.
- source_word: καὶ ὅτε
  choice: At nang
  rationale: Ipinagpapatuloy ng “At” ang salaysay, samantalang natural na ipinakikilala ng “nang” ang sugnay na tumutukoy sa panahon.
