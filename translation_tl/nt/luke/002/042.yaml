  text: And when he was twelve years old[a], as they were going up according to the custom of the feast[b],
translation:
  language: tl
  text: At nang siya ay labindalawang taong gulang na, habang umaakyat sila ayon sa kaugalian ng kapistahan,[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin nang mas payak bilang “umakyat sila ayon sa kaugalian ng kapistahan.” Ang anyong Griyego ay nagpapahiwatig ng kasabay o nagpapatuloy na kilos, kaya ginamit sa teksto ang “habang umaakyat sila.”
    reason: lexical_alternative
