  text: a light for revelation to the Gentiles[a], and glory to your people Israel.
translation:
  language: tl
  text: isang liwanag para sa paghahayag sa mga hindi Judio[a], at kaluwalhatian para sa iyong bayang Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang liwanag para sa paghahayag sa mga bansa.” Ang salitang Griyego ay maaaring tumukoy sa mga bansa sa pangkalahatan, ngunit dito ay malamang na itinatampok ang mga hindi Judio bilang katapat ng Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: φῶς
  choice: isang liwanag
  rationale: Natural sa Filipino ang may “isang” sa panaguring patula, bagaman walang tahasang pantukoy sa Griyego.
- source_word: εἰς ἀποκάλυψιν
  choice: upang mahayag
  rationale: Ipinahahayag ang layunin o bunga ng εἰς at ang diwa ng ἀποκάλυψις bilang paglalantad o pagpapakilala, sa natural na modernong Filipino.
- source_word: ἐθνῶν
  choice: mga bansang hindi Judio
  rationale: Sa pagkakatapat nito sa Israel, tumutukoy ito sa mga bansa o taong nasa labas ng Israel; malinaw ito sa karaniwang mambabasa nang hindi gumagamit ng mas teknikal na “mga Hentil.”
- source_word: δόξαν
  choice: kaluwalhatian
  rationale: Pinananatili nito ang diwa ng karangalan at maningning na kadakilaan, pati ang biblikal na bigat ng salita.
- source_word: λαοῦ σου Ἰσραήλ
  choice: iyong bayang Israel
  rationale: Natural at tuwirang kinikilala ang Israel bilang bayan ng Diyos.
- source_word: καὶ
  choice: at
  rationale: Pinag-uugnay ang dalawang magkahanay na paglalarawan.
theological_decisions:
- issue: Kahulugan ng ἐθνῶν kaugnay ng Israel
  choice: mga bansang hindi Judio
  alternative: mga bansa
  rationale: Ipinakikita ng tahasang pagtapat sa “iyong bayang Israel” na ang tinutukoy ay mga bansang nasa labas ng Israel. Gayunman, tunay ding maaaring isalin ang salitang Griyego nang mas pangkalahatan bilang “mga bansa,” kaya pinanatili iyon sa talababa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang maikli at patulang anyo ng pahayag ni Simeon; ginamit ang “bayan” para sa λαός at iniwasan ang mas teknikal na “Hentil” sa pangunahing teksto.
