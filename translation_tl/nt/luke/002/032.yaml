  terminology: Ang “mga hindi Judio” ay malinaw at di-teknikal na katumbas sa kontekstong ikinokontrast sa Israel. Pinananatili ng talababa ang “mga bansa” bilang leksikal na alternatibo. Ang “kaluwalhatian” ay angkop para sa δόξα.
