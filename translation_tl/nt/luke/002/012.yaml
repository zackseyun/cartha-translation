base_translation:
  language: en
  yaml_path: translation/nt/luke/002/012.yaml
  text: 'And this will be the sign for you: you will find a baby wrapped in cloths and lying in a manger[a][b].'
translation:
  language: tl
  text: 'At ito ang magiging tanda para sa inyo: makakakita kayo ng isang sanggol na nakabalot sa mga telang panlampin[a] at nakahiga sa isang sabsaban[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “binalot sa mga lampin.”
    reason: lexical_alternative
  - marker: b
    text: O “labangan ng pagkain ng hayop.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖον
  choice: tanda
  rationale: Karaniwang tumutukoy ang σημεῖον sa isang tanda o palatandaang pagkakakilanlan. Sa konteksto, ito ang ibinigay sa mga pastol upang makilala nila ang sanggol, nang hindi tahasang tinatawag itong isang mahimalang patunay.
- source_word: εὑρήσετε
  choice: makakakita kayo
  rationale: Ang future indicative na ito ay nangangahulugang matatagpuan o makikita nila ang sanggol. Mas natural sa kasalukuyang Tagalog ang “makakakita kayo” sa ganitong pangungusap, habang malinaw pa rin ang tiyak na pahayag tungkol sa mangyayari.
- source_word: βρέφος
  choice: isang sanggol
  rationale: Ang βρέφος ay tumutukoy sa napakabatang bata, lalo na sa isang sanggol. Ang “sanggol” ay malinaw, dignified, at eksakto sa modernong Tagalog.
- source_word: ἐσπαργανωμένον
  choice: nababalot ng mga lampin
  rationale: Ang participle mula sa σπαργανόω ay naglalarawan sa sanggol na binalot sa mga telang panlampin. Pinananatili ng “nababalot ng mga lampin” ang kongkretong larawan at ang kalagayan ng sanggol.
- source_word: κείμενον
  choice: nakahiga
  rationale: Inilalarawan ng present participle ng κεῖμαι ang kasalukuyang posisyon o kalagayan ng sanggol. Ang “nakahiga” ay mas tumpak kaysa isang salitang magpapahiwatig lamang sa naunang paglalagay sa kaniya.
- source_word: φάτνῃ
  choice: sa isang sabsaban
  rationale: Maaaring tumukoy ang φάτνη sa sabsaban o sisidlang kainan ng hayop. Ang “sabsaban” ang nakaugaliang salin at angkop sa tagpo, habang nililinaw sa talababa ang kongkretong kahulugan.
- source_word: τοῦτο ὑμῖν τὸ σημεῖον
  choice: ito ang magiging tanda para sa inyo
  rationale: Bahagyang elliptical ang pariralang Griyego. Natural na ipinahahayag sa Tagalog sa pamamagitan ng “ang magiging,” na nagpapakilala sa susunod na paglalarawan bilang tandang ibinigay sa mga pastol.
theological_decisions:
- issue: Likas ng tandang ibinigay sa mga pastol
  choice: Inilalahad ang tanda bilang palatandaan upang makilala nila ang sanggol.
  alternative: Maaari ring taglayin ng tanda ang mas malawak na diwa ng banal na pagpapatibay.
  rationale: Nakatuon ang talata sa paraan ng pagkilala ng mga pastol sa sanggol sa isang di-pangkaraniwang kalagayan. Kaya pinananatili ang payak na salitang “tanda” at hindi ito pinalalawak bilang “patunay” o tahasang himala, upang manatiling bukas ang ipinahihiwatig na teolohikal na lalim.
translation_notes:
  register: Modernong Filipino Tagalog na natural at dignified. Ginamit ang “sanggol,” “lampin,” at “sabsaban” bilang malinaw ngunit may angkop na biblikal na tono; inilagay ang mas paliwanag na mga katumbas sa mga talababa.
