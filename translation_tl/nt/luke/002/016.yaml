  text: καὶ ἦλθαν σπεύσαντες καὶ ἀνεῦραν τήν τε Μαριὰμ καὶ τὸν Ἰωσὴφ καὶ τὸ βρέφος κείμενον ἐν τῇ φάτνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/016.yaml
  text: And they came in haste and found Mary and Joseph[a], and the baby lying in the manger.
translation:
  language: tl
  text: At dali-dali silang pumunta at natagpuan nila sina Maria at Jose, at ang sanggol na nakahiga sa sabsaban.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “pakainan ng mga hayop.” Ang salitang Griyego na φάτνη ay maaaring tumukoy sa sabsaban o sisidlang pakainan ng mga hayop.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθαν
  choice: pumunta
  rationale: Sa daloy ng salaysay, inilalarawan ang pagpunta ng mga pastol sa lugar na sinabi ng anghel. Mas natural sa Filipino ang “pumunta” kaysa “dumating” mula sa pananaw ng mga kumikilos.
- source_word: σπεύσαντες
  choice: dali-dali
  rationale: Ipinahahayag ng participle ang paraang may pagmamadali at agarang pagkilos. Ang “dali-dali” ay likas at malinaw sa makabagong Filipino.
- source_word: ἀνεῦραν
  choice: natagpuan nila
  rationale: Tumutukoy ang pandiwa sa matagumpay na pagkakita matapos hanapin. Sapat na ipinahihiwatig ng “natagpuan” ang paghahanap sa konteksto.
- source_word: τήν τε Μαριὰμ
  choice: Maria
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalang Μαριάμ. Isinama sa “sina Maria at Jose” ang ugnayang ipinahahayag ng τε.
- source_word: Ἰωσὴφ
  choice: Jose
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalang Ἰωσήφ.
- source_word: τὸ βρέφος
  choice: ang sanggol
  rationale: Ang βρέφος ay isang napakabatang bata; ang “sanggol” ang tiyak, natural, at angkop sa konteksto ng kapanganakan.
- source_word: κείμενον
  choice: nakahiga
  rationale: Inilalarawan ng κεῖμαι ang kalagayan o posisyon ng sanggol, hindi ang kilos ng paglalagay sa kaniya. Pinananatili ito ng “nakahiga” nang natural at walang dagdag na pahiwatig.
- source_word: ἐν τῇ φάτνῃ
  choice: sa sabsaban
  rationale: Ang φάτνη ay pakainan o sisidlang kainan ng hayop. Ang “sabsaban” ang kinikilalang maikli at tumpak na salin sa salaysay ng kapanganakan.
- source_word: καὶ ... καὶ ... καὶ
  choice: at ... at ... at
  rationale: Pinananatili ang payak at sunod-sunod na daloy ng mga pangyayari at mga bagay na natagpuan, habang sumusunod sa natural na koordinasyon sa Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “dali-dali” upang ihatid ang pagmamadali nang hindi mabigat, at “nakahiga” upang tumpak na ilarawan ang kalagayan ng sanggol. Inilagay ang talababa pagkatapos ng “sabsaban,” ang salitang tinutukoy nito.
