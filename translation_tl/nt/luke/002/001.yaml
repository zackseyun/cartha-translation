source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν ταῖς ἡμέραις ἐκείναις ἐξῆλθεν δόγμα παρὰ Καίσαρος Αὐγούστου ἀπογράφεσθαι πᾶσαν τὴν οἰκουμένην·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/001.yaml
  text: It happened in those days that a decree went out from Caesar Augustus that all the inhabited world should be registered[a].
translation:
  language: tl
  text: Noong mga araw na iyon, nagpalabas si Cesar Augusto ng isang utos na magparehistro ang lahat ng naninirahan sa daigdig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang buong daigdig ng Roma” o “ang buong imperyo.” Ang salitang Griyego ay madalas tumukoy sa tinatahanang daigdig ayon sa pananaw ng Imperyong Romano.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγένετο
  choice: Nangyari
  rationale: Likas at makabagong panimulang pormula sa salaysay; iniiwasan ang makalumang “At nangyari.”
- source_word: δὲ
  choice: hindi isinalin nang hiwalay
  rationale: Mahinang panandang pandiskurso ito; sapat nang ipinahihiwatig ng pagsisimula ng bagong pangyayari ang pag-usad ng salaysay.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: noong mga araw na iyon
  rationale: Malapit sa estrukturang Griyego at natural na panandang temporal sa Filipino.
- source_word: ἐξῆλθεν δόγμα
  choice: nagpalabas ... ng isang utos
  rationale: Natural na Filipino para sa isang utos na nagmula at opisyal na inilabas ng pinuno; pinagsamang isinalin ang pandiwa at pangngalan.
- source_word: παρὰ Καίσαρος Αὐγούστου
  choice: si Emperador Augusto
  rationale: Ipinakikita ng hulma na siya ang pinagmulan ng utos. Ginamit ang “Emperador” bilang malinaw na katumbas sa kontekstong Romano ng titulong Καῖσαρ, at “Augusto” ang karaniwang anyong Filipino ng pangalan.
- source_word: ἀπογράφεσθαι
  choice: magparehistro
  rationale: Tumutukoy sa opisyal na pagpapatala, ngunit hindi ipinapasok sa pangunahing teksto ang mas tiyak na layuning sensus o pagbubuwis na hindi tahasang sinabi sa talata.
- source_word: πᾶσαν τὴν οἰκουμένην
  choice: ang lahat ng naninirahan sa daigdig
  rationale: Ipinahahayag sa natural na Filipino ang saklaw ng “buong tinatahanang daigdig,” habang pinananatili sa talababa ang posibleng kontekstuwal na saklaw na Romano.
theological_decisions:
- issue: Saklaw ng οἰκουμένη
  choice: ang lahat ng naninirahan sa daigdig
  alternative: ang buong daigdig ng Roma; ang buong imperyo
  rationale: Pinananatili ng pangunahing teksto ang malawak na leksikal na diwa nang hindi agad nililimitahan sa Imperyong Romano; nililinaw ng talababa ang malamang na imperyal na konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang payak na “utos” at “magparehistro” sa halip na mas teknikal o makalumang mga salita. Nakalagay ang marker na [a] sa pangunahing teksto.
