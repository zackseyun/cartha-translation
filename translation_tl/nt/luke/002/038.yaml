id: LUK.2.38
reference: Luke 2:38
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀καὶ αὐτῇ τῇ ὥρᾳ ἐπιστᾶσα ἀνθωμολογεῖτο τῷ ⸀θεῷ καὶ ἐλάλει περὶ αὐτοῦ πᾶσιν τοῖς προσδεχομένοις ⸀λύτρωσιν Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/038.yaml
  text: And at that very hour[a], coming up[c][b], she began giving thanks to God and speaking about him to all who were waiting for the redemption of Jerusalem.
translation:
  language: tl
  text: Sa mismong oras ding iyon[a], lumapit siya at nagpasalamat sa Diyos[b]. Nagsalita rin siya tungkol sa kanya[c] sa lahat ng naghihintay sa pagtubos ng Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa oras ding iyon.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nagpuri sa Diyos” o “nagpahayag ng pasasalamat sa Diyos.”
    reason: lexical_alternative
  - marker: c
    text: Sa konteksto, malamang na ang batang si Jesus ang tinutukoy ng “kanya,” bagaman ang Diyos ang pinakamalapit na tahasang maaaring pagbatayan ng panghalip sa Griyego.
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτῇ τῇ ὥρᾳ
  choice: sa mismong oras ding iyon
  rationale: Ipinahahayag ng pariralang pamanahon ang oras ng pangyayari, at binibigyang-diin ng “mismong” ang emphatic na αὐτῇ habang pinananatili ng “ding iyon” ang diwang ‘iyon ding oras.’
- source_word: ἐπιστᾶσα
  choice: lumapit siya
  rationale: Sa konteksto, inilalarawan ng aorist participle ang pagdating o paglapit ni Ana sa tagpo; natural at hindi labis na tiyak ang “lumapit.”
- source_word: ἀνθωμολογεῖτο
  choice: nagpasalamat
  rationale: Maaaring tumukoy ang imperfect middle sa pagpapahayag ng pasasalamat o papuri sa Diyos. Direkta at natural ang “nagpasalamat,” nang hindi idinaragdag ang aspektong ‘nagsimulang’ hindi tahasang nakasaad.
- source_word: τῷ θεῷ
  choice: sa Diyos
  rationale: Ito ang likas na salin ng dative na tumutukoy sa pinag-uukulan ng pasasalamat; hindi kailangang katawanin nang hiwalay ang artikulong Griyego.
- source_word: ἐλάλει περὶ αὐτοῦ
  choice: nagsalita rin siya tungkol sa kanya
  rationale: Pinananatili ang panghalip upang huwag tahasang lutasin ang maaaring pagbatayan nito. Ipinahihiwatig ng anyong imperfect ang nagpapatuloy na pagsasalita, na likas na naipapahayag ng pandiwang Tagalog ayon sa daloy ng salaysay.
- source_word: πᾶσιν τοῖς προσδεχομένοις
  choice: sa lahat ng naghihintay
  rationale: Ipinakikita ng προσδέχομαι ang may-pananabik na paghihintay; malinaw at natural ang “naghihintay” sa konteksto.
- source_word: λύτρωσιν
  choice: pagtubos
  rationale: Pinananatili ng “pagtubos” ang diwa ng pagpapalaya at ang bigat na pangkaligtasan ng λύτρωσις nang hindi ito nililimitahan sa pulitikal o espirituwal lamang na kahulugan.
- source_word: Ἰερουσαλήμ
  choice: Jerusalem
  rationale: Karaniwang anyo ng pangalan ng lungsod sa modernong Filipino.
theological_decisions:
- issue: Tinutukoy ng αὐτοῦ sa pariralang ‘tungkol sa kanya’
  choice: Pinanatili ang panghalip na “kanya”; sa konteksto, malamang na ang batang si Jesus ang tinutukoy.
  alternative: Maaaring unawain na Diyos ang tinutukoy, sapagkat siya ang pinakamalapit na tahasang binanggit na maaaring pagbatayan ng panghalip sa Griyego.
  rationale: Nakasentro ang salaysay sa batang si Jesus, ngunit hindi tahasang pinapangalanan ng Griyego ang tinutukoy ng panghalip. Pinananatili ng salin at talababa ang tunay na kalabuan.
- issue: Kahulugan ng λύτρωσιν Ἰερουσαλήμ
  choice: pagtubos ng Jerusalem
  alternative: pagliligtas o pagpapalaya sa Jerusalem
  rationale: Maaaring saklawin ng parirala ang inaasahang pagliligtas ng Diyos sa kanyang bayan na kaugnay ng Jerusalem, na may pangkomunidad at eskatolohikal na diwa. Hindi ito pinaliit sa isang eksklusibong pulitikal o espirituwal na pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “mismong oras ding iyon” upang katawanin ang diin ng Griyego, “lumapit” para sa payak na pagdating sa tagpo, at “pagtubos” upang mapanatili ang teolohikal na lawak. Hindi pinalitan ng pangalan ang “kanya” upang mapanatili ang kalabuan ng pinatutungkulan.
