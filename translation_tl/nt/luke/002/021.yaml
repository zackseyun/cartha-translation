id: LUK.2.21
reference: Luke 2:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἐπλήσθησαν ἡμέραι ὀκτὼ τοῦ περιτεμεῖν αὐτόν, καὶ ἐκλήθη τὸ ὄνομα αὐτοῦ Ἰησοῦς, τὸ κληθὲν ὑπὸ τοῦ ἀγγέλου πρὸ τοῦ συλλημφθῆναι αὐτὸν ἐν τῇ κοιλίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/021.yaml
  text: And when eight days were fulfilled for circumcising him[a], his name was called Jesus[c][b], the name called by the angel before he was conceived in the womb.
translation:
  language: tl
  text: Nang makumpleto ang walong araw para tuliin siya,[a] pinangalanan siyang Jesus,[b] ang pangalang itinawag sa kanya ng anghel bago pa siya ipinaglihi sa sinapupunan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nang matapos ang walong araw.”
    reason: lexical_alternative
  - marker: b
    text: 'Sa mas literal na anyo: “tinawag na Jesus ang kanyang pangalan.”'
    reason: lexical_alternative
  - marker: c
    text: Ibig sabihin, bago siya ipinaglihi sa sinapupunan ni Maria.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπλήσθησαν ἡμέραι ὀκτὼ
  choice: nang makumpleto ang walong araw
  rationale: Ipinapahayag nito ang aspektong kompletibo ng Griyego at natural itong pakinggan sa makabagong Tagalog; hindi nito basta pinapantay ang parirala sa mas malayang ‘nang sumapit ang ikawalong araw.’
- source_word: τοῦ περιτεμεῖν αὐτόν
  choice: para tuliin siya
  rationale: Malinaw at natural na ipinapakita ang layunin o itinakdang gawain ng articular infinitive.
- source_word: ἐκλήθη τὸ ὄνομα αὐτοῦ Ἰησοῦς
  choice: pinangalanan siyang Jesus
  rationale: Likas na ekspresyon sa Tagalog para sa pasibong pagbibigay ng pangalan; iniiwasan ang literal ngunit alanganing ‘tinawag na Jesus ang kanyang pangalan.’
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Ginagamit ang nakaugaliang anyo ng pangalan sa Bagong Tipan sa Tagalog, sa halip na isalin itong Josue.
- source_word: τὸ κληθὲν ὑπὸ τοῦ ἀγγέλου
  choice: ang pangalang itinawag sa kanya ng anghel
  rationale: Pinananatili ang pag-uulit ng diwa ng καλέω at ang tiyak na ‘anghel,’ na tumutukoy sa naunang pahayag sa salaysay.
- source_word: πρὸ τοῦ συλλημφθῆναι αὐτὸν ἐν τῇ κοιλίᾳ
  choice: bago pa siya ipinaglihi sa sinapupunan
  rationale: Tumpak at likas na tumutukoy sa paglilihi; ang ‘sinapupunan’ ang angkop na kahulugan ng κοιλία sa kontekstong ito.
theological_decisions:
- issue: Paglalahad sa paglilihi kay Jesus
  choice: bago pa siya ipinaglihi sa sinapupunan
  alternative: bago ang paglilihi sa kanya sa sinapupunan
  rationale: Payak nitong inilalahad ang pangyayaring tinutukoy ng Griyego nang hindi nagdaragdag ng teolohikal na paliwanag na wala sa talata.
- issue: Kung sino ang nagtakda ng pangalang Jesus
  choice: ang pangalang itinawag sa kanya ng anghel
  alternative: ang pangalang ibinigay ng anghel
  rationale: Mas malapit ito sa participle na κληθέν at sa naunang ἐκλήθη, habang hindi sinasabing ang anghel ang ultimong pinagmulan ng pangalan; ipinahayag niya ang pangalang itinakda.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang karaniwang ‘tuliin’ at ‘pinangalanan’ para sa agarang pagkaunawa, samantalang pinanatili sa pangunahing teksto ang kompletibong diwa ng walong araw at ang pag-uulit ng konsepto ng pagtawag o pagpapangalan.
