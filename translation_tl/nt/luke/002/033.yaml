base_translation:
  language: en
  yaml_path: translation/nt/luke/002/033.yaml
  text: And his father and mother were marveling at the things being said about him[a].
translation:
  language: tl
  text: At ang kanyang ama at ina ay namamangha sa mga sinasabi tungkol sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Griyego: “kanyang ama.” Tumutukoy ito kay Jose ayon sa karaniwang ugnayang pampamilya at legal sa salaysay. Ang ilang salin ay gumagamit ng “Jose at ang kanyang ina” upang maiwasan ang maling pagkaunawa kaugnay ng naunang salaysay ni Lucas tungkol sa paglilihi kay Jesus mula sa isang birhen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πατὴρ αὐτοῦ
  choice: ang kanyang ama
  rationale: Tuwirang isinasalin ang tekstong Griyego bilang “ang kanyang ama” sa halip na palitan ito ng “Jose.” Sa salaysay, tumutukoy ito kay Jose ayon sa karaniwang ugnayang pampamilya at legal.
- source_word: μήτηρ
  choice: ina
  rationale: Likas at tuwirang katumbas ng μήτηρ; kasama ng unang parirala, nabubuo ang tambalang “kanyang ama at ina.”
- source_word: θαυμάζοντες
  choice: namamangha
  rationale: Ipinahihiwatig ng kasalukuyang anyo sa Filipino ang nagpapatuloy na paghanga sa panahong inilalarawan ng salaysay, at pinananatili ang diwa ng pagtataka at paghanga.
- source_word: ἐπὶ τοῖς λαλουμένοις
  choice: sa mga sinasabi
  rationale: Pinananatili nito ang pasibong diwa at ang maramihang saklaw ng mga bagay na sinasabi, habang nananatiling natural sa makabagong Filipino.
- source_word: περὶ αὐτοῦ
  choice: tungkol sa kanya
  rationale: Karaniwan at malinaw na salin ng περί na may genitive sa kontekstong ito.
theological_decisions:
- issue: Ang pagtukoy kay Jose bilang “kanyang ama” sa konteksto ng paglilihi kay Jesus mula sa isang birhen
  choice: Panatilihin sa pangunahing teksto ang “kanyang ama.”
  alternative: “Si Jose at ang kanyang ina” o “ang kanyang ama, samakatuwid ay si Jose sa legal at panlipunang diwa”
  rationale: Ito ang tuwirang sinasabi ng tekstong Griyego. Sa salaysay ni Lucas, maaaring tawaging ama ni Jesus si Jose ayon sa karaniwang ugnayang pampamilya at legal nang hindi itinatanggi ang naunang salaysay tungkol sa paglilihi mula sa isang birhen. Hindi dapat alisin sa salin ang tunay na tensiyon ng teksto; nililinaw ito sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “namamangha” at “sa mga sinasabi” upang maging natural sa karaniwang mambabasa habang pinananatili ang nagpapatuloy na kilos at ang diwa ng tekstong Griyego.
