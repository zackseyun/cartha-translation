  source_fidelity: 'Tumpak na naisasalin ang Griyego: pinananatili ang “kanyang ama” para sa ὁ πατὴρ αὐτοῦ, ang pares na “ama at ina,” ang nagpapatuloy na paghanga ng periphrastic imperfect, at ang mga bagay na sinasabi tungkol kay Jesus. Hindi pinapalitan ng “Jose” ang mismong pananalita ng teksto.'
