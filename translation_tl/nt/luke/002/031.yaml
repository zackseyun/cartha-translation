id: LUK.2.31
reference: Luke 2:31
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὃ ἡτοίμασας κατὰ πρόσωπον πάντων τῶν λαῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/031.yaml
  text: which you prepared before the face of all the peoples[b][a],
translation:
  language: tl
  text: na inihanda mo sa harap ng lahat ng mga sambayanan[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa paningin ng lahat ng mga sambayanan”; ipinahihiwatig ng idyomang Griego na hayag itong inilagay upang makita ng lahat.
    reason: lexical_alternative
  - marker: b
    text: O “lahat ng mga bansa.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὃ
  choice: na
  rationale: Panghalip na pamanggit na tumutukoy sa “kaligtasan” sa naunang talata; natural sa Filipino ang “na” sa pagpapatuloy ng pangungusap.
- source_word: ἡτοίμασας
  choice: inihanda mo
  rationale: Tuwirang ipinapahayag ang aorist active indicative na nakatuon sa Diyos bilang kinakausap.
- source_word: κατὰ πρόσωπον
  choice: sa harap ng
  rationale: Pinananatili ang idyomang tumutukoy sa isang bagay na hayag na inilagay sa harap o sa paningin ng iba, nang hindi nagiging pilit ang Filipino.
- source_word: πάντων τῶν λαῶν
  choice: lahat ng mga sambayanan
  rationale: Pinananatili ang maramihang anyo ng λαῶν at ang malawak na saklaw nito. Mas malinaw ang “mga sambayanan” kaysa “mga bayan,” na maaari ring mangahulugang mga bayan o munisipalidad.
theological_decisions:
- issue: Saklaw ng λαῶν kaugnay ng kasunod na talata
  choice: lahat ng mga sambayanan
  alternative: lahat ng mga bansa
  rationale: Ang maramihang λαῶν ay tumutukoy sa maraming pangkat ng tao. Hindi nito inuunahan ang tiyak na pagbanggit sa mga Hentil at Israel sa talata 32.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “mga sambayanan” upang ipahayag ang maramihang peoples nang maiwasan ang heograpikong kahulugan na maaaring idulot ng “mga bayan.”
