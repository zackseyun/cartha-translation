reference: Luke 2:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἐπλήσθησαν αἱ ἡμέραι τοῦ καθαρισμοῦ αὐτῶν κατὰ τὸν νόμον Μωϋσέως, ἀνήγαγον αὐτὸν εἰς Ἱεροσόλυμα παραστῆσαι τῷ κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/022.yaml
  text: And when the days of their purification were fulfilled according to the law of Moses[a], they brought him up to Jerusalem to present him to the Lord,
translation:
  language: tl
  text: Nang matapos ang mga araw ng kanilang paglilinis ayon sa Kautusan ni Moises,[a] dinala nila siya paakyat sa Jerusalem upang iharap sa Panginoon,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: May ilang manuskrito na may “kanyang paglilinis” sa halip na “kanilang paglilinis.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐπλήσθησαν
  choice: natapos
  rationale: Sa pagtukoy sa isang takdang panahon, ipinahihiwatig ng pasibong pandiwa na umabot na sa kabuuan o wakas ang mga araw. Ang “natapos” ay natural sa makabagong Tagalog at malinaw na nagpapanatili sa temporal na diwa.
- source_word: καθαρισμοῦ
  choice: paglilinis
  rationale: Tumutukoy ito sa rituwal na paglilinis na hinihingi ng Kautusan matapos manganak, hindi lamang sa karaniwang pisikal na paglilinis.
- source_word: αὐτῶν
  choice: kanilang
  rationale: Maramihan ang panghalip sa ibinigay na tekstong Griyego, kaya pinanatili ang “kanilang” sa pangunahing teksto sa halip na iayon nang tahimik sa rituwal na kaligiran ng Levitico.
- source_word: κατὰ τὸν νόμον Μωϋσέως
  choice: ayon sa Kautusan ni Moises
  rationale: Malinaw nitong ipinapahayag na ang itinakdang panahon ay alinsunod sa hinihingi ng Kautusan ni Moises, habang pinananatili ang pormal at legal na himig.
- source_word: ἀνήγαγον
  choice: dinala nila siya paakyat
  rationale: Pinananatili ng “paakyat” ang direksiyonal na diwa ng pandiwa at ang karaniwang paglalarawan sa pag-ahon patungong Jerusalem.
- source_word: Ἱεροσόλυμα
  choice: Jerusalem
  rationale: Ito ang pamantayan at madaling makilalang anyo ng pangalan ng lungsod sa modernong Filipino.
- source_word: παραστῆσαι
  choice: upang iharap
  rationale: Sa kontekstong panrelihiyon at legal, nangangahulugan itong dalhin at iharap ang isang tao sa Diyos. Natural at marangal sa Tagalog ang “iharap.”
- source_word: κυρίῳ
  choice: sa Panginoon
  rationale: Ang “Panginoon” ang natural at mapitagang katumbas ng κύριος sa pagtukoy sa Diyos sa kontekstong ito.
theological_decisions:
- issue: Bilang ng panghalip sa “mga araw ng kanilang paglilinis”
  choice: Pinanatili ang maramihang “kanilang paglilinis” sa pangunahing teksto.
  alternative: “kanyang paglilinis,” na tumutukoy kay Maria
  rationale: Ang ibinigay na SBLGNT ay may αὐτῶν, “kanilang.” Bagaman maaaring magbangon ito ng tanong dahil sa rituwal na kaligiran at may ibang pagbasa sa ilang manuskrito, hindi dapat tahimik na lutasin ng salin ang tensiyon. Inilagay sa talababa ang pambabaeng isahang pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang legal-rituwal na himig ng talata nang hindi gumagamit ng lipas o labis na teknikal na pananalita. Ang “paakyat sa Jerusalem” ay sadyang nagpapanatili sa heograpiko at tradisyonal na direksiyonal na diwa ng ἀνήγαγον.
