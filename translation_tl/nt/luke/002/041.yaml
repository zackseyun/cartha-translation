id: LUK.2.41
reference: Luke 2:41
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἐπορεύοντο οἱ γονεῖς αὐτοῦ κατ’ ἔτος εἰς Ἰερουσαλὴμ τῇ ἑορτῇ τοῦ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/041.yaml
  text: And his parents went to Jerusalem year by year for the Feast of the Passover.
translation:
  language: tl
  text: Taun-taon, pumupunta sa Jerusalem ang kanyang mga magulang para sa Pista ng Paskuwa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: pumupunta
  rationale: Ang imperpektong anyo, kasama ng κατ’ ἔτος, ay nagpapahayag ng nakaugaliang paulit-ulit na pagpunta noong nakaraan. Likas sa Filipino ang aspektong imperpektibo ng “pumupunta” para rito.
- source_word: γονεῖς
  choice: mga magulang
  rationale: Tuwirang katumbas ito ng pangmaramihang pangngalang tumutukoy sa mga magulang ni Jesus.
- source_word: κατ’ ἔτος
  choice: Taun-taon
  rationale: Natural at malinaw na ipinahahayag nito ang distributibong diwang “bawat taon” o “taun-taon.”
- source_word: Ἰερουσαλὴμ
  choice: Jerusalem
  rationale: Karaniwang anyo ng pangalan ng lugar sa modernong Filipino.
- source_word: τῇ ἑορτῇ
  choice: para sa Pista
  rationale: Sa konteksto ng paglalakbay, ipinahihiwatig ng datibo ang okasyon o layunin ng pagpunta. Malinaw itong naipapahayag ng “para sa Pista.”
- source_word: τοῦ πάσχα
  choice: ng Paskuwa
  rationale: Ang πάσχα ay tumutukoy sa kapistahang Judio na karaniwang tinatawag na “Paskuwa” sa Filipino.
theological_decisions:
- issue: Pagtukoy sa mga kapamilya ni Jesus
  choice: ang kanyang mga magulang
  alternative: ang kanyang ama at ina
  rationale: “Mga magulang” ang tahasang sinasabi ng Griyego. Pinananatili nito ang payak na diwa ng salaysay nang hindi nilulutas o itinatanggi ang anumang implikasyong teolohikal kaugnay ng paglilihi kay Jesus.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Inuna ang “Taun-taon” upang malinaw na maitakda ang nakaugaliang kilos, habang pinananatili ang payak na daloy ng talata.
