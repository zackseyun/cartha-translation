source:
  edition: SBLGNT
  text: καὶ εἶπεν πρὸς αὐτούς· Τί ὅτι ἐζητεῖτέ με; οὐκ ᾔδειτε ὅτι ἐν τοῖς τοῦ πατρός μου δεῖ εἶναί με;
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/049.yaml
  text: And he said to them[a], “Why were you looking for me? Did you not know that I must be in my Father’s house?”
translation:
  language: tl
  text: Sinabi niya sa kanila, “Bakit ninyo ako hinahanap? Hindi ba ninyo alam na dapat akong nasa bahay ng aking Ama?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “na dapat akong nasa mga bagay na may kinalaman sa aking Ama,” o “na dapat akong abala sa mga gawain ng aking Ama.” Elliptikal ang pahayag sa Griyego at maaaring tumukoy sa bahay ng Ama o sa mga gawain at kapakanan ng Ama.
    reason: alternative_reading
lexical_decisions:
- source_word: Τί ὅτι
  choice: Bakit
  rationale: Ang idyoma ay nagtatanong ng dahilan. Ang “Bakit” ang pinakanatural at tuwirang katumbas sa modernong Tagalog.
- source_word: ἐζητεῖτέ
  choice: ninyo ako hinahanap
  rationale: Sa konteksto ng paghahanap ng kanyang mga magulang, malinaw at natural ang “hinahanap” para sa ζητέω.
- source_word: οὐκ ᾔδειτε
  choice: Hindi ba ninyo alam
  rationale: Pinananatili nito ang tuwirang kahulugan ng kaalaman o kamalayan at ang anyo ng retorikal na tanong.
- source_word: ἐν τοῖς τοῦ πατρός μου
  choice: nasa bahay ako ng aking Ama
  rationale: Elliptikal ang Griyego, literal na “nasa mga [bagay] ng aking Ama.” Dahil natagpuan si Jesus sa templo, ang “bahay ng aking Ama” ang pinakamalinaw na pagbasa sa pangunahing teksto; inilalahad sa talababa ang tunay na alternatibong diwa.
- source_word: δεῖ
  choice: dapat
  rationale: Ipinahahayag ng δεῖ ang pangangailangan o kinakailangang itinakda; natural itong naipapahayag sa Tagalog sa hulma na “dapat ay nasa...”
- source_word: εἶναί με
  choice: ay nasa
  rationale: Ang εἶναι kasama ang akusatibong simuno ay “ako ay dapat na naroon/maging nasa.” Sa Tagalog, “dapat ay nasa” ang natural na pahayag para sa lokatibong pangunahing pagbasa.
- source_word: πατρός μου
  choice: aking Ama
  rationale: Ang “aking Ama” ay marangal at malinaw na tumutukoy sa Diyos sa kontekstong ito, na kaiba kay Jose, nang hindi nagdaragdag ng paliwanag sa mismong talata.
theological_decisions:
- issue: Ang elliptikal na pariralang ἐν τοῖς τοῦ πατρός μου
  choice: “nasa bahay ako ng aking Ama” sa pangunahing teksto
  alternative: “nakatuon ako sa mga gawain ng aking Ama” / “nasa mga bagay ng aking Ama”
  rationale: Sinusuportahan ng agarang konteksto ng templo ang lokatibong pagbasa na “bahay,” ngunit maaari ring tumukoy ang parirala sa mga gawain o kapakanan ng Ama. Pinananatili sa talababa ang tunay na kalabuan.
- issue: Ang tinutukoy ng “aking Ama”
  choice: Ang Diyos bilang Ama ni Jesus
  alternative: Si Jose bilang ama sa lupa
  rationale: Sa tagpo sa templo, inihahambing ng sinabi ni Jesus ang kanyang kaugnayan sa Diyos sa inaakala ng kanyang mga magulang; pinananatili ng salin ang pahayag nang walang idinagdag na doktrinal na pagpapaliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “ninyo” bilang magalang na pangmaramihang anyo at “aking Ama” upang mapanatili ang bigat ng natatanging pahayag ni Jesus. Inilagay ang talababa pagkatapos ng pangungusap na may kalabuan.
