id: LUK.2.52
reference: Luke 2:52
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ Ἰησοῦς προέκοπτεν ⸂σοφίᾳ καὶ ἡλικίᾳ⸃ καὶ χάριτι παρὰ θεῷ καὶ ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/052.yaml
  text: And Jesus kept increasing in wisdom and stature[b][a], and in favor with God and men.
translation:
  language: tl
  text: At patuloy na lumago si Jesus sa karunungan at pangangatawan[a], at lalo siyang kinalugdan ng Diyos at ng mga tao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “gulang” o “pagkamaygulang.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Griyego ay tumutukoy sa mga tao sa pangkalahatan.
    reason: lexical_clarification
lexical_decisions:
- source_word: προέκοπτεν
  choice: patuloy na lumago
  rationale: Ipinahihiwatig ng aspektong imperpekto ang nagpapatuloy na pag-unlad sa paglipas ng panahon. Likas sa makabagong Tagalog ang “patuloy na lumago” at malinaw na nagsasaad ng tunay na pag-unlad.
- source_word: σοφίᾳ
  choice: karunungan
  rationale: Karaniwang katumbas ito ng σοφία at saklaw nito rito ang pang-unawa at wastong pagpapasiya.
- source_word: ἡλικίᾳ
  choice: pangangatawan
  rationale: Maaaring mangahulugan ang ἡλικία ng edad o taas/pangangatawan. Ang “pangangatawan” ay malinaw na nagpapahayag ng nakikitang pisikal na paglaki, habang inilalahad sa talababa ang tunay na leksikal na kalabuan.
- source_word: χάριτι
  choice: lalo siyang kinalugdan
  rationale: Sa ugnayang “sa Diyos at sa mga tao,” tumutukoy ang χάρις sa pagkalugod o pagsang-ayon, hindi sa abstraktong teolohikal na diwa ng biyayang nagliligtas. Isinalin ang parirala sa likas na Tagalog bilang pagkalugod nila kay Jesus.
- source_word: παρὰ θεῷ
  choice: ng Diyos
  rationale: Ang παρά na may datibo ay nagpapahayag dito ng pagtingin o pakikitungo ng isang persona. Sa pasibong ayos na “kinalugdan,” likas itong ipinahahayag ng pariralang “ng Diyos.”
- source_word: ἀνθρώποις
  choice: mga tao
  rationale: Ang ἄνθρωποι ay tumutukoy dito sa mga tao sa pangkalahatan, hindi lamang sa mga lalaking nasa hustong gulang. Ang “mga tao” ang tumpak at likas na katumbas sa Filipino.
theological_decisions:
- issue: Ang tunay na pag-unlad ni Jesus bilang tao kaugnay ng kaniyang pagkakakilanlan
  choice: Tuwirang sinasabi na patuloy na lumago si Jesus sa karunungan at pangangatawan at lalo siyang kinalugdan.
  alternative: Palabuin o pahinain ang pahayag tungkol sa pag-unlad ni Jesus upang maiwasan ang teolohikal na tensiyon.
  rationale: Malinaw na inilalarawan ng Griyego ang tunay at nagpapatuloy na pag-unlad ni Jesus. Pinananatili ng salin ang pahayag tungkol sa kaniyang ganap na pagkatao nang hindi sinusubukang ipaliwanag o alisin ang teolohikal na tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lalo siyang kinalugdan” upang natural na maipahayag ang pag-unlad sa χάρις παρὰ θεῷ καὶ ἀνθρώποις, habang nananatiling malinaw na Diyos at mga tao ang kumalugod sa kaniya.
