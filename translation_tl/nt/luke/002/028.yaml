base_translation:
  language: en
  yaml_path: translation/nt/luke/002/028.yaml
  text: And he took him into his arms and blessed God and said,[a]
translation:
  language: tl
  text: 'At kinarga[a] niya ang sanggol sa kanyang mga bisig, nagpuri siya sa Diyos, at sinabi:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, tinanggap niya ang sanggol sa kanyang mga bisig. Ang pandiwang Griyego ay maaari ring mangahulugang “tumanggap,” ngunit dahil sa kasunod na “sa kanyang mga bisig,” ang “kinarga” ang natural na salin para sa pisikal na kilos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδέξατο
  choice: kinalong
  rationale: Karaniwang ipinahihiwatig ng pandiwa ang pagtanggap o malugod na pagtanggap, ngunit dahil kasunod ang pariralang εἰς τὰς ἀγκάλας, ang “kinalong” ang pinakanatural na paglalarawan sa pisikal na pagkarga sa sanggol nang hindi nawawala ang diwa ng pagtanggap.
- source_word: αὐτό
  choice: ang sanggol
  rationale: Bagaman neuter ang anyo ng panghalip sa Griyego, tumutukoy ito sa batang si Jesus. Nililinaw ng “ang sanggol” ang tinutukoy at iniiwasan ang malabong paggamit ng “siya” sa Filipino.
- source_word: εἰς τὰς ἀγκάλας
  choice: nakapaloob sa “kinalong”
  rationale: Ang ἀγκάλαι ay mga bisig na ginagamit sa pagyakap o pagkarga. Likas nang saklaw ng pandiwang “kinalong” ang pagkuha sa sanggol sa mga bisig, kaya hindi na kailangan ang mabigat na pariralang “sa kanyang mga bisig” sa pangunahing teksto.
- source_word: εὐλόγησεν τὸν θεόν
  choice: nagpuri sa Diyos
  rationale: Kapag Diyos ang layon ng εὐλογέω, tumutukoy ito sa pagpupuri o pagpapahayag ng mabuti tungkol sa Diyos. Mas malinaw at natural sa modernong Filipino ang “nagpuri sa Diyos” kaysa “pinagpala ang Diyos,” na maaaring magpahiwatig na ang tao ang nagkakaloob ng pagpapala sa Diyos.
- source_word: καὶ εἶπεν
  choice: 'Sinabi niya:'
  rationale: Pinananatili nito ang payak na pagpapatuloy ng salaysay. Ginawang hiwalay na pangungusap at tinapos sa tutuldok upang natural na ipakilala ang kasunod na tuwirang sinabi.
- source_word: αὐτός
  choice: niya
  rationale: Ang tahasang panghalip ay nagpapatuloy sa paksa na si Simeon. Sapat ang karaniwang “niya” sa Filipino; ang “siya mismo” ay magdaragdag ng diin na hindi kailangan sa konteksto.
theological_decisions:
- issue: Ang tinutukoy ng neuter na panghalip na αὐτό
  choice: Tumutukoy ito sa sanggol na si Jesus at isinaling “ang sanggol.”
  alternative: Ang sobrang literal na “ito” batay sa gramatikal na kasarian.
  rationale: Ang gramatikal na anyo ay umaayon sa katawagang Griyego para sa bata, ngunit isang tao ang tinutukoy. Iniiwasan ng personal at malinaw na salin ang maling pagkaunawa nang walang idinaragdag na doktrinang wala sa teksto.
- issue: Kahulugan ng εὐλόγησεν kapag Diyos ang layon
  choice: “nagpuri sa Diyos”
  alternative: “pinagpala ang Diyos”
  rationale: Pinananatili ng salin ang kilos ng pagdakila at mabuting pagsasalita tungkol sa Diyos, habang iniiwasan ang posibleng maling pahiwatig sa kasalukuyang Filipino na si Simeon ang pinagmumulan ng pagpapalang kailangan ng Diyos.
translation_notes:
  register: Modernong, dignified, at madaling maunawaang Filipino. Ginamit ang “kinalong” bilang natural na katumbas ng pisikal na kilos, habang inilagay sa talababa ang mas lantad na diwa ng “tinanggap.” Ang tutuldok ay naghahanda sa tuwirang pananalita sa susunod na talata.
