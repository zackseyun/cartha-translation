source:
  edition: SBLGNT
  text: Καὶ ἦν Ἅννα προφῆτις, θυγάτηρ Φανουήλ, ἐκ φυλῆς Ἀσήρ (αὕτη προβεβηκυῖα ἐν ἡμέραις πολλαῖς, ζήσασα ⸂μετὰ ἀνδρὸς ἔτη⸃ ἑπτὰ ἀπὸ τῆς παρθενίας αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/036.yaml
  text: And there was a prophetess[a], Anna, the daughter of Phanuel, from the tribe of Asher. She was advanced in years, having lived with her husband seven years from her virginity[b],
translation:
  language: tl
  text: Mayroon ding isang propetisa, si Ana, anak ni Fanuel, mula sa lipi ni Aser. Napakatanda na niya[a]. Pitong taon siyang namuhay kasama ng kanyang asawa matapos ang panahon ng kanyang pagkadalaga[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sumulong na sa maraming araw,” isang idyoma para sa katandaan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mula sa kanyang pagkadalaga.” Maaaring tumukoy ito sa panahong nagsimula ang kanyang buhay may-asawa matapos ang kanyang pagkadalaga.
    reason: lexical_alternative
lexical_decisions:
- source_word: προφῆτις
  choice: propetisa
  rationale: Ang pangngalan ay tahasang pambabae at tumutukoy sa isang babaeng propeta. Ang “propetisa” ay maikli, malinaw, at karaniwan sa makabagong Tagalog.
- source_word: θυγάτηρ Φανουήλ
  choice: anak ni Fanuel
  rationale: Likas sa Tagalog ang “anak ni” at hindi kailangang idagdag ang “babae,” sapagkat malinaw na si Ana ang tinutukoy.
- source_word: ἐκ φυλῆς Ἀσήρ
  choice: mula sa lipi ni Aser
  rationale: Ipinahahayag ng ἐκ ang pinagmulan o kinabibilangan; natural sa Tagalog ang “mula sa lipi ni Aser.”
- source_word: προβεβηκυῖα ἐν ἡμέραις πολλαῖς
  choice: napakatanda na
  rationale: Ang literal na “sumulong sa maraming araw” ay isang Griyegong idyoma para sa katandaan. Inihahatid ng “napakatanda na” ang tunay na diwa sa natural na Tagalog.
- source_word: ζήσασα μετὰ ἀνδρὸς ἔτη ἑπτὰ
  choice: pitong taon siyang namuhay kasama ng kanyang asawa
  rationale: Sa konteksto, ang ἀνήρ ay tumutukoy sa asawa at sa buhay may-asawa, hindi lamang sa pakikisama sa isang lalaki.
- source_word: ἀπὸ τῆς παρθενίας αὐτῆς
  choice: mula nang magwakas ang kanyang pagkadalaga
  rationale: Pinananatili nito ang larawan ng pagbilang mula sa pagtatapos ng kanyang παρθενία o kalagayan bilang dalaga, nang hindi nagdaragdag ng higit na tiyak na kronolohiya kaysa sa teksto.
theological_decisions:
- issue: Ang papel ni Ana bilang προφῆτις
  choice: Tahasang tinukoy si Ana bilang isang propetisa.
  alternative: Ituring ang salita bilang karangalang pantawag lamang o bilang paglalarawan sa isang debotong babae.
  rationale: Karaniwang salitang biblikal para sa babaeng propeta ang προφῆτις; hindi ito dapat pahinain o gawing malabo.
- issue: Paglalarawan sa edad ni Ana
  choice: Isinalin ang idyoma ayon sa kahulugang “napakatanda na,” habang ipinaliwanag sa talababa ang literal na larawan.
  alternative: Literal na “sumulong na sa maraming araw.”
  rationale: Hindi natural at maaaring malabo sa Tagalog ang literal na anyo. Ang pangunahing teksto ay naghahatid ng kahulugan, at pinananatili ng talababa ang anyo ng Griyego nang hindi ipinapasok ang pagkukuwenta ng edad mula sa susunod na talata.
- issue: Ang panahong binibilang mula sa παρθενία ni Ana
  choice: Ipinahiwatig na ang pitong taon ng buhay may-asawa ay binilang mula sa pagtatapos ng kanyang pagkadalaga.
  alternative: “Mula sa kanyang pagkadalaga,” na mas literal ngunit maaaring magpahiwatig na nagsimula ang bilang habang dalaga pa siya.
  rationale: Sa konteksto, tumutukoy ang parirala sa paglipat mula sa pagiging dalaga tungo sa pag-aasawa. Nililinaw ng talababa ang mas literal na pagkakasabi at pinananatili ang saklaw ng pahayag.
translation_notes:
  register: Makabago, natural, at marangal na Tagalog. Ginamit ang “Naroon din” upang maiugnay ang pangungusap sa naunang salaysay. Pinanatili ang kuwit sa hulihan sapagkat nagpapatuloy ang pangungusap sa kasunod na talata.
