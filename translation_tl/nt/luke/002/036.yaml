  naturalness: Natural at marangal ang karamihan ng draft. Mas maayos at tuwiran sa modernong Tagalog ang “Mayroon ding isang propetisa, si Ana,” at ang “matapos ang panahon ng kanyang pagkadalaga” ay mas natural kaysa “mula nang magwakas ang kanyang pagkadalaga.”
