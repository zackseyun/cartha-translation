  text: καὶ αὐτοὶ οὐ συνῆκαν τὸ ῥῆμα ὃ ἐλάλησεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/050.yaml
  text: And they did not understand the statement that he spoke to them[a].
translation:
  language: tl
  text: At hindi nila naunawaan ang sinabi niya sa kanila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang salita,” “ang pahayag,” o “ang bagay na tinutukoy.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Karaniwang pang-ugnay na nagpapanatili sa daloy ng salaysay nang hindi nagdaragdag ng tahasang pagsalungat na wala sa Griyego.
- source_word: αὐτοὶ
  choice: nila
  rationale: Tumutukoy sa mga magulang ni Jesus ayon sa konteksto. Hindi kailangan ang emphatic na “sila mismo” sa natural na Tagalog.
- source_word: οὐ συνῆκαν
  choice: hindi nila naunawaan
  rationale: Tuwirang ipinapahayag ng συνίημι ang kawalan ng pagkaunawa; natural at malinaw ito sa modernong Tagalog.
- source_word: τὸ ῥῆμα
  choice: ang sinabi
  rationale: Sa kontekstong ito, tumutukoy ang ῥῆμα sa partikular na pahayag na kababanggit lamang ni Jesus. Mas natural ang “ang sinabi” kaysa literal na “ang salita,” habang ang leksikal na lawak ay iniingatan sa talababa.
- source_word: ὃ ἐλάλησεν αὐτοῖς
  choice: niya sa kanila
  rationale: Kasama ng “ang sinabi,” natural nitong ipinapahayag ang kamag-anak na sugnay na “na sinabi/sinalita niya sa kanila” nang hindi mabigat o paulit-ulit.
theological_decisions:
- issue: Paglalarawan sa tugon ng mga magulang ni Jesus
  choice: Tuwirang sinasabi na hindi nila naunawaan ang sinabi ni Jesus.
  alternative: Hindi nila lubos na naunawaan; hindi nila tinanggap.
  rationale: Kawalan ng pagkaunawa ang ipinahahayag ng Griyego, hindi bahagyang pagkaunawa o pagtanggi. Pinananatili nito ang tensiyon sa salaysay tungkol sa pagkakakilanlan at misyon ni Jesus.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang natural na “ang sinabi niya” upang tukuyin ang partikular na pahayag ni Jesus, habang pinananatili sa talababa ang ibang posibleng diwa ng ῥῆμα.
