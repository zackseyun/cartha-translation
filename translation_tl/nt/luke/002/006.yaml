base_translation:
  language: en
  yaml_path: translation/nt/luke/002/006.yaml
  text: And while they were there[a], the days were fulfilled for her to give birth.
translation:
  language: tl
  text: At habang naroon sila, sumapit ang panahon upang siya ay manganak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “nalubos ang mga araw upang siya ay manganak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: At
  rationale: Sa salaysay, ang pariralang ito ay karaniwang nag-uugnay at nagpapasulong sa pangyayari. Sapat ang “At” upang mapanatili ang ugnayan nang hindi nagiging matigas ang Filipino.
- source_word: ἐν τῷ εἶναι αὐτοὺς ἐκεῖ
  choice: habang naroon sila
  rationale: Ang konstruksiyong may ἐν at articular infinitive ay nagpapahayag ng magkasabay na panahon. Likas at malinaw sa Filipino ang “habang naroon sila.”
- source_word: ἐπλήσθησαν αἱ ἡμέραι
  choice: sumapit ang panahon
  rationale: Ang literal na “nalubos ang mga araw” ay hindi likas sa karaniwang modernong Filipino. Ipinahahayag ng “sumapit ang panahon” na umabot na sa kaganapan ang panahong tinutukoy, habang itinatala sa talababa ang mas literal na anyo.
- source_word: τοῦ τεκεῖν αὐτήν
  choice: upang siya ay manganak
  rationale: Pinananatili nito ang pandiwang diwa ng τεκεῖν at malinaw na si Maria ang manganganak, nang hindi nagdaragdag ng impormasyong wala sa Griyego.
theological_decisions:
- issue: Maaaring pahiwatig ng katuparan o itinakdang panahon sa ἐπλήσθησαν αἱ ἡμέραι
  choice: sumapit ang panahon
  alternative: nalubos ang mga araw
  rationale: Malinaw nitong isinasalaysay na dumating na ang panahon ng panganganak nang hindi tahasang nagdaragdag ng doktrina tungkol sa banal na pagtatakda. Pinananatili ng talababa ang larawan ng pagkalubos o pagkaganap na nasa Griyego.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Iniwasan ang napakaliteral ngunit asiwa na “nalubos ang mga araw” sa pangunahing teksto, ngunit pinanatili ito sa talababa upang makita ang anyo at posibleng himig ng katuparan sa Griyego.
