  text: ἰδόντες δὲ ⸀ἐγνώρισαν περὶ τοῦ ῥήματος τοῦ λαληθέντος αὐτοῖς περὶ τοῦ παιδίου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/017.yaml
  text: And when they saw it[a], they made known the message that had been spoken to them about this child.
translation:
  language: tl
  text: Nang makita nila ito, ipinaalam nila ang mensaheng sinabi sa kanila tungkol sa batang ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “salita” o “pahayag” na sinabi sa kanila tungkol sa batang ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: Nang makita nila ang bata
  rationale: Ang aorist participle ay temporal at nauuna sa pangunahing pandiwa. Walang tahasang layon sa Griyego; idinagdag ang “ang bata” mula sa malinaw na konteksto upang maging likas sa Tagalog.
- source_word: δὲ
  choice: hindi isinalin nang hiwalay
  rationale: Mahinang pang-ugnay ito na nagpapatuloy sa salaysay. Sapat na naipahahayag ng “Nang” at ng daloy ng pangungusap ang ugnayan, kaya ang tahasang “at” ay hindi kailangan sa natural na Tagalog.
- source_word: ἐγνώρισαν
  choice: ipinaalam nila
  rationale: Tuwirang ipinahahayag nito ang diwang ‘ginawang malaman’ o ‘ibinalita,’ nang hindi ipinapalagay na pormal na pangangaral ang ginawa.
- source_word: περὶ τοῦ ῥήματος
  choice: ang mensahe
  rationale: Maaaring mangahulugan ang ῥῆμα ng salita, pahayag, o mensahe. Sa konteksto, tumutukoy ito sa nilalaman ng sinabi sa mga pastol tungkol sa bata; malinaw at natural ang “mensahe.”
- source_word: τοῦ λαληθέντος αὐτοῖς
  choice: sinabi sa kanila
  rationale: Pinananatili nito ang pasibong diwa at ang naunang pagsasalita, ngunit gumagamit ng likas na anyo sa modernong Tagalog.
- source_word: περὶ τοῦ παιδίου τούτου
  choice: tungkol sa batang ito
  rationale: Tumpak at natural na katumbas ng pariralang tumutukoy sa sanggol na si Jesus.
theological_decisions:
- issue: Pagpapakahulugan sa ῥῆμα kaugnay ng pahayag ng anghel
  choice: mensahe
  alternative: salita o pahayag
  rationale: Ang tinutukoy ay ang nilalamang sinabi sa mga pastol tungkol kay Jesus. Malinaw ang “mensahe” sa modernong Tagalog, habang pinananatili sa talababa ang tunay na saklaw ng kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Iniwasan ang masyadong literal ngunit alanganing ayos, habang pinanatili ang pagkakasunod-sunod ng pagkakita at pagpapabatid. Ang tahasang layon na “ang bata” sa unang sugnay ay hango sa konteksto at hindi nakasaad sa Griyego.
