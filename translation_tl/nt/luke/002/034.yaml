  text: καὶ εὐλόγησεν αὐτοὺς Συμεὼν καὶ εἶπεν πρὸς Μαριὰμ τὴν μητέρα αὐτοῦ· Ἰδοὺ οὗτος κεῖται εἰς πτῶσιν καὶ ἀνάστασιν πολλῶν ἐν τῷ Ἰσραὴλ καὶ εἰς σημεῖον ἀντιλεγόμενον,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/034.yaml
  text: And Simeon blessed them and said to Mary his mother, “Look, this one is appointed for the fall and rise of many in Israel, and for a sign that is opposed,[a]”
translation:
  language: tl
  text: At pinagpala sila ni Simeon at sinabi niya kay Maria, na ina ng batang ito, “Tingnan mo, ang batang ito ay itinalaga para sa pagbagsak at pagbangon ng marami sa Israel, at upang maging isang tanda na sasalungatin.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “isang tandang tututulan.”'
    reason: Ang ἀντιλεγόμενον ay maaaring tumukoy sa pagsalungat sa pamamagitan ng salita o sa mas malawak na pagtutol.
lexical_decisions:
- source_word: εὐλόγησεν αὐτούς
  choice: pinagpala sila
  rationale: 'Tuwirang pinananatili ang maramihang layon ng pandiwa: pinagpala ni Simeon ang mga naroon na tinutukoy ng ‘sila.’'
- source_word: Ἰδοὺ
  choice: Tingnan mo
  rationale: Natural na makabagong Tagalog na panawag-pansin, na angkop sa isahang kausap na si Maria.
- source_word: οὗτος κεῖται εἰς
  choice: ang batang ito ay itinalaga upang maging dahilan ng
  rationale: Sa konteksto, ang οὗτος ay tumutukoy sa sanggol; ang κεῖται εἰς ay nagpapahiwatig na siya ay nakatalaga o nakalaan para sa resultang kasunod.
- source_word: πτῶσιν καὶ ἀνάστασιν
  choice: pagbagsak at pagbangon
  rationale: Pinananatili ang magkatapat na larawan at ang pagkakasunod sa Griyego, nang hindi ipinapasyang espirituwal, panlipunan, o pangwakas ang eksaktong tinutukoy.
- source_word: σημεῖον ἀντιλεγόμενον
  choice: isang tandang sasalungatin
  rationale: Ipinahahayag ang tanda na haharap sa pagsalungat; natural ito sa Tagalog at hindi nililimitahan sa pasalitang pagtutol lamang.
theological_decisions:
- issue: Ang kahulugan ng ‘pagbagsak at pagbangon’
  choice: Panatilihin ang dalawang larawang ‘pagbagsak at pagbangon’ nang walang dagdag na paliwanag sa pangunahing teksto.
  alternative: Ipaliwanag bilang kapahamakan at kaligtasan, o bilang pagbagsak at muling pagkabuhay ng iisang pangkat.
  rationale: Hindi tahasang nilulutas ng talata kung magkaibang mga tao o ang iisang mga tao ang tinutukoy, kaya nararapat panatilihin ang tunay na ambiguwidad.
- issue: Ang puwersa ng κεῖται
  choice: itinalaga
  alternative: nakalaan / inilagay
  rationale: Ang ‘itinalaga’ ay malinaw na naghahatid ng pagkakatakda para sa kasunod na bunga, ngunit hindi tinutukoy kung sino ang tahasang gumawa ng pagtatalaga.
translation_notes:
  register: Makabago, dignificado, at madaling maunawaan. Ginamit ang ‘Tingnan mo’ sa halip na arkaikong ‘Narito,’ at ‘ang batang ito’ upang maging malinaw ang reperente sa konteksto.
