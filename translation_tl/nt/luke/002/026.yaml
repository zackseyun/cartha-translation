reference: Luke 2:26
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἦν αὐτῷ κεχρηματισμένον ὑπὸ τοῦ πνεύματος τοῦ ἁγίου μὴ ἰδεῖν θάνατον πρὶν ⸂ἢ ἂν⸃ ἴδῃ τὸν χριστὸν κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/026.yaml
  text: And it had been revealed to him by the Holy Spirit that he would not see death before he had seen the Lord’s Messiah[a].
translation:
  language: tl
  text: At inihayag sa kanya ng Banal na Espiritu na hindi niya makikita ang kamatayan bago niya makita ang Mesiyas ng Panginoon[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas tradisyonal na salin, “ang Cristo ng Panginoon.”
    reason: alternative_reading
lexical_decisions:
- source_word: κεχρηματισμένον
  choice: inihayag sa kanya
  rationale: Ipinahihiwatig ng pasibong anyo ang pagtanggap ng isang pahayag mula sa Diyos; natural sa Filipino ang “inihayag sa kanya,” at malinaw na tinutukoy ng kasunod na parirala ang Banal na Espiritu bilang tagapagpahayag.
- source_word: ὑπὸ τοῦ πνεύματος τοῦ ἁγίου
  choice: ng Banal na Espiritu
  rationale: Ang ὑπό na may genitive ay nagpapahayag ng personal na gumaganap. Sa pasibong pangungusap sa Filipino, likas na ipinakikilala ng “ng” ang Banal na Espiritu bilang siyang nagpahayag.
- source_word: μὴ ἰδεῖν θάνατον
  choice: hindi niya makikita ang kamatayan
  rationale: Pinananatili nito ang literal at makahulugang idyomang “makita ang kamatayan” sa halip na gawing mas interpretatibong “hindi siya mamamatay.” Nauunawaan pa rin ito sa kasalukuyang Filipino.
- source_word: πρὶν ⸂ἢ ἂν⸃ ἴδῃ
  choice: bago niya makita
  rationale: 'Malinaw at natural nitong ipinahahayag ang pagkakasunod: hindi muna niya makikita ang kamatayan hangga''t hindi pa niya nakikita ang tinutukoy na Mesiyas.'
- source_word: τὸν χριστὸν κυρίου
  choice: ang Mesiyas ng Panginoon
  rationale: Dito ang Χριστός ay isang titulong mesiyaniko, kaya “Mesiyas” ang angkop. Pinananatili ng “ng Panginoon” ang maikli at bahagyang bukas na ugnayang ipinahahayag ng genitive κυρίου.
- source_word: κυρίου
  choice: Panginoon
  rationale: Ang “Panginoon” ang karaniwan, marangal, at teolohikong hindi sektaryong katumbas ng κύριος sa kontekstong ito.
theological_decisions:
- issue: Paglilipat sa Χριστός bilang titulong mesiyaniko
  choice: Mesiyas
  alternative: Cristo
  rationale: Gumaganap dito ang Χριστός bilang titulo, hindi bilang pangalang halos pantangi. Mas tuwirang ipinakikita ng “Mesiyas” ang kahulugang “pinahiran,” samantalang inilalagay sa talababa ang tradisyonal na “Cristo.”
- issue: Ugnayan ng genitive sa τὸν χριστὸν κυρίου
  choice: Mesiyas ng Panginoon
  alternative: Mesiyas na mula sa Panginoon
  rationale: Hindi tahasang nilulutas ng salin kung ang genitive ay pangunahing pagmamay-ari, pagtatalaga, o pinagmulan. Ang “ng Panginoon” ay pinakamaikli at pinakamahusay na nagpapanatili sa saklaw ng orihinal.
translation_notes:
  register: Makabago ngunit marangal na Filipino; simple ang balangkas at madaling maunawaan ng karaniwang mambabasa. Pinanatili ang larawan ng “makikita ang kamatayan” at iniwasan ang paliwanag na higit sa sinasabi ng Griyego.
