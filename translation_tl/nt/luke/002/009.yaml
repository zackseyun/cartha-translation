  terminology: Ang “anghel,” “Panginoon,” at “kaluwalhatian” ay matatag, wasto, at angkop sa rehistrong biblikal. Hindi ipinapasok ng salin ang anumang dagdag na doktrinal na pagpapakahulugan.
