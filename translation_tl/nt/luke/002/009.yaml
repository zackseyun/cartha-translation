id: LUK.2.9
reference: Luke 2:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀καὶ ἄγγελος κυρίου ἐπέστη αὐτοῖς καὶ δόξα κυρίου περιέλαμψεν αὐτούς, καὶ ἐφοβήθησαν φόβον μέγαν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/009.yaml
  text: And an angel of the Lord stood before them[a], and the glory of the Lord shone around them[b], and they feared a great fear.
translation:
  language: tl
  text: At tumayo sa tabi nila ang isang anghel ng Panginoon[a], at nagliwanag sa palibot nila ang kaluwalhatian ng Panginoon, at labis silang natakot.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “dumating sa kanila,” “biglang lumitaw sa kanila,” o “tumayo sa harap nila.” Maaaring ipahiwatig ng pandiwang Griyego kapuwa ang biglang pagdating at ang pagtayo malapit sa kanila.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “natakot sila ng malaking takot”—isang idyomang Griyego na nagpapahayag ng matinding takot.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελος κυρίου
  choice: isang anghel ng Panginoon
  rationale: Sa konteksto ng salaysay, ang ἄγγελος ay isang makalangit na “anghel,” hindi lamang isang taong sugo. Walang tiyak na pantukoy sa Griyego, kaya “isang anghel,” hindi “ang anghel.”
- source_word: ἐπέστη αὐτοῖς
  choice: tumayo sa tabi nila
  rationale: Maaaring tumukoy ang ἐφίστημι sa pagdating o biglang paglitaw at pagtayo malapit sa isang tao. Pinananatili ng salin ang kongkretong larawan ng pagtayo nang hindi tahasang nilulutas ang lahat ng posibleng diwa ng pandiwa.
- source_word: δόξα κυρίου
  choice: kaluwalhatian ng Panginoon
  rationale: Tuwirang ipinapahayag nito ang δόξα bilang banal na kaluwalhatian na nahahayag sa maningning na liwanag, nang hindi ito nililimitahan sa “liwanag” lamang.
- source_word: περιέλαμψεν αὐτούς
  choice: nagliwanag sa palibot nila
  rationale: Ipinahihiwatig ng περιλάμπω ang liwanag na sumisinag sa buong palibot o bumabalot sa mga tao.
- source_word: ἐφοβήθησαν φόβον μέγαν
  choice: labis silang natakot
  rationale: Ang pandiwa at kaugnay na pangngalan sa Griyego ay isang paraang idiomatiko upang magpahayag ng matinding takot. Natural at malinaw sa modernong Tagalog ang “labis silang natakot,” habang inilalagay sa talababa ang literal na anyo.
theological_decisions:
- issue: Pagsasalin ng κύριος sa dalawang pariralang genitibo
  choice: Panginoon
  alternative: Ginoo / pinuno
  rationale: Diyos ang malinaw na tinutukoy sa talata. Pinananatili ng “Panginoon” ang bigat ng κύριος sa kontekstong biblikal at hindi ito binababa sa karaniwang katawagan lamang sa isang tao.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “sa tabi nila” upang mapanatili ang kongkretong larawan ng pandiwa; ipinaliwanag sa talababa ang tunay na saklaw ng kahulugan nito. Inilipat ang panandang [b] sa hulihan ng sugnay tungkol sa takot, sapagkat iyon ang paliwanag ng talababa.
