  source_fidelity: Tapat ang salin sa SBLGNT. Ang “isang anghel ng Panginoon” ay wastong walang-tiyak para sa anarthrous na ἄγγελος κυρίου; ang “tumayo sa tabi nila” ay naaayon sa kongkretong diwa ng ἐπέστη αὐτοῖς nang hindi isinasara ang saklaw nito. Wasto ring naipahayag ng “nagliwanag sa palibot nila” ang περιέλαμψεν αὐτούς, at ang “labis silang natakot” ay natural na katumbas ng nagpapatingkad na ἐφοβήθησαν φόβον μέγαν.
