id: LUK.2.19
reference: Luke 2:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἡ δὲ ⸀Μαρία πάντα συνετήρει τὰ ῥήματα ταῦτα συμβάλλουσα ἐν τῇ καρδίᾳ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/019.yaml
  text: But Mary was treasuring up all these words[b][a], pondering them in her heart.
translation:
  language: tl
  text: Ngunit patuloy na iniingatan ni Maria ang lahat ng salitang ito[a] at pinagbubulay-bulay ang mga iyon sa kanyang puso.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang lahat ng bagay na ito,” na may diwang maingat niyang pinanatili ang mga iyon.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang isinaling “pinagbubulay-bulay” ay maaari ring mangahulugang “pinag-uugnay-ugnay” o “sama-samang isinasaalang-alang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Nagpapakita ito ng banayad na paghahambing sa hayagang tugon ng iba at sa tahimik, panloob na tugon ni Maria.
- source_word: συνετήρει
  choice: patuloy na iniingatan
  rationale: Ipinahihiwatig ng imperfect na anyo ang nagpapatuloy na pagkilos, at taglay ng pandiwa ang diwang maingat na pag-iingat o pagpapanatili.
- source_word: πάντα τὰ ῥήματα ταῦτα
  choice: ang lahat ng salitang ito
  rationale: Ang ῥήματα ay maaaring tumukoy sa mga salita, pahayag, o mga bagay na isinalaysay; sa konteksto, malinaw na nakaugnay ito sa mensaheng sinabi ng mga pastol.
- source_word: συμβάλλουσα
  choice: pinagbubulay-bulay
  rationale: Likas at marangal itong Filipino para sa masusing pagninilay, habang hindi ipinapalagay na lubos na naunawaan na ni Maria ang lahat. Ang literal na diwa ng pag-uugnay o pagsasama-sama sa isip ay inilalahad sa talababa.
- source_word: ἐν τῇ καρδίᾳ αὐτῆς
  choice: sa kanyang puso
  rationale: Pinananatili nito ang biblikal na talinghaga para sa panloob na pag-iisip, pagninilay, at damdamin.
- source_word: Μαρία
  choice: Maria
  rationale: Ginamit ang karaniwang anyo ng pangalang ito sa Filipino.
theological_decisions:
- issue: Ang kalikasan ng tugon ni Maria
  choice: Maingat na iningatan ni Maria ang mensahe at patuloy niya itong pinagbulayan.
  alternative: Lubos nang naunawaan ni Maria ang lahat ng nangyari, o basta niya lamang naalala ang mga ito.
  rationale: Ipinakikita ng mga pandiwa ang maingat na pagpapanatili at panloob na pagninilay, ngunit hindi sinasabi ng talata na lubos na ang kanyang pagkaunawa.
translation_notes:
  register: Modernong Filipino na natural at marangal. Ang “patuloy na iniingatan” ay nagpapahayag ng nagpapatuloy na kilos, samantalang ang “pinagbubulay-bulay” at “sa kanyang puso” ay nagpapanatili sa mapagnilay at biblikal na himig ng teksto.
