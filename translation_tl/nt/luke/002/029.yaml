id: LUK.2.29
reference: Luke 2:29
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Νῦν ἀπολύεις τὸν δοῦλόν σου, δέσποτα, κατὰ τὸ ῥῆμά σου ἐν εἰρήνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/029.yaml
  text: Now you are dismissing your servant[a], Master, according to your word[b], in peace.
translation:
  language: tl
  text: “Ngayon, Amo, pinalalaya[a] mo na ang iyong alipin ayon sa iyong salita, nang payapa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinahihintulutan mo nang humayo.” Sa konteksto, ipinahihiwatig na handa na si Simeon na pumanaw, ngunit ang salitang Griyego ay literal na tumutukoy sa pagpapalaya o pagpapaalis.
    reason: alternative_reading
lexical_decisions:
- source_word: Νῦν
  choice: Ngayon
  rationale: Likas at tuwirang panandang temporal na nagpapahayag na sumapit na ang katuparan ng hinihintay ni Simeon.
- source_word: ἀπολύεις
  choice: pinalalaya mo na
  rationale: Pinananatili ang larawan ng pagpapalaya o pagpapaalis nang hindi tahasang ginagawang ‘pinahihintulutang mamatay,’ bagaman iyon ang ipinahihiwatig ng konteksto. Ipinahahayag ng ‘na’ ang kasalukuyang katuparan.
- source_word: τὸν δοῦλόν σου
  choice: ang iyong alipin
  rationale: Ang ‘alipin’ ang pinakamalapit na karaniwang salitang Filipino para sa δοῦλος at pinananatili nito ang ugnayan ng pagmamay-ari at paglilingkod na pinatitingkad ng kasunod na προσφώνηση na δέσποτα.
- source_word: δέσποτα
  choice: Amo
  rationale: Tuwirang ipinapahayag ng ‘Amo’ ang awtoridad ng may-ari o panginoon at malinaw na katambal ng ‘alipin.’
- source_word: κατὰ τὸ ῥῆμά σου
  choice: ayon sa iyong salita
  rationale: Pinananatili ang diwa ng pagkakatugma sa sinabi o ipinangako ng Diyos at ang biblikal na bigat ng ‘salita.’
- source_word: ἐν εἰρήνῃ
  choice: nang payapa
  rationale: Natural na Filipino para sa paraang may kapayapaan, habang pinananatili ang diwa ng mapayapang pagpanaw o paglisan.
theological_decisions:
- issue: Kung tahasang tutukuyin bilang kamatayan ang pagpapalaya kay Simeon
  choice: Panatilihin sa pangunahing teksto ang larawan ng pagpapalaya
  alternative: pinahihintulutan mo nang mamatay ang iyong alipin
  rationale: Malakas ang pahiwatig ng konteksto na handa nang mamatay si Simeon, ngunit ang ἀπολύω ay hindi tahasang nangangahulugang ‘mamatay.’ Pinananatili ng salin ang matalinghagang pahayag at ang hindi tahasang pagbanggit sa kamatayan.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang ‘Amo’ upang mapanatili ang tuwirang pagtutugma ng δέσποτα at δοῦλος (‘Amo’ at ‘alipin’), at ang ‘nang payapa’ para sa natural na daloy sa Filipino.
