base_translation:
  language: en
  yaml_path: translation/nt/luke/002/043.yaml
  text: And when they had completed the days[a], as they were returning, Jesus the boy remained in Jerusalem[b], and his parents did not know it.
translation:
  language: tl
  text: Nang matapos nila ang mga araw ng pagdiriwang, habang pauwi sila, nanatili[a] sa Jerusalem ang batang si Jesus, at hindi ito alam ng kanyang mga magulang.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, nagpaiwan.
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “kanyang mga magulang.” Ang karaniwang pananalita ni Lucas tungkol sa pamilya rito ay hindi nagpapawalang-bisa sa paglilihi ni Jesus sa pamamagitan ng isang birhen, na nauna niyang isinalaysay sa Ebanghelyo.
    reason: cross_reference
lexical_decisions:
- source_word: τελειωσάντων τὰς ἡμέρας
  choice: Nang matapos nila ang mga araw ng pagdiriwang
  rationale: Ang genitive absolute ay naglalahad ng pangyayaring natapos bago ang pangunahing kilos. Idinagdag ang “ng pagdiriwang” mula sa malinaw na konteksto ng Paskuwa upang maging likas sa Tagalog nang hindi tinutukoy nang higit sa sinasabi ng talata.
- source_word: ἐν τῷ ὑποστρέφειν αὐτοὺς
  choice: habang pauwi sila
  rationale: Ang ἐν na may articular infinitive ay nagpapahayag ng kasabay at nagpapatuloy na kilos. Likas na ipinahahayag ito sa Tagalog ng “habang pauwi sila.”
- source_word: ὑπέμεινεν
  choice: nanatili
  rationale: Sa kontekstong ito, nangangahulugan ang ὑπομένω na manatili o magpaiwan. Pinananatili ng “nanatili” ang tuwirang diwa nang hindi ipinapalagay kung sinadya o hindi ang pagkakaiwan.
- source_word: ὁ παῖς
  choice: ang batang si Jesus
  rationale: Maaaring mangahulugan ang παῖς ng bata, batang lalaki, kabataan, o lingkod ayon sa konteksto. Dahil labindalawang taong gulang si Jesus dito, likas at angkop sa edad ang “ang batang si Jesus.”
- source_word: ἐν Ἰερουσαλήμ
  choice: sa Jerusalem
  rationale: Karaniwang lokatibong gamit ito ng ἐν kasama ng pangalan ng lugar.
- source_word: οὐκ ἔγνωσαν
  choice: hindi ito alam
  rationale: Dito, ipinahihiwatig ng γινώσκω ang pagkaalam o pagkatanto sa isang pangyayari. Ginagawang malinaw ng “ito” na hindi nila alam na nanatili si Jesus sa Jerusalem.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: kanyang mga magulang
  rationale: Ang γονεῖς ay tuwirang nangangahulugang “mga magulang.” Iniiwasan ng saling ito ang hindi kailangang pagpapalawak o pagpapaliwanag sa mismong teksto.
theological_decisions:
- issue: Ang pagtukoy kina Maria at Jose bilang γονεῖς ni Jesus
  choice: kanyang mga magulang
  alternative: kanyang ama at ina
  rationale: Tahasang ginagamit ng Griyego ang “kanyang mga magulang.” Pinananatili ng salin ang karaniwang pananalita tungkol sa pamilya nang hindi pinapawalang-bisa o lihim na nilulutas ang tensiyon kaugnay ng paglilihi sa pamamagitan ng birhen na nauna nang isinalaysay ni Lucas.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pauwi” para sa likas na daloy ng salaysay, samantalang pinanatili ang payak na katawagang “mga magulang” ayon sa Griyego. Inilagay ang mga panandang talababa sa mga salitang tunay na tinutukoy ng bawat paliwanag.
