  text: upang magpatala kasama si Maria, na ipinagtipan sa kanya[a] at nagdadalang-tao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na kanyang katipan.” Ang salitang Griyego ay tumutukoy sa pormal na pagkakatipang mag-asawa, na may mas matibay na legal at panlipunang bisa kaysa sa karaniwang pakikipagkasundo sa modernong panahon.
