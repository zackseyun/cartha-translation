lexical_decisions:
- source_word: ἀπογράψασθαι
  choice: upang magpatala
  rationale: Ipinahahayag ng aorist middle infinitive ang layunin ng paglalakbay sa konteksto ng sensus. Ang “magpatala” ay natural at malinaw na katawagang administratibo sa modernong Filipino.
- source_word: σὺν
  choice: kasama
  rationale: Likas na katumbas sa Filipino para sa diwa ng pagsama o accompaniment.
- source_word: Μαριὰμ
  choice: Maria
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa Bibliyang Tagalog.
- source_word: ἐμνηστευμένῃ αὐτῷ
  choice: na ipinagkasundong pakasalan niya
  rationale: Ipinapanatili nito ang pormal at panlipunang bigat ng sinaunang betrothal nang hindi ito ipinagkakamaling ganap nang pag-aasawa. Mas malinaw din ito sa karaniwang mambabasa kaysa sa bihirang “katipan.”
- source_word: οὔσῃ ἐγκύῳ
  choice: at nagdadalang-tao
  rationale: Natural at marangal na paglalarawan sa kalagayan ni Maria; pinananatili nito ang kasabay na pangyayari na ipinahahayag ng participial phrase.
theological_decisions:
- issue: Kalagayang pangmag-asawa ni Maria kaugnay ni Jose
  choice: ipinagkasundong pakasalan niya
  alternative: kasintahan niya; asawa niya
  rationale: Ang μνηστεύομαι ay tumutukoy sa pormal na kasunduang magpakasal na may higit na legal at panlipunang bigat kaysa sa modernong engagement, ngunit hindi dapat isalin dito bilang “asawa” sapagkat lalampas iyon sa tahasang sinasabi ng sugnay.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinili ang “ipinagkasundong pakasalan” upang maipaliwanag sa mismong teksto ang sinaunang betrothal nang hindi gumagamit ng malabo o makalumang salita. Inayos ang mga pananda sa tekstong pangunahing ayon sa pagkakasunod ng kaugnay na mga parirala.
