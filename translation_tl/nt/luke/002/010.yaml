  text: καὶ εἶπεν αὐτοῖς ὁ ἄγγελος· Μὴ φοβεῖσθε, ἰδοὺ γὰρ εὐαγγελίζομαι ὑμῖν χαρὰν μεγάλην ἥτις ἔσται παντὶ τῷ λαῷ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/010.yaml
  text: And the angel said to them[a], “Do not be afraid, for behold, I bring you good news of great joy that will be for all the people,”
translation:
  language: tl
  text: At sinabi sa kanila ng anghel, “Huwag kayong matakot, sapagkat narito, ipinababalita ko sa inyo ang magandang balita tungkol sa malaking kagalakan na darating para sa buong bayan[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “para sa lahat ng tao.” Mas literal sa Griyego ang “para sa buong bayan,” at sa Lucas ay madalas na tiyak ang tinutukoy ng salitang “bayan” ayon sa konteksto.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἄγγελος
  choice: ang anghel
  rationale: Ang tiyak na pantukoy ay tumutukoy pabalik sa anghel na naipakilala na sa naunang konteksto.
- source_word: Μὴ φοβεῖσθε
  choice: Huwag kayong matakot
  rationale: Likas at malinaw na makabagong Tagalog ito para sa maramihang utos na huwag matakot.
- source_word: ἰδοὺ
  choice: narito
  rationale: Pinananatili nito ang mariing pantawag-pansin at marangal na tono ng salitang Griyego nang hindi gumagamit ng mas kaswal na pananalita.
- source_word: γὰρ
  choice: sapagkat
  rationale: Malinaw nitong ipinakikilala ang dahilan kung bakit hindi dapat matakot ang mga pastol.
- source_word: εὐαγγελίζομαι ὑμῖν
  choice: ibinabalita ko sa inyo ang magandang balita
  rationale: Inihahayag nito ang diwang pagpapahayag ng mabuting balita at pinananatili ang tahasang tumatanggap na ὑμῖν, nang hindi ginagawang teknikal na terminong panrelihiyon ang pandiwa.
- source_word: χαρὰν μεγάλην
  choice: malaking kagalakan
  rationale: Tapat ito sa lakas ng pang-uri at likas sa marangal na Tagalog.
- source_word: ἥτις ἔσται
  choice: na magdudulot
  rationale: Likas na inuugnay sa Tagalog ang magandang balita at ang kagalakang magiging bunga nito; ipinapahayag nito ang hinaharap na bisa ng sugnay nang hindi binabago ang pangunahing diwa.
- source_word: παντὶ τῷ λαῷ
  choice: sa buong bayan
  rationale: Ang ‘buong bayan’ ay nagpapanatili sa kolektibo at tiyak na diwa ng may-pantukoy na λαός, na sa agarang konteksto ay malamang na tumutukoy sa bayang Israel.
theological_decisions:
- issue: Saklaw ng παντὶ τῷ λαῷ
  choice: sa buong bayan
  alternative: para sa lahat ng tao
  rationale: Mas natural na ipinahihiwatig ng pantukoy sa Griyego ang isang tiyak na bayan, malamang ang Israel sa agarang tagpo. Hindi nito inuuna ang mas malawak na unibersal na pagbasa, ngunit hindi rin nito itinatanggi ang mas malawak na tema ng kaligtasan sa Lucas.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang mariing “narito,” habang ginawang natural sa Filipino ang ugnayan ng magandang balita at malaking kagalakan. Ang maramihang “kayo” ay hayag sa “kayong” at “inyo.”
