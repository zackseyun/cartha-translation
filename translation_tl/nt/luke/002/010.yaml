  source_fidelity: Kailangang ituwid ang ugnayan ng panghalip na ἥτις at ang pandiwang ἔσται. Ang mga ito ay tumutukoy sa “malaking kagalakan,” hindi sa “magandang balita.” Ang kasalukuyang “magandang balitang magdudulot” ay bahagyang naglilipat ng diin at ginagawang sanhi ang balita sa halip na ilarawan ang kagalakang darating para sa bayan.
  naturalness: Natural at angkop ang “Huwag kayong matakot” at “sapagkat narito.” Mas malinaw at likas ang “magandang balita tungkol sa malaking kagalakan na darating para sa buong bayan,” sapagkat tuwirang ikinakabit nito ang sugnay na hinaharap sa kagalakan.
  terminology: Ang “anghel,” “magandang balita,” “kagalakan,” at “buong bayan” ay angkop sa makabagong Filipino Tagalog at pinananatili ang marangal na rehistro. Ang “buong bayan” ay makatuwirang katumbas ng tiyak at kolektibong τῷ λαῷ; pinananatili ng talababa ang posibleng mas malawak na pagbasa.
