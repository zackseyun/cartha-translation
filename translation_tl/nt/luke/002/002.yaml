    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη
  choice: ito
  rationale: Tumutukoy sa pagpapatalang binanggit sa naunang talata; likas sa Tagalog ang simpleng demonstratibong “ito.”
- source_word: ἀπογραφὴ
  choice: pagpapatalâ
  rationale: Tumutukoy sa opisyal na pagpapatala ng mga tao, na maaaring kaugnay ng pagbubuwis; hindi nito labis na nililimitahan ang kahulugan gaya ng maaaring gawin ng “sensus.”
- source_word: πρώτη
  choice: unang
  rationale: Pinananatili ang pinakatuwirang ordinal na kahulugan na “una,” habang inilalagay sa talababa ang pinagtatalunang temporal na kahulugang “bago.”
- source_word: ἐγένετο
  choice: naganap
  rationale: Natural at marangal na Tagalog para sa pangyayaring naganap o nangyari.
- source_word: ἡγεμονεύοντος
  choice: noong pinamamahalaan ni
  rationale: Ipinahahayag ang kasabay na kalagayan ng genitive absolute nang hindi ipinipilit na isang tiyak na opisyal na titulo ang tinutukoy ng pandiwa.
- source_word: τῆς Συρίας
  choice: Siria
  rationale: Karaniwang anyong Tagalog ng pangalan ng lalawigan.
- source_word: Κυρηνίου
  choice: Quirinio
  rationale: Kinagawiang anyong Tagalog ng pangalang Κυρήνιος.
theological_decisions:
- issue: Kahulugan ng πρώτη sa isang sugnay na pinagtatalunan sa kasaysayan at sintaks
  choice: 'Isinalin sa pangunahing teksto bilang “unang”: “Ang pagpapatalang ito ay unang naganap noong pinamamahalaan ni Quirinio ang Siria.”'
  alternative: “Ang pagpapatalang ito ay naganap bago pinamahalaan ni Quirinio ang Siria.”
  rationale: Ang karaniwang kahulugan ng πρώτη ay ordinal na “una.” Gayunman, dahil ipinapalagay ng ilan ang pahambing na temporal na kahulugang “bago,” pinanatili ang alternatibo sa talababa sa halip na tahimik na lutasin ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Pinanatili ang mga panaklong ng pinagmulang teksto at ang dalawang talababa; iniwasan ang sobrang teknikal na pananalita sa pangunahing teksto.
