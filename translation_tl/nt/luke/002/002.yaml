  text: (Ang pagpapatala na ito ay unang naganap habang namamahala si Quirinio sa Siria.[a][b])
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “Ang pagpapatala na ito ay naganap bago namahala si Quirinio sa Siria.” Nauunawaan ng ilan na ang πρώτη rito ay may pahambing na temporal na kahulugang “bago.”
