id: LUK.2.15
reference: Luke 2:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὡς ἀπῆλθον ἀπ’ αὐτῶν εἰς τὸν οὐρανὸν οἱ ἄγγελοι, ⸀οἱ ποιμένες ⸀ἐλάλουν πρὸς ἀλλήλους· Διέλθωμεν δὴ ἕως Βηθλέεμ καὶ ἴδωμεν τὸ ῥῆμα τοῦτο τὸ γεγονὸς ὃ ὁ κύριος ἐγνώρισεν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/015.yaml
  text: And it happened that when the angels had gone away from them into heaven[a], the shepherds said to one another, “Let us go now to Bethlehem and see this thing that has happened[b], which the Lord has made known to us.”
translation:
  language: tl
  text: Nang umalis na ang mga anghel mula sa kanila patungo sa langit, sinabi ng mga pastol sa isa't isa, “Pumunta na tayo sa Betlehem at tingnan natin ang pangyayaring ito[a] na ipinaalam sa atin ng Panginoon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “salita” o “bagay na nangyari.” Ang Griegong ῥῆμα ay maaaring mangahulugang “salita,” “bagay,” “usapin,” o, gaya rito, “pangyayari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο ὡς
  choice: Nang
  rationale: Ang pormulang pasalaysay at temporal ay likas na naipapahayag sa modernong Tagalog sa pamamagitan ng “Nang,” nang hindi gumagamit ng lipas o mabigat na “At nangyari na.”
- source_word: ἀπῆλθον ἀπ’ αὐτῶν εἰς τὸν οὐρανὸν
  choice: umakyat na sa langit ... at iniwan sila
  rationale: Ipinapakita ng “umakyat na” na nauna ang pag-alis bago nagsalita ang mga pastol; ang “iniwan sila” ay natural na pagpapahayag ng ἀπ’ αὐτῶν, at ang “langit” ay angkop sa banal na larangan sa konteksto.
- source_word: ἐλάλουν πρὸς ἀλλήλους
  choice: sinabi ... sa isa't isa
  rationale: Natural na panimula ito sa tuwirang pananalita at sapat na inilalarawan ang pagpapalitan ng salita ng mga pastol.
- source_word: Διέλθωμεν δὴ ἕως Βηθλέεμ
  choice: Pumunta na tayo sa Betlehem
  rationale: Ang hortatory subjunctive ay malinaw sa “tayo,” samantalang ang “na” ay naghahatid ng agarang puwersa ng δὴ. Sa kontekstong patutunguhan, likas na katumbas ng ἕως ang “sa.”
- source_word: καὶ ἴδωμεν
  choice: at tingnan natin
  rationale: Pinananatili ang ikalawang hortatory subjunctive at natural ang “tingnan” para sa sadyang pagpunta upang masaksihan ang pangyayari.
- source_word: τὸ ῥῆμα τοῦτο τὸ γεγονός
  choice: ang pangyayaring ito[a]
  rationale: Sa konteksto, tumutukoy ang ῥῆμα sa ibinalitang pangyayari. Ang “pangyayari” ay malinaw at natural, habang itinatala sa talababa ang saklaw na “salita” o “bagay/usapin.”
- source_word: ὃ ὁ κύριος ἐγνώρισεν ἡμῖν
  choice: na ipinaalam sa atin ng Panginoon
  rationale: Ang “ipinaalam” ay tumpak at hindi nagpapalabis sa ἐγνώρισεν bilang teknikal na paghahayag; pinananatili ng “Panginoon” ang teolohikal na katawagan nang hindi nililimitahan ang tinutukoy.
theological_decisions:
- issue: Ang tinutukoy ng ὁ κύριος
  choice: Panginoon
  alternative: Tahasang tukuyin bilang Diyos Ama o bilang bagong-silang na Mesiyas
  rationale: Sa agarang konteksto, ang Diyos ang pinagmulan ng ipinaalam ng mga anghel, ngunit hindi higit na tinutukoy ng talata ang persona. Pinananatili ng salin ang katawagan at teolohikal na alingawngaw nang hindi nilulutas ang hindi tahasang nilulutas ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Iniwasan ang lipas na pormulang “At nangyari,” at ginamit ang likas na ayos ng pangungusap. Ang Betlehem ay baybay-Filipino; ang “Panginoon” ay pinanatiling tradisyonal at teolohikal na bukas.
