translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “pangkat ng mga naglalakbay” sa pangunahing teksto upang maiwasan ang posibleng di-pamilyar o makitid na dating ng “karaban.” Inilagay ang marker [b] pagkatapos ng buong sugnay upang iugnay ang paliwanag sa paraan ng paghahanap.
