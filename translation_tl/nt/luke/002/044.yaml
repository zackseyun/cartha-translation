base_translation:
  language: en
  yaml_path: translation/nt/luke/002/044.yaml
  text: But supposing him to be in the traveling group[a], they went a day's journey[b], and they began searching for him among their relatives and acquaintances.
translation:
  language: tl
  text: Ngunit sa pag-aakalang kasama siya sa pangkat ng mga naglalakbay[a], naglakbay sila nang isang araw at sinimulan nilang hanapin siya[b] sa kanilang mga kamag-anak at kakilala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “karaban,” na tumutukoy sa isang pangkat ng mga taong magkakasamang naglalakbay.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “patuloy nilang hinahanap siya,” na nagdiriin sa nagpapatuloy na paghahanap.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νομίσαντες
  choice: sa pag-aakalang
  rationale: Ipinahahayag nito ang pansamantalang palagay nina Maria at Jose, hindi ang tiyak na kaalaman.
- source_word: δὲ
  choice: Ngunit
  rationale: Minamarkahan nito ang banayad na pagsalungat o pagliko mula sa naunang pangyayari.
- source_word: εἶναι ἐν τῇ συνοδίᾳ
  choice: kasama siya sa pangkat ng mga naglalakbay
  rationale: Malinaw at likas itong katumbas ng συνοδία bilang isang pangkat na sama-samang naglalakbay.
- source_word: ἦλθον ἡμέρας ὁδὸν
  choice: naglakbay sila nang isang araw
  rationale: Likas na Filipino para sa idyomang tumutukoy sa paglalakbay na tumagal o umabot sa karaniwang distansiya ng isang araw.
- source_word: ἀνεζήτουν
  choice: hinanap nila
  rationale: Isinasalin ang imperfect bilang nagpatuloy na paghahanap sa konteksto; ipinaliliwanag sa talababa ang aspektong nagpapatuloy.
- source_word: συγγενεῦσιν
  choice: mga kamag-anak
  rationale: Karaniwan, malinaw, at malawak ang saklaw para sa mga kaanak.
- source_word: γνωστοῖς
  choice: mga kakilala
  rationale: Pinananatili ang mas malawak na kahulugan ng mga taong kilala nila, nang hindi ipinapalagay na malalapit na kaibigan ang lahat.
