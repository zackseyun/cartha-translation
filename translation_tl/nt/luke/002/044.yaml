  naturalness: Likas at angkop sa modernong Filipino Tagalog ang “pangkat ng mga naglalakbay,” “mga kamag-anak,” at “mga kakilala.” Ang binagong daloy ay mas tuwiran at hindi nagdaragdag ng di-kailangang pang-abay na pangkasunod.
  terminology: Walang suliranin sa mga pangalan o teolohikal na termino. Ang “karaban” ay katanggap-tanggap na leksikal na kahalili, ngunit dapat ipaliwanag bilang pangkat na magkakasamang naglalakbay.
