  yaml_path: translation/nt/luke/002/008.yaml
  text: And there were shepherds in that same region[b][a], staying out in the fields and keeping watch over their flock by night.
translation:
  language: tl
  text: At may mga pastol sa pook ding iyon na nagpapalipas ng gabi sa parang[a] at nagbabantay sa kanilang kawan sa mga oras ng pagbabantay sa gabi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nanunuluyan sa labas” o “nagkakampo sa parang.” Ipinahihiwatig ng pandiwang Griyego na sa labas, sa parang, nagpapalipas ng gabi ang mga pastol.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “nagbabantay ng mga pagbabantay sa gabi sa kanilang kawan.” Maaaring tumukoy ito sa mga takdang oras ng pagbabantay sa gabi, kabilang ang salit-salitang pagbabantay.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιμένες
  choice: mga pastol
  rationale: Ito ang karaniwan at tiyak na katawagan sa mga nag-aalaga ng mga tupa.
- source_word: ἐν τῇ χώρᾳ τῇ αὐτῇ
  choice: sa lupain ding iyon
  rationale: Ang χώρα ay tumutukoy rito sa kalapit na lupain o pook; likas sa Filipino ang 'sa lupain ding iyon' at naiuugnay nito ang tagpo sa naunang binanggit na lugar.
- source_word: ἀγραυλοῦντες
  choice: nagpapalipas ng gabi sa parang
  rationale: Binibigyang-diin ng pandiwa ang pananatili sa labas, sa bukid o parang, nang magdamag; mas malinaw ito kaysa sa pangkalahatang 'nasa parang.'
- source_word: φυλάσσοντες φυλακὰς τῆς νυκτὸς
  choice: halinhinang nagbabantay ... sa gabi
  rationale: Ang magkaugnay na pandiwa at pangngalan ay literal na tumutukoy sa pagsasagawa ng mga pagbabantay sa gabi, na malamang ay salitan; malinaw at natural sa Filipino ang 'halinhinang nagbabantay.'
- source_word: ἐπὶ τὴν ποίμνην αὐτῶν
  choice: sa kanilang kawan
  rationale: Ang ποίμνη ay kolektibong katawagan sa kawan, at natural itong layon ng 'nagbabantay' sa Filipino.
- source_word: Καὶ
  choice: At
  rationale: Pinananatili nito ang payak na pagpapatuloy ng salaysay na karaniwan sa paggamit ni Lucas ng καί.
- source_word: ἦσαν
  choice: may
  rationale: Ang eksistensiyal na gamit ng εἰμί ay natural na ipinahahayag sa Filipino sa pamamagitan ng 'may.'
