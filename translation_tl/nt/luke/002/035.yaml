  yaml_path: translation/nt/luke/002/035.yaml
  text: and a sword will pass through your own soul also[b][a], so that the thoughts of many hearts may be revealed.
translation:
  language: tl
  text: at isang tabak din ang daraan sa sarili mong kaluluwa[b][a]—upang mahayag ang mga iniisip ng maraming puso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tatagos.” Mas literal na nangangahulugang “daraan sa” ang pandiwang Griyego, ngunit likas na ipinahihiwatig ng larawan ng tabak ang pagtagos.
    reason: lexical_alternative
  - marker: b
    text: Karaniwang inuunawa ang “tabak” bilang larawan ng matinding dalamhating mararanasan ni Maria.
    reason: cultural_note
lexical_decisions:
- source_word: σοῦ ... αὐτῆς
  choice: sarili mong
  rationale: 'Pinananatili nito ang mariing pagtukoy kay Maria: hindi lamang “ang kaluluwa mo” kundi “ang sarili mong kaluluwa.”'
- source_word: ψυχή
  choice: kaluluwa
  rationale: Sa pahayag na ito, tumutukoy ito sa panloob na pagkatao at sa pagdanas ng matinding dalamhati; natural at may angkop na bigat ang “kaluluwa.”
- source_word: διελεύσεται
  choice: pagdaraanan
  rationale: Malapit ito sa literal na diwang “daraan sa/pagdaraanan,” habang hinahayaan ang larawan ng tabak na magpahiwatig ng pagtagos.
- source_word: ῥομφαία
  choice: isang tabak
  rationale: Ang salita ay tumutukoy sa isang malaki at mabigat na espada; sapat at marangal sa Filipino ang pangkalahatang “tabak” nang hindi labis na tinutukoy ang uri nito.
- source_word: ὅπως ἂν
  choice: upang
  rationale: Likas na ipinahahayag ng “upang” ang layunin o resultang nakaugnay sa naunang pahayag.
- source_word: ἀποκαλυφθῶσιν
  choice: mahayag
  rationale: Pinananatili nito ang pasibong diwa ng pagbubunyag o paglalantad.
- source_word: ἐκ πολλῶν καρδιῶν
  choice: ng maraming puso
  rationale: Sa ugnayan nito sa “mga iniisip,” natural sa Filipino ang “mga iniisip ng maraming puso,” na tumutukoy sa mga kaisipang nagmumula sa kalooban.
- source_word: διαλογισμοί
  choice: mga iniisip
  rationale: Malawak at natural itong katumbas ng mga kaisipan o panloob na pangangatuwiran, nang hindi ipinapalagay na mabuti o masama ang mga ito.
theological_decisions:
- issue: Ang tinutukoy ng panghalip at ang kahulugan ng propesiya
  choice: Tuwirang pahayag ito kay Maria tungkol sa matindi niyang personal na pagdurusa, ngunit hindi tinutukoy sa pangunahing teksto ang eksaktong paraan ng katuparan.
  alternative: Tahasang tukuyin ang tabak bilang dalamhati ni Maria sa pagpapako kay Jesus, o bilang sakit na dulot ng pagkakahating hatid ng misyon ni Jesus.
  rationale: Malinaw na si Maria ang kinakausap ng Griyego, ngunit nananatiling matalinghaga ang “tabak.” Dapat panatilihin ang puwang ng teksto at huwag gawing tahasan ang isang partikular na katuparan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinili ang “pagdaraanan” upang mapanatili ang literal na kilos ng Griyego, at inilagay sa talababa ang mas interpretibong “tatagos.”
