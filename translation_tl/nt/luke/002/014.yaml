base_translation:
  language: en
  yaml_path: translation/nt/luke/002/014.yaml
  text: Glory to God in the highest[c][b][a], and on earth peace among people of good pleasure.
translation:
  language: tl
  text: Luwalhati sa Diyos sa kaitaasan, at sa lupa ay kapayapaan sa mga taong kinalulugdan ng Diyos.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas idiomatiko: “sa mga taong kinalulugdan niya.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ganito ang mababasa sa ilang manuskrito: “at sa lupa ay kapayapaan, kabutihang-loob sa mga tao.”'
    reason: textual_variant
lexical_decisions:
- source_word: Δόξα
  choice: Luwalhati
  rationale: Pinananatili nito ang bigat ng pahayag na nagbibigay ng karangalan sa Diyos, nang hindi ito nililimitahan sa mas interpretatibong “papuri.”
- source_word: ἐν ὑψίστοις
  choice: sa kaitaasan
  rationale: Natural at marangal itong pagtukoy sa pinakamataas na dako sa langit at malinaw na katapat ng “sa lupa.”
- source_word: θεῷ
  choice: sa Diyos
  rationale: Ang datibo ay nagpapahayag kung kanino iniuukol ang luwalhati; natural sa Tagalog ang “Luwalhati sa Diyos.”
- source_word: ἐπὶ γῆς
  choice: sa lupa
  rationale: Tuwirang pinananatili ang heograpiko at retorikal na paghahambing sa “kaitaasan.”
- source_word: εἰρήνη
  choice: kapayapaan
  rationale: Saklaw nito ang malawak na biblikal na diwa ng εἰρήνη nang hindi ito pinakikitid.
- source_word: ἐν ἀνθρώποις
  choice: sa mga tao
  rationale: Ang ἄνθρωποι ay tumutukoy rito sa mga tao sa pangkalahatan; ang “mga tao” ang natural at wastong panlahatang anyo sa modernong Tagalog.
- source_word: εὐδοκίας
  choice: kinalulugdan ng Diyos
  rationale: Ipinahahayag sa natural na Tagalog ang genitibong parirala bilang mga taong pinagtutuunan ng banal na pagkalugod o pabor. Ginawang tahasan ang Diyos bilang pinagmumulan ayon sa konteksto, ngunit hindi dinagdagan ng isang mas malawak na doktrinal na paliwanag.
theological_decisions:
- issue: Kahulugan ng genitibong εὐδοκίας sa pahayag ng mga anghel
  choice: Ang kapayapaan ay nasa mga taong kinalulugdan ng Diyos.
  alternative: “Sa lupa ay kapayapaan, kabutihang-loob sa mga tao,” batay sa variant na nominative εὐδοκία; maaari ring isalin nang mas pormal bilang “sa mga taong tumatanggap ng kanyang paglingap.”
  rationale: Genitive ang εὐδοκίας sa SBLGNT, kaya inuugnay nito ang kapayapaan sa mga taong pinagtutuunan ng pagkalugod o pabor. Hindi nito pinipilit ang isang kumpletong doktrina tungkol sa pagkahirang; sinasalamin lamang nito ang sintaks ng tekstong pinagbabatayan. Nakatala sa talababa ang mahalagang variant na nominative.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at angkop sa pampublikong pagbasa. Pinanatili ang maikli at patulang anyo ng pahayag, habang ginawang malinaw sa karaniwang mambabasa ang diwa ng genitibong εὐδοκίας.
