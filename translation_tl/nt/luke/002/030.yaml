translation:
  language: tl
  text: Sapagkat nakita ng aking mga mata ang iyong kaligtasan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaaring isalin: “ang iyong Tagapagligtas.” Sa Griyego, “ang iyong kaligtasan”; sa konteksto, ang kaligtasan ng Diyos ay nahahayag sa persona ni Jesus.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang pahayag ni Simeon. Likas at marangal sa Filipino ang “sapagkat” sa ganitong konteksto.
- source_word: εἶδον
  choice: nakita
  rationale: Ang aorist ay tumutukoy sa naganap nang pagkakita. Sapat na ipinahihiwatig ng perpektibong anyong “nakita” ang pangyayaring may agarang kabuluhan sa kasalukuyan.
- source_word: οἱ ὀφθαλμοί μου
  choice: ng aking mga mata
  rationale: Pinananatili ang tahasang at makapangyarihang larawang “aking mga mata” sa halip na gawing simpleng “ako.”
- source_word: τὸ σωτήριόν σου
  choice: ang iyong pagliligtas
  rationale: Ang σωτήριον ay tumutukoy sa pagliligtas o kaligtasang mula sa Diyos, hindi tuwirang gumagamit ng personal na katawagang “Tagapagligtas.” Ang “pagliligtas” ay natural sa Filipino at pinananatili ang dinamikong diwa ng gawa ng Diyos na nakikita ngayon kay Jesus.
theological_decisions:
- issue: Kung isasalin ang τὸ σωτήριόν σου bilang pagliligtas/kaligtasan o bilang personal na “Tagapagligtas” dahil ang sanggol na Mesiyas ang nasa harap ni Simeon
  choice: ang iyong pagliligtas
  alternative: ang iyong Tagapagligtas
  rationale: Hindi ginamit ng Griyego ang karaniwang personal na pangngalang σωτήρ (“Tagapagligtas”) kundi σωτήριον, na karaniwang tumutukoy sa pagliligtas o kaligtasan. Pinananatili ng salin ang pahayag ni Lucas habang hinahayaang maunawaan ng mambabasa na ang pagliligtas ng Diyos ay nahahayag sa persona ni Jesus.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Pinili ang “sapagkat” upang malinaw na iugnay ang talata sa dahilan ng naunang pahayag, at “pagliligtas” upang mapanatili ang diwa ng orihinal nang hindi agad nilulutas ang ugnayan nito sa persona ni Jesus.
