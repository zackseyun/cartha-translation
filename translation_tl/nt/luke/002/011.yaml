base_translation:
  language: en
  yaml_path: translation/nt/luke/002/011.yaml
  text: because today a Savior was born for you in the city of David[a], who is Messiah the Lord.
translation:
  language: tl
  text: Sapagkat ipinanganak ngayon para sa inyo sa lungsod ni David ang isang Tagapagligtas—siya ang Mesiyas, ang Panginoon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ayon sa mas tradisyonal na pananalita, “Cristo ang Panginoon.” Ang mga titulong Griyego ay χριστὸς κύριος, literal na “Mesiyas Panginoon,” at karaniwang inuunawang “ang Mesiyas, ang Panginoon.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag o batayan ng pahayag ng anghel sa naunang talata; likas at malinaw ito sa makabagong Tagalog.
- source_word: ἐτέχθη
  choice: ipinanganak
  rationale: Tuwirang katumbas ng aorist passive ng τίκτω at natural na anyo sa salaysay ng kapanganakan.
- source_word: ὑμῖν
  choice: para sa inyo
  rationale: Ipinahahayag ng datibo ang kapakinabangan ng mga pinagsasabihan, hindi lamang na sa kanila ibinalita ang kapanganakan.
- source_word: σήμερον
  choice: ngayon
  rationale: Karaniwang makabagong katumbas ng temporal na pang-abay na nangangahulugang ‘sa araw na ito.’
- source_word: σωτὴρ
  choice: Tagapagligtas
  rationale: Napananatili ang diwa ng pagliligtas at ang mesiyanikong bigat ng titulo.
- source_word: ὅς ἐστιν
  choice: siya ang
  rationale: Natural na Tagalog na pagkakakilanlan sa naunang ‘Tagapagligtas’ at sa mga titulong kasunod.
- source_word: χριστὸς
  choice: Mesiyas
  rationale: Ginagamit dito bilang titulo na kaugnay ng pag-asa kay David, kaya isinasalin ang kahulugan sa halip na gawing pangalang ‘Cristo.’
- source_word: κύριος
  choice: Panginoon
  rationale: Karaniwan at may sapat na bigat na salin para sa titulong κύριος sa pahayag na ito.
- source_word: ἐν πόλει Δαυίδ
  choice: sa lungsod ni David
  rationale: Likas na Tagalog na pinananatili ang ugnayang Davidiko at hindi tahasang ipinapalit ang pangalang Bethlehem.
theological_decisions:
- issue: Pagkakaugnay ng χριστὸς κύριος
  choice: ang Mesiyas, ang Panginoon
  alternative: ang Mesiyas ng Panginoon; Cristo na Panginoon
  rationale: Pinakamalapit itong nagpapakita sa dalawang nominative na titulo bilang magkatabing pagkakakilanlan ng Tagapagligtas. Hindi pinili sa pangunahing teksto ang ‘Mesiyas ng Panginoon’ dahil mangangailangan iyon ng genitibong ugnayang hindi hayag sa anyong Griyego; inilalahad sa talababa ang tradisyonal na ‘Cristo’ nang hindi ito ipinapalit sa kahulugan ng titulong χριστός.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang gitling na em upang malinaw na ipakilala ang pagkakakilanlan ng ‘Tagapagligtas’ nang hindi pinapawi ang siksik at bahagyang hindi tiyak na pagkakaugnay ng dalawang titulong Griyego.
