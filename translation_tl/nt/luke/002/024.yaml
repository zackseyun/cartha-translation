base_translation:
  language: en
  yaml_path: translation/nt/luke/002/024.yaml
  text: 'and to offer a sacrifice according to what had been said in the Law of the Lord: a pair of turtledoves or two young pigeons[a].'
translation:
  language: tl
  text: 'at upang maghandog ng hain ayon sa sinabi sa Kautusan ng Panginoon: isang pares ng mga batu-bato o dalawang inakay na kalapati.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ayon sa nakasaad sa Kautusan ng Panginoon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ δοῦναι θυσίαν
  choice: upang maghandog
  rationale: Ang articular infinitive ay nagpapahayag ng layunin. Bagaman literal na ‘magbigay ng handog,’ ang ‘maghandog’ ang likas at tuwirang katumbas sa Filipino at sapat nang ipinahihiwatig ang paghahain.
- source_word: κατὰ τὸ εἰρημένον
  choice: ayon sa sinabi
  rationale: Pinananatili nito ang pandiwang diwa ng λέγω at ang bisa ng nasabi at nananatiling nakasulat, nang hindi idinaragdag ang mas interpretibong ‘iniutos.’
- source_word: ἐν τῷ νόμῳ κυρίου
  choice: sa Kautusan ng Panginoon
  rationale: Ang ‘Kautusan’ ay tumutukoy rito sa Kautusang Mosaiko bilang Kasulatan; ‘Panginoon’ ang karaniwang katumbas ng κύριος sa Bagong Tipan.
- source_word: ζεῦγος τρυγόνων
  choice: isang pares ng mga batu-bato
  rationale: Ang ζεῦγος ay isang pares, at ang τρυγών ay espesipikong turtledove, na karaniwang tinatawag na ‘batu-bato’ sa Filipino.
- source_word: δύο νοσσοὺς περιστερῶν
  choice: dalawang inakay na kalapati
  rationale: Ang νοσσός ay batang ibon o inakay, at ang περιστερά ay kalapati; malinaw at likas ang parirala sa modernong Filipino.
theological_decisions:
- issue: Paglalarawan sa κύριος sa pormulang tumutukoy sa banal na Kautusan
  choice: Panginoon
  alternative: YAHWEH
  rationale: Ang tekstong Griyego ng Bagong Tipan ay may κύριος. Pinananatili ng ‘Panginoon’ ang anyo ng pinagmulan at hindi tahasang ipinapalit ang pinagbabatayang banal na pangalan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘batu-bato’ bilang tiyak na pangalan ng turtledove, habang ‘inakay na kalapati’ ang natural na paglalarawan sa batang pigeon/dove. Ang panipi ay nagpapakitang sipi o pormula mula sa Kautusan ang kasunod na mga salita.
