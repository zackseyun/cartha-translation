  text: καὶ ὑπέστρεψαν οἱ ποιμένες δοξάζοντες καὶ αἰνοῦντες τὸν θεὸν ἐπὶ πᾶσιν οἷς ἤκουσαν καὶ εἶδον καθὼς ἐλαλήθη πρὸς αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/020.yaml
  text: And the shepherds returned[a], glorifying and praising God for all that they had heard and seen[c][b], just as it had been told to them.
translation:
  language: tl
  text: Bumalik[a] ang mga pastol habang niluluwalhati at pinupuri ang Diyos dahil sa lahat ng kanilang narinig at nakita,[b] gaya mismo ng sinabi sa kanila.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Nagbalik.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “ukol sa lahat ng kanilang narinig at nakita.”
    reason: lexical_alternative
  - marker: c
    text: Sa Griyego, balintiyak ang “sinabi sa kanila”; hindi tahasang pinangalanan sa sugnay na ito kung sino ang nagsabi.
    reason: source_clarity
lexical_decisions:
- source_word: ὑπέστρεψαν
  choice: Bumalik
  rationale: Ang aorist na pandiwa ay tumutukoy sa pagbabalik ng mga pastol mula sa kanilang pagdalaw. Likas at tuwiran sa modernong Tagalog ang “bumalik.”
- source_word: οἱ ποιμένες
  choice: ang mga pastol
  rationale: Karaniwang tawag sa mga tagapag-alaga ng tupa at malinaw na tumutukoy sa mga lalaking binanggit sa naunang salaysay.
- source_word: δοξάζοντες καὶ αἰνοῦντες
  choice: habang niluluwalhati at pinupuri
  rationale: Pinananatili ang dalawang magkaugnay ngunit hindi ganap na magkaparehong kilos. Ipinakikita ng “habang” na kasabay ng kanilang pagbabalik ang patuloy na pagluwalhati at pagpuri.
- source_word: τὸν θεὸν
  choice: ang Diyos
  rationale: Tuwirang layon ito ng parehong pandiwaring “niluluwalhati” at “pinupuri.”
- source_word: ἐπὶ πᾶσιν οἷς
  choice: dahil sa lahat ng kanilang
  rationale: Sa kontekstong ito, ipinahahayag ng ἐπί na may datibo ang dahilan o batayan ng kanilang pagpuri. Natural sa Tagalog ang “dahil sa lahat ng.”
- source_word: ἤκουσαν καὶ εἶδον
  choice: narinig at nakita
  rationale: Ang mga kilos na ito ay nangyari bago ang kanilang pagbabalik, at natural na ipinahahayag iyon ng mga aspektong Tagalog na “narinig” at “nakita” nang hindi labis na tinutukoy ang panahunan.
- source_word: καθὼς ἐλαλήθη πρὸς αὐτούς
  choice: gaya mismo ng sinabi sa kanila
  rationale: Pinananatili ng “gaya mismo” ang paghahambing ng καθώς, at ng balintiyak na “sinabi sa kanila” ang hindi tahasang pagbanggit sa nagsalita.
theological_decisions:
- issue: Kung tahasang tutukuyin ang anghel o mga anghel bilang nagsabi sa mga pastol
  choice: gaya mismo ng sinabi sa kanila
  alternative: gaya mismo ng sinabi sa kanila ng anghel
  rationale: Bagaman ipinahihiwatig ng konteksto ang mensahe ng anghel, hindi pinangalanan sa sugnay na ito ang nagsalita. Pinananatili ng salin ang balintiyak at hindi nagdaragdag ng tahasang tagaganap.
translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Tagalog. Ang “habang” ay natural na naghahatid sa kasabay na kilos ng mga participle, samantalang pinananatili ang dalawang natatanging pandiwa para sa pagluwalhati at pagpuri.
