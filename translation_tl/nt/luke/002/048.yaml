  to: Nang makita nila siya, labis silang namangha, at sinabi sa kanya ng kanyang ina, “Anak, bakit mo ginawa ito sa amin? Tingnan mo, ang iyong ama at ako ay hinahanap ka namin nang may matinding dalamhati.[a]”
