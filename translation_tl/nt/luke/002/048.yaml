  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἰδόντες αὐτὸν ἐξεπλάγησαν, καὶ ⸂εἶπεν πρὸς αὐτὸν ἡ μήτηρ αὐτοῦ⸃· Τέκνον, τί ἐποίησας ἡμῖν οὕτως; ἰδοὺ ὁ πατήρ σου καὶ ἐγὼ ὀδυνώμενοι ⸀ἐζητοῦμέν σε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/048.yaml
  text: And when they saw him[a], they were astonished, and his mother said to him, “Child, why have you done this to us? Look, your father and I have been anxiously looking for you.”
translation:
  language: tl
  text: Nang makita nila siya, labis silang namangha, at sinabi sa kanya ng kanyang ina, “Anak, bakit mo ginawa ito sa amin? Tingnan mo, ang iyong ama at ako ay hinahanap ka namin nang may matinding dalamhati.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa matinding pagkabalisa” o “sa matinding pagdurusa.” Ang salitang Griyego ay nagsasaad ng masakit na damdamin habang patuloy nilang hinahanap siya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: Nang makita nila
  rationale: Ginawang sugnay na temporal ang aorist participle upang natural na maipahayag sa Tagalog ang pagkakasunod ng mga pangyayari.
- source_word: ἐξεπλάγησαν
  choice: labis silang namangha
  rationale: Ipinahahayag nito ang matinding pagkagulat o pagkamangha na taglay ng pandiwang Griyego.
- source_word: Τέκνον
  choice: Anak
  rationale: Natural itong mapagmahal na tawag ng isang magulang sa kanyang anak at hindi kailangang dagdagan ng panghalip na pag-aari.
- source_word: τί ἐποίησας ἡμῖν οὕτως
  choice: bakit mo ginawa ito sa amin?
  rationale: Ang 'bakit' ang likas na anyo ng tanong sa Tagalog para sa reklamong ipinahihiwatig ng parirala, habang pinananatili ng 'sa amin' ang ugnayang ipinahahayag ng ἡμῖν.
- source_word: ἰδοὺ
  choice: Tingnan mo
  rationale: Isang kasalukuyan at natural na panawag-pansin sa tuwirang pananalita, nang hindi gumagamit ng makalumang pananalita.
- source_word: ὁ πατήρ σου
  choice: ang iyong ama
  rationale: Tuwirang pinananatili ang simpleng katawagan sa Griyego at hindi dinaragdagan ng interpretatibong salitang gaya ng 'ama sa lupa.'
- source_word: ὀδυνώμενοι
  choice: labis na nababalisa
  rationale: Inilalarawan nito ang masakit at matinding emosyonal na pagkabalisa habang nagpapatuloy ang paghahanap; ipinaliliwanag sa talababa ang mas matitinding posibleng katumbas.
- source_word: ἐζητοῦμέν σε
  choice: sa paghahanap sa iyo
  rationale: Kasama ng 'labis na nababalisa,' natural nitong ipinahahayag sa Tagalog ang nagpapatuloy na paghahanap hanggang sa sandali ng pagsasalita.
theological_decisions:
- issue: Ang pagtukoy kay Jose bilang 'iyong ama' kaugnay ng banal na pagiging Anak ni Jesus
  choice: Pinanatili sa pangunahing teksto ang payak na 'ang iyong ama' nang walang dagdag na paliwanag.
  alternative: ang iyong ama sa lupa
  rationale: Ganito mismo tinutukoy ni Maria si Jose sa salaysay. Ang pagdaragdag ng 'sa lupa' ay magpapaliwanag sa halip na magsalin at papawiin ang sinadyang tensiyong nililinaw ng kasunod na talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang tawag na “Anak” at iniwasan ang makalumang mga salita. Ang marker na [a] ay inilagay sa pariralang aktuwal na tinutukoy ng talababa.
