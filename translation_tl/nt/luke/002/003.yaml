  text: And everyone was going to be registered[b][a], each to his own city.
translation:
  language: tl
  text: At ang lahat ay naglalakbay upang magpatala[a], bawat isa sa sarili niyang lungsod.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “upang magparehistro” o “upang maitala.” Tumutukoy ang pandiwa sa opisyal na pagpapatala para sa sensus.
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, isahang panlalaki ang anyo ng “bawat isa sa sarili niyang lungsod.” Walang ipinahahayag na kasarian ang “niyang” sa Filipino.
    reason: source_form
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: pumupunta
  rationale: Ipinahihiwatig ng imperpektong anyo ang nagpapatuloy o paulit-ulit na pagpunta ng mga tao sa takbo ng salaysay; likas itong naipapahayag ng “pumupunta.”
- source_word: πάντες
  choice: ang lahat
  rationale: Tuwirang ipinapahayag ang kabuuang saklaw ng πάντες nang hindi nagdaragdag ng pangngalang wala sa Griyego.
- source_word: ἀπογράφεσθαι
  choice: upang magpatala
  rationale: Tumutukoy ito sa opisyal na pagpapatala kaugnay ng sensus. Ang “magpatala” ay malinaw at natural sa makabagong Filipino, at napapanatili ang diwang ang tao ay nagpapalista sa awtoridad.
- source_word: ἕκαστος
  choice: bawat isa
  rationale: 'Pinananatili nito ang distributibong diin: isa-isang pumupunta ang lahat.'
- source_word: ἑαυτοῦ
  choice: sarili niyang
  rationale: Pinananatili ng parirala ang isahang reflexive na kahulugan. Walang likas na kasariang gramatikal ang panghalip na Filipino, kaya hindi artipisyal na nilagyan ng “lalaki” ang salin; ipinaliliwanag sa talababa ang anyo ng Griyego.
- source_word: πόλιν
  choice: lungsod
  rationale: Karaniwang kahulugan ng πόλις ang “lungsod” o “bayan.” Pinili ang “lungsod” bilang mas tuwirang katumbas at upang hindi ipakahulugan agad na “bayang sinilangan” o “sariling bayan.”
theological_decisions:
- issue: Ang panlalaking isahang anyo ng ἕκαστος ... ἑαυτοῦ
  choice: bawat isa sa sarili niyang lungsod
  alternative: bawat lalaki sa sarili niyang lungsod
  rationale: Isahan ang distributibong parirala at panlalaki ang anyong gramatikal sa Griyego, ngunit hindi nito kinakailangang sabihin na mga lalaki lamang ang tinutukoy ng πάντες. Dahil walang kasariang gramatikal ang “niya” sa Filipino, pinananatili ang likas na isahang pagpapahayag at iniiwasang magdagdag ng limitasyong hindi tiyak sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal ang rehistro. Ginamit ang “pumupunta” upang maipadama ang nagpapatuloy na kilos sa salaysay, at “magpatala” bilang karaniwang salitang Filipino para sa opisyal na pagpaparehistro.
