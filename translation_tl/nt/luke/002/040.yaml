id: LUK.2.40
reference: Luke 2:40
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Τὸ δὲ παιδίον ηὔξανεν καὶ ἐκραταιοῦτο ⸂πληρούμενον σοφίᾳ⸃, καὶ χάρις θεοῦ ἦν ἐπ’ αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/040.yaml
  text: And the child grew and became strong[a], being filled with wisdom, and the favor of God was upon him.
translation:
  language: tl
  text: At patuloy na lumaki at lumakas ang bata, na napupuno ng karunungan; at nasa kanya ang kagandahang-loob ng Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ang biyaya ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ δὲ παιδίον
  choice: At ... ang bata
  rationale: Ang παιδίον ay tumutukoy sa isang bata, na angkop sa konteksto ng pagkabata ni Jesus. Banayad na pang-ugnay ang δέ, kaya natural itong isinalin na “At.”
- source_word: ηὔξανεν
  choice: patuloy na lumaki
  rationale: Ang imperfect na anyo ng αὐξάνω ay nagpapahiwatig ng nagpapatuloy na paglaki; malinaw itong naipapahayag ng “patuloy na lumaki.”
- source_word: ἐκραταιοῦτο
  choice: lumakas
  rationale: Ipinahihiwatig ng imperfect middle/passive na anyo ang unti-unti o nagpapatuloy na paglakas. Kasama ng “patuloy na,” natural sa Tagalog ang “lumaki at lumakas.”
- source_word: πληρούμενον σοφίᾳ
  choice: habang napupuno siya ng karunungan
  rationale: Ang present participle ay naglalarawan ng kasabay at nagpapatuloy na kalagayan ng bata. Ang σοφίᾳ ay nilalaman ng pagkapuno, kaya “ng karunungan.”
- source_word: χάρις θεοῦ
  choice: ang kagandahang-loob ng Diyos
  rationale: Maaaring mangahulugan ang χάρις ng biyaya, pabor, o mabuting paglingap. Ang “kagandahang-loob” ay natural at marangal na paglalarawan ng mabuting disposisyon at paglingap ng Diyos, habang pinananatili sa talababa ang leksikal at teolohikal na mahalagang alternatibong “biyaya.”
- source_word: ἦν ἐπ’ αὐτό
  choice: nasa kanya
  rationale: Ipinapahayag ng parirala na ang kagandahang-loob ng Diyos ay nananatili o nakalukob sa bata. Ang “nasa kanya” ay malinaw at natural sa makabagong Tagalog nang hindi dinaragdagan ang kahulugan.
theological_decisions:
- issue: Pagpapakahulugan sa χάρις θεοῦ sa konteksto ng paglaki ni Jesus
  choice: ang kagandahang-loob ng Diyos
  alternative: ang biyaya ng Diyos
  rationale: Hindi dapat ipakahulugan ng salin na may kakulangan sa banal na kalikasan ni Jesus. Inilalarawan dito ang paglingap ng Diyos sa konteksto ng tunay na paglaki ng bata. Gayunman, tunay na leksikal na posibilidad ang “biyaya,” kaya inilagay ito sa talababa sa halip na alisin ang tensiyon ng salita.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “patuloy na” upang maipakita ang progresibong diwa ng mga imperfect, at ang “habang” upang mapanatili ang kasabay na diwa ng participle. Inilagay ang talababa pagkatapos ng pariralang tinutukoy nito.
