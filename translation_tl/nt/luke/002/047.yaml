  yaml_path: translation/nt/luke/002/047.yaml
  text: And all who heard him were astonished at his understanding and his answers[a].
translation:
  language: tl
  text: At ang lahat ng nakarinig sa kanya ay labis na namangha sa kanyang pang-unawa at sa kanyang mga sagot.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “namangha.” Ang pandiwang Griyego ay nagpapahayag ng matinding pagkamangha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: labis na namangha
  rationale: Ipinahahayag ng imperpektong anyo ang patuloy na matinding pagkamangha. Natural sa modernong Tagalog ang “labis na namangha” at hindi ito nagdadala ng nakalilitong literal na idyoma.
- source_word: δὲ
  choice: At
  rationale: Mahinang pang-ugnay ang δέ rito; ang “At” ang pinakanatural sa daloy ng salaysay at hindi nagpapahiwatig ng matinding pagsalungat.
- source_word: πάντες οἱ ἀκούοντες αὐτοῦ
  choice: ang lahat ng nakarinig sa kanya
  rationale: Pinananatili nito ang pangkalahatang saklaw ng πάντες at likas na ipinapahayag sa Tagalog ang participial phrase bilang sugnay.
- source_word: ἐπὶ τῇ συνέσει
  choice: sa kanyang pang-unawa
  rationale: Ang ἐπί na may datibo ay nagpapakilala sa dahilan o batayan ng pagkamangha, samantalang ang σύνεσις ay tumutukoy sa pagkaunawa o malalim na kabatiran.
- source_word: ταῖς ἀποκρίσεσιν αὐτοῦ
  choice: sa kanyang mga sagot
  rationale: Ang ἀπόκρισις ay sagot o tugon; ang “mga sagot” ay malinaw at angkop sa konteksto ng pag-uusap.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “pang-unawa” sa halip na mas teknikal na “katalinuhan” upang idiin ang pagkaunawang ipinakikita ng mga sagot. Inilagay ang pananda ng talababa sa mismong teksto.
