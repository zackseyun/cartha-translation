id: LUK.2.27
reference: Luke 2:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἦλθεν ἐν τῷ πνεύματι εἰς τὸ ἱερόν· καὶ ἐν τῷ εἰσαγαγεῖν τοὺς γονεῖς τὸ παιδίον Ἰησοῦν τοῦ ποιῆσαι αὐτοὺς κατὰ τὸ εἰθισμένον τοῦ νόμου περὶ αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/027.yaml
  text: And he came in the Spirit into the temple[a]; and when the parents brought in the child Jesus to do for him according to the custom of the law[b],
translation:
  language: tl
  text: At pumasok siya sa templo sa patnubay ng Espiritu[a]. Nang ipasok ng mga magulang ang sanggol na si Jesus upang gawin para sa kanya ang naaayon sa kaugalian ng Kautusan[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na salin, “sa Espiritu.” Maaari ring ipahiwatig ng pariralang Griyego na siya ay pumaroon sa patnubay o kapangyarihan ng Espiritu.
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “ang mga magulang.” Karaniwang wikang pampamilya ang ginagamit dito ni Lucas para kina Maria at Jose habang inaalagaan nila si Jesus.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ πνεύματι
  choice: sa patnubay ng Espiritu
  rationale: Sa konteksto ng Lucas 2:25–27, ang tinutukoy ay ang Banal na Espiritu. Ipinahahayag ng natural na pariralang Filipino ang instrumental o gumagabay na diwa, habang itinatala sa talababa ang mas pormal na 'sa Espiritu.'
- source_word: ἱερόν
  choice: templo
  rationale: Tumutukoy ang ἱερόν sa kabuuang lugar ng templo, hindi lamang sa santuwaryo; ang 'templo' ang malinaw at karaniwang salin sa Filipino.
- source_word: ἐν τῷ εἰσαγαγεῖν
  choice: Nang ipasok
  rationale: Ang articular infinitive na may ἐν ay temporal; natural itong ipinahahayag sa Filipino sa pamamagitan ng 'nang.'
- source_word: γονεῖς
  choice: mga magulang
  rationale: Ito ang tuwirang kahulugan ng salitang Griyego at karaniwang paglalarawan ni Lucas kina Maria at Jose sa kanilang pangangalaga kay Jesus.
- source_word: παιδίον Ἰησοῦν
  choice: ang sanggol na si Jesus
  rationale: Sa agarang konteksto, si Jesus ay isang sanggol. Mas tiyak at natural dito ang 'sanggol' kaysa sa mas malawak na 'bata.'
- source_word: τοῦ ποιῆσαι αὐτοὺς ... περὶ αὐτοῦ
  choice: upang gawin para sa kanya
  rationale: Ipinahahayag nito ang layunin ng mga magulang at ang kaugnayan ng gagawin kay Jesus, nang hindi dinaragdagan ang ritwal na hindi tahasang binanggit sa talata.
- source_word: κατὰ τὸ εἰθισμένον τοῦ νόμου
  choice: ang naaayon sa kaugalian ng Kautusan
  rationale: Pinananatili ng 'kaugalian' ang diwa ng εἰθισμένον, samantalang ang 'naaayon sa' ay natural na nagpapahayag ng κατὰ. Ginamit ang malaking titik sa 'Kautusan' bilang tiyak na pagtukoy sa Kautusan ni Moises.
theological_decisions:
- issue: Ang tinutukoy ng πνεῦμα sa pagkilos ni Simeon
  choice: ang Banal na Espiritu
  alternative: sariling espiritu o kalooban ni Simeon
  rationale: Ang magkakasunod na pagbanggit sa Banal na Espiritu sa Lucas 2:25–27 ay mariing sumusuporta sa pagbasa na ito. Ang 'Espiritu' ay naka-capitalize, ngunit kinikilala sa talababa ang maaaring mas pormal na anyo ng parirala.
- issue: Pagtawag kina Maria at Jose na 'mga magulang'
  choice: tuwirang isalin ang γονεῖς bilang 'mga magulang'
  alternative: '''mga tagapag-alaga'' o ''Jose at Maria'''
  rationale: Ginagamit ng teksto ang ordinaryong wikang pampamilya. Hindi nito pinapawalang-bisa ang birheng paglilihi; inilalarawan nito ang kinikilalang papel nina Maria at Jose sa pamilya at sa pangangalaga kay Jesus.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang 'sa patnubay ng Espiritu' para sa natural na daloy, habang pinananatili sa talababa ang mas pormal na 'sa Espiritu.' Ang pangungusap ay sadyang nagtatapos sa kuwit dahil nagpapatuloy ang estruktura sa kasunod na talata.
