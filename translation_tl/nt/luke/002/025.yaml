id: LUK.2.25
reference: Luke 2:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ ⸂ἄνθρωπος ἦν⸃ ἐν Ἰερουσαλὴμ ᾧ ὄνομα Συμεών, καὶ ὁ ἄνθρωπος οὗτος δίκαιος καὶ εὐλαβής, προσδεχόμενος παράκλησιν τοῦ Ἰσραήλ, καὶ πνεῦμα ἦν ἅγιον ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/025.yaml
  text: And behold[a], there was a man in Jerusalem whose name was Simeon, and this man was righteous and devout, waiting for the consolation of Israel[b], and the Holy Spirit was upon him.
translation:
  language: tl
  text: At narito, may isang lalaki sa Jerusalem na ang pangalan ay Simeon. Ang lalaking ito ay matuwid at maka-Diyos, naghihintay sa kaaliwan ng Israel[a], at nasa kanya ang Banal na Espiritu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pag-aliw sa Israel.” Tumutukoy ang parirala sa inaasahang pag-aliw at pagpapanumbalik ng Diyos sa Israel.
    reason: lexical_alternative
  - marker: b
    text: Posible rin ang “isang banal na espiritu ang nasa kanya,” bagaman sa konteksto ni Lucas ay pinakamalamang na ang Banal na Espiritu ang tinutukoy.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: narito
  rationale: Pinanatili bilang malinaw at marangal na panandang diskurso na nagbibigay-diin sa pagpasok ni Simeon sa salaysay.
- source_word: ἄνθρωπος
  choice: isang lalaki
  rationale: Lalaki ang tinutukoy na indibidwal, si Simeon, kaya ang salin ay tiyak sa kasarian at natural sa Filipino.
- source_word: ᾧ ὄνομα Συμεών
  choice: na ang pangalan ay Simeon
  rationale: Likas na katumbas sa Filipino na nagpapanatili sa pagkakakilanlang ipinahahayag ng Griyego.
- source_word: δίκαιος
  choice: matuwid
  rationale: Pinananatili ang moral at tipanang diwa ng paglalarawan kay Simeon.
- source_word: εὐλαβής
  choice: maka-Diyos
  rationale: Natural at maikling paglalarawan sa isang taong may taimtim na paggalang at debosyon sa Diyos.
- source_word: προσδεχόμενος
  choice: naghihintay
  rationale: Ipinahahayag ang patuloy at may-pag-asang paghihintay na nasa pandiwaring Griyego.
- source_word: παράκλησιν τοῦ Ἰσραήλ
  choice: kaaliwan ng Israel
  rationale: Pinananatili ang mayamang diwa ng ipinangakong pag-aliw at pagpapanumbalik ng Diyos sa Israel nang hindi nililimitahan ang parirala sa isa lamang sa mga aspektong iyon.
- source_word: πνεῦμα ἅγιον
  choice: ang Banal na Espiritu
  rationale: Bagaman walang pantukoy ang pariralang Griyego, pinakamalamang sa gamit ni Lucas at sa agarang konteksto na ang Banal na Espiritu ang tinutukoy.
- source_word: ἐπ’ αὐτόν
  choice: nasa kanya
  rationale: Natural na Filipino para sa presensiya ng Espiritu kay Simeon; iniiwasan ang masyadong literal ngunit di-likas na hulma habang hindi nagdaragdag ng tiyak na paraan ng pagkilos.
theological_decisions:
- issue: Ang tinutukoy ng πνεῦμα ἦν ἅγιον ἐπ’ αὐτόν
  choice: nasa kanya ang Banal na Espiritu
  alternative: isang banal na espiritu ang nasa kanya
  rationale: Sinusuportahan ng karaniwang gamit sa Lucas–Mga Gawa at ng agarang konteksto sa mga talatang 26–27 ang pagtukoy sa Banal na Espiritu. Gayunman, itinatala sa talababa ang posibleng di-tiyak na pagbasa dahil walang pantukoy sa Griyego.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Pinanatili ang “At narito” bilang sadyang panandang pansalaysay; ginamit ang “maka-Diyos” sa halip na mas teknikal o lipas na katawagan. Ang mga panandang [a] at [b] ay inilagay mismo sa mga pariralang tinatalakay ng kani-kanilang talababa.
