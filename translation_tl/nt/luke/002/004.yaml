  text: Ἀνέβη δὲ καὶ Ἰωσὴφ ἀπὸ τῆς Γαλιλαίας ἐκ πόλεως Ναζαρὲθ εἰς τὴν Ἰουδαίαν εἰς πόλιν Δαυὶδ ἥτις καλεῖται Βηθλέεμ, διὰ τὸ εἶναι αὐτὸν ἐξ οἴκου καὶ πατριᾶς Δαυίδ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/004.yaml
  text: And Joseph also went up from Galilee[a], from the town of Nazareth, to Judea, to the city of David which is called Bethlehem, because he was from the house and family line of David,
translation:
  language: tl
  text: Umakyat din si Jose mula sa Galilea, mula sa bayan ng Nazaret, patungong Judea, sa lungsod ni David na tinatawag na Betlehem, sapagkat kabilang siya sa sambahayan at angkan ni David.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Griyego ay gumagamit ng dalawang magkaugnay na salita para sa sambahayan at angkan, na nagbibigay-diin sa pinagmulan ni Jose sa angkan ni David.
    reason: lexical_nuance
lexical_decisions:
- source_word: Ἀνέβη
  choice: Umakyat
  rationale: Pinananatili ang larawan ng pag-akyat patungo sa Judea sa halip na gawing pangkalahatang “pumunta.”
- source_word: δὲ καὶ
  choice: din
  rationale: Likas na nag-uugnay sa naunang salaysay at ipinahihiwatig na kasama si Jose sa pagkilos na binanggit sa konteksto.
- source_word: πόλεως Ναζαρὲθ
  choice: bayan ng Nazaret
  rationale: Ang “bayan” ay natural na tawag sa Nazaret sa makabagong Filipino at hindi labis na nagpapahiwatig ng laki nito.
- source_word: Ἰουδαίαν
  choice: Judea
  rationale: Karaniwang pangalan sa Filipino para sa rehiyong ito noong panahong Romano; iniiwasang mapagkamalan itong sinaunang teritoryo ng Juda.
- source_word: πόλιν Δαυὶδ ἥτις καλεῖται Βηθλέεμ
  choice: lungsod ni David na tinatawag na Betlehem
  rationale: Pinananatili ang paliwanag ng Griyego at ang mahalagang kaugnayan ng Betlehem kay David.
- source_word: διὰ τὸ εἶναι αὐτὸν
  choice: sapagkat nagmula siya
  rationale: Likas na ipinapahayag sa Filipino ang dahilan at ang diwa ng pinagmulang angkan.
- source_word: ἐξ οἴκου καὶ πατριᾶς Δαυίδ
  choice: mula sa sambahayan at angkan ni David
  rationale: Pinananatiling magkahiwalay ang dalawang magkaugnay na katawagan sa pinagmulang pamilya at dinastiya.
theological_decisions:
- issue: Mga katawagan sa pagkamula kay David
  choice: mula sa sambahayan at angkan ni David
  alternative: kabilang sa angkan at lahi ni David
  rationale: Pinananatili ang dalawang salitang οἶκος at πατριά nang hindi pinagsasama sa iisang konsepto at hindi nagdaragdag ng doktrinang higit sa tahasang sinasabi ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang paulit-ulit na “mula” at ang “umakyat” upang maingatan ang estruktura at heograpikong himig ng Griyego, habang ginawang natural ang pahayag ng dahilan.
