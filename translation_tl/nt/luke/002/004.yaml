  source_fidelity: 'Tumpak ang pangunahing pagsasalin: napananatili ang ''umakyat,'' ang pinagmulan sa Galilea at Nazaret, ang patutunguhang Judea at Betlehem, at ang dahilan na may kaugnayan sa dalawang terminong pangkanunuan/pangangkan ni David. Gayunman, ang ''nagmula siya mula sa'' ay hindi kinakailangang pag-uulit sa Filipino at mas malinaw na maipapahayag ang pagiging kabilang ni Jose sa sambahayan at angkan ni David.'
