  text: καὶ πάντες οἱ ἀκούσαντες ἐθαύμασαν περὶ τῶν λαληθέντων ὑπὸ τῶν ποιμένων πρὸς αὐτούς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/018.yaml
  text: And all who heard it were amazed about what had been told to them by the shepherds,[a]
translation:
  language: tl
  text: At ang lahat ng nakarinig ay namangha sa mga sinabi sa kanila ng mga pastol.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagtaka” para sa “namangha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinananatili nito ang payak na pag-uugnay ng talata sa naunang salaysay.
- source_word: πάντες οἱ ἀκούσαντες
  choice: ang lahat ng nakarinig
  rationale: Ang participle na may article ay tumutukoy sa lahat ng mga taong nakarinig. Hindi na kailangang magdagdag ng tahasang layon sa Filipino dahil likas at malinaw sa konteksto ang “nakarinig.”
- source_word: ἐθαύμασαν
  choice: namangha
  rationale: Ipinapahayag nito ang matinding pagtataka o pagkamangha bilang tugon sa narinig, sa natural at dignified na modernong Filipino.
- source_word: περὶ τῶν λαληθέντων
  choice: sa mga sinabi
  rationale: Sa pariralang ito, ang περί ay tumutukoy sa sanhi o paksa ng kanilang pagkamangha; natural itong ipinapahayag ng “sa” sa Filipino. Ang passive participle ay kumakatawan sa mga bagay na sinabi.
- source_word: ὑπὸ τῶν ποιμένων
  choice: ng mga pastol
  rationale: Ang ὑπό na may genitive ay nagpapakilala sa gumagawa ng kilos sa passive na konstruksyon; ang “ng mga pastol” ang natural na katumbas nito.
- source_word: πρὸς αὐτούς
  choice: sa kanila
  rationale: Pinananatili nito ang direksiyon ng pagsasalita at ang hindi labis na tinutukoy na sanggunian ng panghalip sa Griyego.
theological_decisions:
- issue: Uri ng tugong inilalarawan ng ἐθαύμασαν
  choice: Inilalarawan lamang ang pagkamangha ng mga nakarinig, nang hindi sinasabing ito ay pananampalatayang nagliligtas o kawalan ng pananampalataya.
  alternative: Unawain ang tugon bilang positibong pananampalataya o bilang hamak na pag-uusisa lamang.
  rationale: Ang θαυμάζω ay nagsasaad ng reaksiyong pagkamangha, ngunit hindi tinutukoy ng talata kung humantong iyon sa pananampalataya. Pinananatili ng salin ang pagiging bukas ng salaysay.
translation_notes:
  register: Modernong Filipino na natural basahin ngunit may dignidad. Ginamit ang karaniwang “pastol,” at iniwasan ang pagdaragdag ng paliwanag o doktrinal na kahulugan na wala sa teksto.
