  text: καὶ ἐξαίφνης ἐγένετο σὺν τῷ ἀγγέλῳ πλῆθος στρατιᾶς ⸀οὐρανίου αἰνούντων τὸν θεὸν καὶ λεγόντων·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/013.yaml
  text: 'And suddenly there was with the angel a multitude of the heavenly host[a], praising God and saying:'
translation:
  language: tl
  text: 'At biglang nagkaroon ng napakaraming hukbo ng langit[a] kasama ng anghel, na nagpupuri sa Diyos at nagsasabi:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “makalangit na hukbo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαίφνης
  choice: biglang
  rationale: Likas at malinaw na katumbas sa modernong Tagalog na nagpapanatili sa biglaang pangyayari.
- source_word: ἐγένετο σὺν τῷ ἀγγέλῳ
  choice: sumama sa anghel
  rationale: Ipinahahayag nang natural ang pagdating at presensiya ng karamihan kasama ng anghel, nang hindi iginigiit na mismong pandiwa ay nangangahulugang ‘nagpakita.’
- source_word: πλῆθος
  choice: napakaraming
  rationale: Malinaw na ipinahahayag ang malaking bilang sa karaniwang modernong Tagalog.
- source_word: στρατιᾶς οὐρανίου
  choice: hukbo ng langit
  rationale: Pinananatili ang larawang militar ng στρατιά at ang makalangit na kaugnayan nito; mas malinaw ito sa ordinaryong mambabasa kaysa sa ‘makalangit na hukbo.’
- source_word: αἰνούντων τὸν θεόν
  choice: na nagpupuri sa Diyos
  rationale: Tuwirang inililipat ang nagpapatuloy na kilos ng participle at ang layon nito sa natural na Tagalog.
- source_word: καὶ λεγόντων
  choice: at nagsasabi
  rationale: Pinananatili ang magkaugnay na participle at maayos na ipinakikilala ang sasabihin sa kasunod na talata.
theological_decisions:
- issue: Pagpapakahulugan sa στρατιᾶς οὐρανίου
  choice: hukbo ng langit
  alternative: makalangit na hukbo; kalipunan ng mga anghel
  rationale: Ang ‘hukbo ng langit’ ay nagpapanatili sa tunay na larawang militar at sa makalangit na pinagmulan nang hindi ipinapalit ang tahasang ‘mga anghel,’ na wala mismo sa parirala.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal. Ginamit ang ‘napakaraming hukbo ng langit’ upang maiwasan ang masyadong pampanitikang ‘isang karamihan ng hukbo,’ habang pinananatili ang diin sa malaking bilang at ang larawang militar. Ang tandang [a] ay inilagay agad pagkatapos ng pariralang tinutukoy.
