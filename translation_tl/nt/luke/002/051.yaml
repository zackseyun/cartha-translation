id: LUK.2.51
reference: Luke 2:51
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ κατέβη μετ’ αὐτῶν καὶ ἦλθεν εἰς Ναζαρέθ, καὶ ἦν ὑποτασσόμενος αὐτοῖς. καὶ ἡ μήτηρ αὐτοῦ διετήρει πάντα τὰ ῥήματα ⸀ταῦτα ἐν τῇ καρδίᾳ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/051.yaml
  text: And he went down with them and came to Nazareth[a], and he was subject to them[b]. And his mother kept all these things in her heart.
translation:
  language: tl
  text: At bumaba siyang kasama nila at pumunta sa Nazaret. At patuloy siyang nagpapasakop sa kanila.[a] Iningatan ng kanyang ina ang lahat ng salitang ito[b] sa kanyang puso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nanatili siyang masunurin sa kanila.” Ipinahihiwatig ng anyong Griyego ang nagpapatuloy na pagpapasakop o pagsunod.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “lahat ng bagay na ito” o “lahat ng pahayag na ito.” Ang salitang Griyego ay maaaring tumukoy sa mga salitang sinabi o sa mga bagay na tinutukoy ng mga iyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη μετ’ αὐτῶν
  choice: bumaba siyang kasama nila
  rationale: Pinananatili nito ang topograpikong diwa ng ‘bumaba’ at ang payak na ideya ng pagsama sa kanila.
- source_word: ἦλθεν εἰς Ναζαρέθ
  choice: pumunta sa Nazaret
  rationale: Sa Filipino, mas likas ang ‘pumunta’ ayon sa pananaw ng nagsasalaysay, habang malinaw pa rin ang patutunguhan.
- source_word: ἦν ὑποτασσόμενος αὐτοῖς
  choice: patuloy siyang nagpapasakop sa kanila
  rationale: Ipinahahayag ng periphrastic imperfect ang nagpapatuloy na pagpapasakop o pagsunod, hindi lamang isang minsanang kilos o kalagayan.
- source_word: διετήρει
  choice: iningatan
  rationale: Tuwirang ipinahahayag nito ang maingat na pagpapanatili sa alaala nang hindi nagdaragdag ng mas interpretatibong diwa ng ‘pinahalagahan.’
- source_word: πάντα τὰ ῥήματα ταῦτα
  choice: lahat ng salitang ito
  rationale: Pinananatili ng ‘mga salita’ ang karaniwang diwa ng ῥήματα, samantalang kinikilala sa talababa na maaari rin itong tumukoy sa mga bagay o pangyayaring tinutukoy ng mga salita.
- source_word: ἐν τῇ καρδίᾳ αὐτῆς
  choice: sa kanyang puso
  rationale: Likas at pamilyar itong idyoma sa Filipino para sa panloob na pag-iingat at pagninilay.
theological_decisions:
- issue: Ang kaugnayan ni Jesus sa kanyang mga magulang sa lupa
  choice: patuloy siyang nagpapasakop sa kanila
  alternative: masunurin siya sa kanila
  rationale: Pinananatili ng salin ang hayagang pahayag ng Griyego tungkol sa nagpapatuloy na pagpapasakop ni Jesus kina Maria at Jose, nang hindi nilulutas o ipinapaliwanag ang teolohikal na tensiyon sa kanyang pagkakakilanlan.
- issue: Saklaw ng πάντα τὰ ῥήματα ταῦτα
  choice: lahat ng salitang ito
  alternative: lahat ng bagay na ito
  rationale: Ang ῥήματα ay maaaring mangahulugang mga salita, pahayag, o mga bagay na tinutukoy. Pinili sa teksto ang mas leksikal na ‘mga salita’ at pinanatili sa talababa ang mas malawak na posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘nagpapasakop’ upang mapanatili ang aktibo at nagpapatuloy na diwa ng Griyego; iniwasan ang labis na pormal na pananalita.
