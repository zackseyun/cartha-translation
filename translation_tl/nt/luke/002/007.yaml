  terminology: Napananatili ang “panganay,” “pasabsaban,” at “silid para sa mga panauhin” nang wasto. Inayos ang paliwanag sa φάτνη upang hindi magmukhang ang tinutukoy ay isang kainan o sisidlan para mag-imbak ng pagkain, kundi isang lalagyan/lugar na pinaglalagyan ng pagkain ng mga hayop.
