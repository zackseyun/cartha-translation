id: LUK.2.7
reference: Luke 2:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἔτεκεν τὸν υἱὸν αὐτῆς τὸν πρωτότοκον, καὶ ἐσπαργάνωσεν αὐτὸν καὶ ἀνέκλινεν αὐτὸν ⸀ἐν φάτνῃ, διότι οὐκ ἦν αὐτοῖς τόπος ἐν τῷ καταλύματι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/007.yaml
  text: And she gave birth to her firstborn son[a], and wrapped him in cloths and laid him in a feeding trough[c][b], because there was no place for them in the guest room.
translation:
  language: tl
  text: At nagsilang siya ng kanyang panganay na anak na lalaki. Binalot niya ito ng mga tela[a] at inihiga sa isang pasabsaban[b], sapagkat walang lugar para sa kanila sa silid para sa mga panauhin.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “binalot niya ito ng mga lampin.”
    reason: lexical_alternative
  - marker: b
    text: O, “labangan ng pagkain ng mga hayop.” Ang salitang Griego ay tumutukoy sa isang lalagyan o lugar na pinaglalagyan ng pagkain ng mga hayop.
    reason: lexical_alternative
  - marker: c
    text: Tradisyonal na “bahay-panuluyan.” Ang Griegong κατάλυμα ay maaaring mangahulugang silid para sa mga panauhin o lugar na matutuluyan; ibang salita ang ginamit ni Lucas para sa isang komersiyal na bahay-panuluyan sa Lucas 10:34.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτεκεν
  choice: isinilang niya
  rationale: Likas at malinaw na pahayag sa modernong Tagalog para sa panganganak, nang hindi gumagamit ng makalumang pananalita.
- source_word: πρωτότοκον
  choice: panganay na anak na lalaki
  rationale: Ipinahahayag ang pagkakasunod sa kapanganakan at ang panlalaking kasarian na tahasang nasa υἱόν, nang hindi nagdaragdag ng teolohikal na kahulugan.
- source_word: ἐσπαργάνωσεν
  choice: binalot niya ito ng mga lampin
  rationale: Tumutukoy sa pagbabalot sa sanggol ng mga telang ginagamit para rito; malinaw at karaniwan ang “mga lampin” sa Tagalog.
- source_word: ἀνέκλινεν
  choice: inihiga
  rationale: Natural na salin sa konteksto ng paglalagay sa isang sanggol upang mahiga.
- source_word: φάτνῃ
  choice: pasabsaban
  rationale: Karaniwang salitang Tagalog para sa sisidlan o lugar na kainan ng mga hayop; pinananatili sa talababa ang mas paliwanag na alternatibo.
- source_word: τόπος
  choice: lugar
  rationale: Pinananatili ang malawak na kahulugan ng τόπος bilang lugar o puwang.
- source_word: καταλύματι
  choice: silid para sa mga panauhin
  rationale: Malinaw na tumutukoy sa puwang na matutuluyan ng mga panauhin at hindi ipinapalagay na isa itong komersiyal na bahay-panuluyan.
theological_decisions:
- issue: Kung ang κατάλυμα ay dapat isaling tradisyonal na “bahay-panuluyan” o bilang silid na tinutuluyan ng mga panauhin
  choice: silid para sa mga panauhin
  alternative: bahay-panuluyan o tuluyan
  rationale: Hindi hinihingi ng salitang Griego ang isang komersiyal na bahay-panuluyan. Ginagamit ni Lucas ang κατάλυμα para sa silid-panauhin sa Lucas 22:11, samantalang ibang salita, πανδοχεῖον, ang gamit niya para sa komersiyal na bahay-panuluyan sa Lucas 10:34. Pinananatili ng talababa ang tradisyonal na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Hinati sa dalawang pangungusap para sa madaling pagbasa habang pinananatili ang pagkakasunod-sunod at ugnayan ng mga sugnay sa Griego. Ginamit ang “ito” bilang natural na panghalip para sa sanggol at iniwasan ang tradisyonal na tagpong hindi tahasang hinihingi ng teksto.
