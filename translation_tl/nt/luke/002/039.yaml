  to: At nang matapos na nila ang lahat ayon sa Kautusan ng Panginoon[a], bumalik sila sa Galilea, sa sarili nilang bayan na Nazaret.[b]
  rationale: Pinalitan ang “magawa na nila” ng “matapos na nila” upang mas malinaw na maipahayag ang pagkumpleto ng mga gawaing itinakda ng Kautusan. Inayos ang pagtukoy sa Nazaret bilang apposition sa “bayan na Nazaret,” na likas sa modernong Filipino. Inilipat ang talababa b sa pangalang Nazaret upang malinaw na ang tala ay ukol sa pagpili ng “bayan” para sa πόλις, nang hindi binabago ang saklaw o kahulugan ng talata.
