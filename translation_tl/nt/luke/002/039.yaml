  source_fidelity: Tumpak sa kabuuan ang pagsasalin ng pagkumpleto ng lahat ng itinakda ng Kautusan, pagbalik sa Galilea, at pagtukoy sa Nazaret bilang sarili nilang bayan. Gayunman, ang “magawa na nila” ay maaaring magpahiwatig ng pagiging nagawa o kinayang gawin, samantalang ang ἐτέλεσαν ay tuwirang tumutukoy sa pagtatapos o pagkumpleto. Ang “matapos na nila” ay mas tiyak.
  naturalness: Ang “sa sarili nilang bayan[b], ang Nazaret” ay hindi likas na apposition sa modernong Filipino. Mas natural ang “sa sarili nilang bayan na Nazaret,” habang pinananatili ang ugnayang appositional ng Griyego.
  terminology: Ang “Kautusan ng Panginoon,” “Galilea,” at “Nazaret” ay angkop sa marangal ngunit makabagong rehistrong Filipino. Ang “Panginoon” ay wastong panumbas ng κύριος sa kontekstong ito.
