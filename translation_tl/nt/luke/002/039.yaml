source:
  edition: SBLGNT
  text: Καὶ ὡς ἐτέλεσαν ⸀πάντα τὰ κατὰ τὸν νόμον κυρίου, ⸀ἐπέστρεψαν εἰς τὴν Γαλιλαίαν ⸀εἰς πόλιν ἑαυτῶν Ναζαρέθ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/039.yaml
  text: And when they had completed everything according to the law of the Lord[a], they returned to Galilee, to their own town[b], Nazareth.
translation:
  language: tl
  text: At nang matapos na nila ang lahat ayon sa Kautusan ng Panginoon[a], bumalik sila sa Galilea, sa sarili nilang bayan na Nazaret.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang lahat ng hinihingi ng Kautusan ng Panginoon.”
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “lungsod”; isinaling “bayan” sapagkat isang maliit na pamayanan ang Nazaret.
    reason: cultural_note
lexical_decisions:
- source_word: ὡς
  choice: nang
  rationale: Sa temporal na gamit kasama ng aorist, ipinakikilala nito ang panahong sinundan ng pangunahing kilos. Likas sa Tagalog ang “nang” at hindi nito ipinahihiwatig ang labis na agarang pagkakasunod.
- source_word: ἐτέλεσαν
  choice: magawa na nila
  rationale: Tumutukoy ito sa pagtatapos ng mga itinakdang gawain. Ang “magawa na nila” ay natural sa salaysay at umiiwas sa “matupad,” na maaaring magpahiwatig ng katuparan ng propesiya.
- source_word: πάντα τὰ κατὰ τὸν νόμον κυρίου
  choice: ang lahat ayon sa Kautusan ng Panginoon
  rationale: Pinananatili nito ang saklaw ng πάντα at ang bahagyang kaluwagan ng κατὰ, sa halip na tahasang idagdag sa pangunahing teksto ang ideyang “lahat ng hinihingi.”
- source_word: νόμον κυρίου
  choice: Kautusan ng Panginoon
  rationale: Malinaw at marangal na salin ng konstruksiyong henitibo, at pinananatili ang estilong maka-Kasulatan.
- source_word: κυρίου
  choice: Panginoon
  rationale: Dito ay tumutukoy sa Diyos bilang pinagmulan ng Kautusan. Ang “Panginoon” ay tuwirang salin ng κύριος nang hindi ipinapalit ang pangalan ng Diyos na wala sa tekstong Griyego.
- source_word: ἐπέστρεψαν
  choice: bumalik sila
  rationale: Karaniwan at eksaktong salin sa konteksto ng paglalakbay.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: sa Galilea
  rationale: Ang “sa” ang natural na panandang Filipino para sa patutunguhan sa ganitong pangungusap.
- source_word: εἰς πόλιν ἑαυτῶν
  choice: sa sarili nilang bayan
  rationale: Ang πόλις ay maaaring tumukoy sa lungsod o bayan. Dahil maliit na pamayanan ang Nazaret, mas angkop ang “bayan”; pinananatili ng “sarili nilang” ang diin ng ἑαυτῶν.
- source_word: Ναζαρέθ
  choice: Nazaret
  rationale: Karaniwang anyong Filipino ng pangalan ng lugar.
theological_decisions:
- issue: Ang tinutukoy ng “Panginoon” sa “Kautusan ng Panginoon”
  choice: Tumutukoy ang “Panginoon” sa Diyos, na pinagmulan ng Kautusang nasa Kasulatan.
  alternative: Walang pangunahing alternatibong pagbasa na may makabuluhang teolohikal na epekto sa kontekstong ito.
  rationale: Karaniwang pahayag ito sa tradisyong Judio at sa Kasulatan. Pinananatili ng payak na salin ang diin sa pagsunod ng pamilya nang walang idinadagdag na doktrinal na paliwanag.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “Kautusan” bilang katawagang maka-Kasulatan, “bayan” para sa likas at makasaysayang paglalarawan sa Nazaret, at malinaw na inilagay sa pangunahing teksto ang lahat ng panandang talababa.
