  to: at siya'y biyuda na hanggang walumpu't apat na taong gulang.[a] Hindi siya umaalis sa templo,[b] at sumasamba nang may mga pag-aayuno at mga panalangin[c] gabi at araw.
  rationale: Inayos ang pangunahing pangungusap upang masundan ang payak na predikasyon ng Griyego tungkol sa pagiging biyuda ni Ana. Inalis ang di-sinusuportahang kontrast na «kundi», ginawang mas tumpak ang patuloy na diwa ng ἀφίστατο sa «Hindi siya umaalis», at pinasimple ang pagpapahayag ng paraan ng kanyang pagsamba. Nananatili ang lahat ng talababa at ang mga pananda sa wastong kaugnay na parirala.
