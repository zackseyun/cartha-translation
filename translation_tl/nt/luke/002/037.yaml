  text: καὶ αὐτὴ χήρα ⸀ἕως ἐτῶν ὀγδοήκοντα τεσσάρων,) ἣ οὐκ ⸀ἀφίστατο τοῦ ἱεροῦ νηστείαις καὶ δεήσεσιν λατρεύουσα νύκτα καὶ ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/037.yaml
  text: and then as a widow until she was eighty-four years old[a]. She did not depart from the temple[c][b], worshiping with fastings and prayers night and day.
translation:
  language: tl
  text: at siya'y biyuda na hanggang walumpu't apat na taong gulang.[a] Hindi siya umaalis sa templo,[b] at sumasamba nang may mga pag-aayuno at mga panalangin[c] gabi at araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “at walumpu't apat na taon na siyang biyuda.” Maaaring tumukoy ang Griyego sa edad ni Ana o sa tagal ng kanyang pagkabiyuda.
    reason: alternative_reading
  - marker: b
    text: Ang salitang Griyego ay tumutukoy sa kabuuang lugar o mga bakuran ng templo, hindi lamang sa panloob na santuwaryo.
    reason: cultural_note
  - marker: c
    text: O, “mga pagsusumamo” o “mga kahilingan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χήρα
  choice: biyuda
  rationale: Karaniwan at malinaw na salitang Filipino para sa babaeng namatayan ng asawa; ipinagpapatuloy nito ang paglalarawan kay Ana mula sa naunang talata.
- source_word: ἕως ἐτῶν ὀγδοήκοντα τεσσάρων
  choice: hanggang sa edad na walumpu't apat na taon
  rationale: Likas sa Filipino at inuunawa ang pinaikling pariralang Griyego bilang pagtukoy sa edad ni Ana, habang pinananatili sa talababa ang posibleng kahulugang tagal ng kanyang pagkabiyuda.
- source_word: ἀφίστατο τοῦ ἱεροῦ
  choice: Hindi siya lumalayo sa templo
  rationale: Ipinahihiwatig ng imperfect ang nakagawiang patuloy na kilos. Ang 'lumalayo' ay natural at hindi kinakailangang mangahulugang hindi siya kailanman pisikal na umalis.
- source_word: ἱεροῦ
  choice: templo
  rationale: Natural na katumbas sa Filipino; nililinaw sa talababa na ang ἱερόν ay ang mas malawak na bakuran o kabuuang lugar ng templo, hindi lamang ang santuwaryo.
- source_word: νηστείαις
  choice: mga pag-aayuno
  rationale: Pinananatili ang maramihang anyo at ang diwa ng paulit-ulit na gawaing debosyonal.
- source_word: δεήσεσιν
  choice: mga panalangin
  rationale: Pinakanatural sa kasalukuyang Filipino sa ganitong parirala, habang itinatala sa talababa ang mas tiyak na diwa ng mga pagsusumamo o kahilingan.
- source_word: λατρεύουσα
  choice: sumasamba
  rationale: Malinaw na ipinahahayag ang sagradong paglilingkod at debosyon sa Diyos nang hindi gumagamit ng teknikal o denominasyonal na pananalita.
- source_word: νύκτα καὶ ἡμέραν
  choice: gabi at araw
  rationale: Sinusunod ang ayos ng Griyego at natural na naghahatid ng diwa ng patuloy at masigasig na debosyon.
theological_decisions:
- issue: Kung edad ni Ana o tagal ng kanyang pagkabiyuda ang walumpu't apat na taon
  choice: Ipinakakahulugan sa pangunahing teksto na umabot sa walumpu't apat na taon ang edad ni Ana.
  alternative: Maaaring ang ibig sabihin ay biyuda na siya sa loob ng walumpu't apat na taon.
  rationale: Pahihintulutan ng siksik na sintaks ng Griyego ang dalawang pagbasa. Pinili ang mas madaling basahin sa pangunahing teksto ngunit hayagang pinanatili ang tunay na kalabuan sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'biyuda,' 'templo,' at 'sumasamba' bilang mga salitang madaling maunawaan ng karaniwang mambabasa. Ang 'hindi siya lumalayo' ay nagpapanatili sa aspektong nakagawian ng imperfect nang hindi labis na literal. Inilagay ang mga pananda ng talababa kaagad sa kaugnay na salita o parirala.
