id: LUK.2.46
reference: Luke 2:46
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐγένετο μετὰ ἡμέρας τρεῖς εὗρον αὐτὸν ἐν τῷ ἱερῷ καθεζόμενον ἐν μέσῳ τῶν διδασκάλων καὶ ἀκούοντα αὐτῶν καὶ ἐπερωτῶντα αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/046.yaml
  text: And it happened that after three days they found him in the temple[b][a], sitting among the teachers and listening to them and asking them questions.
translation:
  language: tl
  text: At nangyari, pagkaraan ng tatlong araw, natagpuan nila siya sa templo[a], na nakaupo sa gitna ng mga guro, nakikinig sa kanila at nagtatanong sa kanila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego na ἱερόν ay tumutukoy sa buong kompleks o mga bakuran ng templo, hindi lamang sa panloob na santuwaryo.
    reason: cultural_note
  - marker: b
    text: O “tinatanong sila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: At nangyari
  rationale: Pinananatili ang karaniwang panimulang pormula ni Lucas sa isang likas at hindi makalumang paraan.
- source_word: μετὰ ἡμέρας τρεῖς
  choice: pagkaraan ng tatlong araw
  rationale: Tuwirang ipinahahayag ang temporal na pagkakasunod na tinutukoy ng μετά na may akusatibo.
- source_word: εὗρον
  choice: natagpuan nila
  rationale: Likas na salin ng aorist na pandiwa at malinaw na pinananatili ang maramihang simuno.
- source_word: ἐν τῷ ἱερῷ
  choice: sa templo
  rationale: Karaniwan at madaling maunawaang tawag; ipinapaliwanag sa talababa na ang ἱερόν ay ang mas malawak na bakuran o kabuuang kompleks ng templo.
- source_word: καθεζόμενον
  choice: nakaupo
  rationale: Inilalarawan ang kalagayan o postura ni Jesus nang matagpuan siya.
- source_word: ἐν μέσῳ τῶν διδασκάλων
  choice: sa gitna ng mga guro
  rationale: Malapit sa anyo ng Griyego at hindi idinaragdag ang mas tiyak na 'mga guro ng Kautusan,' na hindi tahasang nasa teksto.
- source_word: ἀκούοντα αὐτῶν
  choice: nakikinig sa kanila
  rationale: Ipinahihiwatig ang masusing pakikinig, hindi lamang ang pisikal na pagkarinig.
- source_word: ἐπερωτῶντα αὐτούς
  choice: nagtatanong sa kanila
  rationale: Natural sa Filipino at pinananatili ang diwa ng pakikibahagi sa talakayan nang hindi ipinahihiwatig na nakikipagtalo o nagsisiyasat siya nang may pagkapoot.
theological_decisions:
- issue: Uri ng pakikisalamuha ni Jesus sa mga guro
  choice: nakikinig sa kanila at nagtatanong sa kanila
  alternative: nakikinig sa kanila at sinusuri sila sa pamamagitan ng mga tanong
  rationale: Ipinakikita ng Griyego ang aktibong pakikinig at pagtatanong. Hindi dapat bawasan ang karunungan ni Jesus, ngunit hindi rin dapat magdagdag ng mapanghamon o eksaminasyong tono na hindi hinihingi ng teksto.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “pagkaraan” at “natagpuan” para sa dignidad ng salaysay, habang iniwasan ang makaluma o labis na teknikal na pananalita.
