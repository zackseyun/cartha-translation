  text: And when they did not find him[a], they returned to Jerusalem, searching for him.
translation:
  language: tl
  text: At nang hindi nila siya matagpuan, bumalik sila sa Jerusalem habang hinahanap nila siya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang payak na pang-ugnay at tuloy-tuloy na daloy ng salaysay ni Lucas.
- source_word: μὴ εὑρόντες
  choice: nang hindi nila siya matagpuan
  rationale: Likas na isinasalin ang aorist participle bilang sugnay na pangyayari/panahon; malinaw at natural ito sa makabagong Filipino.
- source_word: ὑπέστρεψαν
  choice: bumalik sila
  rationale: Tuwirang ipinahahayag ang pagbabalik sa pinanggalingang lugar nang hindi nagdaragdag ng paliwanag.
- source_word: εἰς Ἰερουσαλήμ
  choice: sa Jerusalem
  rationale: Ang “sa” ang likas na gamit sa Filipino para sa patutunguhang lungsod kasunod ng pandiwang “bumalik.”
- source_word: ἀναζητοῦντες
  choice: at hinanap siya roon
  rationale: Ipinahahayag ang aktibong paghahanap sa natural na Filipino; ang “roon” ay nililinaw lamang ang lokasyon na tahasang ibinigay ng pariralang patungo sa Jerusalem.
- source_word: αὐτόν
  choice: siya
  rationale: Tuwirang panghalip na tumutukoy kay Jesus.
