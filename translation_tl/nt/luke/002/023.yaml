translation:
  language: tl
  text: 'gaya ng nasusulat sa Kautusan ng Panginoon: “Bawat lalaking unang iniluwal ay tatawaging banal sa Panginoon.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “bawat lalaking nagbubukas ng sinapupunan.” Ibig sabihin, ang panganay na lalaki ay itinuturing na banal, o nakatalaga, sa Panginoon. Tingnan ang Exodo 13:2, 12.
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: gaya ng nasusulat
  rationale: Likas na pormula sa Filipino para sa pagsipi sa Kasulatan at pinananatili ang diwa ng umiiral at may-bisang nakasulat.
- source_word: ἐν νόμῳ κυρίου
  choice: sa Kautusan ng Panginoon
  rationale: Tumutukoy sa kinikilalang Kautusan bilang banal na kasulatan; ang “Panginoon” ang tuwirang salin ng κύριος.
- source_word: Πᾶν ἄρσεν
  choice: Bawat lalaki
  rationale: Pinananatili ang tahasang panlalaking kahulugan ng Griyego nang hindi idinaragdag sa pangunahing teksto ang salitang “anak.”
- source_word: διανοῖγον μήτραν
  choice: nagbubukas ng sinapupunan
  rationale: Pinananatili ang biblikal na idyoma para sa panganay na lalaki, bagaman nililinaw iyon sa talababa.
- source_word: ἅγιον τῷ κυρίῳ
  choice: banal sa Panginoon
  rationale: Pinananatili ang mismong wika ng kabanalan at ang kaugnayan o pagtatalaga sa Panginoon, sa halip na palitan ito ng mas mapagpaliwanag na “itinalaga.”
- source_word: κληθήσεται
  choice: tatawaging
  rationale: Tuwirang nagpapahayag ng future passive at natural sa makabagong Filipino.
theological_decisions:
- issue: Pagsasalin ng κύριος sa sipi mula sa Kautusan ng Israel
  choice: Panginoon
  alternative: YAHWE / ang PANGINOON
  rationale: Ang pinagmumulang tekstong Griyego ay κύριος; kaya “Panginoon” ang pinanatili, kahit ang pinagbabatayang Hebreong konteksto ay kaugnay ng banal na pangalan.
- issue: Wika ng kabanalan o interpretatibong pagtatalaga
  choice: banal sa Panginoon
  alternative: itinalaga sa Panginoon
  rationale: Tahasang ἅγιον ang nasa teksto. Pinananatili ng “banal” ang leksikal at teolohikal na ugnayan sa konsepto ng kabanalan, habang ipinapaliwanag sa talababa ang kahulugan ng pagtatalaga.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang tutuldok upang malinaw na ipakilala ang tuwirang sipi. Pinanatili ang biblikal na pariralang “nagbubukas ng sinapupunan,” na ipinaliliwanag ng talababa upang maiwasang mawala ang pahiwatig sa panganay.
