base_translation:
  language: en
  yaml_path: translation/nt/luke/013/021.yaml
  text: It is like leaven[c][b][a], which a woman took and hid in three measures of flour until it was all leavened.
translation:
  language: tl
  text: Katulad ito ng pampaalsa[a] na kinuha at itinago[b] ng isang babae sa tatlong takal[c] ng harina, hanggang sa umalsa ang buong masa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lebadura.” Tumutukoy ang salitang Griyego sa sangkap na ginagamit upang mapaalsa ang masa.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ihinalo.” Ang pandiwang Griyego ay literal na nangangahulugang “itinago” o “ikinubli.”
    reason: lexical_alternative
  - marker: c
    text: Sa Griyego, “tatlong sata” (mga tatlong seah), isang malaking dami ng harina. Ang sata ay sinaunang yunit ng panukat.
    reason: cultural_note
lexical_decisions:
- source_word: ὁμοία ἐστίν
  choice: Katulad ito ng
  rationale: Likas na paraan sa modernong Tagalog upang ipakilala ang paghahambing sa talinghaga, habang pinananatili ang pagtukoy ng “ito” sa kaharian mula sa konteksto.
- source_word: ζύμῃ
  choice: pampaalsa
  rationale: Tumutukoy ito sa sangkap na nagpapalsa ng masa. Mas malinaw sa karaniwang mambabasa ang “pampaalsa” kaysa sa teknikal o komersiyal na “lebadura,” at hindi nito nililimitahan ang larawan sa makabagong yeast.
- source_word: λαβοῦσα γυνή
  choice: na kinuha ng isang babae
  rationale: Isinasalin ang aorist participle bilang likas na sugnay sa Tagalog at pinananatiling di-tiyak ang babae sa talinghaga.
- source_word: ἔκρυψεν
  choice: itinago
  rationale: Pinananatili ang literal na diwa ng pandiwa na “itinago” o “ikinubli,” sa halip na tahimik na palitan ito ng interpretatibong “ihinalo.”
- source_word: εἰς ἀλεύρου σάτα τρία
  choice: sa tatlong takal ng harina
  rationale: Ang “takal” ay madaling maunawaang katawagan para sa yunit ng tuyong sangkap; inilalagay sa talababa ang espesipikong sinaunang yunit na sata.
- source_word: ἕως οὗ
  choice: hanggang sa
  rationale: Direkta at natural na temporal na pang-ugnay sa Tagalog.
- source_word: ἐζυμώθη ὅλον
  choice: mapaalsa ang lahat
  rationale: Pinananatili ang pasibong diwa at ang kabuuang saklaw ng ὅλον nang hindi tahasang nagdaragdag ng “masa,” na hindi nakasaad bilang pangngalan sa Griyego.
theological_decisions:
- issue: Simbolikong kahulugan ng pampaalsa
  choice: Panatilihing neutral ang larawan bilang “pampaalsa.”
  alternative: Ipahiwatig sa salin na masama ang pampaalsa, o tahasang ipaliwanag itong positibong paglago ng kaharian.
  rationale: Hindi mismo nilulutas ng talata ang lahat ng simbolikong gamit ng pampaalsa sa Kasulatan. Dapat panatilihin ng salin ang larawan at hayaang ang konteksto ang gumabay sa pagpapakahulugan.
- issue: Di-karaniwang pandiwang “itinago” sa proseso ng paghahalo
  choice: Panatilihin sa pangunahing teksto ang literal na “itinago,” na may alternatibong paliwanag sa talababa.
  alternative: Isalin sa pangunahing teksto bilang “ihinalo.”
  rationale: Ang ἔκρυψεν ay literal na “itinago/ikinubli.” Ang “ihinalo” ay makatuwiran sa konteksto ng paggawa ng masa ngunit mas interpretatibo, kaya inilagay lamang bilang alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Pinanatili ang konkretong larawan at ang bahagyang di-karaniwang “itinago,” habang ipinaliliwanag sa mga talababa ang posibleng alternatibo at ang sinaunang panukat.
