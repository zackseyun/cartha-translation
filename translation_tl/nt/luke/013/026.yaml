base_translation:
  language: en
  yaml_path: translation/nt/luke/013/026.yaml
  text: Then you will begin to say[a], ‘We ate and drank in your presence, and you taught in our streets.’
translation:
  language: tl
  text: Saka kayo magsisimulang sabihin, “Kumain kami at uminom sa iyong harapan, at nagturo ka sa mga lansangan namin[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga liwasan namin.” Ang salitang Griyego ay maaaring tumukoy sa malalapad na lansangan o sa bukás na pampublikong lugar sa loob ng isang bayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Pagkatapos
  rationale: Ipinahahayag nito ang kasunod na pangyayari sa daloy ng sinabi ni Jesus; natural at maikli ito sa modernong Tagalog.
- source_word: ἄρξεσθε λέγειν
  choice: magsisimula kayong magsabi
  rationale: Pinananatili nito ang pasimulang diwa ng ἄρξεσθε kasama ng pawatas na λέγειν, sa halip na gawing simpleng “sasabihin ninyo.”
- source_word: Ἐφάγομεν … καὶ ἐπίομεν
  choice: Kumain at uminom kami
  rationale: Ang dalawang aorist ay natural na isinasalin bilang mga naganap na kilos at pinananatili ang karaniwang larawan ng pagkain at pag-inom.
- source_word: ἐνώπιόν σου
  choice: sa harapan mo
  rationale: Malinaw nitong ipinahahayag na nangyari ang pagkain at pag-inom sa presensiya ng kausap nang hindi ipinapalagay na kinilala niya ang mga nagsasalita bilang tunay na mga kasama niya.
- source_word: ἐν ταῖς πλατείαις ἡμῶν
  choice: sa mga lansangan namin
  rationale: Ang πλατεῖαι ay maaaring tumukoy sa malalapad na lansangan o bukás na pampublikong lugar sa isang bayan. Ang “mga lansangan” ang pinakanatural na pangunahing salin, habang inilalagay sa talababa ang leksikal na alternatibo.
- source_word: ἐδίδαξας
  choice: nagturo ka
  rationale: Ang payak na naganap na anyo ay angkop sa aorist at malinaw na tumutukoy sa makasaysayang pagtuturo sa kanilang lugar.
theological_decisions:
- issue: Ang batayan ng pakiusap ng mga nagsasalita kay Jesus
  choice: Pinananatili ang kanilang pag-angkin na nasa presensiya nila siya at nagturo sa kanilang lugar, nang hindi ipinahihiwatig na kinilala niya silang tunay na mga tagasunod.
  alternative: Isaling “kasama ka naming kumain at uminom,” na maaaring magpahiwatig ng mas malapit at kinikilalang pakikisama.
  rationale: Ang Griyego ay nagsasaad ng panlabas na pagiging malapit at lokal na pagkakaugnay, ngunit hindi nito pinatutunayan ang isang tunay na ugnayang kinikilala ni Jesus. Dapat manatili ang tensiyong ito.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “magsisimula kayong magsabi” upang mapanatili ang aspektuwal na diwa ng Griyego, at “sa harapan mo” upang maiwasang dagdagan ang teksto ng pahiwatig ng kinikilalang pakikisama.
