id: LUK.13.34
reference: Luke 13:34
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἰερουσαλὴμ Ἰερουσαλήμ, ἡ ἀποκτείνουσα τοὺς προφήτας καὶ λιθοβολοῦσα τοὺς ἀπεσταλμένους πρὸς αὐτήν— ποσάκις ἠθέλησα ἐπισυνάξαι τὰ τέκνα σου ὃν τρόπον ὄρνις τὴν ἑαυτῆς νοσσιὰν ὑπὸ τὰς πτέρυγας, καὶ οὐκ ἠθελήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/034.yaml
  text: Jerusalem[a], Jerusalem, the one killing the prophets and stoning those sent to her—how often I wanted to gather your children the way a hen gathers her brood under her wings[b], and you were not willing.
translation:
  language: tl
  text: “Jerusalem, Jerusalem, ikaw na pumapatay sa mga propeta at bumabato sa mga isinugo sa iyo—ilang ulit kong ninais na tipunin ang iyong mga anak, kung paanong tinitipon ng isang inahing manok[a] ang kaniyang mga sisiw sa ilalim ng kaniyang mga pakpak, ngunit hindi ninyo ginusto.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang ibon ... ang kaniyang mga inakay.” Mas malawak ang maaaring kahulugan ng salitang Griyego na ὄρνις kaysa “inahing manok,” ngunit likas sa larawang ito ang isang inahing manok na kumukupkop sa kaniyang mga sisiw.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰερουσαλὴμ Ἰερουσαλήμ
  choice: Jerusalem, Jerusalem
  rationale: Pinanatili ang pag-uulit upang maipahayag ang mariin at mapanglaw na pagtawag.
- source_word: ἡ ἀποκτείνουσα ... καὶ λιθοβολοῦσα
  choice: ikaw na pumapatay ... at bumabato
  rationale: Likas na Tagalog para sa mga pangkasalukuyang participle na naglalarawan sa kinaugaliang pakikitungo ng Jerusalem sa mga sugo ng Diyos.
- source_word: τοὺς ἀπεσταλμένους πρὸς αὐτήν
  choice: mga isinugo sa iyo
  rationale: Pinananatili ang diwang passive at iniaangkop ang panghalip sa tuwirang pakikipag-usap sa Jerusalem.
- source_word: ποσάκις ἠθέλησα
  choice: ilang ulit kong ninais
  rationale: Malinaw na ipinapahayag ang dalas at personal na pagnanais nang may marangal na himig.
- source_word: ἐπισυνάξαι τὰ τέκνα σου
  choice: tipunin ang iyong mga anak
  rationale: Pinananatili ang metaporikong paglalarawan sa Jerusalem bilang inang-lungsod at hindi nililimitahan ang tinutukoy ng 'mga anak.'
- source_word: ὄρνις ... νοσσιὰν
  choice: isang inahing manok ... kaniyang mga sisiw
  rationale: Bagaman maaaring mangahulugang ibon sa pangkalahatan ang ὄρνις, ang larawan ng pagtipon sa mga inakay sa ilalim ng mga pakpak ay pinakamalinaw at likas sa Tagalog bilang inahing manok at mga sisiw.
- source_word: οὐκ ἠθελήσατε
  choice: ayaw ninyo
  rationale: Direkta at natural na Tagalog na pinananatili ang kaibahan ng pagnanais ni Jesus at pagtanggi ng mga kinakausap.
theological_decisions:
- issue: Tinutukoy ng 'iyong mga anak'
  choice: iyong mga anak
  alternative: mga naninirahan sa Jerusalem; ang bayang kinakatawan ng Jerusalem
  rationale: Pinananatili ang personipikasyon ng Jerusalem at ang lawak ng posibleng tinutukoy sa Griyego nang hindi nilulutas ang interpretatibong tanong.
- issue: Kaibahan ng θέλω / ἠθελήσατε
  choice: ninais ... ayaw ninyo
  alternative: ginusto ... hindi ninyo ginusto; ibig ko ... hindi ninyo inibig
  rationale: Pinananatili ang malinaw na wikang tumutukoy sa pagnanais at pagtanggi nang hindi nagdaragdag ng doktrinal na paliwanag na wala sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “ikaw” sa paglalarawan sa Jerusalem upang maging natural ang tuwirang panawagan, at “ninyo” sa hulihan upang mapanatili ang pangmaramihang anyo ng Griyegong ἠθελήσατε, na tumutukoy sa mga taong kinakatawan ng lungsod.
