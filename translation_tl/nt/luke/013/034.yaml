  source_fidelity: Tumpak ang pangunahing diwa, ang pag-uulit ng Jerusalem, ang metaporang ina-singaw, at ang paglipat mula sa isahang panawagan sa lungsod tungo sa maramihang pagtukoy sa mga taong tumanggi. Gayunman, ang “gaya ng pagtitipon ng” ay isang pangngalang parirala at hindi malinaw na naipapahayag ang pandiwang paghahambing ng Griyego. Ang “hindi ninyo ginusto” ay mas maayos ding katapat ng nakaraang anyong ἠθελήσατε kaysa sa kasalukuyang “ayaw ninyo.”
  naturalness: 'Kailangan ng maliit ngunit mahalagang pagsasaayos upang maging ganap na likas ang paghahambing: “kung paanong tinitipon ng isang inahing manok ...” Mas malinaw ito sa modernong Filipino Tagalog at hindi nagdaragdag ng kahulugan.'
  terminology: Ang “mga propeta,” “mga isinugo,” “tipunin,” “inahing manok,” at “mga sisiw” ay angkop. Pinananatili ng “iyong mga anak” ang personipikasyon at hindi nililimitahan ang tinutukoy. Ang talababa ay angkop na nagpapaliwanag sa mas malawak na saklaw ng ὄρνις.
  issues:
  - severity: medium
    issue: Hindi ganap na pandiwang paghahambing ang “gaya ng pagtitipon ng isang inahing manok.”
    rationale: Ang ὃν τρόπον ay naghahambing ng paraan ng pagtitipon. Sa Tagalog, ang “kung paanong tinitipon ng isang inahing manok” ay malinaw na nagsasaad na ang inahing manok ang gumaganap ng pagtitipon.
  - severity: low
    issue: Ang “ayaw ninyo” ay kasalukuyang anyo, samantalang ang ἠθελήσατε ay aorist na tumutugon sa ἠθέλησα.
    rationale: Ang “hindi ninyo ginusto” ay natural na Tagalog at mas malinaw na pinananatili ang volitional contrast at aspektong nakalapat sa pangungusap.
