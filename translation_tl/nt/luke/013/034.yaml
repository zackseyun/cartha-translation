  to: “Jerusalem, Jerusalem, ikaw na pumapatay sa mga propeta at bumabato sa mga isinugo sa iyo—ilang ulit kong ninais na tipunin ang iyong mga anak, kung paanong tinitipon ng isang inahing manok[a] ang kaniyang mga sisiw sa ilalim ng kaniyang mga pakpak, ngunit hindi ninyo ginusto.”
