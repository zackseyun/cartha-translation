id: LUK.13.5
reference: Luke 13:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὐχί, λέγω ὑμῖν, ἀλλ’ ἐὰν μὴ ⸀μετανοῆτε πάντες ⸀ὡσαύτως ἀπολεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/005.yaml
  text: No[a], I tell you; but unless you repent, you will all likewise perish.
translation:
  language: tl
  text: Hindi, sinasabi ko sa inyo. Ngunit kung hindi kayo magsisisi, mapapahamak din kayong lahat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mapapahamak kayong lahat sa gayunding paraan.” Maaaring tumukoy ang salitang Griyego sa maihahambing na uri o paraan ng paghatol batay sa mga naunang halimbawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχί
  choice: Hindi
  rationale: Tuwirang sagot na pasalungat sa ipinahihiwatig na tanong sa naunang konteksto; natural at mariin sa modernong Tagalog.
- source_word: λέγω ὑμῖν
  choice: sinasabi ko sa inyo
  rationale: Natural na katumbas ng karaniwang pormulang Lukan at malapit sa anyo ng Griyego.
- source_word: ἀλλ’ ἐὰν μὴ
  choice: Ngunit kung hindi
  rationale: Pinananatili ang pagsalungat ng ἀλλά at ang kondisyon ng ἐὰν μή nang hindi nagiging pilit sa Tagalog.
- source_word: μετανοῆτε
  choice: magsisisi
  rationale: Sa kontekstong ito, tumutukoy ito sa pagsisisi at pagbabalik-loob sa harap ng Diyos, hindi lamang sa pagbabago ng opinyon.
- source_word: πάντες
  choice: kayong lahat
  rationale: Malinaw na pinananatili ang saklaw ng babala sa lahat ng kausap.
- source_word: ὡσαύτως
  choice: din
  rationale: Sa pangunahing teksto, natural na ipinahahayag ng “din” ang paghahambing sa mga naunang halimbawa habang hindi nililimitahan kung ito ay pagkakatulad sa paraan, katiyakan, o uri ng hatol; inilalahad sa talababa ang mas literal na alternatibo.
- source_word: ἀπολεῖσθε
  choice: mapapahamak
  rationale: Naghahatid ng diwa ng kapahamakan o pagkawasak at hindi ito ipinapakahulugan bilang pisikal na kamatayan lamang.
theological_decisions:
- issue: Kahulugan ng μετανοῆτε sa babala ni Jesus
  choice: magsisisi
  alternative: magbabago ng isip; manunumbalik
  rationale: Pinananatili nito ang bigat ng panawagan sa pagsisisi nang hindi ito nililimitahan sa damdaming panghihinayang lamang o pinupunan ng isang sistematikong depinisyon ng pagbabalik-loob.
- issue: Lakas at saklaw ng ὡσαύτως ἀπολεῖσθε
  choice: mapapahamak din kayong lahat
  alternative: mapapahamak kayong lahat sa gayunding paraan
  rationale: Pinananatili ang paghahambing sa mga naunang pangyayari ngunit hindi tahasang nagpapasiya kung ang tinutukoy ay paraan, biglaan, katiyakan, o maihahambing na hatol.
translation_notes:
  register: Modernong Filipino Tagalog na natural, tuwiran, at marangal. Ginamit ang “magsisisi” bilang pamilyar ngunit makabuluhang panrelihiyong salita; iniwasan ang mas mabigat at posibleng mas makitid na “magsisi at magbalik-loob.”
