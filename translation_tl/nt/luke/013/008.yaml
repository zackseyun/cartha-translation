  to: Ngunit sumagot siya sa kanya, “Panginoon, hayaan mo muna ito sa taong ito rin[a], hanggang sa hukayin ko ang lupa sa paligid nito at lagyan ko ito ng dumi ng hayop[b].”
  rationale: Inayos ang sintaks upang malinaw na ang nagsasalita ang parehong huhukay at maglalagay ng dumi ng hayop. Pinalitan ang di-gaanong likas na parirala para sa paghuhukay ng mas karaniwang Tagalog, at pinakinis ang pagpapahayag ng karagdagang taon. Hindi binago ang saklaw ng kahulugan, ang larawan ng pagsasaka, o ang antas ng paggalang sa «Panginoon».
