  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς λέγει αὐτῷ· Κύριε, ἄφες αὐτὴν καὶ τοῦτο τὸ ἔτος, ἕως ὅτου σκάψω περὶ αὐτὴν καὶ βάλω κόπρια·
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/008.yaml
  text: But he answered and said to him[a], ‘Lord, leave it alone this year also[b], until I dig around it and put manure on it.’
translation:
  language: tl
  text: Ngunit sumagot siya sa kanya, “Panginoon, hayaan mo muna ito sa taong ito rin[a], hanggang sa hukayin ko ang lupa sa paligid nito at lagyan ko ito ng dumi ng hayop[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “pabayaan mo pa ito sa taong ito” o “bigyan mo pa ito ng isang taon.”
    reason: lexical_alternative
  - marker: b
    text: Ang tinutukoy ay dumi na ginagamit bilang pataba; maaari ring isalin, “lagyan ko ito ng pataba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς λέγει
  choice: sumagot siya
  rationale: Ang participle at present verb ay karaniwang pormulang pasalaysay. Ang “sumagot siya” ay likas sa makabagong Tagalog at hindi nangangailangan ng mabigat na “sumagot at nagsabi.”
- source_word: Κύριε
  choice: Panginoon
  rationale: Pinananatili nito ang karaniwang katumbas ng κύριος. Sa loob ng talinghaga, maaari rin itong maging magalang na tawag sa may-ari.
- source_word: ἄφες αὐτὴν
  choice: hayaan mo muna ito
  rationale: Ipinahihiwatig ng ἀφίημι na pabayaang manatili ang puno sa halip na putulin. Ang “muna” ay likas na naghahayag ng pansamantalang palugit nang hindi tahasang idinaragdag ang mas interpretibong “iligtas.”
- source_word: καὶ τοῦτο τὸ ἔτος
  choice: sa taon ding ito
  rationale: Ang “din” ang nagpapahayag sa καί na humihiling ng karagdagang taon, habang pinananatili ang tahasang “taong ito” ng Griyego.
- source_word: ἕως ὅτου
  choice: hanggang sa
  rationale: Ito ang tuwiran at likas na panandang Tagalog para sa hangganan ng panahong ipinahihiwatig ng parirala.
- source_word: σκάψω περὶ αὐτὴν
  choice: mahukayan ko ang palibot nito
  rationale: Pinananatili ng “hukay” ang kongkretong larawan ng σκάπτω at ng paggawa sa lupang nakapalibot sa puno.
- source_word: βάλω κόπρια
  choice: lagyan ito ng dumi ng hayop
  rationale: Ang κόπρια ay dumi o manure na ginagamit na pataba. Pinananatili ng salin ang kongkretong larawan sa halip na gawing pangkalahatan lamang na “patabain.”
theological_decisions:
- issue: Ang κύριος bilang tawag sa may-ari sa loob ng talinghaga
  choice: Panginoon
  alternative: Ginoo; amo
  rationale: Pinananatili ang karaniwang salin ng κύριος, ngunit hindi ipinapalagay na ang tauhan ay tuwirang nakikipag-usap sa Diyos; sa tagpong ito, maaari itong gumana bilang magalang na tawag sa may-ari.
- issue: Ang ipinahihiwatig na palugit sa ἄφες αὐτὴν
  choice: hayaan mo muna ito
  alternative: huwag mo muna itong putulin; iligtas mo muna ito
  rationale: Iniiwasang gawing tahasan sa pangunahing teksto ang pagputol o pagliligtas, na ipinahihiwatig ng konteksto ngunit hindi mismong nakasaad sa pandiwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “sumagot siya” sa halip na literal ngunit mabigat na “sumagot at nagsabi.” Pinanatili ang agrikultural na kongkretong larawan sa “mahukayan” at “dumi ng hayop.”
