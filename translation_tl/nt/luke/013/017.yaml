  text: καὶ ταῦτα λέγοντος αὐτοῦ κατῃσχύνοντο πάντες οἱ ἀντικείμενοι αὐτῷ, καὶ πᾶς ὁ ὄχλος ἔχαιρεν ἐπὶ πᾶσιν τοῖς ἐνδόξοις τοῖς γινομένοις ὑπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/017.yaml
  text: And as he was saying these things[a], all who were opposing him were put to shame[b], and the whole crowd was rejoicing over all the glorious things being done by him.
translation:
  language: tl
  text: Habang sinasabi niya ang mga ito, napapahiya ang lahat ng sumasalungat sa kanya,[a] at ang buong karamihan ay nagagalak dahil sa lahat ng maluwalhating bagay na ginagawa niya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lahat ng mga kalaban niya.”
    reason: lexical_alternative
  - marker: b
    text: O “lahat ng kamangha-manghang bagay” o “lahat ng kahanga-hangang bagay.” Literal na “maluwalhating mga bagay” ang Griyego—isang malawak na pananalitang maaaring kabilang ang kanyang makapangyarihang mga gawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα λέγοντος αὐτοῦ
  choice: Habang sinasabi niya ang mga bagay na ito
  rationale: Pinananatili ng “habang” ang magkasabay at nagpapatuloy na kilos ng genitive absolute na may present participle.
- source_word: κατῃσχύνοντο
  choice: napahiya
  rationale: Ipinahahayag ang pagkalagay sa kahihiyan bilang bunga ng sinabi ni Jesus; natural ito sa modernong Tagalog at hindi lamang tumutukoy sa pansariling pagkapahiya.
- source_word: οἱ ἀντικείμενοι αὐτῷ
  choice: ang lahat ng sumasalungat sa kanya
  rationale: 'Pinananatili ang aktibong pandiwang diwa ng participle: sila ay kumikilos laban kay Jesus, hindi lamang nakategorya bilang mga kalaban.'
- source_word: πᾶς ὁ ὄχλος
  choice: ang buong karamihan
  rationale: Natural na kolektibong pananalita na pinananatili ang diwang ang karamihan sa kabuuan ang tumugon.
- source_word: ἔχαιρεν
  choice: nagagalak
  rationale: Ang aspektong di-ganap ay isinasaad sa patuloy na kilos na “nagagalak,” sa halip na isang minsanang reaksiyon lamang.
- source_word: ἐπὶ πᾶσιν τοῖς ἐνδόξοις
  choice: dahil sa lahat ng maluwalhating bagay
  rationale: Ang “dahil sa” ay natural na naghahayag ng batayan ng kagalakan; ang “maluwalhating bagay” ay nagpapanatili sa malawak na saklaw ng ἔνδοξος nang hindi nililimitahan ito sa mga himala.
- source_word: τοῖς γινομένοις ὑπ’ αὐτοῦ
  choice: na ginagawa niya
  rationale: Natural na aktibong ayos sa Tagalog para sa malinaw na ahensiya ng ὑπό; pinananatili ng “ginagawa” ang nagpapatuloy na aspekto ng present participle.
theological_decisions:
- issue: Kalikasan ng “maluwalhating mga bagay”
  choice: maluwalhating bagay
  alternative: kamangha-manghang mga bagay; kahanga-hangang mga bagay; mga himala
  rationale: Malawak ang kahulugan ng ἐνδόξοις at maaaring saklawin ang makapangyarihan, marangal, at kahanga-hangang mga gawa. Hindi ito dapat paliitin sa “mga himala” lamang, bagaman kabilang dito ang pagpapagaling sa konteksto.
- issue: Ahensiya sa ὑπ’ αὐτοῦ
  choice: na ginagawa niya
  alternative: na ginagawa sa pamamagitan niya
  rationale: Tuwirang iniuugnay ng parirala kay Jesus ang paggawa. Iniiwasan ng salin ang di-kinakailangang pagpapahina sa ahensiyang iyon.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “sumasalungat” upang mapanatili ang aktibong diwa ng pagtutol, at “maluwalhating bagay” upang huwag paliitin ang sadyang malawak na pananalita ng Griyego. Ang mga pananda ng talababa [a] at [b] ay parehong nasa pangunahing teksto.
