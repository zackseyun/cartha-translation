reference: Luke 13:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ⸀γυνὴ πνεῦμα ἔχουσα ἀσθενείας ἔτη ⸀δεκαοκτώ, καὶ ἦν συγκύπτουσα καὶ μὴ δυναμένη ἀνακύψαι εἰς τὸ παντελές.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/011.yaml
  text: And behold[a], there was a woman who had a spirit of infirmity for eighteen years, and she was bent over and unable to straighten up completely.
translation:
  language: tl
  text: At masdan[a], may isang babaeng labingwalong taon nang may espiritu ng panghihina. Nakayuko siya at hindi lubusang makatuwid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “At narito.” Tahasang binabanggit sa Griyego ang isang “espiritu ng panghihina,” na maaaring magpahiwatig ng espirituwal na pagkilos sa kanyang dinaranas.
    reason: Pinananatili ang pansin-pukaw na ἰδοὺ at ang tahasang “espiritu,” nang hindi ipinagpapalagay ang mas tiyak na uri o sanhi ng kanyang kalagayan.
lexical_decisions:
- source_word: ἰδοὺ
  choice: naroon
  rationale: Sa kontekstong pasalaysay, likas na ipinakikilala ng “naroon” ang biglang pagtuon sa babae, nang hindi gumagamit ng makalumang padamdam.
- source_word: γυνὴ
  choice: isang babae
  rationale: Ipinakikilala rito ang isang babaeng hindi pa natutukoy sa salaysay.
- source_word: πνεῦμα ἔχουσα ἀσθενείας
  choice: may espiritung nagdudulot ng panghihina
  rationale: Pinananatili ang tahasang πνεῦμα at inilalahad nang natural sa Tagalog ang ugnayan nito sa ἀσθενείας, nang hindi tiyak na tinatawag itong demonyo o simpleng karamdamang medikal.
- source_word: ἔτη δεκαοκτώ
  choice: labingwalong taon nang
  rationale: Natural na pahayag sa Tagalog para sa kalagayang nagpapatuloy sa loob ng naturang panahon.
- source_word: συγκύπτουσα
  choice: hukot
  rationale: Maikli at malinaw na inilalarawan ang katawang nakabaluktot o nakayuko dahil sa kalagayan.
- source_word: μὴ δυναμένη ἀνακύψαι
  choice: hindi niya kayang maituwid ang kanyang katawan
  rationale: Ipinahahayag ang kawalan ng kakayahang makabalik sa tuwid na tindig; idinagdag ang “katawan” para sa likas at malinaw na Tagalog.
- source_word: εἰς τὸ παντελές
  choice: nang lubos
  rationale: 'Pinananatili ang pagpapalakas ng parirala: hindi niya lubusang maituwid ang katawan.'
theological_decisions:
- issue: Kung pananatilihin ang tahasang espirituwal na sangkap ng πνεῦμα ἀσθενείας
  choice: may espiritung nagdudulot ng panghihina
  alternative: may kapansanan; may karamdamang nagpapahina; may espiritu ng panghihina
  rationale: Tahasan sa Griyego ang “espiritu,” kaya hindi ito inalis o ginawang pawang medikal. Gayunman, hindi rin ipinasiya ng salin na ito ang higit na tiyak na uri ng espirituwal na pagkilos kaysa sa sinasabi ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “hukot” bilang karaniwang paglalarawan sa pisikal na kalagayan, at iniwasan ang makalumang “narito” bilang padamdam at ang sobrang teknikal na “karamdaman.”
