  text: ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων, ὅταν ⸀ὄψησθε Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ καὶ πάντας τοὺς προφήτας ἐν τῇ βασιλείᾳ τοῦ θεοῦ, ὑμᾶς δὲ ἐκβαλλομένους ἔξω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/028.yaml
  text: There will be weeping and gnashing of teeth there[a], when you see Abraham and Isaac and Jacob and all the prophets in the kingdom of God[c][b], but you yourselves thrown out.
translation:
  language: tl
  text: Doon magkakaroon ng pagtangis at pagngangalit ng mga ngipin kapag nakita ninyo sina Abraham, Isaac, Jacob, at ang lahat ng propeta sa kaharian ng Diyos, ngunit kayo mismo ay itataboy palabas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ay itatapon sa labas.” Binibigyang-diin ng Griyegong ἐκβαλλομένους kasama ng ἔξω ang sapilitang pagpapaalis.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖ
  choice: Doon
  rationale: Likas at tuwirang pang-abay na tumutukoy sa lugar ng pagkakait o paghatol.
- source_word: ὁ κλαυθμὸς
  choice: pagtangis
  rationale: Dignified at malinaw na salin para sa hayagang pag-iyak sa konteksto ng dalamhati.
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: pagngangalit ng mga ngipin
  rationale: Karaniwan at tumpak na ekspresyong Filipino para sa matinding dalamhati o galit; pinananatili ang kongkretong larawan ng Griyego.
- source_word: ὅταν ὄψησθε
  choice: kapag nakita ninyo
  rationale: Ipinahahayag ang tiyak na pangyayaring nakaharap sa hinaharap sa natural na Tagalog.
- source_word: πάντας τοὺς προφήτας
  choice: ang lahat ng propeta
  rationale: Pinananatili ang diin ng πάντας, 'lahat.'
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: sa kaharian ng Diyos
  rationale: Pamilyar at tuwirang salin ng mahalagang pariralang biblikal.
- source_word: ὑμᾶς δὲ
  choice: ngunit kayo mismo
  rationale: Ipinakikita ng 'ngunit' ang paghahambing, at ng 'kayo mismo' ang diin sa tahasang panghalip.
- source_word: ἐκβαλλομένους ἔξω
  choice: ay itinataboy palabas
  rationale: Ang 'itinataboy' ay nagpapanatili sa pasibong anyo at puwersa ng sapilitang pagpapaalis; ang 'palabas' ay tahasang kumakatawan sa ἔξω.
theological_decisions:
- issue: Kalikasan ng larawan ng paghatol
  choice: Panatilihin ang kongkretong larawan ng pagtangis, pagngangalit ng mga ngipin, at sapilitang pagkakait sa kaharian.
  alternative: Ipaliwanag ito bilang 'matinding kalungkutan' o tahasang tukuyin bilang isang buong doktrina ng huling kaparusahan.
  rationale: Inilalarawan ng talata ang dalamhati at pagkakait ngunit hindi nito rito binibigyang-kahulugan ang lahat ng detalye ng huling paghatol; kaya hindi dapat higitan ng salin ang sinasabi ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang 'pagtangis' at ang pamilyar na pariralang 'pagngangalit ng mga ngipin'; pinanatili ang matinding puwersa ng sapilitang pagkakait nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
