  source_fidelity: 'Tumpak ang mga pangunahing elemento: ang pagtangis, pagngangalit ng mga ngipin, pagkakita kina Abraham, Isaac, Jacob, at lahat ng propeta sa kaharian ng Diyos, at ang mariing paghahambing sa mga kausap na itinataboy palabas. Gayunman, ang kasalukuyang anyong “ay itinataboy” ay maaaring magpahiwatig ng kasalukuyang nagaganap na aksiyon, samantalang ang ὅταν ὄψησθε ay nagtatakda ng isang panghinaharap na tagpo. Ang panghinaharap na “itataboy” ay mas malinaw sa Filipino at pinananatili ang puwersa ng pasibong ἐκβαλλομένους.'
  naturalness: Natural at marangal ang kabuuang rehistro. Ang “pagtangis” at “pagngangalit ng mga ngipin” ay matatag na mga pariralang biblikal sa modernong Filipino. Mas maayos ang daloy kung “itataboy palabas” ang gamitin upang tumugma sa “kapag nakita ninyo.”
  terminology: Wasto at pare-pareho ang “kaharian ng Diyos,” mga pangalan ng mga patriyarka, at “mga propeta.” Ang “itataboy palabas” ay sapat na malakas para sa ἐκβαλλομένους ἔξω nang hindi nagdaragdag ng interpretasyong doktrinal.
