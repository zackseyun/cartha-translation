id: LUK.13.25
reference: Luke 13:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀφ’ οὗ ἂν ἐγερθῇ ὁ οἰκοδεσπότης καὶ ἀποκλείσῃ τὴν θύραν, καὶ ἄρξησθε ἔξω ἑστάναι καὶ κρούειν τὴν θύραν λέγοντες· ⸀Κύριε, ἄνοιξον ἡμῖν· καὶ ἀποκριθεὶς ἐρεῖ ὑμῖν· Οὐκ οἶδα ὑμᾶς πόθεν ἐστέ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/025.yaml
  text: Once the master of the house has risen and shut the door[a], and you begin to stand outside and knock on the door, saying, ‘Lord, open to us,’ then he will answer you, ‘I do not know you[c][b], where you are from.’
translation:
  language: tl
  text: Kapag tumayo na ang may-ari ng bahay at isinara na niya ang pinto, magsisimula kayong tumayo sa labas at kumatok sa pinto, na sinasabi, ‘Panginoon[a], pagbuksan mo kami.’ Ngunit sasagot siya sa inyo, ‘Hindi ko kayo kilala ni alam kung taga-saan kayo.’[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Griyegong κύριε ay maaari ring mangahulugang “Ginoo” o “Amo” sa konteksto ng talinghaga.
    reason: alternative_reading
  - marker: b
    text: 'Mas literal: “Hindi ko kayo kilala, ni alam ko kung taga-saan kayo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφ’ οὗ ἂν
  choice: Kapag … na
  rationale: 'Ipinahahayag nito ang di-tiyak na panahong darating: kapag o sa sandaling mangyari ang kasunod na kilos. Likas ito sa modernong Tagalog at pinananatili ang temporal na puwersa ng Griyego.'
- source_word: ἐγερθῇ
  choice: tumayo na
  rationale: Sa konteksto, ang pandiwa ay tumutukoy sa pagtayo mula sa pagkakaupo o pagkakahimlay, hindi sa muling pagkabuhay.
- source_word: ὁ οἰκοδεσπότης
  choice: ang may-ari ng bahay
  rationale: Malinaw at pangkaraniwang tawag ito sa taong namamahala at may awtoridad sa bahay; iniiwasan nito ang lipas o di-likas na ekspresyon.
- source_word: ἀποκλείσῃ τὴν θύραν
  choice: isinara na niya ang pinto
  rationale: Tuwirang inilalarawan ang pagsasara ng pinto. Ang diwa ng pagkakait ng pagpasok ay malinaw mula sa kasunod na pagtayo at pagkatok sa labas.
- source_word: ἄρξησθε ἔξω ἑστάναι
  choice: magsisimula kayong tumayo sa labas
  rationale: Pinananatili ang ἄρξησθε, ‘magsimula,’ at ang kalagayang nasa labas na ipinahahayag ng ἑστάναι.
- source_word: κρούειν τὴν θύραν
  choice: kumatok sa pinto
  rationale: Ito ang natural at wastong katumbas sa Tagalog; hindi nito pinalalakas nang lampas sa teksto ang tindi ng pagkatok.
- source_word: Κύριε
  choice: Panginoon
  rationale: Pinananatili nito ang karaniwang kahulugan ng κύριος at ang posibleng mas malawak na teolohikal na alingawngaw sa Lucas, habang nililinaw sa talababa ang posibleng kahulugang panlipunan sa talinghaga.
- source_word: ἄνοιξον ἡμῖν
  choice: pagbuksan mo kami
  rationale: Natural na pakiusap ito sa Tagalog para buksan ang pinto upang makapasok ang mga nagsasalita.
- source_word: ἀποκριθεὶς ἐρεῖ ὑμῖν
  choice: sasagot siya sa inyo
  rationale: Likas na pinagsasama sa Tagalog ang Griyegong participle at pandiwang ‘sasabihin’ bilang ‘sasagot.’
- source_word: Οὐκ οἶδα ὑμᾶς πόθεν ἐστέ
  choice: Hindi ko kayo kilala—hindi ko alam kung taga-saan kayo
  rationale: Hayagang pinananatili ang ὑμᾶς, ‘kayo,’ at ang sugnay tungkol sa pinagmulan. Ang gitling at ikalawang ‘hindi ko alam’ ay nagbibigay ng natural na Tagalog nang hindi ikinukubli ang magaspang at mariing pagkakabuo ng Griyego.
theological_decisions:
- issue: Kahulugan ng κύριος sa pananalita sa loob ng talinghaga
  choice: Panginoon
  alternative: Ginoo o amo
  rationale: Ang ‘Panginoon’ ang tuwirang tradisyonal na katumbas at maaaring magtaglay ng alingawngaw na lampas sa simpleng magalang na pagtawag. Gayunman, hindi itinatanggi ng salin ang mas karaniwang kahulugang ‘ginoo’ o ‘amo,’ kaya inilagay iyon sa talababa.
- issue: Puwersa ng οὐκ οἶδα ὑμᾶς πόθεν ἐστέ
  choice: Hindi ko kayo kilala—hindi ko alam kung taga-saan kayo
  alternative: Hindi ko alam kung taga-saan kayo
  rationale: Pinananatili ng napiling salin kapuwa ang tahasang layon na ‘kayo’ at ang tanong tungkol sa pinagmulan. Hindi nito binabawasan ang pahayag tungo lamang sa kawalan ng kaalaman tungkol sa kanilang lugar, ni ipinapakahulugan nang tiyak kung ang ‘pagkilala’ ay personal, panlipunan, o hudisyal.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang karaniwang ‘may-ari ng bahay’ sa halip na mas lipas o teknikal na katawagan. Pinanatili ang bahagyang tensiyon ng huling pahayag sa pamamagitan ng tahasang ‘kayo’ at hiwalay na pagtukoy sa kanilang pinagmulan.
