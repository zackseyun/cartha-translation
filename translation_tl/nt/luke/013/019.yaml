id: LUK.13.19
reference: Luke 13:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁμοία ἐστὶν κόκκῳ σινάπεως, ὃν λαβὼν ἄνθρωπος ἔβαλεν εἰς κῆπον ἑαυτοῦ, καὶ ηὔξησεν καὶ ἐγένετο εἰς ⸀δένδρον, καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατεσκήνωσεν ἐν τοῖς κλάδοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/019.yaml
  text: It is like a mustard seed[a], which a man took and threw into his garden, and it grew and became a tree[b], and the birds of the sky nested in its branches.
translation:
  language: tl
  text: Tulad ito ng isang butil ng mustasa na kinuha ng isang lalaki at inihagis sa kanyang hardin. Lumaki ito at naging isang puno[a], at namugad sa mga sanga nito ang mga ibon sa himpapawid[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sinasabi sa Griyego na “naging isang puno,” kaya pinananatili rito ang pinalaking larawan ng paglago sa talinghaga.
    reason: lexical_alternative
  - marker: b
    text: 'Mas literal: “ang mga ibon ng langit”; maaari ring isalin na “ang mga ibon sa hangin.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοία ἐστὶν
  choice: Tulad ito ng
  rationale: Likas at malinaw na pormula ng paghahambing sa modernong Filipino, habang pinananatili ang payak na anyo ng Griyego.
- source_word: κόκκῳ σινάπεως
  choice: isang butil ng mustasa
  rationale: Ang κόκκος ay butil o binhi; ang “butil ng mustasa” ay karaniwan at madaling maunawaang tawag sa maliit na binhi nito.
- source_word: ὃν λαβὼν ἄνθρωπος
  choice: na kinuha ng isang lalaki
  rationale: Pinananatili ang isang tiyak na lalaking tauhan sa talinghaga sa halip na gawing walang kasarian ang ἄνθρωπος.
- source_word: ἔβαλεν εἰς κῆπον ἑαυτοῦ
  choice: at inihagis sa kanyang hardin
  rationale: Pinananatili ng “inihagis” ang masiglang kahulugan ng βάλλω; ang κῆπος ay partikular na hardin, hindi bukid. Hindi ginamit ang “itinanim” sapagkat higit itong interpretatibo.
- source_word: ηὔξησεν
  choice: Lumaki ito
  rationale: Payak at natural na pagpapahayag ng paglaki ng halaman.
- source_word: ἐγένετο εἰς δένδρον
  choice: naging isang puno
  rationale: Tuwirang pinananatili ang δένδρον at ang pinalaking larawan ng paglago sa talinghaga.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: ang mga ibon sa himpapawid
  rationale: Natural na Filipino para sa mga ibong lumilipad sa kalawakan sa itaas; ang mas literal na “mga ibon ng langit” ay inilagay bilang alternatibo sa talababa.
- source_word: κατεσκήνωσεν
  choice: namugad
  rationale: Sa konteksto ng mga ibon at mga sanga, malinaw at idiomatiko nitong ipinahahayag ang paninirahan o pagpugad.
- source_word: ἐν τοῖς κλάδοις αὐτοῦ
  choice: sa mga sanga nito
  rationale: Tuwiran at natural; ang “nito” ay tumutukoy sa punong naging anyo ng halaman.
theological_decisions:
- issue: Kasarian ng ἄνθρωπος
  choice: isang lalaki
  alternative: isang tao
  rationale: Ang tauhan sa talinghaga ay iniharap sa anyong panlalaking isahan; pinananatili ito nang hindi ginagawang pangkalahatang pahayag tungkol sa sangkatauhan.
- issue: Larawan ng δένδρον sa talinghaga ng butil ng mustasa
  choice: puno
  alternative: malaking halaman o palumpong
  rationale: Tahasang “puno” ang Griyego. Pinananatili ang posibleng eksaherado o masining na larawan sa halip na iayon ito sa isang botanikal na paliwanag.
- issue: Kahulugan ng τοῦ οὐρανοῦ
  choice: sa himpapawid
  alternative: ng langit
  rationale: Dito ay pangkalawakan at hindi kinakailangang teolohikal ang gamit ng οὐρανός. Ang “himpapawid” ay natural sa konteksto, habang kinikilala sa talababa ang mas literal na anyo.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling basahin. Ginamit ang “inihagis” upang mapanatili ang vivid na kilos ng Griyego, at “namugad” upang maging likas ang larawan ng mga ibon sa mga sanga.
