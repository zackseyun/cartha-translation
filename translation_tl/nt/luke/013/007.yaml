  text: εἶπεν δὲ πρὸς τὸν ἀμπελουργόν· Ἰδοὺ τρία ἔτη ⸂ἀφ’ οὗ⸃ ἔρχομαι ζητῶν καρπὸν ἐν τῇ συκῇ ταύτῃ καὶ οὐχ εὑρίσκω· ⸀ἔκκοψον αὐτήν· ἱνατί καὶ τὴν γῆν καταργεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/007.yaml
  text: Then he said to the vine-dresser[a], ‘Look, for three years now I have come seeking fruit on this fig tree and have found none. Cut it down. Why should it even keep using up the ground?’
translation:
  language: tl
  text: Sinabi niya sa tagapag-alaga ng ubasan, “Tingnan mo, tatlong taon na akong pumaparito upang maghanap ng bunga sa punong igos na ito, at wala akong natatagpuan. Putulin mo ito. Bakit pa nito ginagawang walang pakinabang ang lupa?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Bakit pa nito inuubos ang lupa?” Maaaring mangahulugan ang pandiwang Griyego na ginagawang walang silbi o hindi mabunga ang lupa, hindi lamang na sinasakop nito ang puwesto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμπελουργόν
  choice: tagapag-alaga ng ubasan
  rationale: Tumutukoy sa taong nagtatanim at nag-aalaga ng ubasan; malinaw at natural ito sa modernong Filipino at pinananatili ang tagpuan sa ubasan.
- source_word: Ἰδοὺ
  choice: Tingnan mo
  rationale: Nagbibigay-diin at tumatawag ng pansin sa kausap nang hindi gumagamit ng makalumang pananalita.
- source_word: τρία ἔτη ἀφ’ οὗ
  choice: tatlong taon na
  rationale: Likas na ipinahahayag sa Filipino ang tagal na umaabot mula sa nakaraan hanggang sa kasalukuyan.
- source_word: ἔρχομαι ζητῶν
  choice: pumaparito upang maghanap
  rationale: Ipinakikita ang paulit-ulit na pagparito at ang layuning humanap sa loob ng tatlong taon.
- source_word: καρπὸν
  choice: bunga
  rationale: Pinananatili ang literal na larawang pansakahan ng talinghaga.
- source_word: συκῇ
  choice: punong igos
  rationale: Karaniwang katumbas ng fig tree at tahasang tumutukoy sa puno.
- source_word: οὐχ εὑρίσκω
  choice: wala akong makita
  rationale: Sinasalamin ang kasalukuyang anyo ng Griyego sa konteksto ng paulit-ulit na paghahanap, sa natural na Filipino.
- source_word: ἔκκοψον
  choice: Putulin mo na ito
  rationale: Direktang utos na putulin at alisin ang punong hindi namumunga; ang “na” ay likas na naghahatid ng agarang pasiya sa Filipino.
- source_word: ἱνατί
  choice: Bakit
  rationale: Payak at tuwirang katumbas ng tanong tungkol sa dahilan.
- source_word: καὶ
  choice: pa
  rationale: 'Sa retorikal na tanong, ipinahahayag nito ang karagdagang suliranin: bukod sa hindi pamumunga, nakapipinsala pa ang puno sa pakinabang ng lupa.'
- source_word: γῆν
  choice: lupa
  rationale: Natural na tawag sa lupang tinutubuan at pinagtataniman sa kontekstong pansakahan.
- source_word: καταργεῖ
  choice: inuubos ang pakinabang
  rationale: Inihahatid ang ideya na ginagawang di-mapakinabangan o di-produktibo ng puno ang lupa, habang pinananatili ang posibilidad na higit ito sa simpleng pag-okupa ng espasyo.
theological_decisions:
- issue: Larawan ng talinghaga laban sa tahasang espirituwal na pagpapakahulugan
  choice: Panatilihin ang literal na wikang pansakahan nang hindi ipinapasok sa talata ang espirituwal na kahulugan.
  alternative: Isalin nang mas interpretatibo upang tuwirang banggitin ang espirituwal na kawalan ng bunga.
  rationale: Talinghaga ang konteksto; dapat manggaling sa konteksto ang pagpapakahulugan at hindi ito dapat isingit sa mismong salin.
- issue: Saklaw ng καταργεῖ
  choice: Ilagay sa pangunahing teksto ang ideyang inuubos ang pakinabang ng lupa at itala sa talababa ang alternatibong paggawa rito na walang silbi.
  alternative: Isalin lamang bilang pag-okupa o pagsasayang ng espasyo sa lupa.
  rationale: Maaaring tumukoy ang pandiwa sa paggawang walang silbi o di-produktibo, hindi lamang sa pagkuha ng puwesto; pinananatili ng talababa ang tunay na leksikal na lawak.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “tagapag-alaga ng ubasan” sa halip na teknikal o makalumang katawagan, at pinanatili ang tuwirang pananalita at larawang pansakahan ng talinghaga.
