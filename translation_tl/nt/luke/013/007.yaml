    issue: Hindi likas at hindi tuwirang naisasalin ang “inuubos ang pakinabang ng lupa.”
    rationale: Ang Griyegong καταργεῖ ay may τὴν γῆν (“ang lupa”) bilang layon at tumutukoy sa pagpapawalang-silbi o pagpapaging di-mabunga nito. Ang “pakinabang” ay idinadagdag bilang layon at nagiging malabo ang pangungusap.
  - severity: low
    issue: Ang “ngunit wala akong makita” ay mas nakatuon sa isang kasalukuyang pagkabigong makakita.
    rationale: Sa konteksto ng “tatlong taon na akong pumaparito,” ang “at wala akong natatagpuan” ay mas malinaw na nagpapahiwatig ng paulit-ulit na paghahanap na walang resulta, habang nananatiling natural sa Filipino.
