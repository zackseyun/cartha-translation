revisions:
- from: Sinabi niya sa tagapag-alaga ng ubasan, “Tingnan mo, tatlong taon na akong pumaparito upang maghanap ng bunga sa punong igos na ito, ngunit wala akong makita. Putulin mo na ito. Bakit pa nito inuubos ang pakinabang ng lupa?[a]”
  to: Sinabi niya sa tagapag-alaga ng ubasan, “Tingnan mo, tatlong taon na akong pumaparito upang maghanap ng bunga sa punong igos na ito, at wala akong natatagpuan. Putulin mo ito. Bakit pa nito ginagawang walang pakinabang ang lupa?[a]”
  rationale: Pinalitan ang di-idiomatikong “inuubos ang pakinabang ng lupa” ng tuwirang pagsasalin na ang lupa mismo ang ginagawang walang pakinabang. Iningatan ng talababa ang alternatibong diwa ng pag-ubos o pagkapinsala sa lupa. Pinakinis din ang paglalarawan sa paulit-ulit na paghahanap nang hindi binabago ang larawan o kahulugan ng talinghaga.
