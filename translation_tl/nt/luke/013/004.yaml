  source_fidelity: Ang “labingwalong iyon,” “tore sa Siloam,” paghahambing sa lahat ng naninirahan sa Jerusalem, at saklaw na “mga tao” ay wasto. Gayunman, ang “at namatay” ay hindi tahasang ipinapakita na ang tore ang pumatay sa kanila, gaya ng ἀπέκτεινεν αὐτούς. Ang “mas mabigat ang pagkakautang nila” ay nauunawaan ngunit hindi likas na Tagalog para sa moral na pananagutan.
  naturalness: Mas natural ang “mas mabigat ang pananagutan nila,” samantalang ipinapaliwanag ng talababa na ang Griyego ay literal na “mga may utang.” Ang “napatay nito” ay malinaw at likas, na ang “nito” ay tumutukoy sa tore.
  terminology: Pinananatili ng pangunahing teksto ang moral na pananagutan nang hindi ito awtomatikong ginagawang “mas makasalanan.” Itinatala ng talababa ang literal na metapora ng pagkakautang at ang mga posibleng salin, kaya hindi nabubura ang pagkakaiba nito sa ἁμαρτωλοί sa naunang talata.
