  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἢ ἐκεῖνοι οἱ ⸀δεκαοκτὼ ἐφ’ οὓς ἔπεσεν ὁ πύργος ἐν τῷ Σιλωὰμ καὶ ἀπέκτεινεν αὐτούς, δοκεῖτε ὅτι ⸀αὐτοὶ ὀφειλέται ἐγένοντο παρὰ πάντας ⸀τοὺς ἀνθρώπους τοὺς ⸀κατοικοῦντας Ἰερουσαλήμ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/004.yaml
  text: Or those eighteen on whom the tower in Siloam fell and killed them—do you think that they became debtors beyond all the men living in Jerusalem?[a][b]
translation:
  language: tl
  text: O ang labingwalong iyon na nabagsakan ng tore sa Siloam at napatay nito—sa palagay ba ninyo ay mas mabigat ang pananagutan nila kaysa sa lahat ng taong naninirahan sa Jerusalem?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “mga may utang.” Tumutukoy ito sa moral na pagkakautang o pananagutan; maaari ring isalin na “mas makasalanan” o “mas mabigat ang pagkakasala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: O
  rationale: Nagpapasok ito ng isa pang halimbawa sa nagpapatuloy na pangangatuwiran ni Jesus.
- source_word: ἐκεῖνοι οἱ δεκαοκτώ
  choice: ang labingwalong iyon
  rationale: Pinananatili ang demonstratibo at bilang nang hindi nagdaragdag ng kasariang hindi tahasang nasa Griyego.
- source_word: ἐφ’ οὓς ἔπεσεν ὁ πύργος
  choice: na nabagsakan ng tore
  rationale: Likas na Tagalog para sa toreng nahulog sa kanila, habang nananatiling malapit sa kilos ng ἔπεσεν.
- source_word: ἐν τῷ Σιλωὰμ
  choice: sa Siloam
  rationale: Tuwirang paglilipat ng pangalan ng lugar at natural na gamit ng pang-ukol sa Tagalog.
- source_word: ἀπέκτεινεν αὐτούς
  choice: at namatay
  rationale: Sa Tagalog, likas nitong ipinahahayag na ikinamatay nila ang pagbagsak ng tore; iniiwasan ang di-likas na pagtrato sa tore bilang sadyang pumapatay.
- source_word: δοκεῖτε ὅτι
  choice: sa palagay ba ninyo
  rationale: Natural at tuwirang tanong na nagpapanatili sa hamon ni Jesus.
- source_word: ὀφειλέται ἐγένοντο
  choice: mas mabigat ang pagkakautang nila
  rationale: Pinananatili ang metapora ng moral na pagkakautang ng ὀφειλέται, ngunit ipinahahayag nang natural ang paghahambing sa Tagalog.
- source_word: παρὰ πάντας τοὺς ἀνθρώπους
  choice: kaysa sa lahat ng taong
  rationale: Ipinakikita nang malinaw ang paghahambing ng παρά at ginagamit ang generic na kahulugan ng ἀνθρώπους.
- source_word: τοὺς κατοικοῦντας Ἰερουσαλήμ
  choice: naninirahan sa Jerusalem
  rationale: Natural na kasalukuyang paglalarawan sa mga residente ng Jerusalem.
theological_decisions:
- issue: Kahulugan ng ὀφειλέται sa konteksto
  choice: mas mabigat ang pagkakautang nila
  alternative: mas makasalanan sila / mas mabigat ang pagkakasala nila
  rationale: Ang talata ay gumagamit ng salitang nangangahulugang mga may utang, hindi ng tahasang salita para sa mga makasalanan gaya ng naunang halimbawa. Pinananatili ng salin ang metapora ng pananagutang moral at ang pagkakaiba ng pananalita ni Lucas.
- issue: Saklaw ng ἀνθρώπους
  choice: mga tao
  alternative: mga lalaki
  rationale: Dito ay tumutukoy ang salita sa pangkalahatang mga naninirahan sa Jerusalem, kaya mas tumpak sa konteksto ang inclusive na “mga tao.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “labingwalong” ayon sa kasalukuyang ortograpiya. Ang bahagyang di-karaniwang metapora ng “pagkakautang” ay sadyang pinanatili upang maipakita ang natatanging salitang Griyego at hindi ito tahimik na gawing “kasalanan.”
