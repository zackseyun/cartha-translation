  to: At sinabi niya sa kanila, “Humayo kayo at sabihin ninyo sa sorong iyon, ‘Narito, nagpapalayas ako ng mga demonyo at nagsasagawa ako ng mga pagpapagaling ngayon at bukas, at sa ikatlong araw ay aabot ako sa ganap na katuparan[a].’”
