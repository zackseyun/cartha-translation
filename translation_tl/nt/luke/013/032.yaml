source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Πορευθέντες εἴπατε τῇ ἀλώπεκι ταύτῃ· Ἰδοὺ ἐκβάλλω δαιμόνια καὶ ἰάσεις ⸀ἀποτελῶ σήμερον καὶ αὔριον, καὶ τῇ τρίτῃ τελειοῦμαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/032.yaml
  text: And he said to them[a], “Go and tell that fox, ‘Look, I cast out demons and accomplish healings today and tomorrow, and on the third day I am brought to completion.’”
translation:
  language: tl
  text: At sinabi niya sa kanila, “Humayo kayo at sabihin ninyo sa sorong iyon, ‘Narito, nagpapalayas ako ng mga demonyo at nagsasagawa ako ng mga pagpapagaling ngayon at bukas, at sa ikatlong araw ay aabot ako sa ganap na katuparan[a].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mararating ko ang aking layunin,” “magiging ganap ako,” o “matatapos ko ang aking gawain.” Ang salitang Griyego ay maaaring tumukoy sa pag-abot sa ganap na katuparan, malamang na sa katuparan ng itinakdang misyon ni Jesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλώπεκι
  choice: asong-gubat
  rationale: Tuwirang katawagang Filipino para sa fox; pinananatili nito ang talinghagang hayop at ang mapanghamak na himig ng ταύτῃ nang hindi ipinapaliwanag bilang ‘tuso.’
- source_word: Ἰδοὺ
  choice: Tingnan ninyo
  rationale: Likas na makabagong panawag-pansin na nagpapanatili sa deiktikong puwersa ng salita.
- source_word: ἐκβάλλω δαιμόνια
  choice: nagpapalayas ako ng mga demonyo
  rationale: Karaniwang parirala sa Filipino para sa pagpapalayas ng masasamang espiritu at malinaw na ipinapakita ang puwersa ng ἐκβάλλω.
- source_word: ἰάσεις ἀποτελῶ
  choice: nagpapagaling ako
  rationale: Natural at malinaw sa Filipino; ipinahahayag ang pagsasakatuparan ng mga pagpapagaling nang hindi gumagamit ng mabigat at di-likas na parirala.
- source_word: σήμερον καὶ αὔριον
  choice: ngayon at bukas
  rationale: Pinananatili ang literal na temporal na pares at ang posibleng idyomatikong diwa ng maikli ngunit takdang panahon.
- source_word: τῇ τρίτῃ
  choice: sa ikatlong araw
  rationale: Malinaw na temporal na salin ng datibong may ordinal.
- source_word: τελειοῦμαι
  choice: dinadala ako sa kaganapan
  rationale: Pinananatili ang pasibong anyo at ang bukas na diwa ng pagdadala sa katuparan o pagkumpleto, nang hindi tahasang nililimitahan ito sa kamatayan, muling pagkabuhay, o moral na pagpapasakdal.
theological_decisions:
- issue: Kahulugan ng τελειοῦμαι kaugnay ng misyon ni Jesus at posibleng pahiwatig sa kanyang kamatayan at muling pagkabuhay
  choice: dinadala ako sa kaganapan
  alternative: nararating ko ang aking layunin; nagiging ganap ako; natatapos ko ang aking gawain
  rationale: Maaaring tumukoy ang pahayag sa katuparan ng itinakdang misyon ni Jesus, kabilang ang sukdulan nito, ngunit hindi tahasang binabanggit ng Griyego rito ang muling pagkabuhay o pagluwalhati. Pinananatili ng salin ang pasibong anyo at teolohikal na tensiyon.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Humayo” upang tumbasan ang utos na Πορευθέντες nang may dignidad; iniwasan ang pagpapaliwanag sa “asong-gubat” bilang “tuso” upang manatili ang talinghaga at tunay na kalabuan ng teksto.
