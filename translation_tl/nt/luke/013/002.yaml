source:
  edition: SBLGNT
  text: καὶ ⸀ἀποκριθεὶς εἶπεν αὐτοῖς· Δοκεῖτε ὅτι οἱ Γαλιλαῖοι οὗτοι ἁμαρτωλοὶ παρὰ πάντας τοὺς Γαλιλαίους ἐγένοντο, ὅτι ⸀ταῦτα πεπόνθασιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/002.yaml
  text: And answering, he said to them, “Do you think that these Galileans became sinners beyond all the Galileans, because they have suffered these things?”
translation:
  language: tl
  text: At sumagot siya sa kanila, “Sa palagay ba ninyo, naging higit na makasalanan ang mga taga-Galileang ito kaysa sa lahat ng iba pang taga-Galilea dahil dinanas nila ang mga bagay na iyon?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: sumagot siya
  rationale: Natural na Tagalog para sa Semitikong pormulang ‘sumagot at sinabi,’ nang hindi inuulit ang dalawang pandiwa.
- source_word: ἁμαρτωλοὶ παρὰ πάντας τοὺς Γαλιλαίους ἐγένοντο
  choice: naging higit na makasalanan ... kaysa sa lahat ng iba pang taga-Galilea
  rationale: Pinananatili ng ‘naging’ ang ἐγένοντο at ng pahambing na parirala ang diwa ng παρὰ πάντας; idinagdag ang ‘iba pang’ upang likas at malinaw na ibukod sa paghahambing ang tinutukoy na pangkat.
- source_word: ταῦτα πεπόνθασιν
  choice: dinanas nila ang mga bagay na iyon
  rationale: Ipinahahayag ang perpektong aspekto bilang naganap na pagdurusang may kaugnayan sa kasalukuyang usapan, nang hindi tinutukoy nang higit sa sinasabi ng Griyego ang uri ng sinapit.
theological_decisions:
- issue: Ugnayan ng matinding pagdurusa at antas ng pagiging makasalanan
  choice: Iningatan bilang tanong ang palagay na higit na makasalanan sila dahil sa kanilang sinapit.
  alternative: Ipahiwatig agad sa talata na hindi patunay ng higit na kasalanan ang kanilang sinapit.
  rationale: Retorikal ang tanong at sinasagot sa kasunod na talata; hindi dapat isingit sa talatang ito ang paliwanag ng talata 3.
- issue: Kahulugan ng ἐγένοντο
  choice: naging
  alternative: ay / noon ay
  rationale: Pinananatili ang leksikal na anyo ng pandiwa at ang pagiging bukas ng eksaktong nuance nito, alinsunod sa source at audited consultation layer, sa halip na tahimik itong gawing simpleng copula.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang ‘taga-Galilea’ sa halip na mas teknikal o lumang ‘Galileo.’ Walang footnote dahil walang mahalagang tekstuwal o leksikal na isyung kailangang ilipat sa tala.
