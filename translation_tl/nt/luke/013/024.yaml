  to: Magsikap kayong pumasok sa pamamagitan ng makipot na pinto[a], sapagkat marami, sinasabi ko sa inyo, ang maghahangad na pumasok ngunit hindi makakapasok.
  rationale: Inayos ang panandang “sa pamamagitan ng” upang malinaw na katawanin ang διά, at pinalitan ang malabong “hindi nila magagawa” ng “hindi makakapasok,” na likas na Tagalog at tapat sa kontekstuwal na layon ng pandiwang “hindi magiging may kakayahan.” Pinasimple rin ang talababa upang ituon ito sa tunay na leksikal na alternatibo at sa pagkakaiba ng Lucas at Mateo.
