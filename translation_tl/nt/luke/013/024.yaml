  text: Ἀγωνίζεσθε εἰσελθεῖν διὰ τῆς στενῆς ⸀θύρας, ὅτι πολλοί, λέγω ὑμῖν, ζητήσουσιν εἰσελθεῖν καὶ οὐκ ἰσχύσουσιν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/024.yaml
  text: Strive to enter through the narrow door[a], because many, I tell you, will seek to enter and will not be able.
translation:
  language: tl
  text: Magsikap kayong pumasok sa pamamagitan ng makipot na pinto[a], sapagkat marami, sinasabi ko sa inyo, ang maghahangad na pumasok ngunit hindi makakapasok.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pamamagitan ng makipot na tarangkahan.” Ang salitang Griyego ni Lucas (θύρα) ay karaniwang nangangahulugang “pinto,” samantalang ang kahawig na pahayag sa Mateo ay gumagamit ng salitang nangangahulugang “tarangkahan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγωνίζεσθε
  choice: Magsikap kayo
  rationale: Ipinahahayag ng pangkasalukuyang pautos ang puspusang pagsisikap. Natural ito sa modernong Tagalog at mas matindi kaysa simpleng “subukan,” nang hindi nagpapasok ng paliwanag tungkol sa merito.
- source_word: εἰσελθεῖν
  choice: pumasok
  rationale: Direkta at likas na salin ng infinitive; pareho ang gamit sa dalawang paglitaw nito sa talata.
- source_word: διὰ τῆς στενῆς θύρας
  choice: sa makipot na pinto
  rationale: Ang θύρα ay karaniwang “pinto,” samantalang ang στενός ay “makipot.” Sa Tagalog, likas na ipinahahayag ng “sa” ang pagdaan sa isang pasukan; pinananatili ng talababa ang posibleng “daanan sa makipot na pinto” at ang alternatibong “tarangkahan.”
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw na ipinakikita ang dahilan ng naunang utos sa dignified ngunit karaniwang modernong Tagalog.
- source_word: πολλοί
  choice: marami
  rationale: Direktang salin ng pang-uring ginamit bilang pangngalan.
- source_word: λέγω ὑμῖν
  choice: sinasabi ko sa inyo
  rationale: Natural na katumbas ng pormulang pandiskurso at pinananatili ang diin ng nagsasalita.
- source_word: ζητήσουσιν
  choice: maghahangad
  rationale: Pinananatili ang diwa ng paghahanap o paghahangad at ang leksikal na pagkakaiba nito sa ἀγωνίζεσθε; ang “susubok” ay magpapalabo sa pagkakaibang iyon.
- source_word: οὐκ ἰσχύσουσιν
  choice: hindi nila magagawa
  rationale: Likas na Tagalog para sa kawalan ng kakayahang maisagawa ang pagpasok; hindi nito dinaragdagan ang teksto ng ideyang “hindi magtatagumpay” o “hindi sapat ang lakas.”
theological_decisions:
- issue: Pagsisikap ng tao at pananalita tungkol sa kaligtasan
  choice: Panatilihin ang mariing utos na “Magsikap” nang walang dagdag na paliwanag tungkol sa merito o mga gawa.
  alternative: “Gawin ninyo ang lahat upang makapasok” o “Subukan ninyong pumasok.”
  rationale: Ang talata mismo ay nag-uutos ng puspusang pagsisikap at nagbababala na may mga maghahangad ngunit hindi makakapasok. Pinananatili nito ang teolohikal na tensiyon nang hindi nagpapasya sa mga debate tungkol sa biyaya, merito, soberanya ng Diyos, o pananagutan ng tao.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “sapagkat” para sa bahagyang pormal na biblikal na himig, ngunit iniwasan ang lipas o labis na teknikal na pananalita.
