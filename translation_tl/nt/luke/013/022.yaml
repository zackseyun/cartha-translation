  yaml_path: translation/nt/luke/013/022.yaml
  text: And he was traveling through towns and villages[a], teaching and making his way toward Jerusalem.
translation:
  language: tl
  text: At dumaraan siya sa mga bayan at nayon, nagtuturo at naglalakbay patungong Jerusalem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa Jerusalem.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διεπορεύετο
  choice: naglalakbay siya
  rationale: Ang imperpektong anyo ay nagpapahiwatig ng nagpapatuloy na paglalakbay; likas sa modernong Tagalog ang “naglalakbay siya” sa ganitong salaysay.
- source_word: κατὰ πόλεις καὶ κώμας
  choice: sa mga bayan at mga nayon
  rationale: Ipinahihiwatig ng κατά na dumaraan siya sa iba't ibang malalaki at maliliit na pamayanan. Pinananatili ng “mga bayan at mga nayon” ang pagkakaiba ng πόλεις at κώμας nang hindi nagiging mabigat ang pangungusap.
- source_word: διδάσκων
  choice: na nagtuturo
  rationale: Ang kasalukuyang pandiwaring ito ay nagsasaad ng kasabay at nagpapatuloy na gawain habang naglalakbay siya.
- source_word: πορείαν ποιούμενος
  choice: habang patuloy siyang patungong
  rationale: Ang idyoma ay tumutukoy sa sinasadyang pagpapatuloy ng paglalakbay. Ang “habang patuloy siyang patungong” ay natural sa Tagalog at iniiwasan ang pilit na literal na “gumagawa ng paglalakbay.”
- source_word: εἰς Ἱεροσόλυμα
  choice: patungong Jerusalem
  rationale: Ang εἰς ay nagsasaad ng direksiyon o hantungan. Dito, ipinakikita ng “patungong” ang patuloy na pag-usad sa direksiyon ng Jerusalem, hindi pa ang pagdating doon.
- source_word: Ἱεροσόλυμα
  choice: Jerusalem
  rationale: Ginamit ang nakasanayang anyo ng pangalan ng lungsod sa Filipino.
theological_decisions:
- issue: Direksiyon ng paglalakbay ni Jesus sa Jerusalem
  choice: patungong Jerusalem
  alternative: papunta sa Jerusalem / sa Jerusalem
  rationale: Pinananatili ng “patungong” ang diwa ng nagpapatuloy at may layuning paglalakbay sa salaysay, nang hindi ipinahihiwatig na nakarating na siya. Isa itong pasiyang pangsalin, hindi paglalagay ng karagdagang doktrina.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bayan” at “nayon” para sa madaling maunawaang pagkakaiba ng mga pamayanan, at ang “patungong” upang maipahayag ang patuloy na direksiyon ng paglalakbay.
