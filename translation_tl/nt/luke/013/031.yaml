  source_fidelity: 'Tumpak ang pangunahing nilalaman: ang ilang Pariseo ay lumapit, nag-utos kay Jesus na umalis, at ibinigay ang dahilan na gusto siyang patayin ni Herodes. Ang salin ay hindi nagdaragdag ng anumang paghatol sa motibo ng mga Pariseo. Gayunman, ang «Nang oras ding iyon» ay hindi ang pinakanatural na paraan upang ipahayag ang Ἐν αὐτῇ τῇ ὥρᾳ sa modernong Tagalog; mas malinaw na napapanatili ng «Sa mismong oras na iyon» ang tiyak at mariing panahon ng Griyego.'
  naturalness: Natural ang karamihan ng pangungusap, kabilang ang «lumapit kay Jesus,» «Umalis ka at lumayo rito,» at «gusto kang patayin ni Herodes.» Ang pagpapalit ng pambungad na pariralang pangpanahon ay nagpapabuti sa daloy at idiomatikong gamit nang walang pagbabago sa kahulugan.
  terminology: Ang «Pariseo,» «Jesus,» at «Herodes» ay angkop at nakaugaliang mga anyo sa Filipino. Ang «sapagkat» ay marangal ngunit hindi lipas, at ang «gusto kang patayin» ay wastong isinasalin ang θέλει σε ἀποκτεῖναι nang hindi ito pinalalakas bilang tiyak na planong naisagawa.
