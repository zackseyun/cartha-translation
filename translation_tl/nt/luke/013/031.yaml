  rationale: Isang estilistikong pagwawasto lamang ang ginawa sa pambungad na panandang-panahon upang maging mas natural ang Tagalog at maipahayag ang diin ng Griyegong parirala. Hindi binago ang saklaw ng kahulugan, ang kawalang-katiyakan tungkol sa motibo ng mga Pariseo, o ang rehistro ng talata.
