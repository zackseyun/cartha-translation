  text: Ἐν αὐτῇ τῇ ⸀ὥρᾳ προσῆλθάν τινες Φαρισαῖοι λέγοντες αὐτῷ· Ἔξελθε καὶ πορεύου ἐντεῦθεν, ὅτι Ἡρῴδης θέλει σε ἀποκτεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/031.yaml
  text: At that very hour some Pharisees came up and said to him[a], “Leave and go away from here[b], because Herod wants to kill you.”
translation:
  language: tl
  text: Sa mismong oras na iyon, lumapit kay Jesus ang ilang Pariseo at sinabi sa kanya, “Umalis ka at lumayo rito, sapagkat gusto kang patayin ni Herodes.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν αὐτῇ τῇ ὥρᾳ
  choice: Nang oras ding iyon
  rationale: Ipinahahayag nito ang tiyak at agarang kaugnayan sa naunang pangyayari, habang pinananatili ang diin ng αὐτῇ sa natural na modernong Tagalog.
- source_word: προσῆλθάν τινες Φαρισαῖοι
  choice: lumapit kay Jesus ang ilang Pariseo
  rationale: Ang προσέρχομαι ay ‘lumapit,’ at ang τινες ay likas na isinasalin bilang ‘ilang.’ Nilinaw ang tinutukoy ng αὐτῷ bilang si Jesus para maging natural at malinaw sa Tagalog.
- source_word: λέγοντες αὐτῷ
  choice: at sinabi sa kanya
  rationale: Ginawang pandiwang may hangganan ang kasabay na participle upang maging maayos at madaling basahin sa Tagalog.
- source_word: Ἔξελθε καὶ πορεύου ἐντεῦθεν
  choice: Umalis ka at lumayo rito
  rationale: 'Pinananatili ang dalawang utos: ang pag-alis at ang pagpapatuloy palayo sa lugar. Natural at tuwiran ang ‘umalis’ at ‘lumayo rito’ sa modernong Tagalog.'
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw na ipinakikilala ang dahilan ng babala sa isang marangal ngunit pangkaraniwang rehistro.
- source_word: Ἡρῴδης
  choice: Herodes
  rationale: Ito ang nakaugaliang anyo ng pangalang Herod sa mga saling Bibliya sa Filipino.
- source_word: θέλει σε ἀποκτεῖναι
  choice: gusto kang patayin
  rationale: Ang θέλω ay nagpapahayag ng pagnanais, hindi kinakailangang isang ganap nang planong pasiya; kaya hindi ito pinalakas tungo sa ‘balak.’ Ang ἀποκτεῖναι ay tuwirang ‘patayin.’
theological_decisions:
- issue: Layunin ng babala ng mga Pariseo
  choice: Inilahad nang tuwiran ang kanilang sinabi nang walang pahiwatig kung tapat o mapanlinlang ang kanilang motibo.
  alternative: Ipahiwatig na tunay silang nagmamalasakit, o na tinatakot nila si Jesus upang mapaalis siya.
  rationale: Hindi tahasang sinasabi ng Griyegong teksto ang kanilang motibo, kaya pinananatili ng salin ang pagiging bukas ng salaysay.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang ‘sapagkat’ sa halip na mas kolokyal na ‘dahil’ upang mapanatili ang dignidad ng salaysay, ngunit iniwasan ang lipas o labis na pormal na pananalita.
