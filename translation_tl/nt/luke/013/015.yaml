source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀δὲ αὐτῷ ὁ κύριος καὶ εἶπεν· Ὑποκριταί, ἕκαστος ὑμῶν τῷ σαββάτῳ οὐ λύει τὸν βοῦν αὐτοῦ ἢ τὸν ὄνον ἀπὸ τῆς φάτνης καὶ ⸀ἀπαγαγὼν ποτίζει;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/015.yaml
  text: But the Lord answered him and said[a], “Hypocrites! Does not each of you on the Sabbath untie his ox or donkey from the feeding trough and lead it away to water it?”
translation:
  language: tl
  text: Ngunit sumagot sa kanya ang Panginoon at sinabi, “Mga mapagkunwari! Hindi ba’t bawat isa sa inyo ay kumakalas ng kanyang baka o asno mula sa sabsaban[a] sa araw ng Sabbath at inaakay ito palayo upang painumin?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay maaaring tumukoy sa sisidlan o lugar na pakainan ng hayop.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Panginoon
  rationale: Pinananatili ang pamagat na ginagamit ni Lucas para kay Jesus at ang bigat nito sa salaysay.
- source_word: Ὑποκριταί
  choice: Mga mapagkunwari
  rationale: Tuwirang panawag na maramihan at matalas na pagsaway, gaya ng Griyego.
- source_word: ἕκαστος ὑμῶν
  choice: bawat isa sa inyo
  rationale: Pinananatili ang distributibong diwa na tumutukoy sa ginagawa ng bawat indibidwal.
- source_word: τῷ σαββάτῳ
  choice: sa araw ng Sabbath
  rationale: Malinaw at karaniwang modernong Tagalog para sa temporal na gamit ng dative.
- source_word: λύει
  choice: nagkakalag
  rationale: Ang konteksto ay hayop na nakatali sa pakainan; mas tiyak ito kaysa sa pangkalahatang ‘nagpapalaya.’
- source_word: βοῦν
  choice: baka
  rationale: Natural na pangkalahatang tawag sa Tagalog para sa bovine livestock; hindi ipinipilit ang higit na tiyak na kasarian o gamit na hindi tahasang itinakda ng salita.
- source_word: ὄνον
  choice: asno
  rationale: Malinaw at nakaugaliang salin para sa hayop na tinutukoy.
- source_word: φάτνης
  choice: sabsaban
  rationale: Tumutukoy sa lugar o sisidlang pakainan ng hayop; konkreto at madaling maunawaan sa Tagalog.
- source_word: ἀπαγαγὼν
  choice: inilalabas iyon
  rationale: Ipinahahayag nang natural ang pag-akay sa hayop palayo mula sa sabsaban bago ito painumin.
- source_word: ποτίζει
  choice: upang painumin
  rationale: Tuwirang ipinapahayag ang pagbibigay ng maiinom sa hayop at maayos na inuugnay sa naunang paglabas dito.
theological_decisions:
- issue: Ang pamagat na κύριος na inilalapat kay Jesus sa salaysay
  choice: Panginoon
  alternative: amo
  rationale: Ang ‘Panginoon’ ay nagpapanatili sa kristolohikal at pasalaysay na bigat ng κύριος sa Lucas; ang ‘amo’ ay hindi sapat at maaaring magpababa sa antas ng pamagat.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Pinanatili ang talas ng pagsaway at ang retorikal na tanong. Ginamit ang ‘iyon’ upang hindi magtakda ng kasarian para sa hayop.
