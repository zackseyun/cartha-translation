id: LUK.13.27
reference: Luke 13:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐρεῖ ⸀λέγων ὑμῖν· Οὐκ ⸀οἶδα πόθεν ἐστέ· ἀπόστητε ἀπ’ ἐμοῦ, πάντες ⸀ἐργάται ἀδικίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/027.yaml
  text: And he will say to you[a], ‘I do not know where you are from. Depart from me[c][b], all you workers of unrighteousness.’
translation:
  language: tl
  text: At sasabihin niya sa inyo, “Hindi ko alam kung taga-saan kayo. Lumayo kayo sa akin, kayong lahat na gumagawa ng kasamaan.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kalikuan” o “kawalang-katarungan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρεῖ λέγων ὑμῖν
  choice: sasabihin niya sa inyo
  rationale: Ang λέγων ay pleonastikong participle na inuulit ang diwa ng ἐρεῖ. Pinagsama ang dalawa sa likas na Filipino nang hindi binabago ang tungkulin nitong magpakilala ng tuwirang pananalita.
- source_word: οὐκ οἶδα
  choice: Hindi ko alam
  rationale: Tuwirang pinananatili ang karaniwang kahulugan ng οἶδα. Maaaring ipinahihiwatig sa konteksto ang hindi pagkilala o pagtatakwil ng ugnayan, ngunit hindi iyon tahasang idinagdag.
- source_word: πόθεν ἐστέ
  choice: kung taga-saan kayo
  rationale: Ang πόθεν ay tumutukoy sa pinagmulan. Ang “taga-saan” ay natural at malinaw na paraan sa modernong Filipino upang ipahayag ito.
- source_word: ἀπόστητε ἀπ’ ἐμοῦ
  choice: Lumayo kayo sa akin
  rationale: Ipinapahayag nito ang mariin at tiyak na paghiwalay na hinihingi ng aorist imperative, sa natural ngunit mabigat na pananalita.
- source_word: πάντες ἐργάται ἀδικίας
  choice: kayong lahat na gumagawa ng kasamaan
  rationale: Ginagawang malinaw ng “kayong lahat” ang tuwirang pagtawag, habang ang “gumagawa” ay natural na tumutukoy sa mga nagsasagawa o namumuhay sa ἀδικία.
theological_decisions:
- issue: Pagpapakahulugan sa ἀδικίας sa isang pahayag ng paghatol
  choice: kasamaan
  alternative: kalikuan; kawalang-katarungan
  rationale: Malawak ang ἀδικία at maaaring tumukoy sa masama, mali, o di-matuwid na gawain. Ang “kasamaan” ay natural at malawak sa Filipino at hindi ito nililimitahan sa paglabag sa kautusan lamang. Binabanggit sa talababa ang mga alternatibong mas malapit sa ibang aspekto ng salita.
translation_notes:
  register: Modernong Filipino na tuwiran, marangal, at madaling maunawaan. Iniwasan ang hindi likas na pag-uulit sa “ἐρεῖ λέγων” ngunit pinanatili ang buong diwa nito. Ginamit ang “taga-saan” bilang karaniwang pananalita para sa pinagmulan at “lumayo” upang mapanatili ang bigat ng utos.
