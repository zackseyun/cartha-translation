  text: καὶ ἰδοὺ εἰσὶν ἔσχατοι οἳ ἔσονται πρῶτοι, καὶ εἰσὶν πρῶτοι οἳ ἔσονται ἔσχατοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/030.yaml
  text: And behold[a], there are last who will be first, and there are first who will be last.
translation:
  language: tl
  text: 'At masdan ninyo: may mga huli na magiging una, at may mga una na magiging huli.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: masdan ninyo
  rationale: Isang likas ngunit marangal na panawag-pansin sa modernong Filipino; pinananatili nito ang puwersang diskurso ng ἰδοὺ nang hindi gumagamit ng sobrang arkaikong anyo.
- source_word: ἔσχατοι
  choice: mga huli
  rationale: Tumutukoy sa mga nasa hulíng kalagayan o katayuan at tuwirang katapat ng πρῶτοι; hindi ito nilinaw bilang moral na ‘pinakamababa.’
- source_word: πρῶτοι
  choice: mga una
  rationale: Maikli, natural, at tuwirang katapat ng ‘mga huli,’ kaya napapanatili ang matalas na baligtarang paralelismo.
- source_word: οἳ ἔσονται
  choice: na mauuna / na mahuhuli
  rationale: Ipinahahayag ang hinaharap na pagbabago ng kalagayan sa likas na anyong Filipino; ang ‘mauuna’ at ‘mahuhuli’ ay idiomatikong katumbas ng ‘magiging una’ at ‘magiging huli.’
- source_word: εἰσὶν
  choice: may
  rationale: Ang eksistensiyal na ‘may’ ay natural na katumbas ng ‘there are’ at hindi nangangailangang magdagdag ng tahasang ‘ilan’ na maaaring magpahiwatig ng mas tiyak na saklaw.
- source_word: καὶ
  choice: at
  rationale: Pinananatili ang pang-ugnay at ang balanseng ayos ng dalawang sugnay.
theological_decisions:
- issue: Saklaw ng pahayag tungkol sa pagbabaligtad
  choice: 'Pangkalahatang pahayag tungkol sa pagbabaligtad ng kalagayan: ang mga huli ay mauuna at ang mga una ay mahuhuli.'
  alternative: Tahasang tukuyin ito sa mga Judio at Hentil, sa mapagpakumbaba at palalo, o sa mga ranggo sa huling paghuhukom.
  rationale: Bagaman ang konteksto ay tungkol sa pagpasok sa kaharian ng Diyos, nananatiling maikli at malawak ang Griyegong pahayag. Hindi dapat ipasok sa salin ang iisang tiyak na interpretasyon.
translation_notes:
  register: Modernong Filipino na natural, maikli, at marangal. Ginamit ang ‘masdan ninyo’ bilang panawag-pansin at ang pares na ‘mauuna/mahuhuli’ upang mapanatili ang matalinghagang diin at balanseng tunog ng orihinal.
