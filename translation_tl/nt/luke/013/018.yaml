  yaml_path: translation/nt/luke/013/018.yaml
  text: So he was saying[a], “What is the kingdom of God like, and to what shall I compare it?”
translation:
  language: tl
  text: Kaya sinabi niya, “Ano ang katulad ng kaharian ng Diyos[a], at sa ano ko ito ihahambing?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “paghahari ng Diyos,” na nagbibigay-diin sa pamamahala ng Diyos sa halip na sa isang nasasakupan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: patuloy niyang sinasabi
  rationale: Ang imperpektong anyo ay nagpapahiwatig ng nagpapatuloy o inuulit na pagsasalita; natural itong naipahahayag sa Filipino sa pariralang ito.
- source_word: οὖν
  choice: Kaya
  rationale: Pinananatili ang ugnayang lohikal at pagpapatuloy mula sa naunang konteksto nang hindi nagiging labis na pormal.
- source_word: Τίνι ... ὁμοία ἐστὶν
  choice: Ano ang katulad ng ...
  rationale: Direkta at likas na tanong ito sa Filipino para humingi ng paghahambing.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ang kaharian ng Diyos
  rationale: Ito ang kinikilalang salin ng parirala at pinananatili ang lawak ng kahulugan nito, na maaaring tumukoy kapuwa sa paghahari ng Diyos at sa saklaw ng kanyang pamamahala.
- source_word: καὶ
  choice: at
  rationale: Payak na pang-ugnay na nagpapanatili sa magkatumbas na dalawang tanong.
- source_word: τίνι ὁμοιώσω αὐτήν
  choice: sa ano ko ito ihahambing
  rationale: Pinananatili ang retorikal at deliberatibong puwersa ng anyong panghinaharap habang natural sa modernong Filipino.
theological_decisions:
- issue: Pagsasalin ng βασιλεία τοῦ θεοῦ
  choice: ang kaharian ng Diyos
  alternative: ang paghahari ng Diyos
  rationale: Ang “kaharian” ay nagpapanatili sa nakaugaliang biblikal na pananalita at sa larawang ginagamit sa mga talinghaga, samantalang ipinababatid ng talababa na maaari ring idiin ng parirala ang aktibong pamamahala ng Diyos.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “patuloy niyang sinasabi” upang maipakita ang aspektong imperpekto, at pinanatili ang magkatimbang na ayos ng dalawang retorikal na tanong.
