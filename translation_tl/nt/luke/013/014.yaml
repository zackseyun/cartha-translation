id: LUK.13.14
reference: Luke 13:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ ἀρχισυνάγωγος, ἀγανακτῶν ὅτι τῷ σαββάτῳ ἐθεράπευσεν ὁ Ἰησοῦς, ἔλεγεν τῷ ὄχλῳ ⸀ὅτι Ἓξ ἡμέραι εἰσὶν ἐν αἷς δεῖ ἐργάζεσθαι· ἐν ⸀αὐταῖς οὖν ἐρχόμενοι θεραπεύεσθε καὶ μὴ τῇ ἡμέρᾳ τοῦ σαββάτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/014.yaml
  text: But the synagogue ruler answered[a], indignant because Jesus had healed on the Sabbath, and said to the crowd, “There are six days in which it is necessary to work; so come on those days and be healed, and not on the day of the Sabbath.”
translation:
  language: tl
  text: Ngunit sumagot ang pinuno ng sinagoga, na galit dahil nagpagaling si Jesus sa araw ng Sabbath, at sinabi niya sa mga tao, “May anim na araw na dapat magtrabaho; kaya sa mga araw na iyon kayo pumunta upang magpagamot, at huwag sa araw ng Sabbath.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: Ngunit sumagot
  rationale: Ipinahihiwatig ng δέ ang pagtutol sa naunang pagpapagaling, at ang ἀποκριθείς ay likas na naisasalin bilang “sumagot” kahit walang tuwirang tanong.
- source_word: ὁ ἀρχισυνάγωγος
  choice: ang pinuno ng sinagoga
  rationale: Tumutukoy ito sa nangangasiwa sa mga gawain ng sinagoga; malinaw at hindi ito nagpapahiwatig ng kapangyarihang sibil.
- source_word: ἀγανακτῶν
  choice: Galit siya
  rationale: Ipinapahayag nito ang matinding pagkayamot o galit. Ang “galit” ay natural at madaling maunawaan, nang hindi nagdaragdag ng paliwanag tungkol sa motibo.
- source_word: ὅτι τῷ σαββάτῳ ἐθεράπευσεν ὁ Ἰησοῦς
  choice: dahil nagpagaling si Jesus sa araw ng Sabbath
  rationale: Sanhi ang gamit ng ὅτι, at tumutukoy ang aorist sa naganap nang pagpapagaling.
- source_word: ἔλεγεν τῷ ὄχλῳ
  choice: kaya sinabi niya sa mga tao
  rationale: Natural sa Tagalog ang “sinabi” para sa imperfect na nagsasaad ng nagaganap na pananalita sa kontekstong ito; ang ὄχλος ay ang nagkakatipong mga tao.
- source_word: Ἓξ ἡμέραι εἰσὶν ἐν αἷς δεῖ ἐργάζεσθαι
  choice: May anim na araw na dapat magtrabaho
  rationale: Pinananatili ng “dapat” ang diwa ng obligasyon o pangangailangan sa δεῖ, habang natural ang ayos sa modernong Tagalog.
- source_word: ἐν αὐταῖς οὖν ἐρχόμενοι θεραπεύεσθε
  choice: Kaya sa mga araw na iyon kayo pumunta at magpagaling
  rationale: Ang “kaya” ay naghahatid sa inferensiyang οὖν; ang “pumunta at magpagaling” ay likas na utos sa Tagalog at pinananatili ang pasibong diwang tumanggap ng pagpapagaling.
- source_word: καὶ μὴ τῇ ἡμέρᾳ τοῦ σαββάτου
  choice: at huwag sa araw ng Sabbath
  rationale: Maikli at tuwirang pinananatili ang kaibahan sa anim na araw at sa araw ng Sabbath.
theological_decisions:
- issue: Ang pahayag ng pinuno tungkol sa mga araw ng paggawa at pagpapagaling
  choice: 'Inilahad bilang mismong pagtutol ng pinuno: “May anim na araw na dapat magtrabaho.”'
  alternative: Ipaliwanag sa salin na mapagkunwari o maling-mali ang kanyang tuntunin.
  rationale: Iniulat ng talata ang pananaw ng pinuno at hindi ito hayagang pinagtitibay. Pinananatili ng salin ang tensiyon nang hindi paunang idinaragdag ang hatol na lilitaw sa kasunod na konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa publikong pagbasa. Pinanatili ang terminong “sinagoga” at ang pangalang “Sabbath” bilang pamilyar na katawagang biblikal. Hinati sa dalawang pangungusap ang pambungad upang maiwasan ang mabigat na sunod-sunod na sugnay.
