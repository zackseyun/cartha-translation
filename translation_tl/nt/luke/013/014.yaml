  to: Ngunit sumagot ang pinuno ng sinagoga, na galit dahil nagpagaling si Jesus sa araw ng Sabbath, at sinabi niya sa mga tao, “May anim na araw na dapat magtrabaho; kaya sa mga araw na iyon kayo pumunta upang magpagamot, at huwag sa araw ng Sabbath.”
