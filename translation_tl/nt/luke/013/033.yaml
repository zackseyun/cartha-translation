    rationale: Ang Griyego ay tuwirang nagsasaad ng pagpunta o paglalakbay. Ang “maglakbay” ay mas malinaw sa modernong Filipino at hindi nagdaragdag ng posibleng matalinghagang diwa ng ‘aking lakad.’
  - severity: low
    issue: Ang alternatibong “hindi mangyayari” sa talababa ay maaaring magtunog prediksyon kaysa pagpapahayag ng imposibilidad o di-maipalalagay.
    rationale: Mas angkop ang “hindi maaari” at “hindi maiisip” bilang mga alternatibong nagpapanatili ng semantikong puwersa ng οὐκ ἐνδέχεται.
