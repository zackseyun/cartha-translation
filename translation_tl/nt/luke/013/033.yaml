- from: Gayunman, kailangan kong magpatuloy sa aking lakad ngayon, bukas, at sa susunod na araw[a], sapagkat hindi maaaring mamatay ang isang propeta sa labas ng Jerusalem.[b]
  to: Gayunman, kailangan kong maglakbay ngayon, bukas, at sa susunod na araw[a], sapagkat hindi maaaring mapahamak ang isang propeta sa labas ng Jerusalem.[b]
  rationale: Pinanatili ng rebisyon ang sintaksis at sinadyang tensiyon ng Griyego, kabilang ang retorikal na puwersa ng “hindi maaaring,” nang hindi ito ginagawang ganap na literal na tuntuning pangkasaysayan o tahasang ironya. Ang “maglakbay” ay mas tuwirang katumbas ng πορεύεσθαι, at ang “mapahamak” ay mas maingat na katumbas ng ἀπολέσθαι kaysa “mamatay.” Napanatili rin ang wastong mga anchor ng talababa pagkatapos ng mga pariralang ipinapaliwanag.
