  text: πλὴν δεῖ με σήμερον καὶ αὔριον καὶ τῇ ἐχομένῃ πορεύεσθαι, ὅτι οὐκ ἐνδέχεται προφήτην ἀπολέσθαι ἔξω Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/033.yaml
  text: Nevertheless[a], I must go on my way today and tomorrow and the next day[b], because it is not possible for a prophet to perish outside Jerusalem.
translation:
  language: tl
  text: Gayunman, kailangan kong maglakbay ngayon, bukas, at sa susunod na araw[a], sapagkat hindi maaaring mapahamak ang isang propeta sa labas ng Jerusalem.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pariralang “ngayon, bukas, at sa susunod na araw” ay maaaring idyomatikong tumukoy sa isang maikli ngunit itinakdang panahon, at hindi kinakailangang sa eksaktong tatlong araw sa kalendaryo.
    reason: cultural_note
  - marker: b
    text: Ang “hindi maaaring” ay maaari ring isalin na “hindi maaari” o “hindi maiisip,” na nagpapahiwatig ng isang bagay na itinuturing na hindi maipalalagay.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Gayunman
  rationale: Malinaw na ipinahahayag ang pagsalungat o matibay na paglilimita sa naunang sinabi, sa natural at marangal na modernong Tagalog.
- source_word: δεῖ με
  choice: kailangan kong
  rationale: Pinananatili ang diwa ng kinakailangan o hindi maiiwasang tungkulin nang hindi dinaragdagan kung ito ay tuwirang banal na kautusan.
- source_word: σήμερον καὶ αὔριον καὶ τῇ ἐχομένῃ
  choice: ngayon, bukas, at sa susunod na araw
  rationale: Pinananatili ang tahasang tatlong-yugtong pagkakasunod-sunod sa Griyego habang natural sa Tagalog.
- source_word: πορεύεσθαι
  choice: magpatuloy sa aking lakad
  rationale: Ipinahahayag kapwa ang paglalakbay at ang pagpapatuloy nito sa konteksto.
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw na ipinakikilala ang dahilan at angkop sa marangal na rehistro.
- source_word: οὐκ ἐνδέχεται
  choice: hindi maaaring
  rationale: Pinananatili ang saklaw na imposibilidad o bagay na hindi maipalalagay, nang hindi tahasang nilulutas ang mapait na ironya.
- source_word: προφήτην
  choice: ang isang propeta
  rationale: Ang isahang pangngalang walang pantukoy ay ginagamit sa pangkalahatan; natural itong ipinapahayag sa Tagalog bilang “ang isang propeta.”
- source_word: ἀπολέσθαι
  choice: mamatay
  rationale: Sa kontekstong tumutukoy sa sinapit ng mga propeta, natural at malinaw ang “mamatay”; hindi nito ipinapasok ang tiyak na paraan ng kamatayan na hindi tahasang nakasaad sa pandiwa.
- source_word: ἔξω Ἰερουσαλήμ
  choice: sa labas ng Jerusalem
  rationale: Tuwiran at eksaktong spatial na katumbas ng parirala.
theological_decisions:
- issue: Lakas ng pahayag na hindi maaaring mamatay ang propeta sa labas ng Jerusalem
  choice: Isinalin bilang “hindi maaaring” at nilagyan ng talababa tungkol sa posibleng diwa ng retorikal na hindi-maipalalagay.
  alternative: “Hindi mangyayari” o “hindi maiisip” na mamatay ang isang propeta sa labas ng Jerusalem.
  rationale: Maaaring magpahiwatig ang οὐκ ἐνδέχεται ng literal na imposibilidad, kawalan ng kaangkupan, o retorikal na bagay na hindi maipalalagay. Pinananatili ng pangunahing teksto ang tensiyon at hinahayaan ang mambabasa na marinig ang posibleng ironya.
- issue: Literal o idyomatikong haba ng “ngayon, bukas, at sa susunod na araw”
  choice: Pinanatili ang tatlong-yugtong pahayag at ipinaliwanag sa talababa na maaari itong tumukoy sa maikli ngunit itinakdang panahon.
  alternative: Isalin nang tuwiran bilang “sa susunod na ilang araw.”
  rationale: Hindi dapat alisin sa pangunahing teksto ang matingkad na anyo ng orihinal, ngunit mahalagang huwag ding ipilit na eksaktong tatlong araw sa kalendaryo ang tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “sapagkat” para sa bahagyang pormal na himig ng kasabihan, ngunit iniwasan ang lipas o labis na eklesiyastikong pananalita. Ang mga talababa ay inilagay kaagad pagkatapos ng mga pariralang ipinapaliwanag.
