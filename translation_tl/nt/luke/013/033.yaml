  source_fidelity: 'Tumpak ang pangunahing daloy ng kahulugan: ang matibay na pagsalungat, ang pangangailangan, ang tatlong-yugtong panahon, ang paglalakbay, at ang pahayag tungkol sa propeta at Jerusalem. Gayunman, ang “mamatay” para sa ἀπολέσθαι ay mas makitid at mas payak kaysa sa mas matimbang na “mapahamak,” na mas mahusay na nagpapanatili ng saklaw at solemne/retorikal na himig ng Griyego nang hindi nagtutukoy ng paraan ng kamatayan.'
  naturalness: Natural at malinaw ang “Gayunman” at “sapagkat.” Mas likas at mas tuwiran sa modernong Filipino ang “kailangan kong maglakbay” kaysa “magpatuloy sa aking lakad,” na maaaring tumunog na idiomang tumutukoy sa personal na landas o gawain, hindi lamang paglalakbay.
  terminology: Ang “propeta,” “Jerusalem,” at “sa labas ng Jerusalem” ay wasto. Pinalitan ang “mamatay” ng “mapahamak” upang mas maingat na tumbasan ang ἀπολέσθαι at maiwasang paliitin ang pahayag sa simpleng pagkamatay.
