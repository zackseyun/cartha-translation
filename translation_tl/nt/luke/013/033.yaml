    rationale: Bagaman maaaring tumukoy ang pandiwa sa pagkamatay sa konteksto, ang “mapahamak” ay nagpapanatili ng mas malawak na leksikal na saklaw na ‘mamatay/mapuksa/mapahamak’ at ng mas mabigat na retorikal na tono, nang hindi ipinapasok ang tiyak na paraan ng kamatayan.
