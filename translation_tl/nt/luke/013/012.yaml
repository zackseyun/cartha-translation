  text: ἰδὼν δὲ αὐτὴν ὁ Ἰησοῦς προσεφώνησεν καὶ εἶπεν αὐτῇ· Γύναι, ἀπολέλυσαι τῆς ἀσθενείας σου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/012.yaml
  text: But when Jesus saw her[a], he called her over and said to her, “Woman, you are freed from your weakness.”
translation:
  language: tl
  text: Nang makita siya ni Jesus, tinawag niya ang babae at sinabi sa kanya, “Babae, pinalaya ka na mula sa iyong kahinaan.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinalaya ka na mula sa iyong karamdaman.”
    reason: Ang ἀσθένεια ay maaari ring tumukoy sa karamdaman o infirmity; pisikal ang kalagayan sa konteksto, ngunit mas malawak ang pangunahing salitang Griyego.
lexical_decisions:
- source_word: ἰδὼν δὲ αὐτὴν
  choice: Nang makita siya
  rationale: Ginawang temporal na sugnay ang aorist participle upang maging natural sa Tagalog habang pinananatili ang pagkakasunod ng pangyayari. Hindi kailangang isalin nang hiwalay ang δέ dahil sapat na ang tuloy-tuloy na daloy ng salaysay sa talatang ito.
- source_word: προσεφώνησεν
  choice: tinawag niya ang babae
  rationale: Maaaring mangahulugang tumawag o direktang kumausap ang προσφωνέω. Ang “tinawag” ay natural at ipinakikitang si Jesus ang nagpasimula ng pakikipag-usap, nang hindi tiyakang idinaragdag na pinalapit niya ang babae.
- source_word: εἶπεν αὐτῇ
  choice: at sinabi rito
  rationale: Tuwirang kinakatawan ang pandiwa at ang di-tuwirang layon; ginagamit ang “rito” upang maiwasan ang sunod-sunod na pag-uulit ng “sa babae.”
- source_word: Γύναι
  choice: Ginang
  rationale: Magalang na pantawag sa isang babae ang vocative na γύναι. Mas likas at marangal sa modernong Tagalog ang “Ginang” kaysa sa literal ngunit maaaring magaspang pakinggang “Babae.”
- source_word: ἀπολέλυσαι
  choice: pinalaya ka na
  rationale: Pinananatili ng anyong balintiyak ang taong kumilos na hindi tahasang tinutukoy. Ipinahihiwatig ng “na” ang natapos na pagpapalaya na may bisa sa kasalukuyan, ayon sa perfect tense.
- source_word: τῆς ἀσθενείας σου
  choice: mula sa iyong karamdaman
  rationale: Sa konteksto, tumutukoy ang ἀσθένεια sa pisikal na kalagayang nagpapahina sa babae. Ang “karamdaman” ay natural at sapat na malawak, nang hindi ito ginagawang isang tiyak na makabagong diagnosis.
theological_decisions:
- issue: Lawak ng kahulugan ng ἀσθένεια sa kalagayan ng babae
  choice: karamdaman
  alternative: kahinaan
  rationale: Tiyak sa konteksto na may pisikal na pagdurusa, ngunit hindi tinutukoy ng salita ang isang partikular na sakit o kapansanan. Pinananatili ng “karamdaman” ang pangkalahatang saklaw at likas na tunog sa pahayag ng pagpapalaya; inilalagay sa talababa ang mas literal na “kahinaan.”
- issue: Tagaganap ng pagpapalaya sa perfect passive na ἀπολέλυσαι
  choice: 'Panatilihing balintiyak: “pinalaya ka na”'
  alternative: “pinalaya na kita”
  rationale: Hindi tahasang pinangalanan sa Griyego ang tagaganap. Hindi idinaragdag ng salin na si Jesus mismo ang gramatikal na tagaganap, bagaman malinaw ang kaniyang awtoridad sa konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Ginang” bilang likas na magalang na pantawag at iniwasan ang teknikal o makalumang “kahinaan ng katawan” sa pangunahing teksto.
