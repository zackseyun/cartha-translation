  text: He was teaching in one of the synagogues on the Sabbath[a].
translation:
  language: tl
  text: Nagtuturo siya sa isa sa mga sinagoga noong Araw ng Pamamahinga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga Araw ng Pamamahinga”; maramihan ang anyo sa Griyego, ngunit karaniwan itong ginagamit bilang idyoma para sa iisang “Araw ng Pamamahinga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν δὲ διδάσκων
  choice: Nagtuturo noon si Jesus
  rationale: Ang ἦν na kasama ng kasalukuyang pandiwaring διδάσκων ay isang periphrastic imperfect at nagpapahayag ng nagpapatuloy na kilos sa nakaraan. Likas itong ipinahahayag sa Filipino sa aspektong di-ganap na “nagtuturo,” at ipinakikilala ang tahasang pangalang “Jesus” bilang natural na pagpapatuloy ng paksa sa salaysay. Ang δέ ay hindi ginawang malakas na panalungat; ang “noon” ay naglalagay ng kilos sa takbo ng nakaraang salaysay, hindi nagsasaad ng isang salitang temporal na hiwalay sa Griyego.
- source_word: ἐν μιᾷ τῶν συναγωγῶν
  choice: sa isa sa mga sinagoga
  rationale: Pinananatili ang partitive na diwang “isa sa mga” at ang tiyak na institusyong Judio na sinagoga.
- source_word: ἐν τοῖς σάββασιν
  choice: nang Araw ng Pamamahinga
  rationale: Bagaman maramihan ang anyong σάββασιν, karaniwan itong ginagamit nang idyomatiko para sa isang Sabbath. Ang “Araw ng Pamamahinga” ay malinaw at dignified na katumbas sa modernong Filipino; iniingatan sa talababa ang literal na maramihang posibilidad.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “sinagoga” bilang kinikilalang terminong pangkasaysayan at “Araw ng Pamamahinga” upang maging madaling maunawaan ang Sabbath. Ang talababa ay minarkahan sa pangunahing teksto.
