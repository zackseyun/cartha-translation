  source_fidelity: Kailangang alisin ang “Jesus,” sapagkat walang pangalang Ἰησοῦς sa talatang ito. Ang paksa ay ipinahihiwatig lamang ng anyo ng pandiwa at ng konteksto. Ang periphrastic imperfect na ἦν δὲ διδάσκων ay wastong naipapahayag sa “Nagtuturo siya.” Ang ἐν τοῖς σάββασιν ay maaaring idiomatikong isalin sa isahang “Araw ng Pamamahinga,” habang pinananatili ang maramihang anyo bilang alternatibo sa talababa.
  naturalness: Natural at marangal sa modernong Filipino ang “Nagtuturo siya sa isa sa mga sinagoga noong Araw ng Pamamahinga.” Mas maayos ang “noong” kaysa “nang” para sa panahong pinangyarihan ng pagtuturo.
  terminology: Ang “sinagoga” ay angkop para sa συναγωγή. Ang “Araw ng Pamamahinga” ay malinaw na katumbas ng Sabbath; panatilihin ang kapitalisasyon bilang katawagang pangrelihiyon. Ang alternatibong maramihan sa talababa ay hindi dapat gawing distributibong “tuwing,” na nagdaragdag ng kahulugang wala sa anyo mismo.
