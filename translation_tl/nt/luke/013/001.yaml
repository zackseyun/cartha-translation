  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Παρῆσαν δέ τινες ἐν αὐτῷ τῷ καιρῷ ἀπαγγέλλοντες αὐτῷ περὶ τῶν Γαλιλαίων ὧν τὸ αἷμα Πιλᾶτος ἔμιξεν μετὰ τῶν θυσιῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/001.yaml
  text: Some were present at that very time reporting to him about the Galileans whose blood Pilate had mixed with their sacrifices[a].
translation:
  language: tl
  text: Sa mismong panahong iyon, may ilang naroon na nagbalita sa kanya tungkol sa mga taga-Galilea na ang dugo nila ay inihalo ni Pilato sa kanilang mga hain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tahasang sinasabi ng Griyego na pinatay sila habang naghahandog; literal nitong sinasabing inihalo ni Pilato ang dugo nila sa kanilang mga hain.
    reason: Pinananatili ang sadyang kakulangan ng detalye sa orihinal at iniiwasang gawing tahasang salaysay ang isang posibleng implikasyon lamang.
lexical_decisions:
- source_word: Παρῆσαν δέ τινες
  choice: may ilang naroon
  rationale: Ipinahahayag ng imperfect na Παρῆσαν ang kalagayan ng pagkanaroon, hindi ang pagdating. Hindi na ginamitan ng hiwalay na panandang panlipat para sa δέ dahil sapat na ang likas na daloy ng pangungusap sa Filipino.
- source_word: ἐν αὐτῷ τῷ καιρῷ
  choice: Sa mismong panahong iyon
  rationale: Pinananatili ng “mismo” ang diin at tiyak na pagtukoy ng αὐτῷ sa panahong kaugnay ng naunang konteksto.
- source_word: ἀπαγγέλλοντες αὐτῷ
  choice: nagbalita sa kanya
  rationale: Likas itong paraan sa modernong Filipino upang ipahayag ang paghahatid sa kanya ng ulat o balita.
- source_word: περὶ τῶν Γαλιλαίων
  choice: tungkol sa mga taga-Galilea
  rationale: Malinaw na ipinakikilala ng “tungkol sa” ang paksa ng balita, at ang “mga taga-Galilea” ang karaniwang katawagan sa Filipino.
- source_word: ὧν τὸ αἷμα
  choice: na ang dugo nila
  rationale: Natural na Filipino ito para sa kaugnayang ipinahahayag ng possessive relative construction sa Griyego.
- source_word: Πιλᾶτος ἔμιξεν
  choice: inihalo ni Pilato
  rationale: Tuwirang pinananatili ng “inihalo” ang larawan ng μίγνυμι nang hindi dinaragdagan kung paano naganap ang pagpatay.
- source_word: μετὰ τῶν θυσιῶν αὐτῶν
  choice: sa kanilang mga hain
  rationale: Ang “mga hain” ay malinaw at likas na salin ng θυσίαι. Pinananatili ng “kanilang” ang pag-aari o kaugnayan ng αὐτῶν nang hindi tinutukoy kung sila mismo ay kasalukuyang naghahandog.
theological_decisions:
- issue: Ang makasaysayan at moral na bigat ng ginawa ni Pilato
  choice: Tuwirang ilarawan na inihalo ni Pilato ang dugo ng mga taga-Galilea sa kanilang mga hain.
  alternative: Palawakin bilang “pinatay habang naghahandog sila.”
  rationale: Hindi tahasang ipinaliliwanag ng talata ang paraan o sandali ng pagpatay ni Pilato. Pinananatili ng salin ang mabigat at matalim na paglalarawan ng Griyego nang hindi nagdaragdag ng paliwanag o teolohikal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “mga taga-Galilea,” “nagbalita,” at “mga hain” bilang likas ngunit tumpak na mga katawagan; iniwasan ang mas lumang “ipinagbigay-alam” at ang interpretibong pagpapalawak.
