id: LUK.13.16
reference: Luke 13:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ταύτην δὲ θυγατέρα Ἀβραὰμ οὖσαν, ἣν ἔδησεν ὁ Σατανᾶς ἰδοὺ δέκα καὶ ὀκτὼ ἔτη, οὐκ ἔδει λυθῆναι ἀπὸ τοῦ δεσμοῦ τούτου τῇ ἡμέρᾳ τοῦ σαββάτου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/016.yaml
  text: And ought not this woman, being a daughter of Abraham, whom Satan bound for eighteen years—look—be released from this bond on the Sabbath day?
translation:
  language: tl
  text: At ang babaeng ito, na anak na babae ni Abraham, na ginapos ni Satanas—tingnan ninyo—sa loob ng labingwalong taon, hindi ba dapat siyang kalagan mula sa gapos na ito sa araw ng Sabbath?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυγατέρα Ἀβραὰμ
  choice: isang anak ni Abraham
  rationale: Pinananatili ang literal at teolohikong makabuluhang katawagang nagpapahayag ng kanyang pagiging kabilang sa sambayanan ng tipan, habang natural pa rin sa Tagalog.
- source_word: ἔδησεν / λυθῆναι / δεσμοῦ
  choice: iginapos / kalagan / gapos
  rationale: Pinananatili ang magkakaugnay na larawan ng paggapos at pagkakalag sa tatlong salitang Griyego.
- source_word: ἰδού
  choice: masdan ninyo
  rationale: Ipinahahayag ang pantawag-pansing lakas ng ἰδού sa halip na alisin ito; ang pangmaramihang 'ninyo' ay natural dahil kausap ni Jesus ang mga naroon.
- source_word: δέκα καὶ ὀκτὼ ἔτη
  choice: nang labingwalong taon
  rationale: Natural na paraan sa Tagalog upang ipahayag ang haba ng panahong siya ay nakagapos.
- source_word: τῇ ἡμέρᾳ τοῦ σαββάτου
  choice: sa araw ng Sabbath
  rationale: Pinananatili ang tiyak na pagtukoy sa araw ng Sabbath at ang katawagang malawak na nauunawaan sa modernong Filipino.
theological_decisions:
- issue: Paglalarawan kay Satanas bilang gumapos sa babae
  choice: na iginapos ni Satanas
  alternative: na pinahirapan ni Satanas
  rationale: Hindi pinalalabo ang tahasang ahensiya at metapora ng ἔδησεν; iniiwasang ipaliwanag nang higit sa sinasabi ng teksto ang kaugnayan nito sa kanyang karamdaman.
- issue: Retorikal na tanong tungkol sa nararapat gawin sa Sabbath
  choice: hindi ba dapat siyang kalagan
  alternative: nararapat siyang kalagan
  rationale: Pinananatili ang anyong retorikal ng οὐκ ἔδει at ang diin nito sa moral na pagiging nararapat, nang hindi ginagawang simpleng pahayag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'kalagan' upang mapanatili ang pandiwang larawan ng pagtanggal sa gapos; ang estruktura ay sadyang malapit sa Griyego ngunit inayos upang maging natural sa Tagalog.
