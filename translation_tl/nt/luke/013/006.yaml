  to: 'At sinabi niya ang talinghagang ito: “May isang taong may punong igos na nakatanim sa kaniyang ubasan[a]. Pumunta siya roon upang maghanap ng bunga sa puno, ngunit wala siyang nakitang bunga.”'
  rationale: Pinalitan ang 'isang lalaking' ng 'isang taong' upang maingatan ang di-tiyak na katangian ng τις nang hindi nagdaragdag ng kasarian. Pinalitan ang pangwakas na 'wala siyang nakita' ng 'wala siyang nakitang bunga' upang tahasang maipahayag ang layon ng Griyegong καρπὸν at maiwasan ang kalabuan.
