    rationale: Ang τις ay isang di-tiyak na panghalip; ang panlalaking anyo nito ay maaaring pangkalahatang gramatikal na anyo. Ang 'isang taong' ay likas na Tagalog at pinananatili ang pagiging di-tiyak nang hindi nagdaragdag ng kasarian.
