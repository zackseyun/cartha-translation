  source_fidelity: 'Ang pangunahing diwa ay wastong naipapahayag: may isang tao na may nakatanim na puno ng igos sa kaniyang ubasan, at naghanap siya rito ng bunga ngunit wala siyang nakita. Gayunman, ang ''wala siyang nakita'' ay hindi tahasang nagsasaad na bunga ang hindi niya nakita, samantalang καρπὸν ang layon ng οὐχ εὗρεν.'
  naturalness: Natural ang kabuuang rehistro, ngunit mas maayos ang 'May isang taong may punong igos' kaysa 'May isang lalaking may puno ng igos.' Ang binagong pahayag ay mas magaan sa modernong Tagalog at hindi nagdaragdag ng kasariang hindi kinakailangang ipinahihiwatig ng di-tiyak na τις.
  terminology: Ang 'talinghaga,' 'punong igos,' 'ubasan,' at 'bunga' ay angkop at pare-pareho sa rehistro ng salaysay. Pinananatili ang 'kaniyang' bilang marangal ngunit malinaw na anyo.
