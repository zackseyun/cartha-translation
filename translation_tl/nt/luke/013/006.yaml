  text: Ἔλεγεν δὲ ταύτην τὴν παραβολήν. Συκῆν εἶχέν τις ⸂πεφυτευμένην ἐν τῷ ἀμπελῶνι αὐτοῦ⸃, καὶ ἦλθεν ζητῶν καρπὸν ἐν αὐτῇ καὶ οὐχ εὗρεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/006.yaml
  text: 'And he was telling this parable: “A man had a fig tree planted in his vineyard[a], and he came looking for fruit on it and found none.”'
translation:
  language: tl
  text: 'At sinabi niya ang talinghagang ito: “May isang taong may punong igos na nakatanim sa kaniyang ubasan[a]. Pumunta siya roon upang maghanap ng bunga sa puno, ngunit wala siyang nakitang bunga.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “May isang lalaking may punong igos na nakatanim sa kaniyang ubasan.” Hindi tiyak ang panghalip sa Griyego; ang “isang taong” ay likas na panimulang pahayag sa Tagalog at pinananatili ang pagiging di-tiyak nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: sinabi niya
  rationale: Ang imperpektong anyo ay maaaring magpakilala ng salaysay o pagtuturo. Mas natural sa makabagong Tagalog ang “sinabi niya” kaysa sa pilit na progresibong “sinasabi niya noon,” nang hindi binabago ang pangyayari.
- source_word: δὲ
  choice: At
  rationale: Mahinang pang-ugnay ito na nagpapatuloy sa daloy ng naunang salaysay.
- source_word: παραβολήν
  choice: talinghaga
  rationale: Karaniwan at angkop na katawagan sa Tagalog para sa παραβολή bilang kuwentong ginagamit sa pagtuturo.
- source_word: Συκῆν
  choice: puno ng igos
  rationale: Tiyak na tumutukoy ang pangngalan sa puno ng igos, hindi lamang sa bunga.
- source_word: εἶχέν τις
  choice: May isang lalaking may
  rationale: Hindi tiyak ang τις at nagpapakilala lamang ng isang tauhan. Ang “isang lalaki” ay natural sa estilong pasalaysay, samantalang ang unang “may” ay nagsisilbing panimulang eksistensiyal sa Tagalog.
- source_word: πεφυτευμένην
  choice: nakatanim
  rationale: Ipinahihiwatig ng perpektong pasibong pandiwari ang nananatiling kalagayan ng punong naitanim na; natural itong ipinapahayag ng “nakatanim.”
- source_word: ἐν τῷ ἀμπελῶνι αὐτοῦ
  choice: sa kaniyang ubasan
  rationale: Ang ἀμπελών ay ubasan, at pinananatili ng “kaniyang” ang panghalip na paari.
- source_word: ἦλθεν ζητῶν
  choice: Pumunta siya roon upang maghanap
  rationale: Ipinapahayag ng pangunahing pandiwa at kasamang pandiwari ang pagpunta na may layuning maghanap. Nililinaw ng “roon” ang natural na direksiyon sa Tagalog nang hindi nagdaragdag ng bagong lokasyon.
- source_word: καρπὸν
  choice: bunga
  rationale: Direkta at natural itong katumbas at pinananatili ang posibleng matalinghagang diwa.
- source_word: ἐν αὐτῇ
  choice: sa puno
  rationale: Bagaman literal na “sa loob/nasa,” ang natural na Tagalog para sa bungang nasa isang puno ay “sa puno.” Inuulit ang tinutukoy upang maiwasan ang malabong panghalip.
- source_word: οὐχ εὗρεν
  choice: wala siyang nakita
  rationale: Natural na Tagalog ito at malinaw na ang tinutukoy na hindi nakita ay ang bunga.
theological_decisions:
- issue: Hindi tiyak na simuno na τις sa talinghaga
  choice: isang lalaki
  alternative: isang tao / may isang taong
  rationale: Nagpapakilala lamang ang Griyego ng isang di-tiyak na tauhan at hindi naglalagay ng natatanging teolohikal na pagkakakilanlan. Ang “isang lalaki” ay angkop sa karaniwang estilong pasalaysay at tumutugma sa panlalaking tauhang ipinahihiwatig sa konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kaniyang” para sa pormal ngunit madaling maunawaang rehistro, at iniwasan ang sobrang literal na ayos na magiging asiwa sa karaniwang mambabasa.
