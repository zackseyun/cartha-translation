  text: And again he said, “To what shall I compare the kingdom of God?”
translation:
  language: tl
  text: At muli niyang sinabi, “Sa ano ko ihahambing ang kaharian ng Diyos?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: At
  rationale: Pinananatili ang payak na pang-ugnay ng salaysay nang hindi nagdaragdag ng tiyak na pahiwatig ng panahon.
- source_word: πάλιν
  choice: muli
  rationale: Likas at tuwirang pagpapahayag ng pag-uulit sa makabagong Tagalog.
- source_word: εἶπεν
  choice: niyang sinabi
  rationale: Karaniwang salin ng aorist ng λέγω na nagpapakilala ng tuwirang pananalita; isinama ang panghalip na tumutukoy kay Jesus mula sa konteksto.
- source_word: Τίνι
  choice: Sa ano
  rationale: Ang datibong patanong na anyong neuter ay humihingi ng bagay na paghahambingan, hindi ng tao.
- source_word: ὁμοιώσω
  choice: ko ihahambing
  rationale: Likas sa Tagalog na deliberatibong tanong at pinananatili ang unang panauhang isahan ng pandiwa.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: ang kaharian ng Diyos
  rationale: Pinananatili ang nakaugaliang pariralang biblikal at ang malawak na diwa ng βασιλεία bilang paghahari at sakop ng pamamahala ng Diyos.
theological_decisions:
- issue: Pagpapahayag sa βασιλεία sa kasabihan tungkol sa pamamahala ng Diyos
  choice: ang kaharian ng Diyos
  alternative: ang paghahari ng Diyos
  rationale: Mas napapanatili ng “kaharian ng Diyos” ang nakaugaliang katawagang biblikal at ang saklaw ng kahulugan, nang hindi ito nililimitahan sa gawa lamang ng paghahari.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Sa ano ko ihahambing” bilang natural na retorikal na tanong habang malapit na sinusundan ang ayos at diwa ng Griyego.
