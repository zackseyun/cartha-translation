  text: No, I tell you; but unless you change your thinking, you will all likewise perish.
translation:
  language: tl
  text: Hindi, sinasabi ko sa inyo; ngunit kung hindi kayo magsisisi, mapapahamak din kayong lahat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mapapahamak sa gayunding paraan.” Maaaring tumukoy ang “din” sa kahawig na uri ng biglaang paghatol, at hindi kinakailangang sa eksaktong parehong paraan ng pagkamatay.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχί
  choice: Hindi
  rationale: Tuwirang itinatanggi nito ang ipinahihiwatig na palagay sa naunang konteksto; natural at mariin ang “Hindi” nang hindi nagdaragdag ng di-tiyak na diin.
- source_word: λέγω ὑμῖν
  choice: sinasabi ko sa inyo
  rationale: Pinananatili nito ang tuwirang pakikipag-usap ni Jesus at ang karaniwang pormulang pandiskurso sa Lucas.
- source_word: ἀλλ’
  choice: Ngunit
  rationale: Malinaw nitong ipinakikita ang pagsalungat sa palagay na katatapos tanggihan.
- source_word: ἐὰν μὴ
  choice: kung hindi
  rationale: Natural sa modernong Tagalog at tapat sa negatibong kondisyon ng Griyego.
- source_word: μετανοῆτε
  choice: kayo magsisisi
  rationale: Ang “magsisi” ay karaniwang salitang Tagalog para sa pagbabagong-loob at pagtalikod sa kasalanan sa harap ng Diyos; higit ito sa simpleng pagbabago lamang ng opinyon.
- source_word: πάντες
  choice: kayong lahat
  rationale: Pinananatili ang malawak at mariing saklaw ng babala sa lahat ng kausap.
- source_word: ὁμοίως
  choice: din
  rationale: Natural na iniuugnay nito ang sasapiting kapahamakan sa naunang halimbawa, habang hindi ipinipilit na eksaktong magkapareho ang paraan ng pagkamatay.
- source_word: ἀπολεῖσθε
  choice: mapapahamak
  rationale: Ipinahahayag nito ang pagdating sa kapahamakan o pagkawasak nang hindi nililimitahan ang kahulugan sa pisikal na kamatayan lamang o tahasang tinutukoy bilang walang-hanggang paghatol.
theological_decisions:
- issue: Saklaw ng kapahamakang tinutukoy ng ἀπολεῖσθε
  choice: mapapahamak
  alternative: mamamatay; wawasakin; hahatulan nang walang hanggan
  rationale: Nagbabala ang talata tungkol sa paghatol kapag walang pagsisisi, ngunit hindi espesipikong itinatakda ng pandiwang Griyego rito ang paraan o buong lawak ng kapahamakan. Pinananatili ng “mapapahamak” ang bigat at tunay na tensiyong teolohikal ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “magsisisi” bilang natural at may moral-espirituwal na bigat na katumbas ng μετανοέω, at ang “mapapahamak” upang huwag paliitin o labis na tukuyin ang babala.
