  - severity: low
    issue: Medyo hindi idiomatiko ang «ang mga inililigtas.»
    rationale: Mas karaniwan at malinaw sa modernong Filipino ang predikatibong «iilan lamang ba ang naliligtas?»; napapanatili nito ang diwang kasalukuyan at pasibo.
