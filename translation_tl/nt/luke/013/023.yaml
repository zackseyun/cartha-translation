  verdict: revise
  source_fidelity: Ang draft ay wastong kumakatawan sa di-pinangalanang nagsasalita, sa mga panghalip na isahan at maramihan, sa tawag na «Panginoon,» at sa kasalukuyang pasibong diwa ng σωζόμενοι. Gayunman, ang εἶπεν ay tuwirang «nagsabi,» hindi kinakailangang «nagtanong»; ang tanong ay nasa mismong sinipi nang pahayag. Ang «iilan ... ang naliligtas» ay mas likas na Filipino habang pinananatili ang kasalukuyang pasibong aspekto.
  naturalness: Ang «ang mga inililigtas» ay mauunawaan ngunit medyo mabigat at di-gaanong karaniwan sa modernong Filipino sa ganitong tanong. Mas natural ang «iilan lamang ba ang naliligtas?» Nangangahulugan pa rin ito ng «are few being saved?» at hindi nito ginagawang simpleng hinaharap ang pandiwa.
  terminology: Ang «Panginoon» ay angkop para sa Κύριε at pinananatili ang bukas na saklaw nito bilang magalang na tawag o tawag na may higit na bigat. Ang «naliligtas» ay angkop na salin ng kasalukuyang pasibong participle sa kontekstong ito.
