base_translation:
  language: en
  yaml_path: translation/nt/luke/013/023.yaml
  text: And someone said to him[a], “Lord, are only a few being saved?” And he said to them[b],
translation:
  language: tl
  text: At may isang nagsabi sa kanya, “Panginoon, iilan lamang ba ang naliligtas?” Sinabi naman niya sa kanila,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δέ
  choice: naman
  rationale: Isang banayad na pang-ugnay ito sa salaysay. Ang “naman” sa dalawang sugnay ay likas sa Filipino at hindi nagpapahiwatig ng matinding pagsalungat.
- source_word: τις
  choice: may isang
  rationale: Tumutukoy ito sa isang taong hindi pinangalanan; natural sa Filipino ang “may isang” bago ang pandiwang “nagtanong.”
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Pinananatili ang tahasang panghalip sa Griyego at hindi ipinapasok ang pangalang Jesus sa talatang ito.
- source_word: Κύριε
  choice: Panginoon
  rationale: Pinananatili nito ang karaniwang salin ng κύριος at ang posibilidad na ang tawag ay kapuwa magalang at may mas malalim na bigat sa konteksto ni Lucas.
- source_word: εἰ
  choice: ba
  rationale: Sa tuwirang tanong, likas na ipinahahayag sa Filipino ng panandang pananong na “ba” ang gamit ng εἰ.
- source_word: ὀλίγοι
  choice: kakaunti lamang
  rationale: Ipinahahayag nito ang maliit na bilang at ang restriktibong diin ng tanong nang natural sa Filipino.
- source_word: οἱ σῳζόμενοι
  choice: ang mga inililigtas
  rationale: Sinasalamin ng “mga inililigtas” ang artikulong maramihan at ang kasalukuyang pasibong anyo, nang hindi ginagawang tahasang tapos na ang pagliligtas.
- source_word: πρὸς αὐτούς
  choice: sa kanila
  rationale: Pinananatili ang maramihang panghalip ng Griyego, na mahalaga sapagkat sa higit sa isang tao ibinaling ang sagot.
theological_decisions:
- issue: Lakas ng κύριε bilang tawag kay Jesus
  choice: Panginoon
  alternative: Ginoo
  rationale: Maaaring isa itong magalang na tawag o may mas mataas na kristolohikal na bigat. Ang “Panginoon” ang higit na nagpapanatili sa pagiging bukas ng kahulugan kaysa sa pagpapaliit nito sa karaniwang paggalang lamang.
- issue: Aspekto ng σῳζόμενοι
  choice: ang mga inililigtas
  alternative: ang mga maliligtas
  rationale: Ang kasalukuyang pasibong participle ay naglalarawan sa mga taong nasa kalagayan o proseso ng pagliligtas. Iniiwasan ng salin ang paglipat nito sa lantay na hinaharap at hindi rin ito ikinakahon sa isang partikular na sistemang soteriolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “May isang nagtanong” sa halip na mas literal ngunit matigas na ayos. Ang “Panginoon” at “mga inililigtas” ay sadyang nagpapanatili sa teolohikal at aspektuwal na puwang ng Griyego.
