  text: And he laid his hands on her, and immediately she was made straight again, and she glorified God.
translation:
  language: tl
  text: Ipinatong niya ang kanyang mga kamay sa babae, at kaagad siyang naituwid[a] at niluwalhati niya ang Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tumayo siya nang tuwid” o “tumuwid siya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέθηκεν αὐτῇ τὰς χεῖρας
  choice: Ipinatong niya sa babae ang kanyang mga kamay
  rationale: Ang “ipinatong ... ang mga kamay” ay likas na Filipino para sa konkretong kilos ng paglalagay ng mga kamay sa isang tao. Ginawang lantad ang “sa babae” upang maging malinaw ang tinutukoy ng panghalip na αὐτῇ.
- source_word: παραχρῆμα
  choice: kaagad
  rationale: Malinaw at natural na ipinapahayag ng “kaagad” na nangyari ang paggaling nang walang pagkaantala.
- source_word: ἀνωρθώθη
  choice: naituwid
  rationale: Pinananatili ng anyong balintiyak na “naituwid” ang balarila ng Griyego at inilalarawan ang pisikal na pagpapanumbalik mula sa pagkakayuko, nang hindi idinaragdag ang salitang “muli,” na hindi tahasang nasa Griyego.
- source_word: ἐδόξαζεν
  choice: niluwalhati
  rationale: Pinananatili ng “niluwalhati” ang bigat ng δοξάζω bilang pagbibigay-luwalhati sa Diyos. Ang payak na aspektong pasalaysay ay natural sa Filipino, samantalang maaaring magpahiwatig ang imperpektong Griyego ng nagpapatuloy o nagsisimulang tugon.
- source_word: τὸν θεόν
  choice: ang Diyos
  rationale: Karaniwan at tuwirang salin ng tahasang layon ng pandiwang ἐδόξαζεν.
theological_decisions:
- issue: Ang resulta ng pagpapagaling na inilalarawan ng ἀνωρθώθη
  choice: kaagad siyang naituwid
  alternative: tumayo siya nang tuwid; tumuwid siya
  rationale: Ipinakikita ng konteksto ang pisikal na paggaling ng babaeng nakayuko. Pinananatili ng “naituwid” ang balintiyak na anyo at hindi nagpapasya nang higit sa sinasabi ng teksto tungkol sa paraan ng pagpapagaling.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasan ang “muli” sapagkat hindi ito tahasang nasa Griyego, at inilagay ang panandang [a] kaagad pagkatapos ng salitang may leksikal na alternatibo.
