  text: καὶ ἥξουσιν ἀπὸ ἀνατολῶν καὶ δυσμῶν καὶ ⸀ἀπὸ βορρᾶ καὶ νότου καὶ ἀνακλιθήσονται ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/029.yaml
  text: And they will come from east and west[a], and from north and south, and will recline at table in the kingdom of God.
translation:
  language: tl
  text: At darating ang mga tao mula sa silangan at kanluran, at mula sa hilaga at timog, at uupo sila sa hapag[a] sa kaharian ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hihimlay sila sa hapag.” Ang pandiwang Griyego ay mas tiyak na tumutukoy sa paghihimlay sa hapag para sa isang piging.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥξουσιν
  choice: darating ang mga tao
  rationale: Ang panghinaharap na anyo ng ἥκω ay nangangahulugang “darating.” Nilinaw ng “ang mga tao” ang di-tiyak na paksa ng pandiwa sa natural na Tagalog nang hindi tinutukoy ang kanilang lahi o pangkat.
- source_word: ἀπὸ ἀνατολῶν καὶ δυσμῶν
  choice: mula sa silangan at kanluran
  rationale: Bagaman maramihan ang mga salitang Griyego na literal na tumutukoy sa mga pagsikat at paglubog ng araw, idyoma ang mga ito para sa mga direksiyong silangan at kanluran.
- source_word: ἀπὸ βορρᾶ καὶ νότου
  choice: mula sa hilaga at timog
  rationale: Ipinagpapatuloy ng parirala ang paglalarawan sa pagdating mula sa lahat ng direksiyon; ito ang tuwiran at natural na katumbas sa Tagalog.
- source_word: ἀνακλιθήσονται
  choice: dudulog sila sa hapag
  rationale: Sa konteksto ng isang piging, ang ἀνακλίνω ay tumutukoy sa paghimlay o pag-upo sa hapag upang kumain. Ang “dudulog sa hapag” ay natural sa makabagong Tagalog at pinananatili ang larawan ng pakikibahagi sa piging.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: sa kaharian ng Diyos
  rationale: Tuwiran at malinaw nitong pinananatili ang teolohikal at panghinaharap na bigat ng parirala nang walang dagdag na pagpapakahulugan.
theological_decisions:
- issue: Larawan ng piging sa panghinaharap na kaharian
  choice: Panatilihin ang larawan ng pagkain sa pamamagitan ng “dudulog sila sa hapag.”
  alternative: “uupo sila sa kaharian ng Diyos” o “papasok sila sa kaharian ng Diyos”
  rationale: Ipinahihiwatig ng pandiwang Griyego ang pagkuha ng puwesto para sa isang piging. Pinananatili ng salin ang kongkretong larawan ng pakikibahagi sa kaharian nang hindi nagdaragdag ng doktrinal na detalye.
- issue: Saklaw ng apat na direksiyon
  choice: Isalin nang tuwiran ang silangan, kanluran, hilaga, at timog bilang malawak na pagtitipon.
  alternative: Tukuyin sila sa salin bilang mga Hentil mula sa lahat ng bansa.
  rationale: Malinaw sa teksto ang pagdating ng mga tao mula sa lahat ng direksiyon, ngunit hindi nito tahasang tinatawag silang mga Hentil. Pinananatili ng salin ang lawak at ang hindi tahasang tinukoy na pagkakakilanlan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “dudulog sa hapag” upang maging natural sa Tagalog habang napapanatili ang sinaunang larawan ng piging; ipinaliwanag sa talababa ang mas literal na kilos ng paghihimlay.
