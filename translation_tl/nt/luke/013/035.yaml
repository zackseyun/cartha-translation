  terminology: Ang “Panginoon,” “Pinagpala,” at “sa pangalan ng Panginoon” ay angkop at makikilalang biblikal na Tagalog. Ang “inyong bahay” ay wastong pinananatiling malawak, sa halip na ipasok ang “templo” o “Jerusalem” sa pangunahing teksto. Inalis ang “pinasasakitan” sa talababa sapagkat hindi ito leksikal na alternatibo ng ἀφίεται.
