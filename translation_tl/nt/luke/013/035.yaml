  to: Tingnan ninyo[a], ang inyong bahay[b] ay iniiwan sa inyo. At sinasabi ko sa inyo, hinding-hindi ninyo ako makikita hanggang sa dumating ang panahon na sasabihin ninyo[d], ‘Pinagpala ang dumarating sa pangalan ng Panginoon.’[c]
  rationale: Pinalitan ang “pinababayaan na” ng “iniiwan” upang mas tapat na maipahayag ang pasibong ἀφίεται nang hindi ipinapataw ang mas tiyak na kahulugang “pagpapabaya.” Inalis ang maling alternatibong “pinasasakitan” sa talababa. Inayos ang temporal na parirala upang maging likas sa modernong Filipino Tagalog, nang hindi nilulutas ang sinadyang ambiguwidad tungkol sa panahon ng huling pagkilala.
