id: LUK.13.35
reference: Luke 13:35
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἰδοὺ ἀφίεται ὑμῖν ὁ οἶκος ⸀ὑμῶν. λέγω ⸀δὲ ⸀ὑμῖν, οὐ μὴ ⸂ἴδητέ με⸃ ἕως ⸂ἥξει ὅτε⸃ εἴπητε· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/035.yaml
  text: Look[a], your house is left to you. And I tell you, you will certainly not see me until the time comes when you say[d][c][b], ‘Blessed is the one who comes in the name of the Lord.’
translation:
  language: tl
  text: Tingnan ninyo[a], ang inyong bahay[b] ay iniiwan sa inyo. At sinasabi ko sa inyo, hinding-hindi ninyo ako makikita hanggang sa dumating ang panahon na sasabihin ninyo[d], ‘Pinagpala ang dumarating sa pangalan ng Panginoon.’[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Masdan ninyo.”
    reason: lexical_alternative
  - marker: b
    text: Malamang na ang “inyong bahay” ay tumutukoy sa Jerusalem, lalo na sa templo nito, ngunit “inyong bahay” lamang ang sinasabi ng Griyego. Ang “iniiwan” ay maaari ring isalin na “inabandona” o “pinababayaan”; maaaring taglay ng anyong pasibo ang diwang ipinauubaya ito sa hatol.
    reason: alternative_reading
  - marker: c
    text: Ang mga salitang “Pinagpala ang dumarating sa pangalan ng Panginoon” ay umaalingawngaw sa Awit 118:26.
    reason: cross_reference
  - marker: d
    text: Para sa ilan, tumutukoy ito sa matagumpay na pagpasok ni Jesus sa Jerusalem; para naman sa iba, sa isang pagkilala sa kanya sa hinaharap. Hindi hinihingi ng Griyego ang iisang tiyak na panahon.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: Tingnan ninyo
  rationale: Isang likas at marangal na panawag-pansin sa modernong Tagalog na nagpapanatili sa mariing puwersa ng salitang Griyego.
- source_word: ἀφίεται
  choice: ay pinababayaan na
  rationale: Pinananatili ang anyong pasibo at ang maaaring diwang ang bahay ay iniiwan o ipinauubaya, nang hindi lubusang nilulutas ang judicial na pahiwatig.
- source_word: ὁ οἶκος ὑμῶν
  choice: ang inyong bahay
  rationale: Tuwirang sinasalamin ang Griyego at hindi ipinapasok sa pangunahing teksto ang mas tiyak na interpretasyong templo, Jerusalem, o sambahayan.
- source_word: λέγω δὲ ὑμῖν
  choice: At sinasabi ko sa inyo
  rationale: Ang 'At' ay natural na naghuhudyat ng pagpapatuloy o paglipat at hindi nagpapalabis sa bahagyang contrast ng δέ.
- source_word: οὐ μὴ ἴδητέ με
  choice: hinding-hindi ninyo ako makikita
  rationale: Ipinahahayag nang natural at mariin sa Tagalog ang napakalakas na negasyong οὐ μή.
- source_word: ἕως ἥξει ὅτε εἴπητε
  choice: hanggang sa dumating ang panahong sabihin ninyo
  rationale: Malinaw at likas na Tagalog para sa temporal na idyoma, habang pinananatili ang pagtukoy sa isang pangyayari sa hinaharap.
- source_word: Εὐλογημένος ὁ ἐρχόμενος
  choice: Pinagpala ang dumarating
  rationale: Pinananatili ang pormula ng pagpapala at ang substantibong participle nang hindi ito ginagawang mas tiyak na titulo.
- source_word: ἐν ὀνόματι κυρίου
  choice: sa pangalan ng Panginoon
  rationale: Karaniwan at makikilalang biblikal na pormula sa Tagalog, na tapat sa Griyego.
theological_decisions:
- issue: Tinutukoy ng 'inyong bahay'
  choice: Pinanatiling 'ang inyong bahay' sa pangunahing teksto
  alternative: ang templo; Jerusalem; ang sambahayan o bayan ng Israel
  rationale: Bagaman malamang na tumutukoy ito sa Jerusalem, lalo na sa templo, 'bahay' lamang ang tahasang sinasabi ng Griyego. Ang mas tiyak na pagpapakahulugan ay inilagay sa talababa.
- issue: Panahon at katuparan ng huling pahayag
  choice: Pinanatili bilang di-tiyak na pagkilala sa hinaharap
  alternative: ang matagumpay na pagpasok ni Jesus sa Jerusalem; isang pagkilala o pagsisisi sa hinaharap; pagkilala sa kanyang muling pagdating
  rationale: Hindi itinatakda ng mismong Griyego kung alin sa mga mungkahing panahon ang tinutukoy, kaya hindi pinili ng salin ang isang partikular na eskatolohikal na pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang pangmaramihang 'ninyo/inyo' upang ipakita ang plural na ὑμῖν/ὑμῶν. Pinanatili ang 'bahay' at ang malawak na temporal na pahayag upang hindi paliitin ang tunay na ambiguwidad ng teksto.
