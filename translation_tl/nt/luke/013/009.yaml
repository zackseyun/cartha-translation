id: LUK.13.9
reference: Luke 13:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: κἂν μὲν ποιήσῃ καρπὸν ⸂εἰς τὸ μέλλον— εἰ δὲ μήγε,⸃ ἐκκόψεις αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/009.yaml
  text: And if it bears fruit in the future—well and good; but if not[a], you will cut it down.
translation:
  language: tl
  text: At kung mamunga ito sa darating na panahon—mabuti; ngunit kung hindi[a], puputulin mo ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa susunod na taon.” Ginagawang mas tiyak ng ilang salin ang panahon batay sa naunang talata, ngunit ang Griyego rito ay mas literal na “para sa hinaharap” o “sa darating na panahon.”
    reason: alternative_reading
lexical_decisions:
- source_word: κἂν μὲν
  choice: At kung
  rationale: Pinananatili nito ang pang-ugnay na καί at ang pasubaling diwa ng ἐάν, habang likas na ipinahihiwatig ng kasunod na “ngunit” ang paghahambing na μέν...δέ.
- source_word: ποιήσῃ καρπὸν
  choice: mamunga
  rationale: Sa kontekstong panghalaman, ang ποιέω kasama ng καρπός ay nangangahulugang magbunga; ang “mamunga” ang natural at tuwirang katumbas sa Tagalog.
- source_word: εἰς τὸ μέλλον
  choice: sa darating na panahon
  rationale: Malapit ito sa literal na “para sa hinaharap” o “sa panahong darating” at hindi nito ginagawang tiyak na “sa susunod na taon” ang panahong hindi tahasang tinukoy sa talata.
- source_word: εἰ δὲ μήγε
  choice: ngunit kung hindi
  rationale: Malinaw at natural nitong pinananatili ang pagsalungat at ang pagtanggi sa naunang kondisyon.
- source_word: ἐκκόψεις αὐτήν
  choice: puputulin mo ito
  rationale: Ang ἐκκόπτω ay tumutukoy sa pagputol o pagpapatumba sa punong hindi namumunga; sa kontekstong ito, sapat at natural ang “puputulin mo ito.”
theological_decisions:
- issue: Ang panahong saklaw ng ipinagpalibang paghatol ng may-ari
  choice: “sa darating na panahon,” nang walang tiyak na pagbanggit sa susunod na taon
  alternative: “sa susunod na taon,” batay sa χρονόν ng naunang talata
  rationale: Hindi tahasang inuulit ng Griyego sa talatang ito ang “taong ito” o sinasabing “susunod na taon.” Pinananatili ng salin ang mas pangkalahatang pananalita at ang tensiyon sa pagitan ng palugit at posibleng pagputol.
- issue: Ang elipsis pagkatapos ng unang kondisyon
  choice: Idinagdag ang “mabuti” bilang maikling likas na pagkumpleto
  alternative: 'Iwan itong nakabitin: “At kung mamunga ito sa darating na panahon—; ngunit kung hindi...”'
  rationale: Walang tahasang apodosis sa Griyego pagkatapos ng unang kondisyon. Ang “mabuti” ay malinaw na ipinahihiwatig at kailangan upang maging natural at mauunawaan ang pangungusap sa Tagalog, nang hindi nagdaragdag ng bagong teolohikal na diwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang payak na bokabularyong panghalaman at pinanatili ang pasubali at ang babala ng talinghaga.
