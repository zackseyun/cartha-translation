  yaml_path: translation/nt/luke/021/010.yaml
  text: Then he said to them[a], “Nation will rise against nation, and kingdom against kingdom,”
translation:
  language: tl
  text: Pagkatapos ay sinabi niya sa kanila, “Babangon[a] ang isang bansa laban sa ibang bansa, at ang isang kaharian laban sa ibang kaharian.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Magbabangon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Pagkatapos
  rationale: Nagsisilbi itong panandang temporal na nag-uugnay sa pahayag sa naunang konteksto; natural sa makabagong Filipino ang “Pagkatapos” habang pinananatili ang pagkakasunod ng salaysay.
- source_word: ἔλεγεν
  choice: sinabi niya
  rationale: Bagaman nasa imperfect ang pandiwa, ang payak na “sinabi niya” ang natural na panimula sa tuwirang pananalita sa salaysay at hindi labis na ipinipilit ang progresibo o paulit-ulit na aspekto.
- source_word: αὐτοῖς
  choice: sa kanila
  rationale: Likas na katumbas ito ng dative indirect object sa Filipino.
- source_word: Ἐγερθήσεται
  choice: Babangon
  rationale: Pinananatili nito ang larawan ng pagbangon na nasa ἐγείρω at, kasama ng “laban sa,” malinaw na tumutukoy sa pagharap sa tunggalian, nang hindi nagpapahiwatig ng tahasang panlabas na tagapagpakilos.
- source_word: ἔθνος
  choice: bansa
  rationale: Sa kontekstong heopolitikal at sa paralelismo sa “kaharian,” ang “bansa” ang malinaw at karaniwang katumbas.
- source_word: ἐπ’ ἔθνος
  choice: laban sa ibang bansa
  rationale: Sa idyomang ito, ipinapahayag ng ἐπί na may accusative ang mapanlabang pagsalungat; idinagdag ang “ibang” upang maging natural at malinaw sa Filipino ang ugnayan ng dalawang bansa.
- source_word: βασιλεία
  choice: kaharian
  rationale: Dito ay tumutukoy ito sa isang kongkretong nasasakupan o kapangyarihang pampolitika, hindi lamang sa abstraktong paghahari.
- source_word: ἐπὶ βασιλείαν
  choice: laban sa ibang kaharian
  rationale: Pinananatili nito ang mapanlabang diwa at ang paralelismo sa unang sugnay sa natural na Filipino.
theological_decisions:
- issue: Pormula ng tunggalian sa apokaliptikong pahayag
  choice: Isinalin bilang tuwirang hula tungkol sa pagbangon ng mga bansa at kaharian laban sa isa’t isa, nang walang idinagdag na tiyak na sistemang pangwakas-na-panahon.
  alternative: Ituring itong eksklusibong patungkol sa pagbagsak ng Jerusalem, o gawing detalyadong talaorasan ng wakas.
  rationale: Pangkalahatang pag-aalitan ng mga bansa at kaharian lamang ang tahasang sinasabi ng talata; hindi dapat lutasin ng salin ang mas malawak na debateng eskatolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang balanseng paralelismo ng “bansa” at “kaharian” at iniwasan ang sobrang teknikal o makalumang pananalita.
