  text: παραδοθήσεσθε δὲ καὶ ὑπὸ γονέων καὶ ⸂ἀδελφῶν καὶ συγγενῶν καὶ φίλων⸃, καὶ θανατώσουσιν ἐξ ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/016.yaml
  text: But you will be handed over even by parents and brothers and relatives and friends[a], and they will put some of you to death.
translation:
  language: tl
  text: Ngunit isusuko kayo maging ng inyong mga magulang, mga kapatid na lalaki[a], mga kamag-anak, at mga kaibigan; at papatayin nila ang ilan sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kapatid,” sapagkat ang panlalaking anyong pangmaramihan sa Griyego ay maaari kung minsang tumukoy sa magkakapatid na lalaki at babae.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδοθήσεσθε
  choice: ipagkakanulo kayo
  rationale: Ang future passive ng παραδίδωμι ay tumutukoy sa pagsuko o pagbibigay sa kamay ng mga kalaban o may kapangyarihan. Sa konteksto ng mga malalapit na kamag-anak at kaibigan bilang gumagawa nito, natural sa Filipino ang “ipagkakanulo,” bagaman taglay rin nito ang diwang pagtataksil na ipinahihiwatig ng konteksto.
- source_word: δὲ
  choice: Ngunit
  rationale: Nagpapakita ang δέ ng banayad na pagsalungat sa naunang pangako ng karunungan at pagtatanggol.
- source_word: καὶ
  choice: maging
  rationale: 'Ang unang καί pagkatapos ng δέ ay may diin: hindi lamang mga tagalabas, kundi maging ang mga pinakamalalapit na tao ang magkakanulo sa kanila.'
- source_word: ὑπὸ
  choice: ng
  rationale: Kasama ng pandiwang passive, ipinakikilala ng ὑπό ang mga taong gumagawa ng kilos.
- source_word: γονέων
  choice: mga magulang
  rationale: Ang pangmaramihang γονεῖς ay kolektibong tumutukoy sa mga magulang.
- source_word: ἀδελφῶν
  choice: mga kapatid na lalaki
  rationale: Pinananatili nito sa pangunahing teksto ang panlalaking anyo ng pangmaramihang salitang Griyego, habang inilalagay sa talababa ang posibleng mas malawak na saklaw.
- source_word: συγγενῶν
  choice: mga kamag-anak
  rationale: Malinaw at likas itong katumbas para sa mga kabilang sa iisang angkan o pamilya.
- source_word: φίλων
  choice: mga kaibigan
  rationale: Tuwirang makabagong katumbas ng φίλων.
- source_word: θανατώσουσιν
  choice: papatayin nila
  rationale: Ang θανατόω ay nangangahulugang maging sanhi ng kamatayan. Ang “papatayin” ay natural at malinaw, nang hindi tinutukoy ang paraan ng pagpatay.
- source_word: ἐξ ὑμῶν
  choice: ang ilan sa inyo
  rationale: Ang pariralang ito ay partitive at nangangahulugang hindi lahat kundi ilan mula sa kanilang pangkat.
theological_decisions:
- issue: Saklaw ng ἀδελφῶν sa talaan ng mga kamag-anak
  choice: mga kapatid na lalaki
  alternative: mga kapatid
  rationale: Ang pangunahing teksto ay nagpapanatili sa panlalaking anyo ng Griyego. Gayunman, maaaring gamitin ang masculine plural para sa magkakahalong kasarian, kaya pinananatili sa talababa ang mas malawak na posibilidad sa halip na tahimik na pagpasyahan ang saklaw.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ipagkakanulo” dahil natural ito sa konteksto ng pagsuko ng malalapit na tao sa mga alagad, ngunit hindi dinagdagan ang teksto ng tiyak na awtoridad o paraan ng pagpatay.
