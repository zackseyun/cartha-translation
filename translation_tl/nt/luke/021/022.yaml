id: LUK.21.22
reference: Luke 21:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτι ἡμέραι ἐκδικήσεως αὗταί εἰσιν τοῦ πλησθῆναι πάντα τὰ γεγραμμένα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/022.yaml
  text: For these are days of vengeance[b][a], that all the things written may be fulfilled.
translation:
  language: tl
  text: Sapagkat ito ang mga araw ng pagganti[a], upang matupad ang lahat ng nasusulat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “paggawad ng kaparusahan” o “paghihiganti.”
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin ang huling parirala: “para matupad ang lahat ng nasusulat.” Ang Griyego ay maaaring magpahiwatig ng layunin o kinalabasan.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: ὅτι
  choice: Sapagkat
  rationale: Ipinakikilala nito ang paliwanag o dahilan ng naunang babala; pinananatili ng “sapagkat” ang sanhi at paliwanag na puwersa ng Griyego.
- source_word: ἡμέραι ἐκδικήσεως
  choice: mga araw ng pagganti
  rationale: Pinananatili ang konkretong “mga araw” at ang diwa ng makatarungang pagganti o kaparusahan. Ang “pagganti” ay tuwiran at hindi nagpapalabnaw sa bigat ng hatol.
- source_word: αὗταί εἰσιν
  choice: ito ang
  rationale: Likas na ayos sa Filipino para sa mariing pagtukoy na “these are,” habang nauunawaan mula sa panaguri na maramihan ang tinutukoy.
- source_word: τοῦ πλησθῆναι
  choice: upang matupad
  rationale: Ipinahahayag ang layunin o kinalabasan ng articular infinitive nang hindi lubusang nilulutas kung alin sa dalawang himig ang nangingibabaw.
- source_word: πάντα τὰ γεγραμμένα
  choice: lahat ng nasusulat
  rationale: Ang perfect passive participle ay isinalin sa likas at pormal na pariralang Filipino. Hindi ito pinalawak bilang “lahat ng nakasulat sa Kasulatan,” upang manatiling bukas ang saklaw gaya ng orihinal.
theological_decisions:
- issue: Kalikasan ng ἐκδίκησις sa propesiya ni Jesus
  choice: pagganti
  alternative: paggawad ng kaparusahan; paghihiganti
  rationale: Pinananatili ng “pagganti” ang hudisyal at mabigat na diwa ng banal na paggawad ayon sa nararapat, ngunit hindi idinaragdag sa teksto ang tahasang salitang “Diyos” ni nililimitahan ito sa karaniwang mapaghiganting damdamin ng tao.
- issue: Puwersa ng τοῦ na sinusundan ng infinitive
  choice: upang matupad
  alternative: para matupad; na matupad
  rationale: Maaaring magpahiwatig ang kayarian ng layunin o kinalabasan. Ang “upang” ay natural at marangal, at pinananatili ang ugnayan nang hindi nagpapasya nang labis sa isang makitid na pagbasa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “nasusulat” upang mapanatili ang biblikal na himig nang hindi tahasang dinaragdagan ang “Kasulatan.” Ang “ito ang mga araw” ay mas natural sa Filipino kaysa sa literal na “ang mga araw na ito ay,” ngunit pinananatili ang mariing pagtukoy sa mga araw na pinag-uusapan.
