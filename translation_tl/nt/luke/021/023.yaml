id: LUK.21.23
reference: Luke 21:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀οὐαὶ ταῖς ἐν γαστρὶ ἐχούσαις καὶ ταῖς θηλαζούσαις ἐν ἐκείναις ταῖς ἡμέραις· ἔσται γὰρ ἀνάγκη μεγάλη ἐπὶ τῆς γῆς καὶ ⸀ὀργὴ τῷ λαῷ τούτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/023.yaml
  text: Woe to those who are pregnant and to those who are nursing infants in those days! For there will be great distress upon the land[a], and wrath against this people[b],
translation:
  language: tl
  text: Kahabag-habag ang mga nagdadalang-tao at ang mga nagpapasuso sa mga araw na iyon! Sapagkat magkakaroon ng matinding paghihirap sa lupain[a], at poot laban sa bayang ito[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa daigdig.” Ang salitang Griyego na γῆ ay maaaring mangahulugang “lupain” o “daigdig.” Pinili rito ang “lupain” dahil nakatuon ang nakapaligid na konteksto sa Jerusalem at Judea.
    reason: lexical_alternative
  - marker: b
    text: O “poot para sa bayang ito” o “poot na sasapit sa bayang ito.”
    reason: alternative_reading
lexical_decisions:
- source_word: οὐαί
  choice: Kahabag-habag
  rationale: Nananatili ang bigat ng propetikong panaghoy at babala ng kapahamakan, sa natural at marangal na Filipino.
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: ang mga nagdadalang-tao
  rationale: Karaniwan at malinaw na modernong Filipino para sa literal na ‘mga may nasa sinapupunan.’
- source_word: ταῖς θηλαζούσαις
  choice: ang mga nagpapasuso
  rationale: Natural na tumutukoy sa mga inang nagpapasuso; hindi kailangang idagdag ang layon na ipinahihiwatig na ng pandiwa.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: sa mga araw na iyon
  rationale: Malapit sa estruktura ng Griyego at likas na temporal na pahayag sa Filipino.
- source_word: ἀνάγκη μεγάλη
  choice: matinding paghihirap
  rationale: Sa konteksto ng sakuna, ipinapahayag ng ἀνάγκη ang matindi at di-maiiwasang kagipitan, hindi lamang pangangailangan.
- source_word: ἐπὶ τῆς γῆς
  choice: sa lupain
  rationale: Maaaring mangahulugan ang γῆ ng ‘lupain’ o ‘daigdig.’ Mas angkop dito ang lokal na kahulugan dahil nakatuon ang konteksto sa Jerusalem at Judea.
- source_word: ὀργὴ
  choice: poot
  rationale: Pinananatili ang bigat ng galit na may kaugnayan sa paghatol nang hindi dinaragdagan ng tahasang pinagmulan na wala sa Griyego.
- source_word: τῷ λαῷ τούτῳ
  choice: laban sa bayang ito
  rationale: Ipinapahayag ang bayang tatamaan ng poot at pinananatili ang demonstratibong ‘ito.’
theological_decisions:
- issue: Saklaw ng γῆ at tinutukoy ng ‘bayang ito’
  choice: 'Pangunahing lokal ang tanawin: ‘lupain’ at ‘bayang ito.’'
  alternative: 'Pandaigdigang saklaw: ‘daigdig’ at buong sangkatauhan.'
  rationale: Ang agarang konteksto ay ang pagkubkob at pagkawasak ng Jerusalem at ang sinapit ng mga naninirahan dito. Pinananatili ng ‘lupain’ ang malamang na lokal na diwa nang hindi itinatanggi ang posibleng mas malawak na implikasyon.
- issue: Kalikasan at pinagmulan ng ὀργή
  choice: ‘Poot,’ nang hindi tahasang idinaragdag ang ‘ng Diyos.’
  alternative: ‘Poot ng Diyos’ o ‘paghatol.’
  rationale: Bagaman maaaring unawain sa konteksto bilang poot ng Diyos, walang tahasang pinagmulan ang ὀργή sa talata. Iniiwasan ng salin ang pagdaragdag at pinananatili ang teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang ‘Kahabag-habag’ upang ihatid ang propetikong panaghoy at babala, at iniwasang tahasang idagdag ang ‘Diyos’ bilang pinagmulan ng poot dahil hindi ito nakasaad sa Griyego.
