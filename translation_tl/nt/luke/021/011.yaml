id: LUK.21.11
reference: Luke 21:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: σεισμοί τε μεγάλοι ⸂καὶ κατὰ τόπους⸃ ⸂λιμοὶ καὶ λοιμοὶ⸃ ἔσονται, φόβητρά τε καὶ ⸂σημεῖα ἀπ’ οὐρανοῦ μεγάλα⸃ ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/011.yaml
  text: There will be great earthquakes[a], and in various places famines and plagues[c][b]; and there will be terrors and great signs from heaven.
translation:
  language: tl
  text: Magkakaroon ng malalakas na lindol, at sa iba’t ibang lugar ay magkakaroon ng mga taggutom at mga epidemya. Magkakaroon din ng mga nakapangingilabot na pangyayari at mga dakilang tanda mula sa langit[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa kalangitan.” Ang salitang Griyego na οὐρανός ay maaaring tumukoy sa langit o sa nakikitang kalangitan, kaya maaaring inilalarawan ng parirala ang mga nakikitang pangyayari sa himpapawid.
    reason: lexical_alternative
lexical_decisions:
- source_word: σεισμοί μεγάλοι
  choice: malalakas na lindol
  rationale: Tuwirang tumutukoy ang σεισμοί sa mga lindol, at ang μεγάλοι ay nagpapahiwatig ng tindi o lakas. Mas natural sa modernong Tagalog ang “malalakas na lindol” kaysa “mga dakilang lindol.”
- source_word: κατὰ τόπους
  choice: sa iba’t ibang lugar
  rationale: Ipinahahayag ng idyoma ang paglitaw ng mga pangyayari sa sari-saring lokasyon; malinaw at likas sa Tagalog ang pariralang ito.
- source_word: λιμοὶ
  choice: mga taggutom
  rationale: Ang salita ay tumutukoy sa matinding kakulangan ng pagkain o famine, hindi lamang sa karaniwang kakapusan.
- source_word: λοιμοὶ
  choice: mga epidemya
  rationale: Tumutukoy ang λοιμός sa laganap na nakahahawang sakit o salot. Ang “mga epidemya” ay malinaw at kasalukuyang katawagan, samantalang naiiwasan nito ang mas malawak at posibleng malabong kahulugan ng “mga salot.”
- source_word: φόβητρα
  choice: mga nakapangingilabot na pangyayari
  rationale: Ang bihirang pangngalang ito ay tumutukoy sa mga bagay o pangyayaring nagdudulot ng matinding takot. Nililinaw ng “pangyayari” ang diwa nang hindi tinutukoy kung ano mismo ang mga iyon.
- source_word: σημεῖα μεγάλα
  choice: mga dakilang tanda
  rationale: Pinananatili ng “mga tanda” ang malawak na kahulugan ng σημεῖα, at ng “dakila” ang diin ng μεγάλα nang hindi ipinapalagay na ang tinutukoy ay pisikal na laki lamang.
- source_word: ἀπ’ οὐρανοῦ
  choice: mula sa langit
  rationale: Maaaring tumukoy ang οὐρανός sa langit bilang makalangit na dako o sa nakikitang kalangitan. Pinananatili ng “langit” ang parehong posibleng pahiwatig sa Tagalog, at ipinaliliwanag sa talababa ang leksikal na saklaw.
- source_word: τε ... καὶ
  choice: at ... din ... at
  rationale: Inilalahad ng mga katagang ito ang sunod-sunod at pinagsama-samang mga pangyayari. Ang payak na koordinasyon at “din” ay natural sa Tagalog.
- source_word: ἔσονται / ἔσται
  choice: magkakaroon
  rationale: Likas na isinasalin ng eksistensiyal na “magkakaroon” ang mga anyong panghinaharap ng εἰμί sa talaan ng mga darating na pangyayari.
theological_decisions:
- issue: Kahulugan ng οὐρανός sa kontekstong apokaliptiko
  choice: mula sa langit
  alternative: mula sa kalangitan
  rationale: Maaaring ilarawan ng parirala ang mga nakikitang pangyayari sa kalangitan, ngunit maaari rin itong magtaglay ng makalangit o teolohikal na pahiwatig. Hindi nilulutas ng salin ang tensiyong ito; inilalahad sa talababa ang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “epidemya” bilang karaniwang kasalukuyang salita, habang pinanatili ang biblikal na bigat ng “mga dakilang tanda.” Inulit ang “magkakaroon” upang maging malinaw ang dalawang sugnay at manatiling natural ang daloy.
