  source_fidelity: 'Tapat ang salin sa SBLGNT: malinaw na naipapahayag ang malalaking lindol, ang mga taggutom at epidemya sa iba’t ibang lugar, ang mga bagay/pangyayaring nakapangingilabot, at ang malalaking tanda mula sa langit. Hindi nito nililimitahan ang saklaw ng φόβητρα o ng ἀπ’ οὐρανοῦ nang lampas sa Griyego.'
  naturalness: Likas at malinaw ang modernong Filipino Tagalog. Ang pag-uulit ng “Magkakaroon” ay maayos na naghihiwalay sa dalawang pangkat ng mga pangyayaring darating. Ang “malalakas na lindol,” “mga taggutom,” at “mga epidemya” ay idiomatiko at angkop sa rehistro.
  terminology: Ang “epidemya” ay wastong makabagong katumbas ng λοιμοί; ang “mga nakapangingilabot na pangyayari” ay maingat na paglalahad ng φόβητρα nang hindi nagpapasiya sa eksaktong uri nito. Ang “mga dakilang tanda” ay pinananatili ang bigat at lawak ng σημεῖα μεγάλα. Wasto ring pinananatili ng “mula sa langit” ang sinadyang kalabuan ng οὐρανός, na sinusuportahan ng talababa.
