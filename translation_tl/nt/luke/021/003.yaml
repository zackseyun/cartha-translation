  text: καὶ εἶπεν· Ἀληθῶς λέγω ὑμῖν ὅτι ἡ χήρα ⸂ἡ πτωχὴ αὕτη⸃ πλεῖον πάντων ἔβαλεν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/003.yaml
  text: And he said[a], “Truly I tell you that this poor widow put in more than all of them.”
translation:
  language: tl
  text: 'At sinabi niya, “Totoong sinasabi ko sa inyo: ang dukhang biyudang ito ay naghulog ng higit kaysa sa kanilang lahat.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀληθῶς
  choice: Totoong
  rationale: Nagpapakilala ito ng mariin at taimtim na pahayag; natural sa makabagong Tagalog ang “Totoong sinasabi ko sa inyo.”
- source_word: λέγω ὑμῖν
  choice: sinasabi ko sa inyo
  rationale: Pinananatili ang tuwirang pakikipag-usap at awtoritatibong diin ng pahayag ni Jesus.
- source_word: χήρα
  choice: biyuda
  rationale: Karaniwan at tiyak na tawag sa babaeng namatayan ng asawa.
- source_word: πτωχή
  choice: dukha
  rationale: Malinaw na nagpapahayag ng matinding kahirapan nang hindi dinaragdagan ang sinasabi ng talata; mas marangal at angkop sa rehistro kaysa ilang kolokyal na alternatibo.
- source_word: αὕτη
  choice: ito
  rationale: Pinananatili ang pagtukoy sa partikular na biyudang nasa harap nila.
- source_word: πλεῖον
  choice: higit
  rationale: Natural na paghahambing sa Tagalog at pinananatili ang dami o halaga bilang pokus nang hindi pa ipinaliliwanag ang batayan nito.
- source_word: πάντων
  choice: kaysa sa kanilang lahat
  rationale: Ipinahahayag ang genitive of comparison at malinaw na tumutukoy sa lahat ng iba pang naghulog.
- source_word: ἔβαλεν
  choice: naghulog
  rationale: Sa konteksto ng kabang-yaman ng templo, likas itong tumutukoy sa paglalagay o paghuhulog ng handog at pinananatili ang konkretong kilos ng βάλλω.
theological_decisions:
- issue: Paghahambing sa handog ng biyuda
  choice: naghulog ng higit kaysa sa kanilang lahat
  alternative: naghulog ng higit kaysa kaninuman sa kanila
  rationale: Pinananatili ang malawak na paghahambing ng πλεῖον πάντων nang hindi inuunahan ang paliwanag sa susunod na talata tungkol sa batayan ng paghatol ni Jesus.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “dukhang biyuda” upang maging natural ang ayos ng parirala, at “naghulog” dahil malinaw ito sa agarang konteksto ng paghahandog.
