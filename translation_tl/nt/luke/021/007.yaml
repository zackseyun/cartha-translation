  text: Ἐπηρώτησαν δὲ αὐτὸν λέγοντες· Διδάσκαλε, πότε οὖν ταῦτα ἔσται, καὶ τί τὸ σημεῖον ὅταν μέλλῃ ταῦτα γίνεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/007.yaml
  text: And they asked him[a], saying, “Teacher, when then will these things be, and what will be the sign when these things are about to happen?”
translation:
  language: tl
  text: Tinanong nila siya, “Guro, kailan nga mangyayari ang mga bagay na ito, at ano ang magiging tanda kapag malapit nang mangyari ang mga ito?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “kapag magaganap ang mga ito.” Maaaring gamitin ang pandiwang Griego sa mas pangkalahatang diwa kaysa sa “malapit nang mangyari.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπηρώτησαν
  choice: Tinanong nila
  rationale: Likas at malinaw na katumbas sa modernong Tagalog ng payak na nakaraang kilos; hindi na kailangang isalin nang hiwalay ang λέγοντες dahil tuwirang sumusunod ang sipi ng tanong.
- source_word: δὲ
  choice: Hindi tahasang isinalin
  rationale: Mahinang pang-ugnay ito sa salaysay; magiging mabigat at hindi likas ang pagsisimula sa “At” sa Tagalog, samantalang nananatili ang daloy mula sa naunang talata.
- source_word: Διδάσκαλε
  choice: Guro
  rationale: Payak at tuwirang katumbas ng tawag sa isang tagapagturo, nang hindi idinaragdag ang mas malakas na diwa ng “Panginoon” o “Amo.”
- source_word: πότε οὖν
  choice: kailan
  rationale: Ipinahihiwatig na ng konteksto ng tugon sa naunang pahayag ang inferensiyang dala ng οὖν; ang “kailan kung gayon” ay posible ngunit mas mabigat sa karaniwang Tagalog.
- source_word: ταῦτα ἔσται
  choice: mangyayari ang mga bagay na ito
  rationale: Idyomatikong ipinapahayag ng magiging anyo ng εἰμί ang pagdating o pag-iral ng mga pangyayaring tinutukoy; mas natural ito kaysa literal na “magiging ang mga ito.”
- source_word: σημεῖον
  choice: tanda
  rationale: Karaniwang Tagalog para sa palatandaang nagpapahiwatig ng isang mahalagang pangyayari.
- source_word: ὅταν
  choice: kapag
  rationale: Natural na panandang temporal para sa pangyayaring inaasahang magaganap sa hinaharap.
- source_word: μέλλῃ
  choice: malapit nang
  rationale: Pinananatili ang posibleng diwa ng nalalapit o nakaambang pangyayari nang hindi tinutukoy kung gaano kaikli ang pagitan.
- source_word: γίνεσθαι
  choice: mangyari
  rationale: Malinaw at kasalukuyang Tagalog para sa pagganap o pagsapit ng mga pangyayari.
theological_decisions:
- issue: Eskatolohikal na panahon at diwa ng μέλλῃ
  choice: “kapag malapit nang mangyari”
  alternative: “kapag mangyayari na” o “kapag magaganap na”
  rationale: Pinananatili ng pangunahing salin ang diwa ng pagkalapit na maaaring taglayin ng μέλλω, ngunit hindi nito ipinapasiya kung gaano kalapit o kung anong iskema ng mga pangyayari ang tama. Inilalahad sa talababa ang mas pangkalahatang posibleng pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Inalis ang hiwalay na salin ng participial na λέγοντες upang maiwasan ang di-likas na “na sinasabi,” at ginamit ang tuwirang sipi. Pinanatili ang maramihang “mga bagay na ito” upang sundan ang ταῦτα at ang saklaw ng tanong.
