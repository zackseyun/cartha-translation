  text: And all the people would come early in the morning to him in the temple to hear him[a].
translation:
  language: tl
  text: At lahat ng tao ay maaga sa umaga pumupunta sa kanya sa templo[a] upang makinig sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Griyegong ἱερόν ay tumutukoy sa buong nasasakupan ng templo, kabilang ang mga patyo nito, at hindi lamang sa panloob na santuwaryo.
    reason: cultural_note
lexical_decisions:
- source_word: πᾶς ὁ λαὸς
  choice: lahat ng tao
  rationale: Likas ito sa makabagong Filipino at pinananatili ang malawak at kolektibong diwa ng parirala nang hindi ito ginagawang teknikal na pagtukoy sa bansa.
- source_word: ὤρθριζεν
  choice: maagang pumupunta
  rationale: Ipinahihiwatig ng aspektong imperpektibo ang nakagawian o paulit-ulit na pagpunta, samantalang taglay ng pandiwa ang diwa ng pagpunta nang maaga sa umaga.
- source_word: πρὸς αὐτόν
  choice: sa kanya
  rationale: Natural na ipinapahayag nito ang paglapit o pagpunta kay Jesus nang hindi inuulit ang kanyang pangalan.
- source_word: ἐν τῷ ἱερῷ
  choice: sa templo
  rationale: Ito ang malinaw at karaniwang salin sa Filipino; nililinaw sa talababa na ang ἱερόν ay ang mas malawak na lugar ng templo, hindi lamang ang panloob na santuwaryo.
- source_word: ἀκούειν αὐτοῦ
  choice: upang makinig sa kanya
  rationale: Ipinakikita ng “upang” ang layunin ng kanilang pagpunta, at ang “makinig sa kanya” ay natural na Filipino para sa pakikinig sa itinuturo ni Jesus.
