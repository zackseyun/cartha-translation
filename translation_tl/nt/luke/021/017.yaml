  text: καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων διὰ τὸ ὄνομά μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/017.yaml
  text: And you will be hated by all because of my name[a].
translation:
  language: tl
  text: At kapopootan kayo ng lahat dahil sa aking pangalan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dahil sa akin” / “dahil sa aking pangalan.” Ang “aking pangalan” ay maaaring tumukoy sa pagkakakilanlan at awtoridad ni Jesus, at sa hayagang pagkilala at katapatan sa kanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang pang-ugnay na nagdurugtong sa pahayag sa naunang konteksto.
- source_word: ἔσεσθε μισούμενοι
  choice: kapopootan kayo
  rationale: Likas na Filipino na hinaharap na balintiyak para sa tambalang future copula at passive participle; malinaw na ipinahahayag ang patuloy o malawak na pagkapoot nang hindi gumagamit ng mabigat na literal na anyo.
- source_word: ὑπὸ πάντων
  choice: ng lahat
  rationale: Ang ὑπό na may henitibo ay tumutukoy sa gumagawa ng kilos. Ang “ng lahat” ay maikli at pinananatili ang malawak na saklaw ng πάντων nang hindi nagdaragdag ng salitang wala sa Griyego.
- source_word: διὰ
  choice: dahil sa
  rationale: Ang διά na may akusatibo ay nagsasaad ng dahilan; ang “dahil sa” ang karaniwan at malinaw na katumbas sa modernong Filipino.
- source_word: τὸ ὄνομά μου
  choice: aking pangalan
  rationale: Pinananatili ang tahasang metapora ng Griyego at ang malawak na pahiwatig nito sa pagkakakilanlan, awtoridad, at hayagang pagkilala kay Jesus.
theological_decisions:
- issue: Kahulugan ng “aking pangalan” sa konteksto ng pag-uusig sa mga alagad
  choice: Panatilihin sa pangunahing teksto ang “aking pangalan.”
  alternative: “dahil sa akin” o “dahil kabilang kayo sa akin”
  rationale: Tahasang sinasabi ng Griyego na “aking pangalan.” Ang literal na anyo ay nagpapanatili sa masaklaw na teolohikal na diwa ng pangalan ni Jesus—ang kanyang pagkakakilanlan, awtoridad, at pagkilalang ipinahahayag ng mga alagad—nang hindi ito nililimitahan sa iisang pagpapakahulugan.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang “kapopootan” bilang malinaw at idiomatikong anyong hinaharap; iniwasan ang mas kolokyal na “kamumuhian” upang mapanatili ang tuwirang diwa ng μισέω at ang dignidad ng estilo.
