id: LUK.21.19
reference: Luke 21:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐν τῇ ὑπομονῇ ὑμῶν ⸀κτήσασθε τὰς ψυχὰς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/019.yaml
  text: By your endurance you will gain your lives[a][b].
translation:
  language: tl
  text: Sa pamamagitan ng inyong matatag na pagtitiis, kamtin ninyo ang inyong buhay.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'May mga manuskritong may anyong panghinaharap: “Sa pamamagitan ng inyong matatag na pagtitiis, makakamit ninyo ang inyong buhay.”'
    reason: textual_variant
  - marker: b
    text: O “ang inyong mga kaluluwa” o “ang inyong sarili.” Maaaring mangahulugan ang salitang Griyego ng buhay, sarili, o kaluluwa ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν
  choice: Sa pamamagitan ng
  rationale: Ipinahihiwatig dito ng ἐν na ang matatag na pagtitiis ang paraan o kasangkapan; malinaw at likas itong naipapahayag sa Filipino sa pariralang “sa pamamagitan ng.”
- source_word: ὑπομονῇ
  choice: matatag na pagtitiis
  rationale: Ang ὑπομονή ay pananatiling matibay sa gitna ng pagsubok, hindi lamang pasibong paghihintay. Ipinahahayag ng “matatag na pagtitiis” ang katatagan at pagtitiis na kapwa mahalaga sa konteksto ng pag-uusig.
- source_word: κτήσασθε
  choice: kamtin ninyo
  rationale: Ang anyong nasa SBLGNT ay aorist middle imperative. Pinananatili ng “kamtin ninyo” ang pautos na anyo at ang diwang magkamit o magtamo, nang hindi agad ipinapakahulugang pisikal na pagkaligtas lamang.
- source_word: ψυχὰς
  choice: buhay
  rationale: Sa konteksto ng panganib, kamatayan, at pangwakas na pagliligtas, maaaring tumukoy ang ψυχή sa buhay o buong sarili. Ang “buhay” ay likas sa Filipino at umiiwas sa pagpapakitid ng kahulugan tungo lamang sa di-materyal na kaluluwa.
theological_decisions:
- issue: Kahulugan ng ψυχή sa konteksto ng pag-uusig at pangwakas na pagliligtas
  choice: buhay bilang kabuuang buhay o sarili
  alternative: kaluluwa
  rationale: Hindi nililinaw ng talata na ang di-materyal na bahagi lamang ng tao ang tinutukoy. Pinananatili ng “buhay” ang tensiyon sa pagitan ng tunay na panganib ng kamatayan at ng pangwakas na pagtatamo o pag-iingat ng buhay.
- issue: Pautos o panghinaharap na pagbasa ng κτάομαι
  choice: 'pautos: “kamtin ninyo”'
  alternative: 'panghinaharap: “makakamit ninyo”'
  rationale: Pautos ang κτήσασθε sa ibinigay na teksto ng SBLGNT, kaya iyon ang sinusunod sa pangunahing salin. Gayunman, may mahalagang baryanteng tekstuwal na panghinaharap, kaya inilalahad iyon sa talababa sa halip na tahimik na pagkaisahin ang dalawang pagbasa.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang “matatag na pagtitiis” upang maging malinaw sa karaniwang mambabasa ang aktibong pananatiling matibay sa pagsubok. Bahagyang mataas ngunit pamilyar ang “kamtin,” at angkop ito sa maikli at mariing pautos ng Griyego.
