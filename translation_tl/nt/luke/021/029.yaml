  text: 'And he told them a parable: “Look at the fig tree and all the trees[a].'
translation:
  language: tl
  text: 'At nagsalaysay siya sa kanila ng isang talinghaga: “Tingnan ninyo ang puno ng igos at ang lahat ng puno.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Pagmasdan ninyo ang puno ng igos at ang lahat ng puno.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: At
  rationale: Likas na ipinagpapatuloy ng “At” ang daloy ng salaysay nang hindi nagdaragdag ng tahasang temporal na diwa.
- source_word: εἶπεν παραβολὴν αὐτοῖς
  choice: sinabi niya sa kanila ang isang talinghaga
  rationale: Pinananatili nito ang karaniwang kahulugan ng εἶπεν at ang tahasang di-tuwirang layon na αὐτοῖς. Ang “talinghaga” ang kinagawiang katawagan sa παραβολή sa mga Ebanghelyo.
- source_word: Ἴδετε
  choice: Tingnan ninyo
  rationale: Ang maramihang pautos ay tuwirang nag-aanyaya sa mga tagapakinig na ituon ang pansin; malinaw at natural ito sa modernong Filipino.
- source_word: τὴν συκῆν
  choice: ang puno ng igos
  rationale: Tumutukoy ang συκῆ sa puno, hindi lamang sa bunga; malinaw itong naipapahayag ng “puno ng igos.”
- source_word: πάντα τὰ δένδρα
  choice: ang lahat ng puno
  rationale: Tuwirang pinananatili ang kabuuang saklaw ng πάντα at hindi idinaragdag ang “iba pang,” na wala namang tahasang katumbas sa Griyego.
