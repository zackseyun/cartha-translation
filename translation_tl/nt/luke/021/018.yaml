  source_fidelity: Ang balangkas na “ni isang … ay hindi” ay mahusay na naghahatid ng mariing negasyong οὐ μὴ. Gayunman, ang “mapapahamak” ay mas nakatuon sa pagdanas ng pinsala kaysa sa ἀπόληται (“mawala/mapahamak”), at ang “sa inyong ulo” ay hindi tahasang naihahayag ang ἐκ (“mula sa”).
  naturalness: Natural at marangal sa modernong Filipino ang “Ni isang buhok mula sa inyong ulo ay hindi mawawala.” Ang ayos na ito ay idiomatiko at pinananatili ang kawikaang lakas ng pahayag.
  terminology: Mas tumpak ang “mawala” para sa ἀπόληται sa kasabihang ito. Hindi nito nilulutas ang tensiyon sa konteksto bilang isang tiyak na pangakong walang pisikal na pinsalang mangyayari.
  issues:
