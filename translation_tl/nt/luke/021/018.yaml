translation:
  language: tl
  text: At ni isang buhok mula sa inyong ulo ay hindi mawawala.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “ni isang buhok mula sa inyong ulo ay hinding-hindi mawawala.” Gumagamit ang Griyego ng mariing dobleng pagtanggi upang magpahayag ng matibay na katiyakan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Likas na pang-ugnay ito sa Filipino at pinananatili ang daloy mula sa naunang pahayag nang hindi nagdaragdag ng tahasang pagsalungat.
- source_word: θρὶξ
  choice: isang buhok
  rationale: Ang isahang anyo ay likas na naghahatid ng kawikaang diwa na kahit ang pinakamaliit na bahagi ay hindi mawawala.
- source_word: ἐκ τῆς κεφαλῆς ὑμῶν
  choice: sa inyong ulo
  rationale: Ang “sa inyong ulo” ang natural na Filipino para sa partitive na diwang “mula sa inyong ulo”; ang “inyong” ay malinaw na tumutukoy sa maramihang kausap.
- source_word: οὐ μὴ
  choice: hindi
  rationale: Ang emphatic double negative ng Griyego ay ipinahahayag sa natural na Filipino sa pamamagitan ng mariing balangkas na “ni isang … ay hindi”; ipinaliliwanag sa talababa ang pambihirang lakas ng katiyakan.
- source_word: ἀπόληται
  choice: mapapahamak
  rationale: Pinananatili nito ang solemne at malawak na diwa ng pagkawala o pagkapahamak nang hindi nililimitahan ang pahayag sa pisikal na pagkasira lamang.
theological_decisions:
- issue: Tila salungat sa kalapit na pahayag na ang ilan sa mga alagad ay papatayin
  choice: Panatilihin ang pahayag bilang mariin at kawikaang katiyakan nang hindi ipinapaliwanag sa pangunahing teksto kung anong uri ng kaligtasan ang tinutukoy.
  alternative: Isalin ito bilang tahasang pangakong walang anumang pisikal na pinsalang sasapit sa mga alagad.
  rationale: Binabanggit ng agarang konteksto ang pag-uusig at pagkamatay ng ilan. Kaya hindi dapat lutasin ng salin ang tunay na tensiyon; pinananatili ng “ni isang buhok … ay hindi mapapahamak” ang mariing katiyakan at ang matalinghagang lakas ng orihinal.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ang pariralang “ni isang buhok” ay karaniwang idiomatikong paraan ng pagbibigay-diin, samantalang ang “mapapahamak” ay nagpapanatili sa solemne at sadyang malawak na diwa ng ἀπόληται.
