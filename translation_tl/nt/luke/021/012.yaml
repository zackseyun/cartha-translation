  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Πρὸ δὲ τούτων πάντων ἐπιβαλοῦσιν ἐφ’ ὑμᾶς τὰς χεῖρας αὐτῶν καὶ διώξουσιν, παραδιδόντες εἰς ⸀τὰς συναγωγὰς καὶ φυλακάς, ⸀ἀπαγομένους ἐπὶ βασιλεῖς καὶ ἡγεμόνας ἕνεκεν τοῦ ὀνόματός μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/012.yaml
  text: But before all these things[a], they will lay their hands on you and persecute you, handing you over to synagogues and prisons[b], bringing you before kings and governors because of my name.
translation:
  language: tl
  text: Ngunit bago mangyari ang lahat ng ito, dadakpin nila kayo at uusigin. Ibibigay nila kayo sa mga sinagoga at mga bilangguan, at dadalhin nila kayo sa harap ng mga hari at mga gobernador dahil sa aking pangalan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “dahil sa aking pangalan” ay maaari ring isaling “alang-alang sa aking pangalan” o, nang mas interpretibo, “dahil sa akin.” Ang “pangalan” ay tumutukoy sa persona at awtoridad ni Jesus.
    reason: alternative_reading
lexical_decisions:
- source_word: Πρὸ δὲ τούτων πάντων
  choice: Ngunit bago mangyari ang lahat ng ito
  rationale: Ipinahahayag ng πρό na nauuna sa panahon ang mga susunod na pangyayari; pinananatili ng “lahat ng ito” ang πάντων. Idinagdag ang “mangyari” upang maging likas at malinaw sa Tagalog ang temporal na parirala.
- source_word: ἐπιβαλοῦσιν ἐφ’ ὑμᾶς τὰς χεῖρας αὐτῶν
  choice: dadakpin nila kayo
  rationale: Ang literal na “ipapatong nila sa inyo ang kanilang mga kamay” ay isang idyoma para sa marahas na pagdakip o pananakit. Sa modernong Tagalog, malinaw at natural na ipinahahayag ng “dadakpin” ang kahulugan sa kontekstong ito.
- source_word: διώξουσιν
  choice: uusigin
  rationale: Sa konteksto ng pag-uusig sa mga alagad, ang “uusigin” ang tumpak at dignidad na katumbas, hindi lamang paghabol.
- source_word: παραδιδόντες
  choice: Ibibigay nila kayo
  rationale: Ipinahahayag nito ang paglalagay sa mga alagad sa kapangyarihan ng mga institusyong hahatol o magpaparusa sa kanila. Ginawang hiwalay na sugnay upang maging natural at madaling maunawaan sa Tagalog.
- source_word: εἰς τὰς συναγωγὰς καὶ φυλακάς
  choice: sa mga sinagoga at mga bilangguan
  rationale: Pinananatili ang mga institusyong tahasang binanggit sa Griyego. Ang “sa” ay natural kasunod ng “ibibigay,” samantalang ang maramihang anyo ay tumutugma sa συναγωγὰς at φυλακάς.
- source_word: ἀπαγομένους ἐπὶ βασιλεῖς καὶ ἡγεμόνας
  choice: dadalhin sa harap ng mga hari at mga gobernador
  rationale: Ang ἀπαγομένους ay pasibong tumutukoy sa mga alagad bilang dinadala, at ang “sa harap ng” ay naghahatid ng hudisyal na diwa ng pagharap sa mga pinuno.
- source_word: ἕνεκεν τοῦ ὀνόματός μου
  choice: dahil sa aking pangalan
  rationale: Pinananatili ang biblikal na pananalitang “aking pangalan,” na sumasaklaw sa persona, awtoridad, at pagkakakilanlan ni Jesus nang hindi ito pinakikitid sa isang interpretasyon.
theological_decisions:
- issue: Kahulugan ng “aking pangalan” sa konteksto ng pag-uusig
  choice: dahil sa aking pangalan
  alternative: dahil sa akin; alang-alang sa aking pangalan
  rationale: Pinananatili ng salin ang teolohikal na bigat at tunay na lawak ng τοῦ ὀνόματός μου, sa halip na tahimik itong ipakahulugan lamang bilang “dahil sa akin” o “dahil kabilang kayo sa akin.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignidad, at madaling maunawaan. Ginamit ang “dadakpin” sa halip na literal na idyomang “ipapatong ang mga kamay,” sapagkat ang literal na anyo ay maaaring mapagkamalang pagpapala o ordinasyon sa Tagalog. Pinanatili ang “sinagoga,” “aking pangalan,” at ang hudisyal na “sa harap ng.”
