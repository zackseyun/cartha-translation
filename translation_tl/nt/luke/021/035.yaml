base_translation:
  language: en
  yaml_path: translation/nt/luke/021/035.yaml
  text: like a trap[c][b][a]. For it will come upon all those dwelling on the face of the whole earth.
translation:
  language: tl
  text: gaya ng isang bitag.[a] Sapagkat sasapit ito sa lahat ng naninirahan[b] sa ibabaw ng buong daigdig.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “gaya ng isang silo.”
    reason: lexical_alternative
  - marker: b
    text: O “lahat ng nakaupo o namumuhay.” Literal na may diwang “nakaupo” ang salitang Griyego, ngunit sa idyomang ito ay tumutukoy ito sa mga naninirahan sa daigdig.
    reason: lexical_alternative
  - marker: c
    text: O “buong lupain,” bagaman higit na angkop dito ang “buong daigdig” dahil sa malawak na saklaw ng parirala.
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς παγίς
  choice: gaya ng isang bitag
  rationale: Ang παγίς ay bitag o silo. Malinaw at natural sa makabagong Filipino ang “bitag,” at napapanatili nito ang larawan ng biglaan at mahirap takasang panganib.
- source_word: ἐπεισελεύσεται
  choice: darating ito sa
  rationale: Ipinapahayag ng pandiwa ang pagdating ng isang bagay sa mga tao o ang pag-abot nito sa kanila. Ang “ito” ay tumutukoy sa araw na binanggit sa naunang talata nang hindi inuulit o nililinaw nang higit sa teksto.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikita ng γάρ na ang pangungusap ay nagbibigay ng dahilan para sa naunang babala.
- source_word: ἐπὶ πάντας
  choice: sa lahat
  rationale: Kasama ng pandiwang “darating,” natural na ipinahahayag ng “sa lahat” ang pagdating na sasapit sa bawat isa.
- source_word: τοὺς καθημένους
  choice: lahat ng naninirahan
  rationale: Bagaman literal na may diwang “nakaupo,” ginagamit dito ang κάθημαι bilang idyoma para sa mga naninirahan o namumuhay sa isang lugar.
- source_word: ἐπὶ πρόσωπον
  choice: sa ibabaw ng
  rationale: Ipinahahayag nito ang Semitikong idyomang “sa mukha ng,” na tumutukoy sa ibabaw o saklaw ng lupa; mas natural sa Filipino ang “sa ibabaw ng.”
- source_word: πάσης τῆς γῆς
  choice: buong daigdig
  rationale: Maaaring mangahulugan ang γῆ ng “lupa/lupain” o “daigdig.” Sa malawak na saklaw ng babalang ito, malinaw at natural ang “buong daigdig,” habang inilalagay sa talababa ang tunay na alternatibo.
theological_decisions:
- issue: Saklaw ng γῆ sa babalang eskatolohikal
  choice: buong daigdig
  alternative: buong lupain
  rationale: Ang pariralang tumutukoy sa lahat ng naninirahan sa ibabaw nito ay higit na umaayon sa pandaigdig na saklaw. Gayunman, pinananatili sa talababa ang leksikal na posibilidad na “lupain” upang hindi tuluyang alisin ang tunay na ambiguwidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Sapagkat” upang mapanatili ang lohikal at solemne ngunit madaling maunawaang ugnayan sa naunang babala. Iniwasan ang sobrang literal na “sa mukha ng lupa” dahil hindi ito natural sa kasalukuyang Filipino.
