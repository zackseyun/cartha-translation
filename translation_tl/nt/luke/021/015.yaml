  text: ἐγὼ γὰρ δώσω ὑμῖν στόμα καὶ σοφίαν ᾗ οὐ δυνήσονται ⸂ἀντιστῆναι ἢ ἀντειπεῖν⸃ ⸀ἅπαντες οἱ ἀντικείμενοι ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/015.yaml
  text: For I will give you words and wisdom that all who oppose you will not be able to withstand or contradict.
translation:
  language: tl
  text: Sapagkat ako ang magbibigay sa inyo ng mga salita at karunungan na hindi kayang labanan o salungatin ng sinuman sa mga kumakalaban sa inyo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στόμα
  choice: mga salitang sasabihin
  rationale: Literal itong “bibig,” ngunit metonimiya ito para sa kakayahang magsalita o sa mga salitang ipagkakaloob. Ang saling ito ay natural sa modernong Tagalog at malinaw na pinananatili ang diwang si Jesus ang magbibigay ng sasabihin.
- source_word: σοφίαν
  choice: karunungan
  rationale: Tuwirang katumbas na angkop sa konteksto ng matalinong pagsagot sa mga kalaban.
- source_word: ἀντιστῆναι
  choice: labanan
  rationale: Ipinahihiwatig nito ang hindi nila magagawang panindigan o mapagtagumpayan ang ibibigay na pananalita at karunungan.
- source_word: ἀντειπεῖν
  choice: salungatin
  rationale: Tumutukoy sa pagsagot nang pasalungat o pagsalungat sa sinabi; mas malapit ito sa Griyego kaysa sa mas tiyak na “pasinungalingan.”
- source_word: ἅπαντες οἱ ἀντικείμενοι ὑμῖν
  choice: sinuman sa mga kumakalaban sa inyo
  rationale: Ang negatibong pahayag na tumutukoy sa lahat ng kalaban ay likas na naipapahayag sa Tagalog bilang “hindi ... ng sinuman,” nang hindi binabago ang saklaw ng kahulugan.
theological_decisions:
- issue: Ang pinagmumulan ng pananalita at karunungan
  choice: ako ang magbibigay
  alternative: bibigyan ko kayo
  rationale: 'Pinananatili ang tahasang ἐγώ at ang bahagyang diin nito: si Jesus mismo ang nangangakong magkakaloob ng kailangan nila.'
- issue: Saklaw ng panghalip na ᾗ
  choice: ang hindi malalabanan o masasalungat ay ang pinagsamang mga salita at karunungan
  alternative: karunungan lamang ang tuwirang antecedent dahil pambabaeng isahan ang ᾗ
  rationale: Sa gramatika, tumutugma ang ᾗ sa σοφίαν, ngunit sa diwa ng magkaugnay na “bibig at karunungan,” ang buong kaloob ang inilalarawang hindi malalabanan o masasalungat. Hindi nilulutas ng salin nang labis ang posibleng sintaktikong pagtuon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “mga salitang sasabihin” sa halip na literal na “bibig” upang maging natural sa ordinaryong mambabasa habang pinananatili ang metonimikong diwa. Ang “sinuman sa mga kumakalaban” ay idiomatikong Tagalog para sa negatibong pahayag tungkol sa lahat ng kalaban.
