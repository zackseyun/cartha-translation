  text: ὅταν προβάλωσιν ἤδη, βλέποντες ἀφ’ ἑαυτῶν γινώσκετε ὅτι ἤδη ἐγγὺς τὸ θέρος ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/030.yaml
  text: when they already put forth leaves[a], seeing for yourselves, you know that summer is already near.
translation:
  language: tl
  text: Kapag naglalabas na ng mga dahon ang mga ito[a], nakikita ninyo mismo at nalalaman ninyong malapit na ang tag-araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “kapag sumibol na ang mga ito.” Hindi tahasang binabanggit sa Griyego ang “mga dahon,” ngunit ipinahihiwatig ito ng konteksto tungkol sa mga puno.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: Kapag
  rationale: Natural na panandang temporal sa Filipino na nagpapanatili ng contingent na diwa ng sugnay.
- source_word: προβάλωσιν
  choice: naglalabas na ng mga dahon
  rationale: Ang pandiwa ay tumutukoy sa paglabas ng bagong tubo; ipinahihiwatig ng konteksto ng mga puno ang mga dahon, bagaman walang tahasang layon sa Griyego.
- source_word: ἤδη
  choice: na
  rationale: 'Ang aspektuwal na “na” ay likas na katumbas ng ‘already’ sa dalawang bahagi: “naglalabas na” at “malapit na.”'
- source_word: βλέποντες ἀφ’ ἑαυτῶν
  choice: nakikita ninyo mismo
  rationale: Ipinahahayag na batay sa sarili nilang tuwirang pagmamasid ang pagkilala, sa natural na ayos ng Filipino.
- source_word: γινώσκετε
  choice: nalalaman ninyo
  rationale: Nagpapahayag ng pagkilalang bunga ng pagmamasid; malinaw at marangal sa modernong Filipino.
- source_word: ἐγγὺς
  choice: malapit
  rationale: Pinananatili ang payak na temporal na diwa ng pagiging nalalapit.
- source_word: θέρος
  choice: tag-araw
  rationale: Karaniwan at malinaw na salin para sa panahon ng summer.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “mga ito” upang tumukoy sa mga punong binanggit sa naunang talata, at pinanatili sa pamamagitan ng “na” ang dalawang paglitaw ng ἤδη.
