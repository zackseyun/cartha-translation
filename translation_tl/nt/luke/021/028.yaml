  text: ἀρχομένων δὲ τούτων γίνεσθαι ἀνακύψατε καὶ ἐπάρατε τὰς κεφαλὰς ὑμῶν, διότι ἐγγίζει ἡ ἀπολύτρωσις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/028.yaml
  text: But when these things begin to happen[a], straighten up and lift up your heads[c][b], because your redemption is drawing near.
translation:
  language: tl
  text: Ngunit kapag nagsimula nang mangyari ang mga bagay na ito, tumindig kayo nang tuwid at itaas ang inyong mga ulo, sapagkat nalalapit na ang inyong katubusan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “pagliligtas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχομένων ... τούτων γίνεσθαι
  choice: kapag nagsimula nang mangyari ang mga bagay na ito
  rationale: Ipinahahayag ng pariralang Griyego ang panahong kasabay ng pagsisimula ng mga pangyayari. Likas sa makabagong Tagalog ang saling ito at kapwa pinananatili ang diwa ng ‘magsimula’ at ‘mangyari.’
- source_word: δέ
  choice: Ngunit
  rationale: Ipinakikita rito ng δέ ang banayad na paglipat at pagsalungat mula sa naunang paglalarawan ng kaguluhan tungo sa panghihikayat.
- source_word: ἀνακύψατε
  choice: tumindig kayo nang tuwid
  rationale: Ang pandiwa ay tumutukoy sa pagtuwid o pag-angat ng sarili mula sa pagkakayuko. Pinananatili ng saling ito ang pisikal na larawan at ang pahiwatig ng panibagong tapang.
- source_word: ἐπάρατε τὰς κεφαλὰς ὑμῶν
  choice: itaas ang inyong mga ulo
  rationale: Tuwiran at natural nitong pinananatili ang larawan ng pagtitiwala at pag-asa sa maramihang pautos.
- source_word: διότι
  choice: sapagkat
  rationale: Malinaw nitong ipinahahayag ang ugnayang sanhi, habang angkop ang marangal ngunit karaniwang rehistro sa talata.
- source_word: ἐγγίζει
  choice: nalalapit na
  rationale: Ipinahahayag nito ang kasalukuyang paglapit, hindi lamang ang isang nananatiling kalagayang ‘malapit.’
- source_word: ἀπολύτρωσις
  choice: katubusan
  rationale: Ang ‘katubusan’ ang karaniwang terminong biblikal na nagpapanatili sa malawak na diwa ng paglaya at kaligtasan nang hindi ito nililimitahan sa simpleng pagtakas o pagsagip.
theological_decisions:
- issue: Kahulugan ng ‘inyong katubusan’ sa diskursong eskatolohikal
  choice: Pinanatili bilang ‘inyong katubusan,’ na tumutukoy sa nalalapit na ganap na pagliligtas at pagbibigay-katarungan sa mga alagad ni Jesus.
  alternative: ‘inyong pagliligtas,’ na maaaring unawain lamang bilang agarang pagsagip mula sa isang krisis
  rationale: Hinaharap at apokaliptiko ang konteksto. Pinananatili ng ‘katubusan’ ang lalim ng ἀπολύτρωσις at hindi tiyakang nilulutas sa mismong teksto ang paraan o lahat ng saklaw ng nalalapit na pagliligtas.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maramihang ‘kayo/inyong’ ayon sa mga pautos at panghalip sa Griyego. Pinanatili ang pisikal na larawang ‘tumindig nang tuwid’ at ‘itaas ang mga ulo’ sa halip na gawing tahasang paliwanag lamang tungkol sa pag-asa o tapang.
