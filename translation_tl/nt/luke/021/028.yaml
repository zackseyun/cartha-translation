  naturalness: Malinaw at likas ang pangunahing salin sa modernong Filipino Tagalog. Ang “tumindig kayo nang tuwid” ay marangal at nauunawaang katumbas ng pag-angat/pagtuwid ng sarili.
  terminology: Ang “katubusan” ay angkop para sa ἀπολύτρωσις at pinananatili ang saklaw nitong paglaya o pagliligtas. Maaaring ibigay ang “pagliligtas” bilang alternatibo nang walang eskatolohikal na pagpapakahulugang lampas sa teksto.
