  terminology: Ang “mga tanda,” “mga bansa,” “ugong ng dagat,” at “pagdaluyong nito” ay angkop. Ang “kagipitan” ay mas malapit sa bigat ng συνοχή kaysa “pagkabalisa” lamang.
