  to: At magkakaroon ng mga tanda sa araw, buwan, at mga bituin. Sa lupa, magkakaroon ng kagipitan ang mga bansa, na hindi malaman ang gagawin dahil sa ugong ng dagat at pagdaluyong nito.[a]
