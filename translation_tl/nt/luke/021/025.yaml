id: LUK.21.25
reference: Luke 21:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ⸀ἔσονται σημεῖα ἐν ἡλίῳ καὶ σελήνῃ καὶ ἄστροις, καὶ ἐπὶ τῆς γῆς συνοχὴ ἐθνῶν ἐν ἀπορίᾳ ⸀ἤχους θαλάσσης καὶ σάλου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/025.yaml
  text: And there will be signs in sun and moon and stars[a], and on the earth distress of nations in perplexity because of the roaring of the sea and the surging waves[b],
translation:
  language: tl
  text: At magkakaroon ng mga tanda sa araw, buwan, at mga bituin. Sa lupa, magkakaroon ng kagipitan ang mga bansa, na hindi malaman ang gagawin dahil sa ugong ng dagat at pagdaluyong nito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa tunog ng dagat at sa pag-uga nito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖα
  choice: mga tanda
  rationale: Malawak at karaniwang katumbas ito ng ‘signs’; hindi nito ipinapalagay na ang mga pangyayari ay mga masamang pangitain lamang.
- source_word: ἐν ἡλίῳ καὶ σελήνῃ καὶ ἄστροις
  choice: sa araw, buwan, at mga bituin
  rationale: Likas na ayos sa modernong Tagalog at pinananatili ang tatlong makalangit na bagay na kinaroroonan ng mga tanda.
- source_word: συνοχὴ ἐθνῶν
  choice: mababalisa ang mga bansa
  rationale: Ipinahahayag ng pandiwang parirala sa natural na Tagalog ang matinding kagipitan o pagkabalisa ng mga bansa.
- source_word: ἐν ἀπορίᾳ
  choice: hindi nila malalaman ang gagawin
  rationale: Ipinapakita nito ang diwa ng pagiging walang makitang paraan o hindi malaman kung ano ang gagawin, sa halip na simpleng pagkalito lamang.
- source_word: ἤχους θαλάσσης
  choice: ugong ng dagat
  rationale: Ang ‘ugong’ ay natural na salin ng malakas at nakatatakot na tunog ng dagat sa kontekstong ito.
- source_word: σάλου
  choice: pagdaluyong nito
  rationale: Tumutukoy ang salita sa marahas na pag-uga, pag-alon, o pagbugso ng dagat; ang ‘pagdaluyong’ ay malinaw at buhay na katumbas sa Tagalog.
theological_decisions:
- issue: Kalikasan ng mga tanda sa langit
  choice: Tuwirang isinalin bilang mga tanda sa araw, buwan, at mga bituin nang hindi ipinaliliwanag kung literal, simboliko, o kapuwa ang mga ito.
  alternative: Tukuyin ang mga ito bilang literal na kaguluhang pangkalawakan o bilang simbolikong larawang pampolitika.
  rationale: Hindi nilulutas ng talata ang usaping ito, kaya pinananatili ng salin ang tunay na puwang para sa pagpapakahulugan.
- issue: Ugnayan ng ugong ng dagat sa pagkabalisa ng mga bansa
  choice: 'Isinalin ang parirala bilang dahilan ng kanilang pagkabalisa at kawalang-magawa: ‘dahil sa.’'
  alternative: Isalin nang higit na pormal bilang ‘sa ugong,’ na maaaring magpahiwatig lamang ng kalagayan o pagkakataon.
  rationale: Sa konteksto, likas na ipinakikita ng ἐν kasama ng genitive phrase ang bagay na nagdudulot ng kanilang pagkabalisa, ngunit hindi dinaragdagan ang talata ng tiyak na eskatolohikal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Hinati sa dalawang pangungusap upang maiwasan ang mabigat na kayarian habang pinananatili ang pagkakasunod ng larawan mula sa langit patungo sa lupa.
