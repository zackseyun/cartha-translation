  text: ἀποψυχόντων ἀνθρώπων ἀπὸ φόβου καὶ προσδοκίας τῶν ἐπερχομένων τῇ οἰκουμένῃ, αἱ γὰρ δυνάμεις τῶν οὐρανῶν σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/026.yaml
  text: with people fainting from fear and expectation of the things coming upon the inhabited world[b][a], for the powers of the heavens will be shaken.
translation:
  language: tl
  text: Nanghihina ang mga tao dahil sa takot at paghihintay sa mga bagay na darating sa daigdig na tinitirhan ng mga tao[a], sapagkat mayayanig ang mga kapangyarihan ng kalangitan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa tinatahanang daigdig”; maaari ring “sa mundo” o “sa lupa.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga makalangit na kapangyarihan” o “mga kapangyarihan ng mga langit.” Malawak ang parirala at maaaring tumukoy sa mga puwersang kosmiko o makalangit.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποψυχόντων
  choice: nanghihina
  rationale: Ipinahahayag ang pagkawala ng lakas o halos pagkahimatay dahil sa matinding takot, nang hindi nililimitahan ang diwa sa literal na pagkahimatay lamang.
- source_word: ἀνθρώπων
  choice: ang mga tao
  rationale: Pangkalahatan ang tinutukoy ng salitang Griyego, hindi mga lalaki lamang.
- source_word: ἀπὸ φόβου
  choice: dahil sa takot
  rationale: Likas sa makabagong Tagalog at malinaw na ipinakikita ang sanhi.
- source_word: προσδοκίας
  choice: paghihintay
  rationale: Pinananatili ang pangunahing diwa ng umaasang paghihintay; ang masamang pangamba ay malinaw na mula sa konteksto, kaya hindi ito tahasang idinagdag sa salita.
- source_word: τῶν ἐπερχομένων
  choice: sa mga bagay na darating
  rationale: Pinananatili ang pangmaramihang, pangyayaring diwa ng substantival participle.
- source_word: τῇ οἰκουμένῃ
  choice: sa buong daigdig
  rationale: Natural sa Tagalog at tumutukoy sa daigdig na tinitirhan ng sangkatauhan; inilalahad sa talababa ang mas literal na anyo.
- source_word: αἱ δυνάμεις τῶν οὐρανῶν
  choice: ang mga kapangyarihan sa kalangitan
  rationale: Malapit sa Griyego at hindi nagpapasiya kung ang tinutukoy ay mga puwersang kosmiko, mga bagay sa langit, o mga makalangit na kapangyarihan.
- source_word: σαλευθήσονται
  choice: mayayanig
  rationale: Malinaw at likas na salin ng future passive na nagpapanatili sa larawang apokaliptiko ng kosmikong pagyanig.
theological_decisions:
- issue: Kahulugan ng “mga kapangyarihan sa kalangitan” sa kontekstong apokaliptiko
  choice: Panatilihin ang malawak at hindi tiyak na ekspresyong “mga kapangyarihan sa kalangitan.”
  alternative: “mga bagay sa kalangitan” o “mga makalangit na kapangyarihan”
  rationale: Maaaring tumukoy ang parirala sa mga puwersang kosmiko, mga tanglaw o bagay sa langit, o mga kapangyarihang makalangit. Hindi nilulutas ng salin ang hindi nilulutas ng Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nanghihina” upang pagsamahin ang pisikal at sikolohikal na epekto ng takot, at pinanatili ang kosmikong kalabuan ng huling parirala.
