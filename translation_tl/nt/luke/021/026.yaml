revisions:
- from: Nanghihina ang mga tao dahil sa takot at sa paghihintay sa mga bagay na darating sa buong daigdig[a], sapagkat mayayanig ang mga kapangyarihan sa kalangitan[b].
  to: Nanghihina ang mga tao dahil sa takot at paghihintay sa mga bagay na darating sa daigdig na tinitirhan ng mga tao[a], sapagkat mayayanig ang mga kapangyarihan ng kalangitan[b].
  rationale: Binago ang relasyong “sa kalangitan” tungo sa “ng kalangitan” upang maipakita ang genitive na konstruksyon ng Griyego at mapanatili ang sinadyang kalabuan nito. Inalis ang “buong” at ginawang mas malinaw ang kahulugan ng οἰκουμένη sa teksto, habang iningatan ang plural na “mga bagay na darating” at ang sanhi na takot at paghihintay.
