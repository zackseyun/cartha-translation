    issue: Ang “mga kapangyarihan sa kalangitan” ay gumagamit ng relasyong lokatibo sa halip na ng genitive na nasa Griyego.
    rationale: Ang τῶν οὐρανῶν ay “ng mga langit/kalangitan,” hindi pangunahing “na nasa kalangitan.” Ang “ng kalangitan” ay kapuwa mas tapat at likas sa modernong Filipino.
  - severity: low
    issue: Ang “buong daigdig” ay nagdaragdag ng “buong,” na hindi tahasang nasa τῇ οἰκουμένῃ.
    rationale: Ang οἰκουμένη ay ang tinatahanang daigdig o mundong may naninirahan. Hindi kailangang idagdag ang ideya ng kabuuan.
