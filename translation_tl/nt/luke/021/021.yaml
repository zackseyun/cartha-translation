id: LUK.21.21
reference: Luke 21:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τότε οἱ ἐν τῇ Ἰουδαίᾳ φευγέτωσαν εἰς τὰ ὄρη, καὶ οἱ ἐν μέσῳ αὐτῆς ἐκχωρείτωσαν, καὶ οἱ ἐν ταῖς χώραις μὴ εἰσερχέσθωσαν εἰς αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/021.yaml
  text: Then let those in Judea flee to the mountains[a], and let those in the midst of her depart, and let those in the countryside not enter into her.
translation:
  language: tl
  text: Sa panahong iyon, tumakas patungo sa kabundukan ang mga nasa Judea; umalis ang mga nasa loob nito[a]; at huwag pumasok dito ang mga nasa kanayunan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “nito” at “dito” ay tumutukoy sa Jerusalem. Pambabae ang anyo ng mga panghalip sa Griyego, gaya ng karaniwang pagpersonipika sa isang lungsod.
    reason: Nililinaw ang tinutukoy ng mga panghalip at ang personipikasyong hindi tuwirang maipakikita sa natural na Filipino.
lexical_decisions:
- source_word: τότε
  choice: Sa panahong iyon
  rationale: Ipinahahayag ang panahong kasunod ng mga tandang binanggit sa naunang konteksto; natural ito sa modernong Filipino at hindi ginagawang simpleng payo ang utos.
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: ang mga nasa Judea
  rationale: Tuwirang tumutukoy sa mga taong naroroon sa Judea.
- source_word: φευγέτωσαν
  choice: tumakas
  rationale: Ang payak na pautos sa Filipino ay nagpapanatili sa kagyat at mariing lakas ng ikatlong-panauhang pautos sa Griyego.
- source_word: εἰς τὰ ὄρη
  choice: patungo sa kabundukan
  rationale: Tumpak na ipinahahayag ang patutunguhan at ang maramihang ὄρη sa natural na Filipino.
- source_word: οἱ ἐν μέσῳ αὐτῆς
  choice: ang mga nasa loob nito
  rationale: Ang μέσῳ sa kontekstong ito ay yaong nasa loob ng tinutukoy na lugar. Pinananatili ng “nito” ang panghalip sa halip na idagdag sa pangunahing teksto ang pangalang Jerusalem.
- source_word: ἐκχωρείτωσαν
  choice: umalis
  rationale: Natural na Filipino para sa paglabas o paglayo sa isang lugar, at malinaw na tagubilin sa konteksto ng paglikas.
- source_word: οἱ ἐν ταῖς χώραις
  choice: ang mga nasa kanayunan
  rationale: Tumutukoy ang χώραι sa mga lugar sa labas ng lungsod, hindi lamang sa mga sinasakang bukid.
- source_word: μὴ εἰσερχέσθωσαν εἰς αὐτήν
  choice: huwag pumasok dito
  rationale: Pinananatili ang tahasang pagbabawal at ang panghalip na tumutukoy sa Jerusalem nang hindi inuulit ang pangngalan.
theological_decisions:
- issue: Ang tinutukoy ng αὐτῆς at αὐτήν
  choice: Gamitin ang “nito” at “dito,” na ipinaliliwanag sa talababa bilang Jerusalem.
  alternative: Ulitin ang “Jerusalem” o “lungsod” sa pangunahing teksto; o gamitin ang personipikadong “niya.”
  rationale: Malinaw sa agarang konteksto na Jerusalem ang tinutukoy, ngunit panghalip lamang ang nasa talata. Walang kasariang pambalarila ang mga panghalip na Filipino, kaya natural na panghalip ang ginamit habang ipinapaliwanag sa talababa ang pambabaeng anyo at personipikasyon sa Griyego.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang magkakatugmang payak na pautos upang mapanatili ang pagkaapurahan at parallel na ayos ng tatlong tagubilin.
