  text: ὅταν δὲ ἀκούσητε πολέμους καὶ ἀκαταστασίας, μὴ πτοηθῆτε· δεῖ γὰρ ταῦτα γενέσθαι πρῶτον, ἀλλ’ οὐκ εὐθέως τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/009.yaml
  text: But when you hear of wars and upheavals[a], do not be terrified; for these things must happen first[b], but the end is not at once.
translation:
  language: tl
  text: Ngunit kapag nakarinig kayo ng mga digmaan at kaguluhan[a], huwag kayong masindak; sapagkat kailangang mangyari muna ang mga ito, ngunit hindi kaagad darating ang wakas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga ligalig,” “mga pagkakagulo,” o “mga kaguluhan sa lipunan.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ngunit hindi kaagad ang wakas.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Ngunit kapag
  rationale: Ipinahihiwatig ng ὅταν ang isang pangyayari sa hinaharap na maaaring maganap, at ang δέ ay banayad na pang-ugnay na angkop isalin dito bilang “Ngunit.”
- source_word: ἀκούσητε
  choice: makarinig kayo ng
  rationale: Likas sa modernong Tagalog ang “makarinig ng” kapag mga balita tungkol sa digmaan at kaguluhan ang tinutukoy.
- source_word: πολέμους
  choice: mga digmaan
  rationale: Tuwirang inilalarawan ng plural na πόλεμος ang mga armadong labanan.
- source_word: ἀκαταστασίας
  choice: kaguluhan
  rationale: 'Malawak ang saklaw ng salita: maaaring tumukoy sa ligalig, pagkakagulo, o kawalan ng kaayusan. Hindi ito pinakikitid sa tiyak na pag-aalsa o rebelyon.'
- source_word: μὴ πτοηθῆτε
  choice: huwag kayong masindak
  rationale: Pinananatili ng “masindak” ang matinding diwa ng pagkatakot o pagkataranta, nang hindi nagiging di-likas sa Tagalog.
- source_word: δεῖ γὰρ
  choice: sapagkat kailangang
  rationale: Ang γάρ ay nagbibigay ng paliwanag, at ang δεῖ ay nagpapahayag ng pangangailangan; malinaw itong naihahatid ng “sapagkat kailangang.”
- source_word: ταῦτα γενέσθαι πρῶτον
  choice: mangyari muna ang mga ito
  rationale: Ang γίνομαι ay tumutukoy sa pagganap ng mga pangyayari, at ang πρῶτον ay natural na naihahayag ng “muna” bilang pagkakasunod-sunod.
- source_word: ἀλλ’ οὐκ εὐθέως τὸ τέλος
  choice: ngunit hindi kaagad darating ang wakas
  rationale: Walang hayag na pandiwa ang pariralang Griyego. Idinagdag ang “darating” upang maging malinaw at natural sa Tagalog habang pinananatili ang diwang hindi agad susunod ang wakas.
theological_decisions:
- issue: Panahong eskatolohikal
  choice: Kailangang maunang mangyari ang mga digmaan at kaguluhan, ngunit hindi nangangahulugang darating kaagad ang wakas.
  alternative: Ang mga pangyayaring ito ay kabilang sa panahong nauuna sa wakas, ngunit hindi sila ang mismong wakas.
  rationale: Pinananatili ng salin ang babala laban sa pag-aakalang ang mga kaguluhan ay nangangahulugan ng agarang pagdating ng wakas, nang hindi naglalapat ng isang tiyak na sistemang pangwakas-na-panahon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “masindak” upang mapanatili ang lakas ng utos, at ang “darating” upang gawing natural ang walang-pandiwang huling parirala sa Griyego.
