  text: Προσέχετε δὲ ἑαυτοῖς μήποτε βαρηθῶσιν ⸂ὑμῶν αἱ καρδίαι⸃ ἐν κραιπάλῃ καὶ μέθῃ καὶ μερίμναις βιωτικαῖς, καὶ ⸂ἐπιστῇ ἐφ’ ὑμᾶς αἰφνίδιος⸃ ἡ ἡμέρα ἐκείνη
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/034.yaml
  text: But watch yourselves[a], lest your hearts be weighed down with dissipation and drunkenness and the worries of life, and that day come upon you suddenly
translation:
  language: tl
  text: Ngunit mag-ingat kayo sa inyong mga sarili, baka mabigatan ang inyong mga puso dahil sa labis na pagsasaya sa pag-inom[a], paglalasing, at mga alalahanin sa buhay, at bigla kayong datnan ng araw na iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga masamang epekto ng labis na pag-inom.” Ang salitang Griyego ay maaaring tumukoy sa walang habas na pagsasaya o pag-inom, pati sa mga epekto nito pagkatapos.
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε δὲ ἑαυτοῖς
  choice: Ngunit mag-ingat kayo sa inyong sarili
  rationale: Pinananatili ang panawagan sa mapagbantay na pag-iingat sa sarili. Likas at malinaw ito sa modernong Filipino, at ang “Ngunit” ay kumakatawan sa δὲ bilang paglipat na may bahid ng pagsalungat.
- source_word: μήποτε βαρηθῶσιν ὑμῶν αἱ καρδίαι
  choice: baka mabigatan ang inyong mga puso
  rationale: Ang “baka” ay natural na naghahayag ng babalang layunin ng μήποτε. Pinananatili ng “mabigatan” ang metapora ng βαρηθῶσιν, at ng “mga puso” ang malawak na diwa ng panloob, moral, at espirituwal na pagkatao.
- source_word: ἐν κραιπάλῃ
  choice: dahil sa labis na pagpapakasasa[a]
  rationale: Maaaring tumukoy ang κραιπάλη sa labis na pagsasaya o pag-inom at sa masasamang epekto nito. Ang “labis na pagpapakasasa” ay sapat na malawak upang hindi ikulong ang salita sa “hangover” lamang; inilalahad sa talababa ang saklaw nito.
- source_word: μέθῃ
  choice: paglalasing
  rationale: Tuwirang salin ng katawagang tumutukoy sa kalagayan o gawi ng pagkalasing, at natural itong kaagapay ng “labis na pagpapakasasa.”
- source_word: μερίμναις βιωτικαῖς
  choice: mga alalahanin sa buhay
  rationale: Malinaw at pangkaraniwang Filipino para sa mga pagkabalisa at alalahaning kaugnay ng pang-araw-araw na buhay, nang hindi dinaragdagan ng tahasang negatibong kahulugang wala sa parirala.
- source_word: ἐπιστῇ ἐφ’ ὑμᾶς αἰφνίδιος
  choice: bigla kayong datnan
  rationale: Natural na Filipino na naghahayag ng di-inaasahang pagdating sa isang tao. Inililipat ang pang-uring αἰφνίδιος sa pang-abay na “bigla” upang maging malinaw at matatas.
- source_word: ἡ ἡμέρα ἐκείνη
  choice: ang araw na iyon
  rationale: Pinananatili ang mismong eskatolohikal na pahayag ng Griyego nang hindi idinaragdag ang “ng paghuhukom,” na ipinahihiwatig ng konteksto ngunit hindi tahasang nakasaad dito.
theological_decisions:
- issue: Eskatolohikal na tinutukoy ng “araw na iyon”
  choice: ang araw na iyon
  alternative: ang araw ng paghuhukom
  rationale: Malinaw sa konteksto na isang sukdulang araw ang tinutukoy, ngunit hindi pinalalawak ng salin ang parirala sa isang mas tiyak na doktrinal na katawagan na wala mismo sa talata.
translation_notes:
  register: Modernong Filipino na dignified ngunit madaling maunawaan. Pinanatili ang metapora ng pusong nabibigatan at ang di-tiyak ngunit malinaw sa kontekstong “araw na iyon.”
