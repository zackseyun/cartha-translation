  text: This will turn out for you as a testimony[a].
translation:
  language: tl
  text: Magiging pagkakataon ito upang makapagpatotoo kayo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Magreresulta ito sa pagpapatotoo ninyo.”
    reason: Pinananatili ng alternatibo ang pangngalang anyo ng μαρτύριον at mas tuwirang iniuugnay ang ὑμῖν sa pagpapatotoo ng mga alagad.
lexical_decisions:
- source_word: ἀποβήσεται
  choice: Magiging pagkakataon ito
  rationale: Ang future middle na ἀποβήσεται ay tumutukoy sa magiging kinalabasan ng naunang pag-uusig at pagharap sa mga pinuno, hindi lamang sa isang pangyayaring magaganap.
- source_word: ὑμῖν
  choice: kayo
  rationale: Sa pariralang “para makapagpatotoo kayo,” likas na naipapahayag sa Filipino na ang pagkakataon ay mapapakinabangan ng mga alagad, na siyang diwa ng datibo.
- source_word: εἰς
  choice: para
  rationale: Dito, ang εἰς ay maaaring magpahiwatig ng resulta o layunin. Ang “para” ay natural na nag-uugnay sa magiging kinalabasan at sa pagpapatotoo.
- source_word: μαρτύριον
  choice: makapagpatotoo
  rationale: Bagaman pangngalan ang μαρτύριον, mas natural sa modernong Filipino ang pandiwang “makapagpatotoo.” Pinananatili nito ang diwa ng pagbibigay ng patotoo sa pampubliko o hudisyal na kalagayan.
theological_decisions:
- issue: Kahulugan ng pagdurusa ng mga alagad sa harap ng mga pinuno
  choice: Ang mga pangyayaring hinulaan ni Jesus ay magiging pagkakataon upang makapagpatotoo ang mga alagad.
  alternative: Ang mga pangyayari ay magsisilbing katibayan laban sa kanilang mga kalaban.
  rationale: Sa konteksto ng Lucas tungkol sa pagdakip at pagharap sa mga hari at gobernador, pinakamalamang na tumutukoy ang μαρτύριον sa pagpapatotoo ng mga alagad tungkol kay Jesus. Gayunman, hindi nililimitahan ng salin kung ang patotoo ay pangunahing ebanghelistiko o hudisyal.
translation_notes:
  register: Natural, kasalukuyan, at marangal na Filipino. Ginamit ang “makapagpatotoo” sa halip na ang mas mabigat na “bilang isang patotoo,” habang inilagay sa talababa ang mas literal at tunay na alternatibo.
