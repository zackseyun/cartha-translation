lexical_decisions:
- source_word: εἶδεν
  choice: nakita niya
  rationale: Tuwirang isinasalin ang aorist ng ὁράω at pinananatili ang payak na daloy ng salaysay.
- source_word: δέ
  choice: At
  rationale: Mahinang pang-ugnay ito sa salaysay; ang “At” ay natural at hindi nagpapahiwatig ng labis na pagsalungat.
- source_word: τινα
  choice: isang
  rationale: Ipinakikilala ng τις ang isang taong hindi tinukoy; natural itong ipinahahayag ng “isang” sa Tagalog.
- source_word: χήραν
  choice: biyuda
  rationale: Karaniwan at malinaw na modernong Tagalog para sa babaeng namatayan ng asawa.
- source_word: πενιχράν
  choice: dukha
  rationale: Ipinahihiwatig nito ang kakapusan sa kabuhayan. Ang “dukha” ay maikli, dignipikado, at hindi kasing-tindi ng maaaring ipahiwatig ng “lubos na naghihikahos.”
- source_word: βάλλουσαν
  choice: naghuhulog
  rationale: Sa konteksto ng paglalagay ng salapi sa kabang-yaman, “naghuhulog” ang natural na Tagalog at pinananatili ang kasabay na kilos ng participle.
- source_word: ἐκεῖ
  choice: roon
  rationale: Tuwirang katumbas ng pang-abay na tumutukoy sa lugar na nabanggit sa naunang konteksto.
- source_word: λεπτὰ δύο
  choice: dalawang lepton
  rationale: Pinananatili ang espesipikong sinaunang denominasyon sa teksto at ipinaliliwanag sa talababa ang materyal at napakaliit na halaga nito; ang singular na anyong “lepton” ay angkop pagkatapos ng bilang sa natural na Filipino.
