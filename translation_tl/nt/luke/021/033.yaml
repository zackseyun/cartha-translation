id: LUK.21.33
reference: Luke 21:33
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσονται, οἱ δὲ λόγοι μου οὐ μὴ παρελεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/033.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: tl
  text: Ang langit at ang lupa ay lilipas, ngunit ang mga salita ko ay hinding-hindi lilipas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “tiyak na hindi lilipas.” Mariing pagtanggi ang ginamit sa Griyego (οὐ μή).
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ οὐρανὸς καὶ ἡ γῆ
  choice: ang langit at ang lupa
  rationale: Pinananatili ang nakaugaliang pares na tumutukoy sa kabuuan ng nilikhang daigdig; sa kontekstong ito, ang οὐρανός ay higit sa nakikitang kalangitan lamang, at ang γῆ ay hindi isang partikular na lupain.
- source_word: παρελεύσονται
  choice: lilipas
  rationale: Ang παρέρχομαι dito ay nangangahulugang lilipas o matatapos. Ang “lilipas” ay maikli, natural, at naiuulit sa dalawang sugnay upang mapanatili ang retorikal na pagkakatulad.
- source_word: δὲ
  choice: ngunit
  rationale: Ipinahahayag ng δέ ang malinaw na pagsalungat sa paglipas ng langit at lupa at sa di-paglipas ng mga salita ni Jesus.
- source_word: οἱ λόγοι μου
  choice: ang mga salita ko
  rationale: Tuwirang tumutukoy ang λόγοι sa mga salita o pahayag ni Jesus. Natural sa modernong Filipino ang “mga salita ko” at pinananatili nito ang maringal na diin ng pahayag.
- source_word: οὐ μὴ
  choice: hinding-hindi
  rationale: Ang οὐ μή kasama ng pandiwang nasa hinaharap ay mariing pagtanggi. Likas at malinaw na naihahatid ng “hinding-hindi” ang diin nito sa Filipino.
theological_decisions:
- issue: Lakas ng pahayag ni Jesus tungkol sa pananatili ng kanyang mga salita
  choice: hinding-hindi lilipas
  alternative: tiyak na hindi lilipas
  rationale: Hindi simpleng pagtanggi ang Griyegong οὐ μή kundi mariing katiyakan. Pinananatili ng “hinding-hindi” ang ganap na pagsalungat sa paglipas ng langit at lupa nang hindi nagdaragdag ng paliwanag na wala sa teksto.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “ang mga salita ko” sa halip na mas pormal na “ang aking mga salita” upang maging karaniwan at tuwiran ang himig, habang nananatiling taimtim ang pahayag.
