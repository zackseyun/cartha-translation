  text: καὶ πεσοῦνται στόματι μαχαίρης καὶ αἰχμαλωτισθήσονται εἰς ⸂τὰ ἔθνη πάντα⸃, καὶ Ἰερουσαλὴμ ἔσται πατουμένη ὑπὸ ἐθνῶν, ἄχρι ⸀οὗ ⸀πληρωθῶσιν καιροὶ ἐθνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/024.yaml
  text: And they will fall by the edge of the sword and will be led captive into all the nations[c][b][a], and Jerusalem will be trampled by the nations until the times of the nations are fulfilled.
translation:
  language: tl
  text: At mabubuwal sila sa talim ng tabak, at dadalhing bihag sa lahat ng bansa[a]. Ang Jerusalem ay yuyurakan ng mga bansa[b] hanggang sa matupad ang mga panahon ng mga bansa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa gitna ng lahat ng bansa” o “sa lahat ng mga Hentil.” Ang salitang Griyego na ἔθνη ay maaaring mangahulugang “mga bansa” o “mga Hentil/mga di-Judio,” ayon sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Ang Jerusalem ay yuyurakan ng mga Hentil.”
    reason: alternative_reading
  - marker: c
    text: Maaari ring “hanggang sa matupad ang mga panahon ng mga Hentil.”
    reason: alternative_reading
lexical_decisions:
- source_word: πεσοῦνται
  choice: mabubuwal sila
  rationale: Pinananatili ng “mabubuwal” ang larawang pandigma ng πίπτω at ipinahihiwatig ang pagkamatay nang hindi ito tahasang pinapaliit sa “mamamatay.”
- source_word: στόματι μαχαίρης
  choice: sa talim ng tabak
  rationale: Likas na katumbas sa Tagalog ng idyomang literal na “sa bibig ng tabak,” habang pinananatili ang kongkretong larawan.
- source_word: αἰχμαλωτισθήσονται
  choice: dadalhing bihag
  rationale: Ipinakikita ang pasibong pagkabihag at pagdadala sa kanila palayo bilang mga bilanggo.
- source_word: εἰς τὰ ἔθνη πάντα
  choice: sa lahat ng bansa
  rationale: Natural na nagpapahayag ng pagdadala sa iba’t ibang bansa; pinananatili rin ang pagkakaugnay ng tatlong gamit ng ἔθνη sa talata.
- source_word: Ἰερουσαλήμ
  choice: Jerusalem
  rationale: Karaniwang modernong anyo ng pangalan ng lungsod sa Filipino.
- source_word: πατουμένη
  choice: yuyurakan
  rationale: Malinaw at masiglang katumbas ng larawang pagyurak at pagpapasailalim; ang anyong panghinaharap ay umaayon sa periphrastic future ng Griyego.
- source_word: ὑπὸ ἐθνῶν
  choice: ng mga bansa
  rationale: Pinananatili ang parehong salin ng ἔθνη sa buong talata at hindi agad nilulutas kung ang diin ay pampolitika o sa mga di-Judio.
- source_word: ἄχρι οὗ
  choice: hanggang sa
  rationale: Maikli at natural na katumbas ng temporal na pang-ugnay.
- source_word: πληρωθῶσιν
  choice: matupad
  rationale: Pinananatili ang diwa ng katuparan ng isang itinakdang panahon nang hindi nagpapasok ng tiyak na sistemang eskatolohikal.
- source_word: καιροὶ ἐθνῶν
  choice: mga panahon ng mga bansa
  rationale: Ang “mga panahon” ay nagpapanatili sa posibilidad ng mahahalaga o itinakdang yugto, at ang pariralang “ng mga bansa” ay nagpapanatili sa kalabuan ng genitive.
theological_decisions:
- issue: Pagpapakahulugan sa ἔθνη sa buong talata
  choice: mga bansa
  alternative: mga Hentil / mga di-Judio
  rationale: Tatlong ulit ginamit ang iisang salitang Griyego. Ang pare-parehong “mga bansa” ay nagpapanatili sa leksikal na ugnayan at hindi agad nagpapasiya kung mga bansang politikal o mga taong di-Judio ang pangunahing tinutukoy. Inilalagay sa talababa ang makatwirang alternatibo.
- issue: Kahulugan ng καιροὶ ἐθνῶν
  choice: matupad ang mga panahon ng mga bansa
  alternative: matupad ang mga panahon ng mga Hentil / matapos ang mga itinakdang panahon ng mga bansa
  rationale: Ipinahihiwatig ng parirala ang isang may hangganang panahon, ngunit hindi tinutukoy ng salin ang isang partikular na balangkas tungkol sa mga huling araw. Pinananatili ng “matupad” ang teolohikal na bigat at ang di-tiyak na relasyon ng mga panahon sa mga bansa.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “mabubuwal” at “yuyurakan” upang mapanatili ang matitinding larawang pandigma nang hindi nagiging lipas o sobrang teknikal. Pinili ang “mga bansa” sa pangunahing teksto para sa leksikal na pagkakaisa, habang malinaw na itinabi sa mga talababa ang “mga Hentil.”
