  text: ⸀πάντες γὰρ οὗτοι ἐκ τοῦ περισσεύοντος αὐτοῖς ἔβαλον εἰς τὰ ⸀δῶρα, αὕτη δὲ ἐκ τοῦ ὑστερήματος αὐτῆς ⸀πάντα τὸν βίον ὃν εἶχεν ἔβαλεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/004.yaml
  text: For all these gave into the gifts out of their abundance, but she, out of her lack, put in all the livelihood she had.
translation:
  language: tl
  text: Sapagkat ang lahat ng taong ito ay naghulog mula sa kanilang kasaganaan sa mga handog[a]; ngunit ang babaeng ito, mula sa kanyang kakapusan[b], ay naghulog ng lahat ng kanyang panustos sa pamumuhay[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kaloob.” Ang salitang Griyego ay “mga kaloob,” na tumutukoy sa mga inihahandog sa konteksto ng templo.
    reason: lexical_alternative
  - marker: b
    text: O “mula sa kanyang karalitaan” o “mula sa kanyang pangangailangan.”
    reason: lexical_alternative
  - marker: c
    text: O “lahat ng kanyang kabuhayan” o “lahat ng kanyang ikinabubuhay.” Tumutukoy ito sa lahat ng kanyang panustos sa pamumuhay, hindi sa kanyang buong buhay o pag-iral.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες γὰρ οὗτοι
  choice: Sapagkat ang lahat ng ito
  rationale: Pinananatili ng “Sapagkat” ang paliwanag na ugnayan ng γάρ sa naunang talata, at natural na tinutukoy ng “ang lahat ng ito” ang mga taong nabanggit sa konteksto.
- source_word: ἐκ τοῦ περισσεύοντος αὐτοῖς
  choice: mula sa kanilang kasaganaan
  rationale: Ipinahahayag nito ang bagay na labis o sagana sa kanila at malinaw na itinatambal sa kakapusan ng balo.
- source_word: ἔβαλον εἰς τὰ δῶρα
  choice: naghulog sa mga handog
  rationale: Ang “naghulog” ay nagpapanatili sa pisikal na larawan ng paglalagay ng salapi, samantalang ang “mga handog” ay natural na tumutukoy sa mga kaloob sa konteksto ng templo.
- source_word: αὕτη δὲ
  choice: ngunit ang babaeng ito
  rationale: Pinananatili nito ang mariing pagsalungat ng δέ at ang pambabaeng demonstratibo, nang hindi ipinapasok ang salitang “balo” na wala mismo sa talatang ito.
- source_word: ἐκ τοῦ ὑστερήματος αὐτῆς
  choice: mula sa kanyang kakapusan
  rationale: Ang “kakapusan” ay tumutukoy sa kakulangan o pangangailangan at nagpapanatili sa tuwirang contrast sa “kasaganaan.”
- source_word: πάντα τὸν βίον ὃν εἶχεν
  choice: lahat ng kanyang ikinabubuhay
  rationale: Sa konteksto ng salapi, ang βίος ay tumutukoy sa kabuhayan o panustos sa pamumuhay, hindi sa buong pag-iral o buhay ng babae.
- source_word: ἔβαλεν
  choice: ay naghulog
  rationale: Natural itong paglalarawan sa aktuwal na pagdeposito ng mga barya at tumutugma sa kilos ng pandiwang βάλλω sa konteksto.
theological_decisions:
- issue: Kahulugan ng βίος sa handog ng balo
  choice: ikinabubuhay
  alternative: buong buhay niya
  rationale: Ang pinag-uusapan ay salaping panustos sa pamumuhay. Iniiwasan ng “ikinabubuhay” ang maling pahiwatig na literal niyang ibinigay ang kanyang mismong buhay.
- issue: Tinutukoy ng τὰ δῶρα
  choice: mga handog
  alternative: mga kaloob; kabang-yaman ng templo
  rationale: Ang “mga handog” ay tumpak at natural sa konteksto ng templo, ngunit hindi nito dinaragdagan ang teksto ng mas tiyak na “kabang-yaman,” na hindi tahasang nakasaad sa parirala.
- issue: Lakas ng ὑστέρημα
  choice: kakapusan
  alternative: karalitaan; pangangailangan
  rationale: Pinananatili ng “kakapusan” ang malawak na diwa ng kakulangan nang hindi higit na tinutukoy kung ito ay lubos na karalitaan, bagaman iyon ay posible sa konteksto.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “naghulog” para sa konkretong kilos, “mga handog” bilang natural na katawagan sa mga kaloob sa templo, at “ikinabubuhay” upang malinaw na ipahayag ang materyal na diwa ng βίος.
