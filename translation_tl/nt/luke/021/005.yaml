base_translation:
  language: en
  yaml_path: translation/nt/luke/021/005.yaml
  text: And as some were speaking about the temple[a], that it had been adorned with beautiful stones and votive offerings, he said[b],
translation:
  language: tl
  text: Habang nagsasalita ang ilan tungkol sa templo[a], na pinalamutian na ng magagandang bato at mga kaloob na itinalaga[b], sinabi niya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay tumutukoy sa buong nasasakupan ng templo, hindi lamang sa panloob na santuwaryo.
    reason: cultural_note
  - marker: b
    text: O “mga handog na inialay.” Tumutukoy ang salitang Griyego sa mga kaloob na inilaan sa Diyos at inilagay sa templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: τινων λεγόντων
  choice: Habang sinasabi ng ilan
  rationale: Ginawang temporal na sugnay ang genitive absolute at pinanatili ang nagpapatuloy na aspekto ng λεγόντων sa natural na Tagalog.
- source_word: τοῦ ἱεροῦ
  choice: templo
  rationale: Ang ἱερόν ay tumutukoy sa buong nasasakupan ng templo, hindi lamang sa panloob na santuwaryo; ang “templo” ang pinakanatural na katawagan sa Tagalog, na may paliwanag sa talababa.
- source_word: λίθοις καλοῖς
  choice: magagandang bato
  rationale: Tuwirang ipinahahayag nito ang kahanga-hanga at kaakit-akit na kalidad ng mga batong ginamit sa templo.
- source_word: ἀναθήμασιν
  choice: mga handog na inialay
  rationale: Tumutukoy ito sa mga kaloob na itinalaga sa Diyos at inilagay sa templo. Mas madaling maunawaan ang pariralang ito kaysa sa teknikal na “mga handog na panata,” habang pinananatili ang kultikong diwa.
- source_word: κεκόσμηται
  choice: napapalamutian
  rationale: 'Ipinahihiwatig ng anyong perpektong pasibo ang kalagayang bunga ng naganap nang pagpapalamuti: ang templo ay nakatayong napapalamutian ng mga iyon.'
- source_word: εἶπεν
  choice: sinabi niya
  rationale: Hindi tahasang binabanggit sa Griyego ang pangalang Jesus, kaya pinanatili ang di-tahasang simuno at ang daloy ng salaysay.
