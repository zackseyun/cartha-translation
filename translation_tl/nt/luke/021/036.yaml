  to: Ngunit manatili kayong gising sa lahat ng panahon at manalangin, upang magkaroon kayo ng lakas na makatakas sa lahat ng mga bagay na ito na malapit nang mangyari[a][b], at makatayo sa harap ng Anak ng Tao.[c]
