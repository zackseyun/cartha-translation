  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀγρυπνεῖτε ⸀δὲ ἐν παντὶ καιρῷ δεόμενοι ἵνα ⸀κατισχύσητε ἐκφυγεῖν ⸀ταῦτα πάντα τὰ μέλλοντα γίνεσθαι, καὶ σταθῆναι ἔμπροσθεν τοῦ υἱοῦ τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/036.yaml
  text: But stay awake at all times[a], praying that you may have strength to escape all these things that are about to happen[c][b], and to stand before the Son of Man.
translation:
  language: tl
  text: Ngunit manatili kayong gising sa lahat ng panahon at manalangin, upang magkaroon kayo ng lakas na makatakas sa lahat ng mga bagay na ito na malapit nang mangyari[a][b], at makatayo sa harap ng Anak ng Tao.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa ilang manuskrito: “upang maibilang kayong karapat-dapat na makatakas sa lahat ng mga bagay na ito…” sa halip na “upang magkaroon kayo ng lakas na makatakas sa lahat ng mga bagay na ito…”'
    reason: textual_variant
  - marker: b
    text: O “na mangyayari.”
    reason: lexical_alternative
  - marker: c
    text: Ang “makatayo sa harap ng Anak ng Tao” ay maaaring magpahiwatig ng pagtayong tinanggap o pinawalang-sala sa harap niya, ngunit hindi ito tahasang sinasabi ng Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγρυπνεῖτε
  choice: manatiling gising
  rationale: Pinananatili nito ang larawan ng pagpupuyat at mapagbantay na kahandaan sa isang natural na modernong Tagalog.
- source_word: δὲ
  choice: Ngunit
  rationale: Nagpapakita ng banayad na pagsalungat o paglipat mula sa naunang babala.
- source_word: ἐν παντὶ καιρῷ
  choice: lagi
  rationale: Natural at malinaw na katumbas ng patuloy na pagbabantay sa bawat panahon.
- source_word: δεόμενοι
  choice: manalangin
  rationale: Sa konteksto, tumutukoy ito sa taimtim na paghiling sa Diyos.
- source_word: ἵνα κατισχύσητε
  choice: upang magkaroon kayo ng lakas
  rationale: Ang κατισχύω ay nangangahulugang magkaroon ng sapat na lakas o manaig; hindi nito tahasang ipinahahayag ang pagiging karapat-dapat.
- source_word: ἐκφυγεῖν
  choice: na makatakas
  rationale: Direkta at natural na nagpapahayag ng pagkaligtas mula sa mga darating na pangyayari.
- source_word: ταῦτα πάντα τὰ μέλλοντα γίνεσθαι
  choice: sa lahat ng mga bagay na ito na malapit nang mangyari
  rationale: Pinananatili ang maaaring diwa ng nalalapit na pangyayari sa μέλλω habang nananatiling natural sa Tagalog.
- source_word: σταθῆναι
  choice: makatayo
  rationale: Pinananatili ang larawan ng pagtayo nang hindi tahasang idinaragdag ang pagtanggap o pagpapawalang-sala.
- source_word: ἔμπροσθεν
  choice: sa harap ng
  rationale: Karaniwan at malinaw na panandang ugnayan para sa pagharap sa isang persona.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Anak ng Tao
  rationale: Itinatag na salin ng titulong ito sa mga Ebanghelyo at pinananatili ang pinagmulang Semitiko at Kristolohikal na gamit.
theological_decisions:
- issue: Kahulugan ng κατισχύσητε kaugnay ng pagtitiis sa mga pangyayari sa wakas
  choice: magkaroon kayo ng lakas
  alternative: maibilang kayong karapat-dapat
  rationale: Κατισχύσητε ang mababasa sa SBLGNT at tumutukoy sa pagkakaroon ng sapat na lakas o kakayahang manaig. Ang pagbasa tungkol sa pagiging karapat-dapat ay tekstuwal na baryante at inilagay sa talababa.
- issue: Diwa ng σταθῆναι ἔμπροσθεν τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: makatayo sa harap ng Anak ng Tao
  alternative: makatayong tinanggap sa harap ng Anak ng Tao
  rationale: Maaaring magpahiwatig ang parirala ng pagtanggap o pagpawalang-sala sa paghuhukom, ngunit hindi ito tahasang sinasabi ng Griyego; kaya pinanatili ang larawan at ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “manatiling gising” upang mapanatili ang kongkretong talinghaga ng ἀγρυπνεῖτε, at iniwasang gawing tahasan sa pangunahing teksto ang ipinahihiwatig lamang na pagtanggap o pagpawalang-sala.
