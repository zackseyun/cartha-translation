base_translation:
  language: en
  yaml_path: translation/nt/luke/021/032.yaml
  text: Truly I say to you[c][b][a], this generation will certainly not pass away until all things happen.
translation:
  language: tl
  text: 'Tinitiyak ko sa inyo: Hinding-hindi lilipas ang salinlahing ito[a] hanggang sa mangyari ang lahat ng bagay.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring unawain na “ang bayang ito” o “ang kapanahunang ito”; maraming posibleng pakahulugan ang salitang Griyego, bagaman “salinlahi” ang pinakatuwirang salin.
    reason: alternative_reading
  - marker: b
    text: Isinasalin ng ilan na “ang lahat ng bagay na ito,” batay sa konteksto; ngunit “lahat ng bagay” lamang ang tahasang nakasulat sa Griyego. Ang “mangyari” ay maaari ring isalin na “maganap” o “magkatotoo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Tinitiyak ko
  rationale: Naghahayag ito ng taimtim at may-awtoridad na pagpapatibay. Likas sa makabagong Tagalog ang “Tinitiyak ko sa inyo” at naipapahayag ang puwersa ng pormulang Griyego nang hindi kinakailangang tumbasan ng transliterasyong “Amen.”
- source_word: λέγω ὑμῖν
  choice: sa inyo
  rationale: Isinama sa natural na pormulang “Tinitiyak ko sa inyo,” na malinaw na naghahatid ng tuwirang pagsasalita ni Jesus.
- source_word: οὐ μὴ παρέλθῃ
  choice: Hinding-hindi lilipas
  rationale: Ang οὐ μή kasama ng aorist subjunctive ay matinding pagtanggi; malinaw na ipinahahayag ng “hinding-hindi” ang diin nito.
- source_word: ἡ γενεὰ αὕτη
  choice: ang salinlahing ito
  rationale: Ang “salinlahi” ang tuwiran at dignified na katumbas ng γενεά bilang generation, habang iniiwasang pagpasyahan sa pangunahing teksto ang pinagtatalunang tinutukoy nito.
- source_word: ἕως ἂν
  choice: hanggang sa
  rationale: Karaniwang panandang temporal na nagsasaad ng hangganan ng naunang pahayag.
- source_word: πάντα
  choice: ang lahat ng bagay
  rationale: Tumutugma ito sa neuter plural na “lahat ng bagay.” Hindi idinagdag ang “mga ito” sapagkat walang katumbas na demonstrative sa tekstong Griyego.
- source_word: γένηται
  choice: mangyari
  rationale: Sa kontekstong ito, tumutukoy ang γίνομαι sa paglitaw o pagsasakatuparan ng mga pangyayari. Natural ang “mangyari” pagkatapos ng “hanggang sa” at hindi nito ipinapasok ang mas tiyak na ideya ng ‘matupad.’
theological_decisions:
- issue: Ang kahulugan at tinutukoy ng “salinlahing ito” sa isang eskatolohikal na pahayag
  choice: Panatilihin ang tuwirang leksikal na salin na “ang salinlahing ito” nang hindi tinutukoy kung sino mismo ang saklaw nito.
  alternative: “ang bayang ito,” “ang kapanahunang ito,” o ang salinlahing makakakita sa mga tanda
  rationale: Maaaring pagtalunan ang referent ng parirala, ngunit hindi ito nililinaw ng mismong pangungusap. Pinananatili ng salin ang teolohikal at interpretatibong tensiyon sa halip na lutasin ito sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Tinitiyak ko sa inyo” bilang likas na katumbas ng solemneng ἀμὴν λέγω ὑμῖν, at “hinding-hindi” upang mapanatili ang matinding pagtanggi ng οὐ μή.
