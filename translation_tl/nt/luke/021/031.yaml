  source_fidelity: Tumpak ang pangunahing daloy ng salin at napapanatili ang demonstrative na “mga bagay na ito,” ang hinaharap na kontingensiya ng ὅταν, at ang hindi-pinalawak na “kaharian ng Diyos.” Gayunman, ang “dapat ninyong malaman” ay nagdaragdag ng modal na diwa ng obligasyon (“dapat”) na hindi tahasang nasa γινώσκετε. Mas tuwirang naipahahayag ng “kilalanin ninyo” ang imperatibong pagbasa bilang pagkilala sa kahulugan ng mga pangyayari.
  naturalness: Likas at malinaw ang “Kapag nakita ninyong nangyayari ang mga bagay na ito.” Ang “Kilalanin ninyo” ay marangal ngunit makabagong Filipino at mas idiomatiko sa kontekstong ito kaysa sa “dapat ninyong malaman.”
  terminology: Ang “kaharian ng Diyos” ay angkop at pinananatili ang lawak ng βασιλεία χωρίς pagpapasok ng isang tiyak na pagbasa tungkol sa paghahari o ganap na katuparan. Ang talababa para sa “paghahari ng Diyos” ay katanggap-tanggap bilang leksikal na alternatibo.
