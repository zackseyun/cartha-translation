  text: οὕτως καὶ ὑμεῖς, ὅταν ἴδητε ταῦτα γινόμενα, γινώσκετε ὅτι ἐγγύς ἐστιν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/031.yaml
  text: So also you[a], when you see these things happening[b], know that the kingdom of God is near.
translation:
  language: tl
  text: 'Gayundin naman kayo: kapag nakita ninyong nangyayari ang mga bagay na ito, kilalanin ninyo[a] na malapit na ang kaharian ng Diyos.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “malalaman ninyo”; maaaring unawain ang anyong Griego bilang pahayag sa halip na utos.
    reason: grammatical_ambiguity
  - marker: b
    text: Maaari ring “paghahari ng Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: Gayundin naman kayo
  rationale: Iniuugnay nito ang mga alagad sa paghahambing tungkol sa puno ng igos sa naunang talata. Pinananatili ng “gayundin naman” ang puwersang paghahambing at ang hayag na ὑμεῖς.
- source_word: ὅταν ἴδητε
  choice: kapag nakita ninyo
  rationale: Likas na ipinapahayag ng “kapag” ang pangyayaring inaasahan sa hinaharap na tinutukoy ng ὅταν kasama ng aorist subjunctive.
- source_word: ταῦτα γινόμενα
  choice: nangyayari ang mga bagay na ito
  rationale: Tumutukoy ang γινόμενα sa mga pangyayaring nagaganap, habang pinananatili ng “mga bagay na ito” ang pagtukoy sa mga tandang kababanggit pa lamang.
- source_word: γινώσκετε
  choice: dapat ninyong malaman
  rationale: Ipinahahayag nito nang natural sa Filipino ang utos na kilalanin o maunawaan ang kahulugan ng mga tanda. Iniiwasan ang “alamin,” na maaaring magpahiwatig ng pagsisiyasat upang makakuha ng impormasyon.
- source_word: ἐγγύς ἐστιν
  choice: malapit na
  rationale: Ang “malapit na” ay likas na Filipino para sa temporal na pagkalapit at hindi nito dinaragdagan ang teksto ng tiyak na paliwanag kung paano darating o mahahayag ang kaharian.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ang kaharian ng Diyos
  rationale: Ito ang karaniwan at malawak na salin na maaaring maglaman ng mga diwa ng sakop at paghahari, nang hindi pinipili nang tahasan ang isa lamang.
theological_decisions:
- issue: Kahulugan ng “kaharian ng Diyos” sa kontekstong eskatolohikal
  choice: Pinanatili ang “kaharian ng Diyos” nang walang paliwanag na idinagdag sa pangunahing teksto.
  alternative: “ang paghahari ng Diyos” o isang tahasang pagtukoy sa ganap na katuparan nito
  rationale: Hindi tahasang nililinaw ng talata kung ang tinutukoy ay ang pagpapakita, ganap na katuparan, o pagpapatunay ng kaharian. Pinananatili ng salin ang saklaw at tensiyong teolohikal ng parirala.
- issue: Mood ng γινώσκετε
  choice: 'Isinalin bilang utos: “dapat ninyong malaman.”'
  alternative: 'Isalin bilang pahayag: “malalaman ninyo” o “alam ninyo.”'
  rationale: Magkapareho ang anyo ng ikalawang panauhang maramihan sa present indicative at present imperative. Mas angkop sa daloy ng pangangaral ang utos, ngunit tunay na posible sa gramatika ang pagbasa bilang pahayag kaya itinala ito sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Gayundin naman kayo” upang mapanatili ang diin sa mga kausap, at ang “dapat ninyong malaman” upang natural na maipahayag ang imperatibong pagbasa nang hindi gumagamit ng mas di-likas na “alamin ninyo.”
