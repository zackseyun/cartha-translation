id: LUK.21.37
reference: Luke 21:37
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἦν δὲ τὰς ἡμέρας ⸂ἐν τῷ ἱερῷ διδάσκων⸃, τὰς δὲ νύκτας ἐξερχόμενος ηὐλίζετο εἰς τὸ ὄρος τὸ καλούμενον Ἐλαιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/037.yaml
  text: And during the days he was teaching in the temple[b][a], but at night he would go out and lodge on the mountain called the Mount of Olives.
translation:
  language: tl
  text: Araw-araw ay nagtuturo si Jesus sa bakuran ng templo[a], ngunit gabi-gabi ay lumalabas siya at nagpapalipas ng gabi[b] sa bundok na tinatawag na Bundok ng mga Olibo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griego na ἱερόν ay tumutukoy sa buong kompleks o mga bakuran ng templo, hindi lamang sa panloob na santuwaryo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “nananatili roon nang magdamag”; maaari ring ipahiwatig ng pandiwa ang pagpapalipas ng gabi sa labas.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν ... διδάσκων
  choice: ay nagtuturo si Jesus
  rationale: Ang imperfect na ἦν kasama ng participle na διδάσκων ay nagsasaad ng nagpapatuloy at nakaugaliang gawain. Nilinaw ang di-tuwirang simuno bilang si Jesus mula sa konteksto upang maging natural sa Tagalog.
- source_word: τὰς ἡμέρας
  choice: Araw-araw
  rationale: Ipinahahayag ng accusative of time ang paulit-ulit na gawain sa maghapon at malinaw na itinatambal ito sa “gabi-gabi.”
- source_word: ἐν τῷ ἱερῷ
  choice: sa bakuran ng templo
  rationale: Ang ἱερόν ay tumutukoy sa mas malawak na kompleks o mga bakuran ng templo, hindi lamang sa panloob na santuwaryo. Ang “bakuran ng templo” ay malinaw at likas sa modernong Tagalog.
- source_word: τὰς δὲ νύκτας
  choice: ngunit gabi-gabi
  rationale: Pinananatili ng “ngunit” ang paghahambing ng gawain sa araw at gabi, at ipinakikita ng “gabi-gabi” ang nakaugaliang pag-uulit.
- source_word: ἐξερχόμενος
  choice: ay lumalabas siya
  rationale: Ang participle ay naglalarawan ng paulit-ulit na paglabas ni Jesus bago siya magpalipas ng gabi sa bundok.
- source_word: ηὐλίζετο
  choice: nagpapalipas ng gabi
  rationale: Ang αὐλίζομαι ay nangangahulugang manatili o magpalipas ng gabi at maaari ring magpahiwatig ng pagtulog sa labas. Hindi labis na tinutukoy ng salin ang eksaktong uri ng matutuluyan.
- source_word: εἰς τὸ ὄρος
  choice: sa bundok
  rationale: Bagaman karaniwang nagpapahayag ng patutunguhan ang εἰς, ang kinalabasang lokasyon ang likas na ipinahahayag sa Tagalog kasunod ng pandiwang “nagpapalipas ng gabi.”
- source_word: τὸ καλούμενον Ἐλαιῶν
  choice: na tinatawag na Bundok ng mga Olibo
  rationale: Isinasalin nito ang pangalan ayon sa kahulugan ng Ἐλαιῶν (“ng mga olibo”) at ginagamit ang nakikilalang pangalang Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang magkatugmang “araw-araw” at “gabi-gabi” upang likas na maipakita ang paulit-ulit na huwaran at ang day/night contrast. Inilagay ang bawat talababa kaagad pagkatapos ng pariralang nililinaw nito.
