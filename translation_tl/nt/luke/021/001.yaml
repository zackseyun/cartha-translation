  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἀναβλέψας δὲ εἶδεν τοὺς βάλλοντας ⸂εἰς τὸ γαζοφυλάκιον τὰ δῶρα αὐτῶν⸃ πλουσίους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/001.yaml
  text: Then he looked up and saw rich people putting their gifts into the treasury[a][b].
translation:
  language: tl
  text: Pagtingala niya, nakita niya ang mayayamang naghuhulog ng kanilang mga kaloob[a] sa kabang-yaman[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga handog.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Griego na isinaling “kabang-yaman” ay maaaring tumukoy sa lugar ng kabang-yaman ng templo o sa mga sisidlang hulugan ng handog.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀναβλέψας
  choice: Pagtingala niya
  rationale: Likas sa modernong Tagalog at malinaw na ipinahahayag ang pag-angat ng tingin na tinutukoy ng aorist participle.
- source_word: δὲ
  choice: (hindi isinalin nang hiwalay)
  rationale: Mahinang pang-ugnay ito; sapat na sa Tagalog ang pagkakasunod ng mga sugnay upang ipakita ang pagpapatuloy ng salaysay nang hindi pinatitindi ang ugnayan.
- source_word: εἶδεν
  choice: nakita niya
  rationale: Tuwirang katumbas ng pandiwang tumutukoy sa aktuwal na pagkakita, nang walang idinagdag na diwa ng masusing pagpansin.
- source_word: τοὺς βάλλοντας
  choice: naghuhulog
  rationale: Sa konteksto ng paghahandog, ang “naghuhulog” ay natural na Tagalog para sa paglalagay ng salapi sa sisidlan at napapanatili rin ang konkretong kilos ng βάλλω.
- source_word: εἰς τὸ γαζοφυλάκιον
  choice: sa kabang-yaman
  rationale: Ang “kabang-yaman” ay maikli at karaniwang salin para sa treasury; hindi idinagdag sa pangunahing teksto ang “templo” dahil hindi ito tahasang nasa talata.
- source_word: τὰ δῶρα αὐτῶν
  choice: kanilang mga kaloob
  rationale: Ang “mga kaloob” ay dignificado at malapit sa pangunahing kahulugan ng δῶρα bilang mga handog o regalong ibinibigay.
- source_word: πλουσίους
  choice: ang mayayamang
  rationale: Natural na paggamit ng pang-uri bilang pangngalan sa Tagalog at malinaw na tumutukoy sa mayayamang taong nakita ni Jesus.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “naghuhulog” bilang karaniwang pananalita sa konteksto ng salaping handog, habang pinanatili sa talababa ang saklaw ng kahulugan ng γαζοφυλάκιον.
