base_translation:
  language: en
  yaml_path: translation/nt/luke/021/020.yaml
  text: But when you see Jerusalem surrounded by armies[b][a], then know that her desolation has drawn near.
translation:
  language: tl
  text: Ngunit kapag makita ninyong napaliligiran ng mga hukbo[a] ang Jerusalem, alamin ninyo na nalalapit na ang pagkatiwangwang nito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kampo ng militar.” Ang salitang Griyego ay maaaring tumukoy sa mga kampo o sa mga hukbong nakakampo; dito, tumutukoy ito sa mga puwersang kumukubkob sa Jerusalem.
    reason: lexical_alternative
  - marker: b
    text: Ang “pagkatiwangwang” ay umaalingawngaw sa wikang propetiko tungkol sa paghatol. Ihambing ang kaugnay na pananalita sa Mateo 24:15 at Marcos 13:14.
    reason: cross_reference
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: Ngunit kapag
  rationale: Ipinahihiwatig ng δὲ ang banayad na paglipat o pagsalungat, at ng ὅταν ang isang pangyayaring inaasahan sa hinaharap. Natural sa Filipino ang “Ngunit kapag” sa babalang ito.
- source_word: ἴδητε
  choice: nakita ninyo
  rationale: Ang anyong subjunctive pagkatapos ng ὅταν ay likas na naipapahayag sa Filipino sa pariralang “kapag nakita ninyo.”
- source_word: κυκλουμένην
  choice: napaliligiran
  rationale: Inilalarawan ng present passive participle ang kalagayan ng Jerusalem bilang napalilibutan o kinukubkob. Malinaw at natural ang “napaliligiran.”
- source_word: ὑπὸ στρατοπέδων
  choice: ng mga hukbo
  rationale: Maaaring tumukoy ang στρατόπεδον sa kampo ng militar o sa hukbong nakakampo. Sa konteksto ng pagkubkob, malinaw na ipinahahayag ng “mga hukbo” ang tinutukoy, habang inilalagay sa talababa ang leksikal na alternatibo.
- source_word: Ἰερουσαλήμ
  choice: Jerusalem
  rationale: Ginamit ang nakagawiang modernong anyo ng pangalan ng lungsod sa Filipino.
- source_word: τότε γνῶτε
  choice: alamin ninyo
  rationale: Ang γνῶτε ay aorist imperative na nag-uutos na kilalanin ang kahulugan ng nakitang tanda. Pinananatili ng “alamin ninyo” ang tuwirang lakas ng utos.
- source_word: ἤγγικεν
  choice: nalalapit na
  rationale: Ipinahihiwatig ng perfect form ang paglapit na humantong sa kasalukuyang pagiging malapit. Natural na naihahatid ito sa Filipino ng “nalalapit na.”
- source_word: ἡ ἐρήμωσις αὐτῆς
  choice: ang pagkawasak nito
  rationale: Maaaring mangahulugan ang ἐρήμωσις ng pagwasak o pag-iwang tiwangwang. Ang “pagkawasak” ay malinaw sa ordinaryong mambabasa at pinananatili sa talababa ang ugnay nito sa wikang propetiko tungkol sa paghatol. Ang “nito” ay natural na tumutukoy sa Jerusalem nang hindi ginagawang pambabae ang lungsod sa Filipino.
theological_decisions:
- issue: Ang kahulugan ng nalalapit na paghatol sa Jerusalem
  choice: Isinalin bilang “pagkawasak” nang hindi itinatali sa isang tiyak na mas malawak na balangkas ng eskatolohiya.
  alternative: Gamitin ang “pagkatiwangwang” o tahasang iugnay sa “kasuklam-suklam na sanhi ng pagkatiwangwang.”
  rationale: Ang talata mismo ay nagsasabing nalalapit na ang ἐρήμωσις ng Jerusalem kapag napaliligiran na ito ng mga hukbo. Hindi nito tahasang tinutukoy ang lahat ng detalye ng kaugnay na mga hulang propetiko, kaya hindi iyon idinagdag sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang pangmaramihang “ninyo” upang katawanin ang ikalawang panauhang maramihan ng Griyego. Iniwasan ang sobrang teknikal o denominasyonal na pananalita.
