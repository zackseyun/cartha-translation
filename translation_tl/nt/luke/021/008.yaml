  source_fidelity: 'Tumpak ang pangunahing diwa: babala laban sa pagkaligaw, pagdating ng marami na may kaugnayan sa pangalan ni Jesus, ang dalawang huwad na pahayag, at utos na huwag silang sundan. Ang “Ako nga iyon” ay angkop na pagsasalin ng eliptikong Ἐγώ εἰμι at hindi tahasang nagdaragdag ng “Mesiyas.”'
  naturalness: Natural at malinaw sa pangkalahatan ang modernong Tagalog ng talata. Gayunman, hindi likas at hindi kumpleto ang pariralang “ng isang huwad na nagpapakilala” sa talababa; kailangan nitong tukuyin na ang tao ay huwad na nag-aangkin o huwad na nagpapakilalang siya ang hinihintay.
  terminology: Ang “takdang panahon” ay mabuting salin ng καιρός sa kontekstong ito. Ang “sa pangalan ko” ay katanggap-tanggap na biblikal na idyoma para sa ἐπὶ τῷ ὀνόματί μου. Pinananatili ng “iyon” ang di-tahasang pagkakakilanlan ng Griyego.
