  text: ὁ δὲ εἶπεν· Βλέπετε μὴ πλανηθῆτε· πολλοὶ γὰρ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου ⸀λέγοντες· Ἐγώ εἰμι καί· Ὁ καιρὸς ἤγγικεν· ⸀μὴ πορευθῆτε ὀπίσω αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/008.yaml
  text: And he said[a], “See that you are not led astray. For many will come in my name, saying, ‘I am he,’ and, ‘The time has drawn near.’ Do not go after them.”
translation:
  language: tl
  text: Sinabi niya, “Mag-ingat kayo upang hindi kayo mailigaw. Sapagkat marami ang darating sa pangalan ko at magsasabi, ‘Ako nga iyon,’[a] at, ‘Malapit na ang takdang panahon.’ Huwag kayong sumunod sa kanila.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ako nga.” Ibig sabihin, huwad na inaangkin ng nagsasalita na siya ang hinihintay na iyon, marahil ang Mesiyas.
    reason: alternative_reading
lexical_decisions:
- source_word: Βλέπετε μὴ πλανηθῆτε
  choice: Mag-ingat kayo upang hindi kayo mailigaw
  rationale: Ang προστακτική na Βλέπετε ay panawagan sa pagbabantay, at ang pasibong πλανηθῆτε ay nagpapahiwatig ng pagkaligaw dahil sa panlilinlang ng iba. Likas sa modernong Tagalog ang kabuuang parirala.
- source_word: ἐλεύσονται ἐπὶ τῷ ὀνόματί μου
  choice: darating sa pangalan ko
  rationale: Pinananatili ang karaniwang biblikal na idyoma para sa pagdating na nag-aangkin ng awtoridad o pagkakakilanlan ni Jesus.
- source_word: λέγοντες
  choice: magsasabi
  rationale: Tuwirang inilalahad ang nilalaman ng mapanlinlang na pag-aangkin nang hindi muna ito binibigyang-kahulugan sa pandiwa.
- source_word: Ἐγώ εἰμι
  choice: Ako nga iyon
  rationale: Ipinahihiwatig ng konteksto ang pagkilalang 'ako ang tinutukoy o hinihintay' ngunit hindi tahasang idinaragdag ang 'Mesiyas,' na wala sa Griyego. Ang 'nga' ay nagbibigay-diin sa ἐγώ.
- source_word: Ὁ καιρὸς ἤγγικεν
  choice: Malapit na ang takdang panahon
  rationale: Ipinakikita ng καιρός ang mahalaga o itinakdang panahon, at ng perpektong ἤγγικεν ang kasalukuyang kalapitan nito. Mas natural ito sa Tagalog kaysa sa literal na 'lumapit na.'
- source_word: μὴ πορευθῆτε ὀπίσω αὐτῶν
  choice: Huwag kayong sumunod sa kanila
  rationale: Malinaw na ipinagbabawal ang pagsama o pagsunod sa mga mapanlinlang na nag-aangkin; likas sa Tagalog ang 'sumunod' at taglay pa rin nito ang diwa ng paglakad sa likuran.
theological_decisions:
- issue: Kahulugan ng Ἐγώ εἰμι sa bibig ng mga huwad na nag-aangkin
  choice: Ako nga iyon
  alternative: Ako nga; o Ako ang Mesiyas
  rationale: Pinananatili ng salin ang eliptikong pag-aangkin ng Griyego nang hindi ito ginagawang tahasang 'Ako ang Mesiyas.' Ipinapaliwanag sa talababa ang posibleng kahulugan habang pinananatili ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang pangmaramihang 'kayo' ayon sa mga pandiwang pangmaramihan sa Griyego; iniwasan ang sobrang teknikal o makalumang pananalita.
