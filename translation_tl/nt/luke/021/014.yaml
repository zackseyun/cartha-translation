translation:
  language: tl
  text: Kaya, ipasiya ninyo sa inyong mga puso na huwag ninyong paghandaan nang patiuna ang pagtatanggol ninyo sa inyong sarili.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “na huwag ninyong ensayuhin nang patiuna ang inyong pagtatanggol sa sarili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θέτε
  choice: ipasiya ninyo
  rationale: Ang aorist imperative ng τίθημι, kasama ng pariralang “sa inyong mga puso,” ay idyomatikong tumutukoy sa matatag na panloob na pagpapasiya. Natural at malinaw sa modernong Tagalog ang “ipasiya ninyo.”
- source_word: οὖν
  choice: Kaya
  rationale: Ipinakikita ang kongklusyon o bunga mula sa naunang sinabi. Mas natural sa kasalukuyang Tagalog ang “Kaya” kaysa “Samakatuwid” habang pinananatili ang lohikal na ugnayan.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: sa inyong mga puso
  rationale: Pinananatili ang maramihang anyo at ang biblikal na idyoma ng puso bilang kalooban at sentro ng panloob na pagpapasiya.
- source_word: μὴ προμελετᾶν
  choice: na huwag paghandaan nang patiuna
  rationale: Ipinahahayag ng προμελετᾶν ang maagang pag-iisip, paghahanda, o pag-eensayo. Ang “paghandaan nang patiuna” ay malinaw at hindi nililimitahan ang diwa sa pagsasaulo lamang.
- source_word: ἀπολογηθῆναι
  choice: kung paano ninyo ipagtatanggol ang inyong sarili
  rationale: Tumutukoy ang pandiwa sa pagbibigay ng sagot o pagtatanggol, madalas sa pormal o legal na kalagayan. Inililitaw ng pariralang ito ang nilalayong pagtatanggol sa sarili at maayos itong nakakabit sa “paghandaan.”
theological_decisions:
- issue: Saklaw ng utos laban sa paunang paghahanda
  choice: Isinalin bilang pagbabawal sa paunang paghahanda ng paraan ng pagtatanggol sa kontekstong ito.
  alternative: Maaaring unawain bilang pangkalahatang pagbabawal sa lahat ng paghahanda para sa pagsasalita.
  rationale: Ang ἀπολογηθῆναι at ang konteksto ng pag-uusig at pagharap sa mga awtoridad ay tumutukoy sa paghahanda ng depensa, hindi kinakailangang sa lahat ng uri ng pag-aaral o paghahanda.
translation_notes:
  register: Modernong Filipino Tagalog na may dignidad at likas na daloy. Pinanatili ang idyomang “sa inyong mga puso,” ngunit ginamit ang karaniwang “ipasiya” upang maging malinaw ang panloob na pagtatalaga. Ang marker na [a] ay inilagay pagkatapos ng buong sugnay na tinutukoy nito.
