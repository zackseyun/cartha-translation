id: LUK.21.27
reference: Luke 21:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ τότε ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐν νεφέλῃ μετὰ δυνάμεως καὶ δόξης πολλῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/027.yaml
  text: And then they will see the Son of Man coming in a cloud with power and great glory[a].
translation:
  language: tl
  text: At pagkatapos, makikita nila ang Anak ng Tao na dumarating sa isang ulap, taglay ang kapangyarihan at dakilang kaluwalhatian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa ibabaw ng isang ulap.” Isahan ang “ulap” sa Griyego, at maaaring tumukoy ang parirala sa pagdating na nasa ulap o nasa ibabaw nito. Umaalingawngaw rito ang Daniel 7 at ang mga kaugnay na talata tungkol sa pagdating ng Anak ng Tao kasama ng mga ulap.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄψονται
  choice: makikita nila
  rationale: Likas at tuwirang ipinapahayag ng anyong panghinaharap ang aktuwal na pagkakita, nang hindi nagdaragdag ng matayog o interpretibong himig.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Ito ang kinikilalang salin ng titulong ginagamit para kay Jesus at pinananatili nito ang kaugnayan sa Daniel 7.
- source_word: ἐρχόμενον
  choice: na dumarating
  rationale: Pinananatili ng pariralang ito ang kilos na nakikitang nagaganap at ang karaniwang diwa ng pandiwari sa kontekstong ito.
- source_word: ἐν νεφέλῃ
  choice: sa isang ulap
  rationale: Isahan ang νεφέλῃ, at natural na naihahatid ng Tagalog na “sa” ang ugnayang ipinapahayag ng ἐν nang hindi sapilitang nilulutas kung ito ay “nasa loob” o “nasa ibabaw” ng ulap.
- source_word: μετὰ δυνάμεως
  choice: taglay ang kapangyarihan
  rationale: Malinaw at likas sa Tagalog ang “taglay ang” para sa kasamang katangian o kalagayan na ipinahihiwatig ng μετά na may henitibo.
- source_word: δόξης πολλῆς
  choice: dakilang kaluwalhatian
  rationale: Ang “dakila” ang natural at marangal na katumbas ng πολλῆς kapag inilalarawan ang kaluwalhatian.
theological_decisions:
- issue: Pagsasalin sa kristolohikal na titulong τὸν υἱὸν τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  alternative: ang Taong Anak / ang Isang Tao
  rationale: Pinananatili ng “Anak ng Tao” ang kinikilalang titulo at ang alusyon sa Daniel 7, nang hindi binabawasan ito tungo sa isang pangkalahatang katawagan lamang sa tao.
- issue: Larawan ng ulap at ang kaugnayan nito sa Daniel at sa pagpapakita ng Diyos
  choice: sa isang ulap
  alternative: sa ibabaw ng isang ulap / kasama ng mga ulap
  rationale: Sinusunod nito ang isahang νεφέλῃ ni Lucas at hindi ito itinutugma sa maramihang anyo ng ibang kaugnay na talata. Hinahayaan din nitong manatili ang tunay na lawak ng kahulugan ng ἐν.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang titulong “Anak ng Tao,” habang iniwasan ang sobrang lumang pananalita. Ang “sa isang ulap” ay natural sa Tagalog at pinananatili ang isahan at ang posibleng saklaw ng Griyegong parirala.
