base_translation:
  language: en
  yaml_path: translation/nt/luke/021/006.yaml
  text: As for these things that you are looking at[b][a], days will come in which not one stone will be left upon another that will not be torn down.
translation:
  language: tl
  text: “Kung tungkol sa mga bagay na ito na pinagmamasdan ninyo,[a] darating ang mga araw na walang batong maiiwan na nakapatong sa isa pang bato na hindi gigibain.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nakikita ninyo.” Ang pandiwa ay maaaring tumukoy sa karaniwang pagkakita o sa mas sadyang pagmamasid.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “walang batong maiiwan sa ibabaw ng bato na hindi gigibain”—isang idyomang nagsasaad ng lubusang pagkawasak.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα ἃ θεωρεῖτε
  choice: Kung tungkol sa mga bagay na ito na pinagmamasdan ninyo
  rationale: Ipinapakita ng “kung tungkol sa” ang diin sa nakaharap na Ταῦτα, habang pinananatili ng “pinagmamasdan” ang tuloy-tuloy at sadyang pagtingin na maaaring ipahiwatig ng θεωρεῖτε.
- source_word: ἐλεύσονται ἡμέραι
  choice: darating ang mga araw
  rationale: Natural na katumbas ito ng karaniwang pahayag sa Griyego tungkol sa mga pangyayaring magaganap sa hinaharap.
- source_word: ἐν αἷς
  choice: na
  rationale: Sa Filipino, likas na naipapahayag ng sugnay na “darating ang mga araw na” ang temporal na diwa ng “sa mga araw na iyon,” nang hindi nagiging mabigat ang pangungusap.
- source_word: οὐκ ἀφεθήσεται
  choice: walang maiiwan
  rationale: Tumpak at natural nitong ipinapahayag ang pasibong hinaharap na nangangahulugang walang mananatili sa dating kinalalagyan.
- source_word: λίθος ἐπὶ λίθῳ
  choice: magkapatong na bato
  rationale: Natural na idyomang Filipino ito para sa batong nananatili sa ibabaw ng isa pang bato sa isang gusali.
- source_word: ὃς οὐ καταλυθήσεται
  choice: gigibain ang lahat
  rationale: 'Ipinapahayag nito ang kabuuang puwersa ng kaugnay na sugnay: walang batong magkapatong ang maliligtas sa paggiba. Ang “gigibain” ay angkop sa pagbuwag ng isang estruktura.'
theological_decisions:
- issue: Saklaw at puwersa ng hula ni Jesus tungkol sa mga gusali ng templo
  choice: Ihayag ito bilang kongkretong hula ng lubusang pagkawasak ng estruktura, nang walang idinaragdag na tiyak na sistemang eskatolohikal.
  alternative: Ituring ito bilang pangunahing simbolikong pahayag ng paghatol o iugnay sa isang partikular na balangkas ng teolohiya.
  rationale: Tahasang inilalarawan ng Griyego ang nakikitang mga estruktura na lubusang gigibain. Pinananatili ng salin ang kongkretong diwang iyon nang hindi lumalampas sa sinasabi ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pinagmamasdan” upang mapanatili ang visual at duratibong diwa, at “gigibain ang lahat” upang maging natural sa Filipino habang inililinaw ang kabuuang puwersa ng Griyegong pahayag.
