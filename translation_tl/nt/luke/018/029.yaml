reference: Luke 18:29
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι οὐδείς ἐστιν ὃς ἀφῆκεν οἰκίαν ἢ ⸂γυναῖκα ἢ ἀδελφοὺς ἢ γονεῖς⸃ ἢ τέκνα ἕνεκεν τῆς βασιλείας τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/029.yaml
  text: And he said to them, “Truly I say to you, there is no one who has left a house or wife or brothers or parents or children for the sake of the kingdom of God,”
translation:
  language: tl
  text: 'Sinabi niya sa kanila, “Tinitiyak ko sa inyo: walang sinumang nag-iwan ng bahay, asawa, mga kapatid, mga magulang, o mga anak alang-alang sa kaharian ng Diyos,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Tinitiyak ko sa inyo
  rationale: Natural at mariing pormula sa modernong Tagalog na naghahatid ng awtoritatibong katiyakan ng sinabi ni Jesus.
- source_word: ἀφῆκεν
  choice: nag-iwan
  rationale: Pinananatili ang payak at malawak na diwa ng pag-iwan nang hindi ipinapalagay kung pansamantala o permanente.
- source_word: οἰκίαν
  choice: bahay
  rationale: Karaniwang katumbas ng tirahan sa kontekstong ito; hindi kailangang palawakin bilang sambahayan.
- source_word: ἕνεκεν τῆς βασιλείας τοῦ θεοῦ
  choice: alang-alang sa kaharian ng Diyos
  rationale: Dignified at natural na pagpapahayag ng dahilan o layunin, habang pinananatili ang pangunahing terminong teolohikal.
theological_decisions:
- issue: Lakas ng pambungad na Ἀμήν
  choice: Tinitiyak ko sa inyo
  alternative: Katotohanang sinasabi ko sa inyo
  rationale: Iniiwasan ang hindi natural na literalismo ngunit pinananatili ang taimtim at awtoritatibong pagtiyak.
- issue: Saklaw ng pangakong nagsisimula sa οὐδείς ἐστιν ὃς
  choice: walang sinumang nag-iwan
  alternative: walang sinumang umiwan
  rationale: Hindi nilulutas sa talatang ito ang uri, tagal, o etikal na mga kalagayan ng pag-iwan; ang salin ay nananatiling malapit sa pahayag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Pinanatili ang kuwit sa hulihan dahil nagpapatuloy ang pangungusap sa kasunod na talata.
