  text: Ἄνθρωποι δύο ἀνέβησαν εἰς τὸ ἱερὸν προσεύξασθαι, ⸀ὁ εἷς Φαρισαῖος καὶ ὁ ἕτερος τελώνης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/010.yaml
  text: Two men went up into the temple to pray[a], one a Pharisee and the other a tax collector.
translation:
  language: tl
  text: 'Dalawang lalaki ang umakyat sa templo[a] upang manalangin: ang isa ay Fariseo at ang isa naman ay maniningil ng buwis.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griego na ἱερόν ay tumutukoy sa buong kompleks o bakuran ng templo, hindi lamang sa panloob na santuwaryo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνθρωποι δύο
  choice: Dalawang lalaki
  rationale: Bagaman maaaring tumukoy ang ἄνθρωποι sa mga tao sa pangkalahatan, ipinakikilala ng kasunod na mga panlalaking anyo ang dalawang lalaking indibidwal. Likas at tumpak sa kasarian ang “dalawang lalaki.”
- source_word: ἀνέβησαν
  choice: umakyat
  rationale: Pinananatili ng “umakyat” ang literal na diwa ng ἀναβαίνω at ang karaniwang paglalarawan sa pagpunta sa Jerusalem at sa templo.
- source_word: εἰς τὸ ἱερόν
  choice: sa templo
  rationale: Sa Filipino, natural na ipinahahayag ng “umakyat sa templo” ang pagpunta at pagpasok sa lugar. Ang ἱερόν ay tumutukoy sa buong bakuran o kompleks ng templo, hindi lamang sa santuwaryo sa loob; nililinaw ito sa talababa.
- source_word: προσεύξασθαι
  choice: upang manalangin
  rationale: Ipinahahayag ng pawatas ang layunin. Malinaw at marangal na katumbas ang “upang manalangin.”
- source_word: ὁ εἷς ... ὁ ἕτερος
  choice: ang isa ... ang isa naman
  rationale: Natural sa modernong Tagalog ang pares na ito at malinaw nitong ipinakikita ang paghahambing sa dalawang tao.
- source_word: Φαρισαῖος
  choice: Pariseo
  rationale: Ito ang nakagawiang anyong Filipino para sa pangkat na ito sa Judaismo.
- source_word: τελώνης
  choice: maniningil ng buwis
  rationale: Malinaw sa mga modernong mambabasa ang katawagang ito at nasasaklaw nito ang tungkuling ipinahihiwatig ng τελώνης bilang tagasingil ng buwis o bayarin.
theological_decisions:
- issue: Pagkilala sa ἱερόν bilang naiiba sa ναός
  choice: templo, na may talababa tungkol sa buong kompleks o bakuran
  alternative: bakuran ng templo
  rationale: 'Pinananatili ng “templo” ang pamilyar at natural na pananalita, samantalang ang talababa ay nag-iingat sa mahalagang pagkakaibang leksikal: ang ἱερόν ay hindi partikular na tumutukoy sa panloob na santuwaryo.'
- issue: Kasarian sa ἄνθρωποι
  choice: dalawang lalaki
  alternative: dalawang tao
  rationale: Bagaman maaaring pangkalahatan ang ἄνθρωποι, ang agarang konteksto at mga panlalaking pagtukoy ay naglalarawan ng dalawang lalaking tauhan. Hindi pinapantay sa neutral na katawagan ang detalyeng ito.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “manalangin” sa halip na mas kolokyal na “magdasal,” at “maniningil ng buwis” bilang madaling maunawaang makabagong katawagan. Inilagay ang talababa kaagad pagkatapos ng “manalangin” ayon sa ibinigay na pagmamarka, bagaman ang paliwanag nito ay tungkol sa “templo.”
