  text: Then those who heard it said, “And who can be saved?”
translation:
  language: tl
  text: Sinabi naman ng mga nakarinig, “At sino ang maaaring maligtas?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπαν
  choice: Sinabi
  rationale: Ang aorist indicative ay likas na isinasalin bilang payak na nagdaang kilos sa salaysay.
- source_word: δὲ
  choice: (hindi hiwalay na isinalin)
  rationale: Ang mahinang pang-ugnay na δέ ay nagsasaad ng pagpapatuloy o paglipat sa salaysay; sapat na itong naipahihiwatig ng ayos ng pangungusap sa natural na Tagalog.
- source_word: οἱ ἀκούσαντες
  choice: ng mga nakarinig
  rationale: Ang substantival aorist participle ay tumutukoy sa mga taong nakarinig sa naunang sinabi ni Jesus. Hindi kailangang idagdag ang tahasang layon sa Tagalog dahil malinaw ito sa konteksto.
- source_word: Καὶ
  choice: Kung gayon
  rationale: Sa tanong, ang καί ay nag-uugnay sa pagkabigla ng mga nakarinig sa naunang pahayag. Ang “Kung gayon” ang natural na Tagalog na nagpapahayag ng resultang tanong nang hindi binabago ang diwa.
- source_word: τίς
  choice: sino
  rationale: Tuwirang katumbas ng panghalip na patanong tungkol sa kung sinong tao ang maaaring maligtas.
- source_word: δύναται
  choice: (ipinahihiwatig sa anyong “maliligtas”)
  rationale: Ang kakayahan o posibilidad na ipinahahayag ng δύναται ay natural na naihahatid sa Tagalog ng tanong na “sino ang maliligtas?”; ang “sino ang maaaring maligtas?” ay mas pormal ngunit posibleng alternatibo.
- source_word: σωθῆναι
  choice: maliligtas
  rationale: Sa konteksto ng pagpasok sa kaharian ng Diyos, ang pandiwa ay tumutukoy sa kaligtasan, hindi lamang sa pisikal na pagsagip. Ang anyong Tagalog ay natural na naghahatid ng pasibong diwa.
theological_decisions:
- issue: Kahulugan ng σωθῆναι sa konteksto
  choice: maliligtas sa teolohikal na diwa
  alternative: masasagip o maililigtas mula sa panganib
  rationale: Ang nakapaligid na usapan ay tungkol sa pagpasok sa kaharian ng Diyos at sa hirap na kaugnay nito, kaya ang pangunahing diwa ay kaligtasan. Hindi dinagdagan ang talata ng paliwanag tungkol sa paraan o saklaw ng kaligtasang iyon.
translation_notes:
  register: Modernong Filipino Tagalog na natural, maikli, at marangal. Ginamit ang “Kung gayon” upang maipahayag ang biglang resultang tanong; iniwasan ang mas kahoy na “At sino ang maaaring maligtas?”
