  text: χήρα δὲ ἦν ἐν τῇ πόλει ἐκείνῃ καὶ ἤρχετο πρὸς αὐτὸν λέγουσα· Ἐκδίκησόν με ἀπὸ τοῦ ἀντιδίκου μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/003.yaml
  text: And there was a widow in that city[a], and she kept coming to him, saying, ‘Give me justice against my adversary.’
translation:
  language: tl
  text: May isang biyuda sa lungsod na iyon na paulit-ulit na lumalapit sa kanya at nagsasabi, “Bigyan mo ako ng katarungan laban sa aking katunggali.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Ipagtanggol mo ang aking karapatan laban sa aking katunggali” o “Bigyan mo ako ng katarungan mula sa aking katunggali.” Ang pandiwang Griyego ay maaaring tumukoy sa pagtiyak o pagbibigay ng legal na katarungan para sa isang tao, hindi kinakailangang sa personal na paghihiganti.
    reason: lexical_alternative
lexical_decisions:
- source_word: χήρα
  choice: biyuda
  rationale: Karaniwan at tiyak na salin para sa babaeng namatayan ng asawa; pinananatili rin nito ang mahalagang kalagayang panlipunan ng tauhan sa talinghaga.
- source_word: δὲ
  choice: May
  rationale: Ang δὲ ay nag-uugnay at nagpapatuloy sa salaysay. Sa natural na Filipino, sapat nang ipahayag ang eksistensiyal na sugnay bilang “May isang…” nang hindi pilit na isinasalin ang partikula nang hiwalay.
- source_word: ἦν
  choice: May isang
  rationale: Eksistensiyal ang gamit ng εἰμί; ang “May isang” ang natural na katumbas sa Filipino.
- source_word: ἐν τῇ πόλει ἐκείνῃ
  choice: sa lungsod na iyon
  rationale: Tuwirang salin na pinananatili ang pagtukoy sa πόλις bilang lungsod at ang demonstratibong ἐκείνῃ.
- source_word: ἤρχετο
  choice: paulit-ulit na lumalapit
  rationale: Ipinahihiwatig ng imperfect sa konteksto ang paulit-ulit o nakaugaliang paglapit, na mahalaga sa diin ng talinghaga sa pagpupursigi.
- source_word: πρὸς αὐτόν
  choice: sa kanya
  rationale: Sa pandiwa ng paggalaw, ipinapahayag ng πρός ang paglapit sa isang tao; natural itong isinasama sa “lumalapit sa kanya.”
- source_word: λέγουσα
  choice: at nagsasabi
  rationale: Ang present participle ay nagpapahayag ng kasabay na pananalita sa bawat paglapit; malinaw at natural sa Filipino ang koordinasyong ito.
- source_word: Ἐκδίκησόν με
  choice: Ibigay mo sa akin ang katarungan
  rationale: Sa kontekstong panghukuman, ang ἐκδικέω ay tumutukoy sa pagtiyak ng katarungan o legal na pagbibigay-katwiran, hindi kinakailangang personal na paghihiganti.
- source_word: ἀπὸ τοῦ ἀντιδίκου μου
  choice: laban sa aking kalaban
  rationale: Ang ἀντίδικος ay legal na katunggali o kalaban. Ang “laban sa aking kalaban” ay malinaw sa ordinaryong mambabasa at akma sa pakiusap para sa katarungan.
theological_decisions:
- issue: Kung ang pakiusap ay paghihiganti o legal na katarungan
  choice: Isinalin bilang pakiusap na ipagkaloob ang katarungan laban sa legal na kalaban.
  alternative: “Ipaghiganti mo ako sa aking kalaban” o “Bigyan mo ako ng katarungan mula sa aking katunggali.”
  rationale: Ang konteksto ay pagharap sa isang hukom, kaya legal na katarungan o pagbibigay-katwiran ang pangunahing diwa. Gayunman, hindi ganap na inaalis ang mas malawak na saklaw ng pandiwa; inilalahad ito sa talababa.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang “biyuda,” “lungsod,” at “katarungan” bilang mga salitang malawak na nauunawaan. Ang “paulit-ulit na lumalapit” ay tahasang nagpapakita ng tuloy-tuloy na pagkilos na ipinahihiwatig ng imperfect.
