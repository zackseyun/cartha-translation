  text: εἶπεν δὲ ὁ κύριος· Ἀκούσατε τί ὁ κριτὴς τῆς ἀδικίας λέγει·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/006.yaml
  text: And the Lord said[a], “Hear what the unrighteous judge says.”
translation:
  language: tl
  text: At sinabi ng Panginoon, “Pakinggan ninyo ang sinasabi ng di-makatarungang hukom.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν
  choice: sinabi
  rationale: Ang aorist ng λέγω ay likas na isinasalin bilang payak na nagdaang kilos sa pagsasalaysay.
- source_word: δὲ
  choice: At
  rationale: Nagpapatuloy ito sa naunang salaysay nang hindi nagdaragdag ng tiyak na temporal na kahulugan.
- source_word: ὁ κύριος
  choice: ang Panginoon
  rationale: Tumutukoy ito kay Jesus at pinananatili ang bigat ng titulong κύριος.
- source_word: Ἀκούσατε
  choice: Pakinggan ninyo
  rationale: Likas na modernong Tagalog na pautos ito para sa masusing pakikinig sa susunod na sasabihin.
- source_word: τί
  choice: ang sinasabi
  rationale: Ipinahahayag ng τί ang nilalaman ng sinasabi, hindi ang paraan ng pagsasalita.
- source_word: ὁ κριτὴς
  choice: ang hukom
  rationale: Tuwirang salin ito at tumutukoy pabalik sa hukom sa talinghaga.
- source_word: τῆς ἀδικίας
  choice: di-makatarungan
  rationale: Ang kwalitatibong genitive na literal na 'ng kawalang-katarungan' ay natural na naipahahayag sa Tagalog bilang paglalarawan sa hukom.
- source_word: λέγει
  choice: sinasabi
  rationale: Pinananatili ng aspektong imperpektibo ng present tense ang kasalukuyan at malinaw na pagtuon sa nilalaman ng sinabi ng hukom.
theological_decisions:
- issue: Pagsasalin ng κύριος bilang titulo ni Jesus
  choice: ang Panginoon
  alternative: ang panginoon / ang amo
  rationale: Pinananatili ng “Panginoon” ang titular at kristolohikal na bigat ng salita sa salaysay ni Lucas nang hindi nagdaragdag ng doktrinang wala sa teksto.
- issue: Paglalarawan sa hukom sa pariralang ὁ κριτὴς τῆς ἀδικίας
  choice: di-makatarungang hukom
  alternative: masamang hukom / hukom ng kawalang-katarungan
  rationale: Ipinahahayag nito ang moral at hudisyal na kalidad ng ἀδικία sa natural na Tagalog, habang iniiwasan ang mas malawak at maaaring sobrang interpretatibong “masama.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “Pakinggan ninyo” bilang natural na maramihang pautos at “di-makatarungan” bilang malinaw na paglalarawan sa hukom.
