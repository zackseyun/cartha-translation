  source_fidelity: 'Tumpak ang salin sa Griyego: ang δέ ay naipakita sa “At,” ang ὁ κύριος bilang “ang Panginoon,” ang maramihang pautos na Ἀκούσατε bilang “Pakinggan ninyo,” at ang nilalaman ng τί ... λέγει bilang “ang sinasabi ...”. Ang “di-makatarungang hukom” ay wastong natural na katumbas ng kwalitatibong pariralang ὁ κριτὴς τῆς ἀδικίας, nang hindi nililimitahan ang ἀδικία sa teknikal na legal na kawalang-katarungan lamang.'
  naturalness: Natural, malinaw, at angkop sa modernong Filipino Tagalog ang “At sinabi ng Panginoon, ‘Pakinggan ninyo ang sinasabi ng di-makatarungang hukom.’” Ang “di-makatarungang” ay katanggap-tanggap na baybay at ang rehistro ay marangal ngunit madaling maunawaan.
  terminology: Wastong pinananatili ang “Panginoon” bilang titulo para kay Jesus. Ang “hukom” at “di-makatarungan” ay angkop na mga terminong pampanitikan at hudisyal. Walang kinakailangang talababa; hindi naman ipinipilit ng Tagalog na ilantad ang literal na genitive na “hukom ng kawalang-katarungan.”
