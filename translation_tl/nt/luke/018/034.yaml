  text: καὶ αὐτοὶ οὐδὲν τούτων συνῆκαν, καὶ ἦν τὸ ῥῆμα τοῦτο κεκρυμμένον ἀπ’ αὐτῶν, καὶ οὐκ ἐγίνωσκον τὰ λεγόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/034.yaml
  text: And they understood none of these things[a], and this saying was hidden from them[c][b], and they did not understand the things being said.
translation:
  language: tl
  text: At wala silang naunawaan sa mga bagay na ito. Ang pananalitang ito[a] ay nakatago sa kanila,[b] at hindi nila nauunawaan ang mga sinasabi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “salitang ito” o “mensaheng ito.”
    reason: lexical_alternative
  - marker: b
    text: Hindi sinasabi ng anyong pasibo na “ay nakatago sa kanila” kung sino o ano ang nagtago nito.
    reason: alternative_reading
  - marker: c
    text: O, “ang sinasabi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆκαν
  choice: naunawaan
  rationale: Ipinahahayag ng συνίημι ang pag-unawa sa mga naunang sinabi ni Jesus. Likas sa Filipino ang “naunawaan” at pinananatili nito ang aspektong tumutukoy sa kabuuang kabiguan nilang makaunawa.
- source_word: οὐδὲν τούτων
  choice: wala ... sa mga bagay na ito
  rationale: Tumutukoy ang parirala sa maraming pahayag na nauna rito. Pinananatili ng “mga bagay na ito” ang maramihang sanggunian.
- source_word: τὸ ῥῆμα τοῦτο
  choice: ang pananalitang ito
  rationale: Maaaring tumukoy ang ῥῆμα sa salita, pahayag, o mensahe. Ang “pananalita” ay natural sa kontekstong ito at hindi nililimitahan ang tinutukoy sa isang salita lamang.
- source_word: κεκρυμμένον ἀπ’ αὐτῶν
  choice: ay nakatago sa kanila
  rationale: Pinananatili nito ang resultang kalagayang ipinahahayag ng periphrastic perfect passive at hindi tinutukoy kung sino o ano ang nagtago nito.
- source_word: ἐγίνωσκον
  choice: nauunawaan
  rationale: Bagaman karaniwang may diwang “nalalaman” ang γινώσκω, sa kontekstong ito ay tumutukoy ito sa pagkilala o pag-unawa sa kahulugan ng sinabi. Ang imperpektibong “nauunawaan” ay nagpapahiwatig ng nagpapatuloy na kawalan ng pagkaunawa.
- source_word: τὰ λεγόμενα
  choice: ang mga sinasabi
  rationale: Pinananatili ng “mga sinasabi” ang maramihang anyo at ang nagpapatuloy na aspekto ng present passive participle.
theological_decisions:
- issue: Kung sino o ano ang nagtago ng pananalita sa mga alagad
  choice: Panatilihin ang pasibong “ay nakatago sa kanila” nang walang binabanggit na gumagawa.
  alternative: Sabihing Diyos ang nagtago nito, o ipaliwanag itong bunga lamang ng kanilang sikolohikal na pagkalito.
  rationale: Hindi pinangalanan ng Griyegong teksto ang gumagawa ng pagkukubli. Pinananatili ng salin ang tunay na teolohikal at pasalaysay na pag-igting sa halip na lutasin ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pananalita” sa halip na literal na “salita” upang maging natural sa konteksto, habang inilagay sa talababa ang mas literal at iba pang posibleng kahulugan. Pinanatili ang tatlong magkakaugnay na paglalarawan ng kanilang hindi pagkaunawa.
