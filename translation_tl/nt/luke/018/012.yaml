  naturalness: Mas natural at tiyak na pang-abay ng dalas sa makabagong Filipino ang “dalawang beses bawat linggo” kaysa “dalawang beses sa isang linggo.” Ang huli ay maaari ring mangahulugang nangyari lamang dalawang beses sa loob ng isang partikular na linggo. Ang “nagbibigay ako ng ikapu mula sa lahat ng natatamo ko” ay malinaw at marangal na gamit.
  terminology: Ang “nag-aayuno,” “Sabbath,” at “ikapu” ay angkop na mga katawagang pangkasulatan sa modernong Filipino. Pinananatili ng talababa ang literal na anyo at ipinapaliwanag ang idyomatikong kahulugan nang hindi nagdaragdag ng doktrinal na pagpapakahulugan.
