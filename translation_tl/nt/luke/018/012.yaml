translation:
  language: tl
  text: Nag-aayuno ako nang dalawang beses bawat linggo[a]; nagbibigay ako ng ikapu mula sa lahat ng natatamo ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “dalawang beses ng Sabbath”; isang idyomang nangangahulugang “dalawang beses bawat linggo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νηστεύω
  choice: Nag-aayuno ako
  rationale: Ang pangkasalukuyang pandiwa ay nagsasaad dito ng nakagawiang gawain, kaya natural itong isinalin bilang regular na pag-aayuno.
- source_word: δὶς
  choice: dalawang beses
  rationale: Tuwirang katumbas ng pang-abay na nangangahulugang ‘twice.’
- source_word: τοῦ σαββάτου
  choice: sa isang linggo
  rationale: Bagaman literal na tumutukoy sa Sabbath, ginagamit ito rito bilang idyoma para sa lingguhang siklo; malinaw at natural sa Tagalog ang ‘sa isang linggo.’
- source_word: ἀποδεκατῶ
  choice: nagbibigay ako ng ikapu
  rationale: Tumpak na ipinapahayag ang pagbibigay ng isang ikasampung bahagi at mas madaling maunawaan kaysa sa bihirang pandiwang ‘nag-iikapu.’
- source_word: πάντα ὅσα
  choice: sa lahat ng
  rationale: Pinananatili ang malawak at saklaw-lahat na diwa ng parirala.
- source_word: κτῶμαι
  choice: natatamo ko
  rationale: Ipinahihiwatig ng pandiwang middle ang anumang nakukuha o nakakamit ng nagsasalita; hindi ito nililimitahan sa sahod o salapi lamang.
theological_decisions:
- issue: Kahulugan ng τοῦ σαββάτου sa pahayag tungkol sa pag-aayuno
  choice: 'idyomatikong panahong kahulugan: ‘sa isang linggo’'
  alternative: mas literal na ‘ng Sabbath’
  rationale: Ang parirala ay nagsasaad ng dalas, hindi ng pag-aayuno nang dalawang beses sa araw ng Sabbath. Iniiwasan ng idyomatikong salin ang gayong maling pagkaunawa.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang ‘nagbibigay ako ng ikapu’ para sa malinaw na pagkaunawa at ang ‘natatamo ko’ upang mapanatili ang mas malawak na saklaw kaysa ‘kinikita ko.’
