  text: ὁ δὲ ἀκούσας ταῦτα περίλυπος ⸀ἐγενήθη, ἦν γὰρ πλούσιος σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/023.yaml
  text: But when he heard these things[a], he became very sorrowful, for he was extremely rich.
translation:
  language: tl
  text: Ngunit nang marinig niya ang mga ito, labis siyang nalungkot[a], sapagkat napakayaman niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lubha siyang nabagabag.” Ang pang-uri sa Griyego ay nagpapahiwatig ng matinding lungkot o pagkabagabag.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: nang marinig niya
  rationale: Ang aorist participle ay may temporal na diwa rito at nagpapakita ng pagkakasunod ng kanyang pagkarinig at pagtugon.
- source_word: ταῦτα
  choice: ang mga ito
  rationale: Pinananatili ang maramihang demonstrative na tumutukoy sa mga naunang sinabi ni Jesus nang hindi nagdaragdag ng paliwanag sa mismong teksto.
- source_word: περίλυπος
  choice: labis ... nalungkot
  rationale: Ipinahahayag ang matinding lungkot o pagkabagabag na taglay ng pang-uri sa natural na modernong Tagalog.
- source_word: ἐγενήθη
  choice: siyang nalungkot
  rationale: Ang pandiwa ay nagpapahiwatig ng pagpasok sa isang kalagayan; ang pandiwang Tagalog na “nalungkot” ay natural na naghahatid ng pagbabagong ito.
- source_word: πλούσιος
  choice: mayaman
  rationale: Ito ang karaniwan, malinaw, at likas na katumbas sa modernong Tagalog.
- source_word: σφόδρα
  choice: napaka-
  rationale: Malakas nitong pinatitindi ang antas ng kanyang kayamanan at likas itong ipinahahayag sa “napakayaman.”
- source_word: δὲ
  choice: Ngunit
  rationale: Malinaw nitong ipinakikita ang pagsalungat ng kanyang tugon sa naunang sinabi ni Jesus.
- source_word: γὰρ
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng kanyang matinding kalungkutan sa isang marangal at natural na paraan.
