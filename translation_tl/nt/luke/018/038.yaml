  source_fidelity: Tumpak na naisasalin ang καὶ ἐβόησεν bilang “At sumigaw siya,” na naghahatid ng lakas at pagkamadalian ng pandiwa. Ang direktang pananalita ay wasto, at ang “maawa ka sa akin” ay natural na katumbas ng ἐλέησόν με. Hindi kailangang hiwalay na isalin ang λέγων sapagkat likas sa Filipino na ipakilala ang direktang sipi matapos ang “sumigaw.”
  naturalness: Makabago, malinaw, at marangal ang Filipino. Natural ang ayos na “At sumigaw siya, ‘Jesus, Anak ni David, maawa ka sa akin!’” at hindi ito mabigat o artipisyal.
  terminology: Ang “Anak ni David” ay angkop na pagpapanatili ng kinikilalang pamagat at ng mesiyanikong alingawngaw nito sa konteksto ni Lucas. Wasto rin ang pangalang “Jesus” at ang salitang “maawa.” Ang talababa ay tumpak na nagpapaliwanag ng pamagat at nagbibigay ng leksikal na alternatibo nang hindi ipinipilit ang isang doktrinal na pagbasa.
