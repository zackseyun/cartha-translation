id: LUK.18.38
reference: Luke 18:38
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐβόησεν λέγων· Ἰησοῦ υἱὲ Δαυίδ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/038.yaml
  text: And he cried out[a], saying, “Jesus, Son of David, have mercy on me!”
translation:
  language: tl
  text: At sumigaw siya, “Jesus, Anak ni David,[a] maawa ka sa akin!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Anak ni David” ay titulong mesiyaniko na tumutukoy sa ipinangakong hari mula sa angkan ni David. Maaari rin itong unawain sa mas pangkalahatang diwang “inapo ni David.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβόησεν
  choice: sumigaw
  rationale: Ipinahihiwatig ng pandiwang βοάω ang malakas at apurahang pagsigaw; natural at tuwiran ang “sumigaw” sa makabagong Filipino.
- source_word: λέγων
  choice: hindi isinalin nang hiwalay
  rationale: Sa Filipino, likas nang ipinakikilala ng kuwit at panipi ang mismong sinabi pagkatapos ng “sumigaw”; ang pagdaragdag ng “na sinasabi” ay magiging mabigat at di-natural.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Ito ang karaniwang anyo ng pangalang Ἰησοῦς sa Filipino at dito ay ginagamit bilang tuwirang pagtawag.
- source_word: υἱὲ Δαυίδ
  choice: Anak ni David
  rationale: Pinananatili nito ang kinikilalang titulong maharlika at mesiyaniko, pati ang pagkakaugnay nito sa mga pangako tungkol sa sambahayan ni David.
- source_word: ἐλέησόν με
  choice: maawa ka sa akin
  rationale: Natural itong pakiusap sa Filipino para sa aktuwal na pagpapakita ng awa, at pinananatili ang pagiging tuwiran at apurahan ng aorist imperative.
theological_decisions:
- issue: Mesiyanikong bigat ng titulong υἱὲ Δαυίδ
  choice: Isinalin bilang “Anak ni David.”
  alternative: “Inapo ni David”
  rationale: 'Sa salaysay ni Lucas, ang parirala ay higit sa karaniwang paglalarawan ng angkan: isa itong titulong may maharlika at mesiyanikong pahiwatig. Pinananatili ng “Anak ni David” ang pahiwatig na iyon nang hindi nagdaragdag ng paliwanag sa mismong talata.'
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Inalis ang hiwalay na katumbas ng λέγων dahil sapat at mas likas sa Filipino ang pandiwang “sumigaw” na sinusundan agad ng tuwirang pananalita. Inilagay ang talababa kaagad pagkatapos ng titulong tinatalakay nito.
