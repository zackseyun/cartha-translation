  text: λέγω ὑμῖν ὅτι ποιήσει τὴν ἐκδίκησιν αὐτῶν ἐν τάχει. πλὴν ὁ υἱὸς τοῦ ἀνθρώπου ἐλθὼν ἆρα εὑρήσει τὴν πίστιν ἐπὶ τῆς γῆς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/008.yaml
  text: I tell you that he will bring about justice for them quickly[a]. Nevertheless, when the Son of Man comes[b], will he really find faith on the earth?
translation:
  language: tl
  text: 'Sinasabi ko sa inyo: agad niyang igagawad sa kanila ang katarungan.[a] Gayunman, pagdating ng Anak ng Tao, makasusumpong kaya siya ng pananampalataya sa lupa?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “agad niyang bibigyan sila ng katarungan” o “agad niyang ipahahayag na nasa tama sila.” Maaaring tumukoy ang salitang Griyego sa legal na pagpapawalang-sala o sa katarungang ginagawa para sa isang tao.
    reason: lexical_alternative
  - marker: b
    text: Ang “pananampalataya” ay maaari ring unawain bilang “pagtitiwala” o “katapatan.” Pinananatili ng pangunahing salin ang mas malawak na kahulugan ng salitang Griyego.
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσει τὴν ἐκδίκησιν αὐτῶν
  choice: bibigyan niya sila ng katarungan
  rationale: Ipinahihiwatig ng parirala ang pagbibigay ng katarungan o legal na pagtatanggol sa mga taong inaapi. Likas sa modernong Tagalog ang “bibigyan ... ng katarungan” at hindi nito labis na binibigyang-diin ang paghihiganti.
- source_word: ἐν τάχει
  choice: mabilis
  rationale: Pinananatili nito ang diwa ng mabilis na pagkilos o pagkilos nang walang pagkaantala, nang hindi tahasang nagpapasya na ang tinutukoy ay isang malapit na takdang panahon.
- source_word: πλὴν
  choice: Gayunman
  rationale: Malinaw nitong ipinakikita ang mariing paglipat at pagsalungat mula sa katiyakan ng katarungan ng Diyos tungo sa mapanuring tanong na kasunod.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Ito ang nakagawiang salin ng titulo at pinananatili ang kaugnayan nito sa Daniel 7.
- source_word: ἐλθὼν
  choice: pagdating
  rationale: 'Natural na ipinahahayag sa Tagalog ang temporal na relasyon ng participle sa pangunahing pandiwa: “pagdating ... makakakita.”'
- source_word: ἆρα
  choice: kaya talaga
  rationale: Ang “kaya” ay natural na pananda ng mapanuring tanong, at ang “talaga” ay naghahatid ng mapagnilay at retorikal na diin ng ἆρα.
- source_word: τὴν πίστιν
  choice: pananampalataya
  rationale: Pinananatili ng “pananampalataya” ang lawak ng πίστις at hindi agad nililimitahan ito sa katapatan o pagtitiwala lamang.
- source_word: ἐπὶ τῆς γῆς
  choice: sa lupa
  rationale: Tuwiran at natural itong katumbas sa Tagalog at angkop sa malawak na saklaw ng pahayag.
theological_decisions:
- issue: Maaaring tumukoy ang πίστις sa pananampalataya, pagtitiwala, o katapatan sa konteksto ng matiyagang pananalangin.
  choice: pananampalataya
  alternative: pagtitiwala; katapatan
  rationale: Pinananatili ng pangunahing salin ang malawak at karaniwang kahulugan ng salita, habang inilalahad sa talababa ang mga posibleng pagbasa upang hindi lutasin nang sapilitan ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang natural na ayos na “bibigyan niya sila ng katarungan” at pinanatili ang retorikal na bigat ng huling tanong.
