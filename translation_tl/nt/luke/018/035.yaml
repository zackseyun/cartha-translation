  text: Ἐγένετο δὲ ἐν τῷ ἐγγίζειν αὐτὸν εἰς Ἰεριχὼ τυφλός τις ἐκάθητο παρὰ τὴν ὁδὸν ⸀ἐπαιτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/035.yaml
  text: As he was approaching Jericho[a], a certain blind man was sitting beside the road[b], begging.
translation:
  language: tl
  text: Habang papalapit siya sa Jerico[a], may isang bulag na lalaki[b] na nakaupo sa tabi ng daan at namamalimos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “samantalang papalapit siya sa Jerico.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “may bulag na lalaki.” Ang salitang Griyego na τις ay bahagyang nagbubukod sa lalaki bilang isang tao sa salaysay.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Hindi isinalin nang tahasan
  rationale: Dito, ang parirala ay pangunahing nagsisilbing panandang pasalaysay. Sapat na naipahihiwatig sa natural na daloy ng pangungusap ang paglipat ng tagpo; ang “At nangyari” ay magiging matigas at di-likas sa makabagong Filipino.
- source_word: ἐν τῷ ἐγγίζειν αὐτὸν εἰς Ἰεριχὼ
  choice: Habang papalapit siya sa Jerico
  rationale: Ipinahahayag ng ἐν kasunod ng articular infinitive ang magkasabay na kilos, at ipinakikita ng εἰς ang pagkilos patungo sa lungsod. Pinananatili ng “habang papalapit” ang nagpapatuloy na aspekto nang natural sa Filipino.
- source_word: τυφλός τις
  choice: may isang bulag na lalaki
  rationale: Likas na ipinakikilala ng “may isang” ang isang di-pa-kilalang tao at bahagyang pinananatili ang indibiduwalisasyong dulot ng τις, nang hindi gumagamit ng di-likas na “isang partikular na.”
- source_word: ἐκάθητο
  choice: nakaupo
  rationale: Inilalarawan ng imperfect ang nagpapatuloy na kalagayan sa tagpo. Ang “nakaupo” ay natural na Filipino at malinaw na naghahain ng kalagayang iyon.
- source_word: παρὰ τὴν ὁδὸν
  choice: sa tabi ng daan
  rationale: Ipinahahayag ng παρά rito ang kinalalagyan sa gilid o tabi ng daan. Ito ang tuwiran at karaniwang pananalita sa Filipino.
- source_word: ἐπαιτῶν
  choice: namamalimos
  rationale: Tuwirang tinutukoy ng participle ang patuloy na ginagawa ng lalaki bilang isang namamalimos. Mas natural at mas maikli ito kaysa “humihingi ng limos.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “may isang” bilang likas na paraan ng pagpapakilala sa di-pa-kilalang tauhan, at iniwasan ang matigas na literalismo sa pambungad na pariralang pasalaysay.
