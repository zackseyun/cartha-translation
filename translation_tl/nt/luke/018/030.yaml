  text: ὃς ⸀οὐχὶ μὴ ⸀ἀπολάβῃ πολλαπλασίονα ἐν τῷ καιρῷ τούτῳ καὶ ἐν τῷ αἰῶνι τῷ ἐρχομένῳ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/030.yaml
  text: who will certainly receive many times more in this time[a], and in the age to come, eternal life.
translation:
  language: tl
  text: na tiyak na tatanggap ng maraming ulit na higit pa sa panahong ito, at ng buhay na walang hanggan sa darating na kapanahunan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐχὶ μὴ
  choice: tiyak na
  rationale: Ang mariing negasyon na may subjunctive ay isang matibay na katiyakan; likas itong ipinahahayag sa Tagalog sa positibong anyong “tiyak na” sa halip na piliting panatilihin ang dobleng negasyon.
- source_word: ἀπολάβῃ
  choice: tatanggap
  rationale: Maaaring mangahulugang “tumanggap” o “tumanggap pabalik.” Sa konteksto ng gantimpala sa mga iniwan, malinaw at natural ang “tatanggap” nang hindi labis na idinidiin ang ideya ng pagsasauli.
- source_word: πολλαπλασίονα
  choice: makailang ulit na higit pa
  rationale: Ipinahahayag nito ang saganang gantimpalang maraming ulit ang laki; pinananatili ng parirala ang paghahambing sa orihinal.
- source_word: ἐν τῷ καιρῷ τούτῳ
  choice: sa panahong ito
  rationale: Ang καιρός dito ay isang takdang panahon at tahasang inihahambing sa darating na panahon.
- source_word: ἐν τῷ αἰῶνι τῷ ἐρχομένῳ
  choice: sa panahong darating
  rationale: Natural sa modernong Tagalog at pinananatili ang eskatolohikal na paghahambing ng kasalukuyan at darating na kaayusan.
- source_word: ζωὴν αἰώνιον
  choice: buhay na walang hanggan
  rationale: Ito ang malinaw, karaniwan, at kontekstuwal na salin ng parirala sa mga Ebanghelyo.
- source_word: ὃς
  choice: na
  rationale: Dugtong ito sa taong inilalarawan sa naunang talata; ang pang-ugnay na “na” ang likas na katumbas sa Tagalog.
theological_decisions:
- issue: Eskatolohikal na kahulugan ng αἰῶνι τῷ ἐρχομένῳ
  choice: sa panahong darating
  alternative: sa kapanahunang darating
  rationale: Pinananatili nito ang kaibhan sa pagitan ng kasalukuyang panahon at ng darating na eskatolohikal na kaayusan, nang hindi ito ginagawang simpleng pagtukoy lamang sa hinaharap.
- issue: Mariing katiyakan ng οὐχὶ μὴ
  choice: tiyak na tatanggap
  alternative: hinding-hindi mabibigong tumanggap
  rationale: Ipinapahayag ang lubos na katiyakan ng pangako nang hindi nagpapasok ng ideya ng personal na pagkabigo na hindi tahasang sinasabi sa Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong sintaktikong dugtong sa naunang talata at iniwasan ang arkaikong “makapupong higit” o teknikal na “kapanahunan” sa pangunahing teksto.
