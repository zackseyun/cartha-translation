  text: So Jesus stood still and ordered that he be brought to him[a]. And when he came near, he asked him[b],
translation:
  language: tl
  text: Kaya tumigil si Jesus at iniutos na dalhin[a] ang lalaki sa kanya. Nang makalapit ang lalaki, tinanong siya ni Jesus,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “iakay.” Ang pandiwa ay maaaring mangahulugang akayin o dalhin.
    reason: lexical_alternative
lexical_decisions:
- source_word: σταθεὶς
  choice: tumigil
  rationale: Ang aorist passive participle ng ἵστημι ay ginagamit dito sa di-transitibong diwa at nagpapahiwatig na huminto si Jesus sa paglakad. Likas at malinaw sa makabagong Tagalog ang “tumigil.”
- source_word: δὲ
  choice: Kaya
  rationale: Mahinang pang-ugnay ang δέ; sa konteksto, ipinapakita ng “Kaya” ang likas na pagsulong mula sa pagsigaw ng lalaki tungo sa tugon ni Jesus, nang hindi nagpapahiwatig ng matinding pagsalungat.
- source_word: ἐκέλευσεν
  choice: iniutos
  rationale: Pinananatili ng “iniutos” ang awtoritatibong lakas ng κελεύω at karaniwan ito sa dignidad na modernong Tagalog.
- source_word: αὐτὸν
  choice: ang lalaki
  rationale: Bagaman panghalip lamang ang Griyego, nililinaw ng “ang lalaki” ang tinutukoy na bulag na lalaki at iniiwasan ang sunod-sunod na malabong panghalip sa Tagalog.
- source_word: ἀχθῆναι
  choice: dalhin
  rationale: Ang passive infinitive ng ἄγω ay tumutukoy sa pagdadala o pag-akay sa lalaki patungo kay Jesus. Pinakanatural at pinakamalawak dito ang “dalhin.”
- source_word: πρὸς αὐτόν
  choice: sa kanya
  rationale: Ipinahihiwatig ng πρός na may accusative ang pagkilos patungo kay Jesus; karaniwang Tagalog ang “sa kanya.”
- source_word: ἐγγίσαντος δὲ αὐτοῦ
  choice: Nang makalapit ito
  rationale: Isinasalin nito ang temporal na genitive absolute at ang aorist na kilos bilang pangyayaring nauna sa pagtatanong. Ang “ito” ay malinaw na tumutukoy sa lalaking katatapos banggitin.
- source_word: ἐπηρώτησεν αὐτόν
  choice: tinanong siya ni Jesus
  rationale: Karaniwang kahulugan ng ἐπερωτάω ang “magtanong.” Muling pinangalanan si Jesus upang alisin ang posibleng kalabuan kung sino ang nagtatanong at sino ang tinatanong.
