translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “tumigil” sa halip na mas literal ngunit di-likas na “tumayo nang hindi gumagalaw.” Nilinaw ang mga reperente ng panghalip para maiwasan ang kalabuan, nang hindi dinaragdagan ang nilalaman ng talata.
