base_translation:
  language: en
  yaml_path: translation/nt/luke/018/020.yaml
  text: 'You know the commandments: Do not commit adultery[a], do not murder, do not steal, do not bear false witness, honor your father and mother.'
translation:
  language: tl
  text: 'Alam mo ang mga utos: Huwag kang mangangalunya, huwag kang pumatay ng tao, huwag kang magnakaw, huwag kang magbigay ng maling patotoo, igalang mo ang iyong ama at ina.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰς ἐντολὰς
  choice: ang mga utos
  rationale: Tumutukoy ang ἐντολή sa makapangyarihang utos; sa kontekstong ito, kinikilala ang mga utos mula sa Sampung Utos.
- source_word: οἶδας
  choice: Alam mo
  rationale: Bagaman perpektong anyo ang οἶδα, pangkasalukuyan ang diwa nito sa Koine Greek.
- source_word: Μὴ μοιχεύσῃς
  choice: Huwag kang mangangalunya
  rationale: Tuwirang ipinahahayag nito ang pagbabawal sa pangangalunya sa natural at dignified na modernong Tagalog.
- source_word: Μὴ φονεύσῃς
  choice: huwag kang papatay ng tao
  rationale: Ang φονεύω ay tumutukoy sa pagpatay sa tao, lalo na sa di-matuwid na pagkitil ng buhay, hindi sa lahat ng maaaring saklawin ng pangkalahatang salitang 'pumatay.'
- source_word: Μὴ κλέψῃς
  choice: huwag kang magnanakaw
  rationale: Karaniwan at tuwirang katumbas ito ng κλέπτω bilang pagbabawal.
- source_word: Μὴ ψευδομαρτυρήσῃς
  choice: huwag kang sasaksi nang kasinungalingan
  rationale: Pinananatili nito ang larawan ng pagbibigay ng patotoo at ang pagkakaugnay sa utos ng Dekalogo.
- source_word: Τίμα
  choice: igalang mo
  rationale: Ipinahahayag ng 'igalang' ang etikal at pampamilyang diwa ng τιμάω sa natural na Tagalog.
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα
  choice: ang iyong ama at ina
  rationale: Malinaw na tinutukoy ang parehong magulang, habang natural na minsan lamang ginagamit ang panghalip na paari sa Tagalog.
theological_decisions:
- issue: Paraan ng pagsasalin sa mga pagbabawal na mula sa Dekalogo
  choice: Gamitin ang makabagong tuwirang pagbabawal na “Huwag kang ...”
  alternative: Gamitin ang mas tradisyonal na “Huwag kang ...” na may mga anyong gaya ng “papatay” o isang mas pormal na legal na hulma
  rationale: Ang mga anyong Μὴ + aorist subjunctive ay may malinaw na puwersa ng pagbabawal. Ang “Huwag kang ...” ay natural sa kasalukuyang Tagalog at hindi binabago ang teolohikal na nilalaman.
- issue: Saklaw ng φονεύω
  choice: “papatay ng tao”
  alternative: “papatay” lamang
  rationale: Nililinaw nito na ang utos ay tungkol sa pagkitil ng buhay ng tao at iniiwasang palawakin ang salita sa lahat ng uri ng pagpatay, habang hindi nagdaragdag ng isang teknikal na legal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, dignified, at madaling maunawaan. Pinanatili ang ritmo ng magkakasunod na utos at ang pamilyar na bokabularyong biblikal nang hindi gumagamit ng lipas na pananalita.
