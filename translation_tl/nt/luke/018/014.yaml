id: LUK.18.14
reference: Luke 18:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: λέγω ὑμῖν, κατέβη οὗτος δεδικαιωμένος εἰς τὸν οἶκον αὐτοῦ ⸂παρ’ ἐκεῖνον⸃· ὅτι πᾶς ὁ ὑψῶν ἑαυτὸν ταπεινωθήσεται, ὁ δὲ ταπεινῶν ἑαυτὸν ὑψωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/014.yaml
  text: I tell you[a], this man went down to his house justified rather than the other; because everyone who exalts himself will be humbled, but the one who humbles himself will be exalted.
translation:
  language: tl
  text: Sinasabi ko sa inyo, bumaba at umuwi sa kanyang bahay ang taong ito na itinuring na matuwid sa halip na ang isa[a]. Sapagkat ang bawat nagmamataas ay ibababa, ngunit ang nagpapakumbaba ay itataas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kaysa sa isa,” o “kung ihahambing sa isa”; ipinaghahambing ng parirala ang taong ito sa isa pang sumamba.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεδικαιωμένος
  choice: itinuring na matuwid
  rationale: Ipinahahayag nito ang kanais-nais na hatol sa tao habang pinananatili ang resultang diwa ng perfect passive. Hindi nito nililimitahan ang kahulugan sa panlipunang pagpapatunay lamang o ipinapasok ang isang mas malawak na sistematikong paliwanag.
- source_word: παρ’ ἐκεῖνον
  choice: hindi ang isa
  rationale: Sa ayos ng pangungusap sa Filipino, malinaw at likas nitong ipinakikita ang paghahambing at pagsalungat sa maniningil ng buwis at sa Pariseo. Nasa talababa ang mas tahasang anyong pahambing.
- source_word: κατέβη
  choice: bumaba at umuwi
  rationale: Pinananatili ng “bumaba” ang kongkretong kilos mula sa lugar ng templo, samantalang nililinaw ng “umuwi” ang patutunguhan na ipinahihiwatig ng εἰς τὸν οἶκον αὐτοῦ.
- source_word: οἶκον αὐτοῦ
  choice: kanyang bahay
  rationale: Tuwirang katumbas ito ng parirala at likas sa modernong Filipino.
- source_word: πᾶς ὁ ὑψῶν ἑαυτόν
  choice: ang bawat nagmamataas
  rationale: Likas na Filipino ang “nagmamataas” para sa kusang pagtataas sa sarili at malinaw nitong ipinahahayag ang pangkalahatang simulaing nasa articular participle.
- source_word: ταπεινωθήσεται
  choice: ay ibababa
  rationale: Pinananatili nito ang future passive at hindi tahasang pinapangalanan ang gumagawa, gaya ng Griyego.
- source_word: ὁ δὲ ταπεινῶν ἑαυτόν
  choice: ngunit ang nagpapakumbaba
  rationale: Ang “nagpapakumbaba” ay likas na reflexive sa Filipino at pinananatili ng “ngunit” ang malinaw na pagsalungat ng δέ.
- source_word: ὑψωθήσεται
  choice: ay itataas
  rationale: Pinananatili nito ang future passive at ang baligtarang ugnayan sa “ibababa.”
- source_word: ὅτι
  choice: Sapagkat
  rationale: Malinaw nitong ipinakikilala ang dahilan o saligan ng naunang hatol.
- source_word: οὗτος
  choice: ang taong ito
  rationale: Malinaw nitong tinutukoy ang maniningil ng buwis bilang kasalungat ng isa pang sumamba.
theological_decisions:
- issue: Kahulugan ng δικαιόω sa wakas ng talinghaga
  choice: “itinuring na matuwid,” bilang kanais-nais na hatol
  alternative: “pinawalang-sala” o “pinatunayang matuwid”
  rationale: Ang konteksto ay tungkol sa katayuan ng nagsisising maniningil ng buwis sa harap ng Diyos. Pinananatili ng napiling parirala ang bigat ng hatol nang hindi ito ginagawang simpleng panlipunang pagpapatunay o nilalagyan ng higit na sistematikong detalye kaysa sa talata.
- issue: Hindi binanggit na tagaganap sa mga passive na pandiwa
  choice: Panatilihing hindi tahasang pinangalanan ang tagaganap sa “ibababa” at “itataas”
  alternative: Idagdag ang “ng Diyos”
  rationale: Malakas na ipinahihiwatig ng konteksto na Diyos ang kumikilos, ngunit hindi Siya tahasang pinangalanan sa mga passive na anyo ng Griyego. Pinananatili ng salin ang ganitong makabuluhang pagpipigil.
- issue: Paghahambing sa παρ’ ἐκεῖνον
  choice: “hindi ang isa” sa pangunahing teksto
  alternative: “kaysa sa isa” o “kung ihahambing sa isa”
  rationale: Ipinakikita ng pangunahing teksto ang matinding pagsalungat na natural sa Filipino, habang kinikilala sa talababa na maaari ring pakinggan ang parirala bilang tahasang paghahambing.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “bumaba at umuwi” upang mapanatili kapwa ang kongkretong kilos at ang likas na daloy sa Filipino. Ang magkatapat na “ibababa” at “itataas” ay nagpapanatili sa retorikal na baligtaran ng kasabihan.
