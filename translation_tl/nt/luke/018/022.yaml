  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀκούσας ⸀δὲ ὁ Ἰησοῦς εἶπεν αὐτῷ· Ἔτι ἕν σοι λείπει· πάντα ὅσα ἔχεις πώλησον καὶ διάδος πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν ⸀οὐρανοῖς, καὶ δεῦρο ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/022.yaml
  text: 'When Jesus heard this, he said to him, “One thing still lacks for you: sell all that you have and distribute it to the poor, and you will have treasure in heaven; and come, follow me.”'
translation:
  language: tl
  text: Nang marinig ito ni Jesus, sinabi niya sa kanya, “May isang bagay ka pang kulang:[a] ipagbili mo ang lahat ng pag-aari mo at ipamahagi sa mga dukha, at magkakaroon ka ng kayamanan sa langit.[b] Halika at sumunod ka sa akin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Isang bagay pa ang kulang para sa iyo.”'
    reason: lexical_alternative
  - marker: b
    text: 'Mas literal: “sa mga langit.” Pangmaramihan ang salitang Griyego, ngunit karaniwang isahan ang “langit” sa natural na Tagalog sa ganitong konteksto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας δὲ ὁ Ἰησοῦς
  choice: Nang marinig ito ni Jesus
  rationale: Ginawang likas na temporal na sugnay sa Tagalog ang aorist participle; ang “ito” ay tumutukoy sa naunang sinabi sa konteksto.
- source_word: Ἔτι ἕν σοι λείπει
  choice: May isang bagay ka pang kulang
  rationale: Likas at malinaw sa modernong Tagalog, habang pinananatili ang diin sa iisang natitirang kakulangan. Inilalahad sa talababa ang mas literal na ayos ng Griyego.
- source_word: πάντα ὅσα ἔχεις
  choice: ang lahat ng pag-aari mo
  rationale: Ipinahahayag ang ganap na saklaw ng parirala at natural na nauugnay sa utos na ipagbili.
- source_word: πώλησον
  choice: ipagbili mo
  rationale: Tuwirang pautos na nagpapahiwatig ng tiyak at mapagpasiyang pagkilos.
- source_word: διάδος πτωχοῖς
  choice: ipamahagi sa mga dukha
  rationale: Pinananatili ng “ipamahagi” ang diwa ng διαδίδωμι na pamamahagi, hindi lamang pangkalahatang pagbibigay.
- source_word: ἕξεις θησαυρὸν ἐν οὐρανοῖς
  choice: magkakaroon ka ng kayamanan sa langit
  rationale: Natural sa Tagalog ang isahan na “langit” sa ganitong pahayag; ang literal na pangmaramihang anyo ay itinala sa talababa.
- source_word: δεῦρο ἀκολούθει μοι
  choice: Pagkatapos, halika at sumunod ka sa akin
  rationale: Ang “halika” ay nagpapanatili sa paanyayang lumapit, at ang “sumunod ka sa akin” ay natural na naghahatid ng patuloy na diwa ng pagiging alagad.
theological_decisions:
- issue: Saklaw ng pagtalikod sa ari-arian at pagsunod
  choice: Pinanatili bilang kongkretong utos ni Jesus sa lalaking kausap niya, na humahantong sa panawagang sumunod sa kanya.
  alternative: Ituring itong tahasang pangkalahatang utos ng ganap na pagbebenta para sa bawat mananampalataya, o gawing sagisag lamang na walang kongkretong ekonomikong hinihingi.
  rationale: Konkretong mga pautos ang nasa Griyego at nakatuon sa taong kausap ni Jesus. Hindi dapat palawakin o pahinain ng salin ang teolohikong saklaw na hindi tahasang nilulutas ng talata.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “mga dukha” bilang maikli at dignipikadong pantukoy, at iniwasan ang sobrang literal na ayos na magiging asiwa sa Tagalog.
