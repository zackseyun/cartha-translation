  text: ὁ δὲ εἶπεν· Ταῦτα πάντα ⸀ἐφύλαξα ἐκ νεότητος ⸀μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/021.yaml
  text: And he said[a], “I have kept all these things from my youth.”
translation:
  language: tl
  text: Sinabi naman niya, “Tinupad ko ang lahat ng ito[a] mula pa sa aking kabataan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas tahasan ayon sa konteksto, “ang lahat ng utos na ito.” Sa Griyego, “ang lahat ng ito” lamang.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἶπεν
  choice: Sinabi naman niya
  rationale: Ang δέ ay banayad na pang-ugnay. Likas sa salaysay ang “naman” at hindi nito labis na binibigyang-diin ang pagsalungat.
- source_word: Ταῦτα πάντα
  choice: ang lahat ng ito
  rationale: Tuwirang pinananatili nito ang demonstratibo at ang kabuuang saklaw ng parirala. Ipinahihiwatig ng konteksto ang mga utos, ngunit hindi iyon tahasang sinabi sa Griyego.
- source_word: ἐφύλαξα
  choice: Tinupad ko
  rationale: Sa konteksto ng mga utos, ang φυλάσσω ay nangangahulugang ingatan, sundin, o tuparin. Ang “tinupad” ay natural sa modernong Filipino at malinaw na naghahayag ng pag-aangking nasunod ang mga nabanggit.
- source_word: ἐκ νεότητος μου
  choice: mula pa sa aking kabataan
  rationale: Ipinapakita ng ἐκ ang panimulang punto sa panahon. Ang “mula pa” ay likas na Filipino at nagpapahiwatig ng saklaw mula noong kabataan hanggang sa panahong nagsasalita siya.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Pinanatili sa pangunahing teksto ang di-tahasang pagtukoy ng Griyego sa halip na idagdag ang “mga utos”; nilinaw ang kontekstuwal na alternatibo sa talababa.
