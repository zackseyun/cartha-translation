id: LUK.18.16
reference: Luke 18:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸂προσεκαλέσατο αὐτὰ λέγων⸃· Ἄφετε τὰ παιδία ἔρχεσθαι πρός με καὶ μὴ κωλύετε αὐτά, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/016.yaml
  text: But Jesus called them to him[a], saying, “Let the children come to me, and do not hinder them, for the kingdom of God belongs to such as these.”
translation:
  language: tl
  text: Ngunit tinawag sila ni Jesus palapit sa kanya at sinabi, “Hayaan ninyong lumapit sa akin ang mga bata, at huwag ninyo silang pigilan, sapagkat sa mga tulad nila nauukol ang kaharian ng Diyos[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “sapagkat sa mga tulad nila ang kaharian ng Diyos.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεκαλέσατο αὐτὰ
  choice: tinawag sila ... palapit sa kanya
  rationale: Ipinahahayag nito ang gitnang tinig ng pandiwa—tinawag ni Jesus ang mga bata upang lumapit sa kanya—habang pinananatili ang panghalip na tumutukoy sa kanila.
- source_word: Ἄφετε
  choice: Hayaan ninyo
  rationale: Likas at tuwirang pautos ito sa makabagong Filipino para sa kahulugang payagan o pahintulutan.
- source_word: τὰ παιδία
  choice: ang mga bata
  rationale: Tuwirang salin ito na hindi nagdaragdag ng antas ng edad na hindi tahasang tinutukoy ng salita.
- source_word: ἔρχεσθαι πρός με
  choice: lumapit sa akin
  rationale: Natural na Filipino ito para sa pagpunta tungo kay Jesus.
- source_word: μὴ κωλύετε αὐτά
  choice: huwag ninyo silang pigilan
  rationale: Saklaw ng “pigilan” ang paghadlang o pagpigil sa kanilang paglapit nang hindi ipinapalagay kung lubusan nang napigil ang kilos.
- source_word: τῶν ... τοιούτων
  choice: sa mga tulad nila
  rationale: Hindi lamang nito tinutukoy ang mismong mga batang naroon kundi ang uri ng mga taong kinakatawan nila, nang hindi ipinapaliwanag kung aling katangian ang tinutukoy.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: nauukol ang kaharian ng Diyos
  rationale: Ipinahahayag ng “nauukol” ang ugnayang taglay ng genitibong parirala nang hindi ginagawang tahasang pag-aari o basta destinasyon lamang ang kaharian.
theological_decisions:
- issue: Saklaw ng τῶν τοιούτων
  choice: “sa mga tulad nila,” na lumalampas sa mismong mga batang naroon
  alternative: Tanging ang literal na mga batang dinala kay Jesus ang tinutukoy.
  rationale: Ang τοιούτων ay karaniwang tumutukoy sa isang uri o pangkat na inilalarawan ng mga taong naroon. Pinananatili ng salin ang lawak na ito ngunit hindi tinutukoy kung anong katangian ng mga bata ang mahalaga.
- issue: Ugnayan ng kaharian sa “mga tulad nila”
  choice: “nauukol ang kaharian ng Diyos”
  alternative: “para sa mga tulad nila ang kaharian ng Diyos” o ang mas literal na “sa mga tulad nila ang kaharian ng Diyos”
  rationale: Pinananatili ng “nauukol” ang di-tahasang ugnayan ng genitibong Griyego at iniiwasang paliitin ito sa simpleng pag-aari, pagiging miyembro, o destinasyon.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “palapit sa kanya” upang malinaw na maipakita ang reflexive na diwa ng pagtawag, at “pigilan” bilang karaniwang salitang madaling maunawaan para sa paghadlang.
