  source_fidelity: Tumpak ang salin sa pangunahing diwa ng Griyego. Naipapahayag ng “isinama niya ang Labindalawa” ang παραλαβών nang hindi nagdaragdag ng di-tiyak na ideyang “ibinukod”; pinananatili ng “aakyat tayo” ang ἀναβαίνομεν; at wasto ang “matutupad ang lahat ng isinulat sa pamamagitan ng mga propeta.” Ang “tungkol sa Anak ng Tao” ay natural na pagpapahayag ng malamang na referential na diwa ng datibo, habang pinananatili ng talababa ang mas literal na alternatibo.
  naturalness: Natural at malinaw ang Filipino. Ang “Narito” ay bahagyang mas mataas na rehistro kaysa karaniwang usapan, ngunit angkop itong panawag-pansin sa marangal na modernong wikang biblikal at mahusay na katumbas ng ἰδού.
  terminology: Wasto at pare-pareho ang “Labindalawa,” “Jerusalem,” “mga propeta,” at “Anak ng Tao.” Lalong mahalaga, hindi pinalitan o ipinaliwanag sa teksto ang titulong “Anak ng Tao,” kaya nananatili ang saklaw at bigat nito.
