id: LUK.18.31
reference: Luke 18:31
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Παραλαβὼν δὲ τοὺς δώδεκα εἶπεν πρὸς αὐτούς· Ἰδοὺ ἀναβαίνομεν εἰς ⸀Ἰερουσαλήμ, καὶ τελεσθήσεται πάντα τὰ γεγραμμένα διὰ τῶν προφητῶν τῷ υἱῷ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/031.yaml
  text: Then taking the twelve aside[a], he said to them, “Look, we are going up to Jerusalem, and everything written through the prophets about the Son of Man will be fulfilled.”
translation:
  language: tl
  text: Pagkatapos, isinama niya ang Labindalawa at sinabi sa kanila, “Narito, aakyat tayo sa Jerusalem, at matutupad ang lahat ng isinulat sa pamamagitan ng mga propeta tungkol sa Anak ng Tao[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “para sa Anak ng Tao.” Ganito maaaring isalin nang mas literal ang pagkakabuo ng parirala sa Griyego.
    reason: alternative_reading
lexical_decisions:
- source_word: Παραλαβὼν
  choice: isinama niya
  rationale: Ang παραλαμβάνω ay tumutukoy sa pagsama o pagkuha sa mga tao upang makasama niya. Hindi tahasang sinasabi ng salita na inilayo niya sila, kaya hindi idinagdag ang “nang bukod.”
- source_word: τοὺς δώδεκα
  choice: ang Labindalawa
  rationale: Pinananatili ang kinikilalang katawagan sa pinakamalapit na pangkat ng mga alagad ni Jesus nang hindi idinaragdag ang salitang “alagad,” na wala sa Griyego.
- source_word: Ἰδοὺ
  choice: Narito
  rationale: Ginagamit ito bilang panawag-pansin bago ang mahalagang pahayag. Ang “Narito” ay maikli, marangal, at pamilyar sa makabagong wikang biblikal.
- source_word: ἀναβαίνομεν
  choice: aakyat tayo
  rationale: Pinananatili ang diwa ng pag-akyat patungong Jerusalem at ang kasalukuyang pagkilos o nalalapit na paglalakbay ng pangkat.
- source_word: Ἰερουσαλήμ
  choice: Jerusalem
  rationale: Ito ang karaniwang anyo ng pangalan ng lungsod sa makabagong Filipino.
- source_word: τελεσθήσεται
  choice: matutupad
  rationale: Ang hinaharap na balintiyak ay nagpapahayag na ang nasusulat ay sasapit sa katuparan; natural ang “matutupad” sa konteksto ng propesiya.
- source_word: πάντα τὰ γεγραμμένα
  choice: ang lahat ng isinulat
  rationale: Malinaw nitong pinananatili ang kabuuang saklaw ng πάντα at ang nananatiling bisa ng mga bagay na nasusulat.
- source_word: διὰ τῶν προφητῶν
  choice: sa pamamagitan ng mga propeta
  rationale: 'Pinananatili ang instrumental o ahentibong diwa ng διά: ang mga propeta ang mga ginamit sa paghahatid ng nasusulat.'
- source_word: τῷ υἱῷ τοῦ ἀνθρώπου
  choice: tungkol sa Anak ng Tao
  rationale: Sa pangungusap na ito, natural na maunawaan ang datibo bilang pagtukoy sa paksa ng mga isinulat. Inilalagay sa talababa ang mas literal na posibilidad na “para sa Anak ng Tao.”
theological_decisions:
- issue: Pagsasalin sa titulong ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak ng Tao
  alternative: Taong Anak / Ang Tao
  rationale: Pinananatili ng “Anak ng Tao” ang anyo ng titulo at ang posibleng ugnay nito sa Daniel, nang hindi nilulusaw ito sa isang pangkalahatang katawagan lamang.
- issue: Gamit ng datibong τῷ υἱῷ τοῦ ἀνθρώπου
  choice: tungkol sa Anak ng Tao
  alternative: para sa Anak ng Tao
  rationale: Malamang na tumutukoy ito sa nilalaman o paksa ng isinulat ng mga propeta, ngunit tunay na posible sa balarila ang mas literal na “para sa”; kaya pinanatili ang alternatibo sa talababa.
translation_notes:
  register: Makabago at madaling maunawaang Filipino na may marangal na himig. Ginamit ang “Labindalawa” bilang nakikilalang katawagan at “Narito” bilang maikli ngunit mariing panawag-pansin. Iniwasang idagdag ang “nang bukod” sapagkat hindi ito tahasang nakasaad sa παραλαβών.
