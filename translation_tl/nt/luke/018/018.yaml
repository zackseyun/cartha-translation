  text: Καὶ ἐπηρώτησέν τις αὐτὸν ἄρχων λέγων· Διδάσκαλε ἀγαθέ, τί ποιήσας ζωὴν αἰώνιον κληρονομήσω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/018.yaml
  text: And a ruler asked him[a], saying, “Good Teacher, what must I do to inherit eternal life?”
translation:
  language: tl
  text: At tinanong siya ng isang pinuno, “Mabuting Guro, ano ang dapat kong gawin[a] upang magmana ng buhay na walang hanggan?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “Ano ang magagawa ko upang magmana ng buhay na walang hanggan?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτησέν
  choice: tinanong
  rationale: Karaniwan at natural na katumbas ito ng pandiwang nangangahulugang magtanong o usisain; hindi nito pinalalabis ang pormalidad ng pagtatanong.
- source_word: τις ἄρχων
  choice: isang pinuno
  rationale: Ang τις ay nagpapakilala ng isang di-tinukoy na tao, at ang ἄρχων ay tumutukoy sa taong may awtoridad. Hindi tinutukoy ng konteksto ang eksaktong katungkulan niya.
- source_word: λέγων
  choice: hindi isinalin nang hiwalay
  rationale: Sa natural na Tagalog, sapat nang sundan ng tuwirang sinabi ang pandiwang “tinanong”; ang pagdaragdag ng “na sinasabi” ay magiging mabigat at di-likas.
- source_word: Διδάσκαλε ἀγαθέ
  choice: Mabuting Guro
  rationale: Tuwirang pinananatili ang paglalarawan na “mabuti,” na siyang pagtutuunan ng sagot ni Jesus sa kasunod na talata, at ang διδάσκαλος bilang “Guro.”
- source_word: τί ποιήσας
  choice: ano ang dapat kong gawin
  rationale: Ipinahahayag nito sa natural na Tagalog ang gawa o kundisyong itinatanong ng pinuno, habang inilalagay sa talababa ang mas literal na anyo ng participle.
- source_word: ζωὴν αἰώνιον
  choice: buhay na walang hanggan
  rationale: Ito ang malinaw, likas, at nakaugaliang salin ng parirala sa Tagalog, na nagpapanatili sa diwa ng αἰώνιος.
- source_word: κληρονομήσω
  choice: magmana
  rationale: Pinananatili nito ang mahalagang larawan ng pagtanggap ng mana sa halip na gawing pangkalahatang “matamo” o “makamit.”
theological_decisions:
- issue: Ang tanong tungkol sa buhay na walang hanggan kaugnay ng gawa ng tao
  choice: ano ang dapat kong gawin upang magmana ng buhay na walang hanggan
  alternative: ano, matapos kong gawin, ang magbibigay sa akin ng buhay na walang hanggan bilang mana
  rationale: Pinananatili ng salin ang mismong balangkas ng tanong ng pinuno—ang kinakailangang gawin—nang hindi ito ipinipilit bilang turo ng tagapagsalaysay tungkol sa kaligtasan at nang hindi rin inuunahan ang sagot ni Jesus.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang natural na ayos na “tinanong siya ng isang pinuno,” at hindi na isinalin nang hiwalay ang participleng λέγων upang maiwasan ang asiwa at sobrang literal na pananalita.
