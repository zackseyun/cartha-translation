id: LUK.18.5
reference: Luke 18:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: διά γε τὸ παρέχειν μοι κόπον τὴν χήραν ταύτην ἐκδικήσω αὐτήν ἵνα μὴ εἰς τέλος ἐρχομένη ὑπωπιάζῃ με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/005.yaml
  text: yet because this widow keeps causing me trouble[a], I will give her justice[b], so that by continually coming she may not wear me out.”
translation:
  language: tl
  text: Gayunman, dahil patuloy akong ginugulo ng balong ito, igagawad ko sa kanya ang katarungan[a], upang hindi niya ako tuluyang pagurin[b] sa walang tigil niyang pagpunta rito.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ipagtanggol ko ang kanyang karapatan” o “bibigyan ko siya ng katarungan laban sa kanyang kalaban.” Sa ibang konteksto, ang pandiwang Griyego ay maaaring mangahulugang “ipaghiganti.”
    reason: alternative_reading
  - marker: b
    text: Literal na “hampasin ako sa ilalim ng mata”; bilang idyoma, “lubusang pagurin ako” o “saidin ang tiyaga ko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διά γε τὸ παρέχειν μοι κόπον
  choice: dahil patuloy akong ginugulo
  rationale: Ang διά na sinusundan ng articular infinitive ay nagsasaad ng dahilan, at ang γε ay nagbibigay-diin. Likas sa modernong Tagalog ang “patuloy akong ginugulo” at naipapakita nito ang nagpapatuloy na kilos ng present infinitive.
- source_word: τὴν χήραν ταύτην
  choice: ng balong ito
  rationale: Tuwirang pinananatili ang pagkakakilanlan niya bilang balo, na mahalaga sa kalagayang panlipunan at legal sa talinghaga.
- source_word: ἐκδικήσω αὐτήν
  choice: igagawad ko sa kanya ang katarungan
  rationale: Sa kontekstong legal, tumutukoy ito sa pagbibigay ng makatarungang hatol o pagpapawalang-sala, hindi pangunahin sa personal na paghihiganti.
- source_word: ἵνα μὴ
  choice: upang hindi
  rationale: Malinaw at likas na pagpapahayag ng layunin ng hukom.
- source_word: εἰς τέλος ἐρχομένη
  choice: sa walang tigil niyang pagpunta rito
  rationale: Ipinahahayag ng “walang tigil” ang ideya ng εἰς τέλος sa kontekstong ito, samantalang ipinakikita ng pariralang ito ang paulit-ulit na paglapit ng balo.
- source_word: ὑπωπιάζῃ με
  choice: hindi niya ako tuluyang pagurin
  rationale: Bagaman literal na maaaring tumukoy sa paghampas sa ilalim ng mata, ginagamit ito rito bilang matinding idyoma para sa lubusang pagpapagod o pagsaid sa tiyaga ng hukom.
theological_decisions:
- issue: Kahulugan ng ἐκδικήσω sa talinghaga tungkol sa panalangin at katarungan
  choice: igagawad ko sa kanya ang katarungan
  alternative: ipaghihiganti ko siya; bibigyan ko siya ng katarungan laban sa kanyang kalaban
  rationale: Pinananatili ng salin ang tagpong legal at ang ugnayan sa pagkakaloob ng Diyos ng katarungan sa mga sumunod na talata, nang hindi nagdaragdag ng di-kinakailangang pahiwatig ng personal na paghihiganti.
- issue: Lakas at posibleng literal na larawan ng ὑπωπιάζῃ
  choice: tuluyang pagurin
  alternative: hampasin ako sa ilalim ng mata; bugbugin ako
  rationale: Ang matalinghagang kahulugan ang pinakanababagay sa reklamo ng hukom, ngunit inilalahad sa talababa ang literal na larawan upang hindi maitago ang tindi at tunay na lawak ng kahulugan ng Griyego.
translation_notes:
  register: Gumamit ng kasalukuyan, malinaw, at marangal na Tagalog. Pinili ang “balo” kaysa “biyuda” bilang natural at malawak na nauunawaang salitang Tagalog; ang “igagawad ... ang katarungan” ay nagpapanatili ng legal na himig. Ang “walang tigil” at “tuluyang pagurin” ay naghahatid ng pagkainip at matinding pananalita ng hukom nang gawing literal ang posibleng idyomatikong banta.
