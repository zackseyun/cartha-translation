  source_fidelity: Tumpak na naihahatid ng salin ang sanhi na may diin (διά γε τὸ παρέχειν μοι κόπον), ang pagkakakilanlan ng babae bilang balo, ang legal na diwa ng ἐκδικήσω αὐτήν, at ang layuning ipinahahayag ng ἵνα μὴ. Ang “sa walang tigil niyang pagpunta rito” ay angkop na pagpapahayag ng εἰς τέλος ἐρχομένη sa konteksto. Ang “tuluyang pagurin” ay isang makatuwirang idyomatikong salin ng ὑπωπιάζῃ με at hindi ipinipilit ang literal na pananakit.
  naturalness: Natural at malinaw ang modernong Filipino Tagalog. Ang “patuloy akong ginugulo,” “balong ito,” at “igagawad ko sa kanya ang katarungan” ay marangal ngunit hindi lipas na rehistro, na angkop sa salaysay-talinghaga.
  terminology: Tama ang “balo” at ang legal na “katarungan.” Hindi ipinapasok ng salin ang personal o doktrinal na kahulugang paghihiganti. Ang mga talababa ay wastong naglalahad ng alternatibong saklaw ng ἐκδικέω at ng literal na larawan ng ὑπωπιάζω.
