  text: εἶπεν δὲ αὐτῷ ὁ Ἰησοῦς· Τί με λέγεις ἀγαθόν; οὐδεὶς ἀγαθὸς εἰ μὴ εἷς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/019.yaml
  text: But Jesus said to him, “Why do you call me good? No one is good except one—God.”
translation:
  language: tl
  text: Ngunit sinabi sa kanya ni Jesus, “Bakit mo ako tinatawag na mabuti? Walang sinumang mabuti maliban sa iisa—ang Diyos.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig nito ang bahagyang pagsalungat o pagtutuwid sa tugon ni Jesus, bagaman maaari rin itong isaling “At.”
- source_word: εἶπεν ... ὁ Ἰησοῦς
  choice: sinabi ... ni Jesus
  rationale: Tuwirang inililipat ang karaniwang kahulugan ng λέγω nang hindi dinaragdagan ng mas interpretatibong “sumagot.”
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Pinananatili ang tahasang panghalip sa Griyego at hindi ito pinalalawak bilang “sa lalaki.”
- source_word: Τί
  choice: Bakit
  rationale: Sa pariralang ito, ang τί ay idiomatikong nagtatanong ng dahilan; natural sa modernong Tagalog ang “Bakit.”
- source_word: με λέγεις ἀγαθόν
  choice: mo ako tinatawag na mabuti
  rationale: Natural at tuwirang ipinapahayag ang λέγεις kasama ng panaguring pang-uri na ἀγαθόν.
- source_word: ἀγαθόν / ἀγαθὸς
  choice: mabuti
  rationale: Parehong salin ang ginamit sa dalawang paglitaw upang mapanatili ang leksikal na ugnayan, nang hindi idinaragdag ang mas makitid na “mabuti sa moral.”
- source_word: οὐδεὶς
  choice: Walang
  rationale: Malinaw at likas na Filipino ang “Walang mabuti” para sa pangkalahatang pagtanggi na walang sinumang mabuti.
- source_word: εἰ μὴ εἷς
  choice: maliban sa iisa
  rationale: Malapit ito sa konstruksiyong eksepsiyon ng Griyego at pinananatili ang diin sa nag-iisang eksepsiyon.
- source_word: ὁ θεός
  choice: ang Diyos
  rationale: Ang “ang Diyos” ang natural at tiyak na pagtukoy sa Tagalog, kasunod ng “iisa,” nang hindi ito pinalalawak bilang “ang iisang Diyos.”
theological_decisions:
- issue: Kristolohikal na pahiwatig ng tanong ni Jesus
  choice: Pinanatili ang tanong ni Jesus nang hindi ito ginagawang pagtanggi na siya ay mabuti o tahasang pagpapahayag na siya ay Diyos.
  alternative: Isang pagpapakahulugang tahasang itinatanggi ni Jesus ang ganap na kabutihan niya, o tahasang inaangkin niya rito ang pagka-Diyos.
  rationale: Hindi tahasang nilulutas ng mismong pangungusap ang Kristolohikal na tensiyon. Ang malapit at likas na salin ay hindi dapat magpasok ng doktrinal na konklusyong higit sa sinasabi ng Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “Ngunit” para sa tugong may bahagyang pagtutuwid at ang em dash upang idiin ang paglilinaw na ang iisa ay ang Diyos.
