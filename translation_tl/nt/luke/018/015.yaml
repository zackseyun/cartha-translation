base_translation:
  language: en
  yaml_path: translation/nt/luke/018/015.yaml
  text: They were even bringing infants to him so that he might touch them[a], but when the disciples saw it[c][b], they rebuked them.
translation:
  language: tl
  text: Dinadala ng mga tao sa kanya maging ang mga sanggol upang hipuin niya ang mga ito.[a] Ngunit nang makita iyon ng mga alagad,[c] sinaway nila ang mga nagdadala sa kanila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga musmos.” Ang salitang Griyego ay tumutukoy sa napakabatang mga bata, partikular sa mga sanggol.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, ang mga taong nagdadala ng mga sanggol kay Jesus.
    reason: referent_clarification
  - marker: c
    text: Sa mga kapantay na salaysay, ang paghipo ni Jesus ay kaugnay ng pagpapala at pagpapatong ng mga kamay sa mga bata (tingnan ang Mat. 19:13; Mar. 10:13, 16).
    reason: cross_reference
lexical_decisions:
- source_word: Προσέφερον
  choice: Dinadala
  rationale: Ang imperpektong panahunan ay nagpapahiwatig ng nagpapatuloy o paulit-ulit na pagkilos; natural itong ipinahahayag sa Filipino sa pamamagitan ng aspektong imperpektibo.
- source_word: δὲ
  choice: Ngunit
  rationale: Mahinang pang-ugnay ito sa unang sugnay ngunit may malinaw na paghahambing o pagsalungat bago ang tugon ng mga alagad; inilagay ang “Ngunit” sa simula ng ikalawang pangungusap, kung saan natural ang puwersa nito sa Filipino.
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Pinananatili ang panghalip ng Griyego; malinaw sa konteksto na si Jesus ang tinutukoy.
- source_word: καὶ
  choice: maging ang
  rationale: Ipinahahayag ang pagbibigay-diin na pati napakabatang mga bata—mga sanggol—ay dinadala sa kanya.
- source_word: τὰ βρέφη
  choice: mga sanggol
  rationale: Ang βρέφη ay tumutukoy sa napakabatang mga bata, partikular sa mga sanggol; mas tiyak ito kaysa sa pangkalahatang “mga bata.”
- source_word: ἵνα
  choice: upang
  rationale: Malinaw at marangal na panandang Filipino para sa layunin.
- source_word: αὐτῶν ἅπτηται
  choice: hipuin niya ang mga ito
  rationale: Ang ἅπτομαι ay nangangahulugang “humipo.” Hindi isiningit sa pangunahing teksto ang interpretasyong “pagpalain,” bagaman kaugnay iyon sa mga kapantay na salaysay.
- source_word: ἰδόντες
  choice: nang makita iyon
  rationale: Natural na temporal na pagsasalin ng aorist participle; ang “iyon” ay tumutukoy sa pagdadala ng mga sanggol kay Jesus.
- source_word: οἱ μαθηταὶ
  choice: mga alagad
  rationale: Tuwirang katumbas ng pariralang Griyego; hindi idinagdag ang “niya” sapagkat hindi ito tahasang nasa teksto.
- source_word: ἐπετίμων
  choice: sinaway
  rationale: Ipinahahayag ang matinding pagpigil o pagsita ng ἐπιτιμάω sa natural na modernong Filipino.
- source_word: αὐτοῖς
  choice: ang mga nagdadala sa kanila
  rationale: Nililinaw sa pangunahing teksto ang pinakanatural na tinutukoy ng panghalip—ang mga taong nagdadala sa mga sanggol—upang maiwasan ang di-likas at malabong sunod-sunod na panghalip sa Filipino.
theological_decisions:
- issue: Ang layunin ng paghipo ni Jesus sa mga sanggol
  choice: hipuin niya ang mga ito
  alternative: pagpalain niya sila / ipatong niya sa kanila ang kanyang mga kamay
  rationale: Ang mismong pandiwa sa Lucas ay ἅπτηται, “humipo.” Hindi dapat ipalit sa pangunahing teksto ang mas ganap na paglalarawan mula sa mga kapantay na salaysay, bagaman maaari itong banggitin sa talababa.
- issue: Tinutukoy ng αὐτοῖς
  choice: mga nagdadala sa kanila
  alternative: mga sanggol
  rationale: Sa daloy ng pangyayari, ang mga taong lumalapit at nagdadala sa mga sanggol ang pinakanatural na sinasaway ng mga alagad. Pinananatili sa talababa ang paglilinaw sa antecedent.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga sanggol” para sa katumpakang leksikal, “hipuin” upang mapanatili ang mismong salita ni Lucas, at “sinaway” para sa lakas ng pandiwang ἐπιτιμάω. Hinati sa dalawang pangungusap upang maging natural ang salaysay sa Filipino nang hindi binabago ang ugnayan ng mga sugnay.
