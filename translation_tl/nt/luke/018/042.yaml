lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang payak na pang-ugnay sa salaysay nang hindi nagdaragdag ng ugnayang tulad ng sanhi o bunga.
- source_word: εἶπεν αὐτῷ
  choice: sinabi ni Jesus sa kanya
  rationale: Likas at tuwirang pagpapahayag ng panimulang sugnay sa pagsasalita, kasama ang di-tuwirang layon na αὐτῷ.
- source_word: Ἀνάβλεψον
  choice: Makakita kang muli
  rationale: Sa konteksto ng pagpapagaling sa bulag, tumutukoy ang pandiwa sa panunumbalik ng paningin, hindi lamang sa pagtingala. Malinaw at natural ang pautos na Filipino.
- source_word: πίστις
  choice: pananampalataya
  rationale: Dito ay tumutukoy sa pagtitiwala ng lalaki kay Jesus. Ang “pananampalataya” ang karaniwang saling nagpapanatili rin sa teolohikal na bigat ng salita.
- source_word: σέσωκέν σε
  choice: ang nagligtas sa iyo
  rationale: Maaaring tumukoy ang σῴζω sa pagliligtas o pagpapagaling. Pinananatili ng “nagligtas” ang mas malawak na diwa at ang tensiyon sa pagitan ng pisikal na paggaling at ganap na kaligtasan.
theological_decisions:
- issue: Saklaw ng σῴζω sa isang salaysay ng pagpapagaling
  choice: nagligtas sa iyo
  alternative: nagpagaling sa iyo / nagpanumbalik ng iyong kalusugan
  rationale: Malinaw na kasangkot sa konteksto ang pisikal na paggaling, ngunit maaaring saklawin ng pandiwa ang higit na malawak na kaligtasan. Hindi nililimitahan ng pangunahing salin ang pahayag sa paggaling lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Makakita kang muli” bilang natural na pautos, at pinanatili ang “nagligtas” upang huwag paliitin ang tunay na saklaw ng σῴζω.
