  text: And Jesus said to him[a], “Receive your sight[b]; your faith has saved you.”
translation:
  language: tl
  text: At sinabi ni Jesus sa kanya, “Manumbalik ang iyong paningin[a]. Ang pananampalataya mo ang nagligtas sa iyo[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Makakita kang muli.” Sa kontekstong ito, ang salitang Griyego ay maaaring tumukoy sa muling pagkakita o sa pagbawi ng paningin.
    reason: lexical_alternative
  - marker: b
    text: O “ang nagpagaling sa iyo” o “ang nagpaling sa iyo.” Ang pandiwang Griyego ay maaaring tumukoy kapuwa sa pagpapagaling at sa pagliligtas.
