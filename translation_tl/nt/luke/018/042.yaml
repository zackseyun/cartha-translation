  source_fidelity: 'Tumpak ang pangunahing diwa ng talata: ang utos na mabawi ang paningin at ang pahayag na ang pananampalataya ng lalaki ay nagligtas sa kanya. Gayunman, ang “Makakita kang muli” ay hindi gaanong likas bilang tuwirang pautos sa modernong Filipino; mas malinaw na ipinapahayag ng “Manumbalik ang iyong paningin” ang ἀνάβλεψον sa kontekstong ito nang hindi ipinagpapalagay na mayroon siyang dating paningin. Ang “nagligtas sa iyo” ay angkop para sa perpektong σέσωκέν σε at pinananatili ang saklaw na maaari ring tumukoy sa paggaling.'
  naturalness: Ang “At sinabi ni Jesus sa kanya” at “Ang pananampalataya mo ang nagligtas sa iyo” ay malinaw at marangal. Ang pautos na “Makakita kang muli” ay nauunawaan, ngunit medyo pilit sa Filipino at maaaring magtunog paglalarawan kaysa agarang pagpapahayag ng pagpapagaling. “Manumbalik ang iyong paningin” ay mas idiomatiko at angkop sa register.
  terminology: Ang “pananampalataya” para sa πίστις at “nagligtas” para sa σῴζω ay wasto at nagpapanatili ng teolohikal at semantikong lawak ng Griyego. Ang pangalang “Jesus” ay naaayon sa modernong Filipino gamit. Ang mga talababa ay dapat iayon sa bagong pangunahing salin at iwasang gawing pangunahing alternatibo ang “nagpanumbalik ng iyong kalusugan,” na mas malayo sa tuwirang saklaw ng σῴζω kaysa “gumaling” o “nagpagaling.”
