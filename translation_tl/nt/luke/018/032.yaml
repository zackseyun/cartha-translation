  text: παραδοθήσεται γὰρ τοῖς ἔθνεσιν καὶ ἐμπαιχθήσεται καὶ ὑβρισθήσεται καὶ ἐμπτυσθήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/032.yaml
  text: For he will be handed over to the Gentiles and will be mocked and insulted and spit on[b][a],
translation:
  language: tl
  text: Sapagkat ibibigay siya sa mga Hentil[a], at siya’y kukutyain, iinsultuhin[b], at duduraan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga bansa.” Dito, ang tinutukoy ay ang mga hindi Judio, samakatuwid ay ang mga Hentil.
    reason: lexical_alternative
  - marker: b
    text: O “tatratuhin nang kahiya-hiya” o “aapihin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδοθήσεται
  choice: ibibigay
  rationale: Pinananatili nito ang malawak na diwa at anyong balintiyak ng παραδίδωμι—ang paglalagay sa kanya sa kapangyarihan ng iba—nang hindi ito nililimitahan sa pagtataksil o kusang pagsuko.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikita nito ang paliwanag na kaugnayan ng talata sa naunang pahayag tungkol sa mangyayari sa Anak ng Tao.
- source_word: τοῖς ἔθνεσιν
  choice: sa mga Hentil
  rationale: Sa kontekstong ito, ang ἔθνη ay tumutukoy sa mga hindi Judio, lalo na sa mga awtoridad na hindi Judio, hindi lamang sa mga bansa bilang mga politikal na pangkat.
- source_word: ἐμπαιχθήσεται
  choice: kukutyain
  rationale: Likas at mabigat na katumbas ito ng paglibak o panunuya sa isang tao.
- source_word: ὑβρισθήσεται
  choice: lalapastanganin
  rationale: Saklaw nito ang kahiya-hiya at mapang-abusong pagtrato, hindi lamang ang pasalitang pang-iinsulto; pinananatili rin nito ang tindi ng pandiwa sa konteksto.
- source_word: ἐμπτυσθήσεται
  choice: duraan
  rationale: Ito ang tuwiran at likas na salin ng kongkretong gawa ng pagdura sa isang tao, at pinananatili ang anyong balintiyak.
theological_decisions:
- issue: Ang tinutukoy na simuno ng mga pandiwang balintiyak
  choice: Ginamit ang “siya,” na tumutukoy sa Anak ng Tao sa naunang talata.
  alternative: Ulitin ang “Anak ng Tao.”
  rationale: Walang hayag na simuno sa Griyego, ngunit malinaw ang tinutukoy mula sa Lucas 18:31. Ang “siya” ay natural sa Tagalog at hindi nagdaragdag ng bagong teolohikal na pagpapakahulugan.
- issue: Lawak ng kahulugan ng ὑβρισθήσεται
  choice: lalapastanganin
  alternative: iinsultuhin; tratuhin nang kahiya-hiya
  rationale: Pinananatili ng “lalapastanganin” ang posibilidad na kasama rito kapwa ang pang-iinsulto at mas malawak na mapanghamak o kahiya-hiyang pagtrato, sa halip na tahimik na limitahan ito sa mga salita lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang magkakasunod na mga pandiwang balintiyak at ang tumitinding paglalarawan ng paghamak, habang iniwasan ang masyadong arkaiko o denominasyonal na pananalita.
