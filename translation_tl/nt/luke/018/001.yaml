  source_fidelity: 'Tumpak na naihahatid ng salin ang pangunahing diwa ng Griyego: si Jesus ay nagsasalita ng isang talinghaga sa mga tao upang ituro ang pangangailangang patuloy na manalangin at huwag masiraan ng loob. Ang “dapat silang laging manalangin” ay sapat na kumakatawan sa δεῖν, at ang “huwag panghinaan ng loob” ay natural at tapat sa μὴ ἐγκακεῖν.'
  naturalness: Malinaw, natural, at marangal ang daloy sa makabagong Filipino Tagalog. Ang “isang talinghaga,” “laging manalangin,” at “panghinaan ng loob” ay pamilyar at angkop sa rehistrong biblikal nang hindi lipas.
  terminology: Ang “talinghaga” para sa παραβολή at “manalangin” para sa προσεύχεσθαι ay pare-pareho at angkop. Hindi lumalampas ang “dapat” sa puwersa ng δεῖν o nagdadagdag ng doktrinal na pagbasa. Maayos ding pinananatili ng talababa ang alternatibong pagbasa ng πρὸς τὸ δεῖν bilang paksa/pangangailangan.
