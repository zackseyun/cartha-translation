  text: Ἔλεγεν ⸀δὲ παραβολὴν αὐτοῖς πρὸς τὸ δεῖν πάντοτε προσεύχεσθαι ⸀αὐτοὺς καὶ μὴ ἐγκακεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/001.yaml
  text: He was telling them a parable about their need to pray always and not lose heart,[a]
translation:
  language: tl
  text: Isinalaysay niya sa kanila ang isang talinghaga upang ipakitang dapat silang laging manalangin at huwag panghinaan ng loob.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “tungkol sa pangangailangan nilang laging manalangin at huwag panghinaan ng loob.”
    reason: Pinananatili ang alternatibong pag-unawa sa πρὸς τὸ δεῖν bilang pagtukoy sa paksa o pangangailangan, sa halip na tahasang layunin.
lexical_decisions:
- source_word: Ἔλεγεν
  choice: Isinalaysay niya
  rationale: Ipinahihiwatig ng imperpektong anyo ang nagpapatuloy o panimulang salaysay sa nakaraan. Likas sa Tagalog ang “isinalaysay niya” sa kontekstong ito, nang hindi pinabibigat ang pangungusap sa “patuloy niyang isinasalaysay.”
- source_word: δὲ
  choice: hindi tahasang isinalin
  rationale: Banayad na pang-ugnay ito. Hindi kailangan ng tahasang katumbas sa Tagalog dito, at ang “pagkatapos” o “ngayon” ay maaaring magdagdag ng ugnayang temporal na wala sa Griyego.
- source_word: παραβολὴν
  choice: isang talinghaga
  rationale: Karaniwan, malinaw, at angkop na katawagan para sa παραβολή sa mga Ebanghelyo.
- source_word: αὐτοῖς
  choice: sa kanila
  rationale: Tuwirang kumakatawan sa di-tuwirang layon ng pandiwang ἔλεγεν.
- source_word: πρὸς τὸ δεῖν
  choice: upang ipakitang dapat
  rationale: Ang πρὸς τό na may pawatas ay maaaring magpahayag ng layunin o paksa/patungkol. Ang “upang ipakitang dapat” ay natural sa Tagalog at malinaw na naghahatid ng layuning nagpapaliwanag ng talinghaga, habang inilalagay sa talababa ang alternatibong pagbasa na “tungkol sa pangangailangan.”
- source_word: πάντοτε
  choice: laging
  rationale: Direkta at natural na katumbas na nagpapahayag ng patuloy na pagtitiyaga, hindi kinakailangang walang tigil na pagbigkas ng panalangin.
- source_word: προσεύχεσθαι
  choice: manalangin
  rationale: Pamantayan at likas na salin ng pandiwa sa kontekstong ito.
- source_word: αὐτοὺς
  choice: sila
  rationale: Ito ang simuno ng mga pawatas sa di-tuwirang pahayag at natural na inilalahad bilang “sila” sa sugnay na Tagalog.
- source_word: μὴ ἐγκακεῖν
  choice: huwag panghinaan ng loob
  rationale: Napananatili nito ang diwa ng hindi pagkawala ng tapang o hindi pagsuko dahil sa panghihina ng loob; natural din itong idyoma sa makabagong Tagalog.
theological_decisions:
- issue: Lakas ng pangangailangan o pananagutan na patuloy na manalangin
  choice: dapat silang laging manalangin
  alternative: kailangan nilang laging manalangin
  rationale: Ipinahahayag ng δεῖν ang pangangailangan o nararapat gawin. Ang “dapat” ay nagpapanatili ng puwersang mapanghikayat at moral nang hindi nagdaragdag ng isang partikular na doktrina tungkol sa bisa ng panalangin.
- issue: Ugnayan ng talinghaga sa paliwanag ng tagapagsalaysay
  choice: upang ipakitang
  alternative: tungkol sa pangangailangan nilang
  rationale: Pinahihintulutan ng πρὸς τὸ + pawatas ang pagbasa bilang layunin, ngunit maaari rin itong unawain bilang pagtukoy sa paksa. Pinili sa teksto ang mas natural na layuning pahayag at itinabi sa talababa ang tunay na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “talinghaga” at “manalangin” bilang pamilyar na bokabularyong biblikal, ngunit iniwasan ang lipas o labis na pormal na ayos ng pangungusap.
