base_translation:
  language: en
  yaml_path: translation/nt/luke/018/025.yaml
  text: For it is easier for a camel to enter through the eye of a needle than for a rich man to enter the kingdom of God[a][b].
translation:
  language: tl
  text: Sapagkat mas madali pang makadaan ang isang kamelyo sa butas ng karayom kaysa makapasok ang isang mayaman sa kaharian ng Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: May mga nagmungkahi na tumutukoy ito sa isang makipot na pintuang tinatawag na “Butas ng Karayom,” o na “lubid” ang ibig sabihin sa halip na “kamelyo.” Ngunit “kamelyo” ang mababasa sa tekstong Griyego rito.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐκοπώτερον γάρ ἐστιν
  choice: Sapagkat mas madali pang
  rationale: Pinananatili ng “sapagkat” ang paliwanag na ugnayan sa naunang konteksto, at likas sa Tagalog ang “mas madali pang” sa paghahambing.
- source_word: κάμηλον
  choice: ang isang kamelyo
  rationale: Ang karaniwang kahulugan ng κάμηλος ay “kamelyo”; walang sapat na batayang tekstuwal upang palitan ito ng “lubid.”
- source_word: διὰ τρήματος βελόνης
  choice: sa butas ng karayom
  rationale: Ito ang natural at tumpak na katumbas sa Tagalog ng literal na “sa pamamagitan ng butas ng isang karayom.”
- source_word: εἰσελθεῖν
  choice: makapasok
  rationale: Ang anyong “makapasok” ay malinaw at natural para sa infinitibong εἰσελθεῖν at angkop sa dalawang panig ng paghahambing.
- source_word: πλούσιον
  choice: ang isang mayaman
  rationale: Ang pang-uring Griyego ay ginamit bilang pangngalan. Sa Tagalog, ang “isang mayaman” ay natural, tumutukoy sa isang taong mayaman, at hindi kailangang magdagdag ng kasariang hindi mahalaga sa diwa.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: sa kaharian ng Diyos
  rationale: Pinananatili ang mahalagang pariralang biblikal na “kaharian ng Diyos”; sapat na ipinahihiwatig ng “makapasok sa” ang direksiyonal na diwa ng εἰς.
theological_decisions:
- issue: Pagpapakahulugan sa larawan ng kamelyo at butas ng karayom
  choice: Pinanatili ang tuwirang larawang “kamelyo ... sa butas ng karayom.”
  alternative: Ipaliwanag ito bilang makipot na pintuang tinatawag na “Butas ng Karayom,” o gawing “lubid” ang “kamelyo.”
  rationale: Malinaw na κάμηλον (“kamelyo”) ang nasa ibinigay na tekstong Griyego. Ang imposible at mariing larawan ay hindi dapat pahinain sa pamamagitan ng mga paliwanag na walang batayang tekstuwal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang idyomang “butas ng karayom” at pinanatili ang matinding paghahambing ng orihinal.
