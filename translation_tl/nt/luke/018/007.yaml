  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς οὐ μὴ ποιήσῃ τὴν ἐκδίκησιν τῶν ἐκλεκτῶν αὐτοῦ τῶν βοώντων ⸀αὐτῷ ἡμέρας καὶ νυκτός, καὶ ⸀μακροθυμεῖ ἐπ’ αὐτοῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/007.yaml
  text: And will not God bring justice for his chosen ones[a], who cry out to him day and night? Will he delay long over them?
translation:
  language: tl
  text: At hindi ba igagawad ng Diyos ang katarungan sa mga hinirang niya, na dumaraing sa kanya araw at gabi? Magtatagal ba siyang kumilos alang-alang sa kanila?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “kahit matiyaga siya sa kanila,” o “at matiyaga ba siya sa kanila?” Ang pariralang Griyego ay maaari ring unawain bilang pagtitiyaga o mahabang pagtitiis sa halip na pagkaantala.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκδίκησιν
  choice: igagawad ... ang katarungan
  rationale: Ipinapahayag nito ang pagbibigay ng makatarungang tugon o pagtatanggol sa karapatan sa konteksto ng hukom, hindi ang personal na paghihiganti.
- source_word: ἐκλεκτῶν
  choice: mga hinirang niya
  rationale: Malinaw na ipinakikitang ang pang-uri ay tumutukoy sa mga taong pinili ng Diyos, nang hindi nagdaragdag ng paliwanag na nakatali sa isang partikular na doktrina.
- source_word: βοώντων
  choice: dumaraing
  rationale: Likas sa makabagong Tagalog at nagpapahiwatig ng marubdob at paulit-ulit na pagsusumamo, gaya ng hinihingi ng konteksto.
- source_word: ἡμέρας καὶ νυκτός
  choice: araw at gabi
  rationale: Pinananatili ang tahasang temporal na idyoma at ang diwa ng patuloy na pagdaing.
- source_word: μακροθυμεῖ ἐπ’ αὐτοῖς
  choice: Magtatagal ba siyang kumilos alang-alang sa kanila?
  rationale: Sa daloy patungo sa mabilis na paggawad ng katarungan sa talata 8, natural itong mababasa bilang tanong tungkol sa pagkaantala ng pagkilos. Inilalagay sa talababa ang tunay na posibilidad na ang parirala ay tumutukoy sa pagtitiyaga o mahabang pagtitiis.
- source_word: οὐ μὴ ποιήσῃ
  choice: hindi ba igagawad
  rationale: Ang retorikal na tanong ay umaasa sa sagot na oo at likas na naihahatid sa Tagalog sa anyong “hindi ba,” habang nananatili ang mariing puwersa ng Griyego.
- source_word: θεὸς
  choice: Diyos
  rationale: Karaniwang salin sa Tagalog; walang kailangang idagdag na natatanging pakahulugan mula sa pantukoy.
theological_decisions:
- issue: Kahulugan ng μακροθυμεῖ ἐπ’ αὐτοῖς kaugnay ng pagkilos at pagtitiyaga ng Diyos
  choice: 'Ginawang tanong tungkol sa pagtatagal bago kumilos: “Magtatagal ba siyang kumilos alang-alang sa kanila?”'
  alternative: “kahit matiyaga siya sa kanila” o “at patuloy ba siyang magtitiis dahil sa kanila?”
  rationale: Pinapaboran ng kasunod na katiyakan ng mabilis na katarungan ang diwa ng pagkaantala, ngunit maaaring tumukoy ang pandiwa sa pagtitiyaga o mahabang pagtitiis. Pinananatili ng talababa ang semantiko at teolohikal na tensiyon.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “dumaraing” para sa marubdob na panawagan at “mga hinirang” para sa malinaw ngunit hindi sektaryong pagtukoy sa mga pinili ng Diyos.
