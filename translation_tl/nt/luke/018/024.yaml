id: LUK.18.24
reference: Luke 18:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ αὐτὸν ὁ ⸀Ἰησοῦς εἶπεν· Πῶς δυσκόλως οἱ τὰ χρήματα ἔχοντες ⸂εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσπορεύονται⸃·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/024.yaml
  text: And Jesus[a], seeing him, said, “How difficult it is for those who have wealth to enter into the kingdom of God!”
translation:
  language: tl
  text: Nang makita siya ni Jesus, sinabi niya, “Napakahirap para sa mga may kayamanan[a] na makapasok sa kaharian ng Diyos!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “salapi” o “mga ari-arian.”
    reason: 'Iba''t ibang magkakaugnay na diwa ng χρήματα ang maaaring mangibabaw: salapi, ari-arian, o kayamanan sa mas malawak na kahulugan.'
lexical_decisions:
- source_word: Ἰδὼν
  choice: Nang makita
  rationale: Ang aorist participle ng ὁράω ay likas na naipapahayag sa Tagalog bilang sugnay na panahunan; pinananatili nito ang kaugnayan ng pagkakita ni Jesus sa kasunod niyang pagsasalita.
- source_word: δὲ
  choice: hindi hiwalay na isinalin
  rationale: Mahinang pang-ugnay ito sa pagpapatuloy ng salaysay. Sa Tagalog, sapat nang ipahiwatig ng maayos na daloy ng pangungusap ang tungkulin nito; ang sapilitang “at” o “ngunit” ay maaaring maging mabigat o magdagdag ng di-kailangang pagsalungat.
- source_word: αὐτὸν
  choice: siya
  rationale: Tumutukoy ang panghalip sa mayamang pinuno sa konteksto.
- source_word: Πῶς δυσκόλως
  choice: Napakahirap
  rationale: Ipinahahayag ng parirala ang matinding antas sa paraang padamdam. Ang “Napakahirap” ay natural, malinaw, at hindi pinaiigting tungo sa ganap na imposibilidad.
- source_word: οἱ τὰ χρήματα ἔχοντες
  choice: mga may kayamanan
  rationale: Saklaw ng χρήματα ang salapi, ari-arian, o yaman. Ang “mga may kayamanan” ay natural sa modernong Tagalog at pinananatili ang paglalarawan sa mga taong nagtataglay nito, sa halip na gawing isang ganap na katawagang-uri lamang.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: sa kaharian ng Diyos
  rationale: Karaniwan at malinaw na katumbas sa Tagalog. Bagaman may εἰς na nagpapahiwatig ng pagpasok tungo sa loob, sapat na itong naipahahayag ng pandiwang “makapasok” kasama ng “sa.”
- source_word: εἰσπορεύονται
  choice: makapasok
  rationale: Ang anyong pangkasalukuyan ng εἰσπορεύομαι ay natural na isinasama sa hulma ng Tagalog na “mahirap para sa … na makapasok,” na pinananatili ang diwa ng pagpasok nang hindi lumilikha ng alanganing sugnay.
theological_decisions:
- issue: Lakas ng sinabi ni Jesus tungkol sa mayayaman at sa kaharian ng Diyos
  choice: Pangkalahatang pahayag na napakahirap para sa mga may kayamanan na makapasok sa kaharian ng Diyos
  alternative: Ganap na imposibleng makapasok ang sinumang mayaman
  rationale: Ang Πῶς δυσκόλως ay nagsasaad ng matinding kahirapan, hindi pa ng tahasang imposibilidad. Pinananatili ng salin ang tensiyon ng talata nang hindi inuunahan ang paglilinaw sa kasunod na konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “Nang makita siya ni Jesus” bilang likas na Tagalog para sa participial construction, at “Napakahirap” upang mapanatili ang padamdam at diin ng Griyego.
