  source_fidelity: Tumpak na naihahatid ng salin ang ugnayang pandiwa ng Ἰδὼν, ang tinutukoy na “siya,” ang mariing Πῶς δυσκόλως, ang mas malawak na kahulugan ng χρήματα, at ang pagpasok sa kaharian ng Diyos. Ang “Nang makita siya ni Jesus, sinabi niya” ay isang likas na Tagalog na pagsasaayos ng participial construction. Hindi nito ginagawang imposible ang ipinahayag na mahirap lamang sa talata.
  naturalness: 'Natural at malinaw ang modernong Tagalog: “Napakahirap para sa mga may kayamanan na makapasok sa kaharian ng Diyos.” Ang “mga may kayamanan” ay katanggap-tanggap na marangal na rehistro at pinananatili ang ideya ng mga taong nagtataglay ng yaman, sa halip na isang simpleng label na “mayayaman.”'
