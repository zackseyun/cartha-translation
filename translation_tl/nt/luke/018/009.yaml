  text: Εἶπεν δὲ ⸀καὶ πρός τινας τοὺς πεποιθότας ἐφ’ ἑαυτοῖς ὅτι εἰσὶν δίκαιοι καὶ ἐξουθενοῦντας τοὺς λοιποὺς τὴν παραβολὴν ταύτην·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/009.yaml
  text: And he also told this parable to some who trusted in themselves that they were righteous and treated the rest with contempt:[a]
translation:
  language: tl
  text: Isinalaysay rin niya ang talinghagang ito sa ilang taong nagtitiwala sa sarili nilang pagiging matuwid at humahamak sa iba:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “minamaliit ang iba” o “mababa ang tingin sa iba.”
    reason: Nagbibigay ng mga natural na alternatibong salin para sa ἐξουθενοῦντας, na may diwang ituring ang iba na walang halaga o mababa.
lexical_decisions:
- source_word: Εἶπεν
  choice: Sinabi ... ang talinghagang ito
  rationale: Ang λέγω ay maaaring mangahulugang “sabihin” o “isalaysay.” Dahil talinghaga ang layon, ang ayos na “sinabi ... ang talinghagang ito” ay malinaw at pinananatili ang payak na puwersa ng pandiwa.
- source_word: δὲ καὶ
  choice: rin
  rationale: Ang δέ ay banayad na pang-ugnay at ang καί ay nagpapahiwatig ng karagdagang pagtuturo. Sa kontekstong Tagalog, sapat at natural na naihahatid ng “rin” ang pagpapatuloy at pagdaragdag nang hindi nagpapahiwatig ng matinding pagsalungat.
- source_word: πρός τινας
  choice: sa ilang taong
  rationale: Ang πρός kasunod ng pandiwa ng pagsasalita ay tumutukoy sa mga pinatutungkulan. Nilinaw ng “taong” ang tinutukoy ng τινας sa natural na Tagalog.
- source_word: τοὺς πεποιθότας ἐφ’ ἑαυτοῖς
  choice: nagtitiwala sa kanilang sarili
  rationale: Ipinahihiwatig ng perfect participle ang isang matatag o namamalaging pagtitiwala, at malinaw na pinananatili ng “sa kanilang sarili” ang pansariling batayan ng kumpiyansa.
- source_word: ὅτι εἰσὶν δίκαιοι
  choice: na sila ay matuwid
  rationale: Pinananatili ng “matuwid” ang moral at panrelihiyong kahulugan ng δίκαιοι. Hinahayaan nitong ang konteksto, hindi ang salin mismo, ang maghayag ng puna sa kanilang sariling palagay.
- source_word: ἐξουθενοῦντας
  choice: humahamak
  rationale: Ang ἐξουθενέω ay nangangahulugang ituring na walang halaga o hamakin. Ang “humahamak” ay tuwiran, kasalukuyang gamit, at nagpapanatili sa aktibong puwersa ng participle.
- source_word: τοὺς λοιπούς
  choice: sa iba
  rationale: Ang λοιποί ay “ang iba” o “ang mga natitira.” Natural sa Tagalog ang “sa iba”; ang diwa ng paghamak sa mga taong bukod sa kanilang sarili ay malinaw sa konteksto.
- source_word: τὴν παραβολὴν ταύτην
  choice: ang talinghagang ito
  rationale: Ang “talinghaga” ang kinikilalang terminong Tagalog para sa παραβολή sa mga Ebanghelyo at malinaw nitong ipinakikilala ang uri ng salaysay.
theological_decisions:
- issue: Paglalarawan sa δίκαιοι sa konteksto ng pagtitiwala sa sariling katuwiran
  choice: matuwid
  alternative: tama sa harap ng Diyos
  rationale: 'Hindi pejoratibo ang mismong salitang δίκαιοι. Pinananatili ng “matuwid” ang mahalagang bokabularyong teolohikal at ang tunay na tensiyon: inaakala nilang matuwid sila, samantalang ang kasunod na talinghaga ang hahatol sa pag-aakalang iyon.'
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “matuwid” bilang pamilyar na terminong biblikal, habang ang “humahamak” ay tuwiran at madaling maunawaan. Hindi tahasang pinangalanan si Jesus dahil panghalip lamang ang nasa Griyego at malinaw ang tinutukoy mula sa konteksto.
