base_translation:
  language: en
  yaml_path: translation/nt/luke/018/028.yaml
  text: Then Peter said[a], “Look, we have left our own and followed you.”
translation:
  language: tl
  text: Sinabi naman ni Pedro, “Tingnan mo, iniwan namin ang sa amin[a] at kami ay sumunod sa iyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga bagay na pag-aari namin” o “ang aming mga ari-arian.” Malawak ang pariralang Griyego at hindi tiyak na sinasabi kung ano ang iniwan ni Pedro at ng iba pa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ ὁ Πέτρος
  choice: Sinabi naman ni Pedro
  rationale: Ang “sinabi” ay tuwirang katumbas ng aorist na Εἶπεν. Ipinahihiwatig ng “naman” ang banayad na paglipat o pagtugon na dala ng δὲ nang hindi nagpapahiwatig ng matinding pagsalungat.
- source_word: Ἰδοὺ
  choice: Tingnan mo
  rationale: Isa itong panawag-pansin. Natural sa makabagong Tagalog ang “Tingnan mo” at pinananatili nito ang tuwirang pakikipag-usap ni Pedro kay Jesus.
- source_word: ἡμεῖς
  choice: namin
  rationale: Ang tahasang panghalip sa Griyego ay may diin. Sa Tagalog, likas na naipahahayag ang paksa sa anyong “namin,” at malinaw sa konteksto na si Pedro at ang ibang alagad ang tinutukoy.
- source_word: ἀφέντες
  choice: iniwan
  rationale: Ang ganap na aspekto ng “iniwan” ay angkop sa natapos na pagkilos ng aorist participle. Hindi ginamit ang mas matinding “tinalikuran,” na maaaring magdagdag ng di-kinakailangang pahiwatig.
- source_word: τὰ ἴδια
  choice: ang sa amin
  rationale: Malawak ang saklaw ng pariralang Griyego—mga bagay o anumang nauukol sa kanila—kaya pinanatiling bukás ang kahulugan sa halip na limitahan sa ari-arian, tahanan, o pamilya.
- source_word: ἠκολουθήσαμέν σοι
  choice: sumunod sa iyo
  rationale: Karaniwang pandiwa ito para sa aktuwal na pagsunod at pagiging alagad. Ang “sumunod sa iyo” ay natural at pinananatili ang kahulugang ito nang walang dagdag na pagpapaliwanag.
theological_decisions:
- issue: Saklaw ng iniwan ng mga alagad
  choice: ang sa amin
  alternative: ang aming mga ari-arian
  rationale: Hindi espesipikong tinutukoy ng τὰ ἴδια kung ari-arian lamang, tahanan, kabuhayan, o iba pang nauukol sa kanila. Pinanatili ng salin ang sadyang malawak na pahayag.
translation_notes:
  register: Makabago, natural, at marangal na Tagalog. Ginamit ang “Tingnan mo” bilang buhay ngunit hindi makalumang panawag-pansin, at ang “ang sa amin” upang mapanatili ang lawak at bahagyang pagiging di-tiyak ng orihinal.
