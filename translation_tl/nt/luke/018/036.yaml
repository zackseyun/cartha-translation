  text: And hearing a crowd passing by[a], he was asking what this meant.
translation:
  language: tl
  text: Nang marinig niya ang isang pulutong na dumaraan, nagtatanong siya kung ano iyon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “nagsimula siyang magtanong kung ano iyon” o “paulit-ulit siyang nagtanong kung ano iyon.” Maaaring ipahiwatig ng anyong imperfect ng pandiwa ang nagsisimula o patuloy/paulit-ulit na pagtatanong. Ang optative sa di-tuwirang tanong ay maaari ring magpahiwatig ng bahagyang pag-aalinlangan: “kung ano kaya iyon.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: Nang marinig niya
  rationale: Ginawang sugnay na pamanahon ang aorist participle upang maging natural sa Tagalog habang pinananatili ang ugnayang pangyayari sa pangunahing pandiwa.
- source_word: δὲ
  choice: hindi tahasang isinalin
  rationale: Mahinang pang-ugnay ito sa salaysay; sapat nang ipinahihiwatig ng daloy ng Tagalog ang pagpapatuloy, at magiging mabigat ang tahasang “at” dito.
- source_word: ὄχλου διαπορευομένου
  choice: may isang pulutong na dumaraan
  rationale: Ipinapahayag nito ang narinig niya—ang patuloy na pagdaan ng isang pulutong. Ang “may” ay natural sa Tagalog para sa anarthrous na ὄχλου.
- source_word: ἐπυνθάνετο
  choice: itinanong niya
  rationale: Natural na katumbas ng pandiwang pagtatanong sa kontekstong ito. Maaaring ipahiwatig ng imperfect ang patuloy o paulit-ulit na pagtatanong, ngunit hindi kailangang gawing tahasan sa pangunahing teksto.
- source_word: τί εἴη τοῦτο
  choice: kung ano iyon
  rationale: Direktang pinananatili ang di-tuwirang tanong at ang payak na kahulugan ng τοῦτο, nang hindi ito binibigyang-kahulugang “ano ang ibig sabihin nito.”
