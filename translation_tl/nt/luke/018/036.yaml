translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “pulutong” bilang pangkaraniwang salitang angkop sa salaysay; iniwasan ang mas interpretatibong “kung ano ang ibig sabihin nito.”
