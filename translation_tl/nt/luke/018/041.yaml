  text: “What do you want me to do for you?” And he said[a], “Lord[b], that I may see again.”
translation:
  language: tl
  text: “Ano ang gusto mong gawin ko para sa iyo?” Sumagot siya, “Panginoon[a], sana’y makakita akong muli[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Ginoo”; ang salitang Griego na κύριε ay maaaring isang magalang na paraan ng pagtawag, bagaman karaniwang isinasalin itong “Panginoon.”
    reason: alternative_reading
  - marker: b
    text: Maaari ring “manumbalik ang aking paningin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί
  choice: Ano
  rationale: Ang interrogative pronoun ay nagtatanong kung anong tiyak na bagay ang hinihiling ng lalaki.
- source_word: σοι
  choice: para sa iyo
  rationale: Ang datibo kasama ng ποιήσω ay may diwang benepaktibo at likas na ipinapahayag sa Filipino bilang “para sa iyo.”
- source_word: θέλεις
  choice: gusto mong
  rationale: Malinaw at pangkaraniwang modernong Filipino ito para sa pagpapahayag ng kagustuhan sa tuwirang usapan.
- source_word: ποιήσω
  choice: gawin ko
  rationale: Likas na inililipat sa Filipino ang konstruksyon bilang “gusto mong gawin ko,” na pinananatili ang diwa ng tanong.
- source_word: ὁ δὲ εἶπεν
  choice: Sumagot siya
  rationale: Sa konteksto ng tuwirang tanong, likas na salaysay sa Filipino ang “Sumagot siya”; hindi malakas na pasalungat ang δέ rito.
- source_word: Κύριε
  choice: Panginoon
  rationale: Pinananatili nito kapuwa ang magalang na pagtawag kay Jesus at ang posibleng mas malalim na pagkilala sa kaniya, nang hindi nilulutas ang ambiguwidad.
- source_word: ἵνα ἀναβλέψω
  choice: gusto kong makakita muli
  rationale: Bagaman literal na sugnay ng nilalaman o layunin ang ἵνα, ito ang likas na sagot sa Filipino sa naunang tanong at malinaw na naipapahayag ang kahilingang muling makakita.
theological_decisions:
- issue: Pagtutumbas sa κύριος bilang tuwirang tawag kay Jesus
  choice: Panginoon
  alternative: Ginoo
  rationale: Maaaring simpleng magalang na tawag ang bokatibong κύριε, ngunit maaari rin itong magpahiwatig ng higit na pagkilala kay Jesus. Ang “Panginoon” ay nagpapanatili sa teolohikal na posibilidad na ito, samantalang inilalahad sa talababa ang mas payak na pagbasa.
translation_notes:
  register: Gumamit ng natural, kasalukuyan, at magalang na Filipino. Ang “gusto” ay mas karaniwan kaysa “nais” sa tuwirang pag-uusap, samantalang ang “Panginoon” ay nagpapanatili ng marangal at teolohikal na bukas na pagtawag. Inilagay ang mga pananda ng talababa kaagad pagkatapos ng mga salitang tinutukoy ng mga ito.
