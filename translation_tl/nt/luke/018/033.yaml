id: LUK.18.33
reference: Luke 18:33
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ μαστιγώσαντες ἀποκτενοῦσιν αὐτόν, καὶ τῇ ἡμέρᾳ τῇ τρίτῃ ἀναστήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/033.yaml
  text: And after flogging him[a], they will kill him, and on the third day he will rise.
translation:
  language: tl
  text: At matapos nila siyang hagupitin, papatayin nila siya, at sa ikatlong araw ay babangon siya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “bubuhayin siyang muli.” Mas tuwirang sinasabi ng Griyego rito, “babangon siya.”
    reason: alternative_reading
lexical_decisions:
- source_word: μαστιγώσαντες
  choice: matapos nila siyang hagupitin
  rationale: Ang aorist participle ay nagpapahiwatig ng kilos na mauuna sa pangunahing pandiwa. Ang “hagupitin” ay natural at malinaw sa modernong Filipino at naipapakita ang marahas na pagpaparusa nang hindi gumagamit ng lipas na salita.
- source_word: ἀποκτενοῦσιν
  choice: papatayin nila siya
  rationale: Tuwirang ipinapahayag ng future active plural ang pagpatay na gagawin ng mga kaaway na tinutukoy sa konteksto. Hindi idinagdag ang moral na kahulugang nasa “papatay nang labag sa batas” o ang mas pormal na “ilalagay sa kamatayan.”
- source_word: αὐτόν
  choice: siya
  rationale: Ang panghalip ay tuwirang layon at tumutukoy kay Jesus, ang Anak ng Tao, ayon sa konteksto.
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: sa ikatlong araw
  rationale: Ito ang natural at nakaugaliang katumbas sa Filipino ng datibong panahunan, nang hindi dinaragdagan ng paliwanag na wala sa teksto.
- source_word: ἀναστήσεται
  choice: babangon siya
  rationale: Ang future middle form ng ἀνίστημι ay pinakamalapit na naihahayag dito bilang intransitibong “babangon.” Pinananatili nito ang anyo ng Griyego at hindi ginagawang tahasang passive ang pangungusap.
theological_decisions:
- issue: Pananalita tungkol sa muling pagkabuhay
  choice: babangon siya
  alternative: bubuhayin siyang muli
  rationale: Ang Griyego ay future middle at mas tuwirang nangangahulugang “babangon siya,” hindi tahasang “bubuhayin siyang muli.” Totoo sa ibang talata na binuhay ng Diyos si Jesus, ngunit hindi iyon dapat ipasok bilang tahasang passive dito. Ang talababa ay nagpapanatili sa lehitimong alternatibong pagkaunawa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “hagupitin” upang ihatid ang brutalidad nang hindi nagiging arkaiko, at pinanatili ang tahasang sunod-sunod na kilos ng orihinal.
