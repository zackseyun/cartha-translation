  text: ὁ δὲ εἶπεν· Τὰ ἀδύνατα παρὰ ἀνθρώποις δυνατὰ ⸂παρὰ τῷ θεῷ ἐστιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/027.yaml
  text: But he said[a], “What is impossible with men is possible with God.”
translation:
  language: tl
  text: Ngunit sinabi niya, “Ang mga bagay na imposible sa tao ay posible sa Diyos.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀδύνατα
  choice: mga bagay na imposible
  rationale: Ang pangmaramihang pang-uring neuter ay ginagamit bilang pangngalan. Likas sa modernong Tagalog ang “mga bagay na imposible” at pinananatili nito ang pangmaramihang anyo ng Griyego.
- source_word: παρὰ ἀνθρώποις
  choice: sa tao
  rationale: Ang παρά na may datibo ay tumutukoy sa larangan o panig kung saan hindi ito magagawa. Ang “sa tao” ay karaniwang pangkalahatang pantukoy sa sangkatauhan at likas na kaagapay ng “sa Diyos.”
- source_word: δυνατὰ
  choice: posible
  rationale: Tuwirang katumbas ito ng ἀδύνατα sa magkatapat na ayos ng pangungusap at malinaw sa ordinaryong modernong Tagalog.
- source_word: παρὰ τῷ θεῷ
  choice: sa Diyos
  rationale: Pinananatili ng “sa Diyos” ang magkatulad na estruktura at matinding paghahambing sa “sa tao,” habang ipinahahayag ang banal na kakayahan.
- source_word: ὁ δὲ εἶπεν
  choice: Ngunit sinabi niya
  rationale: Bahagyang pasalungat ang δέ bilang tugon sa naunang pahayag; natural at marangal ang “Ngunit sinabi niya” sa salaysay.
theological_decisions:
- issue: Saklaw ng posibilidad sa Diyos
  choice: Ipinahahayag ng talata na ang mga bagay na imposible sa larangan ng tao ay posible sa Diyos.
  alternative: Unawain ito bilang isang abstraktong kasabihan tungkol sa lahat ng maiisip na kilos nang walang pagsasaalang-alang sa konteksto.
  rationale: Sa konteksto, pinag-uusapan ang kaligtasan at ang pagpasok ng mayaman sa kaharian ng Diyos. Pinananatili ng salin ang malawak na pahayag at ang tensiyong teolohikal nang hindi nagdaragdag ng pilosopikal na paliwanag na wala sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, maikli, at marangal. Ginamit ang pangkalahatang “tao” para sa ἀνθρώποις upang tumukoy sa sangkatauhan, hindi lamang sa mga lalaki. Pinanatili ang balanseng paghahambing na “sa tao … sa Diyos.”
