  source_fidelity: 'Tumpak na naipapahayag ng salin ang antitesis sa Griyego: ang mga bagay na imposible sa larangan ng tao ay posible sa Diyos. Ang “sa tao … sa Diyos” ay isang likas at balanseng paraan upang isalin ang magkatapat na παρὰ ἀνθρώποις at παρὰ τῷ θεῷ, nang hindi nagpapataw ng mas malawak na doktrinal na pagpapakahulugan.'
