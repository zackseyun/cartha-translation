  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὃς ⸀ἂν μὴ δέξηται τὴν βασιλείαν τοῦ θεοῦ ὡς παιδίον, οὐ μὴ εἰσέλθῃ εἰς αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/017.yaml
  text: Truly I tell you[a], whoever does not receive the kingdom of God like a child will certainly not enter it.
translation:
  language: tl
  text: Tunay na sinasabi ko sa inyo, ang sinumang hindi tumanggap sa kaharian ng Diyos tulad ng isang bata[a] ay tiyak na hindi makapapasok dito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “bilang isang bata.” Maaaring idiin ng parirala ang pagiging bukás tumanggap, pagtitiwala, pagpapakumbaba, o pag-asa ng isang bata sa iba; hindi tinutukoy ng Griyego ang eksaktong katangiang nasa isip.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Tunay
  rationale: Sa panimulang pormula ni Jesus, ipinahahayag nito ang taimtim na katiyakan ng kasunod na sinabi. Ang “Tunay” ay malinaw sa makabagong Tagalog at hindi nangangailangan ng transliterasyong “Amen.”
- source_word: λέγω ὑμῖν
  choice: sinasabi ko sa inyo
  rationale: Likas at tuwirang salin ito ng pormula ng pakikipag-usap sa maramihang tagapakinig.
- source_word: ὃς ἂν
  choice: ang sinuman
  rationale: Ipinahahayag ng kaugnay na panghalip kasama ng ἄν ang isang pangkalahatan at di-tiyak na kondisyon; natural itong naihahatid ng “ang sinuman.”
- source_word: μὴ δέξηται
  choice: hindi tumanggap
  rationale: Maaaring mangahulugan ang δέχομαι ng tumanggap, tanggapin, o malugod na tanggapin. Pinananatili ng “tumanggap” ang larawan ng bukás na pagtanggap nang hindi dinaragdagan ang kahulugan.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: kaharian ng Diyos
  rationale: Ito ang malinaw at nakaugaliang salin na maaaring tumukoy kapuwa sa paghahari ng Diyos at sa saklaw ng kanyang paghahari nang hindi pinipili lamang ang isa.
- source_word: ὡς παιδίον
  choice: tulad ng isang bata
  rationale: Pinananatili nito ang paghahambing sa teksto. Hindi nito tinutukoy kung ang diin ay nasa pagtitiwala, pagpapakumbaba, pagdepende, o pagiging handang tumanggap.
- source_word: οὐ μὴ εἰσέλθῃ
  choice: tiyak na hindi makapapasok
  rationale: Ang οὐ μή kasama ng aorist subjunctive ay mariing pagtanggi. Likas na ipinahahayag sa Tagalog ng “tiyak na hindi makapapasok” ang matinding katiyakang ito.
- source_word: εἰς αὐτήν
  choice: dito
  rationale: Tumutukoy ang panghalip sa kaharian ng Diyos. Ang “dito” ay natural na kasunod ng “makapapasok” at malinaw ang tinutukoy nito.
theological_decisions:
- issue: Kahulugan ng pagtanggap sa kaharian “tulad ng isang bata”
  choice: Pinanatili sa salin ang paghahambing nang hindi tinutukoy ang isang partikular na katangian ng bata.
  alternative: Maaaring unawain bilang pagtanggap nang may pagpapakumbaba, pagtitiwala, pagdepende, o pagiging bukás tumanggap; maaari ring basahin na “bilang isang bata.”
  rationale: Hindi tahasang sinasabi ng Griyego kung aling katangian ng bata ang tinutukoy. Ang pagpapanatili sa larawan ay umiiwas sa pagpasok ng mas makitid na interpretasyong teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang pormal at taimtim na panimula ni Jesus, ang karaniwang katawagang “kaharian ng Diyos,” at ang mariing pagtanggi sa hulihan nang hindi nagiging lipas o labis na teknikal ang pananalita.
