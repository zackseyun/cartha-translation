id: LUK.18.43
reference: Luke 18:43
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ παραχρῆμα ἀνέβλεψεν, καὶ ἠκολούθει αὐτῷ δοξάζων τὸν θεόν. καὶ πᾶς ὁ λαὸς ἰδὼν ἔδωκεν αἶνον τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/043.yaml
  text: And immediately he received his sight[a], and he followed him, glorifying God. And all the people, when they saw it[b], gave praise to God.
translation:
  language: tl
  text: At agad siyang nakakita[a] at sumunod sa kanya[b] habang niluluwalhati ang Diyos. Nang makita iyon ng lahat ng tao, nagpuri sila sa Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “muling nakakita” o “nanumbalik ang kanyang paningin.” Maaaring tumukoy ang pandiwang Griyego sa pagkakita o sa panunumbalik ng paningin.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “patuloy siyang sumusunod sa kanya.” Maaaring idiin ng anyong Griyego na nagpapatuloy ang kanyang pagsunod.
    reason: aspectual_alternative
lexical_decisions:
- source_word: παραχρῆμα
  choice: agad
  rationale: Ipinahahayag nito na nangyari ang paggaling nang walang pagkaantala; natural at tuwiran ang “agad” sa modernong Tagalog.
- source_word: ἀνέβλεψεν
  choice: nakakita
  rationale: Sa konteksto ng pagpapagaling sa isang bulag, maaaring mangahulugan ang pandiwa na nakakita o nanumbalik ang paningin. Hindi ipinapalagay ng “nakakita” na dati na siyang nakakakita, kaya napapanatili ang saklaw ng Griyego.
- source_word: ἠκολούθει
  choice: sumunod
  rationale: Natural sa salaysay ang simpleng anyong “sumunod.” Ipinaliliwanag sa talababa ang maaaring diin ng imperfect sa nagpapatuloy na kilos.
- source_word: δοξάζων
  choice: habang niluluwalhati
  rationale: Ipinakikita ng pariralang ito na kasabay ng pagsunod ang pagbibigay niya ng luwalhati sa Diyos, at pinananatili nito ang pagkakaiba sa αἶνον sa hulihan ng talata.
- source_word: πᾶς ὁ λαός
  choice: lahat ng tao
  rationale: Tumutukoy ito sa buong pangkat na nakasaksi. Mas natural sa Tagalog ang maramihang pagtukoy kaysa piliting tularan ang kolektibong isahan ng Griyego.
- source_word: ἰδὼν
  choice: nang makita iyon
  rationale: Ginagawang malinaw ng “iyon” ang di-tahasang layon—ang kagalingan at tugon ng lalaki—nang hindi nililimitahan ito sa iisang detalye lamang.
- source_word: ἔδωκεν αἶνον
  choice: nagpuri
  rationale: Natural na Tagalog ito para sa idyomang literal na “nagbigay ng papuri,” habang pinananatiling Diyos ang tumanggap ng papuri.
- source_word: θεόν / θεῷ
  choice: Diyos
  rationale: Karaniwang salin ng θεός; pinanatili ang dalawang pagbanggit upang masalamin ang diin ng talata.
theological_decisions:
- issue: Ang maaaring patuloy na pagsunod ng lalaking pinagaling
  choice: sumunod sa kanya
  alternative: patuloy siyang sumusunod sa kanya
  rationale: Natural ang “sumunod” sa daloy ng salaysay, samantalang inilalahad sa talababa na maaaring idiin ng imperfect na nagpapatuloy ang pagkilos. Hindi dinaragdagan ang teksto ng isang doktrinal na pagpapakahulugan sa pagsunod.
- issue: Ang kahulugan ng ἀνέβλεψεν tungkol sa dating kalagayan ng paningin
  choice: nakakita
  alternative: muling nakakita; nanumbalik ang paningin
  rationale: Hindi tiyak sa pandiwa lamang kung dati nang nakakakita ang lalaki. Ang pangunahing salin ay hindi tahasang nagpapasya sa puntong iyon, at pinananatili sa talababa ang mga posibleng kahulugan.
- issue: Kolektibong isahan sa πᾶς ὁ λαός
  choice: lahat ng tao … sila
  alternative: ang buong sambayanan … ito
  rationale: Ang maramihang pagtukoy ay mas malinaw at likas sa Tagalog at hindi bumabago sa teolohikal na diwa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Iniwasan ang lumang baybay at mga titulong wala sa Griyego. Ginamit ang “niluluwalhati” para sa δοξάζων at “nagpuri” para sa αἶνον upang mapanatili ang pagkakaiba ng dalawang ekspresyon.
