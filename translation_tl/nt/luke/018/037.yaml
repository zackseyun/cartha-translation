  text: ἀπήγγειλαν δὲ αὐτῷ ὅτι Ἰησοῦς ὁ Ναζωραῖος παρέρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/037.yaml
  text: And they told him[a], “Jesus the Nazarene is passing by.”
translation:
  language: tl
  text: At sinabi nila sa kanya, “Si Jesus na Nazareno ay dumaraan[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Si Jesus na taga-Nazaret ay dumaraan.” Sa Griyego, “si Jesus na Nazareno.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: sinabi nila
  rationale: Ang pandiwa ay nangangahulugang magbalita o magsabi. Sa kontekstong ito, likas at malinaw ang “sinabi nila” bilang tugon sa lalaki.
- source_word: δὲ
  choice: At
  rationale: Mahinang pang-ugnay ito na nagpapatuloy sa salaysay; hindi kailangang gawing panalungat.
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Tuwirang kinakatawan nito ang di-tuwirang layon ng pandiwa.
- source_word: ὅτι
  choice: tuwirang sipi
  rationale: Ipinakilala ang nilalaman ng sinabi bilang tuwirang pananalita, na natural sa Filipino at hindi binabago ang diwa.
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Karaniwang anyo ng pangalan sa modernong Filipino.
- source_word: ὁ Ναζωραῖος
  choice: si Jesus na Nazareno
  rationale: Pinananatili ng “Nazareno” ang katawagang pangngalan/panuring nasa Griyego, sa halip na tahimik itong gawing pariralang pinagmulan.
- source_word: παρέρχεται
  choice: dumaraan
  rationale: Ipinahahayag ng pangkasalukuyang anyo ang kilos na nagaganap noon; natural sa Filipino ang “dumaraan” para sa pagdaan malapit sa kinaroroonan nila.
theological_decisions:
- issue: Pagkasalin sa katawagang Ναζωραῖος kay Jesus
  choice: Nazareno
  alternative: taga-Nazaret
  rationale: Pangunahin itong katawagang heograpikal o pagkakakilanlan, hindi isang titulong dapat palawakin sa doktrina. Mas malapit ang “Nazareno” sa anyo ng Griyego, samantalang ipinababatid sa talababa ang natural na alternatibo.
translation_notes:
  register: Modernong Filipino na simple, marangal, at madaling maunawaan. Ginamit ang “Nazareno” upang mapanatili ang anyo ng orihinal na katawagan, kalakip ang mas karaniwang alternatibo sa talababa.
