    rationale: May kaugnayan ang pandiwa sa pangkat-salitang pang-pagbabayad-sala, ngunit hindi kailangang gawing tahasang pahayag ang isang partikular na mekanismo sa talababa. Mas maingat na banggitin ang lexical na kaugnayan nang hindi nilulutas ang buong teolohikal na saklaw.
