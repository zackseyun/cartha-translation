  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸂ὁ δὲ⸃ τελώνης μακρόθεν ἑστὼς οὐκ ἤθελεν οὐδὲ τοὺς ὀφθαλμοὺς ⸂ἐπᾶραι εἰς τὸν οὐρανόν⸃, ἀλλ’ ⸀ἔτυπτε τὸ στῆθος ⸀αὐτοῦ λέγων· Ὁ θεός, ἱλάσθητί μοι τῷ ἁμαρτωλῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/013.yaml
  text: But the tax collector[a], standing far off, was not willing even to lift up his eyes to heaven, but kept beating his chest, saying, ‘God, be merciful to me, the sinner.’
translation:
  language: tl
  text: Ngunit ang maniningil ng buwis, na nakatayo sa malayo, ay hindi man lamang niya nais tumingala sa langit. Sa halip, patuloy niyang hinahampas ang kanyang dibdib at sinasabi, ‘O Diyos, maawa ka sa akin, na makasalanan.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “maging mapagpalubag-loob ka sa akin.” Ang pandiwa ay kaugnay ng bokabularyo ng pagbabayad-sala.
    reason: lexical_alternative
lexical_decisions:
- source_word: τελώνης
  choice: maniningil ng buwis
  rationale: Malinaw at likas na makabagong Tagalog ito para sa opisyal na naniningil ng buwis, at hindi nito pinapawi ang masamang tingin sa tungkuling ito sa konteksto ng Ebanghelyo.
- source_word: μακρόθεν ἑστὼς
  choice: na nakatayo sa malayo
  rationale: Pinananatili nito ang aktuwal na distansiya at ang mapagpakumbabang tindig na ipinahihiwatig ng konteksto.
- source_word: οὐκ ἤθελεν οὐδὲ
  choice: ay ayaw man lamang
  rationale: Ipinahahayag ng θέλω ang kalooban o pagnanais, hindi kawalan ng kakayahan; natural na naihahatid ng parirala ang kanyang pag-aatubili dahil sa kahihiyan o pagpapakumbaba.
- source_word: ἐπᾶραι εἰς τὸν οὐρανόν
  choice: tumingala sa langit
  rationale: Likas na idyomang Tagalog ito para sa pagtataas ng mga mata tungo sa langit, nang hindi nangangailangang isalin nang mekanikal ang bawat sangkap.
- source_word: ἔτυπτε τὸ στῆθος αὐτοῦ
  choice: patuloy niyang dinadagukan ang kanyang dibdib
  rationale: Ipinakikita ng aspektong imperpektibo ang paulit-ulit o nagpapatuloy na kilos. Ang “dinadagukan ang dibdib” ay malinaw na kilos ng matinding dalamhati at pagsisisi.
- source_word: ἱλάσθητί μοι
  choice: maawa ka sa akin
  rationale: Ito ang pinakanatural at madaling maunawaang panalangin sa Tagalog, habang ang kaugnayan ng pandiwa sa pagbabayad-sala at pagpapawi ng poot ay pinananatili sa talababa.
- source_word: τῷ ἁμαρτωλῷ
  choice: na makasalanan
  rationale: Pinananatili nito ang mariing pagkilala ng nagsasalita sa sarili bilang makasalanan. Iniiwasan ang hindi likas na literal na “ang makasalanan” sa Tagalog, ngunit hindi ito pinapahina tungo sa payak na “isang makasalanan.”
theological_decisions:
- issue: Paglalahad sa ἱλάσθητί μοι bilang panalangin sa Diyos
  choice: maawa ka sa akin
  alternative: maging mapagpalubag-loob ka sa akin; magkaloob ka ng pagbabayad-sala para sa akin
  rationale: May kaugnayan ang pandiwa sa bokabularyo ng pagbabayad-sala at pagpapawi ng poot, ngunit sa tuwirang panalangin ay “maawa ka sa akin” ang malinaw at natural. Hindi inilalagay sa pangunahing teksto ang isang ganap na sistematikong paliwanag; inihahayag sa talababa ang mas malalim na sakripisyal na pahiwatig.
- issue: Diin ng artikulo sa τῷ ἁμαρτωλῷ
  choice: na makasalanan
  alternative: isang makasalanan; ang makasalanan
  rationale: Ang Griyegong artikulo ay maaaring magbigay-diin sa pagpapakilala niya sa sarili bilang makasalanan. Ang napiling Tagalog ay natural at mariin, nang hindi pilit na ginagaya ang artikulo o nilulutas nang lampas sa kayang tiyakin ng anyong Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “maniningil ng buwis” sa halip na arkaiko o teknikal na katawagan. Ang “O Diyos” ay likas na anyo ng tuwirang panalangin. Inilagay ang marker na [a] sa mismong teksto at itinabi ang teknikal na pahiwatig ng ἱλάσκομαι sa talababa.
