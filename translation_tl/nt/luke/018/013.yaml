revisions:
- from: Ngunit ang maniningil ng buwis, na nakatayo sa malayo, ay ayaw man lamang tumingala sa langit. Sa halip, patuloy niyang dinadagukan ang kanyang dibdib at sinasabi, ‘O Diyos, maawa ka sa akin, na makasalanan.’[a]
  to: Ngunit ang maniningil ng buwis, na nakatayo sa malayo, ay hindi man lamang niya nais tumingala sa langit. Sa halip, patuloy niyang hinahampas ang kanyang dibdib at sinasabi, ‘O Diyos, maawa ka sa akin, na makasalanan.’[a]
  rationale: Pinalitan ang “dinadagukan” ng “hinahampas” upang hindi magpahiwatig ng pagsuntok at upang mas tumpak na mailarawan ang paulit-ulit na paghampas sa dibdib. Inayos ang ayos ng pangungusap upang malinaw ang bolisyon ng οὐκ ἤθελεν. Pinagaan at pinasimple ang talababa upang mapanatili ang lexical na kaugnayan sa pagbabayad-sala nang hindi nagpapataw ng isang partikular na teolohikal na pagpapakahulugan.
