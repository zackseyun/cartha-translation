  naturalness: Makabago at marangal ang register. Mas natural at mas angkop sa kilos ng pagluluksa/pagsisisi ang “patuloy niyang hinahampas ang kanyang dibdib.” Ang “hindi man lamang niya nais tumingala” ay mas malinaw na naghahatid ng bolisyon ng οὐκ ἤθελεν kaysa “ay ayaw man lamang.”
  terminology: Ang “maniningil ng buwis,” “langit,” at “maawa ka sa akin” ay angkop. Ang talababa ay dapat iwasang ipakahulugang ang ἱλάσθητί ay tiyak na “pagpapawi ng poot,” dahil ang pangunahing kahulugan nito rito ay pagsusumamo para sa maawaing paglingap; maaaring itala nang mas maingat ang kaugnayan nito sa bokabularyo ng pagbabayad-sala.
