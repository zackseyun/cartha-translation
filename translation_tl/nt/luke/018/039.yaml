  text: καὶ οἱ προάγοντες ἐπετίμων αὐτῷ ἵνα ⸀σιγήσῃ· αὐτὸς δὲ πολλῷ μᾶλλον ἔκραζεν· Υἱὲ Δαυίδ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/039.yaml
  text: And those going ahead were rebuking him so that he would be silent; but he kept crying out all the more, “Son of David, have mercy on me!”
translation:
  language: tl
  text: Paulit-ulit siyang sinaway ng mga nauuna upang tumahimik siya. Ngunit lalo pa siyang nagsisigaw, “Anak ni David, maawa po kayo sa akin!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ προάγοντες
  choice: mga nauuna
  rationale: Ang substantival na present participle ay tumutukoy sa mga taong nasa unahan o nagpapauna sa karamihan. Natural sa Filipino ang “mga nauuna” at hindi nito ipinapalagay na sila ang mga pinuno.
- source_word: ἐπετίμων αὐτῷ
  choice: Sinaway siya
  rationale: Ang ἐπιτιμάω ay nagpapahayag ng mariing pagsaway. Bagaman imperfect ang anyo, sapat na naipahihiwatig ng konteksto at layunin ang patuloy na pagpapatigil; mas natural dito ang payak na “sinaway” kaysa mabigat na progresibong parirala.
- source_word: ἵνα σιγήσῃ
  choice: upang tumahimik siya
  rationale: Pinananatili ng “upang” ang layunin ng pagsaway, at malinaw na tumutukoy ang “siya” sa bulag na lalaki.
- source_word: αὐτὸς δὲ πολλῷ μᾶλλον
  choice: Ngunit lalo pa siyang
  rationale: Ipinahahayag ng “ngunit” ang matinding pagsalungat, habang natural na tinutumbasan ng “lalo pa” ang comparative intensifier nang hindi idinaragdag ang salitang “malakas.”
- source_word: ἔκραζεν
  choice: sumigaw
  rationale: Ang pandiwa ay tumutukoy sa malakas na pagsigaw. Nakakatulong ang “lalo pa” at ang naunang pagsaway upang maipakita sa natural na Filipino ang pagpapatuloy at pagpupumilit na nasa imperfect.
- source_word: Υἱὲ Δαυίδ
  choice: Anak ni David
  rationale: Direktang isinasalin ang Davidikong titulong mesiyaniko. Sa natural na Filipino, “Anak ni David” ang malinaw at marangal na anyo.
- source_word: ἐλέησόν με
  choice: maawa po kayo sa akin
  rationale: Ang “maawa ... sa akin” ay natural na pakiusap sa modernong Filipino at pinananatili ang diwa ng agarang paghingi ng habag. Ang “po kayo” ay angkop na paggalang sa tuwirang pakikipag-usap kay Jesus nang hindi nagdaragdag ng doktrinal na paliwanag.
theological_decisions:
- issue: Mesiyanikong kahulugan ng Υἱὲ Δαυίδ
  choice: Panatilihin sa pangunahing teksto bilang “Anak ni David.”
  alternative: Ituring lamang itong pangkaraniwang magalang na tawag o palawakin bilang “Mesiyas na Anak ni David.”
  rationale: Ang parirala ay may Davidiko at mesiyanikong bigat sa salaysay ni Lucas. Pinananatili ng tuwirang salin ang kahulugang iyon nang hindi tahasang idinaragdag ang salitang “Mesiyas,” na wala sa mismong talata.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “po kayo” bilang likas na pahayag ng paggalang sa pakiusap; iniwasan ang sobrang literal at di-natural na progresibong pagkakabuo. Walang kinakailangang talababa sa talatang ito.
