  yaml_path: translation/nt/luke/018/002.yaml
  text: saying[a], “There was a certain judge in a certain city who did not fear God and did not respect people.
translation:
  language: tl
  text: Sinabi niya, “Sa isang lungsod ay may isang hukom na hindi natatakot sa Diyos at walang pakundangan sa kaninuman.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi gumagalang sa sinumang tao.” Ang Griyego ay may isahang “tao” na ginamit sa pangkalahatang diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: Sinabi niya
  rationale: Ang kasalukuyang pandiwaring Griyego ay nag-uugnay sa talinghaga sa naunang talata; sa Filipino, ang tahasang pandiwang “Sinabi niya” ang natural na pambungad sa tuwirang sinabi.
- source_word: Κριτής τις
  choice: isang hukom
  rationale: Ipinakikilala ng τις ang isang di-pinangalanang tauhan. Sapat at natural sa Filipino ang “isang hukom”; magiging mabigat at di-likas ang “isang hukom na tiyak” o “isang partikular na hukom.”
- source_word: ἦν ἔν τινι πόλει
  choice: Sa isang lungsod ay may
  rationale: Ang eksistensiyal na “may” ang likas na paraan sa Filipino upang magpakilala ng tauhan, at pinananatili ng “isang lungsod” ang di-tiyak na πόλει na may τινι.
- source_word: τὸν θεὸν μὴ φοβούμενος
  choice: hindi natatakot sa Diyos
  rationale: Pinananatili ng “natatakot sa Diyos” ang moral at panrelihiyong diwa ng φοβέομαι, hindi lamang pangkaraniwang sindak.
- source_word: ἄνθρωπον μὴ ἐντρεπόμενος
  choice: walang pakundangan sa kaninuman
  rationale: Sa konteksto, ang ἐντρέπομαι ay tumutukoy sa paggalang, pagsasaalang-alang, o pagkakaroon ng hiya sa harap ng iba. Ang isahang generic na ἄνθρωπον ay likas na naipahahayag sa Filipino bilang “kaninuman.”
theological_decisions:
- issue: Ang generic na isahang ἄνθρωπον na ipinantatapat sa Diyos
  choice: kaninuman
  alternative: tao / mga tao
  rationale: 'Ang “kaninuman” ay nagpapanatili sa pangkalahatang saklaw ng isahang Griyego nang hindi nagpapahiwatig na lalaki lamang ang tinutukoy. Hindi nito nilulutas nang labis ang diwa: ipinahihiwatig pa rin na wala siyang paggalang o pagsasaalang-alang sa sinumang tao.'
- issue: Saklaw ng ἐντρεπόμενος
  choice: walang pakundangan
  alternative: hindi gumagalang / hindi nahihiya sa harap ng
  rationale: Saklaw ng pandiwa ang paggalang, pagsasaalang-alang, at pagkadama ng hiya o pagpipigil dahil sa ibang tao. Ang “walang pakundangan” ay natural at malawak, habang inilalahad sa talababa ang mas tuwirang alternatibo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “lungsod” at “hukom” bilang karaniwang terminong pampubliko; ang “walang pakundangan” ay bahagyang mataas ang rehistro ngunit malinaw at angkop sa matinding paglalarawan sa ugali ng hukom.
