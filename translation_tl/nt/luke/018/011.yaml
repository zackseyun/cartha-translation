  to: 'Ang Pariseo ay nakatayong mag-isa[a] at nananalangin ng ganito: “Diyos, nagpapasalamat ako sa iyo dahil hindi ako gaya ng ibang mga tao—mga nangingikil, mga di-matuwid, mga mangangalunya—o kahit gaya ng maniningil ng buwis na ito.”'
