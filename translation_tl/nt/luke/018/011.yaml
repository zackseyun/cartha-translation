  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ Φαρισαῖος σταθεὶς ⸂πρὸς ἑαυτὸν ταῦτα⸃ προσηύχετο· Ὁ θεός, εὐχαριστῶ σοι ὅτι οὐκ εἰμὶ ⸀ὥσπερ οἱ λοιποὶ τῶν ἀνθρώπων, ἅρπαγες, ἄδικοι, μοιχοί, ἢ καὶ ὡς οὗτος ὁ τελώνης·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/011.yaml
  text: 'The Pharisee[a], standing by himself, was praying these things: ‘God, I thank you that I am not like the rest of men—extortioners, unrighteous, adulterers—or even like this tax collector.’'
translation:
  language: tl
  text: 'Ang Pariseo ay nakatayong mag-isa[a] at nananalangin ng ganito: “Diyos, nagpapasalamat ako sa iyo dahil hindi ako gaya ng ibang mga tao—mga nangingikil, mga di-matuwid, mga mangangalunya—o kahit gaya ng maniningil ng buwis na ito.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Nakatayo ang Pariseo at nananalangin sa kaniyang sarili ng ganito.” Maaaring mangahulugan ang pariralang Griyego na nakatayo siyang mag-isa o na, sa isang mapanuyang diwa, ang panalangin niya ay nakatuon sa kaniyang sarili.
    reason: alternative_reading
lexical_decisions:
- source_word: σταθεὶς
  choice: na nakatayo
  rationale: Ipinahahayag nito ang tindig ng Pariseo bilang pangyayaring kasabay ng pananalangin, sa natural na modernong Tagalog.
- source_word: πρὸς ἑαυτὸν
  choice: nakatayong bukod
  rationale: Pinipili sa pangunahing teksto ang posibleng diwang panlunan—na nakahiwalay siya sa iba—habang inilalagay sa talababa ang posibleng kahulugang reflexive na “sa kaniyang sarili.”
- source_word: ταῦτα
  choice: ng ganito
  rationale: Natural itong panimula sa mismong nilalaman ng panalanging kasunod, bagaman literal na tumutukoy ang panghalip sa “mga bagay na ito.”
- source_word: προσηύχετο
  choice: ay nananalangin
  rationale: Pinananatili ng aspektong nagaganap ang imperfect na anyo ng pandiwa sa salaysay.
- source_word: εὐχαριστῶ σοι
  choice: nagpapasalamat ako sa iyo
  rationale: Ito ang natural at tuwirang katumbas sa modernong Tagalog.
- source_word: ὥσπερ οἱ λοιποὶ τῶν ἀνθρώπων
  choice: gaya ng lahat ng iba pang tao
  rationale: Pinananatili nito ang λοιποί bilang “lahat ng iba pa” at ang pangkalahatang saklaw ng ἄνθρωποι nang walang di-kinakailangang pagtukoy sa kasarian.
- source_word: ἅρπαγες
  choice: mga nangingikil
  rationale: Ipinahahayag nito ang mapagsamantalang pagkuha o sapilitang pagsamsam na maaaring tukuyin ng ἅρπαξ sa listahan ng mga bisyo.
- source_word: ἄδικοι
  choice: mga di-matuwid
  rationale: Pinananatili nito ang malawak na moral at panrelihiyong diwa ng ἄδικος, hindi lamang ang mas makitid na kahulugang legal ng “di-makatarungan.”
- source_word: μοιχοί
  choice: mga mangangalunya
  rationale: Karaniwan at malinaw na katumbas ng pangngalang maramihan.
- source_word: ἢ καὶ ὡς οὗτος ὁ τελώνης
  choice: o kahit gaya ng maniningil ng buwis na ito
  rationale: Ang “kahit” ay naghahatid ng mapanghamak na pag-igting ng ἢ καί, at ang “maniningil ng buwis” ang natural na katawagan sa τελώνης.
theological_decisions:
- issue: Kahulugan ng πρὸς ἑαυτόν sa panalangin ng Pariseo
  choice: 'Binasa sa pangunahing teksto bilang panlunan: “nakatayong bukod.”'
  alternative: 'Maaaring reflexive: “nananalangin sa kaniyang sarili.”'
  rationale: Maaaring tukuyin ng parirala ang pagkakahiwalay ng Pariseo sa iba o, sa isang mapanuyang pahiwatig, ang panalanging nakatuon sa kaniyang sarili. Hindi tahimik na nilulutas ng salin ang tunay na kalabuan; itinatala ang ikalawang pagbasa sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “di-matuwid” upang mapanatili ang moral at panrelihiyong lawak ng salita, at iniwasan ang sobrang pormal o makalumang ayos. Ang talababa ay tuwirang nakakabit sa “nakatayong bukod[a]” upang malinaw ang pariralang may alternatibong pagbasa.
