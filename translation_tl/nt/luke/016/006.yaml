id: LUK.16.6
reference: Luke 16:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ἑκατὸν βάτους ἐλαίου· ⸂ὁ δὲ⸃ εἶπεν αὐτῷ· Δέξαι σου ⸂τὰ γράμματα⸃ καὶ καθίσας ταχέως γράψον πεντήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/006.yaml
  text: He said[a], ‘A hundred baths of olive oil.’ Then he said to him, ‘Take your bill, sit down quickly[b], and write fifty.’
translation:
  language: tl
  text: Sumagot siya, “Isandaang bat[a] ng langis ng olibo.” Sinabi naman sa kanya ng katiwala, “Kunin mo ang kasulatan ng utang mo[b], maupo ka at isulat mo agad ang limampu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ang bat ay isang sinaunang yunit ng panukat para sa likido. Sa Griyego: “isandaang bat ng langis ng olibo.”'
    reason: cultural_note
  - marker: b
    text: 'O “mga dokumento mo” o “nakasulat na kasunduan mo.” Sa Griyego: “mga kasulatan mo”; sa kontekstong ito, tumutukoy ito sa nakasulat na dokumento o tala ng utang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βάτους
  choice: bat
  rationale: Tiyak na sinaunang yunit ng panukat para sa likido ang βάτος. Pinanatili ang pangalan ng yunit at ipinaliwanag sa talababa sa halip na gawing pangkalahatang “takal.”
- source_word: ἐλαίου
  choice: langis ng olibo
  rationale: Sa kontekstong ito, ang ἔλαιον ay langis ng olibo; malinaw at likas ito sa modernong Filipino.
- source_word: Δέξαι
  choice: Kunin mo
  rationale: Ang pautos ay tumutukoy sa pagkuha sa kamay ng dokumento upang baguhin ang nakasulat dito.
- source_word: τὰ γράμματα
  choice: ang kasulatan ng utang mo
  rationale: Literal itong “mga kasulatan,” ngunit sa tagpong ito ay ang nakasulat na dokumento o tala ng pagkakautang. Pinananatili ng “kasulatan ng utang” ang dokumentaryong diwa nang hindi ipinapalagay ang mas tiyak na legal na anyo nito.
- source_word: καθίσας
  choice: maupo ka
  rationale: Ang participle ay likas na isinalin bilang kasunod na pautos sa Filipino, kasabay ng pangunahing utos na magsulat.
- source_word: ταχέως
  choice: agad
  rationale: Ipinahahayag nito ang pagmamadali at mas natural dito ang “agad” kaysa sa mas literal na “nang mabilis.”
- source_word: γράψον
  choice: isulat mo
  rationale: Tuwirang pautos itong baguhin sa pamamagitan ng pagsusulat ang halagang nasa dokumento.
- source_word: πεντήκοντα
  choice: limampu
  rationale: Tuwirang katumbas ng bilang na πεντήκοντα.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “katiwala” sa ikalawang sugnay upang luminaw ang nag-uutos, bagaman panghalip lamang ang nasa Griyego; malinaw ang tinutukoy mula sa konteksto. Pinanatili ang sinaunang yunit na “bat” at inilagay ang paliwanag sa talababa.
