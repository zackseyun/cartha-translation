    rationale: Sa Filipino, ang tagatasa ay mas likas na ipakilala sa “itinuturing na dakila ng mga tao.” Hindi nito binabago ang kahulugan; nililinaw lamang nito ang ugnayan ng panlipunang pagpapahalaga.
