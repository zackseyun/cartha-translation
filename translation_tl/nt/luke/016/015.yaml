  source_fidelity: 'Ang pangunahing diwa at mga ugnayan sa Griyego ay naipapasa nang tapat: ang mariing pagtukoy sa kausap, ang pag-alam ng Diyos sa mga puso, at ang pagsalungat ng pagpapahalaga ng tao at ng Diyos. Gayunman, ang “mga nagpapakitang matuwid” ay hindi gaanong malinaw na naipapahayag ang reflexive na ἑαυτούς at maaaring mangahulugang nagpapakita lamang sila ng isang taong matuwid. Ang “nagmamatuwid sa inyong sarili” ay mas tuwirang tumutugon sa δικαιοῦντες ἑαυτούς nang hindi ipinipilit ang teknikal na legal na kahulugan.'
  naturalness: Mas natural at malinaw sa makabagong Filipino ang “Kayo ang mga nagmamatuwid sa inyong sarili.” Ang “ang itinuturing na dakila ng mga tao” ay mas idiomatiko kaysa “sa mga tao” matapos ang “itinuturing,” habang pinananatili ang saklaw na sosyal na pagpapahalaga ng Griyego.
  terminology: Nananatiling angkop ang “mga puso,” “kasuklam-suklam,” at ang magkatapat na “sa harap ng mga tao/sa harap ng Diyos.” Ang “nagmamatuwid” ay angkop na katumbas sa kontekstong ito ng pag-aangkin o pagbibigay-katuwiran sa sarili.
