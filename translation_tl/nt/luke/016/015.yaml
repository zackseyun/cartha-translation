  to: At sinabi niya sa kanila, “Kayo ang mga nagmamatuwid sa inyong sarili[a] sa harap ng mga tao, ngunit alam ng Diyos ang inyong mga puso. Sapagkat ang itinuturing na dakila ng mga tao[b] ay kasuklam-suklam sa harap ng Diyos.[c]”
