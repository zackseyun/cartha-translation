  text: καὶ εἶπεν αὐτοῖς· Ὑμεῖς ἐστε οἱ δικαιοῦντες ἑαυτοὺς ἐνώπιον τῶν ἀνθρώπων, ὁ δὲ θεὸς γινώσκει τὰς καρδίας ὑμῶν· ὅτι τὸ ἐν ἀνθρώποις ὑψηλὸν βδέλυγμα ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/015.yaml
  text: And he said to them[a], “You are the ones who justify yourselves before men, but God knows your hearts[c][b]. For what is exalted among men is detestable before God.”
translation:
  language: tl
  text: At sinabi niya sa kanila, “Kayo ang mga nagmamatuwid sa inyong sarili[a] sa harap ng mga tao, ngunit alam ng Diyos ang inyong mga puso. Sapagkat ang itinuturing na dakila ng mga tao[b] ay kasuklam-suklam sa harap ng Diyos.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagpapawalang-sala sa inyong sarili.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ang lubos na pinahahalagahan ng mga tao.”
    reason: alternative_reading
  - marker: c
    text: Maaari ring “isang karumal-dumal na bagay sa harap ng Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιοῦντες ἑαυτοὺς
  choice: mga nagpapakitang matuwid
  rationale: Ipinahihiwatig ng kasalukuyang participle na may reflexive object ang pagpapahayag o pagpapakilala sa sarili bilang matuwid sa harap ng iba. Natural ito sa makabagong Tagalog at hindi ipinapalagay na tunay silang ginawang matuwid.
- source_word: ἐνώπιον τῶν ἀνθρώπων
  choice: sa harap ng mga tao
  rationale: Pinananatili ang kahulugan ng ἐνώπιον na ‘sa harap’ o ‘sa paningin,’ samantalang likas na ipinahahayag ng ‘mga tao’ ang generic na ἀνθρώπων sa Tagalog.
- source_word: γινώσκει τὰς καρδίας ὑμῶν
  choice: alam ng Diyos ang inyong mga puso
  rationale: Pinananatili ang biblikal na larawan ng puso bilang kalooban, isip, at mga motibo ng panloob na pagkatao nang hindi ito labis na ipinapaliwanag sa pangunahing teksto.
- source_word: τὸ ἐν ἀνθρώποις ὑψηλὸν
  choice: ang itinuturing na dakila sa mga tao
  rationale: Ipinananatili ng ‘dakila’ ang talinghaga ng pagiging mataas o itinataas, habang nililinaw ng ‘itinuturing’ na ang tinutukoy ay pagtingin at pagpapahalaga ng lipunan.
- source_word: βδέλυγμα
  choice: kasuklam-suklam
  rationale: Malakas at natural na salitang Tagalog ito para sa isang bagay na lubhang kinasusuklaman o karumal-dumal sa paningin ng Diyos.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: sa harap ng Diyos
  rationale: Tumutugma ito sa naunang ‘sa harap ng mga tao’ at pinananatili ang tuwirang paghahambing ng paghatol ng tao at ng Diyos.
- source_word: Ὑμεῖς ἐστε οἱ ...
  choice: Kayo ang mga ...
  rationale: Naipapahayag ng hulmaing ito ang diin ng Griyegong panghalip at article-participle construction.
theological_decisions:
- issue: Ang diwa ng δικαιοῦντες ἑαυτούς
  choice: nagpapakitang matuwid
  alternative: nagpapawalang-sala sa inyong sarili
  rationale: Sa konteksto, inaakusahan sila ni Jesus na inilalahad ang kanilang sarili bilang matuwid sa harap ng ibang tao. Hindi tahasang sinasabi ng salin na tunay nilang napawalang-sala ang kanilang sarili o na pormal na paghatol sa hukuman ang tinutukoy.
- issue: Ang generic na ἀνθρώπων sa dalawang parirala
  choice: mga tao
  alternative: sangkatauhan
  rationale: Ang ‘mga tao’ ay natural, inklusibo, at tumpak sa Tagalog para sa pangkalahatang pagtukoy sa mga tao, at pinananatili nito ang kaibahan ng pananaw ng tao at ng Diyos.
- issue: Ang saklaw ng τὸ ἐν ἀνθρώποις ὑψηλὸν
  choice: ang itinuturing na dakila sa mga tao
  alternative: ang lubos na pinahahalagahan ng mga tao
  rationale: Maaaring tumukoy ang parirala sa anumang itinataas, hinahangaan, o lubos na pinahahalagahan sa lipunan. Pinananatili ng pangunahing salin ang larawan ng kataasan; inilalagay sa talababa ang mas tuwirang diwa ng pagpapahalaga.
- issue: Ang lakas ng βδέλυγμα
  choice: kasuklam-suklam
  alternative: isang karumal-dumal na bagay
  rationale: Pinananatili ang matinding pagsalungat ng Diyos nang hindi nagdaragdag ng partikular na ritwal o denominasyonal na kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘mga tao’ bilang natural na generic na katawagan. Pinanatili ang magkatapat na ‘sa harap ng mga tao’ at ‘sa harap ng Diyos,’ gayundin ang biblikal na larawang ‘mga puso.’
