  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: λέγει ⸀δὲ Ἀβραάμ· Ἔχουσι Μωϋσέα καὶ τοὺς προφήτας· ἀκουσάτωσαν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/029.yaml
  text: But Abraham said[a], ‘They have Moses and the Prophets[b]; let them listen to them.’
translation:
  language: tl
  text: Ngunit sinabi ni Abraham, “Nasa kanila si Moises at ang mga Propeta[a]; makinig sila sa mga ito.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Moises at ang mga Propeta” ay tumutukoy sa patotoo ng Kasulatan na kaugnay ni Moises at ng mga aklat ng mga propeta.
    reason: cross_reference
  - marker: b
    text: 'Mas literal: “pakinggan nila ang mga ito.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει δὲ
  choice: Ngunit sinabi
  rationale: Isinalin ang historikal na pangkasalukuyan na λέγει bilang pangnagdaan para sa likas na daloy ng salaysay sa Filipino. Ipinahihiwatig ng δέ ang banayad na pagsalungat sa naunang pakiusap, kaya angkop ang “Ngunit.”
- source_word: Ἀβραάμ
  choice: Abraham
  rationale: Ginamit ang karaniwang anyo ng pangalang ito sa Bibliyang Filipino.
- source_word: Ἔχουσι
  choice: Nasa kanila
  rationale: Likas na Filipino ito para sa kasalukuyang pagkakaroon o pagkamay-access sa binanggit na patotoo; hindi nito ipinahihiwatig na literal nilang pag-aari ang mga tao.
- source_word: Μωϋσέα καὶ τοὺς προφήτας
  choice: si Moises at ang mga Propeta
  rationale: Pinanatili ang maikli at metonimikong parirala ng Griyego, na tumutukoy sa patotoo ng mga kasulatang kaugnay ni Moises at ng mga propeta, nang hindi ito pinalalawak sa pangunahing teksto.
- source_word: ἀκουσάτωσαν
  choice: makinig sila
  rationale: Ipinapahayag nito nang natural ang ikatlong panauhang pangmaramihang pautos at ang diwa ng pakikinig na may pagtugon, hindi lamang pisikal na pagkarinig.
- source_word: αὐτῶν
  choice: sa mga ito
  rationale: Ang panghalip ay bumabalik kina “Moises at ang mga Propeta,” lalo na sa kanilang patotoo. Ang “mga ito” ay natural para sa di-personal o tekstuwal na tinutukoy, habang pinananatili ng talababa ang literal na posibilidad.
theological_decisions:
- issue: Tinutukoy ng “Moises at ang mga Propeta”
  choice: Pinanatili bilang metonimikong tawag sa umiiral na awtoritatibong patotoo ng Kasulatan.
  alternative: Tumutukoy lamang sa mga makasaysayang persona nina Moises at ng mga propeta.
  rationale: Karaniwan sa gamit na Judio at sa Lucas ang pariralang ito bilang pagtukoy sa Kasulatan. Pinananatili sa pangunahing teksto ang mismong parirala upang hindi alisin ang anyong pampanitikan o tahimik na lutasin ang saklaw nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Nasa kanila” para sa likas na pagpapahayag ng pagkakaroon o pagkamay-access, at pinanatili ang tradisyonal na pariralang “Moises at ang mga Propeta.”
