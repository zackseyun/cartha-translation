base_translation:
  language: en
  yaml_path: translation/nt/luke/016/017.yaml
  text: But it is easier for heaven and earth to pass away than for one stroke of a letter of the Law to fall[a].
translation:
  language: tl
  text: Ngunit mas madaling lumipas ang langit at lupa kaysa sa mawala kahit isang munting guhit ng isang titik sa Kautusan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mawala kahit isang kudlit sa Kautusan”—samakatuwid, isang napakaliit na guhit o marka sa isang titik.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐκοπώτερον
  choice: mas madaling
  rationale: 'Tumpak na ipinahahayag ang pahambing na diwa: mas madali o mas posibleng mangyari ang unang binanggit kaysa sa ikalawa.'
- source_word: δέ
  choice: Ngunit
  rationale: Ipinakikita ang banayad na pagsalungat sa naunang pahayag habang pinananatiling natural ang daloy sa Filipino.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν
  choice: ang langit at lupa
  rationale: Pinananatili ang nakaugaliang biblikal na pariralang tumutukoy sa buong nilikhang kaayusan.
- source_word: παρελθεῖν
  choice: lumipas
  rationale: Natural na Filipino ito para sa pagkawala o pagpanaw ng langit at lupa, hindi sa simpleng pagdaan lamang.
- source_word: τοῦ νόμου
  choice: sa Kautusan
  rationale: Sa kontekstong Judio at pangkasulatan, tumutukoy ito sa Kautusan ng Diyos, hindi sa batas sa pangkalahatan.
- source_word: μίαν κεραίαν
  choice: kahit isang maliit na guhit ng isang titik
  rationale: Ipinahahayag nito sa malinaw na modernong Filipino ang napakaliit na guhit o bahaging bumubuo o nagpapakilala sa isang nakasulat na titik. Ang “kahit” ay likas na nagpapatingkad sa diwang wala ni isa mang ganitong guhit ang mawawala.
- source_word: πεσεῖν
  choice: mawala
  rationale: Bagaman literal na “mahulog” o “bumagsak,” sa kontekstong ito ang larawan ay tungkol sa pagkawala ng kahit pinakamaliit na bahagi ng Kautusan. Ang “mawala” ay malinaw at hindi nagdaragdag ng ideyang gaya ng “mawalan ng bisa.”
theological_decisions:
- issue: Tinutukoy ng νόμος
  choice: ang Kautusan bilang Kautusang nasa Kasulatan
  alternative: batas sa pangkalahatan
  rationale: Sinusuportahan ng konteksto at ng pagtukoy sa isang nakasulat na maliit na guhit ang pangkasulatang Kautusan. Ginamit ang malaking titik upang ipahiwatig ito nang hindi nilulutas ang mas malawak na usapin tungkol sa paraan ng pananatili ng bisa nito.
- issue: Diwa ng κεραία
  choice: isang napakaliit na guhit ng isang nakasulat na titik
  alternative: isang kudlit
  rationale: Binibigyang-diin ng talata na hindi mawawala maging ang pinakamaliit na nakasulat na detalye ng Kautusan. Mas malinaw sa karaniwang mambabasa ang pangunahing salin, samantalang inilalagay sa talababa ang mas maikling alternatibo.
- issue: Diwa ng πεσεῖν
  choice: mawala
  alternative: mahulog o bumagsak
  rationale: Iniiwasan nitong gawing tahasan ang interpretasyong “mawalan ng bisa,” na higit sa literal na sinasabi ng pandiwa, habang malinaw na ipinahahayag ang pagkawala ng isang bahagi mula sa Kautusan.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling basahin. Pinanatili ang biblikal na pariralang “langit at lupa” at iniwasan ang lipas o teknikal na katawagang walang paliwanag.
