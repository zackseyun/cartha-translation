  text: Ἄνθρωπος δέ τις ἦν πλούσιος, καὶ ἐνεδιδύσκετο πορφύραν καὶ βύσσον εὐφραινόμενος καθ’ ἡμέραν λαμπρῶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/019.yaml
  text: There was a certain rich man[a], and he used to dress in purple and fine linen, feasting splendidly every day.
translation:
  language: tl
  text: May isang mayamang lalaki na karaniwang nagsusuot ng damit na kulay-ube at pinong lino, at araw-araw ay marangya siyang nagpapakasaya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “araw-araw ay marangya siyang nagpipista.” Ang εὐφραινόμενος ay maaaring mangahulugang nagpapakasaya o nagdiriwang, at sa kontekstong ito ay maaari itong tumukoy sa pagpipista; idinidiin naman ng λαμπρῶς ang karangyaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνθρωπος δέ τις
  choice: May isang ... lalaki
  rationale: Likas na panimulang pasalaysay ito sa Tagalog para sa isang taong hindi pa tiyak na ipinakikilala. Hindi ginawang hiwalay na salita ang δέ sapagkat sapat nang naihahatid ng daloy ng salaysay ang banayad na paglipat.
- source_word: πλούσιος
  choice: mayaman
  rationale: Tuwiran at karaniwang katumbas ito ng katawagang tumutukoy sa materyal na kayamanan.
- source_word: ἐνεδιδύσκετο
  choice: laging nagsusuot ng damit
  rationale: Ipinahahayag ng imperpektong anyo ang nakagawiang kilos; malinaw na ipinakikita ng “laging” ang paulit-ulit o palagiang pagsusuot.
- source_word: πορφύραν
  choice: damit na kulay-ube
  rationale: Ang pangngalan ay tumutukoy sa mamahaling telang o kasuotang tinina ng purpura. Nilinaw ang ipinahihiwatig na kasuotan habang pinananatili ang mahalagang tanda ng karangyaan.
- source_word: βύσσον
  choice: pinong lino
  rationale: Inihahatid nito kapuwa ang uri ng tela at ang mataas na kalidad nito.
- source_word: εὐφραινόμενος
  choice: nagpapakasaya
  rationale: Saklaw ng pandiwa ang masayang pagpapasasa o pagdiriwang. Hindi nito nililimitahan ang kahulugan sa pagkain lamang, bagaman maaaring kabilang ang marangyang pagpipista sa konteksto.
- source_word: καθ’ ἡμέραν
  choice: araw-araw
  rationale: Ito ang malinaw at likas na katumbas ng idyomang nagsasaad ng pang-araw-araw na pangyayari.
- source_word: λαμπρῶς
  choice: marangya
  rationale: Sa kontekstong ito, inilalarawan nito ang magara, maningning, at magastos na paraan ng kanyang pagpapakasaya.
