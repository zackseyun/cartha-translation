translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “kulay-ube” sa halip na ang mas teknikal na “purpura,” at pinanatili sa talababa ang tunay na saklaw ng εὐφραινόμενος sa pagitan ng pangkalahatang pagpapakasaya at pagpipista.
