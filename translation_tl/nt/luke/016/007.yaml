reference: Luke 16:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἔπειτα ἑτέρῳ εἶπεν· Σὺ δὲ πόσον ὀφείλεις; ὁ δὲ εἶπεν· Ἑκατὸν κόρους σίτου· ⸀λέγει αὐτῷ· Δέξαι σου ⸂τὰ γράμματα⸃ καὶ γράψον ὀγδοήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/007.yaml
  text: Then he said to another[a], ‘And you, how much do you owe?’ He said, ‘A hundred cors of wheat.’ He says to him[b], ‘Take your bill and write eighty.’
translation:
  language: tl
  text: Pagkatapos, sinabi niya sa isa pa, ‘At ikaw, magkano ang utang mo?’ Sumagot ito, ‘Isandaang kor[a] ng trigo.’ Sabi niya rito, ‘Kunin mo ang kasulatan ng utang mo[b] at isulat mong walumpu.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang kor ay isang malaking sinaunang takal para sa tuyong produkto gaya ng butil.
    reason: cultural_note
  - marker: b
    text: Maaari ring ‘nakasulat na kasunduan’ o ‘mga dokumento mo.’ Sa Griyego, literal itong ‘mga kasulatan mo,’ na tumutukoy rito sa nakasulat na tala o kasulatan ng utang.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα
  choice: Pagkatapos
  rationale: Ipinahihiwatig nito ang kasunod na pangyayari at ang paglapit sa isa pang may utang.
- source_word: ἑτέρῳ
  choice: sa isa pa
  rationale: Tumutukoy ito sa ibang tao bukod sa naunang may utang, nang hindi nagdaragdag ng kasariang hindi tahasang nasa Griyego.
- source_word: Σὺ δὲ
  choice: At ikaw
  rationale: Pinananatili nito ang mariing pagtukoy sa kausap at ang banayad na paglipat o paghahambing na dala ng δέ.
- source_word: πόσον ὀφείλεις
  choice: magkano ang utang mo
  rationale: Likas at malinaw itong Filipino para sa pagkakautang na pinansiyal o pangkalakal.
- source_word: Ἑκατὸν κόρους σίτου
  choice: Isandaang kor ng trigo
  rationale: Ang κόρος ay tiyak na sinaunang takal para sa tuyong produkto; pinanatili ang katawagang ‘kor’ at ipinaliwanag sa talababa sa halip na palitan ng malabong ‘takal.’
- source_word: λέγει αὐτῷ
  choice: Sabi niya rito
  rationale: Ang ‘Sabi niya’ ay natural at hindi tahasang nakatali sa panahunang nakaraan, kaya naipadarama ang biglang paglipat ng Griyego sa makasaysayang pangkasalukuyan nang hindi nagiging pilit ang Filipino.
- source_word: Δέξαι
  choice: Kunin mo
  rationale: Sa konteksto, inuutusan ang may utang na kunin o tanggapin ang dokumentong hawak niya upang baguhin ang nakasulat.
- source_word: σου τὰ γράμματα
  choice: ang kasulatan ng utang mo
  rationale: Bagaman maramihan at literal na ‘mga kasulatan’ ang Griyego, tumutukoy ito rito sa dokumentong nagtatala ng utang. Malinaw ang tungkulin nito sa salaysay at pinananatili sa talababa ang literal na anyo at mga posibleng katawagan.
- source_word: γράψον ὀγδοήκοντα
  choice: isulat mong walumpu
  rationale: Malapit ito sa tuwirang utos ng Griyego na palitan sa dokumento ang halagang nakasulat.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘rito’ upang madaling matukoy na ang katiwala ang nagsasalita sa ikalawang may utang. Pinanatili ang sinaunang yunit na ‘kor’ dahil walang eksaktong katumbas na karaniwang yunit sa Filipino.
