  yaml_path: translation/nt/luke/016/004.yaml
  text: I know what I will do[a], so that when I am removed from the management, they may receive me into their homes.
translation:
  language: tl
  text: Alam ko na ang gagawin ko upang kapag inalis na ako sa pamamahala, tanggapin nila ako sa kanilang mga tahanan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγνων
  choice: Alam ko na
  rationale: Ang aorist ay idiomatikong nagpapahayag ng pagdating sa isang pagkaunawa o pasiya. Natural sa modernong Tagalog ang “Alam ko na,” na nagpapahiwatig na nakaisip na siya ng gagawin.
- source_word: τί ποιήσω
  choice: ang gagawin ko
  rationale: Ang deliberative subjunctive ay tumutukoy sa binabalak na kilos; ang parirala ay malinaw at natural bilang pahayag ng napagpasiyahang plano.
- source_word: ἵνα ὅταν
  choice: upang, kapag
  rationale: Pinananatili nito kapwa ang layunin na ipinahihiwatig ng ἵνα at ang hinaharap na pangyayaring ipinahihiwatig ng ὅταν.
- source_word: μετασταθῶ
  choice: inalis na ako
  rationale: Ang passive na pandiwa ay nangangahulugang alisin mula sa isang posisyon. Ang “inalis” ay tumpak at hindi mas makitid kaysa sa salitang Griyego.
- source_word: ἐκ τῆς οἰκονομίας
  choice: sa pamamahala
  rationale: Dito, ang οἰκονομία ay tungkulin o pananagutan sa pangangasiwa ng sambahayan. Ang “pamamahala” ay karaniwan at hindi nagdadala ng di-kinakailangang teolohikal na diwa.
- source_word: δέξωνταί με
  choice: tanggapin nila ako
  rationale: Ang δέχομαι ay maaaring mangahulugang tanggapin o malugod na tanggapin. Ang payak na “tanggapin” ay nagpapanatili ng saklaw ng orihinal nang hindi ipinapalagay ang antas ng kanilang pagkamagiliw.
- source_word: εἰς τοὺς οἴκους ἑαυτῶν
  choice: sa kanilang mga tahanan
  rationale: Sa konteksto ng pagkupkop, mas natural ang “mga tahanan” kaysa “mga bahay.” Sapat nang ipinakikita ng “kanilang” ang reflexive na ἑαυτῶν.
