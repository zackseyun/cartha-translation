  source_fidelity: Tumpak na naipapahayag ng salin ang temporal na hangganan ng “Kautusan at mga Propeta” hanggang kay Juan, ang patuloy na pagpapahayag ng kaharian ng Diyos bilang magandang balita, at ang mahirap na pangwakas na sugnay kung saan ang “bawat isa” ang simuno at ang kilos ay patungo sa kaharian. Ang “nagpupumilit na makapasok” ay isang maingat at katanggap-tanggap na Tagalog na pag-render ng βιάζεται na pinananatili ang kasidhian nang hindi labis na nilulutas ang pinagtatalunang tinig o pananaw ng pandiwa.
  naturalness: Natural at marangal ang modernong Filipino Tagalog. Ang “Ang Kautusan at ang mga Propeta,” “mula noon,” at “kaharian ng Diyos” ay malinaw at angkop sa biblikal na rehistro. Maayos ang daloy ng pangungusap.
  terminology: Ang “Kautusan,” “mga Propeta,” at “kaharian ng Diyos” ay pare-pareho, kinikilalang terminong biblikal, at hindi nagpapataw ng isang partikular na doktrinal na pagbasa. Ang mga talababa ay wastong nakaugnay sa pangwakas na sugnay at sapat na iniingatan ang leksikal at interpretatibong alternatibo.
