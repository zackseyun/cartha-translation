reference: Luke 16:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ὁ νόμος καὶ οἱ προφῆται ⸀μέχρι Ἰωάννου· ἀπὸ τότε ἡ βασιλεία τοῦ θεοῦ εὐαγγελίζεται καὶ πᾶς εἰς αὐτὴν βιάζεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/016.yaml
  text: The Law and the Prophets were until John; from then on the kingdom of God is being proclaimed as good news, and everyone is forcing his way into it.
translation:
  language: tl
  text: Ang Kautusan at ang mga Propeta ay hanggang kay Juan; mula noon, ipinahahayag bilang magandang balita ang kaharian ng Diyos, at ang bawat isa ay nagpupumilit na makapasok dito.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “ang bawat isa ay pilit na pumapasok dito.” Ang pandiwang Griyego ay maaaring magpahiwatig ng mapuwersa o masidhing pagkilos.'
    reason: lexical_alternative
  - marker: b
    text: May mga umuunawa sa huling bahagi sa mas negatibong paraan, lalo na dahil sa kahawig na pahayag sa Mateo 11:12. Ngunit dito, “ang bawat isa”—hindi “ang kaharian”—ang simuno ng pandiwang Griyego.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁ νόμος καὶ οἱ προφῆται
  choice: Ang Kautusan at ang mga Propeta
  rationale: Pinananatili ang kinikilalang katawagang Judio para sa Kautusan ni Moises at sa propetikong bahagi ng Kasulatan; ang malalaking titik ay nagpapakitang mga kategorya ng Kasulatan ang tinutukoy.
- source_word: μέχρι Ἰωάννου
  choice: hanggang kay Juan
  rationale: Likas na Tagalog na nagpapahayag ng hangganang temporal; mula sa konteksto, si Juan na Tagapagbautismo ang tinutukoy.
- source_word: ἀπὸ τότε
  choice: mula noon
  rationale: Maikli at natural na paglilipat-panahon na nagpapanatili sa diwa ng pagpapatuloy mula sa panahong iyon.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ang kaharian ng Diyos
  rationale: Karaniwang salin na nagpapanatili kapwa sa konkretong larawan ng kaharian at sa dinamikong paghahari ng Diyos.
- source_word: εὐαγγελίζεται
  choice: ipinahahayag bilang magandang balita
  rationale: Ipinakikita ang pasibong patuloy na pagpapahayag at malinaw na pinananatili ang diwa ng mabuting balita sa pandiwa.
- source_word: πᾶς
  choice: ang bawat isa
  rationale: Tumutugma sa distributibong puwersa ng pang-isahang πᾶς at hindi nililimitahan ang saklaw sa isang di-binanggit na pangkat.
- source_word: εἰς αὐτὴν βιάζεται
  choice: nagpupumilit na makapasok dito
  rationale: Ipinapahayag ang masidhi at mapuwersang pagkilos papasok sa kaharian, habang natural sa modernong Tagalog at hindi ginagawang tahasang marahas ang parirala.
theological_decisions:
- issue: Kahulugan ng βιάζεται kaugnay ng kaharian
  choice: Ang bawat isa ay masidhi o mapuwersang nagsisikap na makapasok sa kaharian.
  alternative: Maaaring unawain nang mas negatibo o marahas ang kilos, lalo na kung ihahambing sa Mateo 11:12.
  rationale: Sa Lucas, ang gramatikal na simuno ay πᾶς, “bawat isa,” at ang εἰς αὐτήν ay natural na nagpapahiwatig ng kilos papasok sa kaharian. Pinananatili ng salin ang puwersa at tensiyon ng pandiwa nang hindi ipinahihiwatig na natatamo ang kaharian sa sariling merito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Kautusan,” “mga Propeta,” at “kaharian ng Diyos” bilang pamilyar na katawagang biblikal. Ang “nagpupumilit na makapasok” ay pinili upang mapanatili ang kasidhian ng βιάζεται nang hindi maging alanganin o labis na marahas sa Tagalog.
