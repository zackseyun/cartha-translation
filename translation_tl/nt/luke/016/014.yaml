  text: Ἤκουον δὲ ταῦτα ⸀πάντα οἱ Φαρισαῖοι φιλάργυροι ὑπάρχοντες, καὶ ἐξεμυκτήριζον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/014.yaml
  text: The Pharisees[a], who were lovers of money, were hearing all these things and were ridiculing him.
translation:
  language: tl
  text: Pinakikinggan ng mga Pariseo, na maibigin sa salapi, ang lahat ng ito, at nililibak nila siya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinagtatawanan nila siya nang may paghamak.” Ang pandiwa ay maaaring tumukoy sa hayagang panlilibak o mapanghamak na panunuya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουον
  choice: Naririnig
  rationale: Ipinahihiwatig ng aspektong imperpektibo ang patuloy o kasabay na pakikinig sa takbo ng salaysay; natural itong naipahahayag sa Tagalog sa “naririnig.”
- source_word: δὲ
  choice: Hindi tahasang isinalin
  rationale: Banayad na panandang pandiskurso ito. Sapat nang ipakita sa paghahati at daloy ng mga pangungusap ang paglipat, nang hindi nagdaragdag ng mas mariing “ngunit” o temporal na “ngayon.”
- source_word: ταῦτα πάντα
  choice: ang lahat ng ito
  rationale: Malinaw na tumutukoy pabalik sa lahat ng naunang itinuro ni Jesus.
- source_word: οἱ Φαρισαῖοι
  choice: ang mga Pariseo
  rationale: Karaniwan at malinaw na katawagan sa modernong Filipino para sa grupong Judio na binanggit sa mga Ebanghelyo.
- source_word: φιλάργυροι ὑπάρχοντες
  choice: Dahil maibigin sila sa salapi
  rationale: Pinananatili nito ang tahasang diwa ng pag-ibig sa salapi at ang paglalarawang ibinibigay ng participial phrase, sa halip na palawakin agad tungo sa mas interpretatibong “sakim.”
- source_word: ἐξεμυκτήριζον
  choice: nililibak
  rationale: Ipinahahayag ng “nililibak” ang hayag at mapanlait na panunuya. Bagaman hindi lantad sa anyong Filipino ang imperpektibong aspekto, ipinakikita ng konteksto na ito ang tugon nilang nagaganap habang nakikinig.
- source_word: αὐτόν
  choice: siya
  rationale: Ang panghalip ay tumutukoy kay Jesus ayon sa konteksto.
theological_decisions:
- issue: Paglalarawan sa φιλάργυροι
  choice: maibigin sa salapi
  alternative: sakim
  rationale: Ang Griyego ay tuwirang nagsasaad ng pag-ibig sa salapi. Mas malapit dito ang “maibigin sa salapi” at pinananatili nito ang ugnayan sa naunang turo tungkol sa kayamanan nang hindi nagdaragdag ng mas malawak na hatol.
- issue: Ugnayan ng pagiging maibigin sa salapi at panlilibak
  choice: Dahil maibigin sila sa salapi
  alternative: na maibigin sa salapi
  rationale: Ang participle ay maaaring basahin bilang simpleng paglalarawan, ngunit sa konteksto ay natural ding nagpapahiwatig ng dahilan ng kanilang pagtutol. Ginamit ang “dahil” bilang malinaw at natural na ugnayan sa Filipino, habang hindi nagdaragdag ng denominasyonal na interpretasyon.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Hinati sa dalawang pangungusap upang maging natural ang daloy at maiwasan ang mabigat na pagkakasingit ng sugnay. Ang tandang [a] ay inilagay pagkatapos ng pariralang tinutukoy nito.
