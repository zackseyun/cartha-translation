id: LUK.16.8
reference: Luke 16:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐπῄνεσεν ὁ κύριος τὸν οἰκονόμον τῆς ἀδικίας ὅτι φρονίμως ἐποίησεν· ὅτι οἱ υἱοὶ τοῦ αἰῶνος τούτου φρονιμώτεροι ὑπὲρ τοὺς υἱοὺς τοῦ φωτὸς εἰς τὴν γενεὰν τὴν ἑαυτῶν εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/008.yaml
  text: And the master praised the unrighteous manager because he had acted shrewdly[c][b][a]. For the sons of this age are more shrewd in dealing with their own generation than the sons of light are.
translation:
  language: tl
  text: At pinuri ng amo[a] ang di-matuwid na katiwala dahil kumilos ito nang maparaan. Sapagkat ang mga anak ng kapanahunang ito[b] ay mas maparaan sa pakikitungo sa sarili nilang salinlahi[c] kaysa sa mga anak ng liwanag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Panginoon.” Mas pinili rito ang “amo” dahil sa konteksto ng talinghaga, malamang na ang amo ng katiwala ang tinutukoy ng κύριος.
    reason: alternative_reading
  - marker: b
    text: Ang “mga anak ng kapanahunang ito” at “mga anak ng liwanag” ay mga pahayag na naghahambing sa mga taong hinuhubog ng kasalukuyang kapanahunan at sa mga taong nakaugnay sa liwanag ng Diyos.
    reason: lexical_alternative
  - marker: c
    text: 'Mas literal: “mas maparaan kaysa sa mga anak ng liwanag para sa sarili nilang salinlahi.” Mahirap ang pariralang Griyego; ipinahahayag ng salin ang pagiging maparaan nila sa loob ng sarili nilang lipunan o pangkat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ κύριος
  choice: ang amo
  rationale: Sa agarang konteksto ng talinghaga, pinakamalamang na tumutukoy ito sa amo ng katiwala. Natural sa modernong Tagalog ang “amo” para sa ganitong ugnayan, habang itinatala sa talababa ang posibleng “Panginoon.”
- source_word: τὸν οἰκονόμον
  choice: ang ... katiwala
  rationale: Ang “katiwala” ay malinaw at dignified na tawag sa taong inatasang mamahala sa ari-arian o sambahayan ng iba.
- source_word: τῆς ἀδικίας
  choice: di-matuwid
  rationale: Pinananatili nito ang moral na bigat ng ἀδικία nang hindi nililimitahan ang kasalanan sa pandaraya lamang.
- source_word: φρονίμως / φρονιμώτεροι
  choice: nang maparaan / mas maparaan
  rationale: Ipinahahayag ng “maparaan” ang praktikal at estratehikong talas na pinupuri rito, nang hindi ipinahihiwatig na mabuti sa moral ang ginawa ng katiwala. Pinananatili rin ang pagkakaugnay ng pang-abay at pahambing sa Griyego.
- source_word: οἱ υἱοὶ τοῦ αἰῶνος τούτου
  choice: ang mga anak ng kapanahunang ito
  rationale: Pinananatili ang metaporang Semitiko at ang tahasang paghahambing sa “mga anak ng liwanag.” Ipinaliliwanag sa talababa ang kahulugan nito.
- source_word: οἱ υἱοὶ τοῦ φωτός
  choice: ang mga anak ng liwanag
  rationale: Pinananatili ang biblikal na larawan at ang pormal na pagkakatugma nito sa “mga anak ng kapanahunang ito.”
- source_word: εἰς τὴν γενεὰν τὴν ἑαυτῶν
  choice: sa pakikitungo sa sarili nilang salinlahi
  rationale: Ginagawang natural at mauunawaan sa Tagalog ang mahirap na pariralang Griyego, habang pinananatili ang sanggunian sa kanilang sariling salinlahi o lipunang kinabibilangan.
theological_decisions:
- issue: Ang tinutukoy ng ὁ κύριος sa unang sugnay
  choice: Ang amo sa loob ng talinghaga
  alternative: Ang Panginoon, na maaaring unawaing si Jesus o ang Diyos
  rationale: Itinuturo ng pinakamalapit na konteksto ang mayamang amo sa talinghaga bilang tinutukoy. Gayunman, dahil maaari ring isalin ang κύριος na “Panginoon,” pinananatili sa talababa ang alternatibo.
- issue: Ang moral na pagtataya sa ginawa ng katiwala
  choice: Pinuri ang kanyang pagiging maparaan, hindi ang kanyang di-matuwid na asal
  alternative: Pinuri ang kanyang ginawa bilang karunungang mabuti sa moral, o sinang-ayunan ang kanyang pandaraya
  rationale: Magkasabay na tinatawag ng teksto na di-matuwid ang katiwala at pinupuri ang paraan ng pagkilos niya. Pinananatili ng salin ang tensiyong ito sa paggamit ng “di-matuwid” at “maparaan.”
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “amo,” “katiwala,” at “maparaan” bilang madaling maunawaang mga salitang hindi nawawala ang kontekstong panlipunan at moral na tensiyon ng talata. Pinanatili ang mga metaporang “mga anak ng kapanahunang ito” at “mga anak ng liwanag,” na may paliwanag sa talababa.
