  text: καὶ ἐπιθυμῶν χορτασθῆναι ⸀ἀπὸ τῶν πιπτόντων ἀπὸ τῆς τραπέζης τοῦ πλουσίου· ἀλλὰ καὶ οἱ κύνες ἐρχόμενοι ⸀ἐπέλειχον τὰ ἕλκη αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/021.yaml
  text: and longing to be fed from what fell from the rich man's table[a]. But even the dogs came and licked his sores.
translation:
  language: tl
  text: at nananabik siyang mabusog sa mga nahuhulog mula sa hapag ng mayaman.[a] Ngunit maging ang mga aso ay lumalapit at dinidilaan ang kanyang mga sugat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa mga tira-tirang pagkaing nahuhulog mula sa hapag ng mayaman.” Literal na sinasabi ng Griyego na “sa mga nahuhulog”; ipinahihiwatig lamang ng tagpo ng pagkain na mga tira ang mga ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθυμῶν
  choice: nananabik
  rationale: Ipinahahayag ng kasalukuyang pandiwaring Griyego ang patuloy at matinding paghahangad; likas sa modernong Tagalog ang “nananabik” at hindi ito kasinghina ng simpleng “gusto.”
- source_word: χορτασθῆναι
  choice: mabusog
  rationale: Tumutukoy ito sa pagkakaroon ng sapat na pagkain. Tuwirang ipinahahayag ng “mabusog” ang diwa ng pagiging ganap na napakain sa kontekstong ito.
- source_word: ἀπὸ τῶν πιπτόντων
  choice: sa mga nahuhulog
  rationale: Ginagamit ang pandiwari bilang pangngalan at hindi tahasang sinasabi ng Griyego na “mga tira.” Pinananatili ng salin ang pangkalahatang anyo at ang patuloy na aspekto ng nahuhulog.
- source_word: τῆς τραπέζης
  choice: mula sa hapag
  rationale: Ang “hapag” ay natural at marangal na salin ng mesang kainan sa kontekstong ito.
- source_word: τοῦ πλουσίου
  choice: ng mayaman
  rationale: Ang pang-uri ay ginagamit bilang pangngalan at tumutukoy sa mayamang lalaki sa talinghaga; malinaw ito sa Tagalog nang hindi na inuulit ang “lalaki.”
- source_word: ἀλλὰ καὶ
  choice: Ngunit maging
  rationale: Pinananatili nito kapwa ang pagsalungat at ang nakakagulat na dagdag na diin ng parirala.
- source_word: οἱ κύνες
  choice: ang mga aso
  rationale: Tuwirang salin ng pangngalang maramihan, nang walang di-makatwirang pagpapalambot o karagdagang pagtutukoy.
- source_word: ἐρχόμενοι
  choice: lumalapit
  rationale: Sa konteksto, ang pagdating ng mga aso ay likas na ipinahahayag bilang paglapit nila kay Lazaro. Ang aspektong di-ganap ay akma sa paulit-ulit o nagpapatuloy na tagpo.
- source_word: ἐπέλειχον
  choice: dinidilaan
  rationale: Ang aspektong imperpektibo ng pandiwa ay nagpapahiwatig ng nagpapatuloy o paulit-ulit na pagdila; malinaw itong naihahayag ng aspektong nagaganap sa Tagalog.
- source_word: τὰ ἕλκη αὐτοῦ
  choice: ang kanyang mga sugat
  rationale: Ang ἕλκη ay mga bukas o ulceradong sugat. Ang “mga sugat” ay malinaw at karaniwang salita sa modernong Tagalog, samantalang ang “mga ulser” ay mas klinikal.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Pinanatili ang di-tahasang tinutukoy ng “mga nahuhulog” at ang nagpapatuloy o paulit-ulit na aspekto ng mga kilos.
