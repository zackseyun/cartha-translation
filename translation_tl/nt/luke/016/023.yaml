revisions:
- from: At sa Hades[a], habang nasa matinding paghihirap siya, itiningala niya ang kanyang mga mata at nakita sa malayo si Abraham, kasama si Lazaro sa kandungan nito.[b]
  to: At sa Hades[a], habang dumaranas siya ng mga paghihirap, itiningala niya ang kanyang mga mata at nakita niya sa malayo si Abraham, at si Lazaro ay nasa kandungan ni Abraham.[b]
  rationale: Pinalitan ang di-angkop na panghalip na "nito" ng tahasang "ni Abraham" upang maging malinaw, natural, at magalang ang pagtukoy. Ginawang pangmaramihan ang "mga paghihirap" upang mas maipakita ang βασάνοις. Hindi binago ang pagkakaiba ng Hades at Gehenna o ang larawan ng malapit na kinalalagyan ni Lazaro.
