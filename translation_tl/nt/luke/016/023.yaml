  - severity: low
    issue: Isahan ang "matinding paghihirap" para sa βασάνοις.
    rationale: Katanggap-tanggap ito bilang idiomatikong kolektibo, ngunit ang "mga paghihirap" ay mas malapit sa pangmaramihang Griyego nang nananatiling natural.
