  text: καὶ ἐν τῷ ᾅδῃ ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ, ὑπάρχων ἐν βασάνοις, ⸀ὁρᾷ Ἀβραὰμ ἀπὸ μακρόθεν καὶ Λάζαρον ἐν τοῖς κόλποις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/023.yaml
  text: And in Hades[a], lifting up his eyes, being in torment[b], he sees Abraham far away and Lazarus in his bosom.
translation:
  language: tl
  text: At sa Hades[a], habang dumaranas siya ng mga paghihirap, itiningala niya ang kanyang mga mata at nakita niya sa malayo si Abraham, at si Lazaro ay nasa kandungan ni Abraham.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “daigdig ng mga patay.” Ang Hades ay hindi ang Gehenna, ang katawagang kaugnay ng pangwakas na paghuhukom.
    reason: lexical_alternative
  - marker: b
    text: Literal na “sa kanyang mga kandungan”; isang idyomatikong larawan ng malapit at marangal na kinalalagyan. Tradisyonal na “sa kandungan ni Abraham.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾅδῃ
  choice: Hades
  rationale: Pinanatili ang natatanging terminong Griyego upang hindi ito awtomatikong maitumbas sa Gehenna o sa pangwakas na lugar ng paghuhukom.
- source_word: ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: itiningala niya ang kanyang mga mata
  rationale: Pinananatili ang konkretong larawan ng idyomang Griyego at malinaw pa rin ito sa makabagong Filipino.
- source_word: ὑπάρχων ἐν βασάνοις
  choice: habang nasa matinding paghihirap siya
  rationale: Ipinahahayag ang pangyayaring kasabay ng pagtingala at ang matinding pagdurusang tinutukoy ng βασάνοις.
- source_word: ὁρᾷ
  choice: nakita
  rationale: Ginamit ang likas na aspektong pasalaysay sa Filipino; ang Griyego ay masiglang pangkasalukuyang anyo sa loob ng salaysay, ngunit ang literal na “nakikita” rito ay magiging hindi gaanong natural.
- source_word: ἀπὸ μακρόθεν
  choice: sa malayo
  rationale: Maikli, natural, at tumpak na ipinahahayag ang malaking agwat na nakikita sa tagpo.
- source_word: ἐν τοῖς κόλποις αὐτοῦ
  choice: sa kandungan nito
  rationale: Pinananatili ang larawang nagpapahiwatig ng napakalapit at maginhawang kinalalagyan ni Lazaro kay Abraham; ang “nito” ay tumutukoy kay Abraham nang hindi inuulit ang pangalan.
theological_decisions:
- issue: Ang kahulugan ng ᾅδης sa usapin ng kalagayan ng mga patay at pangwakas na paghuhukom
  choice: Hades
  alternative: impiyerno; daigdig ng mga patay
  rationale: Pinananatili ng “Hades” ang leksikal na pagkakaiba nito sa Gehenna at hindi nilulutas sa salin ang mas malawak na debateng teolohikal.
- issue: Ang larawan ng κόλπος na tradisyonal na tinatawag na “kandungan ni Abraham”
  choice: sa kandungan nito
  alternative: kapiling ni Abraham; malapit sa dibdib nito
  rationale: Pinananatili ang pisikal at relasyonal na larawan ng orihinal habang gumagamit ng pariralang nauunawaan sa Filipino; hindi nito tinutukoy nang higit sa sinasabi ng talata ang eksaktong katangian ng kinalalagyan ni Lazaro.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang “Hades” bilang teknikal ngunit pamilyar na salitang biblikal, at ipinaliwanag ito sa talababa. Ang “sa kandungan nito” ay sadyang nagpapanatili sa larawan ng Griyego sa halip na gawing abstraktong “kapiling.”
