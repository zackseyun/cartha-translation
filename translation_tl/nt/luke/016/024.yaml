id: LUK.16.24
reference: Luke 16:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ αὐτὸς φωνήσας εἶπεν· Πάτερ Ἀβραάμ, ἐλέησόν με καὶ πέμψον Λάζαρον ἵνα βάψῃ τὸ ἄκρον τοῦ δακτύλου αὐτοῦ ὕδατος καὶ καταψύξῃ τὴν γλῶσσάν μου, ὅτι ὀδυνῶμαι ἐν τῇ φλογὶ ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/024.yaml
  text: And he cried out and said[a], ‘Father Abraham, have mercy on me, and send Lazarus so that he may dip the tip of his finger in water and cool my tongue, because I am in agony in this flame.’
translation:
  language: tl
  text: At sumigaw siya, “Amang Abraham, maawa ka sa akin at suguin mo si Lazaro upang isawsaw niya sa tubig ang dulo ng kanyang daliri at palamigin ang dila ko, sapagkat matindi ang pagdurusa ko sa liyab na ito.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sapagkat pinahihirapan ako sa liyab na ito.” Maaaring tumukoy ang pandiwang Griyego sa matinding pagdurusa o pagpapahirap.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσας
  choice: sumigaw
  rationale: Ipinahihiwatig ng aorist participle ang malakas at apurahang pagtawag; tuwiran at natural itong naipapahayag ng “sumigaw.”
- source_word: Πάτερ Ἀβραάμ
  choice: Amang Abraham
  rationale: Pinananatili ang tuwirang panawagan at ang pag-apela kay Abraham bilang ninuno.
- source_word: ἐλέησόν με
  choice: maawa ka sa akin
  rationale: Karaniwan at tuwirang pakiusap ito para sa habag, nang hindi dinaragdagan ang teolohikal na diwa.
- source_word: πέμψον
  choice: suguin mo
  rationale: Ang “suguin” ay angkop sa utos na magpadala ng isang tao para sa isang tiyak na gawain.
- source_word: βάψῃ
  choice: isawsaw
  rationale: Tumutukoy ang pandiwa sa panandaliang paglubog o pagsawsaw, na angkop sa dulo lamang ng daliri.
- source_word: τὸ ἄκρον τοῦ δακτύλου αὐτοῦ
  choice: ang dulo ng kanyang daliri
  rationale: Malinaw at malapit ito sa kongkretong larawan at balangkas ng Griyego.
- source_word: ὕδατος
  choice: sa tubig
  rationale: Likas sa Filipino ang “isawsaw sa tubig” para sa genitive na kasama ng βάψῃ.
- source_word: καταψύξῃ
  choice: palamigin
  rationale: Pinananatili nito ang kongkretong larawan ng pagpapalamig, sa halip na gawing mas malawak na “pagbibigay-ginhawa.”
- source_word: γλῶσσάν μου
  choice: ang dila ko
  rationale: Tuwirang tinutukoy ang bahagi ng katawan, gaya ng nasa Griyego.
- source_word: ὀδυνῶμαι
  choice: matindi ang pagdurusa ko
  rationale: Ipinahahayag nito ang matinding sakit o paghihirap na taglay ng pandiwa nang hindi ipinapalagay kung may panlabas na tagapagparusa.
- source_word: ἐν τῇ φλογὶ ταύτῃ
  choice: sa liyab na ito
  rationale: Mas tiyak ang “liyab” kaysa “apoy” at pinananatili ang matingkad at isahang larawan ng φλόξ.
theological_decisions:
- issue: Paglalarawan sa pagdurusa ng mayaman
  choice: sapagkat matindi ang pagdurusa ko sa liyab na ito
  alternative: sapagkat pinahihirapan ako sa liyab na ito
  rationale: Malakas ang ὀδυνῶμαι at tumutukoy sa matinding sakit o pagdurusa. Iniiwasan ng pangunahing salin na tahasang magpahiwatig ng isang panlabas na tagapagparusa, samantalang pinananatili sa talababa ang posibleng diwang “pinahihirapan.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang isahang “ka/mo” upang tumbasan ang mga isahang pautos sa Griyego; hindi nagdagdag ng “po” o maramihang panggalang na wala sa teksto. Pinanatili ang kongkretong larawang “dulo ng daliri,” “dila,” at “liyab.”
