  terminology: Ang “bangin,” “sa pagitan namin at ninyo,” at “makatawid” ay angkop. Pinananatili ng “naitakda” ang diin ng perpektong balintiyak sa isang naitatag na kalagayan nang hindi nagdaragdag ng tahasang doktrina tungkol sa kawalang-hanggan.
