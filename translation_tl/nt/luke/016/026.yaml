  source_fidelity: 'Tumpak ang pangunahing diwa: may malaking paghihiwalay sa pagitan ng dalawang panig at walang makakatawid sa alinmang direksiyon. Gayunman, ang “permanenteng nakapuwesto” ay mas malayang paglalarawan kaysa sa ἐστήρικται (“naitakda/naipirmi”) at hindi likas na kolokasyon para sa “bangin.”'
