  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ⸀ἐν πᾶσι τούτοις μεταξὺ ἡμῶν καὶ ὑμῶν χάσμα μέγα ἐστήρικται, ὅπως οἱ θέλοντες διαβῆναι ἔνθεν πρὸς ὑμᾶς μὴ δύνωνται, ⸀μηδὲ ἐκεῖθεν πρὸς ἡμᾶς διαπερῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/026.yaml
  text: And besides all these things[a], between us and you a great chasm has been fixed, so that those wanting to cross over from here to you cannot, nor can they cross over from there to us.
translation:
  language: tl
  text: At bukod sa lahat ng ito[a], isang malaking bangin ang naitakda sa pagitan namin at ninyo, upang ang mga nagnanais na tumawid mula rito patungo sa inyo ay hindi makatawid, at hindi rin makatawid mula riyan patungo sa amin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “at sa lahat ng bagay na ito.” Ang pariralang Griyego ay maaaring unawain nang mas literal, ngunit sa konteksto ay nagpapakilala ito ng karagdagang konsiderasyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πᾶσι τούτοις
  choice: bukod sa lahat ng ito
  rationale: Sa konteksto, nagpapakilala ito ng karagdagang dahilan o konsiderasyon. Likas sa modernong Tagalog ang “bukod sa lahat ng ito,” habang ang mas literal na “sa lahat ng ito” ay maaaring magpahiwatig ng ibang ugnayan.
- source_word: μεταξὺ ἡμῶν καὶ ὑμῶν
  choice: sa pagitan namin at ninyo
  rationale: Tuwirang pinananatili ang ugnayang pansarili at ang pangmaramihang anyo ng ὑμῶν sa pamamagitan ng “ninyo.”
- source_word: χάσμα μέγα
  choice: isang malaking bangin
  rationale: Ang “bangin” ay malinaw at karaniwang salitang Tagalog para sa malalim at malawak na puwang na naghihiwalay sa dalawang panig; hindi nito dinaragdagan ang talinghaga ng tiyak na doktrinal na detalye.
- source_word: ἐστήρικται
  choice: permanenteng nakapuwesto
  rationale: Ang perpektong balintiyak ay nagpapahayag ng isang puwang na naitakda at nananatiling matatag. Ginagawang tahasan ng “permanente” ang nananatiling kalagayan, samantalang hindi tinutukoy kung sino ang nagtakda nito.
- source_word: ὅπως
  choice: upang
  rationale: Natural na ipinapakita ang ugnayang layunin o kinalabasan nang hindi pinipili nang mahigpit sa dalawang posibilidad.
- source_word: οἱ θέλοντες
  choice: ang mga nagnanais
  rationale: Pinananatili ang pangkalahatang pangkat na tinutukoy ng substantibong pandiwari at ang diwa ng pagnanais.
- source_word: διαβῆναι
  choice: makatawid
  rationale: Likas na Tagalog para sa kakayahang tumawid mula sa isang panig tungo sa kabila.
- source_word: ἔνθεν ... ἐκεῖθεν
  choice: mula rito ... mula riyan
  rationale: Pinananatili ang deiktikong paghahambing mula sa panig ng nagsasalita at sa kabilang panig.
- source_word: μὴ δύνωνται ... μηδὲ ... διαπερῶσιν
  choice: hindi makatawid ... ni makatawid
  rationale: Malinaw na kawalan ng kakayahan, hindi lamang pagbabawal, at pinananatili ang magkatimbang na dalawang sugnay.
theological_decisions:
- issue: Ang kalikasan ng paghihiwalay sa dalawang kalagayan o dako sa talinghaga
  choice: Ilarawan ang bangin bilang permanenteng hindi matatawid, ayon sa diin ng talata.
  alternative: Ipaliwanag ito bilang literal na topograpiya ng kabilang buhay, o bilang purong sagisag na walang ipinahihiwatig na pirming paghihiwalay.
  rationale: Binibigyang-diin ng Griyego ang matatag at nananatiling puwang at ang kawalan ng kakayahang tumawid. Hindi pinalalawak ng salin ang larawan tungo sa isang sistematikong doktrina na hindi tahasang sinabi sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “ninyo” upang malinaw ang pangmaramihang kausap. Iniwasan ang labis na teknikal o denominasyonal na pananalita.
