  to: At bukod sa lahat ng ito[a], isang malaking bangin ang naitakda sa pagitan namin at ninyo, upang ang mga nagnanais na tumawid mula rito patungo sa inyo ay hindi makatawid, at hindi rin makatawid mula riyan patungo sa amin.
