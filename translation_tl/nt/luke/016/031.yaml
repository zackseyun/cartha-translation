id: LUK.16.31
reference: Luke 16:31
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ· Εἰ Μωϋσέως καὶ τῶν προφητῶν οὐκ ἀκούουσιν, οὐδ’ ἐάν τις ἐκ νεκρῶν ἀναστῇ πεισθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/031.yaml
  text: But he said to him[a], ‘If they do not listen to Moses and the Prophets[c][b], neither will they be persuaded if someone rises from the dead.’
translation:
  language: tl
  text: Ngunit sinabi niya sa kanya, “Kung hindi sila nakikinig kay Moises at sa mga Propeta[a], hindi rin sila mapapaniwala kahit may isang bumangon mula sa mga patay[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Moises at ang mga Propeta” ay karaniwang katawagan para sa Kautusan at sa mga Propeta bilang mga kasulatan ng Israel.
    reason: cultural_or_literary_clarification
  - marker: b
    text: 'Maaari ring isalin: “mula sa hanay ng mga patay.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ αὐτῷ
  choice: Ngunit sinabi niya sa kanya
  rationale: Ipinahihiwatig ng “Ngunit” ang banayad na pagsalungat ng δέ, at likas sa modernong Tagalog ang “sinabi niya sa kanya.”
- source_word: Μωϋσέως καὶ τῶν προφητῶν
  choice: kay Moises at sa mga Propeta
  rationale: Pinananatili ang kilalang katawagang Judio para sa makapangyarihang patotoo ng Kasulatan, nang hindi ito pinapalitan ng paliwanag na “Kasulatan.”
- source_word: οὐκ ἀκούουσιν
  choice: hindi sila nakikinig
  rationale: Saklaw ng ἀκούω ang pakikinig at pagbibigay-pansin; pinananatili ng “nakikinig” ang lawak na ito nang hindi tahasang dinaragdagan ng ideya ng pagsunod.
- source_word: οὐδ’ ἐάν
  choice: hindi rin ... kahit
  rationale: 'Likas na inililipat sa Tagalog ang pinatinding negatibong kondisyon: hindi sila mapapaniwala kahit mangyari ang kasunod na kundisyon.'
- source_word: τις
  choice: may isang
  rationale: Pinananatili ang di-tiyak ngunit isahang pagtukoy ng τις.
- source_word: ἐκ νεκρῶν
  choice: mula sa mga patay
  rationale: Karaniwan at malinaw na pananalita sa Tagalog para sa pagbangon mula sa kalagayan o hanay ng mga patay.
- source_word: ἀναστῇ
  choice: bumangon
  rationale: Ang aspektong ganap ng “bumangon” ay angkop sa kondisyong ipinahihiwatig ng aorist subjunctive pagkatapos ng ἐάν.
- source_word: πεισθήσονται
  choice: mapapaniwala
  rationale: Ipinapahayag ang pasibong diwa ng pagiging nahikayat o nakumbinsi, nang hindi ito nililimitahan sa teknikal na diwa ng pananampalatayang nagliligtas.
theological_decisions:
- issue: Kahulugan ng “Moises at ng mga Propeta”
  choice: Pinanatili bilang katawagan sa makapangyarihang patotoo ng Kasulatang ibinigay sa Israel
  alternative: Tahasang isalin bilang “ang Kasulatan,” o ituring lamang na dalawang uri ng mga indibidwal
  rationale: Sa konteksto, metonimiya ito para sa patotoo ng Kasulatan. Pinananatili ng salin ang orihinal na pahayag at hindi ito pinapaliit o ipinapaliwanag sa mismong talata.
- issue: Saklaw ng πεισθήσονται
  choice: mapapaniwala
  alternative: maniniwala; magsisisi; makukumbinsi
  rationale: Ang pandiwa ay tumutukoy sa pagiging nahikayat o nakumbinsi. Ang “maniniwala” o “magsisisi” ay maaaring magpasok ng mas tiyak na teolohikal na tugon kaysa sa mismong Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “nakikinig” upang mapanatili ang posibleng diwa ng parehong pagdinig at pagbibigay-pansin; “mapapaniwala” upang maiwasang gawing mas tiyak sa teolohiya ang πεισθήσονται. Ang mga marker [a] at [b] ay kapwa nasa pangunahing teksto.
