id: LUK.16.30
reference: Luke 16:30
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Οὐχί, πάτερ Ἀβραάμ, ἀλλ’ ἐάν τις ἀπὸ νεκρῶν πορευθῇ πρὸς αὐτοὺς μετανοήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/030.yaml
  text: But he said[a], ‘No, father Abraham, but if someone goes to them from among the dead, they will change their thinking.’
translation:
  language: tl
  text: Ngunit sinabi niya, “Hindi, amang Abraham! Subalit kung may pumunta sa kanila mula sa mga patay, magsisisi sila.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐχί
  choice: Hindi
  rationale: Tuwirang mariing pagtutol; natural ang “Hindi” sa makabagong usapan, at naipahihiwatig ng tandang padamdam ang diin.
- source_word: πάτερ Ἀβραάμ
  choice: amang Abraham
  rationale: Vocative na nagpapahayag ng pakikipag-ugnayan kay Abraham bilang ninuno. Likas sa Tagalog ang anyong “amang” bago ang pangalan sa ganitong tuwirang pagtawag.
- source_word: ἀλλ’ ἐάν
  choice: Subalit kung
  rationale: Pinananatili ang pagtutuwid at pagsalungat sa naunang pahayag, kasabay ng kondisyon.
- source_word: τις
  choice: may
  rationale: Natural na Tagalog para sa di-tiyak na isang tao sa pariralang “kung may pumunta.”
- source_word: ἀπὸ νεκρῶν
  choice: mula sa mga patay
  rationale: Tuwirang ipinapakita ang ἀπό at ang pangmaramihang νεκρῶν, habang nananatiling natural at hindi nilulutas kung ang diin ay sa kalagayan o sa lipon ng mga patay.
- source_word: πορευθῇ πρὸς αὐτοὺς
  choice: pumunta sa kanila
  rationale: Ang aorist subjunctive sa kondisyong ἐάν ay natural na naihahayag sa Tagalog sa “kung ... pumunta”; pinananatili rin ang direksiyong patungo sa kanila.
- source_word: μετανοήσουσιν
  choice: magsisisi sila
  rationale: Sa kontekstong Lukan, ang pandiwa ay tumutukoy sa moral at espirituwal na pagsisisi at pagbabalik-loob, hindi lamang sa pagbabago ng isip.
theological_decisions:
- issue: Kahulugan ng μετανοήσουσιν
  choice: magsisisi sila
  alternative: magbabago ang kanilang isip / magbabalik-loob sila
  rationale: Ang “magsisisi” ang karaniwan at malinaw na salitang Tagalog na nagpapanatili sa moral-espirituwal na bigat ng μετάνοια nang hindi ito nililimitahan sa intelektuwal na pagbabago lamang.
- issue: Saklaw ng ἀπὸ νεκρῶν
  choice: mula sa mga patay
  alternative: mula sa gitna ng mga patay / mula sa kamatayan
  rationale: Pinananatili ng salin ang pangmaramihang anyo at tunay na posibilidad ng kahulugang paglabas mula sa lipon o kalagayan ng mga patay, nang hindi nagdaragdag ng paliwanag na wala sa talata.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “amang Abraham” bilang likas na vocative at ang “magsisisi” bilang malinaw na panrelihiyon ngunit karaniwang nauunawaang salita.
