  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐγένετο δὲ ἀποθανεῖν τὸν πτωχὸν καὶ ἀπενεχθῆναι αὐτὸν ὑπὸ τῶν ἀγγέλων εἰς τὸν κόλπον Ἀβραάμ· ἀπέθανεν δὲ καὶ ὁ πλούσιος καὶ ἐτάφη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/022.yaml
  text: It happened that the poor man died and was carried by the angels to Abraham’s bosom[a]. And the rich man also died and was buried.
translation:
  language: tl
  text: Nangyari nga na namatay ang dukha at dinala siya ng mga anghel sa kandungan ni Abraham.[a] Namatay din ang mayaman at inilibing.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa tabi ni Abraham.” Ang pananalitang Griyego ay literal na “sa kandungan ni Abraham,” isang larawan ng pagiging malapit, karangalan, at matalik na pakikisama.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: Nangyari nga na
  rationale: Pinananatili nito ang pormulang pasalaysay ni Lucas at ang banayad na paglipat na ipinahihiwatig ng δέ, nang hindi nagdaragdag ng tahasang panandang temporal.
- source_word: ἀποθανεῖν τὸν πτωχὸν
  choice: namatay ang dukha
  rationale: Likas sa Tagalog ang sugnay na may pandiwang nasa tahasang anyo; ang “dukha” ay tuwirang nagsasaad ng matinding karalitaan nang hindi ipinapalagay na siya ay namamalimos.
- source_word: ἀπενεχθῆναι αὐτὸν ὑπὸ τῶν ἀγγέλων
  choice: dinala siya ng mga anghel
  rationale: Malinaw at natural itong katumbas ng pasibong diwa at tahasang ahensiya sa Griyego.
- source_word: εἰς τὸν κόλπον Ἀβραάμ
  choice: sa kandungan ni Abraham
  rationale: Pinananatili ng “kandungan” ang kongkretong larawan ng κόλπος at ang diwa ng pagiging malapit at marangal na kasama ni Abraham, sa halip na gawing pangkalahatang katawagan para sa kabilang buhay.
- source_word: ἀπέθανεν δὲ καὶ ὁ πλούσιος
  choice: Namatay din ang mayaman
  rationale: Ang “din” ay natural na kumakatawan sa καί at itinatampok ang magkatulad na katotohanang kapuwa sila namatay.
- source_word: ἐτάφη
  choice: inilibing
  rationale: Tuwiran at maikli nitong isinasalin ang pasibong ἐτάφη sa natural na Tagalog.
theological_decisions:
- issue: Pagpapakahulugan sa εἰς τὸν κόλπον Ἀβραάμ
  choice: sa kandungan ni Abraham
  alternative: sa tabi ni Abraham
  rationale: Pinananatili ng pangunahing salin ang metapora at ang teolohikal na tensiyon ng talinghaga. Inilalagay sa talababa ang mas idyomatikong alternatibo upang hindi tahimik na ipaliwanag o gawing pangkalahatang konsepto ng kabilang buhay ang larawan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “dukha” sa halip na “pulubi” upang huwag magdagdag ng detalyeng wala sa mismong sugnay, at “kandungan” upang mapanatili ang larawan ng orihinal.
