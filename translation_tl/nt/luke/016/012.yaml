  text: καὶ εἰ ἐν τῷ ἀλλοτρίῳ πιστοὶ οὐκ ἐγένεσθε, τὸ ⸀ὑμέτερον τίς ⸂δώσει ὑμῖν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/012.yaml
  text: And if you have not been faithful with what belongs to another[c][b][a], who will give you what is your own?
translation:
  language: tl
  text: At kung hindi kayo naging tapat sa bagay na pag-aari ng iba,[a][c] sino ang magbibigay sa inyo ng talagang para sa inyo?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa pag-aari ng iba.”
    reason: lexical_alternative
  - marker: b
    text: O, “ng bagay na inyo.”
    reason: lexical_alternative
  - marker: c
    text: Maaaring tumukoy ang pagtutol sa pagiging tapat sa kayamanan sa mundong ito ngayon at sa pagtanggap ng tunay o pangmatagalang kayamanan sa hinaharap; hindi tahasang tinutukoy sa mismong talata kung ano ang mga ito.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλοτρίῳ
  choice: sa bagay na pag-aari ng iba
  rationale: Ang pang-uri ay ginamit bilang pangngalan at tumutukoy sa isang bagay na pag-aari ng ibang tao. Pinananatili ng salin ang diwang ito nang hindi tinutukoy kung ano mismo ang bagay.
- source_word: πιστοὶ
  choice: naging tapat
  rationale: Sa konteksto ng pangangasiwa, ang πιστός ay tumutukoy sa pagiging maaasahan o tapat, hindi sa pagsampalataya.
- source_word: οὐκ ἐγένεσθε
  choice: hindi kayo naging
  rationale: Natural nitong ipinapahayag sa Filipino ang pagiging o pagpapatunay na tapat sa kondisyong binabanggit.
- source_word: τὸ ὑμέτερον
  choice: ng para sa inyo
  rationale: Ipinahahayag nito ang substantibong diwa na ‘yaong inyo’ at pinananatili ang pagtutol nito sa pag-aari ng iba.
- source_word: δώσει ὑμῖν
  choice: magbibigay sa inyo
  rationale: Ito ang tuwirang kahulugan ng δίδωμι. Hindi ginamit ang mas interpretibong ‘ipagkakatiwala sa inyo,’ bagaman akma iyon sa konteksto ng pangangasiwa.
- source_word: καὶ εἰ
  choice: At kung
  rationale: Pinananatili nito ang ugnayan sa naunang sinabi at malinaw na ipinapasok ang kondisyong pangungusap.
- source_word: τίς
  choice: sino
  rationale: Tuwiran at natural nitong naihahayag ang retorikal na tanong tungkol sa taong magbibigay.
theological_decisions:
- issue: Ang tinutukoy ng ‘pag-aari ng iba’ at ‘para sa inyo’
  choice: Hindi tahasang tukuyin sa pangunahing teksto kung ano ang dalawang bagay na pinagtutulad.
  alternative: Unawain ang mga ito bilang kayamanan sa mundong ito at tunay o walang-hanggang kayamanan; o bilang mga ipinagkatiwalang ari-arian at mana sa hinaharap.
  rationale: Malinaw ang pagtutol sa Griyego ngunit hindi tahasang pinangalanan sa talatang ito ang mga tinutukoy. Pinananatili ng salin ang sadyang pagiging di-tiyak nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘bagay na pag-aari ng iba’ upang manatiling natural ngunit malapit sa substantibong anyo ng Griyego; iniwasang idagdag sa pangunahing teksto ang ‘kayamanan,’ ‘mana,’ o ‘ipagkakatiwala’ upang hindi paliitin ang posibleng kahulugan.
