- from: At kung hindi kayo naging tapat sa bagay na pag-aari ng iba,[a][c] sino ang magbibigay sa inyo ng para sa inyo?[b]
  to: At kung hindi kayo naging tapat sa bagay na pag-aari ng iba,[a][c] sino ang magbibigay sa inyo ng talagang para sa inyo?[b]
  rationale: Pinalitan ang hindi gaanong likas na “ng para sa inyo” ng “ng talagang para sa inyo” upang maipahayag ang τὸ ὑμέτερον bilang “yaong tunay na inyo,” habang nananatiling di-tiyak ang tinutukoy. Inalis sa footnote b ang di-sinusuportahang aspektong panghinaharap na “magiging.” Pinakinis din ang footnote c nang walang pagbibigay-kahulugan sa pangunahing teksto.
