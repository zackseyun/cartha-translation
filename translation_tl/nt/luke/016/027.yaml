id: LUK.16.27
reference: Luke 16:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἶπεν δέ· Ἐρωτῶ ⸂σε οὖν⸃, πάτερ, ἵνα πέμψῃς αὐτὸν εἰς τὸν οἶκον τοῦ πατρός μου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/027.yaml
  text: Then he said[a], ‘I ask you then, father, that you send him to my father’s house,’
translation:
  language: tl
  text: Sinabi naman niya, “Kung gayon, nakikiusap ako sa iyo[a], ama, na ipadala mo siya sa bahay ng aking ama,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “humihiling ako sa iyo.” Ang pandiwang Griyego ay nangangahulugang humiling o makiusap; sa kontekstong ito, taimtim ang pakiusap.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δέ
  choice: Sinabi naman niya
  rationale: Ang δέ ay banayad na pang-ugnay na nagpapatuloy sa salaysay; natural na ipinapahayag ito ng “naman” sa Filipino nang hindi pinatitindi bilang tahasang pagsalungat.
- source_word: Ἐρωτῶ
  choice: nakikiusap ako
  rationale: Ang ἐρωτάω ay nangangahulugang humiling o makiusap. Sa kontekstong ito, ang “nakikiusap” ay natural at nagpapakita ng taimtim na pakiusap nang hindi umaabot sa mas matinding “nagmamakaawa.”
- source_word: σε οὖν
  choice: Kung gayon ... sa iyo
  rationale: Ipinahihiwatig ng οὖν ang bunga o pagpapatuloy mula sa naunang pagtanggi. Ang “Kung gayon” ay malinaw at likas na Filipino, samantalang ang σε ay tuwirang isinaling “sa iyo.”
- source_word: πάτερ
  choice: ama
  rationale: Tawag ito kay Abraham bilang ninuno sa loob ng talinghaga, hindi tuwirang pagtawag sa Diyos; kaya maliit na titik ang ginamit.
- source_word: ἵνα πέμψῃς
  choice: na ipadala mo
  rationale: Pagkatapos ng pandiwa ng paghiling, inilalahad ng ἵνα at pasakali ang nilalaman ng pakiusap. Pinananatili ng “na ipadala mo” ang nakadependeng estruktura at natural ito sa Filipino.
- source_word: αὐτὸν
  choice: siya
  rationale: Tumutukoy ang panghalip kay Lazaro mula sa naunang konteksto.
- source_word: εἰς τὸν οἶκον τοῦ πατρός μου
  choice: sa bahay ng aking ama
  rationale: Ang οἶκος ay tumutukoy rito sa bahay o tahanan. Ang “sa bahay ng aking ama” ay malinaw at dignidad na Filipino para sa patutunguhang ipinahahayag ng εἰς.
theological_decisions:
- issue: Ang bokatibong πάτερ sa talinghaga
  choice: ama
  alternative: Ama
  rationale: Si Abraham ang kinakausap bilang ninuno. Ang maliit na titik ay umiiwas sa maling pahiwatig na tuwirang tinatawag ng nagsasalita ang Diyos.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “Kung gayon” upang maipakita ang lohikal na pagpapatuloy ng οὖν, at “nakikiusap” para sa taimtim ngunit hindi labis na pinatinding kahulugan ng ἐρωτάω.
