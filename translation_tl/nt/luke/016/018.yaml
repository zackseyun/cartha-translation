  verdict: revise
  source_fidelity: Kailangang itama ang “nakikipaghiwalay,” sapagkat ang makipag- ay karaniwang nagpapahiwatig ng kapwa o magkatuwang na paghihiwalay. Ang ἀπολύων ay ang pagkilos ng lalaki na humihiwalay/dumidiborsiyo sa kanyang asawa; ang ikalawang sugnay ay malinaw na balintiyak para sa babaeng hiniwalayan ng asawa. Pinananatili ng rebisyon ang pangkalahatang saklaw, ang dalawang paggamit ng μοιχεύει, at ang walang-eksepsiyong pahayag ng Lucas.
  naturalness: Mas natural at mas tiyak ang “humihiwalay sa kanyang asawa” kaysa “nakikipaghiwalay.” Ang “babaeng hiniwalayan ng kanyang asawa” ay malinaw na modernong Filipino at iniiwasan ang malabong “asawa nito.”
  terminology: Ang “nangangalunya” ay wastong katumbas ng μοιχεύει sa marangal ngunit nauunawaang rehistro. Ang “ibang babae” ay ginagawang hayag ang pambabaeng layon ng ἑτέραν, na hinihingi ng konteksto at ng kasunod na pagtukoy sa babae.
  issues:
  - severity: medium
    issue: Ang “nakikipaghiwalay” ay may pahiwatig na kapwa o pinagkaisahang paghihiwalay.
    rationale: Hindi ito ang tuwirang pokus ng aktibong ἀπολύων, na inilalarawan ang lalaki bilang siyang humihiwalay/dumidiborsiyo sa kanyang asawa. Ang “humihiwalay” ay mas malapit sa direksiyong ito nang hindi nagdaragdag ng isang tiyak na makabagong legal na proseso.
  - severity: low
    issue: Ang “asawa nito” ay maaaring hindi agad malinaw kung kanino tumutukoy.
    rationale: Ang “kanyang asawa” ay tuwirang nag-uugnay sa babae at sa asawang lalaking hiniwalayan niya, alinsunod sa ἀπὸ ἀνδρός.
