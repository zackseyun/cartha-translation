  text: Πᾶς ὁ ἀπολύων τὴν γυναῖκα αὐτοῦ καὶ γαμῶν ἑτέραν μοιχεύει, ⸀καὶ ὁ ἀπολελυμένην ἀπὸ ἀνδρὸς γαμῶν μοιχεύει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/018.yaml
  text: Everyone who divorces his wife and marries another commits adultery[b][a], and he who marries a woman divorced from her husband commits adultery.
translation:
  language: tl
  text: Ang sinumang lalaking humihiwalay sa kanyang asawa at nag-aasawa ng ibang babae ay nangangalunya; at ang sinumang nag-aasawa sa babaeng hiniwalayan ng kanyang asawa ay nangangalunya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πᾶς ὁ
  choice: Ang bawat lalaking
  rationale: Ipinahahayag ng konstruksyon ang pangkalahatan at saklaw-lahat na pahayag; nilinaw ang lalaking tinutukoy dahil sa kasunod na “kanyang asawa,” habang nananatiling natural sa Filipino.
- source_word: ἀπολύων
  choice: nakikipaghiwalay
  rationale: Sa konteksto ng pag-aasawa, tumutukoy ito sa diborsiyo o pagpapawalang-bisa sa pagsasama, hindi lamang sa literal na pagpapaalis. Ang “nakikipaghiwalay” ay malinaw at karaniwang salitang Filipino nang hindi nagtatakda ng isang partikular na makabagong prosesong legal.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: sa kanyang asawa
  rationale: Sa kontekstong ito, ang γυνή ay “asawa,” hindi lamang “babae.”
- source_word: γαμῶν ἑτέραν
  choice: nag-aasawa ng iba
  rationale: Likas na ipinahihiwatig sa Filipino na ibang babae ang pinakasalan; pinananatili ng “iba” ang maigsi at pangkalahatang anyo ng Griyego.
- source_word: μοιχεύει
  choice: nangangalunya
  rationale: Direkta at kinikilalang katumbas ng pandiwang tumutukoy sa pangangalunya; ang aspektong pangkasalukuyan ay angkop sa pangkalahatang pahayag.
- source_word: ἀπολελυμένην
  choice: isang babaeng hiniwalayan
  rationale: Pinananatili ang tinig na balintiyak at ang kalagayang bunga ng pagkakahiwalay na ipinahahayag ng perfect passive participle.
- source_word: ἀπὸ ἀνδρός
  choice: ng asawa nito
  rationale: Sa konteksto ng kasal, ang ἀνήρ ay “asawang lalaki.” Ang “hiniwalayan ng asawa nito” ay natural na Filipino at pinananatiling malinaw na ang babae ang tumanggap ng pagkakahiwalay.
theological_decisions:
- issue: Saklaw at puwersa ng pahayag ni Jesus tungkol sa paghihiwalay
  choice: Isinalin bilang pangkalahatang pahayag na moral, nang walang idinagdag na eksepsiyon.
  alternative: Magdagdag ng ipinahihiwatig na eksepsiyon mula sa Mateo o limitahan ang pahayag sa isang tiyak na kalagayang legal.
  rationale: Walang nakasaad na eksepsiyon sa tekstong Griyego ng talatang ito sa Lucas. Dapat panatilihin ng salin ang maigsi at mariing anyo nito at huwag lutasin sa mismong teksto ang tensiyon sa ibang mga talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nakikipaghiwalay” sa halip na teknikal na “dinidiborsiyo” upang maging likas sa ordinaryong mambabasa at hindi itali ang salita sa isang partikular na sistemang legal. Walang talababa dahil walang lexical na alternatibong kailangang ilahad para maunawaan ang talata.
