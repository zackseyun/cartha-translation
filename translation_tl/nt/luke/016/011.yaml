  text: εἰ οὖν ἐν τῷ ἀδίκῳ μαμωνᾷ πιστοὶ οὐκ ἐγένεσθε, τὸ ἀληθινὸν τίς ὑμῖν πιστεύσει;
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/011.yaml
  text: If[a], then, you have not been faithful with unrighteous wealth[b], who will entrust the true riches to you?
translation:
  language: tl
  text: Kung hindi nga kayo naging tapat sa di-matuwid na kayamanan[a], sino ang mag-iipinagkatiwala sa inyo ng tunay na kayamanan[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mapandayang kayamanan.” Sa literal, “ang di-matuwid na mammon.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ang tunay.” Ipinahihiwatig ng konteksto ang “tunay na kayamanan,” bilang kaibahan sa di-matuwid na kayamanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδίκῳ
  choice: di-matuwid
  rationale: Pinananatili nito ang moral na kulay ng ἄδικος nang hindi nililimitahan ang kahulugan sa kayamanang nakuha lamang sa pandaraya. Ang “mapandaya” ay posible ngunit mas makitid.
- source_word: μαμωνᾷ
  choice: kayamanan
  rationale: Ang μαμωνᾶς ay tumutukoy sa yaman o mga ari-arian, hindi lamang sa salapi. Mas natural sa makabagong Tagalog ang “kayamanan” kaysa sa transliterasyong “mammon.”
- source_word: ἐν τῷ ἀδίκῳ μαμωνᾷ
  choice: sa di-matuwid na kayamanan
  rationale: Ang ἐν ay likas na isinalin bilang “sa” upang ipahayag ang larangan o bagay na pinangangasiwaan nang tapat.
- source_word: πιστοὶ
  choice: tapat
  rationale: Sa konteksto ng pamamahala ng ipinagkatiwala, ang πιστός ay tumutukoy sa pagiging maaasahan at tapat.
- source_word: οὐκ ἐγένεσθε
  choice: hindi kayo naging
  rationale: 'Likas nitong ipinahahayag sa Tagalog ang γίνομαι na may panaguring pang-uri: hindi sila napatunayang tapat o hindi naging tapat.'
- source_word: τὸ ἀληθινὸν
  choice: tunay na kayamanan
  rationale: Pangngalang gamit ang pang-uring neuter singular at walang tahasang kasamang pangngalan. Idinagdag ang “kayamanan” dahil malinaw ang paghahambing sa μαμωνᾶς, habang itinatala sa talababa ang literal na anyo.
- source_word: πιστεύσει
  choice: magtitiwala sa inyo ng
  rationale: Kapag may di-tuwirang layon na tao at tuwirang layon na bagay, ang πιστεύω ay nangangahulugang magtiwala o magpagkatiwala ng isang bagay sa isang tao, hindi simpleng “maniwala.”
theological_decisions:
- issue: Ang kahulugan ng τὸ ἀληθινὸν bilang kaibahan ng di-matuwid na kayamanan
  choice: tunay na kayamanan
  alternative: “ang tunay” o “ang tunay na bagay”
  rationale: Hindi tahasang binabanggit sa Griyego ang pangngalan, kaya nananatili ang impormasyong ito sa talababa. Gayunman, ipinahihiwatig ng tuwirang paghahambing sa μαμωνᾶς ang tunay na kayamanan; nililinaw ito sa pangunahing teksto nang hindi tinutukoy kung ano mismo ang bumubuo rito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “di-matuwid” upang mapanatili ang moral na diin ng Griyego, at ang karaniwang “kayamanan” sa halip na ang di-pamilyar na “mammon.”
