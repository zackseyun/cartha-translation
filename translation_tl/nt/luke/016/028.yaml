  source_fidelity: Ang draft ay wastong nagsasalin sa γάρ, limang lalaking kapatid, layuning magbabala, negatibong layunin, at ‘lugar ... ng pagdurusa.’ Gayunman, ang hiwalay na ‘Suguin mo siya’ ay hindi nasa Griyegong teksto ng talatang ito. Bagaman nahihinuha ito mula sa naunang talata, ang ὅπως-sugnay ay dapat manatiling sugnay ng layunin at hindi gawing isang dagdag na tahasang utos.
  naturalness: Natural at marangal ang rebisyong Filipino. Ang ‘upang taimtim niya silang balaan’ ay nagbibigay ng kinakailangang paksa sa Filipino nang hindi inuulit o idinaragdag ang pakiusap mula sa naunang talata. Ang ‘para hindi rin sila mapunta’ ay likas at pinananatili ang layuning ipinahahayag ng ἵνα μή.
  terminology: Ang ‘mga kapatid na lalaki’ ay tumpak para sa panlalaking ἀδελφούς sa kontekstong ito. Ang ‘pagdurusa’ ay isang maingat at sapat na salin ng βάσανος at hindi nagpapasok ng karagdagang doktrina. Ang talababa ay angkop na nag-iingat ng saklaw na ‘magpatotoo’ at ‘mahigpit na magbabala.’
