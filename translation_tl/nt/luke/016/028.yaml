base_translation:
  language: en
  yaml_path: translation/nt/luke/016/028.yaml
  text: for I have five brothers[a], so that he may solemnly warn them, lest they too come to this place of torment.
translation:
  language: tl
  text: Sapagkat mayroon akong limang kapatid na lalaki, upang taimtim niya silang balaan[a], para hindi rin sila mapunta sa lugar na ito ng pagdurusa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “taimtim na magpatotoo sa kanila” o “mahigpit silang balaan.” Ang pandiwang Griyego ay may diwa ng taimtim na pagpapatotoo o pagbababala.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχω γὰρ
  choice: Sapagkat mayroon akong
  rationale: Ipinakikita ng γάρ ang paliwanag na kaugnay ng naunang pakiusap, at ang ἔχω ay karaniwang nangangahulugang “mayroon.”
- source_word: πέντε ἀδελφούς
  choice: limang kapatid na lalaki
  rationale: Ang pangngalan ay panlalaking maramihan at tumutukoy rito sa limang lalaking kapatid.
- source_word: ὅπως διαμαρτύρηται αὐτοῖς
  choice: upang taimtim silang balaan
  rationale: Nagpapahayag ang ὅπως ng layunin. Maaaring mangahulugan ang διαμαρτύρομαι ng taimtim na pagpapatotoo o matinding pagbababala; dahil layunin nitong ilayo sila sa lugar ng pagdurusa, ang “taimtim na balaan” ang likas at angkop sa konteksto.
- source_word: ἵνα μὴ καὶ αὐτοὶ ἔλθωσιν
  choice: para hindi rin sila mapunta
  rationale: Pinananatili nito ang negatibong layunin ng ἵνα μή at ang diwa ng καὶ αὐτοί na “sila rin.”
- source_word: εἰς τὸν τόπον τοῦτον τῆς βασάνου
  choice: sa lugar na ito ng pagdurusa
  rationale: Ang εἰς ay nagsasaad ng patutunguhan, at ang βάσανος ay matinding hirap o pagpapahirap. Ang “pagdurusa” ay malinaw at marangal, at hindi nagdaragdag ng doktrinang hindi tahasang sinasabi ng talata.
theological_decisions:
- issue: Paglalarawan sa kinaroroonan matapos ang kamatayan ayon sa sinabi ng mayaman
  choice: lugar na ito ng pagdurusa
  alternative: lugar na ito ng pagpapahirap
  rationale: Inilalarawan lamang ng teksto ang lugar batay sa nararanasang βάσανος. Pinananatili ng salin ang tindi nito nang hindi pinalalawak ang talata tungo sa isang mas sistematikong paglalarawang doktrinal.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “Suguin mo siya” bilang likas na pagpapatuloy ng pakiusap sa naunang talata at upang maging buo ang diwa sa Filipino, bagaman ipinahiwatig lamang ito ng sugnay na layunin sa Griyego.
