  naturalness: Makabago at marangal ang kabuuang rehistro. Ang rebisyong pangunahing teksto ay nag-aalis ng bahagyang pilit na kolokasyon na ‘makipagkaibigan ... para sa inyong sarili’ habang pinananatili ang kahulugan.
