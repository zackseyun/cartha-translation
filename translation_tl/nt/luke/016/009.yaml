base_translation:
  language: en
  yaml_path: translation/nt/luke/016/009.yaml
  text: And I tell you[a], make friends for yourselves by means of unrighteous wealth, so that when it fails[c][b], they may welcome you into the eternal dwellings.
translation:
  language: tl
  text: 'At sinasabi ko sa inyo: Magkaroon kayo ng mga kaibigan para sa inyong sarili sa pamamagitan ng di-matuwid na kayamanan,[a] upang kapag mawala na ito,[b] tanggapin nila kayo sa mga walang hanggang tahanan.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula sa mamon ng di-katuwiran.” Ang “mamon” ay tradisyonal na salin ng salitang Griyego para sa kayamanan o salapi.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “kapag kayo ay pumanaw” o “kapag maubos na ito.” Walang hayag na simuno ang pandiwang Griyego; karaniwang inuunawa itong tumutukoy sa pagkawala ng kayamanan, ngunit inuunawa naman ito ng ilan bilang pagkamatay ng isang tao.
    reason: alternative_reading
  - marker: c
    text: 'Sa mas literal: “sa mga walang hanggang tolda.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑαυτοῖς ποιήσατε φίλους
  choice: Makipagkaibigan kayo para sa inyong sarili
  rationale: Likas sa makabagong Tagalog ang “makipagkaibigan” bilang katumbas ng idyomang “gumawa ng mga kaibigan,” habang pinananatili ng “para sa inyong sarili” ang reflexive dative na ἑαυτοῖς.
- source_word: ἐκ τοῦ μαμωνᾶ τῆς ἀδικίας
  choice: sa pamamagitan ng di-matuwid na kayamanan
  rationale: Ipinahahayag ng “sa pamamagitan ng” ang instrumentong diwa ng ἐκ sa konteksto. Ang “di-matuwid na kayamanan” ay mas malawak kaysa “kayamanang nakuha sa pandaraya” at hindi rin sapilitang ginagawang persona ang μαμωνᾶς.
- source_word: μαμωνᾶ
  choice: kayamanan
  rationale: Malinaw at karaniwang salita ito sa Tagalog para sa yaman o salapi; inilalagay sa talababa ang tradisyonal na “mamon.”
- source_word: τῆς ἀδικίας
  choice: di-matuwid
  rationale: Pinananatili nito ang malawak na moral na diwa ng ἀδικία nang hindi ito nililimitahan sa pandaraya o sa yamang ilegal na nakuha.
- source_word: ἵνα ὅταν ἐκλίπῃ
  choice: upang kapag mawala na ito
  rationale: Ang “mawala” ay nagpapahayag ng pagkapawi o pagdating sa wakas. Ang “ito” ay tumutukoy, ayon sa pinakamalapit na antecedent, sa kayamanan, ngunit itinatala sa talababa ang tunay na kalabuan ng di-binanggit na simuno.
- source_word: δέξωνται ὑμᾶς
  choice: tanggapin nila kayo
  rationale: Ang “tanggapin” ay likas at sapat na nagpapahiwatig ng malugod na pagtanggap sa isang tirahan. Hindi tinutukoy kung sino ang “sila,” gaya rin ng Griyego.
- source_word: εἰς τὰς αἰωνίους σκηνάς
  choice: sa mga walang hanggang tahanan
  rationale: Ang “tahanan” ay malinaw na naghahatid ng diwa ng mga dakong tirahan, samantalang pinananatili sa talababa ang literal na larawan ng “mga tolda.”
theological_decisions:
- issue: Kahulugan ng “di-matuwid na kayamanan”
  choice: Kayamanang kaugnay ng kasalukuyang mundong nababahiran ng di-katuwiran, hindi lamang salaping nakuha sa pandaraya
  alternative: Kayamanang nakuha sa paraang di-tapat; o personipikadong Mamon bilang karibal na panginoon
  rationale: Hindi nililimitahan ng parirala ang utos sa ilegal na yaman, at hindi rin nito ipinipilit dito ang ganap na personipikasyon ng Mamon. Pinananatili ng salin ang teolohikal na tensiyon.
- issue: Simuno ng ἐκλίπῃ
  choice: Ang kayamanan ang nawawala o nauubos
  alternative: Ang tao ang “nawawala,” na inuunawang siya ay namamatay; o ang mga panlupang mapagkukunan sa pangkalahatan
  rationale: Ang μαμωνᾶς ang pinakamalapit at pinakanatural na tinutukoy, ngunit walang hayag na simuno ang pandiwang Griyego kaya iningatan sa talababa ang ibang pagbasa.
- issue: Pagkakakilanlan ng “sila” sa δέξωνται
  choice: Hindi tinukoy
  alternative: Ang mga kaibigang natamo sa mapagbigay na paggamit ng yaman; ang mga dukha o bayan ng Diyos; o mga makalangit na nilalang
  rationale: Hindi pinangalanan ng Griyego ang simuno. Ang pagtukoy sa kanila sa pangunahing teksto ay lalampas sa sinasabi ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasan ang sobrang teknikal o makalumang pananalita. Ginamit ang “di-matuwid” upang mapanatili ang malawak na moral at teolohikal na saklaw ng ἀδικία, at iniwan ang pagkakakilanlan ng “sila” na sadyang hindi tiyak.
