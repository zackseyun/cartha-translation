id: LUK.16.13
reference: Luke 16:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὐδεὶς οἰκέτης δύναται δυσὶ κυρίοις δουλεύειν· ἢ γὰρ τὸν ἕνα μισήσει καὶ τὸν ἕτερον ἀγαπήσει, ἢ ἑνὸς ἀνθέξεται καὶ τοῦ ἑτέρου καταφρονήσει. οὐ δύνασθε θεῷ δουλεύειν καὶ μαμωνᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/013.yaml
  text: No household servant can serve two masters; for either he will hate the one and love the other[a], or he will be devoted to one and despise the other. You cannot serve God and Mammon.
translation:
  language: tl
  text: Walang aliping-bahay ang maaaring maglingkod sa dalawang panginoon. Sapagkat kapopootan niya ang isa at iibigin ang kabila, o kakapit siya sa isa at hahamakin ang kabila. Hindi kayo maaaring maglingkod sa Diyos at sa Mammon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kayamanan” o “salapi.” Ginagamit sa Griyego ang Mammon, isang katawagan sa kayamanang inilalarawan dito bilang karibal na panginoon.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκέτης
  choice: aliping-bahay
  rationale: Tumutukoy ito sa isang taong nasa katayuang alipin o lingkod sa loob ng sambahayan. Pinananatili ng “aliping-bahay” ang tiyak na kontekstong domestiko at ang ugnayan ng pagpapasakop sa panginoon.
- source_word: κυρίοις
  choice: mga panginoon
  rationale: Sa paghahambing na ito, ang κύριος ay mga among may kapangyarihan sa alipin; natural at malinaw sa Tagalog ang “panginoon” sa pariralang “dalawang panginoon.”
- source_word: δουλεύειν
  choice: makapaglilingkod
  rationale: Ipinahihiwatig ng pandiwa ang paglilingkod bilang alipin. Ang “maglingkod” ay natural sa Tagalog, samantalang pinananatili ng “aliping-bahay” at “panginoon” ang diwa ng pagkasakop.
- source_word: μισήσει
  choice: kapopootan
  rationale: Pinananatili nito ang matindi at tuwirang pagsalungat ng μισέω sa ἀγαπάω, sa halip na palambutin bilang “mamahalin nang mas kaunti.”
- source_word: ἀγαπήσει
  choice: iibigin
  rationale: Ang “iibigin” ay dignido at malinaw na katapat ng pagkapoot sa antitesis ng pangungusap.
- source_word: ἀνθέξεται
  choice: kakapit
  rationale: Ang pandiwa ay may diwang pagkapit nang mahigpit, pananatili, o pagtatapat sa isang panig. Ang “kakapit” ay natural at pinananatili ang kongkretong larawan ng matatag na pagkiling.
- source_word: καταφρονήσει
  choice: hahamakin
  rationale: Tumpak nitong ipinahahayag ang pagtingin nang may paghamak o kawalang-halaga at pinananatili ang lakas ng ikalawang pagtutunggali.
- source_word: θεῷ
  choice: Diyos
  rationale: Tuwirang tumutukoy sa Diyos bilang isa sa dalawang pinaglilingkuran.
- source_word: μαμωνᾷ
  choice: Mammon
  rationale: Pinananatili ang hiram na katawagan at ang halos isinataong paglalarawan sa kayamanan bilang karibal na panginoon; ipinaliliwanag sa talababa ang kahulugan nito.
theological_decisions:
- issue: Paglalarawan sa μαμωνᾷ bilang karibal ng Diyos
  choice: Mammon
  alternative: kayamanan o salapi
  rationale: Ang transliterasyong “Mammon” ay nagpapanatili sa retorikal na pagsasatao sa kayamanan bilang isang panginoong humihingi ng katapatan. Hindi nito ipinapahiwatig na literal na diyos ang Mammon; nililinaw ng talababa ang kahulugan.
- issue: Kasarian at bilang ng kinatawang alipin
  choice: niya
  alternative: ang aliping iyon / nila
  rationale: Nasa pang-isahang anyo ang Griyego ngunit hindi kailangang tukuyin ang kasarian sa Tagalog. Ang “niya” ay natural, tapat sa pang-isahang kinatawan, at hindi nagdaragdag ng kasariang hindi kailangang ipahayag.
translation_notes:
  register: Modernong Filipino Tagalog na dignido at madaling maunawaan. Ginamit ang “aliping-bahay” upang maipakita ang domestikong konteksto at katayuang alipin; pinanatili ang matitinding antitesis na “kapopootan/iibigin” at “kakapit/hahamakin.”
