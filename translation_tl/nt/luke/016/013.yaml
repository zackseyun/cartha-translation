  rationale: Inayos ang magkatapat na mga panghalip bilang “ang isa ... ang kabila” upang malinaw na maipakita ang dalawang magkahiwalay na panginoon sa Griyego. Pinalitan din ang “makapaglilingkod” ng “maaaring maglingkod” para sa mas natural na pagpapahayag ng δυνατότητα nang hindi binabago ang kahulugan.
