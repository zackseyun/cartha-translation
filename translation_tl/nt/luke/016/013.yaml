  naturalness: Dignido at madaling maunawaan ang register. Mas natural at mas malinaw sa modernong Tagalog ang “Walang aliping-bahay ang maaaring maglingkod” at ang magkatambal na “ang isa ... ang kabila.”
  terminology: Ang “aliping-bahay,” “mga panginoon,” “Diyos,” at “Mammon” ay angkop. Ang “Mammon” ay wastong pinanatili upang huwag patagin ang personipikadong puwersa ng kayamanan; sapat ang paliwanag sa talababa.
  issues:
