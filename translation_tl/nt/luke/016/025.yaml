source:
  edition: SBLGNT
  text: εἶπεν δὲ Ἀβραάμ· Τέκνον, μνήσθητι ὅτι ⸀ἀπέλαβες τὰ ἀγαθά σου ἐν τῇ ζωῇ σου, καὶ Λάζαρος ὁμοίως τὰ κακά· νῦν δὲ ὧδε παρακαλεῖται σὺ δὲ ὀδυνᾶσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/025.yaml
  text: But Abraham said[a], ‘Child, remember that you received your good things during your life, and Lazarus likewise bad things; but now he is comforted here[b], and you are in anguish.’
translation:
  language: tl
  text: Ngunit sinabi ni Abraham, “Anak, alalahanin mo na tinanggap mo[a] ang mabubuting bagay na para sa iyo noong nabubuhay ka pa, at gayundin si Lazaro ay tumanggap ng mga paghihirap. Ngunit ngayon ay inaaliw siya rito, at ikaw naman ay nasa matinding pagdurusa.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tinanggap mo nang lubos.” Maaaring ipahiwatig ng pandiwang Griyego ang pagtanggap ng nakalaan o ang pagtanggap nang lubos.
    reason: lexical_alternative
  - marker: b
    text: O “pinahihirapan ka.” Maaaring tumukoy ang salitang Griyego sa matinding sakit o dalamhati.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τέκνον
  choice: Anak
  rationale: Likas na pantawag sa Filipino na nagpapanatili ng magiliw ngunit nakatatandang pakikitungo, nang hindi iginiit na literal na anak siya ni Abraham.
- source_word: μνήσθητι
  choice: alalahanin mo
  rationale: Tuwiran at natural na utos na gunitain ang nakaraang kalagayan.
- source_word: ἀπέλαβες
  choice: tinanggap mo
  rationale: Pinananatili ang malawak na diwa ng pagtanggap; maaaring magpahiwatig ang pandiwa ng pagtanggap ng nakalaan o pagtanggap nang lubos, kaya inilagay ang alternatibo sa talababa.
- source_word: τὰ ἀγαθά σου
  choice: ang mabubuting bagay na para sa iyo
  rationale: Pinananatili ang malawak at konkretong diwa ng mga bagay na kapaki-pakinabang o kasiya-siya, nang hindi dinaragdagan ng teolohikal na kulay ng “mga pagpapala.”
- source_word: ἐν τῇ ζωῇ σου
  choice: noong nabubuhay ka pa
  rationale: Natural na modernong Filipino na malinaw na tumutukoy sa panahon ng buhay niya sa lupa.
- source_word: ὁμοίως
  choice: gayundin
  rationale: Malinaw na ipinapakita ang magkatulad na pagtanggap ngunit magkasalungat na uri ng karanasan.
- source_word: τὰ κακά
  choice: ang masasamang bagay
  rationale: Tumutukoy sa masasaklap o di-kanais-nais na naranasan ni Lazaro, hindi sa kasamaang moral na ginawa niya; pinananatili ang lawak ng Griyego.
- source_word: παρακαλεῖται
  choice: inaaliw siya
  rationale: Sa konteksto, ang pasibong anyo ay nangangahulugang tumatanggap siya ng kaaliwan.
- source_word: ὧδε
  choice: rito
  rationale: Maikli at natural na pantukoy sa lugar kung nasaan si Abraham at si Lazaro.
- source_word: ὀδυνᾶσαι
  choice: nagdurusa ka sa matinding sakit
  rationale: Ipinahahayag ang matindi at aktuwal na kirot o dalamhati nang hindi awtomatikong ipinapasok ang mas interpretatibong “pinahihirapan.”
theological_decisions:
- issue: Paglalarawan sa pagdurusa pagkamatay
  choice: nagdurusa ka sa matinding sakit
  alternative: pinahihirapan ka
  rationale: Ipinananatili ang malinaw na matinding pagdurusa sa tagpo, ngunit hindi tinutukoy sa salin kung sino o ano ang tuwirang sanhi nito; sa gayon, hindi nilulutas ang higit sa sinasabi ng ὀδυνᾶσαι.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “Anak” bilang likas na pantawag, “noong nabubuhay ka pa” para sa malinaw na temporal na diwa, at “inaaliw” bilang idiomatikong katumbas ng pagtanggap ng kaaliwan. Ang mga talababa ay minarkahan sa pangunahing teksto.
