  source_fidelity: 'Ang pangunahing diwa ay tapat sa Griyego: ang magkasalungat na karanasan ng mayaman at ni Lazaro sa buhay at ang kasalukuyang pag-aliw/pagdurusa. Gayunman, ang “masasamang bagay” ay sa modernong Filipino ay madaling maunawaang moral na kasamaan, samantalang τὰ κακά rito ay mga masamang dinanas o paghihirap. Ang “sa matinding sakit” ay medyo nagpapakitid sa ὀδυνᾶσαι, na maaari ring tumukoy sa matinding dalamhati o pagdurusa.'
  naturalness: Natural at marangal ang kabuuang daloy. Mas malinaw at mas idiomatiko sa kasalukuyang Filipino ang “mga paghihirap” para sa τὰ κακά at “ikaw naman ay nasa matinding pagdurusa” para sa huling sugnay. Iniiwasan din nito ang bahagyang kalabuan ng “samantalang nagdurusa ka sa matinding sakit.”
  terminology: Ang “Anak,” “alahanin mo,” “mabubuting bagay,” at “inaaliw” ay angkop. Panatilihin ang Lazaro, ang nakaugaliang anyo ng pangalan sa Filipino. Ang binagong “mga paghihirap” ay tumutugma sa kontekstuwal na kahulugan ng τὰ κακά nang hindi nagpapahiwatig ng moral na masama.
