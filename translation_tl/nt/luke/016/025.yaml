    rationale: Bagaman literal na posible, karaniwang tumutukoy ito sa moral na masasamang bagay sa Filipino. Sa kontekstong ito, ang tinutukoy ay mga masamang karanasan o paghihirap na dinanas ni Lazaro.
  - severity: low
