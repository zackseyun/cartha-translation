revisions:
- from: Ngunit sinabi ni Abraham, “Anak, alalahanin mong tinanggap mo[a] ang mabubuting bagay na para sa iyo noong nabubuhay ka pa, at gayundin, tinanggap ni Lazaro ang masasamang bagay. Ngunit ngayo’y inaaliw siya rito, samantalang nagdurusa ka sa matinding sakit.[b]”
  to: Ngunit sinabi ni Abraham, “Anak, alalahanin mo na tinanggap mo[a] ang mabubuting bagay na para sa iyo noong nabubuhay ka pa, at gayundin si Lazaro ay tumanggap ng mga paghihirap. Ngunit ngayon ay inaaliw siya rito, at ikaw naman ay nasa matinding pagdurusa.[b]”
  rationale: Pinalitan ang “masasamang bagay” ng “mga paghihirap” upang maipahayag ang mga masamang naranasan ni Lazaro, hindi moral na kasamaan. Pinalitan ang “nagdurusa ka sa matinding sakit” ng “nasa matinding pagdurusa” upang mapanatili ang mas malawak na saklaw ng ὀδυνᾶσαι. Ang estruktura at mga talababa ay nananatiling nakahanay sa pinagmulan at sa English POB audit trail.
