  yaml_path: translation/nt/luke/016/002.yaml
  text: And after calling him[a], he said to him, “What is this that I hear about you? Give an account of your stewardship[b], for you are no longer able to manage.”
translation:
  language: tl
  text: At ipinatawag niya ito at sinabi, “Ano itong naririnig ko tungkol sa iyo? Magbigay ka ng ulat tungkol sa iyong pamamahala[a], sapagkat hindi ka na maaaring mamahala[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magbigay ka ng ulat tungkol sa iyong pangangasiwa” o “ibigay mo ang ulat ng iyong pagiging katiwala.”
    reason: lexical_alternative
  - marker: b
    text: O “sapagkat hindi ka na maaaring maglingkod bilang katiwala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσας αὐτόν
  choice: ipinatawag niya ito
  rationale: Ang aorist participle ay nagsasaad ng kilos na nauna sa pagsasalita. Likas sa modernong Tagalog ang “ipinatawag,” at ang “ito” ay tumutukoy sa katiwala nang hindi inuulit ang pangngalan.
- source_word: Τί τοῦτο ἀκούω περὶ σοῦ;
  choice: Ano itong naririnig ko tungkol sa iyo?
  rationale: Pinananatili ang retorikal na tanong at ang di-tiyak na “ito” ng Griyego, nang hindi dinaragdagan ng salitang “ulat” sa bahaging ito.
- source_word: ἀπόδος τὸν λόγον
  choice: Ibigay mo ang ulat
  rationale: Sa kontekstong pangangasiwa, ang λόγος ay isang pagsusulit o ulat ng mga ginawa at tala, hindi simpleng “salita.” Ang “ibigay mo ang ulat” ay malinaw at likas sa Filipino.
- source_word: τῆς οἰκονομίας σου
  choice: tungkol sa iyong pamamahala
  rationale: Ang οἰκονομία ay tumutukoy sa pananagutan o gawain ng pangangasiwa sa ari-arian ng iba. Ang “pamamahala” ay mas madaling maunawaan ng karaniwang mambabasa kaysa “pagkakatiwala,” habang pinananatili ang administratibong diwa.
- source_word: οὐ γὰρ δύνῃ ἔτι οἰκονομεῖν
  choice: sapagkat hindi ka na maaaring mamahala
  rationale: Pinananatili ng “hindi ka na maaaring” ang anyo ng δύνῃ at ng ἔτι, samantalang ang “mamahala” ay likas na pandiwang katapat ng οἰκονομεῖν.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “pamamahala/mamahala” para sa likas na daloy, habang inilagay sa mga talababa ang mas pormal at tiyak-sa-tungkuling “pangangasiwa” at “katiwala.”
