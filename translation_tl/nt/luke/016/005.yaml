source:
  edition: SBLGNT
  text: καὶ προσκαλεσάμενος ἕνα ἕκαστον τῶν χρεοφειλετῶν τοῦ κυρίου ἑαυτοῦ ἔλεγεν τῷ πρώτῳ· Πόσον ὀφείλεις τῷ κυρίῳ μου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/005.yaml
  text: And after summoning each one of his master's debtors[a], he was saying to the first, 'How much do you owe my master?'
translation:
  language: tl
  text: At tinawag niya ang bawat isa sa mga may utang sa kaniyang amo.[a] Tinanong niya ang una, “Magkano ang utang mo sa aking amo?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griego na κύριος ay madalas isaling “Panginoon,” ngunit dito ay tumutukoy ito sa taong nakatataas sa katiwala, kaya “amo” ang mas angkop sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: tinawag niya
  rationale: Ang aorist middle participle ay nagpapahiwatig ng pagtawag niya sa mga may utang upang lumapit. Sa Filipino, natural na maipaloob ang kilos sa sunod-sunod na salaysay bilang “tinawag niya,” kasunod ng “At.”
- source_word: ἕνα ἕκαστον
  choice: ang bawat isa
  rationale: Pinananatili nito ang distributibong diin ng parirala nang hindi dinaragdagan ng ideyang maaaring ipahiwatig ng “isa-isa.”
- source_word: χρεοφειλετῶν
  choice: mga may utang
  rationale: Ito ang natural at malinaw na katawagan sa modernong Filipino para sa mga taong may pinansiyal na pagkakautang.
- source_word: τοῦ κυρίου ἑαυτοῦ
  choice: sa kaniyang amo
  rationale: Tumutukoy ang κύριος sa nakatataas na taong pinaglilingkuran ng katiwala, at ang ἑαυτοῦ ay bumabalik sa katiwala. Ang “kaniyang amo” ay angkop sa kontekstong panlipunan at pangkabuhayan.
- source_word: ἔλεγεν
  choice: Tinanong niya
  rationale: Bagaman literal na “sinasabi niya,” ang kasunod ay isang tuwirang tanong. Ang “Tinanong niya” ay natural sa Filipino at naihahatid ang paulit-ulit o eksenang gamit ng imperfect habang unang kausap ang tahasang tinutukoy rito.
- source_word: τῷ πρώτῳ
  choice: ang una
  rationale: Direkta at natural nitong tinutukoy ang unang taong kinausap.
- source_word: Πόσον
  choice: Magkano
  rationale: Sa konteksto ng utang, “Magkano” ang pinakanatural na tanong tungkol sa halaga.
- source_word: ὀφείλεις
  choice: ang utang mo
  rationale: Ang nominal na ekspresyong ito ay karaniwang paraan sa Filipino ng pagtatanong kung magkano ang pagkakautang ng isang tao.
- source_word: τῷ κυρίῳ μου
  choice: sa aking amo
  rationale: Pinananatili ng “aking” ang pananaw ng katiwala, at ipinahihiwatig ng “amo” na tao ang tinutukoy, hindi isang banal na titulo.
theological_decisions:
- issue: Pagbibigay-kahulugan sa κύριος sa konteksto ng sambahayan at utang sa talinghaga
  choice: amo
  alternative: Panginoon
  rationale: Ang tinutukoy rito ay ang taong nakatataas sa katiwala, hindi isang banal o kristolohikal na titulo. Iniiwasan ng “amo” ang hindi angkop na teolohikal na pahiwatig habang malinaw na ipinapakita ang kanilang ugnayan.
translation_notes:
  register: Makabagong Filipino na natural, malinaw, at marangal. Ginamit ang “kaniyang” upang tiyak na tumukoy sa amo ng katiwala, at pinili ang “mga may utang” kaysa sa mas teknikal o di-gaanong karaniwang “mga may pagkakautang.”
