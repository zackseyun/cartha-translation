id: LUK.16.1
reference: Luke 16:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ καὶ πρὸς τοὺς ⸀μαθητάς· Ἄνθρωπός τις ἦν πλούσιος ὃς εἶχεν οἰκονόμον, καὶ οὗτος διεβλήθη αὐτῷ ὡς διασκορπίζων τὰ ὑπάρχοντα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/001.yaml
  text: He was also saying to the disciples[a], “There was a certain rich man who had a manager[b], and this man was accused to him of squandering his possessions.”
translation:
  language: tl
  text: Sinabi rin niya sa mga alagad, “May isang mayamang lalaki na may katiwala[a]. Isinumbong[b] sa kanya ang katiwalang ito na nilulustay daw nito ang mga ari-arian ng mayaman.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tagapamahala ng sambahayan o ari-arian.” Ang katiwala (οἰκονόμος) ay isang taong pinagkatiwalaang mangasiwa sa sambahayan o lupain ng iba.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “inakusahan.” Ang pandiwa ay maaaring tumukoy sa pagsasampa ng paratang o paghahatid ng masamang ulat, hindi sa isang paratang na napatunayan na.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: Sinabi
  rationale: Likas itong panimulang pandiwa sa salaysay sa Tagalog. Bagaman imperfect ang Griyego at maaaring nagpapahiwatig ng nagpapatuloy o nagtatakdang pananalita, magiging mabigat at posibleng labis ang ‘patuloy niyang sinasabi’ sa kontekstong ito.
- source_word: δὲ καὶ
  choice: rin
  rationale: Ipinahihiwatig ng ‘rin’ ang dagdag na kausap o pahayag na dala ng καί, habang ang banayad na paglipat ng δέ ay likas nang naipapakita ng bagong pangungusap.
- source_word: πρὸς τοὺς μαθητάς
  choice: sa mga alagad
  rationale: Tuwirang isinasalin ang tiyak na pangkat nang hindi nagdaragdag ng possessive na wala sa Griyego.
- source_word: Ἄνθρωπός τις ἦν πλούσιος
  choice: May isang mayamang lalaki
  rationale: Karaniwang paraan sa modernong Tagalog ng pagpapakilala sa isang di-tiyak ngunit partikular na tauhan sa talinghaga.
- source_word: οἰκονόμον
  choice: katiwala
  rationale: Ang ‘katiwala’ ay natural at malawak na nauunawaang tawag sa taong pinagkatiwalaang mangasiwa sa sambahayan, lupain, o ari-arian.
- source_word: οὗτος
  choice: ang katiwalang ito
  rationale: Pinananatili ang diin ng demonstrative at nililinaw kung sino ang isinumbong.
- source_word: διεβλήθη αὐτῷ
  choice: Isinumbong sa kanya
  rationale: Ipinapakita ang masamang ulat na ipinaabot sa mayaman nang hindi ipinapalagay na napatunayan na ang paratang.
- source_word: ὡς διασκορπίζων
  choice: na nilulustay daw nito
  rationale: Ang ‘nilulustay’ ay angkop sa pag-aaksaya ng yaman; ipinahihiwatig ng ‘daw’ na ito ang nilalaman ng iniulat na paratang, hindi pa isang napatunayang katotohanan.
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: ang mga ari-arian ng mayaman
  rationale: Tumpak na tumutukoy sa mga pag-aari ng mayamang lalaki at iniiwasan ang kalituhan ng mga panghalip sa Tagalog.
theological_decisions:
- issue: Kung napatunayan na bang nilustay ng katiwala ang ari-arian
  choice: Inilahad ito bilang iniulat na paratang sa pamamagitan ng ‘isinumbong’ at ‘daw.’
  alternative: 'Ilahad bilang tiyak na katotohanan: ‘nilulustay nito.’'
  rationale: Ang διεβλήθη at ὡς na may participle ay nagpapahintulot na unawain ito bilang akusasyon o masamang ulat; hindi dapat tahimik na ipalagay ng salin na napatunayan na ang paratang.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal ang himig. Ginamit ang ‘katiwala’ sa halip na teknikal o makalumang katawagan, at inulit ang ‘mayaman’ sa hulihan upang maging malinaw ang pagmamay-ari ng mga ari-arian.
