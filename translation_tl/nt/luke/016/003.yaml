id: LUK.16.3
reference: Luke 16:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἶπεν δὲ ἐν ἑαυτῷ ὁ οἰκονόμος· Τί ποιήσω ὅτι ὁ κύριός μου ἀφαιρεῖται τὴν οἰκονομίαν ἀπ’ ἐμοῦ; σκάπτειν οὐκ ἰσχύω, ἐπαιτεῖν αἰσχύνομαι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/003.yaml
  text: Then the manager said to himself[a], ‘What will I do, since my master is taking the management away from me? I am not strong enough to dig, and I am ashamed to beg.’
translation:
  language: tl
  text: Sinabi ng tagapangasiwa sa sarili niya, “Ano ang gagawin ko, yamang aalisin na sa akin ng amo ko ang pangangasiwa?[a] Hindi sapat ang lakas ko para maghukay, at nahihiya akong mamalimos.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “katiwala” at “tungkulin bilang katiwala.” Magkaugnay ang mga salitang Griyego para sa tao at sa kaniyang tungkulin.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκονόμος / οἰκονομία
  choice: tagapangasiwa / pangangasiwa
  rationale: Pinananatili ng magkaugnay na salitang Filipino ang ugnayang leksikal sa Griyego sa pagitan ng taong namamahala at ng tungkuling ipinagkatiwala sa kaniya. Malinaw din ang mga ito sa modernong Filipino.
- source_word: ἐν ἑαυτῷ
  choice: sa sarili niya
  rationale: Likas na idyomang Filipino ito para sa panloob na pagsasalita o pagninilay.
- source_word: Τί ποιήσω
  choice: Ano ang gagawin ko
  rationale: Natural nitong ipinahahayag ang mapagpasiyang tanong tungkol sa susunod niyang gagawin.
- source_word: κύριός μου
  choice: amo ko
  rationale: Sa talinghagang ito, tumutukoy ang κύριος sa taong may awtoridad sa tagapangasiwa, hindi sa isang banal na titulo. Ang “amo” ay malinaw at natural sa kontekstong panlipunan.
- source_word: ἀφαιρεῖται ... ἀπ’ ἐμοῦ
  choice: aalisin na sa akin
  rationale: Ipinahahayag nito ang tiyak at nalalapit na pagbawi sa kaniyang tungkulin, habang pinananatili ang diwang “mula sa akin.”
- source_word: σκάπτειν οὐκ ἰσχύω
  choice: Hindi sapat ang lakas ko para maghukay
  rationale: Sa kaugnayan nito sa paghuhukay, nangingibabaw ang diwa ng kakulangang pisikal na lakas, bagaman saklaw rin ng ἰσχύω ang kakayahan.
- source_word: ἐπαιτεῖν αἰσχύνομαι
  choice: nahihiya akong mamalimos
  rationale: Direkta at likas itong salin ng pagkahiyang humingi ng limos bilang ikabubuhay.
theological_decisions:
- issue: Pagbibigay-kahulugan sa κύριος sa di-banal na konteksto ng talinghaga
  choice: amo
  alternative: panginoon; may-ari
  rationale: Ang tinutukoy ay ang nakatataas na tao sa tagapangasiwa. Iniiwasan ng “amo” ang di-sinasadyang banal na pahiwatig ng “Panginoon,” ngunit pinananatili ang ugnayan ng awtoridad. Hindi rin nito nililimitahan ang papel sa pagmamay-ari lamang gaya ng maaaring ipahiwatig ng “may-ari.”
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang “niya” at “amo” bilang pangkaraniwang kasalukuyang pananalita; iniwasan ang mas teolohikal na tunog ng “panginoon” sa kontekstong ito. Pinanatili ang magkaugnay na anyo ng “tagapangasiwa” at “pangangasiwa.”
