  text: And a poor man named Lazarus had been laid at his gate[a], covered with sores[b],
translation:
  language: tl
  text: May isang mahirap na nagngangalang Lazaro na inilagay sa may pintuan ng mayaman[a], na punô ng mga sugat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “itinapon sa may pintuan ng mayaman.” Ang pandiwang Griyego ay maaari ring mangahulugang itinapon o inihagis, at maaaring magbigay-diin sa kawalang-kakayahan at pagpapabaya kay Lazaro.
    reason: lexical_alternative
  - marker: b
    text: O “balot ng mga sugat.” Ipinakikita ng participle sa Griyego na si Lazaro ay may mga sugat na parang ulser.
    reason: lexical_alternative
lexical_decisions:
- source_word: πτωχὸς
  choice: mahirap
  rationale: Tumutukoy ito sa isang dukha o salat. Likas sa modernong Tagalog ang “mahirap” at hindi nito idinaragdag ang mas tiyak na papel na “pulubi,” na hindi tahasang sinasabi sa talata.
- source_word: τις
  choice: may isang
  rationale: Ipinakikilala ng indefinite pronoun ang isang bagong tauhan. Natural sa salaysay na Tagalog ang “may isang” at hindi kasing-tigas ng “isang tiyak na tao.”
- source_word: ὀνόματι Λάζαρος
  choice: nagngangalang Lazaro
  rationale: Natural at marangal na katumbas ito ng idyomang nangangahulugang “may pangalang Lazaro.”
- source_word: ἐβέβλητο
  choice: inilagay
  rationale: Pinananatili ng pandiwang balintiyak ang diwang may ibang nagdala at naglagay kay Lazaro roon. Hindi nito sapilitang pinipili ang mas marahas na posibilidad na “itinapon,” na inilalahad sa talababa.
- source_word: πρὸς τὸν πυλῶνα αὐτοῦ
  choice: sa may pintuan ng mayaman
  rationale: Ipinahahayag ng “sa may” ang lokasyon kaugnay ng malaking pintuan o pasukan. Nilinaw ang tinutukoy ng αὐτοῦ bilang mayaman mula sa naunang konteksto upang maiwasan ang malabong panghalip sa Tagalog.
- source_word: εἱλκωμένος
  choice: punô ng mga sugat
  rationale: Malinaw at natural nitong inilalarawan na si Lazaro ay lubhang afflicted ng ulcerous sores, nang hindi gumagamit ng teknikal o di-karaniwang salitang medikal.
