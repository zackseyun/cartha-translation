translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “may isang” bilang karaniwang pambungad sa tauhan at “sa may pintuan” para sa idiomatikong lokasyon. Ang mga tunay na alternatibong diwa ng ἐβέβλητο at εἱλκωμένος ay pinanatili sa mga talababa.
