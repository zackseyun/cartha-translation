  text: Ὁ πιστὸς ἐν ἐλαχίστῳ καὶ ἐν πολλῷ πιστός ἐστιν, καὶ ὁ ἐν ἐλαχίστῳ ἄδικος καὶ ἐν πολλῷ ἄδικός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/010.yaml
  text: The one who is faithful in very little is also faithful in much[b][a], and the one who is unrighteous in very little is also unrighteous in much.
translation:
  language: tl
  text: Ang tapat sa napakaliit[a] ay tapat din sa malaki, at ang di-matuwid[b] sa napakaliit ay di-matuwid din sa malaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pinakamaliit.” Tumutukoy ang pananalitang Griyego sa isang bagay na napakaliit o di-gaanong mahalaga.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isaling “di-tapat,” “di-makatarungan,” o, sa kontekstong ito, “mandaraya.” Mas malawak ang salitang Griyego kaysa pandarayang pinansyal lamang.
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστός
  choice: tapat
  rationale: Sa konteksto ng ipinagkatiwalang pananagutan, tumutukoy ito sa pagiging maaasahan, hindi lamang sa paniniwala. Natural sa Filipino ang “tapat” at napapanatili nito ang tuwirang pagtutulad ng dalawang sugnay.
- source_word: ἐν ἐλαχίστῳ
  choice: sa napakaliit
  rationale: Ipinahahayag ng ἐν at datibo ang saklaw o kalagayan. Pinananatili ng “sa napakaliit” ang dami o antas at ang tahasang pagsalungat sa πολλῷ.
- source_word: πολλῷ
  choice: sa marami
  rationale: Ang neuter singular ay tumutukoy sa malaking dami o saklaw, kabaligtaran ng ἐλαχίστῳ. Ang “sa marami” ay maikli, natural, at maaaring tumukoy sa maraming bagay o mas malaking pananagutan.
- source_word: ἄδικος
  choice: di-matuwid
  rationale: 'Masaklaw ang salitang Griyego: maaari itong tumukoy sa pagiging di-makatarungan, mali, o di-tapat. Hindi nililimitahan ng “di-matuwid” ang kahulugan sa pandarayang pinansyal lamang.'
- source_word: ὁ ... πιστός / ὁ ... ἄδικος
  choice: ang tapat ... ang di-matuwid
  rationale: Ang artikulo at pang-uri ay ginagamit bilang pangngalan at kumakatawan sa sinumang gayon ang katangian. Ang anyong Filipino ay likas, maikli, at hindi nagdaragdag ng kasarian.
- source_word: καὶ
  choice: din / at
  rationale: Ang “din” ay naghahayag ng pandagdag na diwa sa magkatapat na pahayag, samantalang ang “at” ay nag-uugnay sa dalawang pangunahing bahagi ng kasabihan.
theological_decisions:
- issue: Saklaw ng moral na paglalarawang ἄδικος sa konteksto ng pangangasiwa
  choice: di-matuwid
  alternative: di-tapat; di-makatarungan; mandaraya
  rationale: Naglalahad ang talata ng malawak na prinsipyong moral, bagaman may kinalaman sa kayamanan ang agarang konteksto. Pinananatili ng “di-matuwid” ang lawak ng termino at ang tensiyon sa pagitan ng pangkalahatang moralidad at ng kontekstong pinansyal.
translation_notes:
  register: 'Modernong Filipino na payak ngunit marangal. Pinanatili ang balanseng paralelismo ng Griyego: “sa napakaliit ... sa marami” at “tapat ... di-matuwid.”'
