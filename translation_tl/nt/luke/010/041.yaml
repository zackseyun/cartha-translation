id: LUK.10.41
reference: Luke 10:41
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ εἶπεν αὐτῇ ὁ ⸀κύριος· Μάρθα Μάρθα, μεριμνᾷς καὶ ⸀θορυβάζῃ περὶ πολλά,
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/041.yaml
  text: But the Lord answered her[a], “Martha, Martha, you are anxious and troubled about many things,”
translation:
  language: tl
  text: Ngunit sumagot sa kanya ang Panginoon, “Marta, Marta, nag-aalala ka at nababagabag[a] tungkol sa maraming bagay,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nag-aalala at nababalisa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ εἶπεν αὐτῇ
  choice: Ngunit sumagot sa kanya
  rationale: Pinagsama ang karaniwang Griyegong idyomang participle + finite verb bilang likas na pandiwang Filipino na “sumagot.” Ipinahahayag ng “Ngunit” ang banayad na pagsalungat sa naunang sinabi ni Marta.
- source_word: ὁ κύριος
  choice: ang Panginoon
  rationale: Pinananatili ang karaniwang titulong ginagamit ni Lucas para kay Jesus at ang posibleng kristolohikal na bigat nito.
- source_word: Μάρθα Μάρθα
  choice: Marta, Marta
  rationale: Pinananatili ang dobleng pagtawag upang maihatid ang lambing at diin ng tuwirang pakikipag-usap.
- source_word: μεριμνᾷς
  choice: nag-aalala ka
  rationale: Likas at malinaw na Filipino para sa panloob na pag-aalala o pagkabalisa.
- source_word: θορυβάζῃ
  choice: nababagabag
  rationale: Ipinahahayag ang pagkagulo o matinding pagkabalisa sa kalooban habang pinananatiling hiwalay ang diwa nito sa μεριμνᾷς.
- source_word: περὶ πολλά
  choice: tungkol sa maraming bagay
  rationale: Tuwiran at natural na salin na hindi nililimitahan kung anu-ano ang tinutukoy na mga alalahanin.
theological_decisions:
- issue: Pagsasalin sa κύριος bilang titulo ni Jesus
  choice: Panginoon
  alternative: amo
  rationale: Ang “Panginoon” ay nagpapanatili kapuwa ng magalang na titulo at ng kristolohikal na himig sa salaysay ni Lucas; mapapahina ng “amo” ang saklaw na iyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Marta” na karaniwang anyong Filipino ng pangalan, at pinanatili ang pag-uulit at emosyonal na kaibhan ng dalawang pandiwa.
