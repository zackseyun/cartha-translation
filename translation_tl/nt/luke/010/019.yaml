  text: ἰδοὺ ⸀δέδωκα ὑμῖν τὴν ἐξουσίαν τοῦ πατεῖν ἐπάνω ὄφεων καὶ σκορπίων, καὶ ἐπὶ πᾶσαν τὴν δύναμιν τοῦ ἐχθροῦ, καὶ οὐδὲν ὑμᾶς οὐ μὴ ⸀ἀδικήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/019.yaml
  text: Behold[a], I have given you the authority to tread on snakes and scorpions, and over all the power of the enemy[b], and nothing will ever harm you.
translation:
  language: tl
  text: Tingnan ninyo, binigyan ko kayo ng awtoridad na yurakan ang mga ahas at alakdan,[a] at ng awtoridad sa lahat ng kapangyarihan ng kaaway; at hinding-hindi kayo mapipinsala ng anuman.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga serpiyente at mga alakdan.” Maaaring literal ang mga ahas at alakdan; sa konteksto, maaari rin silang pumukaw ng larawan ng masasamang espirituwal na puwersa.
    reason: lexical_alternative_and_interpretive_ambiguity
  - marker: b
    text: O “hinding-hindi kayo sasaktan ng anuman.” Mariing dobleng pagtanggi ang ginamit sa Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδού
  choice: Tingnan ninyo
  rationale: Pinananatili ang puwersang pantawag-pansin ng salitang Griyego sa natural at kasalukuyang Tagalog.
- source_word: δέδωκα
  choice: binigyan ko kayo
  rationale: Ipinahihiwatig ng perpektong panahunan ang isang pagbibigay na naganap na at nananatiling may bisa; natural itong naipapahayag sa Tagalog sa aspektong naganap.
- source_word: ἐξουσίαν
  choice: awtoridad
  rationale: Pinananatili ang kahulugan ng ipinagkaloob na karapatan o kapamahalaan at ang pagkakaiba nito sa δύναμις, na isinaling “kapangyarihan.”
- source_word: τοῦ πατεῖν
  choice: na yurakan
  rationale: Malinaw at matibay na inilalarawan ang pag-apak sa ibabaw nang hindi inaalis ang matalinghagang posibilidad ng larawan.
- source_word: ἐπάνω ὄφεων καὶ σκορπίων
  choice: ang mga ahas at mga alakdan
  rationale: Tuwirang pinananatili ang konkretong larawan sa Griyego; karaniwang modernong salita ang “ahas” at tumpak ang “alakdan.”
- source_word: ἐπὶ πᾶσαν τὴν δύναμιν
  choice: sa lahat ng kapangyarihan
  rationale: Sa pag-uulit ng “awtoridad,” malinaw na ipinakikitang saklaw nito ang buong kapangyarihan ng kaaway habang nananatiling natural ang Tagalog.
- source_word: δύναμιν
  choice: kapangyarihan
  rationale: 'Pinananatili ang leksikal na kaibahan sa ἐξουσία: tumatanggap ang mga alagad ng “awtoridad” laban sa “kapangyarihan” ng kaaway.'
- source_word: τοῦ ἐχθροῦ
  choice: ng kaaway
  rationale: Hindi tinutukoy nang higit sa sinasabi ng teksto kung sino ang kaaway, bagaman maaaring ipahiwatig ng konteksto si Satanas.
- source_word: οὐδὲν ... οὐ μὴ ἀδικήσῃ
  choice: hinding-hindi kayo mapipinsala ng anuman
  rationale: Ang “hinding-hindi” ay natural na naghahatid ng mariing dobleng pagtanggi sa Griyego, at ang “mapipinsala” ay akma sa konteksto ng pananakit o kapahamakan.
theological_decisions:
- issue: Ang tinutukoy ng “kaaway”
  choice: Pinanatiling “ang kaaway” nang hindi tahasang kinilalang si Satanas.
  alternative: Si Satanas; ang diyablo
  rationale: Bagaman itinuturo ng konteksto ng pagpapasakop ng mga demonyo at ng Lucas 10:18 ang satanikong pagsalungat, “ang kaaway” lamang ang tahasang sinasabi ng Griyego.
- issue: Literal o simbolikong diwa ng “mga ahas at mga alakdan”
  choice: Pinanatili ang literal na larawan sa pangunahing teksto.
  alternative: Sagisag ng masasamang espirituwal na puwersa; magkahalong literal at simbolikong larawan
  rationale: Konkretong mga nilalang ang tuwirang kahulugan ng mga salita, ngunit maaaring magkaroon ang larawan ng espirituwal na pahiwatig dahil sa konteksto. Hindi nilutas ng salin ang sadyang bukas na interpretasyong ito.
- issue: Saklaw ng pangakong hindi mapipinsala
  choice: Isinalin ang mariing katiyakan nang hindi dinaragdagan ng paliwanag tungkol sa uri o panahon ng pinsala.
  alternative: Limitahan ito sa espirituwal na pinsala; unawain bilang ganap na kaligtasan sa lahat ng pisikal na pinsala
  rationale: Mariin ang Griyego ngunit hindi nito mismo ipinapaliwanag sa talata ang lahat ng aplikasyon ng pangako. Pinananatili ng salin ang lakas at tensiyon ng pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “awtoridad” upang maiba sa “kapangyarihan,” at “Tingnan ninyo” bilang natural na pantawag-pansin. Iniwasan ang labis na makalumang “narito” at ang sobrang impormal na pananalita.
