reference: Luke 10:30
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὑπολαβὼν ⸀δὲ ὁ Ἰησοῦς εἶπεν· Ἄνθρωπός τις κατέβαινεν ἀπὸ Ἰερουσαλὴμ εἰς Ἰεριχὼ καὶ λῃσταῖς περιέπεσεν, οἳ καὶ ἐκδύσαντες αὐτὸν καὶ πληγὰς ἐπιθέντες ἀπῆλθον ἀφέντες ⸀ἡμιθανῆ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/030.yaml
  text: Jesus replied, “A certain man was going down from Jerusalem to Jericho, and he fell among robbers, who also stripped him, beat him, and went away, leaving him half dead.”
translation:
  language: tl
  text: Sumagot si Jesus, “May isang lalaking bumababa mula sa Jerusalem patungong Jerico, at nahulog siya sa kamay ng mga tulisan. Hinubaran siya ng mga ito, binugbog, at umalis, na iniwan siyang halos patay.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπολαβὼν
  choice: Sumagot
  rationale: Sa konteksto ng pakikipag-usap, natural na ipinahihiwatig ng participle ang pagsagot ni Jesus sa naunang tanong.
- source_word: κατέβαινεν
  choice: bumababa
  rationale: Pinananatili ang heograpikal na diwa ng paglalakbay pababa mula sa mataas na Jerusalem patungong Jerico.
- source_word: λῃσταῖς περιέπεσεν
  choice: Nasalubong niya ang mga tulisan
  rationale: Natural na Filipino para sa pagkahulog sa kamay ng mararahas na magnanakaw; ang “tulisan” ay angkop sa λῃστής, na maaaring tumukoy sa magnanakaw na gumagamit ng dahas.
- source_word: ἐκδύσαντες αὐτὸν
  choice: Hinubaran siya
  rationale: Tuwirang inilalarawan ang pag-aalis ng kaniyang damit at posibleng pagnanakaw nito nang hindi nagdaragdag ng hindi tahasang sinabi.
- source_word: πληγὰς ἐπιθέντες
  choice: binugbog
  rationale: Idiomatic at malinaw na paglalarawan sa pananakit at pagpapataw ng mga sugat.
- source_word: ἡμιθανῆ
  choice: halos patay
  rationale: Natural na katumbas ng “half-dead,” na nagsasaad na buhay pa ngunit malubha ang kalagayan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pagsasalaysay. Ginamit ang “Jerico” bilang karaniwang modernong baybay sa Filipino. Hindi mekanikal na isinalin ang καί bilang “rin,” sapagkat likas na naihahanay sa Filipino ang magkakasunod na ginawa ng mga tulisan nang walang pagkawala ng nilalaman.
