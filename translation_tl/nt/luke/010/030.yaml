    issue: Ang “Nasalubong niya ang mga tulisan” ay hindi sapat na katumbas ng λῃσταῖς περιέπεσεν.
    rationale: Ang Griyego ay nagsasaad na siya ay napasakamay/nabiktima ng mga tulisan, hindi lamang niya sila nakasalubong.
  - severity: medium
    issue: Hindi tahasang naisalin ang ἀπῆλθον (“umalis sila”).
    rationale: Ang “iniwan” ay naipapahayag ang resulta, ngunit kailangan ding ilahad na umalis ang mga tulisan gaya ng nasa pinagmulan.
