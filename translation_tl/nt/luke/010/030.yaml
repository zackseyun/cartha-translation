  to: Sumagot si Jesus, “May isang lalaking bumababa mula sa Jerusalem patungong Jerico, at nahulog siya sa kamay ng mga tulisan. Hinubaran siya ng mga ito, binugbog, at umalis, na iniwan siyang halos patay.”
