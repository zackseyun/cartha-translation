  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ τὸν κονιορτὸν τὸν κολληθέντα ἡμῖν ἐκ τῆς πόλεως ὑμῶν ⸂εἰς τοὺς πόδας⸃ ἀπομασσόμεθα ὑμῖν· πλὴν τοῦτο γινώσκετε ὅτι ⸀ἤγγικεν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/011.yaml
  text: 'Even the dust from your city that clung to our feet[a], we wipe off against you[d][c][b]. Nevertheless know this: the kingdom of God has come near.'
translation:
  language: tl
  text: '‘Pati ang alikabok mula sa inyong lungsod na kumapit sa aming mga paa[a] ay pinupunasan namin laban sa inyo[b]. Gayunman, alamin ninyo ito: lumapit na ang kaharian ng Diyos[c].’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Griyego, maaaring mas literal na unawain: “ang alikabok na kumapit sa amin mula sa inyong lungsod, sa aming mga paa.”'
    reason: lexical_alternative
  - marker: b
    text: Mas tiyak na “pinupunasan” ang pandiwang Griyego rito, hindi “ipinapagpag.” Ang “laban sa inyo” ay naghahatid ng puwersang salungat o hudisyal ng parirala sa konteksto.
    reason: lexical_alternative
  - marker: c
    text: O “malapit na ang kaharian ng Diyos.” Ipinahihiwatig ng anyo ng pandiwang Griyego na lumapit na ito at nananatiling may kasalukuyang kabuluhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: κονιορτός
  choice: alikabok
  rationale: Tiyak na alikabok ang tinutukoy, hindi pangkalahatang lupa o dumi; pinananatili rin nito ang sagisag na bisa ng kilos.
- source_word: κολληθέντα
  choice: kumapit
  rationale: Likas sa modernong Tagalog at malinaw na nagsasaad na dumikit ang alikabok sa mga paa.
- source_word: ἐκ τῆς πόλεως ὑμῶν
  choice: mula sa inyong lungsod
  rationale: Tuwirang ipinahahayag ang pinagmulan ng alikabok.
- source_word: εἰς τοὺς πόδας
  choice: sa aming mga paa
  rationale: Sa idyomatikong parirala, inilalarawan nito kung saan kumapit ang alikabok; ang 'aming' ay likas na ipinahihiwatig ng konteksto.
- source_word: ἀπομασσόμεθα
  choice: pinupunasan namin
  rationale: Mas tiyak itong tumutugma sa pagpahid o pagpupunas kaysa sa tradisyonal na 'ipinapagpag.'
- source_word: ὑμῖν
  choice: bilang patotoo laban sa inyo
  rationale: Nililinaw nito sa natural na Tagalog ang salungat o hudisyal na puwersa ng datibo sa konteksto, nang hindi ginagawang simpleng 'sa inyo' ang kilos.
- source_word: πλήν
  choice: Gayunman
  rationale: 'Nagpapahayag ng matibay na pagbaling: sa kabila ng kilos ng paghatol, nananatili ang katotohanang dapat nilang malaman.'
- source_word: γινώσκετε
  choice: alamin ninyo
  rationale: Tuwiran at natural na pautos na humihiling ng pagkilala sa katotohanang sumusunod.
- source_word: ἤγγικεν
  choice: lumapit na
  rationale: Naipahahayag ang pagdating sa kalapitan na may nananatiling kabuluhan, habang hindi ipinapakahulugang ganap nang natupad ang kaharian.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ang kaharian ng Diyos
  rationale: Karaniwan, malinaw, at sapat na nag-iiwan ng saklaw para sa paghahari at kaharian nang hindi pinipili lamang ang isa.
theological_decisions:
- issue: Puwersa ng pagpupunas ng alikabok
  choice: Isang sagisag na kilos ng patotoo at paghatol laban sa lungsod na tumatanggi
  alternative: Isang karaniwang kilos lamang para sa kalinisan o paglalakbay
  rationale: Ang ὑμῖν at ang konteksto ng pagsusugo ay nagpapahiwatig ng patotoong laban sa mga tumatanggi; inilalahad ito nang maikli sa salin.
- issue: Kahulugan ng paglapit ng kaharian
  choice: Lumapit na ang kaharian ng Diyos at nananatiling malapit sa gawain at mensahe ng mga isinugo ni Jesus
  alternative: Malapit lamang itong dumating sa hinaharap, o lubos na itong natupad
  rationale: Ang perfect na ἤγγικεν ay nagpapakita ng paglapit na naganap at may kasalukuyang kabuluhan, ngunit hindi nilulutas ang tensiyon tungkol sa ganap na katuparan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘lungsod’ at ‘kaharian ng Diyos’ bilang pamilyar na biblikal na pananalita. Ang ‘bilang patotoo’ ay isang maikling kontekstuwal na paglilinaw sa puwersa ng ὑμῖν; pinanatili sa talababa ang mas pormal na ‘laban sa inyo.’
