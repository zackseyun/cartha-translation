  yaml_path: translation/nt/luke/010/014.yaml
  text: But it will be more bearable for Tyre and Sidon in the judgment than for you[a].
translation:
  language: tl
  text: Ngunit sa paghuhukom, mas matitiis ang sasapitin ng Tiro at Sidon kaysa sa inyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mas magaan ang sasapitin ng Tiro at Sidon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Ngunit
  rationale: Nagpapahayag ng mariing pagsalungat sa naunang pahayag at natural sa makabagong Filipino.
- source_word: Τύρῳ καὶ Σιδῶνι
  choice: sa Tiro at Sidon
  rationale: Ang mga datibo ay tumutukoy sa mga paghahambingan; ang “sa” ay likas sa Filipino at hindi kailangang ulitin bago ang bawat pangalan.
- source_word: ἀνεκτότερον
  choice: higit na magaan ang parusa
  rationale: Ipinahihiwatig ng pahambing na pang-uri na mas madaling tiisin ang kahihinatnan sa paghuhukom. Ang pariralang ito ay malinaw at natural, bagaman ipinapahayag nito ang implicit na parusa.
- source_word: ἔσται
  choice: magiging / [sa ayos ng pangungusap] higit na magaan
  rationale: Ang hinaharap na diwa ng copula ay naipahahayag sa konteksto ng darating na paghuhukom; inayos ang pangungusap upang maging natural sa Filipino.
- source_word: ἐν τῇ κρίσει
  choice: sa paghuhukom
  rationale: Pinananatili ang tiyak na konteksto ng banal na paghuhukom nang hindi tahasang dinaragdagan ng “pangwakas.”
- source_word: ἢ ὑμῖν
  choice: kaysa sa inyo
  rationale: Likas na Filipino para sa paghahambing at tumpak na pinananatili ang pangmaramihang “kayo.”
theological_decisions:
- issue: Saklaw ng κρίσις
  choice: paghuhukom
  alternative: pangwakas na paghuhukom
  rationale: Malakas na ipinahihiwatig ng konteksto ang eskatolohikal na paghuhukom, ngunit hindi idinagdag ang “pangwakas” dahil wala ito sa mismong Griyego.
- issue: Ano ang higit na madaling tiisin
  choice: higit na magaan ang parusa
  alternative: higit na matitiis
  rationale: Ginagawang malinaw sa karaniwang Filipino ang ipinahihiwatig na kahihinatnan ng paghuhukom, ngunit inilalagay sa talababa ang mas pormal at mas malapit na alternatibo upang mapanatili ang leksikal na saklaw.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang baybay na “Tiro” at “Sidon.” Ang pangunahing teksto ay idiomatiko, habang pinananatili sa talababa ang mas pormal na katumbas ng ἀνεκτότερον.
