    rationale: Ang ἀνεκτότερον ay nagsasabing “mas matitiis” o “mas bearable” ngunit hindi pinapangalanan ang bagay na mas matitiis. Bagaman naaayon sa konteksto ang parusa, masyado itong tiyak para sa optimal-equivalence na salin.
  revised_text: Ngunit sa paghuhukom, mas matitiis ang sasapitin ng Tiro at Sidon kaysa sa inyo.[a]
