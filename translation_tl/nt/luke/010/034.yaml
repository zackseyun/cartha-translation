  to: Lumapit siya at binendahan ang mga sugat nito, na binuhusan niya ng langis at alak. Pagkatapos, isinakay niya ang nasugatan sa sarili niyang hayop[a], dinala niya ito sa isang panuluyan, at inalagaan niya ito.
