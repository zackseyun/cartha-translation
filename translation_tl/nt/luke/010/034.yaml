base_translation:
  language: en
  yaml_path: translation/nt/luke/010/034.yaml
  text: And coming near[a], he bound up his wounds, pouring on oil and wine. Then he put him on his own animal, brought him to an inn[b], and took care of him.
translation:
  language: tl
  text: Lumapit siya at binendahan ang mga sugat nito, na binuhusan niya ng langis at alak. Pagkatapos, isinakay niya ang nasugatan sa sarili niyang hayop[a], dinala niya ito sa isang panuluyan, at inalagaan niya ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay tumutukoy sa hayop na ginagamit sa pagsakay o pagdadala ng pasan.
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: Lumapit siya
  rationale: Likas na ipinapahayag ang paglapit ng Samaritano sa nasugatan at ang kilos na nauuna sa pagbebenda.
- source_word: κατέδησεν
  choice: binendahan
  rationale: Tiyak at natural na katumbas sa makabagong Filipino para sa pagbabalot o pagtatali ng mga sugat.
- source_word: τραύματα
  choice: mga sugat
  rationale: Karaniwang katumbas na angkop sa mga pinsalang dulot ng pananakit.
- source_word: ἐπιχέων
  choice: na binuhusan niya
  rationale: Pinananatili ang konkretong kilos ng pagbubuhos bilang paraan ng pag-aalaga sa mga sugat.
- source_word: ἔλαιον
  choice: langis
  rationale: Malapit sa leksikal na saklaw ng Griyego; hindi na tahasang tinukoy na langis ng olibo dahil hindi iyon sinasabi nang tuwiran sa teksto.
- source_word: οἶνον
  choice: alak
  rationale: Direktang katumbas ng οἶνος sa kontekstong ito nang hindi nagdaragdag ng paliwanag tungkol sa gamit nito.
- source_word: ἐπιβιβάσας
  choice: isinakay niya
  rationale: Natural na Filipino para sa paglalagay sa isang hayop na masasakyan.
- source_word: τὸ ἴδιον κτῆνος
  choice: sarili niyang hayop
  rationale: Pinananatili ang diin ng ἴδιον sa pagmamay-ari at ang malawak na kahulugan ng κτῆνος; nililinaw ng talababa ang uri ng hayop.
- source_word: πανδοχεῖον
  choice: panuluyan
  rationale: Natural at dignified na katawagan sa lugar na tumatanggap at nagpapatuloy ng mga manlalakbay.
- source_word: ἐπεμελήθη
  choice: inalagaan
  rationale: Maikli at natural na nagpapahayag ng personal na pagkalinga at pag-aasikaso.
