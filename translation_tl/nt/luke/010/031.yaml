  source_fidelity: Ang diwa ng talata ay naipapahayag, ngunit ang “lumihis siya at nagpatuloy” ay naghahati at bahagyang pinapalawak ang iisang pandiwang ἀντιπαρῆλθεν. Mas tapat at tuwiran ang “dumaan siya sa kabilang panig.”
  naturalness: Mas natural sa modernong Filipino ang “may isang pari na bumababa” kaysa “may isang paring bumababa” sa ganitong pangungusap. Ang isang tuloy-tuloy na pangungusap ay mas maayos ding sumasalamin sa daloy ng salaysay.
  terminology: Wasto ang “pari” para sa ἱερεύς. Wasto rin ang “nagkataon namang” para sa κατὰ συγκυρίαν δέ at ang “kabilang panig” para sa puwersa ng ἀντιπαρῆλθεν.
