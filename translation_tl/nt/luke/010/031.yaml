revisions:
- from: Nagkataon namang may isang paring bumababa sa daang iyon. Nang makita niya ang lalaki, lumihis siya at nagpatuloy sa kabilang panig.[a]
  to: Nagkataon namang may isang pari na bumababa sa daang iyon, at nang makita niya ang lalaki, dumaan siya sa kabilang panig.[a]
  rationale: Pinanatili ng rebisyon ang nagkataong pagdating ng pari, ang di-ganap na kilos ng pagbaba, at ang temporal na “nang makita niya.” Ginawang mas tuwiran ang huling pandiwa ayon sa Griyego, at inilipat sa talababa ang paliwanag tungkol sa pahiwatig ng pag-iwas. Inayos din ang ayos ng sugnay at ang pagkakakabit ng talababa.
