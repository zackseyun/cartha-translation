  yaml_path: translation/nt/luke/010/031.yaml
  text: By chance a certain priest was going down on that road[a], and when he saw him, he passed by on the opposite side.
translation:
  language: tl
  text: Nagkataon namang may isang pari na bumababa sa daang iyon, at nang makita niya ang lalaki, dumaan siya sa kabilang panig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “dumaan siya,” ngunit ipinahihiwatig ng pandiwang Griyego ang pagdaan sa kabilang panig at, sa kontekstong ito, ang pag-iwas sa lalaki.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ συγκυρίαν
  choice: Nagkataon
  rationale: Likas na salin ng idyomang tumutukoy sa isang pangyayaring nagkataon, nang hindi nagpapasiya sa mas malawak na usaping pilosopikal tungkol sa pagkakataon.
- source_word: δὲ
  choice: namang
  rationale: Mahinang pang-ugnay ito na nagpapatuloy sa salaysay; ang enclitic na “namang” ay natural sa Filipino at hindi lumilikha ng matinding pagsalungat.
- source_word: ἱερεύς τις
  choice: may isang pari
  rationale: Ipinahihiwatig ng τις ang isang tiyak ngunit hindi pinangalanang tao; natural itong naihahayag sa Filipino sa “may isang pari.”
- source_word: κατέβαινεν
  choice: bumababa
  rationale: Pinananatili ng aspektong nagaganap ang kilos na nasa proseso bilang tagpuan ng sumunod na pangyayari.
- source_word: ἐν τῇ ὁδῷ ἐκείνῃ
  choice: sa daang iyon
  rationale: Karaniwang Filipino para sa paglalakbay sa tinutukoy na daan.
- source_word: ἰδὼν αὐτὸν
  choice: Nang makita niya ang lalaki
  rationale: Ang aorist participle ay natural na ipinapahayag bilang temporal na sugnay. Nililinaw ng “ang lalaki” ang reperente sa salaysay nang hindi nagdaragdag ng katangiang wala sa talata.
- source_word: ἀντιπαρῆλθεν
  choice: lumihis siya at nagpatuloy sa kabilang panig
  rationale: Ipinakikita ng tambalang pandiwa ang pagdaan sa tapat o kabilang panig, kaya higit ito sa payak na “dumaan”; malinaw rin ang sinadyang pag-iwas.
