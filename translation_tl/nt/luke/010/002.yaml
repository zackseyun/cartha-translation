  - severity: low
    issue: Mas tuwiran ang “Manalangin kayo” para sa δεήθητε.
    rationale: Ang “idalangin ninyo” ay nauunawaan, ngunit ang “Manalangin kayo sa Panginoon ... na” ay mas malinaw na naghahatid ng pautos na manalangin at ng nilalaman ng panalangin.
