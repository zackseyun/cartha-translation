  text: ἔλεγεν ⸀δὲ πρὸς αὐτούς· Ὁ μὲν θερισμὸς πολύς, οἱ δὲ ἐργάται ὀλίγοι· δεήθητε οὖν τοῦ κυρίου τοῦ θερισμοῦ ὅπως ⸂ἐργάτας ἐκβάλῃ⸃ εἰς τὸν θερισμὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/002.yaml
  text: And he said to them[a], “The harvest is plentiful, but the workers are few. Therefore pray to the Lord of the harvest that he would send out workers into his harvest.”
translation:
  language: tl
  text: Sinabi niya sa kanila, “Napakarami ng aanihin, ngunit kakaunti ang mga manggagawa. Kaya manalangin kayo sa Panginoon ng ani na magpadala[a] siya ng mga manggagawa sa kanyang ani.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “puwersahang magpadala”; maaaring masidhi ang diwa ng pandiwang Griyego kaysa sa karaniwang “magpadala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: Sinabi niya
  rationale: Bagaman imperpekto ang anyo at maaaring isaling “sinasabi niya,” mas natural sa salaysay na Tagalog ang payak na “sinabi niya” nang hindi nawawala ang mahalagang diwa.
- source_word: δὲ
  choice: hindi tahasang isinalin
  rationale: Mahinang pang-ugnay ito sa pagpapatuloy ng salaysay. Hindi kailangan ang hiwalay na “at” o “ngayon” sa natural na Tagalog sa talatang ito.
- source_word: θερισμός
  choice: ang aanihin / ani
  rationale: Ang “aanihin” ay malinaw at natural sa pahayag na marami ang handang anihin; ang “ani” naman ay maikli at marangal sa titulong “Panginoon ng ani.” Pareho nilang pinananatili ang talinghaga ng pag-aani.
- source_word: πολύς
  choice: marami
  rationale: Tuwiran at natural itong nagpapahayag ng malaking dami ng aanihin.
- source_word: ἐργάται
  choice: mga manggagawa
  rationale: Karaniwang makabagong salita ito para sa mga gumagawa ng gawain at akma sa talinghaga ng pag-aani.
- source_word: ὀλίγοι
  choice: kakaunti
  rationale: Malinaw nitong pinananatili ang paghahambing sa maraming aanihin.
- source_word: δεήθητε
  choice: idalangin ninyo
  rationale: Ipinahahayag nito ang pautos na taimtim na paghiling sa Diyos, at mas angkop sa konteksto kaysa sa payak na “hingin.”
- source_word: οὖν
  choice: Kaya
  rationale: Natural nitong ipinakikita na ang panalangin ay tugon sa naunang kalagayan.
- source_word: κύριος
  choice: Panginoon
  rationale: Pinananatili nito ang awtoridad at teolohikal na bigat ng pamagat nang hindi nililinaw nang higit sa sinasabi ng teksto ang tinutukoy nito.
- source_word: ὅπως
  choice: na
  rationale: Natural na ipinakikilala nito sa Tagalog ang nilalaman ng dapat idalangin.
- source_word: ἐκβάλῃ
  choice: magpadala
  rationale: Pinakamalinaw at natural ito sa konteksto ng pagsusugo ng mga manggagawa. Dahil maaaring may mas malakas na diwa ang pandiwang Griyego kaysa karaniwang “magpadala,” pinanatili ang alternatibo sa talababa.
- source_word: εἰς τὸν θερισμὸν αὐτοῦ
  choice: sa kanyang aanihin
  rationale: Pinananatili nito ang pag-aari at talinghaga nang hindi idinaragdag ang “bukid,” na hindi tahasang nasa Griyego.
theological_decisions:
- issue: Ang tinutukoy at puwersa ng “Panginoon ng ani”
  choice: Pinanatili ang talinghagang pamagat na “Panginoon ng ani” nang walang dagdag na paliwanag kung sino ang tinutukoy.
  alternative: Tahasang tukuyin ang Diyos bilang may-ari at namamahala sa misyon, o ipaliwanag na ipinahihiwatig dito ang banal na awtoridad ni Jesus.
  rationale: Malinaw sa teksto na may Panginoong nagmamay-ari ng ani at nagpapadala ng mga manggagawa, ngunit hindi nito tahasang ipinapaliwanag ang mas malawak na implikasyong kristolohikal. Pinananatili ng salin ang teolohikal na tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kanyang” ayon sa pangkalahatang kasalukuyang baybay, at iniwasan ang labis na teknikal o denominasyonal na pananalita.
