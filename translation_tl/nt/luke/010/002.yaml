  source_fidelity: 'Malapit ang diwa sa Griyego: napananatili ang saganang ani, kakaunting manggagawa, ang utos na manalangin, at ang pagmamay-ari ng Panginoon sa ani. Gayunman, ang talababa para sa ἐκβάλῃ ay nangangailangan ng mas tumpak na paglalarawan ng masidhi o mapuwersang nuwang ng pandiwa.'
  naturalness: Natural at marangal ang pangunahing pangungusap. Ang “Manalangin kayo” ay mas tuwirang katumbas ng pautos na δεήθητε kaysa “idalangin ninyo,” habang nananatiling likas sa modernong Filipino.
  terminology: Ang “Panginoon ng ani,” “manggagawa,” at “ani” ay angkop, malinaw, at hindi nagpapataw ng interpretasyong teolohikal. Ginamit ang “kanyang” ayon sa kasalukuyang karaniwang baybay.
