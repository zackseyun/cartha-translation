  text: ⸂Ἐν δὲ⸃ τῷ πορεύεσθαι ⸀αὐτοὺς αὐτὸς εἰσῆλθεν εἰς κώμην τινά· γυνὴ δέ τις ὀνόματι Μάρθα ὑπεδέξατο ⸀αὐτὸν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/038.yaml
  text: As they were traveling along[a], he entered a certain village, and a woman named Martha welcomed him.
translation:
  language: tl
  text: Habang naglalakbay sila, pumasok siya sa isang nayon, at malugod siyang tinanggap[a] ng isang babaeng nagngangalang Marta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, tinanggap siya bilang panauhin. Ipinahihiwatig ng pandiwang Griyego ang magiliw na pagtanggap sa isang panauhin.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῷ πορεύεσθαι αὐτοὺς
  choice: Habang naglalakbay sila
  rationale: Ang ἐν na sinusundan ng articular infinitive ay nagsasaad ng kilos na kasabay ng pangunahing pangyayari. Pinananatili ng “sila” ang maramihang αὐτούς, samantalang hindi na hiwalay na isinalin ang mahinang pang-ugnay na δέ upang maging likas ang daloy sa Filipino.
- source_word: αὐτὸς
  choice: siya
  rationale: Tumutukoy ito kay Jesus at ipinakikitang siya, bukod sa grupong naglalakbay, ang pumasok sa nayon. Hindi idinagdag ang pangalang “Jesus,” na wala sa talata.
- source_word: εἰσῆλθεν
  choice: pumasok
  rationale: Tuwirang katumbas ito ng kilos na pagpasok at natural sa makabagong Filipino.
- source_word: εἰς κώμην τινά
  choice: sa isang nayon
  rationale: Ang κώμη ay “nayon.” Ang τινά ay sapat nang naipahahayag ng “isang”; ang “isang nayon” ay mas natural kaysa “isang tiyak na nayon” at hindi nagpapahiwatig na pinangalanan ang lugar.
- source_word: γυνὴ δέ τις ὀνόματι Μάρθα
  choice: isang babaeng nagngangalang Marta
  rationale: Natural na ipinakikilala nito ang bagong tauhan at pinananatili ang kaniyang pangalan nang hindi pinabibigat ang mahinang pang-ugnay na δέ.
- source_word: ὑπεδέξατο αὐτόν
  choice: malugod siyang tinanggap
  rationale: Ang ὑποδέχομαι ay hindi lamang karaniwang pagtanggap kundi maaaring tumukoy sa magiliw na pagtanggap sa isang panauhin. Inihahatid ng “malugod” ang diwang iyon nang hindi idinaragdag sa pangunahing teksto ang “sa kaniyang bahay,” na hindi tahasang nasa Griyego.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Marta,” ang karaniwang anyo ng pangalang Martha sa Tagalog. Inilagay ang talababa sa pariralang “malugod siyang tinanggap,” na siyang salitang nililinaw nito.
