  source_fidelity: Tumpak sa kabuuan ang di-tiyak na kondisyon (ἣν ἂν), pagpasok sa lungsod, hindi pagtanggap sa mga sugo, paglabas, at pagsasalita sa mga pampublikong lansangan. Gayunman, mas malinaw at mas natural na ihayag sa Filipino ang kondisyong ito sa “kapag pumasok kayo...,” at dapat litaw ang maramihang kausap sa huling pautos.
  naturalness: Nauunawaan ang draft, ngunit ang “sa alinmang lungsod na pasukin ninyo” ay mas mabigat kaysa sa karaniwang modernong Filipino na “kapag pumasok kayo sa alinmang lungsod.” Ang “sabihin” ay maaaring gumana bilang pautos, ngunit ang “sabihin ninyo” ay mas malinaw na tumutugma sa maramihang pautos ng Griyego at sa naunang “kayo.”
  terminology: Ang “lungsod,” “tanggapin,” at “mga lansangan” ay angkop sa marangal ngunit modernong rehistro. Sapat ang “mga lansangan” para sa πλατείας; hindi kailangan ng talababa sapagkat hindi kinakailangang isara ang saklaw sa “liwasan” o “malalapad na daan.”
