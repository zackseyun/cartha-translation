  text: εἰς ἣν δ’ ἂν πόλιν ⸀εἰσέλθητε καὶ μὴ δέχωνται ὑμᾶς, ἐξελθόντες εἰς τὰς πλατείας αὐτῆς εἴπατε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/010.yaml
  text: But whatever city you enter and they do not receive you[a], go out into its streets and say,
translation:
  language: tl
  text: Ngunit kapag pumasok kayo sa alinmang lungsod at hindi nila kayo tanggapin, lumabas kayo sa mga lansangan nito at sabihin ninyo,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν πόλιν
  choice: Ngunit sa alinmang lungsod
  rationale: Ang relasyong konstruksiyon na may ἄν ay di-tiyak at pangkalahatan. Likas na ipinahahayag ng “sa alinmang lungsod” ang anumang sitwasyong maaaring mangyari.
- source_word: εἰσέλθητε
  choice: na pasukin ninyo
  rationale: Ang aorist subjunctive sa di-tiyak na sugnay ay natural na maisasalin bilang “pasukin ninyo,” na malinaw na tumutukoy sa pagpasok sa lungsod.
- source_word: μὴ δέχωνται ὑμᾶς
  choice: hindi nila kayo tanggapin
  rationale: Ang δέχομαι ay tumutukoy sa pagtanggap o malugod na pagtanggap sa mga sugo. Pinananatili ng “tanggapin” ang mas malawak na diwa nang hindi nagdaragdag ng emosyonal na kulay.
- source_word: ἐξελθόντες
  choice: lumabas kayo
  rationale: Ang participle ay nagsasaad ng kilos na nauuna sa pautos na εἴπατε. Ang koordinadong pautos ay natural sa Tagalog at pinananatili ang pagkakasunod ng mga kilos.
- source_word: τὰς πλατείας αὐτῆς
  choice: sa mga lansangan nito
  rationale: Ang πλατεῖα ay maaaring tumukoy sa malalawak at pampublikong lansangan o mga liwasan. Ang “mga lansangan” ay natural sa konteksto ng pampublikong pagpapahayag, habang hindi labis na nililimitahan ang kahulugan.
- source_word: εἴπατε
  choice: sabihin
  rationale: Tuwirang pautos ito ng λέγω na nagpapakilala sa sasabihin sa kasunod na talata; ang “sabihin” ang payak at natural na katumbas.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lansangan” sa halip na mas karaniwang “kalye” upang ipahiwatig ang pampublikong lugar at mapanatili ang dignidad ng rehistro. Walang talababa dahil sapat na malawak ang “lansangan” para sa konteksto; ang ibinigay na English footnote ay tila nakamarka sa maling parirala, kaya hindi ito inangkat nang may maling marker.
