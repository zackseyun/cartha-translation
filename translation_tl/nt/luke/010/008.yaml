base_translation:
  language: en
  yaml_path: translation/nt/luke/010/008.yaml
  text: And into whatever city you enter[a], if they receive you, eat what is set before you[b],
translation:
  language: tl
  text: At sa alinmang lungsod na pasukin ninyo, kung tanggapin nila kayo, kainin ninyo ang anumang ihain sa inyo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς ἣν ἂν πόλιν
  choice: sa alinmang lungsod
  rationale: Ang kamag-anak na panghalip na may ἄν ay nagbibigay ng di-tiyak at pangkalahatang diwa. Likas sa Filipino ang “sa alinmang lungsod” at hindi kailangang tumbasan nang hiwalay ang εἰς dahil naipapahayag na ng pandiwang “pasukin” ang paggalaw paloob.
- source_word: εἰσέρχησθε
  choice: pasukin ninyo
  rationale: Tumpak at natural na ipinahahayag ng “pasukin ninyo” ang pagpasok sa lungsod sa pangkalahatang kondisyong tinutukoy.
- source_word: δέχωνται ὑμᾶς
  choice: kung tanggapin nila kayo
  rationale: Maaaring mangahulugan ang δέχομαι ng pagtanggap o malugod na pagtanggap. Pinananatili ng “tanggapin” ang mas malawak na leksikal na diwa, at natural na ginagawang kondisyon ng “kung” ang sugnay sa Filipino.
- source_word: ἐσθίετε
  choice: kainin ninyo
  rationale: Ang payak na pautos na “kainin ninyo” ay malinaw at likas na katumbas ng pangkasalukuyang pautos sa kontekstong ito.
- source_word: τὰ παρατιθέμενα ὑμῖν
  choice: ang anumang ihain sa inyo
  rationale: Sa konteksto ng pagkain, ang παρατίθημι ay tumutukoy sa paglalagay o paghahain ng pagkain sa harap ng isang tao. Ang “anumang ihain sa inyo” ay natural sa modernong Filipino at pinananatili ang pasibong diwa.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw, magalang, at marangal. Ginamit ang “lungsod” sa halip na mas kolokyal na “siyudad,” at pinanatiling tuwiran ang utos nang walang idinagdag na paliwanag o denominasyonal na pagpapakahulugan.
