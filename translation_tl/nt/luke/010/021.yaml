id: LUK.10.21
reference: Luke 10:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἐν αὐτῇ τῇ ὥρᾳ ἠγαλλιάσατο ⸀τῷ πνεύματι ⸂τῷ ἁγίῳ⸃ καὶ εἶπεν· Ἐξομολογοῦμαί σοι, πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς, ὅτι ἀπέκρυψας ταῦτα ἀπὸ σοφῶν καὶ συνετῶν, καὶ ἀπεκάλυψας αὐτὰ νηπίοις· ναί, ὁ πατήρ, ὅτι οὕτως ⸂εὐδοκία ἐγένετο⸃ ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/021.yaml
  text: In that same hour he rejoiced in the Holy Spirit and said[a], “I praise you, Father, Lord of heaven and earth, because you hid these things from the wise and understanding, and revealed them to little children. Yes, Father[c][b], because this was well-pleasing in your sight.”
translation:
  language: tl
  text: Sa oras ding iyon, nagalak siya sa Banal na Espiritu at sinabi, “Pinupuri[a] kita, Ama, Panginoon ng langit at lupa, sapagkat itinago mo ang mga bagay na ito sa marurunong at may pang-unawa, at inihayag mo ang mga ito sa mga musmos.[b] Oo, Ama, sapagkat ito ang nakalulugod sa iyo.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Nagpapasalamat ako sa iyo.” Sa panalangin, ang pandiwang Griyego ay maaaring magpahayag ng pasasalamat gayundin ng pagpupuri.
    reason: lexical_alternative
  - marker: b
    text: O “mga sanggol.” Malamang na metaporikal ang tawag para sa mga mapagpakumbaba, umaasa sa iba, o walang mataas na katayuan, at hindi lamang para sa literal na maliliit na bata.
    reason: lexical_alternative
  - marker: c
    text: O “sapagkat ganito ang iyong mabuting kalooban” o “sapagkat ito ang iyong ikinalugod.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐν αὐτῇ τῇ ὥρᾳ
  choice: Nang oras ding iyon
  rationale: Likas na idyomang Tagalog na pinananatili ang diin ng αὐτῇ sa mismong panahong iyon.
- source_word: ἠγαλλιάσατο
  choice: nagalak
  rationale: Nagpapahayag ng matinding kagalakan ngunit nananatiling natural at marangal sa makabagong Tagalog.
- source_word: τῷ πνεύματι τῷ ἁγίῳ
  choice: sa Banal na Espiritu
  rationale: Pinakamalinaw na tumutukoy sa Banal na Espiritu ang may-artikulong parirala; hindi sapilitang nililimitahan ng “sa” kung ito ay saklaw o paraan.
- source_word: Ἐξομολογοῦμαί σοι
  choice: Pinupuri kita
  rationale: Sa panalanging ito, ang pandiwa ay nagpapahayag ng pagpupuri o pasasalamat. Pinananatili sa talababa ang lehitimong alternatibong “Nagpapasalamat ako sa iyo.”
- source_word: πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: Ama, Panginoon ng langit at lupa
  rationale: Tuwirang pinananatili ang dalawang katawagang ginagamit sa Ama at ang saklaw ng kanyang kapangyarihan.
- source_word: ἀπέκρυψας … ἀπεκάλυψας
  choice: itinago mo … inihayag mo
  rationale: Pinananatili ang mariing pagsalungat sa pagitan ng pagtatago at paghahayag.
- source_word: σοφῶν καὶ συνετῶν
  choice: marurunong at may pang-unawa
  rationale: Ibinubukod ang karunungan at kakayahang umunawa nang hindi ipinapalagay na pormal na pinag-aralan lamang ang tinutukoy.
- source_word: νηπίοις
  choice: mga musmos
  rationale: Natural na Tagalog para sa maliliit na bata at pinananatili ang larawang maaaring gamitin nang metaporikal para sa mga mapagpakumbaba o walang mataas na katayuan.
- source_word: οὕτως εὐδοκία ἐγένετο ἔμπροσθέν σου
  choice: ito ang nakalugod sa iyong paningin
  rationale: Malapit sa pahayag tungkol sa pagiging kalugod-lugod sa harap ng Ama, habang natural sa Tagalog; hindi tahimik na ginagawang tahasang “kalooban” ang εὐδοκία.
theological_decisions:
- issue: Ang tinutukoy ng τῷ πνεύματι τῷ ἁγίῳ
  choice: Banal na Espiritu
  alternative: kanyang espiritu; sa espiritu
  rationale: Malakas na ipinahihiwatig ng anyong may artikulo sa pangngalan at pang-uri na ang Banal na Espiritu ang tinutukoy, ngunit hindi dinaragdagan ang teksto ng paliwanag na doktrinal.
- issue: Pagpapakahulugan sa εὐδοκία
  choice: ito ang nakalugod sa iyong paningin
  alternative: ganito ang iyong mabuting kalooban; ito ang iyong ikinalugod
  rationale: Pinananatili ng pangunahing salin ang pormang impersonal at ang ἔμπροσθέν σου, samantalang kinikilala sa talababa ang posibleng diwang tumutukoy sa mabuting kalooban o kaluguran ng Ama.
- issue: Paglalarawan sa mga tumanggap ng paghahayag
  choice: mga musmos
  alternative: mga sanggol; maliliit na bata
  rationale: Hindi tahasang pinapalitan ng abstraktong “mapagpakumbaba” ang metaporikal na larawan, kaya nananatili ang tensiyon at lawak ng orihinal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang bokabularyong panrelihiyon gaya ng “Banal na Espiritu” at “Panginoon,” ngunit iniwasan ang lipas o labis na teknikal na pananalita. Ang “mga musmos” ay madaling maunawaan at nagpapanatili sa kongkretong larawan ng Griyego.
