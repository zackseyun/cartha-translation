  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: λέγω ὑμῖν ὅτι Σοδόμοις ἐν τῇ ἡμέρᾳ ἐκείνῃ ἀνεκτότερον ἔσται ἢ τῇ πόλει ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/012.yaml
  text: I tell you[b][a], it will be more bearable for Sodom on that day than for that city.
translation:
  language: tl
  text: Sinasabi ko sa inyo, sa araw na iyon[b], higit na mapagtitiisan ang sasapitin ng Sodoma kaysa sa sasapitin ng lungsod na iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ang “araw na iyon” ay tumutukoy sa araw ng banal na paghuhukom; tahasang sinasabi ito sa ilang kaugnay na sipi.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Sinasabi ko sa inyo
  rationale: Likas at tuwirang pahayag sa modernong Filipino na nagpapanatili sa solemneng diin ng kasalukuyang pandiwa at sa tahasang pakikipag-usap.
- source_word: Σοδόμοις
  choice: ng Sodoma
  rationale: Ginagamit ang pangalan ng lugar bilang metonimiya para sa mga mamamayan nito, gaya ng Griyego, nang hindi labis na nililinaw ang tinutukoy.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: sa araw na iyon
  rationale: Karaniwang pariralang temporal sa Filipino; pinananatili nito ang pahiwatig ng paghuhukom nang hindi idinaragdag sa pangunahing teksto ang salitang wala rito.
- source_word: ἀνεκτότερον
  choice: higit na mapagtitiisan
  rationale: Ipinahahayag ang paghahambing na mas madaling tiisin o kayanin; malinaw ito sa kasalukuyang Filipino at ang alternatibong 'mas matitiis' ay inilagay sa talababa.
- source_word: ἔσται
  choice: ang sasapitin
  rationale: Sa Filipino, kailangang gawing tahasan ang ipinahihiwatig na kalagayan upang maging natural ang pangungusap. Ang 'sasapitin' ay nagpapanatili sa hinaharap at sa konteksto ng hatol nang hindi pinangalanan ang mismong parusa.
- source_word: ἢ τῇ πόλει ἐκείνῃ
  choice: kaysa sa sasapitin ng lungsod na iyon
  rationale: Pinananatili ang paghahambing at ang demonstratibong pagtukoy sa naunang lungsod; inuulit ang 'sasapitin' para sa malinaw at likas na Filipino.
theological_decisions:
- issue: Kahulugan ng “araw na iyon”
  choice: Panatilihin ang “sa araw na iyon” sa pangunahing teksto.
  alternative: sa araw ng paghuhukom
  rationale: Ipinahihiwatig ng konteksto ang araw ng banal na paghuhukom, ngunit 'araw na iyon' lamang ang tahasang nasa talata. Hindi dapat ipasok sa pangunahing teksto ang paglilinaw mula sa mga kaugnay na sipi.
- issue: Di-tahasang paksa ng ἀνεκτότερον ἔσται
  choice: Gamitin ang “ang sasapitin” bilang kinakailangang likas na pagpuno sa Filipino.
  alternative: magiging higit na mapagtitiisan para sa Sodoma
  rationale: Walang tahasang pangngalan ang Griyego; tumutukoy ang paghahambing sa magiging kalagayan o hatol. Iniiwasan ng 'sasapitin' ang mas tiyak na salitang 'parusa' habang ginagawang malinaw ang Filipino.
translation_notes:
  register: Modernong Filipino na tuwiran, marangal, at madaling maunawaan. Ginamit ang “Sodoma” at “lungsod” bilang pamilyar na anyo, at iniwasang idagdag ang “paghuhukom” sa pangunahing teksto upang mapanatili ang eksaktong antas ng pagpapahayag ng Griyego.
