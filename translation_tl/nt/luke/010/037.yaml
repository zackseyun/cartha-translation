  source_fidelity: Tumpak ang salin sa dalawang pahayag. Ang «Ang nagpakita ng awa sa kanya» ay wastong idiomatikong paglalahad ng Ὁ ποιήσας τὸ ἔλεος μετ’ αὐτοῦ, at ang «Humayo ka, at gayon din ang gawin mo» ay pinananatili ang pautos ng Πορεύου at ang paghahambing na ὁμοίως. Ang panghalip na «mo» ay wastong tumutukoy sa kausap at sapat na naghahatid ng personal na hamon ng σὺ nang hindi nagdaragdag ng kahulugan.
  naturalness: Natural, malinaw, at marangal ang modernong Filipino Tagalog. Ang «Humayo ka» ay pormal ngunit angkop sa tuwirang pananalita ni Jesus sa isang salaysay na biblikal. Maayos rin ang daloy ng sagot at kasunod na utos.
