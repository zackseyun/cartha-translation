  text: ὁ δὲ εἶπεν· Ὁ ποιήσας τὸ ἔλεος μετ’ αὐτοῦ. εἶπεν ⸀δὲ αὐτῷ ὁ Ἰησοῦς· Πορεύου καὶ σὺ ποίει ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/037.yaml
  text: And he said, “The one who showed mercy to him.” Then Jesus said to him, “Go, and you do likewise.”
translation:
  language: tl
  text: Sumagot siya, “Ang nagpakita ng awa sa kanya.” Sinabi sa kanya ni Jesus, “Humayo ka, at gayon din ang gawin mo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ ποιήσας τὸ ἔλεος μετ’ αὐτοῦ
  choice: Ang nagpakita ng awa sa kanya
  rationale: Natural na salin ng idyomang Griyego na literal na tumutukoy sa ‘gumawa ng awa’ sa isang tao; pinananatili nitong nakatuon ang sagot sa maawaing pagkilos.
- source_word: Πορεύου
  choice: Humayo ka
  rationale: Tuwirang pautos na may marangal at likas na himig sa makabagong salin ng Kasulatan.
- source_word: καὶ σὺ ποίει ὁμοίως
  choice: at gayon din ang gawin mo
  rationale: Pinananatili ang hayag at madiing σὺ (‘ikaw’) sa pamamagitan ng ‘mo,’ at isinasalin ang patuloy na pautos nang natural nang hindi labis na ipinapakahulugang minsanan o paulit-ulit lamang.
theological_decisions:
- issue: Diin sa personal na pananagutan sa καὶ σὺ
  choice: at gayon din ang gawin mo
  alternative: at gawin mo rin iyon
  rationale: Ang ayos na pinili ay malinaw na nag-uutos sa kausap mismo, habang hindi nagdaragdag ng paliwanag tungkol sa saklaw o teolohikal na batayan ng awa.
translation_notes:
  register: Makabagong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang ‘Humayo’ bilang pormal ngunit karaniwang biblikal na pautos; iniwasan ang mas kolokyal na ‘Sige, umalis ka’ at ang mas mabigat na ‘magpakita ka rin ng awa’ upang mapanatili ang ugnayan sa ‘gayon din.’
