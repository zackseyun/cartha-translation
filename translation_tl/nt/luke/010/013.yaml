  source_fidelity: Tumpak ang estruktura ng kondisyong salungat sa katotohanan, ang pag-uulit ng “nangyari,” ang “mga makapangyarihang gawa,” at ang “matagal na sana silang nagsisi.” Gayunman, ang “may abo sa katawan” ay nagdaragdag ng lokasyong hindi tinutukoy ng Griyego. Sinasabi lamang ng ἐν σάκκῳ καὶ σποδῷ ang larawan ng telang-sako at abo.
  naturalness: Malinaw at angkop ang pangkalahatang rehistro. Ang binagong pariralang “nakaupo, nakasuot ng telang-sako at may abo” ay natural na Filipino at iniiwasan ang di-kinakailangang pagpapakahulugang ang abo ay tiyak na nasa katawan.
  terminology: Ang “Kahabag-habag ka” ay katanggap-tanggap na marangal na panaghoy ng paghatol para sa Οὐαί. Ang “mga makapangyarihang gawa” at “nagsisi” ay angkop at hindi nagpapasok ng labis na interpretasyon. Pinanatili ang karaniwang anyong Corazin, Betsaida, Tiro, at Sidon.
