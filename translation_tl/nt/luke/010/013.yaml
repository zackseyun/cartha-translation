id: LUK.10.13
reference: Luke 10:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Οὐαί σοι, Χοραζίν· οὐαί σοι, Βηθσαϊδά· ὅτι εἰ ἐν Τύρῳ καὶ Σιδῶνι ⸀ἐγενήθησαν αἱ δυνάμεις αἱ γενόμεναι ἐν ὑμῖν, πάλαι ἂν ἐν σάκκῳ καὶ σποδῷ ⸀καθήμενοι μετενόησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/013.yaml
  text: Woe to you[a], Chorazin! Woe to you, Bethsaida! For if the mighty works that happened among you had happened in Tyre and Sidon, long ago they would have repented[b], sitting in sackcloth and ashes.
translation:
  language: tl
  text: “Kahabag-habag ka, Corazin! Kahabag-habag ka, Betsaida! Sapagkat kung nangyari sa Tiro at Sidon ang mga makapangyarihang gawa[a] na nangyari sa inyo, matagal na sana silang nagsisi[b], nakaupo, nakasuot ng telang-sako at may abo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga himala”; sa Griyego, “mga makapangyarihang gawa” o “mga gawa ng kapangyarihan.”
    reason: lexical_alternative
  - marker: b
    text: O “matagal na sana silang nagbago ng isip, nakaupo, nakasuot ng telang-sako at may abo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαί σοι
  choice: Kahabag-habag ka
  rationale: Pinananatili nito ang lakas ng propetikong panaghoy at paghatol. Mas marangal ito kaysa sa kolokyal na “Kawawa ka,” at mas natural kaysa sa literal na “Kasawian sa iyo.”
- source_word: Χοραζίν / Βηθσαϊδά / Τύρῳ / Σιδῶνι
  choice: Corazin / Betsaida / Tiro / Sidon
  rationale: Ginamit ang mga anyo ng pangalan na nakasanayan sa makabagong saling Filipino; pinanatili ang “Corazin” upang hindi labis na lumayo sa pangalang Griyego at sa karaniwang pagkilala rito.
- source_word: δυνάμεις
  choice: mga makapangyarihang gawa
  rationale: Ipinahahayag nito kapwa ang mga gawang naganap at ang kapangyarihang nahayag sa mga iyon, nang hindi agad nililimitahan ang salita sa teknikal na katawagang “mga himala.”
- source_word: ἐγενήθησαν ... αἱ γενόμεναι
  choice: nangyari ... na nangyari
  rationale: Ang pag-uulit ng “nangyari” ay tumutugma sa dalawang anyo ng γίνομαι at nakatuon sa pagganap ng mga pangyayari sa halip na magdagdag ng tahasang gumagawa.
- source_word: ἐν ὑμῖν
  choice: sa inyo
  rationale: Sa pagtukoy sa mga bayang kinakausap at sa mga naninirahan doon, likas sa Filipino ang “sa inyo” at maaari itong mangahulugang sa inyong lugar o kalagitnaan.
- source_word: πάλαι ἂν ... μετενόησαν
  choice: matagal na sana silang nagsisi
  rationale: Malinaw na ipinahahayag ng “sana” ang kondisyong salungat sa aktuwal na nangyari, at inilalagay ng “matagal na” ang pagsisisi sa naunang panahon.
- source_word: καθήμενοι
  choice: habang nakaupo
  rationale: Pinananatili ang malinaw na larawan ng kanilang posisyon sa pagluluksa sa halip na gawing abstraktong pahayag lamang.
- source_word: ἐν σάκκῳ καὶ σποδῷ
  choice: nakadamit ng telang-sako at may abo sa katawan
  rationale: Ginagawang malinaw at natural sa Filipino ang sinaunang larawan ng pagsisisi at pagluluksa, habang pinananatili ang dalawang konkretong sagisag—telang-sako at abo.
- source_word: μετενόησαν
  choice: nagsisi
  rationale: Ito ang natural at kontekstuwal na katumbas ng μετανοέω sa Filipino, na tumutukoy sa tunay na pagbabago ng isip at pagtalikod sa maling landas.
theological_decisions:
- issue: Kalikasan ng δυνάμεις sa ministeryo ni Jesus
  choice: Isinalin bilang “mga makapangyarihang gawa.”
  alternative: “mga himala” o “mga gawa ng kapangyarihan”
  rationale: Binibigyang-diin ng salitang Griyego ang kapangyarihang nahahayag sa mga gawa. Hindi nito itinatanggi na mga himala ang tinutukoy, ngunit iniiwasan nitong gawing mas tiyak ang pangunahing teksto kaysa sa orihinal.
- issue: Kahulugan ng pagsisisi
  choice: Ginamit ang “nagsisi,” na may talababa tungkol sa pagbabago ng isip.
  alternative: “nagbago ng isip” o “tumalikod sa kanilang dating landas”
  rationale: Ang “nagsisi” ang pinakanatural na katumbas sa konteksto, ngunit ipinakikita ng talababa ang mahalagang sangkap ng pagbabago ng pag-iisip nang hindi nilulutas nang labis ang buong saklaw ng salita.
- issue: Larawan ng telang-sako at abo
  choice: Pinanatili sa pangunahing teksto ang konkretong ayos ng pag-upo, pagsusuot ng telang-sako, at paggamit ng abo.
  alternative: “hayagang nagluksa at nagsisi”
  rationale: Pinananatili ng konkretong larawan ang makasaysayan at propetikong anyo ng pahayag at hindi ito pinapalitan ng isang abstraktong paliwanag.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Ang “Kahabag-habag ka” ay may bigat ng propetikong panaghoy at paghatol, samantalang ang natitirang pangungusap ay tuwiran at madaling maunawaan. Iniwasan ang sobrang teknikal o makalumang bokabularyo, ngunit pinanatili ang sinaunang larawan ng telang-sako at abo.
