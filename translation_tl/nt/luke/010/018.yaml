  source_fidelity: Tapat ang draft sa pangunahing diwa at pinananatili nito ang imperpektong aspekto ng Ἐθεώρουν. Gayunman, ang “habang nahuhulog” ay mas malayang pagbubuo at ang puwesto ng “na parang kidlat” pagkatapos ng “langit” ay maaaring bahagyang magpalabo kung ano ang tinutukoy ng paghahambing. Ang rebisyon ay tuwirang ginagawang layon si Satanas ng pagmamasid at malinaw na iniuugnay ang “gaya ng kidlat” sa kanyang pagbagsak.
  naturalness: Mas natural at mas malinaw sa modernong Filipino ang “Pinagmamasdan ko si Satanas na bumabagsak mula sa langit gaya ng kidlat” kaysa “Nagmamasid ako habang nahuhulog si Satanas...”.
  terminology: Ang “Satanas” at “langit” ay wastong mga katawagan. Walang idinaragdag na interpretasyong doktrinal o tiyak na panahon sa pahayag.
