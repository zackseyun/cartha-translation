base_translation:
  language: en
  yaml_path: translation/nt/luke/010/018.yaml
  text: And he said to them[a], “I was watching Satan fall like lightning from heaven.”
translation:
  language: tl
  text: Sinabi niya sa kanila, “Pinagmamasdan ko si Satanas na bumabagsak mula sa langit gaya ng kidlat.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Nakita kong bumagsak si Satanas mula sa langit gaya ng kidlat.” Maaari ring isalin nang payak na “nakita ko” ang pandiwang Griyego, ngunit mas naipapakita ng “pinagmamasdan ko” ang aspektong patuloy na nagaganap.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ αὐτοῖς
  choice: Sinabi niya sa kanila
  rationale: Ang aorist na εἶπεν ay likas na isinasalin bilang payak na nagdaang salaysay. Hindi kailangang tumbasan nang hiwalay ang mahinang pang-ugnay na δέ sa Filipino, sapagkat malinaw at natural ang daloy kahit walang “at” o “ngayon.”
- source_word: Ἐθεώρουν
  choice: Nagmamasid ako
  rationale: Pinananatili ng aspektong nagaganap ng pandiwang imperfect ang diwang patuloy na pagmamasid, sa halip na isang saglit lamang na pagkakita.
- source_word: τὸν Σατανᾶν
  choice: si Satanas
  rationale: Ginamit ang karaniwang anyong Filipino ng personal na katawagan/pangalan, kasama ang pantukoy na “si.”
- source_word: ὡς ἀστραπὴν
  choice: na parang kidlat
  rationale: Natural na paghahambing sa modernong Filipino at tapat sa simile na ipinakikilala ng ὡς.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: mula sa langit
  rationale: Bagaman maaaring mangahulugan ang οὐρανός ng kalangitan o langit, mas angkop dito ang “langit” dahil sa kontekstong may kaugnayan kay Satanas, nang hindi tinutukoy ang eksaktong teolohikal na panahon ng pangyayari.
- source_word: πεσόντα
  choice: habang nahuhulog
  rationale: Ang aorist participle ay tumutukoy sa pagkahulog ni Satanas bilang bagay na namamasdan. Ang “habang nahuhulog” ay natural na kaakibat ng “nagmamasid” at hindi ipinapalagay na tapos na ang pagkahulog bago ang pagmamasid.
theological_decisions:
- issue: Panahon at aspektong tinutukoy ng pahayag ni Jesus tungkol sa pagkahulog ni Satanas
  choice: Nagmamasid ako habang nahuhulog si Satanas mula sa langit na parang kidlat.
  alternative: Nakita kong nahulog si Satanas mula sa langit na parang kidlat.
  rationale: Pinananatili ng salin ang aspektong nagaganap ng imperfect na Ἐθεώρουν at ang larawan ng pagkahulog, ngunit hindi nito ipinapasiya kung tumutukoy ito sa unang pagkahulog ni Satanas, sa epekto ng ministeryo ng mga alagad, o sa isang pangitain ng darating na pagkatalo.
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “nagmamasid” upang mapanatili ang aspektong imperfect, at ang “habang nahuhulog” upang maging malinaw ang ugnayan ng pagmamasid at pagkahulog. Inilagay ang talababa pagkatapos ng buong sipi upang hindi maputol ang sinabi ni Jesus.
