  - severity: low
    issue: Hindi gaanong tuwiran ang “Nagmamasid ako habang nahuhulog si Satanas.”
    rationale: Mas natural na Filipino ang konstruksiyong may tuwirang layon, “Pinagmamasdan ko si Satanas na bumabagsak,” at mas malapit ito sa ugnayan ng θεωρέω at ng participial complement sa Griyego.
