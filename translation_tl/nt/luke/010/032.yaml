  text: ὁμοίως δὲ καὶ ⸀Λευίτης κατὰ τὸν τόπον ἐλθὼν καὶ ἰδὼν ἀντιπαρῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/032.yaml
  text: Likewise[a], a Levite also came to the place, and when he saw him[b], he passed by on the opposite side.
translation:
  language: tl
  text: Gayon din, isa ring Levita ang dumating sa lugar na iyon[a], at nang makita niya ang lalaki, dumaan siya sa kabilang panig[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa dakong iyon” o “sa lugar na iyon.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nilampasan niya ang lalaki.” Ipinahihiwatig ng tambalang pandiwa ang pagdaan sa kabilang panig o ang pag-iwas sa kaniya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοίως
  choice: Gayon din
  rationale: Likas at malinaw nitong iniuugnay ang ginawa ng Levita sa naunang ginawa ng pari.
- source_word: δὲ καὶ
  choice: naman
  rationale: Sa kontekstong ito, banayad na pang-ugnay ang δέ at idinaragdag ng καί ang Levita bilang kahalintulad na halimbawa; natural na naihahayag ito ng “naman” kasunod ng “Gayon din.”
- source_word: Λευίτης
  choice: isang Levita
  rationale: Pinananatili ang makasaysayang katawagan sa kinikilalang pangkat na Judio sa halip na palitan ito ng isang paliwanag na maaaring maging labis na tiyak.
- source_word: κατὰ τὸν τόπον ἐλθὼν
  choice: ang dumating sa lugar na iyon
  rationale: Ipinahahayag nito ang pagdating ng Levita sa mismong lugar na tinutukoy ng salaysay, habang ginagawang likas sa Tagalog ang participial na kayarian.
- source_word: ἰδὼν
  choice: nang makita niya ang lalaki
  rationale: Malinaw na ipinakikita ng “nang” na nauna ang pagkakita sa pangunahing kilos; ang “ang lalaki” ay kinuhang tuwirang tinutukoy mula sa konteksto upang maiwasan ang malabong panghalip sa Tagalog.
- source_word: ἀντιπαρῆλθεν
  choice: dumaan siya sa kabilang panig
  rationale: Pinananatili nito ang pahiwatig ng tambalang pandiwa na dumaan siya sa panig na salungat o malayo sa lalaki, hindi lamang basta nagpatuloy sa paglakad.
theological_decisions:
- issue: Pagkakakilanlang panlipunan at panrelihiyon ng Λευίτης
  choice: Levita
  alternative: tagapaglingkod sa templo; kabilang sa lipi ni Levi
  rationale: Ang transliterasyong “Levita” ay nagpapanatili sa tiyak na makasaysayang pagkakakilanlan ng tauhan at sa pagkakapantay nito sa pari sa salaysay, nang hindi nagdaragdag ng paliwanag o tungkuling hindi tahasang sinasabi sa talata.
- issue: Antas ng sinadyang pag-iwas sa ἀντιπαρῆλθεν
  choice: dumaan siya sa kabilang panig
  alternative: nilampasan niya ang lalaki
  rationale: Ipinahihiwatig ng tambalang anyo ang pagdaan sa tapat o kabilang panig, ngunit hindi dinaragdagan ng teksto ang motibo o damdamin ng Levita; kaya inilalarawan ang kilos nang hindi tahasang sinasabing sinadya niyang umiwas.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Levita” bilang nakasanayang makasaysayang katawagan. Inilagay ang [a] pagkatapos ng pariralang tinutukoy nito, hindi pagkatapos ng “Gayon din,” upang tumugma ang talababa sa κατὰ τὸν τόπον.
