base_translation:
  language: en
  yaml_path: translation/nt/luke/010/007.yaml
  text: Stay in that same house[a], eating and drinking what they provide, for the worker is worthy of his wages. Do not move from house to house.
translation:
  language: tl
  text: Manatili kayo sa mismong bahay na iyon, habang kumakain at umiinom ng anumang ibinibigay nila, sapagkat ang manggagawa ay karapat-dapat sa kanyang sahod.[a] Huwag kayong lumipat mula sa isang bahay tungo sa iba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sapagkat ang manggagawa ay karapat-dapat sa sahod na nararapat sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν αὐτῇ δὲ τῇ οἰκίᾳ μένετε
  choice: Manatili kayo sa bahay na iyon
  rationale: Ang “bahay na iyon” ay tumutukoy sa naunang bahay na tumanggap sa kanila, at ipinahihiwatig ng kasalukuyang pautos ang patuloy na pananatili roon.
- source_word: ἐσθίοντες καὶ πίνοντες τὰ παρ’ αὐτῶν
  choice: at kainin at inumin ang anumang ibinibigay nila
  rationale: Inilalarawan ng mga participle ang kasabay na gawain habang nananatili sila. Ang “anumang ibinibigay nila” ay likas na Filipino para sa mga pagkaing at inuming inilalaan ng mga nagpapatuloy.
- source_word: ἄξιος γὰρ ὁ ἐργάτης τοῦ μισθοῦ αὐτοῦ
  choice: sapagkat karapat-dapat tumanggap ng kanyang sahod ang manggagawa
  rationale: Ang μισθός ay kabayaran sa paggawa, kaya “sahod” ang malinaw na katumbas. Idinagdag ang “tumanggap” upang maging natural sa Filipino ang idiomang ἄξιος + genitive nang hindi binabago ang diwa.
- source_word: μὴ μεταβαίνετε ἐξ οἰκίας εἰς οἰκίαν
  choice: Huwag kayong lumipat-lipat sa mga bahay
  rationale: Ipinagbabawal ang pagpapalit-palit ng tutuluyan. Likas at malinaw sa modernong Filipino ang “lumipat-lipat sa mga bahay.”
theological_decisions:
- issue: Kasariang pambalarila sa τοῦ μισθοῦ αὐτοῦ
  choice: kanyang sahod
  alternative: sahod na nararapat sa manggagawa
  rationale: Pinananatili ng “kanyang” ang pang-isahang pagtukoy ng αὐτοῦ, ngunit gaya ng karaniwang gamit sa Filipino, hindi nito kailangang tukuyin ang kasarian. Nananatiling pangkalahatan ang kasabihan.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang maramihang “kayo” ayon sa konteksto ng pagsusugo sa mga alagad. Iniwasan ang mas teknikal na “kabayaran” pabor sa karaniwang “sahod.”
