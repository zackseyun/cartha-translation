  text: ⸀πάντα μοι παρεδόθη ὑπὸ τοῦ πατρός μου, καὶ οὐδεὶς γινώσκει τίς ἐστιν ὁ υἱὸς εἰ μὴ ὁ πατήρ, καὶ τίς ἐστιν ὁ πατὴρ εἰ μὴ ὁ υἱὸς καὶ ᾧ ⸀ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/022.yaml
  text: All things have been handed over to me by my Father[a], and no one knows who the Son is except the Father[b], and who the Father is except the Son and anyone to whom the Son chooses to reveal him.
translation:
  language: tl
  text: Ibinigay na sa akin ng aking Ama ang lahat ng bagay,[a] at walang sinumang nakaaalam kung sino ang Anak maliban sa Ama, at walang nakaaalam kung sino ang Ama maliban sa Anak at sa sinumang piliin[b] ng Anak na paghahayagan niya kung sino ang Ama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Ibinigay na sa akin ng aking Ama ang lahat.”
    reason: lexical_alternative
  - marker: b
    text: O, “loobin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: ang lahat ng bagay
  rationale: Pinananatili nito ang malawak at komprehensibong saklaw ng pangmaramihang neuter na πάντα; ang “ang lahat” ay maaari rin ngunit bahagyang mas di-tiyak.
- source_word: μοι παρεδόθη ὑπὸ τοῦ πατρός μου
  choice: Ibinigay na sa akin ng aking Ama
  rationale: Likas sa modernong Tagalog ang aktibong anyo at malinaw nitong napapanatili ang Ama bilang gumagawa at ang Anak bilang tumatanggap. Ipinahihiwatig ng “na” ang naganap na pagbibigay na may nananatiling bisa.
- source_word: γινώσκει
  choice: nakaaalam
  rationale: Akma ito sa kasunod na sugnay na “kung sino,” nang hindi idinaragdag ang interpretatibong “lubos” o “tunay.”
- source_word: τίς ἐστιν ὁ υἱός / τίς ἐστιν ὁ πατήρ
  choice: kung sino ang Anak / kung sino ang Ama
  rationale: Tuwirang pinananatili ang personal at pang-identidad na anyo ng mga sugnay sa Griyego.
- source_word: εἰ μὴ
  choice: maliban sa
  rationale: Malinaw at likas na ipinapahayag ang eksklusibong kataliwasan sa dalawang magkatugmang sugnay.
- source_word: ᾧ ἐὰν βούληται ὁ υἱός
  choice: sa sinumang piliin ng Anak
  rationale: Ipinapakita ng “sinuman” ang di-tiyak na tatanggap, samantalang pinananatili ng “piliin” ang kusang pagpapasya ng Anak nang hindi gumagamit ng makalumang pananalita.
- source_word: ἀποκαλύψαι
  choice: pagpahayagan niya kung sino ang Ama
  rationale: Ginagawang malinaw ang ipinahihiwatig na layon ng pandiwa—ang Ama—at inuugnay ito sa naunang “kung sino ang Ama,” nang hindi nagdaragdag ng doktrinal na paliwanag.
theological_decisions:
- issue: Natatangi at magkatuwang na pagkakilala ng Ama at ng Anak
  choice: Pinanatili ang magkatugmang pahayag na walang nakaaalam kung sino ang Anak maliban sa Ama at kung sino ang Ama maliban sa Anak.
  alternative: Dagdagan ng “lubos” o “tunay” upang tahasang tukuyin ang ganap na pagkakilala.
  rationale: Mabigat na ang teolohikal na pahayag sa mismong balangkas ng talata. Ang pagdaragdag ng pang-abay ay magpapasidhi sa kahulugan nang higit sa tahasang sinasabi ng γινώσκει.
- issue: Kapasyahan ng Anak sa paghahayag sa Ama
  choice: Isinalin ang βούληται bilang “piliin” at pinanatili ang Anak bilang nagpapasya at naghahayag.
  alternative: “loobin” o “naisin”
  rationale: Ang “piliin” ay natural sa kasalukuyang Tagalog at malinaw na naghahayag ng kusang pagpapasya, samantalang ang “naisin” ay maaaring magpahina sa aspektong pasiya at ang “loobin” ay mas pormal at maaaring magkaroon ng dagdag na tradisyunal na himig.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “nakaaalam” sa halip na kolokyal na “alam” upang bumagay sa pormal na bigat ng pahayag, ngunit iniwasan ang makaluma o sobrang teknikal na pananalita. Ang pag-uulit ng “kung sino ang Ama” sa hulihan ay nagpapalinaw sa ipinahihiwatig na layon ng ἀποκαλύψαι at umiiwas sa malabong panghalip.
