  to: Ibinigay na sa akin ng aking Ama ang lahat ng bagay,[a] at walang sinumang nakaaalam kung sino ang Anak maliban sa Ama, at walang nakaaalam kung sino ang Ama maliban sa Anak at sa sinumang piliin[b] ng Anak na paghahayagan niya kung sino ang Ama.
