  text: Ὁ δὲ θέλων ⸀δικαιῶσαι ἑαυτὸν εἶπεν πρὸς τὸν Ἰησοῦν· Καὶ τίς ἐστίν μου πλησίον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/029.yaml
  text: But he[a], wanting to justify himself, said to Jesus, “And who is my neighbor?”
translation:
  language: tl
  text: Ngunit, dahil nais niyang patunayang nasa tama siya, sinabi niya kay Jesus, “At sino ang kapwa ko?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “At sino ang maituturing na kapwa ko?”
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλων
  choice: sa kagustuhan niyang
  rationale: Ipinahahayag ng kasalukuyang participle ang hangarin o motibo ng lalaki; natural itong pakinggan sa makabagong Filipino.
- source_word: δικαιῶσαι ἑαυτὸν
  choice: ipakitang tama siya
  rationale: Sa konteksto, tumutukoy ito sa pagtatangkang patunayang nasa tama siya, hindi kinakailangang sa teknikal na teolohikal na diwa ng pagpapawalang-sala. Malinaw at natural ang parirala sa Filipino.
- source_word: εἶπεν πρὸς τὸν Ἰησοῦν
  choice: sinabi niya kay Jesus
  rationale: Tuwiran at likas na salin ng karaniwang pormulang pasalaysay.
- source_word: Καὶ
  choice: At
  rationale: Pinananatili ang pangatnig na nag-uugnay sa tanong sa naunang usapan.
- source_word: τίς ἐστίν μου πλησίον
  choice: sino ang kapwa ko
  rationale: Ang πλησίον ay ginagamit bilang pangngalan na nangangahulugang “kapwa” o “neighbor.” Pinananatili ng salin ang tuwiran at bahagyang malabong saklaw ng tanong.
theological_decisions:
- issue: Diwa ng δικαιῶσαι ἑαυτόν
  choice: Pagtatangkang ipakitang tama siya
  alternative: Pangatwiranan ang sarili; patunayang matuwid ang sarili
  rationale: Ang tagpo ay isang usaping legal at etikal. Iniiwasan ng salin ang awtomatikong pagpasok ng teknikal na doktrina ng justification, habang pinananatili ang pahiwatig ng sariling pagpapatunay.
- issue: Saklaw ng πλησίον
  choice: kapwa ko
  alternative: maituturing kong kapwa
  rationale: Hindi tahasang nilulutas ng pangunahing teksto kung ang tanong ay tungkol sa pagkakakilanlan o sa kung sino ang saklaw ng tungkuling ibigin. Inilalagay sa talababa ang mas interpretibong alternatibo.
translation_notes:
  register: Makabago, dignificado, at madaling maunawaan. Ginamit ang “ipakitang tama siya” sa halip na mas teknikal o matigas na “bigyang-katwiran ang sarili,” at “kapwa ko” upang mapanatili ang ugnayan sa utos na ibigin ang kapwa.
