  source_fidelity: 'Tumpak ang pangunahing diwa: ang lalaki ay may layuning ipakitang siya ang nasa tama at nagtanong kay Jesus kung sino ang kaniyang kapwa. Gayunman, mas tuwirang naipahahayag ng “dahil nais niyang patunayang nasa tama siya” ang motibong ipinahihiwatig ng θέλων δικαιῶσαι ἑαυτόν kaysa sa medyo matigas na “sa kagustuhan niyang ipakitang tama siya.”'
  naturalness: Nauunawaan at karaniwang Filipino ang draft, ngunit hindi gaanong likas ang pambungad na “sa kagustuhan niyang.” Ang binagong sugnay na “dahil nais niyang patunayang nasa tama siya” ay mas daloy-singaw sa modernong Tagalog habang nananatiling marangal ang rehistro.
