id: LUK.10.3
reference: Luke 10:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὑπάγετε· ⸀ἰδοὺ ἀποστέλλω ὑμᾶς ὡς ἄρνας ἐν μέσῳ λύκων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/003.yaml
  text: Go[a]; behold[b], I am sending you out as lambs in the midst of wolves.
translation:
  language: tl
  text: Humayo kayo. Tingnan ninyo, isinusugo ko kayo na gaya ng mga kordero sa gitna ng mga lobo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπάγετε
  choice: Humayo kayo
  rationale: Pautos na maramihan. Ang “Humayo kayo” ay maikli, marangal, at natural bilang utos sa pagsusugo.
- source_word: ἰδοὺ
  choice: Tingnan ninyo
  rationale: Pantawag-pansin ito sa susunod na pahayag. Pinananatili ng “Tingnan ninyo” ang puwersang deiktiko nang hindi gumagamit ng makalumang “Narito.”
- source_word: ἀποστέλλω ὑμᾶς
  choice: isinusugo ko kayo
  rationale: Ipinahahayag ng pangkasalukuyang anyo ang ginagawa ni Jesus sa sandaling iyon; ang “isinasugo/isinusugo” ay likas sa konteksto ng misyon. Pinili ang “isinusugo” bilang karaniwang anyong Filipino.
- source_word: ὡς
  choice: na gaya ng
  rationale: Malinaw na naghahayag ng paghahambing at hindi ng literal na pagkakakilanlan.
- source_word: ἄρνας
  choice: mga kordero
  rationale: Tiyak na “mga kordero,” hindi pangkalahatang “mga tupa,” kaya napapanatili ang larawan ng pagiging mahina at lantad sa panganib.
- source_word: ἐν μέσῳ λύκων
  choice: sa gitna ng mga lobo
  rationale: Malapit sa literal na kahulugan at likas din sa modernong Tagalog; pinananatili nito ang larawang napaliligiran ng panganib.
theological_decisions:
- issue: Larawang hayop para sa pagsusugo sa mga alagad
  choice: gaya ng mga kordero sa gitna ng mga lobo
  alternative: gaya ng mga tupa sa gitna ng mga lobo
  rationale: Ang Griyego ay ἄρνας, “mga kordero,” hindi πρόβατα, “mga tupa.” Hindi ito pinantay sa kahawig na pananalita sa ibang talata, kaya nananatili ang mas matinding larawan ng kahinaan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang tahasang pangmaramihang “kayo/ninyo.” Walang footnote dahil kayang panatilihin sa pangunahing teksto ang tiyak na “mga kordero” at ang literal ngunit natural na “sa gitna ng mga lobo.”
