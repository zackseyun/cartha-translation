  source_fidelity: 'Tumpak ang salin sa SBLGNT: ang maramihang pautos na ὑπάγετε ay naipahayag sa “Humayo kayo”; ang ἰδοὺ sa “Tingnan ninyo”; ang pangkasalukuyang ἀποστέλλω sa “isinusugo ko kayo”; at ang simile na ὡς ἄρνας ἐν μέσῳ λύκων sa “na gaya ng mga kordero sa gitna ng mga lobo.” Napanatili ang tiyak na ‘kordero,’ hindi ‘tupa.’'
  naturalness: Natural at malinaw ang modernong Filipino Tagalog, na may marangal na rehistrong angkop sa pananalita ni Jesus. Ang tahasang “kayo/ninyo” ay wastong nagpapakita ng pangmaramihang kausap. Ang “sa gitna ng mga lobo” ay parehong natural at malapit sa lakas ng Griyego.
  terminology: Ang “isinusugo” ay angkop sa konteksto ng pagsusugo at hindi labis na teknikal. Ang “mga kordero” at “mga lobo” ay malinaw, karaniwan, at pinananatili ang metaporang kahinaan sa harap ng panganib. Walang kinakailangang talababa; ang mga dating English audit footnote ay hindi dapat ilipat sapagkat hindi kinakailangan sa saling Tagalog at may hindi magkatugmang mga angkla sa English record.
